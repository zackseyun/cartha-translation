reference: 2 Kings 4:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: tl
  text: 'Isang babae mula sa mga asawa ng mga anak ng mga propeta ang dumaing kay Eliseo: “Ang asawa kong lingkod mo ay namatay na. Alam mong ang lingkod mo ay may takot kay Yahweh. Dumating na ang pinagkakautangan namin upang kunin ang dalawa kong anak[a] bilang mga alipin niya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “dalawa kong anak na lalaki.” Ang Hebreo ay literal na “dalawa kong anak,” na maaaring unawain nang mas tiyak batay sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: Isang babae
  rationale: Ipinakikilala nito ang isang di-tiyak na babae sa simula ng bagong tagpo. Hindi dinagdagan ng tahasang panandang pamanahon ang panimulang וְ.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: mula sa mga asawa ng mga anak ng mga propeta
  rationale: Pinananatili ang natatanging katawagang Hebreo na “mga anak ng mga propeta” para sa pamayanang propetiko, sa halip na palitan agad ng interpretatibong katawagan.
- source_word: צָעֲקָה
  choice: dumaing
  rationale: Natural na ipinahahayag sa Filipino ang apurahang paghingi ng tulong at matinding pagkabalisa ng babae.
- source_word: עַבְדְּךָ אִישִׁי
  choice: ang lingkod mo na asawa ko
  rationale: 'Pinananatiling hayag ang dalawang kaugnayan ng namatay: lingkod ni Eliseo at asawa ng nagsasalita.'
- source_word: מֵת
  choice: namatay na
  rationale: Ipinakikita ang naganap nang kamatayan na may kasalukuyang mabigat na bunga.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: ay may takot kay Yahweh
  rationale: Pinananatili ang biblikal na idyoma ng pagkatakot sa Diyos nang hindi ito pinapakahulugan lamang bilang paggalang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הַנֹּשֶׁה
  choice: ang pinagkakautangan namin
  rationale: Ito ang natural at madaling maunawaang katawagan sa Filipino para sa taong may karapatang maningil ng utang; ipinahihiwatig ng konteksto na utang ito ng sambahayan.
- source_word: בָּא לָקַחַת
  choice: dumating na ... upang kunin
  rationale: Ipinahahayag ang pagdating na may kasalukuyan at nagbabantang layunin.
- source_word: שְׁנֵי יְלָדַי
  choice: ang dalawa kong anak
  rationale: Hindi nililimitahan sa “mga anak na lalaki” sapagkat ang salitang Hebreo ay maaaring tumukoy sa mga anak sa pangkalahatan.
- source_word: לַעֲבָדִים
  choice: gawing mga alipin
  rationale: Sa konteksto ng sapilitang paglilingkod dahil sa utang, mas malinaw na naihahatid ng “mga alipin” ang pagkawala ng kalayaan kaysa sa karaniwang “mga lingkod.”
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng pagkatakot kay Yahweh
  choice: may takot kay Yahweh
  alternative: gumagalang kay Yahweh
  rationale: Pinananatili ang lawak at bigat ng idyomang ירא את־יהוה, na maaaring sumaklaw sa paggalang, pagsamba, at tapat na pamumuhay, nang hindi ito pinaiikli sa isang pakahulugan lamang.
- issue: Kalagayan ng mga anak na kukunin dahil sa utang
  choice: mga alipin
  alternative: mga lingkod
  rationale: Ang konteksto ay sapilitang pagkuha sa mga anak bilang debt servants. Ang “mga alipin” ay naghahayag ng kalubhaan nito, ngunit hindi nito ipinapalagay ang isang partikular na anyo ng panghabambuhay na pagkaalipin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang katawagang “mga anak ng mga propeta” dahil mahalaga ang anyong Hebreo, samantalang ginawang natural ang pagsusumamo at pananalita ng balo.
