  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: tl
  text: Isang araw, dumating siya roon, lumihis patungo sa silid sa itaas, at nahiga roon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at natulog roon.” Maaaring mangahulugan ang pandiwang Hebreo na humiga o matulog; hindi hinihingi ng konteksto ang mas tiyak na kahulugang “natulog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Isang araw
  rationale: Likas na panandang nagsasalaysay ng isang pagkakataon; pinananatili nito ang diwang temporal nang hindi mekanikal na ginagaya ang pormulang Hebreo.
- source_word: וַיָּבֹא שָׁמָּה
  choice: pumunta siya roon
  rationale: Ang בוא ay karaniwang ‘pumaroon/pumunta’ o ‘dumating.’ Sa pananaw ng salaysay, natural sa modernong Tagalog ang ‘pumunta siya roon,’ at pinananatili ng ‘roon’ ang שָׁמָּה.
- source_word: וַיָּסַר
  choice: pumasok
  rationale: Sa kontekstong ito, ang paglihis niya ng landas ay patungo at papasok sa silid na inihanda para sa kaniya. Mas natural sa Tagalog ang ‘pumasok’ kaysa literal na ‘lumihis,’ bagaman bahagyang ipinahihiwatig na nito ang bungang kilos.
- source_word: אֶל הָעֲלִיָּה
  choice: sa silid sa itaas
  rationale: Ang עֲלִיָּה ay isang silid sa mataas o itaas na bahagi ng bahay. Malinaw at karaniwan ang ‘silid sa itaas’ sa modernong Tagalog.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: at nahiga roon
  rationale: Maaaring tumukoy ang שׁכב sa paghiga o pagtulog. Pinananatili ng ‘nahiga’ ang mas malawak at hindi labis na tiyak na kahulugan.
