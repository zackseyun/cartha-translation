  to: Sinabi ni Eliseo sa kanya, “Ano ang gagawin ko para sa iyo? Sabihin mo sa akin, ano ang mayroon ka sa bahay?” Sumagot siya, “Ang lingkod mong babae ay walang kahit ano sa bahay maliban sa isang sisidlan ng langis.[a]”
  rationale: Inayos ang ayos ng unang pangungusap para sa mas natural na Tagalog at pinalitan ang “walang anuman” ng “walang kahit ano” para sa mas malinaw na mariing pagkakaila. Walang binago sa saklaw ng kahulugan, sa magalang na pagpapakilala ng babae sa sarili, o sa maingat na pagtrato sa hindi tiyak na anyo ng sisidlan.
