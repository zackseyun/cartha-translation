  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: tl
  text: Sinabi ni Eliseo sa kanya, “Ano ang gagawin ko para sa iyo? Sabihin mo sa akin, ano ang mayroon ka sa bahay?” Sumagot siya, “Ang lingkod mong babae ay walang kahit ano sa bahay maliban sa isang sisidlan ng langis.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang banga ng langis” o “isang maliit na lalagyan ng langis.” Hindi tiyak ang eksaktong anyo ng sisidlang tinutukoy ng Hebreong אָסוּךְ.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: Ano ang gagawin ko para sa iyo?
  rationale: Pinananatili nito ang deliberatibong diwa ng imperfect—itinatanong ni Eliseo kung ano ang dapat niyang gawin para sa babae—at natural ito sa makabagong Tagalog.
- source_word: הַגִּידִי לִי
  choice: Sabihin mo sa akin
  rationale: Tuwirang katumbas ito ng pambabaeng pautos na may unang-panauhang layon; hindi dinagdagan ng “pakiusap” sapagkat hindi iyon tahasang nasa Hebreo.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: ano ang mayroon ka sa bahay?
  rationale: Likas na ipinahahayag sa Tagalog bilang pag-aari ang Hebreong eksistensiyal na יֵשׁ na may ל, habang pinananatili ang kongkretong tagpuan sa bahay.
- source_word: לְשִׁפְחָתְךָ
  choice: Ang lingkod mong babae
  rationale: Pinananatili ang pambabaeng kasarian ng שִׁפְחָה at ang magalang at mapagpakumbabang pagtukoy ng babae sa sarili bilang lingkod ni Eliseo, nang hindi gumagamit ng makalumang pananalita.
- source_word: אֵין ... כֹל
  choice: walang anuman
  rationale: Natural na ipinahahayag ng “walang anuman” ang malawak at mariing pagkakaila ng Hebreong parirala nang hindi nagiging mabigat ang Tagalog.
- source_word: כִּי אִם
  choice: maliban sa
  rationale: Malinaw nitong ipinakikilala ang nag-iisang eksepsiyon sa sinabi niyang kawalan.
- source_word: אָסוּךְ שָׁמֶן
  choice: isang sisidlan ng langis
  rationale: Hindi tiyak ang eksaktong anyo ng bihirang salitang אָסוּךְ. Ang “sisidlan” ay tumpak ngunit hindi labis na nagpapasiya kung ito ay banga, prasko, o maliit na lalagyan.
