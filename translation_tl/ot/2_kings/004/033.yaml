  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: tl
  text: Pumasok siya, isinara ang pinto sa likuran nilang dalawa[a], at nanalangin kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “isinara niya ang pinto upang silang dalawa lamang ang nasa loob.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pumasok siya
  rationale: Likas na salaysay sa Tagalog para sa pagpasok ni Eliseo sa silid; malinaw nitong ipinahihiwatig ang pagkilos papasok.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: isinara ang pinto
  rationale: Tuwirang katumbas ng pandiwa at tiyak na pangngalan, at karaniwang paraan ng pagsasabi sa modernong Tagalog.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: sa kanilang dalawa
  rationale: Kasunod ng 'isinara ang pinto,' ipinahihiwatig nitong nakakulong sa loob ang dalawang tinutukoy. Pinananatili ng talababa ang posibleng diwa na isinara ang pinto sa likuran nila.
- source_word: וַיִּתְפַּלֵּל
  choice: at nanalangin
  rationale: Likas at tumpak na katumbas ng hitpael ng פלל sa sunod-sunod na salaysay.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ang אֶל kasama ng 'manalangin' ay likas na isinasalin na 'kay'; pinananatili ang personal na pangalang banal na יהוה bilang Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ang 'sa kanilang dalawa' ay sadyang maikli at bahagyang ambiguwoso gaya ng Hebreo, habang nililinaw sa talababa ang kontekstuwaI na diwa.
