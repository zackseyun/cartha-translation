base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: tl
  text: Pumunta siya sa tao ng Diyos sa Bundok Carmel. Nang makita siya ng tao ng Diyos mula sa malayo[a], sinabi niya kay Gehazi, na kanyang tagapaglingkod, “Tingnan mo, ang babaeng Sunamitang iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa may kalayuan.” Ipinahihiwatig ng pananalitang Hebreo na nakita niya ang babae habang malayo pa ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Kaya umalis siya at pumunta
  rationale: Pinananatili ang sunod-sunod na kilos ng salaysay; natural sa Filipino ang “umalis ... at pumunta” at naiiwasan ang di-likas na literal na pag-uulit ng pumunta/dumating.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang literal na “lalaki ng Diyos” ay hindi likas at maaaring malabo sa modernong Filipino. Ang “lingkod ng Diyos” ay dignified at malinaw na katawagan, nang hindi tahasang pinapalitan ito ng interpretatibong “propeta.”
- source_word: אֶל הַר הַכַּרְמֶל
  choice: sa Bundok Carmel
  rationale: Ipinahihiwatig ng parirala ang kinaroroonan ng lingkod ng Diyos at ang patutunguhan ng babae. Ang “sa Bundok Carmel” ang natural na anyo sa Filipino.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Nang makita
  rationale: Ang konstruksiyon ay nagpapakilala ng temporal na sugnay; ang “Nang makita” ay maayos at hindi mabigat sa modernong salaysay.
- source_word: מִנֶּגֶד
  choice: mula sa malayo
  rationale: Sa konteksto, nakita niya ang babae habang may kalayuan pa ito. Pinananatili ng talababa ang malapit na alternatibong pagpapahayag.
- source_word: נַעֲרוֹ
  choice: kanyang tagapaglingkod
  rationale: Bagaman literal na “kanyang binata,” tumutukoy rito ang salita sa tungkulin ni Gehazi bilang personal na alalay o tagapaglingkod.
- source_word: הִנֵּה
  choice: Tingnan mo, naroon
  rationale: Ipinahahayag ang pansin at pagturo ng הִנֵּה sa natural na modernong Filipino.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: ang babaeng Sunamita
  rationale: Pinananatili ang heograpikong katawagan at, sa pamamagitan ng “naroon,” ang demonstratibong puwersa na tumutukoy sa babaeng nasa malayo.
theological_decisions:
- issue: Pagpapahayag ng titulong אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: lalaki ng Diyos; propeta ng Diyos
  rationale: Iniiwasan ang di-likas at posibleng mapanlinlang na “lalaki ng Diyos,” ngunit hindi rin tahasang ipinapakahulugan ang titulo bilang “propeta,” kahit propeta si Eliseo. Ang “lingkod ng Diyos” ang pinakamalinaw na functional equivalent sa kasalukuyang Filipino.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “tagapaglingkod” para sa papel ni Gehazi at “lingkod ng Diyos” bilang likas na salin ng tradisyonal na titulong Hebreo. Pinanatili ang pangalang-lugar na “Carmel” at ang katawagang “Sunamita.”
