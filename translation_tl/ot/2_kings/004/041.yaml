  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Magdala kayo ng harina.” Inihagis niya iyon sa palayok at sinabi, “Isalin mo ito para sa mga tao[a] upang makakain sila.” At walang anumang nakapipinsalang bagay sa palayok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Ibuhos mo para sa mga tao.” Dito, tumutukoy ang pandiwa sa pagsasalin o paghahain ng pagkaing nasa palayok.
    reason: lexical_alternative
  - marker: b
    text: Mas literal, “walang masamang bagay sa palayok”; ibig sabihin, hindi nakapipinsala ang pagkaing nasa palayok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Isinasaad ng waw-consecutive ang pagsulong ng salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: וּקְחוּ
  choice: Magdala kayo
  rationale: Pautos na maramihan ang anyo. Ang “magdala” ang pinakanatural sa konteksto ng pagkuha ng harina upang gamitin agad.
- source_word: קֶמַח
  choice: harina
  rationale: Karaniwan at malinaw na modernong salin para sa harina o pinong giniling na butil.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: Inihagis niya iyon sa palayok
  rationale: Pinananatili ng “inihagis” ang kongkretong kilos ng שלך at ng “sa palayok” ang direksiyon ng kilos.
- source_word: צַק לָעָם
  choice: Isalin mo ito para sa mga tao
  rationale: Ang יצק ay literal na tumutukoy sa pagbuhos o pagsasalin. Ang “isalin” ay angkop sa pagkaing nasa palayok at pinananatili rin ang pautos na isahan ng Hebreo; ipinahiwatig ng konteksto ang layon na “ito.”
- source_word: וְיֹאכֵלוּ
  choice: upang makakain sila
  rationale: Natural na ipinahahayag nito ang layunin o inaasahang resulta ng utos nang hindi binabago ang diwa.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: At wala nang anumang nakapipinsalang bagay sa palayok
  rationale: Sa konteksto ng mapanganib na nilaga, praktikal na kapinsalaan ang tinutukoy ng רָע, hindi moral na kasamaan. Pinananatili ng “bagay” ang דָבָר, at ipinahihiwatig ng “wala nang” ang pagbabago sa kalagayan ng pagkain.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Filipino. Pinanatili ang pagbabago mula sa pautos na maramihan na “Magdala kayo” tungo sa pautos na isahan na “Isalin mo,” ayon sa mga anyong Hebreo. Inilagay ang mga panandang talababa sa mismong mga pariralang kanilang nililinaw.
