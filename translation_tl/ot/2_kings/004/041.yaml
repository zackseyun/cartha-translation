  to: Pagkatapos ay sinabi niya, “Magdala kayo ng harina.” Inihagis niya iyon sa palayok at sinabi, “Isalin mo ito para sa mga tao[a] upang makakain sila.” At walang anumang nakapipinsalang bagay sa palayok.[b]
