  text: וַ/תָּבֹ֞א אֶל אִ֤ישׁ הָֽ/אֱלֹהִים֙ אֶל הָ/הָ֔ר וַֽ/תַּחֲזֵ֖ק בְּ/רַגְלָ֑י/ו וַ/יִּגַּ֨שׁ גֵּֽיחֲזִ֜י לְ/הָדְפָ֗/הּ וַ/יֹּאמֶר֩ אִ֨ישׁ הָ/אֱלֹהִ֤ים הַרְפֵּֽה לָ/הּ֙ כִּֽי נַפְשָׁ֣/הּ מָֽרָה לָ֔/הּ וַֽ/יהוָה֙ הֶעְלִ֣ים מִמֶּ֔/נִּי וְ/לֹ֥א הִגִּ֖יד לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: tl
  text: Nang makarating siya sa tao ng Diyos sa bundok, mahigpit siyang kumapit sa mga paa ng tao ng Diyos. Lumapit si Gehazi upang itulak siya palayo, ngunit sinabi ng tao ng Diyos, “Hayaan mo siya, sapagkat punô ng pait ang kanyang kalooban[a]. Inilihim ito sa akin ni Yahweh at hindi niya sinabi sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mapait sa kanya ang kanyang nefesh,” isang idyomang nagsasaad ng matinding dalamhati sa kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Karaniwang tawag ito sa isang propeta sa salaysay ng Mga Hari. Ang literal na “tao ng Diyos” ay posible ngunit hindi gaanong likas sa modernong Tagalog; pinananatili ng “lingkod ng Diyos” ang anyong titulo nang hindi simpleng pinapalitan ng “propeta.”
- source_word: אֶל הָהָר
  choice: sa bundok
  rationale: Likas na ipinahahayag sa Tagalog ang lugar na narating niya, nang hindi labis na tinutukoy kung nasa ibabaw o paanan ng bundok.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: mahigpit niyang hinawakan ang mga paa nito
  rationale: Ang חזק na may ב ay nagpapahiwatig ng matatag o mahigpit na pagkapit. Ipinahahayag ng “mahigpit na hinawakan” ang tindi nang hindi nagmumungkahing marahas niya itong sinunggaban.
- source_word: לְהָדְפָהּ
  choice: upang itaboy siya
  rationale: Ang הדף ay nagsasaad ng puwersahang pagpapaalis o pagtulak. Saklaw ng “itaboy” ang layon ng kilos at natural ito sa salaysay.
- source_word: הַרְפֵּה לָהּ
  choice: Hayaan mo siya
  rationale: Sa konteksto, inuutusan si Gehazi na tigilan ang panghihimasok sa babae. Ito ang maikli at likas na katumbas sa Tagalog.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: punô ng pait ang kanyang kalooban
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa panloob na pagkatao, at ang “mapait sa kanya” ay idyoma ng matinding dalamhati. Pinananatili ng “pait” ang larawang Hebreo habang malinaw ang kahulugan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הֶעְלִים מִמֶּנִּי וְלֹא הִגִּיד לִי
  choice: Inilihim ito sa akin ni Yahweh at hindi niya sinabi sa akin
  rationale: Pinananatili ang magkatugmang pahayag na itinago sa propeta ang bagay at hindi ito ipinahayag sa kanya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng נֶפֶשׁ sa idyoma ng pagdurusa
  choice: kalooban
  alternative: kaluluwa
  rationale: Sa pariralang ito, inilalarawan ng נֶפֶשׁ ang panloob na kalagayan ng babae. Mas natural sa modernong Tagalog ang “kalooban,” samantalang maaaring magpahiwatig ang “kaluluwa” ng mas tiyak na doktrinang antropolohikal na hindi hinihingi ng konteksto.
- issue: Kaalaman ng propeta at paghahayag ng Diyos
  choice: Inilihim ito sa akin ni Yahweh at hindi niya sinabi sa akin
  alternative: Hindi ito ipinaalam sa akin ni Yahweh
  rationale: Pinananatili ang dalawang sugnay ng Hebreo at ang malinaw na pag-amin ni Eliseo na hindi ipinahayag sa kanya ang kalagayan ng babae, nang walang dagdag na paliwanag tungkol sa lawak ng kaalaman ng propeta.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “lingkod ng Diyos” bilang likas na pamagat sa halip na ang mas salitang-salitang “tao ng Diyos.” Ang panghalip na “nito” matapos banggitin ang lingkod ng Diyos ay umiiwas sa kalituhan sa babae. Tanging ang idyomang Hebreo na may נֶפֶשׁ ang nilagyan ng talababa.
