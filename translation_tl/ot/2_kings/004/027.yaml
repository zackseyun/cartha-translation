revisions:
- from: Nang makarating siya sa lingkod ng Diyos sa bundok, mahigpit niyang hinawakan ang mga paa nito. Lumapit si Gehazi upang itaboy siya, ngunit sinabi ng lingkod ng Diyos, “Hayaan mo siya, sapagkat punô ng pait ang kanyang kalooban[a]. Inilihim ito sa akin ni Yahweh at hindi niya sinabi sa akin.”
  to: Nang makarating siya sa tao ng Diyos sa bundok, mahigpit siyang kumapit sa mga paa ng tao ng Diyos. Lumapit si Gehazi upang itulak siya palayo, ngunit sinabi ng tao ng Diyos, “Hayaan mo siya, sapagkat punô ng pait ang kanyang kalooban[a]. Inilihim ito sa akin ni Yahweh at hindi niya sinabi sa akin.”
  rationale: Pinalitan ang “lingkod ng Diyos” ng “tao ng Diyos” sa dalawang paglitaw upang tapat na maipakita ang אִישׁ הָאֱלֹהִים. Pinalitan din ang “itaboy siya” ng “itulak siya palayo” upang masaklaw nang wasto ang agarang puwersahang pagkilos ng לְהָדְפָהּ. Walang binagong kahulugan sa idyoma ng dalamhati, sa banal na pangalan, o sa dalawang magkatugmang sugnay tungkol sa hindi pagsisiwalat ni Yahweh.
