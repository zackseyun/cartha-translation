  - severity: low
    issue: “itaboy siya” para sa לְהָדְפָהּ
    rationale: Ang pandiwa ay tumutukoy sa puwersahang pagtulak o pagtataboy palayo sa agarang kilos. Ang “itulak siya palayo” ay mas tumpak at hindi nagpapahiwatig ng mas malawak na pagpapalayas.
