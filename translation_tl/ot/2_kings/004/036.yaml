  to: Pagkatapos ay tinawag niya si Gehazi at sinabi, “Tawagin mo ang babaeng ito na taga-Sunem.[a]” Kaya tinawag siya ni Gehazi, at lumapit siya kay Eliseo. Pagkatapos ay sinabi niya sa kaniya, “Buhatin mo ang anak mo.”
  rationale: Iningatan ng rebisyon ang pag-uulit ng “tawag” at ang utos na buhatin ang anak. Pinalitan ang idinagdag na titulong “propeta” ng pangalang Eliseo upang luminaw ang tinutukoy ng “sa kaniya” sa Tagalog, at pinakinis ang mga panghalip at transisyon para sa likas na daloy ng salaysay.
