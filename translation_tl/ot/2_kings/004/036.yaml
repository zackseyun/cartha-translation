  source_fidelity: Tumpak ang pangunahing pagkakasunod-sunod at mga kilos. Gayunman, ang “sa propeta” ay isang idinagdag na katawagan na wala sa Hebreo, na simpleng nagsasabing lumapit siya “sa kaniya.” Maaaring tukuyin si Eliseo para malinaw ang reperensiya sa Tagalog nang hindi idinadagdag ang titulong iyon.
  naturalness: Likas sa makabagong Tagalog ang karamihan ng salin. Mas maayos ang “Pagkatapos ay sinabi niya” kaysa “Sinabi nito,” na maaaring maging di-likas at malabo ang tinutukoy.
  terminology: Wasto ang Gehazi, Sunem, at “anak mo.” Ang “babaeng ito na taga-Sunem” ay malinaw na salin ng pambabaeng gentiliko; ang talababa ay dapat gumamit ng mas karaniwang paglalarawang “pambabaeng gentiliko.”
