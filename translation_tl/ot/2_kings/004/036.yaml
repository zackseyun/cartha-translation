  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: tl
  text: Pagkatapos ay tinawag niya si Gehazi at sinabi, “Tawagin mo ang babaeng ito na taga-Sunem.[a]” Kaya tinawag siya ni Gehazi, at lumapit siya kay Eliseo. Pagkatapos ay sinabi niya sa kaniya, “Buhatin mo ang anak mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Sunamitang ito.” Gumagamit ang Hebreo ng pambabaeng gentiliko, na literal na “ang Sunamitang babaeng ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: tinawag niya si Gehazi
  rationale: Ang Qal wayyiqtol ng קרא ay nagsasaad ng kasunod na kilos sa salaysay. Pinananatili ng “tinawag” ang tuwirang kahulugan, at ang panghalip na “niya” ay kaayon ng Hebreong tekstong hindi inuulit dito ang pangalan ni Eliseo.
- source_word: קְרָא
  choice: Tawagin mo
  rationale: Tuwirang pautos ito ng קרא. Ang “tawagin mo” ay likas at malinaw sa makabagong Tagalog.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: ang babaeng ito na taga-Sunem
  rationale: Ang anyo ay pambabaeng katawagan sa isang taong mula sa Sunem. Ang “babaeng ito na taga-Sunem” ay malinaw sa karaniwang mambabasa at pinananatili ang demonstratibong הַזֹּאת.
- source_word: וַיִּקְרָאֶהָ
  choice: Kaya tinawag siya ni Gehazi
  rationale: Pinananatili ang pag-uulit ng קרא upang malinaw na maisalaysay ang pagsunod ni Gehazi. Ginawang tahasan ang paksa upang maiwasan ang kalituhan sa mga panghalip sa Tagalog.
- source_word: וַתָּבֹא אֵלָיו
  choice: at lumapit siya sa propeta
  rationale: Ang בוא + אֶל ay paglapit o pagpunta sa isang tao. Ang “lumapit” ay natural sa tagpo; ang “sa propeta” ay nilinaw mula sa konteksto upang hindi mapagkamalang kay Gehazi siya lumapit.
- source_word: שְׂאִי
  choice: Buhatin mo
  rationale: Ang pambabaeng isahang pautos ng נשׂא ay tumutukoy sa pagbuhat sa batang nakahiga. Mas tiyak dito ang “buhatin” kaysa sa pangkalahatang “kunin.”
- source_word: בְנֵךְ
  choice: ang anak mo
  rationale: Ang בֵּן na may hulaping ikalawang panauhang pambabae ay “anak mong lalaki.” Sa konteksto, malinaw nang anak na lalaki ang tinutukoy; natural sa Tagalog ang “anak mo.”
