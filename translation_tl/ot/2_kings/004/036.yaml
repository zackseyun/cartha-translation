  - severity: low
    issue: “Sinabi nito sa kaniya”
    rationale: Ang “nito” ay hindi pinakanatural na pantukoy sa isang taong nagsasalita sa ganitong salaysay at maaaring makalabo sa reperensiya. Ang “sinabi niya” ay mas likas.
