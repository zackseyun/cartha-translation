translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Nilinaw ang ilang reperensiya ng panghalip bilang “Gehazi” at “ang propeta” upang maiwasan ang likas na kalabuan sa Tagalog, nang hindi binabago ang kilos o pagkakasunod-sunod ng Hebreo.
