base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: tl
  text: Pagkatapos, umakyat siya at humiga sa ibabaw ng batang lalaki. Inilapat niya ang kanyang bibig sa bibig nito, ang kanyang mga mata sa mga mata nito, at ang kanyang mga palad sa mga palad nito. Yumuko siya sa ibabaw nito,[a] at uminit ang laman ng batang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniunat niya ang kanyang sarili sa ibabaw nito.” Bihira ang pandiwang Hebreo at maaaring tumukoy sa pagyuko o pag-unat ng sarili sa ibabaw ng batang lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Pagkatapos, umakyat siya
  rationale: Pinananatili ang payak na kahulugan ng עלה na “umakyat.” Nauunawaan sa konteksto na umakyat siya sa silid sa itaas, ngunit hindi iyon tahasang inuulit sa talata.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: humiga sa ibabaw ng bata
  rationale: Tuwirang inilalarawan ang pisikal na pagkakahiga ni Eliseo sa bata at likas ang parirala sa modernong Filipino.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: Itinapat niya ang kanyang bibig sa bibig nito
  rationale: Ang שׂים ay “ilagay/itapat.” Pinili ang “itinapat” upang malinaw at natural na ipahayag ang pagtutugma at pagdikit ng mga bahagi ng katawan nang hindi nagdaragdag ng paliwanag tungkol sa layunin nito.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: ang kanyang mga mata sa mga mata nito
  rationale: Pinananatili ang simetrikong ayos ng Hebreo at nililinaw sa pamamagitan ng “nito” na ang ikalawang pares ng mata ay sa bata.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: ang kanyang mga palad sa mga palad nito
  rationale: Ang כַּף ay mas tiyak na “palad” kaysa sa pangkalahatang “kamay,” kaya pinananatili ang kongkretong detalye ng Hebreo.
- source_word: וַיִּגְהַר עָלָיו
  choice: Yumuko siya sa ibabaw nito
  rationale: Ang bihirang pandiwang גהר ay tumutukoy sa pagyuko o pag-unat ng sarili sa ibabaw ng iba. Ang “yumuko” ay natural sa Filipino, habang inilalagay sa talababa ang lehitimong alternatibong “iniunat ang sarili.”
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: uminit ang katawan ng bata
  rationale: Ang חם ay nagsasaad ng pag-init. Bagaman literal na “laman” ang בָּשָׂר, mas natural sa Filipino ang “katawan” sa paglalarawan ng pag-init ng buong pisikal na katawan ng bata, nang hindi binabago ang diwa.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: ang bata
  rationale: Ang יֶלֶד ay maaaring “bata” o “batang lalaki.” Malinaw na lalaki ang bata sa konteksto, kaya sapat at mas likas dito ang “bata.”
theological_decisions:
- issue: Kalikasan ng ginawa ni Eliseo sa patay na bata
  choice: Ilarawan nang kongkreto ang sunod-sunod na pisikal na kilos nang hindi ipinapaliwanag ang mekanismo.
  alternative: Tawagin itong mouth-to-mouth resuscitation o gumamit ng malabong pananalitang umiiwas sa pisikal na detalye.
  rationale: Iniuulat ng Hebreo ang pisikal na kilos ng propeta kaugnay ng muling pagkabuhay ng bata ngunit hindi nito tahasang sinasabi kung paano iyon naging mabisa. Kaya hindi ipinapasok ang makabagong paliwanag na medikal o anumang sakramental na interpretasyon.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “nito” upang maiwasan ang kalituhan sa magkakasunod na panghalip, at pinanatili ang kongkretong pagkakatapat ng bibig, mga mata, at mga palad.
