  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Tawagin mo siya.” Kaya tinawag niya ang babae, at nakatayo siya sa pintuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pasukan.” Ang salitang Hebreo ay maaaring tumukoy sa pintuan o sa lugar ng pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Ipinahahayag ng wayyiqtol ang kasunod na kilos sa salaysay; natural sa makabagong Tagalog ang “Pagkatapos ay sinabi niya.”
- source_word: קְרָא לָהּ
  choice: Tawagin mo siya
  rationale: Ang קְרָא ay pautos na panlalaking isahan at ang לָהּ ay tumutukoy sa babae; payak at tuwiran ang salin.
- source_word: וַיִּקְרָא לָהּ
  choice: Kaya tinawag niya ang babae
  rationale: Ipinakikita ng “Kaya” na tumugon ang lalaki sa utos. Ginawang “ang babae” ang panghalip upang maiwasan ang malabong sunod-sunod na “niya” at “siya” sa Tagalog.
- source_word: וַתַּעֲמֹד
  choice: at tumayo ito
  rationale: Ang עמד ay nangangahulugang tumayo o pumuwesto. Hindi idinagdag ang “lumapit,” sapagkat wala iyon sa tekstong Hebreo; ang “ito” ay malinaw na tumutukoy sa babae.
- source_word: בַּפָּתַח
  choice: sa may pintuan
  rationale: Ang פתח ay maaaring tumukoy sa bukana, pasukan, o pintuan. Natural sa Tagalog ang “sa may pintuan” at hindi nito labis na nililimitahan ang eksaktong puwesto.
