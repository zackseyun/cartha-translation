translation:
  language: tl
  text: Kaya umalis siya mula kay Eliseo at isinara niya ang pinto sa likuran niya at ng kanyang mga anak. Patuloy nilang dinadala sa kanya ang mga sisidlan,[a] at patuloy naman siyang nagbuhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “dinadala sa kanya” lamang; ang “mga sisidlan” ay idinagdag mula sa konteksto ng mga sisidlang walang laman sa naunang mga talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Kaya umalis siya sa harap ni Eliseo
  rationale: Isinusulong ng waw-consecutive ang salaysay, at ang מֵאִתּוֹ ay nangangahulugang umalis siya mula sa kinaroroonan ng lalaking kausap niya. Ginawang tahasan ang pangalang Eliseo mula sa konteksto upang maging natural at malinaw sa Tagalog.
- source_word: וַתִּסְגֹּר הַדֶּלֶת
  choice: at isinara ang pinto
  rationale: Tuwirang katumbas ng סגר ang “isinara,” at ito ang natural na parirala sa modernong Tagalog.
- source_word: בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: sa likuran niya at ng kanyang mga anak
  rationale: Kasama ng pandiwang “isinara,” ipinahihiwatig ng בְּעַד na nasa loob silang mag-iina nang isara ang pinto sa kanilang likuran. Pinananatili ang pag-uulit ng ugnayan para sa babae at sa kanyang mga anak.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Patuloy nilang inilalapit sa kanya ang mga sisidlan
  rationale: Ang participle ay nagpapakita ng nagpapatuloy o paulit-ulit na kilos. Walang tahasang layon sa Hebreo, ngunit ang “mga sisidlan” ay malinaw na hinango sa naunang konteksto at nilagyan ng talababa.
- source_word: וְהִיא מיצקת
  choice: at patuloy naman siyang nagbuhos
  rationale: Ang participle ay nagsasaad ng nagpapatuloy na kilos kasabay ng ginagawa ng mga anak. Ang “naman” ay likas na naghahayag ng magkaugnay at magkasabay na mga gawain nang hindi nagdaragdag ng bagong kahulugan.
