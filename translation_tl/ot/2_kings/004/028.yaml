translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang magalang na ‘ninyo’ sa pakikipag-usap kay Eliseo at pinanatiling maliit ang titik ng ‘panginoon’ upang ipakitang magalang na tawag ito sa tao.
