  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: tl
  text: Sinabi niya, “Humingi ba ako sa inyo, panginoon ko, ng isang anak na lalaki? Hindi ba sinabi ko, ‘Huwag ninyo akong linlangin[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag ninyo akong dayain” o “Huwag ninyo akong bigyan ng huwad na pag-asa.” Ang pandiwang Hebreo ay maaaring tumukoy sa panlilinlang, lalo na sa pagbangon ng pag-asang mauuwi sa wala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Sinabi niya
  rationale: Ipinakikilala ng waw-consecutive na may אמר ang kanyang sinabi; natural sa makabagong Tagalog na hindi na tahasang isalin ang pang-ugnay.
- source_word: הֲשָׁאַלְתִּי
  choice: Humingi ba ako
  rationale: Ang pantanong na anyo ng שאל ay isang retorikal na tanong kung hiniling ba niya ang bata.
- source_word: בֵן
  choice: isang anak na lalaki
  rationale: Tiyak na ‘anak na lalaki’ ang בֵן, hindi lamang pangkalahatang ‘anak.’
- source_word: מֵאֵת אֲדֹנִי
  choice: sa aking panginoon
  rationale: Kasama ng pandiwang ‘humingi,’ likas sa Tagalog ang ‘humingi sa aking panginoon.’ Ang ‘panginoon’ ay magalang na tawag kay Eliseo, hindi banal na titulo.
- source_word: הֲלֹא אָמַרְתִּי
  choice: Hindi ba sinabi ko
  rationale: Pinananatili ang ikalawang retorikal na tanong at ang payak na diwa ng אמר.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Huwag ninyo akong bigyan ng maling pag-asa
  rationale: Sa kontekstong ito, ang Hiphil ng שלה ay tumutukoy sa panlilinlang sa pamamagitan ng pagpukaw ng pag-asang maaaring mauwi sa wala. Mas malinaw at natural ito sa Tagalog kaysa sa malabong ‘huwag ninyo akong iligaw.’
