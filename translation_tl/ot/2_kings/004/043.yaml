base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: tl
  text: 'Ngunit sinabi ng kanyang lingkod[a], “Paano ko ito maihahain sa harap ng sandaang lalaki?” Sinabi niya, “Ibigay mo ito sa mga tao at hayaan silang kumain[b], sapagkat ganito ang sinasabi ni Yahweh: ‘Kakain sila, at may matitira pa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Paano ko ito maibibigay sa sandaang lalaki?” Literal sa Hebreo: “Ano ang ibibigay ko rito sa harap ng sandaang lalaki?”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa Hebreo: “kumain at mag-iwan ng sobra,” isang pahayag na nangangahulugang may pagkaing matitira matapos silang kumain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: kanyang lingkod
  rationale: Ang מְשָׁרֵת ay tumutukoy sa isang naglilingkod sa personal o opisyal na tungkulin; natural sa salaysay ang “lingkod” at malinaw ang kaugnayan nito kay Eliseo.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Paano ko ito maihahain sa harap ng sandaang lalaki?
  rationale: Pinananatili ng “maihahain sa harap” ang konkretong larawan ng paglalagay ng pagkain sa harap ng mga kakain, habang ipinahihiwatig ng “Paano” ang pag-aalinlangan ng lingkod.
- source_word: אִישׁ
  choice: lalaki
  rationale: Ang panlalaking pangngalan ay ginagamit nang distributibo kasunod ng bilang na sandaang; ang “lalaki” ang pinakamalapit na katumbas sa anyo at malamang na tinutukoy.
- source_word: תֵּן לָעָם
  choice: Ibigay mo ito sa mga tao
  rationale: Ang עָם ay kolektibong tumutukoy sa nagkakatipong pangkat; natural at sapat na malawak ang “mga tao,” ayon sa pagbabago ng Hebreo mula אִישׁ tungo sa עָם.
- source_word: וְיֹאכֵלוּ
  choice: at hayaan silang kumain
  rationale: Ang pandiwa matapos ang pautos ay may puwersang jussive o resulta; malinaw na ipinapahayag ng salin ang pahintulot o utos na pakainin sila.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: sapagkat ganito ang sinabi ni Yahweh
  rationale: Pinananatili nito ang pormula ng mensaherong propetiko sa natural at marangal na modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang banal na nasa tekstong Hebreo.
- source_word: אָכֹל וְהוֹתֵר
  choice: Kakain sila, at may matitira pa
  rationale: 'Natural nitong ipinapahayag ang tiyak na ipinangakong resulta: makakain ang mga tao at may pagkaing matitira pagkatapos.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil tahasang ginagamit ng talata ang Tetragrammaton, pinananatili ang pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Lakas ng pangakong אָכֹל וְהוֹתֵר
  choice: Kakain sila, at may matitira pa
  alternative: Kumain sila at magtira
  rationale: Ang konteksto at anyong pandiwa ay nagpapahayag ng tiyak na kalalabasan na ipinangako ni Yahweh, hindi isang utos sa mga tao na sadyang magtabi ng pagkain.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sandaang lalaki” para sa tiyak na panlalaking anyo ng אִישׁ at “mga tao” para sa kolektibong עָם. Ang “maihahain sa harap” ay nagpapanatili sa kongkretong larawan ng Hebreo nang hindi nagiging makaluma o matigas.
