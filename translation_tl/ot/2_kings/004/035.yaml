base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: tl
  text: Pagkatapos, bumalik siya at naglakad sa loob ng bahay nang pabalik-balik.[a] Pagkatapos, umakyat siya at yumuko sa ibabaw ng bata.[b] Bumahing nang pitong beses ang bata, at iminulat niya ang kanyang mga mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “minsan dito at minsan doon.” Literal sa Hebreo: “minsan dito at minsan doon.”'
    reason: lexical_alternative
  - marker: b
    text: O “dumapa sa ibabaw ng bata.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagyuko o pagdapa sa ibabaw ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Pagkatapos, bumalik siya
  rationale: Ang שׁוּב ay nangangahulugang “bumalik,” at ang “pagkatapos” ay natural na naghahayag ng pagkakasunod-sunod sa salaysay.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: naglakad sa loob ng bahay
  rationale: Ipinahihiwatig ng pariralang may lokasyon ang pagkilos sa loob ng bahay; hindi idinagdag ang mas interpretibong diwa ng balisang pagpapabalik-balik.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: minsan dito at minsan doon
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo, bagaman ang natural na idyomang “pabalik-balik” ay inilagay sa talababa.
- source_word: וַיַּעַל
  choice: umakyat siya
  rationale: Pinananatili ang spatial na diwa ng עלה, malamang na tumutukoy sa pag-akyat sa silid sa itaas na kinaroroonan ng bata.
- source_word: וַיִּגְהַר עָלָיו
  choice: yumuko sa ibabaw ng bata
  rationale: Ang גהר ay tumutukoy sa pagyuko o pagdapa sa ibabaw ng isang tao. Ang salin ay naglalarawan sa kilos nang hindi ipinapaliwanag ang paraan ng himala.
- source_word: וַיְזוֹרֵר
  choice: bumahing
  rationale: Ang bihirang pandiwa ay tradisyonal at leksikal na nauunawaang tumutukoy sa pagbahing; pinagtitibay ng bilang na kasunod na paulit-ulit ang kilos.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Sa konteksto, ang נַעַר ay anak ng babaeng Sunamita. Ang “bata” ay natural at hindi nagpapalagay ng mas tiyak na edad kaysa sa teksto.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: nang pitong beses
  rationale: Bagaman maaaring mangahulugan ang עַד ng “hanggang,” dito ay ipinahahayag ng parirala ang kabuuang bilang ng mga pagbahing.
- source_word: וַיִּפְקַח ... אֶת עֵינָיו
  choice: iminulat nito ang kanyang mga mata
  rationale: Ang פקח עיניים ay karaniwang idyoma para sa pagmulat ng mga mata. Ginamit ang “nito” upang malinaw na ang bata ang simuno habang pinananatili ang natural na Filipino.
theological_decisions:
- issue: Ang katangian ng pagkilos ni Eliseo sa ibabaw ng bata
  choice: Ilarawan lamang na yumuko siya sa ibabaw ng bata.
  alternative: Isalin bilang “iniunat niya ang kanyang sarili sa ibabaw ng bata” o “dumapa siya sa ibabaw nito.”
  rationale: Isinasalaysay ng Hebreo ang pisikal na kilos ngunit hindi nito ipinaliliwanag kung paano ito kaugnay ng himala. Iniiwasan ng salin ang pahiwatig na ang kilos mismo ay isang mahiwaga o sakramental na mekanismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na takbo ng salaysay at ang konkretong larawan ng Hebreo, habang iniwasan ang sobrang teknikal o denominasyonal na pananalita.
