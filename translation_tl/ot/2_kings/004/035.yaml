  terminology: Ang “bata” ay angkop para sa הַנַּעַר sa kontekstong ito. Walang terminong teolohikal na kailangang baguhin. Pinananatili ng “yumuko sa ibabaw ng bata” ang deskriptibong register nang hindi nagdaragdag ng doktrinal na pakahulugan.
