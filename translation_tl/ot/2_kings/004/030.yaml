base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: tl
  text: Sinabi ng ina ng bata[a], “Kung paanong buhay si Yahweh at buhay ka, hindi kita iiwan.” Kaya tumindig si Eliseo at sumunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pormula ito ng panunumpa sa Hebreo. Literal na, “Buhay si Yahweh, at buhay ang iyong sarili”; ibig sabihin, “Kung paanong tiyak na buhay si Yahweh at buhay ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: ina ng bata
  rationale: Likas at tuwirang salin ng pariralang konstruktong ‘ina ng bata’; pinananatili nito ang tiyak na pagkakakilanlan sa babae.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Buhay si Yahweh, at buhay ka rin
  rationale: Isinasalin ang karaniwang pormula ng panunumpa sa paraang natural sa modernong Filipino. Ang נֶפֶשׁ sa pormulang ito ay tumutukoy sa buhay o mismong persona ng kausap, kaya ‘buhay ka rin’ ang malinaw na katumbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: hindi kita iiwan
  rationale: Sa konteksto ng panunumpa, ang אִם ay nagsasaad ng mariing pagtanggi, hindi isang bukás na kondisyon.
- source_word: וַיָּקָם
  choice: tumindig si Eliseo
  rationale: Ang קום ay ‘tumindig’ o ‘bumangon.’ Nilinaw ang implicit na panlalaking paksa bilang si Eliseo upang maiwasang mapagkamalan itong tumutukoy sa batang nabanggit sa unang sugnay.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: sumunod sa kanya
  rationale: Ang literal na ‘lumakad sa likuran niya’ ay idyomatikong nangangahulugang sumunod sa babae; ito ang natural na Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה sa pormula ng panunumpa
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton; ang ‘Yahweh’ ay transliterasyon ng personal na pangalan at hindi pagpapalit dito ng titulo.
- issue: Kahulugan ng חֵי נַפְשְׁךָ sa panunumpa
  choice: buhay ka rin
  alternative: buhay ang iyong kaluluwa
  rationale: Bagaman literal na binabanggit ang נֶפֶשׁ, sa pormulang ito ang diwa ay ‘habang ikaw ay buhay’ o ‘kung paanong buhay ka.’ Iniiwasan ng salin ang pagpasok ng teknikal na doktrina tungkol sa kaluluwa na hindi siyang punto ng idyoma.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘tumindig’ para sa dignidad ng salaysay at tahasang binanggit si Eliseo upang maging malinaw ang reperente ng panlalaking pandiwa.
