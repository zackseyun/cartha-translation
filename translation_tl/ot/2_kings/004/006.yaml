  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: tl
  text: Nang mapuno ang mga sisidlan, sinabi niya sa anak niyang lalaki, “Iabot mo sa akin ang isa pang sisidlan.” Ngunit sinabi ng anak niyang lalaki sa kanya, “Wala nang iba pang sisidlan.” At tumigil sa pag-agos ang langis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “tumayo ang langis”; ibig sabihin, tumigil ito sa pag-agos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת הַכֵּלִים
  choice: Nang mapuno ang mga sisidlan
  rationale: Ang כ na kasunod ng infinitive construct ay bumubuo ng sugnay na panahunan. Likas sa modernong Tagalog ang “Nang mapuno” at tapat ito sa diwa ng pagkakumpleto ng pagpuno.
- source_word: הַכֵּלִים / כֶּלִי
  choice: mga sisidlan / sisidlan
  rationale: Malawak ang saklaw ng כְּלִי at hindi nito tinutukoy ang isang tiyak na uri ng lalagyan. Ang “sisidlan” ay angkop sa langis at hindi nagdaragdag ng espesipikong anyo gaya ng “banga.”
- source_word: הַגִּישָׁה אֵלַי
  choice: Iabot mo sa akin
  rationale: Ang Hiphil imperative ng נגשׁ ay “ilapit” o “iharap.” Sa tagpong ipinapasa ng anak ang sisidlan sa ina, natural at malinaw ang “Iabot mo sa akin.”
- source_word: עוֹד כֶּלִי
  choice: isa pang sisidlan
  rationale: Sa kasamang pang-isahang כֶּלִי, ang עוֹד ay tumutukoy sa isang karagdagang sisidlan; idiomatiko sa Tagalog ang “isa pang.”
- source_word: אֵין עוֹד כֶּלִי
  choice: Wala nang iba pang sisidlan
  rationale: Ipinahahayag ng אֵין ang kawalan o hindi pag-iral. Ipinakikita ng “wala nang iba pang” na wala nang karagdagang sisidlang maibibigay nang hindi isinasama ang di-hayag na salitang “natitira.”
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: tumigil sa pag-agos ang langis
  rationale: Literal na “tumayo” ang עמד, ngunit sa konteksto ang langis ang huminto sa pag-agos. Inilalahad ng salin ang likas na diwa, habang pinananatili sa talababa ang literal na larawan.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural ngunit marangal na modernong Tagalog. Pinili ang “sisidlan” upang mapanatili ang malawak na kahulugan ng Hebrew at iniwasan ang mas tiyak na “banga.” Ang “anak niyang lalaki” ay hayagang kumakatawan sa panlalaking בְּנָהּ.
