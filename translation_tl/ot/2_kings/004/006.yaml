- from: Nang mapuno ang mga sisidlan, sinabi niya sa anak niyang lalaki, “Iabot mo sa akin ang isa pang sisidlan.” Sinabi nito sa kanya, “Wala nang iba pang sisidlan.” Kaya tumigil sa pag-agos ang langis.[a]
  to: Nang mapuno ang mga sisidlan, sinabi niya sa anak niyang lalaki, “Iabot mo sa akin ang isa pang sisidlan.” Ngunit sinabi ng anak niyang lalaki sa kanya, “Wala nang iba pang sisidlan.” At tumigil sa pag-agos ang langis.[a]
  rationale: Ginawa lamang ang ligtas na pagpapakinaw sa pagtukoy sa nagsasalita at ang bahagyang pagsasaayos ng pang-ugnay upang masundan ang sunod-sunod na salaysay ng Hebreo. Hindi binago ang kahulugan, saklaw ng “sisidlan,” o ang literal na impormasyon sa talababa.
