  source_fidelity: 'Tapat ang salin sa daloy at kahulugan ng Hebreo: napuno ang mga sisidlan, humingi ang babae ng karagdagang sisidlan, wala nang maibibigay, at huminto ang langis. Ang “tumigil sa pag-agos” ay wastong pagpapahayag ng kontekstuwal na diwa ng וַיַּעֲמֹד הַשָּׁמֶן, habang pinananatili ng talababa ang literal na larawan.'
  naturalness: Natural sa pangkalahatan ang modernong Tagalog, ngunit medyo matigas at posibleng di-gaanong malinaw ang “Sinabi nito sa kanya.” Mas malinaw at mas natural sa naratibo ang tahasang pagtukoy muli sa anak. Ang “At” sa huling pangungusap ay mas malapit din sa sunod-sunod na salaysay ng Hebreo kaysa “Kaya,” na maaaring magpahiwatig ng mas mariing ugnayang sanhi-bunga.
  terminology: Ang “sisidlan” ay mahusay at malawak na katumbas ng כְּלִי; hindi nito nililimitahan ang anyo sa banga o ibang espesipikong lalagyan. Ang “anak niyang lalaki” ay angkop na kumakatawan sa panlalaking anyo ng Hebreo. Wasto ang talababa para sa literal na “tumayo ang langis.”
