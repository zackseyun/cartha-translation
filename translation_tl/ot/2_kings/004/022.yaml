  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: tl
  text: Pagkatapos, tinawag niya ang kanyang asawa at sinabi, “Pakipadala mo sa akin ang isa sa mga kabataang lalaki at ang isa sa mga inahing asno[b], upang magmadali akong pumunta sa tao ng Diyos[a] at makabalik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang tumakbo ako.” Ipinahahayag ng pandiwang Hebreo ang pagmamadali o agarang pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tiyak na tumutukoy sa mga babaeng asno; sa ibang salin ay “asno” lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: tinawag niya ang kanyang asawa
  rationale: Sa kontekstong pantahanan, ang אִישׁ na may hulaping tumutukoy sa babae ay likas na nangangahulugang ‘kanyang asawa.’ Ipinahihiwatig ng anyong pasalaysay ang kasunod na pangyayari.
- source_word: שִׁלְחָה נָא לִי
  choice: Pakisuguan mo ako ng
  rationale: Ang pautos kasama ng נָא ay magalang na pakiusap. Likas sa modernong Tagalog ang ‘pakisuguan mo ako ng’ para sa paghiling na magpadala ng kasama at sasakyan.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: isa sa mga binata
  rationale: Maaaring mangahulugan ang נַעַר ng kabataang lalaki, tagapaglingkod, o alalay. Pinananatili ng ‘binata’ ang pangunahing leksikal na diwa nang hindi tiyak na itinuturing siyang utusan.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: at ng isa sa mga inahing asno
  rationale: Tiyak na babaeng asno ang tinutukoy ng אָתוֹן. Ang ‘inahing asno’ ay maikli at malinaw na nagpapanatili sa kasariang tahasang nasa Hebreo.
- source_word: וְאָרוּצָה
  choice: upang makapagmadali ako
  rationale: Ipinahahayag ng cohortative ang layunin ng nagsasalita. Literal na ‘tumakbo’ ang pandiwa, ngunit sa paglalakbay na may asno, natural na ipinahahayag ng ‘makapagmadali’ ang agarang pagkilos habang inilalagay sa talababa ang literal na larawan.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: papunta sa tao ng Diyos
  rationale: Sa konteksto ng paggalaw, ang עַד ay nagsasaad ng patutunguhan. Pinananatili ng ‘tao ng Diyos’ ang literal at nakaugaliang titulong Hebreo sa halip na palitan ito ng ‘propeta.’
- source_word: וְאָשׁוּבָה
  choice: at makabalik
  rationale: Ipinagpapatuloy ng cohortative ang nilalayong pagkilos. Ang ‘makabalik’ ay natural na kaparis ng ‘makapagmadali’ sa sugnay ng layunin.
