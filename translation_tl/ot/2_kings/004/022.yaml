  to: Pagkatapos, tinawag niya ang kanyang asawa at sinabi, “Pakipadala mo sa akin ang isa sa mga kabataang lalaki at ang isa sa mga inahing asno[b], upang magmadali akong pumunta sa tao ng Diyos[a] at makabalik.”
