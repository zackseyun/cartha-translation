  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: tl
  text: Inilagay niya iyon sa harap nila. Kumain sila at may natira pa, ayon sa salita ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: inilagay niya
  rationale: Ang נָתַן ay maaaring mangahulugang “ibinigay” o “inilagay.” Kasama ng לִפְנֵיהֶם, ang “inilagay niya … sa harap nila” ay tuwirang naglalarawan sa paghahain ng pagkain nang hindi labis na nagpapaliwanag.
- source_word: לִפְנֵיהֶם
  choice: sa harap nila
  rationale: Tuwirang katumbas ito ng pariralang nangangahulugang “sa harap nila,” at natural sa konteksto ng pagkaing inihain.
- source_word: וַיֹּאכְלוּ
  choice: kumain sila
  rationale: Payak at tuwirang salin ng pandiwang אָכַל sa sunod-sunod na salaysay.
- source_word: וַיּוֹתִרוּ
  choice: may natira pa
  rationale: Ang Hiphil ng יָתַר ay nagpapahiwatig na may pagkaing naiwan matapos silang kumain. Ang “may natira pa” ang pinakanatural na modernong Tagalog, habang inilalagay sa talababa ang mas pormal na pagbasa na sila ang nag-iwan ng tira.
- source_word: כִּדְבַר
  choice: ayon sa salita ni
  rationale: Pinananatili ng “ayon sa salita ni” ang tahasang ugnayan sa naunang pahayag ng Diyos at ang pormal na larawan ng “salita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang pangalang יהוה bilang personal na pangalan sa halip na palitan ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang יהוה ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan at hindi ito pinapalitan ng titulo.
- issue: Katuparan ng ipinahayag na salita ni Yahweh
  choice: ayon sa salita ni Yahweh
  alternative: gaya ng sinabi ni Yahweh
  rationale: Pinananatili ang pangngalang “salita” upang manatiling hayag ang kaugnayan ng pangyayari sa banal na pahayag, nang hindi dinaragdagan ang interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “iyon” bilang ipinahiwatig na layon mula sa pagkaing binanggit sa naunang talata; hindi ito tahasang nasa Hebreo. Pinanatili ang “sa harap nila” at “salita ni Yahweh” upang huwag mawala ang anyo ng pinagmulang teksto.
