base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: tl
  text: May dumating na isang lalaki mula sa Baal-salisa at nagdala sa tao ng Diyos ng tinapay mula sa unang ani, dalawampung tinapay na sebada, at sariwang butil[a] sa kaniyang supot.[b] Sinabi niya, “Ibigay mo ito sa mga tao upang sila’y makakain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binusang butil.” Maaaring tumukoy ang salitang Hebreo sa butil na inihanda nang kainin, hindi lamang sa sariwang butil.
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang salitang Hebreo na isinaling “supot.” Maaaring tumukoy ito sa isang bag, balot, o marahil sa butil na nasa balat nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tuwirang tumutukoy ang pangngalan sa isang lalaking indibidwal; natural sa modernong Tagalog ang “isang lalaki.”
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: mula sa Baal-salisa
  rationale: Pangalan ito ng lugar, kaya isinalin sa paraang transliterasyon at iniangkop ang baybay sa Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang literal at paulit-ulit na titulong Hebreo sa halip na ipakahulugan agad bilang “propeta.”
- source_word: לֶחֶם בִּכּוּרִים
  choice: tinapay mula sa mga unang ani
  rationale: Ipinahahayag nito ang ugnayan ng tinapay sa unang bunga o ani nang hindi labis na tinutukoy ang eksaktong ritwal na gamit nito.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: dalawampung tinapay na sebada
  rationale: Natural na Tagalog ito para sa binilang na mga tinapay na yari sa sebada.
- source_word: כַרְמֶל
  choice: sariwang butil
  rationale: Maaaring tumukoy ang salita sa sariwa o inihandang butil. Malawak at angkop sa konteksto ang “sariwang butil,” habang inilalagay sa talababa ang mahalagang alternatibo.
- source_word: בְּצִקְלֹנוֹ
  choice: sa kaniyang supot
  rationale: Malamang na lalagyan o balot ang tinutukoy ng bihira at di-tiyak na salitang Hebreo. Malinaw sa konteksto ang “supot,” ngunit pinananatili sa talababa ang kawalang-katiyakan.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Ibigay mo ito sa mga tao upang makakain sila
  rationale: Natural na ipinapahayag ng “upang” ang layunin o nilalayong bunga ng pautos at ng kasunod na pandiwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang titulong “tao ng Diyos” at ang leksikal na kawalang-katiyakan sa כַרְמֶל at צִקְלוֹן sa pamamagitan ng mga talababa. Ginamit ang mga gitling upang linawin na ang dalawampung tinapay na sebada ang tinapay mula sa mga unang ani.
