translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikli at bahagyang mahiwagang tugon ng babae sa halip na tahasang ipaliwanag ang kaniyang layunin. Inilagay ang talababa sa “Kapayapaan,” ang salitang talagang tinutukoy nito.
