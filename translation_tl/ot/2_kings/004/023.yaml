  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: tl
  text: Sinabi niya, “Bakit ka pupunta sa kanya ngayon? Hindi naman bagong buwan o Sabbath ngayon.” Sumagot siya, “Maayos lang[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Maayos ang lahat.” Sa literal, “Kapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Likas at tuwirang tanong sa dahilan sa modernong Tagalog.
- source_word: אתי הלכתי
  choice: ka pupunta
  rationale: Ang anyong Hebreo ay di-karaniwan ngunit tumutukoy sa pagpunta ng babaeng kausap; ang aspektong kontemplatibo sa Tagalog ay angkop sa nalalapit niyang pag-alis.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo; si Eliseo ang tinutukoy ayon sa konteksto nang hindi siya tahasang pinapangalanan sa talata.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na katumbas sa Tagalog para sa panahong tinutukoy sa agarang sitwasyon.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: Hindi naman bagong buwan o Sabbath
  rationale: Ipinahahayag ang dahilan ng tanong at pinananatili ang dalawang okasyong pangkalendaryo; ang “naman” ay natural na nagpapakita ng pagtataka sa Tagalog nang hindi nagdaragdag ng bagong impormasyon.
- source_word: חֹדֶשׁ
  choice: bagong buwan
  rationale: Sa kontekstong panrelihiyon at pangkalendaryo, tumutukoy ito sa bagong buwan at kaugnay na pagdiriwang, hindi lamang sa isang buwan.
- source_word: שַׁבָּת
  choice: Sabbath
  rationale: Kinikilalang terminong biblikal para sa banal na araw ng pamamahinga ng Israel.
- source_word: שָׁלוֹם
  choice: Kapayapaan
  rationale: Pinananatili ang literal at siksik na salitang Hebreo, habang inilalahad sa talababa ang idyomatikong diwang maaaring mangahulugang maayos ang lahat.
