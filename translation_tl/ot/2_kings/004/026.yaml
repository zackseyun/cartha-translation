  naturalness: Ang “Mabuti ba ang kalagayan...” ay nauunawaan ngunit medyo mabigat at administratibo sa diyalogo. Ang “Mabuti ba ang lagay...” ay mas likas na modernong Tagalog, nananatiling marangal, at napapanatili ang pag-uulit ng Hebreo.
  terminology: Wasto ang “asawa” para sa אישך sa kontekstong ito at ang “bata” para sa yeled; ang talababa ay maayos na nag-iingat sa posibilidad na “batang lalaki.” Ang “lagay” ay sapat na malawak para sa shalom bilang kapakanan/kagalingan, hindi lamang pisikal na kalusugan.
