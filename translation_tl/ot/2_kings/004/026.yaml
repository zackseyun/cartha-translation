revisions:
- from: Ngayon, pakitakbo upang salubungin siya at sabihin sa kanya, “Mabuti ba[a] ang kalagayan mo? Mabuti ba ang kalagayan ng asawa mo? Mabuti ba ang kalagayan ng bata?[b]” Sumagot siya, “Mabuti naman.”
  to: Ngayon, tumakbo ka nga upang salubungin siya at sabihin sa kanya, “Mabuti ba[a] ang lagay mo? Mabuti ba ang lagay ng asawa mo? Mabuti ba ang lagay ng bata?[b]” Sumagot siya, “Mabuti.”
  rationale: Pinalitan ang hindi likas na “pakitakbo” ng “tumakbo ka nga” upang maipahayag ang utos at ang nuance ng na sa natural na Tagalog. Pinasimple ang “kalagayan” tungo sa “lagay” para sa mas buhay na diyalogo, at ginawang “Mabuti” ang tugon upang mapanatili ang kaiklian at tuwirang katiyakan ng Hebreo. Napanatili ang istruktura ng tatlong magkakatulad na tanong, ang hindi espesipikong “bata,” at ang mga footnote anchor.
