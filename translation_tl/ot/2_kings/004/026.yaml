  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: tl
  text: Ngayon, tumakbo ka nga upang salubungin siya at sabihin sa kanya, “Mabuti ba[a] ang lagay mo? Mabuti ba ang lagay ng asawa mo? Mabuti ba ang lagay ng bata?[b]” Sumagot siya, “Mabuti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang salitang Hebreo na shalom, na apat na ulit ginamit sa talatang ito, ay maaaring tumukoy sa kapayapaan, kabuuan, o mabuting kalagayan. Dito, tumutukoy ito sa kapakanan: “Mabuti ba ang lagay...?” / “Mabuti.”'
    reason: lexical_alternative
  - marker: b
    text: O “batang lalaki.” Ang salitang Hebreo na yeled ay maaaring mangahulugang “bata” o “batang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tuwirang ipinahahayag ang panahong kasalukuyan at ang agarang pagsisimula ng utos nang hindi dinaragdagan ang tindi nito.
- source_word: רוּץ נָא
  choice: pakitakbo
  rationale: Pinananatili ng “takbo” ang lakas ng pautos na pandiwa, samantalang ipinahahayag ng “paki-” ang pagpapalambot o magalang na pakiusap na dala ng נָא.
- source_word: לִקְרָאתָהּ
  choice: upang salubungin siya
  rationale: Ang pariralang Hebreo ay karaniwang tumutukoy sa pagpunta upang salubungin ang isang taong dumarating.
- source_word: וֶאֱמָר לָהּ
  choice: at sabihin sa kanya
  rationale: Malapit ito sa payak na kahulugan ng אמר at likas sa makabagong Tagalog.
- source_word: הֲשָׁלוֹם לָךְ
  choice: Mabuti ba ang kalagayan mo?
  rationale: Sa kontekstong ito, ang שָׁלוֹם ay tanong tungkol sa kabuuang kapakanan, hindi lamang sa kalusugan o kawalan ng alitan.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: Mabuti ba ang kalagayan ng asawa mo?
  rationale: Ang אִישׁ ay nangangahulugang “asawa” kaugnay ng babaeng kinakausap; iningatan din ang magkakatulad na ayos ng tatlong tanong.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: Mabuti ba ang kalagayan ng bata?
  rationale: Ang יֶלֶד ay maaaring “bata” o “batang lalaki.” Pinanatili ng “bata” ang mas malawak na leksikal na saklaw, habang ipinahihiwatig ng tiyak na parirala ang batang kilala sa salaysay.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: Sumagot siya, “Mabuti naman.”
  rationale: Ang maikling sagot na שָׁלוֹם ay likas na ipinahahayag sa Tagalog bilang katiyakang mabuti o maayos ang kalagayan; pinananatili ng maikling sagot ang pagpipigil ng Hebreo.
