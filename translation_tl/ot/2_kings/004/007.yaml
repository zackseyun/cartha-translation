translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Pinanatili ang tradisyonal ngunit malinaw na titulong “tao ng Diyos” at ang bahagyang pormal na “humayo,” habang iniwasan ang labis na arkaikong pananalita. Inilipat ang mga marker sa mga pariralang aktuwal na tinatalakay ng bawat talababa.
