  to: Pagkatapos, pumunta siya at sinabi niya ito sa tao ng Diyos. Sinabi ng tao ng Diyos, “Pumunta ka, ipagbili mo ang langis, at bayaran mo ang mga utang mo[a]. Ikaw at ang mga anak mong lalaki ay mabubuhay sa natitira[b].”
  rationale: Inayos ang di-likas na panghalip para malinaw na ang tao ng Diyos ang nagsasalita, pinalitan ang bahagyang pormal na “Humayo” ng modernong “Pumunta,” at ginawang “natitira” ang pangngalang tumutukoy sa nalalabing halaga. Pinanatili ang kahulugan, ang mga utang na maramihan, ang mga anak na lalaki, at ang mga angkla ng talababa.
