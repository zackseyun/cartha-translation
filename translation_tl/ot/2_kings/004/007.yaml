  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: tl
  text: Pagkatapos, pumunta siya at sinabi niya ito sa tao ng Diyos. Sinabi ng tao ng Diyos, “Pumunta ka, ipagbili mo ang langis, at bayaran mo ang mga utang mo[a]. Ikaw at ang mga anak mong lalaki ay mabubuhay sa natitira[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bayaran mo ang pinagkakautangan mo,” kung ang anyong Hebreo ay tumutukoy sa taong pinagkakautangan sa halip na sa utang mismo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ikaw at ang mga anak mong lalaki ay mabubuhay sa pamamagitan ng natitira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Pagkatapos, pumunta siya at sinabi ito
  rationale: Ang magkasunod na wayyiqtol ay nagpapasulong sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” para sa pagkakasunod, at nililinaw ng “ito” na ang iniulat niya ay ang naganap.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: sa tao ng Diyos
  rationale: Pinananatili ang literal at kinikilalang titulong Hebreo sa halip na tahasang ipakahulugang “propeta.” Sa Tagalog, ang “tao ng Diyos” ang natural na anyo ng pamagat.
- source_word: לְכִי מִכְרִי
  choice: Humayo ka, ipagbili mo
  rationale: Pinananatili ang dalawang pautos. Ang “humayo” ay marangal ngunit nauunawaan pa rin, samantalang ang “ipagbili” ay malinaw na tumutukoy sa langis bilang bagay na ibebenta.
- source_word: אֶת הַשֶּׁמֶן
  choice: ang langis
  rationale: Hindi idinagdag ang “olibo” sapagkat langis lamang ang tahasang sinasabi ng Hebreo.
- source_word: וְשַׁלְּמִי אֶת נשי/כי
  choice: at bayaran mo ang mga utang mo
  rationale: Sa kontekstong pinansiyal, ang שלם ay nangangahulugang magbayad o tumupad sa pagkakautang. Ang “mga utang” ay malinaw at natural, habang inilalagay sa talababa ang posibleng pagtukoy sa pinagkakautangan.
- source_word: וְאַתְּ בני/כי
  choice: Ikaw at ang mga anak mong lalaki
  rationale: Tahasan sa Hebreo ang mga anak na lalaki; pinananatili ito sa halip na gawing pangkalahatang “mga anak.”
- source_word: תִחְיִי בַּנּוֹתָר
  choice: ay mabubuhay sa matitira
  rationale: Ipinahihiwatig ng pandiwa ang patuloy na ikabubuhay mula sa natirang halaga. Ang salin ay maikli, natural, at malapit sa anyo ng Hebreo.
