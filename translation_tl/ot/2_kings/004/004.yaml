translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang payak na himig ng sunod-sunod na tagubilin. Ang “mga anak” ay hindi tinukoy bilang mga lalaki sa salin, sapagkat karaniwang sapat at natural ito sa Filipino sa kontekstong malinaw na tumutukoy sa mga anak ng babae.
