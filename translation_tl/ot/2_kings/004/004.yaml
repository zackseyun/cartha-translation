translation:
  language: tl
  text: Pagkatapos, pumasok ka at isara mo ang pinto sa likuran mo at ng iyong mga anak. Ibuhos mo ang langis sa lahat ng sisidlang ito[a], at itabi mo ang mga napuno na[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng lalagyang ito.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa iba’t ibang uri ng lalagyan.
    reason: lexical_alternative
  - marker: b
    text: 'Sa mas literal: “ang puno [na sisidlan].” Maaari rin itong unawain nang pangkalahatan bilang “ang mga napuno na.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  choice: Pagkatapos, pumasok ka
  rationale: Ang בוא ay tumutukoy rito sa pagpasok sa bahay o silid. Ang “Pagkatapos” ay likas na naghahayag ng pagkakasunod-sunod ng mga tagubilin.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: isara mo ang pinto
  rationale: Tumpak at karaniwang katumbas ng סגר ang “isara,” at ang anyong pautos ay angkop sa tuwirang tagubilin.
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: sa likuran mo at ng iyong mga anak
  rationale: Kapag ginagamit kasama ng pagsasara ng pinto, ipinahihiwatig ng בְּעַד na nakasara ang pinto sa likuran ng mga nasa loob. Pinananatili nito ang kongkretong larawang nasa Hebreo nang hindi nagpapahiwatig ng ibang teolohikal na diwa.
- source_word: וְיָצַקְתְּ עַל
  choice: Ibuhos mo ang langis sa
  rationale: Ang יצק ay “magbuhos.” Bagaman hindi inuulit sa Hebreo ang tahasang layon, malinaw sa konteksto na langis ang ibinubuhos; ang pagbanggit dito ay kailangan para sa natural at malinaw na Tagalog.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: lahat ng sisidlang ito
  rationale: Malawak ang saklaw ng כְּלִי at maaari itong tumukoy sa sari-saring lalagyan. Ang “sisidlan” ay dignified ngunit nauunawaan sa modernong Tagalog at hindi ito nililimitahan sa mga banga lamang.
- source_word: וְהַמָּלֵא
  choice: ang bawat mapuno
  rationale: Ang pang-isahang anyong may pantukoy ay maaaring gamiting pangkalahatan para sa alinmang sisidlang napupuno. Ang “bawat mapuno” ay natural sa Tagalog at naipahahayag ang paulit-ulit na gawaing ipinahihiwatig ng konteksto.
- source_word: תַּסִּיעִי
  choice: itabi mo
  rationale: Ang Hiphil ng נסע dito ay nangangahulugang alisin o ilipat mula sa lugar ng pagbubuhos. Ang “itabi” ang pinakanatural na paglalarawan sa praktikal na kilos.
