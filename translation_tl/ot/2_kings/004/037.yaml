  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: tl
  text: Dumating siya at bumagsak sa paanan ni Eliseo; yumukod siya hanggang sa lupa.[a] Pagkatapos, binuhat niya ang kanyang anak at lumabas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatirapa hanggang sa lupa.” Ang pandiwang Hebreo ay maaari ring isaling “sumamba” sa ibang konteksto, ngunit dito ay malamang na tumutukoy sa matinding paggalang kay Eliseo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Pagdating niya
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay. Likas sa modernong Tagalog ang “Pagdating niya” at malinaw na tumutukoy sa paglapit ng babae kay Eliseo.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: nagpatirapa siya sa paanan ni Eliseo
  rationale: Ipinahihiwatig ng parirala ang pagbagsak o pagpapatirapa sa paanan bilang pagpapakumbaba at matinding paggalang. Ginawang tahasan ang pangalang Eliseo upang maging malinaw ang tinutukoy ng panghalip sa Tagalog.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: yumukod hanggang sa lupa
  rationale: Inilalarawan nito ang pisikal na kilos ng malalim na pagyukod o pagpapatirapa. Hindi ginamit ang “sumamba” sapagkat hindi kinakailangang tumukoy rito sa pagsambang ukol sa Diyos.
- source_word: וַתִּשָּׂא אֶת־בְּנָהּ
  choice: binuhat niya ang kanyang anak
  rationale: Ang נשא ay maaaring mangahulugang mag-angat, magbuhat, o kumuha. Sa tagpong ito, natural at kongkreto ang “binuhat” para sa pagkarga niya sa kanyang anak.
- source_word: וַתֵּצֵא
  choice: lumabas
  rationale: Tuwirang katumbas ito ng simpleng kilos na isinasaad ng יצא at pinananatili ang maikling daloy ng salaysay.
theological_decisions:
- issue: Kahulugan ng וַתִּשְׁתַּחוּ kaugnay ni Eliseo
  choice: Isinalin bilang malalim na pagyukod sa harap ni Eliseo bilang pagpapakumbaba, pasasalamat, at paggalang.
  alternative: “sumamba” o “nagpatirapa”
  rationale: Maaaring tumukoy ang pandiwang Hebreo sa pagsamba o sa pagpugay ayon sa konteksto. Dahil si Eliseo ang nasa tagpo at ipinakikita ng babae ang kanyang pasasalamat matapos maibalik ang buhay ng anak niya, pinananatili ng “yumukod hanggang sa lupa” ang nakikitang kilos nang hindi ipinapalagay na pagsambang ukol sa Diyos ang ibig sabihin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na kilos at ang pagkakaiba ng pagbagsak sa paanan at pagyukod hanggang lupa, habang iniwasang ipakahulugan agad bilang pagsambang panrelihiyon ang kilos.
