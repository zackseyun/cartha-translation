  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: tl
  text: Pagkatapos, sinabi niya kay Gehazi na kanyang lingkod, “Tawagin mo ang babaeng Shunamita na ito.” Kaya tinawag niya siya, at tumayo siya sa harap niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi niya
  rationale: Ang waw-consecutive ay nagpapasulong sa salaysay. Likas sa modernong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod ng pangyayari.
- source_word: גֵּחֲזִי נַעֲרוֹ
  choice: kay Gehazi na kanyang lingkod
  rationale: Isinalin ang pangalang גֵּחֲזִי bilang “Gehazi.” Ang נַעַר ay maaaring tumukoy sa binata, tagapaglingkod, o alalay; sa konteksto, tungkulin ni Gehazi bilang lingkod ni Eliseo ang diin.
- source_word: קְרָא
  choice: Tawagin mo
  rationale: Ang pautos na anyo ng קרא ay nangangahulugang tawagin ang isang tao upang humarap. Ang “Tawagin mo” ay tuwiran at likas sa Filipino.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: ang Shunamitang ito
  rationale: Tinutukoy ng שׁוּנַמִּית ang isang babaeng mula sa Shunem. Sa Filipino, natural gamitin ang anyong pangngalang “Shunamita,” at pinananatili ng “ito” ang demonstratibong הַזֹּאת.
- source_word: וַיִּקְרָא לָהּ
  choice: Kaya tinawag niya ito
  rationale: Inuulit ng Hebreo ang pandiwang קרא. Ang “Kaya” ay malinaw na nag-uugnay sa pagsunod ni Gehazi sa utos.
- source_word: וַתַּעֲמֹד
  choice: at tumayo ito
  rationale: Ang עמד ay “tumayo” o “manatiling nakatayo.” Hindi idinagdag ang kilos na paglapit na wala sa tahasang teksto.
- source_word: לְפָנָיו
  choice: sa harapan niya
  rationale: Ang לִפְנֵי ay tumutukoy sa puwesto o presensiya sa harap ng isang tao. Ang “sa harapan niya” ay malinaw at dignidad ang himig.
