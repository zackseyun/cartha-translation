translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lingkod” sa halip na mas literal na “binata” dahil tungkulin ni Gehazi ang mahalaga sa konteksto. Pinanatili ang pag-uulit ng “tinawag” at ang payak na “tumayo” upang manatiling malapit sa Hebreo.
