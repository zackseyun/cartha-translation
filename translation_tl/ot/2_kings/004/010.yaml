base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: tl
  text: “Magpagawa tayo ng isang maliit na silid sa itaas, sa may pader[a]. Maglagay tayo roon para sa kaniya ng kama, mesa, upuan, at patungan ng ilawan. Sa tuwing pumupunta siya sa atin, maaari siyang tumuloy roon.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang maliit na silid sa itaas na may pader” o “isang maliit na silid sa itaas.” Maikli at hindi ganap na tiyak ang pariralang Hebreo; pinananatili ng “sa may pader” ang kongkretong salitang ginamit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “maaari siyang lumihis doon.” Sa kontekstong ito, ang pandiwa ay tumutukoy sa paghinto o pagtuloy roon upang manuluyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Ipagawan natin siya
  rationale: Ipinahihiwatig ng cohortative na may נָא ang magalang na mungkahi. Natural sa modernong Tagalog ang “Ipagawan natin” sa konteksto ng pagpapatayo ng silid; ang “siya” ay tumutukoy sa silid.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: isang maliit na silid sa itaas, sa may pader
  rationale: Ang עֲלִיָּה ay silid sa itaas, ang קְטַנָּה ay maliit, at pinananatili ng “sa may pader” ang kongkretong ngunit siksik at hindi ganap na tiyak na קִיר.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: Lagyan natin iyon ... para sa kaniya
  rationale: Ang שׂים ay ‘maglagay’; sa Tagalog, likas ang “lagyan natin iyon” kapag binabanggit ang mga kagamitang ilalagay sa silid. Pinananatili ng “para sa kaniya” ang לוֹ.
- source_word: מִטָּה
  choice: kama
  rationale: Ito ang malinaw at karaniwang katawagan sa higaan sa konteksto ng panunuluyan.
- source_word: שֻׁלְחָן
  choice: mesa
  rationale: Karaniwang modernong Tagalog para sa kasangkapang tinutukoy.
- source_word: כִסֵּא
  choice: upuan
  rationale: Sapat ang masaklaw at natural na “upuan” para sa kasangkapang pantahanan.
- source_word: מְנוֹרָה
  choice: patungan ng ilawan
  rationale: Tinutukoy ng salita ang lalagyan o patungan ng ilawan, hindi lamang ang ilawan; malinaw ito sa ordinaryong Tagalog.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Sa tuwing pumupunta siya sa atin
  rationale: Natural nitong ipinapahayag ang paulit-ulit na pangyayaring inaasahan sa konteksto, nang hindi mabigat na ginagaya ang Hebreong idyoma.
- source_word: יָסוּר שָׁמָּה
  choice: maaari siyang tumuloy roon
  rationale: Ang סוּר ay literal na ‘lumihis/pumunta sa isang tabi,’ ngunit sa konteksto ng paglalakbay ay tumutukoy sa paghinto at panunuluyan. Ang “tumuloy roon” ay natural at hindi nagpapahiwatig ng permanenteng pananatili.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “ipagawan” bilang karaniwang pahayag para sa pagpapatayo ng silid, at pinanatili sa talababa ang kawalang-katiyakan ng pariralang may קִיר. Lahat ng marker na [a] at [b] ay nasa pangunahing teksto.
