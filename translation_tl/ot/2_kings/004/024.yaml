translation:
  language: tl
  text: Pagkatapos, siniyahan niya ang asno at sinabi sa kanyang lingkod, “Paandarin mo ang asno at magpatuloy ka. Huwag mong pabagalin ang asno dahil sa akin habang nakasakay ako[a], maliban kung sabihin ko sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “huwag mong pigilan o pahintuin ang aking pagsakay.” Ang diwa ay huwag pabagalin o pahintuin ang asno dahil sa akin habang nakasakay ako.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: siniyahan niya ang asno
  rationale: Sa kontekstong ito, ang חבש ay paghahanda sa hayop upang masakyan, kaya natural ang “siniyahan.” Tiyak na babaeng asno ang אָתוֹן, ngunit hindi mahalaga rito ang kasarian nito at sapat ang karaniwang “asno.”
- source_word: נַעֲרָהּ
  choice: kanyang lingkod
  rationale: Ang נַעַר ay maaaring tumukoy sa isang binatang tagapaglingkod o alalay. Ipinahahayag ng “lingkod” ang tungkulin niya sa salaysay nang natural sa modernong Filipino.
- source_word: נְהַג וָלֵךְ
  choice: Patakbuhin mo ito at magpatuloy ka
  rationale: Ang נהג ay tumutukoy sa pag-akay o pagpapatakbo sa hayop, at kasama ng הלך ay nagpapahayag ng apurahang patuloy na paglalakbay.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: Huwag kang magbagal dahil sa akin habang nakasakay ako
  rationale: Maaaring mangahulugan ang עצר ng pagpigil, paghinto, o pagpapabagal. Ipinahahayag ng salin ang praktikal na diwa na huwag niyang bagalan o ihinto ang paglalakbay alang-alang sa babaeng nakasakay, habang itinatala sa talababa ang mas literal na anyo.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: maliban kung sabihin ko sa iyo
  rationale: Pagkatapos ng isang pagbabawal, ang כִּי אִם ay nagpapakilala ng tanging eksepsiyon; natural itong isalin na “maliban kung.”
