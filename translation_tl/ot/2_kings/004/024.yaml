- from: Pagkatapos, siniyahan niya ang asno at sinabi sa kanyang lingkod, “Patakbuhin mo ito at magpatuloy ka. Huwag kang magbagal dahil sa akin habang nakasakay ako[a], maliban kung sabihin ko sa iyo.”
  to: Pagkatapos, siniyahan niya ang asno at sinabi sa kanyang lingkod, “Paandarin mo ang asno at magpatuloy ka. Huwag mong pabagalin ang asno dahil sa akin habang nakasakay ako[a], maliban kung sabihin ko sa iyo.”
  rationale: Pinalitan ang “Patakbuhin mo ito” ng “Paandarin mo ang asno” upang maipahayag ang utos na itulak o akayin ang hayop pasulong nang hindi nagdaragdag na dapat itong tumakbo. Nilinaw rin ang saklaw ng pagbabawal at inayos ang talababa upang maging natural na Filipino habang pinananatili ang leksikal na ambigwidad ng עצר na maaaring “pigilan,” “pabagalin,” o “pahintuin.”
