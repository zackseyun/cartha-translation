  to: Sinabi niya, “Sa takdang panahong ito sa susunod na taon,[a] kakalungin mo ang isang anak na lalaki.” Ngunit sinabi niya, “Huwag po, panginoon ko, tao ng Diyos; huwag ninyo akong dayain, akong inyong lingkod na babae.”
