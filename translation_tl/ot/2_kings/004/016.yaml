base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: tl
  text: Sinabi niya, “Sa takdang panahong ito sa susunod na taon,[a] kakalungin mo ang isang anak na lalaki.” Ngunit sinabi niya, “Huwag po, panginoon ko, tao ng Diyos; huwag ninyo akong dayain, akong inyong lingkod na babae.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa panahong ito ng buhay”; isang idyomang tumutukoy sa ganitong panahon sa susunod na taon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: Sa takdang panahong ito
  rationale: Ang מוֹעֵד ay tumutukoy sa itinakda o tiyak na panahon; pinananatili ng “takdang panahon” ang diwang ito sa natural na Tagalog.
- source_word: כָּעֵת חַיָּה
  choice: sa susunod na taon
  rationale: Sa kontekstong ito, ang idyoma ay tumutukoy sa ganitong panahon sa susunod na taon. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang kakaibang pahayag ng Hebreo.
- source_word: אתי
  choice: ikaw (nakapaloob sa “kakalungin mo”)
  rationale: Binibigyang-diin ng hiwalay na panghalip ang babae; natural na naipahahayag ito sa Tagalog sa tuwirang hulang “kakalungin mo.”
- source_word: חֹבֶקֶת
  choice: kakalungin
  rationale: Ang pandiwari ay nangangahulugang yayakapin o hahawakan sa mga bisig. Ang “kakalungin” ay natural at malinaw para sa paghawak sa isang sanggol.
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Tiyak na anak na lalaki ang sinasabi ng Hebreo, kaya hindi ito ginawang pangkalahatang “anak” lamang.
- source_word: אַל
  choice: Huwag po
  rationale: Ang unang אַל ay masidhing pagtutol o pakiusap. Ang “Huwag po” ay likas sa magalang at emosyonal na tugon sa Tagalog.
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang na pantawag ito kay Eliseo, hindi pagtukoy sa Diyos. Pinananatili ng “panginoon ko” ang mapagpakumbabang tono ng Hebreo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang parirala ay titulong tumutukoy sa propeta. Mas natural sa modernong Tagalog ang “lingkod ng Diyos” kaysa literal na “tao ng Diyos,” bagaman bahagyang mas interpretibo ito.
- source_word: תְּכַזֵּב
  choice: bigyan ng huwad na pag-asa
  rationale: Maaaring mangahulugan ang pandiwa na magsinungaling, mandaya, o mapatunayang hindi totoo. Sa konteksto, hinihiling ng babae na huwag siyang paasahin sa isang pangakong hindi matutupad.
- source_word: בְּשִׁפְחָתֶךָ
  choice: ako na inyong lingkod
  rationale: Ang pangngalan ay pambabae at nagpapahayag ng pagpapakumbaba. Hindi kailangang markahan ang kasarian sa natural na Tagalog; pinananatili ng “inyong lingkod” ang paggalang.
theological_decisions:
- issue: Ang magalang na pantawag na אֲדֹנִי ay para sa tao
  choice: panginoon ko
  alternative: ginoo ko; amo ko
  rationale: Kay Eliseo nakatuon ang tawag at hindi sa Diyos. Pinananatili ang mataas na paggalang nang hindi ito itinuturing na banal na titulo.
- issue: Saklaw ng תְּכַזֵּב sa pakiusap ng babae
  choice: Huwag ninyo akong bigyan ng huwad na pag-asa
  alternative: Huwag ninyo akong dayain; huwag ninyo akong pagsinungalingan
  rationale: Ipinahahayag nito ang takot ng babae na ang ipinangakong anak ay maging isang pag-asang hindi magkakatotoo, habang hindi inaakusahan nang tahasan ang propeta ng sinasadyang pagsisinungaling.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magagalang na “po,” “ninyo,” at “inyong” upang ipakita ang paggalang ng babae kay Eliseo. Ang “kakalungin” ay mas likas at masigla kaysa “yayakapin” para sa paghawak sa isang sanggol.
