  text: Kaya umalis si Senaquerib, hari ng Asiria; naglakbay siya at nagbalik, at nanirahan sa Nineve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: umalis … at nagbalik
  rationale: Pinananatili ang pag-alis at pagbabalik na malinaw sa magkakasunod na pandiwang Hebreo, ngunit iniiwasan ang mabigat at di-likas na literal na pag-uulit na “umalis, yumaon, at bumalik” sa modernong Tagalog.
- source_word: וַיֵּשֶׁב
  choice: Doon siya nanirahan
  rationale: Ang pandiwa ay tumutukoy sa paninirahan o pananatili sa Nineve; ang “nanirahan” ay natural at angkop sa kontekstong ito.
- source_word: סַנְחֵרִיב
  choice: Senaquerib
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: אַשּׁוּר
  choice: Asiria
  rationale: Ginamit ang pamantayang makabagong anyong Filipino ng pangalan ng kaharian.
- source_word: נִינְוֵה
  choice: Nineve
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalan ng lungsod.
