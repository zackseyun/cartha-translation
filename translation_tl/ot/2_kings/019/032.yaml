source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: tl
  text: 'Kaya ganito ang sinabi ni Yahweh tungkol sa hari ng Asiria: “Hindi siya papasok sa lungsod na ito, ni magpapakawala roon ng palaso, ni lalapit dito na may kalasag,[a] ni magtatambak ng rampang pangkubkob laban dito.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ni haharap dito na may kalasag” o “ni susulong laban dito na may kalasag.” Malamang na tumutukoy ang Hebreo sa paglapit sa lungsod na protektado ng kalasag sa panahon ng pagkubkob.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bunton na pangkubkob” o “pilapil na pangkubkob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas at malinaw na naghuhudyat ng konklusyon mula sa naunang pahayag ng Diyos.
- source_word: כֹּה אָמַר
  choice: ganito ang sinabi
  rationale: Pinananatili ang karaniwang pormula ng mensaherong propetiko sa marangal at natural na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: tungkol sa hari ng Asiria
  rationale: Sa kontekstong ito, ipinakikilala ng אֶל ang taong paksa ng pahayag; mas natural sa Tagalog ang “tungkol sa” kaysa “sa” lamang.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Hindi siya papasok sa lungsod na ito
  rationale: Ang “papasok” ay malinaw na nagpapahayag ng hindi pagpasok sa loob ng lungsod, gaya ng ipinahihiwatig ng parirala.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: ni magpapana roon ng palaso
  rationale: Pinananatili ang tiyak na larawang militar ng pagpapakawala ng palaso at ang lokatibong “roon.”
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: ni lalapit dito na may kalasag
  rationale: Ipinahahayag ang paglapit sa lungsod na may kalasag nang hindi labis na tinutukoy ang eksaktong taktika; ang posibleng diwang pagharap o pagsulong ay inilagay sa talababa.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: ni magtatambak laban dito ng rampang pansalakay
  rationale: Isinasalin ang idyomang militar bilang pagtatayo o pagbubunton ng lupang rampa laban sa isang kinukubkob na lungsod.
- source_word: סֹלְלָה
  choice: rampang pansalakay
  rationale: Mas madaling maunawaan ng makabagong mambabasa bilang istrukturang itinatambak upang salakayin ang pader ng lungsod.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na gawing titulo.
- issue: Saklaw at katiyakan ng pahayag laban sa hari ng Asiria
  choice: 'Mga tiyak na negatibong panghinaharap: “Hindi siya… ni… ni…”'
  alternative: Mga utos o pagbabawal
  rationale: Ang mga anyong Hebreo ay nagpapahayag ng tiyak na mangyayari, hindi mga utos sa hari; kaya pinanatili ang lakas ng pangako o hula nang hindi dinaragdagan ang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkakatugmang “ni” upang mapanatili ang sunod-sunod na pagtanggi sa Hebreo. Ang mga panandang [a] at [b] ay inilagay sa mismong pariralang tinutukoy ng bawat talababa.
