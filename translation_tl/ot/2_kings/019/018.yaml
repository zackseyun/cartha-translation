source:
  edition: WLC
  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: tl
  text: At inihagis nila sa apoy ang kanilang mga diyos[a], sapagkat hindi mga diyos ang mga ito kundi mga gawang kamay ng tao—kahoy at bato—kaya winasak nila ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inilagay nila sa apoy.” Ang pandiwang Hebreo ay literal na “nagbigay/naglagay,” ngunit dito ay ginamit sa diwang paghahagis o paglalagay ng isang bagay sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: inihagis nila
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay/maglagay,” ngunit kasama ng בָּאֵשׁ ay tumutukoy rito sa paghahagis o paglalagay sa apoy upang sunugin. Natural at malinaw sa modernong Tagalog ang “inihagis.”
- source_word: אֱלֹהֵיהֶם
  choice: ang kanilang mga diyos
  rationale: Pinananatili ang literal na “mga diyos,” sa halip na “mga diyus-diyosan,” upang mapanatili ang retorikal na pagtanggi ng kasunod na sugnay na hindi sila tunay na mga diyos.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Sa Tagalog, ang “inihagis sa apoy” ay likas na nagpapahayag ng kilos patungo sa loob ng apoy; hindi kailangang dagdagan ng “papasok.”
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: sapagkat ang mga iyon ay hindi tunay na mga diyos
  rationale: Ipinahahayag ng sugnay ang dahilan at itinatanggi ang tunay na pagka-diyos ng mga bagay na tinatawag na mga diyos. Ang “tunay” ay nagpapalinaw sa likas na diwa ng pagtanggi nang gawing “diyus-diyosan” ang naunang katawagan.
- source_word: כִּי אִם
  choice: kundi
  rationale: Ang “kundi” ang natural at tuwirang panimbang sa hulma na “hindi…kundi…” sa modernong Tagalog.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: gawa lamang ng mga kamay ng tao
  rationale: Pinananatili nito ang larawan ng mga bagay na nilikha ng kamay ng tao at ang kaibahan nila sa Diyos. Ipinahihiwatig ng “lamang” ang mariing kontrast ng כִּי אִם.
- source_word: עֵץ וָאֶבֶן
  choice: kahoy at bato
  rationale: Tuwiran at natural na paglalarawan sa materyales na pinagmulan ng mga diyos na ito.
- source_word: וַיְאַבְּדוּם
  choice: kaya nawasak nila ang mga iyon
  rationale: 'Binabasa ang pandiwa bilang palipat: ang mga mananalakay ang sumira sa mga iyon. Ipinahahayag ng “kaya” ang bunga ng pagiging mga gawang kahoy at bato lamang.'
theological_decisions:
- issue: Pagtukoy sa mga imahen bilang אֱלֹהֵיהֶם bago itanggi ang kanilang pagka-diyos
  choice: kanilang mga diyos … hindi tunay na mga diyos
  alternative: kanilang mga diyus-diyosan
  rationale: Ang “mga diyos” ay nagpapanatili sa tawag ng mga bansa sa mga iyon, habang ang kasunod na sugnay mismo ang tahasang tumatanggi sa kanilang tunay na pagka-diyos. Hindi paunang nilulutas ng salin ang retorikal na tensiyon.
- issue: Pangkalahatang kahulugan ng אָדָם
  choice: tao
  alternative: lalaki / sangkatauhan
  rationale: Ang אָדָם dito ay tumutukoy sa tao sa pangkalahatan, hindi sa isang lalaking indibidwal. Likas at inklusibo ang pariralang “mga kamay ng tao.”
- issue: Paksa at layon ng וַיְאַבְּדוּם
  choice: nawasak nila ang mga iyon
  alternative: at nalipol ang mga iyon
  rationale: 'Ang anyo ay pinakamainam unawain bilang palipat, na may pangmaramihang paksa at hulaping pangmaramihang layon: winasak ng mga mananalakay ang mga gawang diyos.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ang mga iyon” para sa malinaw at magalang na pagtukoy sa mga bagay; pinanatili ang masiglang larawan ng “mga kamay ng tao” at ang retorikal na kaibahan ng mga diumano'y diyos sa mga bagay na yari lamang sa kahoy at bato.
