  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: tl
  text: Kaya bumalik ang Rabsake at natagpuan niya ang hari ng Asiria na nakikipagdigma laban sa Libna, sapagkat nabalitaan niyang umalis na ang hari ng Asiria mula sa Lakis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumisan mula sa Lakis” o “nag-alis ng kampo mula sa Lakis.” Ang pandiwang Hebreo ay maaaring tumukoy sa pag-alis, paghayo, o pag-alis ng kampo sa kontekstong militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Tuwirang ipinahahayag ng שׁוּב ang pagbabalik sa dating kinaroroonan o sa pinanggalingang pangkat, at natural ito sa makabagong Tagalog.
- source_word: רַב שָׁקֵה
  choice: ang Rabsake
  rationale: Pinanatili bilang kilalang titulong Asirio na ginagamit na parang pantukoy sa tauhan; iniiwasan nito ang mapanlinlang na pagpapakahulugang nakabatay lamang sa literal na tungkulin.
- source_word: וַיִּמְצָא אֶת
  choice: natagpuan niya
  rationale: Malapit sa tuwirang kahulugan ng מָצָא at malinaw na pinananatili ang paksa at layon sa Tagalog.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ang hari ng Asiria
  rationale: Natural at pormal na salin ng pariralang konstrakto.
- source_word: נִלְחָם עַל
  choice: nakikipaglaban sa
  rationale: Ipinakikita ng anyong participle ang nagpapatuloy na kilos militar laban sa isang lunsod; sa Tagalog, malinaw sa konteksto na ang “sa Libna” ay tumutukoy sa paglusob o pakikipagdigma laban dito.
- source_word: לִבְנָה
  choice: Libna
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: כִּי שָׁמַע
  choice: sapagkat nabalitaan niya
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang “nabalitaan” ay natural na paglalarawan sa pagkarinig ng ulat sa kontekstong militar.
- source_word: כִּי נָסַע
  choice: na umalis na ito
  rationale: Maaaring mangahulugan ang נָסַע ng pag-alis, paghayo, o pagliligpit ng kampo. Pinananatili ng “umalis” ang malawak na kahulugan, habang nililinaw ng “ito” na ang hari ng Asiria ang paksa.
- source_word: מִלָּכִישׁ
  choice: sa Lakis
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar, kasama ang likas na gamit ng “sa” matapos ang pandiwang “umalis.”
