  source_fidelity: Tumpak ang pangunahing daloy ng salaysay at ang mga pangalan. Gayunman, ang “nakikipaglaban sa Libna” ay maaaring mangahulugang nakikipaglaban doon, samantalang ang עַל ay malinaw na nagtuturo ng kilos-militar laban sa lunsod. Ang panghalip na “ito” sa huling sugnay ay maaari ring maging malabo sa Tagalog; dapat malinaw na ang hari ng Asiria ang umalis mula sa Lakis.
  naturalness: Marangal at modernong Tagalog ang draft, ngunit mas malinaw at natural sa kontekstong militar ang “nakikipagdigma laban sa Libna.” Ang pag-uulit ng “ang hari ng Asiria” sa pangwakas na sugnay ay iwas sa hindi kinakailangang kalabuan ng panghalip.
  terminology: Ang “Rabsake,” “Asiria,” “Libna,” at “Lakis” ay angkop. Pinananatili ang Rabsake bilang titulo/pantukoy, hindi bilang mapanlinlang na functional gloss.
