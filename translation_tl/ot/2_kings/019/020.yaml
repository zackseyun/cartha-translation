  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: tl
  text: 'Pagkatapos, nagpasabi si Isaias na anak ni Amoz kay Ezequias: “Ganito ang sinabi ni Yahweh, ang Diyos ng Israel: Narinig ko ang idinalangin mo sa akin tungkol kay Senakerib na hari ng Asiria.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagpasabi
  rationale: Sa kontekstong ito, ipinadala ni Isaias ang isang mensahe kay Ezequias; mas natural sa modernong Tagalog ang “nagpasabi” kaysa literal na “nagpadala.”
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili ang pormulang propetiko sa malinaw at dignified na modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ ... שָׁמָעְתִּי
  choice: Narinig ko ang idinalangin mo
  rationale: Ang אֲשֶׁר ay maaaring magpakilala sa nilalaman o paksa ng narinig. Ang ayos na ito ay natural sa Tagalog at hindi nagdaragdag ng tahasang sanhi na wala sa Hebreo.
- source_word: אֶל סַנְחֵרִב
  choice: tungkol kay Senakerib
  rationale: Ang אֶל dito ay tumutukoy sa paksa o laban kanino nauukol ang panalangin; “tungkol kay” ang natural na katumbas.
theological_decisions:
- issue: Kung ang panalangin ang sanhi ng pakikinig ng Diyos
  choice: Narinig ko ang idinalangin mo
  alternative: Dahil idinalangin mo sa akin ... narinig ko
  rationale: Hindi ginagawang tiyak na sanhi ang אֲשֶׁר. Pinananatili nitong bukas ang ugnayan sa pagitan ng panalangin at ng “narinig ko,” nang hindi ipinapasok ang mas tiyak na “dahil.”
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pagbasa sa Bibliya. Ginamit ang karaniwang Tagalog na anyo ng mga pangalan: Isaias, Ezequias, Senakerib, at Asiria.'
