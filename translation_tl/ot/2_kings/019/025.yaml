base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: tl
  text: Hindi mo ba narinig? Matagal ko na itong ginawa[a]; mula pa noong unang panahon ay hinubog ko ito. Ngayon ay isinakatuparan ko ito[b], kaya nagawa mong gawing mga bunton ng guho ang mga lunsod na may tanggulan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa malayo.” Maaaring tumukoy sa layo ang pariralang Hebreo, ngunit sa kontekstong ito ay malamang na tumutukoy ito sa napakatagal nang panahon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dinala ko ito.” Dito, ang diwa ay na pinangyari o isinakatuparan ng Diyos ang dati na niyang binuo.
    reason: idiom
  - marker: c
    text: Mahirap unawain nang tiyak ang pariralang Hebreo; maaari rin itong isaling “nakatayong mga bunton.”
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Hindi mo ba narinig?
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: לְמֵרָחוֹק
  choice: Matagal ko na
  rationale: Bagaman maaari itong tumukoy sa layo, ang kaagapay na pariralang לִימֵי קֶדֶם ay nagpapahiwatig dito ng malayong nakaraan; natural itong ipinahahayag sa modernong Tagalog bilang “matagal ko na.”
- source_word: אֹתָהּ עָשִׂיתִי
  choice: itong ginawa
  rationale: Ang pambabaeng panghalip ay tumutukoy sa ipinlanong pangyayari o gawain; hindi ito minarkahan ng kasarian sa Tagalog.
- source_word: לִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: mula pa sa mga araw noong unang panahon ay hinubog ko na ito
  rationale: Ang “hinubog” ay nagpapanatili sa larawan ng יצר bilang pagbuo o paghubog, sa halip na tahasang paliitin ito sa intelektuwal na pagpaplano lamang.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Ngayon ay isinakatuparan ko ito
  rationale: Sa konteksto, ang literal na pagdadala ay tumutukoy sa pagsasakatuparan ngayon ng matagal nang binuong layunin.
- source_word: וּתְהִי לַהְשׁוֹת
  choice: upang gawin mong
  rationale: Ipinahahayag ang layunin o bunga at pinananatiling ang haring Asirio ang gumagawa ng pagwasak sa loob ng layunin ng Diyos.
- source_word: עָרִים בְּצֻרוֹת
  choice: mga lunsod na may tanggulan
  rationale: Malinaw at natural na salin ng mga bayang pinatibay para sa pagtatanggol.
- source_word: גַּלִּים נִצִּים
  choice: mga bunton ng guho
  rationale: Ipinahahayag ang larawang iniwan ng ganap na pagkawasak, habang kinikilala sa talababa na mahirap at hindi ganap na tiyak ang pariralang Hebreo.
theological_decisions:
- issue: Ang kapangyarihan ng Diyos sa mga pananakop ng Asiria
  choice: Ipinakikitang matagal nang binuo ng Diyos ang layunin at siya ang nagsakatuparan nito, samantalang ang haring Asirio ang tahasang gumagawa ng pagwasak.
  alternative: Maaaring palakasin ang pananalita bilang tuwirang pag-uutos sa bawat kilos ng Asiria, o pahinain bilang paunang kaalaman lamang.
  rationale: Binibigyang-diin ng Hebreo ang naunang paggawa at paghubog ng Diyos at ang kasalukuyang pagsasakatuparan niya, ngunit hindi nito tahasang sinasagot ang lahat ng pilosopikal na tanong tungkol sa sanhi o ipinahihiwatig na sinasang-ayunan niya sa moral ang karahasan ng Asiria.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “mga lunsod na may tanggulan” at “mga bunton ng guho” ay madaling maunawaan ngunit nananatiling malapit sa larawang militar ng Hebreo. Iniwasan ang sobrang arkaikong pananalita at ang pagpasok ng denominasyonal na paliwanag.
