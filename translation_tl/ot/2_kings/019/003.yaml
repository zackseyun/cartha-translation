  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: tl
  text: 'Sinabi nila sa kanya, “Ganito ang sabi ni Hezekias: Ang araw na ito ay araw ng kagipitan, pagsaway, at paghamak[c]. Sapagkat umabot na ang mga anak sa sandali ng panganganak[a][b], ngunit wala nang lakas para sa panganganak.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Larawan ito ng paghilab at panganganak: umabot na sa sandali ng panganganak, ngunit wala nang lakas upang mailuwal ang anak.'
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin ang מַשְׁבֵּר bilang “dakong panganganakan” o “bukana ng sinapupunan.” Mahirap tiyakin kung tumutukoy ito sa lugar o sa sandali ng paglabas ng sanggol.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pag-alipusta” o “kahihiyan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Likas at marangal na katumbas sa Filipino ng karaniwang pormula ng mensahero; ipinahahayag nito ang kasalukuyang bisa ng mensahe.
- source_word: יוֹם צָרָה
  choice: araw ng kagipitan
  rationale: Ipinahihiwatig ng צָרָה ang matinding kalagayang gipit o kapighatian; malinaw at mabigat ang “kagipitan” nang hindi dinaragdagan ang kahulugan.
- source_word: וְתוֹכֵחָה
  choice: pagsaway
  rationale: Pinananatili nito ang diwa ng rebuke o reproof at hindi tahasang nagpapasya kung kanino nagmumula ang pagsaway.
- source_word: וּנְאָצָה
  choice: paghamak
  rationale: Sinasaklaw nito ang contempt o scornful insult at iniiwasang paliitin ang salita sa “pamumusong” lamang.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: Dumating na ang mga sanggol sa sandali ng pagsilang
  rationale: Pinananatili ang larawan ng panganganak at ang pagdating sa mapagpasyang sandali, habang ginagawang mauunawaan sa modernong Filipino ang mahirap na מַשְׁבֵּר.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: ngunit walang lakas upang manganak
  rationale: 'Direktang inilalahad ang kasukdulan ng talinghaga: dumating na ang sandali ng pagsilang ngunit kulang ang lakas para maisakatuparan ito.'
- source_word: בָנִים
  choice: mga sanggol
  rationale: Bagaman literal na “mga anak,” ang tinutukoy sa talinghaga ay mga batang isisilang; mas malinaw sa Filipino ang “mga sanggol” at hindi nito nililimitahan ang kasarian.
theological_decisions:
- issue: Pinagmumulan at uri ng “pagsaway”
  choice: pagsaway
  alternative: parusa
  rationale: Hindi tahasang sinasabi ng talata kung banal na parusa, pampublikong paninisi, o paghatol ang tinutukoy; pinananatili ng “pagsaway” ang lawak ng salitang Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matinding tatluhang paglalarawan at ang sadyang nakagugulat na talinghaga ng panganganak. Ginamit ang “Hezekias,” ang karaniwang anyong Filipino ng pangalan.
