id: 2KI.19.13
reference: 2 Kings 19:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַיּ֤/וֹ מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: tl
  text: Nasaan ang hari ng Hamat, ang hari ng Arpad, at ang hari ng lungsod ng Sefarvaim, Hena,[a] at Iva?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin ang pangalang ito na “Henah” sa ilang tradisyon ng transliterasyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיּוֹ
  choice: Nasaan
  rationale: Likas na katumbas sa Filipino ng pang-abay na patanong na may panlalaking pang-isahang hulapi; sa kontekstong ito, mapanuyang itinatanong ang kinaroroonan o sinapit ng mga hari.
- source_word: מֶלֶךְ
  choice: hari
  rationale: Karaniwang katumbas ng מֶלֶךְ. Pinanatili ang pag-uulit kung saan tahasan itong inuulit sa Hebreo upang mapanatili ang retorikal na diin.
- source_word: חֲמָת
  choice: Hamat
  rationale: Isinalin sa baybay-Filipino bilang pangalang-pook, na kumakatawan sa pangwakas na katinig ng Hebreo nang hindi gumagamit ng tahimik na h.
- source_word: אַרְפָּד
  choice: Arpad
  rationale: Tuwirang transliterasyon ng pangalang-pook sa anyong madaling basahin sa Filipino.
- source_word: לָעִיר
  choice: ng lungsod ng
  rationale: Pinananatili ang tahasang עִיר, 'lungsod,' at inilalahad ang kaugnayan nito sa hari sa likas na pariralang Filipino.
- source_word: סְפַרְוָיִם
  choice: Sefarvaim
  rationale: Transliterasyon ng pangalang-pook ayon sa mga katinig at patinig ng tekstong Hebreo, sa baybay na angkop sa Filipino.
- source_word: הֵנַע
  choice: Hena
  rationale: Transliterasyon ng pangalang-pook ayon sa anyong Masoretiko; pinanatiling hiwalay sa Sefarvaim gaya ng pagkakasunod ng mga pangalan sa Hebreo.
- source_word: וְעִוָּה
  choice: at Iva
  rationale: Ang וְ ay isinaling 'at,' at ang pangalang-pook ay isinalin sa baybay-Filipino. Hindi idinagdag ang 'ng' sapagkat hindi tahasang nililinaw ng Hebreo ang eksaktong sintaktikong ugnayan ng huling mga pangalan.
theological_decisions:
- issue: Ugnayan ng Sefarvaim, Hena, at Iva sa pariralang “hari ng lungsod”
  choice: 'Pinanatili ang mga pangalan bilang sunod-sunod na talaan: “ng lungsod ng Sefarvaim, Hena, at Iva”'
  alternative: “ng lungsod ng Sefarvaim, ng Hena, at ng Iva” o pag-uulit ng “hari ng” sa bawat pangalan
  rationale: Walang bagong מֶלֶךְ o pang-ukol bago ang Hena, at tanging pangatnig ang nasa unahan ng Iva. Ang piniling anyo ay hindi nagdaragdag ng sintaktikong katiyakang wala sa pinagmulang teksto at pinananatili ang bahagyang tensiyon ng talaan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Nasaan” upang mapanatili ang tuwiran at mapanuyang tanong. Inangkop sa baybay-Filipino ang mga pangalang Hebreo habang iniwasang gawing mas tiyak kaysa sa orihinal ang malabong ugnayan ng huling tatlong pangalang-pook.
