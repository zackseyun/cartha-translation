  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: tl
  text: Sa daang dinaanan niya sa pagparito, doon din siya babalik, at hindi siya darating sa lungsod na ito—pahayag ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: Sa daang dinaanan niya sa pagparito, doon din
  rationale: Ang דֶּרֶךְ ay ‘daan’ o ‘ruta,’ at ang בָּהּ ay tumutukoy pabalik rito. Likas sa Tagalog ang konstruksiyong ‘sa daang… doon din’ upang ipahayag na ang mismong rutang dinaanan sa pagdating ang daraanan sa pagbabalik.
- source_word: יָשׁוּב
  choice: siya babalik
  rationale: Ang שׁוּב ay nagsasaad ng pagbabalik o pag-urong sa pinanggalingan; malinaw at marangal ang ‘babalik.’
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: hindi siya makararating sa lungsod na ito
  rationale: Pinananatili ng ‘makararating sa’ ang diwang paglapit o pagdating sa lungsod nang hindi idinaragdag ang mas tiyak na kahulugang ‘papasok,’ na wala sa pandiwa mismo.
- source_word: נְאֻם יְהוָה
  choice: pahayag ni Yahweh
  rationale: Ang נְאֻם ay pormulang propetiko na nagpapakilala sa taimtim at tiyak na kapahayagan; ‘pahayag ni’ ang natural at dignipikadong katumbas. Ang personal na pangalang יְהוָה ay isinaling ‘Yahweh.’
theological_decisions:
- issue: Paglalarawan sa katiyakan ng sinabi tungkol sa mananalakay
  choice: Gumamit ng panghinaharap na ‘babalik’ at ‘hindi… makararating’
  alternative: Gumamit ng modal na ‘dapat bumalik’ o ‘maaaring hindi makarating’
  rationale: Ang mga anyong pandiwa sa konteksto ay nagpapahayag ng tiyak na mangyayari, hindi ng utos o posibilidad.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, dignipikado, at madaling maunawaan. Ginamit ang ‘doon din’ upang likas na maipakita ang anaporikong בָּהּ at ang ideya ng pagbabalik sa parehong ruta; iniwasan ang ‘papasok’ sapagkat mas tiyak iyon kaysa sa literal na ‘darating sa.’
