base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: tl
  text: Sapagkat ang pagngangalit mo laban sa akin at ang pagiging kampante mo ay umabot sa aking mga tainga[a], ilalagay ko ang aking kawit sa ilong mo at ang aking pangaw sa mga labi mo. Ibabalik kita sa daang dinaanan mo sa pagdating mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kapalaluan mo” o “tiwala mo sa sarili.” Ang salitang Hebreo ay tumutukoy sa pagiging panatag o may-kumpiyansang seguridad; sa kontekstong ito, negatibo ang dating nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Dahil sa
  rationale: Malinaw at likas na panandang sanhi sa modernong Tagalog, at ipinakikilala nito ang dahilan ng hatol.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: pagngangalit mo laban sa akin
  rationale: Ipinahahayag ng “pagngangalit” ang marahas at mapanghamong galit, samantalang pinananatili ng “laban sa akin” ang tuwirang pagsalungat sa Diyos.
- source_word: שַׁאֲנַנְךָ
  choice: pagiging kampante mo
  rationale: Pinananatili nito ang batayang diwa ng panatag at tiwalay na seguridad, na sa konteksto ay may negatibong kulay ng kapalaluan; inilalagay sa talababa ang mas tahasang mga alternatibo.
- source_word: עָלָה בְאָזְנָי
  choice: umabot sa aking mga tainga
  rationale: Pinananatili ang konkretong larawan ng mga tainga habang inihahayag sa likas na Tagalog ang idyomang Hebreo na nangangahulugang narinig ng Diyos.
- source_word: חַחִי בְּאַפֶּךָ
  choice: ang aking kawit sa ilong mo
  rationale: Ang “kawit” ay malinaw na larawan ng kasangkapang ginagamit upang sapilitang kontrolin ang hayop o bihag; literal na pinananatili ang “ilong.”
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: ang bakal ng aking renda sa mga labi mo
  rationale: Ang “bakal ng renda” ay mauunawaang bahagi ng renda na ipinapasok sa bibig upang kontrolin ang hayop, at pinananatili ng “mga labi” ang partikular na larawan ng Hebreo.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: Ibabalik kita
  rationale: Tuwirang ipinahahayag ang sanhiang anyo ng pandiwa at ang kapangyarihan ng Diyos na sapilitang pauwiin ang kausap.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: sa daang dinaanan mo nang pumarito ka
  rationale: 'Likas na Tagalog na pinananatili ang simetriya ng hatol: pauuwiin ang mananalakay sa mismong rutang ginamit niya sa pagdating.'
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pakikinig ng Diyos at pagpigil niya sa hari ng Asiria
  choice: Panatilihin ang mga konkretong larawan ng “aking mga tainga,” “aking kawit,” at “aking renda.”
  alternative: Gawing mga abstraksiyon gaya ng “narinig ko” at “kokontrolin kita.”
  rationale: Ipinakikita ng matingkad na larawan ang lubos na kaalaman at kapangyarihan ng Diyos at ang kahihiyang sasapitin ng mapagmataas na hari, nang walang idinaragdag na haka-haka tungkol sa kalikasan ng Diyos.
- issue: Saklaw ng kahulugan ng שַׁאֲנַנְךָ
  choice: Gamitin sa pangunahing teksto ang “pagiging kampante mo.”
  alternative: “kapalaluan mo” o “tiwala mo sa sarili”
  rationale: Ang salitang Hebreo ay pangunahing tumutukoy sa pagiging panatag o tiwasay, ngunit sa kontekstong ito ay may mapanumbat na diwa. Pinananatili ng salin ang tunay na saklaw ng salita sa halip na lubusang ipakahulugan ito bilang kapalaluan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bakal ng renda” upang maging malinaw sa karaniwang mambabasa ang teknikal na larawang tumutukoy sa bit, at iniwasan ang mas lumang mga salitang maaaring hindi na pamilyar.
