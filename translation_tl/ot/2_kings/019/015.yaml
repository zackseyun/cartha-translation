revisions:
- from: At nanalangin si Ezequias sa harapan ni Yahweh at sinabi, “Yahweh, Diyos ng Israel, na nakaluklok sa ibabaw ng mga kerubin,[a] ikaw lamang ang Diyos ng lahat ng kaharian sa lupa. Ikaw ang gumawa ng kalangitan at ng lupa.”
  to: At nanalangin si Ezequias sa harapan ni Yahweh at sinabi, “Yahweh, Diyos ng Israel, na nakaluklok sa ibabaw ng mga kerubin,[a] ikaw lamang ang Diyos na namamahala sa lahat ng kaharian sa lupa. Ikaw ang gumawa ng kalangitan at ng lupa.”
  rationale: Binago ang parirala tungkol sa mga kaharian upang malinaw na maipahayag ang natatanging pagka-Diyos at pandaigdigang paghahari ni Yahweh. Inayos ang talababa upang mapanatili ang kalabuan ng Hebreo hinggil sa eksaktong relasyong panlunan sa mga kerubin, nang hindi itinatanggi ang kontekstuwal na larawan ng pagluklok.
