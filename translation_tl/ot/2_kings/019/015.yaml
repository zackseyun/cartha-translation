  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: tl
  text: At nanalangin si Ezequias sa harapan ni Yahweh at sinabi, “Yahweh, Diyos ng Israel, na nakaluklok sa ibabaw ng mga kerubin,[a] ikaw lamang ang Diyos na namamahala sa lahat ng kaharian sa lupa. Ikaw ang gumawa ng kalangitan at ng lupa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na nakaluklok sa mga kerubin.” Ang Hebreo ay may pandiwang “nakaupo/nananahan” na kaugnay ng “mga kerubin,” ngunit walang tahasang pang-ukol; ito ay isang maharlika at panambahang larawan ng paghahari ni Yahweh. Ang “sa gitna ng mga kerubin” ay isang interpretatibong pagbasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: nanalangin
  rationale: Ito ang tuwiran at likas na katumbas ng karaniwang kahulugang ‘manalangin.’
- source_word: לִפְנֵי יְהוָה
  choice: sa harapan ni Yahweh
  rationale: Pinananatili nito ang diwang ‘sa harap/sa presensiya’ ng Diyos habang nananalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Diyos ng Israel
  rationale: Tuwiran at natural na salin ng pariralang konstrakto at angkop bilang pagtawag sa panalangin.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: nakaluklok sa ibabaw ng mga kerubin
  rationale: Ipinahahayag ng ‘nakaluklok’ ang maharlika at pangkultong larawan ng paghahari; ipinapakita sa talababa ang posibleng saklaw ng ugnayang panlunan.
- source_word: אַתָּה הוּא הָאֱלֹהִים ... לְבַדְּךָ
  choice: ikaw lamang ang Diyos
  rationale: Malinaw at natural nitong pinananatili ang diin sa pagiging tanging Diyos.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: ng lahat ng kaharian sa lupa
  rationale: Pinananatili ang kaugnayan ng Diyos sa lahat ng kaharian nang hindi labis na pinipili ang mas interpretatibong ‘namumuno sa.’
- source_word: עָשִׂיתָ
  choice: gumawa
  rationale: Tuwirang katumbas ito ng עָשָׂה; hindi nito ipinapalit ang mas teknikal na bokabularyo para sa ‘lumalang.’
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ang kalangitan at ang lupa
  rationale: Pinananatili ng ‘kalangitan’ ang anyong maramihan ng Hebreo at ang karaniwang pormulang tumutukoy sa buong nilikha.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Eksklusibong pahayag tungkol sa Diyos
  choice: ikaw lamang ang Diyos ng lahat ng kaharian sa lupa
  alternative: ikaw ang Diyos—ikaw lamang—para sa lahat ng kaharian sa lupa
  rationale: Pinananatili nito ang malinaw na eksklusibong diin ng אַתָּה הוּא ... לְבַדְּךָ at ang pandaigdigang saklaw nito nang hindi nagdaragdag ng isang mas huling pormulang doktrinal.
- issue: Larawan ng Diyos kaugnay ng mga kerubin
  choice: nakaluklok sa ibabaw ng mga kerubin
  alternative: nananahan sa gitna ng mga kerubin
  rationale: Ang konteksto ay may larawang maharlika ng pagluklok, ngunit hindi ganap na itinatakda ng Hebreo ang eksaktong relasyong panlunan; kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Ezequias” at “kerubin” bilang pamilyar na anyong biblikal, habang iniwasan ang labis na makaluma o denominasyonal na pananalita.
