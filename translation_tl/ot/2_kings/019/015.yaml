    text: Maaari ring “na nakaluklok sa mga kerubin.” Ang Hebreo ay may pandiwang “nakaupo/nananahan” na kaugnay ng “mga kerubin,” ngunit walang tahasang pang-ukol; ito ay isang maharlika at panambahang larawan ng paghahari ni Yahweh. Ang “sa gitna ng mga kerubin” ay isang interpretatibong pagbasa.
    reason: lexical_alternative
