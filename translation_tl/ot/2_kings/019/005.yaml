  text: So the servants of King Hezekiah came to Isaiah.
translation:
  language: tl
  text: At pumunta kay Isaias ang mga lingkod ni Haring Ezequias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kaya pumunta
  rationale: Ang wayyiqtol ng בוא ay nagsasalaysay ng kasunod na pangyayari. Natural sa makabagong Tagalog ang “Kaya pumunta” sa kontekstong ito, nang hindi labis na pinatitindi ang ugnayang sanhi at bunga.
- source_word: עַבְדֵי
  choice: ang mga lingkod ni
  rationale: Ang construct plural ng עבד ay maaaring tumukoy sa mga lingkod, tagapaglingkod sa palasyo, o opisyal. Pinananatili ng “mga lingkod” ang payak na leksikal na diwa nang hindi nililimitahan sa “mga opisyal.”
- source_word: הַמֶּלֶךְ
  choice: Haring
  rationale: Ang tiyak na pangngalan na kaugnay ng pangalang Ezequias ay nagpapakilala sa kaniyang katayuang maharlika; “Haring Ezequias” ang natural na ayos sa Tagalog.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: אֶל
  choice: kay
  rationale: Ipinahihiwatig ng pang-ukol ang pagkilos patungo sa isang tao; natural itong ipinapahayag sa Tagalog sa pariralang “pumunta kay.”
- source_word: יְשַׁעְיָהוּ
  choice: Isaias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan ng propeta sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Inuna ang pariralang “kay Isaias” upang maging magaan ang daloy at maiwasan ang alanganing “pumunta ang ... kay ...,” habang pinananatili ang buong kahulugan ng Hebreo.
