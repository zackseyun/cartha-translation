translation:
  language: tl
  text: At ang nakaligtas na nalabi ng sambahayan ng Juda ay muling mag-uugat pababa at mamumunga paitaas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang nalabi ng sambahayan ng Juda na nananatili.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפָה
  choice: ay muling
  rationale: Ang pandiwang יסף ay nagpapahayag dito ng panibago o ipinagpapatuloy na pagkilos. Ang “muling” ay natural na naghahatid ng diwa ng pagpapanumbalik nang hindi ginagamit ang literal ngunit alanganing “magdaragdag.”
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: ang nalabi ... na nakaligtas
  rationale: Pinananatili nito ang magkaugnay ngunit hindi ganap na magkaparehong ideya ng isang nalabi at ng pagkaligtas o pananatili nito matapos ang kapahamakan.
- source_word: בֵּית יְהוּדָה
  choice: sambahayan ng Juda
  rationale: Pinananatili ang tahasang larawan ng “bahay/sambahayan” bilang katawagan sa bayang Juda, sa halip na paikliin ito bilang “Juda” lamang.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: mag-uugat pababa
  rationale: Ginagawang likas na pandiwa sa Tagalog ang literal na pangngalang “ugat,” habang pinananatili ang direksiyong pababa at ang larawang pang-agrikultura.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: at mamumunga paitaas
  rationale: Ang “mamumunga” ang likas na katumbas ng idyomang “gumawa/magbunga ng bunga,” at pinananatili ng “paitaas” ang patulang kaibahan sa “pababa.”
theological_decisions:
- issue: Ang nalabi sa isang pahayag ng pagpapanumbalik
  choice: ang nalabi sa sambahayan ng Juda na nakaligtas
  alternative: ang natitirang nalabi sa sambahayan ng Juda
  rationale: Pinananatili ng salin ang nalabi bilang kongkretong pangkat na nakaligtas sa paghatol at tatanggap ng pagpapanumbalik, nang hindi ikinakabit dito ang anumang doktrinang lampas sa sinasabi ng talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang balanseng larawang patula ng pag-uugat pababa at pamumunga paitaas, pati ang katawagang “sambahayan ng Juda.”
