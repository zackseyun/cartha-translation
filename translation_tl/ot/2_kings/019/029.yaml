  text: וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת אָכ֤וֹל הַ/שָּׁנָה֙ סָפִ֔יחַ וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית סָחִ֑ישׁ וּ/בַ/שָּׁנָ֣ה הַ/שְּׁלִישִׁ֗ית זִרְע֧וּ וְ/קִצְר֛וּ וְ/נִטְע֥וּ כְרָמִ֖ים וְ/אִכְל֥וּ פִרְיָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: tl
  text: 'At ito ang magiging tanda para sa iyo: sa taong ito, kainin ang kusang tumutubo[a], at sa ikalawang taon, ang muling sisibol mula roon[b]. Sa ikatlong taon, maghasik at mag-ani, magtanim ng mga ubasan, at kainin ang bunga ng mga iyon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kusang pananim.” Ang salitang Hebreo ay tumutukoy sa halamang tumutubo nang hindi inihahasik.
    reason: lexical_alternative
  - marker: b
    text: Bihira ang salitang Hebreo rito at maaaring mangahulugang “ikalawang kusang tubo”—pananim na sumibol sa ikalawang taon mula sa kusang pananim noong nakaraang taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: tanda
  rationale: Karaniwang tumutukoy ang אוֹת sa isang tanda o katibayang nagpapatunay; natural at malinaw ang “tanda” sa konteksto ng makahulang katiyakan.
- source_word: אָכוֹל
  choice: kainin ninyo
  rationale: Ang infinitive absolute ay may puwersang pautos o nagpapahayag ng mangyayari rito. Ginamit ang maramihang “ninyo” sapagkat ang kasunod na mga utos sa ikatlong taon ay nasa anyong maramihan at ang tanda ay para sa buong bayang kinakatawan ng hari.
- source_word: סָפִיחַ
  choice: ang kusang tumutubo
  rationale: Tumutukoy ito sa ani o halamang sumisibol nang hindi inihahasik. Malinaw sa karaniwang mambabasa ang pariralang ito at hindi teknikal.
- source_word: סָחִישׁ
  choice: ang muling sisibol mula roon
  rationale: Bihira ang salitang Hebreo at malamang na tumutukoy sa kusang pagsibol sa ikalawang taon mula sa naunang kusang pananim. Pinananatili ng salin ang pagkakasunod nang hindi nagkukunwaring tiyak ang eksaktong teknikal na kahulugan.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: maghasik kayo at mag-ani
  rationale: Tuwirang isinasalin ang magkatambal na gawaing agrikultural at pinananatili ang maramihang pautos.
- source_word: וְנִטְעוּ כְרָמִים
  choice: magtanim kayo ng mga ubasan
  rationale: Ang כְרָמִים ay mga ubasan. Bagaman maaaring sabihing “magtanim ng mga punong ubas,” mas direktang pinananatili ng “mga ubasan” ang pangngalan sa Hebreo.
- source_word: וְאִכְלוּ פִרְיָם
  choice: at kainin ang bunga ng mga iyon
  rationale: Ang hulaping maramihan ay natural na tumutukoy sa mga ubasan. Pinananatili ang literal na kilos na pagkain nang hindi dinaragdagan ng ideyang “tamasahin.”
theological_decisions:
- issue: Paglipat mula sa isahang kausap tungo sa maramihang tagaganap
  choice: “para sa iyo” ngunit “kainin ninyo” at “kayo”
  alternative: Gawing isahan ang lahat ng panghalip at utos
  rationale: Isahan ang לְךָ, na tumutukoy sa haring kinakausap, samantalang malinaw na maramihan ang mga pandiwa sa ikatlong taon. Pinananatili ng salin ang tunay na pagbabago ng bilang sa Hebreo sa halip na pakinisin ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang agrikultural na larawan at ang pagkakaiba ng isahang “iyo” at maramihang mga utos. Inilagay ang [b] kaagad pagkatapos ng pariralang tinutukoy nito upang malinaw ang kaugnayan ng talababa.
