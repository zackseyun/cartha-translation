  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: tl
  text: Nang gabing iyon, lumabas ang anghel ni Yahweh at pinatay ang 185,000 sa kampo ng Asiria. Nang bumangon sila nang maaga kinaumagahan,[a] narito, lahat sila ay mga bangkay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi tinutukoy ng Hebreo kung sino ang “sila.” Mas literal: “At bumangon sila nang maaga kinaumagahan.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga bangkay, mga patay”—isang mariing paglalarawan sa mga napatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Nang gabing iyon
  rationale: Likas at malinaw na salin ng panandang pangsalaysay at oras; hindi na isinama ang literal na “at nangyari” dahil magiging mabigat ito sa modernong Tagalog.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Ang מַלְאַךְ ay maaaring “mensahero” o “anghel,” ngunit sa kontekstong ito ng makalangit na tagapagpatupad ng hatol, “anghel” ang likas na salin. Pinanatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Tuwirang katumbas ng pandiwang יצא at natural sa daloy ng salaysay.
- source_word: וַיַּךְ
  choice: pinatay
  rationale: Bagaman literal na “sinaktan” o “hinampas,” malinaw sa sumunod na pahayag na nakamamatay ang pagkilos; ipinapahayag ng “pinatay” ang resultang taglay ng pandiwa sa kontekstong ito.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: sa kampo ng Asiria
  rationale: Malapit sa anyo ng Hebreo at malinaw na tumutukoy sa kampo ng hukbong Asirio.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 185,000
  rationale: Eksaktong bilang na ipinahahayag sa payak at madaling basahing modernong anyo.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Nang maaga silang bumangon kinaumagahan
  rationale: Pinananatili ang ikatlong panauhang maramihan nang hindi nagdaragdag ng tiyak na pangngalan; ipinapakita ng talababa na hindi tinutukoy ng Hebreo kung sino ang “sila.”
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang pantawag-pansing bisa ng הִנֵּה at ang biglang pagkakita sa nakagigimbal na kalagayan.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: lahat sila ay mga bangkay
  rationale: Natural na Tagalog para sa kabuuang pahayag. Ipinaliliwanag sa talababa ang mariing dobleng ekspresyon ng Hebreo, na literal na “mga bangkay, mga patay.”
theological_decisions:
- issue: Paglalapat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יהוה sa tekstong Hebreo; ang “Yahweh” ay tuwirang transliterasyon na hindi pinapalitan ang pangalan ng isang titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  alternative: isang anghel ni Yahweh; ang mensahero ni Yahweh
  rationale: Pinananatili ang karaniwang pariralang biblikal nang hindi ipinapasiya rito ang mas malawak na teolohikal na pagkakakilanlan ng anghel.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig pambibliya. Ginamit ang “narito” upang mapanatili ang biglang pantawag-pansin ng Hebreo, at iniwasang tukuyin kung sino ang bumangon dahil hindi ito nililinaw ng pinagmulang teksto.
