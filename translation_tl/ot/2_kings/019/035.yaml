  source_fidelity: 'Tumpak na naihahatid ng draft ang pangunahing nilalaman ng Hebreo: ang anghel ni Yahweh ay lumabas, pumatay ng 185,000 sa kampo ng Asiria, at ang di-tinukoy na maramihang paksa ay bumangon nang maaga at nakita ang mga bangkay. Ang “pinatay” ay katanggap-tanggap sa kontekstong tahasang nagtatapos sa mga bangkay, bagaman ang ugat ng pandiwa ay “sumugat/bumagsak.”'
  naturalness: 'May maliit ngunit kapansin-pansing kaayusang di-natural sa “Nang maaga silang bumangon kinaumagahan.” Mas likas sa modernong Tagalog ang paglalagay ng “nang maaga” pagkatapos ng pandiwa: “Nang bumangon sila nang maaga kinaumagahan.”'
