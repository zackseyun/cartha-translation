reference: 2 Kings 19:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: tl
  text: Sa pamamagitan ng iyong mga sugo ay nilait mo ang Panginoon at sinabi mo, “Sa dami ng aking mga karwahe, ako mismo ay umakyat sa matataas na bahagi ng mga bundok, sa pinakamalayong dako ng Lebanon. Puputulin ko ang matataas nitong mga sedro at ang pinakamaiinam nitong mga sipres[a]. Papasok ako sa pinakadulong tuluyan nito, sa malago nitong kagubatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga piling abeto”; hindi lubos na tiyak ang eksaktong uri ng punong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Sa pamamagitan ng iyong mga sugo
  rationale: Ang בְּיַד ay idyoma ng pagkilos sa pamamagitan ng isang kinatawan. Mas natural sa modernong Tagalog ang “sa pamamagitan ng,” at ang “mga sugo” ay angkop sa kontekstong politikal at militar.
- source_word: חֵרַפְתָּ
  choice: nilait mo
  rationale: Ipinahahayag ng pandiwa ang mapanghamak na panlalait o paghamon; malinaw at likas sa Tagalog ang “nilait.”
- source_word: אֲדֹנָי
  choice: ang Panginoon
  rationale: אֲדֹנָי ang nasa tekstong Hebreo, hindi ang banal na pangalang YHWH, kaya “Panginoon” ang ginamit nang walang anyong nakalaan para sa YHWH.
- source_word: בְּרֹב רִכְבִּי
  choice: Sa dami ng aking mga karwahe
  rationale: Pinananatili nito ang diin sa napakaraming karwaheng pandigma na ipinagmamalaki ng nagsasalita.
- source_word: אֲנִי עָלִיתִי
  choice: ako mismo ay umakyat
  rationale: Ang hiwalay na panghalip na אֲנִי ay nagbibigay-diin sa sarili ng nagsasalita; naipakikita ito ng “ako mismo.”
- source_word: מְרוֹם הָרִים
  choice: sa matataas na bahagi ng mga bundok
  rationale: Pinananatili ang konkretong larawan ng matataas na lugar ng kabundukan nang hindi ginagawang tiyak na superlatibo ang parirala.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: sa pinakamalayong dako ng Lebanon
  rationale: Ang יַרְכְּתֵי ay tumutukoy sa malalayo o pinakadulong bahagi, na angkop sa pagyayabang na narating niya ang kaloob-looban ng Lebanon.
- source_word: קוֹמַת אֲרָזָיו
  choice: ang matataas nitong mga sedro
  rationale: Ang קוֹמָה ay taas o tayog; natural na inilalarawan nito rito ang matatayog na sedro.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: ang pinakamaiinam nitong mga sipres
  rationale: Ang מִבְחוֹר ay “pinili” o “pinakamainam.” Hindi ganap na tiyak ang uri ng punong tinutukoy ng בְּרוֹשׁ, kaya ginamit ang karaniwang “sipres” at nilagyan ng talababa.
- source_word: מְלוֹן קִצֹּה
  choice: sa pinakadulong tuluyan nito
  rationale: Pinananatili ng “tuluyan” ang pangunahing kahulugan ng מָלוֹן bilang lugar na tinutuluyan, samantalang ang “pinakadulo” ay kumakatawan sa קִצֹּה.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: sa malago nitong kagubatan
  rationale: Ang כַּרְמֶל ay maaaring magpahiwatig ng mataba, mabunga, o malagong lupain. Sa tambalan, malinaw at natural ang “malagong kagubatan” habang pinananatili ang larawan ng kasaganaan.
theological_decisions:
- issue: Pagkilala sa אֲדֹנָי bilang naiiba sa YHWH
  choice: ang Panginoon
  alternative: ang PANGINOON
  rationale: אֲדֹנָי, hindi YHWH, ang nasa pinagmulang teksto. Kaya hindi ginamit ang natatanging anyong karaniwang nakalaan sa banal na pangalan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding pagyayabang ng nagsasalita, ang diin ng “ako mismo,” at ang sunod-sunod na larawang militar at pangkalikasan. Inilagay ang talababa sa “mga sipres,” ang salitang aktuwal na may leksikal na kawalang-katiyakan.
