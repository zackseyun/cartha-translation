  to: Kaya ang mga naninirahan doon ay kapos sa lakas[a]; nanlumo sila at napahiya. Para silang damo sa bukid at luntiang halaman, gaya ng damo sa mga bubong, at halamang napaso bago pa tumubo.[b]
