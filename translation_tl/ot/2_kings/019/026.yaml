  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: tl
  text: Kaya ang mga naninirahan doon ay kapos sa lakas[a]; nanlumo sila at napahiya. Para silang damo sa bukid at luntiang halaman, gaya ng damo sa mga bubong, at halamang napaso bago pa tumubo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “maikli ang kamay,” isang idyomang nangangahulugang kulang sa kakayahan o kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Napakasiksik ng huling larawan sa Hebreo. Maaari rin itong isalin na “pagkalanta bago tumayong pananim” o “halamang napaso bago pa sumibol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: ang mga naninirahan doon
  rationale: Ang hulaping panghalip ay tumutukoy sa mga lungsod o lupaing nabanggit sa konteksto. Likas sa modernong Tagalog ang “mga naninirahan doon” at malinaw ang tinutukoy na mga tao.
- source_word: קִצְרֵי יָד
  choice: kapos sa lakas
  rationale: Idyoma itong literal na “maikli ang kamay,” na nangangahulugang walang sapat na kakayahan o kapangyarihang kumilos. Pinananatili ng “kapos sa lakas” ang larawan ng kakulangan nang hindi nagiging malabo.
- source_word: חַתּוּ
  choice: nanlumo
  rationale: Maaaring tumukoy ang pandiwa sa pagkasindak, pagkadurog ng loob, o pagkawala ng tapang. Ang “nanlumo” ay likas at marangal, at hindi nito nililimitahan ang salita sa takot lamang.
- source_word: וַיֵּבֹשׁוּ
  choice: napahiya
  rationale: Ipinahahayag nito ang sinapit na kahihiyan o pagkakalagay sa kahihiyan, hindi lamang ang pansariling damdaming nahihiya.
- source_word: עֵשֶׂב שָׂדֶה
  choice: damo sa bukid
  rationale: Tuwirang inililipat ang larawang agrikultural sa malinaw at karaniwang Tagalog.
- source_word: וִירַק דֶּשֶׁא
  choice: sariwang luntian
  rationale: Tumutukoy ang parirala sa murang luntiang halamang bagong sibol. Pinananatili ng salin ang kasariwaan at karupukan ng larawan.
- source_word: חֲצִיר גַּגּוֹת
  choice: damo sa mga bubong
  rationale: Pinananatili nito ang larawan ng damong tumutubo sa mababaw na lupa sa bubong at madaling matuyo.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: pananim na natuyo bago pa ito tumindig
  rationale: 'Napakasiksik ng pariralang Hebreo: pinagsasama nito ang pagkatuyo o pagkapaso at ang pananim bago maging nakatayong uhay. Ang “tumindig” ay nagpapanatili sa konkretong diwa ng קָמָה habang ang “pananim” ay nilinaw mula sa kontekstong agrikultural.'
