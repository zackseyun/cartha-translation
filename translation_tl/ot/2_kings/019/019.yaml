base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: tl
  text: 'At ngayon, Yahweh, aming Diyos, isinasamo namin: iligtas mo kami mula sa kamay niya,[a] upang malaman ng lahat ng kaharian sa daigdig[b] na ikaw lamang, Yahweh, ang Diyos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kamay niya,” isang idyoma para sa pagliligtas mula sa kapangyarihan o kontrol niya.
    reason: cultural_note
  - marker: b
    text: Maaari ring isaling “lahat ng kaharian sa lupain,” ngunit higit na angkop dito ang “daigdig” dahil mga bansa ang saklaw ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na וְ at ang panandang temporal na עַתָּה, na nagpapakilala sa pinakasukdulang pakiusap sa panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Tagalog ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Likas na salin ng construct form na may hulaping unang panauhang maramihan; sa pariralang pantawag, natural sa Filipino ang “Yahweh na aming Diyos.”
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: iligtas mo kami, isinasamo namin
  rationale: Ang “iligtas mo kami” ay tuwirang kumakatawan sa Hiphil imperative, at ang “isinasamo namin” ay naghahayag ng taimtim na pakiusap na dala ng נָא nang hindi ginagawang karaniwang utos lamang.
- source_word: מִיָּדוֹ
  choice: mula sa kamay niya
  rationale: Pinananatili ang metapora ng Hebreo para sa pagliligtas mula sa kapangyarihan o kontrol ng isang tao; nililinaw ito sa talababa.
- source_word: וְיֵדְעוּ
  choice: upang malaman
  rationale: Sa konteksto, ang prefixed verb kasunod ng pakiusap ay likas na nagpapahayag ng layunin o bunga.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: lahat ng kaharian sa daigdig
  rationale: Ang pandaigdigang konteksto ng mga bansa at ng Asiria ay pumapabor sa “daigdig,” bagaman maaari ring mangahulugan ang הָאָרֶץ na “lupain.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng malalaman ng mga kaharian.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: ikaw lamang, Yahweh, ang Diyos
  rationale: Pinananatili ang tahasang pagtawag kay Yahweh at ang diin ng לְבַדֶּךָ sa pagiging eksklusibo, habang likas ang ayos sa modernong Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo o ibang nakaugaliang anyo.
- issue: Saklaw ng לְבַדֶּךָ sa pangwakas na pagpapahayag
  choice: ikaw lamang, Yahweh, ang Diyos
  alternative: ikaw, Yahweh, ang tanging Diyos
  rationale: Inilalagay ng napiling anyo ang diin sa “ikaw lamang” at hindi nagdaragdag ng paliwanag na higit sa pahayag ng Hebreo.
- issue: Ugnayan ng utos at layunin sa וְיֵדְעוּ
  choice: upang malaman
  alternative: at malalaman
  rationale: Ang layuning makilala ng lahat ng kaharian kung sino ang Diyos ang pinakaangkop na ugnayan sa panalangin, bagaman maaari ring marinig ang anyo bilang bunga.
translation_notes:
  register: Modernong Filipino na marangal at angkop sa panalangin. Ginamit ang “isinasamo namin” upang ihayag ang taimtim na נָא nang hindi umasa lamang sa magalang na katagang “po.” Pinanatili ang Hebreong metapora na “kamay” at nilinaw ito sa talababa. Ang mga marker na [a] at [b] ay inilagay sa mismong mga salitang tinatalakay ng kani-kanilang talababa.
