  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: tl
  text: Sapagkat mula sa Jerusalem ay lalabas ang mga nalabi, at mula sa Bundok Zion ang mga nakaligtas. Ang sigasig[a] ni Yahweh ang magsasagawa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “paninibugho.” Ang salitang Hebreo ay maaaring mangahulugang “sigasig” o “paninibugho”; dito ay tumutukoy ito sa maalab na pagpapasya ni Yahweh na iligtas ang Jerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang batayan o katiyakan ng naunang pangako at likas itong pakinggan sa marangal na modernong Tagalog.
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: mula sa Jerusalem ay lalabas ang mga nalabi
  rationale: Pinananatili ang larawan ng paglabas mula sa Jerusalem. Bagaman anyong isahan ang שְׁאֵרִית, kolektibo ang diwa nito, kaya natural sa Tagalog ang “mga nalabi.”
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: at mula sa Bundok Zion, ang mga nakaligtas
  rationale: Pinananatili ang paralelismo ng dalawang pariralang nagsasaad ng pinagmulan at ipinapahayag ang פְלֵיטָה bilang mga taong nakaligtas.
- source_word: קִנְאַת
  choice: sigasig
  rationale: Maaaring mangahulugan ang קִנְאָה ng sigasig o paninibugho. Sa kontekstong ito, ang “sigasig” ay malinaw na naghahayag ng maalab na pagpapasyang iligtas ang Jerusalem nang hindi inaalis ang alternatibong kahulugan, na inilagay sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: ang magsasakatuparan nito
  rationale: Ipinahahayag ang paggawa o pagdadala sa katuparan ng ipinangakong pangyayari sa natural na Tagalog, habang nananatiling paksa ang sigasig ni Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng קִנְאַת יְהוָה
  choice: Ang sigasig ni Yahweh
  alternative: Ang paninibugho ni Yahweh
  rationale: Sa konteksto, tumutukoy ito sa maalab na pagpapasya ni Yahweh na isagawa ang pagliligtas. Gayunman, tunay na kahulugan din ng salitang Hebreo ang “paninibugho,” kaya hindi ito tahimik na inalis kundi binanggit sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang paralelismo ng “mula sa Jerusalem” at “mula sa Bundok Zion,” gayundin ang kolektibong diwa ng nalabi at mga nakaligtas.
