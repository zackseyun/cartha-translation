  to: 'Ganito ang sabihin ninyo kay Ezequias na hari ng Juda: ‘Huwag mong hayaang linlangin ka ng iyong Diyos[a], na pinagtitiwalaan mo, sa pagsasabing, “Hindi ibibigay ang Jerusalem sa kamay ng hari ng Asiria.”’'
  rationale: Pinalitan ang temporal na “kapag sinasabi niyang” ng “sa pagsasabing” upang mapanatili ang ugnayang ipinahihiwatig ng לֵאמֹר nang walang idinagdag na kahulugang temporal. Ginawang hayag ang Diyos bilang simuno ng “linlangin” upang tumugma sa Hebreong יַשִּׁאֲךָ at maiwasan ang kalabuan, habang pinananatili ang mapanuyang paratang ng hari ng Asiria.
