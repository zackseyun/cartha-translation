base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: tl
  text: 'Ganito ang sabihin ninyo kay Ezequias na hari ng Juda: ‘Huwag mong hayaang linlangin ka ng iyong Diyos[a], na pinagtitiwalaan mo, sa pagsasabing, “Hindi ibibigay ang Jerusalem sa kamay ng hari ng Asiria.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong diyos.” Hindi ipinakikita sa Hebreo ang paggamit ng malaking titik o maliit na titik, at kinukutya ng nagsasalitang Asirio ang pagtitiwala ni Ezequias.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Ganito
  rationale: Likas na panimula sa pormula ng mensahero at tuwirang katumbas ng deiktikong pang-abay.
- source_word: תֹאמְרוּן
  choice: ang sabihin ninyo
  rationale: Ipinapahayag ang utos sa ikalawang panauhang maramihan sa natural na modernong Tagalog.
- source_word: חִזְקִיָּהוּ
  choice: Ezequias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Pinananatili ang tuwirang titulong maharlika at pagkakakilanlan kay Ezequias.
- source_word: אַל יַשִּׁאֲךָ
  choice: Huwag kang magpalinlang
  rationale: Natural na Tagalog para sa pagbabawal na magpadaig sa panlilinlang; pinananatili ang mapanuyang paratang ng nagsasalitang Asirio.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tumutukoy sa Diyos na pinagtitiwalaan ni Ezequias; nilagyan ng malaking titik sa pangunahing teksto, habang itinatala ang posibleng maliit na titik sa talababa.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: na iyong pinagtitiwalaan
  rationale: Natural at malinaw na pagpapahayag ng pagtitiwala o pananalig sa isang persona.
- source_word: לֵאמֹר
  choice: kapag sinasabi niyang
  rationale: Ipinakikita na ang kasunod na pahayag ang diumano'y paraan o nilalaman ng panlilinlang, nang hindi labis na nilulutas ang maluwag na ugnayang sintaktiko.
- source_word: לֹא תִנָּתֵן
  choice: Hindi ibibigay
  rationale: Pinananatili ang balintiyak na anyo ng Niphal at ang tuwirang diwa ng נתן.
- source_word: בְּיַד
  choice: sa kamay ng
  rationale: Pinananatili ang Hebreong metapora para sa pagpapasailalim sa kapangyarihan ng iba; nauunawaan din ito sa Tagalog.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Karaniwang Tagalog na anyo ng pangalan ng imperyo at tuwirang salin ng titulo.
theological_decisions:
- issue: Pagbaybay sa אֱלֹהֶיךָ habang ang hari ng Asiria ang nagsasalita
  choice: iyong Diyos
  alternative: iyong diyos
  rationale: Hindi ipinakikita ng Hebreo ang malaking titik o maliit na titik. Dahil ang tinutukoy ay ang Diyos ni Ezequias, malaking titik ang ginamit sa pangunahing teksto; gayunman, maaaring ipahiwatig ng mapanuyang tono ng Asirio ang maliit na titik, kaya pinanatili iyon sa talababa.
- issue: Ang Diyos bilang simuno ng diumano'y panlilinlang
  choice: Huwag kang magpalinlang sa iyong Diyos
  alternative: Huwag mong hayaang linlangin ka ng iyong Diyos
  rationale: Hindi pinapahina ang tahasang lapastangang paratang ng Asirio laban sa Diyos ni Ezequias. Ang pangunahing anyo ay mas natural sa Tagalog ngunit pinananatili ang teolohikal na tensiyon ng sinabi ng kaaway.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormula ng mensahero, ang balintiyak na pandiwa, at ang idyomang “sa kamay ng,” habang iniwasan ang sobrang makalumang ayos.
