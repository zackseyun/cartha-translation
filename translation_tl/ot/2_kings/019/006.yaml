revisions:
- from: 'Sinabi sa kanila ni Isaias, “Ganito ang sabihin ninyo sa inyong panginoon: ‘Ganito ang sinabi ni Yahweh: Huwag kang matakot dahil sa mga salitang narinig mo, na ginamit ng mga lingkod[a] ng hari ng Asiria upang lapastanganin ako.’”'
  to: 'Sinabi ni Isaias sa kanila, “Ganito ang sabihin ninyo sa inyong panginoon: ‘Ganito ang sabi ni Yahweh: Huwag kang matakot dahil sa mga salitang narinig mo. Nilapastangan ako ng mga tauhan[a] ng hari ng Asiria sa pamamagitan ng mga salitang iyon.’”'
  rationale: Inayos ang huling sugnay upang ang mga tauhan ng hari ng Asiria ang malinaw na tagaganap ng paglapastangan, gaya ng nasa Hebreo, habang ipinahihiwatig na ang mga salitang narinig ni Ezequias ang paraan nito. Pinalitan din ang “sinabi ni Yahweh” ng mas likas na pormulang “sabi ni Yahweh.”
