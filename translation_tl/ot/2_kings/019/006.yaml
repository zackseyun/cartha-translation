base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: tl
  text: 'Sinabi ni Isaias sa kanila, “Ganito ang sabihin ninyo sa inyong panginoon: ‘Ganito ang sabi ni Yahweh: Huwag kang matakot dahil sa mga salitang narinig mo. Nilapastangan ako ng mga tauhan[a] ng hari ng Asiria sa pamamagitan ng mga salitang iyon.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kabataang lalaki ng hari ng Asiria.” Maaaring tumukoy sa mga kabataan ang salitang Hebreo, ngunit dito ay malamang na tumutukoy ito sa mga tauhan o opisyal ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; ang payak na nagdaang panahong “Sinabi” ay natural sa Filipino.
- source_word: אֲדֹנֵיכֶם
  choice: inyong panginoon
  rationale: Tumutukoy kay Ezequias bilang nakatataas sa mga isinugo. Ang maliit na titik ay tumutulong na maiba ito sa titulong tumutukoy sa Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal at tipanang pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Natural na makabagong Filipino para sa negatibong jussive at pinananatili ang diwa ng pagpapalakas ng loob.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: dahil sa mga salitang
  rationale: Sa konteksto, ang מִפְּנֵי ay nagpapahayag ng dahilan ng takot, at ang דְּבָרִים ay tumutukoy sa mga binitiwang salita.
- source_word: שָׁמַעְתָּ
  choice: narinig mo
  rationale: Payak at natural na katumbas ng ganap nang pagkakarinig na mahalaga pa sa kasalukuyang sitwasyon.
- source_word: גִּדְּפוּ
  choice: lapastanganin
  rationale: Ipinahahayag nito ang mabigat na paghamak na tuwirang laban sa Diyos, hindi lamang pangkaraniwang pang-iinsulto.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: mga lingkod ng hari ng Asiria
  rationale: Bagaman maaaring mangahulugang “mga kabataang lalaki” ang נְעָרִים, sa kontekstong maharlika ay tumutukoy ito sa mga tauhan o opisyal ng hari.
- source_word: אֹתִי
  choice: ako
  rationale: Malinaw na pinananatili ang Diyos bilang tuwirang pinatutungkulan ng paglapastangan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa halip na palitan ng isang titulo.
- issue: Bigat ng גִּדְּפוּ kapag Diyos ang tuwirang layon
  choice: lapastanganin ako
  alternative: hamakin ako
  rationale: Ang “lapastanganin” ay nagpapanatili sa sakrilehiyosong bigat ng pagsasalitang laban sa Diyos nang hindi nagdaragdag ng paliwanag sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panginoon” sa maliit na titik para sa haring si Ezequias, samantalang pinanatili ang “Yahweh” bilang banal na pangalan. Inilagay ang talababa sa “mga lingkod,” ang salitang may tunay na leksikal na alternatibo.
