  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: tl
  text: Ako mismo ang humukay at uminom ng mga banyagang tubig; at sa pamamagitan ng talampakan ng aking mga paa ay tinutuyo ko ang lahat ng daluyan ng tubig sa Ehipto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng kanal o daluyan ng Nilo sa Ehipto.” Ang salitang Hebreo ay maaaring tumukoy lalo na sa mga daluyang kaugnay ng Ilog Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Ako mismo
  rationale: Pinananatili ang diin ng tahasang panghalip at ang mapagmataas na pag-aangkin ng nagsasalita.
- source_word: קַרְתִּי
  choice: ang humukay
  rationale: Tuwirang ipinahahayag ang paghuhukay nang hindi idinaragdag ang ‘balon,’ na ipinahihiwatig lamang ng konteksto.
- source_word: מַיִם זָרִים
  choice: tubig sa ibang mga lupain
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa tubig na natagpuan sa mga lupaing hindi pag-aari ng nagsasalita; iniiwasan ang di-likas na ‘banyagang tubig.’
- source_word: וְאַחְרִב
  choice: tinutuyo ko
  rationale: Ang Hiphil ng חרב ay nangangahulugang gawing tuyo; ang aspektong di-ganap ay angkop na isinalin bilang kasalukuyang mapagmataas na pahayag kasunod ng mga nagawang tagumpay.
- source_word: בְּכַף פְּעָמַי
  choice: sa mga talampakan ko
  rationale: Pinananatili ang kongkretong larawan ng pagpapatuyo sa pamamagitan lamang ng mga talampakan, na nagpapahiwatig ng diumano’y walang hirap na pananakop.
- source_word: יְאֹרֵי
  choice: mga daluyan ng tubig
  rationale: Saklaw nito ang mga sapa, kanal, at mga sangang kaugnay ng Nilo nang hindi labis na nililimitahan ang kahulugan.
- source_word: מָצוֹר
  choice: Ehipto
  rationale: Sa tambalang יְאֹרֵי מָצוֹר, pinakamalamang na patulang pangalan ito para sa Ehipto; nililinaw ang heograpikong tinutukoy.
theological_decisions:
- issue: Tinutukoy at retorikal na lakas ng unang panauhang pananalita
  choice: Pinanatili bilang mapagmataas na pagyayabang ng isang hari, nang walang idinagdag na paliwanag sa pangunahing teksto.
  alternative: Tahasang tukuyin sa talata ang hari ng Asiria o ipaliwanag na propaganda lamang ang pananalita.
  rationale: Ang konteksto ang nagpapakilala sa nagsasalita. Ang pagsasalin ay dapat magpanatili ng matinding pagyayabang at matingkad na larawan nang hindi ipinapasok ang interpretasyon sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘tubig sa ibang mga lupain’ sa halip na literal ngunit di-likas na ‘banyagang tubig,’ at ‘mga daluyan ng tubig’ upang mapanatili ang saklaw ng יְאֹרֵי. Inilagay ang panandang [a] sa pangunahing teksto.
