base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: tl
  text: Iniligtas ba sila ng mga diyos ng mga bansang winasak ng aking mga ninuno—ang Gozan, Haran, Rezef, at ang mga taga-Eden[a] na nasa Tel-asar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mga anak na lalaki ng Eden,” na maaaring tumukoy sa mga tao o naninirahan sa Eden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Iniligtas ba
  rationale: Ang Hiphil perfect na nasa retorikal na tanong ay likas na isinasalin sa Filipino bilang “Iniligtas ba,” na nagpapanatili sa diwa ng pagsagip mula sa kapahamakan.
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy ang panghalip na tuwirang layon sa mga bayan o mamamayang kasunod na binanggit.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: mga diyos ng mga bansa
  rationale: Tuwirang ipinapahayag ng pariralang construct ang mga diyos na sinasamba ng mga bansang iyon.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: na winasak ng aking mga ninuno
  rationale: Sa kontekstong militar, ang Piel ng שׁחת ay nangangahulugang wasakin o gibain. Ang “mga ninuno” ay natural na tumutukoy sa naunang mga hari o henerasyon nang hindi ipinapalagay na literal na mga ama lamang.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: ang Gozan, Haran, Rezef
  rationale: Isinalin ang mga pangalang pantangi sa anyong transliterasyong madaling basahin sa Filipino; pinanatili ang tahasang panandang layon sa listahan sa pamamagitan ng “ang.”
- source_word: וּבְנֵי עֶדֶן
  choice: ang mga taga-Eden
  rationale: Bagaman literal na “mga anak na lalaki ng Eden,” karaniwang tumutukoy dito ang בְּנֵי sa mga tao o naninirahan sa Eden. Ang “mga taga-Eden” ay malinaw at natural sa modernong Filipino.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: na nasa Tel-asar
  rationale: Ang בְּ na kasama ng pangalan ng lugar ay natural na ipinapahayag bilang “nasa,” at inuugnay ng sugnay ang mga taga-Eden sa Tel-asar.
theological_decisions: []
translation_notes:
  register: Gumamit ng dignified ngunit karaniwang modernong Filipino. Pinanatili ang anyo ng retorikal na tanong at ang pagyayabang ng haring Asirio. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang maging malinaw ang dinastiko o makasaysayang pagtukoy sa mga nauna sa kanya.
