source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: tl
  text: Marahil ay maririnig ni Yahweh na iyong Diyos ang lahat ng sinabi ng Rabshakeh[a], na isinugo ng kanyang panginoon, ang hari ng Asiria, upang hamakin ang Diyos na buháy; at baka sawayin niya dahil sa mga salitang narinig ni Yahweh na iyong Diyos.[b] Kaya manalangin ka para sa nalalabi pang naririto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Rabshakeh” ay malamang na titulong Asirio. Iminumungkahi rin ang kahulugang “punong tagapagdala ng kopa.”
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin ang pandiwang ito bilang “sumbatan,” “hatulan,” o “pagsabihan.” Hindi tahasang binabanggit sa Hebreo ang taong sasawayin; ang parirala ay literal na “sa pamamagitan ng/dahil sa mga salita.”
    reason: textual_ambiguity
  - marker: c
    text: 'Sa literal: “mag-angat ka ng panalangin para sa nalalabing natagpuan.” Maaari ring unawain ang huling parirala bilang “mga natira” o “mga nakaligtas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Marahil ay dinggin
  rationale: Pinananatili ang pag-asang may kasamang kawalang-katiyakan. Ang “dinggin” ay angkop sa konteksto ng pakikinig na may pagtugon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כָּל דִּבְרֵי
  choice: ang lahat ng sinabi
  rationale: Natural sa makabagong Filipino at saklaw ang maramihang דִּבְרֵי nang hindi nawawala ang diwa ng mga pahayag.
- source_word: רַב שָׁקֵה
  choice: Rabshakeh
  rationale: Pinananatili bilang transliterasyon dahil malamang na titulong Asirio ito at pinagtatalunan ang tiyak na kahulugan ng tungkulin.
- source_word: לְחָרֵף
  choice: upang hamakin
  rationale: Ipinahahayag ang mapanlibak at mapang-alipustang paghamon laban sa Diyos.
- source_word: אֱלֹהִים חַי
  choice: ang Diyos na buháy
  rationale: Tumpak at likas na parirala sa Filipino na nagpapanatili sa kaibahan ng Diyos sa mga diyus-diyosan.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: at sawayin niya ang mga salitang
  rationale: Pinananatili ang mga salita bilang hayag na kaugnay ng pagsaway, nang hindi nagdaragdag ng tahasang taong layon na wala sa Hebreo.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Kaya idalangin mo
  rationale: Isinasalin ang idyomang literal na “mag-angat ng panalangin” sa natural na utos sa Filipino; ipinahihiwatig ng konteksto ang pananalangin alang-alang sa iba.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: ang nalalabing natagpuan pa
  rationale: Malapit sa anyo ng Hebreo at pinananatili ang bahagyang di-karaniwang pahayag na tumutukoy sa nalalabing naroroon o nakaligtas.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa pinagmulang Hebreo; ang transliterasyong “Yahweh” ay hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng הַשְּׁאֵרִית
  choice: ang nalalabi
  alternative: ang mga nakaligtas; ang mga natira
  rationale: Pinananatili ang mahalagang terminong “nalalabi” nang hindi tiyakang nililimitahan ito sa isang doktrinal na pakahulugan.
- issue: Layon ng וְהוֹכִיחַ
  choice: ang mga salitang narinig
  alternative: sawayin siya dahil sa mga salitang narinig
  rationale: Hindi tahasang binabanggit ng Hebreo ang “siya” bilang layon. Ang salin ay sumusunod sa anyong nakaugnay ang pagsaway sa mga salita at hindi tahimik na nilulutas ang sintaktikong tensiyon.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “iyong Diyos” upang mapanatili ang tuwirang pakikipag-usap kay Isaias, at ang tuldik sa “buháy” upang maiwasan ang maling pagbasa. Ang mga talababa ay naglalahad ng debatableng titulo, sintaktikong kalabuan, at idyomang Hebreo.
