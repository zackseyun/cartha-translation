  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: tl
  text: Ngunit alam ko ang pag-upo mo[a], ang paglabas mo at ang pagpasok mo, pati ang pagngangalit mo laban sa akin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pag-upo, paglabas, at pagpasok” ay isang paraang Hebreo ng pagtukoy sa kabuuan ng mga kilos at pamumuhay ng isang tao.
    reason: cultural_note
  - marker: b
    text: Ang “pagngangalit” ay maaari ding isaling “pagkabalisa” o “matinding galit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: ang pag-upo mo
  rationale: Pinananatili ang kongkretong larawang Hebreo mula sa ישׁב. Kasama ng “paglabas” at “pagpasok,” ipinahihiwatig nito ang kabuuan ng kilos at pamumuhay ng kausap.
- source_word: וְצֵאתְךָ
  choice: ang paglabas mo
  rationale: Likas na katumbas sa modernong Tagalog at pinananatili ang tambalang idyoma nito kasama ng “pagpasok.”
- source_word: וּבֹאֲךָ
  choice: ang pagpasok mo
  rationale: Kinukumpleto nito ang karaniwang tambalang “paglabas at pagpasok” at malinaw sa ordinaryong mambabasa.
- source_word: יָדָעְתִּי
  choice: alam ko
  rationale: Bagaman perfect ang anyong Hebreo, ipinahahayag dito ang tiyak at lubos na kaalaman ng nagsasalita; natural itong ihatid sa Tagalog bilang kasalukuyang “alam ko.”
- source_word: הִתְרַגֶּזְךָ
  choice: ang pagngangalit mo
  rationale: Ipinahahayag ang matinding poot o galit ng Hitpael na anyo ng רגז nang hindi ito pinalalawak tungo sa mas interpretatibong “paghihimagsik” o “paglapastangan.”
- source_word: אֵלַי
  choice: laban sa akin
  rationale: Bagaman karaniwang nangangahulugang “tungo sa,” hinihingi ng konteksto ng pagngangalit ang malinaw na adversatibong “laban sa akin.”
- source_word: וְאֵת
  choice: pati
  rationale: Ang pangatnig at pananda ng tuwirang layon ay nagdaragdag ng huling bagay na nalalaman. Ang “pati” ay natural na nag-uugnay rito sa naunang serye.
