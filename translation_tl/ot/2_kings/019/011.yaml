base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: tl
  text: Tingnan mo,[a] narinig mo na kung ano ang ginawa ng mga hari ng Asiria sa lahat ng lupain—kung paano nila itinalaga ang mga ito sa lubos na pagkawasak. At ikaw, maliligtas ka ba?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Narito.” Ang Hebreong salita ay isang mariing panawag-pansin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Isang mariing panawag-pansin sa kausap; natural ito sa modernong Filipino at pinananatili ang tuwirang diin ng Hebreo.
- source_word: שָׁמַעְתָּ
  choice: narinig mo na
  rationale: Ang perpektong pandiwa ay tumutukoy sa balitang nalaman na ng kausap at may kabuluhan pa sa kasalukuyang pangangatwiran.
- source_word: מַלְכֵי אַשּׁוּר
  choice: mga hari ng Asiria
  rationale: Tuwirang salin ng construct phrase at malinaw na tumutukoy sa sunud-sunod na mga hari ng Asiria.
- source_word: לְכָל הָאֲרָצוֹת
  choice: sa lahat ng lupain
  rationale: Ang maramihang אָרֶץ ay tumutukoy rito sa mga teritoryo o bansa, hindi sa buong daigdig; pinananatili ng “mga lupain” ang heograpikal at pampolitikang diwa.
- source_word: לְהַחֲרִימָם
  choice: itinalaga nila ang mga iyon sa ganap na pagkawasak
  rationale: Ipinahahayag ng Hiphil ng חרם ang paglalagay sa ḥerem, isang pagtatalaga sa lubos na pagkapuksa, at hindi lamang pangkalahatang pagsira.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: At ikaw ba ay maliligtas?
  rationale: Pinananatili ng hiwalay na panghalip ang mariing paghahambing na “at ikaw,” habang ang tanong ay naghahatid ng mapanuyang retorika at ang Niphal ay isinasaling pasibo.
theological_decisions:
- issue: Wika ng חרם sa konteksto ng paghatol sa digmaan
  choice: itinalaga nila ang mga iyon sa ganap na pagkawasak
  alternative: lubusan nilang winasak ang mga iyon
  rationale: Pinananatili ng piniling salin ang natatanging diwa ng pagtatalaga sa pagkawasak, ngunit iniiwasang gumamit ng di-pamilyar na teknikal na terminong maaaring magkubli sa kahulugan.
- issue: Retorikal na anyo ng וְאַתָּה תִּנָּצֵל
  choice: At ikaw ba ay maliligtas?
  alternative: At ikaw ay makatatakas?
  rationale: Ang anyong tanong ang pinakamalinaw na naghahatid ng hamon at panunuya sa konteksto; ang “maliligtas” ay nagpapanatili sa pasibong anyo nang hindi tinutukoy kung sino ang tagapagligtas.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang “Asiria,” “mga lupain,” at “maliligtas” bilang karaniwang biblikal ngunit madaling maunawaang mga anyo. Pinanatili ang mariing “At ikaw” at ang retorikal na tanong.
