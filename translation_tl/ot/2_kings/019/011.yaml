  to: Tingnan mo,[a] narinig mo na kung ano ang ginawa ng mga hari ng Asiria sa lahat ng lupain—kung paano nila itinalaga ang mga ito sa lubos na pagkawasak. At ikaw, maliligtas ka ba?
