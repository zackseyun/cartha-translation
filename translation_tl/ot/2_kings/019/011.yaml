  naturalness: Natural sa makabagong Filipino ang ‘Narinig mo na ...’ at ‘At ikaw, maliligtas ka ba?’ Ang ‘At ikaw, maliligtas ka ba?’ ay mas idiomatiko kaysa ‘At ikaw ba ay maliligtas?’ habang pinananatili ang mariing paghahambing.
