revisions:
- from: At nangyari, habang sumasamba siya sa templo ni Nisrok[a] na kanyang diyos, pinatay siya sa tabak nina Adramelek at Sarezer. Pagkatapos, tumakas sila patungo sa lupain ng Ararat. At si Esar-hadon na kanyang anak ang naghari bilang kahalili niya.
  to: At nangyari na, habang sumasamba siya sa templo ni Nisrok[a], na kanyang diyos, pinatay siya nina Adrammelek at Sarezer sa pamamagitan ng tabak. Tumakas sila patungo sa lupain ng Ararat. At si Esar-haddon na kanyang anak ang naghari bilang kahalili niya.
  rationale: Inayos ang dalawang pangalan ayon sa anyong Hebreo, pinakinis ang ayos ng sugnay tungkol sa pagpatay, at inalis ang hindi kailangang pang-ugnay na “Pagkatapos.” Pinananatili ng rebisyon ang progresibong kilos ng pagsamba, ang katangiang kultiko ng templo, ang instrumentong tabak, ang pagtakas ng dalawang pumatay, at ang dinastikong paghalili.
