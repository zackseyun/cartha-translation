  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: tl
  text: At nangyari na, habang sumasamba siya sa templo ni Nisrok[a], na kanyang diyos, pinatay siya nina Adrammelek at Sarezer sa pamamagitan ng tabak. Tumakas sila patungo sa lupain ng Ararat. At si Esar-haddon na kanyang anak ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Nisrok”; ayon sa tradisyon: “Nisroch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Ipinapanatili nito ang panimulang pormulang pasalaysay ng Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: מִשְׁתַּחֲוֶה
  choice: sumasamba
  rationale: Sa kontekstong panrelihiyon at kaugnay ng ‘kanyang diyos,’ ang kilos ay malinaw na pagsamba, hindi lamang pagyukod.
- source_word: בֵּית נִסְרֹךְ
  choice: sa templo ni Nisrok
  rationale: Literal itong ‘bahay ni Nisrok,’ ngunit ang tinutukoy ay santuwaryo ng isang diyos; ‘templo’ ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: אֱלֹהָיו
  choice: na kanyang diyos
  rationale: Isahan ang anyo at tumutukoy sa diyos na sinasamba ni Senakerib.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: pinatay siya sa tabak
  rationale: Ang נכה ay ‘humampas/pumatay,’ at ipinakikita ng konteksto at ng sandatang tabak na ikinamatay niya ang paglusob. Ang salin ay natural at tuwiran sa Tagalog.
- source_word: נִמְלְטוּ
  choice: tumakas sila
  rationale: Ipinahihiwatig ng nifal na matagumpay silang nakaligtas o nakatakas matapos ang pagpatay.
- source_word: אֶרֶץ אֲרָרָט
  choice: patungo sa lupain ng Ararat
  rationale: Malinaw nitong ipinapahayag ang heograpikong destinasyon at pinananatili ang pariralang ‘lupain ng Ararat.’
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Ang pandiwa ay tumutukoy sa pag-upo at paghahari ng bagong hari sa salaysay ng paghalili.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinapahayag ng idyoma ang paghalili sa trono; mas natural ito sa Tagalog kaysa sa literal na ‘sa kanyang lugar.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘templo’ para sa santuwaryo ng diyos at ‘tabak’ para sa dignidad ng salaysay. Pinanatili ang mga pangalang pantangi sa anyong malapit sa Hebreo at madaling basahin sa Filipino.
