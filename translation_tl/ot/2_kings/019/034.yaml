  text: וְ/גַנּוֹתִ֛י אֶל הָ/עִ֥יר הַ/זֹּ֖את לְ/הֽוֹשִׁיעָ֑/הּ לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: tl
  text: Ipagtatanggol ko ang lungsod na ito upang iligtas ito[a], alang-alang sa akin at alang-alang kay David na aking lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang hanguin ito.” Ang pandiwang Hebreo ay maaaring mangahulugang magligtas o magpalaya mula sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: Ipagtatanggol ko
  rationale: Ang pandiwang גנן ay tumutukoy sa pagprotekta o pagtatanggol. Ang “ipagtatanggol” ay natural sa makabagong Filipino at angkop sa konteksto ng lungsod na nanganganib sa pagsalakay.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: ang lungsod na ito
  rationale: Kasama ng גנן, itinuturo ng אֶל ang pinatutunguhan ng pagkilos na mapagtanggol. Ginagamit ang tuwirang layon upang maging natural sa Filipino.
- source_word: לְהוֹשִׁיעָהּ
  choice: upang iligtas ito
  rationale: Ang ישׁע ay maaaring mangahulugang magligtas o magpalaya mula sa panganib. Ang “iligtas” ang pinakatuwiran at likas na salita rito.
- source_word: לְמַעֲנִי
  choice: alang-alang sa akin
  rationale: Pinananatili nito ang tahasang pahayag na ang sariling layunin ng Diyos ang isa sa mga dahilan ng pagkilos niya, nang hindi ito pinalalawak sa isang doktrinal na paliwanag.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: at alang-alang kay David na aking lingkod
  rationale: Malinaw nitong pinananatili ang ikalawang dahilan at ang paglalarawan kay David bilang lingkod ng Diyos.
theological_decisions:
- issue: Ang mga dahilan ng Diyos sa pagliligtas sa Jerusalem
  choice: 'Pinananatili ang dalawang tahasang dahilan: alang-alang sa Diyos mismo at alang-alang kay David na kanyang lingkod.'
  alternative: Maaaring ipaliwanag ang pagbanggit kay David bilang tuwirang pagtukoy sa tipan o sa mga pangako ng Diyos kay David.
  rationale: Dalawang magkatimbang na pariralang לְמַעַן ang nasa Hebreo. Hindi idinaragdag ng salin ang “tipan” o “pangako,” kahit maaaring ipinahihiwatig ng konteksto ang mga iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lungsod” at “ipagtatanggol” para sa malinaw na kontekstong militar, habang pinanatili ang maikli at mariing anyo ng talata.
