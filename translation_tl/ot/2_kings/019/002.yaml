  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: tl
  text: At isinugo niya si Eliakim, na namamahala sa sambahayan ng hari,[a] si Sebna na kalihim, at ang mga nakatatanda sa mga pari, na nakadamit ng telang sako,[b] kay propeta Isaias na anak ni Amoz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang “namamahala sa sambahayan ng hari” ay tumutukoy sa isang mataas na opisyal na nangangasiwa sa palasyo o sambahayan ng hari.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “na nagtatakip sa kanilang sarili ng telang sako.” Maaaring idiin ng participle sa Hebreo ang ginagawa nila o ang kalagayang bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: At isinugo niya
  rationale: Isinusulong ng wayyiqtol ang salaysay; pinananatili ng “At” ang daloy nang hindi dinaragdagan ng tiyak na pansamantalang diwa.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: na namamahala sa sambahayan ng hari
  rationale: Tumutukoy ang idyoma sa mataas na opisyal na nangangasiwa sa palasyo o sambahayan ng hari; nilinaw ang pahiwatig na maharlika nang hindi ito pinaliliit sa isang modernong titulo.
- source_word: הַסֹּפֵר
  choice: kalihim
  rationale: Sa kontekstong maharlika, maaaring tumukoy ang סֹפֵר sa opisyal na tagasulat o kalihim. Mas likas sa modernong Filipino ang “kalihim,” habang hindi naman lubhang nililimitahan ang tungkulin.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: ang matatandang pari
  rationale: Ipinahahayag ang construct phrase bilang mga nakatatanda sa hanay ng mga pari, nang hindi ito ginagawang hiwalay na teknikal na titulong “mga punong pari.”
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: na nakadamit ng telang-sako
  rationale: Ipinakikita ng participle ang kanilang kalagayan habang pumaparoon; pinananatili ng “telang-sako” ang larawan ng pagluluksa at pagpapakumbaba.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: kay propeta Isaias
  rationale: Natural na appositional na titulo sa Filipino at gamit ang kinagawiang anyo ng pangalang Isaias.
- source_word: בֶּן אָמוֹץ
  choice: na anak ni Amoz
  rationale: Tuwirang pinananatili ang pagkakakilanlan ayon sa angkan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “telang-sako” upang maipakita na uri ito ng magaspang na damit sa pagluluksa, hindi karaniwang sako bilang lalagyan. Inayos din ang mga footnote marker ayon sa mismong pariralang ipinapaliwanag ng bawat tala.
