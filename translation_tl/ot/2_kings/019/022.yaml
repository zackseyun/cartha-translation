  to: Sino ang iyong hinamak at nilapastangan? Laban kanino mo itinaas ang iyong tinig at itiningala mo ang iyong mga mata sa kaitaasan? Laban sa Banal ng Israel.[a][b]
  rationale: Inalis ang hayag na interpretasyong “buong pagmamataas” mula sa pangunahing teksto at pinanatili ang larawan ng Hebreo na pagtitingala ng mga mata. Ang diwa ng kapalaluan ay sapat na ipinapaliwanag sa talababa. Inayos din ang sintaks upang maging likas sa modernong Filipino Tagalog habang pinananatili ang retorikal na diin at pag-uulit ng pinagmulan.
