  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: tl
  text: Sino ang iyong hinamak at nilapastangan? Laban kanino mo itinaas ang iyong tinig at itiningala mo ang iyong mga mata sa kaitaasan? Laban sa Banal ng Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “nilait at inalipusta.” Magkalapit ang kahulugan ng dalawang pandiwang Hebreo at kapuwa tumutukoy sa mapanghamak at mapang-abusong pananalita; ang ikalawa ay maaaring tumukoy lalo na sa paglapastangan sa Diyos.'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “itinaas mo sa kaitaasan ang iyong mga mata”—isang idyomang nagpapahayag ng kapalaluan o mapagmataas na pagtataas sa sarili.
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: hinamak
  rationale: Ipinahahayag nito ang mapanghamak at mapanlait na pananalita; natural at marangal itong pakinggan sa modernong Tagalog.
- source_word: גִדַּפְתָּ
  choice: nilapastangan
  rationale: Ang pandiwa ay tumutukoy sa mapang-abusong pananalita, lalo na laban sa Diyos; pinananatili ng “nilapastangan” ang bigat na panrelihiyon nang hindi nagpapasok ng dagdag na doktrina.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: itinaas ang iyong tinig
  rationale: Malapit ito sa larawang Hebreo at malinaw sa Tagalog bilang malakas at mapanghamong pagsasalita.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: buong pagmamataas na itiningala ang iyong mga mata
  rationale: Ang literal na larawan ng pagtataas ng mga mata ay pinanatili, habang ang idyomatikong diwa ng kapalaluan ay ginawang malinaw.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: ang Banal ng Israel
  rationale: Itinatanghal ito bilang nakapirming banal na titulo at iniiwasang gawing paliwanag o paraphrase.
- source_word: עַל
  choice: laban sa / laban kanino
  rationale: Ipinakikita nito ang masamang direksiyon ng kilos at pananalita laban sa Diyos.
- source_word: מִי
  choice: sino / kanino
  rationale: Ginamit ang likas na anyong Tagalog ayon sa tungkulin nito sa bawat sugnay.
theological_decisions:
- issue: Pagpapanatili sa bigat ng pananalitang laban sa Diyos
  choice: Gamitin ang “nilapastangan” at panatilihin ang sukdulang pagkakakilanlang “Laban sa Banal ng Israel.”
  alternative: Gamitin ang mas pangkalahatang “ininsulto” o “nilait.”
  rationale: Hindi lamang pampolitikang pagmamataas ang tinutuligsa ng talata kundi mapanglapastangang pananalita laban sa Diyos ng Israel. Pinananatili ng salin ang bigat na ito nang hindi lumalampas sa puwersang leksikal ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang retorikal na pag-uulit at ang banal na titulong “Banal ng Israel.” Ginawang hayag ang diwa ng pagmamataas sa idyoma, ngunit pinanatili rin ang larawan ng pagtitingala.
