base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: tl
  text: Ikiling mo ang iyong tainga, Yahweh, at pakinggan mo; buksan mo ang iyong mga mata, Yahweh, at tingnan mo. Dinggin mo ang mga salita ni Senakerib na ipinarating niya upang hamakin[a] ang Diyos na buháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuyain,” “alipustain,” o “lapastanganin”; ang pandiwang Hebreo ay tumutukoy sa mapanlait na paghamak o panunuya at maaari ring magpahiwatig ng mapangahas na paghamon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Ikiling mo ang iyong tainga
  rationale: Pinananatili ang Hebreong idyoma ng pagkiling ng tainga bilang taimtim na pakikinig, habang nananatiling malinaw at marangal sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וּשֲׁמָע
  choice: at dinggin mo / Dinggin mo
  rationale: Ang “dinggin” ay angkop sa taimtim na panalangin at pinananatili ang pag-uulit ng pandiwang שׁמע sa talata.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: imulat mo ang iyong mga mata ... at tingnan mo
  rationale: Natural na inilalarawan sa Filipino ang magkatugmang mga utos na buksan ang mga mata at makita ang nangyayari.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: ang mga salita ni Senakerib
  rationale: Pinananatili ang pangmaramihang “mga salita” sa halip na gawing pangkalahatang “mensahe”; “Senakerib” ang malinaw na makabagong baybay sa Filipino.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: na ipinadala niya
  rationale: Ang sugnay ay natural na inuugnay sa mga salitang ipinadala ni Senakerib; hindi dinaragdagan ang salin ng tahasang tagatanggap na hindi malinaw sa pahayag.
- source_word: לְחָרֵף
  choice: upang hamakin
  rationale: Ipinahahayag ng “hamakin” ang mapanlait at mapangutyang puwersa ng pandiwa nang hindi ito nililimitahan sa lantad na paghihimagsik o hamon.
- source_word: אֱלֹהִים חָי
  choice: ang Diyos na buháy
  rationale: Likas at matapat na katumbas ng Hebreong pariralang nagbibigay-diin na ang Diyos ng Israel ay buháy.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang pangalan at hindi pinapalitan ng titulong “PANGINOON.”
- issue: Diwa ng לְחָרֵף laban sa Diyos
  choice: hamakin ang Diyos na buháy
  alternative: hamunin, tuyain, o lapastanganin ang Diyos na buháy
  rationale: Saklaw ng pandiwa ang paghamak, panunuya, at mapangahas na paghamon. Pinili ang malawak at natural na “hamakin,” habang inilalahad sa talababa ang posibleng diin sa paghamon.
translation_notes:
  register: Makabago ngunit marangal na Filipino na angkop sa taimtim na panalangin. Pinanatili ang magkatugmang mga utos at ang pag-uulit ng “dinggin mo.” Inilagay ang talababa sa “hamakin,” ang salitang talagang may leksikal na alternatibo.
