base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: tl
  text: 'Nang mabalitaan niya ang tungkol kay Tirhaka, hari ng Cush[a], na nagsasabi, “Narito, lumabas siya upang makipaglaban laban sa iyo,” bumalik siya at muling nagpadala ng mga mensahero kay Hezekias, na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hari ng Etiopia.” “Cush” ang nasa Hebreo, isang sinaunang rehiyon sa timog ng Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Nang mabalitaan niya ang tungkol kay
  rationale: Ipinahahayag ng waw-consecutive at ng pandiwang שמע kasama ang אֶל ang sumunod na pangyayari at ang paksang nabalitaan. Likas sa modernong Tagalog ang temporal na “Nang mabalitaan niya.”
- source_word: תִּרְהָקָה
  choice: Tirhaka
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Tagalog.
- source_word: מֶלֶךְ כּוּשׁ
  choice: hari ng Cush
  rationale: Pinananatili ang heograpikong pangalang כּוּשׁ sa halip na ang maaaring anakronistikong “Etiopia.”
- source_word: לֵאמֹר
  choice: —“...”— / na sinasabi
  rationale: Ang unang gamit ay likas na ipinakilala bilang tuwirang ulat sa pamamagitan ng gatlang, samantalang pinanatili sa hulihan ang bukas na pormulang “na sinasabi” dahil nagpapatuloy ang mensahe sa kasunod na talata.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang pantawag-pansin ng particle sa kasalukuyan at di-arkaiskong Tagalog.
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: lumabas siya upang makipaglaban sa iyo
  rationale: Malapit ito sa literal na kilos ng יצא at sa layuning militar ng להלחם; ang “sa iyo” kasunod ng “makipaglaban” ay malinaw na salungatan sa Tagalog.
- source_word: וַיָּשָׁב
  choice: bumalik siya
  rationale: Ipinapahayag ang karaniwang kahulugan na bumalik o tumalikod nang hindi dinaragdagan ang eksaktong uri ng pagkilos.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: at muling nagpadala ng mga mensahero
  rationale: Ang מַלְאָכִים ay mga taong sugo sa kontekstong ito. Ang “muling” ay likas na nagpapakita ng inuulit na pagpapadala sa daloy ng salaysay, gaya ng gamit ng שׁוב kasama ng sumunod na pandiwa.
- source_word: אֶל חִזְקִיָּהוּ
  choice: kay Ezequias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan at ang likas na panandang patunguhan para sa tao.
