    issue: '"sa iyo" sa "makipaglaban sa iyo"'
    rationale: Bagaman nauunawaan, maaaring magpahiwatig ito ng pakikipaglaban na kasama ang kausap. Ang "makipaglaban laban sa iyo" ay mas malinaw na nagsasaad ng pag-atake, gaya ng hinihingi ng kontekstong militar.
  - severity: low
    issue: '"Tingnan mo" para sa הִנֵּה'
    rationale: Hindi mali, ngunit ang "Narito" ay mas natural na pangmarka ng iniulat na balita sa marangal na modernong Filipino.
  - severity: low
    issue: '"na sinasabi," sa hulihan'
    rationale: Mas natural at mas malinaw ang "na nagsasabi:" bilang bukas na pagpapakilala sa direktang mensaheng itutuloy sa kasunod na talata.
  - severity: low
    issue: '"Ezequias"'
    rationale: Mas pangkaraniwan sa modernong Tagalog na salin ang "Hezekias"; pinaiigting nito ang pagkakapare-pareho ng pagbabaybay ng mga pangalan.
