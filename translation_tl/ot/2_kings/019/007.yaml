base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: tl
  text: “Narito, maglalagay ako sa kanya ng isang espiritu[a]. Makakarinig siya ng isang balita[b] at babalik sa sarili niyang lupain. Ibubuwal ko siya sa pamamagitan ng tabak sa sarili niyang lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang disposisyon”; ang salitang Hebreo ay maaari ring mangahulugang “hangin” o “hininga.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang ulat” o “isang sabi-sabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili ang puwersang pantawag-pansin ng pahayag ng Diyos sa natural at marangal na Filipino.
- source_word: נֹתֵן
  choice: maglalagay ako
  rationale: Ang participle kasunod ng הִנְנִי ay nagpapahiwatig ng nalalapit na pagkilos; malinaw itong naihahayag ng anyong panghinaharap sa Filipino.
- source_word: רוּחַ
  choice: isang espiritu
  rationale: Tuwirang sinasalamin nito ang malawak na kahulugan ng salitang Hebreo at hindi labis na nililinaw kung ito ay isang espiritung kumikilos o isang panloob na disposisyon.
- source_word: שְׁמוּעָה
  choice: isang balita
  rationale: Natural at malawak ang “balita” sa Filipino, at maaari itong tumukoy sa isang ulat o sabi-sabi nang hindi ipinapalagay kung napatunayan ito.
- source_word: וְשָׁב
  choice: at babalik
  rationale: Malinaw na ipinahahayag ang kasunod na pagbabalik sa pinanggalingang lupain.
- source_word: לְאַרְצוֹ
  choice: sa sarili niyang lupain
  rationale: Natural na ipinapakita sa Filipino ang panghalip na hulapi at binibigyang-diin na iyon ang kanyang sariling lupain.
- source_word: וְהִפַּלְתִּיו
  choice: Ibubuwal ko siya
  rationale: Pinananatili ang causative na diwa ng Hiphil ng נפל nang hindi ito pinapalitan ng mas mapagpaliwanag na “papatayin.”
- source_word: בַּחֶרֶב
  choice: sa pamamagitan ng tabak
  rationale: Malinaw na pinananatili ang instrumental na diwa at ang larawang “tabak” sa Hebreo.
- source_word: בְּאַרְצוֹ
  choice: sa sarili niyang lupain
  rationale: Inuulit ang parirala gaya sa Hebreo at itinatampok ang kabalintunaang doon mangyayari ang kanyang pagbagsak.
theological_decisions:
- issue: Kahulugan ng רוּחַ sa pahayag ng paghatol ng Diyos
  choice: isang espiritu
  alternative: isang disposisyon; isang hangin; isang hininga
  rationale: Ipinakikita ng konteksto ang makapangyarihang pagkilos ng Diyos na hahantong sa pagkarinig ng hari ng balita at sa pagbabalik niya. Pinananatili ng “isang espiritu” ang lawak at tensiyong teolohikal ng salitang Hebreo nang hindi tiyakang inilalarawan ang paraan ng pagkilos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Narito” bilang maikli at kinikilalang panawag-pansin, habang iniwasan ang labis na arkaiko o denominasyonal na pananalita. Inilagay ang mga pananda ng talababa pagkatapos mismo ng “espiritu” at “balita,” na siyang mga salitang tinutukoy ng mga tala.
