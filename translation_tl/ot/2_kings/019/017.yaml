  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: tl
  text: Totoo nga[a], Yahweh, winasak ng mga hari ng Asiria ang mga bansa at ang kanilang lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tunay nga,” “Talaga,” o “Tiyak nga.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kanilang lupain.” Maaaring kolektibo o distributibo ang isahan, kaya maaari ding isaling “kanilang mga lupain.”
