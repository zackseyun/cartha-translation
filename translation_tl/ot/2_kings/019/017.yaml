lexical_decisions:
- source_word: אָמְנָם
  choice: Totoo nga
  rationale: Nagpapahayag ito ng mariing pagkilala na totoo ang naunang sinabi; natural sa makabagong Filipino at pinananatili ang diin ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: הֶחֱרִיבוּ
  choice: winasak
  rationale: Ipinahihiwatig ng Hiphil ng חרב ang pagdudulot ng pagkawasak o pagkatiwangwang; ang “winasak” ay malinaw at angkop sa konteksto ng pananakop.
- source_word: מַלְכֵי אַשּׁוּר
  choice: mga hari ng Asiria
  rationale: Tuwirang salin ng construct chain at natural na anyo sa Filipino.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Sa kontekstong heopolitikal, tumutukoy ito sa mga bansang nilupig ng Asiria.
- source_word: אַרְצָם
  choice: kanilang lupain
  rationale: Pinananatili ang gramatikal na isahan ng Hebreo, bagaman maaari itong unawain nang kolektibo o distributibo bilang mga lupain ng maraming bansa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Totoo nga” upang maipahayag ang mariing pagpapatibay nang hindi makaluma; pinanatili naman ang isahang “lupain” upang katawanin ang anyo at tunay na ambiguity ng Hebreo.
