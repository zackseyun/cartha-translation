  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: tl
  text: 'Ito ang salitang sinabi ni Yahweh tungkol sa kanya: “Hinahamak ka ng Birheng Anak na Babae ng Zion; nililibak ka niya. Sa likuran mo, iniiling ng Anak na Babae ng Jerusalem ang kanyang ulo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pag-iling ng ulo ay kilos ng paghamak o panunuya sa kontekstong ito.
    reason: cultural_note
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Ito ang sinabi
  rationale: Sa pormulang nagpapakilala ng pahayag ng Diyos, natural sa modernong Tagalog ang “Ito ang sinabi” at malinaw nitong ipinapahayag na ang sumusunod ay mensahe o pahayag.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: sinabi ni Yahweh tungkol sa kanya
  rationale: Ang עָלָיו ay tumutukoy sa paksa ng pahayag, kaya “tungkol sa kanya” ang pinili sa halip na tahasang “laban sa kanya,” bagaman hatol ang konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בָּזָה לְךָ
  choice: Hinahamak ka
  rationale: Ang pandiwa ay nagpapahayag ng pagtingin at pagtrato nang may matinding paghamak; tuwiran at likas sa Tagalog ang “hinahamak.”
- source_word: לָעֲגָה לְךָ
  choice: nililibak ka niya
  rationale: Ang pandiwa ay nangangahulugang manlibak o mangutya. Ang “nililibak” ay dignified ngunit nauunawaan pa rin sa kasalukuyang Filipino.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: birheng anak na babae ng Zion
  rationale: Pinananatili ang parehong larawang “birhen” at “anak na babae,” na tumutukoy sa Zion bilang isang babaeng personipikasyon at naglalarawan sa kanya bilang hindi nalupig.
- source_word: אַחֲרֶיךָ
  choice: habang papalayo ka
  rationale: Sa eksena ng panunuya, ipinahihiwatig ng literal na “sa likuran mo” na umaalis o umuurong ang kinakausap. Ang “habang papalayo ka” ay natural sa Tagalog at pinananatili ang larawang iyon.
- source_word: רֹאשׁ הֵנִיעָה
  choice: Iling nang iling sa iyo
  rationale: Ang pag-iling ng ulo ay kilos ng paghamak o panunuya rito. Isinasama ang “sa iyo” upang maging malinaw ang tudlaan ng kilos.
- source_word: בַּת יְרוּשָׁלִָם
  choice: ang anak na babae ng Jerusalem
  rationale: Pinananatili ang patulang personipikasyon at ang paralelismo nito sa “anak na babae ng Zion.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang personal na pangalan ng Diyos; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung ang עָלָיו ay “tungkol sa kanya” o “laban sa kanya”
  choice: tungkol sa kanya
  alternative: laban sa kanya
  rationale: Maaaring magkaroon ng salungat na diwa dahil sa konteksto ng hatol, ngunit ang pang-ukol mismo ay maaari lamang magtakda ng paksa. Pinananatili ng “tungkol sa kanya” ang mas malawak na kahulugan nang hindi pinatitindi ang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na may dignified at patulang himig. Pinanatili ang personipikasyong “birheng anak na babae ng Zion” at “anak na babae ng Jerusalem,” habang ginawang natural ang kilos ng panunuya sa hulihan ng talata.
