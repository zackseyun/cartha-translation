base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: tl
  text: Nang marinig ito ni Haring Hezekias, pinunit niya ang kaniyang mga damit, nagdamit siya ng magaspang na telang sako, at pumasok siya sa bahay ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Nang marinig ito
  rationale: Likas na inilalahad sa modernong Tagalog ang kasunod na pangyayari at ang temporal na ugnayan; ang “ito” ay tumutukoy sa naunang mensaheng narinig ng hari.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: ni Haring Hezekias
  rationale: Karaniwang ayos sa Tagalog ang titulo bago ang pangalan; ginamit ang nakaugaliang anyong Tagalog na “Hezekias.”
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Malinaw at natural itong paglalarawan ng tanda ng matinding dalamhati at pagluluksa.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: nagbalot siya ng telang-sako
  rationale: Ipinapahayag ng “nagbalot” ang reflexive na kilos, samantalang nililinaw ng “telang-sako” na materyal na panluksa ang tinutukoy.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: at pumasok sa bahay ni Yahweh
  rationale: Ang “pumasok” ay tumpak sa kilos patungo sa loob; pinananatili ng “bahay ni Yahweh” ang konkretong idyomang Hebreo para sa templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito bilang “Yahweh” upang hindi mapalitan ng titulong “PANGINOON.”
- issue: Pagpapanatili sa idyomang בֵּית יְהוָה
  choice: bahay ni Yahweh
  alternative: templo ni Yahweh
  rationale: Ang “bahay ni Yahweh” ay nagpapanatili sa mismong larawan at paraan ng pagpapahayag ng Hebreo, habang malinaw sa konteksto na templo ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “telang-sako” kaysa sa payak na “sako” upang hindi mapagkamalang sisidlan, at pinanatili ang “bahay ni Yahweh” bilang natural ngunit source-grounded na parirala.
