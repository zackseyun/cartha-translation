base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: tl
  text: Kinuha ni Ezequias ang mga sulat[a] mula sa kamay ng mga sugo at binasa ang mga iyon. Pagkatapos, umakyat siya sa bahay ni Yahweh, at iniladlad ni Ezequias iyon[b] sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dokumento,” “mga balumbon,” o “mga sulatin”; mas malawak ang kahulugan ng salitang Hebreo kaysa sa personal na mga liham lamang.
    reason: lexical_alternative
  - marker: b
    text: Isahan ang panghalip sa Hebreo (“iyon”), bagaman maramihan ang naunang “mga sulat.” Maaaring ituring dito ang mga sulat bilang isang kabuuang nakasulat na mensahe.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: mga sulat
  rationale: Malawak ang saklaw ng salitang Hebreo—maaaring tumukoy sa mga kasulatan, dokumento, o balumbon—ngunit sa konteksto ay mga nakasulat na mensaheng dala ng mga sugo ang tinutukoy. Pinakanatural dito ang “mga sulat.”
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang kongkretong idyomang Hebreo; malinaw sa Tagalog na tinanggap ni Ezequias ang mga sulat mula sa mga sugo.
- source_word: הַמַּלְאָכִים
  choice: mga sugo
  rationale: Mga taong naghatid ng mensahe ang tinutukoy sa makasaysayang konteksto, hindi mga anghel.
- source_word: וַיִּקְרָאֵם
  choice: binasa ang mga iyon
  rationale: Maramihan ang hulaping panghalip sa Hebreo at tumutugma sa “mga sulat.”
- source_word: וַיַּעַל
  choice: umakyat siya
  rationale: Pinananatili ang kahulugan ng עלה na “umakyat,” na angkop sa pagpunta sa templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Malapit ito sa literal na pariralang “bahay ni Yahweh” at nauunawaan sa konteksto bilang templo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: iniladlad iyon
  rationale: Ipinahihiwatig ng pandiwa ang paglalatag o paglaladlad ng nakasulat na mensahe. Isahan ang hulaping layon sa Hebreo kahit maramihan ang naunang “mga sulat,” kaya pinanatili ang paglipat sa isahan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas at malapit na katumbas ito ng idyomang nangangahulugang nasa presensya ni Yahweh.
theological_decisions:
- issue: Paglilipat sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba ng personal na pangalan at ng titulong “Panginoon,” nang hindi nagdaragdag ng interpretasyong teolohikal.
- issue: Paglaladlad ng sulat sa harap ni Yahweh
  choice: Pisikal na kilos na inilalahad sa payak na pananalita
  alternative: Ipaliwanag sa pangunahing teksto na ito ay panalangin
  rationale: Malinaw na inilatag ni Ezequias ang nakasulat na mensahe sa presensya ni Yahweh, ngunit hindi tahasang sinasabi ng talata ang salitang “nanalangin.” Hindi ito idinagdag sa pangunahing teksto.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang konkretong “mula sa kamay,” ang pag-akyat sa bahay ni Yahweh, at ang kapansin-pansing pagbabago mula sa maramihang layon sa “binasa” tungo sa isahang layon sa “iniladlad,” upang hindi patahimikin ang anyo at tensiyon ng tekstong Hebreo.
