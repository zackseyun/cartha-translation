  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Shallum at ang sabuwatang isinabwatan niya[a]—narito,[b] nakasulat ang mga ito sa Aklat ng mga Kasaysayan ng mga Hari ng Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, magkaugnay ang pangngalan at pandiwa: “ang sabuwatang isinabwatan niya,” isang pag-uulit para sa diin.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “tingnan, nakasulat ang mga ito.” Isa itong pormulang nagtuturo sa nakasulat na talaan.'
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy ito sa opisyal na mga talaan ng mga hari na paulit-ulit na binabanggit sa Mga Hari, hindi kinakailangang sa kanonikal na aklat na Mga Cronica.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa karaniwang pormula tungkol sa paghahari, ang יֶתֶר דִּבְרֵי ay tumutukoy sa nalalabing mga gawa o pangyayari, hindi lamang sa mga salita.
- source_word: שַׁלּוּם
  choice: Shallum
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang Hebreo.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: at ang sabuwatang binuo niya
  rationale: Ang קֶשֶׁר ay isang sabuwatan o lihim na pakana. Isinalin nang natural sa Tagalog ang magkaugnay na pangngalan at pandiwang Hebreo; ipinaalam sa talababa ang literal na pag-uulit.
- source_word: הִנָּם כְּתֻבִים
  choice: narito, nakasulat ang mga ito
  rationale: Pinananatili ng “narito” ang deiktiko at pormulang diin ng הִנָּם, samantalang tuwirang tinutumbasan ng “nakasulat” ang כְּתֻבִים.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Israel
  rationale: Isang likas at marangal na pamagat sa Tagalog para sa binanggit na talaang maharlika; ang עַל ay idiomatikong “sa” kapag tumutukoy sa nilalaman ng aklat.
