  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Zacarias—narito, nakasulat ang mga iyon sa Aklat ng mga Talaan[a] ng mga Hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Kasaysayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Ang iba pang
  rationale: Likas na Filipino para sa natitirang bahagi ng pormulang pangkasaysayan; hindi dinaragdagan ng tahasang temporal na “ngayon” ang simpleng pang-ugnay na וְ.
- source_word: דִּבְרֵי
  choice: mga ginawa
  rationale: Sa pormula ng pagbubuod sa paghahari, tumutukoy ito sa mga gawa o pangyayari, hindi lamang sa mga salitang binigkas.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Filipino.
- source_word: הִנָּם
  choice: narito, ... ang mga iyon
  rationale: Pinananatili ang pansin-drowing at pormulang diin ng Hebreo sa paraang marangal at mauunawaan sa Filipino.
- source_word: כְּתוּבִים
  choice: nakasulat
  rationale: Tuwirang sinasalamin ang pasibong participle ng Hebreo; hindi ito ginawang mas interpretatibong “nakatala.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Ang “sa” ang natural na Filipino para sa impormasyong nasusumpungan sa isang kasulatang sanggunian; ang “Aklat” ay angkop sa pormulang pamagat.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Kasaysayan
  rationale: Ipinahahayag ang titulong tumutukoy sa kronika o taunang tala ng kaharian, habang iniiwan sa talababa ang wastong alternatibong “mga Talaan.”
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Natural na ipinapakita sa Filipino ang ugnayang taglay o kaugnay ng opisyal na kasulatan at ng mga hari ng Israel.
