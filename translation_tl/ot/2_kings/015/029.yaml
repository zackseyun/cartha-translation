translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hari ng” sa halip na mas pormal na “hari sa,” at pinanatili ang mabilis na daloy ng salaysay at ang appositional na buod pagkatapos ng gitling.
