  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: tl
  text: Noong panahon ni Pekah, hari ng Israel, dumating si Tiglat-pileser na hari ng Asiria at sinakop ang Ijon, Abel-bet-maaca, Janoa, Kedes, Hazor, Gilead, at Galilea—ang buong lupain ng Neftali—at ipinatapon niya sila sa Asiria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “dinala niya sila sa Asiria.”'
    reason: Ibinibigay ang mas literal at pasalaysay na alternatibo para sa pandiwang tumutukoy sa sapilitang pagdadala sa mga tao sa pagkatapon, nang hindi nagdaragdag ng paglalarawang wala sa pandiwang Hebreo.
lexical_decisions:
- source_word: בִּימֵי
  choice: Noong panahon ni
  rationale: Likas na makabagong Tagalog para sa pormulang Hebreo na nagtatakda ng panahong pangkasaysayan, nang hindi ito nililimitahan sa buong paghahari ni Pekah.
- source_word: בָּא
  choice: dumating
  rationale: Pinananatili ang payak na kahulugan ng pandiwang Hebreo; ang kasunod na “sinakop” ang malinaw na nagpapakita ng kontekstong militar.
- source_word: וַיִּקַּח
  choice: sinakop
  rationale: Sa konteksto ng mga lunsod at rehiyong kinuha sa digmaan, mas malinaw at natural ang “sinakop” kaysa literal na “kinuha.”
- source_word: עִיּוֹן
  choice: Ijon
  rationale: Transliterasyong madaling basahin sa Filipino at malapit sa tradisyonal na anyo ng pangalang pook.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-bet-maaca
  rationale: Pinananatiling isang tambalang pangalan ng pook, gamit ang baybay na angkop sa tunog at ortograpiyang Filipino.
- source_word: יָנוֹחַ
  choice: Janoa
  rationale: Filipinisadong transliterasyon ng pangalan ng pook.
- source_word: קֶדֶשׁ
  choice: Kedes
  rationale: Filipinisadong transliterasyon na kumakatawan sa pangalang Hebreo.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Karaniwang transliterasyon; pinananatili ang anyong madaling makilala.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Pangngalang pantangi ng rehiyon; hindi na kailangan ang tiyak na pantukoy sa loob ng talaan.
- source_word: הַגָּלִילָה
  choice: Galilea
  rationale: Karaniwan at natural na anyo ng pangalan ng rehiyon sa Filipino.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: ang buong lupain ng Neftali
  rationale: Ipinakikita ang buod na heograpikal ng naunang talaan at tuwirang isinasalin ang “buong lupain.”
- source_word: וַיַּגְלֵם
  choice: ipinatapon niya sila
  rationale: Ang hiphil ng גלה ay tumutukoy sa sapilitang pagpapaalis o deportasyon. Pinananatili ng “sila” ang panghalip sa Hebreo at hindi tahasang nagdaragdag ng salitang “mga naninirahan,” bagaman iyon ang likas na tinutukoy.
- source_word: אַשּׁוּרָה
  choice: sa Asiria
  rationale: Ang hulaping direksiyonal sa Hebreo ay likas na ipinapahayag sa Filipino sa pamamagitan ng “sa.”
