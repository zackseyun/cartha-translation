    issue: Ang alternatibong talababa na “dinala niya silang bihag” ay hindi ganap na neutral.
    rationale: Ang וַיַּגְלֵם ay tumutukoy sa pagpapatapon/deportasyon. Maaaring kasama sa pangyayaring iyon ang pagkabihag, ngunit ang pangngalang “bihag” ay hindi mismo ang ipinahahayag ng pandiwa. Mas ligtas ang literal na alternatibong “dinala niya sila sa Asiria.”
