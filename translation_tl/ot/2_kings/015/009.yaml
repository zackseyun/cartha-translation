reference: 2 Kings 15:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng ginawa ng kanyang mga ninuno. Hindi niya tinalikuran ang mga kasalanan ni Jeroboam na anak ni Nebat, na sa pamamagitan ng mga ito ay inakay niya ang Israel upang magkasala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “...ang mga kasalanan ni Jeroboam na anak ni Nebat, na nag-udyok sa Israel na magkasala.” Maaaring iugnay ang kaugnay na sugnay na Hebreo kay Jeroboam mismo o sa mga kasalanang nauugnay sa kanya; pinananatili ng pangunahing teksto ang malapit na ugnayan ng mga kasalanan ni Jeroboam at ng pag-akay sa Israel sa pagkakasala.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Likas na salaysay sa nagdaang panahon; pinananatili ang tuwirang kilos ng pandiwang עשה.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: ang masama sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang pormulang Hebreo at ang larawan ng pagsusuri sa paningin ni Yahweh, habang natural pa rin sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: gaya ng ginawa ng kanyang mga ninuno
  rationale: Ang “gaya” ay naghahatid ng paghahambing; ang “mga ninuno” ay natural sa Tagalog at angkop sa dinastikong konteksto nang hindi nililimitahan sa agarang ama.
- source_word: לֹא סָר
  choice: Hindi niya tinalikuran
  rationale: Sa kontekstong moral at panrelihiyon, malinaw na ipinapahayag ng “tinalikuran” ang hindi paglayo o hindi paghinto sa dating landas.
- source_word: מֵחַטֹּאות
  choice: ang mga kasalanan
  rationale: Pinananatili ang maramihang anyo ng pangngalan at ang pagtukoy sa huwaran ng mga makasalanang gawa ni Jeroboam.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang anyong Filipino para sa pangalan at ugnayang pampamilya.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na siyang nag-udyok sa Israel na magkasala
  rationale: Malinaw at natural na inilalahad ang causative na diwa ng הֶחֱטִיא. Sa pangunahing teksto, ang ipinahihiwatig na gumagawa ay si Jeroboam, ngunit itinatala sa talababa ang posibleng pagkakaugnay ng sugnay sa kanyang mga kasalanan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Tinutukoy ng kaugnay na sugnay na אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: Si Jeroboam ang nag-udyok sa Israel na magkasala
  alternative: Sa pamamagitan ng mga kasalanang iyon ay inakay ni Jeroboam ang Israel na magkasala
  rationale: Ang pandiwang Hebreo ay panlalaking isahan at natural na tumutukoy kay Jeroboam bilang gumagawa. Gayunman, dahil maaaring iugnay sa kahulugan ang sugnay sa naunang “mga kasalanan,” pinananatili sa talababa ang alternatibong pagbasa.
- issue: Saklaw ng אֲבֹתָיו sa kontekstong maharlika
  choice: kanyang mga ninuno
  alternative: kanyang mga ama
  rationale: Ang “mga ninuno” ay dignified at likas sa modernong Tagalog at maaaring tumukoy sa mga naunang hari sa kanyang angkan o tradisyon; ang literal na “mga ama” ay maaaring mapagkamalang tumutukoy lamang sa mga magulang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Iniwasan ang sobrang literal na “sa mga mata” at ang hindi likas na “mga ama,” ngunit pinanatili ang pormulang teolohikal, ang personal na pangalang Yahweh, at ang sanhiang diwa ng pandiwa.
