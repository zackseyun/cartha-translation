  source_fidelity: 'Tumpak ang pangkalahatang kahulugan ng draft: ginawa ng hari ang wastong sinusuri ni Yahweh, alinsunod sa ginawa ng kanyang amang si Amazias. Gayunman, ang "ang matuwid" ay maaaring tumukoy sa isang taong matuwid sa modernong Tagalog, samantalang ang הַיָּשָׁר ay tumutukoy rito sa "kung ano ang tama/matuwid" na ginawa.'
  naturalness: Marangal at malinaw ang pangungusap, ngunit mas likas at hindi malabo sa modernong Filipino Tagalog ang "ang tama" kaysa "ang matuwid" sa tungkuling ito. Mas malinaw rin ang "ayon sa lahat ng ginawa" para sa כְּכֹל אֲשֶׁר kaysa "gaya ng lahat ng ginawa."
  terminology: Wastong pinanatili ang "Yahweh" para sa יהוה at ang "Amazias" ay katanggap-tanggap na anyong Tagalog ng pangalan. Ang "ama na si Amazias" ay natural at malinaw na pagkakabit ng pangalan sa ama.
