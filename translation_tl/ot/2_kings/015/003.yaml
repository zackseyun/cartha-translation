  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh, ayon sa lahat ng ginawa ng kanyang ama na si Amazias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang waw-consecutive at pandiwang עשה ay nagsasalaysay ng ginawa ng hari. Hindi na kailangang isalin nang hiwalay ang panimulang waw upang maging natural ang daloy sa modernong Tagalog.
- source_word: הַיָּשָׁר
  choice: ang matuwid
  rationale: 'Ang pang-uring ישר na may pantukoy ay ginagamit bilang pangngalan: ‘ang matuwid’ o ‘ang tama.’ Ang ‘ang matuwid’ ay dignified at likas sa pormulang pagtataya sa mga hari.'
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang Hebreong talinghaga ng pagsusuri ayon sa pananaw ni Yahweh at natural din sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh,’ sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: כְּכֹל אֲשֶׁר
  choice: gaya ng lahat ng
  rationale: Ipinahahayag nito ang pagkakatulad o pagsunod sa kabuuang huwaran ng mga ginawa ng ama, nang hindi dinaragdagan ang kahulugan.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang simpleng aspektong natapos ay sapat at natural sa Tagalog; malinaw na nauna ang mga ginawa ni Amazias dahil sa konteksto ng paghahambing.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Amaziah.
- source_word: אָבִיו
  choice: kanyang amang
  rationale: Tumutukoy ito sa literal niyang ama sa agarang konteksto; ang anyong ‘kanyang amang si’ ay natural na Tagalog bago ang pangalang pantangi.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tradisyonal ngunit madaling maunawaang pormulang ‘ang matuwid sa paningin ni Yahweh.’
