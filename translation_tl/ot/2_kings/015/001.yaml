base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: tl
  text: Noong ikadalawampu't pitong taon ng paghahari ni Jeroboam, hari ng Israel, nagsimulang maghari si Azarias na anak ni Amasias, hari ng Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: Nang ikadalawampu't pitong taon ng paghahari
  rationale: Ang parirala ay pormula ng pagtukoy sa taon ng paghahari. Ginawang ordinal ang Hebreong kardinal na bilang upang maging likas at malinaw sa modernong Tagalog.
- source_word: לְיָרָבְעָם
  choice: ni Jeroboam
  rationale: Sa pormulang ito, itinutukoy ng לְ ang hari na batayan ng pagbibilang ng taon ng paghahari; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “ni.”
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Karaniwang titulong makahari; ikinabit sa pangalan sa natural na ayos ng Tagalog.
- source_word: מָלַךְ
  choice: nagsimulang maghari
  rationale: Sa ulat ng pagluklok, ipinahihiwatig ng pandiwa ang pagsisimula ng paghahari, hindi ang kabuuang tagal nito.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: בֶן אֲמַצְיָה
  choice: anak ni Amazias
  rationale: Tuwirang ipinahahayag ang ugnayang anak at ama sa likas na Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: ang hari ng Juda
  rationale: Ang parirala ay aposisyong titulo ni Azarias; pinanatili ito nang walang idinagdag na interpretasyon.
