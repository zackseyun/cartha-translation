base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: tl
  text: Naging hari si Shallum na anak ni Jabesh noong ikatatlumpu't siyam na taon ng paghahari ni Uzias bilang hari ng Juda. Isang buwan siyang naghari sa Samaria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang buwan ng mga araw,” ibig sabihin, humigit-kumulang isang buwan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: naging hari
  rationale: Ipinahihiwatig ng anyong qatal sa pormulang ito ang pagluklok ni Shallum, kaya mas tiyak ang “naging hari” kaysa sa payak na “naghari.”
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה לְעֻזִיָּה
  choice: nang ikatatlumpu't siyam na taon ng paghahari ni Uzias
  rationale: Natural na Filipino ito para sa pormula ng pagtutugma ng mga taon ng paghahari at nililinaw na ang bilang ay ayon sa paghahari ni Uzias.
- source_word: וַיִּמְלֹךְ
  choice: Naghari siya
  rationale: Isinusulong nito ang salaysay mula sa pagluklok tungo sa tagal ng kanyang pamamahala.
- source_word: יֶרַח יָמִים
  choice: sa loob ng isang buwan
  rationale: Ang literal na idyomang Hebreo ay “isang buwan ng mga araw,” ngunit ang natural at malinaw na katumbas sa modernong Filipino ay “isang buwan.” Pinananatili sa talababa ang literal na anyo.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Tuwirang lokatibong salin ito; ang Samaria ang lugar kung saan siya naghari.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Filipino. Pinanatili ang pormulang pangkronolohiya ngunit ginawang malinaw na ang ikatatlumpu't siyam na taon ay taon ng paghahari ni Uzias. Ang talababa ay ikinabit sa “isang buwan,” ang pariralang aktuwal nitong ipinapaliwanag.
