  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Menahem kasama ng kanyang mga ninuno.[a] Naghari bilang kapalit niya ang anak niyang si Pekahia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “humiga siyang kasama ng kanyang mga ninuno.” Isa itong nakaugaliang pahayag sa Hebreo para sa pagkamatay ng isang hari at sa paghalili ng susunod na hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: namatay ... at nalakip sa kanyang mga ninuno
  rationale: Ang buong parirala ay nakaugaliang pormula sa Hebreo para sa pagkamatay ng isang hari at pagkalakip niya sa mga nauna sa kanya. Mas natural ito sa modernong Tagalog kaysa sa literal na “nahigang kasama ng kanyang mga ama,” habang pinananatili sa talababa ang orihinal na larawan.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Sa pormula ng paghalili sa trono, ipinahihiwatig ng pandiwa ang pagsisimula ng paghahari; malinaw ito sa Tagalog sa pariralang “nagharing kapalit niya.”
- source_word: פְּקַחְיָה
  choice: Pekahias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalan sa Bibliya.
- source_word: בְנוֹ
  choice: ang anak niyang
  rationale: Likas na ayos sa Tagalog na malinaw na nagpapanatili sa ugnayang ama at anak.
- source_word: תַּחְתָּיו
  choice: kapalit niya
  rationale: Tumpak at natural na paglalarawan ng paghalili sa trono sa modernong Tagalog.
