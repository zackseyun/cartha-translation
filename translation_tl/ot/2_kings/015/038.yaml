base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Jotam kasama ng kanyang mga ninuno, at inilibing siya kasama ng kanyang mga ninuno sa Lungsod ni David, na kanyang ninuno.[a] At naghari si Ahaz na kanyang anak bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “si David na kanyang ama.” Dito, ang “ama” ay nangangahulugang ninuno sa angkan o dinastiya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: namatay ... kasama ng kanyang mga ninuno
  rationale: Ang parirala ay nakaugaliang pormula tungkol sa pagkamatay ng hari. Sa makabagong Tagalog, malinaw at likas ang “namatay,” samantalang naipahihiwatig pa rin ng “kasama ng kanyang mga ninuno” ang pagpanaw at pagsama sa mga naunang salinlahi.
- source_word: וַיִּקָּבֵר
  choice: inilibing
  rationale: Tumpak at likas na pasibong paglalarawan sa sumunod na pangyayari.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: sa Lungsod ni David, na kanyang ninuno
  rationale: Ang אָבִיו ay literal na “kanyang ama,” ngunit dito ay tumutukoy kay David bilang ninuno sa dinastiya, hindi bilang tunay na ama ni Jotam. Ang “ninuno” ay umiiwas sa maling pagkaunawa sa Tagalog habang pinananatili ang ugnayang pangangkanan.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Karaniwang katumbas sa Tagalog para sa paghahari ng isang hari sa pormulang panghalili.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Likas na Tagalog para sa paghalili sa trono at malinaw na ipinapahayag ang diwa ng pagkuha sa kanyang puwesto.
theological_decisions:
- issue: Kahulugan ng אָבִיו (“kanyang ama”) kaugnay ni David
  choice: Isinalin bilang “kanyang ninuno,” na tumutukoy sa ninunong dinastiko.
  alternative: “kanyang ama,” ayon sa literal na anyo ng Hebreo
  rationale: Hindi si David ang mismong ama ni Jotam; sa pormulang maharlika, ang “ama” ay maaaring tumukoy sa isang ninuno sa angkan. Pinipigilan ng “ninuno” ang isang maling historikal na pagbasa nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “namatay” sa halip na literal na “humimlay” upang maging likas at hindi malabo sa ordinaryong mambabasa; pinanatili ang pormal na himig ng tala tungkol sa pagpanaw at paghalili ng hari.
