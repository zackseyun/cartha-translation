  terminology: Ang “mga ninuno” ay angkop na pagsasalin sa dinastikong kahulugan ng “mga ama.” Ang “na kanyang ninuno” para kay David, na may talababa tungkol sa literal na “ama,” ay malinaw at hindi nagpapahiwatig na si David ang agarang ama ni Jotam. Ang “naghari bilang kahalili niya” ay wastong pormula ng paghalili.
