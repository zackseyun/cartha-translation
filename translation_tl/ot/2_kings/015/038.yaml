  source_fidelity: 'Kailangang ibalik ang unang sugnay ng pormula sa Hebreo: hiwalay nitong sinasabing si Jotam ay “nahimlay kasama ng kanyang mga ama/ninuno,” saka hiwalay na inilibing kasama ng mga ito. Pinagsama ng draft ang dalawang pangyayari at kaya nawawala ang unang pahayag. Ang “Lungsod ni David” at ang paghalili ni Ahaz ay tama sa diwa.'
