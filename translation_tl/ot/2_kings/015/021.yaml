  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga gawa ni Menahem at ang lahat ng ginawa niya—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Aklat ng mga Taunang Talaan ng mga Hari ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga gawa
  rationale: Sa pormulang nagbubuod sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga gawa o pangyayari sa buhay ng hari, hindi lamang sa kanyang mga salita. Likas sa modernong Tagalog ang “iba pang mga gawa” para sa nalalabing tala.
- source_word: מְנַחֵם
  choice: Menahem
  rationale: Isinalin sa karaniwang transliterasyon ng pangalang Hebreo.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng ginawa niya
  rationale: Tuwirang pinananatili ang pormulang Hebreo at ang bahagyang pag-uulit nito sa naunang “mga gawa.”
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa, pati ang tahasang diwa ng “nakasulat.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng kasulatan,” ang parirala ay tumutukoy sa nilalaman ng isang nakasulat na tala; “sa Aklat” ang likas na katumbas sa Tagalog.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Aklat ng mga Kasaysayan
  rationale: Ang parirala ay tumutukoy sa opisyal na tala ng mga pangyayari o annals. Pinili ang pamilyar at malinaw na “mga Kasaysayan,” habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Ang לְ ay nagpapahayag dito ng kaugnayan sa pamagat ng sangguniang aklat; natural itong maipapahayag sa Tagalog sa pamamagitan ng “ng.”
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang pormulang pangwakas ng salaysay at ang retorikal na tanong. Inilagay ang panandang [a] pagkatapos ng buong pamagat na tinutukoy ng talababa, sa halip na pagkatapos ng pangalan ni Menahem.
