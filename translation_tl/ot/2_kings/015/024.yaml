id: 2KI.15.24
reference: 2 Kings 15:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh. Hindi niya tinalikuran ang mga kasalanan ni Jeroboam na anak ni Nebat, na siyang nagbunsod sa Israel na magkasala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Natural na salin ng karaniwang pormula ng pagtatasa sa mga hari, habang pinananatili ang tuwirang moral na paghatol ng Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang idyomang Hebreo tungkol sa pagsusuri ng Diyos; ginagamit ang personal na pangalang Yahweh para sa Tetragrammaton.
- source_word: לֹא סָר מֵחַטֹּאות
  choice: Hindi niya tinalikuran ang mga kasalanan
  rationale: Sa kontekstong moral, ang סור ay tumutukoy sa hindi paglayo o pagtalikod sa isang masamang landasin; malinaw at likas sa modernong Tagalog ang 'tinalikuran.'
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang modernong Tagalog na anyo ng patronimikong Hebreo.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na siyang nagbunsod sa Israel na magkasala
  rationale: Ipinahahayag ng 'nagbunsod' ang causative na anyo ng חטא nang hindi labis na tinutukoy kung paano niya ito ginawa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo, kaya pinanatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Pananagutan ni Jeroboam at ng Israel sa kasalanan
  choice: nagbunsod sa Israel na magkasala
  alternative: pinagkasala ang Israel; inakay ang Israel sa kasalanan
  rationale: Pinananatili nito ang causative na diin ng Hiphil nang hindi ipinahihiwatig na walang sariling pananagutan ang Israel.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang 'tinalikuran' at 'nagbunsod' upang maging natural ngunit malapit pa rin sa Hebreong diwa.
