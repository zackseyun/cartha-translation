base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: tl
  text: Nang ikalimampung taon ng paghahari ni Azarias, hari ng Juda, naging hari sa Israel si Pekahia, anak ni Menahem, sa Samaria, at naghari siya nang dalawang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמִשִּׁים שָׁנָה
  choice: Nang ikalimampung taon ng paghahari
  rationale: Ang pormulang Hebreo ay tumutukoy sa taon ng paghahari na nagsisilbing batayan ng pagpepetsa; nilinaw sa natural na Tagalog ang ipinahihiwatig na paghahari.
- source_word: לַ/עֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: ni Azarias na hari ng Juda
  rationale: Ang ל ay nagtatakda kay Azarias bilang batayan ng bilang ng taon; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “ni,” habang tuwirang pinananatili ang titulo at kaharian.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormulang panghari, ang pandiwa rito ay tumutukoy sa pagluklok o pagsisimula ng paghahari, hindi lamang sa patuloy na pamamahala.
- source_word: פְּקַחְיָה בֶן מְנַחֵם
  choice: si Pekahias na anak ni Menahem
  rationale: Isinalin ang ugnayang pampamilya nang tuwiran at ginamit ang mga anyo ng pangalan na angkop sa tradisyong Tagalog.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Kasama ng “naging hari,” likas sa Tagalog ang “hari sa Israel” upang ipahayag ang nasasakupan; ang kahulugan ng pamumuno sa Israel ay nananatili.
- source_word: בְּ/שֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang ב ay lokatibo at tumutukoy sa kabiserang pinaghaharian niya.
- source_word: שְׁנָתָיִם
  choice: nang dalawang taon
  rationale: Ang dual na anyo ay tahasang nangangahulugang dalawang taon; idinugtong ang “naghari siya” upang mabuo at luminaw ang pangungusap sa Tagalog.
