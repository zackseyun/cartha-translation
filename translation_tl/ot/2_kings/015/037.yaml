base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: tl
  text: Noong mga araw na iyon, sinimulan ni Yahweh na ipadala laban sa Juda sina Rezin, hari ng Aram[b], at Peka, anak ni Remalias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “papasok sa Juda.” Maaaring lokatibo ang Hebreong pang-ukol, ngunit malamang na may mapanlabang diwa rito, kaya isinaling “laban sa Juda.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Aram”; tradisyonal na tinatawag na “Siria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Nang mga araw na iyon
  rationale: Likas na salin ng karaniwang Hebreong pariralang tumutukoy sa isang yugto ng kasaysayan.
- source_word: הֵחֵל
  choice: nagsimulang
  rationale: Ipinahahayag ng anyo rito ang pagsisimula ng isang kilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: magpadala ... laban sa Juda
  rationale: Pangunahing nangangahulugan ang pandiwa na 'magpadala'; sa kontekstong militar, ipinakikita ng 'laban sa' ang mapanlabang diwa ng Hebreong parirala habang kinikilala sa talababa ang posibleng lokatibong pagbasa.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezin na hari ng Aram
  rationale: Tuwirang isinasalin ang titulo at pinananatili ang Hebreong pangalang heograpiko na Aram.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: at Peka na anak ni Remalias
  rationale: Iniuugnay ng pantukoy sa tuwirang layon ang ikalawang taong ipinadala; natural sa Filipino ang 'anak ni' sa pagkakakilanlang patronimiko.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasan sa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagkilos ni Yahweh sa pagdating ng mga kaaway
  choice: nagsimulang magpadala si Yahweh laban sa Juda
  alternative: nagsimulang pahintulutan ni Yahweh na lumusob sa Juda
  rationale: Sinasabi ng tekstong Hebreo na si Yahweh ang nagsimulang 'magpadala.' Hindi ito pinahihinang gawing pahintulot lamang, kaya napapanatili ang teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang pantukoy na “kina” para sa dalawang taong ipinadala laban sa Juda. Inilagay ang mga talababa sa mismong bahaging nililinaw ng bawat isa.
