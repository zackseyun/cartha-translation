base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: tl
  text: Sa ikalawang taon ng paghahari ni Peka na anak ni Remalias, hari ng Israel, naging hari si Jotam na anak ni Uzias[a], hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag ding Azarias si Uzias sa ibang mga talata.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: Nang ikalawang taon ng paghahari ni Peka
  rationale: Ang pariralang Hebreo ay pormula ng pagtatakda ng panahon ayon sa taon ng paghahari. Ginawang ordinal ang literal na ‘dalawa’ at idinagdag ang ‘paghahari’ upang maging malinaw at natural sa Tagalog.
- source_word: בֶּן רְמַלְיָהוּ
  choice: na anak ni Remalias
  rationale: Pinanatili ang patronimiko para sa katumpakang pangkasaysayan, gamit ang natural na hulma sa Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng titulong maharlika at ng kahariang pinamumunuan ni Peka.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormulang ito, ang pandiwa ay tumutukoy sa pagluklok o pagsisimula ng paghahari, hindi lamang sa nagpapatuloy na pamamahala.
- source_word: יוֹתָם
  choice: Jotam
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Hebreo.
- source_word: בֶּן עֻזִיָּהוּ
  choice: na anak ni Uzias
  rationale: Isinalin ang pangalang nasa talata mismo; ang ibang pangalang Azarias para sa hari ring ito ay inilagay sa talababa.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Pinanatili ang appositional na titulo na tahasang kumikilala sa kaharian ni Jotam.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Pinanatili ang pormulang pangkasaysayan at ang dalawang titulong ‘hari,’ habang inayos ang pangungusap upang maging natural. Hindi nilagyan ng talababa ang ‘naging hari’ sapagkat ito ang malinaw na katumbas sa kontekstong ito; ang posibilidad na ‘nagsimulang maghari’ ay nakatala sa pasyang leksikal.
