  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: tl
  text: 'Ito ang salita ni Yahweh na sinabi niya kay Jehu: “Ang mga anak mo hanggang sa ikaapat na salinlahi ay uupo sa trono ng Israel.” At gayon nga ang nangyari.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: Ito ang
  rationale: Ginagamit ang panghalip bilang panturo sa naunang pangyayari, na siyang katuparan ng ipinahayag noon.
- source_word: דְבַר יְהוָה
  choice: salita ni Yahweh
  rationale: Pinananatili ang karaniwang biblikal na pahayag para sa isang banal na kapahayagan o pangako, nang hindi ito nililimitahan sa salitang “pangako” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא
  choice: na sinabi niya kay Jehu
  rationale: Natural sa modernong Tagalog at tapat sa diwa ng pagsasalita ni Yahweh kay Jehu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang tutuldok ay natural na pananda ng tuwirang sipi sa Tagalog at ginagampanan ang tungkulin ng Hebreong pambungad sa sinabi.
- source_word: בְּנֵי רְבִיעִים
  choice: Ang mga anak mo hanggang sa ikaapat na salinlahi
  rationale: Pinananatili ang tahasang salitang “mga anak” habang nililinaw na ang tinutukoy ay ang pagpapatuloy ng angkan ni Jehu sa apat na salinlahi.
- source_word: יֵשְׁבוּ לְךָ
  choice: ay uupo
  rationale: Pinananatili ang konkretong larawan ng pag-upo sa trono; hindi ito agad pinapalitan ng mas interpretatibong “maghahari.”
- source_word: עַל כִּסֵּא יִשְׂרָאֵל
  choice: sa trono ng Israel
  rationale: Tuwirang inililipat ang metaporang maharlika at malinaw sa karaniwang mambabasa.
- source_word: וַיְהִי כֵן
  choice: At gayon nga ang nangyari
  rationale: Natural na modernong Tagalog na malinaw na nagpapahayag ng katuparan ng naunang salita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa talata. Ang “Yahweh” ay nagpapanatili sa ipinahayag na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang biblikal na pariralang “salita ni Yahweh” at ang larawan ng pag-upo sa trono, habang ginamit ang natural na bantas at ayos ng pangungusap sa Tagalog.
