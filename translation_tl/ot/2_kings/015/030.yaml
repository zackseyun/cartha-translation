    rationale: Ang וַיִּקְשָׁר קֶשֶׁר ay konstruksiyong pandiwa at pangngalang magkaugnay ang ugat, na mas maayos ilarawan bilang “bumuo siya ng sabwatan,” hindi “nakipagsabwatan ng sabwatan.”
