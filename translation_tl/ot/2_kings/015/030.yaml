base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: tl
  text: Pagkatapos, nagbuo si Hosea na anak ni Ela ng sabwatan[a] laban kay Peka na anak ni Remalias. Sinaktan niya si Peka at pinatay niya ito, at naghari siya bilang kapalit ni Peka noong ikadalawampung taon ni Jotam na anak ni Uzias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bumuo siya ng sabwatan,” isang pag-uulit ng pandiwa at pangngalang magkaugnay ang ugat upang bigyang-diin ang pagbabalak laban sa hari.
    reason: lexical_alternative
  - marker: b
    text: Mababasa sa Hebreo, “noong ikadalawampung taon ni Jotam na anak ni Uzias.” Nagdudulot ito ng suliraning kronolohikal sa mga tala ng paghahari, sapagkat mas maikli ang haba ng paghahari ni Jotam ayon sa ibang mga talata. Sinusubukan ng ilan na iugnay ito sa paghahari ni Ahaz, ngunit sinusunod dito ang mismong pananalita ng Hebreo.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: nagbuo ... ng sabwatan
  rationale: Ang Hebreo ay gumagamit ng pandiwa at pangngalang magkaugnay ang ugat upang magbigay-diin. Ang likas na Tagalog na “nagbuo ng sabwatan” ay nagpapanatili sa tahasang pagbanggit sa sabwatan nang hindi nagiging pilit ang cognate construction.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Hosea na anak ni Ela
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalan at pinanatili ang patronimiko para sa malinaw na pagkakakilanlan.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: laban kay Peka na anak ni Remalias
  rationale: Sa konteksto ng sabwatan, ang עַל ay tumutukoy sa taong pinupuntirya ng mapanlabang pagkilos; likas itong isalin na “laban kay.”
- source_word: וַיַּכֵּהוּ
  choice: Pinabagsak niya si Peka
  rationale: Ang נכה ay nangangahulugang hampasin o pabagsakin. Pinananatili ng “pinabagsak” ang marahas na pagkilos nang hindi inuulit agad ang tahasang pagpatay na nasa kasunod na pandiwa.
- source_word: וַיְמִיתֵהוּ
  choice: at pinatay
  rationale: Ang Hiphil ng מות ay nagsasaad ng pagsanhi sa kamatayan. Ang “pinatay” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: siya ang naghari bilang kapalit nito
  rationale: Ipinahahayag nito ang paghalili sa trono at pinananatili ang kahulugan ng מלך bilang paghahari.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: nang ikadalawampung taon ng paghahari ni Jotam na anak ni Uzias
  rationale: Ito ang likas na anyo ng pormulang pangtaon ng paghahari sa Tagalog. Tapat nitong sinusundan ang tekstong Masoretiko kahit may suliraning kronolohikal.
theological_decisions:
- issue: Kronolohikal na tensiyon sa pormula ng taon ng paghahari
  choice: Panatilihin ang “ikadalawampung taon ng paghahari ni Jotam na anak ni Uzias.”
  alternative: Iugnay ang petsa sa paghahari ni Ahaz o baguhin ang bilang upang pagtugmain ang kronolohiya.
  rationale: Tahasan itong binabasa sa tekstong Masoretiko. Hindi dapat lutasin ng salin ang suliraning historikal o tekstuwal sa pamamagitan ng tahimik na pagbabago; inilalahad sa talababa ang tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang mga likas na pariralang “nagbuo ng sabwatan,” “pinabagsak,” at “naghari bilang kapalit” habang pinananatili ang pagkakasunod-sunod ng mga kilos at ang hindi nalutas na tensiyong kronolohikal ng pinagmulang teksto.
