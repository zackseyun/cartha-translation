revisions:
- from: Pagkatapos, siningil ni Menahem ang Israel ng salaping iyon. Siningil niya ang bawat lalaking may kaya[a] ng limampung siklong pilak upang ibigay sa hari ng Asiria. Kaya umurong ang hari ng Asiria at hindi nanatili roon sa lupain.
  to: Pagkatapos, siningil ni Menahem ang Israel ng salapi. Siningil niya ang bawat lalaking may kaya[a] ng limampung siklong pilak upang ibigay sa hari ng Asiria. Bumalik ang hari ng Asiria at hindi nanatili roon sa lupain.
  rationale: Inalis ang hindi nakasaad na “iyon” mula sa unang pagtukoy sa salapi at pinalitan ang “umurong” ng “bumalik” upang mas tuwirang maipahayag ang וַיָּשָׁב nang hindi nagdaragdag ng implikasyong militar. Pinanatili ang hati ng pangungusap, ang halaga ng singil kada tao, at ang talababa para sa leksikal na kalabuan ng גִּבּוֹרֵי הַחַיִל.
