base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: tl
  text: Pagkatapos, siningil ni Menahem ang Israel ng salapi. Siningil niya ang bawat lalaking may kaya[a] ng limampung siklong pilak upang ibigay sa hari ng Asiria. Bumalik ang hari ng Asiria at hindi nanatili roon sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat makapangyarihang mandirigma” o “bawat lalaking mataas ang katayuan.” Ang pariralang Hebreo ay maaaring tumukoy sa lakas sa digmaan, katayuan sa lipunan, o kayamanan; sa kontekstong ito ng paniningil, malamang na mga lalaking may kaya ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא אֶת־הַכֶּסֶף עַל־יִשְׂרָאֵל
  choice: siningil ni Menahem ang Israel ng salaping iyon
  rationale: Ang literal na diwang ‘inilabas ang salapi mula sa Israel’ ay tumutukoy rito sa sapilitang pangongolekta ng buwis o bayad. Natural na ipinahahayag ito ng ‘siningil ... ng salaping iyon.’
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: ang bawat lalaking may kaya[a]
  rationale: Maaaring tumukoy ang parirala sa mga lalaking malakas sa digmaan, mataas ang katayuan, o may malaking ari-arian. Dahil sa konteksto ng singilan, ‘may kaya’ ang pinakamalinaw na pangunahing salin, habang pinananatili sa talababa ang tunay na lawak ng kahulugan.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: ang bawat ... ng limampung siklong pilak
  rationale: Ipinakikita ng parirala ang halagang ipinataw sa bawat saklaw na lalaki. Pinananatili ng ‘siklong pilak’ ang sinaunang yunit ng timbang at ang metal na ginamit.
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: umurong ang hari ng Asiria
  rationale: Ang pandiwa ay nangangahulugang bumalik o tumalikod. Sa kontekstong militar at pampolitika matapos matanggap ang bayad, malinaw at natural ang ‘umurong.’
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: hindi nanatili roon sa lupain
  rationale: Bagaman literal na ‘hindi tumayo,’ ang עמד ay idyomatikong nangangahulugang manatili o magpatuloy ng presensiya sa lugar.
