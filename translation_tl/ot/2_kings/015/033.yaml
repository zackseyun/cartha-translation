id: 2KI.15.33
reference: 2 Kings 15:33
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖א בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: tl
  text: Dalawampu't limang taong gulang siya nang magsimula siyang maghari, at naghari siya sa Jerusalem nang labing-anim na taon. Ang pangalan ng kanyang ina ay Jerusa[a], na anak ni Zadok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ding baybayin ang pangalan na “Jerusha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu't limang taong gulang
  rationale: Likas na salin sa modernong Tagalog ng karaniwang idyomang Hebreo para sa edad; hindi isinama ang literal na “anak” sapagkat magiging malabo at di-natural.
- source_word: הָיָה בְמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ipinahahayag ng konstruksiyon ang edad niya sa pagsisimula ng paghahari; natural at malinaw ito sa Tagalog.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: at naghari siya ... nang labing-anim na taon
  rationale: Pinananatili ang tuwirang pahayag tungkol sa haba ng paghahari sa natural na ayos ng Tagalog.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa Filipino at wastong gamit ng pang-ukol.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Malinaw at dignified na katumbas ng pormulang Hebreo sa modernong Tagalog.
- source_word: יְרוּשָׁא
  choice: Jerusa
  rationale: Ang “Jerusa” ay natural na transliterasyon sa Filipino ng pangalang Hebreo; itinala sa talababa ang alternatibong baybay.
- source_word: בַּת צָדוֹק
  choice: na anak ni Zadok
  rationale: Tuwirang pinananatili ang ugnayang pampamilya na ipinahahayag ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, natural, at marangal. Ginamit ang “maghari” para sa pormulang panghari at pinanatili ang mga pangalang Jerusalem at Zadok sa nakasanayang anyo. Inilagay ang panandang [a] kaagad pagkatapos ng pangalang Jerusa.
