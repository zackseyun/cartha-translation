reference: 2 Kings 15:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: tl
  text: Labing-anim na taong gulang siya nang maging hari, at naghari siya sa Jerusalem nang limampu't dalawang taon. Ang pangalan ng kanyang ina ay Jecolias na taga-Jerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa Jerusalem.”
    reason: Pinananatili ang leksikal na posibilidad ng pang-ukol na מִן, na maaaring tahasang magpahayag ng pinagmulan.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Labing-anim na taong gulang
  rationale: Likas na salin sa Filipino ng Hebreong idyoma na literal na “anak ng labing-anim na taon,” habang pinananatili ang eksaktong edad.
- source_word: הָיָה בְמָלְכוֹ
  choice: nang maging hari
  rationale: Ipinahihiwatig ng parirala ang edad niya sa pagluklok; malinaw at natural ito sa modernong Filipino.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: limampu't dalawang taon
  rationale: Karaniwang anyo sa Filipino ng bilang na limampu at dalawa.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tumpak at maikli para sa pandiwang ginagamit sa mga pormula tungkol sa paghahari.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Ang pang-ukol ay lokatibo at tumutukoy sa lugar ng kanyang paghahari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural at marangal na Filipino na pinananatili ang nilalaman ng karaniwang pormula sa Mga Hari.
- source_word: יְכָלְיָהוּ
  choice: Jecolias
  rationale: Gumagamit ng anyong pangalan na angkop sa nakaugaliang biblikal na transliterasyon sa Filipino, sa halip na sobrang literal na pagtitiklop ng Hebreo.
- source_word: מִירוּשָׁלָם
  choice: na taga-Jerusalem
  rationale: Natural na ipinapahayag sa Filipino ang pinagmulan o kaugnayan sa isang lugar; ang literal na “mula sa Jerusalem” ay nananatiling posibleng pagbasa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “naghari” at “nang maging hari” upang mapanatili ang pormulang panghari nang hindi nagiging makaluma. Inilagay ang talababa pagkatapos ng “taga-Jerusalem,” ang pariralang aktuwal na may leksikal na alternatibo sa Hebreo.
