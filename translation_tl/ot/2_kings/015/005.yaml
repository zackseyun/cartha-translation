revisions:
- from: At pinahirapan ni Yahweh ang hari ng malubhang sakit sa balat[a] hanggang sa araw ng kamatayan nito. Nanirahan ito sa isang nakahiwalay na bahay[b], habang si Jotam na anak ng hari ang namahala sa palasyo at humatol sa mga mamamayan ng lupain.
  to: At tinamaan ni Yahweh ang hari, at nagkaroon siya ng malubhang sakit sa balat[a] hanggang sa araw ng kanyang kamatayan. Nanirahan siya sa isang nakahiwalay na bahay[b], habang si Jotam na anak ng hari ang namahala sa palasyo at humatol sa mga mamamayan ng lupain.
  rationale: Pinalitan ang pandiwang "pinahirapan" ng "tinamaan" at ibinalik ang magkahiwalay na pahayag tungkol sa pagkatama ng hari at pagkakaroon niya ng sakit sa balat. Pinananatili nito ang saklaw ng Hebreo, ang hindi tiyak na medikal na kahulugan ng מְצֹרָע, at ang natural na daloy ng modernong Filipino Tagalog. Walang kailangang pagbabago sa mga talababa.
