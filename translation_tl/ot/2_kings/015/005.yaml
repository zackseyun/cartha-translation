  naturalness: Marangal at madaling maunawaan ang rehistro. Mas natural at malinaw ang paggamit ng "siya/kanyang" sa magkakaugnay na pangungusap; hindi naman ito lumilikha ng kalituhan dahil malinaw na ang hari ang huling tinutukoy bago ipakilala si Jotam.
  terminology: Ang "malubhang sakit sa balat" ay maingat na salin ng מְצֹרָע at hindi ipinipilit ang modernong diagnosis. Ang "nakahiwalay na bahay," "palasyo," at "mga mamamayan ng lupain" ay katanggap-tanggap sa kontekstong ito. Napananatili ang Yahweh at ang pangalan na Jotam.
