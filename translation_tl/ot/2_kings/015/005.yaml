  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: tl
  text: At tinamaan ni Yahweh ang hari, at nagkaroon siya ng malubhang sakit sa balat[a] hanggang sa araw ng kanyang kamatayan. Nanirahan siya sa isang nakahiwalay na bahay[b], habang si Jotam na anak ng hari ang namahala sa palasyo at humatol sa mga mamamayan ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginawang ketongin.” Hindi kinakailangang tumukoy ang salitang Hebreo sa sakit na kilala ngayon bilang ketong o Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: O “sa bahay na bukod.” Mahirap tiyakin ang eksaktong kahulugan ng pariralang Hebreo, ngunit malamang na tumutukoy ito sa isang hiwalay na tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיְנַגַּע
  choice: pinahirapan
  rationale: Sa konteksto, tumutukoy ang pandiwa sa pagpaparanas ng Diyos ng isang karamdaman, hindi sa karaniwang pisikal na paghipo.
- source_word: מְצֹרָע
  choice: may malubhang sakit sa balat
  rationale: Hindi tiyak na ang Hebreong termino ay tumutukoy sa modernong ketong; ang salin ay natural at hindi labis na tumutukoy sa isang partikular na diagnosis.
- source_word: עַד יוֹם מֹתוֹ
  choice: hanggang sa araw ng kamatayan nito
  rationale: Pinananatili ang solemneng Hebreong idyoma sa natural na Tagalog.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: sa isang nakahiwalay na bahay
  rationale: Ang mahirap na parirala ay malamang na tumutukoy sa isang hiwalay o segregadong tirahan; iniiwasan nito ang nakalilitong literal na 'bahay ng kalayaan.'
- source_word: עַל הַבַּיִת
  choice: namahala sa palasyo
  rationale: Sa kontekstong maharlika, ipinahihiwatig ng idyoma ang pangangasiwa sa sambahayan o palasyo ng hari.
- source_word: שֹׁפֵט
  choice: humatol
  rationale: Tuwirang ipinapahayag ang patuloy na pagganap ni Jotam ng tungkuling hudisyal at pampamahalaan.
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Pinananatili ang diwa ng Hebreong parirala bilang mga taong naninirahan sa lupain nang hindi ito ginagawang modernong terminong pampolitika.
theological_decisions:
- issue: Uri ng karamdamang tinutukoy ng מְצֹרָע
  choice: malubhang sakit sa balat
  alternative: ketongin / may ketong
  rationale: Hindi hinihingi ng talata ang isang modernong medikal na diagnosis. Ang pangunahing teksto ay hindi nagtatakda na Hansen's disease ang kondisyon, habang ang talababa ay nagpapanatili sa tradisyonal na alternatibo.
- issue: Tahasang pagkilos ni Yahweh sa karamdaman ng hari
  choice: pinahirapan ni Yahweh ang hari
  alternative: nagkasakit ang hari
  rationale: Pinananatili ang malinaw na banal na pagkilos sa Hebreo at hindi ginagawang di-tuwiran ang sanhi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'ito/nito' para sa hari upang maiwasan ang kalituhan kay Yahweh at kay Jotam; pinanatili ang pangalan na Yahweh at ang pormal na himig ng salaysay.
