id: 2KI.15.28
reference: 2 Kings 15:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh. Hindi siya humiwalay sa mga kasalanan ni Jeroboam na anak ni Nebat, na nag-akay sa Israel na magkasala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas at tuwirang salin ng karaniwang pormula sa pagsusuri sa paghahari; hindi na kailangang isalin nang tahasan ang panimulang waw sa modernong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang malinaw na metapora ng Hebreo para sa pagsusuri ng Diyos at ang pangalang tipan na Yahweh.
- source_word: לֹא סָר
  choice: Hindi niya tinalikuran
  rationale: Ang סור na may מִן ay tumutukoy sa hindi paglayo o hindi pagtalikod sa dating makasalanang gawain; natural sa Tagalog ang 'tinalikuran.'
- source_word: מִן חַטֹּאות
  choice: ang mga kasalanan
  rationale: Tuwirang ipinapahayag ang maramihang חַטֹּאות bilang 'mga kasalanan.'
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang modernong Tagalog na anyo ng patronymic.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na siyang nag-udyok sa Israel na magkasala
  rationale: Ipinahahayag ang causative na Hiphil ng חטא at ang pananagutan ni Jeroboam. Mas natural ang 'nag-udyok ... na magkasala' kaysa sa mekanikal na 'nagpangyaring magkasala.'
theological_decisions:
- issue: Paglalarawan sa pananagutan ni Jeroboam sa kasalanan ng Israel
  choice: nag-udyok sa Israel na magkasala
  alternative: naging dahilan upang magkasala ang Israel
  rationale: Pinananatili ang causative force ng הֶחֱטִיא nang hindi ipinapalagay na inalis ang sariling pananagutan ng Israel.
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang inililipat ang pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang tradisyonal na pormula na 'sa paningin ni Yahweh,' habang gumamit ng likas na pandiwang 'tinalikuran' at 'nag-udyok.'
