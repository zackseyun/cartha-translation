translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinagsama ang magkaugnay na “mga gawa” at “na ginawa niya” upang maging natural sa Tagalog nang hindi nawawala ang kahulugan. Inilagay sa hulihan ang “hindi ba?” bilang likas na anyo ng retorikal na tanong sa Filipino.
