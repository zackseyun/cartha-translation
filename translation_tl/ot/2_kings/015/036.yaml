  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Hindi ba nakasulat sa Aklat ng mga Tala ng mga Hari ng Juda[a] ang iba pang mga ginawa ni Jotam?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Aklat ng mga Tala ng mga Hari ng Juda” ay tumutukoy sa isang opisyal na talaan ng kaharian, at hindi kinakailangang sa biblikal na aklat na Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Ang iba pang mga ginawa ni Jotam
  rationale: Sa pormulang pangwakas tungkol sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga gawa o ginawa ng hari, hindi lamang sa kaniyang mga salita. Ang וְיֶתֶר ay natural na isinaling “ang iba pang.”
- source_word: אֲשֶׁר עָשָׂה
  choice: mga ginawa
  rationale: Ang diwa ng sugnay na “na kaniyang ginawa” ay isinama sa likas na pariralang Filipino upang maiwasan ang paulit-ulit na “mga ginawa ... na ginawa niya.”
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: ay nakasulat ... hindi ba?
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa, pati ang literal na diwa ng כְּתוּבִים na “nakasulat.”
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: sa Aklat ng mga Kasaysayan
  rationale: Ang עַל ay idiomatikong “sa” kapag tumutukoy sa pagkakasama sa isang dokumento. Ang דִּבְרֵי הַיָּמִים ay mga tala o annal ng kaharian; “mga Kasaysayan” ang malinaw at marangal na salin.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: ng mga Hari ng Juda
  rationale: Sa pamagat ng sanggunian, ang לְ ay natural na nagpapahayag na ang tala ay tungkol sa mga hari ng Juda.
