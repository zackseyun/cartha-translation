reference: 2 Kings 15:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: tl
  text: Nang ikatatlumpu't siyam na taon ng paghahari ni Azarias na hari ng Juda, naging hari sa Israel si Menahem na anak ni Gadi. Naghari siya nang sampung taon sa Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: Nang ikatatlumpu't siyam na taon ng paghahari
  rationale: Ang parirala ay pormula ng pagtatala ayon sa taon ng paghahari. Nilinaw sa natural na Tagalog ang ipinahihiwatig na paghahari, at ginamit ang ordinal na bilang.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: ni Azarias na hari ng Juda
  rationale: Ang ל ay tumutukoy sa taon ng paghahari ni Azarias; ang kasunod na parirala ay tuwirang titulong maharlika.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa unang gamit, ipinahihiwatig ng pandiwa ang pagluklok o pagsisimula ng paghahari, yamang hiwalay na binabanggit ang tagal nito.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: si Menahem na anak ni Gadi
  rationale: Pinanatili ang mga pangalang pantangi sa transliterasyon at isinalin ang בֶּן sa likas na pariralang Tagalog.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Kasama ng מָלַךְ, ipinapahayag ng עַל ang nasasakupan. Sa Tagalog, natural at malinaw ang 'naging hari sa Israel.'
- source_word: עֶשֶׂר שָׁנִים
  choice: nang sampung taon
  rationale: Ang 'nang' ay wastong pananda ng tagal ng kilos sa modernong Tagalog.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang בְּ ay lokatibo rito at tumutukoy sa Samaria bilang sentro ng paghahari.
