  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: tl
  text: Pagkatapos, umahon si Menahem na anak ni Gadi mula sa Tirza at dumating sa Samaria. Doon sa Samaria, sinaktan niya si Shallum na anak ni Jabesh at pinatay niya siya. Pagkatapos, naghari siya bilang kapalit niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili nito ang karaniwang kahulugan ng עלה na pag-ahon o pagpunta paitaas, nang hindi ipinapalagay na tiyak na isang pagmamartsa ng hukbo ang tinutukoy.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem na anak ni Gadi
  rationale: Isinalin ang ugnayang pampamilya at ginamit ang malinaw na transliterasyon ng mga pangalang Hebreo.
- source_word: מִתִּרְצָה
  choice: mula sa Tirza
  rationale: Tuwirang ipinahahayag ng מן ang pinagmulan.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: pumunta sa Samaria
  rationale: Likas sa makabagong Tagalog at angkop sa kilos mula sa Tirza patungong Samaria; hindi nito dinaragdagan ang teksto ng ideya ng sapilitang pagpasok.
- source_word: וַיַּךְ אֶת
  choice: pinabagsak
  rationale: Ipinahihiwatig ng נכה sa kontekstong ito ang marahas at matagumpay na pananakit; nililinaw ng kasunod na pandiwa na nauwi ito sa kamatayan.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Shallum na anak ni Jabesh
  rationale: Pinananatili ang mga pangalan at ang pagtukoy sa ama.
- source_word: בְּשֹׁמְרוֹן
  choice: roon
  rationale: Ang 'roon' ay malinaw na tumutukoy sa Samaria at mas natural sa Tagalog, bagaman hindi nito inuulit nang tahasan ang pangalan ng lugar gaya ng Hebreo.
- source_word: וַיְמִיתֵהוּ
  choice: pinatay ito
  rationale: Natural at tumpak na katumbas ng causative Hiphil ng מות sa kontekstong ito.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: naghari siya bilang kapalit nito
  rationale: Pinananatili ang ideya ng paghalili sa paghahari matapos patayin si Shallum.
