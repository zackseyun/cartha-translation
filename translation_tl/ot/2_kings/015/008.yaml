  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ זְכַרְיָ֨הוּ בֶן יָרָבְעָ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שִׁשָּׁ֥ה חֳדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: tl
  text: Nang ikatatlumpu't walong taon ng paghahari ni Azarias na hari ng Juda, naging hari ng Israel sa Samaria si Zacarias na anak ni Jeroboam. Naghari siya nang anim na buwan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: Nang ikatatlumpu't walong taon ng paghahari
  rationale: Ang pormulang Hebreo sa pagtukoy ng taon ng isang hari ay natural na ipinapahayag sa Filipino bilang ordinal na taon ng paghahari.
- source_word: לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה
  choice: ni Azarias na hari ng Juda
  rationale: Ang ל ay tumutukoy sa taon ng paghahari ni Azarias; pinananatili rin ang kaniyang katungkulan at kaharian.
- source_word: מָלַךְ
  choice: naging hari ... Naghari siya
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang pagluklok sa paghahari, samantalang ang anim na buwan ay tagal ng paghahari. Hinati sa dalawang pangungusap upang maging malinaw at natural sa Filipino.
- source_word: זְכַרְיָהוּ
  choice: Zacarias
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Filipino.
- source_word: בֶן יָרָבְעָם
  choice: anak ni Jeroboam
  rationale: Tuwirang ipinapahayag ang ugnayang pampamilya.
- source_word: עַל יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Sa Filipino, natural na ipinahahayag ang paghahari sa isang bayan sa pamamagitan ng 'hari ng Israel,' na katumbas ng pamumuno 'sa ibabaw ng' Israel.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Tinutukoy nito ang lugar o luklukan ng kaniyang paghahari.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: nang anim na buwan
  rationale: Ang pariralang Hebreo ay akusatibo ng tagal; malinaw at likas itong isinasalin bilang tagal ng paghahari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pormulang kronolohikal at ang pagkakaiba ng pagluklok sa pagiging hari at ng anim-na-buwang tagal ng paghahari.
