  terminology: Wasto ang “Yahweh,” “masama sa paningin,” at mga pangalan. Ang “nag-udyok” ay maaaring tanggapin, ngunit ang “pinagkasala” ay mas tuwirang nagpapahayag ng causative na puwersa ng Hebreong pandiwa at mas angkop sa nakasanayang pananalita ng salin-Bibliya. Sa talababa, ang “hinikayat” ay masyadong nagpapahiwatig ng panghihikayat lamang; dapat ding panatilihin ang causative na diwa.
