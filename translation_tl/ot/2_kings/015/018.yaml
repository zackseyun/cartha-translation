  to: Ginawa niya ang masama sa paningin ni Yahweh. Hindi niya tinalikuran ang mga kasalanan ni Jeroboam na anak ni Nebat[a], na nagpakasala sa Israel, sa lahat ng kanyang mga araw.
  rationale: Pinanatili ang pangunahing, pinakanatural na pagbasa na si Jeroboam ang tinutukoy ng kamag-anak na sugnay, habang itinatala ang posibleng pag-uugnay nito sa “mga kasalanan.” Pinalitan ang “Sa buong buhay niya” ng mas literal at hindi labis na nagpapaliwanag na “sa lahat ng kanyang mga araw,” at pinatibay ang causative na diwa sa pangunahing teksto at talababa.
