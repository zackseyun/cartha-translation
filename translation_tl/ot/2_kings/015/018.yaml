  source_fidelity: 'Ang pangunahing pagbasa ay tapat sa Hebreo: ang sugnay na “na nag-udyok sa Israel na magkasala” ay natural na tumutukoy kay Jeroboam, at malinaw nitong naihahayag ang causative na Hiphil ng חטא. Gayunman, ang “Sa buong buhay niya” ay maaaring magpahiwatig na ang hari ay namuhay nang ganito bago pa man ang panahong saklaw ng salaysay. Ang “sa lahat ng kanyang mga araw” ay mas malapit sa כָּל־יָמָיו at hindi labis na nagpapaliwanag.'
