  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh. Hindi niya tinalikuran ang mga kasalanan ni Jeroboam na anak ni Nebat[a], na nagpakasala sa Israel, sa lahat ng kanyang mga araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga kasalanan ni Jeroboam na anak ni Nebat, na sa pamamagitan ng mga iyon ay pinagkasala niya ang Israel.” Maaaring iugnay ang Hebreong sugnay sa “mga kasalanan” sa halip na kay Jeroboam.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Tuwirang isinasalin ang karaniwang pormulang panghukom sa Mga Hari sa natural na modernong Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora ng pagsusuri at ang personal na pangalang יְהוָה.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: hindi niya tinalikuran ang mga kasalanan
  rationale: Ipinahahayag ng סור ang hindi paglayo o pagtalikod sa makasalanang landas; natural sa Tagalog ang “tinalikuran.”
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang anyo sa Tagalog para sa ugnayang ama at anak, habang pinananatili ang mga pangalang pantangi.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na nag-udyok sa Israel na magkasala
  rationale: Ipinakikita ang causative na puwersa ng Hiphil ng חטא nang hindi ipinapalagay na pisikal na pamimilit.
- source_word: כָּל יָמָיו
  choice: Sa buong buhay niya
  rationale: Natural na Tagalog para sa “lahat ng kanyang mga araw.” Inilagay sa simula ng ikalawang pangungusap upang malinaw na tumutukoy sa hari ang panghalip.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalang pantangi ang nasa Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Tinutukoy ng אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Si Jeroboam ang tuwirang tinutukoy: “na nag-udyok sa Israel na magkasala.”'
  alternative: 'Maaaring iugnay ang sugnay sa “mga kasalanan”: “mga kasalanan … na sa pamamagitan ng mga iyon ay hinikayat niyang magkasala ang Israel.”'
  rationale: Kapwa posible sa Hebreo ang pag-uugnay sa Jeroboam at sa mga kasalanang nauugnay sa kanya. Mas natural sa Tagalog ang unang pagbasa, ngunit pinananatili sa talababa ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paningin” upang mapanatili ang Hebreong idyoma, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
