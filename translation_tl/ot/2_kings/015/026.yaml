base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Pekahias, at ang lahat ng ginawa niya—narito, nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang pangwakas tungkol sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga gawa o pangyayari tungkol sa hari, hindi lamang sa kaniyang mga salita; natural na ipinahahayag ng “iba pang” ang nalalabing bahagi.
- source_word: פְקַחְיָה
  choice: Pekahias
  rationale: Isinalin ang pangalan ayon sa karaniwang anyong Tagalog ng mga pangalang biblikal.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng ginawa niya
  rationale: Pinananatili nito ang malawak at payak na diwa ng pandiwang עשה nang hindi nililimitahan sa mga tagumpay o natapos na gawain.
- source_word: הִנָּם
  choice: narito
  rationale: Pinananatili ang pantawag-pansing puwersa ng presentational particle, habang likas pa ring mababasa sa marangal na modernong Tagalog.
- source_word: כְּתוּבִים
  choice: nakasulat
  rationale: Tuwirang katumbas ng passive participle at angkop sa pormulang tumutukoy sa isang nakasulat na tala.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman maaaring literal na tumukoy sa isang balumbon, ang “sa Aklat” ang natural na anyo para sa dokumentaryong pormula at hindi labis na nagpapasiya tungkol sa pisikal na anyo nito.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Kasaysayan
  rationale: Sa kontekstong ito, ang parirala ay titulo ng taunang o kronikal na tala; malinaw at pamilyar sa karaniwang mambabasa ang “mga Kasaysayan.”
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Ang לְ sa pamagat ay natural na ipinahahayag bilang pagmamay-ari o kaugnayan sa pamamagitan ng “ng.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang pormulang pang-arkibo at ang pantawag-pansing הִנָּם sa “narito,” ngunit iniwasan ang artipisyal na panimulang panandang temporal na wala sa Hebreo.
