  - severity: medium
    issue: Hindi tugma ang teksto at talababa sa unang idyoma.
    rationale: Ang dating “hindi siya pinapasok ng lunsod” ay hindi eksaktong katapat ng talababa nitong “hindi ito nagbukas.” Ang binagong teksto ay tumutugma sa literal na pananalita, habang ang talababa ang nagpapaliwanag ng idyoma.
