revisions:
- from: Pagkatapos, sinalakay ni Menahem ang Tifsah, ang lahat ng naroon, at ang nasasakupan nito mula sa Tirza. Dahil hindi siya pinapasok ng lunsod,[a] sinalakay niya ito at nilapa ang tiyan ng lahat ng buntis na babae roon.[b]
  to: Pagkatapos, sinalakay ni Menahem ang Tifsah, ang lahat ng naroon, at ang nasasakupan nito mula sa Tirza. Dahil hindi ito nagbukas para sa kanya,[a] sinalakay niya ito at binuksan nang marahas ang tiyan ng lahat ng buntis na babae roon.[b]
  rationale: Pinalitan ang maling “nilapa ang tiyan” ng pananalitang naghahatid ng marahas na pagbubukas/pagbiyak na hinihingi ng Hebreo. Inayos din ang sugnay tungkol sa “pagbukas” upang masundan ang literal na kolektibong simuno at umayon sa talababa. Walang binagong kahulugan sa saklaw ng “lahat ng naroon” o sa heograpikong pariralang “mula sa Tirza.”
