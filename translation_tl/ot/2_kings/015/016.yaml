  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: tl
  text: Pagkatapos, sinalakay ni Menahem ang Tifsah, ang lahat ng naroon, at ang nasasakupan nito mula sa Tirza. Dahil hindi ito nagbukas para sa kanya,[a] sinalakay niya ito at binuksan nang marahas ang tiyan ng lahat ng buntis na babae roon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi ito nagbukas.” Tumutukoy ito sa hindi pagbubukas ng lunsod o mga pintuang-bayan kay Menahem—samakatuwid, sa pagtangging papasukin siya o sumuko sa kanya.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “biniyak” o “pinunit.” Ang pandiwang Hebreo ay tumutukoy sa marahas na pagbubukas o paghahati nang sapilitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Likas na panandang pasalaysay para sa kasunod na pangyayari.
- source_word: יַכֶּה / וַיַּךְ
  choice: sinalakay
  rationale: Sa konteksto ng pagsalakay sa isang lunsod, malinaw na ipinahahayag nito ang marahas na diwa ng נכה nang hindi gumagamit ng lipas na pananalita.
- source_word: תִּפְסַח
  choice: Tifsah
  rationale: Isinatinig ang pangalang Hebreo ayon sa karaniwang baybay at bigkas sa Filipino.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: ang lahat ng naroon
  rationale: Pinananatili ang lawak at bahagyang kalabuan ng parirala, na maaaring tumukoy sa mga tao at sa lahat ng nasa lunsod.
- source_word: גְּבוּלֶיהָ
  choice: ang nasasakupan nito
  rationale: Dito, ang גְּבוּל ay malamang na teritoryong sakop ng lunsod, hindi lamang ang guhit ng hangganan.
- source_word: מִתִּרְצָה
  choice: mula sa Tirza
  rationale: Tuwirang sinasalamin ang pang-ukol na מִן habang pinananatili ang posibleng ugnayang heograpiko o pinagmulan ng pagsalakay.
- source_word: כִּי לֹא פָתַח
  choice: Dahil hindi siya pinapasok ng lunsod
  rationale: Ipinahahayag ang idyomang pagbubukas ng lunsod o mga pintuang-bayan, ibig sabihin ay pagtanggap o pagsuko sa mananalakay.
- source_word: הֶהָרוֹתֶיהָ
  choice: lahat ng buntis na babae roon
  rationale: Tuwiran, makabago, at malinaw na salin ng substantibong tumutukoy sa mga buntis na kabilang sa lunsod.
- source_word: בִּקֵּעַ
  choice: nilapa ang tiyan
  rationale: Ipinahahayag ang marahas na paghiwa o pagpunit nang sapilitan; idinagdag ang 'tiyan' bilang likas na Filipino na paglilinaw sa ginawang karahasan sa mga buntis.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Tuwirang inilalarawan ang kalupitan ng teksto nang walang pagpapalabnaw o dagdag na teolohikal na paliwanag. Ginamit ang “lunsod” upang gawing malinaw ang kolektibong simuno ng “hindi nagbukas,” samantalang pinanatili ng “lahat ng naroon” ang lawak ng orihinal.
