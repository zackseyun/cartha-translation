  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: tl
  text: Ngunit hindi inalis ang mga mataas na lugar; patuloy pa ring naghahandog at nagpapausok ng mga handog[a] ang mga tao sa mga mataas na lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagsusunog ng insenso.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsusunog ng insenso o, sa mas malawak na diwa, sa pagpapausok ng isang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Gayunman
  rationale: Minamarkahan nito ang eksepsiyon sa naunang positibong pagtatasa sa hari at likas na nag-uugnay sa konteksto sa modernong Tagalog.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: ang matataas na lugar / sa matataas na lugar
  rationale: Pinananatili ang makasaysayang katawagan para sa mga lokal na pook ng pagsamba nang hindi agad tinutukoy kung kaninong diyos iniuukol ang pagsamba.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Bagaman literal na maaaring mangahulugang ‘hindi nawala,’ sa pormulang ito ang diwa ay hindi ipinatanggal ang mga pook ng pagsamba.
- source_word: עוֹד
  choice: patuloy pa ring
  rationale: Malinaw na ipinahahayag ang nagpapatuloy na gawain sa kabila ng pagtatasa sa paghahari.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Natural na kolektibong pagtukoy sa mamamayang nagsasagawa ng mga gawaing panrelihiyon.
- source_word: מְזַבְּחִים
  choice: naghahandog
  rationale: Likas at maikli itong salin ng paghahandog ng hain sa kontekstong panrelihiyon.
- source_word: וּמְקַטְּרִים
  choice: nagpapausok ng mga handog
  rationale: Pinananatili nito ang mas malawak na posibilidad ng pandiwang Hebreo—pagpapausok ng handog—nang hindi ito nililimitahan sa insenso lamang.
theological_decisions:
- issue: Uri ng pagsambang isinasagawa sa matataas na lugar
  choice: Iniulat ang patuloy na paghahandog sa mga lokal na pook ng pagsamba nang hindi tinutukoy kung kanino iniuukol ang mga handog.
  alternative: Tahasang tawagin itong pagsamba sa diyus-diyosan, o sabihing pagsamba ito sa PANGINOON sa di-awtorisadong lugar.
  rationale: Hindi tinutukoy ng mismong talata ang diyos na sinasamba. Pinananatili ng salin ang pagpipigil at tensiyong nasa tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matataas na lugar” bilang makasaysayang katawagan, at ang bahagyang di-pangkaraniwang “nagpapausok ng mga handog” upang mapanatili ang leksikal na lawak ng Hebreo; nililinaw sa talababa ang mas pamilyar na alternatibo.
