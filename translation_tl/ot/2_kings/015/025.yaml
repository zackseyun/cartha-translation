  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: tl
  text: Nakipagsabwatan laban sa kanya si Peka na anak ni Remalias, na kanyang mataas na opisyal[a]. Sinaktan niya ito sa Samaria, sa muog ng palasyo ng hari[b], pati sina Argob at Arieh[c]. May kasama si Peka na limampung lalaki mula sa mga Gileadita[d]. Pinatay niya ang hari at naghari siya kapalit nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang kapitan.” Tumutukoy ang salitang Hebreo sa isang mataas na opisyal ng hukbo, ngunit hindi tiyak ang eksaktong ranggo nito.
    reason: lexical_alternative
  - marker: b
    text: O “sa palasyo ng sambahayan ng hari.” Ang salitang Hebreo ay maaaring mangahulugang palasyo, muog, o pinatibay na tirahan ng hari.
    reason: lexical_alternative
  - marker: c
    text: Maaaring unawain ang Arieh bilang pangalan ng tao; ang salitang Hebreo ay maaari ring mangahulugang “leon,” ngunit sa kontekstong ito ay pinakamalamang na pangalan ito, katulad ng Argob.
    reason: lexical_alternative
  - marker: d
    text: O “at may kasama siyang limampung lalaki mula sa mga Gileadita.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: Nakipagsabwatan laban sa kanya
  rationale: Sa kontekstong pampolitika ng Mga Hari, ang קשר ay tumutukoy sa sabwatan laban sa pinuno; natural at tiyak sa modernong Tagalog ang “nakipagsabwatan laban sa kanya.”
- source_word: שָׁלִישׁוֹ
  choice: ang kanyang mataas na opisyal
  rationale: Mataas na opisyal, malamang militar, ang tinutukoy ngunit hindi tiyak ang eksaktong ranggo. Iniiwasan ng saling ito ang labis na pagtukoy gaya ng “kapitan.”
- source_word: וַיַּכֵּהוּ
  choice: Pinabagsak niya ito
  rationale: Pinananatili nito ang pagkakaiba ng נכה, “hampasin/pabagsakin,” at ng kasunod na tahasang וַיְמִיתֵהוּ, “pinatay niya.”
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Tuwirang lokatibong gamit ng pangalan ng lugar.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: sa kuta ng palasyo ng hari
  rationale: Maaaring tumukoy ang אַרְמוֹן sa kuta, muog, o palasyong pinatibay. Ang “kuta ng palasyo” ay natural at ipinakikita ang bahagi ng maharlikang gusaling may pananggalang.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: kasama sina Argob at Arie
  rationale: Pinakamalamang na mga personal na pangalan ang dalawa. Pinananatili ng “kasama” ang sintaktikong pag-igting kung sila ba ay kasama sa mga pinabagsak o kaugnay ng paglusob.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: Kasama ni Peka ang limampung lalaking mula sa mga Gileadita
  rationale: Nililinaw ang pinakamalamang na reperente ng “kasama niya” at pinananatili ng “mula sa” ang partitibong diwa ng מִן.
- source_word: וַיְמִיתֵהוּ
  choice: Pinatay niya ang hari
  rationale: Ang Hiphil ng מות ay “patayin” o “pangyarihing mamatay.” Ang “ang hari” ay natural na paglilinaw sa Tagalog ng reperente ng panghalip.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: siya ang naghari kapalit nito
  rationale: Natural na Tagalog para sa karaniwang pormula ng paghalili sa trono, habang pinananatili ang diwang “sa halip niya.”
