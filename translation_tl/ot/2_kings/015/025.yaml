revisions:
- from: Nakipagsabwatan laban sa kanya si Peka na anak ni Remalias, ang kanyang mataas na opisyal[a]. Pinabagsak niya ito sa Samaria, sa kuta ng palasyo ng hari[b], kasama sina Argob at Arie[c]. Kasama ni Peka ang limampung lalaking mula sa mga Gileadita[d]. Pinatay niya ang hari at siya ang naghari kapalit nito.
  to: Nakipagsabwatan laban sa kanya si Peka na anak ni Remalias, na kanyang mataas na opisyal[a]. Sinaktan niya ito sa Samaria, sa muog ng palasyo ng hari[b], pati sina Argob at Arieh[c]. May kasama si Peka na limampung lalaki mula sa mga Gileadita[d]. Pinatay niya ang hari at naghari siya kapalit nito.
  rationale: Binago ang unang pandiwa upang hindi maipakahulugang simpleng pagpapatalsik at upang mapanatili ang pagkakaiba ng pananakit sa kasunod na pagpatay. Inayos ang pagtrato kina Argob at Arieh ayon sa kanilang pagkamarkang tuwirang layon sa Hebreo. Pinalitan din ang talababa d ng isang lehitimong alternatibong ayos ng Filipino para sa sugnay tungkol sa limampung Gileadita.
