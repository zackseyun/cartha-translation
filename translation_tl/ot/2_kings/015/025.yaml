translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nakipagsabwatan,” “mataas na opisyal,” at “kuta ng palasyo” upang maging malinaw nang hindi labis na tinutukoy ang hindi tiyak na ranggo o uri ng gusali. Hinati sa maiikling pangungusap ang mahabang Hebreong sugnay at nilinaw ang mga reperente bilang “Peka” at “ang hari,” habang inilagay sa talababa ang tunay na sintaktikong kalabuan tungkol kina Argob, Arie, at sa limampung Gileadita.
