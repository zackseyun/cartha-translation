    issue: Ang "Pinabagsak niya ito" ay maaaring mangahulugang pinatalsik niya ang hari.
    rationale: Ang pandiwang נכה ay dapat ihiwalay sa kasunod na Hiphil ng מות, na tahasang nagsasabing pinatay niya ang hari.
  - severity: medium
    issue: Ipinakikita ng "kasama sina Argob at Arie" na mga kasama ni Peka sina Argob at Arieh.
    rationale: Ang Hebreo ay nagmamarka kina Argob at Arieh bilang mga tuwirang layon sa tabi ng hari; mas ligtas na isalin silang karagdagang tinamaan kaysa gawing mga kasabwat.
  - severity: low
    issue: Ang talababa d ay naglalahad ng sintaktikong posibilidad na hindi maayos na tumutugma sa mga panandang tuwirang layon para kina Argob at Arieh.
    rationale: Dapat limitahan ang talababa sa tunay na alternatibong ayos ng sugnay tungkol sa limampung lalaking kasama ni Peka.
