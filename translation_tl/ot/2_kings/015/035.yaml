  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: tl
  text: Gayunman, hindi inalis ang mga pook-sambahan sa matataas na lugar. Patuloy pa ring naghahandog at nagsusunog ng insenso[a] ang mga tao sa mga pook-sambahan sa matataas na lugar. Siya ang nagtayo ng pintuang-daan sa gawing itaas ng bahay ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “nagpapausok ng handog.” Ang pandiwang Hebreo ay maaaring tumukoy nang mas tiyak sa pagsusunog ng insenso o, sa mas malawak na diwa, sa pagpapausok ng handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Gayunman
  rationale: Ipinakikilala nito ang natitirang pagkukulang bilang pagsalungat sa positibong pagtatasa sa hari; natural itong panandang adversatibo sa Filipino.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: mga sambahan sa matataas na lugar / mga lugar na iyon
  rationale: Nililinaw na ang tinutukoy ay mga lokal na pook-sambahan, hindi lamang matataas na heograpikong lugar; ang ikalawang banggit ay pinaikli nang hindi binabago ang reperensiya.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Ipinahahayag ng idyoma sa konteksto na nanatili ang mga pook-sambahan dahil hindi winakasan o inalis ang mga ito.
- source_word: עוֹד
  choice: patuloy pa rin
  rationale: Ipinakikita ang nagpapatuloy na nakaugaliang gawain ng mga tao.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Natural na kolektibong tawag sa mamamayan.
- source_word: מְזַבְּחִים
  choice: naghahandog
  rationale: Sinasalamin ang nagpapatuloy o nakaugaliang paghahandog ng mga handog na hayop o iba pang sakripisyo.
- source_word: וּמְקַטְּרִים
  choice: nagsusunog ng insenso
  rationale: Natural at karaniwang salin sa kontekstong panrelihiyon; inilagay sa talababa ang mas malawak na posibleng kahulugan ng pagpapausok ng handog.
- source_word: הוּא בָּנָה
  choice: Siya ang nagtayo
  rationale: Pinananatili ng ayos na ito ang banayad na diin ng hiwalay na panghalip na הוּא.
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: pintuang nasa itaas ng bahay ni Yahweh
  rationale: Pinananatili ang literal na larawang 'bahay ni Yahweh' at inilalarawan ang pintuan ayon sa posisyon nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipang pangalan na nakasulat sa tekstong Hebreo.
theological_decisions:
- issue: Paglalarawan sa mga בָּמוֹת
  choice: mga sambahan sa matataas na lugar
  alternative: matataas na lugar
  rationale: Nililinaw ang panrelihiyong gamit ng mga pook nang hindi nagpapasiya kung kanino nakatuon ang pagsamba roon.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinanatili itong pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng וּמְקַטְּרִים
  choice: nagsusunog ng insenso, na may talababa
  alternative: nagpapausok ng mga handog
  rationale: Pinili ang natural na pangunahing salin ngunit hindi itinago ang mas malawak na leksikal na posibilidad ng pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang Hebreong ekspresyon, at “mga sambahan sa matataas na lugar” upang maunawaan ng karaniwang mambabasa ang kultikong kahulugan ng בָּמוֹת.
