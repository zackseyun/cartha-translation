  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga gawa ni Azarias at ang lahat ng ginawa niya, hindi ba nakasulat[a] ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “nakatala” sa halip na “nakasulat.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat ng mga Kasaysayan ng mga Hari ng Juda” ay tumutukoy sa isang maharlikang talaan o kronika na madalas banggitin bilang sanggunian sa Mga Hari.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: ang iba pang mga gawain
  rationale: Sa pormulang pangwakas tungkol sa paghahari, tumutukoy ito sa natitirang mga ginawa o usaping may kinalaman sa hari, hindi lamang sa kanyang mga salita. Likas sa Filipino ang “iba pang mga gawain.”
- source_word: עֲזַרְיָהוּ
  choice: Azarias
  rationale: Ginamit ang kinagawiang anyong Filipino ng pangalan, na kumakatawan sa Hebreong ‘Azaryahu.’
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng ginawa niya
  rationale: Tuwirang isinasalin ang malawak na diwa ng pandiwang עָשָׂה nang hindi nililimitahan sa isang uri ng nagawa.
- source_word: הֲלֹא
  choice: hindi ba
  rationale: Pinananatili ang retorikal na tanong ng Hebreo sa natural na anyong Filipino.
- source_word: הֵם כְּתוּבִים
  choice: nakasulat ang mga iyon
  rationale: Pinananatili ang tuwirang diwa ng כְּתוּבִים at malinaw na iniuugnay ang panghalip sa mga gawaing nabanggit.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na ‘sa ibabaw ng aklat/rolyo,’ ang “sa Aklat” ang natural na Filipino para sa isang nakasulat na talaan.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: mga Kasaysayan ng mga Hari ng Juda
  rationale: Ipinahihiwatig ng parirala ang opisyal na taunang tala o kronika ng mga hari; ang “mga Kasaysayan” ay malinaw at angkop sa pamagat ng sangguniang ito.
