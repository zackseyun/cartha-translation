translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na tanong at ang pormulang pang-arkibo ng Hebreo. Inilagay ang mga panandang talababa sa mismong mga pariralang nililinaw ng mga ito.
