base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: tl
  text: Ang iba pa sa mga ginawa ni Peka, at ang lahat ng ginawa niya—narito, nakasulat ang mga ito sa Aklat ng mga Talaan[a] ng mga Hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aklat ng mga Kronika ng mga Hari ng Israel.”
    reason: Ipinapakita ang leksikal na alternatibo para sa דִּבְרֵי הַיָּמִים, isang katawagang maaaring isaling “mga kronika” o “mga talaang pangkasaysayan.”
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: Ang iba pang mga ginawa ni Peka
  rationale: Sa pormulang panghari na ito, ang יֶתֶר ay tumutukoy sa nalalabing bahagi ng salaysay, at ang דִּבְרֵי ay idiomatikong tumutukoy sa mga ginawa o gawain ng hari. Natural at malinaw sa makabagong Tagalog ang “iba pang mga ginawa.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng kanyang ginawa
  rationale: Tuwirang pinananatili ang malawak na saklaw ng כָּל at ang payak na kahulugan ng עָשָׂה.
- source_word: הִנָּם
  choice: narito
  rationale: Pinananatili ng “narito” ang deiktiko at presentatibong diin ng Hebreo nang hindi nagiging labis na arkaiko.
- source_word: כְּתוּבִים
  choice: nakasulat
  rationale: Pinananatili ang kongkretong dokumentaryong diwa ng pasibong participle sa halip na gawing mas interpretatibong “nakatala.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na “sa ibabaw ng aklat/balumbon,” ang “sa Aklat” ang natural na Tagalog para sa pagtukoy sa nilalaman ng isang kasulatan.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: mga Kasaysayan ng mga Hari ng Israel
  rationale: Ang parirala ay tumutukoy sa mga taunang rekord o kronika ng kaharian. Ang “mga Kasaysayan” ay malinaw at dignidadong katumbas sa Tagalog, habang ang “ng mga Hari ng Israel” ay natural na pamagat para sa rekord na nauukol sa kanila.
