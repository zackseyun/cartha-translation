translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang pangkasaysayan at ang presentatibong diin ng הִנָּם. Inilagay ang talababa sa pamagat na nililinaw nito, hindi sa pangalan ni Peka.
