translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang “talento” bilang kinikilalang katawagan sa sinaunang yunit ng timbang. Isinalin nang idiomatiko sa pangunahing teksto ang dalawang paggamit ng “kamay,” ngunit inilagay sa talababa ang literal na anyo upang mapanatili ang larawang Hebreo at ang bahagyang kalabuan ng mga panghalip.
