base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: tl
  text: Dumating si Pul, hari ng Asiria, upang lusubin ang lupain.[a] Binigyan ni Menahem si Pul ng isang libong talento ng pilak upang tulungan siya nitong patatagin ang kaharian sa ilalim ng pamamahala ni Menahem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na ang “lupain” ay tumutukoy sa lupain ng Israel.
    reason: cultural_note
  - marker: b
    text: 'Sa literal na Hebreo: “upang ang kamay niya ay makasama niya, upang patatagin ang kaharian sa kanyang kamay.” Ang “kamay” na kasama ng isang tao ay larawan ng pagsuporta sa kanya. Dito, ang unang “niya” ay si Pul, at ang kaharian ay patatatagin sa ilalim ng pamamahala ni Menahem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא ... עַל הָאָרֶץ
  choice: dumating ... upang lusubin ang lupain
  rationale: Ang בוא na sinusundan ng על sa kontekstong militar ay tumutukoy sa pagdating o pagsulong laban sa isang lugar. Likas sa modernong Tagalog ang “dumating ... upang lusubin,” at malinaw nitong naihahayag ang mapanlabang diwa nang hindi ipinapalagay na nasakop na ang lupain.
- source_word: פ֤וּל מֶֽלֶךְ אַשּׁוּר
  choice: si Pul, hari ng Asiria
  rationale: Isinalin ang pangalang pantangi sa karaniwang transliterasyong “Pul” at ang construct chain bilang “hari ng Asiria,” na tuwiran at marangal sa Tagalog.
- source_word: וַיִּתֵּן מְנַחֵם לְפוּל
  choice: Binigyan ni Menahem si Pul
  rationale: Pinanatili ang payak na kahulugan ng נתן na “magbigay.” Bagaman salaping pampolitika o tributo ang tinutukoy sa konteksto, hindi iyon tahasang nakasaad sa pandiwa.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: isang libong talento ng pilak
  rationale: Pinanatili ang tradisyonal na katawagan sa sinaunang yunit ng timbang na ככר bilang “talento,” sa halip na magbigay ng tiyak na makabagong katumbas na maaaring mag-iba ayon sa pamantayang ginagamit.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: upang suportahan siya nito
  rationale: Ang literal na larawan na ang “kamay” ng isa ay kasama ng iba ay isang Hebreong idyoma para sa pagpanig, pagtulong, o pagsuporta. Isinalin ito nang idiomatiko upang maging malinaw at natural sa Tagalog.
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: sa pagpapatatag ng kaharian sa ilalim ng kanyang kapangyarihan
  rationale: Ang Hiphil ng חזק ay “patatagin” o “gawing matatag,” at ang בְּיָדוֹ ay idyoma ng paghawak o pagkontrol. Ipinahahayag ng salin ang pagpapatatag ng kahariang kontrolado ni Menahem habang pinananatili ang pampolitikang diwa ng talata.
