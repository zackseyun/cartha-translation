base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: tl
  text: Nahimlay si Azarias kasama ng kanyang mga ninuno[a], at inilibing nila siya kasama ng kanyang mga ninuno sa Lungsod ni David. Ang anak niyang si Jotam ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “natulog kasama ng kanyang mga ninuno.” Karaniwang eupemismo ito sa Hebreo para sa pagkamatay at pagsama sa mga naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Pinananatili nito ang magalang na eupemismo ng Hebreo para sa kamatayan nang hindi ito tahasang pinapantay sa “namatay.” Mas natural at marangal ito sa modernong Tagalog kaysa sa literal na “natulog” sa pormulang ito.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Sa kontekstong Tagalog, mas malinaw ang “mga ninuno” kaysa sa literal na “mga ama,” sapagkat tumutukoy ito sa mga naunang salinlahi, hindi lamang sa ama o mga lalaking magulang.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan ng Hebreo at ang di-tiyak na gumagawa ng paglilibing.
- source_word: בְּעִיר דָּוִד
  choice: sa Lungsod ni David
  rationale: Natural na anyo ng pangalan ng pook sa Tagalog at malinaw na tumutukoy sa maharlikang libingan.
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Tuwirang ipinahahayag ang paghahari at natural sa pormula ng paghalili sa trono.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Malinaw nitong ipinahahayag ang paghalili ni Jotam sa katungkulan ng hari, hindi lamang ang temporal na pagsunod.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Ang “nahimlay” ay nagpapanatili sa eupemistikong tono ng Hebreo, samantalang ang “mga ninuno” ay umiiwas sa maling pagkaunawa sa literal na “mga ama.”
