  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: tl
  text: Ginawa niya ang tama sa paningin ni Yahweh, ayon sa lahat ng ginawa ng kanyang amang si Uzias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag ding “Azarias” ang haring ito sa ibang bahagi.
    reason: alternative_name
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Hindi na kailangang isalin nang hiwalay ang panimulang וַ bilang “at” sa isang nagsasariling talata.
- source_word: הַיָּשָׁר
  choice: ang tama
  rationale: Ang pariralang עשה הישר ay nangangahulugang gawin ang tama o matuwid. Ang “ang tama” ay natural sa makabagong Tagalog at nananatili ang diwa ng moral na pagtatasa.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang karaniwang Hebreong metapora ng pagsusuri o paghatol mula sa pananaw ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon sa lahat ng
  rationale: Ipinahahayag nito na ang ginawa ng hari ay tumutugma sa buong huwarang iniwan ng kanyang ama.
- source_word: עֻזִיָּהוּ
  choice: Uzias
  rationale: Ginamit ang pangalang tahasang nasa tekstong Hebreo at ang anyong pamilyar at madaling basahin sa Tagalog; hindi ito pinantay sa alternatibong pangalang Azarias.
- source_word: אָבִיו
  choice: kanyang amang
  rationale: Tumutukoy ito sa literal at agarang ugnayang ama at anak, kaya hindi kailangang gawing mas malawak na “ninuno.”
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang likas na ayos ng pangungusap sa Tagalog ay sapat nang nagpapakitang naunang ginawa ni Uzias ang mga bagay na tinularan ng anak niya; hindi kailangan ng hiwalay na anyong katumbas ng past perfect.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang banal na pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Pangalan ng ama ng hari
  choice: Uzias
  alternative: Azarias
  rationale: עֻזִּיָּהוּ ang tahasang pagbasa sa talatang ito. Hindi ito dapat tahimik na ihanay sa alternatibong pangalang ginagamit sa ibang mga talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong idyomang “sa paningin ni Yahweh,” ngunit ginamit ang natural na “ang tama” sa halip na mas mabigat na “ang matuwid.” Inilagay ang talababa pagkatapos ng “Uzias,” sapagkat ang tala ay tungkol sa alternatibong pangalan ng hari.
