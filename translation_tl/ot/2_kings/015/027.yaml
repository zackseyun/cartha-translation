base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: tl
  text: Noong ikalimampu't dalawang taon ni Azarias, hari ng Juda, si Peka na anak ni Remalias ay naging hari ng Israel sa Samaria, at naghari siya nang dalawampung taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: Nang ikalimampu't dalawang taon ng paghahari
  rationale: Likas na salin sa Filipino ng pormula para sa taon ng paghahari; ipinahihiwatig ng konteksto ang 'paghahari' upang luminaw ang pagbibilang ng taon.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: ni Azarias na hari ng Juda
  rationale: Pinananatili ang kaugnayan ng taon kay Azarias at ang tahasang titulong maharlika.
- source_word: מָלַךְ
  choice: ay naging hari
  rationale: Sa pormulang ito, ipinahihiwatig ng pandiwa ang pagluklok ni Peka; iniiwasan din nito ang di-kinakailangang pag-uulit ng 'naghari.'
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: si Peka na anak ni Remalias
  rationale: Malinaw at likas na anyo ng patronimiko sa Filipino, gamit ang karaniwang anyo ng mga pangalang biblikal.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, ang 'naging hari sa Israel' ay natural na nagpapahayag ng pamamahala sa bayan o kaharian nang hindi na kailangang idagdag ang salitang 'kaharian.'
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Tumutukoy sa lugar o luklukan ng paghahari.
- source_word: עֶשְׂרִים שָׁנָה
  choice: nang dalawampung taon
  rationale: Tuwirang ipinapahayag ang tagal ng paghahari ni Peka.
