  terminology: Wasto at natural ang “nakipagsabwatan,” “anak ni,” at “naghari bilang kahalili niya.” Napananatili ng talababa ang di-tiyak na kahulugan ng קָבָל־עָם at ang angkla nito ay nasa tamang parirala.
