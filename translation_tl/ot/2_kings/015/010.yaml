base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: tl
  text: Pagkatapos, nakipagsabwatan laban sa kanya si Shallum na anak ni Jabesh. Sinaktan niya siya sa harap ng mga tao[a], at pinatay niya siya. At naghari siya bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang hayagan” o “sa harap ng kapulungan.” Mahirap tiyakin ang eksaktong kahulugan ng pariralang Hebreo na קָבָל־עָם.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: nakipagsabwatan laban sa kanya
  rationale: Sa konteksto ng paghalili sa hari, ang קשר ay tumutukoy sa lihim at mapanlabang sabwatan. Likas sa modernong Filipino ang pariralang ito at pinananatili ang pampolitikang diwa.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: si Shallum na anak ni Jabesh
  rationale: Isinalin ang genealogical na בן sa karaniwang pormulang Filipino na “anak ni,” habang transliterado ang mga pangalang pantangi.
- source_word: וַיַּכֵּהוּ
  choice: Pinabagsak niya siya
  rationale: Ang נכה ay nangangahulugang hampasin o pabagsakin. Ipinahihiwatig ng “pinabagsak” ang marahas na paglusob ngunit hindi nito inuuna ang tahasang pagpatay na sinasabi ng kasunod na pandiwa.
- source_word: קָבָל־עָם
  choice: sa harap ng mga tao
  rationale: Mahirap at di-pangkaraniwan ang parirala. Ang malapit na salin ay nagpapanatili sa posibleng kahulugang ginawa iyon sa presensiya ng mga tao, habang inilalahad sa talababa ang ibang maaaring pagbasa.
- source_word: וַיְמִיתֵהוּ
  choice: at pinatay
  rationale: Ang Hiphil ng מות ay nangangahulugang magpapatay o pumatay. Pinananatili itong hiwalay sa naunang marahas na kilos upang masundan ang pagkakasunod ng mga pandiwa sa Hebreo.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: At siya ang naghari bilang kahalili niya
  rationale: Ipinapahayag ng מלך kasama ng תחתיו ang paghalili sa trono. Ang “naghari bilang kahalili niya” ay malinaw at natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa maiikling pangungusap upang maiwasan ang sunod-sunod at malabong mga panghalip, habang pinananatili ang pagkakasunod ng sabwatan, pananakit, pagpatay, at paghalili sa trono.
