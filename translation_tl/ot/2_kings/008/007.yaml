  to: Dumating si Eliseo sa Damasco. May sakit noon si Ben-hadad, hari ng Aram[a]. Ipinagbigay-alam sa kanya, “Dumating dito ang tao ng Diyos.”
  rationale: Inayos ang pandiwa ng pagdating upang mas tumpak na maihatid ang בוא nang walang idinagdag na direksiyon. Ginawang mas malinaw ang aposisyon na “hari ng Aram” at pinili ang natural ngunit impersonal na pasibong pahayag para sa pag-uulat kay Ben-hadad. Walang binagong kahulugan o idinagdag na interpretasyon.
