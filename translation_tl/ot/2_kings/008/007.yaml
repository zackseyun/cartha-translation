base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: tl
  text: Dumating si Eliseo sa Damasco. May sakit noon si Ben-hadad, hari ng Aram[a]. Ipinagbigay-alam sa kanya, “Dumating dito ang tao ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Siria.” Sa Hebreo ay “Aram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, pumunta
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” at ang “pumunta” ay angkop dahil ang tagapagsalaysay ay hindi nasa Damasco.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang karaniwang anyo ng pangalan sa tradisyong Tagalog sa Bibliya.
- source_word: דַּמֶּשֶׂק
  choice: Damasco
  rationale: Ito ang nakagawiang anyo ng pangalan ng lugar sa Tagalog.
- source_word: וּבֶן־הֲדַד ... חֹלֶה
  choice: Noon, may sakit si Ben-hadad
  rationale: Ang waw ay nagpapakilala rito ng kalagayang nasa likuran ng salaysay, hindi lamang ng kasunod na pangyayari. Malinaw itong ipinahihiwatig ng “Noon,” habang tuwirang isinasalin ng “may sakit” ang participle na חֹלֶה.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinanatili ang Hebreong pangalang etnoheograpiko na Aram sa halip na ang interpretatibong tradisyonal na “Siria.”
- source_word: וַיֻּגַּד לוֹ
  choice: May nagsabi sa kanya
  rationale: Ang Hebreo ay impersonal na pasibo. Sa natural na Tagalog, napapanatili ang di-tiyak na tagapagbalita sa “May nagsabi sa kanya” nang hindi nagdaragdag ng pagkakakilanlan.
- source_word: לֵאמֹר
  choice: '[ipinakilala sa pamamagitan ng tuwirang sipi]'
  rationale: Hindi kailangang tumbasan nang hiwalay ang pormulang quotative na לֵאמֹר; natural na ginagampanan ng tuwirang sipi ang tungkulin nito sa Tagalog.
- source_word: בָּא
  choice: Dumating
  rationale: Ang perfect sa iniulat na pananalita ay tumutukoy sa natapos na pagdating na may kasalukuyang bunga; sa Tagalog, natural na naihahatid ito ng “Dumating dito.”
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinanatili ang literal at kinikilalang titulong Hebreo sa halip na paliitin ang kahulugan sa “propeta ng Diyos.”
- source_word: עַד הֵנָּה
  choice: dito
  rationale: Ang idyoma ay tumutukoy sa pagdating sa kinaroroonan ng nagsasalita; “dito” ang malinaw at likas na katumbas sa Tagalog.
