  source_fidelity: Ang “pumunta” ay posibleng salin ng בוא, ngunit ang “dumating” ay mas malapit sa diin ng Hebreo sa pagdating ni Eliseo sa Damasco at hindi nagpapahiwatig ng direksiyong hindi tinutukoy ng teksto. Ang “Ipinagbigay-alam sa kanya” ay nagpapanatili ng impersonal na pasibo ng וַיֻּגַּד לוֹ. Napananatili ang Aram at ang literal na “tao ng Diyos.”
  naturalness: Likas at marangal sa modernong Filipino ang “Dumating si Eliseo sa Damasco” at “May sakit noon si Ben-hadad, hari ng Aram.” Mas malinaw ang ayos ng aposisyon para sa tungkulin ni Ben-hadad bilang hari.
  terminology: Ang Eliseo, Damasco, Ben-hadad, Aram, at “tao ng Diyos” ay angkop at pare-pareho sa nakagawiang Tagalog na terminolohiya. Ang talababa sa Aram ay wastong nakaangkla at ang “Siria” ay katanggap-tanggap na leksikal na alternatibo.
