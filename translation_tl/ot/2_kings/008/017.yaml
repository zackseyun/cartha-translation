  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: tl
  text: Tatlumpu't dalawang taong gulang siya nang maging hari, at walong taon siyang naghari sa Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Tatlumpu't dalawang taong gulang siya
  rationale: Ang בֶּן na sinusundan ng bilang at שָׁנָה ay karaniwang Hebreong pormula para sa edad. Isinalin ito sa natural na modernong Tagalog sa halip na literal na “anak ng tatlumpu't dalawang taon.”
- source_word: הָיָה בְמָלְכוֹ
  choice: nang maging hari
  rationale: Ipinapahayag ng parirala ang edad niya sa pagsisimula ng kanyang paghahari; malinaw at likas sa Tagalog ang “nang maging hari.”
- source_word: וּשְׁמֹנֶה שָׁנָה
  choice: at walong taon
  rationale: Tuwirang pinananatili ang eksaktong tagal na walong taon.
- source_word: מָלַךְ
  choice: siyang naghari
  rationale: Ang pandiwa ay tumutukoy sa aktuwal na paghahari, hindi lamang sa pagkakaroon ng titulong hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Lokatibo ang pang-ukol at tinutukoy ang lugar ng kanyang paghahari.
