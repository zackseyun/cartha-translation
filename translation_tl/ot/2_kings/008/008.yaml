base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: tl
  text: Sinabi ng hari kay Hazael, “Magdala ka ng regalo at humayo ka upang makipagkita sa tao ng Diyos. Sumangguni ka kay Yahweh sa pamamagitan niya at itanong, ‘Gagaling ba ako sa sakit na ito?’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mabubuhay ba ako mula sa sakit na ito?” Literal na “mabuhay” ang pandiwang Hebreo; dito, tumutukoy ito sa pagkaligtas sa sakit o paggaling mula rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: regalo
  rationale: Sa kontekstong ito, ito ay kaloob na dinadala sa propeta kasabay ng pagsangguni, hindi handog na panritwal o buwis.
- source_word: לִקְרַאת
  choice: puntahan
  rationale: Kasunod ng pandiwang ‘humayo,’ ipinapahayag nito ang layuning makipagkita sa tao ng Diyos. Ang ‘puntahan’ ay natural at malinaw sa modernong Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili nito ang nakaugaliang katawagang Hebreo sa propeta at ang teolohikal na bigat nito, sa halip na palitan lamang ng ‘propeta.’
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: Sumangguni ka kay Yahweh sa pamamagitan niya
  rationale: Dito, ang דרשׁ ay paghingi ng sagot mula kay Yahweh, at ipinakikita ng מֵאֹתוֹ na ang tao ng Diyos ang tagapamagitan ng pagsangguni.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh,’ hindi pinapalitan ng isang titulo.
- source_word: הַאֶחְיֶה
  choice: Gagaling ba ako
  rationale: Literal itong ‘mabubuhay ba ako,’ ngunit sa tanong tungkol sa kasalukuyang karamdaman, ang natural na diwa ay kung gagaling o makaliligtas ang hari.
- source_word: מֵחֳלִי זֶה
  choice: sa sakit na ito
  rationale: Natural sa Tagalog ang ‘gagaling sa sakit na ito’ at malinaw nitong tinutukoy ang kasalukuyang karamdaman ng hari.
- source_word: בְּיָדְךָ
  choice: Magdala ka
  rationale: Ang literal na ‘sa iyong kamay’ ay idyomatikong tumutukoy sa personal na pagdadala. Sapat at mas natural sa Tagalog ang ‘magdala ka.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ang personal na pangalan sa transliterasyong ‘Yahweh.’
- issue: Kahulugan ng הַאֶחְיֶה sa konteksto ng karamdaman
  choice: Gagaling ba ako
  alternative: Mabubuhay ba ako
  rationale: Hindi tiyak na nilulutas nito ang lahat ng implikasyon tungkol sa pagkabuhay o paggaling; inilalagay sa pangunahing teksto ang natural na kontekstuwal na kahulugan at iniingatan sa talababa ang literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘tao ng Diyos’ upang mapanatili ang katawagang Hebreo, at iniwasan ang sobrang literal na ‘dalhin mo sa iyong kamay,’ na hindi likas sa kasalukuyang Tagalog.
