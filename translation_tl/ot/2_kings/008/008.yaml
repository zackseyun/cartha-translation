  to: Sinabi ng hari kay Hazael, “Magdala ka ng regalo at humayo ka upang makipagkita sa tao ng Diyos. Sumangguni ka kay Yahweh sa pamamagitan niya at itanong, ‘Gagaling ba ako sa sakit na ito?’[a]”
