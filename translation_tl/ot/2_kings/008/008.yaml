    issue: Ang “puntahan mo ang tao ng Diyos” ay hindi tahasang nagpapahayag ng layuning makipagkita.
    rationale: Ang לִקְרַאת ay “upang makipagkita/makiharap.” Maaaring tumukoy ang “puntahan” sa pagpunta lamang sa isang lugar o pagbisita, kaya mas tumpak ang paglalagay ng “upang makipagkita.”
