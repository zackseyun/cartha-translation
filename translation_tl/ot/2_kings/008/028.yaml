base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: tl
  text: Sumama siya kay Joram na anak ni Ahab upang makipagdigma laban kay Hazael na hari ng Aram sa Ramot-gilead[b], at sinugatan ng mga Arameo si Joram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hinampas si Joram.” Mas pangkalahatan ang kahulugan ng pandiwang Hebreo; pinili ang “sinugatan” dahil ipinahihiwatig ng konteksto ng labanan at ng kaugnay na salaysay na nasugatan siya ngunit hindi namatay.
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal na “Syria” at “mga taga-Syria.” “Aram” at “mga Arameo” ang nasa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: Sumama siya kay Joram
  rationale: Ang אֵת kasunod ng הלך ay nagpapahayag dito ng pagsama. Natural sa modernong Tagalog ang “sumama siya kay Joram” at malinaw na magkasama silang humayo.
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: upang makipagdigma laban kay Hazael
  rationale: Layunin ng pagpunta ang pakikidigma, at ang עִם sa kontekstong militar ay tumutukoy sa kalaban. Nililinaw ng “laban kay” ang ugnayang iyon.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang Hebreong pangalang heograpiko at etniko na Aram sa halip na ang tradisyonal na Syria.
- source_word: בְּרָמֹת גִּלְעָד
  choice: sa Ramot-gilead
  rationale: Isinasalin ang lokasyon ng labanan gamit ang karaniwang anyong Tagalog ng pangalan.
- source_word: וַיַּכּוּ
  choice: sinugatan
  rationale: Malawak ang saklaw ng נכה at maaaring mangahulugang hampasin. Sa konteksto ng labanan at kasunod na salaysay, sugat at hindi kamatayan ang tinutukoy.
- source_word: אֲרַמִּים
  choice: mga Arameo
  rationale: Ito ang pangmaramihang katawagang etniko mula sa Aram at higit na tapat sa Hebreo kaysa “mga taga-Syria.”
- source_word: יוֹרָם
  choice: Joram
  rationale: Sinusunod ang anyo ng pangalan sa talatang Hebreo.
theological_decisions: []
