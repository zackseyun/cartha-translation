  naturalness: Natural at malinaw ang karamihan ng draft. Ang “bumangon” at “tao ng Diyos” ay kapwa likas at matatag na gamit sa makabagong Tagalog na Bibliya. Ang “sambahayan” ay angkop para sa בֵּיתָהּ.
  terminology: Panatilihin ang “tao ng Diyos” bilang salin ng biblical title na אִישׁ הָאֱלֹהִים. Ang “nanirahan bilang dayuhan” ay mahusay na naghahatid ng katayuang banyaga/sojourner ng וַתָּגָר nang hindi nagdaragdag ng diwa.
