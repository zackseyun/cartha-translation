base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: tl
  text: Kaya bumangon ang babae at ginawa ang sinabi ng tao ng Diyos. Siya at ang kanyang sambahayan ay umalis at nanirahan bilang dayuhan[a] sa lupain ng mga Filisteo sa loob ng pitong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakipamayan bilang dayuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: tumindig
  rationale: Ang wayyiqtol ng קום ay nagsasaad ng pagtugon at pagsisimula ng pagkilos; ang “tumindig” ay dignified at hindi labis na nagpapahiwatig na agad siyang naglakbay.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: ginawa ang sinabi ng
  rationale: Likas sa makabagong Tagalog ang idyomang ito at malinaw na tumutukoy sa pagsunod sa binigkas na tagubilin.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Sa kontekstong biblikal, ipinahahayag nito ang isang taong inatasan ng Diyos. Mas natural ito sa Tagalog kaysa literal na “tao ng Diyos,” nang hindi basta pinapalitan ang titulo ng “propeta.”
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: Umalis siya kasama ang kanyang sambahayan
  rationale: Ang בַּיִת na may hulapi ay tumutukoy sa sambahayan, hindi sa gusali; malinaw ring pinananatili na siya at ang kanyang sambahayan ang umalis.
- source_word: וַתָּגָר
  choice: nanirahan bilang dayuhan
  rationale: 'Pinananatili nito ang diwa ng גור: paninirahan sa isang lupaing hindi sariling bayan, hindi lamang pangkalahatang pagtira.'
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: sa lupain ng mga Filisteo
  rationale: Tuwirang salin ng etno-heograpikong parirala at natural sa Tagalog.
- source_word: שֶׁבַע שָׁנִים
  choice: sa loob ng pitong taon
  rationale: Karaniwang paraan sa Tagalog upang ihayag ang tagal ng paninirahan.
theological_decisions:
- issue: Pagpapakahulugan sa titulong אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Iniiwasan ang hindi natural at maaaring mapagkamalang pangkalahatang paglalarawan na “tao ng Diyos,” habang hindi rin nililimitahan ang titulo sa terminong “propeta.”
translation_notes:
  register: Makabagong, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” upang maisama ang buong household, at ang talababa upang mapanatili ang panlipunan at pansamantalang himig ng pandiwang גור.
