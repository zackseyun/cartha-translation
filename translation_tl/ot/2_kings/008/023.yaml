id: 2KI.8.23
reference: 2 Kings 8:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Yoram[b], at ang lahat ng ginawa niya—hindi ba nakasulat ang mga iyon sa Aklat ng mga Salaysay ng mga Hari ng Juda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aklat ng mga talaan ng mga hari ng Juda.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: Yoram; tradisyonal na Jehoram.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang nagbubuod sa paghahari, ang יֶתֶר דִּבְרֵי ay tumutukoy sa natitira pang mga gawa o pangyayari tungkol sa hari. Natural at malinaw sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: יוֹרָם
  choice: Yoram
  rationale: Tuwirang transliterasyon ito ng Hebreong יוֹרָם; inilalagay sa talababa ang tradisyonal na anyong “Jehoram.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: at ang lahat ng ginawa niya
  rationale: Pinananatili nito ang lawak at payak na estruktura ng Hebreong sugnay.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang mambabasa, at ang “mga iyon” ay tumutukoy sa maramihang mga gawa na naunang binanggit.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng kasulatan/balumbon,” ang “sa Aklat” ang natural na paraan ng pagtukoy sa nilalaman ng isang nakasulat na sanggunian.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Aklat ng mga Salaysay ng mga Hari ng Juda
  rationale: Ang דִּבְרֵי הַיָּמִים ay isang pormulang tumutukoy sa opisyal na mga salaysay o talaan; ang pamagat na ito ay malinaw, marangal, at kaayon ng gamit sa konteksto.
