  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֤ם אִמּ/וֹ֙ עֲתַלְיָ֔הוּ בַּת עָמְרִ֖י מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: tl
  text: Si Ahazias ay dalawampu’t dalawang taong gulang nang magsimulang maghari, at isang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Atalia, na anak na babae ni Omri, hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inapo ni Omri.” Sa Hebreo, ang “anak na babae” ay maaari ring tumukoy sa isang babaeng inapo o kasapi ng isang dinastiya, hindi lamang sa tuwirang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: Dalawampu’t dalawang taong gulang
  rationale: Ang literal na Hebreong idyoma ay “anak ng dalawampu’t dalawang taon,” ngunit ang likas at eksaktong katumbas nito sa modernong Tagalog ay “dalawampu’t dalawang taong gulang.”
- source_word: בְמָלְכוֹ
  choice: nang maging hari siya
  rationale: Likas na ipinapahayag sa Tagalog ang pormula ng pagluklok bilang “nang maging hari siya,” sa halip na isang salitang-sa-salitang anyong hindi natural.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: at isang taon siyang naghari
  rationale: Tuwirang pinananatili ang tagal ng kanyang paghahari sa malinaw at likas na ayos ng Tagalog.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong salin at nakaugaliang anyo ng pangalan ng lungsod sa Tagalog.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormal na pormulang Hebreo habang nananatiling malinaw at natural sa modernong Tagalog.
- source_word: עֲתַלְיָהוּ
  choice: Atalia
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Athaliah.
- source_word: בַּת עָמְרִי
  choice: anak ni Omri
  rationale: Ang בַּת ay literal na “anak na babae.” Dahil malinaw na babae si Atalia, natural sa Tagalog ang “anak”; inilalahad sa talababa ang posibleng mas malawak na kahulugang pangangkanan o pandinastiya.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang katumbas ng Hebreong pariralang tumutukoy sa maharlikang katayuan ni Omri.
theological_decisions:
- issue: Saklaw ng ugnayang pangangkanan sa “anak ni Omri”
  choice: Pinanatili sa pangunahing teksto ang literal na ugnayang “anak ni Omri.”
  alternative: inapo ni Omri
  rationale: Maaaring gamitin sa Hebreo ang terminong “anak na babae” para sa isang babaeng inapo o kasapi ng dinastiya, hindi lamang sa tuwirang anak. Pinananatili ng talababa ang tunay na posibilidad na ito nang hindi agad nilulutas ang ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang mga anyong Ahazias, Atalia, Jerusalem, Omri, at Israel. Inilagay ang marker [a] pagkatapos ng “hari ng Israel,” kung saan aktuwal na nauugnay ang talababa tungkol sa “anak ni Omri.”
