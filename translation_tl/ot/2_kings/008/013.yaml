source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: tl
  text: Sinabi ni Hazael, “Ngunit ano ba ang iyong lingkod—ang asong ito—para magawa ko ang malaking bagay na ito?” Sumagot si Eliseo, “Ipinakita sa akin ni Yahweh na magiging hari ka ng Aram.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hari sa ibabaw ng Aram”; literal sa Hebreo, “hari sa ibabaw ng Aram.”
    reason: Ipinakikita ang literal na puwersa ng pang-ukol na עַל; ang “hari ng Aram” ang karaniwang natural na pagpapahayag sa Tagalog.
lexical_decisions:
- source_word: כִּי מָה
  choice: Ngunit ano ba
  rationale: Ipinahahayag nito ang di-makapaniwalang pagtutol ni Hazael; ang “ngunit” at “ba” ay likas na naghahatid ng gayong puwersa sa modernong Tagalog.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Karaniwang magalang at mapagpakumbabang pagtukoy sa sarili sa harap ng nakatataas; hindi nito ipinapalagay na legal na alipin si Hazael.
- source_word: הַכֶּלֶב
  choice: isang aso lamang
  rationale: Pinananatili ang mapanghamak na larawang ginagamit ni Hazael tungkol sa sarili, habang likas na ipinahahayag sa Tagalog ang kaniyang pagpapakababa at pag-aangking walang kakayahan.
- source_word: כִּי יַעֲשֶׂה
  choice: para magawa niya
  rationale: Naipakikita ang retorikal na pag-aalinlangan tungkol sa kakayahan o posibilidad nang hindi nililimitahan ang kahulugan sa simpleng panghinaharap.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: ang napakalaking bagay na ito
  rationale: Pinananatili ang malawak na saklaw ng דָּבָר at ang tensiyon ng גָּדוֹל, na maaaring tumukoy sa isang napakalaking gawa nang hindi tahasang nilalagyan ng moral na paglalarawan.
- source_word: הִרְאַנִי
  choice: Ipinakita sa akin
  rationale: Direkta at likas na salin ng anyong causative perfect, na tumutukoy sa paghahayag na natanggap na ni Eliseo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na tahasang nasa tekstong Hebreo.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: magiging hari ka sa Aram
  rationale: Likas sa Tagalog at pinananatili ang diwa ng paghahari sa o ibabaw ng Aram; hindi ginagamit ang makabagong pangalang “Syria.”
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang ginagamit sa talata, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng pahayag tungkol sa magiging paghahari ni Hazael
  choice: magiging hari ka sa Aram
  alternative: magiging hari ka ng Aram
  rationale: Mas malapit ang “sa Aram” sa Hebreong עַל at iniiwasang dagdagan ang sinabi ng teksto tungkol sa paraan o pagiging lehitimo ng kaniyang paghahari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “isang aso lamang” bilang likas na pagpapakababa sa sarili, at pinanatili ang “napakalaking bagay” upang huwag tahasang lutasin ang posibleng negatibo o ironikong puwersa ng Hebreo.
