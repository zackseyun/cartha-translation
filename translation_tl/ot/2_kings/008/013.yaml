  to: Sinabi ni Hazael, “Ngunit ano ba ang iyong lingkod—ang asong ito—para magawa ko ang malaking bagay na ito?” Sumagot si Eliseo, “Ipinakita sa akin ni Yahweh na magiging hari ka ng Aram.[a]”
