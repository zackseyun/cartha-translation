base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: tl
  text: Tinanong ng hari ang babae, at isinalaysay niya sa kanya. Pagkatapos, nagtalaga ang hari ng isang opisyal[a] para sa kanya at nagsabi, “Ibalik mo ang lahat ng pag-aari niya, pati ang lahat ng ani ng bukid mula sa araw na umalis siya sa lupain hanggang ngayon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “eunuko.” Ang katawagang ito sa palasyo ay maaaring tumukoy sa isang literal na eunuko o, sa mas pangkalahatan, sa isang opisyal ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: Tinanong ng hari ang babae
  rationale: Likas sa modernong Tagalog ang ayos na ito at malinaw na tumutukoy sa babaeng Sunamita; hindi kailangang ipakahulugang ‘asawa’ ang אִשָּׁה sa konteksto.
- source_word: וַתְּסַפֶּר לוֹ
  choice: isinalaysay niya sa kanya ang nangyari
  rationale: Ang piel ng ספר ay ‘magsalaysay’ o ‘magkuwento.’ Idinagdag ang ‘ang nangyari’ bilang likas na ipinahihiwatig na layon sa Tagalog, nang hindi tinutukoy nang higit sa konteksto ang nilalaman.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: nagtalaga ang hari ng isang opisyal para sa kanya
  rationale: Ipinahihiwatig ng konstruksyon ang pagtatalaga ng isang tauhan upang isagawa ang utos. Ang סָרִיס ay maaaring opisyal ng palasyo o literal na eunuko, kaya pinanatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: לֵאמֹר
  choice: at iniutos
  rationale: Ipinakikilala nito ang tuwirang pananalita. Sa kontekstong administratibo, mas natural sa Tagalog ang ‘iniutos’ kaysa mekanikal na ‘na sinasabi,’ habang pinananatili ang puwersa ng pahayag.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: Ibalik mo ang lahat ng pag-aari niya
  rationale: Ang hiphil imperative ng שוב ay utos na isauli ang pag-aari. Malinaw at natural ang ‘Ibalik mo,’ at komprehensibo ang ‘lahat ng pag-aari niya.’
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: lahat ng ani ng bukid
  rationale: Ang תְּבוּאָה ay tumutukoy sa bunga o ani ng lupang sinasaka. Ang ‘ani ng bukid’ ay payak at malawak, at hindi ito nililimitahan sa salaping kita.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: mula nang araw na umalis siya sa lupain hanggang ngayon
  rationale: Pinananatili ng ‘lupain’ ang saklaw ng אֶרֶץ nang hindi sapilitang pinipili ang ‘bansa’ o ‘rehiyon,’ at tuwirang naihahatid ang saklaw ng panahon.
