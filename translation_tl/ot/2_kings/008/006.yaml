revisions:
- from: Tinanong ng hari ang babae, at isinalaysay niya sa kanya ang nangyari. Pagkatapos, nagtalaga ang hari ng isang opisyal[a] para sa kanya at iniutos, “Ibalik mo ang lahat ng pag-aari niya, pati ang lahat ng ani ng bukid mula nang araw na umalis siya sa lupain hanggang ngayon.”
  to: Tinanong ng hari ang babae, at isinalaysay niya sa kanya. Pagkatapos, nagtalaga ang hari ng isang opisyal[a] para sa kanya at nagsabi, “Ibalik mo ang lahat ng pag-aari niya, pati ang lahat ng ani ng bukid mula sa araw na umalis siya sa lupain hanggang ngayon.”
  rationale: Inalis ang hindi tahasang layong “ang nangyari,” inayos ang temporal na parirala upang maging likas at tumpak na “mula sa araw na,” at pinalitan ang “iniutos” ng “nagsabi” upang mas malapit sa לֵאמֹר. Pinanatili ang kahulugan, saklaw ng restitusyon, at talababa para sa leksikal na kalabuan ng סָרִיס.
