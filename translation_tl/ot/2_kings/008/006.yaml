    issue: May idinagdag na “ang nangyari” sa “isinalaysay niya sa kanya ang nangyari.”
    rationale: Ang וַתְּסַפֶּר לוֹ ay simpleng “isinalaysay/ikinuwento niya sa kanya.” Maaaring mahinuha ang nilalaman mula sa konteksto, ngunit hindi ito kailangang idagdag sa mismong salin.
  - severity: medium
    issue: Hindi likas ang pariralang “mula nang araw na umalis siya.”
    rationale: Ang מִיּוֹם ay “mula sa araw na”; ito rin ang karaniwang at malinaw na Tagalog na konstruksiyon.
  - severity: low
    issue: Ang “iniutos” ay bahagyang higit na interpretatibo kaysa sa panandang pangsipi na לֵאמֹר.
    rationale: Bagaman utos ang nilalaman, mas tuwirang naipapakita ng “nagsabi” ang pormang Hebreo nang hindi nawawala ang puwersa ng imperatibo.
