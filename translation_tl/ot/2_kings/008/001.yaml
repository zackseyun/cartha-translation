revisions:
- from: Sinabi noon ni Eliseo sa babaeng ang anak ay binuhay niyang muli[a], “Umalis ka, kasama ang iyong sambahayan, at pansamantalang manirahan saan ka man maaaring tumira, sapagkat ipinatawag ni Yahweh ang taggutom, at darating din ito sa lupain sa loob ng pitong taon.”
  to: Nagsalita na si Eliseo sa babaeng ang anak ay binuhay niyang muli[a], “Bumangon ka at umalis ka, ikaw at ang iyong sambahayan, at pansamantalang manirahan saan ka man makapaninirahan, sapagkat ipinatawag na ni Yahweh ang taggutom, at dumating na rin ito sa lupain nang pitong taon.”
  rationale: Pinalitan ang panghinaharap na “darating” ng “dumating na” upang sundin ang aspekto ng Hebreo. Ginawang “Nagsalita na si Eliseo” ang pambungad upang malinaw na maipahiwatig ang naunang pananalita. Idinagdag ang “Bumangon ka at” at ang tahasang “ikaw” upang mapanatili ang magkapares na pautos at ang explicit na panghalip sa Hebreo, habang pinanatiling natural ang daloy ng Filipino.
