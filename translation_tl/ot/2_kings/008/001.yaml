base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: tl
  text: Nagsalita na si Eliseo sa babaeng ang anak ay binuhay niyang muli[a], “Bumangon ka at umalis ka, ikaw at ang iyong sambahayan, at pansamantalang manirahan saan ka man makapaninirahan, sapagkat ipinatawag na ni Yahweh ang taggutom, at dumating na rin ito sa lupain nang pitong taon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang anak ay muli niyang binigyang-buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: Sinabi noon
  rationale: Ang perpektong anyo ay tumutukoy sa naunang sinabi ni Eliseo kaugnay ng kasunod na salaysay; natural na ipinahihiwatig ng “noon” ang dating pangyayari nang hindi nagdaragdag ng hiwalay na panandang diskurso sa simula.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: ang anak ay binuhay niyang muli
  rationale: Ipinapahayag nito ang causative na diwa ng החיה at malinaw na tumutukoy sa dating patay na anak na muling nabuhay.
- source_word: קוּמִי וּלְכִי
  choice: Umalis ka
  rationale: Ang magkapares na pautos na literal na “tumindig ka at humayo ka” ay isang idyomatikong panawagang kumilos; “Umalis ka” ang natural at agarang Filipino sa kontekstong paglikas.
- source_word: אַתִּי וּבֵיתֵךְ
  choice: kasama ang iyong sambahayan
  rationale: Ang בַּיִת ay tumutukoy rito sa mga tao at dependiyente ng babae, kaya mas eksakto ang “sambahayan” kaysa pisikal na “bahay.”
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: at pansamantalang manirahan saan ka man maaaring tumira
  rationale: Pinananatili ng “pansamantalang manirahan” ang diwa ng גור bilang paninirahan ng isang dayuhan o pansamantalang residente, habang natural sa modernong Filipino ang kasunod na parirala.
- source_word: קָרָא יְהוָה לָרָעָב
  choice: ipinatawag ni Yahweh ang taggutom
  rationale: Pinananatili ng “ipinatawag” ang personipikasyon at soberanya sa pandiwang קרא na may ל, sa halip na gawing simpleng pahayag lamang tungkol sa taggutom.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: at darating din ito sa lupain sa loob ng pitong taon
  rationale: Ang anyong בָּא ay maaaring maglahad ng tiyak o nalalapit na pangyayari; sa direktang babala bago ang taggutom, malinaw sa Filipino ang panghinaharap na “darating.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pagkilos ng Diyos kaugnay ng taggutom
  choice: ipinatawag ni Yahweh ang taggutom
  alternative: ipinahayag ni Yahweh na magkakaroon ng taggutom
  rationale: Pinananatili nito ang masidhing larawan ng tekstong Hebreo na ang taggutom ay tinawag o ipinatawag ni Yahweh, nang hindi pinahihina o sistematikong ipinapaliwanag ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambahayan” para sa panlipunang diwa ng בית at “pansamantalang manirahan” upang mapanatili ang nuance ng גור nang hindi gumagamit ng lipas o teknikal na salita. Ang “Sinabi noon” ay nagpapakita ng anterior na ugnayan ng pangyayari sa konteksto.
