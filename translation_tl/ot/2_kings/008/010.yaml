base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: tl
  text: At sinabi ni Eliseo sa kanya, “Pumunta ka at sabihin mo sa kanya, ‘Tiyak na gagaling ka.’[a] Ngunit ipinakita sa akin ni Yahweh na tiyak na mamamatay siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na Hebreo: “Tiyak na hindi ka mabubuhay.” Mahirap ang tekstong Hebreo rito. Marami ang umuunawa rito bilang, “Tiyak na gagaling ka,” kahit kasunod na inihayag na tiyak siyang mamamatay; sa konteksto, maaaring tumukoy ang “gagaling” sa paggaling mula sa karamdaman.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: At sinabi ni Eliseo sa kanya
  rationale: Pinangalanan sa Hebreo si Eliseo bilang simuno. Ang ayos na ito ay natural sa modernong Filipino at malinaw na pinananatili ang tinutukoy ng panghalip.
- source_word: לֵךְ אֱמָר
  choice: Humayo ka at sabihin mo sa kanya
  rationale: Pinananatili ang dalawang pautos. Ang “humayo” ay marangal ngunit madaling maunawaan, at ang “sabihin mo sa kanya” ay malapit sa אמר.
- source_word: לא חָיֹה תִחְיֶה
  choice: Tiyak na gagaling ka
  rationale: Sa konteksto ng karamdaman, ang חיה ay natural na tumutukoy sa paggaling o pagkaligtas sa sakit. Ang infinitive absolute kasama ng imperfect ay nagpapahayag ng katiyakan. Dahil ang Masoretikong anyo na לא ay literal na nagbibigay ng negatibong diwa, inilalahad ang suliranin sa talababa.
- source_word: וְהִרְאַנִי יְהוָה
  choice: Ngunit ipinakita sa akin ni Yahweh
  rationale: Ang “ngunit” ay naghahayag ng malinaw na pagsalungat sa mensaheng ipasasabi at sa inihayag kay Eliseo. Ginamit ang “Yahweh” para sa banal na pangalan.
- source_word: כִּי מוֹת יָמוּת
  choice: na tiyak na mamamatay siya
  rationale: Ang infinitive absolute at imperfect ng מות ay mariing nagpapahayag ng katiyakan; malinaw itong naihahatid ng “tiyak na mamamatay.”
theological_decisions:
- issue: Ang mahirap na pariralang לא חיה תחיה
  choice: Isinalin sa pangunahing teksto bilang utos na sabihing gagaling ang hari, habang pinanatili sa talababa ang literal na negatibong pagbasa.
  alternative: “Tiyak na hindi ka mabubuhay,” ayon sa pagkakapuntos ng Masoretikong tekstong Hebreo; maaari ring unawain na may suliraning tekstuwal, gaya ng לוֹ sa halip na לא.
  rationale: 'Ang literal na negatibong pagbasa ay mahirap itugma sa kasunod na “ngunit” at sa daloy ng salaysay: maaaring gumaling si Ben-hadad sa sakit ngunit mamamatay pa rin sa ibang paraan. Hindi itinatago ng salin ang tunay na kalabuan, kaya nakatala ang negatibong anyo sa talababa.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “humayo” upang mapanatili ang dignidad ng salaysay, ngunit iniwasan ang labis na makalumang pananalita. Ang pangalang Eliseo ang karaniwang anyong Filipino ng Elisha, at “Yahweh” ang tuwirang transliterasyon ng banal na pangalan.
