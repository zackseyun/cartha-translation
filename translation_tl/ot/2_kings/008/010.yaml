  source_fidelity: Tumpak na naihahatid ng pangunahing salin ang kontekstuwal na pagbasa ng mahirap na לא חיה תחיה bilang mensaheng “Tiyak na gagaling ka,” at napapanatili sa talababa ang literal na negatibong pagbasa. Ang “tiyak na mamamatay siya” ay wastong naghahatid ng mariing infinitive absolute at imperfect sa כִּי מוֹת יָמוּת.
  naturalness: Malinaw at marangal ang salin, ngunit ang “Pumunta ka” ay mas karaniwan sa modernong Filipino kaysa “Humayo ka,” nang hindi ibinababa ang rehistro. Maaaring liwanagin din ang talababa upang hindi magmukhang ang pagbawi mula sa sakit at ang kamatayan ay lohikal na magkasalungat sa lahat ng pakahulugan; ang problema ay ang tensiyon ng literal na negatibong Hebreo sa konteksto at sa kasunod na pahayag.
  terminology: Wasto ang “Eliseo” bilang karaniwang Filipino na anyo ng pangalan at ang “Yahweh” bilang rendering ng banal na pangalan. Ang “gagaling” ay angkop sa konteksto ng karamdaman.
