revisions:
- from: Kaya bumalik si Haring Joram sa Jezreel upang magpagaling sa mga sugat na natamo niya mula sa mga Arameo sa Rama, nang makipaglaban siya kay Hazael na hari ng Aram. At pumunta roon si Ahazias na anak ni Jehoram, hari ng Juda, upang dalawin si Joram na anak ni Ahab sa Jezreel, sapagkat siya ay may sakit.
  to: Kaya bumalik si Haring Joram sa Jezreel upang magpagaling mula sa mga sugat na natamo niya mula sa mga Arameo sa Rama, nang makipaglaban siya kay Hazael na hari ng Aram. At bumaba si Ahazias na anak ni Jehoram, hari ng Juda, upang dalawin si Joram na anak ni Ahab sa Jezreel, sapagkat siya ay may sakit.
  rationale: Nilinaw ang layunin ng pagbabalik ni Joram bilang kanyang paggaling mula sa mga sugat at ibinalik ang direksiyonal na pandiwang “bumaba.” Walang footnote ang kailangan, sapagkat ang kontekstuwal na “dalawin” ay malinaw at hindi nagdadagdag ng doktrinal o historikal na pagpapakahulugan.
