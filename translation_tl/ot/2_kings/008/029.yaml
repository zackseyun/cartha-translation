base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: tl
  text: Kaya bumalik si Haring Joram sa Jezreel upang magpagaling mula sa mga sugat na natamo niya mula sa mga Arameo sa Rama, nang makipaglaban siya kay Hazael na hari ng Aram. At bumaba si Ahazias na anak ni Jehoram, hari ng Juda, upang dalawin si Joram na anak ni Ahab sa Jezreel, sapagkat siya ay may sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Likas na ipinahahayag ng pandiwang שׁוב sa salaysay ang pagbabalik ni Joram sa Jezreel pagkatapos ng labanan.
- source_word: לְהִתְרַפֵּא
  choice: upang magpagaling
  rationale: Ipinahihiwatig ng hitpael ng רפא ang pagpapagaling o paggaling; ang “magpagaling” ay natural sa Filipino at hindi nangangahulugang siya mismo ang gumamot sa sarili.
- source_word: מִן הַמַּכִּים
  choice: sa mga sugat
  rationale: Bagaman literal na tumutukoy sa mga hampas, sa kontekstong militar at medikal ay ang mga sugat na bunga ng mga iyon ang tinutukoy.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: na natamo niya mula sa mga Arameo
  rationale: Natural nitong ipinakikita na ang mga Arameo ang sanhi ng kanyang mga sugat, nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: בָּרָמָה
  choice: sa Rama
  rationale: Ang pang-ukol na בְּ ay angkop na isalin na “sa” para sa lugar ng labanan.
- source_word: בְּהִלָּחֲמוֹ
  choice: nang makipaglaban siya
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahong o kalagayang pinangyarihan ng pagkasugat.
- source_word: אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: kay Hazael na hari ng Aram
  rationale: Kasama ng pandiwang “makipaglaban,” likas sa Filipino ang “kay”; pinananatili ang sinaunang pangalang Aram.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: At pumunta roon si Ahazias
  rationale: Ang ירד ay literal na “bumaba,” ngunit ang “pumunta roon” ay malinaw at natural sa modernong Filipino; hindi mahalaga sa target na wika ang topograpikong direksiyon upang maunawaan ang kilos.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: upang dalawin si Joram
  rationale: Literal itong “upang makita si Joram,” ngunit sa konteksto ng isang maysakit, ang idiomatikong kahulugan ay pagdalaw.
- source_word: כִּי חֹלֶה הוּא
  choice: sapagkat siya ay may sakit
  rationale: Pinananatili nito ang pahayag tungkol sa kasalukuyang karamdaman ni Joram sa halip na palitan iyon ng “sugatan.”
