translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Arameo” at “Aram” upang tumpak na kumatawan sa sinaunang katawagan, at pinanatili ang pagkakaiba ng Joram at Jehoram ayon sa anyo ng mga pangalan sa talata.
