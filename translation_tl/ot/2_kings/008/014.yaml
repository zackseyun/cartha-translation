  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: tl
  text: At umalis siya kay Eliseo at pumunta sa kanyang amo. Tinanong siya nito, “Ano ang sinabi sa iyo ni Eliseo?” Sumagot siya, “Sinabi niya sa akin, ‘Tiyak na gagaling ka.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “Tiyak na mabubuhay ka.” Sa Hebreo, literal na inuulit ang pandiwa upang magbigay-diin: “mabuhay, mabubuhay ka.” Sa konteksto, tumutukoy ito sa paggaling mula sa karamdaman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: umalis siya sa kinaroroonan ni Eliseo
  rationale: Ipinahahayag ng הלך kasama ng מֵאֵת ang pag-alis mula sa presensiya ni Eliseo. Natural sa modernong Filipino ang “umalis ... sa kinaroroonan” at hindi nito dinaragdagan ang pangyayari.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: pumunta sa kanyang panginoon
  rationale: Ang בוא + אֶל ay kilos patungo sa nakatataas kay Hazael. Ang “panginoon” ay angkop na katawagang pantao sa kontekstong maharlika at malinaw na hindi banal na titulo dahil sa “kanyang.”
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: Ano ang sinabi sa iyo ni Eliseo?
  rationale: Tuwirang katumbas at likas na tanong sa Filipino para sa natapos na pagsasalita.
- source_word: אָמַר לִי
  choice: Sinabi niya sa akin
  rationale: Pinananatili ang payak at tuwirang pormula ng iniulat na pananalita.
- source_word: חָיֹה תִחְיֶה
  choice: Tiyak na gagaling ka
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa katiyakan. Sa konteksto ng karamdaman, natural na ipinahahayag ng “gagaling” ang diwang mabubuhay o makaliligtas sa sakit, habang inilalahad sa talababa ang literal na anyo.
theological_decisions:
- issue: Kahulugan ng אֲדֹנָיו sa kontekstong pantao
  choice: kanyang panginoon
  alternative: kanyang amo
  rationale: Tumutukoy ito sa hari at nakatataas kay Hazael, hindi sa Diyos. Pinananatili ng “panginoon” ang marangal na rehistrong panghukuman nang walang malaking titik na maaaring magpahiwatig ng banal na titulo.
- issue: Pagpapakahulugan sa חָיֹה תִחְיֶה kaugnay ng karamdaman
  choice: Tiyak na gagaling ka
  alternative: Tiyak na mabubuhay ka
  rationale: Ang konteksto ay pagtatanong kung makaliligtas ang hari sa sakit. Ipinahahayag ng pangunahing teksto ang kontekstuwal na kahulugan, ngunit pinananatili ng talababa ang literal na “mabubuhay” at ang pag-uulit na nagbibigay-diin.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “Eliseo,” ang karaniwang anyong Filipino ng pangalan. Inilagay ang panandang [a] kaagad pagkatapos ng pahayag na tinatalakay ng talababa.
