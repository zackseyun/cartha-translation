- from: Kaya umalis siya sa kinaroroonan ni Eliseo at pumunta sa kanyang panginoon. Tinanong siya nito, “Ano ang sinabi sa iyo ni Eliseo?” Sumagot siya, “Sinabi niya sa akin, ‘Tiyak na gagaling ka.’”[a]
  to: At umalis siya kay Eliseo at pumunta sa kanyang amo. Tinanong siya nito, “Ano ang sinabi sa iyo ni Eliseo?” Sumagot siya, “Sinabi niya sa akin, ‘Tiyak na gagaling ka.’”[a]
