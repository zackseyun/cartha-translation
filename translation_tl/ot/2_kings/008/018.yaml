  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: tl
  text: Namuhay siya ayon sa paraan ng mga hari ng Israel, gaya ng ginawa ng sambahayan ni Ahab, sapagkat anak na babae ni Ahab ang kanyang asawa. Ginawa niya ang masama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Namuhay siya ayon sa landasin
  rationale: Ang pagsasama ng הלך at בְּדֶרֶךְ ay isang metapora para sa paraan ng pamumuhay o pagkilos. Inilalahad ng “namuhay ayon sa landasin” ang idyomatikong diwa habang pinananatili ang larawan ng isang landas.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: ng mga hari ng Israel
  rationale: Tuwirang tumutukoy sa mga pinuno ng hilagang kaharian bilang huwaran ng kanyang asal.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: gaya ng ginawa ng sambahayan ni Ahab
  rationale: Ang בֵּית sa kontekstong maharlika ay maaaring tumukoy sa sambahayan o dinastiya. Pinananatili ng “sambahayan” ang talinghagang Hebreo at nauunawaan sa Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Naghaharap ito ng paliwanag o dahilan para sa pagtulad niya sa sambahayan ni Ahab.
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ לְאִשָּׁה
  choice: anak ni Ahab ang kanyang asawa
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na “ang anak na babae ni Ahab ay naging asawa para sa kanya.” Hindi na kailangang tukuyin ang kasarian sa “anak” dahil malinaw na asawa ng lalaking tinutukoy.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Sinasalamin nito ang karaniwang pormulang mapanghatol at ang tiyak na anyo ng הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong larawan para sa pagsusuri ng Diyos, samantalang ang pangalang tipan na יהוה ay isinasalin bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang Tetragrammaton sa talata. Ang “Yahweh” ay tuwirang kumakatawan sa pangalang Hebreo nang hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng pag-aasawa at masamang asal
  choice: Pinanatili ang pangungusap bilang paliwanag sa pagkakatulad niya sa sambahayan ni Ahab
  alternative: Tahasang sabihing ang kanyang asawa ang sanhi o nag-udyok sa kanya
  rationale: Ang כִּי ay nagpapaliwanag, ngunit hindi tahasang inilalarawan ng teksto ang eksaktong paraan o antas ng impluwensiya ng asawa. Iniwasang dagdagan ang sanhi nang lampas sa sinabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “landasin” upang mapanatili ang metapora ng דֶּרֶךְ nang hindi nagiging sobrang literal, at “sambahayan” upang saklawin ang pamilya o dinastiya ni Ahab.
