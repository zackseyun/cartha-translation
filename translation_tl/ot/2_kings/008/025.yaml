  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang likas na pormulang “Nang ikalabindalawang taon ng paghahari” at pinanatili ang pagkakaiba ng Joram at Jehoram ayon sa mga anyong nasa tekstong Hebreo.
