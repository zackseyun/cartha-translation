base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: tl
  text: Nang ikalabindalawang taon ng paghahari ni Joram na anak ni Ahab,[a] hari ng Israel, naging hari si Ahazias na anak ni Jehoram, hari ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Joram” ang anyo ng pangalan ng hari ng Israel, samantalang “Jehoram” naman ang sa hari ng Juda. Magkaugnay na anyo ng iisang pangalan ang mga ito at kung minsan ay kapwa isinasaling “Joram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Nang ikalabindalawang taon ng paghahari
  rationale: Ang Hebreong pormula sa pagtukoy ng taon ng hari ay likas na ipinahahayag sa modernong Tagalog sa ganitong paraan; idinagdag ang “ng paghahari” upang maging malinaw kung anong taon ang binibilang.
- source_word: לְ/יוֹרָם
  choice: ni Joram
  rationale: Sa pormulang ito, tinutukoy ng ל ang hari na ang mga taon ng paghahari ay binibilang.
- source_word: בֶּן אַחְאָב
  choice: na anak ni Ahab
  rationale: Likas na salin ng karaniwang patronimikong parirala sa Tagalog.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng titulong maharlika.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa mga ulat ng pagluklok, karaniwang ipinahihiwatig ng pandiwa ang pagsisimula ng paghahari, hindi lamang ang nagpapatuloy na pamamahala.
- source_word: אֲחַזְיָהוּ
  choice: Ahazias
  rationale: Ginamit ang anyo ng pangalang karaniwan at madaling makilala sa tradisyong Tagalog.
- source_word: בֶן יְהוֹרָם
  choice: na anak ni Jehoram
  rationale: Pinanatili ang mas buong anyo ng pangalang יְהוֹרָם upang maiba ito kay Joram ng Israel, habang ipinapaliwanag sa talababa na magkaugnay ang dalawang anyo.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang salin ng titulong maharlika at pangalan ng kaharian sa karaniwang anyong Tagalog.
