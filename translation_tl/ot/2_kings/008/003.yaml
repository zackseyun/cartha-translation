  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: tl
  text: Nang matapos ang pitong taon, bumalik ang babae mula sa lupain ng mga Filisteo, at pumunta siya sa hari upang idulog[a] ang usapin ng kanyang bahay at bukid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumaing” o “magsumamo.” Sa literal, “sumigaw” o “dumaing nang malakas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: Nang matapos ang pitong taon
  rationale: Likas na salin sa modernong Tagalog ng idyomang tumutukoy sa pagtatapos ng isang takdang panahon.
- source_word: וַתָּשָׁב
  choice: bumalik
  rationale: Tumutukoy sa pagbabalik ng babae mula sa lugar na pansamantala niyang tinirhan.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים
  choice: mula sa lupain ng mga Filisteo
  rationale: Pinananatili ang tahasang anyo ng Hebreo sa halip na gumamit ng heograpikong pangalang Filistia.
- source_word: וַתֵּצֵא
  choice: pumunta siya
  rationale: Sa kontekstong ito, naghuhudyat ito ng sadyang paglapit niya sa hari; mas natural ito sa Tagalog kaysa sa literal na 'lumabas siya.'
- source_word: לִצְעֹק
  choice: upang idulog
  rationale: Sa kontekstong legal at pakiusap para maibalik ang ari-arian, ipinahahayag ng 'idulog' ang paghingi ng katarungan sa hari habang iniiwan sa talababa ang mas literal na diwa ng pagsigaw o pagsusumamo.
- source_word: אֶל־הַמֶּלֶךְ
  choice: sa hari
  rationale: Direktang ipinakikita kung kanino niya iniharap ang kanyang hinaing.
- source_word: בֵּיתָהּ
  choice: kanyang bahay
  rationale: Dahil katambal ng bukid sa usapin ng pagbawi ng ari-arian, ang kongkretong kahulugang 'bahay' ang pinakaangkop.
- source_word: שָׂדָהּ
  choice: bukid
  rationale: Pinananatili ang tiyak na kahulugan ng taniman o lupang sakahan sa halip na ang mas malawak na 'lupain.'
