  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: tl
  text: Lumakad siya sa landas ng angkan ni Ahab at ginawa niya ang masama sa paningin ni Yahweh, gaya ng angkan ni Ahab, sapagkat kaugnay siya ng angkan ni Ahab sa pamamagitan ng pag-aasawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “siya ay manugang ng angkan ni Ahab.” Ang salitang Hebreo ay maaaring tumukoy sa manugang na lalaki o, nang mas malawak, sa isang taong may kaugnayan sa isang angkan sa pamamagitan ng pag-aasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Tinahak niya ang landas
  rationale: Pinananatili nito ang metapora ng Hebreo tungkol sa paraan ng pamumuhay at asal, hindi lamang pisikal na paglalakad.
- source_word: בֵּית אַחְאָב
  choice: angkan ni Ahab
  rationale: Ang בַּיִת na sinusundan ng pangalan ay maaaring tumukoy sa sambahayan, pamilya, o dinastiya. Ang “angkan” ay likas sa modernong Filipino at sapat na malawak upang saklawin ang mga diwang ito.
- source_word: וַיַּעַשׂ הָרַע
  choice: ginawa ang masama
  rationale: Tuwirang inililipat ang karaniwang pormulang moral na ginagamit sa Mga Hari.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma ng pagsusuri sa harap ng Diyos sa paraang malinaw at natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na tahasang nasa tekstong Hebreo.
- source_word: כְּבֵית אַחְאָב
  choice: gaya ng angkan ni Ahab
  rationale: Pinananatili ang tahasang paghahambing sa buong angkan o dinastiya ni Ahab nang hindi ito nililimitahan sa isang tao lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang ugnayang sanhi o paliwanag na ipinapasok ng כִּי.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: may kaugnayan siya sa angkan ni Ahab dahil sa pag-aasawa
  rationale: Maaaring tumukoy ang חֲתַן sa manugang na lalaki, ngunit maaari rin itong magpahayag ng mas malawak na ugnayan sa pamamagitan ng pag-aasawa. Pinananatili ng salin ang leksikal at makasaysayang kalabuan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa Hebreo; ang “Yahweh” ay pinananatili ito sa halip na palitan ng isang titulo.
- issue: Eksaktong ugnayan sa angkan ni Ahab
  choice: may kaugnayan ... dahil sa pag-aasawa
  alternative: manugang na lalaki
  rationale: Hindi sapilitang nilulutas ang lawak ng חֲתַן. Ang konteksto ay nagpapakita ng ugnayang pampamilya sa pamamagitan ng pag-aasawa, ngunit maaaring mas makitid o mas malawak kaysa sa karaniwang kahulugan ng “manugang.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang metapora ng “landas,” ang pormulang “sa paningin ni Yahweh,” at ang paulit-ulit na pagtukoy sa angkan ni Ahab na mahalaga sa diin ng Hebreo.
