translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumaraing” upang mapanatili ang tindi ng paghiling ng katarungan, at ang “dumating naman” upang natural na maipakita ang biglaang pagkakataong minamarkahan ng הִנֵּה. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
