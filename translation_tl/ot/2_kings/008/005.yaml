  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: tl
  text: Habang ikinukuwento ni Gehazi sa hari kung paano binuhay muli ni Eliseo ang patay[a], narito, ang babaeng ang anak nito ay binuhay muli ni Eliseo ay dumaraing sa hari tungkol sa kanyang bahay at bukid. Sinabi ni Gehazi, “Aking panginoong hari, ito po ang babaeng ito[b], at ito ang anak niyang binuhay muli ni Eliseo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kung paano niya ibinalik sa buhay ang patay” o “kung paano niya muling binigyang-buhay ang patay.” Ang pandiwang Hebreo ay nasa causative na anyo at nangangahulugang “magpangyaring mabuhay.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang “narito” ay naghahayag ng biglaan at kapansin-pansing pagkakatapat: ang babaeng tinutukoy sa kuwento ay naroon mismo at dumaraing sa hari.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: Habang isinasalaysay ni Gehazi sa hari
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pagkukuwento, at malinaw sa konteksto na si Gehazi ang tinutukoy ng panghalip.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: kung paano binuhay ni Eliseo ang patay
  rationale: Ang causative na הֶחֱיָה ay natural na naihahayag sa Tagalog bilang “binuhay.” Pinanatili ng “ang patay” ang anyong isahan ng Hebreo nang hindi tahasang nililimitahan sa batang nasa konteksto.
- source_word: וְהִנֵּה
  choice: dumating naman
  rationale: Sa kontekstong ito, ang הִנֵּה ay nagpapatingkad sa biglaan at kapansin-pansing pagsabay ng pagdating ng babae; natural itong naipahahayag ng “dumating naman” sa makabagong salaysay.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: ang babaeng ang anak ay binuhay niya
  rationale: Isinasalin nang natural ang Hebreong konstruksyon at pinananatili ang causative na diwa ng pandiwa.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: Dumaraing ito sa hari
  rationale: Ang צעק ay isang matinding paghingi ng tulong o katarungan. Ang “dumaraing” ay mas angkop kaysa neutral na “nakikiusap” at natural sa dignified na Tagalog.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: tungkol sa bahay at bukid niya
  rationale: Ang עַל ay tumutukoy sa usapin ng kanyang daing, at ang שָׂדֶה ay mas tiyak na “bukid” kaysa pangkalahatang “lupain.”
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mahal na hari
  rationale: Isang magalang na tawag sa hari na natural sa kasalukuyang Tagalog. Hindi ito gumagamit ng “Panginoon,” na maaaring magbigay ng hindi kailangang teolohikal na dating.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: siya po ang babaeng iyon, at ito ang anak niya
  rationale: Ang mga demonstrative ay tuwirang kumikilala sa dalawang taong naroroon; ipinahahayag ng “po” ang paggalang na likas sa pakikipag-usap sa hari.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: binuhay ni Eliseo
  rationale: Pare-parehong isinalin ang tatlong paglitaw ng causative na הֶחֱיָה bilang “binuhay,” habang tahasang pinangalanan si Eliseo kung saan gayon ang Hebreo.
