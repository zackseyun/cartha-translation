id: 2KI.8.16
reference: 2 Kings 8:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: tl
  text: At noong ikalimang taon ni Joram na anak ni Ahab, na hari ng Israel, habang si Jehoshafat ang hari ng Juda[a], naging hari ng Juda si Jehoram[b] na anak ni Jehoshafat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at si Jehoshafat na hari ng Juda.” Siksik ang pagkakabuo ng parirala sa Hebreo; nauunawaan ito ng ilan bilang pahiwatig ng isang panahong magkasabay ang kanilang paghahari.'
    reason: alternative_reading
  - marker: b
    text: 'Magkaiba ang anyo ng dalawang pangalan sa Hebreo: “Joram” ang hari ng Israel, samantalang “Jehoram” ang anak ni Jehoshafat at hari ng Juda, bagaman magkaugnay ang mga anyong ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: At noong ikalimang taon
  rationale: Ipinananatili ng “At” ang ugnayan sa naunang salaysay, at likas sa Filipino ang ordinal na “ikalimang” sa pormulang tumutukoy sa taon ng paghahari.
- source_word: לְ/יוֹרָם
  choice: ni Joram
  rationale: Ang לְ ay tumutukoy sa taon na binibilang ayon sa paghahari ni Joram; malinaw at natural itong ipinahahayag ng “ni” sa Filipino.
- source_word: בֶּן אַחְאָב
  choice: na anak ni Ahab
  rationale: Tuwirang pinananatili ang patronimiko para sa malinaw na pagkakakilanlan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: na hari ng Israel
  rationale: Karaniwang salin ng titulong maharlika at malinaw na tumutukoy kay Joram.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: habang si Jehoshafat ang hari ng Juda
  rationale: Ang parirala sa Hebreo ay walang tahasang pandiwa at siksik ang pagkakabuo. Ang “habang” ay natural na naghahayag ng kalagayang temporal nang hindi tahasang nagpapalagay ng pormal na magkasabay na paghahari.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa ganitong ulat ng paghahari, tumutukoy ang pandiwa sa pagluklok o pagsisimula ng paghahari, hindi sa kabuuan ng panahon ng paghahari.
- source_word: יְהוֹרָם
  choice: Jehoram
  rationale: Pinananatili ang pagkakaiba ng anyong יְהוֹרָם para sa hari ng Juda at יוֹרָם (“Joram”) para sa hari ng Israel.
- source_word: בֶּן יְהוֹשָׁפָט
  choice: na anak ni Jehoshafat
  rationale: Tuwirang pinananatili ang patronimiko para sa historikal na pagkakakilanlan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Isinama ang huling titulo sa pariralang “naging hari ng Juda” upang malinaw at natural na tukuyin ang kahariang pinaghaharian ni Jehoram.
theological_decisions:
- issue: Ang siksik na pahayag tungkol sa paghahari ni Jehoshafat at pagluklok ni Jehoram
  choice: Isinalin ang pariralang walang pandiwa bilang “habang si Jehoshafat ang hari ng Juda,” nang hindi nilulutas sa pangunahing teksto ang mas malawak na suliraning kronolohikal.
  alternative: Mas literal na “at si Jehoshafat na hari ng Juda,” o tahasang sabihing magkasabay silang naghari.
  rationale: Hindi tahasang sinasabi ng Hebreo na nagkaroon ng pormal na magkasabay na paghahari. Ipinahahayag ng salin ang malamang na temporal na diwa ngunit pinananatili sa talababa ang literal na anyo at ang umiiral na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “noong ikalimang taon” at “naging hari” bilang likas na pormula ng kronolohiya at pagluklok, habang pinanatili ang mga pangalang Joram at Jehoram upang matulungan ang mambabasa na makilala ang dalawang hari.
