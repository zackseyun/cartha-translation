base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: tl
  text: Nang sumunod na araw, kinuha niya ang pantakip na tela[a], inilubog iyon sa tubig, at inilatag sa ibabaw ng mukha niya, at namatay siya.[b] Pagkatapos, si Hazael ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapin sa kama,” “kubrekama,” o “telang hinabi o may lambat.” Bihira ang salitang Hebreo, kaya hindi tiyak ang eksaktong uri ng tela.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang pinangalanan sa Hebreo kung sino ang gumawa ng mga kilos na ito. Batay sa konteksto, nauunawaan ng marami na si Hazael iyon, ngunit “siya” lamang ang tinutukoy ng teksto hanggang pangalanan si Hazael sa huling sugnay.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Nang sumunod na araw
  rationale: Natural na salaysay sa modernong Tagalog at malinaw na tumutukoy sa araw pagkatapos ng naunang pangyayari.
- source_word: הַמַּכְבֵּר
  choice: ang pantakip na tela
  rationale: Bihira ang salitang Hebreo at hindi tiyak ang eksaktong uri ng tela. Ipinapahayag ng 'pantakip na tela' ang gamit nito nang hindi labis na tinutukoy bilang kubrekama o ibang partikular na bagay.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: inilubog iyon sa tubig
  rationale: Tuwirang ipinapahayag ang paglubog o pagsawsaw sa tubig at angkop sa sunod-sunod na kilos.
- source_word: וַיִּפְרֹשׂ עַל פָּנָיו
  choice: inilatag sa mukha niya
  rationale: Ang pandiwa ay tumutukoy sa paglalatag o pag-uunat ng tela sa ibabaw; natural ang 'inilatag sa mukha niya' sa Tagalog.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Pinananatili ang payak na pagsulong ng salaysay sa Hebreo at hindi nagdaragdag ng tahasang ugnayang sanhi na wala sa anyo ng teksto.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: Pagkatapos, si Hazael ang naghari bilang kahalili niya
  rationale: Malinaw na ipinapahayag ang paghalili ni Hazael sa paghahari at pinananatili ang takbo ng salaysay.
theological_decisions:
- issue: Hindi pinangalanang simuno ng mga pandiwang 'kinuha,' 'inilubog,' at 'inilatag'
  choice: Gumamit ng panghalip na 'niya' nang hindi pinapangalanan ang gumagawa sa pangunahing teksto.
  alternative: Tukuyin nang tahasan si Hazael bilang gumawa, o ituring ang gumawa bilang isang di-pinangalanang lingkod.
  rationale: Nakapaloob lamang sa mga pandiwang Hebreo ang simuno at hindi ito pinangalanan hanggang banggitin si Hazael sa huling sugnay. Bagaman karaniwang nauunawaang si Hazael ang gumawa batay sa konteksto, pinananatili ng salin ang kalabuan ng mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang hindi tiyak na uri ng tela at ang hindi pinangalanang gumawa; iniwasan din ang pagdaragdag ng tahasang sanhi sa simpleng 'at namatay siya.'
