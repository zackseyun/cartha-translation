  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: tl
  text: Gayunman, hindi nais ni Yahweh na lipulin ang Juda alang-alang kay David na lingkod niya, gaya ng sinabi niya sa kanya[a] na bibigyan niya siya ng isang ilawan para sa mga anak ni David sa lahat ng panahon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “gaya ng ipinangako niya sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ilawan” ay isang larawang maharlika para sa patuloy na angkan o dinastiya ni David.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Gayunman, hindi niloob
  rationale: Ipinahahayag ng pang-ugnay at ng pandiwa ang pagsalungat sa naunang hatol at ang hindi pagpayag o hindi pagnanais ni Yahweh; natural at marangal sa Filipino ang “hindi niloob.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: na lipulin ang Juda
  rationale: Ang Hiphil ng שׁחת ay tumutukoy sa mapangwasak na hatol; malinaw at sapat ang lakas ng “lipulin” sa kontekstong ito.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: alang-alang kay David na lingkod niya
  rationale: Ipinakikita ng לְמַעַן ang pagsasaalang-alang kay David, at pinananatili ng “lingkod niya” ang mahalagang pagkakakilanlan ni David sa tipan.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: gaya ng sinabi niya sa kanya
  rationale: Pinananatili sa pangunahing teksto ang literal na “sinabi,” habang itinatala sa talababa ang makahulugang alternatibong “ipinangako.”
- source_word: נִיר
  choice: isang ilawan
  rationale: Pinananatili ang kongkretong larawang maharlika na tumutukoy sa pagpapatuloy ng angkan o dinastiya ni David, sa halip na palitan ito ng interpretatibong paraphrase.
- source_word: לְבָנָיו
  choice: para sa kanyang mga anak
  rationale: Malapit ito sa gamit ng pang-ukol sa Hebreo at hindi nito labis na nililinaw kung paano nagpapatuloy ang “ilawan”; sa konteksto, ang mga anak ay mga lalaking tagapagmana ng trono.
- source_word: כָּל־הַיָּמִים
  choice: sa lahat ng panahon
  rationale: Natural itong katumbas sa Filipino ng literal na “lahat ng mga araw” at pinananatili ang diwa ng patuloy na tagal nang hindi tahasang pinapalitan ng abstraktong “magpakailanman.”
theological_decisions:
- issue: Ang larawang dinastiko ng נִיר
  choice: isang ilawan
  alternative: isang liwanag; isang nagpapatuloy na dinastiya
  rationale: Ang “ilawan” ay nagpapanatili sa metapora ng pangakong Davidiko at sa kaugnayan nito sa ibang mga teksto, sa halip na agad ipaliwanag ang larawan bilang dinastiya.
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Ang transliterasyong “Yahweh” ay tuwirang kumakatawan sa personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng אָמַר sa konteksto ng tipan
  choice: sinabi niya sa kanya
  alternative: ipinangako niya sa kanya
  rationale: Bagaman gumaganap bilang pangako ang sinabi, “sinabi” ang tuwirang leksikal na kahulugan at hindi nito binubura ang pagkakaiba ng salita at ng tungkulin nito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayunman” upang maipakita ang pagsalungat sa naunang konteksto, at pinanatili ang metaporang “ilawan” at ang bahagyang kalabuan ng mga panghalip sa Hebreo.
