  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: tl
  text: Noong panahon niya, naghimagsik ang Edom laban sa kapangyarihan ng Juda at nagluklok sila ng sarili nilang hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “naghimagsik ang Edom mula sa ilalim ng kamay ng Juda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Noong panahon niya
  rationale: Likas na modernong Tagalog para sa idyomang tumutukoy sa panahon ng paghahari ng hari.
- source_word: פָּשַׁע
  choice: naghimagsik
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa pag-aalsa o paghihimagsik laban sa naghaharing kapangyarihan, hindi lamang sa moral na pagsalansang.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Karaniwang anyo ng pangalan ng bayan at lupain sa Tagalog na Bibliya.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: laban sa kapangyarihan ng Juda
  rationale: Ipinahahayag nang malinaw at natural ang Hebreong idyoma ng pagkalas mula sa ilalim ng kamay o kontrol ng Juda; pinananatili sa talababa ang literal na larawan.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang Tagalog na anyo ng pangalan ng kaharian at lipi.
- source_word: וַיַּמְלִכוּ
  choice: nagluklok
  rationale: Ang Hiphil ng מלך ay nangangahulugang gawing hari o italaga sa paghahari; ang “nagluklok” ay maikli, natural, at angkop sa maharlikang konteksto.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: sila ng sarili nilang hari
  rationale: Nililinaw na ang mga Edomita ay nagtatag ng sarili nilang hari bilang tanda ng kanilang kasarinlan, habang pinananatili ang di-tiyak na “isang hari” sa likas na ekspresyong Tagalog.
