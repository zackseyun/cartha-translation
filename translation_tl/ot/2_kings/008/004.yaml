base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: tl
  text: Nakikipag-usap noon ang hari kay Gehazi[a], na lingkod ng tao ng Diyos, at sinabi niya, “Pakisalaysay mo sa akin ang lahat ng dakilang bagay na ginawa ni Eliseo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “alalay ng tao ng Diyos” o “binata ng tao ng Diyos”; ang Hebreong נַעַר ay maaaring tumukoy sa isang lingkod, alalay, o binata depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: Nakikipag-usap noon
  rationale: Ang participle ay naglalarawan ng nagpapatuloy at panimulang-tagpong kilos sa nakaraan; likas itong ipinahahayag sa Tagalog sa pamamagitan ng aspektong imperpektibo at ng “noon.”
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Isinalin-titik ang pangalang pantangi ayon sa kinagawiang anyo nito sa Filipino.
- source_word: נַעַר
  choice: lingkod
  rationale: Bagaman maaari itong mangahulugang binata o tagapaglingkod, dito ay inilalarawan nito ang tungkulin ni Gehazi kaugnay ng tao ng Diyos.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Pinananatili ang karaniwang titulong Hebreo nang hindi ito nililimitahan sa mas tiyak na “propeta.”
- source_word: סַפְּרָה נָּא לִי
  choice: Pakisabi sa akin
  rationale: Ipinahahayag ng “paki-” ang magalang na pakiusap ng נָא, habang natural na tinutumbasan ng “sabihin” ang pag-uulat o pagsasalaysay sa kontekstong ito.
- source_word: כָּל הַגְּדֹלוֹת
  choice: lahat ng dakilang bagay
  rationale: Pinananatili ang malawak na substantibong pahayag ng Hebreo, na hindi tahasang nililimitahan sa “mga gawa” o “mga himala.”
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang aspektong kontemplatibo ay likas na tumutukoy sa mga natapos nang ginawa ni Eliseo na hinihiling ngayong isalaysay.
- source_word: וְהַמֶּלֶךְ
  choice: ang hari
  rationale: Hindi dinagdagan ng tahasang “ngayon”; ang waw ay inuunawa bilang pang-ugnay na pampagsasalaysay na hindi kailangang laging ilantad sa natural na Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa titulong אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  alternative: propeta ng Diyos
  rationale: Pinananatili ng “tao ng Diyos” ang mismong titulong Hebreo at iniiwasang gawing mas tiyak ang kahulugan kaysa sa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang estrukturang Hebreo upang maging natural, habang pinananatili ang nagpapatuloy na kilos sa panimulang tagpo at ang magalang na pakiusap ng hari.
