  source_fidelity: 'Tumpak sa pangkalahatan ang mga pangunahing elemento: ang hari, si Gehazi, ang ugnayan niya sa tao ng Diyos, ang magalang na utos na magsalaysay, at ang dakilang mga ginawa ni Eliseo. Gayunman, ang “Sinabi ng hari” ay ginagawang hiwalay at simpleng nakaraang pangyayari ang pananalitang inilalahad ng Hebreong participle na may לֵאמֹר, samantalang ang pagsasalita ng hari ang tagpong inilalarawan. Mas mabuting pag-ugnayin ang kilos at ang tuwirang sinabi niya.'
