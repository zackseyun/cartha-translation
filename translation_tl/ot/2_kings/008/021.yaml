revisions:
- from: Kaya tumawid si Joram patungong Zair[a], kasama ang lahat ng karwahe niya. Pagsapit ng gabi, bumangon siya at sinalakay ang mga Edomitang nakapalibot sa kanya, pati ang mga pinuno ng mga karwahe. Ngunit tumakas ang mga tao pabalik sa kani-kanilang tolda.[b]
  to: Tumawid si Joram patungong Zair[a], kasama ang lahat ng kanyang mga karwahe. Nang gabing iyon, bumangon siya at sinalakay ang mga Edomitang nakapalibot sa kanya, pati ang mga pinuno ng mga karwahe. Ngunit tumakas ang mga tao sa kani-kanilang tolda.[b]
  rationale: Inayos ang mga bahaging may bahagyang dagdag na kahulugan habang pinanatili ang maigsi, marangal, at modernong Tagalog na salaysay. Hindi binago ang pangunahing paghatol sa Zair; ang alternatibong Seir ay nananatili sa talababa. Pinanatili rin ang idyomang “sa kani-kanilang tolda” sa teksto at ipinaliwanag ang kahulugan nito sa talababa.
