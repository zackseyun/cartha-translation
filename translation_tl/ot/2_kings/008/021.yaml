base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: tl
  text: Tumawid si Joram patungong Zair[a], kasama ang lahat ng kanyang mga karwahe. Nang gabing iyon, bumangon siya at sinalakay ang mga Edomitang nakapalibot sa kanya, pati ang mga pinuno ng mga karwahe. Ngunit tumakas ang mga tao sa kani-kanilang tolda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Posible ring “patungong Seir.” Mahirap tiyakin ang Hebreong pangalan ng lugar na צָעִירָה, at itinuturing ito ng ilan na anyong kaugnay ng Seir/Edom sa halip na hiwalay na lugar na Zair.
    reason: alternative_reading
  - marker: b
    text: Ang “tumakas … sa kani-kanilang tolda” ay isang Hebreong idyoma na nangangahulugang nagkawatak-watak sila at nagsiuwi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Karaniwang nangangahulugan ang עבר na dumaan o tumawid. Sa kontekstong militar, pinananatili ng “tumawid” ang larawan ng pagkilos patungo sa isang lugar nang hindi ipinapalagay ang tiyak na ruta.
- source_word: צָעִירָה
  choice: patungong Zair
  rationale: Ayon sa pagbigkas ng Masoretic Text, pinakamainam itong panatilihin bilang pangalan ng lugar. Dahil mahirap ang anyo at maaari ring iugnay sa Seir, inilagay ang alternatibo sa talababa.
- source_word: הָרֶכֶב
  choice: mga karwahe
  rationale: Maaaring tumukoy ang רכב sa buong hukbong gumagamit ng mga karwahe, ngunit ang “mga karwahe” ay malinaw, natural, at malapit sa anyong Hebreo.
- source_word: קָם לַיְלָה
  choice: Pagsapit ng gabi, bumangon siya
  rationale: Ipinahihiwatig ng parirala ang pagkilos sa gabi. Pinananatili ng salin ang pandiwang “bumangon” at ginagawang natural sa modernong Tagalog ang takbo ng pangungusap.
- source_word: וַיַּכֶּה
  choice: sinalakay
  rationale: 'Malawak ang kahulugan ng נכה: hampasin, salakayin, o pabagsakin. Sa labanang ito, natural ang “sinalakay” at hindi nito ipinahihiwatig na lubusang natalo ang Edom.'
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: ang mga Edomitang nakapalibot sa kanya
  rationale: Ang may-pantukoy na participle ay naglalarawan sa Edom bilang nakapalibot kay Joram. Ang “mga Edomita” ay likas na Tagalog para sa mga taong kumakatawan sa bansang Edom sa labanan.
- source_word: שָׂרֵי הָרֶכֶב
  choice: mga pinuno ng mga karwahe
  rationale: Ang שׂרים ay mga pinuno o opisyal. Pinananatili ng salin ang ugnayang construct at ang kahulugang militar nang hindi nagpapakilala ng mas tiyak na ranggo.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: tumakas ang mga tao pabalik sa kani-kanilang tolda
  rationale: Pinananatili nito ang Hebreong larawan at ang mas malawak na salitang העם, habang ipinakikita ng “kani-kanilang” ang distributibong anyo ng pang-isahang hulaping Hebreo.
