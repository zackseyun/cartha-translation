translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang maikling salaysay at militar na larawan ng Hebreo, kasama ang kahirapan sa pangalan ng lugar at ang idyomang “sa kani-kanilang tolda.”
