base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Yoram kasama ng kanyang mga ninuno[a], at inilibing siyang kasama ng kanyang mga ninuno sa Lungsod ni David. At si Ahazias na kanyang anak ang naghari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “humiga kasama ng kanyang mga ama”; isa itong nakaugaliang pormula sa Hebreo para sa pagkamatay ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Ang שׁכב ay literal na ‘humiga’ ngunit bahagi rito ng nakaugaliang pormula sa pagkamatay ng hari. Ang ‘nahimlay’ ay natural at marangal sa Filipino at pinananatili ang eupemistikong larawan nang hindi tahasang pinapalitan ng ‘namatay.’
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Bagaman literal na ‘kasama ng kanyang mga ama,’ ang ‘mga ninuno’ ang likas at malinaw na katumbas sa modernong Filipino para sa dinastikong pormulang tumutukoy sa mga naunang salinlahi.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Ang Niphal ay may diwang pasibo. Mas natural sa Filipino ang ‘inilibing siya’ kaysa ‘siya ay inilibing,’ habang pinananatili ang kahulugan.
- source_word: בְּעִיר דָּוִד
  choice: sa Lungsod ni David
  rationale: Itinuturing itong kinikilalang pangalan ng lugar, kaya ginamit ang nakasanayang ‘Lungsod ni David.’
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Tuwirang ipinapahayag ng מלך ang paghahari sa pormula ng paghalili; hindi kailangang dagdagan ng aspektong ‘nagsimulang.’
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa konteksto ng paghalili sa trono, malinaw at natural na ipinahihiwatig nito ang paghahari sa lugar ng naunang hari.
- source_word: יוֹרָם
  choice: Yoram
  rationale: Sinusunod ang anyong Hebreo na Yoram sa halip na ang tradisyonal ngunit pinalawak na anyong Jehoram.
- source_word: אֲחַזְיָהוּ
  choice: Ahazias
  rationale: Ang ‘Ahazias’ ang nakikilalang anyo ng pangalan sa tradisyong salin sa Filipino at malinaw na kumakatawan sa pangalang Hebreo.
theological_decisions:
- issue: Kahulugan ng pormulang שׁכב עם אבתיו
  choice: Pinanatili bilang larawang ‘nahimlay kasama ng kanyang mga ninuno.’
  alternative: Tahasang isalin na ‘namatay,’ o literal na ‘natulog kasama ng kanyang mga ama.’
  rationale: Hindi tinutukoy ng talata ang isang partikular na doktrina tungkol sa kalagayan pagkatapos ng kamatayan. Pinananatili ng salin ang nakaugaliang pormula sa pagkamatay nang hindi nagdaragdag ng teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘nahimlay’ upang mapanatili ang pormulang Hebreo nang hindi maging kasing-ilang ng literal na ‘humiga.’ Ginamit ang ‘mga ninuno’ sa halip na ‘mga ama’ para sa likas na Filipino at upang maiwasan ang maling pagkaunawang mga agarang ama lamang ang tinutukoy.
