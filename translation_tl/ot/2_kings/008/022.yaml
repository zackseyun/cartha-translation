- from: Kaya naghimagsik ang Edom at kumawala sa kapangyarihan ng Juda hanggang sa araw na ito.[a] Nang panahong iyon, naghimagsik din ang Libna.
  to: Naghimagsik ang Edom at kumawala sa kapangyarihan ng Juda hanggang sa araw na ito.[a] Noon, naghimagsik din ang Libna nang panahong iyon.
