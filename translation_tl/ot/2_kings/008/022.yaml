  naturalness: Malinaw at marangal ang Tagalog. Ang “Naghimagsik ang Edom at kumawala sa kapangyarihan ng Juda” ay likas at angkop sa kontekstong pampolitika. Ang “Noon” sa ikalawang pangungusap ay natural na katumbas ng “Then,” habang ang “nang panahong iyon” ay nagsasalin sa kasunod na pantukoy sa panahon.
  terminology: Ang “naghimagsik” ay angkop para sa פשע sa kontekstong ito. Ang “kumawala sa kapangyarihan ng Juda” ay malinaw na pagsasalin ng idyomang “mula sa ilalim ng kamay ng Juda.” Ang “tumiwalag” sa talababa ay maaaring magpahiwatig ng pagtalikod na panrelihiyon at hindi kasinglinaw na pampolitika; mas mabuting gamitin ang “kumawala” o “humimagsik.” Ang mga pangalang Edom, Juda, at Libna ay angkop.
