  register: 'Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang optimal equivalence: pinanatili ang pampolitikang diwa ng Hebreo, ngunit isinalin ang idyomang “sa ilalim ng kamay” bilang natural na “sa kapangyarihan.”'
