  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: tl
  text: Naghimagsik ang Edom at kumawala sa kapangyarihan ng Juda hanggang sa araw na ito.[a] Noon, naghimagsik din ang Libna nang panahong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-alsa” o “kumawala.” Ang pandiwang Hebreo ay tumutukoy rito sa pampolitikang paghihimagsik laban sa namumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  choice: naghimagsik
  rationale: Sa kontekstong pampolitika, ang פשע ay tumutukoy sa paghihimagsik laban sa umiiral na pamamahala. Likas at malinaw sa modernong Tagalog ang “naghimagsik.”
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: kumawala sa kapangyarihan ng Juda
  rationale: Ang literal na “mula sa ilalim ng kamay ng Juda” ay idyomang Hebreo para sa paglaya mula sa pagkasakop o pamamahala. Inihahayag ng salin ang kahulugan sa natural na Tagalog habang pinananatili ang ideya ng pagkalas.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang pormulang Hebreo ito na nagsasaad na nagpatuloy ang kalagayan hanggang sa panahon ng tagapagsalaysay.
- source_word: אָז ... בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Magkasamang inilalagay ng mga pariralang ito ang paghihimagsik ng Libna sa parehong panahong tinutukoy. Pinagsama ang diwa upang maging natural at maiwasan ang paulit-ulit na “noon ... nang panahong iyon.”
- source_word: לִבְנָה
  choice: Libna
  rationale: Isinalin sa karaniwang anyong Tagalog ng pangalan ng lugar, alinsunod sa bigkas ng Hebreo.
