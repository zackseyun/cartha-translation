  to: Kaya nagpunta si Hazael upang salubungin siya at nagdala siya ng regalo sa kanyang kamay, pati lahat ng pinakamainam mula sa Damasco—isang kargang para sa apatnapung kamelyo. Dumating siya, tumayo sa harap ni Eliseo, at sinabi niya, “Isinugo ako sa iyo ng iyong anak[a] na si Ben-hadad, hari ng Aram, upang itanong, ‘Gagaling ba ako sa sakit na ito?’[b]”
  rationale: Ibinalik ang “sa kanyang kamay” para sa בְּיָדוֹ at pinalitan ang “Ipinasasabi sa iyo” ng “Isinugo ako sa iyo ... upang itanong” upang maipahayag ang pagpapadala kay Hazael at ang pormulang לֵאמֹר. Inayos din ang talababa b sa karaniwang anyong Filipino ng panipi.
