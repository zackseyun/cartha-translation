source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: tl
  text: Kaya nagpunta si Hazael upang salubungin siya at nagdala siya ng regalo sa kanyang kamay, pati lahat ng pinakamainam mula sa Damasco—isang kargang para sa apatnapung kamelyo. Dumating siya, tumayo sa harap ni Eliseo, at sinabi niya, “Isinugo ako sa iyo ng iyong anak[a] na si Ben-hadad, hari ng Aram, upang itanong, ‘Gagaling ba ako sa sakit na ito?’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “iyong anak” ay magalang na pananalita ng pagpapakumbaba sa isang iginagalang na nakatataas; hindi nito kinakailangang sabihing literal siyang anak.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “Mabubuhay ba ako mula sa sakit na ito?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: pinuntahan siya
  rationale: Ipinahahayag ng parirala ang pagpunta upang salubungin o makipagkita kay Eliseo; natural sa konteksto ang “pinuntahan siya.”
- source_word: מִנְחָה
  choice: isang regalo
  rationale: Sa diplomatikong tagpong ito, tumutukoy ito sa handog na regalo sa isang iginagalang na propeta, hindi sa rituwal na alay o sapilitang tributo.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: pati ng lahat ng pinakamainam na kalakal ng Damasco
  rationale: Ang טוּב ay tumutukoy rito sa mahuhusay o piling produkto ng Damasco. Nililinaw ng “kalakal” na mga bagay na dala ang tinutukoy, habang pinananatili ng “lahat ng pinakamainam” ang diin sa kalidad at kasaganaan.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: kargang sapat para sa apatnapung kamelyo
  rationale: Ipinahahayag nito ang dami ng mga kalakal bilang kargang kayang ipasan sa apatnapung kamelyo, nang hindi ipinapalagay na bawat kamelyo ay may iisang partikular na uri ng karga.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: tumayo sa harap ni Eliseo
  rationale: Pinananatili nito ang pormal na tindig sa harap ng propeta; ginamit ang pangalan upang maging malinaw ang tinutukoy na panghalip sa Tagalog.
- source_word: בִּנְךָ
  choice: iyong anak
  rationale: Pinananatili ang literal na metaporang pampitagan sa Hebreo sa halip na gawing “lingkod”; ipinaliliwanag sa talababa ang gamit nito.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: Ipinasasabi sa iyo
  rationale: Natural na Filipino ito para sa pagpapadala ng mensahero na may tiyak na tanong, at pinagsasama nito nang malinaw ang commissioning at speech formula.
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: Gagaling ba ako sa sakit na ito?
  rationale: Bagaman literal na “mabubuhay ba ako mula sa sakit na ito,” idiomatikong tinatanong sa konteksto kung siya ay gagaling. Nasa talababa ang mas literal na posibilidad.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang sinaunang pangalang heograpiko at pampolitika sa halip na palitan ng mas huling katawagang “Siria.”
theological_decisions:
- issue: Kahulugan ng “iyong anak” bilang pagtukoy ni Ben-hadad sa sarili
  choice: Pinanatili sa pangunahing teksto ang “iyong anak.”
  alternative: “iyong lingkod”
  rationale: Ang Hebreo ay tahasang “iyong anak,” ngunit maaari itong maging magalang na pormula ng pagpapakumbaba at hindi pahayag ng literal na pagiging anak. Hindi dapat palitan ang metapora nang walang paliwanag.
- issue: Tanong kung mabubuhay o gagaling ang hari
  choice: “Gagaling ba ako” sa pangunahing teksto, na may literal na alternatibo sa talababa.
  alternative: “Mabubuhay ba ako mula sa sakit na ito?”
  rationale: Sa konteksto ng karamdaman, ang “mabuhay mula sa” ay tumutukoy sa paggaling o pagkaligtas, ngunit ang literal na anyo ay maaaring magpahiwatig din ng buhay laban sa kamatayan; pinananatili ng talababa ang tensiyong iyon.
translation_notes:
  register: Makabago at marangal na Filipino na angkop sa salaysay. Ginamit ang “kalakal” upang maging kongkreto ang mga piling bagay mula sa Damasco, at ang “kargang sapat para” upang natural na maipahayag ang dami. Inilagay ang mga marker [a] at [b] kaagad sa mga pahayag na ipinapaliwanag ng mga talababa.
