    rationale: Bagaman ipinahihiwatig ng konteksto na si Hazael ang kaharap, hindi siya ipinapangalan o minamarkahan bilang layon sa pariralang Hebreo. Ang pag-aalis nito ay mas tapat at mas mahusay na nag-iingat sa kalabuan ng talata.
  - severity: medium
