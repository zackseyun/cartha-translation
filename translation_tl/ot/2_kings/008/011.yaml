  source_fidelity: Kailangang alisin ang tahasang “sa kanya,” sapagkat walang hayagang layong “sa kanya” sa Hebreo at ang dagdag na ito ay labis na nagtuturo sa pagkakakilanlan ng pinagtuunan. Ang “lingkod ng Diyos” ay mas malawak na katawagan at hindi tapat na katumbas ng אִישׁ הָאֱלֹהִים (“tao ng Diyos”). Ang inamyendahang teksto ay pinananatili ang di-tiyak na paksa ng “mapahiya.”
  naturalness: Natural at marangal sa modernong Filipino ang “Matagal niyang itinitig ang tingin niya hanggang sa mapahiya.” Mas iwas ito sa paulit-ulit at hindi likas na “Itinitig niya ang kanyang tingin sa kanya at matagal siyang tinitigan.”
  terminology: Gamitin ang “tao ng Diyos” para sa אִישׁ הָאֱלֹהִים. Ito ang tuwirang at matatag na katumbas ng pamagat sa tekstong Hebreo; ang “lingkod ng Diyos” ay interpretibong pagpapalit.
