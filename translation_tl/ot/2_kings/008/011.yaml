translation:
  language: tl
  text: Matagal niyang itinitig ang tingin niya hanggang sa mapahiya[a], at umiyak ang tao ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa mapahiya si Hazael.” Hindi tahasang tinutukoy ng Hebreo kung sino ang napahiya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: Itinitig niya ang kanyang tingin sa kanya
  rationale: Ang Hiphil ng עמד na may 'mukha' bilang layon ay nagsasaad ng pagpirmi o pagtitig. Ang 'itinitig ang tingin' ay natural sa modernong Tagalog at naihahatid ang Hebreong larawan nang hindi ginagamit ang di-likas na 'pinatayo ang mukha.' Idinagdag ang 'sa kanya' ayon sa ugnayang malinaw sa tagpo.
- source_word: וַיָּשֶׂם
  choice: matagal siyang tinitigan
  rationale: Ang שׂים ay literal na 'ilagay/ituon,' ngunit sa pagkakasunod nito sa pagpirmi ng mukha ay nagpapatuloy ito sa ideya ng matinding pagtitig. Ang 'matagal' ay inuugnay sa kasunod na עַד at ginagawang malinaw at natural ang kilos sa Tagalog.
- source_word: עַד־בֹּשׁ
  choice: hanggang sa mapahiya siya
  rationale: Ang בוש ay tumutukoy sa pagkapahiya o pagkalito dahil sa hiya. Pinananatili ng panghalip na 'siya' ang hindi tiyak na paksa ng Hebreo sa halip na pangalanan si Hazael o Eliseo.
- source_word: וַיֵּבְךְּ
  choice: umiyak
  rationale: Tuwirang katumbas ng בכה at angkop sa marangal ngunit karaniwang modernong Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Ang literal na 'lalaki ng Diyos' ay maaaring maging di-likas o malabo sa modernong Tagalog. Ang 'lingkod ng Diyos' ay isang nakaugaliang titulong biblikal para sa propeta at hindi lamang pangkalahatang paglalarawan.
theological_decisions:
- issue: Hindi tiyak kung sino ang nakaranas ng hiya sa עַד־בֹּשׁ
  choice: Pinanatili ang 'hanggang sa mapahiya siya' at nilagyan ng talababa.
  alternative: hanggang sa mapahiya si Hazael
  rationale: Hindi tahasang tinutukoy ng anyong Hebreo ang paksa ng בוש, at maaaring iugnay ito kay Hazael o sa naunang paksa. Hindi dapat lutasin ng salin ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang natural na idyoma ng pagtitig; pinanatili sa panghalip at talababa ang sintaktikong kalabuan ng Hebreo.
