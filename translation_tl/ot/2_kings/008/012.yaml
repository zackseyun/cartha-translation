  to: 'Sinabi ni Hazael, “Bakit po umiiyak ang aking panginoon?” Sumagot siya, “Dahil alam ko ang kasamaang gagawin mo sa mga anak ng Israel[a]: susunugin mo ang kanilang mga tanggulan[b], papatayin mo sa tabak ang kanilang mga binata, dudurugin mo ang kanilang maliliit na anak, at bibiyakin mo ang kanilang mga buntis na babae.”'
