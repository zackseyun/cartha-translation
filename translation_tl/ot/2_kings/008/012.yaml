source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: tl
  text: 'Sinabi ni Hazael, “Bakit po umiiyak ang aking panginoon?” Sumagot siya, “Dahil alam ko ang kasamaang gagawin mo sa mga anak ng Israel[a]: susunugin mo ang kanilang mga tanggulan[b], papatayin mo sa tabak ang kanilang mga binata, dudurugin mo ang kanilang maliliit na anak, at bibiyakin mo ang kanilang mga buntis na babae.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa sambayanan ng Israel” o “sa mga Israelita.” Sa Hebreo, “sa mga anak ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ipapadala mo sa apoy ang kanilang mga tanggulan.” Maaari ring isalin na “tutupukin mo ang kanilang mga muog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Isang magalang na pantawag ito kay Eliseo, hindi banal na titulo. Pinananatili ng “aking panginoon” ang paggalang at ugnayang ipinahihiwatig ng Hebreo; ginamit ang maliit na titik upang hindi ito mapagkamalang pagtukoy sa Diyos.
- source_word: בֹכֶה
  choice: umiiyak
  rationale: Likas at kasalukuyang salitang Filipino ito para sa nagpapatuloy na pag-iyak na ipinahihiwatig ng participle.
- source_word: כִּי יָדַעְתִּי
  choice: Dahil alam ko
  rationale: 'Ipinakikilala ng כִּי ang dahilan ng pag-iyak, at ang perfect na יָדַעְתִּי ay may kasalukuyang kabuluhan: “alam ko.”'
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: ang kasamaang gagawin mo
  rationale: Iniuugnay ang רָעָה sa relative clause upang maging malinaw at natural sa Filipino habang pinananatili ang moral na bigat ng “kasamaan.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ng Israel
  rationale: Pinananatili ang pormal na idyomang Hebreo. Sa konteksto, tumutukoy ito sa sambayanan ng Israel bilang isang kabuuan.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: susunugin mo ang kanilang mga tanggulan
  rationale: Natural na katumbas sa Filipino ng literal na “ipapadala mo sa apoy ang kanilang mga tanggulan”; malinaw na naipapahayag ang pagkawasak sa pamamagitan ng apoy.
- source_word: וּבַחֻרֵיהֶם
  choice: ang kanilang mga binata
  rationale: Ang pangngalan ay tumutukoy sa mga kabataang lalaking nasa kasibulan, kadalasa’y angkop sa pakikidigma. Ang “mga binata” ang tuwiran at natural na katumbas.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: papatayin mo sa tabak
  rationale: Pinananatili ang tuwirang karahasan at ang tabak bilang kasangkapan, nang walang pagpapalambot.
- source_word: עֹלְלֵיהֶם
  choice: kanilang maliliit na anak
  rationale: Tumutukoy ang salita sa maliliit na bata o paslit; hindi ito labis na nililimitahan sa mga bagong silang lamang.
- source_word: תְּרַטֵּשׁ
  choice: dudurugin mo
  rationale: Ipinahahayag ang marahas na pagwasak o pagdurog nang hindi nagdaragdag ng bagay o lugar na paghahampasan na wala sa Hebreo.
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: lalaslasin mo ang tiyan ng kanilang mga buntis na babae
  rationale: Natural ngunit tahasang Filipino para sa marahas na pagbiyak sa mga babaeng nagdadalang-tao. Ang pagbanggit sa tiyan ay ginagawang idiomatiko ang kilos sa Filipino nang pinananatili ang kakila-kilabot na diwa.
theological_decisions:
- issue: Pagpapakahulugan sa לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  alternative: sambayanan ng Israel / mga Israelita
  rationale: Pinananatili ang kongkretong idyomang Hebreo habang ipinapaliwanag sa talababa na korporatibo ang saklaw nito, sa halip na tahimik na gawing neutral ang anyo.
- issue: Tahasan at marahas na pananalita ng propesiya
  choice: Tuwirang isinalin ang mga kalupitang binanggit
  alternative: Palambutin bilang “sasaktan” o “sasalakayin”
  rationale: Sadyang mabigat at graphic ang Hebreo. Kailangang mapanatili ang moral na tindi at pagkabigla ng pahayag, hindi pagaanin ang mga ito.
- issue: Ang nagsasalita ay may kaalaman sa hinaharap na kasamaan ni Hazael
  choice: “alam ko ang kasamaang gagawin mo”
  alternative: “alam ko ang kapahamakang idudulot mo”
  rationale: Hindi nilulutas kung paano nalaman ng nagsasalita ang hinaharap; pinananatili lamang ang tahasang pahayag at ang moral na kulay ng רָעָה.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “po” upang likas na maipakita ang paggalang ni Hazael kay Eliseo, samantalang pinanatili ang “aking panginoon” bilang katumbas ng titulong panlipunan. Hindi pinalambot ang karahasan ng talata. Itinama ang pagkakalagay ng mga talababa upang ang [a] ay tumukoy sa “mga anak ng Israel” at ang [b] sa “mga tanggulan.”
