base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: tl
  text: Noong ikalabinlimang taon ng paghahari ni Amasias, na anak ni Joas at hari ng Juda, naging hari sa Samaria si Jeroboam, na anak ni Joas at hari ng Israel; naghari siya nang apatnapu't isang taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה לַאֲמַצְיָהוּ
  choice: Nang ikalabinlimang taon ng paghahari ni Amasias
  rationale: Ang pormulang Hebreo ay tumutukoy sa ikalabinlimang taon ng paghahari ni Amasias, hindi sa tagal na labinlimang taon. Idinagdag ang “ng paghahari” upang maging malinaw at likas sa Filipino.
- source_word: בֶן יוֹאָשׁ
  choice: anak ni Joas
  rationale: Tuwirang salin ng patronimikong parirala; ginamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang ipinakikilala ang katungkulan at kaharian ni Amasias.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormula ng pagluklok, ang pandiwa ay nagpapahiwatig ng pagsisimula ng paghahari, na ibinubukod sa kasunod na pahayag tungkol sa haba nito.
- source_word: יָרָבְעָם
  choice: Jeroboam
  rationale: Ginamit ang karaniwang anyo ng pangalan sa modernong Bibliyang Filipino.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang ipinakikilala ang katungkulan at kaharian ni Jeroboam.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang ב ay lokatibo at itinuturo ang kabiserang lungsod na kinaroroonan ng paghahari.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: apatnapu't isang taon
  rationale: Likas na makabagong Filipino para sa bilang at tagal ng paghahari.
