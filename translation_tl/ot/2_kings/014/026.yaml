base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: tl
  text: Sapagkat nakita ni Yahweh na napakatindi[a] ang paghihirap ng Israel, at walang bihag o malaya[b], at walang tumutulong sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napakapait” o “napakabigat.” Mahirap tiyakin ang eksaktong kahulugan ng pariralang Hebreo, ngunit malinaw na idinidiin nito ang tindi ng paghihirap ng Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Idyomang Hebreo: “bihag o malaya.” Maaaring ang ibig sabihin ay wala nang sinumang natitira, anuman ang kalagayan niya, o lubusan nang nawalan ng kakayahang tumulong ang lahat.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo at ang kaugnayan nito sa tipan.
- source_word: עֳנִי
  choice: paghihirap
  rationale: Likas at malawak na salitang Filipino para sa kalagayan ng pagdurusa o matinding kagipitan ng buong Israel, nang hindi nililimitahan ito sa kahirapang pangkabuhayan.
- source_word: מֹרֶה מְאֹד
  choice: napakatindi
  rationale: Ipinahahayag ang malinaw na pagpapasidhi sa paghihirap ng Israel habang iniiwasang magkunwaring tiyak ang eksaktong kahulugan ng mahirap na anyong Hebreo; inilalahad sa talababa ang ibang posibilidad.
- source_word: אֶפֶס
  choice: wala nang
  rationale: Ipinakikita ang ganap na kawalan na ipinahihiwatig ng idyomatikong pag-uulit sa Hebreo at ang sukdulang kalagayan ng Israel.
- source_word: עָצוּר
  choice: bihag
  rationale: Malapit sa diwa ng taong pinipigil, iginagapos, o ikinukulong, at bumubuo ng sadyang maigsi ngunit mahirap na pares sa kasunod na salita.
- source_word: עָזוּב
  choice: malaya
  rationale: Ginagamit bilang katapat ng 'bihag' sa tradisyonal na pagkaunawa sa pares, ngunit hindi itinatago sa talababa na maaaring iba ang tiyak na diwa ng idyoma.
- source_word: עֹזֵר
  choice: tumutulong
  rationale: Natural na salin ng Hebreong pandiwaring tumutukoy sa sinumang nagbibigay ng tulong sa Israel; hindi ito pinalalakas tungo sa mas tiyak na 'tagapagligtas.'
theological_decisions:
- issue: Kahulugan ng mahirap na pariralang מֹרֶה מְאֹד
  choice: napakatindi ng paghihirap
  alternative: napakapait o napakabigat ng paghihirap
  rationale: Malinaw sa konteksto na pinasisidhi ng parirala ang pagdurusa ng Israel, ngunit hindi ganap na tiyak ang eksaktong leksikal na kulay nito. Pinili ang natural na pangunahing teksto at pinanatili sa talababa ang tunay na kawalang-katiyakan.
- issue: Pagpapakahulugan sa idyomang עָצוּר וְעָזוּב
  choice: wala nang bihag o malaya
  alternative: wala nang sinumang natitira; wala nang napipigil o pinakakawalan
  rationale: Pinananatili ng pangunahing teksto ang dalawang magkatapat na katawagan sa Hebreo sa halip na lubusang lutasin ang malabong idyoma. Ipinaliliwanag ng talababa ang malamang na kabuuang diwa nang hindi nag-aangkat ng natatanging doktrinal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang ipakita ang ugnayang nagpapaliwanag sa naunang konteksto. Ang “wala nang bihag o malaya” ay sadyang nagpapanatili sa maigsi at malabong pares ng Hebreo, samantalang nililinaw ng talababa ang posibleng kabuuang diwa.
