base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: tl
  text: Nagbuo sila ng sabwatan laban sa kanya sa Jerusalem, at tumakas siya patungong Lakis. Nagsugo sila upang habulin siya sa Lakis[a], at pinatay nila siya roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nagsugo sila kasunod niya sa Lakis.” Hindi tinutukoy sa Hebreo kung sino ang isinugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: Nagbuo sila ng sabwatan laban sa kanya
  rationale: Ang pandiwa at kaugnay na pangngalan ay isang idyoma para sa pagbuo ng pampolitikang sabwatan. Likas sa modernong Tagalog ang pariralang ito at napananatili ang tahasang pagkalaban sa hari.
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Tuwirang panlunan ang gamit ng pang-ukol at pangalan ng lugar.
- source_word: וַיָּנָס
  choice: tumakas siya
  rationale: Karaniwang kahulugan ng pandiwa ang pagtakas o paglayo upang makaiwas sa panganib.
- source_word: לָכִישָׁה
  choice: patungong Lakis / hanggang Lakis
  rationale: Ipinahihiwatig ng hulaping direksiyonal ang pagkilos tungo sa lungsod. Ginamit ang karaniwang anyong Filipino na “Lakis.”
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: Nagsugo sila upang habulin siya
  rationale: Literal na “nagsugo sila kasunod niya,” ngunit hindi binanggit sa Hebreo kung sino ang isinugo. Ang saling ito ay natural sa Tagalog at malinaw na ipinapahayag ang paghabol nang hindi tahasang nagdaragdag ng “mga tao”; inilagay sa talababa ang mas literal na anyo.
- source_word: וַיְמִתֻהוּ
  choice: pinatay nila siya
  rationale: Ang causative na anyo ng מות ay nangangahulugang sadyang pagpatay. Tuwiran at marangal sa salaysay ang “pinatay nila siya,” at malinaw ang tagaganap.
- source_word: שָׁם
  choice: roon
  rationale: Tumutukoy ang pang-abay na panlunan sa Lakis, na hindi malapit sa nagsasalita.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Pinanatili ang sunod-sunod na mga pangyayari at ang paulit-ulit na pangatnig ng Hebreo sa pamamagitan ng “at,” habang iniwasan ang hindi natural na literalismo sa pariralang וַיִּשְׁלְחוּ אַחֲרָיו.
