base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: tl
  text: Ngunit hindi sinabi ni Yahweh na papawiin niya[a] ang pangalan ng Israel mula sa ilalim ng langit, kaya iniligtas niya sila sa pamamagitan[b] ni Jeroboam na anak ni Joas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “buburahin” o “lubusang aalisin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kamay ni”; isang idyomang nangangahulugang “sa pamamagitan ni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa anyong madaling makilala at naaayon sa patakaran ng proyekto.
- source_word: דִבֶּר
  choice: sinabi
  rationale: Tuwirang katumbas ito ng karaniwang kahulugan ng דבר at hindi nito ginagawang tahasang ‘itinakda’ o ‘ipinasiya’ ang pahayag.
- source_word: לִמְחוֹת
  choice: na papawiin niya
  rationale: Ipinahahayag ng מחה ang lubusang pag-aalis; ang ‘papawiin’ ay likas sa Filipino at angkop sa bagay na ‘pangalan.’
- source_word: שֵׁם יִשְׂרָאֵל
  choice: ang pangalan ng Israel
  rationale: Pinananatili ang Hebreong larawan kung saan ang ‘pangalan’ ay kumakatawan sa patuloy na pag-iral at pagkakakilanlan ng Israel.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: mula sa ilalim ng langit
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang idyoma nang hindi ito agad pinapakahulugang ‘mula sa lupa.’
- source_word: וַיּוֹשִׁיעֵם
  choice: kaya iniligtas niya sila
  rationale: Ang Hifil ng ישע ay nangangahulugang magligtas o magpalaya. Ipinakikita ng ‘kaya’ ang lohikal na ugnayan ng hindi pagpawi at ng sumunod na pagliligtas.
- source_word: בְּיַד
  choice: sa pamamagitan
  rationale: Idyoma ito ng ahensiya o kasangkapan. Natural sa modernong Filipino ang ‘sa pamamagitan’ at malinaw na si Jeroboam ang taong ginamit sa pagliligtas.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Jeroboam na anak ni Joas
  rationale: Ginagamit ang karaniwang anyong Filipino ng mga pangalan at ang natural na pariralang nagpapakilala sa ama.
theological_decisions:
- issue: Layunin at pagkilos ng Diyos sa pagpapanatili sa Israel
  choice: Hindi sinabi ni Yahweh na papawiin niya ang Israel, kaya iniligtas niya sila sa pamamagitan ni Jeroboam.
  alternative: Maaaring pag-ugnayin lamang ang dalawang sugnay sa ‘at,’ nang hindi tahasang ipinakikita ang bunga o lohikal na kaugnayan.
  rationale: Magkasunod sa Hebreo ang hindi pagbanggit ni Yahweh ng pagpawi at ang pagliligtas niya. Ipinahihiwatig ng ‘kaya’ ang daloy ng salaysay ngunit hindi nagdaragdag ng paliwanag tungkol sa pagkatao ni Jeroboam; nananatili ang tensiyong ginamit ng Diyos ang haring ito bilang kasangkapan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawang ‘pangalan ng Israel’ at ‘sa ilalim ng langit,’ ngunit isinalin nang natural ang Hebreong idyoma ng ahensiya na בְּיַד.
