id: 2KI.14.24
reference: 2 Kings 14:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh. Hindi niya tinalikuran ang alinman sa mga kasalanan ni Jeroboam na anak ni Nebat[a], na siyang nag-udyok sa Israel na magkasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga kasalanan ni Jeroboam na anak ni Nebat, na sa pamamagitan ng mga iyon ay inudyukan niya ang Israel na magkasala.” Maaaring iugnay ang sugnay sa Hebreo nang tuwiran kay Jeroboam o sa mga kasalanang ipinakilala niya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas at tuwirang salin ng karaniwang Hebreong pariralang nangangahulugang gumawa ng masama.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma ng pagsusuri ng Diyos at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Hindi niya tinalikuran ang alinman sa mga kasalanan
  rationale: Sa negatibong pangungusap, malinaw na ipinahahayag ng “alinman” ang ganap na hindi pagtalikod sa lahat ng tinutukoy na kasalanan.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang anyong Filipino para sa ugnayang ama at anak sa mga pangalang pantangi.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na siyang nag-udyok sa Israel na magkasala
  rationale: Ipinapakita ng “nag-udyok ... na magkasala” ang causative na diwa ng Hiphil ng חטא. Ang “siyang” ay malinaw na nag-uugnay kay Jeroboam nang hindi nagdaragdag ng sektaryong interpretasyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Tinutukoy ng sugnay na אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Tumutukoy nang tuwiran kay Jeroboam: “na siyang nag-udyok sa Israel na magkasala.”'
  alternative: Maaaring iugnay ang sugnay sa mga kasalanan o gawaing naging paraan upang mahikayat ang Israel na magkasala.
  rationale: Ang pang-isahang pandiwang causative ay may likas na paksang si Jeroboam, ngunit maaaring magmukhang tumutukoy ang relative clause sa naunang “mga kasalanan”; kaya pinananatili sa talababa ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tinalikuran” para sa moral at panrelihiyong paglayo, at “nag-udyok ... na magkasala” upang natural na maipahayag ang causative na pandiwa.
