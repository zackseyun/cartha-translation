source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jeroboam, ang lahat ng ginawa niya, ang kanyang lakas, kung paano siya nakipagdigma, at kung paano niya naibalik ang Damasco at Hamat sa Juda sa Israel[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “sa Juda sa Israel.” Mahirap unawain ang parirala. Maaaring tumukoy ito sa teritoryong naibalik para sa Israel na dating sakop ng Juda, o maaaring pinananatili nito ang isang mas lumang katawagang heopolitikal. Pinananatili ng pangunahing teksto ang pagkakasabi sa Hebreo nang hindi nilulutas ang kalabuan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Karaniwang pormula ito sa mga buod ng paghahari sa Mga Hari. Bagaman literal na “iba pang mga salita/usapin,” ang “mga ginawa” ang malinaw at natural na kahulugan sa kontekstong pangkasaysayan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng ginawa niya
  rationale: Tuwirang salin na pinananatili ang malawak na saklaw ng pandiwang עשה.
- source_word: וּגְבוּרָתוֹ
  choice: ang kanyang lakas
  rationale: Maaaring tumukoy ang גְּבוּרָה sa lakas, tapang, o makapangyarihang mga gawa. Dito, nililinaw ng kasunod na pakikipagdigma na lalo itong tumutukoy sa kakayahang militar.
- source_word: אֲשֶׁר נִלְחָם
  choice: kung paano siya nakipagdigma
  rationale: Natural na Filipino ito at ipinapakita ang paliwanag na kaugnayan ng sugnay sa naunang “lakas.”
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: at kung paano niya naibalik
  rationale: Ang hiphil ng שוב ay nangangahulugang ibalik o panumbalikin; ang “naibalik” ay angkop sa kontekstong teritoryal at pampolitika.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: ang Damasco at Hamat
  rationale: Ginamit ang karaniwang anyong Filipino ng Damasco at malinaw na transliterasyon ng Hamat.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: sa Juda sa Israel
  rationale: Mahirap at siksik ang pariralang Hebreo. Pinananatili ng salin ang pagkakasunod at tunay na kalabuan sa halip na pumili ng isang harmonisadong interpretasyon.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang retorikal na tanong at ang nakaugaliang pormula sa pagtatapos ng ulat ng paghahari.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: sa Aklat ng mga Kasaysayan
  rationale: Natural at dignified na salin ng pamagat ng dokumentong pinagmulan; ipinahihiwatig nito ang talaan ng mga pangyayari nang hindi labis na literal.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Natural na Filipino para sa ugnayang ipinahahayag ng לְ sa loob ng pamagat.
theological_decisions:
- issue: Ang kahulugan ng לִיהוּדָה בְּיִשְׂרָאֵל
  choice: Panatilihin sa pangunahing teksto ang “sa Juda sa Israel.”
  alternative: “para sa Israel ang dating sakop ng Juda” o “sa Israel, na nauukol sa Juda”
  rationale: Hindi tiyak sa Hebreo kung tumutukoy ito sa teritoryong dating pag-aari ng Juda, sa isang lumang pagtukoy na heopolitikal, o sa ibang ugnayan. Hindi nararapat na lutasin ng salin ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormulang pangkasaysayan ng Mga Hari at ang mahirap na heopolitikal na parirala. Inilagay ang talababa sa mismong pariralang nililinaw nito.
