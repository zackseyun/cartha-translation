id: 2KI.14.25
reference: 2 Kings 14:25
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: tl
  text: Ibinalik niya ang hangganan ng Israel mula sa Lebo-hamat[a] hanggang sa Dagat ng Araba[b], ayon sa salita ni Yahweh, ang Diyos ng Israel, na sinabi niya sa pamamagitan ng kanyang lingkod na si Jonas na anak ni Amitai, ang propetang mula sa Gat-hefer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas literal na salin, “pasukan ng Hamat.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ito sa Dagat na Patay.
    reason: geographical_identification
lexical_decisions:
- source_word: הֵשִׁיב
  choice: ibinalik
  rationale: Ang Hiphil ng שׁוב ay tumutukoy rito sa muling pagtatatag ng hangganan ng Israel. Malinaw at likas sa Tagalog ang “ibinalik” nang hindi dinaragdagan ang diwa.
- source_word: גְּבוּל
  choice: hangganan
  rationale: Tumutukoy ang salita sa guhit o saklaw na naghihiwalay sa teritoryo; ang “hangganan” ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: מִלְּבוֹא חֲמָת
  choice: mula sa Lebo-hamat
  rationale: Maaaring ituring ang parirala bilang nakapirming pangalan ng lugar. Pinananatili ang toponimo sa teksto at inilalagay sa talababa ang mas literal na pagbasa.
- source_word: יָם הָעֲרָבָה
  choice: Dagat ng Araba
  rationale: Tuwirang pinananatili ang heograpikong katawagan sa Hebreo sa halip na agad itong tukuyin bilang Dagat na Patay; ang malamang na pagkakakilanlan ay nasa talababa.
- source_word: כִּדְבַר
  choice: ayon sa salita ni
  rationale: Ipinahahayag ng idyoma na ang pangyayari ay naaayon sa naunang pahayag ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Idyoma ito ng pagiging kasangkapan o tagapamagitan. Mas natural sa kasalukuyang Tagalog ang “sa pamamagitan ng” kaysa sa literal na “sa kamay ni.”
- source_word: עַבְדּוֹ
  choice: kanyang lingkod
  rationale: Sa konteksto ng atas sa propeta, malinaw na ipinahahayag ng “lingkod” ang ugnayan at paglilingkod kay Yahweh.
- source_word: הַנָּבִיא
  choice: ang propeta
  rationale: Tuwirang titulong nagpapakilala sa tungkulin ni Jonas.
- source_word: מִגַּת הַחֵפֶר
  choice: mula sa Gat-hefer
  rationale: Ipinahihiwatig ng pang-ukol na מן ang pinagmulan; natural itong isalin na “mula sa.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo.
- issue: Pagkakakilanlan ng יָם הָעֲרָבָה
  choice: Dagat ng Araba
  alternative: Dagat na Patay
  rationale: Pinananatili sa pangunahing teksto ang tunay na anyo ng katawagang Hebreo, habang inilalahad sa talababa ang malamang na modernong pagkakakilanlan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging madaling maunawaan, ngunit pinanatili ang ugnayan ng propesiya, propeta, at katuparan. Ginamit ang mga anyong Tagalog na Lebo-hamat, Araba, Jonas, Amitai, at Gat-hefer.
