  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: tl
  text: Gayunman, hindi inalis ang mga mataas na lugar[a]; patuloy pa ring naghahandog at nagsusunog ng insenso ang mga tao sa mga mataas na lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lokal na dambana.” Ang terminong Hebreo ay tumutukoy sa mga lokal na pook ng pagsamba, na madalas, ngunit hindi palagi, ay nasa mataas na lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Gayunman
  rationale: Ipinakikita rito ang eksepsiyon o limitasyon sa naunang positibong pagtatasa sa hari; natural at malinaw ang adversatibong “Gayunman” sa makabagong Filipino.
- source_word: הַבָּמוֹת
  choice: ang matataas na lugar
  rationale: Ang בָּמוֹת ay mga lokal na pook ng pagsamba, na madalas ngunit hindi laging nasa mataas na lupain. Pinananatili ng salin ang tradisyonal na larawang heograpikal nang hindi agad tinatawag na lehitimo o ilegal ang mga ito.
- source_word: לֹא סָרוּ
  choice: hindi inalis
  rationale: Bagaman maaaring literal na tumukoy ang pandiwa sa hindi pag-alis o hindi paglisan, ang mga sambahang pook ang paksa rito; sa konteksto, ang diwa ay hindi pinawi o ipinatanggal ang mga ito.
- source_word: עוֹד
  choice: patuloy pa ring
  rationale: Ipinahihiwatig nito na nagpatuloy ang nakagawiang gawain ng bayan sa kabila ng naunang pagtatasa.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Natural na katumbas ng kolektibong pangngalan para sa sambayanan o populasyon.
- source_word: מְזַבְּחִים
  choice: naghahandog
  rationale: Ang participle ay nagsasaad ng nagpapatuloy o nakagawiang paghahandog; naipahahayag ito ng “patuloy pa ring naghahandog.”
- source_word: וּמְקַטְּרִים
  choice: at nagsusunog ng insenso
  rationale: Sa kontekstong pangkulto, karaniwang tumutukoy ang קטר sa pagsusunog ng insenso, bagaman maaari rin itong mas malawak na tumukoy sa pagpapausok ng handog.
- source_word: בַּבָּמוֹת
  choice: sa mga lugar na iyon
  rationale: Lokasyon ang ipinahihiwatig ng pang-ukol. Ginamit ang reperensiyal na parirala upang maiwasan ang mabigat na pag-uulit habang malinaw na tumutukoy pa rin sa matataas na lugar.
theological_decisions:
- issue: Pagtatasa sa pagsamba sa matataas na lugar
  choice: Panatilihin sa pangunahing teksto ang deskriptibong katawagang “matataas na lugar.”
  alternative: “mga lokal na dambana” o “mga ipinagbabawal na sambahan”
  rationale: Iniulat ng talata na nanatili ang mga pook at nagpatuloy roon ang paghahandog. Bagaman negatibo ang mas malawak na konteksto, hindi dapat idagdag sa pangunahing teksto ang tahasang hatol na “ipinagbabawal” na wala mismo sa talata.
- issue: Saklaw ng מְקַטְּרִים
  choice: “nagsusunog ng insenso”
  alternative: “nagpapausok ng mga handog”
  rationale: Ang pagsusunog ng insenso ang karaniwang diwa sa ganitong konteksto, ngunit kinikilala sa tala na may mas malawak na posibleng kahulugan ang pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Gayunman” para sa likas na pag-uugnay at ang “patuloy pa ring” upang maipakita ang nakagawiang nagpapatuloy na kilos ng mga participle sa Hebreo.
