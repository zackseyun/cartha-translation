translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahay ni Yahweh” upang mapanatili ang larawang Hebreo, samantalang “palasyo ng hari” ang natural na paglilinaw sa bahay ng hari. Inilagay ang panandang [a] pagkatapos ng “mga bihag,” ang salitang talagang tinutukoy ng talababa.
