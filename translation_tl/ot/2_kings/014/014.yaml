base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: tl
  text: Kinuha niya ang lahat ng ginto at pilak, at ang lahat ng kagamitang nasa bahay ni Yahweh at sa mga kabang-yaman ng palasyo ng hari, pati ang mga bihag[a], at bumalik siya sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “mga anak ng mga panagot” o “mga anak ng mga katiyakan”; malamang na tumutukoy ito sa mga taong kinuha bilang garantiya—samakatuwid, mga bihag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kinuha niya
  rationale: Ipinapahayag ang kasunod na kilos sa salaysay sa natural na nagdaang panahunan sa Tagalog; hindi kailangang ilantad ang panimulang pang-ugnay.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: ang lahat ng ginto at pilak
  rationale: Pinananatili ang kabuuang saklaw ng כָּל habang gumagamit ng likas na parirala sa modernong Tagalog.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: ang lahat ng kagamitang natagpuan
  rationale: Malawak ang kahulugan ng כֵּלִים; ang “kagamitan” ay angkop sa mga bagay na nasa templo at palasyo nang hindi nililimitahan ang uri ng mga ito.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang literal na larawan ng “bahay” sa Hebreo at ang personal na pangalang Yahweh.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: at sa mga ingatang-yaman ng palasyo ng hari
  rationale: Ang אֹצְרוֹת ay mga imbakan ng mahahalagang ari-arian; nililinaw ng “palasyo” ang tinutukoy na bahay ng hari sa natural na Tagalog.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: mga bihag[a]
  rationale: Malamang na tumutukoy ang mahirap na parirala sa mga taong pinanghawakan bilang garantiya. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang leksikal na di-katiyakan.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: at bumalik siya sa Samaria
  rationale: Tumpak at natural na salin ng שוב kasama ang hulaping patungo sa isang lugar.
