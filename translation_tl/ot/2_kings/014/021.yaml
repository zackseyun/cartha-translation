  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֲזַרְיָ֔ה וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣כוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: tl
  text: Pagkatapos, kinuha ng buong bayan ng Juda si Azarias—labing-anim na taong gulang siya—at ginawa siyang hari bilang kahalili ng kanyang amang si Amasias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag ding Uzias si Azarias sa ibang mga talata; Azarias ang mababasa rito sa tekstong Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: kinuha
  rationale: Tuwirang ipinapahayag ang diwa ng לקח na “kumuha,” nang hindi idinaragdag ang ideya ng pormal na pagpili na wala sa teksto.
- source_word: כָּל עַם יְהוּדָה
  choice: buong bayan ng Juda
  rationale: Pinananatili ang hayag na pagtukoy sa lahat ng sambayanan ng Juda at ang kanilang sama-samang pagkilos.
- source_word: עֲזַרְיָה
  choice: Azarias
  rationale: Sinusunod ang pangalang nasa tekstong Hebreo sa talatang ito; ipinaliliwanag sa talababa ang alternatibong pangalang Uzias.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: labing-anim na taong gulang siya
  rationale: Likas at malinaw na modernong Tagalog para sa pahayag tungkol sa edad, habang pinananatili ang paningit na paliwanag.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: ginawa siyang hari
  rationale: 'Tumpak na inilalarawan ang causative na anyo ng מלך: pinaghari nila siya. Hindi nagdaragdag ng koronasyon o proklamasyong hindi binanggit.'
- source_word: תַּחַת אָבִיו
  choice: bilang kahalili ng kanyang ama
  rationale: Ipinahahayag ang paghalili sa trono, hindi lamang ang pagkakasunod sa panahon; natural ito sa modernong Tagalog.
- source_word: אֲמַצְיָהוּ
  choice: Amasias
  rationale: Ginagamit ang karaniwang anyong Tagalog ng pangalang biblikal.
