translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang Hebreong larawan na “sa kanyang kamay,” ngunit ginawang natural ang daloy ng pangungusap. Ginamit ang “pinatay” dahil kamatayan ang malinaw na kinalabasan sa konteksto.
