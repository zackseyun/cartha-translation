  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: tl
  text: Nang matatag na ang kanyang paghahari,[a] pinatay niya ang kanyang mga lingkod na pumatay sa hari na kanyang ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang maging matatag sa kanyang kamay ang kaharian.” Ang Hebreong idyoma ay tumutukoy sa pagiging matatag o napagtibay ng kanyang pamumuno.
    reason: lexical_alternative
  - marker: b
    text: 'Iisang ugat na Hebreo ang ginamit sa ginawa niya at sa ginawa ng mga lingkod: pinatay niya ang mga pumatay sa kanyang ama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang pinagsamang pormulang pasalaysay at pang-ugnay na pamanahon ay likas na naipahahayag sa modernong Tagalog sa pamamagitan ng “Nang,” nang hindi gumagamit ng makalumang “At nangyari.” Hindi ipinipilit ang “kaagad” sapagkat maaaring simpleng “nang” ang temporal na diwa.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: matatag na ang kaharian sa kanyang kamay
  rationale: Pinananatili ang larawan ng Hebreong idyomang “sa kanyang kamay,” habang ipinahihiwatig ng “matatag” na ligtas at ganap na ang kanyang pamamahala.
- source_word: וַיַּךְ
  choice: pinatay niya
  rationale: Sa kontekstong ito, ang נכה ay tumutukoy sa pagpaslang o pagbitay. Mas malinaw at natural sa Tagalog ang “pinatay” kaysa “hinampas,” na maaaring magpahiwatig lamang ng pananakit.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Ang “mga lingkod” ang tuwirang katumbas ng עֲבָדָיו at maaari ring tumukoy sa mga tauhan o opisyal ng hari.
- source_word: הַמַּכִּים
  choice: na pumatay
  rationale: Iisang pandiwang Hebreo ang nasa ginawa ni Amazias at sa naunang ginawa ng mga lingkod. Inuulit ang “pumatay” upang mapanatili ang sadyang pag-uugnay ng dalawang kilos.
- source_word: הַמֶּלֶךְ אָבִיו
  choice: kanyang amang hari
  rationale: Natural at maikli itong Tagalog na nagpapanatili sa pagkakaugnay ng “hari” at “ama” sa Hebreo.
