  register: Modernong Filipino na may marangal ngunit payak na himig. Ginamit ang “nabuhay pa” para sa natural na pahayag ng kronolohiya, at pinanatili ang pagkakaiba ng Joas at Jehoas. Inilagay ang talababa sa hulihan ng buong pangungusap sapagkat ipinaliliwanag nito ang dalawang pangalang lumilitaw sa talata.
