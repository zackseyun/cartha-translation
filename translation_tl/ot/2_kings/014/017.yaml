base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: tl
  text: Nabuhay pa si Amazias na anak ni Joas, hari ng Juda, nang labinlimang taon matapos mamatay si Jehoas na anak ni Jehoahaz, hari ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Joas” at “Jehoas” ay pinananatiling magkaibang anyo sa salin, na tumutugon sa magkaibang baybay sa Hebreo sa talatang ito, upang maibukod ang hari ng Juda sa hari ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: Nabuhay pa
  rationale: Ipinahahayag ng pandiwa ang patuloy na pagkabuhay ni Amazias sa isang tiyak na panahon matapos mamatay ang isa pang hari; natural sa Filipino ang “nabuhay pa” at hindi nito dinaragdagan ang diwang gaya ng maaaring gawin ng “nakaligtas.”
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Karaniwang anyong Filipino ng pangalan sa tradisyong biblikal.
- source_word: בֶן יוֹאָשׁ
  choice: anak ni Joas
  rationale: Tuwirang ipinahahayag ng construct ang ugnayang ama at anak; pinananatili ang mas maikling anyo ng pangalan ayon sa baybay Hebreo sa bahaging ito.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwirang pagtukoy sa katungkulan at kaharian ni Amazias.
- source_word: אַחֲרֵי מוֹת
  choice: pagkamatay ni
  rationale: Natural at maigsi sa modernong Filipino habang pinananatili ang kahulugang temporal ng pariralang Hebreo.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Jehoas na anak ni Jehoahaz
  rationale: Pinananatili ang mas mahabang anyo ng pangalan ng hari ng Israel upang katawanin ang magkaibang baybay Hebreo at malinaw siyang maibukod kay Joas ng Juda.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang pagtukoy sa hari ng hilagang kaharian.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: labinlimang taon
  rationale: Karaniwang salin ng bilang at yunit ng panahong Hebreo.
