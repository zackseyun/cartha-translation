base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jehoash, ang kanyang kapangyarihan, at kung paano siya nakipaglaban kay Amazias[a] na hari ng Juda—hindi ba nakasulat ang mga ito sa Aklat ng mga Salaysay[b] ng mga Hari ng Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakipaglaban laban kay Amazias na hari ng Juda.” Literal na “kasama” ang pang-ukol sa Hebreo, ngunit sa konteksto ng digmaan ay nagpapahiwatig ito ng pakikipaglaban bilang magkalaban.
    reason: lexical_alternative
  - marker: b
    text: O “Aklat ng mga Talaan ng mga Hari ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ אֲשֶׁר עָשָׂה
  choice: Ang iba pang mga ginawa ni Jehoash
  rationale: Ang pormulang ito sa Mga Hari ay tumutukoy sa natitirang tala ng mga gawa ng hari. Isinasama ng “mga ginawa” ang diwa ng דִּבְרֵי at ng sugnay na אֲשֶׁר עָשָׂה nang hindi lumilikha ng di-likas na pag-uulit sa Tagalog.
- source_word: וּגְבוּרָתוֹ
  choice: ang kanyang kapangyarihan
  rationale: Maaaring tumukoy ang גְּבוּרָה sa lakas, kapangyarihan, kagitingan, o makapangyarihang mga gawa. Malawak ang “kapangyarihan” at angkop sa buod ng kakayahan ng isang hari.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: at kung paano siya nakipaglaban kay
  rationale: Malinaw at likas sa Tagalog ang “nakipaglaban kay” para sa labanang militar. Ipinapaliwanag sa talababa ang literal na gamit ng עִם, “kasama/kasabay,” at ang kahulugang pagsalungat sa kontekstong ito.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: sa Aklat ng mga Salaysay ng mga Hari ng Israel
  rationale: Likas na salin ito ng pamagat ng taunang talaan ng kaharian, habang ang alternatibong “aklat ng mga tala” ay inilalagay sa talababa.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga ito
  rationale: Pinananatili nito ang retorikal na tanong at ang pormulang pampanitikan ng tekstong Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong ng Hebreo at iniwasan ang di-likas na pag-uulit sa pormulang pambungad. Ginamit ang mga pangalang Jehoash, Amazias, at Juda.
