  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: tl
  text: At natalo ang Juda sa harap ng Israel, at tumakas ang bawat lalaki patungo sa kanyang tolda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umuwi ang bawat isa.” Literal sa Hebreo, “ang bawat lalaki sa kanyang tolda,” isang karaniwang idyoma para sa pag-uwi o paghiwa-hiwalay patungo sa kani-kaniyang tirahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: natalo
  rationale: Ang Niphal ng נָגַף sa konteksto ng labanan ay tumutukoy sa pagkatalo, hindi lamang sa pisikal na pagkahampas. Likas at malinaw sa modernong Filipino ang “natalo.”
- source_word: יְהוּדָה
  choice: Juda
  rationale: Karaniwang anyong Filipino ng pangalan ng kaharian sa timog.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang Hebreong konstruksiyon at ang larawang natalo ang Juda sa harap ng kalaban; sa konteksto, malinaw na Israel ang nanaig.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyong Filipino ng pangalan ng kaharian sa hilaga.
- source_word: וַיָּנֻסוּ
  choice: tumakas
  rationale: Tuwirang ipinapahayag ang paglikas mula sa labanan at angkop sa salaysay.
- source_word: אִישׁ
  choice: ang bawat lalaki
  rationale: Pinananatili ang distributibong diwa at ang panlalaking anyo ng singular na אִישׁ, na tumutukoy rito sa mga lalaking mandirigma.
- source_word: לְאָהֳלוֹ
  choice: patungo sa sarili niyang tolda
  rationale: Pinananatili ang literal na larawan ng Hebreo na “sa kanyang tolda,” habang nililinaw ng “sarili niyang” ang distributibong panghalip.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang “sa harap ng Israel” upang mapanatili ang Hebreong pahayag, at ang literal na “tolda” ay inilagay sa teksto habang ibinigay sa talababa ang idyomatikong kahulugang pag-uwi.
