base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: tl
  text: Totoong natalo mo ang Edom, at nagmataas ang puso mo.[a] Ipagmalaki mo ang tagumpay na iyan[b] at manatili ka sa iyong tahanan. Bakit mo pa uudyukan ang kapahamakan, upang ikaw ay bumagsak—ikaw at ang Juda na kasama mo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “itinaas ka ng iyong puso”; isang idyoma ito para sa pagiging mapagmataas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “Tanggapin mo ang karangalan” o “Magpakarangal ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: Totoong natalo mo
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin. Ipinahahayag ng “totoong” ang diin, at ang “natalo” ay likas na Filipino para sa militar na pananakit sa kontekstong ito.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: at dahil dito'y nagmataas ang puso mo
  rationale: Pinananatili nito ang larawan ng pusong nagmataas habang malinaw na ipinahihiwatig ang pagmamapuri bunga ng tagumpay.
- source_word: הִכָּבֵד
  choice: Masiyahan ka na sa karangalang iyon
  rationale: Sa konteksto, hinihimok si Amazias na makuntento sa karangalang natamo niya sa tagumpay. Hindi nito pinatitindi ang diwa tungo sa hayagang pagyayabang, bagaman posible rin ang gayong pagbasa.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: at manatili ka sa iyong tahanan
  rationale: Likas at marangal na pahayag ito ng utos na huwag nang lumabas upang humanap ng panibagong labanan.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: naghahanap ng kapahamakan
  rationale: Ang hitpael ng גרה ay tumutukoy sa pagpukaw o pagsuong sa alitan, at ang רעה rito ay kapahamakan o sakuna, hindi kinakailangang moral na kasamaan.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: magpapabagsak sa iyo—sa iyo at sa Juda na kasama mo
  rationale: Ipinakikita nito ang inaasahang bunga ng mapusok na pakikipaglaban at pinananatili ang diin na pati ang Juda ay babagsak kasama ng hari.
