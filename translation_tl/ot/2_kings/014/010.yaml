  to: Totoong natalo mo ang Edom, at nagmataas ang puso mo.[a] Ipagmalaki mo ang tagumpay na iyan[b] at manatili ka sa iyong tahanan. Bakit mo pa uudyukan ang kapahamakan, upang ikaw ay bumagsak—ikaw at ang Juda na kasama mo?
