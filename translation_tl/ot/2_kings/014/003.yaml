  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: tl
  text: Ginawa niya ang matuwid sa paningin ni Yahweh, ngunit hindi gaya ni David na kanyang ama[a]. Ginawa niya ang lahat ng ginawa ni Joas na kanyang ama[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “David na kanyang ama.” Ang “ama” rito ay ginagamit sa kahulugang ninuno sa linya ng hari, hindi bilang kanyang agarang ama.
    reason: cultural_note
  - marker: b
    text: Ang Joas ay tinatawag ding Jehoas sa ibang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ginawa niya ang matuwid
  rationale: Likas at marangal na Filipino para sa pormula ng pagsusuri sa asal ng hari, habang pinananatili ang diwa ng paggawa ng tama.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma ng pagsusuri ng Diyos at ang pangalang Yahweh.
- source_word: רַק לֹא כְּדָוִד אָבִיו
  choice: ngunit hindi gaya ni David na kanyang ninuno
  rationale: Ipinahahayag ng 'ngunit' ang paglilimita ng רַק sa naunang positibong pagsusuri. Ang 'ninuno' ay malinaw na naghahatid ng dinastikong kahulugan ng אָבִיו sa ugnayan kay David.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה יוֹאָשׁ אָבִיו עָשָׂה
  choice: Sa lahat ng ginawa niya, tinularan niya ang kanyang amang si Joas
  rationale: Inihahatid ang ganap na paghahambing sa asal ni Joas sa natural na Filipino; ang 'amang' dito ay tumutukoy sa agarang ama.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Karaniwang anyong Filipino ng pangalang Joash/Jehoash.
theological_decisions:
- issue: Positibong pagsusuri sa hari na may malinaw na limitasyon
  choice: Pinanatili ang tunay na papuri sa ginawa niyang matuwid, kasunod ng paghahambing na hindi niya naabot ang pamantayan ni David at sa halip ay tinularan si Joas.
  alternative: Ituring ang pambungad na papuri bilang pormal lamang, o pahinain ang kaibahan niya kay David.
  rationale: Ang Hebreong ayos ay nagbibigay muna ng positibong pagsusuri at pagkatapos ay nililimitahan ito sa pamamagitan ng רַק at ng dalawang paghahambing.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ninuno” sa pangunahing teksto upang maiwasan ang maling pagkaunawang si David ang agarang ama, habang inilagay sa talababa ang literal na Hebreong idyoma. Ang “tinularan” ay natural na naghahatid ng paghahambing ng asal nang hindi inaalis ang saklaw na “sa lahat.”
