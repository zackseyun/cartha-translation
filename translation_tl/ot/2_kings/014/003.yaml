  source_fidelity: 'Ang unang pangungusap ay wastong naghahatid ng positibong pagsusuri at ng paglilimita nito. Ngunit ang ikalawang pangungusap na “Sa lahat ng ginawa niya, tinularan niya ang kanyang amang si Joas” ay hindi sapat na tumpak: ang “niya” ay maaaring tumukoy kay Amazias at ang ayos ay ginagawang hiwalay na pahayag ng pagtulad, sa halip na tahasang sabihing ginawa niya ang lahat ng ginawa ni Joas. Dapat ding panatilihin sa teksto ang Hebreong “ama” para kay David, habang nililinaw sa talababa ang dinastikong gamit nito.'
  naturalness: Natural at marangal ang “Ginawa niya ang matuwid sa paningin ni Yahweh.” Mas malinaw at mas tuwiran sa modernong Filipino ang “Ginawa niya ang lahat ng ginawa ni Joas na kanyang ama” para sa huling sugnay.
  terminology: Ang “Yahweh,” “matuwid,” at “Joas” ay angkop. Ang “ama” para kina David at Joas ay dapat panatilihin sa pangunahing teksto, sapagkat ito ang terminong Hebreo; ang natatanging dinastikong kahulugan para kay David ay angkop na ipaliwanag sa talababa.
