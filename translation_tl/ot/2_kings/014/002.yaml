  verdict: revise
  source_fidelity: Tumpak ang salin ng edad, pag-akyat sa paghahari, tagal ng paghahari, Jerusalem, at pagkakakilanlan ng ina. Gayunman, ang pangunahing baybay ng pangalan ay kailangang itama sa “Jehoaddin,” na mas tapat sa ibinigay na anyong Hebreo at sa audit trail.
  naturalness: Natural, malinaw, at angkop sa marangal na modernong Filipino ang daloy ng pangungusap. Ang “na taga-Jerusalem” ay isang likas na paraan upang ipahayag ang pinagmulan o kaugnayan na nasa מן.
  terminology: Ang “naghari” at “hari” ay wastong katumbas sa pormulang panghari. Ang pangalan ay hindi dapat sabihing “isinasalin”; mas wasto ang sabihing mayroon itong tradisyonal na ibang baybay.
