base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: tl
  text: Dalawampu't limang taong gulang siya nang maging hari, at dalawampu't siyam na taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Jehoaddin[a], na taga-Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang ito ay tradisyonal ding binabaybay na “Jehoaddan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Dalawampu't limang taong gulang
  rationale: Likas na salin sa modernong Tagalog ng Hebreong idyoma para sa edad; hindi natural ang literal na “anak ng dalawampu't limang taon.”
- source_word: הָיָה בְמָלְכוֹ
  choice: nang maging hari
  rationale: Malinaw at natural na ipinahahayag ang pormula ng pagluklok sa paghahari.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: dalawampu't siyam na taon siyang naghari
  rationale: Tumpak na pinananatili ang haba ng paghahari at ang aktibong diwa ng מָלַךְ.
- source_word: בִּירוּשָׁלָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong pagtukoy sa lungsod kung saan siya naghari.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural ngunit marangal na modernong Tagalog para sa paulit-ulit na pormula ng pagkilala sa ina sa Mga Hari.
- source_word: יהועדין
  choice: Jehoadin
  rationale: Transliterasyong angkop sa baybay at bigkas sa Filipino, batay sa anyong Masoretiko ng pangalan; inilalahad sa talababa ang tradisyonal na alternatibo.
- source_word: מִן יְרוּשָׁלָם
  choice: na taga-Jerusalem
  rationale: Sa Filipino, likas na ipinahahayag ng “taga-” ang pinagmulan o kaugnayan sa isang lugar na tinutukoy ng מִן.
