base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: tl
  text: Ngunit hindi nakinig si Amazias[a]. Kaya umakyat si Jehoas na hari ng Israel, at nagharap[b] sila ni Amazias na hari ng Juda sa Bet-semes, na sakop ng Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi pinansin” o “hindi sinunod.” Ang pandiwang Hebreo ay maaaring tumukoy sa pakikinig na may kaukulang pagtugon, hindi lamang sa pagkarinig.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nakita nila ang mga mukha ng isa't isa,” isang idyoma para sa tuwirang pagtatagpo o pagharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Ngunit hindi nakinig
  rationale: Ipinahihiwatig ng שׁמע rito ang pakikinig na may pagtugon o pagsunod sa babala, hindi lamang ang pisikal na pagkarinig. Likas sa Filipino ang “hindi nakinig” at hindi nito pinalalakas nang labis ang diwa tungo sa tahasang pagsuway.
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili nito ang karaniwang kahulugan ng עלה na “umakyat/umahon,” habang hinahayaan sa konteksto ang pahiwatig na pagkilos ng hukbo.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: nagharap sila
  rationale: Ang literal na “nakakita ng mga mukha” ay isang idyoma para sa tuwirang pagtatagpo o pagharap. Natural sa Filipino ang “nagharap” at angkop sa konteksto ng sagupaan.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-semes
  rationale: Tinumbasan ang pangalang-pook sa anyong transliterado mula sa Hebreo sa halip na isaling “Bahay ng Araw.”
- source_word: אֲשֶׁר לִיהוּדָה
  choice: na sakop ng Juda
  rationale: Ipinakikita ng parirala ang pag-aari o hurisdiksiyon ng Juda, hindi lamang ang lokasyon ng bayan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nagharap” bilang likas na katumbas ng idyomang Hebreo at “na sakop ng Juda” upang malinaw na ipahayag ang teritoryal na kaugnayan. Ang “Kaya” ay nagpapakita ng bunga ng hindi pakikinig ni Amazias nang hindi nagdaragdag ng teolohikal na paliwanag.
