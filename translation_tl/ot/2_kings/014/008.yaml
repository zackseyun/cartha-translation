  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: tl
  text: Pagkatapos, nagsugo si Amazias ng mga mensahero kay Jehoas[a], ang hari ng Israel, na anak ni Jehoahaz, na anak ni Jehu. Sinabi niya sa mga ito, “Halika, magharap tayo.”[b]
  philosophy: optimal-equivalence
