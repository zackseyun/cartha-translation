revisions:
- from: Pagkatapos, nagsugo si Amazias ng mga mensahero kay Jehoas[a], na anak ni Jehoahaz at apo ni Jehu, na hari ng Israel. Ipinasabi niya, “Halika, magkita tayo nang harapan.”[b]
  to: Pagkatapos, nagsugo si Amazias ng mga mensahero kay Jehoas[a], ang hari ng Israel, na anak ni Jehoahaz, na anak ni Jehu. Sinabi niya sa mga ito, “Halika, magharap tayo.”[b]
  rationale: Inayos ang huling pananalita upang maihatid ang hamon ng Hebreong idyoma nang hindi idinadagdag ang “sa labanan” sa pangunahing teksto. Inayos din ang pagkakasunod ng pagkakakilanlan upang malinaw na si Jehoas ang hari ng Israel at upang mapanatili ang dalawang “anak ni” ng Hebreo. Ang talababa ay ginawang mas tumpak at natural ang pagpapaliwanag ng literal na larawan.
