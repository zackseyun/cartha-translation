- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Tuwirang salin ng titulong maharlika.
- source_word: לֵאמֹר
  choice: Ipinasabi niya
  rationale: Natural na paraan sa Tagalog upang ipakilala ang mensaheng ipinadala sa pamamagitan ng mga sugo.
- source_word: לְכָה
