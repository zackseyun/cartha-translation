  to: 'Pagkatapos, nagpadala si Jehoash na hari ng Israel kay Amazias na hari ng Juda at nagsabi: “Ang tinikang palumpong[a] na nasa Lebanon ay nagpadala sa punong sedro na nasa Lebanon, na nagsasabi, ‘Ibigay mo ang iyong anak na babae sa aking anak na lalaki upang maging asawa ng aking anak na lalaki.’ At isang ligaw na hayop[b] na nasa Lebanon ang dumaan at niyurakan ang tinikang palumpong.”'
  rationale: Iningatan ng rebisyon ang paulit-ulit na “Lebanon,” ang metaporang palumpong at sedro, at ang payak na pag-uugnay ng huling pangyayari. Ginawang “ligaw na hayop” ang termino upang tumugma sa saklaw ng Hebreo nang hindi nagdaragdag ng katangiang “mabangis,” at nilinaw ang tinutukoy ng panghalip sa usaping pag-aasawa.
