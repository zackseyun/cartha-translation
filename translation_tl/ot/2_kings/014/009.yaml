  text: וַ/יִּשְׁלַ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: tl
  text: 'Pagkatapos, nagpadala si Jehoash na hari ng Israel kay Amazias na hari ng Juda at nagsabi: “Ang tinikang palumpong[a] na nasa Lebanon ay nagpadala sa punong sedro na nasa Lebanon, na nagsasabi, ‘Ibigay mo ang iyong anak na babae sa aking anak na lalaki upang maging asawa ng aking anak na lalaki.’ At isang ligaw na hayop[b] na nasa Lebanon ang dumaan at niyurakan ang tinikang palumpong.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dawag,” “tinik,” o ibang uri ng matinik na halaman.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hayop sa parang,” ibig sabihin, isang ligaw na hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל
  choice: nagpasabi ... kay
  rationale: Sa kontekstong diplomatiko, natural sa Tagalog ang “nagpasabi kay” para sa pagpapadala ng mensahe, habang pinananatili ang pag-usad ng salaysay.
- source_word: הַחוֹחַ
  choice: ang tinikang palumpong
  rationale: Tumutukoy ang חוֹחַ sa isang mababa at matinik na halaman. Pinananatili ng “tinikang palumpong” ang matinding paghahambing nito sa maringal na sedro nang hindi tumutukoy sa tiyak na uri.
- source_word: הָאֶרֶז
  choice: ang punong sedro
  rationale: Tuwirang katumbas ng אֶרֶז at malinaw na pangalan ng punong kaiba sa mababang tinikang palumpong.
- source_word: בַּלְּבָנוֹן
  choice: sa Lebanon
  rationale: Natural na panandang pook sa Tagalog; inulit ayon sa retorikal na pag-uulit ng Hebreo.
- source_word: תְּנָה
  choice: Ibigay mo
  rationale: Tuwirang pautos ng נתן; malinaw at natural sa pakiusap para sa kasunduang pag-aasawa.
- source_word: בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: ang iyong anak na babae sa aking anak na lalaki upang maging asawa niya
  rationale: Malinaw na pinananatili ang ugnayang pampamilya at layuning pag-aasawa ng parirala.
- source_word: חַיַּת הַשָּׂדֶה
  choice: isang mabangis na hayop
  rationale: Idyomatikong tumutukoy ang literal na “hayop sa parang” sa isang mailap o ligaw na hayop; ang “mabangis na hayop” ay natural at nagpapanatili ng banta sa talinghaga.
- source_word: וַתַּעֲבֹר
  choice: dumaan
  rationale: Maikli at natural na paglalarawan ng pagdaan ng hayop.
- source_word: וַתִּרְמֹס
  choice: niyurakan
  rationale: Malinaw at masidhing katumbas ng pagyapak o pagdurog sa ilalim ng paa.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “nagpasabi” para sa likas na diplomatikong mensahe at pinanatili ang paulit-ulit na “sa Lebanon.” Ang “sedro” ay mas karaniwang anyo sa tradisyong biblikal na Filipino, samantalang ang mga talababa ay nagpapanatili sa leksikal na lawak ng mga larawang Hebreo.
