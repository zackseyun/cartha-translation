  source_fidelity: Tumpak ang pangunahing larawan at pagkakasunod-sunod ng Hebreo, ngunit ang “mabangis na hayop” ay mas makitid at mas matindi kaysa sa pangkalahatang חַיַּת הַשָּׂדֶה (“ligaw na hayop”). Ang mga sugnay na naglalarawan sa mga bagay na “nasa Lebanon” ay maaari ring gawing mas hayag.
  naturalness: Natural ang pangkalahatang Tagalog, ngunit mas malinaw ang “na nasa Lebanon” kaysa sa simpleng “sa Lebanon” sa loob ng talinghaga. Nilinaw rin ang panghalip sa “asawa niya.”
  terminology: Ang “tinikang palumpong” at “punong sedro” ay angkop. Pinalitan ang “mabangis na hayop” ng “ligaw na hayop” upang huwag magdagdag ng kahulugang pagiging marahas o mapanganib.
