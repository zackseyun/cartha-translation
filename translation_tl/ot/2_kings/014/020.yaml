  yaml_path: translation/ot/2_kings/014/020.yaml
  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: tl
  text: Dinala nila siya sakay ng mga kabayo[a], at inilibing siya sa Jerusalem kasama ng kanyang mga ninuno[b], sa Lungsod ni David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ibabaw ng mga kabayo.” Maaaring inilalarawan nito ang pagdadala sa katawan sa pamamagitan ng mga kabayo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “kasama ng kanyang mga ama.” Isa itong nakaugaliang pormula sa paglilibing na tumutukoy sa kanyang mga ninuno sa maharlikang angkan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: Dinala nila siya
  rationale: Ang נשׂא sa salaysay na ito ay nangangahulugang buhatin o dalhin. Ang “dinala” ay natural sa makabagong Filipino at hindi nagpapasiya kung paano eksaktong isinakay o inihatid ang katawan.
- source_word: עַל הַסּוּסִים
  choice: sakay ng mga kabayo
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong “sa ibabaw ng mga kabayo,” ngunit gumagamit ng likas na pariralang Filipino. Nananatiling bukas kung tuwirang nakapatong sa mga kabayo ang katawan o inihatid sa isang sasakyang hinihila o dinadala ng mga ito.
- source_word: וַיִּקָּבֵר
  choice: at inilibing siya
  rationale: 'Bagaman aktibo ang karaniwang anyo ng parirala sa Filipino, tumutugma ito sa diwang pasibo ng Nifal: siya ang tumanggap ng paglilibing, at hindi tinutukoy ang mga naglibing.'
- source_word: בִּירוּשָׁלִַם
  choice: sa Jerusalem
  rationale: Karaniwang lokatibong salin ng pangalan ng lugar.
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Sa pormulang panglibing, ang אבות ay tumutukoy sa mga naunang kasapi ng angkan o dinastiya. Mas malinaw at natural sa modernong Filipino ang “mga ninuno” kaysa literal na “mga ama.”
- source_word: בְּעִיר דָּוִד
  choice: sa Lungsod ni David
  rationale: Karaniwang salin ng pangalang pantangi at nililinaw ang tiyak na lugar ng libingan sa loob ng Jerusalem.
