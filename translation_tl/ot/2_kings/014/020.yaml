  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sakay ng mga kabayo” upang mapanatili ang konkretong Hebreong larawan nang hindi nagiging asiwa, at “mga ninuno” upang maipahayag nang natural ang pormulang panglibing.
