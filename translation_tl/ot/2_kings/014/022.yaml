  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: tl
  text: Muli niyang itinayo ang Elat at ibinalik ito sa Juda pagkahimlay ng hari kasama ng kanyang mga ninuno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: muling itinayo
  rationale: Ang pandiwa ay literal na “itinayo,” ngunit sa konteksto ng dati nang umiiral na lunsod, natural at tumpak sa Filipino ang “muling itinayo.”
- source_word: אֵילַת
  choice: Elat
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Filipino.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: at ibinalik ito sa Juda
  rationale: Pinananatili ang diwa ng pagpapanumbalik ng Elat sa pamamahala o pag-aari ng Juda nang hindi dinaragdagan ang hindi tahasang sinabi.
- source_word: שְׁכַב ... עִם־אֲבֹתָיו
  choice: pagkahimlay ... kasama ng kanyang mga ninuno
  rationale: Pinananatili ang marangal na Hebreong idyoma para sa kamatayan sa halip na payak na gawing “namatay.”
theological_decisions:
- issue: Pagkakakilanlan ng “hari”
  choice: ang hari
  alternative: ang kanyang ama, ang hari
  rationale: Hindi tahasang tinutukoy ng talata kung sino ang hari; pinananatili ng salin ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Maikli, marangal, at natural na modernong Filipino. Pinanatili ang idyomang tumutukoy sa kamatayan at ang kalabuan ng katawagang “ang hari.”
