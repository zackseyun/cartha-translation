  source_fidelity: 'Tumpak na naihahatid ang Hebreong pahayag: ang di-tinukoy na “siya,” ang muling pagtatayo ng Elat, ang pagpapanumbalik nito sa Juda, at ang panahong kasunod ng paghimlay ng hari kasama ng kanyang mga ninuno. Ang “muli niyang itinayo” ay isang katanggap-tanggap na kontekstuwal na pagsasalin ng בָּנָה, gaya rin ng audit-trail na “rebuilt.”'
