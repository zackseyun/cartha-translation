  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: tl
  text: Binihag ni Jehoas na hari ng Israel si Amazias na hari ng Juda, na anak ni Joas na anak ni Ahazias, sa Bet-semes. Pagkatapos, pumunta siya sa Jerusalem[a] at giniba ang pader ng Jerusalem mula sa Tarangkahan ng Efraim hanggang sa Tarangkahan sa Sulok—apatnaraang siko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa tekstong Hebreo na katinig ay “pumunta sila sa Jerusalem,” ngunit sinusuportahan ng konteksto at ng kasunod na pandiwang isahan ang diwang “pumunta siya sa Jerusalem,” na tumutukoy kay Jehoas.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: binihag
  rationale: Sa kontekstong militar, ipinahihiwatig ng pandiwa ang pagdakip sa hari bilang bihag; natural at tiyak ang “binihag” sa modernong Filipino.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: sa Bet-semes
  rationale: Ang בְּ bago ang pangalan ng lugar ay lokatibo; “sa” ang natural na katumbas sa Filipino.
- source_word: ו/יבאו
  choice: pagkatapos, pumunta siya
  rationale: Bagaman maramihan ang anyong katinig (“pumunta sila”), sinusuportahan ng konteksto at ng kasunod na pandiwang isahan ang pagbasa na si Jehoas ang pumunta. Minamarkahan ng “pagkatapos” ang sunod-sunod na pangyayari.
- source_word: וַיִּפְרֹץ
  choice: giniba
  rationale: Kapag pader ang layon, malinaw na ipinahahayag ng “giniba” ang paggawa ng malaking siwang o pagwasak sa isang bahagi nito.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: ang pader ng Jerusalem
  rationale: Bagaman may pang-ukol na literal na “sa,” hinihingi ng likas na Filipino kasama ng “giniba” na tuwirang layon ang pader.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: mula sa Tarangkahan ng Efraim hanggang sa Tarangkahan sa Sulok
  rationale: Malinaw na ipinakikita ng “mula…hanggang…” ang lawak ng bahaging giniba.
- source_word: הַפִּנָּה
  choice: Sulok
  rationale: Bahagi ito ng pantanging pangalan ng isang tarangkahan; pinanatili ang kongkretong kahulugang “sulok.”
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: apatnaraang siko ang haba
  rationale: Pinananatili ang sinaunang yunit na “siko,” habang nililinaw ng “ang haba” na sukat ito ng bahaging giniba.
- source_word: בֶּן ... בֶּן ...
  choice: na anak ni Joas na anak ni Ahazias
  rationale: Pinananatili ang dalawang ulit na “anak” gaya ng Hebreo sa halip na ipalit ang interpretatibong “apo.”
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na dignified at madaling maunawaan. Ginamit ang karaniwang anyong Filipino ng mga pangalan: Jehoas, Amazias, Joas, Ahazias, Bet-semes, at Efraim. Pinanatili ang sinaunang sukat na “siko” at iniwasan ang modernong conversion.'
