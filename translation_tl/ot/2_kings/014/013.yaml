- from: Binihag ni Jehoas na hari ng Israel si Amazias na hari ng Juda, na anak ni Joas na anak ni Ahazias, sa Bet-semes. Pagkatapos, pumunta siya sa Jerusalem[a] at giniba ang pader ng Jerusalem mula sa Tarangkahan ng Efraim hanggang sa Tarangkahan sa Sulok—apatnaraang siko ang haba.
  to: Binihag ni Jehoas na hari ng Israel si Amazias na hari ng Juda, na anak ni Joas na anak ni Ahazias, sa Bet-semes. Pagkatapos, pumunta siya sa Jerusalem[a] at giniba ang pader ng Jerusalem mula sa Tarangkahan ng Efraim hanggang sa Tarangkahan sa Sulok—apatnaraang siko.
  rationale: Inalis ang espesipikasyong “ang haba” upang mapanatili ang di-tiyak na anyo ng tuwirang sukat sa Hebreo, at inayos ang balarila ng talababa. Walang pagbabago sa kahulugan o sa pagmamarka ng tekstuwal na suliranin.
