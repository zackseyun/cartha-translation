- from: Pumatay siya ng sampung libong Edomita sa Libis ng Asin. Sinakop niya sa labanan ang Sela[a] at tinawag itong Jokteel, na siyang pangalan nito hanggang sa araw na ito.
  to: Nilupig niya ang sampung libong Edomita sa Libis ng Asin, nakuha niya ang Sela[a] sa labanan, at tinawag niyang Jokteel ang pangalan nito hanggang sa araw na ito.
  rationale: Pinalitan ang “Pumatay” ng “Nilupig” upang hindi ipilit ang kahulugang pagpatay na hindi tahasang isinasaad ng Hebreo. Pinalitan ang “Sinakop” ng “nakuha” upang tumpak na ipahayag ang pagkuha ng pook sa labanan. Inayos ang panghuling parirala upang malinaw na ang Jokteel ang pangalang nanatili hanggang sa araw ng manunulat.
