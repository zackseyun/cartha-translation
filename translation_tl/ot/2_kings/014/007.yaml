base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: tl
  text: Nilupig niya ang sampung libong Edomita sa Libis ng Asin, nakuha niya ang Sela[a] sa labanan, at tinawag niyang Jokteel ang pangalan nito hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Sela ay maaari ring unawain ayon sa karaniwang kahulugan ng salita: “ang bato” o “ang matarik na batuhan.” Gayunman, malamang na pangalan ito ng isang pook dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: pumatay
  rationale: Sa konteksto ng bilang ng mga nasawi sa digmaan, ang נכה ay likas na tumutukoy sa nakamamatay na pananakit. Malinaw at natural sa Filipino ang “pumatay” nang hindi dinaragdagan ang detalye ng paraan.
- source_word: אֱדוֹם
  choice: mga Edomita
  rationale: Literal na “Edom” ang Hebreo, ngunit dahil may bilang na sampung libo bilang layon ng pandiwa, ang tinutukoy ay mga taong mula sa Edom. Natural sa Filipino ang “mga Edomita.”
- source_word: בְּגֵיא הַמֶּלַח
  choice: sa Libis ng Asin
  rationale: Tuwirang salin ng pangalang heograpiko, na malinaw at marangal sa modernong Filipino.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: sampung libo
  rationale: Karaniwang katumbas sa Filipino ng bilang na nasa Hebreo.
- source_word: וְתָפַשׂ
  choice: sinakop
  rationale: Sa kontekstong militar at sa isang pook bilang layon, ipinahihiwatig ng תפשׂ ang pagkuha at pagkontrol sa lugar.
- source_word: הַסֶּלַע
  choice: ang Sela
  rationale: Malamang na pangalan ito ng kilalang pook. Pinanatili ang transliterasyon, habang inilagay sa talababa ang posibleng leksikal na kahulugan.
- source_word: בַּמִּלְחָמָה
  choice: sa labanan
  rationale: Natural at maikling pagpapahayag ng kalagayang militar ng pagsakop.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: tinawag itong
  rationale: Pinananatili nito ang Hebreong pormula ng pagtawag sa pangalan, ngunit mas natural kaysa sa literal na “tinawag ang pangalan nito” sa modernong Filipino.
- source_word: יָקְתְאֵל
  choice: Jokteel
  rationale: Transliterasyon ng pangalan ng pook ayon sa bigkas ng anyong Hebreo.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: na siyang pangalan nito hanggang sa araw na ito
  rationale: Nililinaw sa natural na Filipino na ang pangalan ang nanatili hanggang sa panahon ng tagapagsalaysay, gaya ng ipinahihiwatig ng Hebreong pormula.
