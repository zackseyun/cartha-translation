translation_notes:
  register: Modernong Filipino na malinaw at marangal. Gumamit ng maiikling pangungusap para madaling maunawaan, habang pinananatili ang pagkakasunod-sunod ng mga pangyayari at ang posibleng kahulugan ng Sela sa talababa.
