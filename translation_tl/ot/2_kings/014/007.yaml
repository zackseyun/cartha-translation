  - severity: low
    issue: Ang “Sinakop niya” ay maaaring magpahiwatig ng mas malawak o pangmatagalang pagsakop kaysa sa pagkuha ng isang pook sa labanan.
    rationale: Ang וְתָפַשׂ ay tuwirang tumutukoy sa pagkuha o pag-agaw ng Sela sa digmaan.
  - severity: low
    issue: Ang “na siyang pangalan nito hanggang sa araw na ito” ay medyo hindi tuwiran bilang katumbas ng pormula ng pagpapangalan.
    rationale: Mas malinaw na ilakip ang “hanggang sa araw na ito” sa pangalan na ibinigay sa pook.
