base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: tl
  text: At natulog si Jehoas kasama ng kanyang mga ninuno, at inilibing siya sa Samaria kasama ng mga hari ng Israel. At naghari bilang kahalili niya ang anak niyang si Jeroboam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: natulog
  rationale: Pinananatili ang karaniwang pormula sa ulat ng pagkamatay ng hari at ang banayad na talinghaga ng Hebreo, sa halip na tahasang gawing “namatay.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ang likas at malinaw na modernong Tagalog para sa mga naunang salinlahi; iniiwasan nito ang posibleng maling pagkaunawa sa literal na “mga ama.”
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Likas na Tagalog na nagpapahayag ng diwang balintiyak ng anyong Niphal.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang pang-ukol ay lokatibo at natural na isinasalin bilang “sa” para sa lugar ng paglilibing.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: kasama ng mga hari ng Israel
  rationale: Malapit nitong tinutumbasan ang עִם at ipinahihiwatig ang pagkakalibing na kaugnay ng mga naunang hari ng Israel.
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Pinananatili ang karaniwang pandiwa para sa pamamahala bilang hari sa mga ulat ng paghalili.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Malinaw at likas na ipinapahayag sa Tagalog ang dinastikong paghalili, hindi lamang ang temporal na pagsunod.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang “natulog … kasama ng kanyang mga ninuno” upang maipakita ang estilong panghari ng Hebreo nang hindi ginagawang sobrang teknikal ang pananalita.
