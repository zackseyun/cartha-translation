translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nahimlay” upang mapanatili ang tradisyonal na larawan ng Hebreo nang hindi maging di-natural; ang mga posibleng literal o alternatibong pagbasa ay inilagay sa talababa.
