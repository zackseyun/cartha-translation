  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: tl
  text: At nahimlay si Jeroboam kasama ng kanyang mga ninuno[a], kasama ng mga hari ng Israel[b], at naghari si Zacarias, ang kanyang anak, bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “natulog kasama ng kanyang mga ninuno.” Ang pananalitang Hebreo ay nakaugaliang pormula para sa pagkamatay ng isang hari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kabilang sa mga hari ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Ang pandiwang שׁכב sa pormulang kasama ng mga ninuno ay isang nakaugaliang pahayag tungkol sa pagkamatay ng hari. Pinananatili ng “nahimlay” ang larawan at marangal na himig nang hindi ito tahasang pinapaliit sa “namatay.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Mas natural at malinaw sa modernong Tagalog ang “mga ninuno” kaysa literal na “mga ama,” habang pinananatili ang kahulugan ng pormulang Hebreo.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: kasama ng mga hari ng Israel
  rationale: Pinananatili ang inuulit na עִם bilang “kasama ng”; hindi nito ipinapasya kung ang diwa ay mahigpit na “kasama” o mas maluwag na “kabilang sa.”
- source_word: וַיִּמְלֹךְ
  choice: naghari
  rationale: Karaniwan at maikling katumbas sa mga ulat ng paghahari; sapat nitong ipinapahayag ang pag-upo sa trono sa konteksto ng paghalili.
- source_word: זְכַרְיָה
  choice: Zacarias
  rationale: Ginamit ang nakagawiang anyo ng pangalang biblikal sa Tagalog.
- source_word: בְנוֹ
  choice: kanyang anak
  rationale: Tuwirang katumbas ng katawagang nagpapahayag ng ugnayang ama at anak.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Natural na Tagalog sa konteksto ng paghalili sa trono at malinaw na katumbas ng paghahari sa lugar ng naunang hari.
