  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Amazias, hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Aklat ng mga Talaan ng mga Hari ng Juda.”
    reason: Ipinakikita ang posibleng salin ng דִּבְרֵי הַיָּמִים bilang “mga talaan” o annals sa halip na “mga Kasaysayan.”
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Ang יֶתֶר ay tumutukoy sa nalalabing bahagi, at ang דִּבְרֵי sa pormulang pangkasaysayan ay tumutukoy sa mga ginawa o gawain ng hari, hindi lamang sa kaniyang mga salita. Likas at malinaw sa makabagong Tagalog ang “iba pang mga ginawa.”
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong biblikal na Tagalog.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang mambabasa at ang participial na diwang “nakasulat.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Sa pormulang tumutukoy sa isang sangguniang kasulatan, natural sa Tagalog ang “sa Aklat” kaysa sa literal na “sa ibabaw ng balumbon.”
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Kasaysayan
  rationale: Sa kontekstong ito, ang parirala ay titulo ng taunang tala o salaysay ng mga pangyayari sa paghahari. Ang “mga Kasaysayan” ay dignified at pamilyar, habang inilalahad sa talababa ang alternatibong “mga talaan.”
- source_word: לְמַלְכֵי יְהוּדָה
  choice: ng mga Hari ng Juda
  rationale: Ang לְ ay bahagi ng pamagat ng dokumento at natural na ipinahahayag sa Tagalog sa pamamagitan ng ugnayang “ng.”
