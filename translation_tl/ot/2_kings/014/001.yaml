base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: tl
  text: Noong ikalawang taon ng paghahari ni Joas, anak ni Jehoahaz at hari ng Israel, naging hari ng Juda si Amazias na anak ni Joas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Nang ikalawang taon ng paghahari
  rationale: Ang pariralang Hebreo ay pormula ng pagtatakda ayon sa taon ng paghahari. Ginawang ordinal ang literal na bilang na “dalawa,” at idinagdag ang “paghahari” upang maging malinaw at likas sa Tagalog ang tinutukoy na taon.
- source_word: לְ/יוֹאָשׁ
  choice: ni Joas
  rationale: Sa pormulang panghari, ang לְ ay tumutukoy sa hari na pinagbabatayan ng bilang ng taon; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “ni.”
- source_word: בֶּן יוֹאָחָז
  choice: na anak ni Jehoahaz
  rationale: Tuwirang isinalin ang patronimiko, gamit ang “na” upang natural na iugnay ito sa pangalang Joas.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: ang hari ng Israel
  rationale: Pinanatili ang maharlikang titulo at nasasakupan bilang paglalarawan kay Joas.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa kontekstong ito, ipinahihiwatig ng pandiwa ang pagluklok o pagsisimula ng paghahari, hindi lamang ang patuloy na paghahari.
- source_word: אֲמַצְיָהוּ
  choice: Amazias
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang biblikal.
- source_word: בֶן יוֹאָשׁ
  choice: na anak ni Joas
  rationale: Tuwirang ipinahayag ang patronimiko ni Amazias sa natural na ayos ng Tagalog.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Isinama ang kaharian sa pariralang “naging hari ng Juda,” na malinaw at idiomatiko sa Tagalog.
