source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: tl
  text: 'Ngunit hindi niya pinatay ang mga anak na lalaki ng mga pumatay[a], ayon sa nakasulat sa Aklat ng Kautusan ni Moises, na iniutos ni Yahweh: “Hindi dapat ipapatay ang mga ama dahil sa kanilang mga anak na lalaki, at hindi dapat ipapatay ang mga anak na lalaki dahil sa kanilang mga ama. Sa halip, ang bawat isa ay mamamatay dahil sa sarili niyang kasalanan.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “mga anak ng mga mamamatay-tao.” Literal sa Hebreo: “mga anak na lalaki ng mga pumatay.”'
    reason: lexical_alternative
  - marker: b
    text: Ang siping ito ay mula sa Deuteronomio 24:16.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: mga anak na lalaki ng mga pumatay
  rationale: Pinananatili ang panlalaking anyo ng בְּנֵי at ang diwang nakamamatay ng participle mula sa נכה sa kontekstong ito. Mas tuwiran ito kaysa sa pangkalahatang “mga anak.”
- source_word: לֹא הֵמִית
  choice: hindi niya ipinapatay
  rationale: Ang Hiphil ng מות ay causative, “magpapatay/ipapatay,” at sa konteksto ay tumutukoy sa parusang kamatayan, hindi lamang sa karaniwang pagpatay.
- source_word: כַּכָּתוּב
  choice: ayon sa nakasulat
  rationale: Likas na idyomang Filipino na nagpapahayag ng pagsunod sa nakasulat na kautusan.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: sa Aklat ng Kautusan ni Moises
  rationale: Malinaw at kinikilalang pormula na tapat sa סֵפֶר at תּוֹרָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֹא יוּמְתוּ
  choice: hindi dapat ipapatay
  rationale: Ipinapakita ng pasibo/causative na anyo at legal na konteksto ang pagbabawal sa pagpapataw ng parusang kamatayan.
- source_word: אָבוֹת ... בָּנִים
  choice: mga ama ... mga anak na lalaki
  rationale: Pinananatili ang tahasang panlalaking mga pangngalan ng Hebreo nang hindi ginagawang “mga magulang ... mga anak.”
- source_word: עַל
  choice: dahil sa
  rationale: Sa legal na pormulang ito, ipinapahayag ng עַל ang batayan ng kaparusahan; natural itong maipapahayag sa Filipino bilang “dahil sa.”
- source_word: כִּי אִם
  choice: sa halip
  rationale: Malinaw na ipinakikilala nito ang salungat na prinsipyong sumusunod sa dalawang pagbabawal.
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Ipinahahayag ang distributibong kahulugan ng singular na אִישׁ. Sa modernong Filipino, natural ang “bawat isa” at hindi nito dinaragdagan ang teksto ng di-kailangang pag-uulit ng kasarian, samantalang malinaw pa rin ang indibidwal na pananagutan.
- source_word: בְּחֶטְאוֹ
  choice: dahil sa sarili niyang kasalanan
  rationale: Ipinapahayag ng “dahil sa” ang batayan, at ng “sarili niyang” ang possessive suffix at ang kaibahan sa kaparusahan dahil sa kasalanan ng kamag-anak.
- source_word: יָמוּת
  choice: mamamatay
  rationale: Pinananatili ang pagbabago tungo sa Qal na “mamatay,” sa halip na ulitin ang causative/passive na “ipapatay.”
theological_decisions:
- issue: Indibidwal laban sa pampamilyang pananagutan sa kautusang tipan
  choice: Itinatakda ng talata na hindi dapat ipataw ang parusang kamatayan sa mga ama dahil sa mga anak na lalaki, o sa mga anak na lalaki dahil sa mga ama; ang bawat isa ay mamamatay dahil sa sarili niyang kasalanan.
  alternative: Basahin ito bilang pangkalahatang pagtanggi sa lahat ng sama-sama o pampamilyang bunga ng kasalanan.
  rationale: Ang mga pandiwa at konteksto ay nakatuon sa legal na pagpatay at personal na pananagutan. Hindi pinalalawak ng salin ang pahayag upang itanggi ang mga panlipunan o pampamilyang bunga ng kasalanan na maaaring ilarawan sa ibang teksto.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “ipinapatay/ipapatay” upang mapanatili ang legal at causative na diwa, at “mamamatay” sa huling sugnay upang maipakita ang pagbabago ng anyong pandiwa sa Hebreo. Ang lahat ng panandang talababa ay nasa pangunahing teksto.
