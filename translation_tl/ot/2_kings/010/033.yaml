  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong fragmento dahil ipinagpapatuloy ng talata ang pangungusap at pandiwa mula sa talata 32. Iniwasang gawing ‘hanggang’ ang huling וְ upang hindi magdagdag ng direksiyong hindi tahasang nasa Hebreo.
