  text: מִן הַ/יַּרְדֵּן֙ מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ אֵ֚ת כָּל אֶ֣רֶץ הַ/גִּלְעָ֔ד הַ/גָּדִ֥י וְ/הָ/רֻאובֵנִ֖י וְ/הַֽ/מְנַשִּׁ֑י מֵ/עֲרֹעֵר֙ אֲשֶׁ֣ר עַל נַ֣חַל אַרְנֹ֔ן וְ/הַ/גִּלְעָ֖ד וְ/הַ/בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: tl
  text: 'mula sa Jordan pasilangan: ang buong lupain ng Gilead—ang lupain ng mga Gadita, Rubenita, at Manasita—mula sa Aroer, na nasa tabi ng Lambak ng Arnon[a], at ang Gilead at Bashan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Batis ng Arnon” o “wadi ng Arnon.” Ang salitang Hebreo ay maaaring tumukoy sa lambak, pana-panahong batis, o daluyan nito.
    reason: Pinananatili ang lawak ng kahulugan ng נַחַל sa paglalarawang heograpiko.
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: mula sa Jordan pasilangan
  rationale: Ang מִן ay tumutukoy sa hangganang nagsisimula sa Jordan, at ang idyomang literal na ‘dakong sikatan ng araw’ ay likas na heograpikong ipinapahayag sa modernong Filipino bilang ‘pasilangan.’
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: ang buong lupain ng Gilead
  rationale: Pinananatili ang kabuuang saklaw ng כָּל at ang Gilead bilang pangalan ng rehiyon; ang parirala ay nagpapatuloy bilang layon ng pandiwa sa naunang talata.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: ng mga Gadita, mga Rubenita, at mga Manasita
  rationale: Ang mga pang-uring pantribo ay kolektibong tumutukoy sa tatlong pangkat. Ginagawang malinaw ng ‘ng’ ang kaugnayan nila sa lupaing binabanggit nang hindi nagdaragdag ng tahasang pandiwang ‘tinitirhan.’
- source_word: מֵעֲרֹעֵר
  choice: mula sa Aroer
  rationale: Ipinakikita ng מִן ang Aroer bilang isang panimulang hangganan ng nasabing teritoryo.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: na nasa tabi ng Lambak ng Arnon
  rationale: Ang עַל ay binibigyang-kahulugang lokatibong ‘nasa tabi ng,’ samantalang ang נַחַל ay maaaring tumukoy sa lambak, wadi, o daluyan ng tubig; ‘Lambak ng Arnon’ ang malinaw at likas na heograpikong katawagan.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: at ang Gilead at Bashan
  rationale: Pinananatili ang payak at pandagdag na puwersa ng וְ nang hindi tiyak na ginagawang ‘hanggang’ o ‘pati,’ sapagkat hindi tahasang nilulutas ng Hebreo ang ugnayan ng huling dalawang pangalan sa naunang paglalarawan.
