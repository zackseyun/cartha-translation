  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: tl
  text: Noong mga araw na iyon, sinimulan ni Yahweh na bawasan ang Israel[a], at tinalo sila ni Hazael sa buong teritoryo ng Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “putulin ang mga bahagi ng Israel.” Ipinahihiwatig ng pandiwang Hebreo ang pagsisimula ng pagbabawas sa Israel; sa konteksto, malamang na kabilang dito ang pagkawala ng teritoryo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa kahabaan ng buong hangganan ng Israel.” Ang salitang Hebreo ay maaaring tumukoy sa hangganan o sa buong nasasakupang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Nang mga araw na iyon
  rationale: Likas na salin sa Filipino ng karaniwang pariralang temporal sa Hebreo, habang pinananatili ang anyong maramihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הֵחֵל
  choice: sinimulan
  rationale: Ipinahahayag ng anyong Hiphil ang pagsisimula ng kilos.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: na bawasan ang nasasakupan ng Israel
  rationale: Ipinahihiwatig ng pandiwa ang unti-unting pagkaltas o pagbabawas, at sa konteksto ay tumutukoy sa pagkawala ng mga bahagi ng teritoryo, hindi sa ganap na paglipol sa Israel.
- source_word: וַיַּכֵּם
  choice: at nilupig sila
  rationale: Sa kontekstong pandigma, ang נכה ay maaaring mangahulugang hampasin o talunin; ang “nilupig” ay natural sa Filipino at pinananatili ang pangmaramihang layon na “sila.”
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang pantangi.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: sa buong teritoryo ng Israel
  rationale: Ang גְּבוּל ay maaaring mangahulugang hangganan o nasasakupang lupain; sa kontekstong ito, malinaw at natural ang pagtukoy sa buong lawak ng teritoryong sinalakay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng pagkilos ni Yahweh sa לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: bawasan ang nasasakupan ng Israel
  alternative: putulin ang mga bahagi ng Israel; unti-unting bawasan ang Israel
  rationale: Hindi tahasang sinasabi ng parirala kung ang diin ay sa bayan o sa lupain. Dahil ang kasunod na sugnay ay heograpikal, ipinahahayag ng salin ang malamang na pagkawala ng teritoryo ngunit itinatala sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nasasakupan” at “teritoryo” upang malinaw na maipahayag ang kontekstong heograpikal at pandigma, habang pinananatili sa talababa ang leksikal na kalabuan ng Hebreo.
