  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: tl
  text: Pagkatapos, pumasok sina Jehu at Jehonadab na anak ni Recab sa bahay ni Baal[a]. Sinabi niya sa mga sumasamba kay Baal, “Siyasatin ninyo at tiyaking walang lingkod ni Yahweh dito sa inyong kalagitnaan, kundi mga sumasamba lamang kay Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “templo ni Baal.” Sa Hebreo, literal na “bahay ni Baal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumasok
  rationale: Ipinahihiwatig ng pandiwa at ng patutunguhang gusali ang pagpasok, kaya natural at tiyak ang “pumasok.”
- source_word: בֵּית הַבָּעַל
  choice: bahay ni Baal
  rationale: Pinananatili nito ang literal na anyo ng Hebreo; nililinaw sa talababa na ang tinutukoy ay templo o santuwaryo.
- source_word: עֹבְדֵי הַבַּעַל
  choice: mga sumasamba kay Baal
  rationale: Sa kontekstong panrelihiyon, malinaw na tumutukoy ang participle sa mga deboto o mananamba ni Baal, hindi lamang sa pangkaraniwang mga alipin o tagapaglingkod.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: Siyasatin ninyo at tiyakin
  rationale: Ipinahahayag nito ang masusing paghahanap at pagpapatunay na hinihingi ng magkasunod na pautos.
- source_word: מֵעַבְדֵי יְהוָה
  choice: lingkod ng PANGINOON
  rationale: Ang “lingkod” ay angkop sa nakaugaliang katawagan sa taong naglilingkod kay YHWH, samantalang natural sa Filipino ang isahang anyo sa pahayag na walang sinuman.
- source_word: כִּי אִם ... לְבַדָּם
  choice: kundi ... lamang
  rationale: 'Malinaw nitong ipinapahayag ang ganap na pagbubukod: walang lingkod ng PANGINOON at tanging mga sumasamba kay Baal ang naroon.'
theological_decisions:
- issue: Paglalarawan sa mga עֹבְדֵי הַבַּעַל
  choice: mga sumasamba kay Baal
  alternative: mga lingkod ni Baal
  rationale: Bagaman maaaring mangahulugang “mga lingkod,” ang tagpo sa templo at ang pagtitipon para sa kultong pagsamba ay nagpapatingkad sa kahulugang panrelihiyon.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang nakaugaliang saling pamagat na nasa konsultasyong teksto at pinanatili ang malinaw na kaibahan ng paglilingkod sa PANGINOON at pagsamba kay Baal.
- issue: Pagkakakilanlan ng nagsalita sa וַיֹּאמֶר
  choice: Sinabi niya
  alternative: Sinabi ni Jehu
  rationale: Isahan ang pandiwa ngunit hindi muling pinangalanan ng Hebreo ang nagsalita. Pinananatili ng panghalip ang anyo at bahagyang kalabuan ng pinagmulan sa halip na tahasang tukuyin si Jehu.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa tambalang pangalan, “sa inyong kalagitnaan” para sa pormal ngunit madaling maunawaang pahayag, at pinanatili ang isahang “niya” upang huwag lutasin ang hindi tahasang tinukoy na tagapagsalita.
