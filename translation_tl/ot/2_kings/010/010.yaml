  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: tl
  text: Kaya alamin ninyo na wala ni isang salita ni Yahweh na sinabi niya laban sa sambahayan ni Ahab ang mahuhulog sa lupa.[a] Ginawa ni Yahweh ang sinabi niya sa pamamagitan ng lingkod niyang si Elias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mahuhulog sa lupa,” isang idyomang nangangahulugang “mabibigo” o “hindi matutupad.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa kamay ng lingkod niyang si Elias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: Kaya alamin ninyo
  rationale: Ang maramihang pautos na דְּעוּ ay tuwirang panawagan sa mga nakikinig na kilalanin ang isang katotohanan. Ipinahahayag ng “kaya” ang inferensiyal na puwersa ng אֵפוֹא sa natural na modernong Tagalog.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: ang mahuhulog sa lupa
  rationale: Pinananatili ang matingkad na Hebreong idyoma na nagsasaad na walang bahagi ng pahayag ang mabibigo o mananatiling hindi natutupad. Ipinaliliwanag ang diwa sa talababa.
- source_word: מִדְּבַר יְהוָה
  choice: walang isa mang salita ni Yahweh
  rationale: Ipinahahayag ng partitive na מִן na walang kahit isang bahagi ng salita ni Yahweh ang mabibigo. Natural sa Tagalog ang “walang isa mang salita” at pinananatili nito ang singular na larawan ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: עַל בֵּית אַחְאָב
  choice: laban sa sambahayan ni Ahab
  rationale: Sa konteksto ng hatol, adversatibo ang עַל. Ang “sambahayan” ay nagpapanatili sa biblikal na larawan ng בית bilang angkan o dinastiya.
- source_word: וַיהוָה עָשָׂה אֵת אֲשֶׁר דִּבֶּר
  choice: Tinupad ni Yahweh ang sinabi niya
  rationale: Bagaman literal na “ginawa ... ang sinabi,” mas natural na ipinahahayag ng “tinupad” sa Tagalog ang ganap na pagsasakatuparan ng ipinahayag, nang hindi nagdaragdag ng bagong diwa.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: sa pamamagitan ng lingkod niyang si Elias
  rationale: Ang בְּיַד ay idyoma ng ahensiya o pamamagitan. Ang natural na “sa pamamagitan ng” ay malinaw na nagpapakitang si Elias ang tagapagdala ng pahayag.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang Tetragrammaton sa talata; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Katiyakan ng katuparan ng propesiya
  choice: Pinanatili sa pangunahing teksto ang larawang “mahuhulog sa lupa”
  alternative: “mabibigo” o “hindi matutupad”
  rationale: Pinananatili ng Hebreong idyoma ang matingkad na larawan at ang katiyakan ng katuparan, habang nililinaw ng talababa ang kahulugan nito.
- issue: Gampanin ni Elias sa pahayag
  choice: sa pamamagitan ng lingkod niyang si Elias
  alternative: sa kamay ng lingkod niyang si Elias
  rationale: 'Ipinakikita ng בְּיַד ang instrumental na pamamagitan: kay Yahweh nagmula ang salita at si Elias ang lingkod na ginamit upang ihayag iyon.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na “sambahayan” para sa angkan o dinastiya at ang Hebreong larawan ng salitang hindi “nahuhulog sa lupa,” ngunit nilinaw ito sa talababa. Ginamit ang tradisyonal at madaling makilalang anyong Filipino na “Elias” para sa אֵלִיָּהוּ.
