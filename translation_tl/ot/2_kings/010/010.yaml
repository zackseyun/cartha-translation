  naturalness: Malinaw at marangal ang register. Mas natural at mas tuwiran sa modernong Filipino ang “wala ni isang salita ... ang mahuhulog” kaysa “walang isa mang salita ... ang mahuhulog.”
  terminology: Wasto at pare-pareho ang “Yahweh,” “sambahayan,” at “Elias.” Ang “sambahayan” ay angkop na pananatili ng biblikal na larawan ng בית sa kahulugang angkan o dinastiya.
