base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: tl
  text: Nang matapos niyang ihandog ang handog na sinusunog, sinabi ni Jehu sa mga bantay at mga opisyal, “Pumasok kayo at patayin sila. Huwag ninyong hayaang may sinumang lalaki na makalabas.” Kaya pinatay nila ang mga ito sa pamamagitan ng talim ng espada. Itinapon sila ng mga bantay at mga opisyal, at nagpatuloy ang mga ito hanggang sa panloob na santuwaryo ng bahay ni Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hanggang sa lungsod/kuta ng bahay ni Baal.” Maaaring tumukoy ang parirala sa isang nakukutaang panloob na lugar o sagradong bahagi ng kompleks ng templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: Nang matapos niyang ihandog ang handog na sinusunog
  rationale: Ang כְּ na kasunod ng infinitive construct ay nagpapahayag ng panahon. Ang “ihandog ang handog na sinusunog” ay natural sa modernong Tagalog at pinananatili ang tiyak na uri ng hain na tinutukoy ng עֹלָה.
- source_word: לָרָצִים
  choice: sa mga bantay
  rationale: Literal na “mga mananakbo” ang רָצִים, ngunit sa kontekstong maharlika at militar tumutukoy ito sa mga tauhang nagsisilbing bantay o tagapaghatid. Mas malinaw at natural dito ang “mga bantay.”
- source_word: לַשָּׁלִשִׁים
  choice: sa mga opisyal
  rationale: Maaaring tumukoy ang שָׁלִישׁ sa isang opisyal ng hukbo o opisyal na kaugnay ng karwahe. Hindi ipinapalagay ng pangkalahatang “mga opisyal” ang isang tiyak na ranggo.
- source_word: בֹּאוּ הַכּוּם
  choice: Pumasok kayo at patayin sila
  rationale: Sa konteksto, inuutusan ang mga tauhan na pumasok at magsagawa ng nakamamatay na paglusob. Bagaman pangunahing kahulugan ng נכה ang “hampasin,” malinaw na pagpatay ang resulta rito.
- source_word: אִישׁ אַל יֵצֵא
  choice: Huwag ninyong hayaang may sinumang lalaki na makalabas
  rationale: May distributibong diwa ang isahang אִישׁ at tahasang tumutukoy sa lalaki; pinananatili iyon sa salin.
- source_word: לְפִי חָרֶב
  choice: pinagtataga
  rationale: Ang idyomang Hebreo ay literal na “sa bibig/talim ng tabak.” Ipinahahayag ng “pinagtataga” ang marahas at nakamamatay na paggamit ng tabak nang natural sa Tagalog.
- source_word: וַיַּשְׁלִכוּ
  choice: itinapon ... ang mga bangkay sa labas
  rationale: Walang tahasang layon sa Hebreo. Mula sa agarang konteksto, malamang na ang mga napatay ang itinapon; nilinaw bilang “mga bangkay” upang maging natural at madaling maunawaan sa Tagalog.
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: hanggang sa pinakaloob na bahagi ng templo ni Baal
  rationale: Karaniwang “lungsod” ang עִיר, ngunit sa arkitektural na kontekstong ito maaari itong tumukoy sa isang nakukutaang panloob na lugar. Ang “pinakaloob na bahagi” ay angkop sa kilos sa loob ng kompleks, habang itinatala sa talababa ang tunay na leksikal na kalabuan.
