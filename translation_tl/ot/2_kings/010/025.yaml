translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “templo ni Baal” bilang natural na katumbas ng “bahay ni Baal,” at iniwasan ang makalumang “handog na susunugin” pabor sa mas malinaw na “handog na sinusunog.”
