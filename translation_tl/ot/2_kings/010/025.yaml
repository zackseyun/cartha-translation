revisions:
- from: Nang matapos niyang ihandog ang handog na sinusunog, sinabi ni Jehu sa mga bantay at sa mga opisyal, “Pumasok kayo at patayin sila. Huwag ninyong hayaang may sinumang lalaki na makalabas.” Kaya pinagtataga nila ang mga iyon, at itinapon ng mga bantay at mga opisyal ang mga bangkay sa labas. Pagkatapos, nagpatuloy sila hanggang sa pinakaloob na bahagi ng templo ni Baal.[a]
  to: Nang matapos niyang ihandog ang handog na sinusunog, sinabi ni Jehu sa mga bantay at mga opisyal, “Pumasok kayo at patayin sila. Huwag ninyong hayaang may sinumang lalaki na makalabas.” Kaya pinatay nila ang mga ito sa pamamagitan ng talim ng espada. Itinapon sila ng mga bantay at mga opisyal, at nagpatuloy ang mga ito hanggang sa panloob na santuwaryo ng bahay ni Baal.[a]
  rationale: Inayos ang pandiwang salaysay sa nakaraang aspekto at isinalin ang idyomang Hebreo para sa paggamit ng espada. Pinanatili ang marahas na kahulugan na malinaw sa konteksto nang hindi nagdaragdag ng doktrinal o historikal na pagpapakahulugan. Ang huling parirala ay nananatiling kontekstuwal na salin, na may talababa para sa literal at pinagtatalunang kahulugan ng עִיר.
