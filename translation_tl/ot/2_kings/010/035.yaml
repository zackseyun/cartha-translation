- from: At namatay si Jehu at napisan sa kanyang mga ninuno, at inilibing nila siya sa Samaria. Ang anak niyang si Jehoahaz ang naging hari bilang kahalili niya.
  to: At namatay si Jehu at sumama sa kanyang mga ninuno, at inilibing nila siya sa Samaria. Ang kanyang anak na si Jehoahaz ang naging hari kapalit niya.
  rationale: Pinalitan ang hindi malinaw na “napisan” ng “sumama,” isang mas nauunawaang pormulang Tagalog na pinananatili ang ugnayang “kasama ng kanyang mga ninuno” ng Hebreong teksto. Pinanatili ang aktibong ngunit di-tiyak na “inilibing nila siya” at ang kahulugan ng paghalili sa trono.
