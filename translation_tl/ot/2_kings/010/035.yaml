  naturalness: Mas natural at malinaw ang “sumama sa kanyang mga ninuno” bilang marangal na pormula kasunod ng “namatay.” Ang “ang kanyang anak na si Jehoahaz” ay maayos na paglalatag ng pangalan at ugnayan, at ang “kapalit niya” ay tuwirang natural para sa paghalili sa trono.
