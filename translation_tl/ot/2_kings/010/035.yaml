base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: tl
  text: At namatay si Jehu at sumama sa kanyang mga ninuno, at inilibing nila siya sa Samaria. Ang kanyang anak na si Jehoahaz ang naging hari kapalit niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: namatay ... at napisan sa kanyang mga ninuno
  rationale: Ang buong parirala ay isang karaniwang Hebreong pormula sa ulat ng pagkamatay ng hari. Pinananatili ng “napisan sa kanyang mga ninuno” ang ugnayang pangkanuno, habang nililinaw ng “namatay” ang kahulugang idyomatiko sa natural na modernong Tagalog.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang nasa ikatlong panauhang maramihan at hindi tinutukoy kung sino ang mga naglibing.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang ב ay lokatibo rito; natural sa Tagalog ang “sa Samaria” para sa lugar ng paglilibing.
- source_word: וַיִּמְלֹךְ
  choice: naging hari
  rationale: Sa pormula ng paghalili, ipinahihiwatig ng מלך ang pagluklok o pagsisimula bilang hari, hindi lamang ang kabuuang panahon ng paghahari.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Malinaw at natural nitong ipinapahayag ang paghalili sa tungkulin ng naunang hari.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga saling Bibliya sa Filipino.
