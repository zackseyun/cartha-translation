  register: Makabago ngunit marangal na Filipino. Ginamit ang “kinatay” upang mapanatili ang dahas ng orihinal, at ang pangkalahatang “mga sisidlan” upang hindi paliitin ang hindi tiyak na kahulugan ng terminong Hebreo.
