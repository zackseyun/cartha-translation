base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: tl
  text: Nang dumating sa kanila ang sulat, kinuha nila ang mga anak na lalaki ng hari at kinatay ang pitumpung lalaki. Inilagay nila ang mga ulo ng mga ito sa mga sisidlan[a] at ipinadala ang mga iyon sa kanya sa Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga palayok,” “mga banga,” o “mga basket.” Malawak ang kahulugan ng salitang Hebreo at hindi matiyak ang eksaktong uri ng sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: ang sulat
  rationale: Sa konteksto, tumutukoy ito sa nakasulat na liham na ipinadala ni Jehu; natural at tiyak ang “sulat” sa makabagong Tagalog.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: mga anak na lalaki ng hari
  rationale: Pinananatili nito ang tahasang panlalaking kahulugan at ang ugnayang pampamilya at pandinastiya.
- source_word: וַיִּשְׁחֲטוּ
  choice: kinatay
  rationale: Ipinahahayag ng pandiwa ang marahas na pagpatay o pagkatay; hindi pinapahina ng saling ito ang kalupitan ng tagpo.
- source_word: שִׁבְעִים אִישׁ
  choice: pitumpung lalaki
  rationale: Ang אִישׁ ay ginagamit dito sa pagbilang sa mga lalaking anak ng hari.
- source_word: רָאשֵׁיהֶם
  choice: mga ulo ng mga ito
  rationale: Tuwirang pinananatili ang literal at marahas na detalye ng Hebreo.
- source_word: בַּדּוּדִים
  choice: sa mga sisidlan
  rationale: Maaaring tumukoy ang דּוּד sa iba't ibang uri ng lalagyan, gaya ng palayok, banga, o basket. Pinananatili ng “sisidlan” ang leksikal na lawak nang hindi nagpapasya sa materyal o anyo nito.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo; si Jehu ang tinutukoy ayon sa kalapit na konteksto.
- source_word: יִזְרְעֶאלָה
  choice: sa Jezreel
  rationale: Ipinahihiwatig ng hulaping pandireksiyon ang patungong Jezreel; natural itong ipinapahayag sa Tagalog sa pariralang “sa Jezreel” kasunod ng “ipinadala.”
