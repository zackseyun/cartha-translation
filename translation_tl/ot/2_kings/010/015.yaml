  to: Mula roon ay nagpatuloy siya at natagpuan niya si Jehonadab na anak ni Rechab, na papalapit upang salubungin siya. Binati niya siya[a] at sinabi, “Tuwid ba ang puso mo, kung paanong ang puso ko ay kasama ng puso mo?”[b] Sumagot si Jehonadab, “Oo, oo.”[c] Sinabi ni Jehu, “Iabot mo sa akin ang iyong kamay.” Kaya iniabot niya ang kanyang kamay, at isinakay siya ni Jehu sa kanyang karwahe.
