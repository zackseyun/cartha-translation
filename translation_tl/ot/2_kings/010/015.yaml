  source_fidelity: 'Kailangang iwasto ang sagot ni Jehonadab: ang יֵשׁ וָיֵשׁ ay isang mariing pagsang-ayon (“Oo, oo”), hindi isang tahasang pahayag na “tapat.” Ang tanong ay masyadong ipinaliwanag sa pangunahing teksto sa pamamagitan ng pagdaragdag ng “sa akin” at “sa iyo”; dapat panatilihin ang mas bukas na larawan ng puso at ang ugnayang “ang puso ko [ay] kasama ng puso mo.”'
  naturalness: Natural ang kabuuang salaysay. Ang “sa karwahe nito” ay hindi angkop na panghalip-pantaglay para kay Jehu at maaaring lumabo ang tinutukoy; “sa kanyang karwahe” ang likas at malinaw na anyo. Ang inuulit na “Oo, oo” ay likas sa mariing pagsang-ayon sa diyalogo.
  terminology: Gamitin ang “Rechab,” na mas malapit sa Hebreong רֵכָב at umaayon sa English POB audit trail. Ang “Jehonadab,” “Jehu,” at “karwahe” ay angkop. Pinananatili ang “binati” para sa pandiwang ברך sa tagpo ng pagtatagpo, kasama ang literal na alternatibo sa talababa.
