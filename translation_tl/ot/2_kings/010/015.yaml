base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: tl
  text: Mula roon ay nagpatuloy siya at natagpuan niya si Jehonadab na anak ni Rechab, na papalapit upang salubungin siya. Binati niya siya[a] at sinabi, “Tuwid ba ang puso mo, kung paanong ang puso ko ay kasama ng puso mo?”[b] Sumagot si Jehonadab, “Oo, oo.”[c] Sinabi ni Jehu, “Iabot mo sa akin ang iyong kamay.” Kaya iniabot niya ang kanyang kamay, at isinakay siya ni Jehu sa kanyang karwahe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Pinagpala niya siya.” Ang pandiwang Hebreo ay maaaring mangahulugang “pagpalain,” ngunit sa tagpong ito ng pagtatagpo ay malamang na tumutukoy ito sa pagbati.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Tuwid ba ang puso mo, kung paanong ang puso ko ay kasama ng puso mo?” Maaaring ipahayag ng pananalita ang katapatan sa isa’t isa o pagkakatugma ng layunin.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “Mayroon, at mayroon”—isang inuulit na pormula ng mariing pagsang-ayon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Mula roon ay nagpatuloy siya
  rationale: Ipinahahayag ng parirala ang pagpapatuloy ng kilos mula sa naunang lugar; natural sa Filipino ang “nagpatuloy” habang pinananatili ang daloy ng salaysay.
- source_word: וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב
  choice: natagpuan niya si Jehonadab na anak ni Recab
  rationale: Pinananatili ng “natagpuan” ang karaniwang kahulugan ng מצא sa halip na gawing mas malayang “nakasalubong.”
- source_word: לִקְרָאתוֹ
  choice: na papalapit upang salubungin siya
  rationale: Ipinakikita nito na si Jehonadab ang kumikilos patungo kay Jehu para sa isang pagtatagpo.
- source_word: וַיְבָרְכֵהוּ
  choice: Binati niya ito
  rationale: Bagaman pangunahing nangangahulugang “pagpalain” ang ברך, maaari itong tumukoy sa pagbati sa ganitong tagpo ng pagtatagpo; inilalagay sa talababa ang literal na alternatibo.
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: Tapat ba ang puso mo sa akin, kung paanong tapat sa iyo ang puso ko?
  rationale: Ang “tapat” ay likas na Filipino para sa יָשָׁר sa kontekstong sumusubok sa katapatan at pagkakaisa ng layunin. Pinananatili ang metapora ng puso at ang magkatumbas na ugnayan ng dalawang panig.
- source_word: יֵשׁ וָיֵשׁ
  choice: Oo, tapat nga
  rationale: Isinasalin nito bilang mariing pagsang-ayon ang inuulit na pormula, nang hindi gumagamit ng hindi likas na “mayroon at mayroon” sa Filipino.
- source_word: תְּנָה אֶת־יָדֶךָ
  choice: Iabot mo sa akin ang iyong kamay
  rationale: Ang pag-abot ng kamay ay angkop na Filipino para sa utos at naghahanda sa kasunod na pisikal na kilos, na maaari ring magpahiwatig ng pagkakasundo o pangako.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: isinakay siya ni Jehu sa karwahe nito
  rationale: Ang Hiphil ng עלה ay nagpapahiwatig ng pagpapasakay o pagpapaakyat. Nililinaw ng “nito” na ang tinutukoy ay ang karwahe ni Jehu, gaya ng ipinahihiwatig ng אֵלָיו.
theological_decisions:
- issue: Ang pagsusuri ni Jehu sa “puso” ni Jehonadab
  choice: Isinalin bilang katapatan sa isa't isa nang hindi tinutukoy kung ito ay lubos na moral na katuwiran o pagkakaisa lamang sa layunin.
  alternative: “Tuwid ba ang puso mo, kung paanong ang puso ko ay kasama ng puso mo?”
  rationale: Maaaring magpahiwatig ang Hebreo ng moral na katuwiran, personal na katapatan, o pagkakatugma ng layunin. Pinili ang natural na “tapat,” at pinanatili sa talababa ang mas literal na anyo upang hindi gawing tiyak ang hindi tiyak sa teksto.
- issue: Hindi tahasang inuulit sa Hebreo ang pangalan ni Jehu sa huling mga sugnay
  choice: Ginamit ang pangalang “Jehu” upang maiwasan ang kalituhan sa dalawang lalaking tinutukoy ng magkakasunod na panghalip.
  alternative: Gumamit lamang ng “siya” gaya ng anyo ng Hebreo.
  rationale: Paglilinaw lamang ito ng referent at hindi pagdaragdag ng bagong kilos o teolohikal na interpretasyon.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “karwahe” bilang pamilyar na katawagan sa sasakyang pandigma ng sinaunang hari. Ang mga pangalan ay tinumbasan bilang Jehonadab at Recab, at nilinaw lamang ang mga panghalip kung kailangan upang maiwasan ang kalituhan.
