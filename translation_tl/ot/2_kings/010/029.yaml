  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: tl
  text: Ngunit hindi tinalikuran[a] ni Jehu ang mga kasalanan ni Jeroboam na anak ni Nebat, na nag-udyok sa Israel na magkasala—ang mga gintong guya na nasa Bethel at Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi humiwalay mula sa pagsunod sa mga iyon”; literal na, “hindi lumihis mula sa likuran nila.”
    reason: Ipinapakita ang alternatibong literal na diwa ng idyomang Hebreo na לֹא סָר מֵאַחֲרֵיהֶם.
lexical_decisions:
- source_word: רַק
  choice: Ngunit
  rationale: Sa konteksto, ipinakikilala nito ang isang mahalagang pasubali o salungat na pagsusuri sa mga naunang ginawa ni Jehu. Mas natural sa modernong Tagalog ang “Ngunit” kaysa sa literal na “Tanging.”
- source_word: חֲטָאֵי
  choice: mga kasalanan
  rationale: Tuwirang tumutukoy sa partikular na mga kasalanang kaugnay ng patakarang panrelihiyon ni Jeroboam.
- source_word: הֶחֱטִיא
  choice: naging dahilan upang magkasala
  rationale: Pinananatili ang causative na diwa ng Hiphil nang hindi ipinahihiwatig na sapilitang inalis ang pananagutan ng Israel.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: hindi tinalikuran
  rationale: Natural na Tagalog para sa idyomang Hebreo na literal na nangangahulugang hindi lumihis mula sa pagsunod sa mga iyon.
- source_word: עֶגְלֵי הַזָּהָב
  choice: mga gintong guya
  rationale: Malinaw at kongkretong katawagan sa mga bagay na sinasamba, at nagsisilbing paliwanag sa “mga kasalanan ni Jeroboam.”
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: na nasa Bethel at Dan
  rationale: Natural na pagtukoy sa lokasyon ng dalawang guya; hindi na kailangang ulitin ang “nasa” sa ikalawang pangalan.
- source_word: בֵּית אֵל
  choice: Bethel
  rationale: Karaniwang anyo ng pangalang pook sa modernong saling Filipino.
- source_word: דָּן
  choice: Dan
  rationale: Karaniwang transliterasyon ng pangalang pook.
theological_decisions:
- issue: Ugnayan ng “mga kasalanan ni Jeroboam” at “mga gintong guya”
  choice: Ginamit ang em dash upang ipakitang nililinaw ng “mga gintong guya” kung ano ang tinutukoy na mga kasalanan.
  alternative: Maaaring unawain ang parirala bilang panibagong paglilinaw matapos ang bahagyang putol na sintaks.
  rationale: Pinananatili nito ang appositional at nagpapaliwanag na puwersa ng Hebreo nang hindi nagdaragdag ng interpretasyong wala sa teksto.
- issue: Causative na pananagutan sa הֶחֱטִיא
  choice: “naging dahilan upang magkasala ang Israel”
  alternative: “inakay ang Israel sa pagkakasala” o “pinagkasala ang Israel”
  rationale: Ang napiling anyo ay malinaw na causative ngunit hindi labis na nagpapasya kung paano isinagawa ni Jeroboam ang impluwensiya o kung gaano kalaya ang pakikibahagi ng Israel.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “tinalikuran” bilang natural na katumbas ng idyomang Hebreo, at em dash upang mapanatili ang paliwanag na ugnayan nang hindi pinapakinis nang labis ang sintaks.
