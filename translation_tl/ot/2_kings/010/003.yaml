  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: tl
  text: Kaya pumili kayo ng pinakamabuti at pinakamatuwid sa mga anak ng inyong amo,[a] iluklok ninyo siya sa trono ng kanyang ama, at ipaglaban ninyo ang sambahayan ng inyong amo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tingnan ninyo kung sino ang mabuti at matuwid sa mga anak ng inyong amo.” Literal na “tingnan” ang pandiwang Hebreo, ngunit dito ay may diwa ng pagsusuri at pagpili.
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan” dito ay tumutukoy sa maharlikang pamilya o dinastiya, hindi lamang sa isang gusali.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: pumili kayo
  rationale: Bagaman literal na nangangahulugang “tingnan ninyo,” sa kontekstong ito tumutukoy ang pandiwa sa pagsusuri at pagpili ng isang kandidato.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: ang pinakamabuti at pinakamatwid
  rationale: Dahil pipili ng isa mula sa isang pangkat, likas sa Filipino ang pasukdol na anyo. Pinananatili ng “pinakamatwid” ang moral na diwa ng יָשָׁר nang hindi ito nililimitahan sa pagiging praktikal na angkop lamang.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: sa mga anak ng inyong amo
  rationale: Ipinahihiwatig ng מִן ang pagpili mula sa pangkat ng mga anak. Ang “amo” ay tumutukoy rito sa taong maharlikang pinaglilingkuran, hindi sa Diyos.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: iluklok ninyo siya sa trono ng kanyang ama
  rationale: Ang “iluklok” ay natural at marangal na salin ng paglalagay sa trono, at malinaw na nagpapahiwatig ng pagtatalaga bilang hari.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: at ipaglaban ninyo ang sambahayan ng inyong amo
  rationale: Ipinahahayag ng “ipaglaban” ang pakikipaglaban alang-alang sa isang panig. Pinananatili ng “sambahayan” ang talinghagang “bahay” habang saklaw ang maharlikang pamilya at dinastiya.
theological_decisions:
- issue: Pagpapakahulugan sa אֲדֹנֵיכֶם
  choice: inyong amo
  alternative: inyong panginoon
  rationale: Tao at haring pinaglilingkuran ang tinutukoy, hindi si YHWH. Iniiwasan ng “amo” ang kalituhan sa titulong karaniwang ginagamit para sa Diyos.
- issue: Saklaw ng בֵּית (“bahay”)
  choice: sambahayan
  alternative: dinastiya
  rationale: Ang tinutukoy ay ang maharlikang angkan o dinastiya, hindi lamang isang gusali. Pinananatili ng “sambahayan” ang larawan at ang mas malawak na kahulugan ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga anyong maramihan na “kayo” at “ninyo” ayon sa mga pandiwang Hebreo. Inilagay ang talababa [b] pagkatapos ng “sambahayan ng inyong amo,” ang pariralang talagang ipinapaliwanag nito.
