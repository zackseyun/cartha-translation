base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: tl
  text: Pagdating niya sa Samaria, pinatay niya ang lahat ng naiwan na kabilang sa sambahayan ni Ahab sa Samaria, hanggang sa tuluyan niya itong lipulin[a], ayon sa salita ni Yahweh na sinabi niya kay Elias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang hulapi sa “lipulin niya ito.” Maaaring kolektibo itong tumukoy sa sambahayan ni Ahab, sa halip na kay Ahab bilang indibidwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Pagdating niya sa Samaria
  rationale: Ipinahahayag ng sunod-sunod na anyong pasalaysay ang pagdating bago ang kasunod na kilos; natural sa modernong Tagalog ang temporal na sugnay na ito.
- source_word: וַיַּךְ
  choice: pinuksa niya
  rationale: Sa konteksto, ang נכה ay tumutukoy sa nakamamatay na pagpatay, hindi lamang pananakit. Ang “pinuksa” ay taimtim at malinaw.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: ang lahat ng natitira sa sambahayan ni Ahab
  rationale: Ang participle ay tumutukoy sa mga naiwan, at ang לְאַחְאָב ay nagmamarka ng kaugnayan kay Ahab. Nililinaw ng “sambahayan” ang kolektibong ugnayan sa dinastiya nang hindi ito ginagawang abstraktong “nalabi.”
- source_word: עַד הִשְׁמִידוֹ
  choice: hanggang sa tuluyan niya itong lipulin[a]
  rationale: Ang שׁמד ay nangangahulugang lubusang paglipol. Pinananatili ng “ito” ang isahang hulapi ng Hebreo at ang posibleng kolektibong pagtukoy nito sa sambahayan ni Ahab; ipinapaliwanag sa talababa ang ambiguwidad.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Pinananatili ng “salita” ang pormulang propetiko tungkol sa katuparan, at tuwirang isinasalin ang banal na pangalang יהוה bilang “Yahweh.”
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: na sinabi niya kay Elias
  rationale: Tuwirang isinasalin ang sugnay na pantukoy at pinananatili ang panghalip na tumutukoy kay Yahweh. “Elias” ang nakasanayang anyong Tagalog ng pangalan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at tipanang pangalan nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Referente ng isahang hulapi sa הִשְׁמִידוֹ
  choice: “ito,” na maaaring kolektibong tumukoy sa sambahayan ni Ahab
  alternative: “silang lahat,” na tumutukoy sa mga natitira; o “siya,” na tumutukoy kay Ahab
  rationale: Isahan at panlalaki ang hulapi sa Hebreo, ngunit malamang na kolektibo ang gamit. Pinananatili sa pangunahing teksto ang isahang anyo at inilalahad sa talababa ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang rehistro. Ginamit ang “sambahayan” para sa dinastiko at kolektibong ugnayan kay Ahab, at “pinuksa”/“lipulin” upang ihayag ang kabuuan at bigat ng karahasan sa teksto.
