base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: tl
  text: Giniba nila ang haliging bato ni Baal, at giniba nila ang bahay ni Baal[a] at ginawa nila itong palikuran hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, templo ni Baal. Literal na, “bahay ni Baal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: ibinagsak / giniba
  rationale: Ang נתץ ay tumutukoy sa marahas na paggiba ng isang gusali o bagay na panrelihiyon. Ang “ibinagsak” ay angkop sa haliging bato, samantalang ang “giniba” ay likas para sa templo.
- source_word: מַצְּבַת
  choice: haliging bato
  rationale: Ang מַצֵּבָה ay isang nakatayong bato o haliging ginagamit sa kulto. Nililinaw ng “haliging bato” ang materyal at anyo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- source_word: הַבָּעַל
  choice: ni Baal
  rationale: Ang בַּעַל dito ay pangalan o titulo ng diyos ng mga Cananeo, kaya pinanatili bilang Baal.
- source_word: בֵּית הַבַּעַל
  choice: templo ni Baal
  rationale: Bagaman literal na “bahay ni Baal,” ang בַּיִת sa kontekstong panrelihiyon ay tumutukoy sa santuwaryo o templo. Ang “templo” ang pinakamalinaw at pinakanatural sa modernong Tagalog.
- source_word: וַיְשִׂמֻהוּ
  choice: ginawa nila itong
  rationale: Ang שׂוּם na may ל ay nagpapahayag ng paggawa o pagtatalaga sa isang bagay upang maging iba; tuwiran at natural ang pariralang ito sa Tagalog.
- source_word: למחראות
  choice: palikuran
  rationale: Tumutukoy ang salita sa lugar para sa dumi ng tao. Malinaw, kasalukuyan, at hindi paligoy ang “palikuran,” at naipakikita nito ang sadyang paglapastangan sa dating templo.
- source_word: עַד הַיּוֹם
  choice: hanggang sa araw na ito
  rationale: Karaniwang Hebreong idyoma ito na nagsasaad na nagpapatuloy ang kalagayan hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Pagpapakahulugan sa בֵּית הַבַּעַל
  choice: templo ni Baal
  alternative: bahay ni Baal
  rationale: Ang literal na “bahay” ay maaaring magmukhang ordinaryong tirahan sa Tagalog. Tahasang ipinahihiwatig ng konteksto na ito ay gusaling sambahan, kaya mas malinaw ang “templo” nang hindi nagdaragdag ng doktrinal na pakahulugan.
- issue: Paglalarawan sa paglapastangan sa santuwaryo
  choice: palikuran
  alternative: tapunan ng dumi
  rationale: Ang “palikuran” ang tuwirang kahulugan na angkop sa konteksto at malinaw na nagpapanatili sa diin ng teksto sa ganap na paglapastangan sa lugar ng pagsamba kay Baal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang magkaibang pandiwang “ibinagsak” at “giniba” upang maging natural ayon sa kani-kanilang layon, kahit iisang Hebreong pandiwa ang pinagmulan. Iniwasan ang arkaikong “bahay ni Baal” dahil maaaring hindi agad maunawaang templo.
