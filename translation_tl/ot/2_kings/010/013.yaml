base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: tl
  text: Natagpuan ni Jehu ang mga kapatid ni Ahazias[a], na hari ng Juda, at tinanong sila, “Sino kayo?” Sumagot sila, “Kami ang mga kapatid ni Ahazias. Bumaba kami upang kumustahin[b] ang mga anak na lalaki ng hari at ang mga anak na lalaki ng reynang ina[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga kapatid ni Ahazias” ay maaari ring tumukoy sa malalapit niyang kamag-anak o mga kaangkan, hindi lamang sa mga kapatid na lalaki.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “upang alamin kung nasa mabuti silang kalagayan.”
    reason: lexical_alternative
  - marker: c
    text: Ang “reynang ina” ay salin ng Hebreong gebirah, isang titulo sa korte para sa ina ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: natagpuan
  rationale: Tuwirang ipinahihiwatig ng pandiwa ang pagkakita o pagkakatagpo ni Jehu sa kanila; natural at malapit sa Hebreo ang “natagpuan.”
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: mga kapatid ni Ahazias
  rationale: Pinananatili ang literal na katawagang “mga kapatid,” habang ipinapaliwanag sa talababa na maaari itong tumukoy sa mas malawak na kamag-anakan sa salaysay tungkol sa maharlikang angkan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Tuwiran at likas na salin ng titulong maharlika.
- source_word: מִי אַתֶּם
  choice: Sino kayo?
  rationale: Maikli, natural, at tumpak na katumbas ng tuwirang tanong sa Hebreo.
- source_word: וַנֵּרֶד
  choice: Bumaba kami
  rationale: Pinananatili ang hayag na kilos na pagbaba, malamang na may heograpikong diwa.
- source_word: לִשְׁלוֹם
  choice: upang kumustahin
  rationale: Sa kontekstong ito, ang idyoma ay tumutukoy sa pag-alam sa kalagayan o kapakanan ng isang tao; natural itong ipinahahayag sa modernong Filipino sa pandiwang “kumustahin.”
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: mga anak na lalaki ng hari
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng Hebreong בְּנֵי, na maaaring mawala kung “mga anak” lamang ang gagamitin.
- source_word: הַגְּבִירָה
  choice: inang reyna
  rationale: Sa konteksto ng korte ng Juda, isa itong opisyal na katawagan sa ina ng hari, hindi lamang sa isang marangal na babae.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: mga anak na lalaki ng inang reyna
  rationale: Pinananatili ang pagkakapantay ng parirala sa “mga anak na lalaki ng hari” at ang hiwalay na pagkakalahad nito sa Hebreo.
