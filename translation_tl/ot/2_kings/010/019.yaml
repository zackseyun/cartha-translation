  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: tl
  text: “Ngayon, ipatawag ninyo sa akin ang lahat ng propeta ni Baal, ang lahat ng sumasamba sa kanya, at ang lahat ng pari niya. Tiyaking walang sinumang lumiban,[a] sapagkat maghahandog ako ng malaking hain kay Baal. Ang sinumang lumiban ay hindi mabubuhay.” Ngunit ginawa ito ni Jehu sa pamamagitan ng panlilinlang,[b] upang lipulin ang mga sumasamba kay Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag may isang lalaking mawala.” Ang singular na panlalaking anyo sa Hebreo ay gamit na pangkalahatan; tumutukoy ito sa sinumang wala o lumiban sa pagtitipon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nang may katusuhan” o “sa pamamagitan ng pandaraya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: May tahasang temporal at discourse expression na וְעַתָּה. Ang “Kaya ngayon” ay natural sa Tagalog at nag-uugnay sa utos sa naunang pahayag.
- source_word: נְבִיאֵי הַבַּעַל
  choice: ang lahat ng propeta ni Baal
  rationale: Likas na Tagalog para sa construct chain at malinaw na tumutukoy sa mga propetang kaugnay ng kulto ni Baal.
- source_word: עֹבְדָיו
  choice: ang lahat ng sumasamba sa kanya
  rationale: Sa kontekstong panrelihiyon, mas malinaw ang “sumasamba” kaysa “naglilingkod,” bagaman maaari ring saklawin ng ugat ang paglilingkod.
- source_word: כֹּהֲנָיו
  choice: ang lahat ng pari niya
  rationale: Karaniwang salin ng kultikong katungkulan; ang hulaping panlalaki ay tumutukoy kay Baal.
- source_word: קִרְאוּ אֵלַי
  choice: ipatawag ninyo sa akin
  rationale: Ipinahahayag ng maramihang pautos ang pagpapatawag sa mga tao upang humarap kay Jehu.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: Tiyaking walang sinumang hindi dumalo
  rationale: Ang Niphal ng פקד dito ay tumutukoy sa pagiging wala o hindi nakadalo sa pagtitipon. Natural ang pahayag sa modernong Tagalog, habang itinatala sa talababa ang anyong panlalaki sa Hebreo.
- source_word: זֶבַח גָּדוֹל לִי לַבַּעַל
  choice: maghahandog ako ng malaking hain kay Baal
  rationale: Natural na binubuo sa Tagalog ang idiomatikong diwa na si Jehu ay may malaking haing ihahandog kay Baal.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: Ang sinumang hindi dumalo ay hindi mabubuhay
  rationale: Pinananatili ang parehong kahulugan ng פקד at ang tuwiran at mabigat na banta ng לֹא יִחְיֶה nang hindi ito ipinapaliwanag bilang tahasang pagpatay.
- source_word: בְעָקְבָה
  choice: sa pamamagitan ng panlilinlang
  rationale: Ipinahahayag ang pandaraya o tusong pakana nang hindi pinapahina ang negatibong pagtataya ng tagapagsalaysay.
- source_word: לְמַעַן הַאֲבִיד
  choice: upang lipulin
  rationale: Malakas at tuwirang ipinapahayag ang layunin ng Hiphil ng אבד; ang “lipulin” ay angkop sa ganap na pagwasak sa pangkat.
- source_word: עֹבְדֵי הַבָּעַל
  choice: ang mga sumasamba kay Baal
  rationale: Pinananatili ang kultikong diwa at ang pagkakapare-pareho sa naunang עֹבְדָיו.
theological_decisions:
- issue: Pagtataya ng tagapagsalaysay sa ginawa ni Jehu
  choice: Ngunit ginawa ito ni Jehu sa pamamagitan ng panlilinlang
  alternative: Ngunit tusong ginawa ito ni Jehu
  rationale: Tahasang inilalarawan ng Hebreo ang estratehiya bilang mapanlinlang. Pinananatili ng salin ang moral at teolohikal na tensiyon at hindi ipinagtatanggol ang ginawa ni Jehu.
- issue: Panlalaking anyo ng אִישׁ na ginagamit nang pangkalahatan
  choice: walang sinumang hindi dumalo
  alternative: walang isang lalaking hindi dumalo
  rationale: Sa modernong Tagalog, ang “sinuman” ang natural na pangkalahatang pahayag. Hindi nito ipinapalagay na babae ang kabilang sa pangkat; itinatala ng talababa na singular masculine ang porma ng Hebreo.
- issue: Banta sa mga hindi dadalo
  choice: ay hindi mabubuhay
  alternative: ay papatayin
  rationale: Ang napiling salin ay malapit sa tahasang Hebreong לֹא יִחְיֶה at pinananatili ang banta nang hindi ginagawang mas tiyak ang paraan kaysa sa source.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari” at “hain” bilang karaniwang salitang biblikal ngunit madaling maunawaan. Ang “Kaya ngayon” ay kumakatawan sa tahasang וְעַתָּה sa WLC, at hindi inalis bilang simpleng idinagdag na discourse marker.
