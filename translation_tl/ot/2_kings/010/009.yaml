base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: tl
  text: Kinaumagahan, lumabas siya at tumayo, at sinabi niya sa buong bayan, “Wala kayong kasalanan[a]. Tingnan ninyo, nakipagsabwatan ako laban sa aking panginoon at pinatay ko siya; ngunit sino ang pumatay sa lahat ng ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Matuwid kayo” o “Kayo ang nasa tama.” Ang Hebreo ay maaaring tumukoy sa pagiging matuwid o sa kawalan ng pananagutan; sa kontekstong ito, malamang na hudisyal ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Kinaumagahan
  rationale: Likas at malinaw na salin ng pormulang pasalaysay; ipinahihiwatig ng anyong Filipino ang pagdating ng umaga nang hindi nagiging kahoy ang pananalita.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: lumabas siya at tumayo sa harap
  rationale: Pinananatili ang magkasunod na kilos. Idinagdag ang “sa harap” bilang likas na Filipino upang ipakita ang pampublikong tindig niya sa harap ng bayan, nang hindi binabago ang diwa.
- source_word: כָּל הָעָם
  choice: buong bayan
  rationale: Sa konteksto ng pampublikong pagtitipon at pahayag, natural na tumutukoy ito sa mga taong naroon bilang sambayanan, hindi sa bawat indibidwal nang walang pasubali.
- source_word: צַדִּקִים אַתֶּם
  choice: Wala kayong kasalanan
  rationale: 'Ang צַדִּיק dito ay may hudisyal o pampublikong diwa: ipinakikitang hindi sila ang may pananagutan. Mas natural ito sa Filipino kaysa “matuwid kayo,” habang inilalagay sa talababa ang tunay na alternatibo.'
- source_word: הִנֵּה
  choice: Ako ang
  rationale: Sa pangungusap na ito, ang הִנֵּה ay nagbibigay-diin sa pag-amin ni Jehu. Ang pokus na “Ako ang” ay natural na naghahatid ng diin sa Filipino kaysa literal na “Tingnan ninyo.”
- source_word: קָשַׁרְתִּי עַל
  choice: nakipagsabwatan laban sa
  rationale: Tumpak na inilalarawan ang pampulitikang sabwatan laban sa isang pinuno.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Tumutukoy sa haring pinaglilingkuran ni Jehu, hindi sa Diyos. Ang maliit na titik at konteksto ang naglilinaw sa gamit.
- source_word: וָאֶהְרְגֵהוּ
  choice: pumatay sa kanya
  rationale: Payak, makabago, at tuwirang katumbas ng pandiwang הרג.
- source_word: וּמִי הִכָּה
  choice: Ngunit sino ang pumatay
  rationale: Ang pangatnig ay may salungat na puwersa sa retorikal na tanong. Sa konteksto, nakamamatay ang paghampas kaya natural ang “pumatay.”
- source_word: כָּל אֵלֶּה
  choice: lahat ng mga ito
  rationale: Pinananatili ang bahagyang di-tiyak na demonstratibo ng Hebreo; malinaw sa kalapit na konteksto kung sino ang tinutukoy.
theological_decisions:
- issue: Ang katayuan ng mga kausap sa צַדִּקִים אַתֶּם
  choice: Wala kayong kasalanan
  alternative: Matuwid kayo / Kayo ang nasa tama
  rationale: Hindi ito pangkalahatang pahayag tungkol sa moral na katuwiran nila kundi retorikal at pampublikong pag-aalis ng pananagutan kumpara sa sariling pag-amin ni Jehu. Pinananatili sa talababa ang leksikal na lawak upang hindi tuluyang isara ang ambigwidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Iniwasan ang makalumang “masdan” at ang posibleng teolohikal na maling pagbasa sa “Panginoon” sa pamamagitan ng maliit na titik. Ang retorikal na pag-amin at tanong ni Jehu ay pinanatiling matalim at tuwiran.
