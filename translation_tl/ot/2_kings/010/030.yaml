base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Jehu, “Dahil mahusay mong ginawa ang tama sa aking paningin, at ginawa mo sa sambahayan ni Ahab ang lahat ng nasa puso ko, ang iyong mga anak hanggang sa ikaapat na salinlahi[a] ay uupo sa trono ng Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak hanggang sa ikaapat na salinlahi,” isang idyomang tumutukoy sa dinastiyang magpapatuloy sa loob ng apat na salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng tetragrammaton, alinsunod sa anyo ng pinanggalingang teksto.
- source_word: יַעַן אֲשֶׁר
  choice: Dahil
  rationale: Likas at malinaw na ipinakikita nito ang ugnayang sanhi na nagpapakilala sa dahilan ng pahayag ng Diyos.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: mahusay mong isinagawa ang tama sa aking paningin
  rationale: Ipinahahayag ng Hiphil ng יטב ang pagsang-ayon sa pagkakagawa ni Jehu, habang pinananatili ng “sa aking paningin” ang Hebreong pormula ng banal na pagtataya.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: ang lahat ng nasa puso ko
  rationale: Pinananatili ang metapora ng לֵבָב, na sa konteksto ay tumutukoy sa kalooban o layunin, nang hindi ito nililimitahan sa damdamin lamang.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: ginawa mo sa sambahayan ni Ahab
  rationale: Ang “sambahayan” ay nagpapanatili sa larawan ng בַּיִת at maaaring tumukoy sa pamilya o dinastiya ni Ahab; hindi nito labis na tinutukoy ang eksaktong paraan ng paghatol.
- source_word: בְּנֵי רְבִעִים
  choice: ang iyong mga anak hanggang sa ikaapat na salinlahi
  rationale: Nililinaw nito ang Hebreong idyoma bilang pangako ng apat na salinlahi ng dinastikong paghalili, habang pinananatili ang “mga anak” ng teksto.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: ay uupo sa trono ng Israel
  rationale: Pinananatili ang maharlikang larawang “umupo sa trono” sa halip na palitan lamang ito ng “maghari”; naipahihiwatig na ng “iyong mga anak” ang dinastikong diwa ng לְךָ.
theological_decisions:
- issue: Saklaw ng pagsang-ayon ng Diyos sa mga ginawa ni Jehu
  choice: Tuwirang pinanatili ang papuri ng Diyos sa ginawa ni Jehu sa sambahayan ni Ahab.
  alternative: Palambutin ang papuri, o palawakin ito bilang ganap na pagsang-ayon sa buong paghahari at pagkatao ni Jehu.
  rationale: Malinaw na pinupuri ng Hebreo ang pagsasakatuparan ni Jehu ng layunin ng Diyos laban sa sambahayan ni Ahab, ngunit hindi sinasabi ng talata na sinang-ayunan ang lahat ng ginawa niya. Pinananatili ng salin ang teolohikal na tensiyong ito nang walang dagdag na paliwanag sa mismong teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga Hebreong larawang “sa aking paningin,” “nasa puso ko,” at “uupo sa trono,” ngunit inayos ang pangungusap upang maging natural sa Tagalog.
