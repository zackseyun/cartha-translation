base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: tl
  text: Pagkatapos, tinipon ni Jehu ang buong bayan at sinabi sa kanila[a], “Kaunti lamang ang paglilingkod ni Ahab kay Baal[b]; si Jehu ay maglilingkod sa kanya nang husto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa konteksto, may kabalintunaan ang sinabi ni Jehu: sinasabi niyang maglilingkod siya nang husto kay Baal, ngunit ipinakikita ng salaysay na pakana niya ito upang tipunin ang mga sumasamba kay Baal.'
    reason: cross_reference
  - marker: b
    text: Maaari ring, “Kaunti lamang ang pagsamba ni Ahab kay Baal; sasamba si Jehu sa kanya nang husto.” Ang pandiwang Hebreo para sa “maglingkod” ay ginagamit din para sa pagsamba o paglilingkod na panrelihiyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: tinipon
  rationale: Ang קבץ ay tumutukoy sa pagsasama-sama ng mga tao; natural at tuwiran sa makabagong Tagalog ang “tinipon.”
- source_word: כָּל הָעָם
  choice: ang buong bayan
  rationale: Saklaw nito ang lahat ng mga taong tinutukoy sa tagpo. Mas natural dito ang “buong bayan” kaysa sa literal ngunit maaaring mabigat na “lahat ng taong-bayan.”
- source_word: עָבַד אֶת הַבַּעַל
  choice: ang paglilingkod ... kay Baal
  rationale: Ang עבד kapag ang layon ay isang diyos ay tumutukoy sa paglilingkod na panrelihiyon. Pinananatili ng “paglilingkod” ang leksikal na larawan, habang nililinaw ng “kay Baal” ang kaugnayan.
- source_word: מְעָט
  choice: kaunti lamang
  rationale: Nagsasaad ito ng antas at inihahanda ang mariing pagsalungat sa הַרְבֵּה. Ang “lamang” ay natural sa Tagalog ngunit hindi binabago ang diwa.
- source_word: יַעַבְדֶנּוּ
  choice: maglilingkod sa kanya
  rationale: Ang hulaping panghalip ay tumutukoy kay Baal. Pinananatili ang panghalip at ang aspektong inaasahan o ipinahahayag para sa hinaharap.
- source_word: הַרְבֵּה
  choice: nang lubos
  rationale: Gumaganap itong pang-abay na kasalungat ng מְעָט. Ang “nang lubos” ay marangal at natural, at hindi tahasang nagdaragdag ng komparatibong “higit.”
- source_word: יֵהוּא
  choice: Jehu
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Itinuturing sa Tagalog ang Baal bilang pangalang pantangi, kaya hindi isinama ang artikulong Hebreo.
theological_decisions:
- issue: Ang pahayag ni Jehu na maglilingkod siya kay Baal
  choice: Isinalin ang sinabi ni Jehu nang tuwiran, nang walang pahiwatig sa pangunahing teksto na ito ay pakana.
  alternative: “Nagkunwari si Jehu na maglilingkod siya kay Baal” o iba pang saling tahasang nagsasaad ng panlilinlang.
  rationale: Tuwirang iniuulat ng Hebreo ang sinabi ni Jehu. Ipinakikita ng kasunod na salaysay na isa itong pakana, ngunit hindi iyon dapat ipasok sa mismong pananalita ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maigsi at mariing paghahambing na “kaunti lamang ... nang lubos,” pati ang panghalip na tumutukoy kay Baal. Ang mga talababa ay minarkahan sa pangunahing teksto bilang [a] at [b].
