  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Jehu, “Italaga ninyo ang isang banal na pagtitipon para kay Baal.” Kaya ipinahayag nila ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: קַדְּשׁוּ
  choice: Magdaos kayo ng isang banal
  rationale: Sa pagsama sa עֲצָרָה, ipinahihiwatig nito ang pormal na pagtatalaga at pagpapatawag ng isang pagtitipong panrelihiyon. Ang “banal” ay nagpapanatili sa ritwal na diwa nang natural sa Tagalog.
- source_word: עֲצָרָה
  choice: pagtitipon
  rationale: Tumutukoy ito sa isang pormal na kapulungang panrelihiyon. Kasama ng “banal,” malinaw ang kultikong katangian nito nang hindi nagiging mabigat ang pananalita.
- source_word: לַבַּעַל
  choice: para kay Baal
  rationale: 'Ipinapakita ng ל ang kaugnayan o layunin: ang pagtitipon ay para sa pagpaparangal o pagsamba kay Baal.'
- source_word: וַיִּקְרָאוּ
  choice: Kaya ipinahayag nila ito
  rationale: Sa kontekstong ito, ang קרא ay pampublikong pagpapahayag o pagpapatawag. Ipinapakita ng “Kaya” na isinagawa ang utos, at ang “ito” ay likas na tumutukoy sa naunang pagtitipon.
