translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Isinalin ang pinagsamang קַדְּשׁוּ עֲצָרָה bilang “magdaos ... ng isang banal na pagtitipon” upang maipahayag ang ritwal na pagtatalaga at aktuwal na pagpapatawag nang hindi gumagamit ng masyadong teknikal na salitang “italaga.”
