  source_fidelity: 'Tumpak ang pangunahing diwa: pinatay ni Jehu ang mga natitira sa sambahayan ni Ahab sa Jezreel, kasama ang mga prominenteng tao, mga malalapit na kaugnay, at mga pari nito. Ang pangwakas na panghalip ay wastong hindi nilulutas sa pangunahing teksto at ipinaliliwanag sa talababa.'
