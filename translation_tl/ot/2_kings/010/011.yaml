  terminology: Ang “sambahayan ni Ahab” ay angkop para sa בית אחאב sa dinastikong diwa. Mas tumpak at natural ang “mga dakilang tao niya” para sa גדליו; ipinaliliwanag ng talababa na maaari rin itong “mga maharlika niya” o “mga pinuno niya.” Ang “mga malalapit niyang kaugnay” ay mas idiomatiko at masaklaw kaysa “malalapit na kakilala.”
