  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: tl
  text: Kaya pinatay ni Jehu ang lahat ng natitira mula sa sambahayan ni Ahab sa Jezreel, pati ang lahat ng mga dakilang tao niya[a], mga malalapit niyang kaugnay[b], at mga pari niya, hanggang sa wala siyang iniwang kahit isang nakaligtas para sa kanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga maharlika niya” o “mga pinuno niya.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kakilala niya” o “mga matalik sa kanya.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “hanggang sa hindi siya nag-iwan para sa kanya ng isang nakaligtas.” Ang “kanya” ay maaaring tumukoy kay Ahab o sa sambahayan ni Ahab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: pinatay
  rationale: Sa konteksto, ang pandiwang נכה ay tumutukoy sa pananakit na humantong sa kamatayan. Likas at tuwiran sa makabagong Tagalog ang “pinatay.”
- source_word: הַנִּשְׁאָרִים
  choice: ang lahat ng natitira
  rationale: Pinananatili nito ang diwa ng mga taong naiwan pang buhay mula sa sambahayan ni Ahab nang hindi nagiging mabigat ang pangungusap.
- source_word: לְבֵית אַחְאָב
  choice: sa sambahayan ni Ahab
  rationale: Ang “sambahayan” ay tumutukoy rito sa dinastiya o angkan ni Ahab, hindi lamang sa isang gusali o tahanan.
- source_word: בְּיִזְרְעֶאל
  choice: sa Jezreel
  rationale: Ang pang-ukol ay lokatibo at natural na isinasalin bilang “sa” para sa isang lungsod.
- source_word: גְּדֹלָיו
  choice: kanyang mga pangunahing tauhan
  rationale: Tumutukoy ito sa mga taong mataas ang katayuan o maimpluwensiya sa sambahayan ni Ahab. Ang “pangunahing tauhan” ay malinaw at dignidadong makabagong Tagalog; posible rin ang “mga maharlika.”
- source_word: מְיֻדָּעָיו
  choice: malalapit na kakilala
  rationale: Ang anyo mula sa ידע ay literal na tumutukoy sa mga taong kilala niya, ngunit sa konteksto ay malamang na mga taong malapit sa kanya. Pinananatili ng salin ang parehong ugnayang personal at posibleng pampolitika.
- source_word: כֹהֲנָיו
  choice: mga pari
  rationale: Ito ang payak na kahulugan ng Hebreo at hindi nililimitahan ang kanilang tungkulin nang higit sa sinasabi ng teksto.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: hanggang sa wala siyang iniwang sinumang nakaligtas para sa kanya
  rationale: Pinananatili nito ang ganap na paglipol at ang panlalaking panghalip ng Hebreo, kahit bahagyang siksik ang pagtukoy nito.
theological_decisions:
- issue: Tinutukoy ng panghalip na לוֹ sa huling sugnay
  choice: Pinanatili bilang “para sa kanya,” na maaaring tumukoy kay Ahab o sa sambahayan ni Ahab
  alternative: Gawing tahasan na “para sa sambahayan ni Ahab” o “para kay Ahab”
  rationale: Siksik at bahagyang malabo ang reperensiya ng panghalip sa Hebreo. Hindi tahasang nilulutas ng pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sambahayan” sa diwang dinastiko, at iniwasan ang mga arkhaikong salita. Ang mga panghalip ay sadyang hindi lubusang pinalinaw upang mapanatili ang kalabuan ng Hebreo.
