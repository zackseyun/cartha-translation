base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: tl
  text: Kaya ang namamahala sa palasyo, ang namamahala sa lungsod, ang matatandang pinuno, at ang mga tagapag-alaga[a] ay nagpasabi kay Jehu, “Mga lingkod mo kami, at gagawin namin ang lahat ng sasabihin mo sa amin. Hindi kami maglalagay ng sinuman bilang hari. Gawin mo kung ano ang mabuti sa paningin mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tagapag-aruga.” Ang salitang Hebreo ay tumutukoy sa mga pinagkatiwalaang mangalaga sa mga anak ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: ang namamahala sa palasyo
  rationale: Ipinahahayag ang tungkuling administratibo sa sambahayan ng hari nang hindi ito ginagawang tiyak na pormal na titulo; ang “palasyo” ang angkop sa kontekstong maharlika.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: ang namamahala sa lungsod
  rationale: Pinananatili ang paglalarawan sa katungkulan sa halip na tukuyin siya bilang “gobernador,” na maaaring maging higit na tiyak kaysa sa Hebreo.
- source_word: הַזְּקֵנִים
  choice: ang matatandang pinuno
  rationale: Sa modernong Filipino, nililinaw nito na ang tinutukoy ay mga kinikilalang pinuno ng pamayanan, hindi lamang matatanda sa edad.
- source_word: הָאֹמְנִים
  choice: ang mga tagapag-alaga
  rationale: Tumutukoy sa mga pinagkatiwalaang mangalaga sa mga anak ng hari; malinaw ito nang hindi ipinapalagay na sila ay mga amain o tiyak na uri ng tagapag-aruga.
- source_word: עֲבָדֶיךָ
  choice: Mga lingkod mo kami
  rationale: Isa itong mapagpakumbabang pahayag ng pagpapasakop sa liham pampolitika, hindi pangunahing diin sa kalagayang alipin.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: gagawin namin ang lahat ng sasabihin mo sa amin
  rationale: Natural na Filipino na pinananatili ang tahasang pangako ng lubos na pagsunod.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: Hindi kami maglalagay ng sinuman bilang hari
  rationale: Pinananatili ang causative na diwa ng pandiwa—ang pagluklok o paglalagay sa isang tao bilang hari.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: kung ano ang mabuti sa paningin mo
  rationale: Pinananatili ang Hebreong idyoma habang nananatiling malinaw at marangal sa Filipino.
- source_word: עֲשֵׂה
  choice: Gawin mo
  rationale: Tuwiran at maikling pautos na katumbas ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagpasabi” upang natural na ipahayag ang pagpapadala nila ng mensahe kay Jehu, at pinanatili ang idyomang “mabuti sa paningin mo” dahil malinaw pa rin ito sa Filipino.
