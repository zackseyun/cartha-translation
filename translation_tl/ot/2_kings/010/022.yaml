base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: tl
  text: Sinabi niya sa tagapangasiwa ng imbakan ng mga kasuotan, “Maglabas ka ng kasuotan para sa lahat ng sumasamba kay Baal.” Kaya inilabas niya ang mga kasuotan para sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: imbakan ng mga kasuotan
  rationale: Tumutukoy ang salita sa isang lugar o departamentong pinaglalagyan ng mga kasuotan. Likas at malinaw ito sa modernong Filipino at iniiwasan ang mga katawagang may huling panrelihiyong kaugnayan.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: sa tagapangasiwa ng imbakan ng mga kasuotan
  rationale: Ang literal na 'nasa ibabaw ng' ay isang administratibong pahayag para sa taong namamahala; ipinahahayag ito nang natural at maikli bilang 'tagapangasiwa.'
- source_word: הוֹצֵא
  choice: Maglabas ka
  rationale: Ang hiphil na pautos ng יצא ay may kahulugang magpalabas o maglabas mula sa imbakan; ang 'Maglabas ka' ay tuwiran at natural.
- source_word: לְבוּשׁ
  choice: kasuotan
  rationale: Isang kolektibong pangngalan para sa isinusuot. Ang 'kasuotan' ay dignified, malinaw, at angkop sa pamamahagi ng natatanging damit.
- source_word: עֹבְדֵי הַבָּעַל
  choice: mga sumasamba kay Baal
  rationale: Bagaman maaaring literal na 'mga lingkod ni Baal,' sa kontekstong kultiko ay tumutukoy ito sa mga naglilingkod sa diyos sa pamamagitan ng pagsamba; 'mga sumasamba' ang pinakamalinaw sa karaniwang mambabasa.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: Kaya inilabas niya ang mga kasuotan para sa kanila
  rationale: Kolektibo ang anyong isahan ng pangngalan sa Hebreo. Ginawang maramihan sa Filipino upang maging natural habang pinananatili ang kahulugan ng kabuuang damit na ipinamahagi.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang 'imbakan ng mga kasuotan' sa halip na hiram o makalumang katawagan, at 'mga sumasamba kay Baal' upang malinaw na maipahayag ang kultikong diwa ng עֹבְדֵי nang hindi nagdaragdag ng denominasyonal na interpretasyon.
