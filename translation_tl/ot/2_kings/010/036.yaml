  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: tl
  text: Naghari si Jehu sa Israel nang dalawampu't walong taon sa Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Dalawampu't walong taon
  rationale: Ang literal na “at ang mga araw” ay bahagi ng pormulang naglalahad ng haba ng paghahari. Sa natural na Filipino, tuwirang inilalahad ang bilang ng mga taon.
- source_word: מָלַךְ
  choice: naghari
  rationale: Karaniwang salin ito para sa pamumuno ng isang hari at pinananatili nito ang monarkikal na diwa ng pandiwa.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino Bible tradition.
- source_word: עַל יִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa Filipino, ang “naghari sa Israel” ay natural na nagpapahayag ng paghahari sa bayan o kaharian; ang “naghari ibabaw ng Israel” ay hindi likas.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: dalawampu't walong taon
  rationale: Tuwirang modernong Filipino na pagpapahayag ng bilang at haba ng paghahari.
- source_word: בְּשֹׁמְרוֹן
  choice: mula sa Samaria
  rationale: Tinutukoy ng parirala ang Samaria bilang luklukan o sentro kung saan pinamahalaan ni Jehu ang Israel. Ang “mula sa” ay natural na nagpapakita nito nang hindi ipinahihiwatig na sa lungsod lamang siya naghari.
