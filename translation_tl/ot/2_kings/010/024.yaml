  verdict: revise
  source_fidelity: Tumpak ang paghahatid sa pagpasok upang maghandog, sa dalawang uri ng handog, sa walumpung lalaking inilagay ni Jehu sa labas, at sa parusang buhay kapalit ng buhay. Gayunman, ang “naglagay” ay hindi gaanong tumutukoy sa pagpapuwesto ng mga tao bilang mga bantay; mas eksakto ang “nagtalaga.”
  naturalness: Natural sa pangkalahatan ang makabagong Filipino. Mas malinaw at higit na natural sa babala ang “magpapahintulot na makatakas” kaysa “magpatakas,” na maaaring magpahiwatig ng aktibong pagtulong sa pagtakas.
  terminology: Ang “mga hain” at “mga handog na sinusunog” ay angkop at malinaw na katumbas ng זְבָחִים at עֹלוֹת. Ang “buhay” ay wastong salin ng נֶפֶשׁ sa pormula ng parusa.
