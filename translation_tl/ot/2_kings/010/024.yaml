translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga hain” at “mga handog na sinusunog” upang mapanatili ang dalawang uri ng handog nang hindi gumagamit ng masyadong teknikal o makalumang pananalita. Walang footnote sapagkat naipahayag nang malinaw sa teksto ang reperente ng pariralang “buhay kapalit ng buhay.”
