  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: tl
  text: Pumasok sila upang maghandog ng mga hain at mga handog na sinusunog. Samantala, nagtalaga si Jehu ng walumpung lalaki sa labas, at sinabi niya, “Sinumang magpapahintulot na makatakas ang isa sa mga lalaking ibinibigay ko sa inyong mga kamay, ang buhay niya ang ipapalit sa buhay ng nakatakas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pumasok sila
  rationale: Sa konteksto, ang בוא ay tumutukoy sa pagpasok nila sa lugar upang sumamba; natural at tuwiran ang “pumasok” sa Filipino.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: upang maghandog ng mga hain at mga handog na sinusunog
  rationale: Ang עשה kasama ng mga sakripisyo ay idyomatikong “maghandog.” Pinananatili ang pagkakaiba ng pangkalahatang זְבָחִים at ng עֹלוֹת, mga handog na sinusunog.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: naglagay si Jehu ng walumpung lalaki sa labas
  rationale: Ang שׂים ay “maglagay/magtalaga.” Hindi tinawag ng Hebreo na mga kawal ang mga lalaki, kaya hindi iyon idinagdag. Ang לוֹ ay nagpapakitang si Jehu ang gumawa ng kaayusang ito, na malinaw na sa Filipino nang hindi isinasalin nang mekanikal bilang “para sa sarili niya.”
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Sinumang magpatakas sa isa sa mga lalaki
  rationale: Bagaman Niphal ang יִמָּלֵט (“makatakas”), ipinapataw ng konteksto sa bantay ang pananagutan kapag may nakatakas. Ang “magpatakas” ay likas na Filipino at malinaw na naghahatid ng babala.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: na ibinibigay ko sa inyong mga kamay
  rationale: Pinananatili nito ang idyomang Hebreo ng paglalagay sa kapangyarihan o pangangalaga ng iba, at natural din sa Filipino.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: buhay niya ang ipapalit sa buhay ng nakatakas
  rationale: Ang נֶפֶשׁ dito ay “buhay,” at ang תַּחַת ay nagpapahayag ng pagpapalit. Nililinaw ng “ng nakatakas” ang dalawang reperente ng magkaparehong panghalip sa Hebreo.
