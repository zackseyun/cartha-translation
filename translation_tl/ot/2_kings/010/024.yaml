revisions:
- from: Pumasok sila upang maghandog ng mga hain at mga handog na sinusunog. Samantala, naglagay si Jehu ng walumpung lalaki sa labas at sinabi niya, “Sinumang magpatakas sa isa sa mga lalaking ibinibigay ko sa inyong mga kamay, buhay niya ang ipapalit sa buhay ng nakatakas.”
  to: Pumasok sila upang maghandog ng mga hain at mga handog na sinusunog. Samantala, nagtalaga si Jehu ng walumpung lalaki sa labas, at sinabi niya, “Sinumang magpapahintulot na makatakas ang isa sa mga lalaking ibinibigay ko sa inyong mga kamay, ang buhay niya ang ipapalit sa buhay ng nakatakas.”
  rationale: Ginawang “nagtalaga” upang maipakita ang pagpapuwesto ni Jehu ng mga lalaki sa labas. Pinalitan ang “magpatakas” ng “magpapahintulot na makatakas” upang panatilihin ang diwa ng Hebreong “makatakas” at ang pananagutan ng mga bantay. Hindi kailangan ng talababa, sapagkat malinaw na tinutukoy sa salin ang buhay ng pabaya at buhay ng nakatakas.
