  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: tl
  text: Ngunit hindi nag-ingat si Jehu na lumakad ayon sa kautusan ni Yahweh,[a] ang Diyos ng Israel, nang buong puso. Hindi niya tinalikuran ang mga kasalanan ni Jeroboam.[b] Sa pamamagitan ng mga ito ay inudyukan ni Jeroboam ang Israel na magkasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “hindi iningatang lumakad ayon sa kautusan ni Yahweh.” Maaaring idiin ng pandiwang Hebreo ang maingat na pagsunod.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa mga kasalanang may kaugnayan sa sistemang pagsamba sa mga diyus-diyosan na itinatag ni Jeroboam—isang pariralang paulit-ulit sa Mga Hari.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: nag-ingat ... na lumakad
  rationale: Pinananatili nito ang diwa ng maingat na pagsunod sa konstruksiyong Hebreo, pati ang larawang 'lumakad' bilang asal o pamumuhay.
- source_word: תּוֹרַת
  choice: kautusan
  rationale: Sa konteksto ng tipan, nangingibabaw ang diwang legal at pangtipan, bagaman maaari rin itong mangahulugang 'turo.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang personal na pangalang Hebreo sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל לְבָבוֹ
  choice: nang buong puso
  rationale: Likas na pariralang Filipino para sa ganap na panloob na katapatan at debosyon.
- source_word: לֹא סָר מֵעַל
  choice: Hindi niya tinalikuran
  rationale: Malinaw na ipinahahayag ang hindi pagtalikod o paglayo mula sa mga kasalanan.
- source_word: חַטֹּאות
  choice: mga kasalanan
  rationale: Direktang sinasalamin ang pangmaramihang anyo at ang paulit-ulit na pormula tungkol kay Jeroboam sa Mga Hari.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na naging dahilan upang magkasala ang Israel
  rationale: Ipinapahayag nang natural sa Filipino ang causative na anyo ng pandiwa, habang iniuugnay ang sugnay sa mga kasalanan ni Jeroboam.
- source_word: וְיֵהוּא
  choice: Ngunit ... si Jehu
  rationale: Ang pangatnig ay nagpapakita rito ng pagsalungat sa naunang sigasig ni Jehu laban kay Baal.
theological_decisions:
- issue: Pagtataya sa katapatan ni Jehu sa tipan
  choice: Inilalarawan si Jehu bilang hindi buong-pusong sumunod kay Yahweh kahit nagsagawa siya ng naunang mga reporma.
  alternative: Ang puna ay tungkol lamang sa hindi ganap na repormang pampolitika at hindi sa personal na debosyon.
  rationale: Ang 'nang buong puso' at ang hindi pagtalikod sa mga kasalanan ni Jeroboam ay malinaw na moral at pangtipang pagtataya. Hindi pinalalabis ng salin ang hatol ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na larawang 'lumakad,' ngunit ginawang natural ang kabuuang pangungusap. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
