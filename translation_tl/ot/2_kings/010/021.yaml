  text: וַ/יִּשְׁלַ֤ח יֵהוּא֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֨אוּ֙ כָּל עֹבְדֵ֣י הַ/בַּ֔עַל וְ/לֹֽא נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא בָ֑א וַ/יָּבֹ֨אוּ֙ בֵּ֣ית הַ/בַּ֔עַל וַ/יִּמָּלֵ֥א בֵית הַ/בַּ֖עַל פֶּ֥ה לָ/פֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: tl
  text: Kaya nagpadala si Jehu ng pabalita sa buong Israel, at dumating ang lahat ng sumasamba kay Baal. Walang kahit isang lalaking hindi dumating. Pumasok sila sa bahay ni Baal, at napuno ang bahay ni Baal mula sa isang dulo hanggang sa kabila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bibig sa bibig,” isang idyomang nangangahulugang lubusang napuno ang bahay, mula sa isang dulo hanggang sa kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: nagpadala si Jehu ng pabalita sa buong Israel
  rationale: Bagaman literal na 'nagpadala,' ipinahihiwatig ng pariralang בְּכָל יִשְׂרָאֵל na nagpadala si Jehu ng mensahe o panawagan sa buong nasasakupan; natural itong ipinahahayag sa Tagalog bilang 'nagpadala ng pabalita.'
- source_word: עֹבְדֵי הַבַּעַל
  choice: mga sumasamba kay Baal
  rationale: Sa kontekstong panrelihiyon, ang participle ng עבד ay tumutukoy sa mga naglilingkod kay Baal bilang mga mananamba, kaya mas malinaw ang 'sumasamba' kaysa pangkalahatang 'naglilingkod.'
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: Walang kahit isang lalaking hindi dumating
  rationale: Pinananatili nito ang mariing kabuuan ng pahayag at ang tahasang panlalaking אִישׁ, habang natural pa rin sa modernong Tagalog.
- source_word: וַיָּבֹאוּ בֵּית הַבַּעַל
  choice: Pumasok sila sa templo ni Baal
  rationale: Ang בוא na sinusundan ng gusali ay natural na 'pumasok.' Bagaman literal na 'bahay ni Baal,' tumutukoy ang בֵּית dito sa gusaling sambahan, kaya malinaw at likas ang 'templo ni Baal.'
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: napuno ang templo ni Baal
  rationale: Ang Niphal ng מלא ay nagpapahayag na naging punô ang gusali; 'napuno' ang maikli at natural na katumbas.
- source_word: פֶּה לָפֶה
  choice: mula sa isang dulo hanggang sa kabila
  rationale: Ang literal na 'bibig sa bibig' ay isang idyomang nagsasaad na punô ang buong lawak ng lugar. Inililipat ng salin ang kahulugan habang ipinaliliwanag sa talababa ang anyong Hebreo.
theological_decisions:
- issue: Panlalaking kinatawang pananalita sa אִישׁ
  choice: Walang kahit isang lalaking hindi dumating
  alternative: Walang sinumang hindi dumating
  rationale: Tahasan ang panlalaking pangngalang אִישׁ sa Hebreo. Pinananatili ng 'lalaki' ang anyo ng pinagmulan at ang diin sa ganap na pagdalo nang walang idinaragdag na doktrinal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'templo' sa halip na literal na 'bahay' upang agad na maunawaan ang uri ng gusali, at 'nagpadala ng pabalita' upang maipahayag ang ipinahihiwatig na panawagan sa buong Israel.
