  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: tl
  text: Ngunit takot na takot sila at sinabi nila, “Tingnan ninyo, hindi siya nakayanan ng dalawang hari. Paano pa kaya natin siya makakayanan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Hindi nakatayo sa harap niya ang dalawang hari. Paano naman tayo tatayo?” Iisang pandiwang nangangahulugang “tumayo” ang ginamit sa Hebreo sa dalawang bahagi; sa kontekstong ito, ipinahihiwatig nito ang hindi makayanan o hindi makalaban siya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד מְאֹד
  choice: takot na takot sila
  rationale: Likas sa modernong Tagalog ang pag-uulit na “takot na takot” upang maipahayag ang matinding takot na idinidiin ng dobleng מְאֹד, nang hindi nagiging mabigat ang pananalita.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pinananatili nito ang pantawag-pansing lakas ng הִנֵּה sa isang kasalukuyan at marangal na anyong Tagalog.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: ang dalawang hari
  rationale: Tiyak ang parirala at tumutukoy sa dalawang haring nabanggit na sa konteksto.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: hindi nakapanindigan sa harap niya
  rationale: Pinananatili ang larawan ng pandiwang עמד at ang pariralang “sa harap niya,” habang ipinahihiwatig ng anyong “nakapanindigan” ang kawalang-kakayahang labanan o harapin siya.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: Paano pa kaya tayo makapaninindigan?
  rationale: Ang “paano pa kaya” ay natural na naghahayag ng paghinuha mula sa sinundang pangungusap, at inuulit ng “makapaninindigan” ang parehong ugat upang mapanatili ang retorikal na paralelismo.
