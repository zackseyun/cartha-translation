base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: tl
  text: Pagkatapos, tumindig siya, umalis, at naglakbay patungong Samaria. Nasa Bet-eked ng mga pastol siya sa daan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bet-eked ay maaaring mangahulugang gaya ng “bahay ng pagtitipon.” Sa ilang pagpapakahulugan ng pangalang ito, kaugnay ito ng isang lugar ng paggugupit o pagtatali na may kinalaman sa mga pastol. Dahil hindi tiyak ang kahulugan, itinuring ito rito bilang pangalan ng lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Pagkatapos, tumindig siya
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng kasunod na kilos sa salaysay. Ang “tumindig” ay pormal ngunit natural at hindi ipinapalagay na ang buong parirala ay nangangahulugang agad siyang umalis.
- source_word: וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן
  choice: at naglakbay patungong Samaria
  rationale: Magkakasunod na pandiwa ng pagkilos ang בוא at הלך. Pinagsama sa likas na Filipino ang ideya ng pagpapatuloy at paglalakbay patungo sa Samaria nang hindi inuulit nang alanganin ang “pumunta.”
- source_word: הוּא בֵּית עֵקֶד הָרֹעִים בַּדָּרֶךְ
  choice: Habang nasa daan, naroon siya sa Bet-eked ng mga pastol
  rationale: Ang masoretikong teksto ay masikip at maaaring unawain bilang pangyayaring pansamantala o lokasyon sa ruta. Ginagawang malinaw ng “naroon siya” ang lokasyon nang hindi dinaragdagan ang tiyak na gawaing hindi tahasang binanggit.
- source_word: בֵּית עֵקֶד
  choice: Bet-eked
  rationale: Pinakamainam itong ituring bilang pangalan ng lugar. Hindi tiyak ang eksaktong kahulugan ng עֵקֶד, kaya transliterasyon ang ginamit sa pangunahing teksto.
- source_word: הָרֹעִים
  choice: ng mga pastol
  rationale: Ang רֹעִים ay tuwirang nangangahulugang “mga pastol” o “mga tagapag-alaga ng kawan.” Ang “mga pastol” ang pinakamaikli at pinakapamilyar na katumbas.
- source_word: בַּדָּרֶךְ
  choice: Habang nasa daan
  rationale: Ipinakikita ng parirala na ang lugar ay nasa ruta ng paglalakbay. Ang “habang nasa daan” ay natural sa Filipino at malinaw na nag-uugnay sa lokasyon sa paglalakbay.
