  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang pitumpung anak na lalaki ni Ahab sa Samaria, ang pagsulat at pagpapadala ni Jehu ng mga liham, at ang tatlong pangkat ng mga tatanggap. Napananatili rin ng talababa ang tekstuwal na hirap ng “mga pinuno ng Jezreel.” Gayunman, ang “Ganito ang sinabi niya:” ay bahagyang hindi angkop sa konteksto ng isang liham at maaaring magpahiwatig ng pasalitang pahayag. Mas tuwirang naipakikilala ng “na ganito:” ang nilalaman ng liham nang hindi nagdaragdag ng paraan ng pagpapahayag.'
