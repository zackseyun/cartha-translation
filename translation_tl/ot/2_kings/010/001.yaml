  to: 'May pitumpung anak na lalaki si Ahab sa Samaria. Sumulat si Jehu ng mga liham at ipinadala ang mga iyon sa Samaria, sa mga pinuno ng Jezreel[a], sa mga nakatatanda, at sa mga tagapag-alaga ng mga anak ni Ahab[b], na ganito:'
  rationale: 'Dalawang magagaan na pagbabago lamang ang ginawa: pinalitan ang “matatandang pinuno” ng “mga nakatatanda” upang mapanatili ang hiwalay na institusyonal na pangkat na tinutukoy ng Hebrew, at pinalitan ang “Ganito ang sinabi niya:” ng “na ganito:” upang ipakilala nang neutral ang nilalaman ng liham. Hindi binago ang kahulugan, mga pangalan, o mga talababa.'
