source:
  edition: WLC
  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: tl
  text: 'May pitumpung anak na lalaki si Ahab sa Samaria. Sumulat si Jehu ng mga liham at ipinadala ang mga iyon sa Samaria, sa mga pinuno ng Jezreel[a], sa mga nakatatanda, at sa mga tagapag-alaga ng mga anak ni Ahab[b], na ganito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga pinuno ng Jezreel.” Yamang sinasabing ipinadala sa Samaria ang mga liham, inuunawa ito ng ilan bilang pagtukoy sa mga pinunong kaugnay ng Jezreel na naninirahan doon; pinapaboran naman ng ilang sinaunang salin at tagapagpaliwanag ang “mga pinuno ng Samaria.” Pinananatili sa pangunahing teksto ang pagkakasabi ng tekstong Masoretiko.
    reason: textual_variant
  - marker: b
    text: Maaari ring “mga ama-amahan” o “mga katiwala.” Ang salitang Hebreo ay tumutukoy sa mga taong may pananagutang magpalaki o mangasiwa sa mga anak ni Ahab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: May ... si Ahab
  rationale: Ang waw + lamed ay nagpapakilala sa kalagayan tungkol kay Ahab; natural itong ipahayag sa Tagalog sa hulma na “May ... si Ahab” nang hindi nagdaragdag ng tahasang panandang temporal.
- source_word: שִׁבְעִים בָּנִים
  choice: pitumpung anak na lalaki
  rationale: Ang בָּנִים ay literal na “mga anak na lalaki,” at mahalaga ang kasarian sa konteksto ng maharlikang paghalili.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ipinahihiwatig ng ב ang kinaroroonan; ang “sa Samaria” ang natural na anyo sa Tagalog.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: Sumulat ... ng mga liham
  rationale: Ang סְפָרִים ay tumutukoy rito sa nakasulat na pakikipag-ugnayan, kaya ang “mga liham” ang angkop sa salaysay.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: ipinadala ang mga iyon sa Samaria
  rationale: Ang tinutukoy na ipinadala ay ang mga liham sa naunang sugnay; nilinaw ito sa Tagalog para sa likas na daloy.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: sa mga pinuno ng Jezreel
  rationale: Ang שָׂרִים ay mga taong may kapangyarihan o katungkulan. Pinananatili ang Masoretikong “Jezreel” sa kabila ng tekstuwal na kahirapan dahil sa Samaria ipinadala ang mga liham.
- source_word: הַזְּקֵנִים
  choice: sa matatandang pinuno
  rationale: Sa kontekstong pansibiko, tumutukoy ito sa kinikilalang mga nakatatandang lider, hindi lamang sa matatanda ang edad.
- source_word: הָאֹמְנִים אַחְאָב
  choice: sa mga tagapag-alaga ng mga anak ni Ahab
  rationale: Ang participle mula sa אמן ay tumutukoy sa mga inatasang magpalaki o mangasiwa sa mga anak ng hari. Nilinaw ang ipinahihiwatig na kaugnayan sa mga anak ni Ahab.
- source_word: לֵאמֹר
  choice: 'Ganito ang sinabi niya:'
  rationale: Ipinakikilala nito ang nilalaman ng liham na sumusunod; natural at malinaw itong panimula sa Tagalog.
