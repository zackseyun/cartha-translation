translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maipakita ang pansibikong diwa ng “elders,” at inilagay ang unang talababa sa “Jezreel,” ang mismong pariralang may tekstuwal na suliranin.
