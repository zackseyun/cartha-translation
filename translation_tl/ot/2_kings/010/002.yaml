  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagdating ng liham, ang maramihang kausap, ang mga anak ng kanilang panginoon, mga karwahe, kabayo, isang pinatibay na lungsod, at mga sandata. Ang di-ganap na anyo at panghuling kuwit ay wasto, sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “pagdating sa inyo ng liham na ito” at ang pag-uulit ng “kasama/nasa inyo” ay malinaw na nakapagpapadaloy sa nakalistang mga bagay nang hindi nawawala ang anyong pangkondisyon ng liham.
  terminology: Ang “liham,” “mga anak ng inyong panginoon,” “mga karwahe,” “mga kabayo,” at “mga sandata” ay angkop. Ang “isang lungsod na may tanggulan” ay isang maingat at nauunawaang pagsasalin ng עִיר מִבְצָר; ang talababa ay sapat na nagtatala ng alternatibong pagbasa.
