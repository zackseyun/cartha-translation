id: 2KI.10.2
reference: 2 Kings 10:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: tl
  text: Ngayon, pagdating sa inyo ng liham na ito[a], yamang kasama ninyo ang mga anak ng inyong panginoon[b], gayundin ang mga karwahe at mga kabayo, at nasa inyo rin ang isang lungsod na may tanggulan[c] at ang mga sandata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagdating sa inyo ng kasulatang ito.”
    reason: lexical_alternative
  - marker: b
    text: Ang “inyong panginoon” ay ang hari na pinaglilingkuran ng mga tumanggap ng liham.
    reason: cultural_note
  - marker: c
    text: Maaari ring “isang napapaderang lungsod.” Tumutukoy ito sa isang lungsod na maaari nilang ipagtanggol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Panandang pandiskurso ito na nagpapakilala sa susunod na bahagi ng mensahe ni Jehu. Likas sa makabagong Tagalog ang “Ngayon,” at hindi kailangang isalin nang hiwalay ang prefixed conjunction.
- source_word: כְּבֹא
  choice: pagdating
  rationale: Ang infinitive construct na may כְּ ay may temporal na diwang “kapag/pagdating.” Ang “pagdating sa inyo ng liham” ay malinaw at natural sa Tagalog.
- source_word: הַסֵּפֶר הַזֶּה
  choice: liham na ito
  rationale: Sa konteksto ng maharlikang pakikipagsulatan, ang סֵפֶר ay isang nakasulat na mensahe o liham, hindi isang aklat.
- source_word: אֲלֵיכֶם
  choice: sa inyo
  rationale: Pinananatili nito ang maramihang kausap, na malinaw na sa konteksto kahit walang natatanging plural na anyo ang Tagalog na “inyo.”
- source_word: וְאִתְּכֶם
  choice: kasama ninyo / nasa inyo rin
  rationale: Ang Hebreo ay mga pariralang walang tahasang pandiwa. Gumamit ng dalawang natural na anyo sa Tagalog upang malinaw na ang mga tao at mga kagamitang militar ay pawang nasa panig o kapangyarihan ng mga kausap.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: mga anak ng inyong panginoon
  rationale: Ang אֲדֹן ay tumutukoy sa maharlikang pinaglilingkuran ng mga kausap. Pinananatili ng “panginoon” ang ugnayang pampolitika nang hindi idinaragdag sa pangunahing teksto ang paliwanag na “hari.”
- source_word: הָרֶכֶב
  choice: mga karwahe
  rationale: Kolektibong tumutukoy ito sa mga karwaheng pandigma. Ang “mga karwahe” ay tuwiran at madaling maunawaan.
- source_word: וְהַסּוּסִים
  choice: mga kabayo
  rationale: Tuwirang salin ito na hindi labis na tinutukoy kung pangkarwahe o pangkabalyerya ang mga kabayo.
- source_word: וְעִיר מִבְצָר
  choice: isang lungsod na may tanggulan
  rationale: Ipinahahayag nito ang isang lungsod na kayang ipagtanggol dahil sa mga kuta o tanggulan nito. Mas natural ito sa Tagalog kaysa sa literal na “lungsod-kuta.”
- source_word: וְהַנָּשֶׁק
  choice: mga sandata
  rationale: Sa kontekstong militar, ang נֶשֶׁק ay pangkalahatang tumutukoy sa mga armas o sandata, hindi lamang sa baluti.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong di-ganap ng pangungusap at ang kuwit sa hulihan dahil nagpapatuloy sa kasunod na talata ang hamon sa liham. Ang pag-uulit ng diwang “kasama/nasa inyo” ay sumasalamin sa Hebreong וְאִתְּכֶם nang hindi nagiging mabigat ang Tagalog.
