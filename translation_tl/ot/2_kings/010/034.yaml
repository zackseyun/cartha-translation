base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Jehu, ang lahat ng ginawa niya, at ang lahat ng kanyang lakas[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Talaan ng mga Hari ng Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang lahat ng kanyang makapangyarihang gawa.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa isang maharlikang talaan ng mga pangyayari, hindi kinakailangang sa kanonikal na aklat ng Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Ang iba pang mga ginawa ni Jehu
  rationale: Sa karaniwang pangwakas na pormula tungkol sa paghahari sa aklat ng Mga Hari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o pangyayari tungkol sa hari, hindi lamang sa kaniyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng ginawa niya
  rationale: Tuwirang pinananatili ang saklaw ng כָּל at ang kaugnay na sugnay, kahit may sinadyang pag-uulit sa naunang parirala gaya ng nasa Hebreo.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: at ang lahat ng kanyang kapangyarihan
  rationale: Maaaring tumukoy ang גְּבוּרָה sa lakas, kapangyarihan, kagitingan, o mga makapangyarihang gawa. Pinananatili ng “kapangyarihan” ang pagiging maikli at ang leksikal na kalabuan; inilalahad sa talababa ang isa pang posibleng diwa.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot, sa natural na ayos ng Tagalog.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Israel
  rationale: Ang “sa Aklat” ay likas na Tagalog para sa talaang kinasusulatan, at ang pamagat ay nagpapahayag ng mga kronika o taunang tala tungkol sa mga hari ng Israel.
theological_decisions:
- issue: Pagkakakilanlan ng binanggit na aklat
  choice: Isinalin bilang “Aklat ng mga Kasaysayan ng mga Hari ng Israel” at nilinaw sa talababa na ito ay maharlikang talaan.
  alternative: Ituring itong kanonikal na aklat ng Mga Cronica.
  rationale: Sa konteksto ng Mga Hari, ang parirala ay tumutukoy sa isang pinagkunang talaan tungkol sa mga hari ng hilagang kaharian, hindi kinakailangang sa kanonikal na Mga Cronica.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormulang pangkasaysayan, ang sinadyang pag-uulit, at ang retorikal na tanong ng Hebreo. Ginamit ang “kanyang” alinsunod sa karaniwang modernong baybay.
