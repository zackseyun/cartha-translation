base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Sumama ka sa akin at tingnan mo ang sigasig ko para kay Yahweh[a].” Kaya pinasakay nila siya sa karwahe ni Jehu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang paninibugho ko para kay Yahweh.” Maaaring mangahulugan ang salitang Hebreo ng sigasig o paninibugho, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Sumama ka sa akin
  rationale: Ang pautos na anyo ng הלך kasama ng אִתִּי ay isang paanyaya o panawagang sumama. Likas at tuwiran sa modernong Tagalog ang “Sumama ka sa akin.”
- source_word: וּרְאֵה
  choice: at tingnan mo
  rationale: Pinananatili nito ang tuwirang pautos ng ראה nang hindi dinaragdagan ang diwang “saksihan” na bahagyang mas mapagpaliwanag.
- source_word: בְּקִנְאָתִי
  choice: ang sigasig ko
  rationale: Maaaring tumukoy ang קִנְאָה sa sigasig o paninibugho. Sa konteksto ng ipinapakitang debosyon kay Yahweh, natural ang “sigasig,” habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pinag-uukulan ng sigasig, at pinananatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: pinasakay nila siya
  rationale: Ang Hiphil ng רכב ay sanhiang anyo, “pinapangyaring sumakay.” Pinananatili ng “pinasakay nila siya” ang maramihang simuno ng tekstong Hebreo.
- source_word: בְּרִכְבּוֹ
  choice: sa karwahe nito
  rationale: Ang רֶכֶב ay tumutukoy rito sa karwahe. Ginamit ang “nito” upang maiwasan ang kalituhang maaaring idulot ng dalawang magkasunod na “niya” at upang ipakitang ang karwahe ay pag-aari ng naunang nagsalita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng kahulugan ng קִנְאָה
  choice: sigasig
  alternative: paninibugho
  rationale: Ang konteksto ay ang pag-aangkin ni Jehu ng masigasig na debosyon kay Yahweh. Gayunman, hindi tuluyang nilulutas ang leksikal na tensiyon; nakatala sa talababa ang “paninibugho.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tuwiran ang pananalita at pinananatili ang maramihang simuno sa huling sugnay, gaya ng tekstong Hebreo.
