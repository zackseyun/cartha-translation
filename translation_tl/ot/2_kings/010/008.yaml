base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: tl
  text: Dumating ang mensahero at nag-ulat sa kanya, “Dinala na nila ang mga ulo ng mga anak na lalaki ng hari.” Sinabi niya, “Ilagay ninyo ang mga iyon sa dalawang bunton[a] sa pasukan ng pintuang-bayan hanggang umaga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawang tumpok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: ang mensahero
  rationale: Sa konteksto, isang taong tagapagdala ng balita ang tinutukoy, hindi isang makalangit na anghel.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: nag-ulat sa kanya
  rationale: Likas sa modernong Tagalog ang “nag-ulat,” at sapat nitong naipapahayag ang pormulang Hebreo na literal na “ipinaalam sa kanya, na sinasabi.”
- source_word: הֵבִיאוּ
  choice: Dinala na nila rito
  rationale: Ipinahihiwatig ng ganap na kilos sa tuwirang pagsasalita na dumating na sa kinaroroonan ni Jehu ang mga ulo; ang “na” at “rito” ay malinaw na naghahatid ng kasalukuyang resulta at direksiyon.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: ang mga ulo ng mga anak na lalaki ng hari
  rationale: Pinananatili ang tahasang maramihang “mga ulo” at ang panlalaking kahulugan ng בְנֵי, nang hindi pinapalitan ng mas interpretibong katawagang gaya ng “mga prinsipe.”
- source_word: שִׂימוּ אֹתָם
  choice: Ilagay ninyo ang mga iyon
  rationale: Tuwirang pautos ito; ang “mga iyon” ay malinaw na tumutukoy sa mga ulong nabanggit.
- source_word: שְׁנֵי צִבֻּרִים
  choice: sa dalawang bunton
  rationale: Ang צִבֻּרִים ay mga bunton o tumpok. Ang “bunton” ay natural, malinaw, at angkop sa konkretong tagpo.
- source_word: פֶּתַח הַשַּׁעַר
  choice: sa pasukan ng pintuang-bayan
  rationale: Tinutukoy nito ang lugar sa bukana ng tarangkahan ng lungsod; ang “pintuang-bayan” ay karaniwang dignified na salin para sa city gate sa salaysay sa Lumang Tipan.
- source_word: עַד הַבֹּקֶר
  choice: hanggang umaga
  rationale: Natural at tumpak nitong ipinahahayag ang tagal hanggang sa sumunod na umaga.
theological_decisions: []
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may dignidad ng salaysay. Iniwasan ang sobrang literal na “na sinasabi,” na mabigat sa Tagalog, ngunit pinanatili ang pagkakasunod ng ulat at utos. Ginamit ang “pintuang-bayan” upang malinaw na tumukoy sa tarangkahan ng lungsod.
