  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: tl
  text: Pagkatapos, inilabas nila ang mga sagradong haligi mula sa bahay ni Baal at sinunog ang mga iyon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga nakatayong batong ginagamit sa pagsamba.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sinunog iyon” ang anyong gramatikal, bagaman maramihan ang “mga sagradong haligi”; malamang na kolektibo ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Pagkatapos, inilabas nila
  rationale: Ang Hiphil ng יצא ay nangangahulugang “ilabas” o “dalhin palabas.” Isinasadula ng waw-consecutive ang kasunod na pangyayari, kaya natural ang “Pagkatapos” sa salaysay.
- source_word: מַצְּבוֹת
  choice: mga sagradong haligi
  rationale: Ang מַצֵּבָה ay isang nakatayong bato o haliging ginagamit sa pagsamba. Nililinaw ng “sagrado” ang kultikong gamit nito nang hindi ito ginagawang pangkalahatang “larawan” o “diyus-diyosan.”
- source_word: בֵּית הַבַּעַל
  choice: bahay ni Baal
  rationale: Pinananatili nito ang literal na larawan ng בַּיִת (“bahay”), na sa kontekstong ito ay tumutukoy sa santuwaryo o templo ni Baal.
- source_word: וַיִּשְׂרְפוּהָ
  choice: at sinunog ang mga iyon
  rationale: Bagaman isahan at pambabae ang hulaping layon sa Hebreo (“sinunog iyon”), maramihan ang naunang מַצְּבוֹת. Ang “mga iyon” ay malinaw sa Tagalog at kumakatawan sa malamang na kolektibong diwa.
