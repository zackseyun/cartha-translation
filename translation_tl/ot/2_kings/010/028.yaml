  text: וַ/יַּשְׁמֵ֥ד יֵה֛וּא אֶת הַ/בַּ֖עַל מִ/יִּשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: tl
  text: Kaya nilipol ni Jehu si Baal mula sa Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “winasak” o “inalis.” Ang pandiwang Hebreo ay nagpapahayag ng pagdudulot ng pagkawasak o pag-aalis.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang Baal.” Sa Tagalog, natural na gamitin ang “si” sa pangalan ng diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: nilipol
  rationale: Ang Hiphil ng שׁמד ay nagpapahayag ng pagwasak o pag-aalis. Likas at matindi ang “nilipol” sa modernong Tagalog, ngunit hindi nito kinakailangang ipaliwanag nang higit sa konteksto ang saklaw ng ginawa.
- source_word: יֵהוּא
  choice: Jehu
  rationale: Ginamit ang karaniwang anyo ng pangalang pantangi sa mga saling Tagalog.
- source_word: הַבַּעַל
  choice: si Baal
  rationale: Bagaman may pantukoy ang Hebreo (“ang Baal”), natural sa Tagalog na gamitin ang pantukoy na “si” sa pangalan ng diyos. Hindi ito pinalawak bilang “pagsamba kay Baal” upang mapanatili ang tahasang bagay ng pandiwa sa Hebreo.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Ang מִן ay nagpapahiwatig ng paghihiwalay o pag-aalis; tuwirang ipinapahayag ito ng “mula sa Israel.”
- source_word: וַ
  choice: Kaya
  rationale: Ang waw sa pandiwa ay nagpapatuloy sa salaysay at, sa konteksto, may bungang o pangwakas na daloy. Natural itong naihahayag ng “Kaya.”
theological_decisions:
- issue: Ang tinutukoy ng “Baal”
  choice: Pinanatili ang Baal bilang pangalan ng diyos o kultong inalis sa Israel, nang hindi pinalalawak ang teksto.
  alternative: “ang pagsamba kay Baal”
  rationale: Ang tuwirang layon sa Hebreo ay הַבַּעַל, “ang Baal.” Hinahayaan ng saling “si Baal” na ang konteksto ang magpahiwatig na kasama rito ang pagsugpo sa pagsamba sa kanya.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Pinanatili ang lakas ng pandiwa at ang tuwirang pagtukoy kay Baal, habang iniwasan ang interpretibong pagpapalawak.
