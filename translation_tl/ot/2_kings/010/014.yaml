translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kinatay” upang mapanatili ang tindi ng pandiwang Hebreo, at ang “sa hukay” upang hindi tahimik na lutasin ang hindi tiyak na spatial na diwa ng אֶל.
