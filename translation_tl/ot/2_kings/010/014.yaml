base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: tl
  text: Sinabi niya, “Hulihin ninyo silang buhay.” Kaya hinuli nila silang buhay at kinatay ang apatnapu’t dalawang lalaki sa hukay[a] ng Bet-Eked[b]. Wala siyang iniwang kahit isa sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tabi ng hukay” o “papasok sa hukay.” Higit sa isang diwang panlunan ang maaaring taglayin dito ng pang-ukol sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang Bet-Eked ay pangalan ng isang lugar. Maaaring kaugnay ang pangalan nito sa diwang “bahay ng pagtali” o “bahay ng pagtitipon,” ngunit ginagamit ito rito bilang pangalang pantangi.
    reason: cultural_note
  - marker: c
    text: Sa Hebreo, “hindi siya nag-iwan ng isang lalaki mula sa kanila,” na nagbibigay-diin na walang nakaligtas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: Hulihin ninyo sila
  rationale: Ang תפשׂ ay nangangahulugang hulihin o dakpin. Ang “hulihin” ay natural sa makabagong Tagalog at angkop sa pagdakip sa isang pangkat ayon sa utos.
- source_word: חַיִּים
  choice: buhay
  rationale: 'Ginagamit dito bilang paglalarawan sa kalagayan nila nang hulihin: dapat silang madakip nang buhay, hindi agad patayin.'
- source_word: וַיִּשְׁחָטוּם
  choice: kinatay
  rationale: Mas mariin at mas tiyak ang שׁחט kaysa sa pangkalahatang “pumatay.” Pinananatili ng “kinatay” ang marahas na diwa ng kilos nang hindi ito pinapahina.
- source_word: אֶל־בּוֹר
  choice: sa hukay
  rationale: Maaaring tumukoy ang אֶל sa kinaroroonan o direksiyon. Ang “sa hukay” ay likas sa Tagalog at hindi ganap na nagpapasiya kung sa tabi o sa loob mismo naganap ang pagkatay; inilalahad sa talababa ang iba pang posibleng spatial na diwa.
- source_word: בֵּית עֵקֶד
  choice: Bet-Eked
  rationale: Ginagamit sa talata bilang pangalan ng lugar, kaya isinalin sa pamamagitan ng transliterasyon sa halip na gawing karaniwang pangngalan.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: apatnapu’t dalawang lalaki
  rationale: Karaniwang parirala ito sa Hebreo para sa pagbibilang ng mga lalaking nasa hustong gulang; malinaw at natural ang “lalaki” sa Tagalog.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Wala siyang iniwang isa man sa kanila
  rationale: Isahan ang pandiwang Hebreo at tumutukoy kay Jehu bilang gumagawa. Pinananatili ng “isa man” ang diin na walang nakaligtas sa kanila.
