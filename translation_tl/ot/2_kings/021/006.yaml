revisions:
- from: Pinaraan niya sa apoy ang kanyang anak[a], nanghula siya at nagbasa ng mga palatandaan[b], at gumamit siya ng mga espiritista at mga sumasangguni sa espiritu[c]. Lubha niyang pinarami ang paggawa ng masama sa paningin ni Yahweh, kaya ginalit niya ito.
  to: Pinaraan niya sa apoy ang kanyang anak[a], nanghula siya at nagbigay-kahulugan sa mga palatandaan[b], at nakipag-ugnayan siya sa mga medium at espiritista[c]. Labis siyang gumawa ng masama sa paningin ni Yahweh upang galitin siya.
  rationale: Inayos ang mga pariralang di-likas sa Tagalog, nilinaw ang dalawang uri ng practitioner nang hindi nililimitahan ang mahirap na Hebreong idyoma sa pagkonsulta lamang, at isinalin ang pangwakas na infinitive sa paraang mas malapit sa pinagmulan. Pinanatili ang sinadyang idyoma tungkol sa apoy at ang talababa nito upang hindi magpataw ng mas tiyak na rekonstruksiyon ng ritwal.
  reviewer_model: gpt-5.6-terra
