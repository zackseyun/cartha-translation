  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: tl
  text: Pinaraan niya sa apoy ang kanyang anak[a], nanghula siya at nagbigay-kahulugan sa mga palatandaan[b], at nakipag-ugnayan siya sa mga medium at espiritista[c]. Labis siyang gumawa ng masama sa paningin ni Yahweh upang galitin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas tahasan, “Inihandog niya sa apoy ang kanyang anak.” Literal sa Hebreo: “Pinaraan niya sa apoy ang kanyang anak.”'
    reason: alternative_reading
  - marker: b
    text: Ang “nagbigay-kahulugan sa mga palatandaan” ay maaari ring isaling “nagsagawa ng panghuhula.”
    reason: lexical_alternative
  - marker: c
    text: O “sumangguni siya sa mga medium at espiritista.” Mahirap ang idyomang Hebreo at maaaring tumukoy nang mas malawak sa pakikitungo o paggamit sa gayong mga practitioner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: Pinaraan niya sa apoy ang kanyang anak
  rationale: Pinananatili nito ang mismong idyomang Hebreo at hindi agad nililinaw kung sinunog o inihandog ang anak, bagaman malakas ang kaugnayan nito sa paghahandog ng bata.
- source_word: וְעוֹנֵן
  choice: nanghula siya
  rationale: Natural na salin ito para sa ipinagbabawal na panghuhulang naglalayong alamin ang hinaharap.
- source_word: וְנִחֵשׁ
  choice: nagbasa ng mga palatandaan
  rationale: Ipinakikita nito ang mas tiyak na diwa ng paghula sa pamamagitan ng mga tanda at pinananatiling naiiba sa naunang termino.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: gumamit siya ng mga espiritista at mga sumasangguni sa espiritu
  rationale: Malawak ang mahirap na idyomang may עשה; ang “gumamit” ay nagpapahayag ng pakikitungo o paggamit sa gayong mga practitioner nang hindi ipinipilit na hinirang lamang o kinonsulta sila.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: Lubha niyang pinarami ang paggawa
  rationale: Pinananatili ang intensipikasyon ng Hiphil ng רבה at ang di-karaniwang diin ng Hebreo, kahit bahagyang markado sa Tagalog.
- source_word: הָרַע
  choice: ng masama
  rationale: Natural na substantibong panumbas sa moral na kategoryang ipinahahayag ng Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang metaporang Hebreo at isinasalin ang banal na pangalan ayon sa patakaran ng proyekto.
- source_word: לְהַכְעִיס
  choice: kaya ginalit niya ito
  rationale: Ipinahahayag ang bunga ng kanyang mga gawa at ang causative force ng pandiwa; ang “ito” ay tumutukoy kay Yahweh.
theological_decisions:
- issue: Antas ng paglilinaw sa idyoma tungkol sa paghahandog ng anak
  choice: Panatilihin sa pangunahing teksto ang “Pinaraan niya sa apoy ang kanyang anak.”
  alternative: “Inihandog niya sa apoy ang kanyang anak” o “Sinunog niya sa apoy ang kanyang anak.”
  rationale: Malakas ang pahiwatig ng paghahandog ng bata, ngunit idyomatiko ang mismong pananalita ng Hebreo. Pinananatili ng salin ang tensiyon at inilalagay sa talababa ang mas tahasang posibleng kahulugan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Sinusunod nito ang patakaran ng proyekto para sa Tetragrammaton at tuwirang kinakatawan ang personal na pangalan.
- issue: Saklaw ng עָשָׂה kaugnay ng אוֹב וְיִדְּעֹנִים
  choice: gumamit siya ng mga espiritista at mga sumasangguni sa espiritu
  alternative: sumangguni siya sa mga espiritista at mga sumasangguni sa espiritu
  rationale: Mahirap at malawak ang idyomang literal na “gumawa.” Hindi nito tiyak na nililimitahan ang kilos sa pagkonsulta lamang, kaya pinili ang mas malawak na “gumamit.”
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang markadong “Lubha niyang pinarami ang paggawa” upang maipakita ang intensipikasyon ng Hebreo. Magkakaiba ang mga termino para sa dalawang anyo ng panghuhula at sa dalawang uri ng tagapamagitan sa espiritu, nang hindi gumagamit ng labis na teknikal o denominasyonal na pananalita.
