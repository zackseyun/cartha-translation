  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: tl
  text: At iuunat ko sa ibabaw ng Jerusalem ang panukat na lubid ng Samaria at ang hulog ng sambahayan ni Ahab[a], at papahirin ko ang Jerusalem gaya ng pagpahid sa isang pinggan[b], papahirin ito at itataob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang panukat na lubid ng Samaria at ang hulog ng sambahayan ni Ahab.” Ang hulog ay pabigat na ginagamit sa pagsukat upang matiyak na tuwid. Ipinahihiwatig ng larawan ang pagsukat sa Jerusalem para sa paghatol ayon sa pamantayang inilapat sa Samaria at sa sambahayan ni Ahab.
    reason: lexical_alternative
  - marker: b
    text: O “mangkok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: At iuukol ko sa
  rationale: Ang נָטָה ay literal na ‘iunat’ o ‘ilatag,’ ngunit kasama ng mga panukat at ng pang-ukol na עַל, ang natural na Filipino ay ‘iuukol sa.’ Napananatili nito ang paglalapat ng panukat sa Jerusalem nang hindi ginagawang literal ngunit alanganing ‘iuunat sa ibabaw.’
- source_word: קָו
  choice: panukat na lubid
  rationale: Tumutukoy ang קָו sa linyang ginagamit sa pagsukat. Ang ‘panukat na lubid’ ay kongkreto at madaling maunawaan sa makabagong Filipino.
- source_word: מִשְׁקֹלֶת
  choice: hulog na panukat
  rationale: Ito ay kasangkapang may pabigat na ginagamit upang tiyaking tuwid ang isang pader. Ang ‘hulog na panukat’ ay malinaw na terminong Filipino at pinananatili ang larawang pangkonstruksiyon at panghatol.
- source_word: בֵּית אַחְאָב
  choice: sambahayan ni Ahab
  rationale: Ang ‘sambahayan’ ay likas na salin ng dinastikong ‘bahay ni Ahab’ at maaaring tumukoy sa kaniyang angkan at maharlikang dinastiya.
- source_word: וּמָחִיתִי
  choice: Papahirin ko
  rationale: Ang kasunod na paghahambing sa pagpahid ng pinggan ang tumutukoy sa kongkretong diwa. Pinananatili ng ‘papahirin’ ang pag-uulit at matinding larawan ng lubusang pag-aalis.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: gaya ng pagpahid sa isang pinggan
  rationale: Ang anyong panlalaking isahan ay gamit na di-tiyak o pangkalahatan; hindi kailangang tukuyin ang gumagawa. Ang צַלַּחַת ay maaaring pinggan o mangkok.
- source_word: מָחָה
  choice: papahirin ito
  rationale: Inuulit ng Hebreo ang pandiwa upang idiin at ilarawan ang kilos. Pinananatili ng salin ang pag-uulit nang natural sa Filipino.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: at itataob
  rationale: Literal itong ‘ibabaligtad sa mukha nito.’ Para sa pinggan, likas at malinaw sa Filipino ang ‘itataob.’
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Karaniwang anyo ng pangalan ng lugar sa Filipino.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Karaniwang anyo ng pangalan ng lugar sa Filipino.
theological_decisions:
- issue: Kalikasan ng larawang paghuhukom mula sa Samaria at sambahayan ni Ahab
  choice: Ipinapakita ng talata na hahatulan ang Jerusalem sa pamamagitan ng kaparehong mga panukat na ginamit laban sa Samaria at sa sambahayan ni Ahab.
  alternative: Sa ibang konteksto, maaaring magpahiwatig ng muling pagtatayo o pagpapanumbalik ang mga panukat.
  rationale: Bagaman maaaring tumukoy sa pagtatayo ang ganitong larawan sa ibang mga teksto, malinaw sa konteksto ng paghatol at sa larawan ng pinahid at itinaob na pinggan na mapanira ang kahulugan dito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘iuukol’ upang gawing natural ang ugnayan ng pandiwa at mga panukat, habang ipinaliliwanag sa talababa ang mas literal na larawan. Napanatili ang kongkretong metapora, pag-uulit, at bigat ng paghatol.
