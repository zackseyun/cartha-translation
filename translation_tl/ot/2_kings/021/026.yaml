  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: tl
  text: Inilibing[a] siya sa libingan[b] niya sa hardin ni Uza, at si Josias na anak niya ang naging hari kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at inilibing niya siya.” Pormal na isahan ang pandiwa, ngunit hindi pinangalanan ang tagaganap; balintiyak ang gamit sa Filipino upang hindi ito tukuyin.
    reason: lexical_alternative
  - marker: b
    text: O “puntod” o “dakong libingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: Inilibing siya
  rationale: Bagaman pormal na ikatlong panauhang panlalaking isahan ang pandiwa ('inilibing niya'), hindi tinutukoy sa konteksto ang tagaganap. Likas sa Filipino ang pangungusap na balintiyak upang mapanatili ang di-tiyak na tagaganap nang hindi nagdaragdag ng 'sila' na wala sa anyong Hebreo.
- source_word: קְבֻרָתוֹ
  choice: sa libingan niya
  rationale: Tumutukoy ito sa lugar ng paglilibing. Ang 'libingan' ay natural at sapat na malawak upang saklawin ang maaaring kahulugang puntod o himlayan.
- source_word: גַן עֻזָּא
  choice: sa hardin ni Uza
  rationale: Natural na Filipino ang 'hardin ni Uza' para sa ugnayang construct ng Hebreo at malinaw na ipinahihiwatig na ang hardin ay kaugnay o pag-aari ni Uza.
- source_word: וַיִּמְלֹךְ
  choice: ang naging hari
  rationale: Sa pormula ng paghalili, ipinahihiwatig ng pandiwa ang pagluklok o pagsisimulang maghari; tuwirang ipinapahayag ito ng 'naging hari.'
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Ipinahihiwatig ng idyoma ang paghalili sa katungkulan. Natural at malinaw sa modernong Filipino ang 'bilang kahalili niya.'
