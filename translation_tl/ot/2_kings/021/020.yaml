base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh[a], gaya ng ginawa ng kanyang amang si Manases.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga mata ni Yahweh.”
    reason: Ipinakikita ang literal na anyo ng idyomang Hebreo na isinaling natural bilang “sa paningin ni Yahweh.”
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas at malinaw na salin ng idyomang Hebreo na עשה הרע, na tumutukoy sa paggawa ng masama ayon sa pagsusuri ng Diyos.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang metaporang 'sa mga mata/paningin' sa isang natural na pariralang Filipino at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: gaya ng ginawa
  rationale: Tuwirang ipinahahayag ang paghahambing sa ginawa noon ni Manases; hindi kailangan sa Filipino ang tahasang past perfect.
- source_word: מְנַשֶּׁה אָבִיו
  choice: ng kanyang amang si Manases
  rationale: Natural na ayos sa Filipino para sa pangalang nasa aposisyon sa 'kanyang ama'; ginagamit ang karaniwang anyong Filipino na Manases.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikli at mariing paghahambing ng orihinal.
