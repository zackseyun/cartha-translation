base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: tl
  text: Iniwan niya si Yahweh[a], ang Diyos ng kanyang mga ama,[b] at hindi siya lumakad sa daan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tinalikuran niya si Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang Diyos ng kanyang mga ninuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: Iniwan
  rationale: Ang עזב ay nangangahulugang iwan o talikuran. Likas at malinaw sa makabagong Tagalog ang “iniwan,” at sa konteksto ay nagpapahiwatig ito ng pagtataksil sa tipan nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: ang Diyos ng kanyang mga ninuno
  rationale: Ang אבות ay literal na “mga ama,” ngunit sa pariralang ito ay tumutukoy sa mga naunang salinlahi. Ang “mga ninuno” ay natural at tumpak sa Tagalog; inilalagay sa talababa ang mas literal na anyo.
- source_word: וְלֹא הָלַךְ
  choice: at hindi siya lumakad
  rationale: Pinananatili ng “lumakad” ang biblikal na metapora ng pamumuhay o pagkilos ayon sa isang landas.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: sa daan ni Yahweh
  rationale: Ang דרך ay literal na daan at metaporikal na paraan ng pamumuhay. Nauunawaan sa Tagalog ang “sa daan ni Yahweh” at pinananatili nito ang larawan ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang banal na pangalan. Pinananatili ng “Yahweh” ang pagkakaiba ng personal na pangalan at ng titulong Panginoon.
- issue: Saklaw ng אֲבֹתָיו
  choice: mga ninuno
  alternative: mga ama
  rationale: Bagaman panlalaking maramihan ang literal na anyo, sa kontekstong pangangkan at pangtipan ay maaari itong tumukoy sa mga ninunong salinlahi. Pinili ang natural na Tagalog habang pinananatili sa talababa ang literal na pagbasa.
- issue: Metapora ng paglakad sa דרך יהוה
  choice: lumakad sa daan ni Yahweh
  alternative: sumunod sa paraan ni Yahweh
  rationale: Hindi nilulutas sa isang abstraktong paraphrase ang metaporang Hebreo; pinananatili ang larawan ng paglakad bilang asal at pamumuhay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at ang biblikal na metapora ng paglakad; ginamit ang “mga ninuno” bilang likas na Tagalog para sa kolektibong pangangkan.
