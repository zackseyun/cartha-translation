language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: tl
  text: At hindi ko na muling pagagala-galain ang paa ng Israel mula sa lupaing ibinigay ko sa kanilang mga ninuno[a], kung maingat lamang nilang isagawa ang lahat ng iniutos ko sa kanila at sundin ang buong Kautusan[b] na iniutos sa kanila ng lingkod kong si Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kanilang mga ama”; isang pananalitang pangtipan para sa mga ninuno ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “Kautusan” ay maaari ring isaling “tagubilin”; dito ay tumutukoy ito sa Torah na iniutos sa pamamagitan ni Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: hindi ko na muling
  rationale: Likas na ipinahahayag sa Tagalog ang idyomang Hebreo na literal na ‘hindi na magdaragdag’ bilang hindi na muling gagawin ang kilos.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: pagagala-galain ang paa ng Israel
  rationale: Pinananatili ang isahang ‘paa’ at ang larawan ng sapilitang pagkalagalag o pagkataboy, sa halip na agad itong gawing tahasang ‘paalisin.’
- source_word: הָאֲדָמָה
  choice: lupain
  rationale: Sa kontekstong tipan at teritoryal, tumutukoy ito sa lupaing ipinagkaloob sa mga ninuno, hindi lamang sa lupa o putik.
- source_word: לַאֲבוֹתָם
  choice: sa kanilang mga ninuno
  rationale: Natural at saklaw sa modernong Tagalog ang patriyarkal na mga ninunong tinutukoy ng covenantal na ‘mga ama.’
- source_word: רַק אִם
  choice: kung ... lamang
  rationale: Pinananatili ang tunay at mahigpit na kondisyon ng parirala nang hindi ito pinahihina.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: iingatan nilang gawin
  rationale: Sinasalamin ang ideya ng maingat na pagbabantay upang isagawa, hindi lamang pangkalahatang pagsunod.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: ang lahat ng iniutos ko sa kanila
  rationale: Malinaw na ipinapahayag ang kabuuang saklaw ng iniutos; hindi kailangang piliting ulitin ang ‘ayon sa’ sa Tagalog.
- source_word: וּלְכָל הַתּוֹרָה
  choice: at sundin ang buong Kautusan
  rationale: Ang ‘Kautusan’ ang natural na katawagan sa Mosaic Torah sa kontekstong ito; ang pandiwang ‘sundin’ ay nagsisilbing malinaw na Tagalog na pandiwaring kaugnay ng pinagsamang estruktura.
- source_word: עַבְדִּי מֹשֶׁה
  choice: ng lingkod kong si Moises
  rationale: Dangal at natural sa Tagalog, habang pinananatili ang titulong ‘aking lingkod.’
theological_decisions:
- issue: Ang kondisyon ng patuloy na pananatili ng Israel sa lupain
  choice: Inilalahad ang masusing pagsunod bilang tunay na kondisyon upang hindi na muling pagagala-galain ang Israel mula sa lupain.
  alternative: Ituring ang kondisyon bilang retorikal lamang o palambutin ito dahil sa mga pangakong walang kondisyon.
  rationale: Malinaw na nagpapahayag ng mahigpit na kondisyon ang רַק אִם. Pinananatili ng salin ang tensiyong pangtipan nang hindi nagpapasya nang higit sa sinasabi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang konkretong larawang ‘paa ng Israel’ at ang kondisyonal na diin ng Hebreo, habang ginawang natural ang sintaks sa Tagalog.
