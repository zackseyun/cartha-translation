  to: At hindi ko na muling pagagala-galain ang paa ng Israel mula sa lupaing ibinigay ko sa kanilang mga ninuno[a], kung maingat lamang nilang isagawa ang lahat ng iniutos ko sa kanila at sundin ang buong Kautusan[b] na iniutos sa kanila ng lingkod kong si Moises.
