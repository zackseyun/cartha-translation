base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: tl
  text: At nahimlay si Manases kasama ng kanyang mga ninuno[a], at inilibing siya sa hardin ng kanyang bahay, sa hardin ni Uza. At si Amon na anak niya ang naging hari kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na pagkakasalin: “humiga kasama ng kanyang mga ninuno”; isa itong nakaugaliang Hebreong pahayag tungkol sa pagkamatay ng isang hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nahimlay
  rationale: Ang שׁכב ay literal na ‘humiga’ at ginagamit dito bilang nakaugaliang pormula sa pagkamatay ng isang hari. Ang ‘nahimlay’ ay marangal at likas sa Filipino, at pinananatili ang larawan ng Hebreo nang hindi tahasang pinapalitan ng ‘namatay.’
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Tinutukoy ng אָבוֹת sa pormulang ito ang mga naunang salinlahi. Mas malinaw sa karaniwang modernong Filipino ang ‘mga ninuno’ kaysa literal na ‘mga ama,’ habang nananatili ang diwang pangangkanan.
- source_word: וַיִּקָּבֵר
  choice: inilibing siya
  rationale: Likas na aktibong anyong Filipino na tapat sa pasibong Hebreong Niphal; hindi tinutukoy ang tagapaglibing sapagkat wala rin ito sa teksto.
- source_word: בְּגַן בֵּיתוֹ
  choice: sa hardin ng kanyang bahay
  rationale: Pinananatili ang literal na ‘bahay’ at hindi ipinapasok ang mas tiyak na ‘palasyo,’ bagaman maharlikang tirahan ang maaaring tinutukoy.
- source_word: בְּגַן עֻזָּא
  choice: sa hardin ni Uza
  rationale: Pinananatili ang inuulit na pariralang panglunan bilang paglilinaw sa naunang ‘hardin ng kanyang bahay.’
- source_word: וַיִּמְלֹךְ
  choice: naging hari
  rationale: Sa pormula ng paghalili, ipinahihiwatig ng מלך ang pagluklok sa paghahari, kaya mas tiyak dito ang ‘naging hari’ kaysa ‘naghari.’
- source_word: תַּחְתָּיו
  choice: kapalit niya
  rationale: Natural na ipinapahayag sa Filipino ang paghalili sa puwesto ng naunang hari at tapat sa kahulugan ng תחת sa kontekstong dinastiko.
theological_decisions:
- issue: Idyoma ng kamatayan sa pariralang וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: Pinanatili bilang ‘nahimlay ... kasama ng kanyang mga ninuno.’
  alternative: ‘Namatay’ o ‘natulog kasama ng kanyang mga ninuno.’
  rationale: Hindi tahasang nilulutas sa payak na ‘namatay’ ang talinghagang Hebreo, ngunit iniiwasan din ang ‘natulog,’ na maaaring magmungkahi sa modernong mambabasa ng isang partikular na paliwanag tungkol sa kalagayan pagkamatay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang anyo ng mga pangalang Manases, Amon, at Uza. Pinanatili ang pag-uulit ng ‘hardin’ at ang ‘bahay’ sa halip na ipakahulugang ‘palasyo.’
