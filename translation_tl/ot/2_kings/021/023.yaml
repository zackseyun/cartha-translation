  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: tl
  text: Nagsabwatan laban kay Amon ang kanyang mga lingkod, at pinatay nila ang hari sa sarili niyang bahay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagplano laban sa kanya.”
