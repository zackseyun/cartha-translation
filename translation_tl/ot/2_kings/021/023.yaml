lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: nagkaisang maghimagsik
  rationale: Sa kontekstong pampolitika, ang קשר ay tumutukoy sa pagbubuo ng sabwatan laban sa pinuno. Ipinahahayag ng pariralang ito ang sama-samang lihim at mapanlabang pagkilos sa natural na Filipino.
- source_word: עַבְדֵי אָמוֹן
  choice: ang kanyang mga lingkod
  rationale: Ang עֲבָדִים dito ay mga lingkod o tauhan sa maharlikang sambahayan. Pinananatili ng “mga lingkod” ang payak na katawagan ng Hebreo nang hindi ito pinakikitid sa “mga opisyal.”
- source_word: עָלָיו
  choice: laban kay Amon
  rationale: Ang עַל sa wikang ginagamit tungkol sa sabwatan ay nagpapahiwatig ng mapanlabang pagkilos. Inulit ang pangalang Amon upang maging malinaw ang tinutukoy sa natural na Filipino.
- source_word: וַיָּמִיתוּ
  choice: pinatay nila
  rationale: Ang Hiphil ng מות ay literal na “pinapangyaring mamatay.” Ang “pinatay nila” ang malinaw, tuwiran, at likas na katumbas nito sa Filipino.
- source_word: אֶת־הַמֶּלֶךְ
  choice: ang hari
  rationale: Ginagamit ng Hebreo ang titulo sa halip na pangalan; pinananatili ito sa salin.
- source_word: בְּבֵיתוֹ
  choice: sa sarili niyang bahay
  rationale: Ang hulaping panghalip ay nangangahulugang “kanyang bahay.” Ang “sarili niyang” ay natural na nagbibigay-diin na doon mismo sa tahanan ng hari nangyari ang pagpatay.
