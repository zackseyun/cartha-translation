base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: tl
  text: Labindalawang taong gulang si Manases nang maging hari siya, at limampu’t limang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Hefziba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Hefziba” ay humigit-kumulang na nangangahulugang “Ang kinalulugdan ko ay nasa kanya.”
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Labindalawang taong gulang
  rationale: Karaniwang idyomang Hebreo ito para sa edad; natural at tumpak ang ganitong anyo sa modernong Tagalog.
- source_word: בְמָלְכוֹ
  choice: nang maging hari siya
  rationale: Ipinapahayag ng parirala ang panahon ng pagluklok ni Manases bilang hari; natural ito sa Tagalog at pinananatili ang diwa ng pormulang pangpaghahari.
- source_word: מְנַשֶּׁה
  choice: Manases
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: limampu’t limang taon
  rationale: Natural na pagpapahayag sa Tagalog ng pinagsamang bilang na limampu at lima.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tuwirang tumutukoy ang pandiwa sa pamamahala bilang hari sa loob ng itinakdang panahon.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Tuwirang lokatibong salin ng pang-ukol at pangalan ng lugar.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang pormula ng Hebreo sa natural at malinaw na ayos ng modernong Tagalog.
- source_word: חֶפְצִי בָהּ
  choice: Hefziba
  rationale: Isinalin bilang transliteradong pangalang pantangi sa halip na gawing kahulugan nito ang mismong pangalan.
