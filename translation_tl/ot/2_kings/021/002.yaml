source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, gaya ng mga kasuklam-suklam na gawain[a] ng mga bansang pinalayas ni Yahweh mula sa harapan ng mga anak ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa mga karumal-dumal na kaugalian ng mga bansa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ng Israel” ay karaniwang katawagan sa Hebreo para sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ginawa niya ang masama
  rationale: Likas na salin ito ng karaniwang Hebreong pormula para sa paggawa ng itinuturing na masama, nang hindi ginagawang labis na literal ang הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang metapora ng Hebreo tungkol sa pagsusuri ng Diyos at natural din sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כְּתוֹעֲבֹת
  choice: gaya ng mga kasuklam-suklam na gawain
  rationale: Ipinahihiwatig ng תּוֹעֵבָה rito ang mga gawaing lubhang karima-rimarim sa moral at panrelihiyong pananaw; ipinapahayag ng “gaya ng” ang paghahambing na dala ng כְּ.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga di-Israelitang bayan o pangkat ng lupain; ang “mga bansa” ay malawak at hindi nagdaragdag ng katawagang panrelihiyon.
- source_word: הוֹרִישׁ
  choice: pinalayas
  rationale: Ang hiphil ng ירש sa kontekstong ito ay nangangahulugang inalis sa kanilang lupain o itinaboy; malinaw at natural ang “pinalayas.”
- source_word: מִפְּנֵי
  choice: mula sa harap
  rationale: Pinananatili nito ang spatial na larawan ng Hebreo, bagaman mas pormal ito kaysa sa karaniwang pananalita.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Tapat itong nagpapanatili sa tahasang pananalitang filial ng Hebreo; maipapaliwanag sa talababa ang mas idyomatikong “mga Israelita.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng “mga kasuklam-suklam na gawain”
  choice: mga kasuklam-suklam na gawain
  alternative: mga karumal-dumal na kaugalian
  rationale: Hindi nililimitahan ng salin ang salita sa iisang uri ng ritwal o kasalanan; pinananatili nito ang malawak ngunit matinding paghatol ng tekstong Hebreo.
- issue: Pagpapanatili sa pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang anyong filial ng Hebreo nang hindi ipinapalagay na mga lalaking indibidwal lamang ang tinutukoy; ibinibigay sa talababa ang karaniwang kolektibong katumbas.
translation_notes:
  register: Modernong Filipino na may marangal na tonong angkop sa salin ng Kasulatan. Pinanatili ang pormulang “sa paningin ni Yahweh” at ang filial na “mga anak ng Israel,” habang nilinaw na mga gawain ang tinutukoy ng תּוֹעֵבוֹת.
