base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: tl
  text: Bukod dito, napakaraming dugo ng mga walang-sala ang ibinubo ni Manases, hanggang sa mapuno niya ng dugo ang Jerusalem mula sa isang dulo hanggang sa kabila[a], bukod pa sa kasalanan niyang nagdulot sa Juda na gumawa ng masama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “bibig sa bibig,” isang idyomang nangangahulugang sa buong lunsod, mula sa isang dulo hanggang sa kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bukod dito
  rationale: Ipinahahayag ang karagdagang paratang laban kay Manases at likas itong pakinggan sa makabagong Tagalog.
- source_word: דָּם נָקִי
  choice: dugo ng mga walang-sala
  rationale: Pinananatili ang larawang legal at moral ng dugong ibinubo dahil sa pagpatay sa mga taong walang kasalanan.
- source_word: שָׁפַךְ
  choice: nagbubo
  rationale: Ang “nagbubo ng dugo” ang malapit at mauunawaang katumbas ng idyomang Hebreo para sa pagpatay.
- source_word: הַרְבֵּה מְאֹד
  choice: napakaraming
  rationale: Malinaw na naipapahayag ang matinding diin ng magkasunod na pananalitang tumutukoy sa dami.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: hanggang sa mapuno niya ang Jerusalem mula sa isang dulo hanggang sa kabila
  rationale: Inilalahad ang kahulugan ng idyomang “bibig sa bibig” bilang paglaganap sa buong lunsod, habang inilalagay sa talababa ang literal na larawan.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: bukod pa sa kasalanan niya
  rationale: Pinananatili ang isahang “kasalanan” at nililinaw na ang pagbububo ng dugo ay karagdagan pa sa naunang pagkakasala.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: na naging dahilan upang magkasala ang Juda
  rationale: Ipinananatili ang causative na diwa ng Hiphil at ang pananagutan ni Manases, sa natural na Tagalog.
- source_word: לַעֲשׂוֹת הָרַע
  choice: at gawin ang masama
  rationale: Tuwirang ipinapahayag ang nilalaman o bunga ng pagkakasala ng Juda, kasunod ng infinitive sa Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang malinaw na metapora ng Hebreo at ang banal na pamantayan ng paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” nang hindi pinapalitan ng titulo.
- issue: Lakas ng pananagutan ni Manases sa הֶחֱטִיא
  choice: naging dahilan upang magkasala ang Juda
  alternative: inakay ang Juda sa kasalanan; pinangyaring magkasala ang Juda
  rationale: Ipinahahayag ang causative na anyo at aktibong pananagutan ni Manases, ngunit iniiwasan ang di-likas na Tagalog.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang talinghaga ng pagbububo ng dugo, samantalang isinalin ayon sa kahulugan ang di-likas na idyomang “bibig sa bibig.”
