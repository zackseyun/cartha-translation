source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: tl
  text: sapagkat ginawa nila ang masama sa aking paningin at patuloy nila akong ginagalit mula noong araw na lumabas sa Ehipto ang kanilang mga ninuno[a] hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanilang mga ama,” isang panlalaking katawagang pampagkamag-anak na tumutukoy rito sa mga naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: sapagkat
  rationale: Malinaw at marangal na panandang sanhi ito, at iniuugnay nito ang talata sa hatol na ipinahayag sa naunang talata.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: ginawa nila ang masama
  rationale: Natural na Filipino ito para sa Hebreong idyomang nangangahulugang paggawa ng masama; hindi nito ipinapalagay na tumutukoy ang parirala sa isang tiyak na bagay na tinatawag na “ang kasamaan.”
- source_word: בְּעֵינַי
  choice: sa aking paningin
  rationale: Pinananatili nito ang Hebreong metapora ng moral na pagsusuri at malinaw pa rin sa modernong Filipino.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: at patuloy nila akong ginalit
  rationale: Ang היה na may participle ay nagpapahiwatig ng nagpapatuloy o nakaugaliang pagkilos. Ipinahahayag ng “patuloy” ang aspektong ito nang natural.
- source_word: מַכְעִסִים
  choice: ginalit
  rationale: Ang Hiphil ng כעס ay nangangahulugang nagdulot sila ng galit ng Diyos. Mas tuwiran at natural sa Filipino ang “ginalit” kaysa sa mas mabigat na “pinukaw sa galit.”
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: mula noong araw na
  rationale: Pinananatili nito ang tahasang panimulang punto ng mahabang kasaysayan ng kanilang pagkakasala.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: lumabas sa Ehipto ang kanilang mga ninuno
  rationale: Ang “lumabas sa Ehipto” ay natural at malapit sa karaniwang kahulugan ng יצא sa konteksto ng Exodo. Inilalagay ang simuno pagkatapos ng pandiwa ayon sa natural na ayos sa Filipino.
- source_word: אֲבוֹתָם
  choice: kanilang mga ninuno
  rationale: Sa kontekstong ito, tumutukoy ang panlalaking katawagang Hebreo sa mga naunang salinlahi ng Israel. Ang “mga ninuno” ang malinaw at natural na katumbas sa modernong Filipino; inilalahad sa talababa ang literal na anyo.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Karaniwang Filipino itong katumbas na nagpapanatili sa diwa ng pagpapatuloy hanggang sa kasalukuyang panahong tinutukoy ng teksto.
theological_decisions:
- issue: Pagkakaugnay ng kasalanan ng bayan sa buong kasaysayan ng Israel mula sa Exodo
  choice: Panatilihin ang kolektibo at makasaysayang paglalarawan ng patuloy na paghihimagsik.
  alternative: Ituring lamang itong retorikal na buod ng mga kasalanan ng mga kamakailang hari.
  rationale: Tahasang tinutunton ng talata ang pagpukaw nila sa galit ng Diyos mula sa salinlahing lumabas sa Ehipto hanggang sa panahong tinutukoy. Hindi nililimitahan o ipinapaliwanag nang higit sa teksto ang saklaw ng kolektibong pananagutan.
- issue: Saklaw ng אֲבוֹתָם bilang katawagang pampagkamag-anak
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Bagaman literal na panlalaking katawagan ang Hebreo, sa konteksto ay tinutukoy nito ang mga naunang salinlahi. Pinipili sa pangunahing teksto ang malinaw na kahulugan sa modernong Filipino habang pinananatili sa talababa ang literal na anyo at ang tunay na leksikal na detalye.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “sa aking paningin” at ang patuloy na aspekto ng pagpukaw sa galit ng Diyos, habang iniwasan ang sobrang literal na ayos ng mga salita na magiging asiwa sa Filipino.
