  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אָמ֣וֹן בְּ/מָלְכ֔/וֹ וּ/שְׁתַּ֣יִם שָׁנִ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מְשֻׁלֶּ֥מֶת בַּת חָר֖וּץ מִן יָטְבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: tl
  text: Dalawampu't dalawang taong gulang si Amon nang magsimula siyang maghari, at dalawang taon siyang naghari sa Jerusalem. Ang pangalan ng kanyang ina ay Mesulemet, na anak ni Haruz na taga-Jotba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: Dalawampu't dalawang taong gulang
  rationale: Likas na salin sa Filipino ng karaniwang pormulang Hebreo para sa edad; malinaw nitong ipinapahayag ang kahulugan nang hindi kinokopya ang idyomang “anak ng dalawampu't dalawang taon.”
- source_word: בְּמָלְכוֹ
  choice: nang magsimula siyang maghari
  rationale: Ang ב na sinusundan ng infinitive construct ay nagsasaad ng panahon ng pagluklok; natural sa Filipino ang ganitong pahayag.
- source_word: מָלַךְ
  choice: naghari
  rationale: Tiyak na tumutukoy ang pandiwa sa pamamahala bilang hari, hindi lamang sa pagkakaroon ng titulong hari.
- source_word: בִּירוּשָׁלִָם
  choice: sa Jerusalem
  rationale: Karaniwang panandang lokatibo sa modernong Filipino.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Pinananatili ang impormasyong pangangkan habang gumagamit ng natural at marangal na ayos sa Filipino.
- source_word: מְשֻׁלֶּמֶת
  choice: Mesulemet
  rationale: Isinalin-titik ang pangalang Hebreo ayon sa bigkas na angkop sa ortograpiyang Filipino.
- source_word: בַּת חָרוּץ
  choice: anak ni Haruz
  rationale: Natural na pahayag sa Filipino para sa ugnayang anak na babae at ama; hindi na kailangang idagdag ang “babae” dahil malinaw ito sa pagkakakilanlan kay Mesulemet.
- source_word: מִן יָטְבָה
  choice: na taga-Jotba
  rationale: Ipinahihiwatig ng מִן ang pinagmulan. Ang “taga-Jotba” ang pinakanatural na katumbas sa Filipino at maaaring tumukoy kay Haruz, gaya ng pinakamalapit na pagkakaugnay sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “maghari” para mapanatili ang teknikal na diwa ng pormulang panghari. Ang “na taga-Jotba” ay ikinabit kay Haruz ayon sa pinakamalapit na sintaktikong ugnayan, nang hindi nagpapasok ng interpretasyong pansekta.
