  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: tl
  text: Nagtayo siya ng mga altar para sa buong hukbo ng langit sa dalawang looban ng bahay ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lahat ng hukbo ng langit.” Ang Hebreong idyomang “hukbo ng langit” ay tumutukoy sa mga nilalang o bagay na makalangit at, sa kontekstong ito, malamang na sa mga katawang makalangit o mga kapangyarihang sinasamba sa pagsambang astral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Nagtayo siya
  rationale: Ang Qal wayyiqtol ng בנה ay karaniwang pandiwang pasalaysay na nangangahulugang ‘nagtayo.’ Hindi na isinama ang panimulang pangatnig upang maging natural sa makabagong Tagalog, habang nananatili ang pagkakasunod-sunod ng salaysay.
- source_word: מִזְבְּחוֹת
  choice: mga altar
  rationale: Tuwirang katumbas ito ng pangmaramihang pangngalang tumutukoy sa mga dambanang pinaghahandugan; malinaw at karaniwan ang ‘altar’ sa modernong Filipino.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: para sa buong hukbo ng langit
  rationale: Pinananatili ng ‘hukbo ng langit’ ang Hebreong idyoma at ang saklaw ng kolektibong כָּל, nang hindi ito nililimitahan sa ‘mga bituin’ lamang. Sa konteksto, maaari itong tumukoy sa mga bagay o kapangyarihang makalangit na sinasamba.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: sa dalawang looban
  rationale: Hayagang pinananatili ang bilang na dalawa. Ang ‘mga looban’ ay natural na tawag sa mga court na bahagi ng templo.
- source_word: בֵּית יְהוָה
  choice: bahay ni Yahweh
  rationale: Pinananatili ang konkretong Hebreong ekspresyong ‘bahay ni Yahweh’ sa halip na ipaliwanag agad bilang ‘templo,’ at isinasalin ang banal na pangalan bilang Yahweh.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang lumilitaw sa teksto ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng צְבָא הַשָּׁמַיִם
  choice: hukbo ng langit
  alternative: mga bituin sa langit; mga kapangyarihan sa langit
  rationale: Ang Hebreong parirala ay sadyang mas malawak kaysa ‘mga bituin’ at maaaring saklawin ang mga katawang langit o makalangit na kapangyarihan. Pinananatili ng salin ang ambigwidad at ang kaugnayan nito sa pagsambang astral.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tradisyonal ngunit madaling maunawaang ‘altar’ at ang Hebreong larawang ‘bahay ni Yahweh’; iniwasan ang labis na pagpapaliwanag sa mismong talata.
