  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: At ang iba pang mga ginawa ni Amon[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga ginawa” ay maaari ring isaling “mga gawain.” Ang salitang Hebreo ay literal na “mga salita” o “mga bagay,” ngunit sa ganitong buod tungkol sa paghahari, tumutukoy ito sa mga naitalang ginawa ng hari.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat” ay tumutukoy sa isang sinaunang nakasulat na tala, malamang na isang balumbon. Maaari ring isalin ang pamagat na “Mga Taunang Talaan ng mga Hari ng Juda.”
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אָמוֹן
  choice: At ang iba pang mga ginawa ni Amon
  rationale: Ang יֶתֶר ay “nalalabi” o “iba pa,” at ang דִּבְרֵי sa pormulang panghari ay tumutukoy sa mga ginawa o gawain ng hari, hindi lamang sa kanyang mga salita. Pinananatili ng “At” ang pang-ugnay na וְ nang hindi nagdaragdag ng panandang temporal.
- source_word: אֲשֶׁר עָשָׂה
  choice: mga ginawa
  rationale: Likas sa modernong Tagalog ang pagsasanib ng paliwanag na “na kanyang ginawa” sa naunang “mga ginawa,” at naiiwasan nito ang mabigat na pag-uulit habang nananatili ang diwa.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang retorikal na tanong na umaasang sasang-ayon ang mambabasa at ang tuwirang kahulugan ng passive participle na “nakasulat.”
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring tumukoy sa isang balumbon, “sa Aklat” ang natural na Tagalog para sa nilalaman ng isang nakasulat na tala; nililinaw ng talababa ang sinaunang anyo nito.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: ng mga Kasaysayan ng mga Hari ng Juda
  rationale: Ang דִּבְרֵי הַיָּמִים ay annalistikong tala o kronika. Ang “mga Kasaysayan” ay malinaw sa karaniwang mambabasa at ang buong parirala ay ginawang pamagat ng binanggit na sanggunian.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong ng Hebreo. Ginamit ang “Amon” at “Juda” ayon sa karaniwang anyo ng mga pangalang biblikal sa Tagalog. Ang mga panandang talababa ay inilagay sa mismong bahaging kanilang ipinapaliwanag.
