  source_fidelity: 'Tumpak na naihahatid ng salin ang pormulang pangbuod: ang nalalabi/iba pang ginawa ni Amon, ang retorikal na tanong, at ang pagtukoy sa nakasulat na opisyal na talaan. Ang "mga ginawa ni Amon" ay likas na naipapaloob ang diwa ng אֲשֶׁר עָשָׂה ("na kanyang ginawa") nang hindi lumilikha ng hindi likas na pag-uulit sa Tagalog.'
