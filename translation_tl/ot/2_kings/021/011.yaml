revisions:
- from: Sapagkat ginawa ni Manases na hari ng Juda ang kasuklam-suklam na mga bagay na ito, at gumawa siya ng higit na masama kaysa sa lahat ng ginawa ng mga Amoreo na nauna sa kanya, at inakay din niya ang Juda na magkasala sa pamamagitan ng kanyang mga diyus-diyosan[a],
  to: Sapagkat ginawa ni Manases na hari ng Juda ang kasuklam-suklam na mga bagay na ito, at higit siyang gumawa ng masama kaysa sa lahat ng ginawa ng mga Amoreo na nauna sa kanya, at inakay din niya ang Juda na magkasala sa pamamagitan ng kanyang mga diyus-diyosan[a],
  rationale: Isang maliit na pag-aayos lamang ang ginawa upang luminaw at maging mas natural ang comparative na sugnay, nang hindi binabago ang saklaw o diin ng Hebreo. Pinanatili ang causative na “inakay ... na magkasala,” ang instrumental na “sa pamamagitan ng,” ang mga pangalang ginagamit sa Tagalog, ang talababa sa tamang ankla, at ang nakabiting estruktura ng talata.
