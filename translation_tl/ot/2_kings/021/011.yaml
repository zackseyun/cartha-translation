source:
  edition: WLC
  text: יַעַן֩ אֲשֶׁ֨ר עָשָׂ֜ה מְנַשֶּׁ֤ה מֶֽלֶךְ יְהוּדָה֙ הַ/תֹּעֵב֣וֹת הָ/אֵ֔לֶּה הֵרַ֕ע מִ/כֹּ֛ל אֲשֶׁר עָשׂ֥וּ הָ/אֱמֹרִ֖י אֲשֶׁ֣ר לְ/פָנָ֑י/ו וַ/יַּחֲטִ֥א גַֽם אֶת יְהוּדָ֖ה בְּ/גִלּוּלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: tl
  text: Sapagkat ginawa ni Manases na hari ng Juda ang kasuklam-suklam na mga bagay na ito, at higit siyang gumawa ng masama kaysa sa lahat ng ginawa ng mga Amoreo na nauna sa kanya, at inakay din niya ang Juda na magkasala sa pamamagitan ng kanyang mga diyus-diyosan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay isang mapanghamak na tawag sa mga diyus-diyosan; maaari rin itong isaling “maruruming diyus-diyosan” o, sa mas matingkad na pagpapahayag, “mga diyus-diyosang dumi.”
    reason: Pinananatili ang matinding mapanuyang puwersa ng גִּלּוּלִים na hindi lubos na naipahahayag ng karaniwang salitang “mga diyus-diyosan.”
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng hatol na ihahayag sa kasunod na talata, at likas ito sa marangal na makabagong Tagalog.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: Manases na hari ng Juda
  rationale: Ginagamit ang karaniwang anyong Tagalog ng pangalan at pinananatili ang titulong maharlika bilang paglalarawan sa kanya.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: ang kasuklam-suklam na mga bagay na ito
  rationale: Inihahayag ng תּוֹעֵבָה ang matinding pagkasuklam sa mga gawaing ito; malinaw at natural sa Tagalog ang pariralang pinili.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: gumawa siya ng higit na masama kaysa sa lahat ng ginawa
  rationale: 'Pinananatili nito ang tahasang paghahambing: nalampasan ng kasamaan ni Manases ang lahat ng ginawa ng naunang bayan.'
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Bagaman anyong isahan ang etnonimo sa Hebreo, kolektibo ang gamit nito rito at likas na ipinahahayag sa Tagalog bilang isang pangkat ng mga tao.
- source_word: אֲשֶׁר לְפָנָיו
  choice: na nauna sa kanya
  rationale: Pinananatili ang malamang na temporal na diwa nang hindi nagdaragdag ng salitang ‘sa lupain,’ na hindi hayag sa teksto.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: at inakay din niya ang Juda na magkasala
  rationale: Ipinapakita ng anyong Hiphil ang pananagutan ni Manases sa pag-akay o pag-udyok sa Juda tungo sa kasalanan, hindi lamang na nagkasala ang Juda.
- source_word: בְּגִלּוּלָיו
  choice: sa pamamagitan ng kanyang mga diyus-diyosan
  rationale: Malinaw na tinutukoy ang mga idolo at pinananatili ang instrumental na diwa ng pang-ukol; inilalahad sa talababa ang mapanghamak na puwersa ng terminong Hebreo.
theological_decisions:
- issue: Mapanghamak na puwersa ng גִּלּוּלִים
  choice: mga diyus-diyosan
  alternative: maruruming diyus-diyosan; mga diyus-diyosang dumi
  rationale: Ang ‘mga diyus-diyosan’ ang pinakamalinaw at pinakanatural sa pangunahing teksto. Gayunman, hindi dapat mawala ang sadyang mapanghamak na himig ng Hebreo, kaya inilalagay iyon sa talababa nang hindi ginagawang labis na magaspang ang pangunahing salin.
- issue: Causative na pananagutan ni Manases sa kasalanan ng Juda
  choice: inakay din niya ang Juda na magkasala
  alternative: pinagkasala rin niya ang Juda
  rationale: Pinananatili ng ‘inakay ... na magkasala’ ang causative na puwersa habang mas natural at malinaw sa makabagong Tagalog kaysa sa mas literal ngunit di-gaanong karaniwang ‘pinagkasala.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino Tagalog. Pinananatili ang anyong sugnay na nakabitin at ang kuwit sa hulihan sapagkat ang talata ay nagbibigay ng dahilan para sa hatol na nagpapatuloy sa susunod na talata. Inilagay ang talababa sa ‘mga diyus-diyosan,’ ang salitang aktuwal na tinutukoy nito.
