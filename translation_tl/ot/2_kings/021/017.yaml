base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Manases, ang lahat ng kanyang ginawa, at ang kasalanang kanyang ginawa—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Juda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga taunang tala ng mga hari ng Juda.” Ang pananalitang Hebreo ay tumutukoy sa isang kalipunan ng mga tala ng kaharian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Ang iba pang mga ginawa ni Manases
  rationale: Sa pormulang pangwakas tungkol sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga ginawa o pangyayari sa buhay ng hari, hindi lamang sa kanyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng kanyang ginawa
  rationale: Tuwirang pinananatili ang saklaw at pag-uulit ng Hebreo, na nagbibigay-diin sa kabuuan ng kanyang mga gawa.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: at ang kasalanang kanyang ginawa
  rationale: Pinananatili ang moral at panrelihiyong bigat ng חַטָּאת at ang pagbibigay-diin ng magkaugnay na pangngalan at pandiwa, nang hindi gumagamit ng di-likas na “kasalanang kanyang ikinasala.”
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong na umaasa ng positibong sagot at ang literal na diwa ng “nakasulat.”
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Juda
  rationale: Ginagamit ang likas na “sa Aklat” para sa talaang kinasusulatan. Ang “mga Kasaysayan” ay title-like na salin ng דִּבְרֵי הַיָּמִים, habang nililinaw ng talababa na maaari itong tumukoy sa mga opisyal na taunang tala.
