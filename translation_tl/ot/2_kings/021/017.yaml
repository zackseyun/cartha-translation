translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong at ang sinadyang pag-uulit ng Hebreo. Inilagay ang marker [a] pagkatapos ng pamagat sapagkat iyon ang salitang nililinaw ng talababa.
