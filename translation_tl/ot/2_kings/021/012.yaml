source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: tl
  text: 'Kaya ito ang sinasabi ni Yahweh, ang Diyos ng Israel: “Narito, magdadala ako ng kapahamakan[a] sa Jerusalem at Juda, anupat mangingilabot ang magkabilang tainga[b] ng bawat makarinig tungkol dito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sakuna.” Ang Hebreong רָעָה rito ay tumutukoy sa kapahamakang dulot ng paghatol, hindi sa moral na kasamaan.
    reason: lexical_alternative
  - marker: b
    text: Idyomang Hebreo ang “mangingilabot ang magkabilang tainga,” na nagpapahayag ng matinding pagkabigla o sindak dahil sa narinig na balita.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas at malinaw na ipinahahayag ang ugnayang bunga o konklusyon mula sa naunang pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: כֹּה אָמַר
  choice: ganito ang sinabi
  rationale: Makabagong Tagalog na nagpapanatili sa pormulang ginagamit sa paghahatid ng isang propetikong mensahe.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang construct na tumutukoy sa Diyos kaugnay ng Israel.
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili ang pantawag-pansin at mariing pagpapahayag ng nalalapit na kilos ng Diyos.
- source_word: מֵבִיא
  choice: magdadala ako
  rationale: Ipinahahayag nang natural sa Tagalog ang tiyak at nalalapit na pagkilos na inilalarawan ng participle kasama ng הִנְנִי.
- source_word: רָעָה
  choice: kapahamakan
  rationale: Sa konteksto ng paghatol, tumutukoy ito sa mapaminsalang sakuna o kaparusahan, hindi sa moral na kasamaan.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: sa Jerusalem at Juda
  rationale: Natural na Tagalog para sa kapahamakang pasasapitin sa dalawang lugar; hindi nito dinaragdagan ang teksto ng di-kailangang paliwanag.
- source_word: אֲשֶׁר
  choice: anupat
  rationale: Ipinakikita ang resultang dulot ng kapahamakan habang pinananatili ang ugnayang maaaring basahin bilang kinahinatnan.
- source_word: כָּל שֹׁמְעָיו
  choice: bawat makarinig tungkol dito
  rationale: Ang hulapi ay likas na tumutukoy sa kapahamakang ibabalita; malinaw sa Tagalog ang pakikinig tungkol sa isang pangyayari.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: mangingilabot ang magkabilang tainga
  rationale: Pinananatili ang matingkad na Hebreong idyoma at ang tahasang pagtukoy sa dalawang tainga, habang gumagamit ng maunawaang Tagalog na naghahatid ng matinding pagkabigla o sindak.
theological_decisions:
- issue: Kahulugan ng רָעָה sa paghatol ng Diyos
  choice: kapahamakan
  alternative: kasamaan
  rationale: Ang konteksto ay kapahamakang dala ng hatol, hindi moral na kasamaan. Iniiwasan ng saling ito ang maling pagpapahiwatig habang pinananatili ang bigat ng parusa.
- issue: Lakas ng idyomang תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: panatilihin bilang “mangingilabot ang magkabilang tainga”
  alternative: palitan ng “matinding masisindak”
  rationale: Ang pagpapanatili sa larawan ng dalawang tainga ay nagbibigay-dangal sa anyo ng Hebreo; nililinaw ng talababa ang kahulugan nito nang hindi pinapawi ang idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan, “Narito” upang mapanatili ang mariing propetikong pahayag, at “anupat” upang ihayag nang maikli ang bunga. Inilipat ang mga talababa sa mismong salitang o pariralang ipinapaliwanag ng mga ito.
