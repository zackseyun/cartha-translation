base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: tl
  text: Sinunod niya ang buong landas na tinahak ng kanyang ama. Naglingkod siya sa mga diyus-diyosan[a] na pinaglingkuran ng kanyang ama, at yumukod siya sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo rito ay isang mapanlait na katawagan sa mga diyus-diyosan; maaari rin itong isaling “mga kasuklam-suklam na diyus-diyosan.” May kaugnayan din ito, marahil, sa salitang tumutukoy sa dumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ
  choice: Namuhay siya sa lahat ng landas na tinahak
  rationale: Ang literal na paglakad sa isang landas ay talinghaga rito para sa asal o paraan ng pamumuhay. Pinananatili ng “landas na tinahak” ang larawang Hebreo, habang nililinaw ng “namuhay” ang idyomatikong diwa sa makabagong Tagalog.
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Tuwirang tumutukoy sa ama ni Amon; pinanatili sa dalawang paglitaw gaya ng pag-uulit sa Hebreo.
- source_word: וַיַּעֲבֹד
  choice: Naglingkod siya
  rationale: Ang עבד ay “maglingkod,” dito sa kontekstong panrelihiyon. Pinananatili nito ang pagkakaiba sa kasunod na pandiwang tumutukoy sa pagyukod.
- source_word: הַגִּלֻּלִים
  choice: mga diyus-diyosan
  rationale: Ito ang malinaw at karaniwang tawag sa mga idolo sa Tagalog. Ang mapanlait na puwersa ng salitang Hebreo ay ipinaliliwanag sa talababa.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: yumukod siya sa mga iyon
  rationale: Inilalarawan ng pandiwa ang pisikal na pagyukod o pagpapatirapa bilang pagpupugay. Ang “yumukod” ay natural at hindi isinasanib ang kahulugan nito sa naunang “naglingkod.”
theological_decisions:
- issue: Mapanlait na katawagan sa mga idolo sa גִּלֻּלִים
  choice: mga diyus-diyosan
  alternative: mga kasuklam-suklam na diyus-diyosan; mga diyus-diyosang parang dumi
  rationale: Malinaw na ipinahahayag ng “mga diyus-diyosan” ang tinutukoy nang hindi nagdaragdag ng interpretasyong higit sa teksto. Dahil tunay na mapanlait ang terminong Hebreo, pinanatili ang puwersang iyon sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang talinghaga ng landas ngunit ginawang natural ang idyoma sa pamamagitan ng “namuhay.”
