  - severity: low
    issue: Medyo hindi natural ang “Namuhay siya sa lahat ng landas.”
    rationale: Nauunawaan ang metapora, ngunit mas matatas ang “Sinunod niya ang buong landas,” na naghahatid pa rin ng idyoma ng pagtulad sa asal ng ama.
