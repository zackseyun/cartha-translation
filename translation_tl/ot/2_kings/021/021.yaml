revisions:
- from: Namuhay siya sa lahat ng landas na tinahak ng kanyang ama. Naglingkod siya sa mga diyus-diyosan[a] na pinaglingkuran ng kanyang ama, at yumukod siya sa mga iyon.
  to: Sinunod niya ang buong landas na tinahak ng kanyang ama. Naglingkod siya sa mga diyus-diyosan[a] na pinaglingkuran ng kanyang ama, at yumukod siya sa mga ito.
