  source_fidelity: 'Ang pangkalahatang kahulugan ay tapat sa Hebreo: ginaya ni Amon ang pamumuhay ng kanyang ama at naglingkod at yumukod siya sa mga diyus-diyosan. Gayunman, ang “sa lahat ng landas” ay nagpapalitan ang isahang הַדֶּרֶךְ (“ang landas/paraan”) tungo sa maraming landas. Ang “buong landas” ay mas malapit sa anyo at saklaw ng parirala, habang idiomatiko pa rin sa Tagalog.'
  naturalness: Marangal at malinaw ang karamihan ng talata. Mas natural at mas tiyak ang “Sinunod niya ang buong landas na tinahak ng kanyang ama” kaysa “Namuhay siya sa lahat ng landas na tinahak ng kanyang ama.” Ang “yumukod siya sa mga ito” ay bahagyang mas tuwiran at karaniwan kaysa “sa mga iyon,” bagaman kapwa nauunawaan.
  terminology: Ang “mga diyus-diyosan,” “naglingkod,” at “yumukod” ay angkop. Napananatili ng magkaibang pandiwang “naglingkod” at “yumukod” ang pagkakaiba ng עבד at השתחוה. Ang talababa ay wastong nagtatala ng mapanlait na puwersa ng גִּלֻּלִים; pinasimple lamang ang huling alternatibo upang huwag magmukhang tiyak na literal na etimolohiya ang pinagtatalunang kaugnayan sa “dumi.”
