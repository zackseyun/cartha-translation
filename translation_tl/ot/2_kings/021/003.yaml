base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: tl
  text: Muli niyang itinayo ang mga sambahan sa matataas na lugar na winasak ng kanyang amang si Ezequias. Nagtayo siya ng mga altar para kay Baal at gumawa ng isang Ashera[a], gaya ng ginawa ni Ahab na hari ng Israel. Yumukod siya sa buong hukbo ng langit at naglingkod sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ashera ay isang kultikong bagay na kaugnay ni Ashera; hindi tiyak ang eksaktong anyo nito.
    reason: Iniiwasang ipagpalagay na ang אֲשֵׁרָה ay tiyak na isang rebulto, samantalang pinananatili ang anyong ginamit sa Hebreo.
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: mga sambahang nasa matataas na lugar
  rationale: Ipinahahayag ang pisikal at panrelihiyong diwa ng bamot sa paraang malinaw sa modernong mambabasa, nang hindi ipinapalagay na pawang altar lamang ang tinutukoy.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: mga altar para kay Baal
  rationale: Pinananatili ang maramihang 'mga altar' at ang malinaw na pag-uukol ng mga iyon kay Baal.
- source_word: אֲשֵׁרָה
  choice: isang rebulto ni Ashera
  rationale: Ang Ashera rito ay isang ginawang bagay na kaugnay ng diyosang si Ashera; ang 'rebulto' ay natural at nauunawaan, habang hindi ito ginagawang pangkalahatang 'diyus-diyosan.'
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: buong hukbo ng langit
  rationale: Pinananatili ang tradisyonal at sadyang malawak na larawan ng mga bagay o nilalang sa kalangitan, sa halip na paliitin ito sa 'mga bituin' lamang.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: naglingkod sa mga ito
  rationale: Pinananatili ang literal na pandiwang panrelihiyon na 'maglingkod' at ang maramihang layon na tumutukoy sa hukbo ng langit.
theological_decisions:
- issue: Pagkakakilanlan ng 'hukbo ng langit'
  choice: buong hukbo ng langit
  alternative: lahat ng bituin sa langit / lahat ng bagay sa kalangitan
  rationale: Hindi tiyak sa parirala kung mga bagay sa kalangitan, mga makalangit na nilalang, o kapuwa ang saklaw; pinananatili ng salin ang tunay na lawak at tensiyon ng Hebreo.
- issue: Anyo ng Ashera
  choice: isang rebulto ni Ashera
  alternative: isang poste ni Ashera / isang Ashera
  rationale: Malinaw sa konteksto na may ginawang kultikong bagay, ngunit hindi ganap na tinutukoy ng mismong salita ang eksaktong anyo nito. Pinili ang madaling maunawaang pangkalahatang katawagan nang hindi nagdaragdag ng sektaryong paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at tuwiran. Ginamit ang 'sambahang nasa matataas na lugar' upang maiwasan ang malabong literal na 'matataas na lugar.' Ang pangalang Hezekiah ay isinalin bilang 'Ezequias,' isang pamilyar na anyong Filipino; nanatiling Baal, Ashera, at Ahab ang ibang pangalan.
