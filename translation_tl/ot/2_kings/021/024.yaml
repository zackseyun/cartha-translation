  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: tl
  text: Ngunit pinatay ng mga mamamayan ng lupain ang lahat ng nagsabwatan laban kay Haring Amon, at ginawa nilang hari ang anak niyang si Josias bilang kapalit niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: pinatay
  rationale: Sa kontekstong ito, ang נכה ay tumutukoy sa nakamamatay na pagganti laban sa mga nagsabwatan. Ang “pinatay” ay tuwiran at natural sa modernong Tagalog.
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Pinananatili nito ang natatanging Hebreong katawagan para sa isang pangkat ng populasyon na kumilos sa usaping pampolitika, nang hindi ito nililimitahan sa “karaniwang tao” o sa isang tiyak na uri ng lipunan.
- source_word: כָּל הַקֹּשְׁרִים
  choice: lahat ng nagsabwatan
  rationale: Ipinahahayag ng participle mula sa קשר ang mga taong kasangkot sa sabwatan; natural at malinaw ang pandiwang anyong “nagsabwatan.”
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: laban kay Haring Amon
  rationale: Kasama ng קשר, ang עַל ay nagpapahiwatig ng masamang balak na nakatuon laban sa hari.
- source_word: וַיַּמְלִיכוּ
  choice: ginawa nilang hari
  rationale: Tumpak nitong inilalarawan ang Hiphil ng מלך, ‘gawing hari,’ nang hindi nagdaragdag ng seremonya ng pagpuputong na hindi tahasang binanggit.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: ang anak niyang si Josias
  rationale: Natural na ayos sa Tagalog at malinaw na si Josias ang anak ni Amon. Ginamit ang nakaugaliang Tagalog na anyo ng pangalan.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Ipinahahayag nito ang paghalili ni Josias sa posisyon ni Amon bilang hari.
- source_word: וַ
  choice: Ngunit
  rationale: 'Bagaman karaniwang pang-ugnay ang waw, ang “Ngunit” ay angkop na nagpapakita ng kaibahan sa naunang talata: pinatay ng mga lingkod si Amon, subalit gumanti ang mga mamamayan.'
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal. Inulit sa diwa ang “mga mamamayan ng lupain” sa pamamagitan ng panghalip na “nila” upang maiwasan ang mabigat na pag-uulit habang nananatiling malinaw na iisang pangkat ang gumawa ng dalawang kilos. Walang kailangang talababa: ang posibleng nominal na saling “mga nagsabwatan” ay hindi nagdudulot ng makabuluhang pagkakaiba sa Tagalog.'
