  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh sa pamamagitan ng kanyang mga lingkod, ang mga propeta[a]. Ganito ang sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ng kanyang mga lingkod, ang mga propeta,” isang idyomang nangangahulugang “sa pamamagitan ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang piel na דּבר ay karaniwang nangangahulugang “magsalita.” Pinananatili ng “nagsalita” ang kilos sa salaysay at ang pagkakaiba nito sa kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Ang literal na “sa kamay ng” ay isang Hebreong idyoma na nagpapahayag ng ahensiya o kasangkapan. Mas natural at malinaw sa modernong Tagalog ang “sa pamamagitan ng,” habang pinananatili ang diwang ipinahatid ang salita sa pamamagitan ng mga propeta.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng mga propetang inatasan ng Diyos, ang “mga lingkod” ay natural na nagpapahayag ng paglilingkod at pagkasugo nang hindi labis na itinatampok ang kalagayang alipin.
- source_word: הַנְּבִיאִים
  choice: na propeta
  rationale: 'Tinutukoy ng pariralang ito kung sinu-sino ang mga lingkod: ang mga propeta. Natural sa Tagalog ang “mga lingkod na propeta.”'
- source_word: לֵאמֹר
  choice: 'Ganito ang sinabi niya:'
  rationale: Ipinakikilala ng infinitive na ito ang tuwirang pahayag na sumusunod. Ang buong pangungusap na “Ganito ang sinabi niya:” ay likas sa Tagalog at malinaw na naghahanda sa sipi sa susunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap upang maging natural ang pagpapakilala sa tuwirang pahayag, habang pinananatili ang parehong Diyos na tagapagsalita at ang mga propeta bilang mga tagapamagitan.
