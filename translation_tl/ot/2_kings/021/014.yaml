base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: tl
  text: At pababayaan ko ang nalabi sa aking mana[a] at ibibigay ko sila sa kamay ng kanilang mga kaaway; magiging samsam at dambong sila ng lahat ng kanilang mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nalabi sa aking pamana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: At iiwan ko
  rationale: Ang נטשׁ ay nangangahulugang iwan o pabayaan. Likas sa modernong Filipino ang “iiwan,” at malinaw pa rin dito ang hatol ng Diyos.
- source_word: שְׁאֵרִית
  choice: ang nalabi
  rationale: Tumutukoy ang שְׁאֵרִית sa natira matapos ang kapahamakan o paghatol. Mas natural sa karaniwang Filipino ang “nalabi” kaysa sa teknikal na “nalalabi.”
- source_word: נַחֲלָתִי
  choice: sa aking mana
  rationale: Pinananatili ng “mana” ang larawan ng נחלה bilang bahaging pag-aari o inilaan, pati ang pahiwatig ng tipanang pag-aari, nang hindi nililimitahan kung bayan o lupain lamang ang tinutukoy.
- source_word: וּנְתַתִּים בְּיַד
  choice: at ibibigay ko sila sa kamay
  rationale: Pinananatili ang konkretong Hebreong idyoma ng pagbibigay sa kamay ng iba, na nauunawaan bilang pagpapasailalim sa kanilang kapangyarihan.
- source_word: אֹיְבֵיהֶם
  choice: kanilang mga kaaway / lahat nilang kaaway
  rationale: Tuwirang salin ng אויבים; pinanatili ang dalawang paglitaw nito sa talata.
- source_word: וְהָיוּ
  choice: Sila'y magiging
  rationale: Ipinahahayag dito ang magiging bunga ng pagpapasailalim sa mga kaaway, kaya ang “magiging” ay angkop kaysa simpleng “ay.”
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: samsam at dambong
  rationale: Pinananatili ng magkatambal na malalapit na kahulugan ang retorikal na pag-uulit ng Hebreo at likas itong pakinggan sa Filipino.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: ng lahat nilang kaaway
  rationale: Sa Filipino, likas na ipinakikita ng “samsam at dambong ng” na ang mga kaaway ang kukuha at mananamantala sa kanila.
theological_decisions:
- issue: Tipanang pahiwatig ng נַחֲלָתִי (“aking mana”)
  choice: Pinanatili ang “aking mana” nang hindi tinutukoy nang mas makitid kung ito ay bayan, lupain, o pag-aari.
  alternative: aking pamana; aking pag-aari
  rationale: Ang Hebreo ay nagsasaad ng bahaging nauukol sa Diyos at may tipanang pahiwatig. Ang “mana” ang pinakamalapit na saling nagpapanatili ng larawang ito at ng likas na kalabuan ng saklaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong larawan na “sa kamay” at ang magkatambal na “samsam at dambong,” habang iniwasan ang labis na teknikal o makalumang pananalita.
