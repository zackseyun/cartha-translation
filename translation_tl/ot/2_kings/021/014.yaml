    rationale: Bagama’t posibleng katumbas ng “leave,” ang נטשׁ dito ay pagpapabaya o pagtatakwil sa konteksto ng hatol. Ang “pababayaan ko” ay mas malinaw na naghahatid ng puwersang ito sa modernong Filipino.
