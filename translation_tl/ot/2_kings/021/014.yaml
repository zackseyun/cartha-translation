  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa at lahat ng mahahalagang sangkap ng Hebreo: ang nalabi ng sariling mana ng Diyos, ang pagbibigay sa kapangyarihan ng mga kaaway, at ang pagiging samsam at dambong. Gayunman, ang “iiwan” ay maaaring tumukoy lamang sa karaniwang pag-alis at kulang ang bigat ng נטשׁ sa konteksto ng paghatol, na “pabayaan/forsake.”'
  naturalness: Likas at marangal ang “samsam at dambong.” Mas maayos ang isang tuloy-tuloy na pangungusap na may tuldok-kuwit kaysa hatiing pangungusap pagkatapos ng “mga kaaway.” Ang “lahat ng kanilang mga kaaway” ay bahagyang mas malinaw kaysa “lahat nilang kaaway.”
  terminology: Ang “aking mana” ay katanggap-tanggap para sa נחלתי at pinananatili ang metaporang tipanan nang hindi ipinagpapalagay kung ang tinutukoy ay bayan o lupain. Ang talababa tungkol sa “pamana” ay wastong alternatibo. Pinalitan ang “iiwan” ng “pababayaan” upang maihatid ang hatol na pagpapabaya/pagtalikod nang hindi nagdaragdag ng kahulugang doktrinal.
