source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: tl
  text: Inilagay niya sa templo ang inukit na imahen ni Ashera[a] na ginawa niya. Tungkol sa templong ito ay sinabi ni Yahweh kay David at kay Solomon na anak ni David, “Sa templong ito at sa Jerusalem, na pinili ko mula sa lahat ng mga lipi ng Israel, ilalagay ko ang aking pangalan magpakailanman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang imahen ni Ashera.” Pinagsasama sa Hebreo ang “inukit na imahen” at “Ashera,” kaya isang imahen o diyus-diyosan na kaugnay ni Ashera ang tinutukoy. Isinasalin ito ng ilan na “poste ni Ashera,” ngunit hindi iyon kasingtiyak dito sapagkat tahasang sinasabi ng teksto na isa itong inukit na imahen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Inilagay niya
  rationale: Tuwirang ipinahahayag ang nakaraang kilos ng paglalagay ng isang bagay sa isang lugar.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: ang inukit na imahen ni Ashera
  rationale: Pinananatili ng “inukit na imahen” ang konkretong diwa ng פֶּסֶל, habang ang “ni Ashera” ay naghahayag ng kaugnayan nito kay Ashera nang hindi ipinapalagay na isa lamang itong poste.
- source_word: בַּבַּיִת / בַּבַּיִת הַזֶּה
  choice: sa templo / sa templong ito
  rationale: Bagaman literal na “bahay,” malinaw na ang tinutukoy sa konteksto ay ang templo. Ang “templo” ay mas likas at madaling maunawaan sa modernong Filipino, at pinananatili ang pag-uulit ng salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וְאֶל שְׁלֹמֹה בְנוֹ
  choice: at sa anak nitong si Solomon
  rationale: Nililinaw ng “nito” na si Solomon ay anak ni David, ayon sa sanggunian ng hulaping Hebreo.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: na pinili ko mula sa lahat ng lipi ng Israel
  rationale: Natural na ipinapahayag sa Filipino ang pagpili sa Jerusalem mula sa kabuuan ng mga lipi ng Israel.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: ilalagay ko ang aking pangalan magpakailanman
  rationale: Pinananatili ang metaporikal at teolohikal na pananalita ng Hebreo tungkol sa paglalagay ng pangalan ng Diyos sa piniling lugar.
theological_decisions:
- issue: Paglalarawan sa bagay na kaugnay ni Ashera
  choice: ang inukit na imahen ni Ashera
  alternative: ang poste ni Ashera
  rationale: Hayagang ginagamit ng Hebreo ang פֶּסֶל, “inukit na imahen.” Kaya hindi dapat paliitin ang kahulugan tungo sa “poste” lamang, kahit maaari itong iugnay sa kulto ni Ashera.
- issue: Pagpapahayag ng banal na pangalan
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa pangalang יהוה sa pinagmulang teksto at hindi nito pinapalitan ang pangalan ng isang titulo.
- issue: Kahulugan ng paglalagay ng pangalan ng Diyos
  choice: ilalagay ko ang aking pangalan
  alternative: mananahan ako
  rationale: Pinananatili ang mismong metapora ng Hebreo at hindi ito tahimik na ipinapakahulugan bilang personal na pananahan ng Diyos.
translation_notes:
  register: Modernong Filipino na dignificado ngunit madaling maunawaan. Ginamit ang “templo” sa halip na literal na “bahay” upang maging malinaw ang tinutukoy, habang pinanatili ang pag-uulit at ang pormal na himig ng pahayag ng Diyos.
