  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: tl
  text: Nagtayo siya ng mga altar sa bahay ni Yahweh[a]. Tungkol sa bahay na ito ay sinabi ni Yahweh, “Sa Jerusalem ko ilalagay ang aking pangalan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa templo ni Yahweh.” Sa literal, “sa bahay ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang “ilalagay ko ang aking pangalan” ay pananalita ng tipan tungkol sa templo: tumutukoy ito sa lugar na pinili ni Yahweh upang iugnay sa kanyang pangalan at presensiya.'
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: Nagtayo siya
  rationale: Ang Qal wayyiqtol na 3ms ng בנה ay nagsasalaysay ng kasunod na pangyayari. Likas sa salaysay na Filipino ang “Nagtayo siya” nang hindi kailangang isalin nang tahasan ang panimulang pang-ugnay.
- source_word: מִזְבְּחֹת
  choice: mga altar
  rationale: Ito ang pangmaramihang anyo ng karaniwang salitang Hebreo para sa altar na pinaghahandugan; tuwiran at natural ang “mga altar.”
- source_word: בְּ/בֵית יְהוָה
  choice: sa bahay ni Yahweh
  rationale: Pinananatili ng “bahay ni Yahweh” ang literal na larawan ng בֵּית יְהוָה, habang malinaw pa rin sa konteksto na templo ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: na tungkol dito ay sinabi ni Yahweh
  rationale: Iniuugnay ng pariralang ito ang sinabi ni Yahweh sa naunang “bahay,” nang hindi ginagawang ang Jerusalem mismo ang tuwirang antecedent.
- source_word: בִּ/ירוּשָׁלַם
  choice: Sa Jerusalem
  rationale: Ang בְּ ay nagsasaad ng lokasyon, at pinananatili sa unahan ang “Sa Jerusalem” ayon sa diin at ayos ng Hebreo.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: ilalagay ko ang aking pangalan
  rationale: Pinananatili ang idyomang templo-tipanan tungkol sa paglalagay ng pangalan, sa halip na palawakin ito bilang isang interpretasyon tungkol sa presensiya.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na banal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Teolohiya ng templo sa “ilalagay ko ang aking pangalan”
  choice: Panatilihin ang idyomang “ilalagay ko ang aking pangalan”
  alternative: itatatag ko ang aking presensiya; pananahanan ko roon
  rationale: Mayaman sa teolohikal na kahulugan ang parirala, ngunit hindi iyon pinalalawak sa pangunahing teksto upang mapanatili ang mismong pahayag at tensiyon ng Hebreo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang literal na larawang “bahay ni Yahweh” at ang idyomang “ilalagay ko ang aking pangalan,” habang ipinaliwanag sa mga talababa ang natural na alternatibo at kontekstong pangkultura.
