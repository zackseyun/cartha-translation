base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: tl
  text: Ngunit hindi sila nakinig, at iniligaw sila ni Manases upang gumawa ng higit na kasamaan kaysa sa mga bansang nilipol ni Yahweh sa harap ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ni Israel” ay tumutukoy sa mga Israelita, ang sambayanan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: nakinig
  rationale: Saklaw ng pandiwa ang pakikinig na may nararapat na pagtugon. Pinananatili ng “nakinig” ang parehong pandinig at kusang pagtugon nang hindi agad nililimitahan sa “sumunod.”
- source_word: וַיַּתְעֵם
  choice: iniligaw sila
  rationale: Ang causative na anyo ng תעה ay nagsasaad na si Manases ang naging sanhi ng kanilang pagkaligaw sa moral at espirituwal na landas.
- source_word: לַעֲשׂוֹת אֶת הָרָע מִן הַגּוֹיִם
  choice: upang gumawa ng higit na masama kaysa sa mga bansa
  rationale: Ang מִן ay naghahayag ng paghahambing. Likas sa Tagalog ang “higit na masama kaysa” at malinaw nitong ipinapakita na lumampas ang kanilang kasamaan sa kasamaan ng mga bansang tinutukoy.
- source_word: הִשְׁמִיד
  choice: nilipol
  rationale: Ipinahihiwatig ng pandiwa ang matinding pagwasak o pag-ubos; ang “nilipol” ay marangal at sapat ang lakas para sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos, hindi pinapalitan ng isang titulo.
- source_word: מִפְּנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang larawang Hebreo ng pag-aalis sa mga bansa mula sa harapan o presensiya ng Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal na anyong Hebreo at pinananatili ang tipanang katawagan, habang nananatiling malinaw sa modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili ng pangunahing teksto ang pormal na katawagang Hebreo. Nililinaw sa talababa na tumutukoy ito sa mga Israelita bilang isang bayan.
- issue: Puwesto ng paghahambing sa kasamaan
  choice: gumawa ng higit na masama kaysa sa mga bansa
  alternative: gumawa ng masama nang higit kaysa sa mga bansa
  rationale: Kapuwa posible sa balarila, ngunit ang piniling ayos ang pinakanatural sa Tagalog at hindi binabago ang paghahambing na nasa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Manases,” ang karaniwang anyong Tagalog ng pangalan. Iniwasan ang sobrang literal na ayos na magiging alanganin, ngunit pinanatili ang paghahambing, aktibong pananagutan ni Manases, banal na pangalan, at larawang “sa harap ng.”
