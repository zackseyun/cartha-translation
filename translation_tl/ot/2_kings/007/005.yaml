base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: tl
  text: Kaya bumangon sila nang dapit-hapon upang pumunta sa kampo ng Aram. Nang makarating sila sa gilid ng kampo ng Aram, narito, walang tao roon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: Kaya bumangon sila
  rationale: Ang wayyiqtol ng קום ay nagpapatuloy sa salaysay; ipinahihiwatig ng “Kaya” ang bunga ng pasya sa naunang konteksto, at natural sa Filipino ang “bumangon sila.”
- source_word: בַנֶּשֶׁף
  choice: nang dapit-hapon
  rationale: Ang נֶשֶׁף ay tumutukoy sa takipsilim o dapit-hapon sa kontekstong ito. Ang “dapit-hapon” ay malinaw, natural, at angkop sa oras ng kanilang pagpunta.
- source_word: לָבוֹא
  choice: upang pumunta
  rationale: Ang infinitive ng בוא ay nagpapahayag ng layunin. Ang “pumunta” ang likas na Filipino para sa pagkilos patungo sa kampo mula sa pananaw ng salaysay.
- source_word: מַחֲנֵה אֲרָם
  choice: kampo ng Aram
  rationale: Tuwirang pinananatili ng parirala ang pangalang Aram at ang ugnayang construct ng Hebreo.
- source_word: וַיָּבֹאוּ עַד קְצֵה
  choice: Nang makarating sila sa gilid
  rationale: Ipinahahayag ng “makarating” ang pagdating sa hangganan, samantalang ang “gilid” ay malinaw na katumbas ng קְצֵה nang hindi dinaragdagan ang detalye.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ng “narito” ang pantawag-pansing lakas ng הִנֵּה at ang biglaang pagkatuklas sa eksena.
- source_word: אֵין שָׁם אִישׁ
  choice: wala ni isang tao roon
  rationale: Bagaman literal na panlalaking isahan ang אִישׁ, sa negatibong pariralang ito ay idiomatikong nangangahulugan itong walang sinumang tao. Ang “wala ni isang tao” ay natural at pinananatili ang diin ng isahan.
theological_decisions:
- issue: Ang panlalaking isahang אִישׁ sa kontekstong nagsasaad na walang sinumang naroon
  choice: wala ni isang tao roon
  alternative: walang lalaki roon
  rationale: Sa pariralang אֵין שָׁם אִישׁ, ginagamit ang אִישׁ sa pangkalahatang diwa ng isang tao. Ang “walang lalaki” ay maaaring maling magpahiwatig na may mga babae o iba pang tao roon; pinananatili ng napiling salin ang tunay na saklaw ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang “Aram” at ang pantawag-pansing “narito,” habang ginawang likas sa salaysay ang pagkakasunod-sunod ng mga kilos.
