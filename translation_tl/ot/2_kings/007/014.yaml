  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: tl
  text: Kaya kumuha sila ng dalawang karwaheng may mga kabayo[a], at isinugo ng hari ang mga ito upang sundan ang kampo ng Aram. Sinabi niya, “Pumunta kayo at tingnan ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “dalawang karwahe ng mga kabayo,” isang siksik na pananalitang malamang na tumutukoy sa dalawang karwaheng hinihila ng mga kabayo o sa dalawang pangkat ng karwahe at mga kabayo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kaya kumuha sila
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural sa modernong Tagalog ang “Kaya” at ipinapakita rin nito ang kaugnayan sa naunang pasiya.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: dalawang karwaheng may mga kabayo
  rationale: Siksik at eliptikal ang pariralang Hebreo. Nililinaw ng salin ang larawan ng dalawang karwaheng hinihila ng mga kabayo nang hindi tiyakang ipinapalagay kung dalawang sasakyan o dalawang buong pangkat ang tinutukoy.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: isinugo ng hari ang mga ito
  rationale: Ang “isinugo” ay angkop sa awtoritatibong pagpapadala ng hari; ang layong “ang mga ito” ay hinango sa agarang konteksto upang maging malinaw sa Tagalog.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: upang sundan ang kampo ng Aram
  rationale: Ipinahahayag ng אַחֲרֵי ang pagpunta kasunod o sa likuran ng kampo. Ang “sundan” ay natural sa konteksto ng pagmamanman at hindi nagdaragdag ng diwa ng pakikipaglaban.
- source_word: אֲרָם
  choice: Aram
  rationale: Pinananatili ang sinaunang pangalang pantangi at iniiwasan ang anakronistikong “Syria” o ang paglilipat sa katawagang-pangkat na “mga Arameo.”
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Natural na ipinakikilala sa Tagalog ang tuwirang pananalita habang pinananatili ang hari bilang tagapagsalita mula sa konteksto.
- source_word: לְכוּ וּרְאוּ
  choice: Humayo kayo at tingnan ninyo
  rationale: Pinananatili ang dalawang tuwirang pautos. Dignified ngunit malinaw ang “Humayo,” at ang “tingnan” ay angkop sa layunin nilang magsiyasat.
