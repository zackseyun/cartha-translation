  source_fidelity: 'Tumpak ang salin sa pangunahing mga yunit ng Hebreo: eksistensiyal na pagpapakilala ng apat na lalaki, ang di-tiyak na kondisyong pangbalat ng מְצֹרָעִים, lokasyong nasa pasukan ng pintuang-bayan, ang katumbasang idyoma ng pag-uusap sa isa’t isa, at ang retorikal na tanong na nagtatapos sa kamatayan.'
