base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: tl
  text: May apat na lalaking may sakit sa balat[a] sa pasukan ng pintuang-bayan. Sinabi nila sa isa't isa, “Bakit tayo nakaupo rito hanggang sa mamatay tayo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa tradisyon, “mga ketongin.” Ang Hebreo ay tumutukoy sa isang kondisyong kaugnay ng צָרַעַת, na hindi kinakailangang katumbas ng makabagong ketong (Hansen’s disease).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: May apat na lalaki
  rationale: Likas na ipinakikilala sa Tagalog ang mga bagong tauhan sa pamamagitan ng eksistensiyal na “may.” Ang וְ ay nag-uugnay at naglilipat ng tagpo, ngunit hindi kailangang tumbasan ng tahasang temporal na salita.
- source_word: מְצֹרָעִים
  choice: may sakit sa balat
  rationale: Ang terminong Hebreo ay tumutukoy sa mga taong may kondisyong kaugnay ng צָרַעַת; hindi ito tiyak na katumbas ng makabagong ketong o Hansen’s disease. Pinananatili ng salin ang pangkalahatang katangian ng kondisyon, at inilalagay sa talababa ang tradisyonal na katawagan.
- source_word: פֶּתַח הַשָּׁעַר
  choice: sa pasukan ng pintuang-bayan
  rationale: Ang parirala ay literal na “pasukan/bukana ng tarangkahan.” Sa konteksto ng isang napapaderang lungsod, malinaw at likas ang “pintuang-bayan.”
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: Sinabi nila sa isa't isa
  rationale: Ang distributibong idyomang singular ay nagpapahayag ng pagpapalitan ng salita sa loob ng pangkat; natural itong tumbasan ng “sa isa't isa.”
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: Bakit tayo nakaupo rito
  rationale: Sa retorikal na tanong, ang מָה ay may diwang “bakit.” Pinananatili ng “nakaupo” ang aktuwal na postura at ang pahiwatig ng hindi pagkilos.
- source_word: עַד מָתְנוּ
  choice: hanggang sa mamatay tayo
  rationale: Ipinahahayag nito ang kamatayan bilang hantungan ng patuloy nilang pananatili roon; natural at tuwiran ang saling ito sa Tagalog.
