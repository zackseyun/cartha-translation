base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: tl
  text: 'Pagkatapos ay sinabi ni Eliseo, “Pakinggan ninyo ang salita ni Yahweh. Ganito ang sinasabi ni Yahweh: Bukas, sa halos ganito ring oras, mabibili sa isang siklo ang isang seah[a] ng pinong harina, at sa isang siklo ang dalawang seah ng sebada, sa tarangkahan ng Samaria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang seah ay isang sinaunang panukat para sa tuyong sangkap.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos ay sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: שִׁמְעוּ
  choice: Pakinggan ninyo
  rationale: Pautos na maramihan ito. Malinaw na ipinahihiwatig ng “ninyo” na higit sa isang tao ang kinakausap at pinananatili ang pormal na panawagang propetiko.
- source_word: דְּבַר יְהוָה
  choice: ang salita ni Yahweh
  rationale: Pinananatili ng “salita” ang nakaugaliang pormulang propetiko at hindi ito pinapalitan ng mas mapagpaliwanag na “mensahe.”
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Natural at marangal itong katumbas ng pormal na pormula ng mensaherong propetiko.
- source_word: כָּעֵת מָחָר
  choice: Bukas, sa halos ganito ring oras
  rationale: Ipinahahayag nito ang humigit-kumulang na kaparehong oras sa susunod na araw at pinananatili ang bahagyang di-tiyak na puwersa ng כ.
- source_word: סְאָה / סָאתַיִם
  choice: isang sea / dalawang sea
  rationale: Tiyak na sinaunang panukat ng tuyong sangkap ang tinutukoy. Pinananatili ng transliterasyon ang kongkretong detalyeng pangkalakalan sa halip na gawing pangkalahatang “takal.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy ang salita sa harinang pino, hindi lamang sa harina sa pangkalahatan.
- source_word: בְּשֶׁקֶל
  choice: sa isang siklo
  rationale: Sa kontekstong pangkalakalan, ipinakikita ng parirala ang presyo. Ang “siklo” ay kinikilalang anyo sa Tagalog para sa sinaunang yunit ng salapi o timbang.
- source_word: שְׂעֹרִים
  choice: sebada
  rationale: Karaniwang makabagong katawagan sa Tagalog para sa barley at angkop sa konteksto ng butil.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: sa pintuang-bayan ng Samaria
  rationale: Hindi lamang karaniwang pinto ang tinutukoy kundi ang tarangkahan ng lungsod, na sentro rin ng kalakalan at gawaing pambayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormal na himig ng pahayag na propetiko, samantalang ginawang likas sa Tagalog ang paglalahad ng presyo at panahon.
