base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: tl
  text: Kaya pumunta sila at tumawag sa mga bantay sa pintuan ng lungsod. Iniulat nila sa mga ito, “Pumunta kami sa kampo ng Aram[a], at wala roon ni isang tao ni anumang tunog ng tao[b]—mga kabayo lamang na nakatali, mga asnong nakatali, at mga toldang ganoon pa rin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kampo ng mga Arameo”; ayon sa tradisyon, “kampo ng mga taga-Syria.”
    reason: alternative_reading
  - marker: b
    text: O “tinig ng tao.” Ang salitang Hebreo ay maaaring tumukoy sa tinig o, sa mas malawak na diwa, sa anumang tunog na likha ng tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: mga bantay sa pintuan ng lungsod
  rationale: Bagaman anyong isahan ang שֹׁעֵר, ipinahihiwatig ng kasunod na mga panghalip at pandiwang maramihan na kolektibo ang tinutukoy. Likas at malinaw sa modernong Tagalog ang “mga bantay sa pintuan.”
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: Iniulat nila sa mga ito
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat. Ang “iniulat” ay angkop sa paghahatid nila ng natuklasan at hindi kailangang ulitin sa Tagalog ang pormulang “na sinasabi.”
- source_word: מַחֲנֵה אֲרָם
  choice: kampo ng Aram
  rationale: Pinananatili ang Hebreong pangalang Aram sa halip na palitan ito ng tradisyonal na “Syria,” habang inilalagay sa talababa ang alternatibong katawagan.
- source_word: וְהִנֵּה
  choice: naroon nga—
  rationale: Ipinahahayag ng הִנֵּה ang biglaan at matingkad na paglalahad ng kanilang nakita. Ang “naroon nga—” ay likas sa Tagalog at naghahanda sa nakakagulat na kawalan ng mga tao sa kampo.
- source_word: אֵין שָׁם אִישׁ
  choice: walang kahit isang tao
  rationale: Pangkalahatan ang gamit ng אִישׁ dito, kaya “tao” at hindi “lalaki” ang tamang salin. Binibigyang-diin ng “kahit isang” ang ganap na kawalan.
- source_word: וְקוֹל אָדָם
  choice: walang marinig na tunog ng tao
  rationale: Maaaring tumukoy ang קוֹל sa tinig o sa mas malawak na tunog. Pinananatili ng “tunog ng tao” ang mas malawak na kahulugan, samantalang nililinaw ng “walang marinig” ang natural na diwa sa Tagalog.
- source_word: כִּי אִם
  choice: lamang
  rationale: Ipinakikilala ng idyoma ang natatanging mga bagay na naroon sa kabila ng kawalan ng tao; maikli at likas ang “lamang.”
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: mga kabayong nakatali ... mga asnong nakatali
  rationale: Ang אָסוּר ay “nakatali” o “nakagapos.” Sa konteksto ng mga hayop sa kampo, pinakamalinaw ang “nakatali.” Kolektibo ang mga pangngalang isahan kaya natural na maramihan ang salin.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: ang mga toldang gaya pa rin ng dati
  rationale: Pinananatili nito ang diwang naiwan ang mga tolda sa dati nilang kalagayan nang hindi dinaragdagan ang teksto ng tiyak na paliwanag gaya ng “hindi nagalaw.”
- source_word: אָדָם
  choice: tao
  rationale: Pangkalahatan ang kahulugan ng אָדָם dito. Ang “tao” ay tumpak, likas, at hindi nililimitahan sa kasariang lalaki.
