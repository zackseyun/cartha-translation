revisions:
- from: Kaya pumunta sila at tumawag sa mga bantay sa pintuan ng lungsod. Iniulat nila sa mga ito, “Pumunta kami sa kampo ng Aram[a], at naroon nga—walang kahit isang tao at walang marinig na tunog ng tao[b]. Naroon lamang ang mga kabayong nakatali, ang mga asnong nakatali, at ang mga toldang gaya pa rin ng dati.”
  to: Kaya pumunta sila at tumawag sa mga bantay sa pintuan ng lungsod. Iniulat nila sa mga ito, “Pumunta kami sa kampo ng Aram[a], at wala roon ni isang tao ni anumang tunog ng tao[b]—mga kabayo lamang na nakatali, mga asnong nakatali, at mga toldang ganoon pa rin.”
  rationale: Inayos ang paglalatag ng iniulat na natuklasan upang maging mas malinaw at natural sa Tagalog, habang pinananatili ang saklaw ng Hebreong "walang tao at walang tunog ng tao." Pinalitan ang "gaya pa rin ng dati" ng "ganoon pa rin" upang maipahayag na naiwan ang mga tolda sa kalagayang iyon nang hindi nagpapahiwatig ng isang tiyak na nakaraang panahon. Napanatili ang mga angkla at nilalaman ng talababa.
