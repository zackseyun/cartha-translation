  verdict: revise
  source_fidelity: Tumpak na naipapasa ng draft ang panukalang cohortative sa wakas at ang sadyang paulit-ulit at mahirap na paghahambing. Gayunman, ang “Tingnan ninyo” ay isang tahasang pautos sa mga tagapakinig, samantalang ang הִנָּם ay panawag-pansing pangkayariang “narito/masdan,” hindi imperatibo. Ang “sa loob nito” ay masyadong pisikal na pagpapakahulugan sa panghalip na malamang na tumutukoy sa lungsod; mas maingat ang “doon.”
  naturalness: Ang “Kumuha po sana sila” ay hindi gaanong likas bilang mungkahing pahintulot at ang “po” ay nagdadagdag ng partikular na panlipunang paggalang na wala sa Hebreo. Ang “Hayaan sana silang kumuha” ay mas malinaw at likas. Ang “buong karamihan ng Israel” ay maaari, ngunit mas natural sa Tagalog ang “buong karamihan ng mga Israelita.”
  terminology: Nananatiling angkop ang “mga lingkod,” “kabayo,” at “nalipol.” Pinananatili ang “Israel” bilang pangalan ng bayan, habang ang “mga Israelita” ay likas na pagtukoy sa mga taong bumubuo ng karamihang iyon.
