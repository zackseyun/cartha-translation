base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: tl
  text: Sumagot ang isa sa kanyang mga lingkod at sinabi, “Hayaan sana silang kumuha ng lima sa mga kabayong natitira, na naiwan doon.[a] Narito, ang mga ito ay gaya ng buong karamihan ng mga Israelita na naiwan doon; narito, ang mga ito ay gaya ng buong karamihan ng mga Israelita na nalipol.[b] Kaya magpadala tayo at tingnan natin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “doon” ay malamang na tumutukoy sa lungsod ng Samaria, ngunit panghalip lamang ang ginamit sa Hebreo at hindi muling binanggit ang pangalan ng lungsod sa talatang ito.
    reason: lexical_alternative
  - marker: b
    text: 'Mahirap at paulit-ulit ang paghahambing sa Hebreo: “gaya ng buong karamihan ng mga Israelita na naiwan doon … gaya ng buong karamihan ng mga Israelita na nalipol.” Pinanatili rito ang pag-uulit sa halip na dagdagan ng paliwanag o pakinisin ang diwa.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: Sumagot ang isa sa kanyang mga lingkod at sinabi
  rationale: Pinananatili ang dalawang pandiwang Hebreo na nagpapakilala sa pagsasalita. Ang “lingkod” ay sapat na malawak para sa isang taong naglilingkod sa hari nang hindi ipinapalagay ang tiyak niyang katayuan.
- source_word: וְיִקְחוּ נָא
  choice: Kumuha po sana sila
  rationale: Ipinahahayag ng anyong pakiusap at ng נָא ang magalang na mungkahi; likas sa modernong Tagalog ang kombinasyong “po sana.”
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: lima sa mga kabayo
  rationale: Natural na ipinapahayag sa Tagalog ng “lima sa” ang partitive na מִן.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: na natitira, na naiwan sa loob nito
  rationale: Pinananatili ang pag-uulit ng ugat na שׁאר sa pamamagitan ng “natitira” at “naiwan,” gayundin ang panghalip na pambabaeng isahan sa halip na tahasang idagdag ang Samaria.
- source_word: הִנָּם
  choice: Tingnan ninyo, ang mga ito ay
  rationale: Ang “tingnan ninyo” ay kasalukuyan, marangal, at malinaw na panawag-pansin; pinananatili rin ang pag-uulit nito.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: gaya ng buong karamihan ng Israel
  rationale: Ipinapakita ng “karamihan” ang kolektibong masa ng bayan, at ng “buo” ang saklaw ng כָּל.
- source_word: אֲשֶׁר תָּמּוּ
  choice: na nalipol
  rationale: Sa konteksto ng taggutom at kamatayan, ipinahahayag ng “nalipol” ang pagkaubos o pagkamatay nang hindi tinutukoy ang isang paraang wala sa Hebreo.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Kaya magsugo tayo at tingnan natin
  rationale: Ang dalawang cohortative ay mungkahing sama-samang kumilos; malinaw sa Tagalog ang “tayo” at “natin.”
theological_decisions:
- issue: Ang mahirap at paulit-ulit na paghahambing ng mga kabayo sa mga Israelitang natira at nalipol
  choice: Pinanatili ang dalawang magkatulad na sugnay at ang dalawang panawag na “Tingnan ninyo.”
  alternative: Pakinisin bilang paliwanag na pareho lamang ang sasapitin ng mga kabayo, manatili man sila o ipadala.
  rationale: Hindi tahasang binibigkas ng Hebreo ang lohikal na paliwanag. Ang pagpapanatili sa mahirap na paghahambing ay umiiwas sa pagdaragdag ng isang interpretasyong higit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “po sana” para sa magalang na pakiusap at “tingnan ninyo” bilang natural na panawag-pansin. Sadyang pinanatili ang pag-uulit at bahagyang hirap ng paghahambing sa Hebreo.
