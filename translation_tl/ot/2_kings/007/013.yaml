  to: Sumagot ang isa sa kanyang mga lingkod at sinabi, “Hayaan sana silang kumuha ng lima sa mga kabayong natitira, na naiwan doon.[a] Narito, ang mga ito ay gaya ng buong karamihan ng mga Israelita na naiwan doon; narito, ang mga ito ay gaya ng buong karamihan ng mga Israelita na nalipol.[b] Kaya magpadala tayo at tingnan natin.”
