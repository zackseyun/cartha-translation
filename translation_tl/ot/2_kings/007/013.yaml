    rationale: Ang Hebreo ay magalang na jussive na mungkahi. Mas tuwirang naipapahayag ito ng “Hayaan sana silang kumuha,” nang hindi naglalagay ng Tagalog na honorific na walang katumbas sa pinagmulan.
