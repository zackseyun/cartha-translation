id: 2KI.7.16
reference: 2 Kings 7:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: tl
  text: Pagkatapos ay lumabas ang mga tao at sinamsam nila ang kampo ng Aram. Isang sea[a] ng pinong harina ay naipagbili sa isang shekel[b], at dalawang sea ng sebada ay naipagbili rin sa isang shekel, ayon sa salita ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang sea ay isang sinaunang takal para sa tuyong produkto.
    reason: cultural_note
  - marker: b
    text: Ang shekel ay isang sinaunang yunit ng timbang na ginagamit din sa pagtukoy ng halaga ng salapi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Pagkatapos, lumabas ang mga tao
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay. Natural sa modernong Tagalog ang “Pagkatapos,” habang tuwirang isinasalin ng “ang mga tao” ang הָעָם.
- source_word: וַיָּבֹזּוּ
  choice: sinamsam nila
  rationale: Ang pandiwang בזז ay tumutukoy sa pagkuha ng samsam mula sa kaaway. Malinaw at angkop sa kontekstong militar ang “sinamsam.”
- source_word: מַחֲנֵה אֲרָם
  choice: ang kampo ng Aram
  rationale: Pinananatili nito ang anyong konstruktong “kampo ng Aram” at ang pangalang Aram, sa halip na palitan ito ng makabagong heograpikong katawagang Syria.
- source_word: וַיְהִי
  choice: ay naipagbili
  rationale: Sa pormulang nagsasaad ng presyo, ipinakikita ng וַיְהִי na umabot sa gayong halaga ang bilihin. Ipinahahayag ito nang natural sa Tagalog sa pamamagitan ng “naipagbili.”
- source_word: סְאָה / סָאתַיִם
  choice: isang sea / dalawang sea
  rationale: Ang sea ay tiyak na sinaunang takal para sa tuyong produkto, at malinaw na dalawahan ang סָאתַיִם. Pinananatili ang katawagang pangkultura at ipinaliliwanag sa talababa.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ang סֹלֶת ay harina na pino o mataas ang uri, hindi lamang pangkalahatang harina.
- source_word: בְּשֶׁקֶל
  choice: sa isang shekel
  rationale: Ang “sa isang shekel” ay natural na pahayag ng presyo sa Tagalog at pinananatili ang sinaunang katawagan sa yunit ng timbang na ginamit bilang salapi.
- source_word: שְׂעֹרִים
  choice: sebada
  rationale: Sa konteksto ng bilihin, ang plural na Hebreo ay tumutukoy sa sebada bilang kalakal; “sebada” ang karaniwang modernong katawagan sa Tagalog.
- source_word: כִּדְבַר יְהוָה
  choice: ayon sa salita ni Yahweh
  rationale: Malapit ito sa anyo ng Hebreo at ipinakikita ang katuparan ng naunang ipinahayag na salita.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “sinamsam” para sa tiyak na diwang militar, at pinanatili ang mga katawagang sea, shekel, Aram, at Yahweh dahil wala silang ganap na katumbas na hindi magpapawala ng impormasyong pangkasaysayan o pangteolohiya.
