revisions:
- from: Sumagot sa lingkod ng Diyos ang opisyal na siyang sinasandalan ng hari, “Tingnan mo, kahit gumawa pa si Yahweh ng mga bintana sa langit, mangyayari ba ang bagay na ito?” Sumagot siya, “Makikita mo ito ng sarili mong mga mata, ngunit hindi ka makakain mula rito.”
  to: Sumagot sa tao ng Diyos ang opisyal na siyang sinasandalan ng hari at sinabi, “Tingnan mo, kahit gumawa pa si Yahweh ng mga bintana sa kalangitan,[a] mangyayari ba ang bagay na ito?” Sinabi naman ng tao ng Diyos, “Makikita mo ito ng sarili mong mga mata, ngunit hindi ka kakain mula rito.”
  rationale: Itinutuwid ng rebisyon ang pangunahing terminolohikong paglihis sa titulo na אִישׁ הָאֱלֹהִים, nililinaw ang tagapagsalita sa ikalawang tugon, at pinapakinis ang huling sugnay para sa likas at tapat na Filipino. Idinagdag ang talababa sa metaporang “mga bintana sa kalangitan” upang maipakita ang posibleng leksikal na pag-unawa nang hindi ginagawang interpretasyon ang pangunahing teksto.
