base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: tl
  text: Sumagot sa tao ng Diyos ang opisyal na siyang sinasandalan ng hari at sinabi, “Tingnan mo, kahit gumawa pa si Yahweh ng mga bintana sa kalangitan,[a] mangyayari ba ang bagay na ito?” Sinabi naman ng tao ng Diyos, “Makikita mo ito ng sarili mong mga mata, ngunit hindi ka kakain mula rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kahit magbukas si Yahweh ng mga lagusan ng tubig sa kalangitan.” Literal na “gumawa ng mga bintana sa kalangitan,” isang larawan ng pambihirang paglalaan mula sa itaas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ang opisyal
  rationale: Tumutukoy ang salita sa isang mataas na opisyal ng militar o palasyo; malinaw ang “opisyal” nang hindi nagpapalagay ng tiyak na ranggo.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: na siyang sinasandalan ng hari
  rationale: Pinananatili ang malinaw na larawan ng isang pinagkakatiwalaang opisyal na pisikal na sinasandalan ng hari, habang natural ang ayos sa Tagalog.
- source_word: אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay posibleng gamitin, ngunit ang “lingkod ng Diyos” ay mas likas na titulong tumutukoy sa propeta sa modernong Tagalog nang hindi basta pinapalitan ng “propeta.”
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Nagbibigay-pansin at nagpapahayag ng mapanghamong tono; natural ito sa kasalukuyang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: gumawa pa si Yahweh ng mga bintana sa langit
  rationale: Pinananatili ang literal at matinding larawang “mga bintana sa langit”; ang “pa” ay nagpapahiwatig ng mapagdudang kondisyong retorikal.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: mangyayari ba ang bagay na ito?
  rationale: Direktang pinananatili ang tanong at ang pag-aalinlangan ng opisyal.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: Makikita mo ito ng sarili mong mga mata
  rationale: Natural na idyomang Tagalog na nagpapanatili sa diin ng Hebreo.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: ngunit hindi ka makakain mula rito
  rationale: Pinananatili ang bahagyang di-tiyak na reperensiya ng מִשָּׁם sa ipinangakong pagkain o panustos, sa halip na gawing mas tiyak kaysa sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tuwirang nakasulat sa Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagkakakilanlan ng אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Parehong posibleng kumatawan sa tradisyonal na titulo ng propeta. Pinili ang mas natural na “lingkod ng Diyos,” nang hindi ipinapasok ang pangalang Eliseo o karagdagang interpretasyon sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mapanuyang pag-aalinlangan ng opisyal at ang matalim na tugon ng lingkod ng Diyos. Hindi gumamit ng talababa sapagkat walang kailangang alternatibong pagbasa upang maunawaan ang talata.
