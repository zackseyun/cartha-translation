  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: tl
  text: Sinundan nila ang mga iyon hanggang sa Jordan. At nakita nilang ang buong daan ay puno ng mga damit at kagamitan[a] na itinapon ng mga taga-Aram sa kanilang pagmamadali. Pagkatapos, bumalik ang mga mensahero[b] at nag-ulat sa hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay malawak ang kahulugan at maaari ding tumukoy sa mga gamit, kasangkapan, sisidlan, o iba pang dalang bagay.
    reason: lexical_alternative
  - marker: b
    text: O “mga tagamanman.” Literal na “mga mensahero” ang Hebreo, ngunit sa konteksto sila ang mga lalaking isinugo upang magsiyasat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: Kaya sinundan nila ang mga iyon
  rationale: Ipinahahayag nito ang sunod na kilos at ang diwa ng pagsunod o pagtugis, nang hindi idinaragdag na tiyak na naabutan nila ang tumatakas.
- source_word: עַד הַיַּרְדֵּן
  choice: hanggang sa Jordan
  rationale: Ang עַד ay nagsasaad ng hangganang narating; natural at tuwiran sa Filipino ang 'hanggang sa Jordan.'
- source_word: וְהִנֵּה
  choice: At nakita nilang
  rationale: Sa salaysay, ang הִנֵּה ay tumatawag ng pansin sa biglang natuklasan. Ang 'nakita nilang' ay natural sa modernong Filipino at pinananatili ang perspektiba ng mga humahabol.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: nagkalat sa buong daan
  rationale: Bagaman literal na 'puno ang buong daan,' mas likas ang 'nagkalat sa buong daan' para sa mga itinapong bagay, habang pinananatili ang lawak ng tanawin.
- source_word: בְגָדִים וְכֵלִים
  choice: mga damit at kagamitan
  rationale: Ang בְגָדִים ay mga kasuotan, at ang כֵלִים ay malawak na katawagan sa mga bagay, gamit, o kagamitan. Ang 'kagamitan' ay angkop sa konteksto ng hukbong tumatakas nang hindi nililimitahan ang uri ng mga bagay.
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: na itinapon ng mga taga-Aram
  rationale: Ang אֲרָם ay pangalang kolektibo para sa bayan o mga tao ng Aram. Sa Filipino, nililinaw ng 'mga taga-Aram' ang maramihang gumagawa ng kilos habang pinananatili ang pangalang Aram.
- source_word: בְּחָפְזָם
  choice: sa kanilang pagmamadali
  rationale: Tuwirang inilalarawan nito ang nagmamadaling pagkilos sa ilalim ng pressure; hindi nito labis na binibigyang-kahulugan bilang 'pagkasindak.'
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: bumalik ang mga mensahero
  rationale: Ang מַלְאָכִים ay literal na 'mga mensahero.' Bagaman mga lalaking isinugo upang magsiyasat ang tinutukoy, iniiwasan ng salin ang mas interpretibong 'mga espiya' o 'mga tagamanman.'
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: nag-ulat sa hari
  rationale: Ang pandiwa ay nangangahulugang magsabi o magbigay-alam. Ang 'nag-ulat' ay likas sa konteksto ng mga isinugong bumalik sa hari.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural sa salaysay. Ginamit ang 'mga taga-Aram' upang maipahayag ang kolektibong sanggunian ng Hebreo, at iniwasan ang mas lumang pangalang 'Siria.' Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
