    issue: Medyo di-likas ang ilang pananalita sa mga talababa.
    rationale: Ang “panukat para sa tuyong produkto” ay hindi gaanong idiomatiko para sa dry measure, at ang “pampublikong lugar ng kalakalan at paghatol” ay mas malinaw bilang pook ng kalakalan at paglilitis.
