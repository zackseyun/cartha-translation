  to: 'At nangyari nga ito ayon sa sinabi ng tao ng Diyos sa hari: “Bukas, sa ganito ring oras, dalawang sea[a] ng sebada ang mabibili sa isang siklo, at isang sea ng pinong harina sa isang siklo, sa pintuang-bayan[b] ng Samaria.”'
