  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: tl
  text: 'At nangyari nga ito ayon sa sinabi ng tao ng Diyos sa hari: “Bukas, sa ganito ring oras, dalawang sea[a] ng sebada ang mabibili sa isang siklo, at isang sea ng pinong harina sa isang siklo, sa pintuang-bayan[b] ng Samaria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang sea ay isang sinaunang panukat ng tuyong ani. Tuwirang binabanggit sa Hebreo ang dalawang sea ng sebada at isang sea ng pinong harina.
    reason: cultural_note
  - marker: b
    text: O “sa tarangkahan ng Samaria.” Ang pintuang-bayan ay pampublikong pook ng kalakalan at paglilitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: At nangyari nga iyon gaya ng sinabi
  rationale: Ipinahahayag ng parirala na naganap ang pangyayari ayon mismo sa naunang sinabi. Ang “nga” ay likas na nagbibigay-diin sa katuparan nang hindi nagdaragdag ng paliwanag.
- source_word: אִישׁ הָאֱלֹהִים
  choice: tao ng Diyos
  rationale: Tuwirang pinananatili ang karaniwang titulong Hebreo sa halip na ipakahulugan ito bilang “propeta” o “lingkod ng Diyos.”
- source_word: סָאתַיִם
  choice: dalawang sea
  rationale: Ang anyong dual ay tahasang nangangahulugang dalawa. Pinanatili ang sinaunang yunit upang hindi mawala ang tiyak na paghahambing ng dami at presyo.
- source_word: שְׂעֹרִים
  choice: sebada
  rationale: Karaniwan at tiyak na katumbas sa modernong Filipino ng butil na tinutukoy.
- source_word: בְּשֶׁקֶל
  choice: sa isang siklo
  rationale: Sa pormulang pangkalakalan, ipinakikita ng ב ang presyong ibinabayad. Ang “mabibili sa isang siklo” ay malinaw at likas sa Filipino.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Pinananatili ang pagkakaiba nito sa karaniwang harina; tumutukoy ito sa harinang pino o mataas ang uri.
- source_word: כָּעֵת מָחָר
  choice: Bukas, sa ganito ring oras
  rationale: Likas na salin ng panahong tumutukoy sa katumbas na oras kinabukasan; hindi nito ginagawang labis na eksakto ang pahayag.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: sa pintuang-bayan ng Samaria
  rationale: Ang “pintuang-bayan” ay hindi lamang pasukan kundi ang pampublikong pook ng kalakalan at paghatol sa sinaunang lungsod.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang sinaunang mga yunit at ang titulong “tao ng Diyos,” habang ginawang natural sa Filipino ang pormula ng presyo sa pamamagitan ng “mabibili sa.”
