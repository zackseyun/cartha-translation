revisions:
- from: Sumagot ang opisyal sa lingkod ng Diyos, “Kahit gumawa pa si Yahweh ng mga bintana sa langit[a], mangyayari ba ang ganitong bagay?” Sinabi ng lingkod ng Diyos, “Makikita mo ito ng sarili mong mga mata, ngunit hindi ka makakain mula rito.”
  to: Sumagot ang opisyal sa tao ng Diyos at sinabi, “Kahit gumawa pa si Yahweh ng mga bintana sa langit[a], mangyayari ba ang ganitong bagay?” Sinabi niya, “Makikita mo ito ng sarili mong mga mata, ngunit hindi ka makakakain mula roon.”
  rationale: Ibinalik ang pormal na titulong “tao ng Diyos” upang tumpak na maisalin ang אִישׁ הָאֱלֹהִים. Inayos ang huling sugnay para sa likas na Filipino at pinanatili ang “mula roon,” na malapit sa spatial na pahayag ng Hebreo. Ginawang hindi gaanong espesipiko ang alternatibo sa talababa upang mapanatili ang saklaw ng imahen ng Hebreo.
