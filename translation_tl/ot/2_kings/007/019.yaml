base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: tl
  text: Sumagot ang opisyal sa tao ng Diyos at sinabi, “Kahit gumawa pa si Yahweh ng mga bintana sa langit[a], mangyayari ba ang ganitong bagay?” Sinabi niya, “Makikita mo ito ng sarili mong mga mata, ngunit hindi ka makakakain mula roon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bukasan sa kalangitan.” Literal sa Hebreo ang “mga bintana sa langit,” isang larawan ng mga bukasan sa langit na maaaring pagmulan ng panustos o paghuhukom.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: ang opisyal
  rationale: Tumutukoy ito sa isang mataas na opisyal na militar o maharlika. Malinaw sa makabagong Filipino ang “opisyal” nang hindi labis na tinutukoy ang eksaktong ranggo.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Ang literal na “tao ng Diyos” ay hindi likas na titulong propetiko sa modernong Filipino; malinaw na ipinahahayag ng “lingkod ng Diyos” ang kinikilalang tungkulin ng taong tinutukoy sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na tahasang nasa tekstong Hebreo.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: gumawa ... ng mga bintana sa langit
  rationale: Pinananatili ang kongkretong larawan ng Hebreo. Maaaring mangahulugan ang אֲרֻבּוֹת ng mga bintana o mga lagusan na binubuksan sa langit.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: mangyayari ba ang ganitong bagay?
  rationale: Natural na tanong sa Filipino na nagpapanatili sa mapagdudang retorikal na puwersa ng Hebreo.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: Makikita mo ito ng sarili mong mga mata
  rationale: Ang participle ay may prediktibong diwa sa konteksto, at pinananatili ng “sarili mong mga mata” ang diin ng Hebreo.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: ngunit hindi ka makakain mula rito
  rationale: Pinananatili ng “mula rito” ang literal na spatial na pahayag ng מִשָּׁם habang nauunawaan itong tumutukoy sa ipinangakong panustos.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang tahasang ginagamit sa Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Tukoy ng אִישׁ הָאֱלֹהִים
  choice: lingkod ng Diyos
  alternative: tao ng Diyos
  rationale: Pinili ang natural na titulong Filipino na tumutukoy sa kinikilalang sugo o propeta ng Diyos, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kahit ... pa” upang natural na maipahayag ang mapagdudang kondisyon sa tanong. Inulit ang “lingkod ng Diyos” sa halip na gumamit lamang ng malabong “siya,” yamang magkaibang tagapagsalita ang magkasunod na tinutukoy.
