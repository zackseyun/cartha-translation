base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: tl
  text: Itinalaga ng hari ang opisyal[a] na sinasandalan niya[b] upang mamahala sa pintuang-bayan. Ngunit pinagtapakan siya ng mga tao sa pintuang-bayan, at namatay siya, gaya ng sinabi ng tao ng Diyos nang bumaba ang hari patungo sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapitan” o “ayudante ng hari.” Ang salitang Hebreo ay tumutukoy sa isang mataas na opisyal na malapit sa hari.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na ang kamay ay sinasandalan niya,” isang paglalarawan sa malapit na tagapaglingkod ng hari.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד
  choice: itinalaga ... upang mamahala
  rationale: Ipinahihiwatig ng Hiphil ng פקד ang pag-aatas ng pananagutan o pamamahala. Likas sa Tagalog ang pinagsamang pariralang ito.
- source_word: הַשָּׁלִישׁ
  choice: ang opisyal
  rationale: Tumutukoy ito sa isang mataas na opisyal o ayudanteng malapit sa hari, ngunit hindi tiyak ang eksaktong ranggo; iniiwasan ng “opisyal” ang labis na pagtutukoy.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: na sinasandalan niya
  rationale: Natural itong paglalarawan sa isang malapit na tagapaglingkod ng hari. Inilalagay sa talababa ang literal na larawan ng pagsandal sa kamay upang hindi maging alanganin ang pangunahing teksto.
- source_word: עַל הַשַּׁעַר
  choice: upang mamahala sa pintuang-bayan
  rationale: Kasama ng הִפְקִיד, ang עַל ay nagpapahiwatig ng pananagutan sa tarangkahan, hindi lamang ng lokasyon. Nililinaw ng “pintuang-bayan” na tarangkahan ng lungsod ang tinutukoy.
- source_word: וַיִּרְמְסֻהוּ הָעָם
  choice: pinagtapakan siya ... ng mga tao
  rationale: Tuwirang ipinapahayag ang pagyurak o pagtapak ng nag-uunahang mga tao nang hindi dinaragdagan ang tindi ng pandiwa.
- source_word: בַּשַּׁעַר
  choice: roon
  rationale: Ang “roon” ay malinaw na tumutukoy sa nabanggit nang pintuang-bayan at umiiwas sa mabigat na pag-uulit sa Tagalog.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi
  rationale: Pinananatili nito ang malinaw na ugnayan ng pangyayari sa naunang pahayag ng tao ng Diyos.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang tao ng Diyos
  rationale: Pinananatili ang natatanging titulong Hebreo sa halip na palitan ito ng mas interpretibong “propeta.”
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: nang bumaba ang hari papunta sa kanya
  rationale: Ang בְּ sa infinitive construct ay temporal. Pinananatili ng salin ang kilos na “bumaba” at ang patutunguhan nang hindi nagdaragdag ng layunin.
theological_decisions:
- issue: Katuparan ng naunang pahayag ng tao ng Diyos
  choice: gaya ng sinabi ng tao ng Diyos
  alternative: ayon sa sinabi ng tao ng Diyos
  rationale: Malinaw na iniuugnay ng Hebreo ang pagkamatay ng opisyal sa naunang pahayag. Pinananatili ang diin sa katuparan nang hindi nagdaragdag ng paliwanag tungkol sa paraan o dahilan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pintuang-bayan” para sa tarangkahan ng lungsod at “tao ng Diyos” bilang pormal na titulong biblikal. Inilipat ang mga talababa sa mga salitang talagang ipinapaliwanag ng mga ito.
