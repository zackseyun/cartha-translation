  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: tl
  text: Nang makarating sa gilid ng kampo ang mga ketonging ito[a], pumasok sila sa isang tolda at kumain at uminom. Dinala nila mula roon ang pilak, ginto, at mga damit; pagkatapos ay umalis sila at itinago ang mga iyon. Bumalik sila, pumasok sa isa pang tolda, at nagdala rin mula roon ng mga bagay; pagkatapos ay umalis sila at itinago ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “mga ketongin” ay tumutukoy sa mga taong may sakit sa balat na tradisyonal na tinatawag na ketong; maaaring mas malawak ang saklaw ng sinaunang termino kaysa sa sakit na tinatawag na ketong sa makabagong medisina.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: mga ketonging ito
  rationale: Pinananatili ang maikli at tradisyonal na katawagan sa salaysay, habang nililinaw sa talababa na ang צָרַעַת ay mas malawak kaysa sa modernong terminong medikal na ketong.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: gilid ng kampo
  rationale: Tumpak at natural na katumbas ng spatial na diwang 'dulo/gilid' ng קָצֶה.
- source_word: אֹהֶל אֶחָד
  choice: isang tolda
  rationale: Pinananatili ang pagiging di-tiyak ngunit may bilang ng pariralang Hebreo at ang kongkretong pagkakasunod-sunod ng salaysay.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: kumain at uminom
  rationale: Payak na anyong pasalaysay na hindi nagdaragdag ng aspektong wala sa Hebreo.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: Kumuha sila roon
  rationale: Sa konteksto, ang נשא ay pagkuha at pagdadala ng mga ari-arian; mas natural sa modernong Tagalog ang 'kumuha' kaysa sa literal na 'binuhat' o 'dinala mula roon.'
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: pilak, ginto, at mga damit
  rationale: Malinaw at pangkaraniwang modernong Tagalog para sa tatlong bagay na nakatala.
- source_word: וַיַּטְמִנוּ
  choice: itinago ang mga iyon
  rationale: Pinananatili ang pangkalahatang kahulugang 'itago' at hindi nililimitahan sa posibleng ngunit hindi tiyak na 'ibaon.'
- source_word: וַיָּשֻׁבוּ
  choice: Pagkatapos, bumalik sila
  rationale: Natural na ipinahahayag ang pagpapatuloy ng sunod-sunod na kilos sa salaysay.
- source_word: אֹהֶל אַחֵר
  choice: isa pang tolda
  rationale: Likas na modernong Tagalog para sa 'another tent.'
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: Kumuha rin sila roon ng mga bagay
  rationale: Ginagawang malinaw sa Tagalog ang ipinahihiwatig ngunit hindi binanggit na layon, nang hindi tinutukoy kung anu-anong bagay ang kinuha.
