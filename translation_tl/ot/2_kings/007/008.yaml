translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at natural sa pasalaysay na konteksto. Hinati ang mahahabang kawing ng Hebreo sa maiikling pangungusap para sa linaw, ngunit pinanatili ang pagkakasunod-sunod ng mga kilos at ang hindi tiyak na layon sa ikalawang pagkuha.
