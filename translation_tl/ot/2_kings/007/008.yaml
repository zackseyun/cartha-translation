    text: Ang salitang Hebreo na isinaling “mga ketongin” ay tumutukoy sa mga taong may sakit sa balat na tradisyonal na tinatawag na ketong; maaaring mas malawak ang saklaw ng sinaunang termino kaysa sa sakit na tinatawag na ketong sa makabagong medisina.
    reason: cultural_note
  revision_rationale: Binago ang pandiwang “kumuha” sa “dinala ... mula roon/nagdala ... mula roon” upang mas malinaw na maipakita ang kahulugan ng Hebreong נשא na pagdadala o pag-aalis ng mga bagay. Pinanatili ang hindi tiyak na “mga bagay” sa ikalawang tolda, gaya ng nasa Hebreo. Iniayos din ang talababa sa karaniwang anyong “mga ketongin,” samantalang pinanatili sa teksto ang “mga ketonging ito” upang maipahayag ang demonstratibong “ito.”
