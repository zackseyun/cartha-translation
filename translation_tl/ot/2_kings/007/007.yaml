base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: tl
  text: Kaya bumangon sila at tumakas nang takipsilim[a]. Iniwan nila ang kanilang mga tolda, mga kabayo, at mga asno—pati ang kampo, sa ganoon nitong kalagayan[b]—at tumakas sila upang mailigtas ang kanilang buhay[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang dapithapon.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang kampo ayon sa kalagayan nito,” ibig sabihin, iniwan nila ang kampo kung paano ito noon.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “tumakas tungo sa kanilang buhay,” isang idyomang nangangahulugang tumakas upang mailigtas ang kanilang buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: nang takipsilim
  rationale: Ang נֶשֶׁף ay tumutukoy sa malamlam na oras sa pagitan ng araw at gabi. Ang “takipsilim” ay likas at marangal sa modernong Tagalog, habang hindi labis na nililinaw ang eksaktong sandali.
- source_word: וַיַּעַזְבוּ
  choice: iniwan nila
  rationale: Karaniwang kahulugan ng עזב ang “iwan” o “pabayaan.” Malinaw na ipinahihiwatig ng biglaang pagtakas sa konteksto na pinabayaan nila ang mga ari-arian.
- source_word: אָהֳלֵיהֶם
  choice: kanilang mga tolda
  rationale: Tuwirang katumbas sa konteksto ng isang kampong militar.
- source_word: סוּסֵיהֶם
  choice: mga kabayo
  rationale: Karaniwang tuwirang katumbas ng סוּסִים.
- source_word: חֲמֹרֵיהֶם
  choice: mga asno
  rationale: Ang “asno” ay malinaw at angkop na modernong katawagan para sa hayop na pantrabaho at panlulan.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: ang buong kampo na gaya ng dati
  rationale: Pinananatili nito ang diwa na ang kampo ay iniwan sa dati nitong kalagayan. Idinagdag ang “buong” bilang likas na pag-uugnay sa listahan, hindi bilang pahiwatig na walang nasira.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: tumakas sila upang iligtas ang kanilang buhay
  rationale: Ang literal na “tumakas tungo sa kanilang buhay” ay isang idyoma para sa pagtakas upang manatiling buhay. Ang salin ay natural sa Tagalog at pinananatili ang matinding pagmamadali.
- source_word: וַיָּקוּמוּ
  choice: bumangon sila
  rationale: Pinananatili ang kilos na קום na nagsisimula sa sunod-sunod at apurahang mga pangyayari.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: tumakas ... tumakas
  rationale: Pinananatili ang pag-uulit ng pandiwang נוּס upang maipakita ang diin at pagmamadali ng Hebreong salaysay.
