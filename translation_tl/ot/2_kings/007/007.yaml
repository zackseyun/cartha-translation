  source_fidelity: 'Tumpak sa kabuuan ang pagkakasunod ng mga kilos, ang pag-uulit ng "tumakas," at ang mga pangunahing bagay na iniwan. Gayunman, ang "ang buong kampo na gaya ng dati" ay may dalawang di-kailangang paglihis: wala sa Hebreo ang "buong," at ang "gaya ng dati" ay karaniwang nangangahulugang ‘as before/usual,’ sa halip na ‘as it was’—ang kasalukuyang kalagayan ng kampo nang iwanan ito.'
  naturalness: Natural at marangal ang karamihan ng salin. Ang binagong "pati ang kampo, sa ganoon nitong kalagayan" ay mas malinaw na Tagalog kaysa sa literalistikong "ang kampo gaya ng dati," habang pinananatili ang diin na iniwan ang kampo nang hindi binabago ang kalagayan nito.
  terminology: Ang "takipsilim," "tolda," "kabayo," at "asno" ay angkop sa modernong Filipino Tagalog at sa register ng salaysay. Ang "upang mailigtas ang kanilang buhay" ay likas na pagpapahayag ng idyomang Hebreo na tumakas para mabuhay.
