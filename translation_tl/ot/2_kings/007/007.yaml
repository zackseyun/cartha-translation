  to: Kaya bumangon sila at tumakas nang takipsilim[a]. Iniwan nila ang kanilang mga tolda, mga kabayo, at mga asno—pati ang kampo, sa ganoon nitong kalagayan[b]—at tumakas sila upang mailigtas ang kanilang buhay[c].
