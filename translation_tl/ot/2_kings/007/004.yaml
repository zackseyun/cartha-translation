translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “lungsod,” “taggutom,” at “kampo” bilang karaniwang bokabularyo. Pinili ang idyomatikong “sumuko tayo” sa pangunahing teksto, habang inilagay sa talababa ang literal na metapora at ang saklaw ng kahulugan. Inilipat ang mga marker sa mga salitang aktuwal na tinatalakay ng kani-kanilang talababa.
