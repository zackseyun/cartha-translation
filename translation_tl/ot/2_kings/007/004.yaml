  - severity: low
    issue: Bahagyang di-natural ang ayos na “naroon sa lungsod ang taggutom.”
    rationale: Mas tuwiran sa modernong Filipino ang “nasa lungsod ang taggutom,” nang hindi binabago ang diin o kahulugan.
