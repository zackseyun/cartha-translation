  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: tl
  text: Kung sabihin natin, ‘Pumasok tayo sa lungsod,’ nasa lungsod ang taggutom, at mamamatay tayo roon. Kung manatili naman tayo rito, mamamatay din tayo. Kaya, pumunta tayo sa kampo ng Aram at sumuko[a]. Kung pababayaan nila tayong mabuhay, mabubuhay tayo; at kung papatayin nila tayo, mamamatay tayo.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bumagsak tayo sa kampo ng Aram.” Sa kontekstong militar, ang idyomang Hebreo ay maaaring mangahulugang “sumuko tayo sa” o “pumanig tayo sa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹא
  choice: Pumasok tayo
  rationale: 'Ang unang panauhang maramihang imperfect sa loob ng iminungkahing pananalita ay likas na ipinapahayag sa Filipino bilang paghihikayat: “Pumasok tayo.”'
- source_word: הָעִיר
  choice: sa lungsod
  rationale: Pinananatili ang karaniwang pangngalang “lungsod” sa halip na tukuying Samaria, gaya ng Hebreo.
- source_word: הָרָעָב
  choice: ang taggutom
  rationale: Tumutukoy ito sa malawakang kakulangan ng pagkain sa panahon ng pagkubkob, hindi lamang sa personal na gutom.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: mamamatay tayo
  rationale: Sa mga sugnay na kondisyonal, ipinahahayag ng anyo ang tiyak na inaasahang bunga; natural dito ang aspektong kontemplatibo sa Filipino.
- source_word: יָשַׁבְנוּ פֹה
  choice: manatili tayo rito
  rationale: Maaaring mangahulugan ang ישב na umupo, manirahan, o manatili. Sa konteksto ng pagpili ng gagawin, “manatili” ang pinakanatural nang hindi binabago ang diwa.
- source_word: וְעַתָּה
  choice: Kaya
  rationale: Ipinakikita ng parirala ang paglipat mula sa pagsusuri ng mga pagpipilian tungo sa kongklusyon at pagkilos.
- source_word: לְכוּ
  choice: halika
  rationale: Bagaman literal na “humayo,” ginagamit ito rito bilang panawagan bago ang sama-samang pagkilos; “halika” ang likas na katumbas sa Filipino.
- source_word: וְנִפְּלָה אֶל
  choice: sumuko tayo
  rationale: Sa kontekstong militar, ang נפל אל ay idyomang nangangahulugang pumanig, lumapit bilang takas, o sumuko sa kabilang hukbo. Mas malinaw sa modernong Filipino ang “sumuko tayo” kaysa sa literal na “bumagsak tayo sa.”
- source_word: מַחֲנֵה אֲרָם
  choice: sa kampo ng Aram
  rationale: Pinananatili ang pangalang Hebreo na Aram at ang kayariang “kampo ng Aram.”
- source_word: יְחַיֻּנוּ
  choice: pababayaan nila tayong mabuhay
  rationale: Ang Piel ng חיה na may hulaping layon ay nangangahulugang panatilihing buhay o hayaang mabuhay. Pinananatili rin nito ang pag-uulit ng ugat sa kasunod na “mabubuhay.”
- source_word: נִחְיֶה
  choice: mabubuhay tayo
  rationale: Tuwirang resulta ito ng naunang kondisyon at pinananatili ang retorikal na pag-uulit.
- source_word: יְמִיתֻנוּ
  choice: papatayin nila tayo
  rationale: Ang Hiphil ng מות ay causative, “patayin” o “ipapatay.” Ang “papatayin” ang malinaw at natural na salin sa kontekstong ito.
