  naturalness: Karaniwang natural ang Filipino, ngunit mas malinaw at mas likas ang “pumunta tayo sa kampo ng Aram at sumuko” kaysa “Kaya halika, sumuko tayo sa kampo ng Aram.” Ang “nasa lungsod ang taggutom” ay mas tuwiran kaysa “naroon sa lungsod ang taggutom.”
  terminology: Ang “lungsod,” “taggutom,” “kampo,” at “Aram” ay angkop sa modernong Filipino at sumusunod sa pangalan at saklaw ng terminong Hebreo. Ang “sumuko” ay wastong pangunahing salin para sa idyoma, habang pinangangalagaan ng talababa ang literal at alternatibong kahulugan.
