  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: tl
  text: 'At gayon nga ang nangyari sa kanya[a]: niyurakan siya ng mga tao sa pintuang-bayan[b], at namatay siya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At naging gayon para sa kanya,” isang idyomang nangangahulugang nangyari ang mga bagay ayon mismo sa naunang ipinahayag.
    reason: lexical_alternative
  - marker: b
    text: O “sa tarangkahan” o “sa daanan ng pintuang-bayan.” Maaaring tumukoy ang salitang Hebreo sa pintuan ng lungsod o sa buong lugar at daanang nakapaligid dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: At gayon nga ang nangyari sa kanya
  rationale: Likas sa modernong Tagalog ang pariralang ito at ipinahihiwatig nitong naganap sa kanya ang mismong naunang sinabi, nang hindi nagdaragdag ng tahasang paliwanag tungkol sa paghatol.
- source_word: וַיִּרְמְסוּ
  choice: niyurakan
  rationale: Tuwirang ipinapahayag ng רמס ang pagyurak o pag-apak sa isang tao; malinaw at karaniwan ang “niyurakan” sa Tagalog.
- source_word: הָעָם
  choice: mga tao
  rationale: Karaniwang kahulugan ng עַם ang bayan o mga tao. Sa konteksto, tumutukoy ito sa mga taong dumaraan nang maramihan; pinananatili ng “mga tao” ang payak na katawagan ng Hebreo.
- source_word: בַּשַּׁעַר
  choice: sa pintuang-bayan
  rationale: Ang שַׁעַר ay maaaring tumukoy sa tarangkahan ng lungsod at sa buong lugar na dinaraanan doon. Ang “pintuang-bayan” ay malinaw na tumutukoy sa city gate at akma sa makasaysayang tagpo.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Tuwirang isinasalin ang sunod na pangyayaring nasa Hebreo. Mauunawaan sa konteksto na ang kamatayan niya ay bunga ng pagkakayurak nang hindi kailangang idagdag ang “kaya.”
theological_decisions:
- issue: Pagkakatupad ng ipinahayag na paghatol
  choice: Isinalaysay na gayon nga ang nangyari sa kanya, na nagpapakitang natupad ang naunang ipinahayag nang walang dagdag na komentaryong teolohikal.
  alternative: “Sa gayon ay dumating sa kanya ang hatol,” na tahasang naglalarawan sa pangyayari bilang banal na paghatol.
  rationale: Malinaw sa kalapit na konteksto na natupad ang salita ni Eliseo, ngunit ang talata mismo ay nagsasalaysay lamang ng pangyayari. Pinananatili ng salin ang anyong pasalaysay at hindi ipinapasok sa pangunahing teksto ang paliwanag na hindi tahasang sinabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang maiba ito sa karaniwang pinto ng bahay at maipakita ang tarangkahan ng lungsod; pinanatiling maigsi at pasalaysay ang pangungusap gaya ng Hebreo.
