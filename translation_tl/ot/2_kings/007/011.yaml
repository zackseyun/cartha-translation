translation:
  language: tl
  text: Pagkatapos, tumawag ang mga bantay sa pintuan at ipinaalam iyon sa sambahayan ng hari sa loob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ipinaalam iyon sa loob ng bahay ng hari.” Literal sa Hebreo: “bahay ng hari, papaloob.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: sumigaw
  rationale: Ang קרא rito ay tumutukoy sa malakas na pagtawag upang maiparating ang balita. Likas sa modernong Filipino ang “sumigaw” sa ganitong tagpo, nang hindi ipinahihiwatig na sigaw ito ng takot.
- source_word: הַשֹּׁעֲרִים
  choice: ang mga bantay sa pintuan
  rationale: Tumutukoy ang שֹׁעֲרִים sa mga taong nakatalaga sa pintuang-bayan. Mas malinaw at natural sa karaniwang mambabasa ang “mga bantay sa pintuan” kaysa sa literal ngunit di-gaanong likas na “mga tagapagbantay ng pintuan.”
- source_word: וַיַּגִּידוּ
  choice: ipinaalam iyon
  rationale: Ang נגד ay nangangahulugang magpabatid o mag-ulat. Ang “ipinaalam iyon” ay natural na naghahayag ng pagpapasa ng natuklasang balita; idinagdag ang “iyon” bilang di-tahasang layon na malinaw sa konteksto.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palasyo ng hari
  rationale: Literal itong “bahay ng hari,” ngunit sa kontekstong monarkikal, malinaw at natural na katumbas ang “palasyo ng hari.” Hindi nito ganap na nilulutas kung gusali o sambahayan ang tinutukoy, kaya inilalahad sa talababa ang alternatibo.
- source_word: פְּנִימָה
  choice: sa loob
  rationale: Pinananatili ng “sa loob” ang direksiyon ng pang-abay—mula sa pintuan patungo sa loob—at maikli at likas ito sa Filipino.
