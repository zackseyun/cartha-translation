  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: tl
  text: Sapagkat ipinarinig ng Panginoon sa kampo ng Aram ang tunog ng mga karwahe, ang tunog ng mga kabayo, at ang tunog ng isang malaking hukbo, at sinabi nila sa isa’t isa, “Tingnan ninyo! Inupahan ng hari ng Israel ang mga hari ng mga Heteo at ang mga hari ng Ehipto upang lumaban sa atin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: ang Panginoon
  rationale: Tumutukoy ang titulong אֲדֹנָי sa Diyos ng Israel sa kontekstong ito; “ang Panginoon” ang likas at marangal na katumbas sa Tagalog.
- source_word: הִשְׁמִיעַ
  choice: ipinarinig
  rationale: Pinananatili ng causative na pandiwang “ipinarinig” ang diwang ang Panginoon ang naging sanhi upang marinig ng kampo ang mga tunog.
- source_word: מַחֲנֵה אֲרָם
  choice: kampo ng Aram
  rationale: Direktang pinananatili ang pangalang Aram at iniiwasan ang maaaring anakronistikong “Siria.”
- source_word: קוֹל רֶכֶב
  choice: ugong ng mga karwahe
  rationale: Ang “ugong” ay natural na naglalarawan sa malakas at nagbabantang tunog ng mga karwaheng pandigma.
- source_word: קוֹל סוּס
  choice: yabag ng mga kabayo
  rationale: Ang “yabag” ang natural na tunog na iniuugnay sa paparating na maraming kabayo, habang pinananatili ang kongkretong larawang militar.
- source_word: קוֹל חַיִל גָּדוֹל
  choice: ingay ng isang malaking hukbo
  rationale: Sa konteksto, ang חַיִל ay puwersang militar; malinaw at natural ang “malaking hukbo.”
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: sinabi nila sa isa’t isa
  rationale: Natural na Tagalog para sa Hebreong idyomang literal na “sinabi ng bawat lalaki sa kanyang kapatid,” na tumutukoy sa usapang magkakasamahan.
- source_word: הִנֵּה
  choice: Tingnan ninyo!
  rationale: Ipinahahayag nito ang biglaang pagkilala at pagbibigay-pansin nang hindi gumagamit ng makalumang pananalita.
- source_word: שָׂכַר עָלֵינוּ
  choice: inupahan ... upang salakayin tayo
  rationale: Pinananatili ang kahulugan ng שׂכר na “umupa,” samantalang ang kaaway na diwa ng עָלֵינוּ at kasunod na לָבוֹא עָלֵינוּ ay likas na naipapahayag sa “upang salakayin tayo.”
- source_word: מַלְכֵי הַחִתִּים
  choice: mga hari ng mga Heteo
  rationale: Pinananatili ang kapansin-pansing maramihang “mga hari,” na maaaring tumukoy sa mga pinunong panrehiyon.
- source_word: מַלְכֵי מִצְרַיִם
  choice: mga hari ng Ehipto
  rationale: Pinananatili ang maramihang anyo ng tekstong Hebreo sa halip na baguhin ito sa isahan dahil lamang sa historikal na inaasahan.
- source_word: לָבוֹא עָלֵינוּ
  choice: upang salakayin tayo
  rationale: Malinaw na ipinahahayag ang mapanlabang paglapit na tinutukoy ng pariralang Hebreo.
theological_decisions:
- issue: Pagpapahayag sa titulong banal na אֲדֹנָי
  choice: ang Panginoon
  alternative: ang panginoon / ang Amo
  rationale: Sa salaysay, ang tinutukoy ay ang Diyos ng Israel. Ang malaking titik at karaniwang titulong “Panginoon” ay nagpapakilala rito nang hindi ito ipinagpapalit sa Tetragrammaton.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkakaibang likas na salitang pantunog—“ugong,” “yabag,” at “ingay”—sa halip na mekanikal na ulitin ang “tunog,” ngunit pinanatili ang tatlong-bahaging paglalarawan ng Hebreo. Walang talababa dahil walang alternatibong pagbasa na kailangang ilahad para maunawaan ang talata.
