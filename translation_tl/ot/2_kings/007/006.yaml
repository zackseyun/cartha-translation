  - severity: low
    issue: Pinalitan ang magkakatulad na קוֹל ng “ugong,” “yabag,” at “ingay”
    rationale: Bagaman natural ang mga salitang ito, binabawasan nila ang sadyang tatlong ulit na “sound of” sa Hebreo. Ang pag-uulit ng “tunog” ay madaling unawain at mas malapit sa pinagmulan.
