  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: tl
  text: Pagkatapos, sinabi nila sa isa’t isa, “Hindi tama ang ginagawa natin. Ang araw na ito ay araw ng mabuting balita, ngunit nananahimik tayo. Kung maghihintay tayo hanggang magbukang-liwayway, mananagot tayo[a]. Kaya halika, pumunta tayo at ibalita ito sa sambahayan ng hari[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “matatagpuan tayo ng kasalanan.” Maaari ring ang diwa ay “aabutan tayo ng kaparusahan” o “magkakasala tayo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sambahayan ng hari” ay maaari ring isaling “bahay ng hari” o “palasyo ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: Hindi tama ang ginagawa natin
  rationale: Likas na modernong Tagalog na nagpapanatili sa moral na pagtataya ng Hebreong idyoma, ‘hindi ganito ang ginagawa natin.’
- source_word: יוֹם בְּשֹׂרָה
  choice: araw ng mabuting balita
  rationale: Ang בְּשֹׂרָה ay balita, lalo na ang mabuting balita tungkol sa tagumpay o pagliligtas; malinaw ito sa konteksto ng pagkaligtas mula sa pagkubkob.
- source_word: מַחְשִׁים
  choice: nananahimik tayo
  rationale: Ipinahihiwatig ng Hifil participle ang nagpapatuloy at sinasadyang hindi pagsasalita; natural itong naipapahayag ng ‘nananahimik tayo.’
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: Kung maghihintay tayo hanggang magbukang-liwayway
  rationale: Kondisyonal ang gamit ng sugnay sa konteksto. Ang ‘magbukang-liwayway’ ay natural at matingkad na katumbas ng ‘liwanag ng umaga.’
- source_word: וּמְצָאנוּ עָוֹן
  choice: aabutan tayo ng kasalanan
  rationale: Pinananatili nito ang talinghagang literal na ‘matatagpuan tayo ng kasalanan/pagkakasala’ nang hindi tiyakang nilulutas kung pagkakasala o kaparusahan ang pangunahing diwa.
- source_word: לְכוּ וְנָבֹאָה
  choice: halika, pumunta tayo
  rationale: Ang pautos na הלך at cohortative na בוא ay magkasamang panawagan sa agarang pagkilos; likas sa Tagalog ang ‘halika, pumunta tayo.’
- source_word: וְנַגִּידָה
  choice: at ibalita ito
  rationale: Ang Hifil ng נגד ay nangangahulugang magsabi, magpahayag, o mag-ulat; ang ‘ibalita’ ay angkop sa agarang impormasyong dinadala nila.
- source_word: בֵּית הַמֶּלֶךְ
  choice: sambahayan ng hari
  rationale: Ang literal na ‘bahay ng hari’ ay maaaring tumukoy sa maharlikang sambahayan o institusyon ng palasyo; pinananatili ng ‘sambahayan ng hari’ ang malawak na diwa.
theological_decisions:
- issue: Ang diwa ng עָוֹן sa pariralang ‘matatagpuan tayo ng עָוֹן’
  choice: kasalanan, na may literal na talinghagang ‘aabutan tayo’
  alternative: kaparusahan ang aabutan sa atin / magkakasala tayo
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, pananagutan, o bunga nitong kaparusahan. Hindi dapat tahimik na paliitin ang tunay na saklaw ng Hebreo, kaya pinanatili sa teksto ang ‘kasalanan’ at ipinaliwanag sa talababa ang mga posibleng diwa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘magbukang-liwayway’ para sa natural ngunit matingkad na paglalarawan, at iniwasang lutasin nang labis ang ambiguwidad ng עָוֹן at בֵּית הַמֶּלֶךְ.
