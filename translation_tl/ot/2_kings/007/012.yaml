  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: tl
  text: Nang gabing iyon, bumangon ang hari at sinabi sa kanyang mga lingkod, “Hayaan ninyong sabihin ko sa inyo, pakiusap, kung ano ang ginawa sa atin ng mga taga-Aram[a]. Alam nilang nagugutom tayo, kaya umalis sila sa kampo upang magtago sa parang. Sinabi nila, ‘Kapag lumabas sila sa lungsod, huhulihin natin sila nang buhay at papasok tayo sa lungsod.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Aram.” Ginagamit dito ang pangalan ng lugar o bayan upang tukuyin ang mga tao o hukbo ng Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: Nang gabing iyon, bumangon ang hari
  rationale: Ang קום ay karaniwang nagsasaad ng pagbangon, at ang לַיְלָה ay panandang-pamanahon. Natural sa salaysay na Tagalog ang “Nang gabing iyon” habang pinananatili ang tagpong panggabi.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Malawak ang kahulugan nito at maaaring tumukoy sa mga lingkod o tauhan ng hari; pinananatili ng “mga lingkod” ang pagiging bukas ng katawagan.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Hayaan ninyong sabihin ko sa inyo
  rationale: Ipinahihiwatig ng cohortative at נָא ang isang magalang ngunit mariing panukala. Natural itong katumbas sa modernong Tagalog nang hindi ginagawang utos.
- source_word: אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: kung ano ang ginawa sa atin ng mga taga-Aram[a]
  rationale: Ang Aram ay pangalan ng lugar o bayan na ginamit dito para sa mga tao o hukbo nito. Mas natural sa Tagalog ang “mga taga-Aram,” habang ipinapaliwanag sa talababa ang anyo ng Hebreo.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Alam nilang nagugutom tayo
  rationale: Ang kasalukuyang anyo ay angkop sa pangangatwiran ng hari tungkol sa nalalaman ng kaaway; malinaw at natural ang “nagugutom tayo.”
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: umalis sila sa kampo
  rationale: Sa konteksto, ang paglabas nila mula sa kampo ay nangangahulugang iniwan nila ito; natural at malinaw ang “umalis ... sa kampo.”
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: upang magtago sa parang
  rationale: Pinananatili ng “magtago” ang layuning magkubli, at inilalarawan ng “parang” ang bukas na lupain sa labas ng lungsod na angkop sa isang pananambang.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Ipinakikilala nito ang nilalaman ng ipinalalagay na sinabi o binalak ng mga taga-Aram. Pinananatili ng tuwirang pananalita ang anyo ng Hebreo.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Kapag lumabas sila sa lungsod
  rationale: Ang “kapag” ay natural na nagpapahayag ng inaasahang pangyayari na magsisilbing pagkakataon para sa pananambang.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: huhulihin natin sila nang buhay
  rationale: Ang תפשׂ ay pagdakip o paghuli, at ang חַיִּים ay nagsasaad na buhay silang kukunin.
- source_word: וְאֶל הָעִיר נָבֹא
  choice: at papasok tayo sa lungsod
  rationale: Direkta at natural itong nagpapahayag ng kasunod na layunin ng mga nag-aabang.
