translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang tuwirang pananalita at ang haka ng hari tungkol sa plano ng kaaway. Iniwasan ang “Syria” upang mapanatili ang pangalang Aram sa pinagmulang teksto.
