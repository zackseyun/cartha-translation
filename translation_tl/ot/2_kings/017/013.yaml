  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: tl
  text: Gayunman, taimtim na nagbabala[a] si Yahweh sa Israel at Juda sa pamamagitan ng bawat isa sa kanyang mga propeta at ng bawat tagakita. Sinabi niya, “Talikuran ninyo ang masasama ninyong landas at sundin ninyo ang aking mga utos at mga tuntunin, ayon sa buong Kautusan na iniutos ko sa inyong mga ninuno[b] at ipinadala ko sa inyo sa pamamagitan ng aking mga lingkod, ang mga propeta.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “taimtim na nagpatotoo laban sa Israel at Juda.” Maaaring magpahiwatig ang pandiwang Hebreo ng taimtim na babala o patotoo laban sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga ama”; sa kontekstong ito, tumutukoy ito sa kanilang mga ninuno.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “sa pamamagitan ng aking mga lingkod, ang mga propeta.” Ang Hebreo ay gumagamit ng idyomang literal na “sa kamay ng.”
    reason: source_idiom
lexical_decisions:
- source_word: וַיָּעַד
  choice: taimtim na nagbabala
  rationale: Ang Hiphil ng עוּד ay maaaring tumukoy sa taimtim na pagbibigay-babala o pagpapatotoo laban sa isang tao. Ang kasunod na tuwirang panawagan at ang konteksto ng paghatol ay umaayon sa “taimtim na nagbabala,” habang inilalagay sa talababa ang ibang tunay na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: sa Israel at Juda
  rationale: Sa konstruksyong ito, ang ב ay nagpapakilala sa mga pinatutungkulan ng babala. Likas sa Tagalog ang “nagbabala sa Israel at Juda” at hindi nito labis na nililinaw kung ang diin ay babala sa kanila o patotoo laban sa kanila.
- source_word: בְּיַד כָּל־נְבִיאוֹ כָּל־חֹזֶה
  choice: sa pamamagitan ng bawat isa sa kanyang mga propeta at ng bawat tagakita
  rationale: Ang בְּיַד ay instrumentong idyoma na nangangahulugang “sa pamamagitan ng.” Pinananatili ng “bawat isa” at “bawat” ang distributibong puwersa ng dalawang כָּל, at ng “tagakita” ang pagkakaiba ng חֹזֶה sa karaniwang “propeta.”
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Talikuran ninyo ang masasama ninyong lakad
  rationale: Ang שׁוּב ay literal na “bumalik/lumingon,” ngunit kapag sinusundan ng מִן ay nangangahulugang tumalikod mula sa isang bagay. Ang “mga lakad” ay natural na moral na metapora para sa דֶּרֶךְ.
- source_word: וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי
  choice: at sundin ninyo ang aking mga utos at mga tuntunin
  rationale: Sa kontekstong tipan at batas, ang שׁמר ay tumutukoy sa maingat na pagsunod. Pinananatiling magkahiwalay ang מִצְוֹת at חֻקּוֹת bilang “mga utos” at “mga tuntunin.”
- source_word: כְּכָל הַתּוֹרָה
  choice: ayon sa buong Kautusan
  rationale: Maaaring mangahulugan ang תּוֹרָה ng “tagubilin” o “kautusan.” Sa konteksto ng mga utos at tuntunin ng tipan, ang “buong Kautusan” ang malinaw at angkop na salin ng כָּל.
- source_word: אֲשֶׁר צִוִּיתִי אֶת־אֲבֹתֵיכֶם
  choice: na iniutos ko sa inyong mga ninuno
  rationale: Ang אָבוֹת ay literal na “mga ama” ngunit karaniwang tumutukoy sa mga ninuno sa kasaysayan ng tipan. Ang “mga ninuno” ay natural at saklaw ang diwa sa modernong Tagalog.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: at ipinadala ko sa inyo sa pamamagitan ng aking mga lingkod na mga propeta
  rationale: Pinananatili ng “ipinadala” ang metapora at sintaktikong pagkakaugnay ng sugnay sa Kautusan nang hindi ito ipinapaliwanag nang higit sa Hebreo. Isinasalin ang בְּיַד bilang instrumentong “sa pamamagitan ng,” at ang “mga lingkod na mga propeta” bilang aposisyon.
theological_decisions:
- issue: Ang tinutukoy ng “ipinadala ko sa inyo”
  choice: Pinananatiling pinakamalapit ang sugnay sa “buong Kautusan,” kaya ang Kautusan o tagubilin ang ipinadala sa pamamagitan ng mga propeta.
  alternative: Maaaring tumukoy nang mas maluwag ang sugnay sa kabuuan ng mensaheng ipinahayag ng mga propeta, o sa naunang utos na tumalikod at sumunod.
  rationale: Pinapaboran ng sintaks ang pagkakaugnay sa Kautusan, ngunit hindi dinaragdagan ng salin ang teksto upang lubusang isara ang ibang posibleng saklaw ng sugnay.
- issue: Babala o patotoo laban sa Israel at Juda
  choice: “taimtim na nagbabala ... sa” ang ginamit sa pangunahing teksto.
  alternative: “taimtim na nagpatotoo laban sa Israel at Juda.”
  rationale: Saklaw ng pandiwa ang dalawang diwa. Mas natural sa konteksto ng kasunod na panawagan ang babala, ngunit mahalagang panatilihin sa talababa ang hudisyal na himig ng alternatibong “nagpatotoo laban.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan, “tagakita” upang mapanatili ang natatanging terminong propetiko, at “Kautusan” bilang katawagang tipan. Iniwasan ang sobrang teknikal o denominasyonal na pananalita; pinanatili rin ang tunay na sintaktikong tensiyon sa huling sugnay.
