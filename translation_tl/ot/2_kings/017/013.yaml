  to: Gayunman, taimtim na nagbabala[a] si Yahweh sa Israel at Juda sa pamamagitan ng bawat isa sa kanyang mga propeta at ng bawat tagakita. Sinabi niya, “Talikuran ninyo ang masasama ninyong landas at sundin ninyo ang aking mga utos at mga tuntunin, ayon sa buong Kautusan na iniutos ko sa inyong mga ninuno[b] at ipinadala ko sa inyo sa pamamagitan ng aking mga lingkod, ang mga propeta.[c]”
