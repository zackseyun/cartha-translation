  text: Ngunit hindi sila nakinig; sa halip, patuloy nilang isinasagawa ang dati nilang kaugalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa halip, patuloy silang kumikilos ayon sa dati nilang alituntunin o gawi.” Ang Hebreong מִשְׁפָּט ay maaaring mangahulugang alituntunin, tuntunin, o nakaugaliang gawain; dito, tumutukoy ito sa dati na nilang paraan ng pagsamba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Ngunit hindi
  rationale: Ipinahahayag ng pang-ugnay at pagtanggi ang banayad na pagsalungat sa naunang utos; natural itong naihahatid ng “Ngunit hindi.”
- source_word: שָׁמֵעוּ
  choice: nakinig
  rationale: Maaaring mangahulugan ang שׁמע na makarinig, makinig, o sumunod. Pinananatili ng “nakinig” ang diwa ng pagdinig at pagtugon nang hindi tahasang nilulutas ito bilang ganap na pagsunod.
- source_word: כִּי אִם
  choice: sa halip
  rationale: Ipinakikilala ng parirala ang paghahambing na “hindi X, kundi Y”; malinaw at likas sa makabagong Tagalog ang “sa halip.”
- source_word: כְּמִשְׁפָּטָם
  choice: ayon sa ... kaugalian
  rationale: Ang מִשְׁפָּט ay maaaring tumukoy sa tuntunin, ordinansa, o nakaugaliang gawain. Sa konteksto, ang “kaugalian” ay angkop sa kanilang dati at matatag nang paraan ng pagsamba.
- source_word: הָרִאשׁוֹן
  choice: dati nilang
  rationale: Tinutukoy ng pang-uri ang nauna nilang paraan o nakaugaliang gawain; natural sa Tagalog ang “dati nilang.”
- source_word: הֵם עֹשִׂים
  choice: patuloy nilang ginagawa
  rationale: Ang participial na anyo ay nagpapahiwatig ng nagpapatuloy o nakagawiang pagkilos, na malinaw na naihahatid ng “patuloy nilang ginagawa.”
