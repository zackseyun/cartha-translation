base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: tl
  text: Pagkatapos, nag-utos ang hari ng Asiria, “Dalhin ninyo roon[a] ang isa sa mga paring ipinatapon ninyo mula roon.[b] Hayaan siyang pumunta at manirahan doon,[c] at ituro niya sa kanila ang tuntunin[d] ng diyos ng lupain.”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ipadala ninyo roon” o “Papuntahin ninyo roon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dineport ninyo mula roon.”
    reason: lexical_alternative
  - marker: c
    text: Maramihan ang anyo ng dalawang pandiwa sa Hebreo—“pumunta sila” at “manirahan sila”—ngunit isahan ang malinaw na diwa dahil “isa sa mga pari” ang tinutukoy at isahan ang kasunod na “ituro niya.”
    reason: textual_variant
  - marker: d
    text: Maaari ring “kaugalian,” “batas,” o “kahingian.”
    reason: lexical_alternative
  - marker: e
    text: Maaari ring “Diyos ng lupain.” Sumasalamin ang maliit na titik sa “diyos” sa pananaw ng haring Asirio tungkol sa isang diyos ng teritoryo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: nag-utos
  rationale: Tuwirang ipinapahayag ang makapangyarihang utos ng hari at natural ito sa makabagong Filipino.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ang hari ng Asiria
  rationale: Likas na anyo sa Filipino para sa pamagat na nasa construct phrase sa Hebreo.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: Dalhin ninyo roon
  rationale: Ang Hiphil ng הלך ay ‘papuntahin’ o ‘dalhin/ipadala.’ Ang ‘dalhin ninyo roon’ ay malinaw na utos ng paglilipat ngunit pinananatili sa talababa ang posibleng ‘ipadala.’
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: ang isa sa mga pari
  rationale: Natural at tumpak na salin ng partitive construction.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: ipinatapon ninyo mula roon
  rationale: Ang Hiphil ng גלה ay tumutukoy sa sapilitang pagpapatapon o deportasyon; ang ‘ipinatapon’ ay dignificado at madaling maunawaan.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: Pumunta siya at manirahan doon
  rationale: Isahan ang ginamit ayon sa malinaw na diwa ng ‘isa sa mga pari’ at ng kasunod na pandiwang isahan, habang itinatala sa talababa ang maramihang anyo sa Hebreo.
- source_word: וְיֹרֵם
  choice: at ituro niya sa kanila
  rationale: Ipinahahayag ng Hiphil ng ירה ang pagtuturo o pagbibigay-tagubilin; lantad din sa salin ang maramihang layon na ‘sa kanila.’
- source_word: מִשְׁפַּט
  choice: ang tuntunin
  rationale: Maaaring mangahulugan ng batas, kahingian, kaugalian, o itinakdang paraan. Ang ‘tuntunin’ ay sapat na malawak at angkop sa kontekstong panrelihiyon nang hindi ito ginagawang tiyak na kodigong legal.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: ang diyos ng lupain
  rationale: Ang maliit na titik sa ‘diyos’ ay sumasalamin sa pananaw ng haring Asirio tungkol sa isang diyos na nakaugnay sa teritoryo, habang kinikilala sa talababa ang alternatibong pagbasa.
theological_decisions:
- issue: Paglalagay ng malaking titik sa אֱלֹהֵי הָאָרֶץ
  choice: ang diyos ng lupain
  alternative: ang Diyos ng lupain
  rationale: Inilalahad ng pananalita ang palagay ng haring Asirio na may diyos na sakop o kaugnay ng isang lupain. Pinananatili ng maliit na titik ang pananaw ng nagsasalita nang hindi ipinapasiya sa salin ang pagkakakilanlan ng tinutukoy.
- issue: Hindi pagtutugma ng bilang sa וְיֵלְכוּ / וְיֵשְׁבוּ at sa isahang antecedent at kasunod na וְיֹרֵם
  choice: 'Isahang diwa: “Pumunta siya at manirahan doon”'
  alternative: 'Pormal na maramihan: “Pumunta sila at manirahan doon”'
  rationale: Ang tahasang antecedent ay ‘isa sa mga pari,’ at isahan ang kasunod na pandiwa para sa pagtuturo. Ang isahang salin ang pinakamalinaw na diwa, ngunit hindi ikinukubli ang kakaibang maramihang anyo sa Hebreo kaya itinatala ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Asiria,” “pari,” “ipinatapon,” at “tuntunin” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong pangkasaysayan. Iniwasan ang labis na arkaikong “pumaroon” at ang masyadong interpretibong “paraan ng pagsamba.”
