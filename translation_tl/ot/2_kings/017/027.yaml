  to: Pagkatapos, nag-utos ang hari ng Asiria, “Dalhin ninyo roon[a] ang isa sa mga paring ipinatapon ninyo mula roon.[b] Hayaan siyang pumunta at manirahan doon,[c] at ituro niya sa kanila ang tuntunin[d] ng diyos ng lupain.”[e]
