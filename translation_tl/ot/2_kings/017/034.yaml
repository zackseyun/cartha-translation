  to: Hanggang sa araw na ito, sinusunod pa rin nila ang mga dating kaugalian[a]. Hindi sila natatakot kay Yahweh[b], at hindi sila sumusunod sa kanilang mga tuntunin at mga batas, ni sa kautusan at utos na iniutos ni Yahweh sa mga anak ni Jacob[c], na pinangalanan niyang Israel[d].
