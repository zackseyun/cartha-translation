  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: tl
  text: Hanggang sa araw na ito, sinusunod pa rin nila ang mga dating kaugalian[a]. Hindi sila natatakot kay Yahweh[b], at hindi sila sumusunod sa kanilang mga tuntunin at mga batas, ni sa kautusan at utos na iniutos ni Yahweh sa mga anak ni Jacob[c], na pinangalanan niyang Israel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa mga dating tuntunin” o “ayon sa mga dating gawain.”
    reason: lexical_alternative
  - marker: b
    text: Ang “natatakot kay Yahweh” ay maaari ring ipahayag na “gumagalang kay Yahweh nang may pagpipitagan.” Saklaw ng idyomang Hebreo ang pangamba at ang mapitagang katapatan sa tipan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga anak ni Jacob”; sama-sama itong tumutukoy sa bayang nagmula kay Jacob.
    reason: lexical_alternative
  - marker: d
    text: Ibig sabihin, si Jacob; ihambing sa Genesis 32:28 at 35:10.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: sinusunod pa rin nila ang dati nilang mga kaugalian
  rationale: Sa konteksto, ang מִשְׁפָּטִים ay tumutukoy sa nakagawiang mga gawaing panrelihiyon na inilarawan sa naunang talata, hindi lamang sa mga pasiyang legal. Likas sa makabagong Tagalog ang pandiwang “sinusunod” para sa pagkilos ayon sa gayong kaugalian.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: may takot kay Yahweh
  rationale: Pinananatili nito ang biblikal na idyoma ng pagkatakot sa Diyos, na maaaring maglaman kapuwa ng pangamba at mapitagang katapatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang ipinahihiwatig ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: ayon sa kanilang mga tuntunin at mga batas
  rationale: Ang “mga tuntunin” ay nagpapahayag ng takda o permanenteng alituntunin, samantalang ang “mga batas” ay angkop sa legal at pangtipang diwa ng katambal nitong salita. Pinananatili ng “kanilang” ang tahasang panghalip ng Hebreo nang hindi nilulutas ang posibleng sanggunian nito.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: ni ayon sa kautusan at utos
  rationale: Ang “kautusan” ay natural na salin ng תּוֹרָה sa pangtipang konteksto, at pinananatili ng “utos” ang isahang bilang ng מִצְוָה. Ang “ni” ay malinaw na nagdurugtong sa mga pamantayang hindi nila sinusunod.
- source_word: בְּנֵי יַעֲקֹב
  choice: mga anak ni Jacob
  rationale: Ang “mga anak” ay likas na Tagalog para sa Hebreong konstruksiyon at maaari ring tumukoy sa mga inapo ni Jacob bilang isang buong bayan.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: na pinangalanan niyang Israel
  rationale: Malinaw at idyomatikong ipinapahayag nito ang pagbibigay ng Diyos ng pangalang Israel kay Jacob.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na halinhan ito ng titulo.
- issue: Sanggunian ng “kanilang mga tuntunin at mga batas”
  choice: Panatilihin ang panghalip na “kanilang” nang hindi tahasang tinutukoy ang may-ari
  alternative: Tahasan itong ipakahulugang mga tuntunin ng mga bayan, o mga tuntunin ni Yahweh
  rationale: Pangatlong panauhang maramihan ang mga hulapi sa Hebreo. Bagaman maaaring ipahiwatig ng konteksto ang mga pamantayan ng mga taong inilalarawan, mas tapat na panatilihin ang gramatikal na anyo at ang natitirang kalabuan.
- issue: Diwa ng “pagkatakot kay Yahweh”
  choice: may takot kay Yahweh
  alternative: gumagalang kay Yahweh
  rationale: Pinananatili ng tradisyonal na idyoma ang tensiyon sa pagitan ng takot, pagpipitagan, at pangtipang katapatan sa halip na paliitin ito sa paggalang lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang legal at pangtipang himig sa “mga tuntunin,” “mga batas,” “kautusan,” at “utos,” habang iniwasan ang labis na teknikal o makalumang pananalita.
