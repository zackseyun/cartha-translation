revisions:
- from: Ngunit ang bawat bansa ay patuloy na gumagawa ng sarili nitong mga diyos. Inilagay nila ang mga iyon sa mga dambana sa matataas na lugar na ginawa ng mga taga-Samaria[a]—ginawa ito ng bawat bansa sa mga lungsod na kanilang tinitirhan.
  to: Ngunit ang bawat bansa ay patuloy na gumawa ng sarili nitong mga diyos, at inilagay ng bawat bansa ang mga ito sa mga santuwaryo sa matataas na lugar na ginawa ng mga taga-Samaria[a], sa mga lunsod na tinitirhan nila.
  rationale: Pinalitan ang “mga dambana” ng “mga santuwaryo” upang katawanin ang mga estrukturang sambahan, hindi lamang mga altar. Inayos ang sintaks upang malinaw na ang bawat bansa ang naglagay ng sarili nitong mga diyos sa mga lunsod na tinitirhan nito. Pinanatili ang “mga taga-Samaria” at ang talababa upang maipakita ang alternatibong “mga Samaritano” nang hindi ipinapasok ang mas huling sektaryong kahulugan sa pangunahing teksto.
