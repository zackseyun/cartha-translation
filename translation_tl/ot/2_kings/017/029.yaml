base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: tl
  text: Ngunit ang bawat bansa ay patuloy na gumawa ng sarili nitong mga diyos, at inilagay ng bawat bansa ang mga ito sa mga santuwaryo sa matataas na lugar na ginawa ng mga taga-Samaria[a], sa mga lunsod na tinitirhan nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Samaritano.”
    reason: Alternatibong salin ng katawagang Hebreo para sa mga taong nauugnay sa Samaria.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: patuloy na gumagawa
  rationale: Ang היה kasama ng participle ay nagpapahayag ng nagpapatuloy o nakaugaliang kilos sa salaysay na nasa nakaraan; likas itong naipahahayag sa Filipino sa pamamagitan ng “patuloy na gumagawa.”
- source_word: גּוֹי גּוֹי
  choice: ang bawat bansa
  rationale: 'Ang pag-uulit ay distributibo: magkakahiwalay na kumilos ang bawat pangkat ng mga taong inilipat sa Samaria.'
- source_word: אֱלֹהָיו
  choice: sarili nitong mga diyos
  rationale: Tinutukoy ng hulaping panghalip ang bawat bansa bilang kolektibong isahan, at pinananatili ng “sarili nitong” ang pagkakaiba-iba ng kanilang mga diyos.
- source_word: וַיַּנִּיחוּ
  choice: inilagay nila
  rationale: Tuwirang ipinahahayag nito ang paglalagay o paglalagak ng mga diyos sa mga gusaling panrelihiyon.
- source_word: בְּבֵית הַבָּמוֹת
  choice: sa mga dambana sa matataas na lugar
  rationale: Ang parirala ay tumutukoy sa mga gusali o dambanang kaugnay ng mga kultikong “matataas na lugar”; malinaw at likas ang salin habang iniiwasan ang literal ngunit malabong “bahay ng matataas na lugar.”
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: na ginawa ng mga taga-Samaria
  rationale: Tuwirang tumutukoy ito sa mga taong nauugnay sa Samaria sa kontekstong pangkasaysayan, nang hindi ipinapalagay ang mas huling sektaryong kahulugan ng “mga Samaritano.”
- source_word: בְּעָרֵיהֶם
  choice: sa mga lungsod
  rationale: Malinaw na ang mga lungsod ay yaong tinitirhan ng bawat bansa dahil sa kasunod na sugnay; hindi na kailangang ulitin ang panghalip na paari.
- source_word: אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: na kanilang tinitirhan
  rationale: Likas na Filipino ito para sa sugnay na naglalarawan sa mga lugar ng kanilang paninirahan.
theological_decisions:
- issue: Pagpapakahulugan sa הַשֹּׁמְרֹנִים
  choice: mga taga-Samaria
  alternative: mga Samaritano
  rationale: Iniiwasan ng “mga taga-Samaria” ang pagpasok ng mas huling sektaryong kahulugan na hindi hinihingi ng konteksto, habang pinananatili sa talababa ang mas tuwirang katawagan bilang posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dambana sa matataas na lugar” bilang madaling maunawaang katawagan sa gusaling panrelihiyon na kaugnay ng mga lokal na kultikong mataas na lugar. Inilipat ang panandang [a] sa “mga taga-Samaria,” sapagkat doon talaga nauukol ang alternatibong salin.
