id: 2KI.17.2
reference: 2 Kings 17:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh, ngunit[a] hindi gaya ng mga hari ng Israel na nauna sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lamang, hindi gaya ng mga hari ng Israel na nauna sa kanya.” Maaaring isalin nang mas literal na “lamang” ang Hebreong kataga, na nagpapasok ng isang paglilinaw o limitasyon sa paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagsasalaysay ng ginawa ng paksa. Likas sa Tagalog ang “Ginawa niya” nang hindi na isinasalin nang hiwalay ang panimulang וַ־.
- source_word: הָרַע
  choice: ang masama
  rationale: 'Substantibo ang gamit ng pang-uring may pantukoy: “ang masama.” Natural ito sa makabagong Tagalog at pinananatili ang pormulang paghatol sa mga hari.'
- source_word: בְּעֵינֵי
  choice: sa paningin ni
  rationale: Pinananatili nito ang Hebreong larawang tumutukoy sa pagtatasa mula sa pananaw ng isang tao, at malinaw rin ito sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: רַק
  choice: ngunit
  rationale: Dito, nililimitahan o nililinaw ng רַק ang naunang negatibong paghatol sa pamamagitan ng paghahambing. Natural na naipahahayag ng “ngunit” ang salungat na diwa, habang itinatala sa talababa ang mas literal na “lamang.”
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: hindi gaya ng mga hari ng Israel
  rationale: Malinaw nitong inililipat ang paghahambing na may negasyon sa כְּ nang hindi dinaragdagan ang kahulugan.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: na nauna sa kanya
  rationale: Ang literal na “nasa harap niya” ay idyomang tumutukoy sa mga naunang hari. Mas natural at malinaw sa Tagalog ang “na nauna sa kanya.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Lakas ng paghahambing sa kasamaan ni Hosea
  choice: ngunit hindi gaya ng mga hari ng Israel na nauna sa kanya
  alternative: lamang, hindi gaya ng mga hari ng Israel na nauna sa kanya
  rationale: Ipinahihiwatig ng רַק na may limitasyon o kwalipikasyon ang paghatol. Hindi tinutukoy ng talata kung paano o hanggang saan naiiba ang kanyang kasamaan, kaya hindi iyon ipinapaliwanag nang higit sa sinabi ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pamilyar na idyomang “sa paningin ni” at iniwasan ang sobrang literal ngunit alanganing “nasa harap niya.” Inilagay ang talababa sa “ngunit,” ang salitang aktuwal na kaugnay ng alternatibong pagbasa.
