  source_fidelity: 'Tapat ang salin sa Hebreo: malinaw nitong pinagsasabay ang pagkatakot kay Yahweh at ang patuloy na paglilingkod sa kanilang mga larawang inukit, nang hindi hinahatulan o ipinapaliwanag ang uri ng kanilang pagkatakot. Naipapahayag din ang pagpapatuloy ng gawaing ito sa mga anak at apo hanggang sa panahon ng manunulat.'
