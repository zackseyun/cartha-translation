base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: tl
  text: 'Kaya ang mga bansang ito ay may takot kay Yahweh, ngunit patuloy rin nilang pinaglilingkuran ang kanilang mga larawang inukit.[a] Gayundin ang kanilang mga anak at mga apo: kung ano ang ginawa ng kanilang mga ninuno, iyon din ang patuloy nilang ginagawa hanggang sa araw na ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang mga diyos-diyosan.” Ang salitang Hebreo ay partikular na tumutukoy sa mga imaheng ginawa sa pag-ukit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַגּוֹיִם הָאֵלֶּה
  choice: Kaya ang mga bansang ito ay
  rationale: Ang “kaya” ay angkop sa pangwakas at nagbubuod na puwersa ng waw-consecutive; ang גּוֹיִם ay tumutukoy sa mga dayuhang pangkat na nanirahan sa Samaria.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: may takot kay Yahweh
  rationale: Pinananatili nito ang panrelihiyong diwa ng ירא at ang personal na pangalang Yahweh, nang hindi ipinapalagay kung taos-puso o panlabas lamang ang kanilang pagkatakot.
- source_word: וְאֶת פְּסִילֵיהֶם
  choice: ngunit ... ang kanilang mga larawang inukit
  rationale: Ang פְּסִילִים ay partikular na mga imaheng ginawa sa pag-ukit. Ipinahihiwatig ng “ngunit ... rin” ang kapansin-pansing pagsasabay ng pagkatakot kay Yahweh at paglilingkod sa mga imahen.
- source_word: הָיוּ עֹבְדִים
  choice: patuloy rin nilang pinaglilingkuran
  rationale: Ang periphrastic na anyo ay nagsasaad ng nakagawian o nagpapatuloy na gawain. Ang “pinaglilingkuran” ay nagpapanatili sa malawak na kultikong diwa ng עבד.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: Gayundin ang kanilang mga anak at mga apo
  rationale: Sa pormulang ito ng pagpapatuloy ng mga salinlahi, ang בנים ay tumutukoy sa mga inapo; natural sa modernong Filipino ang “mga anak at mga apo.”
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים
  choice: kung ano ang ginawa ng kanilang mga ninuno, iyon din ang patuloy nilang ginagawa
  rationale: Pinananatili ang paghahambing at ang duratibong diwa ng participle עֹשִׂים. Mas likas sa Filipino ang “mga ninuno” kaysa literal na “mga ama” sa kontekstong pangsalinlahi.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Ito ang malinaw at marangal na katumbas ng karaniwang Hebreong pormulang temporal.
theological_decisions:
- issue: Ang pagsasabay ng pagkatakot kay Yahweh at paglilingkod sa mga imahen
  choice: “may takot kay Yahweh, ngunit patuloy rin nilang pinaglilingkuran ang kanilang mga larawang inukit”
  alternative: “nagkunwari silang may takot kay Yahweh habang sumasamba sa mga diyos-diyosan”
  rationale: Magkasabay na inilalahad ng Hebreo ang dalawang gawain at hindi nito tiyak na hinahatulan kung ang takot ay taos-puso, sinkretistiko, o panlabas lamang. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “may takot kay Yahweh” upang maging natural habang pinananatili ang panrelihiyong idyoma; ginamit ang “patuloy” upang maipakita ang nakagawian at nagpapatuloy na kilos.
