base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: tl
  text: Kaya itinakwil ni Yahweh ang lahat ng supling ng Israel[a]. Pinahirapan niya sila at ibinigay sa kamay ng mga mandarambong[b], hanggang sa itinaboy niya sila mula sa kanyang presensya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng mga inapo ng Israel”; literal na “lahat ng binhi ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “ipinaubaya sa kapangyarihan ng mga mandarambong.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “mula sa harapan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: itinakwil
  rationale: Ipinahahayag ng מָאַס ang matibay na pagtanggi o pagtatakwil, lalo na sa konteksto ng tipan at paghatol. Ang “itinakwil” ay natural at mariin nang hindi kinakailangang magdagdag ng diwang emosyonal ng pagkamuhi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: ang lahat ng lahi ng Israel
  rationale: Ang זֶרַע ay literal na “binhi” at maaaring tumukoy sa supling, lahi, o mga inapo. Ang “lahi” ay natural na kolektibong katawagan sa Filipino at hindi nililimitahan ang saklaw nang higit sa sinasabi ng Hebreo.
- source_word: וַיְעַנֵּם
  choice: pinahirapan niya sila
  rationale: Sa Piel, ang ענה ay maaaring mangahulugang pahirapan, apihin, o ibaba. Ang “pinahirapan” ay angkop sa malawak na diwa ng pagdurusa sa ilalim ng paghatol.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: ibinigay sa kamay ng
  rationale: Pinananatili nito ang malinaw na idyomang Hebreo ng pagsasailalim sa kapangyarihan ng iba, habang nauunawaan pa rin sa Filipino.
- source_word: שֹׁסִים
  choice: mga mandarambong
  rationale: Tumutukoy ang participle sa mga nananamsam o nangunguha ng ari-arian sa pamamagitan ng karahasan. Ang “mga mandarambong” ay malinaw at kasalukuyang Filipino.
- source_word: עַד אֲשֶׁר
  choice: hanggang sa
  rationale: Likas na ipinahahayag ng “hanggang sa” ang hangganan o kinalabasan ng naunang mga pagkilos.
- source_word: הִשְׁלִיכָם
  choice: itinaboy niya sila
  rationale: Literal na nangangahulugang ihagis o itapon ang השליך, ngunit sa kontekstong ito ay tumutukoy sa marahas na pagpapaalis. Ang “itinaboy” ay natural at pinananatili ang lakas ng larawan.
- source_word: מִפָּנָיו
  choice: mula sa kanyang presensya
  rationale: Literal itong “mula sa harapan niya,” isang idyoma para sa pag-aalis mula sa presensya ng isang tao. Malinaw sa Filipino ang napiling salin, samantalang itinatala sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng “lahat ng lahi ng Israel”
  choice: Panatilihin ang malawak at kolektibong pananalita
  alternative: Tukuyin lamang ang hilagang kaharian o ipakahulugang walang pasubaling bawat etnikong inapo ni Jacob
  rationale: Sinasabi ng Hebreo na “lahat ng binhi/lahi ng Israel.” Bagaman may tiyak na kontekstong pangkasaysayan, hindi dapat lutasin ng salin ang saklaw nang higit sa tahasang sinasabi ng teksto.
- issue: Kahulugan ng pagtataboy mula sa presensya ng Diyos
  choice: mula sa kanyang presensya
  alternative: mula sa harapan niya o mula sa kanyang paningin
  rationale: Pinananatili nito ang relasyonal at hudisyal na bigat ng pagpapaalis, nang hindi ipinapakahulugang hindi na sila literal na makikita ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling sugnay upang maging natural ang sunod-sunod na kilos sa Hebreo, habang pinanatili ang lakas ng paghatol at ang hindi ganap na nilutas na saklaw ng “Israel.”
