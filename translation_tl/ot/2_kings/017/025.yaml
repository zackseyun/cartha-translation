base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: tl
  text: Sa simula ng kanilang paninirahan doon, hindi sila natakot kay Yahweh[a]. Kaya nagpadala si Yahweh ng mga leon sa gitna nila, at patuloy na pumapatay ang mga leon ng ilan sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi nila iginalang si Yahweh.” Ang Hebreong “matakot” ay maaari ring tumukoy sa pagpipitagan at pagkilalang nararapat kay Yahweh, hindi lamang sa sindak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: Nang pasimula silang manirahan doon
  rationale: Ipinapahayag nito ang unang yugto ng paninirahan nila roon, habang ginagawang natural sa modernong Tagalog ang Hebreong pariralang nominal.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: natakot kay Yahweh
  rationale: Pinananatili ang pangunahing larawan ng ירא. Maaaring saklaw nito rito ang pagpipitagan at pagkilala kay Yahweh, kaya nililinaw sa talababa ang mas malawak na diwa nang hindi ito ipinapalit sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיְשַׁלַּח יְהוָה בָּהֶם אֶת הָאֲרָיוֹת
  choice: nagpadala si Yahweh ng mga leon sa gitna nila
  rationale: Ang “sa gitna nila” ay natural na nagsasaad na ipinadala ang mga leon sa kanilang kinaroroonan, nang hindi pinaiigting ang pang-ukol bilang tahasang “laban sa kanila.”
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: patuloy na pinapatay ng mga iyon ang ilan sa kanila
  rationale: Ipinakikita ng “patuloy” ang nagpapatuloy o nauulit na kilos ng היה kasama ang participle. Ipinahihiwatig ng “ang ilan sa kanila” ang partitive na diwa nang hindi sinasabing napatay silang lahat.
theological_decisions:
- issue: Diwa ng pagkatakot kay Yahweh
  choice: hindi sila natakot kay Yahweh
  alternative: hindi sila nagpahalaga o gumalang kay Yahweh
  rationale: Pinananatili ng salin ang tunay na leksikal at teolohikal na tensiyon ng “takot,” na maaaring tumukoy kapuwa sa pagkatakot at mapitagang pagkilala, sa halip na paliitin ito sa pagsamba lamang.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang ayos ng pangungusap at iniwasan ang labis na makaluma o denominasyonal na pananalita. Inilagay ang talababa sa mismong pariralang “natakot kay Yahweh,” na siyang salitang nililinaw nito.
