base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: tl
  text: Sa halip, si Yahweh na inyong Diyos ang dapat ninyong katakutan, at ililigtas niya kayo mula sa kamay[a] ng lahat ng inyong mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kamay ng lahat ng inyong mga kaaway,” isang idyomang nangangahulugang mula sa kanilang kapangyarihan o kontrol.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Ipinapahayag ng parirala ang mariing pagsalungat sa naunang pagbabawal na matakot sa ibang mga diyos. Likas sa Filipino ang “Sa halip” at naipakikita nito ang eksklusibong pagtutuon kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maaaring anyong maramihan ang אֱלֹהִים, malinaw na iisang Diyos ang tinutukoy sapagkat nakaugnay ito kay Yahweh.
- source_word: תִּירָאוּ
  choice: ang dapat ninyong katakutan
  rationale: Taglay ng ירא sa kontekstong ito ang takot na may paggalang at katapatan. Pinananatili ng “katakutan” ang bigat ng salitang Hebreo, samantalang ipinahahayag ng “dapat” ang lakas nitong gaya ng utos.
- source_word: וְהוּא
  choice: at ... niya
  rationale: Ang tahasang panghalip sa Hebreo ay likas na naipahahayag sa Filipino sa “niya”; ang tinutukoy ay malinaw na si Yahweh.
- source_word: יַצִּיל
  choice: ililigtas
  rationale: Ang Hiphil ng נצל ay nangangahulugang magligtas o humango mula sa panganib o kapangyarihan ng kaaway.
- source_word: מִיַּד
  choice: mula sa kamay
  rationale: Pinananatili ang larawang Hebreo na “kamay,” na tumutukoy sa kapangyarihan o kontrol; nililinaw ito sa talababa.
- source_word: כָּל אֹיְבֵיכֶם
  choice: ng lahat ng inyong kaaway
  rationale: Tuwirang ipinapahayag nito ang kabuuang saklaw ng כָּל kasama ng pangmaramihang “mga kaaway” na ipinahihiwatig ng anyong Hebreo.
theological_decisions:
- issue: Paglalarawan sa pagkatakot kay Yahweh
  choice: katakutan
  alternative: igalang
  rationale: Ang “igalang” lamang ay maaaring magpahina sa lawak at bigat ng ירא. Ang “katakutan” ay nagpapanatili sa tunay na tensiyon ng takot at pagpipitagan sa konteksto ng tipan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang ayos na “si Yahweh ... ang dapat ninyong katakutan” ay nagpapanatili sa diin ng Hebreo kay Yahweh bilang tanging dapat katakutan. Inilagay ang marker [a] sa “kamay,” ang mismong pariralang ipinaliliwanag ng talababa.
