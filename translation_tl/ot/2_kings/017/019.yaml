  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: tl
  text: Maging ang Juda[a] ay hindi tumupad sa mga utos ni Yahweh na kanilang Diyos, kundi namuhay ayon sa mga tuntuning ginawa ng Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Gayundin ang Juda”; idiniriin ng pambungad na kataga na ang Juda, gaya ng Israel, ay nagkasala rin.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “sumunod sa mga tuntunin ng Israel” o “namuhay ayon sa mga kaugaliang ginawa ng Israel.”'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Maging
  rationale: Ipinakikita ng nauunang kataga na hindi lamang ang Israel kundi pati ang Juda ay nagkasala; natural na naihahatid ng “maging” ang diin nito sa Filipino.
- source_word: יְהוּדָה
  choice: ang Juda
  rationale: Karaniwang anyong Filipino ng pangalan ng kaharian sa timog.
- source_word: שָׁמַר
  choice: tumupad
  rationale: Sa kontekstong tipan at kautusan, tumutukoy ito sa maingat na pagsunod o pagtupad sa mga utos; mas natural dito ang “tumupad” kaysa literal na “nag-ingat.”
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Pinananatili ang legal at pangtipang diwa sa malinaw at kasalukuyang Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: Pinananatili ang pangmaramihang hulaping Hebreo; ang Juda ay kolektibong kumakatawan sa mga mamamayan nito.
- source_word: וַיֵּלְכוּ
  choice: kundi namuhay
  rationale: Ang הלך na may ב ay metaporang tumutukoy sa asal o pamumuhay ayon sa isang huwaran. Ipinahahayag ng “kundi” ang malinaw na pagsalungat sa hindi pagtupad sa mga utos.
- source_word: בְּחֻקּוֹת
  choice: ayon sa mga tuntunin
  rationale: Ang חֻקּוֹת ay maaaring mangahulugang mga batas, itinakdang tuntunin, o kaugalian. Ang “mga tuntunin” ay nagpapanatili sa legal-relihiyosong diwa nang hindi tunog-luma.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Tumutukoy sa konteksto sa kaharian sa hilaga; ginagamit ang karaniwang anyong Filipino ng pangalan.
- source_word: אֲשֶׁר עָשׂוּ
  choice: ginawa ng Israel
  rationale: Maaaring ang kolektibong Israel ang paksa ng pangmaramihang pandiwa. Ginagawang tahasan ang paksa para sa linaw, habang hindi ikinukubli na maaari ring tumukoy ang parirala sa pagsasagawa o pagtatatag ng mga tuntunin.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang tuwirang nasa Hebreo; pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
- issue: Paksa at kahulugan ng עָשׂוּ sa sugnay na may kaugnayan
  choice: ginawa ng Israel
  alternative: na kanilang isinagawa; na itinatag nila
  rationale: Pangmaramihan ang pandiwa at maaaring ituring ang Israel bilang kolektibong paksa. Ang konteksto ay naghahambing sa Juda at Israel, kaya malinaw ngunit hindi doktrinal na dagdag ang pagtukoy sa Israel; inilalahad sa talababa ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “namuhay ayon sa” upang likas na maipahayag ang Hebreong metapora ng paglakad bilang asal, habang pinananatili sa talababa ang mga posibleng legal at pangkaugalian na pagbasa sa חֻקּוֹת at עָשׂוּ.
