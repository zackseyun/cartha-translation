id: 2KI.17.7
reference: 2 Kings 17:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: tl
  text: Nangyari ito sapagkat nagkasala ang mga anak ni Israel kay Yahweh na kanilang Diyos, na nag-ahon sa kanila mula sa lupain ng Ehipto, mula sa ilalim ng kamay ng Faraon na hari ng Ehipto[a], at natakot sila sa ibang mga diyos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa kapangyarihan ng Faraon.” Literal sa Hebreo: “mula sa ilalim ng kamay ng Faraon.”'
    reason: lexical_alternative
  - marker: b
    text: O “sumamba sila sa ibang mga diyos.” Ang Hebreo ay literal na “natakot sa ibang mga diyos,” gamit ang pandiwang maaari ring mangahulugang pagpipitagan o debosyong ipinakikita sa pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Nangyari ito sapagkat
  rationale: Ipinahahayag ng parirala ang paliwanag na sanhi ng naunang pangyayari. Ang salin ay likas sa makabagong Tagalog at pinananatili ang puwersang sanhi ng כִּי.
- source_word: חָטְאוּ
  choice: nagkasala
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagkakasala; ang aspektong naganap ay angkop sa paliwanag na pagbabalik-tanaw ng talata.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal at tipanang katawagang 'mga anak ni Israel' sa paraang malinaw pa rin sa Tagalog.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: kay Yahweh na kanilang Diyos
  rationale: Sa kasamang pandiwang חטא, ipinakikita ng ל ang pinagtutuunan ng pagkakasala. Pinananatili ang pangalang tipan na Yahweh at ang kaugnayang 'kanilang Diyos.'
- source_word: הַמַּעֲלֶה אֹתָם
  choice: na nag-ahon sa kanila
  rationale: Ang participle ay naglalarawan kay Yahweh ayon sa kanyang pagliligtas. Ang 'nag-ahon' ay pinananatili ang pataas na larawan ng עלה nang hindi nagiging mabigat ang Tagalog.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Malinaw at pormal na katumbas ng heograpikong parirala.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: mula sa ilalim ng kamay ng Faraon
  rationale: Pinananatili sa pangunahing teksto ang larawang Hebreo ng kamay bilang kapangyarihan o paghahari; ipinaliliwanag sa talababa ang likas na kahulugan nito.
- source_word: וַיִּירְאוּ
  choice: at natakot sila
  rationale: Pinananatili ang ubod na kahulugan ng ירא, 'matakot.' Sa konteksto, maaari rin itong tumukoy sa paggalang na nauuwi sa pagsamba, ngunit hindi iyon tahasang ipinapalit sa pangunahing teksto.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang katumbas ito ng parirala at pinananatili ang wikang ginagamit sa pagbabawal na tipan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Ang 'Yahweh' ay tuwirang transliterasyon na pinananatili ang pagkakakilanlang tipan nang hindi gumagamit ng kapalit na titulo.
- issue: Kahulugan ng pagkatakot sa ibang mga diyos
  choice: natakot sila sa ibang mga diyos
  alternative: sumamba sila sa ibang mga diyos; nagpitagan sila sa ibang mga diyos
  rationale: Ang ירא ay literal na tumutukoy sa pagkatakot o pagpipitagan at maaari, sa ganitong konteksto, na magsangkot ng debosyong panrelihiyon. Pinananatili ng pangunahing salin ang sadyang lawak ng salita, habang inilalahad sa talababa ang posibleng kahulugang pagsamba.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang tradisyonal na katawagang “mga anak ni Israel,” ang pangalang “Yahweh,” at ang mga larawang “nag-ahon” at “sa ilalim ng kamay” upang hindi mapawi ang kulay ng tekstong Hebreo. Ang mga posibleng mas interpretibong pagbasa ay inilagay sa mga talababa.
