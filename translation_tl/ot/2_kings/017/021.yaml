source:
  edition: WLC
  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: tl
  text: Sapagkat inihiwalay niya ang Israel mula sa sambahayan ni David, at ginawa nilang hari si Jeroboam, na anak ni Nebat. Itinaboy ni Jeroboam ang Israel palayo sa pagsunod kay Yahweh[a] at ipinagawa niya sa kanila ang isang malaking kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iniligaw ni Jeroboam ang Israel upang hindi sumunod kay Yahweh.” Ang pandiwang Hebreo ay maaaring mangahulugang pagtataboy palayo o pagliligaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  choice: kumalas
  rationale: Karaniwang nangangahulugang “punitin” o “paghiwalayin” ang pandiwa. Sa kontekstong pampolitika, ang “kumalas” ay likas sa makabagong Tagalog at pinananatili ang diwa ng marahas o tahasang paghiwalay ng Israel sa paghahari ng sambahayan ni David.
- source_word: מֵעַל בֵּית דָּוִד
  choice: sa sambahayan ni David
  rationale: Ipinapahayag ng parirala ang paghiwalay sa dinastikong kapangyarihan ni David. Ang “sambahayan ni David” ay tumutukoy sa kaniyang angkan o dinastiya, hindi lamang sa isang gusali.
- source_word: וַיַּמְלִיכוּ
  choice: ginawa nilang hari
  rationale: Ang Hiphil ng מלך ay nagsasaad ng paglalagay o pagtatalaga sa isang tao bilang hari. Malinaw at natural sa Tagalog ang “ginawa nilang hari.”
- source_word: וַיַּדַּח
  choice: inilayo
  rationale: Maaaring tumukoy ang נדח sa pagtataboy palayo o pagliligaw. Pinananatili ng “inilayo” ang aktibong pananagutan ni Jeroboam nang hindi pinipili nang lubusan sa pagitan ng puwersahang pagtataboy at mapanlinlang na pagliligaw.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: sa pagsunod kay Yahweh
  rationale: Ang literal na idyomang “mula sa likuran ni Yahweh” ay nangangahulugang tumigil sa pagsunod sa kaniya. Ang “sa pagsunod kay Yahweh” ay malinaw at idiomatiko.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְהֶחֱטֵיאָם
  choice: ibinunsod niya silang gumawa
  rationale: Causative ang Hiphil ng חטא. Ipinakikita ng “ibinunsod niya silang gumawa” na si Jeroboam ang nagtulak sa Israel sa pagkakasala, habang iniiwasan ang mabigat na pag-uulit ng salitang “kasalanan.”
- source_word: חֲטָאָה גְדוֹלָה
  choice: isang malaking kasalanan
  rationale: Tuwirang pinananatili nito ang pangngalan at pang-uri ng Hebreo at ang diin sa bigat o laki ng pagkakasala.
theological_decisions:
- issue: Paglalarawan sa pananagutan ni Jeroboam at ng Israel
  choice: “Inilayo ni Jeroboam ... at ibinunsod niya silang gumawa”
  alternative: “Iniligaw ni Jeroboam ... at pinapagkasala sila”
  rationale: Pinananatili ng salin ang malinaw na causative agency ni Jeroboam at kasabay nito ang pagkilos ng Israel bilang mga gumagawa ng kasalanan. Hindi nito nilulutas nang higit sa Hebreo kung ang paraan niya ay pangunahing pagtataboy o pagliligaw.
- issue: Paglalapat ng יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; kaya pinanatili itong “Yahweh” upang huwag gawing titulo ang pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan ni David” para sa dinastiya at ang “kumalas” bilang natural na katumbas ng larawang pampolitika ng pagkapunit o paghihiwalay. Inilagay ang panandang [a] sa pariralang aktuwal na tinutukoy ng talababa.
