  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: tl
  text: Nakipagtipan si Yahweh sa kanila at iniutos sa kanila, “Huwag kayong matakot sa ibang mga diyos; huwag kayong yumukod sa kanila, huwag silang paglingkuran, at huwag kayong maghandog ng mga hain sa kanila.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: Nakipagtipan
  rationale: Ang Hebreong idyomang literal na ‘pumutol ng tipan’ ay natural at tumpak na ipinahahayag sa modernong Tagalog bilang ‘nakipagtipan.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיְצַוֵּם
  choice: iniutos sa kanila
  rationale: Tuwirang ipinahahayag nito ang pagbibigay ng utos, ayon sa pandiwang צוה.
- source_word: לֹא תִירְאוּ
  choice: Huwag kayong matakot
  rationale: Likas itong anyo ng mariing pagbabawal sa Tagalog. Pinananatili ang ‘matakot’ at hindi ginagawang ‘sumamba’ sapagkat hiwalay na binabanggit ang mga gawaing panrelihiyon sa kasunod na mga pandiwa.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang katumbas ng ‘other gods’ at angkop sa pananalita ng tipan.
- source_word: תִשְׁתַּחֲווּ
  choice: yumukod
  rationale: Pinananatili ang kongkretong kilos ng pagyukod sa halip na palawakin agad ito bilang ‘sumamba.’
- source_word: תַעַבְדוּם
  choice: paglingkuran
  rationale: Ipinapanatili ang pangunahing diwa ng עבד na ‘maglingkod’ at ang pagkakaiba nito sa pagyukod at paghahain.
- source_word: תִזְבְּחוּ לָהֶם
  choice: maghandog ng mga hain sa kanila
  rationale: Natural sa Tagalog at malinaw na tumutukoy sa paghahain bilang gawaing sakripisyal.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; ang ‘Yahweh’ ay nagpapanatili sa pangalan sa halip na gumamit ng pamalit na titulo.
- issue: Lakas ng mga pagbabawal sa pananalita ng tipan
  choice: Huwag kayong ...
  alternative: Hindi kayo dapat ...
  rationale: Ang paulit-ulit na ‘Huwag kayong’ ay natural, mariin, at marangal na paraan sa Tagalog upang ihatid ang mga pagbabawal na לֹא + imperfect, nang hindi nagpapabigat sa di-likas na legalistikong anyo.
- issue: Kahulugan ng ‘matakot’ sa ibang mga diyos
  choice: matakot
  alternative: sambahin / igalang
  rationale: Pinananatili ang leksikal at teolohikal na tensiyon ng ירא. Hindi ito tahimik na ipinapakahulugang ‘sumamba,’ lalo na't sumusunod ang magkakahiwalay na pagbabawal sa pagyukod, paglilingkod, at paghahain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘nakipagtipan’ bilang likas na katumbas ng Hebreong idyoma, at pinanatiling magkakahiwalay ang apat na ipinagbabawal na tugon sa ibang mga diyos.
