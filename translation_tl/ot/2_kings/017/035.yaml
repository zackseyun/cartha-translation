  source_fidelity: 'Tumpak na naihahatid ng salin ang buong Hebreong pahayag: ang pakikipagtipan ni Yahweh, ang utos sa kanila, at ang apat na magkakahiwalay na pagbabawal—matakot, yumukod, maglingkod, at maghandog ng hain sa ibang mga diyos. Hindi nito pinagsasama o pinalalabo ang magkakaibang pandiwa ng pagsamba.'
