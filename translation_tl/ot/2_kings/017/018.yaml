  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: tl
  text: Kaya't labis na nagalit si Yahweh sa Israel at inalis niya sila mula sa kanyang harapan[a]. Walang natira kundi ang lipi ni Juda lamang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa kanyang presensiya.” Mas literal sa Hebreo, “mula sa harap ng kanyang mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: labis na nagalit
  rationale: Ipinahahayag ng anyong pandiwa at ng מְאֹד ang matinding galit. Likas sa modernong Tagalog ang “labis na nagalit” at hindi nito dinaragdagan ang ipinahahayag ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Sa kasamang pandiwa ng pagkagalit, tinutukoy ng בְּ ang pinatutungkulan ng galit. Ang “sa Israel” ang malinaw at natural na katumbas sa Tagalog.
- source_word: וַיְסִרֵם
  choice: inalis niya sila
  rationale: Ang causative na anyo ng סור ay nagsasaad na pinapangyari silang umalis. Ang “inalis” ay tumpak at hindi tahasang nagdaragdag ng salitang “ipinatapon,” bagaman iyon ang konteksto.
- source_word: מֵעַל פָּנָיו
  choice: mula sa harap ng kanyang mukha
  rationale: Pinananatili ang kongkreto at antropomorpikong pananalita ng Hebreo. Inilalagay sa talababa ang mas idyomatikong “mula sa kanyang presensiya.”
- source_word: לֹא נִשְׁאַר
  choice: Walang natira
  rationale: Malinaw nitong ipinahahayag ang diwa ng niphal ng שׁאר, ang pananatili o pagkaiwan.
- source_word: רַק
  choice: kundi
  rationale: Kasunod ng negatibong pahayag, natural na ipinakikilala ng “kundi” ang tanging eksepsiyon.
- source_word: שֵׁבֶט יְהוּדָה
  choice: ang lipi ni Juda
  rationale: Ang “lipi” ay karaniwan at angkop na salin ng שֵׁבֶט kapag tumutukoy sa isang tribo ng Israel.
- source_word: לְבַדּוֹ
  choice: lamang
  rationale: Pinananatili nito ang pagbibigay-diin na ang Juda lamang ang natira, kahit na naipahiwatig na rin iyon ng “kundi.”
theological_decisions:
- issue: Antropomorpikong paglalarawan sa presensiya ng Diyos sa מֵעַל פָּנָיו
  choice: mula sa harap ng kanyang mukha
  alternative: mula sa kanyang presensiya
  rationale: Ang literal at kongkretong larawan ay bahagi ng teolohikal na himig ng teksto at hindi dapat tahimik na gawing abstrakto. Gayunman, inilalahad sa talababa ang natural na kahulugang idyomatiko.
- issue: Tinutukoy ng “Israel” sa konteksto
  choice: Hindi pinalawak sa salin; nananatiling “Israel” bilang hilagang kaharian o bayan sa agarang konteksto
  alternative: Israel bilang kabuuan ng bayang tipan
  rationale: Ang agarang konteksto ng 2 Hari 17 ay ang pagbagsak at pagpapatapon sa hilagang kaharian. Hindi nagdaragdag ang salin ng mas malawak na pagpapakahulugang hindi tahasang nasa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalan na “Yahweh,” ang kongkretong larawan ng “mukha,” at ang diin ng “kundi … lamang.”
