id: 2KI.17.24
reference: 2 Kings 17:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: tl
  text: Pagkatapos, nagdala ang hari ng Asiria ng mga tao mula sa Babilonia, Cuta, Ava[a], Hamat, at Sefarvaim. Pinatira niya sila sa mga lungsod ng Samaria kapalit ng mga Israelita.[b] Kinuha nila ang Samaria bilang pag-aari at nanirahan sa mga lungsod nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ava ay maaari ring baybayin na “Awa.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak na lalaki ng Israel”; maaari ring isalin na “bayan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: nagdala ... ng mga tao
  rationale: Ang Hiphil ng בוא ay nangangahulugang “nagdala” o “nagpapunta.” Walang tahasang layon sa Hebreo, ngunit malinaw sa konteksto na mga taong ililipat ang dinala; idinagdag ang “mga tao” para sa likas at malinaw na Tagalog.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ang hari ng Asiria
  rationale: Likas na salin ng construct phrase at karaniwang anyo sa Tagalog.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: mula sa Babilonia, Cuta, Ava, Hamat, at Sefarvaim
  rationale: Mga pangalan ito ng lugar kaya tinumbasan sa nakaugaliang anyong Filipino o tinransliterado mula sa Hebreo.
- source_word: וַיֹּשֶׁב
  choice: Pinatira niya sila
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil ng ישׁב: ang hari ang naglagay sa kanila roon upang manirahan.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: sa mga lungsod ng Samaria
  rationale: Pinananatili ang pangmaramihang עָרֵי. Dito, ang Samaria ay tumutukoy sa mas malawak na rehiyon, hindi lamang sa kabiserang lungsod.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: kapalit ng mga Israelita
  rationale: Ang תַּחַת ay “kapalit ng” o “sa halip ng.” Bagaman literal na “mga anak na lalaki ng Israel” ang בְּנֵי יִשְׂרָאֵל, isa itong pangkalahatang katawagang etniko kaya mas tumpak at likas dito ang “mga Israelita.”
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Inangkin nila ang Samaria
  rationale: Sa konteksto ng paglilipat at paninirahan, ang ירשׁ ay tumutukoy sa pagkuha o pag-angkin bilang pag-aari. Iniwasan ang “minana,” na maaaring magpahiwatig ng legal o teolohikal na mana na wala sa konteksto.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: at nanirahan sa mga lungsod nito
  rationale: Ang Qal ng ישׁב ay simpleng “manirahan.” Ang hulaping pambabaeng isahan ay tumutukoy pabalik sa Samaria.
theological_decisions:
- issue: Ang pangkasariang anyo ng katawagang etniko na בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ng Israel; bayan ng Israel
  rationale: Literal na panlalaking pangmaramihan ang anyo, ngunit sa talatang ito ay kumakatawan ito sa buong pangkat etniko at hindi lamang sa mga lalaki. Ang “mga Israelita” ang pinakatumpak na modernong Tagalog nang hindi nagdaragdag ng interpretasyong pangdoktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinatira” upang mapanatili ang causative na kilos ng hari, at “inangkin” upang ilarawan ang pagkuha sa lupain nang hindi tahasang nagdaragdag ng ideya ng labanang militar.
