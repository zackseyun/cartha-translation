  to: Palihim na gumawa ang mga Israelita ng mga bagay na hindi tama laban kay Yahweh, na kanilang Diyos.[a] Nagtayo sila para sa kanilang sarili ng mga dambana sa matataas na lugar[b] sa lahat ng kanilang mga lungsod, mula sa bantayang tore hanggang sa pinatibay na lungsod.[c]
