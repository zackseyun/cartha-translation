base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: tl
  text: Palihim na gumawa ang mga Israelita ng mga bagay na hindi tama laban kay Yahweh, na kanilang Diyos.[a] Nagtayo sila para sa kanilang sarili ng mga dambana sa matataas na lugar[b] sa lahat ng kanilang mga lungsod, mula sa bantayang tore hanggang sa pinatibay na lungsod.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Itinago ng mga Israelita ang mga bagay na hindi tama tungkol kay Yahweh, na kanilang Diyos.” Bihira ang pandiwang Hebreo at maaaring mangahulugang pagtatago o palihim na pagkilos.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga dambana sa matataas na lugar” ay mga lokal na pook ng pagsamba na madalas iugnay sa di-awtorisadong pagsamba.
    reason: cultural_note
  - marker: c
    text: Ang “mula sa bantayang tore hanggang sa pinatibay na lungsod” ay nangangahulugang sa buong lupain—mula sa pinakamaliit na himpilan hanggang sa pinakamatibay na lungsod.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: Palihim na gumawa
  rationale: Bihira ang pandiwang חפא at maaaring tumukoy sa pagtatago o palihim na pagkilos. Sa kontekstong ito, likas sa modernong Tagalog ang “palihim na gumawa,” habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: mga bagay na hindi tama
  rationale: Idyomatiko ang parirala at may malinaw na moral na pagtataya. Iniiwasan ng salin ang malabong literal na “mga bagay na hindi gayon” nang hindi rin tinutukoy nang higit sa sinasabi ng Hebreo ang uri ng kasalanan.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: laban kay Yahweh na kanilang Diyos
  rationale: Sa konteksto ng pagtataksil at bawal na pagsamba, adversatibo ang pinakamalamang na diwa ng עַל. Pinananatili ang pangalang Yahweh.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: Nagtayo sila para sa kanilang sarili ng mga sambahan sa matataas na lugar
  rationale: Ang בָּמוֹת ay mga lokal na pook ng pagsamba, karaniwang kaugnay ng hindi awtorisadong kulto. Ang “para sa kanilang sarili” ay tahasang kumakatawan sa לָהֶם.
- source_word: בְּכָל עָרֵיהֶם
  choice: sa lahat ng kanilang bayan
  rationale: Masaklaw at natural ang “bayan” para sa mga pamayanang tinutukoy rito, mula sa maliit na himpilan hanggang sa matibay na lungsod.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: mula sa toreng-bantayan
  rationale: Ipinahihiwatig ng נוֹצְרִים ang pagbabantay. Ang “toreng-bantayan” ay maikli at malinaw na katumbas sa Tagalog.
- source_word: עַד עִיר מִבְצָר
  choice: hanggang sa napapaderang lungsod
  rationale: Ang עִיר מִבְצָר ay isang lungsod na pinatibay laban sa paglusob. Ang “napapaderang lungsod” ay kongkreto at madaling maunawaan sa Tagalog.
theological_decisions:
- issue: Diwa ng mga lihim na ginawa ng Israel
  choice: Mga kongkretong gawaing hindi tama na palihim na ginawa laban kay Yahweh
  alternative: Pagtatakip ng mga bagay na hindi tama tungkol kay Yahweh, o pagbibigay-diin sa pagtatago sa halip na sa paghihimagsik
  rationale: Ang bihirang pandiwa, ang layon nitong “mga bagay,” at ang kasunod na pagtatayo ng mga pook-sambahan ay pumapabor sa mga lihim na gawa ng pagtataksil. Gayunman, hindi inaalis ang leksikal na alternatibong “itinago/tinakpan” at inilalahad ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga Israelita” sa halip na ang literal na “mga anak ng Israel,” at pinanatili ang pangalang Yahweh. Ang mga teknikal at kultural na detalye ay inilagay sa maiikling talababa upang manatiling natural ang pangunahing teksto.
