base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: tl
  text: Nang ikalabindalawang taon ng paghahari ni Ahaz na hari ng Juda, nagsimulang maghari sa Samaria si Hosea na anak ni Ela. Siyam na taon siyang naghari sa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: nagsimulang maghari
  rationale: Sa pormulang pangkronolohiya, ipinahihiwatig ng pandiwa ang pagsisimula ng paghahari; malinaw at natural itong naipapahayag sa modernong Tagalog.
- source_word: בְשֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: sa Samaria ... sa Israel
  rationale: Pinananatili ang pagkakaiba ng luklukan o sentro ng paghahari (Samaria) at ng bayang pinaghaharian (Israel).
- source_word: תֵּשַׁע שָׁנִים
  choice: Siyam na taon
  rationale: Tuwirang salin ng tagal ng paghahari.
