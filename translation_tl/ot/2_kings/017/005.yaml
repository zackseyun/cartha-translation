  terminology: Ang “hari ng Asiria,” “Samaria,” at “kinubkob” ay angkop at pare-pareho sa modernong Filipino Tagalog. Ang “lumusob laban sa Samaria” ay natural na pagpapahayag ng pag-abante sa isang lungsod sa kontekstong militar.
