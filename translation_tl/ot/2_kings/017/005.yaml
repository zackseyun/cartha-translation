  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: tl
  text: Pagkatapos, lumusob[a] ang hari ng Asiria sa buong lupain, at lumusob siya laban sa Samaria at kinubkob ito sa loob ng tatlong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umahon” o “pumunta.” Ang pandiwang Hebreo ay maaaring tumukoy sa simpleng pag-ahon o pagdating, ngunit sa kontekstong ito ay maaari rin itong magpahiwatig ng pagsulong-militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: nilusob
  rationale: Bagaman karaniwang nangangahulugang “umahon” o “pumunta,” madalas gamitin ang עלה sa salaysay-militar para sa pagsalakay. Sa unang sugnay, malinaw at natural sa modernong Tagalog ang “nilusob” para sa pag-abante ng hari sa buong lupain.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: ang hari ng Asiria
  rationale: Likas na salin ng construct phrase at tumutukoy sa tiyak na haring kilala sa konteksto.
- source_word: בְּכָל הָאָרֶץ
  choice: ang buong lupain
  rationale: Ipinahihiwatig ng בְּ dito ang pagdaan o pag-abante sa saklaw ng buong teritoryo; kasabay ng “nilusob,” naipapahayag ang lawak nang hindi dinaragdagan ang detalye.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: Sinalakay niya ang Samaria
  rationale: Sa kontekstong militar at dahil kasunod ang pagkubkob, ang עלה na may pangalan ng lungsod ay tumutukoy sa pag-abante laban dito. Natural at malinaw sa Tagalog ang “sinalakay.”
- source_word: וַיָּצַר עָלֶיהָ
  choice: kinubkob iyon
  rationale: Ang צור sa anyong ito ay tumutukoy sa pagkubkob sa isang lungsod. Pinananatili ng “iyon” na Samaria ang tinutukoy nang malinaw.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: sa loob ng tatlong taon
  rationale: Natural na Tagalog para sa tagal ng pagkubkob.
