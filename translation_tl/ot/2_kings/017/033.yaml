  naturalness: Likas at marangal ang “Kinatatakutan nila si Yahweh” at “naglilingkod sila sa sarili nilang mga diyos.” Mas natural at hindi gaanong mabigat ang binagong ayos ng hulíng sugnay.
  terminology: Ang “Yahweh,” “mga diyos,” “naglilingkod,” “kaugalian,” at “mga bansa” ay angkop sa modernong Filipino Tagalog at maayos na tumutugma sa mahahalagang terminong Hebreo.
