base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: tl
  text: Kinatatakutan nila si Yahweh[a], ngunit naglilingkod sila sa sarili nilang mga diyos, ayon sa kaugalian ng mga bansang pinagmulan nila, na mula roon ay ipinatapon sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “Kinatatakutan nila si Yahweh at naglilingkod sila sa sarili nilang mga diyos.” Payak na “at” ang pang-ugnay sa Hebreo; ipinahahayag ng “ngunit” sa pangunahing teksto ang pagsalungat na ipinahihiwatig ng konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הָיוּ יְרֵאִים
  choice: kinatatakutan nila
  rationale: Ang היה na may participle ay nagpapahiwatig ng nagpapatuloy o nakaugaliang kilos; likas sa Tagalog ang “kinatatakutan nila” at pinananatili nito ang diwa ng may-pagpipitagang takot.
- source_word: אֱלֹהֵיהֶם
  choice: sarili nilang mga diyos
  rationale: Ipinahahayag ng hulaping panghalip ang pag-aari; nililinaw ng “sarili nilang” ang pagkakaiba sa pagitan ni Yahweh at ng mga diyos na dati nilang sinasamba.
- source_word: הָיוּ עֹבְדִים
  choice: naglilingkod din sila
  rationale: Ang עבד kapag tumutukoy sa isang diyos ay relihiyosong paglilingkod o pagsamba. Pinananatili ng “naglilingkod” ang pangunahing larawan ng salitang Hebreo; ipinakikita ng “din” na magkasabay ang dalawang gawain.
- source_word: כְּמִשְׁפַּט
  choice: ayon sa kaugalian
  rationale: Sa kontekstong ito, ang מִשְׁפָּט ay tumutukoy sa nakaugaliang paraan o gawain, hindi sa isang hatol na legal.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga bansang pinagmulan ng mga taong sapilitang inilipat; ang “mga bansa” ang tuwiran at karaniwang katumbas.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: pinanggalingan nila nang ipatapon sila
  rationale: Ang Hebreo ay literal na tumutukoy sa mga bansang mula roon ay ipinatapon sila, na may di-tiyak na tagagawa ng pagpapatapon. Iniiwasan ng Tagalog na ito ang pagdaragdag ng tahasang tagagawa at malinaw na ipinahahayag ang sapilitang pag-alis.
theological_decisions:
- issue: Ang ugnayan ng pagkatakot kay Yahweh at paglilingkod sa ibang mga diyos
  choice: “ngunit” upang ipakita ang pagsalungat sa konteksto
  alternative: “at,” na siyang payak na anyo ng pang-ugnay sa Hebreo
  rationale: Payak na “at” ang וְ sa Hebreo, ngunit inilalarawan ng konteksto ang magkasalungat na pagsamba kay Yahweh at sa ibang mga diyos. Ginagawang malinaw ng “ngunit” ang pahiwatig ng konteksto habang inilalagay sa talababa ang pormal na alternatibo.
translation_notes:
  register: Modernong Filipino na dignidad ngunit madaling maunawaan. Ang “kinatatakutan” at “naglilingkod” ay nagpapanatili sa magkatugmang anyo ng mga pandiwa at sa patuloy o nakaugaliang kilos. Hindi nilutas nang palihim ang simpleng pang-ugnay na Hebreo; itinala ang “at” bilang tunay na alternatibo.
