  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: tl
  text: Kundi si Yahweh[a], na nag-ahon sa inyo mula sa lupain ng Ehipto sa pamamagitan ng dakilang kapangyarihan at ng nakaunat na bisig—siya ang inyong katakutan, siya ang inyong yuyukuran, at sa kanya kayo maghahandog ng mga hain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sa halip, si Yahweh … siya ang inyong katakutan.” Ang pambungad na Hebreo ay nagpapakita ng pagsalungat, na itinatangi si Yahweh laban sa ibang mga diyos.'
    reason: alternative_reading
  - marker: b
    text: Ang “katakutan” dito ay hindi lamang pagkasindak; kasama rito ang mapitagang paggalang at katapatan kay Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Kundi
  rationale: 'Ipinakikita ng parirala ang mariing pagsalungat sa naunang pagbabawal: hindi ang ibang mga diyos, kundi si Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הֶעֱלָה
  choice: nag-ahon
  rationale: Pinananatili nito ang larawang 'pag-ahon' ng Hiphil ng עלה at likas itong tumutukoy sa pagliligtas mula sa Ehipto.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang buong pormulang Hebreo at ang kaugnayan nito sa Exodo.
- source_word: בְּכֹחַ גָּדוֹל
  choice: sa pamamagitan ng dakilang kapangyarihan
  rationale: Ipinahahayag nang malinaw ang instrumental na gamit ng pang-ukol at ang laki ng kapangyarihan ng Diyos.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: at ng nakaunat na bisig
  rationale: Pinananatili ang kilalang larawang pang-Exodo tungkol sa hayag at makapangyarihang pagliligtas ng Diyos.
- source_word: אֹתוֹ תִירָאוּ
  choice: siya ang inyong katakutan
  rationale: Pinananatili ang diin ng nauunang layon at ang salitang 'takot,' na sa konteksto ay may saklaw na pagpipitagan at katapatan, hindi lamang sindak.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: siya ang inyong yuyukuran
  rationale: Pinananatili ang pisikal na larawan ng pagyukod sa pagsamba sa halip na gawing pangkalahatang 'sasambahin.'
- source_word: וְלוֹ תִזְבָּחוּ
  choice: sa kanya kayo maghahandog ng mga hain
  rationale: Natural sa modernong Tagalog at malinaw na ipinahahayag ang paghahandog ng sakripisyo kay Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang orihinal ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng ירא sa konteksto ng tipan at pagsamba
  choice: katakutan
  alternative: igalang; pagpitaganan; sambahin
  rationale: 'Pinananatili ang teolohikal na lawak at tensiyon ng pandiwa: kasama rito ang takot, pagpipitagan, at katapatan sa tipan, kaya hindi ito pinapaliit sa iisang interpretibong kahulugan.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkakatulad na estruktura sa tatlong utos upang maipakita ang pag-uulit at diin ng Hebreo. Ang 'nag-ahon' at 'nakaunat na bisig' ay nagpapanatili sa matitingkad na larawang pang-Exodo.
