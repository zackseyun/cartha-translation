    issue: Hindi natural ang ayos na “Doon ay nagsunog sila.”
    rationale: Mas karaniwan at malinaw sa modernong Tagalog ang “Doon, nagsunog sila,” nang walang pagbabagong semantiko.
  - severity: medium
    issue: 'May maling anyo sa paliwanag ng talababa: “magpatapon.”'
    rationale: Ang Hebreong הֶגְלָה ay causative; sa kontekstong ito ang angkop na pagpapaliwanag ay “pagpapatapon” o “pag-aalis,” hindi ang infinitive na “magpatapon.”
