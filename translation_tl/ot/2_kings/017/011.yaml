  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: tl
  text: Doon, nagsunog sila ng insenso sa lahat ng dambana sa matataas na lugar, gaya ng mga bansang pinalayas[a] ni Yahweh sa harap nila. Gumawa sila ng masasamang bagay upang galitin si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinatapon.” Ang pandiwang Hebreo ay maaaring mangahulugang pagpapatapon o pag-aalis; dito ay tumutukoy ito sa pag-aalis sa mga bansang dating naninirahan sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: nagsunog sila ng insenso
  rationale: Ang piel ng קטר ay tumutukoy sa pagpapausok ng handog at madalas ay partikular sa pagsusunog ng insenso. Sa konteksto ng pagsamba sa mga dambana sa matataas na lugar, ito ang natural at tumpak na salin.
- source_word: שָׁם
  choice: doon
  rationale: Tuwirang sinasalamin ang pang-abay na Hebreo at tumutukoy sa mga lugar ng pagsambang binanggit sa konteksto.
- source_word: בְּכָל בָּמוֹת
  choice: sa lahat ng dambana sa matataas na lugar
  rationale: Ang בָּמוֹת ay teknikal na katawagan sa mga kultikong lugar ng pagsamba na karaniwang nasa mataas na dako. Nililinaw ng 'dambana sa matataas na lugar' ang gamit nito para sa karaniwang mambabasang Filipino.
- source_word: כַּגּוֹיִם
  choice: gaya ng mga bansa
  rationale: Ang גּוֹיִם dito ay ang mga bansang dating naninirahan sa lupain, hindi ang mas huling panrelihiyong kategoryang 'mga Hentil.'
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: na pinalayas ni Yahweh mula sa harap nila
  rationale: Bagaman maaaring tumukoy ang גלה sa pagpapatapon, sa kontekstong ito ay inilalarawan nito ang pag-aalis o pagpapaalis sa mga dating naninirahan sa lupain. Pinananatili ng talababa ang tunay na leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: gumawa sila ng masasamang bagay
  rationale: Simple at tuwirang salin na pinananatili ang malawak na moral na paghatol ng pariralang Hebreo.
- source_word: לְהַכְעִיס
  choice: upang galitin
  rationale: Ang hiphil ng כעס ay nangangahulugang magdulot ng galit o pumukaw sa galit. Mas natural sa modernong Tagalog ang 'upang galitin' kaysa sa 'upang pukawin.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang 'Yahweh' ay nagpapanatili sa personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng הֶגְלָה sa konteksto ng pag-agaw sa lupain
  choice: pinalayas mula sa harap nila
  alternative: ipinatapon mula sa harap nila; inalis mula sa harap nila
  rationale: Ang konteksto ay ang pag-aalis sa mga bansang dating naninirahan sa lupain. Gayunman, hindi ikinukubli ang posibleng diwang 'ipinatapon,' kaya inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'dambana sa matataas na lugar' upang maipahayag ang teknikal na kahulugan ng בָּמוֹת nang hindi maging malabo sa ordinaryong mambabasa. Pinanatili ang pangalang Yahweh at ang payak ngunit mabigat na moral na pahayag ng Hebreo.
