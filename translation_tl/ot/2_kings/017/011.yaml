  to: Doon, nagsunog sila ng insenso sa lahat ng dambana sa matataas na lugar, gaya ng mga bansang pinalayas[a] ni Yahweh sa harap nila. Gumawa sila ng masasamang bagay upang galitin si Yahweh.
