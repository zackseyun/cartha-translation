language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: tl
  text: Tinalikuran nila ang lahat ng utos ni Yahweh na kanilang Diyos. Gumawa sila para sa kanilang sarili ng mga rebultong hinulma—dalawang guya. Gumawa rin sila ng isang Ashera[a], nagpatirapa sa buong hukbo ng langit, at naglingkod kay Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang poste ni Ashera.” Ang salitang Hebreo na Ashera ay maaaring tumukoy sa diyosang Cananea o sa isang bagay na pangkulto na kaugnay niya.
    reason: Pinananatili ang leksikal at kontekstuwal na kalabuan ng אֲשֵׁירָה nang hindi masyadong tinutukoy ang anyo o tungkulin ng kultikong bagay.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: Tinalikuran nila
  rationale: Ipinahihiwatig ng pandiwang עזב dito ang sadyang pagtalikod sa Diyos at sa kanyang tipan, hindi lamang simpleng pag-iwan.
- source_word: כָּל מִצְוֺת
  choice: ang lahat ng utos
  rationale: Tahasang pinananatili ang כָּל (“lahat”), habang ang “mga utos” ang natural at malinaw na katumbas ng מִצְוֺת sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיהֶם
  choice: na kanilang Diyos
  rationale: Pinananatili ang hulaping panghalip na nagpapahayag na si Yahweh ang kanilang Diyos sa ugnayang tipan.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: Gumawa sila para sa kanilang sarili
  rationale: Inilalahad ang diwang para sa sarili nilang paggamit o pagsamba na taglay ng לָהֶם.
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: mga rebultong hinulma—dalawang guya
  rationale: Ipinapakita ng “hinulma” ang paggawa sa pamamagitan ng paghuhulma o pagbubuhos ng metal, at nililinaw ng kasunod na parirala na ang mga imahen ay dalawang guya. Ginamit ang likas na pangmaramihang anyo sa Tagalog ayon sa tinutukoy na dalawang rebulto.
- source_word: אֲשֵׁירָה
  choice: isang Ashera
  rationale: Transliterasyon ang ginamit upang huwag pagpasiyahan kung ang tinutukoy ay ang diyosa o ang bagay na ginagamit sa kanyang kulto; ipinaliliwanag ang kalabuan sa talababa.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: nagpatirapa
  rationale: Pinananatili nito ang konkretong kilos ng pagluhod o pagdapa bilang pagsamba, sa halip na agad itong gawing pangkalahatang “sumamba.”
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: sa buong hukbo ng langit
  rationale: Ang parirala ay tumutukoy sa kabuuan ng mga bagay o kapangyarihang makalangit, lalo na sa mga bagay sa kalangitan; pinananatili ang tradisyonal ngunit nauunawaang larawang “hukbo.”
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Pinananatili ang diwa ng kultikong paglilingkod at ang pagkakaiba nito sa naunang pisikal na pagpapatirapa.
- source_word: הַבָּעַל
  choice: kay Baal
  rationale: Natural sa Tagalog ang pangalang “Baal” nang walang katumbas na pantukoy; ang “kay” ang angkop na pananda sa personal na pangalang pinaglingkuran.
theological_decisions:
- issue: Paglalarawan sa pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng אֲשֵׁירָה
  choice: isang Ashera, na may talababa
  alternative: isang poste ni Ashera; ang diyosang si Ashera
  rationale: Bagaman ang pandiwang “gumawa” ay malakas na nagpapahiwatig ng isang kultikong bagay, maaaring tumukoy ang terminong Hebreo sa diyosa o sa kanyang sagisag. Hindi tahasang nilulutas ng salin ang kalabuan.
- issue: Singular na מַסֵּכָה kasunod ang “dalawang guya”
  choice: mga rebultong hinulma—dalawang guya
  alternative: isang rebultong hinulma—dalawang guya
  rationale: Singular ang anyong Hebreo ng מַסֵּכָה, ngunit dalawang guya ang tahasang kasunod na paliwanag. Ang pangmaramihang Tagalog ay sumusunod sa malinaw na bilang ng mga bagay at umiiwas sa di-likas at tila salungat na parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “rebulto” sa halip na mas teknikal na “imaheng binubo,” at “nagpatirapa” upang mapanatili ang konkretong kilos. Inilipat ang talababa sa “Ashera,” ang salitang aktuwal nitong ipinaliliwanag.
