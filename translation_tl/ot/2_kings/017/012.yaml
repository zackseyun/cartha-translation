  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: tl
  text: Naglingkod sila sa mga diyus-diyosan[a], bagaman sinabi sa kanila ni Yahweh, “Huwag ninyong gawin ang bagay na ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong גִּלֻּלִים ay mapanghamak na katawagan para sa mga diyus-diyosan. Maaari itong magpahiwatig ng “maruruming diyus-diyosan” o, sa literal na larawan, “mga diyus-diyosang dumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Naglingkod sila
  rationale: Pinananatili ng “naglingkod” ang karaniwang diwa ng עבד at ang kaugnayan nito sa paglilingkod na panrelihiyon; sa konteksto, malinaw na pagsamba at debosyon sa mga diyus-diyosan ang tinutukoy.
- source_word: הַגִּלֻּלִים
  choice: mga diyus-diyosan
  rationale: Ito ang malinaw at natural na katawagan sa modernong Tagalog. Ang matinding mapanghamak na himig ng salitang Hebreo ay inilalahad sa talababa upang hindi maging pilit ang pangunahing teksto.
- source_word: אֲשֶׁר
  choice: na tungkol sa mga iyon
  rationale: Ipinakikita nitong ang naunang utos ni Yahweh ay may kinalaman sa mga diyus-diyosan at sa gawaing pagsamba sa mga iyon, habang pinananatili ang bahagyang lawak ng ugnayang ipinahihiwatig ng Hebreo.
- source_word: אָמַר יְהוָה לָהֶם
  choice: sinabi sa kanila ni Yahweh
  rationale: Natural sa Tagalog ang ayos na ito at malinaw na nauna na ang banal na utos sa pagsuway na isinasalaysay. Isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag ninyong gawin
  rationale: Ito ang natural at tuwirang anyo ng pagbabawal sa modernong Tagalog, na pinananatili ang lakas ng utos.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malapit ito sa malawak na kahulugan ng דָּבָר at hindi nililimitahan ang tinutukoy sa isang mas tiyak na gawa kaysa sa sinasabi ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng “paglilingkod” sa mga diyus-diyosan
  choice: Panatilihin ang “naglingkod” sa pangunahing teksto
  alternative: Sumamba
  rationale: Maaaring tumukoy ang עבד sa pagsamba sa kontekstong ito, ngunit pinananatili ng “naglingkod” ang leksikal at tipanang tensiyon sa pagitan ng paglilingkod kay Yahweh at paglilingkod sa mga diyus-diyosan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Huwag ninyong gawin” sa halip na mas lipas o labis na pormal na anyo. Pinanatili ang literal na “naglingkod” at ipinaliwanag sa desisyong leksikal ang panrelihiyong diwa nito.
