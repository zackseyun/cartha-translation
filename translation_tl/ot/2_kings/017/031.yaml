  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: tl
  text: Ang mga Avita[a] ay gumawa ng Nibhaz at Tartak, at ang mga taga-Sepharvaim ay nagsusunog ng kanilang mga anak na lalaki sa apoy para kina Adrammelek at Anammelek[b], ang mga diyos ng Sepharvaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “mga Avvim.”'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, inihahandog nila ang kanilang mga anak na lalaki sa mga diyos na ito sa pamamagitan ng pagsunog sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: ang mga Avita
  rationale: Pangmaramihang tawag sa isang pangkat ng mga tao; ginamit ang likas na anyong Filipino para sa pangalang-etniko, habang pinanatili ang transliterasyon ng Avva.
- source_word: עָשׂוּ
  choice: gumawa kina
  rationale: Tuwirang isinasalin ang karaniwang pandiwang 'gumawa' nang hindi idinaragdag ang 'mga diyus-diyosan' o 'mga larawan,' na hindi tahasang nasa Hebreo. Ang 'kina' ay angkop sa Filipino dahil dalawang pangalang itinuturing na persona ang kasunod.
- source_word: נִבְחַז וְאֶת תַּרְתָּק
  choice: Nibhaz at Tartak
  rationale: Mga pangalang pantangi ng mga diyos; tinranslitera.
- source_word: הַסְפַרְוִים
  choice: ang mga taga-Sepharvaim
  rationale: Pangmaramihang katawagan sa mga naninirahan sa Sepharvaim; mas malinaw at natural sa modernong Filipino kaysa sa isang artipisyal na anyong etniko.
- source_word: שֹׂרְפִים
  choice: ay nagsusunog
  rationale: Pinananatili ang aspektong patuloy o kinagawian ng participle sa konteksto ng talaan ng kanilang mga gawaing panrelihiyon.
- source_word: אֶת בְּנֵיהֶם בָּאֵשׁ
  choice: ng kanilang mga anak na lalaki sa apoy
  rationale: Pinananatili ang tiyak na panlalaking kahulugan ng בנים at ang idyomatikong 'sa apoy' sa konteksto ng paghahandog.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: para kina Adrammelek at Anammelek
  rationale: Ang לְ ay nagpapahiwatig ng pinag-uukulan ng handog; natural sa Filipino ang 'para kina' para sa dalawang pinatutungkulan.
- source_word: אלה ספרים
  choice: ang mga diyos ng Sepharvaim
  rationale: Pariralang naglalarawan kina Adrammelek at Anammelek bilang mga diyos na kaugnay ng lugar na Sepharvaim.
theological_decisions:
- issue: Kung tahasang tatawaging mga diyus-diyosan o mga larawan sina Nibhaz at Tartak
  choice: Panatilihin ang payak na 'gumawa kina Nibhaz at Tartak.'
  alternative: Gumawa ng mga diyus-diyosan o mga larawan nina Nibhaz at Tartak.
  rationale: Pangalan lamang ang tuwirang layon ng 'gumawa' sa Hebreo. Malinaw sa konteksto ang gawaing pangkulto, ngunit ang pagdaragdag ng 'diyus-diyosan' o 'larawan' ay higit sa tahasang sinasabi ng teksto.
- issue: Kung gagawing pangkalahatan ang בְּנֵיהֶם bilang 'mga anak'
  choice: Isalin bilang 'mga anak na lalaki.'
  alternative: Mga anak.
  rationale: Tiyak na panlalaki ang terminong Hebreo rito, kaya pinanatili ang pagkakaibang iyon.
- issue: Kung ipaliliwanag sa pangunahing teksto ang pagsusunog bilang paghahandog ng tao
  choice: Panatilihin ang literal na paglalarawan sa pangunahing teksto at ipaliwanag sa talababa.
  alternative: Inihandog nila sa pamamagitan ng pagsunog ang kanilang mga anak na lalaki.
  rationale: Nananatiling malapit ang pangunahing teksto sa anyo ng Hebreo, habang nililinaw ng talababa ang kontekstong pangkulto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga taga-Sepharvaim” bilang natural na katawagan sa mga naninirahan doon, at pinanatili ang participial na diwa sa “nagsusunog.” Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
