base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: tl
  text: Ngunit hindi sila nakinig; pinatigas nila ang kanilang batok, gaya ng batok ng kanilang mga ninuno na hindi naniwala[a] kay Yahweh na kanilang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “hindi nagtiwala kay Yahweh na kanilang Diyos.” Ang pandiwang Hebreo ay maaaring mangahulugang maniwala o magtiwala, lalo na sa konteksto ng tipan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: Ngunit ayaw nilang makinig
  rationale: Ang שׁמע ay pangunahing nangangahulugang makinig o dinggin at maaari ring magpahiwatig ng pagsunod. Ipinakikita ng konteksto ang kusang pagtanggi, kaya natural na nahuhuli ng “ayaw nilang makinig” ang aspektong ito.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: pinatigas nila ang kanilang batok
  rationale: Pinananatili nito ang kongkretong Hebreong idyoma ng pagpapatigas ng batok bilang larawan ng katigasan ng ulo at pagtutol.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: gaya ng batok ng kanilang mga ninuno
  rationale: Tahasang inihahambing ng Hebreo ang kanilang batok sa batok ng mga ninuno; pinananatili ng salin ang larawan sa halip na gawing paliwanag lamang ang kahulugan.
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: sumampalataya kay Yahweh
  rationale: Ang Hiphil ng אמן na may ב ay maaaring tumukoy sa paniniwala o pagtitiwala sa isang tao. Ang “sumampalataya kay” ay tuwirang salin na angkop sa marangal na modernong Tagalog, habang itinatala sa talababa ang leksikal na alternatibo.
- source_word: אֱלֹהֵיהֶם
  choice: na kanilang Diyos
  rationale: Pinananatili nito ang tahasang ugnayang tipan na si Yahweh ang kanilang Diyos.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahulugan ng הֶאֱמִינוּ
  choice: hindi sumampalataya kay Yahweh
  alternative: hindi nagtiwala kay Yahweh
  rationale: Kapuwa posible ang paniniwala at pagtitiwala sa konstruksiyong Hebreo. Ginamit sa pangunahing teksto ang “sumampalataya,” ngunit pinanatili sa talababa ang tunay na alternatibong “nagtiwala” upang hindi patahimikin ang leksikal na lawak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na larawang “pinatigas ang batok,” na malinaw pa rin bilang idyoma ng matigas na pagtutol. Ginamit ang “mga ninuno” sa halip na literal na “mga ama” upang natural na tumukoy sa mga naunang salinlahi.
