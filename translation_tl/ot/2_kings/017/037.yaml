  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: tl
  text: Ang mga tuntunin, mga hatol, ang Kautusan, at ang utos na isinulat niya para sa inyo[a] ay ingatan at tuparin ninyo sa lahat ng panahon[b]. Huwag kayong matakot sa ibang mga diyos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “niya” ay tumutukoy sa PANGINOON ayon sa konteksto.
    reason: referent_clarification
  - marker: b
    text: Sa literal, “ingatan ninyong gawin sa lahat ng mga araw.” Pinagsasama ng Hebreo ang pag-iingat o pagsunod at ang aktuwal na paggawa.
    reason: lexical_alternative
  - marker: c
    text: Ang “matakot” dito ay maaari ring magpahiwatig ng mapitagang katapatan o pagsamba sa isang diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ipinapanatili nito ang diwa ng mga itinakdang alituntunin o batas, habang malinaw at natural sa makabagong Tagalog.
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Ipinakikita nito ang legal at hudisyal na diwa ng מִשְׁפָּטִים at hindi ito ipinaghahalo sa mas pangkalahatang mga tuntunin.
- source_word: הַתּוֹרָה
  choice: ang Kautusan
  rationale: Sa kontekstong tipan at legal, ang “Kautusan” ay natural na katumbas na nagpapanatili sa kinikilalang puwersa ng תּוֹרָה, bagaman maaari rin itong mangahulugang “tagubilin.”
- source_word: הַמִּצְוָה
  choice: ang utos
  rationale: Isahan ang salitang Hebreo; ang “utos” ay malinaw, marangal, at naiiba pa rin sa iba pang terminong legal sa talaan.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: na isinulat niya para sa inyo
  rationale: Pinananatili ang di-tahasang panlalaking paksa ng pandiwang Hebreo bilang “niya” sa halip na idagdag sa pangunahing teksto ang pangalang hindi tahasang naroon sa talata.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: ingatan ninyong tuparin
  rationale: Natural nitong ipinahahayag ang pinagsamang diwa ng pag-iingat o pagsunod at ng aktuwal na paggawa, nang hindi ginagamit ang alanganing literal na “ingatan ninyong gawin.”
- source_word: כָּל הַיָּמִים
  choice: habang panahon
  rationale: Idyomatikong ipinahahayag sa Tagalog ang patuloy na puwersa ng literal na “lahat ng mga araw,” nang hindi nagdaragdag ng tahasang panghalip na paari.
- source_word: תִירְאוּ
  choice: matakot
  rationale: Pinananatili ang pangunahing saklaw ng יָרֵא at ang sinadyang tensiyon sa pagitan ng takot, pagpipitagan, at katapatan sa pagsamba.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Ito ang tuwiran at karaniwang katumbas ng Hebreong parirala para sa mga diyos maliban sa PANGINOON.
theological_decisions:
- issue: Paglalahad ng apat na magkakaugnay na terminong pambatas ng tipan
  choice: Panatilihing magkahiwalay bilang “mga tuntunin, mga hatol, ang Kautusan, at ang utos.”
  alternative: Pagsamahin bilang “mga batas at utos.”
  rationale: Sinasadyang magpatong-patong ang Hebreo ng apat na termino. Pinananatili ng salin ang kanilang retorikal na bigat at pagkakaiba nang hindi nagpapasok ng sektaryong pagpapakahulugan.
- issue: Paksa ng “isinulat niya”
  choice: Panatilihin ang panghalip na “niya.”
  alternative: 'Gawing tahasan: “isinulat ng PANGINOON.”'
  rationale: Malinaw sa konteksto na ang tinutukoy ay ang PANGINOON, ngunit hindi tahasang inuulit ng talatang Hebreo ang pangalan; kaya hindi ito idinaragdag sa pangunahing teksto.
- issue: Diwa ng pagkatakot sa ibang mga diyos
  choice: Gamitin ang “matakot” at ipaliwanag ang mas malawak na diwa sa talababa.
  alternative: Isalin nang tahasan bilang “sumamba” o “magpitagan.”
  rationale: Pinananatili nito ang tunay na lawak at tensiyon ng יָרֵא, na sa kontekstong ito ay may kasamang mapitagang katapatan o pagsamba, ngunit hindi lamang iyon ang literal na kahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang pormal na pag-iipon ng apat na terminong legal, ngunit ginawang natural ang pariralang nagsasaad ng pagsunod at ang idyomang pangtagal. Ginamit ang malaking titik sa “Kautusan” upang malinaw ang tiyak na katawagang tipan sa talaan.
