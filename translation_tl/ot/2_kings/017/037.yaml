  naturalness: Mas natural at malinaw sa modernong Tagalog ang “ay ingatan at tuparin ninyo sa lahat ng panahon” kaysa “ay ingatan ninyong tuparin habang panahon.” Pinananatili rin nito ang marangal na rehistro at ang magkaibang aspekto ng pagmamasid/pag-iingat at pagsasagawa.
  terminology: Ang “mga tuntunin,” “mga hatol,” “Kautusan,” at “utos” ay katanggap-tanggap na magkakahiwalay na katumbas ng legal na pangkat ng Hebreo. Ang “matakot sa ibang mga diyos” ay tuwiran at angkop; nililinaw ng talababa ang kontekstuwal na saklaw nito nang hindi pinapalitan ang pangunahing salita.
