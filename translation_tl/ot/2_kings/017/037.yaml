- from: Ang mga tuntunin, mga hatol, ang Kautusan, at ang utos na isinulat niya para sa inyo[a] ay ingatan ninyong tuparin habang panahon.[b] Huwag kayong matakot sa ibang mga diyos.[c]
  to: Ang mga tuntunin, mga hatol, ang Kautusan, at ang utos na isinulat niya para sa inyo[a] ay ingatan at tuparin ninyo sa lahat ng panahon[b]. Huwag kayong matakot sa ibang mga diyos[c].
  rationale: Pinalitan ang di-gaanong natural na “habang panahon” ng “sa lahat ng panahon” at inayos ang pandiwang parirala upang maging likas sa makabagong Tagalog, nang hindi pinapantay o inaalis ang dalawang magkakaugnay na pandiwang ideya sa Hebreo. Inilipat din ang mga panandang talababa bago ang tuldok bilang karaniwang pagkakalagay ng footnote anchor.
