    rationale: Ang “ang mga hari ng Israel na kanilang ginawa” ay sa Tagalog ay maaaring unawaing ang mga hari ang layon ng paggawa. Kailangang ilarawan ang elipsis sa halip na magbigay ng nakalilitong pseudo-literal na parirala.
