  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: tl
  text: Namuhay sila ayon sa mga tuntunin ng mga bansang pinaalis ni Yahweh sa harap ng mga Israelita[a][b], at ayon sa mga ginawa ng mga hari ng Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “mga anak na lalaki ni Israel”; ibig sabihin, ang mga Israelita.'
    reason: lexical_alternative
  - marker: b
    text: Ang “pinaalis” ay maaari ring isaling “inalisan ng lupain.”
    reason: lexical_alternative
  - marker: c
    text: 'Eliptikal ang Hebreo sa huling parirala: literal na “at ang mga hari ng Israel na ginawa nila.” Malamang na tumutukoy ito sa mga gawi o kaugaliang ipinakilala ng mga hari ng Israel; maaari rin itong isaling “at ayon sa mga kaugaliang ipinakilala ng mga hari ng Israel.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Namuhay sila ayon sa
  rationale: Ang literal na “lumakad” ay metapora para sa asal o paraan ng pamumuhay. Mas likas sa modernong Tagalog ang “namuhay ayon sa” habang pinananatili ang etikal na diwa.
- source_word: בְּחֻקּוֹת
  choice: ayon sa mga tuntunin
  rationale: Ang חֻקּוֹת ay tumutukoy sa mga itinakdang alituntunin o nakaugaliang gawain. Ang “mga tuntunin” ay nagpapanatili ng pormal na lakas nito nang hindi nagiging teknikal.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa mga di-Israelitang bayan sa lupain; ang “mga bansa” ay tuwiran at hindi nagdaragdag ng teolohikal na kahulugan.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: itinaboy ni Yahweh mula sa harapan
  rationale: Sa Hiphil, ang הוֹרִישׁ ay maaaring mangahulugang paalisin o alisan ng pag-aari. Ang “itinaboy” ay natural at malinaw, samantalang ang “mula sa harapan” ay nagpapanatili sa larawan ng מִפְּנֵי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Literal itong “mga anak na lalaki ni Israel,” ngunit isa itong nakagawiang katawagan sa buong bayang Israel. Ang “mga Israelita” ang natural at inklusibong katumbas sa Tagalog.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: at ayon sa mga tuntuning ginawa ng mga hari ng Israel
  rationale: Pinaikli o eliptikal ang Hebreo. Inuulit sa salin ang ipinahihiwatig na “mga tuntunin” upang maging malinaw ang ugnayan nito sa “namuhay ayon sa,” ngunit itinatala sa talababa ang literal at posibleng alternatibong pagbasa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Paksa at ipinahihiwatig na layon sa huling parirala
  choice: mga tuntuning ginawa ng mga hari ng Israel
  alternative: ang ginawa ng mga hari ng Israel
  rationale: Eliptikal at matigas ang anyo ng Hebreo. Ang napiling salin ay inuugnay ang huling parirala sa naunang “mga tuntunin,” ngunit hindi itinatago ang literal na anyo at alternatibong pag-unawa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “namuhay ayon sa” sa halip na literal na “lumakad sa” dahil iyon ang likas na paghahatid ng Hebreong metapora sa kasalukuyang Tagalog. Iningatan sa talababa ang pormal na larawan at ang tunay na kalabuan ng huling parirala.
