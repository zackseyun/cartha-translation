    issue: Hindi likas ang “itinaboy ni Yahweh mula sa harapan ng mga Israelita.”
    rationale: Bagaman sinusubukan nitong sundan ang מִפְּנֵי, mas idiomatiko sa Tagalog ang “pinaalis ... sa harap ng mga Israelita.”
  - severity: medium
    issue: Masyadong tinutukoy ng “mga tuntuning ginawa” ang eliptikal na huling parirala.
    rationale: Hindi tahasang inuulit ng Hebreo ang “mga tuntunin.” Ang “mga ginawa” ay mas malapit sa anyo ng pinagmulan at napapanatili ang saklaw ng parirala; maaaring ipaliwanag sa talababa ang malamang na tinutukoy na mga kaugalian o gawi.
  - severity: high
