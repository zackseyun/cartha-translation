  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: tl
  text: Ginawa ng mga taga-Babilonia[b] ang Sucot-benot[a], ginawa ng mga taga-Cut ang Nergal, at ginawa ng mga taga-Hamat ang Asima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Sucot-benot ay malamang na pangalan ng isang banyagang diyos o bagay na pangkulto. Hindi tiyak ang kahulugan ng pangalan kaya isinalin-titik ito sa halip na isalin ang kahulugan.
    reason: cultural_note
  - marker: b
    text: Sa literal, “mga lalaki ng Babilonia … mga lalaki ng Cut … mga lalaki ng Hamat.” Maaaring tumukoy ang pananalitang Hebreo sa mga mamamayan o tagaroon ng bawat lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: mga taga-
  rationale: Ang construct plural ng אִישׁ ay tumutukoy rito sa mga taong nauugnay sa bawat lugar. Mas natural sa makabagong Tagalog ang “mga taga-” kaysa sa literal na “mga lalaki ng,” habang pinananatili ng talababa ang anyong Hebreo.
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Karaniwang kahulugan ng עשה ang “gumawa.” Hindi ginawang “nagtayo” o “sumamba” upang maiwasang tukuyin nang higit sa sinasabi ng Hebreo ang uri ng kilos.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Sucot-benot
  rationale: Isinalin-titik bilang pangalang pantangi sapagkat hindi tiyak kung pangalan ito ng isang diyos o ng isang bagay na pangkulto, at hindi rin tiyak ang kahulugan ng pangalan.
- source_word: כּוּת
  choice: Cut
  rationale: Isinalin-titik ang pangalan ng lugar ayon sa ponolohiyang madaling basahin sa Tagalog.
- source_word: נֵרְגַל
  choice: Nergal
  rationale: Pangalan ng isang diyos sa Mesopotamia; ang pagsasalin-titik ang nag-iingat sa historikal na reperensiya.
- source_word: חֲמָת
  choice: Hamat
  rationale: Isinalin-titik ang pangalan ng lugar sa paraang natural basahin sa Tagalog.
- source_word: אֲשִׁימָא
  choice: Asima
  rationale: Isinalin-titik ang pangalan ng banyagang diyos o bagay na pangkulto nang hindi nagpapasok ng di-tiyak na interpretasyon.
theological_decisions:
- issue: Kung idaragdag ang “diyos” o “diyus-diyosan” sa mga tuwirang layon ng עָשׂוּ
  choice: Panatilihin lamang ang mga pangalang pantangi, nang walang idinagdag na “diyos” o “diyus-diyosan.”
  alternative: “Ginawa ng mga taga-Babilonia ang diyus-diyosang Sucot-benot …” o “ginawa nilang diyos si Sucot-benot …”
  rationale: Sinasabi lamang ng tekstong Hebreo na “ginawa” nila ang mga pinangalanang bagay o persona. Bagaman pangkulto ang konteksto, ang pagdaragdag ng “diyos” o “diyus-diyosan” ay magpapasya sa isang bagay na hindi tahasang tinutukoy ng talata.
translation_notes:
  register: Gumamit ng makabago, payak, at marangal na Tagalog. Ang “mga taga-” ay likas na kolektibong tawag sa mga naninirahan o nagmula sa isang lugar. Pinanatili ang pag-uulit ng “ginawa” upang maipakita ang paulit-ulit na balangkas ng Hebreo.
