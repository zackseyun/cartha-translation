    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, mga paring naglilingkod sa mga lokal na pook-sambahan sa halip na sa sentral na santuwaryo.
    reason: cultural_note
  revision_rationale: Inilipat ang talababa b upang tumugma ang angkla nito sa terminong ipinaliliwanag. Walang binago sa kahulugan ng talata o sa pagsasalin ng Hebreong teksto.
