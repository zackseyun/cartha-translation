  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: tl
  text: May takot sila kay Yahweh, at nagtalaga sila para sa kanilang sarili ng mga pari mula sa sarili nilang mga kababayan[a] para sa matataas na lugar[b]. Ang mga paring iyon ang naglilingkod para sa kanila sa mga bahay-sambahan sa matataas na lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘mula sa lahat ng uri sa kanila.’ Idyomatiko ang pananalita sa Hebreo at maaaring tumukoy sa pagpili mula sa buong sambayanan nang hindi isinasaalang-alang ang wastong mga kuwalipikasyon.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, mga paring naglilingkod sa mga lokal na pook-sambahan sa halip na sa sentral na santuwaryo.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: May takot sila kay Yahweh
  rationale: 'Pinananatili nito ang diwa ng pagkatakot at pagpipitagan sa Diyos nang hindi ito nililimitahan sa simpleng ‘pagsamba.’ Nananatili rin ang tensiyon sa konteksto: may pagkilala sila kay Yahweh habang nagpapatuloy sa di-wastong gawaing panrelihiyon.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מִקְצוֹתָם
  choice: mula sa sarili nilang mga kababayan
  rationale: Ipinahahayag nito ang idyomatikong diwa ng pagpili mula sa sarili nilang populasyon, habang iniiwasang igiit ang pinagtatalunang kahulugang ‘mula sa pinakamababang uri.’
- source_word: כֹּהֲנֵי בָמוֹת
  choice: mga pari ... para sa matataas na lugar
  rationale: Pinananatili ang kultikong tungkulin ng mga pari at ang teknikal na katawagang tumutukoy sa mga lokal na pook-sambahan.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: nagtalaga sila para sa kanilang sarili
  rationale: Sa konteksto ng pagbibigay ng tungkulin sa mga tao, ang עשה ay likas na maisasalin bilang ‘nagtalaga’; isinama ang pakinabang na para sa kanilang sarili na ipinahahayag ng לָהֶם.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: ang mga paring iyon ang naglilingkod para sa kanila
  rationale: Nililinaw na ang mga bagong talagang pari ang simuno at ipinakikita ang nagpapatuloy nilang paglilingkod, nang hindi nagdaragdag ng tiyak na ritwal na wala sa pandiwa.
- source_word: בְּבֵית הַבָּמוֹת
  choice: sa mga bahay-sambahan sa matataas na lugar
  rationale: Itinuturing ang anyong isahan bilang kolektibo at inilalarawan ang mga gusaling sambahan na kaugnay ng mga matataas na lugar nang hindi gumagamit ng mas interpretibong ‘mga templo.’
theological_decisions:
- issue: Ang tensiyon sa pagitan ng pagkatakot kay Yahweh at ng di-wastong pagsamba
  choice: Pinanatili ang magkatabing pahayag sa pamamagitan ng ‘at,’ nang walang idinagdag na ‘ngunit’ o pahiwatig na pagkukunwari lamang ang kanilang takot.
  alternative: ‘Sinasamba nila si Yahweh ngunit...’ o ‘Nagkunwari silang may takot kay Yahweh...’
  rationale: Magkakaugnay ang mga sugnay sa Hebreo sa pamamagitan ng waw. Ang salin ay hindi dapat magdagdag ng tahasang pagsalungat o humatol na hindi tunay ang kanilang takot; ang salaysay mismo ang naglalantad ng tensiyon.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang ‘may takot kay Yahweh’ ay madaling maunawaan ngunit pinananatili ang saklaw na takot-pagpipitagan ng Hebreo. Ang ‘matataas na lugar’ ay pinanatili bilang teknikal na katawagan at ipinaliwanag sa talababa.
