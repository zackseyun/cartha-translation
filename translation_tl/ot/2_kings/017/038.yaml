  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: tl
  text: Huwag ninyong kalimutan ang tipang ginawa ko sa inyo,[a] at huwag kayong matakot sa ibang mga diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “ang tipang pinutol ko sa inyo.” Ang “ginawa” ay natural na salin sa Filipino ng Hebreong idyoma para sa pagtatatag ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Ang “matakot” ay maaari ring magpahiwatig ng pagpipitagan at pagkilala sa kapangyarihan ng ibang mga diyos.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: הַבְּרִית
  choice: ang tipan
  rationale: Ang “tipan” ang natural at kinikilalang salin sa kontekstong ito, at pinananatili nito ang pormal at teolohikal na diwa ng isang nagbubuklod na ugnayang itinatag ng Diyos.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: na ginawa ko sa inyo
  rationale: Literal na “pinutol ko sa inyo” ang Hebreong idyoma, ngunit ang “ginawa ko sa inyo” ang natural na paraan sa Filipino upang ipahayag ang pagtatatag ng isang tipan.
- source_word: לֹא תִשְׁכָּחוּ
  choice: huwag ninyong kalilimutan
  rationale: Ang anyong Hebreo ay nagsisilbing pagbabawal o tagubilin. Ang “huwag ninyong kalilimutan” ay natural sa modernong Filipino at malinaw na nagpapanatili ng puwersang nag-uutos.
- source_word: וְלֹא תִירְאוּ
  choice: at huwag kayong matakot
  rationale: Maaaring tumukoy ang ירא sa pagkatakot o pagpipitagan. Pinananatili ng “matakot” ang karaniwang pormulang pangtipan at ang saklaw ng orihinal nang hindi ito nililimitahan sa pagsamba lamang.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Direkta at natural itong salin ng pariralang tumutukoy sa mga diyos bukod sa Diyos ng Israel, at pinananatili ang pormulang pangtipan.
theological_decisions:
- issue: Idyomang pangtipan at tono ng pagbabawal
  choice: Gumamit ng “tipang ginawa ko sa inyo” at mga tuwirang pagbabawal na “huwag.”
  alternative: Maaaring gumamit ng hulang pahayag gaya ng “hindi ninyo kalilimutan” at “hindi kayo matatakot,” o isalin ang ירא bilang “pagpitaganan.”
  rationale: Sa konteksto, ang mga anyong may לֹא ay mga tagubiling nagbabawal. Ang imperatibong “huwag” ay mas malinaw at natural sa Filipino, samantalang ang “matakot” ay nagpapanatili sa tunay na lawak at tensiyong teolohikal ng ירא bilang takot, pagpipitagan, at katapatang panrelihiyon nang hindi tahasang pinipili ang isa lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo/kayo” ayon sa pangmaramihang mga pandiwang Hebreo. Inuna ang pagbabawal upang maging natural ang ayos sa Filipino, habang pinanatili ang pag-uugnay ng dalawang utos.
