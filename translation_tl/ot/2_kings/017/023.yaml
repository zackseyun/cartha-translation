base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: tl
  text: hanggang sa inalis ni Yahweh ang Israel mula sa harapan niya[a], gaya ng sinabi niya sa pamamagitan ng[b] lahat ng kanyang mga lingkod na propeta. Kaya ipinatapon ang Israel mula sa lupain nito patungong Asiria, hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “mula sa presensiya niya.” Literal sa Hebreo: “mula sa harap ng kanyang mukha.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa Hebreo: “sa kamay ng”; ibig sabihin, “sa pamamagitan ng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: alisin
  rationale: Ipinapakita ng causative na anyo ng pandiwa ang pagpapayaon o pag-aalis; natural sa Tagalog ang “alisin” at hindi nito dinaragdagan ang teksto ng mas tiyak na diwang gaya ng “palayasin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH ayon sa patakaran ng proyekto.
- source_word: מֵעַל פָּנָיו
  choice: sa harapan niya
  rationale: Natural na Tagalog ito para sa Hebreong idyomang literal na “mula sa harap ng kanyang mukha,” at napapanatili ang personal at mapanghatol na diwa nang hindi nagiging asiwa ang salin.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: gaya ng sinabi niya
  rationale: Napapanatili ang paghahambing at ang diwa ng katuparan ng naunang pahayag.
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Ang Hebreong “sa kamay ng” ay idyoma ng ahensiya; malinaw at natural sa modernong Tagalog ang “sa pamamagitan ng,” habang itinatala sa talababa ang literal na larawan.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: kanyang lingkod na propeta
  rationale: Pinananatili nitong ang mga propeta ay mga lingkod ni Yahweh, nang walang dagdag na interpretasyon.
- source_word: וַיִּגֶל
  choice: ipinatapon
  rationale: Sa kontekstong ito, tumutukoy ang גלה sa sapilitang pagpapatapon; ang pasibong “ipinatapon” ay angkop sa kolektibong Israel.
- source_word: אַדְמָתוֹ
  choice: lupain nito
  rationale: Tinutukoy ang sariling teritoryo ng bansang Israel; ang “nito” ay angkop sa kolektibong pangalan ng bansa.
- source_word: אַשּׁוּרָה
  choice: patungong Asiria
  rationale: Ipinapahayag ng directional ending ang pagkilos tungo sa Asiria.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Malapit sa pormulang Hebreo at malinaw sa Tagalog ang nagpapatuloy na kalagayan hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Ang diwa ng מֵעַל פָּנָיו bilang paghatol ng Diyos
  choice: sa harapan niya
  alternative: mula sa presensiya niya
  rationale: Pinananatili ng “sa harapan niya” ang personal at hudisyal na larawan ng pag-aalis ng Israel mula sa harap ni Yahweh, nang hindi ipinapakahulugang lubusang wala na sila sa presensiya ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at ang pormulang “hanggang sa araw na ito,” samantalang ginawang natural sa Tagalog ang mga Hebreong idyoma. Ang mga pananda ng talababa [a] at [b] ay inilagay mismo sa kaugnay na mga parirala.
