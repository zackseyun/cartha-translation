base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: tl
  text: Pinaraan nila sa apoy[a] ang kanilang mga anak na lalaki at babae. Nagsagawa sila ng panghuhula at nagbigay-kahulugan sa mga palatandaan. Ipinagbili nila ang kanilang sarili upang gawin ang masama sa paningin ni Yahweh, at sa gayo’y galitin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas tahasan, “inihandog nila bilang hain sa apoy ang kanilang mga anak na lalaki at babae.” Literal sa Hebreo: “pinaraan ... sa apoy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: pinaraan ... sa apoy
  rationale: Pinananatili nito ang literal na idyomang Hebreo at ang kaugnayan nito sa ibang mga talata, nang hindi nililimitahan sa pangunahing teksto ang eksaktong anyo ng ritwal.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: kanilang mga anak na lalaki at babae
  rationale: Tahasang binabanggit ng Hebreo ang kapwa mga anak na lalaki at babae; pinananatili ito sa salin.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: nagsagawa sila ng panghuhula
  rationale: Natural na Filipino ito para sa magkaugat na pandiwa at layon sa Hebreo, at malinaw na tumutukoy sa gawaing dibinasyon.
- source_word: וַיְנַחֵשׁוּ
  choice: nagbasa ng mga tanda
  rationale: Ipinapahayag nito ang pagbibigay-kahulugan sa mga tanda o pangitain bilang mga omen at naipakikitang naiiba ito sa naunang panghuhula.
- source_word: וַיִּתְמַכְּרוּ
  choice: ipinagbili nila ang kanilang sarili
  rationale: Pinananatili ang matinding metapora ng kusang pagpapailalim o pagkaalipin nila sa kasamaan.
- source_word: לַעֲשׂוֹת הָרַע
  choice: upang gawin ang masama
  rationale: Direkta at natural na katumbas ng pariralang Hebreo.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong metapora ng pagsusuri o paghatol ng Diyos sa natural na Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לְהַכְעִיסוֹ
  choice: at galitin siya
  rationale: Pinananatili ang causative na diwa ng Hebreo at ang layunin o ibinungang pagkapoot ng Diyos.
theological_decisions:
- issue: Ang kalikasan ng ritwal na may apoy at mga anak
  choice: Pinanatili sa pangunahing teksto ang idyomang “pinaraan ... sa apoy.”
  alternative: “sinunog” o “inihandog bilang hain sa apoy” ang kanilang mga anak
  rationale: Malakas na ipinahihiwatig ng konteksto ang paghahandog ng mga anak, ngunit hindi tahasang tinutukoy ng mismong idyoma ang eksaktong paraan. Inilalagay sa talababa ang malamang na kahulugan nang hindi inaalis ang tunay na saklaw ng pananalita.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili nito ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maiikling magkakasunod na kilos ng Hebreo, ang tahasang pagbanggit sa mga anak na lalaki at babae, at ang matinding metaporang “ipinagbili nila ang kanilang sarili.”
