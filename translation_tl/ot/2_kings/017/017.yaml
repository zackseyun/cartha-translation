  to: Pinaraan nila sa apoy[a] ang kanilang mga anak na lalaki at babae. Nagsagawa sila ng panghuhula at nagbigay-kahulugan sa mga palatandaan. Ipinagbili nila ang kanilang sarili upang gawin ang masama sa paningin ni Yahweh, at sa gayo’y galitin siya.
