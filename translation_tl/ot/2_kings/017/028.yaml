base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: tl
  text: Pagkatapos, dumating ang isa sa mga paring ipinatapon nila mula sa Samaria. Nanirahan siya sa Bethel at tinuruan niya ang mga tao kung paano sila dapat matakot kay Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: YHWH, ang banal na pangalan ng Diyos; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: Ipinapaliwanag ang anyo at tradisyonal na salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, dumating
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: ang isa sa mga pari
  rationale: Tuwirang ipinahahayag ng parirala ang isang taong kabilang sa mas malaking pangkat ng mga pari.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: ipinatapon nila mula sa Samaria
  rationale: Ang Hiphil ng גלה ay nangangahulugang dalhin o ipatapon sa pagkabihag. Pinananatili ng “nila” ang di-tinukoy na maramihang tagaganap sa Hebreo.
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: Nanirahan siya sa Bethel
  rationale: Ang ישב dito ay tumutukoy sa paninirahan; ang “nanirahan” ay natural at hindi labis na nagpapahiwatig ng permanenteng paninirahan.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: at tinuruan niya ang mga tao
  rationale: Ang היה na may participle ay maaaring magpahiwatig ng nagpapatuloy o kinagawiang gawain. Ang “tinuruan niya” ay malinaw sa salaysay; ginawang “ang mga tao” ang panghalip upang maging natural at malinaw sa Filipino.
- source_word: אֵיךְ יִירְאוּ
  choice: kung paano sila dapat matakot
  rationale: Pinananatili nito kapwa ang ideya ng paraan (“kung paano”) at ang normatibong diwa ng tagubilin (“dapat”).
- source_word: אֶת יְהוָה
  choice: kay Yahweh
  rationale: Isinasatitik ang personal na pangalang יְהוָה bilang “Yahweh,” habang ang panandang “kay” ay likas sa Filipino para sa personal na pangalan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan, habang inilalahad sa talababa ang tradisyonal na salin.
- issue: Kahulugan ng “matakot kay Yahweh”
  choice: matakot kay Yahweh
  alternative: gumalang kay Yahweh
  rationale: Pinananatili ang masaklaw at may teolohikal na tensiyong kahulugan ng ירא, na maaaring sumaklaw sa takot, pagpipitagan, at pagsunod, sa halip na paliitin ito sa “paggalang” lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap ang mahabang sugnay na Hebreo upang maging madaling maunawaan nang hindi binabago ang pagkakasunod-sunod ng pangyayari. Inilagay ang talababa sa “Yahweh,” na siyang aktuwal na tinutukoy nito.
