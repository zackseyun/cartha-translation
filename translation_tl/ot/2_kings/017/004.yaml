  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: tl
  text: At natuklasan ng hari ng Asiria na may sabwatan si Hosea[a], sapagkat nagsugo siya ng mga sugo kay So, na hari ng Ehipto[b], at hindi siya nagpadala ng tributo sa hari ng Asiria taun-taon.[c] Kaya dinakip siya ng hari ng Asiria at iginapos sa bilangguan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakakita ng pagtataksil kay Hosea.” Literal sa Hebreo, “nakakita ng sabwatan kay Hosea,” isang idyoma para sa pagkakatuklas ng kaniyang lihim na pagtataksil.
    reason: lexical_alternative
  - marker: b
    text: Ang “So” ay transliterasyon ng pangalang Hebreo. Hindi tiyak kung sinong hari ng Ehipto ang tinutukoy.
    reason: cultural_note
  - marker: c
    text: Literal, “hindi nagpaakyat ng tributo … gaya ng taon-taon”; ibig sabihin, hindi niya ipinadala o binayaran ang tributo taun-taon.
    reason: lexical_alternative
  - marker: d
    text: 'Dalawang magkasunod na kilos ang ipinapahayag ng Hebreo: una, dinakip o pinigil ng hari ng Asiria si Hosea; pagkatapos, iginapos niya ito sa bilangguan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: natuklasan
  rationale: Ipinahihiwatig ng pandiwa rito ang pagkakatuklas sa isang lihim na gawain, hindi lamang ang karaniwang ‘pagkakita.’
- source_word: קֶשֶׁר
  choice: sabwatan
  rationale: Tumutukoy ito sa lihim na balak na may katangiang pampolitika o mapaghimagsik.
- source_word: בְּהוֹשֵׁעַ
  choice: na may sabwatan si Hosea
  rationale: Isinasalin nang natural sa Tagalog ang Hebreong idyomang literal na ‘nakakita ng sabwatan kay Hosea,’ nang hindi tinutukoy kung sino pa ang kasabwat.
- source_word: שָׁלַח מַלְאָכִים
  choice: nagsugo siya ng mga sugo
  rationale: Ang מַלְאָכִים ay maaaring mga mensahero o diplomatikong sugo; ang konteksto ang nagpapakita ng kanilang tungkulin.
- source_word: סוֹא
  choice: So
  rationale: Pinananatili ang transliterasyon ng pangalang Hebreo dahil hindi tiyak ang historikal na pagkakakilanlan ng pinunong ito.
- source_word: מִנְחָה
  choice: tributo
  rationale: Sa ugnayan ng isang sakop na hari at ng Asiria, ang ‘tributo’ ang angkop na kahulugang pampolitika ng salita.
- source_word: הֶעֱלָה
  choice: nagpadala
  rationale: Natural itong katumbas sa Tagalog sa konteksto ng pagpapadala ng tributo; iniiwasan ang di-likas na literal na ‘iniakyat.’
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: taunang
  rationale: Malinaw at natural na ipinahahayag ang regular na pagbabayad taon-taon.
- source_word: וַיַּעַצְרֵהוּ
  choice: dinakip siya
  rationale: Ipinapakita ang unang kilos ng pagpigil o pagdetine bago ang paggapos at pagkabilanggo.
- source_word: וַיַּאַסְרֵהוּ
  choice: iginapos
  rationale: Pinananatili ang pangunahing kahulugan na ‘ginapos’ at ang pagkakaiba nito sa naunang pagdakip.
- source_word: בֵּית כֶּלֶא
  choice: sa bilangguan
  rationale: Ito ang natural at dignified na salin ng literal na ‘bahay ng pagkakakulong.’
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘Asiria,’ ‘Ehipto,’ ‘Hosea,’ ‘sugo,’ ‘tributo,’ at ‘bilangguan’ bilang mga salitang karaniwan at angkop sa salaysay na historikal. Pinanatili sa mga talababa ang literal na Hebreong mga idyoma at ang kawalang-katiyakan tungkol kay So.
