    issue: Idinagdag ng “hindi na” ang aspektong ‘no longer.’
    rationale: Sinasabi lamang ng Hebreo na hindi siya nagpadala/nag-angat ng tributo taon-taon; hindi nito tahasang sinasabing tumigil siya matapos itong dati niyang gawin.
