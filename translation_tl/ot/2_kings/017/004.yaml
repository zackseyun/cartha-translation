  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng sabwatan, diplomatikong pagsusugo kay So, tributo, at ang magkasunod na pagdakip at paggapos/pagkabilanggo. Gayunman, ang “hindi na siya nagpadala” ay nagdaragdag ng aspektong “hindi na” na wala sa Hebreo. Ang וַ־ sa simula ay mas angkop na “At” kaysa sa kontrastibong “Ngunit.”
  naturalness: Malinaw at natural ang modernong Tagalog. Ang “At” at ang “taun-taon” ay mas tuwirang nagsasaad ng daloy at iteratibong kahulugan ng Hebreo nang walang idinagdag na implikasyon.
  terminology: Ang “Asiria,” “Hosea,” “Ehipto,” “sugo,” “tributo,” at “bilangguan” ay angkop at pare-pareho ang rehistro. Ang pangalang “So” ay wastong pinanatili bilang transliterasyon.
