  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: tl
  text: Nagtayo sila para sa kanilang sarili ng mga sagradong haliging bato at mga poste ni Ashera[a] sa bawat mataas na burol at sa ilalim ng bawat luntiang puno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Asherim”; ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa pagsambang kaugnay ni Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: Nagtayo sila
  rationale: Ang Hiphil ng נצב ay nangangahulugang magtayo o maglagay nang patayo; natural ang “nagtayo” para sa mga bagay na panrelihiyon.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: 'Ipinahahayag ang datibong may diwang pansarili: itinayo nila ang mga bagay na ito para sa sarili nilang paggamit.'
- source_word: מַצֵּבוֹת
  choice: mga sagradong haliging bato
  rationale: Tumutukoy ito sa mga batong itinayong patayo bilang mga bagay na ginagamit sa pagsamba. Nililinaw ng “sagradong” ang kontekstong panrelihiyon, at ng “bato” ang pisikal na anyo.
- source_word: וַאֲשֵׁרִים
  choice: mga poste ni Ashera
  rationale: Ang anyong maramihan ay tumutukoy sa mga bagay na panrelihiyong kaugnay ni Ashera, hindi kinakailangang sa diyosa mismo. Madaling maunawaan ang “mga poste ni Ashera,” habang ipinaliliwanag sa talababa ang hindi tiyak na eksaktong anyo ng mga ito.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: sa bawat mataas na burol
  rationale: Tuwirang pinananatili ang pisikal na larawan at ang pormulang tumutukoy sa mga pook ng bawal na pagsamba.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: at sa ilalim ng bawat luntiang puno
  rationale: Ang רַעֲנָן ay naglalarawan ng sariwa, mayabong, at madahong halaman; natural at marangal sa modernong Filipino ang “luntiang puno.”
theological_decisions:
- issue: Pagpapakahulugan sa אֲשֵׁרִים
  choice: mga poste ni Ashera
  alternative: mga Asherim; mga imahen ni Ashera
  rationale: Pinananatili nito ang ugnayan sa pangalang Ashera nang hindi ipinapalagay na tiyak na imahen ng diyosa ang tinutukoy. Ang talababa ay kumikilala sa leksikal at arkeolohikal na kawalang-katiyakan tungkol sa eksaktong anyo ng mga bagay na ito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “sagradong haliging bato” upang maipakita ang kultikong gamit ng מַצֵּבוֹת nang hindi ito mapagkamalang karaniwang haligi, at pinanatili ang pormulang “mataas na burol” at “luntiang puno.”
