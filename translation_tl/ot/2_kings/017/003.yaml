  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: tl
  text: Nagmartsa laban sa kanya si Salmanasar na hari ng Asiria, at si Hosea ay naging lingkod[a] niya at nagbayad sa kanya ng tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging basalyo niya.” Literal na sinasabi ng Hebreo, “naging lingkod niya,” isang pananalitang tumutukoy rito sa pagpapasailalim sa kapangyarihang pampolitika.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: Nilusob siya
  rationale: Sa kontekstong militar, ang idyomang עָלָה עַל ay tumutukoy sa pagsalakay o paglusob laban sa isang tao. Natural at malinaw sa makabagong Tagalog ang “nilusob siya,” bagaman hindi nito ginagaya ang literal na larawan ng pag-ahon.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Salmanasar
  rationale: Transliterasyong angkop sa nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang isinasalin ang titulong nasa pariralang konstrukt at likas itong basahin bilang panuring kay Salmanasar.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: naging lingkod niya
  rationale: 'Ipinahihiwatig ng konstruksiyon ang pagbabago ng kalagayan: napasailalim si Hosea kay Salmanasar. Pinananatili ng “lingkod” ang salitang pampolitika ng Hebreo nang hindi ito ipinapakahulugang personal na alipin; nililinaw sa talababa ang diwang basalyo.'
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: nagbayad sa kanya ng tributo
  rationale: Sa kontekstong pampolitika, ang parirala ay tumutukoy sa regular na pagbabayad ng tributo ng isang pinunong nasa ilalim ng mas makapangyarihang hari.
- source_word: מִנְחָה
  choice: tributo
  rationale: Bagaman maaari itong mangahulugang handog o regalo sa ibang konteksto, dito ay malinaw na tributo ng isang nasasakupang hari.
