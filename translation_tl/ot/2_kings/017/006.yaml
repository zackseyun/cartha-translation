base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: tl
  text: Noong ikasiyam na taon ng paghahari ni Hosea, sinakop ng hari ng Asiria ang Samaria. Ipinatapon[a] niya ang Israel sa Asiria at pinatira sila sa Halah, sa Habor, na ilog ng Gozan,[b] at sa mga lungsod ng Media.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sapilitang dinala sa ibang lupain.” Ang pandiwang Hebreo ay tumutukoy sa sapilitang pag-aalis patungo sa pagkatapon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa tabi ng Habor, ang ilog ng Gozan.” Maaaring inilalarawan ng Hebreo ang paninirahan sa kahabaan ng Ilog Habor sa rehiyon ng Gozan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: Nang ikasiyam na taon ng paghahari ni Hosea
  rationale: Ipinahahayag ng parirala ang ikasiyam na taon ng paghahari ni Hosea; idinagdag ang “paghahari” upang maging malinaw at likas sa makabagong Tagalog.
- source_word: לָכַד
  choice: sinakop
  rationale: Sa konteksto ng isang lungsod at digmaan, malinaw na ipinahihiwatig nito ang pagkuha sa pamamagitan ng pananakop.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: hari ng Asiria
  rationale: Tuwirang salin ng Hebrew construct chain at likas na katawagan sa Tagalog.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Karaniwang anyo ng pangalan ng lungsod sa Tagalog na tradisyong biblikal.
- source_word: וַיֶּגֶל אֶת יִשְׂרָאֵל
  choice: Ipinatapon niya ang Israel
  rationale: Ang causative na anyo ng גלה ay tumutukoy sa sapilitang pag-aalis patungo sa pagkatapon. Pinanatili ang “Israel” bilang kolektibong pangalan ng bayan.
- source_word: אַשּׁוּרָה
  choice: sa Asiria
  rationale: Ipinakikita ng directional he ang patutunguhan; likas sa Tagalog ang “sa Asiria” para sa sapilitang paglilipat doon.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: at pinatira sila
  rationale: Ang Hiphil ng ישׁב ay nangangahulugang pinamuhay o pinatahan sila sa mga tinukoy na lugar; “pinatira” ang pinakanatural na makabagong Tagalog.
- source_word: בַּחְלַח
  choice: sa Halah
  rationale: Pangalan ng lugar na may pang-ukol na ב.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: sa tabi ng Habor, ang ilog ng Gozan
  rationale: Yamang tinutukoy ng kasunod na parirala ang Habor bilang ilog, ipinahahayag ng “sa tabi” ang paninirahan sa kahabaan nito habang pinananatili ang appositional na “ang ilog ng Gozan.”
- source_word: וְעָרֵי מָדָי
  choice: at sa mga lungsod ng Media
  rationale: Tuwirang inilalarawan ang mga lungsod na kabilang sa lupain o rehiyon ng Media.
theological_decisions:
- issue: Ang “Israel” bilang kolektibong pangalan
  choice: Pinanatili ang “Israel” sa isahan bilang pangalan ng bayan.
  alternative: ang mga Israelita
  rationale: Pinananatili nito ang pambansa at kolektibong anyo ng אֶת יִשְׂרָאֵל nang hindi nililimitahan o binabago ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Hinati sa dalawang pangungusap upang maging madaling basahin sa Tagalog nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari. Inilipat ang marker [a] sa “Ipinatapon,” dahil dito nauukol ang leksikal na paliwanag.
