id: 2KI.17.15
reference: 2 Kings 17:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: tl
  text: Itinakwil nila ang kanyang mga tuntunin, ang kanyang tipang ginawa niya sa kanilang mga ninuno, at ang kanyang mga patotoo na ginamit niya upang balaan sila. Sumunod sila sa walang kabuluhan at sila mismo ay naging walang kabuluhan[a], at sumunod sila sa mga bansang nakapaligid sa kanila. Iniutos ni Yahweh sa kanila na huwag silang gumawa gaya ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Hebreo ay gumagamit ng magkaugnay na mga salita: sumunod sila sa “walang kabuluhan” at sila mismo ay “naging walang kabuluhan.” Maaari rin itong mangahulugang kawalan ng saysay o kahungkagan at, sa kontekstong ito, maaaring tumukoy sa mga diyus-diyosan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Itinakwil nila
  rationale: Malinaw na ipinapahayag ang sinadyang pagtanggi o pagsuway nang hindi dinaragdagan ang emosyonal na kulay ng Hebreo.
- source_word: חֻקָּיו
  choice: ang kanyang mga tuntunin
  rationale: Likas sa modernong Tagalog at pinananatili ang legal at pangtipang diwa ng חֻקִּים.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: ang kanyang tipang ginawa niya
  rationale: Ang literal na idyomang Hebreo ay ‘pinutol ang tipan,’ ngunit ‘ginawa ang tipan’ ang natural na katumbas sa Tagalog.
- source_word: אֲבוֹתָם
  choice: kanilang mga ninuno
  rationale: Bagaman literal na ‘mga ama,’ ang parirala rito ay tumutukoy sa naunang salinlahi ng Israel; ‘mga ninuno’ ang malinaw at likas na salin sa Tagalog.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: kanyang mga patotoo na ginamit niya upang balaan sila
  rationale: Pinananatili ng ‘mga patotoo’ ang pangtipang termino, habang ipinakikita ng ‘balaan’ ang puwersa ng Hiphil na הֵעִיד at ng instrumental na בָּם.
- source_word: הַהֶבֶל וַיֶּהְבָּלוּ
  choice: ang walang kabuluhan at sila mismo ay naging walang kabuluhan
  rationale: 'Pinananatili ang sadyang paglalaro sa magkaugnay na pangngalan at pandiwa: naging katulad sila ng walang-saysay na kanilang sinundan.'
- source_word: וְאַחֲרֵי הַגּוֹיִם
  choice: at tinularan nila ang mga bansa
  rationale: Ang literal na ‘sumunod sa mga bansa’ ay idiomatikong tumutukoy sa paggaya sa kanilang mga gawain; nililinaw ito ng kasunod na utos na huwag silang tularan.
- source_word: סְבִיבֹתָם
  choice: nakapaligid sa kanila
  rationale: Direkta at natural na salin ng lokatibong paglalarawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang tipan ayon sa anyong Yahweh sa halip na palitan ng titulo.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: huwag nilang tularan
  rationale: Natural na Tagalog para sa literal na ‘huwag gumawa na gaya nila,’ at malinaw na tumutukoy sa paggaya sa mga gawa ng nakapaligid na mga bansa.
theological_decisions:
- issue: Paglalarawan sa הֶבֶל bilang posibleng pagtukoy sa mga diyus-diyosan
  choice: walang kabuluhan
  alternative: mga diyus-diyosan
  rationale: Pinananatili ang metaporang ‘walang kabuluhan’ at ang paglalaro ng mga salita sa kasunod na pandiwa, nang hindi tahasang nilulutas ang ipinahihiwatig na pagtukoy sa mga diyus-diyosan.
- issue: Kahulugan ng עֵדְוֹתָיו ... הֵעִיד בָּם
  choice: mga patotoo na ginamit niya upang balaan sila
  alternative: mga patotoo na kanyang ipinahayag laban sa kanila
  rationale: Ipinahahayag ang kontekstuwal na diwa ng taimtim na babala, habang pinananatili sa talababa ang posibleng hudisyal na diwa ng pagpapatotoo laban sa kanila.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘tuntunin,’ ‘tipan,’ at ‘patotoo’ upang mapanatili ang pangtipang bokabularyo. Iniwasan ang sobrang literal na mga pariralang magiging asiwa sa Tagalog, ngunit pinanatili sa pangunahing teksto at talababa ang wordplay at tunay na mga alternatibong kahulugan.
