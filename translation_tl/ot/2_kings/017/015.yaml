revisions:
- from: Itinakwil nila ang kanyang mga tuntunin at ang kanyang tipang ginawa niya sa kanilang mga ninuno, pati ang kanyang mga patotoo na ginamit niya upang balaan sila. Sinundan nila ang walang kabuluhan at sila mismo ay naging walang kabuluhan[a], at tinularan nila ang mga bansang nakapaligid sa kanila[b]—mga bansang iniutos ni Yahweh na huwag nilang tularan.
  to: Itinakwil nila ang kanyang mga tuntunin, ang kanyang tipang ginawa niya sa kanilang mga ninuno, at ang kanyang mga patotoo na ginamit niya upang balaan sila. Sumunod sila sa walang kabuluhan at sila mismo ay naging walang kabuluhan[a], at sumunod sila sa mga bansang nakapaligid sa kanila. Iniutos ni Yahweh sa kanila na huwag silang gumawa gaya ng mga ito.
  rationale: Pinalitan ang interpretatibong “tinularan” ng “sumunod,” upang mapanatili ang pag-uulit ng אַחֲרֵי (“sumunod sa”) sa dalawang layon. Inayos ang pangwakas na sugnay bilang hiwalay na pangungusap upang malinaw na ang utos ni Yahweh ay para sa Israel at ang ipinagbabawal ay ang paggawa gaya ng mga nakapaligid na bansa. Inalis ang hindi kailangang talababa b at pinanatili ang talababa para sa mahalagang wordplay at saklaw ng הֶבֶל.
