  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: tl
  text: At sinunod ng mga anak ni Israel ang lahat ng kasalanang ginawa ni Jeroboam; hindi sila lumihis mula rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula rito,” na may pambabaeng hulaping isahan. Malamang na kolektibo itong tumutukoy sa makasalanang landas o huwarang kababanggit pa lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: nagpatuloy
  rationale: Ang הלך na may ב ay tumutukoy rito sa pamumuhay o patuloy na pagsunod sa isang asal. Mas likas sa modernong Tagalog ang “nagpatuloy ... sa” kaysa literal na “lumakad sa,” habang napapanatili ang diwa ng tuloy-tuloy na gawain.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang pambansa at tipanang pananalita ng Hebreo, at malinaw pa rin ito sa karaniwang mambabasang Tagalog.
- source_word: בְּכָל חַטֹּאות
  choice: sa lahat ng kasalanan
  rationale: Tuwirang inililipat ang lawak na ipinahihiwatig ng בְּכָל at ang maramihang חַטֹּאות bilang kabuuan ng masasamang gawaing tinutukoy.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa
  rationale: Ang עשה ay karaniwang “gumawa.” Sa Tagalog, natural ang “ginawang kasalanan” nang hindi kinakailangang dagdagan ang teksto ng mas tiyak na pandiwang wala sa Hebreo.
- source_word: לֹא סָרוּ
  choice: hindi nila tinalikuran
  rationale: Ipinapahayag ng סור ang paglihis o pagtalikod. Ang “tinalikuran” ay natural at malinaw na nagsasaad na hindi sila huminto sa tinutukoy na makasalanang landas.
- source_word: מִמֶּנָּה
  choice: ang mga iyon
  rationale: Bagaman pambabaeng isahan ang hulapi sa Hebreo, pinakamalinaw sa Tagalog ang pagtukoy sa kalapit na maramihang “mga kasalanan.” Inilalahad sa talababa ang tunay na anyong isahan at ang posibleng kolektibong pagtukoy nito.
theological_decisions:
- issue: Ang tinutukoy ng hulaping isahan sa מִמֶּנָּה pagkatapos ng maramihang “mga kasalanan”
  choice: Isinalin sa pangunahing teksto bilang “ang mga iyon,” na tumutukoy sa mga kasalanan ni Jeroboam bilang kabuuan.
  alternative: “iyon,” na tumutukoy sa iisang kolektibong makasalanang landas o gawain.
  rationale: Hindi tiyak sa gramatika lamang kung anong kolektibong ideya ang tinutukoy ng pambabaeng isahan. Ang maramihang anyo ay mas natural sa Tagalog dahil ang pinakamalapit na hayag na tinutukoy ay “mga kasalanan,” ngunit pinananatili ng talababa ang tunay na tensiyon sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “nagpatuloy” upang natural na maipahayag ang idyomatikong moral na gamit ng “lumakad,” at pinanatili ang “mga anak ni Israel” bilang pambansa at tipanang katawagan.
