reference: 2 Kings 17:26
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: tl
  text: Sinabi nila sa hari ng Asiria, “Hindi alam ng mga bansang ipinatapon mo at pinatira sa mga lungsod ng Samaria ang tuntunin ng diyos ng lupain[a]. Kaya nagpadala siya ng mga leon sa gitna nila, at ngayo’y pinapatay sila ng mga ito dahil hindi nila alam ang tuntunin ng diyos ng lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Diyos ng lupain.” Ang tinutukoy ay ang Diyos ng Israel, ngunit ipinakikita ng maliit na titik sa pangunahing teksto ang pananaw ng mga nagsasalita, na itinuturing siyang diyos na nakaugnay sa lupain.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa maraming pangkat ng mga taong sapilitang inilipat ng Asiria. Pinananatili ng “mga bansa” ang kolektibo at pampolitikang diwa nang hindi ipinapasok ang mga kaugnay na kahulugan ng “mga Hentil” sa Bagong Tipan.
- source_word: הִגְלִיתָ
  choice: ipinatapon mo
  rationale: Ang Hiphil ng גלה ay nagsasaad ng sapilitang pagpapaalis at pagpapatapon; natural at malinaw ito sa modernong Tagalog.
- source_word: וַתּוֹשֶׁב
  choice: at pinatira
  rationale: 'Pinananatili nito ang causative na diwa ng pandiwa: ang hari ang naglagay sa mga taong iyon upang manirahan sa bagong lugar.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: sa mga lungsod ng Samaria
  rationale: Tuwirang isinasalin ang construct phrase at ipinakikitang saklaw nito ang mga lungsod sa rehiyon ng Samaria, hindi lamang ang kabiserang lungsod.
- source_word: מִשְׁפַּט
  choice: tuntunin
  rationale: Sa kontekstong ito, tumutukoy ito sa nararapat o itinakdang paraan ng pagsamba sa diyos na inuugnay sa lupain. Ang “tuntunin” ay kayang saklawin ang batas, kaugalian, at kinakailangang gawain nang hindi labis na nililimitahan ang kahulugan.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: diyos ng lupain
  rationale: Pinananatili ng maliit na titik ang pananaw ng mga nagsasalita, na wari’y itinuturing ang Diyos ng Israel bilang isang diyos na nakaugnay sa isang teritoryo, habang hindi itinatanggi kung sino ang tinutukoy sa mas malawak na salaysay.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Kaya nagpadala siya ng mga leon sa gitna nila
  rationale: Ipinahahayag ng “kaya” ang sanhi at bunga sa iniulat na pangangatwiran; ang “sa gitna nila” ay natural na katumbas ng בם.
- source_word: וְהִנָּם
  choice: at ngayo’y
  rationale: Sa halip na artipisyal na “narito,” inihahatid ng “ngayo’y” ang biglaan at malinaw na pagtukoy sa kasalukuyang kalagayang iniulat ng mga nagsasalita.
- source_word: מְמִיתִים אוֹתָם
  choice: pinapatay sila ng mga ito
  rationale: Ipinakikita ng aspektong imperpektibo ang nagpapatuloy na pagkamatay. Nililinaw ng “mga ito” na ang mga leon ang gumagawa ng pagpatay.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: dahil hindi nila alam
  rationale: Malinaw at natural na ipinapahayag ng “dahil” ang sanhi sa konteksto.
theological_decisions:
- issue: Kung gagamit ng malaking titik sa “Diyos” sa pariralang אֱלֹהֵי הָאָרֶץ
  choice: 'maliit na titik: “diyos ng lupain”'
  alternative: 'malaking titik: “Diyos ng lupain”'
  rationale: Ang pananalita ay nag-uulat ng pananaw ng mga taong tumitingin sa Diyos ng Israel na para bang isang diyos na saklaw lamang ang isang lupain. Pinananatili ng maliit na titik ang kanilang perspektiba at ang tensiyong teolohikal ng salaysay.
- issue: Saklaw ng מִשְׁפַּט sa kontekstong panrelihiyon
  choice: “tuntunin”
  alternative: “batas,” “kaugalian,” o “itinakdang paraan ng pagsamba”
  rationale: Hindi tiyak na purong kodigong legal o karaniwang kaugalian lamang ang tinutukoy. Ang “tuntunin” ay nagpapanatili ng mas malawak na saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Asiria,” “Samaria,” at “mga leon” bilang karaniwang anyong biblikal. Iniwasan ang lipas na “narito” para sa וְהִנָּם at ang masyadong teknikal na paliwanag sa mismong talata. Ang marker na [a] ay nakalagay kaagad pagkatapos ng pariralang ipinaliliwanag nito.
