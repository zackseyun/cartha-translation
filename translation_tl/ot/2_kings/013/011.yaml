base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh. Hindi niya tinalikuran ang alinman sa mga kasalanan ni Jeroboam na anak ni Nebat, na nagbunsod sa Israel na magkasala; namuhay siya ayon sa mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “namuhay siya ayon doon.” Isahan ang panghalip sa Hebreo at maaaring tumukoy nang sama-sama sa makasalanang landas ni Jeroboam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Ginawa niya ang masama
  rationale: Pinananatili ang karaniwang pormula ng moral na paghatol sa Mga Hari sa natural at tuwirang Tagalog.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Natural na idyomang Tagalog ito na nagpapanatili sa talinghaga ng Hebreo at sa banal na pangalang YHWH.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Hindi niya tinalikuran ang alinman sa mga kasalanan
  rationale: Sa kontekstong negatibo, malinaw na ipinahihiwatig ng מִכָּל na wala siyang iniwang kahit isa sa mga kasalanan.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Karaniwang makabagong Tagalog para sa patronimikong Hebreo.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na nagbunsod sa Israel na magkasala
  rationale: Ipinapahayag ng Hiphil ng חטא ang pag-akay o pagiging sanhi ng pagkakasala. Ang sugnay ay natural na maiuugnay kay Jeroboam, ang pinakamalapit na panlalaking isahang antecedent.
- source_word: בָּהּ הָלָךְ
  choice: namuhay siya ayon sa mga iyon
  rationale: Ipinahahayag ang idyomatikong diwa ng הלך bilang paraan ng pamumuhay, habang iniuugnay ito sa naunang mga kasalanan. Ipinaliliwanag sa talababa ang isahang anyo ng panghalip sa Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang natatanging pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pinatutungkulan ng אֲשֶׁר sa sugnay tungkol sa pagkakasala ng Israel
  choice: Jeroboam ang nagbunsod sa Israel na magkasala
  alternative: Ang mga kasalanan ni Jeroboam ang naging paraan ng pagbunsod niya sa Israel na magkasala
  rationale: Ang panlalaking isahang anyo ng pandiwa at ang pinakamalapit na antecedent na Jeroboam ay sumusuporta sa personal na paksa, ngunit hindi pinalalawak ang pahayag lampas sa teksto.
- issue: Isahang panghalip בָּהּ kasunod ng maramihang ‘mga kasalanan’
  choice: ayon sa mga iyon, na may talababa
  alternative: ayon doon; sa landas na iyon
  rationale: Natural sa Tagalog ang maramihang pagtukoy, ngunit mahalagang huwag ikubli na isahan ang anyo sa Hebreo at maaaring tumukoy nang sama-sama sa makasalanang landas ni Jeroboam.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormula ng paghatol sa Mga Hari at ang talinghaga ng pamumuhay ayon sa isang landas, nang hindi gumagamit ng lipas o sektaryang pananalita.
