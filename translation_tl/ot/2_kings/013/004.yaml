  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: tl
  text: Nang magkagayon, humingi ng lingap si Jehoahaz kay Yahweh[a], at pinakinggan siya ni Yahweh, sapagkat nakita niya ang pang-aaping dinaranas ng Israel, sapagkat inaapi sila ng hari ng Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nakiusap kay Yahweh.” Sa literal, ang idyomang Hebreo ay “pinalambot ang mukha ni Yahweh,” na nangangahulugang humingi ng kanyang lingap.
    reason: lexical_alternative
  - marker: b
    text: Ang Aram ang pangalang Hebreo sa lupaing madalas tawaging “Syria” sa mas matatandang salin.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: humingi ng lingap ... kay Yahweh
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagsusumamo o paghahangad ng pabor, hindi sa literal na mukha. Likas sa modernong Tagalog ang “humingi ng lingap” at hindi nito pinalalakas nang higit sa teksto ang tugon ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: pinakinggan siya
  rationale: Ipinahihiwatig ng שׁמע na may kasamang אֶל ang pakikinig o pagbibigay-pansin, hindi lamang ang pisikal na pagkarinig.
- source_word: כִּי רָאָה
  choice: sapagkat nakita niya
  rationale: 'Pinananatili ang malinaw na ugnayang sanhi: nakinig si Yahweh dahil nakita niya ang kalagayan ng Israel.'
- source_word: לַחַץ ... לָחַץ
  choice: pang-aapi ... inaapi
  rationale: Ginagamit ang magkaugnay na pangngalan at pandiwa upang maipakita ang pag-uulit ng ugat sa Hebreo at ang konkretong pang-aaping militar at pampolitika.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang Hebreong pangalan ng lupain sa halip na gamitin ang mas huling katawagang Syria.
theological_decisions:
- issue: Paglalarawan sa pagsusumamo ni Jehoahaz sa Diyos
  choice: humingi ng lingap kay Yahweh
  alternative: nakiusap kay Yahweh; pinalambot ang mukha ni Yahweh
  rationale: Ipinahahayag ang idyomatikong diwa ng paghiling ng pabor nang hindi literal na inililipat ang “mukha” o ipinapalagay na kailangang pahupain ang galit ng Diyos.
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang inililipat ang pangalang tipan na nasa tekstong Hebreo at iniiwasang palitan ito ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lingap” bilang madaling maunawaang salita para sa pabor o mabuting pagtanggap, at pinanatili ang pag-uulit na “pang-aapi/inaapi” upang umalingawngaw ang Hebreong λַחַץ/לָחַץ.
