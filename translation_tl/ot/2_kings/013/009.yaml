base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: tl
  text: Nahimlay si Jehoahaz kasama ng kanyang mga ninuno, at inilibing nila siya sa Samaria. At ang anak niyang si Joas[a] ang naghari bilang kapalit niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Joas ay isinasalin ding Jehoas sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: Nahimlay
  rationale: Ang pandiwa, kasama ng pariralang “kasama ng kanyang mga ninuno,” ay pormulang tumutukoy sa pagkamatay ng hari. Pinananatili ng “nahimlay” ang larawan ng paghiga o pamamahinga nang hindi gumagamit ng masyadong tuwirang pagpapaliwanag na “namatay.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Bagaman literal na “kasama ng kanyang mga ama,” ang “mga ninuno” ang likas at malinaw na katumbas sa modernong Tagalog para sa nakaugaliang pormula tungkol sa kamatayan ng isang hari.
- source_word: וַיִּקְבְּרֻהוּ
  choice: inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwa at ang di-tiyak na pangmaramihang simuno ng Hebreo.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang pang-ukol na בְּ ay nagsasaad dito ng lugar ng paglilibing; natural sa Tagalog ang “sa Samaria.”
- source_word: וַיִּמְלֹךְ
  choice: ang naghari
  rationale: Sa salaysay ng paghalili sa trono, ipinahihiwatig ng pandiwa kapwa ang pagluklok at paghahari. Ang “naghari” ay maikli at likas sa ganitong pormula.
- source_word: תַּחְתָּיו
  choice: bilang kapalit niya
  rationale: Malinaw nitong ipinapahayag ang paghalili sa trono at pinananatili ang diwa ng pagiging kahalili o kapalit.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Transliterasyon ng pangalang Hebreo sa anyong madaling makilala ng mga modernong mambabasang Tagalog.
- source_word: יוֹאָשׁ
  choice: Joas
  rationale: Ginamit ang nakasanayang anyong Filipino ng pangalang יוֹאָשׁ; inilagay sa talababa ang mas mahabang kaugnay na anyo ng pangalan.
theological_decisions:
- issue: Kahulugan ng pormulang וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: Nahimlay ... kasama ng kanyang mga ninuno
  alternative: Namatay at sumama sa kanyang mga ninuno
  rationale: Hindi tahasang pinapalitan ng “namatay” ang larawang nasa Hebreo. Pinananatili nito ang tradisyonal na pormula nang hindi nagdaragdag ng paliwanag tungkol sa kalagayan ng tao pagkamatay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “nahimlay” upang mapanatili ang larawang Hebreo at ang “mga ninuno” sa halip na literal ngunit hindi likas na “mga ama.” Inilipat ang talababa sa pangalang Joas, na siyang aktuwal na tinutukoy nito.
