  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban sa Israel, at ibinigay niya sila sa kamay[a] ni Hazael na hari ng Aram[b] at sa kamay ni Ben-hadad na anak ni Hazael sa buong panahong iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa kamay” ay idyomang Hebreo na nangangahulugang nasa kapangyarihan o pamamahala ng isang tao.
    reason: lexical_alternative
  - marker: b
    text: Ang Aram ang pangalang Hebreo sa lupaing madalas tawaging Siria sa ilang salin.
    reason: alternative_reading
  - marker: c
    text: Sa literal, “sa lahat ng mga araw,” ibig sabihin, sa buong panahong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang matingkad na Hebreong idyoma ng nag-aapoy na galit, habang natural at malinaw sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Kapag kaugnay ng galit, ipinahihiwatig ng pang-ukol ang galit na nakatuon laban sa Israel.
- source_word: וַיִּתְּנֵם
  choice: ibinigay niya sila
  rationale: Pinananatili ang pangunahing kahulugan ng נתן at ang larawan ng kasunod na idyomang 'sa kamay,' nang hindi labis na ipinapaliwanag ang militar na pagsupil.
- source_word: בְּיַד
  choice: sa kamay
  rationale: Pinananatili ang Hebreong larawan ng kamay bilang kapangyarihan o pamamahala; nauunawaan din ang idyomang ito sa Tagalog, at nililinaw sa talababa.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazael na hari ng Aram
  rationale: Isinasatitik ang pangalang pantangi at pinananatili ang Hebreong pangalang heograpiko na Aram.
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Ben-hadad na anak ni Hazael
  rationale: Pinananatiling tahasan ang ugnayang ama at anak gaya ng nasa Hebreo.
- source_word: כָּל הַיָּמִים
  choice: sa buong panahong iyon
  rationale: Likas na Tagalog ito para sa patuloy na tagal na tinutukoy ng konteksto, nang hindi ipinapalagay na literal na bawat araw ang diin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangngalang pantangi ang tahasang ginamit sa Hebreo; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagkilos ng Diyos sa paghatol sa Israel
  choice: ibinigay niya sila sa kamay
  alternative: pinahintulutan niyang mapasailalim sila
  rationale: Tahasan sa pandiwang Hebreo na si Yahweh ang gumawa ng pagkilos. Hindi ito pinalalambot bilang pagpapahintulot lamang, kaya napapanatili ang teolohikal na bigat ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matingkad na larawang “nag-alab ang galit” at ang idyomang “sa kamay,” habang nilinaw ang huli sa talababa. Ginamit ang “sa buong panahong iyon” upang natural na maipahayag ang duratibong diwa ng pariralang Hebreo.
