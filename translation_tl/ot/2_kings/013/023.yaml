  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: tl
  text: Ngunit nagpakita sa kanila ng kagandahang-loob si Yahweh at nahabag sa kanila. Nilingap niya sila dahil sa kanyang tipan kina Abraham, Isaac, at Jacob. Hindi niya nais na lipulin sila, at hindi niya sila itinaboy mula sa kanyang harapan hanggang ngayon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּחָן
  choice: nagpakita sa kanila ng kagandahang-loob
  rationale: Ipinahahayag ng חנן ang mapagbiyayang paglingap o pabor. Natural ito sa makabagong Filipino at hindi nito pinapantay ang salita sa kasunod na habag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיְרַחֲמֵם
  choice: nahabag sa kanila
  rationale: Ang רחם ay tumutukoy sa malalim na awa at habag; maikli, malinaw, at marangal ang 'nahabag' sa Filipino.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: Muli niya silang nilingap
  rationale: Ang literal na pagharap o pagbaling sa kanila ay nagpapahiwatig dito ng mabuting pansin. Pinananatili ng 'muling nilingap' ang relational na larawan sa natural na Filipino, bagaman ang 'muli' ay kontekstuwal na pahiwatig, hindi hiwalay na salitang Hebreo.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: dahil sa kanyang tipan
  rationale: Ipinapakita ng לְמַעַן ang saligan o dahilan ng pagkilos ni Yahweh. Ang parirala ay natural at hindi nagdaragdag ng paliwanag na teolohikal.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Sa Filipino, sapat at natural ang 'tipan kina' upang ipahayag na ang tipan ay may kaugnayan at ginawa sa mga patriyarka.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Ayaw niya silang lipulin
  rationale: Pinananatili ng 'ayaw' ang volitional na diwa ng אָבָה, samantalang ang 'lipulin' ay angkop sa mapanirang kahulugan ng שׁחת sa kontekstong ito.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: hindi niya sila itinaboy mula sa kanyang harapan
  rationale: Pinananatili ng 'harapan' ang kongkretong larawan ng Hebreong פָּנָיו at ng pagtataboy palayo, nang hindi ito ginagawang mas abstraktong 'presensya' lamang.
- source_word: עַד עָתָּה
  choice: hanggang ngayon
  rationale: Tuwirang ipinapahayag nito ang pagpapatuloy ng kalagayan hanggang sa panahon ng tagapagsalaysay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton. Pinananatili ng 'Yahweh' ang pangalan sa halip na palitan ito ng titulo.
- issue: Ang tipan bilang saligan ng habag at pagpigil sa paglipol
  choice: dahil sa kanyang tipan kina Abraham, Isaac, at Jacob
  alternative: alang-alang sa kanyang tipan kina Abraham, Isaac, at Jacob
  rationale: Maaaring ipahiwatig ng לְמַעַן ang dahilan o ang 'alang-alang sa.' Ang 'dahil sa' ay malinaw na nag-uugnay sa mapagbiyayang pagkilos at katapatan sa tipan nang hindi nagpapasok ng mas huling pormulang doktrinal.
- issue: Paglalarawan sa hindi pagtatakwil ng Israel
  choice: hindi niya sila itinaboy mula sa kanyang harapan hanggang ngayon
  alternative: hindi niya sila itinaboy mula sa kanyang presensya hanggang ngayon
  rationale: Pinananatili ang matinding larawang Hebreo ng pagtapon palayo sa harapan ng Diyos at ang limitasyong temporal na 'hanggang ngayon,' nang hindi ginagawang pahayag tungkol sa walang-hanggang kalagayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kagandahang-loob,' 'nahabag,' 'tipan,' at 'lipulin' bilang mga salitang madaling maunawaan ngunit angkop sa salaysay ng Kasulatan. Walang talababa sapagkat ang alternatibong 'alang-alang sa' ay hindi kailangang ilagay para maingatan ang kahulugan.
