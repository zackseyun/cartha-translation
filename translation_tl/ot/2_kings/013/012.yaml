  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga ginawa ni Joas, ang lahat ng kanyang ginawa, at ang kanyang kagitingan sa pakikipaglaban kay Amazias na hari ng Juda[a]—hindi ba nakasulat ang mga ito sa Aklat ng mga Kasaysayan ng mga Hari ng Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pakikipagdigma laban kay Amazias na hari ng Juda.” Literal na “kasama” ang pang-ukol sa Hebreo, ngunit sa kontekstong militar ay tumutukoy ito sa pakikipaglaban sa isang kalaban.
    reason: lexical_alternative
  - marker: b
    text: Ang “Aklat ng mga Kasaysayan ng mga Hari ng Israel” ay isang talaang maharlika na binabanggit bilang sanggunian sa Mga Hari, hindi ang biblikal na aklat ng Mga Cronica.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Ang iba pang mga ginawa ni Joas
  rationale: Sa pormulang pangwakas tungkol sa paghahari, ang יֶתֶר דִּבְרֵי ay tumutukoy sa iba pang mga gawa o pangyayari sa buhay ng hari, hindi lamang sa kanyang mga salita. Likas sa modernong Tagalog ang “iba pang mga ginawa.”
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng kanyang ginawa
  rationale: Pinananatili nito ang malawak na saklaw ng כָל at ang payak na kahulugan ng עָשָׂה, pati ang sadyang pag-uulit ng diwa sa Hebreo.
- source_word: וּגְבוּרָתוֹ
  choice: at ang kanyang kagitingan
  rationale: Maaaring mangahulugan ang גְּבוּרָה ng lakas, kagitingan, o makapangyarihang mga gawa. Dahil pakikidigma ang kasunod na paglalarawan, ang “kagitingan” ay natural at angkop nang hindi labis na nagpapaliwanag.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: sa pakikipaglaban kay
  rationale: Iniuugnay ng parirala ang kanyang kagitingan sa pakikidigma laban kay Amazias. Karaniwang ginagamit sa Tagalog ang “makipaglaban kay” kahit ang tinutukoy ay isang kalaban; ipinaliliwanag sa talababa ang mapanlabang diwa.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: Amazias na hari ng Juda
  rationale: Gumagamit ng kinagawiang anyong Tagalog ng mga pangalan at malinaw na ikinakabit ang titulong maharlika.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga ito
  rationale: Pinananatili ang retorikal na tanong at ang pasibong anyo ng Hebreo.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: sa Aklat ng mga Kasaysayan ng mga Hari ng Israel
  rationale: Ang “sa” ang likas na Tagalog para sa nilalaman ng isang nakasulat na sanggunian. Ang pamagat ay inilalarawan bilang talaang maharlika at nililinaw sa talababa upang hindi ipagkamali sa kanonikong Mga Cronica.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang retorikal ng Hebreo at ang bahagyang pag-uulit sa “mga ginawa,” habang ginawang likas sa Tagalog ang ugnayan ng “kagitingan” at pakikipaglaban. Ang mga pangalang Joas, Amazias, at Juda ay nasa kinagawiang anyong Tagalog.
