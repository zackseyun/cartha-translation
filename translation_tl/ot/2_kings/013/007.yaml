translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hukbo” ayon sa malinaw na kontekstong militar, at hinati sa dalawang pangungusap para sa likas na daloy. Inilagay ang talababa sa hulihan ng pariralang aktuwal nitong nililinaw.
