base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: tl
  text: Sapagkat walang iniwang hukbo ang hari ng Aram para kay Jehoahaz maliban sa limampung mangangabayo, sampung karwahe, at sampung libong kawal na naglalakad, dahil nilipol niya ang mga ito at ginawa silang parang alabok sa paggiik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “parang alabok na niyuyurakan.” Ang salitang Hebreo ay tumutukoy sa paggiik sa pamamagitan ng pagyurak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: walang itinira
  rationale: Ipinahahayag ng Hiphil ang resultang kakaunti lamang ang naiwang bahagi ng hukbo; natural sa Filipino ang negatibong pariralang ito kasama ng “kundi.”
- source_word: עָם
  choice: hukbo
  rationale: Bagaman karaniwang nangangahulugang “bayan” o “mga tao,” malinaw sa talaan ng mga mangangabayo, karwahe, at kawal na militar ang tinutukoy rito.
- source_word: כִּי אִם
  choice: kundi
  rationale: Pagkatapos ng negatibong pahayag, ipinakikilala ng idyoma ang tanging natira.
- source_word: פָּרָשִׁים
  choice: mangangabayo
  rationale: Tumutukoy ito sa mga mandirigmang nakasakay sa kabayo; malinaw at tradisyonal ang salin.
- source_word: רֶכֶב
  choice: karwahe
  rationale: Sa piling ng bilang, tumutukoy ang kolektibong anyo sa sampung karwaheng pandigma.
- source_word: רַגְלִי
  choice: kawal na naglalakad
  rationale: Tuwirang inilalarawan ang mga kawal na lumalaban nang hindi nakasakay, nang hindi gumagamit ng teknikal na hiram na salita.
- source_word: אִבְּדָם
  choice: nilipol sila
  rationale: Malakas ang Piel ng אבד at nagpapahiwatig ng pagwasak sa hukbo; ang panghalip ay tumutukoy sa mga puwersa ni Jehoahaz.
- source_word: וַיְשִׂמֵם
  choice: ginawa silang
  rationale: Kasama ng paghahambing na kasunod, natural nitong ipinahahayag ang paglalagay sa isang kalagayan.
- source_word: כֶּעָפָר
  choice: parang alabok
  rationale: Pinananatili ang tahasang paghahambing at larawan ng lubos na pagkadurog.
- source_word: לָדוּשׁ
  choice: sa paggiik
  rationale: Ang דושׁ ay tumutukoy sa paggiik sa pamamagitan ng pagyurak; pinananatili ng salin ang agrikultural na larawan habang ipinapaliwanag sa talababa ang posibleng diin sa pagyurak.
