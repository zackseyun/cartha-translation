  to: Sapagkat walang iniwang hukbo ang hari ng Aram para kay Jehoahaz maliban sa limampung mangangabayo, sampung karwahe, at sampung libong kawal na naglalakad, dahil nilipol niya ang mga ito at ginawa silang parang alabok sa paggiik.[a]
