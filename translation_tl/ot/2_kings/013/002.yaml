id: 2KI.13.2
reference: 2 Kings 13:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: tl
  text: Ginawa niya ang masama sa paningin ni Yahweh at sumunod siya sa mga kasalanan ni Jeroboam na anak ni Nebat, na naging dahilan upang magkasala ang Israel. Hindi niya tinalikuran ang mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Hindi niya tinalikuran iyon.” Pambabaeng isahan ang hulapi sa Hebreo at malamang na kolektibong tumutukoy sa makasalanang huwaran ni Jeroboam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Likas na salaysay sa Tagalog para sa wayyiqtol ng עשה; hindi kailangang isalin nang hiwalay ang panimulang pang-ugnay.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: ang masama sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang pormulang moral na pagtatasa sa Mga Hari at ang metaporang 'sa paningin.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong Yahweh, sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּלֶךְ אַחַר
  choice: sumunod siya sa
  rationale: Ang idyomang Hebreo ay literal na 'lumakad sa likuran ng'; ang 'sumunod sa' ay likas sa modernong Tagalog at malinaw na naghahatid ng pagsunod sa isang huwaran.
- source_word: חַטֹּאת
  choice: mga kasalanan
  rationale: Pinananatili ang anyong maramihan at ang pagtukoy sa masasamang gawain o huwaran ni Jeroboam.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Jeroboam na anak ni Nebat
  rationale: Likas na anyo sa Tagalog ng Hebreong patronymic.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: na naging dahilan upang magkasala ang Israel
  rationale: Ipinahahayag ang causative na puwersa ng Hiphil ng חטא nang hindi ipinahihiwatig na pinilit ang Israel nang labag sa kalooban nito.
- source_word: לֹא סָר מִמֶּנָּה
  choice: Hindi niya tinalikuran ang mga iyon
  rationale: Malinaw na inuugnay sa mga kasalanan ang kolektibong pambabaeng isahang hulapi, habang inilalagay sa talababa ang mas pormal na isahang anyo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalang pantangi ang nasa tekstong Hebreo; pinananatili ng 'Yahweh' ang pagkakakilanlan nito bilang pangalan sa halip na palitan ng titulo.
- issue: Tinutukoy ng pambabaeng isahang hulapi sa מִמֶּנָּה
  choice: ang mga iyon, tumutukoy sa mga kasalanan o makasalanang huwaran ni Jeroboam
  alternative: iyon, bilang kolektibong isahang pagtukoy
  rationale: Pambabaeng isahan ang hulapi sa Hebreo, ngunit kolektibo nitong malamang na tinutukoy ang naunang חַטֹּאת. Ang maramihang Tagalog ay mas malinaw, at ang pormal na alternatibo ay iniingatan sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'sumunod' sa halip na literal na 'lumakad sa likuran' upang maging natural, habang pinanatili ang pormulang 'sa paningin ni Yahweh.'
