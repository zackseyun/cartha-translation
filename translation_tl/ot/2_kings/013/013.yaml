  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: tl
  text: At namahinga si Joas kasama ng kanyang mga ninuno[a], at umupo si Jeroboam sa trono ni Joas. Inilibing si Joas sa Samaria kasama ng mga hari ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nahiga kasama ng kanyang mga ninuno”; ang pariralang Hebreo ay nakaugaliang pormula para sa pagkamatay ng isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: namahinga
  rationale: Sa pormulang שׁכב עם־אבות, ang pandiwa ay isang magalang at nakaugaliang pahayag tungkol sa pagkamatay. Ang “namahinga” ay natural sa makabagong Tagalog at pinananatili ang eupemistikong larawan sa halip na payaking “namatay.”
- source_word: עִם אֲבֹתָיו
  choice: kasama ng kanyang mga ninuno
  rationale: Ang “mga ninuno” ang malinaw at natural na katumbas sa Tagalog ng dinastikong pormula; hindi nito ipinahihiwatig na mga agarang ama lamang ang tinutukoy.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: umupo sa kanyang trono
  rationale: Pinananatili nito ang literal na larawan ng Hebreo at ang nakaugaliang kahulugan nito bilang paghalili sa paghahari, nang hindi iyon ipinapalit sa isang paliwanag lamang.
- source_word: וַיִּקָּבֵר
  choice: inilibing si Joas
  rationale: Ang anyong pasibo sa Hebreo ay natural na naihahayag sa Tagalog sa pamamagitan ng pokus-sa-layon na “inilibing,” nang hindi nagdaragdag ng di-tinukoy na tagaganap.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang ב ay lokatibo rito, at “sa Samaria” ang natural na pahayag ng lugar sa Tagalog.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: kasama ng mga hari ng Israel
  rationale: Malapit itong sumusunod sa Hebreo at ipinahihiwatig ang paglilibing ni Joas sa piling ng mga naunang hari ng Israel.
