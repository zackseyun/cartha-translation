  naturalness: Natural at marangal sa modernong Filipino ang “Nagalit sa kanya ang tao ng Diyos” at ang kondisyunal na “Kung gayon, natalo mo sana...” Inilipat ang talababa sa “lupa,” kung saan ito aktuwal na nauugnay.
  terminology: Ginamit ang “tao ng Diyos” upang mapanatili ang karaniwang Hebreong titulo. Pinanatili ang Aram bilang pangalan ng bayan/kaharian, at ang “matatalo” bilang natural na Tagalog para sa tagumpay militar.
