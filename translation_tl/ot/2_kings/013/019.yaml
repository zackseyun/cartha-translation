  to: Nagalit sa kanya ang tao ng Diyos at sinabi, “Dapat sana'y hinampas mo ang lupa[a] nang lima o anim na beses. Kung gayon, natalo mo sana ang Aram hanggang sa tuluyan mo itong mapuksa[b]. Ngunit ngayon, tatlong beses mo lamang matatalo ang Aram.”
