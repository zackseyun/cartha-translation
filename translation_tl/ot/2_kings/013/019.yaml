base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: tl
  text: Nagalit sa kanya ang tao ng Diyos at sinabi, “Dapat sana'y hinampas mo ang lupa[a] nang lima o anim na beses. Kung gayon, natalo mo sana ang Aram hanggang sa tuluyan mo itong mapuksa[b]. Ngunit ngayon, tatlong beses mo lamang matatalo ang Aram.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “humampas” lamang; ang “lupa” ay ipinahiwatig ng ginawa niya sa talata 18.
    reason: cross_reference
  - marker: b
    text: Maaari ring isalin na “hanggang sa lubusan mo itong wakasan” o “hanggang sa ganap na pagkalipol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: Nagalit
  rationale: Likas at malinaw na salin ng galit na ipinahahayag ng קצף, nang hindi pinalalabis ang tindi.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lingkod ng Diyos
  rationale: Sa modernong Tagalog, ang tradisyonal na literal na 'tao ng Diyos' ay madaling mapagkamalang pangkalahatang paglalarawan. Ang 'lingkod ng Diyos' ay malinaw na pantukoy sa kinatawan ng Diyos sa salaysay, bagaman hindi nito tahasang pinapalitan ng 'propeta' ang Hebreong titulo.
- source_word: לְהַכּוֹת
  choice: hinampas mo ang lupa
  rationale: Ang layong 'ang lupa' ay ipinahihiwatig ng naunang kilos sa talata 18 at ginagawang malinaw ang saway sa Tagalog; minarkahan ito ng talababa dahil hindi tahasang inuulit sa Hebreo.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: nang lima o anim na beses
  rationale: Tuwirang salin ng bilang at dalas.
- source_word: אָז הִכִּיתָ אֶת אֲרָם
  choice: Kung ginawa mo iyon, natalo mo sana ang Aram
  rationale: Ipinahahayag ng pangungusap ang di-natupad na bunga. Ang 'natalo' ay natural sa kontekstong militar, samantalang ang naunang 'hinampas' ay nagpapanatili ng simbolikong kilos.
- source_word: עַד כַּלֵּה
  choice: hanggang sa tuluyan itong maubos
  rationale: Ipinakikita ang ideya ng pagdadala sa Aram sa ganap na katapusan, ngunit iniiwan sa talababa ang alternatibong mas tahasang militar.
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Malinaw na ipinahahayag ang kaibahan ng posibleng ganap na tagumpay at ng aktuwal na limitadong resulta.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: tatlong beses mo lamang matatalo ang Aram
  rationale: Ang imperfect ay prediksyon; ang 'lamang' ay ginagawang tahasan ang limitasyong ipinahihiwatig ng paghahambing sa lima o anim na beses.
theological_decisions:
- issue: Ugnayan ng simbolikong paghampas at ng mga tagumpay laban sa Aram
  choice: Gamitin ang 'hinampas' para sa lupa at 'matalo' para sa Aram, habang pinananatiling malinaw ang bilang na nag-uugnay sa dalawa.
  alternative: Gamitin ang 'hinampas' sa parehong kilos at pakikidigma.
  rationale: Sa Tagalog, ang 'hinampas ang Aram' ay hindi likas bilang paglalarawan ng tagumpay militar. Ang magkatulad na bilang at ayos ng pangungusap ay sapat upang mapanatili ang ugnayan ng tandang-kilos at mga tagumpay.
- issue: Lakas ng עַד כַּלֵּה
  choice: hanggang sa tuluyan itong maubos
  alternative: hanggang sa lubusan mo itong malipol
  rationale: Pinananatili ng napiling salin ang ganap na katapusan na ipinahihiwatig ng Hebreo nang hindi sapilitang nililinaw kung ito ay lubos na paglipol sa mga tao o ganap na pagwawakas sa kapangyarihang militar ng Aram.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang kontraksiyong “sana'y” at karaniwang bokabularyong “hinampas,” “natalo,” at “maubos.” Ang mga talababa ay nagpapanatili sa pormal na detalye at leksikal na saklaw ng Hebreo.
