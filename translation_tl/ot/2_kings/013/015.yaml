  to: Pagkatapos, sinabi ni Eliseo sa kaniya, “Kumuha ka ng isang pana at mga palaso.” Kaya kumuha siya ng isang pana at mga palaso.[a]
  rationale: Inalis ang hindi tahasang kilos na “dinala” at ang tiyak na pagtukoy kay Eliseo mula sa pangunahing teksto. Pinanatili ang inuulit na “isang pana at mga palaso,” ang pagkakasunod ng salaysay, at ang tekstuwal na kalabuan ng אֵלָיו sa talababa.
