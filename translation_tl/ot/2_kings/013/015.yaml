  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: tl
  text: Pagkatapos, sinabi ni Eliseo sa kaniya, “Kumuha ka ng isang pana at mga palaso.” Kaya kumuha siya ng isang pana at mga palaso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa kaniya.” Maaaring tumukoy ito kay Eliseo; posible ring unawain na “para sa sarili niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinasalaysay ng waw-consecutive ang kasunod na pangyayari; likas sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: לּוֹ
  choice: sa kaniya
  rationale: Karaniwang katumbas ng pang-ukol na ל na may hulaping ikatlong panauhang panlalaki, na tumutukoy sa kinausap ni Eliseo.
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: קַח
  choice: Kumuha ka
  rationale: Tuwirang pautos ng לקח; malinaw at natural itong utos sa Filipino.
- source_word: קֶשֶׁת
  choice: isang pana
  rationale: Tumutukoy sa panang ginagamit bilang sandata; idinagdag ang “isang” ayon sa likas na balarila ng Filipino.
- source_word: וְחִצִּים
  choice: at mga palaso
  rationale: Ang pangngalan ay maramihan at tumutukoy sa mga palaso; pinanatili ang tuwirang pag-uugnay nito sa pana.
- source_word: וַיִּקַּח
  choice: Kaya kumuha siya
  rationale: Ipinakikita ng anyong pasalaysay ang sumunod na kilos bilang tugon sa utos; natural sa Filipino ang “Kaya.”
- source_word: אֵלָיו
  choice: at dinala ang mga iyon kay Eliseo
  rationale: Pinananatili ang karaniwang direksiyonal na diwa na “sa kaniya,” na malamang na tumutukoy kay Eliseo. Ginawang hayag ang tinutukoy ng panghalip upang maging malinaw at natural sa Filipino, habang inilalagay sa talababa ang posibleng ibang pagbasa.
- source_word: קֶשֶׁת וְחִצִּים
  choice: isang pana at mga palaso
  rationale: Inulit ang buong bagay gaya ng tahasang pag-uulit sa tekstong Hebreo.
