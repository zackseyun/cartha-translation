  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “isang pana at mga palaso” at ang direksiyonal na diwa ng אֵלָיו, habang kinikilala sa talababa ang tunay na kalabuan nito.
