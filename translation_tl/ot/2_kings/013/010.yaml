base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: tl
  text: Noong ika-tatlumpu’t pitong taon ng paghahari ni Joas na hari ng Juda[a], naging hari ng Israel sa Samaria si Jehoas na anak ni Jehoahaz. Naghari siya nang labing-anim na taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Magkaiba ang anyo ng dalawang pangalan sa Hebreo: יוֹאָשׁ (Joas), ang hari ng Juda, at יְהוֹאָשׁ (Jehoas), ang hari ng Israel. Sa ilang salin, pareho silang tinatawag na “Joas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֶׁבַע שָׁנָה
  choice: Nang ikatatlumpu't pitong taon ng paghahari
  rationale: Ang pormulang Hebreo ay tumutukoy sa bilang ng taon sa paghahari; natural at malinaw sa modernong Tagalog ang ordinal na anyong ito.
- source_word: לְ/יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: ni Joas na hari ng Juda
  rationale: Ang לְ ay nagtatakda kay Joas bilang batayan ng pagtutugma ng mga paghahari, at ang kasunod na parirala ang nagpapakilala sa kaniya bilang hari ng Juda.
- source_word: מָלַךְ
  choice: naging hari
  rationale: Sa pormula ng pagtatala ng mga hari, ang Qal perfect ng מלך ay tumutukoy rito sa pagluklok o pagsisimula ng paghahari, samantalang hiwalay na ibinibigay sa hulihan ang haba ng paghahari.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: si Jehoas na anak ni Jehoahaz
  rationale: Pinananatili ng anyong Jehoas ang pagkakaiba ng baybay sa Hebreo mula sa Joas ng Juda; natural sa Tagalog ang pariralang 'anak ni.'
- source_word: עַל יִשְׂרָאֵל
  choice: hari ng Israel
  rationale: Sa ugnayan nito sa מלך, ipinahahayag ng עַל ang nasasakupan. Ang 'hari ng Israel' ay likas na Tagalog para sa pagiging hari sa Israel.
- source_word: בְּ/שֹׁמְרוֹן
  choice: sa Samaria
  rationale: Ang בְּ ay nagsasaad ng lokasyon; ang Samaria ang lunsod na sentro ng paghahari.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: Naghari siya nang labing-anim na taon
  rationale: Malinaw na inihahayag nito ang tagal ng paghahari; ginagamit ang 'nang' para sa tagal ng kilos.
