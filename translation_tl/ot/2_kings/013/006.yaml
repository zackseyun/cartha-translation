  naturalness: Marangal at likas ang rehistro. Ang “inakay niya ang Israel sa pagkakasala” ay mas idiomatiko at mas matibay kaysa “hinikayat niyang magkasala.” Ang “namuhay siya ayon sa mga ito” ay natural na pagsasalin ng metaporang “lumakad” nang hindi nagdaragdag ng aspektong wala sa teksto.
  terminology: Ang “sambahayan ni Jeroboam” ay katanggap-tanggap na salin ng “bahay ni Jeroboam,” bagaman may dinastiko at kultikong saklaw ang parirala. Ang “Ashera” sa pangunahing teksto, na may talababa tungkol sa posibleng diyosa o bagay-kulto, ay wastong nagpapanatili ng leksikal na kalabuan. Ginawang mas karaniwan ang “Canaanita” sa talababa.
