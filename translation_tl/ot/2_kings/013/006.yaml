reference: 2 Kings 13:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: tl
  text: Ngunit hindi sila tumalikod sa mga kasalanan ng sambahayan ni Jeroboam, na sa pamamagitan ng mga ito ay inakay niya ang Israel sa pagkakasala; namuhay siya ayon sa mga ito. At maging ang Ashera[a] ay nanatiling nakatayo sa Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “poste ni Ashera.” Ang salitang Hebreo ay maaaring tumukoy sa diyosang Canaanita na si Ashera o, gaya ng malamang dito, sa bagay na kaugnay ng pagsamba sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahahayag ang pagsalungat sa pagliligtas na binanggit sa naunang talata at sa patuloy nilang pagkakasala.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: hindi sila tumalikod sa mga kasalanan
  rationale: Pinananatili ang diwa ng pagtalikod o pag-iwan sa makasalanang gawain, pati ang anyong maramihan ng חַטֹּאות.
- source_word: בֵּית יָרָבְעָם
  choice: sambahayan ni Jeroboam
  rationale: Malapit sa literal na 'bahay ni Jeroboam' ngunit mas likas at marangal sa Filipino; maaari nitong saklawin ang dinastiya at ang pamanang panrelihiyon ng kanyang sambahayan.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: na sa pamamagitan ng mga iyon ay hinikayat niyang magkasala ang Israel
  rationale: Ipinahahayag ang causative na diwa ng Hiphil ng חטא. Ang 'sa pamamagitan ng mga iyon' ay inuugnay sa mga kasalanan bilang paraan ng pag-akay sa Israel sa kasalanan.
- source_word: בָּהּ הָלָךְ
  choice: Patuloy siyang namuhay ayon sa mga iyon
  rationale: Ang הלך ב ay tumutukoy sa asal o paraan ng pamumuhay. Ang 'patuloy' ay likas na naghahatid ng pagpapatuloy sa gayong landas, habang ang 'mga iyon' ay tumutugma sa kolektibong diwa ng naunang mga kasalanan.
- source_word: וְגַם
  choice: at maging
  rationale: Pinananatili ang diin ng karagdagang masamang kalagayan.
- source_word: הָאֲשֵׁרָה
  choice: ang Ashera
  rationale: Hindi nililimitahan ang salitang Hebreo sa diyosa lamang o sa bagay na ginagamit sa pagsamba; ipinaliliwanag sa talababa ang dalawang posibilidad.
- source_word: עָמְדָה
  choice: nanatiling nakatayo
  rationale: Pinagsasama ang literal na larawan ng pagtayo at ang diwa ng patuloy na pag-iral.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Likas na panandang panlunan para sa lungsod sa modernong Filipino.
theological_decisions:
- issue: Ang tinutukoy ng הָאֲשֵׁרָה
  choice: Ashera sa pangunahing teksto, malamang na bagay na kaugnay ng pagsamba sa kanya
  alternative: diyosang Ashera; poste ni Ashera
  rationale: Maaaring tumukoy ang termino sa diyosa o sa sagisag/bagay ng kanyang kulto. Ang pagkakalarawang 'nanatiling nakatayo' ay pumapabor sa isang bagay na ginagamit sa pagsamba, ngunit hindi tiyak na sinasabi ng Hebreo ang 'poste,' kaya pinanatili ang tunay na kalabuan.
- issue: Ang paksa ng בָּהּ הָלָךְ
  choice: isahan na 'siya,' na tumutukoy sa hari, at ang pamumuhay niya ayon sa makasalanang paraan
  alternative: maramihang 'sila' batay sa naunang sugnay
  rationale: Isahan ang pandiwang הָלָךְ sa Hebreo. Pinananatili ng salin ang paglipat mula sa maramihang 'sila' tungo sa isahang 'siya' sa halip na pakinisin ito at mawala ang anyo ng pinagmulan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'sambahayan' sa halip na payak na 'bahay' upang likas na maipahayag ang dinastiko at panrelihiyong pamanang tinutukoy. Pinanatili ang pangalang 'Ashera' at nilagyan ng talababa upang huwag alisin ang leksikal na kalabuan.
