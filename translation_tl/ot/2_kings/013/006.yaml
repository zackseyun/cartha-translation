revisions:
- from: Ngunit hindi sila tumalikod sa mga kasalanan ng sambahayan ni Jeroboam, na sa pamamagitan ng mga iyon ay hinikayat niyang magkasala ang Israel. Patuloy siyang namuhay ayon sa mga iyon, at maging ang Ashera[a] ay nanatiling nakatayo sa Samaria.
  to: Ngunit hindi sila tumalikod sa mga kasalanan ng sambahayan ni Jeroboam, na sa pamamagitan ng mga ito ay inakay niya ang Israel sa pagkakasala; namuhay siya ayon sa mga ito. At maging ang Ashera[a] ay nanatiling nakatayo sa Samaria.
  rationale: Pinalakas ang causative na puwersa ng pariralang Hebreo sa pamamagitan ng “sa pamamagitan ng mga ito ay inakay niya ang Israel sa pagkakasala,” habang pinananatili ang paglipat sa isahang paksa sa kasunod na sugnay. Inalis ang hindi kailangang “patuloy,” at pinanatili ang Ashera bilang di-isinasaling termino upang hindi piliting magpasya sa pagitan ng diyosa at ng bagay-kulto.
