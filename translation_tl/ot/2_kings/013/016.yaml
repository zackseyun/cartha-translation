base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: tl
  text: Pagkatapos, sinabi niya sa hari ng Israel, “Ipatong mo ang kamay mo sa busog.”[a] Ipinatong nga ng hari ang kamay niya roon, at ipinatong ni Eliseo ang mga kamay niya sa mga kamay ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ilagay mo ang kamay mo sa busog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְכֵּב
  choice: Ipatong
  rationale: Ang Hiphil na pautos ng רכב ay ginagamit dito sa diwang ipuwesto o ipatong ang kamay sa busog. Natural sa makabagong Tagalog ang “ipatong” at malinaw nitong inilalarawan ang kilos.
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: ang kamay mo sa busog
  rationale: Pinananatili nito ang payak na ugnayang panlunan ng kamay at busog nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: Ipinatong nga ng hari ang kamay niya roon
  rationale: Hindi inuulit sa Hebreo ang busog bilang layon. Ginawang tahasan ang gumagawa ng kilos at ginamit ang “roon” upang maging malinaw at natural sa Tagalog ang pagtukoy pabalik sa busog.
- source_word: וַיָּשֶׂם
  choice: ipinatong
  rationale: Ang pandiwa ay nangangahulugang inilagay o ipinatong. Ang “ipinatong” ay angkop sa aktuwal na paglalagay ng mga kamay ni Eliseo sa ibabaw ng mga kamay ng hari.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: ang mga kamay niya sa mga kamay ng hari
  rationale: Pinananatili ang maramihang anyo para sa mga kamay ni Eliseo at ng hari, kaya malinaw ang pisikal na larawan ng paggabay o pagtakip sa mga kamay ng hari.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Pagkatapos, sinabi niya sa hari ng Israel
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay. Ang “Pagkatapos” ay natural na panandang pagkakasunod-sunod sa Tagalog.
theological_decisions:
- issue: Kahulugan ng pagpapatong ni Eliseo ng kanyang mga kamay sa mga kamay ng hari
  choice: Isinalaysay lamang nang tuwiran ang kilos, nang walang idinagdag na simbolikong paliwanag.
  alternative: Maaaring unawain bilang pagbibigay-lakas ng propeta o tanda ng patnubay ng Diyos sa pakikipagdigma.
  rationale: Hindi tahasang ipinaliliwanag sa talatang ito ang kahulugan ng kilos; ang konteksto ang nagbibigay ng kabuluhan nito. Kaya hindi dapat ipasok sa salin ang isang tiyak na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “busog,” “ipinatong,” at “mga kamay” upang mapanatili ang konkretong larawan ng tekstong Hebreo. Inilipat ang panandang [a] sa mismong pariralang tinutukoy ng talababa.
