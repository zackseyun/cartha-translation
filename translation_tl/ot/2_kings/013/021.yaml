base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: tl
  text: Nangyari, habang naglilibing sila ng isang lalaki, bigla nilang nakita ang isang pangkat ng mga mandarambong. Kaya inihagis nila ang lalaki sa libingan ni Eliseo. Nang mapunta ang lalaki at madikit sa mga buto ni Eliseo,[a] nabuhay siya at tumayo sa kanyang mga paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at pumunta ang lalaki at dumikit sa mga buto ni Eliseo.” Di-pangkaraniwan ang pandiwang “pumunta” sa kontekstong ito; hindi malinaw ang eksaktong kilos na inilalarawan.
    reason: Ipinababatid ang kakaiba at hindi ganap na malinaw na וַיֵּלֶךְ nang hindi isinasalin ito bilang tiyak na “bumagsak.”
lexical_decisions:
- source_word: הַגְּדוּד
  choice: isang pangkat ng mga mandarambong
  rationale: Tumutukoy ang pangngalan sa isang armadong pangkat na sumasalakay o nandarambong; malinaw at likas ito sa modernong Tagalog.
- source_word: וַיַּשְׁלִכוּ אֶת־הָאִישׁ
  choice: inihagis nila ang bangkay
  rationale: Literal na ‘inihagis nila ang lalaki’; ginawang ‘bangkay’ upang malinaw na ang inililibing na lalaki ang tinutukoy, nang hindi binabago ang pangyayari.
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: Nang bumagsak ang lalaki at dumikit
  rationale: Ang וַיֵּלֶךְ ay literal na ‘at siya ay pumunta,’ ngunit sa kontekstong inihagis ang bangkay sa libingan, malamang na inilalarawan nito ang pagdating o pagbagsak nito hanggang sa madikit sa mga buto. Minarkahan sa talababa ang tekstuwal na hirap.
- source_word: וַיְחִי
  choice: nabuhay siya
  rationale: Tuwirang ipinapahayag ng Hebreo na muling nagkaroon ng buhay ang patay na lalaki.
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: tumayo sa sarili niyang mga paa
  rationale: Pinananatili ang kongkretong idyoma at ang diin na aktuwal siyang tumayo.
theological_decisions:
- issue: Ugnayan ng mga buto ni Eliseo sa muling pagkabuhay ng lalaki
  choice: Isinalaysay lamang na nabuhay ang lalaki nang madikit siya sa mga buto ni Eliseo.
  alternative: Ipaliwanag na may likas na kapangyarihan ang mga buto o tukuyin kung paano kumilos ang Diyos.
  rationale: Hindi tahasang ipinapaliwanag ng talata ang mekanismo o teolohikal na kahulugan; pinananatili ng salin ang salaysay nang hindi nagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Minsan” sa halip na isang mabigat na literal na pormula para sa וַיְהִי, at “bigla nilang nakita” para sa וְהִנֵּה. Ang “bangkay” ay kontekstuwal na paglilinaw; walang idinagdag na denominasyonal na paliwanag.
