base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: tl
  text: Nang ikadalawampu't tatlong taon ng paghahari ni Joas na anak ni Ahazias, hari ng Juda, nagsimulang maghari sa Israel si Jehoahaz na anak ni Jehu. Naghari siya sa Samaria sa loob ng labimpitong taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לְיוֹאָשׁ
  choice: Nang ikadalawampu't tatlong taon ng paghahari ni Joas
  rationale: Ang Hebreong pormula ay literal na tumutukoy sa ikadalawampu't tatlong taon na nauugnay kay Joas; idinagdag ang “ng paghahari” bilang likas at malinaw na pagpapahayag ng ipinahihiwatig na regnal dating.
- source_word: מָלַךְ
  choice: nagsimulang maghari
  rationale: Sa pormulang pangkronolohiya, ang pandiwa ay nagsasaad ng pagsisimula ng paghahari, hindi lamang ng kalagayang pagiging hari.
- source_word: עַל־יִשְׂרָאֵל
  choice: sa Israel
  rationale: Likas na Filipino para sa pamamahala sa kaharian o bayan, nang hindi pinalalabis ang kahulugan ng pang-ukol.
- source_word: בְּשֹׁמְרוֹן
  choice: sa Samaria
  rationale: Pinananatili ang lugar ng luklukan o sentro ng paghahari ayon sa Hebreo.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: sa loob ng labimpitong taon
  rationale: Malinaw at natural na paglalahad ng tagal ng paghahari.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang karaniwang anyong Tagalog ng mga pangalang Joas, Ahazias, Jehoahaz, at Jehu. Hinati sa dalawang pangungusap upang maging malinaw ang pagluklok at ang tagal ng paghahari, habang pinananatili ang lahat ng impormasyon ng Hebreo.
