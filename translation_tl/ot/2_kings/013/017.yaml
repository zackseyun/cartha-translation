  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Buksan mo ang bintanang nakaharap sa silangan,” at binuksan niya iyon. Sinabi ni Eliseo, “Pumana ka,” at pumana siya. Sinabi niya, “Palaso ng tagumpay ni Yahweh[a], palaso ng tagumpay laban sa Aram! Sapagkat tatalunin mo ang Aram sa Afek hanggang sa lubusan mo silang lipulin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “palaso ng pagliligtas mula kay Yahweh, palaso ng pagliligtas laban sa Aram.” Ang salitang Hebreo ay maaari ring mangahulugang “kaligtasan” o “pagliligtas.”
    reason: Pinananatili ang tunay na lawak ng kahulugan ng תְּשׁוּעָה, na sa kontekstong ito ay isinaling “tagumpay.”
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Buksan mo ang bintanang nakaharap sa silangan
  rationale: Ang פְּתַח ay tuwirang pautos na “buksan,” at ang קֵדְמָה ay nagsasaad ng direksiyong patungong silangan. Natural sa modernong Tagalog ang “nakaharap sa silangan” para sa direksiyon ng bintana.
- source_word: יְרֵה
  choice: Pumana ka
  rationale: Pautos ito ng ירה sa konteksto ng pana. Ang “pumana” ay maikli, natural, at hindi na kailangang idagdag ang bagay na hindi tahasang binanggit sa Hebreo.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: Palaso ng tagumpay ni Yahweh
  rationale: Maaaring mangahulugan ang תְּשׁוּעָה ng kaligtasan, pagliligtas, o tagumpay. Sa tandang-gawa tungkol sa digmaan, malinaw at natural ang “tagumpay,” habang ipinapakita ng “ni Yahweh” na sa kanya nagmumula at nauukol ang tagumpay.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: palaso ng tagumpay laban sa Aram
  rationale: Ipinaliliwanag ng ikalawang parirala ang una. Ang בַאֲרָם ay may labanang diwa rito, kaya “laban sa Aram” ang malinaw na katumbas.
- source_word: וְהִכִּיתָ אֶת אֲרָם בַּאֲפֵק
  choice: tatalunin mo ang Aram sa Afek
  rationale: Sa salaysay ng digmaan, ang Hiphil ng נכה ay tumutukoy sa pagdaig o pagtalo sa kaaway. Ang “tatalunin” ay mas natural sa Tagalog kaysa sa literal ngunit di-likas na “hahampasin.”
- source_word: עַד כַּלֵּה
  choice: hanggang sa lubusan mo itong malipol
  rationale: Ipinahahayag ng parirala ang pagdadala sa ganap na wakas. Tinutukoy ng “ito” ang Aram bilang kaaway o hukbo, at pinananatili ng “lubusan” ang diin sa ganap na pagkawasak.
- source_word: אֲרָם / אֲפֵק
  choice: Aram / Afek
  rationale: Pinanatili ang mga pangalang Hebreo sa transliterasyong angkop sa Filipino sa halip na palitan ang Aram ng makabagong pangalang heopolitikal.
theological_decisions:
- issue: Paglilipat ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginamit ang personal na pangalang “Yahweh” upang kumatawan nang tuwiran sa tetragrammaton nang hindi nag-aangkat ng denominasyonal na katawagan.
- issue: Kahulugan ng תְּשׁוּעָה sa pahayag tungkol sa digmaan
  choice: tagumpay
  alternative: kaligtasan; pagliligtas
  rationale: Pinakamalinaw sa agarang konteksto ang konkretong tagumpay laban sa Aram, ngunit pinanatili sa talababa ang mas malawak na leksikal at teolohikal na saklaw ng salita.
- issue: Ugnayan ng dalawang pariralang חֵץ תְּשׁוּעָה
  choice: 'Magkasingturing na paliwanag: “Palaso ng tagumpay ni Yahweh, palaso ng tagumpay laban sa Aram”'
  alternative: Dalawang magkahiwalay na palaso
  rationale: Mas malamang na nililinaw ng ikalawang parirala ang kahulugan ng una; hindi dinagdagan ng salitang magpapahiwatig na dalawang magkaibang palaso ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pumana” at “palaso” bilang karaniwang mga salitang angkop sa sinaunang tagpo; iniwasan ang makalumang sintaks at labis na literal na pariralang hindi natural sa kasalukuyang Tagalog.
