base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: tl
  text: Pagkatapos, namatay si Hazael na hari ng Aram,[a] at ang anak niyang si Ben-hadad ang naging hari bilang kahalili niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Siria.” “Aram” ang nasa Hebreo—ang pangalan ng kahariang karaniwang tinatawag na “Siria” sa ilang mas matatandang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Ang Qal wayyiqtol ng מות ay payak na pangyayaring naganap sa salaysay. Isinasalamin ng “Pagkatapos” ang pagkakasunod na ipinahihiwatig ng waw nang hindi nagiging labis na literal.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Isinalin sa karaniwang anyong transliterado ng pangalang Hebreo.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Ang אֲרָם ay pangalan ng makasaysayang kaharian. Pinananatili ng “Aram” ang pangalan sa Hebreo sa halip na gamitin ang tradisyonal ngunit mas mapagpakahulugang “Siria.”
- source_word: וַיִּמְלֹךְ
  choice: ang naging hari
  rationale: Sa konteksto ng paghalili sa trono, ipinahihiwatig ng מלך ang pag-upo bilang hari, hindi lamang ang pangkalahatang panahon ng paghahari.
- source_word: בֶּן־הֲדַד
  choice: Ben-hadad
  rationale: Karaniwang transliterasyon ng pangalang pantangi, na may gitling upang ipakita ang dalawang bahagi nito.
- source_word: בְּנוֹ
  choice: ang anak niyang
  rationale: Malinaw na pinananatili ang ugnayang ama at anak, at ang panghalip ay tumutukoy kay Hazael.
- source_word: תַּחְתָּיו
  choice: bilang kahalili niya
  rationale: Sa pormula ng paghalili sa hari, ang תחת na may hulaping panghalip ay tumutukoy sa paghalili o pagkuha ng puwesto ng naunang hari. Natural at tiyak ito sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “bilang kahalili niya” para sa idiomatikong pormula ng paghalili sa trono, habang pinanatili ang makasaysayang pangalang “Aram.”
