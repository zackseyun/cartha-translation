translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palaso” at “hampasin” upang mapanatili ang kongkretong larawan at lakas ng utos nang hindi dinaragdagan ang Hebreo ng paraang hindi nito tahasang sinasabi.
