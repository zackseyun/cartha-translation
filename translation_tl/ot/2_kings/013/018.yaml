  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: tl
  text: Pagkatapos, sinabi niya, “Kunin mo ang mga palaso.” Kinuha naman niya ang mga iyon. Sinabi niya sa hari ng Israel, “Hampasin mo ang lupa.” Hinampas niya iyon nang tatlong beses at tumigil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at tumayo.” Literal na “tumayo” ang pandiwang Hebreo; sa kontekstong ito, idyomatiko itong nangangahulugang tumigil siya matapos humampas nang tatlong beses.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: Kunin mo ang mga palaso
  rationale: Ang pautos na קַח ay likas na isinasalin bilang “Kunin mo,” at pinananatili ng “ang mga palaso” ang tiyak na maramihang anyo ng pangngalan.
- source_word: וַיִּקָּח
  choice: Kinuha naman niya ang mga iyon
  rationale: Ipinahihiwatig ng konteksto na ang mga palaso ang kinuha; ang “mga iyon” ay natural sa Filipino at iniiwasan ang alanganing pag-uulit.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: sa hari ng Israel
  rationale: Tuwirang salin ito ng pariralang tumutukoy sa pinagsabihan at pinananatili ang marangal na himig ng salaysay.
- source_word: הַךְ אַרְצָה
  choice: Hampasin mo ang lupa
  rationale: Ang נכה ay nag-uutos ng malakas na paghampas. Ang “hampasin” ay mas angkop kaysa “barilin,” sapagkat lupa ang tahasang layon at hindi sinasabi ng Hebreo kung paano ginamit ang mga palaso.
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: Hinampas niya iyon nang tatlong beses
  rationale: Tinutukoy ng “iyon” ang lupa, at ang “nang tatlong beses” ang natural na Filipino para sa bilang ng mga pag-ulit.
- source_word: וַיַּעֲמֹד
  choice: at tumigil
  rationale: Bagaman literal na “tumayo” o “nanatili,” ang pandiwa ay idyomatikong nangangahulugang huminto siya sa paghampas sa kontekstong ito.
