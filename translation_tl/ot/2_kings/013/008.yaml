base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: tl
  text: Ang iba pang mga gawa ni Jehoahaz, ang lahat ng kanyang ginawa, at ang kanyang lakas[a]—hindi ba nakasulat ang mga ito sa Aklat ng mga Kasaysayan ng mga Hari ng Israel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapangyarihan,” “kagitingan,” o “makapangyarihang mga gawa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Aklat ng mga Taunang Talaan ng mga Hari ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Ang iba pang mga ginawa
  rationale: Sa pormulang nagbubuod sa paghahari, ang דִּבְרֵי ay tumutukoy sa mga bagay o gawa hinggil sa hari, hindi lamang sa kanyang mga sinabi. Likas sa Filipino ang “iba pang mga ginawa” at naihahatid nito ang diwa ng וְיֶתֶר.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Pinanatili ang nakaugaliang transliterasyon ng pangalan sa mga saling Filipino.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: ang lahat ng ginawa niya
  rationale: Tuwiran at malawak ang saklaw ng parirala, gaya ng Hebreong עָשָׂה.
- source_word: וּגְבוּרָתוֹ
  choice: at ang kanyang kapangyarihan
  rationale: Maaaring tumukoy ang גְּבוּרָה sa lakas, kapangyarihan, kagitingan, o makapangyarihang mga gawa. Hindi nililimitahan ng “kapangyarihan” ang kahulugan sa tapang sa digmaan lamang; inilalahad sa talababa ang tunay na saklaw ng salita.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili ang retorikal na tanong ng karaniwang pormula sa mga ulat tungkol sa mga hari. Ang “mga iyon” ay umaayon sa maramihang reperente at pandiwaring Hebreo.
- source_word: עַל סֵפֶר
  choice: sa Aklat
  rationale: Bagaman literal na maaaring “sa ibabaw ng balumbon,” ang “nakasulat sa Aklat” ang natural na archival idiom sa Filipino.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga Kasaysayan
  rationale: Sa pamagat ng sangguniang maharlika, tumutukoy ito sa kronika o taunang tala ng mga pangyayari. Ang “mga Kasaysayan” ay malinaw at dignidad ang rehistro, habang ibinibigay sa talababa ang “mga Taunang Talaan.”
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: ng mga Hari ng Israel
  rationale: Ang לְ ay naghahayag dito ng kaugnayan sa pamagat, kaya natural itong isinalin na “ng,” hindi “para sa.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw sa karaniwang mambabasa. Pinanatili ang pormulang retorikal at ang bahagyang pag-uulit ng Hebreo. Inilagay ang mga pananda ng talababa sa mismong mga pariralang nililinaw ng mga ito.
