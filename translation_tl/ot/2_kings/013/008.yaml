revisions:
- from: Ang iba pang mga ginawa ni Jehoahaz, ang lahat ng ginawa niya, at ang kanyang kapangyarihan[a]—hindi ba nakasulat ang mga iyon sa Aklat ng mga Kasaysayan ng mga Hari ng Israel[b]?
  to: Ang iba pang mga gawa ni Jehoahaz, ang lahat ng kanyang ginawa, at ang kanyang lakas[a]—hindi ba nakasulat ang mga ito sa Aklat ng mga Kasaysayan ng mga Hari ng Israel[b]?
  rationale: Pinalitan ang “kapangyarihan” ng “lakas” upang mas malapit na maihatid ang malawak ngunit pangunahing diwa ng גְּבוּרָה nang hindi ipinahihiwatig ang awtoridad. Pinalitan din ang unang “mga ginawa” ng “mga gawa” para sa higit na likas na Filipino habang pinananatili ang saklaw ng דִּבְרֵי at ang pag-uulit na nasa Hebreo.
