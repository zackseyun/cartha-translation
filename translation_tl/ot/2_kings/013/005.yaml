  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: tl
  text: Nagbigay si Yahweh sa Israel ng isang tagapagligtas[a], kaya nakalaya sila sa kapangyarihan ng Aram[b]. At nanirahan ang mga anak ni Israel sa kanilang mga tolda gaya ng dati.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tagapagpalaya.” Ang salitang Hebreo ay tumutukoy sa isang taong nagdudulot ng pagliligtas o paglaya.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa ilalim ng kamay ng Aram,” isang idyoma para sa paglaya mula sa kapangyarihan o pamumuno ng Aram.
    reason: cultural_note
  - marker: c
    text: O “gaya noong mga nakaraang panahon.” Literal na “gaya ng kahapon at ng araw bago ang kahapon,” isang Hebreong idyoma para sa dating panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh.”
- source_word: מוֹשִׁיעַ
  choice: isang tagapagligtas
  rationale: Tumutukoy ang anyong participial ng ישׁע sa isang taong nagdudulot ng pagliligtas. Ang “tagapagligtas” ay malinaw sa modernong Filipino at hindi tinutukoy kung sino ang taong ito.
- source_word: וַיֵּצְאוּ מִתַּחַת יַד אֲרָם
  choice: nakalaya sila sa kapangyarihan ng Aram
  rationale: Isinasalin ang Hebreong idyomang “lumabas mula sa ilalim ng kamay” ayon sa kahulugan nitong paglaya mula sa pamumuno o paniniil ng Aram; inilalagay sa talababa ang literal na larawan.
- source_word: אֲרָם
  choice: Aram
  rationale: Ginagamit ang makasaysayang pangalan ng kahariang nasa tekstong Hebreo sa halip na ang mas huling pangalang “Siria.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilya at pangtipanang katawagan ng Hebreo sa halip na gawing “mga Israelita” o “bayan ng Israel.”
- source_word: בְּאָהֳלֵיהֶם
  choice: sa kanilang mga tolda
  rationale: Pinananatili ang kongkretong salitang “mga tolda,” na malinaw pa rin sa karaniwang Filipino.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: gaya noong una
  rationale: Natural na ipinapahayag nito ang diwa ng Hebreong idyoma para sa dating kalagayan o mga panahong nakalipas; ang literal na anyo ay ibinibigay sa talababa.
- source_word: וַיֵּשְׁבוּ
  choice: nanirahan
  rationale: Ang “nanirahan” ay natural at marangal na salin ng pandiwang ישׁב sa kontekstong tumutukoy sa paninirahan sa mga tolda.
theological_decisions:
- issue: Kung ang מוֹשִׁיעַ ay isasaling “tagapagligtas” o “tagapagpalaya”
  choice: tagapagligtas
  alternative: tagapagpalaya
  rationale: Saklaw ng salitang Hebreo ang isang taong nagdudulot ng pagliligtas o paglaya. Pinananatili ng “tagapagligtas” ang mas malawak na leksikal na diwa nang hindi kinikilala ang taong ito bilang isang tiyak na mesiyanikong tauhan.
- issue: Kung pananatilihin ang pampamilyang pariralang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Tahasan sa Hebreo ang katawagang “mga anak ni Israel.” Pinananatili ito upang maipakita ang pampamilya at pangtipanang anyo ng pahayag, bagaman sa konteksto ay tumutukoy ito sa sambayanan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Isinalin ayon sa diwa ang dalawang Hebreong idyoma upang maging malinaw sa karaniwang mambabasa, habang pinananatili sa mga talababa ang kanilang literal na larawan. Pinanatili ang “Yahweh,” “Aram,” “mga anak ni Israel,” at “mga tolda” dahil mahalaga ang kanilang anyong pangkasaysayan at pampanitikan.
