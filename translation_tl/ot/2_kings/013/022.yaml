  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: tl
  text: Ginigipit ni Hazael na hari ng Aram[a] ang Israel sa buong panahon ni Jehoahaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Aram”; tradisyonal na “Siria” sa ilang salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Hazael
  rationale: Isinalin ang pangalang pantangi ayon sa karaniwang anyong ginagamit sa Filipino. Hindi na ginawang hiwalay na panandang diskurso ang waw, sapagkat likas na naipagpapatuloy ng pangungusap ang salaysay.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Tuwirang isinalin ang pariralang construct. Pinanatili ang Aram, ang pangalang nasa Hebreo, sa halip na gamitin ang tradisyonal na Siria.
- source_word: לָחַץ
  choice: ginigipit
  rationale: Ipinahahayag ng pandiwa ang patuloy na matinding pagdiin o paniniil. Ang aspektong nagaganap ng “ginigipit” ay natural sa Filipino at angkop sa tuloy-tuloy na pang-aapi sa kontekstong politikal at militar.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Ang Israel ang tuwirang layon ng pandiwa; sa konteksto, tumutukoy ito sa hilagang kaharian.
- source_word: כֹּל יְמֵי
  choice: sa buong panahon ni
  rationale: Natural na ipinapahayag nito sa Filipino ang kabuuang tagal na tinutukoy ng idyomang Hebreo, nang hindi tahasang nililimitahan iyon sa buhay o paghahari lamang.
- source_word: יְהוֹאָחָז
  choice: Jehoahaz
  rationale: Ginamit ang karaniwang transliterasyon ng pangalang pantangi sa tradisyong biblikal na Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ginigipit” upang ilarawan ang tuloy-tuloy na paniniil, at “sa buong panahon” upang mapanatili ang saklaw ng pariralang Hebreo nang hindi ipinapasyang buhay o paghahari lamang ni Jehoahaz ang tinutukoy.
