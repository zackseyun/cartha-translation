  to: Nagkasakit si Eliseo ng sakit na ikamamatay niya. Bumaba sa kanya si Joas, hari ng Israel, at umiyak habang nakayuko sa kanya[a]. Sinabi niya, “Ama ko, ama ko![b] Ang mga karwahe ng Israel at ang mga mangangabayo nito!”
  rationale: Binago ang parirala tungkol sa pag-iyak upang higit na maipakita ang pisikal at madamdaming larawan ng Hebreong “sa ibabaw ng kanyang mukha,” nang hindi gumagamit ng alanganing literalismo. Inayos din ang talababa ng alusyon sa 2 Hari 2:12 para sa mas tumpak at likas na pagkakalahad. Walang idinagdag na paliwanag sa matalinghagang bulalas.
