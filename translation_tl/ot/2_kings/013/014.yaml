    rationale: Ang parirala ay maaaring mangahulugang umiyak lamang sa presensiya ni Eliseo. Ang Hebreo ay mas tiyak na naglalarawan kay Joas na yumuyuko o umiiyak sa ibabaw ng mukha/ng katauhan ni Eliseo.
  - severity: low
    issue: Ang talababa b na “sinabi ni Eliseo ang gayunding mga salita tungkol kay Elias” ay bahagyang di-tuwiran.
    rationale: Mas malinaw na sabihing ginamit ni Eliseo ang mga salitang iyon para kay Elias sa 2 Hari 2:12, nang hindi dinaragdagan ang kahulugan ng eksena.
