  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: tl
  text: Nagkasakit si Eliseo ng sakit na ikamamatay niya. Bumaba sa kanya si Joas, hari ng Israel, at umiyak habang nakayuko sa kanya[a]. Sinabi niya, “Ama ko, ama ko![b] Ang mga karwahe ng Israel at ang mga mangangabayo nito!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umiyak sa ibabaw ng kanyang mukha.” Ipinahihiwatig nito na yumuko si Joas sa tabi o ibabaw ni Eliseo habang umiiyak.
    reason: lexical_alternative
  - marker: b
    text: Inuulit ng panawagang ito ang mga salitang ginamit ni Eliseo para kay Elias sa 2 Hari 2:12.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: Nagkasakit ... ng sakit
  rationale: Pinananatili ang pag-uulit ng magkaugnay na pandiwa at pangngalan sa Hebreo habang nananatiling malinaw at natural sa Tagalog.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: na ikamamatay niya
  rationale: Likas na pariralang Tagalog na nagpapakitang ang sakit na ito ang magiging sanhi ng kamatayan niya, ayon sa pananaw ng salaysay sa sandaling iyon.
- source_word: וַיֵּרֶד אֵלָיו
  choice: Bumaba sa kanya
  rationale: Pinananatili ang tahasang direksiyong ‘bumaba’ sa Hebreo sa halip na gawing simpleng ‘pumunta,’ kahit hindi ipinaliliwanag ang heograpiya.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: umiyak sa harap niya
  rationale: Natural sa Tagalog at malapit sa larawang ipinahihiwatig ng Hebreo; inilalahad sa talababa ang mas literal ngunit alanganing anyo.
- source_word: אָבִי אָבִי
  choice: Ama ko, ama ko!
  rationale: Pinananatili ang hulaping paari, pag-uulit, at matinding dalamhati at paggalang sa panawagan.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Ang mga karwahe ng Israel at ang mga mangangabayo nito!
  rationale: Ang רֶכֶב ay maaaring tumukoy nang kolektibo sa mga karwahe o hukbong may karwahe. Ang maramihang anyo ay natural sa Tagalog at pinananatili ang matalinghagang pahayag nang hindi ito ipinapaliwanag sa mismong teksto.
theological_decisions:
- issue: Matalinghagang diwa ng ‘mga karwahe ng Israel at mga mangangabayo nito’
  choice: Pinanatili bilang tuwirang bulalas kay Eliseo nang walang paliwanag sa katawan ng talata.
  alternative: Isalin nang hayagan bilang pagkilala na si Eliseo ang tunay na lakas o tanggulan ng Israel.
  rationale: Ang pahayag ay umaalingawngaw sa 2 Hari 2:12 at kinikilala ang pambihirang kabuluhan ng propeta, ngunit hindi dapat lutasin ng salin kung ito ay paghahambing, katawagan, o mas malawak na pahiwatig tungkol sa pagtatanggol ng Diyos.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang karaniwang mga pangalang Eliseo at Joas. Pinanatili ang direksiyong ‘bumaba’ at ang hindi ipinaliliwanag na matalinghagang bulalas sa halip na gawing interpretatibong paraphrase.
