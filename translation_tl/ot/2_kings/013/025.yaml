base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: tl
  text: Muling nabawi ni Jehoash na anak ni Jehoahaz ang mga lungsod mula sa kamay ni Ben-hadad na anak ni Hazael.[a] Ang mga lungsod na ito ay kinuha ni Ben-hadad mula sa kamay ni Jehoahaz, ama ni Jehoash, sa digmaan. Tatlong beses siyang tinalo ni Joash,[b] at ibinalik niya ang mga lungsod ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang anyo ng iisang pangalan ng hari ang ginamit sa Hebreo sa talatang ito: “Jehoash” sa simula at “Joash” sa bandang huli.'
    reason: lexical_alternative
  - marker: b
    text: O “hinampas.” Ang pandiwang Hebreo ay maaaring mangahulugang paghampas o paggapi sa labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: Muling nabawi
  rationale: Magkasunod na inilalarawan ng mga pandiwa ang pagbawi at muling pagkuha sa mga lungsod. Natural na naipahahayag sa Filipino ng “muling nabawi” ang pinagsamang diwa nang hindi inuulit ang parehong ideya.
- source_word: הֶעָרִים
  choice: ang mga lungsod
  rationale: Karaniwang katumbas ng עָרִים at angkop sa mga sentrong pamayanan sa salaysay.
- source_word: מִיַּד
  choice: mula sa kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo, na nauunawaan sa Filipino bilang pagkuha mula sa kapangyarihan o kontrol ng isang tao.
- source_word: בֶּן הֲדַד
  choice: Ben-hadad
  rationale: Transliterasyon ng pangalang pantangi ayon sa anyong Hebreo.
- source_word: אֲשֶׁר לָקַח
  choice: Ang mga lungsod na ito ay kinuha
  rationale: Nililinaw ang antecedent ng relatibong sugnay at ipinakikitang nauna ang pagkuha ni Ben-hadad sa pagbawi ni Jehoash.
- source_word: בַּמִּלְחָמָה
  choice: sa digmaan
  rationale: Tuwirang modernong salin na nagpapanatili sa pangkalahatang kontekstong militar.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Tatlong beses
  rationale: Natural at eksaktong modernong Filipino.
- source_word: הִכָּהוּ
  choice: siyang tinalo
  rationale: Sa konteksto ng paulit-ulit na sagupaan, ang נכה ay maaaring tumukoy sa paggapi sa labanan; iniiwasan nitong ipahiwatig na tatlong beses siyang pinatay.
- source_word: יוֹאָשׁ
  choice: Joash
  rationale: Pinananatili ang mas maikling anyo ng pangalan sa huling bahagi ng talata, kaiba sa יְהוֹאָשׁ na “Jehoash” sa simula.
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: naibalik niya ang mga lungsod ng Israel
  rationale: Ipinahahayag ang pagsasauli ng mga lungsod sa kontrol ng Israel.
