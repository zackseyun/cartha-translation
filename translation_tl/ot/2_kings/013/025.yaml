revisions:
- from: Muling nabawi ni Jehoash na anak ni Jehoahaz ang mga lungsod mula sa kamay ni Ben-hadad na anak ni Hazael.[a] Ang mga lungsod na ito ay kinuha ni Ben-hadad mula sa kamay ng ama niyang si Jehoahaz sa digmaan. Tatlong beses siyang tinalo ni Joash,[b] at naibalik niya ang mga lungsod ng Israel.
  to: Muling nabawi ni Jehoash na anak ni Jehoahaz ang mga lungsod mula sa kamay ni Ben-hadad na anak ni Hazael.[a] Ang mga lungsod na ito ay kinuha ni Ben-hadad mula sa kamay ni Jehoahaz, ama ni Jehoash, sa digmaan. Tatlong beses siyang tinalo ni Joash,[b] at ibinalik niya ang mga lungsod ng Israel.
