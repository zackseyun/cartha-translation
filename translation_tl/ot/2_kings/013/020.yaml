revisions:
- from: Pagkatapos, namatay si Eliseo, at inilibing nila siya. Samantala, taun-taon ay pumapasok sa lupain ang mga pangkat ng mga Moabita na mandarambong sa pagsisimula ng taon.[a]
  to: Pagkatapos, namatay si Eliseo, at inilibing nila siya. Pagsapit ng taon, karaniwang pumapasok sa lupain ang mga pangkat ng mananalakay mula sa Moab.[a]
  rationale: Pinalitan ang sobrang-tiyak na “taun-taon” ng “Pagsapit ng taon” upang mapanatili ang saklaw ng idyomang Hebreo, samantalang ipinahihiwatig ng “karaniwang” ang habitual na imperfect. Inayos ang paglalarawan sa mga pangkat mula sa Moab upang maging likas, malinaw, at tapat sa kahulugang “raiding bands of Moab.”
