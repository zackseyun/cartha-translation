base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: tl
  text: Pagkatapos, namatay si Eliseo, at inilibing nila siya. Pagsapit ng taon, karaniwang pumapasok sa lupain ang mga pangkat ng mananalakay mula sa Moab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa tagsibol ng taon.” Literal sa Hebreo: “sa pagdating ng taon,” isang idyoma para sa pag-ikot ng taon, na madalas iugnay sa panahon ng mga kampanyang militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos” habang pinananatili ang payak na kahulugang “namatay.”
- source_word: אֱלִישָׁע
  choice: Eliseo
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Tagalog.
- source_word: וַיִּקְבְּרֻהוּ
  choice: at inilibing nila siya
  rationale: Pinananatili ang aktibong pandiwang maramihan at ang panlalaking isahang layon ng Hebreo, sa halip na gawing balintiyak.
- source_word: גְדוּדֵי מוֹאָב
  choice: mga pangkat ng mga Moabita na mandarambong
  rationale: Ang גְּדוּד ay maaaring tumukoy sa pangkat na sumasalakay o nandarambong, hindi lamang sa pormal na hukbo; malinaw ring ipinahahayag ang kaugnayan sa Moab.
- source_word: יָבֹאוּ
  choice: taun-taon ay pumapasok
  rationale: Ang imperfect sa kontekstong ito ay nagpapahiwatig ng nakagawiang paulit-ulit na kilos. Ipinahahayag ng “taun-taon” ang aspektong iyon nang natural sa Tagalog.
- source_word: בָאָרֶץ
  choice: sa lupain
  rationale: Kasama ng pandiwang בוא, ang parirala ay tumutukoy sa pagpasok sa lupain; ipinapahiwatig ito ng “pumapasok sa lupain.”
- source_word: בָּא שָׁנָה
  choice: sa pagsisimula ng taon
  rationale: Ang literal na “sa pagdating ng taon” ay isang idyoma para sa pag-ikot o pagsisimula ng taon, malamang na kaugnay ng panahon ng mga kampanyang militar. Ang mas literal na anyo at posibleng pagtukoy sa tagsibol ay inilagay sa talababa.
