translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang aktibong “inilibing nila siya” at ang nakagawiang kilos ng mga mandarambong, habang ang di-tiyak na idyoma tungkol sa panahon ng taon ay nilinaw sa talababa.
