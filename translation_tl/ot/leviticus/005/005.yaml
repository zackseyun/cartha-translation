  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: tl
  text: At mangyayari, kapag nagkaroon siya ng pananagutan[a] sa isa sa mga bagay na ito, ipagtatapat niya ang kasalanang nagawa niya kaugnay nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “kapag nagkaroon siya ng sala” o “kapag naging may pananagutan siya.” Legal na sala o pananagutan ang binibigyang-diin ng pandiwang Hebreo, hindi lamang ang pagkabatid na may nagawang mali.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “na siya ay nagkasala kaugnay nito.” Ang “nito” ay tumutukoy pabalik sa isa sa mga kasong kababanggit lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At mangyayari, kapag
  rationale: Pinananatili ang legal na panandang naglalahad ng susunod na kalagayan, ngunit gumagamit ng likas na ayos sa makabagong Filipino.
- source_word: יֶאְשַׁם
  choice: nagkasala siya at nagkaroon ng pananagutan
  rationale: Ipinahahayag ang legal na diwa ng pandiwang אשם—pagkakaroon ng sala o pananagutan—nang hindi ito ginagawang simpleng pagkabatid lamang sa sariling kasalanan.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: sa isa sa mga bagay na ito
  rationale: Tumutukoy pabalik sa isa sa mga kasong kababanggit lamang at malapit sa anyo ng Hebreo.
- source_word: וְהִתְוַדָּה
  choice: ipagtatapat niya
  rationale: Ang hitpael ng ידה rito ay tumutukoy sa hayagang pagtatapat; ang anyong ito ay natural sa Filipino at angkop sa legal na tagubilin.
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: ang kasalanang nagawa niya kaugnay nito
  rationale: Pinananatili ang nilalaman ng pagtatapat at ang ugnayang ipinahahayag ng hulaping pambabae sa עָלֶיהָ, na tumutukoy pabalik sa kaukulang bagay o kaso.
theological_decisions:
- issue: Kung ang יֶאְשַׁם ay tumutukoy sa pagkabatid ng sala o sa aktuwal na legal na pananagutan
  choice: nagkasala siya at nagkaroon ng pananagutan
  alternative: mapagtanto niyang nagkasala siya
  rationale: Hindi tahasang sinasabi ng pandiwa na napagtanto ng tao ang kaniyang sala; higit nitong binibigyang-diin ang pagiging may sala at may pananagutan, kaya hindi idinagdag ang ideya ng panloob na pagkabatid.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na himig at ang pagtukoy pabalik ng huling parirala, habang iniwasan ang sobrang literal at alanganing pagkakasabi.
