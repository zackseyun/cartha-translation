  source_fidelity: Tumpak ang pangunahing daloy ng ritwal at ang pagtukoy sa dakot bilang bahaging pang-alaala. Gayunman, ang עַל sa pariralang עַל אִשֵּׁי יְהוָה ay mas ligtas na isalin sa ritwal na diwa bilang “bilang karagdagan sa,” gaya rin ng English audit trail, kaysa “sa ibabaw ng,” na maaaring magpahiwatig ng pisikal na pagpapatong na hindi kailangang igiit ng teksto.
  naturalness: Malinaw at modernong Tagalog ang salin. Ang binagong parirala ay mas likas at mas malinaw sa kasalukuyang gamit.
  terminology: Ang “pari,” “altar,” “bahaging pang-alaala,” “mga handog na pinaraan sa apoy,” “Yahweh,” at “handog para sa kasalanan” ay angkop. Pinananatili ng talababa ang makatuwirang alternatibong “handog para sa paglilinis” para sa חַטָּאת.
