source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: tl
  text: Pagkatapos, dadalhin niya iyon sa pari. Kukuha ang pari mula roon ng isang dakot bilang bahaging pang-alaala nito at susunugin niya iyon sa altar, bilang karagdagan sa mga handog na pinaraan sa apoy para kay Yahweh.[a] Isa itong handog para sa kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa ibabaw ng mga handog na pinaraan sa apoy para kay Yahweh.” Maaari rin itong unawain na “kasama ng mga handog na pinaraan sa apoy para kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “handog para sa paglilinis.” Ang salitang Hebreo ay maaaring tumukoy sa handog na humaharap sa kasalanan sa pamamagitan ng paglilinis.
    reason: alternative_reading
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: Pagkatapos, dadalhin niya iyon
  rationale: Ang Hiphil ng בוא na may hulaping pambabae ay tumutukoy sa pagdadala ng handog na harina mula sa naunang konteksto. Likas sa Tagalog ang “dadalhin niya iyon,” at ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod ng waw.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas ng כהן sa konteksto ng paglilingkod at paghahandog sa santuwaryo.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: Kukuha ... ng isang dakot
  rationale: Tumutukoy ang pandiwa at parirala sa teknikal na ritwal na pagkuha ng daming kasya sa kamay. Malinaw at likas sa modernong Tagalog ang “isang dakot.”
- source_word: מִמֶּנָּה
  choice: mula roon
  rationale: Ang hulapi ay tumutukoy sa handog o harina, hindi sa isang tao. Iniiwasan ng “mula roon” ang di-likas na pag-uulit habang pinananatili ang pinagmulan ng dakot.
- source_word: אֶת אַזְכָּרָתָהּ
  choice: bilang bahaging pang-alaala nito
  rationale: Ang אַזְכָּרָה ay teknikal na tawag sa bahaging sinusunog sa altar bilang pang-alaala. Pinananatili ng salin ang ideya ng isang takdang bahagi at hindi lamang isang abstraktong pag-alaala.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: at susunugin iyon sa altar
  rationale: Sa kontekstong panghandog, ang Hiphil ng קטר ay tumutukoy sa pagsusunog o pagpapausok ng handog sa altar. Ang “susunugin” ay malinaw sa karaniwang mambabasa.
- source_word: עַל אִשֵּׁי יְהוָה
  choice: sa ibabaw ng mga handog na pinaraan sa apoy para kay Yahweh
  rationale: Pinananatili ng “sa ibabaw ng” ang kongkretong kahulugan ng עַל, at ng “mga handog na pinaraan sa apoy” ang teknikal ngunit malawak na saklaw ng אִשֵּׁי, nang hindi ito nililimitahan sa “pagkain.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang banal sa transliterasyong madaling makilala sa modernong Filipino.
- source_word: חַטָּאת הִוא
  choice: Isa itong handog para sa kasalanan
  rationale: Sa pormulang pangsakripisyo, tinutukoy ng חַטָּאת ang uri ng handog na may kinalaman sa kasalanan. Pinananatili sa talababa ang mahalagang alternatibong diin sa paglilinis.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tukuyin ng terminong Hebreo ang handog kaugnay ng kasalanan o bigyang-diin ang tungkulin nitong maglinis. Ang pangunahing teksto ay gumagamit ng kinikilalang kategoryang “handog para sa kasalanan,” habang pinananatili sa talababa ang lehitimong alternatibo.
- issue: Ugnayan ng bahaging sinusunog sa אִשֵּׁי יְהוָה
  choice: sa ibabaw ng mga handog na pinaraan sa apoy para kay Yahweh
  alternative: kasama ng mga handog na pinaraan sa apoy para kay Yahweh
  rationale: Ang עַל ay maaaring ilarawan nang kongkreto bilang “sa ibabaw ng,” bagaman sa ritwal na konteksto maaari rin itong maunawaang “kasama ng” o “bilang karagdagan sa.” Pinananatili sa talababa ang saklaw na ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikling sugnay at karaniwang bokabularyo, habang pinanatili ang mga teknikal na konseptong panghandog at ang pangalang Yahweh. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
