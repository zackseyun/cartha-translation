revisions:
- from: Dadalhin niya sa pari ang isang lalaking tupa mula sa kawan na walang kapintasan, ayon sa halagang itinakda mo, bilang handog na pambayad sa sala.[a] Magsasagawa ang pari ng pagtubos para sa kanya dahil sa pagkakamaling nagawa niya nang hindi sinasadya at nang hindi niya ito nalalaman,[b] at patatawarin siya.
  to: Dadalhin niya sa pari ang isang lalaking tupa mula sa kawan na walang kapintasan, ayon sa halagang itinakda mo, bilang handog na pambayad sa sala.[a] Magbabayad-sala ang pari para sa kanya dahil sa pagkakamaling nagawa niya nang hindi sinasadya, bagaman hindi niya ito nalalaman,[b] at patatawarin siya.
  rationale: Inayos ang katumbas ng כפר upang tumukoy sa pagbabayad-sala o paggawa ng atonement sa ritwal na panghandog, sa halip na sa pagtubos bilang ransom. Nilinaw rin ang ugnayan ng kawalan ng kaalaman sa di-sinasadyang pagkakamali. Pinanatili ang hindi tahasang pinangalanang tagapagpatawad at ang hindi ipinaliliwanag na ikalawang panauhan sa “itinakda mo.”
