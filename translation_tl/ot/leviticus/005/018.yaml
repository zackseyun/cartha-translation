id: LEV.5.18
reference: Leviticus 5:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/הֵבִיא אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵ֑ן וְ/כִפֶּר֩ עָלָ֨י/ו הַ/כֹּהֵ֜ן עַ֣ל שִׁגְגָת֧/וֹ אֲשֶׁר שָׁגָ֛ג וְ/ה֥וּא לֹֽא יָדַ֖ע וְ/נִסְלַ֥ח לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: tl
  text: Dadalhin niya sa pari ang isang lalaking tupa mula sa kawan na walang kapintasan, ayon sa halagang itinakda mo, bilang handog na pambayad sa sala.[a] Magbabayad-sala ang pari para sa kanya dahil sa pagkakamaling nagawa niya nang hindi sinasadya, bagaman hindi niya ito nalalaman,[b] at patatawarin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang handog para sa sala” o “bilang handog na panumbas.” Ang Hebreong אָשָׁם (asham) ay pangalan ng isang natatanging uri ng handog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil sa kanyang di-sinasadyang kasalanan.” Idiniriin ng Hebreo na ang paglabag ay nagawa nang hindi sinasadya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Dadalhin niya
  rationale: Ang anyong pandiwa sa kontekstong legal ay may puwersang nag-uutos; natural itong ipinahahayag sa modernong Tagalog sa aspektong kontemplatibo.
- source_word: אַיִל תָּמִים מִן־הַצֹּאן
  choice: isang lalaking tupa mula sa kawan na walang kapintasan
  rationale: Ang אַיִל ay hustong gulang na lalaking tupa, at sa kontekstong paghahandog ang תָּמִים ay tumutukoy sa kawalan ng pisikal na depekto.
- source_word: בְּעֶרְכְּךָ
  choice: ayon sa halagang itinakda mo
  rationale: Pinananatili nito ang ikalawang panauhang isahan at ang diwa ng pagtatakda o pagtatasa ng halaga nang hindi ipinapalagay kung sino ang tinutukoy na tagapagtasa.
- source_word: לְאָשָׁם
  choice: bilang handog na pambayad sa sala
  rationale: Ang אָשָׁם ay pangalan ng isang natatanging uri ng handog. Ang saling ito ay nagtatangi rito sa ibang handog para sa kasalanan at pinananatili ang kaugnayan nito sa pananagutan o pagsasauli.
- source_word: וְכִפֶּר עָלָיו
  choice: Magsasagawa ang pari ng pagtubos para sa kanya
  rationale: Ipinahahayag nito ang gawaing pansakripisyo ng pari nang hindi nililimitahan ang כפר sa iisang paliwanag na teolohikal.
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: dahil sa pagkakamaling nagawa niya nang hindi sinasadya
  rationale: Pinananatili ng 'pagkakamali' at 'hindi sinasadya' ang pag-uulit at diin ng magkaugnay na pangngalan at pandiwa sa Hebreo.
- source_word: וְהוּא לֹא־יָדַע
  choice: at nang hindi niya ito nalalaman
  rationale: Ipinapakita nito na wala siyang kamalayan sa nagawang paglabag, nang hindi dinaragdagan ang teksto ng dahilan o takdang panahon ng pagkaalam.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Malinaw at natural na ipinahahayag ng balintiyak na diwa ang kinalabasan, habang hindi tahasang pinapangalanan ang Diyos bilang gumagawa ng pagpapatawad.
theological_decisions:
- issue: Pagpapakahulugan sa אָשָׁם bilang natatanging handog
  choice: handog na pambayad sa sala
  alternative: handog para sa pagkakasala; handog na panumbas
  rationale: Ipinakikita ng konteksto ng Levitico na ito ay tiyak na kategorya ng handog. Ang napiling salita ay nagpapanatili sa diwa ng sala at pananagutang kaakibat nito nang hindi nagpapasok ng denominasyonal na doktrina.
- issue: Pagpapakahulugan sa כפר
  choice: magsagawa ng pagtubos para sa kanya
  alternative: magbayad-sala para sa kanya; magsagawa ng pagpapalubag-loob para sa kanya
  rationale: Ang 'pagtubos' ay madaling maunawaan at may sapat na bigat para sa gawaing pansakripisyo, ngunit hindi nito tahasang nilulutas kung ang pangunahing diin ng כפר ay pagtatakip, paglilinis, o pagpapalubag-loob.
- issue: Hindi tahasang pinangalanang tagapagpatawad
  choice: patatawarin siya
  alternative: ipagkakaloob sa kanya ang kapatawaran
  rationale: Pinananatili ang balintiyak na pahayag ng Hebreo at ang ipinahihiwatig na banal na tagagawa, sa halip na idagdag sa pangunahing teksto ang pangalang hindi tahasang naroon.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang 'lalaking tupa' sa halip na mas teknikal o di-gaanong karaniwang katawagan, at pinanatili ang tuwirang ikalawang panauhan sa 'itinakda mo.'
