id: LEV.5.2
reference: Leviticus 5:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: tl
  text: O kung ang isang tao ay makahipo ng anumang bagay na marumi—maging bangkay ng maruming mabangis na hayop, bangkay ng maruming alagang hayop, o bangkay ng maruming gumagapang na nilalang—at lingid iyon sa kaniya[a], siya ay marumi at nagkaroon ng pananagutan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi niya iyon namalayan”; sa literal, “iyon ay nalihim sa kaniya.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, nagkaroon siya ng pananagutan dahil sa ritwal na karumihan; hindi nito kinakailangang sabihing ang mismong paghipo sa bangkay ay sadyang kasalanang moral.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa kontekstong legal, tumutukoy ito sa isang indibidwal, hindi partikular sa di-materyal na “kaluluwa.”
- source_word: תִּגַּע בְּ
  choice: makahipo
  rationale: Tuwirang ipinapahayag nito ang pisikal na pagdikit; ang anyong “makahipo” ay angkop sa kondisyong sinisimulan ng “kung.”
- source_word: כָל דָּבָר טָמֵא
  choice: anumang bagay na marumi
  rationale: Pinananatili ang malawak na saklaw ng דָּבָר at ang kategorya ng ritwal na karumihan.
- source_word: נִבְלַת
  choice: bangkay ng
  rationale: Sa mga batas ng Levitico, tumutukoy ito sa patay na katawan ng hayop.
- source_word: חַיָּה טְמֵאָה
  choice: maruming mabangis na hayop
  rationale: Ipinakikita ang kaibahan nito sa alagang hayop at pinananatili ang katawagang pangritwal na “marumi.”
- source_word: בְּהֵמָה טְמֵאָה
  choice: maruming alagang hayop
  rationale: Likas na salin para sa domestikadong hayop at malinaw ang kaibahan sa mabangis na hayop.
- source_word: שֶׁרֶץ טָמֵא
  choice: maruming gumagapang na nilalang
  rationale: Nauunawaan sa modernong Filipino at sapat na malawak para sa maliliit na nilalang na saklaw ng kategoryang Hebreo.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: at lingid iyon sa kaniya
  rationale: Pinananatili ang pananaw ng Hebreong idyoma na ang pangyayari ay nakubli sa kaalaman ng tao, habang natural pa rin sa Filipino.
- source_word: וְהוּא טָמֵא
  choice: siya ay marumi
  rationale: Tahasang inilalahad ang resultang katayuang ritwal nang hindi dinaragdagan ang lohikal na ugnayan.
- source_word: וְאָשֵׁם
  choice: at nagkaroon ng pananagutan
  rationale: Ipinahahayag ang pagkakaroon ng guilt o legal-kultikong pananagutan nang hindi agad ipinapakahulugang sadyang kasalanang moral.
theological_decisions:
- issue: Kalikasan ng karumihan
  choice: Gamitin ang “marumi” bilang katawagang pangritwal.
  alternative: “nadungisan” o “makasalanan”
  rationale: Ang talata ay tungkol sa ritwal na karumihan mula sa paghipo sa bangkay, hindi sa pahayag na ang gayong paghipo ay likas na kasalanang moral.
- issue: Kahulugan ng וְאָשֵׁם
  choice: “nagkaroon ng pananagutan”
  alternative: “nagkasala” o “naging maysala”
  rationale: Pinananatili nito ang legal at kultikong diwa ng guilt/liability at iniiwasang gawing tahasang moral na kasamaan ang mismong di-sinasadyang paghipo.
- issue: Pangkalahatang tinutukoy ng נֶפֶשׁ
  choice: “isang tao” at kasunod na isahang panghalip
  alternative: “isang kaluluwa”
  rationale: Ang batas ay sumasaklaw sa sinumang indibidwal; ang “tao” ang natural at tumpak na modernong Filipino.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mabangis na hayop,” “alagang hayop,” at “gumagapang na nilalang” upang luminaw ang tatlong kategorya. Pinanatili ang mahabang kondisyong legal at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
