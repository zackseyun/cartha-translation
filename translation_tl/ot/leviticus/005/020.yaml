  text: 'At nagsalita si Yahweh kay Moises:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagbubukas ng isang bagong yunit ng pahayag; natural at marangal sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang banal na יְהוָה, sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa kinakausap; “kay Moises” ang natural na anyong Filipino para sa pangngalang pantangi.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa mismong pahayag na susunod, kahit bahagyang pormal ang himig nito sa Filipino.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” at iniiwasang magpasok ng pamalit na wala sa mismong talata.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal na pormula ng banal na pagsasalita at ang kuwit sa hulihan upang ipakitang nagpapatuloy sa susunod na talata ang pahayag.
