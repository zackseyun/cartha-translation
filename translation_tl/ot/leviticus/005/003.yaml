base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: tl
  text: O kung humipo siya sa karumihang mula sa tao[a]—anumang karumihang dahil dito ay nagiging marumi siya—at hindi niya ito namalayan[b], at kalaunan ay nalaman niya, may sala siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karumihan ng tao.” Sa kontekstong ito ng kautusan, ang salitang Hebreo ay tumutukoy sa ritwal na karumihang nagmumula sa isang tao.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at ito ay nalingid sa kanya”; ibig sabihin, hindi niya iyon namalayan noong panahong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: humipo siya sa
  rationale: Tuwirang ipinahahayag ng נגע na may ב ang pisikal na paghipo o pagdikit; natural at malinaw sa modernong Tagalog ang “humipo sa.”
- source_word: טֻמְאַת אָדָם
  choice: karumihang mula sa tao
  rationale: Ang טֻמְאָה sa kontekstong Levitico ay ritwal na karumihan, at ang אָדָם ay tumutukoy sa taong pinagmumulan nito. Iniiwasan ng “mula sa tao” ang maling pahiwatig na moral na kasamaan ng sangkatauhan.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: sa anumang karumihan
  rationale: Pinananatili ng “anumang” ang malawak na saklaw ng כֹל, habang natural na ipinahahayag sa Tagalog ang uri ng karumihang kaugnay ng tao.
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: na maaaring ikarumi niya
  rationale: Ipinahahayag ng parirala ang epekto ng pakikipag-ugnayan sa karumihan. Ang “ikarumi niya” ay maikli at natural, at hindi nagpapasya nang higit sa sinasabi ng Hebreo kung anong partikular na uri ng karumihan iyon.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: at hindi niya ito namalayan
  rationale: Bagaman pasibo ang anyong Hebreo (“nalingid sa kanya”), malinaw at kasalukuyang Tagalog ang “hindi niya ito namalayan,” na pinananatili ang di-pagkakaalam niya nang mangyari iyon.
- source_word: וְהוּא יָדַע
  choice: ngunit kalaunan ay nalaman niya
  rationale: 'Nililinaw ng “kalaunan” ang pagkakasunod: hindi niya muna namalayan at saka niya nalaman. Ang “ngunit” ay natural na naghahayag ng kaibahan nang hindi binabago ang legal na lohika.'
- source_word: וְאָשֵׁם
  choice: may sala siya
  rationale: Ipinahahayag ng אשם ang pagkakaroon ng sala o pananagutang legal-kulto. Mas malapit dito ang “may sala” kaysa “nagkasala,” na maaaring magpahiwatig lamang ng sinasadyang moral na pagkakasala.
theological_decisions:
- issue: Kalikasan ng טֻמְאָה sa kautusang Levitico
  choice: Isinalin bilang “karumihan,” na may talababa tungkol sa ritwal na kahulugan.
  alternative: “Kalabisan,” “kasalanan,” o tahasang “ritwal na karumihan” sa pangunahing teksto.
  rationale: Ang talata ay tumutukoy sa kalagayang ritwal dahil sa paghipo, hindi sa likas na moral na kasamaan. Pinananatili ng “karumihan” ang kategorya ng teksto, habang nililinaw ng talababa ang legal-ritwal na gamit.
- issue: Kahulugan ng אָדָם
  choice: “tao” bilang pangkalahatang katawagan at pinagmumulan ng karumihan.
  alternative: “lalaki” o “sangkatauhan.”
  rationale: Pangkalahatan ang אָדָם dito at hindi tumutukoy lamang sa lalaki. Ang “mula sa tao” ay natural at tumpak sa konteksto.
- issue: Pananagutan sa וְאָשֵׁם
  choice: “may sala siya.”
  alternative: “nagkasala siya” o “naging salarin siya.”
  rationale: Pinananatili ng “may sala” ang legal at panghandog na pananagutan, pati ang tensiyon na maaaring magkaroon ng sala kahit hindi niya namalayan noong una ang pagkahawa sa karumihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang pang-isahang “siya” upang mapanatili ang anyong legal ng Hebreo. Iniwasan ang sobrang teknikal na wika sa pangunahing teksto; ang ritwal na kahulugan at mas literal na anyo ay inilagay sa mga talababa.
