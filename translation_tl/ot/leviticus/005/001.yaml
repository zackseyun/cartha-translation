source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: tl
  text: 'Kung ang isang tao ay magkasala sa ganitong paraan: nakarinig siya ng isang taimtim na panawagang may panunumpa[a] at siya ay saksi—nakita man niya ang nangyari o nalaman niya ito sa ibang paraan—ngunit hindi niya ito ipinahayag, mananagot siya sa kanyang kasalanan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “narinig niya ang tinig ng isang sumpa.” Sa kontekstong legal, ito ay isang taimtim na panawagang may panunumpa o sumpa na humihingi sa mga saksi na magsalita.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “papasanin niya ang kanyang kasamaan.” Ibig sabihin, nananatili siyang may sala at may pananagutan dahil hindi niya inihayag ang kanyang nalalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa batas na ito, tumutukoy ang נֶפֶשׁ sa isang indibidwal, hindi sa “kaluluwa” bilang hiwalay na sangkap ng tao. Likas at malinaw sa modernong Tagalog ang “isang tao.”
- source_word: תֶחֱטָא
  choice: magkasala
  rationale: Pinananatili nito ang moral at legal na bigat ng pandiwang חטא nang hindi ito nililimitahan sa kahulugang parusa lamang.
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: narinig niya ang isang sinumpaang panawagan
  rationale: Sa kontekstong legal, ang parirala ay tumutukoy sa taimtim na panawagang may panunumpa o sumpa na humihingi ng patotoo. Mas nauunawaan sa Tagalog ang “sinumpaang panawagan” kaysa sa sobrang literal na “tinig ng isang sumpa,” habang inilalahad sa talababa ang literal at alternatibong diwa.
- source_word: וְהוּא עֵד
  choice: at siya ay saksi
  rationale: Tuwirang pinananatili nito ang legal na katayuan ng taong may kaalaman sa usapin.
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: nakita man niya ang nangyari o nalaman ito sa ibang paraan
  rationale: Saklaw ng pares ang tuwirang pagkakita at kaalamang nakuha sa ibang paraan. Ang paglilinaw ay hindi naglilimita sa uri ng kaalaman.
- source_word: אִם לֹא יַגִּיד
  choice: ngunit hindi niya ito ipinahayag
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam, ihayag, o iulat. Ang “ipinahayag” ay angkop sa pormal na konteksto at hindi labis na nagpapalagay ng makabagong proseso sa hukuman.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: mananagot siya sa kanyang kasalanan
  rationale: Ipinahahayag nito ang pananagutan sa pagkakasala at sa mga bunga nito. Inilalagay sa talababa ang mas literal na idyomang “papasanin niya ang kanyang kasamaan.”
theological_decisions:
- issue: Kasarian sa pormulang legal
  choice: Panatilihin ang pang-isahang “isang tao” at ang panghalip na “siya.”
  alternative: Gumamit ng tahasang panlalaking “lalaki” o paulit-ulit na “ang taong iyon.”
  rationale: Ang נֶפֶשׁ ay “isang tao,” at likas na walang tinutukoy na kasarian ang Tagalog na “siya.” Kaya napapanatili ang pang-isahang legal na halimbawa nang hindi nagdaragdag ng kasariang hindi hinihingi ng kahulugan.
- issue: Ugnayan ng pagkakasala at ng narinig na panawagan
  choice: Isalin bilang “magkasala ... dahil narinig niya ... ngunit hindi niya ito ipinahayag.”
  alternative: Ihanay lamang ang mga sugnay gamit ang “at,” na maaaring magpalabo kung ano ang pagkakasala.
  rationale: Sa kontekstong legal, ang pagkakasala ay ang hindi paghahayag ng nalalaman matapos marinig ang panawagan. Nililinaw ng ayos sa Tagalog ang ugnayang ito nang hindi ginagawang kasalanan ang pakikinig mismo.
- issue: Saklaw ng “papasanin ang kasamaan”
  choice: “Mananagot siya sa kanyang kasalanan.”
  alternative: “Papasanin niya ang parusa sa kanyang kasalanan.”
  rationale: Hindi tahasang nililimitahan ng Hebreong idyoma ang kahulugan sa parusa lamang; kabilang dito ang nananatiling sala at pananagutan. Kaya hindi idinagdag ang salitang “parusa” sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig na angkop sa tekstong legal. Ginamit ang “sinumpaang panawagan,” “saksi,” at “ipinahayag” upang mapanatili ang pormal na konteksto nang hindi maging lipas o labis na teknikal.
