revisions:
- from: Babayaran niya ang anumang kinuha o ipinagkait niya mula sa banal na bagay[a]. Dadagdagan niya iyon ng ikalimang bahagi at ibibigay sa pari. At ang pari ay gagawa ng pagtubos para sa kanya sa pamamagitan ng lalaking tupa na handog para sa pagkakasala[b], at patatawarin siya.
  to: Dapat niyang isauli ang halaga ng anumang ipinagkait niya mula sa banal na bagay[a]. Dapat niyang dagdagan ito ng ikalimang bahagi ng halaga nito at ibigay ito sa pari. Pagkatapos, ang pari ay gagawa ng pagtubos para sa kanya sa pamamagitan ng lalaking tupa para sa handog na kabayaran[b], at patatawarin siya.
