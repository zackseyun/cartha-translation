  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: tl
  text: Dapat niyang isauli ang halaga ng anumang ipinagkait niya mula sa banal na bagay[a]. Dapat niyang dagdagan ito ng ikalimang bahagi ng halaga nito at ibigay ito sa pari. Pagkatapos, ang pari ay gagawa ng pagtubos para sa kanya sa pamamagitan ng lalaking tupa para sa handog na kabayaran[b], at patatawarin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang halaga ng anumang kinuha o ipinagkait niya mula sa banal na bagay.” Ang Hebreo ay tumutukoy sa kabayaran para sa paglabag na may kinalaman sa isang banal o sagradong bagay.
    reason: lexical_alternative
  - marker: b
    text: O, “lalaking tupa para sa handog para sa pagkakasala.” Ang salitang Hebreo ay maaaring magdiin kapwa sa pagkakasala at sa kinakailangang kabayaran.
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: anumang kinuha o ipinagkait niya mula sa banal na bagay
  rationale: Ipinahahayag nito sa natural na Tagalog ang paglabag na may kinalaman sa sagradong ari-arian o mga ukol sa Diyos, nang hindi nililimitahan ang הַקֹּדֶשׁ sa santuwaryo lamang.
- source_word: יְשַׁלֵּם
  choice: babayaran
  rationale: Sa kontekstong legal at panghandog, tumutukoy ito sa pagsasauli o pagbabayad bilang kabayaran; malinaw at karaniwan sa Tagalog ang “babayaran.”
- source_word: חֲמִישִׁתוֹ
  choice: ikalimang bahagi
  rationale: Tumpak na katumbas ng isang ikalimang bahagi at hindi gumagamit ng makabagong porsiyento na wala sa teksto.
- source_word: יוֹסֵף עָלָיו
  choice: dadagdagan niya iyon
  rationale: Natural na inilalarawan ang pagdaragdag ng singil sa pangunahing halagang ibinabalik.
- source_word: לַכֹּהֵן
  choice: sa pari
  rationale: Tuwiran at karaniwang katumbas ng tatanggap ng kabayaran.
- source_word: יְכַפֵּר עָלָיו
  choice: gagawa ng pagtubos para sa kanya
  rationale: Pinananatili ang wikang panghandog ng כפר sa paraang nauunawaan ng modernong mambabasa.
- source_word: בְּאֵיל הָאָשָׁם
  choice: sa pamamagitan ng lalaking tupa na handog para sa pagkakasala
  rationale: Ipinakikita ang kasangkapang panghandog at ginagamit ang madaling maunawaang katawagan para sa אָשָׁם, habang itinatala sa talababa ang diin nito sa kabayaran.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Natural na Tagalog para sa pasibong pahayag ng pagkakaloob ng kapatawaran.
theological_decisions:
- issue: Kahulugan ng אָשָׁם bilang katawagang panghandog
  choice: handog para sa pagkakasala
  alternative: handog na kabayaran
  rationale: Ang termino ay maaaring magdiin kapwa sa pagkakasala at sa pagsasaayos o kabayaran. Ang pangunahing salin ay madaling makilala, samantalang malinaw na ang aspekto ng kabayaran sa unang bahagi ng talata at sa talababa.
- issue: Kahulugan ng כפר sa ritwal na konteksto
  choice: gumawa ng pagtubos para sa kanya
  alternative: gumawa ng pagtatakip para sa kanya
  rationale: Ang “pagtubos” ay dignificado at mauunawaan sa kontekstong panghandog, ngunit hindi nito ipinapaliwanag nang lampas sa teksto kung paano gumagana ang ritwal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at angkop sa tekstong legal at panghandog. Iniwasan ang sobrang teknikal na pananalita at pinanatili sa mga talababa ang tunay na lawak ng mga salitang Hebreo.
