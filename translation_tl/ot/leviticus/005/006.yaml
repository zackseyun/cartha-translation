revisions:
- from: 'At dadalhin niya kay Yahweh ang handog niya para sa pagkakasala[a] dahil sa kasalanang nagawa niya: isang babaeng hayop mula sa kawan—isang babaeng tupa o babaeng kambing—bilang handog para sa kasalanan; at gagawa ang pari ng pagtubos para sa kanya mula sa kanyang kasalanan.[b]'
  to: 'At dadalhin niya kay Yahweh ang handog niya para sa pagkakasala[a] dahil sa kasalanang nagawa niya: isang babaeng hayop mula sa kawan—isang babaeng tupa o babaeng kambing—bilang handog para sa kasalanan; at magbabayad-sala ang pari para sa kanya dahil sa kanyang kasalanan.[b]'
  rationale: Pinalitan ang “gagawa ... ng pagtubos” ng “magbabayad-sala” upang maging natural ang Tagalog at maipahayag nang mas angkop ang ritwal na diwa ng כפר. Ginawang idiomatiko ang pangunahing salin ng מִן sa “dahil sa,” habang pinanatili sa talababa ang literal na “mula sa” at ang posibleng diwa ng pag-aalis. Walang binagong kahulugan sa ibang bahagi.
