source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: tl
  text: 'At dadalhin niya kay Yahweh ang handog niya para sa pagkakasala[a] dahil sa kasalanang nagawa niya: isang babaeng hayop mula sa kawan—isang babaeng tupa o babaeng kambing—bilang handog para sa kasalanan; at magbabayad-sala ang pari para sa kanya dahil sa kanyang kasalanan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog niya dahil sa kanyang sala” o “handog niya bilang kabayaran.” Ang salitang Hebreo na אשם ay kaugnay ng sala at pananagutan, samantalang sa bandang huli ay tinatawag ang hayop na “handog para sa kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang huling parirala na “mula sa kanyang kasalanan.” Ang literal na “mula sa kanyang kasalanan” ay maaaring magdiin sa pag-aalis ng kasalanan bilang bunga ng pagbabayad-sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: At dadalhin niya
  rationale: Ang anyong pandiwa sa kontekstong pambatas ay may diwang nag-uutos; natural sa modernong Tagalog ang panghinaharap na anyo.
- source_word: אֲשָׁמוֹ
  choice: ang handog niya para sa pagkakasala
  rationale: Pinananatili nito ang kaugnayan ng אשם sa sala/pananagutan nang hindi ipinapantay ang termino sa חטאת na lumilitaw sa hulihan ng talata.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה bilang Yahweh.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dahil sa kasalanang nagawa niya
  rationale: Ipinahahayag nang natural ang batayan ng paghahandog at pinananatili ang tahasang pagtukoy sa kasalanan.
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: isang babaeng hayop mula sa kawan
  rationale: Pinananatili ang tahasang pagtukoy sa kasarian at ang pangkalahatang kategorya ng maliliit na alagang hayop.
- source_word: כִשְׂבָּה אֽוֹ שְׂעִירַת עִזִּים
  choice: isang babaeng tupa o babaeng kambing
  rationale: Malinaw na ipinakikita sa Tagalog na kapwa babaeng hayop ang mga maaaring ihandog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Natural na katawagan sa Tagalog para sa hain na tinutukoy ng חטאת, habang nananatiling naiiba sa אשם sa unang bahagi.
- source_word: וְכִפֶּר עָלָיו
  choice: at gagawa ang pari ng pagtubos para sa kanya
  rationale: Ang 'pagtubos' ay dignified at nauunawaang salin ng ritwal na כפר, nang hindi tinutukoy ang isang makitid na teorya ng pagbabayad-sala.
- source_word: מֵחַטָּאתוֹ
  choice: mula sa kanyang kasalanan
  rationale: Sinusundan ang literal na puwersa ng מן at pinananatili ang posibleng diwa ng paglaya o pag-aalis mula sa kasalanan.
theological_decisions:
- issue: Magkasabay na paggamit ng אשם at חטאת
  choice: Isinalin ang אשם bilang 'handog ... para sa pagkakasala' at ang חטאת bilang 'handog para sa kasalanan.'
  alternative: Gawing iisang katawagan ang dalawang handog, o isalin ang חטאת bilang 'handog para sa paglilinis.'
  rationale: Magkaibang termino ang sadyang pinagtatabi ng Hebreo. Pinananatili ng salin ang pagkakaiba at tensiyon sa halip na pag-isahin ang mga ito.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang Yahweh ang tuwirang representasyon ng יהוה at ang hinihinging anyo sa ibinigay na konsultasyong layer.
- issue: Saklaw ng כפר at מן
  choice: “gagawa ... ng pagtubos ... mula sa kanyang kasalanan”
  alternative: “magbabayad-sala ... para sa kanyang kasalanan”
  rationale: Pinananatili ang kultikong diwa ng כפר at ang posibleng puwersa ng מן bilang pag-aalis o paglaya, nang hindi nilulutas ang kahulugan sa isang doktrinal na pormula.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “kawan,” “handog,” at “pagtubos” bilang dignified na bokabularyong pangritwal; iniwasan ang labis na teknikal o denominasyonal na pananalita.
