  naturalness: Pormal ang kabuuang rehistro, ngunit ang “gagawa ang pari ng pagtubos para sa kanya mula sa kanyang kasalanan” ay mabigat at hindi idiomatiko. Ang “magbabayad-sala ang pari para sa kanya dahil sa kanyang kasalanan” ay mas natural na Tagalog at ang literal na posibilidad ng “mula” ay maaaring manatili sa talababa.
  terminology: Ang “handog para sa pagkakasala” para sa אשם at “handog para sa kasalanan” para sa חטאת ay sapat na magkaiba upang maipakita ang pagtutumbok ng Hebreo. Ang “magbabayad-sala” ay mas angkop kaysa “gagawa ng pagtubos” para sa כפר sa ganitong kontekstong panghain.
