  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: יהוה (YHWH); isinasalin dito bilang “Yahweh.”'
    reason: Nililinaw ang anyong Hebreo ng banal na pangalan at ang transliterasyong ginamit sa salin nang hindi nagpapahiwatig ng tiyak na makasaysayang pagbigkas.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang pandiwa ay nagpapakilala ng isang bagong pangyayari ng pagsasalita. Ang “nagsalita” ay likas at marangal na katumbas sa paulit-ulit na pormula ng banal na pagpapahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng apat na katinig na YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ito ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong Filipino.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Ipinakikilala nito ang mismong nilalaman ng pahayag na sumusunod. Ang “at sinabi” ay natural sa Filipino at pinananatili ang kaugnayan nito sa susunod na talata.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang banal na pangalan. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo o gumamit ng ibang tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa paulit-ulit na pormula ng banal na pagpapahayag. Ginamit ang “at sinabi” sa halip na ang mas literal ngunit hindi likas na “na sinasabi.”
