  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: tl
  text: o makasumpong siya ng nawawalang ari-arian at magsinungaling tungkol dito at manumpa nang may kabulaanan—tungkol sa alinman sa lahat ng bagay na maaaring gawin ng isang tao upang magkasala sa pamamagitan ng mga iyon—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: nawalang ari-arian
  rationale: Tumutukoy sa isang bagay na nawala at natagpuan; mas malinaw sa konteksto ng pagsasauli kaysa sa payak na “nawalang bagay.”
- source_word: וְכִחֶשׁ בָּהּ
  choice: ngunit ikinaila niya ito
  rationale: Ang כחש dito ay pagsisinungaling o pagkakaila tungkol sa natagpuang ari-arian; ipinahahayag ng “ikinaila” ang kontekstuwal na diwa.
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: at nanumpa siya sa kasinungalingan
  rationale: Pinananatili ang tahasang kaugnayan ng panunumpa sa kabulaanan nang hindi dinaragdagan ang diwa.
- source_word: הָאָדָם
  choice: isang tao
  rationale: Sa pangkalahatang pahayag na ito, kolektibo at pangkalahatan ang kahulugan ng האדם, kaya likas at saklaw ang “isang tao.”
- source_word: לַחֲטֹא בָהֵנָּה
  choice: at sa gayo'y magkasala
  rationale: Ipinapakita ang resultang pagkakasala sa pamamagitan ng alinman sa nabanggit na mga gawa, habang iniiwasan ang alanganing literal na “magkasala sa mga iyon.”
theological_decisions:
- issue: Pangkalahatang saklaw ng הָאָדָם
  choice: isang tao
  alternative: isang lalaki
  rationale: Ang konteksto ay pangkalahatang tuntunin tungkol sa sinumang gumagawa ng mga kasalanang ito, hindi pagtukoy sa kasariang lalaki.
- issue: Ugnayan ng gawa at pagkakasala sa לַחֲטֹא בָהֵנָּה
  choice: at sa gayo'y magkasala
  alternative: upang magkasala sa mga iyon
  rationale: Pinananatili ang ugnayang sanhi o paraan nang hindi nagpapasok ng paliwanag tungkol sa antas o uri ng kasalanan.
translation_notes:
  register: Modernong Filipino na dignipikado at malinaw. Pinanatili ang anyong di-ganap ng pangungusap dahil nagpapatuloy ang sintaktikong kaisipan sa kasunod na talata.
