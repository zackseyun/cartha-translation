  text: וְ/אִם לֹ֨א תַגִּ֣יע יָד/וֹ֮ דֵּ֣י שֶׂה֒ וְ/הֵבִ֨יא אֶת אֲשָׁמ֜/וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ שְׁנֵ֥י בְנֵֽי יוֹנָ֖ה לַֽ/יהוָ֑ה אֶחָ֥ד לְ/חַטָּ֖את וְ/אֶחָ֥ד לְ/עֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: tl
  text: 'Ngunit kung hindi niya kayang tustusan ang isang tupa, magdadala siya kay Yahweh ng dalawang batobato o dalawang batang kalapati bilang handog para sa pagkakasala dahil sa kasalanang nagawa niya: ang isa ay handog para sa kasalanan[a], at ang isa ay handog na sinusunog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin bilang “handog para sa paglilinis.” Ang Hebreong חַטָּאת ay maaaring tumukoy sa “kasalanan” o sa handog na kaugnay ng pag-aalis ng karumihan o kasalanan sa konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: hindi niya kayang maghandog ng isang tupa
  rationale: Ang literal na larawang hindi ‘umaabot’ ang kamay ay idyoma para sa kakayahang pinansiyal. Likas sa modernong Filipino ang napiling pahayag at malinaw sa konteksto na hindi niya kayang tustusan ang hinihinging tupa.
- source_word: אֲשָׁמוֹ
  choice: handog para sa pananagutan niya
  rationale: Tinutukoy ng אָשָׁם dito ang handog na inihaharap dahil sa pagkakasala o pananagutan. Pinananatili ng ‘pananagutan’ ang pagkakaiba nito sa חַטָּאת sa hulihan ng talata at iniiwasang ipakahulugan agad kung paano gumagana ang handog.
- source_word: אֲשֶׁר חָטָא
  choice: sa kasalanang nagawa niya
  rationale: Natural na ipinapahayag sa Filipino ang kaugnayan ng handog sa partikular na pagkakasalang nagawa.
- source_word: שְׁתֵּי תֹרִים
  choice: dalawang batu-bato
  rationale: Ang ‘batu-bato’ ang karaniwang pangalang Filipino para sa turtledove at angkop sa ibong tinutukoy sa batas sa paghahandog.
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: dalawang batang kalapati
  rationale: Ang literal na ‘mga anak ng kalapati’ ay idyomang Hebreo para sa mga batang kalapati; natural at tiyak ang salin.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tahasang isinasalin ang pantanging pangalang יהוה bilang ‘Yahweh,’ ayon sa anyo ng tekstong pinagmulan at sa audited consultation text.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang חַטָּאת sa isang uri ng handog. Ang tradisyonal na katawagan ay malinaw sa mga pangkalahatang mambabasa; itinatala sa talababa ang mahalagang alternatibong pag-unawa.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog sa altar. Ang pahayag ay malinaw at likas sa Filipino nang hindi ginagamit ang di-pamilyar na literal na ‘handog na paakyat.’
theological_decisions:
- issue: Kahulugan ng terminong pansakripisyong חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Pinapaboran ng legal at pansakripisyong konteksto, pati ng pagkakatambal nito sa עֹלָה, ang tradisyonal na katawagan sa pangunahing teksto. Gayunman, maaari ring idiin ng termino ang paglilinis mula sa karumihan o kasalanan, kaya pinananatili ang pagbasa na iyon sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang mga karaniwang pariralang ‘handog para sa kasalanan’ at ‘handog na sinusunog,’ habang ang ‘handog para sa pananagutan’ ay sadyang nagbubukod sa אָשָׁם mula sa חַטָּאת. Inilagay ang [a] kaagad pagkatapos ng terminong tinatalakay nito, sa halip na pagkatapos ng ‘tupa,’ upang maging tama ang ugnayan ng talababa.
