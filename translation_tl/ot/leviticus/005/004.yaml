id: LEV.5.4
reference: Leviticus 5:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְ/בַטֵּ֨א בִ/שְׂפָתַ֜יִם לְ/הָרַ֣ע א֣וֹ לְ/הֵיטִ֗יב לְ֠/כֹל אֲשֶׁ֨ר יְבַטֵּ֧א הָ/אָדָ֛ם בִּ/שְׁבֻעָ֖ה וְ/נֶעְלַ֣ם מִמֶּ֑/נּוּ וְ/הוּא יָדַ֥ע וְ/אָשֵׁ֖ם לְ/אַחַ֥ת מֵ/אֵֽלֶּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: tl
  text: O kung ang isang tao ay padalos-dalos na manumpa sa pamamagitan ng kanyang mga labi[a] na gagawa siya ng masama o mabuti—anuman ang maaaring ipahayag ng isang tao sa isang panunumpa—at hindi niya ito namalayan[b], at pagkatapos ay nalaman niya ito at naging maysala siya sa isa sa mga bagay na ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “bumigkas ng panunumpa sa pamamagitan ng kanyang mga labi.” Maaaring idiin ng Hebreong pandiwa ang mismong pagbigkas, bagaman ipinahihiwatig ng konteksto ang padalos-dalos o di-pinag-isipang panunumpa.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “at ito ay nalihim sa kanya.” Maaaring tumukoy ito sa panunumpa o sa kahulugan at pananagutang kaugnay nito na hindi niya agad namalayan.'
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa kontekstong legal, tumutukoy ito sa isang indibidwal, hindi sa di-materyal na kaluluwa.
- source_word: תִשָּׁבַע
  choice: manumpa
  rationale: Tuwirang ipinapahayag ng anyong ito ng שׁבע ang panunumpa o panata.
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: padalos-dalos na manumpa sa pamamagitan ng kanyang mga labi
  rationale: Pinananatili ang tahasang pagtukoy sa pasalitang pagbigkas sa pamamagitan ng mga labi, habang ipinapakita ng “padalos-dalos” ang malamang na di-pinag-isipang pananalita sa kontekstong ito; nililinaw sa talababa ang leksikal na ambiguwidad.
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: na gagawa siya ng masama o mabuti
  rationale: Pinananatili ang malawak na magkatunggaling saklaw ng nilalaman ng panunumpa, nang hindi nililimitahan ito sa pananakit o pagtulong lamang.
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: anuman ang maaaring ipahayag ng isang tao sa isang panunumpa
  rationale: Natural na paglalahat ito sa Tagalog at tumutukoy sa anumang pasalitang nilalaman ng panunumpa. Ang “isang tao” ay angkop na panlahatang katumbas ng generic na הָאָדָם.
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: at hindi niya ito namalayan
  rationale: Natural na Tagalog para sa pasibong Hebreong nagsasaad na ang bagay ay nalihim o nakalampas sa kanyang kamalayan; ang mas literal na anyo ay nasa talababa.
- source_word: וְהוּא יָדַע
  choice: ngunit kalaunan ay nalaman niya ito
  rationale: Ipinakikita ang pagkakasunod mula sa dating kawalang-malay tungo sa pagkabatid, nang hindi ipinapalagay kung paano niya nalaman.
- source_word: וְאָשֵׁם
  choice: at naging maysala siya
  rationale: Ipinahahayag ang pagkakasala o legal na pananagutan nang hindi dinaragdagan ang teksto ng tiyak na parusa.
- source_word: לְאַחַת מֵאֵלֶּה
  choice: sa isa sa mga bagay na ito
  rationale: Itinuturo nito ang isa sa mga kasong binanggit sa kasalukuyang seksiyon at pinananatili ang legal na tono.
theological_decisions:
- issue: Saklaw ng generic na הָאָדָם sa pormulang legal
  choice: isang tao
  alternative: isang lalaki
  rationale: Sa Tagalog, ang “tao” ay natural at walang kasariang panlahatang katawagan. Pinananatili nito ang saklaw ng Hebreong kumakatawan sa sinumang tao at hindi ipinahihiwatig na lalaki lamang ang saklaw ng kautusan.
- issue: Kalikasan ng pagkakasala kaugnay ng naunang kawalang-malay
  choice: 'Pinanatili ang pagkakasunod: hindi namalayan, kalaunan ay nalaman, at naging maysala'
  alternative: Ipaliwanag na ang pagkakasala ay nagsisimula lamang nang malaman niya ito
  rationale: Hindi tiyak na nilulutas ng Hebreo kung kailan eksaktong nagsimula ang pananagutan; inilalahad lamang nito ang kawalang-malay, kasunod na pagkabatid, at pagiging maysala. Kaya hindi nagdagdag ang salin ng doktrinal na paliwanag.
- issue: Diwa ng לְבַטֵּא bilang padalos-dalos na pananalita o simpleng pagbigkas
  choice: padalos-dalos na manumpa, na may talababa tungkol sa literal na pagbigkas
  alternative: bumigkas ng panunumpa
  rationale: Sinusuportahan ng legal na konteksto ang di-pinag-isipang panunumpa, ngunit maaari ring idiin ng pandiwa ang mismong pasalitang pagbigkas. Pinananatili ng talababa ang tunay na leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong legal at ang tuloy-tuloy na sintaks ng talata, kasama ang pangwakas na kuwit dahil nagpapatuloy ang pangungusap sa susunod na talata. Ginamit ang “kanyang” bilang karaniwang panlahatang panghalip sa Tagalog.
