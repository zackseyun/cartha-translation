base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: tl
  text: Dadalhin niya ang mga iyon sa pari. Ihahandog muna niya ang ibong para sa handog para sa kasalanan.[a] Pipilipitin niya ang ulo nito sa tapat ng batok nito[b], ngunit hindi niya iyon tuluyang ihihiwalay sa katawan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “handog para sa kasalanan” bilang “handog para sa paglilinis.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong puwesto na tinutukoy ng pariralang Hebreo; literal itong may diwang “sa tapat ng batok nito.”
    reason: textual_or_semantic_ambiguity
  - marker: c
    text: Ibig sabihin, hindi dapat lubusang matanggal ang ulo sa katawan ng ibon.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: Dadalhin niya ang mga iyon sa pari
  rationale: Pinananatili ang maramihang אֹתָם, na tumutukoy sa dalawang ibon sa naunang talata, at natural na ipinahahayag ang legal na utos sa Filipino.
- source_word: וְהִקְרִיב
  choice: Ihahandog niya
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay tumutukoy sa ritwal na paghahandog o paglalapit bilang handog. Ang panghalip na “niya” ay hindi tahasang nililinaw upang mapanatili ang anyo ng Hebreo, bagaman ang pari ang pinakamalapit na tinutukoy.
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: muna ang ibong para sa handog para sa kasalanan
  rationale: Ipinapakita ng “muna” ang prayoridad ng רִאשׁוֹנָה, at nililinaw ng “ibong” ang tinutukoy mula sa konteksto nang hindi nagdaragdag ng bagong ritwal na detalye.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Ito ang pamilyar at malinaw na katawagan sa Filipino; maaari ring unawain ang terminong Levitico bilang handog para sa paglilinis, kaya inilalahad ang alternatibo sa talababa.
- source_word: וּמָלַק
  choice: Pipilipitin
  rationale: Teknikal itong pandiwa para sa pagkilos ng pari sa ulo o leeg ng ibong inihahandog. Ang “pipilipitin” ay nauunawaan sa Filipino at hindi awtomatikong nagpapahiwatig na lubusang inihiwalay ang ulo.
- source_word: מִמּוּל עָרְפּוֹ
  choice: sa gawing tapat ng batok
  rationale: Pinananatili nito ang ugnayan ng מוּל (“tapat/katapat”) at עֹרֶף (“batok”), habang kinikilalang mahirap tiyakin ang eksaktong anatomikong punto ng parirala.
- source_word: וְלֹא יַבְדִּיל
  choice: ngunit hindi niya iyon tuluyang ihihiwalay sa katawan
  rationale: 'Ang בדל ay “ihiwalay.” Nililinaw ng “tuluyang” at “sa katawan” ang ritwal na diwa: hindi dapat ganap na matanggal ang ulo, nang hindi sinasabing walang anumang paghiwa o pagpunit.'
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Parehong may batayan sa gamit ng terminong Hebreo sa Levitico. Ginamit sa teksto ang mas kilalang katawagan, ngunit pinanatili sa talababa ang tunay na alternatibong pansakripisyo.
translation_notes:
  register: Makabago at marangal na Filipino, na may maiikling pangungusap para maging malinaw ang sunod-sunod na ritwal. Ginamit ang “pari,” “ibong,” at “handog para sa kasalanan” bilang mga salitang madaling maunawaan. Pinanatili ang panghalip na “niya” sa ikalawang pangungusap upang hindi higit na lutasin kaysa sa Hebreo ang bahagyang kalabuan ng simuno.
