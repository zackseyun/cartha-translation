  to: Dadalhin niya ang mga iyon sa pari. Ihahandog muna niya ang ibong para sa handog para sa kasalanan.[a] Pipilipitin niya ang ulo nito sa tapat ng batok nito[b], ngunit hindi niya iyon tuluyang ihihiwalay sa katawan.[c]
