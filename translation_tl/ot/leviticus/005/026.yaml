revisions:
- from: At gagawa ang pari ng pagtubos para sa kanya sa harap ni Yahweh, at patatawarin siya sa alinman sa lahat ng nagawa niya na nagdulot sa kanya ng pagkakasala.[a]
  to: At magsasagawa ang pari ng pagtubos para sa kanya sa harap ni Yahweh, at patatawarin siya sa alinmang bagay sa lahat ng maaari niyang gawin na magdudulot sa kanya ng pagkakasala.[a]
  rationale: Inayos ang aspekto ng pandiwa upang maipakita ang pangkalahatan o potensiyal na diwa ng Hebreo, at pinakinis ang pariralang distributibo. Pinanatili ang pasibong pagpapatawad, ang pangalang Yahweh, at ang ritwal na terminong “pagtubos.”
