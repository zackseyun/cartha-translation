base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: tl
  text: At magsasagawa ang pari ng pagtubos para sa kanya sa harap ni Yahweh, at patatawarin siya sa alinmang bagay sa lahat ng maaari niyang gawin na magdudulot sa kanya ng pagkakasala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “dahil sa isa sa lahat ng maaari niyang gawin upang magkaroon ng pagkakasala dahil dito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: gagawa ... ng pagtubos
  rationale: Ang Piel ng כפר sa kontekstong paghahandog ay tumutukoy sa pagsasagawa ng ritwal na pagtubos; malinaw at pamilyar sa modernong Filipino ang pariralang ito nang hindi ipinipilit ang isang partikular na teorya ng pagtubos.
- source_word: עָלָיו
  choice: para sa kanya
  rationale: Kasama ng כפר, ang עַל ay tumutukoy sa taong pinatutungkulan ng pagtubos.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang salin ng tiyak na pangngalan sa kontekstong pangsaserdote.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ng 'sa harap' ang diwa ng presensiya sa kontekstong santuwaryo, at isinasalin ang pangalan ng Diyos bilang Yahweh.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Ang Nifal ng סלח ay nagpapahayag ng pagtanggap ng kapatawaran. Likas sa Filipino ang pasibong anyo at hindi nito tahasang idinaragdag kung sino ang tagapagpatawad.
- source_word: עַל אַחַת מִכֹּל
  choice: sa alinman sa lahat
  rationale: 'Ipinahahayag nito ang distributibong diwa: anumang isang kaso mula sa buong uri ng mga pagkakasalang tinutukoy.'
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: ng nagawa niya na nagdulot sa kanya ng pagkakasala
  rationale: Inilalahad nang natural sa Filipino ang literal na ideyang 'na maaari niyang gawin upang magkasala dahil dito,' habang pinananatili ang ugnayan ng ginawa at ng pananagutang idinulot nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Sino ang nagpapatawad
  choice: pasibong 'patatawarin siya'
  alternative: patatawarin siya ng Diyos
  rationale: Pasibo ang tekstong Hebreo at hindi hayagang binabanggit ang gumagawa ng pagpapatawad; pinananatili ng salin ang pahiwatig nang hindi nagdaragdag ng tahasang simuno.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'pari' at 'pagtubos' bilang pamilyar na bokabularyong panrelihiyon; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
