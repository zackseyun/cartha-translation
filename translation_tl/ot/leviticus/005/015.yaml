  terminology: Ang “Yahweh,” “lalaking tupa na walang kapintasan,” “siklong pilak,” at “siklo ng santuwaryo” ay angkop. Ang “handog na kabayaran” ay isang katanggap-tanggap na salin ng אָשָׁם sa kontekstong ito, at ang mga alternatibo sa talababa ay maayos na nag-iingat sa saklaw ng termino.
