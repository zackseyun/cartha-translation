id: LEV.5.15
reference: Leviticus 5:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: tl
  text: '“Kung ang isang tao ay gumawa ng paglabag sa katapatan at magkasala nang hindi sinasadya, may kinalaman sa mga banal na bagay ni Yahweh, dadalhin niya kay Yahweh ang kanyang handog na kabayaran[a]: isang lalaking tupa na walang kapintasan mula sa kawan, ayon sa halagang tatayahin mo sa mga siklong pilak, batay sa siklo ng santuwaryo[b], bilang handog na kabayaran.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa pagkakasala” o “handog na pambayad-pinsala” sa dalawang paglitaw ng “handog na kabayaran.” Ang salitang Hebreo na אָשָׁם ay maaaring tumukoy kapwa sa pananagutang dulot ng paglabag at sa handog na kaugnay ng kabayaran o pagsasauli.
    reason: lexical_alternative
  - marker: b
    text: Ang “siklo ng santuwaryo” ay ang pamantayang timbang na ginagamit sa mga banal na pagtataya.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa kontekstong legal, tumutukoy ito sa isang indibidwal, hindi lamang sa ‘kaluluwa.’
- source_word: תִמְעֹל מַעַל
  choice: magtaksil
  rationale: Ipinahahayag ng magkaugnay na pandiwa at pangngalan ang paglabag sa katapatan, lalo na sa isang banal na pananagutan.
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: magkasala nang hindi sinasadya
  rationale: Malinaw na pinananatili ang di-sinasadyang katangian ng pagkakasala at hindi ito inilalarawan bilang tahasang paghihimagsik.
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: may kinalaman sa mga banal na bagay ni Yahweh
  rationale: Pinananatili ang malawak na ugnayan ng kasalanan sa mga bagay, handog, o ari-ariang inilaan kay Yahweh nang hindi labis na nililimitahan ang diwa ng pang-ukol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: handog na kabayaran
  rationale: Maaaring tukuyin ng אָשָׁם ang pananagutan sa kasalanan at ang handog na naglalaan ng kabayaran. Ang ‘handog na kabayaran’ ay natural at itinatampok ang reparatibong diwa ng talata, habang inilalagay sa talababa ang ibang lehitimong salin.
- source_word: אַיִל תָּמִים
  choice: isang lalaking tupa na walang kapintasan
  rationale: Tiyak na tinutukoy ng אַיִל ang lalaking tupa, at sa kontekstong panghandog ang תָּמִים ay nangangahulugang walang depekto.
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Natural na katumbas ito ng kolektibong katawagan para sa maliliit na alagang hayop; nililinaw na ng ‘lalaking tupa’ ang uri ng hayop.
- source_word: בְּעֶרְכְּךָ
  choice: ayon sa halagang tatayahin mo
  rationale: Pinananatili ang ikalawang panauhang isahan at ang ideya ng opisyal na pagtataya ng halaga.
- source_word: כֶּסֶף שְׁקָלִים
  choice: sa mga siklong pilak
  rationale: Ipinahahayag ang pagtataya sa yunit ng timbang at halaga na siklong pilak.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: batay sa siklo ng santuwaryo
  rationale: Ipinakikita na ang timbang ay sinusukat ayon sa pamantayang ginagamit sa santuwaryo.
theological_decisions:
- issue: Kahulugan ng terminong panghandog na אָשָׁם
  choice: handog na kabayaran
  alternative: handog para sa pagkakasala; handog na pambayad-pinsala
  rationale: Dahil ang talata ay tungkol sa paglabag na may kinalaman sa mga banal na bagay at sa pagtataya sa pilak, mahalaga ang diwa ng pagbabayad o pagsasauli. Gayunman, hindi inaalis ang kaugnayan nito sa pagkakasala, kaya pinananatili sa talababa ang mga alternatibo.
- issue: Kasariang gramatikal sa pormulang legal
  choice: ang isang tao … dadalhin niya
  alternative: sinumang tao … dadalhin nila
  rationale: Natural sa Tagalog ang panghalip na ‘niya,’ na hindi nagpapahiwatig ng kasariang lalaki, habang pinananatili ang isahang pormulang legal ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘siklo’ bilang kinikilalang katawagan sa sinaunang yunit, at ‘santuwaryo’ upang maikli ngunit malinaw na tukuyin ang banal na pamantayan. Inilagay ang [a] sa mismong terminong אָשָׁם upang tumugma ang pananda sa nilalaman ng talababa.
