revisions:
- from: '“Kung ang isang tao ay magtaksil at magkasala nang hindi sinasadya may kinalaman sa mga banal na bagay ni Yahweh, dadalhin niya kay Yahweh ang kanyang handog na kabayaran[a]: isang lalaking tupa na walang kapintasan mula sa kawan, ayon sa halagang tatayahin mo sa mga siklong pilak, batay sa siklo ng santuwaryo[b], bilang handog na kabayaran.”'
  to: '“Kung ang isang tao ay gumawa ng paglabag sa katapatan at magkasala nang hindi sinasadya, may kinalaman sa mga banal na bagay ni Yahweh, dadalhin niya kay Yahweh ang kanyang handog na kabayaran[a]: isang lalaking tupa na walang kapintasan mula sa kawan, ayon sa halagang tatayahin mo sa mga siklong pilak, batay sa siklo ng santuwaryo[b], bilang handog na kabayaran.”'
  rationale: Nilinaw ang pambungad na parirala upang masaklaw ang pinaigting na diwa ng paglabag sa katapatan sa Hebreo, at idinagdag ang kailangang kuwit para sa wastong pag-uugnay ng mga parirala. Walang binagong kahulugan sa handog, hayop, halaga, o pamantayan ng timbang; pinanatili rin ang mga pananda at nilalaman ng talababa.
