  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: tl
  text: Sa ganitong paraan, magbabayad-sala ang pari para sa kanya dahil sa kasalanang nagawa niya sa alinman sa mga bagay na ito, at patatawarin siya. At ito ay para sa pari, gaya ng handog na butil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: magbabayad-sala ang pari para sa kanya
  rationale: Sa kontekstong pansakripisyo ng Levitico, ang כפר ay tumutukoy sa ritwal na pagbabayad-sala. Pinananatili ng “magbabayad-sala” ang teknikal at teolohikal na diwa, at likas sa Tagalog ang “para sa kanya” para sa עָלָיו.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dahil sa kasalanang nagawa niya
  rationale: Ang kasunod na pandiwang חָטָא ay nagpapakitang ang חַטָּאת dito ay ang kasalanan, hindi ang handog para sa kasalanan. Ang “nagawa” ay natural na katambal ng “kasalanan” sa modernong Tagalog.
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: sa alinman sa mga bagay na ito
  rationale: Malinaw na tumutukoy ito sa isa sa mga naunang nakalistang kalagayan at pinananatili ang partitive na diwa.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Pinananatili nito ang balintiyak na pahayag at hindi tahasang pinapangalanan ang tagapagpatawad, gaya ng Hebreo.
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: Ang handog ay mapupunta sa pari
  rationale: Ang pambabaeng pandiwa ay tumutukoy sa handog na binanggit sa konteksto. Tahasang “ang handog” ang ginamit sa Tagalog upang maging malinaw ang reperensiya nang hindi binabago ang diwa ng karapatan ng pari rito.
- source_word: כַּמִּנְחָה
  choice: gaya ng handog na butil
  rationale: Sa batas pansamba ng Levitico, ang מִנְחָה ay karaniwang handog na mula sa butil. Ang parirala ay malinaw at madaling maunawaan sa modernong Tagalog.
theological_decisions:
- issue: Balintiyak na pormula ng kapatawaran
  choice: at patatawarin siya
  alternative: at ipatatawad iyon sa kanya
  rationale: Ang pinili ay natural sa Tagalog at pinananatiling hindi tahasang binabanggit kung sino ang nagpapatawad. Ang alternatibo ay mas literal sa posibleng impersonal na pagbasa ngunit hindi gaanong natural at maaaring magmukhang ang kasalanan ang simuno.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Pinanatili ang terminong pansamba na “magbabayad-sala,” ngunit iniwasan ang sobrang teknikal o denominasyonal na pananalita. Walang talababa dahil ang alternatibong balintiyak na pagbasa ay hindi nangangailangan ng hiwalay na marker sa Tagalog; ang pangunahing salin mismo ay nagpapanatili sa hindi pinangalanang tagapagpatawad.
