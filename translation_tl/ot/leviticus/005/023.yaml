base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: tl
  text: At mangyayari[a], kapag nagkasala siya at nagkaroon ng pananagutan, ibabalik niya ang anumang ninakaw niya, o ang anumang kinuha niya sa pamamagitan ng pang-aapi[b], o ang ipinagkatiwala sa kaniya, o ang nawawalang bagay na natagpuan niya[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “At kung magkasala siya at magkaroon ng pananagutan.” Ang pormulang legal sa Hebreo ay maaaring isalin bilang “kapag” o “kung.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang anumang nakuha niya sa pandaraya” o “ang anumang ipinagkait niya sa pamamagitan ng pang-aapi.” Saklaw ng salitang Hebreo ang mapang-api o mapanlinlang na pagkuha o pagpigil ng pag-aari ng iba.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang nawawalang ari-ariang natagpuan niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At mangyayari, kapag
  rationale: Pinananatili nito ang pambungad na pormulang legal ng Hebreo habang natural sa makabagong Filipino; ang כִּי ay ginawang “kapag” bilang pagpapakilala sa isang kasong inaasahang maaaring maganap.
- source_word: יֶחֱטָא
  choice: nagkasala siya
  rationale: Tuwirang pinananatili ang moral at tipanang diwa ng pandiwang חטא.
- source_word: וְאָשֵׁם
  choice: nagkaroon ng pananagutan
  rationale: Ipinahahayag ang pagiging maysala o liable sa legal na konteksto nang hindi ito nililimitahan sa pansariling pagkabatid sa kasalanan.
- source_word: וְהֵשִׁיב
  choice: ibabalik niya
  rationale: Malinaw na tumutukoy sa pagsasauli ng ari-arian; ang konteksto ang nagbibigay rito ng puwersang legal na obligasyon.
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: ang anumang ninakaw niya
  rationale: Natural na Filipino para sa Hebreong magkaugnay na pangngalan at pandiwa na tumutukoy sa marahas o labag-sa-batas na pagkuha.
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: ang anumang kinuha niya sa pamamagitan ng pang-aapi
  rationale: Sinasaklaw ang mapang-api, mapagsamantala, o mapanlinlang na pagkuha o pagpigil ng pag-aari nang hindi pinakikitid sa isang paraan lamang.
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: ang ipinagkatiwala sa kaniya
  rationale: Natural at malinaw na tumutukoy sa ari-ariang inilagay sa kaniyang pangangalaga.
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: ang nawawalang bagay na natagpuan niya
  rationale: Malapit sa anyo ng Hebreo at hindi tahasang nagdaragdag ng salitang “ari-arian,” bagaman iyon ang ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Kahulugan ng וְאָשֵׁם
  choice: nagkaroon ng pananagutan
  alternative: napatunayang maysala / nabatid niyang maysala siya
  rationale: Pinananatili ang legal na pagkakasala o pananagutan at iniiwasang ipasya na ang pandiwa ay pangunahing tumutukoy sa pansariling pagkabatid.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong listahan at legal na tono ng talata, ngunit iniwasan ang hindi natural na pag-uulit ng magkaugnay na pangngalan at pandiwa sa Hebreo.
