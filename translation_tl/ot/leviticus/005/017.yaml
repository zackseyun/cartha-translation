  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: tl
  text: Kung ang isang tao ay magkasala at gumawa ng alinman sa mga bagay na ipinagbabawal ng mga utos ni Yahweh, bagaman hindi niya ito alam, siya ay may sala[a] at papasanin niya ang kanyang kasamaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagkaroon siya ng pananagutan.” Ang salitang Hebreo ay maaaring tumukoy sa pagiging may sala o sa pagkakaroon ng pananagutang dulot ng paglabag.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “papasanin niya ang kanyang sala” o “pananagutan niya ang bunga ng kanyang kasamaan.” Maaaring saklawin ng idyomang Hebreo ang sala, pananagutan, o kahihinatnan ng kasamaan.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa kontekstong legal, tumutukoy ang נֶפֶשׁ sa isang indibidwal, hindi partikular sa di-materyal na kaluluwa.
- source_word: תֶחֱטָא
  choice: magkasala
  rationale: Tuwiran at likas na salin ito ng חטא sa kontekstong legal at pangkulto.
- source_word: וְעָשְׂתָה אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: gumawa ng alinman sa mga bagay na ipinagbabawal ng mga utos ni Yahweh
  rationale: Ipinahahayag nito sa natural na Tagalog ang paggawa ng isang ipinagbabawal na bagay mula sa kabuuan ng mga utos, habang pinananatili ang legal na puwersa ng parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang tipan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְלֹא יָדַע
  choice: bagaman hindi niya ito nalalaman
  rationale: Ipinakikita ng sugnay na nagawa ang paglabag nang walang kaalaman; ang “ito” ay likas na tumutukoy sa ginawang paglabag.
- source_word: וְאָשֵׁם
  choice: siya ay may sala
  rationale: Ipinahahayag nito ang kalagayan ng pagiging may sala o legal na pananagutan bunga ng paglabag, kahit hindi sinasadya o nalalaman.
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: papasanin niya ang kanyang kasamaan
  rationale: Pinananatili ng “papasanin” ang matimbang na idyomang Hebreo; ang “kasamaan” ay hindi agad nililimitahan sa sala lamang o sa kaparusahan lamang.
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa pinagmulan, kaya pinananatili ang personal na pangalang Yahweh.
- issue: Pananagutan sa paglabag na ginawa nang hindi nalalaman
  choice: bagaman hindi niya ito nalalaman, siya ay may sala
  alternative: nang hindi niya ito nalalaman, nagkaroon siya ng pananagutan
  rationale: Pinananatili ang tensiyon ng tekstong nagsasabing may tunay na pagkakasala o pananagutan kahit walang kaalaman, nang hindi ipinapaliwanag nang lampas sa sinasabi ng talata.
- issue: Kahulugan ng pagdadala ng עָוֹן
  choice: papasanin niya ang kanyang kasamaan
  alternative: papasanin niya ang kanyang sala; pananagutan niya ang bunga ng kanyang kasamaan
  rationale: Hindi tiyak kung ang idyoma ay pangunahing tumutukoy sa sala, legal na pananagutan, o bunga/kaparusahan; pinananatili ng salin ang lawak ng idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong legal at moral—“ipinagbabawal,” “may sala,” at “papasanin”—nang hindi nagiging teknikal o denominasyonal. Ang panghalip na panlalaki ay sumusunod sa kinatawang isahan ng tekstong Hebreo.
