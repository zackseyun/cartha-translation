  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: tl
  text: o anumang bagay na pinanumpaan niya nang may kabulaanan—dapat niyang bayaran iyon nang buo at dagdagan ng ikalimang bahagi. Ibibigay niya iyon sa may-ari nito sa araw ng kanyang handog na pambayad-sala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa araw ng kanyang pagkakasala.” Ang salitang Hebreo ay maaaring tumukoy sa pagkakasala o sa handog na pambayad-sala; sa pangunahing teksto, sinusunod ang kontekstong pansakripisyo.
    reason: alternative_reading
lexical_decisions:
- source_word: א֠וֹ מִכֹּל אֲשֶׁר
  choice: o anumang bagay na tungkol dito
  rationale: Ipinagpapatuloy ng אוֹ ang talaan sa naunang talata, at malawak ang saklaw ng מִכֹּל אֲשֶׁר. Natural sa modernong Tagalog ang pariralang ito sa konteksto ng isang bagay na pinanumpaan.
- source_word: יִשָּׁבַע עָלָיו לַשֶּׁקֶר
  choice: ay nanumpa siya nang kasinungalingan
  rationale: Ipinahahayag nito ang pagsumpa nang hindi totoo tungkol sa bagay na binanggit, nang hindi nagdaragdag ng motibo o detalye na wala sa Hebreo.
- source_word: וְשִׁלַּם אֹתוֹ בְּרֹאשׁוֹ
  choice: dapat niya itong bayaran nang buo
  rationale: Ang legal na idyomang בְּרֹאשׁוֹ ay tumutukoy sa buong prinsipal o orihinal na halaga. Mas malinaw sa karaniwang Tagalog ang “bayaran nang buo” kaysa literal na “sa ulo nito.”
- source_word: וַחֲמִשִׁתָיו יֹסֵף עָלָיו
  choice: at dagdagan pa ng ikalimang bahagi
  rationale: Tumpak nitong ipinahahayag ang karagdagang isang-ikalima o dalawampung porsiyento. Ang “pa” ay natural na nagpapakita na dagdag ito sa buong halagang isinauli.
- source_word: לַאֲשֶׁר הוּא לוֹ
  choice: sa tunay na may-ari
  rationale: Ang literal na idyoma ay “sa isa na iyon ay kanya.” Ang “tunay na may-ari” ay maikli, natural, at pinananatili ang diwa ng nararapat na pagmamay-ari.
- source_word: יִתְּנֶנּוּ
  choice: Ibibigay niya ito
  rationale: Direktang katumbas ito ng karaniwang pandiwang נתן at tumutukoy sa paghahatid ng kabuuang kabayaran sa may-ari.
- source_word: בְּיוֹם אַשְׁמָתוֹ
  choice: sa araw na managot siya
  rationale: Ang אַשְׁמָה ay maaaring tumukoy sa pagkakasala o pananagutang bunga nito, at sa kontekstong Levitico ay maaari ring maiugnay sa handog na pambayad-sala. Ang “managot siya” ay natural na naghahayag ng legal-moral na kalagayan nang hindi ipinapalagay na ito ang mismong araw ng orihinal na paglabag.
theological_decisions:
- issue: Kahulugan ng אַשְׁמָתוֹ sa legal at pansakripisyong konteksto
  choice: sa araw na managot siya
  alternative: sa araw ng kanyang handog na pambayad-sala
  rationale: Ang anyo rito ay maaaring unawain bilang pagkakasala o pananagutan, samantalang inuugnay ito ng kasunod na konteksto sa kinakailangang handog. Pinili sa pangunahing teksto ang legal-moral na diwa at inilagay sa talababa ang pansakripisyong pagbasa upang mapanatili ang tunay na ambiguwidad ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na gumagamit ng karaniwang legal na pananalitang “bayaran nang buo,” “tunay na may-ari,” at “managot.” Iniwasan ang sobrang literal na mga idyomang Hebreo at pinanatili sa talababa ang ambiguwidad ng huling parirala.
