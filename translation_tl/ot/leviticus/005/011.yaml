reference: Leviticus 5:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: tl
  text: Ngunit kung hindi niya kayang maghandog ng dalawang batobato o dalawang inakay na kalapati[a], magdadala siya bilang handog para sa kasalanang nagawa niya ng ikasampung bahagi ng isang efa ng pinong harina bilang handog para sa kasalanan. Hindi niya ito lalagyan ng langis ni papatungan ng kamangyan, sapagkat handog ito para sa kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “kung hindi umabot ang kaniyang kamay sa dalawang batobato o dalawang inakay na kalapati”—isang idyomang Hebreo na nangangahulugang hindi sapat ang kaniyang kakayahan o kabuhayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: hindi niya kayang maghandog
  rationale: Ang literal na idyomang ‘hindi umabot ang kaniyang kamay’ ay tumutukoy sa kakulangan ng kakayahang pinansiyal. Sa konteksto, malinaw at natural na ipinahahayag ng salin ang kawalan ng kakayahang maglaan ng hinihinging mga ibon.
- source_word: תֹרִים
  choice: batobato
  rationale: Ang ‘batobato’ ay karaniwang pangalang Filipino para sa turtledove at mas tiyak kaysa sa pangkalahatang ‘kalapati.’
- source_word: בְנֵי יוֹנָה
  choice: mga inakay na kalapati
  rationale: Literal itong ‘mga anak ng kalapati’ at tumutukoy sa mga batang kalapati; natural sa Filipino ang ‘mga inakay na kalapati.’
- source_word: קָרְבָּנוֹ
  choice: handog
  rationale: Malawak na terminong pansakripisyo ito para sa bagay na inihahandog, at ang ‘handog’ ay angkop din sa harina sa talatang ito.
- source_word: אֲשֶׁר חָטָא
  choice: para sa kasalanang nagawa niya
  rationale: Ipinakikita ng parirala ang kaugnayan ng handog sa nagawang pagkakasala, sa natural na ayos ng Filipino.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ikasampung bahagi ng isang efa
  rationale: Pinananatili ang sinaunang yunit na ‘efa’ at tumpak na inilalahad ang proporsiyon nang hindi nagbibigay ng di-tiyak na modernong katumbas.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang natural at tumpak na katawagan sa harina na pinong giniling at ginagamit sa mga handog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong ritwal, tumutukoy ang חַטָּאת sa handog na nauukol sa kasalanan, hindi lamang sa kasalanan mismo.
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: Hindi niya ito lalagyan ng langis
  rationale: Direkta at natural na pagbabawal sa pagdaragdag ng langis sa harina.
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: ni papatungan ng kamangyan
  rationale: Ang ‘kamangyan’ ay natural na katawagang Filipino para sa frankincense; ang ‘ni’ ay malinaw na nag-uugnay sa dalawang pagbabawal.
- source_word: כִּי חַטָּאת הִיא
  choice: sapagkat handog ito para sa kasalanan
  rationale: Ipinananatili ang dahilan ng pagbabawal at ang ritwal na kahulugan ng חַטָּאת.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: kasalanan
  rationale: Ang mga tagubilin ay tungkol sa bagay na dinadala at inihahandog, kaya ritwal na handog ang tinutukoy. Hindi ito pinalalawak tungo sa anumang mas huling sistemang doktrinal.
- issue: Paglalahad sa idyoma ng kahirapan
  choice: hindi niya kayang maghandog
  alternative: hindi umabot ang kaniyang kamay
  rationale: Ang legal na probisyon ay para sa taong kapos sa kakayahang maglaan ng dalawang ibon. Malinaw sa modernong Filipino ang napiling salin habang ang literal na larawan ay pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘magdadala siya’ at ‘lalagyan’ upang mapanatili ang legal na himig nang hindi nagiging makaluma. Pinanatili ang sinaunang sukat na ‘efa,’ at ginamit ang ‘kamangyan’ bilang natural na katawagang Filipino.
