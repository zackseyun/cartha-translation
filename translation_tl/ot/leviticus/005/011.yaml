  source_fidelity: Tapat ang salin sa Hebreong kondisyon ng kakulangan sa kakayahan, sa dalawang uri ng ibon, sa ikasampung bahagi ng efa ng pinong harina, at sa dalawang pagbabawal na may kaugnayan sa handog para sa kasalanan. Ang “hindi niya kayang maghandog” ay isang malinaw at angkop na pagsasalin ng idyomang tumutukoy sa kakulangan ng kabuhayan o kakayahang maglaan.
