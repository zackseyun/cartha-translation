base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: tl
  text: 'At dadalhin niya kay Yahweh ang kanyang handog para sa pagkakasala[a]: isang lalaking tupa mula sa kawan na walang kapintasan, ayon sa pagtataya mo[b], bilang handog para sa pagkakasala, sa pari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “kanyang handog na pambayad-pinsala.” Ang אָשָׁם ay maaaring tumukoy sa pananagutan o kabayarang kaugnay ng pagkakasala, at sa handog na inihahandog dahil dito.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ayon sa pagtataya mo.” Isahan ang “mo”; hindi tahasang pinapangalanan sa talatang ito kung sino ang kinakausap.
    reason: source_ambiguity
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: ang kanyang handog na pambayad-sala
  rationale: Maaaring tumukoy ang אָשָׁם sa pagkakasala, kabayaran o pagbabayad-pinsala, at sa handog na kaugnay nito. Sa kontekstong legal, ipinahihiwatig ng “pambayad-sala” ang layuning magbayad-pinsala nang hindi itinatanggi na isa itong handog.
- source_word: יָבִיא
  choice: dadalhin niya
  rationale: Ang Hiphil imperfect sa tagubiling legal ay may preskriptibong lakas; likas sa Filipino ang hinaharap na anyo sa ganitong pahayag ng kautusan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh”; “kay” ang natural na pananda para sa personal na pangalan.
- source_word: אַיִל תָּמִים
  choice: isang lalaking tupa ... na walang kapintasan
  rationale: Ang אַיִל ay lalaking tupa, at ang תָּמִים sa kontekstong panghandog ay nagsasaad na wala itong kapintasang nag-aalis ng pagiging katanggap-tanggap nito.
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop; dahil tinukoy na ng אַיִל na lalaking tupa ang hayop, sapat at natural ang “mula sa kawan.”
- source_word: בְּעֶרְכְּךָ
  choice: ayon sa pagtataya mo
  rationale: Pinananatili nito ang kahulugan ng pagtatakda ng halaga at ang ikalawang panauhang panlalaking isahan ng hulapi nang hindi tahasang tinutukoy kung sino ang “mo.”
- source_word: לְאָשָׁם
  choice: bilang handog para sa pagkakasala
  rationale: Dito, inilalarawan ng parirala ang tiyak na tungkulin o uri ng handog ng lalaking tupa.
- source_word: אֶל הַכֹּהֵן
  choice: at ihaharap ito sa pari
  rationale: Ipinahahayag sa natural na Filipino ang direksiyong “sa pari.” Ang “ihaharap” ay paglilinaw ng ipinahihiwatig na pagdadala, hindi pagdaragdag ng bagong ritwal.
theological_decisions:
- issue: Pag-render sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ito sa transliterasyong “Yahweh.”
- issue: Dalawang paggamit ng אָשָׁם na may magkakaugnay na diwa
  choice: 'Una: “handog na pambayad-sala”; ikalawa: “handog para sa pagkakasala”'
  alternative: Isalin ang dalawa bilang “handog para sa pagkakasala”
  rationale: Ipinakikita ng magkaibang salin ang reparatibong diwa ng unang anyo at ang kategoryang panghandog ng ikalawa, habang kinikilala sa talababa na maaaring pareho ang katawagan.
- issue: Pagkakakilanlan ng tinutukoy ng “mo” sa בְּעֶרְכְּךָ
  choice: Panatilihing “ayon sa pagtataya mo”
  alternative: “ayon sa pagtataya ng pari”
  rationale: Hindi tahasang pinapangalanan sa talata ang kinakausap; iniiwasang lutasin sa pangunahing teksto ang isang sangguniang ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lalaking tupa” sa halip na mas teknikal o di-gaanong pangkaraniwang katawagan. Pinanatili ang legal at pangritwal na himig, ngunit inayos ang huling parirala bilang “at ihaharap ito sa pari” upang maging malinaw at natural sa Filipino.
