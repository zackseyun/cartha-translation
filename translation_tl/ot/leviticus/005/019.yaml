  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: tl
  text: Ito ay handog dahil sa pagkakasala[a]; tiyak na nagkasala siya laban kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ito ay handog dahil sa pagkakasala; tiyak na may pananagutan siya sa harap ni Yahweh.” Inuulit sa Hebreo ang salitang-ugat na אשם (“pagkakasala,” “magkasala,” o “magkaroon ng pananagutan”) upang magbigay-diin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשָׁם
  choice: handog na pambayad sa kasalanan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang pangngalan sa natatanging handog na inihahandog dahil sa pagkakasala at kaugnay na pananagutan. Ipinakikita ng “pambayad” ang aspektong reparasyon at iniiwasang lubusang ipareho ito sa ibang uri ng handog para sa kasalanan.
- source_word: הוּא
  choice: Ito ay
  rationale: Ginagamit ang panghalip bilang panaguri upang tukuyin kung anong uri ng handog ito; natural sa Tagalog ang tahasang pang-ugnay na “ay.”
- source_word: אָשֹׁם אָשַׁם
  choice: talagang nagkasala
  rationale: Ang pawatas na absolutong sinusundan ng pandiwang mula sa parehong ugat ay nagpapadiin sa katiyakan o tindi ng pagkakasala. Likas na naihahatid ito ng “talagang” sa modernong Tagalog.
- source_word: לַיהוָה
  choice: laban kay Yahweh
  rationale: Kapag kaugnay ng pandiwang אָשׁם, maaaring ipahayag ng ל ang pananagutang nauukol sa Diyos. Ang “laban kay” ay malinaw na nag-uugnay ng pagkakasala kay Yahweh, habang inilalahad sa talababa ang tunay na posibleng alternatibong “sa harap ni.”
- source_word: יהוה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang “Yahweh,” na malinaw at karaniwang anyo nito sa modernong Filipino.
theological_decisions:
- issue: Ugnayan ng לַיהוָה sa pandiwang אָשַׁם
  choice: Ang tao ay talagang nagkasala laban kay Yahweh.
  alternative: Ang tao ay talagang may pananagutan sa harap ni Yahweh; o ang handog ay para kay Yahweh.
  rationale: Mas natural na ikabit ang parirala sa pandiwang kasunod nito, at ipinahihiwatig ng konteksto ang tunay na pagkakasala ng tao kaugnay kay Yahweh. Gayunman, may saklaw ang pang-ukol na ל na nagpapahintulot sa diwang pananagutan “sa harap” ng Diyos, kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng diwa ng iisang salitang-ugat sa “pambayad sa kasalanan” at “nagkasala,” bagaman hindi ganap na matutularan sa Tagalog ang larong-salita ng Hebreo.
