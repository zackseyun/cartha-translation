base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: tl
  text: At ihahanda niya ang ikalawa bilang handog na sinusunog ayon sa tuntunin[a]. Magsasagawa ang pari ng pagbabayad-sala para sa kanya dahil sa kasalanang nagawa niya, at patatawarin siya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa itinakdang pamamaraan.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo, isang pormulang passive: “at siya ay patatawarin”; hindi tahasang binabanggit ang tagapagpatawad.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: ang ikalawa
  rationale: Tumutukoy ito sa ikalawang ibon na binanggit sa naunang konteksto; tuwiran at malinaw ang ordinal na anyo.
- source_word: יַעֲשֶׂה
  choice: ihahanda niya
  rationale: Malawak ang kahulugan ng pandiwang עשה (‘gawin’), ngunit sa konteksto ng ritwal, natural na ipinahahayag ng ‘ihahanda’ ang pagsasagawa sa handog nang hindi labis na tinutukoy ang kilos.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Karaniwan, malinaw, at tumpak na katawagan sa makabagong Tagalog para sa עֹלָה sa konteksto ng Levitico.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa tuntunin
  rationale: Ang מִשְׁפָּט dito ay ang nakatakdang pamantayan o paraan ng pagsasagawa sa handog. Pinananatili ng ‘ayon sa tuntunin’ ang pormal na diwa at nililinaw ng talababa ang procedural na kahulugan.
- source_word: וְכִפֶּר עָלָיו
  choice: magsasagawa ang pari ng pagbabayad-sala para sa kanya
  rationale: Pinananatili nito ang natatanging wikang panghandog ng כפר at ang kapakinabangan nito para sa taong nagkasala, nang hindi ito nililimitahan sa isang mas makitid na paliwanag teolohikal.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dahil sa kasalanang nagawa niya
  rationale: Natural nitong ipinahahayag ang kasalanang siyang dahilan at paksa ng pagbabayad-sala, sa halip na tularan nang kahoy ang Hebreong ‘mula sa kanyang kasalanan na kanyang ipinagkasala.’
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Natural ito sa modernong Tagalog at hindi tahasang pinapangalanan ang banal na tagapagpatawad; ipinapaliwanag sa talababa ang mas literal na anyong impersonal/passive.
theological_decisions:
- issue: Paglalahad sa wikang pangsaserdote tungkol sa כפר nang hindi nagdaragdag ng doktrinang wala sa talata
  choice: magsasagawa ng pagbabayad-sala para sa kanya
  alternative: lilinisin siya; magkakamit ng kapatawaran para sa kanya
  rationale: Pinananatili ng napiling salin ang kategoryang ritwal at teolohikal ng pagbabayad-sala, habang hindi ito ipinapantay lamang sa paglilinis o sa pagkakamit ng kapatawaran.
- issue: Pagpapanatili sa pormulang passive ng kapatawaran
  choice: patatawarin siya
  alternative: patatawarin siya ng PANGINOON; ipatatawad iyon sa kanya
  rationale: Hindi tahasang pinapangalanan ng Hebreo ang banal na gumagawa ng pagpapatawad. Pinananatili ng pangunahing teksto ang di-tahasang tagagawa, at itinatala ng talababa ang mas literal na pormula.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang malinaw na bokabularyong panghandog at iniwasan ang sobrang teknikal o denominasyonal na pananalita. Ang hati sa dalawang pangungusap ay nagpapadali sa pagbasa nang hindi binabago ang lohikal na ugnayan ng Hebreo.
