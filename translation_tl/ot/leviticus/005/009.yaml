language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: tl
  text: At iwiwisik niya ang bahagi ng dugo ng handog para sa kasalanan sa tagiliran ng altar[a], at ang natitirang dugo ay patutuluin sa paanan ng altar. Ito ay handog para sa kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis,” dito at sa huling pangungusap. Ang salitang Hebreo ay maaaring tumukoy sa handog para sa kasalanan, na may diin sa tungkulin nitong maglinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: At iwiwisik niya
  rationale: Ang Hiphil ng נזה sa kontekstong panghandog ay tumutukoy sa ritwal na paglalapat ng dugo sa pamamagitan ng pagwiwisik. Likas at malinaw sa modernong Tagalog ang “iwiwisik.”
- source_word: מִדַּם
  choice: ang kaunting dugo
  rationale: 'Partitibo ang מִן dito: bahagi lamang ng dugo ang inilalapat sa altar sa yugtong ito. Ipinahahayag ito nang natural ng “ang kaunting dugo.”'
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa batas ng paghahandog, ang חַטָּאת ay pangalan ng isang uri ng handog na may kaugnayan sa kasalanan at paglilinis. Ang “handog para sa kasalanan” ay malinaw at pamilyar, habang pinananatili sa talababa ang mahalagang alternatibong diin.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: sa tagiliran ng altar
  rationale: Literal na “pader” ang קִיר, ngunit kapag altar ang tinutukoy, mas likas sa Tagalog ang “tagiliran” para sa panlabas na patayong bahagi nito.
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: Ang dugong natira
  rationale: 'Tuwirang ipinahahayag nito ang substantibong diwa ng Niphal participle ng שׁאר: ang bahaging nalabi o natira.'
- source_word: יִמָּצֶה
  choice: ay patutuluin
  rationale: Sa ritwal na ito, ipinahihiwatig ng Niphal ng מצה ang pagpiga o pagpapatulo upang maubos ang natitirang dugo ng ibon. Mas tiyak ang “patutuluin” kaysa sa karaniwang “ibubuhos.”
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: sa paanan ng altar
  rationale: Ang יְסוֹד ay pundasyon o base. Ang “paanan ng altar” ay natural at kongkretong katumbas sa Tagalog.
- source_word: חַטָּאת הוּא
  choice: Ito ay handog para sa kasalanan
  rationale: Tinutukoy ng sugnay ang uri ng handog. Inuulit ang parehong termino upang mapanatili ang pagkakaugnay at diin ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring idiin ng terminong Hebreo ang kaugnayan ng handog sa kasalanan o ang tungkulin nitong maglinis sa ritwal. Ginamit sa pangunahing teksto ang mas nakikilalang “handog para sa kasalanan,” ngunit inilalahad sa talababa ang lehitimong alternatibo upang hindi maitago ang saklaw ng termino.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinili ang “altar,” na karaniwan at malinaw sa kasalukuyang gamit, at iniwasan ang sobrang teknikal o makalumang pananalita.
