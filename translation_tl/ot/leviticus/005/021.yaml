    rationale: Ang “sa bagay na sapilitan niyang kinuha” ay binabago ang pangngalang legal na “pagnanakaw/pang-aagaw” tungo sa isang mas espesipikong paglalarawan ng bagay at paraan ng pagkuha. “Sa pamamagitan ng pagnanakaw” ay mas tuwiran at mas maayos sa serye.
  - severity: low
    issue: Maaaring gawing mas malinaw ang di-tiyak na תְשׂוּמֶת יָד.
    rationale: Ang “inilagay sa kanyang kamay” ay nananatiling malapit sa literal na Hebreo at mas natural kaysa “iniabot sa kanyang kamay”; ang talababa ang wastong lugar para sa mga posibleng legal na pakahulugan.
