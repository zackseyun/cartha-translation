id: LEV.5.21
reference: Leviticus 5:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: tl
  text: Kung magkasala ang isang tao at magtaksil kay Yahweh sa pagsisinungaling sa kanyang kapwa hinggil sa isang bagay na ipinagkatiwala sa kanya, o sa isang bagay na inilagay sa kanyang kamay[a], o sa pamamagitan ng pagnanakaw, o kung inapi niya ang kanyang kapwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy sa isang panagot, sangla, o anumang bagay na inilagay sa kanyang kamay.
    reason: Hindi tiyak ang eksaktong legal na kahulugan ng pariralang Hebreo na literal na “paglalagay ng kamay.”
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa kontekstong legal, tumutukoy ito sa isang indibidwal, hindi sa kaluluwa bilang hiwalay na bahagi ng tao.
- source_word: כִּי תֶחֱטָא
  choice: Kung magkasala
  rationale: Ipinakikilala ng כִּי at imperfect ang isang kasong may kondisyon, gaya ng karaniwan sa batas.
- source_word: וּמָעֲלָה מַעַל
  choice: at magtaksil
  rationale: Ipinahahayag ng magkaugnay na pandiwa at pangngalan ang seryosong pagtataksil o paglabag sa tiwala; natural at marangal sa Tagalog ang “magtaksil.”
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos at ang tahasang diwa na ang kasalanan laban sa kapwa ay pagtataksil din kay Yahweh.
- source_word: וְכִחֵשׁ
  choice: sa pamamagitan ng pagsisinungaling
  rationale: Maaaring tumukoy ang pandiwa sa pagsisinungaling, pagkakaila, o pandaraya. Ang parirala ay natural na nag-uugnay sa kasunod na mga usaping ari-arian.
- source_word: בַּעֲמִיתוֹ
  choice: sa kanyang kapwa
  rationale: Ang עָמִית ay kapwa miyembro ng pamayanan; malinaw at pamilyar sa makabagong Tagalog ang “kapwa.”
- source_word: בְּפִקָּדוֹן
  choice: tungkol sa isang bagay na ipinagkatiwala sa kanyang pag-iingat
  rationale: Tumutukoy ito sa ari-ariang ipinagkatiwala upang ingatan. Mas malinaw sa karaniwang mambabasa ang buong parirala kaysa teknikal na “deposito.”
- source_word: בִתְשׂוּמֶת יָד
  choice: sa isang bagay na iniabot sa kanyang kamay
  rationale: Malapit ito sa literal na anyo ng malabong idyoma at hindi ipinipilit kung ang bagay ay panagot, sangla, o ibang bagay na iniabot.
- source_word: בְגָזֵל
  choice: sa bagay na sapilitan niyang kinuha
  rationale: Ang גָּזֵל ay pagkuha o pagnanakaw na may puwersa; inililinaw ng salin ang aspektong ito nang hindi gumagamit ng di-likas na teknikal na termino.
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: pinagsamantalahan niya ang kanyang kapwa
  rationale: Sinasaklaw nito ang pang-aapi, pangingikil, at pandarayang pangkabuhayan na maaaring ipahiwatig ng pandiwa.
theological_decisions:
- issue: Ang kasalanang panlipunan o pangkabuhayan ay inilalarawan ding pagtataksil sa Diyos
  choice: magtaksil kay Yahweh
  alternative: magkasala laban kay Yahweh
  rationale: 'Tuwirang pinananatili ang ugnayang inilalahad ng Hebreo: ang pandaraya sa kapwa ay pagtataksil kay Yahweh, nang hindi nagdaragdag ng paliwanag na doktrinal.'
- issue: Paglalarawan sa di-tiyak na תְשׂוּמֶת יָד
  choice: isang bagay na iniabot sa kanyang kamay
  alternative: isang panagot o sangla
  rationale: Pinananatili sa pangunahing teksto ang tunay na kalabuan ng idyoma; inilalagay sa talababa ang posibleng legal na kahulugan.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalang kinakatawan ng apat na titik sa tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang labis na teknikal na wikang legal, ngunit pinanatili ang anyong kondisyonal at ang nakabiting pangungusap na nagpapatuloy sa susunod na talata.
