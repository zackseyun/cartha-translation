  source_fidelity: 'Tumpak ang pangunahing balangkas: isang indibidwal ang nagkakasala at nagtataksil kay Yahweh sa pandarayang may kinalaman sa kapwa at sa ari-arian. Gayunman, ang “sa bagay na sapilitan niyang kinuha” ay masyadong malayang pagpapakahulugan ng בְגָזֵל at hindi gaanong malinaw bilang kasunod ng “pagsisinungaling.” Mas tuwirang pinananatili ng “sa pamamagitan ng pagnanakaw” ang legal na kategoryang nasa Hebreo.'
  naturalness: Makabago at madaling unawain ang draft, ngunit mas natural ang magkakapantay na serye na “hinggil sa …, o sa …, o sa pamamagitan ng pagnanakaw.” Ang “bagay na inilagay sa kanyang kamay” ay mas malinaw at mas malapit sa idyoma kaysa “iniabot sa kanyang kamay,” habang nananatiling bukas ang kahulugan sa talababa.
  terminology: Ang “Yahweh,” “kapwa,” “ipinagkatiwala,” at “inapi” ay angkop sa modernong Filipino Tagalog at sa legal-moral na rehistro. Ang “inapi” para sa עָשַׁק ay mas tuwiran kaysa “pinagsamantalahan” at hindi labis na naglilimita sa uri ng pagsasamantala.
  issues:
