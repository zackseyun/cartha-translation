  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: tl
  text: Huwag kang sisiping sa isang lalaki na gaya ng pagsiping sa isang babae[a]; kasuklam-suklam iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang mga paghiga ng isang babae,” isang idyomang tumutukoy sa pakikipagtalik sa isang babae.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: isang lalaki
  rationale: Tumutukoy ang זָכָר sa isang taong lalaki. Ang “isang lalaki” ang pinakanatural na katumbas sa modernong Tagalog at hindi nililimitahan ang salita sa anumang mas makitid na uri ng relasyon o gawain.
- source_word: תִשְׁכַּב
  choice: sisiping
  rationale: Ang pandiwang שׁכב ay literal na “humiga,” ngunit dito ay isang malinaw na eupemismo para sa pakikipagtalik. Ang “sisiping” ay natural, marangal, at nagpapanatili sa eupemistikong anyo ng Hebreo.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: na gaya ng pagsiping sa isang babae
  rationale: Ang literal na pariralang “mga paghiga ng isang babae” ay idyomatikong tumutukoy sa pakikipagtalik sa babae. Inilalahad ng salin ang diwa at paghahambing nang malinaw, habang ipinapaliwanag sa talababa ang anyong Hebreo.
- source_word: תּוֹעֵבָה
  choice: kasuklam-suklam
  rationale: Ang תּוֹעֵבָה ay nagpapahayag ng matinding pagkasuklam o pagiging karima-rimarim sa konteksto ng Kodigo ng Kabanalan. Ang “kasuklam-suklam” ay mabigat ngunit natural sa kasalukuyang Tagalog.
- source_word: הִוא
  choice: iyon
  rationale: Ang panghalip na pambabae ay tumutukoy sa ipinagbabawal na gawa. Sa Tagalog, natural itong ihayag bilang “iyon” sa panaguring “kasuklam-suklam iyon.”
theological_decisions:
- issue: Saklaw ng pagbabawal sa konteksto ng Kodigo ng Kabanalan
  choice: Isinalin bilang tuwirang pagbabawal sa isang lalaki na makipagtalik sa kapwa lalaki sa paraang inilalarawan ng teksto, nang walang idinagdag na taguring kultiko, mapagsamantala, o iba pang mas makitid na kondisyon.
  alternative: Limitahan ang pagbabawal sa mga gawaing kultiko o mapagsamantala, o iparaphrase ito bilang pangkalahatang pagbabawal sa lahat ng anyo ng relasyong kapareho ang kasarian.
  rationale: Tuwirang binabanggit ng Hebreo ang pagsiping sa isang lalaki “gaya ng pagsiping sa isang babae” at tinatawag ang gawa na תּוֹעֵבָה. Hindi dapat magdagdag ang salin ng mga limitasyon o pagpapalawak na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sisiping/pagsiping” upang mapanatili ang eupemismo ng Hebreo nang hindi nagiging malabo; ang “kasuklam-suklam” ay nagpapanatili sa matinding bigat ng תּוֹעֵבָה.
