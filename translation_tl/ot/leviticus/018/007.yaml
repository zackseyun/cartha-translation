  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng iyong ama[a] at ang kahubaran ng iyong ina. Siya ang iyong ina; huwag mong ilantad ang kanyang kahubaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O maaaring unawain ang unang dalawang parirala bilang paliwanag: “Huwag mong ilantad ang kahubaran ng iyong ama—iyon ay, ang kahubaran ng iyong ina.” Ipinaliliwanag ito ng kasunod na pangungusap: “Siya ang iyong ina.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: ang kahubaran ng
  rationale: Pinananatili ng “kahubaran” ang nakapirming legal na eupemismong גלה ערוה sa Levitico 18 para sa ipinagbabawal na pakikipagtalik, nang hindi ito ginagawang higit na tahasan kaysa sa Hebreo.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: huwag mong ilantad
  rationale: Tuwirang inilalarawan nito ang Piel ng גלה sa paulit-ulit na pormula ng pagbabawal at pinananatiling kapansin-pansin ang legal na idyoma.
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tuwirang salin ng katawagang pampamilya na may hulaping panlalaking pangalawang panauhang isahan.
- source_word: וְעֶרְוַת אִמְּךָ
  choice: iyon ay, ang kahubaran ng iyong ina
  rationale: Ipinakikita ng “iyon ay” ang posibleng paliwanag o apposisyon ng ikalawang parirala, na sinusuportahan ng kasunod na “Siya ay iyong ina,” habang inilalagay sa talababa ang mas literal na koordinasyon.
- source_word: הִוא
  choice: Siya ay
  rationale: Ang pambabaeng panghalip na isahan ay tumutukoy sa ina at nagpapanatili sa madiing pahayag ng pagkakakilanlan.
- source_word: אִמְּךָ
  choice: iyong ina
  rationale: Tuwirang salin na pinananatili ang pag-uulit para sa diin at legal na linaw.
theological_decisions:
- issue: Kahulugan ng “kahubaran ng iyong ama”
  choice: 'Isinalin bilang paliwanag na apposisyon: “ang kahubaran ng iyong ama—iyon ay, ang kahubaran ng iyong ina.”'
  alternative: 'Mas literal: “ang kahubaran ng iyong ama at ang kahubaran ng iyong ina.”'
  rationale: Maaaring unawain ang ikalawang parirala at ang “Siya ay iyong ina” bilang pagpapaliwanag na ang paglabag laban sa ina ay ibinibilang na paglalantad sa kahubaran ng ama. Gayunman, tunay na nasa Hebreo ang pangatnig na וְ, kaya pinananatili sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “ilantad ang kahubaran” upang mapanatili ang legal at eupemistikong idyoma ng Hebreo; malinaw ang ipinahihiwatig na seksuwal na pagbabawal mula sa konteksto nang hindi nagdaragdag ng tahasang paraprasis.
