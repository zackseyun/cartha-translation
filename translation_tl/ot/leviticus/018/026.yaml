base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: tl
  text: Ngunit kayo mismo ay dapat tumupad sa aking mga tuntunin at mga hatol, at huwag ninyong gawin ang alinman sa mga kasuklam-suklam na gawaing ito—maging katutubo man kayo o dayuhang naninirahan sa gitna ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “dayuhang nakikipamayan sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: ay dapat tumupad
  rationale: Sa kontekstong tipan at batas, ang שׁמר ay nangangahulugang ingatan o sundin nang tapat. Ang “dapat tumupad” ay natural sa makabagong Filipino at nagpapanatili ng puwersa ng utos.
- source_word: אַתֶּם
  choice: kayo mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa mga kinakausap; ipinahahayag ito ng “kayo mismo.”
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Tumutukoy ang חֻקִּים sa mga itinakdang alituntunin o kautusan. Malinaw at angkop sa legal na konteksto ang “mga tuntunin.”
- source_word: מִשְׁפָּטַי
  choice: aking mga hatol
  rationale: Ang מִשְׁפָּטִים ay mga legal na pasiya o hatol. Pinananatili ng “mga hatol” ang naiibang legal na diwa nito katabi ng “mga tuntunin.”
- source_word: תַעֲשׂוּ
  choice: gawin
  rationale: Malawak ang kahulugan ng עשה at tuwirang tumutukoy rito sa pagsasagawa ng mga ipinagbabawal na gawain; hindi dinaragdagan ng “gawin” ang aspektong paulit-ulit.
- source_word: מִכֹּל
  choice: ang alinman sa
  rationale: Kapag kasama ng pagtanggi, ang מן + כל ay natural na nangangahulugang “alinman sa,” na nagpapanatili sa saklaw ng ganap na pagbabawal.
- source_word: הַתּוֹעֵבֹת
  choice: mga kasuklam-suklam na gawain
  rationale: Ang תּוֹעֵבָה ay isang bagay o gawaing lubhang karima-rimarim sa moral o panrelihiyong diwa. Malakas ngunit malinaw sa karaniwang mambabasa ang pariralang ito.
- source_word: הָאֶזְרָח
  choice: katutubo
  rationale: Tumutukoy ang אֶזְרָח sa taong likas na kabilang sa lupain o sambayanan. Ang “katutubo” ay maikli at malinaw sa pagtutol nito sa dayuhang naninirahan.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: dayuhang naninirahan sa gitna ninyo
  rationale: Ang גֵּר ay hindi katutubong nakatira sa loob ng sambayanan at saklaw ng mga pananagutan nito. Inilalahad ng salin ang pagiging dayuhan at ang aktuwal na paninirahan niya sa kanilang kalagitnaan.
theological_decisions:
- issue: Saklaw ng pagbabawal sa katutubo at sa dayuhang naninirahan
  choice: Parehong saklaw ng pagbabawal ang katutubo at ang dayuhang naninirahan sa gitna ng Israel.
  alternative: Maaaring unawain ang hulíng parirala bilang simpleng pagtukoy sa dalawang pangkat na nasasaklaw, nang hindi partikular na idinidiin ang kanilang pagkakapantay sa pananagutan.
  rationale: Inilalagay ng sintaks ang הָאֶזְרָח at הַגֵּר bilang kapuwa nasasangkot sa pagbabawal. Hindi nililimitahan ng talata ang pananagutang moral sa mga katutubong Israelita lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang legal na himig at ang diin ng אַתֶּם sa “kayo mismo.” Ginamit ang “maging … man o …” upang natural na maipahayag ang dalawang pangkat na kapuwa saklaw ng pagbabawal.
