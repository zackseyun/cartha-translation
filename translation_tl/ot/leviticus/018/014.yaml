  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng kapatid na lalaki ng iyong ama; huwag kang lumapit sa asawa niya[a]. Tiya mo siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lumapit”; sa konteksto ng mga batas na ito, may seksuwal na diwa ang pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: ang kahubaran ng
  rationale: Pinananatili ang konkretong legal na idyomang “ilantad ang kahubaran,” na sa Levitico 18 ay tumutukoy sa ipinagbabawal na pakikipagtalik, sa halip na palitan agad ng paliwanag.
- source_word: אֲחִי אָבִיךָ
  choice: kapatid na lalaki ng iyong ama
  rationale: Tuwirang pinananatili ang tiyak na ugnayang pampamilya sa Hebreo at iniiwasang gawing malabo ang “tiyuhin,” na maaari ring tumukoy sa ibang relasyon.
- source_word: לֹא תְגַלֵּה
  choice: Huwag mong ilantad
  rationale: Ang Piel ng גלה ay bahagi ng paulit-ulit na pormulang legal na “ilantad ang kahubaran”; natural sa makabagong Filipino ang pautos na negatibong anyo.
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: huwag kang lumapit sa asawa niya
  rationale: Pinananatili ang maingat at di-tahasang pandiwang קרב, samantalang ipinapaliwanag sa talababa ang seksuwal na diwa nito sa konteksto.
- source_word: דֹּדָתְךָ הִוא
  choice: Tiya mo siya
  rationale: Maikli at natural itong katumbas ng predikatibong Hebreo na literal na “tiya mo siya,” habang nililinaw na ng naunang sugnay ang eksaktong relasyon.
theological_decisions:
- issue: Paglilipat ng idyoma sa batas tungkol sa insesto
  choice: Panatilihin sa pangunahing teksto ang “ilantad ang kahubaran.”
  alternative: Isalin nang tahasan bilang “makipagtalik.”
  rationale: Pinananatili nito ang paulit-ulit na legal na pormula at metaporikal na pagpipigil ng Hebreo nang hindi ikinukubli ang seksuwal na kahulugan sa konteksto.
- issue: Pagkilala sa tiyak na kamag-anak
  choice: “Tiya mo siya.”
  alternative: “Asawa siya ng kapatid na lalaki ng iyong ama.”
  rationale: Ang Hebreo mismo ay gumagamit sa huling sugnay ng karaniwang katawagang pangkamag-anak; sapat nang inilatag ng naunang sugnay ang tiyak na kaugnayan.
translation_notes:
  register: Makabago at dignified na Filipino; tuwiran ang anyong legal. Pinanatili ang konkretong idyoma at ang maingat na eupemismo ng Hebreo, na may maikling talababa para sa kontekstuwal na diwa.
