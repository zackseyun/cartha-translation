  source_fidelity: Tumpak ang salin sa Hebreo. Napapanatili ang nakagawiang legal na idyomang “ilantad ang kahubaran,” ang tiyak na relasyon na “kapatid na lalaki ng iyong ama,” at ang maingat na pandiwang “lumapit” para sa seksuwal na pagbabawal. Ang “Tiya mo siya” ay wastong katumbas ng דֹּדָתְךָ הִוא at hindi nagpapataw ng karagdagang paliwanag.
  naturalness: Natural at malinaw ang modernong Filipino, habang nananatili ang marangal at legal na rehistro. Ang pag-uulit ng negatibong pautos ay maayos at ang panghalip na “niya” ay malinaw na tumutukoy sa kapatid ng ama.
