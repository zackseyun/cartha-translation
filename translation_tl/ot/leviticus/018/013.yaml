  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng kapatid na babae ng iyong ina[a], sapagkat siya ay malapit na kamag-anak[b] ng iyong ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, ayon sa diwa, “Huwag kang makipagtalik sa kapatid na babae ng iyong ina.” Literal sa Hebreo: “Huwag mong ilantad ang kahubaran ng kapatid na babae ng iyong ina.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “malapit na kamag-anak” ay salin ng Hebreong שְׁאֵר (she'er), isang terminong pangkamag-anakan na tumutukoy sa malapit na kaanak o “kaanak sa laman.”
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת
  choice: ang kahubaran ng
  rationale: Pinananatili nito ang pormal na legal na eupemismong paulit-ulit sa Levitico 18, sa halip na agad itong gawing tahasang paliwanag tungkol sa pakikipagtalik.
- source_word: תְגַלֵּה
  choice: Huwag mong ilantad
  rationale: Likas na utos sa modernong Filipino at tuwirang kumakatawan sa Piel ng גלה sa pariralang legal na 'ilantad ang kahubaran.'
- source_word: אֲחוֹת אִמְּךָ
  choice: kapatid na babae ng iyong ina
  rationale: Tumpak nitong pinananatili ang espesipikong ugnayang pampamilya; mas malinaw ito kaysa 'tiya,' na maaari ring tumukoy sa asawa ng kapatid ng magulang.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal at nababagay sa marangal na rehistrong legal.
- source_word: שְׁאֵר אִמְּךָ
  choice: malapit siyang kamag-anak ng iyong ina
  rationale: Sa batas pangkamag-anakan, ang שְׁאֵר ay tumutukoy sa malapit na kaanak o kaanak sa laman; malinaw at natural sa Filipino ang 'malapit na kamag-anak.'
- source_word: הִוא
  choice: siya
  rationale: Ang pambabaeng panghalip ay natural na kinakatawan ng 'siya'; malinaw na ang tinutukoy ay ang kapatid na babae ng ina.
theological_decisions:
- issue: Paglilipat sa legal na eupemismong 'ilantad ang kahubaran' nang hindi pinapawi ang pahiwatig nito
  choice: Panatilihin sa pangunahing teksto ang 'ilantad ang kahubaran'
  alternative: Isalin nang mas dinamiko bilang 'makipagtalik sa'
  rationale: Ang Hebreo ay gumagamit ng isang paulit-ulit na legal na eupemismo sa Levitico 18. Ang pagpapanatili rito ay nag-iingat sa anyo, tono, at pagkakaugnay ng kabanata, habang ipinapaliwanag ng talababa ang diwang seksuwal.
- issue: Saklaw ng שְׁאֵר bilang terminong pangkamag-anakan
  choice: malapit na kamag-anak
  alternative: kaanak sa laman
  rationale: Ang 'malapit na kamag-anak' ay malinaw at hindi labis na nagpapasiya kung dapat unawain ang termino bilang biyolohikal lamang, samantalang naipapaliwanag sa talababa ang literal na larawang 'laman.'
translation_notes:
  register: Modernong Filipino na marangal at legal ang tono. Pinanatili ang Hebreong eupemismo sa pangunahing teksto, ngunit nilinaw ang kahulugang seksuwal sa talababa. Ginamit ang 'kapatid na babae ng iyong ina' sa halip na 'tiya' upang hindi lumabo ang tiyak na ugnayang tinutukoy.
