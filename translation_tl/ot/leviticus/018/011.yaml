  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng anak na babae ng asawa ng iyong ama, na anak din ng iyong ama; kapatid mo siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapatid mo siya sa ama.” Literal na sinasabi ng Hebreo, “kapatid mo siya”; tinutukoy ng naunang paglalarawan ang eksaktong ugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: ang kahubaran ng ... / ang kanyang kahubaran
  rationale: Sa Levitico 18, ang עֶרְוָה ay bahagi ng nakapirming idyomang legal tungkol sa pakikipagtalik. Pinananatili ng “kahubaran” ang anyo at pagkakaugnay nito sa mga kalapit na talata nang hindi ito ginagawang mas tahasang anatomikal.
- source_word: בַּת
  choice: anak na babae
  rationale: Tuwirang katawagan sa ugnayang pampamilya at natural sa modernong Filipino.
- source_word: אֵשֶׁת אָבִיךָ
  choice: asawa ng iyong ama
  rationale: Pinananatili ang tahasang ugnayang nasa Hebreo. Ang “madrasta” ay maaaring ipalagay ngunit mas makitid at maaaring magdagdag ng interpretasyon.
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: ipinanganak sa iyong ama
  rationale: Ipinahahayag nito ang biyolohikal na kaugnayan sa ama. Mas natural ito sa Filipino kaysa sa isang saling katumbas ng “begotten,” bagaman bahagyang pormal ang estruktura.
- source_word: אֲחוֹתְךָ הִוא
  choice: kapatid mo siya
  rationale: Hindi nilalagyan ng “kapatid sa ama” ang pangunahing teksto sapagkat “kapatid” lamang ang tahasang sinasabi ng Hebreo; ang naunang paglalarawan ang tumutukoy sa eksaktong relasyon.
- source_word: לֹא תְגַלֶּה
  choice: Huwag mong ilantad
  rationale: Natural at marangal na anyo ng tuwirang pagbabawal sa Filipino, habang pinananatili ang idyomang “ilantad ang kahubaran.”
theological_decisions:
- issue: Kung tutukuyin sa pangunahing teksto bilang “kapatid sa ama”
  choice: Panatilihin ang “kapatid mo siya,” ayon sa tahasang pananalita ng Hebreo.
  alternative: “kapatid mo siya sa ama” o “kapatid mo siya sa ama lamang”
  rationale: Tinutukoy na ng naunang parirala na iisa ang kanilang ama. Ang pagdaragdag ng “sa ama” sa pangwakas na pahayag ay nagbibigay-linaw ngunit lumalampas sa mismong anyo ng אֲחוֹתְךָ הִוא; kaya inilagay ang paglilinaw sa talababa.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang legal na himig. Ginamit ang “iyong ama” sa halip na kolokyal na “tatay mo,” at pinanatili ang idyomang “ilantad ang kahubaran” upang umayon sa paulit-ulit na pormula ng kabanata.
