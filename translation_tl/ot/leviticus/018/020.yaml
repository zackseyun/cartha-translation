  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: tl
  text: Huwag kang makipagtalik[a] sa asawa ng iyong kapwa at sa gayo'y dungisan ang iyong sarili sa pakikipagtalik sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na, “Huwag mong ibigay sa asawa ng iyong kapwa ang iyong pagbuga bilang binhi.”
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: asawa ng iyong kapwa
  rationale: Sa kontekstong legal, ang עָמִית ay tumutukoy sa kapwa miyembro ng pamayanan. Ang “asawa ng iyong kapwa” ay tiyak, natural, at madaling maunawaan sa modernong Tagalog.
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: Huwag kang makipagtalik
  rationale: Ang literal na larawan ng pagbibigay ng pagbuga bilang binhi ay isang idyoma para sa pakikipagtalik. Ang “makipagtalik” ay malinaw at natural, samantalang pinananatili sa talababa ang literal na larawan ng Hebreo.
- source_word: לְטָמְאָה בָהּ
  choice: at sa gayo'y dungisan ang iyong sarili sa pamamagitan niya
  rationale: Ipinahahayag ng parirala ang ibinubungang karumihan ng kausap. Ang “dungisan ang iyong sarili” ay nagpapanatili sa lakas ng wikang טמא nang hindi ipinapalagay na ritwal na karumihan lamang ang tinutukoy.
theological_decisions:
- issue: Saklaw ng pagbabawal at kahulugan ng karumihan
  choice: Pagbabawal sa pakikipagtalik sa asawa ng kapwa, na nagdudulot ng pagkadungis sa kausap.
  alternative: Panatilihin sa pangunahing teksto ang literal na idyoma tungkol sa pagbuga bilang binhi, o tukuyin ang bunga bilang ritwal na karumihan.
  rationale: Malinaw na tumutukoy sa pakikipagtalik ang idyomang Hebreo, at ang huling parirala ang nagsasaad ng pagkadungis. Isinasalin ang kahulugan ng idyoma sa pangunahing teksto ngunit hindi nililimitahan ang טמא sa isang denominasyonal o purong ritwal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa tekstong legal. Ginamit ang “makipagtalik” bilang malinaw ngunit hindi malaswang katawagan; ang literal na idyomang Hebreo ay inilagay sa talababa.
