    issue: Hindi likas ang “ang sinuman sa iyong mga supling.”
    rationale: Ang “sinuman” ay isang panghalip na karaniwang tumutukoy sa isang indibiduwal, at hindi ito mahusay na kapareha ng “mga supling.” Ang “alinman sa iyong mga supling” ay likas at pinananatili ang diwang “anuman/alinman mula sa iyong binhi.”
  - severity: low
    issue: Kulang sa hayag na layon ang “upang paraanin.”
    rationale: Bagaman mauunawaan mula sa konteksto, mas malinaw sa Filipino ang “upang padaanin sila,” na tuwirang ipinapakita na ang mga supling ang pinadaraan.
