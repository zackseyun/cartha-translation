base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: tl
  text: At huwag mong ibigay ang alinman sa iyong mga supling upang padaanin sila kay Molec[a], at huwag mong lapastanganin ang pangalan ng iyong Diyos. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “alinman sa iyong mga anak.” Sa literal na Hebreo, “mula sa iyong binhi.” Tumutukoy ito sa isang ritwal na kaugnay ni Molec; nauunawaan ito ng marami bilang paghahandog ng mga anak, na inilalarawan sa ibang mga teksto bilang pagpaparaan sa apoy.
    reason: Pinananatili ang leksikal na alternatibo para sa זֶרַע at ipinapaliwanag ang malamang na ritwal na diwa nang hindi idinaragdag ang apoy sa pangunahing teksto, kung saan hindi ito tahasang binabanggit.
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: ang sinuman sa iyong mga supling
  rationale: Ang זֶרַע ay literal na “binhi” ngunit tumutukoy rito sa mga inapo o anak; pinananatili ng “sinuman sa iyong mga supling” ang partitive na מִן at ang saklaw ng terminong Hebreo.
- source_word: תִתֵּן
  choice: huwag mong ibigay
  rationale: Karaniwang nangangahulugang “magbigay” ang נתן, at likas na ipinahahayag ng “huwag mong ibigay” ang tahasang pagbabawal.
- source_word: לְהַעֲבִיר
  choice: upang paraanin
  rationale: Ang Hiphil ng עבר ay “magparaan” o “maging sanhi upang dumaan.” Pinananatili ng salin ang idyoma nang hindi tahasang idinaragdag sa pangunahing teksto ang apoy o paghahandog.
- source_word: לַמֹּלֶךְ
  choice: para kay Molec
  rationale: Itinuturing ang מֹלֶךְ bilang pangalang pantangi ng diyos na kaugnay ng ipinagbabawal na ritwal; ang “para kay” ay likas sa Filipino para sa tatanggap o pinag-uukulan.
- source_word: תְחַלֵּל
  choice: lapastanganin
  rationale: Sa Piel, ang חלל ay nangangahulugang “lapastanganin” o “gawing di-banal.” Ang “lapastanganin” ay dignified at malinaw sa konteksto ng pangalan ng Diyos.
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: ang pangalan ng iyong Diyos
  rationale: Pinananatili nito ang teolohikal na bigat ng “pangalan” bilang kumakatawan sa ipinahayag na dangal at reputasyon ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang Tetragrammaton ng transliterasyong “Yahweh” upang mapanatili ang personal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Likas ng pagbabawal na may kaugnayan kay Molec
  choice: Panatilihin sa pangunahing teksto ang idyomang “upang paraanin” nang hindi tahasang sinasabing “ihandog sa apoy.”
  alternative: “ihandog ang sinuman sa iyong mga anak kay Molec” o “paraanin sa apoy para kay Molec”
  rationale: Sinasabi mismo ng Hebreo na “ibigay ... upang paraanin para/kay Molec” at hindi binabanggit ang apoy sa talatang ito. Ipinaliliwanag ng talababa ang malamang na ritwal na diwa nang hindi nilulutas sa pangunahing teksto ang higit sa hayagang sinasabi nito.
- issue: Tinutukoy ng זרע sa batas na ito
  choice: “mga supling”
  alternative: “mga anak” o literal na “binhi”
  rationale: Mas malawak ang terminong Hebreo kaysa sa isang tiyak na pangkat ng edad. Tumpak at natural ang “mga supling,” samantalang itinatala sa talababa ang mas karaniwang “mga anak.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang pang-isahang “mo/iyong” ayon sa mga anyong Hebreo. Ang “lapastanganin” ay pormal ngunit karaniwan sa biblikal at relihiyosong gamit; ang “paraanin” ay sadyang nagpapanatili sa bahagyang di-tiyak na idyoma ng pinagmulan.
