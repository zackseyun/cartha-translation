  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng iyong manugang na babae[a]. Siya ay asawa ng iyong anak na lalaki; huwag mong ilantad ang kanyang kahubaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ilantad ang kahubaran,” isang paulit-ulit na legal na eupemismo sa Levitico para sa ipinagbabawal na pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: ang kahubaran ng
  rationale: Pinananatili nito ang paulit-ulit na legal na eupemismong Hebreo sa Levitico 18, sa halip na agad itong gawing tahasang paraprasis tungkol sa pakikipagtalik.
- source_word: כַּלָּתְךָ
  choice: iyong manugang na babae
  rationale: Ito ang malinaw at likas na makabagong Tagalog para sa asawa ng anak na lalaki, at iniiwasan ang posibleng kalabuan ng salitang “manugang” lamang.
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: huwag mong ilantad
  rationale: Ang Piel ng גלה kasama ng עֶרְוָה ay bumubuo sa nakaugaliang pormula ng pagbabawal sa kabanatang ito. Ang “ilantad” ay natural ngunit nananatiling malapit sa larawan ng Hebreo.
- source_word: אֵשֶׁת בִּנְךָ
  choice: asawa ng iyong anak
  rationale: Direkta at natural nitong ipinapahayag ang paliwanag na ang babaeng tinutukoy ay asawa ng anak ng kausap.
- source_word: הִוא
  choice: Siya ay
  rationale: Pinananatili ang tahasang panghalip at ang paliwanag o pagbibigay-diin ng sugnay sa Hebreo.
- source_word: עֶרְוָתָהּ
  choice: ang kanyang kahubaran
  rationale: Pinananatili ang pag-uulit sa Hebreo at ang pare-parehong legal na pananalita ng kabanata.
theological_decisions:
- issue: Pagsasalin sa idyomang “ilantad ang kahubaran” sa konteksto ng seksuwal na pagbabawal
  choice: Panatilihin sa pangunahing teksto ang idyomang “ilantad ang kahubaran.”
  alternative: “makipagtalik sa” o “makipagtalik nang bawal sa”
  rationale: Ang Hebreo ay gumagamit ng isang matatag at paulit-ulit na legal na eupemismo sa Levitico 18. Ang pagpapanatili rito ay nag-iingat sa ugnayan ng mga talata at hindi pinapawi ang anyo at tensiyon ng orihinal, habang nililinaw ng talababa ang kahulugan nito sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manugang na babae” para sa tiyak na ugnayang pampamilya at pinanatili ang pormal na pag-uulit ng tekstong Hebreo.
