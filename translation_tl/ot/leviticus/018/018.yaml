  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: tl
  text: Huwag mong kunin ang kapatid na babae ng iyong asawa bilang karagdagang asawa at karibal niya, upang ilantad ang kahubaran ng kapatid na babaeng iyon habang nabubuhay pa ang iyong asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kang kumuha ng isang babae bukod sa kapatid na babae nito upang gawin siyang karibal.” Siksik ang Hebreo; ang diwa ay pagbabawal na kunin bilang karagdagang asawa ang kapatid na babae ng isang asawa habang nabubuhay pa ang asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אֶל אֲחֹתָהּ
  choice: ang kapatid na babae ng iyong asawa bilang karagdagang asawa
  rationale: Sa kontekstong pambatas, ang אִשָּׁה ay maaaring tumukoy sa babae o asawa, at ang siksik na parirala ay nagsasaad ng pagkuha sa kapatid ng kasalukuyang asawa. Ginawang tahasan sa Tagalog ang ugnayan upang maiwasan ang kalituhan ng mga panghalip.
- source_word: לֹא תִקָּח
  choice: Huwag mong kukunin
  rationale: Likas at marangal na anyo ito ng tuwirang pagbabawal sa modernong Tagalog, habang pinananatili ang tono ng batas.
- source_word: לִצְרֹר
  choice: at karibal niya
  rationale: Ipinahihiwatig ng pandiwa ang paglikha ng tunggalian o pagiging magkaribal. Pinananatili ng saling ito ang resultang ugnayan sa pagitan ng magkapatid.
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: upang ilantad ang kahubaran nito
  rationale: Pinananatili ang karaniwang Levitikong eupemismo para sa pakikipagtalik sa halip na palitan ito ng ganap na pagpapaliwanag.
- source_word: בְּחַיֶּיהָ
  choice: habang nabubuhay pa ang iyong asawa
  rationale: Ang kahulugan ay 'sa panahon ng kanyang buhay.' Nilinaw ang tinutukoy ng panghalip dahil madaling maging malabo sa Tagalog kung 'niya' lamang ang gagamitin.
theological_decisions:
- issue: Saklaw ng pagbabawal kaugnay ng pag-aasawa sa magkapatid
  choice: Ipinagbabawal ang pagkuha sa kapatid ng isang asawa bilang karagdagang asawa habang nabubuhay pa ang unang asawa.
  alternative: Maaaring unawain bilang ganap na pagbabawal sa pag-aasawa sa dalawang magkapatid kahit patay na ang una, o bilang pangkalahatang pagbabawal lamang sa paglikha ng karibal na asawa.
  rationale: Ang לִצְרֹר at בְּחַיֶּיהָ ay pinakamalikas na tumutukoy sa pagdaragdag sa kapatid bilang karibal habang buhay pa ang una. Hindi pinalawak ng salin ang batas lampas sa tahasang saklaw ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong pambatas. Ginamit ang “iyong asawa” upang malinaw ang mga tinutukoy, at pinanatili ang idyomang “ilantad ang kahubaran” dahil mahalaga ito sa bokabularyo at estilo ng kabanata.
