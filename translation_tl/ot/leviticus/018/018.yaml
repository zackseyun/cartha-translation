    issue: Di-likas ang pandiwang “Huwag mong kukunin.”
    rationale: Sa modernong Tagalog, ang tuwirang pagbabawal ay “Huwag mong kunin,” hindi ang aspektong panghinaharap na “kukunin.”
  - severity: medium
    issue: Malabo at di-angkop sa tao ang “kahubaran nito.”
    rationale: Ang panghalip na “nito” ay karaniwang di-pantao at maaaring hindi agad matukoy kung alin sa dalawang babae ang tinutukoy. Ang Hebreo ay tumutukoy sa kapatid na babaeng kinukuha bilang karagdagang asawa.
