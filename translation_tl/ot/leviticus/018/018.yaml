revisions:
- from: Huwag mong kukunin ang kapatid na babae ng iyong asawa bilang karagdagang asawa at karibal niya[a], upang ilantad ang kahubaran nito habang nabubuhay pa ang iyong asawa.
  to: Huwag mong kunin ang kapatid na babae ng iyong asawa bilang karagdagang asawa at karibal niya, upang ilantad ang kahubaran ng kapatid na babaeng iyon habang nabubuhay pa ang iyong asawa.[a]
  rationale: Inayos ang anyo ng pagbabawal at ang reperensiya ng panghalip nang hindi binabago ang saklaw ng batas. Pinananatili ng “bilang karagdagang asawa at karibal niya” ang puwersa ng pagkuha sa kapatid sa paraang lumilikha ng tunggalian, at ng pangwakas na parirala ang limitasyong habang buhay pa ang unang asawa.
