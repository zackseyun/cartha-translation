  source_fidelity: 'Tumpak na ipinahihiwatig ng draft ang makitid na saklaw ng Hebreo: ang pagkuha sa kapatid na babae ng asawa bilang karagdagang asawa/karibal habang buhay pa ang unang asawa. Gayunman, ang “Huwag mong kukunin” ay hindi likas na anyo ng pagbabawal sa Tagalog, at ang “kahubaran nito” ay hindi angkop na panghalip para sa taong tinutukoy at maaaring lumabo ang reperensiya.'
  naturalness: Palitan ang “Huwag mong kukunin” ng karaniwang legal na “Huwag mong kunin.” Linawin ang layon ng “kahubaran” sa pamamagitan ng pag-uulit ng “kapatid na babaeng iyon,” sa halip na gumamit ng “nito.”
  terminology: Ang “karagdagang asawa,” “karibal,” at “ilantad ang kahubaran” ay angkop na katumbas ng ugnayang ipinahihiwatig ng אִשָּׁה ... לִצְרֹר at ng nakaugaliang Levitikong idyoma na לְגַלּוֹת עֶרְוָה. Hindi dapat gawing tahasang “makipagtalik,” sapagkat pinananatili ng Hebreo ang idyoma.
  issues:
