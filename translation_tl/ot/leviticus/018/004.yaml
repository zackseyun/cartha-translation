  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: tl
  text: Isagawa ninyo ang aking mga kahatulan, at sundin ninyo ang aking mga tuntunin, upang lumakad kayo ayon sa mga ito.[a] Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang mamuhay kayo ayon sa mga ito.” Sa Hebreo, literal na “lumakad sa mga ito,” isang idyoma para sa pamumuhay alinsunod sa mga utos ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: aking mga kahatulan
  rationale: Pinananatili ng “mga kahatulan” ang legal at huk法 na diwa ng מִשְׁפָּט at ipinag-iiba ito sa חֻקֹּתַי.
- source_word: תַּעֲשׂוּ
  choice: isagawa ninyo
  rationale: Ang עשה ay literal na “gawin,” ngunit sa konteksto ng mga utos, natural na ipinahahayag ng “isagawa” ang aktuwal na pagtupad.
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang “mga tuntunin” ay malinaw at kasalukuyang salin para sa mga itinakdang batas o alituntunin, habang nananatiling naiiba sa “mga kahatulan.”
- source_word: תִּשְׁמְרוּ
  choice: ingatan ninyo
  rationale: Pinananatili ng “ingatan” ang pangunahing diwa ng שׁמר na magbantay o magpanatili, kasama ang tipanang diwa ng maingat na pagsunod.
- source_word: לָלֶכֶת בָּהֶם
  choice: upang lumakad kayo ayon sa mga ito
  rationale: Pinananatili nito ang Hebreong talinghaga ng paglakad bilang paraan ng pamumuhay, habang ginagawang malinaw sa Tagalog na ang buhay ay iaayon sa mga utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang ipinahahayag nito ang anyong may hulaping pangmaramihang ikalawang panauhan at ang ugnayang tipan.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Diwa ng לָלֶכֶת בָּהֶם
  choice: upang lumakad kayo ayon sa mga ito
  alternative: upang mamuhay kayo ayon sa mga ito
  rationale: Pinananatili sa pangunahing teksto ang talinghaga ng Hebreo at hindi tahimik na nilulutas ito bilang “mamuhay”; ipinaliliwanag sa talababa ang idyomatikong kahulugan.
translation_notes:
  register: Makabagong Filipino na may marangal at bahagyang pormal na himig. Pinanatili ang Hebreong talinghaga ng “paglakad,” ngunit idinagdag ang “ayon sa” upang maging malinaw at natural sa ordinaryong mambabasa.
