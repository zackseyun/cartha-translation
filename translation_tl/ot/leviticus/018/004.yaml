  naturalness: Bahagyang mas natural ang “sundin ninyo” para sa pagsunod sa mga tuntunin. Mas tuwiran at idiomatiko rin ang “Ako si Yahweh, ang inyong Diyos” kaysa “Ako si Yahweh na inyong Diyos.”
  terminology: Pinananatili ang “mga kahatulan” para sa מִשְׁפָּטַי at “mga tuntunin” para sa חֻקֹּתַי upang hindi pag-isahin ang magkaibang legal na termino. Pinananatili ang “Yahweh.”
