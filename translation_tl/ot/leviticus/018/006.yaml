  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: tl
  text: Walang sinuman sa inyo ang lalapit sa sinuman niyang malapit na kamag-anak upang ilantad ang kahubaran.[a] Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang “ilantad ang kahubaran” ay isang legal na idyoma sa kabanatang ito na tumutukoy sa ipinagbabawal na seksuwal na paglalantad o pakikipagtalik sa malapit na kamag-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Walang sinuman sa inyo
  rationale: Ang inuulit na pangngalan ay distributibong idyoma na tumutukoy sa bawat indibidwal. Sa konteksto ng pagbabawal, natural itong ipinapahayag sa modernong Tagalog bilang “Walang sinuman sa inyo.”
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: malapit niyang kamag-anak
  rationale: Tumutukoy ang parirala sa malapit na kaanak batay sa ugnayang laman o dugo. Pinananatili ng “malapit niyang kamag-anak” ang diwa nang hindi gumagamit ng di-natural na literalismong “kamag-anak ng kanyang laman.”
- source_word: לֹא תִקְרְבוּ
  choice: ang lalapit
  rationale: Kasama ng “Walang sinuman,” malinaw at natural nitong ipinapahayag ang legal na pagbabawal. Pinananatili rin ng “lalapit” ang eupemistikong paghahanda sa kasunod na parirala.
- source_word: לְגַלּוֹת עֶרְוָה
  choice: upang ilantad ang kahubaran nito
  rationale: Pinananatili ang paulit-ulit na legal at seksuwal na idyoma ng kabanata sa halip na agad itong gawing interpretibong “makipagtalik.” Nililinaw ng talababa ang saklaw nito.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang mariing pormula ng banal na pagpapakilala at direktang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kung gagawing tahasan sa pangunahing teksto ang seksuwal na idyoma
  choice: Panatilihin ang “ilantad ang kahubaran”
  alternative: makipagtalik; magkaroon ng seksuwal na relasyon
  rationale: Ang idyoma ay mahalagang paulit-ulit na pormula sa Levitico 18 at maaaring tumukoy sa ipinagbabawal na seksuwal na paglalantad o pakikipagtalik. Pinananatili sa teksto ang tunay na lawak nito at ipinapaliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinuman” bilang natural na distributibong pagbabawal, habang pinanatili ang legal na idyomang “ilantad ang kahubaran” at ang pangalang Yahweh.
