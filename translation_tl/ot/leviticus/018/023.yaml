id: LEV.18.23
reference: Leviticus 18:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: tl
  text: Huwag kang makipagtalik sa anumang hayop, anupat maging marumi ka dahil dito.[a] Ang isang babae ay huwag pumuwesto sa harap ng isang hayop upang makipagtalik dito.[b] Ito ay kabuktutan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “huwag mong ibigay ang iyong paghiga upang maging marumi dahil dito.” Ang “paghiga” ay idyomang tumutukoy rito sa pakikipagtalik. Maaari ring isalin ang kasunod na parirala na “at sa gayo’y dungisan mo ang iyong sarili dahil dito.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang sakyan siya nito”; tumutukoy ang parirala sa pakikipagtalik ng hayop sa babae.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “paglabag sa wastong kaayusan,” “kaguluhan,” o “karumal-dumal na gawain.” Ang salitang Hebreo ay tumutukoy sa matinding paglabag sa nararapat na kaayusan, lalo na sa kontekstong seksuwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: sa anumang hayop
  rationale: Malawak ang saklaw ng בְּהֵמָה rito at pinatitibay ng כָּל; malinaw at likas sa makabagong Tagalog ang “anumang hayop.”
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: Huwag kang makipagtalik
  rationale: Literal na “huwag mong ibigay ang iyong paghiga/pakikipagtalik” ang Hebreong idyoma, ngunit magiging malabo at hindi likas iyon sa Tagalog. Tuwirang ipinahahayag ng “makipagtalik” ang seksuwal na diwa nang hindi dinaragdagan ang detalye.
- source_word: לְטָמְאָה בָהּ
  choice: anupat maging marumi ka dahil dito
  rationale: Pinananatili nito ang bunga o layunin ng infinitive at ang kategorya ng karumihan, nang hindi ito nililimitahan sa ritwal na karumihan lamang.
- source_word: וְאִשָּׁה
  choice: Ang isang babae
  rationale: Pangkalahatang “babae,” hindi partikular na “asawa,” ang kahulugan ng אִשָּׁה sa kontekstong ito.
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: ay huwag pumuwesto sa harap ng isang hayop
  rationale: Ang “pumuwesto sa harap” ay mas malinaw sa Tagalog kaysa literal na “tumayo sa harap” at ipinahihiwatig ang sinasadyang paghaharap para sa kasunod na layuning seksuwal.
- source_word: לְרִבְעָהּ
  choice: upang makipagtalik dito
  rationale: Tumutukoy ang רבע sa pag-ibabaw o pagsampa ng hayop sa babae para sa pagtatalik. Natural ang pangunahing salin, habang inilalahad sa talababa ang direksiyon ng kilos sa Hebreo.
- source_word: תֶּבֶל
  choice: kabuktutan
  rationale: Ipinahahayag ng “kabuktutan” ang matinding paglabag sa wastong kaayusan na taglay ng תֶּבֶל sa seksuwal na konteksto, samantalang iniiwasan ang makabagong maling pakahulugan sa literal na “kaguluhan.”
- source_word: הוּא
  choice: Ito ay
  rationale: Tumutukoy ang panghalip sa ipinagbabawal na gawain at natural itong ipinahahayag bilang “Ito ay” sa Tagalog.
theological_decisions:
- issue: Kung ang karumihan ay dapat unawain bilang ritwal lamang o mas malawak na moral-ritwal na pagdungis
  choice: anupat maging marumi ka dahil dito
  alternative: at sa gayo’y dungisan mo ang iyong sarili dahil dito
  rationale: Pinananatili ng “maging marumi” ang biblikal na kategorya ng טמא at hindi nito nilulutas ang saklaw bilang ritwal lamang o moral lamang.
- issue: Kahulugan ng תֶּבֶל
  choice: kabuktutan
  alternative: kaguluhan; paglabag sa wastong kaayusan; karumal-dumal na gawain
  rationale: Sapat ang “kabuktutan” upang ipakita ang negatibong paghatol at paglihis sa wastong kaayusan, ngunit inilalahad sa talababa ang tunay na saklaw at kalabuan ng salitang Hebreo.
- issue: Paglalarawan sa kilos ng babae at hayop
  choice: upang makipagtalik dito
  alternative: upang sakyan siya nito
  rationale: Mas natural at dignified ang pangunahing salin. Hindi naman ikinukubli ang gramatikal na direksiyon ng Hebreo sapagkat malinaw itong itinatala sa talababa.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang malinaw na “makipagtalik” sa halip na panatilihin sa pangunahing teksto ang hindi likas na literal na idyomang “ibigay ang iyong paghiga.” Ang “pumuwesto” ay nagpapalinaw sa sinasadyang paghaharap nang hindi nagiging bulgar; ang mga literal na anyo at leksikal na alternatibo ay pinanatili sa mga talababa.
