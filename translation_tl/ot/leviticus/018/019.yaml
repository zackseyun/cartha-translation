  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: tl
  text: Huwag kang lalapit sa isang babae sa panahon ng kanyang ritwal na karumihan dahil sa regla[a] upang ilantad ang kanyang kahubaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “habang nasa kalagayan siya ng karumihan dahil sa regla.” Ginagamit ng Hebreo ang terminolohiya ng ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: Huwag kang lalapit sa isang babae
  rationale: Ang אֶל kasama ng קָרַב ay bumubuo ng diwang “lumapit sa.” Pinananatili ng “isang babae,” sa halip na “asawa,” ang pangkalahatan at di-tiyak na kahulugan ng אִשָּׁה sa talatang ito.
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: habang siya ay ritwal na marumi dahil sa regla
  rationale: Tumutukoy ang נִדָּה sa kalagayang kaugnay ng pagreregla, at ang טֻמְאָה ay wika ng ritwal na karumihan sa Levitico. Nililinaw ng “ritwal” na hindi moral o medikal na paghatol ang tinutukoy.
- source_word: לֹא תִקְרַב
  choice: Huwag kang lalapit
  rationale: Likas at tuwirang anyo ito ng legal na pagbabawal sa makabagong Tagalog, habang pinananatili ang diwa ng paglapit na may seksuwal na layunin ayon sa konteksto.
- source_word: לְ/גַלּוֹת
  choice: upang ilantad
  rationale: Pinananatili ng “ilantad” ang legal na eupemismong גלה at ang ugnayan nito sa “kahubaran,” nang hindi ginagawang higit na tahasan kaysa sa Hebreo.
- source_word: עֶרְוָתָהּ
  choice: ang kanyang kahubaran
  rationale: Ang “kahubaran” ay tumpak na katumbas ng עֶרְוָה at nagpapanatili sa paulit-ulit na seksuwal na eupemismo ng Levitico 18.
theological_decisions:
- issue: Kung ang טֻמְאָה ay ihahayag bilang ritwal na karumihan o bilang purong kalagayang medikal/hygienic
  choice: ritwal na marumi dahil sa regla
  alternative: may regla / marumi dahil sa pagreregla
  rationale: Ang bokabularyo ng Hebreo ay kabilang sa sistemang ritwal ng kalinisan sa Levitico. Pinananatili ng salin ang kategoryang iyon at iniiwasang magpahiwatig ng likas na moral na pagkakasala o modernong medikal na paghatol.
- issue: Kung gagawing tahasan ang seksuwal na kahulugan ng “ilantad ang kahubaran”
  choice: panatilihin ang eupemismong “ilantad ang kanyang kahubaran”
  alternative: makipagtalik sa kanya
  rationale: May seksuwal na diwa ang parirala sa konteksto, ngunit eupemistiko ang mismong Hebreo. Ang pagpapanatili rito ay umiiwas sa pagsasara ng saklaw o tindi ng orihinal na pananalita.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang isahang “kang” bilang natural na anyo ng utos. Pinanatili ang legal na tono at ang seksuwal na eupemismo ng Hebreo, habang nilinaw ang ritwal na kahulugan ng karumihan.
