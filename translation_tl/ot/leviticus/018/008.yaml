translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng asawa ng iyong ama[a]; iyon ang kahubaran ng iyong ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tahasan, “Huwag kang makipagtalik sa asawa ng iyong ama.” Literal sa Hebreo, “ilantad ang kahubaran ng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: ang kahubaran ng
  rationale: Pinananatili ang paulit-ulit na legal na idyomang Hebreo na “ilantad ang kahubaran,” isang eupemismo para sa pakikipagtalik, sa halip na tahasang ipaliwanag ito sa pangunahing teksto.
- source_word: אֵשֶׁת
  choice: asawa
  rationale: Sa pagkakaugnay nito sa “iyong ama,” malinaw na tumutukoy ito sa asawa ng ama, hindi lamang sa isang babae.
- source_word: לֹא תְגַלֵּה
  choice: Huwag mong ilantad
  rationale: Natural itong pautos na pagbabawal sa modernong Tagalog at pinananatili ang metapora ng Hebreo.
- source_word: אָבִיךָ
  choice: iyong ama
  rationale: Tuwirang salin ng anyong may panandang pag-aari; inulit gaya sa Hebreo upang mapanatili ang diin at ugnayang legal.
- source_word: הִוא
  choice: iyon ay
  rationale: Ang panghalip ay tumutukoy pabalik sa “kahubaran,” kaya “iyon” ang natural na Tagalog sa halip na tukuyin ang babae mismo.
theological_decisions:
- issue: Kung tahasang isasalin ang eupemistikong legal na idyoma bilang pagbabawal sa pakikipagtalik
  choice: Panatilihin sa pangunahing teksto ang idyomang “ilantad ang kahubaran.”
  alternative: “Huwag kang makipagtalik sa asawa ng iyong ama.”
  rationale: Paulit-ulit na pormulang legal ito sa Levitico 18. Ang pagpapanatili sa idyoma ay gumagalang sa eupemistikong rehistro at pagkakaugnay-ugnay ng kabanata, habang inilalagay sa talababa ang wastong tahasang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Huwag mong” bilang natural na pormula ng legal na pagbabawal, at pinanatili ang eupemistikong idyoma ng orihinal.
