base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: tl
  text: Huwag ninyong tularan ang mga gawain sa lupain ng Ehipto, kung saan kayo nanirahan; at huwag ninyong tularan ang mga gawain sa lupain ng Canaan, kung saan ko kayo dinadala. Huwag kayong mamuhay ayon sa kanilang mga tuntunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Huwag ninyong sundin ang kanilang mga kaugalian.” Ang Hebreong salita ay maaaring mangahulugang mga tuntunin, itinakdang kaugalian, o mga batas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: ang mga gawain ng
  rationale: Pinananatili ang konkretong diwa ng Hebreong מַעֲשֶׂה, ‘gawa’ o ‘gawi,’ at ang idyomang nag-uugnay sa mga gawa sa lupain at sa mga taong naninirahan doon.
- source_word: אֶרֶץ מִצְרַיִם
  choice: lupain ng Ehipto
  rationale: Pinananatili ang heograpikong diin ng konstruksiyong Hebreo.
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: na tinirhan ninyo
  rationale: Likas sa Filipino at malinaw na tumutukoy sa Ehipto bilang dating tirahan ng Israel.
- source_word: לֹא תַעֲשׂוּ
  choice: huwag ninyong gawin
  rationale: Ang ‘huwag’ na may pandiwa ay natural at mariing anyo ng pagbabawal sa makabagong Filipino.
- source_word: וּכְמַעֲשֵׂה אֶרֶץ כְּנַעַן
  choice: ang mga gawain ng lupain ng Canaan
  rationale: Inuulit ang anyo ng unang sugnay upang mapanatili ang parallelismo ng Hebreo.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: na pagdadalhan ko sa inyo
  rationale: Ipinahahayag ang kilos ng Diyos at ang patutunguhan; ang aspektong kontemplatibo ay angkop sa kasalukuyan at nalalapit na pagdadala.
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: ayon sa kanilang mga tuntunin
  rationale: Ang חֻקּוֹת ay maaaring tumukoy sa mga batas, itinakdang tuntunin, o kaugalian. Ang ‘mga tuntunin’ ay nagpapanatili ng normatibong puwersa nang hindi nililimitahan sa pormal na batas.
- source_word: לֹא תֵלֵכוּ
  choice: Huwag kayong mamuhay
  rationale: Ang literal na ‘lumakad’ ay metapora para sa asal o paraan ng pamumuhay; ‘mamuhay’ ang natural na katumbas sa Filipino at iniiwasan ang maling pagkaunawang pisikal na paglakad.
theological_decisions:
- issue: Kung dapat bang tahasang tukuyin ang mga naninirahan sa Ehipto at Canaan bilang gumagawa ng ipinagbabawal
  choice: Panatilihin ang idyomang ‘mga gawain ng lupain’
  alternative: ‘Gawin ang ginagawa ng mga tao sa lupain’
  rationale: Ang Hebreo ay tunay na nag-uugnay ng mga gawain sa ‘lupain.’ Nauunawaan sa konteksto na mga tao ang gumagawa, ngunit hindi kailangang idagdag iyon sa pangunahing teksto.
- issue: Kung ang חֻקֹּתֵיהֶם ay ‘mga batas,’ ‘mga kaugalian,’ o ‘mga tuntunin’
  choice: mga tuntunin
  alternative: mga kaugalian
  rationale: Pinananatili ng ‘mga tuntunin’ ang diwa ng nakatakdang pamantayan at ang kaibahan nito sa mga tuntunin ng PANGINOON sa konteksto, samantalang hindi nito isinasara ang mas malawak na posibilidad na tumutukoy rin ito sa mga kaugalian.
- issue: Kung pananatilihin nang literal ang metapora ng ‘paglakad’
  choice: mamuhay ayon sa
  alternative: lumakad ayon sa
  rationale: Ang punto ay pagsunod at paraan ng pamumuhay, hindi pisikal na paglakad. Ang saling ito ay malinaw sa ordinaryong mambabasang Filipino nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Ehipto’ at ‘Canaan’ bilang karaniwang anyong biblikal. Pinanatili ang parallelismo ng dalawang pagbabawal, ngunit isinalin nang dinamiko ang metapora ng paglakad bilang pamumuhay.
