revisions:
- from: Huwag ninyong gawin ang mga gawain ng lupain ng Ehipto, na tinirhan ninyo, at huwag ninyong gawin ang mga gawain ng lupain ng Canaan, na pagdadalhan ko sa inyo. Huwag kayong mamuhay ayon sa kanilang mga tuntunin.[a]
  to: Huwag ninyong tularan ang mga gawain sa lupain ng Ehipto, kung saan kayo nanirahan; at huwag ninyong tularan ang mga gawain sa lupain ng Canaan, kung saan ko kayo dinadala. Huwag kayong mamuhay ayon sa kanilang mga tuntunin.[a]
  rationale: Inayos ang sugnay tungkol sa pagdadala sa Canaan upang malinaw na ang Diyos ang nagdadala sa mga kausap doon. Pinalitan ang “gawin ang mga gawain” ng “tularan ang mga gawain” upang maipahayag ang komparatibong puwersa ng Hebreong parirala at ang idyomatikong pagtukoy nito sa mga gawi ng mga naninirahan sa lupain. Pinanatili ang parallelismo, ang modernong marangal na rehistro, at ang footnote para sa alternatibong kahulugan ng חֻקּוֹת.
