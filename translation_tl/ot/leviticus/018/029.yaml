base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: tl
  text: Sapagkat ang sinumang gagawa ng alinman sa mga karumal-dumal na gawaing ito ay puputulin mula sa gitna ng kanilang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain bilang “papatayin” o “ititiwalag sa pamayanan.” Sa Hebreo, “puputulin mula sa gitna ng kanilang bayan,” ngunit hindi tinutukoy ang eksaktong paraan ng paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan na kaugnay ng naunang mga pagbabawal.
- source_word: כָּל אֲשֶׁר
  choice: sinumang
  rationale: Likas at malinaw na Filipino para sa pangkalahatang di-tiyak na pagtukoy na ‘bawat gumagawa’ o ‘sinuman na.’
- source_word: יַעֲשֶׂה
  choice: gumawa
  rationale: Pinananatili ang malawak at payak na diwa ng pandiwang ‘gawin’ nang hindi ito pinakikitid sa mas espesyalisadong terminong moral.
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: ng alinman sa lahat ng karumal-dumal na gawaing ito
  rationale: Ang ‘alinman sa lahat’ ay nagpapanatili sa partitive at pangkalahatang puwersa ng Hebreo; nililinaw ng ‘gawain’ na ang tinutukoy sa konteksto ay mga ipinagbabawal na kilos.
- source_word: תּוֹעֵבוֹת
  choice: karumal-dumal na gawain
  rationale: Nagpapahayag ng matinding moral at ritwal na pagkasuklam sa natural at dignified na modernong Filipino.
- source_word: וְנִכְרְתוּ
  choice: ay ihihiwalay
  rationale: Pinananatili ang legal na idyoma ng pagkaputol mula sa bayan nang hindi tinutukoy kung ito ay kamatayan, hatol ng Diyos, o pagpapatalsik.
- source_word: הַנְּפָשׁוֹת
  choice: ang mga taong
  rationale: Sa legal na kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa mga tao o indibidwal, hindi sa ‘kaluluwa’ bilang hiwalay na sangkap.
- source_word: הָעֹשֹׂת
  choice: gumawa ng mga iyon
  rationale: Iniuugnay nang malinaw ang mga taong hinahatulan sa mga gawaing kababanggit lamang.
- source_word: מִקֶּרֶב עַמָּם
  choice: mula sa kanilang bayan
  rationale: Natural na Filipino para sa pormulang tumutukoy sa pag-aalis mula sa gitna ng sambayanang tipan.
theological_decisions:
- issue: Kahulugan ng pormulang parusa na וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם
  choice: ihihiwalay mula sa kanilang bayan
  alternative: papatayin; ititiwalag sa pamayanan
  rationale: Hindi espesipikong sinasabi ng Hebreo kung ang pagkaputol ay kamatayan, tuwirang hatol ng Diyos, o pagpapatalsik. Kaya pinananatili ng salin at talababa ang sadyang hindi tiyak na paraan ng paghatol.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang ‘karumal-dumal na gawain’ sa halip na mas arkaikong ‘kasuklam-suklam na bagay,’ at pinanatili sa ‘ihihiwalay’ ang hindi tiyak na saklaw ng pormulang Hebreo.
