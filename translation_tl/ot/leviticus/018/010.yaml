  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng anak na babae ng iyong anak na lalaki o ng anak na babae ng iyong anak na babae,[a] sapagkat sila ang iyong kahubaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas tuwirang tawag sa kamag-anakan: “apo mong babae na anak ng iyong anak na lalaki o apo mong babae na anak ng iyong anak na babae.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “ilantad ang kahubaran” ay idyomang Hebreo para sa pakikipagtalik. Literal ang pangwakas na sugnay na “sapagkat sila ang iyong kahubaran,” na naglalarawan sa malalapit na inapo bilang kaugnay ng sariling katawan at pamilya.
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: kahubaran
  rationale: Pinananatili ng “kahubaran” ang paulit-ulit na legal na eupemismong Hebreo at ang ugnayan ng pambungad na pagbabawal sa pangwakas na dahilan.
- source_word: בַּת בִּנְךָ
  choice: anak na babae ng iyong anak na lalaki
  rationale: Tuwirang ipinapakita ang tiyak na linya ng kamag-anakan sa panig ng anak na lalaki.
- source_word: בַת בִּתְּךָ
  choice: anak na babae ng iyong anak na babae
  rationale: Tuwirang ipinapakita ang tiyak na linya ng kamag-anakan sa panig ng anak na babae at pinananatili ang magkatimbang na ayos ng Hebreo.
- source_word: לֹא תְגַלֶּה
  choice: Huwag mong ilantad
  rationale: Natural itong anyong pagbabawal sa modernong Tagalog habang pinananatili ang larawan ng literal na pandiwang “ilantad” sa pormulang legal.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinahahayag ang sanhi at angkop sa marangal na rehistro ng batas.
- source_word: הֵנָּה
  choice: sila ay
  rationale: Ang pambabaeng pangmaramihang panghalip ay tumutukoy sa dalawang babaeng inapo; hindi ito pinapalitan ng mas interpretibong “ang kanilang kahubaran.”
theological_decisions:
- issue: Kahulugan ng pangwakas na כִּי עֶרְוָתְךָ הֵנָּה (“sapagkat sila ay iyong kahubaran”)
  choice: sila ay sarili mong kahubaran
  alternative: ang kanilang kahubaran ay gaya ng sa iyo / sila ay sarili mong laman
  rationale: Pinananatili ang tahasang predikasyon ng Hebreo at ang tensiyon ng lohikang nakabatay sa malapit na kamag-anakan, sa halip na gawing mas paliwanag o baguhin ang paksa ng sugnay.
- issue: Saklaw ng idyomang “ilantad ang kahubaran”
  choice: panatilihin ang idyoma sa pangunahing teksto at ipaliwanag sa talababa
  alternative: makipagtalik sa
  rationale: Sa Levitico 18, isa itong nakapirming legal na eupemismo para sa ipinagbabawal na relasyong seksuwal. Ang literal na larawan ay mahalaga sa pagkakaugnay ng kabanata, ngunit kailangan ng maikling paliwanag para sa makabagong mambabasa.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinili ang mas mahaba ngunit eksaktong mga katawagan sa kamag-anakan sa pangunahing teksto; ibinigay ang mas natural na “apo mong babae” sa talababa. Pinanatili ang legal na eupemismo at ang di-karaniwang pangwakas na metapora ng Hebreo.
