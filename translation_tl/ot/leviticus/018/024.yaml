base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: tl
  text: Huwag ninyong dungisan ang inyong mga sarili sa alinman sa mga bagay na ito,[a] sapagkat dahil sa lahat ng ito ay naging marumi ang mga bansang itinataboy ko sa harap ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag ninyong gawing marumi ang inyong mga sarili sa alinman sa mga bagay na ito … naging marumi ang mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: Huwag ninyong dungisan ang inyong sarili
  rationale: Ang אַל na may imperfect ay tuwirang pagbabawal, at ang Hitpael ng טמא ay nagpapahayag ng kilos na bumabalik sa gumagawa. Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang paglahok ng mga tao sa sarili nilang karumihan.
- source_word: בְּכָל אֵלֶּה
  choice: sa alinman sa mga bagay na ito
  rationale: Sa saklaw ng negatibong pagbabawal, ang literal na 'lahat ng ito' ay likas na ipinahahayag bilang 'alinman sa mga bagay na ito'; ang בְּ ay tumutukoy sa paraan o larangan ng pagdungis.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan ng naunang pagbabawal; ang 'sapagkat' ay malinaw at marangal na pang-ugnay.
- source_word: בְכָל אֵלֶּה נִטְמְאוּ
  choice: sa lahat ng ito ay naging marumi
  rationale: Ang Niphal ng טמא ay passive o stative at tumutukoy sa kinalabasang kalagayan. Ang 'naging marumi' ay nagpapanatili sa bokabularyo ng karumihang ritwal-moral nang hindi pinipilit ang tahasang causative na diwa.
- source_word: הַגּוֹיִם
  choice: ang mga bansa
  rationale: Tumutukoy ito sa mga di-Israelitang bayang naninirahan sa lupain. Ang 'mga bansa' ang tuwiran at hindi anakronistikong katumbas.
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: na itinataboy ko
  rationale: Bagaman karaniwang nangangahulugang 'magpadala' ang שׁלח, sa konteksto ng paghatol at pag-aalis sa lupain ay nangangahulugan itong magpalayas o magtaboy.
- source_word: מִפְּנֵיכֶם
  choice: sa harap ninyo
  rationale: Pinananatili nito ang larawang spatial ng literal na 'mula sa harap ninyo' at likas itong kaugnay ng 'itinataboy' sa Tagalog.
theological_decisions:
- issue: Bokabularyo ng ritwal-moral na karumihan sa Levitico 18
  choice: dungisan ang inyong sarili / naging marumi
  alternative: gawin ninyong marumi ang inyong sarili / dinungisan
  rationale: Saklaw ng טמא rito ang tunay na karumihang dulot ng mga ipinagbabawal na gawain, na hindi dapat paliitin sa seremonyal lamang. Ang magkaugnay na 'dungisan' at 'marumi' ay natural sa Tagalog at pinananatili ang pagkakaiba ng reflexive na unang pandiwa at passive/stative na ikalawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang maramihang 'ninyo' upang ipakita ang pangmaramihang anyo ng Hebreo; iniwasan ang labis na teknikal o denominasyonal na pananalita.
