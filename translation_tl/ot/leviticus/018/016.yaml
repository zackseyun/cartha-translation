translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng asawa ng iyong kapatid na lalaki[a]. Kahubaran ito ng iyong kapatid na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas tuwiran, “Huwag kang makipagtalik sa asawa ng iyong kapatid na lalaki.” Ginagamit sa Hebreo ang idyomang “ilantad ang kahubaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: ang kahubaran ng
  rationale: Sa Levitico 18, ang עֶרְוָה sa idyomang גלה ערוה ay isang legal at eupemistikong pahayag tungkol sa ipinagbabawal na seksuwal na paglalantad o pakikipagtalik. Pinananatili ng “ilantad ang kahubaran” ang larawan at pag-uulit ng Hebreo.
- source_word: אֵשֶׁת
  choice: asawa ng
  rationale: Sa anyong konstrukto kasama ng “kapatid mo,” malinaw na asawa ang tinutukoy, hindi basta babae.
- source_word: אָחִיךָ
  choice: kapatid mong lalaki
  rationale: Tiyak na panlalaki ang Hebreong אָח; nililinaw ito sa Tagalog upang hindi mawala sa mas malawak na salitang “kapatid” ang kasarian ng kamag-anak na tinutukoy.
- source_word: לֹא תְגַלֵּה
  choice: Huwag mong ilantad
  rationale: Ang לֹא na may imperfect sa tekstong legal ay tuwirang pagbabawal. Likas at marangal sa makabagong Tagalog ang “Huwag mong…,” habang nananatili ang pandiwang larawan ng מקור.
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: iyon ay kahubaran ng kapatid mong lalaki
  rationale: Pinananatili ang pag-uulit ng עֶרְוָה at ang legal na pangangatwiran ng talata, nang hindi ito pinapalitan ng mas interpretatibong “pag-aari siya ng kapatid mo.”
theological_decisions:
- issue: Kung tahasang isasalin ang eupemistikong idyoma bilang pagbabawal sa pakikipagtalik
  choice: Panatilihin sa pangunahing teksto ang idyomang “ilantad ang kahubaran”
  alternative: Huwag kang makipagtalik sa asawa ng kapatid mong lalaki
  rationale: Gumagamit ang Hebreo ng nakaugaliang legal na eupemismo. Ang pagpapanatili nito ay mas malapit sa anyo ng pinagmulan, nagpapanatili ng pagkakatugma sa buong Levitico 18, at hindi tahimik na nilulutas ang lawak ng idyoma.
translation_notes:
  register: Makabago ngunit marangal na legal na pananalita. Ginamit ang “kapatid mong lalaki” para sa tiyak na אָחִיךָ, at pinanatili ang eupemistikong larawan at pag-uulit ng Hebreo.
