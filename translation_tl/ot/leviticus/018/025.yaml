  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּטְמָ֣א הָ/אָ֔רֶץ וָ/אֶפְקֹ֥ד עֲוֺנָ֖/הּ עָלֶ֑י/הָ וַ/תָּקִ֥א הָ/אָ֖רֶץ אֶת יֹשְׁבֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: tl
  text: Kaya naging marumi ang lupain[a], at pinarusahan ko ito dahil sa kasamaan nito[b]; isinuka[c] ng lupain ang mga naninirahan dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nadungisan.” Maaaring ipahayag ng pandiwang Hebreo na ang lupain ay naging marumi o na ito ay dinungisan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “dinalaw ko ang kasamaan nito sa ibabaw nito,” isang idyomang Hebreo para sa pagtutuos at pagpaparusa dahil sa kasalanan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ibinuga.” Pinananatili ng Hebreo ang matingkad na larawan ng pagsusuka upang ilarawan ang pagpapaalis ng lupain sa mga naninirahan dito dahil sa karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: naging marumi
  rationale: Ipinahahayag ng pandiwa na ang lupain ay napasailalim sa karumihan dahil sa mga karumal-dumal na gawa sa konteksto. Likas sa modernong Filipino ang “naging marumi,” habang iniiwan sa talababa ang maaaring pasibong diwa na “nadungisan.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng Levitico 18, tumutukoy ito sa tiyak na lupaing tinitirhan, hindi sa buong daigdig; kaya mas angkop ang “lupain.”
- source_word: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ
  choice: pinarusahan ko ito dahil sa kasamaan nito
  rationale: Ang idyomang Hebreo ay nagsasaad ng pagtutuos at pagpaparusa sa kasalanan. Nililinaw ng salin ang tuwirang pagkilos ng Diyos at natural ito sa Filipino nang hindi binabago ang moral na bigat ng pahayag.
- source_word: עֲוֺנָהּ
  choice: kasamaan nito
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutang bunga nito. Ang “kasamaan” ay malinaw at marangal na katumbas sa kontekstong ito.
- source_word: וַתָּקִא
  choice: isinuka
  rationale: Pinananatili nito ang tahasan at matinding larawang ginamit ng Hebreo, kung saan inilalarawang parang isang persona ang lupain na nagtataboy sa mga naninirahan dito.
- source_word: יֹשְׁבֶיהָ
  choice: mga naninirahan dito
  rationale: Tumpak nitong ipinahahayag ang kolektibong kahulugan ng mga taong nananahan sa lupain at natural itong basahin sa Filipino.
theological_decisions:
- issue: Ang lupain ay inilalarawang tumutugon sa karumihan na parang isang persona
  choice: Panatilihin ang larawang “isinuka ng lupain.”
  alternative: Pinalayas ng lupain ang mga naninirahan dito.
  rationale: Sadyang matindi ang personipikasyon sa Hebreo at iniuugnay nito ang kasalanan, karumihan, hatol ng Diyos, at pagpapaalis sa lupain. Ang pagpapalambot sa “pinalayas” ay mawawalan ng lakas ng orihinal na larawan.
- issue: Ang kahulugan ng וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ bilang hatol ng Diyos
  choice: Pinarusahan ko ito dahil sa kasamaan nito.
  alternative: Dinalaw ko ang kasamaan nito sa ibabaw nito; pinanagot ko ito sa kasamaan nito.
  rationale: Ang פקד kasama ng עון ay isang idyoma ng pagtutuos o pagpaparusa. Ipinakikita ng salin ang tuwirang pagkilos ng Diyos nang hindi ipinapalagay na ang lupain mismo ay may moral na kaloobang gaya ng tao.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lupain” sa halip na “lupa” o “daigdig” upang mapanatili ang heograpiko at tipanang konteksto. Ang semicolon ay nagpapakita ng malapit na ugnayan ng hatol ng Diyos at ng matinding larawang kasunod nito.
