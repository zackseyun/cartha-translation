base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng iyong kapatid na babae—anak man ng iyong ama o anak ng iyong ina, ipinanganak man sa sambahayan o sa labas nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinanganak sa bahay o ipinanganak sa labas.” Pinagtatapat sa Hebreo ang kapanganakan “sa bahay/sambahayan” at “sa labas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: ang kahubaran ng
  rationale: Sa Levitico 18, ang עֶרְוָה ay bahagi ng legal na idyomang tumutukoy sa seksuwal na kahubaran sa mga ipinagbabawal na ugnayan. Pinananatili ng “ilantad ang kahubaran” ang pormula at pahiwatig ng Hebreo nang hindi ito nililimitahan sa simpleng kahihiyan.
- source_word: אֲחוֹתְךָ
  choice: iyong kapatid na babae
  rationale: Tuwirang katawagan sa kamag-anak; nililinaw ng “kapatid na babae” ang kasarian na tahasang taglay ng salitang Hebreo.
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: anak man ng iyong ama o anak ng iyong ina
  rationale: Pinananatili ang magkatimbang at tiyak na pag-uuri sa Hebreo, at likas itong pakinggan sa makabagong Filipino.
- source_word: מוֹלֶדֶת
  choice: ipinanganak
  rationale: Malinaw at karaniwang katumbas ito ng anyong tumutukoy sa isang isinilang sa tinukoy na kalagayan o sambahayan.
- source_word: בַּיִת
  choice: sa sambahayan
  rationale: Sa pagtatambal nito sa “labas,” maaaring tumukoy ang בַּיִת sa saklaw ng tahanan o sambahayan, hindi lamang sa gusali. Ipinahihiwatig ito ng “sambahayan” habang inilalagay sa talababa ang mas literal na “bahay.”
- source_word: חוּץ
  choice: sa labas nito
  rationale: Ipinakikita nito ang tuwirang pagsalungat sa sambahayan at nililinaw ang kaugnayan ng “labas” sa naunang parirala.
- source_word: לֹא תְגַלֶּה
  choice: Huwag mong ilantad
  rationale: Ang “Huwag mong” ay natural ngunit marangal na anyo ng legal na pagbabawal sa Filipino; pinananatili ng “ilantad” ang idyoma ng Hebreo.
- source_word: אוֹ ... אוֹ
  choice: man ... o ... man ... o
  rationale: Ang magkatugmang “man ... o” ay natural na paraan sa Filipino upang mapanatili ang magkabilang alternatibong inililista ng Hebreo.
theological_decisions:
- issue: Saklaw ng ipinagbabawal na ugnayan
  choice: Saklaw ng pagbabawal ang kapatid na babae, anak man ng ama o ng ina, at ipinanganak man sa loob ng sambahayan o sa labas nito.
  alternative: Maaaring unawain ang mga huling pananalita bilang pagkilala sa mga kapatid na isinilang sa magkaibang kalagayan o lugar, kabilang ang buo o di-buong magkapatid, ngunit hindi nito binabago ang pangkalahatang pagbabawal.
  rationale: Ang pormulang legal sa Hebreo ay nagpapalawak at naglilinaw sa kategoryang “iyong kapatid na babae” sa halip na magtakda ng makitid na eksepsiyon. Hindi ipinapasok sa salin ang mas tiyak na mga pagkakaibang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang legal na tono sa “Huwag mong” at ang sadyang idyomatikong “ilantad ang kahubaran,” habang iniwasan ang mas tahasang pagpapakahulugang maaaring mag-alis sa pormal at teolohikal na tensiyon ng tekstong Hebreo.
