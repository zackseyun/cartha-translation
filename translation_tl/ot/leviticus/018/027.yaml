  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: tl
  text: Sapagkat ginawa ng mga taong nanirahan doon bago kayo ang lahat ng kasuklam-suklam na gawaing ito, at naging marumi ang lupain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nadungisan ang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang pagbabawal at babala.
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: ang lahat ng kasuklam-suklam na gawaing ito
  rationale: Pinananatili ang matinding moral at panrelihiyong bigat ng תּוֹעֵבָה, habang natural sa modernong Tagalog ang pariralang “kasuklam-suklam na gawain.”
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Tuwirang salin ng karaniwang pandiwang עשה, nang hindi dinaragdagan ng mas espesyalisadong legal o ritwal na diwa.
- source_word: אַנְשֵׁי הָאָרֶץ
  choice: mga taong nanirahan sa lupaing iyon
  rationale: Bagaman literal na “mga lalaki ng lupain,” kolektibo ang gamit ng parirala para sa mga dating naninirahan; ang “mga taong nanirahan” ay malinaw at natural sa Tagalog nang hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: bago kayo
  rationale: Natural at maikling paglalahad ng temporal na kahulugang sila ang naunang nanirahan doon.
- source_word: וַתִּטְמָא
  choice: kaya naging marumi
  rationale: Ipinahahayag ang naging bunga o kalagayan ng lupain dahil sa mga gawa, at pinananatili ang malawak na diwa ng karumihang maaaring ritwal at moral.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy sa tiyak na teritoryo sa konteksto, hindi sa buong daigdig.
theological_decisions:
- issue: Kalikasan ng karumihan ng lupain
  choice: naging marumi ang lupain
  alternative: nadungisan ang lupain
  rationale: Pinananatili ng “naging marumi” ang ugnayan ng kasalanan ng tao at karumihan ng lupain nang hindi nililimitahan iyon sa ritwal lamang o sa talinghaga lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa heograpikong teritoryo at ang “mga taong nanirahan” bilang natural na kolektibong katumbas ng idyomatikong Hebreong parirala.
