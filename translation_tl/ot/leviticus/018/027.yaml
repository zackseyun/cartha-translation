- from: Sapagkat ginawa ng mga taong nanirahan sa lupaing iyon bago kayo ang lahat ng kasuklam-suklam na gawaing ito, kaya naging marumi ang lupain.[a]
  to: Sapagkat ginawa ng mga taong nanirahan doon bago kayo ang lahat ng kasuklam-suklam na gawaing ito, at naging marumi ang lupain.[a]
  rationale: Pinalitan ang “kaya” ng “at” upang tumpak na maipakita ang payak na pang-ugnay ng Hebreo at maiwasang magdagdag ng antas ng lohikal na paghihinuha. Pinasimple rin ang lokatibong parirala sa “doon bago kayo” para sa mas malinaw at likas na modernong Filipino, nang hindi binabago ang kahulugan.
