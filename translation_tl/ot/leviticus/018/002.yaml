base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: tl
  text: “Magsalita ka sa mga anak na lalaki ni Israel[a] at sabihin mo sa kanila, ‘Ako si Yahweh[b] na inyong Diyos.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ni Israel” o “mga Israelita.” Literal sa Hebreo, “mga anak na lalaki ni Israel”; isa itong pampamilyang pahayag para sa bayang Israel bilang bayan ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Hebreo YHWH, na ayon sa kaugalian ay isinasaling “PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwirang pautos na nagpapakilala sa tagubilin ng Diyos kay Moises; natural at marangal sa modernong Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang pahayag ng tipan, habang likas na tumutukoy sa buong bayang Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Pinananatili ang pagpapatuloy ng utos at ang tuwirang himig ng Hebreo.
- source_word: אֲנִי
  choice: Ako si
  rationale: Ang malayang panghalip na Hebreo ay likas na isinasalin sa Filipino bilang pormula ng pagpapakilala na “Ako si” kapag sinusundan ng pangalang pantangi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ang אֱלֹהִים ay may isahang reperensiya rito kay Yahweh; ang hulaping ikalawang panauhang panlalaking maramihan ay kinakatawan ng “inyong.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na ipalit ang isang titulo.
- issue: Paglalahad sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita o mga supling ni Israel
  rationale: Pinananatili ang pampamilyang pahayag ng Hebreo at ang kaugnayan nito sa tipan, nang hindi ikinukubli na kolektibo nitong tinutukoy ang bayan.
translation_notes:
  register: Modernong Filipino na natural, tuwiran, at marangal. Pinanatili ang pampamilyang katawagan na “mga anak ni Israel” at ang banal na pangalang “Yahweh.” Ang mga panandang talababa ay inilagay pagkatapos ng pangungusap upang hindi putulin ang maikling pahayag.
