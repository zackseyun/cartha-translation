- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nagbubukas sa nilalaman ng kasunod na pahayag.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa personal na pangalan nang hindi ito ginagawang titulo.
- issue: Pormal na gamit ng לֵאמֹר
  choice: na sinasabi
  alternative: sinabi niya; ganito
  rationale: Hindi nilulutas o pinaiikli ang pormulang pananalita; inihahanda nitong tuwiran ang susunod na sinabi ni Yahweh.
translation_notes:
