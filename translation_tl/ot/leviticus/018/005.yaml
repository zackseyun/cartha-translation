base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: tl
  text: Kaya dapat ninyong sundin ang aking mga tuntunin at ang aking mga hatol. Ang sinumang tumutupad sa mga ito ay mabubuhay sa pamamagitan ng mga ito.[a] Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mabubuhay sa mga ito.” Maaaring mangahulugan ang pang-ukol sa Hebreo ng kasangkapan (“sa pamamagitan ng”) o ng saklaw o kalagayan (“sa”).
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kaya dapat ninyong sundin
  rationale: Ang anyong pandiwa na may pang-ugnay ay gumaganap bilang utos sa kontekstong legal. Likas sa modernong Tagalog ang “dapat ninyong sundin,” at ipinahihiwatig ng “kaya” ang kaugnayan nito sa naunang mga tagubilin.
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Tumutukoy ito sa mga itinakdang batas o atas. Ang “mga tuntunin” ay pormal ngunit madaling maunawaan at nananatiling naiiba sa kasunod na מִשְׁפָּטַי.
- source_word: מִשְׁפָּטַי
  choice: aking mga hatol
  rationale: Pinananatili ng “mga hatol” ang legal na diwa at ang leksikal na pagkakaiba nito sa “mga tuntunin,” sa halip na pagsamahin ang dalawang termino.
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם
  choice: Ang sinumang tumutupad sa mga ito
  rationale: Ang הָאָדָם ay isang isahang pananalitang kumakatawan sa sinumang tao, hindi lamang sa isang lalaking partikular. Ang “sinuman” ay natural sa Tagalog at malinaw na naihahayag ang pangkalahatang saklaw; ang “tumutupad” ay angkop sa paggawa o pagsasagawa ng mga batas.
- source_word: וָחַי
  choice: ay mabubuhay
  rationale: Tuwirang pinananatili nito ang pangakong buhay bilang bunga ng pagtupad, nang hindi tinutukoy kung ito ay pisikal, pangtipan, o walang hanggang buhay.
- source_word: בָּהֶם
  choice: sa pamamagitan ng mga ito
  rationale: Inihahayag nito ang posibleng instrumental na diwa ng pang-ukol ב. Ang alternatibong diwang saklaw o kalagayan na “sa mga ito” ay itinatala sa talababa upang mapanatili ang tunay na kalabuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalan ng Diyos, sa halip na palitan ng isang titulo.
theological_decisions:
- issue: Saklaw ng “mabubuhay sa pamamagitan ng mga ito”
  choice: Hindi tinukoy kung anong uri o saklaw ng buhay ang ipinangako.
  alternative: Ipaliwanag ito bilang mahabang buhay sa lupain, buhay sa tipan, o buhay na walang hanggan.
  rationale: Hindi tahasang nililinaw ng Hebreo ang eksaktong saklaw ng buhay. Pinananatili ng salin ang teolohikal na tensiyon sa halip na ipasok ang isang partikular na pagpapakahulugan.
- issue: Kinatawang gamit ng הָאָדָם
  choice: “Ang sinuman”
  alternative: “Ang tao” o “ang isang lalaki”
  rationale: Bagaman isahang panlalaki ang anyo sa Hebreo, kinatawan at pangkalahatan ang gamit nito rito. Sa Tagalog, malinaw at natural na ipinahahayag ng “sinuman” ang tunay na reperente nang hindi nililimitahan ang utos sa mga lalaki.
- issue: Kahulugan ng pang-ukol בָּהֶם
  choice: “sa pamamagitan ng mga ito” sa pangunahing teksto, na may alternatibo sa talababa
  alternative: “sa mga ito”
  rationale: Maaaring instrumental o tumukoy sa saklaw/kalagayan ang pang-ukol. Hindi dapat tuluyang alisin ng salin ang alinman sa dalawang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang maramihang “ninyo” ayon sa Hebreong maramihan, at pinanatili ang legal na pares na “mga tuntunin” at “mga hatol.”
