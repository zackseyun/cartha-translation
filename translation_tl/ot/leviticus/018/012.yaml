  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng kapatid na babae ng iyong ama[a]; siya ay kadugo ng iyong ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ilantad ang kahubaran” ay idyomang legal sa Levitico para sa ipinagbabawal na seksuwal na paglalantad o pakikipagtalik.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “siya ay laman ng iyong ama,” ibig sabihin, malapit niyang kamag-anak sa dugo.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Huwag mong ilantad ang kahubaran
  rationale: Pinananatili nito ang pormulang legal na Hebreo na “ilantad ang kahubaran,” sa halip na palawakin agad bilang “makipagtalik.” Nililinaw ng talababa ang kahulugan ng idyoma sa Levitico 18.
- source_word: אֲחוֹת אָבִיךָ
  choice: kapatid na babae ng iyong ama
  rationale: Tuwirang inilalahad ang ugnayang pampamilya at mas malapit sa anyo ng Hebreo kaysa sa “tiyahin mo.”
- source_word: שְׁאֵר אָבִיךָ
  choice: kadugo ng iyong ama
  rationale: Ang שְׁאֵר ay literal na kaugnay ng “laman,” ngunit sa kontekstong pampamilya ay tumutukoy sa malapit na kaanak sa dugo. Ang “kadugo” ay natural sa modernong Filipino habang pinananatili ang diin sa pagkakamag-anak.
- source_word: הִוא
  choice: siya ay
  rationale: Payak at likas na pagtukoy sa babae bilang kabilang sa ipinagbabawal na antas ng pagkakamag-anak.
theological_decisions:
- issue: Pagpapahayag sa idyoma ng batas tungkol sa ipinagbabawal na seksuwal na ugnayan
  choice: Panatilihin sa pangunahing teksto ang “ilantad ang kahubaran.”
  alternative: “makipagtalik sa” o “makipagtalik sa kapatid na babae ng iyong ama”
  rationale: Pormula ito ng tekstong Hebreo sa buong Levitico 18. Ang pagpapanatili sa idyoma ay nag-iingat sa pagkakaugnay ng kabanata at hindi nagpapasok sa pangunahing teksto ng paliwanag na mas tahasan kaysa sa mismong pananalita ng Hebreo.
- issue: Kahulugan ng שְׁאֵר sa pariralang שְׁאֵר אָבִיךָ
  choice: “kadugo ng iyong ama”
  alternative: “laman ng iyong ama” o “malapit na kamag-anak ng iyong ama”
  rationale: Pinananatili ng “kadugo” ang ideya ng ugnayang laman o dugo sa paraang natural at malinaw sa Filipino; inilalagay sa talababa ang higit na literal na anyo upang hindi mawala ang talinghaga ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang pormulang legal ng Hebreo, ngunit ginamit ang natural na “kadugo” sa pangunahing teksto; ang literal na “laman” ay nasa talababa.
