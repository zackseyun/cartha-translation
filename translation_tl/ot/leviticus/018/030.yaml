    rationale: Hindi ito natural na Filipino at hindi malinaw kung ang “ipinagkatiwala” ay naglalarawan sa Diyos o sa tungkuling iniatang sa bayan. Ang “aking tagubilin” ay payak, natural, at sapat na sumasaklaw sa מִשְׁמַרְתִּי bilang utos o pananagutang dapat ingatan.
  - severity: low
    issue: “na isinagawa bago kayo”
    rationale: Nananatiling bitin at maaaring magmukhang “bago kayo” lamang sa halip na “bago kayo dumating.” Ang pandiwang “dumating” ay nililinaw ang temporal na gamit ng לִפְנֵיכֶם sa konteksto.
