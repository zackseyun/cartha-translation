revisions:
- from: Kaya tuparin ninyo ang ipinagkatiwala kong tuntunin, upang hindi ninyo isagawa ang alinman sa kasuklam-suklam na mga kaugalian[a] na isinagawa bago kayo, at huwag ninyong dungisan ang inyong sarili sa pamamagitan ng mga iyon. Ako si Yahweh na inyong Diyos.
  to: Kaya sundin ninyo ang aking tagubilin, upang hindi ninyo isagawa ang alinman sa kasuklam-suklam na mga kaugalian[a] na isinagawa bago kayo dumating, at huwag ninyong dungisan ang inyong sarili sa pamamagitan ng mga iyon. Ako si Yahweh na inyong Diyos.
