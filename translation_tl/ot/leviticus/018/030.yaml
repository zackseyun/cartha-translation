  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: tl
  text: Kaya sundin ninyo ang aking tagubilin, upang hindi ninyo isagawa ang alinman sa kasuklam-suklam na mga kaugalian[a] na isinagawa bago kayo dumating, at huwag ninyong dungisan ang inyong sarili sa pamamagitan ng mga iyon. Ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasuklam-suklam na mga tuntunin” o “kasuklam-suklam na mga itinakdang gawain.” Ang salitang Hebreo ay maaaring tumukoy sa mga nakaugaliang gawain o sa mga gawaing itinakda, hindi lamang sa pormal na mga batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: tuparin ninyo
  rationale: Ang שׁמר ay nangangahulugang ingatan, sundin, o tuparin. Sa kontekstong legal at tipanan, natural na ipinahahayag ng “tuparin ninyo” ang mariing utos na sundin.
- source_word: מִשְׁמַרְתִּי
  choice: ang ipinagkatiwala kong tuntunin
  rationale: Ang מִשְׁמֶרֶת ay isang pananagutan o kautusang dapat ingatan. Pinananatili ng parirala ang diwa ng ipinagkatiwalang obligasyon nang mas malinaw kaysa sa literal ngunit hindi natural na “aking pagbabantay.”
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: upang hindi ninyo isagawa
  rationale: Ipinahahayag ng konstruksiyon ang layunin o pag-iwas. Ang “isagawa” ay angkop sa paulit-ulit o kinaugaliang mga gawain.
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: ang alinman sa kasuklam-suklam na mga kaugalian
  rationale: Ipinahihiwatig ng partitive מִן ang “alinman sa.” Maaaring tumukoy ang חֻקּוֹת sa itinakdang gawain o kaugalian, at inilalarawan ng תּוֹעֵבֹת ang mga iyon bilang lubhang kasuklam-suklam.
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: na isinagawa bago kayo
  rationale: 'Pinananatili ang balintiyak na anyo at ang temporal na diwa ng לִפְנֵיכֶם: ang mga gawaing umiiral at ginagawa bago dumating ang Israel.'
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: at huwag ninyong dungisan ang inyong sarili sa pamamagitan ng mga iyon
  rationale: Ipinakikita ng “ang inyong sarili” ang reflexive na puwersa ng pandiwa, habang pinananatili ng “sa pamamagitan ng” ang instrumental na gamit ng בָּהֶם.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ako si Yahweh na inyong Diyos
  rationale: Natural na pormula ito ng pagpapakilala sa modernong Filipino at tuwirang pinananatili ang pangalang tipanan na יְהוָה bilang Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Lakas ng moral at kultikong paghatol sa תּוֹעֵבֹת
  choice: kasuklam-suklam
  alternative: karima-rimarim; nakapandidiri
  rationale: Malakas ang paghatol ng salita ngunit hindi nito espesipikong nilulutas kung moral, kultiko, o kapuwa ang diin. Malawak at marangal ang “kasuklam-suklam” at pinananatili ang tensiyong iyon.
- issue: Saklaw ng חֻקּוֹת sa konteksto
  choice: mga kaugalian
  alternative: mga tuntunin; mga itinakdang gawain
  rationale: Ang tinutukoy ay mga gawaing isinasagawa ng mga naunang naninirahan, kaya natural ang “mga kaugalian.” Gayunman, maaaring magpahiwatig ang Hebreo ng mga itinakda o kinikilalang gawain; pinananatili sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang “ninyo/kayo” upang ipakita na buong bayan ang kinakausap. Iniwasan ang sobrang arkaikong bokabularyo, ngunit pinanatili ang legal at tipanang bigat ng utos.
