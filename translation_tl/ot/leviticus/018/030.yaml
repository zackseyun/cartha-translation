  source_fidelity: 'Tumpak ang pangkalahatang diwa at pagkakasunod ng Hebreo: ang utos na ingatan/sundin ang ipinag-uutos ng Diyos, ang layuning iwasan ang mga kasuklam-suklam na kaugalian, ang pagbabawal na dungisan ang sarili sa mga ito, at ang pangwakas na pagpapakilala ni Yahweh. Gayunman, ang “ipinagkatiwala kong tuntunin” ay hindi likas at bahagyang malabo bilang katumbas ng מִשְׁמַרְתִּי (“aking tagubilin/utos na dapat ingatan”). Ang “bago kayo” ay kailangan ding linawin bilang panahon bago dumating ang kausap sa lupain.'
  naturalness: Marangal at karaniwang nauunawaan ang rehistro. Mas natural ang “aking tagubilin” kaysa “ipinagkatiwala kong tuntunin,” at ang pagdaragdag ng “dumating” ay nag-aalis ng hindi likas na putol na pariralang “bago kayo.”
  terminology: Ang “Yahweh,” “Diyos,” “kasuklam-suklam,” at “dungisan ang inyong sarili” ay angkop at pinananatili ang covenantal, moral, at ritwal na bigat nang hindi nagdaragdag ng paliwanag na wala sa teksto. Ang “mga kaugalian” ay isang katanggap-tanggap na pangunahing salin ng חֻקּוֹת sa kontekstong ito; pinananatili ng talababa ang iba pang leksikal na posibilidad.
