  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: tl
  text: upang hindi kayo isuka ng lupain kapag dinudungisan ninyo ito,[a] gaya ng isinuka nito ang bansang nauna sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “kapag ginagawa ninyo itong marumi.” Gumagamit ang Hebreo ng matinding larawan ng lupain na sumusuka sa mga naninirahan dito dahil sa pagkadungis.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: isuka / pagsuka
  rationale: Pinananatili ng “isuka” ang mariin at tahasang larawan ng Hebreo tungkol sa lupain na nagtataboy sa mga naninirahan dito; mas tapat ito kaysa sa mas mahinang “itaboy.”
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ang konteksto sa lupain ng Canaan, hindi sa buong daigdig. Likas din sa Filipino ang “lupain” para sa isang tiyak na teritoryo.
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: kapag dinudungisan ninyo ito
  rationale: Maaaring temporal o instrumental ang בְּ na may infinitive construct. Ang “kapag” ay natural na naghahatid ng babala, at ang “dinudungisan” ay nagpapanatili sa aktibong diwa ng pagpaparumi sa lupain.
- source_word: הַגּוֹי
  choice: ang bansa
  rationale: Ang singular collective na גּוֹי ay tumutukoy sa naunang pangkat ng mga naninirahan. Pinananatili ng “bansa” ang anyong isahan nang hindi nagdaragdag ng mas huling kahulugang teolohikal ng “Hentil.”
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: na nauna sa inyo
  rationale: Malinaw nitong ipinahahayag na ang tinutukoy ay ang bansang dating nanirahan sa lupain bago ang Israel.
- source_word: וְלֹא
  choice: upang hindi
  rationale: Bagaman literal na “at hindi,” gumaganap ito rito bilang negatibong layunin o bunga kaugnay ng naunang babala. Natural sa makabagong Filipino ang “upang hindi.”
theological_decisions:
- issue: Pagbibigay-katauhan sa lupain bilang tagaganap ng paghatol
  choice: Pinanatili ang lupain bilang simuno na “sumusuka” sa mga naninirahan dito.
  alternative: Gawing tahasan na ang Diyos ang nagpapalayas sa kanila sa pamamagitan ng lupain.
  rationale: Ang Hebreo mismo ang nagbibigay-katauhan sa lupain bilang tumutugon sa pagkadungis. Pinananatili nito ang teolohikal na tensiyon at larawan sa Levitico nang hindi ipinapalit ang isang mas paliwanag ngunit hindi tahasang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matinding metapora ng Hebreo; ginamit ang “dinudungisan” bilang madaling maunawaang salitang angkop sa ritwal at moral na konteksto. Ang kuwit ay inilagay pagkatapos ng marker upang malinaw na nakaugnay ang talababa sa pariralang “ito.”
