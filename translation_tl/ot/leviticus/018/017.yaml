source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng isang babae at ng anak niyang babae.[a] Huwag mong kunin[b] ang anak na babae ng anak niyang lalaki o ang anak na babae ng anak niyang babae upang ilantad ang kahubaran niya; malalapit niyang kamag-anak sila.[c] Isa itong kahalayan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “ilantad ang kahubaran” ay idyomang Hebreo na tumutukoy sa ipinagbabawal na pakikipagtalik.
    reason: cultural_note
  - marker: b
    text: Ang “kunin” ay maaaring magpahiwatig ng pagkuha bilang asawa o sa seksuwal na pagsasama.
    reason: lexical_alternative
  - marker: c
    text: Sa mas literal na salin, “sila ay kaniyang laman,” ibig sabihin, mga kadugo o malalapit na kamag-anak niya.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring isalin na “matinding kasamaan,” “kalaswaan,” o “karumal-dumal na gawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה / לְגַלּוֹת עֶרְוָתָהּ
  choice: ilantad ang kahubaran ... upang ilantad ang kahubaran niya
  rationale: Pinananatili ang paulit-ulit na legal na idyoma ng Levitico at ang ugnayan ng dalawang parirala. Ipinaliliwanag sa talababa na tumutukoy ito sa ipinagbabawal na pakikipagtalik.
- source_word: אִשָּׁה
  choice: isang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang salita, ngunit mas malawak at mas ligtas dito ang “babae,” sapagkat ang batas ay hindi tahasang nakabatay sa pormal na pag-aasawa.
- source_word: וּבִתָּהּ
  choice: at ng anak niyang babae
  rationale: Likas na modernong Tagalog para sa tuwirang ugnayang pagmamay-ari sa Hebreo.
- source_word: תִקַּח
  choice: kunin
  rationale: Pinananatili ang lawak ng pandiwang Hebreo, na maaaring magpahiwatig ng pagkuha bilang asawa o sa seksuwal na pagsasama; hindi ito nililimitahan sa pormal na pag-aasawa.
- source_word: בַּת בְּנָהּ
  choice: ang anak na babae ng kanyang anak na lalaki
  rationale: Tuwirang pinananatili ang tiyak na linya ng pagkakamag-anak sa pamamagitan ng anak na lalaki.
- source_word: בַּת בִּתָּהּ
  choice: ang anak na babae ng kanyang anak na babae
  rationale: Tuwirang pinananatili ang tiyak na linya ng pagkakamag-anak sa pamamagitan ng anak na babae.
- source_word: שַׁאֲרָה הֵנָּה
  choice: mga malapit niya silang kamag-anak
  rationale: Ipinahahayag sa natural at malinaw na paraan ang kahulugan ng pagkakadugo o malapit na pagkakamag-anak, habang inilalagay sa talababa ang mas literal na “laman niya.”
- source_word: זִמָּה
  choice: kahalayan
  rationale: Ang salita ay tumutukoy sa isang matinding kasamaan, lalo na sa mahalay o seksuwal na gawa. Ang “kahalayan” ay maikli, marangal, at angkop sa konteksto, habang kinikilala sa talababa ang iba pang posibleng diin.
theological_decisions:
- issue: Tinutukoy ng pang-isahang hulaping pambabae sa “upang ilantad ang kahubaran niya”
  choice: Pinanatili ang panghalip na “niya” nang hindi tahasang tinutukoy kung sino ang tinutukoy nito.
  alternative: Tukuyin itong tahasan bilang orihinal na babae, anupat ang pakikipagtalik sa apo niya ay itinuturing ding paglalantad ng kahubaran ng babae; maaari rin itong unawain na tumutukoy sa bawat babaeng inapo.
  rationale: Ang di-tiyak na panghalip ay tapat sa anyong Hebreo at hindi sapilitang nilulutas ang tunay na usapin sa reperensiya.
- issue: Saklaw ng “kunin” sa batas na ito
  choice: Panatilihin ang mas malawak na “kunin.”
  alternative: “pakasalan” o “kunin bilang asawa”
  rationale: Hindi dapat paliitin ang pagbabawal sa pormal na kasal lamang; nililinaw ng kasunod na parirala na seksuwal na paglabag ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong pambatas. Pinanatili ang natatanging idyomang Levitico ngunit nilinaw ito sa talababa; iniwasan ang salitang teknikal at ang anumang denominasyonal na pagpapakahulugan.
