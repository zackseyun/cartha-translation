  to: Huwag mong ilantad ang kahubaran ng isang babae at ng anak niyang babae.[a] Huwag mong kunin[b] ang anak na babae ng anak niyang lalaki o ang anak na babae ng anak niyang babae upang ilantad ang kahubaran niya; malalapit niyang kamag-anak sila.[c] Isa itong kahalayan.[d]
