  naturalness: 'May isang kapansin-pansing suliranin sa ayos ng salita: “mga malapit niya silang kamag-anak” ay hindi natural na Tagalog. Ang “Malalapit niyang kamag-anak sila” ay malinaw, marangal, at pinananatili ang diin ng Hebreo na sila ay kaniyang malapit na kadugo.'
