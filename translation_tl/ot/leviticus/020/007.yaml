  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: tl
  text: Italaga ninyo ang inyong mga sarili[a] at maging banal, sapagkat ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Magpakabanal kayo” o “Gawin ninyong banal ang inyong mga sarili.” Reflexive ang pandiwang Hebreo at nananawagan sa Israel na aktibong italaga ang kanilang mga sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: Italaga ninyo ang inyong sarili
  rationale: Ang Hitpael na anyong pautos ng קדשׁ ay may aktibo at reflexive na diwa. Pinananatili ng pariralang ito ang panawagan sa Israel na kusang italaga ang kanilang sarili, at hindi nito inuulit lamang ang kasunod na “maging banal.”
- source_word: וִהְיִיתֶם
  choice: at maging
  rationale: Ang anyo ng היה kasunod ng unang utos ay natural na gumaganap bilang ikalawang utos sa magkaugnay na pagkakasunod.
- source_word: קְדֹשִׁים
  choice: banal
  rationale: Ang “banal” ang likas at mabigat na salin sa kontekstong tipan at etikal ng Levitico; hindi sapat na saklaw ng “ibinukod” ang moral at teolohikal na diwa nito.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng utos. Ang “sapagkat” ay dignified at malinaw sa modernong Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang יהוה sa halip na palitan iyon ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman plural ang anyong morpolohikal ng אֱלֹהִים, tumutukoy ito rito sa iisang Diyos ng Israel; ang hulaping pangmaramihang ikalawang panauhan ay ipinahayag sa “inyong.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng pagtatalaga sa sarili at pagiging banal
  choice: 'Dalawang magkakaugnay ngunit hindi pinag-isang utos: “Italaga ninyo ang inyong sarili at maging banal”'
  alternative: “Pabanalin ninyo ang inyong sarili” lamang
  rationale: Magkaiba ang וְהִתְקַדִּשְׁתֶּם at וִהְיִיתֶם קְדֹשִׁים. Pinananatili ng salin kapwa ang aktibong reflexive na pagtatalaga at ang kasunod na utos na maging banal, nang hindi nilulutas ang teolohikal na tensiyon sa pagitan ng pagkilos ng bayan at kabanalang nakaugat kay Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ninyo/inyong” dahil maramihan ang kausap. Ang “Italaga ninyo ang inyong sarili” ay natural kaysa teknikal na “ikonsagra,” habang pinananatili ang reflexive na puwersa ng Hebreo.
