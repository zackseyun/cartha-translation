  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: tl
  text: Sapagkat ang sinumang lalaki[a] na sumusumpa laban sa kanyang ama o sa kanyang ina[b] ay walang pagsalang papatayin. Isinumpa niya ang kanyang ama at ang kanyang ina; ang kanyang dugo ay nasa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “isang lalaki, isang lalaki,” isang idyomang nangangahulugang “sinumang lalaki” o “sinuman.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang kanyang ama at ang kanyang ina.” Ginamit dito ang “o” upang ipakitang ang pagsumpa laban sa alinmang magulang ay saklaw ng hatol.
    reason: lexical_alternative
  - marker: c
    text: O “nasa kanya ang pananagutan sa sarili niyang kamatayan.” Ang idyomang Hebreo ay nagsasabing siya mismo ang may pananagutan sa kanyang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang kasong legal bilang paliwanag o batayan ng kasunod na hatol, gaya ng gamit ng כִּי sa daloy ng talata.
- source_word: אִישׁ אִישׁ
  choice: ang sinumang lalaki
  rationale: Ang pag-uulit ng אִישׁ ay isang distributibong idyoma na nangangahulugang sinumang kabilang sa tinutukoy na pangkat. Pinananatili ng “lalaki” ang anyong panlalaki ng Hebreo, habang ipinahahayag ng “sinuman” ang distributibong diwa.
- source_word: יְקַלֵּל
  choice: sumusumpa
  rationale: Ang piel ng קלל ay tumutukoy rito sa pagsasalita ng sumpa laban sa magulang, hindi lamang sa pangkalahatang kawalang-galang.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: sa kanyang ama o sa kanyang ina
  rationale: Bagaman “at” ang karaniwang katumbas ng ו, “o” ang likas na anyong legal sa Filipino upang ipakitang sapat ang pagsumpa sa alinman sa dalawang magulang upang mapasailalim sa hatol.
- source_word: מוֹת יוּמָת
  choice: ay walang pagsalang papatayin
  rationale: Inihahatid nito ang mariing puwersa ng infinitive absolute na sinusundan ng finite passive verb, at pinananatili ang diwang hudisyal at pasibo.
- source_word: קִלֵּל
  choice: Isinumpa niya
  rationale: Ang perfect verb ay naglalahad ng naganap na kasalanang batayan ng kaparusahang binanggit.
- source_word: דָּמָיו בּוֹ
  choice: ang kanyang dugo ay nasa kanya
  rationale: Pinananatili ang maigsi at matalinghagang pormulang legal ng Hebreo; nililinaw sa talababa na siya mismo ang may pananagutan sa sarili niyang kamatayan.
theological_decisions:
- issue: Ang saklaw ng panlalaking distributibong pahayag na אִישׁ אִישׁ
  choice: sinumang lalaki
  alternative: sinumang tao / sinuman
  rationale: Pinananatili sa pangunahing teksto ang panlalaking anyo ng pinagmulan nang hindi ipinapalagay na ang tuntunin ay may pribadong doktrinal na limitasyon; ang talababa ang nagpapakita ng idyomatikong distributibong kahulugan.
- issue: Ang legal na bisa ng ו sa pares na “ama at ina”
  choice: ama o ina sa paglalahad ng kaso; ama at ina sa buod ng kasalanan
  alternative: ama at ina sa dalawang paglitaw
  rationale: Ipinakikita ng “o” na ang pagsumpa sa alinmang magulang ay saklaw ng hatol, samantalang pinananatili ng ikalawang “at” ang anyo ng Hebreo sa pagbubuod. Hindi nito ipinahihiwatig na kailangang sumpain ang parehong magulang.
- issue: Ang pormulang דָּמָיו בּוֹ
  choice: ang kanyang dugo ay nasa kanya
  alternative: nasa kanya ang pananagutan sa sarili niyang kamatayan / nasa kanya ang kanyang pagkakasala sa dugo
  rationale: Pinananatili ang tunay na talinghaga at juridikal na diin ng teksto, habang ang talababa ay nagpapaliwanag sa pananagutan nang hindi nagdaragdag ng doktrina tungkol sa pagtubos o metafisikal na pagkakasala.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “walang pagsalang papatayin” ay sadyang mariin upang tumbasan ang Hebreong emphatic construction. Pinanatili sa pangunahing teksto ang matalinghagang pormulang “ang kanyang dugo ay nasa kanya,” at inilagay sa talababa ang malinaw na kahulugang legal nito.
