base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: tl
  text: Huwag kayong mamuhay ayon sa mga tuntunin[a] ng bansang itinataboy ko mula sa harap ninyo[b], sapagkat ginawa nila ang lahat ng ito, at nasuklam ako sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kaugalian”; ang salitang Hebreo ay maaaring tumukoy sa mga itinakdang gawain o mga nakapirming ordinansa.
    reason: lexical_alternative
  - marker: b
    text: Literal na “pinapaalis ko mula sa harap ninyo”; sa kontekstong ito, ang diwa ay sapilitang pagpapaalis o pagtataboy.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kinasuklaman ko sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: mamuhay
  rationale: Literal itong “lumakad,” ngunit kasama ng בְּחֻקֹּת ay tumutukoy sa paraan ng pamumuhay o paggawi. Ang “mamuhay ayon sa” ay natural sa modernong Tagalog at malinaw na naghahatid ng etikal na diwa ng idyoma.
- source_word: בְּחֻקֹּת
  choice: ayon sa mga tuntunin
  rationale: Ang חֻקּוֹת ay maaaring tumukoy sa mga itinakdang tuntunin, nakaugaliang gawain, o ordinansa. Pinananatili ng “mga tuntunin” ang lakas nitong legal at etikal, habang ang talababa ay nagpapakita ng posibleng diwang “mga kaugalian.”
- source_word: הַגּוֹי
  choice: ng bansa
  rationale: Isahan ang גּוֹי at kolektibong tumutukoy sa bayang paaalisin sa lupain. Ang “bansa” ay tuwirang salin at hindi nagdadala ng mas huling teknikal na diwa ng “mga Hentil.”
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: itinataboy ko mula sa harap ninyo
  rationale: Bagaman karaniwang “ipinapadala” ang שׁלח, sa pariralang ito ay nangangahulugan itong sapilitang pagpapaalis. Pinananatili ng “mula sa harap ninyo” ang Hebreong larawan ng pag-aalis mula sa kanilang harapan o presensiya.
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: sapagkat ginawa nila ang lahat ng ito
  rationale: Causal ang כִּי, at ang “lahat ng ito” ay tumutukoy pabalik sa mga ipinagbabawal na gawain sa konteksto.
- source_word: וָאָקֻץ בָּם
  choice: at kinasuklaman ko sila
  rationale: Naghahayag ang קוץ ng matinding pagkasuklam o pagkamuhi. Malakas ngunit likas sa Tagalog ang “kinasuklaman,” at ang “sila” ay nagpapanatili sa mga taong tinutukoy bilang layon ng pagkasuklam.
theological_decisions:
- issue: Paglalarawan sa matinding banal na pagkasuklam
  choice: at kinasuklaman ko sila
  alternative: at lubha akong nasuklam sa kanila
  rationale: Pinananatili nito ang matinding moral na pagtutol na ipinahahayag ng Hebreo nang hindi ito pinahihina bilang simpleng di-pagsang-ayon o pinalalawak bilang isang doktrinang wala sa talata.
- issue: Layon ng pagkasuklam sa pangwakas na parirala
  choice: sila
  alternative: ang mga iyon
  rationale: Ang בָּם ay panlalaking maramihan at likas na tumutukoy sa mga taong kabilang sa bansang kolektibong binanggit, bagaman malapit ding nasa konteksto ang kanilang mga gawain. Ang “sila” ay sumusunod sa gramatikal na pahiwatig nang hindi ipinagpapalit ang paghatol sa mga gawain at sa mga gumagawa ng mga iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamuhay ayon sa” upang natural na maipahayag ang Hebreong idyomang “lumakad sa,” habang pinanatili ang lakas ng “mga tuntunin,” “itinataboy,” at “kinasuklaman.”
