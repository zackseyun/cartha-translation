  terminology: Ang “sumiping,” “karumal-dumal na bagay,” at “papatayin sila” ay angkop sa pormal ngunit modernong rehistro. Dahil walang likas at di-piliting paraan upang panatilihin sa pangunahing teksto ang leksikal na pagkakaiba ng אִישׁ at זָכָר, sapat na itala ito nang malinaw sa talababa nang hindi binabago ang saklaw ng teksto tungo sa identidad.
