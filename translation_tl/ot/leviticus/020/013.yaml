base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: tl
  text: Kung ang isang lalaki ay sumiping sa isang lalaki gaya ng pagsiping sa isang babae[a], silang dalawa ay gumawa ng karumal-dumal na bagay. Tiyak na papatayin sila; ang kanilang dugo ay nasa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga paghiga ng babae,” isang idyoma para sa pakikipagtalik sa babae. Ang ikalawang terminong isinaling “lalaki” ay זָכָר (“male”), na naiiba sa unang אִישׁ (“man”).
    reason: lexical_alternative
  - marker: b
    text: O “nasa kanila ang pananagutan sa kanilang dugo,” ibig sabihin, sila ang may pananagutan sa kanilang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Kung ang isang lalaki ay
  rationale: Sa pormulang legal, ang parirala ay may kondisyunal na diwa. Ang “Kung ang isang lalaki ay” ay natural sa modernong Filipino at pinananatili ang אִישׁ bilang “lalaki.”
- source_word: יִשְׁכַּב אֶת
  choice: sumiping sa
  rationale: Ang שׁכב sa kontekstong ito ay idyoma para sa pakikipagtalik. Ang “sumiping sa” ay dignified, malinaw sa konteksto, at malapit sa larawang “humiga kasama.”
- source_word: זָכָר
  choice: isang lalaking
  rationale: Ang זָכָר ay “male,” naiiba sa אִישׁ. Bagaman kapwa karaniwang naipapahayag na “lalaki” sa Filipino, ang anyong “isang lalaking” ay natural at hindi nagdaragdag ng makabagong kategoryang identidad.
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: gaya ng pagsiping sa isang babae
  rationale: Ang literal na “mga paghiga ng isang babae” ay hindi natural sa Filipino. Ipinahahayag ng salin ang idyomatikong diwa ng pakikipagtalik sa babae habang inilalapit sa anyo ng Hebreo.
- source_word: תּוֹעֵבָה
  choice: karumal-dumal na bagay
  rationale: Ang תּוֹעֵבָה ay mabigat na terminong moral at tipan. Ang “karumal-dumal na bagay” ay natural at matindi sa Filipino nang hindi nag-aangkat ng dagdag na paliwanag.
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: silang dalawa ay gumawa
  rationale: Pinananatili nito ang tahasang pagbibigay-diin ng Hebreo na kapwa sangkot ang dalawa.
- source_word: מוֹת יוּמָתוּ
  choice: Tiyak na papatayin sila
  rationale: Ang infinitive absolute na kasunod ng pasibong pandiwa ay nagbibigay-diin sa katiyakan ng parusa. Pinananatili ng “Tiyak” ang diin at ng “papatayin” ang pasibong diwa.
- source_word: דְּמֵיהֶם בָּם
  choice: nasa kanila ang sarili nilang dugo
  rationale: Pinananatili ang konkretong idyoma ng Hebreo na nag-aatang sa kanila ng pananagutan sa kanilang kamatayan, sa halip na agad itong gawing abstraktong “pagkakasala sa dugo.”
theological_decisions:
- issue: Paglalahad ng isang pinagtatalunang kautusang legal nang hindi pinapalambot o pinalalawak
  choice: Isinalin ang tiyak na gawa ayon sa legal na pananalita ng Hebreo, kasama ang nakasaad na hatol.
  alternative: Gumamit ng mas malawak na makabagong katawagang tumutukoy sa oryentasyon o identidad.
  rationale: Isang partikular na gawa ang inilalarawan ng teksto, hindi isang makabagong kategorya ng identidad; kaya hindi dinagdagan o nilimitahan ang saklaw sa pamamagitan ng ganitong terminolohiya.
- issue: Pagpapanatili sa pagkakaiba ng אִישׁ at זָכָר
  choice: Ginamit ang “isang lalaki” at “isang lalaking,” na may talababa upang ipakitang “lalaki/male” ang ikalawang termino.
  alternative: Gamitin ang parehong anyong “lalaki” nang walang paliwanag, o gumamit ng di-natural na “isang taong lalaki.”
  rationale: Walang ganap na natural na magkaibang pares sa Filipino na eksaktong katumbas ng “man/male.” Pinananatili sa pangunahing teksto ang natural na Filipino at itinatala sa talababa ang leksikal na pagkakaiba.
- issue: Kahulugan ng דְּמֵיהֶם בָּם
  choice: Pinanatili ang idyomang “nasa kanila ang sarili nilang dugo.”
  alternative: “Nasa kanila ang pananagutan sa kanilang dugo/kamatayan.”
  rationale: Ang literal na idyoma ay maaaring tumukoy sa dugo at sa pananagutan sa kamatayan. Ang pangunahing salin ay nagpapanatili sa tayutay, habang ipinapaliwanag ng talababa ang legal na diwa nang hindi isinasara ang lahat ng nuance.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sumiping” bilang pormal ngunit buhay na idyoma para sa seksuwal na pakikipagtalik. Iniwasan ang makabagong identity-based terminology at pinanatili ang anyong legal at matinding tono ng Hebreo.
