revisions:
- from: Kung kukunin ng isang lalaki ang kanyang kapatid na babae[a]—anak ng kanyang ama o anak ng kanyang ina—at makita niya ang kahubaran nito, at makita rin nito ang kanyang kahubaran, kahiya-hiya iyon. Ihihiwalay silang dalawa sa harap ng kanilang mga kababayan.[b] Inilantad ng lalaki ang kahubaran ng kanyang kapatid na babae; pananagutan niya ang kanyang kasalanan.
  to: Kung ang isang lalaki ay kumuha ng kanyang kapatid na babae[a]—anak ng kanyang ama o anak ng kanyang ina—at makita niya ang kahubaran ng kanyang kapatid na babae, at makita rin ng kanyang kapatid na babae ang kahubaran niya, kahiya-hiya iyon. Aalisin silang dalawa sa paningin ng kanilang mga kababayan.[b] Inilantad niya ang kahubaran ng kanyang kapatid na babae; pananagutan niya ang kanyang kasalanan.
  rationale: Inayos ang ayos ng pangungusap at mga panghalip para sa malinaw at natural na Filipino. Pinalitan ang “ihihiwalay” ng “aalisin” upang hindi magpahiwatig na ang lalaki at babae ay paghihiwalayin lamang sa isa’t isa at upang mapanatili ang kalabuan ng Hebreong legal na pormula. Pinanatili ang lahat ng mahalagang idyoma at ang mga talababa.
