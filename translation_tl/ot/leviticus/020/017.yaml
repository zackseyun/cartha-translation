language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: tl
  text: Kung ang isang lalaki ay kumuha ng kanyang kapatid na babae[a]—anak ng kanyang ama o anak ng kanyang ina—at makita niya ang kahubaran ng kanyang kapatid na babae, at makita rin ng kanyang kapatid na babae ang kahubaran niya, kahiya-hiya iyon. Aalisin silang dalawa sa paningin ng kanilang mga kababayan.[b] Inilantad niya ang kahubaran ng kanyang kapatid na babae; pananagutan niya ang kanyang kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kapatid na babae” rito ay nililinaw bilang anak ng kanyang ama o anak ng kanyang ina; kabilang dito ang kapatid sa ama o sa ina.
    reason: clarification
  - marker: b
    text: Ang “aalisin” ay salin ng legal na pormula sa Hebreo na literal na “puputulin.” Hindi nito tahasang tinutukoy kung kamatayan, pagpapatalsik, o ibang uri ng pag-aalis ang parusa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking pang-isahan ng legal na pormulasyon sa Hebreo.
- source_word: יִקַּח
  choice: kukunin
  rationale: Ang literal na diwang “kunin” ay nagpapanatili ng hindi tiyak na saklaw ng pandiwa, na maaaring tumukoy sa pagkuha bilang asawa o sa seksuwal na pag-angkin; hindi ito nililimitahan nang higit sa pinagmulan.
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: ang kanyang kapatid na babae—anak ng kanyang ama o anak ng kanyang ina
  rationale: Malinaw na isinasama kapwa ang kapatid sa ama at ang kapatid sa ina, habang pinananatili ang paliwanag na kasunod ng “kapatid na babae.”
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: at makita niya ang kahubaran nito, at makita rin nito ang kanyang kahubaran
  rationale: Pinananatili ang larawang “makita ang kahubaran,” isang legal na idyoma para sa seksuwal na paglalantad o pakikipagtalik, nang hindi ito tahasang nilulutas.
- source_word: חֶסֶד
  choice: kahiya-hiya iyon
  rationale: Sa pambihirang negatibong gamit nito rito, tumutukoy ang salita sa isang kahiya-hiya o kasuklam-suklam na gawa, hindi sa karaniwan nitong positibong kahulugang kabutihan o tapat na pag-ibig.
- source_word: וְנִכְרְתוּ
  choice: ihihiwalay silang dalawa
  rationale: Nagbibigay ito ng natural na Filipino para sa legal na pormulang “puputulin/aalisin,” ngunit hindi tinutukoy kung ang parusa ay kamatayan, pagpapatalsik, o ibang uri ng pag-aalis.
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: sa harap ng kanilang mga kababayan
  rationale: Natural na katumbas ng “sa paningin ng mga anak ng kanilang bayan,” na pinananatili ang pampublikong dimensiyon ng hatol.
- source_word: גִּלָּה
  choice: inilantad
  rationale: Pinananatili ang idyoma ng paglalantad ng kahubaran na ginagamit sa mga batas tungkol sa ipinagbabawal na seksuwal na ugnayan.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: pananagutan niya ang kanyang kasalanan
  rationale: Ipinahahayag ang pagdadala ng sala at ng mga bunga nito nang hindi ginagawang parusa lamang ang kahulugan.
theological_decisions:
- issue: Kahulugan ng חֶסֶד sa talatang ito
  choice: 'negatibong diwa: “kahiya-hiya”'
  alternative: 'karaniwang positibong diwa: “kabutihan” o “tapat na pag-ibig”'
  rationale: Hinihingi ng konteksto ng pagbabawal at hatol ang pambihirang negatibong diwa; ang positibong salin ay sasalungat sa malinaw na takbo ng talata.
- issue: Eksaktong bisa ng parusang וְנִכְרְתוּ
  choice: “ihihiwalay” nang hindi tinutukoy ang paraan
  alternative: papatayin, ititiwalag, o aalisan ng lahi
  rationale: Hindi mismo nililinaw ng pormulang Hebreo rito ang mekanismo ng pag-aalis, kaya pinananatili ang tunay na kalabuan.
- issue: Diwa ng “makita ang kahubaran”
  choice: panatilihin ang legal na larawang seksuwal sa halip na tahasang sabihing “makipagtalik”
  alternative: tahasang seksuwal na pakikipagtalik
  rationale: Malinaw ang seksuwal na konteksto, ngunit ang tekstong Hebreo ay gumagamit ng idyomang “makita ang kahubaran”; ang salin ay hindi dapat magpakitid nang higit sa teksto.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang legal at seksuwal na mga idyoma kung mahalaga ang kanilang kalabuan, habang iniwasan ang sobrang literal na mga pariralang hindi natural sa Tagalog. Ang panghalip na “nito” ay ginamit upang mabawasan ang kalituhan sa magkasalungat na “kanyang,” at ang “silang dalawa” ay tahasang nagpapanatili sa maramihang hatol.
