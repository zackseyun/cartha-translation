base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: tl
  text: Kung ang isang lalaki ay kumuha ng isang babae at ng ina nito,[a] iyon ay isang karumal-dumal na gawain.[b] Susunugin nila sa apoy ang lalaki at ang dalawang babae.[c] Upang walang maging karumal-dumal na gawain sa gitna ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-asawa ng isang babae at ng ina nito.” Maaaring magpahiwatig ng pag-aasawa ang Hebreong pandiwa para sa “kumuha” sa mga legal na konteksto, ngunit hindi ito tahasang tinukoy rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang terminong Hebreo bilang “kahalayan,” “kabuktutan,” o “isang kasuklam-suklam na paglabag.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “siya at sila”; pambabaeng maramihan ang “sila” at tumutukoy sa babae at sa ina nito.
    reason: referent_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na panlalaking pangngalang isahan ang Hebreo at tumutukoy sa lalaking sangkot sa paglabag.
- source_word: יִקַּח
  choice: kumuha
  rationale: Pinananatili nito ang malawak na diwa ng pandiwang Hebreo. Maaari itong tumukoy sa pag-aasawa sa ganitong legal na konteksto, ngunit hindi tahasang binanggit sa talata ang pag-aasawa.
- source_word: אִשָּׁה
  choice: isang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang salita. Ang “babae” ang hindi gaanong nagpapasok ng tiyak na katayuang pangmag-asawa na hindi tahasang sinabi ng teksto.
- source_word: אִמָּהּ
  choice: ina nito
  rationale: Likas sa modernong Filipino ang “nito” bilang pagtukoy sa babaeng kababanggit lamang, at malinaw nitong iniuugnay sa kanya ang ina.
- source_word: זִמָּה
  choice: karumal-dumal na gawain
  rationale: Sa mga batas seksuwal ng Levitico, tumutukoy ito sa isang napakabigat at kasuklam-suklam na paglabag. Malinaw at dignificado sa Filipino ang pariralang ito, nang hindi nililimitahan ang salita sa isa lamang sa mga posibleng kahulugang gaya ng kahalayan o kabuktutan.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Natural itong Filipino para sa apoy bilang paraan ng pagsunog, habang malapit sa anyo at diwa ng Hebreo.
- source_word: יִשְׂרְפוּ אֹתוֹ וְאֶתְהֶן
  choice: Susunugin nila sa apoy ang lalaki at ang dalawang babae
  rationale: Pinananatili ang aktibong pandiwang maramihan ng Hebreo. Ang pambabaeng maramihang panghalip ay nilinaw bilang ang babae at ang kanyang ina.
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: Sa gayon, walang karumal-dumal na gawain sa gitna ninyo
  rationale: Ipinahahayag ng “Sa gayon” ang layunin o kinalabasan ng kaparusahan; ang “sa gitna ninyo” ay malapit at natural na salin ng pariralang Hebreo.
theological_decisions:
- issue: Uri ng ugnayang ipinahihiwatig ng “kumuha ng isang babae at ng ina nito”
  choice: Panatilihin sa pangunahing teksto ang mas malawak na “kumuha” sa halip na tahasang sabihing “nag-asawa.”
  alternative: “nag-asawa ng isang babae at ng ina nito” o “kinuha bilang asawa ang isang babae at ang ina nito”
  rationale: Maaaring magpahiwatig ng pag-aasawa ang pandiwang לקח sa legal na konteksto, ngunit hindi tahasang gumamit ang talata ng natatanging salita para sa pag-aasawa. Pinananatili ng salin ang tunay na lawak ng pahayag, at inilalagay sa talababa ang mas tiyak na posibilidad.
- issue: Anyo ng pangungusap tungkol sa kaparusahan
  choice: 'Aktibong legal na pahayag: “Susunugin nila sa apoy ang lalaki at ang dalawang babae.”'
  alternative: “Susunugin sa apoy ang lalaki at ang dalawang babae.”
  rationale: Aktibong ikatlong panauhang maramihan ang pandiwa sa Hebreo. Hindi tinutukoy kung sino mismo ang mga tagapagsagawa, kaya pinananatili rin itong di-tiyak sa Filipino sa pamamagitan ng “nila.”
- issue: Saklaw ng pambabaeng maramihang panghalip sa kaparusahan
  choice: Tukuyin ito bilang “ang dalawang babae.”
  alternative: “ang lalaki at sila”
  rationale: Pambabaeng maramihan ang Hebreong panghalip at likas na tumutukoy sa babaeng nabanggit at sa kanyang ina. Iniiwasan ng tahasang parirala ang malabong panghalip sa Filipino nang hindi binabago ang saklaw ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Pinanatili ang tuwirang bigat ng utos at ang pag-uulit ng זִמָּה, habang iniwasan ang makaluma o labis na teknikal na pananalita.
