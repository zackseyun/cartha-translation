  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: tl
  text: at ako mismo ay itututok ko ang aking mukha laban sa lalaking iyon at sa sambahayan niya, at ihihiwalay ko mula sa gitna ng kanilang bayan ang lalaki at ang lahat ng nagpapatutot sa pagsunod sa kanya upang magpatutot kay Molec.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nagpapatutot” at “magpatutot” ay salin ng Hebreong pandiwa na karaniwang tumutukoy sa pakikiapid o prostitusyon, ngunit ginagamit dito bilang metapora ng idolatrosong kawalang-katapatan.
    reason: lexical_alternative
  - marker: b
    text: Ang “ihihiwalay” ay pananalita tungkol sa hatol sa ilalim ng tipan. Hindi tinutukoy rito kung ang pag-aalis ay sa pamamagitan ng kamatayan, pagpapatalsik, o ibang paraan ng banal na paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: at ako mismo ay haharap laban
  rationale: Pinananatili ang idyoma ng pagtutuon ng mukha bilang tahasang pagharap ng Diyos laban sa nagkasala, at ang אֲנִי ay ipinahahayag sa “ako mismo” bilang diin.
- source_word: בָּאִישׁ הַהוּא
  choice: sa lalaking iyon
  rationale: Tuwirang sinasalamin ang isahang panlalaking אִישׁ at ang pantukoy na “iyon.”
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: at sa sambahayan niya
  rationale: Ang מִשְׁפָּחָה ay maaaring tumukoy sa pamilya, angkan, o mas malawak na yunit ng kamag-anak; ang “sambahayan” ay likas sa Tagalog at hindi labis na nililimitahan sa nuklear na pamilya.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: at ihihiwalay ko siya
  rationale: Ipinahahayag ang pag-aalis mula sa bayan nang hindi tinutukoy kung kamatayan, pagpapatapon, o ibang paraan ng hatol ang mekanismo.
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: at ang lahat ng sumusunod sa kanya sa pagtataksil sa akin
  rationale: Ang זנה ay metapora ng seksuwal na pagtataksil para sa pagtalikod sa tipan. Ginagawang malinaw sa Tagalog ang idolatrosong diwa habang pinananatili ang metapora ng pagtataksil; ang “sa akin” ay ipinahihiwatig ng tipang konteksto ngunit hindi tahasang nasa pariralang Hebreo, kaya nilalagyan ng talababa.
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: sa pamamagitan ng pagsunod kay Molec
  rationale: 'Ang infinitibo ay nagpapaliwanag kung paano isinasagawa ang naunang pagtataksil: sa debosyon at pagsunod kay Molec. Iniiwasan ang hindi likas na literal na pag-uulit sa Tagalog.'
- source_word: הַמֹּלֶךְ
  choice: Molec
  rationale: Itinuturing na pangalan ng diyos sa kontekstong ito at isinasalin sa karaniwang anyong Filipino na “Molec.”
- source_word: מִקֶּרֶב עַמָּם
  choice: mula sa gitna ng kanilang bayan
  rationale: Pinananatili ang larawan ng pag-aalis mula sa komunidad at ang pangmaramihang hulaping “kanilang,” na tumutukoy sa lalaki at sa lahat ng sumusunod sa kanya.
theological_decisions:
- issue: Metapora ng seksuwal na pagtataksil para sa idolatriya
  choice: “sa pagtataksil sa akin” sa pangunahing teksto, na may talababa tungkol sa literal na metapora
  alternative: “nagpapakasama bilang mga bayarang babae” / “nagpapatutot”
  rationale: Ang “pagtataksil” ay marangal at malinaw sa modernong Tagalog, samantalang ipinapaliwanag ng talababa na seksuwal na pagtataksil ang mismong metapora ng Hebreo. Hindi ito pinaplat lamang bilang “sumasamba sa diyus-diyosan.”
- issue: Kahulugan ng hatol na הִכְרִית
  choice: “ihihiwalay” nang hindi tinutukoy ang paraan
  alternative: “papatayin” o “palalayasin”
  rationale: Tiyak ang banal na pag-aalis mula sa bayan, ngunit hindi tinutukoy sa talatang ito kung kamatayan, pagpapatapon, o ibang anyo ng hatol ang paraan.
- issue: Saklaw ng hatol sa sambahayan
  choice: Panatilihin ang “at sa sambahayan niya” nang walang paliwanag kung paano sila sangkot
  alternative: Ipaliwanag na pinarurusahan lamang ang mga kasabwat
  rationale: Tahasan sa Hebreo na humaharap ang Diyos laban sa lalaki at sa kaniyang מִשְׁפָּחָה; hindi dapat dagdagan ng salin ang dahilan o antas ng pananagutan ng sambahayan.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “sambahayan” upang mapanatili ang posibleng mas malawak na saklaw kaysa nuklear na pamilya, at “Molec” bilang karaniwang anyong Filipino. Ang matinding Hebreong metapora ay hindi inalis kundi inilahad sa malinaw na pangunahing teksto at tahasang ipinaliwanag sa talababa.
