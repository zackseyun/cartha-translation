base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: tl
  text: Kung ang isang lalaki ay sumiping sa kanyang manugang na babae, tiyak na papatayin silang dalawa. Gumawa sila ng isang karumal-dumal na gawain[a]; ang pananagutan sa kanilang dugo ay nasa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “kabaluktutan,” “pagkalito,” o “kahiyahiyang gawa.” Ang Hebreong תֶּבֶל ay tumutukoy rito sa isang gawaing mali at salungat sa wastong kaayusang moral.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang kanilang dugo ay nasa kanila.” Ipinakikita ng Hebreong idyoma na sila mismo ang may pananagutan sa hatol na kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Kung ang isang lalaki
  rationale: Ang pormulang ito ay nagpapasimula ng isang kasong legal. Pinananatili ng “lalaki” ang tiyak na panlalaking paksa ng Hebreo, samantalang natural na ipinahahayag ng “kung” ang kondisyong diwa.
- source_word: יִשְׁכַּב אֶת
  choice: sumiping sa
  rationale: Sa kontekstong ito, ang pandiwang שׁכב na may אֶת ay tumutukoy sa pakikipagtalik. Ang “sumiping sa” ay marangal at karaniwang idyomang Filipino para rito nang hindi nagiging magaspang.
- source_word: כַּלָּתוֹ
  choice: kanyang manugang na babae
  rationale: Ang כַּלָּה rito ay partikular na asawa ng anak na lalaki. Nililinaw ng “na babae” ang ugnayang tinutukoy, sapagkat maaaring tumukoy sa alinmang kasarian ang “manugang” sa Filipino.
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: tiyak na papatayin silang dalawa
  rationale: Ipinahahayag ng “tiyak” ang diin ng infinitive absolute na kasama ng pandiwang may hangganan, at malinaw na kasama sa hatol ang dalawang gumagawa.
- source_word: תֶּבֶל עָשׂוּ
  choice: Gumawa sila ng isang karumal-dumal na gawain
  rationale: Ang תֶּבֶל ay may diwa ng isang gawaing lubhang mali, kahiya-hiya, at salungat sa wastong kaayusan. Ang saling ito ay natural sa Filipino at pinananatili ang mabigat na moral na paghatol ng teksto nang hindi sobrang nililimitahan ang saklaw ng salita.
- source_word: דְּמֵיהֶם בָּם
  choice: sila ang mananagot sa kanilang dugo
  rationale: Pinananatili nito ang larawang “dugo” ng Hebreong idyoma habang natural na ipinahahayag sa Filipino na nasa mga lumabag mismo ang pananagutan sa hatol na kamatayan.
theological_decisions:
- issue: Panlalaking paksa ng batas
  choice: “isang lalaki”
  alternative: “isang tao” o “sinuman”
  rationale: Tiyak na panlalaki ang אִישׁ at ang relasyong inilalarawan ay isang lalaki at ang asawa ng kanyang anak. Hindi ginawang neutral ang kasarian.
- issue: Moral na paglalarawan sa תֶּבֶל
  choice: “isang karumal-dumal na gawain”
  alternative: “kabaluktutan,” “pagkalito,” o “kahiyahiyang gawa”
  rationale: Ang mismong tekstong Hebreo ang nagbibigay ng mabigat na moral na paglalarawan. Ang napiling salita ay naghahatid nito ngunit kinikilala sa talababa ang tunay na lawak at hirap ng terminong Hebreo.
- issue: Pananagutan sa parusang kamatayan
  choice: “sila ang mananagot sa kanilang dugo”
  alternative: “ang kanilang dugo ay nasa kanila”
  rationale: Ang literal na idyoma ay maaaring maging malabo o di-likas sa modernong Filipino. Pinananatili ang salitang “dugo” at inililitaw ang legal na diwa ng sariling pananagutan, habang itinatala sa talababa ang mas literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “sumiping” bilang mahinahong ngunit nauunawaang katawagan sa pakikipagtalik. Nilagyan ng “na babae” ang “manugang” upang alisin ang likas na kalabuan ng salitang Filipino. Ang mga talababa ay inilagay sa mga salitang aktuwal nilang ipinapaliwanag.
