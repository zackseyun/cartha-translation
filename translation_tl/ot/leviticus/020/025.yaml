source:
  edition: WLC
  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: tl
  text: Pag-ibahin ninyo ang malinis na hayop at ang maruming hayop, at ang maruming ibon at ang malinis na ibon. Huwag ninyong gawing kasuklam-suklam[a] ang inyong mga sarili[b] sa pamamagitan ng hayop, ibon, o anumang gumagapang sa lupa, na ibinukod ko para sa inyo bilang marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “karima-rimarim.” Ang pandiwang Hebreo ay tumutukoy sa paggawa sa sarili na kasuklam-suklam o karima-rimarim, hindi sa karaniwang salitang nangangahulugang “maging marumi.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang inyong mga buhay” o “ang inyong mga pagkatao”; ang idyoma ay nangangahulugang “ang inyong mga sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: Kaya kilalanin ninyo ang pagkakaiba
  rationale: Ipinapahayag ng Hiphil ng בדל ang pagtatangi o pagkilala sa pagkakaiba. Natural sa modernong Tagalog ang pariralang ito at malinaw nitong ipinapakita ang pananagutan ng Israel na makilala ang dalawang kategorya.
- source_word: הַבְּהֵמָה
  choice: hayop
  rationale: Malawak ang saklaw ng salita rito at hindi lamang tumutukoy sa alagang hayop; ang “hayop” ang pinakanatural at hindi masyadong makitid.
- source_word: הַטְּהֹרָה / הַטְּמֵא / הַטְּמֵאָה / הַטָּהֹר
  choice: malinis / marumi
  rationale: Ito ang malinaw at nakaugaliang pananalita para sa mga kategoryang ritwal sa Levitico, nang hindi ginagawang pangkalinisan o tuwirang moral ang kahulugan.
- source_word: הָעוֹף
  choice: ibon
  rationale: Bagaman maaari itong sumaklaw nang mas malawak sa mga lumilipad na nilalang, “ibon” ang natural na salita sa kontekstong ito ng mga pagkaing ipinahihintulot o ipinagbabawal.
- source_word: וְלֹא תְשַׁקְּצוּ
  choice: Huwag ninyong gawing kasuklam-suklam
  rationale: Pinananatili nito ang diwa ng ugat na שׁקץ—pagiging kasuklam-suklam o karima-rimarim—at hindi ito ipinagkakamali sa hiwalay na bokabularyo ng pagiging marumi.
- source_word: אֶת נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili
  rationale: Ang נֶפֶשׁ sa idyomang ito ay tumutukoy sa buong pagkatao, hindi lamang sa isang di-materyal na kaluluwa.
- source_word: בַּבְּהֵמָה וּבָעוֹף
  choice: sa pamamagitan ng hayop, ibon
  rationale: Ang “sa pamamagitan ng” ay nagpapanatili sa instrumental na gamit ng pang-ukol nang hindi tahasang nililimitahan ang paraan sa pagkain o paghipo.
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: o anumang gumagapang sa lupa
  rationale: Natural at malawak ang “gumagapang sa lupa” para sa רמשׂ at hindi nito ipinapasok ang ibang nuansang gaya ng pagdagsa o pagkulupon.
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם
  choice: na ibinukod ko para sa inyo
  rationale: Pinananatili ng “ibinukod” ang konsepto ng parehong ugat na בדל at ang pagkilos ng Diyos sa pagtatalaga ng mga kategorya para sa Israel.
- source_word: לְטַמֵּא
  choice: bilang marumi
  rationale: Malinaw nitong naipapahayag ang pag-uuri o pagtatalaga sa mga nilalang na marumi para sa Israel.
theological_decisions:
- issue: Ritwal na kategorya laban sa moral o pangkalinisan na pagpapakahulugan
  choice: malinis / marumi bilang mga kategorya ng kadalisayang tipan
  alternative: dalisay / di-dalisay; mabuti / masama; malinis / marungis sa pisikal na diwa
  rationale: Ang talata ay tungkol sa ipinag-utos na pagtatangi sa mga hayop sa loob ng kabanalan at mga tuntuning pandiyeta ng Israel. Hindi ipinapantay ng salin ang ritwal na “marumi” sa likas na kasamaan o kawalan ng kalinisan.
- issue: Kahulugan ng נֶפֶשׁ sa אֶת נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili, na tumutukoy sa buong pagkatao
  alternative: ang inyong mga kaluluwa
  rationale: Iniiwasan nito ang pagpasok ng antropolohiyang naghihiwalay sa katawan at kaluluwa na hindi hinihingi ng idyomang Hebreo.
- issue: Paraan ng pagiging kasuklam-suklam sa pamamagitan ng mga nilalang
  choice: pinanatiling pangkalahatan ang instrumental na pananalita
  alternative: tahasang tukuyin bilang pagkain o paghipo
  rationale: Hindi tahasang pinangalanan ng mismong talata ang partikular na paraan; kaya hindi ito nilimitahan ng salin sa pagkain o paghipo lamang.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang “kilalanin ninyo ang pagkakaiba” para sa natural na utos, “malinis/marumi” para sa teknikal na mga kategorya sa Levitico, at “ang inyong sarili” para sa Hebreong idyoma. Inilipat ang mga panandang [a] at [b] sa mga salitang aktuwal na ipinapaliwanag ng kani-kanilang talababa.
