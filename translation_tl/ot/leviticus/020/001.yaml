  text: 'At nagsalita si Yahweh kay Moises[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
