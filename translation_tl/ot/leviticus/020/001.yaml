  naturalness: Hindi likas sa modernong Filipino ang “At nagsalita si Yahweh kay Moises, na sinabi,” bilang pambungad sa kasunod na pananalita. Ang “at sinabi:” ay malinaw, natural, at angkop sa pormal na rehistro ng salin.
