lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at Piel ng דבר ay nagbubukas ng bagong yunit ng pagsasalita; likas at pormal na katumbas sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa kausap, at ang “kay Moises” ang natural na modernong Filipino para sa pariralang ito.
- source_word: לֵאמֹר
  choice: na sinabi
  rationale: Pormularyong pambungad ito sa mismong mensaheng susunod. Pinananatili ng “na sinabi” ang ugnayang gramatikal nang hindi inuulit ang “nagsasalita.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormularyong estruktura ng Hebreo dahil pambungad ito sa pahayag na nagpapatuloy sa susunod na talata.
