base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: tl
  text: Kung lalapit ang isang babae sa anumang hayop upang makipagtalik dito[a], papatayin ninyo ang babae at ang hayop. Tiyak na papatayin sila; ang kanilang dugo ay nasa kanila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “upang sipingan ito.” Ang pandiwang Hebreo ay tumutukoy sa pakikipagtalik, na literal na may kaugnayan sa pagpatong.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sila mismo ang may pananagutan sa kanilang kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: lalapit
  rationale: Pinananatili nito ang kongkretong diwa ng pandiwang קרב na ‘lumapit’; ang layuning seksuwal ay malinaw na ipinahahayag ng kasunod na parirala.
- source_word: כָּל בְּהֵמָה
  choice: anumang hayop
  rationale: Malawak ang saklaw ng בְּהֵמָה rito, at ang ‘anumang’ ay natural na naghahatid ng puwersa ng כָּל sa isang pangkalahatang batas.
- source_word: לְרִבְעָה אֹתָהּ
  choice: upang makipagtalik dito
  rationale: Malinaw at dignified na ipinahahayag ng ‘makipagtalik’ ang seksuwal na kilos na tinutukoy ng רבע, nang hindi gumagamit ng malabo o sobrang teknikal na pananalita. Ang ‘dito’ ay tumutukoy sa hayop.
- source_word: וְהָרַגְתָּ
  choice: dapat ninyong patayin
  rationale: Inihahatid ng ‘dapat’ ang direktibong puwersa ng legal na pahayag. Ginamit ang maramihang ‘ninyo’ bilang natural na Filipino para sa utos na nakatuon sa bayang nagpapatupad ng batas, bagaman isahan ang anyong Hebreo.
- source_word: מוֹת יוּמָתוּ
  choice: Tiyak na papatayin silang dalawa
  rationale: Ang ‘tiyak’ ay nagpapanatili sa diin ng infinitive absolute na מוֹת kasama ng finite verb, at ang ‘silang dalawa’ ay nililinaw na kapuwa ang babae at ang hayop ang tinutukoy.
- source_word: דְּמֵיהֶם בָּם
  choice: sila ang mananagot sa sarili nilang dugo
  rationale: Pinananatili nito ang larawan ng dugo habang malinaw na ipinahahayag ang idyomatikong diwa na nasa kanila ang pananagutan sa kanilang kamatayan.
theological_decisions:
- issue: Tuwirang pagsasalin ng mabigat na batas tungkol sa pakikipagtalik sa hayop
  choice: Malinaw na banggitin ang pakikipagtalik at ang parusang kamatayan nang walang dagdag na komentaryong moral.
  alternative: Gumamit ng mas eupemistikong ‘sumiping’ o mas literal ngunit malabong pananalita tungkol sa pagsakay/pagpatong.
  rationale: Legal at penal ang pahayag. Kailangang mapanatili ang bigat at linaw ng Hebreo nang hindi pinahihina ang pagbabawal o nagdaragdag ng doktrinal na paliwanag na wala sa teksto.
- issue: Pananagutan sa idyomang דְּמֵיהֶם בָּם
  choice: ‘sila ang mananagot sa sarili nilang dugo’
  alternative: ‘ang kanilang dugo ay nasa kanila’
  rationale: Ang piniling anyo ay nauunawaan sa modernong Filipino at pinananatili ang talinghaga ng dugo; ang talababa ay nagtatala ng mas literal na anyo upang hindi maitago ang idyomatikong tensiyon.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at angkop sa legal na konteksto. Iniwasan ang arkaikong ‘sumiping’ dahil maaari itong maging malabo sa kasalukuyang mambabasa. Ginamit ang malinaw ngunit hindi bulgar na ‘makipagtalik.’
