id: LEV.20.3
reference: Leviticus 20:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: tl
  text: Ako mismo ay haharap laban sa lalaking iyon at ihihiwalay ko siya sa kanyang bayan, sapagkat ibinigay niya ang ilan sa kanyang mga anak kay Molec[a] upang dungisan ang aking santuwaryo at lapastanganin ang aking banal na pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inihain niya ang ilan sa kanyang mga anak kay Molec.” Literal sa Hebreo, “ibinigay niya ang ilan sa kanyang mga supling kay Molec”; ipinahihiwatig ng mas malawak na konteksto na paghahandog ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ako mismo
  rationale: Ipinahahayag ang diin ng malayang panghalip sa Hebreo at ang personal na pagkilos ng Diyos.
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: haharap laban sa lalaking iyon
  rationale: Pinananatili ang larawan ng Hebreong idyoma at ang tahasang banal na pagsalungat, habang natural sa makabagong Tagalog.
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: at ihihiwalay ko siya sa kanyang bayan
  rationale: Ipinapakita ang hudisyal at panlipunang pag-aalis nang hindi tinutukoy nang higit sa teksto ang paraan ng hatol.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng hatol sa isang marangal na rehistro.
- source_word: מִזַּרְעוֹ
  choice: ang ilan sa kanyang mga anak
  rationale: Ang זרע ay tumutukoy rito sa mga supling o anak; ipinahahayag ng 'ilan' ang partitive na מִן.
- source_word: נָתַן לַמֹּלֶךְ
  choice: ibinigay ... kay Molec
  rationale: Pinananatili ang payak na pandiwang 'ibinigay' sa halip na idagdag sa pangunahing teksto ang interpretatibong 'inihain.'
- source_word: לְמַעַן
  choice: upang
  rationale: Maikli at natural na naghahayag ng layunin o kinalabasan, habang hindi nilulutas ang posibleng saklaw ng dalawang kahulugan.
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: dungisan ang aking santuwaryo
  rationale: Ang 'dungisan' ay malinaw na katumbas ng kultikong pagpaparumi; pinananatili ng 'santuwaryo' ang banal na konteksto ng מִקְדָּשׁ.
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: at lapastanganin ang aking banal na pangalan
  rationale: Ipinahahayag ang pagtrato sa banal na pangalan na parang karaniwan o walang galang, nang may angkop na bigat sa Tagalog.
- source_word: אִישׁ הַהוּא
  choice: lalaking iyon
  rationale: Pinananatili ang panlalaking isahan at ang demonstratibong diin ng tekstong Hebreo.
theological_decisions:
- issue: Kalikasan ng pagkakasalang may kaugnayan kay Molec
  choice: Pinanatili sa pangunahing teksto ang 'ibinigay niya ang ilan sa kanyang mga anak kay Molec.'
  alternative: Inihain niya ang ilan sa kanyang mga anak kay Molec.
  rationale: Malakas na ipinahihiwatig ng mas malawak na konteksto ang paghahandog ng mga anak, ngunit ang talatang ito mismo ay gumagamit lamang ng pangkalahatang pandiwang 'ibinigay.'
- issue: Personal na paghatol ng Diyos
  choice: Ako mismo ay haharap laban
  alternative: Sasalungatin ko
  rationale: Pinananatili ang diin ng panghalip at ang matalinghagang larawan ng mukha sa Hebreo sa halip na gawing pangkalahatang pahayag lamang ng pagsalungat.
- issue: Kahulugan ng כרת sa pormulang panghatol
  choice: ihihiwalay ko siya sa kanyang bayan
  alternative: lilipulin ko siya mula sa kanyang bayan
  rationale: Hindi tiyak sa mismong pormula kung kamatayan, banal na paglipol, o panlipunang pagtatakwil ang eksaktong paraan; hindi ito dapat tahasang lutasin sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'santuwaryo' bilang pamilyar na terminong biblikal at pinanatili ang Molec bilang pangalang pantangi. Ang talinghagang 'haharap laban' ay sadyang pinanatili upang maihatid ang Hebreong idyoma nang hindi labis na literal.
