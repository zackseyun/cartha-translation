    issue: Pinalitan ng “haharapin ko bilang kaaway” ang idyomang “itutuon ko ang aking mukha laban.”
    rationale: Ang salitang “bilang kaaway” ay interpretatibong dagdag, samantalang ang larawan ng pagtutuon ng mukha laban sa tao ay malinaw at natural ding maisalin sa Filipino.
  - severity: low
