  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: tl
  text: Ang taong bumabaling sa mga medium at sa mga espiritista[a], upang magpatutot sa pamamagitan ng pagsunod sa kanila[b], ay itutuon ko ang aking mukha laban sa taong iyon at puputulin ko siya mula sa kanyang bayan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga medium” bilang “mga may pamilyar na espiritu.” Ang dalawang katawagang Hebreo ay tumutukoy sa magkaugnay ngunit magkaibang uri ng mga taong nagsasagawa ng ipinagbabawal na pagsangguni sa mga patay o sa mga espiritu.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “upang magpatutot sa kanila” o “upang magtaksil sa pagsunod sa kanila.” Gumagamit ang Hebreo ng talinghaga ng prostitusyon para sa pagtataksil sa tipan sa pamamagitan ng ipinagbabawal na gawaing espirituwal.
    reason: lexical_alternative
  - marker: c
    text: Ang “puputulin” ay karaniwang pormulang legal. Hindi tinutukoy rito ng teksto ang eksaktong paraan ng hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: ang taong
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa mismong tao, hindi lamang sa di-materyal na kaluluwa.
- source_word: תִּפְנֶה
  choice: bumaling
  rationale: Pinananatili nito ang larawan ng pagharap o paglapit sa isang pinagsasangguniang tao, habang natural pa rin sa modernong Filipino.
- source_word: הָאֹבֹת
  choice: mga sumasangguni sa espiritu ng patay
  rationale: Tinutukoy ng אוֹב sa kontekstong ito ang mga taong nagsasagawa ng pakikipag-ugnayan sa mga patay o espiritu. Nililinaw ng parirala ang gawain nang hindi gumagamit ng malabong lumang katawagan.
- source_word: הַיִּדְּעֹנִים
  choice: mga espiritista
  rationale: Ito ay hiwalay ngunit kaugnay na katawagan para sa mga nagsasagawa ng okultong pagsangguni; pinananatili ng “espiritista” ang pagkakaiba nito sa naunang termino.
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: upang magpatutot sa pagsunod sa kanila
  rationale: Pinananatili ang tahasang talinghaga ng זנה para sa pagtataksil sa tipan sa pamamagitan ng ipinagbabawal na gawaing espirituwal.
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: haharapin ko bilang kaaway
  rationale: Natural na ipinahahayag sa Filipino ang Hebreong idyoma ng pagtutuon ng mukha laban sa isang tao, at pinananatili ang diwa ng personal at aktibong pagsalungat ng Diyos.
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: puputulin ko siya
  rationale: Pinananatili ang karaniwang pormulang legal na כרת at ang hindi pagtukoy ng teksto sa eksaktong paraan ng hatol.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: mula sa gitna ng kanyang bayan
  rationale: Malapit ito sa Hebreong pormula at pinananatili ang panlipunan at pangtipang konteksto ng hatol.
theological_decisions:
- issue: Pagpapanatili sa talinghaga ng prostitusyon para sa pagtataksil sa tipan
  choice: upang magpatutot sa pagsunod sa kanila
  alternative: upang magtaksil sa pagsunod sa kanila
  rationale: Tahasang ginagamit ng Hebreo ang זנה. Ang pagpapanatili sa talinghaga ay naghahatid ng bigat ng pagtataksil sa tipan sa halip na gawing pangkalahatang pagsuway lamang ang kasalanan.
- issue: Kahulugan ng parusang כרת
  choice: puputulin ko siya mula sa gitna ng kanyang bayan
  alternative: aalisin ko siya sa kanyang bayan / lilipulin ko siya
  rationale: Hindi tinutukoy rito ng teksto kung ang hatol ay kamatayan, tuwirang hatol ng Diyos, o pag-aalis sa pamayanan. Iniiwasan ng salin na pumili ng iisang paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang matinding talinghaga ng prostitusyon at ang sadyang di-tiyak na pormulang legal na “puputulin,” habang ginawang natural ang Hebreong idyoma tungkol sa mukha sa pamamagitan ng “haharapin ko bilang kaaway.”
