- from: Ang taong bumaling sa mga sumasangguni sa espiritu ng patay at sa mga espiritista[a], upang magpatutot sa pagsunod sa kanila[b], ay haharapin ko bilang kaaway; puputulin ko siya mula sa gitna ng kanyang bayan.[c]
  to: Ang taong bumabaling sa mga medium at sa mga espiritista[a], upang magpatutot sa pamamagitan ng pagsunod sa kanila[b], ay itutuon ko ang aking mukha laban sa taong iyon at puputulin ko siya mula sa kanyang bayan.[c]
  rationale: 'Isinaayos ang dalawang parirala upang maging mas tapat sa mga larawan at antas ng katiyakan ng Hebreo: ang pagtuon ng mukha laban sa tao at ang katawagang “mga medium.” Pinakinis din ang metapora ng prostitusyon upang maging natural sa modernong Filipino, nang hindi pinahihina ang metaporang pangtipan. Nananatiling di-tiyak ang kahulugan ng “puputulin,” gaya ng pinananatili ng Hebreo at ng English POB audit trail.'
