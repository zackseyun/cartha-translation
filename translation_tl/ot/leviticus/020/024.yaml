source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: tl
  text: Ngunit sinabi ko sa inyo[a], “Aangkinin ninyo ang kanilang lupain, at ako mismo ang magbibigay nito sa inyo upang angkinin”—isang lupaing umaagos ang gatas at pulot[b]. Ako si Yahweh[c], ang inyong Diyos; ibinukod ko kayo mula sa mga bayan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Mamanahin ninyo ang kanilang lupain ... upang manahin iyon.” Ang pandiwang Hebreo na יָרַשׁ ay maaaring mangahulugang magmana o mag-angkin ng pag-aari.'
    reason: lexical_alternative
  - marker: b
    text: Ang “lupaing umaagos ang gatas at pulot” ay isang idyomang Hebreo para sa sagana at matabang lupain.
    reason: cultural_note
  - marker: c
    text: 'Hebreo: YHWH; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
  - marker: d
    text: 'Maaari ring isalin: “na naghiwalay sa inyo mula sa mga bayan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Ngunit sinabi ko
  rationale: Ipinahahayag ng waw ang pagpapatuloy ng diskurso, ngunit ang “Ngunit” ay natural na naghahatid ng kaibahan sa konteksto.
- source_word: תִּירְשׁוּ ... לָרֶשֶׁת
  choice: magmamay-ari ... upang ariin
  rationale: Maaaring mangahulugan ang ירשׁ ng pagmamana o pag-angkin at pagmamay-ari. Pinananatili ng dalawang kaugnay na pandiwa ang pag-uulit sa Hebreo nang natural sa Tagalog.
- source_word: אַדְמָתָם
  choice: kanilang lupain
  rationale: Bagaman maaari itong tumukoy sa lupa o lupang sinasaka, ang “lupain” ang angkop sa konteksto ng teritoryong ipagkakaloob.
- source_word: וַאֲנִי
  choice: at ako mismo
  rationale: Pinananatili ng “ako mismo” ang diin ng hiwalay na panghalip sa Hebreo.
- source_word: אֶתְּנֶנָּה
  choice: ang magbibigay nito
  rationale: Ipinahahayag nito ang pangako ng Diyos na ibibigay niya ang lupain.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili ang matingkad na idyomang Hebreo para sa kasaganaan at katabaan ng lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: הִבְדַּלְתִּי
  choice: nagbukod
  rationale: Ang “nagbukod” ay natural sa Tagalog at sumasaklaw sa diwa ng paghihiwalay o pagtatangi nang hindi ito pinalalawak sa isang tiyak na doktrinal na paliwanag.
- source_word: הָעַמִּים
  choice: ibang mga bayan
  rationale: Tumutukoy ito sa mga pangkat ng tao; nililinaw ng “ibang” ang relasyong “mula sa” sa natural na Tagalog nang hindi kinakailangang gawing mga estadong politikal ang mga ito.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang nasa teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Diwa ng pagkakahiwalay ng Israel sa ibang mga bayan
  choice: na nagbukod sa inyo mula sa ibang mga bayan
  alternative: na naghiwalay sa inyo mula sa ibang mga bayan
  rationale: Inihahayag ng teksto ang pagkilos ng Diyos na ibukod ang Israel, ngunit hindi dinaragdagan ng mga kategoryang teolohikal na wala sa talata.
- issue: Diwa ng ירשׁ tungkol sa lupain
  choice: magmamay-ari ... upang ariin
  alternative: mamanahin ... upang manahin
  rationale: Pinananatili ng salin ang aktibong diwa ng pag-angkin o pagmamay-ari habang itinatala sa talababa ang tunay na posibilidad ng “pagmamana.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa teritoryo, “ako mismo” upang mapanatili ang diin, at “nagbukod” bilang natural ngunit hindi labis na interpretatibong katumbas ng בדל. Inilagay ang mga talababa sa lohikal na katapat na bahagi ng pangunahing teksto.
