  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: tl
  text: Kung ang isang lalaki ay sumiping sa asawa ng kanyang tiyuhin[a], inilantad niya ang kahubaran ng kanyang tiyuhin.[b] Papasanin nilang dalawa ang kanilang kasalanan.[c] Mamamatay silang walang anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang tiyahin,” na sa kontekstong ito ay asawa ng kanyang tiyuhin.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “inilantad niya ang kahubaran ng kanyang tiyuhin.” Idyomang Levitiko ito para sa paglabag sa ipinagbabawal na ugnayang seksuwal sa loob ng pamilya sa pamamagitan ng pagsiping sa asawa ng tiyuhin.
    reason: cultural_note
  - marker: c
    text: 'Maaari ring isalin: “Papasanin nilang dalawa ang kanilang pananagutan.” Maaaring tumukoy ang idyomang Hebreo sa kasalanan o sa pananagutang bunga nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Kung ang isang lalaki
  rationale: Ang parirala ay nagpapakilala ng panibagong kasong legal. Pinananatili ng “isang lalaki” ang tiyak na panlalaking paksa ng Hebreo.
- source_word: יִשְׁכַּב אֶת
  choice: sumiping sa
  rationale: Karaniwang dignified na idyomang Filipino ito para sa pakikipagtalik at tumutugma sa idyomatikong gamit ng שׁכב sa kontekstong ito.
- source_word: דֹּדָתוֹ
  choice: asawa ng kanyang tiyuhin
  rationale: Tumutukoy ito sa asawa ng tiyuhin, hindi sa tiyahin sa dugo. Mas tiyak ang tahasang ugnayang ito sa Filipino at mahalaga sa kasunod na sugnay.
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: inilantad niya ang kahubaran ng kanyang tiyuhin
  rationale: Pinananatili ang sadyang Levitikong idyoma at ang pagkakaugnay ng ipinagbabawal na pagtatalik sa buklod ng tiyuhin at ng asawa nito.
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: Papasanin nilang dalawa ang kanilang kasalanan
  rationale: Ang pandiwa at hulaping maramihan ay tumutukoy sa dalawang sangkot. Nililinaw ng “nilang dalawa” ang likas na paksa sa Filipino, habang pinananatili ng “kasalanan” ang pangunahing diwa ng חטא.
- source_word: עֲרִירִים יָמֻתוּ
  choice: mamamatay silang walang anak
  rationale: Tapat ito sa maikli at hindi detalyadong hatol ng Hebreo, nang hindi ipinapaliwanag ang mekanismo o kung may usapin ng nabubuhay na supling.
theological_decisions:
- issue: Kahulugan ng hatol na עֲרִירִים יָמֻתוּ
  choice: mamamatay silang walang anak
  alternative: mamamatay silang walang naiwang anak
  rationale: Hindi tahasang sinasabi ng Hebreo kung paano matutupad ang hatol o kung ang ibig sabihin ay walang anumang anak o walang nabubuhay na supling. Pinananatili ng napiling salin ang kaiklian at tensiyon ng teksto.
- issue: חֶטְאָם bilang kasalanan o pananagutan
  choice: kanilang kasalanan
  alternative: kanilang pananagutan sa kasalanan
  rationale: Maaaring tumukoy ang idyoma sa kasalanan mismo o sa pananagutan/bigat na bunga nito. Nasa pangunahing teksto ang mas tuwirang katumbas, at itinatala sa talababa ang leksikal na saklaw.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sumiping” bilang dignified na idyoma para sa pakikipagtalik. Pinanatili ang Levitikong larawang “inilantad ang kahubaran,” habang nilinaw sa pangunahing teksto ang eksaktong ugnayang pampamilya.
