base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: tl
  text: Kaya sundin ninyo ang lahat ng aking mga tuntunin at lahat ng aking mga pasiya, at isagawa ninyo ang mga iyon,[a] upang hindi kayo isuka[b] ng lupain na dinadala ko kayo upang doon manirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “aking mga itinakda at aking mga kahatulan.” Dalawang magkaibang legal na katawagan ang ginamit sa Hebreo: חֻקּוֹת at מִשְׁפָּטִים.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ibuga.” Literal na “isuka” ang pandiwang Hebreo—isang matinding metapora ng lupaing nagpapalayas sa mga naninirahan dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kaya sundin ninyo
  rationale: Sa kontekstong tipan at legal, ang שׁמר ay nangangahulugang sundin o tuparin. Ang “Kaya” ay likas na nag-uugnay sa naunang babala, samantalang malinaw na ipinahahayag ng pautos na anyo ang obligasyon.
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang חֻקָּה ay tumutukoy sa mga itinakdang kautusan o regulasyon. Ang “mga tuntunin” ay pormal ngunit malinaw sa makabagong Filipino.
- source_word: מִשְׁפָּטַי
  choice: aking mga pasiya
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa hatol, legal na pasiya, o alituntunin. Pinananatili ng “mga pasiya” ang legal na diwa at ang pagkakaiba nito sa חֻקּוֹת.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: at isagawa ninyo ang mga iyon
  rationale: Kapag legal na mga utos ang layon, ang עשה ay nangangahulugang gawin o isakatuparan. Mas natural sa Filipino ang “isagawa” kaysa sa literal na “gawin ang mga iyon.”
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: upang hindi kayo isuka
  rationale: Literal na “sumuka” ang קיא. Pinananatili ang matindi at sadyang nakagugulat na larawan ng lupa na nagtataboy sa maruruming naninirahan.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Sa konteksto, tumutukoy ang אֶרֶץ sa tiyak na lupaing titirhan ng Israel, hindi sa buong daigdig.
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: lupaing dinadalhan ko sa inyo
  rationale: Ipinahahayag ng parirala ang patuloy na pagkilos ng Diyos na dalhin sila sa naturang lupain. Ang “dinadalhan ko sa inyo” ay likas na Filipino sa loob ng sugnay.
- source_word: לָשֶׁבֶת בָּהּ
  choice: upang doon manirahan
  rationale: Ang ישׁב ay maaaring mangahulugang umupo, tumira, o manirahan. Malinaw at kasalukuyang gamit ang “manirahan,” at pinananatili ng “doon” ang lokatibong sangkap ng Hebreo.
theological_decisions:
- issue: Masidhing larawan ng pagpapaalis mula sa lupain
  choice: Inilarawan ang lupain na “isusuka” ang mga naninirahan dito.
  alternative: Itataboy o itatakwil sila ng lupain.
  rationale: Hayagang gumagamit ang Hebreo ng personipikasyon at ng literal na pandiwang “sumuka.” Ang pagpapanatili nito ay hindi nagpapahina sa bigat ng babalang kaugnay ng karumihan at pagpapaalis.
- issue: Pagkakaiba ng חֻקּוֹת at מִשְׁפָּטִים
  choice: “mga tuntunin” at “mga pasiya”
  alternative: “mga kautusan” at “mga batas”
  rationale: Dalawang magkaibang legal na katawagan ang ginamit sa Hebreo. Pinananatili ng salin ang pagkakaibang iyon nang hindi nagdaragdag ng isang denominasyonal na pakahulugan.
- issue: Ugnayan ng pagsunod at hindi pagpapaalis
  choice: Ginamit ang “upang hindi” upang ihayag ang layunin o inaasahang resulta ng pagsunod.
  alternative: “at hindi kayo isusuka” bilang tuwirang kasunod na pangyayari.
  rationale: Maaaring dalhin ng pagkakasunod ng mga sugnay ang diwang layunin o resulta. Ang “upang hindi” ay natural sa Filipino at umaayon sa konteksto, nang gawing mekanikal na garantiya ang babala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo/kayo” ayon sa Hebreo. Pinanatili ang matingkad na metapora ng pagsusuka at ang dalawang magkaibang legal na katawagan, habang iniwasan ang lipas o labis na teknikal na pananalita.
