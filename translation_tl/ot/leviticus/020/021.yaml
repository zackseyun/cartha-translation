  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: tl
  text: At kung asawahin ng isang lalaki ang asawa ng kanyang kapatid, iyon ay karumihan[a]; inilantad niya ang kahubaran ng kanyang kapatid. Magiging walang anak sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iyon ay isang karumihan.” Ang salitang Hebreo ay maaaring tumukoy sa karumihang ritwal at moral.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Mamamatay silang walang anak.” Mas literal na sinasabi ng Hebreo, “Magiging walang anak sila,” nang hindi tinutukoy kung paano isasakatuparan ang hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר יִקַּח
  choice: At kung kukunin ng isang lalaki
  rationale: Pinananatili ng “At” ang pagkakaugnay sa mga naunang tuntunin, samantalang natural na ipinapahayag ng “kung” ang kondisyonal na pormula ng batas. Ang “kukunin” ay hindi tahasang nagpapasya kung pormal na pag-aasawa o pakikipagtalik ang tinutukoy.
- source_word: אֵשֶׁת אָחִיו
  choice: ang asawa ng kanyang kapatid na lalaki
  rationale: Nililinaw ang panlalaking kahulugan ng אָחִיו, na hindi likas na naipapakita ng walang-kasariang salitang Tagalog na “kapatid.”
- source_word: נִדָּה הִוא
  choice: iyon ay karumihan
  rationale: Ang “iyon” ay tumutukoy sa ginawa o pagsasama, hindi tuwirang nagtatakda na ang babae mismo ay marumi. Ang “karumihan” ay maaaring magpahiwatig ng ritwal at moral na pagiging marumi.
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: inilantad niya ang kahubaran ng kanyang kapatid
  rationale: Pinananatili ang sadyang eupemistikong legal na idyoma ng Levitico para sa ipinagbabawal na relasyong seksuwal.
- source_word: עֲרִירִים יִהְיוּ
  choice: Hindi sila magkakaroon ng anak
  rationale: Natural na Tagalog ito para sa panghinaharap na pagiging walang anak at hindi nito ipinapaliwanag kung paano isasakatuparan ang hatol.
theological_decisions:
- issue: Kahulugan at paraan ng hatol sa עֲרִירִים יִהְיוּ
  choice: Hindi sila magkakaroon ng anak
  alternative: Mamamatay silang walang anak
  rationale: Tahasang sinasabi ng Hebreo ang kalagayang walang anak ngunit hindi ang paraan o panahon ng katuparan. Kaya hindi isinisingit sa pangunahing teksto ang kamatayan bilang mekanismo ng hatol.
- issue: Tinutukoy ng נִדָּה הִוא
  choice: iyon ay karumihan
  alternative: marumi ang babae
  rationale: Mas malamang na ang ipinagbabawal na ugnayan o gawa ang hinahatulang karumihan; iniiwasan ng salin na ilipat nang walang katiyakan ang panaguri sa babae mismo.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang legal na anyo at ang idyomang “inilantad ang kahubaran,” habang nilinaw lamang ang kasarian ng “kapatid” ayon sa Hebreo. Inilagay ang mga pananda ng talababa sa mismong pariralang ipinaliliwanag ng bawat talababa.
