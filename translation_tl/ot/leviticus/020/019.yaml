base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: tl
  text: Huwag mong ilantad ang kahubaran ng kapatid na babae ng iyong ina o ng kapatid na babae ng iyong ama, sapagkat inilantad niya ang kanyang malapit na kadugo.[a] Pananagutan nila ang kanilang pagkakasala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sarili niyang laman.” Ang Hebreong pananalita ay maaari ring mangahulugang “sarili niyang malapit na kamag-anak” o “kadugo.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “papasanin nila ang kanilang pagkakasala,” o “pananagutan nila ang kaparusahan dahil sa kanilang pagkakasala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: Huwag mong ilantad ang kahubaran
  rationale: Pinananatili ang nakaugaliang Hebreong idyoma sa mga pagbabawal na seksuwal sa Levitico, sa halip na tahasang palitan ng “huwag kang makipagtalik.” Malinaw ito sa konteksto at pinananatili ang anyo at ugnayan nito sa mga kalapit na talata.
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: kapatid na babae ng iyong ina o ng kapatid na babae ng iyong ama
  rationale: Tuwirang inililipat ang mga katawagang pangkamag-anak sa Hebrew. Higit itong tiyak kaysa sa “tiyahin,” na maaaring tumukoy rin sa asawa ng kapatid ng magulang.
- source_word: שְׁאֵרוֹ
  choice: sarili niyang laman
  rationale: Pinananatili ang kongkretong talinghagang “laman” para sa malapit na kadugo o kamag-anak. Inilalagay sa talababa ang mas interpretibong kahulugang “sarili niyang kadugo.”
- source_word: הֶעֱרָה
  choice: inilantad niya
  rationale: Isinasalin ang pandiwang “ilantad/gawing hubad” at pinananatili ang pang-isahang anyo ng sugnay. Ang seksuwal na diwa ay malinaw mula sa legal na idyoma at konteksto.
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: Pananagutan nila ang kanilang kasamaan
  rationale: Ipinahahayag ang Hebreong idyoma ng pagpasan sa kasalanan, pagkakasala, at kaugnay na pananagutan sa likas na modernong Tagalog, habang iniiwang hindi espesipiko ang eksaktong kaparusahan.
theological_decisions:
- issue: Paglipat mula sa pang-isahang nagkasala tungo sa pangmaramihang may pananagutan
  choice: Pinanatili ang pang-isahang “niya” sa paliwanag at ang pangmaramihang “nila” sa huling sugnay.
  alternative: 'Gawing pawang pangmaramihan: “sapagkat inilantad nila ang sarili nilang laman; pananagutan nila...”'
  rationale: Ang Hebrew ay may pang-isahang panlapi at pandiwa sa שְׁאֵרוֹ / הֶעֱרָה, ngunit pangmaramihan sa עֲוֺנָם יִשָּׂאוּ. Pinananatili ng salin ang tunay na pagbabago sa bilang sa halip na pakinisin o ipaliwanag ito.
- issue: Kung tahasang sasabihin ang pakikipagtalik sa pangunahing teksto
  choice: Pinanatili ang “ilantad ang kahubaran.”
  alternative: “Huwag kang makipagtalik sa...”
  rationale: Mahalagang bahagi ng estilo at magkakaugnay na pananalita ng Kodigo ng Kabanalan ang Hebreong idyoma. Hindi kailangang alisin ang talinghaga sapagkat malinaw ang seksuwal na diwa sa konteksto.
- issue: Saklaw ng עָוֹן bilang kasamaan, pagkakasala, o kaparusahan
  choice: “kanilang kasamaan,” kasama ang pandiwang “pananagutan”
  alternative: “papasanin nila ang kanilang pagkakasala” o “daranas sila ng kaparusahan dahil sa kanilang kasamaan”
  rationale: Hindi tahasang tinutukoy ng Hebrew kung kasalanan, pagiging salarin, o bunga ng kasalanan ang nangingibabaw. Ang pangunahing salin at talababa ay nagpapanatili sa saklaw na ito nang hindi nagtatakda ng isang partikular na kaparusahan.
translation_notes:
  register: Makabago at marangal na Tagalog na angkop sa tekstong legal. Ginamit ang malinaw na “kapatid na babae ng iyong ina/ama” sa halip na ang mas maikli ngunit hindi gaanong tiyak na “tiyahin.” Pinanatili ang biblikal na idyomang “ilantad ang kahubaran,” ngunit ginawang likas sa Tagalog ang pormula ng pananagutan.
