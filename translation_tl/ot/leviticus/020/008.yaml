  text: וּ/שְׁמַרְתֶּם֙ אֶת חֻקֹּתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: tl
  text: Sundin ninyo ang aking mga tuntunin at isagawa ang mga ito. Ako si Yahweh, na nagpapabanal sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “na ginagawang banal kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Sundin ninyo
  rationale: Ang שׁמר kapag tumutukoy sa mga kautusan ay nangangahulugang ingatan o sundin ang mga iyon. Natural sa makabagong Tagalog ang “sundin,” at malinaw nitong ipinapahayag ang pananagutang tipanan. Hindi hiwalay na isinalin ang panimulang ו dahil hindi kailangan ang “at” sa natural na pagsisimula ng talata sa Tagalog.
- source_word: חֻקֹּתַי
  choice: ang aking mga tuntunin
  rationale: Ang חֻקָּה ay tumutukoy sa mga itinakdang tuntunin o batas. Pinananatili ng “mga tuntunin” ang legal na diwa at iniiwasang ipantay ito nang walang dahilan sa ibang salitang Hebreo para sa batas o utos.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: at isagawa ang mga ito
  rationale: Sa kontekstong legal, ang עשה ay tumutukoy sa aktuwal na pagsasagawa. Mas natural sa Tagalog ang “isagawa” kaysa literal na “gawin,” at nililinaw nitong hindi lamang pagkilala kundi pagtupad ang hinihingi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan na “Yahweh” sa halip na palitan ng isang titulo.
- source_word: מְקַדִּשְׁכֶם
  choice: na nagpapabanal sa inyo
  rationale: Ang Piel participle ng קדשׁ ay naglalarawan sa patuloy o katangiang gawain ni Yahweh na magbukod at gawing banal ang kanyang bayan. Pinananatili ng “nagpapabanal” ang mahalagang bokabularyo ng kabanalan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng מְקַדִּשְׁכֶם sa konteksto ng tipan
  choice: na nagpapabanal sa inyo
  alternative: na ginagawang banal kayo
  rationale: Pinananatili ng pangunahing salin ang ugnayan sa bokabularyo ng kabanalan, samantalang inilalahad sa talababa ang mas payak at malinaw na alternatibo. Hindi tinutukoy ng salin kung moral na pagbabago lamang o ritwal na pagbubukod lamang ang saklaw ng pagpapabanal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang maramihang “ninyo/inyo” ayon sa mga hulaping pangmaramihan sa Hebreo. Ang “mga tuntunin” at “isagawa” ay nagpapanatili sa legal at praktikal na diin ng talata nang hindi nagiging lipas o labis na teknikal.
