base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: tl
  text: Dapat kayong maging banal para sa akin, sapagkat ako, si Yahweh, ay banal; ibinukod ko kayo mula sa mga bayan[a] upang kayo’y maging akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bansa.” Ang Hebreong עַמִּים ay maaaring mangahulugang “mga bayan” o, sa ilang konteksto, “mga bansa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: Dapat kayong maging
  rationale: Sa kontekstong legal at tipan, ang anyong ito ay nagpapahayag ng hinihinging kalagayan na may puwersang pasaklaw o resulta. Likas sa makabagong Tagalog ang “Dapat kayong maging” at hindi nito ginagawang payak na hula lamang ang pahayag.
- source_word: לִי
  choice: para sa akin
  rationale: Ipinapahayag ng לִי ang kaugnayan at pag-aari. Sa unang sugnay, malinaw at natural ang “para sa akin,” samantalang sa huling sugnay ay mas angkop ang “maging akin.”
- source_word: קְדֹשִׁים / קָדוֹשׁ
  choice: banal
  rationale: Saklaw ng salitang Hebreo ang moral at rituwal na kabanalan at ang pagiging nakatalaga sa Diyos. Pinananatili ng “banal” ang buong bigat nito at ang tuwirang ugnayan ng kabanalan ng bayan sa kabanalan ni Yahweh.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng hinihinging kabanalan. Ang “sapagkat” ay malinaw, marangal, at likas sa ganitong pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: וָאַבְדִּל
  choice: Ibinukod ko
  rationale: Ang בדל ay nangangahulugang ihiwalay o ibukod. Pinananatili ng “ibinukod” ang pagkakaiba nito sa קדש na isinaling “banal,” habang ipinahihiwatig ang natapos na pagkilos ng Diyos na patuloy na mahalaga sa tipan.
- source_word: מִן הָעַמִּים
  choice: mula sa mga bayan
  rationale: Ang עַמִּים ay tumutukoy sa mga pangkat ng tao o mga bayan at hindi kinakailangang sa mga bansang pampolitika. Kaya mas malawak at mas malapit sa Hebreo ang “mga bayan.”
- source_word: לִהְיוֹת לִי
  choice: upang kayo'y maging akin
  rationale: Ipinapahayag ng pawatas at לִי ang layunin o bunga ng pagbubukod. Malinaw at natural sa Tagalog ang “upang kayo'y maging akin” at pinananatili nito ang wika ng pag-aari sa tipan.
theological_decisions:
- issue: Ang kabanalan ng Israel ay maaaring paliitin sa moral na kalinisan lamang o sa rituwal na pagkakahiwalay lamang.
  choice: Gamitin ang “banal” para sa קדש at “ibinukod” para sa בדל.
  alternative: Isalin ang קדש bilang “nakabukod” o gawing “malinis” ang pahayag.
  rationale: Magkaibang salita ang ginamit ng Hebreo para sa kabanalan at pagbubukod. Pinananatili ng salin ang kanilang pagkakaiba at ang tensiyon sa pagitan ng moral, rituwal, at tipanang mga diwa.
- issue: Paglalahad sa banal na pangalang יְהוָה.
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang taglay ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Dapat kayong maging” upang maipahayag ang puwersang tipanan ng unang pandiwa nang hindi ito gawing payak na hula. Hinati sa dalawang pangungusap para sa malinaw at natural na daloy, habang pinananatili ang lohikal na ugnayan ng kabanalan at pagbubukod.
