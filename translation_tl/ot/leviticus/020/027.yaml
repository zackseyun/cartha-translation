review_pass:
  verdict: revise
  source_fidelity: Ang draft ay wastong nagpapahayag ng parusang kamatayan, pagbato, at legal na pormula tungkol sa dugo. Gayunman, ang “sumasangguni sa mga espiritu” ay pandiwang parirala samantalang ang katambal nito ay isang katawagan para sa tao/kondisyon; dahil dito, hindi nito kasinglinaw na isinasalamin ang magkatambal na אוֹב at יִדְּעֹנִי. Ang “sarili nilang dugo” ay dagdag na pagbibigay-diin na wala sa Hebreo.
  naturalness: Hindi lubos na likas ang “isang lalaki o babae ay tagapamagitan ... o sumasangguni,” dahil hindi magkapantay ang dalawang panaguri. Mas malinaw at natural ang magkatambal na pangngalang “tagapamagitan ng mga espiritu o espiritista.” Ang “Babatuhin sila gamit ang mga bato” ay mas malinaw na Filipino kaysa “Babatuhin sila ng mga bato.”
  terminology: Ang “tagapamagitan ng mga espiritu” ay maingat na modernong katumbas ng medium sa kontekstong ito. Ang “espiritista” ay ginagamit bilang katawagan para sa taong kaugnay ng pakikipag-ugnayan sa mga espiritu; nililinaw ng talababa na hindi tiyak ang eksaktong saklaw at kaibhan ng sinaunang termino. Hindi nito ipinipilit ang isang tiyak na doktrinal na pagbasa.
  issues:
