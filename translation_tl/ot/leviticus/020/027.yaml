revisions:
- from: Kung ang isang lalaki o babae ay tagapamagitan sa mga espiritu[a] o sumasangguni sa mga espiritu[b], tiyak silang papatayin. Babatuhin sila ng mga bato. Nasa kanila ang sarili nilang dugo.[c]
  to: Kung ang isang lalaki o babae ay tagapamagitan ng mga espiritu[a] o espiritista[b], tiyak na papatayin sila. Babatuhin sila gamit ang mga bato. Nasa kanila ang kanilang dugo.[c]
  rationale: Inihanay ang dalawang katawagan bilang mga pangngalan para maipakita ang kanilang magkapares na gamit sa Hebreo at para maging malinaw ang sintaks sa modernong Filipino. Inalis ang “sarili” upang huwag magdagdag ng diin sa legal na pormula. Pinanatili ang tahasang lalaki/babae, ang pagpapalakas na “tiyak,” ang pagbato gamit ang mga bato, at ang metaporang tungkol sa dugo; ang leksikal na kawalan ng katiyakan sa mga katawagang okulto ay inilagay sa mga talababa.
