    issue: Hindi magkatulad ang anyo at tungkulin ng dalawang salin para sa אוֹב at יִדְּעֹנִי.
    rationale: Ang “tagapamagitan sa mga espiritu” ay pangngalang pantukoy sa tao, ngunit ang “sumasangguni sa mga espiritu” ay pandiwang paglalarawan. Ginagawang hindi malinaw nito kung ang ikalawang Hebreong termino ay isa ring katawagan para sa tao.
  - severity: low
    issue: May dagdag na “sarili” sa legal na pormula tungkol sa dugo.
    rationale: Ang דְּמֵיהֶם בָּם ay “ang kanilang dugo ay nasa kanila”; sapat ang literal na “Nasa kanila ang kanilang dugo,” habang ang legal na kahulugan ay nasa talababa.
  - severity: low
    issue: Maaaring malabo ang “Babatuhin sila ng mga bato.”
    rationale: Ang “gamit ang mga bato” ay tahasang nagmamarka sa mga bato bilang kasangkapan at pinananatili ang ekspresong Hebreo.
  revised_text: Kung ang isang lalaki o babae ay tagapamagitan ng mga espiritu[a] o espiritista[b], tiyak na papatayin sila. Babatuhin sila gamit ang mga bato. Nasa kanila ang kanilang dugo.[c]
