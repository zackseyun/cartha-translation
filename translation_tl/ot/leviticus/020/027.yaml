  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: tl
  text: Kung ang isang lalaki o babae ay tagapamagitan ng mga espiritu[a] o espiritista[b], tiyak na papatayin sila. Babatuhin sila gamit ang mga bato. Nasa kanila ang kanilang dugo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa “espiritu ng patay” o “pamilyar na espiritu” na kaugnay ng pakikipag-ugnayan sa mga patay; maaari rin itong tumukoy sa taong kumokonsulta rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “taong kumokonsulta sa mga espiritu.” Hindi ganap na tiyak ang eksaktong kaibhan nito sa naunang katawagang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Ang “Nasa kanila ang kanilang dugo” ay isang pormulang legal na nagsasaad na sila mismo ang may pananagutan sa kamatayang ipinataw sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: Kung ang isang lalaki o babae
  rationale: Pinananatili ang tahasang pagbanggit sa lalaki at babae. Ang panimulang וְ ay hindi kailangang isalin nang hiwalay sa Filipino, at likas na naipapahayag ng “kung” ang kondisyong ipinakikilala ng כִּי.
- source_word: כִּי יִהְיֶה בָהֶם
  choice: ay
  rationale: Sa Filipino, ang literal na “mayroon sa kanila” ay malabo at hindi likas. Ang panaguring “ay” ay maayos na nag-uugnay sa tao at sa katawagang tumutukoy sa gawaing espiritista, nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- source_word: אוֹב
  choice: tagapamagitan sa mga espiritu
  rationale: Ipinahahayag nito sa makabagong Filipino ang taong kaugnay ng pakikipag-ugnayan sa mga espiritu o patay. Iniiwasan nito ang malabo o di-likas na tuwirang hiram na salita, habang kinikilala sa talababa na maaari ring tumukoy ang terminong Hebreo sa espiritung kaugnay ng gayong gawain.
- source_word: יִדְּעֹנִי
  choice: sumasangguni sa mga espiritu
  rationale: Nagbibigay ito ng malinaw at likas na kahulugan sa Filipino para sa ikalawang katawagang okulto. Hindi ginamit ang “salamangkero,” na maaaring magpahiwatig ng makabagong pantasya at hindi ng pakikipagsanggunian sa espiritu.
- source_word: מוֹת יוּמָתוּ
  choice: tiyak silang papatayin
  rationale: Kinakatawan ng “tiyak” ang pagbibigay-diin ng infinitive absolute at finite verb sa Hebreo, at ipinakikita ng anyong balintiyak na parusang kamatayan ang tinutukoy.
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: Babatuhin sila ng mga bato
  rationale: Pinananatili ang tahasang pagbanggit sa bato bilang kasangkapan, kahit sapat na sana sa karaniwang Filipino ang pandiwang “babatuhin.”
- source_word: דְּמֵיהֶם בָּם
  choice: Nasa kanila ang sarili nilang dugo
  rationale: Pinananatili ang maikli at matalinghagang pormulang legal sa Hebreo sa halip na ilagay agad sa teksto ang pagpapaliwanag na sila ang may pananagutan sa kanilang kamatayan.
theological_decisions:
- issue: Pagpapakahulugan sa אוֹב at יִדְּעֹנִי bilang mga katawagang kaugnay ng mga espiritu
  choice: “tagapamagitan sa mga espiritu” at “sumasangguni sa mga espiritu”
  alternative: “espiritu ng patay” at “espiritung manghuhula,” o “mangkukulam” at “salamangkero”
  rationale: Ang konteksto ay isang batas laban sa ipinagbabawal na pakikipag-ugnayan sa mga espiritu, ngunit hindi ganap na tiyak ang sinaunang taksonomiya ng dalawang termino. Ang napiling salin ay malinaw sa ordinaryong mambabasa at hindi nagpapasya kung ang salita ay pangunahing tumutukoy sa espiritu, sa taong tagapamagitan, o sa kaugnay na gawain; inilalahad sa mga talababa ang tunay na leksikal na kalabuan.
- issue: Tahasan at magkahiwalay na pagbanggit sa dalawang kasarian
  choice: Panatilihin ang “isang lalaki o babae”
  alternative: “sinuman”
  rationale: Tahasan sa Hebreo ang lalaki at babae. Ang pagpapanatili sa pares ay tapat sa anyo ng pinagmulan at hindi nagdaragdag ng anumang denominasyonal na pagpapakahulugan.
- issue: Pormulang “ang kanilang dugo ay nasa kanila”
  choice: Panatilihin ang metapora sa pangunahing teksto
  alternative: “Sila ang may pananagutan sa sarili nilang kamatayan”
  rationale: Ang literal na pormula ay may legal at teolohikal na bigat at hindi dapat tahimik na gawing paliwanag lamang. Ipinaliliwanag ng talababa ang gamit nito nang hindi pinapalitan ang mismong larawan ng teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang mga naglalarawang katawagan sa halip na mga salitang maaaring magpahiwatig ng pantasya o isang tiyak na modernong sistemang espiritista. Pinanatili ang pag-uulit sa “babatuhin ... ng mga bato” at ang metaporang legal tungkol sa dugo upang manatiling malapit sa Hebreo.
