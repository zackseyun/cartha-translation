  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: tl
  text: 'Sabihin mo sa mga Israelita: Sinumang lalaki, Israelita man o dayuhang naninirahan sa Israel[a], na magbigay ng alinman sa kanyang mga supling[b] kay Molec[c] ay tiyak na papatayin. Babatuhin siya ng mga mamamayan ng lupain gamit ang mga bato.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “ang residenteng dayuhang naninirahan sa Israel.” Gumagamit ang Hebreo ng magkaugnay na pangngalan at pandiwa: literal, “ang dayuhang naninirahan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga supling” ay salin ng salitang Hebreo na literal na nangangahulugang “binhi” at tumutukoy rito sa mga anak o inapo.
    reason: lexical_alternative
  - marker: c
    text: Maaaring tumukoy ang Molec sa isang diyos na tradisyonal na iniuugnay sa paghahandog ng mga bata. Para sa ilang tagapagpaliwanag, ang salita ay tumutukoy sa isang uri ng handog sa halip na sa isang diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Likas at malinaw ito sa modernong Tagalog bilang tawag sa mga kabilang sa Israel, habang tapat sa tinutukoy ng Hebreong idyomang literal na “mga anak na lalaki ng Israel.”
- source_word: אִישׁ אִישׁ
  choice: ang sinumang lalaki
  rationale: Ipinahahayag nito ang distributibong diin ng inuulit na אִישׁ at pinananatili ang tahasang panlalaking anyo ng batas.
- source_word: הַגֵּר הַגָּר
  choice: mga dayuhang naninirahan
  rationale: Ipinakikita nito na ang גֵּר ay dayuhang nakatira sa pamayanan, hindi isang panandaliang bisita. Ginawang natural sa Tagalog ang magkaugnay na pangngalan at pandiwa ng Hebreo.
- source_word: יִתֵּן מִזַּרְעוֹ
  choice: magbigay ng isa sa kanyang mga supling
  rationale: Ang מִן ay may bahaging diwa (“isa mula sa”), at ang זֶרַע ay literal na “binhi” ngunit tumutukoy rito sa anak o inapo. Pinananatili ng “supling” ang lawak ng salita nang hindi nagpapasok ng detalyeng wala sa talata.
- source_word: לַמֹּלֶךְ
  choice: kay Molec
  rationale: Tinatrato sa pangunahing teksto ang Molec bilang pangalan o titulo ng pinatutungkulan, na siyang tuwirang tradisyonal na pagbasa; inilalahad sa talababa ang ibang posibilidad.
- source_word: מוֹת יוּמָת
  choice: tiyak na papatayin
  rationale: Nahuhuli nito ang matinding diin ng infinitive absolute na kasama ng pandiwang nasa passive at ang hudisyal na kahulugan ng hatol.
- source_word: עַם הָאָרֶץ
  choice: mga mamamayan ng lupain
  rationale: Pinananatili nito ang kongkretong pariralang Hebreo at tumutukoy sa pamayanang magsasagawa ng hatol, nang hindi ito ginagawang teknikal na uring panlipunan.
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: babatuhin siya
  rationale: Ang pandiwang “babatuhin” ay likas na nagpapahiwatig ng paggamit ng mga bato sa Tagalog at tapat sa paraang itinakda para isagawa ang hatol.
theological_decisions:
- issue: Kahulugan ng pagbibigay ng supling kay Molec
  choice: Pinanatili ang “magbigay ... kay Molec” nang walang idinagdag na paglalarawan ng ritwal.
  alternative: Isalin ito bilang paghahandog ng anak sa apoy o bilang isang uri ng handog na molek.
  rationale: Hindi tahasang binabanggit sa talatang ito ang apoy o ang buong anyo ng ritwal. Ang pangunahing salin ay nananatili sa sinasabi ng Hebreo, samantalang kinikilala sa talababa na maaaring pangalan ng diyos o katawagan sa isang uri ng handog ang מֹלֶךְ.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “mga Israelita” para sa likas na daloy, ngunit pinanatili ang “sinumang lalaki” upang huwag burahin ang panlalaking anyo ng Hebreo. Iniwasan ang pagpapaliwanag sa mismong talata ng mga detalyeng hindi tahasang naroon.
