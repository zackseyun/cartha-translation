revisions:
- from: Kung ang isang lalaki ay makipagtalik sa isang babaeng nasa karumihan dahil sa pagreregla at ilantad ang kahubaran nito—inilantad niya ang bukal nito,[a] at inilantad naman ng babae ang bukal ng sarili niyang dugo—kapuwa sila ititiwalag mula sa kanilang bayan.[b]
  to: Kung makipagtalik ang isang lalaki sa isang babaeng nasa karumihang dulot ng regla at ilantad ang kahubaran niya—sapagkat inilantad niya ang bukal ng babae,[a] at inilantad naman ng babae ang bukal ng kanyang dugo—kapuwa sila ay ihihiwalay mula sa kanilang bayan.[b]
  rationale: Pinalitan ang “ititiwalag” ng “ihihiwalay” upang mapanatili ang sinadyang hindi pagtukoy ng Hebreo sa paraan ng parusa. Nilinaw rin ang mga panghalip na tumutukoy sa babae, habang iningatan ang legal na rehistro, ang ritwal na dimensiyon ng pagreregla, at ang eupemismong “bukal.”
