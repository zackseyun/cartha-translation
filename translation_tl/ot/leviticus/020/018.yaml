  terminology: Nananatili ang “karumihang dulot ng regla” upang ipahiwatig ang ritwal na kalagayan. Pinananatili ang “ilantad ang kahubaran” bilang Levitical na idyoma at “bukal” bilang eupemismong Hebreo, na nililinaw sa talababa.
