  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: tl
  text: Kung makipagtalik ang isang lalaki sa isang babaeng nasa karumihang dulot ng regla at ilantad ang kahubaran niya—sapagkat inilantad niya ang bukal ng babae,[a] at inilantad naman ng babae ang bukal ng kanyang dugo—kapuwa sila ay ihihiwalay mula sa kanilang bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “inilantad niya ang bukal ng babae.” Ang “bukal” ay eupemismong Hebreo para sa pinagmumulan o pagdaloy ng dugo sa pagreregla.
    reason: lexical_alternative
  - marker: b
    text: Ang “ihihiwalay” ay pagsasalin ng karaniwang pormulang legal sa Torah na literal na “puputulin.” Hindi tinutukoy rito kung paano isinasagawa ang pag-aalis na ito mula sa bayan.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tumutukoy ang panlalaking anyong isahan sa lalaking kalahok sa gawaing inilalarawan.
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: makipagtalik sa isang babae
  rationale: Ang literal na 'humiga kasama ng babae' ay idyoma para sa pakikipagtalik; malinaw at natural ang salin sa modernong Tagalog.
- source_word: דָּוָה
  choice: nasa karumihan dahil sa pagreregla
  rationale: Ipinahahayag nito kapuwa ang pagreregla at ang ritwal na kalagayang mahalaga sa konteksto ng Levitico, nang hindi ito ipinapalagay na karaniwang karamdaman.
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: ilantad ang kahubaran nito
  rationale: Pinananatili ang karaniwang idyomang legal ng Levitico para sa seksuwal na paglalantad o pakikipagtalik.
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: inilantad niya ang bukal nito
  rationale: Ang מָקוֹר ay literal na 'bukal' o 'pinagmumulan' at ginagamit dito bilang eupemismo; pinananatili ng 'bukal' ang konkretong larawan at tunay na di-tuwirang pahayag ng Hebreo.
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: at inilantad naman ng babae ang bukal ng sarili niyang dugo
  rationale: Pinananatili ang pagkakapantay ng dalawang sugnay at mas tahasang isinasalin ang pagbanggit sa dugo sa ikalawang sugnay.
- source_word: וְנִכְרְתוּ
  choice: kapuwa sila ititiwalag
  rationale: Natural na pormulang legal sa Tagalog na nagsasaad ng pag-aalis mula sa bayan ngunit hindi tinutukoy kung ito ay kamatayan, pagpapatapon, o ibang paraan.
- source_word: מִקֶּרֶב עַמָּם
  choice: mula sa kanilang bayan
  rationale: Ang 'bayan' ay natural na tumutukoy sa nakapaloob na sambayanang tipan, hindi lamang sa isang lokal na komunidad.
theological_decisions:
- issue: Kalagayan ng babae sa דָּוָה
  choice: nasa karumihan dahil sa pagreregla
  alternative: nagreregla; may karamdaman o marumi
  rationale: Sa konteksto ng Levitico, ang tinutukoy ay regla bilang pinagmumulan ng ritwal na karumihan, hindi pangkalahatang sakit.
- issue: Kahulugan ng parusang וְנִכְרְתוּ
  choice: ititiwalag mula sa kanilang bayan
  alternative: papatayin; palalayasin sa pamayanan; aalisin
  rationale: Hindi tinutukoy ng pormulang Hebreo sa talatang ito ang paraan ng pag-aalis. Hindi nilulutas ng salin ang hindi tiyak na legal o teolohikal na detalye.
- issue: Eupemismong מָקוֹר
  choice: bukal
  alternative: pinagmumulan; agos
  rationale: Pinananatili ang metaporang Hebreo sa pangunahing teksto at ipinapaliwanag sa talababa ang reperensiya nito sa pagdaloy ng dugo.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na estilong legal. Ginamit ang 'makipagtalik' para sa kalinawan, habang pinanatili ang mga idyomang 'ilantad ang kahubaran' at 'bukal' upang maingatan ang anyo, eupemismo, at pag-uugnayan ng mga salita sa Levitico.
