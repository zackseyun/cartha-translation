  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: tl
  text: Kung ang isang lalaki ay makipagtalik sa isang hayop[a], tiyak na papatayin siya; at papatayin ninyo ang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ibigay ang kaniyang paghiga sa isang hayop,” isang Hebreong idyoma para sa pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na lalaki ang tinutukoy rito, at hiwalay na tinatalakay sa kasunod na talata ang babae.
- source_word: אֲשֶׁר
  choice: kung
  rationale: Bagaman panghalip na panugnay ang anyo nito, naghahayag ito rito ng kondisyon sa estilong legal.
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: makipagtalik
  rationale: Malinaw at likas na modernong Tagalog ito para sa Hebreong idyoma na literal na tumutukoy sa pagbibigay ng kaniyang pakikipaghiga.
- source_word: בִּבְהֵמָה
  choice: sa isang hayop
  rationale: Ang בְּהֵמָה ay tumutukoy sa hayop; sa Tagalog, likas na ginagamit ang 'sa' kasama ng pandiwang 'makipagtalik.'
- source_word: מוֹת יוּמָת
  choice: tiyak na papatayin siya
  rationale: Pinananatili ng 'tiyak' ang diin ng infinitive absolute na kasunod ng pandiwang nasa parehong ugat, samantalang ipinahahayag ng balintiyak ang kaparusahang kamatayan.
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: at papatayin din ninyo ang hayop
  rationale: Pinananatili ang ikalawang panauhang maramihan na tumutukoy sa mga inaatasang magpatupad ng batas; nililinaw ng 'din' na kapuwa ang lalaki at hayop ay papatayin.
theological_decisions:
- issue: Kasariang tinutukoy sa lumabag
  choice: 'tiyak sa lalaki: ''isang lalaki'''
  alternative: 'panlahat: ''isang tao'''
  rationale: Lalaki ang tahasang tinutukoy ng אִישׁ, samantalang hiwalay ang kaso ng babae sa kasunod na talata; hindi dapat palabuin ang estruktura at legal na katiyakan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, tuwiran, at marangal ang rehistro. Ginamit ang tahasang 'makipagtalik' sa halip na mas malabong 'sumiping' upang maipahayag nang wasto ang legal na ipinagbabawal.
