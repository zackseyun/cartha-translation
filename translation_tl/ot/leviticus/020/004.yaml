base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: tl
  text: Ngunit kung sadyang magbubulag-bulagan ang mga tao ng lupain sa taong iyon kapag ibinigay niya ang ilan sa kanyang mga anak kay Molek[a], upang hindi nila siya patayin,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Molek” ay maaaring pangalan o katawagan ng isang diyos o tumukoy sa isang uri ng ritwal na paghahandog ng bata. Bilang alternatibong pagbasa, maaari rin itong isaling “sa hari.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ
  choice: sadyang magbubulag-bulagan
  rationale: Ipinahahayag ng infinitive absolute na kasama ng pandiwa ang mariing at sinasadyang pagkilos. Ang “magbubulag-bulagan” ay likas na idyomang Filipino para sa kusang hindi pagpansin.
- source_word: עַם הָאָרֶץ
  choice: ang mga mamamayan ng lupain
  rationale: Tumutukoy ito sa sambayanan o populasyon ng lupain, hindi lamang sa isang uring panlipunan.
- source_word: אֶת עֵינֵיהֶם מִן הָאִישׁ הַהוּא
  choice: magbubulag-bulagan ... sa taong iyon
  rationale: Pinananatili ang larawang may kaugnayan sa mga mata habang natural na ipinahahayag sa Filipino ang sadyang hindi pagpansin o pagkilos laban sa lalaki.
- source_word: בְּתִתּוֹ מִזַּרְעוֹ
  choice: kapag ibinigay niya ang isa sa kanyang mga anak
  rationale: 'Partitibo ang מִן: ang tinutukoy ay isa o ilan mula sa kanyang supling, hindi kinakailangang lahat. Sa kontekstong ito, mas malinaw at natural ang “mga anak” kaysa literal na “binhi.”'
- source_word: לַמֹּלֶךְ
  choice: kay Molek
  rationale: Tinumbasan bilang pangalan o katawagan sa kultikong tumatanggap, alinsunod sa konteksto ng Levitico 18:21 at 20:2–5, nang hindi dinaragdagan ng paliwanag sa pangunahing teksto.
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: upang hindi nila siya patayin
  rationale: 'Malinaw na naipapahayag ang layunin o bunga ng kanilang pagkukunwaring hindi nakakakita: hindi nila ipatutupad ang itinakdang hatol na kamatayan.'
theological_decisions:
- issue: Pagpapakahulugan sa לַמֹּלֶךְ
  choice: kay Molek
  alternative: sa hari
  rationale: Bagaman maaaring makabuo ang mga katinig ng pagbasa na “sa hari,” matibay na itinuturo ng agarang kontekstong kultiko ang Molek bilang pangalan o katawagan. Inilalagay sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “magbubulag-bulagan” upang mapanatili ang idyoma ng Hebreo at ang diwa ng sinasadyang hindi pagpansin; pinanatili rin ang nakabiting pangungusap dahil nagpapatuloy ang kondisyon sa kasunod na talata.
