  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: tl
  text: Kung ang isang lalaki ay mangalunya sa asawa ng ibang lalaki—kung mangalunya siya sa asawa ng kanyang kapwa—tiyak na papatayin ang lalaking nangalunya at ang babaeng nangalunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “sa asawa ng isang lalaki ... sa asawa ng kanyang kapwa.” Ang pag-uulit ay nagbibigay-diin at paglilinaw sa pagkakasala ayon sa estilong legal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Kung ang isang lalaki
  rationale: Sa pormulang legal na ito, ang pangatnig at panandang kaugnay ay bumubuo ng isang kondisyunal na kaso. Likas sa makabagong Tagalog ang “Kung ang isang lalaki.”
- source_word: יִנְאַף
  choice: mangalunya
  rationale: Tiyak na tumutukoy ang pandiwang נאף sa pangangalunya, kaya hindi ito pinalawak tungo sa pangkalahatang seksuwal na imoralidad.
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: sa asawa ng ibang lalaki
  rationale: Literal itong “sa asawa ng isang lalaki.” Ipinahihiwatig ng “ibang lalaki” na ang babae ay asawa ng lalaking iba sa gumagawa ng kasalanan.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: asawa ng kanyang kapwa
  rationale: Ang רֵעַ ay tumutukoy sa kapwa o kasamahan sa pamayanan, hindi lamang sa taong nakatira sa katabing bahay.
- source_word: מוֹת יוּמַת
  choice: tiyak na papatayin
  rationale: Pinananatili nito ang mariing puwersa ng infinitive absolute kasama ng pandiwang pasibo, nang hindi nagdaragdag ng paraan ng pagpatay.
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: ang lalaking nangalunya at ang babaeng nangalunya
  rationale: Malinaw at simetrikong ipinapahayag nito ang panlalaki at pambabaeng substantibong participle, at mas madaling maunawaan kaysa sa bihirang katawagang “mangangalunya” bilang pangngalan.
theological_decisions:
- issue: Wikang may tiyak na kasarian sa batas
  choice: Pinanatili ang “lalaki” at ang tahasang pagtukoy sa lalaking nangalunya at babaeng nangalunya.
  alternative: Kung may sinumang mangalunya... kapwa sila papatayin.
  rationale: Tiyak ang kasarian sa paglalarawan ng kaso at sa pagtukoy sa dalawang nagkasala sa Hebreo; hindi ito ginawang neutral.
- issue: Pormula ng parusang kamatayan
  choice: “tiyak na papatayin” nang walang tinukoy na paraan
  alternative: “dapat bitayin” o ibang tiyak na paraan ng pagpatay
  rationale: Mariing itinatakda ng teksto ang kamatayan bilang parusa, ngunit walang binabanggit na paraan sa talatang ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng Hebreo para sa legal na diin; ginamit ang “kapwa” sa malawak na kahulugang kasapi ng pamayanan.
