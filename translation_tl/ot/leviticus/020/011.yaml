  source_fidelity: Tumpak na naihahatid ang kondisyunal na kasong legal, ang tahasang panlalaking paksa, ang seksuwal na kahulugan ng שכב, ang malawak na pariralang “asawa ng kanyang ama,” ang idyomang “kahubaran ng kanyang ama,” ang mariing hatol na kamatayan, at ang pormulang nag-uukol ng pananagutan sa mga lumabag.
