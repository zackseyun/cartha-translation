  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: tl
  text: Kung ang isang lalaki ay sumiping sa asawa ng kanyang ama, inilantad niya ang kahubaran ng kanyang ama[a]. Silang dalawa ay tiyak na papatayin; nasa kanila ang pananagutan sa sarili nilang kamatayan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “inilantad niya ang kahubaran ng kanyang ama.” Isa itong nakapirming idyoma sa Levitico para sa ipinagbabawal na pakikipagtalik; maaari rin itong unawain bilang seksuwal na paglapastangan sa kanyang ama.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nasa kanila ang kanilang dugo,” isang pormulang legal na nagsasaad na sila mismo ang may pananagutan sa hatol na kamatayan.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: Kung ang isang lalaki ay
  rationale: Sa kontekstong legal, ang pangatnig, pangngalan, at pang-ugnay ay bumubuo ng kondisyunal na kaso. Pinananatili ng “isang lalaki” ang tiyak na panlalaking paksa ng Hebreo.
- source_word: יִשְׁכַּב אֶת
  choice: sumiping sa
  rationale: Karaniwang magalang ngunit malinaw na idyomang Filipino para sa pakikipagtalik; ang aspektong naganap ay angkop sa kondisyunal na sugnay.
- source_word: אֵשֶׁת אָבִיו
  choice: asawa ng kanyang ama
  rationale: Tuwirang pinananatili ang saklaw ng Hebreo at hindi ito pinakikitid sa “madrasta,” na isang mas tiyak na katawagang hindi ginamit sa teksto.
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: inilantad niya ang kahubaran ng kanyang ama
  rationale: Pinananatili ang nakapirming idyoma ng Levitico at ang kaugnayan nito sa ibang mga batas ukol sa ipinagbabawal na pakikipagtalik.
- source_word: מוֹת יוּמְתוּ
  choice: tiyak na papatayin
  rationale: Ipinahahayag ang diin ng infinitive absolute at pandiwang finite nang hindi nagdaragdag ng paraan ng pagpatay.
- source_word: שְׁנֵיהֶם
  choice: Silang dalawa
  rationale: Malinaw na pinananatiling kapwa kalahok ang sakop ng parusa.
- source_word: דְּמֵיהֶם בָּם
  choice: nasa kanila ang pananagutan sa sarili nilang kamatayan
  rationale: 'Isinasalin ang legal na diwa ng idyoma sa likas at nauunawaang Filipino: sila mismo ang may pananagutan sa hatol na kamatayan.'
theological_decisions:
- issue: Paglalahad sa idyoma ng seksuwal na paglabag
  choice: inilantad niya ang kahubaran ng kanyang ama
  alternative: nilapastangan niya ang kanyang ama sa pamamagitan ng pakikipagtalik
  rationale: Ang mas pormal na salin ay nagpapanatili sa sadyang tayutay at ugnayang intertekstuwal ng Kodigo ng Kabanalan, sa halip na agad itong ipaliwanag sa pangunahing teksto.
- issue: Kasariang tinutukoy ng legal na paksa
  choice: isang lalaki
  alternative: sinuman
  rationale: Tiyak na panlalaking isahan ang אִישׁ at lalaki ang inilalarawang gumagawa ng paglabag; hindi ito dapat gawing neutral ang kasarian.
- issue: Legal na pormulang דְּמֵיהֶם בָּם
  choice: nasa kanila ang pananagutan sa sarili nilang kamatayan
  alternative: nasa kanila ang kanilang dugo
  rationale: Ang literal na anyo ay malabo at di-likas sa modernong Filipino. Pinananatili ng salin ang legal na kahulugan nang hindi ipinapalagay kung sino ang magsasagawa ng hatol.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “sumiping” upang maging magalang ngunit sapat na tiyak, at pinanatili sa pangunahing teksto ang idyomang “inilantad ... ang kahubaran” dahil mahalaga ito sa pananalita at mga ugnayan sa loob ng Levitico.
