  text: 'except for his close relative who is nearest to him: for his mother[a], for his father, for his son, for his daughter, and for his brother—'
translation:
  language: tl
  text: 'maliban sa kanyang pinakamalapit na kamag-anak[a]: ang kanyang ina, kanyang ama, kanyang anak na lalaki, kanyang anak na babae, at kanyang kapatid na lalaki—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שְׁאֵר ay literal na may diwang “laman” o “kamag-anak”; kaya maaari rin itong isaling “kadugo” o “kaanak sa laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: maliban kung para sa
  rationale: Sa kontekstong legal, nagpapakilala ito ng eksepsiyon sa pagbabawal sa naunang talata; isinama ang “para sa” upang maging natural ang ugnayan sa kasunod na talaan.
- source_word: שְׁאֵרוֹ
  choice: niyang kamag-anak
  rationale: Ang שְׁאֵר ay tumutukoy sa kaanak at literal na may diwang “laman”; malinaw at natural sa modernong Tagalog ang “kamag-anak,” habang ipinaliliwanag sa talababa ang literal na larawan.
- source_word: הַקָּרֹב אֵלָיו
  choice: pinakamalapit
  rationale: Ipinahahayag nito ang lapit ng ugnayang pampamilya, hindi lamang pisikal na lapit.
- source_word: לְאִמּוֹ
  choice: para sa kanyang ina
  rationale: Ang לְ ay tumutukoy sa taong dahil sa kanya ay pinahihintulutan ang pagpapakarumi sa mas malawak na pangungusap.
- source_word: וּלְאָבִיו
  choice: para sa kanyang ama
  rationale: Pinananatili ang inuulit na preposisyong לְ upang luminaw ang legal na pag-iisa-isa.
- source_word: וְלִבְנוֹ
  choice: para sa kanyang anak na lalaki
  rationale: Tahasang ipinapakita ang kasariang panlalaki ng בֵּן sa talaan ng mga kaanak.
- source_word: וּלְבִתּוֹ
  choice: para sa kanyang anak na babae
  rationale: Tahasang ipinapakita ang kasariang pambabae ng בַּת sa talaan ng mga kaanak.
- source_word: וּלְאָחִיו
  choice: at para sa kanyang kapatid na lalaki
  rationale: Sa literal na talaang ito ng pagkakamag-anak, ang אָח ay tumutukoy sa kapatid na lalaki.
