  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Pinanatili ang anyong putol sa dulo dahil nagpapatuloy ang pangungusap mula sa naunang talata at papunta sa kasunod. Inulit ang “para sa” upang katawanin ang magkakasunod na לְ sa Hebreo at panatilihing malinaw ang legal na talaan.
