  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: tl
  text: Ituring mo siyang banal, sapagkat siya ang naghahandog ng pagkain ng iyong Diyos.[a] Magiging banal siya sa iyo, sapagkat akong si Yahweh, na nagpapabanal sa inyo, ay banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay ng iyong Diyos.” Dito, malamang na mas malawak na tumutukoy ang “tinapay” sa mga handog na pagkain na inihaharap sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: Ituring mo siyang banal
  rationale: Ang Piel ng קדשׁ na may hulaping layon ay nangangahulugang kilalanin at italaga ang isang tao bilang banal. Likas sa modernong Tagalog ang “ituring ... na banal” at pinananatili nito ang utos sa isahang kausap.
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: pagkain ng iyong Diyos
  rationale: Bagaman karaniwang “tinapay” ang לֶחֶם, sa kontekstong panghain ay mas malawak itong tumutukoy sa mga handog na pagkain. Inilagay sa talababa ang literal na anyo upang mapanatili ang leksikal na posibilidad.
- source_word: מַקְרִיב
  choice: naghahandog
  rationale: Ang Hiphil participle ng קרב ay tumutukoy sa paghaharap o paghahandog ng hain. Ang “naghahandog” ang malinaw at likas na katawagang pangkulto sa Tagalog.
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: Dapat siyang maging banal sa paningin mo
  rationale: Ipinahahayag ng parirala ang katayuan ng pari kaugnay ng kausap. Ang “sa paningin mo” ay likas na Tagalog para sa relational na לְ at hindi nagpapahiwatig na ang tao ang pinagmumulan ng kabanalan ng pari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מְקַדִּשְׁכֶם
  choice: na nagpapabanal sa inyo
  rationale: Ang “nagpapabanal” ay likas at malinaw na salin ng participle at pinananatili ang ugnayang leksikal sa “banal” na inuulit sa talata.
theological_decisions:
- issue: Saklaw ng kultikong pariralang לֶחֶם אֱלֹהֶיךָ
  choice: pagkain ng iyong Diyos
  alternative: tinapay ng iyong Diyos
  rationale: Sa konteksto ng paglilingkod ng pari, malamang na tumutukoy ito nang mas malawak sa mga handog na pagkain, ngunit pinanatili sa talababa ang literal na “tinapay.”
- issue: Paulit-ulit na wikang-ugat ng קדשׁ
  choice: banal / nagpapabanal
  alternative: itinalaga / nagtatalaga bilang banal
  rationale: 'Pinananatili ng “banal” at “nagpapabanal” ang teolohikal at leksikal na pagkakaugnay: dapat kilalaning banal ang pari, banal si Yahweh, at si Yahweh ang nagpapabanal sa bayan.'
- issue: Bilang ng kausap sa talata
  choice: isahang “mo/iyong,” pagkatapos ay maramihang “inyo”
  alternative: gawing maramihan ang lahat ng panghalip para sa estilistikong pagkakapareho
  rationale: Pinananatili ang tunay na pagbabago ng Hebreo mula sa pang-isahang kausap sa וְקִדַּשְׁתּוֹ, אֱלֹהֶיךָ, at לָּךְ tungo sa maramihan sa מְקַדִּשְׁכֶם, sa halip na pakinisin ang tensiyong panggramatika.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang isahang “mo/iyong” at maramihang “inyo” ayon sa pagbabago ng bilang sa tekstong Hebreo. Iniwasan ang sobrang teknikal na “konsagrahin,” habang pinanatili ang sentrong pag-uulit ng “banal.”
