  text: And he shall take a wife in her virginity[a].
translation:
  language: tl
  text: At kukuha siya ng isang babaeng birhen bilang asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniyang pagkabirhen.” Sa Hebreo, literal na “sa kaniyang pagkabirhen.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: At ... siya
  rationale: Pinananatili ng “At” ang pagpapatuloy ng diskurso, at malinaw na ipinahahayag ng “siya” ang simuno nang hindi labis ang pagdidiin.
- source_word: אִשָּׁה
  choice: isang babae bilang asawa
  rationale: Maaaring mangahulugan ang אִשָּׁה ng “babae” o “asawa.” Sa konteksto ng pag-aasawa, likas sa Filipino ang “kumuha ng isang babae bilang asawa,” na malinaw na naghahatid sa diwang pangmag-asawa.
- source_word: בִּבְתוּלֶיהָ
  choice: habang ito ay birhen
  rationale: Ipinahahayag nito ang kalagayan ng babae sa pagkuha sa kaniya bilang asawa. Mas natural ito sa modernong Filipino kaysa sa literal na “sa kaniyang pagkabirhen,” habang pinananatili ang sanggunian sa kaniyang pagiging birhen.
- source_word: יִקָּח
  choice: kukuha
  rationale: Pinananatili ang karaniwang Hebreong idyoma ng “pagkuha” ng asawa at ang legal na himig ng talata; nililinaw ng “bilang asawa” ang kahulugang pag-aasawa.
theological_decisions:
- issue: Pananalita tungkol sa pag-aasawa sa batas para sa mga pari
  choice: Panatilihin ang idyomang “kukuha ... bilang asawa” sa halip na gawing “mag-aasawa” lamang.
  alternative: Mag-aasawa siya ng isang birhen.
  rationale: Ang pormulang legal ng Hebreo ay gumagamit ng “kumuha” sa konteksto ng pag-aasawa. Pinananatili ng salin ang tekstuwal na anyo ngunit nililinaw ito sa natural na Filipino sa pamamagitan ng “bilang asawa.”
translation_notes:
  register: Modernong Filipino na may marangal at legal na himig. Ginamit ang “habang ito ay birhen” para sa malinaw at likas na pagpapahayag; inilagay sa talababa ang mas literal na anyo.
