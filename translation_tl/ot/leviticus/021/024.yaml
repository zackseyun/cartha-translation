  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: tl
  text: Kaya nagsalita si Moises kay Aaron, sa mga anak na lalaki ni Aaron, at sa lahat ng mga anak ni Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak na lalaki ni Israel” ang Hebreo; isa itong karaniwang tipanang katawagan para sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kaya nagsalita si Moises
  rationale: Isinusulong ng waw-consecutive ang salaysay, at sa pangwakas na talatang ito ay likas na ipinahihiwatig ng “Kaya” ang buod o kinalabasan ng naunang tagubilin.
- source_word: אֶל
  choice: kay / sa
  rationale: Tinutukoy ng pang-ukol ang mga kinausap ni Moises; “kay” ang likas para sa pangalang pantangi at “sa” para sa maramihang pangkat.
- source_word: בָּנָיו
  choice: mga anak niyang lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo at tumutukoy sa mga anak na lalaki ni Aaron, kaya hindi ito ginawang pangkalahatang “mga anak” lamang.
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang ipinahahayag ang kabuuan ng kasunod na pangkat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong tipanang katawagan habang natural pa rin sa marangal na Tagalog; ipinaliliwanag sa talababa ang karaniwang kolektibong kahulugan nito.
theological_decisions:
- issue: Pagpapahayag sa tipanang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; ayon sa literal na anyong panlalaki, mga anak na lalaki ni Israel
  rationale: Walang kinakailangang paglutas sa usaping doktrinal. Pinananatili ng pangunahing teksto ang nakaugaliang Hebreong pormula, samantalang nililinaw ng talababa na ginagamit ito bilang kolektibong katawagan sa bayan ng Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anak niyang lalaki” para sa tiyak na mga anak na lalaki ni Aaron, ngunit “mga anak ni Israel” bilang kinikilalang kolektibong katawagan, na may paliwanag sa talababa.
