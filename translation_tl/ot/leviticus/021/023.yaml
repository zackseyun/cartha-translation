id: LEV.21.23
reference: Leviticus 21:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: tl
  text: Subalit hindi siya dapat pumasok hanggang sa tabing[a] ni lumapit sa altar, sapagkat may kapintasan sa kanya[b], upang hindi niya lalapastanganin ang aking mga banal na dako[c]; sapagkat ako si Yahweh na nagpapabanal sa mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tabing” ay ang sagradong kurtina sa santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “kapintasan” ay pisikal na kalagayang nag-aalis ng kuwalipikasyon para sa ganitong paglapit bilang pari; hindi ito tumutukoy sa moral na kasalanan o sa halaga ng tao.
    reason: contextual_clarification
  - marker: c
    text: Literal na “aking mga santuwaryo” o “aking mga banal na dako,” na nasa anyong maramihan sa Hebreo. Ang “mga ito” sa huling parirala ay pinakamalamang na tumutukoy sa mga banal na dakong ito, bagaman maaari itong unawain nang mas malawak na tumutukoy sa mga pari o sa bayan.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַךְ
  choice: Subalit
  rationale: Ipinakikita nito ang paghihigpit na kasunod ng pahintulot sa naunang talata at natural itong adversative sa makabagong Tagalog.
- source_word: הַפָּרֹכֶת
  choice: ang tabing
  rationale: Tumutukoy ito sa sagradong tabing sa santuwaryo; malinaw at natural ang “tabing” sa Tagalog.
- source_word: יָבֹא ... וְאֶל הַמִּזְבֵּחַ לֹא יִגַּשׁ
  choice: hindi siya maaaring lumapit sa tabing o sa altar
  rationale: Pinagsama sa natural na Tagalog ang magkaugnay na pagbabawal sa paglapit sa tabing at altar. Ang “maaaring” ay nagpapahayag ng legal na kawalan ng pahintulot, hindi kawalan ng pisikal na kakayahan.
- source_word: מוּם בּוֹ
  choice: may kapintasan siya
  rationale: Ang מוּם ay pisikal na kapintasan na nag-aalis ng kuwalipikasyon para sa partikular na paglilingkod bilang pari; hindi ito moral na kasalanan. Nililinaw ito sa talababa.
- source_word: יְחַלֵּל
  choice: lalapastanganin
  rationale: Ipinahahayag nito ang pagtrato bilang karaniwan sa isang bagay na banal, ang mahalagang pagsalungat sa bokabularyo ng kabanalan sa talata.
- source_word: מִקְדָּשַׁי
  choice: aking mga banal na dako
  rationale: Pinananatili nito ang tahasang anyong maramihan ng Hebreo nang hindi ipinapalagay na iisang gusali lamang ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: מְקַדְּשָׁם
  choice: na nagpapabanal sa mga iyon
  rationale: Pinananatili ang bokabularyo ng kabanalan at ang panghalip na maramihan; pinakamalapit na tinutukoy nito ang “mga banal na dako.”
theological_decisions:
- issue: Kahulugan ng מוּם sa batas para sa mga pari
  choice: Pisikal na kapintasan na naghihigpit sa partikular na paglapit bilang pari
  alternative: Moral na kasalanan o pahayag tungkol sa halaga ng tao
  rationale: Ang konteksto ay ritwal at pangserbisyong kuwalipikasyon, hindi moral na paghatol o pagsukat sa dignidad ng tao.
- issue: Tinutukoy ng hulaping panghalip sa מְקַדְּשָׁם
  choice: Ang “mga iyon” ay tumutukoy sa “aking mga banal na dako”
  alternative: Maaari itong iugnay nang mas malawak sa mga pari o sa bayan
  rationale: Ang pinakamalapit na gramatikal na antecedent ay ang maramihang מִקְדָּשַׁי, ngunit binabanggit sa talababa ang mas malawak na posibleng pagtukoy upang hindi itago ang kaunting kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Subalit” para sa legal na paghihigpit, “tabing” para sa kultikong kurtina, at “lalapastanganin” upang mapanatili ang diin sa kabanalan. Iniwasan ang pananalitang magpapahiwatig na moral na kasalanan o mababang dignidad ang pisikal na kapintasan.
