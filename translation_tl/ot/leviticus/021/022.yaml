  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: tl
  text: Maaari siyang kumain ng pagkain ng kanyang Diyos[a], mula sa mga pinakabanal na bagay at mula sa mga banal na bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay ng kanyang Diyos.” Dito, ang “tinapay” ay idyomatikong tumutukoy sa mga bahaging pagkaing nakalaan sa mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: pagkain
  rationale: Bagaman literal na “tinapay,” mas malawak ang kahulugan nito sa kontekstong panghandog at tumutukoy sa mga bahaging pagkaing nakalaan sa mga pari.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Pinananatili nito ang panghalip na tumutukoy sa pari at ang ugnayang ipinahahayag ng Hebreo.
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: mula sa mga kabanal-banalan
  rationale: Ang pariralang Hebreo ay karaniwang pasukdol na tumutukoy sa pinakamataas na antas ng mga banal na bagay; natural at maikli itong naipapahayag ng “mga kabanal-banalan.”
- source_word: וּמִן הַקֳּדָשִׁים
  choice: at mula sa mga banal na bagay
  rationale: Pinananatili nito ang kaibahan sa naunang uring kabanal-banalan at ang leksikal na kaugnayan ng dalawang katawagan.
- source_word: יֹאכֵל
  choice: maaari siyang kumain
  rationale: 'Sa batas na ito, nagpapahayag ang pandiwa ng pahintulot: bagaman may limitasyon ang pari, pinahihintulutan pa rin siyang kumain ng mga banal na bahagi.'
theological_decisions:
- issue: Lakas ng legal na imperfect na יֹאכֵל
  choice: pahintulot (“maaari siyang kumain”)
  alternative: payak na hinaharap (“kakain siya”) o obligasyon (“dapat siyang kumain”)
  rationale: Ipinakikita ng konteksto ang kaibahan ng ipinagbabawal sa paring may kapansanan at ng nananatiling ipinahihintulot sa kanya. Hindi nito ginagawang tungkulin ang pagkain.
translation_notes:
  register: Makabago at dignidad na Filipino; ginamit ang “maaari” para sa legal na pahintulot at pinanatili ang magkaibang antas ng kabanalan nang hindi tahasang nililimitahan ang mga ito sa mga handog.
