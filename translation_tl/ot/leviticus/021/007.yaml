  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: tl
  text: Hindi sila dapat mag-asawa ng babaeng prostituta o nadungisan[a]. Hindi rin sila dapat mag-asawa ng babaeng hiniwalayan ng kanyang asawa, sapagkat banal siya sa kanyang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “nilapastangan” o “itinuring na di-marapat,” lalo na sa konteksto ng pagiging karapat-dapat mapangasawa ng isang pari.
    reason: Nililinaw ang saklaw at leksikal na kalabuan ng חֲלָלָה nang hindi ito itinutumbas sa isang tiyak na uri lamang ng moral o seksuwal na karumihan.
lexical_decisions:
- source_word: זֹנָה (zonah)
  choice: babaeng nagbebenta ng aliw
  rationale: Tuwirang ipinapahayag ang kahulugang ‘prostitute’ sa natural at dignified na modernong Filipino.
- source_word: חֲלָלָה (chalalah)
  choice: nadungisan
  rationale: Pinananatili ang ideya ng isang babaeng itinuring na defiled o profaned, habang inilalahad sa talababa ang mas tiyak na saklaw nito sa konteksto ng pagiging karapat-dapat sa pag-aasawa ng pari.
- source_word: יִקָּחוּ (yiqqachu)
  choice: mag-asawa
  rationale: Bagaman literal na ‘kumuha,’ sa kontekstong ito ang pandiwa ay tumutukoy sa pagkuha ng babae bilang asawa; mas malinaw at natural ang ‘mag-asawa’ sa Filipino.
- source_word: גְּרוּשָׁה מֵאִישָׁהּ (gerushah me’ishah)
  choice: babaeng hiniwalayan ng asawa nito
  rationale: Sinusundan ang anyo ng Hebreo, na literal na nagsasabing ang babae ay pinaalis o hiniwalayan mula sa kanyang asawa.
- source_word: קָדֹשׁ הוּא לֵאלֹהָיו (qadosh hu le’lohayw)
  choice: banal siya sa kanyang Diyos
  rationale: Pinananatili ang biglang paglipat mula sa maramihang paksa tungo sa isahan, na maaaring tumukoy sa bawat pari nang paisa-isa.
theological_decisions:
- issue: Kahulugan ng חֲלָלָה sa mga tuntunin para sa pag-aasawa ng pari
  choice: nadungisan, na may paliwanag sa talababa
  alternative: nilapastangan; di-marapat pakasalan ng pari
  rationale: Hindi tiyak na isang pangkalahatang moral na paghatol lamang ang salita; maaari itong tumukoy sa katayuang naparumi o nawalan ng karapat-dapat na katayuan sa kontekstong pari. Pinananatili ng salin at talababa ang saklaw na ito nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Paglipat mula sa maramihan patungo sa isahan
  choice: pinanatili ang ‘siya’
  alternative: ‘bawat pari’ o maramihang ‘sila’
  rationale: Ang Hebreo ay gumagamit muna ng maramihang pandiwa at pagkatapos ay isahang panghalip. Ang pagpapanatili sa isahan ay hindi nagtatakip sa gramatikal na tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mag-asawa’ sa halip na literal na ‘kumuha’ dahil malinaw na pag-aasawa ang tinutukoy. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
