revisions:
- from: Hindi sila dapat mag-asawa ng babaeng nagbebenta ng aliw o nadungisan[a]. Hindi rin sila dapat mag-asawa ng babaeng hiniwalayan ng asawa nito, sapagkat banal siya sa kanyang Diyos.
  to: Hindi sila dapat mag-asawa ng babaeng prostituta o nadungisan[a]. Hindi rin sila dapat mag-asawa ng babaeng hiniwalayan ng kanyang asawa, sapagkat banal siya sa kanyang Diyos.
  rationale: Pinalitan ang eupemismong “nagbebenta ng aliw” ng tuwirang “prostituta,” na mas tapat sa זֹנָה at nananatiling marangal sa modernong Filipino. Nilinaw rin ang panghalip sa pariralang tumutukoy sa babaeng hiniwalayan ng kanyang asawa. Pinanatili ang “nadungisan” at ang talababa upang huwag paliitin ang pinagtatalunang saklaw ng חֲלָלָה, gayundin ang isahang “siya” sa huling sugnay.
