  naturalness: Marangal at madaling unawain ang pangungusap. Mas malinaw at natural sa makabagong Filipino ang “babaeng prostituta” kaysa “babaeng nagbebenta ng aliw” sa tekstong ito, at “kanyang asawa” kaysa “asawa nito.”
  terminology: Ang “prostituta” ay tuwirang katumbas ng זֹנָה nang walang di-kailangang eupemismo. Ang “nadungisan” ay maaaring panatilihin para sa חֲלָלָה, na may talababa upang ipakita ang saklaw na “profaned/defiled” at maiwasang igiit ang isang partikular na pagpapakahulugan. Ang “banal ... sa kanyang Diyos” ay angkop para sa קָדֹשׁ ... לֵאלֹהָיו.
