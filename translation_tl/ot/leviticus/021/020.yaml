  source_fidelity: 'Tapat ang pangunahing talaan sa Hebreo: napananatili ang anim na alternatibong kondisyon, ang paulit-ulit na “o,” at ang tuwirang pagtukoy sa pinsala sa ari. Gayunman, ang “may makating sakit sa balat” ay nagdaragdag ng “sakit sa balat” sa mas maigsi at di-tiyak na גָרָב; mas malapit ang “may galis” ngunit nangangailangan ng talababa upang hindi ipahiwatig ang tiyak na modernong diagnosis. Ang “langib” para sa יַלֶּפֶת ay katanggap-tanggap bilang malawak na paglalarawan ng scabs/eruptive skin condition.'
  naturalness: Natural at malinaw ang Filipino, ngunit mas magaan at mas matalinghaga ang paralelismo kung “may galis” ang una sa dalawang kondisyon sa balat. Ang “durog na mga bayag” ay tuwiran at nauunawaan, ngunit ang “durog ang mga bayag” ay mas natural na predikadong anyo kasunod ng “may kapansanan.”
  terminology: Ang “kuba,” “bansot,” at “kapansanan sa mata” ay angkop at hindi nagpapanggap ng diagnosis. Ang “galis” ay karaniwang katumbas ng itch/scab disease, ngunit hindi dapat tratuhing eksaktong medikal na diagnosis; nililinaw ito ng talababa. Ang “mga bayag” ay karaniwan at malinaw na anatomikong salita sa modernong Filipino; ang rehistro ay tuwiran nang walang moral na paghatol.
