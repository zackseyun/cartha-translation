base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: tl
  text: o kuba[a], o bansot[b], o may kapansanan sa mata[c], o may galis[d], o may langib[d], o durog ang mga bayag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baluktot ang likod.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang salitang Hebreo na isinaling “bansot”; maaari rin itong tumukoy sa katawang hindi lumaki nang normal o labis na nangayayat.
    reason: lexical_alternative
  - marker: c
    text: O “may batik sa mata”; hindi tiyak ang eksaktong uri ng kapansanan sa mata.
    reason: lexical_alternative
  - marker: d
    text: Malamang na tumutukoy ang dalawang salitang Hebreo rito sa magkaibang sakit sa balat; hindi tiyak ang katumbas ng mga ito sa makabagong medisina.
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: kuba
  rationale: Tumutukoy sa kapansanan o pagkakakuba ng likod; ang “kuba” ay tuwiran, natural, at madaling maunawaan sa modernong Filipino.
- source_word: דַק
  choice: bansot
  rationale: Hindi tiyak ang salita at maaaring tumukoy sa katawan na hindi lumaki nang normal o nangayayat. Ang “bansot” ang maikli at malamang na kahulugan sa talaang ito, habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: may kapansanan sa mata
  rationale: Hindi matiyak ang espesipikong kondisyon ng mata; iniiwasan ng pangkalahatang salin ang maling katiyakán gaya ng “katarata” o “batik.”
- source_word: גָרָב
  choice: may makating sakit sa balat
  rationale: Tumutukoy sa isang makati o namamagang sakit sa balat, ngunit hindi matiyak ang katumbas nitong modernong diagnosis.
- source_word: יַלֶּפֶת
  choice: may langib
  rationale: Isa pang natatanging kondisyon sa balat. Pinananatili ng “langib” ang pagkakaiba nito sa naunang termino nang hindi nagbibigay ng tiyak na modernong diagnosis.
- source_word: מְרוֹחַ אָשֶׁךְ
  choice: may durog na mga bayag
  rationale: Tuwirang tumutukoy ang parirala sa napinsala o nadurog na mga testicle; ang “mga bayag” ay malinaw at karaniwang katawagang anatomiko sa Filipino.
- source_word: אוֹ
  choice: o
  rationale: Inuulit na pangatnig na naghihiwalay sa bawat kondisyon sa talaan; palagiang isinalin bilang “o.”
theological_decisions:
- issue: Paglalarawan sa mga kondisyon ng katawan sa batas tungkol sa mga pari
  choice: Gumamit ng tuwiran at di-mapanghusgang pananalita tungkol sa katawan.
  alternative: Palambutin sa pamamagitan ng eupemismo o gumamit ng espesipikong modernong terminong medikal.
  rationale: Ang talata ay naglilista ng mga kondisyong nakaaapekto sa pagiging karapat-dapat ng pari sa paglilingkod sa altar; hindi nito itinuturing na kasalanan ang mga kondisyong iyon. Pinananatili ng salin ang konkretong diwa nang hindi nagdaragdag ng moral na paghatol.
translation_notes:
  register: Modernong Filipino na marangal, tuwiran, at madaling maunawaan. Pinanatili ang paulit-ulit na “o” ng Hebreo at ang konkretong bokabularyo ng katawan. Ang mga di-tiyak na terminong medikal ay isinalin nang malawak at nilinaw sa mga talababa.
