  naturalness: Marangal at nauunawaan ang pangungusap, ngunit ang “bilang asawa” ay bahagyang bitin at maaaring makalito. Mas natural at tiyak ang “bilang asawang lalaki.”
  terminology: Ang “dungisan ang sarili” at “lapastanganin ang sarili” ay angkop sa rehistrong ritwal at kabanalan. Dapat ding gamitin ang “asawang lalaki” sa talababa upang maging pare-pareho ang terminolohiya at maiwasan ang di-sinasadyang pagkawala ng kasarian sa pangunahing pagbasa.
