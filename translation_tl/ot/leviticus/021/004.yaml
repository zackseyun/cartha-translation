  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: tl
  text: Hindi niya dapat dungisan ang sarili bilang asawang lalaki sa gitna ng kanyang bayan[a], at sa gayon ay lapastanganin ang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi niya dapat dungisan ang sarili bilang isang pinuno sa gitna ng kanyang bayan, at sa gayon ay lapastanganin ang sarili.” Mahirap unawain ang sugnay sa Hebreo; may ilan ding umuunawa rito nang mas pangkalahatan bilang pagbabawal sa kanya na dungisan ang sarili dahil sa kanyang mataas na katayuan sa lipunan, hindi lamang bilang asawang lalaki.
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: dungisan ang sarili
  rationale: Tumutukoy ang anyong Hitpael sa ritwal na karumihang natatamo dahil sa pakikisalamuha sa patay. Pinananatili ng “dungisan ang sarili” ang wika ng kabanalan at ang aktibong pananagutan ng pari.
- source_word: בַּעַל
  choice: bilang asawa
  rationale: Bagaman maaaring mangahulugang “panginoon” o “pinuno,” karaniwan ding kahulugan nito ang “asawang lalaki.” Ang pagbasa bilang asawa ay umaangkop sa konteksto ng mga kamag-anak na maaaring pagluksaan ng pari, ngunit nananatiling mahirap ang sugnay.
- source_word: בְּעַמָּיו
  choice: sa gitna ng kanyang bayan
  rationale: Malapit ito sa literal na “among his people” at hindi nito nililimitahan nang tahasan ang kahulugan sa mga kamag-anak lamang, bagaman maaaring may gayong pahiwatig sa konteksto.
- source_word: לְהֵחַלּוֹ
  choice: at sa gayon ay lapastanganin ang sarili
  rationale: Ipinahihiwatig ng infinitibong konstruksyon ang layunin o bunga. Ang “lapastanganin” ay nagpapanatili sa pagtutunggali ng banal at di-banal sa bokabularyong pangsaserdote.
theological_decisions:
- issue: Kahulugan ng mahirap na sugnay na בַּעַל בְּעַמָּיו
  choice: Ipinagbabawal sa pari na dungisan ang sarili bilang asawa sa gitna ng kanyang bayan.
  alternative: Hindi niya dapat dungisan ang sarili bilang isang pinuno sa gitna ng kanyang bayan; o, hindi niya dapat dungisan ang sarili sa gitna ng kanyang bayan at sa gayon ay lapastanganin ang sarili.
  rationale: Siksik at hindi tiyak ang sintaks ng Hebreo. Ang “asawa” ay karaniwang kahulugan ng בַּעַל at umaangkop sa konteksto ng pagluluksa para sa malalapit na kaanak. Gayunman, tunay na posible ang pagbasa rito bilang isang taong may katungkulan o katanyagan, kaya inilalahad ang alternatibo sa talababa sa halip na tuluyang alisin ang kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinili ang “dungisan” at “lapastanganin” upang mapanatili ang magkaugnay na bokabularyo ng ritwal na karumihan at kabanalan. Nasa pangunahing teksto ang kinakailangang marker na [a].
