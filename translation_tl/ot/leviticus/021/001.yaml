  to: 'Sinabi ni Yahweh kay Moises, “Magsalita ka sa mga pari, na mga anak ni Aaron, at sabihin mo sa kanila: ‘Walang sinuman sa kanila ang dapat magpaparumi sa sarili[a] dahil sa isang patay na kabilang sa kanyang bayan.[b]’”'
  rationale: Pinalitan ang “magparumi sa sarili” ng “magpaparumi sa sarili” upang maging mas likas at malinaw ang reflexive na pagpapahayag ng ritwal na karumihan. Nilinaw rin sa pangunahing teksto na ang patay ay kabilang sa sariling bayan ng pari, alinsunod sa “sa gitna ng kanyang bayan,” nang hindi pinapalawak ang kahulugan.
