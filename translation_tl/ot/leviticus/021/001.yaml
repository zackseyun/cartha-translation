source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: tl
  text: 'Sinabi ni Yahweh kay Moises, “Magsalita ka sa mga pari, na mga anak ni Aaron, at sabihin mo sa kanila: ‘Walang sinuman sa kanila ang dapat magpaparumi sa sarili[a] dahil sa isang patay na kabilang sa kanyang bayan.[b]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maging marumi” o “dumihan ang sarili.” Ritwal na karumihan dahil sa pakikipag-ugnayan sa patay ang tinutukoy ng Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “dahil sa isang נֶפֶשׁ (nefesh).” Sa kontekstong ito ng batas sa kadalisayan, idyoma ito para sa isang taong patay o bangkay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: Magsalita ka ... at sabihin mo
  rationale: Pinananatili ang pag-uulit ng pandiwang אמר habang gumagamit ng natural na magkaibang anyo sa Filipino.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: mga pari, na mga anak ni Aaron
  rationale: Pinananatili ang appositional na pagkakakilanlan ng mga pari bilang mga anak ni Aaron, nang hindi tahasang pinapalawak ang “mga anak” tungo sa “mga inapo.”
- source_word: לְנֶפֶשׁ
  choice: dahil sa isang taong namatay
  rationale: Sa konteksto ng mga batas sa kadalisayan, ang נֶפֶשׁ ay idyomatikong tumutukoy sa taong patay o bangkay, hindi sa “kaluluwa.” Ang pariralang pinili ay malinaw at marangal sa modernong Filipino.
- source_word: יִטַּמָּא
  choice: magparumi sa sarili
  rationale: Ipinahahayag nito ang reflexive na diwa at ang ritwal na karumihang natatamo sa pakikisalamuha sa patay, nang hindi ito agad inilalarawan bilang moral na kasalanan.
- source_word: בְּעַמָּיו
  choice: sa gitna ng kanyang bayan
  rationale: Malapit ito sa literal na “among his people” at pinananatili ang pang-isahang pananaw na tumutukoy sa bawat pari.
theological_decisions:
- issue: Uri ng karumihan sa batas para sa mga pari
  choice: 'Gumamit ng pananalitang tumutukoy sa ritwal na karumihan: “magparumi sa sarili.”'
  alternative: “lapastanganin ang sarili” o pananalitang nagpapahiwatig agad ng moral na kasamaan
  rationale: Ang konteksto ay ritwal na karumihang kaugnay ng patay. Hindi dapat ipasok ng salin ang mas malawak na hatol na moral na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal na himig ng kautusang pambatas at ang paglipat mula sa utos kay Moises tungo sa pang-isahang tuntunin para sa bawat pari.
