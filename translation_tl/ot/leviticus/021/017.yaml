  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: tl
  text: 'Sabihin mo kay Aaron: “Sinumang lalaki sa iyong mga inapo, sa lahat ng kanilang salinlahi, na may kapansanan[a] ay hindi lalapit upang ihandog ang pagkain[b] ng kanyang Diyos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapintasan.” Ang Hebreong mum ay tumutukoy rito sa pisikal na kapansanang nag-aalis ng karapatang gumanap sa tungkuling ito bilang pari.
    reason: lexical_alternative
  - marker: b
    text: Literal na “tinapay ng kanyang Diyos.” Sa kontekstong pansaserdote, mas malawak itong tumutukoy sa pagkaing inihahandog bilang hain.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: Sabihin mo kay Aaron
  rationale: Natural na modernong Tagalog para sa utos at pormulang nagpapakilala ng tuwirang pananalita, nang hindi pinananatili ang alanganing literal na “magsalita ... na sinasabi.”
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: Sinumang lalaki sa iyong mga inapo
  rationale: Pinananatili ang panlalaking sanggunian sapagkat mga lalaking inapo ni Aaron na maaaring maglingkod bilang pari ang tinutukoy; ang “mga inapo” ay likas at malinaw na katumbas ng wikang tumutukoy sa lahi.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng kanilang salinlahi
  rationale: Ipinahahayag ang patuloy na bisa ng tuntunin sa magkakasunod na salinlahi ng mga inapo ni Aaron.
- source_word: מוּם
  choice: kapansanan
  rationale: Sa kontekstong ito, tumutukoy ang salita sa pisikal na kalagayang nag-aalis ng karapatang gumanap sa partikular na tungkuling pansaserdote. Mas malinaw ito sa modernong Tagalog kaysa “dungis,” na maaaring unawaing moral o panlabas lamang.
- source_word: לֹא יִקְרַב
  choice: ay hindi lalapit
  rationale: Pinananatili ang teknikal na pananalita ng paglapit sa santuwaryo at ang puwersa ng pagbabawal.
- source_word: לְהַקְרִיב
  choice: upang ihandog
  rationale: Ang Hiphil na anyo ng קרב ay tumutukoy rito sa paghahain o paghaharap ng handog; “ihandog” ang likas na katumbas sa kontekstong sakripisyal.
- source_word: לֶחֶם אֱלֹהָיו
  choice: ang pagkain ng kanyang Diyos
  rationale: Bagaman literal na “tinapay,” mas malawak ang saklaw ng לֶחֶם sa wikang pansakripisyo at tumutukoy sa pagkaing inihahandog. Pinananatili ng “pagkain ng kanyang Diyos” ang idyomang kultiko habang nauunawaan sa kasalukuyang Tagalog.
theological_decisions:
- issue: Ang pagbabawal sa mga paring may pisikal na kapansanan
  choice: Inilalarawan ito bilang pagbabawal sa paglapit upang maghandog sa partikular na tungkuling pansaserdote.
  alternative: Ipahiwatig na ang taong may kapansanan ay may moral na dungis, mababang halaga, o ganap na ibinukod sa bayan ng tipan.
  rationale: Ang talata ay nagtatakda lamang ng kuwalipikasyon para sa isang tiyak na paglilingkod sa santuwaryo. Hindi nito sinasabing may kasalanan o mas mababa ang pagkatao ng may kapansanan, kaya hindi iyon idinaragdag sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal-pansaserdote. Iniwasan ang sobrang arkaikong pananalita at ang mga salitang maaaring magpahiwatig ng moral na dungis. Ang mga panandang [a] at [b] ay kapuwa inilagay sa mismong teksto.
