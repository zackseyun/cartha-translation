revisions:
- from: Hindi siya aalis sa santuwaryo ni lalapastanganin ang santuwaryo ng kanyang Diyos, sapagkat nasa kanya ang pagtatalagang dulot ng langis na pamahid ng kanyang Diyos.[a] Ako si Yahweh.
  to: Hindi siya lalabas mula sa santuwaryo, ni hindi niya lalapastanganin ang santuwaryo ng kanyang Diyos, sapagkat nasa kanya ang pagtatalaga sa pamamagitan ng langis na pamahid ng kanyang Diyos.[a] Ako si Yahweh.
  rationale: Inayos ang sintaksis ng magkatuwang na pagbabawal at bahagyang nilinaw ang kaugnayan ng pagtatalaga sa langis na pamahid. Napanatili ang legal at pangkabanalang rehistro, ang pag-uulit na nasa Hebreo, ang sanhi, ang banal na pangalan, at ang talababa para sa pinagdedebateng saklaw ng נֵזֶר.
