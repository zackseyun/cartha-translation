base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: tl
  text: Hindi siya lalabas mula sa santuwaryo, ni hindi niya lalapastanganin ang santuwaryo ng kanyang Diyos, sapagkat nasa kanya ang pagtatalaga sa pamamagitan ng langis na pamahid ng kanyang Diyos.[a] Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “sapagkat nasa kanya ang korona ng langis na pamahid ng kanyang Diyos.” Ang salitang Hebreo ay maaaring mangahulugang “korona” o “pagtatalaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ
  choice: sa santuwaryo
  rationale: Ang מִקְדָּשׁ ay banal na lugar o santuwaryo. Sa pariralang may pandiwang 'aalis,' likas sa Tagalog ang 'aalis sa santuwaryo' upang ipahayag ang paglabas mula roon.
- source_word: לֹא יֵצֵא
  choice: Hindi siya aalis
  rationale: Ang qal na יָצָא ay 'lumabas' o 'umalis.' Ang 'hindi siya aalis' ay malinaw at natural na pahayag ng legal na pagbabawal sa modernong Tagalog.
- source_word: וְלֹא יְחַלֵּל
  choice: ni lalapastanganin
  rationale: Sa kontekstong pari at kabanalan, ang piel na חלל ay nangangahulugang gawing di-banal o lapastanganin. Pinananatili ng 'lalapastanganin' ang mariing pagsalungat sa kabanalan.
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: ang santuwaryo ng kanyang Diyos
  rationale: Tuwirang isinasalin ang construct phrase at inuulit ang 'santuwaryo' gaya ng Hebreo upang mapanatili ang diin ng batas.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan ng pagbabawal. Ang 'sapagkat' ay malinaw, marangal, at likas sa ganitong legal-relihiyosong pahayag.
- source_word: נֵזֶר
  choice: pagtatalaga
  rationale: Maaaring tumukoy ang נֵזֶר sa korona o sa natatanging pagtatalaga. Sa konteksto ng langis na pamahid ng punong pari, malinaw na naipahahayag ng 'pagtatalaga' ang kanyang banal na katayuan; pinananatili sa talababa ang posibleng larawang 'korona.'
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: langis na pamahid ng kanyang Diyos
  rationale: Natural na katumbas sa Tagalog ng construct chain ang 'langis na pamahid ng kanyang Diyos,' habang pinananatili ang lahat ng pangunahing sangkap ng Hebreo.
- source_word: עָלָיו
  choice: nasa kanya
  rationale: Ipinahahayag ng עָלָיו ang nagpapatuloy na kalagayan o tanda ng pagtatalaga na taglay niya. Mas natural sa Tagalog ang 'nasa kanya' kaysa sa literal na 'nasa ibabaw niya.'
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang 'Yahweh' at ang maikli at paulit-ulit na pormulang nagpapatibay sa utos.
theological_decisions:
- issue: Kahulugan ng נֵזֶר kaugnay ng katayuan ng punong pari
  choice: Isinalin sa pangunahing teksto bilang 'pagtatalaga.'
  alternative: korona
  rationale: Bagaman maaaring literal na mangahulugang 'korona' o 'diadema' ang נֵזֶר, ipinapaliwanag ng konteksto ang natatanging banal na katayuang dulot ng pagpapahid ng langis. Hindi ipinapalagay ng pangunahing salin na may literal na koronang yari sa langis, ngunit pinananatili sa talababa ang tunay na leksikal at makasagisag na posibilidad.
- issue: Paglalahad ng banal na pangalan יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ang transliterasyong 'Yahweh' upang malinaw na katawanin ang personal na pangalan sa tekstong Hebreo, sa halip na gawing isang titulo lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'santuwaryo,' 'lalapastanganin,' at 'langis na pamahid' upang mapanatili ang bokabularyong pangkabanalan at pangpari nang hindi nagiging lipas o labis na teknikal. Inilagay ang [a] pagkatapos ng sugnay tungkol sa pagtatalaga, na siyang aktuwal na tinutukoy ng talababa.
