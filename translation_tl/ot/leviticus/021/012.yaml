  naturalness: Hindi natural at kulang sa karaniwang Tagalog na estruktura ang “Hindi siya aalis sa santuwaryo ni lalapastanganin ...”; ang “ni” ay hindi sapat upang ipakilala ang ikalawang pandiwa nang walang malinaw na paksa. Mas malinaw at marangal ang “ni hindi niya lalapastanganin.”
  terminology: Ang “santuwaryo,” “lalapastanganin,” at “langis na pamahid” ay angkop sa rehistrong pangkabanalan. Ang “pagtatalaga” ay ligtas na pangunahing salin ng נֵזֶר sa kontekstong ito, habang pinananatili ng talababa ang “korona” bilang leksikal na alternatibo. Ang “Yahweh” ay pinananatili ayon sa draft at malinaw na kumakatawan sa יהוה.
