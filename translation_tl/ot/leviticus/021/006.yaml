source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: tl
  text: Dapat silang maging banal sa kanilang Diyos at hindi nila dapat lapastanganin ang pangalan ng kanilang Diyos, sapagkat naghahandog sila ng mga handog na pagkain para kay Yahweh[a], ang pagkain ng kanilang Diyos. Kaya dapat silang maging banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ang mga handog para kay Yahweh na pinaraan sa apoy, ang tinapay ng kanilang Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ
  choice: Dapat silang maging banal
  rationale: Ipinapahayag ng imperfect sa kontekstong legal ang isang obligasyon. Ang “dapat” ay likas sa makabagong Tagalog at pinananatili ang preskriptibong bisa; ang “banal” naman ay nagpapanatili sa mahalagang bokabularyo ng kabanalan sa Levitico.
- source_word: לֵאלֹהֵיהֶם
  choice: para sa kanilang Diyos
  rationale: Ipinahihiwatig ng ל ang kaugnayan at pagtatalaga sa Diyos. Mas natural sa Tagalog ang “banal para sa kanilang Diyos” kaysa sa literal na “banal sa kanilang Diyos.”
- source_word: יְחַלְּלוּ
  choice: lapastanganin
  rationale: Ang Piel ng חלל ay tumutukoy sa paglapastangan o pagtrato bilang di-banal. Ang “lapastanganin” ay malinaw, marangal, at angkop kapag ang tuwirang layon ay pangalan ng Diyos.
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: ang pangalan ng kanilang Diyos
  rationale: Tuwirang pinananatili ang construct phrase at ang bigat ng pangalan ng Diyos sa tipanang konteksto.
- source_word: אִשֵּׁי יְהוָה
  choice: ang mga handog na pagkain kay Yahweh
  rationale: Ang אִשֶּׁה ay teknikal na terminong panghandog na karaniwang kaugnay ng handog na pinaraan sa apoy. Sa pangunahing teksto, ang “mga handog na pagkain” ay malinaw at inuugnay sa kasunod na לֶחֶם; inilalagay sa talababa ang mas literal na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: ang pagkain ng kanilang Diyos
  rationale: Bagaman karaniwang “tinapay” ang לֶחֶם, maaari itong mangahulugang pagkain sa mas malawak na diwa, lalo na sa kontekstong panghandog. Iniiwasan ng “pagkain” ang maling pagpapakitid sa literal na tinapay lamang.
- source_word: מַקְרִיבִם
  choice: inihahandog nila
  rationale: Ang Hiphil participle ng קרב ay paglalapit o paghaharap bilang handog. Ang “inihahandog” ang pinakanatural na terminong pangsakripisyo sa Tagalog.
- source_word: וְהָיוּ קֹדֶשׁ
  choice: Kaya dapat silang maging banal
  rationale: Ang pangwakas na sugnay ay muling naggigiit ng kanilang banal na kalagayan dahil sa tungkulin nilang panghandog. Ang “kaya” ay natural na nagpapakita ng lohikal na ugnayan, habang ang pag-uulit ng “banal” ay pinananatili.
theological_decisions:
- issue: Paglalarawan sa kabanalan ng mga pari
  choice: Dapat silang maging banal para sa kanilang Diyos
  alternative: Magiging banal sila sa kanilang Diyos
  rationale: Ang konteksto ay tagubiling legal, kaya ipinapakita ng “dapat” ang obligasyon nang hindi ginagawang simpleng hula ang pahayag.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kultikong pariralang אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם
  choice: ang mga handog na pagkain kay Yahweh, ang pagkain ng kanilang Diyos
  alternative: ang mga handog kay Yahweh na pinaraan sa apoy, ang tinapay ng kanilang Diyos
  rationale: Pinananatili sa pangunahing teksto ang ugnayan ng handog at pagkain sa paraang madaling maunawaan, habang hindi itinatago ang mas literal at teknikal na pagbasa, na ibinibigay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lapastanganin” bilang pormal ngunit karaniwang nauunawaang terminong panrelihiyon, at pinanatili ang pag-uulit ng “banal” upang maipakita ang diin ng Hebreo.
