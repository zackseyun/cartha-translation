  text: o lalaking may bali sa paa o bali sa kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹ
  choice: o
  rationale: Payak na pangatnig na naghihiwalay at nagpapatuloy sa talaan ng mga pisikal na kapansanan.
- source_word: אִישׁ
  choice: lalaki
  rationale: Tumutukoy ang panlalaking pangngalang isahan sa isang lalaking pari sa kontekstong ito ng kautusan para sa mga pari.
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: may
  rationale: Likas at maikli sa modernong Tagalog ang “may” para sa literal na diwang “na nasa kaniya,” nang hindi binabago ang kahulugan.
- source_word: שֶׁבֶר
  choice: bali
  rationale: Ang pangngalan ay tumutukoy sa pagkabali o fracture; karaniwan, malinaw, at hindi labis na klinikal ang “bali.”
- source_word: רָגֶל
  choice: paa
  rationale: Ang pangunahing kahulugan ay “paa”; walang sapat na dahilan sa konteksto upang palawakin ito bilang “binti.”
- source_word: שֶׁבֶר יָד
  choice: bali sa kamay
  rationale: Pinananatili ang inuulit na estruktura at ang tuwirang kahulugan ng יָד bilang “kamay,” sa halip na palawakin bilang “braso.”
