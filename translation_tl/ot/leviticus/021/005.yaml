  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: tl
  text: Huwag silang gumawa ng kalbong bahagi sa kanilang ulo, huwag nilang ahitin ang gilid ng kanilang balbas[a], at huwag silang gumawa ng mga hiwa sa kanilang laman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sulok ng kanilang balbas.” Ang salitang Hebreo ay maaaring tumukoy sa gilid, panig, o sulok.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: kalbuhin ang anumang bahagi
  rationale: Ipinahihiwatig ng magkaugnay na pandiwa at pangngalan ang sadyang paggawa ng kalbong bahagi, hindi ang likas na pagkalagas ng buhok. Likas sa modernong Tagalog ang pariralang ito at malinaw na tumutukoy sa konkretong kilos.
- source_word: בְּרֹאשָׁם
  choice: ng kanilang ulo
  rationale: Pinananatili ang distributibong isahan ng Hebreo; sa Tagalog, likas gamitin ang isahang “ulo” kasunod ng maramihang “kanilang.”
- source_word: פְאַת זְקָנָם
  choice: ang gilid ng kanilang balbas
  rationale: Ang פאה ay maaaring mangahulugang gilid, panig, o sulok. Hindi labis na tinutukoy ng “gilid” ang eksaktong paraan ng pag-aahit, habang napapanatili ang konkretong larawan.
- source_word: יְגַלֵּחוּ
  choice: ahitin
  rationale: Ipinahahayag nito ang sadyang pag-aalis ng buhok. Sapat at natural sa Tagalog ang “ahitin” sa kontekstong ito.
- source_word: וּבִבְשָׂרָם
  choice: sa kanilang laman
  rationale: Ang בשר ay literal na “laman.” Pinananatili nito ang pisikal at mariing larawan ng Hebreo.
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: gumawa ng mga hiwa
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa paghiwa o paglaslas sa katawan. Direkta at madaling maunawaan ang “gumawa ng mga hiwa” nang hindi nagiging klinikal o mapagpaliwanag nang labis.
theological_decisions:
- issue: Saklaw at dahilan ng pagbabawal
  choice: Isinalin bilang mga tiyak na pagbabawal sa pagbabago o pananakit sa katawan, nang hindi idinaragdag ang layuning “para sa patay.”
  alternative: Tukuyin sa pangunahing teksto na ang mga gawaing ito ay pagluluksa para sa patay, batay sa Levitico 19:28 o Deuteronomio 14:1.
  rationale: Nasa talatang ito ang mga ipinagbabawal na kilos ngunit wala rito ang pariralang nagpapaliwanag na “para sa patay.” Hindi dapat ipasok sa pangunahing teksto ang paliwanag mula sa mga kaugnay na talata.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Ang paulit-ulit na “dapat” ay iniwasan sa magkakasunod na sugnay; saklaw ng unang “dapat” ang lahat ng tatlong pagbabawal. Inilagay ang talababa sa “gilid ng kanilang balbas,” kung saan talaga naroon ang leksikal na kalabuan.
