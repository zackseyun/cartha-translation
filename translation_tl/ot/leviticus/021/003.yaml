  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: tl
  text: at para sa kapatid niyang babaeng birhen, na malapit sa kanya[a] at wala pang asawa, maaari siyang maging ritwal na marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na malapit niyang kamag-anak.” Ang Hebreo ay literal na “malapit sa kanya” at tumutukoy sa malapit na ugnayang pampamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲחֹתוֹ
  choice: at para sa kanyang kapatid
  rationale: Ipinagpapatuloy ng pang-ugnay at pang-ukol ang talaan ng mga kamag-anak na pinahihintulutang lapitan ng pari; sapat na sa Tagalog ang “kanyang kapatid” upang ipahiwatig ang pag-aari.
- source_word: הַבְּתוּלָה
  choice: dalagang birhen
  rationale: Pinananatili ng “birhen” ang diin sa kalagayang seksuwal, samantalang tinutulungan ng “dalaga” na maging natural at malinaw ang parirala sa modernong Tagalog.
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: na malapit sa kanya
  rationale: Pinananatili nito ang larawan ng Hebreo at maaaring tumukoy sa malapit na ugnayang pampamilya, nang hindi ito nililimitahan sa emosyonal na pagiging malapit.
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: hindi pa nakapiling ng isang lalaki
  rationale: Ang idyomang Hebreo ay tumutukoy sa babaeng hindi pa nakapasok sa pakikipag-isang-dibdib o pakikipagtalik sa isang lalaki. Ang “nakapiling” ay likas at marangal ngunit sadyang nagpapanatili ng ilang lawak ng kahulugan.
- source_word: יִטַּמָּא
  choice: maaari siyang maging marumi dahil dito
  rationale: Ipinahahayag nito ang pahintulot na tumanggap ng ritwal na karumihan kaugnay ng patay, hindi ang paggawa ng kasalanan o moral na pagpaparumi.
theological_decisions:
- issue: Kalikasan ng karumihan sa batas para sa mga pari
  choice: ritwal na pagiging marumi dahil sa patay
  alternative: moral na pagpaparumi sa sarili
  rationale: Ang konteksto ay mga tuntunin tungkol sa karumihang dulot ng pakikisalamuha sa bangkay. Kaya ang “maging marumi” ay tumutukoy sa katayuang ritwal, hindi sa moral na kasamaan.
- issue: Saklaw ng idyomang לֹא הָיְתָה לְאִישׁ
  choice: hindi pa nakapiling ng isang lalaki
  alternative: wala pang asawa / hindi pa nakipagtalik sa lalaki
  rationale: Maaaring saklawin ng pahayag ang pag-aasawa o pakikipag-isang seksuwal; hindi ito tahasang nililimitahan sa isa lamang, kaya pinanatili sa teksto at talababa ang tunay na lawak ng idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dalagang birhen” para sa linaw at ang “nakapiling” upang maipahayag nang likas ang idyomang Hebreo nang hindi tahasang nilulutas kung kasal o seksuwal na pakikipag-isa ang pangunahing diin.
