    issue: Hindi likas ang “magpabaya ng kanyang buhok.”
    rationale: Ang magpabaya ay karaniwang nangangailangan ng “sa” o ng konstruksiyong “pabayaan.” Sa kontekstong ito, ang Hebreong יִפְרָע ay tumutukoy sa pagpapabayaang nakalugay o magulo ang buhok bilang tanda ng pagluluksa.
  - severity: low
    issue: Medyo malabo ang “na binuhusan sa ulo ng langis na pamahid.”
    rationale: Maaaring mabasa ito nang hindi agad malinaw kung ano ang binuhusan. Ang “na binuhusan ng langis na pamahid ang ulo” ay tuwirang nagpapakita na ang langis ay ibinuhos sa ulo ng pari.
  - severity: low
    issue: Ang talababa a ay maaaring magpahiwatig ng aktibong paksa sa “pinuno ang kanyang kamay.”
    rationale: Mas tumpak na ipakita ang literal na idyoma sa anyong “pinunan ang kanyang kamay,” kasabay ng paliwanag na ito ay idyoma ng ordinasyon o pagtatalaga.
