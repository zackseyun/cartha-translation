base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: tl
  text: Ang pinakapunong pari, na nakahihigit sa kanyang mga kapatid, na binuhusan ng langis na pamahid ang ulo at itinalaga[a] upang isuot ang mga kasuotan, ay huwag niyang pabayaang magulo ang kanyang buhok[b] ni punitin ang kanyang mga kasuotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “pinunan ang kanyang kamay,” isang idyoma para sa pagtatalaga o pagluklok sa paglilingkod bilang pari.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong parirala ay literal na tumutukoy sa kanyang “ulo” at nangangahulugang hindi niya ito pababayaang nakalugay o magulo. Ito, gayundin ang pagpunit ng kasuotan, ay karaniwang tanda ng pagluluksa.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל מֵאֶחָיו
  choice: ang pinakapunong pari, na nakahihigit sa kanyang mga kapatid na pari
  rationale: Ang “pinakapunong pari” ay likas at tiyak na tawag sa pinakamataas na katungkulang saserdotal. Ipinahahayag ng “nakahihigit” ang malamang na paghahambing na diwa ng מִן, at nililinaw ng “mga kapatid na pari” kung sino ang tinutukoy sa konteksto.
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: binuhusan sa ulo ng langis na pamahid
  rationale: Pinananatili ang pasibong kilos ng pagbubuhos at ang kongkretong larawan ng ritwal; natural sa modernong Tagalog ang “langis na pamahid.”
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: itinalaga
  rationale: Ang literal na “pinuno ang kamay” ay isang Hebreong idyoma para sa pagtalaga o pagluklok sa paglilingkod bilang pari. Isinalin ang kahulugan sa pangunahing teksto para maging malinaw at natural, habang inilalagay sa talababa ang literal na anyo.
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: upang magsuot ng mga kasuotan
  rationale: Tuwirang inililipat ang layunin ng infinitibo nang hindi idinaragdag sa teksto ang salitang “pampari,” na malinaw na sa konteksto.
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: hindi dapat magpabaya ng kanyang buhok
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagpapabaya o pagpapagulo ng buhok bilang tanda ng pagluluksa. Ang Tagalog na parirala ay natural ngunit hindi labis na nagtatakda ng eksaktong ayos ng buhok.
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: ni pumunit ng kanyang mga kasuotan
  rationale: Malinaw na inilalarawan ang karaniwang tanda ng pagluluksa at pinananatili ang ugnayan nito sa mga sagradong kasuotan.
theological_decisions:
- issue: Ang idyomang pangpagtatalaga na מִלֵּא אֶת יָדוֹ
  choice: Isinalin sa pangunahing teksto bilang “itinalaga,” na may literal na anyo sa talababa.
  alternative: “pinuno ang kanyang kamay”
  rationale: Ang literal na salin ay hindi mauunawaan bilang idyoma sa karaniwang modernong Tagalog. Ang pagpapakahulugang “itinalaga” ay naghahatid ng ritwal na diwa nang hindi pumipili ng natatanging denominasyonal na terminolohiya.
- issue: Ang paghahambing sa מֵאֶחָיו
  choice: “nakahihigit sa kanyang mga kapatid na pari”
  alternative: “mula sa kanyang mga kapatid”
  rationale: Malamang na paghahambing ang gamit ng מִן dito, na tumutukoy sa mataas na katayuan niya sa kapwa niya mga pari. Gayunman, hindi ginagawang hiwalay na doktrinal na pahayag ang pagiging “nakahihigit.”
- issue: Ang pagbabawal sa אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: “hindi dapat magpabaya ng kanyang buhok”
  alternative: “hindi dapat mag-alis ng takip sa ulo”
  rationale: Mas angkop sa konteksto ng kasunod na pagpunit ng kasuotan ang diwa ng magulo o pinabayaang buhok bilang tanda ng pagluluksa. Itinatala sa talababa ang kontekstong pangkultura nang hindi binubura ang posibilidad na “ulo” ang literal na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakapunong pari” bilang karaniwang katawagan sa mataas na katungkulan, at “kasuotan” sa halip na mas kolokyal na “damit” upang mapanatili ang ritwal na tono. Ang “kanyang” ay piniling modernong baybay at gamit.
