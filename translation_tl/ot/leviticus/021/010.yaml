revisions:
- from: Ang pinakapunong pari, na nakahihigit sa kanyang mga kapatid na pari, na binuhusan sa ulo ng langis na pamahid at itinalaga[a] upang magsuot ng mga kasuotan, ay hindi dapat magpabaya ng kanyang buhok[b] ni pumunit ng kanyang mga kasuotan.
  to: Ang pinakapunong pari, na nakahihigit sa kanyang mga kapatid, na binuhusan ng langis na pamahid ang ulo at itinalaga[a] upang isuot ang mga kasuotan, ay huwag niyang pabayaang magulo ang kanyang buhok[b] ni punitin ang kanyang mga kasuotan.
  rationale: Inayos ang gramatika at idiomatikong Tagalog sa pagbabawal tungkol sa buhok, nilinaw ang pagkakabuo ng sugnay tungkol sa pagbubuhos ng langis, at pinatumpak ang literal na paliwanag sa idyomang pang-ordinasyon. Hindi binago ang saklaw, ritwal na diwa, o antas ng katiyakan ng tekstong Hebreo.
