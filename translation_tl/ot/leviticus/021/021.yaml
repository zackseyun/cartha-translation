  naturalness: Makabago at marangal ang rehistro. Ang ‘mula sa lahi ni Aaron na pari’ ay bahagyang mas malinaw kaysa ‘sa lahi ni Aaron na pari,’ sapagkat malinaw nitong ikinakabit ang ‘na pari’ kay Aaron.
  terminology: Ang ‘kapansanan’ ay angkop sa kontekstong ritwal at hindi nagpapalawak ng ipinagbabawal. Pinanatili ang ‘Yahweh.’ Ang ‘pagkain ng kanyang Diyos’ ay mas natural na pagpapahayag ng priestly idiom na לֶחֶם אֱלֹהָיו; ipinaliliwanag ng talababa na literal itong ‘tinapay.’
