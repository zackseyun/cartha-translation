source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: tl
  text: Walang lalaking mula sa lahi ni Aaron na pari na may kapansanan ang lalapit upang ihandog ang mga handog kay Yahweh na pinaraan sa apoy.[a] May kapansanan siya; hindi siya lalapit upang ihandog ang pagkain ng kanyang Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “ang mga handog na pagkain para kay Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Literal na “tinapay ng kanyang Diyos.” Ito ay pananalita ng mga pari para sa pagkaing inihahandog sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: Walang sinumang lalaki
  rationale: Ang כָּל kasama ng kasunod na pagbabawal ay nagpapahayag ng pangkalahatang pagbabawal. Pinananatili ng “lalaki” ang panlalaking anyo at ang konteksto ng pagkapari.
- source_word: מוּם
  choice: kapansanan
  rationale: Sa kontekstong ito, tumutukoy ito sa pisikal na kalagayang nag-aalis ng karapatang lumapit para sa gawaing paghahandog. Ang “kapansanan” ay malinaw at makabagong Filipino, bagaman ang diskwalipikasyon ay nakaugnay sa partikular na tungkuling ritwal sa talata.
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: sa lahi ni Aaron na pari
  rationale: Ang זֶרַע ay tumutukoy sa angkan o mga inapo; natural sa Filipino ang “sa lahi.” Ang “na pari” ay panuring kay Aaron.
- source_word: יִגַּשׁ
  choice: lalapit
  rationale: Pinananatili nito ang diwa ng ritwal na paglapit at ang pag-uulit ng pandiwa sa talata.
- source_word: לְהַקְרִיב
  choice: upang ihandog
  rationale: Sa konteksto ng paghahain, ang hiphil ng קרב ay nangangahulugang magharap o maghandog.
- source_word: אִשֵּׁי יְהוָה
  choice: mga handog na pagkain para kay Yahweh
  rationale: Ang אִשֶּׁה ay teknikal na katawagan sa mga handog kay Yahweh, karaniwang iniuugnay sa apoy. Ang “handog na pagkain” ay nagpapakita ng paralelismo sa לֶחֶם sa hulihan ng talata; inilalagay sa talababa ang tradisyonal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalan ng Diyos na יהוה ayon sa patakaran ng proyekto.
- source_word: לֶחֶם אֱלֹהָיו
  choice: ang tinapay ng kanyang Diyos
  rationale: Pinananatili ang literal na “tinapay” at ang teknikal na pananalita ng mga pari; maaaring tumukoy ito nang mas malawak sa pagkaing inihahandog sa Diyos.
theological_decisions:
- issue: Pagpapahayag sa saklaw ng pagbabawal
  choice: Hindi siya maaaring lumapit upang maghandog, hindi isang pangkalahatang paghatol sa kanyang pagiging pari o halaga bilang tao
  alternative: Ipahiwatig na lubos siyang ibinukod sa pagkapari
  rationale: Tiyak na nililimitahan ng tekstong Hebreo ang pagbabawal sa paglapit upang maghandog; hindi dapat palawakin ang sinasabi ng talata.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Nasa teksto ang Tetragrammaton bilang pangalang pantangi; pinananatili itong “Yahweh” ayon sa patakaran ng proyekto.
- issue: Ugnayan ng אִשֵּׁי at לֶחֶם
  choice: Panatilihin ang imahen ng pagkaing inihahandog sa Diyos habang kinikilala ang kaugnayan nito sa apoy
  alternative: Isalin lamang bilang “mga handog na sinusunog”
  rationale: Ang dalawang parirala ay magkapantay sa talata. Ang pangunahing salin ay nagpapanatili sa ugnayang iyon, samantalang ang alternatibong tradisyonal ay nasa talababa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kapansanan” bilang malinaw na katumbas ng מוּם, ngunit hindi pinalawak ang pagbabawal lampas sa ritwal na paglapit upang maghandog. Pinanatili ang pag-uulit ng “lalapit” at ang idyomang “tinapay ng kanyang Diyos,” na ipinaliwanag sa talababa.
