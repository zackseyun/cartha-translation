revisions:
- from: Walang sinumang lalaki sa lahi ni Aaron na pari na may kapansanan ang lalapit upang ihandog ang mga handog na pagkain para kay Yahweh.[a] May kapansanan siya; hindi siya lalapit upang ihandog ang tinapay ng kanyang Diyos.[b]
  to: Walang lalaking mula sa lahi ni Aaron na pari na may kapansanan ang lalapit upang ihandog ang mga handog kay Yahweh na pinaraan sa apoy.[a] May kapansanan siya; hindi siya lalapit upang ihandog ang pagkain ng kanyang Diyos.[b]
  rationale: Inayos ang pangunahing salin ng אִשֵּׁי upang maipakita ang aspektong ‘pinaraan sa apoy’ na nasa terminong Hebreo, at ginawang mas malinaw ang ugnayan ni Aaron sa ‘na pari.’ Ang huling priestly idiom ay isinaling natural bilang ‘pagkain ng kanyang Diyos’ at pinanatili sa talababa ang literal na ‘tinapay.’
