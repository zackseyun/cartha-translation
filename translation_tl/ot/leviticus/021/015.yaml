  source_fidelity: 'Tapat ang pangunahing teksto sa Hebreo: ang negatibong yiqtol ay wastong naipahayag bilang “Hindi niya dapat,” ang יְחַלֵּל ay angkop na “lapastanganin,” ang זַרְעוֹ ay napanatili bilang “kanyang mga supling,” at ang בְּעַמָּיו ay natural na “sa gitna ng kanyang bayan.” Ang “ako si Yahweh na nagpapabanal sa kanya” ay tumpak na isinasalin ang כִּי אֲנִי יְהוָה מְקַדְּשׁוֹ at pinananatili ang malamang na reperensiya ng panghalip sa pari nang hindi nagdaragdag ng interpretasyon sa teksto.'
  naturalness: Natural at marangal ang modernong Filipino. Ang “lapastanganin” at “nagpapabanal” ay angkop sa rehistrong pangkabanalan/pangpari at madaling nauunawaan sa konteksto. Maayos rin ang pagkakalagay ng mga panandang talababa sa mga salitang nililinaw nila.
  terminology: 'Konsistent ang “Yahweh” para sa Tetragrammaton at ang bokabularyo ng kabanalan ay angkop: “lapastanganin,” “banal,” at “nagpapabanal.” Hindi ipinipilit ng salin ang mas tiyak na interpretasyong ukol sa pagkawala ng katayuang pangpari ng angkan.'
