base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: tl
  text: Hindi niya dapat lapastanganin ang kanyang mga supling sa gitna ng kanyang bayan[a][b], sapagkat ako si Yahweh na nagpapabanal sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumungis sa kanyang mga supling” o “magdala ng kahihiyan sa kanyang mga supling.” Ang pandiwang Hebreo ay tumutukoy sa paggawa sa isang bagay na dapat maging banal upang maging di-banal o pangkaraniwan.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang paglabag sa mga tuntunin tungkol sa pag-aasawa ay magdadala ng paglapastangan sa kanyang angkan sa loob ng bayang kabilang sa tipan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “na ginagawang banal siya” o “na nagtatalaga sa kanya bilang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: lapastanganin
  rationale: Ang Piel ng חלל sa konteksto ng kabanalang pangpari ay tumutukoy sa paglapastangan o paggawa sa banal na maging pangkaraniwan. Pinananatili ng “lapastanganin” ang matinding diwa ng paglabag sa kabanalan.
- source_word: זַרְעוֹ
  choice: kanyang mga supling
  rationale: Ang זֶרַע ay maaaring mangahulugang binhi, supling, o mga inapo. Sa konteksto ng pag-aasawa at angkan ng pari, natural at malinaw ang “mga supling” nang hindi nililimitahan ang saklaw sa malalayong salinlahi.
- source_word: בְּעַמָּיו
  choice: sa gitna ng kanyang bayan
  rationale: Likas na ipinapahayag nito ang בְּ + עַם at pinananatili ang panlipunan at pangtipang konteksto ng pagbabawal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: מְקַדְּשׁוֹ
  choice: na nagpapabanal sa kanya
  rationale: Ang participle ng קדשׁ ay nagsasaad ng paggawa sa isang tao na banal o pagbubukod sa kanya bilang banal. Ang “nagpapabanal” ay nagpapanatili sa bokabularyo ng kabanalan at sa nagpapatuloy na diwa ng participle.
theological_decisions:
- issue: Saklaw ng paglapastangan sa mga supling at batayan ng kabanalan
  choice: Pinananatili sa pangunahing teksto ang malawak na pahayag na hindi dapat lapastanganin ng pari ang kanyang mga supling sa gitna ng kanyang bayan, sapagkat si Yahweh ang nagpapabanal sa kanya.
  alternative: Maaaring unawain ito nang mas tiyak bilang pagbabawal sa mataas na pari na mawalan ng karapatang maglingkod bilang pari ang kanyang angkan dahil sa pag-aasawa sa isang ipinagbabawal na babae.
  rationale: Malinaw sa kalapit na konteksto na may kinalaman ito sa mga paghihigpit sa pag-aasawa ng pari, ngunit hindi tahasang sinasabi ng Hebreo na ang tinutukoy ay pagkawala ng katungkulang pangpari. Kaya hindi idinagdag sa pangunahing teksto ang mas tiyak na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “lapastanganin” upang mapanatili ang bokabularyo ng kabanalan sa kontekstong pangpari; ipinaliwanag sa talababa ang mga alternatibo. Ang ayos ng mga pananda ay iniayon sa mismong salitang nililinaw ng bawat talababa.
