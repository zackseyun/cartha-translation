source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: tl
  text: 'Sapagkat walang lalaking may pisikal na kapansanan ang maaaring lumapit[a]: lalaking bulag, pilay, may pinsala sa mukha[b], o may bahagi ng katawan na labis ang haba[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lumapit” dito ay tumutukoy sa paglapit upang maglingkod bilang pari.
    reason: cultural_note
  - marker: b
    text: Bihira ang salitang Hebreo; maaaring mas tiyak itong tumukoy sa napinsala o di-wastong pagkakahubog ng ilong.
    reason: lexical_alternative
  - marker: c
    text: Maaaring “may nakaunat o di-wastong pagkakahubog na bahagi ng katawan.” Malamang na tumutukoy ang Hebreo sa isang bahaging di-proporsiyon ang haba.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag sa naunang pagbabawal.
- source_word: כָל אִישׁ ... לֹא
  choice: walang sinumang lalaki
  rationale: Ang literal na “bawat lalaki” kasama ng pagtanggi ay nangangahulugang “walang sinumang lalaki”; pinanatili ang kasarian dahil mga lalaking mula sa angkan ni Aaron ang agarang konteksto.
- source_word: אֲשֶׁר בּוֹ מוּם
  choice: may kapansanan
  rationale: Ang מוּם ay pisikal na depekto o kapintasan na humahadlang sa paglapit para sa paglilingkod bilang pari; malinaw at likas sa modernong Filipino ang “kapansanan,” bagaman maaari rin itong unawain bilang “pisikal na kapintasan.”
- source_word: לֹא יִקְרָב
  choice: ang lalapit
  rationale: Sa kontekstong pangpari, ang קרב ay tumutukoy sa paglapit upang maglingkod; pinananatili ng salin ang maikling pormal na pahayag at nililinaw ito sa talababa.
- source_word: אִישׁ עִוֵּר
  choice: bulag
  rationale: Tuwiran, maikli, at natural na paglalarawan sa Filipino.
- source_word: פִסֵּחַ
  choice: pilay
  rationale: Karaniwang Filipino para sa kondisyong tinutukoy at hindi nagdaragdag ng higit na espesipikong sanhi.
- source_word: חָרֻם
  choice: may pinsala sa mukha
  rationale: Bihira at di-tiyak ang salita; malamang na tumutukoy sa pagkasira o di-pagkahubog ng mukha, lalo na ng ilong, kaya iniwasan ang labis na katiyakan.
- source_word: שָׂרוּעַ
  choice: may bahaging di-pantay ang haba
  rationale: Malamang na tumutukoy sa nakaunat, labis ang haba, o di-proporsiyon na bahagi ng katawan; pinananatili ng salin ang saklaw at kawalang-katiyakan ng bihirang termino.
theological_decisions:
- issue: Saklaw ng pagbabawal sa batas para sa mga pari
  choice: Ipakita ito bilang kuwalipikasyon sa paglapit para sa paglilingkod bilang pari.
  alternative: Unawain ito bilang pangkalahatang pagbubukod sa lipunan o paghuhusga sa halaga ng tao.
  rationale: Ang konteksto at pandiwang “lumapit” ay nakatuon sa tungkuling pangpari sa santuwaryo, hindi sa likas na dignidad o moral na kalagayan ng tao.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “lalaki” dahil ang agarang konteksto ay ang mga lalaking paring mula sa angkan ni Aaron. Iniwasang gawing labis na teknikal ang dalawang bihirang terminong anatomikal, at inilagay sa mga talababa ang mahahalagang alternatibo.
