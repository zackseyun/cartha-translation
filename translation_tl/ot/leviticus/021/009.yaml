  source_fidelity: 'Ang diwa ng Hebreo ay naipapasa: ang anak na babae ng pari ay naglalapastangan sa sarili sa pamamagitan ng pagpapatutot, nilalapastangan ang kanyang ama, at itinatalaga ang parusang pagsunog sa apoy. Gayunman, ang pangunahing pandiwa sa unang kondisyon ay kailangang gawing malinaw na aktibong/reflexive ang pagkakaugnay upang tumpak na maihatid ang anyong Hebreo.'
  naturalness: May bahagyang suliraning panggramatika at kalinawan sa “kung ang anak na babae ng isang pari ay lapastanganin ang sarili niya,” dahil ang “lapastanganin” ay maaaring mabasa bilang walang malinaw na gumaganap. Ang “kung lapastanganin niya ang sarili niya” ay malinaw, pormal, at natural sa legal na rehistro. “Susunugin siya sa apoy” ay tuwirang legal na pahayag at mas maayos na katumbas ng Hebreong pasibo.
  terminology: Ang “lapastanganin” sa dalawang sugnay ay angkop na pagpapanatili ng bokabularyo ng חלל at ng banal/priestly na konteksto. Ang “pagpapatutot” ay tumpak para sa זנה sa kasong ito. Pinanatili ang “pari” at ang pormal na rehistro.
