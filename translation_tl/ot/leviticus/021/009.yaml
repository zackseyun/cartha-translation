base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: tl
  text: At ang anak na babae ng isang pari, kung lapastanganin niya ang sarili niya[a] sa pamamagitan ng pagpapatutot[b], nilalapastangan niya ang kanyang ama; susunugin siya sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kung magsimula siyang magpatutot.” Maaaring mangahulugang “magsimula” ang pandiwang Hebreo sa ilang konteksto, ngunit mas malamang dito ang diwang malapastangan o lapastanganin ang sarili.
    reason: lexical_alternative
  - marker: b
    text: O, “sa pagiging patutot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: At kung ang anak na babae ng isang pari
  rationale: Likas sa modernong Tagalog ang pariralang ito at pinananatili nito ang pormal na paglalahad ng kasong legal. Ang כִּי ay isinaling “kung” dahil nagpapakilala ito rito ng isang kondisyon.
- source_word: תֵחֵל
  choice: ay lapastanganin ang sarili niya
  rationale: Ang anyong Hebreo ay pinakamainam unawain dito bilang paglapastangan o pagdungis sa sariling kalagayang banal, hindi lamang bilang pagsisimula. Ang tahasang “ang sarili niya” ay naghahatid ng resultative o reflexive na diwa sa natural na Tagalog.
- source_word: לִזְנוֹת
  choice: sa pamamagitan ng pagpapatutot
  rationale: Tiyak na tumutukoy ang זנה rito sa prostitusyon, kaya hindi ito pinalawak tungo sa pangkalahatang “imoralidad na seksuwal.” Malinaw rin ng parirala ang paraan ng paglapastangan sa sarili.
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: nilalapastangan niya ang kanyang ama
  rationale: Pinananatili ng “nilalapastangan” ang pag-uulit ng ugat na חלל at ang bigat nitong kaugnay ng kabanalan ng pagkapari. Hindi idinagdag sa teksto ang interpretatibong “karangalan ng.”
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: dapat siyang sunugin sa apoy
  rationale: Ang Niphal imperfect ay nagsasaad ng itinakdang parusa sa batas. Natural at malinaw sa Tagalog ang “dapat,” habang pinananatili ng “sa apoy” ang hayag na instrumental na parirala.
theological_decisions:
- issue: Pagpapanatili sa bokabularyo ng חלל sa batas tungkol sa kabanalan ng mga pari
  choice: Gamitin ang “lapastanganin” sa dalawang kaugnay na sugnay
  alternative: Gamitin ang “dungisan” para sa sarili at “bigyan ng kahihiyan” para sa ama
  rationale: Ang pag-uulit ng iisang salitang-ugat sa Hebreo ay nag-uugnay sa ginawa ng babae at sa paglapastangan sa banal na katayuan ng kanyang amang pari. Pinananatili ng salin ang ugnayang ito nang hindi nagpapasok ng karagdagang doktrina.
- issue: Posibleng kahulugan ng תֵחֵל
  choice: Ilagay sa pangunahing teksto ang diwang “lapastanganin ang sarili”
  alternative: “magsimulang magpatutot”
  rationale: Bagaman maaaring mangahulugan ang kaugnay na anyo na “magsimula” sa ibang konteksto, mas angkop dito ang kahulugang mula sa חלל na “malapastangan” dahil sa konteksto ng kabanalan at sa kasunod na pag-uulit ng parehong ugat. Iningatan ang alternatibo sa talababa.
translation_notes:
  register: Makabago ngunit marangal at pormal ang rehistro, na angkop sa isang probisyong legal. Ginamit ang “pari,” “lapastanganin,” at “dapat siyang sunugin” bilang mga salitang madaling maunawaan ngunit may sapat na bigat. Ang dalawang talababa ay inilagay mismo sa mga pariralang tinutukoy ng mga ito.
