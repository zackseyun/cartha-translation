  yaml_path: translation/ot/leviticus/021/016.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; nakaugaliang isalin na “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang tradisyonal na alternatibong salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Tuwirang ipinapahayag ang bagong pangyayari ng banal na pagsasalita at pinananatili ang bahagyang pormal na himig ng karaniwang pormulang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang Moses sa Filipino.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Likas itong panimula sa Filipino sa mismong nilalaman ng kasunod na pahayag, habang pinananatili ang hiwalay na pahiwatig ng Hebreong לֵאמֹר.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay mas malapit na transliterasyon at hindi pinapalitan ng isang titulo ang pangalang nasa pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “Nagsalita … at sinabi” ay sadyang nagpapanatili sa dalawang bahagi ng pormulang Hebreo nang hindi gumagamit ng di-likas na “na sinasabi.”
