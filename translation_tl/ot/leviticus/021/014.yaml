base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: tl
  text: Hindi siya dapat kumuha bilang asawa ng biyuda, babaeng diborsiyada, babaeng may katayuang nalapastangan[a], o babaeng nagpoprostitusyon. Sa halip, dapat siyang kumuha bilang asawa ng isang birhen mula sa sarili niyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babaeng nalapastangan” o “babaeng nawalan ng banal na katayuan.” Ang terminong Hebreo ay tumutukoy sa isang babaeng may katayuang hindi angkop sa mga batas ng kabanalan para sa pag-aasawa ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: isang biyuda
  rationale: Karaniwan at malinaw na katumbas sa makabagong Filipino.
- source_word: גְרוּשָׁה
  choice: babaeng hiniwalayan
  rationale: Ipinapahayag ang pasibong diwa ng isang babaeng pinaalis o diniborsiyo ng asawa, sa natural na Filipino.
- source_word: חֲלָלָה
  choice: babaeng itinuturing na di banal
  rationale: Ipinananatili ang diwa ng pagkawala o kawalan ng katayuang banal sa batas para sa mga pari, nang hindi ipinahihiwatig na siya ay biktima ng seksuwal na karahasan.
- source_word: זֹנָה
  choice: babaeng nagbebenta ng aliw
  rationale: Direkta ngunit marangal at madaling maunawaang makabagong katumbas ng babaeng nagpoprostitusyon.
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: Hindi siya kukuha bilang asawa ng
  rationale: Pinananatili ang legal na idyomang ‘kumuha’ habang nililinaw na pag-aasawa ang tinutukoy.
- source_word: כִּי אִם
  choice: Sa halip
  rationale: Malinaw na naghaharap ng pinahihintulutang kapalit pagkatapos ng pagbabawal.
- source_word: בְּתוּלָה
  choice: isang birhen
  rationale: Tumpak sa konteksto ng batas tungkol sa pag-aasawa.
- source_word: מֵעַמָּיו
  choice: mula sa sarili niyang bayan
  rationale: Natural na ipinapahayag na ang babae ay dapat magmula sa sariling sambayanan ng punong pari.
- source_word: אִשָּׁה
  choice: bilang asawa
  rationale: Nililinaw ang tungkulin ng pangngalan sa Hebreong pariralang tumutukoy sa pagkuha ng asawa.
theological_decisions:
- issue: Paglalarawan sa חֲלָלָה sa batas ng kabanalan para sa mga pari
  choice: babaeng itinuturing na di banal
  alternative: babaeng nalapastangan; babaeng nawalan ng banal na katayuan
  rationale: Ang termino ay tumutukoy sa katayuang hindi angkop sa mga tuntunin ng kabanalan para sa pag-aasawa ng pari. Iniiwasan ng pangunahing salin ang posibleng maling pahiwatig ng ‘nilapastangan’ na siya ay ginahasa o inabuso, habang pinananatili sa talababa ang tunay na saklaw ng salita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na himig ng utos ngunit nilinaw ang idyoma ng ‘pagkuha’ bilang pag-aasawa. Ang panandang [a] ay inilagay sa terminong חֲלָלָה na siyang aktuwal na tinatalakay ng talababa.
