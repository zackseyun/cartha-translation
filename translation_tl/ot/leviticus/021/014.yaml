revisions:
- from: Hindi siya kukuha bilang asawa ng isang biyuda, babaeng hiniwalayan, babaeng itinuturing na di banal[a], o babaeng nagbebenta ng aliw. Sa halip, kukuha siya bilang asawa ng isang birhen mula sa sarili niyang bayan.
  to: Hindi siya dapat kumuha bilang asawa ng biyuda, babaeng diborsiyada, babaeng may katayuang nalapastangan[a], o babaeng nagpoprostitusyon. Sa halip, dapat siyang kumuha bilang asawa ng isang birhen mula sa sarili niyang bayan.
  rationale: Nilinaw ang terminong para sa diborsiyadong babae at ang terminong para sa prostitute upang tumugma sa mga terminong Hebreo nang walang eupemismo. Ang salin para sa חֲלָלָה ay inayos upang huwag magdagdag ng ‘itinuturing na’ at upang mapanatili ang teknikal, pinagtatalunang saklaw ng katayuang profaned; ang mga malapit na alternatibo ay nananatili sa talababa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:18:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Ang balangkas ng salin ay tapat sa Hebreo: ang apat na ipinagbabawal na kategorya, ang mariing paghahalili sa pamamagitan ng כִּי אִם, at ang utos na mag-asawa ng birhen mula sa sariling bayan ay naipapahayag. Gayunman, ang “hiniwalayan” ay maaari lamang mangahulugang pinaghiwalay at hindi tiyak na diborsiyado, samantalang ang “nagbebenta ng aliw” ay isang eupemismong hindi tiyak para sa זֹנָה. Ang “itinuturing na di banal” ay nagdaragdag ng ideyang ‘itinuturing na’ na wala sa teksto at hindi malinaw na naihahayag ang katayuang saklaw ng חֲלָלָה.'
  naturalness: Mas natural at tuwiran sa modernong Filipino ang “babaeng diborsiyada” at “babaeng nagpoprostitusyon.” Ang “babaeng may katayuang nalapastangan” ay pinananatili ang teknikal at medyo hindi ganap na tiyak na katangian ng termino nang hindi inaangking tumutukoy ito sa isang partikular na pangyayari.
  terminology: Ang “birhen,” “biyuda,” at “sarili niyang bayan” ay angkop. Pinalitan ang eupemismong “nagbebenta ng aliw” ng tiyak na katumbas para sa זֹנָה. Para sa חֲלָלָה, gumamit ng saling nakatuon sa profaned status at naglaan ng talababa para sa mga leksikal na alternatibo.
  issues:
  - severity: medium
    issue: Hindi sapat na tiyak ang “babaeng hiniwalayan.”
    rationale: Maaaring tumukoy ito sa simpleng paghihiwalay, samantalang ang גְרוּשָׁה ay babaeng diborsiyado o pinawalang-asawa.
  - severity: medium
    issue: Eupemistiko at malabo ang “babaeng nagbebenta ng aliw.”
    rationale: Hindi nito laging tinutukoy ang prostitusyon; ang זֹנָה ay dapat isaling “babaeng nagpoprostitusyon” para sa mas tumpak na diwa.
  - severity: low
    issue: May dagdag at malabong paghatol sa “babaeng itinuturing na di banal.”
    rationale: Ang “itinuturing na” ay wala sa Hebreo, at ang parirala ay hindi malinaw na katumbas ng katayuang ‘profaned/desecrated’ na ipinahihiwatig ng חֲלָלָה.
