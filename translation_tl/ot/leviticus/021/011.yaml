  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: tl
  text: Hindi siya lalapit sa anumang bangkay[a]; hindi niya gagawing marumi ang kanyang sarili, kahit para sa kanyang ama o ina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katawan ng patay.” Literal na “mga kaluluwa ng patay”; isang idyoma ito na tumutukoy sa bangkay sa mga kautusan tungkol sa ritwal na kalinisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל כָּל נַפְשֹׁת מֵת לֹא יָבֹא
  choice: Hindi siya lalapit sa alinmang bangkay
  rationale: Sa konteksto ng mga kautusan tungkol sa karumihang dulot ng patay, ang בוא עַל ay tumutukoy sa paglapit sa bangkay. Ang נַפְשֹׁת מֵת ay idyomatikong tumutukoy sa bangkay, hindi sa kaluluwa ng namatay.
- source_word: כָּל
  choice: alinmang
  rationale: Kasama ng negatibong pahayag, malinaw na ipinahihiwatig ng “alinmang” ang ganap at walang-eksepsiyong pagbabawal.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: kahit dahil sa kanyang ama o ina
  rationale: 'Ang לְ ay nagpapahayag dito ng kaugnayan o dahilan: hindi pinahihintulutan ang karumihan maging sa kaso ng pinakamalapit na kamag-anak. Likas sa Filipino ang “o” para sa distributibong diwa.'
- source_word: לֹא יִטַּמָּא
  choice: hindi niya parurumingin ang kanyang sarili
  rationale: Ang Hitpael ng טמא ay reflexive at tumutukoy sa pagiging marumi ayon sa mga batas ng ritwal na kalinisan. Pinananatili ng salin ang bokabularyo ng malinis at marumi nang hindi ito awtomatikong ginagawang moral na kasalanan.
theological_decisions:
- issue: Wika para sa ritwal na karumihan
  choice: “hindi niya parurumingin ang kanyang sarili”
  alternative: “hindi siya magiging marumi” / “hindi niya dudungisan ang kanyang sarili”
  rationale: Ang talata ay tungkol sa karumihang nauugnay sa bangkay sa kautusang Levitico. Ang “parurumingin” ay nagpapanatili sa kategoryang biblikal ng karumihan at sa reflexive na anyo, samantalang ang “dudungisan” ay maaaring magpahiwatig nang labis ng moral na kasamaan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bangkay” bilang natural at tiyak na katawagan, at pinanatili ang “marumi” bilang terminong kaugnay ng ritwal na kalinisan. Ang “kahit” ay nagpapakita ng diin na walang eksepsiyon maging para sa ama o ina.
