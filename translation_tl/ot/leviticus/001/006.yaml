  text: Then he shall skin the burnt offering and cut it into its pieces[a][b].
translation:
  language: tl
  text: Pagkatapos, babalatan niya ang handog na sinusunog at puputulin niya ito sa mga bahagi nito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aalisan ng balat.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “puputulin niya ito sa mga bahagi nito,” na tumutukoy sa paghahati ng hayop sa mga seksiyong gagamitin sa paghahandog.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: babalatan
  rationale: Ang Hifil ng פשט sa konteksto ng paghahandog ay tumutukoy sa pag-aalis ng balat ng hayop. Ang “babalatan” ay malinaw, natural, at tiyak sa modernong Filipino.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ang עֹלָה ang karaniwang katawagan sa Levitico para sa handog na lubusang sinusunog. Pinananatili ng salin ang kinikilalang kahulugang pangritwal sa halip na ang etimolohikong “handog na umaakyat.”
- source_word: וְנִתַּח
  choice: at puputul-putulin
  rationale: Ang נתּח ay tumutukoy sa pagputol ng hayop sa magkakahiwalay na seksiyon para sa paghahandog. Mas kongkreto rito ang “puputul-putulin” kaysa sa pangkalahatang “hahatiin.”
- source_word: לִנְתָחֶיהָ
  choice: sa mga bahagi nito
  rationale: 'Ang נתח ay isang putol na bahagi o seksiyon. Ipinahihiwatig ng ל ang resulta ng kilos: ang hayop ay puputul-putulin sa mga nakalaang bahagi nito.'
- source_word: וְ
  choice: Pagkatapos
  rationale: Iniuugnay ng pangatnig ang tagubiling ito sa naunang hakbang bilang kasunod na gawain. Likas na ipinapahayag ng “Pagkatapos” ang pagkakasunod-sunod sa Filipino.
