  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: tl
  text: At ang mga anak ng paring si Aaron ay maglalagay ng apoy sa altar at ilalatag ang kahoy sa ibabaw ng apoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: ay maglalagay
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay” o “maglagay.” Sa tagubiling pangritwal na ito, natural ang “maglalagay,” at ipinahihiwatig ng anyong pandiwa sa konteksto ang itinakdang gagawin.
- source_word: בְּנֵי אַהֲרֹן
  choice: ang mga anak ni Aaron
  rationale: Tuwirang pinananatili ang ugnayang pampamilya at ang pagkakakilanlan ng mga gumaganap sa ritwal.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Ang pang-isahang pantukoy ay tumutukoy kay Aaron bilang pari, hindi sa kaniyang mga anak bilang isang “pamilyang pari.” Sa Tagalog, natural na ikinakabit ito kay Aaron sa pariralang “Aaron na pari.”
- source_word: אֵשׁ
  choice: apoy
  rationale: Literal na apoy ang tinutukoy sa pamamaraan ng paghahandog.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Natural na modernong Tagalog para sa paglalagay ng apoy sa ibabaw o bahagi ng altar; sapat na ipinahihiwatig ng “sa” ang lokasyon.
- source_word: וְעָרְכוּ
  choice: at magsasaayos
  rationale: Ang ערך sa kontekstong pangritwal ay tumutukoy sa maayos na paglalatag o pagsasaayos, kaya pinananatili ng “magsasaayos” ang diwa ng kaayusan.
- source_word: עֵצִים
  choice: kahoy
  rationale: Bagaman maramihan sa Hebreo, karaniwang ginagamit sa Tagalog ang pangngalang “kahoy” bilang kolektibong tawag; ang “mga troso” ay magiging labis na tiyak.
- source_word: עַל הָאֵשׁ
  choice: sa ibabaw ng apoy
  rationale: Malinaw na ipinakikita ang pisikal na pagkakalagay ng kahoy kaugnay ng apoy at pinananatili ang pag-uulit ng “apoy” sa Hebreo.
