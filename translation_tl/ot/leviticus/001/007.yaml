translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na angkop sa tekstong pambatas at pangritwal. Pinanatili ang sunod-sunod na mga kilos at ang appositional na pagkakakilanlan kay Aaron bilang pari.
