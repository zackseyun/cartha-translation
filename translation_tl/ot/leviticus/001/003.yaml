  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: tl
  text: Kung ang kanyang handog ay handog na sinusunog mula sa kawan ng mga baka, maghahandog siya ng isang lalaking hayop na walang kapintasan. Ihahandog niya ito sa pasukan ng Tolda ng Pagtitipon upang tanggapin siya ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ihahandog niya ito nang kusang-loob sa harap ni Yahweh.”
    reason: Pinananatili ang alternatibong pagkaunawa sa Hebreong לִרְצֹנוֹ, na maaaring tumukoy sa kusang-loob ng naghahandog sa halip na sa pagtanggap sa kanya.
lexical_decisions:
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang terminong pansakripisyo para sa handog na sinusunog sa altar; malinaw at likas ito sa makabagong Filipino.
- source_word: קָרְבָּנוֹ
  choice: kanyang handog
  rationale: Ang קָרְבָּן ay pangkalahatang katawagan sa handog na inilalapit sa Diyos; sapat at natural ang “handog” sa kontekstong ito.
- source_word: מִן הַבָּקָר
  choice: mula sa mga baka
  rationale: Tumutukoy ang בָּקָר sa mga alagang hayop na bovine. Mas natural sa Filipino ang “mula sa mga baka” kaysa sa literal na “mula sa kawan.”
- source_word: זָכָר תָּמִים
  choice: isang lalaking baka na walang kapintasan
  rationale: Pinananatili ang kahilingang lalaki ang hayop at wala itong pisikal na depekto na magpapawalang-bisa rito bilang handog.
- source_word: יַקְרִיבֶנּוּ
  choice: maghahandog siya / ihahandog niya iyon
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay nangangahulugang magharap o maghandog; “ihahandog” ang pinakanatural na katumbas.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pasukan ng Tolda ng Pagtitipon
  rationale: Malapit ito sa anyo at kahulugan ng Hebreo at malinaw na tumutukoy sa itinalagang santuwaryong pinagtitipunan.
- source_word: לִרְצֹנוֹ
  choice: upang maging katanggap-tanggap siya
  rationale: Ipinahahayag nito ang malamang na kahulugang tanggapin ng Diyos ang naghahandog, habang ang tradisyonal na pagbasa bilang kusang-loob ay inilalagay sa talababa.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang isinasalin ang לִפְנֵי bilang “sa harap” at pinananatili ang personal na pangalang Yahweh.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang banal na pangalan; ang “Yahweh” ay tuwirang kumakatawan rito at iniiwasang palitan ito ng isang titulo.
- issue: Kahulugan ng לִרְצֹנוֹ
  choice: upang maging katanggap-tanggap siya
  alternative: nang kusang-loob niya
  rationale: Maaaring tumukoy ang parirala sa pagtanggap ng Diyos sa naghahandog o sa kusang-loob na paghahandog. Pinili sa pangunahing teksto ang angkop na kahulugang pansakripisyo, ngunit pinanatili sa talababa ang tunay at matagal nang kinikilalang alternatibo.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “Tolda ng Pagtitipon” bilang tumpak at madaling maunawaang katawagan, at iniwasan ang sobrang teknikal o makalumang pananalita.
