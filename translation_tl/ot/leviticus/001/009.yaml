base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Ngunit huhugasan niya sa tubig ang mga laman-loob at mga binti nito. Pagkatapos, iaalay ng pari sa altar ang lahat ng iyon sa pamamagitan ng pagsusunog—isang handog na sinusunog, isang handog na inihahandog sa pamamagitan ng apoy,[a] isang mabangong samyo na kalugod-lugod kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang handog na pagkain.” Hindi tiyak ang eksaktong kahulugan ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang “mabangong samyo na kalugod-lugod” ay nakagawiang pormula sa mga tekstong panghandog; ipinahihiwatig nitong katanggap-tanggap kay Yahweh ang handog.
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: mga laman-loob nito
  rationale: Sa konteksto ng paghahandog, tumutukoy ang קֶרֶב sa mga panloob na bahagi o organo ng hayop. Ang “laman-loob” ay malinaw at likas sa modernong Tagalog.
- source_word: כְרָעָיו
  choice: mga binti nito
  rationale: Tumutukoy ang salita sa mga ibabang bahagi ng mga paa ng hayop. Mas tiyak ang “mga binti” kaysa “mga paa,” na maaari ring mangahulugang mismong talampakan o paa.
- source_word: יִרְחַץ בַּמָּיִם
  choice: huhugasan niya sa tubig
  rationale: Likas sa Tagalog ang “hugasan sa tubig” at tapat itong naghahatid ng ritwal na gawain.
- source_word: וְהִקְטִיר
  choice: susunugin ... upang maging usok
  rationale: Sa wikang panghandog, ang pandiwa ay hindi lamang karaniwang pagsunog kundi pagpapausok ng handog sa altar. Iniiwasan ng parirala ang di-likas na “pauusukin” habang pinananatili ang diwa ng pag-akyat bilang usok.
- source_word: אֶת־הַכֹּל
  choice: ang lahat ng iyon
  rationale: Pinananatili nito ang diin na ang buong inihandang hayop ay sinusunog sa altar.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ito ang natural at karaniwang katawagang Tagalog para sa lugar ng ritwal na pagsunog.
- source_word: עֹלָה
  choice: isang handog na sinusunog
  rationale: Inilalarawan nito nang malinaw ang uri ng handog na lubos na sinusunog, nang hindi umaasa sa mas teknikal o di-pamilyar na katawagan.
- source_word: אִשֵּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Pinananatili nito ang malapit na kaugnayan ng terminong panghandog sa apoy. Dahil pinagtatalunan ang eksaktong pakahulugan nito, inilalahad sa talababa ang alternatibong “handog na pagkain.”
- source_word: רֵיחַ נִיחוֹחַ
  choice: kalugod-lugod na samyo
  rationale: Pinananatili nito ang nakalarawang pormulang panghandog at likas itong pakinggan sa marangal na modernong Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang יהוה bilang “Yahweh,” at malinaw na ipinakikita ng “para kay” ang patutunguhan o kaugnayan ng handog.
theological_decisions:
- issue: Pagpapakahulugan sa אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Hindi tiyak kung dapat idiin ng termino ang apoy na paraan ng paghahandog o ang handog bilang pagkaing inihahain. Pinili sa teksto ang mas tuwirang kaugnayan sa apoy at pinanatili sa talababa ang tunay na alternatibo.
- issue: Pormulang רֵיחַ נִיחוֹחַ
  choice: kalugod-lugod na samyo
  alternative: samyo ng katiwasayan / nakapapawing samyo
  rationale: Pinananatili ang metapora ng orihinal at ang pahiwatig ng pagtanggap ng Diyos, nang hindi ipinapaliwanag nang mekanistiko na nangangailangan ang Diyos ng amoy ng handog.
- issue: Banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang tipan. Ang transliterasyong “Yahweh” ang tuwirang kumakatawan rito at hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “laman-loob,” “binti,” at “sinusunog” bilang kongkreto at karaniwang mga salita. Ang gitling-pahaba ay nagpapanatili sa magkakasunod na panuring ng Hebreo habang malinaw na inuugnay ang mga ito sa iisang handog.
