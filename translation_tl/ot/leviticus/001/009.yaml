revisions:
- from: Ngunit huhugasan niya sa tubig ang mga laman-loob at mga binti nito. Pagkatapos, susunugin ng pari sa altar ang lahat ng iyon upang maging usok—isang handog na sinusunog, isang handog na pinaraan sa apoy,[a] na may kalugod-lugod na samyo para kay Yahweh.[b]
  to: Ngunit huhugasan niya sa tubig ang mga laman-loob at mga binti nito. Pagkatapos, iaalay ng pari sa altar ang lahat ng iyon sa pamamagitan ng pagsusunog—isang handog na sinusunog, isang handog na inihahandog sa pamamagitan ng apoy,[a] isang mabangong samyo na kalugod-lugod kay Yahweh.[b]
  rationale: Pinalitan ang konstruksiyong nagpapahiwatig ng layunin (“upang maging usok”) ng pananalitang tuwirang naglalarawan sa ritwal na paghahandog sa pamamagitan ng pagsusunog. Pinakinis din ang katawagan para sa אִשֶּׁה at ang pormula ng “pleasing aroma,” nang hindi nilulutas sa teksto ang pinagtatalunang leksikal na kahulugan.
