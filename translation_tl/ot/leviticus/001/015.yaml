  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִקְרִיב֤/וֹ הַ/כֹּהֵן֙ אֶל הַ/מִּזְבֵּ֔חַ וּ/מָלַק֙ אֶת רֹאשׁ֔/וֹ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה וְ/נִמְצָ֣ה דָמ֔/וֹ עַ֖ל קִ֥יר הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: tl
  text: Dadalhin ito ng pari sa altar, pipigtasin ang ulo nito[a], at susunugin sa altar. Pipigain ang dugo nito sa gilid ng altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay teknikal na katawagan sa paraan ng pari sa pagpatay sa ibong handog; maaari ring isalin na “pupugutin” o “pipisilin upang mapigtas” ang ulo nito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pader ng altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Dadalhin ito
  rationale: Ang Hiphil ng קרב ay tumutukoy sa paglalapit o pagdadala. Dahil kasunod ang אֶל הַמִּזְבֵּחַ, malinaw at natural ang “dadalhin ito … sa altar.”
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin ng כֹּהֵן sa konteksto ng mga handog at ritwal.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Ipinahihiwatig ng אֶל ang paggalaw patungo sa altar; sapat at natural sa Filipino ang “sa altar.”
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: pipigtasin ang ulo nito
  rationale: Ang מלק ay teknikal na katawagan sa pagpatay ng ibong handog sa pamamagitan ng pagpisil o pagpigtas sa ulo. Pinananatili ng “pipigtasin” ang kongkretong kilos nang hindi labis na ipinapaliwanag sa pangunahing teksto.
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: at susunugin sa altar
  rationale: Sa ritwal na konteksto, ang קטר ay pagsunog ng handog upang pumailanlang bilang usok. Hindi tahasang binanggit sa Hebreo ang layon ng pandiwa rito, kaya hindi nagdagdag ng panghalip ang salin at sa gayon ay hindi sapilitang nilulutas kung ang tinutukoy ay ang ulo o ang ibon.
- source_word: וְנִמְצָה דָמוֹ
  choice: Ang dugo nito ay patutuluin
  rationale: Ang Niphal ng מצה ay tumutukoy sa dugong pinipiga o pinatutulo palabas. Ang anyong “ay patutuluin” ay natural na Filipino at pinananatili ang di-aktibong pagtuon sa dugo.
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: sa gilid ng altar
  rationale: Literal na “pader” ang קִיר, ngunit “gilid ng altar” ang mas likas at malinaw sa modernong Filipino. Itinatala sa talababa ang literal na anyo.
theological_decisions:
- issue: Hindi tahasang layon ng וְהִקְטִיר
  choice: Hindi naglagay ng “ito” pagkatapos ng “susunugin.”
  alternative: “at susunugin ito sa altar”
  rationale: Walang tahasang layon ang pandiwang Hebreo. Ang pag-aalis ng panghalip sa Filipino ay natural at nagpapanatili sa posibleng pagtukoy sa ulo o sa ibong handog nang hindi nilulutas ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari” at “altar,” na pamilyar sa ordinaryong mambabasa. Iniwasan ang sobrang teknikal na paglalarawan sa pangunahing teksto, habang pinanatili sa talababa ang natatanging kahulugan ng ritwal na pandiwa.
