  source_fidelity: 'Tumpak ang pangunahing diwa: ang hayop ay kakatayin sa hilagang panig ng altar sa harap ni Yahweh, at ang mga anak ni Aaron na mga pari ang magsasagawa ng ritwal sa dugo. Gayunman, ang “sa lahat ng panig ng altar” ay maaaring magpahiwatig na inihagis ang dugo patungo sa mga panig, sa halip na ito ay ihagis laban/sa altar nang paikot. Ang “sa altar, sa buong palibot” ay mas malapit sa עַל הַמִּזְבֵּחַ סָבִיב.'
