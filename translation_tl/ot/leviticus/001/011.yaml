  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: tl
  text: Kakatayin niya iyon sa hilagang bahagi ng altar, sa harap ni Yahweh. At ihahagis ng mga anak ni Aaron, na mga pari, ang dugo nito sa altar, sa buong palibot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “itatalsik ang dugo nito sa altar sa buong palibot.” Ang pandiwang Hebreo ay nagpapahiwatig ng puwersahang paghagis ng dugo, hindi ng marahang pagwiwisik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט אֹתוֹ
  choice: Kakatayin niya iyon
  rationale: Ang שׁחט ang karaniwang tiyak na pandiwa para sa ritwal na pagkatay ng hayop na handog; mas angkop ang “kakatayin” kaysa sa pangkalahatang “papatayin.”
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: sa hilagang bahagi ng altar
  rationale: Ang יֶרֶךְ ay “tagiliran/panig,” at ang צָפֹנָה ay tumutukoy sa lokasyong pahilaga; natural at tumpak sa Filipino ang “hilagang bahagi.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang kultikong diwa ng pagkilos sa presensiya ni Yahweh at tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: וְזָרְקוּ
  choice: ihahagis
  rationale: Ang זרק ay nangangahulugang maghagis o magbato at sa ritwal ng dugo ay nagpapahiwatig ng puwersahang paghagis sa altar, hindi basta marahang pagwisik.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: mga anak ni Aaron, na mga pari
  rationale: Pinananatili ng pariralang ito kapuwa ang kaugnayang pampamilya at ang tungkulin nila bilang mga pari.
- source_word: אֶת דָּמוֹ
  choice: ang dugo nito
  rationale: Ang hulaping panghalip ay tumutukoy sa hayop na inihahandog; malinaw at natural ang “nito” sa Filipino.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa lahat ng panig ng altar
  rationale: Ipinahihiwatig ng סָבִיב na ang dugo ay ilalagay sa palibot o sa bawat panig ng altar; iniiwasan ng saling ito ang maling pahiwatig na basta sa paligid sa lupa ihahagis ang dugo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo ang יְהוָה sa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa katangian nito bilang pangalang tipan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may malinaw na estilong panuntunang panritwal. Ginamit ang “altar” bilang karaniwan at madaling maunawaang terminong biblikal; pinanatili ang “Yahweh” bilang pantanging pangalan.
