base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Ngunit huhugasan niya sa tubig ang mga laman-loob at mga binti. Ihaharap ng pari ang lahat ng ito at pauusukin niya ito sa altar. Ito ay handog na sinusunog, isang handog na inialay sa pamamagitan ng apoy,[a] isang kalugod-lugod na samyo para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: mga laman-loob
  rationale: Tumutukoy ito sa mga panloob na bahagi o laman-loob ng hayop na inihahandog; malinaw at likas ang “mga laman-loob” sa makabagong Filipino.
- source_word: הַכְּרָעַיִם
  choice: mga binti
  rationale: Tumutukoy sa mga paa o ibabang bahagi ng mga biyas ng hayop; ang “mga binti” ay maikli, malinaw, at angkop sa konteksto.
- source_word: יִרְחַץ בַּמָּיִם
  choice: huhugasan niya sa tubig
  rationale: Pinananatili nito ang tahasang gamit ng tubig at ang paksa na ipinagpapatuloy mula sa naunang tagubilin.
- source_word: וְהִקְרִיב
  choice: ihaharap
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap ang handog; hindi ito ipinagkakapareho sa kasunod na tiyak na kilos ng pagpapausok.
- source_word: אֶת־הַכֹּל
  choice: ang lahat ng iyon
  rationale: Ipinahahayag ang kabuuan ng mga bahaging inihanda at natural ang reperensiya sa mga nabanggit na bahagi.
- source_word: וְהִקְטִיר
  choice: pauusukin
  rationale: Mas tiyak ito kaysa sa karaniwang “susunugin,” sapagkat inilalarawan ng pandiwang pansakripisyo ang pagpapaakyat sa handog bilang usok mula sa altar.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Karaniwan at natural na salin ng lokasyon ng pagsusunog ng handog.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Maliwanag nitong tinutukoy ang natatanging uri ng handog na buong sinusunog, habang nananatiling madaling maunawaan.
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Pinananatili nito ang malinaw na kaugnayan ng terminong pansakripisyo sa apoy. Inilalagay sa talababa ang alternatibong “handog na pagkain” dahil umiiral ang gayong pag-unawa sa kategoryang ito.
- source_word: רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  rationale: Pinananatili ang pandamang talinghaga ng Hebreo at ipinahahayag na ang handog ay kalugod-lugod o katanggap-tanggap.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang kinakatawan ang personal na pangalang יהוה at natural na ipinahahayag sa Filipino ang tumatanggap ng handog.
theological_decisions:
- issue: Pandamang paglalarawan sa רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: nakagiginhawang samyo
  rationale: Pinananatili ang antropomorpikong talinghaga at ang ideya ng banal na pagtanggap nang hindi ito ginagawang payak na pahayag tungkol sa pisikal na pang-amoy ng Diyos.
- issue: Kahulugan ng אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Mas tuwirang pinananatili sa pangunahing teksto ang imahen ng apoy na mahalaga sa ritwal. Ang alternatibong pag-unawa bilang handog na pagkain ay itinatala upang hindi ikubli ang leksikal na usapin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pauusukin” upang mapanatili ang natatanging kilos sa ritwal, at ang “Yahweh” upang tuwirang kumatawan sa pangalang יהוה.
