  terminology: Ang “mga laman-loob,” “mga binti,” “altar,” “handog na sinusunog,” at “kalugod-lugod na samyo” ay angkop. Pinananatili ang “Yahweh,” na tugma sa mismong English POB text na ibinigay. Ang talababa ay pinananatili bilang alternatibong leksikal para sa אִשֶּׁה.
