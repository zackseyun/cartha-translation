base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: tl
  text: Alisin niya ang supot ng pagkain sa lalamunan nito[a], kasama ang mga balahibo nito[b], at itapon ito sa tabi ng altar, sa silangan, sa lugar ng mga abo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang ingluwi nito.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “kasama ang mga balahibo nito”; isinasalin naman ito ng ilan na “kasama ang dumi nito.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: Alisin niya
  rationale: Ang Hiphil ng סור ay nagpapahayag ng pagpapalis o pagtanggal. Likas at tuwiran sa makabagong Tagalog ang “alisin niya” para sa tagubiling panritwal.
- source_word: מֻרְאָתוֹ
  choice: ang balumbalunan nito
  rationale: Sa konteksto ng paghahandog ng ibon, tumutukoy ito sa crop o craw, ang bahaging pansamantalang imbakan ng pagkain. “Balumbalunan” ang pinakamaikli at pinakapamilyar na katawagang Filipino, bagaman maaaring mag-iba ang karaniwang gamit nito ayon sa lugar.
- source_word: בְּנֹצָתָהּ
  choice: kasama ang mga balahibo nito
  rationale: Pinakamalinaw na iniuugnay ng anyong Hebreo ang salita sa נוצה, “balahibo” o “plumahe.” Pinananatili sa talababa ang tradisyunal na alternatibong pagkaunawang “dumi” dahil mahirap ang parirala.
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: at itapon iyon
  rationale: Karaniwang nangangahulugang “itapon” o “ihagis” ang Hiphil ng שלך. Ang “itapon” ay natural at angkop sa konteksto ng pagtatanggal ng bahaging ito.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: sa tabi ng altar
  rationale: Ipinapahayag ng אצל ang malapit na lokasyon sa gilid ng isang bagay. Tumpak at malinaw ang “sa tabi ng altar.”
- source_word: קֵדְמָה
  choice: sa gawing silangan
  rationale: Ang pang-abay na paturol ay tumutukoy sa silangang direksiyon o panig. Natural sa Tagalog ang “sa gawing silangan” nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: sa lugar ng mga abo
  rationale: Sa konteksto ng paghahandog, maaaring tumukoy ang דשן sa mga abong nalalabi sa altar. Pinananatili ng “lugar ng mga abo” ang pangkalahatang anyo ng Hebreo nang hindi ito ginagawang tiyak na bunton.
theological_decisions:
- issue: Ang mahirap na pariralang בְּנֹצָתָהּ
  choice: kasama ang mga balahibo nito
  alternative: kasama ang dumi nito
  rationale: Mas tuwirang sinusuportahan ng anyong katinig at ng konteksto ng ibon ang kahulugang “mga balahibo,” ngunit hindi itinatago ang matagal nang alternatibong interpretasyon; inilalahad ito sa talababa upang mapanatili ang tunay na tekstuwal at leksikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” na karaniwang nauunawaan sa kontekstong biblikal, at ang payak na hulma ng panutong “alisin niya … at itapon” upang mapanatili ang prosedural na himig ng talata.
