  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: tl
  text: At hihiwain niya ito sa mga piraso, kasama ang ulo at taba[a] nito. Aayusin ng pari ang mga iyon sa ibabaw ng kahoy na nasa apoy, na nasa ibabaw ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sebo nito” o “taba sa paligid ng mga laman-loob nito.” Ang salitang Hebreo ay tumutukoy sa matabang tisyu ng hayop na inihahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: hahatiin niya ito sa mga piraso
  rationale: Sa konteksto ng paghahandog, ang נתח ay tumutukoy sa paghiwa o paghati ng hayop sa mga piraso. Likas sa modernong Filipino ang pariralang ito at napapanatili nito ang diwang pamamaraang ipinag-uutos.
- source_word: רֹאשׁוֹ
  choice: ulo nito
  rationale: Tuwirang katawagang anatomiko na malinaw na tumutukoy sa hayop na inihahandog.
- source_word: פִּדְרוֹ
  choice: taba nito
  rationale: Ang bihirang terminong פדר ay tumutukoy sa matabang tisyu ng hayop, marahil sa tabang bumabalot sa mga laman-loob. Ang “taba” ay malinaw at hindi labis na nagpapakitid sa posibleng kahulugan; inilalahad sa talababa ang mas tiyak na alternatibo.
- source_word: וְעָרַךְ
  choice: aayusin
  rationale: Sa kontekstong pangritwal, ang ערך ay nangangahulugang ilagay o ihanay nang maayos. Ang “aayusin” ay natural at nagpapanatili sa ideya ng sinasadyang pagkakaayos.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin ng כהן at angkop sa konteksto ng mga paghahandog sa Levitico.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy nang sama-sama sa mga piraso, ulo, at taba.
- source_word: עַל הָעֵצִים
  choice: sa ibabaw ng kahoy
  rationale: Bagaman maramihan ang anyong Hebreo, karaniwang ginagamit sa Filipino ang kolektibong “kahoy” para sa panggatong.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: na nasa apoy, na nasa ibabaw ng altar
  rationale: 'Pinananatili ang magkapatong na paglalarawan sa Hebreo: ang kahoy ay nasa apoy, at ang apoy ay nasa altar.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari” at “altar” bilang mga karaniwang katawagang biblikal. Pinanatili ang sunod-sunod na lokasyong inilalarawan ng Hebreo nang hindi ginagawang teknikal o lipas ang pananalita.
