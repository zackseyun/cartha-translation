- from: At kung ang handog niya kay Yahweh ay handog na sinusunog mula sa mga ibon, maghahandog siya ng batu-bato o ng batang kalapati.
  to: At kung ang ihahandog niya kay Yahweh bilang handog na sinusunog ay mula sa mga ibon, maghahandog siya ng mga batubato o ng mga batang kalapati.
  rationale: Inayos ang pangungusap upang malinaw na ang handog na sinusunog ay nagmumula sa mga ibon, habang pinanatili ang kondisyunal na daloy, ang banal na pangalan, ang uring handog, at ang dalawang alternatibong uri ng ibon sa pinagmulan.
