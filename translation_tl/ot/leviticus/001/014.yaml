id: LEV.1.14
reference: Leviticus 1:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: tl
  text: At kung ang ihahandog niya kay Yahweh bilang handog na sinusunog ay mula sa mga ibon, maghahandog siya ng mga batubato o ng mga batang kalapati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili nito ang pang-ugnay at kondisyon na nagdurugtong sa kasong ito sa naunang mga tagubilin.
- source_word: מִן הָעוֹף
  choice: mula sa mga ibon
  rationale: Ang עוֹף ay tumutukoy sa mga ibon o lumilipad na nilalang; malinaw at likas sa modernong Filipino ang 'mga ibon.'
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang kinikilalang uring handog na sinusunog sa altar; mas madaling maunawaan kaysa sa literal na 'handog na umaakyat.'
- source_word: קָרְבָּנוֹ
  choice: ang handog niya
  rationale: Ang קָרְבָּן ay handog na inilalapit o inihahandog; natural sa Filipino ang 'handog niya.'
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang 'kay' para sa handog na iniuukol sa isang personal na pinatutungkulan, at tuwirang inililipat ang pangalang יהוה bilang Yahweh.
- source_word: וְהִקְרִיב
  choice: maghahandog siya
  rationale: Ang Hiphil ng קרב ay maglapit o magharap ng handog; ipinahahayag ng 'maghahandog' ang ritwal na kilos nang natural at malinaw.
- source_word: מִן הַתֹּרִים
  choice: ng batu-bato
  rationale: Ang תֹּרִים ay mga turtledove; 'batu-bato' ang karaniwang tiyak na tawag sa ibong ito sa Filipino.
- source_word: אוֹ
  choice: o
  rationale: Pinananatili ang simpleng pagpili sa pagitan ng dalawang pinahihintulutang uri ng ibon.
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: ng batang kalapati
  rationale: Ang idyomang 'mga anak ng kalapati' ay tumutukoy sa mga batang kalapati; likas sa Filipino ang isahang pangkalahatang anyo pagkatapos ng 'o.'
- source_word: אֶת קָרְבָּנוֹ
  choice: maghahandog siya ng
  rationale: Ang inuulit na 'kanyang handog' sa Hebreo ay naipahihiwatig na sa pandiwang 'maghahandog' at sa tuwirang layon; iniiwasan nito ang mabigat na pag-uulit sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang pangalan ang יהוה sa teksto; pinananatili ng 'Yahweh' ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng עֹלָה
  choice: handog na sinusunog
  alternative: handog na paakyat
  rationale: Ipinahahayag nito ang tiyak na kategoryang pansakripisyo nang hindi ginagawang doktrinal na paliwanag ang etimolohikong ideya ng pag-akyat.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong ritwal. Ginamit ang payak na ayos ng pangungusap at mga terminong madaling maunawaan, habang pinananatili ang kondisyunal na daloy at ang dalawang pinahihintulutang uri ng ibon.
