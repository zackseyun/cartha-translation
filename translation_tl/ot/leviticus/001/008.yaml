  text: וְ/עָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים אֵ֚ת הַ/נְּתָחִ֔ים אֶת הָ/רֹ֖אשׁ וְ/אֶת הַ/פָּ֑דֶר עַל הָ/עֵצִים֙ אֲשֶׁ֣ר עַל הָ/אֵ֔שׁ אֲשֶׁ֖ר עַל הַ/מִּזְבֵּֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: tl
  text: At iaayos ng mga anak ni Aaron, na mga pari, ang mga piraso, ang ulo, at ang taba[a] sa ibabaw ng kahoy na nasa apoy na nasa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sebo” o “matabang balot”; ang salitang Hebreo ay tumutukoy sa isang matabang bahagi ng hayop na ginagamit sa handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: At iaayos
  rationale: Ipinahahayag ng pandiwang ערך ang maayos na paglalatag ng mga bahagi sa konteksto ng paghahandog. Pinananatili ng “At” ang pang-ugnay sa Hebreo at ng “iaayos” ang estilong tagubilin.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ng mga anak ni Aaron, na mga pari
  rationale: Ang “na mga pari” ay appositional na pagkakakilanlan ng mga anak ni Aaron. Nililinaw ito ng mga kuwit nang hindi ginagawang hiwalay na pangkat ang mga pari.
- source_word: הַנְּתָחִים
  choice: ang mga piraso
  rationale: Tumutukoy ang נְתָחִים sa mga bahaging pinagputol-putol ng hayop sa naunang hakbang. Natural at sapat na kongkreto sa Filipino ang “mga piraso.”
- source_word: הָרֹאשׁ
  choice: ang ulo
  rationale: Tuwirang katumbas ito ng karaniwang katawagang anatomikal sa Hebreo.
- source_word: הַפָּדֶר
  choice: ang taba
  rationale: Ang פָּדֶר ay isang matabang bahagi ng hayop, posibleng sebo o matabang balot. Pinili ang madaling maunawaang “taba,” habang inilalagay sa talababa ang mas tiyak ngunit di-ganap na tiyak na mga alternatibo.
- source_word: עַל הָעֵצִים
  choice: sa ibabaw ng kahoy
  rationale: Ginagamit ang “kahoy” bilang kolektibong katawagan sa panggatong. Malinaw na ipinahahayag ng “sa ibabaw ng” ang ugnayang panlunan.
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: na nasa apoy na nasa altar
  rationale: 'Pinananatili ang magkasunod at bahagyang paulit-ulit na mga sugnay ng Hebreo: ang kahoy ay nasa apoy, at ang apoy ay nasa altar. Hindi ito pinakinis sa paraang babago sa tahasang pagkakasunod ng paglalarawan.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang estilong pamamaraang tagubilin at ang sunod-sunod na paglalarawang panlunan ng Hebreo. Inilipat ang panandang [a] sa “taba,” na siyang salitang talagang ipinaliliwanag ng talababa.
