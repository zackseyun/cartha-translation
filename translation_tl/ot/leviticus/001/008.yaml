  source_fidelity: 'Tumpak na naipapahayag ang Hebreo: ang mga anak ni Aaron na mga pari ang magsasaayos ng mga piraso, ulo, at taba sa kahoy na nasa apoy na nasa altar. Napapanatili rin ang magkakasunod na mga sugnay na panlunan nang walang idinagdag na interpretasyon.'
