revisions:
- from: Pupunitin niya ang ibon sa may mga pakpak nito, ngunit hindi niya ito paghihiwalayin nang tuluyan. Pagkatapos, susunugin ito ng pari sa altar, sa ibabaw ng mga kahoy na nasa apoy. Ito ay isang handog na sinusunog, isang handog na pinaraan sa apoy[a], na may kalugod-lugod na samyo para kay Yahweh.
  to: Pupunitin niya ito sa mga pakpak nito, ngunit hindi niya ito lubusang paghihiwalayin. At susunugin ito ng pari sa altar, sa ibabaw ng mga kahoy na nasa apoy. Ito ay handog na sinusunog, handog na inihahandog sa pamamagitan ng apoy[a], isang samyong kalugud-lugod kay Yahweh.
