base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Pupunitin niya ito sa mga pakpak nito, ngunit hindi niya ito lubusang paghihiwalayin. At susunugin ito ng pari sa altar, sa ibabaw ng mga kahoy na nasa apoy. Ito ay handog na sinusunog, handog na inihahandog sa pamamagitan ng apoy[a], isang samyong kalugud-lugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁסַּע
  choice: pupunitin
  rationale: Ipinahahayag ng pandiwa ang pagpunit o pagbiyak sa katawan ng ibon; ang “pupunitin” ay malinaw at likas sa modernong Filipino.
- source_word: בִכְנָפָיו
  choice: sa may mga pakpak nito
  rationale: Pinananatili nito ang konkretong bahagi o kinalalagyan ng pagpunit nang hindi ipinipilit kung instrumento o eksaktong lokasyon ang diin ng pang-ukol.
- source_word: לֹא יַבְדִּיל
  choice: hindi niya ito paghihiwalayin nang tuluyan
  rationale: Nililinaw ng Hiphil ng בדל na bubuksan o pupunitin ang ibon ngunit hindi ganap na paghihiwalayin ang mga bahagi nito.
- source_word: וְהִקְטִיר
  choice: susunugin
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa pagsunog sa altar upang umusok ang handog; “susunugin” ang pinakanatural na salin sa Filipino.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Karaniwan at malinaw na terminong panghandog sa modernong Filipino.
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: sa ibabaw ng mga kahoy na nasa apoy
  rationale: Pinananatili ang magkapatong na ayos na tahasang inilalarawan ng Hebreo.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang malinaw at nakaugaliang tawag sa handog na lubusang sinusunog sa konteksto ng Levitico.
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Tuwirang ipinahahayag nito ang malamang na kultikong diwa ng handog na inihahandog sa pamamagitan ng apoy; inilalagay sa talababa ang ibang posibleng pagkaunawa.
- source_word: רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  rationale: Likas at marangal itong salin ng nakapirming pormulang panghandog at pinananatili ang talinghaga ng samyo.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag ng “para kay” ang kaugnayan ng handog at samyo kay Yahweh, habang pinananatili ang banal na pangalan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng pormulang רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: nakagiginhawang samyo
  rationale: Pinananatili nito ang talinghagang sakripisyal at ang diwa ng kaluguran o pagtanggap, nang hindi nagdaragdag ng sistematikong paliwanag na wala sa teksto.
- issue: Pagkaunawa sa אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Mas tuwirang tumutugma sa konteksto ng pagsunog ang pangunahing salin, ngunit kinikilala sa talababa ang leksikal at kultikong alternatibo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ibon” upang maging malinaw ang tinutukoy ng mga panghalip mula sa naunang konteksto. Ang “nang tuluyan” ay nagpapakita na pupunitin ang ibon ngunit hindi ganap na paghihiwalayin. Inilipat ang talababa sa אִשֵּׁה, ang salitang tunay na may leksikal na alternatibo.
