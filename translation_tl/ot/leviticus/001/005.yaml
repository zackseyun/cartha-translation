revisions:
- from: Kakatayin niya ang batang toro[a] sa harap ni Yahweh. Pagkatapos, ihaharap ng mga anak ni Aaron na mga pari ang dugo at isasaboy iyon sa lahat ng panig ng altar[b] na nasa pasukan ng tolda ng pagpupulong.
  to: Kakatayin niya ang batang toro[a] sa harap ni Yahweh, at ihaharap ng mga anak ni Aaron, na mga pari, ang dugo at isasaboy iyon sa lahat ng panig ng altar[b] na nasa pasukan ng tolda ng pagpupulong.
  rationale: Inalis ang “Pagkatapos” upang huwag magdagdag ng tahasang relasyong temporal na hindi ipinahahayag ng Hebreo, at ginawang iisang pangungusap na pinag-uugnay ng “at.” Naglagay rin ng mga kuwit upang malinaw na apposition ang “na mga pari.” Hindi binago ang kahulugan o ang mga salitang teknikal at tala.
