id: LEV.1.5
reference: Leviticus 1:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָׁחַ֛ט אֶת בֶּ֥ן הַ/בָּקָ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ֠/הִקְרִיבוּ בְּנֵ֨י אַהֲרֹ֤ן הַֽ/כֹּֽהֲנִים֙ אֶת הַ/דָּ֔ם וְ/זָרְק֨וּ אֶת הַ/דָּ֤ם עַל הַ/מִּזְבֵּ֨חַ֙ סָבִ֔יב אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: tl
  text: Kakatayin niya ang batang toro[a] sa harap ni Yahweh, at ihaharap ng mga anak ni Aaron, na mga pari, ang dugo at isasaboy iyon sa lahat ng panig ng altar[b] na nasa pasukan ng tolda ng pagpupulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “anak ng bakahan,” isang idyoma para sa hayop na mula sa bakahan; dito ay isinaling “batang toro.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ihahagis ang dugo sa altar sa palibot nito.” Ang pandiwang Hebreo ay tumutukoy sa paghagis o pagsaboy ng dugo bilang panritwal na paglalapat; tradisyonal din itong isinasaling “wiwisikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Kakatayin niya
  rationale: Ang pandiwang Hebreo ay tumutukoy sa pagkatay ng hayop. Sa konteksto ng sunud-sunod na tagubilin, likas sa Tagalog ang aspektong kontemplatibo upang ipahayag ang iniutos na gagawin.
- source_word: בֶּן הַבָּקָר
  choice: ang batang toro
  rationale: Literal itong ‘anak ng bakahan/kawan ng baka,’ isang idyoma para sa batang hayop na mula sa bakahan; malinaw at likas sa kontekstong ito ang ‘batang toro.’
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang panritwal at spatial na diwa ng ‘sa harap/presensiya ni’ at tuwirang isinasalin ang banal na pangalan.
- source_word: וְהִקְרִיבוּ
  choice: ihaharap
  rationale: Ang hiphil ng קרב ay ‘ilapit’ o ‘iharap.’ Ang ‘ihaharap’ ay angkop kapag dugo ang layon at hindi ipinahihiwatig na ito ang buong handog.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ng mga anak ni Aaron na mga pari
  rationale: Pinananatili ang ugnayang pampamilya at ang appositional na tungkulin nila bilang mga pari.
- source_word: וְזָרְקוּ
  choice: isasaboy
  rationale: Ipinahihiwatig ng זרק ang paghagis o pagsaboy ng dugo sa panritwal na paglalapat. Mas likas ang ‘isasaboy’ sa Tagalog kaysa ‘ihahagis’ kapag likido ang tinutukoy, ngunit mas malakas ito kaysa ‘wiwisikan.’
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa lahat ng panig ng altar
  rationale: Likas nitong ipinapahayag na inilalapat ang dugo sa altar sa palibot nito, nang hindi nililimitahan kung ibabaw o tagiliran ang eksaktong tinamaan.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: na nasa pasukan ng tolda ng pagpupulong
  rationale: Tinutukoy ng sugnay ang kinaroroonan ng altar. Ang ‘tolda ng pagpupulong’ ay malinaw at tuwirang katumbas ng אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Tindi ng kilos sa panritwal na paglalapat ng dugo
  choice: isasaboy
  alternative: wiwisikan; ihahagis
  rationale: Hindi pinapahina sa karaniwang ‘pagwiwisik’ ang kilos ng זרק, ngunit pinipili ang likas na salitang Filipino para sa paghagis o pagpapadpad ng likido.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘altar’ bilang karaniwang salitang panrelihiyon sa modernong Tagalog, at ‘tolda ng pagpupulong’ bilang malinaw na salin sa halip na ang mas teknikal na ‘tabernakulo.’
