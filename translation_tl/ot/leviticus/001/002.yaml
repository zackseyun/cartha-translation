source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: tl
  text: '“Magsalita ka sa mga anak ni Israel[a] at sabihin mo sa kanila: Kung ang isang tao[b] mula sa inyo ay magdadala ng handog kay Yahweh, magdadala kayo ng inyong handog mula sa mga alagang hayop—mula sa mga baka o mula sa mga tupa at kambing.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita” o “sambayanang Israel.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “isang lalaki” o “sinuman.” Ang Hebreong אָדָם (adam) ay ginamit dito para sa isang kinatawang indibidwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal na Hebreong katawagan at ang kaugnayan nito sa pangalang Israel; nasa talababa ang mas karaniwang alternatibo.
- source_word: אָדָם
  choice: isang tao
  rationale: Sa kontekstong ito, tumutukoy ang אָדָם sa isang kinatawang indibidwal, hindi lamang sa lalaking nasa hustong gulang. Likas at tumpak sa modernong Tagalog ang “isang tao.”
- source_word: יַקְרִיב
  choice: nagdala
  rationale: Ang Hiphil ng קרב sa kontekstong paghahandog ay nangangahulugang maglapit o magharap ng handog. Ipinakikita ng “nagdala” ang kongkretong kilos nang hindi nililimitahan ang קָרְבָּן sa isang uri ng sakripisyo.
- source_word: מִכֶּם
  choice: mula sa inyo
  rationale: 'Pinananatili ang partitibong diwa: isang indibidwal na kabilang sa pamayanan.'
- source_word: קָרְבָּן
  choice: handog
  rationale: Malawak at likas na salin ito para sa bagay na inihaharap sa Diyos; ang “sakripisyo” ay maaaring maging masyadong makitid.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalan ng tipan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: הַבְּהֵמָה
  choice: mga alagang hayop
  rationale: Tumutukoy ito rito sa pangkalahatang uri ng domestikadong hayop na mapaghahandugan.
- source_word: הַבָּקָר
  choice: bakahan
  rationale: Tumutukoy sa pangkat ng mga baka bilang malaking hayop na inaalagaan at inihahandog.
- source_word: הַצֹּאן
  choice: kawan
  rationale: Tumutukoy sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng “kawan” ang maikling kolektibong katawagan.
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: dapat ninyong dalhin ang inyong handog
  rationale: Pinananatili ang paglipat mula sa isahang taong nasa kundisyon tungo sa pangmaramihang kausap sa pangunahing tagubilin, gayundin ang ugnayang leksikal sa naunang יַקְרִיב.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa Hebreong teksto ang Tetragrammaton bilang mismong pangalan. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kinatawang gamit ng אָדָם
  choice: isang tao
  alternative: isang lalaki; sinuman
  rationale: Bagaman maaaring tumukoy ang אָדָם sa lalaki, ginagamit ito rito bilang kinatawang indibidwal sa panuntunang pangkaso. Hindi ipinapalagay ng salin na lalaki lamang ang saklaw, ngunit itinatala sa talababa ang literal na posibilidad.
- issue: Katawagan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ang pormal na Hebreong idyoma, habang ibinibigay sa talababa ang mas malinaw na kolektibong kahulugan.
- issue: Paglipat mula isahan tungo sa maramihan
  choice: isang tao … dapat ninyong dalhin ang inyong handog
  alternative: sinuman sa inyo … dapat niyang dalhin ang kanyang handog
  rationale: 'Sadyang pinananatili ang tensiyon sa Hebreo: isahan ang indibidwal na naghaharap sa kundisyon, ngunit maramihan ang utos at panghalip sa hulihan.'
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sabihin mo” at “dapat ninyong dalhin” upang malinaw na maipakita ang isahan at maramihang anyo ng kausap. Ang “bakahan” at “kawan” ay nagpapanatili sa paghahati ng Hebreo sa malalaki at maliliit na alagang hayop.
