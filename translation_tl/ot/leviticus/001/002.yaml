  naturalness: Mas likas sa modernong Filipino ang kondisyunal na “Kung ... ay magdadala” na sinusundan ng “magdadala kayo.” Ang “mga baka” at “mga tupa at kambing” ay malinaw at idiomatiko para sa dalawang pangkat ng hayop sa Hebreo.
  terminology: Ang “handog,” “Yahweh,” at “mga alagang hayop” ay angkop. Pinalitan ang “bakahan” ng “mga baka”; isinalin nang malinaw ang צֹאן bilang “mga tupa at kambing,” dahil saklaw ng termino ang maliliit na hayop na ito.
