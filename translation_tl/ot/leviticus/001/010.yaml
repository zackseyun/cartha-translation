source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: tl
  text: At kung ang handog niya ay mula sa kawan—mula sa mga tupa o mga kambing—bilang handog na sinusunog[a], maghahandog siya ng isang lalaking hayop na walang kapintasan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa isang handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Ang “walang kapintasan” ay nangangahulugang walang pisikal na depekto, gaya ng hinihingi para sa handog na ito.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyong ipinahihiwatig ng אִם habang likas na ipinagpapatuloy ang mga tagubilin.
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing, na tahasang tinutukoy sa kasunod na parirala.
- source_word: קָרְבָּנוֹ
  choice: ang handog niya
  rationale: Ang קָרְבָּן ay bagay na inihaharap bilang handog sa pagsamba; malinaw at karaniwan sa Filipino ang “handog.”
- source_word: מִן הַכְּשָׂבִים
  choice: mula sa mga tupa
  rationale: Hindi nililimitahan sa batang tupa ang kategoryang כְּשָׂבִים, kaya mas tumpak dito ang pangkalahatang “mga tupa.”
- source_word: אוֹ מִן הָעִזִּים
  choice: o mga kambing
  rationale: Likas na katumbas ng maramihang עִזִּים at malinaw na ikalawang uri sa loob ng kawan.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ipinahahayag ang kinikilalang uri ng hain na עֹלָה sa malinaw na modernong Filipino; pinananatili sa talababa ang posibleng ugnayang “para sa.”
- source_word: זָכָר
  choice: isang lalaking hayop
  rationale: Tahasan nitong pinananatili ang kahingian tungkol sa kasarian ng hayop at iniiwasang mapagkamalang lalaking tao.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa hayop na walang pisikal na depekto.
- source_word: יַקְרִיבֶנּוּ
  choice: maghahandog siya
  rationale: Ang Hiphil ng קרב sa kontekstong ito ay ang pagharap o paghahandog ng hayop; natural na naisasama sa kasunod na tuwirang layon ang pronominal na hulapi.
theological_decisions:
- issue: Pagpapakahulugan sa katawagang panghain na עֹלָה
  choice: handog na sinusunog
  alternative: handog na umaakyat
  rationale: Ang “handog na sinusunog” ay malinaw na tumutukoy sa kinikilalang uri ng handog sa Levitico nang hindi nagdaragdag ng teolohikal na paliwanag; ang “umaakyat” ay etimolohikal ngunit hindi gaanong malinaw sa karaniwang mambabasa.
- issue: Kasarian ng hayop na ihahandog
  choice: isang lalaking hayop
  alternative: isang lalaki
  rationale: Tahasang binabanggit ng Hebreo ang kasarian ng hayop. Pinananatili ito habang nililinaw na hayop, hindi tao, ang tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga gitling na em dash upang malinaw na ipakita na ang mga tupa at kambing ang mga uri sa loob ng “kawan.”
