  terminology: Ang “handog,” “handog na sinusunog,” at “walang kapintasan” ay magkakatugma, malinaw sa kontekstong panghain, at pinananatili ang teknikal na kahulugan ng mga terminong Hebreo nang hindi nagpapataw ng doktrinal na pagbasa.
