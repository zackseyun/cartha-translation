  source_fidelity: 'Tapat ang salin sa Hebreo: napapanatili ang magkakaugnay na kondisyon, ang saklaw na kawan na saka nililinaw bilang mga tupa o kambing, ang layuning handog na sinusunog, at ang kahingian na lalaking hayop na walang kapintasan. Wala itong idinagdag na interpretasyong wala sa teksto.'
