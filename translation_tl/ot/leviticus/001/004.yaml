  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: tl
  text: Ipapatong niya ang kanyang kamay sa ulo ng handog na sinusunog, at tatanggapin ito[a] alang-alang sa kanya upang maipambayad-sala para sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at siya ay tatanggapin”—maaaring unawain ang pasibong pandiwa sa Hebreo bilang mas tuwirang tumutukoy sa naghahandog kaysa sa handog.
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ipapatong niya
  rationale: Likas at malinaw na paglalarawan sa ritwal na paglalagay ng kamay sa hayop; hindi nito labis na tinutukoy kung gaano kalakas ang pagdiin.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Pinanatili ang isahang anyo at ang tuwirang kaugnayang paari ng Hebreo.
- source_word: עַל רֹאשׁ
  choice: sa ulo ng
  rationale: Natural na Filipino para sa pisikal na paglalagay ng kamay sa ibabaw ng ulo.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Karaniwan at madaling maunawaang katumbas ng terminong pansakripisyo na tumutukoy sa handog na sinusunog.
- source_word: וְנִרְצָה
  choice: at tatanggapin iyon
  rationale: Pinanatili ang pasibong diwa at itinuring ang handog bilang pinakamalapit na tinutukoy, habang inilalahad sa talababa ang tunay na alternatibong pagbasa.
- source_word: לוֹ
  choice: alang-alang sa kanya
  rationale: Ipinahahayag ang kapakinabangan o pagtanggap ng handog para sa naghahandog nang natural sa Filipino.
- source_word: לְכַפֵּר
  choice: upang magbayad-sala
  rationale: Pinananatili ang bigat ng terminong pansakripisyo nang hindi itinatakda ang isang partikular na teorya ng pagtubos.
- source_word: עָלָיו
  choice: para sa kanya
  rationale: Malinaw na ipinakikitang ang naghahandog ang taong pinaggagawan ng pagbabayad-sala.
theological_decisions:
- issue: Ang tinutukoy ng pasibong pandiwang וְנִרְצָה
  choice: ang handog ang tatanggapin
  alternative: ang naghahandog ang tatanggapin
  rationale: Sa konteksto, ang handog ang pinakamalapit na tinutukoy at natural na sumusunod sa pagkakasunod-sunod ng ritwal. Gayunman, maaari ring iugnay ang panlalaking isahang pasibo sa naghahandog, kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal; pinanatili ang bokabularyong pansakripisyo at ang ambiguwidad ng Hebreo sa pamamagitan ng talababa.
