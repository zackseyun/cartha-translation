id: LEV.1.1
reference: Leviticus 1:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, tinawag ni Yahweh[a] si Moises at nagsalita sa kanya mula sa Tolda ng Pagtatagpo. Sinabi niya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay may banal na pangalang יהוה (YHWH), na isinasaling “Yahweh.”
    reason: terminology
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Ang קרא na may אֶל ay tumutukoy rito sa pagtawag ni Yahweh kay Moises upang kausapin siya. Tapat at likas ang “tinawag” nang hindi ipinahihiwatig na sumigaw siya o pormal na ipinatawag si Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakagawiang anyo ng pangalang משה sa modernong Tagalog.
- source_word: וַיְדַבֵּר
  choice: nagsalita
  rationale: Ang דבר ay karaniwang ginagamit para sa pormal na pagpapahayag, lalo na sa pananalita ng Diyos. Pinananatili ng “nagsalita” ang kaibahan nito sa kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na banal na pangalan sa halip na palitan ng titulong “PANGINOON.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang tumutukoy kay Moises ang panghalip na hulapi.
- source_word: מֵאֹהֶל מוֹעֵד
  choice: mula sa Tolda ng Pagtatagpo
  rationale: Ang אֹהֶל מוֹעֵד ay santuwaryong tolda kung saan nakikipagtagpo ang Diyos sa Israel. Iniiwasan ng “Pagtatagpo” ang maling pag-uugnay ng מוֹעֵד sa “tipan,” habang likas at malinaw sa Tagalog.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ipinakikilala ng anyong ito ang mismong nilalaman ng pahayag sa susunod na talata. Higit na likas sa Tagalog ang hiwalay na “Sinabi niya,” kaysa sa mabigat na “na sinasabi.”
- source_word: וַ־
  choice: Pagkatapos
  rationale: Ipinahihiwatig ng panimulang waw-consecutive ang pagpapatuloy at pagsulong ng salaysay mula sa huling bahagi ng Exodo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo; inilalahad sa talababa ang isa pang tradisyonal na anyo.
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtatagpo
  alternative: Tolda ng Pagpupulong; toldang tipanan
  rationale: Maaaring tukuyin ng מוֹעֵד ang itinakdang pagkikita o pagtitipon. Ang “Pagtatagpo” ay angkop sa santuwaryong konteksto at hindi nagdaragdag ng ideya ng “tipan,” na wala sa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginawang dalawang sugnay na pangungusap ang pormulang וַיְדַבֵּר ... לֵאמֹר upang maging likas sa Tagalog at mapanatili ang paghahanda sa tuwirang pahayag sa susunod na talata. Ginamit ang malaking titik sa “Tolda ng Pagtatagpo” bilang nakatalagang pangalan ng santuwaryo.
