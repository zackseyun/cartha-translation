base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: tl
  text: Huwag niyang suriin kung mabuti o masama[a] ang hayop, ni huwag niya itong ipagpalit. Ngunit kung talagang ipagpapalit niya ito, kapuwa ang hayop at ang ipinalit dito ay magiging banal[b]. Hindi ito matutubos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suriin upang pag-ibahin ang mabuti sa masama.” Tumutukoy ang idyomang Hebreo sa pagpili ng hayop ayon sa kalidad nito.
    reason: lexical_alternative
  - marker: b
    text: 'Binibigyang-diin ng Hebreo ang pandiwa: “kung talagang ipagpapalit niya ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר
  choice: suriin
  rationale: Sa konteksto ng ikapu ng mga hayop, tumutukoy ang piel ng בקר sa pagsusuri upang pumili batay sa kalidad; likas at malinaw sa modernong Filipino ang “suriin.”
- source_word: בֵּין טוֹב לָרַע
  choice: kung mabuti o masama
  rationale: Ipinahahayag ng idyomang Hebreo ang pagkilala o pagpili ayon sa kalidad. Pinananatili ng salin ang dalawang kategorya sa natural na anyong Filipino.
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: ipagpalit iyon / talagang ipagpalit niya iyon
  rationale: Teknikal na tumutukoy ang מור sa pagpapalit ng isang hayop sa iba. Ang “talagang” ay kumakatawan sa diin ng infinitive absolute na הָמֵר kasunod ng pandiwang יְמִירֶנּוּ.
- source_word: תְמוּרָתוֹ
  choice: ang ipinalit dito
  rationale: Malinaw nitong tinutukoy ang ibang hayop na inilagay bilang kapalit ng orihinal nang hindi gumagamit ng malabo o labis na teknikal na katawagan.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Pinananatili ng “banal” ang legal at pangsambang diwa ng bagay na itinalaga sa Diyos sa Levitico.
- source_word: לֹא יִגָּאֵל
  choice: Hindi ito maaaring tubusin
  rationale: Ang niphal ng גאל ay tumutukoy sa pagtubos o pagbawi mula sa katayuang nakatalaga. Ang “tubusin” ay nagpapanatili sa terminolohiyang panrelihiyon at legal ng talata.
- source_word: הוּא וּתְמוּרָתוֹ
  choice: kapuwa ang hayop at ang ipinalit dito
  rationale: Ginagawang malinaw ng “kapuwa” na saklaw ng banal na katayuan ang orihinal at ang ipinalit.
theological_decisions:
- issue: Legal at pangsambang puwersa ng wikang ukol sa pagtatalaga
  choice: Isinalin ang קֹדֶשׁ bilang “banal” at ang גאל bilang “tubusin.”
  alternative: “sagrado” at “bilhing muli” o “bawiin”
  rationale: Ang talata ay bahagi ng mga batas tungkol sa mga hayop na itinalaga sa Diyos. Pinananatili ng mga piniling salita ang pangsambang at legal na diwa nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan, na may legal-pangsambang himig. Inulit ang “hayop” upang maging malinaw ang tinutukoy ng mga panghalip. Ang lahat ng panandang talababa [a] at [b] ay nasa pangunahing teksto.
