  to: Huwag niyang suriin kung mabuti o masama[a] ang hayop, ni huwag niya itong ipagpalit. Ngunit kung talagang ipagpapalit niya ito, kapuwa ang hayop at ang ipinalit dito ay magiging banal[b]. Hindi ito matutubos.
