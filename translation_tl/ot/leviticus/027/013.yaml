  text: וְ/אִם גָּאֹ֖ל יִגְאָלֶ֑/נָּה וְ/יָסַ֥ף חֲמִישִׁת֖/וֹ עַל עֶרְכֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/013.yaml
  text: But if he does redeem it[a], then he shall add a fifth to your valuation.
translation:
  language: tl
  text: Ngunit kung talagang tutubusin niya iyon[a], magdaragdag siya ng isang ikalima sa halagang itinakda mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tutubusin niya iyon” o “tiyak na tutubusin niya iyon”; gumagamit ang Hebreo ng infinitive absolute kasama ng finite verb upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinapakita ng pangatnig at kondisyunal ang salungat na posibilidad kasunod ng naunang tuntunin; natural itong ipinapahayag sa Tagalog bilang “Ngunit kung.”
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: talagang tutubusin niya iyon
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin sa pagtubos. Pinananatili ng “talagang” ang diin, at ang “iyon” ay tumutukoy sa hayop na binanggit sa naunang talata.
- source_word: וְיָסַף
  choice: magdaragdag siya
  rationale: Sa kontekstong legal, ipinahahayag ng anyo ang kinakailangang bunga ng kondisyong nauna; malinaw at natural sa Tagalog ang hinaharap na “magdaragdag siya.”
- source_word: חֲמִישִׁתוֹ
  choice: isang ikalima
  rationale: Tumutukoy ito sa karagdagang bahaging katumbas ng one-fifth. Hindi tahasang inuulit sa salin ang pinagbabatayang halaga sapagkat hindi rin ito tahasang inuulit sa pariralang Hebreo.
- source_word: עַל עֶרְכֶּךָ
  choice: sa halagang itinakda mo
  rationale: Ang עַל pagkatapos ng pandiwang “magdagdag” ay nangangahulugang idagdag sa ibabaw ng naunang halaga, at ang עֶרְכֶּךָ ay ang pagtatayang itinakda ng kinakausap na pari.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tutubusin” para sa legal na pagbawi ng inialay na ari-arian, at “halagang itinakda” para sa pagtatayang pari. Ang hulaping pambabae sa Hebreo ay tumutukoy sa hayop sa naunang talata, ngunit walang kasarian ang panghalip na Tagalog na “iyon.”
