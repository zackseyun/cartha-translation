  yaml_path: translation/ot/leviticus/027/022.yaml
  text: But if he consecrates to Yahweh a field of his purchase[a], which is not from the field of his inherited property,
translation:
  language: tl
  text: Ngunit kung itatalaga niya kay Yahweh ang isang bukid na binili niya[a], na hindi bahagi ng minana niyang lupain,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang bukid na kaniyang binili,” bilang kaibahan sa lupaing minana niya sa kaniyang mga ninuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ang kondisyong kasunod at ang bahagyang pag-iiba nito sa naunang kaso.
- source_word: שְׂדֵה מִקְנָתוֹ
  choice: isang bukid na binili niya
  rationale: Natural sa makabagong Filipino at malinaw na tumutukoy sa lupang nakuha sa pagbili, hindi sa minanang lupain.
- source_word: אֲשֶׁר לֹא מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: na hindi bahagi ng minana niyang lupain
  rationale: Inihahatid ang legal na pagkakaiba ng biniling bukid at ng lupaing minana bilang pag-aaring angkan; natural na ipinapahayag ng “bahagi ng” ang gamit ng מִן dito.
- source_word: יַקְדִּישׁ
  choice: itatalaga
  rationale: Sa kontekstong panata at batas, nangangahulugan itong ibukod at iukol bilang banal kay Yahweh; malinaw at marangal ang “itatalaga” sa Filipino.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה at likas sa Filipino ang pang-ukol na “kay” para sa personal na pangalan.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang ipinahayag na personal na pangalan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal at panrelihiyong diwa ng talata habang iniwasan ang di-natural na literalismong “bukid ng kaniyang pagbili.”
