id: LEV.27.34
reference: Leviticus 27:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: tl
  text: Ito ang mga utos na iniutos ni Yahweh kay Moises para sa mga anak ni Israel sa Bundok Sinai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga anak ni Israel” o “para sa mga Israelita.”
    reason: Pinananatili ang maaaring pagkakaiba sa pagbasa ng אֶל at ang mas idyomatikong alternatibo para sa בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang pormula sa Tagalog para sa pangwakas na buod; hindi kailangang tumbasan nang hiwalay ang pandiwang panagkop na ipinahihiwatig sa Hebreo.
- source_word: הַמִּצְוֺת
  choice: mga utos
  rationale: Pinananatili ang legal na lakas ng מִצְוָה sa malinaw at karaniwang salitang Tagalog.
- source_word: אֲשֶׁר צִוָּה
  choice: na iniutos
  rationale: Tuwirang ipinapakita ang kaugnayang leksikal ng pangngalang 'mga utos' at pandiwang 'iniutos,' gaya ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Si Moises ang tuwirang layon ng pandiwang 'iniutos'; ang 'kay' ang likas na pananda sa Tagalog para sa personal na layon sa ganitong ayos.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Ang 'para sa' ay natural na nagpapahayag na ang mga utos na ibinigay kay Moises ay ukol sa Israel, habang pinananatili ng 'mga anak ni Israel' ang anyo ng Hebreong idyoma.
- source_word: בְּהַר סִינָי
  choice: sa Bundok Sinai
  rationale: Karaniwan at malinaw na paraan sa Tagalog ng pagtukoy sa lokasyong Sinai nang hindi ipinipilit kung 'sa' o 'ibabaw ng' bundok ang eksaktong diin.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh at hindi pinapalitan ng titulo.
- issue: Pagsasalin sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ang kongkretong Hebreong parirala, na tumutukoy sa bayang nagmula kay Israel at hindi kinakailangang sa mga lalaking anak lamang.
- issue: Ugnayan ng אֶל sa mga utos at sa Israel
  choice: para sa mga anak ni Israel
  alternative: sa mga anak ni Israel
  rationale: Maaaring magpahiwatig ang אֶל ng direksiyon o patutunguhan. Pinili ang 'para sa' bilang natural sa pangungusap, ngunit inilalagay sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na 'mga utos' at pinanatili ang pormal na pangwakas na pormula, ang personal na pangalang Yahweh, at ang tradisyonal ngunit nauunawaang pariralang 'mga anak ni Israel.'
