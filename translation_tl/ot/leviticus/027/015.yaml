  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: tl
  text: At kung tutubusin ng nagbukod nito bilang banal ang kanyang bahay[a], magdaragdag siya ng isang ikalima sa halagang pilak na itinakda mo para rito[b], at magiging kanya iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang nagtalaga nito bilang banal” o “ang nagpabanal nito.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, magdaragdag siya ng isang ikalima sa halagang pilak na itinakda ng pari.
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: ang nagtalaga nito
  rationale: Sa kontekstong ito, ang pandiwaring mula sa קדשׁ ay tumutukoy sa taong nagbukod ng bahay bilang banal para sa PANGINOON. Likas at malinaw sa makabagong Filipino ang “nagtalaga,” habang pinananatili ng konteksto ang sagradong diwa.
- source_word: יִגְאַל
  choice: tutubusin
  rationale: Sa legal at panrelihiyong kontekstong ito, tumutukoy ang גאל sa pagbawi ng ari-arian sa pamamagitan ng itinakdang bayad. Ang “tutubusin” ang karaniwang salitang angkop sa ganitong tuntunin.
- source_word: בֵּיתוֹ
  choice: ang kanyang bahay
  rationale: Tuwirang katumbas ito ng Hebreong “kanyang bahay” at angkop sa usapin ng pagtatasa sa ari-arian.
- source_word: וְיָסַף
  choice: magdaragdag siya
  rationale: Ipinahahayag ng anyo rito ang kinakailangang kilos kasunod ng kondisyon. Natural sa Filipino ang “magdaragdag siya” sa legal na pahayag.
- source_word: חֲמִישִׁית
  choice: isang ikalima
  rationale: Eksaktong ipinahahayag nito ang bahaging one-fifth nang hindi gumagamit ng makabagong porsiyento.
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: sa pilak na halagang itinakda mo
  rationale: Pinananatili ng “pilak” ang kongkretong כֶּסֶף, samantalang ipinahahayag ng “halagang itinakda mo” ang pagtatasa at ang ikalawang panauhang isahan ng עֶרְכְּךָ.
- source_word: עָלָיו
  choice: para rito
  rationale: Sa konteksto, ang dagdag na ikalima ay idinaragdag sa halagang itinakda para sa bahay. Nililinaw ng “para rito” ang tinutukoy nang hindi binabago ang legal na diwa.
- source_word: וְהָיָה לוֹ
  choice: at magiging kanya iyon
  rationale: 'Direkta nitong ipinapahayag ang bunga ng pagtubos: muling mapapasakanya ang bahay, nang hindi tahasang idinaragdag sa pangunahing teksto ang salitang “muli.”'
theological_decisions:
- issue: Terminong panritwal para sa ari-ariang ibinukod sa Diyos
  choice: nagtalaga
  alternative: naghandog bilang banal; nagpabanal
  rationale: Ang “nagtalaga” ay natural at marangal sa Filipino at sapat na nagpapahiwatig ng pormal na pagbubukod ng bahay sa PANGINOON sa ilalim ng mga tuntunin sa Levitico 27. Hindi nito ipinapasok ang ibang doktrinal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may bahagyang legal na himig. Pinanatili ang “pilak” at “isang ikalima” upang maipakita ang kongkreto at sinaunang anyo ng tuntunin, habang ginawang natural ang ayos ng pangungusap.
