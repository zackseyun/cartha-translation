revisions:
- from: Ngunit ang bawat bagay na itinalaga ng isang lalaki sa PANGINOON mula sa lahat ng pag-aari niya—tao man o hayop, o bahagi ng bukid na minana niya—ay hindi maaaring ipagbili o tubusin. Ang bawat bagay na itinalaga[a] ay kabanal-banalan sa PANGINOON.
  to: Ngunit ang bawat bagay na itinalaga[a] ng isang lalaki sa PANGINOON mula sa lahat ng pag-aari niya—tao man, hayop, o bukid na minana niya—ay hindi ipagbibili ni tutubusin. Ang bawat bagay na itinalaga ay kabanal-banalan sa PANGINOON.
  rationale: Inalis ang di-sinusuportahang salitang “bahagi,” pinanatili ang saklaw ng mga kategoryang tao, hayop, at minanang bukid, at inilipat ang talababa sa unang paglitaw ng teknikal na terminong חרם. Hindi binago ang kahulugan o ang maingat na pag-iwas na ipasok sa pangunahing teksto ang diwang “paglipol.”
