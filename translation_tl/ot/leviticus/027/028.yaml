id: LEV.27.28
reference: Leviticus 27:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַךְ כָּל חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽ/יהוָ֜ה מִ/כָּל אֲשֶׁר ל֗/וֹ מֵ/אָדָ֤ם וּ/בְהֵמָה֙ וּ/מִ/שְּׂדֵ֣ה אֲחֻזָּת֔/וֹ לֹ֥א יִמָּכֵ֖ר וְ/לֹ֣א יִגָּאֵ֑ל כָּל חֵ֕רֶם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: tl
  text: Ngunit ang bawat bagay na itinalaga[a] ng isang lalaki sa PANGINOON mula sa lahat ng pag-aari niya—tao man, hayop, o bukid na minana niya—ay hindi ipagbibili ni tutubusin. Ang bawat bagay na itinalaga ay kabanal-banalan sa PANGINOON.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salitang isinaling “bagay na itinalaga” (ḥerem) ay isang teknikal na katawagan sa isang bagay na di-mababawing ibinukod para sa PANGINOON; sa ilang konteksto, maaari rin itong tumukoy sa bagay na isinailalim sa pagbabawal o itinalaga sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang pagtatangi o pagsalungat sa naunang mga tuntunin tungkol sa mga bagay na maaaring tubusin.
- source_word: חֵרֶם / יַחֲרִם
  choice: bagay na itinalaga / itinalaga
  rationale: Pinananatili ang teknikal na diwa ng isang bagay na di-mababawing ibinukod para sa PANGINOON, nang hindi agad nililimitahan sa pagkawasak.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking isahang anyo ng Hebreo sa estilong legal, bagaman kinatawan ang gamit nito.
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginagamit ang karaniwang anyo ng banal na pangalan sa saling Tagalog.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: mula sa lahat ng pag-aari niya
  rationale: Likas at malinaw na ipinapahayag ang saklaw ng mga bagay na pag-aari ng lalaki.
- source_word: מֵאָדָם וּבְהֵמָה
  choice: tao man o hayop
  rationale: Malinaw na pinananatili ang paghahambing ng kategoryang pantao at panghayop.
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: o bahagi ng bukid na minana niya
  rationale: Ipinakikita ang pinagmulan sa minanang lupain; ang 'bahagi' ay likas na nagpapahayag na maaaring magtalaga mula sa bukid, hindi kinakailangang ang buong bukid.
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: hindi maaaring ipagbili o tubusin
  rationale: Pinananatili ang legal na pagbabawal at ang teknikal na bokabularyo ng pagtubos sa kabanata.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Likas na superlatibong Tagalog para sa pinakamataas na antas ng kabanalan.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa kontekstong legal
  choice: Isinalin bilang 'bagay na itinalaga,' na nagbibigay-diin sa di-mababawing pagbubukod nito para sa PANGINOON.
  alternative: bagay na itinalaga sa paglipol; bagay na isinailalim sa pagbabawal
  rationale: Binibigyang-diin mismo ng talata na hindi ito maipagbibili o matutubos at na ito ay kabanal-banalan. Inilalagay sa talababa ang posibleng diwa ng pagbabawal o paglipol upang mapanatili ang tunay na lawak ng termino.
- issue: Panlalaking wikang legal sa אִישׁ
  choice: isang lalaki
  alternative: isang tao; sinuman
  rationale: Pinananatili ang tahasang panlalaking isahang anyo ng pinagmulang teksto nang hindi itinatanggi ang kinatawang gamit nito sa tuntuning legal.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “PANGINOON” para sa YHWH, “tubusin” para sa legal na terminong גאל, at “kabanal-banalan” para sa superlatibong pariralang Hebreo. Inilagay ang marker na [a] kaagad sa teknikal na katawagang ipinaliliwanag nito.
