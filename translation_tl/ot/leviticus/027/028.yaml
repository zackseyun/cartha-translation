    issue: Ang “bahagi ng bukid na minana niya” ay nagdaragdag ng “bahagi.”
    rationale: Walang katumbas na “bahagi” sa מִשְּׂדֵה אֲחֻזָּתוֹ. Ang parirala ay “mula sa bukid ng kaniyang minanang ari-arian/pagkakahawak,” kaya hindi dapat ipahiwatig na isang bahagi lamang ng bukid ang tinutukoy.
  - severity: low
    issue: Nasa ikalawang paglitaw ng “bagay na itinalaga” ang talababa.
    rationale: Ang paliwanag sa חרם ay dapat nakaangkla sa unang paglitaw ng termino upang agad na gabayan ang mambabasa.
