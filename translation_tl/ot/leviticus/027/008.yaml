base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: tl
  text: Ngunit kung siya ay masyadong dukha para sa halagang itinakda mo,[a] ihaharap siya sa pari, at tatayahin siya ng pari. Tatayahin siya ng pari ayon sa makakaya ng taong nanata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mas dukha kaysa sa halagang itinakda mo.”
    reason: Pinananatili ng alternatibo ang mas literal na anyo ng Hebreong paghahambing, samantalang mas natural sa Filipino ang nasa pangunahing teksto.
  - marker: b
    text: Sa literal, “ayon sa maaabot ng kamay ng taong nanata,” isang idyomang Hebreo na tumutukoy sa kanyang kakayahang pinansiyal.
    reason: Ipinaliliwanag ang konkretong idyoma ng Hebreo na isinalin nang natural bilang “makakaya.”
lexical_decisions:
- source_word: מָךְ
  choice: masyadong dukha
  rationale: Ipinahihiwatig ng salita ang abang kalagayang pangkabuhayan; ipinapakita ng “masyadong” ang kaugnayan nito sa halagang hindi kayang tugunan.
- source_word: מֵעֶרְכֶּךָ
  choice: para sa halagang itinakda mo
  rationale: Ang עֵרֶךְ sa Levitico 27 ay teknikal na halagang itinakda para sa panata. Pinananatili ng “mo” ang ikalawang panauhang panlalaki na isahan sa Hebreo.
- source_word: וְהֶעֱמִידוֹ
  choice: ihaharap siya
  rationale: Likas itong salin sa Filipino para sa pagpap站 o pagdadala sa isang tao sa harap ng awtoridad, habang hindi tinutukoy kung sino ang gagawa nito sapagkat hindi rin iyon tahasang sinabi sa Hebreo.
- source_word: לִפְנֵי הַכֹּהֵן
  choice: sa pari
  rationale: Sa pariralang “ihaharap siya sa pari,” malinaw na ipinahihiwatig ang pagharap sa presensiya at awtoridad ng pari.
- source_word: וְהֶעֱרִיךְ אֹתוֹ / יַעֲרִיכֶנּוּ
  choice: tatayahin siya
  rationale: Ang pandiwang ערך ay tumutukoy rito sa pagtatakda ng halagang salapi. Ang “tatayahin” ay malinaw, makabago, at angkop sa legal na konteksto.
- source_word: עַל פִּי
  choice: ayon sa
  rationale: Ipinakikilala nito ang batayan ng pagtataya ng pari.
- source_word: אֲשֶׁר תַּשִּׂיג יַד
  choice: ayon sa makakaya
  rationale: Ang literal na pag-abot ng kamay ay idyomang Hebreo para sa kakayahang pinansiyal; natural itong ipinahahayag sa Filipino bilang “makakaya.”
- source_word: הַנֹּדֵר
  choice: ang taong nanata
  rationale: Tumutukoy ito sa taong gumawa ng panata; maikli at natural ang “taong nanata” sa kasalukuyang Filipino.
