translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino na angkop sa tekstong legal at panrelihiyon. Pinanatili ang pag-uulit ng pagtataya ng pari, ang di-tiyak na tagagawa ng paghaharap, at ang hulaping “mo” ng orihinal.
