base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: tl
  text: Kung ang edad ay mula isang buwang gulang hanggang limang taong gulang, ang halaga mong itinakda para sa lalaki ay limang siklong pilak, at para sa babae naman ay tatlong siklong pilak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן חֹדֶשׁ
  choice: mula isang buwan
  rationale: Karaniwang Hebreong pahayag ito tungkol sa edad. Likas sa modernong Filipino ang parirala at malinaw na ipinahihiwatig na isang buwang gulang ang pasimula ng saklaw.
- source_word: וְעַד בֶּן חָמֵשׁ שָׁנִים
  choice: hanggang limang taon
  rationale: Pinananatili nito ang hangganan ng pangkat ayon sa edad nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
- source_word: עֶרְכְּךָ
  choice: ang itinakda mong halaga
  rationale: Sa Levitico 27, tumutukoy ito sa halagang itinatakda ayon sa batas para sa panata. Pinananatili ng 'mong' ang ikalawang panauhang panlalaking isahan ng hulapi.
- source_word: הַזָּכָר
  choice: para sa lalaki
  rationale: Tumutukoy ang salita sa kasariang lalaki, hindi sa isang tiyak na katawagang pang-edad gaya ng 'batang lalaki.'
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: limang siklong pilak
  rationale: Tuwirang inilalahad ang bilang, yunit ng timbang/pananalapi, at materyal na pilak.
- source_word: וְלַנְּקֵבָה
  choice: at para sa babae naman
  rationale: Pinananatili ang magkatapat na legal na kategorya; ipinakikita ng 'naman' ang parallel na paghahambing nang hindi binabago ang diwa.
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: tatlong siklong pilak
  rationale: Tuwirang salin ng halagang binanggit at pareho ang anyo sa naunang halaga.
- source_word: וְהָיָה
  choice: ay
  rationale: Sa kontekstong pambatas, ang payak na panaguring 'ay' ay natural at mariing nagtatakda ng halagang dapat sundin sa Filipino.
