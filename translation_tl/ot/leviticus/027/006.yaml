translation_notes:
  register: Modernong Filipino na may marangal at malinaw na estilong pambatas. Ginamit ang 'siklo' bilang nakasanayang transliterasyon ng sinaunang yunit; iniwasan ang 'batang lalaki/batang babae' sapagkat kasarian, hindi katawagang pang-edad, ang tahasang ipinapakita ng Hebreo.
