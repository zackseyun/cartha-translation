  naturalness: Bahagyang hindi likas ang “Kung ang edad ay mula isang buwan hanggang limang taon.” Mas malinaw at natural sa modernong Filipino ang paglalagay ng “gulang” sa magkabilang hangganan ng saklaw.
  terminology: Ang “halaga mong itinakda” ay angkop para sa עֶרְכְּךָ sa legal na konteksto ng Levitico 27. Ang “lalaki/babae” ay wastong neutral na mga katawagang pangkasarian, at ang “siklong pilak” ay katanggap-tanggap na transliterasyon ng shekel of silver.
