  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: tl
  text: Walang sinumang lubusang itinalaga mula sa sangkatauhan ang maaaring tubusin[a]; tiyak siyang papatayin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Walang sinumang itinalaga upang lipulin mula sa sangkatauhan ang maaaring tubusin.” Ang salitang Hebreo ay tumutukoy sa isang tao o bagay na lubusan at di-mababawing itinalaga at, sa ilang konteksto, nakatalaga sa paglipol.'
    reason: alternative_reading
  - marker: b
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang salita para sa kamatayan upang idiin ang katiyakan: “tiyak siyang papatayin” o “walang pagsalang papatayin siya.”'
    reason: source_form
lexical_decisions:
- source_word: חֵרֶם
  choice: sinumang itinalagang lubos
  rationale: Ang חֵרֶם ay tumutukoy sa isang tao o bagay na di-mababawing itinalaga, at sa ilang konteksto ay nakatalaga sa paglipol. Ginamit ang “sinumang” dahil nililinaw ng מִן הָאָדָם na tao ang tinutukoy rito, habang pinananatili ng “itinalagang lubos” ang teknikal at panrelihiyong diwa nang hindi agad ipinapakahulugang “itinalagang lipulin.”
- source_word: יָחֳרַם
  choice: itinalagang lubos
  rationale: Pinananatili nito ang ugnayang leksikal sa חֵרֶם at ipinahihiwatig ang di-mababawing pagtatalaga. Ang “lubos” ay nagpapakita ng natatanging tindi ng terminong Hebreo nang hindi inuunahan ang huling sugnay tungkol sa kamatayan.
- source_word: מִן הָאָדָם
  choice: mula sa sangkatauhan
  rationale: 'Sa konteksto, ang אָדָם ay kategoryang pantao: ang itinalaga ay mula sa mga tao. Mas natural at mas malinaw sa modernong Tagalog ang “mula sa sangkatauhan” kaysa sa literal ngunit malabong “mula sa tao.”'
- source_word: יִפָּדֶה
  choice: maaaring tubusin
  rationale: Ang פדה ay nangangahulugang tubusin, ransom, o bilhing muli. Ang “tubusin” ang angkop na terminong biblikal sa kontekstong legal at panrelihiyon ng Levitico 27.
- source_word: מוֹת יוּמָת
  choice: tiyak siyang papatayin
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa katiyakan ng hatol. Likas sa Tagalog ang “tiyak siyang papatayin,” at ang “siya” ay umaayon sa tahasang pantao na tinutukoy ng unang sugnay.
theological_decisions:
- issue: Kahulugan ng חֵרֶם kapag tao ang tinutukoy
  choice: Pinanatili ang teknikal na diwa ng lubos at di-mababawing pagtatalaga sa pangunahing teksto.
  alternative: “Ang sinumang itinalagang lipulin mula sa sangkatauhan ay hindi maaaring tubusin; tiyak siyang papatayin.”
  rationale: Maaaring taglay ng חֵרֶם ang diwa ng pagtatalaga sa paglipol, ngunit hindi iyon tahasang inilalagay sa mismong pangngalan o pandiwa nang hiwalay sa huling sugnay. Pinananatili ng salin ang tensiyon sa pagitan ng panrelihiyong pagtatalaga at ng tiyak na kamatayan.
- issue: Kung bagay o tao ang gramatikal na paksa
  choice: “Ang sinumang … mula sa sangkatauhan”
  alternative: “Anumang bagay na lubos na itinalaga mula sa tao”
  rationale: Bagaman maaaring gamitin ang חֵרֶם bilang pangkalahatang katawagan sa isang bagay na itinalaga, nililinaw ng מִן הָאָדָם at ng panlalaking pang-isahang anyo sa huling sugnay na isang tao ang tinutukoy sa talatang ito. Hindi natural sa Tagalog na tawaging “bagay” ang taong papatayin.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Ginamit ang “sangkatauhan” upang ipahayag ang kategoryang pantao nang hindi nakatali sa kasariang panlalaki, at ang “tubusin” upang mapanatili ang bokabularyong legal at panrelihiyon ng kabanata.
