  source_fidelity: Tumpak na naipapahayag ang utos na ang bawat pagtataya ng kausap ay gagawin ayon sa pamantayang siklo ng santuwaryo, at ang katumbas na dalawampung gera bawat siklo. Napananatili ang distributibong כָּל, ang hulaping ikalawang panauhan sa עֶרְכְּךָ, at ang preskriptibong himig ng unang sugnay.
