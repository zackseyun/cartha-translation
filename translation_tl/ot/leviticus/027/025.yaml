base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: tl
  text: At ang bawat pagtataya mo ay ibabatay sa siklo ng santuwaryo[a]; ang isang siklo ay dalawampung gera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa banal na siklo.” Tumutukoy ang Hebreo sa pamantayang siklo na ginagamit sa mga pagtatayang may kaugnayan sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: bawat pagtataya mo
  rationale: Ang עֶרְכְּךָ sa Levitico 27 ay tumutukoy sa itinakdang halaga kaugnay ng mga panata at mga inialay. Pinananatili ng “pagtataya” ang teknikal na diwa at ng “mo” ang hulaping ikalawang panauhang panlalaki na isahan, nang hindi nagiging mabigat sa modernong Tagalog.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ibabatay sa siklo ng santuwaryo
  rationale: Ipinahihiwatig ng parirala ang opisyal na pamantayang timbang na ginagamit sa mga pagtatayang may kaugnayan sa santuwaryo. Mas natural sa Tagalog ang “ibabatay sa” kaysa sa literal na “sa pamamagitan ng,” habang ang “siklo ng santuwaryo” ay hindi nagpapahiwatig na ibang uri ng salapi ito sa halip na isang pamantayan.
- source_word: גֵּרָה
  choice: gera
  rationale: Ang gera ay maliit na yunit ng timbang o halaga na walang eksaktong likas na katumbas sa Tagalog, kaya angkop ang transliterasyon.
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: ang isang siklo ay dalawampung gera
  rationale: Malinaw at natural nitong ipinapahayag sa Tagalog ang depinisyon ng halaga o timbang ng siklo nang hindi dinaragdagan ang kahulugan.
- source_word: וְכָל
  choice: At ang bawat
  rationale: 'Pinananatili ang pang-ugnay na וְ at ang distributibong diwa ng כָּל: bawat pagtataya ay kailangang sumunod sa pamantayan.'
- source_word: יִהְיֶה
  choice: ay ibabatay / ay
  rationale: Sa legal na konteksto, preskriptibo ang imperfect. Ipinahahayag ng “ibabatay” ang kinakailangang pamantayan sa natural na modernong Tagalog; sa ikalawang sugnay, sapat ang “ay” para sa depinisyong pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang legal na himig. Ginamit ang “siklo” at “gera” bilang mga transliteradong sinaunang yunit, at pinanatili ang tuwirang pagtukoy sa mambabasa sa “mo.”
