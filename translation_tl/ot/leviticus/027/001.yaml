  text: 'Nagsalita si Yahweh kay Moises[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive ng דבר ay bahagi ng karaniwang pormula ng pagsasalaysay. Ang “nagsalita” ay natural at naiiwasang ulitin ang kahulugan ng kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na katumbas sa Tagalog kapag pangalan ng tao ang kasunod.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na Hebreong panandang nagpapakilala sa nilalaman ng pagsasalita sa susunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, habang kinikilala sa talababa ang tradisyonal na pamalit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pormulang “na sinasabi” upang masalamin ang לֵאמֹר, bagaman mas karaniwang idiomatikong Tagalog ang “sinabi niya.”
