  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: tl
  text: Ngunit kung babae siya[a], ang iyong pagtataya ay tatlumpung siklo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At kung babae siya.”
    reason: Ipinapakita ang alternatibong salin ng pang-ugnay na וְאִם bilang di-adbersatibong “At kung,” habang pinananatili ang pambabaeng panghalip ng Hebreo.
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng pang-ugnay at kondisyunal na kataga ang paghahambing o pagsalungat sa kasong binanggit sa naunang talata; natural itong naipapahayag sa Tagalog bilang “Ngunit kung.”
- source_word: נְקֵבָה הִוא
  choice: babae siya
  rationale: Ang נְקֵבָה ay tumutukoy sa kasariang babae, at ang הִוא ay pambabaeng panghalip. Sa konteksto ng pagtataya sa isang tao, ang “babae siya” ay tuwiran, natural, at hindi nililimitahan ang kahulugan sa isang may-gulang na babae lamang.
- source_word: וְהָיָה
  choice: ay magiging
  rationale: Ipinakikilala nito ang magiging resulta ng kondisyon sa pormulang legal; malinaw na naihahatid ng “ay magiging” ang itinakdang halaga.
- source_word: עֶרְכְּךָ
  choice: ang pagtataya mo
  rationale: Ang עֶרֶךְ sa Levitico 27 ay ang itinakdang halagang kaugnay ng isang panata. Pinananatili ng “pagtataya” ang pormal at legal na diwa, pati ang ikalawang panauhang isahan na hulapi.
- source_word: שְׁלֹשִׁים
  choice: tatlumpu
  rationale: Tuwirang salin ng bilang.
- source_word: שָׁקֶל
  choice: siklo
  rationale: Ang “siklo” ang nakaugaliang saling Filipino para sa yunit na שֶׁקֶל. Ginagamit sa isahan ang pangalan ng yunit pagkatapos ng bilang sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino, na may malinaw na himig-legal. Ginamit ang “pagtataya” para sa teknikal na halaga ng panata at “siklo” para sa sinaunang yunit ng timbang o salapi.
