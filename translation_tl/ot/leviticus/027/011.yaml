  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: tl
  text: Ngunit kung anumang maruming hayop na hindi maaaring pagkunan ng handog para kay Yahweh[a], ihaharap niya ang hayop sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na Hebreo: “na mula rito ay hindi sila maghahandog ng handog para kay Yahweh.” Ang pandiwang nasa maramihan ay ginagamit sa pangkalahatan o impersonal na diwa: “na hindi maaaring maghandog ang sinuman.”'
    reason: Pinananatili ang impersonal na maramihang pandiwa sa Hebreo; ang “pagkunan ng handog” sa pangunahing teksto ay isinasalin ang “mula rito.”
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Nagpapakilala ito ng kasunod na kondisyong naiiba sa naunang kaso; pinananatili ng “Ngunit kung” ang kapuwa pagsalungat at kondisyong ipinahihiwatig ng Hebreo.
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: anumang maruming hayop
  rationale: Ang כָּל na kasama ng pang-isahang pangngalan ay may di-tiyak na diwang “anuman.” Sa kontekstong ito, ang טְמֵאָה ay ritwal na “marumi,” hindi basta marungis.
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: na hindi maaaring ihandog
  rationale: Likas at malinaw ito sa modernong Tagalog para sa hayop na hindi karapat-dapat gamitin bilang handog. Ang pangkalahatan o impersonal na maramihang pandiwa sa Hebreo at ang mas literal na “mula rito” ay itinala sa talababa upang hindi mawala ang anyo at posibleng diin ng orihinal.
- source_word: קָרְבָּן
  choice: ihandog
  rationale: Isinama sa pandiwang “ihandog” ang diwa ng pangngalang tumutukoy sa handog na inilalapit sa Diyos, upang maiwasan ang mabigat at di-likas na “maghandog ng handog” sa pangunahing teksto.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: וְהֶעֱמִיד
  choice: ihaharap niya
  rationale: Ang Hiphil ng עמד ay “patayuin” o “ilagay sa harap.” Sa kontekstong pormal ng pagsusuri ng pari, natural na ipinahahayag ito ng “ihaharap.”
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: ang hayop sa pari
  rationale: Kasama ng pandiwang “ihaharap,” malinaw nitong ipinahahayag na dadalhin at ilalagay ang hayop sa harap ng pari.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ng Hebreo ang Tetragrammaton mismo; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng ritwal na karumihan
  choice: maruming hayop
  alternative: di-dalisay na hayop
  rationale: Ang “marumi” ang karaniwang terminong Tagalog para sa kategoryang ritwal sa Levitico at hindi dapat unawain dito bilang pisikal na dumi lamang.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado at madaling maunawaan. Ginamit ang bokabularyong ritwal na “marumi,” ang natural na legal na ayos na “Ngunit kung,” at ang pormal ngunit pangkaraniwang “ihaharap niya.”
