  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: tl
  text: At kung ang tao ay animnapung taong gulang o higit pa[a], kung lalaki siya, ang halagang itatakda mo ay labinlimang siklo; at kung babae, sampung siklo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa animnapung taong gulang pataas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: animnapung taong gulang o higit pa
  rationale: Likas na salin sa modernong Tagalog ng idyomang Hebreo na nagtatakda ng saklaw ng edad mula animnapu pataas.
- source_word: זָכָר
  choice: lalaki
  rationale: Tumutukoy ito sa kasariang lalaki sa konteksto ng itinakdang halaga, hindi sa isang natatanging katayuang panlipunan.
- source_word: עֶרְכְּךָ
  choice: ang halagang itataya mo
  rationale: Pinananatili ang ikalawang panauhang isahan ng Hebreo at malinaw na ipinahahayag ang teknikal na pagtataya ng halaga sa batas tungkol sa panata.
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: labinlimang siklo
  rationale: Tuwirang salin ng bilang at ng sinaunang yunit ng timbang o halaga.
- source_word: לַנְּקֵבָה
  choice: kung babae
  rationale: Natural na Tagalog para sa katumbas na kaso ng kasariang babae at kaayon ng pagkakasalin sa זָכָר.
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: sampung siklo
  rationale: Tuwirang salin ng bilang at yunit.
