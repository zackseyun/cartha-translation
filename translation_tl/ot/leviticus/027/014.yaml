  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: tl
  text: Kung italaga ng isang lalaki ang kanyang bahay bilang isang bagay na banal para kay Yahweh[a], tatayahin ito ng pari, mabuti man o masama[b]. Ayon sa pagtataya rito ng pari, gayon ito mananatili[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (יהוה), ang personal na pangalan ng Diyos; karaniwan din itong isinasaling “PANGINOON.”'
    reason: textual_theological_note
  - marker: b
    text: Ang “mabuti man o masama” ay tumutukoy sa kalagayan o kalidad ng bahay sa pagtataya ng pari.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin ang pandiwang Hebreo bilang “pahalagahan” o “tasahin.” Inuulit ito upang idiin na ang pagtataya ng pari ang mananatiling may bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Kung italaga ng isang lalaki
  rationale: Ipinakikilala ng parirala ang isang kondisyong legal. Pinananatili ng “isang lalaki” ang panlalaking isahan ng אִישׁ, samantalang natural na ipinahahayag ng “kung” ang gamit ng כִּי rito.
- source_word: יַקְדִּשׁ ... בֵּיתוֹ קֹדֶשׁ
  choice: italaga ... ang kanyang bahay bilang banal
  rationale: Ang Hifil ng קדשׁ ay tumutukoy sa pagbubukod ng bahay para sa banal na layunin; malinaw at likas sa modernong Filipino ang “italaga ... bilang banal.”
- source_word: וְהֶעֱרִיכוֹ ... יַעֲרִיךְ
  choice: tatayahin ... itataya
  rationale: Sa Levitico 27, ang ערך ay opisyal na pagtatakda ng halaga ng pari. Ang “tayahin” ay malinaw sa konteksto ng ari-arian at pinananatili ang pag-uulit ng pandiwa.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: mabuti man o masama
  rationale: Pinananatili nito ang literal na magkasalungat na mga termino habang ang talababa ay nagpapaliwanag na kalidad o kalagayan ng bahay ang tinutukoy, hindi moralidad.
- source_word: כֵּן יָקוּם
  choice: iyon ang mananatiling halaga nito
  rationale: Ang קום dito ay nangangahulugang mananatiling may bisa ang itinakdang halaga. Ginawang tahas ang “halaga” upang maging natural at malinaw sa Filipino nang hindi binabago ang legal na diwa.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal at panrelihiyon. Ginamit ang “pari,” “italaga,” at “tayahin” bilang mga salitang madaling maunawaan ngunit sapat na pormal; iniwasan ang sobrang teknikal o makalumang pananalita.
