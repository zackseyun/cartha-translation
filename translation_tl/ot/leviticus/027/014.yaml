    rationale: Ang כַּאֲשֶׁר יַעֲרִיךְ אֹתוֹ הַכֹּהֵן כֵּן יָקוּם ay “ayon sa pagtataya rito ng pari, gayon ito mananatili.” Ang “Kung ano ang halagang itataya rito” ay nagdaragdag ng isang malayang konstruksyon at hindi gaanong malinaw na inuulit ang pagtataya ng pari bilang may bisa.
  - severity: low
    issue: Ang “bilang banal para kay Yahweh” ay maaaring gawing bahagyang mas tahas.
    rationale: Ang קֹדֶשׁ ay tumutukoy sa bahay bilang isang bagay na itinakdang banal. Ang “bilang isang bagay na banal” ay higit na malinaw nang hindi nagdadagdag ng kahulugan.
