  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: ang isang lalaki ay naglalaan ng bahay kay Yahweh, tinatasa ito ng pari ayon sa kalagayan nito, at ang pagtatasa ng pari ang may bisa. Gayunman, ang huling pangungusap na “Kung ano ang halagang itataya rito” ay mas malayang pagpapahayag kaysa sa Hebreo, na nagsasabing “ayon sa pagtataya ng pari ... gayon ito mananatili.”'
  naturalness: Nauunawaan ang draft, ngunit mas natural at mas malinaw sa modernong Filipino ang “Kung italaga ng isang lalaki ang kanyang bahay bilang isang bagay na banal para kay Yahweh” at ang paggamit ng “pagtataya ng pari” sa huling sugnay. Iniiwasan nito ang medyo hindi likas na “Kung ano ang halagang itataya rito.”
  terminology: Ang “italaga,” “banal,” “Yahweh,” at “pari” ay angkop. Pinananatili ang “tayahin/pagtataya” upang maipakita ang pag-uulit ng Hebreong pandiwang ערך at ang opisyal na pagpapahalaga sa Levitico 27.
