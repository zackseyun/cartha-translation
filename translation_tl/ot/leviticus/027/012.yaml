translation:
  language: tl
  text: At tatayahin ito ng pari, mabuti man o masama; ayon sa pagtataya ng pari, iyon ang magiging halaga nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, mas literal na, “Ayon sa iyong pagtataya, pari, gayon ito.” Ang panghalip na “iyong” ay tumutukoy sa pari; ang diwa ay na ang pagtataya ng pari ang siyang magiging umiiral na halaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱרִיךְ
  choice: susuriin
  rationale: Ang Hiphil ng ערך sa kontekstong ito ay tumutukoy sa pagsusuri upang magtakda ng halaga sa isang hayop na inialay sa pamamagitan ng panata. Likas at malinaw sa modernong Filipino ang “susuriin,” habang ipinahihiwatig ng kasunod na sugnay ang pagtatakda ng halaga.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin ng כֹּהֵן sa legal at panritwal na konteksto ng Levitico, at pinananatili ang tiyak na pantukoy.
- source_word: אֹתָהּ
  choice: iyon
  rationale: Ang panghalip na pambabaeng isahan ay tumutukoy sa hayop. Ang “iyon” ay natural sa Filipino at hindi nagpapahiwatig ng kasarian na hindi kailangang idiin sa konteksto.
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: mabuti man o masama
  rationale: Natural na Filipino para sa saklaw ng pagtatasa sa kalidad, at pinananatili ang merismong mabuti–masama.
- source_word: כְּעֶרְכְּךָ הַכֹּהֵן
  choice: kung ano ang halagang itinakda ng pari
  rationale: Ang anyo ay literal na may panlaping ikalawang panauhang panlalaki (“ayon sa iyong pagtataya”), ngunit nililinaw ng kasunod na “ang pari” na ang opisyal na pagtataya ng pari ang tinutukoy. Inihahayag ng salin ang diwa nang hindi inililipat ang awtoridad sa ibang tao.
- source_word: כֵּן יִהְיֶה
  choice: iyon ang mananaig
  rationale: Ipinapahayag ng pormulang ito na ang itinakdang halaga ng pari ang may bisa at masusunod. Ang “mananaig” ay natural at malinaw sa legal na konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “susuriin” para sa kilos ng pagtataya at “halagang itinakda” para linawin ang pinansiyal na resulta nito. Ang legal na bisa ng pasiya ng pari ay ipinahayag sa “iyon ang mananaig.”
