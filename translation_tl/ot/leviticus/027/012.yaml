  naturalness: Natural at marangal ang modernong Filipino na “Tatayahin ito ng pari, mabuti man o masama.” Ang “iyon ang magiging halaga nito” ay malinaw na legal at hindi idinadagdag ang ideya ng pangingibabaw.
  terminology: Pinanatili ang “pari.” Ginamit ang “tayahin/pagtataya” upang magkakaugnay na maisalin ang pandiwang ערך at pangngalang עֵרֶך sa konteksto ng halagang itinatalaga sa hayop na inialay sa panata.
