base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: tl
  text: At kung ito ay isang hayop na mula rito ay naghahandog ang isa ng handog kay Yahweh[a], lahat ng ibibigay mula rito kay Yahweh ay magiging banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “isang hayop na maaaring ihandog kay Yahweh.” Maaaring tumukoy ang pananalita sa Hebreo sa isang hayop na angkop ihandog o sa isang hayop na mula rito ay aktuwal na inihahandog ang isang handog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na ו at ang kondisyong ipinahihiwatig ng אִם sa pagpapatuloy ng mga tuntunin.
- source_word: בְּהֵמָה
  choice: hayop
  rationale: Malawak at likas na katumbas sa makabagong Filipino; hindi nito nililimitahan ang salita sa isang partikular na uri ng alagang hayop.
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: na mula rito ay naghahandog sila ng handog
  rationale: Inilalahad ang pandiwang יַקְרִיבוּ sa diwang paghahandog at pinananatili ang מִמֶּנָּה bilang “mula rito.” Ang bahagyang di-karaniwang ayos ay tumutulong mapanatili ang tunay na kalabuan ng Hebreo.
- source_word: קָרְבָּן
  choice: handog
  rationale: Karaniwan, malinaw, at angkop na terminong Filipino para sa isang inihahandog sa kontekstong ritwal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang Yahweh.
- source_word: כֹּל אֲשֶׁר יִתֵּן
  choice: bawat ibibigay
  rationale: Likas na generic na pahayag sa Filipino na hindi nagdaragdag ng tiyak na kasarian sa di-tiyak na gumagawa.
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Tumutukoy pabalik sa isahang “hayop” at pinananatili ang ideya ng pagkuha o pagbibigay mula rito.
- source_word: יִהְיֶה קֹדֶשׁ
  choice: ay magiging banal
  rationale: Pinananatili ang hinaharap o modal na puwersa ng יִהְיֶה at ang teolohikal at ritwal na diwa ng קֹדֶשׁ.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kalabuan ng pariralang אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה
  choice: Isinalin sa pangunahing teksto bilang aktuwal na paghahandog mula sa hayop, na may talababa para sa alternatibong pag-unawa
  alternative: Isang hayop na ang uri ay angkop ihandog kay Yahweh
  rationale: Maaaring ilarawan ng Hebreo ang hayop bilang pinagmumulan ng aktuwal na handog o bilang kabilang sa uring maaaring ihandog. Hindi tahasang nilulutas ng salin ang tensiyong ito.
translation_notes:
  register: Makabago at marangal na Filipino, na may bokabularyong madaling maunawaan. Ginamit ang “handog” at “banal” upang mapanatili ang ritwal at teolohikal na himig. Inilagay ang panandang [a] sa pangunahing teksto gaya ng hinihingi.
