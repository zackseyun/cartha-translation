  text: וְ/הָיָ֨ה הַ/שָּׂדֶ֜ה בְּ/צֵאת֣/וֹ בַ/יֹּבֵ֗ל קֹ֛דֶשׁ לַֽ/יהוָ֖ה כִּ/שְׂדֵ֣ה הַ/חֵ֑רֶם לַ/כֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: tl
  text: Ngunit kapag napalaya ang bukid sa Jubileo, magiging banal ito kay Yahweh, gaya ng bukid na itinalaga nang di-na-mababawi[a]; magiging pag-aari ito ng pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bukid na nasa ilalim ng pagbabawal.” Ang salitang Hebreo ay tumutukoy sa isang bagay na di-na-mababawi ang pagkakatalaga kay Yahweh at inalis na sa karaniwang paggamit ng tao; sa ibang konteksto, maaari rin itong may kaugnayan sa paglipol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ngunit ... magiging
  rationale: Ipinagpapatuloy nito ang kasong legal at ipinakikita ang bunga na taliwas sa posibilidad ng pagtubos sa naunang talata.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Tumutukoy ito sa tiyak na bukid na tinatalakay sa naunang konteksto.
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: kapag napalaya ang bukid sa Jubileo
  rationale: Ang literal na 'sa paglabas nito' ay idyomang legal para sa pagkalaya o paglipat ng lupa sa Jubileo; natural sa Filipino ang 'napalaya' habang pinananatili ang legal na diwa.
- source_word: קֹדֶשׁ לַיהוָה
  choice: banal ito para kay Yahweh
  rationale: Pinananatili ang pormulang nagsasaad na ang bukid ay ibinukod at inilaan kay YHWH.
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: gaya ng bukid na itinalaga nang lubusan[a]
  rationale: Ipinahahayag ng חֵרֶם ang di-mababawing pagtatalaga at pag-aalis sa karaniwang gamit. Iniiwasan ng pangunahing teksto ang sapilitang pagpapakahulugang talagang wawasakin ang bukid, samantalang nililinaw ng talababa ang tindi ng termino.
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: magiging pag-aari ito ng pari
  rationale: Natural na ipinahahayag sa Filipino ang pag-aatas ng lupa sa pari bilang kanyang pag-aaring lupain.
theological_decisions:
- issue: Kahulugan ng חֵרֶם sa batas tungkol sa banal na lupa
  choice: bukid na itinalaga nang lubusan
  alternative: bukid na nakatalaga sa paglipol; bukid na nasa ilalim ng pagbabawal
  rationale: Sa kontekstong ito, tiyak ang di-mababawing pagtatalaga ng bukid kay Yahweh at ang pag-aalis nito sa ordinaryong pagmamay-ari, ngunit hindi tahasang sinasabi na ang bukid mismo ay wawasakin. Kaya pinananatili ang bigat at pagiging permanente ng termino nang hindi nilulutas nang labis ang saklaw nito.
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “Jubileo” bilang pamilyar na terminong biblikal at “Yahweh” upang katawanin ang pangalang יהוה. Ang ayos ng pangungusap ay natural sa Filipino ngunit pinananatili ang legal at sagradong tono.
