  yaml_path: translation/ot/leviticus/027/017.yaml
  text: If he consecrates his field from the year of jubilee[a], your valuation shall stand.
translation:
  language: tl
  text: Kung itatalaga niya ang kanyang bukid[a] mula sa taon ng Jubileo, mananatiling may bisa ang iyong pagtataya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaari ring isaling “ihandog” o “italaga.” Ipinahihiwatig nito ang pagbubukod ng isang bagay bilang banal o para sa PANGINOON.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang pang-ugnay na nagpapakilala sa kondisyon ng kasong legal.
- source_word: מִשְּׁנַת הַיֹּבֵל
  choice: mula sa taon ng Jubileo
  rationale: Ipinahihiwatig ng מִן ang panimulang panahon; ang halaga ay kaugnay ng panahong natitira hanggang sa susunod na Jubileo.
- source_word: יַקְדִּישׁ
  choice: itatalaga
  rationale: Sa kontekstong panritwal, ang Hiphil ng קדשׁ ay tumutukoy sa pagbubukod ng isang bagay bilang banal o ukol sa PANGINOON. Natural sa Filipino ang 'itatalaga,' habang nililinaw ng talababa ang sagradong diwa.
- source_word: שָׂדֵהוּ
  choice: ang kanyang bukid
  rationale: Tuwirang paglilipat ng pangngalang may hulaping paari.
- source_word: כְּעֶרְכְּךָ
  choice: ang itinakda mong halaga
  rationale: Tumutukoy sa halagang tinataya o itinatakda ng kinakausap sa kontekstong legal; mas natural ito sa Filipino kaysa sa literal na 'ayon sa iyong pagtataya.'
- source_word: יָקוּם
  choice: mananatili
  rationale: Sa kontekstong legal at administratibo, ipinahihiwatig ng קום na ang itinakdang halaga ay may bisa at hindi babaguhin.
theological_decisions:
- issue: Pandiwa para sa sagradong pagtatalaga ng ari-arian
  choice: itatalaga
  alternative: gagawing banal; ihahandog
  rationale: Ang 'itatalaga' ay natural at marangal sa modernong Filipino, at hindi nito ipinahihiwatig na nagbabago ang likas na katangian ng bukid. Pinananatili sa talababa ang diwang pagbubukod bilang banal o ukol sa PANGINOON.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na tonong legal. Ginamit ang 'Jubileo' bilang pangalan ng institusyong panrelihiyon, at iniwasan ang sobrang teknikal o makalumang pananalita.
