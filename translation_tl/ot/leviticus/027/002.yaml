  naturalness: Mas natural at mas tapat ang hiwalay na “Magsalita ka ... at sabihin mo,” na pinananatili ang dalawang pandiwang utos sa Hebreo. Ang “pagtataya ng halaga sa mga tao” ay mas malinaw sa modernong Filipino kaysa sa “mga taong itatalaga ... ayon sa itinakdang halaga mo.”
