  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: tl
  text: '“Magsalita ka sa mga anak ni Israel[b] at sabihin mo sa kanila: ‘Kapag ang isang lalaki ay gumawa ng natatanging panata ayon sa iyong pagtataya ng halaga sa mga tao para kay Yahweh,[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mahirap ang sintaks ng pariralang Hebreo. Maaari ring isalin: “gumawa ng natatanging panata na may kinalaman sa pagtataya ng halaga sa mga tao para kay Yahweh.” Ang “iyong” ay isahang anyo sa Hebreo. Tinutukoy ng parirala ang panata hinggil sa mga taong binibigyan ng takdang halaga sa mga sumusunod na talata.'
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang tipanang katawagan para sa buong bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ
  choice: Sabihin mo ...
  rationale: Pinagsama sa likas na Tagalog ang magkatuwang na utos na ‘magsalita’ at ‘sabihin,’ habang pinananatili ang pormal na tagubilin kay Moises.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at tipanang katawagan sa bayang Israel; ipinaliliwanag sa talababa ang kolektibong kahulugan.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking isahan ng legal na pormulasyon sa Hebreo, bagaman maaari itong magkaroon ng kinatawang saklaw.
- source_word: יַפְלִא נֶדֶר
  choice: gumawa ng natatanging panata
  rationale: Ipinahahayag ng Hiphil ng פלא ang panatang bukod o natatangi, hindi lamang ang simpleng paggawa ng panata.
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: tungkol sa mga taong itatalaga ... ayon sa itinakdang halaga mo
  rationale: Pinananatili ang mahirap na ikalawang-panauhang anyong ‘halaga mo’ at nililinaw mula sa konteksto na mga tao ang tinataya para sa isang panata; hindi ‘mga kaluluwa’ ang ibig sabihin ng נְפָשֹׁת dito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pangalang tipan na nasa tekstong Hebreo at ang likas na pang-ukol sa Tagalog para sa pagtatalaga sa kaniya.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinananatili ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Panlalaking legal na isahan אִישׁ
  choice: isang lalaki
  alternative: sinuman / isang tao
  rationale: Pinananatili ang anyong panlalaki ng pinagmulan nang hindi ipinagpapalagay na nilulutas nito ang buong saklaw ng legal na tuntunin.
- issue: Ugnayan ng panata, mga tao, at pagtatakda ng halaga
  choice: panata tungkol sa mga taong itatalaga kay Yahweh ayon sa itinakdang halaga
  alternative: panata ayon sa iyong pagtataya ng mga tao para kay Yahweh
  rationale: Ginagawang mauunawaan sa Tagalog ang kontekstong legal, ngunit inilalagay sa talababa ang sintaktikong hirap at alternatibong mas literal na pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino; pinananatili ang legal at tipanang himig. Ang ‘mga anak ni Israel’ at ‘isang lalaki’ ay sadyang malapit sa anyo ng Hebreo, samantalang ang mahirap na parirala tungkol sa halaga ay ginawang malinaw hangga’t maaari nang hindi itinatago ang tunay na kalabuan.
