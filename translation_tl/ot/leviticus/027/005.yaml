  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: tl
  text: At kung ang edad ay mula limang taon hanggang dalawampung taon, ang iyong pagtataya ay dalawampung siklo para sa lalaki at sampung siklo para sa babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at kondisyunal na kataga, at likas itong nagdurugtong sa naunang mga kaso ng pagtataya.
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: ang edad ay mula limang taon hanggang dalawampung taon
  rationale: Malinaw at natural na ipinahahayag sa modernong Filipino ang saklaw ng edad na tinutukoy ng idyomang Hebreo.
- source_word: וְהָיָה
  choice: ay
  rationale: Sa kontekstong legal, ipinapahayag nito ang itinakdang halaga; sapat ang pangkasalukuyang anyong Filipino upang ihatid ang preskriptibong bisa nang hindi pilit ang pananalita.
- source_word: עֶרְכְּךָ
  choice: ang halaga ng iyong pagtataya
  rationale: Pinananatili ang tuwirang pagtukoy sa kinakausap at nililinaw na ang עֵרֶךְ ay halagang itinatakda sa konteksto ng panata.
- source_word: הַזָּכָר
  choice: para sa lalaki
  rationale: Inihahatid ang isahang kategoryang batay sa kasarian sa talaan ng pagtataya, hindi isang malawak na pahayag tungkol sa pangkat panlipunan.
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: dalawampung siklo
  rationale: Tuwirang isinasalin ang bilang at pinananatili ang sinaunang yunit sa anyong tradisyonal at madaling makilala sa Filipino.
- source_word: וְלַנְּקֵבָה
  choice: para sa babae
  rationale: Pinananatili ang katugmang kategorya at ang paralelismo sa 'para sa lalaki.'
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: sampung siklo
  rationale: Tuwirang isinasalin ang bilang at yunit, na pinananatili ang kaibahan sa naunang halaga.
theological_decisions:
- issue: Paglalarawan sa mga kategoryang batay sa kasarian sa tekstong legal at pangkulto
  choice: para sa lalaki ... para sa babae
  alternative: para sa isang lalaki ... para sa isang babae
  rationale: Ang Hebreo ay gumagamit ng tiyak at isahang mga kategorya sa talaan ng pagtataya. Pinananatili ng salin ang legal na pag-uuri nang hindi ito pinalalawak bilang pangkalahatang pahayag tungkol sa mga lalaki at babae.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang 'pagtataya' bilang teknikal ngunit madaling maunawaang katawagan, at 'siklo' para sa sinaunang yunit na shekel.
