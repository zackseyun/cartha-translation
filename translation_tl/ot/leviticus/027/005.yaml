  naturalness: Nauunawaan ang draft, ngunit mas likas at malinaw sa modernong Filipino ang ayos na "kung ang edad ay mula ..." at ang predikasyong "ang iyong pagtataya ay ..." kaysa "ang halaga ng iyong pagtataya ay ...".
