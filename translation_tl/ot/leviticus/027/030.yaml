  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: tl
  text: Ang bawat ikapu mula sa lupain—mula sa binhi ng lupain at mula sa bunga ng puno—ay kay Yahweh; banal ito kay Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: Ang bawat ikapu mula sa lupain
  rationale: Ang כָל na sinusundan ng pangngalang isahan ay distributibo, kaya natural ang “bawat.” Ang “ikapu” ang karaniwang terminong Filipino para sa ikasampung bahaging inilalaan. Sa kontekstong agrikultural, ang הָאָרֶץ ay tumutukoy sa lupain at sa ani mula rito.
- source_word: מִזֶּרַע הָאָרֶץ
  choice: mula sa binhi ng lupain
  rationale: Pinananatili ng “binhi” ang kongkretong larawan ng Hebreo, bagaman saklaw nito sa konteksto ang mga pananim na nagmumula sa paghahasik.
- source_word: מִפְּרִי הָעֵץ
  choice: sa bunga ng puno
  rationale: Ang isahang “puno” ay maaaring gamitin nang kolektibo, gaya ng Hebreo, at malinaw pa rin sa modernong Filipino.
- source_word: לַיהוָה הוּא
  choice: ay kay Yahweh
  rationale: Ang לְ ay nagpapahayag dito ng pag-aari o pagkakatalaga. Maikli at natural na ipinahahayag ng “ay kay Yahweh” na ang ikapu ay nauukol sa kanya.
- source_word: קֹדֶשׁ לַיהוָה
  choice: banal ito para kay Yahweh
  rationale: Ang קֹדֶשׁ ay nagsasaad na ang ikapu ay ibinukod bilang banal. Ang “para kay Yahweh” ay natural na Filipino at pinananatili ang diwa ng pagkakatalaga.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng לַיהוָה sa unang pahayag
  choice: ay kay Yahweh
  alternative: ay para kay Yahweh
  rationale: Maaaring magpahiwatig ang parirala ng pag-aari at pagkakatalaga. Pinili ang “kay Yahweh” upang likas na maipahayag ang pag-aari, habang ang kasunod na “banal ... para kay Yahweh” ay nagpapakita ng pagkakatalaga.
translation_notes:
  register: Modernong Filipino na dignipikado at madaling maunawaan. Ginamit ang nakaugaliang terminong “ikapu,” pinanatili ang agrikultural na larawang “binhi” at “bunga,” at iniwasan ang denominasyonal na pagpapaliwanag.
