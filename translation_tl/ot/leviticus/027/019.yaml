base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: tl
  text: Ngunit kung talagang tutubusin ng nagtalaga nito ang bukid[a], idaragdag niya rito ang ikalimang bahagi ng halagang tinasa mo[b], at mananatili itong sa kaniya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng nagkonsagra nito” o “ng nagbukod nito bilang banal.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang ikalimang bahagi ng pilak ng iyong pagtataya.”
    reason: lexical_alternative
  - marker: c
    text: O “at matitiyak na sa kaniya iyon”; sa literal, “at tatayo iyon para sa kaniya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinagpapatuloy nito ang naunang batas habang nagpapakilala ng naiibang kondisyon; natural sa Filipino ang “Ngunit kung.”
- source_word: גָּאֹל יִגְאַל
  choice: talagang tutubusin
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa kilos; pinananatili ng “talagang” ang diin nang hindi nagiging matigas ang Tagalog.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Tumutukoy ito sa partikular na bukid na tinalakay sa naunang mga talata.
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: ng nagtalaga nito
  rationale: Tinutukoy ng participle ang taong nagbukod sa bukid para sa sagradong layunin. Ang “nagtalaga” ay malinaw at likas sa modernong Filipino, habang inilalahad sa talababa ang mas tahasang kultikong alternatibo.
- source_word: וְיָסַף
  choice: idaragdag niya
  rationale: Sa kontekstong legal, ipinapahayag nito ang itinakdang kilos na kasunod ng kondisyon.
- source_word: חֲמִשִׁית כֶּסֶף עֶרְכְּךָ
  choice: ang ikalimang bahagi ng halagang itinaya mo
  rationale: Inihahayag nito sa natural na Filipino ang literal na “ikalimang bahagi ng pilak ng iyong pagtataya,” at pinananatili ang ikalawang panauhan.
- source_word: עָלָיו
  choice: rito
  rationale: Ang ikalimang bahagi ay idinaragdag sa itinayang halaga; malinaw ito sa konteksto ng pangungusap.
- source_word: וְקָם לוֹ
  choice: mapapasa-kaniya ang bukid
  rationale: Ang legal na idyoma ay nagsasaad na matitiyak o mapagtitibay na sa kaniya ang ari-arian matapos ang pagbabayad.
theological_decisions:
- issue: Kultikong diwa ng הקדישׁ
  choice: nagtalaga
  alternative: nagkonsagra / nagbukod bilang banal
  rationale: Ang “nagtalaga” ay dignificado at madaling maunawaan, ngunit hindi dapat mawala ang sagradong konteksto kaya nililinaw iyon sa talababa.
- issue: Legal na puwersa ng pagkakasunod ng mga sugnay
  choice: 'itinakdang hinaharap: “idaragdag ... mapapasa-kaniya”'
  alternative: payak na salaysay sa nakaraan
  rationale: Bahagi ito ng legal na tagubilin, kaya ipinakikita ng mga pandiwang Filipino ang obligasyon at kasunod na legal na resulta, hindi isang nakaraang pangyayari.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “tutubusin” para sa legal na pagbawi ng bukid, “halagang itinaya mo” para mapanatili ang ikalawang panauhan ng tekstong Hebreo, at mga talababa upang ipakita ang kultikong diwa at literal na legal na idyoma.
