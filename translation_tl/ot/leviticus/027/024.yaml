  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: tl
  text: Sa taon ng Jubileo, ibabalik ang bukid sa taong pinagbilan nito[a]—sa taong may-ari ng lupang hawak na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa taong may-ari ng lupang hawak na iyon.” Ang Hebreong אֲחֻזַּת הָאָרֶץ ay tumutukoy sa lupang pag-aari o lupang hawak; sa kontekstong ito, kaugnay ito ng orihinal na bahaging inilaan sa pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: Sa taon ng Jubileo
  rationale: Likas na temporal na pahayag ito sa Filipino at tumutukoy sa itinakdang taon ng Jubileo sa batas ng Levitico.
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: ibabalik ang bukid
  rationale: Ang imperfect na יָשׁוּב ay nagsasaad dito ng legal na kahihinatnan. Ang pasibong ayos sa Filipino ay malinaw at natural, samantalang pinananatili ng “bukid” ang karaniwang kahulugan ng הַשָּׂדֶה.
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: sa taong pinagbilan nito
  rationale: Ipinahihiwatig ng parirala ang dating may-ari na pinagbilan ng bukid. Iniiwasan ng saling ito ang pagdaragdag ng malabong tahasang simuno para sa “bumili,” ngunit pinananatili ang ugnayang nakasaad sa Hebreo.
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: sa taong ang lupang iyon ay kanyang pag-aari
  rationale: Ipinapahayag nito ang legal na pagmamay-ari o paghawak sa lupa nang hindi sapilitang ginagawang tahasan sa pangunahing teksto ang pamanang katangian ng אֲחֻזָּה.
theological_decisions:
- issue: Ang katangian ng אֲחֻזַּת הָאָרֶץ sa batas ng Jubileo
  choice: ang lupang iyon ay kanyang pag-aari
  alternative: ang lupang iyon ay kanyang minanang pag-aari
  rationale: Bagaman ang mas malawak na konteksto ay tungkol sa orihinal na pamana ng pamilya, ang אֲחֻזָּה mismo ay tumutukoy sa pag-aari o lupang hawak. Pinananatili ng pangunahing teksto ang payak na legal na diwa, habang inilalagay sa talababa ang kontekstuwal na kahulugan ng minanang lupain.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jubileo” bilang pamilyar na terminong biblikal at pinanatili ang legal na himig ng talata nang hindi nagiging labis na teknikal.
