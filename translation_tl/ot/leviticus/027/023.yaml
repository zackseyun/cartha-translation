base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: tl
  text: Pagkatapos, kukuwentahin ng pari para sa kanya ang kaukulang bahagi ng iyong nakatalagang halaga hanggang sa Taon ng Jubileo. Sa araw na iyon, ibibigay niya ang iyong nakatalagang halaga bilang banal na handog kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “banal kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: Pagkatapos, kukuwentahin
  rationale: Ang Piel ng חשׁב ay tumutukoy dito sa pagkukuwenta o pagtutuos ng halaga. Likas sa Tagalog ang “Pagkatapos” bilang pagpapakita ng pagkakasunod-sunod ng mga tagubilin.
- source_word: לּוֹ
  choice: para sa kanya
  rationale: Ipinahihiwatig ng datibo na kukuwentahin ng pari ang halaga para sa taong tinutukoy sa konteksto.
- source_word: מִכְסַת
  choice: ang kaukulang bahagi
  rationale: Ang מִכְסָה ay isang takdang halaga o proporsiyon. Ipinapahayag ng “kaukulang bahagi” ang halagang kinuwenta ayon sa panahong natitira hanggang Jubileo.
- source_word: הָעֶרְכְּךָ
  choice: ng halagang itinakda mo
  rationale: Teknikal na salita ang עֵרֶךְ sa Levitico 27 para sa halagang itinakda sa pagtataya. Pinananatili ng “mo” ang ikalawang panauhang panlalaking hulapi ng Hebreo.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: hanggang sa Taon ng Jubileo
  rationale: Itinatakda ng parirala ang hangganan ng panahong pagbabatayan sa pagkukuwenta; ang malaking titik ay nagpapakitang institusyonal na katawagan ito.
- source_word: וְנָתַן
  choice: ibibigay niya
  rationale: Karaniwang kahulugan ng נתן ang “magbigay.” Hindi ginawang “babayaran” upang hindi labis na tukuyin ang uri ng transaksiyon.
- source_word: בַּיּוֹם הַהוּא
  choice: Sa araw na iyon
  rationale: Tuwiran at natural na salin ng karaniwang pariralang temporal.
- source_word: קֹדֶשׁ לַיהוָה
  choice: bilang banal na handog kay Yahweh
  rationale: Literal itong “banal kay Yahweh.” Nililinaw ng “handog” sa natural na Tagalog na ang ibinibigay na halaga ay itinalaga kay Yahweh, habang nasa talababa ang mas pormal na anyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Di-tahasang simuno ng וְנָתַן
  choice: 'Ang taong nagtalaga ng bukid ang nauunawaang simuno: “ibibigay niya.”'
  alternative: Ang pari ang magbibigay.
  rationale: Ang pari ang tahasang gumagawa ng pagkukuwenta, ngunit ayon sa mas malawak na konteksto ng Levitico 27, ang taong nagtalaga o tumutubos sa bukid ang nagbibigay ng itinakdang halaga. Gayunman, pinananatili ng panghalip na “niya” ang di-tahasang katangian ng simuno sa Hebreo.
- issue: Pagpapahayag sa קֹדֶשׁ לַיהוָה
  choice: “bilang banal na handog kay Yahweh”
  alternative: “banal kay Yahweh”
  rationale: Ang piniling anyo ay natural at malinaw sa karaniwang mambabasang Tagalog nang hindi inaalis ang diwa ng pagtatalaga. Inilagay sa talababa ang mas literal na anyo upang mapanatili ang pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang teknikal na diwa ng pagtataya at ang ikalawang panauhang “mo,” ngunit iniwasan ang labis na legalistiko o makalumang pananalita.
