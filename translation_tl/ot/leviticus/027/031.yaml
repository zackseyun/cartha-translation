  text: But if a man redeems any of his tithe[a], he shall add a fifth to it.
translation:
  language: tl
  text: Ngunit kung tutubusin nga ng isang lalaki ang anumang bahagi ng kanyang ikapu[a], dadagdagan niya iyon ng ikalimang bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pagtubos na tutubusin,” isang konstruksyong nagbibigay-diin sa kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang isang kondisyong kaso sa daloy ng mga batas; natural na naihahatid ng “Ngunit kung” ang nagpapatuloy ngunit bahagyang pasalungat na ugnayan.
- source_word: גָּאֹל יִגְאַל
  choice: tutubusin nga
  rationale: Ang infinitive absolute na kasunod ng imperfect ng גאל ay nagbibigay-diin sa kilos. Ang “nga” ay maikli at natural na paraan upang katawanin ang diin nang hindi ito ginagawang pahayag ng pagnanais.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Panlalaking isahan ang anyong Hebreo at ginagamit nang pangkalahatan sa estilong legal; pinananatili rito ang tahasang kasarian ng salita.
- source_word: מִמַּעַשְׂרוֹ
  choice: ang anumang bahagi ng kanyang ikapu
  rationale: 'Partitibo ang gamit ng מִן: isang bahagi mula sa bagay na ikapu ang tinutubos. Nililinaw ng “anumang bahagi” ang kahulugang ito sa natural na Tagalog.'
- source_word: חֲמִשִׁיתוֹ
  choice: ikalimang bahagi
  rationale: Tumutukoy ang pangngalan sa one-fifth; malinaw at dignified sa legal na konteksto ang “ikalimang bahagi.”
- source_word: יֹסֵף עָלָיו
  choice: dadagdagan niya iyon ng ikalimang bahagi
  rationale: Ang Hiphil ng יסף ay “magdagdag,” at ipinahihiwatig ng עַל ang pagdaragdag sa pangunahing halaga. Likas sa Tagalog na banggitin ang idinaragdag bilang “ng ikalimang bahagi.”
