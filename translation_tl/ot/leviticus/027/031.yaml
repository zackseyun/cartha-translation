translation_notes:
  register: Modernong Filipino Tagalog na may dignidad na angkop sa tekstong legal. Ginamit ang “ikapu” bilang karaniwang terminong biblikal at pinanatili ang panlalaking “isang lalaki” ayon sa tahasang anyo ng Hebreo.
