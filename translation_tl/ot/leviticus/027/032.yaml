base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: tl
  text: At bawat ikapu mula sa mga baka at maliliit na alagang hayop—bawat ikasampung hayop na dadaan sa ilalim ng tungkod[a]—ay magiging banal para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baston.” Tinutukoy ng parirala ang pagbibilang sa mga alagang hayop nang paisa-isa habang dumaraan ang mga ito sa ilalim ng tungkod ng pastol.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מַעְשַׂר
  choice: At ang bawat ikapu
  rationale: Pinananatili ang malawak na saklaw ng וְכָל at ang teknikal na kahulugan ng מַעְשַׂר bilang ikasampung bahaging ibinubukod.
- source_word: בָּקָר וָצֹאן
  choice: mula sa bakahan at kawan
  rationale: Ang בָּקָר ay kolektibong tumutukoy sa mga baka, at ang צֹאן sa maliliit na alagang hayop, lalo na sa mga tupa at kambing. Likas sa Filipino ang pares na “bakahan at kawan,” habang ipinahihiwatig ng “mula sa” na ang ikapu ay kinukuha sa mga ito.
- source_word: כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: bawat ... na dadaan sa ilalim ng tungkod
  rationale: Inilalarawan nito ang paisa-isang pagdaan ng mga hayop habang binibilang ng pastol. Ang “tungkod” ay malinaw at karaniwang katumbas ng שֵׁבֶט sa kontekstong pastoral.
- source_word: הָעֲשִׂירִי
  choice: bawat ikasampung hayop
  rationale: Literal itong “ang ikasampu,” ngunit malinaw na hayop ang tinutukoy. Ang paglalantad sa ipinahihiwatig na pangngalan ay kailangan para sa natural at tiyak na Filipino.
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: ay magiging banal
  rationale: Tuwirang pinananatili ang predikatibong pahayag ng Hebreo at ang kategoryang banal o nakatalaga.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahahayag ang pangalan ng Diyos na nasa tekstong Hebreo; ang “kay” ay natural na nagsasaad ng pagkakatalaga o pag-aari.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa pinagmulang teksto nang hindi ito pinapalitan ng titulo.
- issue: Paglalantad sa ipinahihiwatig na pangngalan sa הָעֲשִׂירִי
  choice: bawat ikasampung hayop
  alternative: ang ikasampu
  rationale: Hayop ang malinaw na antecedent sa konteksto ng pagbibilang ng bakahan at kawan. Nililinaw ito sa Filipino nang walang idinaragdag na bagong diwa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “ikapu” bilang kinikilalang terminong legal at panrelihiyon, at ang mga gitling na pahaba upang malinaw na ipakita na ang “bawat ikasampung hayop” ang nagpapaliwanag sa ikapu mula sa bakahan at kawan.
