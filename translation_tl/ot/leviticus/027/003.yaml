base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: tl
  text: Ang itinakdang halaga mo para sa lalaking may edad mula dalawampu hanggang animnapung taon ay limampung siklong pilak[a], ayon sa siklo ng santuwaryo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ayon sa siklo ng santuwaryo. Tinutukoy ng pariralang Hebreo ang sagradong pamantayan kung paano sinusukat ang siklo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: ang itinakdang halaga mo
  rationale: Ang עֵרֶךְ sa Levitico 27 ay isang halagang itinatalaga kaugnay ng panata, hindi likas na halaga ng tao. Pinananatili ng “mo” ang ikalawang panauhang hulapi.
- source_word: הַזָּכָר
  choice: para sa lalaking
  rationale: Tumutukoy ito sa kategoryang panlalaki sa legal na pagtataya. Likas sa modernong Tagalog ang “lalaki” at hindi nito ginagawang pangkalahatan ang tahasang kasarian ng Hebreo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: mula dalawampung taong gulang hanggang animnapung taong gulang
  rationale: Malinaw at natural nitong ipinapahayag ang saklaw ng edad na nasa Hebreo.
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: limampung siklong pilak
  rationale: Pinananatili ang sinaunang yunit na siklo at ang pilak bilang materyal o batayan ng timbang.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinahihiwatig ng parirala ang opisyal na pamantayan ng timbang na kaugnay ng banal na lugar; natural sa Tagalog ang “ayon sa” para sa pamantayang sinusunod.
- source_word: וְהָיָה ... וְהָיָה
  choice: ay
  rationale: Sa kontekstong legal, ang payak na panaguring “ay” ay natural at sapat upang ihayag ang itinakdang tuntunin sa Tagalog nang hindi gumagamit ng artipisyal na legalismong “nararapat na maging.”
theological_decisions:
- issue: Kategorya ng pagtataya ayon sa kasarian
  choice: lalaking
  alternative: tao; isang lalaki
  rationale: Pinananatili ang tahasang panlalaking kategorya ng teksto bilang legal na klasipikasyon, nang hindi ito ginagawang pahayag tungkol sa likas na dignidad ng tao.
- issue: Kahulugan ng עֵרֶךְ sa Levitico 27
  choice: itinakdang halaga
  alternative: halaga; pagtataya
  rationale: Nililinaw nito na ang halaga ay opisyal na itinatakda sa konteksto ng panata at hindi isang pahayag tungkol sa likas o pamilihang halaga ng tao.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “siklo” bilang nakaugaliang transliterasyon ng sinaunang yunit at “santuwaryo” para sa banal na lugar at sa pamantayang kaugnay nito.
