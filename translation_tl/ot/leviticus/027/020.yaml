id: LEV.27.20
reference: Leviticus 27:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: tl
  text: Ngunit kung hindi niya tutubusin ang bukid, o kung ipinagbili niya ang bukid sa ibang lalaki[a], hindi na iyon maaaring tubusin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibang tao.” Sa Hebreo, “sa ibang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung / o kung
  rationale: Ipinagpapatuloy ng mga pangatnig ang kondisyon mula sa naunang talata; ipinahihiwatig ng “Ngunit kung” ang pagsalungat, at natural sa Filipino ang “o kung” sa ikalawang kondisyon.
- source_word: יִגְאַל / יִגָּאֵל
  choice: tutubusin / maaaring tubusin
  rationale: Pinananatili ng “tubusin” ang teknikal na legal at sagradong diwa ng גאל tungkol sa pagbawi ng ari-ariang inialay, habang malinaw na naihahayag ang aktibo at pasibong anyo.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Tumutukoy ito sa tiyak na bukid na tinatalakay sa mga batas ng pagtataya, hindi sa lupain sa malawak na kahulugan.
- source_word: מָכַר
  choice: ipinagbili niya
  rationale: Ipinahahayag ang natapos na pagbebenta na may kasalukuyang legal na bunga; natural sa Filipino ang aspektong perpektibo.
- source_word: לְאִישׁ אַחֵר
  choice: sa ibang lalaki
  rationale: Ang אִישׁ ay tahasang panlalaking pangngalan. Pinananatili ito sa pangunahing teksto, habang inilalahad sa talababa ang posibleng pangkalahatang legal na gamit.
- source_word: עוֹד
  choice: hindi na
  rationale: Sa pahayag na ito, ipinakikita ng עוֹד na matapos ang pagbebenta ay wala nang posibilidad ng pagtubos; idiomatiko at malinaw sa Filipino ang “hindi na.”
theological_decisions:
- issue: Pangkalahatang panlalaking katawagan sa legal na pahayag
  choice: ibang lalaki
  alternative: ibang tao
  rationale: Panlalaking isahan ang anyong אִישׁ, kaya pinanatili sa teksto ang pormal na anyo ng pinagmulan. Gayunman, maaaring pangkalahatan ang legal na saklaw nito, kaya ibinigay ang “ibang tao” bilang alternatibo sa talababa.
- issue: Legal at sagradong diwa ng גאל
  choice: tubusin
  alternative: bilhing muli / bawiin
  rationale: Ang “tubusin” ang pinakamahusay na nagpapanatili sa teknikal na diwa ng pagbawi sa inialay na ari-arian nang hindi dinaragdagan ng partikular na doktrinang wala sa talata.
- issue: Hindi tiyak na tinutukoy ng panghalip na paksa
  choice: niya
  alternative: tukuyin nang tahasan ang may-ari o pari
  rationale: Hindi tahasang inuulit ng tekstong Hebreo ang paksa ng mga pandiwa. Pinananatili ng panghalip ang ugnayan at posibleng tensiyon mula sa konteksto sa halip na magpasok ng isang tiyak na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bukid” at “tubusin” upang mapanatili ang tiyak na legal-sagradong bokabularyo ng talata; inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang tinutukoy nito.
