base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: tl
  text: Hindi niya ito papalitan o ipagpapalit[a], mabuti man sa masama o masama sa mabuti. At kung ipagpapalit nga niya ang isang hayop sa ibang hayop[b], magiging banal kapuwa ang hayop na iyon at ang ipinalit dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ihalili”; dalawang magkaugnay ngunit magkaibang pandiwa ang ginamit sa Hebreo para sa pagpapalit.
    reason: lexical_alternative
  - marker: b
    text: 'Idinidiin sa Hebreo ang pandiwa: “kung ipagpapalit nga niya” o “kung talagang ipagpapalit niya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: palitan
  rationale: Ang Hiphil ng חלף ay tumutukoy dito sa pagpapalit sa hayop na naitalaga na. Likas sa Filipino ang “palitan,” at naipag-iiba ito sa kasunod na pandiwang מוּר.
- source_word: יָמִיר אֹתוֹ
  choice: ipagpalit
  rationale: Ang מוּר sa batas na ito ay pagpapalit ng isang hayop sa iba. Ang “ipagpalit” ay malinaw at pinananatili ang dalawang magkaugnay ngunit magkaibang pandiwa sa Hebreo.
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: ang mabuti sa masama o ang masama sa mabuti
  rationale: Ginagamit bilang mga pangngalan ang mga pang-uri, at ipinahihiwatig ng ב ang bagay na kapalit. Pinananatili ng salin ang maikli at balanseng paghahambing.
- source_word: וְאִם הָמֵר יָמִיר
  choice: At kung talagang ipagpalit niya
  rationale: Ang infinitive absolute na sinusundan ng finite verb ay nagbibigay-diin sa kilos. Natural na ipinahahayag ito ng “talagang” sa modernong Filipino.
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: isang hayop sa ibang hayop
  rationale: Malinaw at likas na Filipino ito para sa pagpapalit ng isang hayop sa isa pa.
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: kapuwa magiging banal ang unang hayop at ang ipinalit dito
  rationale: Tumutukoy ang panghalip sa orihinal na hayop at ang תְּמוּרָה sa kapalit. Nililinaw ng “kapuwa” na parehong hayop ang saklaw nang hindi binabago ang legal na resulta.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Tumutukoy ang קֹדֶשׁ sa katayuang sagrado at nakatalaga sa Diyos. “Banal” ang tuwiran at pamilyar na katumbas, habang nananatiling mahihinuha sa konteksto ang legal na pagtatalaga.
theological_decisions:
- issue: Katayuan ng orihinal at ipinalit na hayop matapos ang ipinagbabawal na pagpapalit
  choice: Kapuwa nagiging banal ang orihinal na hayop at ang ipinalit na hayop.
  alternative: Ang ipinalit lamang ang nagiging banal, o ipinahahayag lamang na walang bisa ang pagpapalit.
  rationale: Tuwirang iniuugnay ng pariralang וְהָיָה הוּא וּתְמוּרָתוֹ יִהְיֶה־קֹדֶשׁ ang banal na katayuan sa orihinal at sa kapalit. Kaya ginamit ang “kapuwa” upang malinaw na mapanatili ang dalawahang resulta.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino para sa tekstong pambatas. Ginamit ang pautos na “Huwag niya” para sa legal na pagbabawal, pinanatili ang dalawang pandiwa bilang “palitan” at “ipagpalit,” at ginawang tahasan ang dalawang hayop sa huling sugnay upang maiwasan ang malabong reperensiya ng panghalip.
