  text: אַךְ בְּכ֞וֹר אֲשֶׁר יְבֻכַּ֤ר לַֽ/יהוָה֙ בִּ/בְהֵמָ֔ה לֹֽא יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑/וֹ אִם שׁ֣וֹר אִם שֶׂ֔ה לַֽ/יהוָ֖ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: tl
  text: Ngunit ang panganay sa mga alagang hayop, na bilang panganay ay nauukol kay Yahweh, ay hindi maaaring italaga ninuman. Maging baka o tupa[a], ito ay kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa tupa o kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Natural na ipinakikita ang pagbubukod o paglilimita sa naunang mga tuntunin.
- source_word: בְּכוֹר
  choice: ang panganay
  rationale: Tumutukoy sa hayop na unang ipinanganak; malinaw at karaniwang salita ito sa modernong Tagalog.
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: na bilang panganay ay kay Yahweh
  rationale: Ang pasibong anyo ng בכר ay tumutukoy sa kalagayan nito bilang panganay, hindi sa isang kilos ng tao; ipinahihiwatig ng parirala na dahil panganay ito, dati na itong nauukol kay Yahweh.
- source_word: בִּבְהֵמָה
  choice: sa mga alagang hayop
  rationale: Ang בהמה ay kolektibong katawagan dito para sa domestikadong mga hayop sa konteksto ng paghahandog.
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: ay hindi maaaring italaga ninuman
  rationale: Pinananatili ng 'italaga' ang kultikong diwa ng Hiphil ng קדש, habang natural na ipinahahayag ng 'ninuman' ang pangkalahatang gamit ng אִישׁ nang hindi nililimitahan sa lalaking tao.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: Baka man ito o tupa
  rationale: Ang kayarian ay 'maging ... o ...' / 'whether ... or ...'. Ang שׁוֹר ay hayop na baka, samantalang ang שֶׂה ay maaaring tupa o kambing; 'tupa' ang maikli at natural na salin, na may talababa para sa lawak ng Hebreo.
- source_word: לַיהוָה הוּא
  choice: ito ay kay Yahweh
  rationale: Likas at tuwirang ipinahahayag sa Tagalog ang pag-aari o karapatan ni Yahweh sa hayop.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalan ayon sa patakaran ng proyekto.
theological_decisions:
- issue: Bakit hindi maaaring italaga ang panganay na hayop
  choice: Hindi na ito maaaring muling italaga ng tao sapagkat bilang panganay ay dati na itong kay Yahweh.
  alternative: Ang pagiging panganay mismo ay isang uri ng pagkakatalaga, nang hindi binibigyang-diin ang legal na pag-aari.
  rationale: Ang pangwakas na pahayag na 'ito ay kay Yahweh' ay nagpapakitang hindi maaaring ialay sa pamamagitan ng panata ang dati nang saklaw ng karapatan ni Yahweh.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa legal-kultikong konteksto. Ginamit ang 'ninuman' bilang natural na pangkalahatang katumbas ng Hebreong אִישׁ; hindi kailangan ng hiwalay na talababa para rito. Ang bahagyang pag-uulit ng 'bilang panganay' ay pinanatili upang katawanin ang diin ng Hebreo at ang lohika ng talata.
