  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: tl
  text: Ngunit kung italaga niya bilang banal ang kanyang bukid pagkatapos ng Jubileo[a], tutuusin ng pari para sa kanya ang halaga ayon sa bilang ng mga taong natitira hanggang sa taon ng Jubileo, at ibabawas iyon sa itinakda mong halaga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkatapos ng taon ng Jubileo.”
    reason: lexical_alternative
  - marker: b
    text: O “at babawasan ang itinakda mong halaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: pagkatapos ng Jubileo
  rationale: Ipinahihiwatig ng אַחַר ang pagkakasunod sa panahon, at ang הַיֹּבֵל ay tumutukoy sa pinangalanang institusyon o taon ng Jubileo sa Levitico.
- source_word: יַקְדִּישׁ
  choice: italaga ... bilang banal
  rationale: Ipinananatili nito ang diwa ng paghihiwalay ng ari-arian bilang banal, habang gumagamit ng malinaw at likas na modernong Tagalog.
- source_word: שָׂדֵהוּ
  choice: ang kanyang bukid
  rationale: Tuwirang pinananatili ang ikatlong panauhang panlalaking panghalip na paari.
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: kakalkulahin ng pari para sa kanya ang halaga
  rationale: Ang חשב ay pagkukuwenta o pagtutuos sa kontekstong legal, at ang הַכֶּסֶף ay ang halagang salapi na itinatakda.
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: ayon sa bilang ng mga taong natitira
  rationale: Malinaw na ipinapahayag ang proporsiyonal na pagtutuos batay sa nalalabing mga taon.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: hanggang sa taon ng Jubileo
  rationale: Pinananatili ang tahasang hangganan ng panahong ginagamit sa pagkalkula.
- source_word: וְנִגְרַע
  choice: at ibabawas iyon
  rationale: Ang Niphal ng גרע ay nagsasaad ng pagbabawas sa kontekstong pananalapi; ginawang aktibo sa Tagalog upang maging natural, nang hindi binabago ang diwa.
- source_word: מֵעֶרְכֶּךָ
  choice: sa itinakda mong halaga
  rationale: Pinananatili ng “mong” ang ikalawang panauhang isahan ng hulaping Hebreo at iniuugnay ang halaga sa naunang pagtatasa.
theological_decisions:
- issue: Ikalawang panauhang isahan sa מֵעֶרְכֶּךָ
  choice: sa itinakda mong halaga
  alternative: sa itinakdang halaga
  rationale: Tahasang may hulaping ikalawang panauhang isahan ang Hebreo; pinananatili ito upang hindi mawala ang legal na paraan ng tuwirang pakikipag-usap.
- issue: Banal na diwa ng יַקְדִּישׁ
  choice: italaga ... bilang banal
  alternative: ialay / italaga
  rationale: Ipinakikita ng piniling parirala na ang bukid ay ibinubukod bilang banal, nang hindi nagdaragdag ng doktrinal na paliwanag na wala sa talata.
- issue: Hindi tahasang simuno ng וְנִגְרַע
  choice: ibabawas iyon sa itinakda mong halaga
  alternative: babawasan ang itinakda mong halaga
  rationale: Ang “iyon” ay tumutukoy sa halagang ibinabawas, ngunit nananatiling posible sa Hebreo ang mas pangkalahatang pagbasa na ang pagtatasa mismo ay binabawasan; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal at panrelihiyon. Ginamit ang “kakalkulahin” dahil karaniwan at tiyak ito sa kasalukuyang gamit; pinanatili naman ang “Jubileo” at “bilang banal” upang maipahayag ang natatanging kontekstong pangkulto.
