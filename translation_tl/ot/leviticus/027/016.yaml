    issue: Ang "bukid na minana niya" ay mas makitid kaysa sa "field of his hereditary possession."
    rationale: Maaaring ilarawan ng אֲחֻזָּה ang lupang hawak bilang minanang pag-aari, hindi kinakailangang isang bukid na personal niyang minana sa isang tiyak na pangyayari.
  - severity: medium
    issue: Ang "ilalaan" ay hindi tahasang nagpapahayag na ang bagay ay itinalaga bilang banal.
    rationale: Ang יַקְדִּישׁ sa Levitico 27 ay teknikal na pandiwa para sa pagtatakda ng ari-arian bilang banal kay Yahweh.
  - severity: medium
    issue: Ang "para sa bukid na nangangailangan ng isang homer na binhing sebada" ay naglilipat ng gramatikal na pokus ng Hebreo.
    rationale: Ang teksto ay nagsasaad ng halagang "limampung siklong pilak" para sa "binhi ng isang homer ng sebada," bilang batayan ng pagtataya; hindi nito tuwirang inuuri ang bukid sa ganitong pananalita.
