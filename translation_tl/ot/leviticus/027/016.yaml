source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: tl
  text: 'Kung italaga ng isang lalaki bilang banal para kay Yahweh ang bahagi ng bukid na pag-aari niya bilang mana[a], ang pagtataya mo sa halaga nito ay ibabatay sa dami ng binhing kailangan upang mahasikan ito: limampung siklong pilak para sa binhi ng isang homer na sebada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa bukid na pag-aari niya bilang mana.” Ang pananalita sa Hebreo ay tumutukoy sa lupang hawak bilang minanang pag-aari, at ipinahihiwatig ng unlaping “mula sa” na bahagi lamang ng bukid ang itinatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: ang bahagi ng bukid na minana niya
  rationale: Ipinahihiwatig ng prefixed מִן na bahagi lamang ng bukid ang tinutukoy. Ang אֲחֻזָּה ay lupang pag-aari bilang minanang pag-aari o mana; natural sa Filipino ang 'bukid na minana niya' at malinaw ang legal na diwa.
- source_word: יַקְדִּישׁ
  choice: ilalaan
  rationale: Sa konteksto ng Levitico 27, tumutukoy ito sa pagbubukod ng ari-arian bilang banal para kay Yahweh. Ang 'ilalaan' ay natural at dignified sa Filipino, at ang pariralang 'kay Yahweh' ang nagpapanatili sa sagradong diwa.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Panlalaking pangngalang isahan ang Hebreo at ginagamit bilang kinatawang legal na paksa. Pinananatili ng salin ang anyong panlalaki ng pinagmulan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang ginagamit sa teksto ang banal na pangalang יהוה; isinalin itong 'Yahweh' upang mapanatili ang pangalang tipan.
- source_word: עֶרְכְּךָ
  choice: ang pagtataya mo sa halaga nito
  rationale: Tumutukoy ito sa pagtatayang itinatalaga sa legal at panrelihiyong konteksto. Pinananatili ng 'mo' ang ikalawang panauhang panlalaking isahan sa Hebreo.
- source_word: לְפִי זַרְעוֹ
  choice: ibabatay sa dami ng binhing kailangan dito
  rationale: Ang hulapi ay tumutukoy sa bukid, at ang sukatan ay ang dami ng binhing kailangan upang mahasikan ito, hindi ang ani o supling.
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: bukid na nangangailangan ng isang homer na binhing sebada
  rationale: 'Teknikal na sukat pang-agrikultura ito: lawak ng bukid ayon sa dami ng binhing kailangan. Nililinaw ng ayos sa Filipino na isang homer ng binhing sebada ang batayan ng pagtataya.'
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: limampung siklong pilak
  rationale: Ito ang itinakdang halaga. Ang 'siklo' ay karaniwang transliterasyon sa Filipino para sa sinaunang yunit ng timbang at salapi.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili ang personal na pangalang 'Yahweh' sa halip na palitan ito ng titulo.
- issue: Kinatawang panlalaking אִישׁ sa legal na tagubilin
  choice: isang lalaki
  alternative: sinuman; isang tao
  rationale: Pinananatili ang gramatikal na kasariang panlalaki ng teksto habang nauunawaan ang kinatawang gamit nito sa batas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ilalaan' sa halip na mas teknikal na 'kokonsekrang' upang maging natural sa karaniwang mambabasa, habang pinananatili ng 'kay Yahweh' ang sagradong konteksto. Isinaayos ang huling parirala upang malinaw na ang isang homer ay dami ng binhing sebada na kailangan sa bukid.
