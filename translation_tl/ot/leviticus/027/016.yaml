revisions:
- from: 'Kung ilalaan ng isang lalaki kay Yahweh ang bahagi ng bukid na minana niya[a], ang pagtataya mo sa halaga nito ay ibabatay sa dami ng binhing kailangan dito: limampung siklong pilak para sa bukid na nangangailangan ng isang homer na binhing sebada.'
  to: 'Kung italaga ng isang lalaki bilang banal para kay Yahweh ang bahagi ng bukid na pag-aari niya bilang mana[a], ang pagtataya mo sa halaga nito ay ibabatay sa dami ng binhing kailangan upang mahasikan ito: limampung siklong pilak para sa binhi ng isang homer na sebada.'
