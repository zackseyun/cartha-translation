  source_fidelity: Tumpak ang pangunahing pag-uuri sa hayop bilang ritwal na marumi, ang pagtubos batay sa pagtataya ng kausap na pari, at ang pagbebenta kung hindi ito matubos. Gayunman, ang “dagdagan iyon ng ikalimang bahagi” ay maaaring magmukhang ang hayop mismo ang dinaragdagan; sa Hebreo, ang ikalimang bahagi ay idinaragdag sa naitalagang halaga.
  naturalness: Malinaw at angkop sa modernong Filipino ang rehistro. Mas natural at mas tiyak ang “magdagdag ng ikalimang bahagi sa halagang iyon.” Ang “kung hindi ito matutubos” ay maayos na walang-tiyak-singaw na pagpapahayag ng pasibong Niphal.
  terminology: Ang “marumi ayon sa ritwal,” “tubusin,” at “halagang itinakda mo” ay angkop at pare-pareho sa legal-ritwal na konteksto. Pinanatili ang “maaari” sapagkat ang kundisyunal na ayos ay naglalahad ng opsiyon ng pagtubos, nang hindi ipinipilit ang isang dogmatikong pagbasa sa puwersa ng pandiwa.
