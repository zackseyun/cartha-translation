  to: Ngunit kung ito ay kabilang sa mga hayop na marumi ayon sa ritwal[a], maaari niya itong tubusin ayon sa halagang itinakda mo at magdagdag ng ikalimang bahagi sa halagang iyon[b]; ngunit kung hindi ito matutubos, ipagbibili ito ayon sa halagang itinakda mo.
