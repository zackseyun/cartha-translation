  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: tl
  text: Ngunit kung ito ay kabilang sa mga hayop na marumi ayon sa ritwal[a], maaari niya itong tubusin ayon sa halagang itinakda mo at magdagdag ng ikalimang bahagi sa halagang iyon[b]; ngunit kung hindi ito matutubos, ipagbibili ito ayon sa halagang itinakda mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa maruruming alagang hayop.” Tumutukoy ang Hebreong parirala sa hayop na kabilang sa uring itinuturing na marumi ayon sa ritwal.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “idagdag ang ikalimang bahagi nito rito”; ibig sabihin, magdagdag ng dalawampung porsiyento sa halagang itinakda.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: kabilang sa mga hayop na marumi ayon sa ritwal
  rationale: Ang בְּהֵמָה ay maaaring tumukoy sa hayop o alagang hayop, at ang parirala rito ay nag-uuri sa inialay na bagay bilang kabilang sa mga hayop na itinuturing na marumi sa ritwal. Nililinaw ng “ayon sa ritwal” na hindi karaniwang karumihan ang tinutukoy.
- source_word: וּפָדָה
  choice: maaari niya itong tubusin
  rationale: Ang פדה ay ‘tubusin’ o ‘bilhing muli.’ Sa kondisyunal na batas, inilalahad dito ang maaaring paraan ng pagbawi sa hayop; pinananatili ng “maaari” ang ugnayan nito sa kasunod na posibilidad na hindi ito tubusin.
- source_word: בְעֶרְכֶּךָ
  choice: ayon sa halagang itinakda mo
  rationale: Ang עֵרֶךְ sa Levitico 27 ay tasang halaga, at ang hulaping ikalawang panauhang panlalaki ay pinananatili sa “mo.” Mas natural sa modernong Tagalog ang “halagang itinakda mo” kaysa literal na “iyong pagtataya.”
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: dagdagan iyon ng ikalimang bahagi
  rationale: Ang idyoma ay nangangahulugang magdagdag ng isang ikalima, o dalawampung porsiyento, sa tasang halaga. Ang “iyon” ay tumutukoy sa halagang itinakda, gaya ng hinihingi ng konteksto.
- source_word: וְאִם לֹא יִגָּאֵל
  choice: kung hindi iyon tutubusin
  rationale: Ang Niphal ay walang tahasang gumaganap, kaya pinananatili ang pasibong anyo at hindi tinutukoy kung sino ang hindi tutubos.
- source_word: וְנִמְכַּר
  choice: ipagbibili iyon
  rationale: Ang Niphal ay legal na pasibo; ipinahahayag ng “ipagbibili” ang itinakdang kahihinatnan sa natural at dignified na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na wikang legal. Ginamit ang “marumi ayon sa ritwal” upang maiwasang ipakahulugan ang טָמֵא bilang pisikal na marumi. Ang “tubusin” ay pinanatili dahil pamilyar at angkop sa kontekstong legal at panrelihiyon.
