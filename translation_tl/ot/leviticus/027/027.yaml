  - severity: low
    issue: Walang katumbas na talababa para sa paliwanag ng ikalimang bahagi.
    rationale: May ganitong lexical audit note sa English POB. Makabubuting ilagay ito pagkatapos ng “ikalimang bahagi,” kung saan ito semantikong nakaugnay, upang maipaliwanag na ito ay 20 porsiyento ng halaga.
