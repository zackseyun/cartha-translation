id: LEV.23.41
reference: Leviticus 23:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: tl
  text: Ipagdiwang ninyo ito bilang isang kapistahan para kay Yahweh sa loob ng pitong araw bawat taon. Ito ay isang tuntuning panghabang-panahon[a] sa lahat ng inyong salinlahi. Sa ikapitong buwan ninyo ito ipagdiwang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang palagiang tuntunin” o “isang tuntuning walang hanggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: ipagdiwang ninyo
  rationale: Ang חָגַג ay tumutukoy sa pagdiriwang o pangingilin ng isang kapistahan, lalo na ng kapistahang may paglalakbay. Natural sa modernong Tagalog ang “ipagdiwang,” at pinanatili ang pag-uulit ng pandiwa.
- source_word: אֹתוֹ
  choice: ito
  rationale: Tumutukoy ang panghalip sa kapistahang tinatalakay sa konteksto; hindi na kailangang ulitin ang pangngalan.
- source_word: חַג
  choice: isang kapistahan
  rationale: Ang חַג ay isang kapistahan o pistang panrelihiyon, kadalasang may kaugnayan sa paglalakbay. Ang “kapistahan” ay malinaw, marangal, at angkop sa kontekstong pangkulto.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Maaaring magpahiwatig ang ל ng pag-aalay, pagtatalaga, o pagdiriwang bilang parangal kay Yahweh. Ang “para kay” ay natural sa Tagalog at hindi labis na nagpapasiya sa eksaktong ugnayan.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Malinaw nitong ipinapahayag ang tagal ng kapistahan.
- source_word: בַּשָּׁנָה
  choice: bawat taon
  rationale: Bagaman literal na “sa taon,” taunang pagdiriwang ang diwa sa konteksto. Ang “bawat taon” ang natural at malinaw na katumbas sa Tagalog.
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning panghabang-panahon
  rationale: Ang חֻקָּה ay itinakdang tuntunin, at ang עוֹלָם ay nagsasaad ng patuloy o di-tiyak na mahabang bisa. Pinananatili ng salin ang malakas na pananalita nang hindi ito ginagawang pilosopikal na pahayag tungkol sa absolutong kawalang-hanggan.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahihiwatig ng parirala ang patuloy na bisa sa magkakasunod na henerasyon.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: sa ikapitong buwan
  rationale: Tuwirang temporal na parirala na tumutukoy sa takdang buwan ng pagdiriwang.
theological_decisions:
- issue: Pagbanggit sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng עוֹלָם sa batas pangkapistahan
  choice: panghabang-panahon
  alternative: palagian; walang hanggang
  rationale: Ipinahahayag nito ang namamalagi at nagpapatuloy na bisa sa mga salinlahi, ngunit hindi dapat sapilitang ipakahulugan bilang teknikal na pahayag tungkol sa absolutong kawalang-hanggan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapistahan” para sa kontekstong panrelihiyon, “tuntunin” para sa legal na חֻקָּה, at “salinlahi” upang mapanatili ang biblikal na dignidad nang hindi nagiging lipas ang wika.
