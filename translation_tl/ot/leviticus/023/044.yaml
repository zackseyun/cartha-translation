  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: tl
  text: Kaya ipinahayag ni Moises sa mga anak ni Israel[a] ang mga takdang panahon ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita”; sa literal na Hebreo, “mga anak na lalaki ni Israel.”
    reason: Ipinakikita ang mas idyomatikong salin at ang literal na panlalaking pananalita ng Hebreo.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ipinahayag
  rationale: Sa pangwakas na buod ng kalendaryo ng mga banal na pagtitipon, ipinahihiwatig ng piel na anyo ng דבר ang pagpapabatid ni Moises sa bayan; natural din ito sa Filipino kapag may tuwirang layon.
- source_word: מֹעֲדֵי
  choice: mga takdang panahon
  rationale: Saklaw ng מוֹעֵד ang mga panahong itinakda para sa banal na pagtitipon o pagdiriwang. Pinananatili ng “mga takdang panahon” ang lawak ng termino, kabilang ang Sabbath, nang hindi ito nililimitahan sa mga pista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: sa
  rationale: Tinutukoy ng pang-ukol ang mga taong pinatunguhan ng pagpapahayag ni Moises.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal na Hebreong “mga anak na lalaki ni Israel,” ngunit ang “mga anak ni Israel” ang mas natural at nakaugaliang pahayag sa Filipino habang pinananatili ang ugnayan sa pangalang Israel.
theological_decisions:
- issue: Pagsasalin sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: Yehovah; PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na tahimik itong palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ipinahayag” bilang natural na pangwakas na buod, at “mga takdang panahon” upang mapanatili ang malawak na saklaw ng מוֹעֵד.
