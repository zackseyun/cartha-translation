  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: tl
  text: Huwag kayong gagawa ng anumang gawain. Ito ay tuntuning mananatili sa lahat ng salinlahi ninyo, sa lahat ng inyong tirahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tuntunin magpakailanman” o “isang walang hanggang tuntunin.” Ang salitang Hebreo na עוֹלָם ay maaaring tumukoy sa patuloy, pangmatagalan, o walang hanggang tagal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa ng anumang gawain
  rationale: Ang כָּל מְלָאכָה sa ilalim ng pagtanggi ay sumasaklaw sa anumang uri ng gawain. Ang tuwirang pagbabawal na “Huwag kayong gagawa” ay natural sa modernong Filipino at pinananatili ang legal na lakas ng Hebreo.
- source_word: חֻקַּת עוֹלָם
  choice: tuntuning mananatili
  rationale: Ang חֻקָּה ay isang itinakdang tuntunin o batas, at ang עוֹלָם ay maaaring tumukoy sa patuloy, pangmatagalan, o walang hanggang tagal. Ang “tuntuning mananatili” ay malinaw at hindi labis na nagpapasya sa lawak ng tagal.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahihiwatig ng parirala ang patuloy na bisa sa magkakasunod na salinlahi.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: saanman kayo naninirahan
  rationale: Ang מוֹשָׁב ay tumutukoy sa lugar ng paninirahan o pamayanan. Ang “saanman kayo naninirahan” ay natural na Filipino at malinaw na ipinapakita ang saklaw sa lahat ng tirahan.
theological_decisions:
- issue: Tagal ng bisa ng tuntunin sa batas pangkulto
  choice: tuntuning mananatili
  alternative: tuntunin magpakailanman; walang hanggang tuntunin
  rationale: Maaaring mangahulugan ang עוֹלָם ng patuloy o pangmatagalang bisa at, depende sa konteksto, ng walang hanggan. Pinananatili ng napiling salin ang legal na bigat at tunay na saklaw ng kahulugan nang hindi ipinipilit ang isang pilosopikal na pakahulugan tungkol sa lubos na kawalang-hanggan.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang tuwirang anyo ng pagbabawal at ang natural na “saanman kayo naninirahan,” habang pinanatili sa talababa ang ambiguwidad ng עוֹלָם.
