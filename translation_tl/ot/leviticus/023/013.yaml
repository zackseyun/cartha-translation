source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: tl
  text: Ang handog nitong butil ay dalawang ikasampu ng isang efa ng pinong harina na hinaluan ng langis—isang handog na inihahandog sa pamamagitan ng apoy[a] para kay Yahweh, isang kalugod-lugod na samyo. Ang handog nitong inumin ay alak, isang-kapat ng isang hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handog na pagkain para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: Ang handog na butil na kasama nito
  rationale: Sa kontekstong panghain, ang מִנְחָה ay handog na butil. Ang hulaping panlalaking isahan ay tumutukoy sa korderong binanggit sa naunang talata; ginamit ang “na kasama nito” upang maging natural at malinaw sa Filipino.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampu ng isang efa
  rationale: Literal itong “dalawang ikasampu,” at sa batas na pangsaserdote ang ipinahihiwatig na batayang sukat ay efa. Pinananatili ang sinaunang yunit habang nililinaw ang bahagi nito.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang terminong pangkulto para sa mahusay na naprosesong harinang ginagamit sa mga handog.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Ipinahihiwatig ng balbal na pandiwaring balintiyak na pinaghalo ang harina at langis; natural at tumpak ang “hinaluan” sa Filipino.
- source_word: אִשֶּׁה לַיהוָה
  choice: handog na pinaraan sa apoy para kay Yahweh
  rationale: Ang אִשֶּׁה ay teknikal na katawagan sa handog na inihahandog sa pamamagitan ng apoy. Mas tuwirang kumakatawan dito ang “pinaraan sa apoy” kaysa “handog na pagkain,” at iniiwasan nitong ipakahulugang kinakain ng Diyos ang handog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Isinalin ang tetragrammaton bilang pangalang “Yahweh,” alinsunod sa tahasang Hebreong teksto at sa ibinigay na pasyang teolohikal.
- source_word: רֵיחַ נִיחֹחַ
  choice: isang kalugod-lugod na samyo
  rationale: Pinananatili nito ang konkretong talinghaga ng samyo at ang diwa ng pagtanggap o pagkalugod, nang hindi ipinapaliwanag nang lampas sa teksto.
- source_word: וְנִסְכֹּה
  choice: Ang handog na inumin na kasama nito
  rationale: Ang נֶסֶךְ ay likidong handog na ibinubuhos. Ang “handog na inumin” ay malinaw sa karaniwang mambabasa, at ang hulapi ay muling iniugnay sa kasamang handog.
- source_word: יַיִן
  choice: alak
  rationale: Tuwirang katumbas ng salitang Hebreo sa kontekstong ito.
- source_word: רְבִיעִת הַהִין
  choice: isang-kapat ng isang hin
  rationale: Isinalin ang bahagdan ngunit pinanatili ang sinaunang yunit na hin upang hindi magbigay ng di-tiyak na makabagong conversion.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangngalang pantangi ang יהוה sa pinagmulang teksto. Ang “Yahweh” ay nagpapanatili sa tipang pangalan at tumutugma sa tahasang pinakahuling pasyang ibinigay.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Tinutukoy ng teknikal na salita ang handog na inihaharap sa pamamagitan ng apoy. Pinananatili ng salin ang ritwal na paraan nang hindi nagpapahiwatig ng partikular na teolohiya tungkol sa pagkain ng Diyos.
- issue: Diwa ng רֵיחַ נִיחֹחַ
  choice: isang kalugod-lugod na samyo
  alternative: isang samyong nakapagpapahupa
  rationale: Ang “kalugod-lugod” ay natural na Filipino at pinananatili ang pormulang panghain; hindi nito isinasarang ganap ang mas literal na posibilidad na “nakapagpapahupa.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga sinaunang sukat na “efa” at “hin,” at hinati sa tatlong pangungusap ang mahabang Hebreong sugnay upang maging madaling basahin nang hindi binabago ang lohika nito. Walang talababa dahil ang piniling “handog na pinaraan sa apoy” ay tuwirang kumakatawan sa אִשֶּׁה at hindi nangangailangan ng alternatibong marker.
