  terminology: Ang “handog na butil,” “efa,” “pinong harina,” “langis,” “Yahweh,” “samyo,” “handog na inumin,” at “hin” ay angkop. Dapat panatilihin ang alternatibong pag-unawa sa אִשֶּׁה sa talababa, alinsunod sa English audit trail, nang hindi ipinipilit na ang handog ay literal na pagkain ng Diyos.
