id: LEV.23.39
reference: Leviticus 23:39
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: tl
  text: Gayunman[a], sa ikalabinlimang araw ng ikapitong buwan, kapag natipon na ninyo ang ani ng lupain, ipagdiriwang ninyo ang kapistahan ni Yahweh sa loob ng pitong araw. Sa unang araw ay magkakaroon ng banal na pamamahinga[b], at sa ikawalong araw ay banal na pamamahinga rin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tiyak na” o “Lamang.” Maaaring magpahiwatig ang salitang Hebreo ng paglipat, pagbibigay-diin, o paglilimita ayon sa konteksto.
    reason: lexical_ambiguity
  - marker: b
    text: Maaari ring “pamamahingang Sabbath” o “ganap na pamamahinga.” Tumutukoy ang salitang Hebreo sa natatanging paghinto sa gawain na kaugnay ng banal na pagdiriwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahihiwatig ng kataga rito ang paglipat o pagbibigay-diin sa tiyak na tagubilin tungkol sa panahon at pagdiriwang; natural itong naipapahayag sa Tagalog bilang “Gayunman,” habang kinikilala sa talababa ang iba pang posibleng himig.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: sa ikalabinlimang araw ng ikapitong buwan
  rationale: Pinananatili ang tiyak na petsa sa natural na ayos ng modernong Tagalog.
- source_word: בְּאָסְפְּכֶם
  choice: kapag natipon na ninyo
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahong kalagayan; ipinahihiwatig ng “na” na naganap na ang pagtitipon ng ani.
- source_word: תְּבוּאַת הָאָרֶץ
  choice: ang ani ng lupain
  rationale: Saklaw ng “ani” ang ani o bunga mula sa lupain nang hindi ito nililimitahan sa butil lamang.
- source_word: תָּחֹגּוּ אֶת חַג
  choice: ipagdiriwang ninyo ang kapistahan
  rationale: Naipapahayag nito kapuwa ang pandiwang חגג at ang kaugnay na pangngalang חַג sa malinaw at dignified na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na ipinapahayag sa Tagalog ang tagal ng pagdiriwang.
- source_word: שַׁבָּתוֹן
  choice: banal na pamamahinga
  rationale: Ipinahihiwatig ng termino ang natatanging paghinto sa gawain na kaugnay ng banal na pagdiriwang, nang hindi ito awtomatikong ipinapakahulugang lingguhang Sabbath.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang banal na pangalan at hindi lamang bilang titulo.
- issue: Kahulugan ng שַׁבָּתוֹן sa batas tungkol sa kapistahan
  choice: banal na pamamahinga
  alternative: pamamahingang Sabbath; ganap na pamamahinga
  rationale: Pinananatili nito ang sagradong katangian ng itinakdang pahinga ngunit hindi nilulutas nang labis kung katumbas ba ito sa lahat ng aspekto ng lingguhang Sabbath.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “kapistahan,” “ani,” at “banal na pamamahinga” bilang karaniwan ngunit dignified na mga kataga; iniwasan ang labis na teknikal o denominasyonal na pananalita.
