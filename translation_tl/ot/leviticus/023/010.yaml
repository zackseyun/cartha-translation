  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: tl
  text: '“Sabihin mo sa mga anak ni Israel at ipahayag mo sa kanila: ‘Kapag nakarating na kayo sa lupaing ibinibigay ko sa inyo at ginapas na ninyo ang ani nito, dalhin ninyo sa pari ang isang bigkis ng mga unang bunga ng inyong ani.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang omer ng mga unang bunga ng inyong ani.” Ang salitang Hebreo ay maaaring tumukoy rito sa isang bigkis ng inaning uhay at ginagamit din bilang teknikal na katawagang “omer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang hayagang Hebreong idyoma at ang anyong panlalaking maramihan; malinaw at pamilyar din ito sa marangal na wikang biblikal sa Tagalog.
- source_word: כִּי תָבֹאוּ
  choice: Kapag nakarating na kayo
  rationale: Ipinakikita ng כִּי rito ang kalagayan o panahong pagsisimulan ng utos. Likas sa Tagalog ang “kapag,” at ipinahihiwatig ng “nakarating na” ang pagpasok sa lupa.
- source_word: הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: sa lupaing ibinibigay ko sa inyo
  rationale: Ang “lupain” ay angkop sa heograpikal at tipanang konteksto; ang kasalukuyang anyong “ibinibigay” ay tumutugma sa Hebreong participle נֹתֵן.
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: at ginapas na ninyo ang ani nito
  rationale: Ang “gapasin” ay tiyak na pandiwang pang-ani at ang “ani nito” ay nagpapanatili sa pagtukoy ng hulapi sa lupain. Ang aspektong naganap na sa sugnay na may “kapag” ay natural sa Tagalog.
- source_word: וַהֲבֵאתֶם
  choice: dalhin ninyo
  rationale: Inihahayag bilang tuwirang utos ang hinihinging kilos na kasunod ng kondisyong sugnay, nang hindi kailangang dagdagan ng “kung gayon.”
- source_word: עֹמֶר
  choice: isang bigkis
  rationale: Sa kontekstong ito, tumutukoy ito sa nakabigkis na inaning uhay na dinadala sa pari. Mas malinaw sa karaniwang mambabasa ang “bigkis” kaysa transliterasyong “omer,” habang pinananatili sa talababa ang teknikal na alternatibo.
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: mula sa unang ani ninyo
  rationale: Ipinahahayag ang unang bahagi ng ani na inihaharap sa ritwal. Ang “unang ani” ay natural at hindi nagpapasok ng higit na interpretasyon kaysa nasa Hebreo.
- source_word: הַכֹּהֵן
  choice: pari
  rationale: Karaniwan at malinaw na salin ng כֹּהֵן sa kontekstong panritwal.
theological_decisions:
- issue: Kasariang nakasaad sa tipanang pagtawag
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Hayagang panlalaking maramihan ang Hebreo at isang nakagawiang tipanang pagtawag. Pinananatili ng pangunahing teksto ang anyo nang hindi ipinapalagay na ang saklaw ng kautusan ay sa mga lalaki lamang.
- issue: Kahulugan ng panritwal na עֹמֶר
  choice: isang bigkis
  alternative: isang omer
  rationale: Ang agarang konteksto ay isang bagay mula sa ani na dinadala sa pari, kaya mas malamang dito ang konkretong kahulugang “bigkis.” Gayunman, maaari ring panatilihin ang salita bilang teknikal na katawagang “omer,” kaya itinatala ito sa talababa.
- issue: רֵאשִׁית bilang unang bahagi ng ani
  choice: unang ani
  alternative: mga unang bunga; unang bahagi ng ani
  rationale: Pinananatili ang temporal at panritwal na diwa nang hindi nilulutas nang labis kung ito ay kabuuang unang napitas o isang unang bahagi mula sa ani.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga anak ni Israel” upang ilantad ang Hebreong anyo, “gapasin” para sa tiyak na gawaing pag-aani, at “pari” bilang karaniwang katawagang panritwal. Inilagay ang talababa sa mismong pariralang pinaglilinaw nito.
