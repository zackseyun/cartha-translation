  to: '“Sabihin mo sa mga anak ni Israel at ipahayag mo sa kanila: ‘Kapag nakarating na kayo sa lupaing ibinibigay ko sa inyo at ginapas na ninyo ang ani nito, dalhin ninyo sa pari ang isang bigkis ng mga unang bunga ng inyong ani.[a]’”'
