id: LEV.23.38
reference: Leviticus 23:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/לְּ/בַ֖ד שַׁבְּתֹ֣ת יְּהוָ֑ה וּ/מִ/לְּ/בַ֣ד מַתְּנֽוֹתֵי/כֶ֗ם וּ/מִ/לְּ/בַ֤ד כָּל נִדְרֵי/כֶם֙ וּ/מִ/לְּ/בַד֙ כָּל נִדְב֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר תִּתְּנ֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: tl
  text: bukod sa mga Sabbath ni Yahweh[a], bukod sa inyong mga kaloob, bukod sa lahat ng inyong mga panata, at bukod sa lahat ng inyong mga kusang-loob na handog[b] na ibinibigay ninyo kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bukod sa” sa bawat pag-uulit ay maaari ring unawain na “hiwalay sa” o “karagdagan sa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga handog na boluntaryo” o “mga kusang-loob na kaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: bukod sa
  rationale: Likas at maikli sa Tagalog, at napapanatili ang paulit-ulit na ayos ng Hebreo. Maaari itong mangahulugang hiwalay sa o karagdagan sa ayon sa kaugnayan.
- source_word: שַׁבְּתֹת יְהוָה
  choice: mga Sabbath ni Yahweh
  rationale: Pinananatili ang maramihang anyo at ang tuwirang ugnayan ng mga Sabbath sa pangalang Yahweh.
- source_word: מַתְּנוֹתֵיכֶם
  choice: inyong mga kaloob
  rationale: Malawak at natural na salin para sa mga bagay na ibinibigay sa Diyos nang hindi dinaragdagan ang espesipikong kahulugan ng salita.
- source_word: כָּל נִדְרֵיכֶם
  choice: lahat ng inyong mga panata
  rationale: Pinananatili ang karaniwang kahulugan ng נֶדֶר bilang panata, pati ang posibleng pagtukoy sa ipinangako sa Diyos, nang hindi tahasang nagdaragdag ng salitang handog.
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: lahat ng inyong mga kusang-loob na handog
  rationale: Sa konteksto ng paghahandog, malinaw na ipinahahayag nito ang mga handog na hindi sapilitan kundi kusang ibinibigay.
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: na ibinibigay ninyo kay Yahweh
  rationale: Natural na Tagalog para sa נתן at inilalagay sa hulihan gaya ng Hebreo, kaya maaari pa ring unawain na tumutukoy sa magkakaugnay na mga bagay sa talaan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ang pangalang Yahweh upang katawanin nang tuwiran ang Tetragrammaton at hindi ito palitan ng isang titulo.
- issue: Saklaw ng panghuling sugnay na אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: Inilagay ang sugnay sa dulo upang maaari itong tumukoy sa magkakaugnay na mga kaloob, panata, at kusang-loob na handog
  alternative: Ituring itong tumutukoy lamang sa kusang-loob na mga handog
  rationale: Hindi tahasang nilulutas ng ayos ng Hebreo ang saklaw; pinananatili ng salin ang likas na posibilidad na saklawin nito ang buong magkakaugnay na talaan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anaporikong pag-uulit ng “bukod sa” upang masundan ang diin at estruktura ng Hebreo; ginamit ang “Sabbath” bilang pamilyar na katawagan sa banal na araw ng pamamahinga.
