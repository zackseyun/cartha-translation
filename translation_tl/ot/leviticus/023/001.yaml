base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive na anyo ng דבר ay nagsasalaysay ng kasunod na pangyayari at nagpapakilala ng banal na pahayag. Ang “nagsalita” ay likas at marangal na katumbas sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong kinausap; “kay” ang natural na panandang Tagalog bago sa pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalang biblikal sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapahiwatig na susunod ang nilalaman ng pahayag, bagaman mas pormulaiko ito kaysa karaniwang pananalita sa Tagalog.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa teksto ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na palitan ito ng isang titulo, habang ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormula ng pagpapakilala sa pahayag at ang kuwit sa hulihan dahil nagpapatuloy ang sinabi sa susunod na talata.
