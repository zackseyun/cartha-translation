  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: tl
  text: '“Magsalita ka sa mga anak ni Israel at sabihin mo sa kanila: Ang mga itinakdang panahon ni Yahweh[a], na ipahahayag ninyo bilang mga banal na pagtitipon[b]—ang mga ito ang aking mga itinakdang panahon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga itinakdang panahon” ay maaari ring isaling “mga takdang kapistahan.” Tumutukoy ang salitang Hebreo sa mga sagradong pagkakataong itinakda, hindi lamang sa mga pistang may handaan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “mga sagradong kapulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Tuwirang pautos na angkop sa pormal na konteksto ng kautusan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at nakaugaliang katawagang pangtipan, na tumutukoy sa sambayanan ng Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Likas na Filipino para sa magkakasunod na utos na ‘magsalita’ at ‘sabihin.’
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: mga itinakdang panahon / aking mga itinakdang panahon
  rationale: Sinasaklaw ng מוֹעֵד ang mga takdang sagradong pagkakataon, pati ang Sabbath sa kasunod na talata, kaya hindi ito nilimitahan sa mga pista.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: na ipahahayag ninyo
  rationale: Sa kontekstong pampubliko at panrelihiyon, ang קרא ay nangangahulugang iproklama o ipahayag.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: mga banal na pagtitipon
  rationale: Natural at malinaw na Filipino na nagpapahayag ng sagradong pagtitipong ipinatawag.
- source_word: אֵלֶּה הֵם
  choice: ang mga ito ang
  rationale: Ipinapakita ang mariing pagkakakilanlan sa Hebreo nang hindi nagiging asiwa sa Filipino.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Inililipat ang pangalang pantangi ng Diyos at iniiwasang palitan ito ng titulo o pumili ng denominasyonal na anyo.
- issue: Saklaw ng מוֹעֲדֵי
  choice: mga itinakdang panahon
  alternative: mga pista / mga kapistahan
  rationale: Hindi nililimitahan ang salita sa mga kapistahan sapagkat kabilang sa konteksto ang Sabbath; pinananatili ang mas malawak na saklaw ng Hebreo.
- issue: Katawagan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang tradisyonal na pormulang pangtipan at ang malinaw na ugnayan kay Israel, habang korporatibo ang tinutukoy.
translation_notes:
  register: Modernong Filipino na pormal at marangal ngunit madaling maunawaan. Ginamit ang ‘pagtitipon’ sa halip na mas teknikal na ‘kombokasyon.’ Ang ayos ng pangungusap ay malapit sa Hebreo, at pinanatili ang pag-uulit ng ‘mga itinakdang panahon.’
