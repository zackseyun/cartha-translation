  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: tl
  text: Sa mismong araw na iyon, magpapahayag kayo ng isang banal na pagtitipon[a] para sa inyo. Huwag kayong gumawa ng anumang karaniwang gawain[b]. Ito ay magiging isang tuntuning panghabang panahon[c] sa lahat ng inyong tirahan, sa sali’t salinlahi ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang sagradong kapulungan” o “isang banal na kapulungan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anumang gawaing paggawa o paglilingkod”; ibig sabihin, karaniwang gawaing pang-araw-araw.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “palagiang tuntunin” o “walang-hanggang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: magpapahayag kayo
  rationale: Sa kontekstong pangkapistahan, ang קרא ay tumutukoy sa pormal at hayagang pagdedeklara o pagtawag ng isang pagtitipon, kaya ang “magpapahayag” ay angkop at natural.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa mismong araw na iyon
  rationale: Pinatitindi ng עֶצֶם ang pagtukoy sa tiyak na araw; pinananatili ng “mismong” ang diin nang natural sa modernong Filipino.
- source_word: מִקְרָא קֹדֶשׁ
  choice: isang banal na pagtitipon
  rationale: Ito ay nakapirming katawagang pangkulto para sa isang pormal na ipinatawag na sagradong kapulungan. Malinaw sa karaniwang mambabasa ang “banal na pagtitipon” nang hindi nawawala ang liturhikal na diwa.
- source_word: יִהְיֶה לָכֶם
  choice: para sa inyo
  rationale: Pinananatili nito ang lamed na nagpapakitang ang banal na pagtitipon ay itinatalaga para sa sambayanan, habang iniiwasan ang di-natural na pag-uulit ng pandiwang “magiging.”
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang gawain
  rationale: Ang pariralang legal ay tumutukoy sa karaniwan o pang-araw-araw na paggawa at paglilingkod, hindi sa lubos na pagbabawal sa bawat uri ng kilos. Ang salin ay malinaw at hindi nagpapalawak sa saklaw ng utos.
- source_word: לֹא תַעֲשׂוּ
  choice: huwag kayong gagawa
  rationale: Tuwiran at marangal na paraan ito ng pagpapahayag ng pagbabawal sa modernong Filipino.
- source_word: חֻקַּת עוֹלָם
  choice: palagiang tuntunin
  rationale: Sa pormulang legal, ang עוֹלָם ay nagpapahiwatig ng patuloy at namamalaging bisa. Ang “palagian” ay natural at pinananatili ang saklaw nang hindi awtomatikong ginagawa itong abstraktong metapisikal na pahayag.
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: sa lahat ng inyong tirahan
  rationale: 'Pinananatili nito ang distributibong diwa: umiiral ang tuntunin sa lahat ng lugar na tinitirhan ng sambayanan.'
- source_word: לְדֹרֹתֵיכֶם
  choice: sa sali’t salinlahi ninyo
  rationale: Natural na idyomang Filipino ito para sa patuloy na bisa sa magkakasunod na mga salinlahi.
theological_decisions:
- issue: Saklaw ng pagbabawal sa paggawa sa batas ng kapistahan
  choice: “anumang karaniwang gawain”
  alternative: “anumang gawain” o “anumang mabigat na gawain”
  rationale: Ang כָּל מְלֶאכֶת עֲבֹדָה ay karaniwang tumutukoy sa ordinaryo o gawaing paglilingkod, hindi kinakailangang sa bawat posibleng kilos. Iniiwasan nitong gawing mas mahigpit ang pagbabawal kaysa sa mismong Hebreo.
- issue: Tagal ng bisa ng חֻקַּת עוֹלָם
  choice: “palagiang tuntunin”
  alternative: “walang-hanggang tuntunin” o “panghabang-panahong tuntunin”
  rationale: Pinananatili ng “palagian” ang pangmatagalang puwersa ng pormulang legal, samantalang ipinakikita sa talababa ang lehitimong mas matinding pagbasa nang hindi nilulutas ang saklaw nito sa mismong salin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan, na may bahagyang pormal na himig na angkop sa tekstong legal at panliturhiya. Ginamit ang “pagtitipon” sa halip na mas teknikal na “kombokasyon,” at pinanatili ang mga pormulang “sa lahat ng inyong tirahan” at “sa sali’t salinlahi ninyo” upang maipahayag ang saklaw sa lugar at panahon.
