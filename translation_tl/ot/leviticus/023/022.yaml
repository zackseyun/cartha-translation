  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: tl
  text: Kapag inaani ninyo ang ani ng inyong lupain, huwag ninyong anihin nang lubusan ang gilid ng inyong bukid[a], at huwag ninyong pulutin ang mga nalaglag sa inyong pag-aani. Iwan ninyo ang mga iyon para sa dukha at sa dayuhang naninirahang kasama ninyo[b]. Ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sulok ng inyong bukid.” Ang salitang Hebreo ay maaaring tumukoy sa gilid, panig, o sulok.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa isang dayuhang naninirahan sa gitna ng Israel at nasa ilalim ng pangangalaga ng mga batas nito.
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: Kapag inaani ninyo ang ani ng inyong lupain
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahong pinangyayarihan. Ang 'Kapag inaani ninyo' ay likas sa Filipino at pinananatili ang maramihang kausap.
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ בְּקֻצְרֶךָ
  choice: huwag ninyong anihin nang lubusan ang gilid ng inyong bukid
  rationale: Ang Piel ng כלה ay nangangahulugang tapusin o ubusin. Ipinahahayag ng 'nang lubusan' ang pagbabawal na anihin hanggang sa pinakadulo; hindi na inulit ang temporal na parirala sapagkat malinaw na ito sa pambungad at magiging mabigat sa Filipino.
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: huwag ninyong pulutin ang mga nalaglag sa inyong pag-aani
  rationale: Ang לֶקֶט ay mga nalaglag o naiwan sa pag-aani na maaaring pulutin. Mas malinaw sa karaniwang mambabasa ang deskriptibong parirala kaysa sa teknikal o makalumang katawagan.
- source_word: לֶעָנִי
  choice: para sa dukha
  rationale: Ang עָנִי ay tumutukoy sa taong maralita o kapos. Dignified at tuwiran ang 'dukha' sa kontekstong legal at panlipunan.
- source_word: וְלַגֵּר
  choice: at sa dayuhang naninirahang kasama ninyo
  rationale: Ang גֵּר ay hindi basta bisita o estranghero kundi isang di-katutubong naninirahan sa pamayanan. Nililinaw ito ng salin nang hindi ipinapasok ang mga makabagong legal na kategorya ng imigrasyon.
- source_word: תַּעֲזֹב אֹתָם
  choice: Iwan ninyo ang mga iyon
  rationale: Ang עזב dito ay pag-iiwan ng ani upang mapakinabangan ng iba, hindi emosyonal na pagtalikod.
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ako si Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang 'Yahweh' at natural na ipinapahayag sa Filipino ang pormulang pagkakakilanlan.
theological_decisions:
- issue: Paglalarawan sa גֵּר sa batas ng Israel
  choice: dayuhang naninirahang kasama ninyo
  alternative: nakikipamayang dayuhan; dayuhang naninirahan
  rationale: Pinananatili ng salin na dayuhan siya ngunit nakatira sa loob ng pamayanan at saklaw ng pangangalagang panlipunan, nang hindi tinutumbasan sa isang tiyak na modernong katayuang legal.
- issue: Pagbigkas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; ang 'Yahweh' ay pinananatili bilang personal na pangalan sa pormulang pangtipan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang maramihang 'ninyo' ayon sa קְצִיר אַרְצְכֶם at אֱלֹהֵיכֶם, bagaman nagpapalit sa isahan ang ilang sugnay sa tekstong Hebreo bilang pangkalahatang pagtukoy sa bawat may-ari ng bukid. Iningatan ang legal na himig nang hindi ginagawang makaluma ang pananalita.
