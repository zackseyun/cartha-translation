  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: tl
  text: 'Sabihin mo sa mga anak ni Israel: ‘Sa ikapitong buwan, sa unang araw ng buwan, magkakaroon kayo ng taimtim na pamamahinga, isang pag-alaala ng malalakas na hudyat[a], at isang banal na pagtitipon.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pag-alaala ng mga sigaw” o “pag-alaala ng mga tunog ng sungay/trumpeta.” Ang salitang Hebreo ay tumutukoy nang mas malawak sa isang malakas na tunog o hudyat, kabilang ang sigaw at tunog ng sungay o trumpeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na pananalitang pampamilya na “mga anak ni Israel,” na tumutukoy bilang kabuuan sa sambayanan ng tipan.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: sa ikapitong buwan
  rationale: Tuwirang salin ng pariralang pangkalendaryo at natural sa modernong Tagalog.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: sa unang araw ng buwan
  rationale: Malinaw na ipinahahayag ang Hebreong idyoma na literal na “sa isa ng buwan,” na nangangahulugang unang araw nito.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo
  rationale: Natural na Tagalog na nagpapanatili sa hinaharap at sa diwang may itinakdang pagdiriwang para sa kanila.
- source_word: שַׁבָּתוֹן
  choice: taimtim na pamamahinga
  rationale: Ipinahihiwatig ang natatangi at banal na paghinto sa karaniwang gawain nang hindi basta ipinapantay ang termino sa karaniwang anyo ng “Sabbath.”
- source_word: זִכְרוֹן תְּרוּעָה
  choice: isang pag-alaalang may pagpapatunog ng tambuli
  rationale: Pinananatili ang ugnayan ng “pag-alaala” at ng malakas na hudyat na tunog; ang “tambuli” ay ang malamang na kahulugan sa kontekstong liturhikal, habang inilalahad sa talababa ang mas malawak na saklaw ng תְּרוּעָה.
- source_word: מִקְרָא קֹדֶשׁ
  choice: isang banal na pagtitipon
  rationale: Natural at marangal na salin para sa kapulungang tinawag at ibinukod bilang banal.
theological_decisions:
- issue: Uri ng tunog na tinutukoy ng תְּרוּעָה
  choice: pagpapatunog ng tambuli
  alternative: malakas na hudyat, sigaw, o malalakas na tunog
  rationale: Sa konteksto ng kapistahang pangkalendaryo, malamang ang hudyat na tunog ng tambuli o sungay. Gayunman, hindi tahasang binabanggit ng salitang Hebreo ang instrumento, kaya pinananatili sa talababa ang tunay na leksikal na lawak at kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong pangkautusan at panliturhiya. Ginamit ang “mga anak ni Israel” upang mapanatili ang anyong pampamilya ng Hebreo; ginamit naman ang “banal na pagtitipon” sa halip na mas teknikal na hiram na salita.
