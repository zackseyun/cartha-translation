revisions:
- from: Sa loob ng anim na araw ay maaaring gawin ang gawain, ngunit ang ikapitong araw ay Sabbath na lubos na pamamahinga[a], isang banal na pagtitipon. Huwag kayong gumawa ng anumang gawain; ito ay Sabbath para kay Yahweh sa lahat ng inyong tirahan[b].
  to: Sa anim na araw ay maaaring isagawa ang gawain, ngunit ang ikapitong araw ay isang Sabbath ng ganap na pamamahinga[a], isang banal na pagtitipon. Huwag kayong gumawa ng anumang gawain; ito ay Sabbath para kay Yahweh sa lahat ng inyong tirahan[b].
  rationale: Inayos ang pangunahing parirala para sa mas likas na modernong Filipino at upang malinaw na maipahayag ang pagpapatindi ng Hebreong ‘Sabbath ng Sabbath-rest.’ Pinahusay din ang unang sugnay nang hindi binabago ang pasibong pahintulot ng pinagmulan. Nanatiling nakalapat ang talababa a sa pariralang Sabbath-rest at talababa b sa ‘inyong tirahan.’
