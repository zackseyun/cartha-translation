base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: tl
  text: Sa anim na araw ay maaaring isagawa ang gawain, ngunit ang ikapitong araw ay isang Sabbath ng ganap na pamamahinga[a], isang banal na pagtitipon. Huwag kayong gumawa ng anumang gawain; ito ay Sabbath para kay Yahweh sa lahat ng inyong tirahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang Sabbath na pahinga” o “Sabbath ng taimtim na pamamahinga.” Pinatitindi ng pariralang Hebreo ang diwa ng pamamahinga sa Sabbath.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa lahat ng inyong pamayanan.” Ang salitang Hebreo ay maaaring tumukoy sa mga tirahan o sa mga pamayanang pinananahanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: ay maaaring gawin
  rationale: Pinananatili ang anyong pasibo ng pandiwang Hebreo at ang pahintulot o pangkalahatang tuntunin sa konteksto, sa halip na gawin itong tuwirang utos.
- source_word: מְלָאכָה
  choice: gawain
  rationale: Karaniwan at malinaw na katumbas para sa gawaing ipinagbabawal sa batas ng Sabbath; hindi ito nililimitahan sa pisikal na pagpapagal lamang.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabbath na lubos na pamamahinga
  rationale: Ipinahahayag ang pinatinding diwa ng ganap na pagtigil at pamamahinga habang pinananatili ang katawagang Sabbath.
- source_word: מִקְרָא קֹדֶשׁ
  choice: isang banal na pagtitipon
  rationale: Natural sa modernong Filipino at tumpak na tumutukoy sa sagradong pagtitipong itinakda o ipinatawag.
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gumawa ng anumang gawain
  rationale: Malinaw na ikalawang panauhang maramihang pagbabawal at natural na anyo ng legal na utos sa Filipino.
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: ito ay Sabbath para kay Yahweh
  rationale: Pinananatili ang ugnayang ipinahahayag ng pang-ukol ל, na ang Sabbath ay nakatalaga at nakatuon kay Yahweh, nang hindi ito ginagawang tahasang pahayag ng pagmamay-ari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulong “Panginoon.”
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: sa lahat ng inyong tirahan
  rationale: Maikli at tuwirang katumbas na nagpapanatili sa posibleng kahulugan ng mga lugar na tinitirhan; binabanggit sa talababa ang alternatibong diwa ng mga pamayanan.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ngunit ang ikapitong araw
  rationale: Ang “ngunit” ay natural na naghahayag ng kontrast sa pagitan ng anim na araw ng paggawa at ng ikapitong araw ng pamamahinga.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang inililipat ang Tetragrammaton bilang personal na pangalan at hindi ito pinapalitan ng isang titulo.
- issue: Lakas ng pariralang שַׁבַּת שַׁבָּתוֹן
  choice: Sabbath na lubos na pamamahinga
  alternative: Sabbath ng taimtim na pamamahinga
  rationale: Pinananatili ang pagpapatindi sa ganap na pagtigil sa gawain nang hindi nagdaragdag ng doktrinal na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Pinanatili ang “Sabbath” bilang natatanging katawagang biblikal, ginamit ang pangmaramihang “kayo,” at inilagay ang mga talababa sa mga pariralang talagang tinatalakay ng mga ito.
