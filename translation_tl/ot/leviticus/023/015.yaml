base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: tl
  text: Magbilang kayo para sa inyong mga sarili mula sa araw pagkatapos ng Sabbath, mula sa araw na dalhin ninyo ang bigkis ng handog na iwinawagayway; pitong ganap na Sabbath ang bibilangin ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pitong ganap na linggo.” Literal na sinasabi sa Hebreo, “pitong ganap na Sabbath.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: Magbilang kayo
  rationale: Ang anyong pandiwa sa kontekstong legal ay may puwersa ng utos. Natural sa makabagong Tagalog ang “Magbilang kayo” at malinaw nitong pinananatili ang direktibong diwa.
- source_word: לָכֶם
  choice: para sa inyong sarili
  rationale: Pinananatili nito ang personal o reflexive na diin ng datibong panghalip, sa halip na alisin ito sa salin.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: mula sa kinabukasan ng Sabbath
  rationale: Ang “kinabukasan” ay natural na Tagalog para sa araw na kasunod, at pinananatili ang teknikal na katawagang “Sabbath” sa halip na gawing pangkalahatang araw ng pahinga.
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: mula sa araw na dalhin ninyo
  rationale: Malinaw nitong ipinapakita ang araw na pinagsisimulan ng pagbibilang at maayos itong dumadaloy sa Tagalog.
- source_word: עֹמֶר
  choice: bigkis
  rationale: Sa kontekstong ito, tumutukoy ang salita sa bigkis ng ani na inihahandog, hindi lamang sa isang takal. Mas madaling maunawaan ng karaniwang mambabasa ang “bigkis” kaysa sa transliterasyong “omer.”
- source_word: הַתְּנוּפָה
  choice: handog na iwinawagayway
  rationale: Inilalarawan nito ang natatanging ritwal na pagkilos sa handog at hindi pinapawi ang kultikong detalye sa isang mas pangkalahatang “handog na inihaharap.”
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: pitong buong Sabbath
  rationale: Tahasang ginagamit ng Hebreo ang katawagan para sa Sabbath. Pinananatili ito sa pangunahing teksto upang huwag agad lutasin ang tunay na kalabuan kung ang tinutukoy ay mga Sabbath o mga linggo.
- source_word: תְּמִימֹת
  choice: buong
  rationale: Sa pagbibilang ng panahon, ang kahulugan ay ganap o kumpleto, hindi moral na kasakdalan. Maikli at natural ang “buong” sa pariralang ito.
- source_word: תִּהְיֶינָה
  choice: Dapat na may
  rationale: Ipinahahayag nito sa natural na Tagalog ang eksistensiyal na sugnay at ang normatibong puwersa ng tagubiling legal.
theological_decisions:
- issue: Kahulugan ng שַׁבָּת / שַׁבָּתוֹת sa tagubiling pangkalendaryo
  choice: Panatilihin ang “Sabbath” at “mga Sabbath” sa pangunahing teksto.
  alternative: Isalin bilang “linggo” o “mga linggo” upang tukuyin ang pitong-araw na mga yugto.
  rationale: Eksaktong katawagan para sa Sabbath ang nasa Hebreo. Dahil may matagal nang pagtatalo tungkol sa araw na pinagsisimulan ng bilang at sa kung ang maramihang anyo ay idyomatikong nangangahulugang “mga linggo,” pinananatili ng pangunahing teksto ang tensiyon ng pinagmulan at inilalagay sa talababa ang karaniwang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “Sabbath” bilang terminong panrelihiyon at ang “handog na iwinawagayway” bilang malinaw na paglalarawan sa ritwal. Ginamit ang gitling na em upang ipakitang ang ikalawang pariralang temporal ay nagpapaliwanag sa una.
