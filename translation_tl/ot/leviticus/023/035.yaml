  text: On the first day there shall be a holy convocation[b][a]; you shall do no laborious work.
translation:
  language: tl
  text: Sa unang araw ay magkakaroon ng banal na pagtitipon[a]. Huwag kayong gagawa ng anumang karaniwang gawain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na kapulungan.” Ang Hebreong pariralang מִקְרָא קֹדֶשׁ ay pormal na tawag sa isang ipinatawag na banal na pagtitipon.
    reason: lexical_alternative
  - marker: b
    text: O “gawaing panghanapbuhay” o “mabigat na gawain.” Tumutukoy ang parirala sa karaniwang trabahong kaugnay ng paglilingkod o hanapbuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Sa unang araw
  rationale: Ang בְּ na kasama ng יוֹם ay panandang pamanahon; natural itong isalin sa modernong Tagalog bilang “Sa unang araw.”
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Ang parirala ay pormal na terminong pangkulto para sa isang ipinatawag na banal na pagtitipon. Malinaw at marangal ang “banal na pagtitipon,” habang ipinapaliwanag sa talababa ang diwa ng pormal na pagpapatawag.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang gawain
  rationale: Tumutukoy ang parirala sa pangkaraniwan o hanapbuhay na trabaho na ipinagbabawal sa araw ng kapistahan, hindi sa lahat ng posibleng kilos. Iniiwasan nito ang lipas o mapanlinlang na diwa ng “gawaing alipin.”
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa
  rationale: Ang ikalawang panauhang maramihan na negatibong legal na utos ay natural na ipinahahayag sa Tagalog sa pamamagitan ng “Huwag kayong gagawa.”
