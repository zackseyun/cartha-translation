language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: tl
  text: Sa unang araw, kumuha kayo para sa inyong sarili ng bunga ng maringal na puno[a], mga sanga ng puno ng palma, mga sanga ng malalagong puno, at mga willow sa tabi ng batis. Magagalak kayo sa harap ni Yahweh na inyong Diyos sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “bunga ng citron” (etrog), ayon sa mas huling tradisyong Judio. Sa literal, sinasabi ng Hebreo, “bunga ng maringal/magandang puno.”
    reason: Pinananatili ang tunay na kalabuan ng pariralang Hebreo habang ipinapaalam ang tradisyonal na pagkakakilanlan.
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: kukuha kayo para sa inyong sarili
  rationale: Ipinahahayag ang bisa ng utos sa legal na konteksto at pinananatili ang לָכֶם, habang natural ang anyo sa modernong Tagalog.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: sa unang araw
  rationale: Tuwirang salin ng pariralang panahunan; hindi idinagdag ang 'ng kapistahan' dahil wala iyon sa mismong talata.
- source_word: פְּרִי עֵץ הָדָר
  choice: bunga ng mariringal na puno
  rationale: Ang הָדָר ay tumutukoy sa karilagan, kagandahan, o kamahalan. Pinananatili ng pangkalahatang salin ang di-tiyak na pagkakakilanlan ng halaman sa Hebreo.
- source_word: כַּפֹּת תְּמָרִים
  choice: mga sanga ng puno ng palma
  rationale: Malinaw at likas na tumutukoy sa mga sanga o dahon ng palma nang hindi gumagamit ng teknikal na katawagang botanikal.
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: mga sanga ng malalagong puno
  rationale: Ipinahahayag ng עָבֹת ang kapal o siksik na mga dahon; natural na naihahatid ito ng 'malalago' sa Tagalog.
- source_word: וְעַרְבֵי נָחַל
  choice: mga sanga ng willow sa tabi ng batis
  rationale: Ang עַרְבֵי ay mga willow o kahawig na punong tumutubo sa daluyan ng tubig, at ang נָחַל ay batis o pana-panahong daluyan. Idinagdag ang 'mga sanga' bilang likas na pagbasa sa serye ng mga kukuning halaman.
- source_word: וּשְׂמַחְתֶּם
  choice: magagalak kayo
  rationale: Tuwirang ipinapahayag ang pagdiriwang o pagkagalak bilang iniutos na kilos.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: sa harap ni Yahweh na inyong Diyos
  rationale: Ang לִפְנֵי ay 'sa harap' o 'sa presensya ng'; pinananatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Likas na Tagalog para sa tagal na tinutukoy ng Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng pinagmulang teksto ang Tetragrammaton bilang pangalan; ang 'Yahweh' ay tuwirang transliterasyong tumutugma sa ibinigay na patakaran at hindi ito ginagawang titulo.
- issue: Pagkilala sa פְּרִי עֵץ הָדָר
  choice: pangkalahatang 'bunga ng mariringal na puno'
  alternative: bunga ng citron o etrog
  rationale: Hindi tahasang tinutukoy ng Hebreo ang citron. Pinananatili sa pangunahing teksto ang mas malawak na kahulugan at inilalagay sa talababa ang tradisyonal na pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'palma' at 'willow' bilang pamilyar at tumpak na mga pangalan ng halaman; iniwasan ang sobrang teknikal o makalumang pananalita.
