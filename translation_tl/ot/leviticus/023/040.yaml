revisions:
- from: Sa unang araw, kukuha kayo para sa inyong sarili ng bunga ng mariringal na puno[a], mga sanga ng puno ng palma, mga sanga ng malalagong puno, at mga sanga ng willow sa tabi ng batis. Magagalak kayo sa harap ni Yahweh na inyong Diyos sa loob ng pitong araw.
  to: Sa unang araw, kumuha kayo para sa inyong sarili ng bunga ng maringal na puno[a], mga sanga ng puno ng palma, mga sanga ng malalagong puno, at mga willow sa tabi ng batis. Magagalak kayo sa harap ni Yahweh na inyong Diyos sa loob ng pitong araw.
