lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive na kasama ng דִּבֵּר ay nagpapakilala ng panibagong pangyayari ng pagsasalita; natural at marangal sa modernong Tagalog ang “Nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na banal na pangalang YHWH sa halip na palitan iyon ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong kinakausap; ang “kay Moises” ang likas na anyo sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormularyong Hebreo na naghahanda sa tuwirang pahayag sa kasunod na talata, bagaman maaari ring ipahiwatig lamang ito sa mas malayang Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormularyong wakas na “na sinasabi” upang katawanin ang לֵאמֹר at ang pagpapatuloy ng pangungusap sa kasunod na talata.
