base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: tl
  text: Iwawagayway ng pari ang mga iyon kasama ng tinapay ng mga unang bunga bilang handog na iwinawagayway sa harap ni Yahweh, kasama ng dalawang batang tupa.[a] Ang mga iyon ay magiging banal kay Yahweh at para sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang dalawang pariralang may “kasama ng” bilang “sa ibabaw ng tinapay ng mga unang bunga” at “sa ibabaw ng dalawang batang tupa.” Maaaring magkaroon ng literal na kahulugang spatial ang pang-ukol na Hebreo, ngunit dito ay malamang na tumutukoy ito sa magkakasamang ritwal na paghaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: Iwawagayway
  rationale: Ang Hiphil ng נוּף sa konteksto ng paghahandog ay tumutukoy sa ritwal na pagwagayway o paghaharap ng handog. Pinananatili ng “iwawagayway” ang kongkretong kilos at ang kaugnayan nito sa terminong תְּנוּפָה.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Hindi tahasang pinapangalanan ng panghalip ang tinutukoy nito. Pinananatili ng “ang mga iyon” ang anaporikong sanggunian at hindi labis na nililinaw ang tunay na kalabuan ng Hebreo.
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: kasama ng tinapay mula sa mga unang bunga
  rationale: Maaaring spatial na “sa ibabaw ng” ang עַל, ngunit sa ritwal na kontekstong ito ay malamang na nagpapahayag ito ng magkasamang paghaharap. Ang “mula sa mga unang bunga” ay natural na Filipino para sa ugnayang genitibo ng tinapay at ng unang bunga.
- source_word: תְּנוּפָה
  choice: bilang handog na iwinawagayway
  rationale: Teknikal itong katawagan sa handog na ritwal na iwinawagayway o inihaharap sa harap ni Yahweh. Ang parirala ay malinaw sa karaniwang mambabasa at nananatiling konektado sa pandiwang “iwawagayway.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat itong salin ng idyomang tumutukoy sa ritwal na ginagawa sa presensiya ng Diyos, habang pinananatili ang personal na pangalang Yahweh.
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: kasama ng dalawang batang tupa
  rationale: Gaya ng unang עַל, ang “kasama ng” ay nagpapahayag ng magkakaugnay na ritwal na paghaharap nang hindi ipinapalagay na literal na inilagay ang isang bagay sa ibabaw ng mga tupa.
- source_word: קֹדֶשׁ יִהְיוּ
  choice: Magiging banal ang mga iyon
  rationale: Pinananatili nito ang predikatibong pahayag tungkol sa banal na katayuan ng mga inihandog, sa halip na palitan iyon ng mas interpretatibong “itatalaga.”
- source_word: לַיהוָה לַכֹּהֵן
  choice: kay Yahweh at para sa pari
  rationale: 'Pinananatili ang dalawang magkasunod na pariralang may ל: ang banal na pag-aari o pagtatalaga kay Yahweh at ang bahagi o karapatan ng pari.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” alinsunod sa tahasang anyo nito sa tekstong Hebreo.
theological_decisions:
- issue: Ang ugnayan ng pagiging banal kay Yahweh at pagiging para sa pari
  choice: “banal ... kay Yahweh at para sa pari”
  alternative: “itinalaga kay Yahweh ngunit mapupunta sa pari”
  rationale: 'Hindi tahasang ipinaliliwanag ng Hebreo ang mekanismo ng pag-aari o paggamit. Pinananatili ng salin ang maikli at may tensiyong pormulasyon: banal kay Yahweh, ngunit para sa pari.'
- issue: Pagbigkas sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa pinagmulang teksto; kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang teknikal na imahen ng pagwagayway, ngunit ipinaliwanag ito bilang uri ng handog. Ang “mga iyon” ay sadyang hindi mas tiyak upang mapanatili ang anaporikong kalabuan ng Hebreo.
