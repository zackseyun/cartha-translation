  to: Iwawagayway ng pari ang mga iyon kasama ng tinapay ng mga unang bunga bilang handog na iwinawagayway sa harap ni Yahweh, kasama ng dalawang batang tupa.[a] Ang mga iyon ay magiging banal kay Yahweh at para sa pari.
