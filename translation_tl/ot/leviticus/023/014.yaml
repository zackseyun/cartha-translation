base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: tl
  text: Huwag kayong kumain ng tinapay, inihaw na butil[a], o sariwang butil[b] hanggang sa araw na ito mismo, hanggang sa madala ninyo ang handog para sa inyong Diyos. Ito ay isang tuntuning panghabang-panahon[c] sa lahat ng salinlahi ninyo, saanman kayo naninirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “butil na tinusta.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bagong butil.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “palagiang tuntunin” o “walang-hanggang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: tinapay
  rationale: Ang pangunahing kahulugan ay tinapay o pagkaing yari sa inihurnong butil. Sa talaang ito ng iba't ibang anyo ng butil, mas angkop ang tiyak na “tinapay” kaysa sa pangkalahatang “pagkain.”
- source_word: קָלִי
  choice: inihaw na butil
  rationale: Tumutukoy ito sa butil na inihaw o pinatuyo sa init. Likas at madaling maunawaan sa modernong Filipino ang “inihaw na butil,” habang pinananatili ang tiyak na kontekstong agrikultural.
- source_word: כַרְמֶל
  choice: sariwang butil
  rationale: Sa pagkakatabi nito sa tinapay at inihaw na butil, tumutukoy ito sa sariwa o bagong hinog na butil, hindi sa pangalang-pook na Carmel.
- source_word: לֹא תֹאכְלוּ
  choice: Huwag kayong kakain
  rationale: Ang negatibong imperfect sa tekstong legal ay isang tuwirang pagbabawal. Ang anyong ito ay natural sa Filipino at may sapat na bigat para sa batas.
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: hanggang sa mismong araw na ito
  rationale: Binibigyang-diin ng עֶצֶם ang eksaktong araw; malinaw na naihahayag iyon ng “mismong araw na ito.”
- source_word: עַד הֲבִיאֲכֶם
  choice: hanggang sa maihandog ninyo
  rationale: Itinatakda ng parirala ang pagdadala o paghahandog bilang kinakailangang mangyari bago maaaring kainin ang ani. Ang “maihandog ninyo” ay natural sa konteksto ng handog sa Diyos.
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: ang handog sa inyong Diyos
  rationale: Ang קָרְבָּן ay pangkalahatang tawag sa handog na inilalapit sa Diyos. Hindi tinutukoy ng salin ang isang mas tiyak na uri ng hain kaysa sa sinasabi ng Hebreo.
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning panghabang-panahon
  rationale: Pinananatili nito ang diwa ng patuloy at matibay na bisa ng kautusan nang hindi gumagamit ng lipas o labis na teknikal na pananalita.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Ipinahahayag nito ang pagpapatuloy ng tuntunin sa magkakasunod na salinlahi.
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: saanman kayo naninirahan
  rationale: Malinaw at likas nitong sinasabi na saklaw ang lahat ng lugar na tinitirhan ng bayan.
theological_decisions:
- issue: Saklaw at bisa ng חֻקַּת עוֹלָם sa Kautusan ni Moises
  choice: Isinalin bilang “isang tuntuning panghabang-panahon” upang panatilihin ang matibay at nagpapatuloy na bisa ng parirala sa legal at tipanang konteksto ng Levitico.
  alternative: “isang palagiang tuntunin” o “isang walang-hanggang tuntunin”
  rationale: Hindi nilulutas ng salin ang mas malawak na teolohikal na pagtatalo tungkol sa aplikasyon ng seremonyal na kautusan sa labas ng orihinal nitong tipanang konteksto.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal ang ginamit. Pinanatili ang legal na himig sa “Huwag kayong kakain” at “tuntuning panghabang-panahon,” samantalang ginawang likas ang pangwakas na lokatibong parirala bilang “saanman kayo naninirahan.”
