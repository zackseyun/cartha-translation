- from: Huwag kayong kakain ng tinapay, inihaw na butil[a], o sariwang butil[b] hanggang sa mismong araw na ito—hanggang sa maihandog ninyo ang handog sa inyong Diyos. Ito ay isang tuntuning panghabang-panahon[c] sa lahat ng salinlahi ninyo, saanman kayo naninirahan.
  to: Huwag kayong kumain ng tinapay, inihaw na butil[a], o sariwang butil[b] hanggang sa araw na ito mismo, hanggang sa madala ninyo ang handog para sa inyong Diyos. Ito ay isang tuntuning panghabang-panahon[c] sa lahat ng salinlahi ninyo, saanman kayo naninirahan.
  rationale: Inayos ang pandiwa ng pagbabawal para sa likas na modernong Filipino, ibinalik ang diin ng הֲבִיאֲכֶם sa pagdadala ng handog sa halip na sa seremonyang paghahandog mismo, at pinatumpak ang leksikal na talababa para sa קָלִי. Pinanatili ang pag-uulit ng temporal na “hanggang” at ang hindi pinasusubukang lutasin na saklaw ng “tuntuning panghabang-panahon.”
