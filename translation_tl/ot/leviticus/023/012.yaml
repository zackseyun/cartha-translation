base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: tl
  text: Sa araw na iwagayway ninyo ang bigkis[a], maghahandog kayo kay Yahweh ng isang lalaking kordero na walang kapintasan, isang taóng gulang, bilang handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “omer.” Dito, malamang na tumutukoy ang salita sa bigkis na inihaharap sa ritwal, hindi lamang sa isang takal ng tuyong sangkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: maghahandog kayo
  rationale: Bagaman karaniwang nangangahulugang “gawin” ang עשה, sa konteksto ng paghahandog ay tumutukoy ito sa pag-aalay ng handog; natural at tiyak dito ang “maghahandog.”
- source_word: בְּיוֹם
  choice: Sa araw na
  rationale: Likas na panandang temporal sa Filipino at malinaw na iniuugnay ang paghahandog sa araw ng ritwal na pagwawagayway.
- source_word: הֲנִיפְכֶם
  choice: iwagayway ninyo
  rationale: Pinananatili ang tiyak na ritwal na kilos ng Hiphil ng נוף nang hindi ito ipinapaliwanag nang labis.
- source_word: הָעֹמֶר
  choice: ang bigkis
  rationale: Sa konteksto ng pag-aani at ritwal, malamang na tumutukoy ito sa bigkis ng inaning uhay, hindi lamang sa isang takal; inilalahad sa talababa ang leksikal na alternatibo.
- source_word: כֶּבֶשׂ
  choice: isang lalaking kordero
  rationale: Ipinahahayag ang uri ng hayop at ang kasariang ipinahihiwatig ng pangngalang Hebreo sa gamit na pansakripisyo.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, nangangahulugan itong walang pisikal na depekto at hindi basta “ganap.”
- source_word: בֶּן שְׁנָתוֹ
  choice: isang taóng gulang
  rationale: Natural na salin ng Hebreong idyoma tungkol sa edad ng hayop.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Pinananatili ang teknikal na uri ng handog, ang עֹלָה, sa malinaw na makabagong Filipino.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinapakita ng “kay” na ang handog ay iniaalay sa Diyos, at pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng עֹלָה
  choice: handog na sinusunog
  alternative: handog na susunugin nang buo
  rationale: Ang termino ay isang tiyak na uri ng handog. Hindi idinagdag sa pangunahing teksto ang “nang buo,” upang hindi ipasok dito ang paliwanag na higit sa mismong maikling katawagan ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iwagayway” upang mapanatili ang ritwal na kilos, “bigkis” para sa konkretong bagay na inihahandog, at “kordero” bilang pamilyar na katawagang biblikal na nauunawaan pa rin ng karaniwang mambabasa.
