lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagbubukas ng bagong pangyayari ng pagsasalita; natural at marangal sa Tagalog ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ang nagmamarka sa pinatutungkulan ng pagsasalita, at “kay Moises” ang likas na anyo sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa nilalaman ng susunod na pahayag, bagaman maaari ring isalin na “ganito.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng titulo.
translation_notes:
  register: Makabagong Filipino na may marangal at pormulang himig. Pinanatili ang inuulit na pormula ng Hebreo (“nagsalita… na sinasabi”) upang hindi mawala ang anyo ng pambungad sa pahayag.
