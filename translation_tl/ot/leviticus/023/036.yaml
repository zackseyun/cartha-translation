  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: tl
  text: Sa loob ng pitong araw, maghahandog kayo kay Yahweh ng handog na inihahain sa apoy.[a] Sa ikawalong araw, magkakaroon kayo ng banal na pagtitipon, at maghahandog kayo kay Yahweh ng handog na inihahain sa apoy. Ito ay isang taimtim na kapulungan; huwag kayong gagawa ng anumang karaniwang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog sa pamamagitan ng apoy.” Ang Hebreong אִשֶּׁה ay karaniwang katawagang pansakripisyo para sa handog na inihahain sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Ang Hiphil ng קרב ay may kultikong diwang magharap o mag-alay ng handog. Likas at malinaw sa Filipino ang “maghahandog,” at naipapahiwatig na rin nito ang paglapit ng handog sa dambana.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Karaniwang terminong pansakripisyo ito para sa handog na inihahain sa pamamagitan ng apoy. Mas malinaw ito kaysa “handog na pagkain” sa Filipino at hindi nito nililimitahan ang katawagan sa isang uri lamang ng materyal na handog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pinag-uukulan ng handog; likas sa Filipino ang “kay.” Pinananatili ang pangalang tipan na Yahweh para sa יהוה.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Tumutukoy ang parirala sa isang sagrado at opisyal na ipinatawag na pagtitipon. Natural at marangal sa modernong Filipino ang “banal na pagtitipon.”
- source_word: עֲצֶרֶת
  choice: natatanging kapulungan
  rationale: Tumutukoy ito sa natakdang kapulungang pangkapistahan, malamang na pangwakas at may diwa ng pagpigil sa karaniwang gawain. Hindi idinaragdag sa pangunahing teksto ang “pangwakas” o “marangal” sapagkat hindi ganap na tiyak ang eksaktong diin ng salita.
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang gawain
  rationale: Sa mga batas tungkol sa kapistahan, ipinagbabawal ng parirala ang regular o panghanapbuhay na paggawa, hindi kinakailangang ang lahat ng kilos. Malinaw na naihahayag ito ng “karaniwang gawain.”
- source_word: שִׁבְעַת יָמִים
  choice: Sa loob ng pitong araw
  rationale: Likas na ipinapahayag nito sa Filipino ang tagal ng iniutos na paghahandog.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Sa ikawalong araw
  rationale: Tuwirang temporal na salin na natural sa Filipino.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo
  rationale: Likas na Filipino para sa eksistensiyal na היה + ל, habang pinananatili ang itinakdang katangian ng pagtitipon.
theological_decisions:
- issue: Paglalarawan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Diwa ng עֲצֶרֶת
  choice: natatanging kapulungan
  alternative: marangal na kapulungan / pangwakas na kapulungan
  rationale: May kaugnayan ang salita sa isang espesyal na kapulungang may pagpigil o pagtigil, at sa kontekstong ito ay pangwakas sa pagdiriwang. Pinipili ang mas hindi mapagpasiyang “natatanging kapulungan” upang mapanatili ang leksikal na lawak at maiwasang gawing tiyak ang isang pinagtatalunang himig.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagtitipon” para sa מִקְרָא at “kapulungan” para sa עֲצֶרֶת upang maipakita ang magkaibang katawagan sa Hebreo. Iniwasan ang sobrang teknikal o makalumang pananalita.
