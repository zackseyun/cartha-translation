  to: Sa loob ng pitong araw, maghahandog kayo kay Yahweh ng handog na inihahain sa apoy.[a] Sa ikawalong araw, magkakaroon kayo ng banal na pagtitipon, at maghahandog kayo kay Yahweh ng handog na inihahain sa apoy. Ito ay isang taimtim na kapulungan; huwag kayong gagawa ng anumang karaniwang gawain.
  rationale: Binago ang paglalarawan ng אִשֶּׁה sa teksto at footnote upang maiwasan ang maling pagpapahiwatig na ito ang teknikal na “handog na sinusunog.” Pinalitan ang “natatanging kapulungan” ng “taimtim na kapulungan” upang mas maipakita ang gamit ng עֲצֶרֶת bilang solemn assembly, nang hindi itinatakda ang pinagtatalunang diwang “pangwakas.”
