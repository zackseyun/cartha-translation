  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: tl
  text: Bibilang kayo ng limampung araw[a], hanggang sa araw pagkatapos ng ikapitong Sabbath; pagkatapos, maghahandog kayo kay Yahweh ng isang bagong handog na butil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “hanggang sa araw pagkatapos ng ikapitong linggo.” Sa Hebreo: “ang araw pagkatapos ng ikapitong Sabbath.” Magkakaiba ang pagkaunawa ng mga tagapagpaliwanag sa paraan ng pagpapahayag dito ng bilang ayon sa kalendaryo.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: hanggang sa araw pagkatapos ng
  rationale: Natural na Tagalog para sa hangganan ng panahon ng pagbibilang at sa Hebreong pariralang tumutukoy sa kasunod na araw.
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: ikapitong Sabbath
  rationale: Pinananatili ang tahasang salitang שׁבת at hindi ito tahimik na binabago tungo sa interpretatibong 'ikapitong linggo.'
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: Bibilang kayo ng limampung araw
  rationale: Ang aspektong di-ganap na pandiwa sa tagubiling legal ay natural na naipapahayag sa hinaharap na anyo sa Tagalog.
- source_word: וְהִקְרַבְתֶּם
  choice: pagkatapos, maghahandog kayo
  rationale: Sa kontekstong panghandog, ipinahahayag nito ang pagdadala o paghahandog; nililinaw ng 'pagkatapos' ang pagkakasunod-sunod.
- source_word: מִנְחָה חֲדָשָׁה
  choice: isang bagong handog na butil
  rationale: Sa terminolohiyang Levitico, ang מִנְחָה ay handog na mula sa butil; pinananatili ng 'bagong' ang tuwirang kahulugan ng pang-uri.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang pang-ukol na 'kay' para sa personal na pangalan at pinananatili ang pangalang tipan na Yahweh.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Tuwirang tinutumbasan ng 'Yahweh' ang personal na pangalang nasa tekstong Hebreo nang hindi ito pinapalitan ng isang titulo.
- issue: Kung gagawing interpretatibong 'ikapitong linggo' ang 'ikapitong Sabbath'
  choice: ikapitong Sabbath
  alternative: ikapitong linggo
  rationale: שׁבת ang mismong salita sa Hebreo, hindi ang karaniwang salita para sa 'linggo'; pinananatili nito ang tunay na usaping pangkalendaryo sa halip na lutasin iyon sa salin.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Pinanatili ang 'Sabbath' bilang pamilyar na terminong biblikal at ang 'Yahweh' bilang personal na pangalan; iniwasan ang labis na teknikal o makalumang pananalita.
