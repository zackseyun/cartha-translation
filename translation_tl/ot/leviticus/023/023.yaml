base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/023.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kay Moises[a], at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring anyuhing “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive na pandiwa mula sa דבר ay nagpapakilala ng panibagong pangyayari ng pagsasalita; ang “nagsalita” ay likas at pormal na katumbas sa pormulang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahihiwatig ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo sa Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang modernong Tagalog na anyo ng pangalang Hebreo na מֹשֶׁה.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa nilalaman ng pagsasalita sa kasunod na talata, bagaman maaari ring unawain bilang “ganito.”
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay isang karaniwang transliterasyon na nagpapanatili rito bilang personal na pangalan, habang kinikilala sa talababa ang alternatibong “Jehovah.”
translation_notes:
  register: Modernong Filipino Tagalog na simple at marangal. Pinanatili ang pormulang panimulang pangungusap at ang kuwit dahil nagpapatuloy ang mismong sinabi ni Yahweh sa kasunod na talata.
