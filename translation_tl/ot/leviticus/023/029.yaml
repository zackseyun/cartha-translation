  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: tl
  text: Sapagkat ang sinumang hindi magpapakumbaba sa mismong araw na ito ay puputulin mula sa kanyang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi magpapahirap sa sarili” o “hindi magkakait sa sarili.” Ang idyomang Hebreo ay tumutukoy sa pagpapakumbaba at pagkakait sa sarili, na tradisyonal na kaugnay ng pag-aayuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagbibigay ito ng dahilan o paliwanag sa naunang utos at natural sa daloy ng legal na pahayag.
- source_word: כָל הַנֶּפֶשׁ
  choice: ang sinuman
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa isang tao, hindi sa kaluluwa bilang hiwalay na teknikal na konsepto; malinaw at likas sa Filipino ang “ang sinuman.”
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: hindi magpapakumbaba
  rationale: Sa konteksto ng Araw ng Pagtubos, ang anyo ng ענה ay tumutukoy sa pagpapakumbaba o pagkakait sa sarili, na tradisyonal na kaugnay ng pag-aayuno. Pinananatili sa talababa ang mas literal na alternatibo.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa mismong araw na ito
  rationale: Ipinahahayag ng עֶצֶם ang diin sa tiyak na araw; natural na katumbas nito sa Filipino ang “mismong araw na ito.”
- source_word: וְנִכְרְתָה
  choice: ay ititiwalag
  rationale: Ipinapanatili nito ang bigat ng legal na parusa at ang ideya ng pagkaputol mula sa sambayanan, nang hindi tinutukoy kung ito ay kamatayan, pagpapatapon, o tuwirang hatol ng Diyos.
- source_word: מֵעַמֶּיהָ
  choice: sa kanyang bayan
  rationale: Ang hulapi ay pambabae dahil umaayon sa gramatikal na kasarian ng נֶפֶשׁ, ngunit panlahat ang tinutukoy; ang “kanyang” ay likas at walang tinutukoy na kasarian.
theological_decisions:
- issue: Kahulugan ng utos na ענה sa Araw ng Pagtubos
  choice: magpapakumbaba
  alternative: papahirapan ang sarili; magkakait sa sarili
  rationale: Ipinahahayag ng pangunahing salin ang mapagpakumbaba at nagsisising tindig, samantalang inilalahad ng talababa ang literal at praktikal na lawak ng idyoma nang hindi ito nililimitahan sa pisikal na paghihirap lamang.
- issue: Kalikasan ng parusang וְנִכְרְתָה
  choice: ititiwalag sa kanyang bayan
  alternative: puputulin mula sa kanyang bayan; aalisin sa kanyang bayan
  rationale: Hindi tinutukoy ng Hebreo rito ang eksaktong paraan ng parusa. Ang salin ay nagpapanatili sa legal at teolohikal na bigat nito nang hindi nagpapasya kung ito ay kamatayan, pagpapatapon, o tuwirang hatol ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ititiwalag” bilang natural na legal na pahayag, ngunit hindi tinukoy ang eksaktong mekanismo ng parusa. Ang panandang [a] ay nasa pangunahing teksto at tumutugma sa talababa.
