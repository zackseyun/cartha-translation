revisions:
- from: Sapagkat ang sinumang hindi magpapakumbaba sa mismong araw na ito ay ititiwalag sa kanyang bayan.[a]
  to: Sapagkat ang sinumang hindi magpapakumbaba sa mismong araw na ito ay puputulin mula sa kanyang bayan.[a]
  rationale: Pinalitan ang “ititiwalag” ng “puputulin mula sa kanyang bayan” upang maipreserba ang sadyang hindi tinutukoy na kalikasan ng parusang Hebreo. Inayos ang balang ng talababa upang malinaw na ang kilos ay ginagawa ng tao sa sarili niya.
