revisions:
- from: Kasama ng mga tinapay, maghahandog kayo ng pitong lalaking korderong tig-iisang taóng gulang at walang kapintasan, isang toro mula sa bakahan, at dalawang lalaking tupa. Ang mga ito ay magiging handog na sinusunog para kay Yahweh, kasama ang handog na pagkaing butil at mga handog na inumin para sa mga iyon—isang handog na pinaraan sa apoy[a], na may amoy na kalugod-lugod kay Yahweh.
  to: Kasama ng tinapay[a], maghahandog kayo ng pitong lalaking kordero na tig-iisang taóng gulang at walang kapintasan, isang toro mula sa kawan ng baka, at dalawang lalaking tupa. Ang mga ito ay magiging handog na sinusunog para kay Yahweh, kasama ang handog nilang butil at ang kanilang mga handog na inumin—isang handog na inihahandog sa pamamagitan ng apoy[b], isang mabangong samyo para kay Yahweh.
