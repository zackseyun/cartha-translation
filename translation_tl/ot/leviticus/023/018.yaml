  naturalness: Mas natural ang “Kasama ng tinapay,” “mula sa kawan ng baka,” at “kasama ang handog nilang butil at ang kanilang mga handog na inumin.” Iniiwasan nito ang hindi malinaw na “para sa mga iyon.”
