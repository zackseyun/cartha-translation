  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Kasama ng tinapay[a], maghahandog kayo ng pitong lalaking kordero na tig-iisang taóng gulang at walang kapintasan, isang toro mula sa kawan ng baka, at dalawang lalaking tupa. Ang mga ito ay magiging handog na sinusunog para kay Yahweh, kasama ang handog nilang butil at ang kanilang mga handog na inumin—isang handog na inihahandog sa pamamagitan ng apoy[b], isang mabangong samyo para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa tabi ng tinapay” o “bukod pa sa tinapay.” Ang pang-ukol na Hebreo ay maaaring magpahiwatig ng pagsama kaysa pisikal na paglalagay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “handog na pagkain.” Ang salitang Hebreo ay tumutukoy sa handog na inihahandog sa pamamagitan ng apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay tumutukoy sa paglapit o paghaharap ng handog; natural at malinaw sa Tagalog ang “maghahandog.”
- source_word: עַל הַלֶּחֶם
  choice: kasama ng mga tinapay
  rationale: Dito, ang עַל ay malamang na nagsasaad ng pagsama o pagdaragdag sa naunang handog na tinapay, hindi ng pisikal na paglalagay ng mga hayop sa ibabaw nito.
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: pitong lalaking korderong tig-iisang taóng gulang at walang kapintasan
  rationale: Pinananatili nito ang bilang, kasarian, edad, at teknikal na kahingiang pansakripisyo ng tekstong Hebreo.
- source_word: וּפַר בֶּן בָּקָר אֶחָד
  choice: isang toro mula sa bakahan
  rationale: Sinasalamin nito ang hayop mula sa kawan ng baka nang hindi labis na tinutukoy ang edad.
- source_word: וְאֵילִם שְׁנָיִם
  choice: dalawang lalaking tupa
  rationale: Ang אַיִל ay isang ram; “lalaking tupa” ang karaniwan at madaling maunawaang katumbas sa modernong Tagalog.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang teknikal na handog na lubusang sinusunog; malinaw ang anyo sa ordinaryong mambabasa.
- source_word: וּמִנְחָתָם וְנִסְכֵּיהֶם
  choice: kasama ang handog na pagkaing butil at mga handog na inumin para sa mga iyon
  rationale: Ang מִנְחָה ay handog na butil at ang נֶסֶךְ ay ibinubuhos na handog na inumin. Ang mga hulaping panghalip ay tumutukoy sa pangkat ng mga hayop/handog.
- source_word: אִשֵּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Pinananatili nito ang malinaw na kaugnayan ng terminong Hebreo sa apoy at iniiwasang ipakahulugang “pagkain” lamang.
- source_word: רֵיחַ נִיחֹחַ
  choice: may amoy na kalugod-lugod
  rationale: Natural na Tagalog ito para sa pormulang nagsasaad ng amoy na nagbibigay-lugod o katanggap-tanggap kay Yahweh.
- source_word: לַיהוָה
  choice: para kay Yahweh / kay Yahweh
  rationale: Direktang tinutumbasan ang pangalang tipan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang pangalang tipan sa halip na palitan ng titulo.
- issue: Kahulugan ng אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Ang termino ay may kaugnayan sa handog na ginawa sa pamamagitan ng apoy. Pinananatili ng salin ang ritwal na larawan nang hindi ipinapalagay na literal na pagkain ito ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga karaniwang terminong pansakripisyo at iniwasan ang sobrang teknikal o makalumang pananalita. Ang posibleng kahulugan ng עַל bilang pagsama/pagdagdag ay isinama nang natural sa pangunahing teksto; ang tunay na leksikal na pag-aalinlangan sa אִשֵּׁה ay pinanatili sa talababa.
