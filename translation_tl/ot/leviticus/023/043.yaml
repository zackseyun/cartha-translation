id: LEV.23.43
reference: Leviticus 23:43
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְמַעַן֮ יֵדְע֣וּ דֹרֹֽתֵי/כֶם֒ כִּ֣י בַ/סֻּכּ֗וֹת הוֹשַׁ֨בְתִּי֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/הוֹצִיאִ֥/י אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: tl
  text: upang malaman ng inyong mga salinlahi na pinatira ko sa mga kubol[a] ang mga anak ni Israel[b] nang ilabas ko sila mula sa lupain ng Ehipto. Ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga pansamantalang silungan.” Ang Hebreong sukkot ay tumutukoy sa mga pansamantalang kubol o silungan.
    reason: lexical_alternative
  - marker: b
    text: O “ang mga Israelita” o “ang sambayanan ng Israel.” Sa literal, “ang mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ
  choice: upang malaman
  rationale: Likas na ipinahahayag sa Tagalog ang layunin ng לְמַעַן at ang di-ganap na pandiwa sa pamamagitan ng “upang malaman.”
- source_word: דֹרֹתֵיכֶם
  choice: inyong mga salinlahi
  rationale: Pinananatili ang tuwirang diwa ng sunod-sunod na mga henerasyon, sa halip na paliitin ito sa “mga inapo” lamang.
- source_word: בַסֻּכּוֹת
  choice: sa mga kubol
  rationale: Ang “kubol” ay pansamantalang tirahan o silungan at pinananatili ang ugnayang leksikal sa kapistahang tinutukoy sa kabanata.
- source_word: הוֹשַׁבְתִּי
  choice: pinatira ko
  rationale: Malinaw at likas na Tagalog para sa pasakdal na Hiphil ng ישׁב, na may sanhiang diwang ‘ginawa kong manirahan.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pormal na pinananatili ang kolektibong pananalitang Hebreo; nililinaw sa talababa ang mas idyomatikong mga katumbas.
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: nang ilabas ko sila
  rationale: Ang “nang” ay likas na naghahayag ng temporal na kalagayan ng infinitive construct na may בְּ.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang “lupain” at ang diwa ng paglabas mula roon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang katumbas ng pormulang tipan, na pinananatili ang pangmaramihang ikalawang panauhan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Paglalahad sa בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita; ang sambayanan ng Israel
  rationale: Pinananatili sa pangunahing teksto ang konkretong kolektibong anyo ng Hebreo nang hindi ikinukubli ang mas likas na alternatibo sa Tagalog.
- issue: Kalikasan ng mga tirahan sa בַסֻּכּוֹת
  choice: sa mga kubol
  alternative: sa mga pansamantalang silungan
  rationale: Hindi tinutukoy ng salita ang isang permanenteng gusali; ang “kubol” ay maikli, kongkreto, at angkop sa konteksto ng kapistahan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pinatira” upang likas na maipahayag ang sanhiang anyo, at “kubol” bilang payak at madaling maunawaang tawag sa pansamantalang tirahan. Ang pangmaramihang “inyong” ay angkop sa kolektibong kausap.
