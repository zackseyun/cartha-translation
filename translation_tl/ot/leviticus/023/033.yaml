base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/033.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring isalin bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ipinapahayag ng waw-consecutive at ng pandiwang דבר ang kasunod na pangyayari ng pagsasalita; natural at marangal sa modernong Tagalog ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinausap; “kay” ang likas na anyo sa Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang מֹשֶׁה sa Tagalog.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitive na לֵאמֹר ay pormulang nagpapakilala sa mismong sasabihin. Sa natural na Tagalog, malinaw itong naipahihiwatig ng tutuldok, lalo na't sumusunod sa susunod na talata ang nilalaman ng pahayag.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; inilalahad sa talababa ang isa pang kilalang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang karaniwang pormulang “nagsalita ... kay” at ang tutuldok upang natural na ipakilala ang pahayag na sumusunod sa susunod na talata.
