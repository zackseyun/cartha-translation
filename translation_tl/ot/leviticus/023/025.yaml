  naturalness: Natural at marangal ang hulmang "Huwag kayong gumawa ... at maghandog kayo kay Yahweh ...". Ang "karaniwang gawain" ay malinaw na modernong Tagalog at hindi nagpapahiwatig ng ganap na pagbabawal sa lahat ng pagkilos.
  terminology: Pinanatili ang Yahweh para sa יהוה. Pinalitan ang hindi malinaw na "handog na pagkain" ng "handog na pinaraan sa apoy," isang malinaw na katumbas ng teknikal na אִשֶּׁה. Inilagay sa talababa ang alternatibong "handog na pagkain," na maaaring gamitin sa ilang makabagong salin ngunit nangangailangan ng paliwanag sa Tagalog.
