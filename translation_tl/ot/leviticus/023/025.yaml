  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: tl
  text: Huwag kayong gumawa ng anumang karaniwang gawain, at maghandog kayo kay Yahweh ng handog na pinaraan sa apoy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa ng anumang
  rationale: Likas na ipinapahayag sa Tagalog ang ganap na pagbabawal sa hulma na “huwag ... anumang,” na pinananatili ang kabuuang saklaw ng כָּל at ang maramihang kausap.
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: mabigat na gawain
  rationale: Tumutukoy ang parirala sa karaniwang gawaing paggawa o paglilingkod na ipinagbabawal sa banal na araw, hindi sa lahat ng uri ng pagkilos. Ang “mabigat na gawain” ay malinaw, natural, at hindi gumagamit ng makalumang pananalita.
- source_word: וְהִקְרַבְתֶּם
  choice: at maghahandog kayo
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay ang paglapit o paghaharap ng isang bagay bilang handog. Ang “maghahandog” ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: אִשֶּׁה
  choice: handog na pagkain
  rationale: Sa gamit ng mga tekstong pangpari, isa itong terminong pansakripisyo na maaaring tumukoy sa handog na inihaharap sa pamamagitan ng apoy. Pinananatili ng “handog na pagkain” ang kategoryang kultiko sa madaling maunawaang wika, habang inilalagay sa talababa ang tradisyonal na pagbasa tungkol sa apoy.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh”; ang “kay” ay natural na pananda sa tumatanggap ng handog sa Tagalog.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Nasa tekstong Hebreo ang Tetragrammaton mismo. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng terminong pansakripisyo na אִשֶּׁה
  choice: handog na pagkain
  alternative: handog na pinaraan sa apoy o handog na sinusunog
  rationale: Hindi tiyak na ang anyo ng salita ay dapat laging unawain bilang paglalarawan lamang sa paraan ng pagsunog. Ginagamit sa pangunahing teksto ang malinaw na kategoryang pansakripisyo, ngunit pinananatili sa talababa ang tunay na alternatibong may kaugnayan sa apoy.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang maramihang “kayo” ayon sa anyong Hebreo. Inilagay ang panandang [a] pagkatapos mismo ng “handog na pagkain,” sapagkat ang talababa ay tumutukoy sa אִשֶּׁה, hindi sa parirala para sa gawain.
