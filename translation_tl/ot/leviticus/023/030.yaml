  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: tl
  text: At ang sinumang gumawa ng anumang gawain sa mismong araw na ito—lilipulin ko ang taong iyon mula sa gitna ng kanyang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ihihiwalay ko ang taong iyon mula sa kanyang bayan.” Ang pandiwang Hebreo rito ay nangangahulugang “lipulin” o “pangyaring mapahamak,” hindi ang karaniwang pandiwang Hebreo para sa “putulin,” bagaman magkaugnay ang diwa ng pag-aalis bilang hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: sinuman / ang taong iyon
  rationale: Sa legal na kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa isang tao, hindi sa hiwalay na di-materyal na kaluluwa. Ang “sinuman” at “ang taong iyon” ay natural sa modernong Tagalog at angkop sa dalawang paglitaw ng salita.
- source_word: תַּעֲשֶׂה
  choice: gumawa
  rationale: Ang עשה ay malawak na pandiwang nangangahulugang “gumawa.” Kasama ng מְלָאכָה, natural ang pariralang “gumawa ng anumang gawain.”
- source_word: כָּל מְלָאכָה
  choice: anumang gawain
  rationale: Pinananatili ng “anumang” ang saklaw ng כָּל, at malinaw na tumutukoy ang “gawain” sa ipinagbabawal na paggawa sa araw na iyon.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa mismong araw na ito
  rationale: Ipinahahayag ng “mismong” ang pagbibigay-diin ng idyomang עֶצֶם הַיּוֹם nang natural sa Tagalog.
- source_word: וְהַאֲבַדְתִּי
  choice: lilipulin ko
  rationale: Ang Hiphil ng אבד ay “magpangyaring mapahamak/malipol.” Ang “lilipulin ko” ay tuwiran at marangal, at hindi nito ipinapalit ang teknikal na salitang karaniwang ginagamit para sa כרת.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: mula sa gitna ng kanyang bayan
  rationale: Malapit ito sa pormula ng Hebreo at likas sa Tagalog. Ang “kanyang” ay walang kasarian at kaya’y hindi mekanikal na inililipat ang pambabaeng gramatikal na anyo na umaayon sa נֶפֶשׁ.
theological_decisions:
- issue: Kalikasan ng parusang ipinahahayag ng וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ
  choice: lilipulin ko ang taong iyon mula sa gitna ng kanyang bayan
  alternative: aalisin ko ang taong iyon mula sa kanyang bayan
  rationale: אבד ang ginamit na pandiwa, na sa Hiphil ay nangangahulugang “lipulin” o “pangyaring mapahamak,” hindi ang karaniwang כרת na “putulin/ihiwalay.” Kaya pinananatili sa pangunahing teksto ang mas tuwirang lakas ng pandiwa, habang inilalagay sa talababa ang kontekstuwal na posibilidad ng pag-aalis mula sa sambayanan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sinuman” at “kanyang” upang maging likas at walang ipinapalagay na kasarian; pinanatili ang bigat ng hatol sa “lilipulin.”
