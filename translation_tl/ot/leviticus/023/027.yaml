  to: Ngunit sa ikasampung araw ng ikapitong buwang ito ay Araw ng Pagtubos[a]. Magkakaroon kayo ng isang banal na pagtitipon, pahihirapan ninyo ang inyong sarili[b], at maghahandog kayo kay Yahweh ng handog na pinaraan sa apoy[c].
  rationale: Pinalitan ang “magpapakasakit kayo” ng “pahihirapan ninyo ang inyong sarili” upang maipahayag nang mas tumpak ang Hebreong reflexive na utos ng self-affliction, nang hindi ipinagpapalagay na pag-aayuno lamang ito. Walang ibang pagbabago sa kahulugan, termino, o mga angkla ng talababa.
