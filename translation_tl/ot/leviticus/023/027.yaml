id: LEV.23.27
reference: Leviticus 23:27
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: tl
  text: Ngunit sa ikasampung araw ng ikapitong buwang ito ay Araw ng Pagtubos[a]. Magkakaroon kayo ng isang banal na pagtitipon, pahihirapan ninyo ang inyong sarili[b], at maghahandog kayo kay Yahweh ng handog na pinaraan sa apoy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “Araw ng mga Pagtubos.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “magpakumbaba kayo” o “magkakait kayo sa inyong sarili.” Hindi tahasang sinasabi rito na pag-aayuno lamang ang tinutukoy.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “handog na pagkain.” Ang tradisyonal na salin ay “handog na pinaraan sa apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahihiwatig nito ang mariin o mapagbukod na paglipat mula sa naunang tagubilin tungkol sa kapistahan.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: sa ikasampung araw ng ikapitong buwang ito
  rationale: Likas na pahayag ng petsa sa Filipino, na pinananatili ang demonstratibong 'ito.'
- source_word: יוֹם הַכִּפֻּרִים
  choice: Araw ng Pagtubos
  rationale: Ito ang likas at nakikilalang pamagat sa Filipino; inilalahad sa talababa na pangmaramihan ang anyong Hebreo upang hindi mawala ang katangiang iyon ng teksto.
- source_word: מִקְרָא קֹדֶשׁ
  choice: isang banal na pagtitipon
  rationale: Ipinapahayag ang opisyal na ipinatawag na sagradong pagtitipon sa malinaw at marangal na modernong Filipino.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: magpapakasakit kayo
  rationale: Pinananatili ang malawak na diwa ng kusang pagpapahirap o pagkakait sa sarili nang hindi ito nililimitahan sa pag-aayuno lamang o sa panloob na pagpapakumbaba.
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Sa kontekstong pansakripisyo, ang hiphil ng קרב ay tumutukoy sa paglapit o paghaharap ng isang bagay bilang handog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Inilalarawan nito nang maingat ang handog na sinusunog o ginagawang usok, nang hindi ipinapalagay na ang pangunahing kahulugan nito ay 'pagkain.'
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang יהוה sa isang karaniwang anyong Filipino.
theological_decisions:
- issue: Isahan sa tradisyonal na pamagat laban sa pangmaramihang anyo ng כִּפֻּרִים
  choice: Araw ng Pagtubos, na may talababa tungkol sa literal na pangmaramihan
  alternative: Araw ng mga Pagtubos
  rationale: Mas natural at nakikilalang pamagat sa Filipino ang isahan, ngunit mahalagang itala ang tunay na pangmaramihang anyo ng Hebreo sa halip na ikubli ito.
- issue: Saklaw ng utos na עִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: magpapakasakit kayo
  alternative: magpakumbaba kayo / magkakait kayo sa inyong sarili
  rationale: Hindi dapat paliitin ang idyomang Hebreo sa pag-aayuno lamang o sa isang panloob na saloobin; pinananatili ng salin ang ritwal at mapagsising lawak nito.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Hindi ganap na tiyak ang pinagmulan at teknikal na diin ng salita. Ang salin ay nagpapanatili ng kaugnayan nito sa apoy, samantalang inilalagay sa talababa ang alternatibong pagkaunawa bilang handog na pagkain.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang nakikilalang pamagat na “Araw ng Pagtubos,” habang pinanatili sa talababa ang pangmaramihang anyo ng Hebreo. Iniwasan ang eksklusibong pag-uugnay ng pagpapakasakit sa pag-aayuno at ang labis na tiyak na pagpapakahulugan sa אִשֶּׁה.
