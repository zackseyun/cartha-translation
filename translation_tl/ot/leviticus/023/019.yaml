id: LEV.23.19
reference: Leviticus 23:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: tl
  text: Maghahandog kayo ng isang lalaking kambing bilang handog para sa kasalanan[a], at ng dalawang lalaking korderong tig-iisang taóng gulang bilang haing pangkapayapaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handog para sa paglilinis.”
    reason: lexical_alternative
  - marker: b
    text: O, “haing pakikipag-isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Maghahandog kayo
  rationale: Bagaman literal na nangangahulugang “gagawin ninyo,” malinaw sa kontekstong pansakripisyo na ang tinutukoy ay paghahandog; natural at tumpak sa Filipino ang “maghahandog kayo.”
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: isang lalaking kambing
  rationale: Pinananatili ang bilang at ang tiyak na kasarian ng hayop na hinihingi sa batas tungkol sa paghahandog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Ito ang malinaw at kinikilalang katawagan sa uring ito ng handog, habang inilalagay sa talababa ang alternatibong nagbibigay-diin sa paglilinis.
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: at ng dalawang lalaking kordero
  rationale: Tuwirang pinananatili ang bilang at ang panlalaking pagtukoy ng terminong gamit sa kontekstong pansakripisyo.
- source_word: בְּנֵי שָׁנָה
  choice: tig-iisang taóng gulang
  rationale: Ipinahihiwatig ng idyomang Hebreo na bawat isa sa dalawang hayop ay isang taong gulang; nililinaw ito ng “tig-iisang” sa natural na Filipino.
- source_word: לְזֶבַח שְׁלָמִים
  choice: bilang haing pangkapayapaan
  rationale: Pinananatili ng “hain” ang diwa ng kinatay na sakripisyo at ng “pangkapayapaan” ang ugnayan sa שְׁלָמִים, nang hindi ipinipilit ang mas makitid na paliwanag na pakikipag-isa.
theological_decisions:
- issue: Kahulugan ng חטאת sa batas pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tukuyin ng termino ang handog kaugnay ng kasalanan o bigyang-diin ang tungkulin nitong maglinis. Ginamit sa pangunahing teksto ang pamilyar na katawagan at pinanatili sa talababa ang tunay na alternatibong leksikal.
- issue: Kahulugan ng שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing pakikipag-isa
  rationale: Mas malapit sa anyo at lawak ng salitang Hebreo ang “pangkapayapaan.” Ang “pakikipag-isa” ay kapaki-pakinabang na alternatibo ngunit higit na nagpapakahulugan sa layunin ng handog, kaya inilagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga katawagang madaling maunawaan ngunit angkop pa rin sa pormal na konteksto ng batas pansakripisyo. Ang “tig-iisang taóng gulang” ay natural na paglilinaw na bawat kordero ay isang taong gulang.
