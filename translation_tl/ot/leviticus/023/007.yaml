  text: בַּ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/007.yaml
  text: On the first day there shall be a holy convocation for you[b][a]; you shall do no laborious work.
translation:
  language: tl
  text: Sa unang araw, magkakaroon kayo ng banal na pagtitipon[a]; huwag kayong gagawa ng anumang karaniwang gawain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sagradong kapulungan” o “banal na kapulungan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “gawaing paggawa/paglilingkod”; ibig sabihin, ordinaryong paggawa. Tradisyonal din itong isinasaling “gawaing paglilingkod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: Sa unang araw
  rationale: Likas at tuwirang pahayag ito ng panahong tinutukoy ng utos, at pinananatili ang tiyak na ordinal ng Hebreo.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Sa kontekstong pangkapistahan, ang מִקְרָא ay tumutukoy sa ipinatawag na pagtitipon, at ang קֹדֶשׁ ay nagtatakda rito bilang banal. Ang “pagtitipon” ay malinaw sa modernong Tagalog habang naipahihiwatig pa rin ang pampublikong pagtipon.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo ng
  rationale: Idyomatikong Tagalog ito para sa Hebreong konstruksyong nagsasaad kung ano ang itatalaga para sa bayan, nang hindi ginagawang katangian lamang ng araw ang pagtitipon.
- source_word: כָּל ... לֹא
  choice: huwag ... anumang
  rationale: Sa ilalim ng pagtanggi, ipinahahayag ng כָּל ang lubos na saklaw ng pagbabawal; natural itong ilahad sa Tagalog bilang “huwag ... anumang.”
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: karaniwang gawain
  rationale: Ang tambalang ito sa mga batas ng kapistahan ay tumutukoy sa ordinaryong paggawa o paglilingkod, hindi sa bawat posibleng kilos. Malinaw at hindi lipas ang “karaniwang gawain.”
- source_word: לֹא תַעֲשׂוּ
  choice: huwag kayong gagawa
  rationale: Ang ganitong anyo ng pagbabawal sa tekstong legal ay natural at may wastong bigat bilang utos sa modernong Tagalog.
theological_decisions:
- issue: Saklaw ng pagbabawal sa מְלֶאכֶת עֲבֹדָה
  choice: Ipinagbabawal ang karaniwang paggawa o paglilingkod, hindi ang lahat ng maaaring gawin nang walang anumang pagtatangi.
  alternative: Ipinagbabawal ang lahat ng uri ng gawain o kilos.
  rationale: Mas tiyak ang pariralang מְלֶאכֶת עֲבֹדָה kaysa sa payak na pagbabawal sa lahat ng מְלָאכָה. Pinananatili ng salin ang pagkakaibang ito nang hindi nagdaragdag ng mga eksepsiyong hindi tahasang binanggit sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “banal na pagtitipon” upang mapanatili ang wikang panrelihiyon nang hindi maging lipas, at ang “karaniwang gawain” upang ihayag ang tiyak na saklaw ng pagbabawal.
