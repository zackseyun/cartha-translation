  source_fidelity: Tumpak na naihahatid ng draft ang ritwal na pagwagayway ng bigkis sa harap ni Yahweh at ang pag-uulit ng kilos ng pari sa araw kasunod ng Sabbath. Gayunman, ang “upang tanggapin kayo” ay walang hayag na tagaganap at maaaring pansamantalang basahing ang pari ang tatanggap sa kanila, samantalang ang לִרְצֹנְכֶם ay tumutukoy sa pagiging katanggap-tanggap ng mga sumasamba sa harap ni Yahweh sa pamamagitan ng handog.
  naturalness: Likas at marangal ang “bigkis,” “sa harap ni Yahweh,” at “iwawagayway.” Mas malinaw at natural sa modernong Filipino ang “upang kayo ay tanggapin ni Yahweh” kaysa sa walang-tiyak na “upang tanggapin kayo.”
  terminology: Wasto ang “Yahweh” para sa יהוה, “bigkis” para sa עֹמֶר sa kontekstong ito, “pari” para sa כֹּהֵן, at “Sabbath” bilang teknikal na katawagan. Pinananatili ng “Sabbath” ang hindi pa nilulutas na pagkakakilanlan ng tinutukoy na araw ng pamamahinga.
  issues:
