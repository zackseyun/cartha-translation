  yaml_path: translation/ot/leviticus/023/011.yaml
  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: tl
  text: Iwawagayway niya ang bigkis sa harap ni Yahweh upang kayo ay tanggapin ni Yahweh[a]. Sa araw pagkatapos ng Sabbath, iwawagayway ito ng pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “upang kayo ay maging katanggap-tanggap.” Maaaring ipahayag ng pariralang Hebreo ang pagtanggap ni Yahweh sa mga sumasamba sa pamamagitan ng handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: Iwawagayway niya
  rationale: Ang Hiphil ng נוּף ay tumutukoy sa ritwal na pagwagayway o paghahandog; pinananatili ng “iwawagayway” ang kongkretong kilos.
- source_word: הָעֹמֶר
  choice: ang bigkis
  rationale: Sa kontekstong ito, ang עֹמֶר ay bigkis ng unang ani, hindi lamang isang sukat ng tuyong butil.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na salin ng idyomang tumutukoy sa ritwal na paghaharap sa presensiya ng Diyos, habang pinananatili ang banal na pangalan.
- source_word: לִרְצֹנְכֶם
  choice: upang tanggapin kayo
  rationale: Ipinahahayag nito ang pagtanggap sa mga sumasamba sa pamamagitan ng handog; malinaw at natural ito sa Filipino habang kinikilala sa talababa ang mas nominal na pagbasa.
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: Sa araw pagkatapos ng Sabbath
  rationale: Tuwirang ipinapahayag ang tiyak na araw kasunod ng Sabbath nang hindi nilulutas ang interpretatibong tanong kung aling Sabbath ang tinutukoy.
- source_word: יְנִיפֶנּוּ הַכֹּהֵן
  choice: iwawagayway iyon ng pari
  rationale: Inuulit ang parehong ritwal na pandiwa at malinaw na itinuturo ng “iyon” ang bigkis.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng לִרְצֹנְכֶם sa kontekstong ritwal
  choice: upang tanggapin kayo
  alternative: para sa inyong pagtanggap
  rationale: Maaaring tumukoy ang parirala sa pagtanggap sa mga sumasamba sa pamamagitan ng handog. Pinili ang mas natural na verbal na anyo sa Filipino, habang pinananatili sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bigkis” para sa bigkis ng unang ani, “iwawagayway” para sa ritwal na kilos, at “Sabbath” upang mapanatili ang teknikal na katawagan nang hindi nagpapasok ng sektaryang interpretasyon.
