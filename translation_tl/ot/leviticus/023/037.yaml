  to: '“Ito ang mga takdang panahon ng PANGINOON na ipahahayag ninyo bilang mga banal na pagtitipon, upang maghandog sa PANGINOON ng handog na inihahandog sa pamamagitan ng apoy: handog na sinusunog, handog na butil, hain, at mga handog na inumin—ang nauukol sa bawat araw sa mismong araw nito.”'
