base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: tl
  text: '“Ito ang mga takdang panahon ng PANGINOON na ipahahayag ninyo bilang mga banal na pagtitipon, upang maghandog sa PANGINOON ng handog na inihahandog sa pamamagitan ng apoy: handog na sinusunog, handog na butil, hain, at mga handog na inumin—ang nauukol sa bawat araw sa mismong araw nito.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: mga takdang panahon
  rationale: Ipinahahayag ang ideya ng mga panahong itinakda para sa mga kapistahan at banal na pagtitipon, nang hindi nililimitahan ang salita sa ‘mga pista’ lamang.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong malalaking titik sa Tagalog upang katawanin ang banal na pangalang YHWH.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: mga banal na pagtitipon
  rationale: Natural na Tagalog para sa mga pagtitipong pormal na ipinatawag at ibinukod bilang banal.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Pinananatili ang kaugnayan ng teknikal na terminong pangkulto sa apoy; iniiwasang gawing tiyak na ‘handog na pagkain’ dahil pinagtatalunan ang eksaktong etimolohiya at saklaw nito.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang malinaw na katawagan sa handog na lubusang sinusunog sa altar.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa kontekstong Levitico, tumutukoy ito sa handog mula sa harina o butil, kaya mas tiyak kaysa sa pangkalahatang ‘handog.’
- source_word: נְסָכִים
  choice: mga handog na inumin
  rationale: Tumutukoy sa mga likidong ibinubuhos bilang handog at pinananatili ang pangmaramihang anyo ng Hebreo.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ang nauukol sa bawat araw sa mismong araw nito
  rationale: Inihahatid ang idiomatikong diwa na ang itinakdang handog ng bawat araw ay dapat ialay sa araw na iyon.
theological_decisions:
- issue: Pagpapakahulugan sa אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Mas malapit ito sa anyo at kultikong gamit ng terminong Hebreo at hindi nito ipinapalagay na tiyak na ‘pagkain’ ang pangunahing kahulugan.
- issue: Paglalarawan sa mga מוֹעֲדִים
  choice: mga takdang panahon
  alternative: mga kapistahan
  rationale: Pinananatili ang mas malawak na saklaw ng salita, na tumutukoy sa mga panahong itinalaga ng Diyos at hindi lamang sa katangian ng pagdiriwang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal at ritwal na tono ng talata, habang ginawang natural ang pangwakas na idyoma sa Tagalog.
