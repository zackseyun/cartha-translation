  terminology: Ang PANGINOON, “mga takdang panahon,” “mga banal na pagtitipon,” “handog na sinusunog,” “handog na butil,” “hain,” at “mga handog na inumin” ay angkop sa marangal na modernong Filipino Tagalog at maayos na tumutugon sa mga terminong Hebreo. Pinananatili ng binagong katawagan para sa אִשֶּׁה ang ambigwidad ng termino.
