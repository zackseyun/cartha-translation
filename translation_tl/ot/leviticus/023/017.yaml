  - severity: low
    issue: Ang “lulutuin” ay mas malawak kaysa sa pandiwang Hebreong tumutukoy sa pagbe-bake.
    rationale: Ang תֵּאָפֶינָה ay “ihuhurno/baked.” Ang “ihuhurno” ay mas tumpak at natural sa konteksto ng tinapay.
