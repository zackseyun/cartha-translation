reference: Leviticus 23:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: tl
  text: Mula sa inyong mga tirahan ay magdadala kayo ng dalawang tinapay bilang handog na iwinawagayway. Ang mga ito ay gagawin mula sa dalawang ikasampu ng isang efa[a] ng pinong harina; ihuhurno ang mga ito na may lebadura[b], bilang mga unang bunga para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang efa ay isang sinaunang panukat ng tuyong sangkap. Literal na “dalawang ikasampu”; sa mga tekstong pangsaserdote, nauunawaan itong dalawang ikasampu ng isang efa.
    reason: cultural_note
  - marker: b
    text: Maaari ring, “ihuhurno bilang tinapay na may lebadura.” Tahasang sinasabi ng Hebreo na may lebadura ang mga tinapay na ito ng unang bunga.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: Mula sa inyong mga tirahan
  rationale: Ang מוֹשָׁב ay tumutukoy sa tirahan o pamayanan. Pinananatili ng “mga tirahan” ang larawan at saklaw ng Hebreo nang hindi nililimitahan ito sa isang partikular na uri ng pamayanan.
- source_word: תָּבִיאוּ
  choice: magdadala kayo
  rationale: Ang Hiphil ng בוא ay isang tagubiling pangritwal dito. Ang anyong ito ay natural sa makabagong Tagalog at angkop sa legal na pananalita ng kabanata.
- source_word: לֶחֶם תְּנוּפָה
  choice: dalawang tinapay bilang handog na iwinawagayway
  rationale: Bagaman anyong isahan ang לֶחֶם, nililinaw ng שְׁתַּיִם na dalawa ang tinapay. Ang “handog na iwinawagayway” ay nagpapanatili sa tiyak na ritwal na kahulugan ng תְּנוּפָה.
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampu ng isang efa
  rationale: Ang עִשָּׂרוֹן ay isang ikasampung bahagi ng efang panukat. Hindi idinagdag ang “bawat isa” sapagkat hindi tahasang sinasabi ng Hebreong teksto kung ang sukat ay para sa bawat tinapay o sa kabuuan.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwan at malinaw na katumbas ito ng dinalisay na harinang ginagamit sa mga handog na butil.
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: lulutuin na may lebadura
  rationale: Ipinahahayag ng חָמֵץ ang pagiging pinaalsa at ng Niphal na תֵּאָפֶינָה ang pagluluto o pagbe-bake. Malinaw sa ordinaryong mambabasa ang “may lebadura” at hindi nito ikinukubli ang pambihirang katangian ng mga tinapay na ito.
- source_word: בִּכּוּרִים
  choice: bilang mga unang bunga
  rationale: Tinutukoy ng בִּכּוּרִים ang unang ani o produkto na inihahandog sa Diyos. Ipinakikita ng “bilang” ang tungkulin ng mga tinapay sa ritwal.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh.” Ang “para kay” ay natural na nagpapahayag ng pag-aalay o pagtatalaga.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng ritwal na תְּנוּפָה
  choice: handog na iwinawagayway
  alternative: handog na itinatanghal; handog na itinataas
  rationale: Pinananatili nito ang nakikitang ritwal na kilos nang hindi nagdaragdag ng paliwanag tungkol sa tiyak na paraan o teolohikong kabuluhan nito.
- issue: Pamamahagi ng dalawang ikasampu ng efa sa dalawang tinapay
  choice: Hindi tinukoy kung para sa bawat tinapay o para sa kabuuan
  alternative: Dalawang ikasampu ng efa para sa bawat tinapay
  rationale: Hindi tahasang taglay ng Masoretikong Hebreo ang “bawat isa.” Kaya pinananatili sa salin ang tunay na kalabuan sa halip na lutasin ito nang walang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magdadala kayo” para sa legal na tagubilin, “lebadura” bilang pangkaraniwang terminong nauunawaan, at “Yahweh” para sa personal na pangalan ng Diyos. Inilipat ang panandang [a] sa sukat na talagang ipinapaliwanag nito; nananatili ang [b] sa pariralang tungkol sa lebadura.
