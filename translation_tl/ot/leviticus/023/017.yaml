revisions:
- from: Mula sa inyong mga tirahan ay magdadala kayo ng dalawang tinapay bilang handog na iwinawagayway. Gagawa ang mga ito sa dalawang ikasampu ng isang efa[a] ng pinong harina at lulutuin na may lebadura[b], bilang mga unang bunga para kay Yahweh.
  to: Mula sa inyong mga tirahan ay magdadala kayo ng dalawang tinapay bilang handog na iwinawagayway. Ang mga ito ay gagawin mula sa dalawang ikasampu ng isang efa[a] ng pinong harina; ihuhurno ang mga ito na may lebadura[b], bilang mga unang bunga para kay Yahweh.
  rationale: Inayos ang di-gramatikal na pagkakabuo ng pangungusap upang malinaw na ang dalawang tinapay ay gagawin mula sa itinakdang dami ng pinong harina. Ginawang “ihuhurno” ang pandiwa upang tumpak na maipahayag ang pagluluto sa hurno, habang pinanatili ang lahat ng ritwal, sukat, at sinadyang kalabuan ng pinagmulan.
