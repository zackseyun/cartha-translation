base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: tl
  text: 'Sabihin mo sa mga anak ni Israel: “Sa ikalabinlimang araw ng ikapitong buwang ito ay Pista ng mga Kubol[a] para kay Yahweh sa loob ng pitong araw.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na “Pista ng mga Tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Sabihin mo sa mga anak ni Israel
  rationale: Pinagsama sa natural na utos sa Tagalog ang Hebreong pormulang ‘magsalita ... na sinasabi.’ Pinanatili ang literal at pormulang ‘mga anak ni Israel’ sa halip na gawing ‘mga Israelita.’
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם
  choice: Sa ikalabinlimang araw
  rationale: Likas na anyo sa Tagalog ng tiyak na petsang Hebreo.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: ng ikapitong buwang ito
  rationale: Pinananatili ang bilang at ang demonstratibong ‘ito’ sa natural na ayos ng Tagalog.
- source_word: חַג הַסֻּכּוֹת
  choice: Pista ng mga Kubol
  rationale: Ang סֻכּוֹת ay mga pansamantalang silungan o kubol. Mas tuwirang ipinahahayag ng ‘mga Kubol’ ang kahulugan kaysa sa hiram at di-gaanong malinaw na ‘mga Tabernakulo.’
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Malinaw at likas na pagpapahayag sa Tagalog ng tagal ng pista.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pag-aalay o pagtatalaga ng pista kay Yahweh; ang ‘para kay’ ay natural sa Tagalog at pinananatili ang personal na banal na pangalan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pangalan ng pistang סֻכּוֹת
  choice: Pista ng mga Kubol
  alternative: Pista ng mga Tolda; Pista ng mga Tabernakulo
  rationale: Pinili ang malinaw na kahulugan ng salitang Hebreo, habang inilalagay sa talababa ang tradisyonal na katawagan upang makatulong sa pagkilala sa pista.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ipagdiriwang’ upang maipahayag nang natural ang nominal na pahayag sa Hebreo nang hindi binabago ang petsa, tagal, o pagtatalaga ng pista.
