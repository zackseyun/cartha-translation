  source_fidelity: 'Tumpak na naipapahayag ng salin ang pangunahing mga elemento ng Hebreo: ang plural na panturo, ang mga itinakdang panahon ni Yahweh, ang mga banal na pagtitipon, at ang pagpapahayag ng mga ito sa kani-kanilang nakatalagang panahon. Napananatili rin ang pag-uulit ng konsepto ng מוֹעֵד sa simula at wakas ng talata.'
