id: LEV.23.4
reference: Leviticus 23:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: tl
  text: “Ito ang mga itinakdang panahon ni Yahweh[a], ang mga banal na pagtitipon[b], na ipahahayag ninyo sa kani-kanilang takdang panahon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga itinakdang kapistahan” o “mga takdang panahon.” Mas malawak ang salitang Hebreo kaysa sa mga pistang may handaan lamang; tumutukoy ito sa mga panahong itinakda ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: O “mga sagradong kapulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang parirala sa Filipino para sa maramihang talaang kasunod; maaaring gamitin ang “ito” bilang pangkalahatang pantukoy sa isang hanay.
- source_word: מוֹעֲדֵי
  choice: mga itinakdang panahon
  rationale: Pinananatili ang malawak at temporal na diwa ng מוֹעֵד, na hindi limitado sa mga pistang may handaan at umaangkop sa pag-uulit ng salita sa hulihan ng talata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: mga banal na pagtitipon
  rationale: Malinaw at likas sa modernong Filipino; ipinahahayag nito ang mga pagtitipong sagrado at opisyal na ipinatawag.
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: na ipahahayag ninyo
  rationale: Sa kontekstong ito, ang קרא ay tumutukoy sa pampublikong pagpapahayag o pagtawag sa mga banal na okasyon, hindi lamang sa pagbibigay ng pangalan.
- source_word: בְּמוֹעֲדָם
  choice: sa kani-kanilang takdang panahon
  rationale: Ipinakikita ng hulaping maramihan na ang bawat pagdiriwang o pagtitipon ay may sariling takdang panahon; likas sa Filipino ang “kani-kanilang.”
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Nasa tekstong Hebreo ang Tetragrammaton bilang personal na pangalan. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng מוֹעֲדֵי
  choice: mga itinakdang panahon
  alternative: mga itinakdang kapistahan
  rationale: Mas malawak ang מוֹעֵד kaysa sa “kapistahan” lamang at tumutukoy sa mga panahong itinakda ni Yahweh; hindi dapat paliitin ang saklaw nito.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pagtitipon” sa halip na mas teknikal na “kapulungan” sa pangunahing teksto, habang inilagay ang leksikal na alternatibo sa talababa. Pinanatili ang pag-uulit ng konsepto ng takdang panahon at ang personal na pangalang Yahweh.
