  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: tl
  text: Huwag kayong gumawa ng anumang gawain sa mismong araw na ito, sapagkat ito ay Araw ng Pagbabayad-sala[a], upang magsagawa ng pagbabayad-sala para sa inyo sa harap ni Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “araw ng mga pagbabayad-sala.” Karaniwang tinatawag ang kapistahan na “Araw ng Pagbabayad-sala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ
  choice: Huwag kayong gagawa ng anumang gawain
  rationale: Ang מְלָאכָה ay karaniwang tumutukoy sa gawain o trabaho sa mga pagbabawal para sa Sabbath at mga kapistahan. Likas sa modernong Tagalog ang konstruksiyong ito at malinaw ang bisa nito bilang utos.
- source_word: בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה
  choice: sa mismong araw na ito
  rationale: Ipinapadiin ng idyomang Hebreo ang tiyak na araw mismo; natural at eksakto itong naipahahayag ng “sa mismong araw na ito.”
- source_word: כִּ֣י
  choice: sapagkat
  rationale: Nagbibigay ang כִּי ng dahilan para sa naunang pagbabawal. Ang “sapagkat” ay malinaw at angkop sa marangal na rehistro ng kautusan.
- source_word: י֤וֹם כִּפֻּרִים֙
  choice: Araw ng Pagtubos
  rationale: Literal na maramihan ang כִּפֻּרִים, ngunit tumutukoy ito sa pangalan ng kapistahan. Ang “Araw ng Pagtubos” ay madaling maunawaan at pinananatili ang kultikong bigat ng termino; inilalahad sa talababa ang literal na anyo.
- source_word: לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם
  choice: upang tubusin kayo
  rationale: Ang Piel infinitive na כפר sa kontekstong kultiko ay tumutukoy sa pagsasagawa ng pagtubos para sa mga tao. Iniiwasan ng salin ang pagpapasok ng isang mas makitid na teoryang teolohikal.
- source_word: לִ/פְנֵ֖י
  choice: sa harap ni
  rationale: Ipinahahayag nito ang presensiya sa harap ni Yahweh sa isang kultikong tagpuan; natural sa Tagalog ang “sa harap ni.”
- source_word: יְהוָ֥ה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי/כֶֽם
  choice: inyong Diyos
  rationale: Sa pormulang tipan kasama ng YHWH, isahan ang diwa ng אֱלֹהִים na may hulaping pangalawang panauhang maramihan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos sa tekstong Hebreo.
- issue: Kultikong terminong כפר / כִּפֻּרִים
  choice: pagtubos / Araw ng Pagtubos
  alternative: pagbabayad-sala / Araw ng Pagbabayad-sala; paglilinis / Araw ng mga Pagtubos
  rationale: Malawak ang saklaw ng ugat na כפר sa batas-saserdote at hindi dapat ikulong sa isang partikular na teorya ng atonement. Ang “pagtubos” ay madaling maunawaan at may sapat na kultiko at relasyonal na bigat, samantalang pinananatili sa talababa ang maramihang anyo ng pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa legal-kultikong konteksto. Ginamit ang pangmaramihang “kayo/inyong” upang katawanin ang mga pandiwang at hulaping pangalawang panauhang maramihan sa Hebreo.
