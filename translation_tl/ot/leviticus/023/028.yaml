  naturalness: Natural at marangal sa modernong Filipino Tagalog ang “Huwag kayong gumawa ng anumang gawain sa mismong araw na ito” at “sa harap ni Yahweh na inyong Diyos.” Mas malinaw at idiomatiko ang “upang magsagawa ng pagbabayad-sala para sa inyo” kaysa “upang tubusin kayo.”
