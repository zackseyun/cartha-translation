base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: tl
  text: At maghahandog kayo kay Yahweh ng handog na iniaalay sa pamamagitan ng apoy sa loob ng pitong araw.[a] Sa ikapitong araw ay magkakaroon ng banal na pagtitipon; huwag kayong gagawa ng anumang karaniwang trabaho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: maghahandog kayo
  rationale: Ang Hiphil ng קרב sa kontekstong panghain ay nangangahulugang maglapit o magharap ng handog; ang “maghahandog” ang natural at tumpak na katumbas sa modernong Tagalog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Tumutukoy ang terminong pangsaserdoteng ito sa handog na inihahain sa pamamagitan ng apoy. Pinananatili ng salin ang malinaw na kaugnayan sa apoy nang hindi ipinapalagay na pagkain lamang ang tinutukoy.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang patutunguhan o pag-aalay ng handog; natural sa Tagalog ang “kay Yahweh” para sa handog na iniuukol sa kaniya.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Malinaw nitong ipinapahayag ang tagal ng paghahandog sa buong pitong-araw na panahon.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Sa ikapitong araw
  rationale: Tuwirang salin ng pariralang tumutukoy sa panahon.
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Ang parirala ay tumutukoy sa isang sagradong pagtitipong opisyal na ipinatawag; malinaw at marangal sa modernong Tagalog ang “banal na pagtitipon.”
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: anumang karaniwang trabaho
  rationale: Hindi nito ipinagbabawal ang bawat posibleng gawain kundi ang pangkaraniwan o pangkabuhayang trabaho sa araw ng kapistahan. Iniiwasan ng salin ang lipas at maaaring mapanlinlang na “aliping gawain.”
- source_word: לֹא תַעֲשׂוּ
  choice: huwag kayong gagawa
  rationale: Natural na anyo ng tahasang pagbabawal sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pag-render sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: May pagtatalo sa tiyak na etimolohiya at saklaw ng terminong panghain. Ang pangunahing salin ay nagpapanatili sa malinaw na tradisyong pangsaserdote na inuugnay ito sa apoy, habang inilalahad sa talababa ang alternatibong “handog na pagkain.”
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang rehistro. Ginamit ang “banal na pagtitipon” sa halip na mas teknikal o lipas na “banal na kapulungan,” at “karaniwang trabaho” upang ipakita ang uri ng gawaing ipinagbabawal nang hindi pinalalawak ito sa lahat ng kilos.
