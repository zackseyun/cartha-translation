  terminology: Ang “Yahweh,” “banal na pagtitipon,” at “karaniwang trabaho” ay angkop. Pinananatili ng binagong pangunahing salin ang tradisyonal na kaugnayan ng אִשֶּׁה sa apoy, habang iniiwan sa talababa ang leksikal na alternatibong “handog na pagkain.”
