  text: בַּ/סֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כָּל הָֽ/אֶזְרָח֙ בְּ/יִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּ/סֻּכֹּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/042.yaml
  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: tl
  text: Sa mga kubol[a] kayo titira nang pitong araw; ang bawat Israelitang ipinanganak sa Israel ay titira sa mga kubol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga silungan” o “mga pansamantalang silungan.” Ang salitang Hebreo ay tumutukoy sa mga pansamantalang kubol na ginagamit sa kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: sa mga kubol
  rationale: Ang סֻכּוֹת ay mga pansamantalang silungang tinitirhan sa panahon ng kapistahan. Ang “mga kubol” ay kongkreto, malinaw, at likas sa makabagong Tagalog.
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: titira / ay titira
  rationale: Bagaman maaaring mangahulugang “umupo” ang ישׁב, sa kontekstong ito ay tumutukoy ito sa paninirahan. Ang “titira” ay natural at pinananatili sa dalawang sugnay ang pag-uulit ng Hebreo.
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Natural sa Tagalog ang “nang” sa pagpapahayag ng haba ng panahong ilalagi.
- source_word: כָּל הָאֶזְרָח
  choice: ang bawat katutubo
  rationale: Tumutukoy ang אֶזְרָח sa taong likas na kabilang sa pamayanan, kaiba sa dayuhang naninirahan doon. Iniiwasan ng “katutubo” ang pagpasok ng makabagong kategoryang pampolitika na maaaring ipahiwatig ng “mamamayan.”
- source_word: בְּיִשְׂרָאֵל
  choice: sa Israel
  rationale: Tuwirang ipinapakita ng parirala ang pamayanang saklaw ng utos.
theological_decisions:
- issue: Saklaw ng panlalaking anyong הָאֶזְרָח
  choice: ang bawat katutubo
  alternative: ang bawat katutubong lalaki
  rationale: Ang pangngalan ay panlalaki sa gramatika ngunit ginagamit nang kumakatawan sa bawat likas na kabilang sa pamayanan. Hindi nililimitahan ng salin ang utos sa mga lalaki lamang.
translation_notes:
  register: Makabago at dignidadong Tagalog; ginamit ang “titira” sa halip na mas pormal ngunit di-gaanong pangkaraniwang “mananahan.” Pinanatili ang pag-uulit ng “sa mga kubol” mula sa Hebreo.
