  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: tl
  text: Sa unang buwan, sa ikalabing-apat na araw ng buwan, sa takipsilim[a], ay ang Paskuwa para kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa pagitan ng dalawang dapithapon,” isang idyomang Hebreo para sa yugto ng takipsilim sa paligid ng paglubog ng araw.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain: “ang handog na Paskuwa” o “ang hain na Paskuwa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Sa unang buwan
  rationale: Sa kontekstong pangkalendaryo, ang חֹדֶשׁ ay nangangahulugang “buwan,” at ang הָרִאשׁוֹן ay tumutukoy sa una sa taon ng mga kapistahan.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: sa ikalabing-apat na araw ng buwan
  rationale: Idinagdag ang “araw” upang maging likas at malinaw sa Filipino habang pinananatili ang eksaktong petsa.
- source_word: בֵּין הָעַרְבָּיִם
  choice: sa takipsilim
  rationale: Ang literal na “sa pagitan ng mga gabi” ay isang idyomang Hebreo para sa yugto ng takipsilim sa paligid ng paglubog ng araw; pinananatili sa talababa ang literal na anyo dahil may kabuluhan ito sa pag-unawa sa oras.
- source_word: פֶּסַח
  choice: Paskuwa
  rationale: Maaaring tumukoy ang salita sa pagdiriwang, ritwal, o handog na Paskuwa. Ang malawak na katawagang “Paskuwa” ay nagpapanatili sa likas na kalabuan ng konteksto.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahiwatig ng pag-aalay o pagtatalaga para kay Yahweh; natural sa Filipino ang “para kay,” at tuwirang pinangalanan ang יהוה bilang Yahweh.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng פֶּסַח sa kontekstong pangkulto
  choice: Paskuwa
  alternative: handog na Paskuwa; hain na Paskuwa
  rationale: Maaaring tumukoy ang פֶּסַח sa pagdiriwang o sa inihahandog na hayop/ritwal. Hindi nililimitahan ng pangunahing teksto ang kahulugan, at inilalahad sa talababa ang sakripisyal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “takipsilim” bilang likas na katumbas ng idyomang Hebreo, at “Paskuwa” bilang pamilyar na katawagang biblikal na hindi labis na nagtatakda kung kapistahan o handog ang tinutukoy.
