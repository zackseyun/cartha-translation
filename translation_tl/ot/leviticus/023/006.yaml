id: LEV.23.6
reference: Leviticus 23:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/זֶּ֔ה חַ֥ג הַ/מַּצּ֖וֹת לַ/יהוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: tl
  text: At sa ikalabinlimang araw ng buwang ito ay ang Kapistahan ng Tinapay na Walang Pampaalsa para kay Yahweh[a]. Sa loob ng pitong araw ay kakain kayo ng tinapay na walang pampaalsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ukol kay Yahweh.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng pag-uukol o pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲמִשָּׁה עָשָׂר יוֹם
  choice: At sa ikalabinlimang araw
  rationale: Likas na salin sa Filipino ng Hebreong pahayag ng petsa; pinananatili ang pang-ugnay na וּ at ang tahasang 'araw.'
- source_word: לַ/חֹדֶשׁ הַ/זֶּה
  choice: ng buwang ito
  rationale: Karaniwang paraan sa Filipino ng pagtukoy sa isang araw na nasa loob ng tinukoy na buwan.
- source_word: חַג הַ/מַּצּוֹת
  choice: Kapistahan ng Tinapay na Walang Pampaalsa
  rationale: Ang חַג ay isang banal na kapistahan, at ang הַמַּצּוֹת ay bahagi ng pangalan nito. Ang parirala ay malinaw at pamilyar sa modernong Filipino.
- source_word: לַ/יהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay maaaring magpahayag ng pag-aalay o pag-uukol at ng pag-aari; natural na ipinahahayag ng 'para kay' ang kaugnayang ito nang hindi ito labis na nililinaw.
- source_word: שִׁבְעַת יָמִים
  choice: Sa loob ng pitong araw
  rationale: Malinaw na ipinahahayag ang tagal na saklaw ng utos.
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Tumutukoy ang pangngalang maramihan sa mga tinapay na walang lebadura o pampaalsa; ang pangkategoryang parirala ay natural sa Filipino.
- source_word: תֹּאכֵלוּ
  choice: kakain kayo
  rationale: Sa kontekstong legal, ang imperfect ay may puwersang nag-uutos. Ang anyong ito ay dignificado at karaniwang ginagamit sa Filipino para sa preskriptibong pahayag.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang pinananatili ang personal na pangalang tipan na nasa tekstong Hebreo, alinsunod sa ibinigay na patakaran, nang hindi ito pinapalitan ng titulo.
- issue: Ugnayang ipinahahayag ng לַיהוָה
  choice: para kay Yahweh
  alternative: kay Yahweh; ukol kay Yahweh
  rationale: Maaaring ipahayag ng pang-ukol ang pag-uukol o pag-aari ng kapistahan. Pinananatili sa talababa ang tunay na saklaw ng kahulugan sa halip na pumili ng mas makitid na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal at pangritwal. Ginamit ang 'pampaalsa' bilang madaling maunawaang katumbas ng leaven, at pinanatili ang pormal na pangalan ng kapistahan.
source_grounding:
  english_pob_role: consult_only
