base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: tl
  text: Ito ay Sabbath ng ganap na pamamahinga para sa inyo, at pahirapan ninyo ang inyong sarili.[a] Sa ikasiyam na araw ng buwan, sa gabi, mula gabi hanggang gabi,[b] ipangingilin ninyo ang inyong Sabbath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magpapakumbaba kayo” o “magkakait kayo sa inyong sarili.” Ang idyomang Hebreo ay tumutukoy sa pagpapahirap o pagkakait sa sarili bilang tanda ng pagsisisi at karaniwang iniuugnay sa pag-aayuno.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mula gabi hanggang gabi.” Ipinakikita nito ang pagbilang ng mga Israelita sa araw mula sa isang gabi hanggang sa kasunod na gabi.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabbath ng lubos na pamamahinga
  rationale: Ang magkatambal na mga pangngalan ay nagpapatindi sa diwa ng pagtigil at pamamahinga. Pinananatili ng salin ang diin nang hindi nagdaragdag ng ideya ng kasolemneng hindi tuwirang ipinahahayag ng parirala.
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: pahihirapan ninyo ang inyong sarili
  rationale: Tuwirang pinananatili nito ang malawak na diwa ng ritwal na pagpapahirap o pagkakait sa sarili. Hindi nito nililimitahan ang utos sa pag-aayuno lamang, bagaman karaniwang kaugnay iyon ng pagtalima.
- source_word: נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili
  rationale: Reflexive ang gamit ng נֶפֶשׁ sa idyomang ito. Mas natural at mas tumpak dito ang “inyong sarili” kaysa “inyong mga kaluluwa,” na maaaring magpahiwatig ng mas makitid na antropolohiya.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: Sa ikasiyam na araw ng buwan, pagsapit ng gabi
  rationale: Malinaw nitong itinatakda ang pagsisimula ng pagtalima sa gabi ng ikasiyam na araw habang pinananatili ang ayos at diwa ng Hebreo.
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: mula gabi hanggang gabi
  rationale: Ito ang pormal at likas na katumbas ng Hebreo. Hindi ito ginawang “mula paglubog ng araw hanggang paglubog ng araw,” na mas paliwanag kaysa salin.
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: ipangingilin ninyo ang inyong Sabbath
  rationale: Ipinapahayag ng “ipangingilin” ang idyomatikong diwa ng pagtupad o pagtalima sa Sabbath, sa halip na ang di-likas na literal na “pamamahingahin ninyo ang inyong pamamahinga.”
theological_decisions:
- issue: Kahulugan ng pagpapahirap sa sarili sa kontekstong panritwal
  choice: Panatilihin sa pangunahing teksto ang malawak na utos na “pahihirapan ninyo ang inyong sarili.”
  alternative: “mag-aayuno kayo” o “magpapakumbaba kayo”
  rationale: Hindi tahasang sinasabi ng talata ang pag-aayuno, bagaman malamang na kasama iyon sa nakaugaliang pagtalima. Pinananatili ng salin ang lawak at tensiyon ng Hebreo sa halip na paliitin ito sa isang gawain.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang terminong “Sabbath” dahil ito ang tiyak na pangalang panritwal sa konteksto; ginamit ang “ipangingilin” bilang karaniwan at malinaw na pandiwa para sa banal na pagtalima.
