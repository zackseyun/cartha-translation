  text: בְּ/י֨וֹם הַ/שַּׁבָּ֜ת בְּ/י֣וֹם הַ/שַּׁבָּ֗ת יַֽעַרְכֶ֛/נּוּ לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד מֵ/אֵ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: tl
  text: Tuwing Sabbath[a], patuloy niya itong ihahanay[b] sa harap ni Yahweh, mula sa mga anak ng Israel, bilang isang walang-hanggang tipan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa araw ng Sabbath, sa araw ng Sabbath,” isang idyomang nangangahulugang bawat Sabbath.
    reason: lexical_alternative
  - marker: b
    text: O “maayos niya itong ilalatag.” Ang isahang “ito” ay kolektibong tumutukoy sa mga tinapay o sa kabuuang pagkakaayos ng mga ito.
    reason: lexical_alternative
  - marker: c
    text: O “isang panghabang-panahong tipan.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: Tuwing araw ng Sabbath
  rationale: 'Ang pag-uulit sa Hebreo ay may distributibong diwa: nagaganap ito sa bawat Sabbath. Likas sa modernong Tagalog ang “tuwing araw ng Sabbath.”'
- source_word: יַעַרְכֶנּוּ
  choice: niya itong ihahanay
  rationale: Ang pandiwang ערך ay tumutukoy sa maayos na paglalatag o paghahanay ng mga bagay na ginagamit sa ritwal. Ang isahang panghalip ay kolektibong tumutukoy sa tinapay o sa kabuuang ayos nito.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang karaniwang pormulang pangritwal na nangangahulugang nasa presensiya ni Yahweh.
- source_word: תָּמִיד
  choice: palagi
  rationale: Sa kontekstong makasaserdote, tumutukoy ito sa patuloy at regular na pagsasagawa, na rito ay tuwing Sabbath, hindi kinakailangang walang patid na pagkilos.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Direktang pinananatili ang diwa ng pinagmulan na ipinahihiwatig ng מֵאֵת at ang korporatibong ekspresyong “mga anak ni Israel.”
- source_word: בְּרִית עוֹלָם
  choice: bilang isang walang-hanggang tipan
  rationale: Pinananatili ang tahasang wikang tipan at ang pangmatagalang diwa ng עוֹלָם nang hindi idinaragdag ang interpretatibong salitang “obligasyon.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa tekstong Hebreo ang personal na pangalang יהוה; pinananatili itong Yahweh sa salin.
- issue: Korporatibong pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyo ng Hebreo at ang korporatibong pagkakakilanlan nito, bagaman maaari rin itong idiomatikong tumukoy sa sambayanan ng Israel.
- issue: Diwa ng בְּרִית עוֹלָם sa batas pangritwal
  choice: walang-hanggang tipan
  alternative: panghabang-panahong tipan
  rationale: Hindi tahimik na ginagawang “obligasyon” o “ordinansa” ang parirala; pinananatili ang tunay na wikang tipan at ang lawak ng עוֹלָם.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sabbath” upang mapanatili ang tiyak na pangalang pangritwal; malinaw at natural ang ayos ng pangungusap habang nananatiling malapit sa sintaks at teolohikal na tensiyon ng Hebreo.
