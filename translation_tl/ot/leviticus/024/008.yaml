  naturalness: Ang “Tuwing araw ng Sabbath” ay hindi karaniwang modernong Tagalog; sapat at mas likas ang “Tuwing Sabbath.” Mas angkop din ang “patuloy” kaysa “palagi” para sa תָּמִיד sa pormal na pananalitang pangritwal. Ang “mula sa mga anak ng Israel” ay sadyang malapit sa Hebreo, bagaman medyo mabigat sa Tagalog; pinananatili ito upang huwag ipalit ang isang mas tiyak na interpretasyong gaya ng “para sa” o “sa ngalan ng.”
  terminology: Ang “Yahweh,” “Sabbath,” “mga anak ng Israel,” at “walang-hanggang tipan” ay angkop at pare-pareho sa source. Ginamit ang “ng Israel,” na siyang mas karaniwang anyong Tagalog sa ganitong pangngalang parirala.
