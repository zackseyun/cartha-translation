base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: tl
  text: Kung ang isang tao ay magdulot ng pinsala sa kaniyang kapwa[a], kung ano ang ginawa niya, iyon din ang gagawin sa kaniya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magbigay ng kapintasan o depekto sa kaniyang kapwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Kung ang isang tao ay
  rationale: Ang כִּי sa pormulasyong legal ay nagpapakilala ng kondisyong kaso; natural itong isalin na “kung.” Ang וְ ay hindi kailangang ilantad bilang “at” sa Filipino upang maging maayos ang daloy.
- source_word: יִתֵּן מוּם
  choice: magdulot ng kapinsalaan
  rationale: Literal itong “magbigay ng kapintasan/depekto,” ngunit sa konteksto ng pinsalang pisikal, malinaw at likas sa Filipino ang “magdulot ng kapinsalaan,” habang pinananatili ang ideya ng aktuwal na pinsala.
- source_word: בַּעֲמִיתוֹ
  choice: sa kaniyang kapwa
  rationale: Ang עָמִית ay tumutukoy sa kapuwa kasapi o kasama sa pamayanan. Ang “kapwa” ang pinakanatural at sapat na malawak na katumbas sa modernong Filipino.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: kung ano ang ginawa niya
  rationale: Pinananatili nito ang paghahambing at ang sukatan ng katumbas na kaparusahan nang hindi mabigat o lipas ang pananalita.
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: iyon din ang gagawin sa kaniya
  rationale: Ipinahahayag nito ang pasibong legal na bunga at ang eksaktong pagtutumbas na nililikha ng כַּאֲשֶׁר…כֵּן, nang hindi ipinapalagay na pribadong paghihiganti ang tinutukoy.
theological_decisions:
- issue: Prinsipyo ng katumbas na ganti sa kontekstong legal
  choice: 'Pinanatili bilang impersonal na tuntunin ng katumbas at nasusukat na kaparusahan: “iyon din ang gagawin sa kaniya.”'
  alternative: Isaling para bang tuwirang ipinag-uutos sa nasaktan ang personal na paghihiganti.
  rationale: Ang pasibong יֵעָשֶׂה ay hindi tumutukoy kung sino ang magsasagawa. Kaya hindi dapat idagdag na ito ay pribadong paghihiganti o tahasang tukuyin ang isang tagapagpatupad na hindi naman binanggit.
translation_notes:
  register: Makabago, malinaw, at marangal na legal na Filipino. Ginamit ang “kaniyang” para sa pormal ngunit madaling maunawaang register; iniwasan ang sobrang literal na “magbigay ng depekto,” na hindi likas sa Filipino.
