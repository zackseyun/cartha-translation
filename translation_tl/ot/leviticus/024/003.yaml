id: LEV.24.3
reference: Leviticus 24:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: tl
  text: Sa labas ng tabing ng Patotoo[a], sa Toldang Tipanan, aayusin ni Aaron ito mula sa gabi hanggang umaga sa harap ni Yahweh nang palagian[b]. Ito ay tuntuning panghabang-panahon[c] sa inyong mga salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tabing na kaugnay ng Patotoo.” Ang “Patotoo” ay tumutukoy sa patotoo ng tipan, lalo na sa mga tapyas na nasa kaban.
    reason: lexical_alternative
  - marker: b
    text: Ang “palagian” dito ay tumutukoy sa regular at patuloy na pagsasagawa ng ritwal, na itinakdang gawin mula gabi hanggang umaga.
    reason: cultural_note
  - marker: c
    text: Maaari ring “permanenteng tuntunin” o “walang-hanggang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: Sa labas ng tabing ng Patotoo
  rationale: Ang parirala ay tumutukoy sa lokasyong nasa labas ng panloob na tabing na kaugnay ng Patotoo. Pinananatili ng “Patotoo” ang natatanging terminong pangsantuwaryo nang hindi ito labis na ipinapaliwanag.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Natural at nakikilalang katawagan sa modernong Tagalog para sa santuwaryong tolda kung saan nakikipagtagpo si Yahweh sa Israel.
- source_word: יַעֲרֹךְ אֹתוֹ אַהֲרֹן
  choice: aayusin iyon ni Aaron
  rationale: Ang ערך ay nangangahulugang ayusin o ilagay sa wastong kaayusan. Ang “iyon” ay nagpapanatili sa panghalip ng Hebreo at sa pagtukoy nito sa ilawan mula sa naunang talata.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: mula sa gabi hanggang umaga
  rationale: Tuwirang ipinapahayag ang itinakdang haba ng panahon at ikinakabit ito sa gawain ni Aaron.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang pananalitang pangkulto na nagsasaad ng presensiya sa harap ng Diyos at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: תָּמִיד
  choice: nang palagian
  rationale: Ipinahihiwatig dito ang regular at nagpapatuloy na pagsasagawa ng ritwal, ayon sa itinakdang panahong mula gabi hanggang umaga, hindi kinakailangang walang patid sa bawat sandali.
- source_word: חֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  rationale: Ipinapahayag ang namamalagi at patuloy na bisa ng itinakdang kautusan habang pinananatili ang lawak ng kahulugan ng עוֹלָם.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Natural na Tagalog para sa patuloy na pananagutan ng magkakasunod na henerasyon.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Saklaw ng תָּמִיד sa ritwal ng ilawan
  choice: nang palagian
  alternative: nang tuluy-tuloy; nang regular
  rationale: Dahil nililinaw ng talata ang panahong “mula sa gabi hanggang umaga,” ang salin ay nagpapahayag ng patuloy at regular na pagtalima nang hindi ipinapalagay na walang patid sa bawat sandali.
- issue: Lakas ng חֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  alternative: walang-hanggang tuntunin; permanenteng tuntunin
  rationale: Pinananatili ang matibay at pangmatagalang bisa ng parirala ngunit hindi nilulutas nang higit sa teksto ang maaaring saklaw ng עוֹלָם.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabing,” “Toldang Tipanan,” at “Patotoo” bilang malinaw na mga terminong pangsantuwaryo; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
