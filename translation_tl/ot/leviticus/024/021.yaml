  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: tl
  text: Ang sinumang pumatay ng hayop ay magbabayad ng kabayaran para rito, ngunit ang sinumang pumatay ng tao ay papatayin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: ang sinumang pumatay
  rationale: Bagaman ang anyo ay tumutukoy sa paghampas o pananakit, ipinakikita ng mga kaparusahang nakasaad—kabayaran para sa hayop at kamatayan para sa tao—na nakamamatay ang pananakit dito. Ang “ang sinumang pumatay” ay likas na pormulasyon ng pangkalahatang tuntuning legal sa modernong Tagalog.
- source_word: בְהֵמָה
  choice: hayop
  rationale: Malawak itong katawagan para sa hayop, karaniwang domestikado sa ganitong konteksto. Ang “hayop” ay malinaw at hindi kasingkipot ng “alagang hayop” o “hayop na pangkabuhayan.”
- source_word: יְשַׁלְּמֶנָּה
  choice: magbabayad-pinsala para rito
  rationale: Ang Piel ng שלם ay nangangahulugang magbigay ng kabayaran o magsauli ng katumbas. Ipinahihiwatig ng hulaping pambabae na ang kabayaran ay para sa hayop na nabanggit.
- source_word: אָדָם
  choice: tao
  rationale: Sa paghahambing sa hayop, tumutukoy ito sa isang indibidwal na taong pinatay. Likas sa Tagalog ang “tao” at pinananatili nito ang malawak na saklaw ng salitang Hebreo nang hindi ipinapalagay na lalaki lamang ang tinutukoy.
- source_word: יוּמָת
  choice: papatayin
  rationale: Ang Hophal ay pasibo at sa kontekstong legal ay nagsasaad na ang nagkasala ay hahatulan ng kamatayan. Ang “papatayin” ay tuwiran at pinananatili ang pasibong diwa nang hindi nagdaragdag ng isang mas espesipikong paraan ng paglalapat ng hatol.
theological_decisions:
- issue: Saklaw ng אָדָם sa tuntuning legal
  choice: tao
  alternative: lalaki
  rationale: Ang אָדָם ay nasa panlalaking isahan sa Hebreo ngunit maaari itong tumukoy sa isang taong kinatawan ng pangkalahatang kaso, anuman ang kasarian. Dahil walang gramatikal na kasarian ang “tao” sa Tagalog, naipapahayag nito ang kahulugan nang hindi binubura ang pagiging indibidwal ng tuntunin.
- issue: Lakas ng kahulugan ng מַכֵּה
  choice: pumatay
  alternative: humampas / nanakit
  rationale: Nililinaw ng kaparis na mga resulta at ng agarang konteksto ng Levitico 24:17–18 na nakamamatay na pananakit ang tinutukoy. Kaya ang “pumatay” ay hindi simpleng pagpapakahulugan lamang kundi pagpapahayag ng kahulugang hinihingi ng konteksto.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na wikang legal. Pinanatili ang magkatulad na hulma ng dalawang sugnay (“ang sinumang pumatay...”), habang ang “magbabayad-pinsala” ay nagbibigay ng tiyak na diwang legal nang hindi nagiging teknikal o lipas.
