  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: tl
  text: Sa ibabaw ng dalisay na patungan ng mga ilawan ay lagi niyang isaasaayos ang mga ilawan sa harap ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang regular.”
    reason: Pinananatili ang posibleng ritwal na diwa ng תָּמִיד, na maaaring tumukoy sa palagiang regular na pagsasagawa.
lexical_decisions:
- source_word: עַל
  choice: Sa ibabaw ng
  rationale: Ipinahihiwatig ng pang-ukol ang kinalalagyan ng mga ilawan kaugnay ng patungan; likas at malinaw sa Filipino ang “sa ibabaw ng.”
- source_word: הַמְּנֹרָה
  choice: patungan ng ilawan
  rationale: Tumutukoy ito sa natatanging kultikong patungan na kinalalagyan ng mga ilawan, hindi sa isang ilawan lamang.
- source_word: הַטְּהֹרָה
  choice: dalisay
  rationale: Sa kontekstong makasaserdote, tumutukoy ito sa pagiging malinis o dalisay ng sagradong kagamitan; pinananatili ng “dalisay” ang maigsi at marangal na diwa.
- source_word: יַעֲרֹךְ
  choice: aayusin niya
  rationale: Ang pandiwa ay nangangahulugang ilagay o isaayos nang maayos; hindi ito pinalalawak tungo sa pangkalahatang pag-aalaga.
- source_word: הַנֵּרוֹת
  choice: ang mga ilawan
  rationale: Tumutukoy sa mga indibiduwal na ilawang nakalagay sa patungan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na salin ito ng karaniwang kultikong pahayag na nangangahulugang nasa harap o presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: תָּמִיד
  choice: palaging
  rationale: Ipinahihiwatig nito ang tuloy-tuloy o regular na pagsasagawa ng tungkulin; natural sa modernong Filipino ang “palaging.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa Hebreo ang personal na pangalang YHWH; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng תָּמִיד
  choice: palaging
  alternative: nang tuloy-tuloy / nang regular
  rationale: Maaaring ipahiwatig ng salita ang patuloy o palagiang regular na ritwal. Hindi nililinaw nang higit sa teksto kung walang patlang o isinasagawa sa regular na takdang paraan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “patungan ng ilawan” bilang madaling maunawaang katawagan sa menorah at ang panghalip na “niya” sapagkat ang paksa ay ipinagpapatuloy mula sa naunang talata.
