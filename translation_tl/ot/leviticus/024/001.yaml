base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At sinabi ni Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasalin bilang “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive kasama ng pandiwang דבר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, sinabi” at malinaw nitong ipinapakita ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan ng pang-ukol ang taong pinatutungkulan ng pagsasalita; “kay” ang likas na katumbas sa Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalang מֹשֶׁה sa Tagalog.
- source_word: לֵאמֹר
  choice: ipinahiwatig sa kuwit kasunod ng sugnay
  rationale: Ang לֵאמֹר ay isang pormulang Hebreo na nagpapakilala sa tuwirang pananalita. Sa natural na Tagalog, sapat itong katawanin ng pandiwang “sinabi” at ng bantas na nagpapahiwatig na susunod ang mismong sinabi, sa halip na idagdag ang mabigat at paulit-ulit na “na sinasabi.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan, samantalang itinatala sa talababa ang tradisyonal na pamalit na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang karaniwang “sinabi ... kay” sa halip na mas literal ngunit di-likas na “nagsalita ... kay.” Pinanatili ang kuwit sa hulihan dahil ipinakikilala ng talata ang pahayag na sumusunod.
