  text: וְ/הָֽיְתָה֙ לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֔י/ו וַ/אֲכָלֻ֖/הוּ בְּ/מָק֣וֹם קָדֹ֑שׁ כִּ֡י קֹדֶשׁ֩ קָֽדָשִׁ֨ים ה֥וּא ל֛/וֹ מֵ/אִשֵּׁ֥י יְהוָ֖ה חָק עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: tl
  text: Mapupunta ito kay Aaron at sa kanyang mga anak, at kakainin nila ito sa isang banal na lugar, sapagkat ito ay kanyang kabanal-banalang bahagi mula sa mga handog na pinaraan sa apoy para kay Yahweh[a], isang tuntuning magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga handog na pagkain para kay Yahweh.” Ang terminong Hebreo ay tradisyonal na tumutukoy sa mga handog na inihahandog sa pamamagitan ng apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: Mapupunta iyon kay Aaron at sa kanyang mga anak
  rationale: Ang היה na may לְ at tumatanggap ay nagpapahayag ng paglalaan o pag-aari. Likas sa modernong Tagalog ang “mapupunta” para sa bahaging itinakda sa mga pari.
- source_word: וַאֲכָלֻהוּ
  choice: at kakainin nila iyon
  rationale: Pinananatili nito ang legal at nag-uutos na diwa ng anyong Hebreo nang hindi dinaragdagan ng mas tiyak na modal gaya ng “dapat.”
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang pantukoy ang pariralang Hebreo; iniiwasan ng “isang banal na lugar” ang labis na pagtukoy sa isang partikular na silid ng santuwaryo.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ito ang natural at dignified na Tagalog na katumbas ng Hebreong superlatibo, na tumutukoy sa pinakamataas na antas ng kabanalan.
- source_word: הוּא לוֹ
  choice: iyon ay kabanal-banalan para sa kanya
  rationale: Pinananatili ang isahang לֹו sa halip na tahimik itong gawing maramihan, kahit na binanggit din ang mga anak ni Aaron.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: mula sa mga handog na pinaraan sa apoy para kay Yahweh
  rationale: Ipinapakita nito ang tradisyonal at malamang na diwa ng אִשֶּׁה bilang handog na inihahandog sa pamamagitan ng apoy, nang hindi ipinahihiwatig na literal na pagkain ito ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang nasa tekstong Hebreo, sa halip na palitan ng isang titulo.
- source_word: חָק עוֹלָם
  choice: isang tuntunin magpakailanman
  rationale: Natural at malinaw itong legal na pananalita sa Tagalog at pinananatili ang pangmatagalang bisa ng parirala.
theological_decisions:
- issue: Tinutukoy ng isahang לֹו matapos banggitin si Aaron at ang kanyang mga anak
  choice: para sa kanya
  alternative: para sa kanila
  rationale: Isahan ang Hebreo at malamang na tumutukoy kay Aaron bilang kinatawang ulo ng linya ng mga pari. Pinananatili ng salin ang gramatikal na tensiyon sa halip na pakinisin ito bilang maramihan.
- issue: Diwa ng אִשֶּׁה
  choice: mga handog na pinaraan sa apoy
  alternative: mga handog na pagkain
  rationale: Mas tuwirang inilalantad ng napiling salin ang kaugnayan ng tradisyonal na terminong panghandog sa apoy. Inilalagay sa talababa ang alternatibong leksikal na maaaring tumukoy sa handog na pagkain.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “iyon” para sa bagay na tinutukoy ng mga isahang panghalip sa Hebreo, at iniwasan ang mas arkaikong legal na pananalita gaya ng “palatuntunang walang hanggan.”
