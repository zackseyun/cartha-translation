  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: tl
  text: Iisa ang pamantayan ng paghatol ninyo para sa dayuhang naninirahan, gaya ng para sa katutubo, sapagkat ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: iisang pamantayan ng paghatol
  rationale: Ang מִשְׁפָּט ay tumutukoy rito sa umiiral na hatol o tuntuning legal; nililinaw ng “pamantayan ng paghatol” ang hinihinging pantay na paglalapat ng katarungan.
- source_word: גֵּר
  choice: dayuhan
  rationale: Tumutukoy sa dayuhang naninirahan sa piling ng Israel; ang “dayuhan” ay natural at madaling maunawaan sa modernong Filipino nang magdagdag ng katayuang hindi tahasang nasa talata.
- source_word: אֶזְרָח
  choice: katutubo
  rationale: Ipinahahayag ang taong likas na kabilang o ipinanganak sa lupain, bilang katapat ng גֵּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos sa transliterasyong malapit sa anyong Hebreo at malinaw na ipinaiiba sa titulong “Panginoon.”
theological_decisions:
- issue: Saklaw ng pantay na paghatol
  choice: “sa dayuhan at sa katutubo”
  alternative: “maging dayuhan man o katutubo”
  rationale: 'Pinananatili ang tuwirang pagtutumbas ng tekstong Hebreo: iisang legal na pamantayan para sa dalawang pangkat, nang walang idinaragdag na kondisyong teolohikal o panlipunan.'
translation_notes:
  register: Makabagong, marangal, at tuwirang Filipino. Ginamit ang “paiiralin ninyo” upang natural na maipahayag ang Hebreong yihyeh lakhem sa konteksto ng isang legal na utos.
