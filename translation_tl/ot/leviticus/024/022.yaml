  source_fidelity: Ang “iisang pamantayan ng paghatol” ay maayos na tumutugon sa מִשְׁפָּט אֶחָד. Gayunman, ang “paiiralin ninyo” ay nagdaragdag ng mas tuwirang utos at tahasang ahente kaysa sa pahayag na “magiging para sa inyo” sa Hebreo. Ang גֵּר ay mas tumpak na naipapahiwatig bilang dayuhang naninirahan kaysa simpleng “dayuhan,” na maaari ring mangahulugang pansamantalang banyaga.
  naturalness: Mas natural at tuwiran ang “Iisa ang pamantayan ... ninyo” kaysa “ang paiiralin ninyo,” habang pinananatili ang marangal at legal na rehistro. Ang “gaya ng para sa” ay malinaw na naghahayag ng pagtutumbas ng dalawang pangkat.
  terminology: Pinanatili ang “Yahweh” para sa יהוה at “Diyos” para sa אֱלֹהֵיכֶם. Ginamit ang “dayuhang naninirahan” para sa גֵּר at “katutubo” para sa אֶזְרָח, nang hindi ipinapasok ang mga modernong legal na kategoryang gaya ng pagkamamamayan.
  issues:
