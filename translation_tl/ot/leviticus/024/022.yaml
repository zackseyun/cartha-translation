    issue: Ang “paiiralin ninyo” ay mas aktibong utos kaysa sa anyong Hebreo.
    rationale: Ang יִהְיֶה לָכֶם ay literal na nagsasaad na ang iisang pamantayan ay ‘magiging para sa inyo.’ Bagaman legal ang konteksto, hindi kailangang magdagdag ng tahasang ‘ninyo itong paiiralin.’
  - severity: medium
    issue: Masyadong malawak ang “dayuhan” para sa גֵּר.
    rationale: Ang גֵּר ay dayuhang naninirahan sa pamayanan, hindi lamang sinumang banyaga o pansamantalang bisita. Ang paglilinaw ay mahalaga sa legal na pagtutumbas ng talata.
