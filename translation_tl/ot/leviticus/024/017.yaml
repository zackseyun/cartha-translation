  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: tl
  text: At kung ang isang lalaki ay makapatay ng sinumang tao,[a] walang pagsalang papatayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “humampas sa anumang buhay ng tao.” Dito, ang “humampas” ay tumutukoy sa hampas na ikinamatay, at ang “buhay ng tao” ay nangangahulugang isang tao, hindi partikular na isang di-materyal na “kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: At kung ang isang lalaki ay
  rationale: Pinananatili ng “At” ang ugnayan sa naunang batas; ang כִּי ay kondisyonal na “kung,” at ang אִישׁ ay tahasang panlalaking “isang lalaki.”
- source_word: יַכֶּה
  choice: makapatay
  rationale: Ang literal na diwa ay “humampas/manakit,” ngunit sa pariralang ito tumutukoy ito sa hampas na ikinamatay. Likas at malinaw sa modernong Tagalog ang “makapatay,” habang ipinapaliwanag sa talababa ang mas literal na anyo.
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: sinumang tao
  rationale: Ang נֶפֶשׁ אָדָם dito ay isang buhay na taong pinatay, hindi isang hiwalay at di-materyal na “kaluluwa.” Ang “sinumang tao” ay natural at tumutukoy sa tao mismo, hindi sa abstraktong buhay.
- source_word: מוֹת יוּמָת
  choice: walang pagsalang papatayin siya
  rationale: Ang infinitive absolute na kasunod ng pasibong pandiwa ay nagbibigay-diin sa katiyakan ng parusa. Ipinahahayag ng “walang pagsalang” ang diin, at pinananatili ng “papatayin siya” ang pasibong legal na pormula.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa כָּל נֶפֶשׁ אָדָם
  choice: sinumang tao
  alternative: anumang buhay ng tao / sinumang kaluluwa
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa buhay na tao o persona, hindi partikular sa isang di-materyal na kaluluwa.
- issue: Panlalaking anyo ng אִישׁ
  choice: isang lalaki
  alternative: sinuman / isang tao
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebreo sa gumagawa ng krimen, nang hindi ginagawang panlalaki ang generic na אָדָם na tumutukoy sa biktima.
- issue: Lakas ng utos sa מוֹת יוּמָת
  choice: walang pagsalang papatayin siya
  alternative: dapat siyang patayin
  rationale: Pinananatili nito ang mariing katiyakan ng pormulang Hebreo nang hindi nagpapasok ng paliwanag tungkol sa tagapagpatupad o paraan ng parusa.
translation_notes:
  register: Makabago ngunit marangal na legal na Tagalog. Ginamit ang “makapatay” para sa malinaw at likas na pagpapahayag ng nakamamatay na diwa ng יַכֶּה; inilagay sa talababa ang literal na larawan at ang saklaw ng נֶפֶשׁ.
