id: LEV.24.6
reference: Leviticus 24:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֥ אוֹתָ֛/ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽ/מַּעֲרָ֑כֶת עַ֛ל הַ/שֻּׁלְחָ֥ן הַ/טָּהֹ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: tl
  text: At ilalagay mo ang mga iyon sa dalawang hanay[a], tig-anim sa bawat hanay, sa ibabaw ng dalisay na mesa sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa dalawang salansan” o “sa dalawang maayos na pagkakaayos”; tumutukoy ang salitang Hebreo sa organisadong pagkakalagay ng mga tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: At ilalagay mo
  rationale: Ang שׂוּם ay nangangahulugang ‘ilagay’ o ‘itakda.’ Pinananatili ng anyong ito ang tuwirang utos sa ikalawang panauhang panlalaki habang natural sa makabagong Tagalog.
- source_word: אוֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip na layon sa labindalawang tinapay sa naunang talata.
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: sa dalawang hanay
  rationale: Ang מַעֲרָכָה ay isang maayos na pagkakaayos o pangkat. Ang ‘hanay’ ang pinakanatural sa konteksto ng mga tinapay sa mesa, bagaman maaari ring tumukoy sa dalawang salansan.
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: tig-anim sa bawat hanay
  rationale: 'Distributibo ang diwa ng parirala: anim na tinapay sa bawat isa sa dalawang pagkakaayos. Malinaw itong naipapahayag ng ‘tig-anim.’'
- source_word: עַל הַשֻּׁלְחָן
  choice: sa ibabaw ng ... mesa
  rationale: Tahasang ipinapahayag nito ang lokasyong ‘on/upon’ at iniiwasan ang posibleng kalabuan ng simpleng ‘sa mesa.’
- source_word: הַטָּהֹר
  choice: dalisay
  rationale: Sa kontekstong pangsantuwaryo, ang טָהוֹר ay tumutukoy sa ritwal na kadalisayan, hindi lamang sa karaniwang pisikal na kalinisan.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay ‘sa harap ng’ o ‘sa presensya ng.’ Ang ‘sa harap ni Yahweh’ ay maikli, natural, at tapat sa wikang pangkulto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng pang-uring pangkulto na הַטָּהֹר
  choice: dalisay na mesa
  alternative: malinis na mesa
  rationale: Mas malinaw na ipinahihiwatig ng ‘dalisay’ ang ritwal na kalagayan ng kagamitang pansantuwaryo, samantalang maaaring unawain ang ‘malinis’ bilang pisikal na kalinisan lamang.
translation_notes:
  register: Makabago at dignified na Filipino; tuwiran ang anyong pang-utos at pinananatili ang bokabularyong pangsantuwaryo. Ginamit ang ‘mga iyon’ upang malinaw na tumukoy pabalik sa mga tinapay, at ‘tig-anim’ upang natural na ipahayag ang distributibong diwa.
