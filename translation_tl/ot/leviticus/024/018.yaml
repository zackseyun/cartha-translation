translation:
  language: tl
  text: 'At ang sinumang pumatay ng hayop ay dapat magbigay ng kabayaran para rito: buhay kapalit ng buhay[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “buhay kapalit ng buhay.” Sa kontekstong ito ng pagbibigay ng kabayaran para sa isang hayop, ipinahihiwatig ng parirala ang katumbas na kabayaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: At ang sinumang pumatay
  rationale: Ang Hiphil participle ng נכה ay naglalahad ng pangkalahatang kasong legal. Dahil נֶפֶשׁ בְּהֵמָה ang tuwirang layon, nakamamatay na pananakit ang tinutukoy; natural at malinaw ito bilang “pumatay” sa Filipino.
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: ng hayop
  rationale: Sa pariralang ito, ang נֶפֶשׁ ay tumutukoy sa buhay ng hayop at ginagawang nakamamatay ang kahulugan ng pandiwa. Hindi kailangang isalin bilang “kaluluwa,” na maaaring magpasok ng hindi angkop na antropolohikal na diwa.
- source_word: בְּהֵמָה
  choice: hayop
  rationale: Pangkalahatang katawagan ito para sa hayop; bagaman maaaring pag-aaring hayop ang nasa konteksto, hindi kailangang paliitin ang saklaw sa “alagang hayop” o “hayupan.”
- source_word: יְשַׁלְּמֶנָּה
  choice: ay dapat magbayad para rito
  rationale: Ang Piel ng שלם ay nangangahulugang magbigay ng kabayaran o magsauli ng katumbas. Ang hulaping pambabae ay tumutukoy pabalik sa בְּהֵמָה, kaya malinaw ang “para rito.”
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: buhay kapalit ng buhay
  rationale: Pinananatili nito ang maikli at balanseng pormula ng Hebreo. Ang “kapalit ng” ay likas na salin ng תַּחַת sa kontekstong legal at hindi paunang nagtatakda kung materyal, salapi, o mismong hayop ang kabayaran.
theological_decisions:
- issue: Kahulugan ng pormula ng kabayaran sa batas tungkol sa hayop
  choice: Katumbas na kabayaran ang hinihingi sa pagpatay ng hayop, habang pinananatili ang pormulang “buhay kapalit ng buhay.”
  alternative: Maaaring unawain ang pormula bilang mahigpit na pag-aatas na magbigay ng isa pang hayop kapalit ng napatay, o bilang alingawngaw ng mas malawak na lex talionis na naisasagawa rito sa materyal o salaping kabayaran.
  rationale: Ang יְשַׁלְּמֶנָּה, “magbayad/magbigay ng kabayaran para rito,” ang gumagabay sa pagbasa. Hindi tinutukoy ng talata ang eksaktong paraan ng kabayaran, kaya hindi iyon dapat idagdag sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapat” para sa obligasyong legal at ang “magbayad para rito” bilang natural na pagpapahayag ng restitution, nang hindi nililimitahan ang kabayaran sa salapi.
