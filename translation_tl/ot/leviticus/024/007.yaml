base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: tl
  text: Maglalagay ka ng purong kamanyang sa ibabaw ng bawat hanay[a], at ito ay magiging bahaging pang-alaala para sa tinapay, isang handog na sinusunog[b] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabaw ng pagkakaayos.” Sa konteksto, tumutukoy ito sa maayos na mga hanay ng tinapay.
    reason: lexical_alternative
  - marker: b
    text: O “isang handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Maglalagay ka
  rationale: Ang anyong pandiwa na may waw sa konteksto ng mga tagubiling panritwal ay nagpapahayag ng utos; natural sa modernong Tagalog ang “Maglalagay ka.”
- source_word: עַל הַמַּעֲרֶכֶת
  choice: sa ibabaw ng bawat hanay
  rationale: Ang מַעֲרֶכֶת ay isang inayos na hanay o pagkakaayos. Batay sa naunang talata, nahahati ang mga tinapay sa dalawang hanay, kaya distributibo ang “bawat hanay,” habang itinatala sa talababa ang mas literal na posibilidad.
- source_word: לְבֹנָה זַכָּה
  choice: purong kamanyang
  rationale: Ang לְבֹנָה ay frankincense, na karaniwang tinatawag na “kamanyang” sa Tagalog, at ang זַכָּה ay tumutukoy sa kalinisan o kadalisayan nito.
- source_word: וְהָיְתָה לַלֶּחֶם
  choice: at iyon ang magiging ... para sa tinapay
  rationale: Ipinahihiwatig ng pambabaeng isahan na pandiwa ang kamanyang bilang paksa; ang “iyon” ay malinaw at natural sa Tagalog. Kolektibo ang “tinapay” sa konteksto.
- source_word: לְאַזְכָּרָה
  choice: bahaging pang-alaala
  rationale: Isa itong terminong panhandog para sa kinatawang bahaging inihahandog bilang pag-alaala; pinananatili ng salin ang panritwal na tungkulin nito.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Sa bokabularyong pangsaserdote, tumutukoy ito sa handog na inihahandog sa pamamagitan ng apoy. Iniiwasan ng parirala ang implikasyong kailangang buong handog ang sunugin.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton; ang “para kay” ay natural sa Tagalog para sa tumatanggap ng handog.
theological_decisions:
- issue: Pagbibigay-salin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng אַזכרה sa ritwal
  choice: bahaging pang-alaala
  alternative: alaala; paalaala
  rationale: Pinananatili nito ang panhandog na diwa ng terminong tumutukoy sa kinatawang bahagi, nang hindi tiyakang nilulutas kung kanino o sa anong paraan gumagana ang “pag-alaala.”
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Malapit sa tradisyonal at kontekstuwal na diwa ang pangunahing salin, ngunit kinikilala sa talababa ang mahalagang alternatibong pag-unawa sa teknikal na terminong ito.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na wikang Tagalog. Pinanatili ang teknikal na panritwal na diwa sa “bahaging pang-alaala” at ipinaliwanag sa mga talababa ang mahahalagang alternatibong leksikal.
