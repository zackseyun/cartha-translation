base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: tl
  text: “Utusan mo ang mga anak ni Israel[a] na dalhan ka nila ng dalisay na langis ng oliba mula sa mga olibang dinikdik[b] para sa ilaw, upang manatiling nakasindi ang isang ilawan nang palagian.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita” o “sambayanang Israel.” Literal sa Hebreo, “mga anak ni Israel,” isang nakaugaliang katawagang pangtipan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “dalisay na langis ng oliba, dinikdik.” Tinutukoy ng Hebreo ang kadalisayan ng langis at ang langis na galing sa mga olibang dinikdik.
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo ay maaari ring mangahulugang “nang regular.”
    reason: ambiguity
lexical_decisions:
- source_word: צַו
  choice: Utusan mo
  rationale: Tuwirang pautos ang pandiwang Hebreo at ipinahahayag nito ang awtoridad ng tagubilin nang natural sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang literal at nakaugaliang katawagang pangtipan sa Hebreo; ipinaliliwanag sa talababa ang mas idyomatikong katumbas.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: na dalhan ka nila
  rationale: Bagaman karaniwang nangangahulugang ‘kumuha’ ang לקח, ang pariralang may ‘sa iyo’ ay natural na tumutukoy sa pagdadala o paglalaan para kay Moises.
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: dalisay na langis mula sa mga olibang dinikdik
  rationale: Malinaw na pinananatili ang pinagmulan ng langis, ang kadalisayan nito, at ang paraang pagdikdik sa mga oliba.
- source_word: לַמָּאוֹר
  choice: para sa ilaw
  rationale: Malapit sa kahulugang liwanag o pagpapailaw at hindi ipinapalagay na mismong kandelero ang tinutukoy.
- source_word: לְהַעֲלֹת נֵר
  choice: upang panatilihing nagniningas ang isang ilawan
  rationale: Likas na Tagalog para sa Hebreong idyoma na literal na ‘paakyatin ang ilawan/apoy,’ na sa konteksto ay tumutukoy sa pagpapasindi at pagpapanatiling nakasindi nito.
- source_word: תָּמִיד
  choice: sa lahat ng panahon
  rationale: Ipinahahayag ang patuloy o palagiang tungkulin, habang kinikilala sa talababa na maaari rin itong tumukoy sa regular na pagganap.
theological_decisions:
- issue: Ang nakaugaliang panlalaking katawagang pangtipan na בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita / ang sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang anyong Hebreo nang hindi ipinapakahulugang mga lalaki lamang ang kabuuang kausap; ibinibigay sa talababa ang mga likas na alternatibo sa Tagalog.
- issue: Saklaw ng תָּמִיד sa gawaing pangsantuwaryo
  choice: sa lahat ng panahon
  alternative: palagian / nang regular
  rationale: Hindi tahasang nilulutas kung ang diin ay walang patid na pagliyab o regular at patuloy na pagsasagawa; binabanggit ang saklaw ng kahulugan sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ilawan,” hindi “kandila,” upang tumugma sa sinaunang sisidlang may langis. Pinanatili ang pormal na katawagang “mga anak ni Israel,” ngunit nilinaw ang idyomatikong kahulugan sa talababa.
