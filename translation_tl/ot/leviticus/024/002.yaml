  source_fidelity: 'Ang pangunahing kahulugan ay naipapahayag nang wasto: isang utos sa mga anak ni Israel na magdala kay Moises ng dalisay na langis ng oliba na mula sa dinikdik na oliba, para sa ilaw at sa palagiang pagpapaningas/pagpapanatiling nakasindi ng ilawan. Gayunman, ang “nagniningas” ay masidhi at karaniwang nagpapahiwatig ng malaking liyab, samantalang ang Hebreong נֵר ay ilawang de-langis. Ang “sa lahat ng panahon” ay hindi likas na katumbas ng תָּמִיד sa kontekstong ito at maaaring magpahiwatig ng bawat panahon o lahat ng kapanahunan.'
  naturalness: Mas likas sa makabagong Tagalog ang “dalisay na langis ng oliba mula sa mga olibang dinikdik” kaysa “langis mula sa mga olibang dinikdik,” at “manatiling nakasindi ang isang ilawan nang palagian” kaysa “panatilihing nagniningas ... sa lahat ng panahon.”
  terminology: Ang “mga anak ni Israel” ay angkop na malapit na salin ng בְּנֵי יִשְׂרָאֵל, na may idyomatikong mga alternatibo sa talababa. Ang “ilawan” ay wastong termino para sa נֵר at mas angkop kaysa “kandila.” Ang “dalisay” para sa זָךְ at “dinikdik” para sa כָּתִית ay kapwa katanggap-tanggap.
