base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: tl
  text: Ang anak ng isang babaeng Israelita, na ang ama ay isang lalaking Ehipsiyo, ay lumabas at pumunta sa gitna ng mga anak ni Israel[a]. Sa kampo, nag-away[b] ang anak ng babaeng Israelita at isang lalaking Israelita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa gitna ng mga Israelita.” Ang literal na Hebreo ay “sa gitna ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O, “nagtalo.” Maaaring tumukoy ang pandiwa sa isang pagtatalo o sa isang labanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang salaysay na katumbas ng יצא; hindi tinutukoy kung saan siya nanggaling, gaya rin ng Hebreo.
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: ang anak ng isang babaeng Israelita
  rationale: Pinananatili ang pagkakakilanlan batay sa kaniyang ina at ang tiyak na pagtukoy sa lalaking muling babanggitin sa talata.
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: na ang ama ay isang lalaking Ehipsiyo
  rationale: Likas sa makabagong Tagalog at malinaw na ipinapahayag ang ugnayang paternal na nasa Hebreo, nang hindi nagdaragdag ng ibang impormasyon.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa gitna ng mga anak ni Israel
  rationale: Pinananatili ang pormal na pambansang katawagang 'mga anak ni Israel' at ang diwa ng בְּתוֹךְ na 'sa gitna ng.'
- source_word: וַיִּנָּצוּ
  choice: nag-away
  rationale: Maaaring tumukoy ang pandiwa sa alitan o aktuwal na labanan. Ang 'nag-away' ay likas sa Tagalog at hindi tiyak kung pasalita lamang o pisikal ang tunggalian.
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Tuwirang lokatibong salin ng tagpuan sa kampo ng Israel.
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: ang anak ng babaeng Israelita
  rationale: Pinananatili ang paulit-ulit na katawagan sa Hebreo para sa diin at malinaw na pagkakakilanlan.
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: at isang lalaking Israelita
  rationale: Likas na Tagalog na nagpapakita ng kaibahan sa lalaking may inang Israelita at amang Ehipsiyo.
theological_decisions:
- issue: May kasariang pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pormal at tipanang anyo ng Hebreo sa pangunahing teksto; inilalagay sa talababa ang mas idiomatikong pambansang katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging madaling basahin, ngunit pinanatili ang pagkakasunod ng mga pangyayari at ang pag-uulit sa pagkakakilanlan ng lalaki. Itinama ang pagkakalagay ng mga panandang talababa ayon sa mismong mga salitang tinatalakay ng bawat tala.
