  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: tl
  text: Inilagay nila siya sa kustodiya upang linawin[a] sa kanila ayon sa salita ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipaliwanag” o “malinaw na ipahayag.” Walang tahasang binanggit sa Hebreo kung ano ang lilinawin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: Kaya ikinulong nila siya
  rationale: Ang causative na anyo ng נוח ay nangangahulugang ilagay o panatilihin; sa kontekstong legal, ipinahihiwatig ng kasunod na בַּמִּשְׁמָר na siya ay ikinustodiya o ipiniit. Ang “Kaya” ay natural na nag-uugnay sa pagpapatuloy ng salaysay.
- source_word: בַּמִּשְׁמָר
  choice: ikinulong
  rationale: Tumutukoy ang מִשְׁמָר dito sa pagbabantay na may pagpigil sa kalayaan, hindi lamang sa pagmamasid. Sa modernong Tagalog, malinaw at natural na ipinahahayag ito ng “ikinulong” sa kontekstong ito.
- source_word: לִפְרֹשׁ
  choice: linawin
  rationale: Ang פרשׁ ay maaaring mangahulugang gawing malinaw, ipaliwanag, o tahasang ipahayag. Pinananatili ng “linawin” ang lawak ng kahulugan nang hindi tiyak na ipinapalagay kung paliwanag o pormal na pasiya ang hinihintay.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Likas na katumbas ito ng panghalip na tumutukoy sa mga naghihintay ng paglilinaw.
- source_word: עַל־פִּי
  choice: ayon sa salita ni
  rationale: Ang idyomang literal na “ayon sa bibig ng” ay tumutukoy sa isang makapangyarihang pahayag. Pinananatili ng “ayon sa salita ni” ang pandiwang diwa nito nang hindi agad nililimitahan sa “utos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Hindi tahasang binanggit ang bagay na lilinawin
  choice: ang usapin
  alternative: ang pasiya o ang dapat gawin
  rationale: Walang tahasang layon ang לִפְרֹשׁ sa Hebreo. Ang “usapin” ay isang pangkalahatang dagdag na kailangan para sa natural na Tagalog at hindi nito ipinipirmi kung paliwanag, utos, o hudisyal na pasiya ang ibibigay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ikinulong” bilang natural na paglalarawan ng pagkakapiit sa ilalim ng pagbabantay. Ang “habang hinihintay” ay nagpapahayag ng layunin at pansamantalang kalagayan na ipinahihiwatig ng infinitive sa konteksto, samantalang ang talababa ay nagpapanatili sa leksikal at sintaktikong kalabuan ng Hebreo.
