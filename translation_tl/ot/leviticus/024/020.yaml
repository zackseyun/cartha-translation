  text: שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּ/אֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽ/אָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: tl
  text: Bali kapalit ng bali, mata kapalit ng mata, ngipin kapalit ng ngipin; kung paanong nagdulot siya ng pinsala[a] sa isang tao[b], gayon din ang idudulot sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapintasan” o “pagkasira ng anyo.” Literal na gumagamit ang Hebreo ng idyomang “magbigay ng kapintasan/pinsala.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa isang tao.” Ginagamit dito ang pang-isahang “tao” bilang kinatawan ng sinumang tao sa batas na ito.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: bali
  rationale: Tumutukoy ito sa pagkabali o bali sa katawan sa kontekstong legal; ang “bali” ang pinakatiyak at likas na katumbas sa modernong Filipino.
- source_word: תַּחַת
  choice: kapalit ng
  rationale: Sa pormulang legal na ito, ipinapahayag ng salita ang katumbas na ganti o kabayaran. Nililinaw ng “kapalit ng” ang ugnayan nang hindi ginagawang abstrakto ang kongkretong pormula.
- source_word: עַיִן
  choice: mata
  rationale: Tuwirang katawagang anatomiko na pinanatili sa pormulang legal.
- source_word: שֵׁן
  choice: ngipin
  rationale: Tuwirang katawagang anatomiko na pinanatili sa pormulang legal.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: kung paanong ... gayon din
  rationale: Likas at marangal na paghahambing sa Filipino na pinananatili ang simetriya ng sanhi at katumbas na resulta.
- source_word: יִתֵּן מוּם
  choice: nagdulot ... ng pinsala
  rationale: Literal na gumagamit ang Hebreo ng pandiwang “magbigay” kasama ng “kapintasan/pinsala.” Ang “nagdulot ng pinsala” ay malinaw na Filipino para sa idyomang ito at akma sa batas tungkol sa pananakit.
- source_word: מוּם
  choice: pinsala
  rationale: Maaaring mangahulugan ng pisikal na kapintasan, depekto, o pagkasira ng anyo. Sa konteksto ng pinsalang ginawa ng isang tao sa iba, ang “pinsala” ang pinakamalawak ngunit natural na salin.
- source_word: אָדָם
  choice: tao
  rationale: Dito ay kinatawang pang-isahan para sa sinumang tao sa isang kasong legal; natural at tumpak ang walang-kasariang “tao” sa Filipino.
- source_word: יִנָּתֶן בּוֹ
  choice: idudulot sa kanya
  rationale: Pinananatili ng anyong balintiyak ang hindi tahasang binanggit na tagagawa at inuugnay ang kaparusahan sa naunang “pinsala,” nang hindi tinutukoy kung paano ito ipatutupad.
theological_decisions:
- issue: Likas ng pormulang lex talionis
  choice: 'Panatilihin ang kongkretong pormula: “bali kapalit ng bali, mata kapalit ng mata, ngipin kapalit ng ngipin.”'
  alternative: “pinsalang katumbas ng pinsala” o tahasang salaping kabayaran
  rationale: Kongkreto at tumbasan ang anyo ng Hebreo. Hindi dapat ipasok sa salin kung literal na pagganti o ibang uri ng katumbas na legal na kabayaran ang eksaktong paraan ng pagpapatupad.
- issue: Saklaw ng אָדָם
  choice: tao
  alternative: lalaki
  rationale: Ang salita ay pangkalahatang tumutukoy sa isang taong napinsala sa batas na ito, hindi partikular sa isang lalaking nasa hustong gulang.
- issue: Hindi tahasang tagagawa sa huling sugnay
  choice: Gamitin ang balintiyak na “idudulot sa kanya.”
  alternative: “dudulutan siya ng hukuman” o “dudulutan siya ng gumaganti”
  rationale: Balintiyak ang Hebreo at hindi nito tahasang pinapangalanan ang nagpapatupad. Pinananatili ng salin ang gayong kawalan ng katiyakan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “kapalit ng” upang maging natural ang pormulang tumbasan, at iniwasang tukuyin ang paraan o tagapagpatupad ng hatol na hindi tahasang sinasabi ng Hebreo.
