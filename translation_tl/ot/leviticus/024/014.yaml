base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: tl
  text: “Ilabas mo sa labas ng kampo ang taong sumumpa[a]. Ipatong ng lahat ng nakarinig ang kanilang mga kamay sa ulo niya[b], at batuhin siya ng buong kapulungan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang lumapastangan” o “ang taong lumapastangan.” Literal na tinutukoy ng Hebreo ang “taong sumumpa.”
    reason: alternative_reading
  - marker: b
    text: Malamang na ang pagpapatong ng mga kamay dito ay pormal na pagkilala ng mga saksi sa nagkasala, bagaman may mga nagpapakahulugan din dito bilang isang kilos na may simbolikong kahulugan.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: Ilabas mo
  rationale: Ang Hifil na pautos ng יצא ay nangangahulugang ipalabas o dalhin palabas ang isang tao. Likas at tuwiran sa Tagalog ang “Ilabas mo” kasunod ng pariralang tumutukoy sa labas ng kampo.
- source_word: הַמְקַלֵּל
  choice: ang taong sumumpa
  rationale: Ang participle ng קלל ay literal na tumutukoy sa taong sumumpa. Pinananatili nito ang leksikal na diwa nang hindi agad ipinakahulugang “lumapastangan,” bagaman iyon ang ipinahihiwatig ng konteksto.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa kampo
  rationale: Kasama ng pandiwang “Ilabas,” natural na ipinahahayag ng “sa kampo” ang pagdadala sa labas ng kampo; ang “labas” ay nasa pandiwa na kaya iniiwasan ang alanganing pag-uulit.
- source_word: וְסָמְכוּ
  choice: Ipatong ... ang kanilang mga kamay
  rationale: Ang סמך na may mga kamay at ulo ay karaniwang kilos ng pagpapatong ng kamay. Ang pautos na ayos ay nagpapatuloy sa puwersa ng unang utos.
- source_word: כָל הַשֹּׁמְעִים
  choice: ng lahat ng nakarinig
  rationale: Tumutukoy ang participle sa lahat ng nakarinig sa sinabi. Hindi nilalagyan ng tahasang layon upang mapanatili ang anyo at saklaw ng Hebreo.
- source_word: יְדֵיהֶם עַל רֹאשׁוֹ
  choice: ang kanilang mga kamay sa ulo niya
  rationale: Pinananatili ang maramihang “mga kamay” at ang isahang “ulo,” sa natural na ayos ng Tagalog.
- source_word: וְרָגְמוּ אֹתוֹ
  choice: batuhin siya
  rationale: Ang רגם ay karaniwang pandiwa para sa pagpatay sa pamamagitan ng pagbato. Ang “batuhin siya” ang tuwiran at malinaw na katumbas sa Tagalog.
- source_word: כָל הָעֵדָה
  choice: ng buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong pamayanan ng Israel. Ang “buong kapulungan” ay pormal ngunit madaling maunawaan at pinananatili ang sama-samang katangian ng kilos.
theological_decisions:
- issue: Kung tatawagin ang nagkasala na “taong sumumpa” o “lumapastangan”
  choice: ang taong sumumpa
  alternative: ang lumapastangan / ang taong lumapastangan
  rationale: Ang mismong salitang Hebreo ay participle ng קלל, “sumumpa.” Dahil ang mas malawak na konteksto ay tungkol sa pagsumpa sa Pangalan, lehitimong interpretasyon ang “lumapastangan,” ngunit inilalagay ito sa talababa upang hindi palitan ang mas tuwirang leksikal na diwa.
- issue: Kahulugan ng pagpapatong ng mga kamay
  choice: Panatilihin lamang sa pangunahing teksto ang literal na kilos
  alternative: Ipaliwanag ito bilang pormal na pagkilala ng mga saksi o bilang simbolikong paglilipat ng pananagutan
  rationale: Iniuutos ng talata ang kilos ngunit hindi nito tahasang ipinaliliwanag ang kahulugan. Kaya hindi pinipili sa pangunahing teksto ang alinmang teolohikal o ritwal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” upang mapanatili ang pormal at panlahatang diwa ng עֵדָה. Nasa pangunahing teksto ang lahat ng marker na [a] at [b], at sadyang hindi ipinaliwanag doon ang simbolismo ng pagpapatong ng mga kamay.
