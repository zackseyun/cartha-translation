- from: Kumuha ka ng pinong harina at ihurno mo iyon upang maging labindalawang tinapay[a]. Dalawang ikasampu ng efa[b] ang gagamitin sa bawat tinapay.
  to: Kumuha ka ng pinong harina at ihurno mo ito bilang labindalawang tinapay[a]. Ang bawat tinapay ay dapat may dalawang ikasampu ng efa[b].
  rationale: Inayos ang pangungusap tungkol sa sukat upang maipahayag ang distributibong predikasyon ng Hebreo nang walang idinagdag na ideya ng “paggamit.” Pinalitan ang idyomang “upang maging” ng mas tuwirang “bilang.” Inalis ang “bibingka” sa talababa dahil hindi ito neutral na lexical alternative para sa sinaunang Hebreong ritwal na tinapay.
