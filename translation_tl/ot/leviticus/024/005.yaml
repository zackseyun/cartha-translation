  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: tl
  text: Kumuha ka ng pinong harina at ihurno mo ito bilang labindalawang tinapay[a]. Ang bawat tinapay ay dapat may dalawang ikasampu ng efa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “labindalawang keyk.” Ang salitang Hebreo ay maaaring tumukoy sa mga nilutong yunit ng tinapay na ginagamit sa ritwal.
    reason: lexical_alternative
  - marker: b
    text: Literal na “dalawang ikasampu.” Sa mga panukat sa tekstong makasaserdote, nangangahulugan ito ng dalawang ikasampu ng isang efa para sa bawat tinapay.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kumuha ka
  rationale: Ang anyong pandiwa na may pang-ugnay ay nagsisilbing utos sa sunod-sunod na tagubilin. Likas sa makabagong Tagalog ang tuwirang pautos na “Kumuha ka.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang katawagan sa masinsing sinalang o pinong harina na ginagamit sa mga handog at banal na tinapay; hindi tinukoy ng Hebreo ang uri ng butil.
- source_word: וְאָפִיתָ אֹתָהּ
  choice: at ihurno mo iyon upang maging
  rationale: Ang pambabaeng panghalip ay tumutukoy sa harina. Ipinapahayag ng “upang maging” ang bunga ng paghurno sa natural na Tagalog nang hindi binabago ang kilos.
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: labindalawang tinapay
  rationale: Ang חַלּוֹת ay mga hiwa-hiwalay na yunit ng nilutong tinapay sa ritwal na konteksto. Pinakamalinaw at pinakanatural sa modernong Tagalog ang “mga tinapay,” habang inilalagay sa talababa ang posibleng “mga bibingka.”
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: dalawang ikasampu ng efa
  rationale: Literal itong “dalawang ikasampu,” na sa panukat ng tekstong makasaserdote ay tumutukoy sa dalawang ikasampu ng isang efa. Isinama ang ipinahihiwatig na pamantayang yunit para maging malinaw.
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: ang gagamitin sa bawat tinapay
  rationale: 'Literal na “ang isang tinapay ay magiging,” ngunit distributibo ang diwa: ang itinakdang dami ay para sa bawat isa sa labindalawang tinapay. Ang “bawat tinapay” ang likas na katumbas sa Tagalog.'
