  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: tl
  text: Ang sinumang lumapastangan sa pangalan ni Yahweh ay tiyak na papatayin[a]; tiyak na babatuhin siya ng buong kapulungan. Ang dayuhang naninirahan man o ang katutubo, kapag lumapastangan sa Pangalan[b], ay papatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang pandiwang Hebreo bilang “bigkasin nang malinaw ang pangalan ni Yahweh” o “sumumpa o manlait laban sa pangalan ni Yahweh.” Sa kontekstong ito, maaari itong tumukoy sa mapamusong pagbigkas o paglapastangan sa banal na pangalan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang Pangalan.” Nakatayo itong mag-isa bilang magalang na pantukoy sa banal na pangalan.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב
  choice: lumapastangan
  rationale: Sa kontekstong legal, ipinahihiwatig ng נקב ang mapanlait o mapamusong paggamit sa banal na pangalan. Likas sa makabagong Tagalog ang “lumapastangan,” ngunit pinananatili sa talababa ang tunay na kalabuan ng pandiwa.
- source_word: שֵׁם יְהוָה
  choice: pangalan ni Yahweh
  rationale: Tuwirang isinasalin ang שֵׁם bilang “pangalan” at ang tetragrammaton bilang “Yahweh,” ang personal na pangalan ng Diyos sa tekstong Hebreo.
- source_word: מֹות יוּמָת
  choice: tiyak na papatayin
  rationale: Ang infinitive absolute na kasunod ng finite passive verb ay nagbibigay-diin sa katiyakan at bisa ng hatol na kamatayan; pinananatili rin ng “papatayin” ang tinig na balintiyak.
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: tiyak na babatuhin siya
  rationale: Ang magkaugnay na infinitive absolute at finite verb ay mariing nag-uutos ng pagbato; isinasama ng “siya” ang object suffix ng בּוֹ.
- source_word: כָּל הָעֵדָה
  choice: buong kapulungan
  rationale: Ang עֵדָה ay ang nagkakatipong pamayanan ng Israel sa kontekstong pampubliko at legal. Dignified at malinaw sa Tagalog ang “kapulungan.”
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: ang dayuhang naninirahan at ang katutubo
  rationale: Ang גֵּר ay residenteng hindi katutubo, hindi lamang panandaliang bisita; ang אֶזְרָח naman ay katutubo sa lupain o pamayanan.
- source_word: בְּנָקְבוֹ שֵׁם
  choice: kapag nilapastangan nila ang Pangalan
  rationale: Ang בְּ na may infinitive construct ay temporal dito. Ginamit ang maramihang “nila” upang natural na tumukoy sa alinman sa dalawang uring nabanggit, at “Pangalan” sapagkat nakatayong mag-isa bilang magalang na pantukoy sa banal na pangalan.
theological_decisions:
- issue: Pagsasalin sa יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo mismo ang tetragrammaton; ang “Yahweh” ay direktang kumakatawan sa personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng נקב kapag tuwirang layon ang banal na pangalan
  choice: lumapastangan
  alternative: bumigkas; sumumpa o manlait
  rationale: Pinakamalinaw na ipinahahayag ng “lumapastangan” ang kasalanang legal sa konteksto, nang hindi ipinapalagay na ang simpleng pagbigkas lamang sa pangalan ang ipinagbabawal. Inilalahad sa talababa ang leksikal na kalabuan.
- issue: Saklaw ng parusang legal
  choice: pareho para sa dayuhang naninirahan at katutubo
  alternative: wala
  rationale: Hayagang pinapantay ng Hebreo ang גֵּר at אֶזְרָח sa ilalim ng hatol; hindi dinaragdagan o nililimitahan ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na legal na Tagalog. Ginamit ang “tiyak na” upang katawanin ang mariing mga pormulang Hebreo, at “dayuhang naninirahan” upang iwasan ang maling pahiwatig na pansamantalang bisita lamang ang גֵּר.
