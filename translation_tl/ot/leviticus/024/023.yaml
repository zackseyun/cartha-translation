revisions:
- from: Kaya nagsalita si Moises sa mga Israelita. Inilabas nila sa kampo ang taong sumumpa[a] at pinagbabato siya. Ginawa ng mga Israelita ang iniutos ni Yahweh kay Moises.
  to: Nagsalita si Moises sa mga Israelita, at inilabas nila sa labas ng kampo ang taong sumumpa[a] at binato nila siya ng mga bato. Ginawa ng mga Israelita ang iniutos ni Yahweh kay Moises.
  rationale: Inalis ang “Kaya,” na hindi kinakailangan para sa payak na pang-ugnay na Hebreo, at pinalitan ang malabong “sa kampo” ng “sa labas ng kampo.” Pinalitan din ang “pinagbabato siya” ng natapos na anyong “binato nila siya ng mga bato,” na mas malinaw na tumutugma sa kilos at sa tahasang “bato” sa pinagmulan. Walang idinagdag na interpretasyong doktrinal o detalye hinggil sa resulta ng pagbato.
