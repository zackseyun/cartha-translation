    issue: Malabo ang pariralang “Inilabas nila sa kampo.”
    rationale: Ang “sa kampo” ay maaaring basahing patutunguhan ng paglalabas, samantalang malinaw na ang Hebreong מִחוּץ לַמַּחֲנֶה ay “sa labas ng kampo.”
  - severity: low
    issue: Hindi ganap na naipahahayag ng “pinagbabato siya” ang tahasang pangngalang “bato.”
    rationale: May אָבֶן kasunod ng pandiwang “batuhin” sa Hebreo. Ang “binato nila siya ng mga bato” ay natural pa rin at mas malinaw na pinananatili ang ekspresyong ito.
