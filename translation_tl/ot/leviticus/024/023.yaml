base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: tl
  text: Nagsalita si Moises sa mga Israelita, at inilabas nila sa labas ng kampo ang taong sumumpa[a] at binato nila siya ng mga bato. Ginawa ng mga Israelita ang iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang taong lumapastangan.” Sa literal, ang Hebreo ay “ang taong sumumpa,” na tumutukoy sa lalaking sumumpa sa banal na Pangalan sa naunang salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nagsalita
  rationale: Ang piel ng דבר ay karaniwang nangangahulugang “magsalita”; natural ito para sa pagsasalita ni Moises sa bayan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na modernong Tagalog para sa Hebreong idyomang “mga anak na lalaki ni Israel,” na tumutukoy sa bayang Israel.
- source_word: וַיּוֹצִיאוּ ... מִחוּץ לַמַּחֲנֶה
  choice: Inilabas nila sa kampo
  rationale: Ipinahahayag ng hiphil ng יצא ang pagpapalabas, at ang “inilabas ... sa kampo” ay natural na Tagalog para sa pagdadala sa labas ng kampo.
- source_word: הַמְקַלֵּל
  choice: ang taong sumumpa
  rationale: Pinananatili nito ang tuwirang kahulugan ng participle mula sa קלל, “ang sumumpa,” sa halip na ilagay agad sa pangunahing teksto ang mas interpretatibong “lumapastangan.”
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: pinagbabato siya
  rationale: Ang “pinagbabato” ay likas na Tagalog na malinaw na nagpapahiwatig ng paulit-ulit na pagbato gamit ang mga bato, kaya naihahatid ang buong Hebreong pahayag nang hindi paulit-ulit sa Tagalog.
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: Ginawa ... ang iniutos
  rationale: Natural na Tagalog ito para sa pormulang nagsasaad ng pagsunod sa naunang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Kung isasalin ang הַמְקַלֵּל bilang mas teolohikal na “lumapastangan”
  choice: ang taong sumumpa
  alternative: ang taong lumapastangan / ang mamumusong
  rationale: Bagaman ang konteksto ay ang pagsumpa sa banal na Pangalan, ang anyo rito ay participle ng קלל, “sumumpa.” Pinananatili ng pangunahing teksto ang tuwirang leksikal na diwa, habang nililinaw sa talababa ang kaugnayan nito sa naunang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Israelita” sa halip na literal ngunit hindi likas na “mga anak na lalaki ni Israel,” at “pinagbabato” bilang natural na paglalarawan ng pagpatay sa pamamagitan ng pagbato.
