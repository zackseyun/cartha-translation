  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: tl
  text: At sabihin mo sa mga anak ni Israel[a], ‘Kung sinumang lalaki[b] ang magpahayag ng sumpa laban sa kanyang Diyos, papasanin niya ang kanyang kasalanan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; tumutukoy ito sa buong bayan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring “sinuman.” Inuulit sa Hebreo ang salitang “lalaki” upang idiin ang bawat indibiduwal: “lalaki, lalaki.”'
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “papasanin niya ang kanyang kasalanan.” Isa itong idyomang Hebreo na nangangahulugang dadalhin niya ang sala o pananagutan dahil sa pagkakasala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: At sabihin mo sa mga anak ni Israel
  rationale: Pinananatili ang pang-ugnay at ang literal na pananalitang “mga anak ni Israel,” habang natural na ipinahahayag sa modernong Tagalog ang utos kay Moises.
- source_word: אִישׁ אִישׁ
  choice: may sinumang lalaki
  rationale: 'Ang pag-uulit ng אִישׁ ay distributibo: tumutukoy ito sa sinumang indibiduwal na lalaki. Naipapakita ng “may sinumang lalaki” kapwa ang diin at ang panlalaking anyo ng Hebreo.'
- source_word: כִּי יְקַלֵּל
  choice: Kung ... na sumpain
  rationale: Ang כִּי ay nagpapakilala ng kondisyong legal, at ang piel na יְקַלֵּל ay tuwirang nangangahulugang “sumpain” o laitin; hindi ito pinalawak agad bilang “lapastanganin.”
- source_word: אֱלֹהָיו
  choice: ang kanyang Diyos
  rationale: Pinananatili ang panghalip na “kanyang” at ang singular na diwang “Diyos,” nang hindi ito pinapalitan ng “PANGINOON,” na wala sa talatang ito.
- source_word: וְנָשָׂא חֶטְאוֹ
  choice: pananagutan niya ang kanyang kasalanan
  rationale: Natural na inililipat sa Tagalog ang Hebreong idyomang literal na “papasanin niya ang kanyang kasalanan,” na tumutukoy sa pagdadala ng sala o pananagutan dahil sa pagkakasala.
theological_decisions:
- issue: Saklaw ng אֱלֹהָיו
  choice: ang kanyang Diyos
  alternative: ang PANGINOON; Diyos
  rationale: Sinusunod nito ang tahasang possessive na anyo ng Hebreo at hindi ipinagpapalagay na kapareho na agad ito ng mas tiyak na paglapastangan sa Pangalan sa kasunod na talata.
- issue: Panlalaking paksa ng batas
  choice: may sinumang lalaki
  alternative: sinuman; kahit sino
  rationale: Ang Hebreo ay dalawang ulit na gumagamit ng אִישׁ, “lalaki,” bilang distributibong legal na pahayag. Pinananatili ang anyong panlalaki habang malinaw ang pangkalahatang aplikasyon sa bawat lalaking saklaw ng kaso.
- issue: Kahulugan ng “pagpasan ng kasalanan”
  choice: pananagutan niya ang kanyang kasalanan
  alternative: papasanin niya ang kanyang kasalanan; tatanggapin niya ang parusa sa kanyang kasalanan
  rationale: Ipinahahayag ang pananagutan nang hindi nililimitahan ang parirala sa mismong kaparusahan lamang; nananatili ang saklaw nito sa sala at kaakibat na pananagutan.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na tonong pambatas. Ginamit ang “sabihin mo” bilang likas na utos sa Tagalog, “sumpain” para sa payak na diwa ng קלל, at “pananagutan” upang maipahayag nang natural ang Hebreong idyoma nang hindi ito labis na binibigyang-kahulugan.
