  to: Binanggit nang tahasan ng anak ng babaeng Israelita ang Pangalan at isinumpa.[a] At dinala nila siya kay Moises. Ang pangalan ng kanyang ina ay Selomit, anak ni Dibri, mula sa lipi ni Dan.
