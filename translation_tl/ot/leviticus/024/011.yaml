  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: tl
  text: Binanggit nang tahasan ng anak ng babaeng Israelita ang Pangalan at isinumpa.[a] At dinala nila siya kay Moises. Ang pangalan ng kanyang ina ay Selomit, anak ni Dibri, mula sa lipi ni Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Nilapastangan niya ang Pangalan at isinumpa ito.” Ang pandiwang Hebreo ay maaaring mangahulugang tahasang pagbigkas o pagbanggit, ngunit sa kontekstong ito ay maaari rin itong unawain bilang bahagi ng paglapastangan sa Pangalan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: binanggit nang tahasan
  rationale: Ang נקב ay maaaring tumukoy sa malinaw o tahasang pagbigkas/pagbanggit. Sa pagkakasunod dito ng hiwalay na pandiwang וַיְקַלֵּל, pinananatili ng salin ang dalawang kilos sa halip na agad ipakahulugang ‘lumapastangan.’
- source_word: אֶת הַשֵּׁם
  choice: ang Pangalan
  rationale: Sa konteksto, ang may-tiyak na ‘Pangalan’ ay mapitagang pagtukoy sa banal na pangalan; hindi nito ipinapasok sa teksto ang tetragramaton.
- source_word: וַיְקַלֵּל
  choice: at isinumpa ito
  rationale: Ang piel ng קלל ay tuwirang nangangahulugang ‘sumpain.’ Ang ‘ito’ ay natural na nag-uugnay sa Pangalan bilang layon ayon sa konteksto, habang hindi dinaragdagan ang anyo o nilalaman ng sumpa.
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: Kaya dinala nila siya kay Moises
  rationale: Pinananatili ang aktibong ikatlong panauhang maramihan na walang tahasang tinukoy na simuno. Ipinahihiwatig ng ‘Kaya’ ang daloy ng salaysay.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ang pangalan ng kanyang ina ay
  rationale: Natural na Filipino para sa impormasyong pangkaligiran na idinaragdag ng Hebreong sugnay.
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: Selomit na anak ni Dibri
  rationale: Isinasalin sa karaniwang anyong Filipino ang mga pangalan at malinaw na pinananatili ang ugnayang magulang-anak.
- source_word: לְמַטֵּה דָן
  choice: mula sa lipi ni Dan
  rationale: Malinaw at natural na pagpapahayag ng kinabibilangang lipi.
theological_decisions:
- issue: Kahulugan ng נקב kasama ng ‘Pangalan’ sa konteksto ng paglapastangan
  choice: Tahasan niyang binanggit ang banal na Pangalan at pagkatapos ay isinumpa ito.
  alternative: Nilapastangan niya ang Pangalan at nagmura.
  rationale: Dalawang magkahiwalay na pandiwa ang nasa Hebreo, נקב at קלל. Pinananatili ng pangunahing salin ang posibleng kahulugan ng una bilang tahasang pagbanggit at ang ikalawa bilang pagsumpa, ngunit kinikilala sa talababa na maaaring unawain ang una bilang paglapastangan sa kontekstong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Pangalan’ upang ipakita ang mapitagang pagtukoy sa banal na pangalan. Ang ‘binanggit nang tahasan’ ay mas natural kaysa ‘binigkas nang malinaw’ at pinananatili ang leksikal na kaibhan ng dalawang pandiwa.
