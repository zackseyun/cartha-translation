  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/013.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh kay Moises:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapasulong sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, nagsalita” at pinananatili nito ang pagkakasunod-sunod at ang pormal na panimulang pormula ng pagsasalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH upang mapanatili itong personal na pangalan sa halip na palitan ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na panandang Tagalog para sa taong pinatutungkulan ng pagsasalita; ang pangalang מֹשֶׁה ay isinalin ayon sa nakasanayang anyong “Moises.”
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitibong ito ay karaniwang pormulang nagpapakilala sa mismong sasabihin. Sa Tagalog, malinaw at natural na ginagampanan ng tutuldok ang tungkuling ito, lalo na't sumusunod sa susunod na talata ang nilalaman ng pahayag.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan. Pinananatili ng “Yahweh” ang pangalang iyon nang hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pagkatapos” para sa pagsulong ng salaysay at tutuldok bilang natural na katumbas ng pormulang לֵאמֹר; walang talababa dahil walang kailangang ipaliwanag na tunay na tekstuwal o leksikal na kalabuan sa maikling talata.
