base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: tl
  text: Mula sa haing pangkapayapaan, ihahandog niya kay Yahweh bilang handog na pagkain[a] ang taba na bumabalot sa mga laman-loob at ang lahat ng taba na nasa ibabaw ng mga laman-loob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na pinaraan sa apoy” o “handog na inihahandog sa pamamagitan ng apoy.”
    reason: Pinananatili ang posibleng pagbasa sa אִשֶּׁה na nakatuon sa apoy sa halip na sa handog bilang pagkain.
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ihahandog niya
  rationale: Ang Hiphil ng קרב sa konteksto ng paghahain ay tumutukoy sa pormal na paglapit o paghaharap ng handog. Likas at malinaw sa modernong Tagalog ang “ihahandog niya.”
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: mula sa haing pangkapayapaan
  rationale: Ang זֶבַח ay hain, at ang שְׁלָמִים ay pangalan ng isang uri ng handog na kaugnay ng kapayapaan, kabutihan, at pakikipag-ugnayan. Pinananatili ng “haing pangkapayapaan” ang tradisyonal na katawagan nang hindi labis na nililinaw ang malawak na saklaw ng salitang Hebreo.
- source_word: אִשֶּׁה
  choice: handog na pagkain[a]
  rationale: Sa pananalitang pangkulto ng Levitico, ang salita ay tumutukoy sa handog na pinaiilanglang bilang usok at maaaring ilarawan bilang handog na pagkain para sa Diyos. Inilalagay sa talababa ang pagbasa na nakatuon sa apoy upang mapanatili ang leksikal na kalabuan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang banal na pangalang יהוה bilang “Yahweh,” hindi bilang isang titulong pamalit.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: ang tabang bumabalot sa mga laman-loob
  rationale: Sa batas ng paghahain, ang חֵלֶב ay ang mga piling bahaging taba. Ang participle na הַמְכַסֶּה ay naglalarawan sa tabang bumabalot sa mga panloob na bahagi ng hayop.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: ang lahat ng tabang nasa ibabaw ng mga laman-loob
  rationale: Tuwirang ipinahahayag nito ang taba na nakakabit o nakapatong sa mga panloob na bahagi, at naihihiwalay ito sa tabang bumabalot sa mga iyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang tipang pangalan ng Diyos. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אִשֶּׁה sa batas ng paghahain
  choice: handog na pagkain
  alternative: handog na pinaraan sa apoy; handog na sinusunog
  rationale: Maaaring idiin ng katawagan ang handog bilang pagkaing inihahandog sa Diyos o ang paraan ng paghahandog nito sa apoy. Ginamit sa teksto ang malinaw na katawagang pangkulto at pinanatili sa talababa ang pagbasa na nakatuon sa apoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “mga laman-loob” bilang madaling maunawaang katawagang anatomikal at ang “haing pangkapayapaan” bilang maikli at pormal na pangalan ng uring ito ng hain.
