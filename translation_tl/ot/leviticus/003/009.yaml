revisions:
- from: 'Mula sa handog na hain para sa mabuting ugnayan[a], ihahandog niya kay Yahweh bilang handog na pinaraan sa apoy ang taba nito: ang buong matabang buntot[b], na aalisin niya malapit sa gulugod[c], ang tabang bumabalot sa mga laman-loob, at ang lahat ng tabang nasa mga laman-loob.'
  to: 'Mula sa hain para sa kapayapaan[a], maghahandog siya kay Yahweh ng handog na pinaraan sa apoy: ang taba nito—ang buong matabang buntot[b], na aalisin niya malapit sa gulugod[c]—at ang tabang bumabalot sa mga laman-loob, at ang lahat ng tabang nasa mga laman-loob.'
