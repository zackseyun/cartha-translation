  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: tl
  text: 'Mula sa hain para sa kapayapaan[a], maghahandog siya kay Yahweh ng handog na pinaraan sa apoy: ang taba nito—ang buong matabang buntot[b], na aalisin niya malapit sa gulugod[c]—at ang tabang bumabalot sa mga laman-loob, at ang lahat ng tabang nasa mga laman-loob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hain para sa mabuting ugnayan” o “hain para sa kagalingan.”
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa malapad at matabang buntot ng uri ng tupang ginagamit noon sa paghahandog.
    reason: cultural_note
  - marker: c
    text: Maaari ring “katapat ng gulugod” o “sa may ibabang bahagi ng gulugod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: handog na hain para sa mabuting ugnayan
  rationale: Ang שְׁלָמִים ay maaaring magpahiwatig ng kapayapaan, kabutihan, at pakikipag-ugnayan. Ang saling ito ay natural sa modernong Filipino at hindi nililimitahan ang termino sa pansariling kapanatagan lamang.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Tumutukoy ito sa handog na inihaharap sa altar sa pamamagitan ng apoy; malinaw ang ritwal na diwa nang hindi ipinahihiwatig na karaniwang pagkain ito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang tipan na יהוה bilang Yahweh.
- source_word: חֶלְבּוֹ
  choice: ang taba nito
  rationale: Tumutukoy sa mga bahaging taba ng hayop na itinalaga para sa paghahandog.
- source_word: הָאַלְיָה תְמִימָה
  choice: ang buong matabang buntot
  rationale: Ang אַלְיָה ay ang malapad at matabang buntot ng tupa, at ang תְמִימָה ay nagsasaad na buo itong aalisin at ihahandog.
- source_word: לְעֻמַּת הֶעָצֶה
  choice: malapit sa gulugod
  rationale: Inilalarawan ng parirala ang lugar ng paghiwalay ng buntot kaugnay ng gulugod; pinananatili sa talababa ang iba pang posibleng pag-unawa.
- source_word: יְסִירֶנָּה
  choice: na aalisin niya
  rationale: Ang Hiphil ng סור ay nangangahulugang alisin; ang sugnay na panuring ay natural na nag-uugnay nito sa matabang buntot.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: ang tabang bumabalot sa mga laman-loob
  rationale: Sa kontekstong anatomikal ng paghahandog, ang קֶרֶב ay tumutukoy sa mga panloob na bahagi o lamang-loob.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: ang lahat ng tabang nasa mga laman-loob
  rationale: Pinananatili nito ang pagkakaiba ng tabang bumabalot sa mga laman-loob at ng lahat ng tabang nakakabit o nasa ibabaw ng mga ito.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יהוה sa tekstong Hebreo. Ang “Yahweh” ay malinaw na transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kahulugan ng זֶבַח הַשְּׁלָמִים
  choice: handog na hain para sa mabuting ugnayan
  alternative: handog para sa kapayapaan; handog para sa kagalingan
  rationale: Malawak ang saklaw ng שְׁלָמִים at maaaring kaugnay ng kapayapaan, kagalingan, at pakikisalo o ugnayan. Pinili ang natural na saling hindi nagtatakda ng isang denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga laman-loob” sa halip na mas teknikal o makalumang katawagan. Napanatili ang sunod-sunod na detalye ng ritwal at ang bahagyang kalabuan ng pariralang anatomikal sa pamamagitan ng talababa.
