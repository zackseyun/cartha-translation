  source_fidelity: 'Ang pangunahing ayos ng ritwal ay wastong nasasalin: ang mga anak na lalaki ni Aaron ang magsusunog ng bahagi sa altar, sa ibabaw ng handog na sinusunog at ng mga kahoy na nasa apoy. Gayunman, ang אִשֶּׁה ay isang teknikal na katawagang sakripisyal na mas ligtas na isalin batay sa ritwal na pagsunog kaysa bilang karaniwang “handog na pagkain,” na maaaring magpahiwatig sa Filipino na pagkain mismo ang iniaalay.'
  naturalness: Marangal at malinaw ang salin, ngunit mas likas ang “mga anak na lalaki ni Aaron” upang hindi mawala ang kasariang nasa בני, at “samyong kalugod-lugod kay Yahweh” upang maipahayag nang tuwiran ang pormulang “aroma ... to Yahweh.”
  terminology: Pinananatili ang “altar,” “handog na sinusunog,” at “Yahweh.” Ang “handog na inihahandog sa apoy” ay malinaw na modernong Filipino para sa teknikal na אִשֶּׁה at hindi pinipilit ang pinagtatalunang etimolohiya nito.
