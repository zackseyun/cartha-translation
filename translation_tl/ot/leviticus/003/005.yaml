base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Susunugin ito ng mga anak na lalaki ni Aaron sa altar, sa ibabaw ng handog na sinusunog na nasa ibabaw ng mga kahoy na nasa apoy. Ito ay handog na inihahandog sa apoy[a], isang samyong kalugod-lugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: Susunugin
  rationale: Sa konteksto ng paghahandog, ang Hiphil ng קטר ay tumutukoy sa pagsunog sa altar upang pumailanlang ang usok. Ang “susunugin” ay malinaw at likas sa makabagong Filipino, at ang aspektong panghinaharap ay angkop sa tagubiling panritwal.
- source_word: אֹתוֹ
  choice: ito
  rationale: Tumutukoy ang panghalip na layon sa bahagi ng handog na binanggit sa naunang talata.
- source_word: בְנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Likas at tuwirang salin ng pariralang konstrak, habang pinananatili ang katawagang pampamilya at pangsaserdote.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Tumutukoy sa altar ng paghahandog. Hindi kailangang katawanin nang hiwalay sa Filipino ang hulaping patungo dahil malinaw na ang lokasyon o hantungan ng ritwal na kilos.
- source_word: עַל הָעֹלָה
  choice: sa ibabaw ng handog na sinusunog
  rationale: Ang עַל ay pinakanatural na tumutukoy sa pagkakalagay sa ibabaw. Isinasalin ang עֹלָה bilang “handog na sinusunog,” isang malinaw na katawagan sa uri ng handog.
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: na nasa ibabaw ng kahoy na nasa apoy
  rationale: Pinananatili ang sunod-sunod na ayos na inilalarawan ng Hebreo. Ang “kahoy” ay hindi nagpapasok ng mas tiyak na ideya gaya ng “mga troso.”
- source_word: אִשֵּׁה
  choice: handog na pagkain
  rationale: Teknikal itong katawagan sa handog na inihahain sa pamamagitan ng apoy at kaugnay ng bahaging inilaan kay Yahweh. Nauunawaan ang “handog na pagkain” sa konteksto nang hindi nagpapahiwatig na literal na kumakain ang Diyos; inilalagay sa talababa ang lehitimong alternatibo.
- source_word: רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  rationale: Ang nakapirming pormulang panritwal ay nagpapahayag na katanggap-tanggap ang handog kay Yahweh. Dignified at natural sa Filipino ang “kalugod-lugod na samyo.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Minamarkahan ng ל ang kaugnayan o paglalaan ng handog. Ang “para kay Yahweh” ay natural sa Filipino at pinananatili ang personal na pangalang nasa tekstong Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Pagsasalin sa אִשֵּׁה sa pormulang pansakripisyo
  choice: handog na pagkain
  alternative: handog na pinaraan sa apoy; handog na apoy
  rationale: Ipinahahayag ng pangunahing salin ang kategoryang pangkulto at ang konteksto ng bahaging sinusunog sa altar. Dahil tunay na posible rin ang pagsasaling nakatuon sa apoy, pinananatili iyon sa talababa sa halip na lubusang alisin ang leksikal na tensiyon.
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa tekstong panritwal. Pinanatili ang paulit-ulit na “nasa ibabaw” upang katawanin ang maingat na paglalarawan ng Hebreo sa ayos ng altar, bagaman bahagya itong mas mabigat kaysa karaniwang usapan.
