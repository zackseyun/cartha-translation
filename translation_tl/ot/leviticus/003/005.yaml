    rationale: Teknikal na terminong sakripisyal ito na nakaugnay sa paghahandog sa pamamagitan ng apoy. Sa modernong Filipino, ang “handog na pagkain” ay mas madaling unawain bilang regalong pagkain kaysa terminong pangritwal; mas ligtas itong ilagay bilang alternatibo sa talababa.
  - severity: low
