base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: tl
  text: At susunugin ng pari ang mga iyon sa altar bilang pagkaing handog na pinaraan sa apoy[a], para sa kaaya-ayang samyo[b]. Ang lahat ng taba ay para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “pagkain ng handog na pinaraan sa apoy.” Maaari ring isalin na “pagkaing handog.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “para sa nakagiginhawang samyo” o “para sa mabangong samyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: At susunugin ng pari ang mga iyon
  rationale: Sa konteksto ng paghahandog, ang Hiphil ng קטר ay tumutukoy sa pagsunog ng mga bahagi sa altar upang pumailanlang ang usok. Ang “mga iyon” ay nagpapanatili sa panlalaking pangmaramihang hulapi at tumutukoy sa mga bahaging binanggit sa naunang konteksto.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ang hulaping patungo-sa-lugar ay likas na tumutukoy rito sa altar bilang kinalalagyan ng pagsunog; malinaw at karaniwan sa Filipino ang “sa altar.”
- source_word: לֶחֶם אִשֶּׁה
  choice: bilang pagkaing handog na pinaraan sa apoy
  rationale: Ang לֶחֶם ay mas malawak kaysa literal na “tinapay” at nangangahulugang pagkain dito. Pinananatili ng parirala ang ugnayan nito sa אִשֶּׁה, isang handog na kaugnay ng apoy, nang hindi nagmumungkahi na literal na tinapay ang taba.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: upang maging kaaya-ayang amoy
  rationale: Pinananatili nito ang nakapirming metaporang panghandog at ang diwa ng pagiging kalugod-lugod o katanggap-tanggap, nang hindi ipinapaliwanag nang lampas sa sinasabi ng Hebreo.
- source_word: כָּל חֵלֶב
  choice: Ang lahat ng taba
  rationale: Pinananatili ng “lahat” ang kabuuang diin ng כָּל at tinutukoy ng “taba” ang mga bahaging taba na nakalaan sa paghahandog.
- source_word: לַיהוָה
  choice: ay para kay Yahweh
  rationale: Ang לְ ay maaaring magpahiwatig ng paglalaan o pag-aari. Ang “para kay Yahweh” ay natural at pinananatili ang maikling pahayag at ang bahagyang kaluwagan ng ugnayan sa orihinal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulo.
- issue: Pormulang panghandog na לְרֵיחַ נִיחֹחַ
  choice: upang maging kaaya-ayang amoy
  alternative: upang maging nakagiginhawang amoy; upang maging mabangong samyo
  rationale: Pinananatili ang konkretong metapora at ang teolohikal na tensiyon nito, sa halip na tahasang palitan ito ng paliwanag na “katanggap-tanggap sa Diyos.”
- issue: Kahulugan ng לַיהוָה sa pangwakas na sugnay
  choice: Ang lahat ng taba ay para kay Yahweh
  alternative: Ang lahat ng taba ay pag-aari ni Yahweh
  rationale: Maaaring ipahiwatig ng לְ ang paglalaan at pag-aari. Ang “para kay” ay pinakamalapit sa payak na anyo ng Hebreo at hindi labis na nilulutas ang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panghandog—“pari,” “altar,” at “handog”—at iniwasan ang labis na teknikal o makalumang pananalita. Ang ayos ng mga sugnay ay nananatiling malapit sa Hebreo ngunit likas basahin sa Tagalog.
