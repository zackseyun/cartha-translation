  to: Ipapatong niya ang kanyang kamay sa ulo ng kanyang handog at kakatayin niya ito sa harap ng Toldang Tipanan. At ihahagis[a] ng mga anak na lalaki ni Aaron ang dugo nito sa altar sa buong palibot.
  rationale: Ginawang “mga anak na lalaki ni Aaron” upang maipakita ang tiyak na panlalaking katawagan sa Hebreo. Inalis ang hindi kinakailangang “Pagkatapos,” nilinaw ang saklaw na “sa buong palibot,” at pinasimple ang talababa upang magbigay lamang ng ligtas na lexical alternative nang hindi binabago ang ritwal na kilos.
