base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: tl
  text: Ipapatong niya ang kanyang kamay sa ulo ng kanyang handog at kakatayin niya ito sa harap ng Toldang Tipanan. At ihahagis[a] ng mga anak na lalaki ni Aaron ang dugo nito sa altar sa buong palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ititilamsik.” Ang pandiwang Hebreo ay tumutukoy sa malakas na ritwal na paghagis ng dugo, hindi sa banayad na pagwiwisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ipapatong
  rationale: Likas at malinaw na paglalarawan sa ritwal na paglalagay ng kamay sa ulo ng hayop; hindi nito ipinapasok ang anumang paliwanag sa simbolikong kahulugan ng kilos.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Pinananatili ang isahang anyo at panlalaking panghalip ng Hebreo.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: ulo ng kanyang handog
  rationale: Ang 'handog' ay malawak at angkop na katumbas ng קָרְבָּן, samantalang ang 'ulo' ang tuwirang anatomikal na kahulugan ng רֹאשׁ.
- source_word: וְשָׁחַט
  choice: kakatayin
  rationale: Karaniwang modernong salitang Filipino para sa pagkatay ng hayop at pinananatili ang teknikal na kontekstong panghandog.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: sa harap ng Toldang Tipanan
  rationale: Ang 'sa harap ng' ay tuwirang katumbas ng spatial na לִפְנֵי. Ang 'Toldang Tipanan' ay kinikilalang katawagan sa santuwaryong אֹהֶל מוֹעֵד at natural sa Filipino.
- source_word: וְזָרְקוּ
  choice: ihahagis
  rationale: Ipinahahayag ang masiglang ritwal na paghagis o pagtilamsik ng dugo, sa halip na banayad na pagwiwisik.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Pinananatili ang tuwirang ugnayang pampamilya ng Hebreo nang hindi ito ginagawang mas malawak na 'mga inapo' o interpretibong 'mga pari.'
- source_word: אֶת דָּמוֹ
  choice: ang dugo nito
  rationale: Ang hulaping panghalip ay tumutukoy sa hayop na inihandog; natural sa Filipino ang 'nito.'
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa altar, sa palibot nito
  rationale: Ipinakikita ng parirala na ang dugo ay inilalapat sa mga gilid sa buong palibot ng altar, hindi lamang sa ibabaw nito.
theological_decisions:
- issue: Ritwal na pagpapatong ng kamay
  choice: Isinalin lamang bilang 'ipapatong niya ang kanyang kamay.'
  alternative: Idiing 'idiin niya ang kamay' o magdagdag ng paliwanag tungkol sa paglilipat ng kasalanan o pakikiisa.
  rationale: Inilalarawan ng talata ang kilos ngunit hindi nito tahasang ipinaliliwanag ang teolohikal na kabuluhan; kaya hindi dapat idagdag sa salin ang isang tiyak na interpretasyon.
- issue: Panlalaking katawagang בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  alternative: mga inapo ni Aaron; mga pari ni Aaron
  rationale: Tiyak na 'mga anak' ang nasa Hebreo. Pinananatili ito upang huwag palawakin o gawing interpretibo ang katawagan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong panritwal. Ginamit ang hinaharap na anyo upang ihatid ang bisa ng utos sa Hebreo. Pinanatiling maikli ang mga sugnay at iniwasan ang pagdaragdag ng teolohikal na paliwanag na wala sa talata.
