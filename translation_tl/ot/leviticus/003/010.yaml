translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pati” upang ipakita na karugtong ang talata ng naunang talaan ng mga bahaging ihahandog. Inilagay ang talababa sa mismong hindi tiyak na katawagang anatomikal.
