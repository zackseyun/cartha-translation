base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: tl
  text: pati ang dalawang bato, ang taba na nasa ibabaw ng mga ito, na nasa mga tagiliran, at ang nakausling bahagi sa atay[a], na aalisin niya kasama ng mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lobo sa atay.” Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng salitang Hebreo na יֹתֶרֶת.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: dalawang bato
  rationale: Tuwirang tumutukoy ang parirala sa dalawang kidney sa konteksto ng paghahandog; malinaw at karaniwan sa Filipino ang “bato” bilang katawagang anatomikal.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: ang taba sa ibabaw ng mga iyon
  rationale: Sa mga handog sa Levitico, ang חֵלֶב ay ang natatanging taba sa loob ng katawan. Pinananatili ng salin ang lokasyon nito kaugnay ng mga bato.
- source_word: הַכְּסָלִים
  choice: mga tagiliran
  rationale: Maaaring tumukoy ang salita sa mga balakang o tagiliran. Ang “mga tagiliran” ay natural sa modernong Filipino at angkop sa paglalarawang anatomikal nang hindi nagpapanggap ng higit na katiyakan.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: nakausling bahagi ng atay
  rationale: Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng יֹתֶרֶת. Ang “nakausling bahagi” ay nauunawaan ngunit hindi labis na nagpapakipot sa kahulugan sa isang tiyak na lobo.
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: na aalisin niya kasama ng mga bato
  rationale: Ipinahahayag nito ang rituwal na pag-aalis sa bahaging kaugnay ng atay kasabay ng mga bato, habang natural ang ayos sa Filipino.
