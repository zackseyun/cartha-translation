  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: tl
  text: 'At mula rito ay ihahandog niya ang kanyang handog bilang isang handog na pinaraan sa apoy[a] para kay Yahweh: ang taba na bumabalot sa mga laman-loob at ang lahat ng taba na nasa ibabaw ng mga laman-loob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang handog na pagkain.” Ang salitang Hebreo na אִשֶּׁה ay isang terminong pansakripisyo na karaniwang iniuugnay sa handog na sinusunog o pinaraan sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ihahandog niya
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay tumutukoy sa rituwal na paghahandog o paglapit ng handog; natural at malinaw sa Filipino ang “ihahandog niya.”
- source_word: מִמֶּנּוּ
  choice: mula roon
  rationale: Tumutukoy ang hulapi sa hayop na inihahandog, at sa konteksto ay sa mga bahaging kukunin mula rito. Ang “mula roon” ay natural na anaporikong Filipino.
- source_word: קָרְבָּנוֹ
  choice: ang kanyang handog
  rationale: Teknikal na katawagang pansakripisyo ang קָרְבָּן; tuwiran at madaling maunawaan ang “handog.”
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Hindi tiyak ang eksaktong etimolohiya at saklaw ng terminong pansakripisyo. Pinananatili ng saling ito ang malinaw na kaugnayan nito sa apoy nang hindi ipinapalagay na ang pangunahing kahulugan nito ay “pagkain.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag ng ל ang pinag-uukulan ng handog. Ginamit ang personal na pangalang “Yahweh” para sa Tetragrammaton.
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: ang taba na bumabalot sa mga laman-loob
  rationale: Pinananatili nito ang anatomikal at rituwal na detalye ng taba na nakabalot sa panloob na bahagi ng hayop.
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: at ang lahat ng tabang nasa ibabaw ng mga laman-loob
  rationale: Inililipat nang tuwiran ang kabuuan at lokatibong diwa ng כָּל at עַל sa natural na Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang tipan ang nasa tekstong Hebreo, kaya pinanatili bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Pinananatili ng pangunahing teksto ang tradisyonal at malinaw na ugnayan sa apoy, habang inilalagay sa talababa ang leksikal na alternatibong “handog na pagkain” upang hindi tahimik na lutasin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “mga laman-loob” sa halip na mas teknikal o makalumang katawagan. Ang pangungusap ay sumusunod sa ayos at detalye ng Hebreo habang nananatiling natural sa Tagalog.
