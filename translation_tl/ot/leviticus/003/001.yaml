base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: tl
  text: Kung ang handog niya ay isang haing pangkapayapaan[a], at kung mula sa kawan ng mga baka ang ihahandog niya, lalaki man o babae, ihahandog niya itong walang kapintasan sa harap ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “hain ng mga handog pangkapayapaan” o “haing pakikipag-isa.” Literal sa Hebreo: “hain ng mga handog pangkapayapaan.”'
    reason: lexical_alternative
  - marker: b
    text: Ginagamit sa Hebreo ang personal na pangalan ng Diyos na יהוה (YHWH), na isinalin dito bilang “Yahweh.”
    reason: divine_name
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: isang haing pangkapayapaan
  rationale: Pinananatili ng “hain” ang tahasang זֶבַח, samantalang ang “pangkapayapaan” ay tradisyonal at malawak na katumbas ng שְׁלָמִים. Mas natural ito sa Tagalog kaysa sa lubhang literal na “hain ng mga handog pangkapayapaan.”
- source_word: קָרְבָּנוֹ
  choice: ang handog niya
  rationale: Ang קָרְבָּן ay pangkalahatang katawagan sa inihaharap o inilalapit bilang handog; malinaw at likas sa makabagong Tagalog ang “handog.”
- source_word: מִן הַבָּקָר
  choice: mula sa bakahan
  rationale: Tumutukoy ang בָּקָר sa mga alagang hayop na bovine; ipinahahayag ng “bakahan” ang pangkat o kawan na pinagmumulan ng hayop.
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: ihahandog / ihahandog niya
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay nangangahulugang magharap o maghandog. Ang “ihahandog” ang pinakanatural na terminong kultiko sa Tagalog.
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: lalaki man o babae
  rationale: Likas na isinasalin ng “... man o ...” ang magkatambal na אִם ... אִם at pinananatiling malinaw na maaaring alinman sa dalawang kasarian ang hayop.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Sa batas tungkol sa paghahandog, tumutukoy ang תָּמִים sa hayop na walang depekto; tiyak, marangal, at madaling maunawaan ang “walang kapintasan.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat ang “sa harap” sa לִפְנֵי, at pinananatili ang personal na pangalang banal bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pangalan ng handog na שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing pakikipag-isa; hain para sa kagalingan
  rationale: Pinananatili ng “pangkapayapaan” ang tradisyonal at malawak na saklaw ng salita nang hindi nililimitahan ito sa isang interpretasyong tulad ng pakikisama lamang. Itinatala sa talababa ang ibang posibleng pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ni Yahweh” dahil personal na pangalan ang tinutukoy. Pinanatili ang paulit-ulit na diwa ng “ihahandog” at ang kondisyunal na ayos ng Hebreo, ngunit inayos nang bahagya para maging likas sa Tagalog.
