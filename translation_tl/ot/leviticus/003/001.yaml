revisions:
- from: Kung ang handog niya ay isang haing pangkapayapaan[a], at kung mula sa bakahan ang ihahandog niya, lalaki man o babae, ihahandog niya itong walang kapintasan sa harap ni Yahweh.[b]
  to: Kung ang handog niya ay isang haing pangkapayapaan[a], at kung mula sa kawan ng mga baka ang ihahandog niya, lalaki man o babae, ihahandog niya itong walang kapintasan sa harap ni Yahweh.[b]
  rationale: Pinalitan ang “bakahan” ng “kawan ng mga baka” upang tumpak na tukuyin ang bovine livestock na nasa Hebreo, hindi ang lugar ng pag-aalaga ng baka. Inayos din ang talababa a upang maging wasto ang paglalarawan nito sa literal na salin. Walang pagbabagong ginawa sa kahulugan, pagkakasunod ng mga kondisyon, o sa terminong Yahweh.
