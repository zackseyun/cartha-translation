  yaml_path: translation/ot/leviticus/003/011.yaml
  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: tl
  text: Susunugin ito ng pari sa altar bilang pagkain[a], isang handog na sinusunog para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “tinapay ng handog na iniaalay sa pamamagitan ng apoy”; ginagamit dito ang “tinapay” bilang idyoma para sa pagkain sa sistema ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: Susunugin iyon
  rationale: Ang Hiphil ng קטר sa konteksto ng paghahandog ay tumutukoy sa pagsusunog sa altar upang pumailanlang ang usok. Natural at malinaw sa modernong Tagalog ang “susunugin iyon.”
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang salin ng כֹּהֵן sa kontekstong pangkulto.
- source_word: הַמִּזְבֵּחָה
  choice: sa ibabaw ng altar
  rationale: Ipinahihiwatig ng anyong patungo sa altar at ng ritwal na kilos na doon mismo sa ibabaw ng altar susunugin ang handog.
- source_word: לֶחֶם
  choice: bilang pagkain
  rationale: Bagaman madalas mangahulugang “tinapay” ang לֶחֶם, ginagamit ito rito bilang idyomang pansakripisyo para sa pagkaing inihahandog sa altar; iniiwasan ng “pagkain” ang maling pahiwatig na literal na tinapay ang tinutukoy.
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Teknikal na terminong pansakripisyo ito para sa handog na inihaharap sa pamamagitan ng apoy. Malinaw sa Tagalog ang parirala at hindi nito nililimitahan ang kahulugan sa simpleng pagsunog lamang.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahayag ng patutunguhan o pag-aalay, at pinananatili ang pangalang tipan na Yahweh ayon sa ibinigay na doktrinal na patakaran.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang pansakripisyo na לֶחֶם אִשֶּׁה
  choice: bilang pagkain, isang handog na pinaraan sa apoy
  alternative: bilang pagkain ng handog na pinaraan sa apoy; bilang tinapay, isang handog na pinaraan sa apoy
  rationale: Pinananatili ng salin ang dalawang terminong pangkulto ngunit hindi ipinahihiwatig na literal na tinapay ang inihandog o na nangangailangan ng pisikal na pagkain ang Diyos. Ang talinghaga ng pagkaing bahagi sa altar ay hindi pinalalawak tungo sa isang denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pari,” “altar,” at “handog” bilang mga likas at malawak na nauunawaang terminong panrelihiyon. Ang “sa ibabaw ng altar” ay mas tiyak kaysa “sa altar,” at ang “pinaraan sa apoy” ay nagpapanatili sa ritwal na diwa ng אִשֶּׁה.
