base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: tl
  text: Ipapatong niya ang kanyang kamay sa ulo ng kanyang handog at kakatayin niya ito sa pasukan ng Toldang Tipanan[a], at ihahagis ng mga anak ni Aaron na mga pari ang dugo laban sa altar, sa buong palibot nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bungad ng Toldang Tipanan.”
    reason: lexical_alternative
  - marker: b
    text: O “isasaboy ang dugo sa altar sa buong palibot nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ipapatong
  rationale: Sa kontekstong paghahandog, tumutukoy ang סמך sa paglalagay o pagdiin ng kamay sa hayop. Likas sa modernong Filipino ang “ipapatong” at hindi nito ipinipilit kung gaano kalakas ang pagdiin.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Pinananatili ang isahang anyo at panlalaking panghalip ng Hebreo.
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: sa ulo ng kanyang handog
  rationale: Tuwirang isinasalin ang anatomikong “ulo” at ang malawak na katawagang קָרְבָּן bilang “handog,” sa halip na paliitin agad sa “hain.”
- source_word: וּשְׁחָטוֹ
  choice: at kakatayin iyon
  rationale: Ang שׁחט ang karaniwang pandiwa para sa ritwal na pagkatay ng hayop; mas tiyak ang “kakatayin” kaysa “papatayin.”
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Toldang Tipanan
  rationale: Ang פֶּתַח ay pasukan o bungad. Ginagamit ang “Toldang Tipanan” bilang likas at dignified na katawagan sa santuwaryong אֹהֶל מוֹעֵד, habang inilalahad sa talababa ang mas literal na alternatibo.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ang mga anak ni Aaron na mga pari
  rationale: Pinananatili ang ugnayang pampamilya at ang appositional na pagkakakilanlan sa kanila bilang mga pari.
- source_word: וְזָרְקוּ
  choice: ay ihahagis
  rationale: Ang זרק ay paghagis o pagsaboy ng dugo, hindi ang mas espesipikong ritwal na pagwiwisik. Ang “ihahagis” ang pinakadirektang katumbas.
- source_word: אֶת הַדָּם עַל הַמִּזְבֵּחַ סָבִיב
  choice: ang dugo sa palibot ng altar
  rationale: Ipinahihiwatig ng עַל kasama ng זרק ang paghagis ng dugo patungo at laban sa altar; ipinananatili ng “sa palibot” ang saklaw ng סָבִיב nang hindi sinasabing sa ibabaw lamang.
theological_decisions:
- issue: Paraan ng paglalapat ng dugo sa altar
  choice: ihahagis ang dugo sa palibot ng altar
  alternative: isasaboy ang dugo sa palibot ng altar
  rationale: Mas tuwirang tumutugma ang “ihahagis” sa זרק at iniiwasang ihalo ito sa ibang pandiwang Hebreo na maaaring tumukoy sa pagwiwisik. Gayunman, maaaring ilarawan sa natural na Filipino ang kilos bilang “pagsaboy,” kaya itinatala ito bilang alternatibo.
- issue: Pangalan ng אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  alternative: tolda ng pakikipagtagpo
  rationale: Ang parirala ay maaaring unawain kaugnay ng itinakdang pakikipagtagpo o pagtitipon. Pinili ang pamilyar at maikling “Toldang Tipanan,” ngunit pinananatili sa talababa ang higit na literal na anyo upang hindi ikubli ang saklaw ng מוֹעֵד.
translation_notes:
  register: Modernong Filipino na pormal at malinaw. Ginamit ang karaniwang bokabularyong panritwal—“handog,” “kakatayin,” “pari,” at “altar”—nang hindi nagdaragdag ng paliwanag na sektaryan. Ang ayos ng pangungusap ay nananatiling malapit sa Hebreo ngunit hinati upang maging natural at madaling basahin.
