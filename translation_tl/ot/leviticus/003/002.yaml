  rationale: Nilinaw ang direksiyon ng paglalapat ng dugo upang maipahayag ang עַל־הַמִּזְבֵּחַ at ang saklaw na סָבִיב. Inayos din ang pandiwa ng pagkatay upang malinaw na ang naghahandog ang gumagawa ng kilos, gaya ng ipinahihiwatig ng magkakaugnay na mga pandiwang Hebreo. Pinanatili ang mga terminong panritwal at ang hindi-sektaryang rehistro.
