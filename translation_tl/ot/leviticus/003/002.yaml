  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang naghahandog ay magpapatong ng kamay sa ulo ng handog, kakatayin ito sa pasukan ng Toldang Tipanan, at ihahagis ng mga anak ni Aaron na mga pari ang dugo sa altar. Gayunman, ang “sa palibot ng altar” ay maaaring mangahulugang inihagis ang dugo sa espasyong nakapaligid sa altar, sa halip na inilapat ito sa altar sa lahat ng panig. Kailangang ilahad ang ugnayan ng dugo sa altar nang mas malinaw.'
  naturalness: Pormal at natural sa modernong Filipino ang rebisadong ayos. Ang “kakatayin niya ito” ay malinaw na ibinabalik ang kilos sa naghahandog, at ang “laban sa altar, sa buong palibot nito” ay malinaw na nagsasaad ng ritwal na kilos nang hindi ginagawang “pagwiwisik.”
  terminology: Ang “handog,” “Toldang Tipanan,” “mga pari,” at “altar” ay angkop at magkakatugma. Pinanatili ang “ihahagis” para sa זרק, na mas tapat kaysa sa mas espesipikong “wiwisikan.”
