  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: tl
  text: Kung kambing naman ang handog niya, ihaharap niya ito sa presensya ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, ang banal na pangalan, na tradisyonal na isinasalin bilang “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Kung… naman
  rationale: Ipinakikilala nito ang kasunod na maaaring uri ng hayop sa sunod-sunod na tagubilin. Likas sa modernong Tagalog ang “naman” para sa banayad na paghahambing nang hindi nagpapahiwatig ng matinding pagsalungat.
- source_word: עֵז
  choice: kambing
  rationale: Tuwirang katumbas ng pangngalang Hebreo para sa kambing; pinananatili ang isahan.
- source_word: קָרְבָּנוֹ
  choice: ang handog niya
  rationale: Ang קָרְבָּן ay malawak na katawagan sa inihaharap o inilalapit bilang handog. Mas angkop ang “handog” kaysa sa mas makitid na “hain.”
- source_word: וְהִקְרִיבוֹ
  choice: ihaharap niya ito
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap, lalo na bilang handog. Ipinahahayag ng anyong Filipino ang tuntuning dapat sundin sa kontekstong ito.
- source_word: לִפְנֵי
  choice: sa harap ni
  rationale: Natural at tuwirang salin ng pananalitang tumutukoy sa paghaharap sa presensiya ng isang persona.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan habang kinikilala sa talababa ang tradisyonal na pamalit na titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “Kung… naman” upang natural na ipakita na isa itong kasunod na kaso sa mga tagubilin, at “ihaharap” upang mapanatili ang kultikong diwa ng paglalapit ng handog.
