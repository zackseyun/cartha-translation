translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong ritwal. Ginamit ang “kaniyang” sa halip na kolokyal na “kanyang,” at pinanatili ang teknikal na “altar.” Ang panandang [a] ay inilagay kaagad pagkatapos ng salitang tinatalabaan.
