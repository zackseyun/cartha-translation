base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: tl
  text: Ipapatong niya ang kaniyang kamay sa ulo nito at kakatayin ito sa harap ng Toldang Tipanan. Pagkatapos, ihahagis[a] ng mga anak ni Aaron ang dugo nito sa altar, sa buong paligid nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itilamsik.” Ang pandiwang Hebreo ay tumutukoy sa paghagis o pagtilamsik ng dugo sa altar bilang bahagi ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: Ipapatong niya ang kaniyang kamay
  rationale: Ang pariralang Hebreo ay tumutukoy sa ritwal na paglalagay o pagdiin ng kamay sa hayop. Ang “ipapatong” ay natural at malinaw sa modernong Filipino, at pinananatili ang tahasang isahan na “kamay.”
- source_word: עַל רֹאשׁוֹ
  choice: sa ulo nito
  rationale: Ang hulaping panghalip ay tumutukoy sa hayop na handog; natural sa Filipino ang “ulo nito.”
- source_word: וְשָׁחַט אֹתוֹ
  choice: at kakatayin ito
  rationale: Ang שׁחט ay karaniwang pandiwa para sa ritwal na pagkatay. Mas tiyak ang “kakatayin” kaysa sa pangkalahatang “papatayin.”
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: sa harap ng Toldang Tipanan
  rationale: Pinananatili ng “sa harap” ang lokasyong ipinahihiwatig ng לִפְנֵי. Ang “Toldang Tipanan” ay malinaw at dignified na katawagan sa אֹהֶל מוֹעֵד sa kontekstong pangkulto.
- source_word: וְזָרְקוּ
  choice: ihahagis
  rationale: Ang זרק ay nagsasaad ng paghagis o pagtilamsik ng dugo patungo sa altar. Pinipili ang literal na “ihahagis,” habang inilalagay sa talababa ang natural na alternatibong “iwisik.”
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Tuwirang pinananatili ang pormal na katawagang pangsaserdote sa Hebreo.
- source_word: אֶת דָּמוֹ
  choice: ang dugo nito
  rationale: Ang hulaping panghalip ay tumutukoy sa hayop na kinatay.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa buong paligid ng altar
  rationale: Ipinahahayag ng “sa buong paligid” ang distribusyon ng dugo sa palibot ng altar. Sa Filipino, sapat na ipinahihiwatig ng pandiwang “ihahagis” at ng lokasyong ito na ang dugo ay inilalapat sa altar.
