base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: tl
  text: at ang dalawang bato, ang taba na nasa mga ito, na nasa mga balakang, at ang nakausling bahagi[a] na nasa ibabaw ng atay—aalisin niya ito kasama ng mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umbok na nasa atay.” Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: dalawang bato
  rationale: Tuwirang tumutukoy ang parirala sa dalawang kidney ng hayop; malinaw at likas sa Filipino ang “dalawang bato” sa kontekstong anatomikal.
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Sa mga tagubiling panghandog sa Levitico, tumutukoy ito sa mga piling matabang bahagi na inihahandog. Mas karaniwan at madaling maunawaan ang “taba” kaysa sa teknikal na katawagan.
- source_word: אֲשֶׁר עֲלֵהֶן אֲשֶׁר עַל הַכְּסָלִים
  choice: na nakabalot sa mga iyon sa may tagiliran
  rationale: Pinananatili ang kaugnayan ng taba sa mga bato at sa bahagi ng balakang/tagiliran, ngunit gumagamit ng natural na paglalarawang anatomikal sa Filipino. Ang “tagiliran” ay mas madaling maunawaan kaysa “balakang” dito at maaaring tumukoy sa flank/loin region.
- source_word: הַיֹּתֶרֶת
  choice: ang nakausling bahagi
  rationale: Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy. Ang “nakausling bahagi” ay nauunawaan ngunit hindi labis na tumitiyak na isa itong partikular na lobe.
- source_word: עַל הַכָּבֵד
  choice: ng atay
  rationale: Ipinapahayag ang malapit na anatomikal na kaugnayan sa atay nang natural sa Filipino. Ang mas literal na “nasa ibabaw ng atay” ay posibleng magbigay ng higit na katiyakan sa lokasyon kaysa sa pinahihintulutan ng di-tiyak na terminong anatomikal.
- source_word: עַל הַכְּלָיוֹת
  choice: kasama ng mga bato
  rationale: Sa pormulang panghandog, ipinahihiwatig na ang bahaging kaugnay ng atay ay aalisin kasabay ng mga bato. Natural at malinaw ang pamamaraang kahulugan nito sa Filipino.
- source_word: יְסִירֶנָּה
  choice: aalisin niya ang mga ito
  rationale: Ang Hiphil ng סור ay nagbibigay ng utos na alisin ang tinukoy na mga bahagi. Nilinaw ng “ang mga ito” ang pinagsama-samang layon sa natural na Filipino, habang nananatili ang preskriptibong lakas ng pandiwa.
