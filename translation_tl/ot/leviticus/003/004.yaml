  register: Makabago, malinaw, at marangal na Filipino para sa tagubiling pangritwal. Iniwasan ang sobrang teknikal na katawagang anatomikal at pinanatili sa talababa ang tunay na kawalang-katiyakan ng הַיֹּתֶרֶת.
