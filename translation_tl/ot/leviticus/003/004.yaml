  naturalness: Likas at angkop sa makabagong Filipino ang “mga bato,” “taba,” at “mga balakang” sa anatomikal na kontekstong ito. Ang binagong ayos ay nananatiling malinaw kahit pinananatili nito ang magkakapatong na paglalarawang anatomikal ng pinagmulan.
  terminology: Pinanatili ang “nakausling bahagi” para sa di-tiyak na יוֹתֶרֶת at nilinaw sa talababa ang alternatibong “umbok.” Isinalin ang עַל bilang “nasa ibabaw ng” upang mapanatili ang relasyong panglokasyon sa atay nang hindi ipinipilit na tiyak ang eksaktong anatomikal na katawagan.
