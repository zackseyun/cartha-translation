base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: tl
  text: 'Ito ay magiging isang permanenteng tuntunin[a] sa lahat ng salinlahi ninyo, saanman kayo naninirahan: Huwag kayong kumain ng anumang taba o anumang dugo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuntuning walang hanggan” o “tuntuning panghabang-panahon.” Sa mga tekstong legal, ang Hebreong עוֹלָם ay madalas tumukoy sa patuloy at namamalaging bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: tuntunin
  rationale: Ipinapahayag ng חֻקָּה ang isang itinakda at may-bisang alituntunin. Natural sa makabagong Filipino ang “tuntunin” at pinananatili nito ang legal na diwa nang hindi labis na teknikal.
- source_word: עוֹלָם
  choice: permanente
  rationale: Sa pormulang legal, tumutukoy ang עוֹלָם sa patuloy at namamalaging bisa. Malinaw ang “permanente” sa kasalukuyang Filipino, habang ang talababa ay nagpapanatili sa posibleng “walang hanggan” o “panghabang-panahon.”
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Ipinahihiwatig ng parirala ang pagpapatuloy ng tuntunin sa magkakasunod na henerasyon; malinaw at marangal ang “sa lahat ng salinlahi ninyo.”
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: saanman kayo naninirahan
  rationale: Ang מוֹשָׁב ay tumutukoy sa mga tirahan o lugar ng paninirahan. Mas natural sa modernong Filipino ang “saanman kayo naninirahan” at pinananatili ang saklaw na ‘sa lahat.’
- source_word: כָּל חֵלֶב
  choice: anumang taba
  rationale: Sa loob ng pagbabawal, natural na ipinahahayag ng “anumang taba” ang komprehensibong puwersa ng כָּל.
- source_word: וְכָל דָּם
  choice: o anumang dugo
  rationale: Kaagapay ng “anumang taba,” malinaw na saklaw ng “anumang dugo” ang kabuuang pagbabawal; ang “o” ay natural sa negatibong pangungusap sa Filipino.
- source_word: לֹא תֹאכֵלוּ
  choice: huwag kayong kakain
  rationale: Ang imperfect na may לֹא sa legal na konteksto ay isang pagbabawal. Ang “huwag kayong kakain” ay tuwiran, dignified, at likas sa Filipino.
theological_decisions:
- issue: Tagal ng utos na ipinapahayag ng עוֹלָם
  choice: tuntuning permanente
  alternative: tuntuning walang hanggan; tuntuning panghabang-panahon
  rationale: Pinananatili ng “permanente” ang diwa ng patuloy na bisa ng utos sa mga salinlahi at lugar ng paninirahan, nang hindi awtomatikong ginagawang pilosopikal na pahayag tungkol sa absolutong kawalang-hanggan. Inilalahad sa talababa ang tunay na saklaw ng mga posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tuntunin” sa halip na mas teknikal na “batas” o “ordinansa,” at “saanman kayo naninirahan” sa halip na literal ngunit di-gaanong likas na “sa lahat ng inyong tirahan.”
