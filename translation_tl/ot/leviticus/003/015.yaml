base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: tl
  text: Aalisin niya ang dalawang bato, ang taba sa ibabaw ng mga iyon na nasa may bandang baywang, at ang karugtong na bahagi sa atay[a], kasama ng mga bato.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umbok sa atay.” Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng salitang Hebreo na יֹתֶרֶת, kaya “karugtong na bahagi” ang ginamit sa teksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa ibabaw ng mga bato.” Dito, malamang na ang ibig sabihin ay aalisin ang bahaging ito kasama ng mga bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: dalawang bato
  rationale: Ang כְּלָיוֹת ay malinaw na tumutukoy sa mga kidney sa anatomiya ng handog. Sa karaniwang modernong Filipino, natural na tawag dito ang “mga bato.”
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: ang taba sa ibabaw ng mga iyon
  rationale: Sa konteksto ng mga handog, ang חֵלֶב ay ang piling taba na inaalis at inihahandog; malinaw at hindi teknikal ang “taba.” Ang “mga iyon” ay tumutukoy sa dalawang bato.
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: na nasa may balakang
  rationale: Ang כְּסָלִים ay tumutukoy sa rehiyon ng tagiliran o balakang. Ang “nasa may balakang” ay natural sa Filipino at hindi nagpapanggap ng higit na anatomikal na katiyakan kaysa sa Hebreo.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: ang karugtong na bahagi sa atay
  rationale: Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng יֹתֶרֶת. Pinananatili ng “karugtong na bahagi” ang pangkalahatang diwa ng nakausli o kasamang bahagi nang hindi ito tiyak na tinatawag na isang partikular na lobe.
- source_word: עַל הַכְּלָיֹת
  choice: kasama ng mga bato
  rationale: Bagaman literal na “sa ibabaw ng mga bato,” sa pormulang panghandog ay malamang na tagubilin itong alisin ang bahaging nasa atay kasabay ng mga bato. Inilalagay sa talababa ang literal na anyo upang mapanatili ang tunay na kalabuan.
- source_word: יְסִירֶנָּה
  choice: aalisin niya
  rationale: Ang Hiphil ng סור ay may diwang “alisin.” Ang panghinaharap na anyong “aalisin niya” ay natural na paraan ng pagpapahayag ng legal na tagubilin sa modernong Filipino.
