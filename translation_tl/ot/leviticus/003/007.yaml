id: LEV.3.7
reference: Leviticus 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִם כֶּ֥שֶׂב הֽוּא מַקְרִ֖יב אֶת קָרְבָּנ֑/וֹ וְ/הִקְרִ֥יב אֹת֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: tl
  text: Kung tupa[a] ang inihahandog niya bilang kanyang handog, ihaharap niya ito sa harapan ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “batang tupa.”
    reason: Maaaring tukuyin ng כֶּשֶׂב ang tupa sa pangkalahatan o, ayon sa konteksto, ang isang batang tupa.
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Nagpapakilala ito ng isang kondisyonal na kaso sa mga tagubilin tungkol sa paghahandog.
- source_word: כֶּשֶׂב
  choice: tupa
  rationale: Maaaring tumukoy ang salita sa tupa, at kung minsan ay sa batang tupa. Pinananatili ng “tupa” ang mas malawak na kahulugan nang hindi ipinapalagay ang edad ng hayop.
- source_word: מַקְרִיב אֶת־קָרְבָּנוֹ
  choice: ang inihahandog niya bilang kanyang handog
  rationale: Ipinahahayag nito kapwa ang kilos ng pagdadala o paghahandog at ang hayop bilang kanyang handog, habang pinananatili ang pag-uulit na nasa Hebreo.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: ihaharap niya ito
  rationale: Sa kontekstong legal, ang pandiwa ay nagbibigay ng kasunod na tagubilin. Ang “ihaharap” ay natural na nagsasaad ng pagdadala sa hayop sa itinakdang presensya.
- source_word: לִפְנֵי
  choice: sa harapan ni
  rationale: Tuwirang pinananatili ang pananalitang pansaklaw at pangkulto na tumutukoy sa paghaharap sa presensya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ng “Yahweh” ang banal na pangalang tuwirang nasa tekstong Hebreo at hindi ito pinapalitan ng titulong “Panginoon.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kondisyonal na ayos ng talata at ang bahagyang pag-uulit ng “inihahandog” at “handog” upang maipakita ang anyo at diin ng Hebreo.
