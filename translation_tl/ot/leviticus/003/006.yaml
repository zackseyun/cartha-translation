  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: tl
  text: At kung mula sa kawan ang handog niya para sa haing pangkapayapaan[a] kay Yahweh, lalaki o babae, ihahandog niya itong walang kapintasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hain ng mabuting ugnayan” o “hain ng pagsasalo.” Ang salitang Hebreo na שְׁלָמִים (shelamim) ay karaniwang isinasaling “haing pangkapayapaan,” ngunit maaari rin itong magdiin sa kagalingan, mabuting ugnayan, at pagsasalo sa pagkain sa paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at ang pasubaling diwa, kaya malinaw na karugtong ito ng naunang tagubilin.
- source_word: מִן הַצֹּאן
  choice: mula sa kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; hindi nito nililimitahan ang handog sa isa lamang sa dalawang uri.
- source_word: קָרְבָּנוֹ
  choice: ang handog niya
  rationale: Ang קָרְבָּן ay karaniwang terminong pansakripisyo para sa bagay na inihahandog o inilalapit.
- source_word: לְזֶבַח שְׁלָמִים
  choice: bilang haing pangkapayapaan
  rationale: Pinananatili ng “hain” ang diwa ng זֶבַח at ng “pangkapayapaan” ang tradisyonal na teknikal na kahulugan ng שְׁלָמִים, habang inilalagay sa talababa ang posibleng diin sa mabuting ugnayan at pagsasalo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang pang-ukol na לְ ay nagpapahiwatig na ang handog ay inilalaan at inihaharap kay Yahweh; tahasang isinasalin ang pangalang יהוה.
- source_word: זָכָר אוֹ נְקֵבָה
  choice: lalaki man o babae
  rationale: Likas na salin sa Filipino ng alternatibong kasarian ng hayop at pinananatili ang ayos ng pinagmulan.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ito sa hayop na walang pisikal na depekto.
- source_word: יַקְרִיבֶנּוּ
  choice: ihahandog niya ito
  rationale: Ang Hiphil ng קרב sa kontekstong ito ay nangangahulugang iharap o ihandog; natural at tumpak ang “ihahandog.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo, kaya tahasan itong isinasalin bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: hain ng mabuting ugnayan; hain ng pagsasalo
  rationale: Pinananatili sa pangunahing teksto ang kinikilalang terminong pansakripisyo, ngunit hindi itinatago ang mas malawak na pahiwatig ng kagalingan, mabuting ugnayan, at sama-samang pagkain; inilalahad ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kawan” bilang kolektibong tawag sa mga tupa at kambing, at “walang kapintasan” bilang natural na terminong pansakripisyo.
