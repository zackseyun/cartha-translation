translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Pinanatili ang pagpapalit mula sa maramihang simuno (“nila”) tungo sa isahang simuno (“niya”) na nasa tekstong Hebreo. Inilagay ang panandang [a] pagkatapos ng pariralang kaugnay ng קטר upang malinaw na ang talababa ay alternatibong salin ng “sinunog niya,” hindi ng “mga dibdib.”
