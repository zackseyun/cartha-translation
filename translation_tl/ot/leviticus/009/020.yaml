  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: tl
  text: Inilagay nila ang mga piraso ng taba sa ibabaw ng mga dibdib, at sinunog niya[a] ang mga piraso ng taba sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “pinausok niya sa altar ang mga piraso ng taba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Inilagay nila
  rationale: Ang שׂים ay karaniwang nangangahulugang ilagay o ipatong. Likas sa modernong Tagalog ang “inilagay” at hindi nito dinaragdagan ang kahulugan ng ritwal na kilos.
- source_word: הַחֲלָבִים
  choice: ang mga piraso ng taba
  rationale: Sa konteksto ng paghahandog, ang maramihang anyo ng חֵלֶב ay tumutukoy sa mga bahaging taba na inalis upang ihandog. Nililinaw ng “mga piraso ng taba” ang kongkretong maramihang kahulugan.
- source_word: עַל הֶחָזוֹת
  choice: sa ibabaw ng mga dibdib
  rationale: Sa mga batas tungkol sa paghahandog, ang חָזֶה ay ang bahaging dibdib ng hayop. Pinananatili ng “mga dibdib” ang maramihang anyo at ang anatomikal na kahulugan.
- source_word: וַיַּקְטֵר
  choice: sinunog niya
  rationale: Sa kontekstong panghandog ng tekstong makasaserdote, ang קטר ay tumutukoy sa pagsunog ng handog sa altar, kalakip ang diwa ng pagpapausok. Malinaw at natural ang “sinunog niya,” habang inilalahad sa talababa ang mas literal na larawan ng usok.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ang anyong patungo na nakakabit sa מִזְבֵּחַ pagkatapos ng קטר ay likas na tumutukoy sa lugar ng pagsunog; kaya ang “sa altar” ang idiomatikong salin.
