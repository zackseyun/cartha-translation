  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: tl
  text: At lumabas ang apoy mula sa harapan ni Yahweh at tinupok nito sa altar ang handog na sinusunog at ang mga matatabang bahagi. Nakita ito ng buong bayan, at sumigaw sila sa galak at nagpatirapa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: lumabas ang apoy
  rationale: Tuwirang ipinapahayag ng יצא ang paglabas; natural at matingkad sa Tagalog ang “lumabas ang apoy.”
- source_word: מִלִּפְנֵי יְהוָה
  choice: mula sa harapan ni Yahweh
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo na “mula sa harapan” at ang pangalang tipan na Yahweh, nang hindi nililimitahan ang diwa sa isang pisikal na lokasyon lamang.
- source_word: וַתֹּאכַל
  choice: tinupok nito
  rationale: Bagaman literal na “kinain,” ang “tinupok” ang likas na salitang Tagalog para sa pagkonsumo ng apoy at malinaw ang tinutukoy ng panghalip.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Karaniwan at malinaw na katumbas sa modernong Tagalog.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Malinaw nitong ipinahihiwatig ang uri ng hain na עֹלָה nang hindi nagdaragdag ng paliwanag na wala sa talata.
- source_word: הַחֲלָבִים
  choice: ang mga bahaging taba
  rationale: Tumutukoy ang maramihang anyo sa itinakdang matatabang bahagi ng haing iniaalay, hindi lamang sa taba sa pangkalahatan.
- source_word: וַיַּרְא כָּל הָעָם
  choice: Nang makita iyon ng buong bayan
  rationale: Natural sa Tagalog ang pag-uugnay sa nakita nilang pangyayari sa pamamagitan ng “iyon,” habang pinananatili ang saklaw ng כָּל.
- source_word: וַיָּרֹנּוּ
  choice: sumigaw sila sa galak
  rationale: Saklaw ng רנן ang malakas at masayang sigaw; hindi nito kinakailangang ipahiwatig ang pormal na pag-awit.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: nagpatirapa
  rationale: Likas at marangal na Tagalog para sa literal na pagbagsak nang nakadapa ang mukha, na nagpapahiwatig ng pagpipitagan o pagsamba.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng pagpapatirapa
  choice: nagpatirapa
  alternative: sumubsob sila; nagpatirapa sila bilang pagsamba
  rationale: Inilalarawan ng Hebreo ang kilos ngunit hindi tahasang pinapangalanan ang panloob na layunin nito; kaya hindi idinagdag sa pangunahing teksto ang “bilang pagsamba.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “altar,” isang laganap at madaling maunawaang terminong panrelihiyon. Pinili ang maiikling sugnay at likas na daloy habang pinananatili ang sunod-sunod na kilos sa Hebreo.
