translation:
  language: tl
  text: Ngunit sinunog niya sa apoy ang laman at balat sa labas ng kampo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sinunog niya sa apoy ang laman at balat sa labas ng kampo.”
    reason: Ipinakikita ang payak na dugtong na “At” para sa וְ; ang “Ngunit” sa pangunahing teksto ay isang natural na pagmamarka ng kaibahan sa naunang talata.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Ngunit ang
  rationale: Ang וְ ay nagpapatuloy sa salaysay ngunit minamarkahan din dito ang kaibahan sa inihandog sa altar sa naunang talata; natural sa Tagalog ang “Ngunit.” Ang אֵת ay pananda ng tuwirang layon at hindi hiwalay na isinasalin.
- source_word: הַ/בָּשָׂר
  choice: ang laman
  rationale: Ang בָּשָׂר ay tumutukoy sa laman ng hayop. Ang “laman” ay malinaw, dignified, at angkop sa konteksto ng paghahandog.
- source_word: הָ/ע֑וֹר
  choice: ang balat
  rationale: Ang עוֹר ay balat o hide ng hayop; “balat” ang karaniwan at likas na katumbas sa modernong Tagalog.
- source_word: שָׂרַף
  choice: sinunog niya
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagsunog. Pinananatili ang panlalaking isahang gumaganap na ipinahihiwatig ng anyong Hebreo at malinaw sa konteksto.
- source_word: בָּ/אֵשׁ
  choice: sinunog
  rationale: Sa natural na Tagalog, taglay na ng pandiwang “sinunog” ang ideya ng paggamit ng apoy; ang tahasang “sa pamamagitan ng apoy” ay magiging mabigat at kalabisan. Nasa talababa ang mas pormal na anyo.
- source_word: מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה
  choice: sa labas ng kampo
  rationale: Tumpak at natural itong tumutukoy sa lugar sa labas ng himpilan ng Israel at pinananatili ang ritwal-heograpikong kahulugan.
theological_decisions:
- issue: Wika ng ritwal na pagtatapon sa konteksto ng paghahandog
  choice: Ilarawan nang tuwiran ang pagsunog sa laman at balat sa labas ng kampo.
  alternative: Gumamit ng pananalitang nagpapahiwatig ng mga tipolohikal o mas huling teolohikal na kaugnayan.
  rationale: Pamamaraang panghandog ang tahasang inilalarawan ng talata. Hindi dapat ipasok sa salin ang simbolismong hindi mismo ipinahahayag ng tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “kampo” bilang malinaw at kasalukuyang tawag sa Israelitang himpilan. Ang pangunahing teksto ay natural ang ayos, samantalang pinananatili sa talababa ang mas pormal na alternatibo.
