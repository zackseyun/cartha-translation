  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: tl
  text: At dinala nila sa harap ng Tolda ng Tipanan ang iniutos ni Moises. Lumapit ang buong kapulungan at tumayo sa harap ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: dinala nila
  rationale: Bagaman karaniwang nangangahulugang “kumuha” ang לקח, ipinahihiwatig ng patunguhang pariralang kasunod na dinala nila ang mga bagay sa isang tiyak na lugar. Likas sa Tagalog ang “dinala nila.”
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: ang iniutos ni Moises
  rationale: Tumutukoy ang pariralang ito sa mga bagay na ipinag-utos sa naunang konteksto. Maikli at natural ang “ang iniutos ni Moises” nang hindi nililimitahan kung mga bagay o tagubilin ang tinutukoy.
- source_word: אֶל־פְּנֵי
  choice: sa harap ng
  rationale: 'Dito ay pangunahing panlunan ang idyoma: ang lugar sa harapan ng tolda. Pinananatili rin nito ang pagkakaiba sa huling pariralang tumutukoy sa pagharap kay Yahweh.'
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa itinakdang pagkikita o pagtitipon. Ang “toldang tipanan” ay malinaw, maikli, at nakaugat sa layunin nitong lugar ng pakikipagtagpo, nang hindi gumagamit ng mas eklesyastikong “tabernakulo.”
- source_word: וַיִּקְרְבוּ
  choice: lumapit
  rationale: Tuwirang ipinahahayag ng קרב ang paglapit. Natural at dignidad ang “lumapit” sa modernong Tagalog.
- source_word: כָּל־הָעֵדָה
  choice: ang buong kapulungan
  rationale: Sa kontekstong ito, ang עֵדָה ay ang nagkakatipong pamayanan ng Israel. Mas natural sa Tagalog ang “buong kapulungan” kaysa “lahat ng kapulungan.”
- source_word: וַיַּעַמְדוּ
  choice: tumayo
  rationale: Tuwiran at sapat na katumbas ng עמד ang “tumayo”; hindi kailangang dagdagan ng ideya ng pananatili o pagpuwesto.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito kapwa ang pisikal at panambahang diwa ng pagharap sa presensiya ni Yahweh, at tuwirang isinasalin ang banal na pangalan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  alternative: sa presensiya ni Yahweh
  rationale: Ang “sa harap” ay nagpapanatili sa sabay na panlunan at panambahang diwa ng parirala nang ipaliwanag nang labis ang paraan ng banal na presensiya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Gumamit ng maiikling pangungusap upang maiwasan ang mabigat na sunuran ng mga sugnay. Pinanatili ang “Yahweh” bilang pangalang pantangi at ang “kapulungan” para sa sama-samang pamayanan ng Israel.
