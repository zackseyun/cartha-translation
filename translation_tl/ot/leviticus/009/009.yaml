  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: tl
  text: Inilapit sa kanya ng mga anak na lalaki ni Aaron ang dugo[a]. Isinawsaw niya ang kanyang daliri sa dugo at ipinahid iyon sa mga sungay ng altar[b]. Pagkatapos, ibinuhos niya ang dugo sa paanan ng altar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iniharap sa kanya”; sa ritwal na konteksto, ang pandiwang Hebreo ay maaaring mangahulugang “inilapit” o “iniharap.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga sungay ng altar” ay ang nakausling mga bahagi sa mga sulok nito.
    reason: cultural_note
  - marker: c
    text: Sa literal, “sa pundasyon ng altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: Inilapit
  rationale: Ang Hiphil ng קרב ay nangangahulugang maglapit o magharap. Ang “inilapit” ay natural sa Filipino at pinananatili ang ritwal na pagdadala ng dugo kay Aaron.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Tuwirang katumbas ng pariralang construct at karaniwang paraan ng pagpapahayag ng ugnayang pampamilya sa Filipino.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Pinanatili ang katiyakan ng pangngalan; ito ang partikular na dugo ng handog na tinutukoy ng konteksto.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinanatili ang panghalip ng Hebreo sa halip na tahasang ipalit ang pangalang Aaron; pinakamalamang na si Aaron ang tinutukoy ayon sa konteksto.
- source_word: וַיִּטְבֹּל
  choice: Isinawsaw
  rationale: Ang טבל ay lumulubog o nagsasawsaw; “isinawsaw” ang malinaw at likas na pandiwa para sa paglalagay ng daliri sa dugo.
- source_word: אֶצְבָּעוֹ
  choice: kanyang daliri
  rationale: Pinanatili ang isahan at ang pagmamay-ari.
- source_word: וַיִּתֵּן עַל
  choice: ipinahid iyon sa
  rationale: Sa ritwal na kontekstong ito, inilalarawan ng נתן על ang paglalapat ng dugo. Mas likas at tiyak sa Filipino ang “ipinahid” kaysa sa pangkalahatang “inilagay,” nang hindi binabago ang kilos.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: mga sungay ng altar
  rationale: Pinanatili ang kongkretong terminong pangkulto para sa nakausling mga sulok ng altar.
- source_word: יָצַק
  choice: ibinuhos
  rationale: Ang pandiwa ay nangangahulugang magbuhos; ang “ibinuhos” ay malinaw at natural para sa dugo.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: sa paanan ng altar
  rationale: Ang יְסוֹד ay pundasyon o pinakaibaba. Ang “paanan” ay madaling maunawaan bilang ibabang bahagi ng altar, habang inilalahad sa talababa ang mas literal na “pundasyon.”
theological_decisions:
- issue: Tinutukoy ng panghalip sa אֵלָיו
  choice: Kay Aaron dinala ang dugo
  alternative: Sa altar o sa ibang ipinahihiwatig na tinutukoy dinala ang dugo
  rationale: Si Aaron ang gumaganap ng ritwal sa agarang konteksto, samantalang tumutulong ang kanyang mga anak; kaya siya ang pinakanatural na pinatutungkulan ng panghalip. Pinanatili sa salin ang panghalip upang hindi gawing mas tahasan kaysa sa Hebreo.
- issue: Dugong ibinuhos sa paanan
  choice: Ang natitirang dugo
  alternative: Ang dugo, nang hindi tahasang sinasabing natitira
  rationale: Muling ginagamit ng Hebreo ang tiyak na “ang dugo” matapos maipahid ang bahagi nito sa mga sungay. Ang “natitirang” ay likas na paglilinaw sa Filipino sa lohika ng pagkakasunod-sunod, ngunit hindi ito nagpapahiwatig ng hiwalay na uri ng dugo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” na karaniwan at madaling maunawaang terminong biblikal. Hinati sa tatlong pangungusap upang maging natural ang salaysay, at lahat ng talababa ay may katumbas na marker sa pangunahing teksto.
