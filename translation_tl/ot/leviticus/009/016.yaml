  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: tl
  text: At iniharap niya ang handog na sinusunog at isinagawa niya ito ayon sa tuntunin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa itinakdang paraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: iniharap
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap. Sa konteksto ng paghahandog, malinaw at likas ang “iniharap” at hindi nito inuulit ang ideya ng pagsasagawa sa kasunod na pandiwa.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ang עֹלָה ang karaniwang katawagan sa handog na lubusang sinusunog. Ang saling ito ay malinaw sa makabagong Tagalog at angkop sa konteksto ng Levitico.
- source_word: וַיַּעֲשֶׂהָ
  choice: isinagawa iyon
  rationale: Malawak ang kahulugan ng עשה—“gawin” o “isagawa.” Dito, tumutukoy ito sa pagsasagawa ng ritwal para sa handog; pinananatili ng “isinagawa iyon” ang lawak ng pandiwa nang hindi ito nililimitahan sa isang tiyak na hakbang.
- source_word: כַּמִּשְׁפָּט
  choice: ayon sa tuntunin
  rationale: Sa kontekstong ito, ang מִשְׁפָּט ay tumutukoy sa itinakdang pamantayan o wastong ritwal na pamamaraan. Pinananatili ng “ayon sa tuntunin” ang legal at pormal na diwa ng salita.
