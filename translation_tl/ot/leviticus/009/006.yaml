id: LEV.9.6
reference: Leviticus 9:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: tl
  text: Sinabi ni Moises, “Ito ang ipinag-utos ni Yahweh na gawin ninyo, at magpapakita sa inyo ang kaluwalhatian ni Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “upang magpakita sa inyo ang kaluwalhatian ni Yahweh.”'
    reason: Pinananatili ang alternatibong pagbasa sa pangwakas na sugnay bilang layunin o bunga, sa halip na bilang koordinadong pangako.
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Sinabi ni Moises
  rationale: Likas na salaysay sa modernong Filipino; ipinagpapatuloy ng וַ ang daloy ng pangyayari nang hindi kailangang gawing tahasang “At” o “Pagkatapos.”
- source_word: זֶה הַדָּבָר
  choice: Ito ang
  rationale: Ang literal na “ito ang bagay” ay matigas sa Filipino. Ang “Ito ang” ay natural at tapat na nagpapakilala sa iniutos na gagawin.
- source_word: צִוָּה יְהוָה
  choice: ipinag-utos ni Yahweh
  rationale: Pinananatili ng “ipinag-utos” ang awtoridad ng צוה, at ang personal na pangalang יהוה ay tinumbasang “Yahweh.”
- source_word: תַּעֲשׂוּ
  choice: na gawin ninyo
  rationale: Malinaw na ipinakikita ng “ninyo” na maramihan ang kausap.
- source_word: וְיֵרָא אֲלֵיכֶם
  choice: at magpapakita sa inyo
  rationale: Direktang inilalarawan ang Niphal na anyo bilang pagpapakita o pagpapahayag ng presensiya; pinananatili ng “at” ang posibleng payak na koordinasyon sa Hebreo.
- source_word: כְּבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Karaniwan at marangal na katumbas ng כבוד sa kontekstong tumutukoy sa nahahayag na kadakilaan ng Diyos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang tekstong Hebreo ay gumagamit ng personal na pangalang יהוה; ang “Yahweh” ay direktang transliterasyon at hindi pamalit na titulo.
- issue: Lakas ng pangwakas na sugnay וְיֵרָא
  choice: “at magpapakita sa inyo” bilang kasunod na pangyayari o pangako
  alternative: “upang magpakita sa inyo” bilang layunin o bunga
  rationale: Maaaring ipahiwatig ng וְיֵרָא ang koordinadong pangyayari/pangako o ang bunga ng pagsunod. Pinanatili sa pangunahing teksto ang mas tuwirang “at,” at inilagay sa talababa ang posibleng layunin/bunga.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Iniwasan ang matigas na literalismong “Ito ang bagay,” ngunit pinanatili ang awtoridad ng utos, ang maramihang kausap, ang banal na pangalan, at ang kalabuan ng ugnayan ng pangwakas na sugnay.
