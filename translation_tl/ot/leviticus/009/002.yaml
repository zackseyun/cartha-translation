  naturalness: Nauunawaan ang draft ngunit medyo mabigat ang “isang guya mula sa bakahan” at hindi likas ang “batang hayop na bovine.” Mas natural sa modernong Filipino ang “isang guya” sa teksto, na may paliwanag sa talababa para sa literal na Hebreong parirala.
  terminology: Ang “handog para sa kasalanan,” “handog na sinusunog,” “lalaking tupa,” at “Yahweh” ay angkop at tapat sa mga terminong Hebreo. Pinanatili ang “walang kapintasan” para sa תְּמִימִם.
