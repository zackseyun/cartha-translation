base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: tl
  text: At sinabi niya kay Aaron, “Kumuha ka para sa iyong sarili ng isang guya[a] bilang handog para sa kasalanan at isang lalaking tupa bilang handog na sinusunog, kapwa walang kapintasan, at iharap mo ang mga ito sa harapan ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang guya, anak ng kawan ng baka”—ibig sabihin, isang batang baka.
    reason: Pinananatili nito ang natatanging appositional na pariralang Hebreo at ipinapaliwanag ang kahulugan nito nang natural sa Filipino.
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אַהֲרֹן
  choice: At sinabi niya kay Aaron
  rationale: Pinananatili ng “At” ang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, habang hindi pinapalitan ng pangalan ang panghalip na nasa Hebreo.
- source_word: קַח לְךָ
  choice: Kumuha ka para sa iyong sarili
  rationale: Ipinahahayag nito ang imperatibo at ang personal o reflexive na diwa ng לְךָ sa likas na modernong Tagalog.
- source_word: עֵגֶל בֶּן בָּקָר
  choice: isang guya mula sa bakahan
  rationale: Ang “guya” ay likas na tawag sa batang hayop na bovine; ang “mula sa bakahan” ay malinaw na katumbas ng idyomatikong pariralang בֶּן בָּקָר nang hindi ipinapalagay nang higit sa teksto ang tiyak na gulang nito.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang חַטָּאת sa handog at hindi lamang sa abstraktong kasalanan.
- source_word: וְאַיִל
  choice: at ng isang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa, ang karaniwang hayop na tinutukoy sa ganitong kontekstong pansakripisyo.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ito ang malinaw at nakaugaliang salin sa Tagalog ng teknikal na terminong pansakripisyo na עֹלָה.
- source_word: תְּמִימִם
  choice: Dapat walang kapintasan ang dalawa
  rationale: Ginagawang malinaw ng “ang dalawa” na ang pangmaramihang pang-uri ay tumutukoy kapuwa sa guya at sa lalaking tupa.
- source_word: וְהַקְרֵב
  choice: at iharap mo ang mga ito
  rationale: Ang Hiphil ng קרב ay “ilapit” o “iharap” sa kontekstong ritwal. Hindi ito isinaling “ialay” upang hindi pangunahan ang kasunod na aktuwal na paghahandog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang karaniwang pansamba at pansakripisyong diwa ng pagiging nasa presensiya ni Yahweh.
theological_decisions:
- issue: Pagkasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Ang “Yahweh” ay kumakatawan sa personal na pangalang tipan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa pagsamba. Ginamit ang mga karaniwang katawagang pansakripisyo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
