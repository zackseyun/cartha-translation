  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: tl
  text: Pagkatapos, kinatay niya ang toro at ang lalaking tupa bilang handog para sa kapayapaan[a] na para sa bayan. Dinala sa kanya ng mga anak na lalaki ni Aaron ang dugo, at isinaboy niya iyon sa altar, sa buong palibot nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa kagalingan” o “handog ng pakikipag-isa.” Ang salitang Hebreo na שְׁלָמִים ay may mga pahiwatig ng kapayapaan, kabuuan o kagalingan, at pakikipag-ugnayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Pagkatapos, pinatay niya
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay. Ang “pinatay” ay natural sa modernong Filipino; nililinaw ng konteksto na ritwal na pagkatay ang tinutukoy.
- source_word: הַשּׁוֹר
  choice: ang toro
  rationale: Ang שׁוֹר ay tumutukoy sa hayop na baka; sa kontekstong handog, ang “toro” ang malinaw at karaniwang salin sa Filipino.
- source_word: הָאַיִל
  choice: ang lalaking tupa
  rationale: Ang אַיִל ay partikular na lalaking tupa. Mas madaling maunawaan ng pangkalahatang mambabasa ang “lalaking tupa” kaysa sa hiram na terminong “barakong tupa.”
- source_word: זֶבַח הַשְּׁלָמִים
  choice: bilang handog para sa kapayapaan
  rationale: Pinananatili nito ang kaugnayan ng שְׁלָמִים sa kapayapaan, habang ang “para sa” ay natural sa Filipino at hindi ipinapalagay na iisa lamang ang saklaw ng terminong may mga pahiwatig din ng kabuuan, mabuting kalagayan, at pakikipag-ugnayan.
- source_word: אֲשֶׁר לָעָם
  choice: na para sa bayan
  rationale: Tuwirang ipinakikita ng parirala na ang handog ay inihandog para sa kapakanan o sa ngalan ng bayan.
- source_word: וַיַּמְצִאוּ ... אֵלָיו
  choice: Dinala sa kanya
  rationale: Sa ritwal na konteksto, ipinahihiwatig ng pandiwa ang pagdadala o paghaharap ng dugo sa nangangasiwa. Pinananatili ang panghalip ng Hebreo.
- source_word: וַיִּזְרְקֵהוּ
  choice: isinaboy niya iyon
  rationale: Ang זָרַק sa ritwal ng dugo ay mas malakas kaysa sa marahang pagwiwisik; ang “isinaboy” ay angkop sa paghahagis o pagpapatama ng dugo sa altar.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa palibot ng altar
  rationale: Natural nitong ipinahahayag na inilapat ang dugo sa mga panig sa buong paligid ng altar, nang hindi labis na tinutukoy ang eksaktong galaw.
theological_decisions:
- issue: Saklaw ng terminong שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa mabuting kalagayan; handog ng pakikipag-isa
  rationale: Pinili ang tradisyonal at leksikal na ugnayan sa kapayapaan, ngunit inilagay sa talababa ang tunay na lawak ng salitang Hebreo upang hindi ikulong ang kahulugan sa isang doktrinal na pagbasa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong לָעָם at ang “lalaking tupa” sa halip na mas bihira o teknikal na katawagan. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
