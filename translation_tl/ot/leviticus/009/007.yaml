  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: tl
  text: Sinabi ni Moises kay Aaron, “Lumapit ka sa altar at ihandog mo ang iyong handog para sa kasalanan[a] at ang iyong handog na sinusunog. Magbayad-sala ka para sa iyong sarili at para sa bayan. Pagkatapos, ihandog mo ang handog ng bayan at magbayad-sala ka para sa kanila, ayon sa iniutos ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog para sa kasalanan, ngunit sa ilang konteksto ay binibigyang-diin nito ang paglilinis mula sa karumihang ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב
  choice: Lumapit ka
  rationale: Ang pautos na anyo ng קרב sa kontekstong pangritwal ay nangangahulugang lumapit; natural at tuwiran ito sa makabagong Tagalog.
- source_word: הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Karaniwang katawagan sa Tagalog para sa tiyak na dambanang pinaghahandugan sa konteksto.
- source_word: וַעֲשֵׂה
  choice: ihandog mo
  rationale: Bagaman literal na 'gawin,' ang עשה na may sakripisyo bilang layon ay tumutukoy sa pagsasagawa o paghahandog nito.
- source_word: חַטָּאתְךָ
  choice: iyong handog para sa kasalanan
  rationale: Sa batas tungkol sa mga handog, tumutukoy ang חַטָּאת sa handog na nauugnay sa kasalanan o ritwal na paglilinis; pinananatili sa talababa ang lehitimong alternatibo.
- source_word: עֹלָתֶךָ
  choice: iyong handog na sinusunog
  rationale: Tumutukoy ang עֹלָה sa handog na buong sinusunog; malinaw at pamilyar ang salin.
- source_word: וְכַפֵּר
  choice: gumawa ka ng pantubos
  rationale: Pinananatili nito ang malawak na ritwal at teolohikal na diwa ng כפר nang hindi itinatakda ang isang partikular na teorya ng pagtubos.
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: para sa iyong sarili at para sa bayan
  rationale: Ipinahihiwatig ng בעד ang pagkilos alang-alang o bilang kinatawan ng iba; natural itong naipapahayag ng 'para sa' sa Tagalog.
- source_word: קָרְבַּן הָעָם
  choice: ang handog ng bayan
  rationale: Ang קָרְבָּן ay pangkalahatang katawagan sa inihahandog, at malinaw na pinananatili ng parirala ang ugnayang konstruktibo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: ayon sa iniutos ni Yahweh
  rationale: Ipinapahayag nito ang pagsunod sa mismong utos, habang pinananatili ang personal na pangalang יְהוָה bilang Yahweh.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring idiin ng salita ang kasalanan o ang ritwal na paglilinis. Ginagamit sa pangunahing teksto ang malinaw at pamilyar na salin, ngunit itinatala ang alternatibo upang hindi mawala ang saklaw ng Hebreo.
- issue: Pagpapakahulugan sa כפר
  choice: gumawa ng pantubos
  alternative: magsagawa ng ritwal na paglilinis
  rationale: Ang 'pantubos' ay nagpapanatili sa bigat na ritwal at teolohikal ng salita nang hindi nag-aangkat ng isang makitid na doktrina; nananatiling bukas ang kaugnayan nito sa paglilinis at pakikipagkasundo.
- issue: Paglalarawan kung para kanino ang pagtubos
  choice: para sa iyong sarili at para sa bayan
  alternative: alang-alang sa iyong sarili at sa bayan
  rationale: Pinananatili ng payak na 'para sa' ang representatibong puwersa ng בעד nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'altar' bilang karaniwang salitang nauunawaan ng mga mambabasa, at 'Yahweh' upang tuwirang katawanin ang banal na pangalang nasa tekstong Hebreo.
