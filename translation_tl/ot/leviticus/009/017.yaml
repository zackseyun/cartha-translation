  text: Then he presented the grain offering[a], filled his hand from it, and burned it on the altar, besides the morning burnt offering.
translation:
  language: tl
  text: Pagkatapos, iniharap niya ang handog na butil, pinuno niya ang kanyang palad ng bahagi nito,[a] at sinunog niya ito sa altar, bilang karagdagan sa handog na sinusunog sa umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pinuno niya ang kanyang palad mula rito,” isang idyoma para sa pagkuha sa palad ng isang bahagi ng handog na butil upang sunugin sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: iniharap niya
  rationale: Sa kontekstong paghahandog, ang Hiphil ng קרב ay nangangahulugang ilapit o iharap. Ang “iniharap” ay natural at pinananatili ang rituwal na diwa nang hindi labis na nagpapakahulugan.
- source_word: הַמִּנְחָה
  choice: ang handog na butil
  rationale: Sa mga tuntunin ng paghahandog sa Levitico, ang מִנְחָה ay tumutukoy sa handog mula sa butil, hindi lamang sa isang pangkalahatang kaloob.
- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: pinuno niya ang kanyang palad mula rito
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo. Ipinahihiwatig ng idyoma ang pagkuha ng isang bahaging kasya sa palad upang sunugin sa altar.
- source_word: וַיַּקְטֵר
  choice: sinunog iyon
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קטר ay tumutukoy sa pagsunog ng handog upang maging usok. Sapat na malinaw ang “sinunog” dahil binabanggit ang altar.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Ito ang natural na modernong Tagalog para sa lokatibong parirala sa kontekstong ito.
- source_word: מִלְּבַד
  choice: bilang karagdagan sa
  rationale: Dito, ipinakikita ng parirala na ang handog na butil ay sinunog bukod pa, o dagdag, sa karaniwang handog sa umaga.
- source_word: עֹלַת הַבֹּקֶר
  choice: ang handog na sinusunog tuwing umaga
  rationale: Ang עֹלָה ay handog na lubusang sinusunog. Ang “tuwing umaga” ay malinaw na nagpapahayag na ito ang regular na pang-umagang handog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang mga terminong “handog na butil,” “altar,” at “handog na sinusunog” para sa malinaw at pare-parehong bokabularyong pansakripisyo. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang ipinaliliwanag nito.
