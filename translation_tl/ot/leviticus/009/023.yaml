base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: tl
  text: Pumasok sina Moises at Aaron sa Tolda ng Tipanan. Paglabas nila, binasbasan nila ang bayan. At nagpakita sa buong bayan ang kaluwalhatian ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Likas at dignified na salin sa modernong Filipino para sa itinakdang tolda kung saan nakikipagtagpo ang Diyos sa Israel; pinananatili ang teknikal na kahulugan nito sa pagsamba.
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: Pumasok ... Paglabas nila
  rationale: Malinaw na ipinapakita ang sunod-sunod na pagpasok at paglabas. Bagaman singular ang unang pandiwa sa anyong Masoretiko, sina Moises at Aaron ang magkaugnay na simuno at plural ang sumunod na mga pandiwa.
- source_word: וַיְבָרֲכוּ
  choice: binasbasan nila
  rationale: Tuwirang katumbas ng pandiwang Hebreo nang hindi dinaragdagan kung anong anyo o mga salita ang ginamit sa pagbabasbas.
- source_word: הָעָם / כָּל הָעָם
  choice: ang bayan / ang buong bayan
  rationale: Ang עָם ay tumutukoy sa nagkakatipong sambayanan ng Israel; natural at sapat na malawak ang “bayan” sa kontekstong ito.
- source_word: כְבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Pinananatili ang diwa ng כָּבוֹד bilang hayag na maringal na presensya ng Diyos, at isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: וַיֵּרָא
  choice: nagpakita
  rationale: Ang Niphal ay nagsasaad ng nakikitang pagpapahayag o paglitaw; natural sa Filipino ang “nagpakita” sa konteksto ng teopaniya.
- source_word: אֶל כָּל הָעָם
  choice: sa buong bayan
  rationale: Natural na Filipino para sa pagpapakita sa lahat ng naroon, nang hindi nagdaragdag ng paliwanag na wala sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayang temporal ng magkakasunod na sugnay
  choice: Paglabas nila ... At nagpakita
  alternative: Lumabas sila at ... Pagkatapos ay nagpakita
  rationale: Ipinapahayag ang malinaw na pagkakasunod-sunod ng mga kilos sa natural na Filipino, ngunit hindi nagpapahiwatig ng mas matibay na sanhi o temporal na diin kaysa nasa Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “sina” para sa magkaugnay na mga pangalang pantangi at maiikling pangungusap upang maging natural ang daloy habang nananatiling malapit sa Hebreong salaysay.
