base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: tl
  text: Iniangat ni Aaron ang kanyang mga kamay[a] tungo sa bayan at binasbasan niya sila. Pagkatapos niyang maghandog ng handog para sa kasalanan[b], handog na sinusunog, at mga handog para sa kapayapaan[c], bumaba siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kamay.” Isahan ang anyong Hebreo, ngunit karaniwang inuunawa ang kumpas na ito bilang pagtataas ng mga kamay sa pagbabasbas.
    reason: lexical_alternative
  - marker: b
    text: O “handog para sa paglilinis.”
    reason: lexical_alternative
  - marker: c
    text: O “mga handog para sa mabuting ugnayan” o “mga handog para sa kagalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: itinaas
  rationale: Likas na katumbas ng נשׂא kapag kamay ang layon at malinaw na inilalarawan ang kilos ng pagbabasbas.
- source_word: יָדוֹ
  choice: kanyang mga kamay
  rationale: Bagaman anyong isahan ang Hebreo, ang parirala ay karaniwang inuunawang tumutukoy sa kumpas ng pagbabasbas gamit ang mga kamay; pinananatili sa talababa ang literal na anyong isahan.
- source_word: אֶל הָעָם
  choice: patungo sa bayan
  rationale: Pinananatili nito ang direksiyonal na diwa ng אֶל at ang pisikal na pagharap ng mga kamay ni Aaron sa bayan.
- source_word: וַיְבָרְכֵם
  choice: binasbasan sila
  rationale: Ang 'binasbasan' ay natural, marangal, at tuwirang katumbas ng piel ng ברך sa kontekstong panrelihiyon.
- source_word: וַיֵּרֶד
  choice: bumaba siya
  rationale: Tuwirang inilalahad ang ירד nang hindi dinaragdagan ang teksto ng tiyak na pinanggalingang lugar gaya ng altar.
- source_word: מֵעֲשֹׂת
  choice: pagkatapos niyang ihandog
  rationale: Sa konteksto, ipinahihiwatig ng מן kasama ng infinitive ang paglipat matapos makumpleto ang paghahandog; natural ito sa Filipino.
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Nakikilala at malinaw na terminong pansakripisyo; ang alternatibong 'handog para sa paglilinis' ay inilalagay sa talababa.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Malinaw at karaniwang salin ng teknikal na terminong עֹלָה, na tumutukoy sa handog na sinusunog sa altar.
- source_word: הַשְּׁלָמִים
  choice: mga handog para sa mabuting ugnayan
  rationale: Naipahahayag ang saklaw ng שׁלמים bilang handog na kaugnay ng kapayapaan, kagalingan, at pakikipag-ugnayan, habang inilalahad sa talababa ang ibang posibleng salin.
theological_decisions:
- issue: Pagsasalin ng mga terminong pansakripisyo
  choice: Gamitin sa pangunahing teksto ang 'handog para sa kasalanan,' 'handog na sinusunog,' at 'mga handog para sa mabuting ugnayan.'
  alternative: Maaaring isalin ang חטאת bilang 'handog para sa paglilinis' at ang שלמים bilang 'mga handog para sa kapayapaan' o 'mga handog para sa kagalingan.'
  rationale: Pinananatili ng pangunahing mga termino ang malinaw na pagkakaiba ng mga uri ng handog nang hindi ipinipilit ang iisang paliwanag sa tungkulin ng bawat isa; itinatala sa mga talababa ang tunay na leksikal na mga alternatibo.
- issue: Bilang ng kamay sa kumpas ng pagbabasbas
  choice: Gamitin ang natural na Filipino na 'mga kamay.'
  alternative: Literal na 'kamay' dahil isahan ang anyong Hebreo.
  rationale: Ang isahang anyo ay maaaring gumana nang kolektibo sa idyomang ito, ngunit hindi ikinukubli ang pormal na pagkakaiba sapagkat inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'bayan' para sa tipunang Israelita at 'binasbasan' para sa malinaw na tonong panrelihiyon. Inayos ang huling sugnay bilang 'Pagkatapos niyang ihandog … bumaba siya' upang maging likas sa Filipino habang pinananatili ang pagkakasunod ng mga pangyayari sa Hebreo.
