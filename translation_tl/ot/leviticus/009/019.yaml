  naturalness: May bahagyang di-likas at semantikong malabong pahayag na “ang tabang nakabalot sa mga laman-loob.” Mas malinaw at likas ang “ang taba na bumabalot sa mga laman-loob.” Ang paralelong “mula sa” para sa dalawang hayop ay pinanatili rin.
  terminology: Ang “toro,” “lalaking tupa,” “matabang buntot,” at “mga bato” ay angkop. Ang “umbok ng atay” ay isang maingat na salin para sa isang tiyak ngunit hindi ganap na matiyak na nakakabit/nakausling bahagi ng atay. Ang talababa sa “toro” ay angkop na nag-iingat sa mas malawak na saklaw ng שׁוֹר.
