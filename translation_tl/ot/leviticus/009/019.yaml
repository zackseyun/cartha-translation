  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: tl
  text: at ang mga bahaging taba mula sa toro[a] at mula sa lalaking tupa—ang matabang buntot, ang taba na bumabalot sa mga laman-loob, ang mga bato, at ang umbok ng atay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka.” Maaaring gamitin ang salitang Hebreo para sa hayop mula sa bakahan at, ayon sa konteksto, isalin bilang “toro” o sa mas pangkalahatang paraan bilang “baka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: at ang mga bahaging taba
  rationale: Ipinagpapatuloy ng וְאֶת ang talaan sa naunang talata. Sa konteksto ng paghahandog, ang pangmaramihang חֲלָבִים ay tumutukoy sa mga tiyak na bahaging taba na inihihiwalay para sa altar, hindi lamang sa taba sa pangkalahatan.
- source_word: מִן הַשּׁוֹר
  choice: mula sa toro[a]
  rationale: Maaaring tumukoy ang שׁוֹר sa isang hayop mula sa bakahan, at sa kontekstong ito ay ang torong inihandog. Pinananatili ng talababa ang mas malawak na posibilidad ng salitang Hebreo.
- source_word: וּמִן הָאַיִל
  choice: at sa lalaking tupa
  rationale: Ang אַיִל sa konteksto ng paghahandog ay isang ram; malinaw at likas sa modernong Filipino ang “lalaking tupa.”
- source_word: הָאַלְיָה
  choice: ang matabang buntot
  rationale: Tumutukoy ang אַלְיָה sa matabang buntot ng tupa, isang tiyak na bahaging ginagamit sa paghahandog.
- source_word: הַמְכַסֶּה
  choice: ang tabang nakabalot sa mga laman-loob
  rationale: Literal itong ‘ang tumatakip.’ Sa mga talaan ng handog, tumutukoy ito sa tabang bumabalot sa mga laman-loob; nilinaw ang ipinahihiwatig na bahagi nang hindi binabago ang kahulugan.
- source_word: הַכְּלָיֹת
  choice: ang mga bato
  rationale: Karaniwang katawagang anatomikal sa Filipino para sa kidneys, at malinaw sa talaan ng mga bahagi ng hayop.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: ang umbok ng atay
  rationale: Tumutukoy ang parirala sa isang nakausli o nakakabit na bahagi ng atay. Ang “umbok ng atay” ay maikli at mauunawaan, habang iniiwasang magbigay ng higit na anatomikal na katiyakan kaysa sa salitang Hebreo.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, marangal, at madaling maunawaang Filipino. Pinanatili ang anyong fragmento ng talata dahil ipinagpapatuloy nito ang pangungusap at talaan mula sa naunang talata. Ginamit ang em dash upang malinaw na ipakilala ang mga bahaging bumubuo sa ‘mga bahaging taba.’
