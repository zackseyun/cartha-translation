base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: tl
  text: Pagkatapos, iniharap niya ang handog ng bayan. Kinuha niya ang lalaking kambing na handog para sa kasalanan ng bayan, kinatay ito, at inihandog niya ito bilang handog para sa kasalanan,[a] gaya ng sa una.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “isinagawa niya rito ang ritwal ng handog para sa kasalanan.” Sa kontekstong ritwal ng mga pari, ang pandiwang Hebreo ay maaari ring magpahiwatig ng pagpapadalisay o pag-aalis ng karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: iniharap
  rationale: Sa kontekstong paghahandog, ang Hiphil ng קרב ay tumutukoy sa paglalapit o paghaharap ng handog. Ang “iniharap” ay likas sa modernong Tagalog at hindi ipinapalagay na saklaw nito ang buong proseso ng paghahandog.
- source_word: קָרְבַּן הָעָם
  choice: ang handog ng bayan
  rationale: Ang קָרְבָּן ay pangkalahatang tawag sa handog na inilalapit. Malinaw at natural ang “handog ng bayan” bilang katumbas ng pariralang construct.
- source_word: שְׂעִיר הַחַטָּאת
  choice: ang lalaking kambing na handog para sa kasalanan
  rationale: Ang שָׂעִיר ay lalaking kambing, at sa ritwal na kontekstong ito ang חַטָּאת ay tumutukoy sa handog para sa kasalanan, hindi lamang sa abstraktong kasalanan.
- source_word: אֲשֶׁר לָעָם
  choice: para sa bayan
  rationale: Ang ל ay nagpapahiwatig na ang hayop ay nakatalaga alang-alang sa bayan, hindi lamang pag-aari nila.
- source_word: וַיִּשְׁחָטֵהוּ
  choice: kinatay ito
  rationale: Ang שׁחט ang karaniwang pandiwa para sa ritwal na pagkatay ng hayop. Ang “kinatay” ang natural at tumpak na salitang Tagalog.
- source_word: וַיְחַטְּאֵהוּ
  choice: isinagawa rito ang ritwal ng handog para sa kasalanan
  rationale: Mahirap tumbasan nang tuwiran ang Piel ng חטא rito. Ipinahahayag ng salin ang pagsasagawa ng ritwal gamit ang kambing, nang hindi nagpapahiwatig na ang kambing mismo ang nilinis o nagkasala.
- source_word: כָּרִאשׁוֹן
  choice: gaya ng ginawa niya sa nauna
  rationale: Tumutukoy ito sa naunang handog para sa kasalanan at sa pag-uulit ng gayunding paraan. Ang parirala ay malinaw at natural sa Tagalog.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong paghahandog
  choice: handog para sa kasalanan
  alternative: kasalanan
  rationale: Sa Levitico 9, ang salita ay tumutukoy sa uri ng handog. Pinananatili nito ang terminolohiyang ritwal at iniiwasang gawing abstraktong konsepto lamang ang salita.
- issue: Diwa ng וַיְחַטְּאֵהוּ
  choice: isinagawa rito ang ritwal ng handog para sa kasalanan
  alternative: nilinis ito; inihandog ito para sa kasalanan; gumawa siya ng pagtubos sa pamamagitan nito
  rationale: Pinananatili ng salin ang malawak na diwang ritwal ng pandiwa. Hindi nito ipinapalagay na ang hayop mismo ang nilinis, at hindi rin nito ipinapasok ang mas tiyak na terminong teolohikal na “pagtubos,” na hindi tuwirang ipinahahayag ng pandiwa rito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עָם at “handog para sa kasalanan” bilang malinaw na terminong ritwal. Iniwasan ang mas teknikal o denominasyonal na pananalita.
