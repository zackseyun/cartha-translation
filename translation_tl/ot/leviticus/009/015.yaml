revisions:
- from: Pagkatapos, iniharap niya ang handog ng bayan. Kinuha niya ang lalaking kambing na handog para sa kasalanan para sa bayan, kinatay ito, at isinagawa rito ang ritwal ng handog para sa kasalanan,[a] gaya ng ginawa niya sa nauna.
  to: Pagkatapos, iniharap niya ang handog ng bayan. Kinuha niya ang lalaking kambing na handog para sa kasalanan ng bayan, kinatay ito, at inihandog niya ito bilang handog para sa kasalanan,[a] gaya ng sa una.
  rationale: Inayos ang paulit-ulit na estruktura ng Tagalog at ginawang mas tuwiran ang pagsasalin ng וַיְחַטְּאֵהוּ. Pinananatili ng “inihandog niya ito bilang handog para sa kasalanan” ang sakripisyal na diwa nang hindi ipinapasok ang mas tiyak na teolohikal na pagpapakahulugan. Inililipat ng talababa ang posibleng ritwal na diwa ng pandiwa bilang alternatibo.
