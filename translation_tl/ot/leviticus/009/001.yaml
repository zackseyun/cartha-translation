  yaml_path: translation/ot/leviticus/009/001.yaml
  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: tl
  text: Noong ikawalong araw, tinawag ni Moises si Aaron, ang mga anak niyang lalaki, at ang mga nakatatanda ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinatawag” sa halip na “tinawag”; maaaring taglayin ng pandiwang Hebreo ang alinmang diwa sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Ipinahihiwatig ng anyong pasalaysay ang paglipat sa susunod na pangyayari. Likas sa makabagong Tagalog ang “At nang” at hindi nito dinaragdagan ang diwa ng Hebreo.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: ikawalong araw
  rationale: Tuwirang salin ng pariralang panahunan; hindi idinagdag ang “pagkatapos noon,” bagaman mauunawaan iyon mula sa konteksto.
- source_word: קָרָא
  choice: tinawag
  rationale: Ang pandiwa ay maaaring mangahulugang tumawag o magpatawag. “Tinawag” ang pinakadirekta at natural na katumbas, habang nasa talababa ang posibleng “ipinatawag.”
- source_word: לְאַהֲרֹן
  choice: si Aaron
  rationale: Karaniwang anyo ng pangalan sa Tagalog; ginamit ang pantukoy na “si” ayon sa likas na balarila.
- source_word: וּלְבָנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Sa kontekstong pangpari, ang בנים ay tumutukoy sa mga lalaking anak ni Aaron; nilinaw ito nang hindi gumagamit ng masyadong pormal na katawagan.
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: at ang mga matatandang pinuno ng Israel
  rationale: Ang זקנים dito ay mga kinikilalang nakatatandang kinatawan o pinuno, hindi lamang matatanda sa edad. Inihahayag ng parirala ang tungkulin nila sa natural na Tagalog.
