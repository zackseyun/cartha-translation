  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: tl
  text: At dinala nila sa kanya ang handog na sinusunog, piraso-piraso, at ang ulo; at sinunog niya ang mga ito sa altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang terminong panghandog sa Levitico para sa handog na lubusang sinusunog sa altar; malinaw at natural sa makabagong Filipino.
- source_word: הִמְצִיאוּ אֵלָיו
  choice: dinala nila sa kanya
  rationale: Ang Hiphil ng מצא rito ay tumutukoy sa pagpapalapit o pagdadala ng mga bahagi kay Aaron sa kontekstong ritwal.
- source_word: לִנְתָחֶיהָ
  choice: piraso-piraso
  rationale: Ang נֶתַח ay mga bahaging hiniwa ng hayop, at ipinahihiwatig ng parirala ang paisa-isang pagdadala ng mga ito.
- source_word: הָרֹאשׁ
  choice: ang ulo
  rationale: Tuwirang katumbas na pinananatili dahil ibinubukod ng talata ang ulo sa iba pang mga piraso.
- source_word: וַיַּקְטֵר
  choice: pinausok niya
  rationale: Sa kontekstong panghandog, ang קטר ay mas tiyak na tumutukoy sa pagsusunog sa altar upang pausbongin ang usok bilang handog; inilalarawan nito ang ritwal na kilos nang mas tiyak kaysa sa payak na 'sinunog.'
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Natural at karaniwang Filipino para sa paglalagay at pagsusunog ng handog sa ibabaw ng altar.
