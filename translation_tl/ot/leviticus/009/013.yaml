- from: At dinala nila sa kanya ang handog na sinusunog, piraso-piraso, pati ang ulo; at pinausok niya ang mga iyon sa altar.
  to: At dinala nila sa kanya ang handog na sinusunog, piraso-piraso, at ang ulo; at sinunog niya ang mga ito sa altar.
