  text: וְ/אֶת הַ/חֵ֨לֶב וְ/אֶת הַ/כְּלָיֹ֜ת וְ/אֶת הַ/יֹּתֶ֤רֶת מִן הַ/כָּבֵד֙ מִן הַ֣/חַטָּ֔את הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Ang taba, ang mga bato, at ang umbok ng atay mula sa handog para sa kasalanan[a] ay pinausok niya sa altar, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Maaaring idiin ng terminong Hebreo ang tungkulin ng handog sa pag-aalis ng karumihan, gayundin sa pagharap sa kasalanan.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: taba
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa mga bahaging mataba na nakalaan para sunugin sa altar. Ang “taba” ang pinakadirekta at likas na salin sa Filipino.
- source_word: כְּלָיֹת
  choice: mga bato
  rationale: Tuwirang anatomikal ang kahulugan. Sa Filipino, malinaw sa konteksto na ang “mga bato” ay ang mga kidney.
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: umbok ng atay
  rationale: Tumutukoy ang parirala sa isang nakausli o karagdagang bahagi ng atay na inaalis sa paghahandog. Ang “umbok ng atay” ay maikli, natural, at hindi labis na tiyak sa anatomiyang hindi ganap na tiyak sa terminong Hebreo.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Ito ang malinaw at kinikilalang katawagan sa uring ito ng handog, habang pinananatili sa talababa ang lehitimong diwang paglilinis.
- source_word: הִקְטִיר
  choice: pinausok
  rationale: Ang Hiphil ng קטר sa kontekstong pansakripisyo ay nangangahulugang sunugin ang handog upang umusok sa altar, hindi lamang karaniwang pagsunog. Napananatili ng “pinausok” ang natatanging diwang ito.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Bagaman may hulaping patungo ang anyong Hebreo, ang likas na paglalarawan sa Filipino ng pagsunog ng handog ay “sa altar.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa mga batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring idiin ng terminong Hebreo kapuwa ang kasalanan at ang paglilinis mula sa karumihan. Pinanatili sa pangunahing teksto ang karaniwang katawagang “handog para sa kasalanan,” ngunit inilagay sa talababa ang lehitimong alternatibo upang hindi mawala ang saklaw ng kahulugan.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang konkretong detalye ng ritwal at ang personal na pangalang Yahweh. Inilagay ang panandang [a] pagkatapos ng “handog para sa kasalanan,” ang mismong pariralang tinutukoy ng talababa.
