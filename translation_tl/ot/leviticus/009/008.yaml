base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: tl
  text: Pagkatapos, lumapit si Aaron sa altar at kinatay niya ang guya ng kanyang handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang guya ng kanyang handog para sa paglilinis.” Ang terminong Hebreo ay maaaring tumukoy sa handog na kaugnay ng pag-aalis ng kasalanan at ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: lumapit
  rationale: Tuwirang ipinahahayag ng pandiwang קרב ang paglapit ni Aaron sa altar at natural ito sa makabagong Tagalog.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at malinaw na katawagan sa Tagalog para sa מזבח sa konteksto ng paghahandog.
- source_word: וַיִּשְׁחַט
  choice: kinatay
  rationale: Sa kontekstong pansakripisyo, ang שחט ay tumutukoy sa pagkatay ng hayop, hindi lamang sa pangkalahatang pagpatay.
- source_word: עֵגֶל
  choice: guya
  rationale: Ang עגל ay batang baka; ang “guya” ang pinakadirekta at natural na salin.
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Dito, ang חטאת ay pangalan ng isang uri ng handog. Pinananatili ng saling ito ang nakaugaliang ugnayan nito sa kasalanan, habang inilalahad sa talababa ang posibleng diin sa paglilinis.
- source_word: אֲשֶׁר לוֹ
  choice: para sa kanyang sarili
  rationale: Sa konteksto, tinutukoy ng parirala ang handog ni Aaron para sa sarili niya, bilang kaibahan sa mga handog para sa bayan.
theological_decisions:
- issue: Kahulugan ng חטאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang terminong Hebreo kapuwa sa kaugnayan ng handog sa kasalanan at sa tungkulin nitong ritwal na paglilinis. Ginamit sa pangunahing teksto ang malinaw at nakaugaliang katawagan, ngunit pinanatili sa talababa ang lehitimong alternatibo upang hindi isara ang tunay na saklaw ng termino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kinatay” para sa tiyak na gawaing pansakripisyo at “guya” bilang pangkaraniwang katawagan sa batang baka.
