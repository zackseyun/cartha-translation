  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang katawagang “handog na sinusunog” at iniwasan ang sobrang teknikal o denominasyonal na pananalita. Inilagay ang panandang [a] sa mismong pandiwang tinatalakay ng talababa.
