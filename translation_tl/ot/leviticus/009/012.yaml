base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: tl
  text: Pagkatapos, kinatay niya ang handog na sinusunog. Dinala sa kanya ng mga anak ni Aaron ang dugo, at isinaboy niya iyon sa lahat ng panig ng altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inihagis niya iyon sa palibot ng altar.” Ang pandiwang Hebreo para sa paglalapat ng dugo ay nagpapahiwatig ng malakas na paghagis o pagsaboy, hindi ng marahang pagwiwisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Pagkatapos, kinatay niya
  rationale: Sa konteksto ng paghahandog, ang שׁחט ay tumutukoy sa pagkatay bilang ritwal, hindi lamang sa karaniwang pagpatay. Ipinahahayag ng “Pagkatapos” ang sunod-sunod na kilos sa salaysay.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ang עֹלָה ay handog na buong sinusunog sa altar. Ang pariralang ito ay malinaw at likas sa makabagong Tagalog.
- source_word: וַיַּמְצִאוּ
  choice: Dinala
  rationale: Sa prosesong ritwal, dinala o iniharap ng mga anak ni Aaron ang dugo kay Aaron. Pinananatili ng “Dinala” ang payak na kilos nang walang di-kailangang pagpapakahulugan.
- source_word: בְּנֵי אַהֲרֹן
  choice: ng mga anak ni Aaron
  rationale: Likas na pagpapahayag sa Tagalog na nagpapanatili sa kaugnayang pampamilya at pagkakakilanlang pangsaserdote.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang tumutukoy kay Aaron bilang tumanggap ng dugo.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Tapat na katumbas ng tiyak na layon sa ritwal; hindi kailangan ng pagpapalawak.
- source_word: וַיִּזְרְקֵהוּ
  choice: isinaboy niya iyon
  rationale: Ang זָרַק sa ritwal ng paghahandog ay nagpapahiwatig ng paghagis o malakas na pagsaboy ng dugo, hindi ng marahang pagwiwisik. Nauunawaan sa Tagalog ang “isinaboy” bilang paglalapat ng likido nang may lakas.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa ... altar
  rationale: Sa Tagalog, ang “sa altar” ay likas na nagpapahayag na inilapat ang dugo sa altar; ang kilos na “isinaboy” ang nagbibigay ng dinamikong diwa.
- source_word: סָבִיב
  choice: sa lahat ng panig
  rationale: Ipinakikita ang distributibong diwa na inilapat ang dugo sa palibot o iba’t ibang panig ng altar.
theological_decisions: []
