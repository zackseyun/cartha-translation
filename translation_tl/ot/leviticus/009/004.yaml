id: LEV.9.4
reference: Leviticus 9:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: tl
  text: at isang baka at isang lalaking tupa bilang mga handog para sa kapayapaan[a], na ihahain sa harap ni Yahweh[b], at isang handog na butil na hinaluan ng langis; sapagkat sa araw na ito ay magpapakita sa inyo si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa pakikisalo” o “mga handog para sa mabuting kalagayan.”
    reason: lexical_alternative
  - marker: b
    text: Ang banal na pangalang Hebreo ay יהוה (YHWH), na isinalin dito bilang “Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay tumutukoy sa hayop na mula sa lahi ng baka. Pinananatili ng “baka” ang lawak ng katawagan at hindi sapilitang itinatakda ang kasarian gaya ng “toro.”
- source_word: אַיִל
  choice: lalaking tupa
  rationale: Partikular na tumutukoy ang אַיִל sa isang ram; malinaw at likas sa modernong Filipino ang “lalaking tupa.”
- source_word: שְׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Ito ang kinikilalang katawagan sa handog na kaugnay ng kapayapaan, mabuting kalagayan, at pakikisalo. Nasa talababa ang iba pang posibleng diwa upang hindi paliitin ang saklaw ng terminong Hebreo.
- source_word: לִזְבֹּחַ
  choice: na ihahain
  rationale: Sa kontekstong ritwal, ipinahihiwatig ng זבח ang pagkatay bilang paghahandog. Ang “ihahain” ay malinaw na nagpapahayag ng layuning pansakripisyo nang hindi nakatuon lamang sa pisikal na pagkatay.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat na ipinapahayag ng “sa harap” ang literal at relasyonal na diwa ng לִפְנֵי, samantalang pinananatili ang banal na pangalang YHWH bilang “Yahweh.”
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa batas ng mga handog sa Levitico, ang מִנְחָה ay handog na mula sa butil; malinaw ito sa karaniwang mambabasa.
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: hinaluan ng langis
  rationale: Natural na modernong Filipino ito para sa paghahandang inilalarawan ng participle at pariralang preposisyonal.
- source_word: כִּי הַיּוֹם
  choice: sapagkat sa araw na ito
  rationale: Pinananatili ng “sapagkat” ang ugnayang panlinaw o pansanhi at binibigyang-diin ng “sa araw na ito” ang tiyak na panahon.
- source_word: נִרְאָה אֲלֵיכֶם
  choice: magpapakita sa inyo
  rationale: Bagaman perfect ang anyong Hebreo, ang konteksto ay tumutukoy sa nalalapit na pagpapakita; ang panghinaharap ang natural na katumbas sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng titulo.
- issue: Diwa at panahon ng pahayag na נִרְאָה אֲלֵיכֶם
  choice: magpapakita sa inyo si Yahweh
  alternative: nagpakita sa inyo si Yahweh; magpapakita sa inyo ang kaluwalhatian ni Yahweh
  rationale: Si Yahweh mismo ang simuno sa talatang ito, hindi ang “kaluwalhatian ni Yahweh.” Nalalapit pa ang pagpapakita ayon sa daloy ng salaysay, kaya ginamit ang panghinaharap nang hindi idinaragdag ang pananalita ng kasunod na talata.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Iniwasan ang mga salitang labis na teknikal o makaluma, ngunit pinanatili ang natatanging bokabularyo ng paghahandog at ang ayos ng pangangatwiran sa Hebreo.
