id: LEV.9.21
reference: Leviticus 9:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: tl
  text: At iwinagayway ni Aaron sa harap ni Yahweh ang mga dibdib at ang kanang hita bilang handog na iwinagayway, gaya ng iniutos ni Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: mga dibdib
  rationale: Sa konteksto ng paghahandog, tumutukoy ang חָזֶה sa bahaging dibdib ng hayop. Pinananatili ng maramihang “mga dibdib” ang anyo ng Hebreo at ang posibilidad na mula ang mga ito sa mahigit isang handog.
- source_word: שׁוֹק הַיָּמִין
  choice: kanang hita
  rationale: Ang שׁוֹק ay bahagi ng hita o binti; ang “kanang hita” ay malinaw at likas na katawagang ritwal sa Filipino.
- source_word: הֵנִיף
  choice: iwinagayway
  rationale: Ang Hiphil ng נוּף sa ritwal ng paghahandog ay tumutukoy sa pagpapakita o paghahandog sa pamamagitan ng pagwagayway. Ang “iwinagayway” ay tuwiran at nagpapanatili sa pisikal na kilos.
- source_word: תְּנוּפָה
  choice: bilang handog na iwinagayway
  rationale: Teknikal itong katawagan sa handog na ritwal na inihaharap sa pamamagitan ng pagwagayway; inilalarawan ito nang malinaw nang hindi inaalis ang ugnayan sa pandiwang הֵנִיף.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang ipinapahayag ng לִפְנֵי ang pagiging nasa harap o presensiya, at pinananatili ang pangalang tipan na Yahweh.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: gaya ng iniutos ni Moises
  rationale: Likas sa Filipino ang pariralang ito at malinaw na ipinakikitang tumalima si Aaron sa naunang utos ni Moises.
- source_word: וְאֵת ... וְאֵת
  choice: ang mga dibdib at ang kanang hita
  rationale: Ang inuulit na pantukoy sa tuwirang layon ay natural na naihahayag sa Filipino sa pag-uugnay ng dalawang tiyak na layon sa pamamagitan ng “at.”
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Pangalan mismo na יְהוָה ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalang tipan sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na wikang panghandog ngunit ipinaliwanag ito sa likas na pariralang “handog na iwinagayway.”
