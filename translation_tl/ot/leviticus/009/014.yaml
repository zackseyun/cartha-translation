  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: tl
  text: Hinugasan niya ang mga lamang-loob at ang ibabang bahagi ng mga binti, at sinunog[a] niya ang mga iyon sa altar, sa ibabaw ng handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, inihandog niya ang mga iyon sa altar sa pamamagitan ng pagsusunog upang pumailanlang ang usok, sa ibabaw ng handog na sinusunog.
    reason: 'Pinananatili ng alternatibo ang natatanging rituwal na diwa ng וַיַּקְטֵר: ang pag-aalay sa pamamagitan ng pagsusunog upang pumailanlang ang usok, hindi lamang karaniwang pagsunog.'
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: Hinugasan niya
  rationale: Ang רחץ sa konteksto ng paghahandog ay tumutukoy sa paghuhugas sa tubig; malinaw at likas ang “hinugasan” sa Tagalog.
- source_word: הַקֶּרֶב
  choice: mga lamang-loob
  rationale: Sa mga tagubilin tungkol sa paghahandog, ang קֶרֶב ay tumutukoy sa mga panloob na bahagi o organo ng hayop; karaniwan at tiyak ang “mga lamang-loob.”
- source_word: הַכְּרָעָיִם
  choice: mga binti
  rationale: Ang כְּרָעַיִם ay mga paa o lulod ng hayop, lalo na ang ibabang bahagi ng mga paa. Ang “mga binti” ay maikli, natural, at sapat na anatomikal sa Filipino.
- source_word: וַיַּקְטֵר
  choice: sinunog niya
  rationale: Ang Hiphil ng קטר ay tumutukoy sa pagsunog sa altar upang pumailanlang bilang usok. Ang “sinunog niya” ang pinakanatural na pangunahing salin, habang inilalahad sa talababa ang natatanging rituwal na diwa.
- source_word: עַל הָעֹלָה
  choice: sa ibabaw ng handog na sinusunog
  rationale: Ipinahihiwatig ng עַל ang pagkakalagay sa ibabaw ng handog na naroon na sa altar; pinananatili ng salin ang ugnayang ito.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ang מִזְבֵּחַ ay “altar,” at ang hulaping patungo sa isang lugar ay likas na naipahahayag dito ng “sa.”
