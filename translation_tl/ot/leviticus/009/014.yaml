  terminology: Ang 'mga lamang-loob,' 'altar,' at 'handog na sinusunog' ay angkop at di-denominasyonal na mga katawagan. Ang 'sinunog' ay katanggap-tanggap na pangunahing salin para sa וַיַּקְטֵר, habang ang talababa ay nagpapahayag ng natatanging diwa ng pag-aalay na pumapailanlang bilang usok.
