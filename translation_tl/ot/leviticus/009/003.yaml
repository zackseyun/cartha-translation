base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/003.yaml
  text: And to the sons of Israel you shall speak[a], saying, ‘Take a male goat for a sin offering, and a calf and a lamb, each a year old, without blemish, for a burnt offering.’
translation:
  language: tl
  text: At sabihin mo sa mga anak ni Israel, ‘Kumuha kayo ng isang lalaking kambing bilang handog para sa kasalanan[a], at isang guya at isang kordero, na parehong isang taong gulang at walang kapintasan, bilang handog na sinusunog.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Sa mga kontekstong pangsaserdote ng paghahandog, maaaring taglayin ng Hebreong חַטָּאת ang diwang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: At sabihin mo sa mga anak ni Israel
  rationale: Pinananatili ng “At” ang ugnay sa naunang tagubilin. Ang “mga anak ni Israel” ay malinaw at pormal na katumbas ng pangkorporasyong katawagang Hebreo, samantalang ang pandiwang pautos sa konteksto ay natural na isinalin na “sabihin mo.”
- source_word: קְחוּ
  choice: Kumuha kayo
  rationale: Tuwirang maramihang pautos ito sa bayan; pinananatili ng “kayo” ang bilang at ang puwersa ng utos.
- source_word: שְׂעִיר עִזִּים
  choice: isang lalaking kambing
  rationale: Tinutukoy ng pariralang Hebreo ang isang kambing na lalaki, isang detalyeng mahalaga sa takdang hain.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa kontekstong panghandog, tumutukoy ang חַטָּאת sa isang uri ng hain. Ang saling ito ay madaling maunawaan at hindi ipinagpapalagay na ang abstraktong “kasalanan” lamang ang tinutukoy.
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: at ng isang guya at isang kordero
  rationale: Ang “guya” at “kordero” ang natural at tiyak na modernong Tagalog para sa dalawang batang hayop.
- source_word: בְּנֵי שָׁנָה תְּמִימִם
  choice: na kapuwa isang taóng gulang at walang kapintasan
  rationale: Ang mga anyong maramihan ay tumutukoy sa guya at kordero. Nililinaw ng “kapuwa” ang distributibong saklaw nang hindi dinaragdagan ang kahulugan.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Karaniwang katawagan ito sa haing lubos na sinusunog; malinaw ang “handog na sinusunog” sa ordinaryong modernong Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa kontekstong pangsaserdote
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring bigyang-diin ng terminong Hebreo ang paglilinis sa mga tekstong pangsaserdote, ngunit malinaw na pangalan din ito ng isang uri ng hain. Pinanatili sa pangunahing teksto ang madaling makilalang “handog para sa kasalanan,” at inilagay sa talababa ang lehitimong alternatibo.
- issue: Pagsasalin ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang pormal na anyo ng pangkorporasyong katawagan sa Hebreo, nang hindi ipinapakahulugan kung ang praktikal na saklaw ng utos ay bawat miyembro o ang bayan bilang kabuuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na pautos na “sabihin mo” at “kumuha kayo,” habang pinananatili ang pormal na katawagang “mga anak ni Israel” at ang teknikal na bokabularyong panghandog.
