revisions:
- from: Ngunit ang kambing na natapatan ng palabunutan para kay Azazel[a] ay ihaharap nang buhay sa harap ni Yahweh, upang gawin ang pagtubos sa ibabaw nito[b] at ipadala ito kay Azazel sa ilang.
  to: Ngunit ang kambing na natapatan ng palabunutan para kay Azazel[a] ay ihaharap nang buhay sa harap ni Yahweh, upang magsagawa rito ng pagtubos[b] at ipadala ito kay Azazel sa ilang.
  rationale: Pinalitan ang hindi idiomatikong “gawin ang pagtubos sa ibabaw nito” ng “magsagawa rito ng pagtubos.” Ang rebisyong ito ay natural sa modernong Filipino, nananatiling pormal na angkop sa tekstong ritwal, at hindi pinipili sa pangunahing teksto ang alinman sa “sa ibabaw nito” o “para rito.” Inayos din ang talababa a upang maging mas malinaw ang alternatibong pagbasa nang hindi inaalis ang kalabuan ng Azazel.
