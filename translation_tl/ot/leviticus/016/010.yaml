  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: tl
  text: Ngunit ang kambing na natapatan ng palabunutan para kay Azazel[a] ay ihaharap nang buhay sa harap ni Yahweh, upang magsagawa rito ng pagtubos[b] at ipadala ito kay Azazel sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na “Azazel.” Maaaring ito ay pangalan o katawagang kaugnay ng pag-aalis; isinasalin din itong “para sa kambing na pinapaalis.”
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “upang magsagawa ng pagtubos para rito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: Ngunit ang kambing
  rationale: Ang שָׂעִיר ay kambing, karaniwang lalaking kambing sa kontekstong ito. Sapat at natural ang “kambing,” at ipinakikita ng “Ngunit” ang kaibahan nito sa naunang kambing.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: na natapatan ng palabunutan
  rationale: Likas na ipinahahayag nito sa Filipino ang idyomang Hebreo na ang kapalaran o resulta ng palabunutan ay tumapat sa kambing.
- source_word: לַעֲזָאזֵל
  choice: para kay Azazel
  rationale: Hindi tiyak ang kahulugan ng עֲזָאזֵל. Pinananatili ang transliterasyong “Azazel” upang hindi ipasiya sa pangunahing teksto kung ito ay pangalan, lugar, o katawagang kaugnay ng pag-aalis.
- source_word: יָעֳמַד חַי
  choice: ay ihaharap nang buhay
  rationale: Ang anyong Hophal ay nagpapahiwatig na ang kambing ay patatayuin o ihaharap ng iba. Natural na Filipino ang “ihaharap,” habang malinaw na pinananatiling buhay ang kambing.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang inilalarawan nito ang paghaharap sa presensiya ng Diyos at pinananatili ang personal na pangalan na nasa tekstong Hebreo.
- source_word: לְכַפֵּר עָלָיו
  choice: upang gawin ang pagtubos sa ibabaw nito
  rationale: Pinananatili ng “pagtubos” ang kultikong diwa ng כפר, at ng “sa ibabaw nito” ang literal na puwersa ng עַל nang hindi agad nagpapasiya kung ang kambing ang pinatutungkulan o kasangkapan ng pagtubos.
- source_word: לְשַׁלַּח אֹתוֹ
  choice: at ipadala ito
  rationale: Ipinahahayag nito ang layuning paalisin ang kambing. Ginamit ang “at” upang malinaw at natural na iugnay ang kasunod na layunin sa Filipino.
- source_word: הַמִּדְבָּרָה
  choice: sa ilang
  rationale: Ang hulaping paturol ng direksiyon ay nagpapahiwatig ng pagpunta sa ilang; maikli, dignified, at karaniwan sa wikang biblikal na Filipino ang “sa ilang.”
theological_decisions:
- issue: Kahulugan ng עֲזָאזֵל
  choice: Azazel (transliterado)
  alternative: ang kambing na pinapaalis; lubos na pag-aalis; pangalan ng nilalang o lugar sa ilang
  rationale: Pinagtatalunan ang kahulugan ng salita. Ang transliterasyon ay nagpapanatili ng tunay na kalabuan at hindi nag-aangkat ng isang tiyak na paliwanag sa pangunahing teksto.
- issue: Puwersa ng לְכַפֵּר עָלָיו
  choice: gawin ang pagtubos sa ibabaw nito
  alternative: gawin ang pagtubos para rito
  rationale: Maaaring tumukoy ang עַל sa pagkilos na ginagawa sa ibabaw ng kambing o sa pagtubos na para rito. Pinananatili ng pangunahing salin ang anyo ng Hebreo, samantalang inilalagay sa talababa ang mas idiomatikong alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “palabunutan,” “ihaharap nang buhay,” at “sa ilang” para sa malinaw na daloy. Sadyang bahagyang pormal ang “gawin ang pagtubos sa ibabaw nito” upang mapanatili ang kalabuan ng pariralang Hebreo; nililinaw ng talababa ang mas natural na alternatibo.
