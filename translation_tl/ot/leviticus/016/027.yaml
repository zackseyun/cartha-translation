base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: tl
  text: At ang torong handog para sa kasalanan at ang kambing na handog para sa kasalanan,[a] na ang dugo ay ipinasok upang magbayad-sala sa santuwaryo,[b] ay ilalabas niya sa labas ng kampo; at susunugin nila sa apoy ang kanilang mga balat, laman, at dumi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “handog para sa paglilinis,” na nagbibigay-diin sa ritwal na paglilinis.
    reason: lexical_alternative
  - marker: b
    text: O “sa banal na lugar.”
    reason: lexical_alternative
  - marker: c
    text: Nagbabago ang Hebreo mula sa isahan (“ilalabas niya”) tungo sa maramihan (“susunugin nila”), marahil upang ibukod ang nangangasiwa sa ritwal sa mga tumutulong sa pagsusunog.
    reason: cultural_note
lexical_decisions:
- source_word: פַּר הַחַטָּאת / שְׂעִיר הַחַטָּאת
  choice: toro para sa handog para sa kasalanan / kambing para sa handog para sa kasalanan
  rationale: Malinaw na ipinapahayag ang gamit ng bawat hayop sa ritwal at pinananatili ang karaniwang katawagang Filipino para sa חַטָּאת.
- source_word: הוּבָא אֶת־דָּמָם
  choice: na ang dugo ay ipinasok
  rationale: Ang pasibong anyo at ang direksiyong papasok sa sagradong lugar ay kapwa pinananatili; likas sa Filipino na hindi na ulitin ang panghalip na maramihan kapag malinaw ang tinutukoy.
- source_word: לְכַפֵּר
  choice: upang magsagawa ng pagbabayad-sala
  rationale: Pinananatili ang ritwal at teolohikal na saklaw ng כפר nang hindi nililimitahan ito sa isang paliwanag lamang gaya ng paglilinis o pagtatakip.
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Sa kontekstong ito, tumutukoy ang termino sa sagradong lugar kung saan ipinasok ang dugo, hindi sa abstraktong kabanalan.
- source_word: יוֹצִיא אֶל־מִחוּץ לַמַּחֲנֶה
  choice: ilalabas niya sa labas ng kampo
  rationale: Natural na Filipino ito para sa tahasang direksiyon ng Hebreo at pinananatili ang pandiwang isahan.
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: at susunugin nila sa apoy
  rationale: Pinananatili ang pandiwang maramihan at ang pagbanggit sa apoy, ayon sa Hebreo.
- source_word: עֹרֹתָם וְאֶת־בְּשָׂרָם וְאֶת־פִּרְשָׁם
  choice: ang mga balat, laman, at dumi ng mga iyon
  rationale: Ang 'balat,' 'laman,' at 'dumi' ay tuwiran, nauunawaan, at angkop sa paglalarawan sa mga bangkay ng hayop.
theological_decisions:
- issue: Kahulugan ng חַטָּאת bilang katawagang panghandog
  choice: handog para sa kasalanan
  alternative: handog na panlinis
  rationale: Ang pangunahing teksto ay gumagamit ng kinikilalang katawagang Filipino ngunit itinatala sa talababa ang posibleng ritwal na diin sa paglilinis.
- issue: Saklaw ng כפר sa ritwal ng Araw ng Pagbabayad-sala
  choice: magsagawa ng pagbabayad-sala
  alternative: magsagawa ng paglilinis
  rationale: Hindi tahasang nilulutas ng salin kung ang pangunahing diin ay pag-aalis ng sala, paglilinis ng santuwaryo, o kapwa; pinananatili ang mas malawak na terminong ritwal.
- issue: Paglipat mula sa pandiwang isahan tungo sa maramihan
  choice: ilalabas niya ... susunugin nila
  alternative: ilalabas nila ... susunugin nila
  rationale: Tapat na pinananatili ang pagbabago ng bilang sa tekstong Hebreo, na maaaring magbukod sa tagapangasiwa ng ritwal mula sa mga tumutulong.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'santuwaryo' at 'pagbabayad-sala' bilang pamilyar na katawagang panritwal; iniwasan ang sobrang literal na ayos na magiging saliwa sa natural na Filipino. Pinanatili ang mahalagang pagbabago mula isahan tungo sa maramihan.
