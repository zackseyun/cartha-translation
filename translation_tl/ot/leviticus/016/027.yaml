revisions:
- from: At ang toro para sa handog para sa kasalanan at ang kambing para sa handog para sa kasalanan,[a] na ang dugo ay ipinasok upang magsagawa ng pagbabayad-sala sa santuwaryo,[b] ay ilalabas niya sa labas ng kampo; at susunugin nila sa apoy ang mga balat, laman, at dumi ng mga iyon.[c]
  to: At ang torong handog para sa kasalanan at ang kambing na handog para sa kasalanan,[a] na ang dugo ay ipinasok upang magbayad-sala sa santuwaryo,[b] ay ilalabas niya sa labas ng kampo; at susunugin nila sa apoy ang kanilang mga balat, laman, at dumi.[c]
  rationale: Mga estilistikong pag-aayos lamang ang ginawa upang maging mas likas at malinaw ang Filipino. Hindi binago ang saklaw ng mga terminong panritwal, ang pasibong “ipinasok,” ang lugar na tinutukoy, o ang mahalagang paglipat mula sa isahang “ilalabas niya” tungo sa maramihang “susunugin nila.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:17:05Z'
