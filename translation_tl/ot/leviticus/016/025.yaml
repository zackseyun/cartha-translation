  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: tl
  text: At susunugin niya sa altar ang taba ng handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “handog para sa paglilinis.” Ang salitang Hebreo ay maaaring tumukoy sa handog na ginagamit sa paglilinis mula sa kasalanan o karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: At ... ang
  rationale: Ipinagdurugtong ng וְ ang gawaing ito sa naunang bahagi ng ritwal; hindi hiwalay na isinasalin ang panandang tuwirang layon na אֵת sa Tagalog.
- source_word: חֵלֶב
  choice: ang taba
  rationale: Tumutukoy ito sa tabang itinalaga para sunugin bilang handog. Tuwiran at natural sa Tagalog ang “ang taba,” nang hindi nagdaragdag ng ideyang “mga bahagi” na hindi tahasang sinabi rito.
- source_word: הַחַטָּאת
  choice: ng handog para sa kasalanan
  rationale: Sa konteksto ng paghahandog, karaniwang tumutukoy ang חַטָּאת sa handog na may kaugnayan sa kasalanan. Malinaw ito sa karaniwang mambabasa, habang pinananatili sa talababa ang mahalagang alternatibong “handog para sa paglilinis.”
- source_word: יַקְטִיר
  choice: susunugin niya
  rationale: Ang Hiphil ng קטר sa kontekstong pansakripisyo ay pagsunog sa altar bilang handog, na nagbubunga ng usok. Natural at sapat na tiyak sa Tagalog ang “susunugin.”
- source_word: הַמִּזְבֵּחָה
  choice: sa ibabaw ng altar
  rationale: Bagaman may hulaping patungo ang anyo sa Hebreo, ang konteksto ay aktuwal na pagsunog sa altar; malinaw at idiomatiko sa Tagalog ang lokatibong “sa ibabaw ng altar.”
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang salitang Hebreo kapuwa sa kasalanan at sa handog na ginagamit sa ritwal ng paglilinis mula sa kasalanan o karumihan. Ginamit sa pangunahing teksto ang mas kinikilalang katawagan, ngunit pinanatili sa talababa ang tunay at mahalagang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “sa ibabaw ng altar” upang malinaw na ipahayag ang lugar ng ritwal na pagsunog.
