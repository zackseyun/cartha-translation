base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: tl
  text: Ihaharap ni Aaron ang toro, ang handog para sa kasalanan para sa kanyang sarili[a]. Magsasagawa siya ng pagtubos para sa kanyang sarili at sa kanyang sambahayan[b]. Pagkatapos, kakatayin niya ang toro, ang handog para sa kasalanan para sa kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang toro para sa handog para sa kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “para sa kanyang sarili at para sa kanyang bahay”; ang “sambahayan” dito ay tumutukoy sa mga kabilang sa kanyang bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Ihahandog
  rationale: Sa kontekstong panghandog, ang Hiphil ng קרב ay tumutukoy sa paglalapit o paghaharap ng hayop sa altar. Likas sa Filipino ang “ihahandog,” at hindi nito ipinahihiwatig na tapos na ang buong ritwal, sapagkat kasunod pa ang pagkatay.
- source_word: פַּר הַחַטָּאת
  choice: ang toro para sa handog para sa kasalanan
  rationale: Malinaw nitong ipinapahayag na ang toro ang hayop na itinalaga bilang handog para sa kasalanan. Pinananatili rin nito ang kinikilalang terminolohiyang pansakripisyo.
- source_word: אֲשֶׁר לוֹ
  choice: na ukol sa kanya
  rationale: Sa ritwal na ito, ang parirala ay hindi lamang nagsasaad ng pagmamay-ari kundi ng pagkakatalaga ng toro para kay Aaron mismo. Ang “ukol sa kanya” ay nagpapanatili sa saklaw na iyon nang hindi labis na nagpapaliwanag.
- source_word: וְכִפֶּר
  choice: Gagawa siya ng pagtubos
  rationale: Karaniwang pananalita ito para sa כפר sa kontekstong saserdotal. Pinananatili nito ang teolohikal at ritwal na diwa nang hindi nililimitahan sa isang partikular na paliwanag kung paano nagaganap ang pagtubos.
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: para sa kanyang sarili at sa kanyang sambahayan
  rationale: Ang בעד ay nangangahulugang para sa kapakanan o alang-alang sa isang tao. Ang “sambahayan” ay natural na katumbas ng בֵּיתוֹ kapag tumutukoy sa mga kabilang sa kanyang bahay, hindi sa gusali.
- source_word: וְשָׁחַט
  choice: Pagkatapos, kakatayin niya
  rationale: Ang שׁחט ang karaniwang pandiwa para sa ritwal na pagkatay. Ang “pagkatapos” ay likas na nagpapakita ng pagkakasunod-sunod na ipinahihiwatig ng waw at ng konteksto.
theological_decisions:
- issue: Pagpapahayag ng כפר sa wikang pansakripisyo
  choice: gagawa ng pagtubos
  alternative: gagawa ng paglilinis / magbabayad-sala
  rationale: Ang “gagawa ng pagtubos” ay nagpapanatili sa malawak at nakaugaliang kahulugan ng ritwal na כפר, nang hindi ipinapasok ang isang makitid o denominasyonal na teorya ng pagtubos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa tatlong pangungusap upang maging madaling maunawaan ang sunod-sunod na ritwal, habang pinananatili ang pag-uulit ng pariralang tumutukoy sa toro at ang mga footnote marker sa pangunahing teksto.
