id: LEV.16.34
reference: Leviticus 16:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: tl
  text: Ito ay magiging tuntuning panghabang-panahon para sa inyo upang magsagawa ng pagbabayad-sala para sa mga anak ni Israel[a] dahil sa lahat ng kanilang kasalanan, minsan sa isang taon.[b] At ginawa niya ang iniutos ni Yahweh kay Moises.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mga Israelita” o “para sa sambayanan ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring unawain na “upang linisin sila mula sa lahat ng kanilang kasalanan,” na itinatampok ang diwa ng paglilinis sa pananalitang Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Hindi tahasang pinangalanan sa Hebreo ang gumawa; malamang na si Aaron ang tinutukoy ayon sa konteksto.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת
  choice: Ito ay magiging
  rationale: Tuwirang ipinakikilala ang bisa ng kautusan sa paraang likas sa modernong Tagalog habang pinananatili ang himig na legal.
- source_word: לְחֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  rationale: Ang חֻקָּה ay isang itinakdang tuntunin o batas, at ang עוֹלָם ay nagpapahiwatig ng patuloy o permanenteng bisa sa konteksto ng tipan.
- source_word: לְכַפֵּר
  choice: magbabayad-sala
  rationale: Pinananatili nito ang natatanging kahulugang ritwal at teolohikal ng כפר sa konteksto ng mga handog at paglilinis sa Levitico.
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at ipinapakita na ang pagbabayad-sala ay ginagawa alang-alang sa sambayanang nagmula kay Israel; ibinigay sa talababa ang mas idyomatikong katumbas.
- source_word: מִכָּל חַטֹּאתָם
  choice: dahil sa lahat ng kanilang kasalanan
  rationale: Ipinahihiwatig ng מִן kasabay ng כפר ang kaugnayan ng pagbabayad-sala sa mga kasalanan; ang 'dahil sa' ay natural, samantalang ang posibleng diwang paglilinis 'mula sa' ay pinanatili sa talababa.
- source_word: אַחַת בַּשָּׁנָה
  choice: minsan sa isang taon
  rationale: Likas na modernong Tagalog para sa taunang pag-uulit na malinaw ding kumakatawan sa Hebreong idyoma.
- source_word: וַיַּעַשׂ
  choice: At ginawa niya
  rationale: Hindi pinapangalanan ng Hebreo ang simuno. Pinananatili ng panghalip ang gramatikal na kalabuan sa halip na tahasang idagdag si Aaron.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ang iniutos ni Yahweh kay Moises
  rationale: Natural na Tagalog na nagsasaad ng ganap na pagsunod sa utos at tahasang pinananatili ang pangalang tipan na יהוה bilang Yahweh.
theological_decisions:
- issue: Paglalarawan sa gawaing כפר
  choice: magbabayad-sala
  alternative: maglilinis mula sa kasalanan
  rationale: Ang 'magbabayad-sala' ay nagpapanatili sa tradisyonal at ritwal na diwa nang hindi itinatanggi ang kaugnay na diwa ng paglilinis, na binabanggit sa talababa.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang Yahweh, ayon sa tahasang anyo ng tekstong Hebreo.
- issue: Pagkakakilanlan ng di-binanggit na simuno sa וַיַּעַשׂ
  choice: ginawa niya
  alternative: ginawa ni Aaron
  rationale: Bagaman malamang na si Aaron ang tinutukoy ayon sa konteksto, hindi siya tahasang pinangalanan sa talata; kaya pinanatili sa teksto ang kalabuan at ipinaliwanag lamang sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tuntuning panghabang-panahon' para sa legal na himig, 'magbabayad-sala' para sa bokabularyong ritwal ng Levitico, at mga payak na ayos ng pangungusap. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
