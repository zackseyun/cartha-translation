  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: tl
  text: Sapagkat sa araw na ito ay isasagawa ang pagtubos-sala para sa inyo upang linisin kayo mula sa lahat ng inyong kasalanan; sa harap ni Yahweh, magiging malinis kayo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “isasagawa niya ang pagtubos-sala para sa inyo.” Isahan ang pandiwang Hebreo, ngunit hindi tahasang binabanggit ang simuno sa sugnay na ito.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; nakaugaliang isalin na “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang paliwanag o batayan ng naunang utos; natural sa Tagalog ang “Sapagkat” sa ganitong ugnayan.
- source_word: בַיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Tuwirang pinananatili ang temporal na parirala at ang demonstratibong הַזֶּה.
- source_word: יְכַפֵּר
  choice: gagawin ang pagtubos-sala
  rationale: Pinananatili ang kahulugang kultiko ng piel na כפר habang iniiwasang magdagdag ng tahasang tagaganap na wala sa sugnay na Hebreo.
- source_word: עֲלֵיכֶם
  choice: para sa inyo
  rationale: Sa pagsama sa כפר, tinutukoy ng על ang mga taong pinatutungkulan at nakikinabang sa pagtubos-sala.
- source_word: לְטַהֵר אֶתְכֶם
  choice: upang linisin kayo
  rationale: Ipinahahayag ng pawatas ang layunin o bunga ng pagtubos-sala; malinaw at likas ang “linisin” sa modernong Tagalog.
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: mula sa lahat ng inyong kasalanan
  rationale: Sa konteksto ng paglilinis sa bayan, ang חטאת ay tumutukoy sa kanilang mga kasalanan, hindi sa mga handog para sa kasalanan.
- source_word: לִפְנֵי יְהוָה
  choice: Sa harap ni Yahweh
  rationale: Pinananatili ang diwa ng pagiging nasa harap o presensiya ng Diyos at isinasalin ang tipang pangalan na YHWH bilang “Yahweh.”
- source_word: תִּטְהָרוּ
  choice: magiging malinis kayo
  rationale: Inilalarawan ang kalagayang bunga ng paglilinis at pinananatili ang kaibhan nito sa naunang aktibong ideyang “linisin kayo.”
theological_decisions:
- issue: Hindi hayag na simuno ng יְכַפֵּר
  choice: gagawin ang pagtubos-sala
  alternative: gagawa siya ng pagtubos-sala
  rationale: Isahan ang pandiwang Hebreo ngunit walang tahasang simuno sa sugnay. Hindi tinutukoy ng salin kung ang tinutukoy ay ang punong pari o ibang tagaganap.
- issue: Kultikong kahulugan ng כפר
  choice: pagtubos-sala
  alternative: paglilinis sa sala
  rationale: Pinananatili ang natatanging wikang pansakripisyo nang hindi nagpapasok ng isang mas makitid na teorya tungkol sa paraan ng pagtubos-sala.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalang kinakatawan ng YHWH; itinatala sa talababa ang nakaugaliang salin upang maging malinaw sa mambabasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang impersonal na ayos upang mapanatili ang hindi hayag na tagaganap sa Hebreo, at pinaghiwalay ang gawa ng paglilinis sa bungang kalagayan ng pagiging malinis.
