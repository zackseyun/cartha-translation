  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: tl
  text: 'At magpapalabunutan si Aaron para sa dalawang kambing: isang bunot para sa PANGINOON at isang bunot para sa Azazel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang bunot para sa kambing na pinakakawalan.” Pinagtatalunan ang kahulugan ng salitang Hebreo na “Azazel”; maaari itong unawain bilang pangalang pantangi, bilang tungkulin ng kambing, o bilang katawagang may kaugnayan sa pag-aalis.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַן
  choice: magpapalabunutan
  rationale: Bagaman literal na nangangahulugang “magbigay/maglagay,” kasama ng גּוֹרָלוֹת at עַל ay tumutukoy ito sa ritwal na pagtatalaga sa pamamagitan ng palabunutan. Ang “magpapalabunutan” ay natural at malinaw sa modernong Tagalog.
- source_word: עַל
  choice: para sa
  rationale: Literal itong “sa ibabaw ng/hinggil sa,” ngunit sa Tagalog, ang “para sa dalawang kambing” ang likas na paraan upang ipahayag kung kanino inilalapat ang palabunutan nang hindi binabago ang ritwal na diwa.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: dalawang kambing
  rationale: Tumutukoy ito sa dalawang lalaking kambing, ngunit sapat at mas natural ang “dalawang kambing” sapagkat malinaw na ang mga hayop sa konteksto ng ritwal.
- source_word: גּוֹרָלוֹת
  choice: palabunutan
  rationale: Karaniwang salitang Tagalog para sa paraan ng pagpapasiya o pagtatalaga sa pamamagitan ng mga lot.
- source_word: גּוֹרָל אֶחָד
  choice: isang palabunot
  rationale: Pinananatili ang isahang anyo at ang pag-uulit ng parirala para sa dalawang pagtatalaga.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Itinuturing ang tetragrammaton bilang banal na pangalang pantangi at tinutumbasan ng “kay” ang prefiks na ל sa pagtatalaga ng palabunot.
- source_word: לַעֲזָאזֵל
  choice: para kay Azazel
  rationale: Pinananatiling transliterado ang pinagtatalunang עֲזָאזֵל upang huwag ipasiya sa pangunahing teksto kung ito ay pangalan, tungkulin ng kambing, o konseptong kaugnay ng pag-aalis.
theological_decisions:
- issue: Kahulugan ng עֲזָאזֵל sa ritwal ng Araw ng Pagtubos
  choice: Azazel bilang transliteradong katawagang hindi isinalin sa pangunahing teksto
  alternative: ang kambing na pakakawalan; ganap na pag-aalis; isang nilalang na kaugnay ng ilang
  rationale: Hindi tiyak sa talata kung ang termino ay pangalan ng isang nilalang o pook, paglalarawan sa tungkulin ng kambing, o katawagang kaugnay ng pag-aalis. Ang transliterasyon ay nagpapanatili sa tunay na kalabuan at umiiwas sa doktrinal na pagpapasiya.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “magpapalabunutan” para sa likas na pagpapahayag ng ritwal, habang pinanatili ang “Azazel” at ipinaliwanag ang kalabuan sa talababa.
