  naturalness: Marangal at madaling maunawaan ang pangungusap. Ang “Sa ganitong paraan” ay bahagyang mas malinaw at mas likas na pang-ugnay sa Tagalog kaysa sa paunang “Ganito,” habang pinananatili ang diwa ng בְּזֹאת.
