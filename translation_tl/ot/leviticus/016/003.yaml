base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: tl
  text: 'Sa ganitong paraan papasok si Aaron sa Banal na Lugar: may dalang toro mula sa kawan ng mga baka bilang handog para sa kasalanan[a], at isang lalaking tupa bilang handog na sinusunog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Maaari ring idiin ng salitang Hebreo ang ritwal na paglilinis, bukod sa kaugnayan nito sa kasalanan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/זֹאת
  choice: Ganito
  rationale: Maaaring tumukoy ang parirala sa paraan o sa mga kailangang dalhin na kasunod na binabanggit. Likas sa modernong Tagalog ang “Ganito” at pinananatili nito ang ugnayan sa mga tagubilin.
- source_word: יָבֹא
  choice: papasok
  rationale: Ang imperfect sa kontekstong legal ay may puwersang tagubilin. Ang “papasok” ay natural na pormang preskriptibo sa Tagalog, hindi lamang hulang mangyayari.
- source_word: אֶל הַ/קֹּדֶשׁ
  choice: sa Banal na Lugar
  rationale: Sa konteksto ng Araw ng Pagtubos, tumutukoy ito sa sagradong bahagi ng santuwaryo na papasukan ni Aaron. Nilinaw ng malaking titik na natatanging lugar ang tinutukoy.
- source_word: בְּ/פַר בֶּן בָּקָר
  choice: may dalang toro mula sa bakahan
  rationale: Ang literal na idyomang “toro, anak ng bakahan” ay natural na nangangahulugang toro mula sa mga baka. Ipinahahayag ng “may dalang” ang instrumental o kasamang diwa ng בְּ nang malinaw sa Tagalog.
- source_word: לְ/חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Karaniwang katawagan ito sa handog na חַטָּאת at madaling maunawaan. Inilalagay sa talababa ang posibleng diin sa ritwal na paglilinis.
- source_word: וְ/אַיִל
  choice: at isang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa; mas malinaw ito sa karaniwang mambabasa kaysa sa hiram o di-gaanong pamilyar na terminong “barakong tupa.”
- source_word: לְ/עֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog. Ang tradisyonal at malinaw na pariralang ito ay akma sa talaan ng mga handog.
theological_decisions:
- issue: Kultikong kahulugan ng חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang pangunahing salin ay kinikilala at malawak ang saklaw, ngunit hindi nito dapat ikubli na maaaring idiin ng termino ang ritwal na paglilinis; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang natural na “mula sa bakahan” sa halip na literal na “anak ng bakahan.”
