  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: tl
  text: At ang paring pinahiran at itinalaga upang maglingkod bilang pari bilang kahalili ng kanyang ama ang magsasagawa ng pagbabayad-sala,[a] at isusuot niya ang mga kasuotang lino, ang mga banal na kasuotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “na pinunan ang kanyang kamay,” isang idyoma para sa pagtatalaga o pagluklok sa paglilingkod bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: magsasagawa ng pagtubos
  rationale: Sa kontekstong ritwal ng mga pari, tumutukoy ang כפר sa pagsasagawa ng itinakdang ritwal ng pagtubos. Likas sa modernong Tagalog ang pariralang ito at hindi nito labis na tinutukoy ang paraan o mekanismo.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Ang mismong pangngalang Hebreo ay “ang pari.” Bagaman punong pari ang tinutukoy sa konteksto, inilalarawan siya ng talata sa pamamagitan ng pagpapahid, pagtatalaga, at paghalili sa ama sa halip na gamitin ang titulong “punong pari.”
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: pinahiran
  rationale: Tinutukoy ng sugnay ang paring pinahiran para sa tungkulin. Ang pasibong anyo ay natural sa Tagalog at angkop sa konteksto ng isang lehitimong kahalili.
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: itinalaga
  rationale: Ang literal na “punuin ang kamay” ay idyomang Hebreo para sa pormal na pagtatalaga o pagluklok sa paglilingkod bilang pari. Inihahatid ng “itinalaga” ang kahulugan nang malinaw; pinananatili sa talababa ang literal na larawan.
- source_word: לְכַהֵן
  choice: upang maglingkod bilang pari
  rationale: Ipinapahayag ng pawatas ang paggampan sa tungkulin ng pari; malinaw at natural ito sa modernong Tagalog.
- source_word: תַּחַת אָבִיו
  choice: kapalit ng kanyang ama
  rationale: Ang תחת ay nagpapahayag dito ng paghalili o pagkuha sa katungkulan ng ama.
- source_word: וְלָבַשׁ
  choice: at isusuot niya
  rationale: Ipinahahayag ng pandiwa ang ritwal na pagkilos ng pagsusuot ng mga kasuotan.
- source_word: בִּגְדֵי הַבָּד
  choice: ang mga kasuotang lino
  rationale: Ang בד sa kontekstong ito ay lino; malinaw at karaniwan ang “mga kasuotang lino.”
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: ang mga banal na kasuotan
  rationale: Ang inuulit na parirala ay karagdagang pagkakakilanlan sa mga kasuotang lino bilang nakalaan sa banal na gamit at pinananatili ang ugnayan sa salitang קדשׁ.
theological_decisions:
- issue: Kung isasalin ang הַכֹּהֵן bilang “pari” o interpretatibong “punong pari”
  choice: ang pari
  alternative: ang punong pari
  rationale: Punong pari ang tungkuling tinutukoy sa konteksto, ngunit “ang pari” ang nasa Hebreo at saka siya inilalarawan sa pamamagitan ng pagpapahid, pagtatalaga, at paghalili sa kanyang ama. Pinananatili ng salin ang anyo ng pinagmulan.
- issue: Kung paano isasalin ang idyomang “punuin ang kanyang kamay”
  choice: itinalaga
  alternative: pinuno ang kanyang kamay
  rationale: Hindi malinaw sa ordinaryong modernong mambabasa ang literal na anyo. Ipinahahayag ng “itinalaga” ang institusyonal na kahulugan, habang itinatala sa talababa ang literal na idyoma.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang “pari” sa halip na idagdag ang “punong,” at ginawang malinaw ang idyomang Hebreo sa pangunahing teksto habang inilalagay ang literal na anyo sa talababa.
