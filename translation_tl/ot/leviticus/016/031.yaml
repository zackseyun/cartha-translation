  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: tl
  text: Ito ay Sabbath ng ganap na pamamahinga para sa inyo, at magpakumbaba kayo[a]; ito ay isang tuntuning panghabang-panahon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pighatiin ninyo ang inyong mga sarili.” Ayon sa tradisyon, kabilang dito ang pag-aayuno at pagpipigil sa sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: Sabbath
  rationale: Pinanatili ang “Sabbath” bilang tiyak na katawagang panrelihiyon at pambatas sa Torah, hindi lamang bilang karaniwang araw ng pahinga.
- source_word: שַׁבָּתוֹן
  choice: ganap na pamamahinga
  rationale: Ipinahahayag nito ang masidhing diwa ng magkatambal na שַׁבַּת שַׁבָּתוֹן sa natural at dignidad na modernong Tagalog.
- source_word: הִיא לָכֶם
  choice: Ito ay ... para sa inyo
  rationale: Natural na sugnay sa Tagalog na pinananatili ang pahayag na tuwirang nakatuon sa buong pamayanan.
- source_word: וְעִנִּיתֶם
  choice: magpakumbaba kayo
  rationale: Sa kontekstong ritwal, tumutukoy ito sa pagpapakumbaba at pagkakait sa sarili. Naiiwasan ng saling ito ang maling pahiwatig na iniuutos ang pisikal na pananakit, habang pinananatili sa talababa ang mas literal na alternatibo.
- source_word: נַפְשֹׁתֵיכֶם
  choice: kayo / sarili
  rationale: Bahagi ito ng idyomatikong pahayag na tumutukoy sa buong sarili; hindi ang hiwalay na “kaluluwa” lamang ang tinutukoy.
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning panghabang-panahon
  rationale: Malinaw at natural nitong ipinahahayag ang namamalaging bisa ng pormulang pambatas nang hindi pinapahina ang עוֹלָם.
theological_decisions:
- issue: Kahulugan ng utos na ענה + נפשׁ sa Araw ng Pagtubos
  choice: magpakumbaba kayo
  alternative: magpakasakit kayo; mag-ayuno kayo
  rationale: Mas malawak ang idyomang Hebreo kaysa sa tahasang utos na mag-ayuno. Hindi tinukoy sa pangunahing teksto ang pag-aayuno, ngunit pinanatili sa talababa ang mas literal na diwa at ang tradisyonal na pagkaunawa rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang terminong “Sabbath” dahil isa itong nakaugat na katawagang panrelihiyon, habang ginawang natural sa Tagalog ang natitirang pangungusap.
