  text: וְ/נָתַ֧ן אֶֽת הַ/קְּטֹ֛רֶת עַל הָ/אֵ֖שׁ לִ/פְנֵ֣י יְהוָ֑ה וְ/כִסָּ֣ה עֲנַ֣ן הַ/קְּטֹ֗רֶת אֶת הַ/כַּפֹּ֛רֶת אֲשֶׁ֥ר עַל הָ/עֵד֖וּת וְ/לֹ֥א יָמֽוּת־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: tl
  text: Ilalagay niya ang insenso sa apoy sa harap ni Yahweh, upang matakpan ng ulap ng insenso ang takip ng pagtubos[a] na nasa ibabaw ng Patotoo, upang hindi siya mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luklukan ng awa.” Ang salitang Hebreo ay tumutukoy sa takip ng kaban, lalo na sa papel nito sa mga ritwal ng pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Ilalagay niya
  rationale: Sa konteksto ng mga tagubilin para sa ritwal, ang anyo ng pandiwa ay may puwersang nag-uutos o nagsasaad ng dapat gawin. Likas sa modernong Tagalog ang hinaharap na anyong “ilalagay niya.”
- source_word: הַקְּטֹרֶת
  choice: ang insenso
  rationale: Tumutukoy ito sa insensong ginagamit sa ritwal sa santuwaryo; malinaw at karaniwan ang “insenso” nang hindi dinaragdagan ng interpretatibong “halo.”
- source_word: עַל הָאֵשׁ
  choice: sa apoy
  rationale: Ipinahihiwatig ng parirala ang paglalagay ng insenso sa apoy o nagbabagang mga baga. Natural sa Tagalog ang “sa apoy.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang ideya ng pagkilos sa presensiya ni Yahweh sa kontekstong pangritwal, at ang “ni” ay angkop sa personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: וְכִסָּה עֲנַן הַקְּטֹרֶת
  choice: upang matakpan ng ulap ng insenso
  rationale: Ipinapakita ng “upang” ang layunin o inaasahang bunga, habang pinananatili ng “ulap ng insenso” ang larawan at ugnayang nasa pariralang Hebreo.
- source_word: הַכַּפֹּרֶת
  choice: takip ng pagtubos
  rationale: Tumutukoy ito sa takip ng kaban na may natatanging papel sa mga ritwal ng pagtubos. Mas malinaw ito sa modernong mambabasa kaysa sa tradisyonal ngunit maaaring malabong “luklukan ng awa.”
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: na nasa ibabaw ng Patotoo
  rationale: Pinananatili ang teknikal na katawagang “Patotoo” para sa tipang saksi na nasa kaban, nang hindi tahasang nililimitahan ito sa mga tapyas o sa dokumento.
- source_word: וְלֹא יָמוּת
  choice: at nang hindi siya mamatay
  rationale: Malinaw nitong ipinahahayag ang layunin o bunga ng pagtatakip ng ulap, at iniiwasan ang makalumang pananalita.
theological_decisions:
- issue: Pagpapakahulugan sa הַכַּפֹּרֶת sa konteksto ng santuwaryo at pagtubos
  choice: takip ng pagtubos
  alternative: luklukan ng awa
  rationale: Ang salita ay tumutukoy sa takip ng kaban na kaugnay ng ritwal ng pagtubos. Pinananatili ng “takip ng pagtubos” ang pisikal at ritwal na kahulugan; inilalagay sa talababa ang tradisyonal na alternatibo.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na banal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng mga huling sugnay
  choice: 'layunin o inaasahang bunga: “upang … at nang …”'
  alternative: 'payak na pagkakasunod: “at … at hindi …”'
  rationale: Maaaring ipahayag ng mga sugnay ang layunin o bunga ng paglalagay ng insenso. Ang saling ito ay nagpapalinaw sa ugnayan nang hindi inaalis ang tensiyon sa pagitan ng layunin at bunga.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “insenso,” “takip ng pagtubos,” at “Patotoo” bilang malinaw na mga katawagang angkop sa kontekstong pangsantuwaryo; iniwasan ang makaluma o labis na denominasyonal na pananalita.
