  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: tl
  text: Walang sinuman ang dapat nasa Toldang Tipanan sa pagpasok niya upang gumawa ng pagtubos sa banal na dako, hanggang sa lumabas siya. Gagawa siya ng pagtubos para sa kanyang sarili, para sa kanyang sambahayan, at para sa buong kapulungan ng Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל־אָדָם לֹא יִהְיֶה
  choice: Walang sinumang tao ang dapat nasa
  rationale: Ipinahahayag nito nang natural sa Tagalog ang ganap na pagbabawal na walang taong maaaring naroon; pinananatili rin ang tahasang אָדָם, ‘tao.’
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Karaniwan at malinaw na katumbas ng teknikal na katawagan para sa santuwaryong tolda kung saan nakikipagtagpo ang Diyos sa Israel.
- source_word: לְכַפֵּר / וְכִפֶּר
  choice: upang maghandog ng pantubos / Maghahandog ... ng pantubos
  rationale: Ang כפר sa rituwal na kontekstong ito ay tumutukoy sa gawaing nag-aalis o tumatakip sa kasalanan at nagpapanumbalik ng wastong kaugnayan; ang ‘maghandog ng pantubos’ ay likas sa modernong Tagalog at hindi labis na nililimitahan ang mekanismo nito.
- source_word: בַּקֹּדֶשׁ
  choice: sa banal na dako
  rationale: Pinananatili ang lokatibong diwa at ang sanggunian sa banal na lugar nang hindi tinutukoy nang higit sa tahasang sinasabi ng talata.
- source_word: בַּעֲדוֹ
  choice: para sa kanyang sarili
  rationale: Natural na Tagalog para sa idiomang ‘sa kapakanan niya’ sa konteksto ng rituwal na pagtubos.
- source_word: בֵּיתוֹ
  choice: kanyang sambahayan
  rationale: Mas akma kaysa literal na ‘bahay’ dahil ang tinutukoy ay ang mga kabilang sa kanyang household.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: buong kapulungan ng Israel
  rationale: Pinananatili ang kolektibo at pormal na kahulugan ng קהל.
theological_decisions:
- issue: Kahulugan ng כפר sa seremonyang ito
  choice: maghandog ng pantubos
  alternative: magbayad-sala / gumawa ng pagtubos
  rationale: Pinananatili ang sakripisyal at rituwal na bigat ng termino nang hindi nagpapasok ng isang partikular na teorya tungkol sa pagtubos.
- issue: Saklaw ng pagbabawal sa presensya sa tolda
  choice: Walang sinumang tao
  alternative: Walang sinumang lalaki
  rationale: Bagaman maaaring gamitin ang אָדָם para sa isang lalaki sa konteksto, ang pangunahing diwa rito ay walang ibang tao ang maaaring naroon; ang neutral at inklusibong ‘tao’ ang pinakatapat sa saklaw ng pagbabawal.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang pormal ngunit madaling maunawaang mga terminong ‘toldang tipanan,’ ‘banal na dako,’ ‘pantubos,’ ‘sambahayan,’ at ‘kapulungan.’
