  verdict: revise
  source_fidelity: Ang 'maghandog ng pantubos' ay hindi tumpak para sa לכפר / וכפר. Ang pandiwa ay tumutukoy sa pagsasagawa ng rituwal na pagtubos, hindi tahasang sa paghahandog ng isang pantubos. Ang natitirang daloy—pagbabawal sa presensya ng sinuman sa Toldang Tipanan, tagal nito hanggang sa paglabas niya, at saklaw ng pagtubos—ay tapat sa Hebreo.
  naturalness: Natural at marangal ang rebisadong Tagalog. Ang 'Walang sinuman ang dapat nasa' ay mas tuwiran kaysa 'Walang sinumang tao' at hindi nawawala ang saklaw na ipinahihiwatig ng אָדָם.
  terminology: Pinananatili ang mga terminong 'Toldang Tipanan,' 'banal na dako,' 'sambahayan,' at 'kapulungan ng Israel.' Pinalitan ang 'maghandog ng pantubos' ng 'gumawa ng pagtubos' upang hindi magdagdag ng ideya ng isang iniaalay na ransom at upang mapanatili ang rituwal na pandiwang כפר.
  issues:
  - severity: medium
    issue: Ang 'maghandog ng pantubos' ay nagdaragdag ng ideya ng paghahandog ng pantubos.
    rationale: Hindi sinasabi ng לכפר / וכפר na siya ay maghahandog ng pantubos; isinasaad nito na siya ay gagawa o magsasagawa ng pagtubos. Mahalaga ito lalo na dahil ang talata ay tumutukoy sa rituwal na gawaing pagtubos sa banal na dako.
  revised_text: Walang sinuman ang dapat nasa Toldang Tipanan sa pagpasok niya upang gumawa ng pagtubos sa banal na dako, hanggang sa lumabas siya. Gagawa siya ng pagtubos para sa kanyang sarili, para sa kanyang sambahayan, at para sa buong kapulungan ng Israel.
