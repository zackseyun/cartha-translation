base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: tl
  text: Huhugasan niya ng tubig ang kanyang katawan[a] sa isang banal na lugar[b]. Isusuot niya ang kanyang mga kasuotan at lalabas. Ihahandog niya ang kanyang handog na sinusunog at ang handog na sinusunog ng sambayanan, at magbabayad-sala siya para sa kanyang sarili at para sa sambayanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kanyang laman.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa isang banal na lugar,” hindi kinakailangang tumukoy sa Banal na Dako, ang silid sa loob ng santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: Huhugasan niya
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubiling legal ay may diwang preskriptibo; natural itong ipinahahayag sa Filipino sa aspektong magaganap.
- source_word: בְּשָׂרוֹ
  choice: ang kanyang katawan
  rationale: Bagaman literal na “laman,” ang tinutukoy sa konteksto ng paghuhugas ay ang buong katawan; mas natural at hindi malabo ang “katawan” sa modernong Filipino.
- source_word: בַּמַּיִם
  choice: ng tubig
  rationale: Sa pandiwang “huhugasan,” ang “ng tubig” ang likas na paraan upang ipahayag ang gamit o panlinis.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang tiyak na pantukoy ang parirala sa Hebreo; iniiwasan ng “isang banal na lugar” na ipakahulugang tiyak na ang teknikal na silid na Banal na Dako.
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: Isusuot niya ang kanyang mga kasuotan
  rationale: Pinananatili ng “mga kasuotan” ang marangal at ritwal na himig nang hindi nagiging lipas ang pananalita.
- source_word: וְיָצָא
  choice: at lalabas
  rationale: Tuwirang ipinahahayag ang paglabas niya mula sa banal na lugar ayon sa pagkakasunod ng ritwal.
- source_word: וְעָשָׂה
  choice: Ihahandog niya
  rationale: Kapag handog na sinusunog ang layon, ang “ihahandog” ang natural na katumbas sa wikang sakripisyal, sa halip na literal ngunit alanganing “gagawin.”
- source_word: עֹלָתוֹ
  choice: ang kanyang handog na sinusunog
  rationale: Maliwanag at karaniwang nauunawaang katawagan ito para sa handog na lubusang sinusunog.
- source_word: עֹלַת הָעָם
  choice: ang handog na sinusunog ng sambayanan
  rationale: Pinananatili nito ang pagkakatulad ng kayarian sa naunang handog at ang kolektibong kahulugan ng הָעָם.
- source_word: וְכִפֶּר
  choice: magsasagawa siya ng pagtubos
  rationale: Pinananatili ng parirala ang ritwal at malawak na diwa ng כפר nang hindi ito nililimitahan sa iisang teorya; ipinapakita ng talababa ang iba pang posibleng diin.
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: para sa kanyang sarili at para sa sambayanan
  rationale: Natural at malinaw na ipinahahayag ng “para sa” ang pagkilos alang-alang sa pari at sa bayan.
theological_decisions:
- issue: Kahulugan ng כפר sa batas tungkol sa paghahandog
  choice: magsasagawa ng pagtubos
  alternative: magsasagawa ng pagbabayad-sala; magsasagawa ng ritwal na paglilinis
  rationale: Ang “pagtubos” ay nagpapanatili sa malawak na diwa ng pakikipagkasundo at pag-aalis ng kasalanan sa ritwal, habang ang mga alternatibo ay maaaring magbigay-diin sa pagpapawalang-sala o paglilinis. Hindi pinipili ng pangunahing teksto ang isang makitid at pinagtatalunang paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang “sambayanan” para sa kolektibong bayan at “mga kasuotan” upang mapanatili ang ritwal na himig. Ang maiikling pangungusap ay sumusunod sa sunod-sunod na hakbang ng Hebreong tagubilin.
