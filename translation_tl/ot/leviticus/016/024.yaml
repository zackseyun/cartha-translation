  verdict: revise
  source_fidelity: Tumpak ang pagkakasunod ng mga kilos, ang di-tiyak na “isang banal na lugar,” ang dalawang handog na sinusunog, at ang saklaw na “para sa kanyang sarili at para sa sambayanan.” Gayunman, ang “pagtubos” ay karaniwang tumutukoy sa pagliligtas o pagtubos/ransom at hindi ang pinakatumpak na katumbas ng כפר sa kontekstong ritwal na ito.
  naturalness: Marangal, malinaw, at natural ang karamihan ng salin. Mas tuwiran at likas sa ganitong kontekstong biblikal ang “magbabayad-sala siya” kaysa “magsasagawa siya ng pagtubos.”
  terminology: Ang “katawan,” “banal na lugar,” “mga kasuotan,” “handog na sinusunog,” at “sambayanan” ay angkop. Pinalitan ang pangunahing katumbas ng כפר ng “magbabayad-sala,” na mas malapit sa “make atonement” nang hindi ipinipilit ang isang partikular na teoryang teolohikal.
  issues:
  - severity: medium
    issue: Ang “magsasagawa siya ng pagtubos” para sa וְכִפֶּר
    rationale: Ang “pagtubos” sa modernong Filipino ay madaling maunawaan bilang redemption, ransom, o deliverance. Sa ritwal na kontekstong Levitico, mas tumpak ang “magbabayad-sala,” na karaniwang katumbas ng “make atonement.” Dahil ito na ang pangunahing salin, hindi dapat manatili itong simpleng alternatibo lamang sa talababa.
  revised_text: Huhugasan niya ng tubig ang kanyang katawan[a] sa isang banal na lugar[b]. Isusuot niya ang kanyang mga kasuotan at lalabas. Ihahandog niya ang kanyang handog na sinusunog at ang handog na sinusunog ng sambayanan, at magbabayad-sala siya para sa kanyang sarili at para sa sambayanan.
