id: LEV.16.12
reference: Leviticus 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: tl
  text: Kukuha siya mula sa ibabaw ng altar sa harap ni Yahweh ng mga nagbabagang uling na sapat upang punuin ang lalagyan ng baga. Kukuha rin siya ng pinong dinurog na mabangong insenso na kasya sa dalawa niyang palad, at dadalhin niya ang mga ito sa loob ng tabing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kabila ng tabing.” Tumutukoy ito sa panloob na santuwaryong nasa likod ng kurtina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kukuha siya
  rationale: Ang anyong pandiwa sa konteksto ng mga ritwal na tagubilin ay naghahayag ng iniutos na susunod na hakbang; natural itong ipahayag sa Filipino sa aspektong kontemplatibo.
- source_word: מְלֹא הַמַּחְתָּה
  choice: sapat upang punuin ang lalagyan ng baga
  rationale: Ipinahahayag ng parirala ang daming kasya sa isang מַחְתָּה. Ang “lalagyan ng baga” ay malinaw sa karaniwang mambabasa at hindi ipinagpapalagay na lalagyan lamang ito ng insenso.
- source_word: גַּחֲלֵי אֵשׁ
  choice: mga nagbabagang uling
  rationale: Natural na Filipino ito para sa mga uling na may apoy o init, habang pinananatili ang kongkretong larawan ng Hebreo.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: mula sa ibabaw ng altar
  rationale: Pinananatili nito ang tiyak na ugnayang panlunan ng מֵעַל, hindi lamang ang pangkalahatang “mula sa altar.”
- source_word: מִלִּפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Iniuugnay ang parirala sa altar na nasa presensiya ni Yahweh, ayon sa ayos at diwa ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyon ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וּמְלֹא חָפְנָיו
  choice: na kasya sa dalawa niyang palad
  rationale: Ang חָפְנָיו ay tumutukoy sa magkabilang nakakuyom o nakalukob na palad bilang panukat. Nililinaw ng salin ang dami nang hindi nagiging alanganin ang pananalita.
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: pinong dinurog na mabangong insenso
  rationale: Pinananatili ang pagiging mabango ng sangkap at ang ritwal na detalyeng ito ay dinurog nang pino.
- source_word: וְהֵבִיא
  choice: at dadalhin niya ang mga ito
  rationale: Ipinagpapatuloy nito ang serye ng iniutos na kilos at nililinaw na kapuwa ang mga uling at insenso ang dadalhin.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: sa loob ng tabing
  rationale: Sa konteksto, tumutukoy ang siksik na parirala sa pagpasok sa espasyong nasa kabila o likod ng kurtinang naghihiwalay sa santuwaryo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa mga titulong tumutukoy sa Diyos.
- issue: Patutunguhan sa מִבֵּית לַפָּרֹכֶת
  choice: sa loob ng tabing
  alternative: sa kabila ng tabing
  rationale: Ipinahihiwatig ng konteksto ang pagdadala sa panloob na espasyo sa likod ng kurtina. Hindi na pinangalanang “Kabanal-banalang Lugar” sa pangunahing teksto upang hindi magdagdag ng katawagang wala mismo sa talata.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “altar,” “insenso,” at “tabing” bilang mga pamilyar na terminong panritwal; iniwasan ang sobrang literal ngunit alanganing mga pariralang gaya ng “kapuspusan ng kaniyang mga palad.”
