id: LEV.16.5
reference: Leviticus 16:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: tl
  text: At mula sa kapulungan ng mga anak ni Israel[a] ay kukuha siya ng dalawang lalaking kambing bilang handog para sa kasalanan[b] at isang lalaking tupa bilang handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita” o “sambayanan ng Israel.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת sa Levitico ay maaaring tumukoy sa handog na tumutugon sa kasalanan at ritwal na karumihan.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: At mula sa
  rationale: Pinananatili nito ang payak na pang-ugnay at ang diwang ang mga hayop ay kukunin mula sa sambayanan.
- source_word: עֲדַת
  choice: kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan ng tipan; ang “kapulungan” ay likas, marangal, at angkop sa kontekstong pangritwal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit itong sumusunod sa tahasang anyo ng Hebreo habang ang talababa ay nagbibigay ng mas idyomatikong kahulugan nito bilang buong bayang Israel.
- source_word: יִקַּח
  choice: kukuha siya
  rationale: Sa konteksto ng mga tagubiling pangritwal, ang aspektong di-ganap ay may puwersang nag-uutos; natural na naipahahayag ito sa Filipino sa anyong panghinaharap.
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: dalawang lalaking kambing
  rationale: Malinaw nitong pinananatili ang bilang at kasarian ng mga hayop na itinakda para sa paghahandog.
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Ipinakikita ng kontekstong pansakripisyo na ang חַטָּאת ay pangalan ng handog, hindi lamang ng abstraktong kasalanan; ang talababa ay nagpapanatili sa posibleng diin sa paglilinis.
- source_word: וְאַיִל אֶחָד
  choice: at isang lalaking tupa
  rationale: Ang אַיִל ay partikular na lalaking tupa, at pinananatili ng “isang” ang tahasang bilang.
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Ito ang natural at karaniwang salin sa Filipino para sa עֹלָה, ang handog na lubos na sinusunog.
theological_decisions:
- issue: Pagpapahayag sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili sa pangunahing teksto ang kongkretong pananalita ng Hebreo nang hindi itinatangging pangkalahatan ang tinutukoy; inilalahad sa talababa ang idyomatikong kahulugan.
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang tradisyonal at madaling makilalang katawagan ay inilagay sa teksto, habang pinananatili sa talababa ang tunay na leksikal at ritwal na posibilidad na nakatuon ito sa paglilinis mula sa kasalanan at ritwal na karumihan.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “kapulungan” para sa kontekstong pangtipan at pangritwal, at ang mga tradisyonal ngunit malinaw na katawagang “handog para sa kasalanan” at “handog na sinusunog.”
