  source_fidelity: 'Tumpak na naihahatid ng salin ang pagkakasunod ng Hebreo: matapos ang pagganap ng כפר para sa santuwaryo, Tolda ng Pagtatagpo, at altar, ihaharap ang natitirang buhay na lalaking kambing. Ang “Kapag natapos na niya” ay wastong temporal na pag-uugnay ng וְכִלָּה at ng kasunod na infinitive, at ang “ihaharap niya” ay angkop na idiomatikong pagsasalin ng וְהִקְרִיב nang hindi itinatago ang ritwal na diwa nito.'
