base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: tl
  text: Kapag natapos na niyang magsagawa ng pagtubos[b] para sa santuwaryo[a], sa Tolda ng Pagtatagpo, at sa altar, ihaharap niya ang buhay na lalaking kambing[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na lugar.”
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong ito, ang “magsagawa ng pagtubos” ay maaari ring unawain bilang pagsasagawa ng ritwal na paglilinis o pag-aalis ng karumihan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ilalapit”; ibig sabihin, ihaharap para sa susunod na gawain sa ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: Kapag natapos na niyang magsagawa ng pagtubos
  rationale: Ipinahahayag ng temporal na sugnay ang pagkumpleto ng unang ritwal bago ang kasunod na kilos. Pinananatili ng “pagtubos” ang malawak at mahalagang kahulugan ng כפר nang hindi nagpapasya sa iisang paliwanag sa paraan o bisa nito.
- source_word: הַקֹּדֶשׁ
  choice: ang santuwaryo
  rationale: Sa konteksto ng Araw ng Pagtubos, tumutukoy ito sa sagradong bahagi ng santuwaryo, hindi sa abstraktong kabanalan. Ang “santuwaryo” ay malinaw at karaniwan sa makabagong Filipino.
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtatagpo
  rationale: Inilalarawan nito ang toldang itinakdang dako ng pakikipagtagpo. Mas malapit ito sa Hebreo kaysa “Tolda ng Tipanan,” sapagkat walang salitang “tipan” sa parirala.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ito ang tuwiran at likas na katumbas ng terminong pangkulto.
- source_word: וְהִקְרִיב
  choice: ihaharap niya
  rationale: Bagaman literal na “ilalapit,” sa kontekstong ritwal ang pandiwa ay tumutukoy sa pagdadala at paghaharap para sa susunod na gawain.
- source_word: הַשָּׂעִיר הֶחָי
  choice: ang buhay na lalaking kambing
  rationale: Pinananatili ang kasarian na ipinahihiwatig ng שׂעיר at ang malinaw na kaibahan nito sa kambing na napatay na.
theological_decisions:
- issue: Kahulugan ng כפר sa kontekstong paghahandog
  choice: magsagawa ng pagtubos
  alternative: magsagawa ng ritwal na paglilinis
  rationale: Maaaring idiin ng כפר dito ang paglilinis o pag-aalis ng karumihang ritwal, ngunit mas malawak ang “pagtubos” at hindi nito nililimitahan ang salita sa iisang mekanismo. Inilalahad sa talababa ang tunay na alternatibong diwa.
- issue: Pagkilala sa הַקֹּדֶשׁ
  choice: santuwaryo
  alternative: banal na lugar
  rationale: Ang “santuwaryo” ay malinaw na tumutukoy sa sagradong espasyo sa kontekstong ito, samantalang pinananatili sa talababa ang mas pormal na lexical na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tolda ng Pagtatagpo” upang maging likas ngunit malapit sa אֹהֶל מוֹעֵד. Nasa pangunahing teksto ang lahat ng panandang talababa at inayos ang mga ito ayon sa pagkakasunod ng paglitaw.
