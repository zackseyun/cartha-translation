source:
  edition: WLC
  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: tl
  text: Magsusuot siya ng banal na tunikang lino[a], at isusuot niya sa mismong katawan ang panloob na salawal na lino. Ibibigkis niya sa baywang ang pamigkis na lino, at ibabalot niya sa ulo ang turbanteng lino. Mga banal na kasuotan ang mga ito. Huhugasan niya ng tubig ang kanyang katawan[b], saka niya isusuot ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sagradong tunikang lino.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “laman”; gayundin sa pariralang “sa mismong katawan” sa unahan ng talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת בַּד קֹדֶשׁ
  choice: banal na tunikang lino
  rationale: Pinananatili ng “tunika” ang tiyak na uri ng kasuotan, ng “lino” ang materyal, at ng “banal” ang ritwal na pagkakatalaga nito.
- source_word: מִכְנְסֵי בַד
  choice: panloob na salawal na lino
  rationale: Malinaw sa karaniwang mambabasa na ito ay kasuotang panloob para sa ibabang bahagi ng katawan; mas tiyak ito kaysa sa pangkalahatang “panloob na kasuotan.”
- source_word: עַל בְּשָׂרוֹ
  choice: sa mismong katawan
  rationale: Ang “mismong” ay nagpapahiwatig na direktang nakadikit o nakasuot sa katawan, habang iniiwasan ang di-likas at maaaring teolohikong maunawaang “laman” sa pangunahing teksto.
- source_word: אַבְנֵט בַּד
  choice: pamigkis na lino
  rationale: Ang “pamigkis” ay angkop sa telang ibinibigkis sa baywang at mas malapit sa seremonyal na kasuotan kaysa sa karaniwang sinturon.
- source_word: מִצְנֶפֶת בַּד
  choice: turbanteng lino
  rationale: Tiyak at madaling makilalang tawag ito sa ibinabalot na pantakip sa ulo ng pari.
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: Huhugasan niya ng tubig ang kanyang katawan
  rationale: Natural na Filipino ito na tapat sa ritwal na paghuhugas ng buong katawan; inilalagay sa talababa ang literal na “laman.”
- source_word: וּלְבֵשָׁם
  choice: saka niya isusuot ang mga iyon
  rationale: Ipinahahayag ng “saka” ang pagkakasunod ng paghuhugas at pagsusuot na ipinakikita ng anyong pandiwa at ng konteksto.
theological_decisions:
- issue: Kahulugan ng kabanalan ng mga kasuotan
  choice: banal na mga kasuotan
  alternative: sagradong mga kasuotan
  rationale: Inilalarawan lamang ang mga ito bilang itinalaga para sa gawaing pansaserdote; walang idinaragdag na simbolismo o doktrinang hindi hayag sa talata.
- issue: Pag-render sa בשרו sa kontekstong ritwal
  choice: katawan
  alternative: laman
  rationale: Mas natural at kongkreto ang “katawan” sa usapin ng pagsusuot at paghuhugas. Pinananatili sa talababa ang literal na salitang “laman” upang hindi mawala ang anyo ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; ginagamit ang malinaw na katawagang pangkasuotan at iniiwasan ang lipas o labis na teknikal na pananalita. Pinananatili ang ritwal na diwa at ang pagkakasunod-sunod ng mga kilos.
