  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: tl
  text: Pagkatapos, lalabas siya patungo sa altar na nasa harapan ni Yahweh at magsasagawa siya ng pagtubos para rito[a]. Kukuha siya ng kaunting dugo ng toro at ng kaunting dugo ng kambing, at ilalagay niya ito sa mga sungay ng altar sa buong palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lilinisin ito”; sa mga kontekstong ritwal na saserdotal, ang pandiwang Hebreo ay maaari ring tumukoy sa ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Pagkatapos, lalabas siya
  rationale: Ipinahihiwatig ng anyong pandiwa sa sunod-sunod na tagubiling panritwal ang kasunod na itinakdang kilos; natural itong naipapahayag sa Filipino sa hinaharap na anyo.
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: ang altar na nasa harapan ni Yahweh
  rationale: Tuwirang tinutukoy ang altar na nakapuwesto sa harapan o presensya ni Yahweh sa santuwaryo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְכִפֶּר עָלָיו
  choice: at gagawa ng pagtubos para rito
  rationale: Ang כפר sa kontekstong saserdotal ay tumutukoy sa ritwal na pagtubos na may kaugnayan din sa paglilinis; ang hulaping panhalip ay tumutukoy sa altar.
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: Kukuha siya ng kaunting dugo ng toro at ng kaunting dugo ng kambing
  rationale: Ang inuulit na מִן ay partitive, kaya malinaw na kaunting bahagi ng dugo ng bawat hayop ang kukunin.
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: at ipapahid niya ito sa lahat ng sungay ng altar
  rationale: Sa ritwal na konteksto, natural na ipinahahayag ng “ipapahid” ang paglalagay ng dugo sa mga sungay. Ang “lahat” ay naghahatid sa diwa ng סָבִיב, ‘sa palibot/bawat panig.’
theological_decisions:
- issue: Kahulugan ng כפר sa ritwal na saserdotal
  choice: gagawa ng pagtubos para rito
  alternative: lilinisin ito
  rationale: Pinananatili ng “pagtubos” ang malawak at kinikilalang bigat na panritwal at teolohikal ng salita nang hindi pumipili ng isang makitid na teorya. Gayunman, inilalahad sa talababa ang tunay na diwa ng ritwal na paglilinis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” “toro,” at “kambing” bilang karaniwang nauunawaang mga salita, at pinanatili ang pangalang “Yahweh.”
