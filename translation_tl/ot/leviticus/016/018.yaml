  to: Pagkatapos, lalabas siya patungo sa altar na nasa harapan ni Yahweh at magsasagawa siya ng pagtubos para rito[a]. Kukuha siya ng kaunting dugo ng toro at ng kaunting dugo ng kambing, at ilalagay niya ito sa mga sungay ng altar sa buong palibot.
