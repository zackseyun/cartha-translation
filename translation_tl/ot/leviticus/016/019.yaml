id: LEV.16.19
reference: Leviticus 16:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: tl
  text: Magwiwisik siya sa ibabaw nito ng kaunting dugo gamit ang kanyang daliri, pitong ulit. Lilinisin[a] niya ito at itatalaga niyang banal[b] mula sa mga karumihan ng mga Israelita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalisayin.” Ang pandiwang Hebreo ay karaniwang terminong pangpari para sa paglilinis tungo sa ritwal na kalinisan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pabanalin” o “gawing banal.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “mga anak ni Israel,” isang kolektibong tawag sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: iwiwisik niya
  rationale: Ang Hiphil ng נזה sa kontekstong ritwal ay tumutukoy sa pagwiwisik ng dugo. Ang “iwiwisik” ay malinaw at likas sa makabagong Filipino.
- source_word: עָלָיו
  choice: dito
  rationale: Tumutukoy ito sa altar na binanggit sa naunang talata. Ang “dito” ay likas na tumutukoy sa bagay na iyon nang hindi inuulit ang pangngalan.
- source_word: מִן־הַדָּם
  choice: ang kaunting dugo
  rationale: 'Partitibo ang מִן: bahagi ng dugong nakahanda ang kukunin para iwisik.'
- source_word: בְּאֶצְבָּעוֹ
  choice: gamit ang kanyang daliri
  rationale: Ipinapahayag ng instrumental na בְּ ang kasangkapang ginamit; natural sa Filipino ang pariralang ito.
- source_word: שֶׁבַע פְּעָמִים
  choice: pitong ulit
  rationale: Tuwirang pinananatili ang tiyak na bilang ng pagwiwisik sa ritwal.
- source_word: וְטִהֲרוֹ
  choice: lilinisin niya ito
  rationale: Ang טהר ay karaniwang terminong pangpari para sa pagpapaging malinis sa ritwal. Madaling maunawaan ang “lilinisin,” habang nililinaw ng talababa ang teknikal na diwa.
- source_word: וְקִדְּשׁוֹ
  choice: itatalaga itong banal
  rationale: Ipinahihiwatig ng קדש ang pagbubukod o pagtatalaga bilang banal. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na “pabanalin.”
- source_word: מִטֻּמְאֹת
  choice: mula sa mga karumihan
  rationale: Pinananatili ng maramihang “mga karumihan” ang plural ng Hebreo at ang kategoryang ritwal, hindi lamang pisikal na dumi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural na modernong Filipino para sa kolektibong idyomang Hebreo; pinananatili sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Ritwal na paglilinis at pagpapabanal sa altar
  choice: Ang altar ay nililinis mula sa mga ritwal na karumihan at itinatalaga bilang banal.
  alternative: Maaaring isalin ang mga pandiwa bilang “dalisayin” at “pabanalin.”
  rationale: Ang konteksto ay ritwal na pangpari na nakaaapekto sa altar, hindi moral na pagbabago o panloob na pagpapanibago. Iniiwasan ng salin ang pagpasok ng mga kategoryang teolohikal na wala sa talata.
- issue: Kaugnayan ng מִטֻּמְאֹת sa dalawang pandiwa
  choice: Inilagay ang “mula sa mga karumihan” kasunod ng paglilinis, habang pinananatili ring magkakaugnay ang paglilinis at pagtatalaga bilang banal.
  alternative: Maaaring mas pormal na sabihing “lilinisin niya ito at itatalaga itong banal mula sa mga karumihan,” ngunit hindi ito likas sa Filipino.
  rationale: Pinananatili ang diwang ang ritwal ay tumutugon sa mga karumihan ng Israel, nang hindi lumilikha ng alanganing sintaks sa Filipino.
- issue: Pagpapahayag ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Ang parirala ay isang kolektibong katawagan sa bayang Israel. Ang “mga Israelita” ay natural at hindi nagpapahiwatig na mga lalaking anak lamang ang tinutukoy; ang literal na anyo ay nasa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyo sa pangunahing teksto, habang inilagay sa mga talababa ang mas teknikal o mas literal na mga alternatibo. Pinanatili ang ritwal na diwa ng talata at ang plural na “mga karumihan.”
