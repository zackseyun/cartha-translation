  terminology: Pinanatili ang “mga karumihan” para sa maramihang ritwal na טֻמְאֹת, “lilinisin” para sa טהר, at “itatalaga niyang banal” para sa קדש. Ang “mga Israelita” ay natural na kolektibong Tagalog; ibinibigay ng talababa ang literal na “mga anak ni Israel.”
