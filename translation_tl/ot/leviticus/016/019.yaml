revisions:
- from: Pitong ulit niyang iwiwisik dito, gamit ang kanyang daliri, ang kaunting dugo. Sa gayon, lilinisin[a] niya ito mula sa mga karumihan ng mga Israelita[c] at itatalaga itong banal[b].
  to: Magwiwisik siya sa ibabaw nito ng kaunting dugo gamit ang kanyang daliri, pitong ulit. Lilinisin[a] niya ito at itatalaga niyang banal[b] mula sa mga karumihan ng mga Israelita[c].
  rationale: Pinalitan ang deiktikong “dito” ng “sa ibabaw nito” upang tumpak na maipahayag ang pagtukoy ng Hebreo sa altar. Inayos din ang pangungusap upang ang “mula sa mga karumihan ng mga Israelita” ay malinaw na maiugnay sa magkasunod na ritwal na paglilinis at pagtatalaga bilang banal. Hindi binago ang kahulugan, bilang, kasangkapan, o ritwal na rehistro ng talata.
