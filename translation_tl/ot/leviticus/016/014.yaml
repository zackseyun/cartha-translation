base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: tl
  text: Kukuha siya ng kaunting dugo ng toro at iwiwisik niya ito gamit ang kanyang daliri sa harapang bahagi ng takip na pantubos[a], sa silangang panig. Sa harap ng takip na pantubos ay iwiwisik niya ang kaunting dugo gamit ang kanyang daliri nang pitong beses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luklukan ng awa.” Ang Hebreong kapporet ay tumutukoy sa takip ng kaban, ang lugar na kaugnay ng pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Kukuha siya
  rationale: Ang anyong pandiwa sa konteksto ng sunud-sunod na ritwal na tagubilin ay nagsasaad ng itinakdang gagawin, hindi ng payak na pangyayaring naganap na.
- source_word: מִדַּם הַפָּר
  choice: ng kaunting dugo ng toro
  rationale: 'Partitibo ang מִן: bahagi lamang ng dugo ang kukunin. Likas sa modernong Tagalog ang “kaunting dugo ng toro.”'
- source_word: וְהִזָּה / יַזֶּה
  choice: iwiwisik / iwiwisik niya
  rationale: Sa kontekstong pari at ritwal, ang נזה ay tumutukoy sa paglalagay ng dugo sa pamamagitan ng pagwiwisik.
- source_word: בְאֶצְבָּעוֹ
  choice: sa pamamagitan ng kanyang daliri
  rationale: Instrumental ang בְּ; tahasang pinananatili ang paraang itinakda sa ritwal.
- source_word: עַל פְּנֵי הַכַּפֹּרֶת קֵדְמָה
  choice: sa harapang bahagi ng takip ng pagtubos, sa dakong silangan
  rationale: Pinananatili ang spatial na ugnayan ng עַל־פְּנֵי at ang silangang direksiyon ng קֵדְמָה nang hindi pinapantay ito sa kasunod na לִפְנֵי.
- source_word: הַכַּפֹּרֶת
  choice: takip ng pagtubos
  rationale: Ang כַּפֹּרֶת ay ang natatanging takip ng kaban na kaugnay ng ritwal ng pagtubos. Mas malinaw sa karaniwang mambabasa ang pisikal na bagay kaysa sa tradisyonal ngunit matalinghagang “luklukan ng awa.”
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: Pagkatapos, sa harap ng takip ng pagtubos
  rationale: Ang לִפְנֵי ay lokasyong nasa harap ng takip, na iba sa unang pagwiwisik sa harapang bahagi nito. Ang “Pagkatapos” ay natural na nagmamarka sa kasunod na hakbang ng tagubilin.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tahasan nitong pinananatili ang bilang at ang ritwal na pag-uulit.
- source_word: מִן הַדָּם
  choice: ang kaunting dugo
  rationale: 'Muling inuunawa ang מִן bilang partitibo: ilang bahagi ng dugo ang ginagamit sa pagwiwisik.'
theological_decisions:
- issue: Salin ng הַכַּפֹּרֶת
  choice: takip ng pagtubos
  alternative: luklukan ng awa
  rationale: Ang pangunahing salin ay nagpapakita na ito ang takip ng kaban at pinananatili ang kaugnayan nito sa pagtubos. Inilalagay sa talababa ang nakaugaliang “luklukan ng awa” upang mapanatili ang kilalang katawagang panrelihiyon nang hindi ipinapalagay na literal na upuan ang bagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na anyong panghinaharap para sa itinakdang hakbang ng ritwal at iniwasan ang labis na arkaikong pananalita. Ang “takip ng pagtubos” ay kongkreto at madaling maunawaan, habang pinananatili sa talababa ang tradisyonal na katawagan.
