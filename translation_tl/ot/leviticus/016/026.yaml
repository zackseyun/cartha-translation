base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: tl
  text: Ang taong magpapakawala ng kambing para sa Azazel[a] ay dapat maglaba ng kanyang mga damit at maghugas ng kanyang katawan sa tubig. Pagkatapos, maaari na siyang pumasok sa kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa pag-aalis.” Pinagtatalunan ang kahulugan ng salitang Hebreo. Maaaring isa itong pantanging pangalan o katawagan, o maaaring tumukoy sa pag-aalis o sa tinatawag na “kambing na ipinakawala.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: Ang taong magpapakawala
  rationale: Ang may-artikulong participle ay tumutukoy sa taong naatasang magpakawala sa kambing. Likas sa modernong Filipino ang pariralang ito at naipapakita nitong isang takdang papel ang tinutukoy.
- source_word: הַשָּׂעִיר
  choice: sa kambing
  rationale: Bagaman maaaring tukuyin ng salita ang lalaking kambing, malinaw na sa konteksto kung aling hayop ang tinutukoy, kaya sapat at natural ang “kambing.”
- source_word: לַעֲזָאזֵל
  choice: para kay Azazel
  rationale: Pinanatili bilang transliteradong katawagan ang pinagtatalunang salitang Hebreo. Ang “para kay” ay maaaring magpahiwatig ng paglalaan o patutunguhan nang hindi isinasara ang kahulugan sa isang tiyak na interpretasyon.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay dapat maglaba ng kanyang mga damit
  rationale: Malinaw na ipinahahayag ng “dapat” ang rituwal na obligasyon, at ang “maglaba ng kanyang mga damit” ay karaniwan at dignified na Filipino.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: at maghugas ng kanyang katawan sa tubig
  rationale: Sa konteksto ng rituwal na paglilinis, natural na katumbas ng literal na “laman” ang “katawan.” Pinanatili rin ang tahasang pagbanggit sa tubig.
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos
  rationale: Maikli at natural itong pananda ng pagkakasunod-sunod ng mga kilos.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: maaari na siyang pumasok sa kampo
  rationale: Ipinahihiwatig ng konteksto na pinahihintulutan lamang ang muling pagpasok matapos ang paghuhugas; ang “maaari na” ay malinaw na naghahatid ng pahintulot na iyon.
theological_decisions:
- issue: Kahulugan ng לַעֲזָאזֵל sa rituwal ng Araw ng Pagtubos
  choice: Panatilihin bilang katawagang “Azazel” at isalin ang parirala na “para kay Azazel.”
  alternative: “para sa pag-aalis,” “bilang kambing na pinakawalan,” o pagtukoy rito bilang isang nilalang sa ilang
  rationale: Pinagtatalunan ang kahulugan at pinagmulan ng termino. Ang transliterasyon ay nagpapanatili sa tunay na kalabuan ng Hebreo at umiiwas sa pagpasok ng isang tiyak na teolohikal na paliwanag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na angkop sa tekstong legal at rituwal. Ginamit ang “kampo” bilang karaniwang katawagan sa pamayanan ng Israel sa ilang. Inilagay ang talababa kaagad pagkatapos ng “Azazel” upang malinaw kung aling salita ang ipinapaliwanag.
