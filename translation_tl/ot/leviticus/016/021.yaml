language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: tl
  text: At ipapatong ni Aaron ang dalawang kamay niya sa ulo ng buhay na lalaking kambing, at ipagtatapat niya sa ibabaw ng kambing ang lahat ng mga kasamaan ng mga anak ni Israel[a], ang lahat nilang pagsuway, at ang lahat nilang kasalanan. Ilalagay niya ang mga ito sa ulo ng kambing at ipapadala ito sa ilang sa pamamagitan ng isang lalaking nakatalaga para rito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita” o “sambayanan ng Israel.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng isang lalaking handa” o “sa pamamagitan ng isang lalaking itinalaga para rito.” Mahirap tiyakin ang eksaktong diwa ng salitang Hebreo; maaaring idiin nito ang pagiging handa, pagkakatalaga, o pagiging angkop para sa pagkakataong iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: ipapatong
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa ritwal na pagpapatong ng mga kamay sa hayop; malinaw at natural sa modernong Tagalog ang “ipapatong.”
- source_word: שְׁתֵּי יָדוֹ
  choice: ang dalawa niyang kamay
  rationale: Tahasang pinananatili ang bilang na dalawa at natural itong mababasa sa Filipino.
- source_word: הַשָּׂעִיר הַחַי
  choice: ang buhay na lalaking kambing
  rationale: Ang שָׂעִיר ay lalaking kambing, at tinutukoy ng הַחַי ang kambing na pinananatiling buhay sa ritwal.
- source_word: וְהִתְוַדָּה עָלָיו
  choice: ipagtatapat niya sa ibabaw nito
  rationale: Pinananatili ng “ipagtatapat” ang diwa ng hayagang pagkilala sa kasalanan, samantalang ang “sa ibabaw nito” ay sumasalamin sa ritwal na gamit ng עַל.
- source_word: עֲוֺנֹת
  choice: mga kasamaan
  rationale: Ipinahahayag nito ang moral na kabuktutan o pagkakasala at naihihiwalay sa dalawa pang katawagan sa kasalanan sa talata.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na pananalitang pampamilya ng Hebreo, habang ipinapaliwanag sa talababa ang kolektibong kahulugan nito.
- source_word: פִּשְׁעֵיהֶם
  choice: mga pagsuway
  rationale: Naipahahayag ng “pagsuway” ang diwa ng paglabag o paghihimagsik nang hindi nagiging labis na teknikal.
- source_word: לְכָל חַטֹּאתָם
  choice: ang lahat nilang kasalanan
  rationale: Sa konteksto, binubuo nito ang ikatlong bahagi ng sunod-sunod na mga katawagan para sa kabuuan ng kasalanan ng Israel.
- source_word: וְנָתַן אֹתָם
  choice: ilalagay niya ang mga iyon
  rationale: Tumutukoy ito sa sagisag na paglalagay sa ulo ng kambing ng mga kasalanang ipinagtapat.
- source_word: וְשִׁלַּח
  choice: ipapadala niya ito
  rationale: Pinananatili nito ang pangunahing diwa ng pagpapayaon o pagpapalayo sa kambing.
- source_word: בְּיַד אִישׁ עִתִּי
  choice: sa pangangalaga ng isang lalaking nakatalaga sa gawaing iyon
  rationale: Natural na isinasalin ng “sa pangangalaga” ang idyomang בְּיַד sa kontekstong ito. Mahirap tiyakin ang eksaktong diwa ng עִתִּי; ang “nakatalaga” ay malinaw ngunit hindi itinatanggi ang posibleng diin sa pagiging handa o angkop.
- source_word: הַמִּדְבָּרָה
  choice: sa ilang
  rationale: Ipinahahayag ng “sa ilang” ang patungong direksiyon at ang biblikal na diwa ng lupaing ligaw at di-tinitirhan.
theological_decisions:
- issue: Pagpapanatili sa tatlong magkakaibang katawagan para sa kasalanan
  choice: mga kasamaan / mga pagsuway / mga kasalanan
  alternative: ulitin lamang ang “mga kasalanan” sa tatlong bahagi
  rationale: Sinasadya ng Hebreo ang tatlong magkakalapit ngunit magkakaibang salita upang idiin ang kabuuan ng pagkakasala ng Israel. Pinananatili ng salin ang retorikal at teolohikal na bigat na iyon.
- issue: Literal na pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili ang pormal na larawang pampamilya ng pinagmulan habang nililinaw sa talababa na kolektibong tumutukoy ito sa bayang Israel.
- issue: Sagisag na paglalagay ng mga kasalanan sa kambing
  choice: ilalagay niya ang mga iyon sa ulo ng kambing
  alternative: ipapasan niya sa kambing ang pananagutan
  rationale: Hindi pinalalawak ang teksto tungo sa isang tiyak na paliwanag sa mekanismo ng pagtubos; pinananatili ang konkretong ritwal na paglalarawan at ang teolohikal na tensiyon nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ilang” bilang pamilyar na katawagang biblikal, at inayos ang mga sugnay sa maiikling pangungusap upang maging malinaw nang hindi binabawasan ang ritwal at teolohikal na bigat ng talata.
