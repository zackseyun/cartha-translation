  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw ang “ipagtatapat niya sa ibabaw ng kambing” kaysa “sa ibabaw nito,” at ang “sa pamamagitan ng isang lalaking…” ay mas tuwirang Tagalog para sa ahensiyang ipinahahayag ng Hebreo.
  terminology: Ang “buhay na lalaking kambing,” “mga kasamaan / mga pagsuway / mga kasalanan,” “mga anak ni Israel,” at “ilang” ay angkop. Pinananatili ng talababa ang lehitimong kalabuan ng עִתִּי nang hindi ito dinodoktrinal na binibigyang-kahulugan.
  issues:
