    issue: Ang “sa pangangalaga ng isang lalaking nakatalaga” ay hindi sapat na tuwirang katumbas ng בְּיַד אִישׁ עִתִּי.
    rationale: Ang בְּיַד ay idyomang nagsasaad ng ahensiya o paraan (“sa pamamagitan ng / sa kamay ng”). Ang “sa pangangalaga” ay maaaring magpahiwatig lamang na nasa kustodiya ng lalaki ang kambing, samantalang ang teksto ay nagsasaad na ipinadala ito sa pamamagitan niya.
  - severity: low
