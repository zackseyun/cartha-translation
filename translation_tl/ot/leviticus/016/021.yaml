revisions:
- from: At ipapatong ni Aaron ang dalawa niyang kamay sa ulo ng buhay na lalaking kambing. Ipagtatapat niya sa ibabaw nito ang lahat ng kasamaan ng mga anak ni Israel[a]—ang lahat nilang pagsuway at ang lahat nilang kasalanan—at ilalagay niya ang mga iyon sa ulo ng kambing. Pagkatapos, ipapadala niya ito sa ilang sa pangangalaga ng isang lalaking nakatalaga sa gawaing iyon.[b]
  to: At ipapatong ni Aaron ang dalawang kamay niya sa ulo ng buhay na lalaking kambing, at ipagtatapat niya sa ibabaw ng kambing ang lahat ng mga kasamaan ng mga anak ni Israel[a], ang lahat nilang pagsuway, at ang lahat nilang kasalanan. Ilalagay niya ang mga ito sa ulo ng kambing at ipapadala ito sa ilang sa pamamagitan ng isang lalaking nakatalaga para rito.[b]
  rationale: Inayos ang pananalita para sa mas natural na modernong Tagalog at ibinalik ang instrumental na diwa ng “sa pamamagitan ng” para sa בְּיַד. Hindi binago ang kahulugan ng ritwal, ang tatlong magkakaibang termino para sa pagkakasala, o ang sinadyang kalabuan ng papel ng lalaking עִתִּי.
