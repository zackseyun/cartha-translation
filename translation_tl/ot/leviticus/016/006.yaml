base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: tl
  text: Ihaharap ni Aaron ang toro para sa sarili niyang handog para sa kasalanan[a], at magsasagawa siya ng pagtubos para sa kanyang sarili at sa kanyang sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog para sa kasalanan, na sa ilang konteksto ay nagbibigay-diin sa rituwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: Ihaharap
  rationale: Sa kontekstong panghandog, tumutukoy ang הקריב sa paglalapit o paghaharap ng handog. Pinananatili ng “ihaharap” ang rituwal na diwa nang hindi ipinapalagay na tapos na ang buong paghahandog.
- source_word: פַּר
  choice: ang toro
  rationale: Ang פַּר ay lalaking baka o toro; “toro” ang malinaw at karaniwang makabagong salin.
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa batas tungkol sa paghahandog, ang חַטָּאת ay tumutukoy sa handog, hindi lamang sa abstraktong kasalanan. Natural sa Filipino ang “handog para sa kasalanan,” samantalang inilalagay sa talababa ang posibleng diin sa rituwal na paglilinis.
- source_word: אֲשֶׁר לוֹ
  choice: na para sa kanya
  rationale: Ipinakikilala nito ang toro bilang handog na nakatalaga para kay Aaron, bilang kaibahan sa mga handog para sa bayan.
- source_word: וְכִפֶּר
  choice: at gagawa siya ng pagtubos
  rationale: Pinananatili ng “gagawa ng pagtubos” ang teknikal at teolohikal na puwersa ng כפר sa kontekstong pari at panghandog nang hindi labis na nililimitahan ang saklaw nito.
- source_word: בַּעֲדוֹ
  choice: para sa kanyang sarili
  rationale: Ang בְּעַד na may hulaping panghalip ay nagpapahayag ng pagkilos alang-alang sa isang tao; ito ang natural na anyo sa Filipino.
- source_word: וּבְעַד בֵּיתוֹ
  choice: at sa kanyang sambahayan
  rationale: Ang בַּיִת dito ay malamang na tumutukoy sa pamilya o sambahayan ni Aaron, hindi sa pisikal na bahay.
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Malinaw sa konteksto na isang uri ng handog ang tinutukoy. Pinananatili sa pangunahing teksto ang kinagisnan at madaling maunawaang termino, habang kinikilala sa talababa ang posibleng diin ng salita sa rituwal na paglilinis.
- issue: Saklaw ng בֵּיתוֹ
  choice: kanyang sambahayan
  alternative: kanyang bahay
  rationale: Sa kontekstong ito, tumutukoy ang salita sa pamilya o sambahayan ni Aaron at hindi lamang sa isang gusali.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pormal ngunit karaniwang bokabularyong panrituwal; iniwasan ang labis na teknikal o denominasyonal na pananalita.
