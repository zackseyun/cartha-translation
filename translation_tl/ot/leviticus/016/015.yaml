base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: tl
  text: Pagkatapos, kakatayin niya ang kambing na handog para sa kasalanan ng bayan. Dadalhin niya ang dugo nito sa dakong nasa loob ng tabing at gagawin sa dugo nito ang ginawa niya sa dugo ng toro. Iwiwisik niya ang dugo sa ibabaw ng pantakip ng pagtubos[a] at sa harap ng pantakip na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisyonal na salin: “luklukan ng awa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Pagkatapos, papatayin niya
  rationale: Ang pandiwa ay tumutukoy sa ritwal na pagkatay. Ipinahahayag ng “Pagkatapos” ang sunod-sunod na hakbang na ipinakikita ng waw, at ang aspektong panghinaharap ay angkop sa tagubiling legal.
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: ang kambing na handog para sa kasalanan ng bayan
  rationale: Malinaw nitong kinikilala ang kambing bilang hayop para sa handog ukol sa kasalanan at ipinakikitang ang handog ay para sa bayan, kaiba sa toro para kay Aaron.
- source_word: וְהֵבִיא אֶת־דָּמוֹ אֶל מִבֵּית לַפָּרֹכֶת
  choice: Dadalhin niya ang dugo nito sa loob ng tabing
  rationale: Ang hiphil ng בוא ay “dalhin,” at ang parirala ay tumutukoy sa dakong nasa kabila o loob ng tabing. Ang “sa loob ng tabing” ay likas at malinaw sa Filipino.
- source_word: וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: gagawin sa dugo nito ang ginawa niya sa dugo ng toro
  rationale: Pinananatili nito ang bahagyang eliptikong anyo ng Hebreo habang malinaw na ang kaparehong ritwal na ginawa sa dugo ng toro ang gagawin sa dugo ng kambing.
- source_word: וְהִזָּה אֹתוֹ
  choice: Iwiwisik niya ang dugo
  rationale: Ang נזה sa kontekstong pansakripisyo ay ritwal na pagwiwisik. Inulit ang “dugo” sa halip na gumamit ng malabong panghalip upang maging malinaw sa Filipino.
- source_word: עַל הַכַּפֹּרֶת
  choice: sa ibabaw ng pantakip ng pagtubos
  rationale: Ang כַּפֹּרֶת ay ang gintong takip ng kaban na mahalaga sa ritwal ng pagtubos. Ang salin ay kapuwa konkreto bilang pantakip at malinaw ang ugnayang pangritwal, nang hindi ginagawang pangunahing salin ang tradisyonal ngunit di-gaanong malinaw na “luklukan ng awa.”
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: at sa harap ng pantakip na iyon
  rationale: Pinananatili ng “sa harap” ang pagkakaibang panlunan mula sa naunang “sa ibabaw.” Ang “pantakip na iyon” ay likas na pag-uulit sa Filipino at may iisang tinutukoy.
theological_decisions:
- issue: Salin ng כַּפֹּרֶת
  choice: pantakip ng pagtubos
  alternative: luklukan ng awa
  rationale: Tumutukoy ang salita sa takip ng kaban sa ritwal ng Araw ng Pagtubos. Ipinakikita ng pangunahing salin ang pisikal na bagay at ang kaugnayan nito sa pagtubos, samantalang inilalagay sa talababa ang mahalagang tradisyonal na salin upang hindi ipasok bilang tanging pakahulugan ang mas huling teolohikal na katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang madaling masundan ang pagkakasunod-sunod ng ritwal, ngunit pinanatili ang terminolohiyang pansakripisyo at ang pagkakaiba ng “sa ibabaw” at “sa harap.”
