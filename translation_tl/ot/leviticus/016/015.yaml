  terminology: Ang 'pantakip ng pagtubos' ay isang katanggap-tanggap na makabagong salin ng כַּפֹּרֶת at pare-pareho ang pagtukoy sa dalawang paglitaw nito. Napananatili sa talababa ang tradisyonal na 'luklukan ng awa.'
