base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: tl
  text: Ang magsusunog sa mga iyon ay maglalaba ng kanyang mga damit at maliligo sa tubig.[a] Pagkatapos, maaari na siyang pumasok sa kampo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “huhugasan ang kanyang laman sa tubig.” Sa idyomang ito, ang “laman” ay tumutukoy sa buong katawan.'
    reason: lexical_alternative
  - marker: b
    text: O “pagkatapos ay papasok siya sa kampo.” Maaaring unawain ang pandiwang Hebreo bilang payak na hinaharap, ngunit sa kontekstong ito ay malamang na ipinahihiwatig nito ang pahintulot na muling pumasok matapos maglinis.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: Ang magsusunog
  rationale: Ang participle na may pantukoy ay tumutukoy sa taong magsasagawa ng pagsusunog. Likas sa Filipino ang anyong ito at napapanatili ang diwang tagubilin.
- source_word: אֹתָם
  choice: sa mga iyon
  rationale: Tumutukoy ito pabalik sa toro at kambing, o sa mga labi ng mga iyon, na binanggit sa naunang talata. Hindi nililinaw nang higit sa ipinahihiwatig ng Hebreo.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay maglalaba ng kanyang mga damit
  rationale: May preskriptibong puwersa ang imperfect sa batas-ritwal. Ang “maglalaba” ang likas na pandiwa sa Filipino para sa paghuhugas ng mga damit.
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ
  choice: at maliligo
  rationale: Literal na “huhugasan ang kanyang laman,” ngunit sa idyomang ito ang בשר ay tumutukoy sa katawan. Ang “maliligo” ay malinaw at likas, at naihihiwalay ang paghuhugas ng katawan sa paglalaba.
- source_word: בַּמָּיִם
  choice: sa tubig
  rationale: Likas na katumbas sa Filipino sa konteksto ng paliligo, habang pinananatili ang tahasang pagbanggit sa tubig.
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos
  rationale: Malinaw nitong ipinapakita ang pagkakasunod-sunod ng paglilinis at muling pagpasok.
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: maaari na siyang pumasok sa kampo
  rationale: Sa konteksto ng ritwal, ipinahihiwatig ng sugnay na pinahihintulutan ang muling pagpasok matapos ang kinakailangang paghuhugas. Ang “na” ay likas na nagpapakita na natupad na ang kundisyon.
theological_decisions:
- issue: Puwersang ritwal ng panghuling sugnay
  choice: “maaari na siyang pumasok sa kampo,” bilang pahintulot na muling pumasok matapos maglinis
  alternative: “papasok siya sa kampo,” bilang payak na hinaharap o tagubilin
  rationale: Ipinapakita ng konteksto na kailangang maghugas ang taong nagsunog bago muling pumasok. Ang permissive na salin ay mahusay na nagpapahayag sa lohika ng ritwal, ngunit inilalagay sa talababa ang mas payak na pagbasa ng pandiwang Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “maglalaba,” “maliligo,” at “pumasok sa kampo” bilang karaniwang mga salita, habang pinananatili ang preskriptibong tono at ang ritwal na pagkakasunod-sunod. Ang lahat ng talababa ay may katugmang marker sa pangunahing teksto.
