base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: tl
  text: Dadalhin ng kambing sa ibabaw nito ang lahat ng kanilang kasamaan patungo sa isang lupaing nakahiwalay[a], at ipapadala niya ang kambing sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang liblib na lupain,” “isang lupaing hindi mapuntahan,” o “isang tiwangwang na lupain.” Malamang na tumutukoy ang Hebreo sa isang lugar na hiwalay o malayo sa tinitirhan ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: Pasanin
  rationale: Ang נָשָׂא ay nangangahulugang magdala o pumasan. Pinananatili ng “pasanin” ang kongkretong larawan na ang kambing mismo ang nagdadala ng mga kasamaan.
- source_word: הַשָּׂעִיר
  choice: ang kambing
  rationale: Ang שָׂעִיר ay kambing, karaniwang lalaking kambing sa ganitong konteksto. Sapat at mas natural sa Tagalog ang “kambing,” yamang hindi mahalaga rito ang pagbanggit sa kasarian nito.
- source_word: עָלָיו
  choice: ipinahihiwatig sa pandiwang “pasanin”
  rationale: Ang literal na diwa ay “sa ibabaw nito.” Sa Tagalog, likas nang ipinahihiwatig ng “pasanin ng kambing” na nasa kambing ang pasanin, kaya hindi na kailangan ang mabigat na pariralang “sa ibabaw nito.”
- source_word: כָּל עֲוֺנֹתָם
  choice: lahat ng kanilang kasamaan
  rationale: Ang עָוֹן ay maaaring tumukoy sa kasamaan, sala, o kaakibat na pagkakasala. Ang “kasamaan” ay nagpapanatili ng bigat na moral at panritwal nang hindi ito nililimitahan sa isang makitid na pakahulugan.
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: patungo sa isang lupaing nakahiwalay
  rationale: Mahirap tiyakin ang eksaktong diwa ng גְּזֵרָה, ngunit sentral ang ideya ng pagkakahiwalay o pagkakabukod. Ang “lupaing nakahiwalay” ay malapit sa Hebreo at likas sa modernong Tagalog; inilalahad sa talababa ang ibang posibleng kahulugan.
- source_word: וְשִׁלַּח
  choice: at pakakawalan niya
  rationale: Sa kontekstong ito, ang שׁלח ay ang pagpapakawala o pagpapaalis sa kambing. Ang “pakakawalan” ay malinaw at natural sa Tagalog at angkop sa ginagawang ritwal.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay ilang, kaparangan, o disyerto. Ang “sa ilang” ay maikli, dignificado, at karaniwang salin sa ganitong konteksto.
theological_decisions:
- issue: Ang larawan ng kambing na pumapasan sa mga kasamaan ng bayan
  choice: Panatilihin ang kongkretong pahayag na pinapasan ng kambing ang lahat ng kanilang kasamaan.
  alternative: Gawing paliwanag ang teksto, gaya ng “aalisin ng kambing ang kanilang mga kasalanan.”
  rationale: Inilalarawan ng Hebreo ang panritwal na paglilipat at pag-aalis sa pamamagitan ng mismong pagpasan ng kambing. Hindi ito dapat palitan ng paliwanag na maaaring magpasok ng higit na teolohikal na interpretasyon kaysa sa tahasang sinasabi ng talata.
- issue: Ang kahulugan ng אֶרֶץ גְּזֵרָה
  choice: Isalin sa pangunahing teksto bilang “isang lupaing nakahiwalay.”
  alternative: “isang liblib na lupain,” “isang lupaing hindi mapuntahan,” o “isang tiwangwang na lupain.”
  rationale: Hindi ganap na tiyak ang parirala. Pinananatili ng “nakahiwalay” ang batayang larawan ng pagkakabukod, habang inilalagay sa talababa ang mga lehitimong alternatibo sa halip na tahimik na lutasin ang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pasanin” upang maging kongkreto at natural ang larawan; ginamit ang “lupaing nakahiwalay” upang mapanatili ang leksikal na kalabuan; at pinanatili ang “ilang” bilang maikli at pamilyar na katawagan sa wilderness.
