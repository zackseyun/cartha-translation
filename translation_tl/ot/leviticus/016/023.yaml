base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: tl
  text: Pagkatapos, papasok si Aaron sa Tolda ng Tipanan at huhubarin niya ang mga kasuotang lino na isinuot niya nang pumasok siya sa banal na dako[a]. Iiwan niya roon ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “santuwaryo.” Dahil sa mas malawak na konteksto ng Araw ng Pagtubos, may mga umuunawa rito bilang mas tiyak na pagtukoy sa “Kabanal-banalang Dako.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָא
  choice: Pagkatapos, papasok
  rationale: Ang waw na sinusundan ng qatal sa sunod-sunod na tagubiling panritwal ay may puwersang nagsasaad ng kasunod na hakbang. Natural sa makabagong Tagalog ang “Pagkatapos, papasok” at pinananatili nito ang diwa ng בוא.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ito ang likas at dignified na salin ng takdang katawagan para sa santuwaryong tolda kung saan nakikipagtagpo ang Diyos sa kanyang bayan; pinananatili rin nito ang ideya ng itinakdang pakikipagtagpo.
- source_word: וּפָשַׁט
  choice: huhubarin
  rationale: Karaniwang pandiwang Tagalog ito para sa pag-aalis ng kasuotan at malinaw na tumutugma sa kilos na iniuutos.
- source_word: בִּגְדֵי הַבָּד
  choice: mga kasuotang lino
  rationale: Ang “kasuotan” ay natural para sa בגד at malinaw na pinananatili ng “lino” ang materyal na בד, na mahalaga sa kontekstong panritwal.
- source_word: אֲשֶׁר לָבַשׁ
  choice: na isinuot niya
  rationale: Tumpak nitong ipinahahayag ang aktibong diwa ng לבש at malinaw na iniuugnay ang mga kasuotan sa naunang pagpasok ni Aaron.
- source_word: בְּבֹאוֹ
  choice: nang pumasok siya
  rationale: Ang infinitive construct na may בְּ ay temporal; ang “nang pumasok siya” ay natural na Tagalog at akma sa pagkilos papasok sa sagradong lugar.
- source_word: הַקֹּדֶשׁ
  choice: banal na dako
  rationale: Pinananatili nitong pangkalahatan ang literal na “banal [na lugar]” at hindi nito agad nililimitahan ang tinutukoy sa Kabanal-banalang Dako.
- source_word: וְהִנִּיחָם שָׁם
  choice: Iiwan niya roon ang mga iyon
  rationale: Malinaw at natural itong katumbas ng paglalagay o pag-iiwan sa mga kasuotan doon, nang hindi dinaragdagan ang paraan ng paglalapag.
theological_decisions:
- issue: Tinutukoy ng הַקֹּדֶשׁ
  choice: banal na dako
  alternative: santuwaryo; Kabanal-banalang Dako
  rationale: Ang Hebreo ay gumagamit lamang ng pangkalahatang katawagang “ang banal [na lugar].” Kaya hindi ginawang mas tiyak sa pangunahing teksto ang arkitektural na tinutukoy; inilalahad sa talababa ang mga posibleng pagbasa ayon sa mas malawak na konteksto ng Araw ng Pagtubos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang panghinaharap upang maipakita ang sunod-sunod na tagubiling panritwal. Pinanatili ang kalabuan ng הַקֹּדֶשׁ sa pangunahing teksto at ipinaliwanag ang mas tiyak na posibilidad sa talababa.
