source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Sabihin mo sa kapatid mong si Aaron na huwag siyang pumasok, kung kailan niya gusto, sa Banal na Lugar sa kabila ng tabing, sa harap ng takip ng pagtubos[a] na nasa ibabaw ng kaban, upang hindi siya mamatay; sapagkat magpapakita ako sa ulap sa ibabaw ng takip ng pagtubos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luklukan ng awa,” ang tradisyonal na salin ng “takip ng pagtubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: Sabihin mo sa kapatid mong si Aaron
  rationale: Likas sa modernong Filipino at malinaw na ipinahahayag ang utos kay Moises, habang pinananatili ang ugnayan ni Aaron kay Moises.
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: na huwag siyang pumasok anumang oras lamang
  rationale: Ang negatibong anyong pandiwa ay pagbabawal, at ang parirala ay tumutukoy sa pagpasok nang walang itinakdang panahon, hindi sa palagiang pagpasok.
- source_word: הַקֹּדֶשׁ
  choice: Banal na Lugar
  rationale: Sa konteksto, tumutukoy ito sa sagradong panloob na bahagi ng santuwaryo; malinaw at pamilyar ang katawagang ito.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: sa kabila ng tabing
  rationale: Ipinakikita nito ang puwesto sa panloob na panig ng tabing mula sa pananaw ng pumapasok.
- source_word: הַכַּפֹּרֶת
  choice: takip ng pagtubos
  rationale: Pinananatili nito kapwa ang pagiging konkretong takip ng kaban at ang kaugnayan nito sa ritwal ng pagtubos.
- source_word: הָאָרֹן
  choice: kaban
  rationale: Payak na 'kaban' ang nasa Hebreo, kaya hindi idinagdag ang 'ng tipan.'
- source_word: וְלֹא יָמוּת
  choice: upang hindi siya mamatay
  rationale: Malinaw na ipinahahayag ang kamatayang bunga na nilalayong maiwasan.
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: sapagkat magpapakita ako sa ulap
  rationale: Pinananatili ang dahilan ng pagbabawal at ang likas na ambiguity kung ang ulap ay tanda o lugar ng pagpapakita.
theological_decisions:
- issue: Kahulugan ng כַּפֹּרֶת sa teolohiya ng tabernakulo
  choice: takip ng pagtubos
  alternative: luklukan ng awa
  rationale: Ang salita ay tumutukoy sa konkretong takip ng kaban na kaugnay ng mga ritwal ng pagtubos. Mas malinaw ito sa karaniwang mambabasa, habang inilalagay sa talababa ang tradisyonal na katawagan.
- issue: Diwa ng בְּכָל עֵת
  choice: anumang oras lamang, bilang pagbabawal sa di-itinakdang pagpasok
  alternative: sa lahat ng oras
  rationale: Sa konteksto, hindi ipinahihiwatig na palaging pumapasok si Aaron; ipinagbabawal ang pagpasok kung kailan lamang niya nais, bukod sa itinakdang pagkakataon.
- issue: Kaugnayan ng ulap sa pagpapakita ni Yahweh
  choice: magpapakita ako sa ulap sa ibabaw ng takip
  alternative: makikita ako sa ulap
  rationale: Ang Niphal אֵרָאֶה ay maaaring ipahayag bilang 'magpapakita ako.' Hindi tinukoy nang higit sa Hebreo ang kalikasan ng pagpapakitang ito, kaya hindi ito pinalawak.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'tabing,' 'kaban,' at 'takip ng pagtubos' bilang malinaw na bokabularyong panritwal; iniwasan ang arkaikong ayos at hindi nagdagdag ng denominasyonal na paliwanag.
