- from: Sinabi ni Yahweh kay Moises, “Sabihin mo sa kapatid mong si Aaron na huwag siyang pumasok anumang oras lamang sa Banal na Lugar sa kabila ng tabing, sa harap ng takip ng pagtubos[a] na nasa ibabaw ng kaban, upang hindi siya mamatay; sapagkat magpapakita ako sa ulap sa ibabaw ng takip ng pagtubos.”
  to: Sinabi ni Yahweh kay Moises, “Sabihin mo sa kapatid mong si Aaron na huwag siyang pumasok, kung kailan niya gusto, sa Banal na Lugar sa kabila ng tabing, sa harap ng takip ng pagtubos[a] na nasa ibabaw ng kaban, upang hindi siya mamatay; sapagkat magpapakita ako sa ulap sa ibabaw ng takip ng pagtubos.”
  rationale: Pinalitan ang “anumang oras lamang” ng “kung kailan niya gusto” upang idiomatikong maipahayag ang pagbabawal sa walang-paghihigpit na pagpasok. Hindi binago ang natitirang nilalaman, mga pangunahing katawagang panritwal, o ang saklaw ng pagpapakita ni Yahweh sa ulap.
