id: LEV.16.1
reference: Leviticus 16:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: tl
  text: Nagsalita si Yahweh kay Moises pagkamatay ng dalawang anak ni Aaron, nang lumapit sila sa harapan ni Yahweh at namatay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Likas na salin ng karaniwang pormula ng pagsasalita ng Diyos at pinananatili ang aspektong pasalita ng דּבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa modernong Tagalog ang personal na pangalang banal na nakasulat sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אַחֲרֵי מוֹת
  choice: pagkamatay
  rationale: Natural at maikli itong katumbas ng pariralang nangangahulugang “pagkatapos ng pagkamatay,” na tumutukoy sa iisang pangyayaring ikinamatay ng dalawa.
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: dalawang anak ni Aaron
  rationale: Pinananatili ang bilang at ugnayang pampamilya sa natural na ayos ng Tagalog.
- source_word: בְּקָרְבָתָם
  choice: nang lumapit sila
  rationale: Ang ב na may infinitive construct at hulaping pangmaramihan ay temporal; malinaw itong naihahayag ng “nang,” habang pinananatili ng “lumapit” ang posibleng kultikong diwa ng קרב.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat at malinaw na salin na maaaring tumukoy kapwa sa lokasyon at sa presensiyang kultiko.
- source_word: וַיָּמֻתוּ
  choice: at namatay
  rationale: Pinananatili ang payak at mariing pagpapatuloy ng salaysay sa Hebreo nang hindi tahasang ginagawang sanhi ang kanilang paglapit.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay higit na tuwirang kumakatawan rito kaysa sa pagpapalit nito ng titulong “PANGINOON.”
- issue: Ugnayan ng paglapit at pagkamatay
  choice: “nang lumapit sila … at namatay”
  alternative: “dahil lumapit sila … kaya namatay”
  rationale: Temporal ang tahasang anyo ng בְּקָרְבָתָם, at ang kasunod na וַיָּמֻתוּ ay simpleng pagpapatuloy. Hindi dinaragdagan ng salin ang tekstong ito ng tahasang ugnayang sanhi at bunga.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Nagsalita” para sa pormal na pambungad ng banal na pahayag, at “sa harap ni Yahweh” upang mapanatili ang maikli at bahagyang kultikong pahayag ng Hebreo. Walang talababa sapagkat malinaw na naipapaloob sa pangunahing teksto ang tunay na temporal na pagbasa nang hindi inaalis ang konteksto ng paglapit sa banal na presensiya.
