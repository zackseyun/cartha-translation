language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: tl
  text: Sa ganitong paraan, magsasagawa siya ng pagbabayad-sala[a] para sa Banal na Santuwaryo, sa Tolda ng Tagpuan, at sa altar; magsasagawa rin siya ng pagbabayad-sala para sa mga pari at sa lahat ng taong bumubuo sa kapulungan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magsasagawa ng pagpapawalang-singaw ng karumihan.” Sa kontekstong ito, maaaring bigyang-diin ng pandiwang Hebreo ang pag-aalis ng ritwal na karumihan, gayundin ang pagbabayad-sala.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang “lahat ng taong bumubuo sa kapulungan” na “lahat ng bayan ng kapulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר / יְכַפֵּר
  choice: gagawa ng pagtubos
  rationale: Pinananatili nito ang teknikal na diwa ng כפר sa ritwal nang hindi ito nililimitahan sa isang partikular na teorya ng pagtubos. Ang anyong may pangngalan ay maaari ring ilapat sa mga banal na lugar at sa mga tao.
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: Banal na Santuwaryo
  rationale: Tapat ito sa pagsasama ng 'santuwaryo' at 'banal' nang hindi tahasang tinutukoy bilang Kabanal-banalang Lugar, na hindi kinakailangang ipinahihiwatig ng parirala rito.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tagpuan
  rationale: Pinananatili nito ang larawan ng tolda at ang tungkulin nito bilang itinakdang lugar ng pakikipagtagpo, nang hindi idinaragdag ang ideya ng tipan sa mismong pangalan.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Ito ang natural at karaniwang katawagang Filipino para sa kagamitang pinaghahandugan.
- source_word: עַל
  choice: para sa
  rationale: Sa kaugnayan nito sa כפר, natural na ipinahahayag ng 'para sa' ang mga banal na bagay at taong saklaw ng pagtubos.
- source_word: הַכֹּהֲנִים
  choice: mga pari
  rationale: Ito ang malinaw at karaniwang salin ng pangmaramihang katawagan.
- source_word: כָּל עַם הַקָּהָל
  choice: buong sambayanang nagkakatipon
  rationale: Ipinahahayag nito kapwa ang buong bayan at ang kanilang pagkakakilanlan bilang nagkakatipong kapulungan, sa natural na modernong Filipino.
theological_decisions:
- issue: Ang כפר ay ginagamit kapwa para sa mga banal na bagay at para sa mga tao.
  choice: Gamitin ang iisang pananalitang 'gagawa ng pagtubos' para sa santuwaryo, tolda, altar, mga pari, at sambayanan.
  alternative: Gamitin ang 'lilinisin' para sa mga banal na lugar at 'gagawa ng pagtubos' para sa mga tao.
  rationale: Pinagbubuklod ng Hebreo ang lahat ng layon sa pamamagitan ng iisang ritwal na pandiwa. Pinananatili ng pare-parehong salin ang pagkakaisang ito at hindi tahasang nilulutas kung paglilinis, pagpapatawad, o kapwa ang pangunahing diin sa bawat layon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'sambayanan' upang mapanatili ang kolektibong diwa ng עַם, at iniwasan ang 'Toldang Tipanan' dahil 'tipan' ay hindi tahasang nasa אֹהֶל מוֹעֵד. Inilagay ang mga panandang [a] at [b] sa mismong mga pariralang tinatalakay ng mga talababa.
