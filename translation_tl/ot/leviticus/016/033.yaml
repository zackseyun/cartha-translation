revisions:
- from: Sa gayon, gagawa siya ng pagtubos[a] para sa Banal na Santuwaryo, sa Toldang Tagpuan, at sa altar; at gagawa siya ng pagtubos para sa mga pari at sa buong sambayanang nagkakatipon[b].
  to: Sa ganitong paraan, magsasagawa siya ng pagbabayad-sala[a] para sa Banal na Santuwaryo, sa Tolda ng Tagpuan, at sa altar; magsasagawa rin siya ng pagbabayad-sala para sa mga pari at sa lahat ng taong bumubuo sa kapulungan[b].
  rationale: Inayos ang pangunahing katawagan para sa כפר at ang mga pariralang Filipino na hindi gaanong natural, habang pinanatili ang paulit-ulit na iisang pandiwa sa lahat ng layon. Hindi tinukoy nang mas makitid ang saklaw ng ritwal na kilos para sa mga banal na bagay o para sa mga tao.
