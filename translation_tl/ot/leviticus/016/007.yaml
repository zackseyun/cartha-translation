  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: tl
  text: At kukunin niya ang dalawang lalaking kambing at ihaharap niya ang mga ito sa harap ni Yahweh, sa pasukan ng tolda ng pagpupulong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: At kukunin niya
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubiling panritwal ay likas na naipapahayag sa Filipino sa panghinaharap na “kukunin niya,” habang pinananatili ng “At” ang pagkakaugnay sa naunang hakbang.
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: ang dalawang lalaking kambing
  rationale: Ang שָׂעִיר ay tumutukoy sa kambing at karaniwang sa lalaking kambing; malinaw at natural sa Filipino ang tahasang pagtukoy sa kasarian dito.
- source_word: וְהֶעֱמִיד אֹתָם
  choice: at ihaharap ang mga ito
  rationale: Ang Hiphil ng עמד ay literal na “patatayuin” o “ilalagay,” ngunit sa kontekstong panritwal ay natural na ipinahahayag ng “ihaharap” ang paglalagay sa presensiya ni Yahweh nang hindi ipinapalagay na handog na agad ang mga kambing.
- source_word: לִפְנֵי יְהוָה
  choice: kay Yahweh
  rationale: Ang לִפְנֵי ay nangangahulugang nasa harapan o presensiya ng isang persona. Kasama ng “ihaharap,” idiomatiko sa Filipino ang “kay Yahweh,” at pinananatili ang pangalang tipan na יְהוָה bilang “Yahweh.”
- source_word: פֶּתַח
  choice: sa pasukan ng
  rationale: Tumutukoy ang פֶּתַח sa bukana o pasukan; ang “sa pasukan ng” ang pinakanatural na paglalarawan ng lokasyon sa modernong Filipino.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa itinakdang pakikipagtagpo o pagtitipon. Ang nakaugaliang “toldang tipanan” ay maikli, marangal, at malinaw bilang katawagan sa santuwaryo, bagaman maaari ring isalin na “tolda ng pakikipagtagpo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: toldang tipanan
  alternative: tolda ng pakikipagtagpo; tolda ng pagpupulong
  rationale: May lawak ng kahulugan ang מוֹעֵד na sumasaklaw sa itinakdang panahon o lugar ng pakikipagtagpo. Ang “toldang tipanan” ay isang likas at nakikilalang katawagan sa Filipino, ngunit hindi nito nilalayong alisin ang diwa ng pakikipagtagpo na nasa alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang tuwirang pangalang “Yahweh,” ang konkretong “dalawang lalaking kambing,” at ang natural na panritwal na pandiwang “ihaharap.”
