base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: tl
  text: 'Ito ay magiging tuntuning panghabang-panahon para sa inyo: sa ikapitong buwan, sa ikasampung araw ng buwan, magpakumbaba kayo[a] at huwag kayong gumawa ng anumang gawain, kayo man ay katutubo o dayuhang naninirahan sa gitna ninyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “pahirapan ninyo ang inyong sarili.” Tradisyonal na nauunawaan ang pananalitang ito na kabilang ang pag-aayuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Ito ay magiging
  rationale: Ang pormulang legal na may היה ay nagtatakda sa naunang tagubilin bilang umiiral na tuntunin; malinaw na tumutukoy ang “ito” sa naunang batas.
- source_word: לְחֻקַּת עוֹלָם
  choice: panghabang-panahong tuntunin
  rationale: Ipinapahayag ng חֻקָּה ang isang itinakdang batas o tuntunin, at ng עוֹלָם ang patuloy o walang-takdang bisa nito sa balangkas ng tipan. Pinananatili ng salin ang matibay na pahayag tungkol sa tagal nang hindi ito nilalagyan ng paliwanag na teolohikal.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: sa ikasampung araw ng ikapitong buwan
  rationale: Likas sa modernong Tagalog ang ayos na ito para sa petsa at tumpak nitong ipinapahayag ang literal na “sa ikasampu ng buwan” sa loob ng ikapitong buwan.
- source_word: תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם
  choice: magpakumbaba kayo
  rationale: Ang Piel ng ענה kasama ng נֶפֶשׁ ay tumutukoy sa pagpapakumbaba o pagkakait sa sarili. Ang “magpakumbaba kayo” ay nagpapanatili sa malawak na diwa ng idyoma at hindi ito nililimitahan sa pag-aayuno lamang.
- source_word: וְכָל־מְלָאכָה לֹא תַעֲשׂוּ
  choice: at huwag gumawa ng anumang gawain
  rationale: Ang מְלָאכָה ay gawain o paggawa. Ang pariralang ito ay malinaw at natural na pagbabawal sa Tagalog.
- source_word: הָאֶזְרָח
  choice: ang katutubo
  rationale: Ang אֶזְרָח ay isang likas o katutubong kasapi ng pamayanan, na ikinukumpara sa residenteng dayuhan.
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: ang dayuhang naninirahan sa gitna ninyo
  rationale: Ang גֵּר ay isang dayuhang nakatira sa loob ng pamayanan. Ipinahihiwatig ng “naninirahan” ang matatag na paninirahan at sinasalamin ang kaugnay na pandiwang הַגָּר nang hindi nagiging mabigat ang pag-uulit sa Tagalog.
theological_decisions:
- issue: Saklaw ng utos na תְּעַנּוּ אֶת־נַפְשֹׁתֵיכֶם sa Araw ng Pagtubos
  choice: magpakumbaba kayo
  alternative: pahirapan ninyo ang inyong sarili; magkait kayo sa inyong sarili; mag-ayuno kayo
  rationale: Mas malawak ang idyomang Hebreo kaysa sa isang tiyak na gawaing ritwal. Karaniwang nauugnay rito ang pag-aayuno, ngunit hindi iyon tahasang binanggit ng talata; kaya pinananatili sa pangunahing teksto ang mas malawak na diwa at inilalagay sa talababa ang mas literal at tradisyonal na pagpapakahulugan.
- issue: Tagal ng tuntunin sa pariralang חֻקַּת עוֹלָם
  choice: panghabang-panahong tuntunin
  alternative: palagiang tuntunin; walang-hanggang tuntunin
  rationale: Pinananatili ng salin ang hayag na puwersa ng עוֹלָם nang hindi nagpapasya sa pangunahing teksto kung paano nauugnay ang bisa nito sa mga susunod na yugto ng kasaysayan ng tipan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “katutubo” at “dayuhang naninirahan” upang maging malinaw ang legal na pagkakaiba nang hindi gumagamit ng mga salitang may di-kinakailangang makabagong pampolitikang pahiwatig. Inilipat ang talababa sa pariralang “magpakumbaba kayo,” na siyang aktuwal na tinutukoy nito.
