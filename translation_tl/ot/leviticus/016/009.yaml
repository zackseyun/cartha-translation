  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: tl
  text: Pagkatapos, ihaharap ni Aaron ang kambing na natapatan ng palabunot para kay Yahweh, at gagawin niya itong handog para sa kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: ihaharap
  rationale: Sa kontekstong panghain, tumutukoy ang hiphil ng קרב sa paglalapit o paghaharap ng hayop para sa ritwal. Likas sa Filipino ang “ihaharap” at hindi nito inuuna ang mismong paghahandog na binabanggit sa hulihan ng sugnay.
- source_word: הַשָּׂעִיר
  choice: ang kambing
  rationale: Ang שׂעיר ay kambing, karaniwang lalaking kambing sa ganitong batas. Sapat at mas natural dito ang “kambing,” yamang malinaw na sa konteksto ang uri ng hayop.
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: na natapatan ng palabunutan
  rationale: Ipinapahayag nito sa likas na Filipino ang idyomang ang kapalaran o takdang tanda sa palabunutan ay napunta sa kambing, habang pinananatili ang diwa ng ritwal na pagtatalaga.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: 'Ang לְ ay nagmamarka ng pagtatalaga: ang kambing ay itinakda “para kay Yahweh.” Ginamit ang pangalang Yahweh upang tuwirang katawanin ang יהוה.'
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: at gagawin niya itong handog para sa kasalanan
  rationale: Sa mga batas tungkol sa paghahandog, ang חטאת ay pangalan ng isang uri ng handog. Ang “handog para sa kasalanan” ay malinaw, dignified, at malapit sa konstruksyong Hebreo nang hindi isinasalin na ang kambing mismo ay literal na “kasalanan.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan at umaayon sa ibinigay na konsultasyong teksto, nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng חטאת sa kontekstong panghain
  choice: handog para sa kasalanan
  alternative: handog na panlinis / kasalanan
  rationale: Karaniwang katawagan ang חטאת para sa takdang handog sa batas Levitico. Pinananatili ng napiling salin ang tradisyonal at madaling maunawaang ugnay nito sa kasalanan; hindi nito ipinapasok sa pangunahing teksto ang pinagtatalunang diin ng saling “handog na panlinis.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “palabunutan” para sa ritwal na pagtatakda sa pamamagitan ng sapalaran, at iniwasan ang sobrang teknikal o makalumang pananalita.
