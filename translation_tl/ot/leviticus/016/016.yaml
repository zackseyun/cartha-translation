id: LEV.16.16
reference: Leviticus 16:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר עַל הַ/קֹּ֗דֶשׁ מִ/טֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/מִ/פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/כֵ֤ן יַעֲשֶׂה֙ לְ/אֹ֣הֶל מוֹעֵ֔ד הַ/שֹּׁכֵ֣ן אִתָּ֔/ם בְּ/ת֖וֹךְ טֻמְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/016.yaml
  text: Thus he shall make atonement for the sanctuary because of the uncleannesses of the sons of Israel and because of their transgressions[a], for all their sins[c][b]; and so he shall do for the tent of meeting that dwells with them in the midst of their uncleannesses.
translation:
  language: tl
  text: Sa gayon, gagawa siya ng pagbabayad-sala[a] para sa santuwaryo[b] dahil sa mga karumihan ng mga anak ng Israel[c] at dahil sa kanilang mga pagsuway, na siyang lahat nilang mga kasalanan. Ganoon din ang gagawin niya para sa Tolda ng Pagtitipon, na nananatili sa piling nila sa gitna ng kanilang mga karumihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “gagawa ng pagbabayad-sala” ay maaari ring isaling “lilinisin” o “aalisin ang karumihan.” Sa ritwal ng Araw ng Pagtubos, kapwa karumihan at kasalanan ang tinutugunan.
    reason: lexical_alternative
  - marker: b
    text: O “banal na dako.” Sa kontekstong ito, ang Hebreong הַקֹּדֶשׁ ay maaaring tumukoy sa santuwaryo o sa banal na lugar.
    reason: lexical_alternative
  - marker: c
    text: O “mga Israelita.” Ang “mga anak ng Israel” ay kolektibong katawagan sa bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: magsasagawa siya ng pagtubos
  rationale: Sa konteksto ng mga ritwal sa Levitico, ang כפר ay tumutukoy sa gawaing ritwal na tumutugon kapwa sa karumihan at kasalanan. Pinananatili ng “pagtubos” ang malawak na bigat ng terminong panritwal, samantalang ipinapaliwanag sa talababa na kasama rito ang paglilinis o pag-aalis ng karumihan.
- source_word: עַל הַקֹּדֶשׁ
  choice: para sa santuwaryo
  rationale: Ang הַקֹּדֶשׁ dito ay tumutukoy sa banal na dako o santuwaryo bilang lugar ng ritwal, hindi sa abstraktong kabanalan. Ang “santuwaryo” ay malinaw at likas sa modernong Filipino.
- source_word: מִטֻּמְאֹת
  choice: dahil sa mga karumihan
  rationale: Ipinahihiwatig ng מִן ang sanhi o suliraning pinagtutuunan ng ritwal. Pinananatili ng “mga karumihan” ang maramihang anyo at ang panritwal na kategorya ng Hebreo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Malapit ito sa pormal na anyo ng Hebreo at nauunawaan bilang katawagang pangkalipunan sa bayang Israel. Ibinibigay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: וּמִפִּשְׁעֵיהֶם
  choice: at dahil sa kanilang mga pagsuway
  rationale: Ang פשע ay maaaring magpahiwatig ng paglabag o paghihimagsik. Ang “mga pagsuway” ay natural sa Filipino at pinananatili ang moral na bigat nang hindi ipinapalagay na bawat kaso ay hayagang paghihimagsik.
- source_word: לְכָל חַטֹּאתָם
  choice: sa lahat ng kanilang mga kasalanan
  rationale: Sa pagkakapantay nito sa mga karumihan at pagsuway, ang חטאות ay pinakamalamang na tumutukoy sa mga kasalanan, hindi sa mga handog para sa kasalanan.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Ganoon din ang gagawin niya
  rationale: Malinaw nitong ipinahahayag na ang katumbas na gawaing ritwal ay isasagawa rin para sa susunod na banal na lugar.
- source_word: לְאֹהֶל מוֹעֵד
  choice: para sa Tolda ng Pagtitipon
  rationale: Tuwirang inilalahad nito ang אֹהֶל bilang tolda at מוֹעֵד bilang itinakdang pagtitipon o pakikipagtagpo, nang hindi umaasa sa mas di-malinaw na tradisyonal na katawagang “tabernakulo.”
- source_word: הַשֹּׁכֵן אִתָּם
  choice: na nananahang kasama nila
  rationale: Pinananatili nito ang participial na larawan ng toldang nananatili o nananahan kasama ng Israel, kahit pambihira ang personipikasyong ito sa Filipino.
- source_word: בְּתוֹךְ טֻמְאֹתָם
  choice: sa gitna ng kanilang mga karumihan
  rationale: 'Pinananatili ang metaporang panlunan at ang maramihang anyo: naroroon ang banal na tolda sa gitna ng bayang may mga karumihang panritwal.'
theological_decisions:
- issue: Kahulugan ng כפר sa konteksto ng Araw ng Pagtubos
  choice: “magsasagawa ng pagtubos” bilang pangunahing salin
  alternative: “lilinisin” o “aalisin ang karumihan”
  rationale: Ang ritwal ay tumutugon kapwa sa karumihan at sa kasalanan kaugnay ng santuwaryo. Hindi nililimitahan ng “pagtubos” ang kahulugan sa paglilinis lamang, ngunit kinikilala sa talababa ang mahalagang aspektong iyon.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: “mga anak ng Israel” bilang kolektibong katawagan
  alternative: “mga Israelita” o “bayan ng Israel”
  rationale: Pinananatili ng pangunahing teksto ang anyo ng Hebreo nang hindi ipinahihiwatig na mga lalaking anak lamang ang tinutukoy; ang parirala ay kolektibong pangalan ng bayang Israel.
- issue: Ang nananahan sa הַשֹּׁכֵן אִתָּם
  choice: Panatilihing ang Tolda ng Pagtitipon ang tuwirang simuno ng “nananahan”
  alternative: Ipaliwanag na ang Diyos ang nananahan sa gitna nila
  rationale: Sa gramatika ng talata, ang participle ay tahasang naglalarawan sa tolda. Ang pagpapalit ng simuno sa Diyos ay teolohikal na posible bilang pagpapakahulugan ngunit hindi dapat tahimik na ipasok sa salin.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “santuwaryo” at “Tolda ng Pagtitipon” bilang malinaw na mga terminong panritwal. Pinanatili ang pambihirang larawan na ang tolda ay “nananahang kasama nila,” sa halip na lutasin ito sa pamamagitan ng pagdaragdag na ang Diyos ang nananahan doon. Ang gitling bago ang “sa lahat ng kanilang mga kasalanan” ay nagpapakitang nililinaw o binubuod ng parirala ang saklaw ng mga pagsuway.
