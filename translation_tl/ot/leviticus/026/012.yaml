  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: tl
  text: Lalakad ako sa gitna ninyo[a] at ako ang magiging Diyos ninyo, at kayo ang magiging bayan ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Lalakad ako sa kalagitnaan ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: Lalakad ako
  rationale: Pinananatili ng “lalakad” ang kongkretong larawan ng pagkilos at presensiya ng Diyos sa piling ng bayan; ang “mananahan” ay magdaragdag ng kahulugang hindi tahasang nasa pandiwa.
- source_word: בְּתוֹכְכֶם
  choice: sa gitna ninyo
  rationale: Tumpak at natural itong katumbas ng pariralang tumutukoy sa presensiya sa kalagitnaan ng buong pamayanan, hindi sa panloob na pagkatao ng bawat isa.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: at ako ang magiging Diyos ninyo
  rationale: Natural na Filipino ito para sa pormulang tipan at malinaw na pinananatili ang ugnayang ipinahahayag ng Hebrew na היה + ל.
- source_word: לֵאלֹהִים
  choice: Diyos
  rationale: Sa konteksto ng tipan ng Israel, tumutukoy ito sa Diyos na nakikipagtipan, hindi sa isang di-tiyak na diyos.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: at kayo ang magiging bayan ko
  rationale: Pinananatili nito ang katumbasang relasyonal ng pormulang tipan sa natural at marangal na modernong Filipino.
theological_decisions:
- issue: Pagkakasalin ng pormulang tipan
  choice: ako ang magiging Diyos ninyo, at kayo ang magiging bayan ko
  alternative: ako ay magiging Diyos para sa inyo, at kayo ay magiging isang bayan para sa akin
  rationale: Ipinapahayag ng piniling salin ang magkatugong ugnayan ng tipan nang malinaw at natural, nang walang idinaragdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “sa gitna ninyo” upang mapanatili ang kongkretong larawan ng presensiya ng Diyos sa pamayanan.
