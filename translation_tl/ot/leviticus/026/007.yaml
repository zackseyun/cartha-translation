  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: tl
  text: Tutugisin ninyo ang inyong mga kaaway, at mabubuwal sila sa harap ninyo sa pamamagitan ng tabak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mabubuwal sila sa harap ninyo tungo sa tabak.” Ang Hebreong pananalita ay maaaring isalin sa higit sa isang paraang idyomatiko.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: Tutuparin ninyo
  rationale: Ang רדף ay nangangahulugang humabol o tumugis. Ang “tutuparin” ay likas at marangal na Filipino at angkop sa kontekstong militar.
- source_word: אֹיְבֵיכֶם
  choice: ang inyong mga kaaway
  rationale: Ang אֹיֵב ang karaniwang katawagan sa kaaway, at tuwirang isinasaad ng hulaping panghalip ang “inyong.”
- source_word: וְנָפְלוּ
  choice: at mabubuwal sila
  rationale: Ang נפל ay literal na “mahulog” o “mabuwal.” Sa labanan, pinananatili ng “mabubuwal” ang larawan ng pagkatalo o pagkamatay nang hindi ito labis na ipinapaliwanag.
- source_word: לִפְנֵיכֶם
  choice: sa harap ninyo
  rationale: Ang לִפְנֵי na may hulaping panghalip ay idyomatikong “sa harap ninyo” o “sa inyong harapan.”
- source_word: לֶחָרֶב
  choice: sa tabak
  rationale: Ang לְ na kasama ng חֶרֶב ay maaaring magpahiwatig ng kasangkapan o kinahinatnan. Ang “sa tabak” ay maikli at pinananatili ang bahagyang pagiging bukás ng Hebreong parirala.
