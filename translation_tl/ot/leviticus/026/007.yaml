translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo/inyong” bilang pangmaramihang ikalawang panauhan at ang “tabak” para sa tradisyonal ngunit nauunawaang katawagan sa sandatang חֶרֶב.
