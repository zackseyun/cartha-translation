- from: At ibibigay ko sa inyo ang mga ulan sa kani-kanilang takdang panahon[a]; magbibigay ang lupain ng ani nito, at ang punongkahoy sa bukid[b] ay magbibigay ng bunga nito.
  to: At ibibigay ko sa inyo ang mga ulan sa takdang panahon[a]; magbibigay ang lupain ng ani nito, at ang punongkahoy sa bukid[b] ay magbibigay ng bunga nito.
  rationale: Pinalitan ang di-likas na "sa kani-kanilang takdang panahon" ng idiomatikong "sa takdang panahon," nang hindi binabago ang diwa ng napapanahong ulan. Nilinaw ang talababa tungkol sa isahang anyo na may kolektibong gamit.
