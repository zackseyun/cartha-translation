  text: וְ/נָתַתִּ֥י גִשְׁמֵי/כֶ֖ם בְּ/עִתָּ֑/ם וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ יְבוּלָ֔/הּ וְ/עֵ֥ץ הַ/שָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: tl
  text: At ibibigay ko sa inyo ang mga ulan sa takdang panahon[a]; magbibigay ang lupain ng ani nito, at ang punongkahoy sa bukid[b] ay magbibigay ng bunga nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tamang panahon” o “sa kaukulang panahon.”
    reason: lexical_alternative
  - marker: b
    text: Isahan sa Hebreo ang “punongkahoy sa bukid,” ngunit kolektibo ang diwa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: At ibibigay ko
  rationale: Pinananatili ang karaniwang kahulugan ng נתן na “magbigay” at ang pang-ugnay na וְ bilang pagpapatuloy ng pangako sa naunang talata.
- source_word: גִשְׁמֵיכֶם
  choice: sa inyo ang mga ulan
  rationale: Ang maramihang “mga ulan” ay sumasalamin sa anyong plural ng Hebreo at tumutukoy sa pana-panahong mga pag-ulan na ipinagkakaloob para sa Israel.
- source_word: בְּעִתָּם
  choice: sa kani-kanilang takdang panahon
  rationale: Ipinahahayag nito ang angkop na tiyempo ng mga pag-ulan at pinananatili ang maramihang pagtukoy ng hulaping Hebreo.
- source_word: וְנָתְנָה הָאָרֶץ
  choice: magbibigay ang lupain
  rationale: Pinananatili ang pag-uulit ng pandiwang נתן (“magbigay”) habang natural pa rin sa Filipino ang larawan ng lupaing nagbibigay ng ani.
- source_word: יְבוּלָהּ
  choice: ng ani nito
  rationale: Ang “ani” ay malinaw at likas na salin ng bunga o produktong agrikultural ng lupain sa kontekstong ito.
- source_word: וְעֵץ הַשָּׂדֶה
  choice: at ang punongkahoy sa bukid
  rationale: Pinananatili ang anyong isahan ng Hebreo bilang pangkalahatan o kolektibong pagtukoy sa mga punong tumutubo sa bukid.
- source_word: יִתֵּן פִּרְיוֹ
  choice: ay magbibigay ng bunga nito
  rationale: Pinananatili ang ikalawang paggamit ng נתן at ang panghalip na isahan na tumutugma sa “punongkahoy.”
theological_decisions:
- issue: Pagpapalang pangtipan na inilalarawan bilang ulan at kasaganaan ng lupain
  choice: Tuwirang isinalin bilang pangako ng Diyos na magbigay ng napapanahong ulan, ani, at bunga.
  alternative: Ituring itong pangkalahatang pangako ng materyal na kasaganaan sa lahat ng panahon, o gawing sagisag lamang ng espirituwal na pagpapala.
  rationale: Ang agarang konteksto ay kongkretong pagpapalang agrikultural sa loob ng tipan. Hindi dapat dagdagan ng salin ang isang mas malawak o eksklusibong espirituwal na aplikasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “punongkahoy” upang maipahayag ang anyong isahan at kolektibong diwa ng Hebreo; iniwasan ang mas doktrinal o matalinghagang pagpapalawak sa kongkretong pangakong agrikultural.
