reference: Leviticus 26:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: tl
  text: At magbibigay ako ng kapayapaan sa lupain, at hihiga kayo nang walang magdudulot ng takot sa inyo. Aalisin ko sa lupain ang mapanganib na mga hayop[a], at hindi daraan sa inyong lupain ang tabak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mababangis na hayop.” Ang pariralang Hebreo ay tumutukoy sa mga hayop na mapanganib o nakapipinsala.
    reason: lexical_alternative
  - marker: b
    text: Ang “tabak” ay larawang Hebreo para sa digmaan o armadong pagsalakay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: At bibigyan ko
  rationale: Tuwirang ipinapahayag ng נָתַן ang pagbibigay ng Diyos ng pagpapala; natural sa Tagalog ang konstruksyong “bibigyan ko … ang lupain.”
- source_word: שָׁלוֹם
  choice: kapayapaan
  rationale: Saklaw ng שָׁלוֹם ang kapayapaan, katiwasayan, at mabuting kalagayan. Sa kontekstong ito, malinaw na nangingibabaw ang katiwasayan sa lupain, ngunit hindi isinasara ng “kapayapaan” ang mas malawak na diwa.
- source_word: בָּאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ang אֶרֶץ sa tiyak na lupaing tipan, kaya mas angkop ang “lupain” kaysa sa mas pangkalahatang “bansa.”
- source_word: וּשְׁכַבְתֶּם
  choice: Hihiga kayo
  rationale: Pinananatili nito ang konkretong larawan ng ligtas na paghiga at pagpapahinga nang hindi nililimitahan ang kahulugan sa pagtulog lamang.
- source_word: וְאֵין מַחֲרִיד
  choice: at walang sinumang tatakot sa inyo
  rationale: Ipinapakita ng causative participle na walang taong o nilalang na magdudulot sa kanila ng takot. Natural at malinaw ito sa modernong Tagalog.
- source_word: וְהִשְׁבַּתִּי
  choice: Aalisin ko
  rationale: Ang Hiphil ng שׁבת ay “pangyayaring tumigil o mawala.” Sa konteksto, malinaw na ipinahihiwatig ng “aalisin” na hindi na mananatili sa lupain ang banta ng mga hayop.
- source_word: חַיָּה רָעָה
  choice: mapanganib na mga hayop
  rationale: Ang רָעָה rito ay tumutukoy sa pinsala o panganib, hindi sa moral na kasamaan. Ang “mapanganib na mga hayop” ay malinaw at likas sa Tagalog habang pinananatili ang nagbabantang diwa.
- source_word: מִן הָאָרֶץ
  choice: sa lupain
  rationale: Kasama ng pandiwang “aalisin,” natural na ipinahahayag ng “sa lupain” ang pag-aalis mula roon.
- source_word: וְחֶרֶב
  choice: at … ang tabak
  rationale: Pinananatili ang literal na larawang Hebreo ng tabak, na maaari ring kumatawan sa digmaan o armadong pagsalakay.
- source_word: לֹא תַעֲבֹר
  choice: hindi daraan
  rationale: Tuwirang katumbas ito ng “hindi dadaan” o “hindi tatawid,” at angkop sa larawan ng hukbong hindi makapapasok sa lupain.
- source_word: בְּאַרְצְכֶם
  choice: sa inyong lupain
  rationale: Pinananatili nito ang pangmaramihang “inyong” at ang diin sa lupaing ibinigay sa Israel.
theological_decisions:
- issue: Saklaw ng ipinangakong kapayapaan
  choice: Inilalarawan ang konkretong katiwasayan sa lupaing tipan—kalayaan mula sa takot, mapanganib na mga hayop, at armadong pagsalakay—nang hindi nililimitahan ang שָׁלוֹם sa aspetong pampolitika lamang.
  alternative: Unawain ang kapayapaan bilang panloob o espirituwal lamang, o bilang pampolitika lamang.
  rationale: Ang ligtas na paghiga, pagkawala ng mapanganib na mga hayop, at hindi pagdaan ng tabak ay nagpapakitang materyal at panlipunan ang pagpapala, bagaman mas malawak pa rin ang maaaring saklaw ng שָׁלוֹם.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lupain” upang mapanatili ang kontekstong teritoryal ng tipan, “Hihiga kayo” upang mapanatili ang konkretong larawan ng ligtas na pahinga, at “tabak” upang hindi mawala ang tayutay ng tekstong Hebreo. Inilagay ang mga talababa sa mismong mga salitang tinutukoy ng mga ito.
