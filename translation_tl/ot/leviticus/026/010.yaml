  yaml_path: translation/ot/leviticus/026/010.yaml
  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: tl
  text: Kakainin ninyo ang mga pagkaing matagal nang nakaimbak,[a] at ilalabas ninyo ang mga luma dahil sa mga bago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “Kakainin ninyo ang lumang pagkaing matagal nang nakaimbak, at ilalabas ninyo ang luma dahil sa bago.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Kakainin ninyo
  rationale: Ang Qal perfect na may waw ay may panghinaharap na diwa sa pagkakasunod-sunod ng mga pagpapala sa tipan.
- source_word: יָשָׁן נוֹשָׁן
  choice: ang mga pagkaing matagal nang nakaimbak
  rationale: Ang יָשָׁן ay pang-uring ginamit bilang pangngalan para sa dating ani o pagkain, at ang נוֹשָׁן ay nagpapatingkad sa tagal ng pagkakaimbak. Hindi espesipikong tinukoy na butil lamang ang laman.
- source_word: וְיָשָׁן
  choice: ang mga luma
  rationale: Muli itong pang-uring ginamit bilang pangngalan at tumutukoy sa mga dating nakaimbak na pagkain.
- source_word: מִפְּנֵי
  choice: dahil sa
  rationale: Ipinahahayag ng parirala ang dahilan o pagtabi sa luma bunsod ng pagdating ng bagong ani, habang pinananatili ang maikling anyo ng Hebreo.
- source_word: חָדָשׁ
  choice: mga bago
  rationale: Pang-uring ginamit bilang pangngalan para sa bagong ani o bagong pagkaing iimbak; hindi dinaragdagan ang teksto ng mas tiyak na katawagan.
- source_word: תּוֹצִיאוּ
  choice: ilalabas ninyo
  rationale: Pormal at tuwirang katumbas ng Hiphil ng יצא, ‘papalabasin’ o ‘ilalabas.’ Pinananatili nito ang posibleng larawan ng pagkuha ng lumang imbakan nang hindi tahasang dinaragdagan ang diwang ‘magbibigay-luwag.’
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “pagkaing nakaimbak” upang maipahiwatig ang substantibong gamit ng ‘luma’ nang hindi labis na nililimitahan ito sa butil. Ang pangmaramihang “mga” ay natural sa Filipino para sa mga nakaimbak na pagkain at sa bagong ani.
