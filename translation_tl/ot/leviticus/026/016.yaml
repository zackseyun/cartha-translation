base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: tl
  text: 'Gagawin ko rin ito sa inyo: ipapataw ko sa inyo ang biglaang sindak,[a] nakapanghihinang sakit[b] at lagnat, na magpapanghina sa inyong mga mata at magpapaubos ng inyong buhay.[c] Maghahasik kayo ng inyong binhi nang walang kabuluhan, at kakainin iyon ng inyong mga kaaway.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pasasapitin ko sa inyo ang biglaang sindak.” Ang pandiwang Hebreo ay maaaring mangahulugang magtalaga, magpataw, o magpasapit ng hatol.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak kung anong espesipikong sakit ang tinutukoy ng salitang Hebreo; inilalarawan nito ang isang karamdamang umuubos ng lakas o katawan.
    reason: lexical_uncertainty
  - marker: c
    text: Maaari ring isalin na “na magpapahina sa paningin at magpapaunti sa sigla ng buhay.” Mahirap ang dalawang pariralang Hebreo, at inilalarawan ng mga ito ang matinding panghihina.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: אַף אֲנִי אֶעֱשֶׂה זֹּאת לָכֶם
  choice: Gagawin ko rin ito sa inyo
  rationale: Pinananatili ng “rin” ang diin at pagpapatuloy ng אַף אֲנִי, habang likas sa modernong Tagalog ang ayos ng pangungusap.
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: ipapataw ko sa inyo
  rationale: Sa konteksto ng mga sumpa ng tipan, ipinahihiwatig ng Hiphil ng פקד ang paglalagay o pagpapasapit ng hatol. Mas malinaw sa Tagalog ang “ipapataw” kaysa sa literal na “itatalaga sa ibabaw ninyo.”
- source_word: בֶּהָלָה
  choice: biglaang sindak
  rationale: Sinasaklaw nito ang diwa ng matinding takot o pagkatarantang biglang sumasapit.
- source_word: הַשַּׁחֶפֶת
  choice: sakit na nakapanghihina
  rationale: Hindi tiyak ang espesipikong sinaunang karamdaman. Inilalarawan ng salin ang epekto nito nang hindi ito ipinapalagay na tuberculosis o ibang tiyak na diagnosis.
- source_word: הַקַּדַּחַת
  choice: lagnat
  rationale: Ang salita ay tumutukoy sa nagbabagang init ng katawan; “lagnat” ang malinaw at karaniwang katumbas sa modernong Tagalog.
- source_word: מְכַלּוֹת עֵינַיִם
  choice: magpapanghina sa inyong mga mata
  rationale: Ipinahihiwatig ng idyoma ang pag-unti o paghina ng paningin dahil sa sakit; pinananatili ng “magpapanghina” ang epekto nang hindi ginagawang lubos na pagkabulag.
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: magpapaubos ng inyong buhay
  rationale: Mahirap ang parirala, ngunit ang נֶפֶשׁ dito ay tumutukoy sa buhay o sigla ng tao. Iniiwasan ng “buhay” ang di-kailangang pagpapakahulugang tumutukoy lamang sa hiwalay na kaluluwa.
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: Maghahasik kayo ng inyong binhi nang walang kabuluhan
  rationale: Tapat nitong ipinapahayag na mawawalan ng pakinabang o bunga para sa naghahasik ang kanilang pagtatanim.
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: at kakainin iyon ng inyong mga kaaway
  rationale: Pinananatili ang payak na pang-ugnay na waw bilang “at” at ang tuwirang larawang agrikultural ng pagkain sa itinanim o naging ani.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng hatol
  choice: buhay
  alternative: kaluluwa; sarili; sigla
  rationale: Ang konteksto ay pisikal na panghihina at pagkaubos ng lakas-buhay. Ang “buhay” ay nagpapanatili sa lawak ng Hebreong salita at hindi nagpapasok ng isang partikular na doktrina tungkol sa pagkakabuo ng tao.
- issue: Ugnayan ng paghahasik at pagkain ng mga kaaway
  choice: at kakainin iyon ng inyong mga kaaway
  alternative: sapagkat kakainin iyon ng inyong mga kaaway
  rationale: Pinananatili ang lantad na koordinasyon ng Hebreong waw at hindi tahasang ginagawang sanhi ang ikalawang sugnay, bagaman malinaw sa konteksto na ito ang dahilan kung bakit walang pakinabang ang paghahasik.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipapataw,” “sindak,” at “maghahasik” upang mapanatili ang solemne at agrikultural na himig ng teksto, habang iniwasan ang lipas o labis na teknikal na katawagan sa sakit.
