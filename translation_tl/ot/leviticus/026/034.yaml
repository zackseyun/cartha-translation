    issue: Ang pariralang “na hindi nito natamasa” ay idinagdag sa dalawang paglitaw ng parirala.
    rationale: Ipinahihiwatig ng konteksto ang mga Sabbath na napabayaan, ngunit ang Hebreo ay simpleng “ang mga Sabbath nito.” Ang pagdaragdag ay naglilimita at nagpapaliwanag nang higit sa hayag na sinasabi ng talata.
  - severity: low
    issue: Hindi direktang nakakabit ang talababa sa pangunahing salitang leksikal na tinatalakay.
    rationale: Ang talababa tungkol sa pandiwang רצה ay dapat ilagay pagkatapos ng “mga Sabbath nito,” sa halip na pagkatapos ng “ito” sa pariralang tumutukoy sa pagkatiwangwang.
