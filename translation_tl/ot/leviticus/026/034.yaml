  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָז֩ תִּרְצֶ֨ה הָ/אָ֜רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ כֹּ֚ל יְמֵ֣י הֳשַׁמָּ֔/ה וְ/אַתֶּ֖ם בְּ/אֶ֣רֶץ אֹיְבֵי/כֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָ/אָ֔רֶץ וְ/הִרְצָ֖ת אֶת שַׁבְּתֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: tl
  text: Kung magkagayon, makababawi ang lupain para sa mga Sabbath nito[a] sa buong panahon ng pagkatiwangwang nito, habang kayo ay nasa lupain ng inyong mga kaaway. Kung magkagayon, magpapahinga ang lupain at makababawi para sa mga Sabbath nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “tatamasahin ng lupain ang mga Sabbath nito” o “tatanggap ang lupain ng kabayaran para sa mga Sabbath nito.” Sa kontekstong ito, ipinahihiwatig ng pandiwang Hebreo na matatanggap ng lupain ang nararapat dito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Sa panahong iyon
  rationale: Malinaw na panandang temporal na nagpapakita ng bunga ng naunang hatol; natural ito sa makabagong Tagalog.
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: babawiin ... ang ... hindi nito natamasa
  rationale: Sa kontekstong ito, ipinahihiwatig ng רצה na matatanggap ng lupain ang mga Sabbath na ipinagkait dito. Pinananatili ng 'babawiin' ang diwang kabayaran o pagbawi, habang ang buong parirala ay malinaw sa Tagalog at inuulit sa dalawang sugnay.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa partikular na lupain ng Israel sa konteksto, hindi sa buong daigdig; mas angkop ang 'lupain' kaysa 'lupa' o 'daigdig.'
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: ang mga Sabbath na hindi nito natamasa
  rationale: Tumutukoy sa mga kapahingahang Sabbath ng lupain, lalo na sa mga taon ng Sabbath. Isinama ang implicit na pagkakait upang maging malinaw ang ugnayan sa 'babawiin,' nang hindi tinutukoy kung ilang Sabbath ang napabayaan.
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: sa buong panahong tiwangwang ito
  rationale: Natural na ipinapahayag sa Tagalog ang kabuuang tagal ng pagkawasak o pagkatiwangwang ng lupain.
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: habang kayo ay nasa lupain ng inyong mga kaaway
  rationale: Ang sugnay ay sirkumstansiyal at tumutukoy sa kasabay na panahon; tuwirang naihahatid ito ng 'habang.'
- source_word: תִּשְׁבַּת
  choice: magpapahinga
  rationale: Ang lupain ay titigil sa pagsasaka at sa gayon ay magpapahinga; pinananatili rin nito ang kaugnayan sa temang Sabbath.
theological_decisions:
- issue: Ang ugnayan ng lupain sa mga Sabbath nito habang ipinatutupad ang hatol ng pagpapatapon
  choice: Babawiin ng lupain ang mga Sabbath na hindi nito natamasa habang wala ang Israel.
  alternative: Tatamasahin ng lupain ang mga Sabbath nito; o mabibigyan ng kabayaran ang lupain para sa mga Sabbath nito.
  rationale: Nasa konteksto ang mga sumpa ng tipan at ang napabayaang kapahingahan ng lupain. Inihahatid ng 'babawiin ... ang ... hindi nito natamasa' ang kompensatoryong diwa ng רצה nang hindi ginagawang emosyonal ang lupain, ngunit itinatala sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'Sabbath' bilang pamilyar na terminong biblikal at 'tiwangwang' para sa isang lupain na iniwang wasak at walang naninirahan o nagsasaka. Ang pag-uulit sa dalawang sugnay ay sadyang pinanatili upang tumbasan ang pag-uulit ng ugat sa Hebreo.
