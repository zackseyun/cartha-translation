reference: Leviticus 26:44
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: tl
  text: Ngunit kahit sa panahong sila ay nasa lupain ng kanilang mga kaaway, hindi ko sila itatakwil o kasusuklaman hanggang sa lubusan silang malipol at masira ang aking tipan sa kanila; sapagkat ako si Yahweh[a], ang kanilang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang Hebreo na YHWH.
    reason: Nililinaw ang paglilipat sa Tetragrammaton.
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: Ngunit kahit noon
  rationale: 'Ipinahahayag ng pinagsamang mga kataga ang matinding pagsalungat o pagbibigay-konsesyon: sa kabila ng naunang mga hatol, mananatili ang pangako ng Diyos.'
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: kapag sila ay nasa lupain ng kanilang mga kaaway
  rationale: Ang ב na sinusundan ng infinitive construct ay nagsasaad ng kalagayang panahunan; natural sa Tagalog ang “kapag sila ay nasa” at tuwirang pinananatili ang “lupain ng kanilang mga kaaway.”
- source_word: לֹא מְאַסְתִּים
  choice: hindi ko sila itatakwil
  rationale: Ang מָאַס ay tumutukoy sa pagtanggi o pagtatakwil. Ang “itatakwil” ay malinaw na naghahayag ng relasyonal at pangtipang pagtataboy.
- source_word: וְלֹא גְעַלְתִּים
  choice: ni kasusuklaman
  rationale: Ang גָּעַל ay masidhing pagkasuklam. Pinananatili ng “kasusuklaman” ang lakas nito at maayos na naiuugnay sa naunang negatibong pandiwa sa pamamagitan ng “ni.”
- source_word: לְכַלֹּתָם
  choice: upang lipulin sila
  rationale: Maaaring magpahiwatig ng layunin o bunga ang ל infinitive; ang “upang lipulin sila” ay nagpapanatili sa ideya ng lubusang pag-ubos nang hindi dinaragdagan ang teksto.
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: at sirain ang aking tipan sa kanila
  rationale: Sa konteksto ng tipan, ang הֵפֵר ay mangahulugang sirain, pawalang-bisa, o labagin. Karaniwan at malinaw sa Tagalog ang “sirain ang aking tipan.”
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: sapagkat ako si Yahweh, ang kanilang Diyos
  rationale: Ibinibigay ng כִּי ang saligan ng pangako. Pinananatili ang personal na pangalang YHWH bilang “Yahweh,” at ang appositional na “ang kanilang Diyos” ay natural sa Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang tuwirang nasa Hebreo. Ang “Yahweh” ay nagpapanatili sa pangalang pangtipan at hindi ito pinapalitan ng isang titulo.
- issue: Aspekto/panahon ng mga qatal na pandiwa מְאַסְתִּים at גְעַלְתִּים
  choice: 'Panghinaharap: “hindi ko sila itatakwil ni kasusuklaman”'
  alternative: 'Pangnagdaan: “hindi ko sila itinakwil ni kinasuklaman”; pangkasalukuyan: “hindi ko sila itinatakwil ni kinamumuhian”'
  rationale: Bagaman qatal ang anyong Hebreo, inilalarawan ng konteksto ang magiging kalagayan ng Israel sa lupain ng mga kaaway at ang nananatiling pangako ng Diyos. Ang panghinaharap sa Tagalog ang pinakamalinaw na naghahatid ng lakas-pangako, nang hindi ipinipilit na likas na panahunan ang Hebreong aspekto.
- issue: 'Ugnayan ng dalawang ל infinitive: לְכַלֹּתָם at לְהָפֵר'
  choice: 'Magkakaugnay na layunin/bunga: “upang lipulin sila at sirain ang aking tipan”'
  alternative: 'Magkahiwalay na sugnay: “upang lipulin sila, upang sirain ang aking tipan”'
  rationale: Parehong nakaugnay ang mga infinitive sa hindi pagtatakwil at hindi pagkasuklam. Pinananatili ng salin ang koordinasyon ngunit hindi lubusang nilulutas kung layunin o bunga ang eksaktong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “itatakwil,” “kasusuklaman,” “lipulin,” at “tipan” bilang mga salitang madaling maunawaan ngunit sapat ang bigat para sa pangtipang konteksto. Inayos ang mga talababa sa lohikal na puwesto sa pangunahing teksto at tiniyak na lumitaw ang bawat marker.
