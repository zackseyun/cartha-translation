revisions:
- from: Ngunit kahit noon[a], kapag sila ay nasa lupain ng kanilang mga kaaway, hindi ko sila itatakwil ni kasusuklaman upang lipulin sila[b] at sirain ang aking tipan sa kanila; sapagkat ako si Yahweh[c], ang kanilang Diyos.
  to: Ngunit kahit sa panahong sila ay nasa lupain ng kanilang mga kaaway, hindi ko sila itatakwil o kasusuklaman hanggang sa lubusan silang malipol at masira ang aking tipan sa kanila; sapagkat ako si Yahweh[a], ang kanilang Diyos.
  rationale: Inalis ang hindi magkatugmang “noon, kapag” at isinalin ang temporal na kalagayan bilang “sa panahong sila ay nasa.” Inayos din ang pag-uugnay ng mga infinitive upang malinaw na ang lubusang paglipol at pagsira sa tipan ang resultang hindi mangyayari. Hindi kailangan ang dating talababa tungkol sa mga alternatibong salin ng panimulang concessive na parirala o ng לְכַלֹּתָם, sapagkat hindi ito mahalaga upang maipaliwanag ang piniling salin at ang pangunahing teksto ay hindi na umaasa sa mga ito.
