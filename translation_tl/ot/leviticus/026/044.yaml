  naturalness: Kailangan ng bahagyang rebisyon para sa mas likas at magkakatugmang Filipino. Ang “sa panahong sila ay nasa” ay malinaw na katumbas ng temporal na parirala. Ang “hanggang sa lubusan silang malipol at masira ang aking tipan” ay mas natural na nag-uugnay sa dalawang infinitive bilang sukdulan/bungang hindi mangyayari.
  terminology: Ang “Yahweh,” “Diyos,” “tipan,” “itatakwil,” at “kasusuklaman” ay angkop sa makabago ngunit marangal na Filipino at matapat sa mahahalagang terminong Hebreo.
