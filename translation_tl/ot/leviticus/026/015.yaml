  text: וְ/אִם בְּ/חֻקֹּתַ֣/י תִּמְאָ֔סוּ וְ/אִ֥ם אֶת מִשְׁפָּטַ֖/י תִּגְעַ֣ל נַפְשְׁ/כֶ֑ם לְ/בִלְתִּ֤י עֲשׂוֹת֙ אֶת כָּל מִצְוֺתַ֔/י לְ/הַפְרְ/כֶ֖ם אֶת בְּרִיתִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: tl
  text: at kung itatakwil ninyo ang aking mga tuntunin, at kung kasusuklaman ng inyong buong pagkatao[a] ang aking mga hatol[b], anupat hindi ninyo susundin ang lahat ng aking mga utos, at sa gayo’y sisirain ninyo ang aking tipan[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kasusuklaman ng inyong kaluluwa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga hatol” ay maaari ding isaling “mga tuntuning legal” o “mga pasiya.”
    reason: lexical_alternative
  - marker: c
    text: O “sa gayo’y lalabagin ninyo ang aking tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang חֻקִּים ay mga itinakdang batas o alituntunin. Pinananatili ng “mga tuntunin” ang legal at tipanang tono at naihihiwalay ito sa מִשְׁפָּטִים.
- source_word: תִּמְאָסוּ
  choice: itatakwil ninyo
  rationale: Ang מאס ay pagtanggi na may paghamak. Ang “itatakwil” ay malinaw, matindi, at angkop sa babala tungkol sa tipan.
- source_word: מִשְׁפָּטַי
  choice: aking mga hatol
  rationale: Ang מִשְׁפָּטִים ay mga legal na hatol o pasiya. Pinananatili ng “mga hatol” ang legal na diwa at ang pagkakaiba nito sa “mga tuntunin.”
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: kasusuklaman ng inyong buong pagkatao
  rationale: Ang געל ay matinding pagkasuklam, at ang נֶפֶשׁ sa idyomang ito ay tumutukoy sa sarili o buong pagkatao. Natural ito sa makabagong Tagalog habang pinananatili ang diin ng Hebreo.
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: kaya hindi ninyo tutuparin
  rationale: Ipinapahayag ng parirala ang bunga o layunin. Ang “kaya hindi ninyo tutuparin” ay natural at inuugnay ang pagkasuklam sa pagsuway.
- source_word: כָּל מִצְוֺתַי
  choice: lahat ng aking mga utos
  rationale: Ang מִצְוֹת ay mga utos. Ang salin ay malinaw at pinananatili ang tipanan at legal na rehistro.
- source_word: לְהַפְרְכֶם
  choice: sa gayo’y sisirain ninyo
  rationale: Ang Hiphil ng פרר ay tumutukoy sa pagsira, pagpapawalang-bisa, o paglabag sa tipan. Ipinakikita ng “sa gayo’y” ang bunga ng hindi pagtupad.
- source_word: בְּרִיתִי
  choice: aking tipan
  rationale: Ang בְּרִית ay karaniwang termino para sa tipan; ang “tipan” ang tiyak at kinikilalang salin sa kontekstong teolohikal at legal.
theological_decisions:
- issue: Pagpapahayag sa נֶפֶשׁ bilang simuno ng idyomatikong parirala
  choice: inyong buong pagkatao
  alternative: inyong kaluluwa
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay maaaring tumukoy sa sarili o buong pagkatao, hindi kinakailangang sa isang teknikal na doktrina ng kaluluwa. Pinananatili ng pangunahing salin ang tindi at natural na Tagalog, habang nasa talababa ang mas pormal na anyo.
- issue: Pagkakaiba ng mga terminong kaugnay ng batas at tipan
  choice: mga tuntunin / mga hatol / mga utos / tipan
  alternative: mga batas / mga alituntunin / mga kautusan / tipan
  rationale: Nagpatong-patong ang talata ng magkakaibang terminong legal at tipanan. Pinananatili ang mga pagkakaibang ito sa halip na pag-isahin ang mga ito para lamang maging mas makinis.
- issue: Lakas ng לְהַפְרְכֶם kaugnay ng tipan
  choice: sisirain ninyo ang aking tipan
  alternative: lalabagin ninyo ang aking tipan
  rationale: Maaaring ipakahulugan ang pandiwa bilang pagsira o paglabag sa tipan. Pinili ang “sisirain” upang mapanatili ang malakas na puwersa ng פרר, nang hindi itinatago ang alternatibo.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Pinanatili ang mahabang kondisyonal na daloy ng Hebreo at ang magkakaibang terminong legal. Ang talata ay nagsisimula sa “at kung” at nagtatapos sa kuwit dahil bahagi ito ng mas malawak na pangungusap sa konteksto.
