  text: וַ/אֲבַדְתֶּ֖ם בַּ/גּוֹיִ֑ם וְ/אָכְלָ֣ה אֶתְ/כֶ֔ם אֶ֖רֶץ אֹיְבֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/038.yaml
  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: tl
  text: Malilipol kayo sa gitna ng mga bansa, at lalamunin kayo ng lupain ng inyong mga kaaway.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kakainin kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: Malilipol kayo
  rationale: Ang Qal ng אבד sa sunod-sunod na mga sumpa ng tipan ay nagsasaad ng pagkawasak o pagkapahamak. Ang “malilipol” ay likas at mariing Filipino, ngunit hindi nito nililinaw nang higit sa Hebreo ang tiyak na paraan ng kamatayan o pagkawala.
- source_word: בַּגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy sa mga bansa o mga bayan. Ipinahihiwatig ng parirala ang pagkalat at pagkapahamak nila sa piling ng ibang mga bansa, nang hindi ipinapasok ang mas huling teknikal na gamit ng “mga Hentil.”
- source_word: וְאָכְלָה
  choice: lalamunin
  rationale: Literal na “kakainin” mula sa אכל. Kapag lupain ang simuno, ang “lalamunin” ay natural na nagpapanatili sa matingkad at personipikadong talinghaga ng Hebreo.
- source_word: אֶתְכֶם
  choice: kayo
  rationale: Ang panandang tuwirang layon na may hulaping ikalawang panauhang panlalaking maramihan ay likas na tinutumbasan ng “kayo.”
- source_word: אֶרֶץ
  choice: lupain
  rationale: Sa konteksto ng pagpapatapon, ang אֶרֶץ ay partikular na lupain o teritoryo, hindi ang buong daigdig.
- source_word: אֹיְבֵיכֶם
  choice: ng inyong mga kaaway
  rationale: Tuwirang inililipat ang pariralang konstrakto at pinananatili ang kolektibong ikalawang panauhang maramihan.
theological_decisions:
- issue: Talinghaga ng lupain na kumakain sa mga itinapon
  choice: Pinanatili bilang “lalamunin kayo ng lupain ng inyong mga kaaway.”
  alternative: “Wawasakin kayo sa lupain ng inyong mga kaaway.”
  rationale: Ginagawang simuno ng Hebreo ang lupain at ginagamit ang pandiwang literal na “kumain.” Pinananatili ng salin ang matinding larawan ng sumpa ng tipan at hindi ito pinapawi sa isang paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “malilipol” para sa matinding bunga ng sumpa at “lalamunin” upang mapanatili ang buhay na talinghaga ng orihinal.
