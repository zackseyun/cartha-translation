id: LEV.26.5
reference: Leviticus 26:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: tl
  text: Ang paggiik ninyo ay aabot hanggang sa pag-aani ng ubas, at ang pag-aani ng ubas ay aabot hanggang sa panahon ng paghahasik. Kakain kayo ng inyong tinapay hanggang mabusog at mamumuhay nang tiwasay sa inyong lupain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: paggiik
  rationale: Tumutukoy sa gawain o panahon ng paggiik; pinananatili ang larawang agrikultural ng Hebreo.
- source_word: הִשִּׂיג / יַשִּׂיג
  choice: aabot hanggang
  rationale: Sa konteksto, inilalarawan nito ang isang gawaing umaabot at halos sumasanib sa kasunod na panahon ng pagsasaka.
- source_word: בָּצִיר
  choice: pag-aani ng ubas
  rationale: Mas tiyak kaysa pangkalahatang “pag-aani” at malinaw na ipinahahayag ang ubas na tinutukoy ng salita.
- source_word: זָרַע
  choice: panahon ng paghahasik
  rationale: Ang pangngalan ay tumutukoy rito sa paghahasik bilang yugto ng taunang gawaing bukid; idinagdag ang “panahon” para sa likas na Tagalog.
- source_word: לַשֹּׂבַע
  choice: hanggang mabusog
  rationale: Tuwirang ipinapahayag ang pagkain hanggang sa ganap na pagkabusog.
- source_word: לָבֶטַח
  choice: nang tiwasay
  rationale: Saklaw nito ang diwa ng seguridad at kawalan ng pangamba nang hindi pinalalawak ang pangako.
theological_decisions:
- issue: Kalikasan ng pangako
  choice: Pinanatili bilang kongkretong pangako ng masaganang ani, sapat na pagkain, at tiwasay na pamumuhay sa lupain.
  alternative: Gawing pangkalahatan o espirituwal na pangako ng kasaganaan.
  rationale: Ang talata ay tahasang nakaugat sa siklo ng agrikultura at sa paninirahan ng Israel sa kanilang lupain; hindi dapat dagdagan ng di-nakasulat na espirituwalisasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyong agrikultural at likas na ayos ng pangungusap, habang pinananatili ang pag-uulit at progresyon ng tekstong Hebreo.
