source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: tl
  text: At ang mga matitira sa inyo ay unti-unting manghihina at mauubos[a] sa mga lupain ng inyong mga kaaway dahil sa kanilang kasamaan; at dahil din sa mga kasamaan ng kanilang mga ninuno, na kasama nila,[b] unti-unti rin silang manghihina at mauubos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “unti-unting mauubos,” “malalanta,” o “mabubulok.” Ang pandiwang Hebreo ay nagpapahiwatig ng unti-unting panghihina, pagkaubos, o pagkabulok sa ilalim ng hatol.
    reason: lexical_alternative
  - marker: b
    text: Ang “na kasama nila” ay maaaring mangahulugang nananatiling kasama nila ang mga kasamaan ng kanilang mga ninuno, o nanghihina at nauubos sila habang pasan ang patuloy na epekto ng mga kasamaan ng mga iyon.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: ang mga matitira sa inyo
  rationale: Ipinapahayag nito nang natural ang mga maiiwan mula sa bayang kinakausap matapos ang hatol.
- source_word: יִמַּקּוּ
  choice: manghihina
  rationale: Ipinahihiwatig ng Niphal ng מקק ang unti-unting pag-ubos, panghihina, o pagkabulok sa ilalim ng hatol. Ang “manghihina” ay malinaw at marangal sa Filipino, habang inilalahad sa talababa ang mas matitinding leksikal na alternatibo.
- source_word: בַּעֲוֺנָם
  choice: dahil sa kanilang kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutan bunga nito. Ang “dahil sa” ay naghahayag ng malamang na sanhi nang hindi dinaragdagan ang teksto.
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: sa mga lupain ng inyong mga kaaway
  rationale: Pinananatili ang maramihang “mga lupain” at ang tuwirang ikalawang panauhang “inyong.”
- source_word: וְאַף
  choice: at dahil din
  rationale: Naipapakita ang pandagdag at bahagyang nagpapatingkad na puwersa ng parirala sa natural na Filipino.
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: dahil sa mga kasamaan ng kanilang mga ninuno
  rationale: Pinananatili ang maramihang “mga kasamaan.” Mas natural at mas malawak ang “mga ninuno” para sa אבותם sa modernong Filipino kaysa literal na “mga ama,” na maaaring mapagkamalang tumutukoy lamang sa agarang mga magulang.
- source_word: אִתָּם
  choice: na kasama nila
  rationale: Pinananatili ang maikli at malabong ugnayan ng Hebreo sa halip na tiyaking ito ay pakikibahagi sa kasalanan o pagdanas lamang ng bunga nito.
theological_decisions:
- issue: Pagkakasala at hatol sa magkakasunod na salinlahi
  choice: Panatilihin ang pahayag na manghihina sila kapwa dahil sa sarili nilang kasamaan at dahil sa mga kasamaan ng kanilang mga ninuno.
  alternative: Ipaliwanag ito bilang bunga lamang ng kasalanan ng mga ninuno, o bilang tahasang pag-uulit ng mga anak sa parehong kasalanan.
  rationale: Tahasan ngunit maigsi ang Hebreo at hindi nito lubos na nililinaw ang kaugnayan ng pananagutan, pakikibahagi, at minanang bunga. Hindi dapat lutasin ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “kasamaan” para sa עָוֹן at “mga ninuno” para sa אבותם; iniwasan ang sobrang teknikal na pananalita. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
