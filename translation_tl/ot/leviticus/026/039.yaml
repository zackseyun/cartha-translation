- from: At ang mga matitira sa inyo ay manghihina[a] sa mga lupain ng inyong mga kaaway dahil sa kanilang kasamaan; at dahil din sa mga kasamaan ng kanilang mga ninuno na kasama nila, manghihina sila.[b]
