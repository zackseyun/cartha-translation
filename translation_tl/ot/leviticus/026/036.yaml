base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: tl
  text: '“Tungkol naman sa mga natitira sa inyo, magdadala ako ng panghihina ng loob sa kanilang kalooban sa mga lupain ng kanilang mga kaaway. Hahabulin sila ng kaluskos ng dahong tinatangay[a]; tatakas sila na parang tumatakas mula sa tabak, at mabubuwal sila kahit walang humahabol.”


    [a] O “tunog ng dahong tinatangay ng hangin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tunog ng dahong tinatangay ng hangin.”
    reason: Ibinibigay ang natural na alternatibong pagpapahayag ng passive na נִדָּף; maaaring ipinahihiwatig ang hangin, bagaman hindi ito tahasang binanggit sa Hebreo.
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: mga natitira sa inyo
  rationale: Tumutukoy ang participle sa mga maiiwan matapos ang hatol, at pinananatili ng “sa inyo” ang tuwirang pakikipag-usap sa Israel.
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: maglalagay ako ng panghihina ng loob sa kanilang mga puso
  rationale: Ipinahahayag ng מֹרֶךְ ang pagkawala o pagbagsak ng tapang, hindi lamang karaniwang takot. Likas sa Filipino ang “panghihina ng loob,” habang malinaw na nananatili ang pagkilos ng Diyos.
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: sa mga lupain ng kanilang mga kaaway
  rationale: Pinananatili ang maramihang “mga lupain,” na angkop sa pagkakawatak-watak nila sa mga teritoryo ng mga kaaway.
- source_word: קוֹל עָלֶה נִדָּף
  choice: kaluskos ng dahong tinatangay
  rationale: Ang קוֹל ay tunog at ang נִדָּף ay dahong itinataboy o tinatangay. Ang “kaluskos” ay likas na tawag sa tunog ng dahon sa Filipino; hindi tahasang pinapangalanan sa pangunahing teksto ang hangin bilang tagagawa.
- source_word: וְרָדַף אֹתָם
  choice: hahabulin sila
  rationale: Tumpak at natural na katumbas ng רדף, at pinananatili ang matinding kabalintunaan na isang munting tunog ang tila humahabol sa kanila.
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: tatakas silang gaya ng pagtakas mula sa tabak
  rationale: Inilalarawan ng parirala ang paraan ng kanilang pagtakas—gaya ng pagtakas sa harap ng panganib ng tabak—nang hindi ginagawang aktuwal na naroon ang hukbo.
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: mabubuwal sila kahit walang humahabol
  rationale: Pinananatili ng “mabubuwal” ang posibilidad ng pagkadapa o pagbagsak sa sindak, at malinaw na inilalahad ng “kahit” ang kabalintunaang wala namang tunay na humahabol.
theological_decisions:
- issue: Kalikasan ng hatol na inilalarawan
  choice: Takot at pagkasindak sa pagkatapon na tahasang ipinapasok ng Diyos sa kanilang kalooban
  alternative: Panlabas na paghabol lamang ng hukbo, o isang malabong talinghaga lamang ng pagkabalisa
  rationale: Tahasang iniuugnay ng Hebreo sa Diyos ang panghihina ng loob at inilalarawan ang di-makatwirang pagtakas dahil sa napakaliit na tunog. Pinananatili ng salin kapwa ang pagkilos ng Diyos at ang sikolohikal na karanasan nang hindi nagdaragdag ng sistematikong doktrina.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “panghihina ng loob,” “kaluskos,” at “mabubuwal” upang maging natural sa kasalukuyang mambabasa habang pinananatili ang maigsi at nakatatakot na larawan ng tekstong Hebreo.
