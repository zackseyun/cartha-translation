  to: '“Tungkol naman sa mga natitira sa inyo, magdadala ako ng panghihina ng loob sa kanilang kalooban sa mga lupain ng kanilang mga kaaway. Hahabulin sila ng kaluskos ng dahong tinatangay[a]; tatakas sila na parang tumatakas mula sa tabak, at mabubuwal sila kahit walang humahabol.”


