source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: tl
  text: At kung sa kabila ng lahat ng ito[a] ay hindi pa rin kayo makikinig sa akin, patuloy ko kayong didisiplinahin nang makapitong ibayo[b] dahil sa inyong mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pagkatapos ng lahat ng ito.” Ipinahihiwatig ng pariralang Hebreo ang patuloy na pagsuway sa kabila ng mga naunang hatol.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pitong ulit.” Maaaring tumukoy ang Hebreo sa pinatinding parusa sa halip na sa eksaktong bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang nag-uugnay at pasubaling diwa ng וְ at אִם sa pagpapatuloy ng mga babala.
- source_word: עַד אֵלֶּה
  choice: sa kabila ng lahat ng ito
  rationale: Sa konteksto, tumutukoy ito sa patuloy na pagsuway sa kabila ng mga naunang hatol, hindi lamang sa isang hangganang pangpanahon.
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: hindi pa rin kayo makikinig sa akin
  rationale: Pinananatili ng “makikinig” ang larawang pandinig ng שׁמע habang ipinahihiwatig ng konteksto ang pagsunod; ipinakikita ng “pa rin” ang pagpapatuloy ng pagtanggi.
- source_word: וְיָסַפְתִּי
  choice: patuloy ko
  rationale: Ipinahahayag ang pagpapatuloy at pag-igting ng pagkilos nang mas natural kaysa sa literal na “idaragdag ko.”
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: kayong didisiplinahin
  rationale: Ang “didisiplinahin” ay nagpapanatili sa kapuwa mapagtuwid at maparusang puwersa ng יסר.
- source_word: שֶׁבַע
  choice: nang pitong ibayo
  rationale: Ipinahahayag ang pinatinding sukat ng pagdidisiplina at hindi ipinipilit na pitong magkakahiwalay na pangyayari ang tinutukoy.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: dahil sa inyong mga kasalanan
  rationale: Malinaw at natural na ipinahahayag ang sanhi o batayan ng pagdidisiplina.
theological_decisions:
- issue: Likas ng יָסַר sa konteksto ng mga sumpa ng tipan
  choice: didisiplinahin
  alternative: parurusahan
  rationale: Ang pagkilos ay may tunay na maparusang bigat ngunit maaari ring maglayong magtuwid; pinananatili ng “didisiplinahin” ang tensiyong ito.
- issue: Diwa ng שֶׁבַע sa pormula ng paghatol
  choice: pitong ibayo
  alternative: pitong ulit
  rationale: Maaaring tumukoy ang Hebreo sa ganap o matinding pag-igting, hindi kinakailangang sa eksaktong bilang ng magkakahiwalay na parusa; inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo” ayon sa anyong Hebreo. Ang “pitong ibayo” ay bahagyang pormal ngunit madaling maunawaan at angkop sa wikang pambibliya.
