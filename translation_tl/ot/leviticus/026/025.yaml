  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: tl
  text: At magdadala ako laban sa inyo ng isang tabak na magpapatupad ng paghihiganti ng tipan[a], at titipunin kayo sa inyong mga lungsod. Pagkatapos, magpapadala ako ng salot sa gitna ninyo, at ibibigay kayo sa kamay ng kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “isang tabak na naghihiganti alang-alang sa tipan” o “isang tabak na magpapatupad ng parusang itinakda ng tipan.” Sa literal, mariin ang Hebreo: “isang tabak na naghihiganti ng paghihiganti ng tipan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: At magdadala ako laban sa inyo
  rationale: Ang Hiphil ng בוא ay nagpapahayag na ang Diyos ang magpapasapit ng tabak; malinaw na ipinahihiwatig ng “laban sa inyo” ang mapanlabang gamit ng עַל.
- source_word: חֶרֶב
  choice: tabak
  rationale: Karaniwan at marangal na salitang Filipino para sa sandata at sagisag ng digmaan o paghatol.
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: na maglalapat ng paghihiganti ng tipan
  rationale: Pinananatili ng “paghihiganti ng tipan” ang ugnayang construct at ang posibilidad na tumukoy ito sa paghihiganting nakabatay sa tipan o alang-alang dito. Ang “maglalapat” ay natural na nagsasaad ng pagsasagawa ng hatol, samantalang ipinaliliwanag sa talababa ang mariing cognate construction.
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: at magtitipon kayo sa loob ng inyong mga lungsod
  rationale: Maaaring magkaroon ng passive o reflexive na diwa ang Niphal ng אסף. Mas natural sa Filipino ang “magtitipon kayo,” at ang “sa loob” ay naghahayag ng pagpasok sa mga lungsod bilang kanlungan sa panahon ng pagkubkob.
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: Pagkatapos, magpapadala ako ng salot sa gitna ninyo
  rationale: Ang דֶבֶר sa mga sumpa ng tipan ay nakamamatay na epidemya; ang “salot” ay malinaw, kasalukuyan, at may angkop na bigat. Ipinakikita ng “Pagkatapos” ang pagkakasunod-sunod ng mga paghatol.
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: at ibibigay kayo sa kamay ng kaaway
  rationale: Pinananatili ang passive na anyo ng נתן at ang Hebreong idyomang “sa kamay,” na tumutukoy sa pagpapasailalim sa kapangyarihan ng kaaway.
theological_decisions:
- issue: Kahulugan ng “paghihiganti ng tipan”
  choice: Pinanatili ang pariralang “paghihiganti ng tipan” bilang paghatol na kaugnay ng paglabag sa tipan.
  alternative: “paghihiganti alang-alang sa tipan” o “parusang itinakda ng tipan”
  rationale: Maaaring saklawin ng Hebreong construct ang paghihiganting isinasagawa alang-alang sa tipan o ang mga kaparusahang kaakibat nito. Hindi pinili sa pangunahing teksto ang isang mas makitid na paliwanag upang manatili ang tunay na saklaw at tensiyong teolohikal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tipan,” “tabak,” at “salot” bilang pamilyar na bokabularyong biblikal; iniwasan ang sobrang arkaikong ayos habang pinananatili ang judicial at covenantal na bigat ng talata.
