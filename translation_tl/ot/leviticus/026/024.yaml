  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: tl
  text: Ako rin ay lalakad laban sa inyo[a], at ako mismo ay hahampas sa inyo nang pitong ulit[b] dahil sa inyong mga kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may pagsalungat sa inyo” o “may pagkapoot sa inyo.” Ang salitang Hebreo ay paulit-ulit na ginagamit sa Levitico 26 upang ilarawan ang magkasalungat na pakikitungo ng Israel at ng PANGINOON.
    reason: lexical_alternative
  - marker: b
    text: O “nang pitong ibayo.” Maaaring ipinahihiwatig ng pananalitang ito ang lubhang pinatinding kaparusahan, hindi lamang isang eksaktong bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: Kaya ... ay lalakad
  rationale: Pinananatili ng “lalakad” ang literal at paulit-ulit na larawan ng הלך sa kabanata. Ang “Kaya” ay nagpapakita ng kasunod na tugon sa naunang babala.
- source_word: אַף אֲנִי
  choice: ako rin
  rationale: Ipinahahayag nito ang gantihang tugon ng Diyos nang natural at may diin sa Filipino.
- source_word: עִמָּכֶם בְּקֶרִי
  choice: na salungat sa inyo
  rationale: Pinananatili ng “salungat” ang mahalagang paulit-ulit na salitang קרי at ang diwa ng pakikipagtunggali, nang hindi ito nililimitahan sa damdaming poot lamang.
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: at ... hahampas sa inyo
  rationale: Ang “hahampas” ay tuwiran at makabagong katumbas ng נכה, at pinananatili ang lakas ng larawan ng kaparusahang nagmumula sa Diyos.
- source_word: גַּם אָ֔נִי
  choice: ako mismo
  rationale: Ipinakikita nito ang mariing pagbanggit sa Diyos bilang tuwirang gagawa ng paghatol.
- source_word: שֶׁבַע
  choice: nang pitong ulit
  rationale: Pinananatili nito ang anyong pito ng Hebreo at ang matinding retorika ng babala, habang ipinapaliwanag sa talababa na maaari itong tumukoy sa pitong ibayong tindi at hindi lamang sa eksaktong bilang.
- source_word: עַל חַטֹּאתֵיכֶם
  choice: dahil sa inyong mga kasalanan
  rationale: Malinaw at natural nitong ipinahahayag na ang mga kasalanan ang dahilan ng kaparusahan.
theological_decisions:
- issue: Ang gantihang pananalita ng tipan sa בְּקֶרִי tungkol sa Israel at sa PANGINOON
  choice: salungat sa inyo
  alternative: laban sa inyo; may pagkapoot sa inyo
  rationale: Ang “salungat” ay nagpapanatili sa ugnayang pampanitikan sa paulit-ulit na termino sa Levitico 26 at hindi nagpapasok ng paliwanag na ang tinutukoy ay emosyonal na poot lamang.
- issue: Kung ang שֶׁבַע ay eksaktong bilang o idyoma ng pinatinding kaparusahan
  choice: pitong ulit
  alternative: pitong ibayo
  rationale: Pinananatili sa pangunahing teksto ang hayag na bilang na nasa Hebreo, samantalang kinikilala sa talababa ang posibleng idyomatikong diwa ng lubhang pinatinding kaparusahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Sadyang pinanatili ang larawang “lalakad na salungat” upang maipakita ang paulit-ulit na idyoma ng kabanata, bagaman mas karaniwang sabihin sa pang-araw-araw na Filipino ang “kikilos laban.”
