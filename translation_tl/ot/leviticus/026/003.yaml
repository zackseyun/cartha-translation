  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: tl
  text: Kung lalakad kayo sa aking mga tuntunin[a], susundin ninyo ang aking mga utos at isasagawa ang mga ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mamumuhay kayo ayon sa aking mga tuntunin.” Literal sa Hebreo, “lalakad kayo sa aking mga tuntunin,” isang idyoma ng tipan para sa pamumuhay ayon sa mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Malinaw na nagpapakilala ng kondisyong bahagi ng pangungusap; pinananatili nito ang tahasang kondisyon sa pormulasyon ng tipan.
- source_word: בְּחֻקֹּתַי תֵּלֵכוּ
  choice: lalakad kayo ayon sa aking mga tuntunin
  rationale: Pinananatili ng “lalakad” ang metapora ng Hebreo, samantalang nililinaw ng “ayon sa” na tumutukoy ito sa pamumuhay na naaayon sa mga itinakdang tuntunin ng Diyos.
- source_word: מִצְוֺתַי
  choice: aking mga utos
  rationale: Ang “mga utos” ay natural at malinaw sa modernong Filipino at angkop sa legal at tipanang konteksto.
- source_word: תִּשְׁמְרוּ
  choice: iingatan ninyo
  rationale: Sa kontekstong legal, ang pandiwa ay nangangahulugang panatilihin o sundin nang may pag-iingat. Pinananatili ng “iingatan” ang pangunahing larawan ng salitang Hebreo.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: at tutuparin ang mga iyon
  rationale: Ipinahahayag nito ang aktuwal na pagsasagawa ng mga utos. Mas natural sa Filipino ang “tutuparin” kaysa sa literal na “gagawin,” nang hindi dinaragdagan ang diwa.
theological_decisions:
- issue: Idyoma ng pagsunod sa tipan
  choice: Panatilihin ang metaporang “lalakad kayo ayon sa aking mga tuntunin.”
  alternative: “mamumuhay kayo ayon sa aking mga tuntunin” o “susunod kayo sa aking mga tuntunin”
  rationale: Ang “lalakad” ay nagpapanatili sa larawan ng tekstong Hebreo at sa biblikal na diwa ng pag-aayos ng buong pamumuhay ayon sa tipan. Nililinaw ng “ayon sa” ang idyoma nang hindi ito lubusang pinapantay sa isang pagpapakahulugan lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang legal-tipanang mga terminong “mga tuntunin” at “mga utos,” gayundin ang metapora ng paglakad. Ang kuwit sa hulihan ay nagpapakitang nagpapatuloy sa kasunod na talata ang kondisyong pangungusap.
