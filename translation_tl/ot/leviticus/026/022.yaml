base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: tl
  text: At magpapadala ako laban sa inyo ng mababangis na hayop sa parang[a]. Kikitlan nila kayo ng mga anak[b], lilipulin ang inyong mga alagang hayop, at kakauntiin kayo; at magiging tiwangwang ang inyong mga daan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mababangis na hayop sa kaparangan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kikitlan nila kayo”; karaniwang ipinahihiwatig ng pandiwa ang pagkait o pagkawala ng mga anak.
    reason: lexical_alternative
  - marker: c
    text: O “magiging desolado ang inyong mga daan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: At magpapadala ako laban sa inyo
  rationale: Ang Hiphil ng שלח ay tuwirang nangangahulugang “magpadala,” at ang בָכֶם sa konteksto ng kaparusahan ay likas na isaling “laban sa inyo.”
- source_word: חַיַּת הַשָּׂדֶה
  choice: mababangis na hayop sa parang
  rationale: Tumutukoy ang parirala sa mga mailap at mapanganib na hayop sa lupa; natural sa makabagong Tagalog ang “mababangis na hayop sa parang” at naiiwasan nito ang mas makitid na “hayop sa bukid.”
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: Kikitlan nila kayo ng mga anak
  rationale: Ang Piel ng שׁכל ay karaniwang tumutukoy sa pagkait o pagkawala ng mga anak. Ipinahahayag ng “kikitlan ... ng mga anak” ang Hebreong idyoma sa malinaw at marangal na Tagalog.
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: lilipulin ang inyong mga alagang hayop
  rationale: Ang הכרית ay maaaring mangahulugang “putulin” o “lipulin”; sa kontekstong ang paksa ay mababangis na hayop at ang layon ay mga hayop na pag-aari, mas natural at malinaw ang “lilipulin.”
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: kakauntiin kayo
  rationale: Ang Hiphil ng מעט ay “gawing kaunti” o “bawasan ang bilang.” Ang “kakauntiin kayo” ay maikli at pinananatili ang tuwirang pagtuon sa bayan bilang layon.
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: mawawalan ng dumaraan sa inyong mga daan
  rationale: Ang נשׁם ay nagsasaad ng pagiging tiwangwang o abandonado. Sa Tagalog, malinaw na ipinapakita ng “mawawalan ng dumaraan” ang konkretong larawan ng mga daang naging desyerto nang hindi ito ginagawang metaporikal na asal.
theological_decisions:
- issue: Di-tahasang layon ng pandiwang שׁכל
  choice: Isinalin sa teksto bilang “kikitlan nila kayo ng mga anak”
  alternative: “Papangulilain nila kayo” o “kikitlan nila kayo,” nang hindi tahasang binabanggit ang mga anak
  rationale: Bagaman walang hiwalay na salitang “mga anak” sa talata, karaniwang ipinahihiwatig iyon ng pandiwang שׁכל. Nililinaw ito sa salin ngunit nilalagyan din ng talababa upang ipakitang di-tahasang binanggit ang layon sa Hebreo.
- issue: Kahulugan ng דַּרְכֵיכֶם
  choice: Mga literal na daan o rutang wala nang dumaraan
  alternative: “Ang inyong mga lakad” bilang metaporikal na pamumuhay
  rationale: Sa konteksto ng pagkaunti ng populasyon at pagkawasak ng lipunan, mas malamang na literal na mga daan ang tinutukoy, ngunit kinikilala sa talababa ang mas malawak na literal na kahulugan ng parirala.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang mga karaniwang salitang “mababangis na hayop,” “alagang hayop,” at “mga daan,” habang pinanatili ang bigat ng pahayag ng paghatol. Ang bawat talababa ay may katugmang marker sa pangunahing teksto.
