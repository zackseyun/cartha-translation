revisions:
- from: Kapag sinira ko ang inyong panustos na tinapay[a], sampung babae ang magluluto ng inyong tinapay sa iisang pugon at ibabalik nila sa inyo ang tinapay ayon sa timbang. Kakain kayo, ngunit hindi kayo mabubusog.
  to: Kapag sisirain ko ang panustos ng inyong tinapay[a], sampung babae ang maghuhurno ng inyong tinapay sa iisang pugon at ibabalik nila sa inyo ang inyong tinapay ayon sa timbang. Kakain kayo, ngunit hindi kayo mabubusog.
  rationale: Inayos ang aspekto ng unang pandiwa upang ipakita ang prospektibong hatol sa konteksto. Pinalinaw ang idyomang מַטֵּה לֶחֶם sa mas likas na Filipino, at ginawang mas tiyak ang pandiwang tumutukoy sa paghurno. Napanatili ang larawan ng rasyoning tinapay ayon sa timbang at ang kinalabasang hindi pagkabusog.
