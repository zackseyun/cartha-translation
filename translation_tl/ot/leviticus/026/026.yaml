base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: tl
  text: Kapag sisirain ko ang panustos ng inyong tinapay[a], sampung babae ang maghuhurno ng inyong tinapay sa iisang pugon at ibabalik nila sa inyo ang inyong tinapay ayon sa timbang. Kakain kayo, ngunit hindi kayo mabubusog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “tungkod ng tinapay,” isang idyoma para sa panustos o sandigan ng tinapay.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: Kapag sinira ko
  rationale: Ang ב na nakakabit sa infinitive construct ng שׁבר ay bumubuo ng temporal na sugnay. Pinananatili ng “sinira” ang matinding larawan ng paghatol nang hindi ipinahihiwatig na literal na pagdurog ang tinutukoy.
- source_word: מַטֵּה לֶחֶם
  choice: ang inyong panustos na tinapay[a]
  rationale: Literal itong “tungkod ng tinapay,” isang idyoma para sa tinapay bilang sustentong bumubuhay. Likas at malinaw sa Tagalog ang “panustos na tinapay,” habang inilalagay sa talababa ang literal na larawan.
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: sampung babae ang magluluto
  rationale: Tahasang binabanggit ng Hebreo ang sampung babae bilang mga gagawa ng tinapay. Ang “magluluto” ay natural na gamit sa Tagalog para sa pagluluto o paghuhurno ng tinapay sa pugon.
- source_word: בְּתַנּוּר אֶחָד
  choice: sa iisang pugon
  rationale: 'Idiniriin ng “iisang” ang matinding kakulangan: magkakasya sa isang pugon ang tinapay na inihahanda ng sampung babae.'
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: at ibabalik nila sa inyo ang tinapay ayon sa timbang
  rationale: Ang Hiphil ng שוב ay nangangahulugang ibalik o dalhing pabalik. Ang “ayon sa timbang” ay nagpapakita ng mahigpit na pagrasyon dahil sa kakulangan.
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: Kakain kayo, ngunit hindi kayo mabubusog
  rationale: Ang שׂבע ay tumutukoy sa pagkabusog matapos kumain. Malinaw na ipinahahayag ng salin na hindi mapapawi ng kakaunting pagkain ang kanilang gutom.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong larawan ng tinapay at pugon, habang ipinaliwanag sa talababa ang Hebreong idyoma. Ginamit ang “pugon” sa halip na modernong “oven” upang umangkop sa sinaunang tagpo nang manatiling madaling maunawaan.
