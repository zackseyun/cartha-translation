    issue: Ang "magpapakumbaba" ay aktibong anyo para sa יִכָּנַע.
    rationale: Ang Hebreo ay Niphal, "mapapakumbaba" o "magiging hamak/mapagpakumbaba." Ang aktibong salin ay nagdaragdag ng diwa ng kusang pagpapakumbaba na hindi tahasang isinasaad ng anyo ng pandiwa.
  - severity: low
    issue: Hindi magkakatugma ang mga angkla ng talababa at ang saklaw ng kanilang paliwanag.
    rationale: Ang talababa a ay nagpapaliwanag sa "Ako rin" at sa pariralang "lalakad nang salungat," ngunit nakalagay lamang pagkatapos ng "mga kaaway." Ang talababa c naman ay sumasaklaw kapwa sa "o kung magkagayon" at sa hulíng idyoma. Mas malinaw ang magkakahiwalay na angkla.
