id: LEV.26.41
reference: Leviticus 26:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: tl
  text: Ako rin[a] ay lalakad nang salungat sa kanila[b] at dadalhin ko sila sa lupain ng kanilang mga kaaway. O kung magkagayon[c] ay mapapakumbaba ang kanilang pusong hindi tuli[d], at saka nila tatanggapin ang kaparusahan sa kanilang kasalanan[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maging ako.” Nagbibigay-diin ang Hebreo sa katumbas na pagkilos ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay maaari ring isaling “lalakad ako kasama nila nang may pagkapoot” o “lalakad ako laban sa kanila.” Inuulit nito ang wika ng mga sumpa ng tipan sa kabanatang ito.
    reason: lexical_alternative
  - marker: c
    text: Literal na “o kung magkagayon.” Mahirap ang parirala sa Hebreo at maaaring nagpapakilala sa puntong mapapakumbaba ang kanilang puso.
    reason: alternative_reading
  - marker: d
    text: Literal na “ang kanilang pusong hindi tuli,” isang metapora ng tipan para sa panloob na katigasan at karumihan.
    reason: cultural_note
  - marker: e
    text: Maaari ring “tatanggapin nila ang kanilang kasalanan,” “dadalhin nila ang bunga ng kanilang kasalanan,” o “mababayaran ang kanilang kasalanan.” Tinutukoy ng idyomang Hebreo ang pagtanggap o pagdadala ng nararapat na bunga ng pagkakasala.
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: Ako rin
  rationale: 'Pinananatili ang diin at katumbasang kilos ng Diyos: kung paanong sumalungat sila, gayundin siyang kikilos laban sa kanila.'
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: lalakad nang salungat sa kanila
  rationale: Pinananatili ang larawan ng paglakad at ang paulit-ulit na wika ng pagsalungat sa mga sumpa ng tipan sa kabanata.
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: dadalhin ko sila sa lupain ng kanilang mga kaaway
  rationale: Tuwirang ipinahahayag ang sanhiang anyo ng בוא at ang kalagayan ng pagkakatapon sa teritoryo ng mga kaaway.
- source_word: אוֹ אָז
  choice: o kung magkagayon
  rationale: Pinananatili ang mahirap at disjunctive na אוֹ habang natural na ipinakikita sa Tagalog ang posibleng puntong magaganap ang pagpapakumbaba.
- source_word: יִכָּנַע
  choice: magpapakumbaba
  rationale: Sa pusong paksa, natural itong nagsasaad ng pagyuko o pagpapakumbaba sa loob; bagaman maaaring unawaing pasibong 'mapapakumbaba,' hindi dapat mawala ang posibilidad ng kusang pagtugon.
- source_word: לְבָבָם הֶעָרֵל
  choice: ang kanilang pusong hindi tuli
  rationale: Pinananatili ang literal at teolohikal na metapora ng tipan sa halip na palitan lamang ng 'matigas ang ulo' o 'matigas ang puso.'
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: at tatanggapin nila ang kaparusahan sa kanilang kasamaan
  rationale: Ginagawang malinaw ang idyomang tumutukoy sa pagtanggap o pagdadala ng nararapat na bunga ng pagkakasala, nang hindi ipinahihiwatig na nakagagawa sila ng pansariling pantubos.
theological_decisions:
- issue: Ang metaporang הֶעָרֵל na inilalapat sa puso
  choice: pusong hindi tuli
  alternative: pusong matigas / pusong ayaw magsisi
  rationale: Mahalaga ang metapora sa wika ng tipan at sa kaugnayan nito sa Deuteronomio at mga propeta; hindi ito pinatag tungo sa isang interpretatibong paraphrase.
- issue: Kahulugan ng יִרְצוּ אֶת עֲוֺנָם
  choice: tatanggapin nila ang kaparusahan sa kanilang kasamaan
  alternative: magbabayad-sala sila sa kanilang kasamaan / mababayaran ang kanilang kasamaan
  rationale: Ipinakikita ng parirala ang pagtanggap o pagdadala ng kaparusahang bunga ng sala, hindi ang meritoryong pagtubos ng tao sa sarili niyang kasalanan.
- issue: Ugnayan ng אוֹ אָז sa pagpapakumbaba ng puso
  choice: o kung magkagayon
  alternative: o marahil noon / at saka
  rationale: Hindi lubusang nilulutas ang mahirap na sintaks; pinananatili ang disjunctive na puwersa habang binibigyan ng mababasang anyo sa modernong Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang biblikal na larawang “lalakad” at ang metaporang “pusong hindi tuli.” Ginamit ang “kasamaan” para sa עָוֹן sa kontekstong pinagsasama ang sala at pananagutan, at ipinaliwanag sa talababa ang saklaw ng idyoma.
