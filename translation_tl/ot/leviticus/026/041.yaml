  to: Ako rin[a] ay lalakad nang salungat sa kanila[b] at dadalhin ko sila sa lupain ng kanilang mga kaaway. O kung magkagayon[c] ay mapapakumbaba ang kanilang pusong hindi tuli[d], at saka nila tatanggapin ang kaparusahan sa kanilang kasalanan[e].
