  yaml_path: translation/ot/leviticus/026/014.yaml
  text: But if you do not listen to me and do not do all these commandments,[a]
translation:
  language: tl
  text: Ngunit kung hindi kayo makikinig sa akin[a] at hindi ninyo gagawin ang lahat ng utos na ito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “susunod sa akin.” Ang pandiwang Hebreo ay maaaring mangahulugan ng pakikinig na humahantong sa pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ng parirala ang pasubaling salungat sa naunang mga pagpapala; likas sa Filipino ang “Ngunit kung.”
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: hindi kayo makikinig sa akin
  rationale: Pinananatili nito ang pangunahing larawan ng שׁמע, ang pakikinig, habang ipinahihiwatig ng konteksto ang pagsunod. Ang pangmaramihang “kayo” ay tumutugma sa pandiwang Hebreo.
- source_word: וְלֹא תַעֲשׂוּ
  choice: at hindi ninyo gagawin
  rationale: Tuwirang ipinapahayag ang ikalawang negatibong sugnay at pinananatili ang pagkakaiba ng pakikinig at paggawa.
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: ang lahat ng utos na ito
  rationale: Ang “utos” ay natural at marangal na katumbas ng מִצְוֺת sa makabagong Filipino; malinaw na naihahatid ng “lahat” at “na ito” ang כָּל at הָאֵלֶּה.
theological_decisions:
- issue: Kung ang שׁמע ל ay isasaling “makinig sa akin” o “sumunod sa akin”
  choice: makikinig sa akin
  alternative: susunod sa akin
  rationale: Ang Hebreo ay tahasang gumagamit ng wika ng pakikinig, samantalang hiwalay na binabanggit sa kasunod na sugnay ang paggawa ng mga utos. Pinananatili ng salin ang pagkakaibang ito at inilalagay sa talababa ang ipinahihiwatig na pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “kayo/ninyo” ayon sa anyo ng mga pandiwang Hebreo. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pasubaling pangungusap sa kasunod na talata.
