  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: tl
  text: Ilalagay ko ang aking tirahan sa gitna ninyo, at hindi kayo kamumuhian ng aking kaluluwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: aking tahanan
  rationale: Ang מִשְׁכָּן ay tirahan o tahanang pinananahanan; sa kontekstong tipan, tumutukoy ito sa banal na tahanan ng Diyos sa gitna ng bayan nang hindi kinakailangang limitahan sa salitang teknikal na “tabernakulo.”
- source_word: בְּתוֹכְכֶם
  choice: sa gitna ninyo
  rationale: Tuwirang ipinapahayag ang presensiya ng Diyos sa loob ng pamayanan.
- source_word: נַפְשִׁי
  choice: aking kaluluwa
  rationale: Pinananatili ang tahasang antropomorpikong “aking kaluluwa” sa Hebreo at ang teolohikal na tensiyon nito, sa halip na gawing payak na “ako.”
- source_word: תִגְעַל ... אֶתְכֶם
  choice: kayo kasusuklaman
  rationale: Ang געל ay nagpapahayag ng matinding pagtanggi o pagkasuklam; natural at malinaw itong naihahatid ng “kasuklaman.”
theological_decisions:
- issue: Antropomorpikong pahayag na “aking kaluluwa” tungkol sa Diyos
  choice: aking kaluluwa
  alternative: hindi ko kayo kasusuklaman
  rationale: Pinananatili ang anyo at diin ng נַפְשִׁי at hindi tahimik na nilulutas ang antropomorpikong pananalita ng teksto.
- issue: Kahulugan ng משכן
  choice: aking tahanan
  alternative: aking tabernakulo
  rationale: Mas nauunawaan ng karaniwang modernong mambabasa ang “tahanan,” habang nananatili ang pangunahing diwa ng banal na tirahan sa gitna ng Israel.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Ilalagay ko” para sa matibay na pangako, “sa gitna ninyo” para sa communal presence, at pinanatili ang hindi pangkaraniwang “aking kaluluwa” dahil tahasan itong nasa Hebreo.
