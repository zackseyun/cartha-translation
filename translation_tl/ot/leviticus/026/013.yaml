base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: tl
  text: Ako si Yahweh, ang inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto upang hindi na kayo maging mga alipin nila. Binali ko ang mga baras[a] ng inyong pamatok at pinalakad ko kayo nang tuwid ang tindig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pingga ng inyong pamatok.”
    reason: lexical_alternative
  - marker: b
    text: O, “pinalakad ko kayo nang taas-noo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong maramihan ang pangngalan sa Hebreo, tumutukoy ito rito sa iisang Diyos, si Yahweh, ayon sa pormulang tipan.
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: naglabas sa inyo mula sa lupain ng Ehipto
  rationale: Pinananatili nito ang sanhiing diwa ng pandiwa at ang malinaw na pagtukoy sa pagliligtas mula sa Ehipto.
- source_word: מִהְיוֹת לָהֶם עֲבָדִים
  choice: at sa pagiging mga alipin nila
  rationale: Ang עֲבָדִים sa konteksto ng Ehipto ay tumutukoy sa sapilitang pagkaalipin, kaya hindi ito pinalambot bilang “mga lingkod.” Ang “at sa” ay likas na nag-uugnay sa paglaya mula sa lupain at mula sa kalagayan ng pagkaalipin.
- source_word: מֹטֹת עֻלְּכֶם
  choice: mga halang ng inyong pamatok
  rationale: Pinananatili ang konkretong larawan ng mga bahaging kahoy ng pamatok na kumakatawan sa pagkaalipin at pang-aapi.
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: pinalakad ko kayo
  rationale: Isinasalin ang sanhiing anyo ng הלך, hindi lamang bilang “inakay,” upang mapanatili ang ugnayan sa kasunod na paglalarawan ng paraan ng paglakad.
- source_word: קוֹמְמִיּוּת
  choice: tuwid
  rationale: Ipinahahayag nito ang tuwid o tikas na tindig, na kabaligtaran ng pagkakayuko sa ilalim ng pamatok, habang hindi nililimitahan ang kahulugan sa isang idyomatikong pagpapakahulugan.
theological_decisions:
- issue: Kalagayan ng Israel sa Ehipto
  choice: mga alipin
  alternative: mga lingkod
  rationale: Binibigyang-diin ng talata ang paglaya mula sa mapaniil at sapilitang pagkaalipin; ang “mga alipin” ang malinaw na nagpapahayag ng kalagayang iyon.
- issue: Huling larawan ng paglaya at naibalik na dangal
  choice: pinalakad ko kayong tuwid
  alternative: pinalakad ko kayong taas-noo
  rationale: Pinananatili ng pangunahing salin ang pisikal na larawan ng tuwid na tindig at ang pahiwatig ng naibalik na dangal. Inilagay sa talababa ang mas idyomatikong pagbasa upang hindi tahimik na lutasin ang lawak ng larawan.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “pamatok,” isang pamilyar na salitang biblikal na nagpapanatili sa konkretong larawan. Ang “tuwid” ay sadyang maikli upang mapanatili kapwa ang tindig ng katawan at ang diwa ng naibalik na kalayaan at dangal.
