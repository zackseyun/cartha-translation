    rationale: Ang מִהְיוֹת לָהֶם עֲבָדִים ay nagpapahayag ng pagliligtas mula sa pagiging alipin ng mga Ehipsiyo. Ang “upang hindi na kayo maging mga alipin nila” ay malinaw na naghahatid ng resultang ito sa natural na Filipino.
  - severity: medium
