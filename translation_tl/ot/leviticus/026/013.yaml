    rationale: Ang מֹטֹת ay tumutukoy sa mga baras/pingga ng pamatok. Sa Filipino, ang “mga halang” ay hindi karaniwang tumutukoy sa bahaging ito ng pamatok at maaaring magpahiwatig lamang ng sagabal.
