  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: tl
  text: At kung sa pamamagitan ng mga ito ay hindi pa rin kayo magpapasailalim sa pagtutuwid ko, kundi patuloy kayong mamumuhay nang salungat sa akin,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mamumuhay nang may pakikipagsalungatan sa akin.” Bihira ang salitang Hebreo at maaari itong tumukoy sa pagsalungat o mapanlabang pakikitungo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: sa pamamagitan ng mga ito
  rationale: Instrumental ang בְּ at tumutukoy ang demonstratibo sa mga naunang kaparusahan o pagdidisiplina.
- source_word: תִוָּסְרוּ לִי
  choice: magpapatuwid sa akin
  rationale: Ang Niphal ng יסר ay nagsasaad ng pagtanggap ng disiplina o pagtutuwid. Likas sa makabagong Tagalog ang aktibong anyong may kusang pagtanggap, at ipinakikita ng “sa akin” na ang PANGINOON ang pinagmumulan ng pagtutuwid.
- source_word: וַהֲלַכְתֶּם
  choice: kundi patuloy kayong mamumuhay
  rationale: Ang “lumakad” ay idyomang Hebreo para sa paraan ng pamumuhay. Ipinahahayag ng “kundi” ang pagsalungat sa naunang sugnay, at ng “patuloy” ang pagpupumilit sa gayong asal.
- source_word: עִמִּי קֶרִי
  choice: nang salungat sa akin
  rationale: Ang bihirang pangngalang קֶרִי, kasama ng עִמִּי, ay naglalarawan ng salungat o mapanlabang pakikitungo sa Diyos. Malinaw at likas sa Tagalog ang “salungat sa akin,” habang pinananatili ng talababa ang posibleng diwa ng pagkapoot.
theological_decisions:
- issue: Ang idyomang pangtipan na עִמִּי קֶרִי
  choice: mamumuhay nang salungat sa akin
  alternative: mamumuhay nang may pagkapoot sa akin
  rationale: Pinananatili ng salin ang relasyonal at sadyang pagsalungat sa Diyos nang hindi ito nililimitahan sa isang tiyak na doktrinal na pagpapakahulugan. Dahil bihira at pinagtatalunan ang eksaktong diwa ng קֶרִי, inilagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mamumuhay” para sa idyomang “lalakad,” at “magpapatuwid” upang natural na maipahayag ang pagtanggap sa disiplina habang nananatiling malinaw na mula sa Diyos ang pagtutuwid.
