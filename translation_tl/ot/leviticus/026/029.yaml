source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵי/כֶ֑ם וּ/בְשַׂ֥ר בְּנֹתֵי/כֶ֖ם תֹּאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: tl
  text: At kakainin ninyo ang laman ng inyong mga anak na lalaki, at kakainin ninyo ang laman ng inyong mga anak na babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: At kakainin ninyo
  rationale: Ang Qal na pandiwa sa ikalawang panauhang maramihan, na may prefixed waw, ay may puwersang prediktibo sa sunod-sunod na mga sumpa ng tipan. Natural sa modernong Tagalog ang “kakainin ninyo,” at tahasang isinasalin ang pang-ugnay bilang “At.”
- source_word: בְּשַׂר
  choice: ang laman
  rationale: Ang בָּשָׂר ay tumutukoy sa laman ng katawan. Mas tuwiran at hindi mapagpalambot ang “laman” kaysa “karne” sa kakila-kilabot na kontekstong ito.
- source_word: בְּנֵיכֶם
  choice: ng inyong mga anak na lalaki
  rationale: Partikular na tumutukoy ang anyong panlalaking maramihan sa mga anak na lalaki; pinananatili ito dahil hiwalay na binabanggit sa kasunod na sugnay ang mga anak na babae.
- source_word: וּבְשַׂר
  choice: at ... ang laman
  rationale: Pinananatili ang inuulit na pangngalan at pang-ugnay upang maingatan ang paralelismo at matinding diin ng Hebreo.
- source_word: בְּנֹתֵיכֶם
  choice: ng inyong mga anak na babae
  rationale: Tuwirang isinasalin ang “inyong mga anak na babae,” na nagpapanatili sa hayagang pagtutugma ng mga anak na lalaki at babae.
- source_word: תֹּאכֵלוּ
  choice: kakainin ninyo
  rationale: Inuulit ang pandiwa gaya sa Hebreo upang mapanatili ang diin at magkatimbang na kayarian ng dalawang sugnay.
theological_decisions:
- issue: Paglalarawan sa kanibalismo bilang sumpa ng tipan
  choice: 'Tuwirang prediktibong babala: “kakainin ninyo ang laman” ng mga anak na lalaki at babae'
  alternative: Isang pinalambot o eupemistikong salin
  rationale: Literal at matinding babala ang talata sa konteksto ng mga sumpa ng tipan. Hindi ito dapat palambutin o dagdagan ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “laman” upang panatilihin ang hilaw at kakila-kilabot na diwa, at inulit ang buong pandiwang parirala upang tularan ang paralelismo ng Hebreo.
