source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: tl
  text: Huwag kayong gumawa ng mga diyus-diyosan para sa inyong sarili. Huwag kayong magtayo ng nililok na imahen o nakatayong bato para sa inyong sarili. Huwag din kayong maglagay sa inyong lupain ng batong may larawan[a] upang yumukod dito, sapagkat ako si Yahweh[b] na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “batong inukit” o “batong imahen.” Pinagtatalunan ang eksaktong kahulugan ng Hebreong אֶבֶן מַשְׂכִּית, ngunit tumutukoy ito sa isang bagay na yari sa bato na kaugnay ng ipinagbabawal na pagsamba.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: YHWH; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: mga diyus-diyosan
  rationale: Ito ang malinaw at likas na katawagan sa modernong Tagalog para sa mga idolo o huwad na diyos. Hindi idinagdag sa pangunahing teksto ang pehoratibong diwang ‘walang kabuluhan,’ sapagkat hindi iyon kailangang gawing tahasan dito.
- source_word: פֶסֶל
  choice: nililok na imahen
  rationale: Pinananatili nito ang kongkretong diwa ng isang imaheng hinubog sa pamamagitan ng paglilok at inihihiwalay ito sa mas malawak na ‘diyus-diyosan.’
- source_word: מַצֵּבָה
  choice: nakatayong bato
  rationale: Tumutukoy ito sa batong itinayo nang patayo bilang monumento o bagay na panrelihiyon. Ang salin ay kongkreto at hindi nagdaragdag ng kahulugang ‘sagrado’ na hindi tahasang nasa pangngalan.
- source_word: אֶבֶן מַשְׂכִּית
  choice: batong may larawan
  rationale: Ipinahihiwatig ng parirala ang isang batong may nakaukit o nakalarawang anyo, ngunit pinagtatalunan ang eksaktong detalye. Pinananatili ng salin ang pagkakaiba nito sa פֶסֶל at inilalagay sa talababa ang mga posibleng kahulugan.
- source_word: תַעֲשׂוּ לָכֶם
  choice: gagawa ... para sa inyong sarili
  rationale: Pinananatili nito kapuwa ang pandiwang ‘gumawa’ at ang reflexive-benefactive na לָכֶם.
- source_word: תָקִימוּ לָכֶם
  choice: magtatayo para sa inyong sarili
  rationale: Ang Hiphil ng קום ay nangangahulugang magtayo o maglagay nang patayo; likas sa Tagalog ang ‘magtatayo’ sa kontekstong ito.
- source_word: תִתְּנוּ בְּאַרְצְכֶם
  choice: maglalagay sa inyong lupain
  rationale: Direkta at natural nitong ipinahahayag ang paglalagay ng bagay sa loob ng lupaing saklaw ng tipan.
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: upang yumukod dito
  rationale: Ipinakikita ng ‘upang’ ang layunin ng infinitive, at ng ‘yumukod dito’ ang kilos ng pagpapatirapa o pagsamba sa bagay. Hindi pinili ang posibleng pagbasa na ‘sumamba sa ibabaw nito,’ sapagkat hindi iyon ang mas malamang sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh’ sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: sapagkat ako si Yahweh na inyong Diyos
  rationale: Ang ‘sapagkat’ ay malinaw na nagpapakita na ang pagkakakilanlan ni Yahweh ang batayan ng mga pagbabawal; natural sa Tagalog ang ‘ako si Yahweh.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagkakaiba-iba ng mga bagay na ginagamit sa ipinagbabawal na pagsamba
  choice: Pinag-iba ang ‘mga diyus-diyosan,’ ‘nililok na imahen,’ ‘nakatayong bato,’ at ‘batong may larawan.’
  alternative: Pagsamahin ang lahat bilang ‘mga diyus-diyosan’ o ‘mga imahen.’
  rationale: Magkakaibang katawagang Hebreo ang sunod-sunod na ginamit sa talata. Ang pagpapanatili sa mga pagkakaiba ay gumagalang sa espesipikong saklaw ng pagbabawal nang hindi nagdaragdag ng sektaryang paliwanag.
- issue: Pinatutungkulan ng pagyukod sa לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: yumukod sa batong iyon
  alternative: sumamba sa ibabaw ng bato
  rationale: Maaaring magtaglay ng ibang ugnayang lokal ang pang-ukol, ngunit sa kontekstong panrelihiyon mas natural na ang bato ang pinatutungkulan ng pagyukod. Hindi ito pinalawak sa isang tiyak na doktrina tungkol sa mga imahen.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maramihang ‘kayo’ ayon sa mga pandiwang Hebreo. Hinati sa tatlong pangungusap ang mahaba at magkakaugnay na pagbabawal upang maging malinaw sa karaniwang mambabasa, habang pinananatili ang ayos at lohika ng orihinal. Inilagay ang mga talababa sa mismong mga salitang tinatalakay, sa halip na sundin ang tila napagpalit na lokasyon ng mga marker sa consultation layer.
