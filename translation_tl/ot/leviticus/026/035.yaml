  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: tl
  text: Sa lahat ng araw ng pagkatiwangwang nito, magpapahinga ang lupa—ang pahingang hindi nito natamasa sa panahon ng inyong mga Sabbath[a][b], habang naninirahan kayo rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na pagkakasalin: “magpapahinga ito para sa hindi nito naipahinga sa panahon ng inyong mga Sabbath.” Inuulit sa Hebreo ang pandiwang “magpahinga” upang bigyang-diin ang diwa.'
    reason: lexical_alternative
  - marker: b
    text: Ang “inyong mga Sabbath” dito ay tumutukoy sa mga pahingang nauukol sa lupa, lalo na sa mga taon ng Sabbath na binabanggit sa kalapit na konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל יְמֵי הַשַּׁמָּה
  choice: Sa lahat ng araw na tiwangwang ito
  rationale: Pinananatili ang kabuuang temporal na diwa ng כָּל יְמֵי at malinaw na iniuugnay sa lupa ang kalagayan ng pagkatiwangwang.
- source_word: תִּשְׁבֹּת
  choice: magpapahinga ang lupa
  rationale: Ang pandiwa ay pambabaeng isahan at tumutukoy sa lupa. Tahasang binanggit ang “lupa” upang maging malinaw at natural sa Tagalog.
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: ang pahingang hindi nito natamasa
  rationale: Ginagawang natural sa Tagalog ang layon ng pandiwa habang pinananatili ang pag-uulit ng ideya ng שׁבת, ‘magpahinga.’
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: sa panahon ng inyong mga Sabbath
  rationale: Malapit sa anyong Hebreo at hindi nililimitahan sa saling “mga taon ng Sabbath”; ipinapaliwanag sa talababa ang partikular na diwa sa konteksto.
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: habang naninirahan kayo rito
  rationale: Natural na temporal na parirala sa modernong Tagalog; ang “rito” ay tumutukoy sa lupa.
theological_decisions:
- issue: Ang tinutukoy ng “inyong mga Sabbath”
  choice: Pinanatili ang “inyong mga Sabbath” sa teksto at ipinaliwanag na tumutukoy ito sa mga pahingang nauukol sa lupa.
  alternative: “mga taon ng Sabbath”
  rationale: Pinananatili nito ang leksikal na lawak ng pangmaramihang שַׁבָּת habang hinahayaan ang konteksto at talababa na tukuyin ang mga sabbatikong pahinga ng lupa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Tahasang ginamit ang “ang lupa” sa halip na paulit-ulit na panghalip upang maiwasan ang kalabuan, ngunit pinanatili ang temporal na kabuuan, pag-uulit ng diwa ng pahinga, at sabbatikong terminolohiya ng Hebreo.
