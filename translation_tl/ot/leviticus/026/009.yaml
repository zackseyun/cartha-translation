  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: tl
  text: Haharap ako sa inyo[a], gagawin ko kayong mabunga at pararamihin ko kayo, at pagtitibayin ko ang aking tipan sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Lilingapin ko kayo.” Literal na “Haharap ako sa inyo” ang Hebreo; sa kontekstong ito, ipinahihiwatig nito ang mabuting paglingap ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: Haharap ako sa inyo
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong פנה, na nangangahulugang bumaling o humarap sa isang tao. Sa konteksto ng pagpapala, ipinahihiwatig nito ang mabuting paglingap ng Diyos nang hindi iyon tahasang idinaragdag sa pangunahing teksto.
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: gagawin ko kayong mabunga
  rationale: Ang causative na anyo ng פרה ay nagsasaad na ang Diyos ang magpapabunga sa bayan. Pinananatili rin ng “mabunga” ang pamilyar na pananalita ng pagpapala sa Pentateuco.
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: pararamihin ko kayo
  rationale: 'Tuwirang ipinapahayag nito ang causative na diwa ng רבה: gagawing marami o higit na makapal ang bilang ng bayan.'
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי אִתְּכֶם
  choice: pagtitibayin ko ang aking tipan sa inyo
  rationale: Kapag ginamit sa tipan, ang Hiphil ng קום ay maaaring mangahulugang itatag, pagtibayin, o panatilihing may bisa. Ang “pagtitibayin” ay natural sa Filipino at angkop sa umiiral na ugnayang tipan.
theological_decisions:
- issue: Kung tahasang sasabihing may pagsang-ayon o paglingap ang pagharap ng Diyos
  choice: Panatilihin sa pangunahing teksto ang konkretong “Haharap ako sa inyo.”
  alternative: “Lilingapin ko kayo” o “Titingnan ko kayo nang may pagsang-ayon.”
  rationale: Malinaw sa konteksto na pagpapala ang ipinahihiwatig, ngunit ang pandiwang Hebreo mismo ay karaniwang nangangahulugang bumaling o humarap. Inilalagay sa talababa ang paborableng diwa upang hindi mawala ang konkretong larawan.
- issue: Pagpapanatili sa pormula ng pagpapabunga at pagpaparami
  choice: “gagawin ko kayong mabunga at pararamihin ko kayo”
  alternative: “gagawin ko kayong masagana at palalakihin ang inyong bilang”
  rationale: Pinananatili ng napiling salin ang pagkakaugnay nito sa paulit-ulit na pormula ng pagpapala at pangako sa Pentateuco, sa halip na gawin itong isang demograpikong pahayag lamang.
- issue: Kahulugan ng pagtatayo o pagpapatibay ng tipan
  choice: “pagtitibayin ko ang aking tipan”
  alternative: “itatatag ko ang aking tipan”
  rationale: Maaaring saklawin ng Hebreong pahayag ang pagtatatag o pagkumpirma sa tipan. Sa kontekstong may dati nang tipanang ugnayan, natural ang “pagtitibayin,” ngunit hindi nito ipinapasok ang isang natatanging doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tipan” bilang karaniwang salitang biblikal para sa בְּרִית. Pinanatili ang konkretong larawang Hebreo at ang pormula ng “mabunga” at “pararamihin,” habang iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
