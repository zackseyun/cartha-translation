base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: tl
  text: Wawasakin ko ang inyong mga sambahan sa matataas na lugar[a], puputulin ko ang inyong mga altar ng insenso, ipapatong ko ang inyong mga bangkay sa mga bangkay ng inyong mga diyus-diyosan[b], at kasusuklaman kayo ng aking kaluluwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang inyong mga haliging para sa pagsamba sa araw.” Ang salitang Hebreo ay tumutukoy sa mga kultikong bagay na kaugnay ng ipinagbabawal na pagsamba; pinagtatalunan ang eksaktong uri ng mga ito.
    reason: lexical_alternative
  - marker: b
    text: Inuulit sa Hebreo ang salitang “mga bangkay” para sa mga tao at sa kanilang mga diyus-diyosan, upang idiin na walang buhay at kahiya-hiya ang mga diyus-diyosan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: Wawasakin ko
  rationale: Malakas at likas na katumbas ng Hiphil ng שׁמד; malinaw na ipinahahayag ang ganap na pagwasak sa mga bagay na kasunod.
- source_word: בָּמֹתֵיכֶם
  choice: ang inyong matataas na sambahan
  rationale: Ang בָּמוֹת ay mga kultikong pook, karaniwang nasa mataas na lugar. Ang 'matataas na sambahan' ay mas mauunawaan sa modernong Filipino kaysa sa literal ngunit malabong 'matataas na lugar.'
- source_word: הִכְרַתִּי
  choice: ibabagsak ko
  rationale: Ipinapahiwatig ng כרת ang pagputol o pagpabagsak. Sa mga kultikong bagay, pinananatili ng 'ibabagsak' ang kongkretong larawan nang hindi ipinapalagay na tiyak na haligi ang mga ito.
- source_word: חַמָּנֵיכֶם
  choice: ang inyong mga altar ng insenso
  rationale: Natutukoy nito ang mga kultikong bagay na maaaring kaugnay ng insenso o pagsamba sa araw. Ginamit ang malinaw na functional rendering sa teksto, habang nasa talababa ang tunay na lexical na pag-aalinlangan.
- source_word: פִּגְרֵיכֶם ... פִּגְרֵי גִּלּוּלֵיכֶם
  choice: ang inyong mga bangkay ... sa mga bangkay ng inyong mga diyus-diyosan
  rationale: Inuulit ang 'mga bangkay' upang tularan ang pag-uulit ng פגר at idiin na walang buhay at kahiya-hiya ang mga diyus-diyosan.
- source_word: גִּלּוּלֵיכֶם
  choice: inyong mga diyus-diyosan
  rationale: Ito ang pinakamalinaw na modernong Filipino para sa mapanlait na katawagan sa mga idolo; naipahihiwatig din ng konteksto at ng 'mga bangkay' ang paghamak.
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: kasusuklaman kayo ng aking kaluluwa
  rationale: Pinananatili ang tahasang 'aking kaluluwa' at ang matinding pagkasuklam ng Hebreo, sa halip na pakinisin ito bilang simpleng 'kasusuklaman ko kayo.'
theological_decisions:
- issue: Antropopatikong paglalarawan sa matinding pagkasuklam ng Diyos
  choice: kasusuklaman kayo ng aking kaluluwa
  alternative: kasusuklaman ko kayo
  rationale: Tahasan sa Hebreo ang נַפְשִׁי, 'aking kaluluwa.' Ang pagpapanatili nito ay nag-iingat sa retorikal na bigat at teolohikal na tensiyon ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mabagsik na larawan, ang pag-uulit ng 'mga bangkay,' at ang ekspresyong 'aking kaluluwa.'
