base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: tl
  text: Ikakalat ko kayo sa gitna ng mga bansa, at bubunutin ko ang tabak upang habulin kayo.[a] Magiging tiwangwang ang inyong lupain, at magiging mga guho ang inyong mga lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bubunutin ko ang tabak kasunod ninyo.”
    reason: Pinananatili nito ang mas literal na anyo ng אַחֲרֵיכֶם habang ipinapaliwanag ng pangunahing teksto ang diwang pagtugis.
lexical_decisions:
- source_word: אֱזָרֶה
  choice: Ikakalat ko
  rationale: Ang Hiphil ng זרה ay tumutukoy sa pagpapangalat o pagpapakalat. Likas sa modernong Tagalog ang “ikakalat” at malinaw nitong pinananatili ang larawan ng paghatol at pagkatapon.
- source_word: בַגּוֹיִם
  choice: sa gitna ng mga bansa
  rationale: Ang גּוֹיִם ay mga bansa o mga bayan; ang “mga bansa” ang pinakanababagay sa konteksto ng pagkakatapon sa mga banyagang lupain at hindi nagdadala ng di-kailangang mas huling konotasyon ng “mga Hentil.”
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: bubunutin ko ang tabak
  rationale: Ang idyoma ay tumutukoy sa pagbunot ng tabak mula sa kaluban. Pinananatili ng salin ang kongkretong larawang militar at ang tahasang pagkilos ng Diyos.
- source_word: אַחֲרֵיכֶם
  choice: upang habulin kayo
  rationale: Literal itong “sa likuran ninyo” o “kasunod ninyo,” ngunit sa konteksto ng nakabunot na tabak ay malinaw na tumutukoy sa marahas na pagtugis. Ang “upang habulin kayo” ay natural at tumpak sa Tagalog.
- source_word: שְׁמָמָה
  choice: tiwangwang
  rationale: Ipinahihiwatig ng pangngalan ang ganap na pagkawasak at pagkatiwangwang. Ang “magiging tiwangwang” ay natural sa Tagalog habang pinananatili ang mabigat na tono ng sumpa sa tipan.
- source_word: חָרְבָּה
  choice: mga guho
  rationale: Tumutukoy ang salita sa kalagayang wasak o sa mga guho. Ang “magiging mga guho ang inyong mga lungsod” ay malinaw na naghahayag ng resultang pagkawasak.
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: magiging
  rationale: Bagaman maaaring isaling “ay magiging” o simpleng “ay,” ipinahihiwatig rito ng היה ang pagpasok sa isang bagong kalagayan bilang bunga ng paghatol; malinaw itong naipapahayag ng “magiging.”
theological_decisions:
- issue: Wika ng paghatol sa tipan na naglalarawan ng pagkakatapon at pagtugis ng hukbo
  choice: 'Panatilihin ang tuwirang unang-panauhang pagkilos ng Diyos: “Ikakalat ko … bubunutin ko.”'
  alternative: Gumamit ng balintiyak o di-tahasang pananalita upang palambutin ang pagkilos ng Diyos.
  rationale: Tahasang iniuugnay ng Hebreo sa Diyos ang mga sumpang ito ng tipan. Hindi dapat palambutin o gawing di-tiyak ng salin ang pagkilos na iyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tabak,” “tiwangwang,” at “mga guho” upang mapanatili ang taimtim at kongkretong larawan ng paghatol nang hindi nagiging lipas o labis na teknikal.
