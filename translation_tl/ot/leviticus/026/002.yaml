  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: tl
  text: Ingatan ninyo ang aking mga Sabbath at igalang ninyo ang aking santuwaryo[a]. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katakutan ang aking santuwaryo” o “mamangha nang may pagpipitagan sa aking santuwaryo.” Ang pandiwang Hebreo ay maaaring mangahulugang matakot, gumalang, o mamangha ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: aking mga Sabbath
  rationale: Pinananatili ang anyong maramihan at ang unang panauhang panuring. Ang “mga Sabbath” ay maaaring sumaklaw sa kabuuan ng mga banal na panahong Sabbath, hindi lamang sa isang lingguhang araw.
- source_word: תִּשְׁמֹרוּ
  choice: Ingatan ninyo
  rationale: Ang שׁמר ay nangangahulugang ingatan, sundin, o masusing tuparin. Ang “ingatan” ay likas sa Filipino at nagpapanatili sa diwa ng maingat na pagtalima.
- source_word: וּמִקְדָּשִׁי
  choice: at aking santuwaryo
  rationale: Ang מִקְדָּשׁ ay banal na lugar o santuwaryo. Ang “santuwaryo” ay malinaw at karaniwang katawagan sa lugar na banal para sa presensiya at pagsamba kay Yahweh.
- source_word: תִּירָאוּ
  choice: igalang ninyo
  rationale: Ang ירא ay maaaring magpahayag ng takot, pagpipitagan, o pagkamangha. Sa utos tungkol sa santuwaryo, natural na ipinahahayag ng “igalang” ang banal at taimtim na pagpipitagan, habang ang lawak ng Hebreo ay itinatala sa talababa.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Direktang pinananatili ang pormula ng banal na pagpapakilala at ang personal na pangalang יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Diwa ng ירא kaugnay ng santuwaryo
  choice: igalang
  alternative: katakutan; pagpitaganan; kamanghaan
  rationale: Ipinahihiwatig ng konteksto ang banal na paggalang, ngunit hindi inaalis ang saklaw ng salitang Hebreo na maaaring magsaad ng takot o pagkamangha; kaya inilalahad ang mga posibilidad sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Sabbath” upang mapanatili ang natatanging katawagang tipan at ang anyong maramihan; ginamit ang “santuwaryo” bilang pamilyar na terminong panrelihiyon. Ang dalawang magkatambal na utos ay pinanatili, kasunod ng maikli at mariing pormulang “Ako si Yahweh.”
