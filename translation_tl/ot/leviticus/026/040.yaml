revisions:
- from: Ngunit kung ipagtatapat nila ang kanilang kasamaan at ang kasamaan ng kanilang mga ama, pati ang kanilang pagtataksil sa akin[a] at ang paglakad nila nang salungat sa akin,[b]
  to: Ngunit kung ipagtatapat nila ang kanilang kasamaan at ang kasamaan ng kanilang mga ama, ang kanilang kawalang-katapatan—na naging di-tapat sila sa akin—at pati na ang paglakad nila nang salungat sa akin,[a]
