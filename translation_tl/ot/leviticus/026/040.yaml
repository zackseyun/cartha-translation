  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: tl
  text: Ngunit kung ipagtatapat nila ang kanilang kasamaan at ang kasamaan ng kanilang mga ama, ang kanilang kawalang-katapatan—na naging di-tapat sila sa akin—at pati na ang paglakad nila nang salungat sa akin,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “namuhay sila nang mapanlaban sa akin.” Ang literal na parirala ay “lumakad silang kasama ko sa qeri.” Mahirap tiyakin ang eksaktong kahulugan ng qeri, na paulit-ulit na ginagamit sa kabanatang ito para sa asal na salungat o mapanlaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: Ngunit kung ipagtatapat nila
  rationale: Ang Hitpael ng ידה ay nangangahulugang hayagang kilalanin o ipagtapat ang kasalanan. Sa daloy ng konteksto, ipinagpapatuloy nito ang kundisyong nagsimula sa naunang talata, kaya natural sa Filipino ang “kung ipagtatapat nila.”
- source_word: עֲוֺנָם
  choice: ang kanilang kasamaan
  rationale: Maaaring tumukoy ang עָוֹן sa kasamaan, pagkakasala, o pananagutan. Dito, ang mismong masamang gawa na dapat nilang ipagtapat ang pangunahing diwa.
- source_word: עֲוֺן אֲבֹתָם
  choice: ang kasamaan ng kanilang mga ama
  rationale: Pinananatili ang tahasang panlalaking katawagang אֲבֹתָם at ang kolektibong dimensiyon ng pagkilala sa kasalanan ng mga naunang salinlahi.
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: pati ang kanilang pagtataksil sa akin
  rationale: Ang pangngalan at pandiwa mula sa ugat מעל ay kapuwa nagpapahiwatig ng pagsira sa katapatan, lalo na sa tipan. Ginamit ang “pagtataksil” upang maipakita ang bigat at relasyonal na katangian nito; pinaikli ang pag-uulit sa pangunahing teksto para sa likas na Filipino, habang ipinaliliwanag ito sa talababa.
- source_word: וְאַף
  choice: pati ... at
  rationale: Nagdaragdag ito ng isa pang bagay na dapat ipagtapat. Ang “pati” ay malinaw at likas na panandang pandagdag sa Filipino.
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: ang paglakad nila nang salungat sa akin
  rationale: Pinananatili ng “paglakad” ang karaniwang biblikal na talinghaga para sa asal o pamumuhay. Ang mahirap na salitang קֶרִי ay isinaling “salungat” upang mapanatili ang diwa ng mapanlabang pagsalungat at ang katumbasang gamit nito sa buong kabanata.
theological_decisions:
- issue: Sama-samang pagtatapat na kabilang ang kasamaan ng mga ama
  choice: Pinanatili ang “ang kasamaan ng kanilang mga ama.”
  alternative: ang mga kasalanan ng kanilang mga ninuno; ang pananagutan ng kanilang mga ama na kanilang ibinahagi
  rationale: Tahasan sa Hebreo ang pagtatapat kapuwa ng sarili nilang kasamaan at ng kasamaan ng kanilang mga ama. Hindi ito pinalambot bilang mga bunga lamang ng nakaraan at hindi rin dinagdagan ng paliwanag tungkol sa paraan ng pakikibahagi nila rito.
- issue: Kahulugan ng קֶרִי
  choice: salungat
  alternative: may pagkapoot; mapanlaban; matigas ang ulong sumalungat
  rationale: Hindi tiyak ang eksaktong kulay ng pambihirang salitang ito. Ang “salungat” ay nagpapanatili sa lawak ng kahulugan at sa magkatugmang pananalita tungkol sa kilos ng Israel at ng Diyos sa kabanata nang hindi nagpapasya nang lampas sa ebidensiya.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “mga ama” dahil tahasan itong nasa Hebreo, at ang “paglakad” bilang mahalagang talinghaga para sa pamumuhay. Iniwasan ang sobrang teknikal na “pagsalangsang” at ang mas lumang ayos ng pangungusap.
