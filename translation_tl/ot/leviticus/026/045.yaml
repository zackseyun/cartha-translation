  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: tl
  text: Ngunit aalalahanin ko alang-alang sa kanila ang tipan sa kanilang mga ninuno[a], na inilabas ko mula sa lupain ng Ehipto sa harap ng mga bansa, upang ako ang maging Diyos nila. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang tipan sa mga nauna,” na tumutukoy sa naunang salinlahing inilabas mula sa Ehipto; maaari ring isaling “ang tipan sa kanilang mga ninuno.”
    reason: Pinananatili ang masiksik at bahagyang malabong pananalita ng Hebreo at itinatala ang literal na alternatibo.
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Ngunit aalalahanin ko
  rationale: Maaaring simpleng “At,” ngunit ang “Ngunit” ay likas na nagpapakita ng pagbaling mula sa paghatol tungo sa tapat na pag-alaala ng Diyos sa konteksto.
- source_word: לָהֶם
  choice: alang-alang sa kanila
  rationale: Pinananatili nito ang diwa ng לָהֶם bilang pag-alaalang nakatuon sa kanilang kapakanan, hindi lamang pag-alala sa kanila.
- source_word: בְּרִית רִאשֹׁנִים
  choice: ang tipan ko sa kanilang mga ninuno
  rationale: Ang רִאשֹׁנִים ay pang-uring ginamit bilang pangngalan, “mga nauna.” Ipinakikita ng kasunod na sugnay na mga taong inilabas sa Ehipto ang tinutukoy. Idinagdag ang “ko” bilang likas na Tagalog na paglilinaw sa relasyong ipinahihiwatig ng Hebreo, hindi bilang bagong referent.
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: na inilabas ko
  rationale: Ang panghalip na kaugnay ay tumutukoy sa mga ninuno o naunang salinlahi, hindi sa tipan.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang pormal at makasaysayang pormula ng paglabas mula sa Ehipto.
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: sa harap ng mga bansa
  rationale: Natural sa modernong Tagalog at pinananatili ang pampubliko at nasaksihang katangian ng pagliligtas.
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: upang ako ang maging Diyos nila
  rationale: Likas na Tagalog para sa pormulang pangtipan at malinaw na ang Diyos ang simuno ng pagiging Diyos nila.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang banal na pangalan bilang Yahweh sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Tinutukoy ng “tipan sa mga nauna”
  choice: Ang tipan sa kanilang mga ninuno o naunang salinlahing inilabas sa Ehipto
  alternative: Ang “unang tipan” bilang isang abstraktong kaayusang pangtipan
  rationale: Ang kasunod na “na inilabas ko mula sa lupain ng Ehipto” ay tumutukoy nang higit na natural sa mga tao. Gayunman, pinananatili sa talababa ang literal na kalabuan ng “mga nauna.”
- issue: Kasarian ng רִאשֹׁנִים
  choice: mga ninuno
  alternative: mga nauna / naunang salinlahi
  rationale: Walang karaniwang likas na katumbas sa Tagalog na nagtatakda ng panlalaking kasarian gaya ng “forefathers.” Ang “mga ninuno” ay tumpak at hindi nagpapasok ng di-kailangang espesipikasyon, habang ang literal na anyo ay inilalahad sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “alang-alang sa kanila” upang maipahayag ang benepaktibong לָהֶם, at “sa harap ng mga bansa” bilang likas na katumbas ng idyomang “sa paningin ng mga bansa.”
