base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: tl
  text: Babasagin ko ang kapalaluan ng inyong lakas, at gagawin kong parang bakal ang inyong kalangitan[a] at parang bronse[b] ang inyong lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inyong himpapawid.” Nasa anyong maramihan ang Hebreo, ngunit madalas itong tumutukoy sa kalangitan o himpapawid sa itaas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tanso.” Ang salitang Hebreo ay maaaring tumukoy sa tanso o bronse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: Babasagin ko
  rationale: Ang שׁבר ay nangangahulugang “basagin” o “durugin.” Likas at tuwirang naipapahayag ng “babasagin” ang matinding pagpapababa sa mapagmataas na lakas nang hindi dinaragdagan ang tindi ng Hebreo.
- source_word: גְּאוֹן עֻזְּכֶם
  choice: ang kapalaluan ng inyong lakas
  rationale: Maaaring tumukoy ang גָּאוֹן sa kapalaluan, kadakilaan, o kataasan, at ang עֹז ay lakas o kapangyarihan. Pinananatili ng salin ang siksik at bahagyang bukás na ugnayang genitibo ng Hebreo, samantalang ang “kapalaluan” ay angkop sa konteksto ng paghuhukom sa paghihimagsik.
- source_word: וְנָתַתִּי
  choice: at gagawin kong
  rationale: Bagaman karaniwang “ibigay” o “ilagay” ang נתן, sa kayariang ito ay ipinahihiwatig nito ang paggawa sa isang bagay na maging tulad ng isa pa. Natural itong naipapahayag sa Filipino ng “gagawin kong.”
- source_word: שְׁמֵיכֶם
  choice: ang inyong kalangitan
  rationale: Nasa anyong maramihan ang salitang Hebreo ngunit karaniwan itong tumutukoy sa langit o himpapawid sa itaas. Ang “kalangitan” ay natural, marangal, at nababagay sa larawang patula.
- source_word: כַּבַּרְזֶל
  choice: parang bakal
  rationale: Inilalarawan ng paghahambing ang kalangitan bilang matigas at hindi nagpapadaan ng ulan. Tuwirang pinananatili ng “parang bakal” ang metapora.
- source_word: אַרְצְכֶם
  choice: ang inyong lupain
  rationale: Maaaring mangahulugan ang אֶרֶץ ng lupa, lupain, o daigdig. Sa kontekstong tipan at agrikultural, ang “lupain” ang pinakamalinaw na tumutukoy sa lupaing sinasaka at teritoryong nasa ilalim ng paghuhukom.
- source_word: כַּנְּחֻשָׁה
  choice: parang bronse
  rationale: Ang נְחֻשָׁה ay maaaring tumukoy sa bronse o tanso. Pinili ang “bronse” upang malinaw na ihatid ang larawan ng matigas at hindi mabungang lupain, habang inilalagay sa talababa ang leksikal na alternatibo.
theological_decisions:
- issue: Lakas ng metapora sa sumpa ng tipan
  choice: Pinananatili ang larawan ng kalangitang parang bakal at lupaing parang bronse.
  alternative: Ipaliwanag nang tuwiran na hindi uulan at hindi mamumunga ang lupa.
  rationale: Sa konteksto, ipinahihiwatig ng mga larawan ang tagtuyot at pagkabaog ng lupain bilang paghuhukom ng tipan. Hindi ito ginawang tahasang paliwanag sa pangunahing teksto upang mapanatili ang talinghaga at puwersa ng orihinal.
- issue: Kahulugan ng “kapalaluan ng inyong lakas”
  choice: Pinanatili ang siksik na pariralang maaaring tumukoy sa mapagmataas na pagtitiwala sa lakas o sa lakas na ipinagmamalaki.
  alternative: “Ang pagmamalaki ninyo sa sarili ninyong lakas.”
  rationale: Mas malinaw ang alternatibo ngunit mas makitid ang kahulugan nito. Pinananatili ng napiling salin ang tunay na saklaw at tensiyon ng pariralang Hebreo.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang patulang himig. Pinanatili ang parallel na ayos at kongkretong metapora ng Hebreo; iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
