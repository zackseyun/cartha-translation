base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: tl
  text: Gagawin kong mga guho ang inyong mga lungsod, at gagawin kong tiwangwang ang inyong mga santuwaryo; hindi ko aamuyin ang kaaya-ayang samyo ng inyong mga handog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang inyong kaaya-ayang samyo.” Karaniwang pananalita ito para sa mga handog na ang samyo ay kaaya-aya sa Diyos; idinagdag ang “ng inyong mga handog” upang luminaw ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת עָרֵיכֶם חָרְבָּה
  choice: Gagawin kong mga guho ang inyong mga lungsod
  rationale: Sa konstruksiyong ito, ang נתן ay may diwang ‘gawing’ nasa isang kalagayan; ang maramihang ‘mga guho’ ay natural sa Tagalog para sa maramihang ‘mga lungsod’ at malinaw na naghahayag ng pagkawasak.
- source_word: וַהֲשִׁמּוֹתִי
  choice: wawasakin ko
  rationale: Ang Hiphil ng שמם ay nagsasaad ng pagpapatiwangwang o pagwasak. Ang ‘wawasakin’ ay likas at malinaw sa modernong Tagalog, bagaman ang mas literal na ‘gagawin kong tiwangwang’ ay posible.
- source_word: מִקְדְּשֵׁיכֶם
  choice: inyong mga santuwaryo
  rationale: Pinananatili ng ‘mga santuwaryo’ ang maramihan at ang tiyak na kahulugang panrelihiyon ng מקדש; mas eksakto ito kaysa sa pangkalahatang ‘mga banal na lugar.’
- source_word: וְלֹא אָרִיחַ
  choice: at hindi ko aamuyin
  rationale: Tuwirang pinananatili ang pandiwang pandama na ‘amuyin’ sa halip na palitan ito ng interpretatibong ‘tatanggapin,’ kaya nananatili ang antropomorpikong larawan ng Hebreo.
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: ang kaaya-ayang samyo ng inyong mga handog
  rationale: Ang ריח ניחח ay nakaugaliang pananalita tungkol sa handog. Ang ‘kaaya-ayang samyo’ ay marangal at natural; idinagdag ang ‘ng inyong mga handog’ upang maging malinaw ang ipinahihiwatig na kontekstong pansakripisyo.
theological_decisions:
- issue: Kung literal na pananalitang pandama o interpretatibong pagtanggi sa handog ang gagamitin sa huling sugnay
  choice: Panatilihin ang ‘hindi ko aamuyin ang kaaya-ayang samyo’
  alternative: ‘Hindi ko tatanggapin ang inyong mga handog’
  rationale: Tahasan sa Hebreo ang pandiwang ‘amuyin’ at ang pormulang pansakripisyo na ‘kaaya-ayang samyo.’ Pinananatili nito ang larawan at teolohikal na bigat nang hindi tahimik na pinapalitan ng paliwanag ang mismong pananalita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang ‘santuwaryo’ bilang tiyak na terminong panrelihiyon at pinanatili ang literal na larawang ‘aamuyin.’
