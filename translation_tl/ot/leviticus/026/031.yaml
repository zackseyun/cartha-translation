  to: Gagawin kong mga guho ang inyong mga lungsod, at gagawin kong tiwangwang ang inyong mga santuwaryo; hindi ko aamuyin ang kaaya-ayang samyo ng inyong mga handog.[a]
  rationale: Pinalitan ang “wawasakin ko” ng “gagawin kong tiwangwang” upang maipahayag ang causative na diwa ng Hebreong pandiwa at ang tiyak na larawan ng pagkatiwangwang. Bahagyang inayos ang pag-uugnay ng mga sugnay upang maging mas malinaw ang daloy, habang pinanatili ang kahulugan at ang literal na larawang pansakripisyo sa huling sugnay.
