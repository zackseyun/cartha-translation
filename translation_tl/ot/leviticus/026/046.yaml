  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: tl
  text: Ito ang mga tuntunin, mga hatol, at mga kautusan na ibinigay ni Yahweh sa pagitan niya at ng mga anak ni Israel[a] sa Bundok Sinai, sa pamamagitan ni Moises.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa pamamagitan ng kamay ni Moises,” isang idyomang nangangahulugang “sa pamamagitan ni Moises.”
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Likas na panimulang pananalita sa Tagalog para sa pangwakas na buod ng naunang mga probisyong legal.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ipinahihiwatig ng חֻקִּים ang mga tiyak at itinakdang probisyon; malinaw at kasalukuyang Tagalog ang “mga tuntunin.”
- source_word: הַמִּשְׁפָּטִים
  choice: mga hatol
  rationale: Pinananatili nito ang legal na diwa ng מִשְׁפָּטִים at ang pagkakaiba nito sa dalawang kasamang terminong legal.
- source_word: הַתּוֹרֹת
  choice: mga kautusan
  rationale: Sa legal na tatluhang pahayag na ito, ang “mga kautusan” ay natural at nagpapahayag ng awtoritatibong tagubilin, bagaman maaari ring mangahulugan ang תּוֹרֹת ng “mga tagubilin” o “mga aral.”
- source_word: אֲשֶׁר נָתַן
  choice: ibinigay
  rationale: Tuwirang sinasalamin ang karaniwang kahulugan ng נָתַן nang hindi pinapalitan ng mas interpretatibong “itinatag.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa titik ang personal na pangalang tipan na יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: sa pagitan niya at ng mga anak ni Israel
  rationale: Pinananatili ang ugnayang “sa pagitan” at ang anyong Hebreo na “mga anak ni Israel”; inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: בְּהַר סִינַי
  choice: sa Bundok Sinai
  rationale: Karaniwan at natural na pagtukoy sa lugar sa modernong Tagalog.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ng kamay ni Moises
  rationale: Pinananatili sa pangunahing teksto ang konkretong idyomang Hebreo, habang nililinaw sa talababa na tumutukoy ito sa pamamagitan ni Moises.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ang transliterasyong “Yahweh” sa halip na gumamit ng pamalit na titulo.
- issue: Paglalahad sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa teksto ang literal na anyo ng etno-tipan na pananalita, ngunit ibinibigay sa talababa ang natural na katumbas sa Tagalog.
- issue: Kahulugan ng בְּיַד מֹשֶׁה
  choice: sa pamamagitan ng kamay ni Moises
  alternative: sa pamamagitan ni Moises
  rationale: Hindi inaalis sa pangunahing teksto ang idyomang Hebreo; nililinaw sa talababa ang kahulugan nitong pamamagitan o ahensiya.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na legal-tipang himig. Pinanatili ang tatlong magkakaibang terminong legal at ang idyomang Hebreo, ngunit nilinaw sa mga talababa ang dalawang ekspresyong maaaring hindi agad maging natural sa karaniwang mambabasa.
