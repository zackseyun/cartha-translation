base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: tl
  text: At kung mamumuhay kayo nang salungat sa akin[a] at ayaw ninyong makinig sa akin, lalo ko pa kayong hahampasin nang pitong ulit, ayon sa inyong mga kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang may pagkapoot sa akin” o “bilang pagsalungat sa akin.” Mahirap tiyakin ang eksaktong diwa ng idyomang Hebreo; sa kabanatang ito, inilalarawan nito ang paninindigang laban sa Diyos, hindi ang pagkilos nang nagkataon lamang.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “Magdaragdag pa ako ng hampas sa inyo nang pitong ulit, ayon sa inyong mga kasalanan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: nang salungat
  rationale: Ang bihirang salitang Hebreo ay bahagi rito ng idyomang naglalarawan ng asal na sumasalungat sa Diyos. Pinananatili ng “salungat” ang diwa ng pakikipagtunggali nang hindi ito nililimitahan sa tahasang pagkapoot o ipinapakahulugang nagkataon lamang.
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: mamumuhay kayo nang salungat sa akin
  rationale: Idyomatiko sa Hebreo ang “lumakad” bilang paglalarawan sa paraan ng pamumuhay. Ang “mamumuhay” ay natural sa makabagong Filipino at malinaw na tumutukoy sa patuloy na asal.
- source_word: תֹאבוּ
  choice: ayaw ninyo
  rationale: Ipinapahayag ng pandiwa ang kawalan ng kagustuhan, hindi lamang ang hindi pagkarinig. Natural at tuwiran sa Filipino ang “ayaw ninyo.”
- source_word: לִשְׁמֹעַ לִי
  choice: makinig sa akin
  rationale: Pinananatili nito ang pangunahing larawan ng pagdinig/pakikinig habang hinahayaang manatiling pahiwatig ang kaugnay na diwa ng pagsunod.
- source_word: וְיָסַפְתִּי
  choice: lalo ko pa
  rationale: Ang literal na diwa ay magdagdag o magpatuloy pa. Sa konteksto ng tumitinding mga hatol, natural na ipinahahayag ng “lalo ko pa” ang karagdagang pagpaparusa.
- source_word: מַכָּה
  choice: hahagupitin
  rationale: 'Malawak ang saklaw ng pangngalan: hampas, dagok, o salot. Ang pandiwang “hahagupitin” ay malinaw na naghahatid ng kaparusahang dagok nang hindi ito nililimitahan sa salot.'
- source_word: שֶׁבַע
  choice: pitong ulit
  rationale: Gumaganap itong pang-abay sa pormula ng tumitinding hatol. Ang “pitong ulit” ay natural at hindi nagpapasiya kung eksaktong bilang o masidhing ganap na pagpaparusa ang diin.
- source_word: כְּחַטֹּאתֵיכֶם
  choice: ayon sa inyong mga kasalanan
  rationale: Pinananatili ng “ayon sa” ang ugnayan ng pagtutugma o proporsiyon sa pagitan ng hatol at ng kanilang mga kasalanan, sa halip na gawin itong sanhi lamang.
theological_decisions:
- issue: Kalikasan ng tumitinding kaparusahan sa tipan
  choice: Ilarawan ito bilang higit pang mga hagupit na nauugnay sa dami o bigat ng mga kasalanan, nang hindi tinutukoy ang isang partikular na anyo ng kaparusahan.
  alternative: 'Isalin ang מַכָּה bilang partikular na “salot” o gawing sanhi lamang ang כְּחַטֹּאתֵיכֶם: “dahil sa inyong mga kasalanan.”'
  rationale: Nagbababala ang talata tungkol sa tumitinding hatol ng Diyos, ngunit hindi hinihingi ng Hebreo na tukuyin iyon bilang salot lamang. Pinananatili rin ng “ayon sa” ang posibleng diwa ng pagtutumbas o proporsiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mamumuhay” para sa idyomang Hebreo na “lumakad,” at ang “hahagupitin” upang mapanatili ang larawan ng kaparusahang dagok nang hindi ito pinakikitid sa isang uri ng salot.
