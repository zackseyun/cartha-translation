  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: tl
  text: Ako mismo ang gagawing tiwangwang ang lupain, at masisindak dito ang inyong mga kaaway na naninirahan doon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magugulat dito” o “mangingilabot dito.” Maaaring ipahayag ng pandiwang Hebreo ang pagkagulat o pagkasindak dahil sa matinding pagkatiwangwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: gagawang tiwangwang
  rationale: Ang pandiwang causative mula sa שׁמם ay nangangahulugang gawing wasak o tiwangwang. Likas sa Tagalog ang pariralang “gagawang tiwangwang” at malinaw nitong pinananatili ang causative na diwa.
- source_word: אֲנִי
  choice: Ako mismo
  rationale: Mariin ang hiwalay na panghalip kasabay ng anyong pandiwa; ipinahahayag ng “Ako mismo” na ang PANGINOON ang personal na gagawa nito.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto ng mga sumpa ng tipan, tumutukoy ito sa lupaing tinitirhan ng Israel, hindi sa buong daigdig.
- source_word: וְשָׁמְמוּ
  choice: masisindak
  rationale: Sa payak na stem, maaaring tumukoy ang שׁמם sa pagkagulat, pagkasindak, o pangingilabot bilang tugon sa pagkatiwangwang. Dahil mga kaaway ang simuno, ang kanilang reaksiyon ang pinakamalamang na diwa.
- source_word: עָלֶיהָ
  choice: dito
  rationale: Kasama ng שׁמם, ipinakikilala ng עַל ang bagay o dahilan ng pagkasindak. Ang “dito” ay maikli at natural na tumutukoy sa sinapit ng lupain.
- source_word: אֹיְבֵיכֶם
  choice: ang inyong mga kaaway
  rationale: Tuwirang salin ng pangngalang may pangmaramihang panghalip na paari.
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: na naninirahan doon
  rationale: Ang participle ng ישׁב ay tumutukoy sa paninirahan. Ang “doon” ay malinaw na bumabalik sa lupain nang hindi mabigat ang pag-uulit.
theological_decisions:
- issue: Ang tinutukoy ng הָאָרֶץ sa konteksto ng hatol ng tipan
  choice: ang lupain
  alternative: ang daigdig
  rationale: Ang agarang konteksto ay tungkol sa mga sumpa ng tipan na daranasin ng Israel at ng lupain nito. Hindi pinalalawak ng “ang lupain” ang hatol upang saklawin ang buong daigdig.
- issue: Ugnayan ng dalawang sugnay
  choice: at
  alternative: kaya / upang
  rationale: Pinananatili ng “at” ang payak na pang-ugnay sa Hebreo at hindi nagdaragdag ng tahasang layunin o bunga na hindi tinukoy ng teksto.
translation_notes:
  register: Makabago at marangal na Tagalog na madaling maunawaan. Ginamit ang “tiwangwang” upang ilarawan ang pagkawasak at pagkapabaya ng lupain, at “masisindak” upang katawanin ang reaksiyong ipinahihiwatig ng ikalawang paggamit sa ugat na שׁמם.
