base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: tl
  text: Magtitisuran sila sa isa't isa[a] na para bang nasa harap sila ng tabak, kahit walang humahabol; at hindi kayo makatatayo sa harap ng inyong mga kaaway.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang isang tao sa/laban sa kanyang kapatid”; inilalarawan dito ang pagkakabanggaan o pagkakatisuran nila sa isa't isa dahil sa sindak.
    reason: lexical_alternative
  - marker: b
    text: O “wala kayong kakayahang manindigan sa harap ng inyong mga kaaway.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: Magtitisuran sila
  rationale: Pinananatili ng “magtitisuran” ang kongkretong larawan ng כשל at ipinahihiwatig ng anyong maramihan ang magkakasabay na pagkatisod sa gitna ng takot.
- source_word: אִישׁ בְּאָחִיו
  choice: sa isa't isa
  rationale: Ang literal na “ang isang tao sa/laban sa kanyang kapatid” ay distributibo at tumutukoy rito sa pagbabanggaan o pagkakatisuran nila sa sindak; natural itong ipinahahayag sa Filipino bilang “sa isa't isa.”
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: na para bang tumatakas sa harap ng tabak
  rationale: Ang כְּמִפְּנֵי ay “gaya ng mula/sa harap ng.” Ipinahahayag ng “tumatakas” ang galaw na likas sa larawang ito sa konteksto, samantalang nananatili ang “sa harap ng tabak” upang hindi gawing tahasang humahabol ang tabak.
- source_word: וְרֹדֵף אָיִן
  choice: kahit walang humahabol
  rationale: 'Ang Hebreo ay literal na “at walang humahabol.” Ang “kahit” ay natural na naghahatid ng kontras: kumikilos silang waring hinahabol bagaman walang humahabol.'
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: at hindi kayo makatatayo
  rationale: Ang תְּקוּמָה ay maaaring tumukoy sa pagtayo o kakayahang manatiling nakatayo. Sa kontekstong militar, ang “hindi kayo makatatayo” ay nagpapanatili sa larawan at nagpapahiwatig ng kawalang-kakayahang lumaban o manindigan.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: laban sa inyong mga kaaway
  rationale: Bagaman literal na “sa harap ng inyong mga kaaway,” natural na ipinahahayag ng “laban sa” ang kahulugan ng pagharap at pagtatangkang manindigan sa harap ng mga kaaway.
