base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: tl
  text: Mauubos nang walang kabuluhan ang inyong lakas,[a] at hindi magbibigay ng ani ang inyong lupain, ni mamumunga ang mga punongkahoy sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “Mauubos para sa kawalang-kabuluhan ang inyong lakas”; at “ang punongkahoy sa lupain ay hindi magbibigay ng bunga nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: Mauubos
  rationale: Ipinahihiwatig ng pandiwa na lubusang magagamit o mauubos ang lakas; natural at malinaw ang “mauubos” sa konteksto ng paggawa.
- source_word: לָרִיק
  choice: sa walang kabuluhan
  rationale: Inilalarawan nito ang pagsisikap na walang pakinabang o bunga, habang pinananatili ang larawan ng kawalang-kabuluhan.
- source_word: כֹּחֲכֶם
  choice: ang inyong lakas
  rationale: Tumutukoy ang כֹּחַ sa lakas o kakayahang ginugugol, lalo na sa konteksto ng gawaing pansakahan.
- source_word: תִתֵּן
  choice: ibubunga / mamumunga
  rationale: Literal itong “magbibigay,” ngunit ang “ibubunga” para sa lupain at “mamumunga” para sa mga puno ay mas likas sa modernong Tagalog at tumpak sa diwang pansakahan.
- source_word: אַרְצְכֶם
  choice: inyong lupain
  rationale: Ang אֶרֶץ dito ay ang lupaing pag-aari at sinasaka ng bayan; ang “lupain” ay dignified at angkop sa konteksto.
- source_word: יְבוּלָהּ
  choice: ang ani nito
  rationale: Ang יְבוּל ay ani o produktong inilalabas ng lupa; karaniwan at madaling maunawaan ang “ani.”
- source_word: וְעֵץ הָאָרֶץ
  choice: ang mga punongkahoy sa lupain
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito; natural sa Tagalog ang maramihang “mga punongkahoy.”
- source_word: פִּרְיוֹ
  choice: mamumunga
  rationale: Ang literal na “bunga nito” ay naipahayag nang likas sa pandiwang “mamumunga,” na umaayon sa kolektibong pagkaunawa sa mga puno.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at likas pakinggan. Ginamit ang “inyong” upang mapanatili ang maramihang ikalawang panauhan at ang pormal na himig ng tipang konteksto; kolektibong isahan sa Hebreo ang “punongkahoy,” ngunit isinalin itong natural na maramihan sa pangunahing teksto.
