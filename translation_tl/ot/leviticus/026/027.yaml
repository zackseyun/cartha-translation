  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: tl
  text: Ngunit kung, sa kabila ng lahat ng ito, ay hindi pa rin kayo makikinig sa akin[a] at patuloy kayong mamumuhay nang salungat sa akin[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi pa rin kayo susunod sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lumakad kayo na kasama ko sa qeri.” Ang qeri ay isang mahirap na salita sa pariralang ito; maaari itong tumukoy sa pagkilos o pakikitungo nang salungat, may pagsalungat, o may pagkapoot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinapakita ang pasubaling kundisyon at ang paglala ng babala mula sa naunang konteksto.
- source_word: בְּזֹאת
  choice: sa kabila ng lahat ng ito
  rationale: Tumutukoy sa mga naunang pagpaparusa at may concessive na diwang ‘sa kabila nito,’ hindi lamang literal na ‘sa ganito.’
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: hindi pa rin kayo makikinig sa akin
  rationale: Pinananatili ng ‘makikinig’ ang larawan ng pandinig sa שׁמע habang ipinahihiwatig ang pagtugon at pagsunod; ipinahahayag ng ‘pa rin’ ang patuloy na pagtanggi sa konteksto.
- source_word: וַהֲלַכְתֶּם
  choice: patuloy kayong
  rationale: Ang הלך ay tumutukoy rito sa asal o patuloy na pagkilos, hindi sa literal na paglalakad; natural sa modernong Tagalog ang pagsasama nito sa pandiwang ‘lalaban.’
- source_word: עִמִּי בְּקֶרִי
  choice: lalaban sa akin
  rationale: Ang mahirap na idyomang ‘lumakad na may pagsalungat sa akin’ ay nagsasaad ng mapanlaban o salungat na pakikitungo. Ang ‘lalaban sa akin’ ay natural at pinananatili ang relasyonal na pagsalungat nang hindi tinutukoy nang labis ang eksaktong nuance ng קֶרִי.
theological_decisions:
- issue: Idyoma ng babala sa tipan sa Levitico 26
  choice: patuloy kayong lalaban sa akin
  alternative: patuloy kayong mamumuhay nang salungat sa akin
  rationale: Pinananatili ang diwa ng isang aktibong mapanlaban na paninindigan sa ugnayan sa Diyos, hindi lamang pangkalahatang pagsuway. Isinasalin nang natural ang idyoma sa halip na panatilihin ang di-likas na literal na ‘lumakad.’
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pangmaramihang ‘kayo’ ayon sa Hebreo. Iniwasan ang literal ngunit di-likas na ‘lumakad nang salungat,’ habang ipinaliwanag ito sa talababa. Ang pangungusap ay nagtatapos sa kuwit sapagkat nagpapatuloy ang kondisyong ito sa kasunod na talata.
