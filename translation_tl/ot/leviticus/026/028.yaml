  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: tl
  text: At lalakad din akong salungat sa inyo sa tindi ng poot[a], at ako mismo ang magdidisiplina sa inyo nang pitong ulit dahil sa inyong mga kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalakad akong salungat sa inyo sa poot ng pagsalungat.” Mahirap ang salitang Hebreo na isinaling “salungat” at maaari ring tumukoy sa pagkontra o pagkapoot.
    reason: lexical_alternative
  - marker: b
    text: O “magdidisiplina ako sa inyo nang pitong beses dahil sa inyong mga kasalanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: lalakad din ako
  rationale: Pinananatili ang literal at paulit-ulit na larawan ng ‘paglakad’ sa mga babalang tipan sa kabanatang ito, sa halip na palitan lamang ng ‘kikilos’ o ‘makikitungo.’
- source_word: עִמָּכֶם ... קֶרִי
  choice: salungat sa inyo
  rationale: Bagaman literal na ‘kasama ninyo’ ang עִמָּכֶם, ang mahirap na salitang קֶרִי ang nagbibigay rito ng diwang pagsalungat o pagkontra. Likas sa modernong Tagalog ang ‘salungat sa inyo’ at hindi nito pinapawi ang relasyonal na larawan.
- source_word: בַּחֲמַת
  choice: sa tindi ng poot
  rationale: Ang חֵמָה ay tumutukoy sa nag-aalab na galit, matinding poot, o pagkapoot. Ipinahahayag ng ‘sa tindi ng poot’ ang lakas nito sa malinaw at marangal na Tagalog.
- source_word: קֶרִי
  choice: salungat
  rationale: Mahirap at pinagtatalunang salita ang קֶרִי sa Levitico 26; maaari itong mangahulugang pagsalungat, pagkontra, o pagkapoot. Pinili ang ‘salungat’ upang mapanatili ang pormulang diwa nang hindi nagpapanggap na tiyak ang buong leksikal na saklaw; inilagay sa talababa ang mas literal na alternatibo.
- source_word: וְיִסַּרְתִּי
  choice: magdidisiplina
  rationale: Ang יסר ay maaaring tumukoy sa pagdidisiplina, pagtutuwid, o pagpaparusa. Pinananatili ng ‘magdidisiplina’ ang posibleng mapagtuwid na diwa nang hindi inaalis ang bigat ng hatol sa kontekstong ito.
- source_word: אַף אֲנִי
  choice: ako mismo
  rationale: Ipinakikita nito ang diin sa banal na tagaganap. Natural sa Tagalog ang ‘ako mismo’ at naipahahayag nito ang intensipikasyon ng Hebreo.
- source_word: שֶׁבַע
  choice: nang pitong ibayo
  rationale: Sa serye ng mga sumpa sa Levitico 26, ipinahihiwatig nito ang pitong ulit na pagtindi ng pagdidisiplina. Ang ‘pitong ibayo’ ay maikli at likas, samantalang pinananatili sa talababa ang posibleng ‘pitong ulit.’
- source_word: עַל חַטֹּאתֵיכֶם
  choice: dahil sa inyong mga kasalanan
  rationale: Dito, ang עַל ay nagpapahayag ng sanhi o batayan ng pagdidisiplina. Malinaw na naihahatid iyon ng ‘dahil sa inyong mga kasalanan.’
theological_decisions:
- issue: Kalikasan ng tugon ng Diyos sa sumpa ng tipan
  choice: Pinanatili kapwa ang pagsalungat ng Diyos at ang wika ng pagdidisiplina.
  alternative: Isalin ang buong pahayag bilang purong pagpaparusa, o pahinain ito bilang karaniwang pagkadismaya lamang.
  rationale: Pinagsasama ng Hebreo ang matinding relasyonal na pagsalungat at ang pandiwang יסר, na maaaring maglaman ng diwa ng pagtutuwid o pagdidisiplina. Hindi dapat alisin ng salin ang alinman sa dalawang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang sadyang larawan ng ‘paglakad’ at ang diin ng ‘ako mismo,’ habang iniwasan ang lubhang arkaiko o denominasyonal na pananalita.
