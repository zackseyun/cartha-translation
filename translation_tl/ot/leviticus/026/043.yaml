    issue: Di-gaanong natural ang “kinasuklaman ng kanilang kalooban.”
    rationale: Bagaman sinusubukan nitong panatilihin ang נֶפֶשׁ bilang panloob na paksa, ang parirala ay asiwa sa modernong Filipino at maaaring magmukhang ang “kalooban” ay isang hiwalay na ahente. Ang “buong pagkatao” ay mas likas at sumasaklaw sa idiomatikong gamit ng נֶפֶשׁ.
  - severity: low
    issue: Mas natural ang aktibong ayos sa unang sugnay.
    rationale: Ang “iiwanan nila ang lupain” ay malinaw na Tagalog at kapantay sa kahulugang pasibo ng Hebreo, kung saan ang lupain ang iniwan ng bayan.
