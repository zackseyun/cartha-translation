  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: tl
  text: Ngunit iiwanan nila ang lupain, at matatamasa nito ang mga Sabbath nito habang tiwangwang ito, na wala sila roon. Tatanggapin naman nila ang kaparusahan sa kanilang kasamaan[a], sapagkat—oo, sapagkat—itinakwil nila ang aking mga batas, at ang kanilang buong pagkatao ay nasuklam sa aking mga tuntunin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tatanggapin nila ang kanilang kasamaan” o “magbabayad-sala sila para sa kanilang kasamaan.” Maaaring unawain sa higit sa isang paraan ang idyomang Hebreo; dito ay isinalin ito ayon sa diwang panghukuman sa konteksto ng kaparusahan sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב מֵהֶם
  choice: maiiwan ang lupain na wala sila
  rationale: Pinananatili ang balintiyak na diwa ng pandiwa at nililinaw na naiwan ang lupain dahil wala na roon ang mga tao.
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: tatamasahin nito ang mga Sabbath nito
  rationale: Sa konteksto ng Levitico 26, tinatanggap o tinatamasa ng lupain ang mga pagpapahingang hindi nito natamo noon. Pinananatili rin ng “mga Sabbath” ang terminong tipan.
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: habang tiwangwang ito
  rationale: Likas na Tagalog para sa kalagayan ng lupaing walang naninirahan; naipahayag na sa naunang parirala ang pagkawala ng mga tao.
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: tatanggapin naman nila ang kaparusahan sa kanilang kasamaan
  rationale: Maaaring tumukoy ang idyoma sa pagtanggap o pagdadala ng kaparusahang bunga ng kasalanan. Ang saling ito angkop sa konteksto ng hatol ng tipan, habang inilalagay sa talababa ang tunay na leksikal na kalabuan.
- source_word: יַעַן וּבְיַעַן
  choice: sapagkat—oo, sapagkat—
  rationale: Ipinahihiwatig ng dobleng pananalita ang mariing pagbibigay ng dahilan; natural itong naipapahayag sa Tagalog sa pamamagitan ng “oo” at mga gitling.
- source_word: בְּמִשְׁפָּטַי
  choice: aking mga batas
  rationale: Malinaw at makabagong katawagan para sa mga legal na pasiya o tuntunin ng tipan, at naiiba sa salin ng חֻקֹּתַי.
- source_word: מָאָסוּ
  choice: itinakwil nila
  rationale: Ipinapahayag ang sadyang pagtanggi na may paghamak, mas mariin kaysa karaniwang “tinanggihan.”
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Karaniwang modernong Tagalog para sa itinakdang mga batas o palatuntunan, at pinananatili ang pagkakaiba sa מִשְׁפָּטִים.
- source_word: גָּעֲלָה נַפְשָׁם
  choice: kinasuklaman ng kanilang kalooban
  rationale: Pinananatili ang panloob at kolektibong diin ng literal na “kanilang kaluluwa” nang hindi gumagamit ng pariralang asiwa sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng עָוֹן sa pariralang יִרְצוּ אֶת עֲוֺנָם
  choice: kaparusahang bunga ng kanilang kasamaan
  alternative: kanilang kasamaan; o pagbabayad-pinsala/pagtubos dahil sa kanilang kasamaan
  rationale: Ang nakapaligid na konteksto ay hatol ng tipan, pagkakatapon, at pagpapahinga ng lupain. Kaya malamang na nangingibabaw ang kahulugang kaparusahan o bunga ng pagkakasala. Gayunman, hindi lubusang nilulutas ng Hebreo ang ugnayan ng kasalanan, pananagutan, at kabayaran, kaya inilalahad sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Sabbath” upang mapanatili ang mahalagang katawagang pangtipan; ang “tiwangwang” ay malinaw ngunit dignified. Ang kolektibong “kanilang kalooban” ay mas natural kaysa literal na “kanilang kaluluwa” habang pinananatili ang panloob na diin ng Hebreo.
