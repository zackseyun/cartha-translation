revisions:
- from: Ngunit maiiwan ang lupain na wala sila, at tatamasahin nito ang mga Sabbath nito habang tiwangwang ito. Tatanggapin naman nila ang kaparusahan sa kanilang kasamaan[a], sapagkat—oo, sapagkat—itinakwil nila ang aking mga batas, at kinasuklaman ng kanilang kalooban ang aking mga tuntunin.
  to: Ngunit iiwanan nila ang lupain, at matatamasa nito ang mga Sabbath nito habang tiwangwang ito, na wala sila roon. Tatanggapin naman nila ang kaparusahan sa kanilang kasamaan[a], sapagkat—oo, sapagkat—itinakwil nila ang aking mga batas, at ang kanilang buong pagkatao ay nasuklam sa aking mga tuntunin.
  rationale: Inayos ang mga pariralang hindi gaanong likas sa modernong Filipino, lalo na ang salin ng נֶפֶשׁ, habang pinanatili ang estruktura, pag-uulit na nagpapadiin sa sanhi, legal-tipang rehistro, at ang maingat na panghukomang pagbasa ng יִרְצוּ אֶת־עֲוֹנָם. Inayos din ang talababa upang mas tumpak na maipakita ang alternatibong pagbasa ng idyoma.
