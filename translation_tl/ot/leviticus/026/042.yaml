  yaml_path: translation/ot/leviticus/026/042.yaml
  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: tl
  text: Kung magkagayon[a], aalalahanin ko ang tipan ko kay Jacob, at gayundin ang tipan ko kay Isaac, at gayundin ang tipan ko kay Abraham ay aalalahanin ko; at aalalahanin ko ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At aalalahanin ko.” Maaari ring isalin ang pang-ugnay sa Hebreo bilang payak na “at”; ipinakikita ng “kung magkagayon” ang kaugnayan ng talata sa naunang konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Kung magkagayon, aalalahanin ko
  rationale: Ang זכר sa konteksto ng tipan ay higit sa simpleng paggunita at nagpapahiwatig ng pagkilos ayon sa tipan, ngunit pinanatili ang pandiwang “aalalahanin.” Isinasalamin ng “Kung magkagayon” ang ugnayan sa naunang kondisyon at pagpapanumbalik; nakatala sa talababa ang mas payak na “At.”
- source_word: בְּרִיתִי
  choice: ang tipan ko
  rationale: Ang “tipan” ang likas at kinikilalang katumbas ng בְּרִית sa Bibliya at pinananatili ang bigat ng nagbubuklod na ugnayan ng Diyos sa mga ninuno.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: וְאַף
  choice: at gayundin
  rationale: Pinananatili nito ang pang-ugnay at ang pandagdag na diin ng אַף nang hindi nagiging matigas ang pangungusap.
- source_word: יִצְחָק
  choice: Isaac
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa modernong Tagalog.
- source_word: אֶזְכֹּר
  choice: aalalahanin ko
  rationale: Pinanatili ang inuulit na tahasang pandiwa sapagkat nagbibigay ito ng retorikal na diin sa pag-alaala kay Abraham at pagkatapos ay sa lupain.
- source_word: וְהָאָרֶץ
  choice: at ang lupain
  rationale: Sa konteksto ng tipan, tumutukoy ang אֶרֶץ sa ipinangakong lupain; mas angkop ang “lupain” kaysa sa pangkalahatang “bansa.”
theological_decisions:
- issue: Ayos at diin ng mga tipan sa mga ninuno
  choice: Pinanatili ang ayos na Jacob, Isaac, Abraham at ang pag-uulit ng “ang tipan ko.”
  alternative: Ayusin bilang Abraham, Isaac, Jacob, o paikliin bilang “ang tipan ko kina Abraham, Isaac, at Jacob.”
  rationale: Sadyang pabalik ang ayos sa Hebreo at inuulit ang “aking tipan” para sa bawat ninuno. Pinananatili nito ang retorikal na diin at hindi ipinapasok ang mas pamilyar ngunit wala rito na pormula.
- issue: Kahulugan ng pag-alaala ng Diyos
  choice: Isinalin bilang “aalalahanin” nang hindi dinaragdagan ng “at kikilos ako” o “paninibaguhin ko.”
  alternative: “Gugunitain ko at kikilos ako ayon dito” o “paninibaguhin ko.”
  rationale: Sa konteksto ng tipan, nagpapahiwatig ng pagkilos ang pag-alaala ng Diyos, ngunit “aalalahanin” mismo ang sinasabi ng teksto. Pinananatili nito ang teolohikal na tensiyon nang walang dagdag na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang bahagyang minarkahang ayos na “ang tipan ko kay Abraham ay aalalahanin ko” upang maipakita ang inuulit na pandiwa at diin ng Hebreo, gayundin ang ayos na Jacob–Isaac–Abraham.
