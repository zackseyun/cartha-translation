  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: tl
  text: Lima sa inyo ang hahabol sa isang daan[a], at isang daan sa inyo ang hahabol sa sampung libo[b]. Mabubuwal sa harap ninyo ang inyong mga kaaway sa tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tutugis” sa dalawang sugnay.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong רְבָבָה ay maaaring mangahulugang “sampung libo” o “napakaraming bilang”; ang “sampung libo” ay angkop dito sa paralelismo ng mga bilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: hahabol
  rationale: Ang רדף ay nangangahulugang humabol o tumugis. Sa kontekstong militar, natural at malinaw sa makabagong Filipino ang “hahabol,” habang nananatili ang diwa ng aktibong pagtugis.
- source_word: מִכֶּם
  choice: sa inyo
  rationale: 'Partitibo ang gamit ng מִן dito: lima o isang daan mula sa kabuuang bilang ng kausap. Likas sa Filipino ang “lima sa inyo” at “isang daan sa inyo.”'
- source_word: חֲמִשָּׁה ... מֵאָה
  choice: Lima sa inyo ang hahabol sa isang daan
  rationale: Pinananatili ang tuwirang paghahambing ng bilang at ang matinding kalamangan na ipinapahayag ng Hebreo.
- source_word: רְבָבָה
  choice: sampung libo
  rationale: Maaaring tumukoy ang salita sa sampung libo o sa napakaraming bilang. Ang tiyak na “sampung libo” ang pinakamainam dito dahil sa numerikal na paralelismo.
- source_word: וְנָפְלוּ
  choice: Mabubuwal
  rationale: Pinananatili nito ang larawan ng נפל na “mahulog/mabuwal,” at malinaw din ang kahulugan nitong pagkatalo o pagkamatay sa labanan.
- source_word: אֹיְבֵיכֶם
  choice: ang inyong mga kaaway
  rationale: Tuwirang katumbas at angkop sa marangal na modernong Filipino.
- source_word: לִפְנֵיכֶם
  choice: sa harap ninyo
  rationale: Malapit sa idyomang Hebreo at nauunawaan bilang pagkabuwal o pagkatalo ng mga kaaway sa presensiya ng Israel.
- source_word: לֶחָרֶב
  choice: sa tabak
  rationale: Pinananatili ang konkretong larawang militar ng Hebreo. Sa pariralang Filipino na “mabuwal ... sa tabak,” ipinahihiwatig ang pagkamatay o pagkatalo sa pamamagitan ng sandata.
theological_decisions:
- issue: 'Pangakong militar bilang pagpapala ng tipan: eksaktong bilang o retorikal na paglalarawan'
  choice: Panatilihin ang tuwiran at kongkretong pangako ng lubhang di-pantay na tagumpay nang hindi ipinapaliwanag kung literal o retorikal ang mga bilang.
  alternative: Gawing pangkalahatang pangako lamang ng lakas ng loob o tagumpay, o tahasang tawaging pagmamalabis ang mga bilang.
  rationale: Inilalahad ng talata ang pagpapala ng tipan sa anyong tiyak na pangakong militar. Hindi dapat palambutin ang kongkretong wika, ngunit hindi rin dapat lutasin sa salin ang tanong kung paano eksaktong gumagana ang mga bilang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hahabol” bilang karaniwang salita, “mabubuwal” upang mapanatili ang larawang militar, at “tabak” bilang pamilyar na terminong biblikal na mauunawaan pa rin ng ordinaryong mambabasa.
