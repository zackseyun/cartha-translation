  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: tl
  text: Itutuon ko ang aking mukha laban sa inyo,[a] at matatalo kayo sa harap ng inyong mga kaaway. Maghahari sa inyo ang mga napopoot sa inyo, at tatakas kayo kahit walang humahabol sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ilalagay ko ang aking mukha laban sa inyo,” isang idyomang nagpapahayag ng matibay na pagsalungat bilang paghatol.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: Itutuon ko ang aking mukha laban sa inyo
  rationale: Pinananatili ang Hebreong idyoma at ang personal at tipanang diin ng tahasang pagharap ng Diyos laban sa bayan bilang paghatol. Mas natural sa makabagong Tagalog ang “itutuon” kaysa literal na “ilalagay.”
- source_word: וְנִגַּפְתֶּם
  choice: matatalo kayo
  rationale: Sa kontekstong militar, ipinahihiwatig ng Niphal ang pagkatalo o pagkabuwal sa labanan. Ang “matatalo” ay malinaw at natural; ang mas literal na “mapapabagsak” ay maaari rin ngunit maaaring magpahiwatig lamang ng pisikal na pagbuwal.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: sa harap ng inyong mga kaaway
  rationale: Tuwirang pinananatili ang spatial at militar na pahayag ng Hebreo.
- source_word: וְרָדוּ בָכֶם
  choice: Maghahari sa inyo
  rationale: Tumpak na ipinapahayag ang pamamahala o paghahari nang hindi dinaragdagan ang teksto ng mas tiyak na diwa ng pagmamalupit.
- source_word: שֹׂנְאֵיכֶם
  choice: ang mga napopoot sa inyo
  rationale: Pinananatili ang pagkakaiba nito sa naunang “mga kaaway”; tumutukoy ito mismo sa mga taong napopoot sa kanila.
- source_word: וְנַסְתֶּם
  choice: tatakas kayo
  rationale: Karaniwan, malinaw, at angkop na salin ng pandiwang tumutukoy sa pagtakas dahil sa takot o panganib.
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: kahit walang humahabol sa inyo
  rationale: 'Natural na ipinapahayag ang matinding sindak: tatakas sila bagaman wala namang aktuwal na humahabol. Pinananatili ng “kahit” ang posibleng concessive na ugnayan ng sugnay.'
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa paghatol ng Diyos
  choice: Panatilihin ang idyomang “Itutuon ko ang aking mukha laban sa inyo”
  alternative: “Sasalungatin ko kayo”
  rationale: Pinananatili ng larawan ng mukha ang personal, tipanan, at pampanitikang lakas ng Hebreo sa halip na gawing abstraktong pahayag lamang ang pagsalungat ng Diyos.
- issue: Uri ng kapangyarihan ng mga napopoot sa Israel
  choice: “Maghahari sa inyo”
  alternative: “Lulupigin/dominohan kayo”
  rationale: Nagsasaad ang רדה ng pamamahala o paghahari. Hindi nilalagyan ng salin ang talata ng antas ng kalupitang hindi tahasang tinukoy rito.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangunahing Hebreong idyoma, habang ginawang natural ang ayos ng pangungusap. Isang talababa lamang ang ginamit upang ipaliwanag ang idyoma; ang “matatalo” at “kahit walang humahabol” ay sapat na malinaw sa pangunahing teksto.
