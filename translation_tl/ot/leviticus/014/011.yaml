  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: tl
  text: At ihaharap ng paring nagsasagawa ng paglilinis ang lalaking nililinis, kasama ang mga bagay na iyon, sa harap ni Yahweh, sa pasukan ng Tolda ng Pagpupulong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: ihaharap
  rationale: Ang Hiphil ng עמד ay literal na pagpapapatayo ngunit sa rituwal na kontekstong ito ay nangangahulugang pormal na pagharap o paghaharap sa harap ni Yahweh.
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: paring nangangasiwa sa paglilinis
  rationale: Ipinapahayag nito ang aktibong tungkulin ng pari sa rituwal na proseso nang hindi ipinahihiwatig na moral na karumihan ang nililinis o na pagbigkas lamang ng pagiging malinis ang ginagawa niya.
- source_word: הָאִישׁ
  choice: ang lalaking
  rationale: Pinananatili ang tahasang panlalaking isahan ng tekstong Hebreo.
- source_word: הַמִּטַּהֵר
  choice: nililinis
  rationale: Inihahatid ng anyong Hitpael ang diwang ang lalaki ay sumasailalim sa rituwal na paglilinis; natural at malinaw ito sa Tagalog.
- source_word: וְאֹתָם
  choice: kasama ang mga bagay na iyon
  rationale: Ang panghalip ay tumutukoy sa mga kagamitang inisa-isa sa naunang talata, kaya nilinaw ang di-taong reperente sa Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang karaniwang pananalitang rituwal at ang personal na pangalang tipan na יהוה.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng pagpupulong
  rationale: Direkta, natural, at kinikilalang katawagan sa lugar ng santuwaryo.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Papel ng pari sa paglilinis
  choice: nangangasiwa sa paglilinis
  alternative: naglilinis; nagpapahayag na malinis
  rationale: Ipinakikita ng participle ang rituwal na papel ng pari sa kabuuang proseso. Iniiwasan ng salin ang pagpapakitid nito sa simpleng pagpapahayag lamang at ang pahiwatig na moral o pisikal na paglilinis ang personal niyang isinasagawa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tolda ng pagpupulong” bilang malinaw at pormal na katumbas ng אֹהֶל מוֹעֵד. Walang kailangang talababa sa talatang ito.
