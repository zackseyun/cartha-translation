  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הַ֣/חַטָּ֔את וְ/כִפֶּ֕ר עַל הַ/מִּטַּהֵ֖ר מִ/טֻּמְאָת֑/וֹ וְ/אַחַ֖ר יִשְׁחַ֥ט אֶת הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: tl
  text: Pagkatapos, ihahandog ng pari ang handog para sa kasalanan[a] at magsasagawa siya ng pagtubos para sa taong nililinis mula sa kanyang karumihan. Pagkaraan nito, kakatayin niya ang handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Sa mga ritwal sa Levitico, ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog na ginagamit sa paglilinis mula sa ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: ihahandog
  rationale: Bagaman literal na “gagawin,” ang pandiwa sa kontekstong pansakripisyo ay tumutukoy sa pagsasagawa o paghahandog ng handog.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katumbas ng tiyak na pangngalan sa kontekstong ritwal.
- source_word: הַחַטָּאת
  choice: ang handog para sa kasalanan
  rationale: Dito, ang חַטָּאת ay tuwirang layon ng paghahandog kaya tumutukoy ito sa isang uri ng handog. Pinananatili sa talababa ang posibleng ritwal na diwang “handog para sa paglilinis.”
- source_word: וְכִפֶּר
  choice: gagawa siya ng pagtubos
  rationale: Pinananatili ang ritwal at teolohikal na lakas ng כפר nang hindi itinatakda ang isang partikular na teorya ng pagtubos.
- source_word: עַל
  choice: para sa
  rationale: Kasama ng כפר, tinutukoy nito ang taong pinaggagawan ng pagtubos.
- source_word: הַמִּטַּהֵר
  choice: ang taong nililinis
  rationale: Ipinahihiwatig ng hitpael participle ang taong dumaraan sa ritwal na paglilinis; natural sa Tagalog ang pasibong anyong ito.
- source_word: מִטֻּמְאָתוֹ
  choice: mula sa kanyang karumihan
  rationale: Ang טֻמְאָה sa Levitico ay ritwal na karumihan. Ang “kanyang” ay sumasalamin sa panlalaking isahan na hulapi nang hindi kailangang ulitin ang kasarian sa Tagalog.
- source_word: וְאַחַר
  choice: Pagkaraan nito
  rationale: Malinaw na naghuhudyat ng kasunod na hakbang sa ritwal.
- source_word: יִשְׁחַט
  choice: kakatayin niya
  rationale: Ang “katayin” ang natural at tiyak na salitang Tagalog para sa pagpatay sa hayop na ihahandog.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Malinaw at nakaugaliang katumbas ng עֹלָה bilang handog na sinusunog sa dambana.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa kontekstong pansakripisyo sa Levitico
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang salita ay teknikal na pangalan ng handog at maaari ring idiin ang ritwal na paglilinis, lalo na sa kontekstong ito. Ginamit sa teksto ang mas kilalang katawagan at inilagay sa talababa ang tunay na alternatibo.
- issue: Ritwal na kahulugan ng כפר
  choice: gagawa ng pagtubos para sa
  alternative: magsasagawa ng ritwal na paglilinis para sa
  rationale: Ang “pagtubos” ay nagpapanatili sa masaklaw na ritwal-teolohikal na diwa at hindi ito nililimitahan sa paglilinis lamang.
- issue: Panlalaking isahang hulapi sa מִטֻּמְאָתוֹ
  choice: kanyang karumihan
  alternative: karumihan ng taong iyon
  rationale: Ang “kanyang” ay natural sa Tagalog at tapat sa isahang reperente, bagaman hindi tahasang minamarkahan ng panghalip na Tagalog ang kasarian.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang pormal ngunit natural na bokabularyong panritwal; iniwasan ang sobrang makaluma o denominasyonal na pananalita.
