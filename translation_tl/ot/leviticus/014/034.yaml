base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: tl
  text: “Kapag pumasok kayo sa lupain ng Canaan na ibinibigay ko sa inyo bilang pag-aari, at maglagay ako ng isang salot ng tsaraat[a] sa isang bahay sa lupain na pag-aari ninyo,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyunal na isinasalin itong “ketong.” Ang salitang Hebreo na tsaraat ay tumutukoy sa mas malawak na uri ng mga karamdaman o nakaruruming paglitaw, at maaari rin itong lumitaw sa mga bahay; hindi lamang ito ang sakit na tinatawag ngayong ketong.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: Kapag pumasok kayo
  rationale: Ipinakikilala ng כִּי rito ang isang kalagayang inaasahang mangyayari sa hinaharap, kaya likas sa legal na konteksto ang “kapag”; ang maramihang תָבֹאוּ ay tinumbasan ng “pumasok kayo.”
- source_word: אֶרֶץ כְּנַעַן
  choice: lupain ng Canaan
  rationale: Pinananatili nito ang tiyak na heograpikong katawagan at gumagamit ng karaniwang makabagong Filipino.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: na ibinibigay ko sa inyo
  rationale: Ang participle na נֹתֵן ay nagpapahiwatig ng kasalukuyan o nalalapit na pagkilos ng Diyos; malinaw rin ang unang panauhang banal na tagapagsalita.
- source_word: לַאֲחֻזָּה
  choice: bilang pag-aari
  rationale: Ang אֲחֻזָּה ay tumutukoy sa lupaing hawak o pag-aari; hindi idinagdag ang mas tiyak na diwa ng “mana” na hindi kinakailangan dito.
- source_word: וְנָתַתִּי
  choice: at maglagay ako
  rationale: Bagaman literal na maaaring “ibigay ko,” ang “maglagay ako” ay natural sa Filipino at pinananatili ang tuwirang pagkilos ng Diyos.
- source_word: נֶגַע צָרַעַת
  choice: salot na tsaraat
  rationale: Ang נֶגַע ay isang pinsala, salot, o nakikitang paglitaw ng karamdaman, samantalang ang צָרַעַת ay mas malawak kaysa sa modernong ketong at maaari ring tumukoy sa kondisyon ng bahay. Pinanatili ang teknikal na salitang “tsaraat” at ipinaliwanag sa talababa upang maiwasan ang maling medikal na pagtutumbas.
- source_word: בְּבֵית
  choice: sa isang bahay
  rationale: Natural na ipinapahayag nito ang lokasyon ng kondisyon sa bahay.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: lupaing pag-aari ninyo
  rationale: Pinananatili nito ang pag-uulit ng ugat na אֲחֻזָּה at ang diin sa lupa bilang pag-aari ng Israel.
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa paglitaw ng salot sa bahay
  choice: “at maglagay ako ng salot”
  alternative: “at lumitaw ang salot” o “at magkaroon ng salot”
  rationale: Malinaw na unang panauhan ang וְנָתַתִּי. Pinananatili ng salin ang mahirap na teolohikal na pahayag na ang Diyos mismo ang naglalagay nito, sa halip na gawing di-tiyak o walang tahasang gumagawa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lupain” para sa teritoryo at “pag-aari” para sa legal na paghawak ng lupa. Ang teknikal na “tsaraat” ay pinanatili dahil magiging mapanlinlang sa konteksto ng isang bahay ang payak na “ketong” o “sakit sa balat.”
