base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: tl
  text: Pagkatapos, kukunin ng pari ang korderong pang-handog para sa pagkakasala[a] at ang isang log ng langis[b]. Iwawagayway ng pari ang mga ito bilang handog na iwinawagayway sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang kordero ng handog para sa pagkakasala”; tradisyonal na “korderong handog para sa paglabag.”
    reason: lexical_alternative
  - marker: b
    text: Ang “log” ay isang maliit na yunit ng sukat para sa likido na ginagamit sa sistemang pangritwal ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukunin
  rationale: Ipinahihiwatig ng waw na kasunod na hakbang ito sa ritwal; natural sa makabagong Tagalog ang “Pagkatapos,” habang pinananatili ng “kukunin” ang pautos na bisa ng legal na tagubilin.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas ng כֹּהֵן sa kontekstong pangritwal. Inulit ang simuno sa ikalawang pangungusap gaya ng pag-uulit sa Hebreo.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: ang korderong handog para sa pagkakasala
  rationale: Pinananatili nitong hayag ang uri ng hayop at ang natatanging kategorya ng hain na אָשָׁם, sa malinaw at likas na Tagalog.
- source_word: לֹג הַשָּׁמֶן
  choice: ang isang log ng langis
  rationale: Ang לֹג ay tiyak na sinaunang yunit ng sukat para sa likido; pinanatili ang teknikal na katawagang “log” at ipinaliwanag sa talababa.
- source_word: וְהֵנִיף
  choice: Iwawagayway
  rationale: Ang Hiphil ng נוּף ay tumutukoy sa ritwal na pagwagayway o paghaharap ng handog; ang “iwawagayway” ay malinaw at nagpapanatili sa pisikal na kilos.
- source_word: אֹתָם
  choice: ang mga ito
  rationale: Ang panghalip na maramihan ay kapuwa tumutukoy sa kordero at sa log ng langis.
- source_word: תְּנוּפָה
  choice: bilang handog na iwinawagayway
  rationale: Pinananatili ang teknikal na kategoryang panghain at ang pagkakaugnay nito sa pandiwang “iwawagayway,” kahit may sinadyang pag-uulit gaya ng Hebreo.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang parirala ay nagsasaad ng ritwal na paghaharap sa presensya ni Yahweh; ang pangalang tipan ay tuwirang isinalin bilang “Yahweh.”
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang nasa teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Paglalapat sa אָשָׁם bilang uri ng hain
  choice: handog para sa pagkakasala
  alternative: handog para sa pagkakasalang nangangailangan ng kabayaran; handog para sa paglabag
  rationale: Malinaw ito sa karaniwang mambabasa at pinananatiling natatangi ang kategoryang panghain, nang hindi ipinipilit sa mismong teksto ang lahat ng posibleng diwa ng pananagutan o kabayaran.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa dalawang pangungusap upang maging natural ang daloy, ngunit pinanatili ang pag-uulit ng “pari,” ang maramihang layon, at ang teknikal na ritwal na pananalita ng Hebreo.
