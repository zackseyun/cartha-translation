base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: tl
  text: Pagkatapos, pakakawalan niya ang buhay na ibon sa bukás na parang sa labas ng lungsod. Sa gayon, magbabayad-sala siya para sa bahay[a], at magiging malinis ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lilinisin niya sa ritwal ang bahay” o “magsasagawa siya ng pagbabayad-sala para sa bahay.” Gumagamit dito ang Hebreo ng terminolohiyang pansaserdote tungkol sa pagbabayad-sala sa konteksto ng ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: Pagkatapos, pakakawalan niya
  rationale: Ang Piel ng שלח ay tumutukoy rito sa ritwal na pagpapalaya sa ibon. Likas sa modernong Tagalog ang “pakakawalan,” at ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod na dala ng waw.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ang buhay na ibon
  rationale: Ipinakikita ng pang-uri ang pagkakaiba nito sa ibong pinatay na sa naunang bahagi ng ritwal. Maikli, malinaw, at natural ang “buhay na ibon.”
- source_word: אֶל מִחוּץ לָעִיר אֶל פְּנֵי הַשָּׂדֶה
  choice: sa parang sa labas ng lungsod
  rationale: Pinagsasama ng parirala ang paglabas sa hangganan ng lungsod at ang pagtungo sa lantad na bukirin. Ang “parang” ay natural na katumbas ng bukás na lupain at iniiwasan ang salitang-sa-salitang “sa harap ng bukid.”
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: magbabayad-sala siya para sa bahay
  rationale: Pinananatili ng “magbabayad-sala” ang wikang pangritwal ng כפר at ang kakaibang paglalapat nito sa isang bahay, sa halip na paliitin ang kahulugan tungo lamang sa karaniwang paglilinis.
- source_word: וְטָהֵר
  choice: at magiging malinis ito
  rationale: Ang Qal na טהר ay nagsasaad ng kalagayang malinis na bunga ng ritwal. Nililinaw ng “ito” na ang bahay ang magiging malinis nang hindi ginagawang tahasang transitive ang pandiwa.
theological_decisions:
- issue: Ang kahulugan ng כפר sa konteksto ng ritwal na paglilinis ng isang bahay
  choice: magbabayad-sala siya para sa bahay
  alternative: lilinisin niya sa ritwal ang bahay; magsasagawa siya ng pambayad-sala para sa bahay
  rationale: Ginagamit ng teksto ang wikang saserdotal tungkol sa pagbabayad-sala kahit bahay ang tinutukoy. Pinananatili ng salin ang teolohikal at leksikal na tensiyong ito, habang inilalahad sa talababa ang posibleng diin sa paglilinis o pagpapawalang-sala nang hindi nagpapasok ng isang tiyak na teoryang doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “lungsod” at “parang,” habang pinanatili ang wikang pangritwal na “magbabayad-sala” upang hindi mawala ang teolohikal na tensiyon ng Hebreo.
