base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: tl
  text: at tungkol sa pamamaga, sa pantal[a], at sa maputing batik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “langib,” “butlig,” o “pamamalat”; hindi tiyak ang eksaktong uri ng kondisyon sa balat na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “matingkad na batik”; maaari ring “maputing bahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: pamamaga
  rationale: Sa konteksto ng Levitico 13–14, tumutukoy ito sa nakaumbok o namamagang bahagi ng balat. Ang “pamamaga” ay maikli, natural, at hindi labis na tumutukoy sa isang tiyak na karamdaman.
- source_word: סַפַּחַת
  choice: pantal
  rationale: Tumutukoy ito sa isang uri ng paglitaw o pagbabago sa balat, ngunit hindi tiyak ang eksaktong katumbas na terminong dermatolohikal. Ang “pantal” ay karaniwan at madaling maunawaan; inilalahad sa talababa ang ibang maaaring salin.
- source_word: בֶּהֶרֶת
  choice: maputing batik
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa matingkad o maputing bahagi ng balat. Ang “maputing batik” ay likas sa Filipino at angkop sa pagsusuri sa balat, habang pinananatili sa talababa ang literal na diwa ng ningning.
- source_word: וְ/לַ
  choice: at tungkol sa / sa
  rationale: Ang inuulit na pang-ukol ay nagdurugtong sa mga huling bagay sa naunang buod ng mga tuntunin. Ang “at tungkol sa” sa unang item at pinaikling “sa” sa kasunod ay natural sa Filipino at nagpapanatili sa anyong talaan.
