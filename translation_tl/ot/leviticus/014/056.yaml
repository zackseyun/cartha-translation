translation_notes:
  register: Modernong Filipino na malinaw at marangal, na pinananatili ang maikling anyong talaan ng tekstong Hebreo. Hindi ginamit ang mas teknikal na terminong medikal dahil hindi tiyak ang eksaktong mga kondisyong tinutukoy.
