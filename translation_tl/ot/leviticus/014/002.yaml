base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: tl
  text: '“Ito ang magiging tuntunin para sa taong may tsaraat[a] sa araw ng kaniyang paglilinis: dadalhin siya sa pari.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tsaraat” ay salin-titik ng terminong Hebreo para sa isang kondisyong may kaugnayan sa karumihang ritwal. Tradisyonal itong isinasaling “ketong,” ngunit hindi ito kinakailangang tumukoy sa modernong ketong o Hansen’s disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: Ito ang magiging
  rationale: Pinananatili ang pambungad na demonstratibo at ang legal/prosedural na diwa ng imperfect na תִּהְיֶה sa natural na Tagalog.
- source_word: תּוֹרַת
  choice: tuntunin para sa
  rationale: Sa kontekstong ito, ang תּוֹרָה ay tumutukoy sa itinakdang ritwal na pamamaraan; mas malinaw sa karaniwang mambabasa ang “tuntunin” kaysa sa mas malawak na “kautusan.”
- source_word: הַמְּצֹרָע
  choice: taong may tsaraat
  rationale: Ginamit ang transliterasyong “tsaraat” upang hindi ito ipagkamali sa tiyak na modernong sakit na ketong o Hansen’s disease, at “taong may” upang hindi iugnay ang buong pagkakakilanlan ng tao sa kondisyon.
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: sa araw ng paglilinis sa kanya
  rationale: Ipinapahayag nito ang takdang panahon at ang ritwal na paglilinis nang hindi ipinahihiwatig na siya mismo ang gumagawa ng paglilinis.
- source_word: וְהוּבָא
  choice: dadalhin siya
  rationale: Pinananatili ang balintiyak na anyo ng Hophal at ang diwang prosedyural ng sugnay.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Ang tiyak na anyo sa Hebreo ay tumutukoy sa paring nangangasiwa sa ritwal; natural sa Tagalog ang “sa pari” sa ganitong konteksto.
theological_decisions:
- issue: Kaugnayan ng מְצֹרָע sa tradisyonal na terminong “ketong”
  choice: taong may tsaraat
  alternative: taong may ketong; taong may sakit sa balat
  rationale: Hindi eksaktong katumbas ng modernong ketong o Hansen’s disease ang kondisyong tinutukoy ng Hebreo, at maaaring maging labis na makitid ang “sakit sa balat.” Pinananatili ng transliterasyon ang natatanging kategoryang ritwal sa Levitico at ipinaliliwanag ito sa talababa.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Pinanatili ang anyong legal-prosedural ng talata, habang ipinaliwanag sa talababa ang teknikal na terminong “tsaraat.”
