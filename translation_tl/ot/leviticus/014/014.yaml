  to: 'Pagkatapos, kukuha ang pari ng kaunting dugo[a] mula sa handog para sa pagkakasala. Ilalagay niya ito sa pingol[b] ng kanang tainga ng taong dinadalisay, sa hinlalaki ng kanang kamay nito, at sa malaking daliri ng kanang paa nito.


