base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: tl
  text: 'Pagkatapos, kukuha ang pari ng kaunting dugo[a] mula sa handog para sa pagkakasala. Ilalagay niya ito sa pingol[b] ng kanang tainga ng taong dinadalisay, sa hinlalaki ng kanang kamay nito, at sa malaking daliri ng kanang paa nito.


    [a] Sa Hebreo, “mula sa dugo ng handog para sa pagkakasala”; ipinahihiwatig na bahagi lamang ng dugo ang kukunin ng pari para sa ritwal.


    [b] O “dulo ng tainga.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa dugo ng handog para sa pagkakasala”; ipinahihiwatig na bahagi lamang ng dugo ang kukunin ng pari para sa ritwal.
    reason: lexical_alternative
  - marker: b
    text: O “dulo ng tainga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם
  choice: kaunting dugo mula sa
  rationale: 'Ipinahahayag nito nang likas sa Tagalog ang partitive na diwa ng מִן: bahagi ng dugo, hindi ang lahat, ang kukunin para sa ritwal. Pinananatili sa talababa ang mas literal na anyo.'
- source_word: הָאָשָׁם
  choice: handog na pambayad sa kasalanan
  rationale: Tinutukoy ng אָשָׁם ang natatanging uri ng handog kaugnay ng pagkakasala at pagbabayad-pinsala; ang pariralang ito ay malinaw sa karaniwang mambabasa at naihihiwalay hangga't maaari sa simpleng handog para sa kasalanan.
- source_word: תְּנוּךְ אֹזֶן
  choice: pingol ng ... tainga
  rationale: Ang pingol ang pinakaangkop at likas na katawagan sa malambot na ibabang bahagi ng tainga; inilalagay sa talababa ang posibleng mas pangkalahatang kahulugang “dulo.”
- source_word: הַמִּטַּהֵר
  choice: taong dinadalisay
  rationale: Pinananatili nito ang diwang ang tao ay sumasailalim pa sa ritwal na pagdadalisay, sa halip na ipinahihiwatig na siya ang nagdadalisay sa sarili o tapos na ang proseso.
- source_word: הַיְמָנִית
  choice: kanang
  rationale: Ito ang tuwiran at likas na katumbas sa Tagalog para sa bawat bahagi ng katawan na nasa kanan.
- source_word: בֹּהֶן יָדוֹ
  choice: hinlalaki ng kanang kamay nito
  rationale: Ang בֹּהֶן kapag kaugnay ng kamay ay tumutukoy sa hinlalaki. Ginamit ang “nito” upang malinaw na tumukoy sa taong dinadalisay.
- source_word: בֹּהֶן רַגְלוֹ
  choice: hinlalaki ng kanang paa nito
  rationale: Sa paa, ang בֹּהֶן ay ang malaking daliri; karaniwang tinatawag din itong “hinlalaki ng paa” sa modernong Tagalog.
- source_word: וְלָקַח ... וְנָתַן
  choice: kukuha ... ilalagay
  rationale: Sa kontekstong legal at ritwal, ang mga pandiwa ay nagbibigay ng itinakdang hakbang. Likas sa Tagalog ang aspektong kontemplatibo para sa ganitong tagubilin.
theological_decisions:
- issue: Kalagayan ng taong saklaw ng ritwal na pagdadalisay
  choice: “taong dinadalisay,” na sumasailalim sa proseso
  alternative: “taong nagdadalisay sa sarili” o “taong nadalisay na”
  rationale: Ang hitpael participle ng טהר sa kontekstong ito ay tumutukoy sa taong tumatanggap ng gawaing ritwal ng pari. Hindi nito ipinahihiwatig ang sariling pagdadalisay o na ganap nang natapos ang proseso.
- issue: Pagpapangalan sa אָשָׁם
  choice: handog na pambayad sa kasalanan
  alternative: handog para sa pagkakasala; handog na kabayaran
  rationale: Pinananatili ng salin ang kaugnayan sa pagkakasala at reparasyon nang hindi ipinapantay nang tahasan ang אָשָׁם sa ibang uri ng handog gaya ng חַטָּאת.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal ang himig. Ginamit ang “dinadalisay” para sa ritwal na kalinisan at ang “pingol” bilang karaniwang katawagang anatomikal. Hinati sa dalawang pangungusap upang maging madaling sundan ang mahabang tagubiling ritwal nang hindi binabago ang pagkakasunod-sunod ng mga kilos.
