lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive na may דּבר ay nagpapasimula ng bagong pangyayari ng pagsasalita; natural at marangal sa makabagong Tagalog ang “Nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na pananda bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakagawiang anyo ng pangalang משה sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa nilalaman ng kasunod na pahayag, bagaman mas pormal ito kaysa sa karaniwang Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulo nang hindi nagpapasok ng denominasyonal na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal na hulma ng pormulang Hebreo; ang kuwit sa hulihan ay naghuhudyat na magpapatuloy sa susunod na talata ang mismong sinabi.
