translation:
  language: tl
  text: Pagkatapos, kakatayin niya ang isang ibon sa isang sisidlang luwad na may tubig na buhay[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “tubig na buhay”; ibig sabihin, sariwa o umaagos na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: Pagkatapos, kakatayin niya
  rationale: Ang waw na kasunod ng anyong qatal ay nagsasaad ng susunod na hakbang sa ritwal. Likas sa Filipino ang “Pagkatapos” para sa pagkakasunod-sunod, at mas tiyak ang “kakatayin” kaysa “papatayin” para sa ritwal na pagpatay sa hayop.
- source_word: הַצִּפֹּר הָאֶחָת
  choice: ang isang ibon
  rationale: Tinutukoy nito ang isa sa dalawang ibong nabanggit sa konteksto nang hindi ipinapalagay na ito ang “unang” ibon.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: na nasa isang sisidlang luwad
  rationale: Sa konstruksiyong ito, ang ibon ay kinakatay upang ang dugo ay mapunta sa sisidlan. Inayos ang parirala sa natural na sintaks ng Filipino, at malinaw na ang tubig ay nasa sisidlang yari sa luwad.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Ipinapahiwatig na isinasagawa ang pagkatay sa ibabaw ng tubig sa sisidlan.
- source_word: מַיִם חַיִּים
  choice: tubig na buhay
  rationale: Pinananatili ang literal at biblikal na pahayag ng Hebreo; ipinaliliwanag sa talababa na tumutukoy ito sa sariwa o umaagos na tubig.
theological_decisions:
- issue: Kahulugan ng מַיִם חַיִּים sa konteksto ng ritwal na paglilinis
  choice: tubig na buhay
  alternative: sariwang tubig; umaagos na tubig
  rationale: Bagaman ang idyoma ay tumutukoy sa tubig na sariwa o umaagos at hindi nakatigil, pinananatili sa pangunahing teksto ang literal na larawan at posibleng mas malawak na biblikal na alingawngaw nito. Nililinaw ng talababa ang kahulugang praktikal sa ritwal nang hindi inaalis ang pahayag ng pinagmulang teksto.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “kakatayin” bilang karaniwang salitang tiyak sa pagkatay, “sisidlang luwad” para sa כלי חרשׂ, at pinanatili ang di-karaniwang “tubig na buhay” upang maging lantad ang larawan ng Hebreo, kalakip ang paliwanag sa talababa.
