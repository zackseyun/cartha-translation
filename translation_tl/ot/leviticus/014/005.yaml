translation:
  language: tl
  text: Pagkatapos, iuutos ng pari na katayin ang isa sa mga ibon sa ibabaw ng isang sisidlang gawa sa luwad na may sariwang tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “tubig na buhay,” ibig sabihin, umaagos o sariwang tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Pagkatapos, iuutos
  rationale: Ipinahihiwatig ng waw at ng anyong pandiwa sa kontekstong legal-prosidyural ang kasunod na hakbang at ang kinakailangang utos; natural itong naipapahayag sa Filipino sa pamamagitan ng “Pagkatapos, iuutos.”
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang salin ng כֹּהֵן sa kontekstong panritwal at pambatas.
- source_word: וְשָׁחַט
  choice: na katayin
  rationale: Bagaman aktibo ang anyong Hebreo, hindi tahasang tinutukoy ang tagaganap matapos mag-utos ang pari. Pinananatili ng kayariang “iuutos ... na katayin” ang hindi tiyak na tagaganap at ang diwang panritwal ng pagpatay.
- source_word: אֶת־הַצִּפּוֹר הָאֶחָת
  choice: ang isa sa mga ibon
  rationale: Tinutukoy nito ang isa mula sa dalawang ibong binanggit sa naunang talata; malinaw at natural ang ganitong pagtukoy sa Filipino.
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: sa ibabaw ng isang sisidlang luwad
  rationale: Sa konteksto, ang ibon ay kinakatay kaugnay ng sisidlan upang mapunta rito ang dugo. Ang “sa ibabaw ng” ay natural at hindi labis na nagtatakda kung ang diin ng אֶל ay direksiyon papasok o lokasyon sa ibabaw.
- source_word: עַל מַיִם חַיִּים
  choice: na may sariwang tubig
  rationale: Ang literal na “tubig na buhay” ay tumutukoy rito sa sariwa o umaagos na tubig. Ipinahahayag ng “na may” na nasa sisidlan ang tubig, samantalang inilalagay sa talababa ang literal at iba pang posibleng salin.
theological_decisions:
- issue: Kahulugan ng מַיִם חַיִּים sa ritwal ng paglilinis
  choice: sariwang tubig
  alternative: tubig na buhay; umaagos na tubig
  rationale: Sa kontekstong ito, ang parirala ay tumutukoy sa tubig na sariwa at hindi nakatigil, hindi tuwirang sa mas huling simbolismong teolohikal. Pinananatili sa talababa ang literal na anyo at ang posibleng diin sa pag-agos upang hindi mawala ang saklaw ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “katayin” para sa panritwal na pagpatay at “sisidlang luwad” para sa ceramic na lalagyan. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
