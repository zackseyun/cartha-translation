  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: tl
  text: At ang sinumang humiga[a] sa bahay ay dapat labhan ang kaniyang mga damit[b]; at ang sinumang kumain sa bahay ay dapat labhan ang kaniyang mga damit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matulog.” Ang pandiwang Hebreo ay maaaring mangahulugang “humiga” o “matulog”; mas malawak ang “humiga” at angkop sa kontekstong legal.
    reason: lexical_alternative
  - marker: b
    text: Ang hulaping panghalip sa Hebreo ay panlalaking isahan (“kaniyang”), ngunit ginagamit ito sa pangkalahatang diwa sa tuntuning legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: At ang sinumang humiga
  rationale: Ang may artikulong participle ay tumutukoy sa sinumang tao sa pangkalahatang tuntuning legal. Pinananatili ng “humiga” ang mas malawak na kahulugan ng שׁכב kaysa sa “matulog.”
- source_word: בַּבַּיִת
  choice: sa bahay
  rationale: Tuwiran at likas na salin ng pariralang panlunan.
- source_word: יְכַבֵּס אֶת־בְּגָדָיו
  choice: ay dapat labhan ang kaniyang mga damit
  rationale: Sa kontekstong legal, ipinahihiwatig ng pandiwa ang obligasyon. Ang “dapat labhan” ay malinaw at natural sa makabagong Filipino, habang ang “mga damit” ay karaniwang katumbas ng בְּגָדִים.
- source_word: וְהָאֹכֵל
  choice: at ang sinumang kumain
  rationale: Ang substantibong participle ay may pangkalahatang saklaw; natural na ipinahahayag ito ng “sinumang kumain.”
theological_decisions:
- issue: Kasariang pambalarila ng pangkalahatang utos na legal
  choice: Gamitin ang isahang “sinumang … kaniyang” at ipaliwanag sa talababa ang anyong panlalaki sa Hebreo
  alternative: Gumamit ng tahasang panlalaking “lalaking … kaniyang”
  rationale: Panlalaking isahan ang anyong Hebreo ngunit ginagamit ito bilang pangkalahatang legal na pagtukoy. Walang kasariang ipinakikita ang panghalip na Filipino na “kaniya,” kaya napapanatili ang isahan at pangkalahatang saklaw nang hindi maling nililimitahan ang utos sa mga lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapat” upang likas na maipahayag ang obligasyong legal, at “labhan” sa halip na mas teknikal o makalumang pananalita.
