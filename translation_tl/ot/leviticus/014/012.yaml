id: LEV.14.12
reference: Leviticus 14:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: tl
  text: Pagkatapos, kukunin ng pari ang isang korderong lalaki at ihaharap iyon bilang handog para sa pagkakasala[a], kasama ang isang log ng langis[b], at iwawagayway niya ang mga ito bilang handog na ikinakaway sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog na pambayad-pinsala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “log” ay isang maliit na yunit ng panukat ng likido na ginagamit sa mga ritwal ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukunin
  rationale: Ang waw na nagdurugtong sa sunod-sunod na tagubilin ay likas na ipinahahayag sa Filipino sa pamamagitan ng “Pagkatapos,” habang pinananatili ng “kukunin” ang puwersa ng ritwal na utos.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katumbas ng כֹּהֵן sa kontekstong pansamba.
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: ang isang korderong lalaki
  rationale: Tinutukoy ng כֶּבֶשׂ ang batang tupa, at ipinakikita ng artikulo at bilang na ito ang partikular na isa sa mga hayop sa ritwal. Ang “lalaki” ay angkop sa sakripisyong hayop na tinutukoy ng konteksto.
- source_word: וְהִקְרִיב אֹתוֹ
  choice: at ihaharap iyon
  rationale: Sa kontekstong pansakripisyo, ang הקריב ay pagdadala o paghaharap ng bagay bilang handog. Hindi nito inuunahan ang mas tiyak na kilos na susunod.
- source_word: לְאָשָׁם
  choice: bilang handog para sa pagkakasala
  rationale: Ang אָשָׁם ay teknikal na uri ng handog sa Levitico. Pinananatili ng salin ang kaugnayan nito sa pagkakasala, habang inilalagay sa talababa ang posibleng diin sa pagbabayad-pinsala.
- source_word: לֹג הַשָּׁמֶן
  choice: isang log ng langis
  rationale: Ang לֹג ay tiyak at maliit na sukat ng likido sa sinaunang Israel. Pinanatili ang katawagang “log” sa halip na magbigay ng di-tiyak na makabagong katumbas.
- source_word: וְהֵנִיף אֹתָם תְּנוּפָה
  choice: Iwawagayway niya ang mga iyon bilang handog na iwinawagayway
  rationale: Magkaugnay ang pandiwang הניף at pangngalang תְּנוּפָה. Pinananatili ng pag-uulit ang sinadyang ugnayang leksikal at ang ritwal na galaw.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na katumbas ng pormulang panritwal na לִפְנֵי, at tuwirang tinutumbasan ang banal na pangalan.
theological_decisions:
- issue: Kahulugan ng אָשָׁם bilang uri ng handog
  choice: handog para sa pagkakasala
  alternative: handog na pambayad-pinsala
  rationale: Maaaring idiin ng אָשָׁם kapuwa ang pananagutan sa pagkakasala at ang pagbabayad o pagsasauli. Pinili sa teksto ang mas madaling maunawaang tradisyonal na katawagan, ngunit pinanatili sa talababa ang tunay na leksikal na alternatibo.
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya ginamit ang “Yahweh” sa halip na palitan ito ng titulo.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang mga teknikal na katawagang panritwal kung mahalaga sa pagkakaiba ng mga handog, ngunit nilinaw ang di-pamilyar na sukat sa talababa. Itinama rin ang pagkakatapat ng mga panandang talababa: [a] para sa אָשָׁם at [b] para sa log.'
