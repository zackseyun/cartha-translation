base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: tl
  text: Upang dalisayin ang bahay[a], kukuha siya ng dalawang ibon, kahoy na sedro, sinulid na iskarlata[b], at isopo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “linisin ang bahay.” Sa ritwal na kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa pagdadalisay o paglilinis mula sa ritwal na karumihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hiblang iskarlata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: kukuha siya
  rationale: Ang pandiwang may prefixed conjunction sa sunod-sunod na tagubiling legal at panritwal ay may diwang modal o panghinaharap. Likas sa modernong Tagalog ang “kukuha siya” para sa ipinag-uutos na hakbang.
- source_word: לְחַטֵּא
  choice: upang dalisayin
  rationale: Sa kontekstong panritwal, ang piel ng חטא ay tumutukoy sa paglilinis o pag-aalis ng ritwal na karumihan. Ang “dalisayin” ay nagpapanatili sa sagradong diwa nang hindi ipinahihiwatig na moral na nagkasala ang bahay.
- source_word: אֶת הַבַּיִת
  choice: ang bahay
  rationale: Ang tinutukoy sa kabanata ay ang pisikal na tirahan, hindi ang sambahayan.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: dalawang ibon
  rationale: Dalawang ibon lamang ang tahasang binabanggit sa talatang ito; hindi idinagdag ang “buhay” mula sa kalapit na konteksto.
- source_word: וְעֵץ אֶרֶז
  choice: kahoy na sedro
  rationale: Malinaw at natural na katumbas ito ng pariralang konstruktong tumutukoy sa materyal na kahoy ng sedro.
- source_word: וּשְׁנִי תוֹלַעַת
  choice: sinulid na iskarlata
  rationale: Tumutukoy ang parirala sa materyal o hiblang tinina ng iskarlata na ginagamit sa ritwal. Pinananatili ng salin ang partikular na kulay at ang malamang na anyo ng materyal.
- source_word: וְאֵזֹב
  choice: isopo
  rationale: Ito ang nakagawiang salin sa Bibliya para sa halamang hindi tiyak ang eksaktong makabagong pagkakakilanlan.
theological_decisions:
- issue: Panritwal na diwa ng לְחַטֵּא kapag bahay ang layon
  choice: upang dalisayin ang bahay
  alternative: upang alisin sa bahay ang kasalanan o karumihan; upang linisin ang bahay
  rationale: Ang bahay ay sumasailalim sa ritwal na pagdadalisay, hindi sa moral na kapatawaran. Hindi idinagdag sa pangunahing teksto ang hiwalay na pariralang “mula sa kasalanan,” sapagkat nakapaloob ang ideya ng pag-aalis ng ritwal na karumihan sa pandiwang Hebreo at maaaring magmukhang moral na nagkasala ang bahay. Ipinaliliwanag sa talababa ang lawak ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Inuna ang layuning parirala upang maging natural ang ayos ng pangungusap. Pinanatili ang mga tradisyonal ngunit madaling makilalang katawagang “sedro,” “iskarlata,” at “isopo,” at ipinaliwanag ang mahahalagang alternatibo sa talababa.
