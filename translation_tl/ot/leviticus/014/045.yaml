  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: tl
  text: Pagkatapos, gigibain niya ang bahay—ang mga bato nito, ang mga kahoy nito, at ang lahat ng palitada[a] ng bahay—at ilalabas niya ang mga ito sa isang lugar na hindi malinis sa labas ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng alabok ng bahay” o “lahat ng argamasa ng bahay.” Literal na “lahat ng alabok ng bahay” ang Hebreo, ngunit sa konteksto ng gusali, malamang na tumutukoy ito sa palitada o materyal na kinayod mula sa mga dingding.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: Pagkatapos, gigibain niya
  rationale: Ang pandiwa ay tumutukoy sa pagwasak o pagbaklas sa kontaminadong bahay. Natural sa modernong Tagalog ang “gigibain,” at ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod sa konteksto.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Tumutukoy ito sa pisikal na gusaling sinusuri, kaya ang “bahay” ang tuwiran at karaniwang katumbas.
- source_word: אֲבָנָיו
  choice: ang mga bato nito
  rationale: Pinananatili nito ang kongkretong larawan ng mga batong bahagi ng bahay na gigibain.
- source_word: עֵצָיו
  choice: ang mga kahoy nito
  rationale: Saklaw ng Hebreo ang mga bahaging kahoy ng gusali. Ang “mga kahoy nito” ay malinaw at hindi labis na nagpapakitid sa kahulugan tungo lamang sa mga biga o troso.
- source_word: כָּל עֲפַר הַבָּיִת
  choice: ang lahat ng palitada[a] ng bahay
  rationale: Literal na “lahat ng alabok/lupa ng bahay” ang Hebreo, ngunit sa konteksto ng pagkayod at paggiba ng mga dingding, malamang na tumutukoy ito sa palitada o maluwag na materyal mula sa bahay. Inilalagay sa talababa ang literal at iba pang posibleng kahulugan.
- source_word: וְהוֹצִיא
  choice: at ilalabas niya ang mga iyon
  rationale: Ipinahahayag nito ang sanhiang diwa ng pandiwa at malinaw na tumutukoy sa sama-samang pag-aalis ng mga ginibang materyales.
- source_word: אֶל מִחוּץ לָעִיר
  choice: sa labas ng lungsod
  rationale: Natural na Tagalog ito para sa direksiyong lampas sa hangganan ng pamayanan.
- source_word: אֶל מָקוֹם טָמֵא
  choice: sa isang lugar na di-malinis
  rationale: Pinananatili ng “di-malinis” ang teknikal na diwa ng rituwal na karumihan sa Levitico at iniiwasang ipakahulugan lamang ito bilang pisikal na marumi.
theological_decisions:
- issue: Pagsasalin ng terminolohiya ng rituwal na kalinisan
  choice: di-malinis
  alternative: marumi
  rationale: Ang טָמֵא ay bahagi ng sistemang legal at rituwal ng Levitico. Mas malinaw na teknikal ang “di-malinis” kaysa “marumi,” na maaaring maunawaan bilang may dumi lamang, nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “gigibain” at “ilalabas” bilang natural na pananalita, habang pinanatili ang “di-malinis” bilang mahalagang terminong rituwal sa Levitico.
