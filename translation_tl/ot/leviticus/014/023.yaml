id: LEV.14.23
reference: Leviticus 14:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: tl
  text: Sa ikawalong araw, dadalhin niya ang mga iyon sa pari para sa kanyang paglilinis[a], sa pasukan ng tolda ng pakikipagtagpo, sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa kanyang pagdadalisay.” Ang salitang Hebreo ay tumutukoy rito sa proseso ng ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: dadalhin niya
  rationale: Sa kontekstong legal at panuntunan, ang anyong pandiwa ay may puwersang prospektibo o nag-uutos; likas itong ipinahahayag sa Filipino sa pamamagitan ng “dadalhin niya.”
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang panghalip na maramihan ay tumutukoy sa mga handog na binanggit sa naunang talata; pinananatili ng “ang mga iyon” ang tahasang pagtukoy pabalik.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Sa ikawalong araw
  rationale: Ito ang natural at tumpak na temporal na pananalita sa modernong Filipino.
- source_word: לְטָהֳרָתוֹ
  choice: para sa kanyang paglilinis
  rationale: Tumutukoy ito sa ritwal na proseso ng paglilinis o pagdadalisay. Ang “paglilinis” ay malinaw sa karaniwang mambabasa, habang pinananatili sa talababa ang lehitimong alternatibo.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Direkta at natural na katumbas ng pariralang nagsasaad kung kanino dadalhin ang mga handog.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng pakikipagtagpo
  rationale: Ipinahahayag ng parirala ang patutunguhan at lugar ng ritwal. Ang “tolda ng pakikipagtagpo” ay nagpapanatili sa diwa ng אֹהֶל מוֹעֵד bilang toldang itinakda para sa pakikipagtagpo, nang hindi ito ginagawang simpleng lugar ng pangkalahatang pagpupulong.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na Filipino para sa kultikong pariralang nangangahulugang nasa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh sa halip na palitan ng titulong “PANGINOON,” alinsunod sa tahasang Tetragrammaton sa tekstong Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Ritwal na kahulugan ng לְטָהֳרָתוֹ
  choice: para sa kanyang paglilinis
  alternative: para sa kanyang pagdadalisay
  rationale: Ang konteksto ay seremonyal na pagpapanumbalik, hindi isang pahayag tungkol sa moral na kasalanan. Ang “paglilinis” ay madaling maunawaan, at ang “pagdadalisay” ay ibinibigay bilang lehitimong alternatibong leksikal.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pari” at “tolda ng pakikipagtagpo” bilang madaling maunawaang mga terminong kultiko. Inilagay ang panandang [a] kaagad pagkatapos ng “paglilinis,” na siyang salitang tinutukoy ng talababa.
