base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: tl
  text: At ihahandog niya ang isa sa mga batubato o isa sa mga inakay ng kalapati, ayon sa abot ng kanyang makakaya[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “mula sa naaabot ng kanyang kamay,” isang idyomang Hebreo na nangangahulugang ayon sa kanyang kakayahang pinansiyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: At ihahandog niya
  rationale: Bagaman karaniwang nangangahulugang “gawin,” ang pandiwa sa kontekstong pansakripisyo ay tumutukoy sa paghahandog.
- source_word: אֶת־הָאֶחָד
  choice: ang isa
  rationale: Tumutukoy ito sa isang ibon mula sa dalawang uri na kasunod na binabanggit.
- source_word: מִן־הַתֹּרִים
  choice: sa mga batubato
  rationale: Ang תֹּרִים ay partikular na mga turtledove; “batubato” ang likas na katawagang Filipino sa ibong ito.
- source_word: אוֹ מִן־בְּנֵי הַיּוֹנָה
  choice: o isa sa mga inakay ng kalapati
  rationale: Ang parirala ay karaniwang katawagan sa mga batang kalapati sa mga tuntunin tungkol sa paghahandog; inulit ang “isa” para sa malinaw at natural na Filipino.
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: ayon sa kaya niyang bilhin
  rationale: Literal itong “mula sa maaabot ng kanyang kamay,” isang idyomang Hebreo para sa abot ng kakayahang pinansiyal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “batubato” upang makilala ang turtledove sa karaniwang kalapati, at “kaya niyang bilhin” upang natural na maipahayag ang idyomang tumutukoy sa kakayahang pinansiyal. Pinanatili ang gitling sa dulo dahil nagpapatuloy ang pangungusap sa susunod na talata.
