  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: tl
  text: Ito ang tuntunin para sa taong may malubhang karamdaman sa balat[a], na hindi sapat ang kanyang kakayahan para sa kanyang rituwal na paglilinis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na צָרָעַת ay karaniwang isinasaling “ketong,” ngunit sa Levitico ay mas malawak ang saklaw nito at tumutukoy sa iba't ibang kondisyon sa balat at kaugnay na rituwal na karumihan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi umaabot ang kanyang kamay sa kanyang paglilinis”; isang idyoma ito na nangangahulugang kulang ang kanyang kakayahan o ari-arian para sa mga kinakailangan sa rituwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: tuntunin
  rationale: Sa kontekstong makasaserdote, tumutukoy ito sa itinakdang tuntunin o pamamaraan. Mas natural sa modernong Filipino ang “tuntunin” kaysa “kautusan” sa pangungusap na ito.
- source_word: בּוֹ
  choice: may
  rationale: Likas na ipinahahayag sa Filipino ang pagkakaroon ng kondisyon sa pamamagitan ng “may,” habang pinananatili ang diwa ng Hebreong “nasa kanya.”
- source_word: נֶגַע צָרָעַת
  choice: karamdamang malubha sa balat
  rationale: Hindi tiyak na tumutukoy ang צָרָעַת sa modernong ketong o Hansen's disease. Ipinahahayag ng salin ang malubhang kondisyon sa balat nang hindi ito ipinapantay sa isang tiyak na modernong diagnosis.
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: walang sapat na kakayahan
  rationale: Ang literal na “hindi abot ng kanyang kamay” ay isang idyoma para sa kakulangan ng kakayahang pinansiyal o ari-arian. Ang “walang sapat na kakayahan” ay malinaw at natural nang hindi masyadong nililimitahan sa salapi lamang.
- source_word: בְּטָהֳרָתוֹ
  choice: para sa paglilinis sa kanya
  rationale: Tumutukoy ito sa rituwal na paglilinis na inilalarawan sa naunang mga talata. Pinananatili ng “paglilinis” ang konkretong larawan at ang rituwal na diwa.
theological_decisions:
- issue: Saklaw ng צָרָעַת
  choice: Hindi isinalin bilang “ketong” sa pangunahing teksto.
  alternative: ketong; sakit na ketongin
  rationale: Mas malawak ang kategoryang Levitico kaysa sa modernong Hansen's disease, kaya maiiwasan ng piniling salin ang maling medikal at teolohikal na pagtutumbas.
- issue: Uri ng paglilinis
  choice: Ginamit ang “paglilinis” at ipinaliwanag sa talababa na rituwal ito.
  alternative: pagdadalisay
  rationale: Ang “paglilinis” ay mas madaling maunawaan ng karaniwang mambabasa, samantalang nililinaw ng talababa na ang tinutukoy ay ang itinakdang rituwal at handog.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tuntunin” para sa legal-prosedural na diwa, at iniwasan ang “ketong” bilang tiyak na modernong diagnosis. Inilagay ang mga pananda ng talababa kaagad pagkatapos ng mga pariralang ipinapaliwanag.
