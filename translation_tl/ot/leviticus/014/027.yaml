  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: tl
  text: Pagkatapos, pitong beses na iwiwisik ng pari sa harap ni Yahweh, gamit ang daliri ng kaniyang kanang kamay, ang ilan sa langis na nasa palad ng kaniyang kaliwang kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: Pagkatapos, ... iwiwisik
  rationale: Ang Hiphil ng נזה sa kontekstong ritwal ay nangangahulugang ‘wisikan.’ Isinalin ang pang-ugnay bilang ‘Pagkatapos’ upang natural na maipakita ang sunod-sunod na hakbang sa ritwal.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang salin ng כֹּהֵן sa batas tungkol sa pagsamba at ritwal.
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: gamit ang daliri ng kaniyang kanang kamay
  rationale: Pinananatili nito ang isahang ‘daliri’ at malinaw na ipinahahayag sa natural na Tagalog na iyon ay daliri ng kanang kamay.
- source_word: מִן הַשֶּׁמֶן
  choice: ang ilan sa langis
  rationale: 'Partitibo rito ang מִן: bahagi lamang ng langis ang iwiwisik, hindi ang lahat nito.'
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: na nasa palad ng kaniyang kaliwang kamay
  rationale: Ang כַּף ay partikular na tumutukoy sa palad; pinananatili ng salin ang tiyak na larawan ng langis na nakalagay doon.
- source_word: שֶׁבַע פְּעָמִים
  choice: pitong beses
  rationale: Tuwirang at natural na salin ng bilang ng pagwiwisik.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinahahayag ng לִפְנֵי ang pagkilos sa presensiya ni Yahweh sa kontekstong ritwal, habang pinananatili ang personal na pangalan ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Inayos ang pagkakasunod ng mga parirala upang maging natural sa Tagalog habang pinananatili ang lahat ng detalye ng ritwal: ang pari, kanang daliri, langis sa kaliwang palad, pitong ulit, at pagkilos sa harap ni Yahweh.'
