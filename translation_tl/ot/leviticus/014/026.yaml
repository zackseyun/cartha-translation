  text: And from the oil the priest shall pour onto the palm of his own left hand[a].
translation:
  language: tl
  text: At ang pari ay magbubuhos mula sa langis sa sarili niyang kaliwang palad.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa palad ng pari, ang kaliwa.”
    reason: Ipinapakita ng Hebreo ang pag-uulit ng “pari” at ang pambabaeng pang-uring “kaliwa,” na tumutukoy sa “palad.”
lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: At ... ng langis
  rationale: Ipinagpapatuloy ng וּ ang sunod-sunod na hakbang sa ritwal, at ipinahihiwatig ng מִן na kukuha ang pari mula sa langis na nabanggit na. Sa natural na Tagalog, sapat ang “ng langis” kasunod ng “magbubuhos” nang hindi kailangang idagdag ang interpretibong “kaunti.”
- source_word: יִצֹק
  choice: magbubuhos
  rationale: Ang yiqtol ay nagbibigay rito ng tagubilin para sa susunod na hakbang ng ritwal. Likas at malinaw sa modernong Tagalog ang aspektong kontemplatibo na “magbubuhos.”
- source_word: הַ/כֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin ng כֹּהֵן sa kontekstong pansamba at legal.
- source_word: עַל כַּף
  choice: sa palad
  rationale: Ang עַל ay tumutukoy sa hantungan ng pagbubuhos, at ang כַּף ay tiyak na palad o loob ng kamay, hindi lamang kamay sa pangkalahatan.
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: ng sarili niyang kaliwang kamay
  rationale: Likas nitong ipinahahayag sa Tagalog na ang kaliwang palad ay sa pari ring gumagawa ng pagbubuhos, habang iniiwasan ang alanganing pag-uulit ng “pari.”
