  source_fidelity: Kailangang isalin nang hayag ang מִן (“mula sa”). Ang kasalukuyang “magbubuhos ... ng langis” ay maaaring mangahulugang ibubuhos niya ang langis bilang tuwirang layon at hindi malinaw na ipinahihiwatig na kukuha siya mula sa langis. Ang “sarili niyang kaliwang palad” ay tumpak para sa כַּף at sa panandang “kaliwa.”
  naturalness: Natural at malinaw sa modernong Filipino Tagalog ang “ang pari ay magbubuhos mula sa langis sa sarili niyang kaliwang palad.” Iniiwasan nito ang medyo kalabisan na “palad ng ... kamay” habang pinananatili ang tiyak na kahulugang “palm.”
