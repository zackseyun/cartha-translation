source:
  edition: WLC
  text: וְ/כִבֶּס֩ הַ/מִּטַּהֵ֨ר אֶת בְּגָדָ֜י/ו וְ/גִלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ וְ/רָחַ֤ץ בַּ/מַּ֨יִם֙ וְ/טָהֵ֔ר וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/יָשַׁ֛ב מִ/ח֥וּץ לְ/אָהֳל֖/וֹ שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: tl
  text: Ang taong nililinis ay maglalaba ng kanyang mga damit, aahitin ang lahat ng kanyang buhok, at maliligo sa tubig; sa gayon, magiging malinis siya. Pagkatapos, maaari na siyang pumasok sa kampo[a], ngunit mananatili siya sa labas ng kanyang tolda sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papasok siya sa kampo.” Ang anyong Hebreo ay maaaring unawain bilang simpleng hinaharap o bilang pahintulot; ipinahihiwatig ng konteksto na maaari na siyang bumalik sa kampo, bagaman may natitira pang paghihigpit.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: ang taong nililinis
  rationale: Ang Hitpael participle ay tumutukoy sa taong sumasailalim sa itinakdang ritwal ng paglilinis. Pinananatili ng parirala ang diwang proseso at ritwal nang hindi ipinahihiwatig na siya lamang ang aktibong naglilinis sa sarili.
- source_word: כִבֶּס ... בְּגָדָיו
  choice: maglalaba ng kanyang mga damit
  rationale: Karaniwang tumutukoy ang כִּבֵּס sa paglalaba ng mga kasuotan. Likas at malinaw sa modernong Filipino ang “maglalaba ng kanyang mga damit.”
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: aahitin ang lahat ng kanyang buhok
  rationale: Ipinahahayag ng pandiwa at ng כָּל ang ganap na pag-aalis ng buhok; malinaw na naipapakita ito ng “lahat ng kanyang buhok.”
- source_word: רָחַץ בַּמַּיִם
  choice: maliligo sa tubig
  rationale: Sa kontekstong ritwal, tumutukoy ang רָחַץ sa paghuhugas ng katawan. Ibinubukod ng “maliligo” ang kilos na ito mula sa naunang paglalaba ng damit.
- source_word: וְטָהֵר
  choice: sa gayon, magiging malinis siya
  rationale: Inilalahad ng sugnay ang resultang katayuang ritwal matapos ang mga paghuhugas. Ipinakikita ng “sa gayon” ang bunga at pagkakasunod-sunod.
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: maaari na siyang pumasok sa kampo
  rationale: Maaaring basahin ang imperfect bilang simpleng hinaharap o bilang pahintulot. Dahil sa kasunod na patuloy na pagbabawal na pumasok sa sariling tolda, natural sa konteksto ang pinahihintulutang muling pagpasok sa kampo.
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: ngunit mananatili siya sa labas ng kanyang tolda
  rationale: Dito, ang יָשַׁב ay nangangahulugang pansamantalang manatili o manirahan. Nililinaw ng “ngunit” ang tunay na paghahambing sa pagpasok sa kampo, bagaman simpleng waw ang pang-ugnay sa Hebreo.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Ito ang natural na modernong Filipino para sa takdang haba ng panahon.
theological_decisions:
- issue: Kalikasan ng wikang tumutukoy sa ritwal na kalinisan
  choice: “nililinis/malinis” bilang katayuang ritwal
  alternative: “dinadalisay/dalisay” o moral na paglilinis
  rationale: Ang konteksto ay ritwal na pagpapanumbalik ayon sa Levitico, hindi pangunahing paglilinis sa moralidad o kalooban. Pinananatili ng salin ang ritwal na diwa nang hindi nagdaragdag ng doktrinal na pahayag.
- issue: Lakas ng pandiwang יָבֹא sa muling pagpasok sa kampo
  choice: “maaari na siyang pumasok”
  alternative: “papasok siya” o “dapat siyang pumasok”
  rationale: Tunay na malabo kung simpleng hinaharap o pahintulot ang anyo. Pinili sa teksto ang pahintulot dahil pinapayagan na ang pagpasok sa kampo habang nananatili ang paghihigpit tungkol sa tolda; itinala sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “kampo” at “tolda” bilang karaniwan at malinaw na bokabularyo. Iniwasan ang labis na teknikal o moralizing na pananalita, at pinanatili ang sunod-sunod na daloy ng ritwal.
