base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: tl
  text: Kukunin niya ang buhay na ibon, pati ang kahoy na sedro, ang sinulid na matingkad na pula, at ang isopo. Pagkatapos, ilulubog niya ang mga iyon at ang buhay na ibon sa dugo ng ibong kinatay sa ibabaw ng sariwang tubig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “buhay na tubig”; maaari ding isaling “umaagos na tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ang ibong buhay
  rationale: Tuwirang pinananatili ang kaibahan ng buhay na ibon sa ibong kinatay, at natural itong pakinggan sa modernong Tagalog.
- source_word: יִקַּח
  choice: Kukunin niya
  rationale: Ang imperpektibo ay may puwersang panuntunan sa konteksto ng ritwal; malinaw itong naipapahayag ng anyong panghinaharap sa Tagalog.
- source_word: עֵץ הָאֶרֶז
  choice: ang kahoy na sedro
  rationale: Ipinahihiwatig ng parirala ang kahoy o piraso ng kahoy na mula sa sedro, hindi kinakailangang isang buong puno.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: ang sinulid na matingkad na pula
  rationale: Inilalarawan nito ang pulang materyal na tinina; ang 'sinulid' ay malinaw at angkop sa talaan ng mga gamit sa ritwal.
- source_word: הָאֵזֹב
  choice: ang isopo
  rationale: Ito ang nakaugaliang salin ng halamang ginagamit sa ritwal, bagaman hindi ganap na tiyak ang eksaktong uring botanikal.
- source_word: וְטָבַל
  choice: ilulubog niya
  rationale: Ipinapahayag nito ang paglubog o pagsawsaw sa likido bilang bahagi ng ritwal.
- source_word: אוֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip sa kahoy na sedro, pulang sinulid, at isopo na kababanggit lamang.
- source_word: בְּדַם
  choice: sa dugo ng
  rationale: Ang pang-ukol ay tumutukoy sa likidong pinaglulubugan ng mga bagay at ng buhay na ibon.
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: ibong kinatay
  rationale: Pinananatili ng 'kinatay' ang ritwal na diwa ng pandiwa, sa halip na gamitin ang mas pangkalahatang 'pinatay.'
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: sa ibabaw ng sariwang tubig
  rationale: Sa kontekstong ito, ang literal na 'buhay na tubig' ay tumutukoy sa sariwa o umaagos na tubig; malinaw ang pangunahing salin habang pinananatili sa talababa ang literal na anyo.
theological_decisions:
- issue: Kahulugan ng מַיִם חַיִּים sa ritwal ng paglilinis
  choice: sariwang tubig
  alternative: buhay na tubig; umaagos na tubig
  rationale: Ang parirala ay literal na 'buhay na tubig' ngunit sa sinaunang gamit ay tumutukoy sa sariwa o umaagos na tubig. Iniiwasan ng pangunahing salin ang pagpasok ng mga kahulugang teolohikal mula sa ibang konteksto, samantalang itinatala ang literal at alternatibong salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pangkaraniwang ayos ng pangungusap at hinati sa dalawang pangungusap upang madaling masundan ang sunod-sunod na tagubilin nang hindi binabago ang ugnayan ng mga bahagi ng ritwal.
