  to: Kukunin niya ang buhay na ibon, pati ang kahoy na sedro, ang sinulid na matingkad na pula, at ang isopo. Pagkatapos, ilulubog niya ang mga iyon at ang buhay na ibon sa dugo ng ibong kinatay sa ibabaw ng sariwang tubig.[a]
