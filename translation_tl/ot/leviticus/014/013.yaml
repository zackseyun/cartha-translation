base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: tl
  text: At kakatayin niya ang kordero sa lugar na pinapatayan ng handog para sa kasalanan[a] at ng handog na sinusunog, sa banal na lugar. Sapagkat tulad ng handog para sa kasalanan, ang handog para sa pagkakasala[b] ay para sa pari; ito ay kabanal-banalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Binibigyang-diin ng saling ito ang tungkulin ng ritwal na maglinis.
    reason: lexical_alternative
  - marker: b
    text: O “handog para sa kabayaran.” Binibigyang-diin ng saling ito ang pagsasauli o pagbabayad-pinsala na kaugnay ng handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: At papatayin niya ... bilang handog
  rationale: Ang שׁחט ay tumutukoy sa ritwal na pagpatay sa hayop na ihahandog. Idinagdag ang “bilang handog” upang maging malinaw sa natural na Tagalog ang kultikong diwa nang hindi ginagawang karaniwang pagpatay lamang.
- source_word: הַכֶּבֶשׂ
  choice: ang kordero
  rationale: Ang כֶּבֶשׂ ay karaniwang tumutukoy sa batang tupa sa mga batas tungkol sa paghahandog; natural at pamilyar ang “kordero” sa kontekstong ito.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: sa lugar na pinapatayan
  rationale: Maaaring gamitin nang pangkalahatan o impersonal ang isahang pandiwang Hebreo. Ang “pinapatayan” ay natural na impersonal na Tagalog at tumutukoy sa itinakdang lugar ng ritwal.
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Pinananatili nito ang kinikilalang pangalan ng uri ng handog, habang inilalagay sa talababa ang makabuluhang alternatibong nagbibigay-diin sa paglilinis.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Ito ang malinaw at karaniwang katumbas ng עֹלָה, ang handog na sinusunog sa altar.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Ang parirala ay tumutukoy sa itinakdang sagradong lugar ng pagpatay sa handog.
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: Sapagkat tulad ng handog para sa kasalanan, ang handog para sa pagkakasala ay para sa pari
  rationale: Pinananatili ang paghahambing ng dalawang uri ng handog at ang diwa ng לַכֹּהֵן na ito ay ukol o nakalaan sa pari, nang hindi labis na tinutukoy ang eksaktong anyo ng pagmamay-ari.
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: ito ay kabanal-banalan
  rationale: Ang konstruksiyong Hebreo ay teknikal na sukdulang antas ng kabanalan. Ang “kabanal-banalan” ay maikli, marangal, at pamilyar na katumbas sa Tagalog.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring itampok ng terminong Hebreo ang kasalanan o ang ritwal na paglilinis. Ginamit sa pangunahing teksto ang mas kinikilalang pangalan ng kategorya, ngunit pinanatili sa talababa ang tunay na alternatibong pagbasa.
- issue: Kahulugan ng אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog para sa kabayaran
  rationale: Ipinapahayag ng pangunahing salin ang tradisyonal na kategoryang kaugnay ng pagkakasala; ang alternatibo ay nagbibigay-diin sa dimensiyon ng pagsasauli o pagbabayad-pinsala at kaya ay inilagay sa talababa.
- issue: Diwa ng לַכֹּהֵן
  choice: ay para sa pari
  alternative: ay pag-aari ng pari
  rationale: Ang “para sa pari” ay mas malapit sa malawak na saklaw ng pariralang Hebreo at hindi sapilitang nilulutas kung ito ay tumutukoy sa paglalaan, karapatan, o pagmamay-ari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magkakatugmang katawagan para sa mga uri ng handog, impersonal na “pinapatayan” para sa pangkalahatang legal na pahayag, at “kabanal-banalan” para sa teknikal na antas ng kabanalan.
