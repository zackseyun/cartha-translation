  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: tl
  text: upang magbigay ng tagubilin kung kailan ito marumi at kung kailan ito malinis. Ito ang kautusan tungkol sa kalagayang nagpaparumi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin na “ketong.” Ang terminong Hebreo ay maaaring tumukoy sa mga kalagayang nagpaparumi sa tao, tela, o bahay, at hindi lamang sa modernong Hansen's disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: upang magbigay ng tagubilin
  rationale: 'Ipinahahayag ng Hiphil infinitive ang layunin ng naunang mga tuntunin: magbigay ng may-awtoridad na tagubilin sa pagkilala sa ritwal na kalagayan.'
- source_word: בְּיוֹם הַטָּמֵא
  choice: kung kailan ito marumi
  rationale: Ang בְּיוֹם ay isang temporal na idyoma rito; tumutukoy ito sa kung kailan umiiral ang karumihan, hindi sa isang literal na araw sa kalendaryo.
- source_word: וּבְיוֹם הַטָּהֹר
  choice: at kung kailan ito malinis
  rationale: Pinananatili ng magkatulad na anyo ang tuwirang paghahambing sa malinis at maruming kalagayan.
- source_word: תּוֹרַת
  choice: ang kautusan tungkol sa
  rationale: Sa pangwakas na pormulang ito, ang תּוֹרָה ay tumutukoy sa namamahalang kautusan o tagubilin para sa kasunod na kategorya.
- source_word: הַצָּרָעַת
  choice: kalagayang nagpaparumi
  rationale: 'Mas malawak ang Hebreong kategorya kaysa sa isang sakit sa balat: maaari itong makaapekto sa tao, tela, o bahay. Ipinahahayag ng salin ang iisang ritwal na epekto nang hindi ito maling itinutumbas sa modernong Hansen''s disease.'
theological_decisions:
- issue: Pagkasalin sa צָרַעַת sa mga kautusan tungkol sa ritwal na kalinisan
  choice: kalagayang nagpaparumi
  alternative: ketong; sakit sa balat
  rationale: Ang saklaw ng termino sa Levitico ay kinabibilangan ng tao, tela, at bahay. Kaya iniiwasan ng pangunahing teksto ang makitid at anakronistikong medikal na pagkakakilanlan, samantalang inilalahad sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kung kailan” sa halip na literal na “sa araw” upang likas na maipahayag ang temporal na idyoma; pinanatili ang mga salitang “marumi” at “malinis” bilang teknikal na mga kategorya ng ritwal na kalinisan.
