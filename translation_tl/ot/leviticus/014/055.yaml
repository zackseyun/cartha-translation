lexical_decisions:
- source_word: וּלְ
  choice: at tungkol sa
  rationale: Ipinagpapatuloy ng pang-ugnay at pang-ukol ang talaan ng mga bagay na saklaw ng naunang kautusan; natural sa Filipino ang “at tungkol sa.”
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Dahil ang terminong Hebreo ay maaaring tumukoy sa sari-saring karamdamang pantao o pinsala sa damit at bahay, pinanatili ang transliterasyon upang hindi ito maling ipakahulugang ketong, sakit sa balat, o amag lamang.
- source_word: הַבֶּגֶד
  choice: damit
  rationale: Ang pangkalahatang “damit” ay natural at malinaw na katumbas ng Hebreong pangngalan sa kontekstong ito.
- source_word: וְלַבָּיִת
  choice: o sa bahay
  rationale: Ang “o” ay natural na nagpapakita ng alternatibong lugar na apektado sa talaan, habang ang “sa” ay naghahayag ng lokatibong diwa ayon sa konteksto.
