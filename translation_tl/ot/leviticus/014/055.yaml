  source_fidelity: Ang “tsaraat” ay wastong pinanatili bilang teknikal na terminong Hebreo, sapagkat saklaw nito ang mga tao, damit, at bahay at hindi ito dapat limitahan sa klinikal na ketong. Gayunman, ang dalawang וְ sa Hebreo ay kapwa nag-uugnay sa “damit” at “bahay”; mas tapat ang “at ... at ...” kaysa “o.”
  naturalness: Natural at marangal ang “at tungkol sa tsaraat,” ngunit mas malinaw at mas maayos ang ugnayang pagmamay-ari/kaugnayan sa “ng damit at ng bahay” kaysa sa sunod-sunod na “sa.”
  terminology: Ang transliterasyong “tsaraat” ay angkop. Sa talababa, ang “kontaminasyon” ay mas tumpak kaysa “pinsala” para sa saklaw ng salita sa mga bagay at bahay, nang hindi nagpapahiwatig ng isang tiyak na modernong sanhi.
