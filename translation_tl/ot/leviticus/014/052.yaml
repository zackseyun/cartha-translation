base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: tl
  text: At dadalisayin niya ang bahay sa pamamagitan ng dugo ng ibon, ng tubig na buhay[a], ng buháy na ibon, ng kahoy na sedro, ng hisopo, at ng iskarlatang sinulid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sariwang tubig” o “umaagos na tubig.” Sa Hebreo, “tubig na buhay,” isang karaniwang tawag sa tubig mula sa sariwa at umaagos na bukal o batis.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iskarlatang hibla.” Ang pananalitang Hebreo ay tumutukoy sa materyal na tinina ng iskarlata at ginagamit sa ritwal ng pagdadalisay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: At dadalisayin niya
  rationale: Ang Piel ng חטא sa kontekstong ritwal ay tumutukoy sa pag-aalis ng karumihang ritwal o pagdadalisay, hindi sa pagkakasala. Pinananatili ng “At” ang payak na pang-ugnay ng Hebreo.
- source_word: הַבַּיִת
  choice: ang bahay
  rationale: Tumutukoy ito sa mismong gusaling sumasailalim sa ritwal na pagdadalisay.
- source_word: בְּדַם הַצִּפּוֹר
  choice: sa pamamagitan ng dugo ng ibon
  rationale: Ang בְּ ay nagpapahayag dito ng kasangkapan o paraang ginagamit sa ritwal.
- source_word: וּבַמַּיִם הַחַיִּים
  choice: ng tubig na buhay
  rationale: Pinananatili ang literal na idyomang Hebreo, na tumutukoy sa sariwa o umaagos na tubig; nililinaw sa talababa ang karaniwang kahulugan nito.
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: ng buháy na ibon
  rationale: Malinaw na ipinakikita ang kaibahan nito sa ibong pinatay at pinanggalingan ng dugo.
- source_word: וּבְעֵץ הָאֶרֶז
  choice: ng kahoy na sedro
  rationale: Ang עֵץ kasama ng pangalan ng punongkahoy ay tumutukoy rito sa kahoy na ginagamit sa ritwal.
- source_word: וּבָאֵזֹב
  choice: ng hisopo
  rationale: Ang “hisopo” ang kinagawiang katawagang biblikal; hindi tiyak ang eksaktong halamang tinutukoy.
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: ng iskarlatang sinulid
  rationale: Ang parirala ay tumutukoy sa materyal na tinina ng matingkad na pula, malamang na sinulid na ginagamit sa ritwal.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “dadalisayin” upang malinaw ang ritwal na paglilinis, at inulit sa likas na paraang Filipino ang ugnayang “sa pamamagitan ng … ng …” para sa talaan ng mga kasangkapan. Ang tuldik sa “buháy” ay tumutulong na maiba ang bigkas at kahulugan nito.
