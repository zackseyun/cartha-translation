  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: tl
  text: Ilulubog ng pari ang daliri ng kaniyang kanang kamay sa langis na nasa palad ng kaniyang kaliwang kamay, at sa pamamagitan ng kaniyang daliri ay iwiwisik niya ang ilan sa langis nang pitong ulit sa harap ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: ilulubog
  rationale: Tumutukoy ang pandiwa sa paglubog o pagsawsaw ng daliri sa likido; malinaw at natural dito ang “ilulubog.”
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: ang daliri ng kaniyang kanang kamay
  rationale: Bagaman literal na “kaniyang kanang daliri,” mas likas sa Filipino ang pagtukoy sa daliri ng kanang kamay, habang pinananatili ang rituwal na katiyakan.
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: sa langis na nasa palad ng kaniyang kaliwang kamay
  rationale: Sa konteksto ng טבל, likas na isinasalin ang מִן bilang pagpasok sa langis; ang כַּף ay partikular na palad, hindi lamang kamay.
- source_word: הִזָּה
  choice: iwiwisik
  rationale: Karaniwang tumutukoy ito sa rituwal na pagwiwisik ng likido.
- source_word: בְּאֶצְבָּעוֹ
  choice: sa pamamagitan ng kaniyang daliri
  rationale: Ginagamit dito ang ב bilang pananda ng kasangkapan o paraan.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwirang pinananatili ang bilang na mahalaga sa rituwal.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang pormal at pangrituwal na diwa ng pagiging nasa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalan ng Diyos, ayon sa malinaw na anyo ng tekstong Hebreo.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” para sa pormal na tekstong banal at nilinaw ang “kanang daliri” bilang “daliri ng kaniyang kanang kamay” upang maging likas sa Filipino.
