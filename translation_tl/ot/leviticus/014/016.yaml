  verdict: revise
  source_fidelity: Tumpak ang pangunahing kilos, ang kanang daliri, kaliwang palad, pitong ulit, at ang pangalang Yahweh. Gayunman, ang ikalawang paggamit ng מִן־הַשֶּׁמֶן ay partitive (“mula/ilan sa langis”); ang “iwiwisik niya ang langis” ay maaaring magpahiwatig ng buong langis sa halip na bahagi nito.
  naturalness: Malinaw at marangal ang rehistro. Mas natural at tumpak ang “ang ilan sa langis” sa ikalawang sugnay upang ipakita ang bahaging kinukuha para sa pagwiwisik.
  terminology: Ang “pari,” “palad,” “iwiwisik,” at “sa harap ni Yahweh” ay angkop sa modernong Filipino Tagalog at sa rituwal na rehistro. Ang “Yahweh” ay wastong salin ng יהוה ayon sa ibinigay na patakaran.
  issues:
  - severity: low
    issue: Hindi tahasang naipapakita ang partitive na מִן sa ikalawang “mula sa langis.”
    rationale: Ang Hebreo ay nagsasabing magwiwisik ang pari mula sa langis na nasa kaniyang palad. Ang pagdaragdag ng “ilan sa” ay nililinaw ito nang hindi nagdaragdag ng kahulugang wala sa teksto.
