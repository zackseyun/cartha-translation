  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: tl
  text: Sa ikapitong araw, babalik ang pari at titingin; kung kumalat ang salot sa mga dingding ng bahay,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: babalik
  rationale: Tuwirang ipinapahayag ang pagbabalik ng pari sa ikapitong araw.
- source_word: וְרָאָה
  choice: susuriin iyon
  rationale: Sa konteksto ng rituwal na inspeksiyon sa bahay, ang pandiwa ng pagtingin ay likas na isinasaling “susuriin”; idinagdag ang “iyon” bilang likas na layon sa Filipino.
- source_word: הַנֶּגַע
  choice: salot
  rationale: Pinananatili ang malawak na katawagang Levitico para sa mapaminsalang tanda o affliction, sa halip na tukuyin ito bilang modernong medikal na impeksiyon o amag.
- source_word: פָשָׂה
  choice: kumalat
  rationale: Tumpak na ipinahahayag ang paglawak o paglaganap ng salot.
- source_word: בְּקִירֹת הַבָּיִת
  choice: sa mga dingding ng bahay
  rationale: Natural at tuwirang katumbas ng lokatibong parirala at ng maramihang “mga dingding.”
theological_decisions:
- issue: Ang kahulugan ng וְהִנֵּה pagkatapos ng pandiwa ng pagtingin
  choice: Kung makikita niyang
  alternative: at narito, kumalat
  rationale: Sa kontekstong ito, ipinakikilala ng וְהִנֵּה ang natuklasan sa pagsusuri at nagsisilbing kondisyon para sa kasunod na tagubilin. Ang saling ito ay natural sa Filipino nang hindi nagpapahiwatig na tiyak nang kumalat ang salot.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang hulihang kuwit dahil nakasalalay ang talata sa kasunod na utos sa Levitico 14:40.
