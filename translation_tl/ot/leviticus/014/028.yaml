  source_fidelity: 'Tapat ang salin sa Hebreo: ang pari ang tagaganap; bahagi ng langis na nasa palad niya ang ginagamit; at ang langis ay inilalagay sa pingol ng kanang tainga, hinlalaki ng kanang kamay, at hinlalaki ng kanang paa ng taong dinadalisay. Wasto ring iniuugnay ng pangwakas na parirala ang mga bahaging ito sa pinaglagyan ng dugo ng handog para sa pagkakasala sa naunang hakbang ng ritwal.'
  naturalness: Malinaw, makabago, at marangal ang Filipino. Ang paghahati ng panghalip na “niya” para sa pari at “nito” para sa taong dinadalisay ay epektibong nag-aalis ng posibleng kalabuan. Ang “pingol,” “palad,” at “hinlalaki ng paa” ay likas at nauunawaan sa kontekstong anatomikal at ritwal.
  terminology: Maayos ang “taong dinadalisay” para sa participial na tumutukoy sa taong sumasailalim pa sa ritwal na paglilinis. Ang “handog para sa pagkakasala” ay isang angkop at malinaw na katumbas ng אָשָׁם, at naiiba ito nang sapat sa handog para sa kasalanan. Wasto ang footnote anchor at ang tala ay nagpapanatili ng maigsi at bahagyang eliptikong anyo ng Hebreo.
