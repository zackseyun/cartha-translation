id: LEV.14.28
reference: Leviticus 14:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: tl
  text: At maglalagay ang pari ng kaunting langis na nasa palad niya sa pingol ng kanang tainga ng taong dinadalisay, sa hinlalaki ng kanang kamay nito, at sa hinlalaki ng kanang paa nito—sa lugar kung saan inilagay ang dugo ng handog para sa pagkakasala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa lugar ng dugo ng handog para sa pagkakasala.”'
    reason: Ipinakikita ang mas malapit na anyo ng maikling pariralang Hebreo; nililinaw ng pangunahing teksto, ayon sa konteksto, na dito naunang inilagay ang dugo.
lexical_decisions:
- source_word: וְנָתַן
  choice: At maglalagay
  rationale: Ang נָתַן ay karaniwang nangangahulugang ‘magbigay/maglagay.’ Sa ritwal na kontekstong ito, natural at tumpak ang ‘maglalagay,’ at ipinagpapatuloy ng ‘At’ ang sunod-sunod na tagubilin.
- source_word: מִן הַשֶּׁמֶן
  choice: ng kaunting langis
  rationale: 'Partitibo ang מִן: bahagi lamang ng langis ang ilalagay. Likas sa modernong Tagalog ang ‘kaunting langis.’'
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: na nasa palad niya
  rationale: Ang כַּף ay tumutukoy rito sa palad o hukot ng kamay ng pari; malinaw na ipinakikita ng salin kung nasaan ang langis.
- source_word: תְּנוּךְ אֹזֶן
  choice: pingol ng ... tainga
  rationale: Sa mga ritwal na tekstong pangpari, ang תְּנוּךְ ay tumutukoy sa lambi o ibabang malambot na bahagi ng tainga. Ang ‘pingol’ ang maikli at likas na terminong Tagalog.
- source_word: הַמִּטַּהֵר
  choice: taong dinadalisay
  rationale: Ipinahihiwatig ng Hitpael participle ang taong nasa proseso ng ritwal na paglilinis. Pinananatili ng ‘dinadalisay’ ang aspektong ito at ang ritwal na diwa.
- source_word: הַיְמָנִית
  choice: kanang
  rationale: Direkta at karaniwang katumbas ito para sa kanang bahagi ng tainga, kamay, at paa.
- source_word: בֹּהֶן יָדוֹ
  choice: hinlalaki ng kanang kamay nito
  rationale: Ang בֹּהֶן kapag tumutukoy sa kamay ay ang hinlalaki. Ginamit ang ‘nito’ upang malinaw na ang tinutukoy ay ang taong dinadalisay, hindi ang pari.
- source_word: בֹּהֶן רַגְלוֹ
  choice: hinlalaki ng kanang paa nito
  rationale: Ang בֹּהֶן kapag tumutukoy sa paa ay ang malaking daliri ng paa; karaniwan at malinaw sa Tagalog ang ‘hinlalaki ng paa.’
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: sa lugar kung saan inilagay ang dugo ng handog para sa pagkakasala
  rationale: Pinananatili ang מְקוֹם bilang ‘lugar’ at ipinahahayag sa likas na Tagalog na ito rin ang bahaging nilagyan ng dugo sa naunang hakbang ng ritwal.
- source_word: אָשָׁם
  choice: handog para sa pagkakasala
  rationale: Ang אָשָׁם ay maaaring tumukoy sa pagkakasala, pananagutan, o handog na may kaugnayan sa kabayaran. Ang saling ito ay malinaw na tumutukoy sa handog at hindi ito ipinagkakapareho sa karaniwang pananalitang ‘handog para sa kasalanan’ para sa חַטָּאת.
theological_decisions:
- issue: Pagpapakahulugan sa אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog na pambayad-sala; handog para sa pananagutan
  rationale: May saklaw ang אָשָׁם na kinabibilangan ng pagkakasala at pananagutang may kalakip na kabayaran. Pinananatili ng pangunahing salin ang tahasang katawagan sa handog nang hindi iginigiit na iisang aspekto lamang ang ibig sabihin.
- issue: Kalagayan ng taong tinutukoy ng הַמִּטַּהֵר
  choice: taong dinadalisay
  alternative: taong naglilinis ng sarili; taong nadalisay na
  rationale: Hindi ginawang ganap na tapos ang proseso at hindi rin ipinahiwatig na ang tao lamang ang gumagawa ng paglilinis. Ang anyong ‘dinadalisay’ ay angkop sa ritwal na kasalukuyang isinasagawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pingol,’ ‘palad,’ at ‘hinlalaki ng paa’ bilang madaling maunawaang katawagang anatomikal. Ang mga panghalip na ‘niya’ at ‘nito’ ay sadyang pinag-iba upang maiwasang mapagkamalang sa sariling tainga, kamay, at paa ng pari inilalagay ang langis. Inilagay ang talababa sa hulihan ng pariralang aktuwal nitong ipinapaliwanag.
