base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: tl
  text: Ngunit kung siya ay dukha at hindi sapat ang kanyang kakayahan[a], kukuha siya ng isang batang lalaking tupa bilang handog para sa pagkakasala, na iwawagayway upang magbayad-sala para sa kanya, at ng ikasampung bahagi ng isang efa ng pinong harina na hinaluan ng langis bilang handog na butil, at isang log ng langis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hindi umaabot ang kanyang kamay”; ibig sabihin, kulang ang kanyang kakayahang pinansiyal.
    reason: lexical_alternative
  - marker: b
    text: Ang “log” ay isang maliit na panukat ng likido na ginagamit sa mga batas pangritwal ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: dukha
  rationale: Tumutukoy ito sa taong salat sa kabuhayan; ang “dukha” ay tuwiran, dignified, at angkop sa legal na konteksto.
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: hindi sapat ang kanyang kakayahan
  rationale: Ipinahihiwatig ng idyomang literal na “hindi umaabot ang kanyang kamay” na kulang ang kanyang kakayahang pinansiyal; pinananatili ng salin ang diwa nang hindi labis na nagpapaliwanag.
- source_word: כֶּבֶשׂ אֶחָד
  choice: isang lalaking tupa
  rationale: Ang כֶּבֶשׂ ay lalaking batang tupa; sa karaniwang Tagalog, sapat na malinaw ang “lalaking tupa” sa ritwal na konteksto.
- source_word: אָשָׁם
  choice: handog para sa pagkakasala
  rationale: Pinananatili nito ang natatanging kategorya ng handog, nang hindi ipinapasok ang isang tiyak na teorya tungkol sa layunin nito.
- source_word: לִתְנוּפָה
  choice: na iwawagayway
  rationale: Ang anyo ay naglalarawan sa ritwal na gagawin sa handog; hindi nito ginagawang hiwalay na uri ng handog ang pagwawagayway.
- source_word: לְכַפֵּר עָלָיו
  choice: upang magbayad-sala para sa kanya
  rationale: Karaniwang salin ito ng כפר sa kontekstong panghandog at pinananatili ang ritwal at teolohikal na bigat nang hindi nililimitahan ang kahulugan sa isang doktrina.
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: ikasampung bahagi ng isang efa ng pinong harina
  rationale: Ang עִשָּׂרוֹן ay ikasampung bahagi ng efa sa batas panghandog; ang pagbanggit sa efa ay nagbibigay ng kinakailangang yunit.
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Natural at tumpak nitong inilalarawan ang harina na pinaghalo sa langis.
- source_word: לְמִנְחָה
  choice: bilang handog na butil
  rationale: Sa Levitico, ang מִנְחָה ay teknikal na katawagan para sa handog na mula sa butil.
- source_word: לֹג שָׁמֶן
  choice: isang log ng langis
  rationale: Pinananatili ang tiyak na sinaunang yunit sa halip na palitan ito ng di-tiyak na modernong katumbas.
theological_decisions:
- issue: Pagsasalin ng mga terminong panghandog sa batas ng mga pari
  choice: Panatilihin ang magkakaibang katawagang “handog para sa pagkakasala,” “iwawagayway,” “magbayad-sala,” at “handog na butil.”
  alternative: Gumamit ng mas malayang paliwanag gaya ng “handog na pambayad” o “ritwal na ihaharap.”
  rationale: Magkakaiba at teknikal ang mga terminong Hebreo. Ang napiling salin ay nagpapanatili ng mga kategorya at ng teolohikal na tensiyon nang hindi nagpapataw ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “dukha” at “kakayahan” upang maging dignified at hindi kolokyal; pinanatili ang mga teknikal na yunit na “efa” at “log,” na may talababa para sa hindi pamilyar na sukat.
