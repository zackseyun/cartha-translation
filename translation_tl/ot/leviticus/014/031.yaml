  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: tl
  text: anuman ang kaya niyang tustusan[a], ang isa ay bilang handog para sa kasalanan[b] at ang isa ay bilang handog na sinusunog, kasama ng handog na butil. Sa gayon, magbabayad-sala ang pari para sa taong nililinis sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang maaabot ng kanyang kamay”; ibig sabihin, ang kaya niyang tustusan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “handog para sa paglilinis.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: anuman ang abot ng kanyang makakaya
  rationale: Ipinahahayag nito sa likas na modernong Tagalog ang Hebreong idyoma na literal na tumutukoy sa maaabot ng kamay, ngunit ang kahulugan ay kung ano ang kaya ng kanyang kabuhayan.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Karaniwan at madaling maunawaang katawagan para sa handog na kaugnay ng kasalanan at ritwal na paglilinis; pinananatili sa talababa ang posibleng saling “handog para sa paglilinis.”
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Malinaw na tumutukoy sa handog na sinusunog sa altar at natural sa Tagalog.
- source_word: עַל הַמִּנְחָה
  choice: kasama ng handog na butil
  rationale: Sa kontekstong ritwal, ang עַל ay nagpapahiwatig ng pagsama o pagdaragdag, hindi ng lokasyong “sa ibabaw.”
- source_word: וְכִפֶּר
  choice: magbabayad-sala
  rationale: Pinananatili ang kultiko at teolohikal na lakas ng כפר nang hindi itinatakda ang isang partikular na teorya tungkol sa pagbabayad-sala.
- source_word: הַמִּטַּהֵר
  choice: taong nililinis
  rationale: Ipinakikita ng participle ang taong sumasailalim sa ritwal na proseso ng paglilinis.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang ipinahahayag ang pagiging nasa harap o presensya ni Yahweh at pinananatili ang personal na pangalan.
theological_decisions:
- issue: Katawagan sa handog na חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Kapuwa sinusuportahan ng kontekstong Levitico ang kaugnayan sa kasalanan at ritwal na paglilinis. Ginamit sa teksto ang mas pamilyar na katawagan at pinanatili sa talababa ang tunay na alternatibo.
- issue: Paglalarawan sa gawaing כפר
  choice: magbabayad-sala
  alternative: magsasagawa ng ritwal na paglilinis
  rationale: Ang piniling salita ay nagpapanatili sa sakripisyal na diwa ng teksto nang hindi nililimitahan ito sa paglilinis lamang o nag-aangkat ng mas huling sistemang teolohikal.
- issue: Paglilipat ng banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang kinakatawan ng יהוה sa pinagmulang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pamilyar na mga katawagang pansakripisyo, habang iniwasan ang labis na teknikal o denominasyonal na pananalita.
