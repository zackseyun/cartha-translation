  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: tl
  text: Pagkatapos, iuutos ng pari na alisin ang mga batong may salot[a] at itapon ang mga ito sa labas ng lungsod, sa isang lugar na marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga bato na kinaroroonan ng salot.”
    reason: Pinananatili ng pangunahing teksto ang natural na Filipino, samantalang ipinapakita ng talababa ang lokatibong ayos ng Hebreo at ang hindi tiyak na likas ng kondisyon.
lexical_decisions:
- source_word: וְצִוָּה
  choice: Pagkatapos, iuutos
  rationale: Ang waw na sinusundan ng perfect ay nagpapatuloy sa sunod-sunod na tuntuning pangritwal. Likas sa modernong Tagalog ang “Pagkatapos,” at pinananatili ng “iuutos” ang puwersang tagubilin.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang salin ng כֹּהֵן sa kontekstong Levitico; tiyak ang tinutukoy dahil sa anyong may pantukoy sa Hebreo.
- source_word: וְחִלְּצוּ
  choice: na alisin
  rationale: Ipinahihiwatig ng pandiwa ang paghugot o pag-aalis. Sa mga bato ng pader, malinaw at natural ang “alisin” nang hindi labis na tinutukoy ang paraan.
- source_word: הָאֲבָנִים
  choice: ang mga bato
  rationale: Tuwiran at likas na katumbas; batong pantayo ang konteksto ngunit hindi kailangang idagdag iyon sa teksto.
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: mga batong kinaroroonan ng salot
  rationale: Pinananatili ng “kinaroroonan” ang lokatibong diwa ng בָּהֵן. Ang “salot” ay hindi nagtatakda ng isang modernong medikal o siyentipikong diagnosis at umaangkop sa malawak na gamit ng נֶגַע sa Levitico.
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: at itapon ang mga iyon
  rationale: Natural na modernong Tagalog ang “itapon”; malinaw na ang “mga iyon” ay tumutukoy sa mga bato.
- source_word: אֶל מִחוּץ לָעִיר
  choice: sa labas ng lungsod
  rationale: Ipinapahayag ang pagdadala patungo sa lugar sa labas; ang “lungsod” ay tuwirang katumbas ng עִיר sa konteksto.
- source_word: אֶל מָקוֹם טָמֵא
  choice: sa isang lugar na marumi
  rationale: Ang “marumi” ay malinaw at karaniwang salin ng terminong pangritwal na טָמֵא; hindi ito dapat unawain lamang bilang pisikal na dumi.
theological_decisions:
- issue: Paglalarawan sa נֶגַע na nasa bahay
  choice: salot
  alternative: impeksiyon; pinsala; amag
  rationale: Hindi tiyak sa Hebreo ang eksaktong modernong uri ng kondisyon. Ang “salot” ay nagpapanatili sa malawak na kategorya ng affliction/mark sa Levitico at umiiwas sa di-makatwirang pagtukoy rito bilang amag o sakit.
- issue: Terminong pangritwal na טָמֵא
  choice: marumi
  alternative: di-malinis; ritwal na marumi
  rationale: Ang “marumi” ay natural at nauunawaan sa Filipino habang pinananatili ang kategorya ng kadalisayang pangritwal. Hindi idinagdag sa pangunahing teksto ang “ritwal” dahil wala itong tahasang katumbas sa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong pambatas at pangritwal. Ginamit ang “pari,” “salot,” at “marumi” bilang madaling maunawaang mga terminong hindi nagpapasok ng tiyak na denominasyonal o modernong siyentipikong paliwanag.
