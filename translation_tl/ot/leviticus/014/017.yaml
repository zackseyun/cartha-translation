    rationale: Ang hulaping panghalip sa Hebreo ay natutukoy ng naunang konteksto bilang palad ng pari. Sa kasalukuyang Tagalog, maaaring iugnay ang “niya” sa taong nililinis, lalo na dahil siya ang tahasang binanggit na tao sa pangungusap. Dapat gawing hayag ang “palad ng pari.”
  - severity: low
    issue: Posibleng malabo ang mga panghalip sa “kanan niyang kamay/paa.”
    rationale: Maaaring pansamantalang maiugnay ang “niyang” sa pari, na siyang paksa ng pandiwa. Ang tahasang pag-uugnay ng kamay at paa sa taong nililinis ay mas malinaw at tumutugma sa Hebreo.
