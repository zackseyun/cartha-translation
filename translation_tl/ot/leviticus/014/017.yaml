  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: tl
  text: At mula sa natitirang langis na nasa palad ng pari, maglalagay siya sa pingol[a] ng kanang tainga ng taong nililinis, sa hinlalaki ng kanang kamay at sa hinlalaki ng kanang paa ng taong nililinis, sa ibabaw ng dugo ng handog para sa pagkakasala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dulo ng kanang tainga.” Ang salitang Hebreo ay tumutukoy sa panlabas na dulo o bahagi ng tainga.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa dugo ng handog para sa pagkakasala.” Ang langis ay inilalagay sa bahaging nalagyan na ng dugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: mula sa natitirang langis
  rationale: Pinananatili ng “mula sa” ang partitive na diwa ng מִן, at natural na ipinapahayag ng “natitirang” ang יֶתֶר.
- source_word: עַל כַּפּוֹ
  choice: na nasa palad niya
  rationale: Ang כַּף ay tumutukoy sa palad o malukong na bahagi ng kamay. Natural sa modernong Tagalog ang “nasa palad” at hindi nito nililinaw nang higit sa Hebreo kung kanino tumutukoy ang panghalip.
- source_word: יִתֵּן
  choice: maglalagay
  rationale: Sa ritwal na kontekstong ito, ang נתן ay may diwang maglagay o magpahid. Ang “maglalagay” ang pinakapayak at hindi nagdaragdag ng paraan ng paglalapat.
- source_word: תְּנוּךְ אֹזֶן
  choice: pingol ng ... tainga
  rationale: Ang תְּנוּךְ ay tumutukoy sa panlabas na dulo o bahagi ng tainga. Ang “pingol” ang maikli at karaniwang katawagang anatomikal sa modernong Filipino, habang kinikilala sa talababa ang posibleng “dulo.”
- source_word: הַמִּטַּהֵר
  choice: taong nililinis
  rationale: Ipinapanatili nito ang diwang ang tao ay sumasailalim pa sa ritwal na paglilinis, sa halip na sabihing malinis na siya.
- source_word: בֹּהֶן יָדוֹ ... בֹּהֶן רַגְלוֹ
  choice: hinlalaki ng kanan niyang kamay ... hinlalaki ng kanan niyang paa
  rationale: Ang בֹּהֶן ay tumutukoy sa thumb kapag kamay at sa big toe kapag paa. Natural at malinaw sa Filipino ang “hinlalaki” sa dalawang parirala dahil tahasang binabanggit ang kamay at paa.
- source_word: עַל דַּם הָאָשָׁם
  choice: sa ibabaw ng dugo ng handog para sa pagkakasala
  rationale: Ang “sa ibabaw ng dugo” ay nagpapahiwatig na inilalagay ang langis sa bahaging nalagyan na ng dugo, habang ang “handog para sa pagkakasala” ay isang malinaw at hindi labis na mapagpaliwanag na salin ng teknikal na אָשָׁם.
theological_decisions:
- issue: Pagpapakahulugan sa אָשָׁם bilang terminong panghandog
  choice: handog para sa pagkakasala
  alternative: handog na pambayad; handog para sa pananagutan
  rationale: Ang אָשָׁם ay isang tiyak na handog na kaugnay ng pagkakasala at pananagutan. Pinili ang madaling maunawaang “handog para sa pagkakasala” nang hindi nagdaragdag ng isang partikular na doktrina ng pagbabayad; gayunman, dapat panatilihin itong naiiba sa terminong gagamitin para sa חַטָּאת sa mas malawak na salin.
- issue: Ugnayan ng langis at ng dugo sa huling parirala
  choice: ilalagay ang langis sa ibabaw ng dugong nauna nang inilagay
  alternative: ilalagay lamang sa parehong bahagi o lugar na pinaglagyan ng dugo
  rationale: Karaniwang ipinahihiwatig ng עַל dito ang paglalapat sa ibabaw ng dugong naroon na, ngunit ang talababa ay nagpapanatili sa mas maluwag na posibilidad na “sa dugo” o sa parehong lugar.
translation_notes:
  register: Modernong Filipino na may payak ngunit marangal na himig. Ginamit ang “pingol,” “palad,” at “hinlalaki” bilang malinaw na katawagang pangkatawan. Iniwasan ang labis na teknikal o denominasyonal na pananalita, at pinanatili ang paulit-ulit na ayos ng ritwal sa Hebreo.
