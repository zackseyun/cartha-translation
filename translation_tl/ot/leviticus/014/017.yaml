revisions:
- from: At mula sa natitirang langis na nasa palad niya, maglalagay ang pari sa pingol[a] ng kanang tainga ng taong nililinis, sa hinlalaki ng kanan niyang kamay, at sa hinlalaki ng kanan niyang paa, sa ibabaw ng dugo ng handog para sa pagkakasala.[b]
  to: At mula sa natitirang langis na nasa palad ng pari, maglalagay siya sa pingol[a] ng kanang tainga ng taong nililinis, sa hinlalaki ng kanang kamay at sa hinlalaki ng kanang paa ng taong nililinis, sa ibabaw ng dugo ng handog para sa pagkakasala.[b]
  rationale: Ginawang hayag na ang langis ay nasa palad ng pari, alinsunod sa agarang konteksto at sa referent ng panghalip sa Hebreo. Nilinaw rin na ang kanang kamay at kanang paa ay sa taong nililinis. Walang binagong kahulugan, terminong panghandog, o antas ng katiyakan ng teksto.
