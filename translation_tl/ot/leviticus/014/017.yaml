  source_fidelity: 'Tumpak ang pangunahing nilalaman at pagkakasunod ng mga paglalapatan: mula sa natitirang langis, sa pingol ng kanang tainga, hinlalaki ng kanang kamay, at hinlalaki ng kanang paa ng taong nililinis, sa ibabaw ng dugo ng handog para sa pagkakasala. Gayunman, ang panghalip sa “palad niya” ay hindi dapat iwang malabo sa Tagalog: sa agarang konteksto ng ritwal, ang langis ay nasa palad ng pari, hindi ng taong nililinis.'
  naturalness: Natural at angkop sa modernong Filipino ang “pingol,” “palad,” at “hinlalaki.” Ang pag-uulit ng “ng taong nililinis” sa huling magkatuwang na parirala ay nag-aalis ng posibleng maling pagtukoy sa pari nang hindi nagiging mabigat ang pangungusap.
  terminology: Ang “handog para sa pagkakasala” ay katanggap-tanggap na salin ng אָשָׁם at pinananatiling teknikal ngunit nauunawaan. Ang “pingol” para sa תְּנוּךְ ay natural; pinangangalagaan ng talababa ang mas malawak na “dulo.”
