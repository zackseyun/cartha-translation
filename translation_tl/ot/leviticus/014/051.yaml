  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: tl
  text: At kukunin niya ang kahoy na sedro, ang isopo, ang sinulid na matingkad na pula[a], at ang buhay na ibon. Isasawsaw niya ang mga iyon sa dugo ng ibong kinatay at sa sariwang tubig[b], at wiwisikan niya ang bahay nang pitong ulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “matingkad na pula ng uod”; karaniwang inuunawa bilang sinulid o hiblang kinulayan ng matingkad na pula.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tubig na buhay,” ibig sabihin, sariwa o umaagos na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: At kukunin niya
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubiling panseremonya ay likas na ipinahahayag sa Filipino sa aspektong kontemplatibo; pinananatili ng “At” ang pagkakaugnay nito sa naunang hakbang.
- source_word: עֵץ הָאֶרֶז
  choice: kahoy na sedro
  rationale: Tumutukoy ang pariralang Hebreo sa kahoy mula sa sedro bilang gamit sa seremonya; malinaw at natural ito sa modernong Filipino.
- source_word: הָאֵזֹב
  choice: isopo
  rationale: Ito ang nakaugaliang pangalan sa Filipino para sa halamang אֵזוֹב, nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: sinulid na matingkad na pula
  rationale: Tumutukoy ang idyoma sa materyal na kinulayan ng matingkad na pula, karaniwang inuunawang sinulid; nililinaw sa talababa ang literal na anyo ng Hebreo.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: buhay na ibon
  rationale: Malinaw nitong itinatangi ang ibong ito sa ibong kinatay.
- source_word: וְטָבַל אֹתָם
  choice: Isasawsaw niya ang mga iyon
  rationale: Ang טבל ay “isawsaw” o “ilubog”; ang “isasawsaw” ang pinakanatural sa kontekstong ito at ipinakikitang kasama ang lahat ng naunang binanggit.
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: sa dugo ng ibong kinatay
  rationale: Ang שׁחט ay pagkatay sa kontekstong panseremonya; mas tiyak ang “kinatay” kaysa sa pangkalahatang “pinatay.”
- source_word: וּבַמַּיִם הַחַיִּים
  choice: at sa sariwang tubig
  rationale: Ang literal na “tubig na buhay” ay idyoma para sa tubig na sariwa o umaagos. Iniiwasan ng pangunahing salin ang di-likas at posibleng teolohikal na pagbasa, habang inilalahad sa talababa ang literal na anyo.
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: at wiwisikan niya ang bahay
  rationale: Ang Hiphil ng נזה ang karaniwang pandiwa para sa ritwal na pagwiwisik; natural sa Filipino ang tuwirang layong “ang bahay.”
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwiran at natural na pagpapahayag ng bilang ng pagwiwisik.
theological_decisions:
- issue: Pagpapakahulugan sa מַיִם חַיִּים sa batas panseremonya
  choice: sariwang tubig
  alternative: tubig na buhay; tubig na umaagos
  rationale: Sa kontekstong ito, ang parirala ay tumutukoy sa tubig mula sa sariwa o umaagos na pinagmumulan. Ipinahahayag ng “sariwang tubig” ang praktikal na kahulugan nang hindi ipinapasok ang mga teolohikal na kaugnayang lumitaw sa ibang konteksto; pinananatili sa talababa ang literal at mas tiyak na mga posibilidad.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong panseremonya. Ginamit ang mga karaniwang anyong “kukunin,” “isasawsaw,” at “wiwisikan” upang ihatid ang sunod-sunod na tagubilin. Hinati sa dalawang pangungusap para sa natural na pagbasa nang hindi binabago ang pagkakasunod ng mga kilos.
