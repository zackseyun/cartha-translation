base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: tl
  text: Lalabas ang pari patungo sa labas ng kampo, at susuriin ng pari ang taong iyon; at makikita niyang gumaling na ang sugat na tzaraat[a] ng taong may tzaraat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong tzaraat ay tumutukoy sa isang uri ng sakit o sugat sa balat na may kinalaman sa ritwal na karumihan. Hindi ito tiyak na katumbas ng sakit na tinatawag ngayong ketong o Hansen's disease.
    reason: Nililinaw ang saklaw ng terminong Hebreo at iniiwasan ang anakronistikong medikal na pagtutumbas.
lexical_decisions:
- source_word: וְיָצָא
  choice: Lalabas
  rationale: Sa kontekstong legal at pamamaraang ritwal, ang anyong pandiwa ay nagpapahayag ng itinakdang susunod na gawain.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katawagan sa cultic/legal na konteksto; pinanatili rin ang pag-uulit sa ikalawang sugnay.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa kampo
  rationale: Kasama ng pandiwang “lalabas,” likas sa Filipino ang “lalabas ... sa kampo” upang ipahayag ang pagpunta sa labas nito.
- source_word: וְרָאָה
  choice: susuriin niya
  rationale: Bagaman literal na “makikita,” tumutukoy rito ang ראה sa maingat na pagsusuring ginagawa ng pari.
- source_word: וְהִנֵּה
  choice: Kung makita ... na
  rationale: Pinananatili ang tungkuling evidential ng הִנֵּה bilang natuklasan sa pagsusuri, habang natural ang kondisyunal na ayos sa modernong Filipino na tekstong procedural.
- source_word: נִרְפָּא
  choice: gumaling na
  rationale: Ang Niphal ay resultative/passive; sa Filipino, natural na ipinahahayag ng “gumaling na” ang kalagayang bunga ng paggaling nang hindi kailangang gumamit ng mabigat na pasibong anyo.
- source_word: נֶגַע הַצָּרַעַת
  choice: ang sugat na tzaraat
  rationale: Ang נגע ay maaaring tumukoy sa salot, pinsala, o nakikitang sugat/marka; ang transliterasyong “tzaraat” ay umiiwas sa maling pagtutumbas nito sa modernong ketong.
- source_word: מִן הַצָּרוּעַ
  choice: ng taong may sakit
  rationale: Ipinahihiwatig ng מִן ang pag-alis ng karamdaman mula sa taong apektado; sa kabuuang sugnay, natural itong naipahahayag sa Filipino bilang paggaling ng sugat ng taong may sakit.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת / צָרוּעַ
  choice: tzaraat / taong may sakit
  alternative: ketong / ketongin
  rationale: Hindi tiyak na katumbas ng biblikal na צָרַעַת ang Hansen's disease o modernong ketong. Pinananatili ng transliterasyon ang lawak at hindi tiyak na likas ng terminong Hebreo; nililinaw ito sa talababa.
- issue: Lakas ng וְהִנֵּה sa pagsusuring legal
  choice: Kung makita ng pari na
  alternative: at narito
  rationale: Ang literal na pantawag-pansin ay gumaganap dito bilang pagpapakilala sa natuklasan ng pari. Ang kondisyunal na pahayag ay mas likas sa Filipino, ngunit hindi nito inaangking tiyak na nangyari na ang paggaling.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tzaraat” bilang teknikal na salitang Hebreo na ipinaliliwanag sa talababa; iniwasan ang “ketong” sa pangunahing teksto dahil mas makitid at maaaring mapanlinlang. Ang pangungusap ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang procedural na sugnay sa kasunod na talata.
