translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kautusan” para sa pormulang legal at ang mapaglarawang mga katawagan sa sakit upang maiwasan ang mapanlinlang na pagtutumbas sa tiyak na modernong diyagnosis.
