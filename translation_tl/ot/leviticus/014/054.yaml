  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: tl
  text: Ito ang kautusan ukol sa bawat kaso ng karamdaman sa balat at sa karamdaman sa anit o balbas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang partikular na kondisyon sa anit o balbas, ngunit hindi tiyak ang eksaktong katumbas nito sa makabagong medisina. Maaari rin itong isaling “makaliskis na pantal”; ayon sa tradisyon, “galis sa anit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Ito ang kautusan
  rationale: Ang pambungad na pormula ay nagbubuod sa itinakdang tuntuning legal. Likas at marangal sa Filipino ang “Ito ang kautusan,” at hindi nito inaalis ang diwa ng tagubilin o regulasyon.
- source_word: לְכָל נֶגַע
  choice: tungkol sa bawat kaso
  rationale: Ang לְ ay tumutukoy sa saklaw ng kautusan, at ang נֶגַע sa kontekstong ito ay isang kalagayan o kasong sinusuri, hindi kinakailangang isang epidemya o salot.
- source_word: הַצָּרַעַת
  choice: sakit sa balat na parang ketong
  rationale: Hindi tiyak na katumbas ng makabagong Hansen’s disease ang צָרַעַת. Pinananatili ng “parang ketong” ang tradisyonal na pagkakaugnay habang iniiwasang ipahayag na iyon mismo ang modernong ketong.
- source_word: וְלַנָּתֶק
  choice: at tungkol sa pantal sa anit o balbas
  rationale: Ang נֶתֶק ay isang natatanging kondisyon sa bahaging may buhok, lalo na sa anit o balbas ayon sa Levitico 13. Mas malinaw ito kaysa sa malabong “kati,” ngunit hindi nag-aangkin ng eksaktong makabagong diyagnosis.
