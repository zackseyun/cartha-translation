    issue: Di-gaanong malinaw ang balangkas na “iuutos ng pari na kumuha ... ng”.
    rationale: Bagaman mauunawaan, ang konstruksyong ito ay puwedeng magpahiwatig na ang pari o isang di-tinukoy na tao ang aktuwal na kukuha. Ang “iuutos ... na kunin ... ang” ay mas idiomatiko at mas malinaw na inilalahad ang mga bagay bilang saklaw ng utos.
  - severity: low
    issue: Singular ang “malinis” sa pariralang tumutukoy sa dalawang ibon.
    rationale: Maaaring gumana ang pang-uri sa ganitong ayos, ngunit ang “malilinis” ay mas malinaw na sumasang-ayon sa maramihang “ibon” at mas natural sa kasalukuyang Filipino.
