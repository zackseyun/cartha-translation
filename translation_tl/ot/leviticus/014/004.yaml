translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari” at mga karaniwang katawagang ritwal; pinanatili ang prosesong diwa ng “taong nililinis” at iniwasan ang labis na espesipikong pagkilala sa uri ng ibon o halaman.
