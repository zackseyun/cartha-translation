base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: tl
  text: Pagkatapos, iuutos ng pari na kunin para sa taong nililinis ang dalawang buháy at malilinis na ibon, kahoy na sedro, sinulid na iskarlata[a], at hisopo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hiblang iskarlata.” Ang pariralang Hebreo ay tumutukoy sa materyal na tinina ng iskarlata, ngunit hindi tiyak ang eksaktong anyo ng materyal.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong halamang tinutukoy ng salitang Hebreo; pinanatili rito ang tradisyonal na saling “hisopo.”
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: Pagkatapos, iuutos
  rationale: Sa sunod-sunod na tagubiling ritwal, ipinakikita ng waw at anyong pandiwa ang kasunod na hakbang; natural itong ipinahahayag sa Filipino sa pamamagitan ng “Pagkatapos, iuutos.”
- source_word: וְלָקַח
  choice: na kumuha
  rationale: Bagaman nasa ikatlong panauhang panlalaki na isahan ang anyo, idiomatiko itong kasunod ng utos ng pari. Ang “iuutos ... na kumuha” ay hindi nagpapalagay na ang pari mismo ang kukuha.
- source_word: לַמִּטַּהֵר
  choice: para sa taong nililinis
  rationale: Pinananatili nito ang diwa ng Hitpael participle na tumutukoy sa taong nasa proseso ng ritwal na paglilinis, sa halip na sabihing tapos na siyang linisin.
- source_word: שְׁתֵּי צִפֳּרִים
  choice: dalawang ... ibon
  rationale: Pangkalahatang katawagan sa ibon ang צִפּוֹר at hindi tiyak na maya, kaya iniiwasan ang labis na pagtutukoy.
- source_word: חַיּוֹת טְהֹרוֹת
  choice: buhay at malinis
  rationale: Ang “buhay” ay tumutukoy sa kalagayan ng mga ibon, at ang “malinis” ay nagpapanatili sa karaniwang katawagang Levitico para sa ritwal na kalinisan nang hindi dinaragdagan ang teksto.
- source_word: עֵץ אֶרֶז
  choice: kahoy na sedro
  rationale: Natural at malinaw na salin ito ng construct phrase na tumutukoy sa materyal na kahoy mula sa sedro.
- source_word: שְׁנִי תוֹלַעַת
  choice: sinulid na iskarlata
  rationale: Ang parirala ay tumutukoy sa materyal na tinina ng matingkad na pulang kulay; “sinulid na iskarlata” ang malinaw at makabagong salin, bagaman hindi lubos na tiyak ang eksaktong anyo ng materyal.
- source_word: אֵזֹב
  choice: hisopo
  rationale: Pinananatili ang tradisyonal na katawagang biblikal dahil hindi tiyak ang eksaktong halamang tinutukoy at magiging mapangahas ang mas tiyak na botanikong salin.
