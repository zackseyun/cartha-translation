revisions:
- from: Pagkatapos, iuutos ng pari na kumuha para sa taong nililinis ng dalawang buhay at malinis na ibon, kahoy na sedro, sinulid na iskarlata[a], at hisopo[b].
  to: Pagkatapos, iuutos ng pari na kunin para sa taong nililinis ang dalawang buháy at malilinis na ibon, kahoy na sedro, sinulid na iskarlata[a], at hisopo[b].
  rationale: Pinalitan ang “na kumuha ... ng” ng “na kunin ... ang” upang maging mas malinaw at idiomatiko ang saklaw ng utos ng pari, nang hindi ipinapasiya kung sino ang aktuwal na kukuha. Ginawang “malilinis” ang pang-uri upang malinaw na tumukoy ito sa dalawang ibon. Walang binago sa kahulugan, pagkakasunod ng mga bagay, o sa mga talababa.
