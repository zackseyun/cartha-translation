  source_fidelity: Tumpak na naihahatid ng draft ang mga handog, ang altar, ang pagkilos ng pari para sa taong tinutukoy, at ang bunga ng ritwal na kalinisan. Gayunman, ang “pagtubos” ay hindi ang pinakamalinaw na katumbas ng כִּפֶּר sa kontekstong saserdotal; mas tuwiran ang “pagtubos-sala” bilang katumbas ng ‘make atonement.’
  naturalness: Malinaw at angkop ang pangunahing pangungusap sa makabagong Filipino. Ang “Gagawa ang pari ng pagtubos” ay bahagyang di-likas at maaaring magpahiwatig ng ransom o redemption. Ang kasalukuyang alternatibo sa talababa, “malilinis siya,” ay hindi wastong paraan upang tukuyin ang isang tao sa ganitong gamit at maaaring malabo.
  terminology: Pinananatili ang “pari,” “altar,” “handog na sinusunog,” “handog na butil,” at “malinis.” Pinalitan ang “pagtubos” ng “pagtubos-sala” upang mas tumpak na katawanin ang terminong pangritwal na כפר nang hindi nagpapataw ng pagpapakahulugang denominasyonal.
  issues:
