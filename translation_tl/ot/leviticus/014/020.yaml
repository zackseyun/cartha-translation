    issue: Ang “pagtubos” para sa כִּפֶּר ay maaaring magpahiwatig ng ransom o redemption sa halip na atonement.
    rationale: Sa Levitico 14, ang pandiwa ay tumutukoy sa gawaing pangritwal ng pari upang maibalik ang tao sa katayuang malinis. Ang “pagtubos-sala” ay mas malinaw na tumutukoy sa atonement sa Filipino.
  - severity: medium
    issue: Hindi natural at posibleng malabo ang talababang “malilinis siya.”
    rationale: Para sa isang isahang taong tatanggap ng kilos, ang natural na anyo ay “lilinisin siya.” Bilang alternatibong salin, ipinapahayag nito ang interpretatibong pasibong ‘he shall be purified,’ samantalang nililinaw ng talababa na ang Hebreo ay nagsasaad ng kalagayan.
  revised_text: Ihahandog ng pari sa altar ang handog na sinusunog at ang handog na butil. Magsasagawa ang pari ng pagtubos-sala para sa kanya, at magiging malinis siya.[a]
