base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: tl
  text: Ihahandog ng pari sa altar ang handog na sinusunog at ang handog na butil. Magsasagawa ang pari ng pagtubos-sala para sa kanya, at magiging malinis siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “at lilinisin siya.” Mas literal na inilalahad ng Hebreo ang kalagayang bunga nito: “at magiging malinis siya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: ihahandog
  rationale: Ang Hiphil ng עלה sa konteksto ng paghahain ay tumutukoy sa pag-aalay sa altar, hindi lamang sa pagdadala o pag-akyat.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang malinaw at nakaugaliang katawagan sa haing עֹלָה, na sinusunog sa altar.
- source_word: הַמִּנְחָה
  choice: ang handog na butil
  rationale: Sa batas ng paghahain sa Levitico, ang מִנְחָה ay partikular na handog na mula sa butil, bagaman mas malawak ang kahulugan nito sa ibang konteksto.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ang anyong may panlaping paturol sa direksiyon ay likas na tumutukoy rito sa paghahandog o paglalagay sa ibabaw ng altar; natural itong ipinapahayag sa Filipino bilang “sa altar.”
- source_word: וְכִפֶּר עָלָיו
  choice: Gagawa … ng pagtubos para sa kanya
  rationale: Sa kontekstong saserdotal, ang כפר ay paggawa ng pagtubos, at ang עָלָיו ay nagpapahayag na ginagawa iyon para sa taong nililinis.
- source_word: וְטָהֵר
  choice: at magiging malinis siya
  rationale: Ang Qal ay nagsasaad ng kalagayang bunga ng ritwal. Pinananatili ng salin ang kategoryang ritwal na “malinis” sa halip na gawing tahasang prosesong pasibo.
theological_decisions:
- issue: Ang uri ng kalinisan sa batas ng mga pari
  choice: ritwal na kalinisan
  alternative: moral na kadalisayan
  rationale: Ang konteksto ng Levitico 14 ay ang pagpapanumbalik sa kalagayang malinis matapos ang karumihang kaugnay ng sakit sa balat. Kaya pinanatili ang payak na salitang “malinis” nang hindi nagdaragdag ng ideya ng moral na pagbabago.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na bokabularyong panritwal nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan. Inilipat ang talababa sa “magiging malinis siya,” ang pariralang aktuwal na tinutukoy nito.
