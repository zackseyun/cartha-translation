lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukuha
  rationale: Ang waw na sinusundan ng qatal ay nagpapatuloy sa sunod-sunod na tagubilin ng ritwal; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “Pagkatapos” at pandiwang nasa kontemplatibong aspekto.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas ng כֹּהֵן sa kontekstong pangkulto, at pinananatili ang tiyak na pantukoy.
- source_word: מִלֹּג הַשָּׁמֶן
  choice: ng kaunting langis mula sa isang log
  rationale: Ipinahahayag ng מִן ang pinagmulan o bahaging kinuha. Nililinaw ng “kaunting langis mula sa” na langis ang kinukuha mula sa takal, hindi ang buong takal mismo.
- source_word: לֹג
  choice: log
  rationale: Pinananatili ang transliterasyon ng tiyak na sinaunang takal ng likido sa halip na gumamit ng di-tiyak na modernong katumbas.
- source_word: וְיָצַק
  choice: at ibubuhos
  rationale: Nagpapatuloy ito sa iniutos na pagkakasunod-sunod ng ritwal; ang kontemplatibong anyo ay natural sa Tagalog na panuto.
- source_word: עַל כַּף
  choice: sa palad
  rationale: Bagaman literal na “sa ibabaw ng palad,” ang “sa palad” ay natural at sapat para sa pagbubuhos sa nakakupkop na kamay.
- source_word: כַּף
  choice: palad
  rationale: Tiyak na tumutukoy ang כַּף sa palad, hindi lamang sa kamay sa pangkalahatan.
- source_word: הַשְּׂמָאלִית
  choice: kaliwang kamay
  rationale: Inilalarawan ng pang-uri ang kaliwang palad o kamay ng pari; natural sa Tagalog ang “palad ng ... kaliwang kamay.”
- source_word: הַכֹּהֵן ... הַכֹּהֵן
  choice: ang pari ... sarili niyang
  rationale: Ang pag-uulit ng “pari” sa Hebreo ay nililinaw sa natural na Tagalog sa pamamagitan ng “sarili niyang,” kaya hindi mapagkakamalang palad ng ibang tao.
