base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: tl
  text: Wiwisikan niya nang pitong ulit ang taong nililinis mula sa sakit sa balat[a], at ipahahayag niya itong malinis[b], at pakakawalan niya ang ibong buhay sa bukás na parang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisyonal na “ketong.” Mas malawak ang tinutukoy ng salitang Hebreo sa Levitico: iba’t ibang kondisyong may kaugnayan sa balat, at hindi lamang ang sakit na tinatawag ngayong ketong o sakit na Hansen.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “idedeklara niya itong malinis.” Ang ginagawa ng pari ay isang pormal na pagpapasyang panritwal, hindi lamang isang pagsusuring medikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: Wiwisikan niya
  rationale: Ang Hiphil ng נזה sa kontekstong panritwal ay tumutukoy sa pagwiwisik. Hindi na tahasang dinagdagan ng bagay na iwiwisik sapagkat likas sa Tagalog ang ganitong gamit at malinaw ito mula sa naunang talata.
- source_word: הַמִּטַּהֵר
  choice: ang taong nililinis
  rationale: Ipinananatili ng pariralang ito ang diwa ng participle na ang tao ay dumaraan pa sa proseso ng ritwal na paglilinis, sa halip na sabihing malinis na siya.
- source_word: מִן הַצָּרַעַת
  choice: mula sa sakit sa balat
  rationale: Mas malawak ang saklaw ng צָרַעַת sa Levitico kaysa sa makabagong Hansen's disease; iniiwasan ng saling ito ang maling espesipikong pagkilalang medikal habang pinananatili ang kaugnayan nito sa balat sa kontekstong ito.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Likas at tuwirang katumbas sa modernong Tagalog.
- source_word: וְטִהֲרוֹ
  choice: ipahahayag niya itong malinis
  rationale: Ipinakikita nito ang pormal na pasyang panritwal at panghukuman ng pari, hindi lamang ang pisikal na pagpapagaling o aktuwal na paghuhugas.
- source_word: וְשִׁלַּח
  choice: pakakawalan niya
  rationale: Malinaw at natural nitong ipinahahayag ang pagpapalaya sa ibon bilang bahagi ng ritwal.
- source_word: הַצִּפֹּר הַחַיָּה
  choice: ang ibong buhay
  rationale: Tinutukoy nito ang ibong nananatiling buhay, bilang kaibahan sa ibong pinatay sa naunang bahagi ng ritwal.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: sa ibabaw ng parang
  rationale: Pinananatili nito ang larawang pangkalawakan ng עַל־פְּנֵי at ang bukás na lupain na tinutukoy ng שָׂדֶה.
theological_decisions:
- issue: Kahulugan ng צָרַעַת
  choice: sakit sa balat
  alternative: ketong
  rationale: Ang kategoryang צָרַעַת sa Levitico ay hindi tiyak na katumbas ng makabagong ketong at saklaw nito ang iba’t ibang kondisyong may nakikitang palatandaan. Kaya hindi ipinapasok sa teksto ang anakronistikong diagnosis.
- issue: Lakas ng וְטִהֲרוֹ
  choice: ipahahayag niya itong malinis
  alternative: lilinisin niya ito
  rationale: Sa kontekstong pari at ritwal, ang kilos ay may pormal na deklaratibong bisa. Hindi nito ipinapalagay na medikal na pinagaling ng pari ang tao.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “parang” para sa bukás na lupain at iniwasan ang sobrang teknikal o makalumang bokabularyo.
