  source_fidelity: 'Tumpak ang pagkakasunod ng mga kilos sa Hebreo: ang pari ay lalabas mula sa bahay, tutungo sa bungad nito, at isasara ang bahay sa loob ng pitong araw. Ang “Pagkatapos” ay angkop na pagsasalin ng sunod-sunod na puwersa ng waw sa tekstong pamamaraang legal.'
