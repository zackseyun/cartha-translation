  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: tl
  text: Pagkatapos, lalabas ang pari mula sa bahay at pupunta sa bungad nito. Isasara niya ang bahay sa loob ng pitong araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipagbabawal niya ang pagpasok sa bahay sa loob ng pitong araw.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagsasara ng daan papasok habang hinihintay ang muling pagsusuri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Pagkatapos, lalabas
  rationale: Sa ganitong sunod-sunod na legal na tagubilin, ipinahihiwatig ng waw + qatal ang kasunod na hakbang. Likas sa Filipino ang “Pagkatapos,” at pinananatili ng “lalabas” ang diwang tagubilin.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katumbas ng כֹּהֵן sa konteksto ng mga kautusang Levitico.
- source_word: מִן הַבַּיִת
  choice: mula sa bahay
  rationale: Tuwirang salin na likas kasunod ng pandiwang “lalabas.”
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: at pupunta sa bungad nito
  rationale: Ang פֶּתַח ay tumutukoy sa pasukan o bungad. Ginamit ang “nito” upang maiwasan ang alanganing pag-uulit ng “bahay” habang malinaw na iyon pa rin ang tinutukoy.
- source_word: וְהִסְגִּיר
  choice: Isasara niya
  rationale: Ang Hiphil ng סגר dito ay pagsasara o pagpigil sa pagpasok sa bahay sa itinakdang panahon. Hindi ginamit ang mas mapagpakahulugang “ikukuwarentenas.”
- source_word: אֶת הַבַּיִת
  choice: ang bahay
  rationale: Tuwirang isinalin ang tiyak na layon; hindi isinasalin ang pantukoy sa tuwirang layon na אֶת.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Likas na Filipino para sa panahong tumatagal nang pitong araw.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging madaling maunawaan, ngunit pinanatili ang pagkakasunod-sunod ng mga hakbang at ang legal na diwa. Ang “bungad” ay konkretong tumutukoy sa pasukan nang hindi nagpapalagay na may pisikal na pinto.
