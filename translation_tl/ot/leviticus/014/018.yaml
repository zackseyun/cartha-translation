  to: Ang natitirang langis na nasa palad ng pari ay ilalagay niya sa ulo ng taong nililinis, at gagawa ang pari ng pagbabayad-sala para sa kanya sa harap ni Yahweh.
  rationale: Pinalitan ang «pagtubos» ng «pagbabayad-sala» upang maipahayag nang mas tumpak ang כפר sa ritwal na konteksto. Inalis ang talababa at ang anchor nito sapagkat wala itong kinakailangang alternatibong pagbasa at hindi nito nililinaw ang salin.
