review_pass:
  verdict: revise
  source_fidelity: Tumpak ang pangunahing paglalarawan ng langis na nalalabi, ng palad ng pari, ng paglalagay sa ulo ng taong nililinis, at ng pagkilos na nagaganap sa harap ni Yahweh. Gayunman, ang «pagtubos» ay karaniwang tumutukoy sa redemption o ransom sa modernong Filipino at hindi ang pinakamalapit na katawagan para sa כפר sa kontekstong ritwal na ito.
  naturalness: Maayos at natural sa pangkalahatan ang ayos ng pangungusap. Mas malinaw at mas idiomatiko ang «gagawa ang pari ng pagbabayad-sala para sa kanya» kaysa «magsasagawa ang pari ng pagtubos para sa kanya.»
  terminology: 'Ang «Yahweh» ay wastong pangalang pantangi para sa יהוה. Ang «pagbabayad-sala» ay matatag na katumbas ng ritwal na «make atonement» at hindi kailangang magpahiwatig ng isang partikular na denominasyonal na teoriya. Ang kasalukuyang talababa ay hindi kailangan: inuulit lamang nito ang kahulugang nasa pangunahing salin at ang «ang nalalabi sa langis» ay hindi higit na malinaw na alternatibo.'
  issues:
  - severity: medium
    issue: «pagtubos» para sa וְכִפֶּר עָלָיו
    rationale: Sa karaniwang modernong Tagalog, ang pagtubos ay chiefly redemption, rescue, o ransom. Para sa priestly-ritual na כפר, mas tumpak at kinikilalang termino ang «pagbabayad-sala,» na pinananatili ang kahulugang atonement nang hindi nililimitahan ang mekanismo nito.
  - severity: low
    issue: Hindi kapaki-pakinabang ang talababa sa «natitirang langis».
    rationale: Ang alternatibong «ang nalalabi sa langis» ay hindi mas literal sa paraang nakatutulong at maaaring magmukhang mas malabo kaysa pangunahing salin. Walang tekstuwal na ambiguity rito na kailangang markahan.
  revised_text: Ang natitirang langis na nasa palad ng pari ay ilalagay niya sa ulo ng taong nililinis, at gagawa ang pari ng pagbabayad-sala para sa kanya sa harap ni Yahweh.
