  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: tl
  text: Ang natitirang langis na nasa palad ng pari ay ilalagay niya sa ulo ng taong nililinis, at gagawa ang pari ng pagbabayad-sala para sa kanya sa harap ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: Ang natitirang langis
  rationale: Ang Niphal na participle mula sa יתר/נותר ay tumutukoy sa nalabi o natira. Likas sa modernong Tagalog ang “natitirang langis” at malinaw nitong naihahayag ang partitive na diwa ng parirala.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: na nasa palad ng pari
  rationale: Ang כַּף ay tiyak na tumutukoy sa palad. Bagaman literal na “sa ibabaw ng” ang עַל, ang “nasa palad” ang natural na paglalarawan sa langis na hawak doon.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: ay ilalagay niya sa ulo
  rationale: Malawak ang saklaw ng נתן—magbigay, maglagay, o magpatong. Sa ritwal na pagkilos na ito, malinaw at natural ang “ilalagay ... sa ulo.”
- source_word: הַמִּטַּהֵר
  choice: taong nililinis
  rationale: Ang Hitpael na participle ng טהר ay tumutukoy sa taong dumaraan pa sa proseso ng paglilinis. Pinananatili ng “nililinis” ang diwang nagpapatuloy at hindi pa ganap na natatapos.
- source_word: וְכִפֶּר עָלָיו
  choice: at magsasagawa ang pari ng pagtubos para sa kanya
  rationale: Sa kontekstong makapari sa Levitico, ang כפר ay isang ritwal na pagkilos para sa kapakanan ng isang tao. Pinananatili ng “magsasagawa ... ng pagtubos” ang teolohikal na bigat nang hindi nagpapasok ng isang tiyak na paliwanag kung paano nagaganap ang pagtubos.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay “sa harap” o “sa presensya.” Isinasalin ang pangalang tipan na יְהוָה bilang “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang katangian nito bilang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng כפר sa ritwal ng paglilinis
  choice: magsasagawa ng pagtubos para sa kanya
  alternative: magbabayad-sala para sa kanya; magsasagawa ng pagpapawalang-sala para sa kanya
  rationale: Ang “pagtubos” ay nagpapanatili sa kinikilalang ritwal at teolohikal na diwa ng כפר ngunit hindi tahasang nagpapasya sa pagitan ng mga mungkahing diwa nitong pag-aalis ng karumihan, pagtatakip, o pagbabayad-sala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “pari,” “palad,” at “ulo”; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Ang ayos ng pangungusap ay ginawang natural sa Tagalog habang pinananatili ang pagkakasunod ng dalawang ritwal na kilos.
