  text: וְ/אֶת הַ/בַּ֛יִת יַקְצִ֥עַ מִ/בַּ֖יִת סָבִ֑יב וְ/שָׁפְכ֗וּ אֶת הֶֽ/עָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: tl
  text: Ipapakayod niya ang loob ng bahay sa buong palibot,[a] at ibubuhos nila sa labas ng lungsod, sa isang maruming lugar, ang alabok na kanilang kinayod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa loob ng bahay sa palibot.”
    reason: Nililinaw ang mas literal na anyo ng pariralang Hebreo, kabilang ang pang-ukol na “mula sa/sa loob ng,” na isinalin nang natural bilang “ang loob ng bahay sa buong palibot.”
lexical_decisions:
- source_word: יַקְצִעַ
  choice: ipakayod niya
  rationale: 'Ang anyong Hiphil ay causative: ipinagagawa niya ang pagkayod sa halip na sabihing siya mismo ang gagawa nito.'
- source_word: מִבַּיִת סָבִיב
  choice: ang buong loob ng bahay
  rationale: Ipinahihiwatig ng parirala ang pagkayod sa palibot ng panloob na bahagi; natural na ipinahahayag ito sa Filipino bilang buong loob ng bahay.
- source_word: וְשָׁפְכוּ
  choice: itatapon nila
  rationale: Bagaman pangunahing kahulugan ng pandiwa ang pagbuhos, sa konteksto ng pag-aalis ng kinayod na materyal, mas natural ang 'itatapon' at napapanatili ang kilos ng pagtatapon sa itinakdang lugar.
- source_word: הֶעָפָר
  choice: ang alabok
  rationale: Literal na 'alabok' ang salitang Hebreo. Hindi idinagdag ang 'palitada' sapagkat hindi iyon tahasang tinutukoy ng salita.
- source_word: אֲשֶׁר הִקְצוּ
  choice: na kanilang kinayod
  rationale: Tumutukoy ito sa materyal na natanggal sa pagkayod sa mga panloob na bahagi ng bahay.
- source_word: אֶל מִחוּץ לָעִיר
  choice: sa labas ng lungsod
  rationale: Malinaw nitong ipinapahayag ang pagdadala sa lugar na lampas sa hangganan ng lungsod.
- source_word: אֶל מָקוֹם טָמֵא
  choice: sa isang lugar na marumi
  rationale: Sa konteksto ng Levitico, ang 'marumi' ay terminong kaugnay ng rituwal na kalagayan at hindi kinakailangang moral na kasamaan.
theological_decisions:
- issue: Pagsasalin ng טָמֵא sa konteksto ng rituwal na kalinisan
  choice: marumi
  alternative: di-malinis; nadungisan
  rationale: Ang 'marumi' ay karaniwang terminong biblikal sa Filipino para sa teknikal na kategorya ng rituwal na karumihan at hindi tahasang nagdaragdag ng moral na paghatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ipakayod' upang mapanatili ang causative na diwa, at 'alabok' upang maiwasan ang pagdaragdag ng materyal na hindi tahasang binanggit sa Hebreo.
