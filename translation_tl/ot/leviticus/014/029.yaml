  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: tl
  text: At ang natitirang langis na nasa palad ng pari ay ilalagay niya sa ulo ng taong nililinis, upang magbayad-sala para sa kanya sa harap ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן הַשֶּׁמֶן
  choice: At ang natitirang langis
  rationale: Ipinahahayag ng pariralang Hebreo ang bahaging natira sa langis. Likas at malinaw sa modernong Tagalog ang “natitirang langis,” nang hindi binabago ang pagkakasunod-sunod ng ritwal.
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: na nasa palad ng pari
  rationale: Ang כַּף ay tumutukoy sa palad o hukab ng kamay. Bagaman karaniwang nangangahulugang “sa ibabaw” ang עַל, mas likas sa Tagalog ang “nasa palad” para sa langis na hawak doon.
- source_word: יִתֵּן עַל רֹאשׁ
  choice: ilalagay niya sa ulo
  rationale: Malawak ang kahulugan ng נתן, kabilang ang paglalagay. Ang “ilalagay” ay tuwiran at angkop sa ritwal na kilos na inilalarawan.
- source_word: הַמִּטַּהֵר
  choice: taong nililinis
  rationale: Ang Hitpael participle ay tumutukoy sa taong sumasailalim sa proseso ng ritwal na paglilinis; pinananatili ng “nililinis” ang aspektong nagpapatuloy, sa halip na ipahiwatig na tapos na ito.
- source_word: לְכַפֵּר עָלָיו
  choice: upang magbayad-sala para sa kanya
  rationale: Ang כפר ay mahalagang terminong pangritwal. Pinananatili ng “magbayad-sala” ang bigat nitong teolohikal, at ipinakikita ng “para sa kanya” kung sino ang pinatutungkulan ng pagbabayad-sala.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tumutukoy ang לִפְנֵי sa presensiya ng Diyos sa kontekstong pangritwal, at ang pangalang tipan na יְהוָה ay isinaling “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng לְכַפֵּר sa ritwal ng paglilinis
  choice: magbayad-sala
  alternative: maglinis / magtakip
  rationale: Pinananatili ang kinikilalang kahulugang pangkulto ng כפר nang hindi nililimitahan ang salita sa iisang paliwanag kung paano nagaganap ang pagbabayad-sala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa sa Kasulatan. Ginamit ang karaniwang ayos na “ay ilalagay niya” upang maging malinaw ang simuno sa mahabang pangungusap, at iniwasan ang labis na teknikal o makalumang bokabularyo.
