base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: tl
  text: Ngunit kung bumalik ang salot[a] at muling lumitaw sa bahay matapos alisin ang mga bato, matapos kayurin ang bahay, at matapos itong palitadahan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “impeksiyon” o “pinsala.” Ang salitang Hebreo na negaʿ ay teknikal na katawagan sa Levitico para sa isang kapansin-pansing apektadong kondisyon na maaaring makaapekto sa mga tao, kasuotan, o bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinagpapatuloy nito ang legal na tagubilin habang nagpapakilala ng naiibang posibleng pangyayari; natural sa Filipino ang “Ngunit kung.”
- source_word: יָשׁוּב הַנֶּגַע
  choice: bumalik ... ang salot
  rationale: Ang שוב ay tumutukoy sa muling paglitaw ng kondisyon, kaya malinaw at tuwiran ang “bumalik.”
- source_word: הַנֶּגַע
  choice: ang salot[a]
  rationale: Ang נגע ay teknikal na katawagan sa Levitico para sa kapansin-pansing mapaminsalang kondisyon na maaaring tumama sa tao, kasuotan, o bahay. Pinananatili ng “salot” ang lawak ng termino nang hindi ipinapalagay na karaniwang sakit lamang ito.
- source_word: וּפָרַח
  choice: at muling kumalat
  rationale: Literal itong may larawang pagsibol o pag-usbong, ngunit sa konteksto ay tumutukoy sa panibagong paglaganap ng salot. Ang “muling kumalat” ay likas at malinaw sa Filipino.
- source_word: בַּבַּיִת
  choice: sa bahay
  rationale: Ang pang-ukol ay lokatibo; ang “sa bahay” ang natural na katumbas sa Filipino.
- source_word: אַחַר חִלֵּץ אֶת־הָאֲבָנִים
  choice: matapos alisin ang mga bato
  rationale: Tinutukoy nito ang naunang iniutos na pagtanggal sa mga apektadong bato. Hindi tinutukoy ng salin kung sino ang gumawa, alinsunod sa di-tiyak na paksa ng anyong Hebreo.
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת־הַבַּיִת
  choice: matapos kayurin ang bahay
  rationale: Ang pandiwa ay tumutukoy sa pisikal na pagkayod sa mga ibabaw ng bahay; konkreto at madaling maunawaan ang “kayurin.”
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: at matapos itong palitadahan
  rationale: Ang טוח ay paglalagay ng palitada o panibagong pantakip. Nililinaw ng “ito” na bahay ang tinutukoy, habang hindi nagdaragdag ng tiyak na gumagawa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palitadahan” bilang karaniwang terminong panggusali, at pinanatili ang di-tiyak na gumagawa sa tatlong pariralang nagsisimula sa “matapos.”
