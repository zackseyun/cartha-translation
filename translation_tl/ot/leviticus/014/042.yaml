  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: tl
  text: Pagkatapos, kukuha sila ng ibang mga bato at ilalagay ang mga iyon kapalit ng mga bato.[a] Kukuha naman siya ng ibang lupang panapal[b] at papalitadahan ang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ilalim ng mga bato”; dito, ang kahulugan ay “kapalit ng mga bato” o “bilang pamalit sa mga bato.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ibang alabok/lupa.” Tumutukoy ang Hebreo sa lupang materyal na ginagamit upang muling palitadahan ang bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Pagkatapos, kukuha sila
  rationale: Ang waw na sinusundan ng pandiwang nasa anyong perfect ay bahagi ng sunod-sunod na tagubilin. Likas sa Filipino ang panghinaharap na «kukuha», at ipinahahayag ng «Pagkatapos» ang pagkakasunod-sunod.
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: ibang mga bato
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at malinaw na tumutukoy sa mga batong ipapalit.
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: at ilalagay ang mga iyon kapalit ng mga inalis na bato
  rationale: Sa kontekstong ito, ang תַּחַת ay nagpapahayag ng pagpapalit, hindi ng pisikal na paglalagay sa ilalim. Ang «ilalagay ... kapalit» ay natural sa Filipino; idinagdag ang «inalis na» upang linawin ang tinutukoy na dating mga bato ayon sa agarang konteksto.
- source_word: וְעָפָר אַחֵר
  choice: ibang palitada
  rationale: Karaniwang nangangahulugang «alabok/lupa» ang עָפָר, ngunit dito ay materyal na ginagamit sa muling pagpapahid sa bahay. Ang «palitada» ang malinaw at karaniwang katawagan sa materyal o sapin sa ganitong gawain, habang pinananatili sa talababa ang literal na saklaw.
- source_word: יִקַּח
  choice: Kukuha naman siya
  rationale: Pinananatili ang biglang pagbabago ng Hebreo mula sa maramihang simuno tungo sa panlalaking isahan, sa halip na pagtugmain ang mga ito. Tumutulong ang «naman» upang maging natural ang paglipat.
- source_word: וְטָח אֶת הַבָּיִת
  choice: at papalitadahan ang bahay
  rationale: Ang טוח ay tumutukoy sa pagpapahid o paglalagay ng palitada sa ibabaw ng bahay. Ang «papalitadahan» ay tiyak at likas na pandiwang Filipino.
