translation_notes:
  register: Modernong Filipino na malinaw at marangal, na angkop sa tekstong pambatas at panritwal. Pinanatili ang pagbabago mula «sila» tungo sa «siya» sa Hebreo. Ginamit ang karaniwang katawagang «palitada» at ipinaliwanag sa talababa ang mas literal na kahulugan.
