  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: tl
  text: Pagkatapos ay papasok ang pari at susuriin ang bahay. Kung makita niyang kumalat ang salot sa bahay, ito ay isang mapaminsalang tsaraat[a] sa bahay; marumi ang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tsaraat ay terminong Hebreo para sa isang kategorya ng salot na may kaugnayan sa karumihang ritwal. Hindi ito katumbas lamang ng modernong ketong; maaari itong iugnay sa tao, kasuotan, o, gaya rito, bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Pagkatapos, papasok
  rationale: Sa konteksto ng sunod-sunod na tuntuning legal, ang waw + qatal ay nagpapahayag ng kasunod na hakbang, hindi lamang ng nakaraang pangyayari.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katawagan sa opisyal na nagsasagawa ng ritwal; pinanatili ang pagiging tiyak ng pangngalan.
- source_word: וְרָאָה
  choice: susuriin niya ang bahay
  rationale: Bagaman literal na 'makikita,' tumutukoy ito rito sa maingat at mapagpasiyang inspeksiyon ng pari.
- source_word: וְהִנֵּה
  choice: Kung makitang
  rationale: Likas na ipinahahayag sa modernong Filipino ang kondisyong natuklasan sa pagsusuri, habang pinananatili ang evidensiyal na diwa.
- source_word: פָּשָׂה
  choice: kumalat
  rationale: Tumpak at karaniwang salita para sa paglawak ng salot o apektadong bahagi.
- source_word: הַנֶּגַע
  choice: ang salot
  rationale: Sinasaklaw ng 'salot' ang abnormal na pinsala o apektadong bahagi nang hindi ito ipinipirmi bilang modernong impeksiyong medikal.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Ang terminong Hebreo ay isang natatanging kategorya ng karumihang ritwal na maaaring tumukoy sa tao, kasuotan, o bahay. Ang transliterasyon ay umiiwas sa maling pagtukoy rito bilang ketong o amag lamang.
- source_word: מַמְאֶרֶת
  choice: mapaminsala
  rationale: Ipinahahayag ang malubha at mapanirang katangian nito nang hindi nag-aangkat ng tiyak na modernong terminong medikal.
- source_word: טָמֵא הוּא
  choice: marumi iyon
  rationale: Pinananatili ang karaniwang wikang Levitico para sa kalagayang ritwal, hindi pangkaraniwang dumi lamang.
theological_decisions:
- issue: Pagbibigay-kahulugan sa צָרַעַת kapag bahay ang apektado
  choice: Gamitin ang transliterasyong 'tsaraat' at ipaliwanag sa talababa
  alternative: '''ketong,'' ''amag,'' o ''sakit sa balat'''
  rationale: Hindi ginagarantiyahan ng Hebreo ang isang modernong diagnosis, at ang parehong salita ay ginagamit sa tao, kasuotan, at bahay. Pinananatili ng transliterasyon ang lawak at kakaibang kategorya ng teksto.
- issue: Anyo ng pandiwa sa tekstong legal
  choice: 'Isalin bilang kasunod na hakbang sa pamamaraan: ''Pagkatapos, papasok ... at susuriin'''
  alternative: Isalin bilang payak na salaysay sa nakaraan
  rationale: Bahagi ito ng mga tagubilin sa pari, kaya nararapat ipakita ang procedural na puwersa ng mga pandiwa.
- issue: Kahulugan ng טָמֵא
  choice: Gamitin ang 'marumi' bilang kalagayang ritwal
  alternative: '''di-dalisay'' o pisikal na marumi'
  rationale: Ito ang nakaugaliang payak na salin sa batas hinggil sa kadalisayan, ngunit hindi nito dapat ipahiwatig na pisikal na dumi lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na anyong procedural. Ginamit ang teknikal na transliterasyong 'tsaraat' dahil walang karaniwang salitang Filipino na tumpak na sumasaklaw sa kategoryang Hebreo; ipinaliwanag ito sa talababa. Ang 'marumi' ay ritwal na kalagayan sa konteksto.
