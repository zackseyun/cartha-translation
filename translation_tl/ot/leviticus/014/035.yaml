  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: tl
  text: Pagkatapos, ang may-ari ng bahay ay pupunta at magbibigay-alam sa pari. Sasabihin niya, “May napansin akong parang salot[a] sa bahay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “parang isang salot/karamdaman.” Iniuulat lamang ng may-ari ang isang nakikitang kondisyon; hindi pa niya ito tiyak na kinikilalang salot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: Pagkatapos, ... ay pupunta
  rationale: Sa kontekstong legal at sunod-sunod na pamamaraan, ang waw na kasunod ng pandiwang perfect ay nagpapahiwatig ng susunod na hakbang. Likas sa modernong Tagalog ang “Pagkatapos” at ang aspektong kontemplatibo na “pupunta.”
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: ang may-ari ng bahay
  rationale: Literal itong tumutukoy sa taong sa kaniya ang bahay. Ang “may-ari ng bahay” ang pinakanatural at malinaw na katumbas sa Tagalog.
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: magbibigay-alam sa pari
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o iulat. Ipinapakita ng “magbibigay-alam” ang pormal na pag-uulat sa pari nang hindi nagiging teknikal o matigas ang pananalita.
- source_word: לֵאמֹר
  choice: Sasabihin niya
  rationale: Ipinakikilala nito ang tuwirang sipi. Mas natural sa kasalukuyang Tagalog ang hiwalay na “Sasabihin niya” kaysa sa literal na participial na “na sinasabi.”
- source_word: כְּנֶגַע
  choice: parang salot
  rationale: Pinananatili ng “parang” ang paghahambing o pansamantalang pagkilala na ipinahihiwatig ng prefixed כ. Ang “salot” ay may sapat na lawak at pormalidad para sa נגע sa mga batas sa Levitico, bagaman hindi ito tumutukoy sa tiyak na makabagong sakit.
- source_word: נִרְאָה לִי
  choice: May lumitaw
  rationale: Ang Niphal ng ראה ay “lumitaw” o “nakita.” Sa unang panauhang ulat, natural na ipinahihiwatig ng “May lumitaw” na ito ang napansin ng nagsasalita, habang ang “parang” ang malinaw na nagpapanatili sa di-tiyak na pagsusuri.
- source_word: בַּבָּיִת
  choice: sa bahay
  rationale: Ang “sa bahay” ang likas at sapat na malawak na salin ng בַּבָּיִת, na tumutukoy sa bahay bilang apektadong gusali.
theological_decisions:
- issue: Kung tiyak nang salot ang kondisyon ng bahay
  choice: Inilalarawan lamang ito ng may-ari bilang “parang salot.”
  alternative: Tiyak na tawagin itong salot o impeksiyon.
  rationale: Ang כ sa כְּנֶגַע ay nagpapakita ng pagkakahawig, hindi ng pinal na pagsusuri. Ang pari pa ang susuri sa kondisyon ayon sa kasunod na pamamaraan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pari” bilang karaniwang salin ng כֹּהֵן at “salot” bilang pormal ngunit malawak na katumbas ng נגע. Hinati sa dalawang pangungusap ang pormulang pag-uulat upang maging natural sa Tagalog, nang hindi binabago ang pagkakasunod ng proseso.
