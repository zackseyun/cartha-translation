  terminology: Ang “balbas,” “mga kilay,” “lalabhan,” at “magiging malinis” ay angkop. Ang talababa ay wastong nagtatakda na ang “malinis” ay ritwal na katayuan, hindi simpleng pisikal na kalinisan.
