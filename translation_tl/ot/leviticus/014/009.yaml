revisions:
- from: At sa ikapitong araw, aahitin niya ang lahat ng buhok niya—ang buhok sa kanyang ulo, ang kanyang balbas, at ang kanyang mga kilay. Aahitin niya ang lahat ng buhok niya, lalabhan ang kanyang mga damit, at paliliguan sa tubig ang kanyang katawan; pagkatapos, magiging malinis siya.[a]
  to: At sa ikapitong araw, aahitin niya ang lahat ng buhok niya—ang buhok sa kanyang ulo, ang kanyang balbas, at ang kanyang mga kilay. Aahitin niya ang lahat ng buhok niya, lalabhan ang kanyang mga damit, at huhugasan niya ang kanyang katawan sa tubig; pagkatapos, magiging malinis siya.[a]
  rationale: Pinalitan lamang ang pandiwang tumutukoy sa paghuhugas ng katawan upang maging likas sa modernong Filipino at maipahayag nang mas tuwiran ang sariling ritwal na pagkilos na nasa Hebreo. Pinanatili ang pag-uulit, saklaw ng pag-ahit, pagkakasunod ng mga kilos, at talababa para sa ritwal na kahulugan ng “malinis.”
