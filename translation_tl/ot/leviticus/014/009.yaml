  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: tl
  text: At sa ikapitong araw, aahitin niya ang lahat ng buhok niya—ang buhok sa kanyang ulo, ang kanyang balbas, at ang kanyang mga kilay. Aahitin niya ang lahat ng buhok niya, lalabhan ang kanyang mga damit, at huhugasan niya ang kanyang katawan sa tubig; pagkatapos, magiging malinis siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “malinis” dito ay tumutukoy sa kalagayang malinis ayon sa ritwal, hindi lamang sa pisikal na kalinisan.
    reason: Nililinaw ang mahalagang kontekstuwal na kahulugan ng טהר nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: At sa ikapitong araw
  rationale: Natural na panandang temporal at pansunod sa isang ritwal na pagkakasunod-sunod; hindi kailangang tumbasan nang mekanikal ang Hebreong idyomang וְהָיָה.
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: aahitin niya ang lahat ng buhok niya
  rationale: Ipinahahayag ng Piel ng גלח ang pag-aalis ng buhok, at pinananatili ng 'lahat' ang saklaw ng Hebreo.
- source_word: רֹאשׁוֹ
  choice: ang buhok sa kanyang ulo
  rationale: Bagaman literal na 'ang kanyang ulo,' ang tinutukoy na aahitin ay ang buhok sa ulo; nililinaw ito sa natural na Tagalog.
- source_word: זְקָנוֹ
  choice: ang kanyang balbas
  rationale: Karaniwang kahulugan ng זָקָן sa kontekstong ito.
- source_word: גַּבֹּת עֵינָיו
  choice: ang kanyang mga kilay
  rationale: Natural na katumbas sa Tagalog ng Hebreong pariralang tumutukoy sa mga kilay.
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: Aahitin niya ang lahat ng buhok niya
  rationale: Pinananatili ang pag-uulit ng pinagmulan upang idiin ang ganap na pag-aalis ng buhok.
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: lalabhan ang kanyang mga damit
  rationale: Ang כּבס ay karaniwang tumutukoy sa paglalaba ng damit; malinaw at likas ang 'lalabhan' sa modernong Tagalog.
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: paliliguan sa tubig ang kanyang katawan
  rationale: Ang בשר ay literal na 'laman' ngunit tumutukoy rito sa buong katawan. Ang 'paliliguan ... ang kanyang katawan' ay likas sa Tagalog at pinananatili ang tubig bilang gamit sa paghuhugas.
- source_word: וְטָהֵר
  choice: pagkatapos, magiging malinis siya
  rationale: Ipinakikita ang resultang kalagayan matapos ang mga ritwal na gawain; ang 'malinis' ay tumutukoy sa ritwal na katayuan, hindi sa moral na kawalang-sala.
theological_decisions:
- issue: Terminolohiya ng ritwal na kalinisan
  choice: magiging malinis
  alternative: magiging dalisay; lilinisin
  rationale: Ang טהר ay tumutukoy sa kalagayang malinis ayon sa ritwal. Pinananatili ng 'magiging malinis' ang resultang estado at iniiwasang ipakahulugan ito bilang moral na kadalisayan o bilang proseso lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit sa Hebreo para sa diin, habang ginawang tahasan ang 'buhok sa kanyang ulo' upang maiwasan ang di-likas na pahayag na aahitin ang mismong ulo.
