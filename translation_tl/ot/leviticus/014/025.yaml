base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: tl
  text: Pagkatapos, kakatayin niya ang korderong handog na pambayad-sala[a]. Kukuha ang pari ng kaunting dugo ng handog na iyon at ilalagay ito sa pingol ng kanang tainga ng taong nililinis[b], sa hinlalaki ng kanan niyang kamay, at sa malaking daliri ng kanan niyang paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “handog para sa pagkakasala.” Tradisyonal na salin: “handog dahil sa paglabag.”'
    reason: lexical_alternative
  - marker: b
    text: O “dulo ng kanang tainga.” Ang salitang Hebreo ay tumutukoy sa panlabas na nakausling bahagi ng tainga.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: kakatayin
  rationale: Tiyak na pandiwa ito para sa ritwal na pagkatay ng hayop na ihahandog, hindi lamang pangkalahatang pagpatay.
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: korderong handog na panagot sa kasalanan
  rationale: Ipinahihiwatig ng pariralang Hebreo na ang kordero ang hayop na itinalaga para sa tiyak na uring ito ng handog.
- source_word: אָשָׁם
  choice: handog na panagot sa kasalanan
  rationale: Tumutukoy ito sa isang tiyak na handog sa Levitico. Pinananatili ng “panagot” ang diwa ng pagkakasala at pananagutang kaugnay nito, at naihihiwalay ito sa חַטָּאת, na karaniwang tinatawag na handog para sa kasalanan.
- source_word: מִדַּם הָאָשָׁם
  choice: kaunting dugo ng handog na iyon
  rationale: 'Partitibo ang מִן: bahagi lamang ng dugo ang kinukuha at inilalagay. Ang “handog na iyon” ay natural na tumutukoy pabalik sa handog na panagot sa kasalanan nang hindi mabigat ang pag-uulit.'
- source_word: תְּנוּךְ אֹזֶן
  choice: pingol ng ... tainga
  rationale: Ang salita ay tumutukoy sa nakausling panlabas na bahagi o dulo ng tainga; “pingol” ang tiyak at likas na katawagang Filipino.
- source_word: הַמִּטַּהֵר
  choice: taong nililinis
  rationale: Ipinapakita ng participle na ang tao ay sumasailalim pa sa ritwal na paglilinis; hindi ipinapalagay na tapos na ang proseso.
- source_word: הַיְמָנִית
  choice: kanan
  rationale: Likas at tuwirang panuring ito para sa tainga, kamay, at paa.
- source_word: בֹּהֶן יָדוֹ
  choice: hinlalaki ng kanan niyang kamay
  rationale: Kapag iniuugnay sa kamay, ang בֹּהֶן ay ang hinlalaki.
- source_word: בֹּהֶן רַגְלוֹ
  choice: hinlalaki ng kanan niyang paa
  rationale: Kapag iniuugnay sa paa, ang בֹּהֶן ay ang malaking daliri ng paa; karaniwan at malinaw sa Filipino ang “hinlalaki ng paa.”
- source_word: וְ
  choice: Pagkatapos / at
  rationale: Ang magkakasunod na waw ay nag-uugnay sa sunod-sunod na hakbang ng ritwal. Ginawang “Pagkatapos” ang una upang maging malinaw ang daloy, at “at” ang kasunod kung kailangan.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Ito ang karaniwang katawagan sa Filipino para sa opisyal na tagapangasiwa ng ritwal.
theological_decisions:
- issue: Pagsasalin sa terminong pansakripisyo na אָשָׁם
  choice: handog na panagot sa kasalanan
  alternative: handog para sa pagkakasala; handog dahil sa paglabag
  rationale: Ang אָשָׁם ay isang natatanging uri ng handog na may kaugnayan sa pagkakasala at pananagutan. Pinananatili ng salin ang tiyak na kategoryang pansakripisyo nang hindi ito ipinapantay sa ibang handog o nilalagyan ng natatanging doktrinang denominasyonal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong pamamaraang “kakatayin,” “kukuha,” at “ilalagay” upang ipakita ang sunod-sunod na tagubilin. Ang mga pananda ng talababa ay kapuwa nasa mismong tekstong tinutukoy ng mga ito.
