  text: He shall examine the infection, and if the infection is in the walls of the house as sunken areas, greenish or reddish, and their appearance is deeper than the wall,
translation:
  language: tl
  text: Susuriin niya ang apektadong bahagi; at kung ang apektadong bahagi sa mga dingding ng bahay ay may mga bahaging nakalubog[a] na maberde o mapula, at ang anyo ng mga ito ay mukhang mas mababa kaysa sa ibabaw ng dingding[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga uka” o “mga bahaging hukot.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “mas mababa kaysa sa dingding”; ibig sabihin, mukhang nakalubog mula sa ibabaw ng dingding.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Susuriin niya
  rationale: Sa kontekstong ito ng pagsusuri ng pari, ang pandiwa ay tumutukoy sa maingat na pagtingin o inspeksiyon, hindi sa simpleng pagkakita.
- source_word: הַנֶּגַע
  choice: ang apektadong bahagi
  rationale: Ang נגע dito ay abnormal na bahagi ng bahay. Mas natural at hindi labis na medikal ang “apektadong bahagi” para sa mantsa o pinsalang sinusuri sa dingding.
- source_word: וְהִנֵּה
  choice: Kung ... ay makikitang
  rationale: Sa tekstong legal at pamamaraang ito, ipinakikilala ng parirala ang kondisyong matutuklasan sa pagsusuri.
- source_word: בְּקִירֹת הַבַּיִת
  choice: sa mga dingding ng bahay
  rationale: Ang “sa” ay natural sa Filipino at maaaring tumukoy kapwa sa ibabaw at sa bahaging nasa dingding.
- source_word: שְׁקַעֲרוּרֹת
  choice: mga lubog
  rationale: Ang bihirang salita ay tumutukoy sa mga bahaging hukot, uka, o nakalubog sa kapantayan ng dingding.
- source_word: יְרַקְרַקֹּת
  choice: maberde
  rationale: Ipinahihiwatig ng anyong Hebreo ang kulay na kahawig ng berde, hindi kinakailangang matingkad na luntian.
- source_word: אֲדַמְדַּמֹּת
  choice: mapula
  rationale: Ipinahihiwatig ng anyong Hebreo ang mapulang kulay o bahid ng pula, hindi kinakailangang matingkad na pula.
- source_word: וּמַרְאֵיהֶן
  choice: ang mga iyon ay mukhang
  rationale: Likas na Filipino ito para sa nakikitang anyo ng maramihang mga lubog.
- source_word: שָׁפָל מִן הַקִּיר
  choice: mas malalim kaysa sa ibabaw ng dingding
  rationale: Literal itong “mas mababa kaysa sa dingding,” ngunit ang biswal na pamantayan ay ang paglitaw na nakalubog mula sa ibabaw nito.
