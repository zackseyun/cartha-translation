translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang pangungusap bilang di-kumpletong sugnay dahil nagpapatuloy ang pamamaraang legal sa kasunod na talata. Ginamit ang “apektadong bahagi” upang maiwasan ang maling pahiwatig na tiyak itong impeksiyong biyolohikal.
