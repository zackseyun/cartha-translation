revisions:
- from: Susuriin niya ang apektadong bahagi. Kung ang apektadong bahagi sa mga dingding ng bahay ay makikitang mga lubog[a] na maberde o mapula, at ang mga iyon ay mukhang mas malalim kaysa sa ibabaw ng dingding[b],
  to: Susuriin niya ang apektadong bahagi; at kung ang apektadong bahagi sa mga dingding ng bahay ay may mga bahaging nakalubog[a] na maberde o mapula, at ang anyo ng mga ito ay mukhang mas mababa kaysa sa ibabaw ng dingding[b],
  rationale: Pinalitan ang hindi natural na “makikitang mga lubog” ng “may mga bahaging nakalubog,” na malinaw na naghahayag ng mga depression sa dingding at maayos sa modernong Filipino. Pinanatili ang di-kumpletong sugnay at ang biswal na pamantayan ng Hebreo, kasama ang paglilinaw sa talababa tungkol sa literal na “mas mababa kaysa sa dingding.”
