  naturalness: Ang “mga lubog” bilang pangngalan ay hindi natural sa makabagong Filipino sa pangungusap na ito. Mas malinaw at natural ang “mga bahaging nakalubog.” Ang “anyo ng mga ito” ay mas tuwirang katumbas ng Hebreong “ang kanilang anyo” kaysa “ang mga iyon ay mukhang.”
  terminology: Ang “apektadong bahagi” ay maingat at katanggap-tanggap para sa נגע sa kontekstong ito, nang hindi ipinagpapalagay na isang tiyak na biyolohikal na impeksiyon ito. Ang “maberde” at “mapula” ay wastong nagpapahiwatig ng mga kulay na hindi matingkad.
