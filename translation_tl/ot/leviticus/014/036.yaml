base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: tl
  text: Pagkatapos, iuutos ng pari na alisin ang lahat ng laman ng bahay bago siya pumasok upang siyasatin ang bahaging apektado[a], upang hindi maging marumi sa ritwal ang anumang nasa bahay. Pagkatapos nito, papasok ang pari upang siyasatin ang bahay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bahid,” “impeksiyon,” o ayon sa tradisyon, “salot.” Ang Hebreong negaʿ ay tumutukoy sa apektadong bahagi o kalagayang sinusuri ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: Pagkatapos, iuutos
  rationale: Sa konteksto ng sunod-sunod na tuntuning legal, ang waw at perfect ay tumutukoy sa susunod na hakbang; natural itong ipinahahayag sa Filipino sa pamamagitan ng “Pagkatapos” at panghinaharap na “iuutos.”
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas ng כֹּהֵן sa kontekstong Levitico.
- source_word: וּפִנּוּ אֶת הַבַּיִת
  choice: na alisin ang lahat ng laman ng bahay
  rationale: Ang pandiwa ay may di-tiyak na maramihang tagaganap at nangangahulugang alisin ang mga nilalaman. Mas natural at malinaw sa Filipino ang ganitong pagbubuo kaysa sa literal na “alisan ng laman nila ang bahay.”
- source_word: בְּטֶרֶם
  choice: bago
  rationale: Direkta at natural na panandang temporal.
- source_word: לִרְאוֹת
  choice: siyasatin
  rationale: Bagaman literal na “tingnan,” tumutukoy ito rito sa opisyal na pagsusuri ng pari.
- source_word: הַנֶּגַע
  choice: bahaging apektado
  rationale: Ang נֶגַע ay maaaring tumukoy sa nakikitang apektadong lugar o kondisyon at hindi kinakailangang sa isang makabagong medikal na sakit.
- source_word: וְלֹא יִטְמָא
  choice: para hindi maging marumi
  rationale: Ipinahahayag ng sugnay ang layuning maiwasan ang ritwal na karumihan.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: ang lahat ng nasa bahay
  rationale: Tumutukoy sa kabuuan ng mga bagay o nilalaman sa loob ng bahay.
- source_word: וְאַחַר כֵּן
  choice: Pagkatapos nito
  rationale: Malinaw na naghuhudyat sa kasunod na hakbang ng pamamaraan.
- source_word: לִרְאוֹת אֶת הַבָּיִת
  choice: upang siyasatin ang bahay
  rationale: Pinananatili ang diwa ng opisyal na inspeksiyon at ang paglipat ng tuon mula sa apektadong bahagi tungo sa buong bahay.
theological_decisions:
- issue: Terminong tumutukoy sa ritwal na karumihan
  choice: maging marumi
  alternative: maging ritwal na marumi; madungisan
  rationale: Sa Levitico, ang טמא ay pangunahing tumutukoy sa kalagayang ritwal, hindi kinakailangang sa kasalanang moral. Ang “maging marumi” ay simple at tradisyonal, habang ipinapaliwanag ng konteksto ang ritwal na kahulugan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may natural na ayos ng pangungusap. Ginamit ang “bahay” at “pari” bilang pamilyar na mga terminong legal at panrelihiyon. Ang “bahaging apektado” ay umiiwas sa labis na tiyak na makabagong diyagnosis, at pinananatili sa talababa ang tunay na saklaw ng Hebreong salita.
