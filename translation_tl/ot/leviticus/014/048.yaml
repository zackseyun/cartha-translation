  terminology: Ang “pari,” “ipahahayag ... na malinis,” at “sakit” ay angkop sa modernong Filipino at sa legal-ritwal na konteksto. Ang “sakit” ay pinananatili bilang malawak na katawagan para sa נגע at hindi ipinipilit bilang modernong medikal na diagnosis.
