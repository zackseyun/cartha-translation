base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: tl
  text: Ngunit kung pumasok nga ang pari at nakita niyang hindi kumalat ang sakit sa bahay matapos malagyan ng palitada ang bahay, ipahahayag ng pari na malinis ang bahay, sapagkat gumaling na ang sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang pasubaling may pagsalungat sa naunang posibleng kalagayan sa legal na pamamaraan.
- source_word: בֹּא יָבֹא
  choice: talagang pumasok
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa pagpasok; likas na naipahahayag ito sa Tagalog sa pamamagitan ng “talagang.”
- source_word: וְרָאָה וְהִנֵּה
  choice: tiningnan niya, at nakitang
  rationale: Pinagsasama sa natural na Tagalog ang aktuwal na pagtingin at ang pantukoy sa napansing resulta, nang hindi pinalalakas ito tungo sa mas interpretatibong “sinuri.”
- source_word: לֹא פָשָׂה
  choice: hindi kumalat
  rationale: Ang pandiwa ay tumutukoy sa hindi paglawak o pagkalat ng apektadong kalagayan.
- source_word: הַנֶּגַע
  choice: ang sakit
  rationale: Sa konteksto, tumutukoy ito sa nakapipinsalang kalagayang umaapekto sa bahay. Mas malinaw ang “sakit” kaysa “salot,” habang pinananatili ang metapora ng paggaling sa hulihan ng talata.
- source_word: בַּבַּיִת
  choice: sa bahay
  rationale: Natural na katumbas ito ng lokatibong Hebreo at tumutukoy sa sakit na nasa estruktura.
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: matapos palitadahan ang bahay
  rationale: Ang טוח ay paglalagay ng palitada o pantakip sa dingding; ang pasibong anyo ay angkop dahil hindi binibigyang-diin ang gumawa.
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: ipahahayag ng pari na malinis ang bahay
  rationale: Sa kontekstong pangritwal at legal, ang pari ay nagbibigay ng hatol o deklarasyon ng kalinisan, hindi simpleng nagsasagawa ng pisikal na paglilinis.
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: sapagkat gumaling na ang sakit
  rationale: Pinananatili nito ang hayagang metapora ng Hebreo na ang sakit ng bahay ay “gumaling,” sa halip na gawing “nawala” lamang.
theological_decisions:
- issue: Deklarasyong ritwal o pisikal na paglilinis sa וְטִהַר
  choice: Ipahahayag ng pari na malinis ang bahay
  alternative: Lilinisin ng pari ang bahay
  rationale: Mas angkop sa tungkulin ng pari sa sistemang pangkalinisan ng Levitico ang paghatol o pagpapahayag na malinis. Hindi nito ipinahihiwatig na ang pari mismo ang gumagawa ng pisikal na pagkukumpuni o paglilinis.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “pari,” “palitadahan,” at “ipahahayag na malinis” bilang karaniwan at madaling maunawaang mga salita sa kontekstong legal-ritwal. Ang “talagang” ay nagpapanatili sa diin ng Hebreong infinitive absolute nang hindi nagiging mabigat ang pangungusap.
