reference: Leviticus 14:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: tl
  text: at dalawang ibong batu-bato o dalawang inakay na kalapati, ayon sa kanyang makakaya. Ang isa ay magiging handog para sa kasalanan[a], at ang isa naman ay handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang salitang Hebreo ay maaari ring tumukoy sa handog na ginagamit sa ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: at dalawang ibong batu-bato
  rationale: Ipinagpapatuloy ng pangatnig ang talaan ng mga handog sa naunang talata. Ang “ibong batu-bato” ay tiyak at karaniwang katawagan sa Tagalog para sa turtledove.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: o dalawang inakay na kalapati
  rationale: Ang idyomang Hebreo ay tumutukoy sa mga batang kalapati; pinananatili ng “inakay” ang pahiwatig tungkol sa gulang.
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: ayon sa kanyang makakaya
  rationale: Ang literal na larawang “abot ng kanyang kamay” ay idyoma para sa kakayahang pinansiyal. Likas sa modernong Tagalog ang saling ito at hindi nito nililimitahan ang diwa sa pisikal na pagkuha.
- source_word: וְהָיָה אֶחָד
  choice: Ang isa ay magiging
  rationale: Nililinaw nito ang pamamahagi ng dalawang ibon sa magkaibang uri ng handog.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Ito ang pamilyar na katawagang panritwal, habang pinananatili sa talababa ang posibleng diin sa paglilinis.
- source_word: וְהָאֶחָד עֹלָה
  choice: at ang isa naman ay handog na sinusunog
  rationale: Ipinahihiwatig ng “isa naman” ang malinaw na paghahambing sa unang ibon. Ang “handog na sinusunog” ay likas at kinikilalang katawagan sa Tagalog para sa עֹלָה.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng ritwal sa Levitico
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tukuyin ng salita kapwa ang kasalanan at ang handog na ginagamit sa ritwal na paglilinis. Ginamit sa pangunahing teksto ang pamilyar na katawagan ngunit inilagay sa talababa ang lehitimong alternatibo upang hindi mawala ang ritwal na pahiwatig.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ibong batu-bato” upang maiwasan ang pagkalito sa karaniwang kahulugan ng “batu-bato,” at ang “ayon sa kanyang makakaya” bilang natural na salin ng Hebreong idyoma tungkol sa kakayahang pinansiyal.
