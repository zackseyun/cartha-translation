  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: tl
  text: Ang sinumang pumasok sa bahay habang nakabukod ito[a] ay magiging marumi hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang nakasara ito” o “habang ipinailalim ito sa restriksiyon.” Ang Hebreo ay tumutukoy sa bahay na ibinukod sa ilalim ng utos ng pari upang siyasatin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: Ang sinumang pumasok
  rationale: Ang may pantukoy na participle ay ginagamit bilang pangngalan at tumutukoy sa sinumang taong papasok; natural sa makabagong Filipino ang pangkalahatang legal na pahayag na ito.
- source_word: אֶל הַ/בַּיִת
  choice: sa bahay
  rationale: Sa konstruksiyong בוא na may אֶל, ipinahihiwatig ang pagpasok sa loob; sapat at natural sa Filipino ang “pumasok sa bahay.”
- source_word: כָּל יְמֵי
  choice: sa buong panahong
  rationale: Saklaw nito ang kabuuang tagal ng ipinataw na pagbubukod, nang hindi nangangailangang literal na ulitin ang “lahat ng araw.”
- source_word: הִסְגִּיר אֹתוֹ
  choice: ibinukod iyon
  rationale: Sa konteksto ng Levitico 13–14, ang סגר ay tumutukoy sa paglalagay ng bahay sa ilalim ng paghihiwalay o restriksiyon para sa pagsusuri. Iniiwasan ng “ibinukod” ang labis na modernong-medikal na dating ng “ikinuwarentenas.”
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinapahayag ng pandiwa ang pagpasok sa kalagayang ritwal na marumi; malinaw ang resultang kalagayan sa “magiging marumi.”
- source_word: עַד הָ/עָרֶב
  choice: hanggang sa gabi
  rationale: Ito ang likas na Filipino para sa karaniwang takdang panahon ng pansamantalang ritwal na karumihan.
theological_decisions:
- issue: Kalikasan ng karumihan
  choice: marumi
  alternative: ritwal na marumi
  rationale: Pinananatili ng pangunahing teksto ang payak at paulit-ulit na bokabularyo ng Levitico. Ipinakikita ng konteksto na ritwal ang legal na kalagayan, kaya hindi kailangang idagdag ang paliwanag sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyon” upang ang bahay, hindi isang tao, ang malinaw na tinutukoy. Ang “sa buong panahong” ay natural na paglilipat ng Hebreong idyoma habang pinananatili ang buong temporal na saklaw.
