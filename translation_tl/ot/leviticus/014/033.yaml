lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang waw-consecutive imperfect ng דבר ay nagpapakilala ng bagong pangyayari ng pagsasalita; natural at marangal itong salin sa pormulang pasalaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang “kina” ay natural na modernong Tagalog para sa patungong pananalita na may dalawang taong pinatutungkulan, habang malinaw na kapwa sila kausap.
- source_word: לֵאמֹר
  choice: na sinabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa tuwirang pahayag, nang hindi gumagamit ng di-likas na “na nagsasabi.”
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na ipalit ang tradisyonal na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang natural na “kina” para sa dalawang pinatutungkulan; pinanatili ang pormulang panimulang “na sinabi” dahil susundan ito ng tuwirang pahayag.
