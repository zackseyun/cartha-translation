  source_fidelity: 'Tumpak ang pangunahing diwa: si Yahweh ang nagsalita, at sina Moises at Aaron ay kapwa pinatutungkulan. Gayunman, ang “na sinabi” ay hindi likas na pangdugtong sa Tagalog sa pormulang ito at maaaring magmukhang kamag-anak na sugnay sa halip na pambungad sa kasunod na tuwirang pananalita.'
  naturalness: Ang “kina Moises at Aaron” ay natural at malinaw. Mas maayos ang “at sinabi:” kaysa “na sinabi,” sapagkat malinaw nitong ipinakikilala ang susunod na pahayag at napapanatili ang dalawang bahagi ng Hebreong pormula.
  terminology: Ang “Yahweh,” “Moises,” at “Aaron” ay angkop at pare-pareho sa hinihinging pag-render ng banal na pangalan. Dapat ikabit ang talababa sa “Yahweh,” na siyang terminong tinutukoy nito, hindi sa “Aaron.”
