  - severity: low
    issue: Maling kinalalagyan ng talababa
    rationale: Ang talababa tungkol sa Hebreong YHWH ay kasalukuyang nakaangkla sa “Aaron.” Dapat itong ilagay kaagad pagkatapos ng “Yahweh.”
