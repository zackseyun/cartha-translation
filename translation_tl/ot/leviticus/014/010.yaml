id: LEV.14.10
reference: Leviticus 14:10
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: tl
  text: Sa ikawalong araw, kukuha siya ng dalawang lalaking korderong walang kapintasan, isang babaeng korderong isang taóng gulang at walang kapintasan, tatlong ikasampu ng isang efa ng pinong harina bilang handog na butil na hinaluan ng langis, at isang log[a] ng langis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “log” ay isang maliit na panukat ng likido na ginagamit sa mga ritwal ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Sa ikawalong araw
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong ipinagpapatuloy ang takbo ng mga tagubilin.
- source_word: יִקַּח
  choice: kukuha siya
  rationale: Ang anyong panghinaharap sa kontekstong legal ay naghahatid ng itinakdang gagawin nang hindi gumagamit ng labis na teknikal na pananalita.
- source_word: שְׁנֵי כְבָשִׂים
  choice: dalawang lalaking kordero
  rationale: Ginawang tahas ang kasarian dahil sadyang inihahambing ng Hebreo ang dalawang lalaking hayop sa kasunod na babaeng kordero.
- source_word: תְּמִימִים / תְּמִימָה
  choice: walang kapintasan
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa hayop na walang depekto; malinaw at nakaugaliang salin ang 'walang kapintasan.'
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: isang babaeng korderong isang taóng gulang
  rationale: Pinananatili ang kasarian at edad na hinihingi sa tekstong Hebreo sa natural na ayos ng Tagalog.
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: tatlong ikasampu ng isang efa
  rationale: Ang עֶשְׂרוֹן ay ikasampung bahagi ng karaniwang sukat na efa; pinananatili ang sinaunang yunit at eksaktong proporsiyon.
- source_word: סֹלֶת מִנְחָה
  choice: pinong harina bilang handog na butil
  rationale: Ang סֹלֶת ay pinong harina, at sa kontekstong Levitico ang מִנְחָה ay handog na mula sa butil.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Tuwirang inilalarawan na ang pinong harina ay inihalo sa langis.
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: isang log ng langis
  rationale: Ang 'log' ay tiyak na sinaunang sukat ng likido na walang eksaktong karaniwang katumbas sa Tagalog, kaya pinanatili ang pangalan at ipinaliwanag sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Pinanatili ang mga teknikal na yunit na “efa” at “log,” at inilagay ang talababa sa “log,” ang terminong aktuwal nitong ipinapaliwanag.
