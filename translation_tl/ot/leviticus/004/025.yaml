  naturalness: Medyo mabigat at hindi likas ang ayos na “kukuha ang pari sa pamamagitan ng kanyang daliri ng kaunting dugo.” Mas malinaw sa makabagong Filipino na ilagay agad ang layon ng 'kukuha' at gamitin ang 'gamit ang kanyang daliri.' Ang “altar para sa handog na sinusunog” ay mas malinaw kaysa “altar ng handog na sinusunog,” na maaaring pansamantalang basahing altar na siya mismong sinusunog.
  terminology: Ang “handog para sa kasalanan,” “pari,” “sungay,” at “altar” ay angkop at pare-pareho ang rehistro. Pinananatili ng talababa ang makatuwirang alternatibong “handog para sa paglilinis” nang hindi ipinipilit ang isang makitid na pagbasa.
