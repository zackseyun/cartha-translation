base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: tl
  text: Pagkatapos, kukuha ang pari ng kaunting dugo ng handog para sa kasalanan[a] gamit ang kanyang daliri at ipapahid niya ito sa mga sungay ng altar para sa handog na sinusunog. Ibubuhos naman niya ang natitirang dugo nito sa paanan ng altar para sa handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang terminong Hebreo ay maaaring tumukoy sa handog na kaugnay kapwa ng pag-aalis ng karumihan at ng kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukuha
  rationale: Ipinagpapatuloy ng anyong pandiwa ang sunod-sunod na tagubilin sa ritwal; natural sa Filipino ang “Pagkatapos” upang ipakita ang kasunod na hakbang.
- source_word: מִדַּם
  choice: ng kaunting dugo
  rationale: 'Partitibo ang מִן: bahagi lamang ng dugo ang kinukuha at ipinapahid, hindi ang lahat.'
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong ito, tumutukoy ang salita sa hain o handog na kaugnay ng kasalanan, hindi sa abstraktong konsepto lamang. Malinaw at pamilyar sa karaniwang mambabasa ang saling ito.
- source_word: בְּאֶצְבָּעוֹ
  choice: sa pamamagitan ng kanyang daliri
  rationale: 'Instrumental ang בְּ: ginagamit ng pari ang kanyang daliri sa pagkuha at paglalagay ng dugo.'
- source_word: וְנָתַן עַל
  choice: at ipapahid iyon sa
  rationale: Sa ritwal na ito, likas sa Filipino ang “ipapahid” para sa paglalagay ng dugo sa mga sungay, bagaman literal na mas pangkalahatan ang Hebreong “ilalagay.”
- source_word: קַרְנוֹת
  choice: mga sungay
  rationale: Tumutukoy ito sa mga nakausling bahaging hugis-sungay sa altar; pinananatili ang karaniwang katawagang biblikal.
- source_word: מִזְבַּח הָעֹלָה
  choice: altar ng handog na sinusunog
  rationale: Malinaw nitong tinutukoy ang altar na ginagamit para sa עֹלָה, ang handog na ganap na sinusunog.
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: Ibubuhos naman niya ang natitirang dugo nito
  rationale: Dahil may kaunting dugo nang kinuha, ang natitirang dugo ang ibinubuhos. Ginagawang hayag ng “natitirang” ang implikasyon ng naunang partitibong parirala.
- source_word: אֶל יְסוֹד
  choice: sa paanan
  rationale: Ang יְסוֹד ay tumutukoy sa pundasyon o ibabang bahagi ng altar; natural at konkreto sa Filipino ang “sa paanan.”
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang terminong Hebreo sa handog na may kaugnayan sa kasalanan at sa ritwal na paglilinis. Pinili ang mas nakagawiang “handog para sa kasalanan” nang hindi nililimitahan ang bisa ng ritwal; inilalagay sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari,” “altar,” at “handog na sinusunog” bilang mga katawagang madaling maunawaan at karaniwan sa wikang biblikal. Pinanatili ang ritwal na detalye at ang lehitimong lawak ng kahulugan ng חַטָּאת.
