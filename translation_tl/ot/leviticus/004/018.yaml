  to: Maglalagay siya ng kaunting dugo[a] sa mga sungay ng altar na nasa harap ni Yahweh, na nasa loob ng tolda ng pakikipagtagpo. Ibubuhos naman niya ang lahat ng dugo sa saligan ng altar ng handog na sinusunog nang buo, na nasa pasukan ng tolda ng pakikipagtagpo.
