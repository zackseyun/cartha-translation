reference: Leviticus 4:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מִן הַ/דָּ֞ם יִתֵּ֣ן עַל קַרְנֹ֣ת הַ/מִּזְבֵּ֗חַ אֲשֶׁר֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל הַ/דָּ֗ם יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: tl
  text: Maglalagay siya ng kaunting dugo[a] sa mga sungay ng altar na nasa harap ni Yahweh, na nasa loob ng tolda ng pakikipagtagpo. Ibubuhos naman niya ang lahat ng dugo sa saligan ng altar ng handog na sinusunog nang buo, na nasa pasukan ng tolda ng pakikipagtagpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa dugo ay maglalagay siya.” Ginagawang tahas ng “kaunting dugo” ang diwang bahagi lamang ng dugo ang inilalagay, na kaiba sa “lahat ng dugo” sa kasunod na pangungusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: ng kaunti sa dugo
  rationale: Ipinahahayag sa natural na Tagalog ang partitive na diwa ng Hebreo. Ang “kaunti” ay ipinahiwatig ng paghahambing sa “lahat ng dugo” sa kasunod na sugnay.
- source_word: יִתֵּן
  choice: maglalagay siya
  rationale: Ang נתן ay karaniwang nangangahulugang “magbigay” o “maglagay”; sa ritwal na kontekstong ito, tuwiran at malinaw ang “maglalagay.”
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: mga sungay ng altar
  rationale: Pinananatili ang literal at nakaugaliang katawagang “mga sungay” para sa mga nakausling bahagi ng altar.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: na nasa harap ni Yahweh
  rationale: Pinananatili ang pangunahing spatial na diwa ng לִפְנֵי at ang personal na pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  rationale: Inilalarawan nito ang toldang itinakda bilang lugar ng pakikipagtagpo, nang hindi ipinapasok ang ideyang “tipan,” na wala sa mismong parirala.
- source_word: וְאֵת כָּל הַדָּם
  choice: ang lahat ng dugo
  rationale: Pinananatili ang tahasang “lahat ng dugo” ng Hebreo sa halip na gawing “natitirang dugo.”
- source_word: יִשְׁפֹּךְ
  choice: ibubuhos niya
  rationale: Natural at eksaktong katumbas ito ng pandiwang שׁפך sa konteksto ng ritwal.
- source_word: אֶל יְסוֹד
  choice: sa paanan
  rationale: Ang “paanan” ay natural na katawagan sa ibabang saligan o base ng altar sa Tagalog.
- source_word: מִזְבַּח הָעֹלָה
  choice: altar ng handog na sinusunog nang buo
  rationale: Nililinaw na ang עֹלָה ay handog na lubusang sinusunog, hindi lamang anumang handog na sinusunog.
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: na nasa pasukan ng tolda ng pakikipagtagpo
  rationale: Ang “pasukan” ay natural na katumbas ng פֶּתַח at malinaw na naghahayag ng lokasyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  alternative: tolda ng pagpupulong; Tolda ng Tipanan
  rationale: Ang מוֹעֵד dito ay tumutukoy sa itinakdang pakikipagtagpo. Iniiwasan ng saling ito ang pagpasok ng “tipan,” na hindi leksikal na nakasaad sa parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang mga teknikal na larawang panritwal tulad ng “mga sungay ng altar,” habang ipinaliwanag nang likas ang handog na sinusunog nang buo at ang tolda bilang lugar ng pakikipagtagpo.
