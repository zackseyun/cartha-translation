base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: tl
  text: Ilalabas niya ang buong toro sa labas ng kampo, sa isang malinis na lugar[a], sa tapunan ng abo[b]. Doon ay susunugin niya iyon sa ibabaw ng mga panggatong, sa apoy; sa tapunan ng abo iyon susunugin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lugar na malinis ayon sa rituwal.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lugar na pinagbubuhusan ng abo”; samakatuwid, isang itinakdang lugar para sa pagtatapon ng abo mula sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ilalabas niya
  rationale: Ang Hiphil ng יצא ay nagpapahiwatig ng pagpapalabas o pagdadala palabas. Likas sa Tagalog ang “ilalabas niya” at malinaw nitong pinananatili ang direksiyon ng kilos.
- source_word: כָּל הַפָּר
  choice: ang buong toro
  rationale: Binibigyang-diin ng כָּל kasama ng tiyak na pangngalan ang kabuuan ng toro; tuwiran at natural ang “ang buong toro.”
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Tumutukoy ito sa lugar na lampas sa hangganan ng kampo. Karaniwan at malinaw sa modernong Tagalog ang pariralang ito.
- source_word: מָקוֹם טָהוֹר
  choice: isang malinis na lugar
  rationale: Ang טָהוֹר ay maaaring tumukoy sa rituwal na kalinisan sa konteksto ng Levitico. Pinananatiling payak ang pangunahing teksto, habang nililinaw sa talababa ang rituwal na diwa.
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: tapunan ng abo
  rationale: Ang שֶׁפֶךְ ay lugar ng pagbubuhos o pagtatapon, at ang הַדֶּשֶׁן dito ay tumutukoy sa abo ng altar. Ipinahihiwatig ng “tapunan ng abo” ang itinakdang lugar, hindi lamang isang bunton.
- source_word: וְשָׂרַף אֹתוֹ
  choice: susunugin niya iyon
  rationale: Karaniwang kahulugan ng שׂרף ang “sunugin.” Ang anyong panghinaharap sa Tagalog ay angkop sa panuto ng kautusan.
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: sa apoy sa ibabaw ng mga kahoy
  rationale: Pinananatili nito kapwa ang apoy at ang kahoy na binabanggit nang hiwalay sa Hebreo, nang hindi pinapantay o inaalis ang alinman.
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: sa tapunan ng abo iyon susunugin
  rationale: Pinananatili ang pag-uulit at diin ng Hebreong legal na pananalita tungkol sa itinakdang lugar ng pagsunog.
theological_decisions:
- issue: Rituwal na diwa ng טָהוֹר
  choice: isang malinis na lugar
  alternative: isang lugar na malinis ayon sa rituwal
  rationale: Malamang na rituwal na kalinisan ang tinutukoy dahil sa konteksto ng paghahandog, ngunit hindi kailangang idagdag sa pangunahing teksto ang salitang “rituwal.” Inilalagay ang paglilinaw sa talababa upang mapanatili ang likas na kaiklian at tunay na saklaw ng salita.
- issue: Kalikasan ng שֶׁפֶךְ הַדֶּשֶׁן
  choice: tapunan ng abo
  alternative: lugar na pinagbubuhusan ng abo
  rationale: Ipinakikita ng parirala ang isang itinakdang lugar para sa abo ng altar. Ang “tapunan ng abo” ay maikli, malinaw, at hindi nagpapahiwatig na isa lamang itong di-tiyak na bunton.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang paulit-ulit na pagbanggit sa tapunan ng abo dahil nagbibigay ito ng legal at rituwal na diin sa orihinal. Ginamit ang “toro” sa halip na mas teknikal o di-pamilyar na katawagan, at iniwasan ang pagdaragdag ng paliwanag na pangdoktrina sa pangunahing teksto.
