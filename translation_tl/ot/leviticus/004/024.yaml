  to: Ipapatong niya ang kanyang kamay sa ulo ng kambing na lalaki at kakatayin niya ito sa lugar na pinagkakatayan ng handog na sinusunog sa harap ni Yahweh. Iyon ay handog para sa kasalanan.[a]
