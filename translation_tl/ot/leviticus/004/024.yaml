base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: tl
  text: Ipapatong niya ang kanyang kamay sa ulo ng kambing na lalaki at kakatayin niya ito sa lugar na pinagkakatayan ng handog na sinusunog sa harap ni Yahweh. Iyon ay handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa kasalanan at sa handog na may kaugnayan sa pag-aalis ng kasalanan o karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: Ipapatong niya ang kanyang kamay
  rationale: Ang pariralang ito ay tumutukoy sa rituwal na pagpapatong ng isang kamay sa hayop. Pinananatili ang isahang “kamay” ng Hebreo at natural ang “ipapatong” sa makabagong Tagalog.
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: sa ulo ng lalaking kambing
  rationale: Ang שָׂעִיר sa kontekstong ito ay lalaking kambing na inihahandog; nililinaw ng salin ang kasarian na taglay ng katawagang Hebreo.
- source_word: וְשָׁחַט אֹתוֹ
  choice: at kakatayin iyon
  rationale: Ang “kakatayin” ay ang natural na terminong Tagalog para sa pagpatay ng hayop at angkop sa konteksto ng paghahandog.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: sa lugar na pinagkakatayan
  rationale: Ipinahihiwatig nito ang itinakdang lugar at pinananatili ang pangkalahatang gumagawa ng kilos nang hindi nagdaragdag ng tiyak na paksa.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Ito ang malinaw at nakasanayang paglalarawan sa handog na lubusang sinusunog, sa halip na gamitin ang mas etimolohikal ngunit di-gaanong malinaw na “handog na umaakyat.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang tuwirang banal na pangalan at natural na isinasalin ang לִפְנֵי bilang “sa harap ni.”
- source_word: חַטָּאת הוּא
  choice: Iyon ay handog para sa kasalanan
  rationale: Dito, kinikilala ng panaguri ang hayop o ritwal bilang isang uri ng handog. Ang “handog para sa kasalanan” ay malinaw, habang inilalahad sa talababa ang posibleng diwang paglilinis.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Nasa tekstong Hebreo ang personal na pangalang tipan na יְהוָה; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kultikong kahulugan ng חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang חַטָּאת sa kasalanan o sa handog na may kaugnayan sa pag-aalis ng kasalanan at karumihan. Ginagamit sa pangunahing teksto ang malinaw at tradisyonal na diwa, ngunit pinananatili sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang bokabularyo ng paghahandog nang hindi ginagawang labis na teknikal ang pangungusap; pinanatili rin ang isahang “kamay” at ang aktibong diwa ng pagkakatay.
