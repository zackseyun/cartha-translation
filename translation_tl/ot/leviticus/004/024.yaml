  verdict: revise
  source_fidelity: Kailangang gawing hayag ang aktibong pandiwang may iisang gumaganap sa “at kakatayin niya ito.” Ang “at kakatayin iyon” ay karaniwang nababasa bilang anyong balintiyak sa Tagalog, samantalang aktibo ang Hebreong וְשָׁחַט at ang pinuno ang patuloy na paksa.
  naturalness: Natural at angkop sa makabagong Tagalog ang karamihan ng salin. Mas malinaw at mas daloy ang “kambing na lalaki” kaysa “lalaking kambing,” at ang “kakatayin niya ito” ay idiomatiko at tuwirang pamamaraan.
  terminology: Wasto ang “Yahweh,” “handog na sinusunog,” at “handog para sa kasalanan.” Pinananatili ng talababa ang makatwirang alternatibong “handog para sa paglilinis” para sa חַטָּאת.
