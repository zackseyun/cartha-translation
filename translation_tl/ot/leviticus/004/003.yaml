revisions:
- from: Kung magkasala ang pinahirang pari[a], na nagdudulot ng pagkakasala sa bayan,[b] ihahandog niya kay Yahweh, dahil sa kasalanang nagawa niya, ang isang toro mula sa bakahan na walang kapintasan bilang handog para sa kasalanan.
  to: Kung magkasala ang pinahirang pari[a], na nagdadala ng pananagutan sa bayan,[b] ihahandog niya kay Yahweh, dahil sa kasalanang nagawa niya, ang isang toro mula sa kawan ng mga baka na walang kapintasan bilang handog para sa kasalanan.
  rationale: Binago ang paglalarawan sa epekto sa bayan upang maiwasan ang kahulugang ang pari ay sanhi ng aktuwal na pagkakasala ng bayan, habang pinananatili ang siksik at bahagyang bukás na kahulugan ng Hebreo. Pinalitan din ang “bakahan” ng “kawan ng mga baka” para sa mas likas at tumpak na Filipino.
