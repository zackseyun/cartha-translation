base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: tl
  text: Kung magkasala ang pinahirang pari[a], na nagdadala ng pananagutan sa bayan,[b] ihahandog niya kay Yahweh, dahil sa kasalanang nagawa niya, ang isang toro mula sa kawan ng mga baka na walang kapintasan bilang handog para sa kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ang pinahirang punong pari.” Literal sa Hebreo: “ang pinahirang pari.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring isalin: “sa pananagutan ng bayan.” Maikli at siksik ang pariralang Hebreo at maaaring idiin na ang kasalanan ng pari ay may bungang pananagutan para sa bayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: ang pinahirang pari
  rationale: Tuwirang sinasalamin nito ang Hebreong “ang pari, ang pinahiran,” nang hindi idinaragdag ang interpretatibong titulong “punong pari.”
- source_word: יֶחֱטָא
  choice: magkasala
  rationale: Ang kondisyunal na anyo pagkatapos ng אִם ay likas na isinasalin sa Filipino bilang “kung magkasala.”
- source_word: לְאַשְׁמַת הָעָם
  choice: na nagdudulot ng pagkakasala sa bayan
  rationale: Ipinahahayag nito ang bunga ng kasalanan ng pari sa buong bayan habang pinananatili ang pagiging siksik at bahagyang malabo ng pariralang Hebreo.
- source_word: וְהִקְרִיב
  choice: ihahandog niya
  rationale: Sa kontekstong panghandog, tumutukoy ang pandiwa sa pagdadala o paghaharap ng hayop bilang handog; “ihahandog” ang pinakanatural na ritwal na pananalita sa Filipino.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dahil sa kasalanang nagawa niya
  rationale: Malinaw nitong tinutukoy ang kasalanang dahilan ng handog nang hindi inuulit nang alanganin ang magkaugnay na salitang Hebreo.
- source_word: פַּר בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Pinananatili nito ang pagkakakilanlan ng hayop bilang toro mula sa kawan ng baka, nang hindi sapilitang ipinapalagay na batang toro.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Karaniwan at tumpak itong pananalita sa Filipino para sa ritwal na kahingian na walang pisikal na depekto ang hayop.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang personal na pangalan na יהוה bilang “Yahweh,” ayon sa ibinigay na konsultasyong teksto at sa malinaw na pagkakaiba nito sa titulong “Panginoon.”
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Sa batas tungkol sa paghahandog, maaaring tumukoy ang חַטָּאת sa mismong handog; nililinaw ito ng pariralang Filipino.
theological_decisions:
- issue: Kung isasalin ang הַכֹּהֵן הַמָּשִׁיחַ bilang “pinahirang pari” o “pinahirang punong pari”
  choice: pinahirang pari
  alternative: pinahirang punong pari
  rationale: Bagaman maaaring ang punong pari ang tinutukoy sa konteksto, walang hiwalay na salitang “punô” sa pariralang Hebreo. Pinananatili ng salin ang mismong katawagan ng teksto.
- issue: Kung paano ihahayag ang panlahatang bunga ng לְאַשְׁמַת הָעָם
  choice: na nagdudulot ng pagkakasala sa bayan
  alternative: na nagiging dahilan upang managot ang bayan
  rationale: Ipinakikita ng pinili ang ugnayan ng kasalanan ng pari at ng pagkakasala ng bayan ngunit hindi nito tinutukoy nang higit sa Hebreo ang eksaktong mekanismo ng pananagutan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinahirang pari” upang manatiling malapit sa Hebreo; “bakahan” at “walang kapintasan” ay likas at madaling maunawaang pananalitang panghandog. Inilagay ang parehong pananda ng talababa sa pangunahing teksto.
