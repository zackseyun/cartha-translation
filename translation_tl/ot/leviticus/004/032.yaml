  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: tl
  text: At kung magdadala siya ng isang batang tupa bilang handog niya para sa kasalanan[a], magdadala siya ng isang babaeng tupa na walang kapintasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog na tumutugon sa kasalanan at sa ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at pasubaling daloy ng kasunod na alternatibong tuntunin.
- source_word: כֶּבֶשׂ
  choice: isang batang tupa
  rationale: Likas at malinaw na katumbas ng hayop na mula sa kawan sa kontekstong ito; ang kasunod na נְקֵבָה ang tumutukoy na babae ito.
- source_word: יָבִיא
  choice: dadalhin niya
  rationale: Ang Hiphil ng בוא ay konkretong nangangahulugang ‘dalhin’ sa konteksto ng paghahandog; ang anyong Filipino ay angkop sa kondisyong pangungusap.
- source_word: קָרְבָּנוֹ
  choice: bilang handog niya
  rationale: Ipinapahayag ang handog na inilalapit at pinananatili ang hulaping paari.
- source_word: לְחַטָּאת
  choice: para sa kasalanan
  rationale: Malinaw at natural na katawagan sa handog na tumutugon sa kasalanan, habang inilalagay sa talababa ang tunay na alternatibong diin sa paglilinis.
- source_word: נְקֵבָה
  choice: isang babae
  rationale: Tahasang pinananatili ang itinakdang kasarian ng hayop.
- source_word: תְמִימָה
  choice: walang kapintasan
  rationale: Sa batas ng paghahandog, tumutukoy ito sa hayop na walang depekto; dignified at karaniwang nauunawaan ang parirala.
- source_word: יְבִיאֶנָּה
  choice: ang dadalhin niya
  rationale: Pinananatili ang pag-uulit ng pandiwang ‘dalhin’ at ang pambabaeng layon na tumutukoy sa tupang babae.
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa batas ng paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang tradisyonal at malinaw na katawagan ay pinananatili sa pangunahing teksto, ngunit hindi itinatago ang lehitimong saklaw ng terminong Hebreo na maaaring magdiin sa paglilinis mula sa karumihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kondisyong ayos at ang pag-uulit ng pandiwang nasa Hebreo nang hindi ginagawang mabigat ang pangungusap.
