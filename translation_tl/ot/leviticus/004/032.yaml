  naturalness: Mas natural at malinaw ang “magdadala siya ng” kaysa sa pagkakahiwalay ng “ang dadalhin niya” sa simula ng kondisyon. Ang “isang babaeng tupa na walang kapintasan” ay idiomatiko, hindi malabo, at angkop sa marangal na rehistro ng batas panghahandog.
