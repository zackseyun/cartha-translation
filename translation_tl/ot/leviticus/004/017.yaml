  source_fidelity: 'Tapat ang salin sa pagkakasunod ng mga kilos sa Hebreo: pagsawsaw ng daliri sa dugo, pagwiwisik ng dugo nang pitong ulit, at ang lokasyong ‘sa harap ni Yahweh’ at ‘sa tapat ng tabing.’ Ang ‘sa dugo’ ay likas na Filipino para sa מִן־הַדָּם kasunod ng ‘isasawsaw’ at hindi nagpapahiwatig na buong kamay ang inilulubog.'
