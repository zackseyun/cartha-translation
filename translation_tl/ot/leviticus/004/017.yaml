base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: tl
  text: Pagkatapos, isasawsaw ng pari ang kanyang daliri sa dugo at iwiwisik niya ang dugo nang pitong ulit sa harap ni Yahweh, sa tapat ng tabing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina.” Ang salitang Hebreo ay tumutukoy sa tabing ng santuwaryo na naghihiwalay sa sagradong bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: Pagkatapos, isasawsaw
  rationale: Ang טבל ay nangangahulugang ‘isawsaw’ o ‘ilubog.’ Ipinahahayag ng ‘Pagkatapos’ ang sunod-sunod na hakbang sa ritwal, at ang anyong panghinaharap ay angkop sa tuntuning inuutos sa konteksto.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwan at malinaw na salin ng כהן; napananatili sa Filipino ang tiyak na tinutukoy sa pamamagitan ng ‘ang kanyang daliri’ at ng istruktura ng pangungusap.
- source_word: אֶצְבָּעוֹ
  choice: ang kanyang daliri
  rationale: Tuwirang salin na nagpapanatili sa isahan at sa panlalaking panghalip na tumutukoy sa pari.
- source_word: מִן הַדָּם
  choice: sa dugo
  rationale: Sa Filipino, likas na sinasabi ang ‘isawsaw ... sa dugo.’ Hindi nito ipinahihiwatig na inilulubog ang buong kamay; daliri lamang ang tahasang layon, kaya likas na naipahihiwatig ang pagkuha mula sa dugo.
- source_word: וְהִזָּה
  choice: at iwiwisik niya ang dugo
  rationale: Sa ritwal na konteksto, ang הזה ay pagwiwisik ng likido. Tahasang inuulit ang ‘dugo’ bilang likas na layon sa Filipino at upang maging malinaw kung ano ang iwiwisik.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwiran at natural na salin ng bilang at dalas ng kilos.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay ‘sa harap’ o ‘sa presensya ng.’ Ginamit ang ‘ni’ sapagkat personal na pangalan ang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng banal na pangalang יהוה, sa halip na palitan ito ng isang titulo.
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: sa tapat ng tabing
  rationale: Ang parirala ay tumutukoy sa harapan ng panloob na tabing ng santuwaryo. Ang ‘sa tapat’ ay natural sa Filipino at iniiwasan ang mabigat na pag-uulit ng ‘sa harap.’
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Paglalahad sa פָּרֹכֶת
  choice: tabing
  alternative: kurtina; belo
  rationale: Tumutukoy ito sa tabing na naghihiwalay sa sagradong bahagi ng santuwaryo. Ang ‘tabing’ ay malinaw, marangal, at hindi nag-aangkat ng mas makitid na kahulugang eklesiastiko.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘isawsaw,’ ‘iwiwisik,’ at ‘tabing’ bilang karaniwang ngunit angkop na bokabularyo para sa ritwal; pinanatili ang tiyak at sunod-sunod na kilos ng tekstong Hebreo.
