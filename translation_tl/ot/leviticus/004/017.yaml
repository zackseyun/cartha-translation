  terminology: Ang ‘pari’ para sa כֹּהֵן, ‘Yahweh’ para sa tetragrammaton, at ‘tabing’ para sa פָּרֹכֶת ay wasto at magkakatugma. Ang talababa ay nagbibigay ng kapaki-pakinabang na alternatibong ‘kurtina’ nang hindi nagpapataw ng interpretasyong doktrinal.
