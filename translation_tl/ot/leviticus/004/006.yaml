id: LEV.4.6
reference: Leviticus 4:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: tl
  text: Isasawsaw ng pari ang kanyang daliri sa dugo, at magwiwisik siya ng kaunting dugo nang pitong beses sa harap ni Yahweh[a], sa tapat ng kurtina ng santuwaryo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa harap ng kurtina ng Dakong Banal.”'
    reason: Pinananatili ang posibleng alternatibong pag-unawa sa ugnayan ng mga pariralang panglokasyon at sa kahulugan ng הַקֹּדֶשׁ.
lexical_decisions:
- source_word: וְטָבַל
  choice: Isasawsaw
  rationale: Ipinagpapatuloy ng waw + qatal ang sunod-sunod na tagubilin sa ritwal. Ang hinaharap na anyong “isasawsaw” ay natural sa makabagong Filipino para sa itinakdang gawain.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Tiyak at isahang pangngalan ito para sa paring nangangasiwa sa ritwal.
- source_word: אֶצְבָּעוֹ
  choice: ang kanyang daliri
  rationale: Tuwirang inililipat ang isahang pangngalan na may panlalaking ikatlong-panauhang hulapi.
- source_word: בַּדָּם
  choice: sa dugo
  rationale: Ipinapahayag ng ב ang likidong pinagsasawsawan; natural at malinaw sa Filipino ang “sa dugo.”
- source_word: וְהִזָּה
  choice: magwiwisik siya
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng נזה ay tumutukoy sa ritwal na pagwiwisik. Iniiwasan ng “magwiwisik” ang di-kailangang pagpapalagay ng tahasang layon.
- source_word: מִן־הַדָּם
  choice: ng kaunting dugo
  rationale: 'Partitibo ang מן dito: bahagi lamang ng dugong kinuha ang iwiwisik. Natural sa Filipino ang “kaunting dugo.”'
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong beses
  rationale: Karaniwang paraang Filipino upang ipahayag ang bilang ng pag-ulit ng kilos.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang spatial at kultikong diwa ng לִפְנֵי at tuwirang isinasalin ang pangalang tipan na יהוה bilang Yahweh.
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: sa tapat ng kurtina ng santuwaryo
  rationale: Ang פני kaugnay ng isang bagay ay tumutukoy sa harapan nito. Ang “kurtina” ay madaling maunawaan para sa פָּרֹכֶת, at ang “santuwaryo” ay malinaw na katumbas ng sagradong pook na tinutukoy ng הַקֹּדֶשׁ.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kaugnayan ng לִפְנֵי יְהוָה at אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: sa harap ni Yahweh, sa tapat ng kurtina ng santuwaryo
  alternative: sa harap ng kurtina ng Dakong Banal
  rationale: Pinananatili sa pangunahing teksto ang parehong pariralang panglokasyon ng Hebreo nang hindi ginagawang ganap na magkapareho ang “sa harap ni Yahweh” at ang harapan ng kurtina. Inilalagay sa talababa ang mas siksik na alternatibong pagbasa.
- issue: Kahulugan ng פָּרֹכֶת הַקֹּדֶשׁ
  choice: kurtina ng santuwaryo
  alternative: kurtina ng Dakong Banal
  rationale: Ang “santuwaryo” ay likas at madaling maunawaan, ngunit kinikilala sa talababa na maaaring tukuyin ng הַקֹּדֶשׁ ang Dakong Banal bilang partikular na sagradong bahagi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pari,” “kurtina,” at “santuwaryo” bilang pamilyar ngunit angkop na mga terminong panritwal; pinanatili ang pangalang Yahweh at ang bahagyang sintaktikong tensiyon ng Hebreo.
