revisions:
- from: At kukuha ang pari ng kaunti sa dugo nito sa pamamagitan ng kanyang daliri[a] at ilalagay iyon sa mga sungay ng altar para sa handog na sinusunog[b]. Pagkatapos, ibubuhos niya ang lahat ng dugo nito sa paanan ng altar.[c]
  to: At kukuha ang pari ng kaunti sa dugo nito gamit ang kanyang daliri[a] at ilalagay niya ito sa mga sungay ng altar ng handog na sinusunog[b], at ibubuhos niya ang lahat ng dugo nito sa paanan ng altar.[c]
  rationale: Ginawa ang maliliit na rebisyon upang maging mas malapit ang pagtukoy sa “altar ng handog na sinusunog” sa Hebrew at maging mas natural ang instrumental na parirala. Pinanatili ang partitive na “kaunti,” ang literal na “lahat ng dugo nito,” at ang mga talababa upang hindi mawala ang tekstuwal na pag-igting sa pagitan ng dalawang parirala.
