  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: tl
  text: At kukuha ang pari ng kaunti sa dugo nito gamit ang kanyang daliri[a] at ilalagay niya ito sa mga sungay ng altar ng handog na sinusunog[b], at ibubuhos niya ang lahat ng dugo nito sa paanan ng altar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa dugo nito.” Malamang na bahagi lamang ng dugo ang ibig sabihin dito.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga sungay” ay mga nakausling bahaging parang sungay sa mga sulok ng altar.
    reason: cultural_note
  - marker: c
    text: Bagaman “lahat ng dugo nito” ang sinasabi ng Hebrew, ipinahihiwatig ng pagkakasunod-sunod na ang dugong natira matapos kumuha ng kaunti ang ibinubuhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: At kukuha
  rationale: Sa konteksto ng itinakdang ritwal, ang anyo ng pandiwa ay nagpapahayag ng tagubilin; natural itong isalin sa Filipino gamit ang aspektong kontemplatibo.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang tumutukoy sa tiyak na tagapagsagawa ng ritwal.
- source_word: מִדָּמָהּ
  choice: ng kaunti sa dugo nito
  rationale: 'Ang מִן ay malamang na partitive dito: bahagi lamang ng dugo ang kukunin para ipahid o ilagay sa altar.'
- source_word: בְּאֶצְבָּעוֹ
  choice: sa pamamagitan ng kanyang daliri
  rationale: Instrumental ang בְּ; nililinaw nitong daliri ang ginagamit sa pagkuha at paglalagay ng dugo.
- source_word: וְנָתַן
  choice: at ilalagay iyon
  rationale: Ang נתן ay may malawak na diwang 'magbigay/maglagay'; ang 'ilalagay' ay natural at hindi labis na nagpapakahulugan.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: sa mga sungay ng altar para sa handog na sinusunog
  rationale: Pinananatili ang literal at teknikal na terminong 'mga sungay,' habang natural na ipinapahayag ang kaugnayan ng altar sa handog na sinusunog.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: ang lahat ng dugo nito
  rationale: Pinananatili ang komprehensibong כָּל sa pangunahing teksto, kahit ipinahihiwatig ng pagkakasunod-sunod na ang natitirang dugo ang tinutukoy.
- source_word: יִשְׁפֹּךְ
  choice: ibubuhos niya
  rationale: Karaniwang kahulugan ng שׁפך sa kontekstong pansakripisyo ang pagbubuhos.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: sa paanan ng altar
  rationale: Ang יְסוֹד ay pundasyon o base; 'paanan' ang malinaw at likas na salin para sa ibabang bahagi ng altar.
theological_decisions:
- issue: Aspekto ng pandiwa sa tagubiling panritwal
  choice: 'Isinalin bilang preskriptibong pagkakasunod: ''kukuha ... ilalagay ... ibubuhos.'''
  alternative: 'Isalin bilang naganap na salaysay: ''kumuha ... inilagay ... ibinuhos.'''
  rationale: Bahagi ang talata ng batas at tuntuning panritwal, hindi ng salaysay tungkol sa isang minsanang pangyayari.
- issue: Terminong kultiko para sa mga nakausling bahagi ng altar
  choice: Pinanatili ang 'mga sungay.'
  alternative: Gawing 'mga sulok' o 'mga nakausling bahagi.'
  rationale: Tiyak na terminong kultiko ang Hebrew at mahalagang mapanatili ang larawan nito; ipinaliliwanag sa talababa ang pisikal na tinutukoy.
- issue: Saklaw ng 'lahat ng dugo nito'
  choice: Pinanatili sa teksto ang literal na 'lahat,' na may paliwanag sa talababa.
  alternative: Isalin nang tahasan bilang 'ang natitirang dugo nito.'
  rationale: Iniiwasang palitan sa pangunahing teksto ang komprehensibong salita ng Hebrew, habang kinikilala ang implikasyon ng ritwal na may nauna nang kinuha na kaunting dugo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'pari,' 'altar,' at 'handog na sinusunog' bilang malinaw na bokabularyong panritwal; pinanatili ang teknikal na larawang 'mga sungay' at ipinaliwanag sa talababa.
