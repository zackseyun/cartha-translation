  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: tl
  text: At kukuha ang pinahirang pari ng bahagi ng dugo ng toro at dadalhin niya ito sa Toldang Tipanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papunta sa Toldang Tipanan.” Ang Hebreong pang-ukol ay nagsasaad ng patutunguhan; ipinakikita ng kasunod na ritwal na pumapasok ang pari sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: At kukuha
  rationale: Ang waw + qatal sa kontekstong ito ay sunod-sunod na tagubiling pangritwal. Likas sa modernong Tagalog ang anyong panghinaharap na “kukuha,” habang pinananatili ng “At” ang ugnayan sa naunang hakbang.
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: ang pinahirang pari
  rationale: Tuwirang pinananatili nito ang kahulugan ng מָשִׁיחַ bilang “pinahiran,” nang hindi ito basta pinapalitan ng interpretatibong titulong “punong pari” o nilalagyan ng kalaunang mesiyanikong pahiwatig.
- source_word: מִדַּם הַפָּר
  choice: ng kaunting dugo ng toro
  rationale: 'Ang מִן ay malamang na partitive rito: bahagi lamang ng dugo ang kukunin. Ang “kaunting dugo” ay natural na Tagalog para sa di-tiyak na dami, hindi kinakailangang napakaliit na sukat.'
- source_word: וְהֵבִיא אֹתוֹ
  choice: at dadalhin niya iyon
  rationale: Ang hulaping layon ay tumutukoy sa dugong kababanggit lamang. Nililinaw ng “niya” ang tagaganap at ng “iyon” ang layon sa natural na Tagalog.
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Ang אֶל ay pangunahing nagsasaad ng tungo sa isang lugar, samantalang ipinahihiwatig ng kasunod na ritwal ang pagpasok. Ang “sa” ay natural at sadyang hindi nagtatakda kung “papunta sa” o “papasok sa,” kaya napapanatili ang saklaw ng Hebreo. Ang “Toldang Tipanan” ay malinaw at nakaugaliang katawagan sa Tagalog para sa itinalagang santuwaryo kung saan nakikipagtagpo ang Diyos sa Israel.
theological_decisions:
- issue: Pagpapakahulugan sa הַכֹּהֵן הַמָּשִׁיחַ
  choice: ang pinahirang pari
  alternative: ang punong pari; ang itinalagang pari
  rationale: Pinananatili ang tahasang leksikal na diwa ng “pinahiran” at ang Levitikong katungkulan nito, nang hindi ipinapasok sa teksto ang isang tiyak na interpretasyong mesiyaniko o pinapalitan ang mismong katawagan ng Hebreo.
- issue: Direksiyon ng אֶל patungo sa santuwaryo
  choice: sa Toldang Tipanan
  alternative: papunta sa Toldang Tipanan; sa loob ng Toldang Tipanan
  rationale: Hindi tahasang ipinapasiya ng pangunahing teksto ang pagkakaiba ng “to” at “into.” Sapat ang “sa” upang ipahayag ang patutunguhan at hayaan ang kasunod na konteksto na magpakitang pumasok ang pari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang payak na ayos ng pangungusap at ang “sa” upang mapanatili ang tunay na lawak ng Hebreong אֶל. Ang panandang [a] ay nasa pangunahing teksto at tumutugma sa tala.
