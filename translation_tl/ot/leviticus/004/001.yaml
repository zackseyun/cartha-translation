  text: 'Nagsalita si Yahweh kay Moises[a] at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari rin itong isalin bilang “Jehovah.”'
