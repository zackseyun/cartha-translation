lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ang pandiwang דבר na may waw-consecutive ay nagbubukas ng bagong yunit ng banal na pahayag. Ang “nagsalita” ay natural at mas angkop kaysa “sinabi” sa paulit-ulit na pormulang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong pinatutungkulan ng pagsasalita; “kay Moises” ang likas na anyo sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ang infinitive construct ay pormulang nagpapakilala sa nilalaman ng kasunod na pahayag. Pinananatili rito ang pormal na pambungad sa pagsasalita.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at iniiwasang palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal at paulit-ulit na hulma ng pambungad sa banal na pahayag; ang kuwit sa dulo ay nagpapakitang nagpapatuloy ang pangungusap sa susunod na talata.
