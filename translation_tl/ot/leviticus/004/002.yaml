source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: tl
  text: 'Sabihin mo sa mga anak ni Israel[a]: “Kung ang isang tao ay magkasala nang hindi sinasadya[b] laban sa alinman sa mga utos ni Yahweh tungkol sa mga bagay na hindi dapat gawin, at gumawa siya ng isa sa mga iyon,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita”; literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “dahil sa pagkakamali” o “nang di-namamalayan.” Tinutukoy ng Hebreo ang kasalanang nagawa nang hindi sinasadya, hindi ang mapangahas na pagsuway.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Sabihin mo sa mga anak ni Israel
  rationale: Likas na salin sa modernong Tagalog ng utos na magsalita sa mga בְּנֵי יִשְׂרָאֵל; pinananatili ng “mga anak ni Israel” ang pampamilyang anyo ng Hebreo.
- source_word: נֶפֶשׁ
  choice: isang tao
  rationale: Sa kontekstong legal, tumutukoy ang נֶפֶשׁ sa isang indibidwal, hindi partikular sa di-materyal na “kaluluwa.”
- source_word: תֶחֱטָא
  choice: magkasala
  rationale: Tuwirang katumbas ng pandiwang חטא at angkop sa konteksto ng paglabag sa utos.
- source_word: בִשְׁגָגָה
  choice: nang hindi sinasadya
  rationale: Ipinahahayag ang pagkakasalang nagawa dahil sa di-sinasadyang pagkakamali, hindi ang hayagang mapanghimagsik na pagsuway.
- source_word: מִכֹּל מִצְוֺת יְהוָה
  choice: may kinalaman sa alinman sa mga utos ni Yahweh
  rationale: Pinananatili ang malawak na ugnayang ipinahihiwatig ng מן nang hindi ito sapilitang nililimitahan sa isang partikular na sintaktikong pagbasa.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: tungkol sa mga bagay na hindi dapat gawin
  rationale: Natural na Tagalog na nagpapanatili sa impersonal at nagbabawal na diwa ng Hebreo.
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: at gawin niya ang isa sa mga iyon
  rationale: Pinananatili ang pagpapatuloy at ang pagtukoy pabalik sa mga ipinagbabawal na bagay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng Hebreo ang Tetragrammaton; ang “Yahweh” ay tuwirang transliterasyon na nagpapanatili sa pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Katangian ng kasalanang בִשְׁגָגָה
  choice: nang hindi sinasadya
  alternative: dahil sa pagkakamali; nang di-namamalayan
  rationale: Hindi ipinahihiwatig na walang pananagutan ang tao; tinutukoy lamang na ang paglabag ay di-sinasadya, salungat sa mapangahas na pagsuway.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang legal na kondisyon at ang bahagyang pag-uulit ng Hebreo. Nananatiling bukas ang pangungusap sa kuwit sapagkat nagpapatuloy ang kondisyon sa kasunod na talata.
