  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: tl
  text: Dadalhin niya ang toro sa pasukan ng tolda ng pagpupulong, sa harap ni Yahweh,[a] at ipapatong niya ang kanyang kamay sa ulo ng toro, at kakatayin niya ang toro sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa presensya ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: Dadalhin niya
  rationale: Ang Hiphil ng בוא ay utos na dalhin ng naghahandog ang hayop. Ang aspektong panghinaharap sa Filipino ay natural sa ganitong tagubiling ritwal.
- source_word: הַפָּר
  choice: ang toro
  rationale: Ang פַּר ay toro, kadalasa'y ginagamit sa kontekstong paghahandog. Hindi idinagdag ang “batang” sapagkat hindi iyon tahasang nakasaad sa talata.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng pagpupulong
  rationale: Ang פֶּתַח ay pasukan o bukana, at ang אֹהֶל מוֹעֵד ay pamantayang tawag sa santuwaryo bilang tolda ng pagpupulong.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay maaaring mangahulugang “sa harap” o “sa presensya.” Pinananatili ng “sa harap ni Yahweh” ang maikli at kongkretong pahayag ng Hebreo.
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: ipapatong niya ang kanyang kamay sa ulo ng toro
  rationale: Inilalarawan nito ang pisikal na ritwal na pagpatong o pagdiin ng kamay, nang hindi ipinapasok ang isang tiyak na paliwanag sa simbolismo nito.
- source_word: וְשָׁחַט
  choice: at kakatayin niya
  rationale: Ang שׁחט ay teknikal na pandiwa para sa ritwal na pagkatay ng hayop; ang “kakatayin” ay natural at tiyak sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng pagpapatong ng kamay sa handog
  choice: Isalin lamang ang pisikal na kilos
  alternative: Tahasan itong ipaliwanag bilang pagkakakilanlan o paglilipat ng pagkakasala
  rationale: Inilalahad ng talata ang ritwal na kilos ngunit hindi nito rito ipinaliliwanag ang buong teolohikal na kahulugan; kaya hindi nilulutas sa salin ang nananatiling interpretatibong usapin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda ng pagpupulong” bilang tuwirang tawag sa אֹהֶל מוֹעֵד at ang mga pandiwang panghinaharap bilang natural na anyo ng tagubiling ritwal.
