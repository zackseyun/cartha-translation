revisions:
- from: Aalisin niya ang lahat ng taba nito, gaya ng pag-aalis ng taba ng batang tupa sa haing pangkapayapaan. Susunugin ng pari ang mga iyon sa altar, sa ibabaw ng mga handog na pinaraan sa apoy para kay Yahweh.[a] Sa gayon, isasagawa ng pari ang pagbabayad-sala para sa kanya dahil sa kasalanang nagawa niya, at patatawarin siya.
  to: Aalisin niya ang lahat ng taba nito, gaya ng pag-aalis sa taba ng batang tupa mula sa haing pangkapayapaan. Susunugin ng pari ang mga iyon sa altar, sa ibabaw ng mga handog na pinaraan sa apoy para kay Yahweh.[a] Sa gayon, gagawa ang pari ng pagbabayad-sala para sa kanya ukol sa kasalanang nagawa niya, at patatawarin siya.
