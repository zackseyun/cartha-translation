id: LEV.4.35
reference: Leviticus 4:35
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: tl
  text: Aalisin niya ang lahat ng taba nito, gaya ng pag-aalis sa taba ng batang tupa mula sa haing pangkapayapaan. Susunugin ng pari ang mga iyon sa altar, sa ibabaw ng mga handog na pinaraan sa apoy para kay Yahweh.[a] Sa gayon, gagawa ang pari ng pagbabayad-sala para sa kanya ukol sa kasalanang nagawa niya, at patatawarin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ibabaw ng mga handog na inihahandog sa pamamagitan ng apoy kay Yahweh.” Ang pananalitang Hebreo ay isang teknikal na katawagang pansakripisyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: taba
  rationale: Tumutukoy ito sa taba ng hayop na itinakdang alisin at ihandog; malinaw at tuwiran ang “taba” sa modernong Tagalog.
- source_word: יָסִיר / יוּסַר
  choice: aalisin / pag-aalis
  rationale: Inilalarawan ng pandiwa ang ritwal na pagtanggal sa taba mula sa hayop.
- source_word: הַכֶּשֶׂב
  choice: batang tupa
  rationale: Sa kontekstong panghain, ang salita ay malamang na tumutukoy sa isang batang tupa, hindi lamang sa tupa sa pangkalahatan.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: haing pangkapayapaan
  rationale: Pinananatili nito ang kinikilalang katawagang pansakripisyo nang hindi ipinapakahulugan nang mas makitid bilang pakikisama lamang.
- source_word: וְהִקְטִיר
  choice: susunugin
  rationale: Sa kontekstong ito, tumutukoy ito sa pagsunog ng inihandog na taba sa altar upang maging usok.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Maramihan ang panghalip sa Hebreo at tumutukoy sa magkakahiwalay na bahagi ng taba.
- source_word: הַמִּזְבֵּחָה עַל
  choice: sa altar, sa ibabaw ng
  rationale: Ipinahihiwatig ng parirala ang pagsunog sa altar at ang pagkakalagay ng taba sa ibabaw ng mga handog doon.
- source_word: אִשֵּׁי יְהוָה
  choice: mga handog na pinaraan sa apoy para kay Yahweh
  rationale: Isa itong teknikal na katawagang pansakripisyo. Inihahayag ng salin ang kaugnayan nito sa apoy habang iniiwasan ang malabong jargon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- source_word: וְכִפֶּר עָלָיו
  choice: isasagawa ang pagbabayad-sala para sa kanya
  rationale: Pinananatili ang malawak na kahulugang pansakripisyo ng כפר nang hindi itinatakda ang isang partikular na teorya kung paano gumagana ang pagtubos.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dahil sa kasalanang nagawa niya
  rationale: Natural itong Tagalog at malinaw na tinutukoy ang kasalanang dahilan ng pagsasagawa ng pagbabayad-sala.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: 'Natural na ipinahahayag sa Tagalog ang bunga ng ritwal: tatanggap ng kapatawaran ang nagkasala.'
theological_decisions:
- issue: Wika tungkol sa pansakripisyong atonement
  choice: isasagawa ng pari ang pagbabayad-sala para sa kanya
  alternative: isasagawa ng pari ang pagtubos para sa kanya
  rationale: Ang “pagbabayad-sala” ay nakikilalang katawagang biblikal sa Tagalog at pinananatili ang kategoryang pansakripisyo. Hindi ipinapaliwanag ng talata ang mekanismo nito, kaya hindi ito pinaliit sa isang sistematikong pananaw.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa Hebreo, kaya pinanatili itong Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng זֶבַח הַשְּׁלָמִים
  choice: haing pangkapayapaan
  alternative: haing para sa mabuting ugnayan
  rationale: Pinananatili ng “pangkapayapaan” ang tradisyonal at malawak na kategorya ng handog, samantalang maaaring paliitin ng alternatibo ang kahulugan sa pakikisama lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang mga karaniwang katawagang biblikal na “altar,” “haing pangkapayapaan,” at “pagbabayad-sala,” habang inayos ang pangungusap upang maging natural sa kasalukuyang Tagalog. Inilagay ang talababa sa teknikal na pariralang אִשֵּׁי יְהוָה na aktuwal nitong ipinapaliwanag.
