base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: tl
  text: Gagawin niya sa toro ang gaya ng ginawa niya sa toro ng handog para sa kasalanan[a]; gayon din ang gagawin niya sa torong ito. Magsasagawa ang pari ng pagbabayad-sala para sa kanila, at patatawarin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang terminong Hebreo ay maaaring tumukoy sa handog na tumutugon sa kasalanan sa pamamagitan ng rituwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: Gagawin niya sa toro
  rationale: Ang עשה na may ל ay tumutukoy sa rituwal na isasagawa sa hayop. Natural sa modernong Tagalog ang “gagawin ... sa toro” at pinananatili nito ang procedural na diin.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: ang mismong ginawa niya
  rationale: Ipinahihiwatig ng כַּאֲשֶׁר ang tahasang pagtutulad sa naunang rituwal; ang “mismong” ay natural na nagbibigay-diin sa eksaktong pagkakatulad.
- source_word: לְפַר הַחַטָּאת
  choice: sa toro ng handog para sa kasalanan
  rationale: Tinutukoy nito ang torong inilarawan sa naunang rituwal. Malinaw at pamilyar ang “handog para sa kasalanan,” samantalang inilalagay sa talababa ang leksikal na alternatibong may diin sa paglilinis.
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: gayon ang gagawin niya rito
  rationale: Pinananatili ng “gayon” ang pormal na pagtutugma ng כֵּן, at malinaw na ang “rito” ay tumutukoy sa toro.
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: Sa ganitong paraan, gagawa ang pari ng pagtubos para sa kanila
  rationale: Ang כפר ay susing terminong pangrituwal. Ang “gagawa ... ng pagtubos” ay nagpapanatili sa ideya ng gawaing nagdudulot ng pakikipagkasundo/pag-aalis ng sala, at ang עֲלֵהֶם ay natural na “para sa kanila.”
- source_word: וְנִסְלַח לָהֶם
  choice: at patatawarin sila
  rationale: Ang Niphal ng סלח ay nagsasaad ng resultang pagpapatawad. Ang personal na pasibong Tagalog ay malinaw at natural.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang חטאת sa handog na tumutugon sa kasalanan at nagsasagawa ng rituwal na paglilinis. Pinili sa pangunahing teksto ang mas pamilyar at madaling maunawaang “handog para sa kasalanan,” habang pinananatili sa talababa ang tunay na leksikal na alternatibo.
- issue: Pagpapahayag ng כפר
  choice: gagawa ... ng pagtubos para sa kanila
  alternative: magbabayad-sala para sa kanila
  rationale: Ang “pagtubos” ay dignificado at malawak na nauunawaan, samantalang ang “pagbabayad-sala” ay maaaring magpahiwatig ng mas tiyak na mekanismo kaysa sa tahasang sinasabi ng pandiwang Hebreo. Hindi nilulutas ng salin ang buong teolohikal na saklaw ng כפר.
translation_notes:
  register: Modernong Filipino Tagalog na may dignificado at bahagyang pormal na himig na angkop sa batas pangrituwal. Iniwasan ang labis na teknikal o denominasyonal na pananalita; pinanatili ang pag-uulit ng Hebreo upang maging malinaw ang pagtukoy sa naunang pamamaraan.
