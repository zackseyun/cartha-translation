  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: tl
  text: o kung ipinaalam sa kanya ang kasalanang nagawa niya, magdadala siya ng isang lalaking kambing na walang kapintasan bilang handog.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹ
  choice: o
  rationale: Payak na pangatnig na nagpapatuloy sa alternatibong kalagayan ng kautusan mula sa naunang talata.
- source_word: הוֹדַע אֵלָיו
  choice: ipinaalam sa kanya
  rationale: 'Ang Hophal ng ידע ay pasibo/kausatibong pasibo: ipinaabot sa kanya ang kaalaman tungkol sa kasalanan, sa halip na basta niya lamang ito napagtanto.'
- source_word: חַטָּאתוֹ
  choice: ang kasalanan
  rationale: Tumutukoy ito sa nagawang kasalanan, hindi sa handog para sa kasalanan, gaya ng nililinaw ng kasunod na sugnay.
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: na nagawa niya
  rationale: Likas na salin sa Filipino ng idyomatikong pariralang Hebreo; tinutukoy nito ang kasalanang ginawa niya nang hindi pilit na isinasalin ang pang-ukol na בָּהּ.
- source_word: וְהֵבִיא
  choice: magdadala siya
  rationale: Ang waw na sinusundan ng perfect sa kontekstong legal ay nagsasaad ng itinakdang kasunod na kilos.
- source_word: קָרְבָּנוֹ
  choice: bilang handog
  rationale: Ang קָרְבָּן ay bagay na inihaharap o inilalapit bilang handog; natural sa Filipino ang konstruksiyong 'magdadala bilang handog.'
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: isang lalaking kambing
  rationale: Malinaw na pinananatili ang uri ng hayop at ang tahasang pagtukoy ng tekstong Hebreo sa kasariang lalaki.
- source_word: תָּמִים
  choice: na walang kapintasan
  rationale: Karaniwan at malinaw na pananalita para sa hayop na walang depekto at karapat-dapat ihandog.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa talatang ito
  choice: kasalanan o pagkakasala, hindi handog para sa kasalanan
  alternative: handog para sa kasalanan
  rationale: Bagaman maaaring tumukoy ang חַטָּאת sa kasalanan o sa handog para sa kasalanan, ipinakikitang ang kasalanan mismo ang tinutukoy rito ng sugnay na 'na nagawa niya.' Bukod dito, hiwalay na tinatawag na קָרְבָּנוֹ ang handog sa kasunod na bahagi.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang pasibong diwa ng הוֹדַע sa pamamagitan ng 'ipinaalam sa kanya,' at iniwasan ang mas teknikal o makalumang bokabularyo.
