base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: tl
  text: 'At aalisin niya mula sa toro na handog para sa kasalanan ang lahat ng taba nito: ang taba na bumabalot sa mga laman-loob at ang lahat ng taba na nasa ibabaw ng mga laman-loob.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy kapwa sa “kasalanan” at sa handog na kaugnay ng pag-aalis ng karumihan o kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: lahat
  rationale: 'Pinananatili ang komprehensibong diwa ng Hebreo: ang buong itinakdang taba ay aalisin.'
- source_word: חֵלֶב
  choice: taba
  rationale: Tuwirang tumutukoy sa mga bahaging taba na nakalaan sa paghahain; nililinaw ng kasunod na paglalarawang anatomikal ang rituwal na gamit nito.
- source_word: פַּר הַחַטָּאת
  choice: toro ... ng handog para sa kasalanan
  rationale: Ipinakikitang ang toro ang hayop na itinalaga para sa handog, nang hindi ipinahihiwatig na ang toro mismo ay kasalanan.
- source_word: יָרִים
  choice: aalisin niya
  rationale: Bagaman maaaring literal na 'iaangat,' sa pamamaraang panghandog ang tinutukoy ay ang paghihiwalay o pag-aalis ng mga takdang bahagi.
- source_word: מִמֶּנּוּ
  choice: mula sa toro
  rationale: Ginawang tahasan ang reperente ng panghalip upang maging malinaw at natural sa Tagalog.
- source_word: הַמְכַסֶּה
  choice: bumabalot
  rationale: Likas at malinaw na inilalarawan ang taba ayon sa kinalalagyan at tungkulin nito.
- source_word: קֶּרֶב
  choice: mga laman-loob
  rationale: Karaniwan, malinaw, at sapat na tiyak na katawagang anatomikal sa modernong Tagalog.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: nasa ibabaw ng mga laman-loob
  rationale: Pinananatili ang puwestong ipinahahayag ng עַל at ang pagkakaiba nito sa tabang bumabalot sa mga laman-loob.
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa konteksto ng paghahain
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang termino ay maaaring tumukoy kapwa sa kasalanan at sa handog na may tungkuling mag-alis ng karumihan o kasalanan. Ginamit sa pangunahing teksto ang mas kilalang katawagan, habang pinananatili sa talababa ang tunay na alternatibong rituwal na diin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'mga laman-loob' sa halip na mas teknikal na katawagan, at pinanatili ang pormal na himig ng tagubiling rituwal.
