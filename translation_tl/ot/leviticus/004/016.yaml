  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: tl
  text: Pagkatapos, magdadala ang pinahirang pari ng bahagi ng dugo ng toro papasok sa Tolda ng Tipanan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal, “mula sa dugo ng toro.” Malamang na partitive ang Hebreo: bahagi ng dugo ang dadalhin papasok.'
    reason: lexical_alternative
  - marker: b
    text: Ang “Tolda ng Tipanan” ay tradisyonal ding tinatawag na “tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: Pagkatapos, magdadala
  rationale: Ipinagpapatuloy ng pandiwa ang sunod-sunod na tagubilin sa ritwal. Likas na ipinapahayag ng “Pagkatapos” ang pagkakasunod ng mga hakbang.
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  choice: ang pinahirang pari
  rationale: Ang מָשִׁיחַ dito ay naglalarawan sa paring pinahiran para sa tungkulin; hindi ito titulong mesiyaniko.
- source_word: מִ/דַּם הַ/פָּר
  choice: ng kaunting dugo ng toro
  rationale: 'Malamang na partitive ang מִן: bahagi lamang ng dugo ang dinadala. Nililinaw ito ng “kaunting” nang hindi sinasabing tiyak ang dami.'
- source_word: אֶל
  choice: sa loob ng
  rationale: Sa konteksto ng pagdadala ng dugo patungo sa sagradong lugar, ipinahihiwatig ng parirala ang pagpasok, hindi lamang paglapit.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng tipanan
  rationale: Pinananatili nito ang konkretong larawan ng אֹהֶל at isinasalin ang מוֹעֵד bilang takdang pakikipagtagpo o tipanan, sa natural at pamilyar na katawagan sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng הַמָּשִׁיחַ sa kontekstong pangpari
  choice: pinahiran
  alternative: itinalaga; Mesiyas
  rationale: Tumutukoy ito sa paring pinahiran sa pagtatalaga sa tungkulin. Ang “Mesiyas” ay magpapasok ng hindi angkop na kristolohikal na pamagat, samantalang ang “itinalaga” ay hindi tuwirang nagpapanatili sa larawan ng pagpapahid.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pinahirang pari” upang mapanatili ang ritwal na larawan, at “tolda ng tipanan” bilang madaling maunawaang katawagan sa santuwaryo.
