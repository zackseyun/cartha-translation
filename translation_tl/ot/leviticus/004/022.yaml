revisions:
- from: Kapag nagkasala ang isang pinuno[a] at di-sinasadyang[b] gumawa ng alinman sa mga bagay na ipinag-utos ni Yahweh na kanyang Diyos na huwag gawin, at naging may-sala siya[c],
  to: Kapag nagkasala ang isang pinuno[a] at hindi niya sinasadyang gawin ang alinman sa mga bagay na hindi dapat gawin ayon sa mga utos ni Yahweh na kanyang Diyos, at naging may-sala siya,
  rationale: Inayos ang sugnay tungkol sa mga ipinagbabawal na gawa upang maging mas malinaw sa modernong Filipino at mas malapit sa diwang “mga bagay na hindi dapat gawin” sa Hebreo. Inalis ang talababa c dahil ang alternatibong “natanto niyang may sala siya” ay hindi sinusuportahan ng וְאָשֵׁם sa talatang ito. Iningatan ang pambungad na kuwit, sapagkat nagpapatuloy ang pangungusap sa sumusunod na mga talata.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:17:06Z'
