id: LEV.4.22
reference: Leviticus 4:22
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: tl
  text: Kapag nagkasala ang isang pinuno[a] at hindi niya sinasadyang gawin ang alinman sa mga bagay na hindi dapat gawin ayon sa mga utos ni Yahweh na kanyang Diyos, at naging may-sala siya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “puno” o “tagapamahala.” Ang Hebreong נָשִׂיא ay tumutukoy sa isang kinikilalang pinuno o puno.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: pinuno
  rationale: Ang salita ay tumutukoy sa kinikilalang pinuno o puno ng isang pangkat; hindi nito kinakailangang ipahiwatig na siya ay isang prinsipe o hari.
- source_word: יֶחֱטָא
  choice: nagkasala
  rationale: Tuwiran at karaniwang salin ito ng pandiwang חטא, at angkop sa dignidad ng kontekstong legal at panrelihiyon.
- source_word: וְעָשָׂה אַחַת מִכָּל מִצְוֺת
  choice: gumawa ng alinman sa mga bagay na ipinag-utos
  rationale: 'Ipinahahayag nito ang diwang partitibo: paggawa ng isa mula sa kabuuan ng mga gawaing saklaw ng mga utos.'
- source_word: יְהוָה אֱלֹהָיו
  choice: Yahweh na kanyang Diyos
  rationale: Pinananatili ang personal na pangalan na יְהוָה at ang mahalagang hulaping panghalip sa אֱלֹהָיו, na nagpapahayag na si Yahweh ang Diyos ng pinuno.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: na huwag gawin
  rationale: Natural na Filipino ito para sa pasibo at nagbabawal na diwa ng mga bagay na hindi dapat gawin.
- source_word: בִּשְׁגָגָה
  choice: di-sinasadyang
  rationale: Sa batas ng Levitico, tumutukoy ito sa paglabag na nagawa nang hindi sinasadya o dahil sa pagkakamali.
- source_word: וְאָשֵׁם
  choice: at naging may-sala siya
  rationale: Ipinakikita nito ang kalagayan o pananagutang bunga ng paglabag, nang hindi ipinapakahulugang sinadya ang ginawa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng וְאָשֵׁם
  choice: naging may-sala siya
  alternative: natanto niyang may sala siya; nagkaroon siya ng pananagutan
  rationale: Maaaring idiin ng pandiwa ang pagkakaroon ng sala o pananagutan, at sa ilang pagbasa ay ang pagkabatid nito. Pinananatili sa teksto ang pangunahing diwa ng pagiging may-sala at inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinuno” sa halip na mas makaluma o mas tiyak na “prinsipe,” at pinanatili ang bahagyang pormal na hulma ng batas upang bumagay sa Levitico.
