  - severity: low
    issue: Medyo mabigat ang “mga bagay na ipinag-utos ni Yahweh na kanyang Diyos na huwag gawin.”
    rationale: Bagaman nauunawaan, maaari itong magmukhang tuwirang utos na ‘huwag gawin’ sa halip na paglalarawan sa mga bagay na hindi dapat gawin sa ilalim ng mga utos. Ang rebisyon ay mas malinaw habang pinananatili ang saklaw ng Hebreo.
