base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: tl
  text: At susunugin niya sa altar ang lahat ng taba nito, gaya ng taba ng handog para sa kapayapaan.[a] Sa gayon, magbabayad-sala ang pari para sa kanya para sa kanyang kasalanan,[b] at patatawarin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “handog para sa kapayapaan” ay maaari ring isaling “handog para sa pakikisama” o “handog para sa kapakanan.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong חַטָּאת ay maaaring mangahulugang “kasalanan” o “handog para sa kasalanan”; dito, malamang na kasalanan ng tao ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: taba nito
  rationale: Tumutukoy ang חֵלֶב sa mga bahaging taba ng hayop na itinakdang sunugin sa ritwal. Pinananatili ng “taba nito” ang hulaping tumutukoy sa hayop.
- source_word: יַקְטִיר
  choice: susunugin
  rationale: Sa konteksto ng paghahandog, ang Hiphil ng קטר ay tumutukoy sa pagsusunog sa altar upang maging usok. Natural at malinaw sa Filipino ang “susunugin,” habang nililinaw ng pariralang “sa ibabaw ng altar” ang ritwal na diwa.
- source_word: הַמִּזְבֵּחָה
  choice: sa ibabaw ng altar
  rationale: Bagaman may direksiyonal na hulapi ang anyong Hebreo, ang natural na paglalarawan sa Filipino ng ritwal na pagsusunog ay “sa ibabaw ng altar.”
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: gaya ng taba ng handog para sa kapayapaan
  rationale: Ikinukumpara nito ang pamamaraan sa taba ng handog na שְׁלָמִים. Ang “handog para sa kapayapaan” ay madaling maunawaan at pinananatili ang tradisyonal na ugnayan ng termino sa kapayapaan, habang inilalagay sa talababa ang iba pang posibleng diwa.
- source_word: וְכִפֶּר עָלָיו
  choice: gagawa ang pari ng pagtubos para sa kanya
  rationale: Pinananatili ng “gagawa ng pagtubos” ang panritwal na diwa ng כפר nang hindi ipinapasok ang isang makitid na teorya tungkol sa paraan ng pagtubos.
- source_word: מֵחַטָּאתוֹ
  choice: dahil sa kanyang kasalanan
  rationale: Maaaring mangahulugan ang חַטָּאת ng “kasalanan” o “handog para sa kasalanan,” ngunit dito, kasunod ng pagtubos para sa tao at bago ng pagpapatawad, mas malamang na ang pagkakasala mismo ang tinutukoy.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Natural sa Filipino ang personal na pasibong diwang “patatawarin siya.” Hindi tahasang pinapangalanan ang gumagawa ng pagpapatawad, kaya napapanatili ang di-tahasang banal na tagaganap ng Hebreo.
theological_decisions:
- issue: Kahulugan ng שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa pakikipag-ugnayan; handog para sa kagalingan
  rationale: Saklaw ng salitang Hebreo ang mga diwa ng kapayapaan, kabuuan o kagalingan, at pakikipag-ugnayan. Ginamit sa pangunahing teksto ang pamilyar at malinaw na “handog para sa kapayapaan,” ngunit pinanatili sa talababa ang tunay na lawak ng kahulugan.
- issue: Kahulugan ng חַטָּאת sa מֵחַטָּאתוֹ
  choice: kanyang kasalanan
  alternative: kanyang handog para sa kasalanan
  rationale: Ginagamit sa Levitico ang חַטָּאת kapuwa para sa kasalanan at sa handog para rito. Gayunman, ang pagtubos para sa tao at ang kasunod na pagpapatawad ay higit na sumusuporta sa kahulugang “kasalanan,” nang hindi ganap na ikinukubli ang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panritwal na “altar,” “handog,” “pari,” at “pagtubos.” Iniwasan ang sobrang teknikal na pananalita at pinanatili ang mga tunay na alternatibong kahulugan sa mga talababa.
