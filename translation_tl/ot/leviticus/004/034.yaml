  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: tl
  text: Pagkatapos, kukuha ang pari ng kaunting dugo ng handog para sa kasalanan[a] sa pamamagitan ng kaniyang daliri at ilalagay niya iyon sa mga sungay ng altar ng handog na sinusunog. Ibubuhos niya ang lahat ng dugo nito sa paanan ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo ay maaaring tumukoy sa handog na iniaalay kaugnay ng kasalanan at ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Pagkatapos, kukuha
  rationale: Ipinahahayag ng waw + qatal ang kasunod na hakbang sa ritwal; natural sa makabagong Tagalog ang “Pagkatapos, kukuha” at napapanatili nito ang instruksiyonal na diwa.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tuwirang katumbas ng tiyak na pangngalang tumutukoy sa paring nangangasiwa sa ritwal.
- source_word: מִדַּם
  choice: ng kaunting dugo
  rationale: 'Partitibo ang gamit ng מִן: isang bahagi lamang ng dugo ang kukunin at ipapahid bago ibuhos ang dugo sa paanan ng altar.'
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang חַטָּאת sa handog na may kaugnayan sa kasalanan at paglilinis, hindi sa abstraktong kasalanan lamang. Malinaw at pamilyar sa Tagalog ang piniling parirala.
- source_word: בְּאֶצְבָּעוֹ
  choice: sa pamamagitan ng kaniyang daliri
  rationale: Instrumental ang בְּ; ginagamit ng pari ang kaniyang daliri sa paglalagay ng dugo.
- source_word: וְנָתַן
  choice: at ilalagay niya iyon
  rationale: Ang נתן ay may malawak na diwang “magbigay/maglagay.” Ang “ilalagay” ay natural sa ritwal na konteksto, at ang “iyon” ay tumutukoy sa dugong kinuha.
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: sa mga sungay ng altar ng handog na sinusunog
  rationale: Pinananatili ang konkretong larawang “mga sungay,” ang nakausling bahagi ng altar, at kinikilala ang altar ayon sa handog na sinusunog.
- source_word: וְאֶת כָּל דָּמָהּ
  choice: ang lahat ng dugo nito
  rationale: Pinananatili ang kabuuang pahayag ng כָּל. Bagaman ipinahihiwatig ng pagkakasunod-sunod na ito ang natitirang dugo, hindi iyon tahasang sinasabi ng Hebreo.
- source_word: יִשְׁפֹּךְ
  choice: Ibubuhos niya
  rationale: Naghahayag ng sinasadya at ritwal na pagbuhos, hindi aksidenteng pagtapon.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: sa paanan ng altar
  rationale: Ang יְסוֹד ay “pundasyon/base.” Ang “paanan ng altar” ay malinaw, natural, at angkop sa lokasyon ng pagbuhos.
theological_decisions:
- issue: Pagbibigay-kahulugan sa חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Tiyak sa konteksto na handog ang tinutukoy, ngunit maaaring idiin ng termino ang kaugnayan nito sa kasalanan o ang ritwal na paglilinis. Ginamit sa pangunahing teksto ang mas madaling makilala na “handog para sa kasalanan,” habang iniingatan sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari,” “altar,” at “handog na sinusunog” bilang mga terminong madaling maunawaan sa karaniwang gamit, habang pinananatili ang ritwal na detalye at ang tunay na saklaw ng Hebreo.
