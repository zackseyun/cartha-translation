  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: tl
  text: at ang dalawang bato, ang taba sa ibabaw ng mga iyon na nasa may balakang, at ang nakausling bahagi sa atay[a]—aalisin niya ito kasama ng mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lóbulo ng atay.” Hindi tiyak ang eksaktong bahaging anatomikal na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: ang dalawang bato
  rationale: Tuwirang tumutukoy sa dalawang kidney ng hayop; sa kontekstong anatomikal, malinaw sa Filipino na ang “bato” ay organo.
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Sa mga tagubilin tungkol sa handog, tumutukoy ito sa matatabang bahaging inilalaan para sa paghahandog. Karaniwan at madaling maunawaan ang “taba.”
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: sa ibabaw ng mga iyon
  rationale: Pinananatili ang kaugnayan ng taba sa dalawang bato at ang diwa ng Hebreong pang-ukol.
- source_word: הַכְּסָלִים
  choice: nasa may balakang
  rationale: Ang salita ay tumutukoy sa bahagi ng tagiliran o balakang sa paligid ng mga bato. Ang “nasa may balakang” ay natural at sapat na tiyak sa modernong Filipino.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: ang nakausling bahagi sa atay
  rationale: Hindi ganap na tiyak ang eksaktong anatomikal na tinutukoy ng יוֹתֶרֶת. Ang “nakausling bahagi” ay maingat at hindi nagpapanggap na higit na tiyak kaysa sa ebidensiyang Hebreo; pinananatili rin ng “sa atay” ang pang-ukol na עַל.
- source_word: עַל הַכְּלָיוֹת
  choice: kasama ng mga bato
  rationale: Sa paulit-ulit na pormulang panghandog, ipinahihiwatig ng parirala na ang bahaging nasa atay ay aalisin kasabay ng mga bato. Mas malinaw ito sa Filipino kaysa sa literal na “sa ibabaw ng mga bato.”
- source_word: יְסִירֶנָּה
  choice: aalisin niya ito
  rationale: Pinananatili ang estilong nag-uutos sa pamamaraang rituwal at ang pambabaeng isahang hulapi na tumutukoy sa nakausling bahagi bilang tuwirang layon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Pinanatili ang konkretong wikang anatomikal at ang pag-uulit ng “mga bato” sa hulihan dahil bahagi ito ng Hebreong pormula. Inilagay ang tandang-talababa sa “nakausling bahagi sa atay,” ang mismong salitang may leksikal na kawalang-katiyakan.
