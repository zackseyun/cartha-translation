base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: tl
  text: Ipapatong ng mga nakatatanda ng kapulungan ang kanilang mga kamay sa ulo ng toro sa harap ni Yahweh; at kakatayin niya[a] ang toro sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nagbabago rito ang Hebreo mula sa maramihang “mga nakatatanda” tungo sa pandiwang isahan, ngunit hindi tinutukoy kung sino ang magkakatay. Maaari ring isalin: “at kakatayin ang toro sa harap ni Yahweh.”'
    reason: Ipinapaliwanag ang paglipat mula sa maramihang paksa patungo sa isahang pandiwa at pinananatili ang di-tiyak na tagaganap.
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: Ipapatong
  rationale: Sa konteksto ng paghahandog, tumutukoy ang סמך sa rituwal na pagpapatong o pagdidiin ng mga kamay sa handog. Ang “ipapatong” ay likas at malinaw sa modernong Filipino.
- source_word: זִקְנֵי הָעֵדָה
  choice: mga matatandang pinuno ng kapulungan
  rationale: Ang זִקְנֵי ay mga elder o kinikilalang matatandang pinuno, at ang עֵדָה ay ang nagkakatipong sambayanan. Nililinaw ng “matatandang pinuno” ang tungkulin, hindi lamang ang edad.
- source_word: אֶת יְדֵיהֶם
  choice: ang kanilang mga kamay
  rationale: Pinananatili ang maramihang anyo ng pangngalan at ng hulaping tumutukoy sa mga matatandang pinuno.
- source_word: עַל רֹאשׁ הַפָּר
  choice: sa ulo ng toro
  rationale: Tuwirang inilalarawan ang lokasyon ng rituwal na pagpapatong; ang פַּר ay ang toro na inihahandog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay “sa harap” o “sa presensya.” Ang “sa harap ni Yahweh” ay tumpak at likas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְשָׁחַט
  choice: at papatayin niya
  rationale: Ang pandiwa ay ikatlong panauhang panlalaking isahan, bagaman maramihan ang naunang paksa. Pinananatili ng “niya” ang paglipat sa isahan at hindi tinutukoy kung sino ang taong iyon.
- source_word: הַפָּר
  choice: ang toro
  rationale: Ang “toro” ang payak at sapat na katumbas ng פַּר; hindi idinaragdag ang usapin ng edad na hindi kailangang idiin sa talatang ito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang hayagang nasa tekstong Hebreo. Pinananatili ang “Yahweh” upang hindi ito palitan ng titulong “PANGINOON.”
- issue: Paglipat mula sa maramihang paksa tungo sa isahang pandiwa
  choice: papanatilihin ang isahan sa “papatayin niya”
  alternative: “papatayin nila” o ang di-tahasang “papatayin ang toro”
  rationale: Maramihan ang “mga matatandang pinuno,” ngunit isahan ang Hebreong וְשָׁחַט. Hindi kinikinis ang pagbabagong ito upang manatiling bukas kung isang kinatawan ang gagawa ng pagkatay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kapulungan” para sa pormal na sambayanang nagkakatipon at ang “matatandang pinuno” upang malinaw na tungkulin ang tinutukoy. Pinanatili ang singularidad at di-tiyak na pagkakakilanlan ng gumagawa sa ikalawang sugnay.
