  to: Ipapatong ng mga nakatatanda ng kapulungan ang kanilang mga kamay sa ulo ng toro sa harap ni Yahweh; at kakatayin niya[a] ang toro sa harap ni Yahweh.
  rationale: Pinalitan ang pangkalahatang “papatayin” ng “kakatayin” upang maipakita ang sakripisyal na kahulugan ng שָׁחַט. Pinalitan ang “mga matatandang pinuno” ng “mga nakatatanda” upang iwasang magdagdag ng tahasang ideya ng pamumuno na wala sa mismong salita, habang pinananatili ang pormal at malinaw na rehistro. Ang “niya” at ang talababa ay magkasamang nagpapanatili sa isahang anyo at sa hindi tinukoy na tagaganap ng Hebreo.
