source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: tl
  text: At kung ang isa sa karaniwang mamamayan[a] ay magkasala nang di-sinasadya sa paggawa ng isa sa mga bagay na iniutos ni Yahweh na huwag gawin, at maging may-sala,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa sa mga tao ng lupain.” Dito, tumutukoy ang parirala sa isang karaniwang miyembro ng sambayanan, na ipinaiiba sa pari o pinuno sa mga nakapaligid na batas.
    reason: lexical_alternative
  - marker: b
    text: O “at magkaroon ng pananagutan” o “at siya ay may-sala.” Maaaring ipahayag ng pandiwang Hebreo ang pagpasok sa kalagayan ng pagkakasala o ang pagdadala ng pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: isang tao
  rationale: Sa legal na kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa isang indibidwal, hindi lamang sa di-materyal na “kaluluwa.” Natural at tiyak sa modernong Tagalog ang “isang tao.”
- source_word: תֶּחֱטָא
  choice: magkasala
  rationale: Ito ang tuwiran at karaniwang katumbas ng pandiwang חטא at angkop sa legal at panrelihiyong konteksto.
- source_word: בִשְׁגָגָה
  choice: nang di-sinasadya
  rationale: Ipinahihiwatig ng salita ang pagkakasalang hindi sinadya o nagawa dahil sa kamalian; pinananatili ng salin ang legal na pagkakaibang ito.
- source_word: מֵעַם הָאָרֶץ
  choice: mula sa karaniwang mamamayan
  rationale: Sa nakapaligid na mga batas, tumutukoy ito sa isang pangkaraniwang miyembro ng bayan, na ipinaiiba sa pari, buong kapulungan, o pinuno. Nililinaw ito ng salin habang inilalagay sa talababa ang mas literal na anyo.
- source_word: בַּעֲשֹׂתָהּ
  choice: sa paggawa
  rationale: Ang pang-ukol na ב na kalakip ng infinitive ay nagsasaad ng paraan o kalagayan; natural itong naipapahayag bilang “sa paggawa.”
- source_word: אַחַת מִמִּצְוֺת יְהוָה
  choice: isa sa mga utos ni Yahweh
  rationale: Pinananatili nito ang partitive na diwa—isang utos mula sa kabuuan ng mga utos—at ang personal na pangalan ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: na hindi dapat gawin
  rationale: Malinaw nitong ipinapahayag ang pasibong anyo at ang normatibong diwa ng pagbabawal.
- source_word: וְאָשֵׁם
  choice: at maging may-sala
  rationale: Naipapakita nito ang pagpasok sa kalagayan ng pananagutan pagkatapos ng ipinagbabawal na gawa, nang hindi higit na nilulutas ang saklaw ng pandiwa.
theological_decisions:
- issue: Kahulugan ng מֵעַם הָאָרֶץ sa batas tungkol sa handog dahil sa kasalanan
  choice: mula sa karaniwang mamamayan
  alternative: mula sa mga tao ng lupain
  rationale: Sa konteksto, isa itong kategoryang legal at panlipunan para sa ordinaryong miyembro ng bayan, salungat sa mga naunang kategorya ng pari, kapulungan, at pinuno. Iniiwasan ng pangunahing salin ang posibleng maling pagkaunawa sa literal na parirala, ngunit pinananatili iyon sa talababa.
- issue: Diwa ng וְאָשֵׁם
  choice: at maging may-sala
  alternative: at magkaroon ng pananagutan / at siya ay may-sala
  rationale: Pinananatili ng “maging may-sala” ang posibleng resultang kalagayan ng pagkakasala, samantalang kinikilala sa talababa na maaari rin itong tumukoy sa pagkakaroon o pagdadala ng pananagutan.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at legal na himig. Pinanatili ang kondisyonal na daloy at pangwakas na kuwit sapagkat nagpapatuloy ang pangungusap sa kasunod na talata. Ginamit ang “di-sinasadya” bilang malinaw ngunit hindi kolokyal na paglalarawan ng di-sinasadyang pagkakasala.
