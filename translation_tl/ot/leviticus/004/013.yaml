  source_fidelity: Tumpak na naisasalin ng draft ang kolektibong sakop ng עֲדַת יִשְׂרָאֵל, ang di-sinasadyang katangian ng שׁגה, ang idiomang bagay na nalingid sa kaalaman ng kapulungan, ang ipinagbabawal na gawa, at ang resultang pagkakasala/pananagutan. Gayunman, ang “magawa nila” ay hindi angkop sa aktibong pandiwang וְעָשׂוּ at lumilikha ng alanganing sintaks sa kondisyunal na pangungusap.
  naturalness: Natural ang karamihan ng register at ang pagkakaiba ng “sambayanan” at “kapulungan.” Mas natural at mas tuwirang Tagalog ang “gumawa sila ng isa sa mga bagay na ipinag-utos ni Yahweh na huwag gawin” kaysa “magawa nila ang isa sa mga bagay na ayon sa mga utos ni Yahweh ay hindi dapat gawin.”
  terminology: Ang “sambayanan,” “kapulungan,” “Yahweh,” at “may sala” ay angkop sa modernong Filipino Tagalog at sa legal-kultikong rehistro. Nananatiling wasto ang mga talababa at ang kanilang mga pananda.
