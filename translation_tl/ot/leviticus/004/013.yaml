id: LEV.4.13
reference: Leviticus 4:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: tl
  text: Kung ang buong sambayanan ng Israel[a] ay magkasala nang hindi sinasadya[b], at ang bagay na iyon ay nalingid sa paningin ng kapulungan[c], at gumawa sila ng isa sa mga bagay na ipinag-utos ni Yahweh na huwag gawin, sila ay magiging may sala[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buong kapulungan ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay tumutukoy sa pagkakasalang nagawa dahil sa pagkakamali o nang hindi sinasadya, hindi sa hayagang pagsuway.
    reason: cultural_note
  - marker: c
    text: Sa literal, “nalingid sa mga mata ng kapulungan”; ibig sabihin, hindi ito napansin o nalaman ng komunidad.
    reason: lexical_alternative
  - marker: d
    text: O “magkakaroon sila ng pananagutan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: sambayanan ng Israel
  rationale: Ang עֵדָה ay tumutukoy sa buong komunidad ng Israel. Ang “sambayanan” ay natural at marangal sa modernong Filipino at naihihiwalay sa הַקָּהָל, na isinaling “kapulungan.”
- source_word: יִשְׁגּוּ
  choice: magkasala nang hindi sinasadya
  rationale: Sa batas hinggil sa handog sa Levitico 4, ang שׁגה ay tumutukoy sa pagkakasalang bunga ng pagkakamali o kawalan ng kaalaman, hindi sa sinasadyang paghihimagsik.
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: ang bagay na iyon ay nalingid sa paningin ng kapulungan
  rationale: Pinananatili nito ang pasibong anyo at ang Hebreong larawang “nalingid sa paningin,” habang malinaw pa ring ipinahihiwatig na hindi napansin ng kapulungan ang nangyari.
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: magawa nila ang isa sa mga bagay na ayon sa mga utos ni Yahweh ay hindi dapat gawin
  rationale: Ipinapahayag nito ang paggawa ng isa sa kategorya ng mga ipinagbabawal na gawain, nang hindi ginagawang utos na gawin ang ipinagbabawal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang ipinahahayag ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְאָשֵׁמוּ
  choice: sila ay magiging may sala
  rationale: Ipinakikita ng pandiwa ang kalagayang nagiging may sala o may pananagutan bilang bunga ng nagawang paglabag; hindi nito ipinapasok ang ideya ng kaparusahan o pagtubos.
theological_decisions:
- issue: Uri ng kasalanang tinutukoy ng שׁגה
  choice: kasalanang hindi sinasadya
  alternative: pagkakamali; pagkaligaw
  rationale: Sa konteksto ng Levitico 4, ang handog ay para sa di-sinasadyang paglabag. Nililinaw ito sa salin nang hindi ito itinuturing na sinadyang pagsuway.
- issue: Paglalarawan sa bunga ng paglabag sa וְאָשֵׁמוּ
  choice: magiging may sala
  alternative: mananagot; magkakaroon ng pananagutan
  rationale: Ang “magiging may sala” ay pinakamalapit sa resultang kalagayan ng pandiwa at hindi agad nagpapahiwatig ng hatol o parusa.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatili ang banal na pangalan bilang pangalan, hindi bilang titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sambayanan” at “kapulungan” upang mapanatili ang bahagyang pagkakaiba ng עֵדָה at קָהָל. Ang “nalingid sa paningin” ay sadyang nagpapanatili sa Hebreong larawan, na nililinaw sa talababa.
