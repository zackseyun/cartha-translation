    rationale: Maaaring pansamantalang magmukhang ang mga utos mismo ang hindi dapat gawin. Ang pagbubuo bilang “mga bagay na ipinag-utos ... na huwag gawin” ay malinaw na itinatali ang pagbabawal sa mga gawa.
