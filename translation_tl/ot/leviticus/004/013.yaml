revisions:
- from: Kung ang buong sambayanan ng Israel[a] ay magkasala nang hindi sinasadya[b], at ang bagay na iyon ay nalingid sa paningin ng kapulungan[c], at magawa nila ang isa sa mga bagay na ayon sa mga utos ni Yahweh ay hindi dapat gawin, sila ay magiging may sala[d].
  to: Kung ang buong sambayanan ng Israel[a] ay magkasala nang hindi sinasadya[b], at ang bagay na iyon ay nalingid sa paningin ng kapulungan[c], at gumawa sila ng isa sa mga bagay na ipinag-utos ni Yahweh na huwag gawin, sila ay magiging may sala[d].
  rationale: Inayos ang aktibong pandiwa at ang ugnayan ng ipinagbabawal na gawa sa utos ni Yahweh. Pinananatili ng rebisyon ang saklaw, di-sinasadyang katangian, Hebreong larawan sa “nalingid sa paningin,” banal na pangalan, at resultang legal na pagkakasala ng pinagmulan.
