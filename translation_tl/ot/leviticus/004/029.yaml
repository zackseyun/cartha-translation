  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: tl
  text: Ipapatong niya ang kanyang kamay sa ulo ng handog para sa kasalanan[a] at kakatayin iyon sa lugar na pinagkakatayan ng handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang salitang Hebreo na חטאת ay maaaring tumukoy sa handog na kaugnay ng kasalanan at paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: Ipapatong niya
  rationale: Sa kontekstong pansakripisyo, ang סמך ay tumutukoy sa paglalagay o pagdidiin ng kamay sa hayop. Ang “ipapatong” ay natural sa makabagong Filipino at malinaw na naghahayag ng itinakdang ritwal na kilos.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Isahan ang anyong Hebreo at may hulaping ikatlong panauhang panlalaki; kaya pinanatili ang “kamay,” hindi “mga kamay.”
- source_word: עַל רֹאשׁ
  choice: sa ulo ng
  rationale: Direkta at natural na katumbas ng pariralang Hebreo, habang pinananatili ang tiyak na bahagi ng hayop na pinapatungan ng kamay.
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Dito, ang חטאת ay teknikal na tawag sa handog na kaugnay ng kasalanan. Ang “handog para sa kasalanan” ay malinaw at pamilyar, samantalang inilalagay sa talababa ang posibleng pagbasa na nagbibigay-diin sa paglilinis.
- source_word: וְשָׁחַט
  choice: at kakatayin iyon
  rationale: Ang שחט ay teknikal na pandiwa para sa ritwal na pagkatay. Ang “kakatayin” ay natural at tiyak sa Filipino; ang “iyon” ay tumutukoy sa hayop na inihahandog at umiiwas sa mabigat na pag-uulit.
- source_word: בִּמְקוֹם
  choice: sa lugar na pinapatayan ng
  rationale: Ipinahihiwatig ng parirala ang itinakdang lugar ng pagkatay. Mas natural sa Filipino ang relasyonal na anyong “sa lugar na pinapatayan ng” kaysa sa literal ngunit malabong “sa lugar ng.”
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Ang עֹלָה ay takdang katawagang pansakripisyo para sa handog na lubusang sinusunog. Ang saling ito ay malinaw sa karaniwang mambabasa at hindi ipinapasok sa pangunahing teksto ang etimolohikal na ideya ng pag-akyat.
theological_decisions:
- issue: Pagpapakahulugan sa חטאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang agarang konteksto ay tungkol sa isang partikular na hayop na inihahandog at kinakatay. Pinananatili ng pangunahing salin ang malinaw at nakaugaliang kaugnayan nito sa kasalanan, habang kinikilala sa talababa na maaari ring idiin ng terminong Hebreo ang tungkulin nitong maglinis o magdalisay.
- issue: Pandiwang Hebreo na wayyiqtol sa kontekstong legal at panritwal
  choice: Ipapatong niya ... at kakatayin
  alternative: Ipinatong niya ... at kinatay
  rationale: Bagaman maaaring magmukhang pasalaysay ang anyong Hebreo, bahagi ito ng sunod-sunod na tagubiling panritwal. Ang aspektong kontemplatibo sa Filipino ay natural na naghahayag ng itinakdang susunod na kilos nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong pansakripisyo nang hindi labis na teknikal. Pinanatili ang isahang “kamay,” ang sunod-sunod na utos sa ritwal, at ang leksikal na kalabuan ng חטאת sa pamamagitan ng talababa.
