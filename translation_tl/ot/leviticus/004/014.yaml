  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: tl
  text: Kapag nalaman ang kasalanang nagawa nila[a], maghahandog ang kapulungan ng isang toro mula sa kawan ng mga baka bilang handog para sa kasalanan, at dadalhin nila ito sa harap ng tolda ng tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang salitang Hebreo na חַטָּאת (ḥaṭṭā’t) ay dalawang beses ginamit sa talatang ito: una, sa kahulugang “kasalanan,” at pagkatapos, sa kahulugang “handog para sa kasalanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: at malaman
  rationale: Ipinapahayag ng Niphal ng ידע na ang kasalanan ay nalaman o napag-alaman, nang hindi tinutukoy kung sino ang nakatuklas nito.
- source_word: הַחַטָּאת
  choice: ang kasalanan
  rationale: Dahil sinusundan ito ng pariralang ‘nagawa nila,’ ang tinutukoy rito ay ang kasalanan, hindi ang handog.
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: nagawa nila
  rationale: Natural sa modernong Tagalog ang ‘kasalanang nagawa nila’ at malinaw nitong tinutukoy ang partikular na pagkakasala.
- source_word: הַקָּהָל
  choice: ang kapulungan
  rationale: Ang ‘kapulungan’ ay angkop sa legal at panrelihiyong konteksto at pinananatili ang kolektibong diwa ng קהל.
- source_word: וְהִקְרִיבוּ
  choice: maghahandog
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay nangangahulugang iharap o ihandog; ‘maghahandog’ ang pinakanatural at malinaw sa Tagalog.
- source_word: פַּר בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Naipapahayag nito sa natural na Tagalog ang toro bilang hayop mula sa kawan ng baka, nang hindi pilit na isinasalin ang idyomang ‘anak ng bakahan.’
- source_word: לְחַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Dito ang חטאת ay tumutukoy sa uri at layunin ng handog, hindi sa mismong kasalanan.
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: at dadalhin iyon
  rationale: Ang panghalip ay tumutukoy sa toro; ang ‘iyon’ ay malinaw at natural sa pagkakasunod ng pangungusap.
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: sa harap ng toldang tipanan
  rationale: Ang ‘sa harap ng’ ay tumpak para sa לִפְנֵי, at ang ‘toldang tipanan’ ay isang malinaw at dignified na salin ng אֹהֶל מוֹעֵד sa kontekstong ito.
theological_decisions:
- issue: Dalawang gamit ng חטאת sa iisang talata
  choice: Isinalin ang una bilang ‘kasalanan’ at ang ikalawa bilang ‘handog para sa kasalanan.’
  alternative: Maaaring tawaging ‘handog na pambayad-sala’ o ‘handog na pandalisay’ ang ikalawang gamit.
  rationale: 'Hinihingi ng konteksto ang magkaibang kahulugan: ang una ay ang nagawang pagkakasala, samantalang ang ikalawa ay ang itinakdang handog. Hindi ipinapasok ng salin ang isang mas tiyak na teolohikal na paliwanag kaysa sa sinasabi ng talata.'
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: toldang tipanan
  alternative: tolda ng pagpupulong
  rationale: Maaaring ipahiwatig ng מוֹעֵד ang itinakdang pakikipagtagpo o pagpupulong. Pinili ang pamilyar na ‘toldang tipanan,’ ngunit hindi nito nilulutas ang lahat ng saklaw ng terminong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang legal at panritwal na himig nang hindi gumagamit ng labis na teknikal o denominasyonal na pananalita.
