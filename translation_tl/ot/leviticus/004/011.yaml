  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: tl
  text: Ngunit ang balat ng toro, ang buong laman nito, pati ang ulo at mga paa nito, ang mga laman-loob nito, at ang dumi nito—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹר
  choice: balat
  rationale: Ang “balat” ang natural at tumpak na tawag sa panlabas na balot ng kinatay na hayop sa Filipino; hindi kailangang gumamit ng mas teknikal na salita.
- source_word: הַפָּר
  choice: ang toro
  rationale: Karaniwang tumutukoy ang פַּר sa toro o batang toro. Sapat at natural dito ang “toro,” yamang hindi binibigyang-diin sa talata ang edad.
- source_word: כָּל בְּשָׂרוֹ
  choice: ang buong laman nito
  rationale: Pinananatili ng “buong laman” ang kongkretong diwa ng בָּשָׂר at mas angkop sa kontekstong panghandog kaysa sa “karne” o sa mas malawak na “katawan.”
- source_word: עַל רֹאשׁוֹ
  choice: pati ang ulo
  rationale: Sa hanay na ito, ang עַל ay nagpapahiwatig ng pagsasama ng ulo sa mga bahaging tinutukoy; natural itong naipapahayag ng “pati” sa Filipino.
- source_word: וְעַל כְּרָעָיו
  choice: at mga paa nito
  rationale: Ang כְּרָעַיִם ay tumutukoy sa mga paa o ibabang bahagi ng mga biyas ng hayop. Ang “mga paa” ay malinaw at pangkaraniwan sa modernong Filipino.
- source_word: וְקִרְבּוֹ
  choice: ang mga laman-loob nito
  rationale: Sa kontekstong anatomikal at panghandog, malinaw na ipinapahayag ng “mga laman-loob” ang קֶרֶב bilang mga bahaging nasa loob ng katawan.
- source_word: וּפִרְשׁוֹ
  choice: at ang dumi nito
  rationale: Tiyak na tumutukoy ang פֶּרֶשׁ sa dumi o tae ng hayop. Ang “dumi” ay tuwiran ngunit marangal at angkop sa saling biblikal.
