    rationale: Ang “mabuting” ay hindi tuwirang ipinahahayag ng termino, at ang “pakikipag-ugnayan” ay mas malawak kaysa sa leksikal na alternatibong “fellowship.”
  - severity: low
    issue: Hindi gaanong idiomatiko ang “amoy na kalugod-lugod.”
    rationale: Ang “samyong kalugod-lugod” ay mas natural na Filipino habang pinananatili ang metapora ng nakapirming pormulang Hebreo.
