  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: tl
  text: Aalisin niya ang lahat ng taba nito, gaya ng pag-alis ng taba mula sa hain pangkapayapaan[a]. Susunugin ito ng pari sa altar bilang samyong kalugod-lugod kay Yahweh[b]. Magbabayad-sala ang pari para sa kanya, at patatawarin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hain ng mga handog para sa pakikipagkaisa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “samyong kalugod-lugod” ay isang nakaugaliang pormulang pansakripisyo para sa handog na tinatanggap ni Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: taba nito / taba
  rationale: Tumutukoy ito sa tabang inaalis at sinusunog bilang bahagi ng paghahandog. Ang payak na “taba” ay tapat sa Hebreo at hindi nagdaragdag ng espesipikong “mga bahaging taba.”
- source_word: יָסִיר
  choice: aalisin niya
  rationale: Ipinapahayag ng anyong Hiphil ang pagpapalis o pag-aalis. Ang anyong panghinaharap sa Filipino ay likas na naghahatid ng tuntuning dapat isagawa sa kontekstong legal.
- source_word: כַּאֲשֶׁר הוּסַר
  choice: gaya ng pag-aalis
  rationale: Inihahambing nito ang kilos sa nakatakdang paraan ng pag-aalis ng taba sa handog pangkapayapaan, nang hindi ipinipilit kung nakaraan o pangkalahatang pamamaraan ang pokus.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: haing handog pangkapayapaan
  rationale: Pinananatili ang kinikilalang kategoryang pansakripisyo ng שְׁלָמִים. Ang “haing handog” ay naghahatid sa diwa ng זֶבַח bilang hayop na inihahain.
- source_word: וְהִקְטִיר
  choice: susunugin iyon
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang pandiwa sa pagsunog sa altar. Ang “iyon” ay malinaw na bumabalik sa tabang inalis.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ito ang natural at karaniwang salin sa modernong Filipino para sa lokasyon ng pagsunog.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang amoy na kalugod-lugod
  rationale: Pinananatili ang konkretong metapora at ang pormulang pansakripisyo na nagpapahiwatig ng pagtanggap ng Diyos, nang hindi iyon ginagawang tahasang paliwanag sa pangunahing teksto.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng tetragrammaton sa tekstong Hebreo; ang “kay” ay natural sa pariralang tumutukoy kung kanino kalugod-lugod ang handog.
- source_word: וְכִפֶּר עָלָיו
  choice: magbabayad-sala ang pari para sa kanya
  rationale: Pinananatili ang kinikilalang wikang pansakripisyo ng כפר at ang pagkilos ng pari para sa nagkasala, nang hindi ipinapaliwanag ang mekanismong teolohikal nito.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: 'Likas na Filipino ito para sa pasibong resulta ng Hebreo: tatanggap ng kapatawaran ang tao.'
theological_decisions:
- issue: Ugnayan ng pagbabayad-sala ng pari at kapatawaran
  choice: Magbabayad-sala ang pari para sa kanya, at patatawarin siya.
  alternative: Gagawa ang pari ng pagtubos-sala para sa kanya, at ipagkakaloob sa kanya ang kapatawaran.
  rationale: Direktang pinananatili ng salin ang pagkakasunod sa Hebreo—pagbabayad-sala ng pari at kasunod na kapatawaran—nang magdagdag ng paliwanag tungkol sa mas malawak na mekanismong doktrinal.
- issue: Kahulugan ng רֵיחַ נִיחֹחַ
  choice: amoy na kalugod-lugod kay Yahweh
  alternative: handog na katanggap-tanggap kay Yahweh
  rationale: Pinananatili ang metapora ng orihinal at hindi ito tahasang pinapalitan ng interpretasyong “katanggap-tanggap,” bagaman ipinapaliwanag ang pormula sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal ang himig. Pinanatili ang bokabularyong pansakripisyo gaya ng “altar,” “handog pangkapayapaan,” at “magbabayad-sala,” habang iniwasan ang akademiko o makasektang pagpapaliwanag. Ang mga pangungusap ay bahagyang hinati upang maging natural at madaling sundan sa Filipino.
