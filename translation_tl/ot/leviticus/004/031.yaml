  naturalness: Kailangan ng banayad na pag-aayos para maging mas likas sa modernong Filipino. Mas natural ang “gaya ng pag-alis” at “hain pangkapayapaan.” Ang “samyong kalugod-lugod” ay mas angkop na pampanitikan at pansakripisyong pormula kaysa “amoy na kalugod-lugod.”
  terminology: Pinanatili ang “altar,” “hain pangkapayapaan,” at “magbabayad-sala,” na angkop sa marangal ngunit modernong rehistro. Ang talababa para sa alternatibong salin ay inayos upang hindi magdagdag ng kahulugang wala sa terminong Hebreo.
