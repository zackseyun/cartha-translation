base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: tl
  text: Dadalhin niya ang toro sa labas ng kampo at susunugin niya ito[a], gaya ng pagsunog niya sa unang toro. Ito ang handog para sa kasalanan ng kapulungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Maaaring bigyang-diin ng salitang Hebreo ang papel ng handog sa pag-aalis ng karumihan, gayundin sa pagtugon sa kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Ilalabas niya
  rationale: Ang Hiphil ng יצא ay nangangahulugang maglabas o magdala palabas; natural at tuwiran sa Filipino ang “ilalabas niya.”
- source_word: הַפָּר
  choice: ang toro
  rationale: Ang פַּר ay toro o batang toro; sapat na tiyak at natural ang “toro” sa kontekstong panghandog.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Ipinahihiwatig ng pariralang Hebreo ang pagdadala tungo sa lugar na lampas sa hangganan ng kampo; idiomatiko sa Filipino ang “sa labas ng kampo.”
- source_word: וְשָׂרַף אֹתוֹ
  choice: at susunugin iyon
  rationale: Karaniwang pandiwa para sa pagsunog ang שׂרף. Ang “iyon” ay malinaw na tumutukoy sa toro at mas angkop kaysa “ito” dahil inilalabas ang hayop.
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: gaya ng pagsunog niya
  rationale: Nagpapahayag ang כַּאֲשֶׁר ng paghahambing; natural na ipinapakita ng pariralang ito ang pagkakatulad ng pamamaraan.
- source_word: הַפָּר הָרִאשׁוֹן
  choice: sa unang toro
  rationale: Tumutukoy ang רִאשׁוֹן sa torong naunang inilarawan; pinananatili ng “unang toro” ang tuwirang anyo ng Hebreo.
- source_word: חַטַּאת
  choice: handog para sa kasalanan
  rationale: Sa batas tungkol sa paghahandog, tumutukoy ang חַטָּאת sa handog na may kaugnayan sa kasalanan at maaari ring bigyang-diin ang paglilinis. Malinaw at pamilyar sa karaniwang mambabasa ang “handog para sa kasalanan.”
- source_word: הַקָּהָל
  choice: ng kapulungan
  rationale: Ang קָהָל ay ang nagkakatipong sambayanan. Ang “kapulungan” ay marangal, malinaw, at nagpapanatili sa kolektibong diwa nang hindi naglalagay ng makabagong denominasyonal na kahulugan.
- source_word: הוּא
  choice: Iyon ang
  rationale: Ginagamit ang panghalip bilang panaguri upang kilalanin ang toro bilang handog ng kapulungan; natural sa Filipino ang “Iyon ang.”
theological_decisions:
- issue: Pagpapakahulugan sa חַטַּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang termino ay maaaring tumukoy sa kasalanan o sa handog na tumutugon dito, samantalang binibigyang-diin ng ilang pag-aaral ang tungkulin nitong maglinis. Dahil ang tinutukoy rito ay ang inihahandog na toro, malinaw sa pangkalahatang mambabasa ang “handog para sa kasalanan,” habang inilalahad sa talababa ang tunay na alternatibong leksikal.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “kapulungan” para sa kolektibong sambayanan at iniwasan ang katawagang maaaring magpahiwatig ng tiyak na denominasyon. Ang ayos ng mga kilos at ang maikling pangwakas na pagkakakilanlan ay sumusunod sa diin ng Hebreo.
