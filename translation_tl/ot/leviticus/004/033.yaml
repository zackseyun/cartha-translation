  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: tl
  text: Ipapatong niya ang kanyang kamay sa ulo ng handog para sa kasalanan, at kakatayin niya ito bilang handog para sa kasalanan sa lugar kung saan kinakatay ang handog na sinusunog.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis” sa dalawang paglitaw ng “handog para sa kasalanan.” Ang salitang Hebreo ay maaaring tumukoy sa handog na may kaugnayan sa kasalanan at ritwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ
  choice: Ipapatong niya ang kanyang kamay
  rationale: Ang סמך sa konteksto ng paghahandog ay tumutukoy sa ritwal na paglalagay o pagdiin ng kamay sa hayop. Pinananatili rin ang isahang יָדוֹ, “kanyang kamay.”
- source_word: עַל רֹאשׁ
  choice: sa ulo
  rationale: Likas at tuwirang salin ng pariralang Hebreo sa modernong Filipino.
- source_word: הַחַטָּאת / לְחַטָּאת
  choice: handog para sa kasalanan / bilang handog para sa kasalanan
  rationale: Sa mga kautusan sa paghahandog, ang חטאת ay pangalan ng handog na tumutugon sa kasalanan at ritwal na karumihan. Malinaw at pamilyar ang “handog para sa kasalanan,” habang inilalagay sa talababa ang mahalagang alternatibo.
- source_word: וְשָׁחַט אֹתָהּ
  choice: at kakatayin iyon
  rationale: Ang שׁחט ay teknikal na pandiwa para sa ritwal na pagkatay. Ang “iyon” ay likas na tumutukoy sa hayop na inihahandog.
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: sa lugar kung saan kinakatay
  rationale: Ang pasibong anyo sa Filipino ay natural sa paglalarawan ng nakatakdang gawaing panritwal at hindi nagpapakilala ng di-tiyak na tagaganap.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Karaniwang katawagan sa Filipino para sa עֹלָה, ang handog na buong sinusunog sa altar; mas madaling maunawaan kaysa sa etimolohikal na “handog na umaakyat.”
theological_decisions:
- issue: Kahulugan ng חטאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tukuyin ng salitang Hebreo ang handog na may kaugnayan kapwa sa kasalanan at sa ritwal na paglilinis. Ginamit sa pangunahing teksto ang mas kilalang katawagan, ngunit pinanatili sa talababa ang tunay at makabuluhang alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal at panritwal. Pinanatili ang isahang “kamay” at ang teknikal na diwa ng ritwal na pagkatay.
