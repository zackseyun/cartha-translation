    issue: Di-natural at malabong ayos ng “mula rito ang lahat ng taba nito.”
    rationale: Ang magkasunod na “rito” at “nito” ay hindi agad malinaw ang tinutukoy at hindi karaniwang ayos sa modernong Filipino. Ang “mula sa hayop” ay nililinaw ang referent na ipinahihiwatig ng panghalip Hebreo nang hindi binabago ang kahulugan.
  - severity: medium
    issue: Di-idiomatiko ang alternatibong “pauusukin iyon” sa talababa.
    rationale: Maaari itong unawain bilang pagpapausok o pagpapa-singaw sa karaniwang gamit, sa halip na teknikal na pagsusunog ng handog sa altar. Dapat manatili ang leksikal na paliwanag, ngunit sa likas na Filipino.
