  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: tl
  text: Aalisin niya ang lahat ng taba nito mula sa hayop at susunugin niya ito sa ibabaw ng altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay partikular na tumutukoy sa pagsusunog ng bahagi ng handog upang umakyat ang usok nito sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: at
  rationale: Iniuugnay ng pangatnig ang kilos na ito sa naunang sunod-sunod na ritwal; hindi kailangang katawanin nang hiwalay ang pananda ng tuwirang layon sa Tagalog.
- source_word: כָּל
  choice: lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng itinakdang taba, hindi isang bahagi lamang.
- source_word: חֶלְבּוֹ
  choice: taba nito
  rationale: Ang tinutukoy ay ang hayop na inihahandog. Ang “taba” ang natural at nakaugaliang katawagan sa mga bahaging sinusunog bilang handog sa Levitico.
- source_word: יָרִים
  choice: aalisin
  rationale: Bagaman literal na may diwang “iaangat,” sa kontekstong ito ay tumutukoy ito sa paghihiwalay o pag-aalis ng taba mula sa hayop.
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Ipinakikita ng pang-ukol ang paghihiwalay ng taba mula sa hayop; natural sa modernong Tagalog ang “mula rito” para sa malapit na tinutukoy na bagay o hayop.
- source_word: וְהִקְטִיר
  choice: at susunugin
  rationale: Ang pandiwa ay teknikal na tumutukoy sa pagpapailanlang sa usok ng handog. “Susunugin” ang pinakanatural sa pangunahing teksto, habang nililinaw sa talababa ang natatanging gamit nito sa paghahandog.
- source_word: הַמִּזְבֵּחָה
  choice: sa ibabaw ng altar
  rationale: Bagaman may hulaping patungo, sa ritwal na konteksto ang altar ang lugar kung saan sinusunog ang taba; malinaw na inihahayag ito ng “sa ibabaw ng altar.”
