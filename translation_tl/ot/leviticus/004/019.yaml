  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: aalisin ang buong taba mula sa hayop at susunugin ito sa altar. Gayunman, ang ayos na “Aalisin niya mula rito ang lahat ng taba nito” ay hindi natural at malabo ang pantukoy na “rito” kapag binasa nang hiwalay ang talata.'
  naturalness: Mas natural at malinaw sa modernong Tagalog ang pagbanggit sa hayop bilang pinagmumulan ng taba. Ang “sa ibabaw ng altar” ay angkop sa lokasyong ritwal.
  terminology: Ang “taba,” “susunugin,” at “altar” ay angkop. Hindi likas sa Filipino ang “pauusukin iyon” bilang alternatibong salin; mas mabuting ipaliwanag sa talababa ang teknikal na sakripisyong diwa ng pandiwang Hebreo nang hindi nagmumungkahi ng di-idiomatikong salin.
  issues:
