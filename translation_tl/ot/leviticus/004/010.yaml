  yaml_path: translation/ot/leviticus/004/010.yaml
  text: just as it is removed from the ox of the sacrifice of peace offerings[a], and the priest shall burn them on the altar of burnt offering.
translation:
  language: tl
  text: Kung paanong inaalis ang mga bahaging iyon mula sa toro ng handog pangkapayapaan[a], susunugin ng pari ang mga iyon sa altar ng handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “itinataas mula sa toro ng handog pangkapayapaan.” Ipinahihiwatig ng pandiwang Hebreo kapwa ang pag-aalis at pagtataas ng mga bahaging ihahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kung paanong
  rationale: Malinaw nitong ipinakikita ang paghahambing sa paraan ng paghahandog ng handog pangkapayapaan.
- source_word: יוּרַם
  choice: inaalis
  rationale: Ang Hophal ng רום ay literal na may diwang ‘itinataas,’ ngunit sa kontekstong ito ay tumutukoy sa pag-aalis ng mga bahaging ihahandog mula sa hayop. Pinananatili sa talababa ang literal na larawan.
- source_word: מִשּׁוֹר
  choice: mula sa toro
  rationale: Ang שׁוֹר ay tumutukoy sa hayop na bovine; ang ‘toro’ ay angkop sa konteksto ng hayop na inihahain.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: handog pangkapayapaan
  rationale: Likas at maikli itong salin ng nakatalagang katawagang pansakripisyo, habang pinananatili ang ugnayan ng שְׁלָמִים sa kapayapaan.
- source_word: וְהִקְטִירָם
  choice: susunugin ng pari ang mga iyon
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קטר ay tumutukoy sa pagsunog ng mga bahagi sa altar. Ang ‘mga iyon’ ay tumutukoy sa mga bahaging taba na binanggit sa naunang talata.
- source_word: הַכֹּהֵן
  choice: pari
  rationale: Karaniwang makabagong salin para sa nangangasiwa sa ritwal.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: sa altar ng handog na sinusunog
  rationale: Pinananatili nito ang partikular na altar na kaugnay ng עֹלָה at gumagamit ng malinaw na katawagang Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mga bahaging iyon’ upang likas na iugnay ang talata sa mga bahaging taba na nakatala sa naunang talata, nang hindi inuulit ang buong listahan.
