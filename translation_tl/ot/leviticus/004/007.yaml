revisions:
- from: At maglalagay ang pari ng kaunting dugo sa mga sungay ng altar ng mabangong insenso sa harap ni Yahweh, na nasa toldang tipanan. Pagkatapos, ibubuhos niya ang lahat ng dugo ng toro[a] sa paanan ng altar ng handog na sinusunog, na nasa pasukan ng toldang tipanan.
