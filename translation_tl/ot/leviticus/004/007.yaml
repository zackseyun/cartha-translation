  rationale: Inayos ang pagkakalagay ng sugnay na “na nasa Tolda ng Tipanan” upang walang kalabuan na ang altar ng mabangong insenso ang tinutukoy. Ginawang “Tolda ng Tipanan” ang nakapirming katawagan at pinanatili ang nag-iisang wastong footnote anchor. Walang binagong kahulugan ng ritwal o idinagdag na interpretasyong doktrinal.
