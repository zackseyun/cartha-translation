id: LEV.4.7
reference: Leviticus 4:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: tl
  text: At maglalagay ang pari ng kaunting dugo sa mga sungay ng altar ng mabangong insenso na nasa Tolda ng Tipanan, sa harap ni Yahweh; at ibubuhos niya ang lahat ng dugo ng toro[a] sa paanan ng altar ng handog na sinusunog, na nasa pasukan ng Tolda ng Tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “lahat ng dugo ng toro.” Sa pagkakasunod-sunod ng ritwal, ang tinutukoy ay ang dugong natira matapos mailagay ang kaunti nito sa mga sungay ng altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: maglalagay
  rationale: Ang נָתַן ay malawak na pandiwang nangangahulugang magbigay, maglagay, o maglapat. Ang “maglalagay” ay natural at sapat na tiyak para sa ritwal na kilos.
- source_word: מִן הַדָּם
  choice: ng kaunting dugo
  rationale: 'Partitibo ang מִן dito: bahagi lamang ng dugo ang inilalagay sa mga sungay ng altar.'
- source_word: קַרְנוֹת
  choice: mga sungay
  rationale: Pinananatili nito ang kongkretong katawagan sa nakausling mga sulok ng altar at ang kinikilalang terminolohiyang panritwal.
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: altar ng mabangong insenso
  rationale: Ipinahahayag nito kapuwa ang altar ng insenso at ang mabangong katangian ng mga sangkap na tinutukoy ng הַסַּמִּים.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ng “sa harap” ang espasyal at liturhikong diwa, habang ang pangalang Yahweh ay natural na pinangungunahan ng “ni” sa Tagalog.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa itinakdang pakikipagtagpo; ang “toldang tipanan” ay isang maikli, dignified, at madaling maunawaang katawagan sa santuwaryong ito.
- source_word: וְאֵת כָּל דַּם הַפָּר
  choice: ang lahat ng dugo ng toro
  rationale: Sinusunod nito ang tahasang anyo ng Hebreo na “lahat ng dugo ng toro,” nang hindi tahimik na idinaragdag sa pangunahing teksto ang “natitirang.” Nililinaw sa talababa ang ipinahihiwatig ng pagkakasunod-sunod.
- source_word: יִשְׁפֹּךְ
  choice: ibubuhos niya
  rationale: Tumpak at natural na inilalarawan ng “ibubuhos” ang ritwal na pagbuhos ng dugo.
- source_word: אֶל יְסוֹד
  choice: sa paanan
  rationale: Ang יְסוֹד ay pundasyon o base; “sa paanan” ang natural na Tagalog para sa bahaging ibaba ng altar kung saan ibinubuhos ang dugo.
- source_word: מִזְבַּח הָעֹלָה
  choice: altar ng handog na sinusunog
  rationale: Malinaw nitong ipinakikilala ang altar na ginagamit para sa עֹלָה, ang handog na buong sinusunog, nang hindi gumagamit ng mabigat na parirala.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang “Yahweh” sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng כָּל דַּם הַפָּר matapos gamitin ang bahagi ng dugo
  choice: lahat ng dugo ng toro, na may talababa tungkol sa natitirang dugo
  alternative: lahat ng natitirang dugo ng toro
  rationale: Literal na “lahat ng dugo ng toro” ang Hebreo, ngunit malinaw sa konteksto na may dugo nang inilagay sa mga sungay. Pinananatili sa teksto ang anyo ng pinagmulan at inilalahad sa talababa ang kontekstuwal na diwa, sa halip na alisin ang tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga katawagang panritwal na “altar,” “mga sungay,” at “handog na sinusunog,” ngunit inayos ang pangungusap sa natural na daloy ng Tagalog. Tanging marker na [a] ang ginamit at lumilitaw ito sa pangunahing teksto.
