  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: tl
  text: O kung ipinaalam sa kanya ang kasalanang nagawa niya,[a] magdadala siya ng isang babaeng kambing na walang kapintasan bilang kanyang handog para sa kasalanang nagawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nalaman niya” o “may nagpaalam sa kanya tungkol sa kanyang kasalanan.” Maaaring tumukoy ang pasibong anyo sa Hebreo sa sarili niyang pagkaunawa o sa pagpapaalam sa kanya ng iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: O kung
  rationale: Nagpapakilala ito ng alternatibong kalagayan sa serye ng mga tuntunin; natural sa Tagalog na ilantad ang kondisyong ipinahihiwatig ng kasunod na sugnay.
- source_word: הוֹדַע אֵלָיו
  choice: ipinaalam sa kanya
  rationale: 'Pinananatili nito ang pasibo/causative-passive na diwa ng Hophal: ang kasalanan ay dinadala sa kanyang kaalaman, nang hindi nililimitahan kung ito ay kanyang natanto o ibinalita ng iba.'
- source_word: חַטָּאתוֹ
  choice: ang kasalanang ... niya
  rationale: Sa kontekstong ito, tumutukoy ang חטאת sa nagawang kasalanan, hindi sa handog para sa kasalanan.
- source_word: אֲשֶׁר חָטָא
  choice: nagawa niya
  rationale: Ang 'kasalanang nagawa niya' ay likas at malinaw na Tagalog para sa Hebreong pariralang literal na 'na kanyang ipinagkasala.'
- source_word: וְהֵבִיא
  choice: magdadala siya
  rationale: Ipinahahayag nito ang iniaatas na kasunod na kilos sa legal na konteksto nang natural sa modernong Tagalog.
- source_word: קָרְבָּנוֹ
  choice: bilang kanyang handog
  rationale: Ang קרבן ay bagay na inihaharap o dinadala bilang handog; malinaw na pinananatili ng salin ang sakripisyal na termino.
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: isang babaeng kambing
  rationale: Malinaw na isinasaad ng Hebreo ang uri at kasarian ng hayop; ang 'babaeng kambing' ang karaniwang modernong katawagan.
- source_word: תְּמִימָה
  choice: walang kapintasan
  rationale: Ito ang natural at nakaugaliang pananalita para sa hayop na walang depekto at karapat-dapat ihandog.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: para sa kasalanang nagawa niya
  rationale: Ipinapakita ng עַל ang kaugnayan ng handog sa kasalanan nang hindi labis na tinutukoy kung layunin o dahilan ang diin.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa dalawang paglitaw nito
  choice: Isinalin bilang 'kasalanan' sa dalawang pagkakataon.
  alternative: Isalin ang ikalawang paglitaw bilang 'handog para sa kasalanan.'
  rationale: Ang mismong alay ay tinatawag nang קָרְבָּנוֹ ('kanyang handog') at tinutukoy bilang babaeng kambing. Kaya ang inuulit na חַטָּאתוֹ ay higit na tumutukoy sa pagkakasalang dahilan ng paghahandog, hindi sa handog mismo.
- issue: Kung paano nalaman ng tao ang kanyang kasalanan
  choice: Gumamit ng 'ipinaalam sa kanya' at naglagay ng talababa para mapanatili ang saklaw ng pasibong Hebreo.
  alternative: Isalin nang tiyak bilang 'nalaman niya' o 'may nagsabi sa kanya.'
  rationale: Maaaring saklawin ng anyong pasibo ang personal na pagkaunawa o ang pagpapaalam ng ibang tao; hindi dapat tahimik na piliin ang isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang legal at sakripisyal na himig ngunit iniwasan ang lipas o labis na teknikal na pananalita. Inilagay ang marker [a] kaagad pagkatapos ng sugnay na tinutukoy nito.
