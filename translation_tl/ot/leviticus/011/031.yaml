base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: tl
  text: Ang mga ito ang marumi para sa inyo sa lahat ng gumagapang na nilalang.[a] Ang sinumang humipo sa mga ito kapag patay na ang mga ito[b] ay magiging marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kabilang sa lahat ng nilalang na nagsisiksikan.” Malawak ang saklaw ng salitang Hebreo at tumutukoy sa maliliit na nilalang na gumagapang, nagsisiksikan, o nagkukumpulan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa kanilang pagkamatay”; ang diwa ay paghipo sa mga ito habang patay na ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הַטְּמֵאִים לָכֶם
  choice: Ang mga ito ang ituturing ninyong marumi
  rationale: Ipinahahayag nito ang katayuan ng mga nilalang ayon sa mga tuntunin ng rituwal na kalinisan para sa Israel. Ang 'ituturing ninyong marumi' ay natural sa Filipino at nililinaw ang diwang kaugnay ng לָכֶם nang hindi ipinahihiwatig na likas o pisikal lamang ang karumihan.
- source_word: בְּכָל הַשָּׁרֶץ
  choice: sa lahat ng gumagapang na nilalang
  rationale: Malawak ang saklaw ng שֶׁרֶץ at tumutukoy sa maliliit na nilalang na gumagapang, nagkukumpulan, o nagsisiksikan. Ang 'gumagapang na nilalang' ay karaniwan at madaling maunawaan, habang pinananatili ng talababa ang mas malawak na saklaw.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Ang sinumang humipo sa mga ito
  rationale: Pinananatili ng 'sinuman' ang pangkalahatan at distributibong diwa ng konstruksyon; ang 'humipo' ay angkop sa legal at marangal na rehistro.
- source_word: בְּמֹתָם
  choice: kapag patay na ang mga ito
  rationale: Ang parirala ay tumutukoy sa paghipo sa mga nilalang habang patay na ang mga ito, hindi lamang sa mismong sandali ng kanilang pagkamatay.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinahahayag ng pandiwa ang resultang katayuan ng rituwal na karumihan matapos humipo.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tuwirang inilalahad ang hangganang panahon ng rituwal na karumihan sa natural na Filipino.
theological_decisions:
- issue: Kahulugan ng 'marumi' sa konteksto ng Levitico
  choice: Pinanatili ang salitang 'marumi' bilang terminong tumutukoy sa katayuang rituwal.
  alternative: di-dalisay
  rationale: Mas malinaw at mas pamilyar sa karaniwang mambabasa ang 'marumi,' ngunit hindi dinagdagan ang teksto ng paliwanag na moral ang karumihan; ang konteksto ang nagtatakda sa rituwal na kahulugan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal ng Levitico. Ginamit ang 'ituturing ninyong marumi' upang natural na maipahayag ang covenantal/ritual na kaugnayan ng לָכֶם, at iniwasang gawing tiyak ang uri ng mga nilalang nang higit sa ipinahihintulot ng Hebreo.
