  text: אַ֤ךְ אֶת זֶה֙ תֹּֽאכְל֔וּ מִ/כֹּל֙ שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע אֲשֶׁר לא כְרָעַ֨יִם֙ מִ/מַּ֣עַל לְ/רַגְלָ֔י/ו לְ/נַתֵּ֥ר בָּ/הֵ֖ן עַל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: tl
  text: 'Gayunman, ito ang maaari ninyong kainin mula sa lahat ng lumilipad na nilalang na nagkukumpulan at lumalakad gamit ang apat na paa: yaong may[a] mga paang panlukso[b] sa itaas ng kanilang mga paa, upang gamitin sa paglukso sa lupa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa nakasulat na tradisyong Hebreo, literal na mababasa ang “walang mga paa”; ayon sa tradisyunal na pagbasa, sa konteksto, at sa mga sinaunang salin, ang diwa ay “may mga paa.”
    reason: textual_variant
  - marker: b
    text: Maaari ring “mga paang may kasukasuan.” Ang salitang Hebreo ay tumutukoy sa natatanging mga paa sa hulihan na ginagamit sa paglukso.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahihiwatig nito ang eksepsiyon sa naunang pagbabawal at malinaw na ipinakikita ang pagsalungat.
- source_word: אֶת זֶה
  choice: ito
  rationale: Pinananatili ang pang-isahang anyo ng Hebreo habang ang kasunod na parirala ay nililinaw ang uri ng mga nilalang na pinahihintulutang kainin.
- source_word: תֹּאכְלוּ
  choice: maaari ninyong kainin
  rationale: Sa kontekstong legal, ang anyo ng pandiwa ay nagpapahayag ng pahintulot, bilang kabaligtaran ng naunang pagbabawal.
- source_word: מִכֹּל שֶׁרֶץ הָעוֹף
  choice: sa lahat ng lumilipad na nilalang na nagkukumpulan
  rationale: Inilalarawan ng שֶׁרֶץ ang maliliit na nilalang na dumarami o nagkukumpulan, at tinutukoy ng הָעוֹף ang uring lumilipad; iniiwasan nito ang makitid o mapanlinlang na katawagang para lamang sa mga ibon.
- source_word: הַהֹלֵךְ עַל אַרְבַּע
  choice: lumalakad gamit ang apat na paa
  rationale: Natural na Filipino para sa paglalarawang Hebreo na kumikilos 'sa apat,' nang hindi binabago ang sinaunang paraan ng pag-uuri sa mga nilalang na ito.
- source_word: אֲשֶׁר לוֹא כְרָעַיִם
  choice: ang mga may mga paang panlukso
  rationale: Sinusunod sa pangunahing teksto ang tradisyunal na pagbasa na לוֹ ('mayroon itong'), na sinusuportahan ng konteksto at mga sinaunang salin. Sa kontekstong ito, ang כְרָעַיִם ay tumutukoy sa natatanging mga paa sa hulihan na ginagamit sa paglukso.
- source_word: מִמַּעַל לְרַגְלָיו
  choice: sa itaas ng kanilang mga paa
  rationale: Pinananatili ang anatomikal na paglalarawan ng pinagmulang teksto at ginagamit ang maramihan dahil isang buong uri ng mga nilalang ang tinutukoy.
- source_word: לְנַתֵּר בָּהֵן
  choice: na ginagamit nila sa paglukso
  rationale: Malinaw na ipinahahayag ang layunin ng natatanging mga paa; ang reperensiya ng panghalip ay ginawang tahasan para sa likas na daloy sa Filipino.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Ang 'lupa' ang natural na katumbas sa agarang konteksto ng paggalaw ng mga nilalang sa ibabaw ng lupa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nilalang na nagkukumpulan” upang mapanatili ang malawak na kategoryang Hebreo sa halip na ipakahulugan agad bilang isang tiyak na makabagong uring zoolohikal. Ang mga marker ng talababa ay inilagay mismo sa mga salitang kaugnay ng tekstuwal at leksikal na usapin.
