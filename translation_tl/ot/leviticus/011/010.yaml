  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: tl
  text: Ngunit ang lahat ng nilalang sa mga dagat at mga batis[b] na walang palikpik at kaliskis—kabilang sa lahat ng nagsisiksikang nilalang sa tubig at sa lahat ng buháy na nilalang na nasa tubig—ay kasuklam-suklam sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang bagay na dapat ninyong kasuklaman.” Ang pangngalang Hebreo ay tumutukoy sa isang bagay na ritwal na kasuklam-suklam sa konteksto ng batas tungkol sa pagkain.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga batis” ay maaari ring isaling “mga ilog” o “mga daluyang-tubig”; malawak ang saklaw ng salitang Hebreo at maaari itong tumukoy sa dumadaloy na tubig o sa pinagdadaluyan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Ngunit ang lahat
  rationale: Ipinahihiwatig ng ו ang pagsalungat sa mga pinahihintulutang hayop sa naunang talata, habang pinananatili ng “ang lahat” ang saklaw ng כֹל.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: na walang
  rationale: Natural at tuwirang Filipino para sa pariralang nagsasaad na wala sa nilalang ang mga kinakailangang katangian.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: mga palikpik at kaliskis
  rationale: Pinananatili ang dalawang magkasamang palatandaan; ang “at” ay additive, hindi disjunctive.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: nasa mga dagat at mga batis
  rationale: Ang יַמִּים ay “mga dagat”; ang נְחָלִים ay malawak na tumutukoy sa dumadaloy na mga daluyan ng tubig, kaya malinaw at karaniwan ang “mga batis,” habang inilalagay sa talababa ang ibang posibilidad.
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: mula sa lahat ng gumagapang na nilalang sa tubig
  rationale: Ang שֶׁרֶץ ay kategorya ng mga nilalang na gumagapang, nagkukumpulan, o nagsisiksikan; ang “gumagapang na nilalang” ay natural sa konteksto ng katawagang pang-uri sa Levitico at hindi nililimitahan sa modernong siyentipikong uri.
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה
  choice: at mula sa lahat ng buháy na nilalang
  rationale: Ang נֶפֶשׁ הַחַיָּה ay tumutukoy rito sa mga may-buhay na nilalang; iniiwasan ng salin ang mapanlinlang na literal na “buháy na kaluluwa.”
- source_word: אֲשֶׁר בַּמָּיִם
  choice: na nasa tubig
  rationale: Tuwirang inuugnay ang sugnay sa naunang “buháy na nilalang”; natural sa Filipino ang kolektibong isahan na “tubig.”
- source_word: שֶׁקֶץ
  choice: kasuklam-suklam
  rationale: Ipinahahayag ang matinding ritwal at pandiyetang pagkasuklam sa kontekstong ito nang hindi awtomatikong ginagawang pangkalahatang hatol na moral.
- source_word: הֵם לָכֶם
  choice: ay kasuklam-suklam sa inyo
  rationale: Ang sugnay na walang pandiwa sa Hebreo ay nagsasaad ng kanilang kalagayan para sa Israel; ang pangkasalukuyang “ay” ang pinakadirektang katumbas.
theological_decisions:
- issue: Katawagan sa ritwal na kalagayan sa batas tungkol sa pagkain
  choice: kasuklam-suklam
  alternative: karumal-dumal / isang kasuklam-suklam na bagay
  rationale: Ang שֶׁקֶץ ay may matinding puwersa ngunit dito ay nasa konteksto ng tipanang pag-uuri ng pagkain. Pinananatili ng “kasuklam-suklam” ang lakas nito nang hindi ipinapalagay na ang tinutukoy ay masamang moral sa lahat ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buháy” na may tuldik upang maiba sa “buhay” bilang pangngalan. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
