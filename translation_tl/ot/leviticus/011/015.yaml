lexical_decisions:
- source_word: אֵת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tuwirang layon sa Hebreo at wala itong bukod na katumbas sa Tagalog; makikita ang gamit nito sa pariralang nakapaloob sa mas malaking talaan.
- source_word: כָּל
  choice: bawat
  rationale: Kasama ng pangngalang kolektibo at ng pormulang tumutukoy sa mga uri, likas na ipinahahayag ng “bawat” ang pagiging saklaw ng lahat.
- source_word: עֹרֵב
  choice: uwak
  rationale: Ang “uwak” ang karaniwang katumbas ng עֹרֵב at maaari ring tumukoy nang mas malawak sa pangkat ng mga raven at crow.
- source_word: לְמִינוֹ
  choice: uri
  rationale: Sa pormulang ito ng pag-uuri, natural sa modernong Tagalog ang “bawat uri ng uwak”; pinananatili nito ang diwang klasipikasyon nang hindi nagpapahiwatig ng makabagong teknikal na konsepto ng species.
