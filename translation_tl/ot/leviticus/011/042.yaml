id: LEV.11.42
reference: Leviticus 11:42
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: tl
  text: Anumang gumagapang sa tiyan nito[a], anumang lumalakad sa apat na paa, at pati anumang may maraming paa na kabilang sa lahat ng nilalang na gumagapang sa lupa[b]—huwag ninyong kainin ang mga iyon, sapagkat kasuklam-suklam[c] ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “lumalakad sa tiyan nito.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang gumagapang na nilalang na gumagapang,” isang pag-uulit ng magkaugnay na mga salita na nagdiriin sa uring ito ng mga nilalang.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “karumal-dumal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: anumang
  rationale: Ginagamit nang distributibo upang ipakilala ang bawat uri ng nilalang; likas sa modernong Tagalog at pinananatili ang saklaw ng Hebreo.
- source_word: הוֹלֵךְ עַל גָּח
  choice: gumagapang sa tiyan nito
  rationale: Malinaw at natural na inilalarawan ang paraan ng paggalaw. Mas literal ang “lumalakad sa tiyan,” ngunit hindi gaanong likas sa Tagalog.
- source_word: הוֹלֵךְ עַל אַרְבַּע
  choice: lumalakad sa apat na paa
  rationale: Pinananatili ang kongkretong larawan ng Hebreo at malinaw na ang tinutukoy ay paraan ng paglakad.
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: pati anumang may maraming paa
  rationale: Ang עַד ay inuunawa rito bilang nagpapalawak ng saklaw hanggang sa mga nilalang na maraming paa; ang “pati” ay natural na nagpapahayag ng inklusibong diwa nang hindi ginagawang teknikal ang parirala.
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: sa lahat ng maliliit na nilalang na gumagapang
  rationale: Ipinahahayag ang uri ng mga nilalang na tinutukoy ng שֶׁרֶץ habang nananatiling malinaw sa karaniwang mambabasa. Ipinaliliwanag sa talababa ang pag-uulit ng magkaugnay na salita sa Hebreo.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Sa konteksto ng paggalaw ng maliliit na nilalang, ang “lupa” ang pinakanatural na katumbas at hindi kinakailangang tumukoy sa buong daigdig.
- source_word: לֹא תֹאכְלֻם
  choice: huwag ninyong kainin
  rationale: Direkta at marangal na modernong Tagalog para sa legal na pagbabawal; pinananatili rin ang pangmaramihang kausap.
- source_word: שֶׁקֶץ
  choice: kasuklam-suklam
  rationale: Nagpapahayag ng matinding pagkamuhi o rituwal na pagkasuklam sa konteksto ng mga kautusang pandiyeta, nang hindi nagdaragdag ng paliwanag na wala sa talata.
theological_decisions:
- issue: Saklaw at likas ng pagbabawal sa kautusan tungkol sa pagkain
  choice: Inilahad bilang tuwirang pagbabawal sa pagkain sa loob ng konteksto ng Levitico, nang walang pahayag tungkol sa bisa nito sa ibang panahon o tipan.
  alternative: Ilarawan ito bilang walang-hanggang utos moral, o pahinain bilang isa lamang kaugaliang bawal.
  rationale: Tuwirang legal na pagbabawal ang nasa Hebreo. Hindi dapat lutasin ng salin ang mas malawak na usaping teolohikal na hindi tahasang binabanggit sa talata.
- issue: Diwa ng שֶׁקֶץ
  choice: kasuklam-suklam
  alternative: karumal-dumal; isang bagay na kasuklam-suklam
  rationale: Pinananatili ang matinding pagtataya ng teksto ngunit hindi tinutukoy kung moral, rituwal, o kapuwa ang buong saklaw nito nang higit sa sinasabi ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang legal na tono. Ginamit ang “gumagapang sa tiyan” para sa likas na pagpapahayag, “pati” para sa inklusibong pagpapalawak, at “huwag ninyong kainin” upang mapanatili ang tuwirang pangmaramihang pagbabawal. Nasa pangunahing teksto ang lahat ng panandang-talababa.
