  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: tl
  text: 'Gayunman, huwag ninyong kainin ang mga sumusunod mula sa mga hayop na ngumunguya ng kinain na ibinabalik sa bibig upang nguyain muli o may biyak na kuko: ang kamelyo, sapagkat ngumunguya ito ng kinain na ibinabalik sa bibig upang nguyain muli ngunit hindi biyak ang kuko nito; marumi ito para sa inyo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, itinuturing itong marumi para sa Israel ayon sa mga batas tungkol sa pagkain.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Ipinahahayag nito ang pagtatangi o paglilimita sa tuntuning nauna, habang nananatiling natural sa makabagong Filipino.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: na ngumunguya ng pagkaing muli nilang iniluluwa
  rationale: Inilalarawan nang malinaw ang Hebreong idyoma ng pag-ahon o muling paglabas ng kinain upang nguyain, sa halip na gumamit ng teknikal o di-pamilyar na katawagan.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: o may biyak na kuko
  rationale: Inihahatid ang ikalawang panandang pang-uri ng hayop. Ang 'o' ay angkop sa konteksto sapagkat ang mga kasunod na halimbawa ay may isa lamang sa dalawang kinakailangang katangian.
- source_word: הַגָּמָל
  choice: ang kamelyo
  rationale: Tuwirang modernong katumbas ng pangalan ng hayop.
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: sapagkat ngumunguya ito ng pagkaing muli nitong iniluluwa
  rationale: Pinananatili ang dahilan kung bakit maaari itong magmukhang pasok sa unang pamantayan.
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: ngunit hindi biyak ang kuko nito
  rationale: Malinaw at natural na ipinakikita ang kabiguan nitong matugunan ang ikalawang pamantayan; maaaring mas literal na sabihing 'hindi nito binibiyak ang kuko.'
- source_word: טָמֵא הוּא לָכֶם
  choice: marumi ito para sa inyo
  rationale: Pinananatili ang mahalagang terminong pangkalinisan sa Levitico at ang pananaw ng kautusang nakatuon sa mga kausap, nang hindi nililimitahan agad sa 'ritwal' o 'seremonyal.'
theological_decisions:
- issue: Kalikasan ng pagiging marumi sa batas tungkol sa pagkain
  choice: marumi ito para sa inyo
  alternative: marumi ito sa ritwal para sa inyo
  rationale: Ang טָמֵא ay tumutukoy rito sa pag-uuring pangkalinisan ng Israel. Mas tapat na panatilihin sa pangunahing teksto ang malawak at sentral na salitang 'marumi' kaysa paliitin ito sa isang interpretatibong panuring; nililinaw ng talababa ang legal at pangkontekstong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mas mahabang paglalarawan sa pagnguya ng cud dahil walang karaniwang maikli at eksaktong katumbas nito sa pang-araw-araw na Tagalog. Ang hulma ng pambungad ay pinagaan upang maging natural ngunit pinanatili ang dalawang magkahiwalay na pamantayan at ang legal na pasiya.
