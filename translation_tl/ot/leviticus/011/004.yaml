  naturalness: Makabago at malinaw ang kabuuang register. Mas natural at hindi mapanligaw ang “kinain na ibinabalik sa bibig upang nguyain muli” kaysa sa “pagkaing muli nilang iniluluwa.” Ang “biyak na kuko” ay katanggap-tanggap na paglalarawan ng hati o biyak na hoof sa Filipino.
