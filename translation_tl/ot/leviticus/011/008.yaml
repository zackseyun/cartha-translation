  text: מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/008.yaml
  text: You shall not eat any of their flesh[a], and you shall not touch their carcasses; they are unclean to you.
translation:
  language: tl
  text: Huwag kayong kumain ng alinman sa laman ng mga iyon, at huwag ninyong hawakan ang mga bangkay ng mga iyon; marumi ang mga iyon para sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: alinman sa laman ng mga iyon
  rationale: 'Ang מִן ay partitive sa kontekstong ito: ipinagbabawal ang pagkain ng anumang bahagi ng laman. Pinananatili ng “laman” ang pisikal na diwa ng בָּשָׂר nang hindi nililimitahan sa pagkaing inihandang karne.'
- source_word: לֹא תֹאכֵלוּ
  choice: Huwag kayong kumain
  rationale: Likas at tuwirang anyo ito ng maramihang pagbabawal sa modernong Tagalog, habang pinananatili ang lakas ng legal na utos.
- source_word: וּבְנִבְלָתָם
  choice: mga bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay bangkay ng patay na hayop. Ang “bangkay” ay malinaw at angkop sa konteksto ng mga batas tungkol sa rituwal na karumihan.
- source_word: לֹא תִגָּעוּ
  choice: huwag ninyong hawakan
  rationale: Tuwirang isinasalin ang נגע bilang paghawak o pagdaiti; sapat ang “hawakan” dito dahil ipinahihiwatig na ng konteksto ang usapin ng rituwal na karumihan.
- source_word: טְמֵאִים
  choice: marumi
  rationale: Sa Levitico, tumutukoy ito sa itinakdang kalagayan ng rituwal na karumihan, hindi sa pisikal na dumi o likas na kasamaan. Ang “marumi” ang karaniwang salitang biblikal sa Tagalog para sa kategoryang ito.
- source_word: הֵם לָכֶם
  choice: marumi ang mga iyon para sa inyo
  rationale: 'Pinananatili ng “para sa inyo” ang ugnayang ipinahahayag ng לָכֶם: ang mga hayop na ito ay itinuring na marumi kaugnay ng Israel.'
theological_decisions:
- issue: Likas ng karumihan sa batas tungkol sa pagkain
  choice: Isinalin bilang rituwal na kategoryang “marumi,” nang walang dagdag na paliwanag sa mismong talata.
  alternative: Gamitin ang “rituwal na marumi” o “di-dalisay.”
  rationale: Ang teksto ay nagsasalita sa loob ng mga batas ng Israel tungkol sa kabanalan at kadalisayan. Dapat panatilihin ang kategoryang iyon nang hindi ginagawang moral na kasamaan ang mga hayop o nagpapasya tungkol sa bisa nito sa mga tipan sa kalaunan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang maramihang “kayo/ninyo” dahil maramihan ang mga pandiwang Hebreo. Walang talababa sapagkat ang alternatibong “mga patay na katawan” para sa נְבֵלָה ay hindi kailangan at maaaring maging mas malabo kaysa “mga bangkay.”
