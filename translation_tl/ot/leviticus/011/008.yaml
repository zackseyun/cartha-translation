  source_fidelity: 'Tapat ang salin sa Hebreo: ang “alinman sa laman” ay naipapahayag ang partitive na מִן; ang dalawang maramihang pagbabawal ay malinaw; at ang “mga bangkay” ay wastong tumutukoy sa נְבֵלָה sa konteksto ng hayop. Ang “marumi ... para sa inyo” ay pinananatili ang rituwal na kategorya ng טְמֵאִים at ang ugnayang ipinahihiwatig ng לָכֶם.'
  naturalness: Likas, malinaw, at angkop sa modernong Filipino Tagalog ang “Huwag kayong kumain ... huwag ninyong hawakan.” Ang pag-uulit ng “mga iyon” ay katanggap-tanggap na pagtukoy sa mga hayop na tinalakay sa naunang konteksto at nakatutulong sa kalinawan.
