lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת (tinshemet)
  choice: kuwago
  rationale: Hindi tiyak ang eksaktong uri ng ibon; ang “kuwago” ay isang tradisyonal at madaling maunawaang katumbas na hindi nagtatangkang tukuyin ang espesye nang labis.
- source_word: הַקָּאָת (qa'at)
  choice: pelikano
  rationale: Karaniwang inuunawa bilang pelikano o kahawig na ibong pantubig; pinananatili ang kinikilalang tradisyonal na salin.
- source_word: הָרָחָם (racham)
  choice: buwitreng kumakain ng bangkay
  rationale: Tumutukoy sa isang ibong mandaragit na kumakain ng bangkay, malamang ay isang uri ng buwitre; inilalarawan ang katangian nito upang maging malinaw sa modernong mambabasa.
