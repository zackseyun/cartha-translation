base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying to them,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kina Moises at Aaron. Sinabi niya sa kanila:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ANG PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ipinakikita ng waw-consecutive imperfect ang kasunod na pangyayari sa salaysay; ang “nagsalita” ay angkop sa pormal na pormula ng banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang “kina” ay likas na modernong Tagalog para sa patungong pakikipag-usap sa dalawang taong kapwa kinakausap.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Likas na inililipat sa Tagalog ang panandang nagpapakilala sa susunod na mismong pahayag; iniiwasan nito ang di-likas na “na sinasabi.”
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Hayagang pinananatili na ang susunod na pahayag ay para kapwa kina Moises at Aaron.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Hinati sa dalawang sugnay ang pormulang Hebreo upang maging natural sa Tagalog, habang pinananatili ang “sa kanila” bilang tahasang pagtukoy sa dalawang kinakausap.
