  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: tl
  text: “Sabihin ninyo sa mga anak ni Israel[a], ‘Ito ang mga buhay na nilalang[b] na maaari ninyong kainin mula sa lahat ng hayop na nasa lupa[c].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak na lalaki ni Israel,” isang pampamilyang katawagan sa sambayanang nagmula kay Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa anyo ng Hebreo: “Ito ang buhay na nilalang.” Dito, kolektibo ang isahang katawagan at ipinakikilala nito ang mga uring maaaring kainin.'
    reason: lexical_alternative
  - marker: c
    text: O “nasa kalupaan.” Itinatangi ng parirala ang mga nilalang sa lupa mula sa ibang mga pangkat na tinatalakay sa kabanata.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Sabihin ninyo sa mga anak ni Israel
  rationale: Ang maramihang pautos ay nakatuon kina Moises at Aaron ayon sa konteksto. Likas sa modernong Filipino na pagsamahin sa “Sabihin ninyo …” ang pandiwang “magsalita” at ang karaniwang pormulang Hebreo na לֵאמֹר na nagpapakilala ng tuwirang sinabi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang larawan ng literal na Hebreong “mga anak na lalaki ni Israel,” habang ang “mga anak” sa Filipino ay likas na tumutukoy sa buong lahi at hindi lamang sa kalalakihan.
- source_word: זֹאת הַחַיָּה
  choice: Ito ang mga buhay na nilalang
  rationale: Ang זֹאת at חַיָּה ay nasa anyong isahan, ngunit kolektibo at panlarawan ang gamit sa pagpapakilala ng mga uring ililista. Ang “Ito ang mga…” ay natural sa Filipino at pinananatili ang puwersang pangklasipikasyon nang hindi ipinapalagay na iisang nilalang lamang ang tinutukoy.
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: na maaari ninyong kainin
  rationale: Sa konteksto ng kautusang pandiyeta, ipinapahayag ng imperfect ang pinahihintulutang kainin; malinaw itong naihahatid ng “maaari ninyong kainin.”
- source_word: מִכָּל־הַבְּהֵמָה
  choice: mula sa lahat ng hayop
  rationale: Ipinahihiwatig ng מִן kasama ng כֹּל ang pagpili mula sa mas malaking pangkat. Ang “mula sa lahat” ay maikli at natural sa Filipino, samantalang ang “hayop” ay sapat na malawak para sa בְּהֵמָה rito.
- source_word: אֲשֶׁר עַל־הָאָרֶץ
  choice: na nasa lupa
  rationale: Ang parirala ay lokatibo at itinatangi ang mga hayop sa lupa mula sa mga nilalang sa tubig na tatalakayin pagkatapos. Ang “lupa” ay mas malinaw sa pagkakaibang ito kaysa sa “daigdig.”
