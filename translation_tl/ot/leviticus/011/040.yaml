  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: tl
  text: Ang sinumang kumakain ng anumang bahagi ng bangkay nito[a] ay dapat maglaba ng kanyang mga damit at magiging marumi hanggang sa gabi[b]. Ang sinumang bumubuhat ng bangkay nito ay dapat maglaba ng kanyang mga damit at magiging marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula sa bangkay nito” o “ng bahagi ng bangkay nito.” Partitive ang pahayag sa Hebreo; tumutukoy ito sa pagkain mula sa bangkay o ng bahagi nito.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, marumi ayon sa mga batas ng Israel tungkol sa rituwal na kalinisan.
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: ang kumain
  rationale: Ang participle na may pantukoy ay tumutukoy sa sinumang gagawa ng kilos. Pinananatili ng “ang kumain” ang payak at legal na anyo habang natural sa makabagong Tagalog.
- source_word: מִנִּבְלָתָהּ
  choice: ng anumang bahagi ng bangkay nito
  rationale: 'May partitive na diwa ang מִן: pagkain mula sa, o ng bahagi ng, bangkay. Nililinaw ng “anumang bahagi” ang diwang ito nang hindi ipinapalagay na buong bangkay ang kinain.'
- source_word: נִבְלָתָהּ
  choice: bangkay nito
  rationale: Sa konteksto ng mga batas tungkol sa kalinisan, tumutukoy ang salita sa patay na katawan ng hayop. Ang “bangkay” ang maikli at karaniwang katumbas sa Tagalog.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: dapat maglaba ng kanyang mga damit
  rationale: May nag-uutos na bisa ang imperfect sa legal na kontekstong ito. Natural sa Tagalog ang “dapat” para sa obligasyong itinakda ng batas.
- source_word: וְטָמֵא
  choice: at magiging marumi
  rationale: Ipinahahayag ng sugnay ang kalagayang ibinubunga ng kilos. Hindi idinagdag sa pangunahing teksto ang “ayon sa ritwal” upang mapanatili ang payak na salita ng Hebreo.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tumpak at natural itong katumbas ng pormulang Hebreo, kasama ang tiyak na pantukoy.
- source_word: הַנֹּשֵׂא
  choice: ang magdala
  rationale: Substantibo at pangkalahatan ang gamit ng participle. Pinananatili nito ang paralelismo sa “ang kumain.”
theological_decisions:
- issue: Kalikasan ng pagiging marumi
  choice: “marumi” sa pangunahing teksto, na may paliwanag sa talababa na tumutukoy ito sa mga batas ng Israel tungkol sa rituwal na kalinisan
  alternative: “marumi ayon sa ritwal” sa pangunahing teksto
  rationale: Malinaw sa konteksto na legal at rituwal ang kalagayan, ngunit wala sa Hebreo ang tahasang katagang “ayon sa ritwal.” Pinananatili ng salin ang salita ng teksto at inilalagay ang kailangang paliwanag sa talababa.
- issue: Kasarian sa pangkalahatang legal na pahayag
  choice: “kanyang mga damit”
  alternative: “mga damit nila”
  rationale: Isahan ang pormulasyon sa Hebreo. Ang “kanyang” sa Tagalog ay likas na walang tinutukoy na kasarian at napapanatili ang isahang legal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dapat” upang natural na maipahayag ang nag-uutos na tono ng batas. Pinanatili ang magkapantay na hulma ng dalawang sugnay at iniwasang magdagdag ng denominasyonal na pagpapakahulugan.
