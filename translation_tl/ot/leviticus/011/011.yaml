  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: tl
  text: At magiging kasuklam-suklam[a] sa inyo ang mga iyon; huwag ninyong kainin ang alinman sa laman ng mga iyon, at ituring ninyong kasuklam-suklam ang mga bangkay ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “karima-rimarim”; ang terminong Hebreo ay tumutukoy rito sa isang bagay na rituwal na kasuklam-suklam o nakapandidiri sa konteksto ng mga batas sa pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: kasuklam-suklam
  rationale: Ipinahahayag nito ang matinding pagkamuhi at rituwal na di-pagtanggap sa konteksto ng mga batas sa pagkain. Mas tiyak ito kaysa sa simpleng “marumi,” na maaari ring tumumbas sa ibang mga terminong Hebreo tungkol sa karumihan.
- source_word: יִהְיוּ לָכֶם
  choice: magiging ... sa inyo
  rationale: Pinananatili ang diwa ng Hebreong pananalita na nagtatakda kung paano dapat ituring ng Israel ang mga nilalang na ito.
- source_word: מִבְּשָׂרָם
  choice: alinman sa laman ng mga iyon
  rationale: 'Ang מִן kasunod ng negatibong pandiwa ng pagkain ay partitivo: ipinagbabawal ang pagkain ng anumang bahagi ng kanilang laman.'
- source_word: לֹא תֹאכֵלוּ
  choice: huwag kayong kakain
  rationale: Natural na modernong Tagalog ito para sa tahasang pagbabawal sa tekstong legal, habang pinananatili ang preskriptibong lakas.
- source_word: נִבְלָתָם
  choice: ang mga bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay tumutukoy sa patay na katawan o bangkay ng hayop; malinaw at angkop ang “bangkay” sa kontekstong ito.
- source_word: תְּשַׁקֵּצוּ
  choice: ituring ninyong kasuklam-suklam
  rationale: Pinananatili nito ang ugnayang leksikal sa שֶׁקֶץ at ang diwang hindi lamang emosyonal na pagkamuhi kundi itinakdang pagtingin o pag-uuri sa mga bangkay.
theological_decisions:
- issue: Kalikasan ng pananalita tungkol sa karumihan sa mga batas sa pagkain
  choice: Gamitin ang “kasuklam-suklam,” na nagpapahiwatig ng rituwal na pagkasuklam, sa halip na gawing pangkalahatang moral na kategorya ang salita.
  alternative: “Karumal-dumal” o “marumi”
  rationale: Ang talata ay tungkol sa mga itinakdang pagkakaiba sa pagkain sa tipan ng Israel. Pinananatili ng “kasuklam-suklam” ang matinding negatibong pagpapahalaga ng teksto nang hindi ito pinahihina sa “marumi” o pinalalawak bilang isang di-tiyak na moral na hatol.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga iyon” upang mapanatili ang pagtukoy sa naunang binanggit na mga nilalang, at ang semicolon upang ipakita ang magkakaugnay na daloy ng mga sugnay sa Hebreo.
