base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: tl
  text: 'Ito ang maaari ninyong kainin mula sa lahat ng nasa tubig: lahat ng nasa tubig—sa mga dagat at sa mga batis[a]—na may mga palikpik at kaliskis ay maaari ninyong kainin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ilog.” Ang salitang Hebreo ay maaari ring tumukoy sa mga daluyan ng tubig o sa mga tuyong daluyan ng tubig na pana-panahong dinadaluyan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: Ito ang
  rationale: Pinananatili ang isahang anyo ng demonstratibo sa Hebreo, ngunit ginagamit bilang likas na panimula sa paglalahad kung anong uri ang maaaring kainin.
- source_word: תֹּאכְלוּ
  choice: maaari ninyong kainin
  rationale: Ang imperfect na 2mp sa kontekstong ito ng batas sa pagkain ay nagpapahayag ng pahintulot, hindi ng utos na obligadong kainin ang mga ito.
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: sa lahat ng nasa tubig
  rationale: Likas na Filipino para sa partitive na diwa ng מִן, ibig sabihin ay mula o kabilang sa kabuuan ng mga nilalang na nasa tubig.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: mga palikpik at kaliskis
  rationale: Bagaman isahan bilang mga pangngalang pang-uri sa Hebreo, mas natural sa Filipino ang maramihang “mga palikpik” at ang kolektibong “kaliskis” sa paglalarawan ng mga hayop sa tubig.
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: sa mga dagat at sa mga batis
  rationale: Ang יַמִּים ay mga dagat; ang נְחָלִים ay maaaring tumukoy sa mga batis, ilog, o daluyang-tubig. Ang “mga batis” ay malinaw at pangkalahatang katawagan para sa umaagos na tubig sa lupa.
- source_word: אֹתָם תֹּאכֵלוּ
  choice: ay maaari ninyong kainin
  rationale: Pinananatili ang pag-uulit na nagbibigay-diin sa mga pinahihintulutang kainin, habang iniiwasan ang di-likas na pag-uulit ng panghalip sa Filipino.
