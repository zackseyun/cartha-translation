  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: tl
  text: upang makilala ang marumi sa malinis, at ang hayop na maaaring kainin sa hayop na hindi maaaring kainin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: upang makilala ang pagkakaiba
  rationale: Ipinahahayag ng pawatas ang layunin ng naunang tagubilin. Natural sa makabagong Filipino ang pariralang ito at pinananatili nito ang diwa ng legal na pagkilala sa mga kategorya.
- source_word: בֵּין ... וּבֵין
  choice: ng ... at ng
  rationale: Sa Filipino, malinaw at natural na naihahanay ng magkatambal na “ng ... at ng ...” ang dalawang pares ng pinaghahambing nang hindi pilit na inuulit ang “sa pagitan.”
- source_word: הַטָּמֵא
  choice: marumi
  rationale: Teknikal itong katawagan sa ritwal na pag-uuri sa Levitico; ang “marumi” ang karaniwang katapat at hindi rito nagpapahiwatig ng likas na kasamaan.
- source_word: הַטָּהֹר
  choice: malinis
  rationale: Kaagapay ng “marumi,” pinananatili ng “malinis” ang bokabularyo ng ritwal na pag-uuri sa halip na gawing tahasang moral ang kahulugan.
- source_word: הַחַיָּה
  choice: hayop
  rationale: Sa kontekstong ito, tumutukoy ang חַיָּה sa hayop o nilalang na saklaw ng mga tuntunin sa pagkain. Ang “hayop” ay malinaw, natural, at hindi kailangang unawain bilang mabangis na hayop lamang.
- source_word: הַנֶּאֱכֶלֶת
  choice: na maaaring kainin
  rationale: Ipinahihiwatig ng Niphal na participle sa konteksto ang pahintulot o pagiging angkop kainin, hindi lamang ang pisikal na posibilidad.
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: na hindi maaaring kainin
  rationale: Ipinapahayag nito ang kabaligtarang ipinagbabawal na kategorya. Sa konteksto ng kautusan, ang “hindi maaaring” ay pagbabawal, hindi kawalan lamang ng kakayahan.
theological_decisions:
- issue: Mga katawagang tumutukoy sa ritwal na kalinisan sa kautusan ng Levitico
  choice: Isinalin ang טָמֵא/טָהֹר bilang “marumi/malinis” sa ritwal at legal na diwa.
  alternative: “di-dalisay/dalisay” o “ritwal na marumi/ritwal na malinis”
  rationale: Pinananatili ng “marumi/malinis” ang magkapares na kategorya ng teksto nang hindi ipinapalagay na ang tinutukoy ay likas na imoral. Hindi rin idinagdag sa pangunahing teksto ang salitang “ritwal,” na wala roon bagaman malinaw sa konteksto.
- issue: Saklaw ng חַיָּה
  choice: “hayop”
  alternative: “buhay na nilalang” o “nilalang”
  rationale: Ang “hayop” ang natural na katawagan sa buod ng mga tuntunin tungkol sa mga kinakain. Hindi ito nilimitahan sa mababangis na hayop lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkatulad na kayarian ng dalawang paghahambing at ang teknikal na pares na “marumi/malinis,” habang iniwasan ang tunog na labis na literal o arkaiko.
