  source_fidelity: 'Ang pangunahing kahulugan ay naipapahayag: pahintulot na kainin ang hayop na may ganap na biyak na kuko at nagbabalik ng kinain upang nguyain muli. Gayunman, ang pariralang “mula sa sikmura” ay isang sobrang espesipikong paliwanag na wala sa Hebreo, at mas maayos na panatilihin ang idyomang kahulugan nang hindi nagbibigay ng anatomikong detalye.'
  naturalness: Makabago at malinaw ang pangungusap, ngunit mas natural at tuwiran ang “nagbabalik ng kinain upang nguyain muli” kaysa “nagbabalik ng pagkain mula sa sikmura upang nguyain.” Nililinaw rin ng pag-ulit ng “mga kuko nito” ang saklaw ng “ganap na nahahati.”
  terminology: 'Ang “kuko” ay katanggap-tanggap para sa hoof sa karaniwang Filipino, ngunit ang “mga kuko nito” sa ikalawang sugnay ay nakaiiwas sa anumang kalabuan. Ang literal na tala para sa מַעֲלַת גֵּרָה ay kailangang iwasto: ang Hebreo ay “nag-aakyat/nagbabalik ng cud,” hindi “nag-aakyat ng pagkaing ibinalik mula sa sikmura.”'
