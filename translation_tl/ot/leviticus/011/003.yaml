translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo” upang likas na katawanin ang kolektibong kausap. Iniwasan ang teknikal na “ruminante” at pinanatiling madaling maunawaan ang pisikal na mga tanda ng pinahihintulutang hayop.
