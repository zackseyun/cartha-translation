  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: tl
  text: Maaari ninyong kainin ang alinmang hayop na may biyak na kuko[a], na ganap na nahahati ang mga kuko nito, at nagbabalik ng kinain upang nguyain muli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “naghahati ng kuko at bumibiyak ng biyak ng mga kuko.” Gumagamit ang Hebreo ng dalawang magkaugnay na pahayag upang idiin na tunay na nahahati ang kuko.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nag-aakyat ng cud.” Ibig sabihin, ibinabalik nito ang kinain upang nguyain muli.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: alinmang
  rationale: Ginamit nang distributibo upang tukuyin ang bawat hayop na nagtataglay ng mga katangiang kasunod. Likas sa makabagong Tagalog ang “alinmang” sa pahayag ng pahintulot.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: may biyak na kuko
  rationale: Malinaw at likas na paglalarawan ito sa hoof na nahahati, nang hindi ginagawang teknikal o matigas ang pananalita.
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: na lubos na nahahati sa dalawa
  rationale: Binibigyang-diin at nililinaw ng parirala na tunay at ganap ang pagkakahati ng kuko. Pinanatili ang espesipikong ideya ng dalawang bahagi.
- source_word: מַעֲלַת גֵּרָה
  choice: nagbabalik ng pagkain mula sa sikmura upang nguyain
  rationale: Isinasalin nito nang malinaw ang literal na larawang “nag-aakyat/nagbabalik ng cud” at ipinapaliwanag sa karaniwang mambabasa ang kilos ng pagnguya muli.
- source_word: בַּבְּהֵמָה
  choice: hayop
  rationale: Sa konteksto, tumutukoy ito sa mga hayop sa lupa na inuuri ng batas sa pagkain. Masyadong makitid ang “alagang hayop.”
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Maaari ninyong kainin
  rationale: Sa konteksto ng mga batas sa pagkain, nagpapahayag ito ng pahintulot, hindi ng utos na kailangang kainin ang gayong hayop.
