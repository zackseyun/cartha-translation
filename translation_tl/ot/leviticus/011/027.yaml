base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: tl
  text: At bawat hayop na lumalakad sa mga paa nito, sa lahat ng hayop na lumalakad sa apat na paa,[a] ay marumi para sa inyo. Ang sinumang humipo sa bangkay ng mga iyon[b] ay magiging marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na gumagalaw gamit ang lahat ng apat na paa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isahan ang salitang “bangkay” ngunit maramihan ang panghalip na nakakabit dito; kolektibo ang gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: At bawat hayop na lumalakad gamit ang mga paa nito
  rationale: Ang כַּף ay literal na palad o talampakan, ngunit sa konteksto ng hayop ay tumutukoy sa paa o panapak nito. Ginawang tahasan ang 'hayop' na ipinahihiwatig ng kasunod na parirala upang maging malinaw at natural sa Tagalog.
- source_word: בְּכָל הַחַיָּה
  choice: kabilang sa lahat ng hayop
  rationale: Sa konteksto ng mga batas sa pagkain, ang חַיָּה ay tumutukoy sa mga hayop, hindi sa buhay sa pangkalahatan.
- source_word: הַהֹלֶכֶת עַל אַרְבַּע
  choice: na lumalakad nang apat ang paa
  rationale: Pinananatili ang larawan ng Hebreo na paglakad sa apat, sa natural na modernong Tagalog. Ang alternatibong mas literal ay inilagay sa talababa.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: ay marumi para sa inyo
  rationale: Ang 'marumi' ang karaniwang terminong Tagalog para sa rituwal na kalagayang טמא; hindi nito ipinapalagay na moral na kasalanan ang tinutukoy.
- source_word: כָּל הַנֹּגֵעַ
  choice: Ang sinumang humipo
  rationale: Naghahatid ito ng pangkalahatan at legal na bisa ng parirala.
- source_word: בְּנִבְלָתָם
  choice: sa bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay bangkay ng hayop. Isahan ang pangngalan ngunit maramihan ang hulaping panghalip sa Hebreo, kaya pinanatili ang kolektibong diwa.
- source_word: יִטְמָא עַד הָעָרֶב
  choice: ay magiging marumi hanggang sa gabi
  rationale: Ipinahahayag ng imperfect sa legal na konteksto ang resultang rituwal na kalagayan; natural sa Tagalog ang 'magiging marumi'.
theological_decisions:
- issue: Terminong tumutukoy sa rituwal na kalinisan
  choice: marumi
  alternative: di-malinis; nadungisan
  rationale: Rituwal o seremonyal na katayuan ang tinutukoy, hindi pangunahing moral na pagkakasala. Ang 'marumi' ay malinaw at nakaugaliang katumbas sa kontekstong Levitico.
- issue: Kolektibong anyo ng bangkay
  choice: bangkay ng mga iyon
  alternative: mga bangkay ng mga iyon
  rationale: Pinananatili nito ang kakaibang anyo ng Hebreo—isang pangngalang isahan na may hulaping maramihan—nang hindi nilulutas nang tahimik ang kolektibong gamit.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog para sa tekstong legal. Ginamit ang 'hayop' upang maiwasan ang maling pagbasa na tao ang tinutukoy, at pinanatili ang rituwal na kahulugan ng 'marumi.'
