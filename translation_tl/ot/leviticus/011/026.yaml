base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: tl
  text: Tungkol sa bawat hayop na may hati ang kuko[a], ngunit hindi ganap na biyak ang kuko nito at hindi ngumangata, marumi ang mga iyon para sa inyo. Ang sinumang humipo sa mga iyon ay magiging marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “may hati, ngunit hindi nito hinahati ang hati”; idinidiin ng Hebreo na ang kuko ay hindi ganap na biyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: Tungkol sa bawat hayop
  rationale: Ipinahahayag ng לְ ang paksang kategorya; natural itong naihahatid ng “Tungkol sa.” Malawak ang בְּהֵמָה rito at tumutukoy sa hayop sa lupa.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: may hati ang kuko
  rationale: Natural na Filipino ito para sa hayop na ang kuko ay nahahati, habang pinananatili ang larawang nasa Hebreo.
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: ngunit hindi lubusang biyak ang kuko
  rationale: Ipinahihiwatig ng magkaugnay na pangngalan at pandiwa na hindi ganap ang pagkakahati ng kuko; malinaw na naihahatid ng “lubusang biyak” ang diin.
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: at hindi ngumunguya ng pagkaing iniluwa mula sa sikmura
  rationale: Inilalarawan ng parirala ang muling pag-akyat at pagnguya sa pagkain. Mas mauunawaan ito ng karaniwang mambabasa kaysa sa teknikal o di-karaniwang salitang “ngumangata.”
- source_word: טְמֵאִים הֵם לָכֶם
  choice: marumi ang mga iyon para sa inyo
  rationale: Sa konteksto ng Levitico, ang “marumi” ay kategorya ng ritwal na kalinisan. Pinananatili ng “para sa inyo” ang legal at pangkasunduang pananaw ng לָכֶם.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Ang sinumang humipo sa mga iyon
  rationale: Natural na pangkalahatang pahayag sa Filipino ang “sinumang,” at malinaw na tinutukoy ng “mga iyon” ang mga hayop.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinahahayag ng imperfect ang legal na bunga ng paghipo—ang tao ay papasok sa kalagayang ritwal na marumi.
theological_decisions:
- issue: Terminong ginagamit para sa ritwal na kalinisan sa batas ng Levitico
  choice: marumi
  alternative: di-dalisay
  rationale: Ang “marumi” ay malinaw at karaniwang terminong biblikal sa Filipino. Dito ay tumutukoy ito sa ritwal na katayuan, hindi awtomatikong sa kasalanang moral.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na himig ng talata at ang teknikal na pagkakaiba ng ritwal na karumihan sa moral na kasamaan.
