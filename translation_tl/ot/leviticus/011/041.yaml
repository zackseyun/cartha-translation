  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: tl
  text: At bawat nilalang na gumagapang sa lupa ay karima-rimarim[a]; hindi dapat kainin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasuklam-suklam.” Dito, tumutukoy ang salita sa isang bagay na itinuturing na karima-rimarim bilang pagkain ayon sa mga tuntuning ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: At ang bawat
  rationale: Pinananatili ng “At” ang pagkakaugnay sa naunang mga tuntunin, at ng “bawat” ang saklaw ng כָּל.
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: munting nilalang na gumagapang
  rationale: Ang שֶׁרֶץ at kaugnay na pandiwaring שֹׁרֵץ ay tumutukoy sa maliliit na nilalang na maramihang kumikilos o gumagapang nang malapit sa lupa. Iniiwasan ang mekanikal at di-likas na pag-uulit sa Tagalog habang pinananatili ang uri at kilos ng nilalang.
- source_word: עַל הָ/אָרֶץ
  choice: sa lupa
  rationale: Sa konteksto, tumutukoy ang אֶרֶץ sa panlupang saklaw, kaiba sa tubig at himpapawid; natural at malinaw sa Tagalog ang “sa lupa.”
- source_word: שֶׁקֶץ
  choice: karima-rimarim
  rationale: Ipinahahayag nito ang matinding pagkasuklam at pagbabawal sa kontekstong ritwal at pandiyeta, nang hindi ipinapalagay na likas na moral na kasamaan ang tinutukoy.
- source_word: הוּא
  choice: ay
  rationale: Ang panaguring nominal sa Hebreo ay natural na isinasalin sa Tagalog sa pamamagitan ng “ay”; malinaw pa rin ang mariing pag-uuri sa nilalang.
- source_word: לֹא יֵאָכֵל
  choice: hindi iyon dapat kainin
  rationale: Ang pasibong anyo ay nananatili, at ang “dapat” ay malinaw na naghahatid ng legal na pagbabawal sa natural na modernong Tagalog.
theological_decisions:
- issue: Saklaw ng שֶׁקֶץ
  choice: Ipinakahulugan bilang karima-rimarim sa ritwal na konteksto ng pagkain.
  alternative: kasuklam-suklam o isang karumaldumal na bagay sa ganap na moral na diwa
  rationale: Ang konteksto ng Levitico 11 ay mga batas sa pagkaing ipinagbabawal; hindi dapat palawakin nang walang batayan ang salita tungo sa pangkalahatang hatol na moral.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “munting nilalang na gumagapang” upang maipabatid sa karaniwang mambabasa ang malawak na uri ng maliliit na nilalang sa Hebreo; ang legal na tono ay pinanatili sa “hindi iyon dapat kainin.”
