  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang listahan ng tatlong hayop, ang katayuang טָמֵא, at ang pang-uring לְמִינֵהוּ na tumutukoy sa huling hayop. Gayunman, ang pambungad na “ito ang mga marumi” ay hindi natural na Tagalog at bahagyang malabo kung ang tinutukoy ay mga hayop o isang uri ng katayuan.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “ito ang marumi para sa inyo” kaysa “ito ang mga marumi para sa inyo.” Ang “mga nilalang na naglipana” ay mas malapit sa malawak na saklaw ng שֶׁרֶץ kaysa “mga hayop,” habang nananatiling payak ang daloy.
  terminology: Ang “marumi” ay angkop na pamantayang termino para sa rituwal na katayuan sa Levitico. Ang “dagang-bulag” at “malaking butiki” ay maaaring panatilihin, basta malinaw na itinatala ng talababa ang kawalan ng katiyakan sa pagkakakilanlang zoolohikal. Isinalin sa Filipino ang mga alternatibong katawagan sa talababa upang maging mas kapaki-pakinabang sa mambabasang Tagalog.
  issues:
  - severity: medium
    issue: Hindi likas ang “At ito ang mga marumi para sa inyo.”
    rationale: Ang panghalip na “ito” ay karaniwang sinusundan ng isahang panaguri sa ganitong panimulang pormula. Ang “mga marumi” ay tunog putol at maaaring magpahiwatig ng mga taong marumi, hindi ng legal na kategorya ng mga nilalang.
  - severity: low
    issue: Masyadong pangkalahatan ang “mga hayop” para sa שֶׁרֶץ.
    rationale: Ang שֶׁרֶץ ay tumutukoy sa isang natatanging pangkat ng maliliit na nilalang na naglipana o nagsisiksikan; ang “mga nilalang na naglipana” ay mas malapit sa saklaw nito.
  - severity: low
    issue: Nananatiling Ingles ang mga alternatibong katawagan sa talababa.
    rationale: Maaaring ibigay ang mga ito bilang “balyena? no”—hindi; ang wastong Filipino ay “weasel (hayop na kahawig ng long-tailed weasel)” is not precise. Mas maayos na gamitin ang “weasel o nunal” at “pagong o butiki,” na may pag-iingat na mga tradisyonal na salin lamang ang mga ito.
  revised_text: 'At ito ang marumi para sa inyo sa mga nilalang na naglipana sa lupa: ang dagang-bulag[a], ang daga, at ang malaking butiki, ayon sa uri nito.'
