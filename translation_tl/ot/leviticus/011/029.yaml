  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: tl
  text: 'At ito ang marumi para sa inyo sa mga nilalang na naglipana sa lupa: ang dagang-bulag[a], ang daga, at ang malaking butiki, ayon sa uri nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng חֹלֶד at צָב. Kabilang sa mga tradisyonal na salin ng חֹלֶד ang “weasel” o “nunal,” at ng צָב ang “pagong” o “butiki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: At ito ang mga
  rationale: Bagaman isahan ang demonstratibong זֶה, ipinakikilala nito ang isang talaan ng maraming hayop. Likas sa Tagalog ang “ito ang mga” sa ganitong paglilista.
- source_word: לָכֶם הַטָּמֵא
  choice: mga marumi para sa inyo
  rationale: Pinananatili ng “marumi” ang terminong ginagamit sa konteksto ng rituwal na kalinisan, at ipinahihiwatig ng “para sa inyo” na ang kautusan ay nakatuon sa Israel.
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ עַל הָאָרֶץ
  choice: kabilang sa mga hayop na naglipana sa lupa
  rationale: Ipinapahayag ng “naglipana” ang diwa ng שׁרץ na pagdami o pagkilos ng maliliit na nilalang. Hindi lubos na naulit sa Tagalog ang ugat na inuulit sa Hebreo upang manatiling natural at malinaw ang pangungusap.
- source_word: הַחֹלֶד
  choice: dagang-bulag[a]
  rationale: Isang maikli at mauunawaang katawagan ito para sa posibleng hayop na naninirahan at naghuhukay sa lupa, ngunit hindi tiyak ang eksaktong zoolohikal na pagkakakilanlan kaya nilagyan ng talababa.
- source_word: הָעַכְבָּר
  choice: daga
  rationale: Karaniwang tumutukoy ang עַכְבָּר sa mouse o sa kahawig nitong maliliit na rodent; “daga” ang pinakanatural na pangkalahatang katawagan sa Tagalog.
- source_word: הַצָּב
  choice: malaking butiki
  rationale: Malamang na isang uri ng reptilyang tulad ng butiki ang tinutukoy, ngunit hindi tiyak ang eksaktong hayop. Ang “malaking butiki” ay malapit sa posibleng kahulugan nang hindi ito ipinapantay nang tiyak sa bayawak.
- source_word: לְמִינֵהוּ
  choice: ayon sa uri nito
  rationale: Pinananatili nito ang pormulang pang-uuri ng Hebreo at ang pagkakaugnay nito sa huling hayop na binanggit.
theological_decisions:
- issue: Kahulugan ng טָמֵא sa batas ng Levitico
  choice: marumi
  alternative: di-malinis; rituwal na marumi
  rationale: Ang “marumi” ang payak at nakaugaliang salin para sa katayuang itinakda ng batas. Hindi idinagdag sa pangunahing teksto ang “rituwal” upang hindi palawakin ang tahasang sinabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyo at pinanatili ang legal na himig ng talata nang hindi ginagawang teknikal o denominasyonal.
