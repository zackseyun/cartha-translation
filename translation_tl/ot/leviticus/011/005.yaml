  text: וְ/אֶת הַ/שָּׁפָ֗ן כִּֽי מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּ/פַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: tl
  text: At ang hyrax[a], sapagkat ngumangata ito ngunit hindi hati ang paa nito, ay marumi para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang hyrax ay isang maliit na mamalyang naninirahan sa mababatong lugar. Tinatawag din itong rock hyrax o rock badger; sa ilang lumang salin, “coney.” Ang “ngumangata” ay tumutukoy sa pagnguya muli ng kinain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: ang hyrax sa batuhan
  rationale: Tumutukoy ang שָׁפָן sa maliit na mamalyang naninirahan sa mababatong lugar, na karaniwang kinikilalang rock hyrax. Pinananatili ng “hyrax” ang wastong pagkakakilanlang zoolohikal, habang nililinaw ng “sa batuhan” ang uri at tirahan.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala nito ang dahilan ng pagkaklasipika at angkop sa marangal na rehistrong pambatas.
- source_word: מַעֲלֵה גֵרָה
  choice: ngumunguya ... ng pagkaing ibinalik mula sa sikmura
  rationale: Isinasalin nang malinaw ang idyomang Hebreo na literal na tumutukoy sa pagpapabalik ng pagkain upang muling nguyain; iniiwasan ang teknikal ngunit di-gaanong pamilyar na “ngumangata.”
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: ngunit hindi biyak ang kuko nito
  rationale: Natural at malinaw na Filipino para sa kawalan ng hati o biyak na kuko, habang pinananatili ang pagsalungat sa naunang katangian.
- source_word: טָמֵא
  choice: marumi
  rationale: Sa konteksto ng mga tuntuning pangritwal sa Levitico, ang “marumi” ang karaniwang salin para sa katayuang hindi malinis ayon sa ritwal, hindi likas na kasamaan.
- source_word: לָכֶם
  choice: para sa inyo
  rationale: Likas na Filipino na nagpapakitang ang itinakdang katayuan ay umiiral para sa kausap na sambayanan.
theological_decisions:
- issue: Kalikasan ng טָמֵא sa batas tungkol sa pagkain
  choice: katayuang marumi ayon sa ritwal, hindi pahayag ng likas na kasamaang moral
  alternative: marumi o masama sa moral na diwa
  rationale: Sa Levitico 11, ang salita ay tumutukoy sa katayuan sa sistemang pangritwal at pandiyeta. Pinananatili ng “marumi” ang kategorya ng teksto nang hindi dinaragdagan ng hatol tungkol sa moral na katangian ng hayop.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mas pamilyar na paliwanag sa pagnguya sa halip na ang bihirang terminong “ngumangata,” at pinanatili ang legal-pangritwal na diwa ng “marumi.”
