lexical_decisions:
- source_word: הַדָּאָה
  choice: ang lawin
  rationale: Hindi tiyak ang eksaktong uri ng ibon. Ang “lawin” ay natural at madaling maunawaang katawagan sa Filipino para sa isang ibong mandaragit at angkop na katumbas sa kontekstong ito.
- source_word: הָאַיָּה
  choice: ang halkon
  rationale: Tumutukoy ito sa isang ibong mandaragit na maaaring kilalaning halkon o lawin. Pinili ang “halkon” upang mapanatiling magkaiba ang dalawang katawagang Hebreo nang hindi lumalampas sa posibleng kahulugan.
- source_word: לְמִינָהּ
  choice: ayon sa uri nito
  rationale: Pinananatili nito ang pangklasipikasyong diwa ng pariralang Hebreo at natural itong pakinggan sa modernong Filipino.
- source_word: וְאֶת ... וְאֶת
  choice: ang ... at ang ...
  rationale: Hindi tuwirang isinasalin ang pananda ng tuwirang layon na אֵת; likas na inilalahad sa Filipino ang pagkakaugnay bilang “ang ... at ang ...” sa nagpapatuloy na talaan.
