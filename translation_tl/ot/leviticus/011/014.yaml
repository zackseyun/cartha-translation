  text: ang lawin[a] at ang palkon, ayon sa kani-kanilang uri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga ibong ito; maaari ring isalin ang una bilang “buwitre” at ang ikalawa bilang “lawin.”
