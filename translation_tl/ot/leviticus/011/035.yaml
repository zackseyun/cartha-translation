base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: tl
  text: At anumang bagay na malaglagan ng bangkay ng mga iyon ay magiging marumi.[a] Ang pugon man o lutuan[b] ay dapat gibain. Marumi ang mga iyon, at magiging marumi ang mga iyon para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, marumi ayon sa mga batas tungkol sa ritwal na kalinisan. Ang “bangkay” ay tumutukoy sa bangkay ng hayop; maaari rin itong unawaing “mga bangkay” bilang kolektibong pagtukoy sa mga hayop na iyon.
    reason: lexical_alternative
  - marker: b
    text: Ang “lutuan” ay tumutukoy sa isang instalasyon sa pagluluto; maaaring ito ay kalan, patungan ng palayok, o tulad-pugon na apuyan.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay tumutukoy sa bangkay ng patay na hayop sa konteksto ng mga batas tungkol sa ritwal na karumihan. Pinananatili ng “bangkay” ang hayop na sanggunian, at ipinapahayag ng “ng mga iyon” ang hulaping pangmaramihan.
- source_word: יִפֹּל
  choice: malaglagan
  rationale: Ang imperfect ay naglalahad ng pangkalahatang kaso sa wikang pambatas. Likas sa Tagalog ang hulma na “anumang malaglagan” para sa bagay na pinatakan ng bahagi ng bangkay.
- source_word: עָלָיו יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinapakita ng parirala ang kalagayang idinudulot ng paglagpak ng bangkay. Ang “magiging marumi” ay malinaw na resulta, habang ang talababa ay naglilinaw na ritwal ang tinutukoy.
- source_word: תַּנּוּר
  choice: pugon
  rationale: Tumutukoy ito sa pugon na ginagamit sa pagluluto o paghurno. Ang “pugon” ay maikli, dignipikado, at angkop sa sinaunang instalasyong maaaring gibain.
- source_word: כִירַיִם
  choice: lutuan
  rationale: Hindi tiyak ang eksaktong anyo ng sinaunang instalasyon; maaari itong kalan, patungan ng palayok, o tulad-pugon na apuyan. Ang “lutuan” ay natural at hindi labis na nagtatakda ng teknolohiya.
- source_word: יֻתָּץ
  choice: dapat gibain
  rationale: Ang passive na pandiwa ay naghahayag ng kinakailangang pagsira sa kontaminadong instalasyon. Ang “dapat gibain” ay malinaw na nagdadala ng obligasyong pambatas.
- source_word: טְמֵאִים הֵם
  choice: Marumi ang mga iyon
  rationale: Pinananatili ang karaniwang salitang “marumi” para sa טמא at hindi ito ginagawang moral na kasamaan; ang konteksto at talababa ang naglilinaw sa ritwal na diwa.
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: at magiging marumi ang mga iyon para sa inyo
  rationale: 'Pinananatili ng “para sa inyo” ang ugnayang ipinahahayag ng לָכֶם: dapat ituring ng mga Israelita na marumi ang mga kagamitang ito. Hindi idinaragdag ang “mananatili,” na hindi tahasang nasa Hebreo.'
theological_decisions:
- issue: Kalikasan ng karumihan sa batas ng Levitico
  choice: Gamitin ang “marumi” sa pangunahing teksto at ipaliwanag sa talababa na ritwal na karumihan ang tinutukoy.
  alternative: “marumi ayon sa ritwal” o “ritwal na marumi” sa pangunahing teksto
  rationale: Ang טמא ay tumutukoy rito sa katayuan sa mga batas ng ritwal na kalinisan, hindi sa moral na kasamaan. Ang “marumi” ay nagpapanatili ng mahalagang terminolohiyang biblikal at leksikal na pagkakapare-pareho nang hindi isinasara ang buong saklaw ng salita.
translation_notes:
  register: Makabagong Filipino na malinaw at dignipikado. Ginamit ang “mga iyon” upang tukuyin ang naunang binanggit na maruruming nilalang at ang dalawang instalasyon nang hindi gumagamit ng mas kolokyal na anyo. Pinanatili ang pag-uulit ng “marumi” at ang “para sa inyo” upang masalamin ang diin at pagkakabuo ng Hebreo.
