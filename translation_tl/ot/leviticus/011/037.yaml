    rationale: Maaaring isalin ang parirala nang partitibo bilang ‘anumang bahagi ng bangkay ng mga iyon,’ ngunit maaari rin itong unawain nang kolektibo/plural bilang tumutukoy sa kanilang mga bangkay. Makabubuting panatilihin ang napiling natural na salin at magbigay ng talababa.
  revised_text: At kung may mahulog na anumang bahagi ng bangkay ng mga iyon sa anumang binhing panhasik na ihahasik, iyon ay malinis.[a]
