  text: And if any of their carcass falls on any seed for sowing that is to be sown[a], it is clean.
translation:
  language: tl
  text: At kung may mahulog na anumang bahagi ng bangkay ng mga iyon sa anumang binhing panhasik na ihahasik, iyon ay malinis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “kung may mahulog mula sa kanilang mga bangkay sa anumang binhing panhasik.” Ang Hebreong מִנִּבְלָתָם ay maaaring unawaing partitibo (“anumang bahagi ng bangkay ng mga iyon”) o kolektibo/plural (“mula sa kanilang mga bangkay”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyunal na gamit ng כִּי sa pagpapatuloy ng mga batas.
- source_word: יִפֹּל
  choice: mahulog
  rationale: Ang Qal imperfect sa kondisyunal na batas ay likas na isinasalin bilang posibleng pangyayari.
- source_word: מִ/נִּבְלָתָם
  choice: anumang bahagi ng bangkay ng mga iyon
  rationale: Ipinahahayag ang partitive na puwersa ng מִן at ang kolektibong sanggunian ng hulaping 3mp nang malinaw at natural sa Tagalog.
- source_word: עַל כָּל
  choice: sa anumang
  rationale: Ang distributibong כָּל sa kondisyunal na batas ay natural na ipinahahayag ng “anumang,” kasama ang lokatibong עַל.
- source_word: זֶרַע זֵרוּעַ
  choice: binhing panhasik
  rationale: Pinananatili ang diin sa binhing nakalaan sa paghahasik nang hindi inuulit nang mabigat ang parehong ugat.
- source_word: אֲשֶׁר יִזָּרֵעַ
  choice: na ihahasik
  rationale: 'Ipinahahayag ang prospektibong diwa ng relative clause: ang binhi ay nakatalagang ihasik.'
- source_word: טָהוֹר הוּא
  choice: malinis pa rin iyon
  rationale: Ang “malinis” ay angkop sa konteksto ng ritwal na kalinisan; idinagdag ang “pa rin” upang likas na maipahayag sa Tagalog ang hatol na hindi ito nagiging marumi sa kondisyong inilalarawan.
theological_decisions:
- issue: Kahulugan ng טָהוֹר sa batas ng Levitico
  choice: malinis
  alternative: dalisay
  rationale: Tumutukoy ito sa katayuang ritwal, hindi pangunahin sa moral o pisikal na kadalisayan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “mga iyon” upang tukuyin ang mga hayop na nasa naunang konteksto, at “binhing panhasik” bilang maikli ngunit malinaw na katawagan sa binhing nakalaan sa pagtatanim.
