  source_fidelity: Tumpak na naihahatid ng draft ang kondisyunal na kaso, ang paghulog ng bahagi mula sa bangkay, ang binhing nakalaan para sa paghahasik, at ang ritwal na katayuang ‘malinis.’ Gayunman, ang ‘pa rin’ ay nagdaragdag ng aspektong ‘nananatiling’ wala sa hayagang Hebreo. Ang partitive na pagbasa sa מִנִּבְלָתָם ay posible at natural, ngunit may lehitimong alternatibong pag-unawa sa anyo nito; dapat itong itala sa talababa.
  naturalness: Natural at angkop sa modernong Filipino Tagalog ang ‘binhing panhasik’ at ‘malinis’ sa legal/ritwal na rehistro. Mas maayos ang ayos na ‘may mahulog na anumang bahagi’ kaysa ‘may anumang bahagi ... na mahulog.’
  terminology: Ang ‘bangkay,’ ‘binhing panhasik,’ at ‘malinis’ ay angkop. Ang ‘malinis’ ay wastong termino para sa טָהוֹר sa konteksto ng ritwal na kalinisan, hindi isang paghuhusgang moral.
