  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: tl
  text: Ngunit kasuklam-suklam sa inyo ang bawat munting nilalang na may pakpak na dumadagsa, na may apat na paa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “gumagapang na nilalang na lumilipad.” Malawak ang pariralang Hebreo at lalo nang tumutukoy sa mga kulisap na lumilipad.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “apat na paa.” Ang “paa” ay maaari ring unawaing “mga biyas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Ngunit ... ang bawat
  rationale: Ang וְ ay nagpapakita rito ng pagsalungat sa mga eksepsiyong binanggit sa naunang talata, kaya natural ang “Ngunit.” Ipinahahayag ng “bawat” ang distributibong diwa ng כֹל.
- source_word: שֶׁרֶץ הָעֹוף
  choice: munting nilalang na may pakpak at nagkukumpulan
  rationale: Ang parirala ay malawak na tumutukoy sa maliliit na lumilipad o may-pakpak na nilalang na dumarami o nagkukumpulan, lalo na sa mga kulisap. Iniwasan ang “kulisap” sa pangunahing teksto upang hindi gawing mas makitid kaysa sa kategoryang Hebreo.
- source_word: אֲשֶׁר לוֹ
  choice: na may
  rationale: Ito ang natural at tuwirang Filipino para sa Hebreong pariralang naglalarawan ng katangiang taglay ng nilalang.
- source_word: אַרְבַּע רַגְלָיִם
  choice: apat na paa
  rationale: Tuwirang pinananatili ang bilang at katawagan sa Hebreo. Sa Filipino, ang “paa” ay maaari ring tumukoy sa biyas ng hayop o kulisap.
- source_word: שֶׁקֶץ הוּא לָכֶם
  choice: kasuklam-suklam sa inyo
  rationale: Ipinahahayag ng “kasuklam-suklam” ang matinding pagtutol ng שֶׁקֶץ sa konteksto ng mga ipinagbabawal kainin, habang pinananatili ng “sa inyo” ang tuwirang pagtukoy sa bayang kinakausap.
