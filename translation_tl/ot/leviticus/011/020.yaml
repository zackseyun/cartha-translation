  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: tl
  text: Bawat maliliit na nilalang na may pakpak na lumalakad sa apat na paa ay kasuklam-suklam sa inyo.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Bawat maliliit na nilalang na lumilipad.” Malawak ang saklaw ng salitang Hebreo at hindi lamang mga ibon ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lumalakad sa apat.” Tumutukoy ito sa paggalaw gamit ang apat na paa, bagaman sa mga sumusunod na talata ay may eksepsiyon para sa ilang insektong tumatalon.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “karima-rimarim sa inyo.” Sa mga batas tungkol sa pagkain, tumutukoy ang salita sa ritwal na pagkasuklam o pagbabawal, hindi kinakailangang sa pangkalahatang hatol na moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Bawat
  rationale: 'Nasa diwang pamahagi ang salita: saklaw ang bawat kasapi ng tinutukoy na uri.'
- source_word: שֶׁרֶץ
  choice: munting nilalang
  rationale: Tumutukoy ito sa maliliit na nilalang na naglipana o gumagapang; sa kontekstong ito, nililinaw ng kasunod na parirala na mga may pakpak ang tinutukoy.
- source_word: הָעוֹף
  choice: na may pakpak
  rationale: Mas malawak ang עוֹף kaysa sa mga ibon lamang at kabilang dito rito ang mga insektong lumilipad; iniiwasan ng saling ito ang maling paglilimita sa mga ibon.
- source_word: הַהֹלֵךְ
  choice: gumagapang
  rationale: Ang pandiwaring Hebreo ay literal na 'lumalakad' o 'humahayo,' ngunit para sa maliliit na nilalang, natural sa Filipino ang 'gumagapang' bilang paraan ng pagkilos sa lupa.
- source_word: עַל אַרְבַּע
  choice: sa apat na paa
  rationale: Pinananatili nito ang literal na 'sa apat' at ginagawang malinaw ang tinutukoy na paraan ng paggalaw; ipinaliliwanag sa talababa ang kaugnayan nito sa kasunod na eksepsiyon.
- source_word: שֶׁקֶץ
  choice: karima-rimarim
  rationale: Ipinahahayag nito ang matinding pagkasuklam o pagiging bawal sa konteksto ng mga tuntunin sa pagkain, nang hindi ito basta itinutumbas sa mas pangkalahatang terminong 'marumi.'
- source_word: לָכֶם
  choice: para sa inyo
  rationale: Ipinakikita ng parirala na dapat ituring ng Israel ang mga nilalang na ito bilang karima-rimarim.
theological_decisions:
- issue: Uri ng pagkasuklam na ipinahahayag ng שֶׁקֶץ
  choice: karima-rimarim para sa inyo
  alternative: kasuklam-suklam para sa inyo
  rationale: Pinananatili ang lakas ng termino sa konteksto ng mga batas sa pagkain, ngunit hindi ito pinalalawak tungo sa isang pangkalahatang hatol na moral.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “may pakpak” sa halip na “ibon” upang masaklaw ang mga insektong nasa konteksto; iniwasan din ang sobrang teknikal na pananalita sa pangunahing teksto.
