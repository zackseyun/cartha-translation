  naturalness: Natural ang “maaari ninyong kainin” at ang paulit-ulit na “ayon sa uri nito.” Hindi natural at nakalilito sa modernong Tagalog ang “balang na walang buhok,” sapagkat hindi ito karaniwang pangalan ng insekto at maaaring magpahiwatig ng pisikal na katangiang hindi sinasabi ng Hebreo.
  terminology: Ang “balang,” “kuliglig,” at “tipaklong” ay nauunawaang katawagan, ngunit ang kuliglig ay dapat manatiling may talababa dahil hindi tiyak ang pagkakakilanlan ng חַרְגֹּל. Para sa סָלְעָם, mas maingat ang transliterasyong “sal'am” na may paliwanag sa talababa kaysa sa mapanlinlang na literal na parirala.
