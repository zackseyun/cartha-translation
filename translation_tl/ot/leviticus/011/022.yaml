    rationale: Ang “bald locust” ay tradisyonal na English rendering, hindi isang napatunayang zoolohikal na pakahulugan ng Hebreo. Ang literal na pagdadala nito sa Tagalog ay hindi malinaw at maaaring magbigay ng maling impresyon.
  - severity: low
    issue: Ang talababa ay nakaangkla sa “balang,” bagaman ang kawalang-katiyakan ay pangunahing tumutukoy sa kasunod na mga pangalan ng insekto.
    rationale: Mas malinaw na ilagay ang angkla sa “sal'am,” ang unang hindi tiyak na katawagan, at ipaliwanag din doon ang “kuliglig.”
