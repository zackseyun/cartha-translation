revisions:
- from: 'Sa mga iyon, ito ang maaari ninyong kainin: ang balang ayon sa uri nito,[a] ang balang na walang buhok ayon sa uri nito, ang kuliglig ayon sa uri nito, at ang tipaklong ayon sa uri nito.'
  to: Sa mga ito, maaari ninyong kainin ang balang ayon sa uri nito, ang sal'am[a] ayon sa uri nito, ang kuliglig ayon sa uri nito, at ang tipaklong ayon sa uri nito.
  rationale: Pinalitan ang hindi natural at mapanlinlang na “balang na walang buhok” ng transliterasyong “sal'am” upang mapanatili ang natatanging, ngunit hindi tiyak, na katawagang Hebreo. Inilipat ang angkla ng talababa sa salitang nangangailangan nito at pinanatili ang malinaw na permisibong diwa at ang pormulang “ayon sa uri nito.”
