  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “maaari ninyong kainin” upang ipahayag ang pahintulot, at pinanatili ang paulit-ulit na “ayon sa uri nito” bilang pormulang pangklasipikasyon.
