base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: tl
  text: Sa mga ito, maaari ninyong kainin ang balang ayon sa uri nito, ang sal'am[a] ayon sa uri nito, ang kuliglig ayon sa uri nito, at ang tipaklong ayon sa uri nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga pangalang Hebreo para sa mga insektong ito, maliban sa “balang.” Ang סָלְעָם (sal'am) ay tradisyonal na isinasaling “bald locust” sa Ingles, at ang חַרְגֹּל ay kadalasang isinasaling “kuliglig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: Sa mga iyon, ito
  rationale: Ipinakikilala nito ang isang pinahihintulutang pangkat mula sa mga insektong binanggit sa naunang talata; natural ito sa modernong Tagalog habang pinananatili ang diwang partitibo.
- source_word: תֹּאכֵלוּ
  choice: maaari ninyong kainin
  rationale: Permisibo ang gamit ng imperfect sa konteksto ng mga tuntunin sa pagkain, hindi utos na kailangang kainin ang mga ito.
- source_word: הָאַרְבֶּה
  choice: ang balang
  rationale: Ito ang karaniwan at pinakamatatag na pagkakakilanlan ng Hebreong אַרְבֶּה.
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: ayon sa uri nito
  rationale: Pinananatili nito ang paulit-ulit na pormulang pangklasipikasyon sa Torah sa malinaw at natural na Tagalog.
- source_word: הַסָּלְעָם
  choice: ang balang na walang buhok
  rationale: Hindi tiyak ang eksaktong insekto. Isinasalin nito nang maingat ang tradisyonal na “bald locust” at ipinakikitang naiiba ang katawagang Hebreo, habang inilalahad sa talababa ang kawalang-katiyakan.
- source_word: הַחַרְגֹּל
  choice: ang kuliglig
  rationale: Karaniwang tradisyonal na katumbas ang “kuliglig,” ngunit hindi tiyak ang eksaktong zoolohikal na pagkakakilanlan kaya nililinaw ito sa talababa.
- source_word: הֶחָגָב
  choice: ang tipaklong
  rationale: Natural na Tagalog ito para sa grasshopper-type insect at malinaw itong naibubukod sa balang sa loob ng talata.
