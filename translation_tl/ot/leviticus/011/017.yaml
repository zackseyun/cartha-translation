  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: tl
  text: ang munting kuwago[a], ang kormorant, at ang malaking kuwago.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak kung anu-anong uri ng ibon ang tinutukoy ng mga salitang Hebreo. Posibleng salin ang “munting kuwago,” “kormorant,” at “malaking kuwago.” Kabilang sa ibang mungkahi ang “kuwago” para sa כּוֹס, “pelikano” para sa שָׁלָךְ, at “kuwagong may sungay” o “kuwagong-agila” para sa יַנְשׁוּף.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: ang munting kuwago
  rationale: Tumutukoy ito sa isang ibong itinuturing na marumi, ngunit hindi tiyak ang eksaktong uri. Ang “munting kuwago” ay karaniwang makabagong pagkakakilanlan at nagpapahiwatig na isang partikular na ibon ang tinutukoy.
- source_word: הַשָּׁלָךְ
  choice: ang kormorant
  rationale: Pinagtatalunan ang eksaktong ibong tinutukoy. Ang “kormorant” ay matagal nang ginagamit at posibleng tumutukoy sa ibong sumisisid upang manghuli ng isda; inilalahad sa talababa ang kawalan ng katiyakan.
- source_word: הַיַּנְשׁוּף
  choice: ang malaking kuwago
  rationale: Malamang na tumutukoy ito sa isang malaking ibong aktibo sa gabi, ngunit hindi matiyak ang eksaktong uri. Ang “malaking kuwago” ay malinaw nang hindi nag-aangking tiyak ang espesye.
- source_word: וְאֶת
  choice: at
  rationale: Ang inuulit na pangatnig at pananda ng tuwirang layon ay nagpapatuloy sa talaan. Natural sa Tagalog ang mga kuwit at isang “at” bago ang huling aytem.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang anyo ng talaan at minarkahan sa talababa ang tunay na kawalan ng katiyakan sa pagkakakilanlan ng mga ibon.
