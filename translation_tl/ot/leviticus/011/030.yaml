  source_fidelity: 'Tumpak na naipapakita ng salin ang limang hayop sa tekstong Hebreo sa parehong pagkakasunod-sunod: הָאֲנָקָה, הַכֹּחַ, הַלְּטָאָה, הַחֹמֶט, at הַתִּנְשָׁמֶת. Ang mga terminong “tuko,” “bayawak,” “butiki,” “butiking-buhangin,” at “hunyango” ay tumutugma sa maingat at di-labis na tiyak na mga pagpiling nasa English audit trail. Ang talababa ay wastong nagpapanatili ng leksikal na kawalang-katiyakan.'
