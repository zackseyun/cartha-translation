  text: the gecko[a], the monitor lizard, the lizard, the sand lizard, and the chameleon.
translation:
  language: tl
  text: ang tuko[a], ang bayawak, ang butiki, ang butiking-buhangin, at ang hunyango.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga hayop sa talatang ito. Kabilang sa tradisyonal at makabagong mga mungkahi ang mga sumusunod: para sa “tuko,” maaaring “ferret” o “shrew”; para sa “bayawak,” maaaring “hunyango”; para sa “butiking-buhangin,” maaaring “skink” o, ayon sa mas lumang tradisyon, “suso”; at para sa “hunyango,” maaaring “nunal” o ibang uri ng butiki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: tuko
  rationale: Hindi tiyak ang eksaktong hayop, ngunit sa konteksto ng mga gumagapang na hayop, malamang na isang uri ito ng butiki. Natural at madaling maunawaan sa modernong Filipino ang “tuko.”
- source_word: הַכֹּחַ
  choice: bayawak
  rationale: Karaniwang inuunawa ang salita bilang isang malaking uri ng butiki; ang “bayawak” ang natural na katumbas sa Filipino ng monitor lizard.
- source_word: הַלְּטָאָה
  choice: butiki
  rationale: Pinananatili ng pangkalahatang katawagang “butiki” ang malawak na zoolohikal na diwa nang hindi nag-aangkin ng hindi tiyak na pagkakakilanlan ng espesye.
- source_word: הַחֹמֶט
  choice: butiking-buhangin
  rationale: Sa listahan ng mga gumagapang na hayop, mas angkop ang pagkakakilanlan bilang isang uri ng butiki kaysa sa tradisyonal na “suso”; gayunman, nananatiling hindi tiyak ang eksaktong uri.
- source_word: הַתִּנְשָׁמֶת
  choice: hunyango
  rationale: Bagaman ginagamit din ang salitang Hebreo para sa isang ibon sa ibang konteksto, narito ito sa listahan ng mga gumagapang na hayop. Ang “hunyango” ay isang malawak na kinikilalang kontekstuwal na salin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang mga pangkaraniwang katawagan sa hayop, habang ang tunay na kawalang-katiyakan sa pagkakakilanlan ng mga terminong Hebreo ay pinanatili sa talababa.
