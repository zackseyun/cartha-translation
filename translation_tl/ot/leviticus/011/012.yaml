  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: tl
  text: Lahat ng nasa tubig na walang palikpik at kaliskis ay kasuklam-suklam sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang kasuklam-suklam na bagay sa inyo.” Ang Hebreong שֶׁקֶץ ay tumutukoy rito sa isang bagay na ritwal na kasuklam-suklam o karima-rimarim ayon sa mga batas tungkol sa pagkain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Lahat ng
  rationale: Ipinahahayag nito ang isang saklaw na walang itinatangi at natural itong panimula sa makabagong Tagalog.
- source_word: אֵין לוֹ
  choice: walang
  rationale: Direkta at likas na paraan ito sa Tagalog upang ipahayag ang kawalan ng taglay.
- source_word: סְנַפִּיר
  choice: palikpik
  rationale: Karaniwang salitang Tagalog para sa fin; ang anyong pangkalahatan ay angkop sa pag-uuri ng mga nilalang sa tubig.
- source_word: קַשְׂקֶשֶׂת
  choice: kaliskis
  rationale: Karaniwang salitang Tagalog para sa scales at natural sa paglalarawan ng mga hayop sa tubig.
- source_word: בַּמָּיִם
  choice: nasa tubig
  rationale: Likas na lokatibong parirala sa Tagalog at pinananatili ang diwang nasa loob ng tubig.
- source_word: שֶׁקֶץ
  choice: kasuklam-suklam
  rationale: Pinananatili nito ang matinding diwa ng bagay na ritwal na karima-rimarim o hindi katanggap-tanggap sa konteksto ng mga batas sa pagkain, nang hindi ito ipinagkakamali sa ibang terminong Hebreo para sa pagiging marumi.
- source_word: הוּא
  choice: ay
  rationale: Ang panandang panaguri ay natural na naghahatid sa nominal na sugnay ng Hebreo.
- source_word: לָכֶם
  choice: sa inyo
  rationale: Pinananatili nito ang tuwirang pagkakapit ng kautusan sa mga kinakausap.
theological_decisions:
- issue: Terminong panritwal para sa שֶׁקֶץ sa konteksto ng batas sa pagkain
  choice: kasuklam-suklam
  alternative: karumal-dumal; isang kasuklam-suklam na bagay
  rationale: Malinaw at marangal itong makabagong Tagalog na nagpapanatili sa malakas na pagtataya ng Hebreo. Hindi ginamit ang “marumi” upang hindi ihalintulad ang שֶׁקֶץ sa hiwalay na bokabularyo ng ritwal na karumihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos na “Lahat ng nasa tubig” at mga karaniwang terminong “palikpik” at “kaliskis.”
