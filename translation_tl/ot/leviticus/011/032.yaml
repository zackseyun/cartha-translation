  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: tl
  text: 'Anumang bagay na mahulugan ng isa sa mga iyon kapag patay na ang mga ito ay magiging marumi: anumang kagamitang yari sa kahoy, damit, balat, o telang-sako—anumang kagamitang ginagamit sa paggawa. Dapat itong ilagay sa tubig[a] at mananatiling marumi hanggang gabi; pagkatapos ay magiging malinis na ito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “ilubog sa tubig.” Literal sa Hebreo: “dalhin sa tubig.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם
  choice: Ang anumang mahulugan ng isa sa mga iyon
  rationale: Ipinahahayag ng כֹּל אֲשֶׁר ang malawak na saklaw na “anumang,” at natural na naihahatid ng “mahulugan” ang paglagpak ng isa sa mga tinutukoy na hayop sa isang bagay.
- source_word: בְּמֹתָם
  choice: kapag patay na ang mga ito
  rationale: Tinutukoy nito ang kalagayan o panahon ng kamatayan; nililinaw ng pangmaramihang “mga ito” na ang tinutukoy ay ang mga nilalang, hindi ang bagay na nahulugan.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Pinananatili ng “magiging” ang paglipat tungo sa kalagayang ritwal na marumi matapos madikitan ng patay na nilalang.
- source_word: מִכָּל כְּלִי עֵץ
  choice: anumang kagamitang yari sa kahoy
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa sisidlan, kasangkapan, o iba pang gamit; ang “kagamitan” ay angkop sa buong talaan.
- source_word: בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: damit, balat, o telang-sako
  rationale: Ang “damit” at “balat” ay tuwirang katumbas; ang “telang-sako” ay mas malinaw sa makabagong mambabasa kaysa “sako” lamang at tumutukoy sa magaspang na hinabing materyal.
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: anumang kagamitang ginagamit sa paggawa
  rationale: Pinananatili ang pangkalahatang buod ng mga kagamitang ginagamit sa gawain nang hindi nililimitahan ang מְלָאכָה sa isang tiyak na uri ng trabaho.
- source_word: בַּמַּיִם יוּבָא
  choice: Dapat itong ilagay sa tubig
  rationale: Literal na “dadalhin/papapasukin sa tubig” ang Hophil ng בוא. Ang “ilagay sa tubig” ay natural sa Filipino at hindi sapilitang nagpapasya kung lubusang paglulubog ang ibig sabihin.
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: at mananatiling marumi hanggang gabi; pagkatapos ay magiging malinis na ito
  rationale: Malinaw na ipinahahayag ang tagal ng ritwal na karumihan at ang kasunod na pagbabalik sa kalagayang malinis.
theological_decisions:
- issue: Kalikasan ng טמא at טהר
  choice: marumi / malinis sa kontekstong ritwal at legal
  alternative: nadungisan / dalisay; di-malinis / malinis
  rationale: Sa batas ng Levitico, inilalarawan ng mga salita ang katayuang ritwal at hindi kinakailangang moral na pagkakasala. Ang karaniwang pares na “marumi/malinis” ay madaling maunawaan at hindi nagdaragdag ng pahayag tungkol sa kasalanan.
- issue: Paraan ng paglalagay sa tubig
  choice: ilagay sa tubig
  alternative: ilubog sa tubig
  rationale: Hindi tahasang ginagamit ng Hebreo ang pandiwang nangangahulugang “ilubog”; pinananatili ng salin at talababa ang posibleng saklaw ng utos nang hindi pinipili nang tiyak ang lubusang paglulubog.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kagamitan” bilang malawak na katumbas ng כְּלִי, “telang-sako” para sa materyal na שָׂק, at ang nakasanayang “marumi/malinis” para sa katayuang ritwal. Nasa pangunahing teksto ang marker na [a].
