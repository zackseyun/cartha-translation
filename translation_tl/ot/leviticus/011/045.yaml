language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: tl
  text: Sapagkat ako si Yahweh, na nag-ahon[a] sa inyo mula sa lupain ng Egipto upang maging Diyos ninyo. At dapat kayong maging banal, sapagkat[b] banal ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na nag-aahon.” Ang Hebreo ay gumagamit ng pandiwari na maaaring isalin sa anyong pangkasalukuyan, bagaman ang tinutukoy na exodo ay naganap na.
    reason: lexical_alternative
  - marker: b
    text: O “dahil banal ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos upang mapanatili ang pagkakaiba nito sa titulong “Panginoon.”
- source_word: הַמַּעֲלֶה
  choice: na nag-ahon
  rationale: Ang pandiwaring mula sa עלה ay may larawang “pagpapaakyat.” Sa konteksto ng naganap nang exodo, natural sa Tagalog ang pangnagdaang “nag-ahon,” habang hindi ito pinapaliit sa simpleng “nagligtas.”
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Egipto
  rationale: Pinanatili ang tahasang אֶרֶץ, “lupain,” at ang pormulang tumutukoy sa exodo.
- source_word: לִהְיֹת לָכֶם לֵאלֹהִים
  choice: upang maging Diyos ninyo
  rationale: Natural na Tagalog ito para sa pormulang pangtipan at pinananatili ang ugnayang ipinahahayag ng “maging Diyos para sa inyo.”
- source_word: וִהְיִיתֶם
  choice: At dapat kayong maging
  rationale: Sa konteksto, ang anyo ay may lakas ng utos. Ipinahahayag ng “dapat” ang obligasyon nang hindi ginagawang mas matindi kaysa sa Hebreo.
- source_word: קְדֹשִׁים
  choice: banal
  rationale: Ang “banal” ang malawak at nakaugaliang katumbas; ang “ibinukod” lamang ay hindi sasaklaw sa buong kahulugan sa kontekstong ito.
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: sapagkat banal ako
  rationale: Ipinakikita ng “sapagkat” na ang kabanalan ng Diyos ang batayan ng hinihinging kabanalan sa Israel, at pinananatili ang mariing ayos ng sugnay.
theological_decisions:
- issue: Batayang pangtipan ng kabanalan
  choice: Iniuugnay ang hinihinging kabanalan ng Israel sa pagkakakilanlan ni Yahweh, sa pag-ahon niya sa kanila mula sa Egipto, at sa pagiging Diyos nila.
  alternative: Ituring ang talata bilang tagubilin lamang tungkol sa ritwal na kalinisan.
  rationale: Bagaman mga tuntunin sa pagkain ang agarang konteksto, tahasang ibinabatay ng talata ang utos sa exodo, sa ugnayang pangtipan, at sa sariling kabanalan ng Diyos.
- issue: Lakas ng וִהְיִיתֶם
  choice: 'Isinalin bilang obligasyon: “dapat kayong maging banal.”'
  alternative: “At magiging banal kayo.”
  rationale: Ang sunod-sunod na anyong pandiwa sa konteksto ay may lakas na nag-uutos, hindi lamang nagsasaad ng mangyayari.
translation_notes:
  register: Makabago ngunit marangal na Filipino; ginamit ang “Yahweh” bilang personal na pangalan, “nag-ahon” upang mapanatili ang larawang pagpapaakyat mula sa Egipto, at “dapat” upang malinaw na maipahayag ang lakas ng utos.
