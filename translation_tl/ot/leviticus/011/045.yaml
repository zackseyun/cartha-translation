  source_fidelity: 'Tapat ang salin sa Hebreo: pinananatili ang pangalang Yahweh, ang tahasang “lupain ng Egipto,” ang layuning “maging Diyos ninyo,” at ang utos na maging banal. Ang “nag-ahon” ay angkop na nakapreserba ang larawan ng pagpapaakyat sa pandiwaring הַמַּעֲלֶה; maayos ding tinutukoy ng talababa ang posibleng anyong pangkasalukuyan.'
