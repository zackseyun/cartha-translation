base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: tl
  text: 'Ito ang mga ibon na dapat ninyong ituring na kasuklam-suklam: hindi dapat kainin ang mga ito; kasuklam-suklam ang mga ito—ang agila[a], ang buwitre[b], at ang itim na buwitre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi laging matiyak kung anong mga uri ng ibon ang tinutukoy ng mga pangalang Hebreo sa talaang ito. Ang “agila” ay maaari ring tumukoy nang mas malawak sa isang malaking ibong mandaragit o maging sa isang uri ng buwitre.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “buwitreng may balbas” o “lammergeier.” Sa matatandang salin sa Ingles, “ossifrage.”
    reason: lexical_alternative
  - marker: c
    text: Hindi tiyak ang pagkakakilanlan ng ibong ito. Sa ilang salin ay “osprey,” at sa iba naman ay isang uri ng agila o buwitre.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: dapat ninyong ituring na kasuklam-suklam
  rationale: Ipinahahayag ng Piel ang sadyang pagtrato o pagkilala sa mga ibon bilang karima-rimarim sa konteksto ng mga tuntunin sa pagkain, hindi lamang isang damdamin ng pagkasuklam.
- source_word: מִן הָעוֹף
  choice: Sa mga ibon
  rationale: 'Likas sa modernong Tagalog ang pariralang ito at naipahihiwatig nito ang partitive na diwa: ang mga sumusunod ay kabilang sa mas malaking pangkat ng mga ibon.'
- source_word: לֹא יֵאָכְלוּ
  choice: Hindi dapat kainin ang mga ito
  rationale: Pinananatili nito ang balintiyak na pagbabawal ng Hebreo sa malinaw at likas na wikang legal sa Tagalog.
- source_word: שֶׁקֶץ
  choice: kasuklam-suklam
  rationale: Pinananatili nito ang matinding evaluative at ritwal na diwa ng salita nang hindi ito pinapantay lamang sa teknikal na katawagang “marumi.”
- source_word: הַנֶּשֶׁר
  choice: ang agila
  rationale: Ito ang tradisyonal at posibleng salin, ngunit kinikilala sa talababa na maaaring mas malawak ang saklaw ng salitang Hebreo at tumukoy sa isang malaking ibong mandaragit o kumakain ng bangkay.
- source_word: הַפֶּרֶס
  choice: ang buwitreng may balbas
  rationale: Malamang na tumutukoy ito sa bearded vulture o lammergeier. Ang deskriptibong katawagang Tagalog ay mas malinaw sa karaniwang mambabasa kaysa sa hiniram na pangalang teknikal.
- source_word: הָעָזְנִיָּה
  choice: ang itim na buwitre
  rationale: Isa itong makabagong mungkahing pagkakakilanlan na angkop sa konteksto, ngunit hindi tiyak ang eksaktong uri kaya pinanatili ang pag-aalinlangan sa talababa.
