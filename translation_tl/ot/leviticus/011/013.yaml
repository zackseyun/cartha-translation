translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dapat ninyong ituring” upang mapanatili ang legal at evaluative na lakas ng utos, at ang “kasuklam-suklam” upang maulit ang mahalagang salitang-ugat gaya ng nasa Hebreo. Inilagay sa mga talababa ang tunay na kawalang-katiyakan sa pagkilala sa tatlong uri ng ibon.
