  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: tl
  text: Ngunit kung nilagyan ng tubig ang binhi, at malaglag dito ang alinman sa kanilang mga bangkay[a], magiging marumi ito para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga patay na katawan.” Ang Hebreong נְבֵלָה ay tumutukoy sa bangkay ng hayop; mas angkop sa konteksto ng mga batas sa ritwal na kalinisan ang “bangkay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyon at ang pagsalungat nito sa kalagayang binanggit sa naunang talata.
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: nilagyan ng tubig ang binhi
  rationale: Natural na Filipino na pinananatili ang pasibong diwa ng Hophal ng נתן at ang kongkretong kahulugan ng tubig na inilagay sa binhi.
- source_word: וְנָפַל
  choice: at malaglag
  rationale: Ang anyong pangkondisyon na “malaglag” ay angkop sa estilo ng batas na naglalahad ng isang posibleng pangyayari.
- source_word: מִנִּבְלָתָם
  choice: ang alinman sa mga bangkay ng mga iyon
  rationale: Partitibo ang gamit ng מִן dito; ang נְבֵלָה ay bangkay ng hayop sa konteksto ng mga batas sa kalinisan.
- source_word: עָלָיו
  choice: dito
  rationale: Likas na tumutukoy pabalik sa binhi at naiiwasan ang mabigat na pag-uulit.
- source_word: טָמֵא הוּא לָכֶם
  choice: marumi iyon para sa inyo
  rationale: Pinananatili ang pormulang nagpapahayag ng ritwal na karumihan at ang pananaw ng pamayanang tinutukoy ng לָכֶם.
theological_decisions:
- issue: Kalikasan ng salitang טָמֵא
  choice: marumi
  alternative: nadungisan; di-malinis
  rationale: Tumutukoy ito sa katayuang ritwal ayon sa batas ng Levitico, hindi sa likas na pagkakasalang moral.
translation_notes:
  register: Makabago at dignified na Filipino; malinaw ang anyong pangkondisyon at pinananatili ang teknikal na diwa ng ritwal na karumihan nang hindi ito ginagawang moral na hatol.
