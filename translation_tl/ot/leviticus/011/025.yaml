  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: tl
  text: At ang sinumang magdala ng alinman sa mga bangkay ng mga iyon ay dapat labhan ang kanyang mga damit, at magiging marumi siya hanggang kinagabihan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga bangkay ng mga iyon.” Mas pormal na maisasalin nang ganito ang pagkakabuo sa Hebreo, ngunit mas natural na ipinahahayag ng “alinman sa mga bangkay ng mga iyon” ang distributibong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: At ang sinuman
  rationale: Ikinakabit ng וְ ang tuntuning ito sa naunang konteksto, at ang כָּל kasama ng pandiwaring pantukoy ay may panlahatang diwa. Likas at malinaw sa modernong Tagalog ang “ang sinuman.”
- source_word: הַ/נֹּשֵׂא
  choice: magdala
  rationale: Ang נָשָׂא ay nangangahulugang magbuhat o magdala. Sa konteksto ng batas sa ritwal na kalinisan, natural na ipinahihiwatig ng “magdala” ang pagbuhat at paglilipat ng bangkay.
- source_word: מִ/נִּבְלָתָ/ם
  choice: ng alinman sa mga bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay tumutukoy sa bangkay ng hayop sa mga batas ng Levitico. Ang מִן pagkatapos ng נָשָׂא ay maaaring magpahayag ng bahagi o sinuman/alinman mula sa isang uri; kaya pinananatili ng “alinman sa mga bangkay” ang distributibong diwa, samantalang nililinaw ng “ng mga iyon” ang pangmaramihang reperensiya.
- source_word: יְכַבֵּס
  choice: ay dapat maglaba
  rationale: Ang imperpektibo rito ay nagpapahayag ng legal na obligasyon. Ang “dapat maglaba” ay malinaw at natural na naglalahad ng iniutos na kilos.
- source_word: בְּגָדָי/ו
  choice: ng kanyang mga damit
  rationale: Ang בְּגָדִים ay “mga damit.” Pinananatili ng “kanyang” ang pang-isahang reperensiya nang hindi ginagawang tiyak ang kasarian sa Tagalog.
- source_word: וְ/טָמֵא
  choice: at magiging marumi siya
  rationale: Sa kontekstong ito, ang טָמֵא ay ritwal na karumihan, hindi moral na kasamaan. Malinaw na ipinahihiwatig ng “magiging marumi” ang kalagayang ibinubunga ng pagdadala.
- source_word: עַד הָ/עָרֶב
  choice: hanggang sa gabi
  rationale: Itinatakda ng parirala ang haba ng ritwal na karumihan. Ang “hanggang sa gabi” ay pormal ngunit natural sa Tagalog.
theological_decisions:
- issue: Ang ritwal na kahulugan ng טָמֵא
  choice: “magiging marumi” bilang terminong tumutukoy sa ritwal na kalagayan
  alternative: “magiging karumal-dumal” o wikang nagpapahiwatig ng moral na kasalanan
  rationale: Ang talata ay tungkol sa seremonyal o ritwal na karumihan dahil sa paghawak ng bangkay, hindi isang tuwirang paghatol sa moral na pagkatao.
- issue: Pang-isahang panlalaking anyo sa pangkalahatang tuntuning legal
  choice: “ang sinuman … kanyang … siya”
  alternative: Tahasang panlalaking “ang sinumang lalaki … kanyang”
  rationale: Kinakatawan ng panlalaking pang-isahan sa Hebreo ang isang indibidwal sa pangkalahatang tuntunin. Hindi minamarkahan ng mga panghalip sa Tagalog ang kasarian, kaya napapanatili ang pang-isahan at panlahat na saklaw nang hindi nagdaragdag ng kasariang hindi kailangang tahasang sabihin.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig para sa tekstong legal. Ginamit ang “dapat” upang ihatid ang obligasyon at ang karaniwang salitang “mga damit” sa halip na mas makalumang “mga kasuutan.”
