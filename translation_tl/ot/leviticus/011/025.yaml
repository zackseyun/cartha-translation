  naturalness: Natural sa makabagong Tagalog ang kabuuang ayos, ngunit mas idiomatiko at malinaw ang "labhan ang kanyang mga damit" kaysa "maglaba ng kanyang mga damit." Ang "hanggang kinagabihan" ay mas eksaktong tumutukoy sa evening kaysa sa mas malawak na "hanggang sa gabi."
  terminology: Ang "bangkay," "mga damit," at "marumi" ay angkop sa konteksto ng mga batas sa ritwal na kalinisan. Hindi dapat palitan ang "marumi" ng pananalitang nagpapahiwatig ng moral na pagkakasala. Nananatiling angkop ang "alinman sa mga bangkay ng mga iyon" para sa distributibong bisa ng Hebreong parirala.
  issues:
