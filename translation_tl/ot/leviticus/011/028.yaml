  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: tl
  text: Ang sinumang magbuhat ng bangkay ng mga hayop na iyon ay dapat maglaba ng kaniyang mga damit at magiging marumi hanggang sa kinagabihan.[a] Marumi ang mga hayop na iyon para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bangkay ng mga hayop na iyon.” Maaaring unawain ang Hebreo bilang tumutukoy nang paisa-isa sa mga hayop na pinag-uusapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: Ang sinumang magbuhat
  rationale: Ang may-artikulong participle ay ginagamit bilang pangkalahatang tuntunin. Likas sa modernong Tagalog ang “ang sinumang” at napananatili nito ang legal na saklaw.
- source_word: נִבְלָתָם
  choice: bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay bangkay ng hayop. Ipinahihiwatig ng pangmaramihang hulapi ang mga hayop na tinutukoy sa naunang konteksto, habang maaaring unawain ang pangngalan bilang kolektibo o distributibo.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay dapat maglaba ng kanyang mga damit
  rationale: May pautos na puwersa ang imperfect sa kontekstong legal. Ang “dapat” ay malinaw at natural sa kasalukuyang Tagalog; ang “maglaba ng kanyang mga damit” ay tumpak sa kilos at layon.
- source_word: וְטָמֵא
  choice: at magiging marumi siya
  rationale: Ipinahahayag nito ang kalagayang ritwal na resulta ng paghawak sa bangkay. Nililinaw ng “siya” ang paksa nang hindi dinaragdagan ang diwa.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Natural na katumbas ito ng pariralang Hebreo at pinananatili ang hangganan ng panahon.
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: Marumi ang mga iyon para sa inyo
  rationale: Tumutukoy ang pangmaramihang “mga iyon” sa mga hayop na pinag-uusapan. Pinananatili ng “para sa inyo” ang לָכֶם nang hindi labis na ipinapaliwanag.
theological_decisions:
- issue: Terminolohiya ng ritwal na karumihan
  choice: marumi
  alternative: di-malinis; nadungisan
  rationale: Sa mga batas ng Levitico, ang טמא ay teknikal na kalagayang ritwal. Ang “marumi” ay karaniwan at nauunawaan, at hindi nito awtomatikong itinutumbas ang ritwal na kalagayan sa moral na pagkakasala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “dapat” para sa likas na pagpapahayag ng obligasyon at pinanatili ang teknikal na “marumi” para sa ritwal na kalagayan.
