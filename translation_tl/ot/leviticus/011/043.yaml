base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: tl
  text: Huwag ninyong gawing kasuklam-suklam ang inyong sarili sa pamamagitan ng anumang nilalang na naglipana[a], at huwag ninyong gawing marumi ang inyong sarili sa pamamagitan ng mga iyon, upang hindi kayo maging marumi dahil sa mga iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anumang nilalang na gumagapang.” Ang salitang Hebreo ay tumutukoy sa malawak na uri ng maliliit na nilalang na nagkukumpulan, naglipana, o gumagapang.
    reason: lexical_alternative
  - marker: b
    text: Ang “marumi” rito ay tumutukoy sa ritwal na katayuan ayon sa mga tuntunin ng kabanatang ito, hindi lamang sa pisikal na karumihan.
    reason: contextual_clarification
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: gawing kasuklam-suklam
  rationale: Pinananatili nito ang diwa ng שׁקץ na maging kasuklam-suklam o karima-rimarim, at hindi ito ipinaghahalo sa katawagang טמא na kasunod.
- source_word: נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili
  rationale: Sa konstruksiyong ito, ang נֶפֶשׁ ay tumutukoy sa buong sarili o pagkatao, hindi lamang sa ‘kaluluwa.’
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: dahil sa anumang nilalang na naglipana
  rationale: Saklaw ng שׁרץ ang maliliit na nilalang na gumagapang, nagkukumpulan, o dumarami nang sagana. Ang ‘naglipana’ ay mas malawak kaysa ‘gumagapang’ lamang, bagaman hindi ganap na matutularan sa natural na Tagalog ang pag-uulit ng salitang-ugat sa Hebreo.
- source_word: תִטַּמְּאוּ
  choice: gawing marumi ang inyong sarili
  rationale: Ipinapakita ng anyong reflexive na sila mismo ang magpapasok sa kanilang sarili sa kalagayang itinuturing na marumi sa mga tuntunin ng kabanatang ito.
- source_word: בָּהֶם / בָּם
  choice: sa pamamagitan ng mga iyon / dahil sa mga iyon
  rationale: Ipinahihiwatig ng mga pariralang ito na ang naturang mga nilalang ang paraan o sanhi ng pagiging marumi.
- source_word: וְנִטְמֵתֶם
  choice: at sa gayon ay maging marumi
  rationale: Pinananatili ang positibong anyo at bunga ng sugnay sa Hebreo sa halip na magdagdag ng tahasang ikalawang negasyon na wala sa teksto.
theological_decisions:
- issue: Kahulugan ng טמא sa mga tuntunin tungkol sa kabanalan
  choice: marumi
  alternative: ritwal na marumi; nadungisan
  rationale: Ang ‘marumi’ ang pinakapayak at matatag na katumbas at hindi agad nagpapasya na moral na pagkakasala ang tinutukoy. Ipinaliliwanag ng talababa na ang salita ay tumutukoy sa katayuang itinakda ng mga tuntunin sa kontekstong ito.
- issue: Ugnayan ng huling sugnay sa pagbabawal
  choice: 'bunga: ‘at sa gayon ay maging marumi’'
  alternative: 'layunin o babala: ‘upang hindi kayo maging marumi’'
  rationale: Ang huling pandiwa sa Hebreo ay walang tahasang negasyon. Ang salin ay nagpapanatili sa natural na pagbasa rito bilang ibinungang kalagayan, nang hindi nagdaragdag ng ‘hindi.’
translation_notes:
  register: Makabago at dignified na Filipino, na gumagamit ng karaniwang bokabularyo. Iniiwasan ang sobrang teknikal na ‘ritwal na di-malinis’ sa pangunahing teksto; inilalagay sa talababa ang kailangang paglilinaw. Ang pag-uulit ng ‘marumi’ ay sinadyang panatilihin upang tumbasan ang diin ng Hebreo.
