  verdict: revise
  source_fidelity: 'Ang pangunahing mga katumbas ay tapat sa Hebreo: ang שׁקץ ay naihiwalay sa kasunod na טמא, ang נַפְשֹׁתֵיכֶם ay wastong inuunawa bilang buong sarili, at ang malawak na kategoryang שׁרץ ay naipapahayag ng “nilalang na naglipana.” Gayunman, ang huling “at sa gayon ay maging marumi” ay hindi malinaw na naiuugnay sa dalawang pagbabawal sa Tagalog at maaaring mabasa na parang positibong resulta na ipinag-uutos. Sa konteksto ng magkakasunod na negatibong utos, ang paglalagay ng “upang hindi” ay isang ligtas at natural na pagsasalin ng babala/resultang ipinahihiwatig ng pangwakas na sugnay, alinsunod din sa English POB audit trail.'
  naturalness: Makabago at marangal ang rehistro, ngunit ang “Huwag ... at sa gayon ay maging ...” ay mabigat at hindi likas na konstruksyon sa Filipino. Ang “upang hindi kayo maging marumi” ay mas malinaw at idiomatiko. Ang paulit-ulit na “sa pamamagitan ng” ay pinanatili kung saan instrumental ang diwa; “dahil sa” sa huling sugnay ay natural na nagpapahayag ng sanhi.
  terminology: Ang “kasuklam-suklam” ay angkop para sa שׁקץ at ang “marumi” ay pinapanatili para sa טמא upang hindi pagsamahin ang magkaibang termino. Nililinaw ng talababa na ritwal na katayuan ang tinutukoy, nang hindi ito ginagawang awtomatikong moral na pagkakasala.
