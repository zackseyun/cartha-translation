  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: tl
  text: Ito ang kautusan[a] tungkol sa mga hayop, mga ibon, bawat buhay na nilalang[b] na gumagalaw sa tubig, at bawat nilalang na naglipana sa lupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagubilin.” Ang salitang Hebreo ay maaaring mangahulugan ng may-awtoridad na pagtuturo at hindi lamang ng batas sa makitid na diwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “bawat nabubuhay na nilalang.” Ang Hebreong parirala ay tumutukoy sa buhay na nilalang, hindi partikular sa isang di-materyal na “kaluluwa.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa kalupaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: ang kautusan tungkol sa
  rationale: Sa kontekstong ito, ang תּוֹרָה ay tumutukoy sa kapani-paniwalang buod ng mga tuntuning nauna tungkol sa malinis at maruming mga nilalang. Likas sa Filipino ang “kautusan tungkol sa,” habang pinananatili ang diwa ng may-awtoridad na pagtuturo.
- source_word: הַבְּהֵמָה
  choice: mga hayop
  rationale: Ang בְּהֵמָה ay maaaring tumukoy sa malalaking hayop sa lupa, lalo na sa maaamong hayop o alagang hayop. Mas ligtas at masaklaw dito ang “mga hayop” kaysa “mga alagang hayop,” sapagkat binubuod ng talata ang mga uring tinalakay sa kabanata.
- source_word: הָעוֹף
  choice: mga ibon
  rationale: Bagaman maaaring masaklaw ng עוֹף ang mga lumilipad na nilalang, “mga ibon” ang pinakanatural na katawagang pangkategorya sa kasalukuyang Filipino at angkop sa konteksto.
- source_word: כָל נֶפֶשׁ הַחַיָּה
  choice: bawat buhay na nilalang
  rationale: Ang pariralang נֶפֶשׁ הַחַיָּה ay idyoma para sa isang buhay o humihingang nilalang, hindi partikular na pagtukoy sa isang di-materyal na kaluluwa.
- source_word: הָרֹמֶשֶׂת
  choice: na gumagalaw
  rationale: Ang רמש ay nagsasaad ng pagkilos o paggapang ng mga nilalang. Dahil mga nilalang sa tubig ang tinutukoy, mas natural at sapat na malawak ang “gumagalaw” kaysa “gumagapang.”
- source_word: בַּמָּיִם
  choice: sa tubig
  rationale: Bagaman maramihan ang anyong Hebreo, karaniwang pangkalahatang katawagan sa Filipino ang “tubig,” at natural nitong ipinapahayag ang tirahan ng mga nilalang na tinutukoy.
- source_word: וּלְכָל נֶפֶשׁ
  choice: at bawat nilalang
  rationale: Pinaiikli ang ikalawang paggamit ng נֶפֶשׁ upang maiwasan ang mabigat na pag-uulit, nang hindi binabago ang tinutukoy nitong uri ng buhay na nilalang.
- source_word: הַשֹּׁרֶצֶת
  choice: na naglipana
  rationale: Ang שׁרץ ay naglalarawan ng pagdami o sama-samang pagkilos ng maliliit na nilalang. Ipinahihiwatig ng “naglipana” ang ganitong pagkilos nang mas malinaw kaysa sa pangkalahatang “gumagalaw,” bagaman hindi nito hinihigpitan ang salita sa literal na paggapang lamang.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Sa paghahambing sa “tubig,” natural na tumutukoy ang אֶרֶץ sa tuyong lupa o kalupaan. Ang “sa lupa” ay malinaw at idiomatiko sa Filipino.
