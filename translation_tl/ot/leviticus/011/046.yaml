translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kautusan” para sa pormal na buod ng mga tuntunin, ngunit nilagyan ito ng talababa upang mapanatili ang mas malawak na diwa ng תּוֹרָה. Iniwasan ang sobrang teknikal o makalumang mga katawagan.
