  text: וְ/כִ֤י יָמוּת֙ מִן הַ/בְּהֵמָ֔ה אֲשֶׁר הִ֥יא לָ/כֶ֖ם לְ/אָכְלָ֑ה הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: tl
  text: At kung mamatay ang isa sa mga alagang hayop na maaari ninyong kainin[a], ang sinumang humipo sa bangkay nito ay magiging marumi hanggang kinagabihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “na para sa inyo bilang pagkain.” Tinutukoy ng pariralang Hebreo ang mga alagang hayop na pinahihintulutang kainin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang ugnayan sa naunang mga tuntunin sa pamamagitan ng וְ at ang kondisyunal na diwa ng כִּי.
- source_word: יָמוּת
  choice: mamatay
  rationale: Ang qal imperfect sa kondisyunal na sugnay ay likas na isinasalin sa pangkasalukuyan o panghinaharap na diwa; natural sa Tagalog ang “mamatay.”
- source_word: מִן הַבְּהֵמָה
  choice: ang isa sa mga hayop
  rationale: 'Partitibo ang מִן: tumutukoy ito sa isang hayop mula sa uri ng בְּהֵמָה. Sapat ang “mga hayop” sa konteksto, habang malinaw na ipinahahayag ng “isa sa” ang partitive na diwa.'
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: na maaari ninyong kainin
  rationale: Tinutukoy ng parirala ang mga hayop na pinahihintulutang gawing pagkain. Natural ito sa modernong Tagalog at hindi ipinahihiwatig na kinakailangang kainin ang hayop.
- source_word: הַנֹּגֵעַ
  choice: ang sinumang humipo
  rationale: Ang substantival participle ay tumutukoy sa taong gumagawa ng kilos; malinaw at natural ang “ang sinumang humipo.”
- source_word: בְּנִבְלָתָהּ
  choice: sa bangkay nito
  rationale: Ang נְבֵלָה ay bangkay ng hayop na namatay. Ang “bangkay” ang maikli at karaniwang katumbas sa konteksto ng mga batas sa ritwal na kalinisan.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinahahayag ng pandiwa ang pagiging o pagkakaroon ng ritwal na karumihan; ang “magiging marumi” ay malinaw na nagpapakita ng pagbabagong dulot ng paghipo.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Natural na Tagalog para sa takdang panahon ng ritwal na karumihan at pinananatili ang tiyak na anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maaari ninyong kainin” upang natural na ipahayag ang pinahihintulutang uri ng hayop, at “marumi” sa ritwal na diwa ayon sa konteksto ng Levitico.
