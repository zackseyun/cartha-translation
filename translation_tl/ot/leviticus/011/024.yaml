  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: tl
  text: 'Dahil sa mga ito, magiging marumi kayo: ang sinumang humipo sa bangkay ng mga hayop na ito ay magiging marumi hanggang kinagabihan.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At hinggil sa mga ito, magiging marumi kayo.” Maaaring ipakilala ng pambungad na parirala ang sumusunod na pangkat sa pangkalahatan sa halip na tuwirang tukuyin ang sanhi ng pagiging marumi.'
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, isahan ang salitang “bangkay” ngunit may hulaping pangmaramihan na nangangahulugang “ng mga ito”; maaari ring isalin: “sa mga bangkay ng mga hayop na ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: At sa mga ito
  rationale: Pinananatili ng parirala ang posibilidad na ang לְ ay tumutukoy sa sanhi o sa paksang ipinakikilala. Sa konteksto, likas itong mababasa bilang pagiging marumi dahil sa mga ito, ngunit hindi isinasara ang mas pangkalahatang diwang “hinggil sa mga ito.”
- source_word: תִּטַּמָּאוּ
  choice: kayo magiging marumi
  rationale: Ipinahahayag nito ang kalagayang ritwal na ibinubunga ng pakikipag-ugnay, nang hindi nagpapahiwatig ng kasalanang moral o kusang pagdungis sa sarili.
- source_word: כָּל הַנֹּגֵעַ
  choice: ang sinumang humipo
  rationale: Natural sa makabagong Tagalog at tumpak na nagpapahayag ng pangkalahatang saklaw ng konstruksiyong may כָּל at isahang participle.
- source_word: בְּנִבְלָתָם
  choice: sa bangkay ng mga ito
  rationale: Ang נְבֵלָה ay bangkay ng patay na hayop. Ang pariralang “ng mga ito” ay kumakatawan sa isahang pangngalan na may pangmaramihang hulapi, habang nananatiling natural sa Tagalog.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Tumutugma sa isahang pangkalahatang simuno at malinaw na tumutukoy sa pagpasok sa kalagayang ritwal na marumi.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Karaniwang Tagalog para sa hangganan ng panahong itinakda ng tekstong Hebreo.
theological_decisions:
- issue: Kalikasan ng karumihan sa batas tungkol sa kabanalan
  choice: Gamitin ang “marumi” bilang katawagang tumutukoy sa ritwal na karumihan
  alternative: “nadungisan” o “di-dalisay” na maaaring mapagkamalang moral na kasalanan
  rationale: Ang talata ay tungkol sa ritwal na kalagayang dulot ng paghipo sa bangkay ng hayop, hindi tuwirang paghahatol sa pagkakasalang moral.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang terminong “marumi” bilang pamilyar na katawagan sa ritwal na karumihan at iniwasan ang mga salitang maaaring magpahiwatig agad ng moral na dungis.
