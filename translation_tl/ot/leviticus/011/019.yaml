  text: and the stork[a], the heron according to its kind, and the hoopoe[c][b], and the bat.
translation:
  language: tl
  text: ang tagak, ang bakaw[a] ayon sa uri nito, ang hoopoe[b], at ang paniki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong ibong tinutukoy ng salitang Hebreo; maaari itong tumukoy sa ibis o sa ibang ibong-tubig na mahaba ang paa.
    reason: lexical_alternative
  - marker: b
    text: Sa mga lumang salin, “lapwing”; mas malamang na hoopoe ang tinutukoy ng salitang Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲסִידָה
  choice: tagak
  rationale: Ang חֲסִידָה ay karaniwang kinikilalang stork. Ginamit ang pangkalahatang pangalang Filipino na “tagak,” yamang ito ang pinakanatural at madaling maunawaang katawagan sa ganitong ibong mahaba ang paa, bagaman hindi nito laging itinatangi ang stork sa ibang kahawig na ibon.
- source_word: אֲנָפָה
  choice: bakaw
  rationale: Hindi tiyak ang eksaktong ibong tinutukoy ng אֲנָפָה; ang “bakaw” ay natural na katawagang Filipino para sa heron at angkop sa malamang na uri ng ibon.
- source_word: לְמִינָהּ
  choice: ayon sa uri nito
  rationale: Pinananatili nito ang kahulugan ng pag-uuri sa kaugnay na mga uri o barayti nang hindi ipinapasok ang mas makabagong teknikal na konsepto ng species.
- source_word: דּוּכִיפַת
  choice: hoopoe
  rationale: Mas matibay ang makabagong leksikal na pagkakakilanlan na hoopoe kaysa sa tradisyonal na lapwing. Hiniram ang internasyonal na pangalan dahil walang malawak na kinikilalang karaniwang pangalang Tagalog para rito.
- source_word: עֲטַלֵּף
  choice: paniki
  rationale: Tiyak ang pagkakakilanlan ng salita bilang bat; “paniki” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: וְאֵת / וְאֶת
  choice: ang …, ang …, … at ang
  rationale: Hindi isinasalin nang hiwalay ang panandang tuwirang layon; ang mga pang-ugnay at kuwit sa natural na listahang Tagalog ang naghahatid sa estruktura ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, payak, at marangal na Filipino. Ginamit ang “bakaw” bilang natural na katawagang Filipino sa heron, ngunit inilagay sa talababa ang kawalang-katiyakan. Pinanatili ang “hoopoe” bilang hiram na pangalang zoolohikal upang maiwasan ang maling pagkakakilanlan. Ang “ayon sa uri nito” ay inilagay kaagad pagkatapos ng bakaw, ayon sa sintaks ng Hebreo.
