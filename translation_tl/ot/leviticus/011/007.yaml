base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: tl
  text: At ang baboy[a], sapagkat may biyak itong kuko at ganap na hati ang kuko nito, ngunit hindi ito ngumunguya muli ng kinain,[b] ay marumi para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “swine.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi ito ngumunguya ng nginuyang pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: ang baboy
  rationale: Ang “baboy” ang karaniwan at natural na makabagong katawagan sa hayop; hindi kailangan ang mas luma o teknikal na termino.
- source_word: כִּי
  choice: bagaman
  rationale: Sa daloy ng pangungusap, ipinakikilala ng כִּי ang katangiang taglay ng baboy na sinusundan ng salungat na katangiang wala rito. Ang “bagaman” ay natural na naghahayag ng tensiyong ito sa Filipino nang hindi binabago ang batayan ng pag-uuri.
- source_word: מַפְרִיס פַּרְסָה
  choice: biyak ang kuko nito
  rationale: 'Natural na Filipino para sa kalagayang inilalarawan ng Hebreong parirala: ang paa ay may hating kuko.'
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: at lubos na nahahati ang kuko
  rationale: Pinananatili ang ikalawang, mas tiyak at madiing paglalarawan sa pagkakahati ng kuko sa halip na lubusang pagsamahin ito sa naunang parirala.
- source_word: גֵּרָה לֹא יִגָּר
  choice: hindi naman ito ngumunguya ng nginuyang pagkain
  rationale: Ipinahahayag ang karaniwang konsepto ng pagnguya muli sa pagkaing ibinalik mula sa sikmura. Nilalagyan ng talababa ang mas literal na kilos na “hindi nag-aahon” upang mapanatili ang anyo ng Hebreo.
- source_word: טָמֵא הוּא לָכֶם
  choice: ay marumi para sa inyo
  rationale: Ang “marumi” ang malinaw at tradisyonal na salin sa konteksto ng ritwal at batas sa pagkain; pinananatili ng “para sa inyo” ang kaugnayan nito sa mga kausap.
theological_decisions:
- issue: Kahulugan ng טָמֵא sa mga batas tungkol sa pagkain
  choice: marumi sa ritwal/pandiyeta na diwa
  alternative: dalisay na kasalungat ng pisikal o moral na marumi
  rationale: Sa Levitico 11, tumutukoy ito sa itinakdang kategorya para sa Israel hinggil sa pagkain at kabanalan, hindi sa pahayag na likas na masama sa moral ang hayop.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga gitling na pahaba upang maipakita nang natural ang pagsalungat ng dalawang katangian. Iniwasan ang sobrang teknikal na katawagan, habang pinanatili sa talababa ang mas literal na Hebreong idyoma.
