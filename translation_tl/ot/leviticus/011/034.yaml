base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: tl
  text: Anumang pagkaing maaaring kainin[a], kapag nalagyan ng tubig, ay magiging marumi; at anumang inuming maaaring inumin na nasa anumang sisidlan ay magiging marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “anumang pagkaing kinakain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: anumang pagkain
  rationale: Ang מִכָּל ay tumutukoy rito sa alinman sa pangkalahatang uri ng pagkain; natural at malinaw sa Filipino ang “anumang pagkain.”
- source_word: אֲשֶׁר יֵאָכֵל
  choice: maaaring kainin
  rationale: Pinananatili nito ang diwang nagpapakilala sa pagkaing maaaring kainin o angkop kainin, habang kinikilala sa talababa ang mas literal na pagbasa na “kinakain.”
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: na nalagyan ng tubig
  rationale: Natural itong katumbas sa Filipino ng literal na “na dinatnan/pinatungan ng tubig,” nang hindi nililimitahan kung paano napunta ang tubig sa pagkain.
- source_word: יִטְמָא
  choice: magiging marumi
  rationale: Sa konteksto ng mga tuntunin sa Levitico, ipinahihiwatig ng pandiwa ang pagpasok sa kalagayang marumi ayon sa ritwal, hindi karaniwang dumi lamang.
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: inuming maaaring inumin
  rationale: Malapit ito sa anyo at paralelismo ng Hebreo at tumutukoy sa bagay na maiinom.
- source_word: בְּכָל כְּלִי
  choice: sa anumang sisidlan
  rationale: Ang “sisidlan” ay malawak at angkop na katumbas ng כְּלִי sa marangal na rehistro ng batas.
theological_decisions:
- issue: Kahulugan ng pagiging marumi
  choice: “magiging marumi,” na nauunawaan sa konteksto bilang ritwal na karumihan
  alternative: “magiging ritwal na marumi”
  rationale: Hindi idinagdag sa pangunahing teksto ang salitang “ritwal” na wala rito sa Hebreo; sapat ang konteksto ng kabanata upang linawin ang uri ng karumihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na paralelismo ng pagkain at inumin, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
