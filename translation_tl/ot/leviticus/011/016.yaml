  text: and the ostrich[a], and the hawk, and the gull, and the falcon according to its kind,
translation:
  language: tl
  text: at ang avestrus[a], at ang lawin, at ang tagak-dagat, at ang palkon ayon sa uri nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pagkakakilanlan ng ilang ibong Hebreo sa talatang ito. Kabilang sa tradisyonal na mga alternatibo ang “kuwago” para sa “avestrus,” “kuwago” o ibong mandaragit sa gabi para sa “lawin,” “ibong kuku” (cuckoo) para sa “tagak-dagat,” at “lawin” para sa “palkon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: ang avestrus
  rationale: Ang parirala ay literal na “anak na babae ng ya'anah,” ngunit ginagamit bilang pangalan ng ibon sa talaang ito. Ang “avestrus” ang pinakakilalang makabagong pagkakakilanlan, bagaman hindi tiyak ang eksaktong ibon.
- source_word: הַתַּחְמָס
  choice: ang lawin
  rationale: Hindi tiyak ang uri; ang “lawin” ay natural na malawak na tawag sa ibong mandaragit at hindi nagpapanggap na tukoy ang species.
- source_word: הַשָּׁחַף
  choice: ang tagak-dagat
  rationale: Hindi tiyak ang katawagan, ngunit malawak na tinatanggap ang pagkakakilanlan dito bilang gull. Ginamit ang karaniwang Filipino na “tagak-dagat” nang hindi pinipilit ang mas tiyak na species.
- source_word: הַנֵּץ
  choice: ang palkon
  rationale: Tumutukoy ito sa ibong mandaragit na maaaring lawin o palkon. Pinili ang “palkon” upang maiba sa תַּחְמָס habang nananatili sa suportadong saklaw ng kahulugan.
- source_word: לְמִינֵהוּ
  choice: ayon sa kani-kaniyang uri
  rationale: Bagaman pang-isahan ang anyong Hebreo, saklaw nito ang iba't ibang uri ng huling binanggit na ibon; natural sa Filipino ang “kani-kaniyang uri” at pinananatili nito ang diwang pangklasipikasyon.
- source_word: וְאֵת / וְאֶת
  choice: at / ang
  rationale: Ang waw ay isinaling “at” upang ipakitang nagpapatuloy ang talaan; walang tuwirang katumbas sa Filipino ang pananda sa layon na אֵת, kaya ipinahahayag lamang ito sa karaniwang kayarian ng listahan.
