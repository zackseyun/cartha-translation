  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: tl
  text: At bawat sisidlang yari sa luwad[a] na mahulugan ng alinman sa mga iyon—magiging marumi ang lahat ng nasa loob nito, at babasagin ninyo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sisidlang palayok.” Ang Hebreo ay tumutukoy sa sisidlang yari sa luwad na pinatigas sa apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: sisidlang luwad
  rationale: Ang כְּלִי ay isang kagamitan o sisidlan, at nililinaw ng חֶרֶשׂ na yari ito sa luwad o palayok. Likas at malinaw sa makabagong Tagalog ang “sisidlang luwad,” habang pinananatili ang materyal na mahalaga sa tuntuning ito.
- source_word: יִפֹּל מֵהֶם אֶל תּוֹכוֹ
  choice: na mahulugan ng isa sa mga iyon
  rationale: Ipinahihiwatig ng parirala na may isa mula sa mga naunang binanggit na nilalang o bangkay na nahuhulog papasok sa sisidlan. Likas na ipinapahayag ng “mahulugan” ang pagpasok ng nahulog na bagay sa loob nito.
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: ang lahat ng nasa loob nito
  rationale: Pinananatili ng “lahat” ang saklaw ng כֹּל, at malinaw na tumutukoy ang parirala sa buong laman ng sisidlan.
- source_word: יִטְמָא
  choice: magiging marumi
  rationale: Sa konteksto ng Levitico, tumutukoy ang pandiwa sa pagkakaroon ng kalagayang ritwal na marumi. Naipapakita ng “magiging” na ang karumihan ay resulta ng pagkahulog sa sisidlan.
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: at babasagin ninyo ang sisidlan
  rationale: Ginagawang tahas ang tinutukoy ng panghalip upang maiwasan ang kalituhan sa “lahat ng nasa loob nito.” Ang “babasagin” ay natural na utos at hindi nagpapalabis sa lakas ng pandiwa.
theological_decisions:
- issue: Kahulugan ng ritwal na karumihan
  choice: magiging marumi
  alternative: magiging di-malinis
  rationale: Ang “marumi” ang karaniwan at madaling maunawaang katawagan sa mga batas ng kalinisan sa Levitico. Hindi ito pinalawak upang mangahulugang moral na kasalanan; hinahayaan ng konteksto na ipakita ang ritwal na diwa nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mahulugan” at “nasa loob” para sa likas na daloy, habang pinananatili ang pangkalahatang saklaw ng utos at ang bokabularyo ng ritwal na karumihan.
