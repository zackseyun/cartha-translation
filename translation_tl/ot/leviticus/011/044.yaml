  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: tl
  text: Sapagkat ako si Yahweh na inyong Diyos. Kaya italaga ninyo ang inyong mga sarili[a] at maging banal, sapagkat ako ay banal. Huwag ninyong dungisan ang inyong mga sarili sa pamamagitan ng anumang gumagapang na nilalang na gumagalaw sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pabanalin ninyo ang inyong mga sarili.” Ang pandiwang Hebreo ay mapanumbalik at nangangahulugang ibukod o italaga ang sarili bilang banal.
    reason: lexical_alternative
  - marker: b
    text: Ang “gumagapang na nilalang” ay maaari ring isaling “nagsisiksikang nilalang”; ang kasunod na pandiwa ay literal na “gumagalaw sa lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Sa pormulang tipan kung saan si Yahweh ang tinutukoy, ang anyo ay may isahang kahulugang “Diyos.”
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: italaga ninyo ang inyong sarili
  rationale: 'Ipinahahayag ng hitpael ang mapanumbalik na pagkilos: itatalaga ng bayan ang kanilang sarili bilang banal. Likas ito sa modernong Tagalog at pinananatili ang ritwal at moral na diwa.'
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: at maging banal
  rationale: Pinananatili ang pautos na puwersa at ang kalagayang bunga ng pagtatalaga.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Ang “banal” ang karaniwan at angkop na katumbas, at pinananatili nito ang tahasang ugnayan ng kabanalan ng bayan sa kabanalan ng Diyos.
- source_word: תְטַמְּאוּ
  choice: dungisan
  rationale: Ipinahahayag nito ang pagdudulot ng karumihan nang hindi nililimitahan ang diwa sa pisikal na dumi lamang.
- source_word: נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa mismong mga tao. Iniiwasan ng saling ito ang di-kinakailangang pagpapakahulugang teknikal sa “kaluluwa.”
- source_word: שֶּׁרֶץ
  choice: gumagapang na nilalang
  rationale: Natural itong katawagan sa Tagalog para sa maliliit na hayop na sama-samang kumikilos o gumagapang; inilalahad sa talababa ang mas literal na diwang “nagsisiksikang nilalang.”
- source_word: הָרֹמֵשׂ
  choice: na kumikilos
  rationale: Malawak ang pandiwang Hebreo at hindi nito kinakailangang tukuyin ang isang tiyak na paraan ng paggalaw.
- source_word: עַל הָאָרֶץ
  choice: sa ibabaw ng lupa
  rationale: Malinaw nitong ipinapahayag ang panlupang paggalaw; maaari ring unawain bilang “sa lupain.”
theological_decisions:
- issue: Ugnayan ng kabanalan ng Diyos at ng hinihinging kabanalan ng bayan
  choice: Gamitin ang “banal” para sa Diyos at sa bayan
  alternative: Isalin ang isa o kapwa bilang “ibinukod”
  rationale: 'Pinananatili ng iisang salita ang teolohikal na ugnayan ng magkaugnay na anyo ng קדשׁ: ang kabanalang hinihingi sa bayan ay nakaugat sa kabanalan ni Yahweh.'
- issue: Kahulugan ng נַפְשֹׁתֵיכֶם
  choice: ang inyong sarili
  alternative: ang inyong mga kaluluwa; ang inyong mga buhay
  rationale: Ang utos ay tungkol sa pagdungis sa mga tao mismo, hindi sa isang teknikal na paghahati ng katawan at kaluluwa; pinananatili ng salin ang antropolohikal na lawak ng Hebreo.
- issue: Puwersa ng pagbabawal וְלֹא תְטַמְּאוּ
  choice: Huwag ninyong dungisan
  alternative: Hindi ninyo dapat dungisan
  rationale: Ang “Huwag” ay malinaw at dignified na pautos sa modernong Tagalog habang tumpak na naghahatid ng pagbabawal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Yahweh” para sa banal na pangalan, “inyong Diyos” para sa natural na pormulang tipan, at “italaga ninyo ang inyong sarili” upang mapanatili ang mapanumbalik na diwa nang hindi maging arkaiko. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
