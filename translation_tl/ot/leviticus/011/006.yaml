source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: tl
  text: At ang liyebre[a], dahil ibinabalik nito ang kinain upang nguyain muli ngunit hindi hati ang kuko ng paa nito, ay marumi para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuneho.” Tradisyonal na inuunawa ang Hebreong אַרְנֶבֶת bilang “liyebre,” bagaman itinuturing ito ng ilan na mas malawak na katawagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: ang liyebre
  rationale: Ang “liyebre” ang tradisyonal at mas tiyak na pagkakakilanlan sa hayop na tinutukoy ng Hebreong אַרְנֶבֶת; inilagay sa talababa ang posibleng mas malawak na katawagang “kuneho.”
- source_word: כִּי
  choice: dahil
  rationale: Naghahayag dito ang כִּי ng dahilan ng pagkaklasipika sa hayop, kaya malinaw at natural ang “dahil” sa modernong Filipino.
- source_word: מַעֲלַת גֵּרָה
  choice: ibinabalik nito ang kinain para nguyain muli
  rationale: Inilalarawan nito sa payak at madaling maunawaang Filipino ang literal na ideya ng pag-ahon o pagbabalik ng kinain upang nguyain muli, nang hindi gumamit ng teknikal na katawagan.
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: ngunit hindi biyak ang kuko nito
  rationale: Malinaw nitong ipinapahayag ang negatibong ikalawang pamantayan. Ang “ngunit” ay likas na naghahatid ng pagsalungat sa naunang katangian.
- source_word: טְמֵאָה הִוא לָכֶם
  choice: ay marumi para sa inyo
  rationale: Pinananatili ng “marumi” ang mahalagang terminong ginagamit sa Levitico, habang ipinahihiwatig ng “para sa inyo” ang tuwirang kaugnayan ng kautusan sa mga kausap.
theological_decisions:
- issue: Kalikasan ng pagiging marumi sa batas tungkol sa pagkain
  choice: Panatilihin sa teksto ang “marumi” sa konteksto ng ritwal na pagkaklasipika
  alternative: Ituring itong likas o moral na kasamaan ng hayop
  rationale: Ang talata ay tungkol sa pagkaklasipika ng mga hayop ayon sa batas ng Israel hinggil sa pagkain, hindi sa moral na kasamaan ng hayop. Hindi dinagdagan ang teksto ng salitang “ritwal” upang mapanatili ang lawak ng terminong Hebreo.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinili ang paliwanag na “ibinabalik nito ang kinain para nguyain muli” sa halip na teknikal o di-pamilyar na terminolohiya; pinanatili naman ang maikli at pormal na hulma ng batas.
