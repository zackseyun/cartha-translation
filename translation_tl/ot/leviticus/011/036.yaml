  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: tl
  text: Gayunman, mananatiling malinis ang bukal o balon, bilang tipunan ng tubig[a]; ngunit magiging marumi ang sinumang humipo sa bangkay ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang katipunan ng tubig” o “isang tipunan ng tubig.” Ang pariralang Hebreo na מִקְוֵה מַיִם ay tumutukoy sa tubig na natipon o pinagtitipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Gayunman
  rationale: Hudyat ito ng pagbubukod o pagsalungat sa tuntunin tungkol sa karumihan sa naunang talata; natural at malinaw ang “Gayunman” sa makabagong Filipino.
- source_word: מַעְיָן
  choice: bukal
  rationale: Tumutukoy ito sa likas na pinagmumulan ng tubig; “bukal” ang karaniwang katumbas sa Filipino.
- source_word: בּוֹר
  choice: balon
  rationale: Sa kontekstong ito, tumutukoy ito sa hukay o sisidlang pinag-iimbakan ng tubig. Ang “balon” ay madaling maunawaan, at nililinaw ng kasunod na pariralang “pinag-iipunan ng tubig” ang gamit nito.
- source_word: מִקְוֵה מַיִם
  choice: na pinag-iipunan ng tubig
  rationale: Ipinahahayag nito ang isang natipon o iniipong katawan ng tubig. Natural sa Filipino ang pariralang ito habang pinananatili ang diwa ng pagtitipon ng tubig.
- source_word: יִהְיֶה טָהוֹר
  choice: mananatiling malinis
  rationale: Bagaman literal na “magiging/magiging malinis,” ipinahihiwatig ng konteksto na hindi nagiging marumi ang gayong pinagkukunan ng tubig. Ang “mananatiling malinis” ay malinaw na naghahayag ng pagpapatuloy ng kalagayan.
- source_word: נֹגֵעַ
  choice: ang sinumang humipo
  rationale: Ang participle ay ginagamit bilang pangkalahatang pagtukoy sa taong humihipo; natural itong ihayag bilang “ang sinumang humipo.”
- source_word: נִבְלָתָם
  choice: bangkay ng mga iyon
  rationale: Ang נְבֵלָה ay bangkay ng hayop, at ang hulaping pangmaramihan ay tumutukoy pabalik sa mga nilalang na binanggit sa konteksto. Pinananatili ng “bangkay” ang kolektibong anyong isahan.
- source_word: יִטְמָא
  choice: magiging marumi
  rationale: Ipinahahayag nito ang pagpasok sa kalagayang marumi ayon sa mga tuntunin sa rituwal; mas malinaw dito ang “magiging” kaysa simpleng “ay marumi.”
theological_decisions:
- issue: Mga terminong kaugnay ng rituwal na kalinisan
  choice: malinis / marumi
  alternative: dalisay / di-dalisay
  rationale: Ang konteksto ay tungkol sa kalagayang rituwal, hindi tuwirang paghatol sa moralidad. Karaniwan at madaling maunawaan ang “malinis / marumi” at hindi ito nagdaragdag ng doktrinal na paliwanag.
- issue: Pagpapatuloy ng kalinisan ng pinagkukunan ng tubig
  choice: mananatiling malinis
  alternative: magiging malinis / ay magiging malinis
  rationale: Ipinahihiwatig ng pagbubukod mula sa naunang tuntunin na hindi dinudungisan ang bukal o balon. Ginagawang hayag ng “mananatili” ang pahiwatig ng konteksto nang hindi binabago ang tuntunin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong “bukal,” “balon,” “malinis,” at “marumi,” habang pinanatili ang legal at rituwal na himig ng Levitico.
