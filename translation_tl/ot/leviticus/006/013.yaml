source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: tl
  text: Ito ang handog ni Aaron at ng kanyang mga anak, na ihahandog nila kay Yahweh sa araw ng pagpapahid sa kanya ng langis:[a] ikasampung bahagi ng isang efa ng pinong harina bilang palagiang handog na butil—kalahati nito sa umaga at kalahati nito sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa araw ng kanyang pagpapahid.” Isahan ang panghalip na “kanya” sa Hebreo, bagaman sina Aaron at ang kanyang mga anak ang binanggit.
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבַּן
  choice: handog
  rationale: Malawak na katawagan ito para sa inihahandog sa kontekstong pansakripisyo; natural at malinaw ang “handog” sa modernong Tagalog.
- source_word: יַקְרִיבוּ
  choice: ihahandog nila
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay tumutukoy sa pormal na paghaharap o pag-aalay ng handog; “ihahandog” ang pinakanatural dito.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה bilang “Yahweh,” alinsunod sa ibinigay na English POB consultation layer at nang hindi ito pinapalitan ng titulo.
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: sa araw na pahiran siya ng langis
  rationale: Pinananatili ang panahong diwa ng parirala at ang isahang panghalip na nasa Hebreo. Idinagdag ang “ng langis” upang maging malinaw sa karaniwang mambabasa ang ritwal na pagpapahid.
- source_word: עֲשִׂירִת הָאֵפָה
  choice: ikasampung bahagi ng isang efa
  rationale: Tumpak at likas na paglalahad ng sukat habang pinananatili ang sinaunang yunit na “efa.”
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwang katumbas sa Tagalog ng napinong harinang ginagamit sa mga handog.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa batas ng Levitico, tumutukoy ito sa handog na mula sa ani o harina; malinaw ang “handog na butil” at naihihiwalay ito sa handog na hayop.
- source_word: תָּמִיד
  choice: palagian
  rationale: Ipinapahayag ang regular at patuloy na pag-uulit nang hindi ipinahihiwatig na walang anumang paghinto ang pisikal na pag-aalay.
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: kalahati nito ... at kalahati
  rationale: Tuwirang pinananatili ang paghahati ng handog sa dalawang magkapantay na bahagi.
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: sa umaga ... sa gabi
  rationale: Natural na modernong Tagalog para sa dalawang takdang panahon.
theological_decisions:
- issue: Ang tinutukoy ng isahang panghalip sa “sa araw na pahiran siya ng langis” matapos banggitin si Aaron at ang kanyang mga anak
  choice: Panatilihin ang isahang “siya” gaya ng tekstong Masoretiko.
  alternative: 'Gawing maramihan: “sa araw na pahiran sila ng langis,” o unawain itong tumutukoy lamang sa araw ng pagpapahid kay Aaron.'
  rationale: Isahan ang אֹתוֹ (“siya”) sa Hebreo kahit maramihan ang naunang paksa. Hindi ito pinakinis tungo sa maramihan upang mapanatili ang tunay na gramatikal at interpretatibong tensiyon ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong pambatas at pansamba. Pinanatili ang teknikal na “efa” at ipinaliwanag sa konteksto ang ritwal na pagpapahid sa pamamagitan ng pariralang “ng langis.”
