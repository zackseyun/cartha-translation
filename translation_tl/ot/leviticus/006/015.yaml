  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: tl
  text: 'At ang paring pinahiran na hahalili sa kanya, na mula sa kanyang mga anak[a], ay maghahanda nito. Ito ay isang palagiang tuntunin[b] para sa PANGINOON: lubos itong pauusukin.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa ilalim niya”; maaari ring isaling “sa kanyang lugar.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “panghabang-panahong tuntunin” o “walang-hanggang kautusan.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “lubos itong gagawing usok”; ibig sabihin, ang buong handog ay tutupukin sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: ang paring pinahiran
  rationale: Tumutukoy ito sa paring pinahiran para sa kanyang katungkulan. Pinananatili ng salin ang wikang pangkulto at hindi ito ginagawang mesiyanikong titulo.
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: na hahalili sa kanya mula sa kanyang mga anak
  rationale: Ipinahahayag ang diwa ng paghalili sa katungkulan habang pinananatili ang tahasang pagtukoy ng Hebreo sa isa sa kanyang mga anak.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: ay maghahanda nito
  rationale: Malawak ang kahulugan ng עשה na ‘gawin.’ Sa konteksto ng handog, malinaw ang ‘maghahanda’ nang hindi labis na tinutukoy ang ritwal na kilos.
- source_word: חָק עוֹלָם
  choice: isang palagiang tuntunin
  rationale: Natural ito sa makabagong Filipino at ipinahahayag ang patuloy at may-bisang katangian ng kautusan.
- source_word: לַיהוָה
  choice: para sa PANGINOON
  rationale: Ginagamit ang nakaugaliang representasyon ng banal na pangalang YHWH bilang PANGINOON; ang ‘para sa’ ay angkop sa pagtatalaga ng tuntunin at handog sa kanya.
- source_word: כָּלִיל תָּקְטָר
  choice: lubos itong pauusukin sa altar
  rationale: Pinananatili ang ideya ng kabuuan at ang teknikal na diwa ng Hiphil ng קטר—ang pagpapailanglang ng handog bilang usok—sa halip na payak na ‘sunugin.’ Idinagdag ang ‘sa altar’ bilang malinaw na pahiwatig ng kontekstong panghandog, at ipinaliliwanag ito sa talababa.
theological_decisions:
- issue: Pagkakakilanlan ng “paring pinahiran”
  choice: ang paring pinahiran para sa katungkulan na hahalili sa naunang pari
  alternative: sinumang paring pinahiran; o isang mesiyanikong tauhan
  rationale: Sa kontekstong Levitiko, ang paring pinahiran ay may natatanging katungkulang ipinagpapatuloy ng isa sa kanyang mga anak. Hindi hinihingi ng teksto ang mesiyanikong pagbasa.
- issue: Paglalarawan sa tagal ng tuntunin
  choice: palagiang tuntunin
  alternative: walang-hanggang tuntunin; panghabang-panahong batas
  rationale: Pinananatili ng ‘palagian’ ang saklaw ng חָק עוֹלָם nang hindi ipinapasok sa mismong salin ang isang tiyak na sistematikong paliwanag tungkol sa tagal nito.
- issue: Paglalarawan sa lubos na pagsunog ng handog
  choice: lubos itong pauusukin sa altar
  alternative: lubos itong susunugin; lubos itong tutupukin
  rationale: Ipinakikita ng parirala na ang buong handog ay ginagawang usok sa altar, nang hindi pinapahina ang teknikal na wikang panghandog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong panrelihiyon—“paring pinahiran,” “tuntunin,” at “handog”—nang hindi nagiging arkaiko. Nasa pangunahing teksto ang lahat ng panandang talababa [a], [b], at [c].
