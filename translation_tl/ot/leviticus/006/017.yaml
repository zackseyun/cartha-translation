lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Pinananatili ng “At” ang ugnayang pasalaysay ng waw, at ang “nagsalita” ang tuwirang katumbas ng דִּבֵּר nang hindi ipinapalagay na malinaw na sunod-sunod sa oras ang pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong kinausap; “Moises” ang nakaugaliang anyo ng pangalang מֹשֶׁה.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Sa pormulang nagpapakilala ng tuwirang pananalita, natural sa modernong Filipino ang hiwalay na “Sinabi niya,” at naiiwasan nito ang alanganing literal na “na sinasabi.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang YHWH. Pinananatili ng “Yahweh” ang banal na pangalan, habang ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Hinati sa dalawang maikling sugnay ang pormulang Hebreo upang maging natural sa Filipino habang pinananatili kapwa ang “nagsalita” at ang pambungad na לֵאמֹר.
