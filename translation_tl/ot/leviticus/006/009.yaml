base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: tl
  text: Ang natira mula rito ay kakainin ni Aaron at ng kanyang mga anak na lalaki.[a] Kakainin ito na walang pampaalsa[c] sa isang banal na lugar;[b] kakainin nila ito sa looban ng tolda ng pagtitipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang nalabing bahagi” o “ang natitira.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa isang banal na lugar,” hindi “sa banal na lugar”; tinutukoy ng kasunod na sugnay na ang lugar na iyon ay ang looban ng tolda ng pagtitipon.
    reason: lexical_alternative
  - marker: c
    text: O “bilang pagkaing walang pampaalsa.” Ang Hebreo ay tumutukoy sa pagkain sa handog sa anyong walang pampaalsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: Ang natira rito
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa natitirang bahagi ng handog, habang pinananatili ang substantibong diwa ng participle at ang reperensiya ng hulaping pambabae.
- source_word: יֹאכְלוּ
  choice: ay kakainin
  rationale: Ipinahahayag ng imperfect sa kontekstong legal ang itinakdang gawain. Ang anyong ito ay natural sa Tagalog at nagpapanatili sa lakas ng tagubilin nang hindi gumagamit ng masyadong mabigat na 'dapat'.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ni Aaron at ng kanyang mga anak na lalaki
  rationale: Ang בנים ay tumutukoy rito sa mga lalaking anak ni Aaron na naglilingkod bilang mga pari; nililinaw ito ng 'mga anak na lalaki'.
- source_word: מַצּוֹת תֵּאָכֵל
  choice: Kakainin ito nang walang pampaalsa
  rationale: Ipinapahayag na ang handog ay kakainin sa anyong walang lebadura o pampaalsa, nang hindi nagdaragdag ng tiyak na hugis gaya ng tinapay, bibingka, o munting tinapay.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang pantukoy ang מָקוֹם sa Hebreo; kaya pinananatili ng 'isang banal na lugar' ang pagiging di-tiyak, at saka tinutukoy ng kasunod na sugnay ang lokasyon.
- source_word: בַּחֲצַר
  choice: sa looban
  rationale: Ang חצר ay ang nakabakod o nakapalibot na court ng santuwaryo. Karaniwan at malinaw sa Tagalog ang 'looban' sa kontekstong ito.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagtitipon
  rationale: Tuwirang pinananatili ang larawan ng אֹהֶל bilang tolda at ang diwa ng מוֹעֵד bilang itinakdang pakikipagtagpo o pagtitipon.
- source_word: יֹאכְלוּהָ
  choice: kakainin nila ito
  rationale: Pinananatili ang inuulit na pandiwa at tahasang layon sa Hebreo, na muling nagbibigay-diin sa tagubilin at sa tiyak na lugar ng pagkain.
