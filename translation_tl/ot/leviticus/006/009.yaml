  to: Ang natira mula rito ay kakainin ni Aaron at ng kanyang mga anak na lalaki.[a] Kakainin ito na walang pampaalsa[c] sa isang banal na lugar;[b] kakainin nila ito sa looban ng tolda ng pagtitipon.
  rationale: Ginawang “mula rito” upang ipahayag nang malinaw ang מִמֶּנָּה, at ginawang “na walang pampaalsa” upang ang kawalan ng pampaalsa ay malinaw na katangian ng handog na kakainin. Inayos din ang mga alternatibo sa talababa para sa likas na modernong Tagalog at mas tumpak na saklaw ng Hebreo.
