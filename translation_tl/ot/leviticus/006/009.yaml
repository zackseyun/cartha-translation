translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'pampaalsa' sa halip na teknikal o hiram na 'lebadura,' at 'looban' para sa court. Inilagay ang mga panandang talababa sa mismong mga pariralang nililinaw ng mga ito.
