  text: And every grain offering of a priest shall be wholly burned[a]; it shall not be eaten.
translation:
  language: tl
  text: At ang bawat handog na butil ng pari ay lubusang susunugin[a]; hindi ito kakainin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ay magiging isang buong handog.” Ang salitang Hebreo ay maaaring tumukoy sa pagiging buo o ganap ng handog; dito, ipinahihiwatig ng konteksto na hindi ito kinakain kundi lubusang inilalaan sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: At ang bawat
  rationale: Pinananatili ng “At” ang pagpapatuloy ng mga tuntunin, at ipinahahayag ng “bawat” ang distributibong diwa ng כָּל kasama ng pangngalang nasa isahan.
- source_word: מִנְחַת
  choice: handog na pagkaing butil
  rationale: Sa Levitico, ang מִנְחָה ay teknikal na katawagan sa handog na mula sa butil, hindi lamang isang pangkalahatang regalo o handog.
- source_word: כֹּהֵן
  choice: ng isang pari
  rationale: Tuwirang ipinapahayag nito ang ugnayang construct na “handog na pagkaing butil ng isang pari.”
- source_word: כָּלִיל
  choice: sunugin nang buo
  rationale: Ang כָּלִיל ay tumutukoy sa pagiging buo o lubos na inilalaan; sa kontekstong panghandog, malinaw sa kasunod na pagbabawal na walang bahagi nito ang kakainin. Ginagawang hayag ng salin ang praktikal na diwang ganap itong sinusunog.
- source_word: תִּהְיֶה
  choice: dapat
  rationale: Ang imperfect sa tekstong legal ay may puwersang nag-uutos. Natural sa makabagong Filipino ang “dapat” habang pinananatili ang preskriptibong tono.
- source_word: לֹא תֵאָכֵל
  choice: hindi iyon dapat kainin
  rationale: Pinananatili nito ang pasibong anyo at malinaw na pagbabawal ng Hebreo nang hindi nagdaragdag ng tahasang partitive na “anumang bahagi.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may tonong legal. Ginamit ang “handog na pagkaing butil” bilang madaling maunawaang katawagang pangsakripisyo at ang “sunugin nang buo” upang natural na maipahayag ang kontekstuwal na diwa ng כָּלִיל.
