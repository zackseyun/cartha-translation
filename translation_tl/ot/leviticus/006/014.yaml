base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Sa patag na kawali, ihahanda ito na may langis at hinalong mabuti.[a] Dadalhin mo ito, at ihahandog mo kay Yahweh ang handog na pagkaing butil na niluto[b] at pinagpira-piraso bilang nakalulugod na samyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa langis.”'
    reason: lexical_alternative
  - marker: b
    text: Bihira ang salitang Hebreo rito at hindi tiyak ang eksaktong paraan ng pagluluto; maaaring tumukoy ito sa mga inihurnong bahagi o mga bahaging niluto sa patag na kawali.
    reason: lexical_alternative
  - marker: c
    text: Ang “nakalulugod na samyo” ay karaniwang pananalita tungkol sa isang handog na katanggap-tanggap kay Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: lapad na kawali
  rationale: Tumutukoy sa isang patag o mababaw na lutuan para sa handog na pagkaing butil; mas madaling maunawaan sa modernong Filipino kaysa sa teknikal na katawagan.
- source_word: בַּשֶּׁמֶן
  choice: na may langis
  rationale: Maaaring mangahulugang 'sa langis' o 'na may langis'; pinananatili ng pariralang ito ang instrumental na diwa nang hindi ipinapalagay na inilubog ang handog sa langis.
- source_word: תֵּעָשֶׂה
  choice: ito ay ihahanda
  rationale: Ang Niphal ng עשה ay pasibo rito at tumutukoy sa paghahanda ng handog; natural at malinaw ang 'ihahanda' sa kontekstong pangpagluluto.
- source_word: מֻרְבֶּכֶת
  choice: nang lubos na nahalo
  rationale: Ipinahihiwatig ang masusing pagkakahalo o pagkakabati ng handog, malamang kasama ng langis, nang hindi labis na tinutukoy ang eksaktong paraang pangkusina.
- source_word: תְּבִיאֶנָּה
  choice: dadalhin mo ito
  rationale: Tuwirang ipinapahayag ang pagdadala ng handog; ang hulaping pambabae ay tumutukoy sa minḥah o handog.
- source_word: תֻּפִינֵי
  choice: mga bahaging niluto
  rationale: Bihira at di-tiyak ang terminong Hebreo; ipinahihiwatig nito ang mga niluto o inihurnong bahagi, kaya pinanatiling malawak ang salin.
- source_word: מִנְחַת
  choice: handog na pagkaing butil
  rationale: Ipinakikita ang partikular na uri ng handog na gawa sa harina o butil, sa halip na generic na 'handog' lamang.
- source_word: פִּתִּים
  choice: pinagpira-piraso
  rationale: Malinaw na inilalarawan ang handog bilang hinati o binali sa maliliit na bahagi.
- source_word: תַּקְרִיב
  choice: ihahandog mo
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay nangangahulugang ilapit o iharap bilang handog; idiomatiko rito ang 'ihahandog.'
- source_word: רֵיחַ נִיחֹחַ
  choice: mabangong samyo na kalugod-lugod
  rationale: Pinananatili ang karaniwang pormulang pansakripisyo at ipinahahayag ang pagtanggap o pagkalugod nang hindi ito inilalarawan bilang simpleng pisikal na pag-amoy.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang personal na pangalang יהוה bilang Yahweh, alinsunod sa tuwirang anyo nito sa tekstong Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton bilang personal na pangalan; pinananatili ng 'Yahweh' ang pagkakakilanlang tipan ng pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng רֵיחַ נִיחֹחַ sa wikang pansakripisyo
  choice: mabangong samyo na kalugod-lugod kay Yahweh
  alternative: nakalulugod na samyo para kay Yahweh
  rationale: Pinananatili ang konkretong larawan ng samyo at ang teolohikal na diwa ng handog na katanggap-tanggap, nang hindi ipinapalagay ang isang magaspang na literal na pagkaunawa sa pag-amoy ng Diyos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'lapad na kawali' upang ilarawan ang patag na lutuan, at pinanatili sa talababa ang kawalang-katiyakan ng bihirang terminong תֻּפִינֵי. Iniwasan ang sobrang teknikal o makalumang bokabularyo.
