source:
  edition: WLC
  text: דַּבֵּ֤ר אֶֽל אַהֲרֹן֙ וְ/אֶל בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הַֽ/חַטָּ֑את בִּ/מְק֡וֹם אֲשֶׁר֩ תִּשָּׁחֵ֨ט הָ/עֹלָ֜ה תִּשָּׁחֵ֤ט הַֽ/חַטָּאת֙ לִ/פְנֵ֣י יְהוָ֔ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: tl
  text: '“Sabihin mo kay Aaron at sa kanyang mga anak: ‘Ito ang tuntunin tungkol sa handog para sa kasalanan[a]: Sa lugar kung saan kinakatay ang handog na sinusunog, doon din kakatayin sa harap ni Yahweh ang handog para sa kasalanan. Ito ay kabanal-banalan.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy kapwa sa kasalanan at sa handog na kaugnay ng paglilinis mula rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו לֵאמֹר
  choice: Sabihin mo kay Aaron at sa kanyang mga anak
  rationale: Ang Piel imperative na דַּבֵּר ay likas na isinasalin sa makabagong Tagalog bilang “Sabihin mo.” Isinama ang parehong kinauukulan at hindi na isinalin nang hiwalay ang לֵאמֹר upang maiwasan ang mabigat na “na sinasabi,” habang napananatili ang pormulang nagbubukas ng tagubilin.
- source_word: זֹאת תּוֹרַת
  choice: Ito ang tuntunin tungkol sa
  rationale: Sa konteksto ng mga alituntunin sa paghahandog, ang תּוֹרָה ay tumutukoy sa tagubilin o regulasyon. Ang “tuntunin” ay malinaw, marangal, at mas natural dito kaysa sa “kautusan ng.”
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Dito ang חַטָּאת ay pangalan ng isang uri ng handog, hindi lamang ng abstraktong kasalanan. Pinananatili ng “handog para sa kasalanan” ang karaniwang ugnayan nito sa kasalanan, habang inilalagay sa talababa ang lehitimong alternatibong “handog para sa paglilinis.”
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: Sa lugar kung saan kinakatay ang handog na sinusunog
  rationale: Ang שׁחט ay tiyak na pagkatay sa kontekstong panghandog. Ang עֹלָה ay handog na lubusang sinusunog; ang maikling “handog na sinusunog” ay natural at nauunawaan sa Tagalog.
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: doon din kakatayin ... ang handog para sa kasalanan
  rationale: Ang imperfect ay may preskriptibong bisa. Ang “kakatayin” ay natural na pahayag ng itinakdang gawain sa Tagalog, at ang “doon din” ay malinaw na nag-uugnay sa naunang lugar.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay literal at idyomatikong “sa harap ni,” at ang personal na pangalang יְהוָה ay isinaling “Yahweh.”
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: Ito ay kabanal-banalan
  rationale: 'Ang konstruksyong קֹדֶשׁ קָדָשִׁים ay superlatibo: nasa pinakamataas na antas ng kabanalan ang handog. Ang “kabanal-banalan” ay maikli, marangal, at tradisyonal na Tagalog para sa ganitong diin.'
theological_decisions:
- issue: Paglalarawan sa חַטָּאת bilang handog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring idiin ng terminong Hebreo ang kasalanang tinutugunan o ang rituwal na paglilinis na isinasagawa. Pinili sa pangunahing teksto ang mas madaling makilalang “handog para sa kasalanan,” ngunit pinanatili sa talababa ang tunay na leksikal na alternatibo.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Antas ng kabanalan sa קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  alternative: napakabanal
  rationale: Ang parirala ay isang Hebreong superlatibo at tumutukoy sa klasipikasyon ng handog bilang nasa pinakamataas na antas ng kabanalan, hindi sa silid ng santuwaryo.
translation_notes:
  register: Makabago ngunit marangal na Filipino; malinaw ang wikang pang-utos at pangrituwal nang hindi nagiging labis na teknikal. Ginamit ang “kinakatay/kakatayin” para sa tiyak na kilos sa paghahandog at “kabanal-banalan” para sa Hebreong superlatibo.
