language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: tl
  text: 'Iutos mo kay Aaron at sa kanyang mga anak na lalaki: “Ito ang kautusan[a] tungkol sa handog na sinusunog: ang handog na sinusunog mismo ay mananatili sa apuyan[b] sa ibabaw ng altar buong magdamag hanggang umaga, at ang apoy sa altar ay pananatilihing nagniningas doon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tagubilin” o “tuntunin.”
    reason: lexical_alternative
  - marker: b
    text: O “lugar ng pagsunog.” Ang salitang Hebreo ay tumutukoy sa apuyan o lugar na pinagsusunugan sa altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: Utusan mo
  rationale: Tuwirang pautos ang anyo ng pandiwa; pinananatili ng “Utusan mo” ang lakas nito nang hindi pinapalambot bilang payo lamang.
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: si Aaron at ang kanyang mga anak
  rationale: Tumutukoy ito kay Aaron at sa kanyang mga anak na lalaki sa kontekstong pari; natural sa Tagalog ang “mga anak” dahil malinaw sa konteksto ang tinutukoy.
- source_word: לֵאמֹר
  choice: Sabihin mo sa kanila
  rationale: Ginagawang natural na panimula sa tuwirang pananalita ang Hebreong pormulang “na sinasabi,” habang hindi inaalis ang diwa nito.
- source_word: זֹאת תּוֹרַת
  choice: Ito ang kautusan tungkol sa
  rationale: Sa kontekstong sakripisyal, ipinakikilala ng תּוֹרָה ang itinakdang tuntunin. Ang “kautusan” ay nagpapanatili ng pormal at legal na himig.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Karaniwan at malinaw na salin ng teknikal na katawagang sakripisyal na עֹלָה; ipinahihiwatig nitong sinusunog sa altar ang handog.
- source_word: הִוא הָעֹלָה
  choice: Ang handog na sinusunog
  rationale: Ang pag-uulit ng katawagan sa bagong pangungusap ay nagpapanatili ng diin ng Hebreo nang hindi nagiging pilit sa Tagalog.
- source_word: עַל מוֹקְדָה
  choice: mananatili sa apuyan
  rationale: Ang מוֹקְדָה ay tumutukoy sa lugar ng pagsunog o apuyan ng altar. Ang “mananatili” ay natural na naghahayag na naroon ang handog habang patuloy itong nasusunog.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa ibabaw ng altar
  rationale: Tahasang pinananatili ang lokasyon ng apuyan at handog sa altar.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: buong magdamag hanggang umaga
  rationale: Natural at malinaw na Tagalog para sa buong panahong mula gabi hanggang umaga.
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: at ang apoy sa altar ay pananatilihing nagniningas doon
  rationale: Ipinahihiwatig ng anyong Hophal na kailangang panatilihin ang apoy, hindi lamang na nagkataong nagniningas ito. Pinananatili ng “doon” ang maikling pagtukoy ng hulaping Hebreo nang hindi labis na tinutukoy ang antecedent.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה sa batas tungkol sa paghahandog
  choice: kautusan
  alternative: tagubilin; tuntunin
  rationale: Ang “kautusan” ay nagpapanatili sa pormal at nag-uutos na katangian ng teksto, ngunit hindi nito ipinapalagay na ang salita rito ay pangalan ng buong Torah.
- issue: Katungkulan ng utos tungkol sa apoy sa altar
  choice: pananatilihing nagniningas
  alternative: mananatiling nagniningas; magniningas
  rationale: Ang anyo ng pandiwang Hebreo ay nagpapahiwatig ng sinasadyang pagpapanatili sa apoy. Kaya iniiwasan ng salin na gawing simpleng paglalarawan lamang ang isang ritwal na utos.
- issue: Tinutukoy ng hulaping בּוֹ
  choice: doon
  alternative: sa ibabaw nito; sa handog
  rationale: Maaaring iugnay ang maikling panghalip sa altar o sa mismong lugar ng pagsunog. Ang “doon” ay nagpapanatili ng kaugnayan sa lokasyon at hindi tahasang nilulutas ang anumang natitirang kalabuan.
translation_notes:
  register: Makabagong Filipino na pormal at marangal ngunit madaling maunawaan. Ginamit ang “altar,” na karaniwan na sa wikang pansimbahan at mas tiyak sa kontekstong sakripisyal. Ang dalawang pangungusap bago ang sipi ay nagpapadaloy nang natural sa Tagalog sa pormulang צַו ... לֵאמֹר.
