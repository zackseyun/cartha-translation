- from: 'Utusan mo si Aaron at ang kanyang mga anak. Sabihin mo sa kanila, “Ito ang kautusan[a] tungkol sa handog na sinusunog: Ang handog na sinusunog ay mananatili sa apuyan[b] sa ibabaw ng altar buong magdamag hanggang umaga, at ang apoy sa altar ay pananatilihing nagniningas doon.”'
  to: 'Iutos mo kay Aaron at sa kanyang mga anak na lalaki: “Ito ang kautusan[a] tungkol sa handog na sinusunog: ang handog na sinusunog mismo ay mananatili sa apuyan[b] sa ibabaw ng altar buong magdamag hanggang umaga, at ang apoy sa altar ay pananatilihing nagniningas doon.”'
