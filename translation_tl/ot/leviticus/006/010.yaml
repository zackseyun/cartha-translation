  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: tl
  text: Hindi ito dapat ihurnong may pampaalsa. Ibinigay ko ito bilang kanilang bahagi mula sa aking mga handog na pagkain[a]. Napakabanal nito, gaya ng handog para sa kasalanan at ng handog para sa pagkakasala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa aking mga handog na pinaraan sa apoy.”
    reason: lexical_alternative
  - marker: b
    text: O “handog na pambayad-sala”; ayon sa tradisyon, “handog dahil sa paglabag.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה
  choice: dapat lutuin
  rationale: Ang Nifal na anyo ay pasibo at tumutukoy sa bahaging mula sa handog na butil. Ang “dapat lutuin” sa negatibong pangungusap ay natural na makabagong Filipino at nagpapanatili sa legal na diin.
- source_word: חָמֵץ
  choice: may pampaalsa
  rationale: Sa konteksto ng pagluluto, malinaw na ipinagbabawal ang paggamit ng pampaal­sang sangkap nang hindi nililimitahan ang tinutukoy sa tinapay lamang.
- source_word: חֶלְקָם
  choice: bahagi nila
  rationale: Pinananatili nito ang kahulugan ng nakatalagang bahagi o kaparte, pati ang pangmaramihang hulaping paari.
- source_word: נָתַתִּי אֹתָהּ
  choice: Ibinigay ko ito
  rationale: Ang ganap na pandiwa ay nagsasaad ng naitatag nang pagkakaloob ni Yahweh na patuloy na may bisa.
- source_word: מֵאִשַּׁי
  choice: mula sa aking mga handog na pagkain
  rationale: Ang אִשֶּׁה ay teknikal na katawagan sa mga handog na inihahain sa Diyos. Ang “mga handog na pagkain” ay malinaw sa modernong Filipino; inilalagay sa talababa ang alternatibong nagbibigay-diin sa apoy.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: napakabanal
  rationale: Ipinahahayag ng inuulit na konstruksiyon ang pinakamataas na antas ng kabanalan. Natural ito sa Filipino at hindi napagkakamalang pangalan ng isang lugar.
- source_word: כַּחַטָּאת
  choice: gaya ng handog para sa kasalanan
  rationale: Pinananatili ng “gaya ng” ang paghahambing o pag-uuri na ipinapahiwatig ng prefiks na כ.
- source_word: וְכָאָשָׁם
  choice: at ng handog dahil sa pagkakasala
  rationale: Ibinubukod nito ang אָשָׁם mula sa handog para sa kasalanan habang hindi ipinipilit kung pagkakasala o pagbabayad-pinsala ang pangunahing diin ng termino.
theological_decisions:
- issue: Pagpapakahulugan sa katawagang pansakripisyo na אָשָׁם
  choice: handog dahil sa pagkakasala
  alternative: handog na pambayad-sala; handog dahil sa paglabag
  rationale: Ang pangunahing salin ay malinaw at sapat na malawak upang mapanatili ang ugnayan ng handog sa pananagutan sa pagkakasala. Hindi nito nililimitahan ang termino sa isang partikular na teorya ng pagtubos, habang kinikilala ng talababa ang dimensiyon ng reparasyon at ang tradisyonal na pananalita.
- issue: Pagpapakahulugan sa teknikal na terminong אִשֶּׁה
  choice: mga handog na pagkain
  alternative: mga handog na pinaraan sa apoy; mga handog na sinusunog
  rationale: Ang pangunahing salin ay madaling maunawaan bilang kategorya ng handog na inihahain sa Diyos. Gayunman, sapagkat maaaring itampok ng terminong Hebreo ang paghahandog sa apoy, pinananatili ang gayong pagbasa sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pampaalsa” sa halip na mas teknikal o lumang katawagan, at “napakabanal” upang natural na maipahayag ang Hebreong pasukdol. Inilagay ang mga tanda ng talababa sa mismong mga terminong nililinaw ng mga ito.
