  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: tl
  text: Pagkatapos ay huhubarin niya ang kanyang mga kasuotan at magsusuot ng ibang mga kasuotan. Ilalabas[a] niya ang abo sa labas ng kampo, sa isang lugar na malinis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dadalhin palabas.”
    reason: lexical_alternative
  - marker: b
    text: Ang “malinis” dito ay tumutukoy sa ritwal na kalinisan ayon sa mga tuntunin sa Levitico.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט
  choice: Pagkatapos ay huhubarin niya
  rationale: Sa konteksto ng pananamit, ang פשט ay nangangahulugang maghubad o mag-alis ng kasuotan. Likas sa makabagong Tagalog ang “huhubarin,” at ipinahihiwatig ng “Pagkatapos ay” ang pagkakasunod-sunod ng mga tagubilin.
- source_word: בְּגָדָיו
  choice: ang kanyang mga kasuotan
  rationale: Ang בגד ay karaniwang salita para sa damit o kasuotan. Ang “mga kasuotan” ay dignified at angkop sa kontekstong pangpari.
- source_word: וְלָבַשׁ
  choice: at magsusuot
  rationale: Ang לבש ay tumutukoy sa pagsusuot ng damit. Ang “magsusuot” ang natural at tuwirang katumbas sa Tagalog.
- source_word: בְּגָדִים אֲחֵרִים
  choice: ng ibang mga kasuotan
  rationale: Ipinakikita ng אֲחֵרִים na papalitan ang unang kasuotan ng iba, nang hindi ipinapalagay na bago o malinis ang mga iyon.
- source_word: וְהוֹצִיא
  choice: Ilalabas
  rationale: Ang Hiphil ng יצא ay nangangahulugang maglabas o magdala palabas. Maikli at natural ang “Ilalabas” para sa paglipat ng abo mula sa altar patungo sa labas ng kampo.
- source_word: הַדֶּשֶׁן
  choice: ang abo
  rationale: Dito, ang דשן ay tumutukoy sa abong nalalabi mula sa handog na sinusunog. Karaniwang ginagamit bilang pangngalang di-mabilang sa Tagalog ang “abo.”
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Tumutukoy ang parirala sa pagdadala sa isang lugar na lampas sa hangganan ng kampo. Natural at malinaw ang “sa labas ng kampo.”
- source_word: אֶל מָקוֹם טָהוֹר
  choice: sa isang lugar na malinis
  rationale: Tuwirang isinasalin ng “malinis” ang טָהוֹר habang hinahayaang ipaliwanag ng konteksto ng Levitico ang ritwal na kahulugan nito.
theological_decisions:
- issue: Ritwal na kahulugan ng טָהוֹר
  choice: lugar na malinis
  alternative: lugar na ritwal na malinis; dalisay na lugar
  rationale: Pinananatili ng “malinis” ang pangunahing kategorya ng teksto nang hindi nagdaragdag ng paliwanag sa mismong talata. Nililinaw sa talababa na ritwal na kalinisan ang tinutukoy sa konteksto ng Levitico.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang aspektong kontemplatibo (“huhubarin,” “magsusuot,” “ilalabas”) upang ihayag ang iniuutos na susunod na hakbang sa ritwal. Inilagay ang bawat talababa sa salitang aktuwal nitong ipinapaliwanag.
