id: LEV.6.21
reference: Leviticus 6:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל בּ֖/וֹ יִשָּׁבֵ֑ר וְ/אִם בִּ/כְלִ֤י נְחֹ֨שֶׁת֙ בֻּשָּׁ֔לָה וּ/מֹרַ֥ק וְ/שֻׁטַּ֖ף בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: tl
  text: At ang sisidlang luwad na pinagkuluan nito ay dapat basagin. Ngunit kung ito ay pinakuluan sa sisidlang tanso[a], dapat kuskusin ang sisidlan at banlawan ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisidlang bronse.” Maaaring tumukoy ang salitang Hebreo na נְחֹשֶׁת sa tanso o bronse, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: sisidlang luwad
  rationale: Tumutukoy ang parirala sa sisidlang yari sa luwad o palayok; malinaw at likas sa modernong Filipino ang “sisidlang luwad” at pinananatili nito ang mahalagang pagkakaiba ng materyal.
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: pinagkuluan / pinakuluan
  rationale: Sa konteksto ng handog, ang בשׁל ay pagluluto sa pamamagitan ng pagpapakulo. Pinananatili ng mga anyong ito ang diwang pasibo at ang kaugnayan sa sisidlan.
- source_word: בּוֹ
  choice: pinagkuluan nito
  rationale: Ipinahahayag ng hulaping panghalip ang lokasyong “sa loob nito,” na natural na naisasalin sa Filipino bilang “pinagkuluan nito.”
- source_word: יִשָּׁבֵר
  choice: dapat basagin
  rationale: Ang Niphal imperfect sa batas na ito ay nag-uutos; malinaw na ipinahahayag ng “dapat basagin” ang obligasyon sa kasalukuyang Filipino.
- source_word: כְלִי נְחֹשֶׁת
  choice: sisidlang tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze. Ang “tanso” ay karaniwang katawagang Filipino at pinananatili ang lawak ng tawag sa metal, samantalang nililinaw sa talababa ang alternatibong bronse.
- source_word: וּמֹרַק
  choice: dapat kuskusin ang sisidlan
  rationale: Ang מרק ay masusing paglilinis sa pamamagitan ng pagkuskos. Ang “kuskusin” ay natural at malinaw sa ordinaryong mambabasa.
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: at banlawan ng tubig
  rationale: Ang שטף ay paghuhugas o pagbabanlaw sa tubig. Ang “banlawan” ay mahusay na nagpapakita ng ikalawang hakbang ng paglilinis pagkatapos kuskusin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa legal-rituwal na konteksto. Ginamit ang “dapat” upang natural na maipahayag ang obligasyon, at iniwasan ang lipas o labis na teknikal na pananalita.
