base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: tl
  text: At ang bawat handog para sa kasalanan[a] na ang bahagi ng dugo nito ay dinadala sa Toldang Tipanan upang magbayad-sala sa banal na lugar ay hindi dapat kainin; dapat itong sunugin sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog para sa paglilinis.” Sa Levitico, ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog na may kinalaman sa karumihan at kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Ngunit ang anumang
  rationale: Ang וְ ay nag-uugnay sa naunang tuntunin ngunit dito ay nagpapakilala ng eksepsiyon o paghihigpit; ang כָל ay nagbibigay ng saklaw na sumasaklaw sa alinmang handog na tumutugon sa kondisyong kasunod.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong panghandog, tumutukoy ang salita sa hain na may kaugnayan sa kasalanan, hindi sa kasalanan bilang abstraktong bagay. Likas at madaling maunawaan sa modernong Tagalog ang pariralang ito; inilalagay sa talababa ang lehitimong alternatibong nagbibigay-diin sa paglilinis.
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: na ang ilan sa dugo nito ay dinala
  rationale: 'Pinananatili nito ang partitive na diwa ng מִן: bahagi o ilan sa dugo, hindi kinakailangang lahat, ang ipinapasok.'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Ginagamit ang kinikilalang katawagan para sa santuwaryong tolda. Sa pandiwang 'dinala,' natural na naipahihiwatig ng 'sa' ang pagpasok patungo sa loob nito.
- source_word: לְכַפֵּר
  choice: upang magbayad-sala
  rationale: Pinananatili ang ritwal at teolohikal na bigat ng כפר nang hindi tinutukoy ang isang makitid na teorya kung paano nagaganap ang pagbabayad-sala.
- source_word: בַּקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Tumutukoy ito sa sagradong lugar o bahagi ng santuwaryo, hindi sa kabanalan bilang abstraktong katangian.
- source_word: לֹא תֵאָכֵל
  choice: ay hindi dapat kainin
  rationale: Pinananatili ang pasibong anyo at malinaw na ipinapahayag ang legal na pagbabawal sa natural na modernong Tagalog.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: dapat itong sunugin sa apoy
  rationale: Pinananatili ang tahasang pagbanggit sa apoy at ang legal na lakas ng utos.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa mga tuntunin tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Malinaw sa konteksto na isang hain ang tinutukoy. Ang pangunahing salin ay mas pamilyar sa karaniwang mambabasa, samantalang kinikilala ng talababa ang ritwal na dimensiyon ng paglilinis nang hindi inaalis ang kaugnayan sa kasalanan.
- issue: Dami ng dugong dinadala sa santuwaryo
  choice: ang ilan sa dugo nito ay dinala
  alternative: ang dugo nito ay dinala
  rationale: Ipinahihiwatig ng מִן na bahagi ng dugo ang dinadala. Ang tahasang 'ilan sa dugo' ay nagpapanatili sa detalyeng ito ng Hebreo.
- issue: Gamit ng כפר sa banal na lugar
  choice: magbayad-sala
  alternative: magsagawa ng ritwal na paglilinis
  rationale: Ang 'magbayad-sala' ay nagpapanatili sa tradisyonal at malawak na ritwal-teolohikal na diwa ng salita, nang hindi nilulutas ang lahat ng saklaw nito bilang paglilinis, pagtubos, o pag-aalis ng dungis.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang legal at panritwal na himig. Ginamit ang 'dapat' sa mga pagbabawal at utos upang maging natural sa Tagalog, habang pinananatili ang pasibong ayos at mahahalagang detalye ng Hebreo.
