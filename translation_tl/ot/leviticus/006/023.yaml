  naturalness: Marangal at malinaw ang rehistro ng draft. Ang rebisyon ay nagpapakinis sa Tagalog sa pamamagitan ng “bahagi ng dugo nito” at “dinadala,” habang pinananatili ang legal at panritwal na himig. Ang “At ang bawat” ay tuwirang sumasalamin sa וְכָל nang hindi ipinipilit ang mas malakas na kontrastibong “Ngunit.”
  terminology: Pinananatili ang “handog para sa kasalanan,” “Toldang Tipanan,” at “magbayad-sala,” na angkop at magkakatugma sa tradisyunal ngunit modernong Filipino Tagalog. Ang talababa ay nagpapanatili ng lehitimong alternatibong “handog para sa paglilinis” nang hindi pumipili ng isang makitid na interpretasyong teolohikal.
