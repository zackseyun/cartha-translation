  source_fidelity: Ang “nagsalita si Yahweh kay Moises” ay tumpak na tumutugon sa וַיְדַבֵּר יְהוָה אֶל־מֹשֶׁה. Ang pangwakas na לֵאמֹר ay pormulang pambungad sa kasunod na tuwirang pananalita; mas mahusay itong isalin sa modernong Tagalog sa pamamagitan ng “at sinabi:” kaysa sa literal ngunit di-natural na “na sinasabi,” nang hindi binabago ang tungkulin nito.
  naturalness: Hindi natural sa makabagong Tagalog ang “na sinasabi” matapos ang nakaraang panahunan na “nagsalita,” at hindi ito ang karaniwang paraan upang ipakilala ang kasunod na pananalita. Ang “at sinabi:” ay malinaw, marangal, at angkop sa pormulang naratibo.
  terminology: Ang “Yahweh” para sa יהוה at “Moises” para sa מֹשֶׁה ay angkop. Nilinaw ang talababa upang hindi nito tawaging alternatibo ang “Yahweh” samantalang ito na ang gamit sa pangunahing teksto.
