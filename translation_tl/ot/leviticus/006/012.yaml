    rationale: Ginagamit na ng teksto ang “Yahweh,” ngunit sinasabi ng talababa na maaari rin itong “Yahweh.” Mas malinaw na ipaliwanag na ang YHWH ay tradisyonal na isinasalin bilang “ang PANGINOON” sa maraming salin.
