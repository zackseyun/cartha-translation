lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive kasama ng דּבר ay nagsasaad ng kasunod na pangyayari sa salaysay. Ang “nagsalita” ay natural at bahagyang pormal na katumbas sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na pananda bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormula sa Hebreo na nagpapakilala sa tuwirang pahayag, kahit may bahagyang pag-uulit na likas din sa pinagmulan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay isang karaniwang rekonstruksiyon ng bigkas at pinananatili ang pagkakakilanlan nito bilang personal na pangalan, samantalang kinikilala sa talababa ang tradisyonal na pamalit na titulo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang pormal at paulit-ulit na hulma ng pambungad sa banal na pananalita; ang “na sinasabi” ay sadyang literal at magsisilbing tulay sa susunod na talata.
