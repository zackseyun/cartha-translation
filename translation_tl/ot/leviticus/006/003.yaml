revisions:
- from: At isusuot ng pari ang kanyang kasuotang lino, at isusuot niya sa kanyang katawan[b] ang panloob na kasuotang lino. Pagkatapos, aalisin niya ang mga abong nalabi nang tupukin ng apoy ang handog na sinusunog sa ibabaw ng altar[a], at ilalagay niya ang mga iyon sa tabi ng altar.
  to: At isusuot ng pari ang kanyang kasuotang lino, at isusuot niya sa kanyang katawan[b] ang mga panloob na kasuotang lino. Pagkatapos, aalisin niya ang mga abo mula sa handog na sinusunog na tinupok ng apoy sa altar[a], at ilalagay niya ang mga iyon sa tabi ng altar.
  rationale: Ginawang maramihan ang kasuotang panloob upang masalamin ang anyo at tungkulin ng מִכְנְסֵי בַד. Inayos ang sugnay tungkol sa mga abo at ang talababa nito upang malinaw na ang handog na sinusunog ang tinutukoy na tinupok ng apoy, habang kinikilala ang siksik na sintaks ng Hebreo at hindi ipinapataw ang isang labis na tiyak na pagbasa.
