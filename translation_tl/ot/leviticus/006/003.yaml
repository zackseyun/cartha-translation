base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: tl
  text: At isusuot ng pari ang kanyang kasuotang lino, at isusuot niya sa kanyang katawan[b] ang mga panloob na kasuotang lino. Pagkatapos, aalisin niya ang mga abo mula sa handog na sinusunog na tinupok ng apoy sa altar[a], at ilalagay niya ang mga iyon sa tabi ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang mga abo na tutupukin ng apoy ang handog na sinusunog.” Siksik ang pahayag sa Hebreo at maaaring isalin sa ilang magkakalapit na paraan; tinutukoy nito ang mga abong kaugnay ng handog na sinusunog na tinupok ng apoy sa altar.'
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kanyang katawan” ay literal na “sa kanyang laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: ang kanyang kasuotang lino
  rationale: Ang מִדּוֹ ay tumutukoy sa kasuotang pangpari, at ang בַד ay tumutukoy sa materyal na lino. Pinananatiling pangkalahatan ng “kasuotan” ang uri nito nang hindi ipinapalagay ang eksaktong tabas.
- source_word: מִכְנְסֵי בַד
  choice: ang panloob na kasuotang lino
  rationale: Ito ang kasuotang lino para sa ibabang bahagi ng katawan na isinusuot nang tuwiran sa katawan. Ang “panloob na kasuotan” ay natural at malinaw sa modernong Filipino.
- source_word: עַל בְּשָׂרוֹ
  choice: sa kanyang katawan
  rationale: Literal itong “sa kanyang laman.” Ang “sa kanyang katawan” ay natural sa Filipino at naghahatid na nakadikit sa katawan ang kasuotan.
- source_word: וְהֵרִים
  choice: aalisin niya
  rationale: Bagaman pangunahing kahulugan ng pandiwa ang “iangat,” sa ritwal na konteksto ay ang pag-aalis ng abo mula sa altar ang tinutukoy.
- source_word: הַדֶּשֶׁן
  choice: ang mga abong nalabi
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa nalabing abo o latak matapos tupukin ng apoy ang handog.
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: nang tupukin ng apoy ang handog na sinusunog
  rationale: Ang Hebreo ay siksik at literal na gumagamit ng pandiwang “kumain/tumupok.” Ipinahahayag ng salin ang abo bilang nalabi matapos tupukin ng apoy ang handog, nang hindi pinapawi ang bahagyang hirap ng ugnayang panggramatika.
- source_word: הָעֹלָה
  choice: ang handog na sinusunog
  rationale: Ito ang malinaw at nakaugaliang paglalarawan sa handog na lubusang sinusunog sa altar, habang naiiwasan ang di-pamilyar na etimolohikal na “handog na paakyat.”
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: sa tabi ng altar
  rationale: Tumpak at natural nitong ipinahahayag ang pagiging malapit sa gilid ng altar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pari,” “handog na sinusunog,” at “altar” bilang malinaw at karaniwang bokabularyong panritwal. Pinanatili ang pormal na pagkakasunod-sunod ng mga tagubilin ngunit iniangkop ang pangungusap sa natural na daloy ng Tagalog.
