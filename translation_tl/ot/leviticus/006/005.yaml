revisions:
- from: At ang apoy sa ibabaw ng altar ay dapat panatilihing nagniningas; hindi ito dapat mamatay. Tuwing umaga[a], magsusunog doon ng kahoy ang pari, aayusin niya sa ibabaw nito ang handog na sinusunog, at susunugin niya roon ang mga bahaging taba ng mga handog para sa kapayapaan.[b]
  to: At ang apoy sa ibabaw ng altar ay dapat panatilihing nagniningas sa ibabaw nito; hindi ito dapat mamatay. Tuwing umaga[a], magsusunog ng kahoy sa ibabaw nito ang pari, aayusin niya roon ang handog na sinusunog, at susunugin niya roon ang mga bahagi ng taba ng mga handog para sa kapayapaan.[b]
  rationale: 'Idinagdag ang hayag na pagtukoy na ang apoy ay pinananatiling nagniningas “sa ibabaw” ng altar, alinsunod sa בּוֹ, at pinanatili ang kasunod na mga pagtukoy sa altar. Inayos ang pananalita para sa taba upang maging mas natural sa modernong Filipino nang hindi binabago ang kahulugang pansakripisyo. Nananatiling tama ang mga puwesto ng talababa: [a] sa inuulit na “umaga” at [b] sa katawagang “mga handog para sa kapayapaan.”'
