base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: tl
  text: At ang apoy sa ibabaw ng altar ay dapat panatilihing nagniningas sa ibabaw nito; hindi ito dapat mamatay. Tuwing umaga[a], magsusunog ng kahoy sa ibabaw nito ang pari, aayusin niya roon ang handog na sinusunog, at susunugin niya roon ang mga bahagi ng taba ng mga handog para sa kapayapaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit ang “umaga”: “umaga-umaga,” na nangangahulugang bawat umaga.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga handog para sa kapayapaan” ay maaari ring isaling “mga handog para sa kagalingan” o “mga handog para sa pakikisama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: dapat panatilihing nagniningas
  rationale: Ipinahahayag ng anyong Hophal ang patuloy na pagpapanatili sa apoy, hindi lamang ang simpleng pagniningas nito.
- source_word: לֹא תִכְבֶּה
  choice: hindi ito dapat mamatay
  rationale: Natural sa makabagong Filipino ang “mamatay” para sa apoy at malinaw nitong ipinahahayag na hindi ito dapat mawalan ng ningas.
- source_word: וּבִעֵר ... עֵצִים
  choice: magsusunog doon ng kahoy
  rationale: Tumutukoy ito sa paglalagay at pagsunog ng kahoy upang mapanatili ang apoy, hindi sa pagsisimula ng panibagong apoy.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: tuwing umaga
  rationale: 'Ang pag-uulit ng “umaga” ay may distributibong diwa: ginagawa ito bawat umaga.'
- source_word: וְעָרַךְ
  choice: aayusin
  rationale: Pinananatili nito ang diwa ng maayos at ritwal na paglalagay ng handog sa altar.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Malinaw at kinikilalang katawagan sa Filipino para sa handog na lubusang sinusunog sa altar.
- source_word: וְהִקְטִיר
  choice: susunugin
  rationale: Sa kontekstong pansakripisyo, tumutukoy ito sa pagpapailanlang bilang usok sa pamamagitan ng pagsunog; sapat at natural ang “susunugin” sa Filipino.
- source_word: חֶלְבֵי
  choice: mga bahaging taba
  rationale: Tiyak itong tumutukoy sa mga itinakdang bahagi ng taba na sinusunog, hindi sa matalinghagang “pinakamainam na bahagi.”
- source_word: הַשְּׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili nito ang tradisyonal at nakikilalang katawagan habang iniiwasang ipako ang malawak na saklaw ng salitang Hebreo sa iisang paliwanag.
theological_decisions:
- issue: Pagpapahayag ng mga katawagang pansakripisyo
  choice: “handog na sinusunog” at “mga handog para sa kapayapaan”
  alternative: “handog na paakyat” at “mga handog para sa kagalingan/pakikisama”
  rationale: Ginamit ang malinaw at nakikilalang mga katawagan sa Filipino, habang inilalagay sa talababa ang tunay na saklaw ng שְׁלָמִים upang hindi ito paliitin sa isang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapat” upang maipakita ang legal at patuloy na tungkulin, at iniwasan ang mga salitang masyadong arkaiko o teknikal.
