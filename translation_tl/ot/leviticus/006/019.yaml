base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: tl
  text: Ang paring naghahandog nito bilang handog para sa kasalanan[a] ang kakain nito. Kakainin ito sa isang banal na lugar, sa looban ng Tolda ng Pagtitipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang paring nagsasagawa ng pagtubos sa pamamagitan nito ang kakain nito.” Ang Hebreong participle ay maaari ring tumukoy nang mas tiyak sa pangangasiwa sa ritwal ng handog para sa kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katumbas ng כֹּהֵן; pinananatili ng “ang” ang tiyak na anyo ng parirala.
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: naghahandog nito bilang handog para sa kasalanan
  rationale: Sa batas tungkol sa paghahandog, ang piel participle ng חטא ay tumutukoy sa paring nangangasiwa sa ritwal ng handog para sa kasalanan. Likas sa makabagong Tagalog ang pariralang ito at hindi nito ginagamit ang malabo at literal na anyong “nagkakasala rito.”
- source_word: יֹאכֲלֶנָּה
  choice: ang kakain nito
  rationale: Ipinahahayag ng imperfect sa kontekstong legal kung sinong pari ang itinakdang kumain. Ang hulma na “ang … ang kakain” ay malinaw at natural sa Tagalog.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang tiyak na pantukoy ang “lugar” sa Hebreo, kaya pinananatili ang di-tiyak na diwa sa “isang banal na lugar.”
- source_word: תֵּאָכֵל
  choice: Kakainin ito
  rationale: Pinananatili ang balintiyak na pokus ng Hebreong niphal at, sa kontekstong ito, likas na nauunawaan bilang tuntunin.
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: sa looban ng Tolda ng Pagtitipon
  rationale: Ang “looban” ay natural na tawag sa nakapaloob na bakuran ng santuwaryo, at ang “Tolda ng Pagtitipon” ay tuwirang nagpapahayag sa אֹהֶל מוֹעֵד nang hindi ipinapalit ang konsepto ng tipan sa konsepto ng itinakdang pagtitipon.
theological_decisions:
- issue: Ang ritwal na kahulugan ng חטא sa batas ng mga handog
  choice: naghahandog nito bilang handog para sa kasalanan
  alternative: nagsasagawa ng pagtubos sa pamamagitan nito; naglilinis sa pamamagitan nito
  rationale: May natatanging gamit ang pandiwa sa kontekstong panghandog. Ipinakikita ng pangunahing salin ang tungkulin ng pari sa handog para sa kasalanan, samantalang inilalahad sa talababa ang tunay na alternatibong pagbasa na may diin sa pagtubos.
- issue: Ang tinutukoy ng mga panghalip na pambabae
  choice: nito / ito
  alternative: niya / siya
  rationale: Bagaman pambabae ang anyong gramatikal sa Hebreo, ang tinutukoy ay ang hayop o handog. Ang “ito” ang natural at wastong panghalip sa Tagalog para rito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang karaniwang bokabularyong panrelihiyon na “pari,” “handog para sa kasalanan,” at “banal,” ngunit iniwasan ang labis na teknikal o denominasyonal na pananalita.
