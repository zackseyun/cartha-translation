id: LEV.6.8
reference: Leviticus 6:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Kukuha siya mula rito ng isang dakot ng pinong harina ng handog na butil at ng kaunti sa langis nito, kasama ang lahat ng kamanyang na nasa handog na butil. Susunugin niya sa altar ang bahaging pang-alaala nito[a] bilang mabangong samyo na kalugod-lugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahaging pang-alaala” ay isang teknikal na katawagan para sa kinatawang bahagi ng handog na butil na sinusunog sa altar.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ
  choice: Kukuha siya mula rito ng isang dakot
  rationale: Sa kontekstong panghandog, ang Hiphil ng רום ay tumutukoy sa pagkuha o pag-aalis ng takdang bahagi. Likas sa modernong Tagalog ang “kukuha ... ng isang dakot,” habang naipapahayag ang daming kasya sa kanyang kamay.
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: ng pinong harina ng handog na butil
  rationale: Ang סֹלֶת ay pinong harina, at ang מִנְחָה rito ay ang teknikal na handog na mula sa butil.
- source_word: וּמִשַּׁמְנָהּ
  choice: at ng kaunti sa langis nito
  rationale: 'Ang inuulit na מִן ay partitive: bahagi ng langis ang kukunin, hindi ang lahat nito. Nililinaw ito ng “kaunti sa” sa natural na Tagalog.'
- source_word: וְאֵת כָּל הַלְּבֹנָה אֲשֶׁר עַל הַמִּנְחָה
  choice: kasama ang lahat ng kamanyang na nasa handog na butil
  rationale: Ang לְבֹנָה ay espesipikong kamanyang, at binibigyang-diin ng כָּל na lahat nito ang isasama, di-gaya ng bahagi lamang ng harina at langis.
- source_word: וְהִקְטִיר הַמִּזְבֵּחַ
  choice: Susunugin niya sa altar
  rationale: Ang קטר sa kontekstong ito ay pagsunog ng handog sa altar. Malinaw at marangal ang “susunugin” sa modernong Tagalog.
- source_word: אַזְכָּרָתָהּ
  choice: ang bahaging pang-alaala nito
  rationale: Teknikal na terminong panghandog ito para sa kinatawang bahagi ng handog na sinusunog sa altar; pinananatili ng salin ang kaugnayan nito sa pag-alaala.
- source_word: רֵיחַ נִיחֹחַ
  choice: bilang mabangong samyo na kalugod-lugod
  rationale: Ipinahahayag ng nakapirming pariralang ito na katanggap-tanggap ang handog sa Diyos, nang hindi ginagawang mekanikal o lantad na literal ang larawan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng יהוה; ang “kay” ay likas sa Tagalog kasunod ng “kalugod-lugod.”
theological_decisions:
- issue: Pagbanggit sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng רֵיחַ נִיחֹחַ
  choice: mabangong samyo na kalugod-lugod
  alternative: nakapapawing samyo / matamis na samyo
  rationale: Pinananatili nito ang pandamang larawan at ang diwa ng banal na pagtanggap, nang hindi ipinapalagay na literal na pang-amoy lamang ang tinutukoy.
- issue: Kahulugan ng אַזְכָּרָתָהּ
  choice: bahaging pang-alaala
  alternative: handog na pang-alaala / bahaging tagapagpaalaala
  rationale: Pinananatili ang teknikal na katawagang panghandog at ang likas na tensiyon kung ang bahagi ay nagsisilbing alaala, tagapagpaalaala, o kinatawang bahagi, sa halip na tahasang pagpasyahan kung sino ang inaasahang makaalaala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang karaniwang bokabularyong panrelihiyon na “handog,” “altar,” at “kamanyang,” habang iniwasan ang labis na arkaiko o denominasyonal na pananalita.
