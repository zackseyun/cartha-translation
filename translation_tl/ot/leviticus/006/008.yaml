  source_fidelity: Tumpak na naipapahayag ang pagkuha ng takdang dakot mula sa pinong harina, bahagi ng langis, at lahat ng kamanyang, pati ang pagsunog ng bahaging pang-alaala sa altar bilang samyong kalugod-lugod kay Yahweh. Napananatili ang partitive na diwa para sa harina at langis at ang “lahat” para sa kamanyang.
