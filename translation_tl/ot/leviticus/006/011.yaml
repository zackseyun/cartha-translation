revisions:
- from: Bawat lalaki sa mga anak ni Aaron ay maaaring kumain mula rito. Ito ay tuntuning panghabang-panahon sa lahat ng inyong salinlahi tungkol sa mga handog na pagkain para kay Yahweh. Anuman ang dumikit sa mga iyon ay magiging banal.[a]
  to: Bawat lalaking kabilang sa mga anak ni Aaron ay maaaring kumain nito. Ito ay tuntuning panghabang-panahon para sa inyong mga salinlahi mula sa mga handog na pagkain para kay Yahweh. Anuman ang humipo sa mga iyon ay magiging banal.[a]
  rationale: Pinalitan ang “tungkol sa” ng “mula sa” upang mapanatili ang saklaw ng מִן sa legal na parirala, at ang “dumikit” ng “humipo” upang huwag limitahan ang malawak na pandiwang Hebreo. Inayos din ang unang parirala para sa mas malinaw na modernong Filipino habang pinananatili ang priestly designation.
