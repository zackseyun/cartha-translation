base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: tl
  text: Bawat lalaking kabilang sa mga anak ni Aaron ay maaaring kumain nito. Ito ay tuntuning panghabang-panahon para sa inyong mga salinlahi mula sa mga handog na pagkain para kay Yahweh. Anuman ang humipo sa mga iyon ay magiging banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Anuman ang humipo sa mga iyon ay itatalaga bilang banal.” Maaaring tumukoy ang Hebreo sa pagiging banal dahil sa paghipo; inuunawa naman ito ng ilan sa mas mahigpit na diwa: tanging banal na tao o bagay lamang ang maaaring humipo sa mga iyon.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Bawat lalaki
  rationale: Tumpak na ipinahahayag ang kasariang tinutukoy sa konteksto ng karapatang pari; likas at malinaw ito sa makabagong Tagalog.
- source_word: בִּבְנֵי אַהֲרֹן
  choice: sa mga anak ni Aaron
  rationale: Pinananatili ang literal at karaniwang katawagang pampamilya at pangpari nang hindi pinalalawak sa lahat ng inapo.
- source_word: יֹאכֲלֶנָּה
  choice: ay maaaring kumain mula rito
  rationale: Ipinahahayag ang pinahihintulutang pakikibahagi sa handog, at ang “mula rito” ay tumutukoy sa bahaging maaaring kainin.
- source_word: חָק עוֹלָם
  choice: tuntuning panghabang-panahon
  rationale: Natural na legal na pananalita sa Tagalog na nagpapanatili sa diwa ng patuloy at nananatiling bisa.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Malinaw na ipinahahayag ang pagpapatuloy ng tuntunin sa magkakasunod na henerasyon.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: tungkol sa mga handog na pagkain para kay Yahweh
  rationale: Ipinapakita ang kaugnayan ng tuntunin sa mga haing inihahandog kay Yahweh; iniiwasan ang mekanikal at maaaring mapanlinlang na “mga handog na ginawa sa apoy.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng tetragrammaton.
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: Anuman ang dumikit sa mga iyon
  rationale: Pinananatili ang lawak ng Hebreo, na hindi tahasang nagtatakda kung tao o bagay ang humihipo.
- source_word: יִקְדָּשׁ
  choice: ay magiging banal
  rationale: Ipinahahayag ang resultang pagbabago ng kalagayan dahil sa pagdikit, habang hindi ipinapaliwanag nang lampas sa sinasabi ng talata.
theological_decisions:
- issue: Kahulugan ng paglilipat ng kabanalan sa huling sugnay
  choice: Ang humipo o dumikit sa mga banal na handog ay magiging banal.
  alternative: Maaaring unawain na tanging banal na tao o bagay lamang ang maaaring humipo sa mga iyon, o na ang humipo ay mapapasailalim sa mga obligasyon ng pagiging banal.
  rationale: Ang payak na daloy ng Hebreo ay pinakamadaling basahin bilang resultang pagiging banal. Gayunman, inilalahad sa talababa ang mas mahigpit na pagbasa upang mapanatili ang tunay na interpretatibong tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang katawagang pangpari na “mga anak ni Aaron,” ang pangalang “Yahweh,” at ang malawak na saklaw ng “anuman.”
