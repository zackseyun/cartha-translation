lexical_decisions:
- source_word: אֵשׁ
  choice: apoy
  rationale: Ito ang tuwiran at karaniwang katumbas para sa literal na apoy sa konteksto ng altar.
- source_word: תָּמִיד
  choice: laging
  rationale: Ipinahahayag nito ang tuloy-tuloy na pagpapanatili ng apoy sa natural na modernong Tagalog.
- source_word: תּוּקַד
  choice: dapat panatilihing nagliliyab
  rationale: 'Ang anyong Hophal ay may pasibo at causative na diwa: ang apoy ay kailangang panatilihing nagniningas, hindi lamang basta nagliliyab.'
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Ang “sa altar” ang natural na Tagalog para sa lokasyong ipinahahayag ng parirala habang pinananatili ang tiyak na altar.
- source_word: לֹא תִכְבֶּה
  choice: hindi ito dapat mamatay
  rationale: Natural itong paglalarawan sa Tagalog ng apoy na hindi dapat mawala o kusang mapawi, at pinananatili ang intransitibong diwa ng pandiwa.
