  naturalness: Mas natural at eksakto sa modernong Filipino ang “patuloy na nagniningas” para sa apoy na pinananatili. Ang “hindi ito dapat mamatay” ay natural ding pananalita para sa apoy at pinananatili ang intransitibong anyo.
