  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: tl
  text: Ang apoy ay dapat panatilihing patuloy na nagniningas sa altar[a]; hindi ito dapat mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang apoy ay patuloy na nagniningas sa altar; hindi ito mamamatay.”
