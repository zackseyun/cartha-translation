translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “maaaring” upang ipakita ang pahintulot sa tuntuning pangritwal, at “lubhang banal” upang maiwasan ang posibleng spatial na kahulugan ng “kabanal-banalan.”
