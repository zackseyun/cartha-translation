  yaml_path: translation/ot/leviticus/006/022.yaml
  text: Every male among the priests may eat it[a]; it is most holy.
translation:
  language: tl
  text: Bawat lalaki sa mga pari ay maaaring kumain niyon. Iyon ay lubhang banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kabanalan ng mga kabanalan,” isang idyomang nangangahulugang “lubhang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר
  choice: Bawat lalaki
  rationale: Pinananatili ng “bawat” ang distributibong diwa ng כָּל kasama ng pang-isahang זָכָר, at ipinahahayag ng “lalaki” ang tiyak na kasariang tinutukoy sa tuntuning ito.
- source_word: בַּכֹּהֲנִים
  choice: sa mga pari
  rationale: Ipinahihiwatig ng pariralang ito ang pagiging kabilang sa pangkat ng mga pari; natural sa Tagalog ang “bawat lalaki sa mga pari.”
- source_word: יֹאכַל
  choice: ay maaaring kumain
  rationale: Sa kontekstong legal at pangritwal, ipinahahayag ng imperfect ang pinahihintulutang gawain, hindi ang utos na kailangang kumain ang bawat isa.
- source_word: אֹתָהּ
  choice: niyon
  rationale: Tumutukoy ang panghalip sa handog na naunang binanggit nang hindi na inuulit o ipinapasok sa teksto ang salitang “handog.”
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: lubhang banal
  rationale: Ito ay superlatibong idyomang Hebreo para sa pinakamataas na antas ng kabanalan. Ang “lubhang banal” ay malinaw at hindi madaling mapagkamalang pangalan ng isang lugar.
- source_word: הִוא
  choice: Iyon ay
  rationale: Ang pambabaeng panghalip sa Hebreo ay umaayon sa gramatikal na kasarian ng tinutukoy; sa Tagalog, natural itong isalin sa walang-kasariang “iyon.”
