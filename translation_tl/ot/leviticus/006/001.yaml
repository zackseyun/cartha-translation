  yaml_path: translation/ot/leviticus/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises[a], na nagsabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw at ang pagkakaiba ng דִּבֵּר (“magsalita”) sa אָמַר (“magsabi”).
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang rekonstruksiyong bigkas na “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong pinatutungkulan ng pagsasalita; “Moises” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang pormulang Hebreo na naghahanda sa tuwirang pahayag sa susunod na talata, kahit bahagyang pormal ang tunog nito sa Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan nang hindi ito pinapalitan ng titulong “PANGINOON”; inilalahad sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Sadyang pinanatili ang “At” at “na sinasabi” upang maipakita ang daloy at pormula ng orihinal na Hebreo.
