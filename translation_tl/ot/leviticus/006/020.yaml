  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: tl
  text: Anumang humipo sa laman nito ay magiging banal. At kung may tumilamsik[a] na dugo nito sa isang kasuutan, lalabhan mo sa isang banal na lugar ang kasuutang natilamsikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maiwisik.” Maaaring tumukoy ang pandiwang Hebreo sa ritwal na pagwiwisik, ngunit “tumilamsik” ang ginamit dito dahil napunta ang dugo sa kasuutan at kailangang labhan iyon pagkatapos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Anumang
  rationale: Ipinahahayag nito ang malawak at di-tiyak na saklaw ng Hebreong parirala at natural ito sa makabagong Tagalog.
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: dumikit sa laman nito
  rationale: Pinananatili ng “laman” ang kongkretong kahulugan ng בָּשָׂר sa konteksto ng handog; ang “nito” ay tumutukoy sa handog para sa kasalanan.
- source_word: יִקְדָּשׁ
  choice: ay magiging banal
  rationale: Ipinakikita ng pandiwa ang pagpasok sa kalagayang banal dahil sa pagdikit, nang hindi ipinahihiwatig ang hiwalay na seremonya ng pagtatalaga.
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: At kung may tumilamsik na dugo nito
  rationale: Ang נזה ay tumutukoy sa dugong napapunta sa kasuutan. Ang “tumilamsik” ay angkop sa agarang konteksto ng paglalaba, habang kinikilala sa talababa ang posibleng ritwal na diwa.
- source_word: עַל הַבֶּגֶד
  choice: sa isang kasuutan
  rationale: Ang “isang kasuutan” ay natural na pangkalahatang pananalita sa isang tuntuning pangkaso at mas tiyak kaysa sa kolektibong “damit.”
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ תְּכַבֵּס
  choice: lalabhan mo ... ang kasuutang natilamsikan
  rationale: Nililinaw nito na ang kasuutang tinamaan ng dugo ang lalabhan, at pinananatili ang tuwirang utos sa ikalawang panauhan.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: sa isang banal na lugar
  rationale: Hindi nito labis na tinutukoy ang panloob na santuwaryo; pinananatili nito ang di-tiyak na banal na lugar sa Hebreo.
theological_decisions:
- issue: Kabanalang naipapasa sa pamamagitan ng pagdikit sa laman ng handog
  choice: “magiging banal,” bilang pagbabago ng ritwal na kalagayan
  alternative: “itatalaga bilang banal” o “para lamang sa banal na gamit”
  rationale: Pinananatili ng salin ang pahayag ng teksto nang hindi ito ginagawang panloob na moral na pagbabago o nililimitahan agad sa isang partikular na paliwanag sa kultikong kabanalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang bokabularyong madaling maunawaan ngunit pinanatili ang teknikal na diwa ng ritwal na kabanalan. Inilagay ang talababa sa “tumilamsik,” ang salitang talagang tinutukoy ng leksikal na alternatibo.
