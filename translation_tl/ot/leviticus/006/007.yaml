  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: tl
  text: 'At ito ang tuntunin tungkol sa handog na butil: ihaharap ito ng mga anak na lalaki ni Aaron sa harap ni Yahweh, sa tapat ng altar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזֹאת
  choice: At ito ang
  rationale: Pinananatili ang pang-ugnay at ang demonstratibong panimula sa isang bagong bahagi ng mga tagubilin.
- source_word: תּוֹרַת
  choice: tuntunin tungkol sa
  rationale: Sa kontekstong ito, tumutukoy ang תּוֹרָה sa itinakdang pamamaraang panghandog. Ang “tuntunin” ay natural sa makabagong Tagalog at nagpapanatili sa legal at ritwal na diwa.
- source_word: הַמִּנְחָה
  choice: handog na butil
  rationale: Sa batas ng paghahandog sa Levitico, ang מִנְחָה ay tiyak na handog mula sa butil, hindi lamang isang pangkalahatang regalo o handog.
- source_word: הַקְרֵב אֹתָהּ
  choice: ihaharap ito
  rationale: Ipinapahayag nito ang ritwal na pagdadala at paghaharap ng handog; natural at sapat na malapit sa Hebreo ang “ihaharap.”
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak ni Aaron
  rationale: Tuwirang pinananatili ang katawagang pampamilya at pangpari.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinakikita ng לִפְנֵי ang paghaharap sa banal na presensiya, at pinananatili ang pangalang tipan na Yahweh.
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: sa harapan ng altar
  rationale: Pinananatili ang tiyak na lokasyong ritwal at inihihiwalay ito sa naunang pariralang tumutukoy sa presensiya ni Yahweh.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan nang hindi nag-aangkat ng denominasyonal na paliwanag.
- issue: Kahulugan ng תּוֹרָה sa batas tungkol sa paghahandog
  choice: tuntunin
  alternative: kautusan; tagubilin
  rationale: Ang “tuntunin” ay malinaw na tumutukoy sa itinakdang ritwal na pamamaraan at hindi labis na nagpapakitid sa masaklaw na kahulugan ng תּוֹרָה.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” isang karaniwan at madaling maunawaang terminong panrelihiyon. Pinanatili ang magkaibang anyo na “sa harap ni Yahweh” at “sa harapan ng altar” upang hindi mapag-isa ang dalawang magkaibang pariralang Hebreo.
