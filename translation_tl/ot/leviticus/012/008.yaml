base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: tl
  text: Ngunit kung hindi niya kayang maglaan para sa isang kordero, magdadala siya ng dalawang kalapating-bato o dalawang inakay na kalapati—isa bilang handog na sinusog at isa bilang handog para sa kasalanan[a]. Magbabayad-sala ang pari para sa kanya, at magiging malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Sa kontekstong ito, ang handog ay may kinalaman sa ritwal na karumihan matapos manganak.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: hindi niya kayang maghandog ng isang kordero
  rationale: Ang literal na idyomang ‘hindi makasumpong ang kanyang kamay ng sapat’ ay tumutukoy sa kakayahang pinansiyal. Ipinahahayag ng salin ang praktikal na diwa sa natural na Filipino at nililinaw na ang kakulangan ay ukol sa paghahandog.
- source_word: שֶׂה
  choice: isang kordero
  rationale: Sa konteksto ng handog sa naunang talata, ‘kordero’ ang natural at tiyak na katumbas.
- source_word: שְׁתֵּי תֹרִים
  choice: dalawang batu-bato
  rationale: Ang תֹרִים ay tumutukoy nang tiyak sa mga turtledove; ‘batu-bato’ ang karaniwang katawagang Filipino sa ibong ito.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dalawang inakay na kalapati
  rationale: Ang parirala ay idyoma para sa mga batang kalapati; malinaw at natural ang ‘inakay na kalapati.’
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumpak at madaling maunawaang katawagan para sa handog na inihahandog sa pamamagitan ng pagsunog.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Pinananatili nito ang karaniwang kahulugan ng terminong panghandog, habang inilalahad sa talababa ang posibleng kontekstuwal na ‘handog para sa paglilinis.’
- source_word: וְכִפֶּר עָלֶיהָ
  choice: magbabayad-sala ang pari para sa kanya
  rationale: Pinananatili ng ‘magbabayad-sala’ ang kultiko at teolohikal na bigat ng כפר nang hindi tinutukoy nang labis ang mekanismo nito.
- source_word: וְטָהֵרָה
  choice: magiging malinis siya
  rationale: Tuwirang ipinahahayag nito ang pagpapanumbalik sa kalinisan ayon sa ritwal.
theological_decisions:
- issue: Pagpapakahulugan sa חַטָּאת sa konteksto ng paglilinis matapos manganak
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Bagaman ritwal na karumihan at hindi personal na kasalanang moral ang sentro ng konteksto, pinananatili sa pangunahing teksto ang karaniwang katawagan. Inilalagay sa talababa ang kontekstuwal na alternatibo upang hindi mawala ang tunay na saklaw at tensiyon ng terminong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kumuha siya’ bilang likas na pautos na katumbas ng Hebreong anyong pandiwa, at pinanatili ang natatanging bokabularyong panghandog nang may sapat na linaw para sa karaniwang mambabasa.
