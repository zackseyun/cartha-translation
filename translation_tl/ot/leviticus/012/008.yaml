revisions:
- from: Ngunit kung hindi niya kayang maghandog ng isang kordero, kumuha siya ng dalawang batu-bato o dalawang inakay na kalapati—isa bilang handog na sinusunog at isa bilang handog para sa kasalanan[a]. Sa gayon, magbabayad-sala ang pari para sa kanya, at magiging malinis siya.
  to: Ngunit kung hindi niya kayang maglaan para sa isang kordero, magdadala siya ng dalawang kalapating-bato o dalawang inakay na kalapati—isa bilang handog na sinusog at isa bilang handog para sa kasalanan[a]. Magbabayad-sala ang pari para sa kanya, at magiging malinis siya.
  rationale: Inayos ang pandiwang tumutukoy sa pagdadala ng mga ibon upang tumugma sa legal na panghinaharap na daloy ng Hebreo. Pinalitan ang katawagan para sa turtledove at burnt offering para sa mas malinaw at matatag na modernong Filipino, nang hindi binabago ang kahulugan. Pinanatili ang lexical na alternatibo para sa חַטָּאת sa talababa.
