lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapatuloy sa salaysay at nagpapakilala ng pormal na pahayag ng Diyos. Likas sa modernong Tagalog ang “At nagsalita” at mas malapit ito sa Hebreo kaysa simpleng “sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan nito ang taong pinatutungkulan ng pagsasalita; “kay” ang natural na anyo bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang karaniwan at madaling makilalang anyo ng pangalang Hebreo sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na estruktura ng Hebreong pormula na nagpapakilala sa mismong nilalaman ng pahayag, bagaman sa karaniwang Tagalog ay maaari itong paikliin.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay karaniwang akademikong transliterasyon at pinananatili ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; inilalagay sa talababa ang alternatibong “Jehovah.”
translation_notes:
  register: Pormal at marangal ngunit nauunawaan sa modernong Filipino. Ang “na sinasabi” ay bahagyang Hebraiko sa tunog, ngunit sadyang pinanatili upang ihanda ang tuwirang pahayag sa kasunod na talata at katawanin ang לֵאמֹר.
