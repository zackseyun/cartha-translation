  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Sinabi ni Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isalin bilang “Jehovah.”'
