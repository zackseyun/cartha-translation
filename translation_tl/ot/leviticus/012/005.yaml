revisions:
- from: Ngunit kung sanggol na babae ang isisilang niya, magiging marumi siya sa loob ng dalawang linggo, gaya ng kalagayan niya kapag nireregla[a]. At sa loob ng animnapu't anim na araw, mananatili siya sa dugo ng paglilinis[b].
  to: Ngunit kung magsisilang siya ng sanggol na babae, magiging marumi siya ayon sa ritwal[a] sa loob ng dalawang linggo, tulad ng sa panahon ng kanyang regla. At mananatili siya sa dugo ng paglilinis[b] sa loob ng animnapu't anim na araw.
  rationale: Inayos ang pagbuo ng sugnay ng panganganak at ang rehistro ng pagtukoy sa regla. Idinagdag ang “ayon sa ritwal” upang maipakita ang kahulugang kultiko ng Hebrew sa paraang hindi nagpapahiwatig ng moral na paghatol. Inilipat ang unang talababa sa terminong aktuwal nitong nililinaw; nanatiling buo ang bilang, paghahambing, at ritwal na parirala ng pinagmulan.
