  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: tl
  text: Ngunit kung magsisilang siya ng sanggol na babae, magiging marumi siya ayon sa ritwal[a] sa loob ng dalawang linggo, tulad ng sa panahon ng kanyang regla. At mananatili siya sa dugo ng paglilinis[b] sa loob ng animnapu't anim na araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “marumi” rito ay tumutukoy sa ritwal na kalagayan kaugnay ng regla, hindi sa moral na pagkakasala.
    reason: lexical_alternative
  - marker: b
    text: Ang “dugo ng paglilinis” ay tumutukoy sa itinakdang panahon ng paglilinis matapos manganak; hindi ito nagpapahiwatig ng moral na pagkakasala.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang paghahambing at kaibahan sa naunang kaso, habang pinananatili ang kondisyunal na diwa.
- source_word: נְקֵבָה תֵלֵד
  choice: sanggol na babae ang isisilang niya
  rationale: Ang נְקֵבָה ay tuwirang tumutukoy sa kasariang babae; nilinaw ng “sanggol” ang konteksto ng panganganak nang hindi ginagamit ang bahagyang mas interpretibong “anak na babae.”
- source_word: וְטָמְאָה
  choice: magiging marumi siya
  rationale: Tumutukoy ito sa itinakdang ritwal na kalagayan, hindi sa personal na kasalanan o kawalan ng kalinisan sa moral.
- source_word: שְׁבֻעַיִם
  choice: sa loob ng dalawang linggo
  rationale: Ang anyong dual ay likas na nangangahulugang dalawang linggo sa kontekstong ito.
- source_word: כְּנִדָּתָהּ
  choice: gaya ng kalagayan niya kapag nireregla
  rationale: Inihahayag ang paghahambing sa ritwal na kalagayang kaugnay ng regla sa natural at malinaw na modernong Filipino.
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: sa loob ng animnapu't anim na araw
  rationale: Pinagsama ang Hebreong bilang sa karaniwang anyo sa Filipino habang eksaktong pinananatili ang dami.
- source_word: תֵּשֵׁב
  choice: mananatili siya
  rationale: Bagaman literal na “uupo” o “mananahan,” ang pandiwa rito ay tumutukoy sa pagpapatuloy sa isang itinakdang kalagayan o panahon.
- source_word: דְּמֵי טָהֳרָה
  choice: dugo ng paglilinis
  rationale: Pinananatili ang natatanging ritwal na parirala ng Hebrew (literal na “mga dugo ng paglilinis”) sa likas na isahang anyo sa Filipino, nang hindi tahimik na pinapakahulugan ito bilang moral na paglilinis.
theological_decisions:
- issue: Kalikasan ng pagiging marumi matapos manganak
  choice: Ginamit ang “marumi” bilang katawagang ritwal at ipinaliwanag sa talababa na hindi ito paghatol sa moralidad.
  alternative: “marumi ayon sa ritwal” sa pangunahing teksto
  rationale: Walang tahasang katumbas ng “ayon sa ritwal” sa Hebrew. Pinananatili ng salin ang terminolohiya ng teksto habang iniiwasan ng talababa ang maling pag-unawang moral.
- issue: Kahulugan ng “dugo ng paglilinis”
  choice: Pinanatili ang Hebreong ritwal na parirala at nilinaw sa talababa na tumutukoy ito sa itinakdang panahon matapos manganak.
  alternative: “panahon ng paglilinis mula sa pagdurugo”
  rationale: Ang alternatibo ay mas malinaw ngunit mas tahasang interpretibo. Ang pangunahing salin ay nagpapanatili ng larawan at tunay na hirap ng parirala sa Hebrew.
translation_notes:
  register: Modernong Filipino na may dignidad at payak na legal na himig. Ginamit ang “nireregla” dahil karaniwan at malinaw ito sa kasalukuyang Filipino; pinanatili naman ang teknikal na pariralang “dugo ng paglilinis” upang hindi mawala ang ritwal na wika at ambiguwidad ng Hebrew.
