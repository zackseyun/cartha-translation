  terminology: Ang “paglilinis,” “banal na bagay,” at “santuwaryo” ay angkop sa ritwal at legal na konteksto at hindi nagpapahiwatig ng moral na pagkakasala. Pinananatili ng “dugo ng kanyang paglilinis” ang sinasadyang kongkreto at bahagyang mahirap na pananalita ng Hebreo.
