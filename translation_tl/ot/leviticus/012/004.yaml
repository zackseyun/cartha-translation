  source_fidelity: Tumpak ang bilang, ang tagal na ipinahihiwatig ng תֵּשֵׁב, ang mahirap na pariralang “dugo ng kanyang paglilinis,” ang pagbabawal ukol sa banal na bagay, at ang hangganang panahon ng paglilinis. Gayunman, ang “hindi siya hahawak” ay mas makitid kaysa תִגָּע, na nangangahulugang “humipo/tumipo”; maaari itong unawain bilang paghawak lamang sa halip na anumang paghipo.
