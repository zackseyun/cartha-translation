  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: tl
  text: Pagkatapos, mananatili siya nang tatlumpu't tatlong araw sa dugo ng kanyang paglilinis.[a] Hindi siya dapat humipo ng anumang banal na bagay, at hindi siya papasok sa santuwaryo hanggang sa matapos ang mga araw ng kanyang paglilinis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “sa dugo ng paglilinis.” Literal na “sa mga dugo/dugo ng paglilinis” ang Hebreong parirala at tumutukoy ito sa panahon pagkatapos manganak na kaugnay ng ritwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: nang tatlumpu't tatlong araw
  rationale: Pinagsama sa likas na anyong Tagalog ang literal na 'tatlumpung araw at tatlong araw'; ipinahahayag ng 'nang' ang tagal.
- source_word: תֵּשֵׁב
  choice: mananatili siya
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagpapatuloy sa isang kalagayan, hindi sa literal na pag-upo.
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: sa dugo ng kanyang paglilinis
  rationale: Pinananatili nito ang konkretong larawan at kahirapan ng Hebreong parirala habang malinaw na iniuugnay iyon sa ritwal na paglilinis pagkatapos manganak.
- source_word: בְּ/כָל קֹדֶשׁ
  choice: anumang banal na bagay
  rationale: Inilalarawan nito ang malawak na saklaw ng Hebreo at ang tinutukoy na mga bagay na nakatalaga bilang banal.
- source_word: לֹא תִגָּע
  choice: hindi siya hahawak
  rationale: Likas na legal na pagbabawal sa Tagalog at tuwirang katumbas ng pandiwa.
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: at hindi siya papasok sa santuwaryo
  rationale: Ang 'papasok' ay likas na naghahatid ng galaw patungo at papaloob sa banal na lugar; pinananatili ng 'santuwaryo' ang kultikong kahulugan.
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: hanggang sa matapos ang mga araw ng kanyang paglilinis
  rationale: Likas na ipinahahayag sa Tagalog ang takdang hangganan at ang tahasang pambabaeng hulapi ng Hebreo.
theological_decisions:
- issue: Paglalahad sa terminolohiya ng ritwal na kalinisan nang hindi ipinahihiwatig ang moral na pagkakasala
  choice: paglilinis
  alternative: pagdadalisay
  rationale: Ang talata ay tungkol sa ritwal na kalagayan pagkatapos manganak, hindi tahasang tungkol sa personal na kasalanan. Ang 'paglilinis' ay malinaw at karaniwang nauunawaan, samantalang pinananatili ng konteksto ang kultikong diwa.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang legal na himig nang hindi nagiging sobrang teknikal; pinanatili ang di-karaniwang larawang 'dugo ng kanyang paglilinis' sa halip na ipaliwanag ito sa mismong talata.
