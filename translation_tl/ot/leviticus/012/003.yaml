  text: At sa ikawalong araw, tutuliin ang laman ng dulong-balat niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas natural na pananalita: “dapat siyang tuliin sa ikawalong araw.” Pasibo ang anyo ng pandiwa sa Hebreo, at pinananatili iyon sa pangunahing teksto.'
