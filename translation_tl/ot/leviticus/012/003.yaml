lexical_decisions:
- source_word: וּ/בַ/יּוֹם
  choice: At sa ... araw
  rationale: Likas na ipinahahayag sa Filipino ang pang-ugnay at panandang temporal, habang pinananatili ang pagkakasunod-sunod ng tagubiling legal.
- source_word: הַ/שְּׁמִינִי
  choice: ikawalo
  rationale: Karaniwang salin ng ordinal na tumutukoy sa araw.
- source_word: יִמּוֹל
  choice: tutuliin
  rationale: Pinananatili ng pandiwang Filipino na nasa pokus sa layon ang pasibong anyo at ang preskriptibong lakas ng Niphal imperfect, nang hindi tinutukoy kung sino ang gagawa.
- source_word: בְּשַׂר
  choice: ang laman
  rationale: Tuwirang katumbas ng Hebrew na 'laman' at pinananatili ang estruktura ng pariralang construct.
- source_word: עָרְלָתוֹ
  choice: ng kanyang dulong-balat
  rationale: Ang 'dulong-balat' ay malinaw at dignified na modernong katawagan para sa foreskin; ipinahahayag ng 'kanyang' ang hulaping ikatlong panauhang panlalaki.
