- from: Ihahandog niya iyon sa harap ni Yahweh at magsasagawa siya ng pagtubos para sa babae. Sa gayon, lilinisin ang babae mula sa pinagmumulan ng kanyang dugo.[a] Ito ang kautusan tungkol sa babaeng nanganganak ng lalaki o babae.
  to: Ihahandog niya ito sa harap ni Yahweh at magsasagawa siya ng pagtubos para sa kanya, at magiging malinis siya mula sa pinagmumulan ng kanyang dugo.[a] Ito ang kautusan tungkol sa babaeng nagsilang ng sanggol na lalaki o babae.
  rationale: Inayos ang pandiwang tumutukoy sa ritwal na kalagayan ng babae upang masundan ang Hebreo, at nilinaw na ang mga katagang “lalaki o babae” ay tumutukoy sa sanggol na isinilang. Pinanatili ang literal na larawan ng “pinagmumulan ng kanyang dugo” at ang umiiral na talababa.
