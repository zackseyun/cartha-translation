base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: tl
  text: Ihahandog niya ito sa harap ni Yahweh at magsasagawa siya ng pagtubos para sa kanya, at magiging malinis siya mula sa pinagmumulan ng kanyang dugo.[a] Ito ang kautusan tungkol sa babaeng nagsilang ng sanggol na lalaki o babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mula sa pag-agos ng kanyang dugo.” Literal sa Hebreo: “mula sa pinagmumulan ng kanyang dugo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: Ihahandog niya iyon
  rationale: Ang Hiphil ng קרב na may panghalip na layon ay tumutukoy sa paghaharap ng pari sa handog na binanggit sa naunang talata. Likas sa kontekstong panghandog ang “ihahandog,” samantalang hindi idinaragdag sa teksto ang tahasang pangngalang “pari.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang karaniwang pormulang panritwal na “sa harap” o “sa presensya” ng Diyos at isinasalin ang pangalan ng tipan na יהוה bilang “Yahweh.”
- source_word: וְכִפֶּר עָלֶיהָ
  choice: at magsasagawa siya ng pagtubos para sa babae
  rationale: Sa kontekstong pansakripisyo ng Levitico, ang כפר ay tumutukoy sa pagsasagawa ng pagtubos. Hindi nito nililimitahan ang salita sa isang partikular na teorya ng pagtubos. Inulit ang “babae” sa halip na “kanya” upang maging malinaw ang tinutukoy sa natural na Filipino.
- source_word: וְטָהֲרָה
  choice: Sa gayon, lilinisin ang babae
  rationale: Ang sunurang pandiwa ay nagpapahayag ng resultang kalagayan ng ritwal na paglilinis. Ang “lilinisin” ay malinaw sa modernong Filipino at nagpapanatili sa bokabularyo ng kalinisan sa Levitico.
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: mula sa pinagmumulan ng kanyang dugo
  rationale: Ang מָקוֹר ay literal na “pinagmumulan, bukal.” Pinananatili ng salin ang larawan sa Hebreo, habang inilalagay sa talababa ang mas interpretatibong kahulugang tumutukoy sa pag-agos ng dugo matapos manganak.
- source_word: זֹאת תּוֹרַת
  choice: Ito ang kautusan tungkol sa
  rationale: Dito, ang תּוֹרָה ay isang itinakdang tuntunin o tagubiling panritwal. Ang “kautusan” ay marangal, madaling maunawaan, at angkop sa pormulang ginagamit sa Levitico.
- source_word: הַיֹּלֶדֶת
  choice: babaeng nanganganak
  rationale: Tuwirang inilalarawan ng participle ang babaeng nagsisilang. Mas eksakto ito kaysa sa mas malawak na salitang “ina.”
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: ng lalaki o babae
  rationale: Pinananatili ang mga terminong pangkasarian na “lalaki” at “babae.” Sa Filipino, malinaw mula sa “nanganganak” na ang tinutukoy ay ang batang isinilang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal at pangtipang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng כפר sa konteksto ng paglilinis matapos manganak
  choice: magsasagawa ng pagtubos para sa babae
  alternative: maglilinis para sa babae; mag-aalis ng sala para sa babae
  rationale: Pinananatili ng “pagtubos” ang malawak na wikang pansakripisyo ng כפר at ang tensiyon sa pagitan ng handog, pagtubos, at ritwal na paglilinis, nang hindi ipinahihiwatig na moral na kasalanan ang panganganak o pagdurugo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang bokabularyong panritwal ng Levitico, ngunit iniwasan ang labis na teknikal o sektaryong pananalita. Ang maiikling pangungusap ay nagbibigay-linaw sa resulta ng ritwal na pagkilos.
