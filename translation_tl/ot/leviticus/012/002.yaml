  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: tl
  text: '“Sabihin mo sa mga anak ni Israel: Kung ang isang babae ay magdalang-tao at manganak ng lalaking sanggol, magiging marumi siya sa loob ng pitong araw; magiging marumi siya gaya ng mga araw ng kanyang karumihan sa panahon ng kanyang regla.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal at tipanang katawagan ng Hebreo, na tumutukoy sa sambayanan ng Israel.
- source_word: אִשָּׁה כִּי תַזְרִיעַ
  choice: kung ang isang babae ay magdalang-tao
  rationale: Ang כִּי ay nagpapakilala ng kasong legal at maaaring isaling ‘kung’; ang תַזְרִיעַ ay likas na ipinahahayag sa modernong Filipino bilang ‘magdalang-tao.’
- source_word: וְיָלְדָה זָכָר
  choice: at manganak ng isang batang lalaki
  rationale: Malinaw at natural na ipinahahayag ang panganganak at ang lalaking kasarian ng sanggol.
- source_word: וְטָמְאָה
  choice: magiging marumi siya
  rationale: Pinananatili ang mismong pahayag na ‘marumi’ nang hindi idinaragdag sa pangunahing teksto ang paliwanag na ritwal o seremonyal.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na Filipino para sa itinakdang tagal.
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ
  choice: gaya ng sa mga araw ng karumihan niya dahil sa pagreregla
  rationale: Ipinapakita ang paghahambing at nililinaw na ang tinutukoy na karumihan ay kaugnay ng regla, habang pinananatili ang wikang pangkadalisayang-batas.
- source_word: תִּטְמָא
  choice: magiging marumi siya
  rationale: Inuulit ang katayuan ng karumihan gaya ng tahasang pag-uulit sa Hebreo.
theological_decisions:
- issue: Kalikasan ng טמא sa mga batas tungkol sa kadalisayan
  choice: marumi
  alternative: ritwal na marumi
  rationale: Ritwal na katayuan ang tinutukoy ng konteksto, ngunit ang Hebreo mismo ay nagsasabing ‘marumi.’ Hindi idinagdag sa pangunahing teksto ang paliwanag na ‘ritwal.’
- issue: Pagpapahayag sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyo ng pambansa at tipanang katawagan sa pinagmulang teksto nang hindi nililimitahan ang tagubilin sa mga lalaking Israelita lamang.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang pormal na ‘mga anak ni Israel’ at ang natural na pariralang ‘magdalang-tao.’ Walang talababa dahil ang mga kinakailangang kahulugan ay maipahahayag nang malinaw sa pangunahing teksto.
