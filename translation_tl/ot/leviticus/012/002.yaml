  naturalness: May hindi magkatugmang panipi sa draft, at medyo hindi likas ang “gaya ng sa mga araw.” Ang rebisyon ay gumagamit ng tuwid at dignipikadong modernong Filipino habang pinananatili ang legal na himig.
