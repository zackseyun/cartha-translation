id: LEV.12.6
reference: Leviticus 12:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: tl
  text: Kapag natapos na ang mga araw ng kanyang paglilinis, maging para sa isang anak na lalaki o anak na babae, magdadala siya ng isang korderong isang taóng gulang bilang handog na sinusunog, at ng isang inakay na kalapati o batu-bato bilang handog para sa kasalanan[a], sa pari sa pasukan ng toldang tipanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang salitang Hebreo ay maaaring tumukoy sa handog na nag-aalis ng ritwal na karumihan, hindi lamang sa handog para sa paglabag na moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/מְלֹאת
  choice: Kapag natapos na
  rationale: Ang pang-ukol na may infinitive construct ng מלא ay nagsasaad ng pagtatapos ng isang takdang panahon; natural at malinaw ito sa modernong Tagalog.
- source_word: יְמֵי טָהֳרָהּ
  choice: ang mga araw ng kanyang paglilinis
  rationale: Ang טָהֳרָה ay tumutukoy sa ritwal na paglilinis o pagiging malinis, hindi sa moral na pagbabago.
- source_word: לְ/בֵן א֣וֹ לְ/בַת
  choice: maging para sa isang anak na lalaki o anak na babae
  rationale: Ipinakikita ng parirala na ang tuntunin ay para sa alinmang kalagayan ng panganganak.
- source_word: תָּבִיא
  choice: magdadala siya
  rationale: Ang Hiphil imperfect sa tekstong legal ay may preskriptibong puwersa; ipinahahayag ito ng hinaharap na anyo sa natural na Tagalog nang hindi labis na pinatitindi.
- source_word: כֶּבֶשׂ בֶּן שְׁנָת/וֹ
  choice: isang korderong isang taóng gulang
  rationale: Tuwirang ipinahahayag ng idyoma ang edad ng kordero at pinananatili ang eksaktong detalye.
- source_word: לְ/עֹלָה
  choice: bilang handog na sinusunog
  rationale: Ang עֹלָה ay teknikal na katawagan sa handog na buong sinusunog; ang saling ito ay malinaw at pamilyar sa modernong Tagalog.
- source_word: וּ/בֶן יוֹנָה אוֹ תֹר
  choice: isang inakay na kalapati o batu-bato
  rationale: Ang בֶּן־יוֹנָה ay batang kalapati, samantalang ang תֹר ay turtledove, na karaniwang tinatawag na batu-bato sa Filipino.
- source_word: לְ/חַטָּאת
  choice: bilang handog para sa kasalanan
  rationale: Ito ang kinikilalang tradisyonal na katawagang pansakripisyo, ngunit maaaring tumukoy rito sa handog para sa ritwal na paglilinis; pinananatili ang alternatibo sa talababa.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng toldang tipanan
  rationale: Tinutukoy nito ang lugar kung saan ihaharap ang mga handog; ang 'toldang tipanan' ay malinaw na salin ng kultikong katawagan.
- source_word: אֶל הַ/כֹּהֵן
  choice: sa pari
  rationale: Ang ikalawang אֶל ay tumutukoy sa tatanggap ng mga handog; ang 'sa pari' ang pinakadiretso at natural na salin.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng paglilinis pagkatapos manganak
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang חַטָּאת ang tradisyonal na teknikal na katawagan sa sistemang pansakripisyo, ngunit sa kontekstong ito ay may kinalaman ang ritwal sa pag-aalis ng karumihang ritwal pagkatapos manganak, hindi sa pagpapalagay na kasalanang moral ang panganganak. Pinananatili sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang mga teknikal na katawagang pansakripisyo nang hindi ipinahihiwatig na kasalanang moral ang panganganak.
