    issue: Hindi gaanong natural ang pariralang "karumihang ritwal" sa talababa.
    rationale: Ang "ritwal na karumihan" ang mas karaniwang ayos sa modernong Filipino at mas malinaw na inilalarawan ang uri ng karumihan na tinutukoy sa kontekstong Levitico.
