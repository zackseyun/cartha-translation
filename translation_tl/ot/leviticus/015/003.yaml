base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: tl
  text: 'At ito ang magiging karumihan niya kaugnay ng kanyang agas: kung ang kanyang katawan ay naglalabas ng agas[a], o kung hindi makalabas ang agas dahil nabara ang kanyang katawan, iyon ang kanyang karumihan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umaagos ang kanyang laman kasama ng kanyang agas ... o napigil ang kanyang laman mula sa kanyang agas.” Dito, ang “laman” ay tumutukoy sa katawan o sa bahaging pisikal na sangkot sa agas.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: karumihan niya
  rationale: Tumutukoy ito sa ritwal na kalagayan ng pagiging marumi ayon sa mga tuntunin sa Levitico, hindi sa moral na kasalanan o karaniwang dumi lamang.
- source_word: זוֹב
  choice: agas
  rationale: Ang “agas” ay likas at maikli sa modernong Filipino para sa abnormal na likidong lumalabas sa katawan; napapanatili rin nito ang kaugnayan sa pandiwang “umaagos.”
- source_word: רָר
  choice: umaagos
  rationale: Malinaw nitong ipinahihiwatig ang aktibong pagdaloy o paglabas ng agas.
- source_word: בְּשָׂרוֹ
  choice: kanyang katawan
  rationale: Literal na “kanyang laman,” ngunit sa kontekstong ito ay tumutukoy sa bahaging pisikal ng katawan na sangkot sa pag-agas. Mas natural at hindi mapanlinlang ang “katawan” sa Filipino.
- source_word: הֶחְתִּים
  choice: nabara
  rationale: Ipinahihiwatig ng anyo ang pagsara o pagkabara ng katawan kaugnay ng agas, bilang kabaligtaran ng malayang pagdaloy.
- source_word: מִזּוֹבוֹ
  choice: dahil sa kanyang agas
  rationale: Bagaman maaaring panatilihin bilang “mula sa kanyang agas,” mas malinaw sa Filipino ang sanhi ng pagkabara; hindi nito inaalis ang posibleng diwa ng pagkahiwalay sa pagdaloy.
- source_word: וְזֹאת תִּהְיֶה
  choice: At ito ang magiging
  rationale: Pinananatili nito ang pang-ugnay at ang pormulang pambatas na nasa hinaharap.
- source_word: אוֹ
  choice: '... man ... o ... man'
  rationale: Natural na paraang Filipino upang ihayag ang dalawang alternatibong kalagayan na kapuwa saklaw ng parehong hatol.
theological_decisions:
- issue: Kahulugan ng ritwal na karumihan
  choice: karumihan
  alternative: pagiging di-malinis
  rationale: Pinananatili ng “karumihan” ang kategoryang ritwal sa Levitico nang hindi ito tahasang ginagawang moral na pagkakasala.
translation_notes:
  register: Makabago at marangal na wikang pambatas. Ginamit ang “agas” bilang malinaw ngunit hindi magaspang na terminong pangkatawan; iniwasan ang labis na espesipikong pagtukoy sa ari sapagkat “laman” lamang ang tahasang nasa Hebreo.
