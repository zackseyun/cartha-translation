  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: tl
  text: Ang bawat higaan na hinihigaan ng lalaking may pag-agas ay magiging marumi, at ang anumang bagay[a] na inuupuan niya ay magiging marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gamit” o “kagamitan.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa isang bagay, kagamitan, o sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: higaan
  rationale: Tumutukoy ang מִשְׁכָּב sa lugar o bagay na hinihigaan. Ang “higaan” ay natural sa modernong Tagalog at mas malawak nang kaunti kaysa “kama,” kaya hindi nito nililimitahan ang tinutukoy sa isang partikular na uri ng muwebles.
- source_word: הַזָּב
  choice: ang lalaking may tumutulong likido sa katawan
  rationale: Ang זָב ay panlalaking pangngalang anyo na tumutukoy sa taong nakararanas ng pag-agas ng likido sa katawan. Pinananatili ng salin ang panlalaking pagtukoy at malinaw na inilalarawan ang kalagayan nang hindi gumagamit ng teknikal o lipas na katawagan.
- source_word: יִשְׁכַּב עָלָיו
  choice: na hihigaan
  rationale: Natural na ipinahahayag sa Tagalog ng “hihigaan” ang Hebreong sugnay na literal na “na hihiga siya sa ibabaw nito,” habang napapanatili ang pangkalahatang tuntuning legal.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinahahayag nito ang katayuan ng ritwal na karumihan bilang bunga ng pagdikit o paggamit. Hindi idinagdag sa pangunahing teksto ang salitang “ritwal” sapagkat wala itong tahasang katumbas sa Hebreo.
- source_word: הַכְּלִי
  choice: bagay
  rationale: Malawak ang saklaw ng כְּלִי at maaari itong mangahulugang gamit, kagamitan, sisidlan, o iba pang bagay. Sa konteksto ng isang bagay na inuupuan, ang “bagay” ang pinakanatural at hindi nakaliligaw na pangkalahatang katumbas.
- source_word: יֵשֵׁב עָלָיו
  choice: na uupuan niya
  rationale: Direkta at natural itong katumbas ng Hebreong “na uupo siya sa ibabaw nito” at angkop sa pangkalahatang pahayag ng batas.
theological_decisions:
- issue: Kalikasan ng karumihan
  choice: marumi
  alternative: marumi ayon sa tuntuning ritwal; nadungisan
  rationale: Ang tinutukoy ay katayuan sa sistemang Levitico ng kadalisayan, hindi awtomatikong moral na pagkakasala. Ang payak na “marumi” ang tuwirang salin at hindi nagdaragdag ng paliwanag na wala sa teksto.
- issue: Kasarian ng taong may pag-agas
  choice: lalaki at mga panghalip na panlalaki
  alternative: taong may tumutulong likido at walang-tiyak na kasarian
  rationale: Panlalaking isahan ang mga anyo sa Hebreo, at tungkol sa pag-agas ng lalaki ang agarang konteksto. Kaya tahasang pinananatili ang kasarian ng tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “higaan” sa halip na mas makitid na “kama,” at ipinaliwanag ang pag-agas sa karaniwang wika. Inilagay ang [a] kaagad pagkatapos ng salitang “bagay,” na siyang tinutukoy ng talababa.
