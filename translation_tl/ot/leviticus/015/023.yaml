  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: tl
  text: At kung ito ay nasa higaan o sa gamit na inuupuan niya[a], magiging marumi hanggang gabi ang isang taong humipo rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bagay,” “kagamitan,” o “sisidlan” ang salitang isinaling “gamit” (Hebreo כְּלִי), na may malawak na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at ang kondisyong kaugnay ng naunang tuntunin; natural din ito sa makabagong Filipino.
- source_word: עַל הַמִּשְׁכָּב
  choice: nasa higaan
  rationale: Ang מִשְׁכָּב ay karaniwang tumutukoy sa higaan o lugar na hinihigaan; malinaw at angkop ang “higaan” sa konteksto.
- source_word: הוּא
  choice: iyon ay
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, tumutukoy ito rito sa bagay o sangkap na ipinahihiwatig ng konteksto, kaya angkop ang walang-kasariang “iyon.”
- source_word: אוֹ
  choice: o
  rationale: Karaniwang katumbas ng pang-ugnay na naghahayag ng alternatibo.
- source_word: עַל הַכְּלִי
  choice: nasa gamit
  rationale: Malawak ang saklaw ng כְּלִי—maaaring bagay, kagamitan, sisidlan, o kasangkapan. Pinananatili ng “gamit” ang lawak nito nang hindi nililimitahan sa sisidlan.
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: na inuupuan niya
  rationale: Likas na Filipino para sa kaugnay na sugnay at naipapahayag ang nagpapatuloy o karaniwang kilos ng participle.
- source_word: בְּנָגְעוֹ בוֹ
  choice: kapag hinipo niya iyon
  rationale: Ang בְּ na may infinitive construct ay nagsasaad ng panahong pangyayari. Ang “niya” ay angkop sa 3ms na anyo ngunit hindi nagdaragdag ng kasariang hindi kailangang tahasang ipahayag sa Filipino.
- source_word: יִטְמָא
  choice: magiging marumi siya
  rationale: Ipinapahayag ang resultang katayuan sa ilalim ng batas sa ritwal na kalinisan; natural ito sa Filipino at hindi ipinapakahulugang moral na pagkakasala.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tumpak at likas na katumbas ng paulit-ulit na pormula sa Levitico.
theological_decisions:
- issue: Kalikasan ng טָמֵא sa mga batas ng Levitico tungkol sa kalinisan
  choice: “marumi,” bilang katayuan ng ritwal na karumihan
  alternative: “marumi ayon sa ritwal” o “nadungisan”
  rationale: Ang talata ay tumutukoy sa katayuang ritwal, hindi kinakailangang sa moral na pagkakasala. Pinananatili ng payak na “marumi” ang mismong paraan ng pagsasalita ng teksto nang hindi nagdaragdag ng paliwanag sa pangunahing salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “higaan,” “gamit,” at “magiging marumi” bilang mga karaniwang salitang nauunawaan ng ordinaryong mambabasa, habang pinananatili ang legal at ritwal na konteksto. Ang panghalip na “siya/niya” ay likas na walang kasarian sa Filipino at hindi nagpapataw ng dagdag na interpretasyon.
