  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: tl
  text: At ang sisidlang luwad[a] na mahawakan ng taong may agas[b] ay dapat basagin, at ang bawat sisidlang kahoy ay dapat banlawan sa tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sisidlang gawa sa luwad” o “palayok.”
    reason: lexical_alternative
  - marker: b
    text: Ang “taong may agas” ay teknikal na tawag sa batas ng ritwal na kalinisan para sa taong may lumalabas na likido mula sa katawan.
    reason: cultural_note
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: sisidlang luwad
  rationale: Pinananatili nito ang mahalagang pagkakaiba ng materyal sa batas ng ritwal na kalinisan. Ang כְלִי ay sisidlan o kagamitan, at ang חֶרֶשׂ ay tumutukoy sa luwad o palayok.
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: na hipuin
  rationale: Tuwirang ipinapahayag ng Qal na נגע ang paghipo o pagdampi. Ang “hipuin” ay natural at malinaw sa Filipino.
- source_word: הַזָּב
  choice: taong may agas
  rationale: Ito ay teknikal na tawag sa batas ng ritwal na kalinisan para sa taong may lumalabas na likido mula sa katawan. Pinananatili ng “taong may agas” ang pokus ng Hebreo sa kalagayan ng tao nang hindi nagdaragdag ng paliwanag sa mismong talata.
- source_word: יִשָּׁבֵר
  choice: ay dapat basagin
  rationale: Ang anyong pasibo ay may puwersa ng legal na tagubilin sa konteksto. Natural na ipinahahayag sa modernong Filipino ng “dapat basagin” ang obligasyon.
- source_word: כָל כְּלִי עֵץ
  choice: ang bawat sisidlang kahoy
  rationale: Pinananatili ang pagkaparalelo sa sisidlang luwad at ang distributibong kahulugan ng כָל.
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: ay dapat banlawan sa tubig
  rationale: Ang שטף ay tumutukoy sa paghuhugas o pagbanlaw sa tubig. Ang “banlawan” ay angkop sa sisidlan at hindi nagpapahiwatig ng paglalaba.
theological_decisions:
- issue: Kasarian ng tinutukoy ng הַזָּב
  choice: taong may agas
  alternative: lalaking may agas
  rationale: Bagaman lalaki ang mas malawak na konteksto, ang anyo sa talatang ito ay nakatuon sa taong nasa gayong kalagayan. Hindi idinaragdag sa salin ang salitang “lalaki” na wala sa mismong parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapat” upang natural na maipahayag ang puwersa ng legal na tagubilin, at “agas” bilang maikli ngunit maipapaliwanag na terminong pangkalinisan.
