  text: וְ/כָל הַ/מֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛י/ו הַ/זָּ֖ב יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: tl
  text: At ang bawat síya[a] na sinasakyan ng lalaking may agas ay magiging marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat bagay na sinasakyan”; maaaring tumukoy ang salitang Hebreo sa anumang sinasakyan, hindi lamang sa síya sa makitid na kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: At ang bawat
  rationale: Pinananatili ng “At” ang ugnayan sa naunang tuntunin, at ipinapahayag ng “bawat” ang distributibong saklaw ng כָּל.
- source_word: הַ/מֶּרְכָּב
  choice: síya
  rationale: Ang מֶרְכָּב ay anumang bagay na sinasakyan o inuupuan habang nakasakay. Ang “síya” ay likas na tawag sa kagamitang inilalagay sa likod ng hayop para sakyan, ngunit nilalagyan ng talababa upang mapanatili ang mas malawak na posibleng kahulugan.
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: na sinasakyan
  rationale: Natural at malinaw itong salin ng sugnay na tumutukoy sa bagay na sinasakyan; ipinahihiwatig na rin ng pandiwang Filipino ang relasyong ‘sa ibabaw nito.’
- source_word: הַ/זָּב
  choice: ang lalaking may agas
  rationale: Pinananatili nito ang panlalaking reperensiya ng anyong Hebreo at ang pare-parehong katawagan sa kondisyong may lumalabas na likido sa kabanata, nang hindi nagdaragdag ng uri ng agas na hindi tahasang sinabi sa talata.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinapahayag nito ang katayuang ritwal na ibinubunga ng pagkakadikit, hindi moral na kasalanan. Ang aspektong prospektibo ng kontekstong legal ay natural na naihahatid ng “magiging.”
theological_decisions:
- issue: Kalikasan ng karumihan sa Levitico
  choice: “marumi” bilang katayuang ritwal ayon sa kautusan
  alternative: “nadungisan” o moral na marumi
  rationale: Ang talata ay tungkol sa ritwal na karumihang nauugnay sa agas ng katawan, hindi tahasang tungkol sa pagkakasala o moral na katiwalian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “síya” na may tuldik upang maiba sa panghalip na “siya.” Pinanatiling maikli ang anyong legal at iniwasang gawing moral ang ritwal na “marumi.”
