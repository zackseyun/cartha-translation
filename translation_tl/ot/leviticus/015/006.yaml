  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: tl
  text: Ang sinumang umupo sa bagay na inupuan ng lalaking may agas ay dapat maglaba ng kanyang mga damit at maligo sa tubig,[a] at magiging marumi siya hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “bagay” ay malawak at maaari ring isaling “sisidlan” o “kagamitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: Ang sinumang umupo
  rationale: Ang substantivized participle ay may pangkalahatang diwa na ‘ang sinumang umuupo’; natural sa makabagong Filipino ang ‘ang sinumang umupo’ sa ganitong probisyong legal.
- source_word: הַכְּלִי
  choice: sa bagay
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa sisidlan, kagamitan, o anumang bagay. Sa kontekstong inuupuan, pinananatili ng ‘bagay’ ang lawak nang hindi ipinapalagay na sisidlan ito.
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: na inupuan
  rationale: Maikli at likas na Filipino para sa relasyong ‘na siyang inupuan’; ipinahahayag nito ang naunang pag-upo sa bagay.
- source_word: הַזָּב
  choice: ng lalaking may agas
  rationale: Ang anyo at konteksto ay tumutukoy sa isang lalaki na may lumalabas na likido sa katawan. Ang ‘agas’ ay maikli at angkop na katawagan sa abnormal na paglabas ng likido nang hindi labis na nagpapaliwanag.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay dapat maglaba ng kanyang mga damit
  rationale: Ang כִּבֵּס ay partikular na paghuhugas ng kasuutan. Ipinahahayag ng ‘dapat’ ang obligasyon ng batas sa natural na modernong Filipino.
- source_word: וְרָחַץ בַּמַּיִם
  choice: at maligo sa tubig
  rationale: Sa konteksto ng kadalisayan, tumutukoy ang רָחַץ sa paghuhugas ng katawan; malinaw at natural ang ‘maligo sa tubig.’
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: at magiging marumi siya hanggang gabi
  rationale: Isinasaad nito ang kalagayang ritwal na kasunod ng pagdikit at ang hangganan nitong panahon. Ang ‘marumi’ ang payak at tradisyonal na salin nang hindi nagdaragdag ng moral na pagkakasala.
theological_decisions:
- issue: Kalikasan ng pagiging marumi
  choice: ‘marumi’ lamang, bilang katawagang pangkalagayang ritwal
  alternative: ‘marumi ayon sa ritwal’ o ‘nadungisan’
  rationale: Ang konteksto ay batas tungkol sa ritwal na kadalisayan, hindi tuwirang pahayag ng moral na kasalanan. Ang pagdaragdag ng ‘ayon sa ritwal’ ay paliwanag na, samantalang maaaring magpahiwatig ng higit na moral na dungis ang ‘nadungisan.’
- issue: Kasarian ng הַזָּב at ng mga panghalip
  choice: ‘lalaking may agas’ at panlalaking reperensiya
  alternative: ‘taong may agas’
  rationale: Ang seksiyong ito ng kabanata at ang mga anyong Hebreo ay tahasang panlalaki; pinananatili ito sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal. Ginamit ang ‘dapat’ para sa obligasyon at pinanatili ang payak na ‘marumi’ upang huwag ipagkamali ang ritwal na kalagayan sa moral na pagkakasala. Inilagay ang pananda [a] sa pangunahing teksto at itinugma ito sa tala.
