  text: וְ/כִֽי יִטְהַ֤ר הַ/זָּב֙ מִ/זּוֹב֔/וֹ וְ/סָ֨פַר ל֜/וֹ שִׁבְעַ֥ת יָמִ֛ים לְ/טָהֳרָת֖/וֹ וְ/כִבֶּ֣ס בְּגָדָ֑י/ו וְ/רָחַ֧ץ בְּשָׂר֛/וֹ בְּ/מַ֥יִם חַיִּ֖ים וְ/טָהֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: tl
  text: Kapag tumigil na ang pag-agas ng lalaking may pag-agas, magbibilang siya ng pitong araw para sa kanyang paglilinis. Lalabhan niya ang kanyang mga damit at huhugasan ang kanyang katawan sa tubig na umaagos[a]; saka siya magiging malinis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “buhay na tubig”; tumutukoy sa sariwa o umaagos na tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: ang lalaking may pag-agas
  rationale: Tumutukoy ang participial noun sa lalaking may abnormal na pag-agas na inilalarawan sa kabanata. Likas sa Filipino at pinananatili ang panlalaking sanggunian ng konteksto.
- source_word: יִטְהַר ... מִזּוֹבוֹ
  choice: gumaling na sa kanyang pag-agas
  rationale: Ipinahihiwatig ng parirala ang paghinto o paggaling mula sa kondisyon bago simulan ang ritwal na paglilinis. Iniiwasan nitong ipagkamali ang unang טהר sa ganap na ritwal na kalinisan, na ipinahahayag lamang sa hulihan ng talata.
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: bibilang siya ng pitong araw
  rationale: Natural na modernong Filipino para sa tagubiling legal na magbilang ng itinakdang pitong araw.
- source_word: לְטָהֳרָתוֹ
  choice: para sa kanyang paglilinis
  rationale: Ipinapahayag ang prosesong ritwal nang hindi ito ginagawang usapin ng moral na pagkakasala.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lalabhan niya ang kanyang mga damit
  rationale: Ang pandiwa ay partikular na tumutukoy sa paglalaba ng mga kasuotan.
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: paliliguan ang kanyang katawan
  rationale: Ang בשר ay literal na laman ngunit tumutukoy rito sa buong katawan; ang 'paliliguan' ay malinaw na naiiba sa paglalaba ng damit.
- source_word: בְּמַיִם חַיִּים
  choice: sa sariwang tubig
  rationale: Ang literal na 'buhay na tubig' ay idyoma para sa tubig na sariwa, umaagos, o mula sa likas na bukal. 'Sariwang tubig' ang malinaw na pangunahing teksto, habang inilalagay sa talababa ang literal at alternatibong diwa.
- source_word: וְטָהֵר
  choice: saka siya magiging malinis
  rationale: Ipinakikita ang resultang kalagayan ng ritwal na kalinisan pagkatapos ng itinakdang hakbang.
theological_decisions:
- issue: Paglalarawan sa ritwal na kalinisan nang hindi nagpapahiwatig ng moral na pagkakasala
  choice: Gamitin ang 'paglilinis' at 'magiging malinis' sa ritwal na diwa
  alternative: Gamitin ang 'pagdadalisay' at 'magiging dalisay'
  rationale: Ang Levitico 15 ay tumatalakay sa ritwal na karumihan dahil sa pag-agas, hindi awtomatikong sa personal na kasalanan. Ang piniling mga salita ay malinaw at hindi nagdaragdag ng moral na hatol.
- issue: Ugnayan ng unang יִטְהַר at pangwakas na וְטָהֵר
  choice: Isalin ang una bilang paggaling sa pag-agas at ang huli bilang pagiging malinis
  alternative: Isalin pareho gamit ang 'malinis'
  rationale: 'Pinananatili nito ang lohikal na pagkakasunod: huminto muna ang kondisyon, saka isinasagawa ang pitong araw at paghuhugas, at pagkatapos ay nagiging ritwal na malinis. Hindi nito ipinapalagay na ganap nang malinis ang lalaki bago ang ritwal.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may procedural na himig na angkop sa batas-ritwal. Ginamit ang 'pag-agas' bilang neutral at madaling maunawaang katawagan sa abnormal na discharge; iniwasan ang sobrang teknikal o moralizing na wika.
