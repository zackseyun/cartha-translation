revisions:
- from: Kapag gumaling na sa kanyang pag-agas ang lalaking may pag-agas, bibilang siya ng pitong araw para sa kanyang paglilinis. Lalabhan niya ang kanyang mga damit at paliliguan ang kanyang katawan sa sariwang tubig[a]; saka siya magiging malinis.
  to: Kapag tumigil na ang pag-agas ng lalaking may pag-agas, magbibilang siya ng pitong araw para sa kanyang paglilinis. Lalabhan niya ang kanyang mga damit at huhugasan ang kanyang katawan sa tubig na umaagos[a]; saka siya magiging malinis.
  rationale: Pinalitan ang “gumaling na” ng pananalitang tuwirang nagsasaad na tumigil ang pag-agas, upang maiwasan ang di-kinakailangang medikal na implikasyon at mapanatili ang lohikal na pagkakasunod ng ritwal. Pinalitan ang “paliliguan” ng “huhugasan” upang ipakita na ang lalaki ang gagawa ng paghuhugas. Ginawang “tubig na umaagos” ang pangunahing teksto para sa מים חיים at iniwan sa talababa ang literal na “buhay na tubig” at ang mas malawak na semantikong paliwanag.
