  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִֽי יָרֹ֛ק הַ/זָּ֖ב בַּ/טָּה֑וֹר וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: tl
  text: At kung duraan ng lalaking may agas ang isang taong malinis[a], lalabhan ng taong iyon ang kanyang mga damit at maliligo sa tubig, at magiging marumi siya hanggang gabi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang isang taong nasa kalagayang malinis.” Ang Hebreo ay literal na “ang malinis,” na tumutukoy sa taong malinis ayon sa mga tuntunin ng rituwal.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, magiging marumi siya ayon sa rituwal hanggang gabi; hindi nito kinakailangang sabihing nagkasala siya sa moral na paraan.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyong ipinahahayag ng כִּי sa pagkakasunod-sunod ng mga tuntunin.
- source_word: יָרֹק
  choice: duraan
  rationale: Ang pandiwa ay nangangahulugang “dumura”; ang anyong “duraan” ay likas sa Filipino kapag tao ang pinatutungkulan.
- source_word: הַזָּב
  choice: ang lalaking may agas
  rationale: Tumutukoy sa panlalaking isahang taong may lumalabas na agas; ang “agas” ay maikli at angkop sa konteksto ng batas sa rituwal na kalinisan.
- source_word: בַּטָּהוֹר
  choice: ang isang taong malinis
  rationale: Ang pang-uri ay ginamit bilang pangngalan at tumutukoy sa taong nasa kalagayang rituwal na malinis, hindi lamang malinis sa katawan.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: lalabhan ng taong iyon ang kanyang mga damit
  rationale: Nililinaw ng “taong iyon” na ang taong dinuraan—ang pinakamalapit na referent ng panlalaking isahang mga pandiwa—ang maglalaba at maliligo.
- source_word: וְרָחַץ בַּמַּיִם
  choice: at maliligo sa tubig
  rationale: Sa kontekstong ito, ang רָחַץ ay tumutukoy sa paghuhugas ng katawan; natural at malinaw sa Filipino ang “maliligo sa tubig.”
- source_word: וְטָמֵא
  choice: at magiging marumi siya
  rationale: Inilalarawan nito ang kalagayang rituwal, hindi awtomatikong moral na pagkakasala.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Likas na Filipino para sa karaniwang pormulang temporal ng Levitico.
theological_decisions:
- issue: Mga katawagang pangkalinisan
  choice: malinis / marumi sa rituwal na kahulugan
  alternative: dalisay / marungis; malinis / di-malinis
  rationale: Pinananatili ng karaniwang “malinis/marumi” ang paghaharap sa Hebreo habang ipinapaliwanag sa talababa na katayuang rituwal ang tinutukoy, hindi kinakailangang moral na paghatol.
- issue: Tinutukoy ng mga pandiwang maglalaba, maliligo, at magiging marumi
  choice: ang taong malinis na dinuraan
  alternative: ang lalaking may agas
  rationale: Ang pinakamalapit na panlalaking isahang referent ay הַטָּהוֹר, “ang malinis na tao,” at ang tuntunin ay naglalarawan sa kontaminasyong dulot ng pagdura sa kanya.
translation_notes:
  register: Modernong Filipino na may marangal at tuwirang himig pambatas. Ginamit ang “agas” para sa discharge at ipinaliwanag sa talababa ang rituwal na diwa ng “malinis/marumi.” Ang dalawang marker na [a] at [b] ay kapwa nasa pangunahing teksto.
