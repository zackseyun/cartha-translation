  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: tl
  text: '“Magsalita kayo sa mga Israelita[a] at sabihin ninyo sa kanila: Kapag ang sinumang lalaki ay may lumalabas na likido mula sa kanyang katawan[b], marumi sa ritwal ang lumalabas na likidong iyon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “mula sa kanyang laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Magsalita kayo
  rationale: Pinananatili ang maramihang pautos at ang pormal na himig ng tagubiling ibinigay kina Moises at Aaron.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na makabagong Tagalog para sa sambayanang tinutukoy; inilagay sa talababa ang literal na anyo.
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: at sabihin ninyo sa kanila
  rationale: Tapat sa kasunod na maramihang pautos at sa pormal na hulma ng legal na pahayag.
- source_word: אִישׁ אִישׁ
  choice: ang sinumang lalaki
  rationale: Ipinahahayag ng pag-uulit ang pamamahaging diwa na ‘sinumang lalaki’; ang konteksto ay partikular sa kalagayan ng katawan ng lalaki.
- source_word: כִּי יִהְיֶה
  choice: Kapag ... ay may
  rationale: Ang כִּי ay nagpapakilala rito ng karaniwang kasong saklaw ng batas, kaya mas angkop ang ‘kapag’ kaysa sa kondisyunal na ‘kung.’
- source_word: זָב מִבְּשָׂרוֹ
  choice: may lumalabas na likido mula sa kanyang katawan
  rationale: Natural na inilalarawan sa Tagalog ang isang discharge nang hindi nililimitahan ang teksto sa isang tiyak na medikal na diagnosis; ang literal na ‘laman’ ay nasa talababa.
- source_word: זוֹבוֹ
  choice: ang lumalabas na likidong iyon
  rationale: Pinananatili ang ugnayan sa pandiwaring זָב at nililinaw na ang discharge ang agarang paksa ng hatol.
- source_word: טָמֵא הוּא
  choice: marumi
  rationale: Karaniwang terminong Tagalog sa batas ng rituwal na kalinisan; hindi nito ipinapahiwatig na likas na kasalanang moral ang kondisyon.
theological_decisions:
- issue: Pagpapahayag ng rituwal na karumihan
  choice: marumi
  alternative: di-malinis / rituwal na marumi
  rationale: Ang טָמֵא ay tumutukoy sa katayuang rituwal sa Levitico, hindi kinakailangang sa moral na kasalanan. Ang ‘marumi’ ang pinakanatural at kinikilalang salin sa kontekstong ito.
- issue: Tinutukoy ng טָמֵא הוּא
  choice: marumi ang lumalabas na likidong iyon
  alternative: marumi ang lalaki
  rationale: Ang pinakamalapit na pangngalan ay זוֹבוֹ, ‘kanyang discharge,’ kaya iyon ang tahasang tinukoy sa salin, habang ang mga sumusunod na talata ang naglalahad ng epekto nito sa rituwal na katayuan ng lalaki.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘likidong lumalabas’ upang maging nauunawaan nang hindi gumagamit ng sobrang teknikal o kolokyal na katawagan. Parehong lumilitaw sa pangunahing teksto ang mga panandang [a] at [b].
