base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: tl
  text: Ang bawat kasuutan at bawat balat[a] na nalagyan ng semilya[b] ay lalabhan sa tubig at magiging marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “balat” ay malamang na tumutukoy sa isang bagay na yari sa balat ng hayop; maaari ring isaling “katad.”
    reason: lexical_alternative
  - marker: b
    text: O, “na may inilabas na semilya rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: kasuutan
  rationale: Malawak na katawagan ito sa isang piraso ng damit; likas at marangal sa makabagong Tagalog ang “kasuutan.”
- source_word: עוֹר
  choice: balat
  rationale: Tuwirang katumbas ito ng salitang Hebreo at pinananatili ang konkretong larawan; ipinapaliwanag sa talababa na malamang na bagay na yari sa balat ng hayop ang tinutukoy.
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: na may … dito
  rationale: Likas na ipinahahayag sa Tagalog ang lokatibong diwa na may bagay na nasa ibabaw o nakalagay sa kasuutan o balat.
- source_word: שִׁכְבַת זָרַע
  choice: semilyang lumabas
  rationale: Malinaw nitong tinutukoy ang inilabas na semilya, hindi ang “binhi” sa pangkalahatang diwa, at nauunawaan ng karaniwang modernong mambabasa.
- source_word: וְכֻבַּס
  choice: ay lalabhan
  rationale: Ang anyong balintiyak at legal na tagubilin ay natural na naihahayag ng hinaharap na pandiwang “lalabhan.”
- source_word: בַּמַּיִם
  choice: sa tubig
  rationale: Ito ang natural na pariralang Tagalog para sa paraang ginagamit sa paghuhugas o paglalaba.
- source_word: וְטָמֵא
  choice: at magiging marumi
  rationale: Pinananatili nito ang kategorya ng rituwal na karumihan nang hindi ipinahihiwatig na may moral na kasalanan.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Maikli, tumpak, at natural na katumbas ng hangganang panahong ipinahayag sa Hebreo.
theological_decisions:
- issue: Kalikasan ng pagiging טָמֵא sa kautusan tungkol sa kalinisan
  choice: “magiging marumi” bilang kalagayang rituwal
  alternative: “madudungisan” o “magiging di-malinis”
  rationale: Sa Levitico 15, rituwal na kalagayan ang tinutukoy at hindi kinakailangang moral na pagkakasala. Ang “marumi” ang pinakapamilyar na salitang biblikal sa Tagalog, habang iniiwasan ng konteksto at paliwanag ang pagdaragdag ng moral na hatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang anyo ng legal na tagubilin at ang teknikal na diwa ng rituwal na karumihan nang hindi ginagawang sobrang klinikal o nagdaragdag ng moral na pagpapakahulugan.
