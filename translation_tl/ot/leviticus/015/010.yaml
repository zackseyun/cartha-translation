  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: tl
  text: Ang sinumang humipo sa anumang bagay na nasa ilalim niya ay magiging marumi hanggang sa gabi[a]. Ang sinumang magdala ng mga bagay na iyon[b] ay maglalaba ng kanyang mga damit, maliligo sa tubig, at magiging marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “na dating nasa ilalim niya.” Hindi tahasang tinutukoy ng Hebreo kung kasalukuyan o nakaraan ang pagkakailalim ng bagay sa kanya.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mga bagay na iyon” ay tumutugon sa maramihang panghalip sa Hebreo at sama-samang tumutukoy sa mga bagay na nauugnay sa anumang nasa ilalim niya.
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: ang sinumang humipo
  rationale: Ang pandiwaring Hebreo ay tumutukoy sa pisikal na paghipo; natural sa makabagong Tagalog ang pangkalahatang pormulang pambatas na “ang sinumang humipo.”
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: sa anumang bagay na nasa ilalim niya
  rationale: Pinananatili ng “nasa ilalim niya” ang aspektong di-tiyak ng Hebreo at ang tunay na posibilidad ng kasalukuyan o pangkalahatang pagtukoy, sa halip na piliting gawing nakaraan.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Sa konteksto ng mga tuntunin sa ritwal na kalinisan, malinaw na ipinapahayag ng hinaharap na anyo ang kalagayang idudulot ng paghipo nang hindi ipinahihiwatig ang karaniwang dumi lamang.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Ito ang natural at tapat na katumbas ng hangganan ng panahong itinakda sa Hebreo.
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: ang sinumang magbuhat ng mga iyon
  rationale: Ang נשׂא ay nangangahulugang magbuhat o magdala. Pinili ang “magbuhat” upang maipakita ang mas tuwirang paghawak sa mga bagay, habang ang “mga iyon” ay sumusunod sa maramihang panghalip ng Hebreo.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay maglalaba ng kanyang mga damit
  rationale: Ang “maglalaba ng kanyang mga damit” ay natural sa modernong Tagalog at malinaw na tumutukoy sa paglilinis ng kasuotan.
- source_word: וְרָחַץ בַּמַּיִם
  choice: maliligo sa tubig
  rationale: Sa pormula ng paglilinis, tumutukoy ang רחץ sa paghuhugas ng katawan; ang “maliligo sa tubig” ang malinaw at karaniwang salin.
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: at magiging marumi hanggang sa gabi
  rationale: Pinananatili nito ang hiwalay na pahayag na nananatili ang ritwal na karumihan hanggang gabi kahit matapos ang paglalaba at paliligo.
theological_decisions:
- issue: Kahulugan ng “marumi”
  choice: Panatilihin ang terminong “marumi” sa konteksto ng ritwal na kalinisan.
  alternative: “Hindi malinis ayon sa ritwal”
  rationale: Ang maikling terminong “marumi” ay tradisyonal, natural, at sapat sa agarang konteksto; hindi dapat dagdagan ang talata ng paliwanag na wala sa Hebreo o ipakahulugang kasalanang moral ang kalagayan.
- issue: Panahon ng אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: “na nasa ilalim niya”
  alternative: “na dating nasa ilalim niya”
  rationale: Hindi tahasang minamarkahan ng Hebreo ang nakaraang panahon. Ang kasalukuyan o pangkalahatang anyo ay nagpapanatili sa gramatikal na kalabuan, samantalang mauunawaan sa konteksto na maaaring dati nang nasa ilalim ng taong may agas ang bagay.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong pambatas. Ginamit ang “ang sinumang” para sa pangkalahatang tuntunin, at pinanatili ang “marumi” bilang teknikal na salita sa konteksto ng ritwal na kalinisan.
