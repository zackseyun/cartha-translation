  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: tl
  text: Ngunit kung tumigil na ang paglabas ng likido mula sa kanyang katawan[a], bibilang siya ng pitong araw para sa kanyang sarili, at pagkatapos nito ay magiging malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “kung naging malinis na siya mula sa paglabas ng likido mula sa kanyang katawan … pagkatapos nito ay magiging malinis siya.” Iisang salitang-ugat sa Hebreo ang ginamit sa dalawang sugnay: una, para sa pag-alis mula sa kalagayan ng paglabas, at pagkatapos, para sa resultang ritwal na katayuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong may kaibahan sa naunang kalagayan; natural ito sa makabagong Filipino.
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: tumigil na ang kanyang pagdurugo
  rationale: Sa kontekstong ito, ang qal na טהר kasunod ng מן ay tumutukoy sa paglaya mula sa discharge, ibig sabihin, sa pagtigil nito. Iniiwasan nitong ipahiwatig na moral na paglilinis ang tinutukoy.
- source_word: וְסָפְרָה לָּהּ
  choice: magbibilang siya para sa kanyang sarili
  rationale: Pinananatili ang legal na pagkakasunod-sunod at ang datibong לָהּ, na nagsasaad na ang bilang ay para sa sarili niyang panahon ng paglilinis.
- source_word: שִׁבְעַת יָמִים
  choice: pitong araw
  rationale: Tuwirang salin ng bilang at pangngalan sa natural na ayos ng Filipino.
- source_word: וְאַחַר
  choice: at pagkatapos
  rationale: Malinaw na inilalahad ang susunod na yugto matapos ang pitong araw.
- source_word: תִּטְהָר
  choice: magiging malinis na siya
  rationale: Ipinahahayag ang ritwal na katayuang matatamo matapos ang itinakdang pitong araw; ang 'na' ay natural na nagpapakita ng paglipat sa bagong katayuan.
theological_decisions:
- issue: Terminolohiya ng ritwal na kalinisan
  choice: Gamitin ang “malinis” para sa ritwal na katayuan, at ilarawan ang unang paggamit ng טהר bilang pagtigil ng pagdurugo.
  alternative: Gamitin ang “dalisay/nadalisay” o “nalinis” sa dalawang sugnay.
  rationale: Ang Levitico 15 ay tumatalakay sa ritwal na katayuan dahil sa paglabas ng likido sa katawan, hindi sa moral na pagkakasala. Pinananatili rin ng talababa na iisang Hebreong ugat ang ginamit sa dalawang sugnay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pagdurugo” bilang likas at madaling maunawaang termino sa konteksto ng babae, habang nililinaw sa talababa ang pag-uulit at saklaw ng Hebreong טהר.
