  text: וְ/כָל הַ/נּוֹגֵ֥עַ בָּ֖/ם יִטְמָ֑א וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: tl
  text: At ang sinumang humipo sa mga iyon[a] ay magiging marumi. Lalabhan niya ang kanyang mga damit at maliligo sa tubig, at mananatili siyang marumi hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang mga bagay na kaugnay ng kanyang karumihan na binanggit sa naunang konteksto, gaya ng anumang hinigaan o inupuan niya.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: At ang sinumang humipo
  rationale: 'Ang כָּל na sinusundan ng substantival participle ay isang pangkalahatang pahayag: sinumang humipo. Natural ito sa modernong Filipino at pinananatili ang saklaw ng Hebreo.'
- source_word: בָּם
  choice: sa mga iyon
  rationale: Ang panlalaking pangmaramihang panghalip ay tumutukoy sa mga bagay na binanggit sa naunang konteksto. Hindi tahasang pinangalanan sa pangunahing teksto upang hindi lampasan ang pagkatiyak ng orihinal.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Sa konteksto ng Levitico, ang טמא ay tumutukoy sa kalagayang ritwal na karumihan. Ang 'magiging marumi' ay malinaw na nagpapahayag ng kalagayang dulot ng paghipo, nang hindi ipinahihiwatig na kasalanang moral ito.
- source_word: וְ/כִבֶּס בְּגָדָיו
  choice: Lalabhan niya ang kanyang mga damit
  rationale: Ang כבס ay karaniwang tumutukoy sa paglalaba ng kasuotan. Ang 'mga damit' ay natural at madaling maunawaan sa kasalukuyang Filipino.
- source_word: וְ/רָחַץ בַּמַּיִם
  choice: at maliligo sa tubig
  rationale: Sa ritwal na kontekstong ito, ang רחץ ay tumutukoy sa paghuhugas ng katawan. Mas malinaw ang 'maliligo sa tubig' kaysa sa pangkalahatang 'maghuhugas.'
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: at mananatili siyang marumi hanggang gabi
  rationale: Ipinahahayag ng parirala ang pagpapatuloy ng ritwal na karumihan hanggang sa takdang oras. Ang 'hanggang gabi' ay natural na katumbas sa Filipino.
theological_decisions:
- issue: Kalikasan ng karumihan sa batas ng Levitico
  choice: Gamitin ang 'marumi' bilang katawagang ritwal, hindi bilang awtomatikong paghatol sa moralidad.
  alternative: nadungisan
  rationale: Ang konteksto ay tungkol sa mga tuntunin ng ritwal na kalinisan. Iniiwasan ng saling ito ang pagpapahiwatig na ang paghipo mismo ay isang kasalanang moral.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang hindi tiyak na tinutukoy ng panghalip sa pangunahing teksto at ipinaliwanag lamang ito sa talababa.
