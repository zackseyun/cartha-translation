  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: tl
  text: Pagkatapos, ihahandog ng pari ang isa bilang handog para sa kasalanan[a] at ang isa naman bilang handog na sinusunog, at magbabayad-sala siya para sa babae sa harapan ni Yahweh dahil sa kanyang maruming pag-agas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Sa kontekstong ito, maaaring idiin ng salitang Hebreo na חַטָּאת (khatta't) ang tungkulin ng handog sa rituwal na paglilinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: ihahandog
  rationale: Bagaman karaniwang nangangahulugang “gawin” ang pandiwa, ang sakripisyal na konteksto at ang mga tuwirang layon nito ay likas na isinasalin sa Filipino bilang “ihahandog.”
- source_word: הָאֶחָד חַטָּאת
  choice: ang isa bilang handog para sa kasalanan
  rationale: Tumutukoy ang חַטָּאת sa isang tiyak na uri ng handog. Pinananatili ng saling ito ang nakaugaliang katawagan, habang inilalahad sa talababa ang posibleng diin nito sa rituwal na paglilinis.
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: at ang isa naman bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubos na sinusunog. Ipinahihiwatig ng “isa naman” ang paghahati sa dalawang ibon nang natural sa Filipino.
- source_word: וְכִפֶּר עָלֶיהָ
  choice: magbabayad-sala ang pari para sa babae
  rationale: Pinananatili ng “magbabayad-sala” ang rituwal at teolohikal na diwa ng כפר, at malinaw na ipinapakita ng “para sa babae” kung sino ang tumatanggap ng kapakinabangan ng ritwal.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tapat itong kumakatawan sa pormulang pangkulto na “sa harap ng” at pinananatili ang pangalang tipan na Yahweh.
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: dahil sa kanyang maruming pag-agas
  rationale: Ang זוֹב ay pag-agas o discharge ng katawan, at inilalarawan ito ng טֻמְאָה bilang marumi sa rituwal na kahulugan. Ang “dahil sa” ay natural na nagpapahayag ng sanhi o kalagayang tinutugunan ng pagbabayad-sala.
theological_decisions:
- issue: Pagsasalin ng יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa Hebreo; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Pagsasalin ng חַטָּאת sa batas tungkol sa mga handog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring bigyang-diin ng termino ang paglilinis sa rituwal na konteksto, ngunit tumutukoy rin ito sa kinikilalang uri ng handog. Ginamit sa teksto ang mas pamilyar na katawagan at pinanatili sa talababa ang lehitimong alternatibo.
- issue: Kalikasan ng karumihan sa talata
  choice: maruming pag-agas
  alternative: pag-agas ng kanyang karumihan
  rationale: Ang “marumi” dito ay tumutukoy sa rituwal na kalagayan sa konteksto ng Levitico, hindi kinakailangang sa personal na kasalanang moral. Iniiwasan ng salin na ipantay nang tahasan ang pag-agas sa moral na pagkakasala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pag-agas” bilang madaling maunawaang katawagan sa bodily discharge, at ang “magbabayad-sala” upang mapanatili ang natatanging wikang pangritwal nang hindi ipinapakahulugang moral na kasalanan ang pisikal na kalagayan.
