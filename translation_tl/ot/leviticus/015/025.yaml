  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: tl
  text: Kung ang isang babae ay may pag-agos ng dugo nang maraming araw, hindi sa panahon ng kanyang karumihan dahil sa regla,[a] o kung may pag-agos siya lampas sa panahon ng kanyang karumihan dahil sa regla,[b] sa lahat ng araw ng pag-agos na nagdudulot sa kanya ng karumihan, mananatili siyang marumi, gaya ng mga araw ng kanyang karumihan dahil sa regla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa labas ng panahon ng kanyang regla.” Saklaw ng salitang Hebreo ang ritwal na karumihang kaugnay ng regla, hindi lamang ang mismong pagdurugo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “o kung may pag-agos siya bukod pa sa kanyang karumihan dahil sa regla,” samakatuwid, pag-agos na umaabot lampas sa karaniwang panahon ng regla.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: may pag-agos / magpatuloy ang pag-agos
  rationale: Ang pandiwa at pangngalang mula sa זוּב ay tumutukoy sa pag-agos o paglabas ng likido sa katawan. Likas sa Filipino ang “pag-agos” para sa dugo; sa ikalawang sugnay, nililinaw ng “magpatuloy ... lampas” ang pagpapatuloy na ipinahihiwatig ng עַל sa konteksto.
- source_word: דָּמָהּ
  choice: ng dugo
  rationale: Bagaman literal na “ng kanyang dugo,” sapat at mas natural sa Filipino ang “pag-agos ng dugo,” yamang malinaw nang sa babae nagmumula ang pag-agos.
- source_word: יָמִים רַבִּים
  choice: nang maraming araw
  rationale: Tuwirang pinananatili ang tagal na ipinahahayag ng Hebreo.
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: hindi sa panahon ng kanyang karumihan dahil sa regla
  rationale: Pinananatili ng “panahon” ang עֵת, at ipinakikita ng “karumihan dahil sa regla” na ang נִדָּה rito ay hindi lamang ang biyolohikal na regla kundi ang kaugnay na kalagayang ritwal.
- source_word: נִדָּה
  choice: karumihan dahil sa regla
  rationale: Malinaw sa ordinaryong mambabasa at pinananatili ang ritwal na diwa ng terminong Levitico nang hindi nagpapahiwatig ng moral na kasalanan.
- source_word: עַל נִדָּתָהּ
  choice: lampas sa panahon ng kanyang karumihan dahil sa regla
  rationale: Sa kontekstong ito, ang עַל ay maaaring magpahiwatig ng pagdaragdag o pagpapatuloy lampas sa karaniwang panahon; inilalahad sa talababa ang tunay na alternatibo.
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: sa lahat ng araw na may maruming pag-agos siya
  rationale: Ipinahahayag nito kapwa ang tagal ng pag-agos at ang ritwal na karumihang kaugnay nito sa natural na Filipino.
- source_word: טְמֵאָה
  choice: marumi
  rationale: Karaniwang salin ito ng kategoryang ritwal sa Levitico; sa konteksto, hindi ito hatol na moral.
- source_word: כִּימֵי נִדָּתָהּ
  choice: gaya ng mga araw ng kanyang karumihan dahil sa regla
  rationale: Pinananatili ang paghahambing at ang pare-parehong pagsasalin ng נִדָּה.
theological_decisions:
- issue: Paglalahad ng ritwal na karumihan nang hindi ipinahihiwatig ang moral na pagkakasala
  choice: Gamitin ang “marumi” at “karumihan dahil sa regla” bilang mga katawagang tumutukoy sa ritwal na kalagayan.
  alternative: Gamitin lamang ang “regla” o “panahon ng regla,” o gamitin ang mas teknikal na “ritwal na di-malinis.”
  rationale: Ang talata ay nagtatakda ng kalagayan sa sistemang ritwal ng Levitico, hindi nagsasabing nagkasala ang babae. Pinananatili ng napiling wika ang kategoryang iyon habang nananatiling malinaw at dignificado.
- issue: Kahulugan ng עַל sa ikalawang kondisyon
  choice: Unawain bilang pagpapatuloy lampas sa panahon ng karumihan dahil sa regla.
  alternative: Unawain bilang pag-agos na karagdagan sa karumihan dahil sa regla.
  rationale: Kapwa posible ang paglawak at pagdaragdag; ang pangunahing teksto ay gumagamit ng natural na pagbasa sa konteksto, at inilalagay sa talababa ang alternatibo upang hindi alisin ang leksikal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at dignificadong Filipino. Ginamit ang “regla” bilang karaniwang salitang nauunawaan, habang ang pariralang “karumihan dahil sa regla” ay nagpapanatili sa ritwal na kahulugan ng batas. Ang “marumi” ay dapat unawain bilang ritwal na katayuan, hindi moral na dungis.
