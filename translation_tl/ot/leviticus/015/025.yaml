  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: pag-agos ng dugo sa labas ng panahon ng niddah, o pag-agos na lampas/karagdagan sa niddah, at ritwal na karumihan sa tagal nito. Gayunman, ang “magpatuloy ang pag-agos” ay nagdaragdag ng aspektong pagpapatuloy na hindi tahasang nasa תָזוּב; mas tapat ang “may pag-agos siya ... lampas.” Ang pangwakas na “may maruming pag-agos siya” ay hindi likas at malabo ang ugnayan ng pag-agos at karumihan.'
