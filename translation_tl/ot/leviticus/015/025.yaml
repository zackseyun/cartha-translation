  terminology: Ang “karumihan dahil sa regla” at “marumi” ay angkop para sa niddah at tameʾ, basta malinaw na ritwal ang tinutukoy. Pinananatili ng talababa ang mahalagang alternatibong pagbasa ng עַל bilang “bukod pa sa/in addition to.”
