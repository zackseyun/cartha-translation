  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: tl
  text: 'Ihahandog ng pari ang mga iyon: ang isa bilang handog para sa kasalanan[a], at ang isa bilang handog na sinusunog. At magsasagawa ang pari ng pagtubos para sa kanya sa harap ni Yahweh dahil sa kanyang agas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang salitang Hebreo na חַטָּאת ay maaaring tumukoy sa handog na ginagamit upang alisin ang ritwal na karumihan, hindi lamang sa handog para sa moral na kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: Ihahandog ... ang mga iyon
  rationale: Sa konteksto ng paghahain, ang עשה ay tumutukoy sa ritwal na paghahandog, at ang panghalip na maramihan ay tumutukoy sa dalawang ibon sa naunang talata.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na salin ng כהן sa mga tuntuning panghandog.
- source_word: אֶחָד חַטָּאת
  choice: ang isa bilang handog para sa kasalanan
  rationale: Pinananatili ang tradisyonal at madaling makilalang katawagan, habang inilalagay sa talababa ang mas teknikal na diwang ritwal na 'handog para sa paglilinis.'
- source_word: וְהָאֶחָד עֹלָה
  choice: at ang isa naman bilang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog; ang 'isa naman' ay likas na Filipino para sa paghahambing ng dalawang handog.
- source_word: וְכִפֶּר עָלָיו
  choice: gagawa ... ng pagtubos para sa kanya
  rationale: Pinananatili ng 'pagtubos' ang malawak na puwersang ritwal at teolohikal ng כפר nang hindi itinatakda ang isang partikular na paliwanag sa paraan ng bisa nito.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na salin ng pariralang tumutukoy sa pagkilos sa presensya ni Yahweh; ginagamit ang pangalang Yahweh ayon sa patakaran ng proyekto.
- source_word: מִזּוֹבוֹ
  choice: dahil sa kanyang agas
  rationale: Dito, ipinahihiwatig ng מן ang kalagayang naging dahilan ng kinakailangang ritwal na pagtubos. Ang 'agas' ay maikli at angkop sa patuloy na paglabas ng likido sa konteksto.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng ritwal na karumihan
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tukuyin ng חַטָּאת sa Levitico ang handog na nag-aalis ng ritwal na karumihan, hindi lamang ang tugon sa moral na kasalanan. Pinananatili sa pangunahing teksto ang pamilyar na katawagan at inilalahad sa talababa ang teknikal na alternatibo.
- issue: Pagsasalin ng כפר
  choice: gumawa ng pagtubos
  alternative: maglinis ritwal / gumawa ng pambayad-sala
  rationale: Ang 'gumawa ng pagtubos' ay nagpapanatili sa saklaw at teolohikal na tensiyon ng terminong panghandog nang hindi ito ikinukulong sa iisang teorya o mekanismo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'agas' bilang maikli at kontekstuwal na tawag sa abnormal na paglabas ng likido, at pinanatili ang bokabularyong panghandog nang hindi nag-aangkat ng denominasyonal na paliwanag.
