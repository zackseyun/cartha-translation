  source_fidelity: 'Tumpak na naipapahayag ang pagkakasunod-sunod ng tagubilin: ang ikawalong araw, pagkuha para sa sarili, dalawang batu-bato bilang isang opsyon o dalawang batang kalapati bilang kabila, at pagdadala ng mga ito sa pari sa pasukan ng Toldang Tipanan. Ang “batu-bato” at “batang kalapati” ay pinananatiling magkahiwalay na uri/handog gaya ng Hebreo.'
  naturalness: Malinaw at natural ang makabagong Tagalog na legal-rituwal na rehistro. Ang pag-uulit ng “niya” at “ang mga iyon” ay katanggap-tanggap para sa kalinawan. Ang kuwit sa “sa pari, sa pasukan ...” ay naiintindihan bilang pagtukoy sa kinaroroonan ng pari.
