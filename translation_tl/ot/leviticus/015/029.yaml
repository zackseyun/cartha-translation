translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, dignified, at angkop sa tekstong legal-rituwal. Pinanatili ang benefactive na “para sa sarili niya” at ang pagkakaiba ng batu-bato at batang kalapati. Walang footnote dahil ang footnote sa English consultation layer ay tila hindi tugma ang marker sa nilalaman; ang sintaks ng Hebreo ay malinaw na naipahayag sa pangunahing teksto.
