base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/029.yaml
  text: And on the eighth day she shall take for herself two turtledoves or two young pigeons[a], and bring them to the priest at the entrance of the tent of meeting.
translation:
  language: tl
  text: At sa ikawalong araw, kukuha siya para sa sarili niya ng dalawang batu-bato o dalawang batang kalapati, at dadalhin niya ang mga iyon sa pari, sa pasukan ng Toldang Tipanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: At sa ikawalong araw
  rationale: Pinananatili ang pang-ugnay na ו at natural na isinasalin ang pariralang panahunan sa makabagong Tagalog.
- source_word: תִּקַּח לָהּ
  choice: kukuha siya para sa sarili niya
  rationale: Ang anyong pandiwa sa kontekstong legal ay nagpapahayag ng tagubilin; tahasang pinananatili ng “para sa sarili niya” ang benefactive/reflexive na לָהּ.
- source_word: שְׁתֵּי תֹרִים
  choice: dalawang batu-bato
  rationale: Ang “batu-bato” ay karaniwang katawagang Filipino para sa turtledove at malinaw na naiiba sa kasunod na mga batang kalapati.
- source_word: אוֹ
  choice: o
  rationale: Pinananatili ang simpleng pagpipilian sa pagitan ng dalawang pinahihintulutang handog.
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: dalawang batang kalapati
  rationale: Natural na salin ng idyomatikong pariralang Hebreo na literal na “mga anak ng kalapati,” na tumutukoy sa mga inakay o batang kalapati.
- source_word: וְהֵבִיאָה אֹתָם
  choice: at dadalhin niya ang mga iyon
  rationale: Ipinahahayag ang kasunod na tagubiling legal at inuulit ang simuno upang maging malinaw at natural sa Tagalog.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Ang tiyak na artikulo ay tumutukoy sa paring nangangasiwa; sa Tagalog, sapat at natural ang “sa pari” sa rituwal na konteksto.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Toldang Tipanan
  rationale: Ang ikalawang אֶל ay natural na naglalarawan sa kinaroroonan ng pari. Ang “pasukan” ay malinaw para sa פֶּתַח, at ang “Toldang Tipanan” ay dignified at madaling maunawaang katawagan sa אֹהֶל מוֹעֵד.
