  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: tl
  text: Kaya babalaan ninyo ang mga anak ni Israel tungkol sa kanilang karumihan, upang hindi sila mamatay sa kanilang karumihan sa pagparumi nila sa aking tabernakulo na nasa gitna nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ang mga Israelita o ang mga anak ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: babalaan ninyo
  rationale: Ang Hiphil ng זהר ay tumutukoy rito sa pagbibigay-babala upang maiwasan ang panganib na binanggit sa kasunod na sugnay.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang pormal na katawagang Hebreo sa halip na gawing mas malawak na 'mga Israelita.'
- source_word: מִטֻּמְאָתָם / בְּטֻמְאָתָם
  choice: tungkol sa kanilang karumihan / sa kanilang karumihan
  rationale: Ang 'karumihan' ay nauunawaan sa kontekstong Levitico bilang kalagayang ritwal, hindi bilang simpleng moral na kasalanan; ang mga pang-ukol ay isinalin ayon sa tungkuling babala at kalagayan.
- source_word: בְּטַמְּאָם
  choice: dahil nilalapastangan nila
  rationale: 'Ipinahahayag ng infinitive construct ang kaugnay na sanhi o pangyayari: ang kanilang pagpaparumi sa banal na tirahan. Ang ''nilalapastangan'' ay natural at nagpapakita ng paglapastangan sa kabanalan nito.'
- source_word: מִשְׁכָּנִי
  choice: aking tabernakulo
  rationale: Tumutukoy ito sa kongkretong banal na toldang tirahan ng Diyos sa Pentateuco; pinananatili ng 'tabernakulo' ang tiyak na reperenteng kultiko.
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: na nasa gitna nila
  rationale: Malapit sa Hebreo at malinaw na binibigyang-diin ang presensiya ng Diyos sa gitna ng Israel.
theological_decisions:
- issue: Kahulugan ng ritwal na karumihan
  choice: karumihan
  alternative: kawalang-kalinisan; ritwal na di-kalinisan
  rationale: Hindi ginagawang katumbas ng moral na kasalanan ang טֻמְאָה; pinananatili ang kategoryang ritwal sa Levitico.
- issue: Korporatibong katawagan sa Israel
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang tradisyonal at pormal na anyo ng בְּנֵי יִשְׂרָאֵל nang hindi nililimitahan ang aplikasyon ng utos sa mga lalaking Israelita lamang.
- issue: Ugnayan ng karumihan, kamatayan, at tabernakulo
  choice: upang hindi sila mamatay ... dahil nilalapastangan nila ang aking tabernakulo
  alternative: baka sila mamatay ... kapag pinarumi nila ang aking tabernakulo
  rationale: Pinananatili ang layuning pang-iwas ng babala at ang tunay na panganib ng pagdadala ng ritwal na karumihan sa banal na tirahan.
translation_notes:
  register: Modernong Filipino na pormal at marangal. Ginamit ang 'tabernakulo' bilang pamilyar na terminong biblikal at 'karumihan' bilang pare-parehong katawagang Levitico; iniwasang gawing tahasang moral na kasalanan ang ritwal na kalagayan.
