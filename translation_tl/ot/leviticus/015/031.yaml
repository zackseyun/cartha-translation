  source_fidelity: Ang 'babalaan ninyo,' 'mga anak ni Israel,' 'karumihan,' at 'aking tabernakulo na nasa gitna nila' ay tapat sa Hebreo at angkop sa kontekstong ritwal. Gayunman, ang 'dahil nilalapastangan nila' ay nagiging isang tahasang sanhi at nagpapahiwatig ng moral na paglapastangan. Ang בְּטַמְּאָם ay infinitive construct na mas maingat na isinasalin bilang 'sa pagparumi nila,' na pinananatili ang paraan o pangyayaring nagdudulot ng panganib at ang ritwal na saklaw.
  naturalness: Pormal ngunit natural ang rebisadong pangungusap. Ang 'sa pagparumi nila sa aking tabernakulo' ay malinaw na naghahayag ng ritwal na pagpaparumi nang hindi nagdaragdag ng moral na kahulugang wala sa teksto.
  terminology: '''Karumihan'' ay dapat panatilihin para sa טֻמְאָה. Ang ''pagparumi'' ay kapaki-pakinabang na kaugnay na termino para sa טמא at mas tumpak kaysa ''paglapastangan.'' Pinananatili ang ''tabernakulo'' bilang tiyak na kultikong reperente.'
