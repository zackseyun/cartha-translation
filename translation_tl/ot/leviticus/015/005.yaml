  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: tl
  text: At ang lalaking humipo sa higaan[a] niya ay dapat maglaba ng kanyang mga damit at maligo sa tubig. Magiging marumi[b] siya hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lugar na hinihigaan niya.” Ang salitang Hebreo ay maaari ring tumukoy nang mas malawak sa lugar na pinaghihigaan niya, hindi lamang sa isang kama.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, itinuturing siyang marumi ayon sa mga tuntunin tungkol sa ritwal na kadalisayan.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: Ang lalaking
  rationale: Pinananatili ang panlalaking isahan ng אִישׁ at likas na iniuugnay rito sa Tagalog ang sugnay na pinangungunahan ng אֲשֶׁר.
- source_word: יִגַּע
  choice: humipo
  rationale: Tuwirang ipinapahayag ang pisikal na paghipo o pagdikit na tinutukoy ng נגע sa konteksto ng ritwal na karumihan.
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: sa higaan niya
  rationale: Ang מִשְׁכָּב ay lugar na hinihigaan at maaaring tumukoy sa higaan o kama; natural at sapat na malawak ang 'higaan' sa modernong Tagalog.
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: dapat maglaba ng kanyang mga damit
  rationale: Ang כִּבֵּס ay partikular na paghuhugas ng kasuotan. Ipinahahayag ng 'dapat' ang legal na obligasyon nang mas natural kaysa sa tahasang panghinaharap lamang.
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: at maligo sa tubig
  rationale: Sa kontekstong ito, ang רחץ ay paghuhugas ng katawan; malinaw at likas ang 'maligo sa tubig,' habang pinananatili ang gamit ng preposisyon sa Hebreo.
- source_word: וְ/טָמֵא
  choice: Magiging marumi
  rationale: Pinananatili ang pangunahing katawagan para sa kalagayang טָמֵא, na nililinaw sa talababa bilang ritwal at hindi moral na karumihan.
- source_word: עַד הָ/עָרֶב
  choice: hanggang sa gabi
  rationale: Likas na Tagalog na pagpapahayag ng takdang tagal ng kalagayan hanggang gabi.
theological_decisions:
- issue: Kalikasan ng pagiging 'marumi' sa mga tuntunin ng Levitico
  choice: marumi, na may talababa na ritwal ang kahulugan
  alternative: ritwal na marumi sa mismong teksto
  rationale: Pinananatili sa pangunahing teksto ang payak na kategorya ng Hebreong טָמֵא at iniiwasang ipakahulugan itong moral na kasalanan; ang talababa ang nagbibigay ng kinakailangang kontekstong pangkultura.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'dapat' upang natural na maipahayag ang bisa ng kautusan, at 'higaan' upang mapanatili ang lawak ng Hebreong termino.
