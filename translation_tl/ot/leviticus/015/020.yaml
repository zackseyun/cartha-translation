  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: tl
  text: At bawat bagay na kanyang hihigaan habang siya ay nasa karumihang dulot ng regla[a] ay magiging marumi; at bawat bagay na kanyang uupuan ay magiging marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “habang siya ay nireregla.” Saklaw ng salitang Hebreo ang regla at ang kaugnay nitong kalagayang ritwal na marumi, hindi lamang ang pisikal na siklo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: kalagayang marumi dahil sa pagreregla
  rationale: Ipinahahayag nito kapwa ang pagreregla at ang kaugnay na kalagayang ritwal na marumi sa batas ng Levitico, nang hindi nagpapahiwatig ng moral na kasalanan.
- source_word: תִּשְׁכַּב עָלָיו
  choice: higaan niya
  rationale: Sa kontekstong ito, tumutukoy ang parirala sa anumang bagay na hinihigaan niya. Ang nominal na anyong “higaan niya” ay natural at malinaw sa modernong Tagalog.
- source_word: תֵּשֵׁב עָלָיו
  choice: upuan niya
  rationale: Tumutukoy ito sa anumang bagay na inuupuan niya. Pinananatili ng “upuan niya” ang paralelismo sa “higaan niya” at malinaw ang kahulugan sa konteksto.
- source_word: יִטְמָא
  choice: ay magiging marumi
  rationale: Ipinakikita ng “magiging marumi” ang kalagayang ritwal na idinudulot ng pagdikit, habang iniiwasang ipakahulugan ito bilang moral na karumihan.
- source_word: וְכֹל אֲשֶׁר
  choice: at lahat ng
  rationale: Pinananatili nito ang saklaw na komprehensibo ng Hebreo at umaangkop nang natural sa mga pariralang “higaan niya” at “upuan niya.”
theological_decisions:
- issue: Kalikasan ng karumihan sa mga batas ng Levitico
  choice: Gamitin ang “marumi” bilang terminong ritwal at linawin sa talababa na hindi ito moral na pagkakasala
  alternative: Gumamit ng pananalitang maaaring magpahiwatig na makasalanan o marumi sa moral ang pagreregla
  rationale: Ang talata ay tungkol sa ritwal na kalagayan sa sistemang pangkalinisan ng Israel, hindi sa moral na pagkakasala. Pinananatili ng salin ang kategoryang ito nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “higaan” at “upuan” bilang natural na paglalahat sa mga bagay na hinihigaan at inuupuan. Ang “marumi” ay inuunawa rito sa kontekstong ritwal, hindi moral.
