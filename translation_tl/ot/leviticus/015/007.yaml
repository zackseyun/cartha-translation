  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: tl
  text: Ang sinumang humipo sa laman ng lalaking may paglabas ng likido sa katawan[a] ay dapat maglaba ng kanyang mga damit at maligo sa tubig. Mananatili siyang marumi hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa katawan ng lalaking may paglabas ng likido sa katawan.” Literal sa Hebreo, “sa laman ng may paglabas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: Ang sinumang humipo
  rationale: Ang may artikulong participle ay ginagamit bilang pangkalahatang katawagan sa sinumang gagawa ng kilos; natural sa makabagong Tagalog ang “ang sinumang humipo” at napapanatili nito ang legal na saklaw.
- source_word: בִּבְשַׂר
  choice: sa laman ng
  rationale: Ang בָּשָׂר ay literal na “laman,” bagaman maaari rin itong tumukoy sa pisikal na katawan. Pinanatili sa teksto ang mas malapit na anyo at inilagay sa talababa ang mas natural na alternatibo.
- source_word: הַזָּב
  choice: lalaking may tumutulong likido mula sa katawan
  rationale: Sa kontekstong ito, ang panlalaking pang-isahang participle ay tumutukoy sa lalaking nakararanas ng di-karaniwang paglabas ng likido sa katawan. Malinaw at hindi teknikal ang salin.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: dapat maglaba ng kanyang mga damit
  rationale: Ang כִּבֵּס ay karaniwang tumutukoy sa paglalaba ng kasuotan. Ipinahahayag ng “dapat” ang preskriptibong lakas ng batas sa natural na Tagalog.
- source_word: וְרָחַץ בַּמַּיִם
  choice: at maligo sa tubig
  rationale: Ang רָחַץ dito ay paghuhugas ng katawan; “maligo sa tubig” ang maikli at likas na katumbas sa Tagalog.
- source_word: וְטָמֵא
  choice: Mananatili siyang marumi
  rationale: Ang טָמֵא ay tumutukoy sa ritwal na karumihan, hindi sa moral na kasalanan. Ipinakikita ng “mananatili” ang kalagayang magpapatuloy hanggang sa takdang oras.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tumpak at natural nitong ipinahahayag ang hangganan ng panahon ng ritwal na karumihan.
theological_decisions:
- issue: Kalikasan ng karumihang tinutukoy
  choice: Gamitin ang “marumi” bilang katawagan sa ritwal na kalagayan.
  alternative: “nadungisan” o “ritwal na marumi”
  rationale: Sa Levitico 15, ang טָמֵא ay katayuan sa sistemang pangkalinisan ng Israel at hindi awtomatikong pahayag ng moral na pagkakasala. Ang “marumi” ang maikli at nakaugaliang salin; hindi na idinagdag sa pangunahing teksto ang “ritwal” na wala naman sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong legal. Ginamit ang “dapat” para sa utos at iniwasan ang teknikal o denominasyonal na pagpapakahulugan. Ang marker na [a] ay nasa pangunahing teksto.
