    rationale: Ang Hebreo ay literal na “laman ng isang may discharge/pag-agos”; ang “tumutulo” ay mas makitid at maaaring magbigay ng maling larawan. Dapat iayon ang talababa sa pangunahing salin at sa literal na anyo.
