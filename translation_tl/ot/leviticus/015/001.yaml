base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/001.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh[a] kay Moises at kay Aaron:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon, isinasaling “ANG PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, nagsalita” at naipakikita nito ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kay Moises at kay Aaron
  rationale: Ang “kay” ang likas na panandang Tagalog para sa kinakausap na taong may pangalang pantangi. Inuulit ito upang katawanin ang inulit na אֶל sa Hebreo.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Ipinahihiwatig ng pormulang ito na susunod ang tuwirang pahayag; pinananatili ng “na sinasabi” ang anyo at tungkulin nito nang hindi ito ginagawang hiwalay na pandiwa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON / Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay mas malapit na transliterasyon at pinananatili ang katangian nito bilang personal na pangalan, habang ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang pormal na pambungad sa pagsasalita at ang tahasang pagtukoy kina Moises at Aaron.
