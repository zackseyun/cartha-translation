  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: tl
  text: Kung makipagtalik ang isang lalaki sa isang babae at maglabas siya ng semilya[a], kapuwa sila maliligo sa tubig at magiging marumi[b] hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “paglabas ng binhi.” Tiyak na tumutukoy ang pariralang Hebreo sa paglabas ng semilya.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, marumi ayon sa ritwal hanggang gabi.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: Kung ... ang isang babae
  rationale: Ipinahahayag ng “kung” ang kondisyong diwa ng legal na pahayag, habang nananatiling malinaw na ang babae ang unang tinutukoy sa Hebreo.
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: sipingan ng isang lalaki ang isang babae
  rationale: Ang “sipingan” ay likas at marangal na idyomang Filipino para sa pakikipagtalik at malapit sa literal na larawang “humiga kasama” sa Hebreo.
- source_word: שִׁכְבַת זָרַע
  choice: labasan siya ng semilya
  rationale: Tiyak na tumutukoy ang parirala sa paglabas ng semilya. Ang ayos na ito ay natural sa modernong Filipino at malinaw na ang lalaki ang nilalabasan.
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: pareho silang maliligo sa tubig
  rationale: Ipinakikita ng pangmaramihang pandiwa na kapuwa sila dapat maghugas. Ang “maliligo sa tubig” ay natural na katumbas ng ritwal na paghuhugas nang hindi dinaragdagan ang paraan nito.
- source_word: וְטָמְאוּ
  choice: magiging marumi
  rationale: Pinananatili ang karaniwang bokabularyo ng kalinisan sa Levitico at hindi ipinahihiwatig na nagkasala sila; nililinaw sa talababa ang ritwal na kahulugan.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Tuwirang ipinapahayag ang takdang panahon sa Hebreo nang hindi ito mas pinakakahulugang “paglubog ng araw.”
theological_decisions:
- issue: Kalikasan ng pagiging marumi sa kautusan ng Levitico
  choice: magiging marumi
  alternative: magiging marumi ayon sa ritwal
  rationale: Hindi tahasang nilalagyan ng Hebreo ng salitang “ritwal” ang pang-uri. Pinananatili ito sa pangunahing teksto upang hindi ipagkamali ang pansamantalang kalagayan sa moral na pagkakasala, at ibinibigay ang konteksto sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal. Ginamit ang “sipingan” upang mapanatili ang mahinahong idyoma ng Hebreo, at “semilya” para sa kinakailangang katiyakan ng katawagan.
