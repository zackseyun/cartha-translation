  source_fidelity: Tumpak na naipapahayag ng draft ang pagkakasunod ng mga kilos, ang dalawang pagpipiliang ibon, ang pagharap kay Yahweh sa pasukan ng Tolda ng Pagtitipon, at ang pagbibigay ng mga ito sa pari. Ang 'para sa kanyang sarili' ay maingat na pinananatili ang לוֹ.
