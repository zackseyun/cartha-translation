id: LEV.15.14
reference: Leviticus 15:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: tl
  text: Sa ikawalong araw, kukuha siya para sa kanyang sarili ng dalawang kalapating batubato o dalawang inakay na kalapati. Pupunta siya sa harap ni Yahweh[a], sa pasukan ng Tolda ng Pagtitipon, at ibibigay niya ang mga ito sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, na isinasaling “Yahweh”; tradisyonal din itong isinasalin bilang “ang PANGINOON” o “Jehovah.”'
    reason: Ipinababatid ang anyong Hebreo ng banal na pangalan, ang saling ginamit sa teksto, at ang mga pangunahing tradisyonal na alternatibo.
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: Sa ikawalong araw
  rationale: Likas sa modernong Tagalog ang ganitong panimula para sa kasunod na hakbang ng ritwal; hindi kailangang isalin nang tahasan ang וּ bilang “at.”
- source_word: יִקַּח לוֹ
  choice: kukuha siya para sa sarili niya
  rationale: Ipinahahayag ng panghinaharap ang utos sa legal na konteksto, at pinananatili ng “para sa sarili niya” ang לוֹ.
- source_word: שְׁתֵּי תֹרִים
  choice: dalawang batubato
  rationale: Ang תֹרִים ay mga turtledove; “batubato” ang tiyak at karaniwang katawagang Filipino sa ibong ito.
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: o dalawang inakay na kalapati
  rationale: Ang idyomang literal na “mga anak ng kalapati” ay tumutukoy sa mga batang kalapati; natural at tiyak ang “inakay na kalapati.”
- source_word: וּבָא לִפְנֵי יְהוָה
  choice: Lalapit siya sa harap ni Yahweh
  rationale: Sa serye ng legal na tagubilin, ang anyong pandiwa ay nagpapatuloy sa kinakailangang kilos. Pinananatili ng “sa harap” ang tuwirang diwa ng לִפְנֵי.
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng Tolda ng Pagtitipon
  rationale: Ang פֶּתַח ay pasukan, at ang אֹהֶל מוֹעֵד ay tuwirang tumutukoy sa toldang itinakda para sa pakikipagtagpo o pagtitipon.
- source_word: וּנְתָנָם אֶל הַכֹּהֵן
  choice: at ibibigay niya ang mga ito sa pari
  rationale: Malinaw na pinananatili ang tuwirang paglilipat ng dalawang ibon sa pari.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa tekstong Hebreo. Pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang bokabularyo at iniwasan ang makaluma o sobrang teknikal na pananalita. Inilagay ang talababa sa “Yahweh,” ang mismong salitang tinatalakay nito.
