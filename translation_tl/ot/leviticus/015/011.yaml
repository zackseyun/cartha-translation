base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: tl
  text: Ang sinumang hipuin ng lalaking may agas[a], nang hindi pa nahugasan ng lalaking iyon sa tubig ang kaniyang mga kamay, ay dapat maglaba ng kaniyang mga damit, maligo sa tubig, at magiging marumi ayon sa ritwal hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Ang sinumang hipuin ng lalaking may agas, kung hindi pa nahugasan ng lalaking iyon sa tubig ang kaniyang mga kamay.” Maaaring basahin ang sugnay sa Hebreo bilang kondisyon kung kailan nagiging marumi ang taong nahipo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: lalaking may agas
  rationale: Ang anyong Hebreo ay tumutukoy sa isang lalaking nakararanas ng pag-agas ng likido mula sa katawan. Maikli at likas sa konteksto ng mga tuntunin sa Levitico ang “lalaking may agas,” nang hindi dinaragdagan ang teksto ng mas tiyak na paliwanag tungkol sa pinagmumulan ng likido.
- source_word: יִגַּע בּוֹ
  choice: hipuin
  rationale: Ang נגע na may ב ay nagpapahiwatig ng pisikal na pagdikit. Ang “hipuin” ang tuwiran at natural na katumbas sa Filipino.
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: nang hindi pa nito nahuhugasan sa tubig ang kaniyang mga kamay
  rationale: Ang שׁטף ay paghuhugas o pagbabanlaw. Ginamit ang “nahuhugasan” dahil mas natural ito sa kasalukuyang Filipino, samantalang ipinakikita ng “nito” na ang tinutukoy ay ang lalaking may agas. Pinananatili ng talababa ang maaaring kondisyunal na pagbasa ng sugnay.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: dapat maglaba ng kaniyang mga damit
  rationale: Karaniwang tumutukoy ang כּבס sa paglalaba ng mga kasuotan. Malinaw at pangkaraniwan sa modernong Filipino ang “maglaba ng kaniyang mga damit.”
- source_word: וְרָחַץ בַּמַּיִם
  choice: maligo sa tubig
  rationale: Sa mga batas tungkol sa kalinisan, tumutukoy ang רחץ sa paghuhugas ng katawan. Naiiba sa paglalaba at natural sa Filipino ang “maligo sa tubig.”
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: Mananatili siyang marumi hanggang gabi
  rationale: Ang טמא rito ay kalagayang ritwal, hindi hatol na moral. Karaniwang salin sa kontekstong ito ang “marumi,” at malinaw na pansamantala ang kalagayan hanggang gabi.
- source_word: כֹל אֲשֶׁר
  choice: Ang sinumang
  rationale: Distributibo at tumutukoy sa tao ang parirala. Natural at malawak ang saklaw ng “ang sinumang.”
theological_decisions:
- issue: Kahulugan ng pagiging טמא sa batas ng Levitico
  choice: marumi sa diwang ritwal o seremonyal
  alternative: nadungisan sa moral na diwa
  rationale: Ang talata ay tungkol sa ritwal na karumihan dahil sa pagdikit, na nilulunasan sa paghuhugas at lumilipas pagsapit ng gabi. Hindi nito ipinahihiwatig na nagkasala sa moral ang taong nahipo.
- issue: Ugnayan ng sugnay tungkol sa hindi paghuhugas ng mga kamay
  choice: Iugnay ito sa lalaking may agas bilang kalagayan noong paghipo, habang minamarkahan ang alternatibong pagbasa
  alternative: Basahin ito bilang tahasang kondisyong “kung hindi pa niya nahuhugasan...”
  rationale: Pinahihintulutan ng ayos ng Hebreo ang sugnay na maunawaan bilang pangyayaring kasabay o bilang kondisyon kung kailan naipapasa ang ritwal na karumihan. Hindi dapat ikubli ang bahagyang pagkakaibang ito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “dapat” upang ipahayag ang obligasyon ng batas, at hinati sa dalawang pangungusap para sa likas na daloy. Ang “marumi” ay dapat unawain bilang terminong ritwal sa konteksto, hindi bilang moral na paghatol.
