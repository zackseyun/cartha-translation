  - severity: low
    issue: Posibleng kolokyal o malabong pagbasa ng “lalaking nilalabasan ng semilya.”
    rationale: Mas malinaw na ipahayag na ang semilya ay lumalabas mula sa lalaki, gaya ng pandiwang Hebreo na “lumalabas mula sa kanya.”
