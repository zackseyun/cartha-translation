base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: tl
  text: 'Ito ang kautusan tungkol sa taong may pag-agas[a] at sa lalaking lumalabas ang semilya mula sa kanya, kaya nagiging marumi siya dahil dito:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O mas pormal: “taong may agas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: Ito ang kautusan tungkol sa
  rationale: Ipinakikilala ng parirala ang buod ng itinakdang tuntunin para sa mga kasong kasunod. Likas sa modernong Filipino ang “Ito ang kautusan tungkol sa,” at ang “kautusan” ay angkop sa legal na konteksto ng Levitico.
- source_word: הַזָּב
  choice: taong may umaagos na likido mula sa katawan
  rationale: Ang anyong participle ay tumutukoy sa taong may pag-agas ng likido sa katawan. Malinaw ito sa karaniwang mambabasa at hindi nililimitahan sa isang tiyak na medikal na diagnosis na hindi tahasang binanggit ng Hebreo.
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: at sa lalaking nilalabasan ng semilya
  rationale: Ipinahahayag nito nang natural sa Filipino ang konkretong diwa na lumalabas mula sa kaniya ang semilya. Ang “lalaki” ay naaayon sa panlalaking reperensiya at sa tahasang pagbanggit sa semilya.
- source_word: לְטָמְאָה בָהּ
  choice: kaya nagiging marumi siya dahil dito
  rationale: Pinananatili ng “kaya” ang maaaring resultang diwa ng infinitive, habang ang “dahil dito” ay tumutukoy sa paglabas ng semilya bilang sanhi ng ritwal na karumihan.
theological_decisions:
- issue: Kahulugan ng “marumi”
  choice: Pinanatili ang salitang “marumi” nang walang dagdag na paliwanag sa pangunahing teksto.
  alternative: “ritwal na marumi”
  rationale: Sa konteksto ng Levitico, ritwal o seremonyal ang kategorya, ngunit wala sa mismong talata ang salitang “ritwal.” Ang simpleng “marumi” ay nagpapanatili sa pormal na terminolohiya at hindi nagdaragdag sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Iniwasan ang arkaikong “binhi” para sa semilya at ang teknikal na katawagang medikal na maaaring magpaliit sa saklaw ng Hebreo. Pinanatili ang tutuldok dahil nagpapatuloy ang pangungusap at buod sa susunod na talata.
