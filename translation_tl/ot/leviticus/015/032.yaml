  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang buod na pormula at ang dalawang kasong saklaw nito. Gayunman, ang “taong may umaagos na likido mula sa katawan” ay masyadong malawak at maaaring tumukoy sa anumang likido ng katawan; mas malapit sa kondisyon-label ng Hebreo ang “taong may pag-agas.” Ang “nilalabasan ng semilya” ay mauunawaan, ngunit maaari itong maging kolokyal o magkaroon ng hindi sinasadyang ibang pagbasa; ang “lumalabas ang semilya mula sa kanya” ay mas malinaw na tumutugma sa konstruksyong Hebreo.
  naturalness: Moderno at malinaw ang pangungusap, ngunit ang inayos na mga parirala ay mas tuwiran at mas natural sa marangal na rehistro ng salin.
  terminology: Ang “kautusan,” “semilya,” at “marumi” ay angkop. Pinanatili ang “marumi” nang walang idinagdag na “ritwal,” sapagkat hindi ito tahasang nasa talata at hindi dapat dagdagan ang teksto.
