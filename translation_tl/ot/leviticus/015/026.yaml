  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: tl
  text: Ang bawat higaan na hihigaan niya sa lahat ng araw ng kanyang pagdurugo ay magiging para sa kanya gaya ng higaan sa panahon ng kanyang regla[a]. At ang bawat bagay na uupuan niya ay magiging marumi[b], gaya ng karumihang kaugnay ng kanyang regla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng higaan sa panahon ng karumihang kaugnay ng kanyang regla.” Ang salitang Hebreo na נִדָּה ay maaaring tumukoy sa kalagayan ng regla at sa kaugnay nitong ritwal na pagkakahiwalay.
    reason: lexical_alternative
  - marker: b
    text: Ang “bagay” ay malawak na katawagan dito para sa anumang gamit o bagay na maaari niyang upuan, hindi lamang isang sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: higaan
  rationale: Tumutukoy sa lugar o bagay na hinihigaan; natural at sapat ang lawak ng “higaan” sa modernong Filipino.
- source_word: תִּשְׁכַּב עָלָיו
  choice: hihigaan niya
  rationale: Likas na Filipino para sa pagkilos na humiga sa ibabaw ng isang bagay.
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: sa buong panahon ng kanyang pagdurugo
  rationale: Ang זוֹב sa konteksto ay pagdaloy o discharge ng dugo na lampas sa karaniwang regla; malinaw at likas ang “pagdurugo” nang hindi nagdaragdag ng teknikal na paliwanag sa teksto.
- source_word: כְּמִשְׁכַּב נִדָּתָהּ
  choice: gaya ng higaan niya kapag siya ay nireregla
  rationale: Ginagawang malinaw ang paghahambing sa higaan sa panahon ng regla habang pinananatili ang kongkretong kahulugan ng נִדָּה sa konteksto.
- source_word: יִהְיֶה לָּהּ
  choice: ay magiging gaya ng
  rationale: Sa sugnay na ito, ipinahahayag ng konstruksyon ang pagkakapantay ng ritwal na katayuan; mas natural sa Filipino ang tahasang paghahambing.
- source_word: כְּלִי
  choice: bagay
  rationale: Malawak ang saklaw ng כְּלִי at dito ay anumang bagay na maaaring upuan, hindi lamang sisidlan; iniiwasan ng “bagay” ang maling pagpapakitid.
- source_word: תֵּשֵׁב עָלָיו
  choice: uupuan niya
  rationale: Maikli at likas na paraan sa Filipino upang sabihing mauupo siya sa ibabaw nito.
- source_word: טָמֵא
  choice: marumi
  rationale: Karaniwang salin sa Levitico para sa ritwal na pagiging marumi, hindi isang pahayag ng moral na kasalanan.
- source_word: כְּטֻמְאַת נִדָּתָהּ
  choice: gaya ng karumihan niya kapag siya ay nireregla
  rationale: Pinananatili ang ugnayang leksikal ng טָמֵא at טֻמְאָה sa pamamagitan ng “marumi/karumihan” at nililinaw ang menstrual na konteksto.
theological_decisions:
- issue: Kalikasan ng טָמֵא / טֻמְאָה sa mga kautusan sa Levitico
  choice: “marumi/karumihan” bilang ritwal na katayuan
  alternative: “di-dalisay/kawalang-dalisay”
  rationale: Ang talata ay tungkol sa ritwal na katayuan sa sistema ng kalinisan ng Israel, hindi sa personal na kasalanan o moral na dungis.
- issue: Kahulugan ng נִדָּה
  choice: Ihayag bilang kalagayan kapag nireregla
  alternative: “menstrual na karumihan” o “panahon ng pagkakahiwalay”
  rationale: Sa konteksto, ang tuwirang tinutukoy ay ang regla kasama ang kaugnay nitong ritwal na kalagayan. Ang pangunahing teksto ay malinaw, habang ang mas malawak na diwa ay pinananatili sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “nireregla” sa halip na mas teknikal o eupemistikong pananalita. Pinanatili ang legal at ritwal na himig, ngunit iniwasan ang mga salitang maaaring magpahiwatig ng moral na pagkakasala.
