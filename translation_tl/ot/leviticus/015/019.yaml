base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: tl
  text: Kapag may lumalabas na dugo sa katawan ng isang babae,[a] mananatili siya sa kalagayan ng ritwal na karumihan dahil sa kanyang regla sa loob ng pitong araw.[b] Ang sinumang humipo sa kanya ay magiging marumi ayon sa ritwal hanggang kinagabihan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal sa Hebreo: “Kapag ang isang babae ay may pag-agos, at dugo ang kanyang agos sa kanyang laman/katawan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “ritwal na karumihan” rito ay isang kalagayan ayon sa mga batas ng Levitico tungkol sa ritwal na kalinisan; hindi nito kinakailangang ipahiwatig ang moral na pagkakasala.
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: may lumalabas na dugo
  rationale: Ang pandiwa ay tumutukoy sa pag-agos o paglabas mula sa katawan, at agad na tinutukoy ng talata na dugo ang lumalabas. Pinagsama ang dalawang parirala upang maging natural at malinaw sa modernong Tagalog nang hindi binabago ang kahulugan.
- source_word: בִּבְשָׂרָהּ
  choice: sa katawan ng isang babae
  rationale: Literal na maaaring ‘sa kanyang laman,’ ngunit ang בשר dito ay tumutukoy sa pisikal na katawan. Ang ‘sa katawan’ ay dignified at natural sa kasalukuyang Tagalog; inilalahad sa talababa ang mas literal na anyo.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Tuwirang katumbas na natural sa Tagalog para sa itinakdang haba ng panahon.
- source_word: בְנִדָּתָהּ
  choice: ritwal na marumi dahil sa kanyang regla
  rationale: Ipinahahayag nito ang kalagayang itinakda ng batas tungkol sa ritwal na kalinisan, habang malinaw na iniuugnay iyon sa regla at hindi sa moral na pagkakasala.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: ang sinumang humipo sa kanya
  rationale: Natural na Tagalog para sa pangkalahatang tumutukoy sa bawat taong humipo sa babae.
- source_word: יִטְמָא
  choice: magiging ritwal na marumi
  rationale: Pinananatili ang legal na resulta ng paghipo at nililinaw na ritwal, hindi moral, ang uri ng karumihang tinutukoy.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tuwirang salin ng parirala at natural na pahayag ng hangganan ng panahon sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa ritwal na karumihan nang hindi ipinahihiwatig ang moral na kasalanan
  choice: Gamitin ang ‘ritwal na marumi’ at ipaliwanag sa talababa na legal o seremonyal na kalagayan ito.
  alternative: Gamitin lamang ang ‘marumi’ o ‘nadungisan.’
  rationale: Ang konteksto ng Levitico 15 ay tungkol sa ritwal na kalagayan sa ilalim ng batas. Ang tahasang ‘ritwal’ ay umiiwas sa maling pahiwatig na ang regla mismo ay moral na pagkakasala o personal na dungis.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Iniwasan ang sobrang teknikal o makalumang pananalita, ngunit pinanatili ang legal at ritwal na diwa ng talata.
