  to: Kapag may lumalabas na dugo sa katawan ng isang babae,[a] mananatili siya sa kalagayan ng ritwal na karumihan dahil sa kanyang regla sa loob ng pitong araw.[b] Ang sinumang humipo sa kanya ay magiging marumi ayon sa ritwal hanggang kinagabihan.
  rationale: Pinahusay ang idiomatikong Tagalog para sa ritwal na katayuan, ginawang mas tiyak ang temporal na hangganan bilang “hanggang kinagabihan,” at pinalawak ang lexical footnote upang maipakita ang dalawang bahaging Hebreo na pinagsama sa natural na pangunahing salin. Walang idinagdag na doktrinal na interpretasyon.
