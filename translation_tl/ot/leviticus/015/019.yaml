  - severity: low
    issue: Hindi lubos na naipapakita ng talababa ang unang pariralang Hebreo tungkol sa babae na “may pag-agos.”
    rationale: Ang pangunahing salin ay ligtas na pinagsasama ang pag-agos at dugo, ngunit dapat ipakita ng lexical footnote ang mas literal na estruktura.
  - severity: low
    issue: Medyo hindi idiomatiko ang predikadong “ritwal na marumi.”
    rationale: Mas natural na Tagalog ang paglalarawan sa kalagayan bilang “kalagayan ng ritwal na karumihan” o “marumi ayon sa ritwal.”
