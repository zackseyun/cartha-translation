  source_fidelity: 'Ang pangunahing diwa ay wasto: dugong lumalabas kaugnay ng babae, pitong araw na kalagayang ritwal, at karumihan ng humipo hanggang sa evening. Gayunman, pinagsasama ng pangunahing teksto ang dalawang magkaugnay na pariralang Hebreo tungkol sa “pag-agos” at sa dugong iyon. Katanggap-tanggap ito sa Tagalog, ngunit dapat itong mas malinaw na maitala sa talababa. Ang “hanggang sa gabi” ay mas malawak kaysa עַד־הָעָרֶב (“hanggang kinagabihan / evening”).'
  naturalness: Nauunawaan ang draft, ngunit hindi pinakanatural sa modernong Tagalog ang “mananatili siyang ritwal na marumi” at “magiging ritwal na marumi.” Mas maayos ang “mananatili siya sa kalagayan ng ritwal na karumihan” at “magiging marumi ayon sa ritwal.”
  terminology: Ang “ritwal na karumihan” ay angkop para sa נִדָּה at טמא sa kontekstong Levitico at hindi nagdadala ng moral na hatol. Pinananatili ng talababa ang mahalagang paglilinaw na ito.
  issues:
