base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: tl
  text: at tungkol sa babaeng may karamdaman habang nasa kalagayan ng karumihan dahil sa regla,[a] sa sinumang may agas—lalaki man o babae—at sa lalaking sumiping sa isang babaeng marumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang babaeng nireregla.” Ang Hebreong katawagan ay tumutukoy rito sa babaeng nasa kalagayang kaugnay ng kanyang regla.
    reason: lexical_alternative
  - marker: b
    text: Ang “marumi” rito ay nangangahulugang ritwal na marumi ayon sa kautusan sa Levitico, hindi marumi sa moral na diwa.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה
  choice: babaeng may karamdaman
  rationale: Pinananatili nito ang diwa ng salitang tumutukoy sa babaeng nasa kalagayang mahina o may dinaramdam, samantalang nililinaw ng kasunod na parirala na regla ang kaugnay na kalagayan.
- source_word: בְּנִדָּתָהּ
  choice: habang nasa kalagayan ng karumihan dahil sa regla
  rationale: Sa konteksto ng Levitico, tumutukoy ang נִדָּה sa ritwal na karumihang kaugnay ng regla, hindi sa moral na kasamaan.
- source_word: הַזָּב אֶת־זוֹבוֹ
  choice: sinumang may agas
  rationale: Likas at maikli sa Tagalog ang “may agas” para sa taong may lumalabas na likido sa katawan; hindi ito nililimitahan sa lalaki sapagkat kasunod ang “lalaki man o babae.”
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: lalaki man o babae
  rationale: Malinaw nitong ipinakikita na kapwa saklaw ng tuntunin ang lalaki at babae.
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: sumiping sa
  rationale: Pinananatili ng “sumiping sa” ang magalang at eupemistikong paraan ng Hebreo sa pagtukoy sa pakikipagtalik.
- source_word: טְמֵאָה
  choice: babaeng marumi
  rationale: Pinananatili ang pangunahing bokabularyo ng ritwal na kalinisan sa Levitico, na ipinaliliwanag sa talababa upang hindi ito mapagkamalang hatol sa moral na pagkatao.
theological_decisions:
- issue: Kahulugan ng ritwal na karumihan
  choice: Gamitin ang “karumihan” at “marumi” bilang mga katawagang ritwal sa ilalim ng kautusan sa Levitico.
  alternative: Gumamit ng mga salitang nagpapahiwatig ng moral na kasalanan, dungis, o pagiging likas na marumi.
  rationale: Ang talata ay nag-uuri ng mga kalagayang ritwal, hindi humahatol sa moral na halaga o pagkatao ng babae o ng taong may agas.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “agas” bilang maikling katawagang pangkatawan at “sumiping” upang mapanatili ang eupemistikong himig ng Hebreo. Ang pambungad na “at tungkol sa” ay nagpapanatili sa ugnayan ng talatang ito sa naunang buod.
