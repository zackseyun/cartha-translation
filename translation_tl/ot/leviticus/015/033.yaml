  source_fidelity: 'Tapat ang salin sa buod na saklaw ng Hebreo: ang babaeng nasa kalagayang may kaugnayan sa regla, ang taong may agas na saklaw ang lalaki at babae, at ang lalaking sumiping sa babaeng ritwal na marumi. Napapanatili rin ng “at tungkol sa” ang pangwakas na pagbubuod na gamit ng talata.'
