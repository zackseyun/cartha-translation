  source_fidelity: Tumpak na naisasalin ang pangkalahatang saklaw ng וְכָל הַנֹּגֵעַ, ang bagay na hinihipo bilang “higaan niya,” ang obligasyong labhan ang mga damit at hugasan ang katawan, at ang tagal ng ritwal na karumihan hanggang gabi. Hindi ipinapasok ng salin ang moral na kahulugang wala sa teksto.
