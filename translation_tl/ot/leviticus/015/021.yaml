  text: וְ/כָל הַ/נֹּגֵ֖עַ בְּ/מִשְׁכָּבָ֑/הּ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: tl
  text: At ang sinumang humipo sa higaan niya[a] ay dapat maglaba ng kanyang mga damit at maligo sa tubig; magiging marumi siya hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kama niya,” “lugar na hinihigaan niya,” o “sapin sa higaan niya.” Ang salitang Hebreo ay tumutukoy sa lugar o bagay na hinihigaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: At ang sinumang humipo
  rationale: Ang כָּל kasama ng substantibong participle ay nagsasaad ng sinumang kabilang sa pangkalahatang tuntunin. Likas sa modernong Tagalog ang “ang sinumang humipo.”
- source_word: בְּמִשְׁכָּבָהּ
  choice: sa higaan niya
  rationale: Ang מִשְׁכָּב ay tumutukoy sa lugar na hinihigaan at maaari ring ipakahulugang kama o sapin sa higaan. Ang “higaan” ay malinaw ngunit sapat na malawak upang mapanatili ang saklaw ng salitang Hebreo.
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay dapat maglaba ng kanyang mga damit
  rationale: Ang כבס ay partikular na paghuhugas ng mga kasuotan. Ipinahahayag ng “dapat” ang legal na bisa, at nililinaw ng “maglaba” na mga damit ang hinuhugasan.
- source_word: וְרָחַץ בַּמַּיִם
  choice: at maligo sa tubig
  rationale: Sa kontekstong ito, ang רחץ ay tumutukoy sa paghuhugas ng katawan. Ang “maligo sa tubig” ay natural at naiiba sa naunang paglalaba ng mga damit.
- source_word: וְטָמֵא
  choice: magiging marumi siya
  rationale: Ang טמא ay ritwal na kalagayan ng pagiging marumi sa batas ng Levitico. Pinananatili ng “marumi” ang karaniwang kategoryang biblikal nang hindi ito ginagawang tahasang moral na pagkakasala.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Tumpak at likas na Tagalog ito para sa takdang panahong ipinahahayag ng pariralang Hebreo.
theological_decisions:
- issue: Kalikasan ng pagiging marumi
  choice: “magiging marumi siya” bilang ritwal na katayuan
  alternative: “magiging di-dalisay siya” o “madudungisan siya”
  rationale: Ang konteksto ay mga tuntunin tungkol sa ritwal na kalinisan, hindi isang tuwirang pahayag ng moral na kasalanan. Ang “marumi” ay malinaw at hindi nagdaragdag ng hatol na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Ginamit ang “dapat” upang likas na maipahayag ang legal na utos, habang pinanatili ang ritwal na kahulugan ng “marumi.”
