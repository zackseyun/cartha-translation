revisions:
- from: Kung talagang sipingan siya ng isang lalaki[a] at mapasa lalaki ang karumihan ng kanyang regla, magiging marumi ang lalaki sa loob ng pitong araw. Magiging marumi rin ang bawat higaan na hihigaan niya.
  to: Kung talagang makipagtalik ang isang lalaki sa kanya[a] at mapasa kanya ang karumihan ng kanyang regla, magiging marumi siya sa loob ng pitong araw; at magiging marumi ang bawat higaan na hihigaan niya.
  rationale: Inayos ang sintaks at pinalitan ang malabong eupemismong “sipingan” ng tahasang ngunit marangal na “makipagtalik.” Isinalin ang עָלָיו bilang “mapasa kanya,” na ang antecedent ay ang lalaking kapapakilala lamang. Napanatili ang diin ng infinitive absolute sa “talagang,” ang ritwal na bokabularyo, at ang saklaw ng huling sugnay.
