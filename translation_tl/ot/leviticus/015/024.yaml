base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: tl
  text: Kung talagang makipagtalik ang isang lalaki sa kanya[a] at mapasa kanya ang karumihan ng kanyang regla, magiging marumi siya sa loob ng pitong araw; at magiging marumi ang bawat higaan na hihigaan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “Kung talagang humiga ang isang lalaki na kasama niya.” Ang idyomang Hebreo ay tumutukoy sa pakikipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: talagang sipingan
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa kilos. Ang “talagang sipingan” ay natural sa Filipino, nagpapanatili ng diin, at malinaw na tumutukoy sa pakikipagtalik nang hindi nagiging klinikal.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tumutukoy ang pangngalan sa isang lalaking nasa hustong gulang; ito ang tuwiran at likas na salin.
- source_word: אֹתָהּ
  choice: siya
  rationale: Tuwirang layon itong tumutukoy sa babaeng binabanggit sa konteksto.
- source_word: נִדָּתָהּ
  choice: karumihan ng kanyang regla
  rationale: Sa konteksto ng mga tuntunin sa ritwal na kalinisan sa Levitico, ang נִדָּה ay hindi lamang ang biyolohikal na regla kundi ang kalagayan ng ritwal na karumihang kaugnay nito.
- source_word: וּתְהִי ... עָלָיו
  choice: mapasa lalaki
  rationale: Pinananatili nito ang larawan ng Hebreong “mapasa kanya” at ipinahahayag nang natural ang pagdating o paglipat ng ritwal na karumihan sa lalaki.
- source_word: וְטָמֵא
  choice: magiging marumi ang lalaki
  rationale: Ang anyo ng pandiwa sa kondisyunal na batas ay nagsasaad ng bunga. Ang “magiging marumi” ay malinaw sa modernong Filipino at hindi nagpapahiwatig ng moral na pagkakasala.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Likas na Filipino para sa tiyak na tagal na pitong araw.
- source_word: הַמִּשְׁכָּב
  choice: higaan
  rationale: Ang salita ay tumutukoy sa lugar na hinihigaan; mas malawak at mas tumpak ang “higaan” kaysa “kama,” yamang maaaring hindi modernong kama ang tinutukoy.
- source_word: אֲשֶׁר יִשְׁכַּב עָלָיו
  choice: na hihigaan niya
  rationale: Natural na Filipino na sugnay na naglalarawan sa bawat higaan na hihigaan ng lalaki.
- source_word: יִטְמָא
  choice: magiging marumi rin
  rationale: Ipinahahayag ang legal na bunga at pinananatili ang terminolohiya ng ritwal na karumihan.
theological_decisions:
- issue: Paglalarawan sa ritwal na karumihan nang hindi ito ipinapantay sa moral na pagkakasala
  choice: Gamitin ang “marumi” at “karumihan ng kanyang regla” bilang mga terminong tumutukoy sa ritwal na kalagayan.
  alternative: Gamitin ang “nadungisan,” “marungis,” o pananalitang nagpapahiwatig ng moral na kasalanan.
  rationale: Ang konteksto ng Levitico 15 ay ritwal na kalinisan. Hindi sinasabi ng talata mismo na ang kalagayang ito ay katumbas ng personal na moral na pagkakasala.
- issue: Diin ng שָׁכֹב יִשְׁכַּב
  choice: Panatilihin ang diin sa pamamagitan ng “talagang sipingan.”
  alternative: Isalin lamang na “sipingan” o gawing tuwirang “makipagtalik.”
  rationale: May tunay na gramatikal na diin sa Hebreo. Pinananatili ng napiling salin ang diin habang ang talababa ay nagbibigay ng mas tahasang kahulugan ng idyoma.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sipinan” bilang dignified at di-klinikal na idyoma para sa pakikipagtalik, at “higaan” upang mapanatili ang mas malawak na saklaw ng Hebreo. Ang marker na [a] ay inilagay kaagad pagkatapos ng kaugnay na parirala.
