  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: tl
  text: At kung may lumabas na semilya[a] mula sa isang lalaki, dapat niyang hugasan sa tubig ang buong katawan niya, at magiging marumi[b] siya hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “lumabas mula sa kanya ang isang paglabas ng binhi.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “marumi” rito ay tumutukoy sa ritwal na karumihan sa konteksto ng mga batas ng kalinisan sa Levitico; hindi ito kinakailangang nangangahulugang may moral siyang pagkakasala.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na lalaki ang tinutukoy dahil ang batas ay tungkol sa paglabas ng semilya.
- source_word: כִּי
  choice: kung
  rationale: Nagpapakilala ito ng isang kondisyon sa pormang legal.
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: labasan ng semilya
  rationale: Natural at malinaw na salin sa modernong Filipino ng literal na ideyang 'lumabas mula sa kanya ang paglabas ng binhi'; hindi nito tinutukoy kung kusa o hindi kusa ang pangyayari.
- source_word: וְרָחַץ בַּמַּיִם
  choice: paliliguan niya ng tubig
  rationale: Ipinahahayag ang hinihinging paghuhugas o paliligo sa katawan bilang kasunod na hakbang sa batas.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: ang buo niyang katawan
  rationale: Ang Hebreong 'lahat ng kanyang laman' ay idiomatikong tumutukoy sa buong katawan.
- source_word: וְטָמֵא
  choice: at magiging marumi siya
  rationale: Pinananatili ang karaniwang terminolohiya ng kalinisan sa Levitico; nililinaw sa talababa na ritwal na karumihan ang konteksto.
- source_word: עַד הָעָרֶב
  choice: hanggang gabi
  rationale: Natural na Filipino para sa takdang panahong ipinahahayag ng Hebreo.
theological_decisions:
- issue: Kalikasan ng טָמֵא sa mga batas ng kalinisan
  choice: marumi sa ritwal na kahulugan
  alternative: marumi o nagkasala sa moral na kahulugan
  rationale: Sa konteksto ng Levitico 15, ang salita ay tumutukoy sa katayuan sa ritwal na kalinisan, hindi sa tuwirang hatol na may moral na pagkakasala ang lalaki.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “semilya” bilang tiyak at karaniwang terminong pangkatawan; ang “buo niyang katawan” ay mas natural kaysa sa literal na “lahat ng kanyang laman.”
