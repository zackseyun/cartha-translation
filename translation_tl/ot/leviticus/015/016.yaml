  source_fidelity: Ang draft ay wastong kinikilala ang paglabas ng semilya, ang paghuhugas ng buong katawan sa tubig, at ang ritwal na katayuang tumatagal hanggang gabi. Gayunman, ang pangunahing sugnay na “kung labasan ng semilya ang isang lalaki” ay hindi wastong bumubuo ng kahulugan sa Filipino at maaaring magmukhang ang lalaki ang bagay na ‘nilabasan.’ Ang binagong pananalita ay malinaw na iniuugnay ang paglabas sa lalaki nang hindi tinutukoy kung kusa o hindi kusa ito.
  naturalness: Kailangan ng rebisyon para sa natural at wastong modernong Filipino. Ang “paliliguan niya ng tubig” ay hindi ang pinakaangkop na pagbubuo para sa paghuhugas ng sariling katawan; ang “dapat niyang hugasan sa tubig ang buong katawan niya” ay malinaw, marangal, at angkop sa utos na legal. Inilipat din ang mga talababa sa mga salitang tinutukoy nila.
  terminology: Ang “semilya” ay tiyak at natural na terminong Filipino sa kontekstong ito. Ang “marumi” ay maaaring panatilihin kung nililinaw ng talababa na ritwal na karumihan ito at hindi hatol ng moral na pagkakasala.
