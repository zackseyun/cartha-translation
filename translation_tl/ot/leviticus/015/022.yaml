  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: tl
  text: At ang sinumang humipo sa anumang bagay na inuupuan ng babae[a] ay maglalaba ng kanyang mga damit at maliligo sa tubig, at magiging marumi siya hanggang sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anumang kagamitan” o “anumang sisidlan.” Malawak ang kahulugan ng salitang Hebreo na כְּלִי at maaari itong tumukoy sa isang bagay, kagamitan, o sisidlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: At ang sinumang humipo
  rationale: Ang כָל kasama ng substantival na participle ay tumutukoy sa sinumang kabilang sa pangkalahatang uri; natural sa modernong Filipino ang “ang sinumang humipo.”
- source_word: בְּכָל כְּלִי
  choice: sa anumang bagay
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa kagamitan, sisidlan, o iba pang bagay. Pinananatili ng “anumang bagay” ang lawak na angkop sa konteksto ng isang bagay na inuupuan.
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: na inuupuan niya
  rationale: Binabago ng sugnay ang כְּלִי at ang pambabaeng pandiwa ay tumutukoy sa babaeng nasa naunang konteksto. Natural at malinaw ang “inuupuan niya.”
- source_word: יְכַבֵּס בְּגָדָיו
  choice: ay dapat maglaba ng kanyang mga damit
  rationale: Ang כִּבֵּס kaugnay ng mga damit ay tumutukoy sa paglalaba. Ipinahahayag ng “dapat” ang puwersang legal o nag-uutos.
- source_word: וְרָחַץ בַּמַּיִם
  choice: at maligo sa tubig
  rationale: Sa mga tuntunin sa ritwal na kalinisan, karaniwang tumutukoy ang רָחַץ sa paghuhugas ng katawan; malinaw itong ipinahahayag ng “maligo sa tubig.”
- source_word: וְטָמֵא
  choice: magiging marumi siya
  rationale: Tumutukoy ang טָמֵא sa kalagayang ritwal, hindi sa moral na kasalanan. Ang “marumi” ang karaniwang payak na katumbas sa konteksto ng Levitico.
- source_word: עַד הָעָרֶב
  choice: hanggang sa gabi
  rationale: Tumpak at natural nitong ipinahahayag ang takdang panahon ng ritwal na karumihan.
theological_decisions:
- issue: Kalikasan ng karumihan sa mga tuntunin ng Levitico
  choice: Isinalin ang טָמֵא bilang ritwal na “marumi,” nang hindi nagdaragdag ng ideya ng moral na pagkakasala.
  alternative: “nadungisan” o “hindi malinis”
  rationale: Ang talata ay tungkol sa ritwal na kalagayang bunga ng paghipo, hindi sa personal na kasalanan. Pinananatili ng “marumi” ang kategorya ng teksto nang walang interpretatibong pagpapalawak.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may payak na legal na himig. Ginamit ang “dapat” para sa utos at “marumi” para sa ritwal na kalagayan; iniwasan ang bokabularyong maaaring magpahiwatig ng moral na pagkakasala.
