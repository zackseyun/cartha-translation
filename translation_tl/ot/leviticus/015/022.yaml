  naturalness: Natural ang karamihan ng salin, ngunit mas malinaw at mas maayos ang legal na daloy sa “ay maglalaba ... at maliligo,” kaysa sa “ay dapat maglaba ... at maligo.”
  terminology: Ang “marumi” ay maaaring gamitin para sa טָמֵא kung malinaw na ritwal ang konteksto. Ang talababa para sa כְּלִי ay wasto at kapaki-pakinabang.
