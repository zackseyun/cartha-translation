  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: tl
  text: Lumapit sila at binuhat ang mga ito, na nakasuot pa ng kanilang mga tunika[a], papunta sa labas ng kampo, gaya ng sinabi ni Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kanilang mga tunika.” Maaaring magpahiwatig ng paraan ang pang-ukol sa Hebreo, kaya posibleng binuhat nila ang mga katawan habang hinahawakan o ginagamit ang mga tunika.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: lumapit sila
  rationale: Tuwirang ipinapahayag ng qal wayyiqtol ng קרב ang paglapit nila sa mga bangkay; natural at malinaw ito sa modernong Tagalog.
- source_word: וַיִּשָּׂאֻם
  choice: binuhat ang mga ito
  rationale: Ang נשׂא na may panghalip na layon ay tumutukoy sa pagbubuhat at pagdadala sa mga bangkay nina Nadab at Abihu. Pinananatili ng “mga ito” ang anyong panghalip ng Hebreo nang hindi tahasang nagdaragdag ng “mga bangkay.”
- source_word: בְּכֻתֳּנֹתָם
  choice: habang suot pa ang kanilang mahahabang damit
  rationale: Ang כֻּתֹּנֶת ay damit na parang tunika o mahabang kasuotang panloob. Maaaring ilarawan ng ב ang kalagayan—na nasa kanilang mga damit pa sila—ngunit maaari rin itong mangahulugang ginamit o hinawakan ang mga damit sa pagbuhat; inilalahad sa talababa ang tunay na kalabuan.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: papunta sa labas ng kampo
  rationale: Ipinakikita ng “papunta” ang direksiyon ng אֶל, at ang “labas ng kampo” ay natural na katumbas ng מִחוּץ לַמַּחֲנֶה.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: gaya ng sinabi ni Moises
  rationale: Tumutukoy ito sa naunang utos ni Moises at pinananatili ang paghahambing ng כַּאֲשֶׁר nang natural sa Tagalog.
