lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive kasama ng דִּבֵּר ay nagpapatuloy sa salaysay. Pinananatili ng “At nagsalita” ang pormulang pambungad sa banal na pahayag at iniiwasang pag-isahin ito sa kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ito ang natural na panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa modernong Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na tungkulin ng infinitive construct na nagpapakilala sa nilalaman ng pahayag, kahit mas masinsin ito kaysa karaniwang idyomang Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang karaniwang rekonstruksiyong transliterasyon nang hindi ito pinapalitan ng titulong “PANGINOON”; binabanggit sa talababa ang alternatibong “Jehovah.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Sadyang pormal ang “na sinasabi” upang mapanatili ang magkahiwalay na דִּבֵּר at לֵאמֹר sa pormula ng banal na pagsasalita.
