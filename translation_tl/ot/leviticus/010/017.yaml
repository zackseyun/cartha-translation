  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: tl
  text: Bakit hindi ninyo kinain ang handog para sa kasalanan[a] sa banal na lugar? Sapagkat iyon ay lubos na banal, at ibinigay niya iyon sa inyo upang pasanin ang sala ng kapulungan at magbayad-sala para sa kanila sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa paglilinis.” Ang salitang Hebreo ay maaaring tumukoy sa handog na kaugnay ng pag-aalis ng karumihan gayundin ng pagharap sa kasalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: Bakit hindi ninyo kinain
  rationale: Tuwirang tanong na may himig ng pagsaway; natural sa modernong Tagalog at malinaw na maramihan ang kausap.
- source_word: הַחַטָּאת
  choice: ang handog para sa kasalanan
  rationale: Sa kontekstong ito, tiyak na tumutukoy ang חַטָּאת sa handog na inihahain kaugnay ng kasalanan o paglilinis. Ang pangunahing salin ay madaling makilala, habang nasa talababa ang lehitimong alternatibo.
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Tumutukoy sa itinakdang sagradong lugar kung saan kinakain ng mga pari ang handog.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Inihahatid nito ang Hebreong superlatibo nang maikli at hindi ipinagkakamali sa isang partikular na silid ng santuwaryo.
- source_word: נָתַן לָכֶם
  choice: ibinigay niya iyon sa inyo
  rationale: Pinananatili ang ikatlong panauhang paksa ng pandiwa; ayon sa konteksto, ang tinutukoy na nagbigay ay ang Diyos.
- source_word: לָשֵׂאת אֶת עֲוֺן הָעֵדָה
  choice: upang pasanin ang sala ng kapulungan
  rationale: Ang 'pasanin ang sala' ay nagpapanatili sa lakas at bahagyang lawak ng idyomang נשא עון nang hindi nililimitahan iyon sa parusa lamang.
- source_word: הָעֵדָה
  choice: ang kapulungan
  rationale: Ang 'kapulungan' ay isang malinaw at marangal na katawagan sa nagkakaisang pamayanan ng Israel.
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: magbayad-sala para sa kanila
  rationale: Natural na salin sa ritwal na gamit ng כפר; iniiwasan ang 'tubusin,' na maaaring mapagkamalang tumutukoy sa pagtubos o redemption.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang diwa ng pagkilos sa presensiya ng Diyos at isinasalin ang banal na pangalan bilang Yahweh.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Ang konteksto ay malinaw na tungkol sa isang hain, ngunit maaaring idiin ng terminong Hebreo kapwa ang kasalanan at ang paglilinis mula sa karumihan; kaya pinanatili sa talababa ang alternatibo.
- issue: Paksa ng נָתַן ('ibinigay')
  choice: ibinigay niya iyon sa inyo
  alternative: ibinigay iyon sa inyo
  rationale: May ikatlong panauhang panlalaking isahan ang pandiwang Hebreo ngunit walang tahasang pangngalang paksa. Malamang na Diyos ang tinutukoy sa konteksto, subalit hindi idinagdag ang pangalang 'Diyos' sa mismong salin.
- issue: Saklaw ng עֲוֺן sa tungkulin ng mga pari
  choice: sala
  alternative: kasamaan; pananagutan sa kasalanan
  rationale: Pinananatili ng 'sala' ang tensiyon sa pagitan ng mismong kasamaan at ng pananagutang dulot nito, nang hindi pinipili ang isang mas makitid na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang 'ninyo' para sa maramihang kausap, 'kapulungan' para sa pormal na pamayanan ng Israel, at 'kabanal-banalan' bilang likas na superlatibo. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
