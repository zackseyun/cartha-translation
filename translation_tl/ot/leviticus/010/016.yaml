  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: tl
  text: Masusing hinanap ni Moises ang lalaking kambing na handog para sa kasalanan,[a] at nakita niyang sinunog na pala iyon.[b] Kaya nagalit siya kina Eleazar at Itamar, ang mga natitirang anak ni Aaron,[c] at sinabi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hinanap nang hinanap ang lalaking kambing na handog para sa kasalanan.” Gumagamit ang Hebreo ng infinitive absolute kasama ng finite verb upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: O, “lubusan na pala itong sinunog.” Ipinakikita ng Hebreo na natagpuan ang kambing sa kalagayang sinunog na.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga natitirang anak ni Aaron” ay sina Eleazar at Itamar, ang mga anak na naiwan pagkamatay nina Nadab at Abihu (Lev. 10:1–2, 12).
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: ang kambing na lalaki para sa handog para sa kasalanan
  rationale: Tahasang ipinahahayag ng שְׂעִיר na lalaki ang kambing, habang pinananatili ng “handog para sa kasalanan” ang kategoryang panghain ng חַטָּאת sa likas at malinaw na Tagalog.
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: masusing hinanap
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa paghahanap. Likas na naihahatid ng “masusing hinanap” ang diin nang hindi ginagaya nang mekanikal ang pag-uulit sa Hebreo.
- source_word: וְהִנֵּה
  choice: at nakita niyang … pala
  rationale: Ipinahihiwatig ng הִנֵּה ang bigla o kapansin-pansing pagkatuklas. Sa modernong Tagalog, likas na naihahatid ng “nakita niyang … pala” ang ganitong puwersa ng salaysay.
- source_word: שֹׂרָף
  choice: sinunog na pala iyon
  rationale: Inilalarawan ng passive participle ang kalagayang natuklasang kinaroroonan ng kambing. Ipinapakita ng “sinunog na” ang naunang kilos at resultang kalagayan nang hindi sapilitang nilulutas kung ganap itong natupok.
- source_word: וַיִּקְצֹף
  choice: nagalit siya
  rationale: Malinaw at katamtamang katumbas ito ng pandiwang nagsasaad ng galit, nang hindi pinalalabis ang tindi.
- source_word: הַנּוֹתָרִם
  choice: ang mga natitirang anak ni Aaron
  rationale: Tumutukoy ito kina Eleazar at Itamar bilang mga anak na naiwan matapos mamatay sina Nadab at Abihu. Ang “natitirang” ay tuwiran at hindi labis na mapagpakahulugan.
- source_word: לֵאמֹר
  choice: at sinabi,
  rationale: Likas itong pambungad sa tuwirang pananalita na nagpapatuloy sa susunod na talata.
