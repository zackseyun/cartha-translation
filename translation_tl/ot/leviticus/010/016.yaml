translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang bokabularyong panghain at iniwasan ang makaluma o sobrang teknikal na pananalita. Ang “pala” ay natural na naghahatid ng puwersa ng biglang pagkatuklas sa וְהִנֵּה.
