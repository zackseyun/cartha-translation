source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Moises kay Aaron, “Ito ang sinabi ni Yahweh: ‘Sa gitna ng mga lumalapit sa akin, ipakikita kong ako ay banal[a], at sa harap ng buong bayan, luluwalhatiin ako[b].’” At nanatiling tahimik si Aaron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sa pamamagitan ng mga lumalapit sa akin, ituturing akong banal.” Maaaring ipahayag ng Hebreo na mahahayag ang kabanalan ng Diyos o na kikilalanin at ituturing siyang banal ng mga lumalapit sa kanya.
    reason: alternative_reading
  - marker: b
    text: O, “pararangalan ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בִּקְרֹבַי
  choice: Sa gitna ng mga lumalapit sa akin
  rationale: Ipinahahayag nito ang mga lumalapit sa Diyos sa pagsamba at paglilingkod nang hindi nililimitahan ang tinutukoy sa salitang “mga pari.”
- source_word: אֶקָּדֵשׁ
  choice: ipakikita kong ako ay banal
  rationale: Natural sa makabagong Tagalog at pinananatili ang diwang ang kabanalan ng Diyos ay mahahayag, habang hindi ganap na isinasara ang posibilidad na kikilalanin o ituturing siyang banal.
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: sa harap ng buong bayan
  rationale: Likas na salin ng Hebreong idyoma at malinaw na ipinakikita ang pampublikong katangian ng pahayag.
- source_word: אֶכָּבֵד
  choice: luluwalhatiin ako
  rationale: Pinananatili ang pasibong anyo at ang mabigat na teolohikal na diwa ng pagtanggap ng Diyos ng luwalhati o karangalan.
- source_word: וַיִּדֹּם
  choice: nanatiling tahimik
  rationale: Malinaw at marangal na ipinahahayag ang tahimik at pigil na tugon ni Aaron.
theological_decisions:
- issue: Ang pagpapahayag ng kabanalan ng Diyos kaugnay ng mga lumalapit sa kanya
  choice: Sa gitna ng mga lumalapit sa akin, ipakikita kong ako ay banal
  alternative: Sa pamamagitan ng mga lumalapit sa akin, ituturing akong banal
  rationale: Maaaring tumukoy ang Hebreo sa pagpapamalas ng kabanalan ng Diyos o sa pagkilala at pagtrato sa kanya bilang banal. Ginawang pangunahing teksto ang natural na pagpapamalas, at inilagay sa talababa ang alternatibo upang mapanatili ang tunay na kalabuan.
- issue: Ang pampublikong pagluwalhati sa Diyos
  choice: luluwalhatiin ako
  alternative: pararangalan ako
  rationale: Kapwa posible, ngunit mas pinananatili ng “luluwalhatiin” ang bigat ng כבד kapag tumutukoy sa Diyos; ibinigay ang “pararangalan” bilang leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang pangalan na “Yahweh,” ang wika ng paglapit sa Diyos, at ang taimtim na katahimikan ni Aaron. Ang mga talababa ay tumutugma sa mga marker [a] at [b] sa pangunahing teksto.
