  naturalness: Natural ang karamihan ng Tagalog, ngunit mas malinaw at mas maayos ang daloy kung tahasang sasabihing inilagay ang insenso sa mga sisidlan. Iniiwasan din ng rebisyon ang medyo mabigat na pag-uulit na 'apoy na hindi pinahintulutan—apoy na hindi niya iniutos.'
