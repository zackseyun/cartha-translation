reference: Leviticus 10:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: tl
  text: Kinuha nina Nadab at Abihu[a], na mga anak ni Aaron, ang kani-kanilang lalagyan ng baga. Naglagay sila ng apoy at insenso sa mga iyon, at naghandog sa harap ni Yahweh ng apoy na hindi ipinahintulot, na hindi niya iniutos sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pariralang Hebreo ay maaari ring isaling “kakaibang apoy” o “dayuhang apoy.” Ipinapaliwanag ng kasunod na sugnay na ito ay apoy na hindi iniutos ni Yahweh sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha
  rationale: Karaniwang pandiwang pasalaysay ang לָקַח; natural sa modernong Tagalog ang “kinuha.”
- source_word: בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: nina Nadab at Abihu, na mga anak ni Aaron
  rationale: Pinananatili ang mga pangalan at malinaw na ipinahahayag ang kaugnayang pampamilya.
- source_word: אִישׁ מַחְתָּתוֹ
  choice: ang kani-kanilang lalagyan ng baga
  rationale: Distributibo ang אִישׁ (“bawat isa”), at ang מַחְתָּה ay sisidlang ginagamit sa pagdadala ng baga o apoy; mas madaling maunawaan ang “lalagyan ng baga” kaysa sa teknikal na “insensaryo.”
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: Naglagay sila ng apoy sa mga iyon
  rationale: Tuwirang inilalarawan ang paglalagay ng apoy sa kani-kanilang lalagyan; ang maramihang “mga iyon” ay tumutugma sa dalawang lalagyan.
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: nilagyan ng insenso
  rationale: Natural na Tagalog para sa paglalagay ng insenso sa ibabaw ng apoy o baga, nang hindi labis na tinutukoy ang eksaktong ayos.
- source_word: וַיַּקְרִבוּ לִפְנֵי יְהוָה
  choice: naghandog sa harap ni Yahweh
  rationale: Sa kontekstong pangritwal, ang Hiphil ng קרב ay “maghandog” o “magharap”; ang “sa harap ni Yahweh” ay nagpapanatili sa pormulang kultiko at sa banal na pangalan.
- source_word: אֵשׁ זָרָה
  choice: apoy na hindi pinahintulutan
  rationale: Sa kontekstong pangpari, ipinahihiwatig ng זָרָה ang hindi awtorisado o hindi nararapat sa sagradong hangganan. Iniiwasan nito ang maling unawa na kakaiba lamang ang apoy.
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: apoy na hindi niya iniutos sa kanila
  rationale: Pinananatili ang paliwanag ng Hebreo kung bakit hindi pinahintulutan ang apoy, pati ang tahasang layon na “sa kanila.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng אֵשׁ זָרָה
  choice: apoy na hindi pinahintulutan
  alternative: kakaibang apoy; dayuhang apoy
  rationale: Ipinapakita ng kasunod na sugnay na ang problema ay hindi ito iniutos ng Diyos. Pinananatili ng salin ang legal at ritwal na bigat nang hindi nagdaragdag ng tiyak na paratang na hindi sinasabi ng teksto.
- issue: Tinutukoy ng “hindi niya iniutos”
  choice: Ang sugnay ay inuugnay sa apoy na inihandog
  alternative: Ipinagbabawal mismo ang bawat indibiduwal na hakbang ng ritwal
  rationale: Sinasabi lamang ng Hebreo na hindi ito iniutos sa kanila; hindi nito tahasang nililinaw kung ang pinagmulan ng apoy, ang uri nito, o ang buong pagkilos ang mali.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kani-kanilang” upang maipahayag ang distributibong Hebreo, at “lalagyan ng baga” sa halip na mas teknikal o eklesyastikong “insensaryo.”
