  to: At sinabi ni Aaron kay Moises, “Tingnan mo, ngayong araw ay iniharap nila sa harap ni Yahweh ang kanilang handog para sa kasalanan[a] at ang kanilang handog na sinusunog. At mga ganitong bagay ay nangyari sa akin[b]. Kung kinain ko sana ngayong araw ang handog para sa kasalanan, magiging mabuti kaya iyon sa paningin ni Yahweh[c]?”
