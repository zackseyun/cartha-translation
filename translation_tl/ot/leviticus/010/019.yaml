  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: tl
  text: At sinabi ni Aaron kay Moises, “Tingnan mo, ngayong araw ay iniharap nila sa harap ni Yahweh ang kanilang handog para sa kasalanan[a] at ang kanilang handog na sinusunog. At mga ganitong bagay ay nangyari sa akin[b]. Kung kinain ko sana ngayong araw ang handog para sa kasalanan, magiging mabuti kaya iyon sa paningin ni Yahweh[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang Hebreong חַטָּאת ay maaaring tumukoy sa kasalanan o sa haing kaugnay ng paglilinis mula sa kasalanan o karumihan. Ganito rin sa ikalawang pagbanggit nito sa talata.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at mga ganito ang nangyari sa akin.” Tinutukoy ni Aaron ang mga sakunang nangyari nang araw na iyon, lalo na ang pagkamatay ng kanyang mga anak.
    reason: cultural_note
  - marker: c
    text: O “kalulugdan kaya iyon ni Yahweh?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan mo
  rationale: Ginagamit bilang panawag-pansin sa simula ng paliwanag ni Aaron; natural ito sa makabagong Tagalog at pinananatili ang tuwirang himig.
- source_word: הִקְרִיבוּ
  choice: iniharap
  rationale: Ang Hiphil ng קרב ay may karaniwang kahulugang panghain na ‘ilapit’ o ‘iharap’; malinaw na ipinahahayag dito ang paghaharap ng handog kay Yahweh.
- source_word: חַטָּאתָם / חַטָּאת
  choice: kanilang handog para sa kasalanan / ang handog para sa kasalanan
  rationale: Sa kontekstong panghain sa Levitico, tumutukoy ang חַטָּאת sa handog at hindi sa abstraktong kasalanan. Ang ‘handog para sa kasalanan’ ay malinaw at karaniwang salin, habang inilalagay sa talababa ang posibleng ‘handog para sa paglilinis.’
- source_word: עֹלָתָם
  choice: kanilang handog na sinusunog
  rationale: Tumutukoy sa handog na sinusunog sa dambana; pinili ang malinaw at karaniwang katawagang Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong idyoma ng paghaharap sa presensiya ni Yahweh at ang personal na banal na pangalan.
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: nangyari sa akin ang mga bagay na tulad nito
  rationale: Natural na Tagalog para sa literal na diwang ‘sinalubong ako ng mga tulad nito’; hindi tinutukoy nang tahasan sa pangunahing teksto kung aling mga sakuna ang ibig sabihin.
- source_word: וְאָכַלְתִּי
  choice: Kung kinain ko
  rationale: Bagaman waw + qatal ang anyo, gumaganap ito sa konteksto bilang kondisyong humahantong sa retorikal na tanong.
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: magiging mabuti kaya iyon sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma at ang retorikal na tanong tungkol sa pagsang-ayon ng Diyos, nang hindi nilulutas kung ritwal, moral, o mas malawak na kaangkupan ang usapin.
theological_decisions:
- issue: Batayan ng pagtatanggol ni Aaron sa hindi pagkain ng handog
  choice: Iniuugnay ni Aaron ang hindi niya pagkain sa mga pangyayaring sumapit sa kanya nang araw na iyon at itinatanong kung magiging mabuti iyon sa paningin ni Yahweh.
  alternative: Maaaring ang tinutukoy ay kalagayang ritwal, pagdadalamhati, personal na kawastuhan, o pangkalahatang kaangkupan ng pagkain ng handog.
  rationale: Hindi espesipikong nilulutas ng Hebreo kung anong uri ng di-kaangkupan ang nasa isip ni Aaron; pinananatili ng salin ang teolohikal at ritwal na tensiyong ito.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “Yahweh” para sa banal na pangalang יהוה. Pinanatili ang idyomang “sa paningin ni Yahweh” at ang di-tiyak na saklaw ng paliwanag ni Aaron.
