source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: tl
  text: Dadalhin nila ang hita[a] na handog na inilaan[b] at ang dibdib na handog na iwinawagayway[c], kasama ng mga handog na sinusunog mula sa matatabang bahagi, upang iwinagayway ang mga ito bilang handog na iwinawagayway sa harap ni Yahweh.[d] Magiging para sa iyo at sa iyong mga anak na kasama mo ang mga ito bilang tuntuning panghabang panahon, gaya ng iniutos ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “bahagi ng paa.” Tumutukoy ito sa itaas na bahagi ng hulihang paa ng hayop.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog na inilaan” ay tumutukoy sa bahaging ibinukod bilang handog; tradisyonal din itong tinatawag na “handog na itinataas.”
    reason: lexical_alternative
  - marker: c
    text: Ang “handog na iwinawagayway” ay isang ritwal na paghaharap ng handog sa harap ni Yahweh. Maaari rin itong isaling “handog na inihaharap.”
    reason: cultural_note
  - marker: d
    text: Ang “Yahweh” ang pagsasatitik sa banal na pangalang Hebreo na YHWH.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: hita
  rationale: Tumutukoy sa bahagi ng hulihang paa ng hayop na nauukol sa pari. Mas tiyak ang “hita” kaysa sa mas malawak na “binti” o “paa.”
- source_word: תְּרוּמָה
  choice: inilaan bilang handog
  rationale: Ipinahihiwatig ng salita ang bahaging ibinukod o inihandog. Likas at malinaw ito sa makabagong Tagalog nang hindi umaasa sa di-pamilyar na katawagang ritwal.
- source_word: חָזֶה
  choice: dibdib
  rationale: Ito ang tuwirang katawagang anatomikal at malinaw sa konteksto ng paghahandog.
- source_word: תְּנוּפָה
  choice: handog na iwinawagayway
  rationale: Pinananatili nito ang ritwal na galaw at ang kaugnayan ng pangngalan sa pandiwang לְהָנִיף sa mismong talata.
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: kasama ng matatabang bahaging handog na sinusunog
  rationale: Ipinakikita nitong ang hita at dibdib ay dinadala kasabay ng matatabang bahaging inihahandog sa apoy; pinananatili rin nito ang kongkretong larawang kultiko ng אִשֵּׁי.
- source_word: יָבִיאוּ
  choice: dadalhin nila
  rationale: Ang di-ganap na anyo ay may puwersang nag-uutos sa legal na konteksto; natural itong ipinahahayag ng aspektong kontemplatibo sa Tagalog.
- source_word: לְהָנִיף תְּנוּפָה
  choice: upang iwagayway ang mga ito bilang handog
  rationale: Inilalahad ang layunin at ritwal na kilos nang hindi mabigat ang pag-uulit sa Tagalog, habang naipaliwanag na sa naunang parirala at talababa ang teknikal na uri ng handog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Tuwirang pinananatili ang pormulang kultiko na nangangahulugang nasa presensiya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ
  choice: Ang mga ito ay para sa iyo at sa iyong mga anak na kasama mo
  rationale: Malinaw na ipinahahayag ang karapatan ng pari at ng kaniyang mga anak sa mga bahaging nabanggit. Ginamit ang maramihan sa Tagalog ayon sa dalawang bahaging tinutukoy.
- source_word: לְחָק עוֹלָם
  choice: bilang tuntunin magpakailanman
  rationale: Pinananatili ang diwa ng isang patuloy at itinakdang kautusan sa likas at dignified na Tagalog.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: ayon sa iniutos ni Yahweh
  rationale: Malinaw na ipinakikita ang pagsunod sa naunang utos ng Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili itong Yahweh sa transliterasyon at ipinaliwanag sa talababa.
- issue: Paglalahad sa teknikal na katawagang תְּנוּפָה
  choice: handog na iwinawagayway
  alternative: handog na inihaharap
  rationale: Pinananatili ng napiling salin ang posibleng aktuwal na ritwal na pagkilos at ang ugnayan ng pangngalan at pandiwa, nang hindi nilulutas ang eksaktong anyo ng kilos na hindi detalyado sa talata.
- issue: Saklaw ng חָק עוֹלָם
  choice: tuntunin magpakailanman
  alternative: palagiang tuntunin
  rationale: Isinasalin nang tuwiran ang pangmatagalang puwersa ng עוֹלָם nang hindi nagdaragdag ng paliwanag tungkol sa sistematikong teolohikal na saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mahahalagang katawagang ritwal ngunit nilagyan ng maiikling paliwanag. Iniwasan ang sobrang arkaikong pananalita at ang paglalagay ng denominasyonal na pagpapakahulugan.
