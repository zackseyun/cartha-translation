translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang karaniwang anyong Filipino ng mga pangalan: Moises, Misael, Elzafan, Uziel, at Aaron. Pinanatili ang literal na katawagang “mga kapatid” at ang bahagyang ambiguwidad ng “santuwaryo/banal na lugar,” na nilinaw sa mga talababa.'
