base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: tl
  text: Pagkatapos, tinawag ni Moises sina Misael at Elzafan, mga anak ni Uziel, na tiyuhin ni Aaron, at sinabi sa kanila, “Lumapit kayo. Buhatin ninyo ang inyong mga kapatid[a] mula sa harap ng santuwaryo[b] at dalhin sila sa labas ng kampo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “mga kapatid” ay maaari ring tumukoy nang mas malawak sa malalapit na lalaking kamag-anak. Dito, sina Nadab at Abihu—na mga pinsan nila—ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: O, “banal na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Sa kontekstong pasalaysay, ang קרא ay nangangahulugang tumawag o magpatawag. Natural at tuwiran sa modernong Tagalog ang “tinawag.”
- source_word: בְּנֵי עֻזִּיאֵל
  choice: mga anak ni Uziel
  rationale: Tuwirang kinikilala ng pariralang konstrukto sina Misael at Elzafan bilang mga anak ni Uziel; magiging labis na malawak ang “mga inapo.”
- source_word: דֹּד אַהֲרֹן
  choice: tiyuhin ni Aaron
  rationale: 'Karaniwang tumutukoy ang דּוֹד sa tiyuhin sa ganitong konteksto ng pagkakamag-anak. Iniuugnay ito kay Uziel sa apposisyon: “mga anak ni Uziel na tiyuhin ni Aaron.”'
- source_word: קִרְבוּ
  choice: Lumapit kayo
  rationale: Pinananatili nito ang pandiwang diwa ng paglapit at ang maramihang pautos na anyo, sa natural at marangal na Tagalog.
- source_word: שְׂאוּ
  choice: Buhatin ninyo
  rationale: Ang נשא ay maaaring mangahulugang buhatin, dalhin, o pasanin. Dahil mga bangkay ang inilalabas, malinaw na ipinahihiwatig ng “buhatin” ang unang kilos nang hindi nagdaragdag ng paraang hindi sinasabi ng teksto.
- source_word: אֲחֵיכֶם
  choice: inyong mga kapatid
  rationale: Pinananatili ang literal na katawagang pangkamag-anak ng אָח, na maaari ring tumukoy sa malalapit na lalaking kamag-anak. Nililinaw sa talababa na mga pinsan ang tinutukoy rito.
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: mula sa harap ng santuwaryo
  rationale: Ipinapahayag ng פְּנֵי ang harap o kinaroroonan, at sa kontekstong ito ang הַקֹּדֶשׁ ay tumutukoy sa banal na pook o santuwaryo. Pinananatili ng salin ang kongkretong ugnayang panlunan.
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: dalhin sila sa labas ng kampo
  rationale: Malinaw na ipinapahayag ng “sa labas ng kampo” ang patutunguhan. Ang “dalhin sila” ay likas na Tagalog na bumubuo sa kilos na ipinahihiwatig ng שְׂאוּ at ng pariralang patungo sa labas.
