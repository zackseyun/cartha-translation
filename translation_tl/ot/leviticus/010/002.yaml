id: LEV.10.2
reference: Leviticus 10:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: tl
  text: At lumabas ang apoy mula sa presensya ni Yahweh at tinupok sila, at namatay sila sa harap ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: lumabas
  rationale: Ang wayyiqtol ng יצא ay nagsasaad ng kasunod na pangyayari sa salaysay; likas sa Tagalog ang “lumabas” at pinananatili nito ang direksiyong mula sa presensya ng Diyos.
- source_word: אֵשׁ
  choice: apoy
  rationale: Tuwirang tumutukoy rito sa apoy bilang tagapagdulot ng agarang paghatol.
- source_word: מִלִּפְנֵי יְהוָה
  choice: mula sa presensya ni Yahweh
  rationale: Ang literal na diwa ay “mula sa harap/mukha/presensya ni Yahweh.” Mas natural sa modernong Tagalog ang “mula sa presensya” kaysa “mula sa harap,” habang pinananatili ang pinagmulan ng apoy.
- source_word: וַתֹּאכַל
  choice: tinupok
  rationale: Bagaman karaniwang nangangahulugang “kumain” ang אכל, kapag apoy ang simuno ay angkop at matindi ang idyomatikong Tagalog na “tinupok.”
- source_word: אֹתָם
  choice: sila
  rationale: Panghalip na layon na tumutukoy kina Nadab at Abihu; hinihingi ng pandiwang “tinupok” ang anyong “sila” sa konstruksyong ito.
- source_word: וַיָּמֻתוּ
  choice: namatay sila
  rationale: Pinananatili ang aktibong di-palipat na anyo ng Hebreo at hindi dinaragdagan ng interpretatibong “pinatay sila.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang locative at teolohikal na pag-uulit ng לִפְנֵי, ngunit dito natural at malinaw ang “sa harap ni Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili ang pangalang tipan bilang “Yahweh” nang hindi nagpapasok ng denominasyonal na katawagan.
- issue: Kung ang וַיָּמֻתוּ ay isasaling pasibong sanhi o payak na kinalabasan
  choice: namatay sila
  alternative: pinatay sila
  rationale: Aktibo at di-palipat ang pandiwa sa Hebreo. Ipinahayag na ng naunang sugnay ang sanhi, kaya hindi kailangang gawing pasibo o palawakin ang kahulugan.
- issue: Pagkakaiba ng dalawang pariralang may לִפְנֵי יְהוָה
  choice: “mula sa presensya ni Yahweh” sa una at “sa harap ni Yahweh” sa ikalawa
  alternative: Gamitin ang “harap” o “presensya” sa parehong pagkakataon
  rationale: Ang unang parirala ay nagsasaad ng pinagmulan ng apoy at mas natural bilang “mula sa presensya”; ang ikalawa ay nagsasaad ng lugar o kalagayan ng kanilang pagkamatay at natural bilang “sa harap.” Parehong saklaw ng Hebreong idiom ang mga saling ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang “tinupok” bilang natural na kolokasyon para sa mapanirang pagkilos ng apoy. Pinanatili ang dalawang pagbanggit kay Yahweh at ang payak, mabigat na daloy ng salaysay.
