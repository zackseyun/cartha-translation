translation:
  language: tl
  text: upang makilala ninyo ang pagkakaiba ng banal at ng karaniwan[a], at ng marumi at ng malinis[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang banal at ang hindi banal.” Ang salitang Hebreo ay tumutukoy sa pagkakaiba ng itinalaga bilang banal at ng hindi banal; ginamit dito ang “karaniwan” upang hindi ipahiwatig na tahasang lapastangan ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, marumi at malinis bilang mga kalagayang ritwal.
    reason: cultural_note
lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: upang makilala ninyo ang pagkakaiba
  rationale: Ang pawatas na may ל ay nagpapahayag ng layunin bilang pagpapatuloy ng naunang talata. Likas sa makabagong Tagalog ang pariralang ito at malinaw na tumutukoy sa tungkulin ng mga pari na kilalanin ang magkaibang kategorya, hindi lamang pisikal na paghiwalayin ang mga ito.
- source_word: בֵּין
  choice: ng … at ng
  rationale: Sa paulit-ulit na kayariang Hebreo, minamarkahan ng בֵּין ang dalawang magkatapat na kategorya. Ang Tagalog na “ang pagkakaiba ng … at ng” ang natural at eksaktong katumbas sa pangungusap.
- source_word: הַקֹּדֶשׁ
  choice: banal
  rationale: Tumutukoy ang pangngalan sa kategorya o saklaw ng anumang itinalaga bilang banal, nang hindi nililimitahan sa isang partikular na bagay.
- source_word: הַחֹל
  choice: karaniwan
  rationale: Sa bokabularyong pangpari, ito ang hindi itinalaga bilang banal. Pinananatili ng “karaniwan” ang pagsalungat sa “banal” nang hindi ipinahihiwatig na lapastangan o masama ang tinutukoy.
- source_word: הַטָּמֵא
  choice: marumi
  rationale: Sa konteksto ng Levitico, ang “marumi” ay kinikilalang katawagan para sa kalagayang ritwal na hindi malinis; hindi nito awtomatikong ginagawang kasalanang moral ang bawat ganitong kalagayan.
- source_word: הַטָּהוֹר
  choice: malinis
  rationale: Bilang katapat ng “marumi,” natural at tumpak ang “malinis” para sa kategorya ng ritwal na kalinisan sa mga kautusang pangpari.
theological_decisions:
- issue: Ang pagsalungat ng חֹל at קֹדֶשׁ sa kabanalang pangpari
  choice: banal at karaniwan
  alternative: banal at di-banal; banal at lapastangan
  rationale: Tinutukoy ng talata ang pagkilala sa mga kategoryang pangritwal. Hindi ipinahihiwatig ng חֹל na masama o tahasang nilalapastangan ang isang bagay; kaya pinili ang “karaniwan,” habang inilagay sa talababa ang alternatibong paglilinaw.
- issue: Ang uri ng mga kategoryang טָמֵא at טָהוֹר
  choice: marumi at malinis bilang mga kalagayang ritwal
  alternative: di-dalisay at dalisay
  rationale: Sa konteksto ng Levitico, pangunahing tumutukoy ang mga salita sa katayuang ritwal. Iniiwasan ng salin at talababa na ipantay ang lahat ng karumihang ritwal sa pagkakasalang moral.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “makilala ninyo ang pagkakaiba” kaysa sa mas mekanikal na “paghiwalayin” upang ipahayag ang gawaing pagkilala ng mga pari. Pinanatili ang magkatambal at maindayog na kayarian ng tekstong Hebreo, pati ang kuwit sa hulihan dahil bahagi ito ng nagpapatuloy na pangungusap.
