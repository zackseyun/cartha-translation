  yaml_path: translation/ot/leviticus/010/020.yaml
  text: And Moses heard[a], and it was good in his eyes.
translation:
  language: tl
  text: At narinig ito ni Moises, at naging kalugud-lugod iyon sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “at sinang-ayunan niya ito.” Literal sa Hebreo: “at naging mabuti iyon sa kanyang mga mata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: narinig ito
  rationale: Ang Qal na שׁמע ay karaniwang nangangahulugang “marinig.” Idinagdag ang “ito” bilang likas na layon sa Filipino, na tumutukoy sa paliwanag ni Aaron sa naunang talata, nang hindi ipinapalagay na lubos itong naunawaan o sinang-ayunan ni Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang karaniwang anyo ng pangalang משה sa modernong Filipino.
- source_word: וַיִּיטַב
  choice: naging mabuti ito
  rationale: Pinananatili nito ang payak na kahulugan ng יטב na “maging mabuti” o “maging kalugud-lugod,” habang iniiwasang tahasang gawing “inaprubahan niya,” na mas interpretatibo.
- source_word: בְּעֵינָיו
  choice: sa kanyang paningin
  rationale: Pinananatili ang larawang nasa idyomang Hebreo na literal na “sa kanyang mga mata,” ngunit gumagamit ng mas natural at marangal na pariralang Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak at marangal. Ang “sa kanyang paningin” ay nagpapanatili sa idyomang Hebreo nang hindi nagiging labis na literal; ang talababa ay nagbibigay ng mas likas at mas interpretatibong mga posibleng kahulugan.
