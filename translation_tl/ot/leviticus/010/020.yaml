  source_fidelity: Tumpak ang pagtukoy sa pandiwang “narinig” at sa idyomang Hebreo na nagsasaad ng positibong pagtataya ni Moises. Gayunman, ang “naging mabuti ito sa kanyang paningin” ay masyadong literal at maaaring magpahiwatig na nagbago ang katangian ng bagay, sa halip na ito ay naging katanggap-tanggap kay Moises.
