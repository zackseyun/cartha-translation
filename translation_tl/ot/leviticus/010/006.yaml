  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: tl
  text: Sinabi ni Moises kay Aaron at sa kanyang mga anak na sina Eleazar at Itamar, “Huwag ninyong pabayaang nakalugay ang inyong buhok[a], at huwag ninyong punitin ang inyong mga damit, baka kayo mamatay at magalit siya sa buong kapulungan. Ngunit ang inyong mga kapatid—ang buong sambahayan ng Israel—ay iiyak dahil sa pagkasunog na idinulot ni Yahweh.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag ninyong alisan ng takip ang inyong mga ulo” o “Huwag ninyong pabayaang hindi maayos ang inyong buhok.” Tumutukoy ang Hebreo sa isang tanda ng pagluluksa na may kinalaman sa ulo o buhok.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang pagkasunog na sinunog ni Yahweh”; ginamit ang “idinulot ni Yahweh” upang maging natural sa Filipino habang pinananatiling si Yahweh ang tuwirang gumawa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: Huwag ninyong hayaang magulo at nakalugay ang inyong buhok
  rationale: Ang parirala ay tumutukoy sa buhok o ulo na pinabayaang nakalugay at magulo bilang tanda ng pagluluksa. Nililinaw ng saling Filipino ang kilos nang hindi ipinapalagay na pag-aalis lamang ito ng pantakip sa ulo.
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: huwag ninyong punitin ang inyong mga damit
  rationale: Ang פָּרַם ay pagpun撕 ng damit, lalo na bilang tanda ng pagluluksa; tuwiran at likas ito sa modernong Filipino.
- source_word: וְלֹא תָמֻתוּ
  choice: upang hindi kayo mamatay
  rationale: Ipinahahayag nito ang bunga na dapat iwasan sa pagsunod sa mga pagbabawal.
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: at hindi siya magalit sa buong kapulungan
  rationale: Isahan ang pandiwa at walang tahasang paksa; pinananatili ng 'siya' ang implicit na personal na paksa, na sa konteksto ay si Yahweh, nang hindi inuulit ang pangalan.
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: ang inyong mga kapatid—ang buong sambahayan ng Israel
  rationale: Pinananatili ang literal na 'mga kapatid' at ang kasunod na appositive na nagpapakitang tumutukoy ito sa buong bayang Israel.
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: iiyak dahil sa pagsunog
  rationale: Pinananatili ang kongkretong larawan ng pagkasunog at ang pagluluksa dahil dito, sa halip na ipakahulugang 'sakuna' o 'hatol.'
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: na pinasimulan ni Yahweh
  rationale: Iniiwasan ang mabigat na pag-uulit na 'pagsunog na sinunog' habang tuwirang iniuugnay kay Yahweh ang pagsiklab o pagsisimula ng apoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulong 'PANGINOON.'
- issue: Paksa ng יִקְצֹף
  choice: hindi siya magalit sa buong kapulungan
  alternative: hindi bumagsak ang galit sa buong kapulungan
  rationale: Walang tahasang paksa sa Hebreo, ngunit isahan at personal ang pandiwa. Ang 'siya' ay nagpapanatili sa implicit na paksa at sa konteksto ay tumutukoy kay Yahweh, nang hindi ginagawang abstraktong puwersa ang galit.
- issue: Kalikasan ng ipinagbabawal na tanda ng pagluluksa sa ulo o buhok
  choice: magulo at nakalugay ang inyong buhok
  alternative: alisin ang takip sa inyong ulo; pabayaang hindi maayos ang inyong buhok
  rationale: Hindi tiyak kung ang diin ay sa paglalantad ng ulo o sa pagpapabaya sa buhok. Pinili ang saling nakatuon sa buhok, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang 'kapulungan' para sa tipunang bayan ng Israel at 'sambahayan ng Israel' para sa pormulang pambansa at tipanan. Ang mga panghalip ay malinaw at hindi labis na nagpapaliwanag sa implicit na paksa ng Hebreo.
