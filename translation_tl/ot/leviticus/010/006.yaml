  - severity: low
    issue: “magulo at nakalugay”
    rationale: Ang “magulo” ay dagdag na paglalarawan na hindi kailangang ipahayag ng pandiwang Hebreo. Sapat at mas tumpak ang “nakalugay,” habang ang talababa ang nagpapaliwanag sa idiom.
  - severity: low
    issue: Pagkakabuo ng babalang bunga
    rationale: Ang “baka kayo mamatay at magalit siya” ay mas likas na Filipino para sa babalang “lest,” nang pinananatili ang implicit na personal na paksa ng ikalawang pandiwa.
