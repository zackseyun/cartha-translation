  to: Sinabi ni Moises kay Aaron at sa kanyang mga anak na sina Eleazar at Itamar, “Huwag ninyong pabayaang nakalugay ang inyong buhok[a], at huwag ninyong punitin ang inyong mga damit, baka kayo mamatay at magalit siya sa buong kapulungan. Ngunit ang inyong mga kapatid—ang buong sambahayan ng Israel—ay iiyak dahil sa pagkasunog na idinulot ni Yahweh.[b]”
