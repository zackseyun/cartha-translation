base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: tl
  text: Kainin ninyo iyon sa isang banal na lugar, sapagkat iyon ang bahaging nauukol sa iyo at ang bahaging nauukol sa iyong mga anak na lalaki mula sa mga handog na pinaraan sa apoy para kay Yahweh. Sapagkat gayon ang iniutos sa akin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: Kakainin ninyo
  rationale: Ang pandiwa ay tumutukoy sa maramihang lalaking kausap at, sa kontekstong ito ng tagubilin, likas na naihahayag sa Filipino sa anyong pautos na “Kakainin ninyo.”
- source_word: אֹתָהּ
  choice: iyon
  rationale: Ang panghalip na pambabaeng isahan ay tumutukoy sa bahaging handog na tinalakay sa naunang talata; natural sa Filipino ang “iyon.”
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang pantukoy ang parirala sa Hebreo. Pinananatili ng “isang banal na lugar” ang di-tiyak na anyo at ang panrelihiyong diwa ng קָדֹשׁ nang hindi ito ginagawang pangalan ng isang partikular na silid ng santuwaryo.
- source_word: חָקְךָ ... וְחָק בָּנֶיךָ
  choice: bahaging nauukol sa iyo at sa iyong mga anak na lalaki
  rationale: Sa kontekstong pangpari, ang חֹק ay nakatalagang bahagi o karapatan mula sa handog. Nililinaw ng “bahaging nauukol” ang konkretong kahulugan, at pinananatili ang “mga anak na lalaki” dahil iyon ang tahasang tinutukoy ng Hebreo.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: mula sa mga handog na pagkain para kay Yahweh
  rationale: Ang אִשֶּׁה ay teknikal na katawagan sa uri ng handog na inihaharap kay Yahweh. Ang “mga handog na pagkain” ay madaling maunawaan at hindi nagpapahiwatig na kailangang matupok sa apoy ang buong handog; inilagay sa talababa ang mas literal at tradisyonal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: Sapagkat gayon ang iniutos sa akin
  rationale: Pinananatili nito ang paliwanag na ugnayan ng כִּי, ang diwa ng כֵן na “gayon,” at ang balintiyak na anyo ng pandiwa nang hindi tahasang idinaragdag kung sino ang nag-utos.
theological_decisions:
- issue: Kahulugan ng חֹק sa kontekstong pangpari
  choice: bahaging nauukol
  alternative: tuntunin; nakatalagang bahagi
  rationale: Ang pinag-uusapan ay ang bahaging karapat-dapat tanggapin ng mga pari mula sa handog, hindi lamang isang abstraktong batas. Hindi rin ito pinalalawak tungo sa isang doktrina ng mana.
- issue: Paglalarawan sa אִשֵּׁי יְהוָה
  choice: mga handog na pagkain para kay Yahweh
  alternative: mga handog na pinaraan sa apoy para kay Yahweh
  rationale: May leksikal na tensiyon sa pagitan ng tradisyonal na kaugnayan nito sa apoy at ng gamit nitong katawagan sa handog para sa Diyos. Pinili sa teksto ang malinaw na modernong parirala at pinanatili sa talababa ang mas literal na pagbasa.
- issue: Tinutukoy ng “iyong mga anak”
  choice: iyong mga anak na lalaki
  alternative: iyong mga anak
  rationale: Ang בָּנֶיךָ ay tahasang tumutukoy sa mga anak na lalaki ni Aaron sa kontekstong pangpari; ang neutral na “mga anak” ay maaaring magkubli sa espesipikong tinutukoy ng teksto.
- issue: Hindi binanggit na tagapag-utos sa hulíng sugnay
  choice: iniutos sa akin
  alternative: iniutos sa akin ng Diyos
  rationale: Balintiyak ang Hebreo at hindi tahasang pinapangalanan ang gumawa ng utos. Bagaman malinaw sa konteksto na mula sa Diyos ang utos, hindi ito idinagdag sa mismong salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ninyo” sa utos sa maramihang kausap, ngunit “iyo” at “iyong” sa nakatalagang bahagi ni Aaron, alinsunod sa pagbabago mula pangmaramihan tungo sa pang-isahan sa Hebreo. Inilagay ang pananda ng talababa pagkaraan ng pariralang aktuwal nitong ipinapaliwanag.
