- from: At huwag kayong lalabas mula sa pasukan ng toldang tipanan, kung hindi ay mamamatay kayo, sapagkat nasa inyo ang langis na pampahid ni Yahweh.” At ginawa nila ang ayon sa sinabi ni Moises.
  to: At huwag kayong lalabas mula sa pasukan ng tolda ng tipanan, kung hindi ay mamamatay kayo, sapagkat nasa ibabaw ninyo ang langis na pampahid ni Yahweh.” At ginawa nila ayon sa sinabi ni Moises.
  rationale: Inayos ang pariralang tumutukoy sa lokasyon ng langis upang maipakita ang konkretong “nasa ibabaw ninyo” ng Hebreo, at inayos ang dalawang konstruksyong Filipino para sa mas natural na modernong gamit nang hindi binabago ang saklaw o puwersa ng utos.
