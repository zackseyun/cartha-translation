base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: tl
  text: At huwag kayong lalabas mula sa pasukan ng tolda ng tipanan, kung hindi ay mamamatay kayo, sapagkat nasa ibabaw ninyo ang langis na pampahid ni Yahweh.” At ginawa nila ayon sa sinabi ni Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: At ... mula sa pasukan
  rationale: Pinananatili ng “At” ang ugnayan sa naunang tagubilin, at natural na katumbas ng פֶּתַח ang “pasukan” sa konteksto ng santuwaryo.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ang parirala ay katawagan sa santuwaryong tolda kung saan nakikipagtagpo si Yahweh sa Israel; malinaw at kinikilalang salin sa modernong Filipino ang “toldang tipanan.”
- source_word: לֹא תֵצְאוּ
  choice: huwag kayong lalabas
  rationale: Tuwirang ipinahahayag nito ang pagbabawal sa maramihang kausap sa natural na modernong Tagalog.
- source_word: פֶּן תָּמֻתוּ
  choice: kung hindi ay mamamatay kayo
  rationale: Ipinahahayag ng פֶּן ang bantang kahihinatnan. Mas natural sa pangkaraniwang modernong Filipino ang “kung hindi ay mamamatay kayo” kaysa sa mas pormal na “baka kayo mamatay.”
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan sa pagbabawal; ang “sapagkat” ay malinaw, marangal, at angkop sa rehistro.
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: ang langis na pampahid ni Yahweh
  rationale: Tumutukoy ito sa banal na langis ng pagtatalaga na nauukol kay Yahweh. Pinananatili ng “langis na pampahid” ang konkretong larawang nasa Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ang Tetragrammaton sa halip na palitan ng isang titulo.
- source_word: עֲלֵיכֶם
  choice: nasa inyo
  rationale: Natural nitong ipinahahayag na ang langis ng pagtatalaga ay nasa ibabaw ng mga pari, nang hindi nagdaragdag ng interpretasyon.
- source_word: וַיַּעֲשׂוּ
  choice: At ginawa nila
  rationale: Pinauusad nito ang salaysay at malapit na sinusundan ang pandiwang Hebreo.
- source_word: כִּדְבַר מֹשֶׁה
  choice: ang ayon sa sinabi ni Moises
  rationale: Ipinahahayag nito ang pagsunod sa ipinahayag na utos ni Moises sa mas natural na Filipino kaysa sa literal na “ayon sa salita ni Moises.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasan sa teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng langis na nasa mga pari
  choice: nasa inyo ang langis na pampahid ni Yahweh
  alternative: sumasainyo ang pagpapahid ni Yahweh
  rationale: Pinananatili ng salin ang konkretong pagtukoy ng Hebreo sa langis at hindi ito ginagawang abstraktong “pagpapahid,” habang iniiwang bukas ang buong teolohikal na kabuluhan ng kanilang pagtatalaga.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pangmaramihang “kayo” ayon sa mga pandiwang Hebreo. Iniwasan ang labis na literal na mga pariralang hindi natural sa Filipino, ngunit pinanatili ang solemne at mahigpit na tono ng utos.
