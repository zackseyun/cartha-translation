  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Moises kay Aaron at kina Eleazar at Itamar, ang natitira niyang mga anak: “Kunin ninyo ang natitirang handog na butil mula sa mga handog para kay Yahweh na iniaalay sa apoy[a], at kainin ninyo ito nang walang lebadura sa tabi ng altar, sapagkat ito ay napakabanal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas maluwag, “mula sa mga handog na pagkain ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi ni Moises
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” bilang panandang pagkakasunod-sunod.
- source_word: הַנּוֹתָרִים
  choice: natitira nitong mga anak
  rationale: Tinutukoy nito sina Eleazar at Itamar bilang mga anak ni Aaron na naiwan pagkamatay nina Nadab at Abihu, nang hindi dinaragdagan ang teksto ng mas interpretatibong “nakaligtas.”
- source_word: הַמִּנְחָה
  choice: handog na butil
  rationale: Sa kontekstong Levitico, ang מִנְחָה ay tiyak na handog mula sa ani o butil, hindi lamang pangkalahatang handog.
- source_word: הַנּוֹתֶרֶת
  choice: natitirang
  rationale: Inilalarawan nito ang bahaging naiwan ng handog na butil matapos maihandog ang bahagi para kay Yahweh.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: mula sa mga handog na pagkain ni Yahweh
  rationale: Ipinahahayag nito sa likas na Tagalog ang mga handog na inihahain kay Yahweh, habang inilalagay sa talababa ang mas pormal na saling nagpapanatili sa larawan ng apoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: kainin ninyo iyon nang walang lebadura
  rationale: Ang מַצּוֹת ay nagsasaad dito kung paano kakainin ang handog; malinaw at natural ang “nang walang lebadura.”
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: sa tabi ng altar
  rationale: Tumpak na ipinahahayag ang lapit na tinutukoy ng אֵצֶל nang hindi ipinahihiwatig na nakadikit ito sa altar.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: napakabanal
  rationale: Ang inuulit na anyo ay Hebreong paraan ng pagpapahayag ng pinakamataas na antas. Iniiwasan ng “napakabanal” na mapagkamalan itong pangalan ng isang bahagi ng santuwaryo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang tipanang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Antas ng kabanalan sa pariralang קֹדֶשׁ קָדָשִׁים
  choice: napakabanal
  alternative: kabanal-banalan
  rationale: Parehong maipahahayag ang Hebreong pasukdol, ngunit mas malinaw na inilalapat ng “napakabanal” ang katangian sa handog at hindi sa silid na kilala bilang Kabanal-banalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” “handog na butil,” at “lebadura” bilang karaniwang nauunawaang bokabularyong panrelihiyon. Inilipat ang panandang [a] sa pariralang talagang nililinaw ng talababa.
