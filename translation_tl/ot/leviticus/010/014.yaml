id: LEV.10.14
reference: Leviticus 10:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: tl
  text: Kainin ninyo—ikaw, ang iyong mga anak na lalaki, at ang iyong mga anak na babae na kasama mo—sa isang malinis na lugar ang dibdib ng handog na iwinagayway[a] at ang hita ng handog na itinaas[b], sapagkat ang mga iyon ay ibinigay bilang takdang bahagi mo at takdang bahagi ng iyong mga anak na lalaki mula sa mga haing pangkapayapaan[c] ng mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang dibdib ng handog na iniharap.” Ang terminong Hebreo ay tumutukoy sa bahaging ritwal na iwinagayway sa harap ng PANGINOON.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang hita ng handog na ibinukod.” Sa literal, tumutukoy ang terminong Hebreo sa isang bagay na iniangat o ibinukod bilang takdang bahagi ng pari.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga hain para sa pakikipag-isa.” Maaaring saklawin ng terminong Hebreo ang kapayapaan, kabuuan, o mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: ang dibdib na iwinagayway bilang handog
  rationale: Ang חֲזֶה ay ang bahaging dibdib ng hayop, at ang תְּנוּפָה ay tumutukoy sa ritwal na pagwagayway o paghaharap nito sa harap ng PANGINOON. Ginawang pandiwang parirala ang teknikal na katawagan upang maging malinaw sa karaniwang mambabasa.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: ang hitang ibinigay bilang handog
  rationale: Ang שׁוֹק ay hita o itaas na bahagi ng paa. Ang תְּרוּמָה ay isang bagay na iniaangat, inihahandog, o ibinubukod bilang takdang bahagi ng pari; pinili ang likas na pariralang Filipino habang inilalagay sa talababa ang literal na ritwal na larawan.
- source_word: תֹּאכְלוּ
  choice: kakainin ninyo
  rationale: Ang imperfect ay may puwersang tagubilin sa kontekstong legal. Ang anyong Filipino ay nagpapahayag ng iniatas na pagkilos nang hindi gumagamit ng hindi likas na legalismong pananalita.
- source_word: בְּמָקוֹם טָהוֹר
  choice: sa isang malinis na lugar
  rationale: Ang טָהוֹר sa Levitico ay may ritwal na diwa, ngunit hindi kailangang idagdag sa pangunahing teksto ang salitang “seremonyal,” sapagkat malinaw ito sa konteksto.
- source_word: אַתָּה וּבָנֶיךָ וּבְנֹתֶיךָ אִתָּךְ
  choice: ikaw, ang iyong mga anak na lalaki, at ang iyong mga anak na babae na kasama mo
  rationale: Pinananatili ang tahasang pagbanggit sa mga anak na lalaki at babae, pati ang “kasama mo,” ayon sa Hebreo.
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: takdang bahagi mo at takdang bahagi ng iyong mga anak na lalaki
  rationale: Sa kontekstong ito ang חֹק ay hindi lamang batas kundi ang itinakdang karapatan o bahagi ng mga pari. Ang “takdang bahagi” ang malinaw at angkop na katumbas.
- source_word: נִתְּנוּ
  choice: ibinigay
  rationale: Ang passive perfect ay nagsasaad ng naitatag nang pagkakaloob; sapat na ipinahahayag ito ng aspektong Filipino sa “ibinigay.”
- source_word: מִזִּבְחֵי שַׁלְמֵי
  choice: mula sa mga haing handog para sa kapayapaan
  rationale: Pinananatili ng “kapayapaan” ang malawak na saklaw ng שְׁלָמִים—kapayapaan, kabuuan, at mabuting kalagayan—nang hindi ito nililimitahan sa pakikisama lamang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal at karaniwang biblikal na ekspresyong panlahi ng Hebreo sa halip na gawing mas malawak na “mga Israelita.”
theological_decisions:
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikipag-isa
  rationale: Ang “pakikipag-isa” ay posibleng bunga o aspekto ng handog ngunit mas makitid kaysa sa semantikong saklaw ng salitang Hebreo. Pinananatili ng “kapayapaan” ang kaugnayan nito sa kabuuan at mabuting kalagayan.
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyong pangkaanak ng orihinal habang nauunawaan itong kolektibong katawagan sa bayan ng Israel, hindi lamang pahayag tungkol sa agarang mga anak na lalaki.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang ayos ng pangungusap ay inayos para sa likas na daloy sa Tagalog, habang pinananatili ang lahat ng kalahok, ang ritwal na kalinisan, at ang mga teknikal na pagkakaiba ng dalawang bahaging inihandog.
