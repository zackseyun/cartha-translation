revisions:
- from: At kakainin ninyo—ikaw, ang iyong mga anak na lalaki, at ang iyong mga anak na babae na kasama mo—sa isang malinis na lugar ang dibdib na iwinagayway bilang handog[a] at ang hitang ibinigay bilang handog[b]. Sapagkat ang mga iyon ay ibinigay bilang takdang bahagi mo at takdang bahagi ng iyong mga anak na lalaki mula sa mga haing handog para sa kapayapaan[c] ng mga anak ni Israel.
  to: Kainin ninyo—ikaw, ang iyong mga anak na lalaki, at ang iyong mga anak na babae na kasama mo—sa isang malinis na lugar ang dibdib ng handog na iwinagayway[a] at ang hita ng handog na itinaas[b], sapagkat ang mga iyon ay ibinigay bilang takdang bahagi mo at takdang bahagi ng iyong mga anak na lalaki mula sa mga haing pangkapayapaan[c] ng mga anak ni Israel.
  rationale: 'Pinalitan ang mga pariralang naglalarawan sa dalawang ritwal na bahagi upang malinaw na maipakita ang magkaibang terminong Hebreo: ang dibdib ay kaugnay ng pagwagayway, at ang hita ay kaugnay ng pag-angat o paglalaan. Ginawang “mga haing pangkapayapaan” ang construct chain para sa mas likas na Filipino nang hindi binabago ang kahulugan. Ang lahat ng kalahok, ang ritwal na kalinisan, at ang mga itinakdang bahaging para sa pari at sa kanyang mga anak na lalaki ay pinanatili.'
