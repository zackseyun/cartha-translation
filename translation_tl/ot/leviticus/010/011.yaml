  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: tl
  text: at ituro sa mga anak ni Israel ang lahat ng tuntuning sinabi sa kanila ni Yahweh sa pamamagitan ng kamay ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sa pamamagitan ni Moises.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: at ituro
  rationale: Ipinagpapatuloy ng pang-ugnay at infinitibong Hiphil ang mga tungkulin ng mga pari mula sa naunang talata. Likas at malinaw sa modernong Filipino ang “ituro.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang larawan ng Hebreong parirala habang likas na tumutukoy sa buong bayang tipan; sa Filipino, hindi kailangang tukuyin ang kasarian ng “mga anak.”
- source_word: כָּל הַחֻקִּים
  choice: lahat ng tuntunin
  rationale: Ang חֻקִּים ay mga itinakdang kautusan o batas. Ang “mga tuntunin” ay malinaw, marangal, at angkop sa kontekstong legal at tipan.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: sinabi sa kanila ni Yahweh
  rationale: Tuwirang ipinapahayag nito na si Yahweh ang nagsalita at na ang Israel ang pinatutungkulan, nang hindi dinaragdagan ang aspektong hindi tahasang minamarkahan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ng kamay ni Moises
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang diwa ng pamamagitan ni Moises; ibinibigay sa talababa ang mas likas na alternatibo.
theological_decisions:
- issue: Paglalahad sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng “mga anak ni Israel” ang pampamilyang pahayag ng orihinal at maaari itong tumukoy nang sama-sama sa bayang Israel nang hindi nilulutas o nililimitahan ang saklaw nito.
- issue: Idyoma ng pamamagitan sa בְּיַד מֹשֶׁה
  choice: sa pamamagitan ng kamay ni Moises
  alternative: sa pamamagitan ni Moises
  rationale: Ang pangunahing teksto ay nagpapanatili sa larawan ng Hebreo; nililinaw ng alternatibo ang idiomatikong kahulugan nang hindi binabago ang papel ni Moises bilang tagapamagitan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang Hebreong pampamilyang katawagan at ang idyomang “sa pamamagitan ng kamay,” habang ang mas likas na Filipino para sa huli ay inilagay sa talababa.
