  to: “Ikaw at ang mga anak mong kasama mo ay huwag kayong uminom ng bino o iba pang nakalalasing na inumin[a] tuwing papasok kayo sa Tolda ng Tipanan, upang hindi kayo mamatay[b]. Ito ay tuntuning panghabang-panahon sa lahat ng inyong salinlahi.”
