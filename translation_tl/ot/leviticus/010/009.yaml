  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: tl
  text: “Ikaw at ang mga anak mong kasama mo ay huwag kayong uminom ng bino o iba pang nakalalasing na inumin[a] tuwing papasok kayo sa Tolda ng Tipanan, upang hindi kayo mamatay[b]. Ito ay tuntuning panghabang-panahon sa lahat ng inyong salinlahi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa nakalalasing na inumin bukod sa bino.
    reason: lexical_alternative
  - marker: b
    text: 'O: “at hindi kayo mamamatay.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: bino
  rationale: Tiyak itong tumutukoy sa alak na mula sa ubas. Pinananatili ng “bino” ang kaibahan nito sa kasunod na mas malawak na uri ng nakalalasing na inumin.
- source_word: שֵׁכָר
  choice: iba pang nakalalasing na inumin
  rationale: Malawak ang saklaw ng salitang Hebreo sa mga inuming may alkohol bukod sa bino; mas tumpak ito kaysa “matapang na inumin,” na maaaring magpahiwatig lamang ng mataas na antas ng alkohol.
- source_word: אַל תֵּשְׁתְּ
  choice: huwag kayong iinom
  rationale: Likas na makabagong Tagalog para sa mariing pagbabawal na ipinahahayag ng אַל at ng anyong pandiwa.
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: Ikaw at ang mga anak mong kasama mo
  rationale: Pinananatili ang tuwirang pagtukoy kay Aaron at ang tahasang pagsama sa kaniyang mga anak.
- source_word: בְּבֹאֲכֶם
  choice: kapag pumapasok kayo
  rationale: Ipinahahayag ang panahong saklaw ng pagbabawal nang hindi ito pinalalawak sa lahat ng pagkakataon.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Pamilyar at marangal na tawag sa santuwaryong itinakda bilang lugar ng pakikipagtagpo; ang malaking titik ay nagpapakitang natatanging pangalan ito.
- source_word: וְלֹא תָמֻתוּ
  choice: upang hindi kayo mamatay
  rationale: Malinaw na ipinakikita ang kamatayang dapat maiwasan sa pagsunod sa pagbabawal, habang hindi labis na tinutukoy ang eksaktong lohikal na ugnayan ng sugnay.
- source_word: חֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  rationale: Natural at dignified na legal na pananalita na pinananatili ang matagalang bisa ng kautusan.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahahayag ang patuloy na bisa nito sa magkakasunod na salinlahi.
theological_decisions:
- issue: Saklaw ng pagbabawal
  choice: Iniuugnay ang pagbabawal sa pagpasok sa Toldang Tipanan.
  alternative: Ganap na pagbabawal sa mga pari na uminom sa lahat ng pagkakataon.
  rationale: Nililimitahan ng בְּבֹאֲכֶם ang utos ayon sa pagkakataon; hindi dapat magdagdag ang salin ng mas malawak na aral tungkol sa lubos na pag-iwas sa alkohol.
- issue: Diwa ng sugnay tungkol sa kamatayan
  choice: “upang hindi kayo mamatay”
  alternative: “at hindi kayo mamamatay”
  rationale: Maaaring basahin ang pagkakasunod ng mga sugnay bilang layunin o bilang kasunod na resulta. Ginagawang malinaw ng pangunahing salin ang babalang mapaiwas, habang inilalahad sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bino” upang hindi mapaghalo ang יַיִן sa mas malawak na kahulugan ng karaniwang salitang “alak,” at pinanatili ang legal na himig nang hindi nagiging lipas o labis na pormal.
