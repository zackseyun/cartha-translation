  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: tl
  text: Tingnan ninyo, ang dugo nito ay hindi ipinasok sa loob ng santuwaryo.[a] Dapat sana ay talagang kinain ninyo ito sa banal na lugar,[b] ayon sa iniutos ko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papasok sa banal na dako.” Ang Hebreo ay gumagamit ng katawagan para sa sagradong pook kasama ng salitang “sa loob,” na nagbibigay-diin sa panloob na bahagi ng santuwaryo.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “kumain” upang idiin ang utos: “dapat sana ay talagang kinain ninyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Likas na panawag-pansin sa makabagong Filipino na nagpapanatili sa mariing puwersa ng Hebreo.
- source_word: לֹא הוּבָא אֶת דָּמָהּ
  choice: ang dugo nito ay hindi ipinasok
  rationale: Pinananatili ang pasibong anyo ng Hophal ng בוא at ang pagtukoy ng pambabaeng hulapi sa handog na hayop.
- source_word: אֶל הַקֹּדֶשׁ פְּנִימָה
  choice: sa loob ng santuwaryo
  rationale: Ang 'santuwaryo' ay malinaw na tumutukoy sa sagradong pook, at ang 'sa loob' ay tahasang kumakatawan sa פְּנִימָה nang hindi labis na tinutukoy ang eksaktong bahaging ritwal.
- source_word: אָכוֹל תֹּאכְלוּ
  choice: Dapat sana ay talagang kinain ninyo
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa pandiwa; sa konteksto ng pagsaway sa hindi nagawang utos, natural itong ipinahahayag bilang mariing obligasyong nakaraan.
- source_word: אֹתָהּ
  choice: ito
  rationale: Tumutukoy sa handog o sa laman nito; sapat at natural ang panghalip dahil malinaw ang tinutukoy sa konteksto.
- source_word: בַּקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Pinananatili ang terminolohiyang ritwal at inihihiwalay ito sa naunang pananalitang tumutukoy sa loob ng santuwaryo.
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: ayon sa iniutos ko
  rationale: Direkta at natural na salin ng sugnay na tumutukoy sa naunang utos ni Moises.
theological_decisions:
- issue: Terminolohiya para sa mga sagradong pook
  choice: Ipinagkaiba ang 'sa loob ng santuwaryo' at 'sa banal na lugar.'
  alternative: Isalin ang dalawang parirala bilang 'sa banal na lugar,' o gawing mas tiyak ang una bilang 'sa loob ng tabing.'
  rationale: Magkaugnay ngunit hindi magkapareho ang mga pariralang Hebreo. Ang una ay may direksiyon papasok at may פְּנִימָה; ang ikalawa ay lugar na itinakda para sa pagkain. Pinananatili ng pagkakaibang ito ang lohika ng ritwal nang hindi nagdaragdag ng detalyeng wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang 'ninyo' dahil maramihan ang mga anyong pandiwa sa Hebreo. Ang 'dapat sana' ay natural na naghahayag ng obligasyong hindi natupad, samantalang ang 'talagang' ay nagpapanatili sa diin ng Hebreong infinitive absolute.
