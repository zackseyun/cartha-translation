  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: tl
  text: Mananatili siya sa iyo bilang isang upahang manggagawa, bilang isang naninirahang dayuhan; maglilingkod siya sa iyo hanggang sa taon ng Jubileo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: gaya ng isang upahang manggagawa
  rationale: Ang שָׂכִיר ay manggagawang inuupahan kapalit ng sahod. Malinaw sa modernong Filipino ang “upahang manggagawa” at ipinakikita nitong hindi alipin ang tinutukoy.
- source_word: כְּתוֹשָׁב
  choice: gaya ng isang dayuhang naninirahan sa inyo
  rationale: Ang תוֹשָׁב ay isang hindi katutubong naninirahan sa gitna ng Israel. Inilalahad ng parirala ang panlipunan at legal na katayuan nito nang natural sa Filipino.
- source_word: יִהְיֶה עִמָּךְ
  choice: Ituturing siyang kasama mo
  rationale: Literal itong “siya ay magiging kasama mo,” ngunit sa konteksto ay inilalarawan ang katayuan at pakikitungo sa kanya. Ang “ituturing siyang kasama mo” ay natural at pinananatili ang ugnayang ipinahihiwatig ng עִמָּךְ.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: hanggang sa taon ng Jubileo
  rationale: Ito ang natatanging tawag sa taon ng paglaya at pagsasauli sa Levitico 25. Ang “Jubileo” ay kinikilalang terminong biblikal sa Filipino.
- source_word: יַעֲבֹד עִמָּךְ
  choice: maglilingkod siyang kasama mo
  rationale: Maaaring mangahulugan ang עבד na “maglingkod” o “magtrabaho.” Pinananatili ng “maglilingkod siyang kasama mo” ang inuulit na עִמָּךְ at hindi pinalalabis ang kapangyarihan ng amo sa kontekstong nagbabawal na tratuhin siya bilang alipin.
theological_decisions:
- issue: Katayuan ng Israelitang napilitang maglingkod dahil sa kahirapan
  choice: Inilarawan siya bilang upahang manggagawa at dayuhang naninirahan, hindi bilang alipin.
  alternative: Isalin ang gawain sa paraang maaaring magpahiwatig ng karaniwang pagkaalipin.
  rationale: Malinaw na ibinubukod siya ng agarang konteksto (Lev 25:39–43) sa katayuan ng alipin at itinatakdang pansamantala ang paglilingkod niya hanggang sa Jubileo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “dayuhang naninirahan sa inyo” sa halip na mas lumang “nakikipamayan,” at pinanatili ang legal na diin ng talata nang hindi nagdaragdag ng denominasyonal na paliwanag.
