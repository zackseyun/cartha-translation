  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: tl
  text: Kung maging maunlad ang kabuhayan ng isang dayuhang naninirahan sa piling ninyo, at maghirap ang kapatid mong kapiling niya at ipagbili niya ang kanyang sarili sa dayuhang naninirahan sa piling ninyo, o sa isang miyembro ng angkan ng dayuhan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ugat o sangay ng angkan ng isang dayuhang naninirahan.” Mahirap tiyakin ang kahulugan ng pariralang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: yumaman
  rationale: Ang idyomang literal na ‘maabot ng kamay’ ay tumutukoy sa pagkakaroon ng sapat na kakayahang pangkabuhayan. Ang ‘yumaman’ ay maikli, natural, at malinaw na kabaligtaran ng kasunod na paghihirap.
- source_word: גֵּר וְתוֹשָׁב
  choice: dayuhang naninirahang kasama ninyo
  rationale: Pinagsasama ng parirala ang pagiging hindi katutubo at ang aktuwal na paninirahan sa pamayanan. Iniiwasan nito ang maling diwang isa lamang siyang nagdaraan.
- source_word: וּמָךְ
  choice: maghirap
  rationale: Ipinahihiwatig ng pandiwa ang paglagpak sa karalitaan; natural itong ipinapahayag sa Filipino bilang ‘maghirap.’
- source_word: אָחִיךָ
  choice: kapatid mo
  rationale: Pinananatili ang tahasang wikang pampamilya at ang etikal na puwersa nito; sa konteksto, tumutukoy ito sa kapwa Israelita.
- source_word: עִמּוֹ
  choice: kapiling niya
  rationale: Ipinakikita nito ang kaugnayan o pagiging nasa tabi ng maunlad na dayuhan nang hindi nagpapasok ng mas tiyak na relasyong wala sa teksto.
- source_word: וְנִמְכַּר
  choice: ipagbili nito ang kanyang sarili
  rationale: Bagaman maaaring basahing pasibo ang anyo, sa kontekstong legal at pangkabuhayan ay tumutukoy ito sa pagpasok ng taong naghirap sa paglilingkod sa pamamagitan ng pagbebenta sa sarili.
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: sa isang miyembro ng angkan ng dayuhan
  rationale: Mahirap tiyakin ang eksaktong diwa ng עֵקֶר dito. Ang saling ito ay nagbibigay ng malamang na kahulugan sa natural na Filipino, habang inilalahad sa talababa ang mas literal na mga posibilidad.
theological_decisions:
- issue: Wikang pampamilya para sa kasapi ng Israel sa batas panlipunan
  choice: kapatid mo
  alternative: kapwa Israelita; kamag-anak mo
  rationale: Pinananatili nito ang talinghagang pampamilya ng tekstong Hebreo at hindi pinapaliit ang ugnayan tungo sa isang purong katawagang sibiko.
- issue: Uri ng pagbebentang tinutukoy ng וְנִמְכַּר
  choice: ipagbili nito ang kanyang sarili
  alternative: maipagbili siya
  rationale: Pinahihintulutan ng legal na konteksto ang refleksibong diwa ng pagbebenta ng sarili dahil sa kahirapan, ngunit hindi dinaragdagan ang teksto ng partikular na doktrina tungkol sa institusyong iyon.
translation_notes:
  register: Makabago at marangal na Filipino, na gumagamit ng karaniwang bokabularyo. Pinanatili ang ‘kapatid’ at ang pagiging dayuhang naninirahan, habang ginawang idiomatiko ang Hebreong pananalitang pangkabuhayan. Inilagay ang talababa sa mismong mahirap na pariralang tinutukoy nito.
