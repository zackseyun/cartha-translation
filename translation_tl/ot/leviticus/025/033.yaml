base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: tl
  text: At kung tutubusin ito ng isa sa mga Levita, ang naipagbiling bahay sa lungsod na kanyang pag-aari ay babalik sa Jubileo[a]; sapagkat ang mga bahay sa mga lungsod ng mga Levita ay kanilang pag-aari sa gitna ng mga anak ni Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lalabas” sa Jubileo; ibig sabihin, ang naipagbiling ari-arian ay aalis mula sa pag-aari ng bumili at babalik.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel,” isang karaniwang tipanang katawagan para sa bayan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: At kung tutubusin ito ng isa sa mga Levita
  rationale: Binabasa ang מִן bilang partitive—‘isa sa mga Levita’—na angkop sa legal na kondisyon. Ang ‘tutubusin’ ay nagpapanatili sa teknikal na diwa ng גאל bilang pagbawi ng ari-arian sa pamamagitan ng karapatang tumubos.
- source_word: וְיָצָא מִמְכַּר בַּיִת
  choice: ang naipagbiling bahay … ay babalik
  rationale: Ang יָצָא ay literal na ‘lalabas,’ ngunit sa batas ng Jubileo ay tumutukoy sa pag-alis ng ari-arian sa kamay ng bumili at pagbabalik nito. Ang מִמְכַּר ay maaaring tumukoy sa bagay na ipinagbili, kaya natural ang ‘naipagbiling bahay.’
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: sa lungsod na kanyang pag-aari
  rationale: Ang Hebreo ay siksik at maaaring unawain bilang bahay na nasa lungsod ng kanyang pag-aari. Pinananatili ng salin ang ugnayan sa pag-aari nang hindi labis na nagpapaliwanag.
- source_word: בַּיֹּבֵל
  choice: sa Jubileo
  rationale: Teknikal na katawagan ito sa itinakdang panahon ng pagpapalaya at pagbabalik ng mga pag-aari.
- source_word: בָתֵּי עָרֵי הַלְוִיִּם
  choice: ang mga bahay sa mga lungsod ng mga Levita
  rationale: Natural sa Filipino at malinaw na ang tinutukoy ay mga bahay na matatagpuan sa mga lungsod na ukol sa mga Levita.
- source_word: הִוא אֲחֻזָּתָם
  choice: ang kanilang pag-aari
  rationale: Ang אֲחֻזָּה ay isang legal na hawak o minanang pag-aari; sapat na malinaw dito ang ‘pag-aari’ nang hindi dinaragdagan ang teksto.
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: sa gitna ng mga anak ni Israel
  rationale: Pinananatili ang tradisyonal at tipanang pahayag na בְּנֵי יִשְׂרָאֵל, habang natural pa rin sa marangal na Filipino.
theological_decisions:
- issue: Pagbasa sa מִן הַלְוִיִּם
  choice: isa sa mga Levita
  alternative: mula sa mga Levita
  rationale: 'Ang partitive na pagbasa ang nagbibigay ng maayos na paksa sa pandiwa: isang Levita ang tumutubos. Ang ‘mula sa mga Levita’ ay maaaring magpahiwatig na ibang tao ang tumutubos ng ari-arian mula sa kanila.'
- issue: Saklaw ng ‘mga anak ni Israel’
  choice: mga anak ni Israel
  alternative: bayan ng Israel / mga Israelita
  rationale: Pinananatili ang pormal na tipanang katawagan ng Hebreo at hindi ginagawang tahasang neutral ang anyo.
- issue: Legal na epekto ng וְיָצָא
  choice: babalik
  alternative: palalayain / lalabas
  rationale: Ipinahahayag ng ‘babalik’ ang pagbalik ng ipinagbiling ari-arian sa Jubileo, ngunit inilalagay sa talababa ang literal na larawan upang mapanatili ang leksikal na tensiyon.
translation_notes:
  register: Modernong Filipino na may marangal at legal na himig. Ginamit ang ‘Jubileo,’ ‘tutubusin,’ at ‘pag-aari’ bilang malinaw na mga terminong angkop sa konteksto ng batas. Ang mga talababa ay minarkahan sa mismong teksto.
