base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: tl
  text: Ngunit kung ang isang tao ay walang tagatubos[a], at umunlad ang kanyang kabuhayan at nagkaroon siya ng halagang sapat upang matubos ang kanyang lupa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kamag-anak na tagatubos.” Ang Hebreong גֹּאֵל ay madalas tumukoy sa malapit na kamag-anak na may tungkulin o karapatang tubusin ang ari-arian ng pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: Ngunit kung ang isang tao
  rationale: Naghaharap ito ng kasong kondisyonal na kasalungat ng naunang sitwasyon. Pinananatili ng “isang tao” ang panlalaking isahan ng אִישׁ.
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: ay walang tagatubos
  rationale: Ang גֹּאֵל dito ay malapit na kamag-anak na may karapatan o tungkuling tubusin ang naipagbiling lupa ng pamilya. Maikli at likas sa Tagalog ang “tagatubos,” habang nililinaw ng talababa ang ugnayang pampamilya.
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: at nagkaroon siya ng sapat na kakayahan
  rationale: Literal na “umabot ang kanyang kamay,” isang idyomang tumutukoy sa pagkakaroon ng sapat na kakayahang pinansyal. Isinalin ang diwa upang maging malinaw at natural sa makabagong Tagalog.
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: at nakakita ng halagang kailangan upang tubusin ang kanyang lupa
  rationale: Ang מָצָא ay “nakakita/nakasumpong,” at ang כְּדֵי ay nagsasaad ng sapat na halaga. Sa batas na ito, ang גְאֻלָּה ay pagtubos sa naipagbiling ari-arian; idinagdag ang “lupa” upang luminaw ang tinutukoy na bagay mula sa konteksto.
theological_decisions:
- issue: Ang tinutukoy ng hulaping panlalaki sa גְאֻלָּתוֹ
  choice: upang tubusin ang kanyang lupa
  alternative: para sa kanyang pagtubos
  rationale: Sa konteksto ng Levitico 25:25–28, ang usapin ay ang pagtubos sa lupang naipagbili, hindi ang espirituwal o personal na pagtubos sa may-ari. Nililinaw ito ng salin nang hindi nagdaragdag ng doktrinang wala sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na legal na pananalita. Isinalin sa likas na Tagalog ang idyomang “umabot ang kanyang kamay,” samantalang pinanatili ang teknikal na katawagang “tagatubos” at ipinaliwanag ito sa talababa.
