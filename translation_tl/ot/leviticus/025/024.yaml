    issue: Ang “pahihintulutan ninyong tubusin ang lupain” ay nagpapaliit sa saklaw ng utos tungo sa simpleng pahintulot.
    rationale: Ang Hebreong תִּתְּנוּ גְּאֻלָּה ay literal na nag-uutos na magbigay o maglaan ng pagtubos para sa lupain. Maaaring kasama sa legal na diwa ang karapatan o pahintulot, ngunit hindi kailangang iyon lamang ang ipahayag sa pangunahing teksto.
