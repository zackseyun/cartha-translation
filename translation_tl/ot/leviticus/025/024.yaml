  text: וּ/בְ/כֹ֖ל אֶ֣רֶץ אֲחֻזַּתְ/כֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָ/אָֽרֶץ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/024.yaml
  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: tl
  text: At sa lahat ng lupaing pag-aari ninyo[a], maglalaan kayo ng pagtubos para sa lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pag-aari” rito ay tumutukoy sa lupaing hawak bilang bahagi ng minanang laang lupa sa Israel.
    reason: cultural_note
  - marker: b
    text: O “maglalaan kayo ng karapatang matubos ang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל
  choice: At sa buong
  rationale: Ipinapahayag ang pang-ugnay at ang saklaw ng tuntunin sa natural na modernong Tagalog.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: lupaing pag-aari ninyo
  rationale: Sa kontekstong legal, tumutukoy ito sa lupaing hawak bilang minanang bahagi, hindi sa buong daigdig; malinaw at likas sa Tagalog ang parirala.
- source_word: גְּאֻלָּה
  choice: tubusin
  rationale: Isinasalin ang legal na diwa ng pagbawi sa lupang naipagbili sa pamamagitan ng kaukulang bayad, nang hindi ipinapasok ang ibang teolohikal na gamit ng 'pagtubos.'
- source_word: תִּתְּנוּ
  choice: pahihintulutan ninyo
  rationale: Bagaman literal na 'magbibigay kayo,' sa kontekstong ito ang ipinagkakaloob ay pagkakataon o karapatang tubusin ang lupa; natural itong ipinahahayag sa Tagalog bilang pagpapahintulot.
- source_word: לָאָרֶץ
  choice: ang lupain
  rationale: Ginawang tuwirang layon ng pandiwang 'tubusin' ayon sa natural na sintaks ng Tagalog, habang pinananatili ang reperensiya sa lupa.
theological_decisions:
- issue: Kalikasan ng utos tungkol sa naipagbiling minanang lupain
  choice: Iniuutos na pahintulutan ang pagtubos sa lupaing pag-aari sa loob ng Israel.
  alternative: Maaaring isalin nang mas literal na, 'magbibigay kayo ng pagtubos para sa lupain.'
  rationale: Ipinakikita ng konteksto ng Levitico 25 na ito ay isang legal na probisyon para mabawi ang lupa. Pinananatili ng salin ang utos at ang legal na diwa nang hindi labis na nililinaw kung ito ay laging isang ganap na pansariling karapatan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'lupain' para sa legal at teritoryal na konteksto, at 'pahihintulutang tubusin' upang natural na maipahayag ang probisyon sa pagbawi ng lupa.
