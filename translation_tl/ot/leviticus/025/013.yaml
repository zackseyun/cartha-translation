  yaml_path: translation/ot/leviticus/025/013.yaml
  text: In this Year of Jubilee[a], each of you shall return to his property.
translation:
  language: tl
  text: Sa Taon ng Jubileo na ito, bawat isa sa inyo ay babalik sa kanyang pag-aari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, ang “pag-aari” ay karaniwang tumutukoy sa lupang pag-aari ng pamilya.
    reason: lexical_context
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: Sa Taon ng Jubileo na ito
  rationale: Likas na temporal na salin ang “sa ... taon,” at malinaw na inilalarawan ng “na ito” ang natatanging Taon ng Jubileo sa kontekstong pambatas.
- source_word: תָּשֻׁבוּ אִישׁ
  choice: bawat isa sa inyo ay babalik
  rationale: Ang pandiwa ay ikalawang panauhang maramihan, samantalang ang אִישׁ ay ginagamit nang distributibo. Pinananatili ng parirala ang kapwa kolektibong kausap at indibiduwal na pananagutan sa natural na Tagalog.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: sa kanyang pag-aari
  rationale: Ang אֲחֻזָּה ay isang pag-aari o pag-aaring lupa na hawak ng isang sambahayan. Ang “pag-aari” ay malinaw at hindi labis na nagpapaliwanag sa pangunahing teksto.
theological_decisions:
- issue: Distributibong אִישׁ na nasa anyong panlalaki
  choice: bawat isa sa inyo
  alternative: bawat lalaki
  rationale: Sa Tagalog, likas na naipapahayag ng “bawat isa sa inyo” ang distributibong diwa ng אִישׁ at ang maramihang “kayo” na nakapaloob sa pandiwa. Hindi minamarkahan ng Tagalog ang kasarian sa “kanyang,” kaya hindi kailangang magpasok ng di-likas na panlalaking anyo.
- issue: Saklaw ng אֲחֻזָּה
  choice: pag-aari
  alternative: minanang lupang pag-aari
  rationale: Ipinahihiwatig ng konteksto ng Levitico 25 ang lupang minana ng pamilya, ngunit hindi tahasang taglay ng salita sa talatang ito ang lahat ng paliwanag na iyon. Pinananatili sa talababa ang mas tiyak na kontekstuwal na diwa.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at angkop sa tekstong pambatas. Ginamit ang “Jubileo” bilang nakaugaliang terminong biblikal at ang “bawat isa sa inyo” upang maging natural ang distributibong utos.
