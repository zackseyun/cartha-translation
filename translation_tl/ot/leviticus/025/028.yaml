base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: tl
  text: Ngunit kung wala siyang sapat na halaga upang matubos ito, mananatili ang ipinagbili niya sa pagmamay-ari ng bumili hanggang sa taon ng Jubileo. Sa Jubileo, lalabas ito mula sa pagmamay-ari ng bumili, at babalik siya sa lupaing minana niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at babalik iyon sa kanyang pagmamay-ari.” Maaaring ang ipinagbilíng ari-arian, sa halip na ang nagbenta, ang simuno ng huling pandiwang Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ
  choice: wala siyang sapat
  rationale: Ang pariralang Hebreo ay idyoma na literal na tumutukoy sa kamay na ‘nakasumpong,’ ngunit ang kahulugan dito ay pagkakaroon ng sapat na kakayahan o pananalapi. Isinalin ito nang likas sa makabagong Tagalog.
- source_word: דֵּי הָשִׁיב לוֹ
  choice: sapat na maibayad sa bumili
  rationale: Ang דֵּי ay ‘sapat,’ at sa konteksto ng pagtubos sa lupa, ang הָשִׁיב לוֹ ay tumutukoy sa halagang ibinabalik o ibinabayad sa bumili upang mabawi ang ipinagbili. Ginawang hayag ang ‘sa bumili’ para luminaw ang legal na ugnayan.
- source_word: מִמְכָּרוֹ
  choice: ang ipinagbili niya
  rationale: Maaaring tukuyin ng pangngalan ang pagbebenta o ang bagay na ipinagbili. Ipinakikita ng kasunod na pananatili nito sa bumili at paglaya sa Jubileo na ang ari-ariang ipinagbili ang tinutukoy.
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: sa pag-aari ng bumili
  rationale: Ang literal na ‘sa kamay ng bumili’ ay idyomang Hebreo para sa pagmamay-ari o pagkontrol. Ang ‘sa pag-aari ng bumili’ ay malinaw at natural sa legal na konteksto.
- source_word: שְׁנַת הַיּוֹבֵל
  choice: taon ng Jubileo
  rationale: Tuwirang ipinapahayag nito ang itinakdang taon ng paglaya at pagpapanumbalik sa batas ng Levitico.
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: Sa Jubileo, palalayain iyon
  rationale: Literal na ‘lalabas iyon sa Jubileo.’ Sa legal na konteksto, ang ari-arian ay lumalabas mula sa pag-aari o kapangyarihan ng bumili; malinaw na ipinahahayag ng ‘palalayain’ ang diwang ito nang hindi dinaragdagan ang legal na resulta.
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: at babalik siya sa kanyang minanang ari-arian
  rationale: Ang pandiwa ay panlalaking isahan at malamang na tumutukoy sa nagbenta, na muling babalik sa kanyang namamanang lupain. Ang אֲחֻזָּה ay isang minana o permanenteng pag-aaring lupa, kaya ginamit ang ‘minanang ari-arian.’
theological_decisions:
- issue: Ang tinutukoy na simuno ng וְשָׁב (‘babalik’)
  choice: 'Ang dating may-ari o nagbenta ang simuno: ‘babalik siya sa kanyang minanang ari-arian.’'
  alternative: 'Ang ipinagbilíng ari-arian ang simuno: ‘babalik iyon sa kanyang pag-aari.’'
  rationale: Kapuwa panlalaking isahan sa Hebreo ang maaaring pagtukuyan ng pandiwa. Mas natural sa kabuuang batas ng Jubileo na ang tao ang bumabalik sa kanyang minanang pag-aari, ngunit tunay ang gramatikal na posibilidad ng alternatibong pagbasa kaya pinanatili ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga terminong ‘bumili,’ ‘maibayad,’ at ‘ipinagbili’ para sa madaling maunawaang legal-ekonomikong diwa, habang pinanatili ang ‘Jubileo’ at ‘minanang ari-arian’ bilang mahahalagang katawagan sa konteksto.
