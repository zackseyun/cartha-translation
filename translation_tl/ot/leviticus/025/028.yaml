revisions:
- from: Ngunit kung wala siyang sapat na maibayad sa bumili, mananatili ang ipinagbili niya sa pag-aari ng bumili hanggang sa taon ng Jubileo. Sa Jubileo, palalayain iyon, at babalik siya sa kanyang minanang ari-arian.[a]
  to: Ngunit kung wala siyang sapat na halaga upang matubos ito, mananatili ang ipinagbili niya sa pagmamay-ari ng bumili hanggang sa taon ng Jubileo. Sa Jubileo, lalabas ito mula sa pagmamay-ari ng bumili, at babalik siya sa lupaing minana niya.[a]
  rationale: Inayos ang unang sugnay upang malinaw na maipahayag ang pagkakaroon ng sapat na halaga para matubos ang ipinagbiling ari-arian, nang hindi nagdaragdag ng detalye. Pinalitan ang “palalayain” ng pananalitang mas malapit sa literal na “lalabas” at malinaw na nagpapakita ng pag-alis mula sa pagmamay-ari ng bumili. Ginawang “lupaing minana niya” ang אֲחֻזָּה ayon sa konteksto ng minanang lupain, at inayos ang talababa upang idiomatikong maipahayag ang alternatibong simuno.
