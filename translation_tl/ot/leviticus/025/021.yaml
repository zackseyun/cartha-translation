  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: tl
  text: Kaya iuutos kong sumainyo ang aking pagpapala sa ikaanim na taon, at magbibigay ito ng ani[a] para sa tatlong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bunga ng lupa” o “produktong inani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: Kaya iuutos ko
  rationale: Pinananatili ng “iuutos” ang lakas ng utos o pasiya ng Diyos; ipinahihiwatig ng “kaya” na tugon ito sa tanong sa naunang talata.
- source_word: בִּרְכָתִי
  choice: ang aking pagpapala
  rationale: Tuwirang salin na pinananatiling malawak ang kahulugan, habang nililinaw ng kasunod na sugnay ang bungang kasaganaang pang-agrikultura.
- source_word: לָכֶם
  choice: sumainyo
  rationale: Likas at marangal na Filipino para sa pagpapalang ipinagkakaloob sa mga kausap.
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: sa ikaanim na taon
  rationale: Tuwirang pahayag ng panahon sa siklo ng taon ng pamamahinga.
- source_word: וְעָשָׂת
  choice: at magbibigay ito
  rationale: Likas na paglalarawan sa kongkretong epekto ng pagpapala. Ang “ito” ay hindi labis na tumutukoy kung ang gramatikal na sanggunian ay ang pagpapala o ang produktibong kalagayan ng taon/lupa.
- source_word: הַתְּבוּאָה
  choice: ng ani
  rationale: Ang “ani” ay malinaw at karaniwang salitang Filipino para sa produktong agrikultural o bungang inaani.
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: para sa tatlong taon
  rationale: Pinananatili ang maikling pahayag ng Hebreo tungkol sa lawak o kasapatan ng ani nang hindi tahasang idinaragdag ang salitang “sapat.”
theological_decisions:
- issue: Kalikasan ng ipinangakong pagpapala
  choice: Isang tuwirang utos ng Diyos na magdudulot ng pambihirang ani
  alternative: Isang pangkalahatang pahayag lamang tungkol sa providensiya
  rationale: Ang unang panauhang “iuutos ko” at “aking pagpapala” ay naghahayag ng tiyak na pagkilos ng Diyos, hindi lamang ng karaniwang takbo ng pagsasaka.
- issue: Sanggunian ng “ito” sa ikalawang sugnay
  choice: Hindi tahasang nilutas kung tumutukoy sa pagpapala o sa produktibong taon/lupa
  alternative: Tahasang gawing paksa ang lupa
  rationale: Pambabae ang pandiwa sa Hebreo, at maaaring iugnay sa “pagpapala,” samantalang sa konteksto ang lupa/taon ang nagbubunga. Pinananatili ng “ito” ang likas na puwang ng sanggunian nang hindi nagdaragdag ng tahasang paksa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “sumainyo” upang maging natural ang benefaktibong diwa ng pagpapala, at “ani” bilang madaling maunawaang terminong pang-agrikultura.
