  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: tl
  text: Sapagkat mga alipin[a] ko sila na inilabas ko mula sa lupain ng Ehipto; hindi sila dapat ipagbili sa paraang ipinagbibili ang isang alipin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga lingkod ko.” Sa kontekstong ito, binibigyang-diin ng Hebreo ang pagmamay-ari ni YHWH sa kanila bilang batayan ng pagbabawal na ipagbili sila bilang karaniwang alipin na ari-arian.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi sila ipagbibili sa pagbebenta ng isang alipin,” ibig sabihin, hindi sa paraang karaniwang ipinagbibili ang isang alipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang kautusan at pinananatili ang paliwanag na ugnayan ng talata.
- source_word: עֲבָדַי
  choice: mga alipin ko
  rationale: Ang עֶבֶד na may hulaping unang panauhang isahan ay nagsasaad ng mga taong nasa ilalim ng pagmamay-ari o kapangyarihan ng nagsasalita. Sa kontekstong ito, ang pagkakabuklod nila kay YHWH ang batayan kung bakit hindi sila maaaring ituring na karaniwang ari-ariang ipinagbibili.
- source_word: הֵם
  choice: sila
  rationale: Pinananatili ang tahasang panghalip at ang diin ng Hebreong sugnay na ‘mga alipin ko sila.’
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: na inilabas ko
  rationale: Likas na Filipino para sa karaniwang pahayag tungkol sa pagliligtas sa Exodo, habang nananatiling malapit sa pandiwang ‘ilabas.’
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwirang katumbas ng heograpikong parirala at malinaw sa modernong Filipino.
- source_word: לֹא יִמָּכְרוּ
  choice: hindi sila dapat ipagbili
  rationale: Ipinahahayag ng pasibong anyo at legal na konteksto ang pagbabawal. Mas natural sa Filipino ang ‘hindi dapat’ kaysa sa sobrang literal na anyong maaaring magmukhang simpleng hula.
- source_word: מִמְכֶּרֶת עָבֶד
  choice: sa paraang ipinagbibili ang isang alipin
  rationale: Ipinahahayag ang uri o paraan ng transaksiyong pang-alipin, nang hindi nilalabo ang diwa bilang pangkalahatang pagbabawal sa lahat ng anyo ng pagbebenta.
theological_decisions:
- issue: Paglalarawan sa Israel bilang pag-aari ni YHWH sa salitang עֲבָדַי
  choice: mga alipin ko
  alternative: mga lingkod ko
  rationale: 'Maaaring mangahulugan ang עֶבֶד ng ‘alipin’ o ‘lingkod,’ ngunit sentral dito ang pagkakabuklod at pagmamay-ari: dahil kay YHWH sila, hindi sila maaaring ipagbili bilang karaniwang alipin. Pinananatili ng ‘alipin’ ang legal at panlipunang bigat ng teksto nang hindi nagdaragdag ng makabagong konotasyong wala sa sinaunang konteksto.'
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘ipagbili’ para sa pormal na legal na tono at ang ‘sa paraang ipinagbibili’ upang malinaw at natural na maipahayag ang idiomatikong pariralang Hebreo. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
