translation:
  language: tl
  text: Pagkatapos, kukuwentahin niya ang mga taon mula nang ipagbili niya iyon at ibabalik ang halagang natitira[a] sa taong pinagbentahan niya, at babalik siya sa kanyang lupang pag-aari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sobra” o “labis.” Ito ang halagang natitira matapos kuwentahin ang halaga ayon sa mga taon na hindi pa nagagamit.
    reason: lexical_alternative
  - marker: b
    text: Ang “lupang pag-aari” ay malamang na tumutukoy sa minanang lupa ng kanyang sambahayan o angkan sa Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: kukuwentahin niya
  rationale: Ang חִשַּׁב ay tumutukoy sa pagkukuwenta ng halagang kailangan sa pagtubos. Karaniwan at malinaw sa modernong Filipino ang “kukuwentahin.”
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: ang mga taon mula nang ipagbili niya iyon
  rationale: Literal itong “mga taon ng pagbebenta niya,” ngunit sa konteksto ay ang mga taong lumipas mula nang maipagbili ang lupa. Nililinaw ng “iyon” na ang tinutukoy ay ang naipagbiling ari-arian sa naunang talata.
- source_word: וְהֵשִׁיב
  choice: ibabalik
  rationale: Ang Hiphil ng שׁוב ay “papagbabalikin” o “ibabalik”; dito ay pagsasauli ng perang dapat ibayad sa bumili.
- source_word: הָעֹדֵף
  choice: ang halagang natitira
  rationale: Tumutukoy ang salita sa sobrang o natitirang halaga matapos ang pagkukuwenta. Ang “halagang natitira” ay likas sa Filipino at malinaw sa kontekstong pinansiyal.
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: sa taong pinagbentahan niya
  rationale: Pinananatili nito ang personal na “tao” sa Hebreo at natural na ipinahahayag na siya ang bumili ng ari-arian.
- source_word: וְשָׁב
  choice: makababalik siya
  rationale: Ang Qal ng שׁוב ay nangangahulugang bumalik. Ang anyong “makababalik” ay natural na nagpapakita na ang pagbabalik ay kasunod at bunga ng pagtubos, nang hindi inaalis ang legal na pagkakasunod-sunod.
- source_word: לַאֲחֻזָּתוֹ
  choice: sa kanyang lupaing pag-aari
  rationale: Sa batas ng Jubileo, ang אֲחֻזָּה ay isang pag-aaring lupa, karaniwang minanang bahagi ng angkan. Mas tiyak ang “lupaing pag-aari” kaysa sa pangkalahatang “ari-arian,” habang iniiwan sa talababa ang pahiwatig ng minanang pag-aari.
theological_decisions:
- issue: Kahulugan ng אֲחֻזָּה sa mga batas ng Jubileo
  choice: lupaing pag-aari
  alternative: minanang lupaing pag-aari
  rationale: Tumutukoy ito sa nakatalagang pag-aaring lupa sa Israel at hindi lamang sa anumang ari-arian. Pinananatiling maikli at natural ang pangunahing teksto, samantalang ipinapaliwanag sa talababa ang malamang na minanang katangian nito.
- issue: Lakas ng וְשָׁב sa legal na pagkakasunod-sunod
  choice: Sa gayon, makababalik siya
  alternative: at babalik siya
  rationale: Ipinakikita ng konteksto na pagkatapos maibalik ang natitirang halaga ay maaari nang mabawi at balikan ng nagbenta ang lupa. Ang salin ay hindi ginagawang opsiyonal ang karapatang ito, kundi natural na ipinahahayag ang bunga ng pagtubos.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may legal at pamamaraang himig. Ginamit ang “kukuwentahin” at “halagang natitira” bilang karaniwang pananalita, at ang “lupaing pag-aari” upang mapanatili ang tiyak na kahulugan ng lupang tinutukoy sa batas ng Jubileo.
