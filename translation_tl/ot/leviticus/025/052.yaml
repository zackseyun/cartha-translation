  yaml_path: translation/ot/leviticus/025/052.yaml
  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: tl
  text: Ngunit kung kakaunting taon na lamang ang natitira hanggang sa Taon ng Jubileo, makikipagtuos siya sa kanya; ayon sa bilang ng nalalabi niyang mga taon, ibabayad niya ang halaga ng kanyang pagtubos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ibabayad niya ang kanyang pantubos.” Ang pananalitang Hebreo ay tumutukoy sa halagang kailangan upang matubos siya, hindi sa pagtubos bilang isang abstraktong konsepto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: kakaunting taon na lamang ang natitira
  rationale: Ipinahahayag nito sa natural na Filipino ang dami ng mga taong nalalabi, habang pinananatili ang diwa ng Niphal na נִשְׁאַר, ‘natitira’ o ‘nalalabi.’
- source_word: שְׁנַת הַיּוֹבֵל
  choice: Taon ng Jubileo
  rationale: Ito ang malinaw at dignified na katawagan sa itinakdang institusyon sa Levitico 25; ang malaking titik ay nagpapakitang pormal na tawag ito.
- source_word: וְחִשַּׁב לוֹ
  choice: makikipagtuos siya sa kanya
  rationale: Sa legal at pangkabuhayang konteksto, ang חִשַּׁב ay tumutukoy sa pagkukuwenta o pagtutuos. Natural sa Filipino ang ‘makikipagtuos’ at pinananatili ng ‘sa kanya’ ang panghalip ng Hebreo nang hindi tahasang tinutukoy kung sino ito.
- source_word: כְּפִי שָׁנָיו
  choice: ayon sa bilang ng nalalabi niyang mga taon
  rationale: Ipinapahayag ng כְּפִי ang proporsiyon o batayan. Nililinaw ng ‘bilang’ ang matematikal na diwa, at iniuugnay ng ‘nalalabi’ ang mga taon sa unang sugnay.
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: ibabayad niya ang halaga ng kanyang pagtubos
  rationale: Ang Hiphil na יָשִׁיב ay may diwang pagbabalik o pagbabayad, at sa kontekstong ito ang גְּאֻלָּה ay ang halagang kailangan para sa paglaya. Ang ‘halaga ng kanyang pagtubos’ ay mas natural at tiyak kaysa sa literal ngunit malabong ‘ibabayad niya ang kanyang pagtubos.’
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na pormal at madaling maunawaan. Ginamit ang ‘makikipagtuos’ upang mapanatili ang legal-ekonomikong tono, at iniwasang tukuyin nang tahasan ang tinutukoy ng ‘sa kanya’ sapagkat panghalip lamang din ang nasa Hebreo.
