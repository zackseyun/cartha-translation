  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: tl
  text: Matapos siyang maipagbili, maaari siyang tubusin; maaaring tubusin siya ng isa sa kanyang mga kapatid na lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, sa mas malawak na diwa, “maaaring tubusin siya ng isa sa kanyang mga kamag-anak na lalaki.” Literal na sinasabi ng Hebreo na “isa sa kanyang mga kapatid,” na tumutukoy sa lalaking kapamilya na kikilos bilang kamag-anak na manunubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: Matapos siyang maipagbili
  rationale: Ipinahahayag ang kalagayang nagsisimula kapag naganap na ang pagbebenta; likas sa modernong Filipino ang ganitong temporal at pasibong anyo.
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: maaari pa siyang tubusin
  rationale: Ang literal na 'magkakaroon siya ng pagtubos' ay isang legal na pahayag na nananatiling bukas sa kanya ang pagtubos. Ginagawang pandiwa ang nominal na Hebreo para sa natural na Filipino, habang pinananatili ng 'pa' ang diwang nananatili ang karapatang ito kahit na naipagbili na siya.
- source_word: אֶחָד מֵאֶחָיו
  choice: isa sa kanyang mga kapatid na lalaki
  rationale: Pinananatili ang tahasang panlalaking pangmaramihang 'mga kapatid' sa Hebreo at nililinaw sa Filipino na lalaking kapamilya ang tinutukoy.
- source_word: יִגְאָלֶנּוּ
  choice: maaaring tubusin siya
  rationale: Ang גאל ay karaniwang pandiwa para sa pagtubos na isinasagawa ng malapit na kamag-anak. Ang 'maaaring' ay angkop sa legal na pahintulot o probisyon ng talata.
theological_decisions:
- issue: Saklaw ng אֶחָיו bilang terminong pampamilya
  choice: mga kapatid na lalaki
  alternative: mga kamag-anak na lalaki
  rationale: Literal na 'kanyang mga kapatid' ang Hebreo. Hindi pinalalawak sa pangunahing teksto ang kahulugan, ngunit inilalahad sa talababa ang mas malawak na gamit nito sa legal na konteksto ng kamag-anak na manunubos.
- issue: Anyo ng probisyon sa pagtubos
  choice: maaari pa siyang tubusin
  alternative: magkakaroon siya ng karapatang matubos
  rationale: Pinananatili ang legal na posibilidad o karapatan nang hindi ipinahihiwatig na tiyak na isasagawa ang pagtubos. Mas natural din ito kaysa sa literal na nominal na konstruksyon.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may legal na himig ngunit hindi matigas. Ginamit ang 'tubusin' upang mapanatili ang legal at teolohikal na diwa ng גאל.
