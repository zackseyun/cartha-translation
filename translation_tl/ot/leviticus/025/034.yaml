  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: tl
  text: Ngunit ang lupang pastulan[a] ng kanilang mga lungsod ay hindi dapat ipagbili, sapagkat iyon ay kanilang permanenteng pag-aari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupang komunal” o “bukás na lupain.” Ang salitang Hebreo na מִגְרָשׁ ay tumutukoy sa lupa sa paligid ng mga lungsod ng mga Levita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “panghabang-panahong pag-aari.” Ang Hebreong עוֹלָם ay maaaring tumukoy sa namamalaging katayuan; dito, ipinahihiwatig nito na ang lupa ay hindi maaaring permanenteng ilipat sa iba.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/שְׂדֵה
  choice: Ngunit ang lupang
  rationale: Ang שָׂדֶה ay lupain o bukid. Ginamit ang “lupang” upang likas na maiugnay ito sa “pastulan,” at ang וּ ay isinaling “Ngunit” dahil may pagsalungat ito sa naunang pahintulot tungkol sa mga bahay sa mga lungsod ng mga Levita.
- source_word: מִגְרַשׁ
  choice: pastulan
  rationale: Tumutukoy ang מִגְרָשׁ sa bukás na lupa sa paligid ng isang lungsod, lalo na sa lupaing inilaan sa mga lungsod ng mga Levita. Malinaw at likas sa modernong Filipino ang “pastulan,” habang inilalagay sa talababa ang iba pang posibleng kahulugan.
- source_word: עָרֵיהֶם
  choice: ng kanilang mga lungsod
  rationale: Likas na ipinapahayag ng pariralang ito ang ugnayang pag-aari sa Hebrew construct chain nang hindi nagdaragdag ng ideyang hindi tahasang sinasabi ng teksto.
- source_word: לֹא יִמָּכֵר
  choice: ay hindi dapat ipagbili
  rationale: Ang Niphal imperfect ng מכר ay pasibo, “ipagbili.” Ipinahahayag ng “hindi dapat” ang puwersa ng legal na pagbabawal sa kasalukuyang Filipino.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan ng pagbabawal; ang “sapagkat” ay malinaw at marangal na katumbas.
- source_word: אֲחֻזַּת עוֹלָם
  choice: permanenteng pag-aari
  rationale: Ang אֲחֻזָּה ay minanang pag-aari o paghawak sa lupa, at sa kontekstong ito ang עוֹלָם ay nagpapahiwatig ng namamalagi at hindi maililipat na katayuan. Iniiwasan ng “permanente” ang labis na pagpapakahulugang metapisikal na kawalang-hanggan.
- source_word: הוּא לָהֶם
  choice: iyon ay kanilang
  rationale: Tinutukoy ng panghalip at prepositional phrase na ang lupang pastulan ay pag-aari nila. Ang “iyon ay kanilang” ay malinaw at natural sa Filipino.
theological_decisions:
- issue: Puwersa ng עוֹלָם sa batas tungkol sa lupain ng Israel
  choice: permanenteng pag-aari
  alternative: walang-hanggang pag-aari; panghabang-panahong pag-aari
  rationale: Sa legal na kontekstong ito, ipinahahayag ng עוֹלָם ang namamalagi at hindi maipagbiling katayuan ng lupa sa kaayusang tipan ng Israel, hindi kinakailangang isang pahayag tungkol sa metapisikal na kawalang-hanggan. Pinananatili ng “permanente” ang legal na puwersa at tunay na saklaw ng salita.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang legal na puwersa ng pagbabawal nang hindi gumagamit ng lipas na legalistikong pananalita. Ang “lupang pastulan” ay mas natural kaysa sa literal ngunit mabigat na “bukid ng pastulan,” habang kinakatawan pa rin ang buong pariralang Hebreo.
