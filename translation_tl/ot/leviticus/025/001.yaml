  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/הַ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/001.yaml
  text: And Yahweh spoke to Moses on Mount Sinai[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh[a] kay Moises sa Bundok Sinai, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari ring isalin bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Pinananatili ng “At” ang daloy ng salaysay na ipinahihiwatig ng waw-consecutive, at ng “nagsalita” ang pagkakaiba ng דבר mula sa אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatinig nito ang personal na pangalang banal na YHWH sa halip na palitan iyon ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Likas sa Tagalog ang “kay” bilang pananda sa taong pinatutungkulan ng pagsasalita; “Moises” ang karaniwang anyo ng pangalan.
- source_word: בְּהַר סִינַי
  choice: sa Bundok Sinai
  rationale: Ang בְּ ay lokatibo rito. Ang “sa Bundok Sinai” ay natural sa Tagalog at hindi labis na nililinaw kung ang tagpo ay nasa ibabaw o sa pook ng bundok.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Ipinauugnay nito ang pormula sa nilalaman ng pahayag na susunod, habang pinananatili ang pormal na katangian ng Hebreong infinitive.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo, habang kinikilala sa talababa ang ibang nakaugaliang anyo.
- issue: Lokasyon ng pagsasalita sa בְּהַר סִינַי
  choice: sa Bundok Sinai
  alternative: sa ibabaw ng Bundok Sinai; sa may Bundok Sinai
  rationale: Maaaring tumukoy ang lokatibong בְּ sa bundok bilang pook nang hindi tiyak na nilulutas kung nasa tuktok, ibabaw, o paligid nito ang tagpo.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “sa Bundok Sinai” upang mapanatili ang lawak ng lokatibong Hebreo. Ang “na sinasabi” ay sadyang pormal upang ipakita ang pormulang pambungad sa direktang pahayag sa susunod na talata.
