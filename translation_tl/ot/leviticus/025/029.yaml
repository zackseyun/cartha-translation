  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: tl
  text: Kung magbenta ang isang lalaki ng bahay na tirahan sa isang lunsod na may pader, maaari niya itong tubusin hanggang sa makumpleto ang isang buong taon mula nang maipagbili ito. Mananatili sa loob ng isang buong taon[a] ang karapatan niyang tubusin iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga araw”; sa idyomang legal na ito, tumutukoy ang parirala sa haba ng isang buong taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי יִמְכֹּר
  choice: Kung ang isang lalaki ay magbenta
  rationale: Ang כִּי ay nagpapakilala ng kondisyon sa batas-kaso, at pinananatili ng “isang lalaki” ang panlalaking kinatawang anyo ng אִישׁ.
- source_word: בֵּית מוֹשַׁב
  choice: bahay na tirahan
  rationale: Ipinahahayag ng pariralang konstruktibo ang bahay na ginagamit bilang tirahan; likas at malinaw ito sa modernong Tagalog.
- source_word: עִיר חוֹמָה
  choice: isang lunsod na napapaderan
  rationale: Tumutukoy ito sa isang lunsod na may nakapaligid na pader, hindi lamang sa isang pinatibay na lugar sa pangkalahatan.
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: maaari niya itong tubusin
  rationale: Sa kontekstong legal, ang גְּאֻלָּה ay ang umiiral na pagkakataon o karapatang mabawi sa pamamagitan ng pagtubos ang naipagbiling bahay.
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: hanggang sa makumpleto ang isang buong taon mula nang maipagbili ito
  rationale: Nililinaw na ang panahon ay isang buong taon mula sa bentahan, hindi hanggang sa pagtatapos lamang ng taon sa kalendaryo.
- source_word: יָמִים
  choice: isang buong taon[a]
  rationale: Bagaman literal na “mga araw,” ang salitang ito sa naturang legal na idyoma ay tumutukoy sa haba ng isang buong taon; inilalagay sa talababa ang literal na anyo.
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: Mananatili ... ang karapatan niyang tubusin iyon
  rationale: Ipinapakita ng parirala ang tagal ng legal na karapatang tumubos at iniiwasang gawing labis na abstrakto ang pangungusap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “lunsod na napapaderan” para sa tiyak na legal na katangian ng lugar at “tubusin” para sa teknikal na pagbawi ng ari-arian. Pinanatili sa talababa ang literal na idyomang Hebreo na “mga araw.”
