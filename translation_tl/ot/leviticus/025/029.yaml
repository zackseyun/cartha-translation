  to: Kung magbenta ang isang lalaki ng bahay na tirahan sa isang lunsod na may pader, maaari niya itong tubusin hanggang sa makumpleto ang isang buong taon mula nang maipagbili ito. Mananatili sa loob ng isang buong taon[a] ang karapatan niyang tubusin iyon.
