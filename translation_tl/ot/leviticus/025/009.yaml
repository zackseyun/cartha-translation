base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: tl
  text: Pagkatapos, patunugin mo nang malakas ang trumpeta[a] sa ikapitong buwan, sa ikasampung araw ng buwan. Sa Araw ng Pagbabayad-sala[b], patutunugin ninyo ang trumpeta sa buong lupain ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: shofar—isang instrumentong hinihipan na yari sa sungay, na ayon sa tradisyon ay madalas na inuunawang sungay ng lalaking tupa.'
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo para sa “Araw ng Pagbabayad-sala” ay literal na “araw ng mga pagbabayad-sala” (maramihan).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: Pagkatapos, patunugin mo
  rationale: Ang Hiphil ng עבר ay literal na “paraanin” o “palampasin,” ngunit kasama ng שׁוֹפָר ay tumutukoy sa pagpapalaganap ng tunog ng tambuli. Pinananatili rin ng “mo” ang isahang anyo ng pandiwa sa unang utos.
- source_word: שׁוֹפַר תְּרוּעָה
  choice: nang malakas ang trumpeta
  rationale: Ang שׁוֹפַר ay instrumentong sungay, at ang תְּרוּעָה rito ay malakas na tunog o hudyat nito. Ang pariralang ito ay natural sa modernong Tagalog at ipinakikita ang lakas ng hudyat nang hindi ito ginagawang sigaw ng tao.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: sa ikapitong buwan
  rationale: Tuwirang salin ng panandang-panahon at bilang ng buwan.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: sa ikasampung araw ng buwan
  rationale: Nililinaw ang Hebreong idyomang literal na “sa ikasampu ng buwan” sa natural na Tagalog.
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: Sa Araw ng Pagtubos
  rationale: Ito ang malinaw at kinikilalang katawagan sa banal na araw na tinutukoy, samantalang inilalahad sa talababa ang maramihang anyo ng salitang Hebreo.
- source_word: תַּעֲבִירוּ
  choice: patutunugin ninyo
  rationale: Kapareho ito ng naunang pandiwa ngunit maramihan. Pinananatili ng “ninyo” ang mahalagang pagbabago mula sa isahang kausap tungo sa maramihang kausap.
- source_word: בְּכָל אַרְצְכֶם
  choice: sa buong lupain ninyo
  rationale: Ipinahahayag nito ang lawak ng hudyat sa lahat ng teritoryong saklaw ng Israel.
theological_decisions:
- issue: Kahulugan ng יוֹם הַכִּפֻּרִים
  choice: Araw ng Pagtubos
  alternative: araw ng mga pagtubos / Araw ng Pagbabayad-sala
  rationale: Ang anyong Hebreo ay maramihan, ngunit ang parirala ay pangalan ng isang natatanging banal na araw. Ang “Araw ng Pagtubos” ay malinaw at dignified na katawagan sa Tagalog; hindi ipinipilit sa pangunahing teksto ang literal na maramihan, ngunit pinananatili ang impormasyong iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “trumpeta” sa pangunahing teksto para madaling maunawaan, habang ipinaliwanag ang mas tiyak na shofar sa talababa. Sadyang pinanatili ang pagkakaiba ng isahang “mo” at maramihang “ninyo” sa Hebreo.
