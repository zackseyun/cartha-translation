  text: וְ/הָ/אָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִ/צְמִתֻ֔ת כִּי לִ֖/י הָ/אָ֑רֶץ כִּֽי גֵרִ֧ים וְ/תוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: tl
  text: Hindi dapat ipagbili nang tuluyan[a] ang lupain, sapagkat akin ang lupain. Kayo ay mga dayuhan at mga pansamantalang naninirahan na kasama ko[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panghabang-panahon” o “bilang permanenteng paglilipat ng pag-aari.”
    reason: lexical_alternative
  - marker: b
    text: Ang tambalang “mga dayuhan at mga pansamantalang naninirahan” ay naglalarawan sa Israel bilang mga residenteng umaasa sa Diyos, na siyang may-ari ng lupain.
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: Hindi dapat ipagbili
  rationale: Ang Nifal imperfect ng מכר sa kontekstong pambatas ay pasibo at nagbabawal. Pinananatili ng “hindi dapat ipagbili” ang dalawang puwersang ito sa natural na makabagong Tagalog.
- source_word: לִצְמִתֻת
  choice: nang tuluyan
  rationale: Tumutukoy ang צְמִתֻת sa permanente o hindi na mababaling pagkalipat ng pag-aari. Malinaw at karaniwan sa Tagalog ang “nang tuluyan,” habang inilalahad sa talababa ang mas teknikal na diwa.
- source_word: כִּי לִי הָאָרֶץ
  choice: sapagkat akin ang lupain
  rationale: Ipinakikita ng כִּי ang dahilan ng pagbabawal, at tuwirang pinananatili ng “akin ang lupain” ang pahayag ng Diyos tungkol sa pagmamay-ari.
- source_word: גֵרִים
  choice: mga dayuhan
  rationale: Ang גֵּר ay taong naninirahan sa lupaing hindi niya minanang pag-aari at umaasa sa pahintulot o proteksiyon ng may-ari. Ang “mga dayuhan” ay malinaw at hindi inuulit ang kasunod na termino.
- source_word: וְתוֹשָׁבִים
  choice: mga pansamantalang naninirahan
  rationale: Ang תּוֹשָׁב ay residente o nakikipamayan na walang ganap at minanang karapatan sa lupain. Ipinahahayag ng salin ang pansamantalang katayuan sa konteksto ng Jubileo.
- source_word: עִמָּדִי
  choice: kasama ko
  rationale: Ang עם na may panlaping unang panauhang isahan ay tuwirang nangangahulugang “kasama ko.” Pinananatili nito ang payak na pahayag at hindi ipinapasok sa pangunahing teksto ang isang mas tiyak na pagpapakahulugan.
theological_decisions:
- issue: Ang kaugnayan ng Israel sa lupain
  choice: Ang pananatili ng Israel sa lupain ay nakasalalay at napapailalim sa pagmamay-ari ng Diyos.
  alternative: Ituring ang talata bilang regulasyong panlipunan at pangkabuhayan lamang, o palawakin ito bilang ganap na pahayag ng pagtataboy na lampas sa konteksto ng Jubileo.
  rationale: Ang tahasang “akin ang lupain” ang teolohikal na batayan ng batas. Pinananatili ng salin ang legal at teolohikal na puwersa nang hindi nagpapasok ng mas malawak na sistemang doktrinal.
- issue: Kahulugan ng “kasama ko” para sa mga dayuhan at pansamantalang naninirahan
  choice: Panatilihin sa teksto ang literal at sadyang maluwag na “kasama ko,” at ipaliwanag sa talababa ang diwa ng kanilang umaasang katayuan sa lupain ng Diyos.
  alternative: Isalin nang tahasan bilang “sa ilalim ng aking kapamahalaan” o “nangungupahan sa akin.”
  rationale: Maaaring ipahiwatig ng konteksto ang pagdepende sa Diyos bilang may-ari, ngunit hindi tahasang ginagamit ng Hebreo ang mga salitang “kapamahalaan” o “nangungupahan.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lupain” upang tumukoy sa lupa bilang teritoryo at minanang pag-aari. Iniwasan ang mas lumang “nakikipamayan” sa pangunahing teksto upang maging madaling maunawaan, ngunit pinanatili ang pagkakaiba ng dalawang terminong Hebreo sa pamamagitan ng “mga dayuhan” at “mga pansamantalang naninirahan.”
