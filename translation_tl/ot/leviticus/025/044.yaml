base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: tl
  text: Kung tungkol sa iyong aliping lalaki at aliping babae[a] na maaaring maging iyo, mula sa mga bansang nakapaligid sa inyo[b]—mula sa kanila kayo maaaring bumili ng aliping lalaki at aliping babae.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “alipin” ay maaari ring isaling “lingkod” sa ibang konteksto, ngunit dito ay tahasang pinag-uusapan ang pagbili at pag-aari. Magkaibang salita ang ginamit sa Hebreo para sa lalaki at babae.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga bansa” ay tumutukoy sa mga bayang hindi Israelita sa paligid ng Israel. Maaari ring isalin na “mga bayang nakapaligid sa inyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: iyong aliping lalaki / aliping lalaki
  rationale: Ang עֶבֶד ay maaaring mangahulugang alipin o lingkod, ngunit malinaw sa kontekstong legal na ang tinutukoy ay taong mabibili at magiging pag-aari; kaya mas tumpak ang “alipin.” Idinagdag ang “lalaki” upang mapanatili ang kaibahan sa kasunod na terminong pambabae.
- source_word: אֲמָתְךָ / אָמָה
  choice: iyong aliping babae / aliping babae
  rationale: Ito ang terminong pambabae na katapat ng עֶבֶד sa talata. Ang “aliping babae” ay malinaw at makabagong Filipino, at hindi gumagamit ng salitang maaaring mapagkamalang karaniwang kasambahay lamang.
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: na magiging iyo
  rationale: Pinananatili nito ang hinaharap o inaasahang pagkapasailalim sa pag-aari nang hindi dinaragdagan ang kahulugan.
- source_word: מֵאֵת הַגּוֹיִם
  choice: mula sa mga bansa
  rationale: Ang גּוֹיִם ay tumutukoy rito sa mga bansang o bayang hindi Israelita. Ang “mga bansa” ay natural at hindi nagdadala ng di-kailangang terminolohiyang panrelihiyon.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: nakapaligid sa inyo
  rationale: Tuwirang pinananatili ang heograpikong diwa ng mga karatig na bansa o bayan.
- source_word: מֵהֶם
  choice: sa kanila
  rationale: Malinaw nitong itinuturo pabalik ang mga bansang nakapaligid bilang panggagalingan ng mga bibilhin.
- source_word: תִּקְנוּ
  choice: maaari kayong bumili
  rationale: Ang קנה ay nangangahulugang bumili o magtamo. Sa batas na ito, pahintulot ang ipinapahayag sa halip na utos, kaya “maaari kayong bumili” ang angkop.
theological_decisions:
- issue: Paglalarawan sa katayuan ng mga taong binibili
  choice: Gamitin ang “alipin,” hindi ang mas malambot na “lingkod.”
  alternative: lingkod; utusang lalaki at babae
  rationale: Dahil hayagang binabanggit ang pagbili at pag-aari, mahalagang huwag pagtakpan ang sapilitang nakabigkis na katayuan sa tekstong legal.
- issue: Lakas ng pandiwang תִּקְנוּ
  choice: 'Basahin bilang pahintulot: “maaari kayong bumili.”'
  alternative: “bibili kayo” o “bumili kayo”
  rationale: Sa daloy ng mga tuntunin sa kabanata, itinatakda rito kung saan pinahihintulutang kumuha ng mga alipin, hindi iniuutos na bumili ang mga Israelita.
- issue: Pagpapalit mula isahang “iyo” tungo sa maramihang “inyo/kayo”
  choice: Panatilihin ang paglipat ng bilang sa Hebreo.
  alternative: Gawing maramihan ang lahat para sa mas makinis na Filipino.
  rationale: Ang Hebreo ay nagsisimula sa ikalawang panauhang isahan at lumilipat sa maramihan sa pagtukoy sa buong Israel. Pinananatili ito upang hindi burahin ang retorikal na anyo ng pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang tahasang terminong “alipin,” ang pagkakaiba ng lalaki at babae, ang pahintulot na ipinahihiwatig ng batas, at ang paglipat ng Hebreo mula sa isahang “iyo” tungo sa maramihang “inyo/kayo.”
