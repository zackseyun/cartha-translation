source:
  edition: WLC
  text: וְ/קִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַ/חֲמִשִּׁים֙ שָׁנָ֔ה וּ/קְרָאתֶ֥ם דְּר֛וֹר בָּ/אָ֖רֶץ לְ/כָל יֹשְׁבֶ֑י/הָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָ/כֶ֔ם וְ/שַׁבְתֶּ֗ם אִ֚ישׁ אֶל אֲחֻזָּת֔/וֹ וְ/אִ֥ישׁ אֶל מִשְׁפַּחְתּ֖/וֹ תָּשֻֽׁבוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: tl
  text: Itatalaga ninyo bilang banal ang ikalimampung taon, at ipahahayag ninyo ang kalayaan[a] sa lupain para sa lahat ng naninirahan dito. Ito ay magiging taon ng Jubileo para sa inyo. Bawat isa sa inyo[b] ay babalik sa kanyang ari-arian[c], at bawat isa ay babalik sa kanyang pamilya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “paglaya” o “pagpapalaya.” Ang Hebreong dĕror ay tumutukoy dito sa pormal na pagpapahayag ng paglaya sa taon ng Jubileo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bawat lalaki.” Distributibo ang panlalaking isahan dito at tumutukoy sa bawat indibiduwal na Israelita sa kontekstong legal.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “kanyang pag-aari” o “kanyang bahagi.” Pangunahing tumutukoy ang Hebreo sa minanang lupain o pag-aaring hawak ng pamilya.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring isalin na “angkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: Itatalaga ninyo bilang banal
  rationale: Ang Piel ng קדשׁ ay nangangahulugang italaga o ibukod bilang banal. Likas sa makabagong Tagalog ang pariralang ito at pinananatili nito ang diwang panrelihiyon ng salita.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: ang ikalimampung taon
  rationale: Ito ang natural na anyong Tagalog para sa Hebreong pariralang tumutukoy sa ika-50 taon.
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: ipahahayag ninyo ang kalayaan
  rationale: Ang דְּרוֹר ay pormal na ipinahahayag na kalayaan o paglaya sa konteksto ng Jubileo. Pinananatili ng 'kalayaan' ang lawak ng salita, habang nililinaw sa talababa ang iba pang posibleng salin.
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: sa lupain para sa lahat ng naninirahan dito
  rationale: Tapat ito sa lokatibong בָּאָרֶץ at sa saklaw na ipinahahayag ng 'lahat ng naninirahan dito,' nang hindi dinaragdagan ang Hebreo ng salitang 'buong.'
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: Ito ay magiging taon ng Jubileo para sa inyo
  rationale: Sa Levitico 25, ang יוֹבֵל ay teknikal na katawagan sa natatanging taon ng pagsasauli at pagpapalaya, hindi lamang sa tambuling sungay na ginagamit sa pagpapahayag nito.
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: ay babalik ... ay babalik
  rationale: Inuulit ang iisang pandiwang Hebreo upang mapanatili ang diin ng talata sa pagbabalik at pagsasauli.
- source_word: אִישׁ
  choice: bawat isa sa inyo
  rationale: Masculine singular ang anyong Hebreo ngunit distributibo ang gamit nito sa pangmaramihang kausap. Naipahahayag ng Tagalog na 'bawat isa sa inyo' ang indibiduwal na saklaw nang natural at hindi nagpapasya nang higit sa gramatika.
- source_word: אֶל אֲחֻזָּתוֹ
  choice: sa kanyang minanang ari-arian
  rationale: Ang אֲחֻזָּה sa kontekstong ito ay lupain o pag-aaring hawak bilang minanang bahagi. Nililinaw ng 'minanang ari-arian' ang legal na diwa nang hindi ito nililimitahan sa isang tiyak na uri ng parsela.
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: sa kanyang pamilya
  rationale: Maaaring tumukoy ang מִשְׁפָּחָה sa pamilya o mas malawak na angkan. 'Pamilya' ang pinakanatural sa pangunahing teksto, at nasa talababa ang alternatibo.
theological_decisions:
- issue: Distributibong gamit ng אִישׁ sa isang tekstong legal
  choice: bawat isa sa inyo
  alternative: bawat lalaki sa inyo
  rationale: Bagaman panlalaki ang anyong אִישׁ, distributibo ito at nakapaloob sa tuwirang pahayag sa pangmaramihang Israelita. Pinananatili ng salin ang indibiduwal na pananagutan at ang ikalawang panauhan nang hindi ginagawang mas eksklusibo ang referensiya kaysa sa hinihingi ng konteksto.
- issue: Teknikal na kahulugan ng יוֹבֵל
  choice: taon ng Jubileo
  alternative: taon ng tambuling sungay
  rationale: Sa agarang konteksto, tinutukoy ng salita ang institusyon ng ika-50 taon. Hindi nito ikinakaila ang kaugnayan ng termino sa sungay na pantawag, ngunit iyon ay hindi ang pangunahing referensiya rito.
- issue: Saklaw ng דְּרוֹר
  choice: kalayaan
  alternative: paglaya o pagpapalaya
  rationale: May saklaw ang salita mula sa kalayaan hanggang sa pormal na pagpapalaya. Hindi tinutukoy ng pangunahing teksto nang mas makitid kung aling legal na aspekto lamang ang nangingibabaw; pinananatili sa talababa ang leksikal na lawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang legal na hinaharap na anyo (“itatalaga,” “ipahahayag,” “babalik”) upang katawanin ang Hebreong utos sa tipan, at sadyang inulit ang “babalik” upang mapanatili ang retorika ng orihinal.
