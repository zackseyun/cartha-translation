  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: tl
  text: Huwag mong anihin ang kusang tumubo mula sa dati mong ani,[a] at huwag mong pitasin ang mga ubas ng iyong punong-ubas na hindi pinungusan.[b] Ito ay magiging isang taon ng lubos na pamamahinga[c] para sa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pananim na kusang sumibol mula sa nauna mong ani.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga ubas ng iyong ibinukod na punong-ubas”; tumutukoy ito sa punong-ubas na hinayaang hindi mapungusan o maalagaan sa taon ng pamamahinga.
    reason: lexical_alternative
  - marker: c
    text: O “isang taon ng Sabbath” o “isang taon ng ganap na pamamahinga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: ang kusang tumubo mula sa dati mong ani
  rationale: Ang סְפִיחַ ay ani o halamang sumibol nang kusa mula sa binhing naiwan ng naunang ani, hindi pananim na sadyang inihasik. Nililinaw ng parirala ang ugnayan nito sa קְצִירְךָ nang natural sa modernong Tagalog.
- source_word: תִקְצֹר
  choice: anihin
  rationale: Tumutukoy ang pandiwa sa paggapas o pag-ani ng pananim sa bukid. Ang “anihin” ang pinakanatural at tiyak na katumbas sa kontekstong ito.
- source_word: עִנְּבֵי
  choice: ang mga ubas ng
  rationale: Tuwirang isinasalin ang pangngalang “mga ubas” at pinananatili ang kaugnayang construct nito sa kasunod na salita.
- source_word: נְזִירֶךָ
  choice: iyong punong-ubas na hindi pinungusan
  rationale: Sa kontekstong pang-agrikultura, tumutukoy ito sa punong-ubas na ibinukod sa karaniwang pag-aalaga at hinayaang hindi mapungusan sa taon ng pamamahinga. Iniiwasan ng salin ang malabong literal na “ibinukod” at ang mapanlinlang na pag-uugnay sa isang Nazareo.
- source_word: תִבְצֹר
  choice: pitasin
  rationale: Ang pandiwa ay partikular na ginagamit sa pagkuha o pag-ani ng mga ubas. Ang “pitasin” ay malinaw at likas sa Tagalog.
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: isang taon ng lubos na pamamahinga
  rationale: Ipinahahayag ng שַׁבָּתוֹן ang matindi o ganap na pamamahinga. Pinananatili ng salin ang diwa ng Sabbath nang hindi ito ginagawang isang teknikal na katawagang hindi agad mauunawaan.
- source_word: לָאָרֶץ
  choice: para sa lupain
  rationale: Ang tinutukoy ay ang lupang sinasaka na kinakailangang pagpahingahin, kaya mas tiyak ang “lupain” kaysa “daigdig” o “lupa” lamang.
theological_decisions:
- issue: Paglalarawan sa taon ng Sabbath nang hindi nagdaragdag ng mga kalaunang doktrinal o liturhikal na kahulugan
  choice: isang taon ng lubos na pamamahinga para sa lupain
  alternative: isang taon ng Sabbath para sa lupain; isang taon ng banal na pamamahinga para sa lupain
  rationale: Itinatakda ng talata ang ganap na pamamahinga ng lupain. Naipahahayag ng “lubos na pamamahinga” ang pinatinding diwa ng שַׁבָּתוֹן, ngunit hindi idinaragdag ang ideyang “banal” o iba pang kahulugang hindi tahasang nasa parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong pambatas. Ginamit ang isahang “mong/iyong” upang katawanin ang ikalawang panauhang panlalaki na isahan sa Hebreo, na natural ding nagsisilbing pangkalahatang utos sa Tagalog.
