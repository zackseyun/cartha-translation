id: LEV.25.55
reference: Leviticus 25:55
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: tl
  text: Sapagkat ang mga anak ni Israel ay mga alipin ko[a]; mga alipin ko sila, na inilabas ko mula sa lupain ng Ehipto. Ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga lingkod ko.” Ang salitang Hebreo ay maaaring tumukoy sa alipin o lingkod na nakatali sa paglilingkod; sa kontekstong ito, binibigyang-diin na ang Israel ay kay Yahweh at hindi sa mga panginoong tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang batas at likas na naghahayag ng paliwanag sa Filipino.
- source_word: לִי
  choice: ko
  rationale: Ipinahahayag ng pariralang Hebreo ang pag-aari o pagiging para kay Yahweh; ang hulaping paari ay maikli at natural kasama ng “mga alipin.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang pampamilya at pangkalahatang katawagan ng Hebreo, sa halip na gawing “mga Israelita.”
- source_word: עֲבָדִים / עֲבָדַי
  choice: mga alipin / mga alipin ko
  rationale: Sa konteksto ng Jubileo, sentral ang kalagayang nakatali sa isang panginoon at ang pag-aangkin ni Yahweh; pinananatili rin ang mariing pag-uulit sa Hebreo.
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: na inilabas ko
  rationale: Tuwirang pinananatili ang karaniwang pananalita tungkol sa Exodo at ang pagkilos ni Yahweh.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Natural na katambal ng “inilabas” at pinananatili ang pormulang tumutukoy sa Exodo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos sa karaniwang anyong “Yahweh,” sa halip na palitan ng titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang inilalahad ang pangmaramihang “inyong” sa tipang pormula.
theological_decisions:
- issue: Ang kahulugan ng עבד sa konteksto ng pag-aari at paglilingkod sa tipan
  choice: mga alipin
  alternative: mga lingkod
  rationale: Maaaring mangahulugan ang salita ng alipin o lingkod, ngunit dito nakasalalay ang pangangatwiran sa katotohanang ang Israel ay pag-aari ni Yahweh at hindi maaaring maging permanenteng pag-aari ng kapwa Israelita. Mas malinaw na pinananatili ng “alipin” ang legal at panlipunang tensiyon ng talata, nang hindi ito itinutumbas sa bawat anyo ng pang-aalipin sa ibang panahon.
- issue: Ang panlalaking pangkalahatang katawagang בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili nito ang literal na pampamilyang larawan ng Hebreo habang nauunawaan bilang katawagan sa sambayanang Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat” upang ipakita ang ugnayang paliwanag sa naunang talata, at iningatan ang pag-uulit ng “mga alipin ko” bilang diin ng orihinal.
