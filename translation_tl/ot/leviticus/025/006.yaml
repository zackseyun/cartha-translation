  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: tl
  text: Ang bunga ng lupa sa taon ng pamamahinga nito ay magiging pagkain para sa inyo—para sa iyo, sa iyong aliping lalaki, sa iyong aliping babae, sa iyong upahang manggagawa, at sa dayuhang naninirahan sa piling mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, ang panghalip sa “sa piling mo” ay panlalaki at isahan, gaya rin ng “para sa iyo” at ng bawat taong binanggit sa talaan.
    reason: Nililinaw ang pagbabago mula sa maramihang “inyo” tungo sa isahang “iyo/mo” sa orihinal.
lexical_decisions:
- source_word: שַׁבַּת הָאָרֶץ
  choice: bunga ng lupa sa taon ng pamamahinga
  rationale: Literal itong “pamamahinga ng lupa,” ngunit sa konteksto ang tinutukoy na magiging pagkain ay ang kusang ibubunga ng lupa habang nagpapahinga ito. Nililinaw ng salin ang tinutukoy nang pinananatili ang ugnayan sa taon ng pamamahinga.
- source_word: לָכֶם לְאָכְלָה
  choice: magiging pagkain ninyo
  rationale: Natural na Filipino ito para sa layunin o gamit na ipinahahayag ng לְאָכְלָה, at pinananatili ang maramihang “ninyo” ng לָכֶם.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: iyong aliping lalaki / iyong aliping babae
  rationale: Pinananatili ang pagkakaiba ng kasarian at ang kalagayang pagkaalipin na ipinahihiwatig ng magkatambal na terminong Hebreo.
- source_word: שְׂכִירְךָ
  choice: iyong upahang manggagawa
  rationale: Malinaw na tumutukoy sa taong nagtatrabaho kapalit ng sahod, na naiiba sa mga alipin sa naunang talaan.
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: dayuhang naninirahang kasama mo
  rationale: Ipinapakita nito kapwa ang pagiging hindi katutubo at ang patuloy na paninirahan niya sa piling ng kausap.
theological_decisions:
- issue: Paglalarawan sa bunga at pamamahinga ng lupa
  choice: Isinalin bilang “bunga ng lupa sa taon ng pamamahinga.”
  alternative: “pamamahinga ng lupa” o “bunga ng pamamahinga ng lupa”
  rationale: Ang literal na parirala ay “pamamahinga ng lupa,” ngunit ang bagay na kinakain ay ang ani o bungang tumutubo sa panahong iyon. Hindi nito ginagawang utos na anihin ang lupa, kundi inilalarawan kung sino ang maaaring kumain ng ibinubunga nito.
- issue: Mga kategorya ng paggawa at pagkaalipin
  choice: Pinag-iba ang aliping lalaki, aliping babae, at upahang manggagawa.
  alternative: Tawaging “mga lingkod” ang lahat
  rationale: May sadyang pagkakaibang panlipunan at pangkabuhayan sa Hebreo; mawawala iyon kung iisang malawak na katawagan lamang ang gagamitin.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “taon ng pamamahinga” upang iugnay ang talata sa sabatikong taon nang hindi umaasa sa hindi pamilyar na katawagang teknikal. Ang footnote marker [a] ay inilagay sa pangunahing teksto.
