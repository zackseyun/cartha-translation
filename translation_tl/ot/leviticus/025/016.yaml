base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: tl
  text: Kung mas maraming taon, tataasan mo ang halaga ng bilihing iyon; at kung mas kakaunti ang mga taon, babawasan mo ang halaga nito, sapagkat ang ipinagbibili niya sa iyo ay bilang ng mga ani.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bilang ng mga pananim” o “bilang ng bunga ng lupa.” Ang Hebreong תְּבוּאוֹת ay maaaring mangahulugang mga ani, mga pananim, o bunga ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי רֹב הַשָּׁנִים
  choice: Kung mas maraming taon ang natitira
  rationale: Ipinahahayag ng לְפִי ang pagtutumbas o proporsiyon. Ginawang lantad ang ipinahihiwatig ng konteksto—ang mga taong natitira bago ang Jubileo—upang maging malinaw at likas sa Tagalog ang tuntunin sa pagtatakda ng halaga.
- source_word: תַּרְבֶּה מִקְנָתוֹ
  choice: tataasan mo ang halaga ng bilihing iyon
  rationale: Ang Hiphil na תַּרְבֶּה ay nangangahulugang magdagdag o magtaas. Sa konteksto, ang מִקְנָה ay ang halaga o presyo ng binibili; ang parirala ay malinaw na tumutukoy sa pagtaas ng halagang ibabayad.
- source_word: וּלְפִי מְעֹט הַשָּׁנִים
  choice: at kung mas kaunti ang mga taon
  rationale: Pinananatili ang paghahambing at simetriya sa unang sugnay nang hindi gumagamit ng mabigat o di-likas na pariralang legal.
- source_word: תַּמְעִיט מִקְנָתוֹ
  choice: babawasan mo ang halaga nito
  rationale: Ang Hiphil na תַּמְעִיט ay ‘magpababa’ o ‘magbawas.’ Ang ‘halaga nito’ ay natural na tumutukoy pabalik sa binibili at sa presyong inaayos.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng tuntunin sa pagpepresyo; ang ‘sapagkat’ ay malinaw, marangal, at angkop sa rehistrong pambatas.
- source_word: מִסְפַּר תְּבוּאֹת
  choice: takdang bilang ng mga ani
  rationale: Ang מִסְפַּר ay bilang, at ang תְּבוּאוֹת ay maaaring tumukoy sa ani, mga pananim, o bunga ng lupa. Ipinakikita ng ‘takdang bilang ng mga ani’ na ang halaga ay nakabatay sa dami ng mapapakinabangang pag-aani.
- source_word: הוּא מֹכֵר לָךְ
  choice: ang ipinagbibili niya sa iyo ay
  rationale: Ang ayos na ito ay natural sa Tagalog at pinananatili ang diin ng Hebreo na ang tunay na ipinagbibili ay ang bilang ng mga ani.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal, na may bahagyang rehistrong pambatas. Ginamit ang ‘Jubileo’ bilang kontekstuwal na paglilinaw lamang sa paliwanag ng pasyang leksikal, hindi sa pangunahing teksto. Inilagay ang pananda ng talababa [a] kaagad pagkatapos ng ‘mga ani.’
