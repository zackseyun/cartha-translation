  to: Kung mas maraming taon, tataasan mo ang halaga ng bilihing iyon; at kung mas kakaunti ang mga taon, babawasan mo ang halaga nito, sapagkat ang ipinagbibili niya sa iyo ay bilang ng mga ani.[a]
  rationale: Inalis ang “natitira” upang huwag magdagdag ng impormasyong hindi hayag sa talata, at pinalitan ang “takdang bilang” ng “bilang” upang tumpak na maipahayag ang מִסְפַּר. Napanatili ang natural na Tagalog, ang legal-komersiyal na rehistro, ang utos sa ikalawang panauhan, at ang talababa na nakaugnay sa “mga ani.”
