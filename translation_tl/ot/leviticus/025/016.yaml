  naturalness: Malinaw at likas ang daloy ng draft. Ang binagong teksto ay nagpapanatili ng tuwirang utos at mas payak na ipinahahayag ang proporsiyonal na tuntunin.
  terminology: Ang “halaga ng bilihin” ay katanggap-tanggap sa kontekstong pangkalakalan para sa מִקְנָתוֹ. Ang “mga ani” ay angkop para sa תְּבוּאוֹת; pinananatili ng talababa ang kapaki-pakinabang na mga alternatibong leksikal.
