  - severity: low
    issue: Hindi malinaw ang saklaw ng “magpakailanman.”
    rationale: Sa draft, maaari itong basahing tumutukoy sa kilos ng pagmana. Sa Hebreo, inilalarawan nito ang katayuan ng pag-aari; “permanenteng ari-arian” ang mas malinaw na salin.
