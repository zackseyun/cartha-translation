  source_fidelity: Kailangang alisin ang “pagkamatay ninyo,” dahil ang אַחֲרֵיכֶם ay literal na “pagkatapos ninyo/na susunod sa inyo” at hindi tahasang nagsasaad ng kamatayan. Ang binagong salin ay pinananatili ang legal na pagpapamana, permanenteng pag-aari, pagpapagawa, at pagbabawal sa malupit na pamumuno.
  naturalness: Ang “mga anak ninyong lalaki na susunod sa inyo,” “permanenteng ari-arian,” at “pagawain sila” ay mas natural na modernong Filipino at mas malinaw ang ugnayan ng mga parirala. Ang huling pangungusap ay pinasimple nang hindi inaalis ang distributibong diwa ng Hebreo.
  terminology: Pinananatili ang “mga anak na lalaki,” “mga kapatid,” at “mga anak ni Israel.” Ang “permanenteng ari-arian” ay mas angkop para sa legal na lakas ng לְעוֹלָם at אֲחֻזָּה kaysa sa pang-abay na “magpakailanman,” na maaaring hindi malinaw kung alin ang binibigyang-katuturan.
  issues:
