base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: tl
  text: Ipamamana ninyo sila sa mga anak ninyong lalaki na susunod sa inyo, upang maging permanenteng ari-ariang mamanahin. Maaari ninyo silang pagawain. Ngunit sa inyong mga kapatid, ang mga anak ni Israel, walang sinuman ang mamumuno nang malupit sa kanyang kapatid.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang “mga kapatid” at “mga anak ni Israel” ay nagsasalin sa mga katawagang pangkamag-anakan sa Hebreo. Inilalarawan ng batas ang mga kapwa Israelita bilang magkakamag-anak sa tipan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: Maipamamana ninyo sila
  rationale: Ipinahahayag ng Hithpael ng נחל dito ang pagpapasa sa iba bilang minanang pag-aari. Ang “maipamamana” ay likas na legal na pananalita sa Filipino at pinananatili ang puwersang heredero ng Hebreo.
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: sa inyong mga anak na lalaki pagkamatay ninyo
  rationale: Tuwirang isinasalin ng “mga anak na lalaki” ang panlalaking בנים. Sa konteksto ng pagpapamana, nililinaw ng “pagkamatay ninyo” ang idiomatikong אַחֲרֵיכֶם, “pagkatapos ninyo,” nang hindi binabago ang legal na diwa.
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: upang manahin bilang ari-arian
  rationale: Pinananatili nito kapwa ang kilos ng pagmamana sa ירש at ang katayuan bilang pag-aaring hawak sa אֲחֻזָּה.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Ito ang tuwirang katumbas ng pangmatagalan o permanenteng legal na katayuan na ipinahahayag ng עוֹלָם. Sa talatang ito, tumutukoy ito sa patuloy na pagmamay-ari, hindi kinakailangang sa metapisikal na kawalang-hanggan.
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: Maaari ninyo silang pagtrabahuhin
  rationale: Natural at tuwiran itong Filipino para sa pagpapagawa ng trabaho sa mga taong tinutukoy. Hindi nito pinapalambot ang sapilitang ugnayang ipinahihiwatig ng konteksto.
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: Ngunit sa inyong mga kapatid, na mga anak ni Israel
  rationale: Pinananatili ang paghahambing, ang katawagang pangkamag-anakan, at ang appositional na “mga anak ni Israel.”
- source_word: אִישׁ בְּאָחִיו
  choice: walang sinuman sa inyo ... sa kanyang kapatid
  rationale: 'Natural na ipinahahayag sa Filipino ang distributibong diwa: walang isang Israelita ang gagawa nito sa kapwa niyang Israelita. Pinananatili ng “kapatid” ang talinghagang pangtipan ng Hebreo.'
- source_word: לֹא תִרְדֶּה בוֹ
  choice: ang dapat mamuno ... sa kanyang kapatid
  rationale: Ang רדה ay tumutukoy sa pamumuno o paggamit ng kapangyarihan sa iba. Ang “mamuno” ay tuwiran at hinahayaang ang kasunod na parirala ang maglarawan sa paraan nito.
- source_word: בְּפָרֶךְ
  choice: nang malupit
  rationale: Malinaw at natural itong salin ng matindi at mapaniil na paraan ng pamamahala o sapilitang paggawa na tinutukoy ng פֶרֶךְ.
theological_decisions:
- issue: Pagpapanatili ng panlalaking katawagang pangkamag-anakan sa batas ng Israel
  choice: “mga anak na lalaki,” “mga kapatid,” at “mga anak ni Israel”
  alternative: “mga anak,” “mga kapwa Israelita,” o “mga kababayan”
  rationale: Hayagang panlalaki ang mga katawagang Hebreo at ginagamit ang ugnayang magkakapatid upang ilarawan ang pananagutang pangtipan. Pinananatili ang anyong ito sa halip na gawing neutral ang kasarian.
- issue: Tuwirang paglalahad sa wika ng pagkaalipin at pagmamay-ari
  choice: Gamitin ang “ipamamana,” “ari-arian,” at “pagtrabahuhin”
  alternative: Gumamit ng mas banayad na pananalitang nakatuon lamang sa paglilingkod
  rationale: Malinaw sa Hebreo ang minanang pagmamay-ari at pagpapagawa ng trabaho sa mga taong hawak bilang ari-arian. Hindi dapat palabuin o pagaanin ng salin ang legal at moral na bigat ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang tahasang legal na wika ng pagpapamana, ari-arian, at sapilitang paggawa, gayundin ang panlalaking katawagang pangkamag-anakan ng pinagmulang Hebreo.
