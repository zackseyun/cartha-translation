base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: tl
  text: Kung maghirap ang iyong kapatid at magbenta siya ng bahagi ng kanyang minanang lupain,[a] darating ang pinakamalapit niyang kamag-anak na tagatubos at tutubusin ang ipinagbili ng kapatid na iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “minanang lupain” ay bahagi ng lupang pag-aari ng isang pamilya sa Israel at ipinapasa sa mga salinlahi.
    reason: cultural_note
  - marker: b
    text: Ang “kamag-anak na tagatubos” ang malapit na kamag-anak na may karapatan at pananagutang bawiin ang lupain ng pamilya. Maaari ring unawain ang mga pandiwa bilang “maaaring dumating ... at tumubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּךְ
  choice: maghirap
  rationale: Likas at kasalukuyang Tagalog para sa pagkapos o pagbagsak sa kahirapan sa isang kontekstong pangkabuhayan.
- source_word: אָחִיךָ
  choice: iyong kapatid
  rationale: Pinananatili ang literal na wikang pampamilya ng Hebreo; sa batas na ito maaari rin itong tumukoy sa kapwa Israelita.
- source_word: וּמָכַר מֵאֲחֻזָּתוֹ
  choice: maipagbili niya ang bahagi ng minanang lupain niya
  rationale: Ang אֲחֻזָּה rito ay minanang pag-aaring lupa ng pamilya, at ang מִן ay nagpapahiwatig na bahagi lamang nito ang naipagbili. Ipinahihiwatig ng 'maipagbili' ang pagbebentang dulot ng paghihirap nang hindi ginagawang tahasang modal ang Hebreo.
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: ang pinakamalapit niyang kamag-anak na tagatubos
  rationale: Ginagawang malinaw ang tungkulin at karapatan ng pinakamalapit na kamag-anak sa pagbawi ng lupain ng pamilya.
- source_word: וּבָא ... וְגָאַל
  choice: darating ... at tutubusin
  rationale: Pinananatili ang tuwirang anyo ng magkakasunod na pandiwang Hebreo sa batas na kasuistiko; inilalahad nito ang inaasahang legal na pagkilos nang hindi tahasang nilulutas kung ito ay pahintulot o obligasyon.
- source_word: אֵת מִמְכַּר אָחִיו
  choice: ang ipinagbili ng kanyang kapatid
  rationale: Natural na Tagalog para sa bagay o ari-ariang naipagbili, sa halip na sa mismong transaksiyon.
theological_decisions:
- issue: Saklaw ng wikang pangkamag-anakan
  choice: iyong kapatid
  alternative: iyong kapwa Israelita / iyong kamag-anak
  rationale: Pinananatili ang אָחִיךָ bilang 'kapatid' habang hindi isinasara ang mas malawak na gamit nito sa komunidad ng Israel.
- issue: Kahulugan ng גאל sa batas ng lupa
  choice: kamag-anak na tagatubos / tutubusin
  alternative: kamag-anak na bibili pabalik / babawiin
  rationale: Pinananatili ang legal at teolohikal na ugnayan ng salitang-ugat גאל, ngunit nililinaw rin ang elementong pampamilya.
- issue: Lakas ng וּבָא וְגָאַל
  choice: darating ... at tutubusin
  alternative: maaaring dumating ... at tumubos / dapat dumating ... at tumubos
  rationale: Ang anyong Hebreo ay hindi tahasang may modal. Ang tuwirang hinaharap sa Tagalog ay nagpapanatili ng legal na puwersa at ng posibleng tensiyon sa pagitan ng inaasahang tungkulin at pinahihintulutang pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lupain' sa halip na pangkalahatang 'ari-arian' dahil ang konteksto ng Levitico 25 ay minanang hawak na lupa. Ang mga talababa ay parehong may marker sa pangunahing teksto.
