  text: לֹא תִרְדֶּ֥ה ב֖/וֹ בְּ/פָ֑רֶךְ וְ/יָרֵ֖אתָ מֵ/אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/043.yaml
  text: You shall not rule over him harshly[a], but you shall fear your God.
translation:
  language: tl
  text: Huwag mo siyang pamunuan nang malupit[a]; sa halip, matakot ka sa iyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang may kabagsikan,” “nang walang awa.” Ang salitang Hebreo ay tumutukoy sa mabigat at mapaniil na pagtrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה בּוֹ
  choice: pamunuan mo siya
  rationale: Ang רדה ay tumutukoy sa paggamit ng kapangyarihan o pamamahala sa isang tao. Sa kontekstong legal, pinananatili ng “pamunuan” ang ugnayan ng awtoridad nang hindi dinaragdagan ang diwa gaya ng maaaring gawin ng “sikilín” o “pagmalupitan.”
- source_word: בְּפָרֶךְ
  choice: nang malupit
  rationale: Ang פָרֶךְ ay nagsasaad ng mabagsik, matindi, o mapaniil na pagtrato. Likas sa makabagong Tagalog ang “nang malupit” kasunod ng pandiwang “pamunuan,” samantalang inilalahad sa talababa ang mas matinding posibleng himig.
- source_word: וְיָרֵאתָ
  choice: sa halip, matakot ka
  rationale: Pormal na “at” ang וְ, ngunit kasunod ng pagbabawal ay ipinakikita ng ikalawang sugnay ang nararapat na saloobin na pumipigil sa malupit na pamamahala. Natural na ipinahahayag ng “sa halip” ang contrast na ito nang hindi binabago ang utos.
- source_word: מֵאֱלֹהֶיךָ
  choice: sa iyong Diyos
  rationale: Kapag kasama ng ירא, ang מִן ay nagmamarka sa kinatatakutan. Sa Tagalog, likas itong isalin bilang “matakot sa iyong Diyos,” habang pinananatili ang panghalip na paari.
theological_decisions:
- issue: Ugnayan ng pagkatakot sa Diyos at ng pagbabawal sa malupit na pamamahala
  choice: “sa halip, matakot ka sa iyong Diyos”
  alternative: “at matakot ka sa iyong Diyos”
  rationale: 'Inihahayag ng salin ang etikal na contrast: ang pagpipitagan sa Diyos ang dapat humadlang sa malupit na paggamit ng kapangyarihan. Gayunman, hindi nito ginagawang tahasang sanhi ang ugnayang ipinahihiwatig lamang ng Hebreo.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang isahang “mo/ka/iyong” upang tapat na katawanin ang panlalaking isahang kausap sa Hebreo, na gumaganap dito bilang pangkalahatang legal na tagubilin.
