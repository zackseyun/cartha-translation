  text: For six years you shall sow your field[a], and for six years you shall prune your vineyard and gather its produce.
translation:
  language: tl
  text: Sa loob ng anim na taon ay maghasik ka sa iyong bukid, at sa loob ng anim na taon ay pungusan mo ang iyong ubasan at tipunin mo ang ani nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁשׁ שָׁנִים
  choice: sa loob ng anim na taon
  rationale: Ipinahahayag nito nang natural sa Tagalog ang accusative of duration—ang haba ng panahong ginagawa ang mga gawaing pang-agrikultura.
- source_word: תִּזְרַע
  choice: maghasik ka
  rationale: Ang imperfect sa kontekstong legal ay nagsasaad ng tagubilin; ang pautos na anyong Tagalog ay malinaw at likas nang hindi labis na arkaiko.
- source_word: שָׂדֶךָ
  choice: iyong bukid
  rationale: Tumutukoy ang שָׂדֶה sa bukid o lupang sinasaka, hindi sa mas malawak na kahulugan ng lupain.
- source_word: תִּזְמֹר
  choice: tabasan mo
  rationale: Sa konteksto ng ubasan, ang זמר ay tiyak na tumutukoy sa pagputol o pruning ng mga sanga ng puno ng ubas.
- source_word: כַּרְמֶךָ
  choice: iyong ubasan
  rationale: Karaniwan at tiyak na katumbas ito ng כֶּרֶם sa kontekstong pang-agrikultura.
- source_word: וְאָסַפְתָּ
  choice: at tipunin
  rationale: Pinananatili ng “tipunin” ang pangunahing diwa ng pag-iipon o pangongolekta ng bunga nang hindi ito pinakikitid sa isang partikular na paraan ng pag-aani.
- source_word: תְּבוּאָתָהּ
  choice: ang ani nito
  rationale: Sa kontekstong ito, natural na tumutukoy ang תְּבוּאָה sa bungang agrikultural o ani; ang hulaping pambabae ay isinaling “nito,” na pinakamalapit na tumutukoy sa ubasan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang magkatimbang na mga pariralang “sa loob ng anim na taon” upang mapanatili ang paralelismo ng Hebreo. Walang footnote dahil ang ibinigay na English footnote ay nakakabit sa “field” ngunit ang nilalaman nito ay tumatalakay sa ibang terminong Hebreo; ang alternatibong “bunga” para sa תְּבוּאָה ay hindi kailangang itala upang maunawaan ang talata.
