  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: tl
  text: Magsalita ka sa mga anak ni Israel[a] at sabihin mo sa kanila, ‘Kapag pumasok kayo sa lupaing ibinibigay ko sa inyo, magpapahinga ang lupain bilang Sabbath para kay Yahweh.[b]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ni Israel”; maaari ring unawain na “mga anak ni Israel” o “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “ang lupain ay magpapahinga bilang sabbatikong pahinga para kay Yahweh.” Inilalarawan ng Hebreo ang lupain na para bang ito mismo ang nagpapahinga sa Sabbath.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ אֲלֵהֶם
  choice: Magsalita ka ... at sabihin mo sa kanila
  rationale: Pinananatili ang dalawang magkaugnay na utos at ang pormal na himig ng legal na tagubilin, kahit may likas na pag-uulit sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang pinananatili ang pampamilyang Hebreong pananalita; sa konteksto, tumutukoy ito sa sambayanan ng Israel.
- source_word: כִּי תָבֹאוּ אֶל הָאָרֶץ
  choice: Kapag pumasok kayo sa lupain
  rationale: Dito, ang כִּי ay natural na nagpapakilala ng inaasahang pangyayari sa hinaharap, kaya ‘kapag’ sa halip na kondisyunal na ‘kung.’ Ang ‘pumasok’ ay angkop sa בוא kasunod ng אֶל.
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: ibinibigay ko sa inyo
  rationale: Ipinahihiwatig ng participle na נֹתֵן ang kasalukuyan o nalalapit na pagkakaloob ng Diyos.
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: mangingilin ang lupain ng isang Sabbath
  rationale: Pinananatili ang personipikasyon ng lupain bilang nagsasagawa ng Sabbath. Ang ‘mangingilin’ ay mas natural sa Tagalog kaysa sa literal ngunit alanganing ‘magpapahinga ng isang Sabbath,’ habang taglay pa rin ang diwa ng paghinto at banal na pamamahinga.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahayag na ang Sabbath ng lupain ay ukol o iniaalay kay Yahweh.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ginagamit ng Hebreo ang mismong tipang pangalan na YHWH. Pinananatili ng ‘Yahweh’ ang pangalang nasa tekstong pinagmulan sa halip na palitan ito ng isang titulo.
- issue: Ang lupain bilang tagapangilin ng Sabbath
  choice: mangingilin ang lupain ng isang Sabbath
  alternative: magpapahinga ang lupain
  rationale: Hindi nilulutas o inaalis ang personipikasyon sa Hebreo. Ipinakikita ng salin na ang hinihinging pamamahinga ay Sabbath na para kay Yahweh, hindi lamang pangkaraniwang pagpapahinga.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang pormal na pag-uulit ng utos, ang pampamilyang katawagang ‘mga anak ni Israel,’ ang personipikasyon ng lupain, at ang pangalang Yahweh. Ginawang malaking titik ang ‘Sabbath’ bilang katawagan sa itinakdang banal na pangingilin.
