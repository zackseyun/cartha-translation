revisions:
- from: Magsalita ka sa mga anak ni Israel[a] at sabihin mo sa kanila, ‘Kapag pumasok kayo sa lupaing ibinibigay ko sa inyo, mangingilin ang lupain ng isang Sabbath para kay Yahweh.[b]’
  to: Magsalita ka sa mga anak ni Israel[a] at sabihin mo sa kanila, ‘Kapag pumasok kayo sa lupaing ibinibigay ko sa inyo, magpapahinga ang lupain bilang Sabbath para kay Yahweh.[b]’
  rationale: Pinalitan ang ‘mangingilin ang lupain ng isang Sabbath’ ng ‘magpapahinga ang lupain bilang Sabbath’ upang maging natural sa modernong Filipino at malinaw na maipahayag ang sabbatikong pahinga ng lupain, habang pinananatili ang personipikasyon, ang kaugnayan sa Sabbath, at ang pag-aalay nito kay Yahweh. Inayos din ang talababa upang tumugma sa binagong salin.
