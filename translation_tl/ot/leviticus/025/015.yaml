  text: בְּ/מִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַ/יּוֹבֵ֔ל תִּקְנֶ֖ה מֵ/אֵ֣ת עֲמִיתֶ֑/ךָ בְּ/מִסְפַּ֥ר שְׁנֵֽי תְבוּאֹ֖ת יִמְכָּר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: tl
  text: Ayon sa bilang ng mga taon pagkaraan ng Jubileo, dapat kang bumili mula sa iyong kapwa; ayon sa bilang ng mga taon ng ani[a], ipagbibili ito sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga taon ng bunga” o “mga taon ng mga ani.” Ibinabatay ang halaga ng bentahan sa bilang ng mga taong maaari pang anihan bago sumapit ang susunod na Jubileo, hindi sa permanenteng paglilipat ng pagmamay-ari ng lupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר
  choice: ayon sa bilang
  rationale: Ipinahahayag ng בְּ kasama ng מִסְפַּר ang pamantayan o batayan ng pagtutuos; natural at tumpak sa Filipino ang “ayon sa bilang.”
- source_word: שָׁנִים אַחַר הַיּוֹבֵל
  choice: mga taon pagkaraan ng Jubileo
  rationale: Pinananatili nito ang temporal na ugnayan sa taon ng Jubileo nang hindi nagdaragdag ng paliwanag na wala sa mismong parirala.
- source_word: תִּקְנֶה
  choice: dapat kang bumili
  rationale: Ang imperfect na pandiwa sa kontekstong legal ay may puwersang normatibo; malinaw itong naipapahayag ng “dapat,” habang nananatiling natural sa modernong Filipino.
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: mula sa iyong kapwa
  rationale: Ang עָמִית ay tumutukoy sa kapwa kasapi ng pamayanan sa legal na konteksto. Hindi nito labis na tinutukoy ang etnisidad o pisikal na kapitbahay.
- source_word: שְׁנֵי תְבוּאֹת
  choice: mga taon ng ani
  rationale: Literal itong tumutukoy sa “mga taon ng bunga/ani,” samakatuwid ay mga taong mapakikinabangan sa pag-aani, hindi lamang mga karaniwang taon sa kalendaryo.
- source_word: יִמְכָּר לָךְ
  choice: dapat siyang magbenta sa iyo
  rationale: Pinananatili nito ang legal at magkatugmang ugnayan ng kilos ng bumibili at nagbebenta.
