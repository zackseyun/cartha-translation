translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Jubileo” bilang kinikilalang katawagan sa Levitico 25, at pinanatili ang magkatugmang legal na anyo ng pagbili at pagbebenta.
