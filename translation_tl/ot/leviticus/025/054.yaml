base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: tl
  text: Ngunit kung hindi siya matubos sa pamamagitan ng mga ito[a], lalaya siya sa taon ng Jubileo, kasama ang kaniyang mga anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng mga ito”—tumutukoy sa mga probisyon sa pagtubos na inilarawan sa mga naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinagpapatuloy nito ang kondisyong legal mula sa naunang mga tuntunin at bahagyang ipinakikita ang pagsalungat sa mga naunang posibilidad ng pagtubos.
- source_word: לֹא יִגָּאֵל
  choice: hindi siya matubos
  rationale: Ang nifal ng גאל ay tumutukoy sa taong tinutubos o binabawi sa pamamagitan ng kamag-anak o kabayaran; pinananatili ng “matubos” ang legal at teolohikal na diwa.
- source_word: בְּאֵלֶּה
  choice: sa pamamagitan ng mga ito
  rationale: Ang demonstratibo ay tumutukoy pabalik sa mga paraang itinakda sa naunang mga talata, ngunit hindi tahasang pinapangalanan ng Hebreo ang mga iyon.
- source_word: וְיָצָא
  choice: lalaya siya
  rationale: Literal itong “lalabas siya,” ngunit sa konteksto ng paglilingkod dahil sa pagkakautang, likas na ipinahihiwatig nito ang paglaya mula sa paglilingkod.
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: sa Taon ng Jubileo
  rationale: Ginagamit ang kinikilalang terminong “Jubileo” para sa יוֹבֵל at malinaw na ipinakikita ang itinakdang panahon ng paglaya.
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: siya at ang kanyang mga anak na lalaki na kasama niya
  rationale: Pinananatili ang tahasang panlalaking בָנָיו (“mga anak na lalaki”) at ang ideya na kasama niya silang lalaya.
theological_decisions:
- issue: Ang may kasariang katawagang בָנָיו
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tahasang panlalaking maramihan ang salitang Hebreo, kaya hindi ito pinalawak sa walang-tiyak-na-kasariang “mga anak.”
- issue: Ang kahulugan ng וְיָצָא sa konteksto ng pagkaalipin o paglilingkod
  choice: lalaya siya
  alternative: lalabas siya
  rationale: Ang literal na paglabas ay tumutukoy rito sa pagkalaya mula sa nakatakdang paglilingkod; inihahatid ng “lalaya” ang legal na saysay nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na tono at ang tunay na pagiging di-tiyak ng “mga ito,” habang nilinaw sa talababa ang tinutukoy nito.
