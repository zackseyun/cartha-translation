base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: tl
  text: Ako si Yahweh, ang inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto upang ibigay sa inyo ang lupain ng Canaan at upang maging Diyos ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, ang tinutukoy rito ay ang iisang Diyos ng Israel; malinaw rin sa hulaping maramihan na ang kausap ay ang buong bayan.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: naglabas sa inyo
  rationale: Ang Hiphil ng יצא sa konteksto ng Exodo ay likas na nangangahulugang “naglabas”; tuwiran at natural ito sa Filipino.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinanatili ang tahasang אֶרֶץ, “lupain,” at ginamit ang nakaugaliang makabagong anyong “Ehipto.”
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: upang ibigay sa inyo ang lupain ng Canaan
  rationale: Ang “upang” ay nagpapahayag ng layunin ng infinitibong לָתֵת, habang pinananatili ang wika ng kaloob na tipan.
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: at maging Diyos ninyo
  rationale: Likas itong salin ng pormulang pangtipan. Ang “maging” ay kaugnay ng layunin sa naunang sugnay at hindi nagpapahiwatig ng pagbabago sa likas na pagkadiyos.
- source_word: אֲנִי
  choice: Ako si
  rationale: Sa sugnay na pagkakakilanlan na may personal na pangalan, “Ako si Yahweh” ang natural at marangal na katumbas sa Filipino.
theological_decisions:
- issue: Paglalahad sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pormulang pangtipan na לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: maging Diyos ninyo
  alternative: maging Diyos para sa inyo; maging inyong Diyos
  rationale: Pinananatili nito ang ugnayang pangtipan nang hindi ipinahihiwatig na noon lamang naging Diyos si Yahweh o nagbago ang kanyang likas na pagkatao.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “inyong/inyo/ninyo” upang ipakita na maramihan ang kausap, at pinanatili ang pag-uulit ng “lupain” mula sa Hebreo.
