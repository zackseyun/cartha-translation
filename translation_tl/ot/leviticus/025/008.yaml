  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: tl
  text: Bibilangin mo para sa sarili mo ang pitong sabat ng mga taon[a]—pitong taon nang pitong ulit. At ang kabuuang panahon ng pitong sabat ng mga taon ay magiging apatnapu't siyam na taon para sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pitong linggo ng mga taon.” Literal sa Hebreo, “pitong sabat ng mga taon,” na tumutukoy sa pitong siklong tigpipitong taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפַרְתָּ לְךָ
  choice: Bibilangin mo para sa iyong sarili
  rationale: Ang pandiwang ספר ay nangangahulugang magbilang o magtala ng sunod-sunod na yugto. Pinananatili ng pariralang ito ang tahasang לְךָ (‘para sa iyo/iyong sarili’) habang natural ang ayos sa Tagalog.
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: pitong sabat ng mga taon
  rationale: Pinananatili ang larawan at terminong Hebreo na ‘mga sabat ng mga taon,’ na tumutukoy rito sa pitong siklong tigpipitong taon at nag-uugnay sa naunang batas tungkol sa taon ng sabat.
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: pitong taon nang pitong ulit
  rationale: Malinaw at likas sa Tagalog ang paggamit ng ‘nang’ sa pagpaparami, habang pinananatili ang pag-uulit at diin ng Hebreo sa pitong yunit na tigpipitong taon.
- source_word: יְמֵי
  choice: ang mga araw ng
  rationale: Tuwirang pinananatili ang literal na ‘mga araw,’ sa halip na palitan ng ‘panahon’ o ‘yugto,’ upang mapanatili ang paraan ng pagpapahayag ng Hebreo.
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: apatnapu't siyam na taon
  rationale: Ito ang natural na makabagong ayos ng bilang sa Tagalog at eksaktong katumbas ng kabuuang apatnapu't siyam na taon.
theological_decisions:
- issue: Kahulugan ng ‘mga sabat ng mga taon’
  choice: Pinanatili sa teksto ang ‘sabat’ at ipinaliwanag sa talababa na mga siklong tigpipitong taon ang tinutukoy.
  alternative: Isalin nang tuwiran bilang ‘pitong siklong tigpipitong taon’ o ‘pitong linggo ng mga taon.’
  rationale: Pinananatili nito ang ugnayang leksikal at teolohikal sa taon ng sabat nang hindi ipinagpapalagay na literal na lingguhang Sabat ang tinutukoy. Ipinapakita rin ng talababa ang lehitimong alternatibong paglalarawan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘sabat’ bilang karaniwang anyong Tagalog ng terminong biblikal. Pinanatili ang bahagyang di-pangkaraniwang pariralang ‘mga araw ng pitong sabat ng mga taon’ upang hindi mawala ang kongkretong pananalita ng Hebreo; nilinaw naman ng kasunod na kabuuang bilang at ng talababa ang kahulugan.
