base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: tl
  text: Magtatanim kayo sa ikawalong taon at kakain mula sa dating ani hanggang sa ikasiyam na taon. Hanggang sa dumating ang ani nito, ang dating ani ang kakainin ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang dati” sa dalawang paglitaw nito; ang salitang “ani” ay ipinahihiwatig ng konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: Magtatanim kayo
  rationale: Ang Qal perfect na may prefixed conjunction ay may hinaharap na diwa sa kontekstong ito; natural itong ipinapahayag sa modernong Tagalog bilang kilos na gagawin sa ikawalong taon.
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: sa ikawalong taon
  rationale: Tuwirang salin ng ordinal na parirala, na may natural na pang-ukol sa Tagalog.
- source_word: וַאֲכַלְתֶּם
  choice: at kakain
  rationale: Pinananatili ang koordinasyon at hinaharap na diwa ng pandiwa nang hindi inuulit ang simuno, gaya ng natural sa Tagalog.
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: mula sa dating ani
  rationale: Ang תְּבוּאָה ay bunga o ani ng lupa, at ang יָשָׁן ay tumutukoy sa ani mula sa naunang pag-aani. Ang “dating ani” ay malinaw at likas sa Tagalog.
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: hanggang sa ikasiyam na taon
  rationale: Tuwirang pinananatili ang hangganang temporal ng Hebreo.
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: Hanggang sa dumating ang ani nito
  rationale: Ang בּוֹא ay literal na “dumating,” at ang hulaping pambabae sa תְּבוּאָתָהּ ay pinakamalamang na tumutukoy sa ikasiyam na taon na kababanggit lamang.
- source_word: תֹּאכְלוּ יָשָׁן
  choice: ang dating ani ang kakainin ninyo
  rationale: Inuulit ang konsepto ng יָשָׁן gaya sa Hebreo, habang idinaragdag ang “ani” na malinaw na ipinahihiwatig ng konteksto at kailangan para sa natural na Tagalog.
