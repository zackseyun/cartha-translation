  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “dating ani” sa halip na literal na “luma” upang malinaw na tumukoy sa nakaimbak na ani mula sa nakaraang taon, habang pinananatili ang pag-uulit sa Hebreo.
