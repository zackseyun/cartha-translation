base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: tl
  text: Maaari rin kayong bumili mula sa mga anak ng mga dayuhang naninirahang kasama ninyo[a], at mula sa kanilang mga pamilyang kasama ninyo—mga anak na isinilang nila sa inyong lupain; at ang mga iyon ay magiging pag-aari ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga inapo ng mga dayuhang naninirahang kasama ninyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bilang pag-aari.” Sa kontekstong legal, tumutukoy ito sa pag-aaring maaaring ipamana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם ... מֵהֶם תִּקְנוּ
  choice: Maaari rin kayong bumili mula sa
  rationale: Ipinahihiwatig ng konteksto ang pahintulot, at malinaw na komersiyal ang kahulugan ng קנה rito; natural sa Tagalog ang ayos na ito.
- source_word: מִבְּנֵי
  choice: mula sa mga anak ng
  rationale: Pinananatili ang karaniwang kahulugan ng בְּנֵי, habang ipinapaliwanag sa talababa na maaari itong tumukoy nang mas malawak sa mga inapo.
- source_word: הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: mga dayuhang naninirahang kasama ninyo
  rationale: Ipinahahayag ng magkaugnay na katawagan ang mga hindi katutubong residenteng nakikipamayan sa Israel; malinaw at kasalukuyang Tagalog ito.
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: at mula sa mga kaanak nilang kasama ninyo
  rationale: Ang מִשְׁפָּחָה ay maaaring pamilya o angkan; mas natural dito ang “mga kaanak” at hindi nito nililimitahan ang saklaw sa nukleyar na pamilya.
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: na naging anak nila sa inyong lupain
  rationale: Ipinapakita ang ugnayang salinlahi ng הוליד nang hindi gumagamit ng alanganing literalismong “ipinanganak ng mga ama”; nananatiling posible ang pagtukoy sa mga anak na isinilang o naging supling nila sa lupain.
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: at ang mga iyon ay magiging pag-aari ninyo
  rationale: Direktang inilalahad ang legal na katayuan bilang pag-aari; ang talababa ay nagpapanatili sa mas pormal na diwa ng אֲחֻזָּה bilang pag-aaring maipamamana.
theological_decisions:
- issue: Wika ng pagkaalipin at pagmamay-ari sa batas
  choice: Gamitin ang tuwirang “bumili” at “pag-aari”
  alternative: “kumuha,” “lingkod,” o mas banayad na “pag-aangkin”
  rationale: Inilalarawan ng Hebreo ang aktuwal na pagbili at legal na katayuan ng mga tao bilang pag-aari. Hindi dapat palambutin ng salin ang moral at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang pangmaramihang “kayo/ninyo” dahil maramihan ang mga anyong Hebreo. Pinanatili ang tuwirang legal na wika at iniwasan ang mga salitang nagpapalambot sa pagkaalipin.
