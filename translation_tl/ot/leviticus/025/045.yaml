  source_fidelity: Kailangang itama ang “na naging anak nila,” na hindi natural at hindi tapat sa Hiphil ng הולידו (“na kanilang naging anak/isinilang”). Ipinapahayag ng binagong teksto na ang tinutukoy ay mga anak/supling na isinilang ng mga residenteng dayuhan sa lupain ng Israel, habang pinananatili ang saklaw ng “mga pamilya/kaanak.”
  naturalness: Natural ang karamihan ng salin at ang tuwirang legal na rehistro. Ang “mga anak na isinilang nila” ay mas malinaw at idiomatiko kaysa “na naging anak nila.” Ang “mga pamilyang” ay mas tuwirang katumbas ng מִשְׁפָּחָה kaysa “mga kaanak” sa konstruksiyong ito.
  terminology: Ang “bumili” at “pag-aari” ay wastong tuwiran para sa קנה at אֲחֻזָּה sa kontekstong ito. Pinalitan sa talababa ang “pag-aangkin,” na karaniwang tumutukoy sa pag-ako o paghahabol, ng “pag-aari,” na mas angkop sa אֲחֻזָּה.
