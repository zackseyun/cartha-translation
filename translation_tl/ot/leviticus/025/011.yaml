base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: tl
  text: Jubileo ito; ang ikalimampung taon ay magiging Jubileo para sa inyo. Huwag kayong maghasik o mag-ani ng anumang kusang tumubo, at huwag din ninyong pitasin ang mga ubas mula sa mga punong ubas na hindi napungusan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹבֵל
  choice: Taon ng Jubileo
  rationale: Sa konteksto ng Levitico 25, tumutukoy ito sa natatanging taon, hindi sa tambuli. Ginamit ang nakaugaliang katawagang “Jubileo” at nilinaw na isang taon ito.
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: ang ikalimampung taon
  rationale: Natural at tumpak na katumbas sa modernong Tagalog ng pariralang Hebreo.
- source_word: תִּהְיֶה לָכֶם
  choice: ay magiging gayon para sa inyo
  rationale: Pinananatili ang hiwalay na predikasyon at ang diwang ‘para sa inyo,’ habang ang “gayon” ay tumutukoy pabalik sa Taon ng Jubileo.
- source_word: לֹא תִזְרָעוּ
  choice: Huwag kayong maghasik
  rationale: Karaniwang anyo ng tuwirang pagbabawal sa Tagalog at angkop sa legal na konteksto.
- source_word: לֹא תִקְצְרוּ אֶת סְפִיחֶיהָ
  choice: huwag ... mag-ani ng anumang kusang tumubo sa lupa
  rationale: Ang סְפִיחֶיהָ ay ani o halamang tumubo nang kusa, nang hindi inihasik. Idinagdag ang “sa lupa” bilang likas na referent ng pambabaeng hulapi sa konteksto ng taon at lupain.
- source_word: לֹא תִבְצְרוּ
  choice: huwag ... pitasin ang mga ubas
  rationale: Ang pandiwa ay partikular na tumutukoy sa pamimitas o pag-aani ng ubas; malinaw na inihihiwalay ito sa pangkalahatang pag-aani sa naunang sugnay.
- source_word: נְזִרֶיהָ
  choice: mga punong ubas na hindi napungusan
  rationale: Sa kontekstong pang-agrikultura, tumutukoy ito sa mga punong ubas na pinabayaang hindi pungusan o alagaan. Hindi ginamit ang literal na kaugnayan sa ‘nakatalaga’ sapagkat magiging malabo iyon sa Tagalog.
