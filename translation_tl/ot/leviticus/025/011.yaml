translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pagkakaiba ng paghahasik, pag-aani ng kusang tumubo, at pamimitas ng ubas. Ang bahagyang pag-uulit sa pambungad ay sinadyang panatilihin upang masalamin ang diin at estruktura ng Hebreo.
