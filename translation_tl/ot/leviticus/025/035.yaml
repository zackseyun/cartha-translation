  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: tl
  text: Kung maghirap ang kapatid mo at manghina ang kamay niya sa piling mo[b], alalayan mo siya, upang mabuhay siya sa piling mo bilang dayuhang naninirahan o pansamantalang naninirahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “alalayan mo siya—ang dayuhang naninirahan at ang pansamantalang naninirahan.” Siksik ang sintaks ng pariralang Hebreo at maaaring iugnay sa pangungusap sa ibang paraan.'
    reason: alternative_reading
  - marker: b
    text: Sa literal, “manghina ang kamay niya sa piling mo,” isang idyoma para sa pagkawala ng kabuhayan o ng kakayahang tustusan ang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Kung
  rationale: Likas na panimula ito sa Filipino para sa isang kondisyong itinakda sa batas; hindi kailangang isalin nang hiwalay ang panimulang pangatnig.
- source_word: יָמוּךְ
  choice: maghirap
  rationale: Ipinahihiwatig ng pandiwa ang pagbaba ng kalagayang pangkabuhayan o pagiging dukha. Ang “maghirap” ay malinaw at natural sa makabagong Filipino.
- source_word: אָחִיךָ
  choice: ang kapatid mo
  rationale: Pinananatili ang tahasang katawagang pampamilya ng Hebreo, na sa konteksto ay tumutukoy sa kapwa miyembro ng pamayanan.
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: at manghina ang kamay niya sa piling mo
  rationale: Pinananatili ang metapora ng kamay at ang panlipunan at malapit na diwa ng עִמָּךְ. Ipinaliliwanag sa talababa na ito ay idyoma tungkol sa pagkawala ng kakayahang tustusan ang sarili.
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: alalayan mo siya
  rationale: Ang causative na anyo ng חזק dito ay tumutukoy sa pag-alalay o pagsuporta sa isang nanghihina. Ang “alalayan” ay natural at saklaw kapwa ang praktikal at pangkabuhayang tulong.
- source_word: גֵּר
  choice: dayuhang naninirahan
  rationale: Tumutukoy sa isang hindi katutubo na naninirahan sa loob ng lipunang Israelita. Malinaw ang legal at panlipunang katayuan nang hindi gumagamit ng lipas o mapanlait na katawagan.
- source_word: וְתוֹשָׁב
  choice: pansamantalang naninirahan
  rationale: Tumutukoy sa isang naninirahang may mas pansamantala o mas limitadong katayuan, kaya naipakikita ang pagkakaiba nito sa גֵּר.
- source_word: וָחַי
  choice: upang mabuhay siya
  rationale: Ipinakikita ng “upang” ang layunin o bunga ng iniutos na pag-alalay, habang hindi labis na nilulutas ang ugnayang sintaktiko.
- source_word: עִמָּךְ
  choice: sa piling mo
  rationale: Inilalarawan nito ang taong nananatiling kasama at nasa loob ng pamayanan. Ang “sa piling mo” ay natural, marangal, at nagpapanatili sa pag-uulit ng parirala.
theological_decisions:
- issue: Saklaw ng “kapatid mo”
  choice: Panatilihin ang literal na katawagang “ang kapatid mo,” na sa konteksto ay isang kapwa kabilang sa pamayanang tipan.
  alternative: “kapwa mo Israelita” o “kamag-anak mo”
  rationale: Pinananatili nito ang wikang pangkamag-anakan ng teksto at iniiwasang palitan iyon ng mas makitid na interpretatibong katawagan.
- issue: Gampanin ng “dayuhang naninirahan at pansamantalang naninirahan”
  choice: 'Iugnay ang parirala sa katayuan o paraan ng patuloy na pamumuhay ng naghihirap na kapatid: “bilang dayuhang naninirahan o pansamantalang naninirahan.”'
  alternative: 'Unawain bilang mga karagdagang taong dapat alalayan: “alalayan mo siya—ang dayuhang naninirahan at ang pansamantalang naninirahan.”'
  rationale: Siksik at hindi ganap na tiyak ang sintaks ng Hebreo. Pinipili ng pangunahing teksto ang natural na pag-uugnay sa taong inaalalayan, ngunit inilalahad sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang metapora ng “kamay” at ang pag-uulit ng “sa piling mo,” habang gumamit ng talababa upang linawin ang idyoma at ang sintaktikong kalabuan. Inilagay ang [a] sa pariralang mismong tinatalakay nito at ang [b] sa idyomang ipinaliliwanag nito.
