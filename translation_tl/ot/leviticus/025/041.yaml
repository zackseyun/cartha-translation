  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: tl
  text: Pagkatapos, aalis siya mula sa iyo kasama ang kanyang mga anak na lalaki. Babalik siya sa kanyang angkan[a], at babalik siya sa lupang mana ng kanyang mga ninuno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamilya”; ang salitang Hebreo ay maaari ring tumukoy sa mas malawak na pangkat ng magkakamag-anak.
    reason: lexical_alternative
  - marker: b
    text: O “pag-aaring minana mula sa kanyang mga ninuno” o “minanang lupain ng kanyang mga ninuno.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: aalis
  rationale: Ang Qal perfect na may prefixed conjunction ay may sunod-sunod at panghinaharap na diwa sa kontekstong legal. Pinananatili ng “aalis” ang kongkretong pahayag ng Hebreo nang hindi tahasang ipinapasok ang paliwanag na “palalayain.”
- source_word: מֵעִמָּךְ
  choice: sa iyo
  rationale: Ang literal na diwa ay “mula sa piling mo.” Likas sa Filipino ang “aalis ... sa iyo,” na nagpapahayag ng pag-alis sa amo o sambahayan nang hindi dinaragdagan ng “sa paglilingkod sa iyo.”
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: siya ... kasama ang kanyang mga anak na lalaki
  rationale: Malinaw at likas itong Filipino habang pinananatili ang tahasang panlalaking anyo ng בָּנָיו at ang ideyang kasama niya ang kanyang mga anak.
- source_word: וְשָׁב ... יָשׁוּב
  choice: Babalik ... at babalik
  rationale: Inuulit ang “babalik” upang mapanatili ang pag-uulit at diin ng Hebreo sa pagpapanumbalik sa angkan at minanang lupain.
- source_word: מִשְׁפַּחְתּוֹ
  choice: kanyang angkan
  rationale: Sa konteksto ng pagkakamag-anak at pagmamay-ari ng lupa, maaari itong tumukoy sa mas malawak na pangkat ng magkakamag-anak kaysa sa sambahayan lamang.
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: lupaing pag-aari ng kanyang mga ninuno
  rationale: Ang אֲחֻזָּה rito ay minanang pag-aaring kaugnay ng lupain. Ang parirala ay malinaw sa modernong Filipino at pinananatili ang kaugnayan nito sa mga ninuno.
theological_decisions:
- issue: Panlalaking wika ng pagkakamag-anak
  choice: mga anak na lalaki ... mga ninuno
  alternative: mga anak ... mga ama
  rationale: Tahasang panlalaki ang בָּנָיו, kaya isinalin itong “mga anak na lalaki.” Para sa אֲבֹתָיו, ang literal na “mga ama” ay madaling mapagkamalang maraming tuwirang ama sa Filipino; ang “mga ninuno” ang likas na katumbas sa konteksto ng minanang lupa, bagaman hindi nito tahasang minamarkahan ang kasarian.
- issue: Legal na diwa ng pag-alis sa pagkaalipin dahil sa utang
  choice: aalis siya sa iyo
  alternative: palalayain siya mula sa paglilingkod sa iyo
  rationale: Inilalarawan ng konteksto ang pagpapanumbalik sa Jubileo, ngunit ang pandiwa mismo ay “lumabas/umalis.” Pinananatili ng salin ang kongkretong pananalita at hindi ginagawang tahasang teknikal na termino ang ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “angkan” para sa mas malawak na yunit ng pagkakamag-anak at inulit ang “babalik” upang mapanatili ang diin ng Hebreo. Iniwasan ang lubhang teknikal o makalumang pananalita.
