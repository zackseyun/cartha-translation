  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אוֹ דֹד֞/וֹ א֤וֹ בֶן דֹּד/וֹ֙ יִגְאָלֶ֔/נּוּ אֽוֹ מִ/שְּׁאֵ֧ר בְּשָׂר֛/וֹ מִ/מִּשְׁפַּחְתּ֖/וֹ יִגְאָלֶ֑/נּוּ אֽוֹ הִשִּׂ֥יגָה יָד֖/וֹ וְ/נִגְאָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: tl
  text: o maaari siyang tubusin ng kanyang tiyo o ng anak ng kanyang tiyo[a]; maaari rin siyang tubusin ng isa sa malalapit niyang kadugo mula sa kanyang angkan; o kung magkaroon siya ng sapat na kakayahan[b], maaari niyang tubusin ang kanyang sarili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “anak ng kanyang tiyo”; ibig sabihin, kanyang pinsan.
    reason: lexical_alternative
  - marker: b
    text: O “kung magkaroon siya ng sapat na kayamanan.” Sa literal, “kung umabot ang kanyang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: kanyang tiyo
  rationale: Sa konteksto ng batas tungkol sa pagtubos ng kamag-anak, ang salita ay tumutukoy sa tiyo, hindi sa mas malawak na kahulugang “minamahal.”
- source_word: בֶן דֹּדוֹ
  choice: anak ng kanyang tiyo
  rationale: Pinananatili nito ang tahasang ugnayang pampamilya sa Hebreo; sa karaniwang Filipino, ito ay kanyang pinsan.
- source_word: יִגְאָלֶנּוּ
  choice: maaari siyang tubusin
  rationale: Ang “tubusin” ay nagpapanatili sa mahalagang terminong legal na mula sa salitang-ugat na גאל, at ang “maaari” ay angkop sa pahintulot na ipinahihiwatig ng probisyon.
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: isa sa malalapit niyang kadugo
  rationale: Likas na ipinahahayag sa Filipino ang idyomang Hebreo tungkol sa malapit na kamag-anak sa laman o dugo.
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: mula sa kanyang angkan
  rationale: Ang “angkan” ay nagpapahiwatig ng mas malawak na pangkat ng magkakamag-anak kaysa sa sambahayan lamang.
- source_word: הִשִּׂיגָה יָדוֹ
  choice: kung magkaroon siya ng sapat na kakayahan
  rationale: Ang idyomang literal na tumutukoy sa pag-abot ng kanyang kamay ay nangangahulugang nagkaroon siya ng sapat na kayamanan o kakayahang pinansyal. Isinalin ito nang likas sa modernong Filipino at pinanatili sa talababa ang konkretong larawan.
- source_word: וְנִגְאָל
  choice: maaari niyang tubusin ang kanyang sarili
  rationale: Bagaman hindi tahasang reflexive ang anyong Hebreo, malinaw sa konteksto na maaari niyang bayaran ang sarili niyang pagtubos kapag mayroon na siyang sapat na kakayahan.
theological_decisions:
- issue: Terminong ginagamit para sa pagtubos ng kamag-anak
  choice: Gamitin ang “tubusin” para sa גאל.
  alternative: bilhing muli; palayain sa pamamagitan ng bayad
  rationale: Pinananatili ng “tubusin” ang pagkakaugnay ng legal at teolohikal na konsepto ng pagtubos sa buong kabanata nang hindi ito ginagawang purong komersiyal na transaksiyon.
- issue: Paglalahad sa idyomang הִשִּׂיגָה יָדוֹ
  choice: Isalin sa pangunahing teksto ang kahulugan bilang “magkaroon siya ng sapat na kakayahan,” at ilagay sa talababa ang literal na larawan ng kamay.
  alternative: kung umabot ang kanyang kamay; kung umunlad ang kanyang kamay
  rationale: Hindi likas at maaaring magbigay ng maling kahulugan sa Filipino ang literal na idyoma. Ang piniling salin ay malinaw tungkol sa sapat na pananalapi, habang hindi itinatago ng talababa ang larawan at saklaw ng orihinal.
- issue: Aktibo o reflexive na diwa ng וְנִגְאָל
  choice: “maaari niyang tubusin ang kanyang sarili” ayon sa konteksto
  alternative: maaari siyang matubos
  rationale: Ang naunang sugnay ay ginagawang siya mismo ang may kakayahang maglaan ng pantubos. Gayunman, ang salin ay hindi nagpapahiwatig ng espirituwal na pagtubos; nananatili ito sa legal at pangkabuhayang konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tiyo,” “kadugo,” at “angkan” bilang mga karaniwang terminong nauunawaan ngayon. Pinanatili ang legal na terminong “tubusin,” habang ipinaliwanag sa talababa ang idyomang Hebreo tungkol sa kamay.
