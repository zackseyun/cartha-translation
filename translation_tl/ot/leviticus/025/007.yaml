base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/007.yaml
  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: tl
  text: At para sa iyong mga alagang hayop at sa mababangis na hayop na nasa iyong lupain, ang lahat ng ani nito ay para sa pagkain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: para sa iyong mga alagang hayop
  rationale: Tumutukoy ang בְּהֵמָה sa mga domestikadong hayop ng kausap; malinaw itong ipinaiiba sa sumusunod na mababangis na hayop.
- source_word: לַחַיָּה
  choice: sa mababangis na hayop
  rationale: Sa pagtutunggali nito sa mga alagang hayop, tumutukoy ang חַיָּה sa mga hayop na hindi domestikado.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: na nasa iyong lupain
  rationale: Pinananatili ng “lupain” ang kongkreto at agrikultural na diwa ng אֶרֶץ, at ang sugnay ay natural na naglalarawan sa mababangis na hayop.
- source_word: תִּהְיֶה
  choice: ay magiging
  rationale: Ipinapahayag ng היה rito ang itinakdang gamit o kalagayan ng ani sa konteksto ng utos.
- source_word: כָּל תְּבוּאָתָהּ
  choice: ang lahat ng ani nito
  rationale: Ang תְּבוּאָה ay ani o bunga ng lupain, at ang hulaping pambabae ay tumutukoy pabalik sa lupain.
- source_word: לֶאֱכֹל
  choice: pagkain
  rationale: Ang infinitive na may ל ay nagsasaad ng layunin o gamit; natural sa modernong Tagalog ang “magiging pagkain.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang legal na tono nang hindi gumagamit ng lipas o labis na teknikal na pananalita. Hindi isinama ang footnote ng English consultation layer dahil tila hindi tugma ang marker nito sa “livestock”; ang leksikal na alternatibo para sa huling parirala ay sapat na kinakatawan ng tuwirang saling “magiging pagkain.”
