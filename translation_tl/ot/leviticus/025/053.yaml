  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: tl
  text: Tulad ng isang upahang manggagawa, taon-taon ay magiging kasama niya siya; hindi siya paghaharian nang may kalupitan sa harap ng iyong mga mata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: tulad ng isang upahang manggagawa
  rationale: Ang prefiks na כְּ ay naghahayag ng paghahambing, at ang שָׂכִיר ay isang taong nagtatrabaho kapalit ng upa, hindi alipin. Likas at malinaw sa modernong Filipino ang “upahang manggagawa.”
- source_word: שָׁנָה בְּשָׁנָה
  choice: taun-taon
  rationale: Ipinahahayag ng idyoma ang kalagayang sinusukat o nagpapatuloy bawat taon; maikli at natural ang “taun-taon.”
- source_word: יִהְיֶה עִמּוֹ
  choice: habang kasama niya
  rationale: Payak na “magiging/kasama niya” ang Hebreo. Ginamit ang “habang kasama niya” upang maging natural ang pangungusap nang hindi idinaragdag ang di-hayag na “maglilingkod” o “mananatili.”
- source_word: לֹא יִרְדֶּנּוּ
  choice: hindi siya paghaharian
  rationale: Ang רדה ay nangangahulugang mamahala o maghari sa isang tao. Pinananatili ng “paghaharian” ang ideya ng paggamit ng kapangyarihan o pamumuno laban sa kanya.
- source_word: בְּפֶרֶךְ
  choice: nang may kalupitan
  rationale: Tumutukoy ang pangngalan sa malupit at mabigat na pagtrato, lalo na sa sapilitang paggawa. Malinaw ang “nang may kalupitan” kasunod ng “paghaharian.”
- source_word: לְעֵינֶיךָ
  choice: sa harap ng iyong mga mata
  rationale: Malapit ito sa literal na larawan ng Hebreo at malinaw na tumutukoy sa pagtratong nakikita at nasasaksihan ng kinakausap.
theological_decisions:
- issue: Kalagayan ng Israelitang nasa ilalim ng isang dayuhang amo
  choice: Inilarawan siya sa paghahambing bilang isang upahang manggagawa, hindi tinawag na alipin sa talatang ito.
  alternative: Ituring na isang upahang lingkod.
  rationale: Inihahambing ng כִּשְׂכִיר ang kanyang taunang kalagayan sa isang upahang manggagawa at binibigyang-diin ang legal na proteksiyon laban sa malupit na pamumuno. Hindi nito ikinakaila ang mas malawak na konteksto ng pagkakabenta sa paglilingkod, ngunit hindi rin nito ipinapasok ang mas matinding diwang hindi taglay ng שׂכיר.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang legal na tono, ang paghahambing sa upahang manggagawa, at ang matingkad na idyomang “sa harap ng iyong mga mata.”
