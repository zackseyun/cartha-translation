  - severity: medium
    issue: Hindi sapat na naisasalin ng “habang kasama niya” ang יִהְיֶה עִמּוֹ.
    rationale: Ang “habang” ay nagdaragdag ng diwang temporal, samantalang ang Hebreo ay may payak na pandiwang “magiging.” Nagiging malabo rin ang ugnayan ng mga panghalip.
  revised_text: Tulad ng isang upahang manggagawa, taon-taon ay magiging kasama niya siya; hindi siya paghaharian nang may kalupitan sa harap ng iyong mga mata.
