base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: tl
  text: Ngunit ang mga bahay sa mga nayon na walang pader sa palibot ay ituturing na gaya ng bukirin[a]. Maaaring tubusin ang mga ito, at sa Taon ng Jubileo ay mapapalaya ang mga ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibibilang na bukirin ng lupain.” Ibig sabihin, sa usaping legal, ang mga bahay na ito sa mga nayong walang pader ay tinatratong tulad ng lupang sakahan, hindi tulad ng mga bahay sa lungsod na may pader.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at sa Jubileo ay lalabas ito”; ibig sabihin, mapapalaya o maibabalik ang ari-arian sa Taon ng Jubileo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: ang mga bahay sa mga nayon
  rationale: Ang חֲצֵרִים ay tumutukoy rito sa mga nayon o pamayanang rural; natural sa modernong Tagalog ang “mga bahay sa mga nayon,” habang hayagang binabanggit sa kasunod na sugnay ang kawalan ng pader.
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: na walang pader sa palibot
  rationale: Tuwirang ipinapahayag nito na ang mga nayon ay hindi napalilibutan ng pader, at malinaw na naisasalin ang סָבִיב bilang “sa palibot.”
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: ay ituturing na tulad ng bukirin sa lupain
  rationale: Pinananatili ang legal na pag-uuri at ang kongkretong larawan ng שְׂדֵה הָאָרֶץ, sa halip na gawing mas malawak na “kanayunan.” Idinagdag ang “tulad ng” upang maging likas sa Tagalog ang diwang ‘ibibilang bilang/kasama ng.’
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: Maaaring tubusin ang mga iyon
  rationale: Ipinahahayag nito na nananatiling maaaring tubusin ang gayong mga bahay o ari-arian. Ang maramihang “mga iyon” ay sumusunod sa natural na antecedent sa Tagalog, bagaman isahan ang panghalip sa Hebreo dahil tinatrato ang ari-arian bilang isang legal na uri.
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: at sa Taon ng Jubileo ay palalayain ang mga iyon
  rationale: Sa kontekstong legal, ang literal na ‘lalabas’ ay tumutukoy sa pagkalaya o pagbabalik ng ari-arian sa Jubileo. Ang “palalayain” ay natural at nauugnay sa terminolohiya ng Jubileo, habang ipinapaliwanag sa talababa ang tiyak na epekto sa ari-arian.
theological_decisions:
- issue: Kahulugan ng יֵצֵא kaugnay ng ari-arian sa Jubileo
  choice: palalayain ang mga iyon
  alternative: lalabas ang mga iyon / ibabalik ang mga iyon
  rationale: Hindi literal na gumagalaw ang mga bahay; ang pandiwa ay legal na idyoma para sa paglaya o pagbabalik mula sa pagkakabili. Pinananatili ng “palalayain” ang mahalagang konsepto ng Jubileo nang hindi pinipili nang tahasan kung kanino ibinabalik sa mismong pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Taon ng Jubileo” bilang pamilyar na terminong biblikal; iniwasan ang sobrang literal na “lalabas” sa pangunahing teksto dahil malabo iyon para sa karaniwang mambabasa, ngunit pinanatili sa talababa.
