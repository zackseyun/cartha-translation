  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: tl
  text: Ngunit sa ikapitong taon, magkakaroon ang lupain ng isang sabbath ng ganap na kapahingahan[a], isang sabbath para kay Yahweh. Huwag mong hasikan ang iyong bukid, at huwag mong pungusan ang iyong ubasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sabbath ng taimtim na kapahingahan.” Pinatitindi ng pananalitang Hebreo ang diwa ng ganap na pagtigil sa gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: Ngunit sa ikapitong taon
  rationale: Ipinahihiwatig ng ו ang pagsalungat sa anim na taong pagtatanim sa naunang talata; natural itong ipinapahayag sa Tagalog sa pamamagitan ng “Ngunit.”
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: sabbath na lubos na kapahingahan
  rationale: Pinananatili ng “sabbath” ang mahalagang konseptong Hebreo, habang ipinahahayag ng “lubos na kapahingahan” ang mariing diwa ng שַׁבָּתוֹן bilang ganap na pagtigil sa gawain.
- source_word: יִהְיֶה לָאָרֶץ
  choice: magkakaroon ang lupain
  rationale: Natural na Tagalog ito para sa Hebreong pahayag na ang gayong kapahingahan ay nakalaan sa lupain, nang hindi inaalis ang lupain bilang nakikinabang dito.
- source_word: שַׁבָּת לַיהוָה
  choice: isang sabbath para kay Yahweh
  rationale: Ipinakikita ng “para kay” ang pag-aalay o pagtatalaga ng sabbath kay Yahweh.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh,” ayon sa ibinigay na pasiyang teolohikal at sa tahasang anyo ng tekstong Hebreo.
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: Huwag mong hasikan ang iyong bukid
  rationale: Direkta at likas na utos sa modernong Tagalog; ang “hasikan” ay tumutukoy sa paghahasik ng binhi sa bukid.
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: at huwag mong tabasan ang iyong ubasan
  rationale: Sa konteksto ng ubasan, ang זמר ay pagputol o pruning ng mga sanga; “tabasan” ang malinaw at karaniwang katumbas sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalang tipan ang יְהוָה sa pinagmulang teksto. Ang “Yahweh” ay tuwirang pinananatili ito at umaayon sa ibinigay na na-update na pasiyang teolohikal.
- issue: Katangian ng kapahingahan ng lupain
  choice: sabbath na lubos na kapahingahan
  alternative: sabbath ng taimtim na kapahingahan
  rationale: Hindi ito ipinakahulugan lamang bilang lingguhang araw ng pagsamba; pinananatili ang sabbath bilang banal na ganap na pagtigil ng gawaing pansakahan para sa lupain.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “sabbath” upang mapanatili ang natatanging konseptong biblikal, at ang pang-isahang “mong” upang tumbasan ang ikalawang panauhang panlalaki na pang-isahan sa legal na utos ng Hebreo.
