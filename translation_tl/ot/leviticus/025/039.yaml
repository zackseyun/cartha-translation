  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: tl
  text: At kung maghirap ang kapatid mong kasama mo at maipagbili siya sa iyo[b], huwag mo siyang pagtrabahuhin sa gawaing pang-alipin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag mo siyang paglingkurin ng paglilingkod ng isang alipin.”
    reason: lexical_alternative
  - marker: b
    text: O, “at ipagbili niya ang sarili niya sa iyo.” Maaaring isalin nang pasibo ang Hebreo; sa kontekstong ito, maaari itong tumukoy sa pagbebenta ng sarili dahil sa kahirapan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay at ang kondisyon sa natural na modernong Tagalog.
- source_word: יָמוּךְ
  choice: maghirap
  rationale: Ipinahihiwatig ng pandiwa ang pagkasadlak o paglagay sa kahirapan; maikli at likas ang “maghirap.”
- source_word: אָחִיךָ
  choice: ang kapatid mo
  rationale: Pinananatili ang literal na katawagang pampamilya, na sa konteksto ay maaaring tumukoy sa kapuwa kabilang sa Israel.
- source_word: עִמָּךְ
  choice: na kasama mo
  rationale: Pinananatili ang kaugnayan sa kausap nang hindi dinaragdagan ang di-tiyak na lokatibong detalye.
- source_word: וְנִמְכַּר לָךְ
  choice: at ipagbili niya ang kanyang sarili sa iyo
  rationale: Ipinapahayag ang idiomatikong diwa ng Niphal sa konteksto ng kusang pagbebenta ng sarili dahil sa karalitaan, habang itinatala sa talababa ang posibleng pasibong anyo.
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: huwag mo siyang paglingkurin
  rationale: Natural na ipinahahayag ang pagbabawal na pagtrabahuhin o papaglingkurin siya.
- source_word: עֲבֹדַת עָבֶד
  choice: na gaya ng isang alipin
  rationale: Malinaw na ipinapakita ang ipinagbabawal na uri o kalagayan ng paglilingkod at hindi ito pinapahina bilang karaniwang paglilingkod lamang.
theological_decisions:
- issue: Katawagan sa kalagayang panlipunan sa batas tungkol sa paglilingkod dahil sa utang
  choice: “na gaya ng isang alipin”
  alternative: “na gaya ng isang lingkod” o “sa gawaing pang-alipin”
  rationale: Ang עֶבֶד at ang pariralang עֲבֹדַת עָבֶד ay tumutukoy sa kalagayan at paggawa ng alipin, hindi lamang sa pangkalahatang paglilingkod. Hindi itinatanggi ng talata ang isang anyo ng paglilingkod; ipinagbabawal nitong ituring ang naghikahos na kapatid bilang alipin.
- issue: Aktibo o pasibong pagpapahayag ng וְנִמְכַּר לָךְ
  choice: “ipagbili niya ang kanyang sarili sa iyo”
  alternative: “maipagbili siya sa iyo”
  rationale: Ang kontekstong legal ng karalitaan ay sumusuporta sa idiomatikong pagbebenta ng sarili, ngunit tunay na pasibo ang anyong Hebreo kaya pinananatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang “kapatid” sa halip na ipakahulugang “kapuwa Israelita,” at ginamit ang “alipin” upang hindi mapahina ang lakas ng terminong panlipunan.
