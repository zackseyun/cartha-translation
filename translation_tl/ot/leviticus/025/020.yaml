base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: tl
  text: At kung sasabihin ninyo, “Ano ang kakainin namin sa ikapitong taon, yamang hindi kami maghahasik ni magtitipon ng aming ani?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי תֹאמְרוּ
  choice: At kung sasabihin ninyo
  rationale: Pinananatili ang kondisyonal na tanong at ang maramihang kausap.
- source_word: מַה נֹאכַל
  choice: Ano ang kakainin namin
  rationale: Likas na modernong Tagalog para sa tuwirang tanong tungkol sa ikabubuhay.
- source_word: בַּשָּׁנָה הַשְּׁבִיעִת
  choice: sa ikapitong taon
  rationale: Tuwirang katumbas ng pariralang Hebreo.
- source_word: הֵן לֹא נִזְרָע
  choice: yamang hindi kami maghahasik
  rationale: Ang הֵן ay gumaganap dito bilang panimula sa batayan ng tanong; natural itong ipinahahayag na 'yamang.' Ang imperfect ay angkop na hinaharap sa konteksto.
- source_word: וְלֹא נֶאֱסֹף אֶת תְּבוּאָתֵנוּ
  choice: ni magtitipon ng aming ani
  rationale: Ang 'ni' ay natural na nag-uugnay ng dalawang negatibong kilos; ang תְּבוּאָה ay tumutukoy sa ani o bunga ng lupa sa kontekstong agrikultural.
