translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “yamang” upang likas na maipakita na ang hindi paghahasik at pag-aani ang dahilan ng tanong, habang pinananatili ang retorikal na tensiyon ng talata.
