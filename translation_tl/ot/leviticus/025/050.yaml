  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: tl
  text: Kasama ng bumili sa kanya, kukuwentahin niya mula sa taon nang ipagbili niya ang sarili niya sa kanya hanggang sa taon ng Jubileo[a]. Ang halagang ibinayad para sa kanya ay ibabatay sa bilang ng mga taon; sa kanya, maglilingkod siya gaya ng isang upahang manggagawa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “mula sa taon ng pagkabili sa kanya nito.” Mas pormal at balintiyak ang pananalita sa Hebreo, ngunit ipinakikita ng konteksto na ipinagbili ng lalaki ang sarili niya upang manilbihan.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “gaya ng mga araw ng isang upahang manggagawa, siya ay magiging kasama niya.” Ang paghahambing ay naglalarawan ng kanyang paninilbihan sa mamimili bilang gaya ng sa isang upahang manggagawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: kukuwentahin niya
  rationale: Tumutukoy ang pandiwa sa pagkalkula o pagtutuos ng halagang kaugnay ng pagtubos. Ang “kukuwentahin” ay malinaw at natural sa makabagong Filipino.
- source_word: עִם קֹנֵהוּ
  choice: kasama ng bumili sa kanya
  rationale: Pinananatili nito ang pagtutuos na ginagawa kasama ng taong bumili sa kaniya, nang hindi gumagamit ng mas teknikal at di-gaanong natural na “mamimili” o “tagabili.”
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: mula sa taon nang ipagbili niya ang sarili niya rito
  rationale: Ang konteksto ay kusang pagbebenta ng sarili upang manilbihan dahil sa kahirapan. Natural itong naihahayag sa Filipino, habang inilalahad sa talababa ang mas pormal na anyong balintiyak.
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: hanggang sa taon ng Jubileo
  rationale: Ginagamit ang “Jubileo” bilang nakikilalang pangalan ng institusyong itinatakda sa kabanatang ito.
- source_word: כֶּסֶף מִמְכָּרוֹ
  choice: halaga ng pagbebenta niya sa sarili
  rationale: Bagaman literal na “salapi” ang כֶּסֶף, tumutukoy ito rito sa halagang pinansiyal ng transaksiyon. Nililinaw rin ng parirala ang kontekstuwal na pagbebenta ng sarili sa paglilingkod.
- source_word: בְּמִסְפַּר שָׁנִים
  choice: ibabatay sa bilang ng mga taon
  rationale: Ipinapahayag nito na ang halaga ay tutuusin nang ayon o katumbas ng bilang ng mga taon.
- source_word: כִּימֵי שָׂכִיר
  choice: tulad ng sa isang upahang manggagawa
  rationale: Ang שָׂכִיר ay isang manggagawang naglilingkod kapalit ng upa o sahod. Iniiwasan ng salin ang pahiwatig ng permanenteng pag-aari.
- source_word: יִהְיֶה עִמּוֹ
  choice: ang paninilbihan niya rito ay ituturing
  rationale: Ipinahahayag sa natural na Filipino ang kalagayan ng taong kasama ng bumili sa kaniya; ang “paninilbihan” ay malinaw mula sa legal na konteksto, ngunit ang mas literal na anyo ay pinananatili sa talababa.
theological_decisions:
- issue: Katayuan ng Israelitang ipinagbili ang sarili
  choice: Inilarawan ang panahon niya sa bumili sa kaniya bilang paninilbihang katulad ng sa upahang manggagawa.
  alternative: Isalin nang literal bilang “makakasama niya siya gaya ng mga araw ng isang upahang manggagawa.”
  rationale: Ipinakikita ng paghahambing sa שָׂכִיר na ang halaga at panahon ay dapat ituring bilang may takdang paninilbihan, hindi tahimik na ipakahulugan bilang permanenteng pagmamay-ari. Gayunman, hindi dinaragdagan ng salin ang talata ng isang sistematikong paliwanag tungkol sa institusyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang “kukuwentahin,” “halaga,” at “upahang manggagawa” bilang mga karaniwang salitang nauunawaan sa legal-ekonomikong konteksto. Ginamit ang “rito” upang tukuyin ang bumili sa kanya at maiwasan ang paulit-ulit na “sa kanya,” habang nananatiling malinaw ang mga tauhan.
