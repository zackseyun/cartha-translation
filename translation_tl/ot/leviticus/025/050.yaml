revisions:
- from: Kasama ng bumili sa kanya, kukuwentahin niya ang panahon mula sa taon nang ipagbili niya ang sarili niya rito[a] hanggang sa taon ng Jubileo. Ang halaga ng pagbebenta niya sa sarili ay ibabatay sa bilang ng mga taon; ang paninilbihan niya rito ay ituturing na tulad ng sa isang upahang manggagawa.[b]
  to: Kasama ng bumili sa kanya, kukuwentahin niya mula sa taon nang ipagbili niya ang sarili niya sa kanya hanggang sa taon ng Jubileo[a]. Ang halagang ibinayad para sa kanya ay ibabatay sa bilang ng mga taon; sa kanya, maglilingkod siya gaya ng isang upahang manggagawa.[b]
  rationale: Inayos ang maling deiktikong “rito” tungo sa “sa kanya,” ginawang mas natural ang pagtukoy sa halaga ng transaksiyon, at pinalitan ang interpretibong “ituturing” ng tuwirang paglalarawan ng paglilingkod sa mamimili gaya ng isang upahang manggagawa. Pinanatili ang maingat na kontekstuwal na pagpapaliwanag sa talababa nang hindi nagdaragdag ng doktrinal na pagbasa.
