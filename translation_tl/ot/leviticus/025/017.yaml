  text: וְ/לֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת עֲמִית֔/וֹ וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: tl
  text: Huwag ninyong pagsamantalahan ang inyong kapwa[a]. Sa halip, matakot kayo sa inyong Diyos, sapagkat ako si Yahweh na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawan ng mali” o “apihin.” Ang pandiwang Hebreo ay maaaring tumukoy sa di-makatarungang pananamantala sa kapwa sa mga ugnayang panlipunan o pangkabuhayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: pagsamantalahan
  rationale: Sa kontekstong legal at pangkabuhayan ng Jubileo, tumutukoy ang pandiwa sa di-makatarungang pananamantala o pagkuha ng bentaha laban sa kapwa. Likas at malinaw sa modernong Filipino ang “pagsamantalahan,” habang nananatiling sapat na malawak para sa panlipunan at pang-ekonomiyang pakikitungo.
- source_word: אִישׁ אֶת עֲמִיתוֹ
  choice: ang inyong kapwa
  rationale: Bagaman literal na distributibo ang parirala, “bawat lalaki sa kaniyang kapwa,” likas na ipinapahayag sa Tagalog ang pangkalahatang pagbabawal sa pamamagitan ng maramihang “ninyo” at “inyong kapwa.” Hindi nito nililimitahan ang utos sa mga lalaki lamang at tumutugma ito sa maramihang sambayanang kinakausap sa kabuuan ng talata.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: Sa halip, matakot kayo sa inyong Diyos
  rationale: Ang וְ ay nag-uugnay ng positibong tungkulin bilang salungat sa naunang pagbabawal. Nililinaw ng “Sa halip” ang ugnayang ito nang hindi binabago ang diwa. Pagkatapos ng ירא, ang מן ay idyomatikong nagmamarka sa kinatatakutang Diyos, kaya hindi ito isinasaling “mula sa.”
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ng “sapagkat” ang sanhi o batayan ng utos at ang marangal na himig ng pormulang tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ang hulaping maramihan ay tumutukoy sa buong sambayanang kinakausap; natural itong naihahayag sa Filipino bilang “inyong Diyos.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Distributibong panlalaking anyo sa אִישׁ
  choice: Huwag ninyong ... ang inyong kapwa
  alternative: Huwag pagsamantalahan ng sinumang lalaki ang kaniyang kapwa
  rationale: Ang אִישׁ ay panlalaki sa gramatika ngunit distributibo at kinatawan ang gamit. Sa natural na Tagalog, ang maramihang ikalawang panauhan ay tumpak na naghahatid ng utos sa bawat kaanib ng sambayanan nang hindi nagdaragdag ng limitasyong hindi hinihingi ng konteksto.
- issue: Saklaw ng pagbabawal sa תוֹנוּ
  choice: pagsamantalahan
  alternative: gawan ng mali o apihin
  rationale: Ang konteksto ng mga probisyon tungkol sa lupa, pagbili, at Jubileo ay nagbibigay ng malinaw na pangkabuhayang kulay, ngunit hindi dapat paliitin sa pandaraya lamang. Sinasaklaw ng “pagsamantalahan” ang di-makatarungang pagkuha ng bentaha.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang maramihang “ninyo/kayo/inyong” upang natural na maipakita ang pagbabago sa Hebreo mula sa distributibong pagbabawal tungo sa tuwirang pakikipag-usap sa sambayanan. Ang “Sa halip” ay nagpapahayag sa kontrast na ipinahihiwatig ng pang-ugnay.
