id: LEV.25.19
reference: Leviticus 25:19
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָתְנָ֤ה הָ/אָ֨רֶץ֙ פִּרְיָ֔/הּ וַ/אֲכַלְתֶּ֖ם לָ/שֹׂ֑בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח עָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/019.yaml
  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: tl
  text: Magbubunga ang lupain, at kakain kayo hanggang mabusog. Maninirahan kayo roon nang ligtas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mamumuhay kayo roon nang ligtas.”
    reason: Pinananatili ang leksikal na posibilidad ng וִישַׁבְתֶּם bilang ‘mamuhay’ o ‘manirahan.’
lexical_decisions:
- source_word: וְנָתְנָה
  choice: Magbubunga
  rationale: Literal na ‘magbibigay,’ ngunit dahil lupain ang simuno at bunga nito ang layon, likas sa modernong Tagalog ang ‘magbubunga’ para sa pagluwal ng ani.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy sa partikular na lupaing tinitirhan at sinasaka sa konteksto ng Levitico 25, hindi sa buong daigdig.
- source_word: פִּרְיָהּ
  choice: '[nakapaloob sa pandiwang] magbubunga'
  rationale: Ang פְּרִי ay ‘bunga’ at maaari ring tumukoy sa ani. Pinagsama sa pandiwang ‘magbubunga’ upang maging natural sa Tagalog nang hindi mawala ang konkretong larawan.
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: at kakain kayo hanggang mabusog
  rationale: Malinaw at likas na ipinahahayag ang pagkain hanggang sa ganap na kasiyahan o pagkabusog.
- source_word: וִישַׁבְתֶּם
  choice: Maninirahan kayo
  rationale: Ang ישׁב ay maaaring mangahulugang ‘tumira’ o ‘mamuhay’ sa isang lugar; ipinahahayag ng ‘maninirahan’ ang matatag na paninirahan sa lupain.
- source_word: לָבֶטַח
  choice: nang ligtas
  rationale: Ipinahahayag ang kalagayan ng kapanatagan at seguridad habang naninirahan.
- source_word: עָלֶיהָ
  choice: roon
  rationale: Bumabalik sa ‘lupain.’ Mas natural sa Tagalog ang ‘roon’ kaysa sa literal na ‘sa ibabaw nito’ sa konteksto ng paninirahan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple at marangal. Ginamit ang ‘lupain’ para sa kontekstuwal na saklaw, at hinati sa dalawang pangungusap upang maging malinaw at natural habang pinananatili ang pagkakasunod ng mga pahayag sa Hebreo.
