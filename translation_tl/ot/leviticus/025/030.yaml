  text: וְ/אִ֣ם לֹֽא יִגָּאֵ֗ל עַד מְלֹ֣את ל/וֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠/קָם הַ/בַּ֨יִת אֲשֶׁר בָּ/עִ֜יר אֲשֶׁר לא חֹמָ֗ה לַ/צְּמִיתֻ֛ת לַ/קֹּנֶ֥ה אֹת֖/וֹ לְ/דֹרֹתָ֑י/ו לֹ֥א יֵצֵ֖א בַּ/יֹּבֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: tl
  text: Ngunit kung hindi ito matubos bago matapos ang isang buong taon, ang bahay na nasa isang lunsod na walang pader ay magiging permanenteng pag-aari ng bumili nito, sa lahat ng salinlahi niya[a]. Hindi ito babalik sa Taon ng Jubileo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “ang bahay ay mananatili nang permanente.” Ipinahihiwatig ng idyomang Hebreo na ang bentahan ay legal nang tiyak at hindi na mababawi.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi na babalik ang bahay sa dating pamilya nito pagdating ng Taon ng Jubileo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: matubos
  rationale: Pinananatili nito ang legal na terminolohiya ng גאל sa Levitico 25, habang likas pa rin sa Filipino ang diwang mabili o mabawi muli.
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: bago matapos ang isang buong taon
  rationale: Malinaw nitong ipinapahayag ang taning na isang kumpletong taon nang hindi labis na tinutukoy kung mula sa pagbebenta o para sa bahay.
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: ay magiging permanenteng pag-aari
  rationale: Ang literal na 'tatayo' ay malabo sa Filipino; sa kontekstong legal, ang pagbebenta o pagmamay-ari ay nagiging tiyak at di na mababawi.
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לֹא חֹמָה
  choice: ang bahay na nasa isang lunsod na walang pader
  rationale: Malapit ito sa pinalawak na anyo ng Hebreo at malinaw sa karaniwang mambabasa.
- source_word: לַקֹּנֶה אֹתוֹ
  choice: ng bumili nito
  rationale: Natural na Filipino para sa 'sa bumili nito' sa loob ng pariralang nagsasaad ng permanenteng pag-aari.
- source_word: לְדֹרֹתָיו
  choice: at ng salinlahi niya
  rationale: Ipinahihiwatig nito ang namamanang pagpapatuloy sa angkan ng bumili nang hindi nililimitahan sa agarang mga anak lamang.
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: Hindi na ito ibabalik sa Taon ng Jubileo
  rationale: 'Ipinapahayag nito ang legal na diwa ng literal na ''hindi lalabas'': hindi babalik ang bahay sa dating may-ari o pamilya sa Jubileo.'
- source_word: יּוֹבֵל
  choice: Taon ng Jubileo
  rationale: Ito ang malinaw at nakaugaliang terminong biblikal sa Filipino para sa institusyong inilalarawan sa Levitico 25.
theological_decisions:
- issue: Legal na bisa ng pagbebenta ng bahay sa lunsod na walang pader
  choice: Kapag hindi natubos sa loob ng isang buong taon, nagiging permanente at namamana sa angkan ng bumili ang pag-aari, at hindi ito bumabalik sa Jubileo.
  alternative: Panatilihin ang mas literal ngunit malabong 'mananatiling nakatayo' at 'hindi lalabas sa Jubileo.'
  rationale: Magkakasamang ipinahihiwatig ng וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו, at לֹא יֵצֵא בַּיּוֹבֵל ang tiyak at permanenteng paglilipat ng pag-aari. Hindi ito nagdaragdag ng doktrina sa labas ng batas tungkol sa ari-arian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'lunsod' at 'Taon ng Jubileo' bilang pormal ngunit madaling maunawaang katawagan; ipinaliwanag sa mga talababa ang mga literal na idyomang legal ng Hebreo.
