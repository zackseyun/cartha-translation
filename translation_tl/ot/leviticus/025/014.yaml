  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: tl
  text: Kapag nagbenta kayo ng anumang bagay sa inyong kapwa, o bumili mula sa inyong kapwa, huwag samantalahin ng sinuman ang kanyang kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “huwag ninyong gawan ng mali ang isa’t isa.” Ang pandiwa ay maaaring tumukoy sa di-makatarungang pagtrato o pagsasamantala sa kapwa, lalo na sa kalakalan. Ang “kapatid” dito ay kapwa miyembro ng pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Kapag
  rationale: Sa kasong legal, ipinakikilala nito ang isang sitwasyong maaaring mangyari; natural sa Filipino ang “kapag” at saklaw nito ang kondisyunal na diwa.
- source_word: תִמְכְּרוּ מִמְכָּר
  choice: nagbenta kayo ng anumang bagay
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa isang bagay na ipinagbibili o transaksiyon ng pagbebenta; malinaw at likas sa Filipino ang pariralang ito.
- source_word: לַעֲמִיתֶךָ ... עֲמִיתֶךָ
  choice: sa inyong kapwa ... mula sa inyong kapwa
  rationale: Ang עָמִית ay kapwa miyembro ng pamayanan. Pinanatili ang pag-uulit ng Hebreo at ginamit ang “kapwa,” na mas angkop kaysa “kapitbahay” sa kontekstong ito.
- source_word: אוֹ קָנֹה מִיַּד
  choice: o bumili mula sa
  rationale: Ang infinitive absolute ay gumaganap na kaagapay ng naunang pandiwa. Ang idyomang “mula sa kamay” ay tumutukoy sa pinagmulan ng binili at hindi kailangang isalin nang literal sa Filipino.
- source_word: אַל תּוֹנוּ
  choice: huwag dayain
  rationale: Sa konteksto ng kalakalan, ang ינה ay tumutukoy sa paggawa ng mali o di-makatarungang panlalamang. Ang “dayain” ay malinaw at angkop sa transaksiyon, habang ipinapaliwanag sa talababa ang mas malawak na posibilidad.
- source_word: אִישׁ אֶת אָחִיו
  choice: ng sinuman ang kanyang kapatid
  rationale: Pinananatili nito ang paisa-isang, distributibong anyo ng pagbabawal at ang salitang “kapatid,” na dito ay tumutukoy sa kapwa miyembro ng bayan.
theological_decisions:
- issue: Mga panlalaking katawagan na may kinatawang gamit sa batas
  choice: Isalin ang אִישׁ bilang “sinuman” at ang אָחִיו bilang “kanyang kapatid”
  alternative: “huwag ninyong dayain ang isa’t isa”
  rationale: Walang kasariang gramatikal ang “sinuman,” “kanyang,” at “kapatid” sa Filipino. Napapanatili ng salin ang isahang distributibong porma at ang larawang magkakapatid sa tipan nang hindi nagpapasok ng di-likas na pagtukoy sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapwa” sa halip na “kapitbahay” upang ipakita ang ugnayan sa loob ng pamayanan, at pinanatili ang “kapatid” upang maipahayag ang pagkakaisang panlipunan ng orihinal.
