  source_fidelity: 'Napananatili ng draft ang paksa ng mga lungsod ng Levita, ang mga bahay sa mga lungsod na kanilang pag-aari, at ang natatanging patuloy na karapatan sa pagtubos. Gayunman, mali ang pagkakaugnay ng pandiwa sa pangunahing pangungusap: ang ‘mga bahay’ ang nagiging tila may ‘karapatang tubusin,’ samantalang ang karapatan ay para sa mga Levita.'
  naturalness: Hindi natural at hindi malinaw ang ‘ang mga bahay ... ay magkakaroon ng karapatang tubusin magpakailanman.’ Inaayos ng rebisyon ang gumaganap ng pagtubos at inilalagay ang legal na diwa sa likas na modernong Tagalog.
  terminology: 'Ang ‘Levita,’ ‘lungsod,’ at ‘tubusin’ ay angkop. Ginamit ang ‘sa anumang panahon’ para sa עוֹלָם sa legal na konteksto: patuloy na bukas ang karapatan, nang hindi nagpapahiwatig ng isang aktuwal na pagtubos na walang katapusan.'
