  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: tl
  text: Tungkol naman sa mga lungsod ng mga Levita, ang mga bahay sa mga lungsod na kanilang pag-aari ay maaaring tubusin ng mga Levita sa anumang panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas pormal, “Ang karapatang tumubos magpakailanman ay para sa mga Levita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָרֵי
  choice: Tungkol naman sa mga lungsod
  rationale: Ipinahihiwatig ng pangatnig at pangngalan ang paglipat sa isang bagong kaso sa loob ng batas; natural itong naipapahayag sa makabagong Tagalog sa pamamagitan ng “Tungkol naman sa.”
- source_word: הַ/לְוִיִּם
  choice: ng mga Levita
  rationale: Ipinapakita ng ugnayang construct na ang mga lungsod ay nauugnay o nakatalaga sa mga Levita.
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: ang mga bahay sa mga lungsod na pag-aari nila
  rationale: Ang literal na “mga bahay ng mga lungsod ng kanilang pag-aari” ay hindi natural sa Tagalog. Nililinaw ng “sa” na ang tinutukoy ay mga bahay na nasa mga lungsod na hawak ng mga Levita, habang pinananatili ang legal na diwa ng אֲחֻזָּה.
- source_word: גְּאֻלַּת
  choice: karapatang tubusin
  rationale: Ang pangngalang “pagtubos” kasama ng תִּהְיֶה ay nagsasaad dito ng isang umiiral na legal na karapatan o pagkakataong mabawi sa pamamagitan ng pagtubos ang naipagbiling ari-arian.
- source_word: עוֹלָם
  choice: magpakailanman
  rationale: Sa kontekstong legal, tumutukoy ito sa patuloy at hindi nawawalang bisa ng karapatan, hindi kinakailangang sa pilosopikal na kawalang-hanggan.
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: ay magkakaroon ... ang mga Levita
  rationale: Pinananatili nito ang hinaharap o normatibong puwersa ng imperfect at ang lamed bilang tanda ng partidong pinagkalooban ng karapatan.
theological_decisions:
- issue: Legal na puwersa ng sugnay tungkol sa pagtubos ng mga bahay ng mga Levita
  choice: Patuloy na may karapatan ang mga Levita na tubusin ang mga bahay sa kanilang mga lungsod.
  alternative: 'Maaaring isalin nang higit na pormal: “Ang walang-hanggang pagtubos ay para sa mga Levita.”'
  rationale: Ang Hebreong nominal na parirala גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם ay nagtatatag ng isang permanenteng karapatan sa pagtubos. Inilalahad ito nang malinaw sa pangunahing teksto, habang ang higit na pormal na anyo ay inilalagay sa talababa upang mapanatili ang estruktural na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na legal na pananalita. Ginamit ang “lungsod,” “pag-aari,” at “karapatang tubusin” upang maging madaling maunawaan habang pinananatili ang legal na diwa ng Hebreo.
