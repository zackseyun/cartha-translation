base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: tl
  text: Huwag kang maningil sa kanya ng tubo o dagdag na pakinabang[a]. Sa halip, matakot ka sa iyong Diyos, at hayaan mong mabuhay na kasama mo ang iyong kapatid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dagdag” o “pakinabang.” Pinagtatambal sa Hebreo ang dalawang magkaugnay na katawagan para sa tubo o dagdag na sinisingil sa kapos na nanghihiram.
    reason: lexical_alternative
  - marker: b
    text: Ang “kapatid” dito ay kapwa kabilang sa pamayanan ng tipan, hindi lamang isang kapatid sa laman.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: Huwag kang maningil
  rationale: Ang אַל na may imperfect ay tuwirang pagbabawal. Sa konteksto ng pautang, mas natural at tiyak sa Filipino ang “maningil” kaysa literal na “kumuha.”
- source_word: מֵאִתּוֹ
  choice: sa kanya
  rationale: Tinutukoy nito ang kapatid na kapos bilang taong sisingilin ng ipinagbabawal na dagdag; likas sa Filipino ang “maningil sa kanya.”
- source_word: נֶשֶׁךְ
  choice: tubo
  rationale: Karaniwang modernong salitang Filipino ito para sa interest na ipinapataw sa pautang, nang hindi nililimitahan ang diwa sa labis na interes lamang.
- source_word: וְתַרְבִּית
  choice: dagdag na pakinabang
  rationale: Ang termino ay tumutukoy sa pagdagdag o pakinabang na kinukuha mula sa nanghihiram at ipinares sa נֶשֶׁךְ. Pinananatili ng parirala ang kaugnay ngunit hindi lubos na magkaparehong dalawang termino.
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: Sa halip, matakot ka sa iyong Diyos
  rationale: Ang “Sa halip” ay natural na nagpapakita ng etikal na pagsalungat sa pagsasamantala, habang pinananatili ng “iyong Diyos” ang tuwirang tipanang pananalita.
- source_word: וְחֵי
  choice: at hayaan mong mabuhay
  rationale: Ipinapahayag nito ang utos o hinihinging kinalabasan nang hindi dinaragdagan ng tahasang purposibong “upang.”
- source_word: אָחִיךָ
  choice: iyong kapatid
  rationale: Pinananatili ang literal na larawang pampamilya at tipanang puwersa ng Hebreo; nililinaw sa talababa ang mas malawak na gamit nito sa batas na ito.
- source_word: עִמָּךְ
  choice: na kasama mo
  rationale: Tuwirang ipinahihiwatig ang patuloy na pamumuhay sa piling ng kausap at sa loob ng pamayanan.
theological_decisions:
- issue: Saklaw ng אָחִיךָ sa batas ng tipan
  choice: iyong kapatid
  alternative: iyong kapwa Israelita; iyong kamag-anak
  rationale: Ang literal na “kapatid” ay nagpapanatili sa pampamilya at tipanang bigat ng salita, habang ang talababa ay pumipigil sa maling pagkaunawang biyolohikal na kapatid lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “tubo” bilang karaniwang terminong pangpananalapi, at pinanatili ang “kapatid” upang maingatan ang larawang pampamilya ng tekstong Hebreo.
