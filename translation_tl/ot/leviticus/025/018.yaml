  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: tl
  text: Kaya tuparin ninyo ang aking mga tuntunin at ingatan ang aking mga hatol[a]; isagawa ninyo ang mga iyon[b]. Sa gayon, maninirahan kayo nang panatag sa lupain.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “aking mga itinakdang batas … aking mga kautusan.” Dalawang magkaibang terminong legal ang ginamit sa Hebreo: חֻקִּים at מִשְׁפָּטִים.'
    reason: lexical_alternative
  - marker: b
    text: 'Inuulit sa Hebreo ang pandiwang “gawin”: sa literal, “gawin ninyo ang aking mga tuntunin … ingatan ninyo ang aking mga hatol at gawin ang mga iyon.”'
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy ito sa panatag na paninirahan ng Israel sa lupaing ibinigay sa kanila.
    reason: cultural_note
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang חֻקִּים ay tumutukoy sa mga itinakdang alituntunin o batas. Ang “mga tuntunin” ay malinaw at likas sa modernong Filipino, habang napapanatili ang legal at tipanang diwa.
- source_word: מִשְׁפָּטַי
  choice: aking mga hatol
  rationale: Ang מִשְׁפָּטִים ay maaaring tumukoy sa mga hatol, pasiyang legal, o kautusan. Pinananatili ng “mga hatol” ang pormal na legal na diwa at ang pagkakaiba nito sa חֻקִּים.
- source_word: תִּשְׁמְרוּ
  choice: ingatan
  rationale: Sa kontekstong legal at tipanan, ang שׁמר ay nangangahulugang maingat na sundin o tuparin. Ang “ingatan” ay nagpapanatili sa pangunahing larawan ng salita at sa diwa ng masusing pagsunod.
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: tuparin ... isagawa ninyo ang mga iyon
  rationale: Dalawang beses ginamit ang עשה. Gumamit ng magkaugnay ngunit hindi lubhang paulit-ulit na mga pandiwa upang mapanatili ang diin sa aktuwal na pagsunod at maging natural sa Filipino; ipinaliliwanag sa talababa ang literal na pag-uulit.
- source_word: וִישַׁבְתֶּם
  choice: maninirahan kayo
  rationale: Ang ישׁב ay tumutukoy sa paninirahan o pirmihang pagtahan. Ang “maninirahan” ay likas sa Filipino at angkop sa konteksto ng pamumuhay sa lupain.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Sa kontekstong ito, ang הָאָרֶץ ay ang lupaing ibinigay sa Israel. Ang “lupain” ay nagpapanatili sa tipanang heograpikong diwa nang hindi ito ginagawang pangkalahatang “bansa.”
- source_word: לָבֶטַח
  choice: nang panatag
  rationale: Ang בֶּטַח ay nagpapahiwatig ng kaligtasan, katiwasayan, at kawalan ng pangamba. Ang “nang panatag” ay natural na kaakibat ng paninirahan at nagpapahayag ng matatag na seguridad.
theological_decisions:
- issue: Ugnayan ng pagsunod at panatag na paninirahan sa lupain
  choice: Inilalahad ang panatag na paninirahan bilang bunga ng pagsunod sa loob ng tipan ng Israel at ng konteksto ng lupain.
  alternative: Isang pangkalahatan at walang-pasubaling pangako ng personal na kaligtasan o kasaganaan para sa lahat ng mananampalataya sa bawat panahon.
  rationale: Tuwirang pinag-uugnay ng Hebreo ang pagsunod sa mga tuntunin at hatol ng Diyos at ang panatag na paninirahan sa lupain. Hindi pinalalawak ng salin ang pangakong ito nang lampas sa partikular na konteksto nito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “tuntunin” at “hatol” upang mapanatili ang pagkakaiba ng dalawang terminong legal sa Hebreo. Ang “nang panatag” ay mas natural sa kasalukuyang Filipino kaysa sa mas teknikal na “nang ligtas,” habang taglay pa rin ang diwa ng katiwasayan.
