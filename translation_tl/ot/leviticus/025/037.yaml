  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: tl
  text: Huwag mong ipautang sa kanya ang iyong salapi[a] nang may tubo, at huwag mong ibigay sa kanya ang iyong pagkain nang may dagdag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iyong pilak.” Ang salitang Hebreo ay maaaring tumukoy sa pilak o sa salaping ginagamit sa pagpapautang.
    reason: lexical_alternative
  - marker: b
    text: O “nang may patong.” Ang salitang Hebreo ay tumutukoy sa dagdag o pakinabang na kinukuha mula sa ipinagkaloob, at katambal dito ng “tubo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ
  choice: iyong salapi
  rationale: Ang כֶּסֶף ay maaaring mangahulugang “pilak” o “salapi.” Sa konteksto ng pagpapautang, likas at malinaw sa makabagong Filipino ang “salapi,” habang itinatala sa talababa ang literal na alternatibo.
- source_word: תִתֵּן לוֹ
  choice: ipautang sa kanya
  rationale: Literal itong “ibigay sa kanya,” ngunit ang kasunod na בְּנֶשֶׁךְ ay nagpapakitang pagpapautang ang tinutukoy. Ginagawang malinaw ng “ipautang” ang legal at pangkabuhayang diwa nang hindi lumalampas sa konteksto.
- source_word: בְּנֶשֶׁךְ
  choice: nang may tubo
  rationale: Ang נֶשֶׁךְ ay singil o interes sa pautang. Ang “tubo” ang karaniwan at madaling maunawaang salitang Filipino rito; hindi ito nilimitahan sa labis o mapagsamantalang interes lamang.
- source_word: וּבְמַרְבִּית
  choice: nang may patong
  rationale: Ang מַרְבִּית ay dagdag, pagdami, o pakinabang na kinukuha sa ipinagkaloob. Sa kaugnayan nito sa pagkain, malinaw na ipinahahayag ng “patong” ang dagdag na singil at pinananatili ang pagkakaiba nito sa “tubo.”
- source_word: אָכְלֶךָ
  choice: iyong pagkain
  rationale: Tuwirang katumbas ng אָכֶל ang “pagkain.” Pinananatili nito ang kongkretong salita ng Hebreo sa halip na gawing mas malawak na “mga panustos.”
- source_word: לֹא ... לֹא
  choice: Huwag mong ... at huwag mong
  rationale: Pinananatili ng dalawang tahasang pagbabawal ang magkatimbang na estruktura at legal na diin ng Hebreo, habang natural sa Filipino.
theological_decisions:
- issue: Saklaw ng pagbabawal sa נֶשֶׁךְ at מַרְבִּית
  choice: Isinalin bilang “tubo” at “patong” nang walang panturing na “labis” o “mapagsamantala.”
  alternative: “Labís na tubo” o “mapagsamantalang patong”
  rationale: Walang salitang Hebreo sa talata na naglilimita sa pagbabawal sa labis na singil lamang. Ang mas neutral na salin ay hindi nagpapasok ng isang makitid na teolohikal o pangkabuhayang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salapi” upang mapanatili ang dignidad ng legal na pananalita, at ang karaniwang mga terminong “tubo” at “patong” upang madaling maunawaan ang dalawang magkatambal ngunit hindi ganap na magkaparehong salitang Hebreo.
