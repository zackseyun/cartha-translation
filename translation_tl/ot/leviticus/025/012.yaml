  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: tl
  text: Sapagkat ito ay taon ng jubileo; magiging banal ito sa inyo. Mula sa bukid ay kakainin ninyo ang ibinubunga nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ani nito” o “bunga nito.” Ang salitang Hebreo ay tumutukoy sa anumang inilalabas o pinatutubo ng bukid.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang tagubilin at natural na nagpapanatili sa paliwanag na ugnayan.
- source_word: יוֹבֵל
  choice: taon ng jubileo
  rationale: Sa Levitico 25, tumutukoy ito sa natatanging ikalimampung taon, hindi sa sungay ng lalaking tupa. Idinagdag ang “taon ng” upang maging malinaw at natural sa Tagalog.
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: magiging banal ito para sa inyo
  rationale: Pinananatili ng “banal” ang panrelihiyon at pangtipang bigat ng קֹדֶשׁ, habang malinaw na iniuugnay ang kabanalan ng taon sa bayan.
- source_word: מִן הַשָּׂדֶה
  choice: mula sa bukid
  rationale: Tuwirang isinasalin ang pariralang nagsasaad na ang pagkain ay kukunin sa mismong pinagtutubuan nito.
- source_word: תֹּאכְלוּ
  choice: kakainin ninyo
  rationale: Ang anyong Hebreo ay may hinaharap at panuntunang bisa sa kontekstong legal; natural itong naipapahayag sa Tagalog sa aspektong kontemplatibo.
- source_word: תְּבוּאָתָהּ
  choice: ang ani nito
  rationale: Ang “ani” ay natural at malawak na katawagan sa ibinubunga ng bukid, kabilang ang kusang tumubo sa taon ng jubileo.
theological_decisions:
- issue: Paglalarawan sa kabanalan ng taon ng jubileo
  choice: magiging banal ito para sa inyo
  alternative: itatalaga ito para sa inyo
  rationale: Pinananatili ng “banal” ang tahasang teolohikal at pangtipang diwa ng קֹדֶשׁ at hindi ito pinapaliit tungo sa pagiging espesyal o nakatalaga lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “jubileo,” na madaling makilala sa wikang panrelihiyon, at nilinaw sa pariralang “taon ng jubileo.” Inilagay ang talababa pagkatapos ng “ani nito,” ang salitang tunay na tinutukoy ng leksikal na paliwanag.
