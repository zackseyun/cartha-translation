base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/051.yaml
  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: tl
  text: Kung marami pang taon ang natitira, magbabayad siya ng halaga ng kanyang pantubos[a] ayon sa bilang ng mga taong iyon, mula sa halagang ipinambili sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ang kanyang pagtubos. Ang pangngalang Hebreo ay maaaring tumukoy sa mismong gawa ng pagtubos, ngunit dito ay malamang na tumutukoy sa halagang ibabayad upang matubos siya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang panandang kondisyon na nagpapakilala sa kasong inilalahad ng batas.
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: marami pang taon ang natitira
  rationale: Likas na pagpapahayag sa modernong Filipino ng diwang ‘marami pang taon’ o ‘maraming taon pa ang nalalabi.’
- source_word: לְפִיהֶן
  choice: ayon sa bilang ng mga taong iyon
  rationale: Ang literal na idyomang ‘ayon sa bibig ng mga iyon’ ay nangangahulugang ayon o katumbas ng dami ng mga taong nabanggit.
- source_word: יָשִׁיב
  choice: magbabayad siya
  rationale: Ang Hiphil ng שוב ay literal na ‘magpabalik,’ ngunit sa kontekstong pinansiyal ay tumutukoy sa pagbabayad o pagsasauli ng halagang nararapat.
- source_word: גְּאֻלָּתוֹ
  choice: halaga ng kanyang pantubos
  rationale: Maaaring tumukoy ang pangngalan sa pagtubos mismo, ngunit sa kontekstong ito ay malamang na tumutukoy sa halagang kailangang bayaran upang matubos ang tao.
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: mula sa halagang ipinambili sa kanya
  rationale: Pinananatili nito ang diwang ang proporsiyonal na pantubos ay kinukuha o kinukuwenta mula sa orihinal na halagang ibinayad sa pagbili sa kanya.
