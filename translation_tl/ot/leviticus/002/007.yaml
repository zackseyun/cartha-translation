translation:
  language: tl
  text: At kung ang handog mo ay handog na butil na inihanda sa isang kawali[a], gagawin ito mula sa pinong harina na may langis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “plantsa,” “malalim na kawali,” o “sisidlang panluto”; hindi tiyak ang eksaktong uri ng sisidlang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili nito ang pang-ugnay at kundisyunal na daloy ng magkakasunod na tagubilin.
- source_word: מִנְחַת
  choice: handog na butil
  rationale: Sa Levitico 2, tumutukoy ang מִנְחָה sa handog na mula sa ani o butil, hindi lamang sa pangkalahatang handog.
- source_word: מַרְחֶשֶׁת
  choice: kawali
  rationale: Tumutukoy ito sa isang sisidlang panluto, ngunit hindi tiyak ang eksaktong hugis o uri; natural at sapat na malawak ang “kawali” sa makabagong Filipino.
- source_word: קָרְבָּנֶךָ
  choice: ang handog mo
  rationale: Malinaw at natural nitong ipinapahayag ang pangkalahatang katawagan sa bagay na inihahandog at ang ikalawang panauhang panlaping paari.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwang sangkap ng handog na butil at tuwirang katumbas ng pinong giniling na harina.
- source_word: בַּשֶּׁמֶן
  choice: na may langis
  rationale: Ipinapahayag nito ang langis bilang kasamang sangkap nang hindi ipinapalagay kung ito ay inihalo, ipinrito, o ginamit sa ibang tiyak na paraan.
- source_word: תֵּעָשֶׂה
  choice: gagawin ito
  rationale: Pinananatili ang pasibong diwa at ang tono ng tagubilin ng pandiwang Niphal.
