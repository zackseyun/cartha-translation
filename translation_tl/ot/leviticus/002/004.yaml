  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: tl
  text: 'At kung maghahandog ka ng handog na pagkaing butil na inihurno sa pugon, iyon ay dapat na yari sa pinong harina: mga tinapay na walang pampaalsa na hinaluan ng langis, o[a] mga manipis na tinapay na walang pampaalsa na pinahiran ng langis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at mga manipis na tinapay.” Malamang na inililista rito ang isa pang maaaring anyo ng handog na inihurno sa pugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תַקְרִב
  choice: At kung maghahandog ka
  rationale: Ipinapakita ng “At kung” ang pagpapatuloy at kondisyong nasa tekstong legal. Ang Hiphil ng קרב ay tumutukoy sa paglapit o paghaharap ng handog; sa natural na Tagalog, malinaw itong naipahahayag ng “maghahandog.”
- source_word: קָרְבַּן מִנְחָה
  choice: handog na pagkaing butil
  rationale: Ang קָרְבַּן ay pangkalahatang handog, samantalang ang מִנְחָה sa Levitico 2 ay tiyak na kategorya ng handog na mula sa harina o butil. Pinananatili ng parirala ang ritwal na kahulugan nang hindi nagiging labis na teknikal.
- source_word: מַאֲפֵה תַנּוּר
  choice: niluto sa pugon
  rationale: Tumutukoy ito sa pagkaing inihurno o niluto sa isang tannur. Ang “pugon” ay dignidad at malinaw na katumbas para sa sinaunang hurnuhan, samantalang ang “niluto” ay natural sa modernong Tagalog.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy sa mahusay at pinong uring harina na ginagamit sa handog.
- source_word: חַלּוֹת מַצּוֹת
  choice: mga tinapay na walang pampaalsa
  rationale: Ang חַלּוֹת ay mga tinapay o keyk na hugis-bilog o makapal, at ang מַצּוֹת ay walang lebadura. Ang “walang pampaalsa” ay malinaw sa ordinaryong mambabasa at hindi nililimitahan sa isang makabagong uri ng lebadura.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Ang passive participle ng בלל ay nagsasaad na ang langis ay inihalo sa masa o harina.
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: o mga manipis na tinapay na walang pampaalsa
  rationale: Ang רְקִיקִים ay manipis na tinapay o wafer. Bagaman literal na “at” ang pang-ugnay, malamang na alternatibong anyo ng handog ang inililista rito; pinananatili sa talababa ang literal na posibilidad.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: pinahiran ng langis
  rationale: Sa konteksto ng pagkain, ang passive ng משׁח ay praktikal na pagpahid ng langis. Mas likas at tiyak dito ang “pinahiran” kaysa “pinahiran bilang pagtatalaga” o teknikal na “pinahiran ng banal na langis.”
theological_decisions:
- issue: Kahulugan ng מִנְחָה sa kontekstong panghandog
  choice: handog na pagkaing butil
  alternative: handog na kaloob; handog na parangal
  rationale: Sa ibang konteksto, maaaring mangahulugan ang מִנְחָה ng kaloob o tributo, ngunit inilalarawan ng Levitico 2 ang isang ritwal na handog na yari sa harina at langis. Ipinahahayag ng napiling salin ang tiyak na kontekstong ito nang walang idinadagdag na doktrinang hindi nasa teksto.
- issue: Ugnayan ng dalawang uri ng pagkaing inihurno
  choice: o
  alternative: at
  rationale: Maaaring ang waw ay simpleng “at,” ngunit sa listahang ito malamang na dalawang maaaring anyo ng handog ang tinutukoy. Ginamit ang natural na “o” sa teksto, habang tapat na itinala sa talababa ang literal na “at.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkaing butil” upang ipakita ang ritwal na kategorya, “pugon” para sa sinaunang hurnuhan, at “walang pampaalsa” bilang madaling maunawaang paglalarawan ng מצות. Inilagay ang talababa pagkatapos ng sugnay na kaugnay nito.
