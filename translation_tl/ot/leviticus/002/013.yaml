base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: tl
  text: Bawat handog mong pagkaing butil ay timplahan mo ng asin[a]. Huwag mong hayaang mawala sa iyong handog na pagkaing butil ang asin ng tipan ng iyong Diyos[b]. Sa lahat ng iyong handog ay maghandog ka ng asin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “asnan mo.” Sa Hebreo, magkaugnay ang mga salitang “asin” at “asnan.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “asin ng tipan ng iyong Diyos” ay literal na pahayag tungkol sa tipan na kaugnay ng paghahandog; hindi ipinaliliwanag dito ng teksto ang buong simbolismo nito.
    reason: cultural_note
  - marker: c
    text: O “Sa ibabaw ng lahat ng iyong mga handog ay maghandog ka ng asin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: handog
  rationale: Malawak na katawagang pansakripisyo; ang “handog” ay natural, marangal, at angkop sa dalawang paglitaw nito sa talata.
- source_word: מִנְחָה
  choice: handog na pagkaing butil
  rationale: Sa Levitico 2, tumutukoy ito sa handog na mula sa ani o butil. Nililinaw ng salin ang partikular na uri ng handog nang hindi gumagamit ng teknikal o makalumang salita.
- source_word: בַּמֶּלַח תִּמְלָח
  choice: timplahan mo ng asin
  rationale: Ang Hebreo ay literal na gumagamit ng pangngalan at pandiwang magkaugnay, “asnan ng asin.” Ang “timplahan mo ng asin” ay natural sa modernong Tagalog at malinaw na naghahayag ng rituwal na utos.
- source_word: תַשְׁבִּית
  choice: alisin
  rationale: Ang Hiphil ng שבת dito ay nagpapahiwatig ng pagpapahinto, pag-aalis, o pagpapawala. Sa negatibong utos, ang “huwag mong alisin” ay tuwiran at natural.
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: ang asin ng tipan ng iyong Diyos
  rationale: Pinananatili nito ang metaporikal at tipanang pahayag ng Hebreo nang hindi ipinapaliwanag o nilulutas ang kahulugan nito sa pangunahing teksto.
- source_word: מֵעַל
  choice: sa ... ang
  rationale: Sa pariralang “huwag mong alisin sa iyong handog ... ang asin,” natural na naihahatid sa Tagalog ang diwang pag-aalis mula sa ibabaw o pagkakaugnay sa handog.
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: kasama ng lahat ng iyong mga handog
  rationale: Maaaring literal na “sa ibabaw ng bawat handog,” ngunit ang pang-ukol ay maaari ring magpahiwatig ng pagsama. Pinananatili ng “kasama” ang tunay na posibilidad na asin ang dapat iharap kalakip ng bawat handog.
- source_word: תַּקְרִיב
  choice: maghandog ka
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay nangangahulugang maglapit, magharap, o maghandog. Ang “maghandog” ay malinaw at natural sa Tagalog.
theological_decisions:
- issue: Kung literal na pananatilihin o ipapaliwanag ang “asin ng tipan ng iyong Diyos”
  choice: Panatilihin sa pangunahing teksto ang “asin ng tipan ng iyong Diyos.”
  alternative: “asin na sagisag ng tipan ng iyong Diyos” o “asin na hinihingi ng tipan ng iyong Diyos”
  rationale: Hindi ipinapaliwanag ng talata ang eksaktong simbolismo ng asin. Ang literal na pahayag ay nagpapanatili sa tipanang larawan at sa teolohikal na tensiyon nang hindi nagdaragdag ng interpretasyong wala sa teksto.
- issue: Kung ang asin ay ihahandog “kasama ng” o ilalagay “sa ibabaw ng” lahat ng handog
  choice: Gamitin sa pangunahing teksto ang “kasama ng,” at ilagay sa talababa ang mas literal na “sa ibabaw ng.”
  alternative: “Sa lahat ng iyong mga handog ay maghandog ka ng asin.”
  rationale: Ang עַל ay maaaring unawaing nasa ibabaw ng handog o kaugnay/kasama nito. Ang talababa ay nagpapanatili sa leksikal na posibilidad nang hindi ginagawang mabigat ang pangunahing pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang isahang ikalawang panauhan upang tumbasan ang mga anyong panlalaki at isahan sa Hebreo. Iniwasan ang makalumang “hain” bilang tanging termino at ang sobrang teknikal na paliwanag sa pangunahing teksto; pinanatili ang kultikong larawang “asin ng tipan.”
