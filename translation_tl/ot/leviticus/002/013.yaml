  naturalness: Natural ang register, ngunit mas malinaw at mas idiomatiko ang “Bawat handog mong pagkaing butil” kaysa “ang bawat handog na pagkaing butil.” Ang talababa a sa draft ay hindi natural na Tagalog sa anyong “asnan mo ng asin.”
  terminology: Ang “handog na pagkaing butil,” “asin ng tipan ng iyong Diyos,” at “maghandog” ay angkop, malinaw, at nagpapanatili ng sakripisyal at tipanang wika nang walang idinagdag na interpretasyon.
