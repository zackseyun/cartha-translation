  terminology: Ang “kamanyang” ay tumpak para sa לְבֹנָה. Ang “handog na butil” ay angkop para sa מִנְחָה sa kontekstong ito. Hindi dapat idagdag ang “olibo” sa “langis,” sapagkat hindi ito tahasang nakasaad.
