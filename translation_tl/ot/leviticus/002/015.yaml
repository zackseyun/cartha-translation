  text: Maglagay ka ng langis sa ibabaw nito at maglagay ka ng kamanyang sa ibabaw nito; handog na butil ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Lagyan mo
  rationale: Malawak ang kahulugan ng נתן—“magbigay, maglagay, magpatong.” Sa tagubiling panritwal na ito, natural sa makabagong Tagalog ang “lagyan mo” para sa paglalagay ng langis sa handog at napapanatili nito ang tuwirang lakas ng utos.
- source_word: עָלֶיהָ
  choice: ito / patungan
  rationale: Ipinahihiwatig ng על na inilalagay ang mga sangkap sa ibabaw ng handog. Ang hulaping pambabae sa Hebreo ay tumutukoy sa handog, ngunit walang kasariang gramatikal ang panghalip na Tagalog na “ito.” Nasa pandiwang “patungan” ang diwang “sa ibabaw nito” sa ikalawang sugnay.
- source_word: שֶׁמֶן
  choice: langis
  rationale: Ang payak na kahulugan ay “langis.” Bagaman langis ng olibo ang malamang na tinutukoy sa kontekstong pansakripisyo, hindi tahasang sinasabi ng Hebreo ang “olibo,” kaya hindi ito idinagdag.
- source_word: וְשַׂמְתָּ
  choice: patungan
  rationale: Ang שׂים ay karaniwang nangangahulugang “maglagay, magpatong, magtakda.” Ang “patungan” ay natural kasunod ng “lagyan,” ipinakikita ang paglalagay sa ibabaw, at hindi nagpapahiwatig ng paraang hindi naman tinukoy ng teksto.
- source_word: לְבֹנָה
  choice: kamanyang
  rationale: Partikular na tumutukoy ang לבנה sa frankincense. Ang “kamanyang” ang tumpak at nakaugaliang katawagang Filipino, sa halip na ang mas pangkalahatang “insenso.”
- source_word: מִנְחָה
  choice: handog na pagkaing butil
  rationale: Sa mga tuntuning pansakripisyo ng Levitico, tumutukoy ang מִנְחָה sa handog na mula sa butil, hindi lamang sa anumang handog o kaloob. Malinaw at nakikilala sa Filipino ang “handog na pagkaing butil.”
- source_word: הִוא
  choice: ito
  rationale: Tinutukoy ng panghalip ang bagay na kasalukuyang inilalarawan. Pinananatili ng “handog na pagkaing butil ito” ang payak na pagpapakilala sa Hebreo nang walang dagdag na diin.
