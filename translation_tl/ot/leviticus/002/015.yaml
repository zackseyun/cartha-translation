translation_notes:
  register: Makabago, tuwiran, at marangal ang pananalita. Ginamit ang isahang anyo ng utos na “mo,” ayon sa ikalawang panauhang isahan sa Hebreo. Iniwasan ang sobrang teknikal na bokabularyo, ngunit pinanatili ang tiyak na katawagang “kamanyang” at ang malinaw na terminong pansakripisyo na “handog na pagkaing butil.”
