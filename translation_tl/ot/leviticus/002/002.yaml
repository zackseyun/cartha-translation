  - severity: low
    issue: Medyo literal at di-gaan ang 'isang amoy na kalugod-lugod.'
    rationale: Ang 'mabangong samyo na kalugod-lugod' ay nagpapanatili sa metaporang pansakripisyo ng רֵיחַ נִיחֹחַ sa mas likas na Filipino.
