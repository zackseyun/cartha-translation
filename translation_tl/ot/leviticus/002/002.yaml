- from: Dadalhin niya ito sa mga anak ni Aaron, na mga pari. Kukuha ang pari mula roon ng kasya sa buong dakot niya mula sa pinong harina at langis nito, kasama ang lahat ng kamanyang nito. Pagkatapos, susunugin ng pari sa altar ang bahaging pang-alaala nito bilang handog na pinaraan sa apoy[a], isang amoy na kalugod-lugod kay Yahweh.
  to: Dadalhin niya ito sa mga anak ni Aaron, na mga pari. Kukuha ang pari roon ng isang buong dakot ng pinong harina nito at langis nito, kasama ang lahat ng kamanyang nito. Pagkatapos, susunugin ng pari sa altar ang bahaging pang-alaala nito bilang handog na pinaraan sa apoy[a], isang mabangong samyo na kalugod-lugod kay Yahweh.
