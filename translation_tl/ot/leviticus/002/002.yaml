id: LEV.2.2
reference: Leviticus 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Dadalhin niya ito sa mga anak ni Aaron, na mga pari. Kukuha ang pari roon ng isang buong dakot ng pinong harina nito at langis nito, kasama ang lahat ng kamanyang nito. Pagkatapos, susunugin ng pari sa altar ang bahaging pang-alaala nito bilang handog na pinaraan sa apoy[a], isang mabangong samyo na kalugod-lugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na pagkain” o “handog na apoy.”
    reason: Iba-iba ang posibleng pag-unawa sa teknikal na katawagang Hebreo na אִשֶּׁה.
lexical_decisions:
- source_word: וְהֱבִיאָהּ
  choice: Dadalhin niya ito
  rationale: Ipinahahayag ng Hiphil ng בוא ang pagdadala ng handog sa mga pari. Ang panghinaharap na anyo ay natural sa makabagong Filipino para sa tuntuning ritwal.
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: mga anak ni Aaron, na mga pari
  rationale: Nananatiling malinaw kapuwa ang kaugnayang pampamilya at ang pagkakakilanlan nila bilang mga pari.
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: Kukuha ang pari ... ng kasya sa buong dakot niya
  rationale: Ang pandiwa ay tumutukoy sa pagkuha sa pamamagitan ng nakakuyom na kamay, at ang parirala ay literal na nagsasaad ng laman ng buong dakot niya. Nilinaw ang pari bilang gumagawa ayon sa agarang konteksto.
- source_word: מִסָּלְתָּהּ
  choice: mula sa pinong harina ... nito
  rationale: Ang סֹלֶת ay pinong harinang ginagamit sa mga handog; pinananatili ng salin ang espesipikong uri nito.
- source_word: וּמִשַּׁמְנָהּ
  choice: at langis nito
  rationale: Iniuugnay ito sa daming kinukuha ng pari nang hindi ipinahihiwatig na kukunin ang lahat ng langis.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: kasama ang lahat ng kamanyang nito
  rationale: Ipinakikita na ang buong bahagi ng kamanyang ay isinasama sa dakot ng harina at langis.
- source_word: אַזְכָּרָתָהּ
  choice: bahaging pang-alaala nito
  rationale: Pinananatili ang teknikal na diwa ng kinatawang bahagi ng handog na sinusunog sa altar, nang hindi labis na ipinaliliwanag kung kanino o ano ang 'alaala.'
- source_word: וְהִקְטִיר ... הַמִּזְבֵּחָה
  choice: susunugin ... sa altar
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קטר ay tumutukoy sa pagsusunog ng handog sa altar upang pumailanlang ang usok.
- source_word: אִשֵּׁה
  choice: handog na pinaraan sa apoy
  rationale: Inilalarawan nito ang handog na inihahandog sa pamamagitan ng apoy. Mas lantad nito sa Filipino ang elementong apoy kaysa sa posibleng saling 'handog na pagkain.'
- source_word: רֵיחַ נִיחֹחַ
  choice: isang amoy na kalugod-lugod
  rationale: Natural at marangal na Filipino ito para sa pormulang pansakripisyong nagsasaad ng amoy na nakalulugod sa Diyos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng teknikal na katawagang אִשֵּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain; handog na apoy
  rationale: May leksikal na pagtatalo kung ang diin ay sa apoy o sa pagkaing inihahandog. Pinili sa pangunahing teksto ang malinaw na paraang paghahandog sa apoy, habang inilalahad sa talababa ang tunay na alternatibo.
- issue: Kahulugan ng אַזְכָּרָה sa ritwal
  choice: bahaging pang-alaala
  alternative: bahaging paalaala; handog na pang-alaala
  rationale: Pinananatili ng salin ang teknikal at bahagyang hindi tiyak na konsepto ng 'pag-alaala' nang hindi ipinapasiya kung ito ay nagpapaalaala sa Diyos, sa sumasamba, o kumakatawan sa buong handog.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang mga katawagang “pari,” “altar,” at “kamanyang.” Iniwasan ang sobrang arkaikong pananalita, ngunit pinanatili ang teknikal na wikang pansakripisyo at ang tunay na leksikal na kalabuan.
