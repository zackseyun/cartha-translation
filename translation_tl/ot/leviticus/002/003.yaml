  to: Ang natitira sa handog na butil ay para kay Aaron at para sa kanyang mga anak na lalaki; ito ay isang pinakabanal na bahagi mula sa mga handog na pagkain para kay Yahweh.[a]
  rationale: Pinalitan ang panghinaharap na “matitira” ng “natitira” upang tumpak na tukuyin ang nalalabing bahagi ng handog. Ginawang hayag ang “mga anak na lalaki” ayon sa Hebreo. Pinalitan ang mas mabigat na “kabanal-banalang” ng natural na “pinakabanal,” at nilinaw ang unang alternatibo sa talababa upang hindi ito magmungkahi na ang buong handog ay kinakailangang ganap na sunugin.
