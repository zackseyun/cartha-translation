base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: tl
  text: Ang natitira sa handog na butil ay para kay Aaron at para sa kanyang mga anak na lalaki; ito ay isang pinakabanal na bahagi mula sa mga handog na pagkain para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa mga handog na iniaalay sa pamamagitan ng apoy para kay Yahweh” o “mula sa mga handog sa apoy para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: Ang matitira
  rationale: Ang may-artikulong participle ay ginagamit bilang pangngalan at tumutukoy sa bahaging natira. Natural at malinaw sa modernong Filipino ang “ang matitira.”
- source_word: מִן הַמִּנְחָה
  choice: sa handog na butil
  rationale: Sa Levitico 2, ang מִנְחָה ay partikular na handog na mula sa butil, hindi lamang pangkalahatang regalo o handog.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: para kay Aaron at sa kanyang mga anak
  rationale: Ipinahahayag ng לְ ang paglalaan o karapatang tumanggap; tuwiran at natural itong naihahatid ng “para kay.”
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: isang kabanal-banalang bahagi
  rationale: Ang inuulit na anyo ay isang Hebreong panukdol na nagsasaad ng pinakamataas na antas ng kabanalan. Idinagdag ang “bahagi” upang maging malinaw na ang inilalarawan ay ang natira sa handog, hindi isang lugar.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: mula sa mga handog na pagkain para kay Yahweh
  rationale: Ang אִשֶּׁה ay teknikal na katawagan sa mga handog na inihahain sa Diyos, karaniwang sa pamamagitan ng apoy, at maaari ring unawain bilang handog na pagkain. Ginamit sa teksto ang malinaw na “mga handog na pagkain,” habang inilagay sa talababa ang tunay na alternatibong may diin sa apoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa kategoryang kultiko na קֹדֶשׁ קָדָשִׁים
  choice: isang kabanal-banalang bahagi
  alternative: lubhang banal; banal sa mga banal
  rationale: Ipinahahayag nito ang pinakamataas na antas ng kabanalan ng bahaging nakalaan sa mga pari, nang hindi ito napagkakamalang tawag sa isang bahagi ng santuwaryo.
- issue: Kahulugan ng אִשֵּׁי יְהוָה
  choice: mga handog na pagkain para kay Yahweh
  alternative: mga handog na sinusunog para kay Yahweh; mga handog sa apoy ni Yahweh
  rationale: Pinananatili sa pangunahing teksto ang madaling maunawaang kategoryang sakripisyal, ngunit hindi itinatago ang posibleng tahasang pagtukoy ng salita sa apoy; kaya ibinigay ang mga alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “handog na butil” bilang malinaw na katawagang kultiko, at ang tuldok-kuwit upang mapanatili ang iisang pangungusap habang malinaw na naiuugnay ang kabanalan sa natitirang bahagi.
