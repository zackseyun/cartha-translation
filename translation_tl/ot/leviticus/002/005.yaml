  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: tl
  text: At kung ang iyong handog na butil ay inihanda sa patag na kawali[a], dapat itong gawa sa pinong harina na hinaluan ng langis at walang pampaalsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa patag na lutuan.” Ang salitang Hebreo ay tumutukoy sa isang patag na ibabaw na ginagamit sa paghahanda ng handog na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: handog na pagkaing butil
  rationale: Sa Levitico 2, tumutukoy ito sa handog na mula sa harina o butil, hindi sa pangkalahatang handog lamang.
- source_word: עַל הַמַּחֲבַת
  choice: niluto sa lapád na kawali
  rationale: Ang parirala ay tumutukoy sa paghahanda sa isang patag na lutuan; nilinaw ng pandiwang 'niluto' ang ipinahihiwatig na gamit nang hindi tinutukoy nang labis ang eksaktong anyo ng kagamitan.
- source_word: קָרְבָּנְךָ
  choice: handog mo
  rationale: Pinananatili nito ang tuwirang pagtukoy sa mambabasa at ang appositional na ugnayan sa מִנְחָה nang hindi lumilikha ng mabigat na pag-uulit.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang natural at tumpak na katawagan sa mataas na uring harinang pinong giling na ginagamit sa ritwal.
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Malinaw nitong ipinahahayag na pinagsama ang harina at langis nang hindi labis na tinutukoy ang paraan ng paghahalo.
- source_word: מַצָּה
  choice: walang pampaalsa
  rationale: Dito, inilalarawan nito ang kinakailangang kalagayan ng handog. Ang 'walang pampaalsa' ay mas malinaw sa karaniwang modernong Filipino kaysa sa teknikal na 'di-pinaalsa.'
- source_word: תִהְיֶה
  choice: iyon ay dapat na
  rationale: Ipinahahayag nito ang preskriptibong lakas ng sugnay sa natural na modernong Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'handog na pagkaing butil' bilang madaling maunawaang katawagang pangkulto, at pinanatili sa talababa ang kawalang-katiyakan tungkol sa eksaktong uri ng lutuan.
