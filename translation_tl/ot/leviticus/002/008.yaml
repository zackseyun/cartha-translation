base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: tl
  text: At dadalhin mo kay Yahweh[a] ang handog na butil na ginawa mula sa mga ito, at ihaharap ito sa pari at ilalapit sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “para kay Yahweh.” Ang pang-ukol sa Hebreo ay maaaring magpahayag kapuwa ng direksiyon at ng pagtatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: At dadalhin mo
  rationale: Ang Hiphil perfect na ikalawang panauhang panlalaki na may pang-ugnay ay gumaganap bilang utos sa legal na pananalita; natural itong ipinahahayag sa Filipino bilang “dadalhin mo.”
- source_word: הַמִּנְחָה
  choice: ang handog na butil
  rationale: Sa Levitico 2, ang מִנְחָה ay tiyak na handog na mula sa butil, hindi lamang pangkalahatang kaloob o handog.
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: na ginawa mula sa mga ito
  rationale: Pinananatili nito ang pasibong diwa ng Niphal ng עשה at ang hindi espesipikong pagtukoy ng demonstratibong “mga ito” sa naunang mga anyo o sangkap.
- source_word: לַיהוָה
  choice: kay Yahweh[a]
  rationale: Ginagamit ang personal na pang-ukol na “kay” para sa direksiyon patungo kay Yahweh, habang kinikilala sa talababa na maaari ring idiin ng ל ang pag-aalay para sa kaniya.
- source_word: וְהִקְרִיבָהּ
  choice: Ihaharap niya iyon
  rationale: Ang Hiphil ng קרב ay “ilapit” o “iharap.” Ang “ihaharap” ay naiiba sa kasunod na נגשׁ at pinananatili ang ikatlong-panauhang paksa ng Hebreo nang hindi ito tahasang kinikilala.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Tuwirang ipinahahayag ang direksiyon ng handog patungo sa paring tatanggap nito.
- source_word: וְהִגִּישָׁהּ
  choice: at ilalapit iyon ng pari
  rationale: Ang Hiphil ng נגשׁ ay “ilapit.” Ginawang tahasan ang pari bilang gumagawa ng huling kilos, gaya ng hinihingi ng ritwal na daloy, habang iniiwasang ipagkamali na ang pari ang naghaharap ng handog sa kaniyang sarili.
- source_word: אֶל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Karaniwan at malinaw na katawagan ito sa altar na pinaghahandugan, at likas na ipinahahayag ang direksiyon sa Filipino.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng pang-ukol ל sa לַיהוָה
  choice: kay Yahweh
  alternative: para kay Yahweh
  rationale: Ang “kay” ay angkop sa kilos ng pagdadala, ngunit maaaring magpahiwatig ang Hebreo ng pag-aalay o pagtatalaga “para kay Yahweh”; pinananatili sa talababa ang dalawang posibilidad.
- issue: Pagbabago ng paksa sa dalawang huling pandiwa
  choice: Hindi kinilala ang paksa ng unang ikatlong-panauhang pandiwa; tahasang tinukoy ang pari sa huling kilos
  alternative: Ipagpalagay na iisang tao ang paksa ng dalawang pandiwa
  rationale: Lumilipat ang Hebreo mula sa ikalawang panauhan tungo sa ikatlong panauhan, at hindi tahasang pinapangalanan ang paksa ng וְהִקְרִיבָהּ. Sa ikalawang kilos, malinaw sa ritwal na daloy na ang pari ang naglalapit ng handog sa altar; ang salin ay umiiwas sa di-likas na pahiwatig na ihaharap ng pari ang handog sa kaniyang sarili.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “handog na butil,” “pari,” at “altar” bilang malinaw at pamilyar na mga terminong panritwal. Iniwasan ang labis na teknikal o makalumang pananalita.
