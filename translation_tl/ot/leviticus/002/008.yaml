  source_fidelity: Ang unang sugnay ay tapat sa Hebreo. Gayunman, ang dalawang pandiwang ikatlong panauhan (וְהִקְרִיבָהּ, וְהִגִּישָׁהּ) ay hindi tahasang pinapangalanan ang gumagawa sa mismong talata. Ang “niya” pagkatapos ng “Yahweh” ay madaling mabasa na si Yahweh ang paksa, samantalang ang tahasang “ng pari” sa huling kilos ay nag-aalis ng isang ambigwidad na hindi nilulutas ng teksto. Ang binagong salin ay pinananatili ang di-tiyak na paksa habang iniingatan ang pagkakaiba ng ‘iharap’ at ‘ilapit.’
  naturalness: Likas at malinaw ang “handog na butil,” “pari,” at “altar.” Mas maayos ang iisang pangungusap na may mga pandiwang walang tahasang tagaganap sa huling dalawang kilos, dahil iniiwasan nito ang nakalilitong referensiya ng “niya.”
  terminology: Ang “Yahweh,” “handog na butil,” “pari,” at “altar” ay angkop at pare-pareho. Ang talababa sa “kay Yahweh” ay wastong nagsasaad ng alternatibong diwa ng ל.
