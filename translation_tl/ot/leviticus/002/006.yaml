  text: Break it into pieces and pour oil on it[a]; it is a grain offering.
translation:
  language: tl
  text: Pira-pirasuhin mo ito, at buhusan mo ito ng langis; handog na butil ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּת֤וֹת אֹתָהּ פִּתִּים
  choice: Pagpira-pirasuhin mo iyon
  rationale: Ang infinitive absolute na פָּתוֹת ay may puwersang pautos, at ang פִּתִּים ay nagsasaad ng mga pirasong bunga ng paghahati o pagputol. Likas at malinaw sa modernong Tagalog ang “pagpira-pirasuhin.”
- source_word: וְיָצַקְתָּ
  choice: at buhusan mo
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubiling pangritwal ay may puwersang pautos. Ang “buhusan” ay natural para sa pagbubuhos ng langis sa ibabaw ng handog.
- source_word: עָלֶיהָ שָׁמֶן
  choice: iyon ng langis
  rationale: Tinutukoy ng hulaping pambabae ang naunang handog o pagkaing inihanda. Pinananatili ang payak na “langis” sapagkat hindi tahasang sinasabi ng Hebreo na langis ng olibo.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa konteksto ng Levitico 2, ang terminong pangkulto ay tumutukoy sa handog na mula sa butil; malinaw ito sa karaniwang mambabasa at hindi nililimitahan sa isang partikular na anyo ng harina o tinapay.
- source_word: הִוא
  choice: iyon
  rationale: 'Ang hiwalay na panghalip ay tumutukoy at nagbibigay-diin sa bagay na inilarawan: iyon ay isang handog na butil.'
theological_decisions: []
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang pautos na anyong may “mo” upang maipakita ang ikalawang panauhang panlalaki sa Hebreo nang hindi nagpapahiwatig ng kasarian sa Tagalog. Walang talababa dahil sapat na naihahatid ng “pagpira-pirasuhin” ang diin ng Hebreo sa paghahati sa maliliit na piraso.
