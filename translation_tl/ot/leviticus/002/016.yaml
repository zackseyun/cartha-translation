  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: tl
  text: Susunugin ng pari ang bahaging pang-alaala nito mula sa dinurog nitong butil[a] at mula sa langis nito, kasama ang lahat ng kamanyang nito—isang handog na inihandog sa pamamagitan ng apoy para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magaspang na giniling na butil.” Ang salitang Hebreo ay tumutukoy sa dinurog na mga butil na inihanda para sa handog na butil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: susunugin ... sa altar
  rationale: Sa konteksto ng paghahandog, tumutukoy ang Hiphil ng קטר sa pagsunog ng handog sa altar upang pumailanlang ang usok. Nilinaw ng “sa altar” ang ritwal na diwa nang hindi ginagawang mabigat ang pangungusap.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na salin ng כהן sa makabagong Tagalog.
- source_word: אַזְכָּרָתָהּ
  choice: bilang bahaging pang-alaala nito
  rationale: Teknikal itong katawagan para sa kinatawang bahagi ng handog na butil na sinusunog sa altar. Pinananatili ng “bahaging pang-alaala” ang ideya ng isang bahagi at ang tungkuling pang-alaala nito.
- source_word: מִגִּרְשָׂהּ
  choice: ang ilang dinurog na butil
  rationale: Ang גרש ay tumutukoy sa dinurog o magaspang na giniling na mga butil. Likas at madaling maunawaan ang “dinurog na butil”; ipinahihiwatig ng “ilang” na mula rito kinukuha ang bahaging sinusunog.
- source_word: וּמִשַּׁמְנָהּ
  choice: at langis nito
  rationale: Ipinapakita ng מן na ang bahaging pang-alaala ay kinukuha mula sa butil at langis. Sa Tagalog, sapat na ang koordinasyong “at langis nito” kasunod ng “ang ilang,” na saklaw ang kapuwa sangkap.
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: kasama ang lahat ng kamanyang nito
  rationale: Sa tagubiling pansakripisyo, ipinahihiwatig ng על na kasabay na sinusunog ang buong kamanyang. Natural sa Tagalog ang “kasama.”
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Teknikal na katawagan ito para sa handog na inihaharap sa pamamagitan ng apoy. Mas malinaw ito kaysa “handog na apoy,” na maaaring magpahiwatig na apoy mismo ang handog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahayag ng pag-uukol o patutunguhan ng handog; natural sa Tagalog ang “para kay.” Pinananatili ang pangalang tipan na Yahweh.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng אַזְכָּרָה sa ritwal
  choice: bahaging pang-alaala
  alternative: handog na pang-alaala; bahaging nagpapaalaala
  rationale: Hindi nililinaw ng teksto kung kanino o ano ang ipinapaalaala. Pinananatili ng salin ang teknikal na diwa at ang likas na teolohikal na hindi-tiyak na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pari,” “kamanyang,” at “handog” bilang pamilyar na bokabularyong panritwal. Ang marker na [a] ay inilagay agad pagkatapos ng pariralang nililinaw nito.
