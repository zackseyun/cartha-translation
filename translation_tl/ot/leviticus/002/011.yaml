base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: tl
  text: Ang bawat handog na butil na ihahandog ninyo kay Yahweh ay hindi dapat gawing pinaalsa, sapagkat hindi kayo magsusunog ng anumang pampaalsa o pulot[a] mula rito bilang handog na pinaraan sa apoy[b] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa sinaunang gamit, ang “pulot” ay maaari ring tumukoy sa matamis na katas o arnibal mula sa prutas, hindi lamang sa pulot-pukyutan.
    reason: cultural_note
  - marker: b
    text: O “handog sa pamamagitan ng apoy.” Ang salitang Hebreo ay tumutukoy sa handog na inihaharap sa altar sa pamamagitan ng pagsusunog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: handog na butil
  rationale: Sa konteksto ng Levitico 2, tumutukoy ito sa handog na yari sa harina o butil, hindi sa pangkalahatang uri ng handog.
- source_word: תַּקְרִיבוּ
  choice: ihahandog ninyo
  rationale: Likas na Filipino para sa paghaharap o paglalapit ng handog sa kontekstong pansakripisyo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang tipanang pangalan ng Diyos na tahasang nasa tekstong Hebreo.
- source_word: תֵעָשֶׂה חָמֵץ
  choice: hindi dapat ihanda nang may pampaalsa
  rationale: Ipinahahayag nang natural ang pagbabawal na gawing pinaalsa ang handog.
- source_word: שְׂאֹר
  choice: pampaalsa
  rationale: Tumutukoy sa sangkap na nagpapaalsa; hindi ito nililimitahan sa makabagong komersiyal na yeast.
- source_word: דְּבַשׁ
  choice: pulot
  rationale: Ito ang karaniwang kahulugan, habang inilalahad sa talababa na maaari rin itong sumaklaw sa matamis na katas ng prutas.
- source_word: לֹא תַקְטִירוּ
  choice: hindi kayo magsusunog
  rationale: Tumpak na inilalarawan ang rituwal na pagsusunog sa altar upang paalising usok ang handog.
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Pinananatili ang pang-isahang panghalip na pinakamalamang na tumutukoy pabalik sa handog na butil.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Malinaw na ipinakikita ang teknikal na kategorya ng handog na inihaharap sa altar sa pamamagitan ng apoy, nang hindi ipinapalagay na literal itong pagkain ng Diyos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang mismong personal at tipanang pangalan na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Pinananatili ang tiyak na ugnayan nito sa apoy at altar at iniiwasang lutasin nang labis ang pinagtatalunang etimolohiya o rituwal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pampaalsa” bilang pangkalahatang terminong kultiko at ang “mula rito” upang mapanatili ang pang-isahang sanggunian ng Hebreo. Ang lahat ng marker ng talababa ay nakalagay sa pangunahing teksto.
