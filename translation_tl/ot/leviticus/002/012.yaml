base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: tl
  text: Bilang handog ng mga unang bunga[a], maaari ninyong iharap ang mga iyon kay Yahweh; ngunit hindi dapat iakyat ang mga iyon sa altar bilang kaaya-ayang samyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “bilang handog na unang bunga.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hindi sila aakyat sa altar para sa kaaya-ayang samyo,” isang pananalitang tumutukoy sa paghahandog sa altar sa pamamagitan ng pagsusunog.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: handog mula sa unang ani
  rationale: Ipinahahayag nito ang handog na binubuo ng unang bunga o ani. Natural sa makabagong Tagalog ang “unang ani,” samantalang nililinaw ng “mula sa” ang ugnayan ng dalawang pangngalan.
- source_word: תַּקְרִיבוּ
  choice: maaari ninyong iharap
  rationale: Sa kontekstong ito, pinahihintulutang dalhin ang mga ito bilang handog bagaman hindi susunugin sa altar. Ang “iharap” ay malinaw na nagsasaad ng pagdadala sa Diyos nang hindi inuulit ang “handog.”
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy ang panlalaking pangmaramihang panghalip sa mga bagay na may pampaalsa o pulot na binanggit sa naunang talata. Mas natural dito ang “mga iyon” kaysa personal na panghalip.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pang-ukol na “kay” sapagkat ang banal na pangalan ay pangalan ng Diyos; pinananatili ang pangalang Yahweh.
- source_word: לֹא יַעֲלוּ
  choice: hindi dapat iakyat
  rationale: Pinananatili nito ang larawan ng Hebreong pandiwang “umakyat” habang malinaw na ang tinutukoy ay paglalagay o paghahandog sa altar.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang kaaya-ayang samyo
  rationale: Pinananatili ang nakagawiang metapora ng paghahandog at ang diwa ng isang samyong kalugod-lugod o katanggap-tanggap sa Diyos.
theological_decisions:
- issue: Paglalarawan sa pag-akyat sa altar
  choice: hindi dapat iakyat ... bilang kaaya-ayang samyo
  alternative: hindi dapat sunugin ... bilang handog na kalugod-lugod
  rationale: Hindi tahasang pinapalitan ng salin ang metapora ng pag-akyat ng usok ng paliwanag tungkol sa pagtanggap ng Diyos; sa halip, pinananatili ang kultikong larawan at ang teolohikal na tensiyon ng parirala.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pangalan ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “unang ani” sa halip na mas teknikal o makalumang “mga unang bunga,” at pinanatili ang larawang “iakyat” upang manatiling malapit sa Hebreo.
