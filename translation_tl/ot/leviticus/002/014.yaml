base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: tl
  text: '14 Kung maghahandog ka kay Yahweh ng handog mula sa mga unang ani, ihandog mo ang handog mula sa iyong mga unang ani: mga sariwang uhay na inihaw sa apoy, mga dinurog na butil mula sa bagong ani.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga luntiang uhay na inihaw sa apoy, dinurog na butil ng bagong ani.”
    reason: Pinananatili ang leksikal na posibilidad na idiin ng אָבִיב ang luntian o murang yugto ng uhay at ng כַּרְמֶל ang bagong ani.
lexical_decisions:
- source_word: מִנְחַת
  choice: handog
  rationale: Sa Levitico 2, ang מִנְחָה ay handog na binubuo ng ani o butil. Ang “handog” ay likas sa modernong Tagalog, samantalang nililinaw ng kasunod na parirala ang uri at sangkap nito.
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: mga unang ani
  rationale: Tumutukoy ito sa unang bunga o unang hinog na ani na inihahandog sa Diyos. Ang “mga unang ani” ay malinaw at angkop sa kontekstong agrikultural at panritwal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
- source_word: אָבִיב
  choice: mga sariwang uhay
  rationale: Tumutukoy ang אָבִיב sa butil na nasa uhay at sariwa o nasa maagang yugto ng pagkahinog. Pinananatili ng “mga sariwang uhay” ang kongkretong larawang agrikultural nang hindi labis na pinipinuhan ang yugto ng pagkahinog.
- source_word: קָלוּי בָּאֵשׁ
  choice: inihaw sa apoy
  rationale: Malinaw at likas na ipinapahayag nito ang paghahanda ng butil sa pamamagitan ng apoy.
- source_word: גֶּרֶשׂ
  choice: mga dinurog na butil
  rationale: Ang salita ay tumutukoy sa butil na dinurog o binasag. Ang saling ito ay kongkreto at madaling maunawaan.
- source_word: כַּרְמֶל
  choice: mula sa bagong ani
  rationale: Sa kontekstong ito, tumutukoy ito sa sariwa o bagong aning butil, hindi sa pangalang pantangi o lupang halamanan.
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: maghahandog ... ihandog mo
  rationale: Pinananatili ang pag-uulit ng pandiwa at ang ritwal na diwa ng pagdadala o paghaharap ng handog sa Diyos, sa natural na anyong Tagalog.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng מִנְחָה sa talata
  choice: handog
  alternative: handog na butil
  rationale: Ang payak na “handog” ay nagpapanatili sa mas malawak na leksikal na saklaw ng מִנְחָה, habang malinaw namang tinutukoy ng kasunod na mga salita na ani o butil ang inihahandog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “maghahandog/ihandog” para sa likas na ritwal na pananalita, at iniwasan ang arkaiko o labis na teknikal na bokabularyo.
