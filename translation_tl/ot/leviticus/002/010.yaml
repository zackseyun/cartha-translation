base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: tl
  text: At ang natira sa handog na butil ay para kay Aaron at sa kanyang mga anak na lalaki; ito ay kabanal-banalan mula sa mga handog para kay Yahweh na pinaraan sa apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa mga handog na pagkain para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: At ang natira
  rationale: Ang anyong may pantukoy ay ginagamit bilang pangngalan at tumutukoy sa bahaging natira; natural at tuwiran ito sa makabagong Tagalog.
- source_word: מִן הַמִּנְחָה
  choice: sa handog na butil
  rationale: Sa Levitico 2, ang מִנְחָה ay partikular na handog mula sa ani o butil, hindi lamang pangkalahatang handog.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ay para kay Aaron at sa kanyang mga anak
  rationale: Ipinahihiwatig ng לְ ang paglalaan o pag-aari; malinaw itong naipapahayag ng “para kay” sa Tagalog.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Pinananatili nito ang Hebreong paraang nagpapahayag ng sukdulang antas ng kabanalan nang hindi nagdaragdag ng salitang “bahagi.”
- source_word: מֵאִשֵּׁי
  choice: mula sa mga handog ... na pinaraan sa apoy
  rationale: Ang אִשֶּׁה ay terminong panghandog para sa inihahandog sa Diyos sa pamamagitan ng apoy; mas malinaw ito kaysa sa literal ngunit maaaring malabong “mga handog na apoy.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Kahulugan ng אִשֵּׁי יְהוָה
  choice: mga handog kay Yahweh na pinaraan sa apoy
  alternative: mga pagkaing handog ni Yahweh
  rationale: Pinananatili ng pangunahing salin ang malinaw na kaugnayan ng salita sa paghahandog sa pamamagitan ng apoy, habang inilalagay sa talababa ang lehitimong pagkaunawa rito bilang “pagkaing handog.”
- issue: Paglalarawan sa natirang bahagi bilang קֹדֶשׁ קָדָשִׁים
  choice: ito ay kabanal-banalan
  alternative: isang kabanal-banal na bahagi
  rationale: Hindi tahasang nasa Hebreo ang pangngalang “bahagi”; ang panghalip na “ito” ay likas sa Tagalog at pinananatiling nakatuon ang paglalarawan sa natira.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handog na butil” bilang madaling maunawaang terminong pangsakripisyo, “kabanal-banalan” para sa Hebreong superlatibo, at “Yahweh” para sa banal na pangalan.
