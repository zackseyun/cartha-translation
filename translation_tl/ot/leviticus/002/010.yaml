revisions:
- from: At ang natira sa handog na butil ay para kay Aaron at sa kanyang mga anak; ito ay kabanal-banalan mula sa mga handog kay Yahweh na pinaraan sa apoy.[a]
  to: At ang natira sa handog na butil ay para kay Aaron at sa kanyang mga anak na lalaki; ito ay kabanal-banalan mula sa mga handog para kay Yahweh na pinaraan sa apoy.[a]
  rationale: Binago lamang ang “mga anak” tungo sa “mga anak na lalaki” upang maipakita ang tinutukoy ng Hebreo sa kontekstong saserdotal. Bahagyang inayos ang ayos ng pariralang panghandog para sa likas na Filipino. Pinanatili ang “kabanal-banalan,” ang terminong “handog na butil,” ang pangalang “Yahweh,” at ang talababa na nagpapakita ng alternatibong pag-unawa sa אִשֶּׁה.
