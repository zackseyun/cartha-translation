id: LEV.2.1
reference: Leviticus 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: tl
  text: Kapag ang isang tao ay maghahandog kay Yahweh ng handog na butil[a], ang handog niya ay dapat na pinong harina. Bubuhusan niya ito ng langis at lalagyan ng kamangyan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “handog na butil” ay salin ng Hebreong מִנְחָה (minḥah). Dito, ito ay handog na gawa sa pinong harina.
    reason: cultural_note
  - marker: b
    text: Ang “kamangyan” ay frankincense, isang mabangong dagta na ginagamit sa pagsamba.
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: may taong
  rationale: Bagaman literal na “kaluluwa,” tumutukoy ito rito sa isang indibidwal; natural sa makabagong Filipino ang “may taong” sa kondisyong legal.
- source_word: תַקְרִיב
  choice: maghahandog
  rationale: Ang Hiphil ng קרב ay paglalapit o paghaharap bilang handog; malinaw at likas sa kontekstong pangritwal ang “maghahandog.”
- source_word: קָרְבַּן מִנְחָה
  choice: handog na butil
  rationale: Ang קָרְבַּן ay pangkalahatang handog, samantalang ang מִנְחָה sa kontekstong ito ay handog na mula sa butil; pinananatili ng parirala ang dalawang sangkap nang hindi nagiging mabigat.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang “Yahweh”; ang “kay” ay natural na pananda sa pinatutungkulan ng paghahandog.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Tumutukoy sa harinang pinong giniling na ginagamit sa paghahandog.
- source_word: יִהְיֶה קָרְבָּנוֹ
  choice: pinong harina ang ihahandog niya
  rationale: Inilalahad nang natural sa Filipino ang kinakailangang sangkap ng handog habang pinananatili ang pang-isahang kinatawang anyo.
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: Bubuhusan niya iyon ng langis
  rationale: Ang sunod-sunod na pandiwang Hebreo ay may lakas ng tagubilin; ang aspektong kontemplatibo sa Filipino ay angkop sa ipinag-uutos na gagawin.
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: at lalagyan ng insenso
  rationale: Ang לְבֹנָה ay frankincense, isang mabangong dagta; “insenso” ang pinakanatural at nauunawaang tawag sa Filipino, na nililinaw sa talababa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit ng teksto ang Tetragrammaton bilang natatanging pangalan; pinananatili itong pangalan sa saling “Yahweh” sa halip na palitan ng titulo.
- issue: Kasarian at bilang sa kinatawang pananalitang legal
  choice: taong ... niya
  alternative: sinuman ... nila
  rationale: Pang-isahan ang Hebreo at may panlalaking pang-isahang hulapi, ngunit ang נֶפֶשׁ ay tumutukoy sa sinumang indibidwal. Ang “taong ... niya” ay nagpapanatili ng pang-isahan nang hindi nagdaragdag ng di-kinakailangang kasariang gramatikal sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “maghahandog” upang pagsamahin nang natural ang ideya ng pagdadala at paghaharap ng handog. Ang “iyon” ay tumutukoy sa pinong harina/handog; hindi inulit ang panghalip sa huling sugnay sapagkat malinaw na ito sa Filipino.
