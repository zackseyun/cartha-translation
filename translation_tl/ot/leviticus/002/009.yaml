  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: tl
  text: Kukuha ang pari mula sa handog na butil ng bahaging pang-alaala nito at susunugin niya ito sa altar bilang handog na pagkain[a], isang samyong kalugod-lugod kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: handog na pinaraan sa apoy.'
    reason: Pinananatili ang alternatibong leksikal na pagbasa sa אִשֵּׁה, na tradisyonal na inuunawang handog na ginawa o inihandog sa pamamagitan ng apoy.
lexical_decisions:
- source_word: וְהֵרִים
  choice: iaangat
  rationale: Pinananatili nito ang konkretong kilos ng Hiphil ng רום sa ritwal, habang likas pa rin sa modernong Filipino ang diwang pagkuha o paghiwalay ng isang bahagi.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katawagan sa Filipino para sa כֹּהֵן sa kontekstong panghandog.
- source_word: מִן הַמִּנְחָה
  choice: mula sa handog na butil
  rationale: Sa Levitico 2, ang מִנְחָה ay partikular na handog na mula sa butil; malinaw at madaling maunawaan ang “handog na butil.”
- source_word: אַזְכָּרָתָהּ
  choice: ang bahaging pang-alaala nito
  rationale: Ipinakikita ng “bahagi” na hindi buong handog ang sinusunog, at pinananatili ng “pang-alaala” ang ritwal na diwa ng אַזְכָּרָה nang hindi ito labis na ipinapaliwanag.
- source_word: וְהִקְטִיר
  choice: at susunugin iyon
  rationale: Sa kontekstong panghandog, tumutukoy ang Hiphil ng קטר sa pagsunog ng handog sa altar, na likas na ipinahahayag sa Filipino sa ganitong paraan.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ito ang natural na salin ng patungong anyo sa idyomang tumutukoy sa pagsunog na ginagawa sa ibabaw ng altar.
- source_word: אִשֵּׁה
  choice: handog na pagkain
  rationale: Ipinahahayag nito ang kategoryang panghandog sa tekstong makapari; dahil maaari rin itong unawain bilang handog na pinaraan sa apoy, inilagay ang alternatibo sa talababa.
- source_word: רֵיחַ נִיחֹחַ
  choice: samyong kalugod-lugod
  rationale: Pinananatili nito ang larawang pandama at ang diwa ng pagtanggap ng Diyos, sa marangal at kasalukuyang Filipino.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang kinakatawan nito ang banal na pangalang יהוה sa pinagmulang Hebreo.
theological_decisions:
- issue: Kahulugan ng pormulang panghandog na אִשֵּׁה רֵיחַ נִיחֹחַ
  choice: handog na pagkain, na may samyong kalugod-lugod kay Yahweh
  alternative: handog na pinaraan sa apoy, na may samyong kalugod-lugod kay Yahweh
  rationale: Pinananatili ng pangunahing salin ang idyomang makapari nang hindi nagdaragdag ng mas huling paliwanag na teolohikal. Dahil may tunay na leksikal na posibilidad na idiin ang apoy sa אִשֵּׁה, tahasang pinananatili iyon sa talababa.
- issue: Paglalarawan sa samyo bilang kalugod-lugod sa Diyos
  choice: samyong kalugod-lugod kay Yahweh
  alternative: samyong nakapagpapalugod kay Yahweh
  rationale: Pinananatili ang antropomorpikong larawan at motibo ng banal na pagtanggap, ngunit hindi ipinapaliwanag kung paano o bakit nakalulugod ang handog.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pari,” “handog na butil,” at “altar” bilang pamilyar na bokabularyong panrelihiyon; iniwasan ang arkaiko o labis na teknikal na pananalita.
