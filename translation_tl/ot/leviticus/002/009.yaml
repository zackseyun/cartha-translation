  terminology: Ang “handog na butil,” “bahaging pang-alaala,” “altar,” at “handog na pagkain” ay angkop at magkakatugma sa audit trail. Pinanatili ang “Yahweh,” gaya ng umiiral na draft at ng tuwirang anyo ng banal na pangalan sa pinagmulan. Ang talababa ay nananatiling isang leksikal na alternatibo para sa אִשֵּׁה.
