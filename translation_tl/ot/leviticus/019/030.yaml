  text: אֶת שַׁבְּתֹתַ֣/י תִּשְׁמֹ֔רוּ וּ/מִקְדָּשִׁ֖/י תִּירָ֑אוּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: tl
  text: Ingatan ninyo ang aking mga Sabbath, at igalang ninyo ang aking santuwaryo.[a] Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “katakutan ninyo ang aking santuwaryo.” Ang pandiwang Hebreo ay maaaring mangahulugang “matakot” o “magpitagan”; dito, tumutukoy ito sa banal na paggalang sa sagradong lugar ni Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: aking mga Sabbath
  rationale: Pinananatili ang tahasang anyong maramihan sa Hebreo at ang katawagang tumutukoy sa mga itinakdang pangingilin ni Yahweh.
- source_word: תִּשְׁמֹרוּ
  choice: Ingatan ninyo
  rationale: Saklaw ng שׁמר ang pag-iingat, pagtupad, at maingat na pagsunod. Ang “ingatan” ay maikli, marangal, at angkop sa wikang tipan at kautusan.
- source_word: מִקְדָּשִׁי
  choice: aking santuwaryo
  rationale: Ang מִקְדָּשׁ ay banal na lugar o santuwaryo. Hindi nito labis na tinutukoy kung tabernakulo o templo ang tinutukoy.
- source_word: תִּירָאוּ
  choice: igalang ninyo
  rationale: Maaaring mangahulugan ang ירא ng pagkatakot o pagpipitagan. Sa kontekstong ito, malinaw na ipinahahayag ng “igalang” ang banal at taimtim na pagpapahalaga sa santuwaryo nang hindi nililimitahan ang diwa sa sindak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal at tipanang pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Natural na pormula ng pagpapakilala sa modernong Tagalog na pinananatili ang mariing pagkakakilanlan ng nagsasalita.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Diwa ng ירא kapag ang santuwaryo ang layon
  choice: igalang ninyo ang aking santuwaryo
  alternative: katakutan ninyo ang aking santuwaryo
  rationale: Pinipili ng pangunahing teksto ang natural na pagpapahayag ng banal na pagpipitagan, habang pinananatili sa talababa ang tunay na leksikal na posibilidad na “katakutan.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at bahagyang pormal para sa tekstong kautusan. Pinanatili ang maramihang “mga Sabbath,” ang terminong “santuwaryo,” at ang personal na pangalang “Yahweh.”
