review_pass:
  verdict: revise
  source_fidelity: Ang unang utos ay wastong naihahatid bilang pagbabawal sa pagsasamantala sa kapwa, at ang ikalawa ay pagbabawal sa pagnanakaw. Gayunman, ang “itabi sa iyo” ay karaniwang nangangahulugang maglaan o magreserba, hindi magkulong magdamag o magpigil ng sahod. Mas tapat sa תָלִין ... אִתְּךָ ang “panatilihin sa iyo hanggang umaga.”
  naturalness: Moderno at malinaw ang register. Mas tuwiran at natural sa utos ang “nakawan siya” kaysa “pagnakawan siya,” at ang binagong ikalawang pangungusap ay malinaw na tumutukoy sa pagpigil ng sahod.
  terminology: Ang “kapwa,” “pagsamantalahan,” “sahod,” at “upahang manggagawa” ay angkop na mga katumbas sa kontekstong etikal at pangkabuhayan. Walang isyung teolohikal o pangngalang pantangi.
  issues:
  - severity: medium
    issue: Ang “itabi sa iyo” ay hindi wastong tumutumbas sa pagbabawal na manatili o ipagpaliban magdamag ang sahod.
    rationale: Ang תָלִין ay tumutukoy sa pananatili/pagpapalipas ng gabi, at ang אִתְּךָ ay nagsasaad na nasa iyo pa ang sahod. Ang “itabi” ay maaaring magpahiwatig ng wastong paglalaan, kaya hindi malinaw ang ipinagbabawal na pagpigil ng bayad.
  - severity: low
    issue: Ang “pagnakawan siya” ay hindi gaanong tuwirang anyo para sa nag-iisang ipinagbabawal na pagkilos.
    rationale: Ang “nakawan siya” ay mas payak at mas natural na katumbas ng “rob him,” nang hindi nagdaragdag ng aspektong paulit-ulit o maramihan.
  revised_text: Huwag mong pagsamantalahan ang iyong kapwa o nakawan siya. Huwag mong panatilihin sa iyo hanggang umaga ang sahod ng isang upahang manggagawa.
