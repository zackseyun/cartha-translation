  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: tl
  text: Huwag mong pagsamantalahan ang iyong kapwa o nakawan siya. Huwag mong panatilihin sa iyo hanggang umaga ang sahod ng isang upahang manggagawa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: pagsamantalahan
  rationale: Saklaw ng pandiwang ito ang mapaniil na pag-abuso sa kapwa, lalo na ang pagkakait ng nararapat sa kaniya. Likas at malinaw sa modernong Filipino ang “pagsamantalahan.”
- source_word: רֵעֲךָ
  choice: iyong kapwa
  rationale: Sa kontekstong legal at etikal, tumutukoy ito sa kapwa sa pamayanan; pinananatili ng “kapwa” ang malawak na ugnayang panlipunan.
- source_word: תִגְזֹל
  choice: pagnakawan
  rationale: Ang ugat ay tumutukoy sa marahas o labag-sa-katarungang pag-agaw. Ang “pagnakawan” ay maikli, natural, at mas tiyak kaysa pangkalahatang “kuhanan.”
- source_word: תָלִין
  choice: itabi ... hanggang umaga
  rationale: Literal na ang sahod ay hindi dapat magpalipas ng gabi sa may-ari. Ang aktibong anyo ay mas natural sa Filipino at malinaw na ipinagbabawal ang pagpigil sa bayad.
- source_word: פְּעֻלַּת
  choice: ang sahod ng
  rationale: Bagaman maaari itong mangahulugang gawa o kabayaran, hinihingi ng pagsama nito sa upahang manggagawa at ng konteksto ng pagpigil sa bayad ang kahulugang “sahod.”
- source_word: שָׂכִיר
  choice: isang upahang manggagawa
  rationale: Malinaw nitong ipinahahayag na ang tao ay nagtatrabaho kapalit ng sahod, sa dignidad at kasalukuyang wikang Filipino.
- source_word: אִתְּךָ
  choice: sa iyo
  rationale: Ipinahihiwatig nitong nananatili sa pag-iingat o pag-aari ng nagpapatrabaho ang sahod; direktang katumbas nito ang “sa iyo.”
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Pinananatili nito ang kongkretong takdang panahon ng Hebreo sa halip na gawing mas malayang “magdamag.”
