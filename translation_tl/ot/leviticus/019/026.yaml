  naturalness: Direkta at angkop sa modernong Filipino Tagalog ang mga pagbabawal. Pinalitan ang hindi idiomatiko at posibleng mapanlinlang na “kumain sa ibabaw ng dugo” ng natural na pananalitang hindi pa rin nagsasara sa kahulugan. Ginawang “manghula” ang unang gawaing ipinagbabawal upang maging mas maigsi at likas kaysa “magsagawa ng panghuhula.”
  terminology: Ang “manghula” ay angkop para sa נחשׁ sa kontekstong ito, samantalang ang “magbasa ng mga palatandaan” ay malinaw para sa ענן. Ang “mga palatandaan” ay mas natural na katumbas ng omens kaysa sa mas pangkalahatang “mga tanda.”
