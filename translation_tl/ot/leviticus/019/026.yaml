  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: tl
  text: Huwag kayong kumain na may kaugnayan sa dugo.[a] Huwag kayong manghula o magbasa ng mga palatandaan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa ibabaw ng dugo.” Mahirap tiyakin ang kahulugan ng Hebreong pananalita; maaari rin itong mangahulugang “kasama ng dugo.” Maaaring tumukoy ito sa pagkain ng karneng may dugo pa o sa pakikibahagi sa isang ritwal na kainan na may kaugnayan sa dugo.
    reason: alternative_reading
  - marker: b
    text: Ang “magbasa ng mga palatandaan” ay maaari ring isaling “manghula” o, ayon sa tradisyonal na salin, “magmasid ng mga panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: Huwag kayong kumain
  rationale: Ang negatibong imperfect sa kontekstong pambatas ay isang tuwirang pagbabawal. Likas at malinaw sa modernong Tagalog ang “Huwag kayong kumain.”
- source_word: עַל הַדָּם
  choice: sa ibabaw ng dugo
  rationale: Mahirap at hindi tiyak ang idyomatikong parirala. Pinananatili ng medyo literal na salin ang pang-ukol na עַל at iniiwasang ipasya kung ang tinutukoy ay karneng may dugo pa o isang ritwal na may kaugnayan sa dugo.
- source_word: תְנַחֲשׁוּ
  choice: magsagawa ng panghuhula
  rationale: Ang pandiwang נחשׁ sa piel ay tumutukoy sa gawaing divinatoryo. Malinaw sa karaniwang mambabasa ang “magsagawa ng panghuhula” at ipinakikitang isang ipinagbabawal na gawain ang tinutukoy.
- source_word: תְעוֹנֵנוּ
  choice: magbasa ng mga tanda
  rationale: Malamang na tumutukoy ang pandiwa sa pagbasa o pagpapakahulugan sa mga palatandaan bilang hula. Natural at madaling maunawaan ang “magbasa ng mga tanda,” habang hindi nito ginagamit ang malabong tradisyonal na ideya ng “pagmamasid sa mga panahon.”
theological_decisions:
- issue: Kung gaano katiyak na isasalin ang malabong pagbabawal na עַל הַדָּם
  choice: Panatilihin sa pangunahing teksto ang medyo literal na “sa ibabaw ng dugo”
  alternative: “kasama ng dugo,” “habang may dugo pa ang karne,” o “sa isang ritwal na kainan na may dugo”
  rationale: Pinagtatalunan ang eksaktong gawaing ipinagbabawal. Maaaring tumukoy ito sa pagkain ng karneng may dugo pa, sa isang ritwal na kainan na may kaugnayan sa dugo, o sa iba pang gawaing kultiko. Pinananatili ng pangunahing teksto ang tunay na kalabuan, at inilalagay sa talababa ang mas tiyak na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang pangmaramihang “kayo” upang katawanin ang mga pandiwang Hebreo na nasa ikalawang panauhang panlalaking maramihan. Iniwasan ang masyadong arkaikong pananalita, ngunit pinanatili ang pormal na himig ng batas at ang kalabuan ng unang pagbabawal.
