  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: tl
  text: Huwag kang maglibot sa iyong bayan na nagpapakalat ng mapanirang balita. Huwag kang tumindig laban sa dugo ng iyong kapwa.[a] Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Huwag kang tumayo lamang at walang gawin habang ibinubuhos ang dugo ng iyong kapwa.”
    reason: Pinananatili nito ang alternatibong pagkaunawa sa pariralang לֹא תַעֲמֹד עַל דַּם רֵעֶךָ bilang pagbabawal sa walang-kibong pagmamasid habang nanganganib o pinapatay ang kapwa.
lexical_decisions:
- source_word: תֵלֵךְ
  choice: maglibot
  rationale: Ang pandiwang הלך ay pangunahing nangangahulugang ‘lumakad’ o ‘pumunta.’ Kasama ng רָכִיל, inilalarawan nito ang pag-iikot sa pamayanan upang magkalat ng mapanirang ulat; natural na naipapahayag ito ng ‘maglibot.’
- source_word: רָכִיל
  choice: maninirang-puri
  rationale: Tumutukoy ang רָכִיל sa taong nagpapakalat ng nakapipinsalang mga ulat. Mas malinaw at mas mabigat ang ‘maninirang-puri’ kaysa sa mas magaan na ‘tsismoso,’ bagaman hindi nito ipinapalagay na bawat ulat ay pormal na kasinungalingan.
- source_word: בְּעַמֶּיךָ
  choice: sa gitna ng iyong bayan
  rationale: Ipinahahayag ng בְּ kasama ng עַם ang pagkilos sa loob ng sariling pamayanan. Ang ‘sa gitna ng iyong bayan’ ay natural at pinananatili ang kolektibong diwa.
- source_word: תַעֲמֹד
  choice: tumindig
  rationale: Pangunahing kahulugan ng עמד ang ‘tumayo’ o ‘tumindig.’ Pinananatili ng ‘tumindig’ ang konkretong larawan at ang seryosong tono ng utos.
- source_word: עַל
  choice: laban sa
  rationale: Maaaring ipahiwatig ng עַל dito ang pagpanig o pagkilos laban sa buhay ng kapwa, ngunit maaari rin itong maunawaan bilang pagtayo lamang sa tabi habang nangyayari ang pagdanak ng dugo. Pinili ang ‘laban sa’ sa pangunahing teksto at inilagay sa talababa ang mahalagang alternatibo.
- source_word: דַּם
  choice: dugo
  rationale: Literal na ‘dugo’ ang דָּם at maaari itong kumatawan sa buhay o pagdanak ng dugo. Pinananatili ng salin ang kongkretong larawang Hebreo at ang legal-etikal na bigat nito.
- source_word: רֵעֶךָ
  choice: iyong kapwa
  rationale: Sa kontekstong ito, ang רֵעַ ay isang kasamahan o kapwa miyembro ng pamayanan. Malinaw at karaniwan sa makabagong Filipino ang ‘kapwa.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang ‘Yahweh’ upang panatilihin ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng לֹא תַעֲמֹד עַל דַּם רֵעֶךָ
  choice: Isang pagbabawal na tumindig o kumilos laban sa dugo, at sa gayon ay laban sa buhay, ng kapwa; isinalin bilang ‘Huwag kang tumindig laban sa dugo ng iyong kapwa.’
  alternative: Isang pagbabawal na tumayo lamang at walang gawin habang ibinubuhos ang dugo ng kapwa; maaari ring iugnay sa mapanganib na patotoo sa isang usaping may parusang kamatayan.
  rationale: Maikli at hindi ganap na tiyak ang pariralang Hebreo. Pinananatili ng pangunahing teksto ang ‘tumindig,’ ‘laban sa,’ at ‘dugo’ upang huwag alisin ang posibilidad ng tuwiran o kasabwat na pagkilos. Inilalahad sa talababa ang malaganap na pagbasa tungkol sa hindi pagkibo sa harap ng panganib sa buhay.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang konkretong larawang ‘dugo’ at ang bahagyang di-likas ngunit makabuluhang ‘tumindig laban’ upang hindi tahimik na lutasin ang tunay na kalabuan ng Hebreo. Inilagay ang talababa sa ikalawang sugnay na siyang aktuwal na pinagmumulan ng alternatibong pagbasa.
