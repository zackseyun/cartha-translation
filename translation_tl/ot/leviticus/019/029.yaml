  text: אַל תְּחַלֵּ֥ל אֶֽת בִּתְּ/ךָ֖ לְ/הַזְנוֹתָ֑/הּ וְ/לֹא תִזְנֶ֣ה הָ/אָ֔רֶץ וּ/מָלְאָ֥ה הָ/אָ֖רֶץ זִמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: tl
  text: Huwag mong lapastanganin ang iyong anak na babae sa pamamagitan ng pagsasadlak sa kaniya sa prostitusyon[a], upang hindi magpatutot ang lupain[b] at hindi ito mapuno ng kabuktutan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagpapapatutot sa kaniya” o “sa pag-uudyok sa kaniya na magpatutot.” Ang pandiwang Hebreo ay nasa anyong sanhi.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “upang hindi magpatutot ang lupain.” Talinghaga ito para sa pagkatiwali ng pamayanan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kahalayan” o “matinding kasamaan.” Ang salitang Hebreo ay tumutukoy sa kasuklam-suklam na kabuktutan, na madalas ay may seksuwal na konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: lapastanganin
  rationale: Pinananatili nito ang diwa ng pagtrato bilang hindi banal o pagyurak sa kabanalan, na mahalaga sa konteksto ng kabanalan sa Levitico. Mas malinaw din ito sa karaniwang mambabasa kaysa sa teknikal na “gawing di-banal.”
- source_word: בִּתְּךָ
  choice: iyong anak na babae
  rationale: Tuwirang katumbas ng pangngalang isahan na may panlaping tumutukoy sa ikalawang panauhang panlalaki na isahan.
- source_word: לְהַזְנוֹתָהּ
  choice: sa pamamagitan ng pagsasadlak sa kanya sa prostitusyon
  rationale: Ang pandiwa ay nasa anyong sanhi; ipinahihiwatig na ang ama ang naglalagay o nagtutulak sa anak sa prostitusyon. Iniiwasan ng “pagsasadlak” ang mapanlait na katawagan sa babae habang pinananatili ang pananagutan ng gumagawa nito.
- source_word: תִזְנֶה הָאָרֶץ
  choice: ang lupain ay hindi malulong sa prostitusyon
  rationale: Pinananatili ang talinghaga ng prostitusyon bilang paglalarawan sa paglaganap ng katiwalian sa buong pamayanan, ngunit ipinapahayag ito sa natural na modernong Tagalog.
- source_word: וּמָלְאָה הָאָרֶץ
  choice: at mapuno
  rationale: Ipinakikita ng anyong ito ang bunga o kahihinatnan ng ipinagbabawal na gawain. Hindi na inuulit ang “lupain” sapagkat malinaw ang tinutukoy at mas natural ito sa Tagalog.
- source_word: זִמָּה
  choice: kabuktutan
  rationale: Saklaw nito ang matinding moral na kasamaan at katiwaliang tinutukoy ng salita, na sa kontekstong ito ay may malinaw na seksuwal na kaugnayan ngunit hindi kailangang limitahan sa seksuwal na imoralidad lamang.
theological_decisions:
- issue: Kung paano isasalin ang talinghaga na ang lupain ay “nagpapatutot”
  choice: Panatilihin ang larangan ng talinghaga sa “malulong sa prostitusyon.”
  alternative: “magpatutot ang lupain” o “maging imoral ang lupain”
  rationale: Ang literal na “magpatutot ang lupain” ay matigas at hindi natural sa modernong Tagalog, samantalang ang “maging imoral” ay nag-aalis sa matinding talinghaga ng Hebreo. Ang napiling salin ay nagpapanatili sa seksuwal at panlipunang larawan nang hindi nagdaragdag ng isang partikular na doktrinal na paliwanag.
- issue: Kung pananatilihin ang bokabularyo ng banal at di-banal sa חלל
  choice: Gamitin ang “lapastanganin.”
  alternative: “dungisan” o “hamakin”
  rationale: Mas malinaw na ipinahihiwatig ng “lapastanganin” ang pagyurak sa banal na katayuan o dangal, kaya naaayon ito sa konseptuwal na daigdig ng Levitico nang hindi ipinapalagay na rituwal na karumihan lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “prostitusyon,” isang karaniwang pormal na salita, upang maiwasan ang mapanlait o lubhang makalumang katawagan. Ang ayos ng pangungusap ay nagpapanatili sa utos at sa dalawang kasunod na bunga ng tekstong Hebreo.
