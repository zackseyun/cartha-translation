  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: tl
  text: Kapag may dayuhan[b] na naninirahang kasama ninyo sa inyong lupain, huwag ninyo siyang pagmamalupitan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “huwag ninyo siyang apihin” o “huwag ninyo siyang gawan ng masama.”
    reason: lexical_alternative
  - marker: b
    text: Ang “dayuhan” ay salin ng Hebreong ger, isang hindi katutubong naninirahan sa gitna ng Israel, hindi lamang isang dumaraang estranghero.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Kapag
  rationale: Naglalahad ito ng isang sitwasyong saklaw ng batas; natural sa makabagong Filipino ang “kapag” at hindi nito labis na binibigyang-diin ang pag-aalinlangan.
- source_word: יָגוּר
  choice: naninirahan
  rationale: Ang pandiwang גור ay tumutukoy sa paninirahan bilang isang hindi katutubo o dayuhang residente, hindi sa pansamantalang pagdaan lamang.
- source_word: אִתְּ/ךָ
  choice: kasama mo
  rationale: Pinananatili ang tuwirang kahulugan ng pang-ukol at ang isahang anyo ng kausap sa sugnay.
- source_word: גֵּר
  choice: dayuhan
  rationale: Tumutukoy ito sa isang hindi katutubong naninirahan sa gitna ng Israel. Malinaw at likas ang “dayuhan,” samantalang ipinahahayag ng “naninirahan” ang mahalagang katayuan niya bilang residente.
- source_word: בְּ/אַרְצְ/כֶם
  choice: sa inyong lupain
  rationale: Ang maramihang hulapi ay tumutukoy sa sambayanan bilang kabuuan. Pinananatili ng “lupain” ang heograpiko at tipanang himig ng אֶרֶץ.
- source_word: לֹא תוֹנוּ
  choice: huwag ninyo siyang pagmamalupitan
  rationale: Ang Hiphil ng ינה ay maaaring mangahulugang gumawa ng masama, mang-api, o magmalupit. Ang “pagmamalupitan” ay malinaw at malawak sa karaniwang Filipino; inilalagay sa talababa ang ibang leksikal na posibilidad.
- source_word: אֹת/וֹ
  choice: siyang
  rationale: Ang isahang panghalip ay tumutukoy pabalik sa גֵּר; natural itong ipinapaloob sa pandiwa sa Filipino.
theological_decisions:
- issue: Pagpapakahulugan sa גֵּר sa batas ng kabanalan ng Israel
  choice: dayuhan
  alternative: dayuhang residente; nakikipamayan
  rationale: Hindi lamang ito isang di-kilalang estranghero o manlalakbay kundi isang hindi katutubong naninirahan sa lupain. Pinagsasama ng “dayuhang naninirahan” ang pagiging hindi katutubo at ang paninirahan nang hindi gumagamit ng teknikal o makalumang katawagan.
- issue: Saklaw ng pagbabawal sa ינה
  choice: pagmamalupitan
  alternative: aapihin; gagawan ng masama
  rationale: Pinananatili ng napiling salita ang malawak na pagbabawal sa mapang-abusong pakikitungo, habang kinikilala sa talababa ang posibleng diin sa pang-aapi o paggawa ng masama.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paglipat mula sa isahang “mo” tungo sa maramihang “inyong/ninyo,” ayon sa mga anyong Hebreo, bagaman bahagyang di-pangkaraniwan ito sa Filipino. Inayos ang mga pananda ng talababa upang lumitaw ang [b] kasunod ng “dayuhan” at ang [a] kasunod ng pagbabawal na tinutukoy ng bawat paliwanag.
