base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: tl
  text: Huwag mong sumpain ang lalaking bingi[a], at huwag kang maglagay ng katitisuran sa harap ng lalaking bulag. Ngunit, matakot ka sa iyong Diyos. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bingi” at “ang bulag.” Gumagamit ang Hebreo ng mga panlalaking anyong isahan bilang mga halimbawang kumakatawan sa batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: sumpain
  rationale: Tuwirang ipinapahayag nito ang karaniwang diwa ng Piel ng קלל at pinananatili ang lakas ng pasalitang pagbabawal.
- source_word: חֵרֵשׁ
  choice: lalaking bingi
  rationale: Pinananatili ang panlalaking isahan ng Hebreo bilang kongkretong halimbawang kumakatawan sa saklaw ng batas.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Natural na Filipino ito para sa malinaw na diwang panlunan ng parirala.
- source_word: עִוֵּר
  choice: lalaking bulag
  rationale: Tumutugma sa panlalaking isahan ng Hebreo at gumaganap bilang kumakatawang kaso sa batas.
- source_word: תִתֵּן
  choice: maglagay
  rationale: Bagaman karaniwang nangangahulugang 'magbigay' ang נתן, ang natural na parirala sa Filipino ay 'maglagay ng katitisuran.'
- source_word: מִכְשֹׁל
  choice: katitisuran
  rationale: Pinananatili nito kapwa ang literal na larawan ng bagay na nakapagpapatisod at ang mas malawak na etikal na pahiwatig.
- source_word: וְיָרֵאתָ
  choice: Sa halip, matakot ka
  rationale: Ipinakikita ang pagsalungat sa lihim na pang-aabuso at ang nararapat na pagkatakot sa Diyos, nang hindi ginagawang sanhi ang waw.
- source_word: מֵאֱלֹהֶיךָ
  choice: sa iyong Diyos
  rationale: Sa konstruksyong ירא מן, ang Diyos ang layon ng pagkatakot; ito ang natural na anyo sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Mga panlalaking anyong kumakatawan sa batas-kaso
  choice: 'Panatilihin ang panlalaking isahan: ''lalaking bingi'' at ''lalaking bulag'''
  alternative: Taong bingi at taong bulag; ang mga bingi at ang mga bulag
  rationale: Panlalaking isahan ang anyo sa Hebreo. Pinananatili ito sa pangunahing teksto habang nililinaw sa talababa na kinatawang mga halimbawa ang mga ito.
- issue: Lakas ng pangwakas na sugnay na nagbibigay-motibasyon
  choice: Sa halip, matakot ka sa iyong Diyos
  alternative: At matakot ka sa iyong Diyos
  rationale: Ang waw ay maaaring simpleng 'at,' ngunit dito ang sugnay ay pumipigil sa pang-aabuso sa mahina sa pamamagitan ng pananagutan sa Diyos. Ipinahihiwatig ng 'Sa halip' ang tungkuling ito nang hindi labis na nilulutas ang teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang anyong pautos na 'Huwag mong' at 'matakot ka'; iniwasan ang labis na teknikal o makalumang pananalita. Ang marker na [a] ay inilagay sa pangunahing teksto.
