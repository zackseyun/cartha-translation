  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אַל תִּפְנוּ֙ אֶל הָ֣/אֱלִילִ֔ים וֵֽ/אלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָ/כֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: tl
  text: Huwag kayong bumaling sa mga diyus-diyosan[a], at huwag kayong gumawa ng mga diyos na hinulma mula sa tunaw na metal para sa inyong sarili[b]. Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga walang kabuluhang diyus-diyosan”; maaaring may mapanlibak na diwa ang salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga diyos na yari sa tunaw na metal” o “mga metal na diyus-diyosan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: bumaling
  rationale: Tuwirang ipinahahayag ng pandiwang פנה na ibaling o ituon ang sarili sa isang bagay. Pinananatili ng “bumaling” ang saklaw ng Hebreo nang hindi ito nililimitahan sa tahasang pagsamba lamang.
- source_word: אֱלִילִים
  choice: mga diyus-diyosan
  rationale: Ito ang natural at karaniwang salin sa modernong Filipino para sa mga idolo o huwad na diyos; ang posibleng mapanlibak na diwang “walang kabuluhan” ay inilagay sa talababa.
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: mga diyos na hinulma mula sa tinunaw na metal
  rationale: Pinananatili nito ang pangmaramihang “mga diyos” at malinaw na ipinapakita ang paggawa ng imahen sa pamamagitan ng paghuhulma ng tinunaw na metal.
- source_word: תַעֲשׂוּ לָכֶם
  choice: gumawa para sa inyong sarili
  rationale: 'Ipinapakita nito ang benefactive na לָכֶם: ang mga bagay ay ginagawa para sa sariling gamit o pag-aari ng kausap.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong pangmaramihan ang אֱלֹהִים, ang pariralang tipan dito ay tumutukoy sa iisang Diyos ng Israel.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” at hindi pinapalitan ng titulo.
- issue: Kung gagawing tahasan ang pagsamba sa utos laban sa mga diyus-diyosan
  choice: Huwag kayong bumaling sa mga diyus-diyosan
  alternative: Huwag kayong sumamba sa mga diyus-diyosan
  rationale: Ang פנה ay literal na “bumaling” at hindi tahasang nangangahulugang “sumamba.” Pinananatili ng salin ang mas malawak na pahayag at ang likas na ambiguity nito.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang pangmaramihang “kayo” alinsunod sa mga pandiwang Hebreo, at pinanatili ang personal na pangalang Yahweh.
