  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: tl
  text: Huwag kayong gagawa ng kawalang-katarungan sa paghatol[a], sa sukat ng haba, sa timbang, o sa sukat ng dami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kayong gagawa ng kawalang-katarungan sa katarungan, sa sukat, sa timbang, o sa sukat ng dami.”
    reason: Pinananatili ang alternatibong pag-unawa sa מִשְׁפָּט bilang “katarungan” at ang mas malapit na pagkakahanay ng mga pariralang Hebreo.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: Huwag kayong gagawa
  rationale: Tuwirang ipinahahayag ang pagbabawal sa ikalawang panauhang maramihan, at pinananatili ang payak na kahulugan ng עשה na ‘gumawa.’
- source_word: עָוֶל
  choice: kawalang-katarungan
  rationale: Saklaw nito ang mali, pandaraya, at di-makatarungang pakikitungo sa legal at pangkalakal na konteksto.
- source_word: בַּמִּשְׁפָּט
  choice: sa paghatol
  rationale: Pinananatili nito ang karaniwang diwa ng מִשְׁפָּט bilang paghatol o pagpapasya, habang kinikilala ng talababa ang posibleng mas malawak na kaugnayan nito sa makatarungang pakikitungo.
- source_word: בַּמִּדָּה
  choice: sa pagsukat ng haba
  rationale: Ang מִדָּה ay sukat o pagsukat; ang ‘haba’ ay natural na nagpapakita ng kaibahan nito sa kasunod na timbang at sukat ng kapasidad.
- source_word: בַּמִּשְׁקָל
  choice: timbang
  rationale: Direkta at likas na salin ng timbang o pagtitimbang sa kontekstong pangkalakalan.
- source_word: וּבַמְּשׂוּרָה
  choice: dami
  rationale: Tumutukoy ang מְשׂוּרָה sa sukat ng kapasidad. Ang ‘dami’ ay malinaw sa karaniwang Filipino at hindi ito nililimitahan sa likido lamang.
