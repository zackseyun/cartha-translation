reference: Leviticus 19:20
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: tl
  text: Kung ang isang lalaki ay sumiping sa isang babae at maglabas ng semilya, at ang babae ay isang aliping babae na nakatalaga sa isang lalaki[a], ngunit hindi pa siya natutubos o napagkakalooban ng kalayaan, magkakaroon ng pagsisiyasat[b]. Hindi sila papatayin, sapagkat hindi pa siya napalaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakipagtipan sa isang lalaki” o “ipinangako sa isang lalaki.” Malamang na ipinahihiwatig ng Hebreo na ang aliping babae ay nakatalaga o ipinangako sa isang lalaki, bagaman wala siyang ganap na legal na katayuan ng isang malayang asawa.
    reason: lexical_alternative
  - marker: b
    text: Bihira at hindi tiyak ang salitang Hebreo na isinaling “pagsisiyasat.” Maaari rin itong mangahulugang “kaparusahan” o “kabayaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tumutukoy ito sa isang lalaking tao sa anyong kasong legal; tuwiran at likas sa modernong Tagalog ang “isang lalaki.”
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: sumiping sa isang babae at naglabas ng semilya
  rationale: Pinananatili nito kapwa ang seksuwal na pakikipagtalik na ipinahihiwatig ng “sumiping” at ang espesipikong pagbanggit sa paglabas ng semilya sa Hebreo.
- source_word: שִׁפְחָה
  choice: aliping babae
  rationale: Mahalaga sa batas ang kalagayan niyang hindi malaya, kaya hindi ito pinalambot bilang karaniwang “lingkod.”
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: nakatalaga sa isang lalaki
  rationale: Malabo at bihira ang anyo; ipinahihiwatig nito na siya ay itinalaga o ipinangako sa isang lalaki, ngunit hindi tiyak na kapantay ito ng ganap na katayuan ng isang malayang babaeng nakatakdang pakasalan.
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: hindi pa siya natutubos
  rationale: Pinananatili ng “natutubos” ang legal at ekonomikong diwa ng pagpapalaya sa pamamagitan ng pantubos.
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: hindi pa ... nabibigyan ng kalayaan
  rationale: Natural sa Tagalog at malinaw na tumutukoy sa pormal na paglaya mula sa pagkaalipin.
- source_word: בִּקֹּרֶת
  choice: pagsisiyasat
  rationale: Bihira at pinagtatalunan ang salitang Hebreo. Ang “pagsisiyasat” ay nagpapanatili sa posibleng diwa ng opisyal na pagsusuri nang hindi nagpapasya na tiyak itong kaparusahan o kabayaran.
- source_word: לֹא יוּמְתוּ
  choice: Hindi sila papatayin
  rationale: 'Ipinahahayag nito ang hudisyal na pasibong diwa: hindi sila hahatulan ng kamatayan o ipapapatay.'
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: sapagkat hindi pa siya napalaya
  rationale: Malinaw nitong inuugnay ang pasya sa patuloy na kalagayan ng babae bilang hindi malaya.
theological_decisions:
- issue: Legal na katayuan ng נֶחֱרֶפֶת לְאִישׁ
  choice: nakatalaga sa isang lalaki
  alternative: nakipagtipan sa isang lalaki; ipinangako sa isang lalaki
  rationale: Hindi tiyak kung ang ugnayan ay ganap na pormal na kasunduan sa pag-aasawa. Pinananatili ng “nakatalaga” ang umiiral na pag-aangkin o pangako nang hindi ipinapantay ang babae sa isang malayang babaeng ganap na nakipagtipan.
- issue: Kahulugan ng בִּקֹּרֶת
  choice: magkakaroon ng pagsisiyasat
  alternative: magkakaroon ng kaparusahan; magkakaroon ng kabayaran
  rationale: Dahil bihira at hindi tiyak ang termino, hindi pinipilit ng salin ang isang espesipikong teorya ng parusa; inilalahad sa talababa ang mahahalagang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “aliping babae” upang tahasang mapanatili ang legal na kalagayan niya, at ang “sumiping” upang maging disente ngunit malinaw ang seksuwal na kilos. Inilagay ang mga pananda ng talababa sa mismong mga salitang may tunay na leksikal na kalabuan.
