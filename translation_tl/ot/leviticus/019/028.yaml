base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: tl
  text: Huwag kayong gagawa ng mga hiwa sa inyong laman para sa patay[a], at huwag kayong maglalagay ng tattoo sa inyong katawan[b]. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa isang patay na tao.” Idyomatiko ang pariralang Hebreo at karaniwang tumutukoy sa gawaing pagluluksa para sa namatay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakaukit na marka” o “tattoo.” Bihira ang ekspresyong Hebreo at malamang na tumutukoy sa permanenteng marka sa katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: mga hiwa
  rationale: Tumutukoy ang pangngalan sa hiwa o sugat na sinasadyang gawin sa katawan. Natural sa modernong Tagalog ang “mga hiwa” at hindi nito labis na tinutukoy ang paraan o tindi ng paghiwa.
- source_word: לָנֶפֶשׁ
  choice: para sa patay
  rationale: Sa kontekstong ito ng kaugaliang pagluluksa, ang נֶפֶשׁ na may ל ay tumutukoy sa taong namatay. Pinananatili ng “para sa patay” ang maikli at idyomatikong diwa.
- source_word: בִּבְשַׂרְכֶם
  choice: sa inyong laman
  rationale: Literal na “laman” ang בָּשָׂר. Pinananatili nito ang kongkretong pananalita ng Hebreo at malinaw pa rin sa Tagalog.
- source_word: כְתֹבֶת קַעֲקַע
  choice: tatak na tattoo
  rationale: Bihira ang pariralang Hebreo at malamang na tumutukoy sa isang permanenteng markang inilalagay sa balat. Ang “tatak na tattoo” ay madaling maunawaan habang pinananatili ang ideya ng isang nakaukit o permanenteng marka.
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: huwag kayong maglalagay sa inyong sarili
  rationale: Sa konstruksiyong ito, ipinapahayag ng נתן na may ב ang paglalapat o paglalagay ng marka sa katawan. Direkta at natural ang salin sa Tagalog.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang personal na pangalang יְהוָה bilang “Yahweh,” kaayon ng ibinigay na audited consultation text at ng pormula ng banal na pagpapakilala.
theological_decisions:
- issue: Saklaw ng pagbabawal sa pagmamarka ng katawan
  choice: Isalin nang tuwiran ang pagbabawal sa mga hiwa para sa patay at sa paglalagay ng tatak na tattoo, nang hindi nililimitahan o pinalalawak ang saklaw nito.
  alternative: Ituring na tungkol lamang sa paganong pagluluksa, o gawing tahasang pangkalahatang pagbabawal sa lahat ng modernong tattoo sa bawat kultura.
  rationale: Tahasan lamang na iniuugnay ng Hebreo ang unang pagbabawal sa patay; hindi inuulit ang pariralang iyon sa ikalawa. Kaya hindi dapat lutasin ng salin ang hindi tahasang nilulutas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “laman” upang mapanatili ang kongkretong wika ng Hebreo; ginamit ang “tatak na tattoo” upang maging malinaw sa kasalukuyang mambabasa nang hindi nagdaragdag ng interpretasyong doktrinal.
