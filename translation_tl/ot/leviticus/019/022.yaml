base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: tl
  text: At gagawa ang pari ng pagtubos para sa kanya sa harap ni Yahweh sa pamamagitan ng lalaking tupa bilang handog para sa pagkakasala[a], dahil sa kasalanang nagawa niya; at patatawarin siya sa kasalanang nagawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lalaking tupa bilang handog na pambayad-pinsala.” Ang Hebreong אָשָׁם (asham) ay maaaring tumukoy kapwa sa pagkakasala o pananagutan at sa pagbabayad-pinsalang kaugnay ng handog na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: gagawa ng pagtubos
  rationale: Sa kontekstong saserdotal ng Levitico, ang כפר ay tumutukoy sa ritwal na pagkilos ng pari upang maglaan ng pagtubos para sa isang tao. Ang pariralang ito ay malinaw at likas sa modernong Tagalog habang pinananatili ang teknikal na diwa.
- source_word: עָלָיו
  choice: para sa kanya
  rationale: Kasama ng כפר, ang עַל ay nagsasaad ng taong pinagtutubusan; ang 'para sa kanya' ang likas na katumbas sa Tagalog.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katawagan sa itinalagang tagapangasiwa ng ritwal, at pinananatili ang tiyak na artikulo.
- source_word: בְּאֵיל הָאָשָׁם
  choice: sa pamamagitan ng lalaking tupa bilang handog para sa pagkakasala
  rationale: Tiyak na lalaking tupa ang אַיִל, at instrumental ang בְּ. Ang אָשָׁם ay handog na kaugnay kapwa ng pagkakasala at ng pananagutang magbayad-pinsala; inilalahad sa talababa ang ikalawang aspekto.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang pormal na wikang panritwal at ang tahasang pangalang tipan na יְהוָה.
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dahil sa kasalanang nagawa niya
  rationale: Ipinakikita ng parirala ang kasalanang dahilan o paksa ng pagtubos. Iniiwasan ng 'nagawa niya' ang di-likas na pag-uulit ng magkaugnay na salitang Hebreo.
- source_word: וְנִסְלַח לוֹ
  choice: at patatawarin siya
  rationale: Ang Niphal ng סלח ay pasibo; nananatiling di-binanggit ang gumagawa ng pagpapatawad gaya sa Hebreo.
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: sa kasalanang nagawa niya
  rationale: Sa pormula ng pagpapatawad, likas sa Tagalog ang 'patatawarin siya sa kasalanan' kaysa sa literal ngunit malabong 'mula sa kasalanan.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng kahulugang אָשָׁם
  choice: handog para sa pagkakasala, na may talababa tungkol sa pagbabayad-pinsala
  alternative: handog na pambayad-pinsala
  rationale: Maaaring tumukoy ang אָשָׁם sa pagkakasala/pananagutan at sa reparatibong katangian ng handog. Pinananatili sa pangunahing teksto ang madaling maunawaang katawagan at inilalahad sa talababa ang tunay na leksikal na lawak.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'pari' at 'handog' bilang karaniwang katawagang biblikal. Pinanatili ang pag-uulit ng 'kasalanang nagawa niya' dahil naroon ito sa Hebreo, ngunit inayos ang sintaks upang maging natural sa Tagalog.
