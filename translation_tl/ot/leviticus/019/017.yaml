  source_fidelity: Kailangang panatilihin sa pangunahing teksto ang magkahiwalay na katawagang אָחִיךָ (“iyong kapatid”) at עֲמִיתֶךָ (“iyong kapwa”). Ang paggamit ng “siya” sa draft ay nagpapalabo sa ikalawang terminong ito. Ang “upang hindi” ay nagdaragdag ng relasyong layunin na wala sa payak na pangatnig na וְ; mas maingat ang “at huwag.”
  naturalness: Mas likas ngunit marangal sa modernong Filipino ang “magpasan ng kasalanan” kaysa “magdala ng kasalanan.” Ang “Tiyak na sawayin mo” ay isang katanggap-tanggap na pormal at mariing paglalapat ng inuulit na anyong Hebreo.
  terminology: Ang “kapatid,” “kapwa,” “puso,” at “kasalanan” ay angkop. Ang “hayagang pagharap” sa talababa ay higit na tiyak kaysa sa Hebreo, na nag-uutos ng mariing pagsaway/pagwawasto ngunit hindi tahasang nagsasaad na dapat itong hayagan o pampubliko.
  issues:
