    issue: Ang עֲמִיתֶךָ ay isinalin lamang bilang “siya.”
    rationale: Bagaman maaaring tumukoy sa parehong tao sa daloy ng pangungusap, ang Hebreo ay gumagamit ng ibang katawagan (“iyong kapwa/fellow”), na dapat makita sa salin upang mapanatili ang leksikal at pangkomunidad na diin.
  - severity: medium
    issue: Idinagdag ng “upang hindi” ang relasyong layunin.
    rationale: Ang וְלֹא ay payak na “at huwag”; ang eksaktong ugnayan ng pagsaway at pagdadala ng kasalanan ay bahagi ng idiomatikong kalabuan at hindi dapat lutasin sa pangunahing teksto.
