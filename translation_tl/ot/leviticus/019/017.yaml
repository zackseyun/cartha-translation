revisions:
- from: Huwag mong kapootan sa iyong puso ang iyong kapatid. Dapat mo siyang tahasang sawayin[a] upang hindi ka magdala ng kasalanan dahil sa kanya.[b]
  to: Huwag mong kapootan sa iyong puso ang iyong kapatid. Tiyak na sawayin mo ang iyong kapwa[a], at huwag kang magpasan ng kasalanan dahil sa kanya.[b]
  rationale: Iningatan ng rebisyon ang pagkakaiba ng “kapatid” at “kapwa,” inalis ang idinagdag na ugnayang layunin, at gumamit ng mas natural na “magpasan ng kasalanan.” Binago rin ang talababa upang hindi magdagdag ng hinihinging pagiging hayagan na wala sa Hebreo, habang pinananatili ang semantikong kalabuan ng huling sugnay.
