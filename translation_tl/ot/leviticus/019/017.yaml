base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: tl
  text: Huwag mong kapootan sa iyong puso ang iyong kapatid. Tiyak na sawayin mo ang iyong kapwa[a], at huwag kang magpasan ng kasalanan dahil sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na ituwid.” Ang pag-uulit ng anyong Hebreo ay nagbibigay-diin sa utos na sumaway o magwasto.
    reason: lexical_alternative
  - marker: b
    text: O “huwag kang magkaroon ng pananagutan dahil sa kanya,” o “huwag kang makibahagi sa kanyang kasalanan.” Idiomatiko ang pananalitang Hebreo at maaaring tumukoy sa pagkakaroon ng pagkakasala dahil hindi sinaway o itinuwid ang maling gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: kapootan
  rationale: Tuwirang ipinapahayag ng pandiwang שׂנא ang matinding pagkapoot; pinananatili ng “kapootan” ang bigat ng pagbabawal.
- source_word: אָחִיךָ
  choice: iyong kapatid
  rationale: Maaaring tumukoy ang אָח sa tunay na kapatid o sa kapwa kabilang sa bayang tipan. Pinananatili ng “kapatid” ang pampamilya at pangkomunidad na himig ng Hebreo.
- source_word: בִּלְבָבֶךָ
  choice: sa iyong puso
  rationale: Ang לֵבָב ay tumutukoy sa panloob na pagkatao, kabilang ang isip at layunin. Likas at marangal sa Filipino ang “sa iyong puso” at pinananatili nito ang diin sa lihim na saloobin.
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: dapat mo siyang tahasang sawayin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa utos. Ipinahihiwatig ng “dapat” ang mariing obligasyon, at ng “tahasang sawayin” ang hayagang pagharap sa pagkakamali, hindi lamang banayad na payo.
- source_word: עֲמִיתֶךָ
  choice: siya
  rationale: Ang antecedent ay “iyong kapatid,” at likas sa Filipino na gumamit ng panghalip upang maiwasan ang mabigat na pag-uulit. Ang עָמִית ay tumutukoy sa kapwa kasapi ng pamayanan; nililinaw ito sa talababa.
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: magdala ng kasalanan dahil sa kanya
  rationale: 'Pinananatili nito ang larawang “magdala” ng נָשָׂא at ang sadyang hindi ganap na tiyak na ugnayan ng עָלָיו: maaaring tumukoy sa pagkakaroon ng pananagutan dahil sa kanya o sa pakikibahagi sa kanyang kasalanan.'
theological_decisions:
- issue: Saklaw ng katawagang pampamilya sa etikang pangtipan
  choice: Panatilihin ang “iyong kapatid.”
  alternative: iyong kapwa / kapwa Israelita
  rationale: Ang panlalaking isahang anyo sa Hebreo ay may kinatawang gamit. Ang “kapatid” ang pinakamalapit sa pinagmulan at nagpapanatili sa ugnayang pampamilya at pangtipan nang hindi nililimitahan sa literal na magkapatid.
- issue: Ugnayan ng pagsaway at pagdadala ng kasalanan
  choice: Gamitin ang “upang hindi ka magdala ng kasalanan dahil sa kanya,” na may talababa tungkol sa mga posibleng kahulugan.
  alternative: at huwag kang makibahagi sa kanyang kasalanan / upang hindi ka magkasala dahil sa kanya
  rationale: Maaaring layunin o bunga ang ipinahihiwatig ng וְלֹא sa daloy ng utos, at idiomatiko ang נָשָׂא חֵטְא. Hindi dapat tahasang lutasin sa pangunahing teksto ang tunay na semantikong kalabuan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang isahang “mo/ka” ayon sa Hebreo. Pinanatili ang “puso,” “kapatid,” “sawayin,” at “magdala ng kasalanan” upang mapanatili ang kongkretong wika at moral na bigat ng pinagmulan; ipinaliwanag sa mga talababa ang mga tunay na alternatibong kahulugan.
