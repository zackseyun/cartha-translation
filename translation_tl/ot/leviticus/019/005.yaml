base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: tl
  text: At kapag naghandog kayo kay Yahweh ng handog pangkapayapaan, ihandog ninyo ito upang kayo ay matanggap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “para sa inyong pagtanggap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: At kapag
  rationale: Sa kontekstong legal, ipinapakilala ng כִּי ang isang kasong maaaring mangyari; natural sa modernong Tagalog ang “At kapag” at naiuugnay nito ang utos sa naunang talata.
- source_word: תִזְבְּחוּ ... תִּזְבָּחֻהוּ
  choice: naghandog ... ihandog ninyo iyon
  rationale: Ang זבח ay tumutukoy sa paghahandog sa pamamagitan ng sakripisyo. Ang “handog/ihandog” ay malinaw at natural sa Tagalog, at pinananatili ang pag-uulit ng pandiwa sa Hebreo.
- source_word: זֶבַח שְׁלָמִים
  choice: handog para sa kapayapaan
  rationale: Pinananatili nito ang kaugnayan ng שְׁלָמִים sa kapayapaan nang hindi ipinapasok ang higit na interpretatibong “handog para sa pakikipag-isa.”
- source_word: לַ/יהוָה
  choice: kay Yahweh
  rationale: Ang ל ay nagpapahayag ng pinag-uukulan ng handog, at ang pangalang tipan na יהוה ay isinasalin bilang “Yahweh.”
- source_word: לִ/רְצֹנְ/כֶם
  choice: upang tanggapin kayo
  rationale: Sa konteksto ng mga handog, ang רָצוֹן ay tumutukoy sa pagtanggap o pagiging katanggap-tanggap sa harap ng Diyos; malinaw itong naipapahayag ng layuning pariralang ito.
theological_decisions:
- issue: 'Paglalapat ng לִרְצֹנְכֶם: ang mga sumasamba ba o ang handog ang tinatanggap?'
  choice: upang tanggapin kayo
  alternative: upang maging katanggap-tanggap iyon alang-alang sa inyo / para sa inyong pagtanggap
  rationale: Ang hulaping pangmaramihan na “-כם” ay tumutukoy sa mga naghahandog, at sa kontekstong pangsakripisyo ang parirala ay karaniwang tumutukoy sa pagtanggap sa kanila. Gayunman, maaaring ipahayag nang mas literal ang ugnayan bilang “para sa inyong pagtanggap,” kaya itinala ang alternatibo.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang “kayo/ninyo” ayon sa mga pandiwang Hebreong nasa ikalawang panauhang maramihan. Ang “handog para sa kapayapaan” ay bahagyang pormal ngunit malinaw bilang katawagan sa uri ng handog.
