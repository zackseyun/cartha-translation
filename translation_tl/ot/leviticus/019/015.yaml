base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: tl
  text: “Huwag kayong gagawa ng kawalang-katarungan sa paghatol. Huwag ninyong papanigan ang mahirap ni pagkikilingan ang taong mataas ang katayuan. Hatulan ninyo nang matuwid[a] ang inyong kapwa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang makatarungan.”
    reason: lexical_alternative
  - marker: b
    text: Ang mga idyomang Hebreo ay literal na “iangat ang mukha ng mahirap” at “parangalan ang mukha ng dakila.” Sa kontekstong ito, kapwa tumutukoy ang mga iyon sa pagkiling sa paghatol batay sa kalagayan ng isang tao.
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: kawalang-katarungan sa paghatol
  rationale: Ipinahahayag nito ang di-makatarungang pagkilos sa konteksto ng paglalapat o paggagawad ng hatol.
- source_word: תִשָּׂא פְנֵי דָל
  choice: papanigan ang mahirap
  rationale: Ang idyomang Hebreo na literal na ‘iaangat ang mukha’ ay tumutukoy rito sa pagkiling o pagbibigay ng di-makatarungang pabor.
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: kikilingan ang makapangyarihan
  rationale: Natural na ipinahahayag sa Filipino ang paggalang o pagpapailalim na humahantong sa pagtatangi sa taong mataas ang katayuan; hindi nililimitahan ang גָדוֹל sa pagiging mayaman lamang.
- source_word: בְּצֶדֶק
  choice: nang matuwid
  rationale: Pinananatili nito ang moral at hudisyal na saklaw ng צֶדֶק; ang ‘nang makatarungan’ ay lehitimong alternatibo.
- source_word: עֲמִיתֶךָ
  choice: iyong kapwa
  rationale: Tumutukoy ito sa kapwa kasapi ng pamayanan; ang ‘kapwa’ ay natural at angkop sa mas malawak na konteksto ng Levitico 19.
theological_decisions:
- issue: Saklaw ng צֶדֶק sa kontekstong legal at etikal
  choice: nang matuwid
  alternative: nang makatarungan
  rationale: Maaaring tumukoy ang salita kapwa sa moral na katuwiran at sa katarungan sa paghatol. Pinanatili sa pangunahing teksto ang mas malawak na ‘matuwid,’ habang inilagay sa talababa ang malinaw na legal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang ‘kayo’ sa pangkalahatang pagbabawal at ang isahang ‘mo’ sa mga kasunod na pandiwang Hebreo, kaya pinananatili ang pagbabago ng bilang na nasa pinagmulang teksto.
