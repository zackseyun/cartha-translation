base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: tl
  text: Huwag kang maghiganti o magkimkim ng sama ng loob laban sa mga kababayan mo[a], ngunit mahalin mo ang iyong kapwa gaya ng iyong sarili. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga anak na lalaki ng iyong bayan”; maaari ring isalin na “mga kabilang sa sarili mong bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: maghiganti
  rationale: Tuwirang ipinahahayag ng pandiwang נקם ang pagganti; natural at malinaw sa modernong Filipino ang “maghiganti.”
- source_word: תִטֹּר
  choice: magkimkim ng sama ng loob
  rationale: Ipinahihiwatig ng נטר ang patuloy na pag-iingat ng galit o hinanakit; nahuhuli ng pariralang ito ang pangmatagalang diwa.
- source_word: בְּנֵי עַמֶּךָ
  choice: mga kababayan mo[a]
  rationale: Literal itong “mga anak na lalaki ng iyong bayan,” ngunit sa konteksto ay tumutukoy sa mga kapwa kabilang sa bayan. Ang “mga kababayan mo” ay natural at hindi nagpapahiwatig na mga lalaki lamang ang saklaw; pinananatili sa talababa ang literal na anyo.
- source_word: וְאָהַבְתָּ
  choice: ibigin mo
  rationale: May puwersa itong pautos sa kontekstong legal. Dignified at malinaw ang “ibigin mo” bilang positibong utos.
- source_word: לְרֵעֲךָ
  choice: ang iyong kapwa
  rationale: Maaaring mangahulugang kasama, kaibigan, o kapwa ang רֵעַ. Ang “kapwa” ang pinakanatural at kinikilalang katumbas sa kontekstong etikal na ito.
- source_word: כָּמוֹךָ
  choice: gaya ng iyong sarili
  rationale: Pinananatili nito ang paghahambing sa Hebreo nang natural sa Filipino, nang hindi nilulutas ang posibleng sintaktikong lalim nang lampas sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh sa halip na palitan ng titulong “PANGINOON,” ayon sa anyo ng tekstong Hebreo.
theological_decisions:
- issue: Saklaw ng mga taong tinutukoy ng utos
  choice: Panatilihin ang agarang pagtukoy sa sariling bayan sa “mga kababayan mo,” at isalin ang רֵעַ bilang “kapwa.”
  alternative: Gawing tahasang pansansinukob ang dalawang parirala, o limitahan ang “kapwa” sa mga Israelita lamang.
  rationale: Magkaiba ang mga pariralang בְּנֵי עַמֶּךָ at רֵעֲךָ sa talata. Pinananatili ng salin ang pagkakaibang iyon nang hindi ipinapasok sa teksto ang mas malawak o mas makitid na pagpapakahulugan.
- issue: Pagbigkas sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ang Hebreo ay may personal na pangalang יהוה; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong legal-etikal. Ginamit ang “Huwag kang…” para sa mga pagbabawal at “ibigin mo” para sa positibong utos. Ang “Sa halip” ay likas na naghuhudyat ng pagsalungat na ipinapakita ng Hebreong waw nang hindi dinaragdagan ang diwa.
