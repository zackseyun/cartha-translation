  terminology: Ang “maghiganti,” “magkimkim ng sama ng loob,” “mga kababayan,” “kapwa,” at “Yahweh” ay angkop na mga katumbas. Ang “mga kababayan” ay wastong idiomatikong salin ng parirala sa konteksto, at ang literal na “mga anak na lalaki” ay maayos na inilagay sa talababa.
