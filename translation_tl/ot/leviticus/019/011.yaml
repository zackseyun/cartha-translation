base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: tl
  text: Huwag kayong magnakaw, huwag kayong manlinlang, at huwag kayong magsinungaling sa isa’t isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “bawat tao sa kaniyang kapuwa” o “ang isang tao sa kaniyang kasamahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: Huwag kayong magnakaw
  rationale: Ang Qal imperfect na ikalawang panauhang maramihan kasunod ng לֹא ay tuwirang pagbabawal. Ang “magnakaw” ang natural at eksaktong katumbas ng גנב.
- source_word: תְכַחֲשׁוּ
  choice: huwag kayong mandaya
  rationale: Ang Piel ng כחש ay maaaring tumukoy sa mapanlinlang na pakikitungo o maling pagkakaila. Pinananatili ng “mandaya” ang malawak na diwa ng di-tapat na pakikitungo at naihihiwalay ito sa kasunod na tahasang pagbabawal sa pagsisinungaling.
- source_word: תְשַׁקְּרוּ
  choice: huwag kayong magsinungaling
  rationale: Karaniwang ipinahihiwatig ng Piel ng שקר ang pagsisinungaling o pagkilos nang may kabulaanan. Ang “magsinungaling” ang pinakanatural na salin sa kontekstong interpersonal.
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: sa isa't isa
  rationale: Bagaman literal na “ang isang tao sa/k laban sa kaniyang kapuwa,” distributibo at resiprokal ang parirala rito. Natural na ipinahahayag ng “sa isa't isa” ang saklaw nito nang hindi nililimitahan sa kalalakihan.
- source_word: עֲמִית
  choice: isa't isa
  rationale: Ang עֲמִית ay kapuwa o kasamahan sa pamayanan. Sa buong idyomang אִישׁ בַּעֲמִיתוֹ, malinaw at likas sa modernong Filipino ang resiprokal na “isa't isa.”
theological_decisions:
- issue: Ang panlalaking distributibong pahayag na אִישׁ ... עֲמִיתוֹ
  choice: Isinalin nang inklusibo bilang “sa isa't isa”
  alternative: “ang bawat lalaki sa kaniyang kapuwa” o “ang isang tao laban sa kaniyang kapuwa”
  rationale: Ang panlalaking anyo sa Hebreo ay generiko at kumakatawan sa lahat, hindi isang pagbabawal na para lamang sa mga lalaki. Pinananatili ng inklusibong Filipino ang layon at saklaw ng pinagmulan.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Ginamit ang magkakatulad na anyong “Huwag kayong…” upang mapanatili ang tatlong magkakaugnay na pagbabawal at ang maramihang kausap sa Hebreo.
