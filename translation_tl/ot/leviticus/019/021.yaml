base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: tl
  text: At dadalhin niya kay Yahweh ang handog niya para sa pagkakasala[a], sa pasukan ng tolda ng tagpuan—isang lalaking tupa bilang handog para sa pagkakasala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pambayad-pinsala.” Ang salitang Hebreo na אָשָׁם ay maaaring tumukoy kapuwa sa pagkakasala o pananagutan at sa handog na inihahandog bilang kabayaran para rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: At dadalhin niya
  rationale: Ang Hiphil perfect na may prefixed conjunction sa kontekstong legal ay may preskriptibong puwersa; likas sa modernong Tagalog ang anyong panghinaharap upang ipahayag ang iniutos na gagawin.
- source_word: אֲשָׁמוֹ
  choice: ang handog niya para sa pagkakasala
  rationale: Sa kontekstong pansakripisyo, ang אָשָׁם ay tumutukoy sa handog na kaugnay ng pagkakasala at pagbabayad-pinsala. Pinananatili ng parirala ang pangunahing ideya nang hindi nililimitahan ang saklaw ng terminong Hebreo.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng ל ang patutunguhan o pinag-uukulan ng handog; ang personal na pang-ukol na 'kay' ay natural sa Tagalog, at tuwirang inililipat ang banal na pangalang יהוה bilang Yahweh.
- source_word: אֶל פֶּתַח
  choice: sa pasukan
  rationale: Ang פֶּתַח ay pasukan o bukana; malinaw at likas sa kasalukuyang Tagalog ang 'pasukan' sa konteksto ng santuwaryo.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa itinakdang pakikipagtagpo. Ang 'toldang tipanan' ay maikli, dignipikado, at kinikilalang katawagan sa santuwaryong lugar ng pakikipagtagpo.
- source_word: אֵיל
  choice: isang lalaking tupa
  rationale: Partikular na tumutukoy ang אֵיל sa adultong lalaking tupa; mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal o di-gaanong pangkaraniwang katawagan.
- source_word: אָשָׁם
  choice: bilang handog para sa pagkakasala
  rationale: Ang huling parirala ay appositional at tumutukoy sa pansakripisyong gamit ng lalaking tupa. Ang 'bilang' ay malinaw na nagpapakita ng tungkulin nito bilang handog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng terminong אָשָׁם
  choice: handog para sa pagkakasala, na may talababa tungkol sa pagbabayad-pinsala
  alternative: handog na pambayad-pinsala
  rationale: Maaaring tukuyin ng אָשָׁם kapuwa ang pagkakasala/pananagutan at ang handog na nagsisilbing reparasyon. Pinananatili sa pangunahing teksto ang pamilyar na kategoryang pansakripisyo at inilalahad sa talababa ang tunay na leksikal na lapad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignipikado, at angkop sa tekstong legal-pansamba. Ginamit ang 'dadalhin niya' sa halip na mas mabigat na legalismong 'nararapat niyang dalhin.'
