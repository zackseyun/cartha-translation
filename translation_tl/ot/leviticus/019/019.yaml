base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: tl
  text: Sundin ninyo ang aking mga tuntunin. Huwag ninyong pagparisin ang inyong mga alagang hayop na magkaiba ang uri. Huwag ninyong hasikan ang inyong bukid ng magkaibang uri ng binhi. At huwag kayong magsuot ng damit na magkahalong uri ng hibla, sha'atnez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong sha'atnez ay isang teknikal na termino para sa ipinagbabawal na telang binubuo ng magkahalong hibla. Ayon sa tradisyonal na pagkaunawa, lana at lino ang mga ito; ihambing sa Deuteronomio 22:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang חֻקָּה ay tumutukoy sa mga itinakdang batas o kautusan. Ang “mga tuntunin” ay likas at malinaw sa makabagong Filipino at nananatili ang legal na diwa.
- source_word: תִּשְׁמֹרוּ
  choice: Sundin ninyo
  rationale: Sa kontekstong tipan at batas, ang שׁמר ay nangangahulugang ingatan o sundin. Mas natural sa Filipino ang “sundin” kapag mga tuntunin ang layon.
- source_word: בְּהֶמְתְּךָ
  choice: inyong mga alagang hayop
  rationale: Malawak ang בְּהֵמָה at tumutukoy rito sa mga domestikadong hayop, hindi lamang baka.
- source_word: תַרְבִּיעַ
  choice: palahian
  rationale: Ang Hiphil ng רבע ay pagpaparis o pagpapalahi ng mga hayop. Tiyak at natural ang “palahian” sa kontekstong panghayupan.
- source_word: כִּלְאַיִם
  choice: sa ibang uri / dalawang magkaibang uri / magkahalong materyal
  rationale: Ang כִּלְאַיִם ay tumutukoy sa paghahalo ng magkakaibang uri. Inangkop ang anyo sa hayop, binhi, at tela upang maging malinaw sa Filipino habang pinananatili ang inuulit na konsepto.
- source_word: שָׂדְךָ
  choice: inyong bukid
  rationale: Tuwirang salin ng pangngalang pang-agrikultura at ng ikalawang panauhang pangmaramihang gamit sa Filipino.
- source_word: תִזְרַע
  choice: hasikan
  rationale: Ang זרע ay partikular na tumutukoy sa paghahasik ng binhi; natural ang “hasikan ang bukid” sa Filipino.
- source_word: בֶגֶד
  choice: damit
  rationale: Karaniwang pangkalahatang salita ang בֶּגֶד para sa kasuotan. Ang “damit” ay natural at madaling maunawaan.
- source_word: שַׁעַטְנֵז
  choice: sha'atnez
  rationale: Bihira at teknikal ang terminong Hebreo. Pinanatili ang transliterasyon at ipinaliwanag sa talababa ang tradisyonal na pagkaunawa rito.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: huwag kayong magsuot
  rationale: Literal itong “huwag umakyat/mapasaibabaw ninyo,” isang idyoma para sa pagsusuot. Ang “huwag kayong magsuot” ang malinaw at natural na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang pangmaramihang “ninyo/kayo” dahil ang pambungad na pandiwa ay pangmaramihan, bagaman ang mga kasunod na anyong Hebreo ay pang-isahan na tumutukoy sa bawat kasapi ng Israel. Isinalin ang idyomatikong יַעֲלֶה עָלֶיךָ ayon sa kahulugan nitong pagsusuot, sa halip na gayahin ang di-likas na literal na anyo.
