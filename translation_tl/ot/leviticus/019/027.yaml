  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: tl
  text: Huwag ninyong gupitin nang pabilog ang buhok sa mga gilid ng inyong ulo[a][b]; at huwag mong sirain ang gilid ng iyong balbas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga sulok ng buhok sa inyong ulo.” Ang salitang Hebreo ay maaaring mangahulugang “gilid,” “dulo,” o “sulok.”
    reason: lexical_alternative
  - marker: b
    text: Malamang na tumutukoy ito sa pag-ahit o paggupit nang pabilog sa buhok sa mga gilid ng ulo.
    reason: cultural_note
  - marker: c
    text: Maaari ring “pinsalain,” “wasakin,” o “papangitin ang gilid ng iyong balbas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: gupitin nang pabilog
  rationale: Ang Hiphil ng נקף dito ay tumutukoy sa paggupit paikot o sa paraang nagpapabilog sa hangganan ng buhok. Konkretong inilalarawan ng parirala ang kilos nang hindi ipinapalagay na ahit ang tiyak na paraan.
- source_word: פְּאַת
  choice: mga gilid
  rationale: Ang פֵּאָה ay maaaring mangahulugang gilid, dulo, o sulok. Ang “mga gilid” ay natural sa modernong Filipino at angkop kapuwa sa buhok sa ulo at sa balbas, habang pinananatili sa talababa ang alternatibong “mga sulok.”
- source_word: רֹאשְׁכֶם
  choice: inyong ulo
  rationale: Bagaman maramihan ang anyong Hebreo, ang distributibong “inyong ulo” ay mas natural sa Filipino kapag ang bawat kausap ay may sariling ulo.
- source_word: תַשְׁחִית
  choice: sirain
  rationale: Karaniwang nangangahulugan ang Hiphil ng שׁחת na sirain, pinsalain, o wasakin. Pinananatili ng “sirain” ang lakas at lawak ng salita nang hindi tinutukoy ang eksaktong paraan ng paggupit.
- source_word: זְקָנֶךָ
  choice: iyong balbas
  rationale: Tuwirang salin ng זָקָן; pinananatili rin ang isahang panandang paari ng ikalawang sugnay.
- source_word: לֹא ... וְלֹא
  choice: Huwag ninyong ... at huwag mong ...
  rationale: Natural na anyo ito ng mariing pagbabawal sa Filipino. Pinananatili ang paglipat ng Hebreo mula sa maramihang kausap sa unang sugnay tungo sa isahang kausap sa ikalawa.
theological_decisions:
- issue: Saklaw at dahilan ng pagbabawal
  choice: Isang kongkretong pagbabawal sa tiyak na pag-aayos o paggupit ng buhok at balbas, nang hindi inilalagay sa pangunahing teksto ang isang di-binanggit na dahilan.
  alternative: Partikular na pagbabawal sa paganong ritwal ng pagluluksa, o pangkalahatang pagbabawal sa mga istilong kaugnay ng mga bansang nakapaligid sa Israel.
  rationale: Binabanggit ng talata ang ipinagbabawal na mga kilos ngunit hindi nito tahasang sinasabi ang dahilan. Kaya hindi dapat idagdag sa salin ang isang tiyak na ritwal o motibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong legal na “Huwag…” sa halip na isang artipisyal na literalismo. Sadyang pinanatili ang paglipat mula maramihan tungo sa isahan sa mga panghalip, gaya ng tekstong Hebreo.
