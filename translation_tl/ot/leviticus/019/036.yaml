  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: tl
  text: Dapat kayong magkaroon ng tapat na timbangan[a], tapat na mga panimbang, tapat na efa[b], at tapat na hin[c]. Ako si Yahweh, ang inyong Diyos, na naglabas sa inyo mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wastong timbangan, wastong mga panimbang.” Ang salitang Hebreo na צֶדֶק, na madalas mangahulugang “katuwiran” o “katarungan,” ay inuulit para sa lahat ng kagamitan at takalan sa talatang ito.
    reason: lexical_alternative
  - marker: b
    text: Ang efa ay isang sinaunang takalan ng tuyong sangkap.
    reason: cultural_note
  - marker: c
    text: Ang hin ay isang sinaunang takalan ng likido.
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: tapat na timbangan
  rationale: Ang מֹאזְנַיִם ay timbangan sa pangangalakal, at ang צֶדֶק ay tumutukoy rito sa pagiging matuwid at hindi mapanlinlang. Likas sa modernong Tagalog ang “tapat na timbangan” at napapanatili nito ang etikal na diin.
- source_word: אַבְנֵי צֶדֶק
  choice: tapat na mga panimbang
  rationale: Literal na “mga bato” ang אַבְנֵי, ngunit mga batong ginagamit bilang pamantayang panimbang ang tinutukoy. Isinalin ang gamit nito upang maging malinaw sa karaniwang mambabasa.
- source_word: אֵיפַת צֶדֶק
  choice: tapat na efa
  rationale: Ang אֵיפָה ay isang sinaunang takalan ng tuyong sangkap. Pinanatili ang pangalang “efa” upang hindi magbigay ng di-tiyak na modernong katumbas, habang inuulit ang “tapat” gaya ng pag-uulit ng צֶדֶק.
- source_word: וְהִין צֶדֶק
  choice: at tapat na hin
  rationale: Ang הִין ay isang sinaunang takalan ng likido. Pinanatili ang katawagang “hin” at ang magkakatulad na pagkakabuo ng apat na parirala.
- source_word: יִהְיֶה לָכֶם
  choice: Dapat kayong magkaroon
  rationale: Literal itong “magiging para sa inyo.” Ang “Dapat kayong magkaroon” ay malinaw na nagpapahayag ng obligasyon sa konteksto ng kautusan at likas sa modernong Tagalog.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh na inyong Diyos
  rationale: Pinanatili ang personal na pangalang Yahweh at isinalin ang pormulang tipan bilang “inyong Diyos.”
- source_word: אֲשֶׁר הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: na naglabas sa inyo mula sa lupain ng Ehipto
  rationale: Tuwirang pinananatili nito ang karaniwang pormula tungkol sa paglabas mula sa Ehipto at ang batayan ng kautusan sa ginawa ni Yahweh.
theological_decisions:
- issue: Ang paulit-ulit na צֶדֶק sa konteksto ng pangangalakal
  choice: tapat
  alternative: wasto; makatarungan; matuwid
  rationale: Bagaman malawak ang kahulugan ng צֶדֶק at maaari itong mangahulugang katuwiran o katarungan, inilalapat ito rito sa mga kagamitan at takalan sa pangangalakal. Ang “tapat” ay nagpapanatili sa etikal na utos laban sa pandaraya, hindi lamang sa teknikal na kawastuhan, habang ang talababa ay nagsasaad ng ibang posibleng pagpapahayag.
- issue: Paglalahad ng mga sinaunang yunit
  choice: panatilihin ang “efa” at “hin”
  alternative: takalan ng tuyong sangkap; takalan ng likido; tantiyang modernong katumbas
  rationale: Walang eksaktong modernong katumbas na kailangang ipalit sa teksto. Ang transliterasyon at maiikling talang pangkultura ay kapuwa tumpak at malinaw.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “dapat” upang maipakita ang puwersa ng legal na tagubilin; pinanatili ang pag-uulit para matularan ang diin at ritmo ng Hebreo. Hindi naglagay ng tantiyang sukat para sa efa at hin upang maiwasan ang maling katiyakan.
