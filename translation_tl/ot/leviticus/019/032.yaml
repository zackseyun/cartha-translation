  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: tl
  text: Tumayo ka sa presensiya ng taong may uban[a], igalang mo ang matandang lalaki[b], at matakot ka sa iyong Diyos; ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng uban.” Gumagamit ang Hebreo ng kongkretong larawan ng uban upang tukuyin ang katandaan o ang taong matanda.
    reason: lexical_alternative
  - marker: b
    text: 'Literal sa Hebreo: “igalang mo ang mukha ng matandang lalaki.” Ang “mukha” ay isang idyomang tumutukoy sa taong kaharap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: sa harap ng may uban
  rationale: Pinananatili ang kongkretong larawan ng uban bilang metonimiya para sa taong matanda, habang natural na ipinapahayag ang pagbangon sa presensiya niya.
- source_word: תָּקוּם
  choice: Tumayo ka
  rationale: Ang Qal imperfect ay gumaganap bilang utos; ang “tumayo” ay malinaw na kilos ng paggalang sa modernong Filipino.
- source_word: וְהָדַרְתָּ
  choice: igalang mo
  rationale: Tumpak at natural na katumbas ng Piel na nangangahulugang magbigay-galang o magpakita ng pagpipitagan.
- source_word: פְּנֵי זָקֵן
  choice: ang mukha ng matandang lalaki
  rationale: Pinananatili ang literal na “mukha” at ang panlalaking anyong isahan ng זָקֵן, pati ang pagkakatugma nito sa unang sugnay.
- source_word: וְיָרֵאתָ
  choice: matakot ka
  rationale: Pinananatili ang lakas at teolohikal na tensiyon ng ירא, na sumasaklaw sa takot na may pagpipitagan at pagkamangha.
- source_word: מֵאֱלֹהֶיךָ
  choice: sa iyong Diyos
  rationale: Pinananatili ang tuwirang pangalawang panauhang isahan at ang personal na ugnayang tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Panlalaking anyo ng זָקֵן
  choice: matandang lalaki
  alternative: matanda; nakatatanda
  rationale: Ang Hebreo ay panlalaking isahan. Pinananatili ito sa pangunahing teksto nang hindi ipinahihiwatig na walang kaugnayan ang utos sa matatandang babae.
- issue: Kahulugan ng pagkatakot sa Diyos
  choice: matakot ka sa iyong Diyos
  alternative: magpitagan ka sa iyong Diyos
  rationale: Ang “matakot” ay hindi nagpapalabnaw sa malakas na pananalita ng orihinal at pinananatili ang saklaw nitong takot, pagkamangha, at pagpipitagan.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang kinakatawan ang Tetragrammaton bilang personal na pangalan ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pang-isahang “ka/mo/iyong” upang mapanatili ang personal na pagtukoy ng Hebreo. Ang literal na “mukha” ay sadyang pinanatili at ipinaliwanag sa talababa.
