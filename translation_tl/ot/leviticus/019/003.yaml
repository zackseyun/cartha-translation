base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: tl
  text: Matakot ang bawat lalaki[a] sa kanyang ina at sa kanyang ama, at ipangilin ninyo ang aking mga Sabbath. Ako si Yahweh, na inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat tao.” Panlalaking isahan ang anyo sa Hebreo, ngunit ginagamit ito rito bilang pamahaging pagtukoy sa mga kasapi ng pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: Ginagamit ang panlalaking pangngalang isahan bilang pamahaging pagtukoy sa bawat kasapi ng buong pamayanan. Pinananatili ng “bawat lalaki” ang anyong panlalaki ng Hebreo; inilalagay sa talababa ang mas malawak na diwang “bawat tao.”
- source_word: אִמּוֹ וְאָבִיו
  choice: sa kanyang ina at sa kanyang ama
  rationale: Tahasan at magkahiwalay na binabanggit sa Hebreo ang ina bago ang ama. Pinananatili ang dalawang katawagan, ang mga panghalip na paari, at ang di-karaniwang pagkakasunod ng mga ito.
- source_word: תִּירָאוּ
  choice: dapat matakot
  rationale: Saklaw ng pandiwang ירא ang takot, pagpipitagan, at paggalang. Ang “matakot” ang tuwirang katumbas at nagpapanatili sa lakas at posibleng tensiyon ng salita; nililinaw sa talababa ang kahulugang may pagpipitagan.
- source_word: שַׁבְּתֹתַי
  choice: aking mga Sabbath
  rationale: Pinananatili ang tahasang anyong maramihan at ang banal na pagmamay-ari sa Hebreo.
- source_word: תִּשְׁמֹרוּ
  choice: dapat ninyong ipangilin
  rationale: Sa kaugnayan ng mga Sabbath, natural na ipinahahayag ng “ipangilin” ang maingat na pagtupad at pag-iingat sa banal na araw na saklaw ng שׁמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, tumutukoy ito rito sa iisang Diyos ng Israel at bahagi ng pormulang tipan kasama ng Yahweh.
theological_decisions:
- issue: Lakas ng utos tungkol sa pakikitungo sa mga magulang
  choice: matakot sa kanyang ina at sa kanyang ama
  alternative: magpitagan sa kanyang ina at sa kanyang ama
  rationale: Hindi nilulutas nang tahimik ang saklaw ng ירא. Pinananatili sa pangunahing teksto ang mas tuwirang “matakot,” habang kinikilala sa talababa na maaari itong mangahulugan ng takot na may paggalang at pagpipitagan.
- issue: Kasariang ipinahihiwatig ng pambungad na pamahaging isahan
  choice: bawat lalaki
  alternative: bawat tao
  rationale: Pinananatili ang panlalaking isahang anyo ng אִישׁ, ngunit itinatala na pamahagi ang gamit nito at nakatuon ang utos sa pamayanan.
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa pinagmulan; kaya transliterasyon ang ginamit sa halip na ang pamalit na titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pagkakauna ng ina sa ama, ang paglipat mula sa pamahaging isahan tungo sa maramihang pakikipag-usap, at ang maramihang “mga Sabbath.”
