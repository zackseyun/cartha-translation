  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: tl
  text: Kaya’t sundin ninyo ang lahat ng aking mga tuntunin at ang lahat ng aking mga hatol[a], at isagawa ninyo ang mga ito. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “aking mga tuntunin” bilang “aking mga itinakdang kautusan,” at ang “aking mga hatol” bilang “aking mga pasiya” o “aking mga ordinansa.” Dalawang magkaibang terminong legal ang ginamit sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kaya sundin ninyo
  rationale: Sa kontekstong legal at tipan, ang שׁמר ay nangangahulugang sundin o tuparin. Ang “Kaya” ay nagpapakita ng pangwakas at panlahatang bisa ng talata sa dulo ng kabanata.
- source_word: כָּל
  choice: lahat
  rationale: Pinananatili ang ganap na saklaw ng dalawang paglitaw ng כָּל.
- source_word: חֻקֹּתַי
  choice: aking mga tuntunin
  rationale: Ang חֻקִּים ay mga itinakdang kautusan o alituntunin. Natural sa modernong Filipino ang “mga tuntunin” at naihihiwalay ito sa kasunod na terminong legal.
- source_word: מִשְׁפָּטַי
  choice: aking mga batas
  rationale: Ang מִשְׁפָּטִים ay maaaring tumukoy sa mga hatol, pasiya, o legal na ordinansa. Ang “mga batas” ay malinaw sa karaniwang mambabasa habang pinananatiling naiiba sa “mga tuntunin.”
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: at isagawa ninyo ang mga iyon
  rationale: Ang עשה kapag ang layon ay mga kautusan ay nangangahulugang gawin, tuparin, o isagawa. Ang “isagawa” ay natural at malinaw na tumutukoy sa aktuwal na pagsunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos.
- issue: Pagpapanatili sa dalawang magkaibang terminong legal
  choice: mga tuntunin ... mga batas
  alternative: mga utos ... mga hatol
  rationale: Magkaiba ang חֻקִּים at מִשְׁפָּטִים. Gumagamit ang salin ng dalawang magkaibang karaniwang salita at inilalahad sa talababa ang iba pang posibleng kahulugan nang hindi ipinagpapalit ang mga ito.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa ng Kasulatan. Ginamit ang “ninyo” dahil maramihan ang mga pandiwa sa Hebreo. Pinanatili ang maikli at mariing pangwakas na pahayag na “Ako si Yahweh.”
