  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: tl
  text: Ang dayuhang naninirahan[a] sa piling ninyo ay ituring ninyong gaya ng isang katutubong kabilang sa inyo. Mahalin mo siya gaya ng iyong sarili, sapagkat naging mga dayuhang naninirahan kayo sa lupain ng Ehipto. Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dayuhan,” “banyaga,” o “nakikipamayan.” Ang Hebreong salita ay tumutukoy sa isang hindi katutubong naninirahan sa gitna ng Israel, hindi lamang sa isang pansamantalang bisita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: tulad ng katutubong kababayan ninyo
  rationale: Ang אֶזְרָח ay katutubong naninirahan o likas na kabilang sa pamayanan. Nililinaw ng “kababayan” na ang paghahambing ay tungkol sa pagkilala at pagtrato sa loob ng pamayanan, hindi lamang sa lugar ng kapanganakan.
- source_word: הַגֵּר הַגָּר אִתְּכֶם
  choice: ang dayuhang naninirahang kasama ninyo
  rationale: Ang גֵּר ay isang hindi katutubong naninirahan sa gitna ng Israel, hindi basta panandaliang bisita. Ang magkaugnay na “dayuhan” at “naninirahan” ay natural sa Filipino at bahagyang pinananatili ang pag-uulit sa Hebreo.
- source_word: יִהְיֶה לָכֶם
  choice: ay ituring ninyong
  rationale: Ipinahahayag ng konstruksiyon kung paano dapat kilalanin at pakitunguhan ng Israel ang naninirahang dayuhan. Ang “ituring” ay likas at malinaw na naghahatid ng obligasyong legal.
- source_word: וְאָהַבְתָּ לוֹ
  choice: Ibigin mo siya
  rationale: Pinananatili ang utos at ang isahang kausap sa Hebreo. Dignified at pamilyar sa wikang biblikal ang “ibigin,” ngunit nauunawaan pa rin sa modernong Filipino.
- source_word: כָּמוֹךָ
  choice: gaya ng iyong sarili
  rationale: Maikli at idiomatiko ito at pinananatili ang ugnayang pampanitikan sa Levitico 19:18.
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: sapagkat naging mga dayuhang naninirahan din kayo
  rationale: Inuulit ang parehong kategoryang panlipunan upang idiin na ang karanasan ng Israel sa Ehipto ang batayan ng utos. Ang “din” ay likas na nagpapakita ng pagkakatulad na ipinahihiwatig ng konteksto.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang buong karaniwang pariralang biblikal at ang himig nitong pangkasaysayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Natural na salin ng pormulang tipan na kasama ng pangalang Yahweh.
theological_decisions:
- issue: Pagpapakahulugan sa גֵּר sa kontekstong legal at etikal
  choice: dayuhang naninirahan
  alternative: dayuhan; banyaga; nakikipamayan
  rationale: Tumutukoy ito sa isang hindi katutubo na naninirahan sa gitna ng Israel at sakop ng mga proteksiyon ng pamayanan. Iniiwasan ng salin ang impresyon na isa lamang siyang bisita at hindi rin nag-aangkat ng makabagong teknikal na kategorya sa imigrasyon.
- issue: Panghalip sa utos na umibig
  choice: Ibigin mo siya
  alternative: Ibigin ninyo siya
  rationale: Isahan ang anyo ng pandiwa at panghalip sa Hebreo, bagaman ang pamayanan bilang kabuuan ang kinakausap. Pinananatili ang biglang paglipat mula maramihan tungong isahan sa halip na pakinisin ito.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan at hindi pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “dayuhang naninirahan” sa halip na mas teknikal o lumang mga katawagan. Sadyang pinanatili ang paglipat ng Hebreo mula sa maramihang “ninyo” tungo sa isahang “mo,” gayundin ang pangalang Yahweh.
