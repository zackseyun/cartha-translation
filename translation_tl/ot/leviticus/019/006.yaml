base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/006.yaml
  text: It shall be eaten on the day of your sacrifice and on the next day[a], but what remains until the third day shall be burned in the fire.
translation:
  language: tl
  text: Kakainin iyon sa araw ng inyong paghahandog at sa susunod na araw; ngunit ang matitira[a] hanggang sa ikatlong araw ay susunugin sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang natira”; ang Hebreong participle ay tumutukoy sa bahaging naiwan matapos ang panahong ipinahintulot para kainin ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: sa araw
  rationale: Ang בְּ ay panandang temporal dito; natural itong isalin na “sa araw” sa Filipino.
- source_word: זִבְחֲכֶם
  choice: ng inyong paghahandog
  rationale: Ang זֶבַח ay tumutukoy sa handog na inihahain sa pamamagitan ng pagkatay. Ang “paghahandog” ay malinaw sa kontekstong panritwal nang hindi labis na nagdaragdag ng detalye.
- source_word: יֵאָכֵל
  choice: kakainin iyon
  rationale: Ang Niphal imperfect ay pasibo at, sa kontekstong legal, nagpapahayag ng tuntunin. Idinagdag ang “iyon” bilang likas na pantukoy sa handog na binabanggit sa konteksto.
- source_word: וּמִמָּחֳרָת
  choice: at sa susunod na araw
  rationale: Ang מָחֳרָת ay “susunod na araw.” Bagaman may pang-ukol na literal na maaaring mangahulugang “mula,” ang temporal na pagkakasunod dito ay likas na ipinahahayag sa Filipino bilang “sa susunod na araw.”
- source_word: וְהַנּוֹתָר
  choice: ngunit ang matitira
  rationale: Ang participle ay tumutukoy sa bahaging hindi nakain at naiwan. Ang “ngunit” ay malinaw na naghuhudyat ng salungat na utos tungkol sa natira.
- source_word: עַד יוֹם הַשְּׁלִישִׁי
  choice: hanggang sa ikatlong araw
  rationale: Pinananatili nito ang karaniwang temporal na kahulugan ng עַד at ang hangganang itinakda ng teksto.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Direkta at likas na katumbas ito ng pariralang Hebreo at pinananatili ang kongkretong larawan ng pagsunog.
- source_word: יִשָּׂרֵף
  choice: ay susunugin
  rationale: Ang Niphal imperfect ay pasibo at dito ay nagpapahayag ng ipinag-uutos na gagawin sa natirang handog.
theological_decisions: []
