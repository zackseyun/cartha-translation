  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: tl
  text: Ngunit kung kainin man ito sa ikatlong araw[a], ito ay marumi; hindi ito magiging katanggap-tanggap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nadungisan” o “hindi katanggap-tanggap.” Ang salitang Hebreo ay tumutukoy sa karneng pansakripisyo na hindi na katanggap-tanggap dahil kinain ito lampas sa itinakdang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinapahayag ng pangatnig at kondisyunal ang pagsalungat sa naunang tagubilin; natural sa modernong Tagalog ang “Ngunit kung.”
- source_word: הֵאָכֹל יֵאָכֵל
  choice: kakainin pa rin
  rationale: Ang infinitive absolute na kasunod ng pandiwang Niphal ay nagbibigay-diin sa pagkain sa kabila ng pagbabawal; ipinahahayag ng “pa rin” ang diin nang hindi mabigat o artipisyal.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: sa ikatlong araw
  rationale: Tuwiran at likas na katumbas ng pariralang temporal.
- source_word: פִּגּוּל
  choice: karumal-dumal
  rationale: Ipinapanatili nito ang matinding negatibong paghuhusga sa salitang Hebreo, habang nililinaw sa talababa ang tiyak na kontekstong pansakripisyo at ang mga posibleng kahulugang marumi o nadungisan.
- source_word: הוּא
  choice: iyon ay
  rationale: Ginagawang malinaw ang predikatibong diin ng panghalip sa natural na Tagalog.
- source_word: לֹא יֵרָצֶה
  choice: hindi iyon tatanggapin
  rationale: Sa kontekstong pansakripisyo, ang Niphal ng רצה ay tumutukoy sa pagiging katanggap-tanggap ng handog, hindi lamang sa pangkalahatang pagiging kalugod-lugod.
theological_decisions:
- issue: Kalagayang pansakripisyo ng karneng kinain sa ikatlong araw
  choice: Itinuturing ang karne bilang karumal-dumal at hindi katanggap-tanggap sa ritwal na konteksto.
  alternative: Maaaring unawain lamang itong pisikal na panis, o bilang isang ganap na “kasuklam-suklam” sa mas malawak na moral na diwa.
  rationale: Ang agarang konteksto ay tungkol sa mga handog at sa itinakdang panahon ng pagkain. Ang pangwakas na “hindi iyon tatanggapin” ay nagpapatibay sa pansakripisyong diwa, ngunit hindi nito hinihinging paliitin ang פִּגּוּל sa pisikal na pagkasira lamang o palawakin sa ibang kategoryang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kakainin pa rin” upang likas na maipahayag ang mariing konstruksiyong Hebreo, at inilagay ang paliwanag sa teknikal na kahulugan ng פִּגּוּל sa talababa.
