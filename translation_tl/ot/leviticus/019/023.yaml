  to: Kapag pumasok kayo sa lupain at magtanim kayo ng anumang punong nagbibigay ng bungang makakain, ituturing ninyong di-tuli ang bunga nito.[a] Sa loob ng tatlong taon, magiging di-tuli ito para sa inyo; hindi ito dapat kainin.
