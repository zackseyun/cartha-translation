  text: וְ/כִי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ וּ/נְטַעְתֶּם֙ כָּל עֵ֣ץ מַאֲכָ֔ל וַ/עֲרַלְתֶּ֥ם עָרְלָת֖/וֹ אֶת פִּרְי֑/וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָ/כֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: tl
  text: Kapag pumasok kayo sa lupain at magtanim kayo ng anumang punong nagbibigay ng bungang makakain, ituturing ninyong di-tuli ang bunga nito.[a] Sa loob ng tatlong taon, magiging di-tuli ito para sa inyo; hindi ito dapat kainin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “di-tuli.” Ginagamit dito ang salita bilang metapora para sa bungang hindi pa pinahihintulutang kainin sa unang tatlong taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: Kapag pumasok kayo sa lupain
  rationale: Sa kontekstong pambatas, ipinakikilala ng וְכִי ang isang pangyayaring magaganap sa hinaharap. Likas sa Tagalog ang “kapag,” at pinananatili ng “lupain” ang di-tahasang pagtukoy ng Hebreo nang hindi idinaragdag ang pangalang Canaan.
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: at nagtanim ng anumang punong namumunga ng makakain
  rationale: Ipinahihiwatig ng parirala ang alinmang punong itinatanim upang pagkunan ng bungang makakain. Ang salin ay likas sa modernong Tagalog at pinananatili ang distributibong diwa ng כָּל.
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: ituturing ninyong di-tuli ang bunga nito
  rationale: 'Metaporikal ang ערל/ערלה rito: binibigyan ang bunga ng katayuang “di-tuli,” hindi inilalarawan ang isang pisikal na gawain. Ang “ituturing” ay malinaw na nagpapahayag ng legal na pagturing.'
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: Sa loob ng tatlong taon, magiging bawal iyon sa inyo
  rationale: Inilalantad nito ang praktikal na katayuan ng bunga para sa Israel sa loob ng tatlong taon. Napananatili sa naunang sugnay at talababa ang sadyang metapora ng Hebreo, habang natural na ipinahahayag dito ang epekto nito.
- source_word: לֹא יֵאָכֵל
  choice: hindi iyon dapat kainin
  rationale: Ipinahahayag nito ang pasibo at di-personal na pagbabawal ng Niphal nang natural sa Tagalog, sa halip na gawing tuwirang utos na “huwag ninyong kainin.”
theological_decisions:
- issue: Kung pananatilihin ang metapora ng “di-tuli” para sa bunga o papalitan ito ng “bawal” lamang
  choice: Panatilihin ang “di-tuli” sa pangunahing teksto at ipaliwanag sa talababa
  alternative: Isalin bilang “bawal” sa parehong paglitaw
  rationale: Sadyang ginagamit ng Hebreo ang bokabularyong ערל/ערלה bilang metapora. Ang ganap na pagpapalit dito ng “bawal” ay mag-aalis sa imaheng tipaniko at kultiko, samantalang ang “di-tuli” na may paliwanag ay kapuwa tapat at mauunawaan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “di-tuli” upang mapanatili ang kakaibang metapora ng Hebreo, ngunit nilinaw ang praktikal na kahulugan nito sa kasunod na sugnay at sa talababa.
