  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: tl
  text: At sa ikalimang taon, maaari ninyong kainin ang bunga nito upang dumami ang ani nito para sa inyo. Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: At sa ikalimang taon
  rationale: Pinananatili ng “At” ang payak na pagpapatuloy ng mga tagubilin, habang natural sa Tagalog ang pariralang “sa ikalimang taon.”
- source_word: תֹּאכְלוּ
  choice: maaari ninyong kainin
  rationale: Sa kontekstong legal, nagpapahintulot ang anyo ng pandiwa matapos ang naunang pagbabawal; malinaw itong naipahahayag ng “maaari ninyong kainin.”
- source_word: אֶת־פִּרְיוֹ
  choice: ang bunga nito
  rationale: Ang פְּרִי ay tumutukoy sa bunga ng punongkahoy, at ang “nito” ay nagpapanatili sa panlalaking isahang hulapi nang natural sa Tagalog.
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: upang dumami ang ani nito para sa inyo
  rationale: Ipinahahayag ng “upang” ang layunin o resultang maaaring taglayin ng לְהוֹסִיף. Ang “ani” ay likas na katumbas ng תְּבוּאָה sa kontekstong agrikultural at naiiba sa naunang “bunga.”
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: Ako si Yahweh na inyong Diyos
  rationale: Pinananatili ang hayag na pangalang tipan na Yahweh at ang marangal na pormula ng pagkakakilanlan; natural at malinaw ang “na inyong Diyos” sa modernong Tagalog.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng pagkain sa ikalimang taon at pagdami ng ani
  choice: upang dumami ang ani nito para sa inyo
  alternative: para madagdagan nito ang ani para sa inyo
  rationale: Pinananatili ng “upang” ang posibleng layunin o resulta ng infinitibong may לְ nang hindi ipinapaliwanag kung paano eksaktong nauugnay ang pinahintulutang pagkain sa pagdami ng ani.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo/inyo” upang ipakita ang ikalawang panauhang maramihan ng Hebreo. Iniwasan ang sobrang teknikal na pananalita at pinanatili ang maikli at solemne nitong anyong legal.
