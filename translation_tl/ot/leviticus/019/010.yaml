base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: tl
  text: Huwag mong simutin ang ubasan mo[a], ni pulutin ang mga ubas na nalaglag sa ubasan mo[b]. Iwan mo ang mga iyon para sa dukha at sa dayuhang naninirahan[c]. Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huwag mong balikan upang anihin ang mga natira sa ubasan mo.” Tumutukoy ang pandiwang Hebreo sa muling pagdaan sa mga puno ng ubas pagkatapos ng pangunahing anihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga tira sa pag-aani ng iyong ubasan.” Tumutukoy ang Hebreo sa mga ubas na nahiwalay o nalaglag habang nag-aani.
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy ito sa isang dayuhang hindi katutubo ngunit naninirahan sa gitna ng Israel; maaari ring “dayuhang residente.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: ang ubasan mo
  rationale: Ang כֶּרֶם ay ubasan; natural at tuwiran ang “ubasan” sa makabagong Filipino.
- source_word: תְעוֹלֵל
  choice: simutin
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa muling pagdaan sa mga puno ng ubas upang kunin ang lahat ng natira. Ipinahihiwatig ng “simutin” ang ipinagbabawal na lubusang pag-aani nang hindi gumagamit ng teknikal na salita.
- source_word: פֶּרֶט
  choice: mga ubas na nalaglag doon
  rationale: Tumutukoy ang פֶּרֶט sa mga ubas na nahiwalay o nalaglag habang nag-aani. Ginagawang malinaw ng salin ang kongkretong tinutukoy.
- source_word: תְלַקֵּט
  choice: pulutin
  rationale: Ang לקט ay mangalap o mamulot; ang “pulutin” ang natural na kilos para sa mga ubas na nalaglag.
- source_word: לֶעָנִי
  choice: para sa dukha
  rationale: Ang עָנִי ay taong mahirap o kapos. Ang “dukha” ay maikli, malinaw, at angkop sa marangal na rehistro ng kautusan.
- source_word: וְלַגֵּר
  choice: at sa dayuhang nakikipamayan
  rationale: Ang גֵּר ay hindi katutubong taong naninirahan sa gitna ng Israel, hindi lamang isang bisita o sinumang banyaga. Ipinahahayag ng “dayuhang nakikipamayan” ang paninirahang iyon nang hindi gumagamit ng burukratikong katawagan.
- source_word: תַּעֲזֹב אֹתָם
  choice: Iwan mo ang mga iyon
  rationale: Ang עזב dito ay pag-iiwan ng ani upang mapakinabangan ng iba, hindi ganap na pagpapabaya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: ang inyong Diyos
  rationale: Pinananatili ang maramihang panghalip sa pormulang pangtipan, kahit isahan ang naunang mga utos sa indibidwal na may-ari ng ubasan.
theological_decisions:
- issue: Paglalarawan sa obligasyon ng may-ari at karapatan ng mga nasa laylayan
  choice: Iwan ang natirang ani para sa dukha at dayuhang nakikipamayan
  alternative: Ibigay o ipamahagi ito sa kanila
  rationale: “Iwan” ang tuwirang kilos sa Hebreo. Hindi sinasabi ng talata na aktibong ipamahagi ng may-ari ang ani, kaya hindi idinaragdag ang paraang iyon.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tahasang ginagamit ng Hebreo ang banal na pangalan; pinananatili itong pangalan upang hindi mapalitan ng titulo ang nasa pinagmulang teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “mo” sa mga utos ayon sa anyong isahan ng Hebreo, ngunit pinanatili ang maramihang “inyong” sa pangwakas na pormulang “inyong Diyos.”
