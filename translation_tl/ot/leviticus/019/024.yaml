  text: וּ/בַ/שָּׁנָה֙ הָ/רְבִיעִ֔ת יִהְיֶ֖ה כָּל פִּרְי֑/וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: tl
  text: Ngunit sa ikaapat na taon, ang lahat ng bunga nito ay magiging banal[a], para sa pagpupuri kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas pormal: “banal, mga papuri kay Yahweh” o “banal, para sa papuri kay Yahweh.” Pambihira ang pariralang Hebreo at maaaring idiin ang masayang pagpupuring iniuukol kasabay ng bunga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה
  choice: Ngunit sa ... taon
  rationale: Ginawang “Ngunit” ang ו upang ipakita ang kaibahan ng ikaapat na taon sa unang tatlong taon sa konteksto; ang ב ay temporal na “sa.”
- source_word: הָרְבִיעִת
  choice: ikaapat
  rationale: Tuwirang katumbas ng ordinal na naglalarawan sa “taon.”
- source_word: יִהְיֶה
  choice: ay magiging
  rationale: Likas na pahayag sa hinaharap na angkop sa estilong legal ng talata.
- source_word: כָּל פִּרְיוֹ
  choice: ang lahat ng bunga nito
  rationale: Ipinahahayag ang kabuuan ng ani o bunga ng punong tinutukoy.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Panaguring nagsasaad na ang bunga ay banal, samakatuwid ay nakatalaga sa Diyos.
- source_word: הִלּוּלִים
  choice: pagpupuri
  rationale: Ang pambihirang pangngalang maramihan ay kaugnay ng papuri at masayang pagdiriwang; iniwasang idagdag ang tiyak na konsepto ng “handog,” na hindi tahasang nasa salita.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ipinakikita ng ל ang patutunguhan o pag-uukol, at pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Kahulugan ng pambihirang pariralang קֹדֶשׁ הִלּוּלִים
  choice: banal, para sa pagpupuri kay Yahweh
  alternative: banal, mga papuri kay Yahweh; banal, isang handog ng papuri kay Yahweh
  rationale: Pinananatili ng salin ang kaugnayan sa papuri at pagdiriwang nang hindi tiyak na tinatawag na “handog” ang bunga. Inilalagay sa talababa ang mas pormal na mga posibilidad dahil pambihira at sintaktikong masinsin ang Hebreong parirala.
- issue: Paglilipat ng יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang “Yahweh” upang katawanin ang personal na pangalang tipan na tahasang nasa tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal na himig at ang pambihirang anyo ng pariralang Hebreo sa pamamagitan ng maikling talababa.
