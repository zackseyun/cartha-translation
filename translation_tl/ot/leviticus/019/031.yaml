  verdict: revise
  source_fidelity: Tumpak na naipapakita ng draft ang dalawang magkahiwalay na pangkat, ang pagbabawal na bumaling at humanap sa kanila, at ang pagpapakilala ni Yahweh bilang Diyos ng kausap na pangmaramihan. Gayunman, ang “upang hindi kayo maging marumi” ay nagdaragdag ng “hindi” sa positibong infinitive na לְטָמְאָה (“upang maging marumi/madungisan”). Bagaman lohikal itong bunga ng pagbabawal, mas malapit at mas malinaw ang direktang paglalatag ng layunin/bunga nang walang idinagdag na negasyon.
  naturalness: Likas ang “bumaling,” “mga medyum,” at “mga espiritista” sa makabagong Filipino. Mas angkop ang “madungisan” kaysa “maging marumi” sa kontekstong Levitico, dahil naiiwasan nito ang karaniwang pisikal na kahulugan ng “marumi” habang hindi nililimitahan ang karumihan sa rituwal o moral na saklaw lamang.
  terminology: 'Napananatili ang “Yahweh” at ang pangmaramihang “inyong Diyos.” Kailangang itama ang talababa: ang “mga may espiritung tagapayo” ay hindi maaasahang katumbas ng “those with familiar spirits,” at ang “mga manghuhula” ay nagpapaliit sa saklaw ng יִדְּעֹנִים.'
