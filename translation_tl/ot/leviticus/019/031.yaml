  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: tl
  text: Huwag kayong bumaling sa mga medyum o sa mga espiritista; huwag ninyo silang hanapin[a], upang madungisan kayo sa pamamagitan nila. Ako si Yahweh, ang inyong Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “mga medyum” bilang “mga nakikipagsangguni sa mga patay,” at ang “mga espiritista” bilang “mga may espiritung pamilyar” o “mga salamangkero.” Ang mga katawagang Hebreo ay tumutukoy sa ipinagbabawal na mga tagapagsagawa na kaugnay ng pagsangguni sa mga espiritu o sa mga patay.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: bumaling
  rationale: Pinananatili nito ang pangunahing diwa ng pandiwang פנה na ‘humarap’ o ‘bumaling,’ habang likas na ipinahihiwatig sa konteksto ang paglapit sa kanila upang sumangguni.
- source_word: הָאֹבֹת
  choice: mga medyum
  rationale: Sa kontekstong ito ng batas, tumutukoy ang אוֹב sa mga taong kaugnay ng pakikipag-ugnayan sa mga espiritu o sa mga patay. Ang ‘mga medyum’ ay maikli at nauunawaan sa makabagong Filipino bilang mga tagapamagitan sa gayong gawain.
- source_word: הַיִּדְּעֹנִים
  choice: mga espiritista
  rationale: Tumutukoy ang יִדְּעֹנִי sa mga nagsasagawa ng ipinagbabawal na pagkuha ng kaalaman sa pamamagitan ng mga espiritu. Ang ‘mga espiritista’ ay malinaw sa kasalukuyang gamit at hindi nagdadala ng makabagong pantasyang pahiwatig ng ‘mga salamangkero.’
- source_word: תְּבַקְשׁוּ
  choice: hanapin
  rationale: Tuwirang ipinapahayag ng בקש ang paghahanap. Sa konteksto, likas na nauunawaan ang sadyang paglapit sa mga ipinagbabawal na tagapagsagawa nang hindi dinaragdagan ang teksto ng tahasang ‘sumangguni.’
- source_word: לְטָמְאָה בָהֶם
  choice: upang hindi kayo maging marumi dahil sa kanila
  rationale: Ipinapakita nito na ang pakikibahagi sa kanila ay humahantong sa karumihan. Ang saklaw ng naunang pagbabawal ay likas na ipinahayag sa Filipino sa ‘upang hindi,’ habang ang ‘maging marumi’ ay hindi nagpapasya kung rituwal lamang o moral lamang ang karumihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Pinananatili nito ang pangmaramihang ikalawang panauhan at ang tipanang pagkakakilanlan sa Hebreo.
theological_decisions:
- issue: Saklaw ng karumihang dulot ng ipinagbabawal na gawain
  choice: ‘maging marumi’ nang hindi nililimitahan sa rituwal o moral na karumihan
  alternative: ‘maging marumi ayon sa rituwal’ o ‘madungisan sa moral’
  rationale: Maaaring saklawin ng טמא sa Levitico ang rituwal at moral na mga dimensiyon. Pinananatili ng salin ang lawak at tensiyong ito.
- issue: Pagkakakilanlan ng dalawang uri ng ipinagbabawal na tagapagsagawa
  choice: 'Panatilihing dalawang magkaugnay ngunit magkahiwalay na katawagan: ‘mga medyum’ at ‘mga espiritista’'
  alternative: Pagsamahin sila bilang ‘mga nakikipag-usap sa mga espiritu’
  rationale: Magkaiba ang dalawang katawagang Hebreo kahit hindi tiyak ang eksaktong hangganan ng kahulugan ng bawat isa. Hindi sila dapat tahimik na pagsamahin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kayo/ninyo/inyong’ upang panatilihin ang pangmaramihang kausap. Ang hiram na salitang ‘medyum’ ay ginamit sa kinikilalang okultong kahulugan at nilinaw sa talababa.
