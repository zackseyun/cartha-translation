- from: Huwag kayong manumpa nang kasinungalingan sa pamamagitan ng pangalan ko, at sa gayon ay lapastanganin ang pangalan ng inyong Diyos.[a] Ako si Yahweh.
  to: Huwag kayong manumpa nang may kasinungalingan sa aking pangalan at lapastanganin ninyo ang pangalan ng inyong Diyos.[a] Ako si Yahweh.
  rationale: Inayos ang mga kolokasyon at sintaks upang maging likas ang Filipino habang pinananatili ang tuwirang pagbabawal, ang panunumpa sa pangalan ng Diyos, ang kaugnayan nito sa kasinungalingan, at ang paglapastangan sa kanyang pangalan. Pinanatili sa talababa ang mas literal na pagbasa ng pariralang לַשָּׁקֶר.
