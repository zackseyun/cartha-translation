    issue: Hindi likas ang “manumpa nang kasinungalingan.”
    rationale: Bagaman nauunawaan, hindi ito karaniwang kolokasyon sa modernong Filipino. Ang “manumpa nang may kasinungalingan” ay mas malinaw at nananatiling malapit sa לַשָּׁקֶר, ‘para sa/kaugnay ng kasinungalingan.’
  - severity: low
    issue: Medyo mabigat ang “sa pamamagitan ng pangalan ko” sa konteksto ng panunumpa.
    rationale: Ang “sa aking pangalan” ang karaniwan at tuwirang Filipino para sa panunumpang ginagawa sa pamamagitan ng pagbanggit o pagtawag sa isang pangalan.
  - severity: low
    issue: Hindi ganap na malinaw ang sintaks ng “at sa gayon ay lapastanganin.”
    rationale: Ang pagdaragdag ng “ninyo” ay naglilinaw sa saklaw ng pagbabawal. Hindi isinama ang “sa gayon” upang huwag gawing tahasang bunga ang isang ugnayang ipinahihintulot ngunit hindi tahasang minamarka ng waw.
  revised_text: Huwag kayong manumpa nang may kasinungalingan sa aking pangalan at lapastanganin ninyo ang pangalan ng inyong Diyos.[a] Ako si Yahweh.
