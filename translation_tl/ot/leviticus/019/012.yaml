  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: ipinagbabawal ang huwad na panunumpa sa pangalan ng Diyos, na naglalapastangan sa kanyang pangalan. Gayunman, ang “nang kasinungalingan” ay hindi likas na paraan sa modernong Filipino upang ilarawan ang huwad na panunumpa, at ang “sa pamamagitan ng pangalan ko” ay mas mabigat kaysa sa karaniwang pananalitang pangpanunumpa na “sa aking pangalan.”'
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “manumpa nang may kasinungalingan sa aking pangalan.” Ang pag-uugnay na “at lapastanganin ninyo” ay malinaw na saklaw pa rin ng “Huwag” at mas maayos kaysa sa kasalukuyang anyong walang malinaw na paksa sa ikalawang sugnay.
  terminology: Napananatili ang “pangalan,” “Diyos,” at “Yahweh.” Ang “lapastanganin” ay angkop na katumbas ng Piel ng חלל sa kontekstong ito.
  issues:
