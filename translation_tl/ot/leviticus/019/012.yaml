  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: tl
  text: Huwag kayong manumpa nang may kasinungalingan sa aking pangalan at lapastanganin ninyo ang pangalan ng inyong Diyos.[a] Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “Huwag kayong manumpa sa aking pangalan para sa kasinungalingan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: manumpa
  rationale: Ang Nifal ng שׁבע ay tumutukoy sa panunumpa o pagbibigay ng sumpa; natural at tuwiran ang “manumpa” sa makabagong Filipino.
- source_word: בִשְׁמִי
  choice: sa pamamagitan ng pangalan ko
  rationale: Sa konteksto ng panunumpa, ipinapahiwatig ng ב ang pangalang pinagbabatayan o tinatawagan bilang saksi sa sumpa.
- source_word: לַשָּׁקֶר
  choice: nang kasinungalingan
  rationale: Ipinahahayag nito nang natural sa Filipino ang adberbiyal na diwang panunumpa nang hindi totoo, habang pinananatili sa talababa ang mas literal na anyo.
- source_word: וְחִלַּלְתָּ
  choice: at sa gayon ay lapastanganin
  rationale: Ang Piel ng חלל ay nangangahulugang lapastanganin o dungisan ang kabanalan; ipinakikita ng “sa gayon” ang bunga ng huwad na panunumpa na maaaring ipahiwatig ng pang-ugnay.
- source_word: שֵׁם
  choice: pangalan
  rationale: Pinananatili ang literal na “pangalan” dahil tumutukoy ito sa ipinahayag na pagkakakilanlan at karangalan ng Diyos.
- source_word: אֱלֹהֶיךָ
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal ng אֱלֹהִים, iisa ang tinutukoy rito; ang hulaping isahan sa Hebreo ay tumutukoy sa bawat kabilang sa maramihang kausap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa pamamagitan ng transliterasyong “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Ugnayan ng huwad na panunumpa at paglapastangan sa pangalan ng Diyos
  choice: 'bunga: “at sa gayon ay lapastanganin”'
  alternative: 'payak na pag-uugnay: “at lapastanganin”'
  rationale: 'Maaaring ipahiwatig ng waw ang bunga sa kontekstong ito: ang panunumpa nang kasinungalingan sa pangalan ng Diyos ay humahantong sa paglapastangan sa pangalan niya, nang hindi inaalis ang gramatikal na posibilidad ng payak na koordinasyon.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “kayo/inyong” upang katawanin ang Hebreong maramihang pandiwa, samantalang ang personal na pangalang Yahweh at ang teolohikal na bigat ng “pangalan” ay pinanatili.
