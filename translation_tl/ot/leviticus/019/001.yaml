lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: nagsalita
  rationale: Ang anyong pandiwa ay nagpapakilala ng isang bagong pangyayari ng pagsasalita; ang “nagsalita” ang likas at bahagyang pormal na katumbas sa pormulang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na panandang Filipino para sa taong pinatutungkulan ng pagsasalita; “Moises” ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nag-uugnay sa pambungad na sugnay sa mismong mensaheng sumusunod.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal at bahagyang paulit-ulit na hulma ng Hebreong pambungad sa pagsasalita upang maihanda ang mensaheng sumusunod sa talata 2.
