  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
