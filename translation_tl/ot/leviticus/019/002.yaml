language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: tl
  text: Magsalita ka sa buong kapulungan ng mga anak ni Israel[a] at sabihin mo sa kanila, “Maging banal kayo,[b] sapagkat ako, si Yahweh na inyong Diyos, ay banal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “buong kapulungan ng mga Israelita.”'
    reason: lexical_alternative
  - marker: b
    text: 'O: “Dapat kayong maging banal” o “Kayo ay magiging banal.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Ang Piel imperative ay tuwirang utos kay Moises. Likas at marangal sa Filipino ang “Magsalita ka” sa ganitong pormal na pahayag.
- source_word: כָּל עֲדַת
  choice: buong kapulungan
  rationale: Tumutukoy ang עֵדָה sa nagkakatipong pamayanang tipan; ipinahahayag ng “buong” ang כָּל, at pinananatili ng “kapulungan” ang kolektibo at pormal na diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang hayagang pananalitang may ugnayang-anak sa Hebreo, habang inilalagay sa talababa ang mas idyomatikong pagtukoy sa buong bayang Israel.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Tuwiran at natural itong katumbas ng karaniwang pagkakasunod ng mga utos sa diskursong pambatas.
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: Maging banal kayo
  rationale: Natural sa modernong Filipino ang anyong ito para sa utos o pananagutang ipinahahayag ng pang-uri at imperfect ng היה. Hindi nito ginagawang paglalarawan lamang ang pahayag.
- source_word: קָדוֹשׁ
  choice: banal
  rationale: Ang “banal” ang kinikilalang salitang sumasaklaw sa kabanalan at pagiging bukod para sa Diyos; masyadong makitid kung “ibinukod” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Wastong ipinahahayag nito ang ikalawang panauhang maramihan at ang pormulang tipan sa isang natural at marangal na anyong Filipino.
theological_decisions:
- issue: Paglilipat ng katawagang pangtipan na בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / buong kapulungan ng Israel
  rationale: Pinananatili sa pangunahing teksto ang literal na anyong may ugnayang-anak, ngunit nililinaw sa talababa ang lehitimong kolektibo at idyomatikong pagbasa.
- issue: Lakas at anyo ng utos tungkol sa kabanalan
  choice: Maging banal kayo
  alternative: Dapat kayong maging banal / Kayo ay magiging banal
  rationale: Maaaring magpahayag ang konstruksiyong Hebreo ng utos o pananagutan, samantalang pormal itong may imperfect na pandiwa. Pinipili ng pangunahing teksto ang natural na utos sa Filipino at pinananatili sa talababa ang iba pang posibleng himig.
- issue: Batayan ng kabanalan ng bayan
  choice: sapagkat ako, si Yahweh na inyong Diyos, ay banal
  alternative: sapagkat banal ako—si Yahweh na inyong Diyos
  rationale: 'Pinananatili ang teolohikal na ugnayan: ang kabanalan ng Diyos ang batayan ng panawagan sa kabanalan ng sambayanan, nang hindi ipinapaliwanag nang higit sa sinasabi ng talata.'
translation_notes:
  register: Modernong Filipino na marangal at angkop sa tekstong pambatas. Ginamit ang “kapulungan” upang mapanatili ang kolektibo at pormal na diwa, ngunit iniwasan ang lipas o labis na matayog na pananalita. Inilagay ang [b] kaagad sa utos na tinutukoy nito upang maging malinaw ang talababa.
