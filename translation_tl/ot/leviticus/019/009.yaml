  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: tl
  text: Kapag inaani ninyo ang ani ng inyong lupain, huwag ninyong anihin nang lubusan ang gilid ng inyong bukid[a], at huwag ninyong pulutin ang mga nalaglag sa inyong pag-aani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sulok ng inyong bukid.” Ang salitang Hebreo ay maaaring mangahulugang gilid, panig, o sulok; dito, tumutukoy ito sa panlabas na bahagi ng bukid na dapat iwang hindi lubusang inaani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: Kapag inaani ninyo
  rationale: Ang waw at be na nakakabit sa infinitive construct ng קצר ay nagpapakilala ng panahong kalagayan. Likas sa makabagong Tagalog ang “Kapag inaani ninyo” at pinananatili nito ang pangkalahatang saklaw ng utos.
- source_word: קְצִיר אַרְצְכֶם
  choice: ang ani ng inyong lupain
  rationale: Ang קְצִיר ay tumutukoy rito sa ani o pag-aani, at ang אֶרֶץ ay lupang sinasaka, hindi bansang pampolitika. Ang “ani ng inyong lupain” ay malinaw at natural sa kontekstong agrikultural.
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: huwag ninyong anihin nang lubusan
  rationale: Ang Piel ng כלה ay nangangahulugang tapusin o lubusin. Isinama sa pandiwang “anihin” ang diwa ng infinitive na לִקְצֹר upang maging natural sa Tagalog habang pinananatili ang pagbabawal na ubusin sa pag-aani ang bahaging tinutukoy.
- source_word: פְּאַת שָׂדְךָ
  choice: ang gilid ng inyong bukid
  rationale: Ang פאה ay maaaring tumukoy sa gilid, panig, o sulok. Sa batas na ito, ang “gilid” ay madaling maunawaan bilang panlabas na bahagi ng bukid na hindi dapat anihing lubusan; inilalahad sa talababa ang tunay na alternatibong “sulok.”
- source_word: לֶקֶט קְצִירְךָ
  choice: ang mga nalaglag sa inyong pag-aani
  rationale: Ang לֶקֶט ay mga piraso o tangkay na nalaglag o naiwan sa pangunahing pag-aani. Mas malinaw sa karaniwang mambabasa ang “mga nalaglag” kaysa sa teknikal o di-gaanong likas na katawagan.
- source_word: לֹא תְלַקֵּט
  choice: huwag ninyong pulutin
  rationale: Ang לקט ay pagpulot o pagtitipon ng naiwan o nalaglag na ani. Tumpak at natural ang “pulutin” kaugnay ng “mga nalaglag.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “ninyo” ayon sa קֻצְרְכֶם at אַרְצְכֶם, bagaman ang “inyong bukid” ay sumusunod sa biglang pang-isahang שָׂדְךָ at קְצִירְךָ bilang kolektibong pagtukoy sa bawat nakikinig. Iniwasan ang teknikal na salitang “himalay” upang manatiling madaling maunawaan.
