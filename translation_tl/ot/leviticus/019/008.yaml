id: LEV.19.8
reference: Leviticus 19:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: tl
  text: Ang sinumang kumain nito ay papasanin ang kanyang kasalanan[a], sapagkat nilapastangan niya ang banal na bagay na ukol kay Yahweh[b]; at ang taong iyon[c] ay aalisin sa kanyang bayan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “papasanin niya ang kanyang pagkakasala.” Ang Hebreong idyoma ay maaaring tumukoy kapwa sa pananagutan sa kasalanan at sa mga bunga nito.
    reason: lexical_alternative
  - marker: b
    text: Ang “banal na bagay na ukol kay Yahweh” ay ang itinalaga kay Yahweh—sa kontekstong ito, ang karne ng hain.
    reason: cultural_note
  - marker: c
    text: Sa literal, “ang kaluluwang iyon.” Sa legal na gamit ng Hebreo, ang “kaluluwa” ay tumutukoy sa mismong tao.
    reason: lexical_alternative
  - marker: d
    text: Ang “aalisin sa kanyang bayan” ay isang pormula ng kaparusahang pangtipan. Hindi nililinaw rito kung nangangahulugan ito ng kamatayan, pagpapatalsik sa pamayanan, o tuwirang hatol ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: Ang sinumang kumain nito
  rationale: Natural na ipinapahayag sa Tagalog ang pangkalahatang singular na tumutukoy sa sinumang kakain ng karneng hain na binanggit sa naunang talata.
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: papasanin ang kanyang kasalanan
  rationale: Pinananatili ang Hebreong idyoma ng pagpasan sa kasalanan, na maaaring sumaklaw kapwa sa pagkakasala at sa mga bunga o kaparusahan nito.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng hatol sa isang dignified ngunit karaniwang salitang Tagalog.
- source_word: קֹדֶשׁ יְהוָה
  choice: ang banal na bagay na ukol kay Yahweh
  rationale: Hindi labis na tinutukoy bilang 'handog' ang pangngalan, bagaman ang konteksto ay tumutukoy sa karneng hain; ipinahahayag din na ito ay itinalaga kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos ayon sa Hebreong teksto at sa patakaran ng proyekto.
- source_word: חִלֵּל
  choice: nilapastangan
  rationale: Ipinahahayag ang pagtrato sa banal bilang karaniwan o di-banal, na may angkop na bigat sa kasalukuyang Tagalog.
- source_word: וְנִכְרְתָה
  choice: ay aalisin
  rationale: Natural na Tagalog para sa pormulang pangtipan ng pagkaputol mula sa bayan, nang hindi tinutukoy sa pangunahing teksto kung kamatayan, pagpapatalsik, o tuwirang hatol ng Diyos ang paraan.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa buong tao, hindi lamang sa 'kaluluwa.'
- source_word: מֵעַמֶּיהָ
  choice: sa kanyang bayan
  rationale: Ang pambabaeng hulapi sa Hebreo ay umaayon sa gramatikal na kasarian ng נֶפֶשׁ; ang likas na Tagalog ay gumagamit ng walang-kasariang 'kanyang' para sa taong nagkasala.
theological_decisions:
- issue: Kahulugan ng pormulang וְנִכְרְתָה, 'aalisin/puputulin'
  choice: Panatilihing hindi tiyak ang paraan ng pag-aalis sa pamamagitan ng 'aalisin sa kanyang bayan.'
  alternative: Papatayin, ititiwalag, o aalisin sa pamamagitan ng tuwirang hatol ng Diyos.
  rationale: Hindi tinutukoy ng talata kung ano mismo ang paraan ng kaparusahan. Ang salin at talababa ay nagpapanatili sa legal at teolohikal na tensiyon sa halip na pumili ng isang pinagtatalunang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang Hebreong idyoma sa 'papasanin ang kanyang kasalanan,' habang nilinaw sa talababa ang saklaw nito. Iniwasan ang 'ititiwalag' dahil maaari itong magtakda agad ng eklesyastikal o panlipunang mekanismo na hindi tahasang sinasabi ng teksto.
