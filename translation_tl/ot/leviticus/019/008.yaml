  source_fidelity: Tapat ang salin sa Hebreo. Ang “papasanin ang kanyang kasalanan” ay maayos na katumbas ng עֲוֺנוֹ יִשָּׂא at hindi labis na binibigyang-kahulugan ang saklaw ng pananagutan. Ang “nilapastangan” ay wastong naghahatid ng חילל, at ang “aalisin sa kanyang bayan” ay nagpapanatiling bukás ang di-tiyak na paraan ng parusang וְנִכְרְתָה.
