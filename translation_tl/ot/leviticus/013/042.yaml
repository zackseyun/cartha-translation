source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: tl
  text: Ngunit kung sa bahaging kalbo sa likod ng ulo o sa bahaging kalbo sa harap ng ulo[b] ay may batik na maputi na may mapulang bahid, iyon ay sakit sa balat[a] na kumakalat sa bahaging kalbo sa likod o sa harap ng kanyang ulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin na “ketong.” Mas malawak ang kahulugan ng terminong Hebreo at tumutukoy sa iba’t ibang sakit o kondisyon sa balat; hindi ito dapat ituring na tiyak na katumbas ng makabagong Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: Magkaiba ang dalawang terminong Hebreo para sa pagkakalbo sa likod ng ulo at sa pagkakalbo sa harap ng ulo.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang isang kondisyunal na kaso na may bahagyang pagsalungat sa naunang talata.
- source_word: בַקָּרַחַת ... בַגַּבַּחַת
  choice: sa bahaging kalbo sa likod ng ulo ... sa bahaging kalbo sa harap ng ulo
  rationale: Pinananatili ang pagkakaiba ng dalawang terminong Hebreo para sa pagkakalbo sa likod at sa harap ng ulo.
- source_word: נֶגַע
  choice: batik
  rationale: Tumutukoy sa nakikitang marka o apektadong bahagi na sinusuri sa konteksto; hindi ito binigyan ng labis na tiyak na makabagong diagnosis.
- source_word: לָבָן אֲדַמְדָּם
  choice: maputi at mamumula
  rationale: Inilalarawan nang natural sa Tagalog ang maputing batik na may mapulang kulay, nang hindi labis na tinutukoy ang eksaktong lilim.
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa modernong Hansen's disease, kaya iniiwasan ang mapanlinlang na tuwirang pagtumbas sa ketong.
- source_word: פֹּרַחַת
  choice: kumakalat
  rationale: Ipinahahayag ang aktibong paglitaw o paglaganap ng kondisyon sa kontekstong ito.
- source_word: בְּקָרַחְתּוֹ ... בְגַבַּחְתּוֹ
  choice: sa bahaging kalbo sa likod o sa harap ng kanyang ulo
  rationale: Pinananatili ang panghalip na paari at ang pagkakaiba ng lokasyon, habang iniiwasan ang mabigat na pag-uulit.
theological_decisions:
- issue: Pagkakakilanlan ng צָרַעַת
  choice: sakit sa balat
  alternative: ketong
  rationale: Hindi tiyak na katumbas ng צָרַעַת ang Hansen's disease; pinananatili ng salin ang mas malawak na sinaunang kategorya at inilalagay sa talababa ang tradisyonal na tawag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bahaging kalbo” upang likas na maipahayag ang lokasyon ng kondisyon, at pinanatili sa teksto ang teknikal na pagkakaiba ng harap at likod ng ulo.
