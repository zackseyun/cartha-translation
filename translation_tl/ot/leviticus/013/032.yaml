  text: וְ/רָאָ֨ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּגַע֮ בַּ/יּ֣וֹם הַ/שְּׁבִיעִי֒ וְ/הִנֵּה֙ לֹא פָשָׂ֣ה הַ/נֶּ֔תֶק וְ/לֹא הָ֥יָה ב֖/וֹ שֵׂעָ֣ר צָהֹ֑ב וּ/מַרְאֵ֣ה הַ/נֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן הָ/עֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: tl
  text: At susuriin ng pari ang apektadong bahagi sa ikapitong araw; at kung makitang hindi kumalat ang sakit na nagbabalat[a], wala itong dilaw na buhok, at ang anyo ng sakit na nagbabalat ay hindi mas malalim kaysa sa balat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na נֶתֶק ay tumutukoy sa isang natatanging makaliskis na karamdaman sa anit o balbas; maaari rin itong isalin na “makaliskis na sugat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: susuriin
  rationale: Sa konteksto ng pagsusuring isinasagawa ng pari, ang ראה ay tumutukoy sa masusing pagtingin o pagsisiyasat, hindi lamang sa pagkakita.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na katumbas ng כֹּהֵן sa makabagong Tagalog.
- source_word: הַנֶּגַע
  choice: ang apektadong bahagi
  rationale: Ang נֶגַע ay tumutukoy sa bahaging may karamdaman o pinsala; iniiwasan nito ang maling pag-uugnay sa isang tiyak na modernong sakit.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Tuwirang ipinapahayag ang takdang araw ng muling pagsusuri.
- source_word: וְהִנֵּה
  choice: Kapag nakita niyang
  rationale: Natural na naipapahayag sa Tagalog ang pormulang nagpapakilala sa resulta ng pagsusuri, habang naaayon sa kondisyunal na daloy ng talata.
- source_word: לֹא פָשָׂה
  choice: hindi kumalat
  rationale: Sa mga batas tungkol sa sakit sa balat, ang פשה ay tumutukoy sa paglawak o pagkalat ng apektadong bahagi.
- source_word: הַנֶּתֶק
  choice: ang sakit na nagbabalat
  rationale: Ang נֶתֶק ay isang natatanging uri ng karamdaman sa anit o balbas na may pagbabalat at pagbabago sa buhok. Ang saling ito ay malinaw ngunit hindi nagpapanggap na katumbas ito ng isang tiyak na modernong diagnosis.
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: walang dilaw na buhok dito
  rationale: Pinananatili ang kawalan ng palatandaang sinusuri at ang pagtukoy sa mismong apektadong bahagi.
- source_word: שֵׂעָר צָהֹב
  choice: dilaw na buhok
  rationale: Payak at tuwirang katumbas ng kulay na inilalarawan ng צָהֹב.
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: at hindi ito mukhang mas malalim kaysa sa balat
  rationale: 'Ang “mukhang” ay nagpapanatili sa diwa ng מַרְאֶה: ang sinusuri ay ang nakikitang anyo o lalim, hindi isang tiyak na anatomikong pahayag.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang bokabularyong pangkaraniwang mauunawaan, habang iniwasan ang tiyak na modernong medikal na diagnosis. Pinanatili ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata.
