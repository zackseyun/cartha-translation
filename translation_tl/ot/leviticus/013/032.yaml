revisions:
- from: At susuriin ng pari ang apektadong bahagi sa ikapitong araw. Kapag nakita niyang hindi kumalat ang sakit na nagbabalat[a], walang dilaw na buhok dito, at hindi ito mukhang mas malalim kaysa sa balat,
  to: At susuriin ng pari ang apektadong bahagi sa ikapitong araw; at kung makitang hindi kumalat ang sakit na nagbabalat[a], wala itong dilaw na buhok, at ang anyo ng sakit na nagbabalat ay hindi mas malalim kaysa sa balat,
  rationale: Pinag-isa ang daloy ng pangungusap upang maipakita ang magkakaugnay na obserbasyon sa pagsusuri. Ginawang “wala itong dilaw na buhok” ang locative na parirala para sa mas likas na Tagalog, at ibinalik ang tahasang “anyo ng sakit na nagbabalat” upang katawanin ang מַרְאֵה הַנֶּתֶק. Inalis ang “langib” sa talababa dahil hindi ito ligtas na lexical alternative.
