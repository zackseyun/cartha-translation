- from: Ngunit kung susuriin iyon ng pari at makitang walang puting buhok sa matingkad na batik, hindi iyon mas malalim kaysa balat[a], at kupas iyon, ibubukod ng pari ang taong iyon nang pitong araw.[b]
  to: Ngunit kung susuriin ito ng pari at makitang walang puting buhok sa maputing batik, hindi ito mas malalim kaysa balat[a], at kupas ito, ibubukod[b] ng pari ang taong iyon nang pitong araw.
  rationale: Pinalitan ang “matingkad na batik” ng “maputing batik” upang maipakita ang katangiang maputi/maliwanag ng בַּהֶרֶת nang hindi nagbibigay ng tiyak na medikal na kahulugan. Inayos din ang daloy ng pangungusap at ang pagkakalagay ng anchor ng talababa b. Napanatili ang ambag ng Hebreong teksto at ang kaibhan sa pagitan ng batik na sinusuri at ng taong ibinubukod.
