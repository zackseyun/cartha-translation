base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: tl
  text: Ngunit kung susuriin ito ng pari at makitang walang puting buhok sa maputing batik, hindi ito mas malalim kaysa balat[a], at kupas ito, ibubukod[b] ng pari ang taong iyon nang pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi ito mas mababa kaysa balat,” ibig sabihin, hindi ito mukhang nakalubog kaysa sa nakapaligid na balat.
    reason: lexical_alternative
  - marker: b
    text: O “ikukuwarentenas” o “ikukulong ng pari ang taong iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֶנָּה
  choice: susuriin iyon
  rationale: Bagaman literal na “makikita iyon,” tumutukoy rito ang pandiwa sa pormal na pagsusuri ng pari sa batik.
- source_word: בַּבֶּהֶרֶת
  choice: sa matingkad na batik
  rationale: Ang בַּהֶרֶת ay isang maliwanag o kapansin-pansing batik sa balat. Pinananatili ng “matingkad na batik” ang katangiang nakikita nang hindi ito tinutukoy bilang isang tiyak na sakit.
- source_word: שֵׂעָר לָבָן
  choice: puting buhok
  rationale: Likas sa Tagalog ang kolektibong anyong “puting buhok” para sa palatandaang sinusuri.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: hindi iyon mas malalim kaysa balat
  rationale: Literal na may diwang “hindi mas mababa.” Sa konteksto, inilalarawan nito na ang batik ay hindi mukhang nakalubog sa kapantay na balat.
- source_word: כֵהָה
  choice: kupas
  rationale: Ipinahihiwatig ng salita na hindi matingkad ang batik. Ang “kupas” ay maikli, natural, at angkop sa nakikitang anyo nito.
- source_word: וְהִסְגִּירוֹ
  choice: ibubukod ng pari ang taong iyon
  rationale: Ang pandiwa ay nangangahulugang ipasara o ihiwalay para sa pagmamasid. Malinaw ang “ibubukod” at hindi nito ipinapasok ang makabagong teknikal na kahulugan ng “kuwarentenas.”
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Tuwirang salin ng itinakdang haba ng panahon.
