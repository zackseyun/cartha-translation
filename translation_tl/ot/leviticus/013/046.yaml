  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: tl
  text: Sa buong panahong nasa kanya ang karamdaman[a], marumi siya.[b] Marumi siya. Mamumuhay siyang mag-isa; ang kanyang tirahan ay nasa labas ng kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapinsalaan” o “salot.” Malawak ang salitang Hebreo at dito ay tumutukoy sa kondisyong sinuri at inilarawan sa kabanatang ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “marumi” rito ay tumutukoy sa katayuan ng pagiging di-malinis ayon sa kautusan sa Levitico, hindi kinakailangang sa kasalanang moral.
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: ang karamdaman
  rationale: Malawak ang saklaw ng נֶגַע at maaari itong tumukoy sa salot, pinsala, o karamdamang dumapo sa isang tao. Sa Levitico 13, tumutukoy ito sa kondisyong sinuri at hinatulan ayon sa kautusan; malinaw at likas sa makabagong Filipino ang “karamdaman” nang hindi labis na tinutukoy ang tiyak na medikal na uri nito.
- source_word: בּוֹ
  choice: nasa kanya
  rationale: Maaaring literal na “nasa loob niya” o “nasa ibabaw niya.” Ang “nasa kanya” ay natural sa Filipino at pinananatili ang lawak ng Hebreo nang hindi ipinapalagay kung panloob o panlabas ang kondisyon.
- source_word: יִטְמָא
  choice: magiging marumi siya
  rationale: Ang Qal imperfect ay may puwersang legal sa tuntuning ito. Pinananatili ng “magiging marumi siya” ang itinakdang kalagayan, samantalang ang kahulugan ng pagiging marumi rito ay nililinaw sa talababa.
- source_word: טָמֵא הוּא
  choice: Marumi siya
  rationale: Mariing inuulit ng sugnay na walang pandiwa ang kalagayan ng tao. Pinanatili bilang hiwalay at maikling pangungusap upang maipahayag ang diin ng Hebreo.
- source_word: בָּדָד
  choice: mag-isa
  rationale: Tuwirang ipinahahayag ng בָּדָד ang pagiging hiwalay o nag-iisa. Mas natural at hindi labis na klinikal ang “mag-isa” kaysa “nakahiwalay.”
- source_word: יֵשֵׁב
  choice: mamumuhay
  rationale: Ang ישב ay maaaring mangahulugang umupo, manirahan, o manatili. Dahil patuloy na paninirahan ang paksa, malinaw at idiomatiko ang “mamumuhay.”
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: nasa labas ng kampo
  rationale: Tuwirang inilalarawan nito ang lokasyong lampas sa hangganan ng pamayanan sa ilang. Karaniwan at malinaw sa Filipino ang “labas ng kampo.”
- source_word: מוֹשָׁבוֹ
  choice: ang kanyang tirahan
  rationale: Ang מוֹשָׁב ay lugar ng paninirahan. Ang “tirahan” ay maikli, kongkreto, at natural sa kasalukuyang Filipino.
theological_decisions:
- issue: Kalikasan ng pagiging marumi sa Levitico 13
  choice: Gamitin ang “marumi” sa pangunahing teksto nang hindi dinaragdagan ng “ritwal” o “seremonyal.”
  alternative: “marumi ayon sa ritwal” o “seremonyal na marumi”
  rationale: Payak na טמא ang nasa Hebreo. Pinananatili ng “marumi” ang kategoryang biblikal at ang diin ng pag-uulit, habang nililinaw sa talababa na legal at Levitikong kalagayan ito at hindi awtomatikong paghatol sa moral na pagkakasala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mariing pag-uulit na “magiging marumi siya. Marumi siya,” gayundin ang legal na tono at ang konkretong larawan ng paninirahan sa labas ng kampo.
