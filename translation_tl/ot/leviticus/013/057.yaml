  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: tl
  text: Ngunit kung muli itong makita sa kasuotan, sa mga pahabang sinulid[a], sa mga pahalang na sinulid, o sa anumang bagay na yari sa katad, ito ay kumakalat.[b] Sunugin mo sa apoy ang anumang bagay na may kapinsalaang iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pahabang mga sinulid” ay mga hiblang paayon sa paghahabi (warp); ang “pahalang na mga sinulid” ay mga hiblang itinatawid sa mga ito (weft o woof).
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: negaʿ, teknikal na katawagan sa Levitico para sa isang apektadong o kontaminadong marka o kapinsalaan; maaari ring isaling “marka,” “mantsa ng sakit,” o, sa ilang salin, “salot.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: muli itong makita
  rationale: Pinananatili nito ang pasibo at mapagmasid na diwa ng Niphal ng ראה at ang pag-ulit na ipinahihiwatig ng עוֹד sa proseso ng pagsusuri.
- source_word: בֶּגֶד
  choice: kasuotan
  rationale: Karaniwang tawag ito sa damit o telang tinutukoy sa Levitico 13 at natural sa makabagong Filipino.
- source_word: שְׁתִי ... עֵרֶב
  choice: pahaba o pahalang na mga sinulid
  rationale: Malinaw nitong inilalarawan sa karaniwang Filipino ang dalawang teknikal na bahagi ng hinabing tela—ang paayon at ang pahalang na hibla—nang hindi umaasa sa di-pamilyar na hiram na termino.
- source_word: כְּלִי עוֹר
  choice: anumang bagay na yari sa katad
  rationale: Sapat ang lawak nito para sa anumang kagamitan o bagay na gawa sa balat, gaya ng malawak na saklaw ng pariralang Hebreo.
- source_word: פֹּרַחַת הִוא
  choice: kumakalat ang salot
  rationale: Ang participle mula sa פרח ay literal na may diwang pagsibol o paglitaw, ngunit sa kontekstong ito ay tumutukoy sa aktibong pagkalat o muling paglabas ng apektadong marka.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Sunugin mo sa apoy
  rationale: Pinananatili ang tuwirang utos sa ikalawang panauhang isahan at ang legal na himig ng talata.
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: ang bagay na kinaroroonan ng salot
  rationale: Natural itong pahayag sa Filipino para sa bagay na may apektadong bahagi, at hindi nito nililimitahan ang tinutukoy sa isang partikular na uri ng kagamitan.
- source_word: הַנָּגַע
  choice: salot
  rationale: Teknikal ang נגע sa Levitico para sa kapinsalaan o kontaminadong marka. Ang “salot” ay nagpapanatili sa malawak at ritwal na gamit nito nang hindi ito itinuturing na tiyak na makabagong medikal na impeksiyon.
theological_decisions:
- issue: Kalikasan ng נגע sa mga bagay
  choice: salot
  alternative: impeksiyon; mantsa ng sakit
  rationale: Hindi tiyak na modernong sakit o mikrobyal na impeksiyon ang tinutukoy ng terminong Hebreo. Pinananatili ng “salot” ang legal-ritwal at malawak na kahulugan nang hindi nagpapasok ng di-nakasaad na diagnosis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na paglalarawan sa mga terminong panghabi, at ang isahang “mo” upang mapanatili ang anyo ng legal na utos sa Hebreo.
