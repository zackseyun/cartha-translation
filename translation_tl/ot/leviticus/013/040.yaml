  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: tl
  text: Kung mawalan ng buhok sa ulo ang isang lalaki[a], kalbo siya; malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kung makalbo ang isang lalaki.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging walang buhok o pagkaalis ng buhok; pinananatili ng pangunahing teksto ang pagkakaiba ng pandiwa at ng kasunod na “kalbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: isang lalaki
  rationale: Ang pangngalan ay panlalaking isahan at nagpapakilala ng isang kasong sinusuri sa batas; ang “isang lalaki” ay tumpak at natural sa konteksto.
- source_word: כִּי
  choice: kung
  rationale: Nagpapakilala ito ng kondisyonal na kaso sa kontekstong legal at pangsuri.
- source_word: יִמָּרֵט
  choice: malagas ang buhok
  rationale: Ang Niphal ng מרט ay tumutukoy sa pagiging hubad o pagkawala ng buhok. Ang “malagas ang buhok” ay hindi nagtatakda ng sanhi at pinananatiling naiiba ang pandiwa sa kasunod na predikatong “kalbo.”
- source_word: רֹאשׁוֹ
  choice: sa ulo
  rationale: Likas na pariralang Tagalog para sa lokasyon ng pagkawala ng buhok; ang kaugnayan sa lalaki ay malinaw sa buong pangungusap.
- source_word: קֵרֵחַ
  choice: kalbo
  rationale: Direkta, malinaw, at kasalukuyang salin ng kalagayang inilalarawan.
- source_word: טָהוֹר
  choice: malinis
  rationale: Tumutukoy sa katayuang ritwal sa mga batas ng Levitico 13, hindi sa moral na kawalang-sala.
- source_word: הוּא ... הוּא
  choice: siya ... siya
  rationale: 'Pinananatili ang dalawang mariing predikasyon ng Hebreo: “kalbo siya; malinis siya.”'
theological_decisions:
- issue: Terminong tumutukoy sa ritwal na katayuan sa mga batas tungkol sa karumihan
  choice: malinis
  alternative: dalisay
  rationale: Ang talata ay nagpapasiya ng ritwal na kalinisan kaugnay ng pagsusuri sa sakit sa balat, hindi ng moral na kadalisayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “malagas ang buhok” upang maging natural ngunit hindi tukuyin kung kusang nalagas o naalis ang buhok; pinanatili rin ang maikli at mariing anyo ng dalawang huling sugnay.
