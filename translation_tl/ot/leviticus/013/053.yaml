  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: tl
  text: Ngunit kung susuriin ito ng pari at makita niyang hindi kumalat ang pinsala sa kasuotan, sa paayon na mga sinulid, sa pahalang na mga sinulid[a], o sa anumang kagamitang yari sa balat,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pahalang na mga sinulid” ay ang mga sinulid na itinutuhog nang patawid sa paayon na mga sinulid sa paghahabi.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Nagpapatuloy ito sa kondisyong nakasaad sa naunang talata ngunit nagpapakilala ng ibang posibleng resulta ng pagsusuri.
- source_word: יִרְאֶה הַכֹּהֵן
  choice: susuriin ito ng pari
  rationale: Bagaman literal na nangangahulugang “makikita ng pari,” tumutukoy rito ang pandiwa sa opisyal na pagsusuri ng pari; nililinaw ng “susuriin” ang gamit sa konteksto nang hindi labis na nagpapakahulugan.
- source_word: וְהִנֵּה
  choice: at makitang
  rationale: Likas na ipinahahayag sa Filipino ang pansin sa resulta ng pagsusuri sa pamamagitan ng “makitang,” sa halip na gumamit ng mas matigas na literal na “narito.”
- source_word: לֹא פָשָׂה
  choice: hindi kumalat
  rationale: Tumpak at karaniwang pananalita para sa hindi paglawak ng apektadong kalagayan.
- source_word: הַנֶּגַע
  choice: ang pinsala
  rationale: Ang נגע ay maaaring tumukoy sa salot, apektadong bahagi, o nakapipinsalang kondisyon. Ang “pinsala” ay likas para sa tela at balat at hindi nagpapasok ng tiyak na makabagong medikal na diagnosis.
- source_word: בַּבֶּגֶד
  choice: sa kasuotan
  rationale: Karaniwang salin ng בגד sa kontekstong ito at angkop sa bagay na sinusuri.
- source_word: בַשְּׁתִי
  choice: sa paayon na mga sinulid
  rationale: Inilalarawan nang malinaw sa ordinaryong Filipino ang mga sinulid na pahaba sa hinabing tela, sa halip na gumamit ng di-pamilyar na teknikal na katawagan.
- source_word: בָעֵרֶב
  choice: sa pahalang na mga sinulid
  rationale: Inilalarawan ang mga sinulid na tumatawid sa paayon na mga sinulid; pinananatili ang teknikal na pagkakaiba ng dalawang terminong Hebreo.
- source_word: בְּכָל כְּלִי עוֹר
  choice: sa anumang kagamitang yari sa balat
  rationale: Malawak ang כְּלִי at maaaring tumukoy sa anumang bagay o kagamitan; ang “yari sa balat” ay natural at hindi nililimitahan ito sa isang uri ng gamit.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga paglalarawang “paayon” at “pahalang” upang maunawaan ng karaniwang mambabasa ang teknikal na pares na warp at weft, habang pinananatili ang pagkakaiba ng mga ito. Ang pangungusap ay sadyang nagtatapos sa kuwit dahil nagpapatuloy ang kondisyon sa kasunod na talata.
