- from: At sa kinaroroonan ng pigsa ay magkaroon ng puting pamamaga o mapulang-puting matingkad na batik, ipakita ito sa pari.[a]
  to: At sa lugar ng pigsa ay lumitaw ang puting pamamaga o ang mapulang-puting batik, at ito ay ipakita[a] sa pari.
  rationale: Inayos ang di-likas na pandiwang “ay magkaroon” sa “ay lumitaw,” na angkop sa paglitaw ng palatandaan sa balat at nananatiling malapit sa pandiwang Hebreo. Pinalitan ang “matingkad na batik” upang hindi magdagdag ng kahulugang “vivid/intense” na hindi kailangan sa pinagmulan. Inilagay ang angkla ng talababa mismo sa “ipakita,” ang salitang saklaw ng alternatibong pagbasa.
