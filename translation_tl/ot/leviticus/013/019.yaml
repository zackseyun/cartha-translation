translation:
  language: tl
  text: At sa lugar ng pigsa ay lumitaw ang puting pamamaga o ang mapulang-puting batik, at ito ay ipakita[a] sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ito ay makita ng pari.” Mas literal na maisasalin ang Hebreo bilang “makita,” ngunit malamang na tumutukoy ito rito sa paghaharap ng kondisyon upang suriin ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ay magkaroon
  rationale: Ipinahihiwatig ng היה sa kontekstong ito ang paglitaw ng kondisyon sa dating kinaroroonan ng pigsa; natural ito sa modernong Tagalog nang hindi lumalayo sa Hebreo.
- source_word: בִּמְקוֹם
  choice: sa kinaroroonan ng
  rationale: Malinaw na lokatibong parirala na tumutukoy sa mismong bahagi ng balat kung saan naroon ang pigsa.
- source_word: הַשְּׁחִין
  choice: pigsa
  rationale: Karaniwan at tumpak na katumbas ng inflamed sore o boil sa kontekstong ito.
- source_word: שְׂאֵת
  choice: pamamaga
  rationale: Tumutukoy sa nakaumbok o namamagang sugat sa balat; malinaw ito sa karaniwang mambabasa.
- source_word: לְבָנָה
  choice: puti
  rationale: Tuwirang katumbas ng pang-uring nagsasaad ng kaputian.
- source_word: בַהֶרֶת
  choice: matingkad na batik
  rationale: Pinananatili ang pagkakaiba nito sa pamamaga at ipinahihiwatig ang kapansin-pansin o maliwanag na bahagi ng balat.
- source_word: אֲדַמְדָּמֶת
  choice: mapulang-puti
  rationale: Ang batik ay tinawag nang puti at pagkatapos ay inilarawang mapula; pinagsasama ng salin ang dalawang katangian nang natural.
- source_word: וְנִרְאָה
  choice: ipakita ito
  rationale: Ang Niphal ay maaaring mangahulugang ‘makita’ o ‘magpakita,’ ngunit sa pamamaraang legal dito, ipinapaharap ang kondisyon upang suriin ng pari.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Karaniwang katumbas ng pariralang nagsasaad kung kanino ihaharap ang kondisyon.
