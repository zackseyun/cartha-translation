  naturalness: Kailangan ng bahagyang rebisyon para maging likas at malinaw ang pangungusap. Ang “lumitaw ang ... o ang ...” ay mas natural kaysa “ay magkaroon ng ... o ...”. Ang “matingkad na batik” ay maaaring tumukoy sa matingkad na kulay, hindi sa kapansin-pansin/maliwanag na katangian ng בַהֶרֶת.
  terminology: Ang “pigsa,” “pamamaga,” at “pari” ay angkop. Ginawang “mapulang-puting batik” ang ikalawang palatandaan upang mapanatili ang puti at mapulang paglalarawan nang hindi nagpapahiwatig ng sobrang tindi ng kulay.
