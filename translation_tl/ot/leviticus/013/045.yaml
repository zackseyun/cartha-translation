  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: tl
  text: Ang taong may sakit sa balat, na taglay ang gayong karamdaman, ay dapat punit ang kanyang mga damit, hayaang magulo ang kanyang buhok, takpan ang kanyang bigote[a], at sumigaw, “Marumi! Marumi!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “takpan ang kanyang itaas na labi.” Ang pahayag sa Hebreo ay tumutukoy sa pagtatakip sa bahagi ng labi o bigote bilang tanda ng pagdadalamhati at pampublikong babala.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: ang taong may sakit sa balat
  rationale: Hindi nililimitahan ng terminong Hebreo ang karamdaman sa Hansen’s disease; tumutukoy ito sa mas malawak na uri ng malubhang sakit sa balat sa konteksto ng Levitico.
- source_word: הַנֶּגַע
  choice: ang gayong karamdaman
  rationale: Pinananatili nito ang diwa ng nakikitang salot o apektadong kalagayan nang hindi nagpapahiwatig ng makabagong teorya tungkol sa mikrobyo.
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: dapat magkaroon ng punit na mga damit
  rationale: Malinaw na ipinahahayag ang kalagayan ng mga damit bilang punit, isang panlabas na tanda ng pagdadalamhati o pampublikong babala.
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: hayaang magulo ang kanyang buhok
  rationale: Ang פָרוּעַ ay tumutukoy sa buhok na nakalugay, napabayaan, o hindi maayos, hindi kinakailangang sa ulong walang takip.
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: takpan ang kanyang bigote[a]
  rationale: Ang שָׂפָם ay maaaring tumukoy sa bigote o sa bahagi ng mukha sa may itaas na labi; pinili ang likas na saling Tagalog at pinanatili sa talababa ang alternatibo.
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: sumigaw, “Marumi! Marumi!”
  rationale: Ang pag-uulit ay mariing pampublikong pagpapahayag ng kalagayang ritwal; ang “sumigaw” ay angkop sa tungkulin nitong magbabala sa iba.
theological_decisions:
- issue: Kahulugan ng טָמֵא sa Levitico 13
  choice: Marumi
  alternative: Di-malinis; nadungisan
  rationale: Dito, ang salita ay pangunahing tumutukoy sa ritwal at pampublikong kalagayan, hindi kinakailangang sa moral na pagkakasala. Pinananatili ng “marumi” ang tradisyonal at kontekstuwal na pag-igting nang hindi ito ginagawang makabagong medikal na hatol.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tao” sa halip na isang tahasang salitang panlalaki, habang pinanatili ang isahang pagtukoy ng Hebreo. Iniwasan ang terminong maaaring magtakda sa sakit bilang Hansen’s disease o magpahiwatig ng modernong paliwanag tungkol sa impeksiyon.
