base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: tl
  text: At susuriin siya ng pari sa ikapitong araw. Kung kumalat nga ito sa balat, ipahahayag ng pari na marumi siya; ito ay isang karamdaman sa balat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasaling “ketong.” Mas malawak ang tinutukoy ng terminong Hebreo kaysa sa modernong ketong (Hansen’s disease), at maaari itong tumukoy sa iba’t ibang kondisyon sa balat sa mga kautusan ng Israel tungkol sa ritwal na kalinisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: susuriin siya
  rationale: Bagaman literal na “makikita siya,” ang pandiwa sa kontekstong ito ng pagsusuri ng pari ay tumutukoy sa maingat na pagtingin o inspeksiyon.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na salin ng כֹּהֵן sa kontekstong ritwal ng Levitico.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Tuwiran at likas na salin ng pariralang temporal.
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: kung talagang kumalat iyon
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pagkalat; ipinahahayag ito ng “talagang.”
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Ang עוֹר ay balat; ang “sa balat” ang pinakanatural na Filipino sa paglalarawan ng pagkalat ng sugat o kondisyon.
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: ipahahayag ng pari na marumi siya
  rationale: Nagbibigay ang pari ng opisyal na pasya tungkol sa ritwal na karumihan; hindi niya sanhi ang pagiging marumi ng tao.
- source_word: נֶגַע
  choice: sugat
  rationale: Sa Levitico 13, tumutukoy ito sa nakikitang pinsala, marka, o apektadong bahagi. Ang “sugat” ay malinaw sa karaniwang Filipino nang hindi nagpapanggap na eksaktong modernong diagnosis.
- source_word: צָרַעַת
  choice: malubhang sakit sa balat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa modernong ketong o Hansen’s disease. Nililinaw ng “malubhang sakit sa balat” ang konteksto habang iniiwasan ang maling medikal na pagtutumbas.
- source_word: הִוא
  choice: iyon ay
  rationale: Tinutukoy ng panghalip ang kondisyong inilalarawan sa naunang sugnay.
theological_decisions:
- issue: Pagsasalin ng צָרַעַת sa mga kautusan tungkol sa ritwal na kalinisan
  choice: malubhang sakit sa balat
  alternative: ketong
  rationale: Hindi tiyak na katumbas ng צָרַעַת ang modernong Hansen’s disease, at mas malawak ang gamit nito sa Levitico. Pinananatili sa talababa ang tradisyonal na saling “ketong” nang hindi ito ginagawang tiyak na medikal na diagnosis.
- issue: Kahulugan ng pagpapahayag na marumi
  choice: opisyal na pasya ng pari tungkol sa ritwal na kalagayan
  alternative: ginagawang marumi ng pari ang tao
  rationale: Sa konteksto, sinusuri at ipinahahayag ng pari ang kalagayan; hindi ipinahihiwatig na siya ang sanhi ng karumihan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “pari,” “susuriin,” at “ipahahayag” para sa malinaw na wikang legal-ritwal. Iniwasan ang masyadong teknikal na katawagang medikal at ang anachronistic na pagtutumbas sa Hansen’s disease.
