  to: At susuriin siya ng pari sa ikapitong araw. Kung kumalat nga ito sa balat, ipahahayag ng pari na marumi siya; ito ay isang karamdaman sa balat.[a]
  rationale: Inalis ang di-tiyak na “malubhang” at pinalitan ang hindi likas na “sugat ng malubhang sakit sa balat” ng “karamdaman sa balat,” na mas malinaw sa modernong Filipino at umiiwas sa maling modernong medikal na pagtutumbas. Pinanatili ang diin sa pagkalat sa pamamagitan ng “nga.”
