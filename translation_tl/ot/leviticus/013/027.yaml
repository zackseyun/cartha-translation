  - severity: low
    issue: Medyo matigas ang “Kung talagang kumalat iyon.”
    rationale: Naipapahayag nito ang diin ng infinitive absolute, ngunit mas natural ang “Kung kumalat nga ito,” habang pinananatili ang pagbibigay-diin.
