  naturalness: Likas ang karamihan ng pangungusap. Mas malinaw at mas natural ang “Kung kumalat nga ito sa balat” kaysa “Kung talagang kumalat iyon sa balat.” Ang pangwakas na “ito ay isang karamdaman sa balat” ay mas idiomatiko kaysa “iyon ay sugat ng malubhang sakit sa balat.”
  terminology: Ang “pari,” “susuriin,” at “ipahahayag ... na marumi siya” ay angkop sa kontekstong legal-ritwal. Pinananatili ang “karamdaman sa balat” bilang di-anachronistic na salin ng צָרַעַת; ipinaliliwanag ng talababa ang tradisyonal na “ketong” nang hindi ito itinutumbas sa Hansen's disease.
