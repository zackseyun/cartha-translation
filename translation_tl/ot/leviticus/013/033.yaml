base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/033.yaml
  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: tl
  text: Pagkatapos, mag-ahit siya[a], ngunit huwag niyang ahitin ang bahaging apektado[b]. Ihihiwalay muli ng pari ang bahaging apektado sa loob ng pitong araw, sa ikalawang pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpaahit siya.” Ipinahihiwatig ng anyong Hebreo na siya mismo ang mag-aahit o magpapaaahit.
    reason: lexical_alternative
  - marker: b
    text: Ang terminong Hebreo ay tumutukoy sa isang natatanging karamdaman sa anit o balbas, na malamang ay may kaliskis at pagkalagas ng buhok. Tuwirang sinasabi ng Hebreo na hindi aahitan ang apektadong bahagi; malamang na iniiwang hindi ahit ang mismong bahaging iyon upang malinaw itong masuri ng pari matapos ahitan ang buhok sa paligid.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: magpapahit siya
  rationale: Ang Hitpael ng גלח ay reflexive at maaaring mangahulugang siya mismo ang mag-aahit o magpapahit sa iba. Ang “magpapahit siya” ay natural sa makabagong Filipino at hindi nagpapasya kung sino mismo ang gagawa ng pag-ahit.
- source_word: הַנֶּתֶק
  choice: ang bahaging apektado
  rationale: Ang נֶתֶק ay isang tiyak na karamdaman sa anit o balbas na kaugnay ng pagkalagas ng buhok at maaaring may pangangaliskis. Iniiwasan ng saling ito ang maling pakahulugang karaniwang pangangati, habang ang talababa ang naglilinaw sa natatanging termino.
- source_word: לֹא יְגַלֵּחַ
  choice: hindi niya pahihitan
  rationale: Ang negatibong imperfect sa legal na tagubilin ay isang pagbabawal. Ang pandiwang “pahihitan” ay kaayon ng naunang “magpapahit” at malinaw na tumutukoy sa bahaging hindi dapat ahitan.
- source_word: וְאֶת הַנֶּתֶק לֹא יְגַלֵּחַ
  choice: ngunit hindi niya pahihitan ang bahaging apektado
  rationale: 'Pinananatili nito ang tuwirang bagay ng Hebreo: ang mismong apektadong bahagi ang hindi aahitan. Hindi inilalagay sa pangunahing teksto ang interpretasyong sa palibot lamang mag-aahit.'
- source_word: וְהִסְגִּיר
  choice: Ibubukod
  rationale: Sa konteksto ng Levitico 13, tumutukoy ito sa pansamantalang pagbubukod para sa pagmamasid. Ang “ibubukod” ay malinaw at hindi labis na naglalapat ng makabagong terminong medikal.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin sa Filipino ng כהן sa mga batas ng Levitico.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural at tumpak na pagpapahayag ng itinakdang tagal.
- source_word: שֵׁנִית
  choice: muli
  rationale: Ipinahihiwatig na ito ang ikalawang yugto ng pitong-araw na pagbubukod; natural itong sabihin bilang “muli” sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal at ritwal. Pinili ang “magpapahit” upang mapanatili ang reflexive/causative na puwang ng Hebreo, at “bahaging apektado” upang hindi mapagkamalang karaniwang pangangati ang teknikal na kondisyon. Ang mga marker na [a] at [b] ay kapuwa nasa pangunahing teksto.
