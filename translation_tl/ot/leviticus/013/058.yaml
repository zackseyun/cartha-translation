  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: tl
  text: Ngunit ang kasuotan, ang mga sinulid na pahaba, ang mga sinulid na pahalang, o anumang kagamitang yari sa balat na nilabhan mo at nawala mula sa mga iyon ang salot ay dapat labhan muli, at magiging malinis iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: ang kasuotan
  rationale: Ang בגד ay pangkalahatang tawag sa kasuotan o piraso ng telang ginagamit bilang damit. Likas at marangal sa modernong Filipino ang “kasuotan.”
- source_word: הַשְּׁתִי
  choice: ang mga hiblang pahaba
  rationale: Tumutukoy ito sa mga sinulid na nakahanay nang pahaba sa paghahabi. Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na hiram na termino.
- source_word: הָעֵרֶב
  choice: ang mga hiblang pahalang[a]
  rationale: Kapares ito ng שׁתי at tumutukoy sa mga sinulid na ipinapadaan nang pahalang sa hinahabi. Ipinaliliwanag ng talababa ang teknikal na kahulugan.
- source_word: כָל כְּלִי הָעוֹר
  choice: anumang kagamitang yari sa balat
  rationale: Malawak ang saklaw ng כְּלִי—bagay, kasangkapan, o kagamitan—kaya hindi ito nilimitahan sa sisidlan. Ang עוֹר ay balat na ginagamit bilang materyal, samakatuwid ay leather.
- source_word: תְּכַבֵּס
  choice: nilabhan mo
  rationale: Ang Piel ng כבס ay paghuhugas o paglalaba ng tela at katulad na bagay. Pinanatili ang ikalawang panauhang isahan ng pandiwa.
- source_word: הַנָּגַע
  choice: salot
  rationale: Ang נגע ay tumutukoy sa nakikitang pinsala o kontaminasyong sinusuri sa Levitico 13. Iniiwasan ng “salot” ang pagpapalagay na isa itong tiyak na sakit o modernong uri ng amag.
- source_word: וְסָר מֵהֶם
  choice: at naalisan ng salot
  rationale: Pinananatili ang ugnayang may “at” sa Hebreo habang likas na ipinahahayag sa Filipino na nawala ang salot mula sa mga bagay. Hindi tahasang dinaragdagan ng “kung” ang pangungusap.
- source_word: וְכֻבַּס שֵׁנִית
  choice: ay dapat labhang muli
  rationale: Ang pasibong anyo at שֵׁנִית ay nagbibigay ng panutong ulitin ang paglalaba. Ipinahahayag ng “dapat” ang procedural na puwersa nang natural sa Filipino.
- source_word: וְטָהֵר
  choice: sa gayon, magiging malinis iyon
  rationale: Sa kontekstong ito, ang טהר ay ritwal na pagiging malinis. Nilinaw ng “iyon” na ang bagay ang magiging malinis, hindi ang taong naglalaba.
theological_decisions:
- issue: Kahulugan ng ritwal na kalinisan
  choice: “magiging malinis” nang hindi dinaragdagan ng paliwanag sa pangunahing teksto
  alternative: “magiging malinis ayon sa ritwal”
  rationale: Malinaw sa konteksto ng Levitico na ritwal ang usapin, ngunit ang Hebreo ay payak na nagsasabing טהר. Hindi kailangang magdagdag ng pariralang wala sa teksto.
- issue: Pagkakaugnay ng pag-alis ng salot at muling paglalaba
  choice: Pinanatili ang koordinasyong “at” sa “nilabhan mo at naalisan,” hindi ginawang tahasang kondisyon
  alternative: “kung maalis ang salot”
  rationale: Ang Hebreo ay gumagamit ng וְסָר sa loob ng sugnay na may אֲשֶׁר. Maaaring ipahiwatig ng konteksto ang kondisyong lohika, ngunit hindi ito tahasang minarkahan ng אִם; kaya pinanatili ang bahagyang kalabuan.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang paliwanag na “mga hiblang pahaba/pahalang” sa halip na mga teknikal na terminong hindi pamilyar sa maraming mambabasa. Ang “balat” ay pinanatili bilang materyal, gaya ng Hebreo, sa halip na gumamit ng mas makitid na katawagang maaaring magpahiwatig ng partikular na uri ng produktong leather.
