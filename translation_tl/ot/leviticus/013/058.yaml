    rationale: Ang וְסָר מֵהֶם הַנָּגַע ay nagsasaad na ang salot ay nawala mula sa mga bagay. Mas malinaw na panatilihin ang salot bilang paksa nang hindi ginagawang tahasang kondisyon ang ugnayan.
