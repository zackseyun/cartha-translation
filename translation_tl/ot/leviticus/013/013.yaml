base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: tl
  text: Susuriin siya ng pari, at kung makita niyang natakpan na ng sakit sa balat[a] ang buo niyang katawan, ipahahayag niyang malinis ang taong may sakit[b]. Pumuti na ang buong katawan niya; malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na צָרַעַת, na tradisyonal na isinasaling “ketong,” ay tumutukoy sa iba’t ibang sakit o kondisyon sa balat at hindi kinakailangang sa makabagong sakit na Hansen.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang tuwirang layon ay literal na “ang marka” o “ang apektadong kondisyon,” ngunit ang pasiya tungkol sa pagiging malinis ay nalalapat sa taong may sakit.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: Susuriin
  rationale: Sa konteksto ng batas tungkol sa karumihang ritwal, ang literal na “makikita” ay tumutukoy sa maingat na pagsusuri ng pari.
- source_word: הַצָּרַעַת
  choice: sakit sa balat
  rationale: Ang צָרַעַת ay mas malawak kaysa sa makabagong sakit na ketong o Hansen’s disease; iniiwasan ng saling ito ang maling medikal na pagtutumbas.
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: ang buo niyang katawan
  rationale: Bagaman literal na “lahat ng laman niya,” katawan ang likas at malinaw na Filipino para sa kabuuang panlabas na bahagi ng taong sinusuri.
- source_word: וְטִהַר
  choice: ipahahayag ... na malinis
  rationale: Ang piel ng טהר dito ay isang hatol ng pari tungkol sa kalagayang ritwal, hindi paggamot o aktuwal na paglilinis.
- source_word: אֶת הַנָּגַע
  choice: ang taong apektado
  rationale: Literal na tumutukoy ang parirala sa pinsala o apektadong bahagi, ngunit ang kasunod na “malinis siya” ay nagpapakitang ang hatol ay nalalapat sa taong may kondisyon.
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: Pumuti na ang buong katawan niya
  rationale: Ipinahahayag ang ganap na pagputi na batayan ng hatol; inuugnay ito sa katawan ayon sa agarang konteksto.
- source_word: טָהוֹר הוּא
  choice: malinis siya
  rationale: Pinananatili ang karaniwang terminong “malinis” para sa ritwal na kalagayan sa Levitico nang hindi idinaragdag sa pangunahing teksto ang paliwanag na “ayon sa ritwal.”
theological_decisions:
- issue: Kahulugan ng צָרַעַת sa mga batas ng Levitico
  choice: sakit sa balat
  alternative: ketong; nakapagpaparuming sakit sa balat; tsaraat
  rationale: Hindi dapat ipantay nang walang batayan ang sinaunang kategoryang Hebreo sa modernong Hansen’s disease. Ang “sakit sa balat” ay malinaw ngunit hindi labis na tiyak.
- issue: Papel ng pari sa וְטִהַר
  choice: ipahahayag ... na malinis
  alternative: lilinisin; ituturing na malinis ang apektadong bahagi
  rationale: Nagbibigay ang pari ng pasiya tungkol sa kalinisan; hindi niya pinagagaling o nililinis sa pamamagitan ng paggamot ang tao.
- issue: Tinutukoy ng tuwirang layon na הַנָּגַע
  choice: ang taong apektado
  alternative: ang pinsala; ang apektadong bahagi
  rationale: Pinili ang likas na Filipino na nagpapalinaw kung kanino nalalapat ang pasiya, habang inilalahad sa talababa ang mas literal at hindi ganap na tiyak na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari,” “malinis,” at “sakit sa balat” bilang madaling maunawaang mga termino; iniwasan ang arkaikong pananalita at ang maling medikal na katiyakan.
