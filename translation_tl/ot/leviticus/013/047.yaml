  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: tl
  text: Kung may bahid ng ketong[a] sa isang kasuotan—kasuotang lana man o kasuotang lino,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: tsaraat. Tradisyonal itong isinasaling “ketong,” ngunit mas malawak ang tinutukoy nito rito: iba’t ibang kalagayang may karamdaman o kontaminasyon, kabilang ang mga nasa kasuotan, at hindi lamang ang sakit na Hansen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: isang kasuotan
  rationale: Ang בגד ay kasuotan o damit. Ginamit ang di-tiyak na “isang” dahil naglalahad ang talata ng pangkalahatang kasong legal.
- source_word: כִּי יִהְיֶה בוֹ
  choice: kung may ... sa
  rationale: Ang כִּי na may imperfect sa batas na ito ay nagpapakilala ng isang posibleng kaso. Likas sa Tagalog ang “kung may,” at pinananatili ng “sa” ang lokatibong diwa ng בוֹ.
- source_word: נֶגַע
  choice: salot
  rationale: Sa Levitico 13, ang נגע ay isang nakikitang apektadong kalagayan o marka na kailangang siyasatin. Ang “salot” ay marangal at tradisyonal na katawagan, bagaman nililinaw ng talababa na hindi ito limitado sa sakit ng tao.
- source_word: צָרָעַת
  choice: ketong
  rationale: Pinanatili ang kinikilalang tradisyonal na salin, ngunit ipinaliliwanag sa talababa na mas malawak ang saklaw ng Hebrew na tsaraat kaysa sa makabagong Hansen’s disease.
- source_word: בְּבֶגֶד צֶמֶר
  choice: sa kasuotang lana
  rationale: Tinutukoy ng parirala ang kasuotang yari sa lana. Pinananatili ng “sa” ang pang-ukol na ב.
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: o sa kasuotang lino
  rationale: Ang פשתים ay lino bilang telang mula sa flax. Ang “kasuotang lino” ang natural na tawag sa yari nang tela, at inuulit ang “sa” ayon sa Hebrew.
theological_decisions:
- issue: Saklaw ng צָרָעַת
  choice: ketong na may paliwanag sa talababa
  alternative: Hansen’s disease
  rationale: Ang tsaraat sa kabanatang ito ay kategorya ng karumihang maaaring makita sa tao, kasuotan, at bahay; hindi ito dapat ipakahulugang tiyak na makabagong Hansen’s disease.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong legal at ang pag-uulit ng lokatibong “sa ... o sa ...” mula sa Hebrew; ang kuwit sa hulihan ay nagpapakitang nagpapatuloy ang pangungusap sa susunod na talata.
