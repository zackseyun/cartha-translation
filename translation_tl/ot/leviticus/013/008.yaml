base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: tl
  text: Susuriin siya ng pari, at kung makita ng pari na kumalat sa balat ang makaliskis na pamamantal, ipahahayag ng pari na marumi siya; iyon ay sakit sa balat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo, tsaraʿat, na tradisyonal na isinasaling “ketong.” Sa Levitico, malamang na mas malawak ang saklaw ng terminong ito at tumutukoy sa iba’t ibang kondisyon sa balat, hindi lamang sa sakit na kilala ngayon bilang ketong o sakit na Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Susuriin
  rationale: Sa konteksto ng pormal na pagsusuri ng pari, higit sa simpleng pagtingin ang ipinahihiwatig ng pandiwa.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang tawag sa awtorisadong tagasuri at tagapagpahayag ng kalagayang ritwal sa Levitico.
- source_word: וְהִנֵּה
  choice: at kung makitang
  rationale: Pinananatili ang diwa ng natuklasan sa pagsusuri at ang kondisyunal na takbo ng tagubilin, nang hindi gumagamit ng di-likas na literal na 'narito.'
- source_word: פָּשְׂתָה
  choice: kumalat
  rationale: Tuwirang ipinahahayag ang paglawak ng kondisyon, na mahalagang batayan ng pagsusuri sa kabanata.
- source_word: הַמִּסְפַּחַת
  choice: ang makaliskis na pamamantal
  rationale: Inilalarawan ang panlabas na sakit o pagputok sa balat nang hindi ito nililimitahan sa karaniwang galis o langib.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Natural at tuwirang salin ng lokasyon ng kondisyon.
- source_word: וְטִמְּאוֹ
  choice: ipahahayag ng pari na marumi siya
  rationale: Ipinakikitang kinikilala at opisyal na ipinahahayag ng pari ang ritwal na kalagayan; hindi ang pari ang sanhi ng karumihan.
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Iniiwasang ipantay agad ang mas malawak na terminong Hebreo sa modernong ketong o Hansen's disease; nililinaw ng talababa ang tradisyonal at mas malawak na saklaw nito.
- source_word: הִוא
  choice: iyon ay
  rationale: Tumutukoy pabalik sa kondisyong nasuri at bumubuo ng pangungusap na nagpapakilala rito.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת sa mga kautusan tungkol sa ritwal na kalinisan
  choice: sakit sa balat
  alternative: ketong; sakit sa balat na nakapagpaparumi; tsaraat
  rationale: Hindi tiyak na katumbas ng צָרַעַת ang modernong Hansen's disease. Pinananatili ng salin ang malawak na kategoryang inilalarawan ng teksto at ang konteksto ng ritwal na pagsusuri, habang inilalahad sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'susuriin' at 'ipahahayag' upang mapanatili ang pormal na tungkulin ng pari, at inilagay ang talababa pagkatapos ng 'sakit sa balat,' na siyang salitang nililinaw nito.
