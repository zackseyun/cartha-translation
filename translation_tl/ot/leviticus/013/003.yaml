revisions:
- from: Susuriin ng pari ang apektadong bahagi sa balat ng katawan. Kung ang balahibo sa bahaging iyon ay namuti at ang bahaging iyon ay mukhang mas malalim kaysa sa balat ng katawan, iyon ay isang sugat na dulot ng sakit sa balat.[a] Pagkasuri ng pari sa tao, ipahahayag niyang marumi ito.
  to: Susuriin ng pari ang apektadong bahagi sa balat ng katawan.[a] Kung ang buhok sa sugat ay namuti at ang hitsura ng sugat ay tila mas malalim kaysa sa balat ng kanyang katawan, ito ay sugat ng sakit sa balat. Kapag nasuri na ng pari ang taong iyon, ipahahayag niyang marumi ang taong iyon.
  rationale: Inalis ang di-sinusuportahang sanhi na “dulot ng,” ginawang malinaw na ang pangwakas na hatol ay ukol sa taong sinusuri, at pinasimple ang terminong para sa שֵׂעָר. Napanatili ang maingat na pagsasalin ng צָרַעַת bilang “sakit sa balat” at ang tradisyonal na alternatibo sa talababa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:14:18Z'
review_pass:
  verdict: revise
  source_fidelity: Ang “sugat na dulot ng sakit sa balat” ay nagdaragdag ng ugnayang sanhi na wala sa Hebreo. Ang נֶגַע צָרַעַת ay isang pagtukoy/pag-uuri sa sugat, hindi pahayag na ang sugat ay 'dulot' ng isang sakit. Ang pangwakas na panghalip na “ito” ay maaari ring maling tumukoy sa sugat, samantalang ang hatol ay para sa taong sinusuri.
  naturalness: Malinaw at modernong Tagalog ang pangkalahatang daloy. Mas tiyak at natural sa kontekstong ito ang “buhok sa sugat” kaysa “balahibo sa bahaging iyon,” at ang hayag na “taong iyon” sa huling sugnay ay nag-aalis ng kalabuan.
  terminology: Ang “sakit sa balat” at ang talababa tungkol sa tradisyonal na “ketong” ay angkop, sapagkat hindi nito itinutumbas ang צָרַעַת sa modernong Hansen’s disease. Pinananatili ang “marumi” bilang ritwal na hatol sa pamamagitan ng pandiwang “ipahahayag.”
  issues:
  - severity: medium
    issue: Ang “dulot ng” ay hindi sinusuportahan ng נֶגַע צָרַעַת.
    rationale: Inilalahad ng Hebreo ang sugat bilang sugat ng/na may צָרַעַת, hindi bilang sugat na sanhi ng isang sakit.
  - severity: medium
    issue: Malabo ang “ipahahayag niyang marumi ito.”
    rationale: Ang “ito” ay maaaring tumukoy sa sugat, ngunit ang אֹתוֹ sa kontekstong ito ay ang taong sinusuri at ipinahahayag na marumi.
  - severity: low
    issue: Hindi gaanong tiyak ang “balahibo” para sa שֵׂעָר sa sugat.
    rationale: Ang “buhok” ay karaniwang natural na termino para sa hiblang tumutubo sa balat ng tao, kabilang ang nasa apektadong bahagi.
  revised_text: Susuriin ng pari ang apektadong bahagi sa balat ng katawan.[a] Kung ang buhok sa sugat ay namuti at ang hitsura ng sugat ay tila mas malalim kaysa sa balat ng kanyang katawan, ito ay sugat ng sakit sa balat. Kapag nasuri na ng pari ang taong iyon, ipahahayag niyang marumi ang taong iyon.
  revised_footnotes:
  - marker: a
    text: Tradisyonal na isinasalin ang terminong Hebreo bilang “ketong” o “sugat ng ketong.” Mas malawak ang saklaw ng צָרַעַת kaysa sa modernong ketong o Hansen’s disease.
    reason: lexical_alternative
  revision_rationale: Inalis ang di-sinusuportahang sanhi na “dulot ng,” ginawang malinaw na ang pangwakas na hatol ay ukol sa taong sinusuri, at pinasimple ang terminong para sa שֵׂעָר. Napanatili ang maingat na pagsasalin ng צָרַעַת bilang “sakit sa balat” at ang tradisyonal na alternatibo sa talababa.
