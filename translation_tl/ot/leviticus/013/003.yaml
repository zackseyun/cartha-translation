  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: tl
  text: Susuriin ng pari ang apektadong bahagi sa balat ng katawan.[a] Kung ang buhok sa sugat ay namuti at ang hitsura ng sugat ay tila mas malalim kaysa sa balat ng kanyang katawan, ito ay sugat ng sakit sa balat. Kapag nasuri na ng pari ang taong iyon, ipahahayag niyang marumi ang taong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin ang terminong Hebreo bilang “ketong” o “sugat ng ketong.” Mas malawak ang saklaw ng צָרַעַת kaysa sa modernong ketong o Hansen’s disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: apektadong bahagi / sugat
  rationale: Sa konteksto ng pagsusuri, tumutukoy ito sa nakikitang apektadong bahagi o sugat sa balat. Ginamit ang “apektadong bahagi” sa unang banggit upang maging natural, at “sugat” sa pag-uuri nito.
- source_word: בְּעוֹר הַבָּשָׂר
  choice: sa balat ng katawan
  rationale: Pinananatili nito ang anatomikal na diwa ng עוֹר at בָּשָׂר sa natural na modernong Tagalog.
- source_word: שֵׂעָר
  choice: balahibo
  rationale: Sa konteksto ng balat ng katawan, mas angkop ang “balahibo” kaysa “buhok,” na karaniwang tumutukoy sa buhok sa ulo.
- source_word: הָפַךְ לָבָן
  choice: ay namuti
  rationale: Likas na ipinahahayag sa Tagalog ang pagbabagong nagbunga ng nakikitang puting kulay.
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: ang bahaging iyon ay mukhang mas malalim kaysa sa balat ng katawan
  rationale: Ang “mukhang” ay nagpapanatili sa obserbasyonal na diwa ng מַרְאֵה at hindi nagsasabing tiyak na pisikal na lalim ang tinutukoy.
- source_word: נֶגַע צָרַעַת
  choice: isang sugat na dulot ng sakit sa balat
  rationale: Iniiwasan nito ang maling pagtutumbas sa modernong ketong o Hansen’s disease, habang pinananatili ang sinaunang kategoryang sinusuri sa batas ng ritwal na kalinisan.
- source_word: וְטִמֵּא אֹתוֹ
  choice: ipahahayag niyang marumi ito
  rationale: Ipinakikita ng “ipahahayag” na ang pari ay nagbibigay ng opisyal na hatol sa katayuang ritwal, hindi siyang sanhi ng karumihan.
theological_decisions:
- issue: Kahulugan ng צָרַעַת sa batas tungkol sa ritwal na kalinisan
  choice: sakit sa balat
  alternative: ketong
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa modernong Hansen’s disease. Ang “sakit sa balat” ay umiiwas sa anakronistikong medikal na diagnosis; ang tradisyonal na “ketong” ay inilagay sa talababa.
- issue: Lakas ng kilos ng pari sa וְטִמֵּא אֹתוֹ
  choice: ipahahayag niyang marumi ito
  alternative: gagawin niya itong marumi
  rationale: Ang pari ay nagsusuri at nagpapahayag ng katayuang ritwal; hindi ipinahihiwatig ng teksto na siya mismo ang lumilikha ng karumihan.
- issue: Referent ng hulaping panghalip sa וְרָאָהוּ at אֹתוֹ
  choice: ang tao / ito
  alternative: ang sugat / iyon
  rationale: Sa konteksto, ang taong sinusuri ang tumatanggap ng hatol na marumi. Ginawang hayag ang “tao” sa sugnay ng pagsusuri upang maiwasan ang kalituhan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pari,” “balat ng katawan,” at “ipahahayag na marumi” upang mapanatili ang legal at ritwal na konteksto nang hindi nagiging lipas o sobrang teknikal.
