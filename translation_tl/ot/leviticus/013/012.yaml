  rationale: Inayos ang pandiwa upang malinaw na ang sakit ang tumatakip sa balat, pinakinis ang ayos ng pangungusap sa modernong Filipino, at ginawang mas maingat ang paglalarawan sa terminong Hebreo sa talababa. Pinanatili ang kondisyunal na anyo, ang panlalaking sanggunian na likas sa konteksto, ang saklaw na mula ulo hanggang paa, at ang nakabiting kuwit dahil nagpapatuloy ang pangungusap sa kasunod na talata.
