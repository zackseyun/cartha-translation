base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: tl
  text: At kung ang sakit sa balat[a] ay kumalat nang lubusan at tinakpan nito ang buong balat ng taong apektado, mula ulo hanggang paa, sa abot ng nakikita ng pari[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na צָרַעַת (tsaraat) ay tumutukoy sa iba’t ibang affliction sa balat na may kaugnayan sa ritwal sa Levitico; hindi ito dapat itumbas nang makitid sa Hansen’s disease lamang, na karaniwang tinatawag na ketong.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “ang buong balat ng apektadong bahagi” o “ang buong balat ng karamdaman.” Tinutukoy ng pananalitang Hebreo ang balat ng taong naapektuhan ng pagkalat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: lubusang kumalat
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapatingkad sa lawak o tindi ng pagkalat. Natural sa Tagalog ang “lubusang kumalat” at hindi nito ipinapalagay ang isang tiyak na modernong pagsusuring medikal.
- source_word: הַצָּרַעַת
  choice: ang sakit sa balat
  rationale: Ang צָרַעַת sa Levitico ay tumutukoy sa iba’t ibang uri ng ritwal na karamdaman o pinsala at hindi dapat ipantay nang makitid sa Hansen’s disease. Malinaw at madaling maunawaan ang “sakit sa balat.”
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Tinutukoy ng בּ ang ibabaw o bahagi ng katawan na kinalatan ng sakit; ang “sa balat” ang pinakanatural na katumbas sa modernong Tagalog.
- source_word: וְכִסְּתָה
  choice: at natakpan nito
  rationale: Ipinahihiwatig ng pandiwa na nasaklaw ng sakit ang balat. Ginamit ang aspektong naganap na “natakpan” upang ilarawan ang kalagayang susuriin ng pari sa kondisyong ito.
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: ang buong balat ng taong apektado
  rationale: Literal itong “ang buong balat ng salot/pinsala,” ngunit maaaring maging malabo sa Tagalog. Ipinahahayag ng salin na ang tinutukoy ay ang balat ng taong apektado, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: mula ulo hanggang paa
  rationale: Ito ay merismo para sa buong lawak ng katawan. Natural at sapat na literal ang karaniwang pariralang Tagalog.
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: sa abot ng nakikita ng pari
  rationale: Idyoma itong tumutukoy sa buong lawak na nakikita ng pari sa pagsusuri; malinaw at natural ang napiling salin.
