translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong kondisyunal at ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata. Ginamit ang “pari,” ang karaniwang salin ng כֹּהֵן sa kontekstong Levitico.
