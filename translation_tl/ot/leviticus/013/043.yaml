base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: tl
  text: At susuriin siya ng pari, at makikita niyang ang umbok ng sugat ay maputi-mapula sa kalbong bahagi sa likod ng kanyang ulo o sa kalbong bahagi sa unahan ng kanyang ulo[b], gaya ng anyo ng isang sakit sa balat ng katawan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na צָרַעַת (tsara‘at), na tradisyonal na isinasaling “ketong,” ay tumutukoy sa Levitico sa mas malawak na hanay ng mga kondisyon sa balat, hindi lamang sa Hansen’s disease.
    reason: lexical_alternative
  - marker: b
    text: Malamang na pinag-iiba ng dalawang salitang Hebreo ang pagkakalbo sa likod ng ulo at ang pagkakalbo sa unahan ng ulo; isinalin dito sa paraang ito upang mapanatili ang pagkakaiba.
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה
  choice: susuriin
  rationale: Sa konteksto ng pagsusuri ng pari sa Levitico 13, ang literal na “makikita” ay may diwang masusing pagtingin o pagsusuri.
- source_word: הַכֹּהֵן
  choice: pari
  rationale: Karaniwang tawag sa paring nangangasiwa sa pagsusuring itinakda sa kabanatang ito.
- source_word: וְהִנֵּה
  choice: kung
  rationale: Sa kasalukuyang pangungusap na legal at pansuri, likas na ipinapahayag ng “kung” ang natuklasang kalagayan; hindi kailangang piliting isalin ang Hebreong pantawag-pansin bilang “narito.”
- source_word: שְׂאֵת הַנֶּגַע
  choice: nakaumbok na bahagi ng sakit
  rationale: Pinananatili ang diwa ng isang nakaangat o namamagang sugat habang malinaw na inuugnay ito sa kondisyong sinusuri.
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: maputi-mapula
  rationale: Pinananatili ang dalawang sangkap ng kulay at ang diwa ng mga bahagyang kulay sa natural na anyong Filipino.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: sa kalbo niyang batok o sa kalbo niyang noo
  rationale: Ipinakikita ang malamang na pagkakaiba ng pagkakalbo sa likod at sa harap ng ulo, habang nananatiling madaling maunawaan.
- source_word: כְּמַרְאֵה
  choice: gaya ng anyo
  rationale: Pinananatili ang paghahambing batay sa nakikitang anyo.
- source_word: צָרַעַת
  choice: malubhang sakit sa balat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa Hansen’s disease lamang; ang salin ay umiiwas sa mapanlinlang na tiyak na diagnosis.
- source_word: עוֹר בָּשָׂר
  choice: balat ng katawan
  rationale: Natural na Filipino na pinananatili ang parehong sangkap na balat at laman/katawan.
