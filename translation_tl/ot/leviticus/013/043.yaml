  to: At susuriin siya ng pari, at makikita niyang ang umbok ng sugat ay maputi-mapula sa kalbong bahagi sa likod ng kanyang ulo o sa kalbong bahagi sa unahan ng kanyang ulo[b], gaya ng anyo ng isang sakit sa balat ng katawan[a],
  rationale: Inayos ang deiktikong obserbasyon ng pari nang hindi ginagawang kondisyunal ang pangungusap, pinalitan ang di-likas na parirala para sa lesion, inalis ang hindi ipinahihiwatig na “malubhang,” at ginawang mas tumpak ang lokasyon ng pagkakalbo. Napanatili ang mga talababa at ang pangwakas na kuwit, sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
