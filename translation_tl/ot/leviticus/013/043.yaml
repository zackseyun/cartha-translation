    rationale: Walang pang-uri sa צָרַעַת na nagsasabing malubha sa talatang ito; dapat iwasan ang pagdaragdag ng antas ng tindi.
  - severity: low
    issue: Ang “batok” ay hindi katumbas ng likod na bahagi ng ulo.
    rationale: Ang batok ay nape ng leeg; ang pagkakaibang ipinahihiwatig ng mga termino ay malamang likod laban sa unahang bahagi ng ulo.
