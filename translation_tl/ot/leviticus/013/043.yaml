  naturalness: Ang “nakaumbok na bahagi ng sakit” ay hindi gaanong likas sa modernong Tagalog. Mas malinaw at natural ang “umbok ng sugat.” Ang binagong mga parirala para sa dalawang uri ng pagkakalbo ay malinaw na nakapook sa ulo.
  terminology: Pinananatili ang “pari,” “maputi-mapula,” at ang di-tiyak na “sakit sa balat.” Iniiwasan ang “ketong” bilang pangunahing teksto at ang walang batayang dagdag na “malubhang.”
