  text: When a man or a woman has an infection on the head or on the beard[b][a],
translation:
  language: tl
  text: Kapag ang isang lalaki o babae ay magkaroon ng sugat[a] sa ulo[b] o sa balbas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinsala,” “karamdaman,” o “marka.” Malawak ang kahulugan ng salitang Hebreo na negaʿ sa Levitico at tumutukoy sa nakikitang sugat o pantal na sinusuri ng pari.
    reason: lexical_alternative
