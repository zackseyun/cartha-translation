lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: isang lalaki o babae
  rationale: Malinaw na binabanggit ng Hebreo ang lalaki at babae; pinananatili ito sa natural na Tagalog sa halip na gawing pangkalahatang “tao.”
- source_word: כִּי
  choice: Kapag
  rationale: Naghaharap ito ng isang kondisyong kaso sa batas; natural sa Tagalog ang “kapag” habang nananatili ang diwang kondisyonal.
- source_word: יִהְיֶה בּוֹ
  choice: nagkaroon ng
  rationale: Ang literal na diwa ay may bagay na nasa kaniya; ang “nagkaroon ng” ay malinaw at likas sa konteksto ng pagsusuri sa karamdaman.
- source_word: נָגַע
  choice: sugat
  rationale: Malawak ang saklaw ng נגע sa Levitico para sa nakikitang pinsala, marka, o paglitaw na sinusuri ng pari. Ang “sugat” ay madaling maunawaan at hindi nagtatakda ng tiyak na makabagong diyagnosis.
- source_word: בְּ/רֹאשׁ
  choice: sa ulo
  rationale: Pinananatili ang mas malawak na kahulugan ng רֹאשׁ, bagaman maaaring anit ang partikular na tinutukoy sa konteksto.
- source_word: בְ/זָקָן
  choice: sa balbas
  rationale: Tuwirang katumbas ng זָקָן ang “balbas,” at natural ang pariralang “sa balbas” para sa bahaging apektado.
