  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: tl
  text: Kapag ang isang tao ay nagkaroon sa balat ng kanyang katawan ng pamamaga, langib, o maputlang batik, at iyon ay naging sugat ng sakit sa balat[a], dadalhin siya kay Aaron na pari o sa isa sa kanyang mga anak na pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin na “sugat ng ketong” o “karamdaman ng ketong.” Ang Hebreong צָרָעַת (tsaraat) ay tumutukoy sa mas malawak na uri ng kondisyon sa balat at hindi dapat awtomatikong itumbas sa modernong Hansen's disease.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: isang tao
  rationale: Genericong indibidwal ang tinutukoy sa kasong legal; likas at inklusibo sa modernong Tagalog ang “isang tao,” nang hindi binabago ang bilang.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: sa balat ng kanyang katawan
  rationale: Pinananatili ang kongkretong anatomikal na parirala at ang pag-uulit nito, sa natural na anyong Tagalog.
- source_word: שְׂאֵת
  choice: pamamaga
  rationale: Tumutukoy sa nakaumbok o nakaangat na bahagi ng balat; malinaw at karaniwang salita ang “pamamaga.”
- source_word: סַפַּחַת
  choice: langib
  rationale: Hindi tiyak ang eksaktong uri ng sugat, ngunit ang “langib” ay kongkreto at tumutugma sa tradisyonal na pagkaunawa nang hindi labis na nagdadagdag ng diagnosis.
- source_word: בַּהֶרֶת
  choice: maputing batik
  rationale: Ipinahihiwatig ng salita ang maliwanag o maputlang marka; natural sa Tagalog ang “maputing batik” at hindi ito masyadong espesipikong medikal.
- source_word: לְנֶגַע צָרָעַת
  choice: sugat ng sakit sa balat
  rationale: Ang נֶגַע ay isang apektadong sugat o bahagi, samantalang ang צָרָעַת ay mas malawak na kategoryang biblikal at hindi awtomatikong ketong na Hansen's disease.
- source_word: וְהוּבָא
  choice: dadalhin siya
  rationale: Pinananatili ang pasibong diwa at ang obligadong hakbang sa legal na tagubilin sa natural na Tagalog.
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: Aaron na pari
  rationale: Direktang salin ng pangalan at tungkulin sa karaniwang ayos ng Tagalog.
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: isa sa kanyang mga anak na pari
  rationale: Pinananatili kapwa ang ugnayang pampamilya at ang katungkulan ng mga anak ni Aaron.
theological_decisions:
- issue: Pagpapakahulugan sa צָרָעַת
  choice: sakit sa balat
  alternative: ketong; karamdaman ng ketong; tsaraat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa modernong Hansen's disease. Iniiwasan ng pangunahing teksto ang maling tiyak na diagnosis, habang inilalagay sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “isang tao” para sa genericong אָדָם, at iniwasan ang teknikal o makalumang pananalitang maaaring magbigay ng maling modernong diagnosis. Ang marker na [a] ay nakalagay agad pagkatapos ng “sakit sa balat.”
