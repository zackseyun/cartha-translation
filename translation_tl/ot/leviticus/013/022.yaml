  yaml_path: translation/ot/leviticus/013/022.yaml
  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: tl
  text: Ngunit kung talagang kumalat ito sa balat, ipahahayag ng pari na marumi siya[a]; isa itong karamdaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ituturing ng pari na marumi siya.” Tumutukoy ito sa pormal na pagpapahayag ng rituwal na katayuan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “salot,” “sakit,” o “apektadong bahagi.” Malawak ang kahulugan ng salitang Hebreo at hindi ito tiyak na katumbas ng isang makabagong uring medikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong salungat sa naunang kaso, habang pinananatili ang anyong pasubali.
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: talagang kumalat
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa pagkalat; natural na naihahatid ito ng “talagang” sa Filipino.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Karaniwang kahulugan ng עוֹר ang balat; ang “sa balat” ang natural na Filipino para sa lokasyon ng pagkalat.
- source_word: וְטִמֵּא הַכֹּהֵן אֹתוֹ
  choice: ipahahayag ng pari na marumi siya
  rationale: Sa kontekstong legal at pansaserdote, ito ay pormal na pagpapahayag ng katayuang marumi, hindi pagkakait o paglikha ng karumihan.
- source_word: נֶגַע
  choice: karamdaman
  rationale: Malawak ang saklaw ng terminong Hebreo at maaaring tumukoy sa isang apektadong bahagi o kondisyong tulad ng salot; iniiwasan ng “karamdaman” ang labis na tiyak na makabagong diagnosis.
- source_word: הִוא
  choice: isa itong
  rationale: Likas na Filipino na pagkakakilanlan ng kondisyong katatapos ilarawan.
theological_decisions:
- issue: Ang bisa ng pahayag ng pari tungkol sa karumihan
  choice: Pormal na ipinahahayag ng pari na marumi ang tao.
  alternative: Ginagawang marumi ng pari ang tao.
  rationale: Sa batas pansaserdote, sinusuri at ipinahahayag ng pari ang rituwal na katayuan; hindi sinasabi ng teksto na ang kanyang pananalita ang sanhi ng karumihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “marumi” bilang terminong rituwal sa konteksto ng Levitico, at iniwasan ang “impeksiyon” dahil masyado itong tiyak bilang makabagong medikal na diagnosis.
