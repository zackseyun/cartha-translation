  terminology: Mainam na panatilihin ang "tsaraat" na may talababa, sapagkat hindi ito modernong klinikal na ketong at inilalapat din ng teksto sa tela at mga bagay na balat. Ang "malinis" at "marumi" ay dapat manatili bilang mga katagang ritwal sa kontekstong ito.
