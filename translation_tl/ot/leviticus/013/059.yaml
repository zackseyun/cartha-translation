  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: tl
  text: Ito ang tuntunin tungkol sa pagkakaroon ng tsaraat[a] sa damit na lana o lino, sa mga sinulid na paayon o pahalang, o sa anumang bagay na yari sa balat, upang ipahayag kung ito ay malinis o marumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tsaraat ay terminong Hebreo para sa isang uri ng karumihang ritwal. Hindi ito tiyak na katumbas ng modernong ketong, at sa kabanatang ito ay maaari rin itong makita sa damit at mga bagay na yari sa balat.
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: תּוֹרַת
  choice: tuntunin tungkol sa
  rationale: Sa pangwakas na buod na ito, ang תּוֹרָה ay tumutukoy sa tuntunin o pamamaraang namamahala sa mga naunang kaso; natural at malinaw sa modernong Filipino ang “tuntunin tungkol sa.”
- source_word: נֶגַע צָרַעַת
  choice: salot na tsaraat
  rationale: Ang נֶגַע ay isang nakikitang apektadong bahagi o salot, samantalang ang צָרַעַת ay isang natatanging kategoryang Levitico na maaari ring tumama sa tela at balat. Pinanatili ang transliterasyong “tsaraat” upang hindi ito mapagkamalang modernong ketong o sakit sa balat.
- source_word: בֶּגֶד הַצֶּמֶר א֣וֹ הַפִּשְׁתִּים
  choice: damit na lana o lino
  rationale: Ang pariralang Hebreo ay tumutukoy sa damit na yari sa lana o lino; hindi kailangang ulitin ang “damit” sa Filipino.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: paayon o pahalang na mga sinulid
  rationale: Ito ang dalawang direksiyon ng sinulid sa paghahabi. Mas madaling maunawaan ng karaniwang mambabasa ang deskriptibong Filipino kaysa sa bihirang teknikal na hiram na mga termino.
- source_word: כָּל כְּלִי עוֹר
  choice: anumang kagamitang yari sa balat
  rationale: Malawak ang saklaw ng כְּלִי bilang kagamitan o bagay, at ang עוֹר ay balat na ginawang materyal; pinananatili ng salin ang lawak ng kahulugan.
- source_word: לְטַהֲרוֹ א֥וֹ לְטַמְּאוֹ
  choice: upang ipahayag kung iyon ay malinis o marumi
  rationale: Sa kontekstong legal at ritwal, tumutukoy ito sa pagpapasiya at pagpapahayag ng katayuan, hindi sa pisikal na paglilinis o pagpaparumi.
theological_decisions:
- issue: Kahulugan ng צָרַעַת kapag tumutukoy sa damit at balat
  choice: tsaraat
  alternative: ketong; sakit sa balat; salot na parang ketong
  rationale: Hindi eksaktong katumbas ng צָרַעַת ang modernong Hansen’s disease, at sa talatang ito ay tumatama ito sa mga bagay, hindi sa balat ng tao. Pinananatili ng transliterasyon ang natatanging kategorya ng teksto at ang tunay na kawalang-tiyak nito nang hindi nagpapataw ng modernong diagnosis.
- issue: Malinis at marumi bilang ritwal na katayuan
  choice: ipahayag kung iyon ay malinis o marumi
  alternative: linisin o parumihin iyon
  rationale: Ipinakikita ng konteksto na ito ay pagpapasiya sa katayuang ritwal. Iniiwasan ng salin ang pahiwatig na mismong ang pagpapahayag ang pisikal na sanhi ng kalinisan o karumihan.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “tuntunin” sa halip na mas teknikal na “kautusan,” at ipinaliwanag sa talababa ang transliterasyong “tsaraat.”
