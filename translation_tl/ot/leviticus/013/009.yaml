  text: When an infection of leprosy is in a person[a], then he shall be brought to the priest.
translation:
  language: tl
  text: Kapag nagkaroon ang isang tao ng karamdamang tsaraat[a], dadalhin siya sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong צָרַעַת (tsaraat), na tradisyonal na isinasaling “ketong,” ay maaaring tumukoy sa mas malawak na hanay ng mga kondisyon sa balat kaysa sa partikular na sakit na Hansen sa makabagong gamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: karamdaman
  rationale: Sa kontekstong pagsusuri sa Levitico 13, tumutukoy ito sa nakikitang abnormal na kondisyon o pinsala. Mas natural at hindi labis na tiyak ang “karamdaman” kaysa “impeksiyon,” na maaaring magpahiwatig ng tiyak na sanhi.
- source_word: צָרַעַת
  choice: tsaraat
  rationale: Ang terminong Hebreo ay hindi tiyak na katumbas ng modernong ketong at maaari ring tumukoy sa iba pang malulubhang kondisyon. Pinanatili ang transliterasyon upang hindi ito maling ikulong sa isang modernong diagnosis.
- source_word: כִּי
  choice: kapag
  rationale: Nagpapakilala ito ng isang sitwasyon sa batas; natural sa makabagong Filipino ang “kapag.”
- source_word: תִהְיֶה בְּאָדָם
  choice: ang isang tao ay magkaroon
  rationale: Ipinahahayag nito nang natural sa Filipino na nasa isang tao ang kondisyon, habang ang “tao” ay tumpak na pangkalahatang katumbas ng אָדָם sa kontekstong ito.
- source_word: וְהוּבָא
  choice: dadalhin siya
  rationale: Pinananatili ang pasibong diwa at ang kasunod na hakbang sa pamamaraang legal nang hindi nagdaragdag kung sino ang magdadala.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Ang tiyak na artikulong Hebreo ay tumutukoy sa paring magsasagawa ng pagsusuri; likas sa Filipino na sabihin lamang na “sa pari.”
theological_decisions:
- issue: Saklaw ng צָרַעַת
  choice: tsaraat na may paliwanag sa talababa
  alternative: ketong / sakit sa balat
  rationale: Ang “ketong” ay maaaring mapagkamalang eksaktong Hansen's disease, samantalang ang “sakit sa balat” ay maaaring maging sobrang makitid dahil ginagamit din ang salita sa ibang materyales sa kasunod na mga batas. Pinananatili ng transliterasyon ang makasaysayang kategorya at tunay na lawak ng termino.
- issue: Pangkalahatang אָדָם
  choice: tao
  alternative: lalaki
  rationale: Ang אָדָם dito ay tumutukoy sa sinumang taong may kondisyon, hindi partikular na sa lalaking nasa hustong gulang. Ang “tao” ang likas at tumpak na pangkalahatang salin sa Filipino.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang karaniwang legal na hulma na “Kapag …, …” at iniwasan ang medikal na katiyakang wala sa Hebreo.
