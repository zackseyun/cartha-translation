source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: tl
  text: Sa ikapitong araw, susuriin niya ang apektadong bahagi. Kung kumalat ang apektadong bahagi sa kasuotan, sa mga hiblang paayon o pahalang, sa katad, o sa alinmang kagamitang yari sa katad, ang apektadong bahaging iyon ay isang mapaminsalang tsaraat[a]; marumi ito ayon sa ritwal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tsaraat ay terminong Hebreo para sa iba’t ibang kalagayang nagdudulot ng ritwal na karumihan. Tradisyonal itong isinasaling “ketong,” ngunit hindi ito tumutukoy lamang sa sakit na iyon at maaari rin itong tumukoy sa apektadong kasuotan at katad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: susuriin niya
  rationale: Sa konteksto ng pagsusuri ng pari, ang pandiwa ay tumutukoy sa maingat na pagtingin o inspeksiyon, hindi lamang sa pagkakita.
- source_word: הַנֶּגַע
  choice: ang apektadong bahagi
  rationale: Tumutukoy ito sa nakikitang bahid o pinsalang sinusuri. Mas angkop ito sa kasuotan at katad kaysa sa medikal na salitang “impeksiyon,” at hindi rin nito pinalalawak ang kahulugan gaya ng “salot.”
- source_word: פָשָׂה
  choice: kumalat
  rationale: Tuwirang ipinahahayag nito ang paglawak ng apektadong bahagi.
- source_word: בֶּגֶד
  choice: kasuotan
  rationale: Natural at dignified na katumbas ng damit o artikulo ng pananamit sa kontekstong legal.
- source_word: שְׁתִי ... עֵרֶב
  choice: mga hiblang paayon o pahalang
  rationale: Malinaw na ipinapaliwanag sa karaniwang mambabasa ang warp at weft nang hindi nangangailangan ng di-pamilyar na teknikal na katawagan.
- source_word: עוֹר
  choice: katad
  rationale: Ang konteksto ay naprosesong balat na ginagamit bilang materyal, kaya mas tiyak ang “katad” kaysa “balat.”
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: anumang gamit na yari sa katad
  rationale: Natural na Filipino na sumasaklaw sa lahat ng bagay na ginagawa mula sa katad, alinsunod sa legal na lawak ng parirala.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: mapaminsalang tsaraat
  rationale: Pinananatili ang teknikal na terminong Hebreo sapagkat dito ay tumutukoy ito sa kasuotan at katad, hindi lamang sa karamdaman ng balat. Ipinahahayag ng “mapaminsala” ang nakapipinsala o umuubos na diwa ng pang-uri.
- source_word: טָמֵא הוּא
  choice: Marumi ito
  rationale: Maikli at tuwirang pahayag ng katayuang ritwal sa konteksto ng mga batas sa kalinisan.
theological_decisions:
- issue: Kahulugan ng צָרַעַת sa batas ng ritwal na kalinisan
  choice: tsaraat
  alternative: ketong; sakit sa balat; karumaldumal na salot
  rationale: Hindi eksaktong katumbas ng modernong Hansen’s disease ang terminong Hebreo, at sa talatang ito ay maaari itong makita sa kasuotan at katad. Ang transliterasyon na may talababa ay umiiwas sa maling medikal na pagtutumbas at pinananatili ang iisang teknikal na termino ng kabanata.
- issue: Kahulugan ng טָמֵא
  choice: marumi
  alternative: ritwal na marumi; di-dalisay
  rationale: Ang “marumi” ang natural at maikling katumbas; malinaw sa konteksto ng Levitico na ritwal na katayuan ang tinutukoy, hindi moral na kasamaan.
translation_notes:
  register: Makabagong Filipino na malinaw ngunit marangal ang himig. Gumamit ng karaniwang paglalarawan sa mga hibla sa halip na bihirang teknikal na bokabularyo. Ang gitling-pahaba ay nagpapalinaw na ang kasunod na parirala ay sumasaklaw sa anumang kagamitang katad.
