  - severity: low
    issue: Bahagyang di-natural ang panaguri na “ang apektadong bahagi ay mapaminsalang tsaraat.”
    rationale: 'Mas maayos sa Filipino ang paggamit ng “isang” bago ang transliteradong pangngalan: “ay isang mapaminsalang tsaraat.”'
  - severity: low
    issue: Mas malinaw na maipapaloob ang pangkalahatang sugnay tungkol sa katad sa talaan ng mga posibleng materyal.
    rationale: Ang Hebreong parirala ay nagpapalawak sa saklaw sa anumang kagamitang yari sa katad; ang koordinadong “o sa alinmang...” ay mas natural at tumpak.
