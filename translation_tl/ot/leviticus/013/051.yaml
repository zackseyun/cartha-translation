revisions:
- from: Sa ikapitong araw, susuriin niya ang apektadong bahagi. Kung kumalat ito sa kasuotan, sa mga hiblang paayon o pahalang, o sa katad—anumang gamit na yari sa katad—ang apektadong bahagi ay mapaminsalang tsaraat[a]. Marumi ito.
  to: Sa ikapitong araw, susuriin niya ang apektadong bahagi. Kung kumalat ang apektadong bahagi sa kasuotan, sa mga hiblang paayon o pahalang, sa katad, o sa alinmang kagamitang yari sa katad, ang apektadong bahaging iyon ay isang mapaminsalang tsaraat[a]; marumi ito ayon sa ritwal.
  rationale: Inayos ang pangungusap upang maging mas likas sa modernong Filipino, malinaw na maipakita ang saklaw ng kagamitang yari sa katad, at maipahayag na ang “marumi” ay isang ritwal na hatol. Hindi binabago ng rebisyon ang di-tiyak na katangian ng tsaraat at hindi ito itinutumbas sa isang modernong sakit.
