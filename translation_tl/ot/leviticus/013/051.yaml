  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: pagsusuri sa ikapitong araw, pagkalat ng apektadong bahagi sa kasuotan, mga hibla, o katad, at ang hatol na ritwal na karumihan. Gayunman, mas malinaw na dapat ipakita sa Filipino na ang pangwakas na pasya ay ukol sa apektadong bahagi, at ang pariralang tungkol sa kagamitang katad ay dapat iugnay nang tuwiran sa naunang talaan.'
  naturalness: Malinaw at makabago ang karamihan ng draft. Ang “ang apektadong bahagi ay mapaminsalang tsaraat” ay bahagyang pilit sa Filipino; mas natural ang “ay isang mapaminsalang tsaraat.” Ang “marumi” lamang ay maaaring basahin bilang pisikal na dumi, kaya ang “marumi ayon sa ritwal” ay nagbibigay ng kinakailangang katumpakan nang hindi mabigat.
  terminology: Ang “tsaraat” na may paliwanag sa talababa ay maingat at angkop, yamang ang terminong Hebreo ay inilalapat din sa tela at katad. Ang “katad,” “kasuotan,” at “mga hiblang paayon o pahalang” ay angkop na modernong mga katumbas. Panatilihin ang teknikal na termino at linawin sa talababa ang saklaw nitong ritwal, hindi modernong medikal na diyagnosis.
