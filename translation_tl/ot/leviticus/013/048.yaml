translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Isinalin nang paliwanag ang teknikal na pares ng mga sinulid sa paghahabi upang madaling maunawaan nang hindi nawawala ang pagkakaiba ng mga ito. Pinanatili ang pangwakas na gitling sapagkat nagpapatuloy ang pangungusap sa susunod na talata.
