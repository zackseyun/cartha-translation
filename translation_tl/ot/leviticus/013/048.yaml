  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: tl
  text: o sa mga sinulid na pahaba o pahalang ng lino o lana, o sa katad, o sa anumang bagay na yari sa katad—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתִי
  choice: paayon na mga sinulid
  rationale: Tumutukoy ito sa mahahabang sinulid na nakaayos sa direksiyon ng habi. Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na terminong panghabi.
- source_word: עֵרֶב
  choice: pahalang na mga sinulid
  rationale: Tumutukoy ito sa mga sinulid na ipinapadaan nang pahalang sa mga paayong sinulid; malinaw nitong pinananatili ang kaibhan ng dalawang bahagi ng habi.
- source_word: לַפִּשְׁתִּים
  choice: ng lino
  rationale: Bagaman maaaring tumukoy ang salita sa halamang flax, sa konteksto ng hinabing materyal ay natural itong tumukoy sa linong mula rito.
- source_word: וְלַצָּמֶר
  choice: o lana
  rationale: Ang צֶמֶר ay lana. Ginamit ang “o” ayon sa diwa ng listahan ng mga maaaring materyal.
- source_word: עוֹר
  choice: katad
  rationale: Sa konteksto ng mga gamit at yaring bagay, tumutukoy ito sa naprosesong balat ng hayop; “katad” ang natural at tiyak na salin.
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: sa anumang bagay na yari sa katad
  rationale: Ang מְלָאכָה rito ay isang produktong ginawa o hinubog, hindi abstraktong paggawa. Malinaw at likas sa Filipino ang pariralang ito.
- source_word: אוֹ ... אוֹ
  choice: o ... o
  rationale: Pinananatili ang inuulit na pangatnig upang makita ang magkakahiwalay na alternatibo sa Hebreong talaan.
