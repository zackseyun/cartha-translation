  source_fidelity: Malapit ang salin sa Hebreo at napananatili ang talaan ng mga posibleng materyal o bahagi ng materyal, pati ang pangwakas na gitling na nagpapakitang nagpapatuloy ang pangungusap. Gayunman, ang pares na שְׁתִי at עֵרֶב ay mga sinulid na pahaba at pahalang (warp at weft) sa habi; mas tumpak at likas na ilahad ang mga ito bilang mga sinulid na pahaba at pahalang kaysa sa mas malabong “paayon.”
  naturalness: Makabago at madaling unawain ang kabuuan. Ang “mga sinulid na pahaba o pahalang” ay mas idiomatiko at mas malinaw na teknikal na paglalarawan sa Filipino.
  terminology: Ang “lino,” “lana,” at “katad” ay angkop. Ang “anumang bagay na yari sa katad” ay wastong sumasaklaw sa anumang gawang bagay na katad. Walang kinakailangang talababa, sapagkat malinaw na sa teksto ang di-teknikal na pagpapaliwanag ng warp at weft.
