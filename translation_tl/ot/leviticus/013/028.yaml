  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: tl
  text: Ngunit kung ang maputing batik ay nanatili sa kinalalagyan nito[a], hindi kumalat sa balat, at kumupas, iyon ay pamamaga mula sa paso. Ipahahayag ng pari na malinis ang taong iyon, sapagkat iyon ay pilat ng paso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanatili sa ilalim nito.” Literal na sinasabi ng Hebreo na ang maputing batik ay “tumayo sa ilalim nito,” ngunit sa konteksto ang diwa ay nanatili ito sa dating kinalalagyan at hindi kumalat.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: nanatili sa kinalalagyan nito
  rationale: Likas na ipinahahayag sa Filipino ang idyomang Hebreo na literal na 'tumayo sa ilalim nito'; sa kontekstong pagsusuri, ang diwa ay hindi gumalaw o lumawak ang batik.
- source_word: הַבַּהֶרֶת
  choice: ang maputing batik
  rationale: Tumutukoy ito sa kapansin-pansing maliwanag o maputing bahagi ng balat; malinaw at likas sa karaniwang Filipino ang 'maputing batik.'
- source_word: פָשְׂתָה בָעוֹר
  choice: kumalat sa balat
  rationale: Ito ang karaniwang wikang ginagamit sa paglawak ng sugat o kondisyon sa balat, at pinananatili ang puwersang diagnostiko ng pandiwa.
- source_word: כֵהָה
  choice: kumupas
  rationale: Ipinahihiwatig ng salita ang paghina ng ningning o kapansin-pansing kulay ng batik.
- source_word: שְׂאֵת הַמִּכְוָה
  choice: pamamaga mula sa paso
  rationale: Ang שְׂאֵת ay nakaumbok o namamagang bahagi, at ang kasunod na parirala ay nag-uugnay rito sa paso.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: Ipahahayag ng pari na malinis ang taong iyon
  rationale: Sa batas ng Levitico, ang pari ay gumagawa ng pormal na pasiya tungkol sa kalinisan; hindi niya pisikal na nililinis ang tao.
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: pilat ng paso
  rationale: Tumutukoy ito sa naiwang marka o peklat bunga ng paso; karaniwan at maikli ang 'pilat' sa Filipino.
theological_decisions:
- issue: Kahulugan ng 'malinis' sa pasiya ng pari
  choice: malinis
  alternative: walang sakit
  rationale: Pinananatili ang kategoryang ritwal at legal ng tekstong Hebreo sa halip na ipakahulugan lamang bilang medikal na kawalan ng sakit.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang 'maputing batik,' 'pamamaga,' 'paso,' at 'pilat' bilang madaling maunawaang mga terminong pangkatawan. Tahasang binanggit ang 'taong iyon' upang maging natural sa Filipino ang panlalaking hulaping Hebreo nang hindi ipinapalagay na ang tinutukoy ay tiyak na lalaki.
