  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: tl
  text: Susuriin iyon ng pari, at nakita niyang ang hitsura nito ay nakalubog sa balat at ang buhok dito ay namuti; ipahahayag ng pari na marumi ang taong iyon. Isa itong pagsiklab ng sakit sa balat[a] na lumitaw sa pigsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na צָרַעַת, na tradisyonal na isinasaling “ketong,” ay malamang na tumutukoy sa iba't ibang malulubhang kondisyon sa balat sa Levitico, hindi lamang sa tinatawag ngayong sakit na Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Susuriin
  rationale: Sa konteksto ng pagsusuri ng pari, ang pandiwa ay tumutukoy sa maingat na pagtingin o inspeksiyon, hindi lamang sa pagkakita.
- source_word: וְהִנֵּה
  choice: at kung
  rationale: Sa kondisyunal na pamamaraang legal ng talata, likas sa modernong Tagalog ang “at kung” upang ipakilala ang mga palatandaang nakita; naipapahayag nito ang obserbasyonal na puwersa nang hindi gumagamit ng lipas na “narito.”
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: ang hitsura nito ay mas malalim kaysa sa balat
  rationale: Pinananatili ang paghahambing ng Hebreo at ipinahihiwatig na mukhang nakalubog ang apektadong bahagi.
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: ang buhok dito ay namuti
  rationale: Nililinaw na ang tinutukoy ay buhok sa apektadong bahagi, habang pinananatili ang pagbabagong kulay.
- source_word: וְטִמְּאוֹ
  choice: ipahahayag ng pari na marumi ang taong iyon
  rationale: Ipinakikita nitong ang pari ay nagbibigay ng awtoritatibong hatol tungkol sa rituwal na kalagayan, hindi siyang sanhi ng karumihan.
- source_word: נֶגַע צָרַעַת
  choice: isang salot na sakit sa balat
  rationale: Ang “salot” ay kumakatawan sa נֶגַע bilang malubhang pinsala o outbreak, samantalang ang “sakit sa balat” ay umiiwas sa maling paglilimita ng צָרַעַת sa modernong Hansen's disease.
- source_word: בַּשְּׁחִין
  choice: sa pigsa
  rationale: Ang “pigsa” ay tuwiran, maikli, at karaniwang katumbas ng inflamed boil sa kontekstong ito.
- source_word: פָּרָחָה
  choice: lumitaw
  rationale: Ipinahahayag ang pagputok o pagpapakita ng sakit sa pigsa nang hindi kinakailangang ipakahulugang kumalat ito sa mas malawak na bahagi.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת sa batas tungkol sa rituwal na kalinisan
  choice: sakit sa balat
  alternative: ketong
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa modernong ketong o Hansen's disease. Pinananatili ng “sakit sa balat” ang kontekstong diagnostic at rituwal nang hindi naglalagay ng anakronistikong tiyak na diagnosis.
- issue: Gampanin ng pari sa וְטִמְּאוֹ
  choice: ipahahayag na marumi
  alternative: gagawing marumi
  rationale: Ang pari ay kumikilala at nagpapahayag ng kalagayang rituwal ayon sa mga palatandaan; hindi ipinahihiwatig na siya ang lumikha ng sakit o karumihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “pari,” “marumi,” “sakit sa balat,” at “pigsa”; iniwasan ang sobrang teknikal na bokabularyong medikal at ang maling pagtukoy sa צָרַעַת bilang tiyak na modernong ketong.
