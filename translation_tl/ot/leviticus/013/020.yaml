review_pass:
  verdict: revise
  source_fidelity: Kailangang iwasto ang «at kung» dahil ang וְהִנֵּה ay pangmarka ng pagmamasid (“at nakita niya/at narito”), hindi pantulong na pangkondisyon. Mas malinaw ring isalin ang שָׁפָל bilang anyong nakalubog sa balat. Ang «salot na sakit» ay hindi likas at ang «salot» ay maaaring magdagdag ng di-nakasaad na kahulugang epidemya o parusa.
  naturalness: Malinaw sa pangkalahatan ang draft, ngunit mas natural sa modernong Filipino ang “nakita niyang ... ay nakalubog sa balat” at “pagsiklab ng sakit sa balat” kaysa “salot na sakit sa balat.”
  terminology: Ang “pari,” “marumi,” “sakit sa balat,” at “pigsa” ay angkop. Ang “marumi” ay pinanatili bilang maikli at tradisyonal na katawagan para sa kalagayang rituwal; ang talababa ay wastong naglilinaw na hindi ito tiyak na modernong ketong.
  issues:
  - severity: medium
    issue: Ang וְהִנֵּה ay isinaling “at kung.”
    rationale: Ang Hebreo ay nagpapakilala ng natuklasan sa pagsusuri (“at narito/nakita niya”), samantalang ang “kung” ay ginagawang pangkondisyon ang pahayag at binabago ang daloy ng pangungusap.
  - severity: medium
    issue: Ang “salot na sakit sa balat” ay hindi natural at sobrang kahulugan para sa נֶגַע צָרַעַת.
    rationale: Ang נֶגַע ay tumutukoy sa apektadong bahagi/karamdaman, ngunit ang “salot” sa Filipino ay karaniwang nagpapahiwatig ng malawakang salot o kapahamakang ipinadadala. Ang “pagsiklab ng sakit sa balat” ay mas malinaw na tumutugon sa konteksto at sa kasunod na פָּרָחָה.
  - severity: low
    issue: Ang “mas malalim kaysa sa balat” ay maaaring malabo sa Filipino.
    rationale: Inilalarawan ng idyoma ang sugat na waring nakalubog sa balat; ang tahasang pagpapahayag nito ay mas madaling maunawaan nang hindi binabago ang kahulugan.
  revised_text: Susuriin iyon ng pari, at nakita niyang ang hitsura nito ay nakalubog sa balat at ang buhok dito ay namuti; ipahahayag ng pari na marumi ang taong iyon. Isa itong pagsiklab ng sakit sa balat[a] na lumitaw sa pigsa.
