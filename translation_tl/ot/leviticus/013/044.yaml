  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: tl
  text: Ang lalaki ay may sakit sa balat[a]; marumi siya. Tiyak na ipahahayag siya ng pari na marumi; nasa ulo niya ang kanyang sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin na “ketongin.” Ang salitang Hebreo ay tumutukoy sa sakit sa balat na tinatalakay sa kabanatang ito at hindi kinakailangang kapareho ng modernong ketong (Hansen's disease).
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: lalaking iyon ay may sakit sa balat
  rationale: Tumutukoy ang אִישׁ sa isang lalaki sa kasong inilalarawan, at ang צָרוּעַ ay sa taong apektado ng kondisyong sinusuri sa kabanata. Iniiwasan ng “sakit sa balat” ang mapanlinlang na pagtukoy na tiyak na modernong Hansen's disease.
- source_word: טָמֵא הוּא
  choice: marumi siya
  rationale: Sa konteksto ng Levitico, ang טָמֵא ay ritwal na karumihan, hindi karaniwang kawalan ng kalinisan. Ang “marumi” ang likas at nakaugaliang katumbas sa ganitong konteksto.
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: tiyak na ipahahayag siya ... na marumi
  rationale: Ang infinitive absolute na kasama ng imperfect ay nagbibigay-diin sa katiyakan. Ang pari ay opisyal na nagpapahayag ng kalagayan ng lalaki at hindi ang sanhi ng kanyang pagiging marumi.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang katumbas para sa opisyal na panrelihiyon na nagsusuri at nagpapahayag ng ritwal na kalagayan.
- source_word: בְּרֹאשׁוֹ
  choice: nasa ulo niya
  rationale: Pinananatili ang payak na lokasyong ipinahahayag ng Hebreo, nang hindi nililimitahan ito sa anit bagaman iyon ang agarang konteksto.
- source_word: נִגְעוֹ
  choice: ang kanyang sakit
  rationale: Sa Levitico 13, tumutukoy ang נֶגַע sa nakikitang karamdaman o apektadong bahagi. Natural sa modernong Tagalog ang “sakit” at hindi nito ipinahihiwatig ang epidemya gaya ng maaaring gawin ng “salot.”
