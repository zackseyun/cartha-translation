  register: Modernong Filipino na malinaw at marangal. Pinanatili ang legal at ritwal na diin ng pahayag ng pari, habang iniwasan ang lipas at posibleng mapanlinlang na medikal na katawagang “ketongin” sa pangunahing teksto.
