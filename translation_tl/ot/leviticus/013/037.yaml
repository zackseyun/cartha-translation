  to: Ngunit kung sa paningin ng pari ay hindi nagbago ang kaliskising pantal, at may tumubong itim na buhok sa pantal, gumaling na ang pantal. Malinis siya, at ipahahayag siya ng pari na malinis.[a]
  rationale: Pinalitan ang “galis” ng “kaliskising pantal” upang maiwasan ang maling pagtukoy sa isang partikular na modernong sakit habang pinananatili ang kahulugang diagnostiko ng Hebreo. Ginawang “sa pantal” ang lokasyon ng tumutubong buhok para sa mas malinaw na pagtukoy sa apektadong bahagi. Pinanatili ang pormal na pagpapahayag ng pari tungkol sa rituwal na kalinisan.
