base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: tl
  text: Ngunit kung sa paningin ng pari ay hindi nagbago ang kaliskising pantal, at may tumubong itim na buhok sa pantal, gumaling na ang pantal. Malinis siya, at ipahahayag siya ng pari na malinis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “lilinisin siya ng pari.” Sa kontekstong ito, tumutukoy ang pandiwang Hebreo sa pormal na pagpapahayag ng pari na malinis ang tao matapos gumaling ang kondisyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: sa paningin ng pari
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagtatasa ng tagasuri. Nilinaw ang tinutukoy ng panghalip bilang pari ayon sa konteksto ng pagsusuri.
- source_word: עָמַד
  choice: nanatiling hindi nagbabago
  rationale: Sa kontekstong ito, ang kondisyon ay nanatili sa dati nitong kalagayan sa halip na kumalat o magbago.
- source_word: הַנֶּתֶק
  choice: ang galis
  rationale: Tumutukoy ito sa partikular na sakit o sugat sa balat ng ulo o balbas na sinusuri sa kabanata; ang “galis” ay maikli, natural, at nauunawaan sa modernong Filipino.
- source_word: שֵׂעָר שָׁחֹר
  choice: itim na buhok
  rationale: Tuwirang katumbas ng pariralang Hebreo at mahalaga sa palatandaang ginagamit sa pagsusuri.
- source_word: צָמַח בּוֹ
  choice: may tumubong … doon
  rationale: Likas na Filipino para sa buhok na tumubo sa mismong bahaging apektado.
- source_word: נִרְפָּא
  choice: gumaling na
  rationale: Ipinahahayag na ang galis ay gumaling na bago ibigay ng pari ang pormal na pasiya.
- source_word: טָהוֹר הוּא
  choice: malinis siya
  rationale: Ang paksa ay ang taong sinusuri, at ang “malinis” ang angkop na termino sa konteksto ng rituwal na kalinisan sa Levitico.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ipahahayag siyang malinis ng pari
  rationale: Sa kontekstong legal at makasaserdote, ito ay pormal na paghatol sa kalagayan ng tao, hindi pagkilos na pisikal na nagpapagaling sa kaniya.
theological_decisions:
- issue: Kalikasan ng pagkilos ng pari sa pagpapasiya tungkol sa rituwal na kalinisan
  choice: ipahahayag siyang malinis ng pari
  alternative: lilinisin siya ng pari
  rationale: Inihihiwalay ng talata ang paggaling ng galis sa kasunod na opisyal na pasiya ng pari. Pinananatili ng salin ang papel ng pari bilang tagapagpahayag ng kalagayan, hindi bilang sanhi ng paggaling.
translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinanatili ang terminong “malinis” para sa bokabularyo ng rituwal na kalinisan, at ginawang tahasan ang “pari” sa unang sugnay upang luminaw kung kaninong paningin ang tinutukoy.
