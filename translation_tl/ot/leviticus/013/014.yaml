  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: tl
  text: Ngunit sa araw na lumitaw sa kaniya ang buhay na laman, magiging marumi siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְיוֹם
  choice: Ngunit kapag
  rationale: Sa konteksto, ang וּ ay nagpapakita ng pagsalungat sa naunang kalagayan, at ang בְּיוֹם ay idyomatikong tumutukoy sa panahong mangyari ang kondisyon, kaya natural ang “kapag” sa Filipino.
- source_word: הֵרָאוֹת
  choice: lumitaw
  rationale: Ang Niphal infinitive ng ראה ay nangangahulugang makita o magpakita; “lumitaw” ang natural na paglalarawan sa pagkahayag ng buhay na laman.
- source_word: בָּשָׂר חַי
  choice: buhay na laman
  rationale: Pinananatili ang literal at teknikal na parirala para sa nakalantad na sariwa o buhay na tisyu nang hindi dinaragdagan ang kahulugan.
- source_word: בּוֹ
  choice: dito
  rationale: Ang panghalip ay maaaring tumukoy sa apektadong bahagi o kondisyon; ang “dito” ay likas sa Filipino at pinananatili ang hindi tahasang reperensiya nang hindi ito ginagawang “sa kaniya.”
- source_word: יִטְמָא
  choice: magiging marumi siya
  rationale: Ipinapahayag ang ritwal na katayuan ng tao ayon sa konteksto; ang panghinaharap na anyo ay angkop sa kondisyong ipinakilala ng “kapag.”
theological_decisions:
- issue: Kahulugan ng pagiging marumi
  choice: marumi
  alternative: ritwal na marumi
  rationale: Pinananatili ang karaniwang terminong pang-Levitico at hindi idinaragdag sa teksto ang paliwanag na “ritwal,” bagaman iyon ang kontekstuwal na diwa.
- issue: Reperensiya ng בּוֹ
  choice: dito
  alternative: sa kaniya
  rationale: Hindi tahasang nilulutas ang gramatikal na reperensiya bilang mismong tao; naaayon ito sa posibilidad na tumukoy ang parirala sa apektadong lugar o kondisyon.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Maikli ang pangungusap gaya ng Hebreo, habang likas ang ayos at ugnayang kondisyonal sa Tagalog.
