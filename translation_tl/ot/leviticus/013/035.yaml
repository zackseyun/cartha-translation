  text: Ngunit kung talagang kumalat sa balat ang kaliskising pantal[a] matapos siyang ipahayag na malinis,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang pangangati.” Ang salitang Hebreo ay tumutukoy sa isang natatanging kondisyon sa balat na inilalarawan sa kabanatang ito, malamang na may pagkaliskis at pagbabago sa buhok, lalo na sa anit o balbas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinapakita nito ang kondisyong kasalungat ng naunang kaso sa proseso ng pagsusuri.
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: talagang kumalat
  rationale: Ang infinitive absolute na kasunod ng pandiwang may iisang ugat ay nagbibigay-diin sa pagkalat; likas na ipinahahayag ito ng “talagang” sa modernong Tagalog.
- source_word: הַנֶּתֶק
  choice: ang sakit na nakakaliskis
  rationale: Tumutukoy ang נֶתֶק sa natatanging kondisyon sa anit o balbas na inilalarawan sa kabanata, na may pagbabago sa buhok at posibleng pagkaliskis; mas malinaw ito kaysa sa salitang tumutukoy lamang sa pangangati.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Ang עוֹר ay balat, at ang “sa balat” ang natural na paglalarawan sa lugar ng pagkalat sa Tagalog.
- source_word: אַחֲרֵי
  choice: matapos
  rationale: Pinananatili ang karaniwang temporal na kahulugang “pagkatapos.”
- source_word: טָהֳרָתוֹ
  choice: siyang ipahayag na malinis
  rationale: Sa konteksto ng ritwal na pagsusuri, malamang na tumutukoy ito sa pagkilala o pagpapahayag na malinis, hindi sa moral na paglilinis. Ginagawang malinaw ng salin ang diwa nang hindi nagdaragdag ng denominasyonal na interpretasyon.
theological_decisions:
- issue: Kahulugan ng טָהֳרָתוֹ sa batas tungkol sa ritwal na kalinisan
  choice: matapos siyang ipahayag na malinis
  alternative: matapos ang kanyang paglilinis
  rationale: Mas angkop sa agarang konteksto ng pagsusuri at deklarasyon ng pari ang pagiging ipinahayag na malinis. Hindi nito ipinahihiwatig na kasalanan o moral na karumihan ang kondisyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sakit na nakakaliskis” bilang madaling maunawaang paglalarawan, habang nililinaw sa talababa ang tiyak ngunit hindi ganap na matukoy na kondisyong tinutukoy ng terminong Hebreo.
