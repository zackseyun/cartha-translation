  text: Kapag[a] nagkaroon ng pigsa sa balat ng katawan ng isang tao[b] at gumaling na ito[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kung.”
    reason: Pinananatili ang posibleng kondisyunal na pagbasa sa כִּי.
  - marker: b
    text: Sa literal, “laman”; maaari ring “katawan.”
