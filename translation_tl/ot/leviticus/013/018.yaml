lexical_decisions:
- source_word: וּבָשָׂר
  choice: isang tao
  rationale: Ang בָשָׂר ay literal na “laman,” ngunit sa batas na diagnostic na ito tumutukoy ito sa taong may sugat sa katawan. Ang “isang tao” ay natural sa modernong Filipino at hindi nagmumungkahing kalamnan lamang ang tinutukoy.
- source_word: כִּי
  choice: kapag
  rationale: Ipinapakilala ng כִּי ang isang kondisyong kaso. Ang “kapag” ay angkop sa estilong prosidyural, habang nananatiling posibleng alternatibo ang “kung.”
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: nagkaroon ... sa balat ng isang tao
  rationale: Bagaman gumagamit ang Hebreo ng pandiwang “maging/mayroon” at magkakaugnay na pariralang panlunan, natural na ipinahahayag sa Filipino ang kalagayan bilang “nagkaroon ... sa balat.”
- source_word: שְׁחִין
  choice: pigsa
  rationale: Ang שְׁחִין ay tumutukoy sa pigsa o namamagang singaw; “pigsa” ang maikli, malinaw, at karaniwang katumbas sa kontekstong medikal.
- source_word: וְנִרְפָּא
  choice: at gumaling na ito
  rationale: Ang Niphal ng רפא ay maaaring unawaing intransitibo o pasibo. Ang “gumaling na ito” ay natural sa Filipino at ipinahahayag na natapos na ang paggaling ng pigsa nang hindi tumutukoy ng tagapagpagaling.
