  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: tl
  text: Susunugin niya ang kasuutan, o ang hinabing hiblang paayon o pahalang, na yari sa lana o lino, o anumang bagay na yari sa balat na kinaroroonan ng apektadong marka. Sapagkat ito ay mapanirang tsaraat[b], dapat itong sunugin sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang Hebreong צָרַעַת (tsaraat), na tradisyonal na isinasaling “ketong,” ay tumutukoy sa mas malawak na kondisyong nagdudulot ng ritwal na karumihan kaysa sa modernong ketong. Ginagamit din ito para sa mga marka o pagkasira sa kasuutan at bahay.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂרַף
  choice: Susunugin niya
  rationale: Ang Qal perfect na may pang-ugnay ay nagpapatuloy sa legal na tagubilin; natural sa Filipino ang aspektong kontemplatibo bilang utos sa pamamaraang inilalarawan.
- source_word: הַבֶּגֶד
  choice: ang kasuutan
  rationale: Malawak at marangal na katumbas ng בגד bilang damit o kasuotang tela.
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: ang paayon o pahalang na mga sinulid
  rationale: 'Ipinapahayag sa karaniwang modernong Filipino ang dalawang teknikal na terminong panghahabi: mga sinulid na pahaba at mga sinulid na pahalang.'
- source_word: בַּצֶּמֶר ... בַפִּשְׁתִּים
  choice: na lana o lino
  rationale: Tumutukoy sa materyal ng mga sinulid; ang “lana” at “lino” ang natural na katawagan sa kontekstong tela.
- source_word: כָּל כְּלִי הָעוֹר
  choice: anumang kagamitang yari sa balat
  rationale: Sapat ang lawak ng “kagamitan” para sa כלי, at pinananatili ng “balat” ang literal na materyal nang hindi nililimitahan sa makabagong pinrosesong katad.
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: na may apektadong bahagi
  rationale: Sa konteksto, נגע ang nakikitang marka o bahaging tinamaan; iniiwasan nitong ipalagay ang isang tiyak na modernong impeksiyon.
- source_word: צָרַעַת מַמְאֶרֶת
  choice: mapanirang salot
  rationale: Ang צָרַעַת ay mas malawak kaysa modernong ketong at dito ay nasa tela o balat; ang “mapanirang” ay naghahatid sa malubha o umuubos na diwa ng מַמְאֶרֶת.
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: dapat itong sunugin sa apoy
  rationale: Ipinahahayag ng “dapat” ang obligadong pasibong kinalabasan ng Niphal imperfect sa batas.
theological_decisions:
- issue: Pagpapakahulugan sa צָרַעַת sa mga batas tungkol sa ritwal na karumihan
  choice: salot
  alternative: ketong; sakit na parang ketong; tsaraat
  rationale: Saklaw ng salitang Hebreo ang kondisyong nagdudulot ng ritwal na karumihan sa tao, kasuutan, at bahay, kaya hindi ito dapat itumbas nang tahasan sa Hansen’s disease. Sa talatang ito, mas angkop ang “salot” dahil tela at balat ang tinutukoy; nililinaw ng talababa ang natatanging saklaw ng terminong Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang paliwanag na “paayon o pahalang na mga sinulid” sa halip na bihira o lubhang teknikal na terminong panghahabi. Pinanatili ang legal na diin sa pagsunog at iniwasan ang maling modernong medikal na pagkakakilanlan ng צָרַעַת.
