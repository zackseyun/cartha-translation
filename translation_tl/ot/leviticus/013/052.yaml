revisions:
- from: Susunugin niya ang kasuutan, ang paayon o pahalang na mga sinulid[a] na lana o lino, o anumang kagamitang yari sa balat na may apektadong bahagi. Sapagkat iyon ay mapanirang salot[b], dapat itong sunugin sa apoy.
  to: Susunugin niya ang kasuutan, o ang hinabing hiblang paayon o pahalang, na yari sa lana o lino, o anumang bagay na yari sa balat na kinaroroonan ng apektadong marka. Sapagkat ito ay mapanirang tsaraat[b], dapat itong sunugin sa apoy.
  rationale: Inayos ang saklaw ng lana at lino, nilinaw na ang mapanirang katangian ay sa tsaraat, at pinanatili ang teknikal at malawak na saklaw ng צָרַעַת sa pamamagitan ng transliterasyon at maikling talababa. Hindi binabago ng rebisyon ang legal na utos o ang ambigwidad ng sinaunang kondisyon.
