    rationale: Maaaring hindi agad malinaw kung sino ang nakakakita. Ang “at nakita niyang” ay natural na nag-uugnay ng obserbasyon sa pari.
  - severity: medium
    issue: Hindi leksikal na alternatibo ang kasalukuyang footnote.
    rationale: Ang “karamdaman sa anit o balbas” ay paglalarawan ng karaniwang saklaw ng kondisyon, hindi alternatibong salin ng Hebreong נתק. Dapat itong ilahad bilang paliwanag at ibigay ang “pangangati” bilang alternatibo.
