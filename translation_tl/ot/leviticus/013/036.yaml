base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: tl
  text: Kung susuriin siya ng pari at nakita niyang kumalat na sa balat ang makaliskis na karamdaman[a], hindi na kailangang tingnan ng pari kung may dilaw na buhok; marumi ang taong iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangangati.” Ang salitang Hebreo ay tumutukoy sa isang makaliskis na kondisyon, lalo na sa ulo o balbas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: kung susuriin siya ng pari
  rationale: Sa konteksto ng mga alituntunin para sa pari, ang ראה ay hindi lamang pagtingin kundi masusing pagsusuri. Ipinahihiwatig ng konteksto ang kondisyong “kung.”
- source_word: וְהִנֵּה
  choice: at makikitang
  rationale: Natural nitong ipinapahayag sa modernong Tagalog ang pagkatuklas o napansing kalagayan, habang pinananatili ang deiktikong diin ng הִנֵּה.
- source_word: פָּשָׂה
  choice: kumalat
  rationale: Tuwirang tumutukoy sa paglawak ng apektadong bahagi sa balat.
- source_word: הַנֶּתֶק
  choice: ang makaliskis na karamdaman
  rationale: Ang נתק ay isang tiyak na kondisyon sa ulo o balbas na may pagkaliskis at pagbabago sa buhok. Mas malinaw ito kaysa sa “pangangati,” na maaaring magpahiwatig ng sintomas na hindi tahasang binanggit.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Ito ang natural na pariralang Tagalog para sa pagkalat ng isang kondisyon sa o ibabaw ng balat.
- source_word: לֹא יְבַקֵּר
  choice: hindi na kailangang tingnan ng pari kung may
  rationale: Ipinahihiwatig ng בקר dito ang karagdagang pagsisiyasat. Kapag napatunayang kumalat na ang kondisyon, hindi na kailangan ang pagsusuri sa isa pang palatandaan.
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: dilaw na buhok
  rationale: Tuwiran at malinaw na salin ng palatandaang ginagamit sa pagsusuri sa kabanata.
- source_word: טָמֵא הוּא
  choice: marumi ang taong iyon
  rationale: Ang tinutukoy ay ang katayuan ng taong sinusuri ayon sa mga tuntunin sa rituwal na kalinisan, hindi lamang ang kondisyon sa balat.
theological_decisions:
- issue: Kahulugan ng טָמֵא sa batas tungkol sa rituwal na kalinisan
  choice: marumi
  alternative: di-malinis; nadungisan
  rationale: Sa Levitico 13, tumutukoy ito sa rituwal na katayuan at hindi kinakailangang sa pagkakasalang moral. Ang “marumi” ang maikli, tradisyonal, at madaling maunawaang katumbas, habang nililinaw ng konteksto ang teknikal na gamit nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “pari” para sa כֹּהֵן at natural na procedural phrasing. Iniwasang tukuyin ang kondisyon bilang isang partikular na modernong sakit na hindi matitiyak mula sa tekstong Hebreo.
