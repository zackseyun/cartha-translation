base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: tl
  text: Susuriin siya ng pari[a], at makikita niyang naging puti ang apektadong bahagi. Ipahahayag ng pari na malinis ang apektadong bahagi[b]; malinis siya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Hebreong hulapi ay panlalaking isahan: “siya.” Sa konteksto, tumutukoy ito sa taong sinusuri ng pari.'
    reason: lexical_alternative
  - marker: b
    text: O “hahatulan ng pari na malinis ang apektadong bahagi.” Ang Hebreong negaʿ ay tumutukoy sa nakikitang bahaging apektado na sinusuri ng pari, nang hindi ito itinutumbas sa isang tiyak na modernong sakit. Ang pari ay nagbibigay ng hatol tungkol sa ritwal na kalagayan; hindi niya pinagagaling ang karamdaman.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “malinis siya/iyon.” Panlalaking isahan ang panghalip; maaari itong tumukoy sa taong sinusuri o, ayon sa gramatika, sa “apektadong bahagi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: susuriin iyon
  rationale: Bagaman literal na “makikita iyon,” sa konteksto ng gawaing pari ang pandiwa ay tumutukoy sa maingat na pagsusuri.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin ng כֹּהֵן at malinaw na tumutukoy sa awtorisadong tagasuri sa batas tungkol sa kalinisan.
- source_word: וְהִנֵּה
  choice: kung
  rationale: Sa makabagong Tagalog, natural na naipahahayag ng “kung” ang napansing kalagayang kasunod ng pagsusuri; ang pansin-drawing na puwersa ng הִנֵּה ay nakapaloob sa konstruksiyon.
- source_word: נֶהְפַּךְ הַנֶּגַע לְלָבָן
  choice: ang sugat ay naging puti
  rationale: Ang Niphal ay nagsasaad ng pagbabago ng kalagayan. Ang “sugat” ay karaniwang salitang tumutukoy sa nakikitang bahaging apektado nang hindi nagtatakda ng modernong diyagnosis.
- source_word: וְטִהַר
  choice: ipahahayag ... na malinis
  rationale: Dito, ang pari ay nagbibigay ng pasiya tungkol sa ritwal na kalagayan, hindi nagpapagaling o aktuwal na naglilinis ng sugat.
- source_word: טָהוֹר הוּא
  choice: malinis iyon
  rationale: Pinananatili ang maikli at mariing pangwakas na hatol. Ang panlalaking panghalip sa Hebreo ay maaaring tumukoy sa נֶגַע, kaya “iyon” ang hindi labis na nagpapaliwanag na salin.
theological_decisions:
- issue: Kalikasan ng kilos ng pari sa batas ng kalinisan
  choice: Ipinahahayag ng pari na malinis ang sugat.
  alternative: Nililinis ng pari ang sugat.
  rationale: Sa Levitico 13, ang pari ay tagasuri at nagbibigay ng awtoritatibong hatol tungkol sa ritwal na kalagayan; hindi sinasabi ng teksto na siya ang nagpapagaling o naglilinis nito.
- issue: Tinutukoy ng pangwakas na טָהוֹר הוּא
  choice: Isinalin bilang “malinis iyon,” na pinakamalapit sa gramatikal na pagtukoy sa sugat.
  alternative: “Malinis siya,” na maaaring unawaing tumutukoy sa taong sinusuri.
  rationale: Panlalaking isahan ang panghalip at maaaring tumugma sa panlalaking נֶגַע. Pinananatili ng salin ang gramatikal na ugnayan nang hindi ikinakaila na ang hatol ay may implikasyon sa ritwal na katayuan ng taong sinusuri.
translation_notes:
  register: Makabagong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “pari,” “susuriin,” at “ipahahayag” para sa malinaw na tono ng legal at ritwal na tagubilin. Iniwasan ang teknikal na terminong medikal at ang salitang “ketong,” na mas tiyak kaysa sa Hebreong negaʿ.
