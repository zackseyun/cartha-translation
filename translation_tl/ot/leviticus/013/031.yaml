  to: At kung susuriin ng pari ang bahaging apektado ng pagkakaliskis[a], at makitang hindi ito mukhang mas malalim kaysa sa balat at walang itim na buhok dito, ibubukod ng pari ang bahaging apektado ng pagkakaliskis sa loob ng pitong araw.
