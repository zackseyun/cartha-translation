  source_fidelity: 'Tumpak ang kondisyunal na ayos, ang pagsusuri ng pari, ang pamantayang biswal na hindi mas malalim kaysa sa balat, ang kawalan ng itim na buhok, at ang pitong-araw na pagbubukod. Gayunman, ang “dulot ng” ay nagdaragdag ng ugnayang sanhi na wala sa Hebreo: ang נֶגַע הַנֶּתֶק ay apektadong bahaging kaugnay ng kondisyon, hindi bahaging ‘dulót’ nito.'
  naturalness: Malinaw at modernong Filipino ang pangungusap. Ang “bahaging apektado ng pagkakaliskis” ay mas likas at mas tumpak kaysa “bahaging may sakit na dulot ng pagkakaliskis.”
  terminology: Ang “pari,” “itim na buhok,” at “ibubukod” ay angkop. Pinanatili ang “pagkakaliskis” bilang maingat na di-tiyak na salin ng נֶתֶק. Inayos ang talababa upang hindi ipakita ang “galis” bilang isang tiyak na modernong diagnosis.
