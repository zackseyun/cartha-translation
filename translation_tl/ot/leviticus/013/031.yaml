base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: tl
  text: At kung susuriin ng pari ang bahaging apektado ng pagkakaliskis[a], at makitang hindi ito mukhang mas malalim kaysa sa balat at walang itim na buhok dito, ibubukod ng pari ang bahaging apektado ng pagkakaliskis sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kati” o, sa tradisyonal na salin, “galis”; ang Hebreong נֶתֶק ay tumutukoy sa isang natatanging kondisyon ng balat o anit sa kabanatang ito, na madalas na iniuugnay sa pagkalagas ng buhok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִרְאֶה
  choice: At kung susuriin
  rationale: Pinananatili ng “At kung” ang ugnayan sa naunang batas, at ipinahahayag ng “susuriin” ang legal at masusing pagtingin ng pari.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan, malinaw, at angkop na salin para sa paring nagsasagawa ng ritwal na pagsusuri.
- source_word: נֶגַע הַנֶּתֶק
  choice: ang bahaging may sakit na dulot ng pagkakaliskis
  rationale: Ipinakikita ng “bahaging may sakit” ang nakikitang apektadong bahagi, habang ang “pagkakaliskis” ay isang malinaw ngunit hindi labis na tiyak na paglalarawan sa natatanging kondisyong נֶתֶק.
- source_word: וְהִנֵּה
  choice: at makitang
  rationale: Likas sa Filipino sa konteksto ng pagsusuri at naihahatid ang biglang pagtukoy sa resulta ng pagmamasid.
- source_word: אֵין מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: hindi ito mukhang mas malalim kaysa sa balat
  rationale: Pinananatili ang aspektong biswal ng מַרְאֵה at ang paghahambing sa balat, nang hindi ipinapalagay na aktuwal na lalim ang sinusukat.
- source_word: שֵׂעָר שָׁחֹר
  choice: maitim na buhok
  rationale: Ang “maitim” ay natural na paglalarawan sa Filipino para sa שָׁחֹר sa buhok at pinananatili ang kulay bilang pamantayan sa pagsusuri.
- source_word: וְהִסְגִּיר
  choice: ibubukod
  rationale: Ipinahahayag ang pansamantalang paghihiwalay para sa pagmamasid nang hindi ipinapasok ang mas makabagong teknikal na diwa ng “quarantine.”
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na Filipino para sa itinakdang tagal ng pagbubukod.
