  terminology: Ang “pari,” “malinis,” at “ipahahayag ... na malinis” ay angkop sa modernong Filipino Tagalog at wastong naghihiwalay sa ritwal na hatol ng pari at sa paggaling sa karamdaman. Pinananatili ng “kondisyong may kaliskis” ang pag-iingat laban sa sobrang tiyak na diagnosis.
