base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: tl
  text: Sa ikapitong araw, susuriin ng pari ang kondisyong may kaliskis[a]. Kung hindi ito kumalat sa balat at hindi mukhang nakalubog kaysa sa nakapaligid na balat[b], ipahahayag ng pari na malinis ang taong iyon[c]. Lalabhan ng taong iyon ang kanyang mga damit, at magiging malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kondisyong nangangati” o, sa tradisyonal na salin, “scall.” Ang Hebreong neṭeq ay tumutukoy sa isang natatanging kondisyon sa anit o balbas, ngunit hindi matiyak kung anong makabagong sakit ang katumbas nito.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “hindi mas malalim kaysa sa balat.” Isa itong pamantayan sa pagsusuri ng pari: ang apektadong bahagi ay hindi mukhang nakalubog kaysa sa nakapaligid na balat.'
    reason: cultural_note
  - marker: c
    text: Ang “ipahahayag ... na malinis” ay opisyal na pasiya tungkol sa ritwal na katayuan ng tao; hindi nito ibig sabihing pinagaling ng pari ang kondisyon.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: impeksiyong nangangaliskis
  rationale: Tumutukoy ito sa isang natatanging kondisyon sa anit o balbas na sinusuri ng pari. Inilalarawan ng salin ang nakikitang kondisyon nang hindi ito itinutumbas sa isang tiyak na makabagong diagnosis.
- source_word: פָשָׂה
  choice: kumalat
  rationale: Sa kontekstong ito ng pagsusuri, ang pandiwa ay tumutukoy sa paglawak ng apektadong bahagi sa balat.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Natural ito sa modernong Tagalog at angkop sa ideya ng pagkalat sa bahagi ng balat.
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: hindi mukhang mas malalim kaysa sa balat
  rationale: Pinananatili ang biswal na katangian ng pamantayan at ang paghahambing sa nakapaligid na balat, nang hindi nagdaragdag ng modernong paliwanag medikal sa pangunahing teksto.
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: ipahahayag ng pari na malinis ang taong iyon
  rationale: Sa batas tungkol sa ritwal na kalinisan, nagbibigay ang pari ng opisyal na pasiya sa katayuan ng tao; hindi sinasabing siya ang nagpapagaling sa kondisyon.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Lalabhan ng taong iyon ang kanyang mga damit
  rationale: Ginawang tahasan ang gumagawa upang maiwasan sa Tagalog ang maling pagkaunawang ang pari ang maglalaba.
- source_word: וְטָהֵר
  choice: at magiging malinis siya
  rationale: Ipinapahayag nito ang magiging malinis na katayuan matapos labhan ang mga damit.
- source_word: וְרָאָה
  choice: susuriin
  rationale: Hindi lamang simpleng pagtingin ang kilos kundi isang pormal na pagsusuri ng pari.
- source_word: וְהִנֵּה
  choice: Kung
  rationale: Sa pormulang ito ng pagsusuri, ipinakikilala ng salita ang kondisyong napansin ng pari; natural na naihahayag sa Tagalog sa pamamagitan ng 'kung'.
theological_decisions:
- issue: Uri ng kilos ng pari sa batas tungkol sa ritwal na kalinisan
  choice: Opisyal na ipinahahayag ng pari na malinis ang tao.
  alternative: Nililinis ng pari ang tao.
  rationale: Ang Hebreong טהר sa kontekstong legal at pangritwal ay tumutukoy sa pagpapasiya sa katayuan. Iniiwasan ng salin ang pahiwatig na ang pari mismo ang nagpapagaling o mahiwagang nagpapadalisay sa tao.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “pari” para sa כֹּהֵן at “malinis” para sa ritwal na katayuan, habang iniwasan ang labis na teknikal na terminong medikal at denominasyonal na pagpapakahulugan.
