base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: tl
  text: Susuriin ng pari ang bahaging may sakit.[a] Kapag nakita niyang mas malalim kaysa sa balat ang anyo nito at may manipis na dilaw na buhok doon, ipahahayag ng pari na marumi ang taong iyon. Iyon ay netek,[b] isang sakit sa balat na nasa ulo o balbas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “bahaging may sakit” ay maaari ring isaling “apektadong bahagi”; hindi tinutukoy ng salitang Hebreo ang isang tiyak na modernong sakit.
    reason: lexical_alternative
  - marker: b
    text: Ang netek ay isang partikular na uri ng karamdaman sa ulo o balbas, ngunit hindi tiyak ang eksaktong modernong katumbas nito; tradisyonal din itong isinasaling “galis.”
    reason: lexical_alternative
  - marker: c
    text: Ang salitang Hebreo na karaniwang isinasaling “ketong” ay mas malawak kaysa sa Hansen's disease at maaaring tumukoy sa iba't ibang malubhang sakit sa balat. Ang “marumi” rito ay isang hatol tungkol sa ritwal na kalagayan ayon sa batas.
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: bahaging may sakit
  rationale: Tumutukoy ito sa nakikitang apektadong bahagi na sinusuri ng pari; malinaw at likas ito sa modernong Filipino nang hindi ipinapalagay ang isang tiyak na medikal na diagnosis.
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: mas malalim ang anyo nito kaysa sa balat
  rationale: Pinananatili ang diagnostic na paglalarawan at ang bahagyang di-tiyak na ideya ng anyong tila nasa ilalim o nakalubog kaysa sa balat.
- source_word: שֵׂעָר צָהֹב דַּק
  choice: manipis na dilaw na buhok
  rationale: Tuwirang pinananatili ang parehong katangiang kulay at nipis ng buhok.
- source_word: וְטִמֵּא אֹתוֹ
  choice: ipahahayag ng pari na marumi ang taong iyon
  rationale: Ipinakikita nitong ang pari ay nagbibigay ng hatol tungkol sa ritwal na kalagayan, hindi siyang sanhi ng karumihan.
- source_word: נֶתֶק
  choice: netek
  rationale: Hindi tiyak ang eksaktong sakit na tinutukoy. Ang transliterasyon ay umiiwas sa maling pagkakakilanlan sa isang modernong kondisyon, habang nililinaw ito sa talababa.
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Mas malawak ang saklaw ng salitang Hebreo kaysa sa modernong ketong o Hansen's disease, kaya iniiwasan ang mapanlinlang na medikal na espesipikasyon.
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: ng ulo o balbas
  rationale: Malapit sa anyong Hebreo at pinananatili ang dalawang lokasyon nang hindi ginagawang mas tiyak ang 'ulo' bilang anit.
theological_decisions:
- issue: Kahulugan ng pagiging 'marumi'
  choice: marumi
  alternative: ritwal na marumi
  rationale: Pinananatili sa pangunahing teksto ang maikli at paulit-ulit na terminong ginagamit sa batas; ipinapaliwanag sa talababa na ritwal ang konteksto upang hindi ito mapagkamalang simpleng moral na paghatol.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang ayos ng pangungusap at ang teknikal na transliterasyong “netek” dahil walang tiyak at hindi mapanlinlang na pang-araw-araw na katumbas. Ang וְהִנֵּה ay likas na inihayag sa kondisyong “Kung makitang” sa halip na literal na “narito,” na magiging pilit sa Filipino.
