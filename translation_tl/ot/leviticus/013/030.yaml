    rationale: Matapos suriin ng pari ang apektadong bahagi, ang teksto ay nagsasabing “at narito, ang anyo nito ay mas malalim...”; hindi nito tuwirang sinasabing “kung.” Ang “makikita niyang” ay nagpapanatili ng daloy at ng diagnostic na obserbasyon.
  - severity: low
    issue: Kasama sa talababa a ang “sugat” bilang alternatibo ng “bahaging may sakit.”
    rationale: Ang נֶגַע ay maaaring tumukoy sa apektado o may karamdamang bahagi/marka, ngunit ang “sugat” ay masyadong tiyak at madaling magpahiwatig ng pinsala o wound.
  - severity: low
    issue: Ang “sakit sa balat ng ulo o balbas” ay maaaring maging bahagyang malabo sa Filipino.
    rationale: Ang “sakit sa balat na nasa ulo o balbas” ay mas tuwirang nagsasaad ng lokasyon na saklaw ng pariralang Hebreo.
