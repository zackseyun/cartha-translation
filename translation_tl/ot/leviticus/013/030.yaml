revisions:
- from: Susuriin ng pari ang bahaging may sakit.[a] Kung makitang mas malalim ang anyo nito kaysa sa balat at may manipis na dilaw na buhok doon, ipahahayag ng pari na marumi ang taong iyon. Iyon ay netek,[b] isang sakit sa balat ng ulo o balbas.[c]
  to: Susuriin ng pari ang bahaging may sakit.[a] Kapag nakita niyang mas malalim kaysa sa balat ang anyo nito at may manipis na dilaw na buhok doon, ipahahayag ng pari na marumi ang taong iyon. Iyon ay netek,[b] isang sakit sa balat na nasa ulo o balbas.[c]
  rationale: Pinalitan ang hayag na kondisyong “Kung makitang” ng “Kapag nakita niyang,” na mas natural sa Filipino bilang paglalahad ng pamantayang diagnostiko habang mas malapit sa obserbasyong וְהִנֵּה. Nilinaw rin ang lokasyon ng sakit at inalis ang hindi ligtas na alternatibong “sugat” sa talababa. Napanatili ang di-tiyak na pagkakakilanlang medikal ng netek at צָרַעַת.
  reviewer_model: gpt-5.6-terra
