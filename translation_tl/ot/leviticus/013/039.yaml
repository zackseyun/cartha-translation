  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: tl
  text: Susuriin ng pari. Kung may makikita siyang mapuputlang puting batik sa balat ng katawan, ito ay isang pantal na tumubo sa balat[a]; malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “paglitaw sa balat” o “batik sa balat.” Ang salitang Hebreo ay tumutukoy sa kondisyong hindi nagdudulot ng ritwal na karumihan at naiiba sa ibang kundisyon sa balat na tinatalakay sa kabanatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Susuriin
  rationale: Sa konteksto ng Levitico 13, ang pandiwa ay tumutukoy sa masusing pagtingin ng pari upang magbigay ng pasiya, hindi sa simpleng pagkakita lamang.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang makabagong salin para sa opisyal na nagsasagawa ng pagsusuri sa kabanatang ito.
- source_word: בְעוֹר בְּשָׂרָם
  choice: sa balat ng kanilang katawan
  rationale: Pinananatili ang pangmaramihang hulaping Hebreo at ipinapahayag sa natural na Tagalog ang kongkretong pariralang tumutukoy sa balat ng laman.
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: mapuputlang puting batik
  rationale: Ang כֵּהוֹת ay nagpapahiwatig na hindi matingkad ang kaputian; ang “batik” ay natural na tawag sa nakikitang marka sa balat.
- source_word: בֹּהַק
  choice: pantal lamang iyon sa balat
  rationale: Ang bihirang terminong ito ay tumutukoy sa kondisyong naiiba sa karumaldumal na sakit sa balat na tinatalakay sa konteksto. Ang “lamang” ay naghahayag ng kontrast na nasa hatol, nang hindi nagbibigay ng tiyak na makabagong diyagnosis.
- source_word: פָּרַח
  choice: pantal ... sa balat
  rationale: Ang paglitaw o pagsibol sa balat ay likas nang ipinahihiwatig ng pariralang Tagalog; iniwasan ang literal na “namulaklak,” na maaaring makalito.
- source_word: טָהוֹר הוּא
  choice: malinis ang taong iyon
  rationale: Ang “malinis” ang maikli at karaniwang panumbas sa legal at rituwal na hatol sa Levitico; hindi ito ipinakahulugang moral na kadalisayan o medikal na paggaling.
theological_decisions:
- issue: Kalikasan ng hatol ng pari
  choice: malinis ang taong iyon
  alternative: malinis siya ayon sa ritwal
  rationale: Pinananatili ng “malinis” ang kategoryang legal at rituwal ng teksto nang hindi nagdaragdag ng paliwanag sa mismong talata. Iniiwasan din nitong gawing pahayag tungkol sa moralidad o ganap na kalusugan ang hatol.
- issue: Pagpapalit mula pangmaramihang tinutukoy tungo sa isahang hatol
  choice: kanilang katawan ... ang taong iyon
  alternative: kanyang katawan ... malinis siya
  rationale: Pinananatili ang tunay na pagbabago sa Hebreo mula sa pangmaramihang hulapi sa בשרם tungo sa isahang panlalaking pahayag na טהור הוא, habang ginagawa itong mauunawaan bilang hatol sa bawat taong sinusuri.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang himig. Ginawang tuwiran ang pamamaraang legal sa halip na piliting tularan ang Hebreong “at narito,” na magiging di-likas sa Tagalog. Ginamit ang “pantal” bilang madaling maunawaang pangkalahatang tawag, at inilagay sa talababa ang leksikal na kalabuan ng bihirang בֹּהַק.
