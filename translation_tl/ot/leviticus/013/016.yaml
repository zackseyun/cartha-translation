  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: tl
  text: O kung ang hilaw na laman[a] ay bumalik at pumuti, pupunta siya sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “buhay na laman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ כִ֥י
  choice: O kung
  rationale: Likas na ipinapahayag sa Tagalog ang alternatibong kondisyong ipinakikilala ng אוֹ kasunod ang כִּי.
- source_word: יָשׁ֛וּב
  choice: bumalik sa dati
  rationale: Pinananatili ang diwa ng pagbabalik o pagbaligtad ng kalagayan mula sa naunang anyo.
- source_word: הַבָּשָׂר הַחַי
  choice: ang hilaw na laman
  rationale: Sa konteksto ng pagsusuri sa sakit sa balat, tumutukoy ito sa nakalitaw at hilaw na buhay na laman; mas malinaw sa karaniwang mambabasa kaysa sa literal na 'buhay na laman.'
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: at pumuti
  rationale: Natural at tuwirang inilalarawan ang pagbabago ng kalagayan tungo sa kulay puti.
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: pupunta siya sa pari
  rationale: Ipinapahayag ang kasunod na hakbang sa legal na pamamaraan nang hindi dinaragdagan ang lakas ng obligasyon na wala sa anyong Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “pari” para sa כֹּהֵן at ang idiomatikong “hilaw na laman” para sa teknikal na paglalarawan ng nakalitaw na tisyu.
