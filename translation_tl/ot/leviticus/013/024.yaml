base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: tl
  text: O kung ang isang tao ay magkaroon ng paso dahil sa apoy sa kaniyang balat[a], at ang buhay na laman sa bahaging napaso[b] ay maging isang maningning na batik, maputi at mamula-mula, o maputi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “laman” ang salitang Hebreo, ngunit sa batas na ito ay tumutukoy ito sa katawan ng taong may paso.
    reason: lexical_alternative
  - marker: b
    text: Ang “buhay na laman” ay tumutukoy sa buhay o hilaw na tisyu na nakikita sa bahaging napaso.
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: O kung
  rationale: Ipinakikilala nito ang isa pang posibleng kaso sa tagubiling legal at likas na ipinahahayag sa Filipino ang pasubaling diwa.
- source_word: בָשָׂר
  choice: isang tao
  rationale: Literal itong 'laman,' ngunit dito ay tumutukoy sa taong may pinsala sa balat; mas natural sa modernong Filipino ang 'isang tao' sa ganitong paglalarawan.
- source_word: בְּעֹרוֹ
  choice: sa balat
  rationale: Tumutukoy ito sa balat ng taong sinusuri; sapat at natural ang 'sa balat' dahil malinaw na ang tinutukoy na tao.
- source_word: מִכְוַת אֵשׁ
  choice: paso sa apoy
  rationale: Tumpak at karaniwang parirala ito para sa pinsalang dulot ng apoy.
- source_word: וְהָיְתָה
  choice: ay maging
  rationale: Inilalarawan ang susunod na kalagayan sa kasong sinusuri at pinananatili ang aspektong pagbabago.
- source_word: מִחְיַת הַמִּכְוָה
  choice: ang buhay na laman sa bahaging napaso
  rationale: Ang מִחְיָה sa kontekstong ito ay buhay o hilaw na tisyu na nakikita sa lugar ng paso; pinananatili ng 'buhay na laman' ang leksikal na larawan nang may paglilinaw sa lokasyon.
- source_word: בַּהֶרֶת
  choice: maputing batik
  rationale: Sa Levitico 13, tumutukoy ito sa kapansin-pansing maliwanag o maputing bahagi ng balat; idiomatiko sa Filipino ang 'maputing batik.'
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: maputing batik na mamula-mula
  rationale: Pinananatili ang pinagsamang puti at mapulang kulay nang hindi labis na pinipirmi kung alin ang nangingibabaw.
- source_word: אוֹ לְבָנָה
  choice: o maputi
  rationale: Tuwirang pinananatili ang alternatibong paglalarawan sa kulay.
