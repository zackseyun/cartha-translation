  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: tl
  text: Pagkatapos, iuutos ng pari na labhan ang bagay na may marka[a], at ibubukod[b] niya ito nang pitong araw sa ikalawang pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang bagay na kinaroroonan ng marka.” Sadyang malawak ang Hebreong pananalita at tumutukoy sa bagay na sinusuri.
    reason: lexical_alternative
  - marker: b
    text: O “ihihiwalay” o, mas pormal, “ikukulong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: Pagkatapos, iuutos ng pari
  rationale: Ang waw + perfect sa sunod-sunod na legal na tagubilin ay nagpapahayag ng kasunod na hakbang; natural itong isinalin sa hinaharap na anyo sa Filipino.
- source_word: וְכִבְּסוּ
  choice: na labhan
  rationale: Ang pandiwa ay pangatlong panauhang maramihan na may di-tinukoy na mga tagagawa. Pinananatili ng pasibong pawatas ang mga tagagawa bilang di-tiyak at natural na sumusunod sa 'iuutos.'
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: ang bagay na may pinsala
  rationale: Malawak at di-tiyak ang Hebreong parirala, na tumutukoy sa apektadong kasuutan, balat, o hinabing kagamitan sa konteksto. Ang 'bagay' ay hindi nagpapakitid sa saklaw nito.
- source_word: הַנֶּגַע
  choice: pinsala
  rationale: Sa konteksto ng mga bagay, tumutukoy ito sa nakikitang apektadong bahagi o mapaminsalang kondisyon. Ang 'pinsala' ay natural sa Filipino at hindi nagmumungkahi nang walang katiyakan na mikrobyolohikal ang sanhi.
- source_word: וְהִסְגִּירוֹ
  choice: at ibubukod niya iyon
  rationale: Ang pandiwa ay nangangahulugang isara o ihiwalay para sa pagsusuri. Malinaw ang 'ibubukod' sa makabagong Filipino habang iniiwasan ang makitid na medikal na pahiwatig ng 'ikuwarentenas.'
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: nang pitong araw sa ikalawang pagkakataon
  rationale: Tuwirang ipinahahayag ang haba at pag-uulit ng panahon ng pagbubukod.
