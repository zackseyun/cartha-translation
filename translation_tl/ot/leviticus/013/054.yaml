translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'labhan' dahil mga bagay na nahuhugasan ang tinutukoy sa konteksto, at 'ibubukod' upang maipahayag ang pansamantalang paghihiwalay para sa muling pagsusuri nang hindi labis na ginagawang medikal ang termino.
