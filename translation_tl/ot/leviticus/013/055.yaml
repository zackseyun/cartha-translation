revisions:
- from: Pagkatapos hugasan ang bahaging may pinsala, susuriin iyon ng pari. Kung hindi nagbago ang anyo[a] ng pinsala at hindi ito kumalat, marumi pa rin iyon. Dapat ninyo itong sunugin sa apoy; ito ay pagkasira na patuloy na kumakain sa materyal[b], nasa isang panig man nito o nasa kabila.[c]
  to: Pagkatapos hugasan ang bahaging may pinsala, susuriin iyon ng pari. Kung hindi nagbago ang anyo[a] ng pinsala at hindi ito kumalat, marumi iyon. Dapat mo itong sunugin sa apoy; ito ay mapanirang pinsala sa materyal, maging nasa isang panig nito o nasa kabila.[c][b]
  rationale: Inalis ang dagdag na “pa rin” upang huwag magdagdag ng aspektong wala sa pinagmulan, at ginawang isahan ang utos na pagsunog upang tumugma sa Hebreo. Pinahusay din ang katawagan para sa פְּחֶתֶת upang maging mas natural na Filipino habang pinananatili ang mapanirang diwa at ang kawalang-katiyakan tungkol sa tiyak na uri ng pinsala.
