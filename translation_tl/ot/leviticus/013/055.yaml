  naturalness: Malinaw at modernong Filipino ang salin. Mas tuwiran at mas natural ang “mapanirang pinsala” kaysa sa mahaba at bahagyang di-karaniwang “pagkasira na patuloy na kumakain sa materyal.” Ang “maging nasa isang panig nito o nasa kabila” ay maayos na nag-iiwan ng kinakailangang pag-iingat sa mahirap na huling parirala.
