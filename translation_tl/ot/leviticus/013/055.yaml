base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: tl
  text: Pagkatapos hugasan ang bahaging may pinsala, susuriin iyon ng pari. Kung hindi nagbago ang anyo[a] ng pinsala at hindi ito kumalat, marumi iyon. Dapat mo itong sunugin sa apoy; ito ay mapanirang pinsala sa materyal, maging nasa isang panig nito o nasa kabila.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi nagbago ang kulay.” Sa literal, “hindi nagbago ang mata nito,” isang idyomang tumutukoy sa nakikitang anyo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakakain na pinsala” o “pagkasirang umuukit sa materyal.” Tumutukoy ang salitang Hebreo sa mapanirang paglala sa tela o katad.
    reason: lexical_alternative
  - marker: c
    text: Mahirap tiyakin ang huling parirala. Sa literal, “sa pagkakalbo nito o sa pagkakalbo ng noo nito.” Sa konteksto, malamang na tumutukoy ito sa magkaibang panig o ibabaw ng apektadong materyal.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: וְרָאָה
  choice: susuriin
  rationale: Sa konteksto ng pagsusuri ng pari, ang ראה ay higit sa simpleng pagtingin at tumutukoy sa masusing pagsisiyasat.
- source_word: אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע
  choice: pagkatapos hugasan ang bahaging may pinsala
  rationale: Ipinahahayag nito nang natural sa Filipino ang paghuhugas sa apektadong bahagi bago ang muling pagsusuri.
- source_word: הַנֶּגַע
  choice: pinsala / bahaging may pinsala
  rationale: Sa konteksto ng tela o katad, iniiwasan nito ang makabagong medikal na kahulugan ng “sakit” at malinaw na tinutukoy ang apektadong bahagi.
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: hindi nagbago ang anyo
  rationale: Ang literal na “hindi nagbago ang mata nito” ay idyomang tumutukoy sa nakikitang anyo, posibleng lalo na sa kulay.
- source_word: לֹא פָשָׂה
  choice: hindi ito kumalat
  rationale: Karaniwan at malinaw na katumbas ng פשה sa mga pagsusuri sa Levitico.
- source_word: טָמֵא הוּא
  choice: marumi pa rin iyon
  rationale: Ang “marumi” ang karaniwang katawagan sa rituwal na kalagayang tinutukoy sa mga batas ng Levitico; ipinapakita ng “pa rin” na hindi nabago ng kawalan ng pagkalat ang pasiya.
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: Dapat ninyo itong sunugin sa apoy
  rationale: Napananatili ang tuwirang legal na utos habang gumagamit ng natural na modernong Filipino.
- source_word: פְּחֶתֶת
  choice: pagkasira na patuloy na kumakain sa materyal
  rationale: Ipinahahayag ang mapanirang o corrosive na diwa ng bihirang salita nang hindi nagpapalagay ng tiyak na modernong uri ng amag o impeksiyon.
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: nasa isang panig man nito o nasa kabila
  rationale: Malabo ang literal na mga metapora ng pagkakalbo kapag inilapat sa tela o katad. Ang salin ay naghahatid ng malamang na pagtukoy sa dalawang panig o ibabaw, habang inilalahad sa talababa ang literal at ang kawalang-katiyakan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari,” “marumi,” at “sunugin sa apoy” upang mapanatili ang legal at rituwal na himig ng Levitico. Hindi pinilit gawing tiyak ang malabong huling pariralang Hebreo; natural ang pangunahing teksto at malinaw na ipinaliwanag ang literal na larawan sa talababa.
