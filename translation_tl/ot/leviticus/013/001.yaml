  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: tl
  text: 'Nagsalita si Yahweh[a] kay Moises at kay Aaron, at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH.” Karaniwang isinasalin itong “PANGINOON” sa maraming salin.'
