lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Ipinakikilala ng anyong pandiwa ang isang bagong pangyayari ng pagsasalita; ang “nagsalita” ay likas at marangal na katumbas ng דבר sa pormula ng banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kay Moises at kay Aaron
  rationale: Ang “kay” ang likas na pananda sa mga taong kinakausap sa modernong Tagalog; hindi kailangang ulitin bago ang ikalawang pangalan, bagaman malinaw pa rin ang koordinasyon.
- source_word: לֵאמֹר
  choice: na sinasabi,
  rationale: Pinananatili ang pormal na pang-ugnay na nagpapakilala sa nilalaman ng pahayag sa susunod na talata, sa halip na gawing hiwalay na pandiwang “sinabi.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa banal na pangalan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang bahagyang pormal na pormulang “na sinasabi” upang iugnay ang talata sa kasunod na mismong pahayag.
