  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pari” bilang pamilyar na katawagan at ang “ibubukod” upang ihatid ang pansamantalang paghihiwalay nang hindi nagdaragdag ng makabagong teknikal na konsepto ng kuwarantina.
