translation:
  language: tl
  text: Susuriin ng pari ang apektadong bahagi[a], at ibubukod[b] niya ang apektadong bahagi sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bahaging may marka,” “mantsa,” o ayon sa tradisyon, “salot.” Ang salitang Hebreo ay tumutukoy sa marka o bahaging sinusuri ng pari at hindi kinakailangang sa isang tiyak na uri ng sakit ayon sa makabagong medisina.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ikukulong” o, mas literal, “ipasasara.” Ang diwa rito ay pansamantalang pagbubukod upang mapagmasdan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Susuriin
  rationale: Bagaman pangunahing nangangahulugang “makita” ang ראה, tumutukoy ito rito sa opisyal na pagsusuri ng pari, kaya likas at tumpak ang “susuriin.”
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang katumbas ng כֹּהֵן sa kontekstong Levitico; ipinahahayag ng ayos ng pangungusap sa Filipino na ang pari ang tiyak na tagaganap.
- source_word: הַנָּגַע / הַנֶּגַע
  choice: ang bahaging may pinsala / ang bahaging iyon
  rationale: Ang נגע ay tumutukoy sa apektadong marka o bahagi na sinusuri, hindi kinakailangang sa isang tiyak na sakit ayon sa makabagong medisina. Pinananatili ng “bahaging may pinsala” ang lawak ng kahulugan, at malinaw na ibinabalik ng “bahaging iyon” ang ikalawang pagbanggit sa parehong נגע.
- source_word: וְהִסְגִּיר
  choice: at ibubukod niya
  rationale: Ang hiphil ng סגר ay literal na “ipasara” o “ikulong,” ngunit sa pamamaraang ito ay pansamantalang pagbubukod para sa pagmamasid. Malinaw at hindi labis na medikal ang “ibubukod.”
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Likas na pagpapahayag sa Filipino ng itinakdang tagal na pitong araw.
