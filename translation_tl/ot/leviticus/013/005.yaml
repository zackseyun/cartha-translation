base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: tl
  text: Susuriin siya ng pari sa ikapitong araw. Kung makitang hindi nagbago ang hitsura ng apektadong bahagi[a] sa paningin ng pari[b] at hindi ito kumalat sa balat, ibubukod[c] siya ng pari sa loob ng pitong araw sa ikalawang pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sugat” o “marka.” Ang Hebreong negaʿ ay tumutukoy rito sa nakikitang bahagi ng balat na sinusuri ng pari, hindi kinakailangang sa isang sakit na tiyak ang makabagong medikal na katawagan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nanatili sa kanyang mga mata,” isang idyomang nangangahulugang sa tingin ng pari ay hindi nagbago ang hitsura nito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ikukulong” o “ihihiwalay”; sa literal, “ipasasara siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: Susuriin siya
  rationale: Bagaman pangunahing nangangahulugang “makita” ang ראה, tumutukoy ito rito sa pormal na pagsusuri ng pari.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Likas at tiyak na paglalahad ng itinakdang panahon.
- source_word: וְהִנֵּה
  choice: Kung makitang
  rationale: Sa kontekstong legal, ipinakikilala nito ang kalagayang matutuklasan sa pagsusuri; malinaw at natural ang kondisyunal na anyo sa Tagalog.
- source_word: הַנֶּגַע
  choice: ang apektadong bahagi
  rationale: Saklaw nito ang nakikitang bahagi ng balat na sinusuri nang hindi ito agad tinutukoy bilang isang tiyak na sakit o sugat.
- source_word: עָמַד בְּעֵינָיו
  choice: hindi nagbago ang hitsura ... sa paningin niya
  rationale: Ipinahahayag ang kahulugan ng idyomang “nanatili sa kanyang mga mata” habang pinananatili ang pananaw ng paring nagsusuri.
- source_word: לֹא פָשָׂה
  choice: hindi ito kumalat
  rationale: Tuwirang inilalarawan ng פשׂה ang paglawak o pagkalat ng apektadong bahagi.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Karaniwan at natural na Tagalog para sa lokasyon ng pagkalat.
- source_word: וְהִסְגִּירוֹ
  choice: ibubukod siya
  rationale: Malinaw na ipinahahayag ang pansamantalang paghihiwalay nang hindi ipinapasok ang mas makabagong medikal na kahulugan ng “kuwarentenas.”
- source_word: שִׁבְעַת יָמִים
  choice: nang pitong araw
  rationale: Natural na pahayag ng tagal sa Tagalog.
- source_word: שֵׁנִית
  choice: sa ikalawang pagkakataon
  rationale: Hayagang pinananatili ang pag-uulit ng pitong-araw na pagbubukod.
