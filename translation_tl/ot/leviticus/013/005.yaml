  naturalness: Malinaw at marangal ang register. Mas magiging likas ang paglalagay ng “sa paningin ng pari” kaysa sa “sa paningin niya,” dahil iniiwasan nito ang anumang panandaliang kalabuan ng panghalip at pinananatili ang pananaw na nasa Hebreo.
