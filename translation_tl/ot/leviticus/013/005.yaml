  to: Susuriin siya ng pari sa ikapitong araw. Kung makitang hindi nagbago ang hitsura ng apektadong bahagi[a] sa paningin ng pari[b] at hindi ito kumalat sa balat, ibubukod[c] siya ng pari sa loob ng pitong araw sa ikalawang pagkakataon.
