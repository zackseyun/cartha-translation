translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang prosesong legal-rituwal at iniwasan ang labis na medikalisadong mga katawagang gaya ng “kuwarentenas” o isang tiyak na diagnosis.
