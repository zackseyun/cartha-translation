  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: tl
  text: At kung malagas ang buhok sa harapang bahagi ng kanyang ulo[a], kalbo siya sa harapang bahagi ng ulo; malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “makalbo sa harap” o “magkaroon ng pagkakalbo sa harapang bahagi ng ulo.” Ipinakikita ng terminong Hebreo na iba ito sa pagkakalbo sa likod ng ulo na binanggit sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: sa harap ng kanyang ulo
  rationale: Bagaman literal na pinagsasama ng parirala ang diwa ng “gilid/bahagi” at “kanyang mukha,” sa konteksto ay tumutukoy ito sa harapang bahagi ng anit.
- source_word: יִמָּרֵט
  choice: malagas ang buhok
  rationale: Ipinahihiwatig ng anyong Niphal na nakakalbo o nawawalan ng buhok ang bahaging tinutukoy. Natural at malinaw sa Tagalog ang “malagas ang buhok.”
- source_word: רֹאשׁוֹ
  choice: kanyang ulo
  rationale: Karaniwang katumbas nito sa kontekstong anatomikal.
- source_word: גִּבֵּחַ
  choice: panot siya sa noo
  rationale: Tiyak na tumutukoy ang salita sa pagkakalbo sa harap, na kaiba sa uri ng pagkakalbo sa naunang talata. Pinananatili ng salin ang mahalagang pagkakaibang ito.
- source_word: טָהוֹר
  choice: malinis
  rationale: Sa Levitico 13, ito ay terminong tumutukoy sa katayuang ritwal matapos ang pagsusuri, hindi sa moral na kadalisayan.
theological_decisions:
- issue: Terminolohiya ng katayuang ritwal sa mga batas tungkol sa kalinisan
  choice: malinis
  alternative: dalisay
  rationale: Ang talata ay tungkol sa pagsusuri sa kalagayan ng katawan at sa kaugnay nitong katayuang ritwal, hindi sa moral na katangian. Mas tumpak na pinananatili ng “malinis” ang kategorya sa Levitico.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “panot sa noo” upang malinaw na maiba ang frontal baldness sa pagkakalbo sa likod o tuktok, habang ang “malinis” ay nagpapanatili sa teknikal na kategoryang ritwal.
