translation:
  language: tl
  text: At susuriin siya ng pari, at makikita niyang may puting nakaangat na bahagi sa balat, at pinaputi nito ang buhok, at may buhay na laman sa nakaangat na bahaging iyon[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “buhay na laman.” Tumutukoy ito sa nakalantad na hilaw na tisyu sa loob ng nakaangat na bahagi. Ang “nakaangat na bahagi” ay maaari ring isaling “pamamaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: susuriin
  rationale: Sa konteksto ng legal na pagsusuri sa sakit sa balat, ang ראה ay tumutukoy sa masusing pagtingin o pagsusuri, hindi lamang sa pagkakita.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang salin ng כֹּהֵן at tumutukoy sa awtorisadong tagasuri sa mga tuntunin ng Levitico.
- source_word: וְהִנֵּה
  choice: kung may
  rationale: Sa pormulang nagsasaad ng resulta ng pagsusuri, natural na ipinahahayag sa Filipino ang deiktikong וְהִנֵּה bilang kondisyon ng kasong nasaksihan, nang hindi gumagamit ng lipas na “narito.”
- source_word: שְׂאֵת לְבָנָה
  choice: puting pamamaga
  rationale: Ang שְׂאֵת ay teknikal na tawag sa nakaangat o namamagang bahagi ng balat; malinaw at natural ang “pamamaga” sa Filipino.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Ang עוֹר ay balat; ang “sa balat” ang likas na lokatibong pahayag sa Filipino.
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: at pinaputi nito ang balahibo
  rationale: Pinananatili ang sanhi na ipinahahayag ng pambabaeng panghalip na tumutukoy sa pamamaga at ang pagbabago ng buhok o balahibo tungo sa puti.
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: at may lantad na buhay na laman
  rationale: Pinananatili ang literal at diagnostikong diwa ng “buhay na laman,” habang ipinahahayag ng “lantad” ang hilaw o nakalantad na tisyu.
- source_word: בַּשְׂאֵת
  choice: sa pamamaga
  rationale: Inuulit ang parehong katawagan para sa שְׂאֵת at inilalagay ang lantad na laman sa loob o bahagi ng pamamaga.
