  to: Kung ang bahid sa kasuotan, sa katad, sa mga sinulid na paayon o pahalang, o sa anumang bagay na yari sa katad ay maberde o mapula-pula, iyon ay bahid ng tsaraat[a] at dapat itong ipakita sa pari.
  rationale: Pinalitan ang “mapula” ng “mapula-pula” upang maipakita ang tinatayang mapulang kulay sa Hebreo, at bahagyang inayos ang simula ng pangungusap para sa mas likas na daloy sa Filipino. Hindi binago ang saklaw, teknikal na mga termino, o di-tiyak na pasibong anyo ng pinagmulan.
