  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: tl
  text: Kung ang bahid sa kasuotan, sa katad, sa mga sinulid na paayon o pahalang, o sa anumang bagay na yari sa katad ay maberde o mapula-pula, iyon ay bahid ng tsaraat[a] at dapat itong ipakita sa pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tsaraat” ay katawagang Hebreo para sa isang kategoryang ritwal at pisikal na sinusuri ng pari at maaari ring makita sa kasuotan o katad. Tradisyonal itong isinasaling “ketong,” ngunit hindi ito tumutukoy lamang sa modernong Hansen’s disease.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּגַע
  choice: bahid
  rationale: Tumutukoy ito sa nakikitang apektadong bahagi. Likas ang “bahid” para sa kasuutan, mga sinulid, at katad, at hindi nito ipinapalagay agad ang tiyak na sanhi.
- source_word: יְרַקְרַק
  choice: maberde
  rationale: Ipinahihiwatig ng anyong inuulit sa Hebreo ang kulay na kahawig ng berde, hindi kinakailangang matingkad o purong berde.
- source_word: אֲדַמְדָּם
  choice: mapula
  rationale: Ipinahihiwatig nito ang kulay na kahawig ng pula; pinananatili ng “mapula” ang tinatayang katangian ng obserbasyon.
- source_word: בֶּגֶד
  choice: kasuotan
  rationale: Karaniwang tumutukoy sa damit o kasuotang yari sa hinabing materyal. Ang “kasuotan” ay malinaw at marangal sa kasalukuyang Filipino.
- source_word: עוֹר
  choice: katad
  rationale: Sa talaang ito, materyal mula sa naprosesong balat ang tinutukoy, kaya mas tiyak ang “katad” kaysa “balat.”
- source_word: שְׁתִי ... עֵרֶב
  choice: mga sinulid na paayon o pahalang
  rationale: Tinutukoy ng dalawang terminong Hebreo ang warp at weft. Ang paglalarawang Filipino ay mas madaling maunawaan kaysa sa bihirang teknikal na mga katawagan habang pinananatili ang pagkakaiba ng direksiyon.
- source_word: כְּלִי עוֹר
  choice: anumang bagay na yari sa katad
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa sari-saring kagamitan o bagay; iniiwasan ng salin ang labis na pagtukoy sa isang uri lamang.
- source_word: נֶגַע צָרַעַת
  choice: bahid ng tsaraat
  rationale: Pinananatili ang natatanging kategoryang Hebreo sapagkat maaari itong makita sa tao, kasuutan, at katad at hindi katumbas ng isang tiyak na modernong sakit. Ipinaliliwanag ito sa talababa.
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: dapat itong ipakita sa pari
  rationale: Pasibo ang anyong Hebreo at hindi binabanggit kung sino ang magpapakita; pinananatili ng salin ang di-tiyak na gumagawa.
theological_decisions:
- issue: Kahulugan ng צָרַעַת sa mga tuntuning pangpari
  choice: tsaraat
  alternative: ketong
  rationale: Hindi lamang sakit sa balat ng tao ang saklaw ng צָרַעַת sa Levitico 13; ginagamit din ito para sa kasuutan at katad. Ang transliterasyon na may paliwanag ay umiiwas sa maling pagtumbas nito sa modernong Hansen’s disease at pinananatili ang natatanging kategoryang ritwal at pisikal ng teksto.
translation_notes:
  register: Gumamit ng makabagong, malinaw, at marangal na Filipino. Ang “maberde” at “mapula” ay likas na paglalarawan sa tinatayang kulay. Isinalin nang paliwanag ang teknikal na pares na warp at weft bilang “mga sinulid na paayon o pahalang.”
