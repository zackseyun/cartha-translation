  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: tl
  text: Ngunit kung talagang[b] kumalat sa balat ang pantal na nangangaliskis[a] matapos siyang humarap sa pari upang maituring na malinis[c], haharap siyang muli sa pari sa ikalawang pagkakataon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pantal,” “ang pamamantal,” o, ayon sa tradisyonal na salin, “ang langib.” Tumutukoy ang salitang Hebreo sa isang mababaw na kondisyon sa balat na sinusuri.
    reason: lexical_alternative
  - marker: b
    text: 'Pinatitingkad ng Hebreo ang pandiwa: “kung talagang kumalat ang pantal.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “upang maituring na malinis” ay tumutukoy sa proseso o layunin ng pagpapasuri upang kilalaning malinis ayon sa ritwal.
    reason: cultural_note
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: talagang kumalat
  rationale: Ang infinitive absolute na sinusundan ng imperfect ay nagbibigay-diin sa pagkalat. Likas sa modernong Tagalog ang “talagang kumalat” at pinananatili nito ang diin ng Hebreo.
- source_word: הַמִּסְפַּחַת
  choice: ang pantal na nangangaliskis
  rationale: Tumutukoy ang salita sa isang mababaw na kondisyon sa balat na sinusuri ng pari. Mas tiyak ito kaysa “langib,” na karaniwang tumutukoy ngayon sa namuong takip ng naghihilom na sugat.
- source_word: בָּעוֹר
  choice: sa balat
  rationale: Ipinapahayag nito ang kinaroroonan ng kondisyon. Walang tahasang panghalip na paari sa Hebreo, kaya hindi idinagdag ang “niya.”
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: matapos siyang humarap
  rationale: Sa konteksto ng pagsusuri ng pari, ipinahihiwatig ng anyong Niphal ang kusang pagharap o pagpapakita ng tao upang masuri.
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Ipinahihiwatig ng parirala ang paglapit at pagharap sa paring nagsasagawa ng pagsusuri.
- source_word: לְטָהֳרָתוֹ
  choice: upang maituring na malinis
  rationale: Sa kontekstong ito, ang paglilinis ay kaugnay ng pagsusuri at pagkilalang ritwal na malinis. Inihahatid ng salin ang layunin nang hindi nagpapahiwatig na karaniwang paghuhugas lamang ang tinutukoy.
- source_word: וְנִרְאָה שֵׁנִית
  choice: muli siyang haharap
  rationale: Sa legal na konteksto, ipinahihiwatig ng anyo ang kinakailangang ikalawang pagharap para sa panibagong pagsusuri.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinili ang “humarap sa pari” upang natural na maipahayag ang pormal na pagpapakita para sa pagsusuri, at iniwasan ang teknikal o denominasyonal na pananalita.
