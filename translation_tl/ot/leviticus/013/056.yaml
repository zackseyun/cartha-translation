  source_fidelity: Tumpak na naihahatid ang kondisyunal na utos, ang pagsusuri ng pari, ang pagkupas ng bahid matapos labhan, at ang pagpunit/pag-alis nito mula sa kasuotan, katad, o mga hibla ng hinabing materyal. Napananatili rin ang teknikal na pagkakaiba ng warp at weft.
  naturalness: May bahagyang paninigas sa “susuriin iyon ng pari at makitang.” Mas likas at malinaw ang “susuriin ito ng pari at makita niyang.” Inayos din ang paralelismo ng mga pariralang pinagmumulan ng pinupunit na bahagi.
  terminology: Ang “pari,” “bahid,” “katad,” at “paayon/pahalang na mga sinulid” ay angkop sa makabagong Filipino at sa kontekstong materyal. Ang talababa ay kapaki-pakinabang na paglilinaw sa mga terminong panghabi.
