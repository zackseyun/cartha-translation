- from: Ngunit kung susuriin iyon ng pari at makitang kumupas ang bahid matapos itong labhan, pupunitin niya ang bahaging iyon mula sa kasuotan, sa katad, o sa paayon o pahalang na mga sinulid[a].
  to: Ngunit kung susuriin ito ng pari at makita niyang kumupas ang bahid matapos itong labhan, pupunitin niya ang bahaging iyon mula sa kasuotan, sa katad, o sa mga paayon o pahalang na sinulid[a].
  rationale: Munting estilistikong rebisyon lamang ito upang gawing mas natural ang pagkakaugnay ng pagsusuri at pagkakita ng pari, at upang linawin ang paralelismong taglay ng listahan ng mga materyal. Hindi binago ang kahulugan o ang antas ng katiyakan ng pinagmulan.
