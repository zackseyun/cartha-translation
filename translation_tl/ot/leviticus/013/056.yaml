base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: tl
  text: Ngunit kung susuriin ito ng pari at makita niyang kumupas ang bahid matapos itong labhan, pupunitin niya ang bahaging iyon mula sa kasuotan, sa katad, o sa mga paayon o pahalang na sinulid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paayon” at “pahalang” na mga sinulid ay ang dalawang magkakrus na hanay ng sinulid na bumubuo sa hinabing tela; tinatawag din ang mga ito na warp at weft.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ang pagpapatuloy ng kondisyong legal at ang bahagyang pagsalungat nito sa naunang posibilidad.
- source_word: רָאָה הַכֹּהֵן
  choice: susuriin iyon ng pari
  rationale: Bagaman literal na “makikita,” tumutukoy ito rito sa opisyal at masusing pagsusuri ng pari.
- source_word: וְהִנֵּה
  choice: at makitang
  rationale: Natural na isinasama sa Filipino ang pantawag-pansing diin ng Hebreo sa pagkatuklas ng pari, nang hindi gumagamit ng lipas o mabigat na ekspresyon.
- source_word: כֵּהָה
  choice: kumupas
  rationale: Ipinapahayag na humina o nabawasan ang tindi ng nakikitang bahid pagkatapos labhan.
- source_word: הַנֶּגַע
  choice: ang bahid
  rationale: Sa konteksto ng tela o katad, tumutukoy ito sa apektadong marka o bahagi, hindi sa salot bilang malawak na kapahamakan.
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: matapos itong labhan
  rationale: Pinananatili ang pasibong anyo ng Hebreo at likas itong pakinggan para sa kasuotan, katad, o materyal na hinabi.
- source_word: וְקָרַע אֹתוֹ
  choice: pupunitin niya ang bahaging iyon
  rationale: Nililinaw ng konteksto na ang apektadong bahagi ang aalisin, hindi kinakailangang punitin o sirain ang buong bagay.
- source_word: מִן הַבֶּגֶד
  choice: mula sa kasuotan
  rationale: Ang “kasuotan” ay malinaw at sapat na malawak na katumbas ng בגד sa kontekstong ito.
- source_word: מִן הָעוֹר
  choice: sa katad
  rationale: Tumutukoy ang עור dito sa balat na ginawang materyal, kaya “katad” ang tiyak at likas na salin.
- source_word: מִן הַשְּׁתִי
  choice: sa paayon na mga sinulid
  rationale: Tumutukoy sa warp, ang mga sinulid na pahaba o paayon sa hinabing materyal.
- source_word: מִן הָעֵרֶב
  choice: pahalang na mga sinulid
  rationale: Tumutukoy sa weft o woof, ang mga sinulid na ipinapahalang sa mga paayong sinulid.
