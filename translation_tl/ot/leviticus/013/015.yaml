base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: tl
  text: Kapag nakita ng pari ang hilaw na laman[a], ipahahayag niyang marumi ang taong iyon[b]. Marumi ang hilaw na laman; sakit sa balat[c] iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “buhay na laman”; ayon sa nakaugaliang salin, “hilaw na laman.”
    reason: lexical_alternative
  - marker: b
    text: O “hahatulan niyang marumi ang taong iyon.” Gumagawa ang pari ng opisyal na pasya tungkol sa kalagayang ritwal.
    reason: lexical_alternative
  - marker: c
    text: Nakaugaliang isalin na “ketong,” ngunit mas malawak ang tinutukoy ng salitang Hebreo na sakit o kondisyon sa balat, at hindi lamang ang modernong Hansen’s disease.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה הַכֹּהֵן
  choice: Kapag nakita ng pari
  rationale: Ang waw + qatal sa kontekstong legal ay nagpapatuloy sa takdang pamamaraan; natural itong ipahayag sa Tagalog bilang sugnay na panahunan na “Kapag nakita,” hindi bilang payak na salaysay.
- source_word: הַבָּשָׂר הַחַי
  choice: ang hilaw na laman
  rationale: Literal itong “buhay na laman,” ngunit sa pagsusuri ng sakit sa balat ay tumutukoy sa nakalantad na buhay o hilaw na tisyu. Ang “hilaw na laman” ay malinaw at likas sa modernong Tagalog habang pinananatili sa talababa ang literal na anyo.
- source_word: וְטִמְּאוֹ
  choice: ipahahayag niyang marumi ang taong iyon
  rationale: Sa mga batas tungkol sa ritwal na kalinisan, ang piel ng טמא ay tumutukoy sa opisyal na pasya ng pari, hindi sa paggawa niyang marumi sa tao. Nililinaw ng “ipahahayag” ang tungkuling iyon.
- source_word: טָמֵא הוּא
  choice: Marumi ... iyon
  rationale: Ang “marumi” ang karaniwang terminong ritwal sa Levitico at pinananatili nito ang kategoryang legal-relihiyoso, hindi karaniwang karumihan lamang.
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Mas malawak ang saklaw ng terminong Hebreo kaysa sa modernong ketong o Hansen’s disease. Iniiwasan ng “sakit sa balat” ang maling tiyak na diagnosis.
theological_decisions:
- issue: Pagpapahayag o paglikha ng pagiging marumi
  choice: ipahahayag niyang marumi
  alternative: gagawin niyang marumi
  rationale: Ang pari ay nagbibigay ng opisyal na pasya tungkol sa kalagayang ritwal; hindi sinasabi ng teksto na siya ang sanhi ng karumihan.
- issue: Kahulugan ng צָרַעַת sa batas ng Levitico
  choice: sakit sa balat
  alternative: ketong
  rationale: Hindi dapat ipantay nang tiyak ang sinaunang kategoryang ito sa modernong Hansen’s disease. Pinananatili ng salin ang pangkalahatang katawagang dermatolohikal at ritwal.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Ginamit ang “pari,” “marumi,” at “sakit sa balat” upang mapanatili ang bokabularyong legal at ritwal ng Levitico nang hindi nagdaragdag ng tiyak na modernong diagnosis. Ang mga panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
