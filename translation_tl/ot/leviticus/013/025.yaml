source:
  edition: WLC
  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: tl
  text: Susuriin ito ng pari, at narito[a], pumuti ang buhok sa maputing batik at ang anyo nito ay mas malalim kaysa sa balat. Ito ay sakit sa balat na lumitaw sa bahaging napaso; ipahahayag ng pari na marumi siya. Ito ay sugat ng sakit sa balat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at narito”; ipinakikilala nito ang kalagayang napansin ng pari sa pagsusuri.
    reason: source_form
lexical_decisions:
- source_word: רָאָה
  choice: susuriin
  rationale: Sa konteksto ng pagsusuring isinasagawa ng pari, higit ito sa simpleng pagtingin at tumutukoy sa pormal na inspeksiyon.
- source_word: וְהִנֵּה
  choice: at kung makitang
  rationale: Sa pormulang diagnostiko, ipinakikilala nito ang napansing kalagayan; natural na naipapahayag sa Tagalog bilang “kung makitang” nang hindi nawawala ang diwa ng agarang obserbasyon.
- source_word: בַּהֶרֶת
  choice: maputing bahagi
  rationale: Tumutukoy ito sa maliwanag o maputing batik sa balat; ang “maputing bahagi” ay malinaw at hindi nagpapasok ng makabagong diagnosis.
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: ang buhok ... ay pumuti
  rationale: Pinananatili nito ang pagbabagong ipinahihiwatig ng pandiwa at natural sa modernong Tagalog.
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: mukha itong mas malalim kaysa sa balat
  rationale: Inilalarawan nito ang nakikitang lalim ng apektadong bahagi nang hindi ipinapalagay ang eksaktong medikal na kondisyon.
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Malawak ang saklaw ng terminong Hebreo at hindi ito dapat itumbas nang tuwiran sa modernong ketong o Hansen’s disease.
- source_word: מִכְוָה
  choice: bahaging napaso
  rationale: Tumutukoy sa lugar o bakas na dulot ng paso; natural at malinaw ito sa Tagalog.
- source_word: פָּרָחָה
  choice: lumitaw
  rationale: Sa konteksto ng sugat sa balat, inilalarawan nito ang pagsibol o paglitaw ng kondisyon sa bahaging napaso.
- source_word: טִמֵּא אֹתוֹ
  choice: ipahahayag ... na marumi
  rationale: Ang pari ay nagbibigay ng awtoritatibong hatol tungkol sa ritwal na kalagayan, hindi siyang sanhi ng karumihan.
- source_word: נֶגַע צָרַעַת
  choice: sugat ng sakit sa balat
  rationale: Ang נגע ay isang nakikitang salot, sugat, o apektadong bahagi; “sugat” ay madaling maunawaan at iniiwasan ang di-tiyak na pahiwatig ng impeksiyong medikal.
theological_decisions:
- issue: Pagsasalin ng צָרַעַת sa batas tungkol sa ritwal na kalinisan
  choice: sakit sa balat
  alternative: ketong
  rationale: Ang צָרַעַת ay mas malawak kaysa sa modernong Hansen’s disease. Iniiwasan ng “sakit sa balat” ang anakronistikong pagkakakilanlang medikal habang pinananatili ang kategoryang inilalarawan ng teksto.
- issue: Kahulugan ng “marumi” sa hatol ng pari
  choice: ipahahayag ... na marumi
  alternative: gagawing marumi
  rationale: Ipinakikita ng anyo at konteksto na kinikilala at ipinahahayag ng pari ang ritwal na kalagayan ng tao; hindi kinakailangang ipahiwatig na siya ang sanhi nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “marumi” sa ritwal na diwa ng kabanata, at iniwasan ang “ketong” upang hindi ipakahulugan ang צָרַעַת bilang tiyak na Hansen’s disease.
