  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: tl
  text: At kung ang isang lalaki o babae ay magkaroon ng mga maliwanag na batik sa balat ng kaniyang katawan—mga puting batik—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: ang isang lalaki o babae
  rationale: Tuwirang pinananatili ang pagbanggit sa kapuwa lalaki at babae at ang di-tiyak na isahan na angkop sa estilong pangkaso ng batas.
- source_word: כִּי יִהְיֶה
  choice: kung ... ay magkaroon
  rationale: Sa kontekstong legal at pagsusuri, likas na ipinakikilala ng כִּי ang isang kalagayan bilang kondisyon; ang 'magkaroon' ay natural na Tagalog para sa literal na ideyang 'mayroon/magkaroon.'
- source_word: בְּעוֹר בְּשָׂרָם
  choice: sa balat ng kaniyang katawan
  rationale: Ang עוֹר ay 'balat,' at ang בָּשָׂר dito ay tumutukoy sa katawan. Ginamit ang 'kaniyang' nang distributibo para sa bawat lalaking o babaeng tinutukoy.
- source_word: בֶּהָרֹת
  choice: mapuputing batik
  rationale: Sa kontekstong ito, tumutukoy ang salita sa maliwanag o mapusyaw na mga marka sa balat; natural at malinaw sa Filipino ang 'mapuputing batik.'
- source_word: בֶּהָרֹת לְבָנֹת
  choice: mga puting batik
  rationale: Malinaw na tinutukoy ng לְבָנוֹת na puti ang kulay. Pinananatili ng muling pagbanggit sa 'mga ... batik' ang pag-uulit at diin ng Hebreo nang hindi nagiging alanganin sa Tagalog.
