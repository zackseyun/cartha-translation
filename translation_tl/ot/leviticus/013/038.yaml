  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong kondisyonal at ang pag-uulit na mahalaga sa paglalarawang diagnostiko. Hindi nilagyan ng talababa sapagkat sapat na naipahahayag ng 'mapuputing batik' ang pinagsamang diwa ng ningning/pamumutla at puting kulay sa natural na Tagalog.
