  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: tl
  text: Ngunit kung ang maputing batik[a] ay nasa balat ng kanyang katawan, at hindi ito mukhang mas malalim kaysa sa balat, at ang buhok dito ay hindi pumuti, ihihiwalay[b] ng pari ang apektadong bahagi[c] sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maliwanag na batik” o “makintab na batik”; tumutukoy ito sa nakikitang marka sa balat.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ikukuwarentenas”; pansamantalang paghihiwalay para sa pagmamasid ang tinutukoy ng Hebreo.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, isang termino para sa apektadong marka o kondisyon na sinusuri ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת
  choice: maputing batik
  rationale: Tumutukoy ito sa isang maliwanag o maputing marka sa balat; natural sa modernong Tagalog ang “maputing batik” at naiiba ito sa bukol na binanggit sa naunang talata.
- source_word: לְבָנָה
  choice: maputi
  rationale: Tuwirang inilalarawan ng pang-uri ang kulay ng batik.
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: nasa balat ng kanyang katawan
  rationale: Ipinahahayag nito nang malinaw at natural ang Hebreong idyoma; ang בשר dito ay tumutukoy sa katawan.
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן הָעוֹר
  choice: hindi ito mukhang mas malalim kaysa sa balat
  rationale: Pinananatili ang batayang obserbasyon tungkol sa nakikitang lalim ng batik kung ihahambing sa balat.
- source_word: וּשְׂעָרָהּ לֹא הָפַךְ לָבָן
  choice: ang buhok dito ay hindi pumuti
  rationale: Ang buhok na kaugnay ng batik ang tinutukoy, at ang “pumuti” ay likas na paraan ng pagsasabi ng pagbabago ng kulay.
- source_word: וְהִסְגִּיר
  choice: ihihiwalay
  rationale: Ipinahihiwatig ng pandiwa ang pansamantalang pagbukod para sa pagmamasid; hindi ipinapalagay ang modernong medikal na kahulugan ng kuwarantina.
- source_word: אֶת־הַנֶּגַע
  choice: ang bahaging may sugat
  rationale: Ang נגע ay tumutukoy sa apektadong marka o kondisyon na sinusuri, hindi kinakailangang sa isang tiyak nang nasuring sakit.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural na Tagalog para sa itinakdang tagal ng paghihiwalay.
