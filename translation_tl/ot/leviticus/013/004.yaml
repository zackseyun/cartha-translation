  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “katawan” sa halip na literal na “laman” upang maiwasan ang maling kahulugang karne, at pinanatili ang wika ng nakikitang pagsusuri sa halip na magbigay ng modernong medikal na diagnosis.
