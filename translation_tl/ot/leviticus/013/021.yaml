  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang “pari” bilang karaniwang katawagan sa officiating examiner, “mapusyaw” para sa biswal na diwa ng כֵהָה, at “ibubukod” upang maiwasan ang sobrang medikal na espesipikasyon ng “kuwarentenas.”
