base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: tl
  text: Ngunit kung susuriin ito ng pari at makitang walang puting buhok dito, hindi ito mas malalim kaysa sa balat, at kupas ito, ibubukod[a] siya ng pari sa loob ng pitong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ilalagay sa kuwarentenas.” Ang pandiwang Hebreo ay tumutukoy sa pagbubukod sa tao upang obserbahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong kasalungat ng naunang sitwasyong sinusuri.
- source_word: יִרְאֶנָּה הַכֹּהֵן
  choice: susuriin iyon ng pari
  rationale: Bagaman literal na “makikita,” tumutukoy ang pandiwa rito sa maingat na pagsusuri ng pari; ang “iyon” ay tumutukoy sa apektadong bahagi.
- source_word: וְהִנֵּה
  choice: at makitang
  rationale: Likas na naihahatid sa Tagalog ang pormulang tumatawag-pansin sa natuklasan sa pagsusuri nang hindi gumagamit ng mabigat na literalismong “narito.”
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: walang puting buhok doon
  rationale: Tuwirang pinananatili ang pamantayang sinusuri at malinaw na iniuugnay ang buhok sa apektadong bahagi.
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: hindi iyon mas malalim kaysa sa balat
  rationale: Ang literal na diwang “hindi mas mababa/lubog” ay natural na ipinahahayag bilang hindi mas malalim kaysa sa balat.
- source_word: וְהִיא כֵהָה
  choice: at mapusyaw iyon
  rationale: Ang “mapusyaw” ay naghahayag ng kupas o hindi matingkad na anyo at pinananatili ang biswal na pamantayan ng Hebreo.
- source_word: וְהִסְגִּירוֹ
  choice: ibubukod siya ng pari
  rationale: Ang pandiwa ay tumutukoy sa pagbubukod sa tao upang obserbahan; pinananatili ng “siya” ang panlalaking isahang hulapi na tumutukoy sa taong sinusuri, hindi sa marka.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Natural at eksaktong pagpapahayag ng itinakdang tagal.
