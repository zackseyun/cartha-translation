base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: tl
  text: Sa ikapitong araw, susuriin siyang muli ng pari. Kung makita ng pari na kumupas ang karamdaman sa balat at hindi ito kumalat sa balat, ipahahayag ng pari na malinis siya. Isa itong makaliskis na pantal[a]. Lalabhan ng taong iyon ang kaniyang mga damit, at magiging malinis siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pantal” o “langib.” Hindi tiyak ang eksaktong uri ng kondisyong tinutukoy ng salitang Hebreo; waring isa itong mas banayad na pagputok sa balat, kaiba sa kondisyong patuloy na kumakalat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה ... שֵׁנִית
  choice: muli siyang susuriin
  rationale: Sa konteksto ng opisyal na pagsusuri ng pari, higit sa simpleng pagtingin ang diwa ng ראה; likas na ipinahahayag ng “susuriin” ang maingat na inspeksiyon, at ang “muli” ang pag-uulit na nasa שֵׁנִית.
- source_word: כֵּהָה הַנֶּגַע
  choice: kumupas ang sugat
  rationale: Ipinahihiwatig ng כֵּהָה na humina o nabawasan ang tindi ng nakikitang kondisyon. Karaniwan at malinaw sa Filipino ang “kumupas,” samantalang ang “sugat” ay madaling maunawaang katawagan sa nakikitang apektadong bahagi nang hindi ito tiyak na itinuturing na modernong medikal na impeksiyon.
- source_word: וְלֹא פָשָׂה הַנֶּגַע בָּעוֹר
  choice: hindi ito kumalat sa balat
  rationale: Tuwirang inilalarawan ng פָשָׂה ang paglawak ng kondisyon sa balat; malinaw at natural ang “kumalat sa balat.”
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ipahahayag siya ng pari na malinis
  rationale: Ang pandiwa rito ay tumutukoy sa awtoritatibong hatol ng pari tungkol sa rituwal na kalagayan, hindi sa pisikal na pagpapagaling o paglilinis.
- source_word: מִסְפַּחַת
  choice: makaliskis na pantal
  rationale: Tumutukoy ang bihirang terminong ito sa isang mas banayad na pagputok o kondisyon sa balat. Pinananatili ng “makaliskis na pantal” ang posibleng katangian nito nang hindi gumagamit ng labis na teknikal o makalumang salita.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: Lalabhan niya ang kanyang mga damit
  rationale: Natural at eksaktong modernong Filipino para sa paghuhugas ng sariling kasuotan.
- source_word: וְטָהֵר
  choice: at magiging malinis siya
  rationale: Ipinahahayag nito ang magiging rituwal na kalagayan pagkatapos labhan ang mga damit, nang hindi nagpapahiwatig ng medikal na paggaling.
theological_decisions:
- issue: Hatol tungkol sa rituwal na kalinisan laban sa pisikal na paggaling
  choice: “ipahahayag siya ng pari na malinis” at “magiging malinis siya”
  alternative: “lilinisin siya ng pari” o “gagaling siya”
  rationale: Ang talata ay tungkol sa pagpapasiya ng pari sa kalagayang rituwal ng tao. Hindi nito sinasabing ang pari ang pisikal na naglilinis o na ganap nang gumaling ang tao.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang “pari,” “sugat,” “pantal,” at “mga damit,” habang pinanatili ang legal at rituwal na diwa ng pagsusuri at pagpapahayag na malinis.
