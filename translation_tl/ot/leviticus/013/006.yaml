  source_fidelity: Kailangang alisin ang “lamang,” na nagdaragdag ng pagpapaliit na wala sa Hebreo. Dapat ding gawing malinaw na ang taong sinuri, hindi ang pari, ang maglalaba ng kaniyang mga damit.
  naturalness: Natural ang pangkalahatang rehistro, ngunit ang “Kung makitang” ay mas malinaw kung tahasang pari ang tagasuri, at ang “Lalabhan niya” ay maaaring maling maiugnay sa pari sa kasunod na pangungusap.
  terminology: Ang “malinis” at ang pagpapahayag ng pari ay angkop sa rituwal na hatol. Ang “karamdaman sa balat” ay mas ligtas kaysa “sugat,” na maaaring magpahiwatig ng literal na sugat; pinananatili ng talababa ang di-tiyak na kahulugan ng מִסְפַּחַת.
  issues:
