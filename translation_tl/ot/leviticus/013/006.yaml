    rationale: Walang katumbas ang “lamang” sa מִסְפַּחַת הִוא. Maaaring magpahiwatig ito ng antas ng pagmamaliit na hindi tahasang isinasaad ng teksto.
  - severity: medium
    issue: Malabo ang tinutukoy ng “niya” sa “Lalabhan niya ang kanyang mga damit.”
    rationale: Ang pinakamalapit na tahasang paksa ay ang pari. Sa Hebreo, ang taong sinuri ang maglalaba ng kaniyang damit, kaya kailangang linawin ito sa Filipino.
