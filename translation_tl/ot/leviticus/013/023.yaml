  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: tl
  text: Ngunit kung nananatili sa kinaroroonan nito[a] ang maputing batik at hindi ito kumalat, iyon ay peklat ng pigsa, at ipahahayag siya ng pari na malinis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ilalim nito”; sa kontekstong ito, ang ibig sabihin ay nananatili ang maputing batik sa dating kinaroroonan nito sa halip na kumalat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang pasubaling salungat sa naunang kalagayan habang pinananatili ang ugnayan ng pangungusap.
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: nananatili sa kinaroroonan nito
  rationale: Bagaman literal na “nakatayo sa ilalim nito,” ipinahihiwatig ng parirala sa kontekstong ito na hindi lumilipat o lumalawak ang batik.
- source_word: הַבַּהֶרֶת
  choice: ang maputing batik
  rationale: Tumutukoy sa isang kapansin-pansing maliwanag o maputing marka sa balat, nang hindi naglalagay ng mas tiyak na makabagong diagnosis.
- source_word: לֹא פָשָׂתָה
  choice: hindi ito kumalat
  rationale: Karaniwang gamit ng pandiwa sa kabanatang ito ang paglawak ng kondisyon sa balat.
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: peklat ng pigsa
  rationale: Likas at maikling Filipino para sa markang naiwan ng pamamaga o pigsa.
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: ipahahayag siya ng pari na malinis
  rationale: Ipinahahayag ng pari ang katayuang ritwal ng tao; hindi ipinahihiwatig na pisikal siyang nililinis o pinagagaling ng pari.
theological_decisions:
- issue: Ritwal na kalinisan laban sa pisikal na pagpapagaling
  choice: ipahahayag siya ng pari na malinis
  alternative: lilinisin siya ng pari
  rationale: Ang טהר sa kontekstong ito ay deklarasyon ng katayuang ritwal matapos ang pagsusuri, hindi kilos ng pagpapagaling o paghuhugas.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang karaniwang “pigsa” at “peklat,” habang pinanatili ang teknikal na pagkakaiba sa pagitan ng deklarasyong ritwal at pisikal na pagpapagaling.
