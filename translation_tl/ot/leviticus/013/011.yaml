base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: tl
  text: Isa itong matagal nang sakit sa balat ng kanyang katawan[a]. Ipahahayag ng pari na marumi siya; hindi siya ibubukod, sapagkat marumi siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “matagal nang sakit sa balat.” Karaniwang isinasalin ang צָרַעַת bilang “ketong,” ngunit mas malawak ang saklaw ng terminong Hebreo kaysa sa makabagong ketong o sakit na Hansen.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: sakit sa balat
  rationale: Saklaw ng terminong Hebreo sa Levitico ang iba't ibang malulubhang kondisyon sa balat, hindi lamang ang ketong o Hansen's disease. Iniiwasan ng saling ito ang maling tiyak na medikal na kahulugan.
- source_word: נוֹשֶׁנֶת
  choice: matagal na
  rationale: Ipinahihiwatig ng anyong participle ang isang kondisyong dati na o matagal nang umiiral. Natural at malinaw sa modernong Filipino ang “matagal na.”
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: sa balat ng kanyang katawan
  rationale: Pinananatili nito ang sanggunian sa pisikal na balat at inililipat ang בְּשָׂרוֹ bilang natural na “kanyang katawan,” sa halip na “kanyang laman,” na maaaring magkaroon ng ibang pahiwatig sa Filipino.
- source_word: וְטִמְּאוֹ
  choice: Ipahahayag siyang marumi
  rationale: Sa kontekstong pari at legal-ritwal, hindi ginagawa ng pari na marumi ang tao; opisyal niyang kinikilala at ipinahahayag ang kalagayan nito.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Tuwiran at karaniwang salin ng katungkulang panrelihiyon.
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: hindi na siya ibubukod
  rationale: Ang pandiwa ay tumutukoy sa pagbubukod sa tao upang obserbahan. Ang “ibubukod” ay malinaw at hindi labis na medikal gaya ng “ikukuwarentenas.” Ang “na” ay natural na nagpapahiwatig na hindi na kailangan ang karagdagang panahon ng pagsusuri dahil tiyak na ang hatol.
- source_word: כִּי טָמֵא הוּא
  choice: sapagkat marumi siya
  rationale: Tuwirang sugnay na nagbibigay ng dahilan kung bakit hindi na kailangan ang pagbubukod.
theological_decisions:
- issue: Pagsasalin ng terminolohiya ng ritwal na karumihan
  choice: marumi
  alternative: hindi malinis
  rationale: Ang טמא sa Levitico ay tumutukoy sa ritwal at legal na kalagayan, hindi sa personal na kasalanang moral. Ang “marumi” ay maikli, tradisyonal, at madaling panatilihing pare-pareho bilang susing termino.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “sakit sa balat” upang maiwasan ang maling espesipikong diyagnosis, at “ipahahayag siyang marumi” upang idiin ang opisyal na hatol ng pari, hindi ang paglikha niya ng karumihan.
