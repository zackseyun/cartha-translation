  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At ipinutong niya sa ulo niya ang turbante. Sa bandang harap ng turbante ay inilagay niya ang plakang ginto, ang banal na korona,[a] gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na diyadema.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: turbante
  rationale: Tumutukoy sa natatanging pantakip sa ulo ng mataas na pari. Ang “turbante” ay malinaw, karaniwan, at angkop sa konteksto ng kasuotang panseremonya.
- source_word: אֶל מוּל פָּנָיו
  choice: sa harapan ng turbante
  rationale: Ipinahihiwatig ng parirala na ang palamuting ginto ay nakakabit sa bahaging nakaharap sa unahan, hindi lamang nakalagay sa tapat ni Aaron.
- source_word: צִיץ
  choice: laminang ginto
  rationale: Bagaman maaari itong mangahulugang bulaklak o palamuti sa ibang konteksto, dito ay tumutukoy ito sa gintong bagay na ikinabit sa turbante; ang “lamina” ay nagsasaad ng manipis at patag na piraso ng metal.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: ang banal na korona
  rationale: Pinananatili nito ang tuwirang kahulugan ng pariralang Hebreo at ang pagkakakilanlan sa laminang ginto bilang banal na sagisag ng pagkakatalaga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: ipinutong ... inilagay
  rationale: 'Parehong pandiwa ang nasa Hebreo, ngunit likas sa Filipino ang bahagyang pag-iiba: ang turbante ay “ipinutong,” samantalang ang lamina ay “inilagay.”'
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Malinaw nitong ipinapahayag na ang ginawa ay ayon sa mismong utos ni Yahweh.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang orihinal ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng צִיץ at נֵזֶר הַקֹּדֶשׁ
  choice: Ang “banal na korona” ay panumbas na paglalarawan sa laminang ginto
  alternative: 'Dalawang magkahiwalay na bagay: isang lamina at isang banal na korona'
  rationale: 'Ang ayos ng Hebreo ay pinakamalinaw na binabasa bilang apposisyon: higit pang kinikilala ng “banal na korona” ang gintong lamina, bagaman nananatiling posible ang katawagang “banal na diyadema.”'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nito” upang tukuyin si Aaron nang hindi inuulit ang pangalan mula sa naunang konteksto; pinanatili ang terminong “turbante” at ang personal na pangalang “Yahweh.”
