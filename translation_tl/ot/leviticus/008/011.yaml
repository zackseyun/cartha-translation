  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: tl
  text: Winisikan niya ang altar ng kaunting langis nang pitong ulit,[a] at pinahiran niya ng langis ang altar at ang lahat ng kagamitan nito, pati ang palanggana at ang patungan nito,[b] upang italaga ang mga iyon bilang banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula rito,” na tumutukoy sa langis na pampahid na binanggit sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O, “ang palanggana at ang paanan nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז
  choice: Winisikan niya
  rationale: Ang Hiphil ng נזה ay tumutukoy sa ritwal na pagwiwisik ng likido; natural at malinaw sa modernong Tagalog ang “winisikan.”
- source_word: מִמֶּנּוּ
  choice: ng kaunting langis
  rationale: Literal itong “mula rito/mula roon,” na tumutukoy sa langis na pampahid sa naunang konteksto. Ginawang tahasan ang tinutukoy upang maging natural sa Tagalog, habang itinala sa talababa ang literal na anyo.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Karaniwan at madaling maunawaang katawagan sa dambanang pinaghahandugan sa kontekstong ritwal.
- source_word: שֶׁבַע פְּעָמִים
  choice: nang pitong ulit
  rationale: Tuwirang inilalarawan ang pitong pag-uulit ng ritwal na kilos.
- source_word: וַיִּמְשַׁח
  choice: at pinahiran niya ng langis
  rationale: Ipinapahayag ng משׁח ang ritwal na pagpapahid; ang pagbanggit sa langis ay likas sa Tagalog at malinaw sa konteksto.
- source_word: כָּל כֵּלָיו
  choice: ang lahat ng kagamitan nito
  rationale: Saklaw ng כְּלִי ang mga kasangkapan o kagamitang ginagamit kaugnay ng altar; “kagamitan” ang pinakamalawak at natural na katumbas.
- source_word: הַכִּיֹּר
  choice: ang hugasan
  rationale: Tumutukoy ito sa sisidlang hugasan sa tabernakulo. Ang “hugasan” ay malinaw at may angkop na dignidad; ibinigay sa talababa ang alternatibong “malaking palanggana.”
- source_word: כַּנּוֹ
  choice: ang patungan nito
  rationale: Ang כֵּן ay suportang kinatatayuan ng hugasan; natural at tiyak sa Tagalog ang “patungan.”
- source_word: לְקַדְּשָׁם
  choice: upang italaga ang mga iyon bilang banal
  rationale: Ipinapahiwatig ng קדשׁ dito ang pagbubukod sa mga bagay para sa banal na gamit. Pinananatili ng parirala ang ritwal na diwa nang hindi umaasa sa mas teknikal na “konsagrahin.”
theological_decisions:
- issue: Wikang ritwal para sa pagpapahid at pagpapabanal ng mga sagradong kagamitan
  choice: Gamitin ang malinaw ngunit marangal na “pinahiran ng langis” at “italaga ... bilang banal.”
  alternative: Gamitin ang mga terminong “pinahiran,” “konsagrahin,” o “pabanalin” nang walang karagdagang paglilinaw.
  rationale: Inilalarawan ng talata ang pagtatalaga ng mga bagay sa tabernakulo para sa banal na gamit. Pinananatili ng salin ang ritwal at teolohikal na bigat ng mga kilos, ngunit hindi nagdaragdag ng anumang doktrinang wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang mga kilalang katawagang ritwal tulad ng “altar” at “banal,” ngunit iniwasan ang hindi kailangang arkaiko o teknikal na pananalita.
