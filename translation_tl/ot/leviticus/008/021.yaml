base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Hinugasan niya sa tubig ang mga lamang-loob at mga binti. Pagkatapos, sinunog ni Moises sa altar ang buong lalaking tupa. Ito ay handog na sinusunog na may kalugud-lugod na samyo, isang handog na pinaraan sa apoy[a] para kay Yahweh, ayon mismo sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang handog na pagkain para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: mga lamang-loob
  rationale: Tumutukoy sa mga panloob na bahagi o organo ng hayop na inihahandog; malinaw at natural ito sa makabagong Tagalog.
- source_word: הַכְּרָעַיִם
  choice: mga binti
  rationale: Tumutukoy sa mga paa o ibabang bahagi ng mga binti ng hayop; ang “mga binti” ang pinakanatural na pangkalahatang salin sa kontekstong ito.
- source_word: רָחַץ בַּמָּיִם
  choice: hinugasan ... sa tubig
  rationale: Pinananatili ang tahasang pagbanggit sa tubig at ang kongkretong kilos sa ritwal.
- source_word: וַיַּקְטֵר
  choice: sinunog ... sa altar
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa pagsunog upang pumailanlang ang usok; natural sa Tagalog ang “sinunog,” at nililinaw ng altar ang natatanging ritwal na diwa.
- source_word: כָּל הָאַיִל
  choice: ang buong lalaking tupa
  rationale: Ipinahahayag ng כָּל na ang hayop ay inihandog nang buo, at ang אַיִל ay lalaking tupa.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Malinaw na katawagan sa uring ito ng handog, na buong sinusunog sa altar.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: na ang amoy ay kalugod-lugod
  rationale: Pinananatili ang pandamang talinghaga at ang diwa ng pagiging katanggap-tanggap o nakalulugod nang hindi ito ginagawang abstraktong paliwanag.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Tuwirang ipinakikita ang kaugnayan ng handog sa apoy at iniiwasang ituring na tiyak ang pinagtatalunang kahulugang “handog na pagkain.”
- source_word: לַיהוָה / יְהוָה
  choice: para kay Yahweh / Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa tekstong Hebreo, at natural ang “para kay” sa paghahandog.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ayon mismo sa iniutos ni Yahweh kay Moises
  rationale: Ipinakikita ng “mismo” ang eksaktong pagsunod na binibigyang-diin ng כַּאֲשֶׁר.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Kahulugan ng לְרֵיחַ נִיחֹחַ
  choice: na ang amoy ay kalugod-lugod
  alternative: para sa kaaya-ayang samyo
  rationale: Pinananatili ang larawan ng amoy at ang pahiwatig ng banal na pagkalugod, nang hindi ipinapaliwanag o inaalis ang teolohikal na tensiyon ng pananalita.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Ang anyo at eksaktong saklaw ng salita ay pinagtatalunan; pinipili ng pangunahing teksto ang malinaw na kaugnayan nito sa apoy, habang itinatala sa talababa ang lehitimong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga lamang-loob,” “mga binti,” at “lalaking tupa” para sa kongkretong wikang ritwal; pinanatili ang pangalang Yahweh at ang pandamang larawan ng kalugod-lugod na amoy.
