  source_fidelity: 'Tapat ang salin sa Hebreo: ang lahat ng bahagi ay inilagay sa mga palad ni Aaron at ng kanyang mga anak na lalaki; ang panghalip na “mga iyon” ay wastong tumutukoy sa mga bahaging handog; at ang ritwal na pagwagayway ay isinagawa sa harap ni Yahweh. Maingat ding pinananatili ng talababa ang literal na puwersa ng עַל nang hindi isinasara ang idiomatikong pagbasa sa pangunahing teksto.'
