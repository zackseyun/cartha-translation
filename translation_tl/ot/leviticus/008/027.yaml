  terminology: Wasto at pare-pareho ang “Yahweh,” “mga anak na lalaki,” at “handog na iwinawagayway.” Hindi pinapalitan ng salin ang tiyak na kasarian ng בָנָיו, at hindi nagdaragdag ng interpretasyong doktrinal.
