  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: tl
  text: Inilagay niya ang lahat ng iyon sa mga palad ni Aaron at sa mga palad ng kanyang mga anak na lalaki,[a] at iwinagayway niya ang mga iyon bilang handog na iwinawagayway sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibabaw ng mga palad ni Aaron at sa ibabaw ng mga palad ng kanyang mga anak na lalaki.” Ang pang-ukol sa Hebreo ay literal na “sa ibabaw,” ngunit maaaring ilarawan ng pananalita ang paglalagay ng mga bahagi sa nakabukang mga palad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Inilagay niya
  rationale: Sa kontekstong ito ng ritwal, ang נתן ay tumutukoy sa pisikal na paglalagay, hindi pangunahing sa paglilipat ng pagmamay-ari.
- source_word: אֶת הַכֹּל
  choice: ang lahat ng iyon
  rationale: Tumutukoy ito sa lahat ng bahaging tinipon sa naunang talata at pinananatili ang saklaw ng Hebreo.
- source_word: עַל כַּפֵּי
  choice: sa mga palad ni
  rationale: Ang כַּף ay palad o kamay, at ang 'sa mga palad' ay likas sa Tagalog habang hindi labis na nililinaw kung nasa ibabaw o nasa nakakuyom na mga kamay ang mga bahagi.
- source_word: וְעַל כַּפֵּי בָנָיו
  choice: at sa mga palad ng kanyang mga anak na lalaki
  rationale: Pinananatili ang inuulit na kayarian ng Hebreo at ang tiyak na panlalaking kahulugan ng בָּנָיו sa ritwal ng pagtatalaga sa mga pari.
- source_word: וַיָּנֶף
  choice: at iwinagayway niya
  rationale: Ang Hiphil ng נוף sa kontekstong panghandog ay ang ritwal na pagwagayway o paghaharap ng handog.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Malinaw na tumutukoy ang panghalip sa mga bahaging inilagay sa mga palad, hindi kina Aaron at sa kanyang mga anak.
- source_word: תְּנוּפָה
  choice: bilang handog na iwinawagayway
  rationale: Isinasalin ang teknikal na terminong panghandog at pinananatili ang ugnayan nito sa pandiwang 'iwinagayway.'
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na katumbas ng pormulang nangangahulugang isinagawa ang ritwal sa presensya ni Yahweh.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ang personal na pangalang Yahweh upang maging malinaw sa mambabasa na ang Hebreo ay may Tetragrammaton, nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Kasariang ipinahihiwatig ng בָנָיו
  choice: kanyang mga anak na lalaki
  alternative: kanyang mga anak
  rationale: Ang konteksto ay tumutukoy sa mga lalaking anak ni Aaron na itinatalaga bilang mga pari; mawawala ang tiyak na impormasyong ito sa payak na 'mga anak.'
- issue: Referente ng אֹתָם
  choice: ang mga iyon, ibig sabihin, ang mga bahagi ng handog
  alternative: sila, na maaaring mapagkamalang sina Aaron at ang kanyang mga anak
  rationale: Bagaman panlalaki ang panghalip sa Hebreo, ayon sa sintaks at ritwal na konteksto ang tinutukoy ay ang mga bagay na inilagay sa kanilang mga palad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang terminolohiyang pangritwal nang walang dagdag na paliwanag sa mismong talata; ang literal na posibilidad ng pang-ukol ay inilagay sa talababa.
