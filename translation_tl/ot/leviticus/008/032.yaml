base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: tl
  text: At ang matitira sa karne at sa tinapay ay susunugin ninyo sa apoy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “laman” sa halip na “karne.” Literal na “laman” ang salitang Hebreo, ngunit tumutukoy ito rito sa karne ng hayop na inihandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: At ang matitira
  rationale: Ang Niphal participle ay tumutukoy sa anumang maiiwan; natural sa makabagong Tagalog ang “ang matitira” at napapanatili nito ang substantibong diwa.
- source_word: בַּבָּשָׂר
  choice: sa karne
  rationale: Bagaman literal na “laman” ang בָּשָׂר, tumutukoy ito rito sa nakakain na bahagi ng hayop na inihandog; mas malinaw at natural sa kontekstong ito ang “karne.”
- source_word: וּבַלָּחֶם
  choice: at sa tinapay
  rationale: Karaniwang kahulugan ng לֶחֶם ang “tinapay,” at pinananatili ng “at sa” ang paralelismo sa naunang parirala.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Maaaring ipahayag ng ב ang paraan o saklaw ng pagsunog. Ang “sa apoy” ay tuwiran at likas na Tagalog para sa pagsunog sa pamamagitan ng apoy.
- source_word: תִּשְׂרֹפוּ
  choice: ay susunugin ninyo
  rationale: Ang ikalawang panauhang panlalaking maramihang imperfect sa kontekstong legal ay may puwersang pautos. Ang “susunugin ninyo” ay nagpapanatili ng pormal na tono ng tagubilin nang hindi nagiging artipisyal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang pormal na himig ng tagubiling pansamba. Ginamit ang “karne” sa pangunahing teksto para sa likas na pagkaunawa, habang inilagay sa talababa ang mas literal na “laman.”
