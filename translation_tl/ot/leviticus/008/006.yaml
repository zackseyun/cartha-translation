  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: tl
  text: Pagkatapos, inilapit ni Moises si Aaron at ang mga anak niyang lalaki at hinugasan sila ng tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: inilapit
  rationale: Ang Hiphil ng קרב ay nangangahulugang maglapit o dalhin nang malapit. Ang “inilapit” ay tuwiran at likas sa Filipino at pinananatili ang konkretong kilos sa tagpong ritwal.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: בָּנָיו
  choice: ang mga anak niyang lalaki
  rationale: Sa kontekstong ito, tumutukoy ang בנים sa mga lalaking anak ni Aaron na itatalaga bilang mga pari; nililinaw ng salin ang kasarian na tahasang nasa Hebreo.
- source_word: וַיִּרְחַץ
  choice: hinugasan
  rationale: Ang רחץ ay nangangahulugang maghugas o magpaligo. Ang “hinugasan” ay natural at hindi nagdaragdag ng detalye tungkol sa lawak o paraan ng paghuhugas.
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy ang panghalip na layon kay Aaron at sa kanyang mga anak na lalaki bilang isang pangkat.
- source_word: בַּמָּיִם
  choice: ng tubig
  rationale: Ipinapahayag ng בְּ ang tubig bilang gamit o paraan ng paghuhugas. Ang “hinugasan sila ng tubig” ang natural na katumbas sa Filipino.
- source_word: וַ
  choice: Pagkatapos
  rationale: Isinusulong ng waw-consecutive ang sunod-sunod na salaysay; malinaw na ipinahihiwatig ng “Pagkatapos” ang pagkakasunod ng pangyayari.
theological_decisions: []
