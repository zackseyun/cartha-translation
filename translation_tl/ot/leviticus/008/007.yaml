  source_fidelity: 'Kailangang baguhin ang mga panghalip na “rito/nito”: ang mga ito ay panlunan o panturo (“dito/ito”), samantalang ang Hebreo ay tumutukoy sa taong binibihisan, si Aaron. Ang binagong teksto ay pinananatili ang sunod-sunod na pagkakasuot at ang huling pagkakabit ng efod sa pamamagitan ng pamigkis nito.'
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “sa kaniya” at “binigkisan niya siya ng …” kaysa “rito” at “ibinigkis sa baywang nito.” Iniiwasan din nito ang di-sinasadyang paglalarawan kay Aaron bilang isang lugar o bagay.
  terminology: Ang “tunika,” “pamigkis,” “balabal,” at transliteradong “efod” ay angkop. Ang “mahusay na hinabing pamigkis ng efod” ay isang ligtas na salin ng teknikal na parirala, at pinananatili ng talababa ang mga makatwirang alternatibo.
  issues:
