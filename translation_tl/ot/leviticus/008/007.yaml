revisions:
- from: Isinuot niya rito ang tunika, ibinigkis sa baywang nito ang pamigkis, at isinuot dito ang balabal. Pagkatapos, ipinatong niya rito ang efod[a], ibinigkis sa baywang nito ang mahusay na hinabing pamigkis ng efod[b], at sa pamamagitan niyon ay ikinabit niya rito ang efod.[c]
  to: Isinuot niya sa kaniya ang tunika, binigkisan niya siya ng pamigkis, at isinuot niya sa kaniya ang balabal. Pagkatapos, isinuot niya sa kaniya ang efod[a], binigkisan niya siya ng mahusay na hinabing pamigkis ng efod[b], at sa pamamagitan ng pamigkis na ito ay ikinabit niya sa kaniya ang efod.[c]
