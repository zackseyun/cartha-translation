    issue: Maling gamit ng “rito/nito” para sa taong binibihisan
    rationale: Ang “rito” ay karaniwang nangangahulugang “dito/sa lugar na ito,” at ang “nito” ay tumutukoy sa bagay na malapit sa nagsasalita. Hindi nito wastong isinasalin ang mga panghalip na Hebreo para kay Aaron at nagiging hindi natural at malabo ang talata.
