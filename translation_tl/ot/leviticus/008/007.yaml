  text: וַ/יִּתֵּ֨ן עָלָ֜י/ו אֶת הַ/כֻּתֹּ֗נֶת וַ/יַּחְגֹּ֤ר אֹת/וֹ֙ בָּֽ/אַבְנֵ֔ט וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ אֶֽת הַ/מְּעִ֔יל וַ/יִּתֵּ֥ן עָלָ֖י/ו אֶת הָ/אֵפֹ֑ד וַ/יַּחְגֹּ֣ר אֹת֗/וֹ בְּ/חֵ֨שֶׁב֙ הָֽ/אֵפֹ֔ד וַ/יֶּאְפֹּ֥ד ל֖/וֹ בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: tl
  text: Isinuot niya sa kaniya ang tunika, binigkisan niya siya ng pamigkis, at isinuot niya sa kaniya ang balabal. Pagkatapos, isinuot niya sa kaniya ang efod[a], binigkisan niya siya ng mahusay na hinabing pamigkis ng efod[b], at sa pamamagitan ng pamigkis na ito ay ikinabit niya sa kaniya ang efod.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang efod ay isang natatanging kasuotang pangpari; walang eksaktong katumbas sa Tagalog ang salitang Hebreo.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin ang parirala bilang “masining na pamigkis ng efod” o “sinturon ng efod.”
    reason: lexical_alternative
  - marker: c
    text: Bihira ang pandiwang Hebreo rito. Malamang na nangangahulugan itong ikinabit o isiniguro sa kaniya ang efod sa pamamagitan ng hinabing pamigkis nito.
    reason: lexical_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: tunika
  rationale: Isang pangunahing kasuotang pangpari na isinusuot malapit sa katawan. Ang “tunika” ay maikli, malinaw, at angkop bilang katawagang pangkasuutan.
- source_word: אַבְנֵט
  choice: pamigkis
  rationale: Tumutukoy sa telang ipinupulupot o ibinibigkis sa baywang; likas at marangal ang “pamigkis” sa kontekstong seremonyal.
- source_word: מְעִיל
  choice: balabal
  rationale: Tumutukoy sa kasuotang panlabas na isinusuot sa ibabaw ng tunika.
- source_word: אֵפֹד
  choice: efod
  rationale: Isang natatanging kasuotang pangpari na walang ganap na katumbas sa Tagalog; pinanatili ang teknikal na katawagan sa anyong transliterado.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: mahusay na hinabing pamigkis ng efod
  rationale: Ipinahahayag ang hinabi o masining na pagkakagawa ng bahaging ito at ang tungkulin nitong pamigkis na kaugnay ng efod.
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: ibinigkis sa baywang nito
  rationale: Inilalarawan nang natural sa modernong Tagalog ang pagkakabit ng pamigkis sa katawan nang hindi gumagamit ng malabong literalismo.
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: sa pamamagitan niyon ay ikinabit niya rito ang efod
  rationale: Ang pambihirang pandiwang kaugnay ng “efod” ay malamang na tumutukoy sa pagkakabit o pagkakaseguro nito gamit ang hinabing pamigkis; nilinaw ang referent nang hindi itinatangging may leksikal na kahirapan ang parirala.
theological_decisions:
- issue: Pagsasalin ng mga katawagang pantanging kasuotang pangpari
  choice: Isinalin ang karaniwang mga kasuutan ngunit pinanatili bilang “efod” ang natatanging katawagang kultiko.
  alternative: Isalin ang efod nang paliwanag, gaya ng “kasuotang parang epron.”
  rationale: Pinananatili ng transliterasyon ang tiyak na katawagang pangpari at iniiwasang magpasok ng anyo ng kasuutan na hindi tahasang inilalarawan sa talata.
- issue: Kahulugan ng huling pariralang וַיֶּאְפֹּד לוֹ בּוֹ
  choice: Ipinahayag na ikinabit sa kanya ang efod sa pamamagitan ng pamigkis.
  alternative: Mas literal ngunit malabong “inefod niya ito sa kanya sa pamamagitan nito.”
  rationale: Malamang na inilalarawan ng parirala ang pagkakabit ng efod gamit ang sariling pamigkis nito. Inilagay sa talababa ang pagiging di-karaniwan ng pandiwa upang hindi magkunwaring ganap na tiyak ang kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “rito/nito” upang maging malinaw ang pagkakaiba ng gumagawa at ng sinusuotan, at hinati sa dalawang pangungusap ang mahabang serye ng mga kilos para sa likas na daloy nang hindi binabago ang pagkakasunod-sunod.
