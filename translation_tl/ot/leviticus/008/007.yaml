    issue: Malabo ang pantukoy sa huling “niyon”
    rationale: Bagaman nililinaw ng talababa ang tinutukoy, mas mainam sa pangunahing teksto na tahasang tukuyin ang pamigkis bilang paraan ng pagkakabit ng efod, dahil ito ang malamang na tungkulin ng pangwakas na parirala.
