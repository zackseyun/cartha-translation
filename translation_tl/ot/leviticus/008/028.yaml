    rationale: Maaaring magpahiwatig ang “niluto” ng ordinaryong paghahanda ng pagkain, samantalang teknikal na katawagang pansakripisyo ang salita para sa handog na iniaalay sa pamamagitan ng apoy.
  - severity: low
    issue: Ang “sinunog” na walang panghalip ay bahagyang masikip matapos ang “kinuha ni Moises.”
    rationale: Ang “sinunog niya ang mga iyon” ay tahasang nagmamarka kay Moises bilang tagaganap at sa mga bahaging kinuha bilang bagay ng kilos.
