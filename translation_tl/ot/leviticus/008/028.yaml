base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Moises ang mga iyon mula sa kanilang mga palad at sinunog niya ang mga iyon sa altar, sa ibabaw ng handog na sinusunog. Ang mga iyon ay handog sa pagtatalaga, na may samyong kalugud-lugod—isang handog na iniaalay sa pamamagitan ng apoy[a] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pinaraan sa apoy.” Teknikal na katawagang pansakripisyo ang salitang Hebreo; pinagtatalunan ang eksaktong pinagmulan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang kahulugan ito ng לקח at malinaw na ipinagpapatuloy ang sunod-sunod na kilos sa ritwal.
- source_word: מֵעַל כַּפֵּיהֶם
  choice: mula sa kanilang mga palad
  rationale: Pinananatili ng “mga palad” ang tiyak na larawan ng כַּפֵּיהֶם at natural pa rin ito sa konteksto ng mga bahaging inilagay sa kanilang mga kamay.
- source_word: וַיַּקְטֵר הַמִּזְבֵּחָה
  choice: sinunog sa ibabaw ng altar
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קטר ay tumutukoy sa pagsunog ng handog upang pumailanlang ang usok; malinaw at likas sa Filipino ang “sinunog,” habang ipinakikita ng pariralang kasunod ang lugar ng paghahandog.
- source_word: עַל הָעֹלָה
  choice: sa ibabaw ng handog na sinusunog
  rationale: Ang עַל ay pinakanatural na “sa ibabaw ng,” at ang עֹלָה ay ang handog na lubusang sinusunog sa altar.
- source_word: מִלֻּאִים
  choice: handog sa pagtatalaga
  rationale: Teknikal itong katawagan sa ritwal ng paglalagay sa tungkulin ng mga pari. Ang “pagtatalaga” ay malinaw sa modernong Filipino nang hindi nag-aangkat ng mas huling estrukturang pansimbahan.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: na may kalugod-lugod na samyo
  rationale: Pinananatili nito ang nakaugaliang larawang pansakripisyo at ang diwa ng handog na katanggap-tanggap.
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Pinananatili nito ang malinaw na kaugnayan ng teknikal na terminong pansakripisyo sa apoy, sa halip na ipakahulugang “pagkain” lamang. Nananatili sa talababa ang mas maikling alternatibo.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan יהוה bilang “Yahweh,” alinsunod sa audited consultation text at upang maiba ito sa titulong “Panginoon.”
theological_decisions:
- issue: Kahulugan ng teknikal na terminong מִלֻּאִים
  choice: handog sa pagtatalaga
  alternative: handog sa paghirang sa tungkulin
  rationale: Tumutukoy ang salita sa handog na bahagi ng ritwal ng pagtatalaga kina Aaron at sa kanyang mga anak. Ang pangunahing salin ay maikli, malinaw, at hindi ito inuugnay sa anumang partikular na makabagong ordenasyon.
- issue: Paglilipat sa אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na niluto sa apoy
  rationale: Hindi tiyak ang eksaktong etimolohiya at saklaw ng teknikal na terminong ito. Pinananatili ng napiling salin ang malinaw na elemento ng apoy at iniiwasang gawing tiyak ang paliwanag na “pagkain” kung hindi iyon tahasang sinasabi ng anyo ng salita.
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang transliterasyon ay lantad na nagpapakitang personal na pangalan ang nasa tekstong Hebreo at hindi lamang ang titulong “Panginoon.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga palad” upang mapanatili ang kongkretong detalye ng Hebreo; ginamit ang “handog sa pagtatalaga” para sa teknikal na ritwal nang hindi nag-aangkat ng katawagang nakatali sa isang denominasyon. Ang mga panandang [a] at [b] ay inilagay kaagad sa mga salitang talagang nililinaw ng bawat talababa.
