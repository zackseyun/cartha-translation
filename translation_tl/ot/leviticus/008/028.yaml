  terminology: Ang “handog sa pagtatalaga” ay angkop para sa מִלֻּאִים at hindi nagpapasok ng denominasyonal na kahulugan. Pinananatili ang “Yahweh” bilang pagsasalin ng banal na pangalan. Para sa אִשֶּׁה, “handog na iniaalay sa pamamagitan ng apoy” ay mas malinaw na teknikal na katawagan kaysa “pinaraan sa apoy.”
