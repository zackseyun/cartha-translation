lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagsusulong sa daloy ng salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, nagsalita” at pinananatili nitong hiwalay ang pandiwa sa kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo na YHWH sa halip na palitan ng isang titulo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ang nagmamarka sa taong kinakausap; “kay Moises” ang natural na anyo sa Tagalog.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ipinakikilala ng infinitive formula ang mismong pahayag na susunod. Naiiwasan ng natural na pariralang Tagalog na ito ang mabigat at di-likas na “na sinasabi,” habang pinananatili ang tungkulin ng pormulang Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na tahimik itong palitan ng titulong “PANGINOON”; itinatala sa talababa ang tradisyonal at alternatibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Hinati sa dalawang sugnay ang pormulang “nagsalita … na sinasabi” upang maging natural sa Filipino at maipakilala pa rin ang tuwirang pahayag sa kasunod na talata.
