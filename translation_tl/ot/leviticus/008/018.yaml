base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: tl
  text: Pagkatapos, inilapit[a] niya ang lalaking tupa para sa handog na sinusunog, at ipinatong[b] ni Aaron at ng kanyang mga anak ang kanilang mga kamay sa ulo ng lalaking tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “iniharap” o “dinala sa harap.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “idiniin.” Tumutukoy ang pandiwang Hebreo sa ritwal na pagpapatong ng mga kamay sa isang hayop na handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Pagkatapos, inilapit niya
  rationale: Ang Hiphil ng קרב ay nangangahulugang “ilapit” o “iharap.” Pinananatili ng “inilapit” ang ritwal na diwa at ang pagkakasunod ng salaysay; si Moises ang tinutukoy ng “niya” ayon sa agarang konteksto.
- source_word: אֵיל
  choice: lalaking tupa
  rationale: Ito ang malinaw at karaniwang katawagan sa modernong Filipino para sa ram na ginagamit bilang hayop na handog.
- source_word: הָעֹלָה
  choice: para sa handog na sinusunog
  rationale: Ang עֹלָה ay nakatatag na terminong pansakripisyo para sa handog na lubusang sinusunog. Likas sa Filipino ang “para sa” upang ipakitang ang lalaking tupa ay itinalaga sa handog na ito.
- source_word: וַיִּסְמְכוּ
  choice: ipinatong
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang סמך sa ritwal na pagpapatong o pagdiin ng mga kamay sa hayop. Natural ang “ipinatong” at hindi nito dinaragdagan ang kahulugang hindi tahasang sinasabi ng talata.
- source_word: יְדֵיהֶם
  choice: kanilang mga kamay
  rationale: Tahasan ang maramihang anyo sa Hebreo, kaya pinanatili ito.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sa ulo ng lalaking tupa
  rationale: Tuwiran, malinaw, at natural na salin ng pariralang Hebreo.
theological_decisions:
- issue: Ritwal na pagpapatong ng mga kamay sa hayop na handog
  choice: ipinatong ... ang kanilang mga kamay sa ulo ng lalaking tupa
  alternative: idiniin ... ang kanilang mga kamay sa ulo ng lalaking tupa
  rationale: Inilalarawan lamang ng salin ang pormal na ritwal na kilos. Hindi nito ipinapalagay na ang kilos ay tahasang nangangahulugan ng paglilipat ng kasalanan o pakikiisa, sapagkat hindi ipinaliliwanag ng talatang ito mismo ang kahulugan nito.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang terminong “handog na sinusunog” bilang madaling maunawaang katawagang pansakripisyo, at iniwasang dagdagan ng paliwanag na teolohikal ang ritwal na kilos.
