id: LEV.8.5
reference: Leviticus 8:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: tl
  text: Sinabi ni Moises sa kapulungan, “Ito ang ipinag-utos ni Yahweh na gawin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang payak na “Sinabi” nang hindi kailangang tumbasan nang hiwalay ang pang-ugnay.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: אֶל־הָעֵדָה
  choice: sa kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa nagkakatipong sambayanan ng Israel; pinananatili ng “kapulungan” ang pormal at pangmadlang diwa sa kontekstong panrelihiyon.
- source_word: זֶה הַדָּבָר
  choice: Ito ang
  rationale: Natural na Tagalog na katumbas ng demonstrative-plus-noun construction; hindi kailangang literal na idagdag ang “bagay,” na magiging mabigat sa pangungusap.
- source_word: צִוָּה
  choice: ipinag-utos
  rationale: Ipinahihiwatig ng perfect ang nauna nang utos na may bisa sa kasalukuyang seremonya; natural itong ipinapahayag sa Tagalog sa aspektong perpektibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal sa halip na palitan ng isang titulo.
- source_word: לַעֲשׂוֹת
  choice: na gawin
  rationale: Bagaman aktibo ang anyo ng infinitive sa Hebreo, maaaring impersonal ang diwa nito rito. Ang “na gawin” ay natural at pinananatili ang pormal na aktibong anyo at ang bahagyang kalabuan kung sino ang gagawa.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tinutukoy na tagaganap ng ipinag-utos
  choice: Hindi tahasang tinukoy sa “na gawin”
  alternative: “na isagawa” o “na dapat gawin natin”
  rationale: Hindi pinapangalanan ng Hebreo ang tagaganap. Iniiwasan ng salin ang pagdaragdag ng “natin” o ibang tahasang simuno, kaya nananatili ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan” upang mapanatili ang pormal at sama-samang diwa ng עֵדָה, at maikli ang direktang pananalita ayon sa likas na ayos ng Tagalog.
