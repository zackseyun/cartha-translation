  naturalness: Sa pangkalahatan ay malinaw at angkop ang makabagong Tagalog. Mas natural at mas tuwiran ang “at ang tinapay” kaysa “pati ang tinapay” sa pormal na paglalahad na may magkapantay na layon. Ang “mga anak niya” ay mas likas kaysa “mga anak nito” kapag si Aaron ang tinutukoy.
  terminology: Ang “karne,” “toldang tipanan,” at “mga handog para sa pagtatalaga bilang pari” ay angkop. Pinananatili ng talababa ang lehitimong alternatibong “pagpapabanal” nang hindi ipinipilit ang isang doktrinal na pagbasa.
