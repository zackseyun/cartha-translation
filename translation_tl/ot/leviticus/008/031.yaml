base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: tl
  text: Sinabi ni Moises kay Aaron at sa mga anak niya, “Pakuluan ninyo ang karne sa pasukan ng toldang tipanan. Doon ninyo ito kainin at ang tinapay na nasa basket ng mga handog para sa pagtatalaga bilang pari[a], gaya ng iniutos ko nang sabihin ko, ‘Kakainin ito ni Aaron at ng kanyang mga anak.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “basket ng mga handog sa pagpapabanal.” Ang salitang Hebreo ay tumutukoy sa mga handog na kaugnay ng seremonya ng pagtatalaga bilang mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: Pakuluan ninyo
  rationale: Sa konteksto ng handog, ang pandiwa ay tumutukoy sa pagluluto sa pamamagitan ng pagpapakulo. Mas tiyak ito kaysa sa pangkalahatang “lutuin,” at ang “ninyo” ay nagpapakita na maramihan ang utos.
- source_word: הַבָּשָׂר
  choice: ang karne
  rationale: Tumutukoy ito sa nakakain na bahagi ng inihandog na hayop. Ang “karne” ang natural at malinaw na salita sa makabagong Tagalog.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng toldang tipanan
  rationale: Tumpak na ipinapahayag ng “pasukan” ang lokasyon, at ang “toldang tipanan” ay malinaw at marangal na salin ng pangalan ng santuwaryo.
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: Doon ninyo ito kainin
  rationale: Inilalagay sa unahan ang “doon” upang mapanatili ang diin ng Hebreo sa itinakdang lugar.
- source_word: הַלֶּחֶם
  choice: ang tinapay
  rationale: Tuwirang tumutukoy sa tinapay na kasama sa ritwal, hindi sa pagkain sa pangkalahatan.
- source_word: סַל הַמִּלֻּאִים
  choice: basket ng mga handog para sa pagtatalaga bilang pari
  rationale: Ang מִלֻּאִים ay tumutukoy sa seremonya ng paglalagay sa tungkulin kina Aaron at sa kanyang mga anak. Nililinaw ng “bilang pari” ang partikular na konteksto nang hindi nag-aangkat ng makabagong sistemang panrelihiyon.
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: gaya ng iniutos ko nang sabihin ko
  rationale: Pinananatili nito ang pormal na pagkakaugnay ng utos at ng kasunod na tuwirang sipi, ngunit nananatiling natural sa Tagalog.
- source_word: יֹאכְלֻהוּ
  choice: Kakainin iyon
  rationale: Ipinahihiwatig ng anyong Hebreo ang iniatas na kilos sa loob ng siniping utos. Sa Tagalog, naipahahayag ng anyong panghinaharap sa kontekstong ito ang direktibang puwersa nang hindi ito labis na pinatitindi bilang “dapat.”
theological_decisions:
- issue: Kahulugan ng מִלֻּאִים sa ritwal ng paglalagay sa tungkulin ng mga pari
  choice: mga handog para sa pagtatalaga bilang pari
  alternative: mga handog sa pagpapabanal
  rationale: Ang pangunahing salin ay malinaw na tumutukoy sa ritwal ng paglalagay kina Aaron at sa kanyang mga anak sa tungkulin bilang mga pari. Pinananatili sa talababa ang lehitimong alternatibong diin sa pagpapabanal o pagkakatalaga.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pakuluan” para sa tiyak na paraan ng pagluluto, “karne” sa halip na mas literal ngunit di-likas na “laman,” at “pagtatalaga bilang pari” upang madaling maunawaan ang ritwal na konteksto.
