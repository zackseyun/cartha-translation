  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: tl
  text: At isinuot niya kay Aaron ang kasuotang pandibdib[a], at inilagay niya sa loob ng kasuotang pandibdib ang Urim at ang Tummim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pektoral.” Ang salitang Hebreo ay tumutukoy sa natatanging kasuotang nasa dibdib ng pinakapunong pari, hindi sa baluting pananggalang.
    reason: lexical_alternative
  - marker: b
    text: Ang “Urim” at “Tummim” ay mga terminong Hebreo na karaniwang isinasatitik. Hindi tiyak ang eksaktong anyo at gamit ng mga ito.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: ipinatong niya kay Aaron
  rationale: Ang שׂוּם na may עַל ay nangangahulugang ilagay o ipatong sa isang tao. Tahasang pinangalanan si Aaron mula sa konteksto upang maging likas at malinaw sa Tagalog nang hindi binabago ang tinutukoy ng panghalip.
- source_word: הַחֹשֶׁן
  choice: ang pektoral
  rationale: Ang חֹשֶׁן ay natatanging kasuotang nasa dibdib ng pinakapunong pari, hindi pananggalang na baluti. Ang “pektoral” ay maikli, marangal, at naiiwasang ipahiwatig na ito ay armor; pareho ang salin sa dalawang paglitaw.
- source_word: וַיִּתֵּן אֶל־הַחֹשֶׁן
  choice: inilagay niya sa loob ng pektoral
  rationale: Dito, ang נָתַן at אֶל ay tumutukoy sa paglalagay ng mga banal na kagamitan sa pektoral. Nililinaw ng “sa loob” ang lokal na diwa na natural sa Tagalog.
- source_word: הָאוּרִים וְאֶת־הַתֻּמִּים
  choice: ang Urim at ang Tummim
  rationale: Mga teknikal na terminong pangritwal ang אוּרִים at תֻּמִּים. Ang transliterasyon ay nagpapanatili sa mga pangalang Hebreo at umiiwas sa mapagpalagay na pagsasalin ng kahulugan o gamit ng mga ito.
theological_decisions:
- issue: Paglalarawan sa Urim at Tummim
  choice: Panatilihin bilang “ang Urim at ang Tummim”
  alternative: “mga banal na palabunutan” o literal na “mga liwanag at mga kasakdalan”
  rationale: Hindi tiyak ang anyo at eksaktong paraan ng paggamit ng mga ito, bagaman kaugnay ang mga ito sa paghahanap ng pasya mula sa Diyos. Hindi nilulutas ng transliterasyon ang hindi nililinaw ng tekstong Hebreo.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “pektoral” bilang tiyak na katawagang pangkasuotan; ipinaliwanag ito sa talababa para sa karaniwang mambabasa. Tahasang ginamit ang pangalang Aaron dahil likas itong kailangan sa Tagalog at malinaw sa naunang konteksto.
