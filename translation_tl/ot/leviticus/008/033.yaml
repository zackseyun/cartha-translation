base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: tl
  text: At huwag kayong aalis mula sa pasukan ng tolda ng tagpuan sa loob ng pitong araw, hanggang sa matapos ang mga araw ng inyong pagtatalaga, sapagkat pitong araw niya kayong itatalaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “pupunuin niya ang inyong kamay,” isang idyomang Hebreo para sa pagtatalaga o paglalagay ng isang tao sa paglilingkod bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פֶּתַח
  choice: At ... sa pasukan
  rationale: Ang וּ ay natural na isinaling “At,” at ang פֶּתַח ay “pasukan.” Sa pariralang “lalabas sa pasukan,” likas na naipahihiwatig sa Filipino ang paglabas mula roon nang hindi gumagamit ng mabigat na “mula sa pasukan.”
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng tagpuan
  rationale: Malapit ito sa diwa ng toldang itinakdang lugar ng pakikipagtagpo. Mas malinaw ito sa kasalukuyang Filipino kaysa sa tradisyonal na “tabernakulo,” at hindi nito ipinagpapalit ang מוֹעֵד sa salitang tumutukoy sa tipan.
- source_word: לֹא תֵצְאוּ
  choice: huwag kayong lalabas
  rationale: Tuwirang ipinahahayag nito ang mariing pagbabawal sa maramihang kausap at likas ito sa makabagong Filipino.
- source_word: שִׁבְעַת יָמִים
  choice: sa loob ng pitong araw
  rationale: Malinaw na ipinakikita nito ang tagal ng pagbabawal.
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: hanggang sa matapos ang mga araw ng inyong pagtatalaga
  rationale: Pinananatili ang temporal na hangganan at ang maramihang “mga araw,” habang iniiwasan ang di-likas na literal na “hanggang sa araw ng pagkapuno.” Sa kontekstong pari, ang מִלֻּאִים ay tumutukoy sa ritwal ng pagtatalaga sa tungkulin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pitong-araw na pagbabawal sa isang marangal ngunit karaniwang gamit na pang-ugnay.
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: niya kayong itatalaga
  rationale: Ang literal na “pupunuin niya ang inyong kamay” ay isang teknikal na idyomang Hebreo para sa pagtatalaga sa paglilingkod bilang pari. Isinalin ang kahulugan sa pangunahing teksto para sa linaw, habang ipinaliliwanag sa talababa ang literal na larawan. Pinananatili ng “niya” na hindi tahasang pinangalanan sa sugnay ang gumagawa.
theological_decisions:
- issue: Ang idyomang pangparing מלא את־יד
  choice: Isalin sa teksto bilang “niya kayong itatalaga,” na may talababa tungkol sa literal na anyo.
  alternative: “pupunuin niya ang inyong kamay”
  rationale: Ang idyoma ay tumutukoy sa pormal na paglalagay sa tungkulin bilang pari. Ang saling-kahulugan ay madaling maunawaan, samantalang pinananatili ng talababa ang mahalagang ugnayang leksikal sa larawan ng “pagpuno ng kamay.”
- issue: Hindi tahasang pinangalanang simuno ng יְמַלֵּא
  choice: Panatilihin ang panghalip na “niya.”
  alternative: Pangalanan ang Diyos o si Moises; o gumamit ng balintiyak na “itatalaga kayo.”
  rationale: Walang tahasang pangngalang simuno sa mismong sugnay. Ang “niya” ay sumusunod sa ikatlong panauhang isahan ng Hebreo nang hindi nilulutas nang sapilitan kung sino ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tolda ng tagpuan” bilang transparent na katawagan sa santuwaryo; iniwasan ang mas teknikal na “tabernakulo.”
