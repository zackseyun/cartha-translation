  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: tl
  text: Pagkatapos, ibinuhos niya ang ilan sa langis na pampahid sa ulo ni Aaron at pinahiran si Aaron upang italaga siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: ibinuhos
  rationale: Karaniwang tumutukoy ang pandiwang יצק sa pagbuhos ng likido. Natural at tuwiran sa modernong Tagalog ang “ibinuhos.”
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: ang kaunting langis na pamahid
  rationale: 'May partitive na diwa ang מִן: isang bahagi ng langis ang ibinuhos. Malinaw at natural na ipinahahayag ito ng “kaunting,” at ang “langis na pamahid” ay nagpapanatili sa ritwal na gamit ng langis.'
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: sa ulo ni Aaron
  rationale: Tuwiran at likas na lokatibong salin ng parirala.
- source_word: וַיִּמְשַׁח
  choice: pinahiran
  rationale: Ang משׁח ay tumutukoy sa ritwal na pagpapahid; ang “pinahiran” ang karaniwang malinaw na katumbas sa Tagalog.
- source_word: לְקַדְּשׁוֹ
  choice: upang italaga siya
  rationale: Sa konteksto ng pagtatalaga sa pari, ipinahihiwatig ng קדשׁ ang pagbubukod kay Aaron para sa banal na paglilingkod. Ang “italaga” ay natural at hindi labis na teknikal.
- source_word: וַ
  choice: Pagkatapos
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng mga kilos sa ritwal; malinaw itong naihahatid ng “Pagkatapos.”
theological_decisions:
- issue: Pagpapahayag sa קדשׁ sa konteksto ng pagtatalaga sa pagkapari
  choice: upang italaga siya
  alternative: upang pabanalin siya
  rationale: Binibigyang-diin ng konteksto ang ritwal na pagbubukod kay Aaron para sa banal na tungkulin. Iniiwasan ng “italaga” ang posibleng pagkaunawa na isang panloob na pagbabagong moral lamang ang tinutukoy, habang pinananatili ang sagradong layunin ng kilos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang ritwal na ugnayan ng “langis na pamahid” at “pinahiran,” at iniwasan ang masyadong eklesyastikal o sektaryang pananalita.
