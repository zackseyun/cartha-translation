  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: tl
  text: At tipunin mo ang buong kapulungan sa pasukan ng tolda ng pagpupulong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tolda ng pakikipagtagpo.”
    reason: Ang מוֹעֵד ay maaaring magpahiwatig ng takdang pagpupulong o pakikipagtagpo; kapuwa posible ang mga salin sa kontekstong ito.
lexical_decisions:
- source_word: וְ/אֵת
  choice: At
  rationale: Ang וְ ay nag-uugnay sa kasunod na utos, samantalang ang אֵת ay pananda ng tiyak na layon at hindi kailangang isalin nang hiwalay sa Tagalog.
- source_word: כָּל
  choice: buong
  rationale: Kasama ng tiyak na pangngalan, ipinahahayag ng כָּל ang kabuuan ng kapulungan; natural itong ihatid bilang “buong.”
- source_word: הָ/עֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan ng Israel. Ang “kapulungan” ay dignificado at malinaw, at pinananatili ang diwang pangkomunidad at pangpagtitipon.
- source_word: הַקְהֵל
  choice: tipunin mo
  rationale: Ang Hiphil imperative ng קהל ay utos na papagtipunin ang mga tao. Ang “tipunin mo” ay natural na makabagong Tagalog at malinaw na nagpapahayag ng utos kay Moises.
- source_word: אֶל פֶּתַח
  choice: sa pasukan
  rationale: Bagaman karaniwang nangangahulugang “patungo sa” ang אֶל, sa pariralang ito ay likas sa Tagalog ang “sa pasukan,” na maaaring tumukoy sa lugar na pagtitipunan.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Pinananatili nito ang anyong tolda ng banal na lugar at ang diwa ng מוֹעֵד bilang takdang pakikipagtagpo o pagpupulong.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at dignipikadong Tagalog. Ginamit ang “kapulungan” upang mapanatili ang kolektibo at bahagyang pormal na diwa ng עֵדָה, at ang “tipunin mo” bilang natural na tuwirang utos.
