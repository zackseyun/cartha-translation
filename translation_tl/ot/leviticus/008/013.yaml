source:
  edition: WLC
  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Pagkatapos, inilapit ni Moises ang mga anak na lalaki ni Aaron[a], at isinuot niya sa kanila ang mga tunika, ibinigkis sa kanila ang mga pamigkis[b], at itinali sa kanila ang mga takip-ulo, gaya ng iniutos ni Yahweh[c] kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “iniharap ni Moises ang mga anak na lalaki ni Aaron.” Sa kontekstong ritwal, ang pandiwang Hebreo ay maaaring mangahulugang ilapit o iharap.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, nasa anyong isahan ang “pamigkis,” ngunit distributibo ang diwa: bawat anak na lalaki ni Aaron ay binigkisan ng sariling pamigkis.'
    reason: lexical_alternative
  - marker: c
    text: Ang banal na pangalang Hebreo ay YHWH, na tradisyonal na isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: inilapit
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap. Pinananatili ng “inilapit” ang konkretong kahulugan at ang ritwal na diwa nang hindi ginagawang labis na teknikal.
- source_word: בְּנֵי אַהֲרֹן
  choice: ang mga anak ni Aaron
  rationale: Likas at tuwirang salin ng pariralang construct; malinaw sa konteksto na tumutukoy ito sa mga lalaking anak ni Aaron na itatalaga bilang mga pari.
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: Isinuot niya sa kanila ang mga tunika
  rationale: Ipinapahayag ng Hiphil ng לבשׁ ang pagpapasuot, at ang “tunika” ay angkop na katawagan sa mahabang pangunahing kasuotang כֻּתֹּנֶת.
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: ibinigkis sa kanila ang mga pamigkis
  rationale: 'Ang חגר ay pagbibigkis sa baywang at ang אַבְנֵט ay telang pamigkis ng pari. Ginawang maramihan sa Filipino ang bagay upang malinaw ang distributibong diwa: bawat anak ay may sariling pamigkis.'
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: itinali sa kanilang ulo ang mga pantakip sa ulo
  rationale: Ang חבשׁ ay nagpapahiwatig ng pagtatali o maayos na pagkakabit, samantalang ang מִגְבָּעוֹת ay mga pantakip sa ulo ng mga karaniwang pari, na naiiba sa pantakip sa ulo ng punong pari.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: Ginawa niya ang lahat ayon sa iniutos sa kanya ni Yahweh
  rationale: Natural sa modernong Filipino ang tahasang “Ginawa niya ang lahat,” at ipinapakita nito ang ganap na pagsunod na ipinahihiwatig ng pormulang כַּאֲשֶׁר צִוָּה, bagaman ang salitang “lahat” ay eksplisitasyon mula sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalarawan sa ritwal na paglapit ng mga anak ni Aaron
  choice: inilapit
  alternative: iniharap
  rationale: Kapuwa posible ang literal na paglapit at pormal na paghaharap sa ritwal. Pinili ang “inilapit” upang mapanatili ang saklaw at bahagyang kalabuan ng pandiwang Hebreo.
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil personal na pangalan ang nasa tekstong Hebreo, pinanatili itong pangalan; ibinigay sa talababa ang tradisyonal na kapalit na titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa maiikling pangungusap ang mahabang sunuran ng mga pandiwang Hebreo para sa likas na daloy. Ginamit ang “tunika” bilang tiyak na katawagan sa kasuotang pari at “pantakip sa ulo” upang maiwasang ipagkamali ito sa natatanging turbante ng punong pari.
