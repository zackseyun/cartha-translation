base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: tl
  text: Pagkatapos, kinuha niya ang taba, ang matabang buntot, ang lahat ng taba na nasa ibabaw ng mga lamang-loob, ang lobo ng atay[a], ang dalawang bato kasama ang taba ng mga iyon, at ang kanang hita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang nakausling bahagi ng atay.” Ang salitang Hebreo ay tumutukoy sa isang tiyak na bahaging inaalis sa paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Pagkatapos, kinuha niya
  rationale: Isinusulong ng waw-consecutive ang sunod-sunod na salaysay; likas sa modernong Tagalog ang “Pagkatapos” para ipakita ang pagkakasunod.
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Karaniwang terminong panghandog para sa mga bahaging mataba na inilalaan sa ritwal.
- source_word: הָאַלְיָה
  choice: ang matabang buntot
  rationale: Tumutukoy sa matabang buntot ng tupa, hindi lamang sa anumang buntot.
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: ang lahat ng tabang nasa ibabaw ng mga lamang-loob
  rationale: Ang קֶרֶב sa kontekstong ito ay ang mga panloob na sangkap; malinaw at karaniwan ang “mga lamang-loob.”
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: ang umbok ng atay
  rationale: Tumutukoy sa isang tiyak na bahagi o nakausling bahagi ng atay na inaalis sa paghahandog; natural at madaling maunawaan ang “umbok ng atay,” habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: ang dalawang bato
  rationale: Tuwirang katumbas na anatomikal at malinaw na ipinapahayag ang bilang na dalawa.
- source_word: חֶלְבְּהֶן
  choice: kasama ang taba ng mga iyon
  rationale: Malinaw na iniuugnay ang taba sa dalawang bato at iniiwasan ang posibleng malabong panghalip.
- source_word: שׁוֹק הַיָּמִין
  choice: ang kanang hita
  rationale: Ang שׁוֹק ay tumutukoy sa bahagi ng hita o itaas na binti sa konteksto ng paghahandog; mas tiyak dito ang “hita” kaysa “binti.”
