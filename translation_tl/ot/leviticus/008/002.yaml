  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: tl
  text: Kunin mo si Aaron at ang kanyang mga anak na kasama niya, pati ang mga kasuotan, ang langis para sa pagpapahid, ang toro para sa handog ukol sa kasalanan[a], ang dalawang lalaking tupa, at ang basket ng tinapay na walang pampaalsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ang toro para sa handog para sa paglilinis.” Ang terminong Hebreo ay maaaring tumukoy sa handog na kaugnay ng kasalanan at ng ritwal na paglilinis.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwirang utos sa ikalawang panauhang panlalaki na isahan. Likas sa modernong Tagalog ang “Kunin mo” at hindi nito ipinapalagay ang direksiyon ng paggalaw na maaaring ipahiwatig ng “dalhin mo.”
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino.
- source_word: בָּנָיו אִתּוֹ
  choice: ang kanyang mga anak na kasama niya
  rationale: Pinananatili ang tahasang אִתּוֹ, “kasama niya,” at ang panghalip ay likas na tumutukoy kay Aaron.
- source_word: הַבְּגָדִים
  choice: ang mga kasuotan
  rationale: Ang “mga kasuotan” ay dignificado ngunit karaniwang salita at hindi nagdaragdag ng teknikal na kahulugang wala sa mismong termino.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: ang langis na pamahid
  rationale: Natural na katumbas ng pariralang “langis ng pagpapahid,” na pinananatili ang ritwal na gamit nang hindi nagpapasok ng mas tiyak na interpretasyon.
- source_word: פַּר הַחַטָּאת
  choice: ang toro para sa handog ukol sa kasalanan
  rationale: Ang פַּר ay “toro,” at ang חַטָּאת sa kontekstong paghahandog ay tumutukoy sa isang uri ng handog. Pinananatili ng “ukol sa kasalanan” ang kinikilalang pangunahing salin, habang inilalagay sa talababa ang posibleng diin sa ritwal na paglilinis.
- source_word: שְׁנֵי הָאֵילִים
  choice: ang dalawang lalaking tupa
  rationale: Tumpak at madaling maunawaang katumbas ng dalawang ram; nililinaw ng “lalaking tupa” ang kasarian ng hayop.
- source_word: סַל הַמַּצּוֹת
  choice: ang basket ng tinapay na walang pampaalsa
  rationale: Ginagamit ang kolektibong “tinapay” para sa מַצּוֹת at malinaw na ipinahahayag na walang sangkap na nagpapaalsa.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa konteksto ng paghahandog
  choice: handog ukol sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Maaaring tumukoy ang terminong Hebreo sa kasalanan at sa handog na kaugnay ng kasalanan o ritwal na paglilinis. Dahil hayop na ihahandog ang tinutukoy rito, kailangan ang diwang “handog,” ngunit hindi dapat itago ang posibleng diin sa paglilinis; kaya nasa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong ritwal. Ginamit ang “pati” upang natural na pag-ugnayin ang mahabang talaan, habang pinananatili ang lahat ng sangkap at ang ayos ng Hebreo.
