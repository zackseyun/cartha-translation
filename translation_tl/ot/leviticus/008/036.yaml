  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: tl
  text: At ginawa ni Aaron at ng kanyang mga anak na lalaki ang lahat ng iniutos ni Yahweh sa pamamagitan ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kamay ni Moises,” isang idyomang nangangahulugang “sa pamamagitan ni Moises” o “sa pamamagitan ni Moises bilang tagapamagitan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa
  rationale: Ang עשה ay tuwirang nagbubuod sa masunuring pagkilos. Natural sa salaysay ang “ginawa,” at pinananatili ng “At” ang ugnayang pasalaysay ng waw.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ni Aaron at ng kanyang mga anak
  rationale: Sa kontekstong pari, ang בָּנָיו ay tumutukoy sa mga lalaking anak ni Aaron. Sa modernong Filipino, natural ang “mga anak” at malinaw ang tinutukoy dahil sa konteksto; ang “mga anak na lalaki” ay magiging mas mabigat kaysa kailangan.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: ang lahat
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, o usapin. Dahil ang tinutukoy ay kabuuan ng mga tagubiling isinagawa, natural na naipahihiwatig ng “ang lahat” ang lahat ng iniutos nang hindi artipisyal ang “lahat ng mga bagay.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang “iniutos” ay karaniwang Filipino para sa banal na utos at malinaw na nauuna ang utos sa isinagawang pagsunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal na יהוה sa halip na palitan ito ng titulong “Panginoon.”
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay idyomang Hebreo para sa ahensiya o pamamagitan. Ang salin ay natural sa Filipino at pinananatili ang papel ni Moises bilang tagapamagitan ng utos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Papel ni Moises sa paghahatid ng utos
  choice: sa pamamagitan ni Moises
  alternative: sa kamay ni Moises; sa pamamagitan ng kamay ni Moises
  rationale: Ipinahahayag ng idyomang בְּיַד ang ahensiya o pamamagitan; hindi nito sinasabing si Moises ang pinagmulan ng utos, kundi siya ang ginamit ni Yahweh sa paghahatid nito.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “kanyang” para sa dignified written register. Pinanatili ang pangalang Yahweh at ipinaliwanag sa talababa ang literal na idyomang Hebreo.
