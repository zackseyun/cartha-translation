  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: tl
  text: Pagkatapos, inilapit niya ang toro na handog para sa kasalanan[a], at ipinatong nina Aaron at ng kanyang mga anak ang kanilang mga kamay sa ulo ng toro na handog para sa kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iniharap” o “dinala sa harap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: inilapit
  rationale: Ang Hiphil ng נגשׁ ay nangangahulugang maglapit o magharap. Pinananatili ng “inilapit” ang kilos ng pagdadala sa hayop sa lugar ng ritwal nang hindi nagdaragdag ng tahasang layon na wala sa talata.
- source_word: פַּר
  choice: toro
  rationale: Sa konteksto ng paghahandog, ang פַּר ay tumutukoy sa lalaking baka. Ang “toro” ang malinaw at likas na katumbas; hindi hinihingi ng talata na tukuyin itong bata pa.
- source_word: הַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Dito, ang חַטָּאת ay hindi simpleng “kasalanan” kundi ang handog na iniaalay kaugnay ng kasalanan. Ang pariralang ito ay malinaw sa karaniwang mambabasa at hindi nagpapasya nang higit sa ipinahihiwatig ng terminong pangritwal.
- source_word: וַיִּסְמֹךְ
  choice: ipinatong
  rationale: Sa ritwal ng paghahandog, ang סמך ay tumutukoy sa pagpapatong o pagdiin ng kamay sa hayop. Likas sa Filipino ang “ipinatong” at hindi nito labis na tinutukoy kung gaano kalakas ang pagdiin.
- source_word: יְדֵיהֶם
  choice: kanilang mga kamay
  rationale: Pinananatili nito ang maramihang anyo ng Hebreo at malinaw na ipinahihiwatig na nakibahagi si Aaron at ang kanyang mga anak sa kilos.
- source_word: עַל רֹאשׁ
  choice: sa ulo ng
  rationale: Ito ang tuwiran at likas na modernong Filipino para sa lokasyong inilalarawan ng pariralang Hebreo.
theological_decisions:
- issue: Kahulugan ng pagpapatong ng mga kamay sa ritwal ng paghahandog
  choice: Ilarawan lamang ang ritwal na kilos nang hindi ipinaliliwanag ang teolohikal na mekanismo nito.
  alternative: Maaaring unawain ang kilos bilang pakikiugnay sa handog, paglilipat ng kasalanan o pananagutan, o pagtatalaga sa hayop bilang hain.
  rationale: Isinasalaysay ng talata ang kilos ngunit hindi nito tahasang ipinaliliwanag ang kahulugan nito. Kaya hindi idinagdag sa salin ang alinman sa mga posibleng paliwanag.
translation_notes:
  register: Gumamit ng makabagong, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “toro para sa handog para sa kasalanan” sapagkat inuulit din ito sa Hebreo at nililinaw nito ang tinutukoy na hayop.
