- from: Kinatay niya iyon, at kumuha si Moises ng kaunti sa dugo nito at inilagay sa pingol ng kanang tainga ni Aaron[a], sa hinlalaki ng kanyang kanang kamay, at sa hinlalaki ng kanyang kanang paa.
  to: Kinatay niya iyon, at kumuha si Moises ng kaunti sa dugo nito at inilagay ito sa pingol ng kanang tainga ni Aaron[a], sa hinlalaki ng kanang kamay ni Aaron, at sa malaking daliri ng kanang paa ni Aaron.
  rationale: Inulit ang pangalang Aaron sa bawat kasunod na bahagi ng katawan upang maalis ang posibleng kalabuan ng panghalip at mapanatili ang malinaw na pagtukoy ng Hebreo. Pinalitan ang “hinlalaki” para sa paa ng mas karaniwang “malaking daliri,” nang hindi binabago ang anatomikong kahulugan. Inayos din ang panimulang pormula ng talababa upang maging natural na Filipino.
