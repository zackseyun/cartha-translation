base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: tl
  text: Kinatay niya iyon, at kumuha si Moises ng kaunti sa dugo nito at inilagay ito sa pingol ng kanang tainga ni Aaron[a], sa hinlalaki ng kanang kamay ni Aaron, at sa malaking daliri ng kanang paa ni Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “dulo ng kanang tainga ni Aaron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: Kinatay niya iyon
  rationale: Sa konteksto ng paghahandog, ang pandiwa ay tumutukoy sa ritwal na pagkatay; likas na ipinahihiwatig ng konteksto ang layon na “iyon.”
- source_word: מִדָּמוֹ
  choice: ng kaunti sa dugo nito
  rationale: Ipinahihiwatig ng מִן na bahagi lamang ng dugo ang kinuha ni Moises, hindi ang lahat nito.
- source_word: תְּנוּךְ אֹזֶן
  choice: pingol ng ... tainga
  rationale: Ang “pingol” ay natural at tiyak na katawagan sa panlabas na malambot na bahagi ng tainga; pinananatili sa talababa ang posibleng kahulugang “dulo.”
- source_word: הַיְמָנִית
  choice: kanang
  rationale: Ito ang likas na modernong Tagalog para tukuyin ang bahagi ng katawan na nasa kanan.
- source_word: בֹּהֶן יָדוֹ
  choice: hinlalaki ng kanyang ... kamay
  rationale: Kapag kamay ang tinutukoy, ang בֹּהֶן ay ang hinlalaki.
- source_word: בֹּהֶן רַגְלוֹ
  choice: hinlalaki ng kanyang ... paa
  rationale: Kapag paa ang tinutukoy, ang בֹּהֶן ay ang malaking daliri ng paa; ang “hinlalaki ng paa” ay maikli at natural sa Tagalog.
- source_word: וַיִּתֵּן עַל
  choice: inilagay sa
  rationale: Tuwirang inilalarawan nito ang paglalagay ng dugo nang hindi idinaragdag ang paraan ng paglalapat, gaya ng pagpapahid.
theological_decisions:
- issue: Ang ritwal na paglalagay ng dugong hain sa mga bahagi ng katawan ni Aaron
  choice: Ilarawan lamang ang mismong ritwal na ginawa
  alternative: Idagdag sa salin ang simbolismo nito bilang pagtatalaga sa pandinig, paggawa, at paglakad
  rationale: Isinasalaysay ng talata ang kilos ngunit hindi nito tahasang ipinaliliwanag ang simbolismo; hindi dapat ipasok sa pangunahing teksto ang isang interpretasyong hindi nito sinasabi.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang magkakasunod na kilos ng Hebreo ngunit inayos ang pangungusap ayon sa natural na daloy ng Tagalog. Inilagay ang talababa sa pariralang “pingol ng kanang tainga ni Aaron,” na siyang salitang may leksikal na alternatibo.
