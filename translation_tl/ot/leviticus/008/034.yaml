base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: tl
  text: Kung paanong ginawa sa araw na ito, gayon din ang iniutos ni Yahweh na gawin upang magbayad-sala para sa inyo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Kung ano ang … iyon ang
  rationale: Likas na paraang Filipino upang ipahayag ang paghahambing at pagtutugma ng ritwal na ginawa at ng iniutos, nang hindi binabago ang ugnayan ng dalawang sugnay.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Bagaman nasa ikatlong panauhang panlalaki ang anyong Hebreo, hindi tahasang tinutukoy rito ang gumagawa. Ang anyong “ginawa” ay hindi nagpapasok ng di-binanggit na simuno at malinaw na tumutukoy sa ritwal na katatapos lamang.
- source_word: בַּיּוֹם הַזֶּה
  choice: sa araw na ito
  rationale: Pinananatili ang pormal at seremonyal na temporal na parirala ng Hebreo; mas malapit ito sa anyo ng pinagmulan kaysa sa payak na “ngayon.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Karaniwan at malinaw na salin ng ganap na pandiwang Hebreo; ipinahihiwatig ng konteksto na ang utos ang batayan ng kasalukuyang ritwal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לַעֲשֹׂת
  choice: na gawin
  rationale: Pinananatili ang pag-uulit ng ugat na עשה at ang layon ng utos, habang nananatiling likas sa Filipino at hindi nagdaragdag ng tahasang tagaganap.
- source_word: לְכַפֵּר
  choice: upang maisagawa ang pagtubos
  rationale: Ipinahahayag ang layuning pangritwal ng כפר nang hindi ito nililimitahan sa mas makitid na konsepto gaya ng pagpapalubag-loob lamang. Ang “maisagawa” ay angkop sa seremonyal na kilos.
- source_word: עֲלֵיכֶם
  choice: para sa inyo
  rationale: Sa pagkakagamit kasama ng כפר, likas itong tumutukoy sa kapakanan o alang-alang sa mga kinakausap. Ang “para sa inyo” ay malinaw at hindi teknikal.
theological_decisions:
- issue: Kahulugan ng כפר sa kontekstong paghahandog
  choice: upang maisagawa ang pagtubos para sa inyo
  alternative: upang magbayad-sala para sa inyo; upang gumawa ng pagpapalubag-loob para sa inyo
  rationale: Pinananatili ng “pagtubos” ang malawak na kahulugang kultiko ng ritwal nang hindi nagdaragdag ng “kasalanan,” na hindi tahasang binanggit sa talata, at nang hindi pinipili ang mas makitid na teoryang teolohikal na maaaring ipahiwatig ng “pagpapalubag-loob.”
- issue: Hindi tahasang tagaganap ng עָשָׂה at לַעֲשֹׂת
  choice: ginawa … na gawin
  alternative: ginawa niya … na gawin niya
  rationale: Bagaman maaaring si Moises ang ipinahihiwatig ng konteksto, hindi siya tahasang pinangalanan sa talata. Hindi siya isiningit bilang simuno upang mapanatili ang pagiging di-tiyak ng pagpapahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang seremonyal na himig sa “sa araw na ito” at “maisagawa ang pagtubos,” ngunit iniwasan ang sobrang teknikal o makalumang pananalita.
