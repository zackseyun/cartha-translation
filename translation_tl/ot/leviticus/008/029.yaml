revisions:
- from: Pagkatapos, kinuha ni Moises ang dibdib at iwinagayway iyon bilang handog na iwinawagayway sa harap ni Yahweh. Iyon ang bahagi ni Moises mula sa lalaking tupa ng pagtatalaga[a], gaya ng iniutos ni Yahweh kay Moises.
  to: Pagkatapos, kinuha ni Moises ang dibdib at iwinagayway niya ito bilang handog na iwinagayway sa harap ni Yahweh. Iyon ang bahagi ni Moises mula sa lalaking tupa para sa pagtatalaga[a], gaya ng iniutos ni Yahweh kay Moises.
  rationale: Pinalitan ang "ng pagtatalaga" ng "para sa pagtatalaga" upang maging mas likas at mas malinaw sa modernong Filipino ang tungkulin ng lalaking tupa sa ritwal. Inayos din ang ayos ng pandiwa sa unang pangungusap nang hindi binabago ang kahulugan o ang teknikal na terminong panritwal.
