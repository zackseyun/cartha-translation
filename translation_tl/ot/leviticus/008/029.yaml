  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Moises ang dibdib at iwinagayway niya ito bilang handog na iwinagayway sa harap ni Yahweh. Iyon ang bahagi ni Moises mula sa lalaking tupa para sa pagtatalaga[a], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalaking tupa para sa pagpapabanal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Pagkatapos, kinuha ni Moises
  rationale: Ang wayyiqtol ay nagpapatuloy sa sunod-sunod na salaysay; likas sa Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod ng pangyayari.
- source_word: הֶחָזֶה
  choice: ang dibdib
  rationale: Sa konteksto ng paghahain, tumutukoy ito sa tiyak na bahaging dibdib ng hayop.
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: iwinagayway iyon bilang handog na iwinawagayway
  rationale: Pinananatili nito ang magkaugnay na pandiwa at pangngalan sa Hebreo at ang ritwal na kilos ng pagwawagayway o paghaharap ng handog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas at tuwirang salin ng pormulang panritwal na nagsasaad ng paghaharap sa presensiya ni Yahweh.
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: mula sa lalaking tupa ng pagtatalaga
  rationale: Ang אֵיל ay lalaking tupa, at sa konteksto ng Levitico 8 ang מִלֻּאִים ay tumutukoy sa ritwal ng pagtatalaga ng mga pari sa tungkulin.
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: Iyon ang bahagi ni Moises
  rationale: Ang מָנָה ay takdang bahagi o kaparte; malinaw at natural ang “bahagi” sa Filipino.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Pinananatili nito ang pormulang nagsasaad na ang ginawa ay eksaktong pagsunod sa naunang utos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginamit ang transliterasyong “Yahweh” upang panatilihin ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מִלֻּאִים sa pagtatalaga ng mga pari
  choice: pagtatalaga
  alternative: pagpapabanal
  rationale: Ang “pagtatalaga” ay angkop sa paglalagay sa tungkuling pari, habang kinikilala sa talababa ang posibleng diin sa konsekrasyon o pagpapabanal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na pananalitang panritwal na “handog na iwinawagayway,” ngunit iniwasan ang labis na arkaiko o denominasyonal na bokabularyo.
