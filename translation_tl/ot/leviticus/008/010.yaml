  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Moises ang langis na pampahid, pinahiran ang tabernakulo at ang lahat ng nasa loob nito, at itinalaga ang mga ito bilang banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinabanal ang mga ito.”
    reason: Alternatibong salin ng וַיְקַדֵּשׁ אֹתָם, na maaaring ipahayag bilang pagtatalaga bilang banal o bilang pagpapabanal.
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Pagkatapos, kinuha ni Moises
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay. Likas na ipinahahayag ng “Pagkatapos” ang ganitong ugnayan sa modernong Tagalog, habang nananatili ang payak na diwang “kinuha.”
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: ang langis na pamahid
  rationale: Ang pariralang construct ay tumutukoy sa langis na ginagamit sa ritwal na pagpapahid. Ang “langis na pamahid” ay malinaw, natural, at hindi nagdaragdag ng salitang “banal,” na hindi tahasang nasa pariralang ito.
- source_word: וַיִּמְשַׁח
  choice: pinahiran
  rationale: Ito ang karaniwang pandiwa sa kontekstong ritwal para sa paglalagay ng langis. Pinananatili ng “pinahiran” kapwa ang pisikal na kilos at ang ritwal na gamit nito.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang “tabernakulo” ay nakikilalang teknikal na katawagan sa santuwaryong tolda sa Exodo–Levitico at mas tiyak kaysa sa pangkalahatang “tirahan.”
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: ang lahat ng naroon
  rationale: Saklaw nito ang lahat ng laman o kagamitan sa loob ng tabernakulo. Maikli at likas sa Tagalog ang “lahat ng naroon.”
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: at itinalaga ang mga iyon bilang banal
  rationale: Sa kontekstong makasaserdote, ipinahahayag ng קדשׁ ang pagbubukod o pagtatalaga para maging banal. Nililinaw ng “ang mga iyon” na kapwa tinutukoy ang tabernakulo at ang lahat ng naroon.
theological_decisions:
- issue: Pagpapahayag sa קדשׁ sa konteksto ng ritwal na makasaserdote
  choice: itinalaga ang mga iyon bilang banal
  alternative: pinabanal ang mga iyon
  rationale: Ipinakikita ng pangunahing salin ang ritwal na pagbubukod para sa banal na gamit nang hindi ipinapasok ang mas huling doktrinal na pagpapakahulugan. Inilalagay sa talababa ang mas tuwirang alternatibong “pinabanal.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang nakikilalang terminong “tabernakulo” para sa teknikal na bagay sa pagsamba, at iniwasan ang labis na arkaiko o denominasyonal na pananalita.
