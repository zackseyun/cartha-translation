  source_fidelity: Kailangang isalin ang בָּנָיו bilang “mga anak na lalaki” sapagkat malinaw na panlalaking maramihan ang Hebreo at tumutukoy ito sa mga anak na lalaking pari ni Aaron. Ang “sa ibabaw ni Aaron” ay mas tumpak para sa עַל kaysa “kay Aaron,” na karaniwang nagpapahiwatig ng di-tiyak na direksiyon o tatanggap.
  naturalness: Mas natural at malinaw sa modernong Tagalog ang “kanyang mga kasuotan” kaysa paulit-ulit na “mga kasuotan nito,” at ang “mga anak na lalaking kasama niya” ay mas maayos na nag-uugnay sa pariralang אִתּוֹ nang hindi inaalis ang maigsi nitong pagtukoy.
  terminology: “Langis na pampahid” ay malinaw na tumutukoy sa langis para sa ritwal na pagpapahid. Ang “itinalaga niya bilang banal” ay angkop na katumbas ng וַיְקַדֵּשׁ sa konteksto ng ritwal na pagtatalaga; pinananatili ng talababa ang mas tuwirang “pinabanal.”
