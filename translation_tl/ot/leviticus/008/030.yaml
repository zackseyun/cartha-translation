- from: Pagkatapos, kumuha si Moises ng kaunti sa langis na pamahid at ng kaunti sa dugong nasa altar. Iwinisik niya ang mga ito kay Aaron, sa mga kasuotan nito, sa mga anak nito, at sa mga kasuotan ng mga anak nitong kasama niya. Sa gayon, itinalaga niyang banal[a] si Aaron, ang mga kasuotan nito, ang mga anak nito, at ang mga kasuotan ng mga anak nitong kasama niya.
  to: Pagkatapos, kumuha si Moises ng kaunti sa langis na pampahid at ng kaunti sa dugong nasa altar. Iwinisik niya ang mga ito sa ibabaw ni Aaron, sa kanyang mga kasuotan, sa kanyang mga anak na lalaki, at sa mga kasuotan ng kanyang mga anak na lalaking kasama niya. Sa gayon, itinalaga niya bilang banal[a] si Aaron, ang kanyang mga kasuotan, ang kanyang mga anak na lalaki, at ang mga kasuotan ng kanyang mga anak na lalaking kasama niya.
