source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: tl
  text: Pagkatapos, kumuha si Moises ng kaunti sa langis na pampahid at ng kaunti sa dugong nasa altar. Iwinisik niya ang mga ito sa ibabaw ni Aaron, sa kanyang mga kasuotan, sa kanyang mga anak na lalaki, at sa mga kasuotan ng kanyang mga anak na lalaking kasama niya. Sa gayon, itinalaga niya bilang banal[a] si Aaron, ang kanyang mga kasuotan, ang kanyang mga anak na lalaki, at ang mga kasuotan ng kanyang mga anak na lalaking kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinabanal niya.”
    reason: Leksikal na alternatibo para sa וַיְקַדֵּשׁ; maaaring idiin ng pandiwa ang pagpapabanal o ang pagtatalaga bilang banal.
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: kumuha ... ng kaunti sa langis ... at ng kaunti sa dugo
  rationale: Ang pandiwang וַיִּקַּח ay ‘kumuha,’ at ang inuulit na מִן ay nagpapahiwatig na bahagi lamang ng langis at dugo ang kinuha. Likas sa modernong Tagalog ang ‘ng kaunti sa’ para ihayag ito.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Pinananatili ng ‘langis na pamahid’ ang ritwal na gamit ng langis nang hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: dugong nasa altar
  rationale: Maikli at natural itong katumbas ng dugong naroon sa ibabaw o nasa altar.
- source_word: וַיַּז
  choice: iwinisik niya
  rationale: Sa kontekstong pari at ritwal, ang Hiphil ng נזה ay tumutukoy sa pagwisik ng likido. Ang ‘iwinisik’ ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: בְּגָדָיו
  choice: mga kasuotan nito
  rationale: Ang ‘mga kasuotan’ ay angkop sa marangal at ritwal na konteksto. Ginamit ang ‘nito’ upang malinaw na kay Aaron ang mga iyon.
- source_word: בָּנָיו
  choice: mga anak nito
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo at mga lalaking anak ni Aaron ang tinutukoy, sa Tagalog ay hindi likas na minamarkahan ng ‘anak’ ang kasarian. Hindi binabago ng salin ang tinutukoy na mga anak ni Aaron.
- source_word: בִּגְדֵי בָנָיו אִתּוֹ
  choice: mga kasuotan ng mga anak nitong kasama niya
  rationale: Pinananatili nito ang ugnayan ng mga kasuotan sa mga anak at ang pariralang ‘kasama niya.’ Hindi lubusang nilulutas ang posibleng sanggunian ng panghalip, gaya ng pagiging maigsi nito sa Hebreo.
- source_word: וַיְקַדֵּשׁ
  choice: itinalaga niyang banal
  rationale: Sa ritwal ng pagtatalaga sa mga pari, ipinahahayag nito ang pagbubukod bilang banal para sa sagradong paglilingkod. Ang parirala ay mas madaling maunawaan kaysa sa teknikal na ‘kinonsekrhan’ at nananatiling malapit sa diwa ng קדשׁ.
theological_decisions:
- issue: Kahulugan ng קדשׁ sa ritwal ng pagtatalaga sa mga pari
  choice: itinalaga niyang banal
  alternative: pinabanal niya
  rationale: Ipinakikita ng konteksto ang pagbubukod kay Aaron, sa mga anak niya, at sa kanilang mga kasuotan para sa banal na paglilingkod. Iniiwasan ng salin ang pagpasok ng mas huling doktrinal na kategorya, habang ang talababa ay nagpapanatili sa mas tuwirang alternatibo.
- issue: Pagtukoy sa בָּנָיו
  choice: mga anak nito
  alternative: mga anak na lalaki nito
  rationale: Tiyak na mga lalaking anak ni Aaron ang tinutukoy sa konteksto, ngunit ang karaniwang salitang Tagalog na ‘anak’ ay likas na walang markang kasarian. Ang pagdaragdag ng ‘na lalaki’ ay posible ngunit hindi kailangan upang matukoy ang mga kalahok na ipinakilala na sa salaysay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Hinati sa tatlong pangungusap ang mahabang sugnay na Hebreo para sa malinaw na pagbasa, habang pinanatili ang pagkakasunod-sunod at pag-uulit ng mga taong at kasuotang winisikan at itinalagang banal.
