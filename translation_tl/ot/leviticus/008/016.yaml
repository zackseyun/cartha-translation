base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: tl
  text: Kinuha niya ang lahat ng taba na nasa mga laman-loob, ang nakausling bahagi ng atay[a], ang dalawang bato at ang taba ng mga iyon. Pagkatapos, sinunog[b] ni Moises ang lahat ng iyon sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dugtong ng atay” o “lobo ng atay.” Ang salitang Hebreo ay tumutukoy sa isang tiyak na bahagi ng atay na inaalis sa paghahanda ng handog.
    reason: lexical_alternative
  - marker: b
    text: Mas tiyak na maaaring isalin ang pandiwa na “pinausok” o “inihandog sa pamamagitan ng pagsunog” sa konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha niya
  rationale: Karaniwang pasalaysay na anyo ng לקח; malinaw at natural sa makabagong Tagalog ang naganap na kilos.
- source_word: כָּל הַחֵלֶב
  choice: lahat ng taba
  rationale: Sa konteksto ng paghahandog, tumutukoy ang חֵלֶב sa mga matabang bahaging inilalaan para sunugin; pinananatili ng “taba” ang payak na katawagang anatomikal.
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: na nasa mga laman-loob
  rationale: Ang קֶרֶב dito ay tumutukoy sa mga panloob na bahagi o viscera ng hayop; karaniwan at madaling maunawaan ang “mga laman-loob.”
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: ang nakausling bahagi ng atay
  rationale: Tumutukoy ang parirala sa isang tiyak na bahagi o dugtong ng atay na inaalis sa paghahanda ng handog. Mas malinaw sa karaniwang mambabasa ang deskriptibong salin kaysa sa teknikal na “lobo ng atay.”
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: ang dalawang bato
  rationale: Tuwirang katumbas ng anatomikal na katawagan at pinananatili ang bilang na dalawa.
- source_word: חֶלְבְּהֶן
  choice: ang taba ng mga iyon
  rationale: Ang hulaping panghalip ay tumutukoy sa dalawang bato; iniiwasan ng “ng mga iyon” ang posibleng kalituhan ng “kanilang.”
- source_word: וַיַּקְטֵר
  choice: sinunog
  rationale: Sa kontekstong pansakripisyo, ang קטר ay pagsunog sa altar upang maging usok. Natural ang “sinunog” sa pangunahing teksto, habang nililinaw sa talababa ang mas tiyak na diwa.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Ipinahihiwatig ng lokatibo/direksiyonal na anyo na sa ibabaw o kinaroroonan ng altar isinagawa ang pagsunog; “sa altar” ang natural na Tagalog.
