base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: tl
  text: Pagkatapos, inilapit niya ang mga anak ni Aaron. Nilagyan ni Moises ng dugo ang pingol ng kanilang kanang tainga, ang hinlalaki ng kanilang kanang kamay, at ang malaking daliri ng kanilang kanang paa. Pagkatapos, inihagis ni Moises ang dugo sa lahat ng panig ng altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: inilapit niya
  rationale: Pinananatili ang causative na diwa ng pandiwa at ang panghalip na tumutukoy kay Moises mula sa konteksto, nang hindi inuulit nang di-kailangan ang pangalan.
- source_word: תְּנוּךְ
  choice: pingol
  rationale: Karaniwang salitang Filipino para sa lobe ng tainga at mas tiyak kaysa sa pangkalahatang “bahagi.”
- source_word: בֹּהֶן יָד
  choice: hinlalaki ng ... kamay
  rationale: Likas at wastong katumbas sa Filipino ng thumb.
- source_word: בֹּהֶן רֶגֶל
  choice: hinlalaki sa ... paa
  rationale: Likas na katawagan sa malaking daliri ng paa sa Filipino.
- source_word: וַיִּזְרֹק
  choice: inihagis
  rationale: Sinasalamin ang pangunahing kilos ng זרק, ang paghahagis o pagbato ng dugo patungo sa altar; hindi ito pinapaliit sa simpleng pagwisik.
- source_word: סָבִיב
  choice: sa lahat ng panig
  rationale: Malinaw na ipinahahayag na ang dugo ay inilapat sa palibot ng altar.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pingol” bilang tiyak na katawagan sa lobe ng tainga at “altar” bilang malawak nang nauunawaang terminong panrelihiyon. Pinanatili ang konkretong ritwal na kilos ng tekstong Hebreo nang walang idinagdag na simbolikong paliwanag.
