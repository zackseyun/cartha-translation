base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/020.yaml
  text: Then he cut the ram into its pieces[a], and Moses burned the head, the pieces, and the suet in smoke.
translation:
  language: tl
  text: Pagkatapos, pinagputul-putol niya ang lalaking tupa, at pinausok ni Moises bilang handog ang ulo, ang mga piraso, at ang taba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sebo.” Tumutukoy ang salitang Hebreo sa matabang bahagi ng hayop na inihahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ang lalaking tupa
  rationale: Ang אַיִל sa konteksto ng paghahandog ay isang adultong lalaking tupa; mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o teknikal na katawagan.
- source_word: נִתַּח לִנְתָחָיו
  choice: pinagputul-putol
  rationale: Ipinahahayag ng pandiwa at kaugnay na pangngalan ang paghiwa o paghahati ng hayop sa mga piraso; natural at tuwiran sa modernong Tagalog ang “pinagputul-putol.”
- source_word: וַיַּקְטֵר
  choice: pinausok ... bilang handog
  rationale: Sa ritwal na konteksto, ang Hiphil ng קטר ay tumutukoy sa pagpapasunog upang pumailanlang bilang usok. Pinananatili ng “pinausok” ang larawan ng usok, samantalang nililinaw ng “bilang handog” ang sakripisyal na gamit.
- source_word: הָרֹאשׁ
  choice: ang ulo
  rationale: Tuwirang katumbas ng karaniwang katawagang anatomikal.
- source_word: הַנְּתָחִים
  choice: ang mga piraso
  rationale: Inuulit nito ang salitang kaugnay ng naunang pagputul-putol at tumutukoy sa mga bahaging hiniwa mula sa hayop.
- source_word: הַפָּדֶר
  choice: ang taba
  rationale: Ang פָּדֶר ay tumutukoy sa matabang bahagi ng hayop na inihahandog. Hindi tiyak sa mismong salita na buntot na mataba ang tinutukoy, kaya ang mas malawak na “taba” ang pinili.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang kilos ng pagpapausok sa sakripisyal na konteksto at iniwasang tukuyin ang פָּדֶר bilang “matabang buntot,” sapagkat hindi iyon tiyak sa salitang Hebreo mismo.
