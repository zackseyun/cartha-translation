language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: tl
  text: Sa pasukan ng Toldang Tipanan, manatili kayo araw at gabi sa loob ng pitong araw, at tuparin ninyo ang tungkuling iniatas ni Yahweh upang hindi kayo mamatay.[a] Sapagkat ito ang iniutos sa akin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at hindi kayo mamamatay”; o: “baka kayo mamatay.”'
    reason: Pinananatili ang posibleng koordinado o babalang puwersa ng וְלֹא תָמֻתוּ bukod sa layunin/kahihinatnang pagbasa sa pangunahing teksto.
lexical_decisions:
- source_word: וּפֶתַח אֹהֶל מוֹעֵד
  choice: Sa pasukan ng Toldang Tipanan
  rationale: Ang פֶתַח ay pasukan o bukana; ang “pasukan” ang natural na lokatibong salita rito. Ang אֹהֶל מוֹעֵד ay itinaling “Toldang Tipanan,” ang nakikilalang katawagan sa santuwaryong tolda kung saan nakikipagtagpo ang Diyos sa Israel.
- source_word: תֵּשְׁבוּ
  choice: manatili kayo
  rationale: Bagaman maaaring literal na mangahulugang “umupo” ang ישׁב, sa kontekstong ito ay inuutusan silang huwag umalis sa kanilang himpilan; malinaw itong naipahahayag ng “manatili.”
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: araw at gabi sa loob ng pitong araw
  rationale: Pinananatili ng “araw at gabi” ang merismong nagsasaad ng tuloy-tuloy na pananatili, at likas sa Filipino ang “sa loob ng pitong araw” para sa tagal.
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמֶרֶת יְהוָה
  choice: at tuparin ninyo ang tungkuling iniatas ni Yahweh
  rationale: Ang tambalang שׁמר + משׁמרת ay tumutukoy sa maingat na pagtupad sa itinakdang pananagutang panritwal. Ang “tungkuling iniatas” ay natural at marangal, habang pinananatili ang pinagmulan ng utos kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וְלֹא תָמֻתוּ
  choice: upang hindi kayo mamatay
  rationale: Sa daloy ng utos, natural itong basahin bilang kahihinatnang maiiwasan sa pagsunod. Nasa talababa ang posibleng koordinado o tahasang babalang pagbasa.
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: Sapagkat ganito ang iniutos sa akin
  rationale: 'Pinananatili nito ang pasibong diwa: si Moises ay tumanggap ng utos, at hindi siya ang pinagmulan nito.'
theological_decisions:
- issue: Paglalarawan sa babala ng kamatayan
  choice: upang hindi kayo mamatay
  alternative: at hindi kayo mamamatay; baka kayo mamatay
  rationale: Maaaring ipahayag ng pagkakasunod ng mga sugnay ang layunin o kahihinatnang maiiwasan sa pagsunod, ngunit hindi ganap na inaalis ng Hebreo ang koordinado o babalang pagbasa; kaya pinanatili ang mga iyon sa talababa.
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “manatili,” “pasukan,” at “tuparin” bilang mga karaniwang salitang madaling maunawaan, habang pinanatili ang panritwal na bigat ng “tungkuling iniatas” at ang kinikilalang katawagang “Toldang Tipanan.”
