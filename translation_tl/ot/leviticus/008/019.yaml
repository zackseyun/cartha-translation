  text: And he slaughtered it[a], and Moses threw the blood against the altar all around.
translation:
  language: tl
  text: At kinatay niya ito, at itinilamsik ni Moises ang dugo sa paligid ng altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ibinato ni Moises ang dugo laban sa altar sa buong paligid.” Ang pandiwang Hebreo ay tumutukoy sa puwersadong paglalapat ng dugong panghandog, hindi sa banayad na pagwiwisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: pinatay niya ang tupa
  rationale: 'Sa kontekstong paghahandog, ang שׁחט ay tumutukoy sa ritwal na pagkatay sa hayop. Ginamit ang natural na Filipino na “pinatay,” at nilinaw ang ipinahihiwatig na layon mula sa naunang talata: ang tupa.'
- source_word: וַיִּזְרֹק
  choice: isinaboy
  rationale: Ang זרק dito ay malakas na paglalapat o paghahagis ng dugong panghandog sa altar, hindi banayad na pagwiwisik. Ang “isinaboy” ay natural at angkop sa ritwal na kilos.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Tuwirang salin ng tiyak na pangngalang may pantukoy.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Karaniwan at malinaw na katawagan sa modernong Filipino para sa מִזְבֵּחַ sa konteksto ng paghahandog.
- source_word: סָבִיב
  choice: sa lahat ng panig
  rationale: Ipinahihiwatig nito na inilapat ang dugo sa palibot o sa mga gilid ng altar; pinananatili ng parirala ang distributibong diwa.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Pamantayang anyo ng pangalan sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “isinaboy” upang maipakita ang puwersadong ritwal na paglalapat ng dugo, habang ang “sa lahat ng panig ng altar” ay natural na nagpapahayag ng סָבִיב. Inilipat ang pangalang “Moises” sa ikalawang pangungusap ayon sa tahasang paksa ng Hebreo.
