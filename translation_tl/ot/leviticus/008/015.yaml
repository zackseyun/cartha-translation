source:
  edition: WLC
  text: וַ/יִּשְׁחָ֗ט וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֶת הַ/דָּם֙ וַ֠/יִּתֵּן עַל קַרְנ֨וֹת הַ/מִּזְבֵּ֤חַ סָבִיב֙ בְּ/אֶצְבָּע֔/וֹ וַ/יְחַטֵּ֖א אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֗ם יָצַק֙ אֶל יְס֣וֹד הַ/מִּזְבֵּ֔חַ וַֽ/יְקַדְּשֵׁ֖/הוּ לְ/כַפֵּ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: tl
  text: At kinatay niya ito. Kinuha ni Moises ang dugo at ipinahid niya ito sa mga sungay ng altar sa buong palibot, gamit ang kanyang daliri. Nilinis niya ang altar.[a] Pagkatapos, ibinuhos niya ang dugo sa paanan ng altar at itinalaga niya itong banal upang gumawa ng pagbabayad-sala para rito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dinalisay niya ang altar.” Sa kontekstong ito, ang pandiwang Hebreo ay tumutukoy sa ritwal na paglilinis mula sa karumihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang magsagawa ng pagtubos para rito” o “upang dalisayin ito sa ritwal na paraan.” Malawak ang saklaw ng pandiwang Hebreo sa konteksto ng paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: pinatay niya iyon bilang handog
  rationale: Sa kontekstong paghahandog, tumutukoy ang שׁחט sa ritwal na pagkatay. Ang pariralang ito ay natural sa modernong Filipino at ipinakikitang hindi ito karaniwang pagpatay lamang.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: mga sungay ng altar
  rationale: Pinananatili nito ang tiyak na katawagang pangritwal para sa mga nakausling bahaging parang sungay sa altar.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahahayag nito na inilagay ang dugo sa mga sungay sa magkakaibang panig ng altar.
- source_word: בְּאֶצְבָּעוֹ
  choice: sa pamamagitan ng kanyang daliri
  rationale: Tumpak na inilalahad ang isahan at instrumental na gamit ng parirala.
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: nilinis niya ang altar
  rationale: Sa ritwal na kontekstong pari, ang piel ng חטא ay nangangahulugang linisin o dalisayin mula sa karumihang ritwal, hindi 'papagkasalahin.' Mas natural sa Filipino ang 'nilinis' kaysa teknikal na 'dinalisay.'
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: ibinuhos niya ang dugo sa paanan ng altar
  rationale: Ang יְסוֹד ay pundasyon o base; ang 'paanan ng altar' ay malinaw at likas na katumbas sa Filipino.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: itinalaga niya itong banal
  rationale: Inilalarawan ng קדשׁ ang pagbubukod sa altar bilang banal para sa sagradong gamit; malinaw nitong pinagsasama ang pagtatalaga at kabanalan.
- source_word: לְכַפֵּר עָלָיו
  choice: upang tubusin ito
  rationale: Ang כפר ay sentral na terminong panghandog na maaaring tumukoy sa pagtubos, paglilinis, o pagtatakip ng karumihan. Ang 'tubusin' ay maikli at madaling maunawaan, habang pinananatili sa talababa ang ritwal na alternatibo.
theological_decisions:
- issue: Kahulugan ng חטא sa ritwal na paglilinis
  choice: nilinis niya ang altar
  alternative: dinalisay niya ang altar
  rationale: Hindi ipinahihiwatig ng pandiwa na nagkasala ang altar; sa halip, inaalis ng seremonya ang karumihang ritwal nito.
- issue: Kahulugan ng כפר kapag altar ang layon
  choice: upang tubusin ito
  alternative: upang magsagawa ng ritwal ng pagtubos para rito; upang linisin ito sa ritwal na paraan
  rationale: Pinananatiling altar ang layon ng seremonya at hindi ipinapalit ang isang doktrinal na paliwanag. Ipinakikita ng talababa ang tunay na lawak ng kahulugang ritwal.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang katawagang biblikal na “altar,” at iniwasan ang labis na teknikal o denominasyonal na pananalita. Hinati ang mahabang sugnay na Hebreo sa maiikling pangungusap upang maging malinaw sa karaniwang mambabasa.
