revisions:
- from: At pinatay niya iyon bilang handog. Kinuha ni Moises ang dugo at ipinahid iyon sa pamamagitan ng kanyang daliri sa mga sungay ng altar sa palibot. Sa gayon ay nilinis niya ang altar.[a] Pagkatapos, ibinuhos niya ang dugo sa paanan ng altar at itinalaga niya itong banal upang tubusin ito.[b]
  to: At kinatay niya ito. Kinuha ni Moises ang dugo at ipinahid niya ito sa mga sungay ng altar sa buong palibot, gamit ang kanyang daliri. Nilinis niya ang altar.[a] Pagkatapos, ibinuhos niya ang dugo sa paanan ng altar at itinalaga niya itong banal upang gumawa ng pagbabayad-sala para rito.[b]
  rationale: Pinalitan ang pangkalahatang “pinatay ... bilang handog” ng “kinatay,” na tuwirang naghahatid ng ritwal na pagkatay. Pinalitan ang “tubusin ito” ng “gumawa ng pagbabayad-sala para rito” upang maipahayag ang kahulugang pangritwal ng כפר nang hindi nagdaragdag ng doktrinal na paliwanag o nagmumungkahing ang altar mismo ay tinubos. Inayos din ang pagkakasunod at mga panghalip upang maging malinaw ang kilos ni Moises at ang layon ng bawat kilos.
