  naturalness: Natural at malinaw ang binagong pangungusap sa modernong Filipino. Ang “sa buong palibot” ay malinaw na inilalarawan ang paglalagay ng dugo sa mga sungay ng altar, at ang “gamit ang kanyang daliri” ay likas na instrumental na pahayag.
  terminology: Pinanatili ang “altar,” “mga sungay,” at “nilinis” bilang malinaw na katawagang ritwal. Isinalin ang כפר bilang “gumawa ng pagbabayad-sala para rito,” na hindi nagpapahiwatig na ang altar ay tinubos mula sa pagkabihag o pag-aari, habang pinananatili ang saklaw na ritwal sa talababa.
