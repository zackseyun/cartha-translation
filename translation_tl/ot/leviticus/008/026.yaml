  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: tl
  text: Mula sa basket ng mga tinapay na walang pampaalsa na nasa harapan ni Yahweh, kumuha siya ng isang tinapay na walang pampaalsa, isang tinapay na may langis[a], at isang manipis na tinapay. Ipinatong niya ang mga iyon sa mga piraso ng taba at sa kanang hita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang tinapay na hinaluan ng langis.” Maaaring inilalarawan ng pariralang Hebreo ang tinapay na inihanda na may langis, ngunit hindi tahasang sinasabi ang eksaktong paraan ng paghahanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִסַּל הַמַּצּוֹת
  choice: Mula sa basket ng mga tinapay na walang pampaalsa
  rationale: Ipinapahayag ng מִן ang pinagmulan, at ang מַצּוֹת ay tumutukoy sa mga pagkaing tinapay na walang pampaalsa sa ritwal na basket. Natural at malinaw sa modernong Filipino ang pariralang ito.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: na nasa harapan ni Yahweh
  rationale: Pinananatili nito ang kultikong diwa ng bagay na iniharap sa presensiya ni Yahweh at tuwirang isinasalin ang banal na pangalan.
- source_word: חַלַּת מַצָּה אַחַת
  choice: isang tinapay na walang pampaalsa
  rationale: Ang חַלָּה rito ay isang indibidwal na tinapay o tinapay na hugis-bilog; ang payak na 'isang tinapay' ay mas natural kaysa 'keyk' sa kontekstong ritwal at hindi labis na nagtatakda ng hugis.
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: isang tinapay na may langis
  rationale: Ipinapakita ng Hebreo ang kaugnayan ng tinapay sa langis ngunit hindi tahasang sinasabi kung ito ay hinaluan, pinahiran, o inihandang sa ibang paraan. Pinananatili ng salin ang kalabuan.
- source_word: רָקִיק אֶחָד
  choice: isang manipis na tinapay
  rationale: Ang רָקִיק ay manipis at lapad na tinapay na ginagamit sa mga handog. Mas madaling maunawaan ng karaniwang mambabasa ang 'manipis na tinapay' kaysa sa hiram na 'wafer.'
- source_word: וַיָּשֶׂם
  choice: Ipinatong niya ang mga iyon
  rationale: Bagaman isahan ang anyo ng pandiwa sa Hebreo, tumutukoy ang kilos sa tatlong bagay na bagong binanggit. Nililinaw ng 'mga iyon' ang sanggunian nang hindi dinaragdagan ang diwa.
- source_word: הַחֲלָבִים
  choice: mga piraso ng taba
  rationale: Sa kontekstong paghahandog, tumutukoy ito sa mga takdang matatabang piraso ng hayop, hindi sa langis o taba sa pangkalahatan.
- source_word: שׁוֹק הַיָּמִין
  choice: kanang hita
  rationale: Ang שׁוֹק ay bahagi ng hita o paa ng hayop sa konteksto ng pagkakatay para sa handog. Ang 'kanang hita' ay maikli, malinaw, at angkop sa ritwal na konteksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal, na may karaniwang bokabularyo. Iniwasan ang teknikal o lipas na mga katawagan; pinanatili ang konkretong detalye ng ritwal at ang kalabuan tungkol sa paraan ng paggamit ng langis.
