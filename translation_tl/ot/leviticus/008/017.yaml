base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Ngunit ang toro[a], pati ang balat, laman, at dumi[b] nito, ay sinunog niya sa apoy sa labas ng kampo, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batang toro.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang tae nito; ang salitang Hebreo ay tumutukoy sa dumi ng hayop, hindi sa pangkalahatang basura.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַפָּר
  choice: ang toro
  rationale: Ang פַּר ay toro o batang toro. Pinili ang payak at natural na “toro” nang hindi idinaragdag ang kontekstuwal ngunit di-tahasang “handog para sa kasalanan.”
- source_word: עֹרוֹ
  choice: balat nito
  rationale: Ang עוֹר ay balat o hide ng hayop. “Balat” ang pinakanatural at malinaw na katumbas sa makabagong Filipino; ang “katad” ay maaaring magpahiwatig ng balat na naproseso na.
- source_word: בְּשָׂרוֹ
  choice: laman nito
  rationale: Tuwirang tumutugma ang “laman” sa בָּשָׂר at angkop ito sa konteksto ng paghahandog.
- source_word: פִּרְשׁוֹ
  choice: dumi nito
  rationale: Ang פֶּרֶשׁ ay partikular na dumi o tae ng hayop, hindi pangkalahatang basura. Dignified at malinaw ang “dumi,” habang nililinaw sa talababa ang tiyak na kahulugan.
- source_word: שָׂרַף בָּאֵשׁ
  choice: sinunog niya sa apoy
  rationale: Pinananatili nito ang pandiwang “sinunog” at ang tahasang pagbanggit sa apoy sa Hebreo nang natural pa rin sa Filipino.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Ito ang tuwiran, karaniwan, at madaling maunawaang salin ng parirala.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: gaya ng iniutos
  rationale: Ipinapahayag nito ang eksaktong pagsunod sa utos, na siyang diwa ng כַּאֲשֶׁר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: ang toro, pati ang balat, laman, at dumi nito
  rationale: Natural na inihahatid ng “pati” ang pinagsama-samang talaan ng mga tuwirang layon, habang iniiwasan ang mabigat na paulit-ulit na pangatnig.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumi” sa pangunahing teksto upang maging angkop sa publikong pagbasa, ngunit hindi pinalabo ang tiyak na kahulugan dahil nilinaw ito sa talababa. Napanatili ang bahagyang pagsalungat ng pambungad na וְ sa pamamagitan ng “Ngunit,” ayon sa daloy ng nakaraang mga talata.
