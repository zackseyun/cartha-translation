  source_fidelity: 'Tumpak ang salin sa Hebreo: ang toro at ang balat, laman, at dumi nito ang sinunog, sa apoy at sa labas ng kampo. Hindi idinagdag ang kontekstuwal na paglalarawang “handog para sa kasalanan.” Ang “gaya ng iniutos ni Yahweh kay Moises” ay wastong naghahatid ng pangwakas na pormulang Hebreo.'
  naturalness: Natural at marangal ang modernong Filipino. Maayos ang daloy ng “Ngunit ... ay sinunog niya ...,” at malinaw ang pag-uugnay ng “nito” sa toro. Ang “sa apoy” ay bahagyang literal ngunit ganap na idiomatiko at pinananatili ang tahasang pariralang Hebreo.
  terminology: Ang “toro,” “balat,” “laman,” “dumi,” “kampo,” at “Yahweh” ay angkop at pare-pareho sa kahulugan at rehistro ng pinagmulan. Wasto ring nililinaw ng talababa na ang פֶּרֶשׁ ay dumi/tae ng hayop, hindi pangkalahatang basura.
