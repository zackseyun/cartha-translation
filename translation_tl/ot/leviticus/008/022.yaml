base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: tl
  text: Pagkatapos, inilapit niya ang ikalawang lalaking tupa[a], ang lalaking tupa para sa pagtatalaga. Ipinatong ni Aaron at ng kanyang mga anak na lalaki ang kanilang mga kamay sa ulo ng lalaking tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang lalaking tupa ng pagkakatalaga” o “ang lalaking tupa ng konsagrasyon.” Ang pariralang Hebreo ay isang teknikal na katawagan para sa ritwal ng pagluklok sa tungkulin ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Pagkatapos, inilapit niya
  rationale: Ang Hiphil ng קרב ay nangangahulugang maglapit o magharap. Pinananatili ng “inilapit” ang ritwal na diwa at ang pagkakasunod-sunod ng salaysay.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: ang ikalawang lalaking tupa
  rationale: Tuwirang isinasalin ang אַיִל bilang “lalaking tupa” at ang ordinal na הַשֵּׁנִי bilang “ikalawa.”
- source_word: אֵיל הַמִּלֻּאִים
  choice: ang lalaking tupa para sa pagtatalaga
  rationale: Ang מִלֻּאִים ay teknikal na katawagan sa ritwal ng pagluklok at pagtatalaga sa mga pari. Natural sa modernong Filipino ang “para sa pagtatalaga” at malinaw nitong ipinapakita ang gamit ng hayop sa ritwal.
- source_word: וַיִּסְמְכוּ ... אֶת יְדֵיהֶם
  choice: Ipinatong ... ang kanilang mga kamay
  rationale: Sa konteksto ng paghahandog, ang סמך ay tumutukoy sa ritwal na pagpapatong o pagdiin ng kamay sa handog. Pinananatili rin ang maramihang “mga kamay” ng Hebreo.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sa ulo ng lalaking tupa
  rationale: Tuwiran at natural na salin ng pariralang nagsasaad kung saan ipinatong ang mga kamay.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ni Aaron at ng kanyang mga anak
  rationale: Sa konteksto, ang בָנָיו ay tumutukoy sa mga lalaking anak ni Aaron na itinatalaga bilang mga pari. Ang “mga anak” ay natural sa Filipino at malinaw ang tiyak na reperensiya mula sa konteksto.
theological_decisions:
- issue: Pagpapakahulugan sa teknikal na pariralang מִלֻּאִים sa ritwal ng mga pari
  choice: ang lalaking tupa para sa pagtatalaga
  alternative: ang lalaking tupa para sa pagtalaga bilang pari; ang lalaking tupa ng pagtatalaga
  rationale: Ang termino ay maaaring tumukoy sa pagtatalaga, konsagrasyon, o pagluklok sa tungkulin. Pinili ang “para sa pagtatalaga” dahil malinaw ito sa ordinaryong mambabasa at hindi nito nililimitahan ang termino sa isang denominasyonal na pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking tupa” sa halip na mas di-pamilyar na “barakong tupa,” at pinanatili ang ritwal na kilos nang hindi nagdaragdag ng teolohikal na paliwanag sa pangunahing teksto.
