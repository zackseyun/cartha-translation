  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: tl
  text: Ginawa ni Moises ang iniutos ni Yahweh sa kanya, at nagtipon ang kapulungan sa pasukan ng tolda ng pagpupulong.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Ang עשה ay malawak na pandiwang nangangahulugang “gawin” o “likhain.” Sa konteksto ng pagsunod sa utos, natural at tuwiran ang “ginawa.”
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ang iniutos
  rationale: Ipinahahayag nito ang pagsunod ni Moises ayon sa iniutos; natural sa modernong Tagalog ang konstruksiyong “ginawa ... ang iniutos” habang pinananatili ang lakas ng צוה bilang makapangyarihang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַתִּקָּהֵל
  choice: nagtipon
  rationale: Ang Niphal ng קהל ay nagsasaad na nagsama-sama ang kapulungan. Ang aktibong di-palipat na “nagtipon” ang pinakanatural na katumbas sa Tagalog.
- source_word: הָעֵדָה
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan ng Israel. Nililinaw ng “buong kapulungan” ang kolektibong saklaw na likas sa salita, nang hindi ipinahihiwatig na bawat indibidwal ay kinakailangang naroon.
- source_word: אֶל־פֶּתַח
  choice: sa pasukan
  rationale: Bagaman karaniwang nagpapahiwatig ng patutunguhan ang אֶל, idiomatiko sa Tagalog ang “nagtipon ... sa pasukan” para sa lugar na pinuntahan at pinagtipunan.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Pinananatili ng “tolda” ang pisikal na anyo ng אֹהֶל at ipinahahayag ng “tipanan” ang מוֹעֵד bilang itinakdang pakikipagtagpo; isa itong maikli at dignified na katawagan sa santuwaryo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: toldang tipanan
  alternative: tolda ng pagpupulong; tolda ng pakikipagtagpo
  rationale: Maaaring tumukoy ang מוֹעֵד sa itinakdang pagtitipon o pakikipagtagpo. Ang “toldang tipanan” ay natural at maikli, ngunit hindi nito nilulutas nang dogmatiko kung ang diin ay nasa pagpupulong ng bayan o pakikipagtagpo ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignified, at angkop sa pampublikong pagbasa. Ginamit ang payak na ayos ng pangungusap at ang kinikilalang terminong “kapulungan,” habang iniwasan ang sobrang arkaiko o denominasyonal na pananalita.
