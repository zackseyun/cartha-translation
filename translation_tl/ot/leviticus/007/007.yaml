base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: tl
  text: 'Kung paano ang handog para sa kasalanan, gayundin ang handog para sa pagkakasala: iisa ang tuntunin para sa dalawang ito.[a] Mapupunta ito sa paring nagbabayad-sala sa pamamagitan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “tuntunin” ay torah; maaari rin itong isaling “tagubilin” o “kautusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת
  choice: Kung paano ang handog para sa kasalanan
  rationale: Ang unlaping כ ay naghahayag ng paghahambing. Sa kontekstong panghandog, ang חַטָּאת ay tumutukoy sa handog para sa kasalanan, hindi lamang sa kasalanan mismo.
- source_word: כָּאָשָׁם
  choice: gayundin ang handog para sa pagkakasala
  rationale: Ipinagpapatuloy nito ang magkatambal na paghahambing. Ang אָשָׁם dito ay teknikal na katawagan sa handog kaugnay ng pagkakasala at pananagutang magbayad-pinsala.
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: iisa ang tuntunin para sa dalawang ito
  rationale: Ang תּוֹרָה sa batas panghandog ay nangangahulugang tuntunin o tagubilin. Nililinaw ng 'dalawang ito' na ang panghalip na maramihan ay tumutukoy sa dalawang handog.
- source_word: אֲשֶׁר יְכַפֶּר בּוֹ
  choice: nagsasagawa ng pagtubos sa pamamagitan nito
  rationale: Pinananatili ng 'pagtubos' ang bigat na panghandog at teolohikal ng כפר, habang ipinakikita ng 'sa pamamagitan nito' na ang handog ang kasangkapan o paraan.
- source_word: לוֹ יִהְיֶה
  choice: Mapupunta ito sa paring
  rationale: Ang idyoma ay nagsasaad na ang handog ay magiging pag-aari o takdang bahagi ng paring nangangasiwa; natural itong ipinahahayag sa Filipino bilang 'mapupunta ito sa.'
theological_decisions:
- issue: Kahulugan ng כפר sa batas tungkol sa paghahandog
  choice: nagsasagawa ng pagtubos
  alternative: nagsasagawa ng pagpapatawad; nagsasagawa ng paglilinis
  rationale: Ang 'pagtubos' ay nagpapanatili sa malawak na puwersang panghandog ng pandiwa nang hindi nagpapasya para sa isang makitid na teorya kung paano ito gumagana.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang malinaw na magkatambal na paghahambing at iniwasan ang labis na teknikal na pananalita, ngunit pinanatili ang mga katawagang panghandog at ang teolohikal na bigat ng כפר.
