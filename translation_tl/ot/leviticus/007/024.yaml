  edition: WLC
  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: tl
  text: Ngunit ang taba ng hayop na namatay nang hindi kinatay[a], at ang taba ng hayop na nilapa ng mababangis na hayop, ay maaaring gamitin sa anumang gawain; ngunit hinding-hindi ninyo iyon kakainin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong nevelah ay tumutukoy sa hayop na namatay nang hindi wastong kinatay; maaari ring isalin na “hayop na natagpuang patay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: taba
  rationale: Karaniwang salin sa konteksto ng mga handog at batas sa pagkain; mas natural at madaling maunawaan kaysa sa isang teknikal na katawagan.
- source_word: נְבֵלָה
  choice: hayop na namatay nang hindi kinatay
  rationale: Tumutukoy sa hayop na namatay nang walang wastong pagkatay. Nililinaw nito ang legal na diwa nang hindi ipinapalagay na likas na sanhi lamang ang kamatayan.
- source_word: טְרֵפָה
  choice: hayop na nilapa
  rationale: Maikli at natural na tumutukoy sa hayop na niluray o nilapa ng mandaragit; hindi tahasang idinagdag sa pangunahing teksto ang ahente dahil hindi ito binanggit sa mismong salita.
- source_word: יֵעָשֶׂה
  choice: maaaring gamitin
  rationale: Sa kontekstong legal, nagpapahintulot ito ng praktikal na paggamit, hindi lamang ng paggawa o pagproseso.
- source_word: לְכָל מְלָאכָה
  choice: sa anumang gawain
  rationale: Pinananatili ang malawak na saklaw ng parirala at ipinahihiwatig ang paggamit para sa layuning hindi pagkain.
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: ngunit hinding-hindi ninyo iyon kakainin
  rationale: Inihahayag ng inuulit na anyong pandiwa ang mariing pagbabawal; natural na naipapakita ito ng “hinding-hindi” sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pangmaramihang “ninyo” ayon sa anyo ng pandiwang Hebreo. Pinanatili ang pag-uulit ng “ngunit” upang ihayag ang dalawang magkasunod na paghahambing sa Hebreo.
