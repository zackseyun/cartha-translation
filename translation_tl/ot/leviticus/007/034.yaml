id: LEV.7.34
reference: Leviticus 7:34
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: tl
  text: Sapagkat kinuha ko mula sa mga anak ni Israel[a] ang dibdib ng handog na iwinawagayway at ang hita ng handog na itinaas[b], mula sa kanilang mga haing pangkapayapaan[c], at ibinigay ko ang mga ito sa paring si Aaron at sa kanyang mga anak bilang tuntuning mananatili magpakailanman mula sa mga anak ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel,” isang karaniwang katawagang pangtipan.'
    reason: lexical_alternative
  - marker: b
    text: O “hita ng handog na inilaan.” Ang salitang Hebreo ay tumutukoy sa bahaging ibinukod at iniaangat bilang handog.
    reason: lexical_alternative
  - marker: c
    text: O “mga haing para sa pakikipag-isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dibdib na handog na iwinawagayway
  rationale: Ang חֲזֵה ay ang bahaging dibdib ng hayop, at ang תְּנוּפָה ay tumutukoy sa natatanging ritwal na pagwawagayway o paghaharap ng handog. Pinananatili ng salin ang parehong bahagi ng hayop at kilos-ritwal.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: hitang handog na inilaan
  rationale: Ang שׁוֹק ay hita o itaas na bahagi ng binti. Ang תְּרוּמָה ay bahaging ibinukod o itinaas bilang handog; ang “inilaan” ay likas sa modernong Tagalog at hindi nagtatakda nang labis kung paano eksaktong isinagawa ang ritwal.
- source_word: לָקַחְתִּי
  choice: kinuha ko
  rationale: Ang Hebreong perfect ay nagsasaad ng natapos na kilos ng Diyos na siyang batayan ng umiiral na tuntunin. Ang payak na nagdaang anyo ay natural at malinaw sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at pormal na katawagang pangtipan sa Hebreo. Nililinaw sa talababa ang mas idyomatikong alternatibo.
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: kanilang mga haing handog para sa kapayapaan
  rationale: Pinananatili ang זֶבַח bilang “haing handog” at ang natatanging kategoryang שְׁלָמִים bilang “para sa kapayapaan,” nang hindi ito pinakikitid sa pakikisalo lamang.
- source_word: וָאֶתֵּן אֹתָם
  choice: at ibinigay ko ang mga iyon
  rationale: Malinaw na ibinabalik ng “mga iyon” ang maramihang reperensiya sa dibdib at hita, habang likas ang aspektong naganap sa Tagalog.
- source_word: לְחָק עוֹלָם
  choice: bilang tuntunin magpakailanman
  rationale: Ipinahahayag nito ang pangmatagalang bisa ng legal na ordinansa sa dignified ngunit madaling maunawaang Tagalog.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Inuulit ang pinagmumulan ng mga bahaging para sa mga pari, gaya ng diin at legal na balangkas ng Hebreo.
theological_decisions:
- issue: Katawagan sa tipang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pormal na anyo ng Hebreo at ang paulit-ulit na katawagang pangtipan, habang ibinibigay sa talababa ang karaniwang modernong katumbas.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikipag-isa
  rationale: Ang “kapayapaan” ay mas tuwirang nagpapanatili sa leksikal at tradisyonal na saklaw ng katawagan. Ang “pakikipag-isa” ay maaaring magpasok ng mas makitid na pagpapakahulugan tungkol sa pakikisalo.
- issue: Ritwal na diwa ng תְּרוּמָה
  choice: handog na inilaan
  alternative: handog na itinaas
  rationale: Ang salita ay tumutukoy sa bahaging ibinukod o inihandog at maaaring may diwa ng pagtataas. Ang pangunahing teksto ay hindi nagpapasya nang labis sa tiyak na kilos; ang alternatibo ay itinatala sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong angkop sa tekstong legal at panritwal. Pinanatili ang mga teknikal na pagkakaiba ng dalawang bahagi ng handog, ngunit gumamit ng malinaw na mga parirala sa halip na lipas o hindi likas na terminolohiya.
