- from: Sapagkat kinuha ko mula sa mga anak ni Israel[a] ang dibdib na handog na iwinawagayway at ang hitang handog na inilaan[b], mula sa kanilang mga haing handog para sa kapayapaan[c], at ibinigay ko ang mga iyon sa paring si Aaron at sa kanyang mga anak bilang tuntunin magpakailanman mula sa mga anak ni Israel.
  to: Sapagkat kinuha ko mula sa mga anak ni Israel[a] ang dibdib ng handog na iwinawagayway at ang hita ng handog na itinaas[b], mula sa kanilang mga haing pangkapayapaan[c], at ibinigay ko ang mga ito sa paring si Aaron at sa kanyang mga anak bilang tuntuning mananatili magpakailanman mula sa mga anak ni Israel.
  rationale: Nilinaw ang ugnayan ng mga bahaging hayop at ng mga teknikal na handog-ritwal, inalis ang redundant na “mga haing handog,” at pinakinis ang legal na pananalita. Hindi binago ang saklaw ng kahulugan, ang mga pangngalang pantipanan, o ang pag-uulit ng pinagmumulan ng mga bahaging para sa mga pari.
