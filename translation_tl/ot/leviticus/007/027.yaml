  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: tl
  text: Ang sinumang tao[a] na kumain ng anumang dugo—ang taong iyon ay ihihiwalay mula sa kanyang bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaluluwa.” Ang Hebreong nefesh dito ay tumutukoy sa indibidwal na tao.
    reason: lexical_alternative
  - marker: b
    text: Ang “ihihiwalay” ay karaniwang pormula ng parusa sa tipan. Maaaring tumukoy ito sa pag-aalis sa pamayanan o sa hatol ng Diyos; hindi tinutukoy rito ng Hebreo ang eksaktong paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: tao
  rationale: Sa kontekstong legal, ang Hebreong nefesh ay tumutukoy sa isang indibidwal na tao, hindi lamang sa di-materyal na “kaluluwa.”
- source_word: תֹּאכַל
  choice: kumain
  rationale: Ang anyong di-ganap sa sugnay na ito ay nagsasaad ng pangkalahatang kaso; natural itong ipinahahayag sa Filipino bilang “na kumain.”
- source_word: כָּל דָּם
  choice: anumang dugo
  rationale: 'Ang kol kasama ng di-mabilang na pangngalang “dugo” ay distributibo rito: dugo sa anumang anyo o uri.'
- source_word: וְנִכְרְתָה
  choice: ay ihihiwalay
  rationale: Pinananatili ng pasibong “ihihiwalay” ang pormulang parusa nang hindi tiyak na ipinapakahulugan bilang pagpatay, pagpapatalsik, o tuwirang hatol ng Diyos.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon
  rationale: Inuulit at binibigyang-diin ng parirala ang taong lumabag, gaya ng emphatic na pagpapatuloy sa Hebreo.
- source_word: מֵעַמֶּיהָ
  choice: mula sa kanyang bayan
  rationale: Ang hulaping pambabae sa Hebreo ay kaayon ng gramatikal na kasarian ng nefesh at hindi naglilimita sa utos sa kababaihan. Walang kasariang itinatakda ang “kanyang” sa Filipino.
theological_decisions:
- issue: Kahulugan ng pormulang parusa na וְנִכְרְתָה
  choice: “ay ihihiwalay mula sa kanyang bayan,” nang hindi tinutukoy ang eksaktong paraan ng parusa
  alternative: “papatayin,” “palalayasin sa pamayanan,” o “lilipulin ng Diyos”
  rationale: Maikli at hindi tiyak ang pormulang Hebreo at maaari itong tumukoy sa pag-aalis sa pamayanan o sa hatol ng Diyos. Hindi dapat lutasin ng salin ang hindi nililinaw ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit na “tao … taong iyon” para sa diin ng legal na pahayag at ginamit ang “bayan” para sa sambayanang kinabibilangan sa tipan.
