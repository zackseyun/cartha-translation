base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: tl
  text: Ito ang bahaging nakatalaga kay Aaron at ang bahaging nakatalaga sa kanyang mga anak[a], mula sa mga handog na inialay sa apoy para kay Yahweh[b], nang iharap sila upang maglingkod bilang mga pari kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahaging kaugnay ng pagpapahid.” Kaugnay ng pagpapahid ang salitang Hebreo, ngunit dito ay malamang na tumutukoy ito sa takdang bahagi ng mga pari na kaugnay ng kanilang pagtatalaga.
    reason: lexical_alternative
  - marker: b
    text: Ayon sa tradisyon, “mga handog na pinaraan sa apoy para kay Yahweh.” Maaari ring isalin na “mga handog na pagkain para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: bahaging inilaan
  rationale: Sa konteksto ng mga takdang bahagi para sa mga pari, tumutukoy ito sa bahaging nauukol kina Aaron at sa kanyang mga anak kaugnay ng kanilang pagpapahid at pagtatalaga. Ang saling ito ay likas sa Filipino at hindi ipinapalagay na ang tinutukoy ay ang langis o ang mismong gawa ng pagpapahid.
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: ang bahaging inilaan kay Aaron at ang bahaging inilaan sa kanyang mga anak
  rationale: Pinananatili ang pag-uulit ng pangngalan sa Hebreo at nililinaw na ang 'kanyang' ay tumutukoy kay Aaron.
- source_word: מֵאִשֵּׁי יְהוָה
  choice: mula sa mga handog na pinaraan sa apoy para kay Yahweh
  rationale: Pinananatili ang kaugnayan ng אִשֶּׁה sa apoy nang hindi lumilikha ng impresyong pag-aari ng apoy ang mga handog; ang מִן ay isinaling 'mula sa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng titulong 'Panginoon.'
- source_word: בְּיוֹם
  choice: nang
  rationale: Sa Filipino, natural na ipinahahayag ng 'nang' ang panahong tinutukoy ng pariralang Hebreo; maaari rin itong unawain nang mas literal bilang 'noong araw na.'
- source_word: הִקְרִיב אֹתָם
  choice: iharap sila
  rationale: Ang Hiphil ng קרב ay 'ilapit' o 'iharap.' Dahil mga tao ang layon, iniiwasan ng 'iharap' ang maling pahiwatig na sila mismo ay inihandog bilang hain.
- source_word: לְכַהֵן לַיהוָה
  choice: upang maglingkod bilang mga pari kay Yahweh
  rationale: Malinaw na ipinahahayag nito ang tungkuling panrelihiyon at ang pinaglilingkuran, habang pinananatili ang layunin ng infinitibo.
theological_decisions:
- issue: Kahulugan ng מִשְׁחַת sa batas tungkol sa mga pari
  choice: bahaging inilaan
  alternative: bahagi sa pagpapahid; pagpapahid
  rationale: Bagaman kaugnay ng salitang 'pagpapahid,' sa kontekstong ito ay malamang na tumutukoy ang salita sa takdang bahagi ng mga pari na kaugnay ng kanilang pagtatalaga. Inilalagay sa talababa ang posibleng mas literal na pagbasa upang mapanatili ang tunay na leksikal na kalabuan.
- issue: Pagkakakilanlan ng paksa ng הִקְרִיב
  choice: hindi tahasang pinangalanan sa salin
  alternative: nang iharap niya sila
  rationale: May panlalaking isahang paksa ang pandiwa sa Hebreo, ngunit hindi ito tahasang pinangalanan sa mismong talata. Ang balintiyak na 'nang iharap sila' ay likas sa Filipino at hindi sapilitang nagpapasya kung sino ang tinutukoy ng 'siya.'
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Yahweh” para sa יהוה. Iniwasan ang mas teknikal na “bahagi ng pagpapahid” sa pangunahing teksto, ngunit pinanatili iyon bilang leksikal na alternatibo sa talababa. Ang [a] ay inilagay matapos ang pariralang “bahaging inilaan,” at ang [b] matapos ang parirala tungkol sa mga handog upang malinaw ang kani-kanilang tinutukoy.
