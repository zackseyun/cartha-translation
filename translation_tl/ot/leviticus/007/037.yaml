source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: tl
  text: Ito ang tuntunin tungkol sa handog na sinusunog, handog na butil, handog para sa kasalanan[a], handog para sa pagkakasala[b], mga ritwal ng pagtatalaga[c], at hain para sa kapayapaan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Maaaring idiin ng salitang Hebreo ang pag-aalis ng karumihan gayundin ang pagharap sa kasalanan.
    reason: lexical_alternative
  - marker: b
    text: O “handog na pambayad-pinsala.” Maaaring idiin ng salitang Hebreo ang pananagutan at ang kinakailangang pagsasauli o pagbabayad-pinsala.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, pangmaramihan ang termino at tumutukoy sa mga ritwal ng pagtatalaga o pagtalaga sa mga pari.
    reason: lexical_alternative
  - marker: d
    text: O “hain para sa pakikisama” o “hain para sa mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: Ito ang tuntunin
  rationale: Ang demonstratibo at pangngalang תּוֹרָה ay nagpapakilala ng buod ng itinakdang tagubilin. Mas natural sa modernong Filipino ang “tuntunin” kaysa “kautusan” sa kontekstong seremonyal.
- source_word: לָעֹלָה
  choice: tungkol sa handog na sinusunog
  rationale: Ang לְ ay nagsasaad ng saklaw, at ang עֹלָה ay handog na lubusang sinusunog. Ang pariralang ito ay malinaw at natural.
- source_word: לַמִּנְחָה
  choice: handog na butil
  rationale: Sa konteksto ng Levitico, ang מִנְחָה ay handog mula sa butil, hindi lamang isang pangkalahatang regalo o handog.
- source_word: וְלַחַטָּאת
  choice: handog para sa kasalanan
  rationale: Pinananatili nito ang kinikilalang kaugnayan ng חַטָּאת sa kasalanan, habang inilalahad sa talababa ang mahalagang diwa ng paglilinis.
- source_word: וְלָאָשָׁם
  choice: handog para sa pagkakasala
  rationale: Ang אָשָׁם ay tumutukoy sa handog na kaugnay ng pananagutan sa pagkakasala; inilalahad sa talababa ang posibilidad na idiin ang pagbabayad-pinsala.
- source_word: וְלַמִּלּוּאִים
  choice: mga ritwal ng pagtatalaga
  rationale: Ang pangmaramihang מִלּוּאִים ay tumutukoy sa mga seremonya ng pagtatalaga sa mga pari, kaya hindi ito pinakitid sa iisang handog lamang.
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: haing handog para sa kapayapaan
  rationale: Isinasalin ng “haing handog” ang זֶבַח at pinananatili ng “kapayapaan” ang tradisyonal na diwa ng שְׁלָמִים, habang inilalahad sa talababa ang iba pang lehitimong kahulugan.
theological_decisions:
- issue: Saklaw ng חַטָּאת
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Hindi nilulutas nang palihim ang tensiyon sa pagitan ng kasalanan at ritwal na karumihan; nasa pangunahing teksto ang tradisyonal na salin at nasa talababa ang mahalagang alternatibo.
- issue: Diwa ng אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog na pambayad-pinsala
  rationale: Pinananatili ang pananagutan sa pangunahing teksto, ngunit kinikilala sa talababa ang kaugnayan nito sa pagsasauli o pagbabayad-pinsala.
- issue: Kahulugan ng שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa mabuting kalagayan o pakikipag-ugnayan
  rationale: Malawak ang saklaw ng terminong Hebreo; pinananatili ang pamilyar na katawagan nang hindi itinatanggi ang mga diwa ng kabutihan at pakikisama.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tuntunin” para sa legal-seremonyal na tagubilin, at pare-parehong “handog” ang bokabularyo sa talaan. Ang “mga ritwal ng pagtatalaga” ay sadyang pangmaramihan upang tapat sa anyong Hebreo.
