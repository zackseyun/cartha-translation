base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: tl
  text: Ito ang tuntunin tungkol sa haing pangkapayapaan na ihahandog kay Yahweh:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa kapakanan”; tradisyonal na “haing pangkapayapaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Ito
  rationale: Ipinakikilala ng parirala ang isang bagong bahagi. Hindi na kailangang isalin nang hiwalay ang וְ sa natural na Tagalog, sapagkat wala itong tahasang temporal na diwa rito.
- source_word: תּוֹרַת
  choice: ang tuntunin tungkol sa
  rationale: Sa kontekstong pangsaserdote, ang תּוֹרָה ay tumutukoy sa itinakdang tuntunin o tagubilin sa ritwal. Natural sa Tagalog ang “tuntunin tungkol sa” para sa ugnayang construct ng Hebreo.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: haing pangkapayapaan
  rationale: Ang זֶבַח ay isang haing karaniwang may pagkatay, at ang שְׁלָמִים ay teknikal na katawagan sa uri ng handog na kaugnay ng kapayapaan, kabuuan, at kagalingan. Pinananatili ng “haing pangkapayapaan” ang tradisyonal at madaling makilalang katawagan, habang inilalagay sa talababa ang saklaw na “kagalingan.”
- source_word: אֲשֶׁר יַקְרִיב
  choice: na ihahandog
  rationale: Ang Hiphil ng קרב sa kontekstong paghahandog ay nangangahulugang ilapit o ihandog. Ang pokus-sa-layon na anyong Tagalog ay natural at hindi kailangang tukuyin ang panlalaking panghalip na ginagamit nang pangkalahatan sa Hebreong legal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ang לְ ay nagpapakita kung kanino inihahandog ang hain, at ang personal na pangalang יהוה ay tinutumbasan ng “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Tahasang ginagamit sa talata ang tipanang pangalan יהוה. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagsasalin sa teknikal na katawagang שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: handog para sa kagalingan
  rationale: Mayaman ang saklaw ng salita at maaaring tumukoy sa kapayapaan, kabuuan, o kagalingan. Ginamit sa pangunahing teksto ang tradisyonal at malinaw na katawagan, ngunit pinanatili sa talababa ang mahalagang kahalili.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tuntunin” sa halip na mas malawak na “kautusan” upang idiin ang tiyak na regulasyong pangritwal. Ang “ihahandog” ay natural na pangkalahatang pahayag sa Tagalog at hindi nagpapasok ng hindi kailangang panlalaking tagaganap.
