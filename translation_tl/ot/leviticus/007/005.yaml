base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: tl
  text: Susunugin ng pari ang mga iyon sa altar bilang handog na iniaalay sa pamamagitan ng apoy para kay Yahweh[a]. Ito ay handog para sa pagkakasala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na sinusunog para kay Yahweh.” Ang salitang Hebreo ay teknikal na katawagan sa handog na iniaalay sa pamamagitan ng apoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “handog para sa pagbabayad-sala” o “handog na pambayad-pinsala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: Susunugin
  rationale: Ang Hiphil ng קטר sa konteksto ng paghahandog ay tumutukoy sa pagsunog ng handog sa altar upang pumailanlang ang usok. Natural at malinaw sa modernong Tagalog ang “susunugin.”
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Panghalip na tuwirang layon na tumutukoy sa mga bahaging inilarawan sa naunang talata.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Tiyak na pangngalang isahan; “pari” ang karaniwang katawagan sa kontekstong Levitico.
- source_word: הַמִּזְבֵּחָה
  choice: sa altar
  rationale: Bagaman may panlaping patungo ang Hebreo, ang kilos ay ang pagsunog ng mga bahagi sa ibabaw ng altar; natural itong ipinapahayag sa Tagalog bilang “sa altar.”
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Teknikal na terminong tumutukoy sa handog na inihahandog sa pamamagitan ng apoy. Pinananatili ng salin ang tahasang kaugnayan sa apoy nang hindi ipinapalagay ang debatableng kahulugang “pagkain.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng pang-ukol ang pag-aalay o pagtatalaga ng handog kay Yahweh.
- source_word: אָשָׁם
  choice: handog para sa pagkakasala
  rationale: Teknikal na kategorya ng handog sa Levitico. Nauunawaan ito ng karaniwang mambabasa at hindi nililimitahan ang termino sa pagbabayad-pinsala lamang.
- source_word: הוּא
  choice: Iyon ay
  rationale: Tinutukoy at inuuri ng panghalip ang sakripisyo bilang isang אָשָׁם.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo; pinananatili ng “Yahweh” ang natatanging pangalan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng teknikal na terminong אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog para sa pagbabayad-sala; handog na pambayad-pinsala
  rationale: May kaugnayan ang אָשָׁם sa pagkakasala, pananagutan, at kung minsan ay pagsasauli o kabayaran. Hindi tahasang nilulutas ng pangunahing salin ang lahat ng aspektong iyon; inilalahad sa talababa ang mahalagang alternatibo.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: Ang salita ay isang teknikal na terminong panghandog na malapit na nauugnay sa apoy. Iniiwasan ng salin ang pag-aangkat ng “pagkain” bilang tiyak na kahulugan habang pinananatili ang sakripisyal na larawan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “altar,” isang karaniwan at madaling makilalang terminong panrelihiyon. Ang mga marker na [a] at [b] ay inilagay kaagad pagkatapos ng mga terminong kanilang nililinaw.
