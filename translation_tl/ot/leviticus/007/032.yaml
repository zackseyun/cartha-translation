    rationale: Parehong tumutukoy ang “hain” at “handog” sa sacrificial offering sa pariralang ito. Hindi ito kailangan ng Hebreo at hindi natural sa modernong Tagalog.
  - severity: low
    issue: Maaaring hindi sapat na maipakita ng “bilang handog” ang pagiging nakalaang bahaging ibinibigay sa pari ng תְּרוּמָה.
    rationale: Ang talata ay tumutukoy sa isang itinalagang bahagi mula sa hain, hindi lamang sa hain sa pangkalahatan. Ang “nakalaang bahagi” ay mas tiyak at nananatiling di-teknikal.
