  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: tl
  text: At ibibigay ninyo sa pari ang kanang hita bilang nakalaang bahagi mula sa inyong mga handog para sa kapayapaan.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanang binti.”
