lexical_decisions:
- source_word: שׁוֹק
  choice: hita
  rationale: Tumutukoy sa itaas na bahagi ng binti ng hayop; mas tiyak ang “hita” kaysa sa mas malawak na “binti” sa konteksto ng paghahain.
- source_word: הַיָּמִין
  choice: kanan
  rationale: Tuwirang tinutukoy ang bahaging nasa kanan, kaya malinaw itong pinanatili.
- source_word: תִּתְּנוּ
  choice: ibibigay ninyo
  rationale: Ipinahahayag ng anyong pandiwa ang isang tagubiling nakatuon sa maramihang kausap; natural sa modernong Tagalog ang “ibibigay ninyo” bilang legal na utos.
- source_word: תְרוּמָה
  choice: bilang handog
  rationale: Ang salita ay tumutukoy sa bahaging ibinukod at inihandog. Natural at malinaw ang “handog,” samantalang ang tradisyonal na katawagang tumutukoy sa ritwal na pag-aangat ay maaaring maging malabo sa karaniwang mambabasa.
- source_word: לַכֹּהֵן
  choice: sa pari
  rationale: Tuwirang ipinakikita ang pari bilang tatanggap at pinananatili ang isahan ng Hebreo.
- source_word: מִזִּבְחֵי
  choice: mula sa inyong mga hain
  rationale: Ipinakikita ng pang-ukol ang pinagmumulan ng bahaging ibibigay, at pinananatili ng “inyong” ang hulaping ikalawang panauhang maramihan.
- source_word: שַׁלְמֵיכֶם
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili nito ang kaugnayan sa kapayapaan habang malinaw na kinikilala ang salita bilang pangalan ng isang uri ng handog; maaaring saklawin din ng termino ang pakikisama o kagalingan.
- source_word: וְאֵת
  choice: At
  rationale: Iniuugnay ng pangatnig ang tagubiling ito sa naunang talata; walang hiwalay na katumbas sa Tagalog ang pananda ng tuwirang layon.
