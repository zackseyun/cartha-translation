  source_fidelity: Tumpak na naihahatid ng draft ang kanang hita, ang pagbibigay sa pari, ang maramihang kausap, at ang pinagmumulan nito sa mga handog na שְׁלָמִים. Gayunman, ang “bilang handog” para sa תְּרוּמָה ay maaaring lumabo at magmukhang kapareho ng pangunahing hain; mas malinaw ang “bilang nakalaang bahagi,” na ipinapakita ang bahaging iniaatas para sa pari.
  naturalness: May hindi natural at paulit-ulit na pariralang “mga haing handog.” Sa modernong Tagalog, sapat at mas malinaw ang “mga handog.”
  terminology: Pinanatili ang “pari,” “kanang hita,” at “mga handog para sa kapayapaan.” Ang “nakalaang bahagi” ay isang malinaw na katumbas ng תְּרוּמָה nang hindi ipinapasok sa pangunahing teksto ang malabong tradisyonal na terminong ritwal.
