translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pari,” “hain,” at “handog” bilang karaniwang terminong panritwal; inilagay sa mga talababa ang mahahalagang alternatibong kahulugan nang hindi nilulutas ang tunay na lawak ng שְׁלָמִים.
