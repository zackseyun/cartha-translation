- from: Ngunit ang taong kumain ng karne mula sa handog para sa mabuting ugnayan na ukol kay Yahweh habang taglay niya ang kanyang karumihan—ang taong iyon ay ihihiwalay sa kanyang bayan.[a]
  to: Ngunit ang taong kumain ng karne mula sa handog na pangkapayapaan para kay Yahweh habang taglay niya ang kanyang karumihan—ang taong iyon ay ihihiwalay mula sa kanyang bayan.[a]
  rationale: Pinalitan ang deskriptibong “handog para sa mabuting ugnayan” ng “handog na pangkapayapaan” upang matukoy ang partikular na sakripisyong שְׁלָמִים nang hindi nagdaragdag ng isang layuning wala sa teksto. Pinanatili ang “ihihiwalay” at ang talababa upang hindi hatulan nang pauna kung ang “puputulin” ay pagpapaalis o kamatayan.
