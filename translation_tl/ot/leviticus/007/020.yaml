base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: tl
  text: Ngunit ang taong kumain ng karne mula sa handog na pangkapayapaan para kay Yahweh habang taglay niya ang kanyang karumihan—ang taong iyon ay ihihiwalay mula sa kanyang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itatakwil mula sa kanyang bayan.” Ang “ihihiwalay” ay maaaring tumukoy sa pagpapaalis o sa kamatayan, ngunit hindi tinutukoy rito ng Hebreo ang eksaktong paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: ang tao / ang taong iyon
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa isang indibidwal, hindi partikular sa di-materyal na kaluluwa. Likas at malinaw sa modernong Filipino ang “tao.”
- source_word: תֹּאכַל
  choice: kumain
  rationale: Ang imperfect ay naglalahad ng pangkalahatang kasong legal. Ang “ang taong kumain” ay natural na kondisyunal na pormulasyon sa Filipino.
- source_word: בָּשָׂר
  choice: karne
  rationale: Bagaman maaari itong literal na “laman,” ang “karne” ang malinaw na kahulugan sa konteksto ng pagkaing mula sa handog.
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: mula sa handog para sa mabuting ugnayan
  rationale: Ang זֶבַח הַשְּׁלָמִים ay isang tiyak na uri ng handog na kaugnay ng kapayapaan, kabuuan, at pakikisama. Ang “handog para sa mabuting ugnayan” ay madaling maunawaan at hindi nililimitahan ang salita sa pansariling kapayapaan lamang.
- source_word: אֲשֶׁר לַיהוָה
  choice: na ukol kay Yahweh
  rationale: Ipinahihiwatig ng parirala na ang handog ay itinalaga at nararapat kay Yahweh. Pinananatili rin ang personal na pangalan ng Diyos na nasa Hebreo.
- source_word: טֻמְאָתוֹ עָלָיו
  choice: habang taglay niya ang kanyang karumihan
  rationale: Pinananatili nito ang diwa ng literal na idyomang ang karumihan ay “nasa ibabaw” o nananatili sa tao, ngunit natural ang pagkakasabi sa Filipino.
- source_word: וְנִכְרְתָה
  choice: ay ihihiwalay
  rationale: Ipinahahayag nito ang matinding pag-aalis mula sa sambayanan nang hindi nagpapasiya kung ang eksaktong paraan ay pagpapatalsik o kamatayan.
- source_word: מֵעַמֶּיהָ
  choice: sa kanyang bayan
  rationale: Ang hulaping pambabae ay umaayon sa gramatikal na kasarian ng נֶפֶשׁ at hindi nangangahulugang babae lamang. Ang “kanyang” ay likas at neutral sa kasarian sa Filipino.
theological_decisions:
- issue: Kahulugan ng pormulang parusa na וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: ihihiwalay sa kanyang bayan
  alternative: itatakwil sa kanyang bayan; papatayin o mamamatay
  rationale: Malubhang pag-aalis mula sa sambayanang tipan ang ipinahihiwatig, ngunit hindi tinutukoy rito ng Hebreo ang eksaktong paraan. Kaya nananatiling pangkalahatan ang pangunahing teksto at inilalahad sa talababa ang saklaw ng maaaring kahulugan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “Yahweh” ayon sa tahasang banal na pangalan sa Hebreo. Iniwasan ang mas teknikal o makalumang “kaluluwa,” “laman,” at “karumihan ay nasa kanya,” habang pinanatili ang legal at ritwal na diwa ng talata.
