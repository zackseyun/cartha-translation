  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: tl
  text: Ngunit ang karneng madampian ng anumang marumi[a] ay hindi dapat kainin; dapat itong sunugin sa apoy. Tungkol naman sa karne, ang sinumang malinis ay maaaring kumain ng karne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “makontak ang anumang marumi.” Malawak ang Hebreo at tumutukoy rito sa rituwal na karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: Ngunit ang karne
  rationale: Sa konteksto ng handog, ang בָּשָׂר ay tumutukoy sa karneng kinakain, hindi sa abstraktong ‘laman.’ Ipinahihiwatig ng ‘Ngunit’ ang pagsalungat sa naunang pahintulot na kainin ang karne.
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: dumikit sa anumang marumi
  rationale: Ang יִגַּע ay nagsasaad ng pisikal na pagdikit o pagkakadampi. Pinananatiling malawak ng ‘anumang marumi’ ang saklaw ng כָּל טָמֵא nang hindi tinutukoy kung tao, bagay, o kalagayan ang pinagmulan ng rituwal na karumihan.
- source_word: לֹא יֵאָכֵל
  choice: ay hindi dapat kainin
  rationale: Likas sa modernong Tagalog ang pariralang ito at malinaw nitong naihahayag ang pasibong pagbabawal.
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: dapat itong sunugin sa apoy
  rationale: Ipinahahayag nito ang ipinag-uutos na pagsira sa kontaminadong karne at pinananatili ang konkretong larawan ng apoy.
- source_word: וְהַבָּשָׂר
  choice: Tungkol naman sa karne
  rationale: Ang pag-uulit sa pangngalan ay naghuhudyat ng paglipat mula sa maruming karne tungo sa karneng maaaring kainin. Natural na ipinakikita ng ‘Tungkol naman’ ang pagbabagong ito ng paksa.
- source_word: כָּל טָהוֹר
  choice: ang sinumang malinis
  rationale: Ginagamit ang pang-uri bilang pantukoy sa sinumang taong nasa kalagayang rituwal na malinis. Pinananatili ng ‘sinuman’ ang malawak at inklusibong bisa ng tuntunin.
- source_word: יֹאכַל בָּשָׂר
  choice: ay maaaring kumain nito
  rationale: Sa konteksto, nagbibigay ang sugnay ng pahintulot at hindi ng utos. Ang ‘nito’ ay malinaw na tumutukoy sa karneng nabanggit at umiiwas sa di-likas na pag-uulit ng ‘karne.’
theological_decisions:
- issue: Kahulugan ng טָמֵא at טָהוֹר sa batas tungkol sa handog
  choice: Isinalin bilang ‘marumi’ at ‘malinis,’ na tumutukoy sa kalagayang rituwal sa kontekstong ito.
  alternative: ‘nadungisan’ at ‘dalisay,’ o tahasang ‘rituwal na marumi’ at ‘rituwal na malinis’ sa pangunahing teksto
  rationale: Sa mga tuntunin ng Levitico tungkol sa handog, pangunahing inilalarawan ng mga terminong ito ang rituwal na kalagayan, hindi kinakailangang kasalanan o moral na katangian. Pinananatili ng salin ang tradisyonal at natural na pares habang nililinaw sa talababa ang rituwal na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘karne’ sa halip na ‘laman’ dahil pagkain mula sa handog ang tinutukoy. Ang legal na lakas ay ipinahayag sa ‘hindi dapat’ at ‘dapat,’ habang ang pahintulot ay ipinahayag sa ‘maaaring.’
