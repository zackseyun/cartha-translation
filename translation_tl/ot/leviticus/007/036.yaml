id: LEV.7.36
reference: Leviticus 7:36
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁר֩ צִוָּ֨ה יְהוָ֜ה לָ/תֵ֣ת לָ/הֶ֗ם בְּ/יוֹם֙ מָשְׁח֣/וֹ אֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: tl
  text: na iniutos ni Yahweh na ibigay sa kanila mula sa mga anak ni Israel sa araw na pinahiran niya sila—isang walang hanggang tuntunin sa lahat ng salinlahi nila.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mula sa mga Israelita.” Literal sa Hebreo: “mula sa mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “isang palagiang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוָּה
  choice: na iniutos
  rationale: Ipinagpapatuloy nito ang naunang pangungusap at pinananatili ang legal at makapangyarihang diwa ng utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לָתֵת לָהֶם
  choice: na ibigay sa kanila
  rationale: Bagaman literal na 'upang magbigay sa kanila,' mas malinaw at natural sa Tagalog ang pasibong ayos sa konstruksiyong ito; tumutukoy ang 'kanila' kay Aaron at sa kanyang mga anak.
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: noong araw na pahiran niya sila
  rationale: Pinananatili ang konkretong temporal na parirala at ang tiyak na kilos ng pagpapahid, sa halip na palawakin ito bilang pagtatalaga.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Malapit ito sa literal at tipanang katawagang 'mga anak ni Israel'; inilalagay sa talababa ang mas karaniwang 'mga Israelita.'
- source_word: חֻקַּת עוֹלָם
  choice: isang walang-hanggang tuntunin
  rationale: Ang 'tuntunin' ay natural ngunit may legal na bigat, at ang 'walang-hanggan' ay nagpapanatili sa lakas ng עוֹלָם nang hindi nilulutas ang saklaw nito lampas sa sinasabi ng teksto.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng salinlahi nila
  rationale: Natural na ipinahahayag sa Tagalog ang patuloy na bisa nito sa magkakasunod na salinlahi.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng עוֹלָם sa batas para sa mga pari
  choice: walang-hanggang tuntunin
  alternative: palagiang tuntunin
  rationale: Pinananatili ang matibay at nagpapatuloy na bisa ng pormulang legal, habang ang alternatibo ay ibinibigay upang ipakita ang lehitimong saklaw ng salita nang hindi nagdaragdag ng sistematikong paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormang legal ng talata at ang ugnayan nito sa naunang konteksto; ginamit ang 'pahiran' bilang tiyak na terminong ritwal.
