  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: tl
  text: Susunugin ng pari ang taba sa altar[a], at ang dibdib ay mapupunta kay Aaron at sa kanyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ihahandog ng pari ang taba sa altar sa pamamagitan ng usok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: Susunugin
  rationale: Sa konteksto ng paghahandog, ang Hiphil ng קטר ay tumutukoy sa pagsunog ng handog sa altar upang pumailanlang ang usok. Natural at malinaw sa modernong Filipino ang “susunugin”; nasa talababa ang mas tahasang diwa ng pagpapausok.
- source_word: הַכֹּהֵן
  choice: ng pari
  rationale: Karaniwang katumbas ng כֹּהֵן sa kontekstong pangritwal; pinananatili ang isahan.
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Tumutukoy sa mga bahaging taba ng hayop na nakalaan upang sunugin sa altar.
- source_word: הַמִּזְבֵּחָה
  choice: sa ibabaw ng altar
  rationale: Bagaman may hulaping paturol na maaaring literal na “patungo sa altar,” ipinahihiwatig ng pandiwang panghandog na sinusunog ang taba sa ibabaw ng altar. Nililinaw ito ng natural na pariralang Filipino.
- source_word: וְהָיָה
  choice: ay mapupunta
  rationale: Ang literal na “magiging” ay may diwang legal ng paglalaan o pag-aari rito. Ipinahahayag ng “mapupunta” ang nakatalagang bahagi nang natural at hindi labis na nagpapakahulugan.
- source_word: הֶחָזֶה
  choice: ang dibdib
  rationale: Sa batas ng paghahandog, ang חָזֶה ay ang bahaging dibdib ng hayop na inilalaan sa mga pari.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kay Aaron at sa kanyang mga anak
  rationale: Ang lemed ay nagpapahiwatig ng paglalaan o pag-aari; natural na ipinapahayag ito sa Filipino sa pamamagitan ng “kay” at “sa.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pari” at “altar,” na karaniwan at madaling maunawaan sa kontekstong biblikal. Pinanatili sa talababa ang usok na nakapaloob sa pandiwang Hebreo.
