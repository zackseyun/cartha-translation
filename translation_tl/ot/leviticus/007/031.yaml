  naturalness: Natural at malinaw ang pangunahing pangungusap. Mas idiomatiko ang “sa altar” kaysa “sa ibabaw ng altar,” sapagkat ang pandiwang “susunugin” ay nagpapahiwatig na ng ritwal na pagkakasunog sa altar. Hindi natural ang kasalukuyang pananalita sa talababa na “pauusukin bilang handog.”
  terminology: Ang “pari,” “taba,” “altar,” at “dibdib” ay angkop at pare-pareho sa modernong Filipino at sa terminolohiyang panghandog. Pinananatili ang pangalan na Aaron.
