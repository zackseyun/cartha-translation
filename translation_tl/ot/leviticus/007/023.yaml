id: LEV.7.23
reference: Leviticus 7:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: tl
  text: Sabihin mo sa mga anak ni Israel[a], ‘Huwag kayong kumain ng anumang taba ng baka, tupa, o kambing.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas karaniwang pananalita, “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang Piel imperative na panlalaking isahan ay tuwirang utos kay Moises. Natural sa makabagong Tagalog ang “Sabihin mo” sa pormulang pambatas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na anyong “mga anak ni Israel,” habang ang tinutukoy ay ang bayang Israel bilang kabuuan; inilalahad sa talababa ang mas idyomatikong alternatibo.
- source_word: לֵאמֹר
  choice: ‘…’
  rationale: Ang infinitive na panimula sa tuwirang pahayag ay natural na naipahihiwatig sa Tagalog sa pamamagitan ng sipi pagkatapos ng “Sabihin mo”; ang hiwalay na “na sinasabi” ay magiging pilit.
- source_word: כָּל
  choice: anumang
  rationale: Sa isang pagbabawal na may di-mabilang na pangngalan, malinaw na ipinahahayag ng “anumang” ang saklaw na walang eksepsiyon.
- source_word: חֵלֶב
  choice: taba
  rationale: Tumutukoy ito sa taba ng hayop, lalo na sa mga bahaging taba na saklaw ng batas sa paghahandog. “Taba” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: שׁוֹר
  choice: baka
  rationale: Ang salita ay tumutukoy sa hayop na bovine nang hindi kinakailangang espesipiko sa kasarian. Mas natural at mas malawak ang “baka” kaysa “toro” o “barakong baka.”
- source_word: כֶשֶׂב
  choice: tupa
  rationale: Pangkalahatang kategorya ng tupa ang tinutukoy; iiwasan ng “tupa” ang labis na pagtukoy sa edad o kasarian gaya ng “kordero” o “barakong tupa.”
- source_word: עֵז
  choice: kambing
  rationale: Bagaman pambabae ang anyong gramatikal, ginagamit ito rito bilang karaniwang katawagan sa uri ng hayop; “kambing” ang natural na pangkalahatang salin.
- source_word: לֹא תֹאכֵלוּ
  choice: Huwag kayong kumain
  rationale: Ang negated imperfect na maramihan ay isang legal na pagbabawal. Ang “Huwag kayong kumain” ay tuwiran, dignified, at natural sa makabagong Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang literal na katawagang “mga anak ni Israel” na may idyomatikong alternatibo sa talababa; ginawang tuwirang sipi ang pormulang לֵאמֹר upang maiwasan ang di-natural na “na sinasabi.”
