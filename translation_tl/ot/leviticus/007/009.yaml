translation_notes:
  register: Modernong Filipino na may marangal at malinaw na tonong pambatas-ritwal. Ginamit ang “pari” sa halip na mas teknikal o arkaikong tawag. Isinaad sa mismong teksto ang malamang na pagkakaiba ng dalawang kasangkapang panluto upang mapanatili ang leksikal na kaibhan ng Hebreo. Nilagyan ng tuldik ang “lapád” upang hindi ito mabasa bilang pangngalang “lapad.”
