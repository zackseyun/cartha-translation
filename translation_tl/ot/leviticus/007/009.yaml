  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: tl
  text: At ang bawat handog na butil na inihurno sa hurno, at ang bawat handog na inihanda sa kawali o sa patag na lutuan[a], ay mapupunta sa paring naghahandog nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa malalim na kawali o sa patag na kawali.” Hindi tiyak ang eksaktong anyo ng dalawang sisidlang panluto na tinutukoy ng mga salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa konteksto ng mga paghahandog sa Levitico, tumutukoy ito sa handog na mula sa butil, hindi sa pangkalahatang handog lamang.
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: inihurno sa pugon
  rationale: Pinananatili ang pasibong diwa ng pandiwa at ang sinaunang kasangkapang tinutukoy ng תַּנּוּר; ang “pugon” ay likas at marangal na salin sa Filipino.
- source_word: נַעֲשָׂה
  choice: inihanda
  rationale: Malawak ang kahulugan ng עשה, ngunit sa konteksto ng pagkain, malinaw at hindi labis na espesipiko ang “inihanda.”
- source_word: מַרְחֶשֶׁת
  choice: malalim na kawali
  rationale: Malamang na tumutukoy ito sa isang mas malalim na sisidlang panluto; ipinakikita ng salin ang malamang na kaibhan nito sa מַחֲבַת.
- source_word: מַחֲבַת
  choice: lapád na kawali
  rationale: Malamang na ito ay mas patag na pan o lutuan kaysa מַרְחֶשֶׁת. Mas madaling maunawaan sa Filipino ang “lapád na kawali” kaysa isang hiram na teknikal na termino.
- source_word: לַכֹּהֵן ... לוֹ תִהְיֶה
  choice: ay mapupunta sa pari
  rationale: Ipinahahayag ng konstruksyon ang legal na paglalaan o pag-aari. Ang “mapupunta sa” ay natural sa modernong Filipino at malinaw na nagsasaad kung kanino nakatalaga ang handog.
- source_word: הַמַּקְרִיב אֹתָהּ
  choice: paring naghahandog nito
  rationale: Sa kontekstong ritwal, ang Hiphil ng קרב ay tumutukoy sa pagdadala o paghahandog ng handog; ang “naghahandog” ay tuwiran at angkop sa Filipino.
