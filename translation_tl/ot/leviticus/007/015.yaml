base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: tl
  text: At ang karne ng handog niyang pangkapayapaan bilang pasasalamat ay kakainin sa araw ng paghahandog nito; hindi siya magtitira ng anuman nito hanggang kinaumagahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hanggang umaga.”
    reason: Ang עַד בֹּקֶר ay literal na “hanggang umaga”; ginamit sa teksto ang mas natural na “hanggang kinaumagahan,” na nagpapahiwatig ng kasunod na umaga.
lexical_decisions:
- source_word: וּבְשַׂר
  choice: At ang karne
  rationale: Ang בשר ay maaaring mangahulugang laman o karne. Ang “karne” ang likas at malinaw na tawag sa bahaging kinakain mula sa hayop na inihandog.
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: ng handog na pangkapayapaan bilang pasasalamat
  rationale: Ipinapakita ng siksik na pariralang Hebreo ang isang handog na pangkapayapaan na inihahandog bilang pasasalamat. Pinananatili ng salin ang dalawang ideya nang hindi ipinapalagay ang isang tiyak na paliwanag sa kahulugan ng ritwal.
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: sa araw na ialay iyon
  rationale: Mas natural sa modernong Tagalog ang pandiwang parirala kaysa sa literal na “sa araw ng paghahandog niya,” at malinaw na tumutukoy ang “iyon” sa handog.
- source_word: יֵאָכֵל
  choice: ay kakainin
  rationale: Pinananatili nito ang balintiyak na anyo ng Niphal at ang puwersa ng tuntunin.
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ
  choice: hindi siya magtitira ng anuman mula rito
  rationale: Ang Hiphil ng נוח ay nangangahulugang mag-iwan o magtira. Pinananatili ng “siya” ang isahang paksa sa Hebreo, samantalang nililinaw ng “ng anuman” na walang bahagi ang dapat matira.
- source_word: עַד בֹּקֶר
  choice: hanggang kinaumagahan
  rationale: Ito ang natural na modernong Tagalog para sa takdang panahong umaabot sa kasunod na umaga.
theological_decisions:
- issue: Salin ng kategoryang sakripisyal na שְׁלָמִים
  choice: handog na pangkapayapaan
  alternative: handog para sa pakikisama
  rationale: Ang “handog na pangkapayapaan” ay nagpapanatili ng tradisyonal at mas di-interpretatibong katawagan sa natatanging uri ng handog; ang “pakikisama” ay maaaring magtakda agad ng isang paliwanag sa layunin ng ritwal.
- issue: Ugnayan ng תּוֹדָה at שְׁלָמִים
  choice: handog na pangkapayapaan bilang pasasalamat
  alternative: handog ng pasasalamat na pangkapayapaan
  rationale: Ipinahihiwatig ng konstruksiyon na ito ay isang uri ng handog na pangkapayapaan na inihahandog bilang pasasalamat. Ang napiling ayos ay malinaw sa Tagalog at hindi binubura ang dalawang sangkap ng parirala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal, na may pare-parehong katawagang panritwal. Iniwasan ang labis na teknikal o denominasyonal na pananalita. Inilagay ang kinakailangang panandang [a] sa pangunahing teksto.
