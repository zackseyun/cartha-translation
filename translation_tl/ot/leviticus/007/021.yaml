id: LEV.7.21
reference: Leviticus 7:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: tl
  text: At kung ang isang tao ay humipo sa anumang marumi—sa karumihan ng tao, sa maruming hayop, o sa anumang maruming kasuklam-suklam na bagay—at kumain ng laman ng handog na pangkapayapaan na para kay Yahweh, ang taong iyon ay puputulin mula sa kanyang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “puputulin mula sa kanyang bayan” ay pormulang pangkaparusahan sa tipan. Hindi tinutukoy rito kung ang paraan ay pagpapaalis sa sambayanan, kamatayan, o hatol ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: isang tao / ang taong iyon
  rationale: Sa kontekstong legal, tumutukoy ito sa isang indibidwal, hindi sa di-materyal na “kaluluwa.”
- source_word: תִגַּע
  choice: humipo
  rationale: Tuwirang ipinapahayag ang rituwal na pagkakadikit o paghipo.
- source_word: בְּכָל טָמֵא
  choice: anumang marumi
  rationale: Pinananatili ang malawak at di-tiyak na saklaw ng parirala.
- source_word: טֻמְאַת אָדָם
  choice: karumihan ng tao
  rationale: Tumutukoy ito sa rituwal na karumihang kaugnay ng isang tao; hindi ito partikular sa lalaki.
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: maruming hayop
  rationale: Ang “hayop” ay malinaw at sapat na malawak para sa בְּהֵמָה sa kontekstong ito.
- source_word: שֶׁקֶץ טָמֵא
  choice: maruming kasuklam-suklam na bagay
  rationale: Pinananatili ang parehong rituwal na karumihan at matinding pagkasuklam na ipinahihiwatig ng שֶׁקֶץ.
- source_word: וְאָכַל מִבְּשַׂר
  choice: kumain ... ng laman
  rationale: Natural sa Tagalog ang partitive na diwa nang hindi kailangang idagdag ang “ilan sa”; ang “laman” ay angkop sa bokabularyong panghandog.
- source_word: זֶבַח הַשְּׁלָמִים
  choice: handog para sa kapayapaan
  rationale: Malapit ito sa tradisyonal na pangalan ng handog habang ipinahihiwatig ang kaugnayan ng שְׁלָמִים sa kapayapaan o kabuuan.
- source_word: אֲשֶׁר לַיהוָה
  choice: na para kay Yahweh
  rationale: Pinananatili ang bahagyang luwag ng לַ, na maaaring magpahiwatig ng paglalaan o pag-aari.
- source_word: יהוה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalang Hebreo sa malinaw na transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: ititiwalag mula sa kanyang bayan
  rationale: Ipinahahayag ang larawan ng pagkaputol mula sa sambayanan nang hindi tinutukoy kung ang paraan ay pagpapaalis, kamatayan, o hatol ng Diyos.
theological_decisions:
- issue: Eksaktong kahulugan ng parusang וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: ititiwalag mula sa kanyang bayan
  alternative: papatayin; aalisin sa kanyang bayan
  rationale: Hindi tinutukoy ng Hebreo ang eksaktong paraan ng pagkaputol. Ang salin ay hindi dapat magpasya kung ito ay ekskomunikasyon, kamatayan, o tuwirang hatol ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Ginamit ang “karumihan” at “marumi” bilang magkakaugnay na terminong rituwal, at iniwasang gawing mas tiyak kaysa sa Hebreo ang kaparusahan.
