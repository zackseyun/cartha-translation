  to: At kung ang isang tao ay humipo sa anumang marumi—sa karumihan ng tao, sa maruming hayop, o sa anumang maruming kasuklam-suklam na bagay—at kumain ng laman ng handog na pangkapayapaan na para kay Yahweh, ang taong iyon ay puputulin mula sa kanyang bayan.[a]
