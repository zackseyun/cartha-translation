  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: tl
  text: Maaaring kainin iyon ng bawat lalaking kabilang sa mga pari[a]. Dapat itong kainin sa isang banal na lugar. Kabanal-banalan iyon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kakainin iyon ng bawat lalaking kabilang sa mga pari.” Maaaring isalin nang mas pormal ang Hebreo, ngunit ipinahihiwatig ng konteksto na pinahihintulutang kainin iyon ng sinumang lalaking kabilang sa mga pari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “banal ng mga banal,” isang idyomang nangangahulugang “kabanal-banalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: bawat lalaking kabilang sa mga pari
  rationale: Pinananatili nito ang distributibong כָּל, ang tahasang pagtukoy sa kasariang זָכָר, at ang diwa ng pagiging kabilang sa pangkat ng mga pari.
- source_word: יֹאכְלֶנּוּ
  choice: Maaaring kainin iyon
  rationale: Sa konteksto ng batas tungkol sa handog, ipinahihiwatig ng imperfect ang pinahihintulutang karapatang kumain, hindi lamang isang pangyayari sa hinaharap.
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang tiyak na pantukoy ang מָקוֹם; ang “isang banal na lugar” ay hindi nagpapahiwatig na ang mismong santuwaryo lamang ang tinutukoy.
- source_word: יֵאָכֵל
  choice: Dapat itong kainin
  rationale: Ipinahahayag ng Niphal na anyong pasibo ang legal na tagubilin tungkol sa lugar ng pagkain; natural sa Tagalog ang “dapat itong kainin.”
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: Kabanal-banalan
  rationale: Ang Hebreong pariralang literal na “banal ng mga banal” ay isang superlatibong idyoma para sa pinakamataas na antas ng kabanalan.
- source_word: הוּא
  choice: iyon
  rationale: Tumutukoy ang panghalip sa handog o bahaging pinag-uusapan; malinaw at natural dito ang “iyon.”
theological_decisions:
- issue: Ang pagkain ay nakalaan sa mga lalaking kabilang sa mga pari
  choice: bawat lalaking kabilang sa mga pari
  alternative: bawat pari
  rationale: Tahasan sa Hebreo ang זָכָר (“lalaki”), kaya hindi ito nilalahat sa lahat ng pari anuman ang kasarian.
- issue: Lakas ng legal na pahayag sa יֹאכְלֶנּוּ
  choice: Maaaring kainin iyon
  alternative: Kakainin iyon
  rationale: Pinananatili ang posibleng diwa ng pinahihintulutang karapatan sa konteksto ng batas sa paghahandog, habang itinatala sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kabilang sa mga pari” upang likas na ipahayag ang pagiging kasapi sa pangkat, at “kabanal-banalan” bilang pamilyar na superlatibong panrelihiyon. Inilagay ang mga pananda ng talababa sa mismong tekstong salin.
