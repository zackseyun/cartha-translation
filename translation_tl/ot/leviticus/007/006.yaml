  terminology: Ang “pari,” “banal na lugar,” at “kabanal-banalan” ay pare-pareho at angkop sa rehistrong pangkulto ng Levitico. Ang talababa b ay wastong nakakabit sa “Kabanal-banalan,” ang bahaging tinutukoy ng Hebreong idiom, hindi sa “banal na lugar.”
