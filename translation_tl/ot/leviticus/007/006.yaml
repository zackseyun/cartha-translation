  source_fidelity: 'Tumpak na naipapahayag ng salin ang lahat ng pangunahing sangkap ng Hebreo: ang saklaw na “bawat,” ang tahasang paghihigpit sa mga lalaking kasapi ng mga pari, ang pahintulot na kumain, ang utos na kainin ito sa isang banal na lugar, at ang katawagang pangkultong “kabanal-banalan.” Ang “Maaaring kainin” ay angkop na pagpapahayag ng pinahihintulutang paglahok sa regulasyong ito, samantalang ang “Dapat itong kainin” ay sapat na naghahatid ng preskriptibong pasibong pahayag tungkol sa lugar.'
