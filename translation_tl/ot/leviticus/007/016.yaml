base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: tl
  text: Ngunit kung ang haing inihandog niya ay panatang handog o kusang-loob na handog[a], kakainin ito sa araw na ihain niya ang kanyang hain; at sa kinabukasan, maaari pang kainin ang natira rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog bilang pagtupad sa isang panata.” Itinatangi sa Hebreo ang haing kaugnay ng isang panata sa handog na kusang-loob na ibinigay.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: dahil sa isang panata
  rationale: Ang נֶדֶר ay panata o handog na nauugnay sa pagtupad ng panata. Sa konteksto, inilalarawan nito ang dahilan o uri ng hain at itinatangi ito sa kusang-loob na handog.
- source_word: נְדָבָה
  choice: kusang-loob na handog
  rationale: Tumutukoy ang נְדָבָה sa handog na malayang ibinibigay at hindi dahil sa obligasyon; natural at malinaw ito sa modernong Filipino.
- source_word: זֶבַח קָרְבָּנוֹ
  choice: ang handog niyang hain
  rationale: Pinananatili ng parirala ang dalawang kaugnay na konsepto ng קָרְבָּן (handog na inihaharap) at זֶבַח (hain), nang hindi nagiging labis na teknikal sa Filipino.
- source_word: בְּיוֹם הַקְרִיבוֹ
  choice: sa araw na ihain niya
  rationale: Ang Hiphil ng קרב ay paghaharap o pag-aalay sa kontekstong panghain. Ang 'ihain' ay natural at tiyak sa Filipino.
- source_word: יֵאָכֵל
  choice: kakainin iyon
  rationale: Ang Niphal imperfect ay may legal at mapag-utos na puwersa rito; ang 'kakainin' ay nagpapanatili sa itinakdang pamamaraan.
- source_word: וּמִמָּחֳרָת
  choice: at sa kinabukasan
  rationale: Ang מָחֳרָת ay ang kasunod na araw; malinaw at karaniwan ang 'sa kinabukasan'.
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: ang natira rito
  rationale: Ipinahahayag nito ang anumang bahaging naiwan mula sa hain; maikli at natural sa Filipino.
- source_word: יֵאָכֵל
  choice: maaari pang kainin
  rationale: Bagaman kapareho ng naunang anyong Hebreo, sa ikalawang sugnay ay ang pahintulot na kainin ang natira sa kasunod na araw ang diin. Nililinaw ng 'maaari pang' ang kontekstuwal na puwersang ito.
