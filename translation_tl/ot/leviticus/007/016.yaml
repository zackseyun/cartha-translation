translation_notes:
  register: Modernong Filipino na may marangal at malinaw na tonong legal-panrelihiyon. Ginamit ang 'hain' at 'handog' upang mapanatili ang magkahiwalay ngunit magkaugnay na mga terminong Hebreo. Ang panghalip at ayos ng pangungusap ay ginawang natural para sa karaniwang mambabasa.
