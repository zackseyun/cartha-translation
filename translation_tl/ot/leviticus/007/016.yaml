  source_fidelity: 'Tumpak ang pangunahing pagkakasunod at puwersang legal ng talata: ang hain ay kinakain sa araw ng paghahain, at ang natira ay maaari pang kainin kinabukasan. Gayunman, ang "ay dahil sa isang panata o kusang-loob na handog" ay hindi magkatimbang ang pagkakaugnay: ang una ay nagsasaad ng dahilan, samantalang ang ikalawa ay isang uri ng handog. Ang binagong anyo ay malinaw na itinatangi ang dalawang kategoryang Hebreo, נֶדֶר at נְדָבָה.'
