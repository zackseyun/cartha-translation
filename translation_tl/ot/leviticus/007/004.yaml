base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: tl
  text: at ang dalawang bato, ang tabang nasa ibabaw ng mga ito, na nasa may bandang baywang, at ang nakausling bahagi na nasa ibabaw ng atay[a], na aalisin niya kasama ng mga bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “umbok sa atay.” Teknikal ang salitang Hebreo para sa bahaging ito ng katawan, at pinagtatalunan ang eksaktong tinutukoy nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: dalawang bato
  rationale: Ang כְּלָיֹת ay tumutukoy sa mga kidney sa konteksto ng paghahandog; “mga bato” ang karaniwang makabagong terminong Filipino.
- source_word: הַחֵלֶב
  choice: taba
  rationale: Sa mga tuntunin tungkol sa handog, tumutukoy ang חֵלֶב sa matatabang bahaging nakalaan para sa paghahandog; malinaw at natural ang “taba.”
- source_word: אֲשֶׁר עֲלֵיהֶן
  choice: na nasa ibabaw ng mga iyon
  rationale: Pinananatili nito ang payak na lokatibong kahulugan ng עַל nang hindi idinaragdag ang mas interpretibong “bumabalot.”
- source_word: הַכְּסָלִים
  choice: mga tagiliran
  rationale: Tumutukoy ang כְּסָלִים sa bahaging malapit sa mga bato, sa gawing baywang o tagiliran; “mga tagiliran” ang mas madaling maunawaang anatomiya sa modernong Filipino.
- source_word: הַיֹּתֶרֶת
  choice: nakausling bahagi
  rationale: Teknikal at pinagtatalunan ang eksaktong tinutukoy na bahagi; ang “nakausling bahagi” ay kongkreto ngunit umiiwas sa di-tiyak na labis na espesipikasyon.
- source_word: עַל הַכָּבֵד
  choice: ng atay
  rationale: Sa natural na Filipino, ipinahihiwatig ng “nakausling bahagi ng atay” ang bahaging nasa o kaugnay ng atay nang hindi nagpapasok ng tiyak na anatomiya na wala sa teksto.
- source_word: עַל הַכְּלָיֹת
  choice: kasama ng mga bato
  rationale: Sa pormulang ito ng paghahandog, ipinahihiwatig ng parirala ang sabayang pag-aalis sa bahaging ito at sa mga bato; natural itong naihahayag ng “kasama ng mga bato.”
- source_word: יְסִירֶנָּה
  choice: aalisin niya
  rationale: Ang Hiphil ng סור ay isang tagubiling alisin ang bahaging tinutukoy; ang anyong panghinaharap sa Filipino ay angkop sa legal at pamamaraang pahayag.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na talaan ng mga bahaging aalisin, ngunit inayos ang huling sugnay upang maging likas sa Filipino. Inilagay ang talababa sa teknikal na katawagang pang-atay na aktuwal na pinagtatalunan.
