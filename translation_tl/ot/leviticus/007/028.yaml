  source_fidelity: Tumpak na naihahatid ng draft ang waw-consecutive na pagsulong ng salaysay, ang pandiwang דִּבֵּר bilang pagsasalita, ang pangalan na Yahweh, at ang kausap na si Moises. Gayunman, ang לֵאמֹר ay pormulang pambungad sa kasunod na tuwirang pahayag at mas tumpak na maisasalin sa natural na Filipino sa pamamagitan ng “at sinabi niya:” kaysa “na sinasabi,” na nagpapahiwatig ng kasalukuyang kilos.
  naturalness: Ang “At nagsalita si Yahweh kay Moises, na sinasabi,” ay hindi natural sa modernong Filipino. Ang “At nagsalita si Yahweh kay Moises at sinabi niya:” ay malinaw, marangal, at angkop na pambungad sa pananalitang nagpapatuloy sa susunod na talata.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה at “Moises” para sa משה. Ang talababa hinggil sa YHWH ay wasto at nananatiling nakaangkla sa “Moises,” gaya ng English audit trail.
