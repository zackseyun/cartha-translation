lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Pinananatili ang pagpapatuloy ng salaysay na ipinahihiwatig ng waw-consecutive at ang kahulugan ng דבר bilang “magsalita,” na naiiba sa אמר, “sabihin.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong kinausap; “kay Moises” ang natural na katumbas sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili ang pormulang Hebreo na nagpapakilala sa tuwirang pahayag, kahit nagpapatuloy pa ang nilalaman nito sa kasunod na talata.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Pinanatili ang tradisyonal na pormulang “na sinasabi” upang maipakita na ang kasunod na talata ang nilalaman ng sinabi.
