base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: tl
  text: Kung ihahandog niya ito bilang handog ng pasasalamat[a], kasama ng haing pasasalamat ay maghahandog siya ng mga tinapay na walang pampaalsa na hinaluan ng langis, maninipis na tinapay na walang pampaalsa na pinahiran ng langis, at mga tinapay na gawa sa pinong harina na masusing hinalo sa langis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “handog bilang pasasalamat.” Ang salitang Hebreo ay tumutukoy sa handog na dinadala bilang pagpapahayag ng pasasalamat.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong paraan ng paghahandang tinutukoy ng salitang Hebreo na isinaling “masusing hinalo”; maaaring tumukoy ito sa pinong harinang masusing hinalo o minasa kasama ng langis.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: handog ng pasasalamat
  rationale: Sa kontekstong ito, tumutukoy ito sa isang handog na iniaalay bilang pasasalamat; malinaw at likas ang parirala sa modernong Filipino.
- source_word: יַקְרִיבֶנּוּ
  choice: inihahandog niya iyon
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay nangangahulugang iharap o ihandog; pinananatili ng salin ang tahasang diwa ng paghahandog.
- source_word: זֶבַח הַתּוֹדָה
  choice: haing pasasalamat
  rationale: Ipinahahayag nito nang maikli at natural ang haing ang katangian o layunin ay pasasalamat.
- source_word: חַלּוֹת מַצּוֹת
  choice: mga tinapay na walang pampaalsa
  rationale: Inilalarawan ang mga yunit ng tinapay at malinaw na pinananatili ang kawalan ng pampaalsa.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Ang בלל ay tumutukoy sa paghahalo ng sangkap; natural sa konteksto ng paghahanda ng pagkain ang 'hinaluan ng langis.'
- source_word: רְקִיקֵי מַצּוֹת
  choice: maninipis na tinapay na walang pampaalsa
  rationale: Tinutukoy ng רְקִיקִים ang maninipis na tinapay o wafer; mas madaling maunawaan ng karaniwang mambabasa ang deskriptibong salin.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: pinahiran ng langis
  rationale: Literal itong maaaring 'pinahiran' o 'pinahiran na gaya ng paglangis'; sa konteksto ng pagkain, malinaw ang 'pinahiran' at hindi ito nag-aangkat ng di-kinakailangang seremonyal na kahulugan.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Ito ang karaniwan at tumpak na katumbas para sa mataas na uring pinong harinang ginagamit sa mga handog.
- source_word: מֻרְבֶּכֶת
  choice: mahusay na inihalo
  rationale: Hindi tiyak ang eksaktong paraan ng paghahandang tinutukoy ng bihirang terminong ito; pinananatili ng salin ang pangkalahatang ideya ng masusing paghahalo nang hindi nagiging labis na tiyak.
- source_word: חַלֹּת
  choice: mga tinapay
  rationale: Ang salita ay maaaring tumukoy sa mga tinapay o cake; 'mga tinapay' ang natural at hindi labis na espesipikong salin sa Filipino.
theological_decisions:
- issue: Ugnayan ng תּוֹדָה sa handog pangkapayapaan
  choice: Isinalin bilang 'handog ng pasasalamat' nang hindi idinaragdag sa talata ang klasipikasyong 'handog pangkapayapaan.'
  alternative: handog pangkapayapaan bilang pasasalamat
  rationale: Bagaman ipinapakita ng mas malawak na konteksto na isa itong uri ng handog pangkapayapaan, ang mismong talata ay gumagamit ng תּוֹדָה; iniiwasan ng salin ang pagdaragdag ng katawagang wala sa pangungusap.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang 'langis' sa halip na 'mantika' upang umangkop sa rehistrong biblikal ngunit manatiling madaling maunawaan. Iniwasan ang teknikal na 'ostiya' o hiram na 'wafer' at ginamit ang deskriptibong 'maninipis na tinapay.'
