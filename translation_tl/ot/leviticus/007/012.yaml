revisions:
- from: Kung inihahandog niya iyon bilang handog ng pasasalamat[a], kasama ng haing pasasalamat ay maghahandog siya ng mga tinapay na walang pampaalsa at hinaluan ng langis, maninipis na tinapay na walang pampaalsa at pinahiran ng langis, at mga tinapay mula sa pinong harina na mahusay na inihalo sa langis.[b]
  to: Kung ihahandog niya ito bilang handog ng pasasalamat[a], kasama ng haing pasasalamat ay maghahandog siya ng mga tinapay na walang pampaalsa na hinaluan ng langis, maninipis na tinapay na walang pampaalsa na pinahiran ng langis, at mga tinapay na gawa sa pinong harina na masusing hinalo sa langis.[b]
  rationale: Ginawa lamang ang maliliit na pagbabago para sa mas tumpak na kondisyunal na aspekto at mas likas na Filipino. Nananatili ang saklaw at kawalang-katiyakan ng terminong pangkulinarya, ang pagkakaiba ng mga maninipis na tinapay at iba pang tinapay, at ang kahulugang pangpagkain ng pagpahid ng langis.
