  naturalness: Nauunawaan ang draft, ngunit ang “Ang sarili niyang mga kamay ang magdadala” ay medyo hindi likas sa modernong Tagalog. Mas natural ang “Dadalhin niya mismo, gamit ang sarili niyang mga kamay,” habang naipananatili ang pagbibigay-diin ng Hebreo.
