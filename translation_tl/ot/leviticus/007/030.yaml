base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: tl
  text: Dadalhin niya mismo, gamit ang sarili niyang mga kamay, ang mga handog na inihahandog sa apoy para sa PANGINOON. Dadalhin niya ang taba na nasa ibabaw ng dibdib upang iwagayway ang dibdib bilang handog na iwinawagayway sa harap ng PANGINOON.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: ang sarili niyang mga kamay
  rationale: Pinananatili ang diin ng Hebreo na ang mismong naghahandog ang personal na magdadala nito.
- source_word: אִשֵּׁי יְהוָה
  choice: mga handog na pinaraan sa apoy para sa PANGINOON
  rationale: Ipinahahayag ang teknikal na diwa ng אִשֶּׁה bilang handog na inihahain sa pamamagitan ng apoy, nang hindi ito nililimitahan sa karne o pagkain lamang.
- source_word: הַחֵלֶב עַל־הֶחָזֶה
  choice: ang taba kasama ng dibdib
  rationale: Ang עַל ay maaaring literal na 'sa ibabaw ng,' ngunit sa ritwal na tagubiling ito ay natural na nagpapahiwatig na magkasamang dadalhin ang taba at dibdib; hindi tinutukoy ng talata ang tiyak na pagkakaayos ng mga ito.
- source_word: לְהָנִיף ... תְּנוּפָה
  choice: upang iwagayway ... bilang handog na iwinawagayway
  rationale: Pinananatili ang pag-uulit ng ugat sa Hebreo at malinaw na inilalarawan ang ritwal na kilos at uri ng handog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ng PANGINOON
  rationale: Karaniwan, malinaw, at marangal na salin ng pariralang tumutukoy sa ritwal na isinasagawa sa presensya ng Diyos.
theological_decisions:
- issue: Paglalarawan sa אִשֵּׁי יְהוָה
  choice: mga handog na pinaraan sa apoy para sa PANGINOON
  alternative: mga handog na pagkain ng PANGINOON
  rationale: Iniiwasang ipakahulugan na literal na nangangailangan ng pagkain ang Diyos, habang pinananatili ang kultikong kategorya ng handog na may kaugnayan sa apoy.
- issue: Layunin ng pagdadala sa dibdib
  choice: upang iwagayway ang dibdib
  alternative: para maiwagayway ang dibdib
  rationale: Ang infinitive לְהָנִיף ay pinakasimpleng mababasa bilang layunin ng pagdadala; hindi idinaragdag kung sino ang magsasagawa ng ritwal lampas sa ipinahihiwatig ng gramatika.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “PANGINOON” para sa banal na pangalang YHWH, at pinanatili ang teknikal ngunit malinaw na katawagang “handog na iwinawagayway.”
