  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: tl
  text: At ang bawat handog na butil na hinaluan ng langis, o tuyo, ay magiging para sa lahat ng mga anak na lalaki ni Aaron; ang bahagi ng bawat isa ay kapantay ng bahagi ng kanyang kapatid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bawat isa ay kapantay ng kanyang kapatid.” Binibigyang-diin ng idyomang Hebreo ang pantay na pamamahagi sa mga anak na lalaki ni Aaron.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa kontekstong panghandog ng Levitico, tumutukoy ito sa handog na mula sa butil, hindi lamang sa isang pangkalahatang kaloob.
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: hinaluan ng langis
  rationale: Likas at malinaw na Filipino para sa paraang inihanda ang handog.
- source_word: חֲרֵבָה
  choice: tuyo
  rationale: Pinananatili ang maikli at tuwirang salungat sa handog na hinaluan ng langis, nang hindi tahasang idinaragdag ang interpretasyong 'walang langis.'
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: ay mapupunta sa lahat ng anak na lalaki ni Aaron
  rationale: Ipinahahayag ang legal na paglalaan o pag-aari sa natural na modernong Filipino.
- source_word: בְּנֵי אַהֲרֹן
  choice: mga anak na lalaki ni Aaron
  rationale: Pinananatili ang tahasang panlalaking katawagan ng Hebreo sa kontekstong pangpari.
- source_word: אִישׁ כְּאָחִיו
  choice: bawat isa ay kapantay ng kanyang kapatid
  rationale: Pinananatili ang distributibong diwa at paghahambing na nagpapahiwatig ng pantay na bahagi sa bawat isa.
theological_decisions:
- issue: Panlalaking katawagan para sa mga pari
  choice: mga anak na lalaki ni Aaron ... kanyang kapatid
  alternative: mga anak o mga inapo ni Aaron ... nang pantay-pantay
  rationale: Tahasang gumagamit ang Hebreo ng mga panlalaking terminong pangkamag-anakan sa isang legal na kontekstong pangpari, kaya hindi ito ginawang neutral sa kasarian.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa legal at ritwal na konteksto ng Levitico. Ginamit ang 'mapupunta' upang natural na ipahayag ang paglalaan, at pinanatili ang 'tuyo' upang huwag lampasan ang leksikal na pahayag ng Hebreo.
