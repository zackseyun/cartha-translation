base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: tl
  text: Ang sinuman sa mga anak na lalaki ni Aaron na naghahandog ng dugo ng mga handog pangkapayapaan[a] at ng taba—mapapasakanya ang kanang hita bilang kanyang bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga handog para sa pakikipag-isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: ang sinuman ... na naghahandog
  rationale: Pinananatili ang diwa ng Hiphil participle bilang taong nagsasagawa ng ritwal na paghahandog; natural sa makabagong Tagalog ang hulma na “ang sinuman ... na.”
- source_word: דַּם
  choice: dugo
  rationale: Tuwirang katumbas at karaniwang katawagan sa mga tagubilin tungkol sa paghahandog.
- source_word: הַשְּׁלָמִים
  choice: mga handog pangkapayapaan
  rationale: Pinananatili ang tradisyonal at leksikal na kaugnayan ng שְׁלָמִים sa kapayapaan o kabuuan, habang inilalagay sa talababa ang posibleng pagbasa na nagbibigay-diin sa pakikipag-isa.
- source_word: הַחֵלֶב
  choice: taba
  rationale: Tuwirang salin na angkop sa konteksto ng mga natatanging matatabang bahaging sinusunog sa altar.
- source_word: מִבְּנֵי אַהֲרֹן
  choice: sa mga anak na lalaki ni Aaron
  rationale: Ipinahihiwatig ng parirala ang pagpili mula sa pangkat ng mga lalaking saserdoteng mula kay Aaron; tahasang pinananatili ang kasariang nasa Hebreo.
- source_word: לוֹ תִהְיֶה
  choice: ay tatanggap
  rationale: Natural na ipinapahayag sa Tagalog ang legal na karapatan sa nakalaang bahagi, bagaman mas literal itong “mapapasakanya.”
- source_word: שׁוֹק הַיָּמִין
  choice: kanang hita
  rationale: Ang שׁוֹק ay tumutukoy sa bahagi ng hita o itaas na binti; mas tiyak dito ang “hita” kaysa “binti.”
- source_word: לְמָנָה
  choice: bilang kanyang bahagi
  rationale: Malinaw na ipinapahayag ang nakatalagang bahagi o kaparte ng saserdote.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי אַהֲרֹן sa batas para sa mga saserdote
  choice: mga anak na lalaki ni Aaron
  alternative: mga anak ni Aaron; mga inapo ni Aaron
  rationale: Mas tahasang pinananatili nito ang panlalaking anyo ng Hebreo at ang konkretong pagtukoy sa mga lalaking saserdoteng naglilingkod, nang hindi ito ginagawang mas malawak na “pamilya” o lahat ng inapo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “handog pangkapayapaan” bilang maikli at pamilyar na katawagang panritwal; pinanatili ang legal na diwa ng nakalaang bahagi sa natural na pangungusap.
