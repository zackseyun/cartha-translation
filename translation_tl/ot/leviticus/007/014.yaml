  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: maglalaan ang naghahandog ng isang bahagi mula sa bawat handog bilang terumah para sa PANGINOON, at ito ay para sa paring nagsasaboy ng dugo ng mga handog para sa kapayapaan. Gayunman, ang “mula sa bawat uri” ay nagpapalit sa tuwirang “mula sa bawat handog” (מִכָּל קָרְבָּן). Bagaman sinusuportahan ng naunang konteksto ang iba’t ibang uri ng tinapay, hindi ito kailangang ilagay bilang pangunahing pananalita ng talata.'
  naturalness: Marangal at likas ang Tagalog. Ang “isang bahagi mula sa bawat handog” ay mas tumpak at natural kaysa “tig-isang piraso mula sa bawat uri,” habang hindi ipinipilit na pisikal na piraso ang tinutukoy ng אֶחָד.
  terminology: Ang “PANGINOON,” “bahaging ibinukod,” “nagsasaboy,” at “mga handog para sa kapayapaan” ay angkop. Ang “nagsasaboy” ay mahusay na katumbas ng זֹרֵק sa ritwal na konteksto; hindi ito nililimitahan sa banayad na pagwiwisik.
