base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: tl
  text: At mula rito ay maghahandog siya ng isang bahagi mula sa bawat handog bilang bahaging ibinukod para sa PANGINOON.[a] Mapupunta iyon sa paring nagsasaboy ng dugo ng mga handog para sa kapayapaan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang handog na itinaas para sa PANGINOON.” Ang salitang Hebreo ay tumutukoy sa bahaging ibinukod para sa Diyos at inilaan sa pari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nagwiwisik” o “naghahagis” ng dugo; ang pandiwang Hebreo ay tumutukoy sa ritwal na pagsaboy ng dugo sa altar.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga handog para sa kapayapaan” ay maaari ding isaling “mga handog ng pakikisama” o “mga handog para sa mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: maghahandog siya
  rationale: Ang Hiphil ng קרב ay literal na ‘ilalapit’ at karaniwang tumutukoy sa paghahandog. Likas at malinaw sa kontekstong ritwal ang “maghahandog.”
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Pinananatili ang pang-isahang anyo ng Hebreo habang tumutukoy pabalik sa kabuuan ng handog na pasasalamat at mga kasamang tinapay.
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: tig-isang piraso mula sa bawat uri
  rationale: 'Distributibo ang מִכָּל: isang piraso mula sa bawat uri ng tinapay na binanggit sa naunang talata. Idinagdag ang “piraso” at “uri” bilang malinaw na pagpapahiwatig ng konteksto, hindi bilang bagong detalye.'
- source_word: תְּרוּמָה
  choice: bahaging ibinukod
  rationale: Tumutukoy sa bahaging inihiwalay para sa Diyos at pagkatapos ay itinatalaga sa pari. Mas malinaw ito sa modernong Tagalog kaysa sa teknikal na “handog na itinaas.”
- source_word: לַיהוָה
  choice: para sa PANGINOON
  rationale: Ginamit ang karaniwang anyong pamalit sa banal na pangalan sa Tagalog; ang “para sa” ay natural sa konteksto ng pagtatalaga.
- source_word: הַזֹּרֵק
  choice: nagsasaboy
  rationale: Ang זרק ay paghagis o pagsaboy ng dugo sa altar, hindi lamang banayad na pagwisik. Pinananatili ng “nagsasaboy” ang lakas ng kilos at ang natural na Tagalog.
- source_word: דַּם הַשְּׁלָמִים
  choice: dugo ng mga handog para sa kapayapaan
  rationale: Pinananatili ang tradisyonal na kategoryang “handog para sa kapayapaan” nang hindi ipinapako ang malawak na diwa ng שְׁלָמִים sa pakikisama lamang.
- source_word: לוֹ יִהְיֶה
  choice: mapupunta iyon sa
  rationale: Malinaw na ipinapahayag ang paglalaan at karapatan ng pari sa bahaging iyon sa natural na modernong Tagalog.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang kinagawiang representasyon ng Tetragrammaton sa saling Tagalog, habang hindi inaangking ang tekstong Hebreo ay may titulong אֲדֹנָי.
- issue: Kahulugan ng שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa mabuting kalagayan / mga handog ng pakikisama
  rationale: Malawak ang saklaw ng salita at maaaring magpahiwatig ng kapayapaan, kabuuan, mabuting kalagayan, at pakikisama. Pinanatili sa teksto ang pamilyar na katawagan at inilagay sa talababa ang mga posibleng alternatibo.
- issue: Ritwal na kilos ng זרק
  choice: nagsasaboy
  alternative: nagwiwisik / naghahagis
  rationale: Hindi tiyak na isang mahinang pagwiwisik ang kilos; ang pandiwa ay may diwang paghagis o pagsaboy. Ang “nagsasaboy” ay angkop sa ritwal at hindi labis na naglilimita sa pamamaraan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng “tig-isang piraso mula sa bawat uri” upang maging malinaw ang distributibong diwa at ang kaugnayan sa mga uri ng tinapay sa naunang talata. Iniwasan ang arkaikong teknikal na pananalita sa pangunahing teksto, ngunit itinala ang mga alternatibo sa mga talababa.
