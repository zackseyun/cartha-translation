  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: tl
  text: Sapagkat ang sinumang kumain ng taba mula sa hayop na pinagmumulan ng handog na sinusunog sa altar para kay Yahweh[a]—ang taong kumain nito ay ihihiwalay sa kanyang bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pagkain.” Ang salitang Hebreo ay tumutukoy sa handog na sinusunog sa altar.
    reason: lexical_alternative
  - marker: b
    text: Ang “ihihiwalay” ay kumakatawan sa isang pormulang legal sa Hebreo na literal na may diwang “puputulin.” Pinagtatalunan ang tiyak na parusa; maaari itong tumukoy sa pagpapaalis, kamatayan, o paghuhukom ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ay nagbibigay ng dahilan o batayan para sa naunang pagbabawal.
- source_word: כָּל אֹכֵל
  choice: ang sinumang kumain
  rationale: Likas na pahayag ito sa modernong Tagalog at napapanatili ang pangkalahatang saklaw ng Hebreo.
- source_word: חֵלֶב
  choice: taba
  rationale: Tumutukoy ito sa taba ng hayop, lalo na sa mga bahaging nakalaan sa paghahandog; malinaw at karaniwan ang “taba” sa Tagalog.
- source_word: מִן הַבְּהֵמָה
  choice: ng hayop
  rationale: Malawak ang kahulugan ng בְּהֵמָה rito sa konteksto ng mga hayop na maaaring ihandog.
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: na mula rito ay naghahandog
  rationale: Pinananatili nito ang aktibong anyong isahan na may di-tiyak na gumagawa sa Hebreo, nang hindi ipinapalagay kung sino ang naghahandog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ipinahahayag nito ang handog na sinusunog o ginagawang usok sa altar, nang hindi nililimitahan ang salita sa ideya ng pagkain lamang.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na יהוה at ipinakikita ng “para kay” na sa kanya iniaalay ang handog.
- source_word: וְנִכְרְתָה
  choice: ay ihihiwalay
  rationale: Nagbibigay ito ng likas na Tagalog para sa pormulang legal na “putulin” o alisin mula sa bayan, habang hindi tinutukoy nang lampas sa teksto ang eksaktong parusa.
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: ang taong kumain nito
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa isang tao; ang “nito” ay tumutukoy sa taba ayon sa konteksto.
- source_word: מֵעַמֶּיהָ
  choice: sa kanyang bayan
  rationale: Bagaman pambabae sa gramatika ang hulapi dahil tumutugma ito sa נֶפֶשׁ, pangkalahatan ang tinutukoy na nagkasala; ang “kanyang” ay hindi nagtatakda ng kasarian.
theological_decisions:
- issue: Ang pormulang parusa na וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: ihihiwalay sa kanyang bayan
  alternative: puputulin mula sa kanyang bayan; palalayasin sa kanyang bayan; papatayin
  rationale: Hindi tiyak kung ang pormulang ito ay nangangahulugan ng pagpapaalis sa pamayanan, kamatayan, paghuhukom ng Diyos, o magkaugnay na mga kahulugan. Pinananatili ng salin ang lawak ng pormulang Hebreo sa halip na magtakda ng isang tiyak na mekanismo.
- issue: Kasarian ng nagkasala sa pangkalahatang wikang legal
  choice: kanyang bayan
  alternative: bayan niya; bayan ng taong iyon
  rationale: Ang pambabaeng anyo sa Hebreo ay gramatikal na pagtutugma sa נֶפֶשׁ, hindi pahiwatig na babae lamang ang tinutukoy. Ang “kanyang” ay natural at walang itinakdang kasarian sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong legal at panrelihiyon. Ginamit ang “Yahweh” bilang personal na pangalan, “handog na pinaraan sa apoy” bilang malinaw na katawagang pansakripisyo, at “ihihiwalay” upang mapanatili ang sinadyang kalabuan ng pormulang parusa.
