translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “karne” kaysa “laman” upang maging natural sa kontekstong pagkain, at “handog” bilang madaling maunawaang katumbas ng sakripisyo. Walang footnote dahil walang mahalagang kalabuan na kailangang ilahad sa talatang ito.
