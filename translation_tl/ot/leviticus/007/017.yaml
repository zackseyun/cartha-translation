  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: tl
  text: Ngunit ang matitira sa karne ng handog sa ikatlong araw ay susunugin sa apoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: Ngunit ang matitira
  rationale: Ang waw at substantival na Niphal participle ay nagpapatuloy sa naunang tuntunin at may bahagyang pagsalungat; natural sa Tagalog ang “Ngunit ang matitira.”
- source_word: מִבְּשַׂר
  choice: sa karne
  rationale: Bagaman maaari ring mangahulugang “laman” ang בָּשָׂר, mas malinaw at likas ang “karne” sa konteksto ng pagkaing mula sa inihandog na hayop.
- source_word: הַזָּבַח
  choice: ng handog
  rationale: Tumutukoy ang זֶבַח sa hayop o ritwal na inihahandog. Ang “handog” ay maikli, malinaw, at angkop sa kontekstong pansakripisyo nang hindi nagdaragdag ng paliwanag.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: sa ikatlong araw
  rationale: Tuwirang inilalarawan nito ang panahong tinutukoy ng Hebreo at karaniwang pahayag ito sa modernong Tagalog.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Likas na katumbas sa Tagalog ng instrument o elementong ginagamit sa pagsunog.
- source_word: יִשָּׂרֵף
  choice: ay susunugin
  rationale: Pinananatili nito ang pasibong anyo at ang nag-uutos na bisa ng legal na di-ganap na pandiwa sa Hebreo.
