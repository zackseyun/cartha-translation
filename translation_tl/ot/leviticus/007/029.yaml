base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: tl
  text: '“Sabihin mo sa mga anak ni Israel[a]: ‘Ang naghahandog ng kanyang handog na pangkapayapaan[b] sa PANGINOON ay magdadala sa PANGINOON ng kanyang handog mula sa kanyang handog na pangkapayapaan.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “handog para sa kapayapaan”; maaari ring unawain bilang handog para sa kagalingan o pakikisama. Teknikal na katawagan ito para sa isang uri ng hain.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang piel imperative ay tuwirang utos kay Moises na ihatid ang tagubilin; natural at malinaw sa makabagong Tagalog ang “Sabihin mo.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at tipanang pananalitang Hebreo, habang natural pa rin sa estilong biblikal na Tagalog.
- source_word: הַמַּקְרִיב
  choice: ang naghahandog
  rationale: Ang hiphil participle ng קרב sa kontekstong pansakripisyo ay tumutukoy sa taong naglalapit o naghaharap ng handog; “naghahandog” ang pinakanatural na terminong kultiko sa Tagalog.
- source_word: זֶבַח שְׁלָמָיו
  choice: kanyang handog na pangkapayapaan
  rationale: Ipinahahayag ng “handog” ang sakripisyal na זֶבַח at ng “pangkapayapaan” ang kaugnayan ng teknikal na שְׁלָמִים sa kapayapaan o kagalingan, nang hindi ito nililimitahan sa interpretasyong “pakikisama.”
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginagamit ang nakaugaliang salin ng banal na pangalan, na minamarkahan sa malaking titik upang maiba sa karaniwang titulong Panginoon.
- source_word: יָבִיא
  choice: ay magdadala
  rationale: Sa legal na konteksto, ang imperfect ay may preskriptibong puwersa; ang simpleng anyong hinaharap sa Tagalog ay likas na naghahatid ng tagubilin sa pangungusap na ito.
- source_word: קָרְבָּנוֹ
  choice: bahagi
  rationale: Bagaman karaniwang nangangahulugang “kanyang handog” ang קָרְבָּנוֹ, ipinakikita ng kasunod na מִן na ang dadalhin ay mula sa handog na pangkapayapaan; “bahagi” ang natural na Tagalog na nagpapanatili sa ugnayang partitive.
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: ng kanyang handog na pangkapayapaan
  rationale: 'Kasama ng “bahagi,” ipinahahayag nito ang partitive na diwa ng מִן: ang dadalhin sa PANGINOON ay nagmumula sa mismong handog na pangkapayapaan.'
theological_decisions:
- issue: Pagpapahayag sa יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ang malaking-titik na “PANGINOON” ay malinaw na kumakatawan sa tipanang pangalan nang hindi pinipili ang isang pinagtatalunang pagbigkas.
- issue: Kahulugan ng שְׁלָמִים
  choice: handog na pangkapayapaan
  alternative: handog para sa pakikisama
  rationale: Pinananatili ng “pangkapayapaan” ang leksikal na ugnayan sa שׁלם at hindi tahasang nilulutas ang mas malawak na saklaw nitong kapayapaan, kagalingan, at pakikisama.
- issue: Tipanang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang konkretong anyo ng Hebreo at ang kolektibong tipanang diwa; nililinaw sa talababa ang idiomatikong alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may katamtamang pormalidad para sa legal at pansakripisyong konteksto. Ginamit ang panipi upang malinaw ang ipinapasabing pahayag, at iniwasan ang sobrang teknikal o makalumang bokabularyo.
