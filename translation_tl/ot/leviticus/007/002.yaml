  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: tl
  text: Sa lugar kung saan nila pinapatay ang handog na sinusunog, doon din nila papatayin ang handog para sa pagkakasala[a]. Isasaboy niya ang dugo nito sa buong palibot ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa pagbabayad-pinsala” o “handog na kabayaran.” Ang salitang Hebreo ay may diwa kapwa ng pagkakasala at ng pagbibigay ng nararapat na kabayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Sa lugar kung saan
  rationale: Likas na Tagalog para sa tiyak na pook na tinutukoy ng panuntunang panghandog.
- source_word: יִשְׁחֲטוּ
  choice: nila kinakatay / nila kakatayin
  rationale: Ang 'katayin' ay malinaw na tumutukoy sa pagpatay ng hayop at angkop sa konteksto ng paghahandog.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Napananatili ang karaniwang kahulugan ng עֹלָה bilang handog na lubusang sinusunog, nang hindi gumagamit ng di-likas na teknikal na katawagan.
- source_word: הָאָשָׁם
  choice: handog para sa pagkakasala
  rationale: Napananatili ang kaugnayan sa pagkakasala habang ang talababa ay nagpapakita ng kaugnay na diwa ng pagbabayad-pinsala.
- source_word: דָּמוֹ
  choice: ang dugo nito
  rationale: Ang hulaping panghalip ay tumutukoy sa hayop na inihandog bilang אָשָׁם.
- source_word: יִזְרֹק
  choice: iwiwisik
  rationale: Sa ritwal na konteksto, ipinahihiwatig ng זָרַק ang paghagis o pagsaboy ng dugo sa altar; 'iwiwisik' ang pinakanatural na dignified na Tagalog rito.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa lahat ng panig ng altar
  rationale: Malinaw na ipinahahayag ang paglalagay ng dugo paikot sa altar, ayon sa סָבִיב.
theological_decisions:
- issue: Kahulugan ng terminong panghandog na אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog para sa pagbabayad-pinsala
  rationale: Hindi nililimitahan ang termino sa isang doktrinal na pagpapakahulugan. Ang pangunahing teksto ay madaling maunawaan, samantalang pinananatili ng talababa ang tunay na diwa ng pagsasauli o pagbabayad-pinsala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'doon din' upang natural na maipakita na iisang lugar ang itinatalaga para sa dalawang uri ng handog; hindi nito dinaragdagan ang diwa ng Hebreo.
