  to: Sa lugar kung saan nila pinapatay ang handog na sinusunog, doon din nila papatayin ang handog para sa pagkakasala[a]. Isasaboy niya ang dugo nito sa buong palibot ng altar.
  rationale: Inihanay ang aspekto ng magkatambal na pandiwa sa Tagalog upang tumpak na maipakita ang magkatulad na anyong Hebreo sa isang tagubiling ritwal. Pinalitan ang “iwiwisik” ng “isasaboy” upang mas maayos na maihatid ang זָרַק, habang pinanatili ang “sa buong palibot ng altar” para sa סָבִיב. Hindi binago ang pangunahing katawagan para sa mga handog o ang balanseng talababa para sa אָשָׁם.
