  - severity: low
    issue: Ang “iwiwisik” ay hindi ganap na tiyak para sa lakas ng זָרַק.
    rationale: Sa konteksto ng dugo sa altar, ang pandiwa ay tumutukoy sa pagsaboy o paghagis, hindi lamang sa mas pinong pagwiwisik. Ang “isasaboy” ay natural at mas malapit sa ritwal na kilos.
