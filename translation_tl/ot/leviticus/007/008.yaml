  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: tl
  text: At ang paring naghahandog ng handog na sinusunog ng isang lalaki ay magiging kanya ang balat[a] ng handog na sinusunog na inihandog niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “katad.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “handog na sinusunog ng isang lalaki”; pinananatili rito ang isahang panlalaking anyo sa halip na gawing pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwang tawag sa כֹּהֵן sa mga batas tungkol sa paghahandog; pinananatili ang tiyak na pantukoy.
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: naghahandog / inihandog
  rationale: Ang Hiphil ng קרב ay tumutukoy sa ritwal na pagdadala o paghahandog. Natural sa modernong Tagalog ang “maghandog,” at ipinakikita ng “inihandog” ang natapos na kilos.
- source_word: עֹלַת אִישׁ
  choice: handog na sinusunog ng isang lalaki
  rationale: Pinananatili ang karaniwang katawagan sa עֹלָה at ang tahasang isahang panlalaking אִישׁ nang hindi ito ginagawang neutral.
- source_word: עֹור
  choice: balat
  rationale: Tumutukoy sa balat ng hayop; “balat” ang pinakanatural at malinaw na salitang Tagalog, bagaman posible rin ang “katad” kung ang diin ay sa nakuhang hide.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Malinaw at nakaugaliang katawagan sa ritwal na kategoryang עֹלָה; hindi ipinapasok sa pangunahing teksto ang etimolohikong ideya ng pag-akyat.
- source_word: אֲשֶׁר הִקְרִיב
  choice: na inihandog niya
  rationale: Ang sugnay na pang-ugnay ay natural na tumutukoy sa partikular na handog na inihandog ng pari.
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: ay magkakaroon para sa kanyang sarili
  rationale: Ipinahahayag na ang balat ay magiging bahagi ng paring nangangasiwa; pinananatili ang diin ng dobleng pariralang “sa pari, sa kanya.”
theological_decisions:
- issue: Paglalarawan sa אִישׁ ayon sa kasarian
  choice: ng isang lalaki
  alternative: ng isang tao
  rationale: Ang Hebreo ay tahasang isahang panlalaki. Pinananatili ito sa salin at ipinaliliwanag sa talababa upang hindi tahimik na gawing pangkalahatan.
- issue: Katawagan sa עֹלָה
  choice: handog na sinusunog
  alternative: handog na paakyat
  rationale: Ang “handog na sinusunog” ang malinaw na katawagan sa uri ng hain sa konteksto ng Levitico, samantalang ang “paakyat” ay mas etimolohiko ngunit hindi gaanong natural o malinaw sa ordinaryong mambabasa.
- issue: Pagmamay-ari ng balat
  choice: magkakaroon para sa kanyang sarili
  alternative: mapupunta sa pari
  rationale: Pinananatili nito ang diin na ang balat ay magiging sariling bahagi ng mismong paring naghandog, nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang pormal ngunit karaniwang bokabularyong panrelihiyon na “pari,” “handog,” at “sinusunog.” Ang ayos ng pangungusap ay malapit sa Hebreo ngunit nananatiling natural sa Tagalog; inilagay ang lahat ng panandang talababa sa pangunahing teksto.
