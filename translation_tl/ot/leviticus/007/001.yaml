  text: וְ/זֹ֥את תּוֹרַ֖ת הָ/אָשָׁ֑ם קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/001.yaml
  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: tl
  text: 'Ito ang tuntunin tungkol sa handog para sa pagkakasala[a]: ito ay kabanal-banalan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog para sa pagsasauli” o “handog na pambayad-pinsala.” Ang Hebreong asham ay tawag sa handog na kaugnay ng pagkakasala at ng pagsasauli o pagbabayad-pinsala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Ito
  rationale: Ipinakikilala ng וְזֹאת ang bagong bahagi ng mga tagubilin. Natural sa modernong Tagalog ang “Ito” at hindi na kailangang lagyan ng tahasang pang-ugnay.
- source_word: תּוֹרַת
  choice: ang tuntunin tungkol sa
  rationale: Sa kontekstong ito, ang תּוֹרָה ay itinakdang tuntunin o pamamaraan para sa isang handog. Mas malinaw at natural dito ang “tuntunin tungkol sa” kaysa sa mas malawak na “kautusan.”
- source_word: הָאָשָׁם
  choice: handog para sa pagkakasala
  rationale: Tinutukoy ng אָשָׁם ang natatanging uri ng handog na kaugnay ng pagkakasala at pagsasauli o pagbabayad-pinsala. Pinananatili ng salin ang aspektong pagkakasala, habang inilalahad sa talababa ang ibang posibleng diin.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ang Hebreong superlatibong parirala ay nagsasaad ng pinakamataas na antas ng kabanalan. Ang “kabanal-banalan” ay maikli, marangal, at likas sa Tagalog.
- source_word: הוּא
  choice: ito ay
  rationale: Gumaganap ang panghalip bilang paksa ng panaguring nag-uuri sa handog bilang kabanal-banalan.
theological_decisions:
- issue: Kahulugan ng katawagang pansakripisyo na אָשָׁם
  choice: handog para sa pagkakasala
  alternative: handog para sa pagsasauli; handog na pambayad-pinsala
  rationale: Ang pangunahing salin ay nagpapanatili sa aspektong moral at ritwal ng pagkakasala nang hindi nililimitahan ang termino sa pinansiyal na kabayaran. Inilalagay sa talababa ang mga alternatibo upang mapanatili ang kaugnayan nito sa pagsasauli at pagbabayad-pinsala.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tuntunin” para sa ritwal na tagubilin at “kabanal-banalan” para sa Hebreong superlatibo.
