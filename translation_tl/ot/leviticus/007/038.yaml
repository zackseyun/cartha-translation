  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: tl
  text: na iniutos ni Yahweh kay Moises sa Bundok Sinai, noong araw na iniutos niya sa mga anak ni Israel[a] na iharap kay Yahweh ang kanilang mga handog sa ilang ng Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita” o “sambayanang Israel.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Nagpapakilala ito ng sugnay na tumutukoy sa naunang kabuuan ng mga tuntunin; natural sa Tagalog ang pang-angkop na “na.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Pinananatili ang awtoritatibong diwa ng pandiwa sa kontekstong legal at panritwal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang banal na nasa tekstong Hebreo, sa halip na palitan ito ng titulo.
- source_word: בְּהַר סִינָי
  choice: sa Bundok Sinai
  rationale: Likas na pahayag sa modernong Tagalog para sa lokasyong tinutukoy ng Hebreo.
- source_word: בְּיוֹם
  choice: nang araw na
  rationale: Pinananatili ang tahasang pagtukoy sa panahon habang natural ang daloy sa Tagalog.
- source_word: צַוֹּתוֹ
  choice: iniutos niya
  rationale: Isinasalin ang infinitive construct na may hulaping panghalip bilang sugnay na may tahasang pandiwa para sa malinaw na Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal na pampamilya at panlalaking anyo ng Hebreo; nililinaw sa talababa ang mas idyomatikong saklaw nito.
- source_word: לְהַקְרִיב
  choice: iharap
  rationale: Sa kontekstong paghahandog, ipinahihiwatig ng Hiphil ng קרב ang pagdadala o paghaharap ng handog; iniiwasan din nito ang paulit-ulit na “ihandog ang mga handog.”
- source_word: קָרְבְּנֵיהֶם
  choice: kanilang mga handog
  rationale: Malawak ang saklaw ng קָרְבָּן at ang “mga handog” ay angkop sa buod ng iba't ibang uring sakripisyo.
- source_word: בְּמִדְבַּר סִינָי
  choice: sa ilang ng Sinai
  rationale: Ang “ilang” ay maikli, dignificado, at natural na katumbas ng rehiyong masukal o disyerto na tinutukoy ng מִדְבָּר.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ng titulo.
- issue: Pagsasalin sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili sa pangunahing teksto ang pampamilya at gramatikal na anyo ng Hebreo, habang kinikilala sa talababa ang mga likas na katumbas sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Pinanatili ang pagkakaugnay nito sa naunang pangungusap sa pamamagitan ng pambungad na “na,” at iniwasan ang labis na teknikal o makalumang pananalita.
