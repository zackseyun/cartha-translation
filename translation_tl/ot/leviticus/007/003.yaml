  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: tl
  text: 'At ihahandog niya mula rito ang lahat ng taba nito: ang matabang buntot[b] at ang taba na bumabalot sa mga lamang-loob.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taba na bumabalot sa mga panloob na bahagi.”
    reason: lexical_alternative
  - marker: b
    text: Ito ang malaki at matabang buntot ng isang uring tupa, isang tiyak na bahaging inihahandog.
    reason: cultural_note
lexical_decisions:
- source_word: יַקְרִיב
  choice: ihahandog
  rationale: Sa batas tungkol sa paghahain, ang Hiphil ng קרב ay tumutukoy sa ritwal na paglalapit o paghahandog ng bahagi ng handog. Natural at malinaw sa modernong Tagalog ang “ihahandog.”
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Ang hulapi ay pinakamalamang na tumutukoy sa hayop na inihahandog. Iniiwasan ng “mula rito” ang maling pagpapalagay na tao ang tinutukoy.
- source_word: כָּל חֶלְבּוֹ
  choice: ang lahat ng taba nito
  rationale: Sa kontekstong sakripisyal, ang חֵלֶב ay ang mga tabang nakatalaga bilang handog; pinananatili ng “lahat” ang diin ng כָּל sa kabuuan ng mga itinakdang bahagi.
- source_word: הָאַלְיָה
  choice: ang matabang buntot
  rationale: Ang אַלְיָה ay ang malaki at matabang buntot ng isang uring tupa, isang tiyak na bahaging inihahandog; higit itong eksakto kaysa simpleng “buntot.”
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: ang tabang bumabalot sa mga lamang-loob
  rationale: Ang קֶרֶב dito ay tumutukoy sa mga laman o organo sa loob ng hayop. Ang “mga lamang-loob” ay konkreto, natural, at madaling maunawaan.
