  source_fidelity: 'Tapat ang salin sa Hebreo: ang "mula rito" ay tumutukoy sa hayop na handog, at naisama ang lahat ng itinakdang taba, ang matabang buntot, at ang tabang tumatakip sa mga lamang-loob. Ang "ihahandog" ay wastong ritwal na salin ng יַקְרִיב.'
