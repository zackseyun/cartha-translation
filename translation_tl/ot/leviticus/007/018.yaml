  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: tl
  text: Ngunit kung alinman sa laman ng kanyang handog para sa kapayapaan[a] ay kainin sa ikatlong araw, hindi ito tatanggapin; hindi ito ibibilang sa naghahandog nito. Magiging isang karima-rimarim na bagay[b] ito, at ang taong kumain nito ay mananagot sa kanyang kasalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “handog para sa kapayapaan” ay maaari ring isaling “handog para sa mabuting kalagayan” o “handog ng pakikisama.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay isang teknikal na terminong panghain para sa handog na naging di-katanggap-tanggap at kasuklam-suklam; maaari rin itong isaling “maruming karne” o “kasuklam-suklam na bagay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahahayag ang kondisyong salungat sa naunang tuntunin, habang pinananatili ang pang-ugnay.
- source_word: הֵאָכֹל יֵאָכֵל מִבְּשַׂר
  choice: kung may makain sa laman
  rationale: Natural na Filipino para sa pinatinding pasibong parirala at sa partitive na מִן; hindi kailangang tularan nang mekanikal ang pag-uulit sa Hebreo.
- source_word: זֶבַח שְׁלָמָיו
  choice: kanyang handog para sa kapayapaan
  rationale: Pinananatili ang tiyak na uring hain at ang semantikong ugnayan ng שְׁלָמִים sa kapayapaan o kabutihang kalagayan.
- source_word: לֹא יֵרָצֶה
  choice: hindi iyon tatanggapin
  rationale: Sa konteksto ng paghahandog, tumutukoy ang Niphal ng רצה sa pagiging katanggap-tanggap ng hain.
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: hindi iyon ibibilang para sa
  rationale: Pinananatili ang diwa ng pagkukuwenta o pagkilala sa bisa ng handog nang hindi nagdaragdag ng paliwanag.
- source_word: פִּגּוּל
  choice: karima-rimarim
  rationale: Malakas at likas na salitang Filipino para sa isang bagay na naging kasuklam-suklam at di-katanggap-tanggap sa kontekstong panghain; nililinaw sa talababa ang teknikal na gamit.
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: at ang taong kumain mula roon
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa isang tao, hindi sa hiwalay na di-materyal na kaluluwa.
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: ay mananagot sa kanyang kasalanan
  rationale: Inihahayag ang idyomang 'pasanin ang kasalanan' bilang pananagutan sa sariling pagkakasala, kasama ang pahiwatig ng kaparusahan ngunit hindi ito ginagawang tahasang higit sa teksto.
theological_decisions:
- issue: Kahulugan ng זֶבַח שְׁלָמִים
  choice: handog para sa kapayapaan
  alternative: handog para sa mabuting kalagayan; handog ng pakikisama
  rationale: Ang termino ay isang tiyak na uri ng hain. Pinananatili sa pangunahing teksto ang ugnayan sa kapayapaan, habang kinikilala sa talababa ang iba pang lehitimong diin ng salitang Hebreo.
- issue: Saklaw ng עֲוֺנָהּ תִּשָּׂא
  choice: mananagot sa kanyang kasalanan
  alternative: papasanin ang kanyang kasalanan; papasanin ang parusa sa kanyang kasalanan
  rationale: Pinananatili ang ugnayan ng pagkakasala at pananagutan nang hindi ipinapasiya kung ang idyoma ay dapat tahasang isalin bilang kasalanan lamang o bilang kaparusahan nito.
- issue: Pangkalahatang tinutukoy ng נֶפֶשׁ
  choice: ang taong ... kanyang
  alternative: ang sinumang ... sariling
  rationale: Tumutukoy ang gramatikal na pambabaeng pangngalan sa sinumang indibidwal. Ang saling Filipino ay natural at hindi nagtatakda ng kasarian ng taong tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “laman” at “naghahandog” upang mapanatili ang kontekstong ritwal, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
