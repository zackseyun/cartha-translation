  to: Ngunit kung alinman sa laman ng kanyang handog para sa kapayapaan[a] ay kainin sa ikatlong araw, hindi ito tatanggapin; hindi ito ibibilang sa naghahandog nito. Magiging isang karima-rimarim na bagay[b] ito, at ang taong kumain nito ay mananagot sa kanyang kasalanan.
  rationale: Inayos ang pasibong kondisyon upang malinaw na ang ipinagbabawal ay ang pagkain ng alinmang bahagi ng laman sa ikatlong araw. Pinakinis din ang mga pang-ukol at panghalip para sa natural na modernong Filipino, at ginawang tahasan ang pangngalang paglalarawan ng פִּגּוּל. Napanatili ang mga umiiral na talababa at ang kanilang wastong mga angkla sa mga terminong ipinaliliwanag.
