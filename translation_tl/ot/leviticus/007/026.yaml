  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: tl
  text: At huwag kayong kumain ng anumang dugo sa lahat ng inyong tirahan, mula man sa ibon o sa hayop.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sa lahat ng inyong mga tirahan” o “sa lahat ng inyong mga pamayanan.” Sa Hebreo, ang huling parirala ay “para sa ibon at para sa hayop,” na tumutukoy sa dugong mula sa mga ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: At ... anumang dugo
  rationale: Ipinag-uugnay ng וְ ang pagbabawal sa naunang tagubilin, at sa negatibong pangungusap ang כָל ay likas na ipinahahayag bilang “anumang.”
- source_word: לֹא תֹאכְלוּ
  choice: huwag kayong kakain
  rationale: Malinaw at natural na makabagong Tagalog para sa legal na pagbabawal na nakatuon sa maramihang kausap.
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: saanman kayo naninirahan
  rationale: Ipinahahayag nito ang saklaw ng utos sa lahat ng tirahan o pamayanan ng Israel nang hindi mabigat ang literal na ayos.
- source_word: לָ/עוֹף וְ/לַ/בְּהֵמָה
  choice: dugo man ng ibon o ng hayop
  rationale: Ang לְ ay tumutukoy rito sa mga uring pinagmumulan o kinabibilangan ng dugo. Ang “ibon o hayop” ay malinaw na paghahanay sa natural na Tagalog.
theological_decisions:
- issue: Saklaw ng pagbabawal sa dugo
  choice: Ipinagbabawal ang pagkain ng anumang dugo ng ibon o hayop saanman naninirahan ang mga Israelita.
  alternative: Maaaring panatilihin nang mas literal ang “para sa ibon at para sa hayop,” ngunit magiging malabo sa Tagalog ang ugnayan nito sa dugo.
  rationale: Pinananatili ang payak na saklaw ng batas at hindi nagdaragdag ng paliwanag na teolohikal na wala sa talata.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “huwag kayong kakain” upang mapanatili ang tuwirang lakas ng pagbabawal, at “saanman kayo naninirahan” para sa natural na pagpapahayag ng pangkalahatang saklaw.
