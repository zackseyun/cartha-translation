  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: tl
  text: Kasama ng mga tinapay na pinaalsa, ihaharap niya ang kanyang handog kasama ng haing pasasalamat na kabilang sa kanyang mga handog pangkapayapaan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog ng pakikisama” o “mga handog para sa kabutihang kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: kasama ng / kalakip ng
  rationale: Sa dalawang paglitaw nito, ipinahihiwatig ng עַל ang pagsasama o pagdaragdag ng mga handog, hindi ang pisikal na pagkakalagay sa ibabaw.
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: mga tinapay na pinaalsa
  rationale: Likas at malinaw itong salin sa modernong Tagalog para sa mga tinapay na ginamitan ng pampaalsa, at pinananatili ang ritwal na kaibahan sa tinapay na walang pampaalsa sa konteksto.
- source_word: יַקְרִיב
  choice: ihaharap
  rationale: Ang Hiphil ng קרב sa kontekstong paghahandog ay tumutukoy sa paglalapit o paghaharap ng handog; iniiwasan din nito ang labis na pag-uulit ng salitang “handog.”
- source_word: קָרְבָּנוֹ
  choice: ang kanyang handog
  rationale: Ang קָרְבָּן ay pangkalahatang katawagan sa bagay na inihaharap bilang handog sa Diyos.
- source_word: זֶבַח תּוֹדַת
  choice: haing pasasalamat
  rationale: Tuwirang ipinapahayag nito ang haing ang katangian o layunin ay pasasalamat, habang pinananatili ang ugnayang construct ng Hebreo.
- source_word: שְׁלָמָיו
  choice: kanyang … handog pangkapayapaan
  rationale: Pinananatili ng “handog pangkapayapaan” ang tradisyonal at leksikal na kaugnayan ng שְׁלָמִים sa kapayapaan at kabuuan; ang panghalip na “kanyang” ay kumakatawan sa hulaping pronominal ng Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa teknikal na katawagang שְׁלָמִים
  choice: handog pangkapayapaan
  alternative: handog ng pakikisama; handog para sa kagalingan
  rationale: Malawak ang saklaw ng terminong Hebreo—kapayapaan, kabuuan, at pakikisalo—kaya pinanatili sa pangunahing teksto ang nakikilalang “handog pangkapayapaan” at inilagay sa talababa ang mga lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pinaalsa” sa halip na mas teknikal na “may lebadura,” at pinanatili ang teknikal na katawagang “handog pangkapayapaan” na may talababa para sa tunay na lawak ng kahulugan.
