base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: tl
  text: Kaya sinabi ko sa mga anak ng Israel[a], “Walang sinuman sa inyo ang kakain ng dugo, at ang dayuhang naninirahan[b] sa gitna ninyo ay hindi kakain ng dugo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga Israelita.” Literal sa Hebreo: “mga anak ng Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa isang hindi Israelitang naninirahan sa gitna ng Israel at saklaw ng mga tuntunin ng pamayanan; maaari ring “residenteng dayuhan.”
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinahahayag nito ang bunga o konklusyon mula sa naunang paliwanag tungkol sa buhay na nasa dugo; likas at malinaw ang “Kaya” sa makabagong Filipino.
- source_word: אָמַרְתִּי
  choice: sinabi ko
  rationale: Tuwirang katumbas ito ng payak na anyong perpekto ng pandiwang “sabihin” at angkop sa kontekstong legal at pasalaysay.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ng Israel
  rationale: Pinananatili nito ang larawang nasa Hebreo na “mga anak ni Israel,” habang ginagamit ang karaniwang anyong Filipino na “ng Israel” para sa kolektibong bansag.
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: Walang sinuman sa inyo
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa bawat indibidwal, hindi sa “kaluluwa” bilang hiwalay na sangkap; malinaw na naihahatid ng parirala ang pangkalahatang pagbabawal.
- source_word: לֹא תֹאכַל דָּם
  choice: ang kakain ng dugo
  rationale: Kasama ng “Walang sinuman,” natural nitong ipinahahayag ang legal na pagbabawal at pinananatili ang tahasang “kumain ng dugo.”
- source_word: הַגֵּר
  choice: ang dayuhang naninirahan
  rationale: Ang גֵּר ay hindi lamang panandaliang bisita kundi isang hindi katutubong naninirahan sa pamayanan; mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa teknikal na katawagan.
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: naninirahan sa gitna ninyo
  rationale: Pinananatili nito ang participial na diwa at ang ideya ng paninirahan sa loob ng pamayanan.
- source_word: לֹא יֹאכַל דָּם
  choice: ay hindi rin kakain ng dugo
  rationale: Inuulit nito ang parehong pagbabawal para sa dayuhang naninirahan; nililinaw ng “rin” na kapantay siyang saklaw ng naunang tuntunin.
theological_decisions:
- issue: Masculine representative designation sa לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  alternative: mga Israelita
  rationale: Pinananatili ng “mga anak ng Israel” ang pormula at ugnayang pampamilya sa Hebreo nang hindi ipinapalagay na mga lalaking anak lamang ang saklaw ng kautusan.
- issue: Saklaw ng pagbabawal sa dugo
  choice: Parehong ipinagbabawal sa mga anak ng Israel at sa dayuhang naninirahan sa gitna nila ang pagkain ng dugo.
  alternative: Limitahan ang ikalawang pagbabawal sa isang panandaliang dayuhang bisita.
  rationale: Ang גֵּר at ang kasunod na participial phrase ay tumutukoy sa dayuhang naninirahan sa pamayanan, kaya hindi dapat palawakin sa lahat ng nasa labas ni paliitin sa pansamantalang bisita lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Walang sinuman” upang maging natural ang distributibong legal na pahayag, habang pinanatili ang pag-uulit ng pagbabawal at ang tahasang pananalitang “kumain ng dugo.”
