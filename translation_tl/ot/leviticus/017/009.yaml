  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: tl
  text: at hindi niya ito dadalhin sa pasukan ng Tolda ng Pagtitipon upang ihandog kay Yahweh[a], ang taong iyon ay puputulin mula sa kanyang bayan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “upang gawin iyon para kay Yahweh”; sa kontekstong ito, ang idyomang Hebreo ay tumutukoy sa paghahandog ng hain.'
    reason: lexical_alternative
  - marker: b
    text: Ang “puputulin mula sa kanyang bayan” ay isang pormulang legal na ang eksaktong parusa ay hindi tinutukoy rito; maaari itong tumukoy sa pag-aalis mula sa bayang tipan o sa tuwirang hatol ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy ito sa bukasan o lugar na pinapasukan; natural at angkop sa konteksto ng santuwaryo ang “pasukan.”
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtitipon
  rationale: Malinaw nitong inilalarawan ang itinakdang tolda kung saan nakikipagtagpo si Yahweh sa Israel, nang hindi ito ipinapalit sa mas interpretatibong katawagan.
- source_word: יְבִיאֶנּוּ
  choice: dalhin niya ito
  rationale: Ang hulaping isahan ay tumutukoy sa hayop na inihahandog sa naunang konteksto; pinananatili ng “ito” ang kongkretong kilos.
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: upang ihandog kay Yahweh
  rationale: Bagaman literal na “upang gawin iyon para kay Yahweh,” ginagamit dito ang עשה bilang idyoma para sa paghahandog ng hain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וְנִכְרַת
  choice: ay ihihiwalay
  rationale: Ipinahahayag nito ang pag-aalis mula sa bayan nang hindi tinutukoy kung kamatayan, pagpapatalsik, o tuwirang hatol ng Diyos ang kaparaanan; inilalagay sa talababa ang literal na larawan na “puputulin.”
- source_word: הָאִישׁ הַהוּא
  choice: ang taong iyon
  rationale: Tapat ito sa tiyak na indibidwal na tinutukoy ng pormulang legal sa Hebreo at natural sa modernong Tagalog.
- source_word: מֵעַמָּיו
  choice: sa kanyang bayan
  rationale: Ipinakikita nito ang pagkakahiwalay ng nagkasala mula sa bayang kinabibilangan niya; maikli at natural ito sa Tagalog.
theological_decisions:
- issue: Kahulugan ng parusang וְנִכְרַת (“puputulin”)
  choice: Panatilihing hindi tiyak ang paraan ng parusa sa saling “ihihiwalay sa kanyang bayan,” na may literal na pahayag sa talababa.
  alternative: papatayin; ititiwalag sa kapulungan; lilipulin
  rationale: Hindi tahasang itinatakda ng pormulang legal sa talatang ito kung kamatayan, pormal na pagpapatalsik, pagkawala ng angkan, o tuwirang hatol ng Diyos ang tinutukoy. Hindi dapat paliitin ng salin ang saklaw nito.
- issue: Paglalarawan sa הָאִישׁ הַהוּא
  choice: ang taong iyon
  alternative: ang taong gumagawa nito; ang sinumang iyon
  rationale: Pinananatili nito ang panlalaking isahang pormulang legal ng pinagmulan nang hindi nagdaragdag ng paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Tolda ng Pagtitipon” bilang madaling maunawaang katawagan sa santuwaryo. Iniwasan ang “ititiwalag,” na maaaring magpahiwatig ng mas tiyak na parusang pangkomunidad kaysa sa tahasang sinasabi ng Hebreo; ang “ihihiwalay” ay mas malawak, habang pinananatili sa talababa ang literal na larawang “puputulin.”
