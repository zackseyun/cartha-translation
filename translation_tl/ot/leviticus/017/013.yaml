revisions:
- from: At sinumang lalaking kabilang sa mga anak ni Israel, o sinumang dayuhang naninirahang kasama nila[a], na manghuli ng mailap na hayop o ibong maaaring kainin, ay dapat ibuhos ang dugo nito at tabunan iyon ng lupa.[b]
  to: Sinumang lalaki, maging isa sa mga anak ni Israel o isang dayuhang naninirahan sa gitna nila[a], na manghuhuli ng ligaw na hayop o ibon—na maaaring kainin—ay dapat ibuhos ang dugo nito at tabunan ito[b] ng lupa.
  rationale: Inayos ang paglalarawan ng hinuhuling hayop at ang lokasyon ng naninirahang dayuhan upang mas malapit sa Hebreo at mas likas sa modernong Tagalog. Pinanatili ang legal na lakas ng “dapat,” ang pormal na “mga anak ni Israel,” at ang ipinahihiwatig na pangunahing reperensiya ng panghalip sa dugo, habang malinaw na itinatala ang alternatibong pagbasa sa talababa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:17:15Z'
