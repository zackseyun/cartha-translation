  terminology: Pinanatili ang “mga anak ni Israel,” “dayuhang naninirahan,” “dugo,” at “lupa.” Pinalitan ang “mailap na hayop” ng “ligaw na hayop” upang tumugma sa hayop na hinuhuli sa Hebreo nang hindi nagdaragdag ng teknikal na kahulugan.
