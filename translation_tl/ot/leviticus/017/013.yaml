  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: tl
  text: Sinumang lalaki, maging isa sa mga anak ni Israel o isang dayuhang naninirahan sa gitna nila[a], na manghuhuli ng ligaw na hayop o ibon—na maaaring kainin—ay dapat ibuhos ang dugo nito at tabunan ito[b] ng lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na גֵּר ay tumutukoy sa isang di-Israelitang naninirahan sa loob ng pamayanan.
    reason: lexical_alternative
  - marker: b
    text: Ang “ito” ay pinakanatural na tumutukoy sa dugo; maaari ring unawain ang panghalip sa Hebreo bilang tumutukoy sa hayop.
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: sinumang lalaki
  rationale: Ang pag-uulit ng אִישׁ ay may distributibong diwa, kaya ang “sinumang lalaki” ay malinaw at likas sa modernong Tagalog habang pinananatili ang kasariang hayag sa Hebreo.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: kabilang sa mga anak ni Israel
  rationale: Pinananatili ng “mga anak ni Israel” ang pampamilya at pangtipang pananalita ng Hebreo; idinagdag ang “kabilang” upang maging natural ang ugnayan sa pang-ukol.
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: dayuhang naninirahang kasama nila
  rationale: Ang גֵּר ay isang di-Israelitang naninirahan sa loob ng pamayanan. Iniiwasan ng saling ito ang makabagong teknikal na terminolohiya sa imigrasyon habang ipinahahayag ang legal at panlipunang katayuan.
- source_word: יָצוּד צֵיד
  choice: manghuli
  rationale: Ang magkaugnay na pandiwa at pangngalan sa Hebreo ay likas na naipapahayag sa Tagalog sa iisang pandiwang “manghuli”; ang bagay na hinuhuli ay tahasang sumusunod.
- source_word: חַיָּה אוֹ עוֹף
  choice: mailap na hayop o ibon
  rationale: Sa konteksto ng pangangaso, ang חַיָּה ay tumutukoy sa hayop na ligaw o mailap, hindi sa lahat ng uri ng hayop.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: maaaring kainin
  rationale: 'Ipinahahayag nito ang pasibo at mapahintulot na diwa: hayop o ibong angkop o pinahihintulutang kainin.'
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: dapat ibuhos ang dugo nito
  rationale: Ang “dapat” ay malinaw na naghahatid ng pautos na lakas ng pahayag sa kontekstong legal; ang “ibuhos” ay malapit sa kongkretong kilos ng שׁפך.
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: tabunan iyon ng lupa
  rationale: Ang “tabunan” ay natural na paglalarawan ng pagtatakip gamit ang maluwag na lupa. Ang “iyon” ay pinakamalapit na tumutukoy sa dugong kababanggit, ngunit hindi pinipilit ng salin ang reperensiya nang higit sa sintaks.
theological_decisions:
- issue: Ang tinutukoy ng hulaping panghalip sa וְכִסָּהוּ
  choice: Ang dugo ang tatabunan
  alternative: Ang hayop ang tatabunan o ililibing
  rationale: Ang “dugo nito” ang pinakamalapit at pinakanatural na antecedent, at umaayon ito sa diin ng kabanata sa dugo. Gayunman, inilalahad sa talababa ang sintaktikong alternatibo upang hindi itago ang tunay na posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal at pangtipang “mga anak ni Israel,” samantalang ginawang likas sa Tagalog ang mga idyomang Hebreo. Ang “mailap na hayop” ay mas pangkaraniwan at angkop sa konteksto ng pangangaso kaysa sa mas teknikal na “ligaw na hayop.”
