  source_fidelity: Tumpak ang pagsasalin ng kondisyong salungat, ng ipinahiwatig na layon na mga damit, at ng legal na bunga. Gayunman, ang “paliliguan” ay karaniwang pawatas na nagpapahiwatig na paliliguan ng isang tao ang iba; hindi nito pinakatumpak na naihahayag ang sariling paghuhugas ng katawan sa Hebreo. Ang “papasanin niya ang kanyang kasalanan” ay mas malapit sa וְנָשָׂא עֲוֹנוֹ at pinananatili ang saklaw ng idyoma.
  naturalness: Mas natural at tuwiran sa makabagong Filipino ang “huhugasan ang kanyang katawan” kaysa “paliliguan ang kanyang katawan” sa ganitong kautusang ritwal. Natural din ang “papasanin niya ang kanyang kasalanan” sa marangal na rehistrong biblikal.
  terminology: Ang “lalabhan” ay angkop para sa כבס at sa mga damit. Ang “katawan” ay malinaw na idyomatikong salin ng בשרו sa kontekstong ito. Ang “papasanin ... kasalanan” ay pinananatili ang legal na kalabuan ng עון—pagkakasala, pananagutan, at maaaring kahihinatnan—nang hindi ito nililimitahan sa isang kahulugan.
