  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: tl
  text: Ngunit kung hindi niya lalabhan ang kanyang mga damit at hindi niya huhugasan ang kanyang katawan[a], papasanin niya ang kanyang kasalanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kanyang laman”; dito, tumutukoy ito sa paghuhugas ng kanyang katawan.
    reason: lexical_alternative
  - marker: b
    text: O “pananagutan niya ang kanyang kasalanan” o “papasanin niya ang parusa sa kanyang kasalanan.” Maaaring saklawin ng pormulang legal sa Hebreo kapwa ang pagkakasala at ang bunga nito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng parirala ang salungat na kalagayan kasunod ng itinakdang paglilinis sa naunang talata.
- source_word: יְכַבֵּס
  choice: lalabhan ang kanyang mga damit
  rationale: Karaniwang tumutukoy ang piel ng כבס sa paglalaba ng kasuotan. Hindi tahasang inuulit sa Hebreo ang layon, ngunit malinaw itong ipinagpapalagay mula sa naunang talata.
- source_word: וּבְשָׂרוֹ לֹא יִרְחָץ
  choice: hindi niya paliliguan ang kanyang katawan
  rationale: Literal na 'kanyang laman' ang בשרו, ngunit sa konteksto ng ritwal na paghuhugas ay tumutukoy ito sa buong katawan; malinaw at likas sa modernong Filipino ang 'paliliguan ang kanyang katawan.'
- source_word: וְנָשָׂא עֲוֹנוֹ
  choice: pananagutan niya ang kanyang kasalanan
  rationale: Ang idyomang legal ay maaaring sumaklaw kapwa sa pagkakasala at sa kaakibat nitong pananagutan o kaparusahan. Pinananatili ng 'pananagutan' ang ugnayang iyon nang hindi tinutukoy ang eksaktong parusa.
theological_decisions:
- issue: Kahulugan ng legal na pormulang וְנָשָׂא עֲוֹנוֹ
  choice: pananagutan niya ang kanyang kasalanan
  alternative: papasanin niya ang kanyang kasalanan / papasanin niya ang parusa sa kanyang kasalanan
  rationale: Maaaring tukuyin ng עון ang kasamaan, pagkakasala, o pananagutang bunga nito. Hindi nililimitahan ng salin ang pahayag sa moral na sala lamang o sa tahasang kaparusahan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'lalabhan' para sa kasuotan at 'paliliguan' para sa katawan upang maipakita ang magkaibang kilos. Ang 'pananagutan niya' ay natural na legal na pananalita at pinananatili ang saklaw ng Hebreong idyoma.
