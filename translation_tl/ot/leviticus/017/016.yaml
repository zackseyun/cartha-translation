  - severity: low
    issue: Ang “pananagutan niya ang kanyang kasalanan” ay bahagyang mas nagpapasya sa kahulugang legal ng idyoma.
    rationale: Katanggap-tanggap ito, ngunit ang “papasanin niya ang kanyang kasalanan” ay mas malapit sa literal na pandiwang נשא at mas malinaw na iniiwan ang saklaw ng pananagutan at kahihinatnan na bukas.
