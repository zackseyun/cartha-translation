  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: tl
  text: At ihahagis ng pari ang dugo sa altar ni Yahweh[a] sa pasukan ng tolda ng pagpupulong, at susunugin niya ang taba bilang isang kalugod-lugod na samyo kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iwiwisik” o “ihagis” ang dugo sa altar. Ang pandiwang Hebreo ay tumutukoy sa ritwal na paglalapat ng dugo ng pari.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “isang kalugod-lugod na samyo”; tradisyonal din itong isinasaling “nakapagpapayapang samyo” o “mabangong samyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: ihahagis
  rationale: Sa konteksto ng paghahandog, tumutukoy ang זָרַק sa ritwal na paghahagis o pagwisik ng dugo sa altar. Pinananatili ng “ihahagis” ang mas malakas na kilos kaysa sa karaniwang “wiwisikan,” habang nililinaw sa talababa ang ritwal na diwa.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Karaniwan at malinaw na salin ng כֹּהֵן, kasama ang tiyak na pantukoy.
- source_word: הַדָּם
  choice: ang dugo
  rationale: Tuwirang tumutukoy sa dugo ng hayop na inihahandog.
- source_word: עַל מִזְבַּח יְהוָה
  choice: sa altar ni Yahweh
  rationale: Sa Tagalog, natural na naipahihiwatig ng “ihahagis ... sa altar” ang paglalapat ng dugo sa altar. Ginamit ang “ni Yahweh” upang ipakita ang kaugnayang taglay o pag-aari nang hindi mabigat ang parirala.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng pagpupulong
  rationale: Pinananatili ang lokasyon at ang nakaugaliang kahulugan ng אֹהֶל מוֹעֵד sa malinaw na modernong Tagalog.
- source_word: וְהִקְטִיר
  choice: susunugin niya
  rationale: Sa wikang panghandog, tumutukoy ito sa pagsunog sa altar upang pumailanlang bilang usok. Ang “susunugin” ay natural at sapat sa konteksto.
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Tumutukoy sa mga bahaging taba na itinalaga para sunugin sa altar; “ang taba” ang tuwiran at karaniwang salin.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: bilang isang kalugod-lugod na samyo
  rationale: Naipahahayag nito ang samyong katanggap-tanggap at nakalulugod sa Diyos, habang pinananatili ang konkretong larawang pang-amoy.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh / kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh”; ang “kay” ay natural na naghahayag na sa kaniya nakatuon ang handog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Diwa ng רֵיחַ נִיחֹחַ
  choice: kalugod-lugod na samyo
  alternative: nakapagpapayapang samyo; mabangong samyo
  rationale: Pinananatili ang pormulang panghandog at ang ideya ng banal na pagtanggap, nang hindi ipinahihiwatig na literal na napapayapa o nababago ng amoy ang Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw na daloy. Ginamit ang “tolda ng pagpupulong” bilang tuwiran at madaling maunawaang katawagan. Inayos ang mga talababa upang ang [a] ay sumunod sa pariralang tungkol sa ritwal na paglalapat ng dugo at ang [b] sa pariralang tungkol sa samyo.
