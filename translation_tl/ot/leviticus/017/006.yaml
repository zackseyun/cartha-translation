revisions:
- from: At ihahagis ng pari ang dugo sa altar ni Yahweh, sa pasukan ng tolda ng pagpupulong,[a] at susunugin niya ang taba bilang isang kalugod-lugod na samyo kay Yahweh.[b]
  to: At ihahagis ng pari ang dugo sa altar ni Yahweh[a] sa pasukan ng tolda ng pagpupulong, at susunugin niya ang taba bilang isang kalugod-lugod na samyo kay Yahweh.[b]
  rationale: Kailangan ang rebisyon upang maitama ang angkla ng talababa [a], na dapat tumukoy sa pandiwang “ihahagis” at sa dugo sa altar, hindi sa “tolda ng pagpupulong.” Ginawang higit na likas ang mga salita sa talababa at nilinaw na tradisyonal na alternatibo ang “nakapagpapayapang samyo.” Hindi binago ang kahulugan ng talata.
