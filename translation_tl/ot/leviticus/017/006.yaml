    issue: Maling kinalalagyan ng talababa [a]
    rationale: Ang [a] ay tumutukoy sa וְזָרַק at sa ritwal na paglalapat ng dugo, ngunit inilagay ito pagkatapos ng “tolda ng pagpupulong.” Dapat itong ikabit sa pariralang “ihahagis ... ang dugo sa altar,” samantalang ang [b] ay nananatili sa “kalugod-lugod na samyo.”
  - severity: low
    issue: Hindi likas ang alternatibong “idampi nang may hagis” sa talababa [a]
    rationale: Hindi ito karaniwang modernong Tagalog para sa ritwal na pagkilos. Mas malinaw ang “iwiwisik” o “ihagis” bilang mga alternatibong paglalarawan ng pandiwang Hebreo.
  - severity: low
    issue: Ang “nakapagpapayapang samyo” sa talababa [b] ay maaaring magmungkahi ng pagbasa na higit sa leksikal na saklaw
    rationale: Maaaring kilalanin ang tradisyonal na “soothing aroma,” ngunit mas maingat na ilarawan ito bilang tradisyonal na salin kaysa magmungkahi na ang amoy mismo ay nagpapayapa sa Diyos.
