  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: tl
  text: Hindi na sila maghahain ng kanilang mga hain sa mga demonyong kambing[a], na kanilang sinusundan sa pakikiapid[b]. Ito ay magiging permanenteng tuntunin[c] para sa kanila sa bawat salinlahi nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga diyus-diyosang kambing” o “mga satir.” Ang salitang Hebreo ay literal na maaaring tumukoy sa “mabalahibong mga nilalang” o mga kambing, ngunit sa kontekstong ito ay malamang na mga nilalang na demonyo na kaugnay ng bawal na pagsamba.
    reason: lexical_alternative
  - marker: b
    text: Literal na “na kanilang sinusundan sa pakikiapid.” Talinghaga ito ng seksuwal na pagtataksil na ginagamit para sa di-katapatan sa Diyos sa pamamagitan ng bawal na pagsamba.
    reason: cultural_note
  - marker: c
    text: Maaari ring “tuntuning magpakailanman” o “walang hanggang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: ihahandog ang kanilang mga handog na hayop
  rationale: Pinananatili ang magkaugnay na pandiwa at pangngalan ng Hebreo, ngunit ginagamit ang likas na pariralang Tagalog. Nililinaw ng “na hayop” ang kontekstong paghahain.
- source_word: עוֹד
  choice: Hindi na
  rationale: Sa negatibong legal na pahayag, ipinahihiwatig nito ang pagtigil sa dati o patuloy na gawain.
- source_word: לַשְּׂעִירִם
  choice: sa mga demonyong kambing
  rationale: Sa konteksto ng bawal na pagsamba, ang salita ay malamang na tumutukoy sa mga nilalang na demonyo na inilalarawan bilang kambing, hindi sa karaniwang mga kambing.
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: na pinagtataksilan nila sa akin
  rationale: Ginagawang natural sa Tagalog ang matinding talinghaga ng seksuwal na pagtataksil para sa di-katapatan sa pagsamba; ang “sa akin” ay ipinahihiwatig ng tipanang konteksto ngunit hindi tahasang nasa parirala, kaya ipinaliliwanag sa talababa.
- source_word: חֻקַּת עוֹלָם
  choice: permanenteng tuntunin
  rationale: Ipinapahayag ang patuloy at nananatiling bisa ng legal na pormula nang hindi awtomatikong pinalalabis ang עוֹלָם bilang pilosopikong walang hanggan.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng salinlahi nila
  rationale: Likas at malinaw na Tagalog para sa patuloy na bisa sa magkakasunod na salinlahi.
theological_decisions:
- issue: Ang tinutukoy ng שְּׂעִירִם sa bawal na pagsamba
  choice: mga demonyong kambing
  alternative: mga kambing; mga diyus-diyosang kambing; mga nilalang na kalahating tao at kalahating kambing
  rationale: Sinusuportahan ng konteksto ng paghahain at pagtataksil sa pagsamba ang isang demonyo o idolatrosong reperente. Iniiwasan ang katawagang nakatali sa mitolohiyang Griyego-Romano.
- issue: Lakas ng talinghagang זֹנִים
  choice: pinagtataksilan nila sa akin
  alternative: nagpapakasama sila; nagiging di-tapat sila; sumasamba sila sa mga diyus-diyosan
  rationale: Pinananatili ang talinghaga ng pagtataksil sa ugnayan sa halip na gawing abstraktong “pagsamba sa diyus-diyosan,” habang gumagamit ng dignified at malinaw na modernong Tagalog.
- issue: Saklaw ng חֻקַּת עוֹלָם
  choice: permanenteng tuntunin
  alternative: walang-hanggang tuntunin; tuntunin magpakailanman
  rationale: Pinananatili ang idiomatikong diwa ng matatag at patuloy na kautusan sa loob ng tipanang kaayusan, nang hindi nilulutas ang lahat ng tanong tungkol sa teolohikal na tagal nito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “handog na hayop” para sa malinaw na kultikong diwa, “demonyong kambing” upang mapanatili ang kakaibang larawang Hebreo, at “pinagtataksilan” upang maiparating ang matinding talinghaga nang hindi gumagamit ng bulgar o lipas na pananalita.
