    rationale: Walang unang panauhang panghalip sa Hebreong זֹנִים אַחֲרֵיהֶם. Bagaman maaaring ipahiwatig ng mas malawak na tipanang konteksto ang Diyos, hindi ito dapat ilagay sa mismong salin ng talata.
  - severity: high
    issue: Hindi tumpak ang pokus ng “na pinagtataksilan nila.”
    rationale: Ipinahihiwatig ng Hebreo na ang Israel ang ‘nakikiapid’/nagiging di-tapat kasunod ng mga nilalang na ito; ang kasalukuyang Tagalog ay maaaring mangahulugang ang mga demonyo ang kanilang pinagtataksilan.
