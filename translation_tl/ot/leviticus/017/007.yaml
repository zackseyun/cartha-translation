revisions:
- from: Hindi na nila ihahandog ang kanilang mga handog na hayop sa mga demonyong kambing[a] na pinagtataksilan nila sa akin[b]. Ito ay magiging permanenteng tuntunin[c] para sa kanila sa lahat ng salinlahi nila.
  to: Hindi na sila maghahain ng kanilang mga hain sa mga demonyong kambing[a], na kanilang sinusundan sa pakikiapid[b]. Ito ay magiging permanenteng tuntunin[c] para sa kanila sa bawat salinlahi nila.
  rationale: Inalis ang hindi tahasang “sa akin” at pinalitan ang hindi malinaw na “pinagtataksilan” ng isang saling nagpapanatili sa metapora ng pakikiapid at sa direksiyong “after/following them.” Pinasimple rin ang salin ng זבח upang huwag magdagdag ng “hayop,” habang pinananatili ang pag-uulit na “maghahain ... mga hain.” Inayos ang talababa upang tumugma sa binagong pangunahing teksto at upang malinaw na maitala ang mga alternatibong leksikal.
