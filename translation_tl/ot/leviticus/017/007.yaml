review_pass:
  verdict: revise
  source_fidelity: Kailangan ng rebisyon sa sugnay na זֹנִים אַחֲרֵיהֶם. Ang “na pinagtataksilan nila sa akin” ay nagdaragdag ng unang panauhang “sa akin,” na wala sa Hebreo, at hindi malinaw na naipapakita na ang bayan ang gumagawa ng metaporikal na pakikiapid kaugnay ng mga se'irim. Ang “maghahain ng kanilang mga hain” ay pinananatili ang pandiwa at kaugnay na pangngalan ng Hebreo nang hindi nagdadagdag ng “na hayop.”
  naturalness: Mas likas at malinaw sa modernong Filipino Tagalog ang “Hindi na sila maghahain ng kanilang mga hain” at “na kanilang sinusundan sa pakikiapid.” Ang huling parirala ay sadyang matalinghaga at medyo literal upang mapanatili ang seksuwalisadong larawan ng Hebreo nang hindi nagdaragdag ng isang hindi nakasulat na kausap.
  terminology: Ang “mga demonyong kambing” ay katanggap-tanggap na salin ng שְׂעִירִים sa kontekstong ito, basta't may talababa para sa alternatibong “mga diyus-diyosang kambing.” Ang “permanenteng tuntunin” ay angkop para sa חֻקַּת עוֹלָם; “sa bawat salinlahi nila” ay natural na salin ng לְדֹרֹתָם.
