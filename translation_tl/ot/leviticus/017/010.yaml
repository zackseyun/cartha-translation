  terminology: Ang “sambahayan ni Israel,” “dayuhang naninirahan,” at “banal na paghatol” ay angkop. Pinananatili ng “ihihiwalay” at ng talababa ang pinagtatalunang saklaw ng “cut off” nang hindi ito tinutumbasan ng kamatayan o pagpapatalsik.
