revisions:
- from: At sinumang lalaki mula sa sambahayan ni Israel, o sinumang dayuhang naninirahang kasama nila[a], na kumain ng anumang dugo, ihaharap ko ang aking mukha laban sa taong kumakain ng dugo[b], at ihihiwalay ko siya sa kanyang bayan[c].
  to: At sinumang lalaki mula sa sambahayan ni Israel, o sinumang dayuhang naninirahan sa gitna nila[a], na kumakain ng anumang dugo, ihaharap ko ang aking mukha laban sa taong kumakain ng dugo[b], at ihihiwalay ko siya mula sa gitna ng kanyang bayan[c].
  rationale: Pinalitan ang “kumain” ng “kumakain” upang maipakita ang pangkalahatang legal na saklaw ng Hebreong pandiwa. Idinagdag ang “mula sa gitna” upang maisalin ang מִקֶּרֶב, at ginawang “sa gitna nila” ang lokasyon ng residenteng dayuhan upang mas tumpak na maipahayag ang בְּתוֹכָם. Hindi binigyang-kahulugan nang lampas sa teksto ang parusang “cut off.”
  reviewer_model: gpt-5.6-terra
