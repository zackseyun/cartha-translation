  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בֵּ֣ית יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֥ר יֹאכַ֖ל כָּל דָּ֑ם וְ/נָתַתִּ֣י פָנַ֗/י בַּ/נֶּ֨פֶשׁ֙ הָ/אֹכֶ֣לֶת אֶת הַ/דָּ֔ם וְ/הִכְרַתִּ֥י אֹתָ֖/הּ מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: tl
  text: At sinumang lalaki mula sa sambahayan ni Israel, o sinumang dayuhang naninirahan sa gitna nila[a], na kumakain ng anumang dugo, ihaharap ko ang aking mukha laban sa taong kumakain ng dugo[b], at ihihiwalay ko siya mula sa gitna ng kanyang bayan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay isang dayuhang naninirahan sa loob ng pamayanan ng Israel, hindi lamang isang dayuhang nagdaraan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kaluluwa/taong kumakain”; dito, tumutukoy ito sa mismong taong nagkasala.
    reason: lexical_alternative
  - marker: c
    text: Ang “ihihiwalay” ay isang pormula ng tipanang parusa. Hindi tinutukoy rito kung nangangahulugan ito ng kamatayan, pagpapatalsik, o ibang anyo ng banal na paghatol.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: At sinumang lalaki
  rationale: Ang pag-uulit ng אִישׁ ay isang pamamaraang Hebreo na may distributibong diwang ‘sinuman.’ Pinanatili ang ‘lalaki’ dahil panlalaki ang pambungad na legal na pormula.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: mula sa sambahayan ni Israel
  rationale: Pinananatili ng ‘sambahayan ni Israel’ ang pormal at tipanang idyoma ng Hebreo.
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: o sinumang dayuhang naninirahang kasama nila
  rationale: Ang גֵּר ay isang hindi katutubong naninirahan sa loob ng pamayanan, hindi lamang isang dayuhang nagdaraan. Natural sa modernong Tagalog ang ‘dayuhang naninirahan.’
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: na kumain ng anumang dugo
  rationale: Karaniwang pandiwa para sa ‘kumain’ ang יֹאכַל, at ipinahahayag ng ‘anumang dugo’ ang ganap na saklaw ng pagbabawal.
- source_word: וְנָתַתִּי פָנַי
  choice: ihaharap ko ang aking mukha laban
  rationale: Pinananatili nito ang antropomorpikong idyoma ng mariing banal na pagsalungat at paghatol sa halip na gawing payak na ‘sasalungatin ko.’
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: laban sa taong kumakain
  rationale: Sa kontekstong legal, ang נֶפֶשׁ ay tumutukoy sa mismong taong nagkasala; iniiwasan ng ‘tao’ ang di-kinakailangang metapisikong pakahulugan ng ‘kaluluwa.’
- source_word: וְהִכְרַתִּי אֹתָהּ
  choice: at ihihiwalay ko siya
  rationale: Ipinahahayag ng ‘ihihiwalay’ ang larawan ng pagputol o pag-aalis nang hindi tiyakang ipinapakahulugan kung ito ay kamatayan, pagpapatalsik, o ibang anyo ng banal na paghatol.
- source_word: מִקֶּרֶב עַמָּהּ
  choice: sa kanyang bayan
  rationale: Natural na katumbas ito ng ‘mula sa gitna ng kanyang bayan’ at malinaw na nagpapahayag ng pag-aalis mula sa sariling pamayanan.
theological_decisions:
- issue: Kahulugan ng pormulang parusa na וְהִכְרַתִּי (‘puputulin/ihihiwalay’)
  choice: ihihiwalay ko siya sa kanyang bayan
  alternative: papatayin ko siya; palalayasin ko siya; aalisin ko siya sa pamamagitan ng banal na paghatol
  rationale: Malubhang tipanang paghatol ang malinaw na ipinahahayag, ngunit hindi tinutukoy ng talata ang eksaktong paraan. Kaya pinanatili ang kalabuan sa salin at ipinaliwanag ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormal na ‘sambahayan ni Israel’ at ang makapangyarihang larawang ‘ihaharap ko ang aking mukha laban,’ habang ginawang natural ang paglalarawan sa residenteng dayuhan. Ang lahat ng marker [a], [b], at [c] ay nasa pangunahing teksto.
