    issue: Ang “namatay nang kusa” ay hindi tumpak na paglalarawan ng נְבֵלָה.
    rationale: Sa modernong Filipino, maaari itong unawain bilang kusang-loob na pagkamatay. Ang Hebreo ay tumutukoy sa hayop na namatay na hindi sa wastong pagkakatay; “kusang namatay” ang mas angkop na maikling salin.
  - severity: medium
    issue: Ang “nilapa” ay hindi sapat na tiyak para sa טְרֵפָה.
    rationale: Ang termino ay tumutukoy sa hayop na pinunit o niluray ng mabangis na hayop. Ang “pinunit ng mabangis na hayop” ay mas malapit sa leksikal na diwa nang hindi nagdaragdag ng detalye.
