  source_fidelity: Ang pangkalahatang nilalaman at pagkakasunod-sunod ng ritwal na utos ay tapat sa Hebreo. Gayunman, ang “namatay nang kusa” ay maaaring mangahulugang boluntaryong namatay, samantalang ang נְבֵלָה ay hayop na namatay nang hindi wasto ang pagkakatay o natagpuang patay. Ang “nilapa” ay maaari ring tumukoy sa pagkain o pagsalakay ng mandaragit, hindi partikular sa hayop na napunit o naluray, gaya ng טְרֵפָה.
  naturalness: Natural at malinaw ang legal na rehistro. Ang “hayop na kusang namatay” at “hayop na pinunit ng mabangis na hayop” ay mas tumpak at idiomatiko kaysa sa mga pariralang nasa draft.
  terminology: Napananatili ang “katutubo” at “dayuhang naninirahan” para sa אֶזְרָח at גֵּר. Ang “marumi” at “malinis” ay katanggap-tanggap sa konteksto, ngunit nililinaw ng “sa ritwal” na ang tinutukoy ay katayuang pangritwal, hindi moral na paghatol.
  issues:
