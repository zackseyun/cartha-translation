source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: tl
  text: At ang sinumang kumain ng hayop na kusang namatay o hayop na pinunit ng mabangis na hayop, maging katutubo o dayuhang naninirahan, ay dapat maglaba ng kanyang mga damit at maligo sa tubig. Mananatili siyang marumi sa ritwal hanggang gabi; pagkatapos ay magiging malinis siyang muli sa ritwal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: sinuman
  rationale: Sa kontekstong legal, tumutukoy ito sa isang tao. Ang “sinuman” ay natural sa Filipino at angkop sa pangkalahatang tuntunin.
- source_word: תֹּאכַל
  choice: kumain
  rationale: Isinasalin bilang kondisyon sa pariralang “sinumang kumain,” alinsunod sa gamit nito sa kasong legal.
- source_word: נְבֵלָה
  choice: hayop na namatay nang kusa
  rationale: Tumutukoy sa bangkay ng hayop na namatay nang hindi kinatay ayon sa wastong paraan; nililinaw ng salin ang mahalagang pagkakaibang ito.
- source_word: טְרֵפָה
  choice: nilapa ng mabangis na hayop
  rationale: Tumutukoy sa hayop na niluray o nilapa ng mandaragit. Natural at malinaw sa modernong Filipino ang parirala.
- source_word: בָּאֶזְרָח
  choice: katutubo
  rationale: Tumutukoy sa katutubong kasapi ng lipunang Israelita at malinaw na ipinapares sa dayuhang naninirahan.
- source_word: בַגֵּר
  choice: dayuhang naninirahan
  rationale: Ang גֵּר ay dayuhang nakikipamayan o permanenteng naninirahan, hindi lamang panandaliang bisita.
- source_word: וְכִבֶּס בְּגָדָיו
  choice: dapat maglaba ng kanyang mga damit
  rationale: Ipinahahayag nito ang kinakailangang ritwal na tugon sa natural na modernong Filipino.
- source_word: וְרָחַץ בַּמַּיִם
  choice: maligo sa tubig
  rationale: Tumutukoy sa paghuhugas ng katawan; ang “maligo sa tubig” ay tuwiran at madaling maunawaan.
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: Mananatili siyang marumi hanggang gabi
  rationale: Pinananatili ng “marumi” ang kategorya ng ritwal na karumihan, at ipinapakita ng “mananatili” ang pansamantalang kalagayan hanggang gabi.
- source_word: וְטָהֵר
  choice: pagkatapos ay magiging malinis siya
  rationale: Malinaw na minamarkahan ang pagtatapos ng pansamantalang ritwal na karumihan matapos ang paghuhugas at paglipas ng itinakdang panahon.
theological_decisions:
- issue: Kalikasan ng karumihan sa batas ng Levitico
  choice: Gamitin ang “marumi/malinis” bilang mga katawagang tumutukoy sa ritwal na kalagayan.
  alternative: “nadungisan/nadalisay” na maaaring magpahiwatig ng moral o espirituwal na pagkakasala
  rationale: Ang talata ay tumutukoy sa katayuang ritwal matapos kumain ng bangkay o nilapang hayop. Iniiwasan ng “marumi/malinis” ang pagdaragdag ng moral na hatol na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dapat” para sa legal na obligasyon, “dayuhang naninirahan” upang ihatid ang diwa ng residenteng dayuhan, at magkahiwalay na pangungusap upang luminaw ang pagkakasunod-sunod ng paghuhugas, pansamantalang karumihan, at muling pagiging malinis.
