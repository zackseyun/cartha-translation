  to: At ang sinumang kumain ng hayop na kusang namatay o hayop na pinunit ng mabangis na hayop, maging katutubo o dayuhang naninirahan, ay dapat maglaba ng kanyang mga damit at maligo sa tubig. Mananatili siyang marumi sa ritwal hanggang gabi; pagkatapos ay magiging malinis siyang muli sa ritwal.
