  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: tl
  text: upang dalhin ng mga anak ni Israel ang mga handog na kanilang inihahandog sa parang, at dalhin ang mga iyon kay Yahweh sa pasukan ng toldang tipanan, sa pari, at ialay ang mga iyon bilang mga handog para sa kapayapaan[a] kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog para sa pakikisama” o “mga handog ng mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: upang
  rationale: Likas at malinaw na panandang Filipino para sa layunin; inuugnay nito ang talata sa naunang utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang pahayag ng Hebreo at ang kolektibong pagtukoy sa bayang tipan.
- source_word: זִבְחֵיהֶם
  choice: mga handog
  rationale: Sa konteksto, tumutukoy ito sa mga hayop na inihahandog sa pamamagitan ng ritwal na pagkatay; ang 'mga handog' ay malinaw at likas sa Filipino.
- source_word: אֲשֶׁר הֵם זֹבְחִים
  choice: na kanilang inihahandog
  rationale: Ipinahihiwatig ng participle ang kasalukuyan o nakaugaliang gawain; pinananatili rin ang ugnayang leksikal sa handog nang hindi gumagamit ng mabigat na parirala.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: sa parang
  rationale: Idyomatikong salin para sa bukás na lupain sa labas ng santuwaryo; hindi kailangan ang literal na 'sa ibabaw ng mukha ng bukid.'
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang personal na pangalang יהוה bilang Yahweh.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pasukan ng toldang tipanan
  rationale: '''Pasukan'' ay natural para sa פתח, at ''toldang tipanan'' ay dignificado at madaling maunawaang katawagan sa santuwaryong אֹהֶל מוֹעֵד.'
- source_word: אֶל הַכֹּהֵן
  choice: sa pari
  rationale: Pinananatili ang tiyak na pari na namamahala sa santuwaryo ayon sa artikulong Hebreo.
- source_word: זִבְחֵי שְׁלָמִים
  choice: mga handog para sa mabuting ugnayan
  rationale: Ipinakikita ang uri ng handog na kaugnay ng kapayapaan, kabuuan, at pakikisalo, nang hindi ito ipakahulugang panloob na katahimikan lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang tipan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng זִבְחֵי שְׁלָמִים
  choice: mga handog para sa mabuting ugnayan
  alternative: mga handog para sa kapayapaan; mga handog ng mabuting kalagayan
  rationale: Malawak ang saklaw ng שְׁלָמִים at maaaring magpahiwatig ng kapayapaan, kabuuan, at pakikisalo. Ang pangunahing salin ay natural sa Filipino, habang itinatala sa talababa ang lehitimong alternatibo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang anyong pampamilya ng Hebreo nang hindi ipinapahiwatig na limitado lamang ang tinutukoy sa mga literal na anak ng patriyarka.
translation_notes:
  register: Makabagong Filipino na malinaw ngunit marangal. Pinanatili ang mahabang daloy ng sugnay upang maipakita ang layunin at sunod-sunod na kilos sa Hebreo. Ginamit ang 'toldang tipanan' bilang natural na katawagan sa אֹהֶל מוֹעֵד at ang personal na pangalang 'Yahweh' para sa יהוה.
