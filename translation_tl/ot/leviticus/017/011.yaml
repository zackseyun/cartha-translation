revisions:
- from: Sapagkat ang buhay ng laman ay nasa dugo, at ibinigay ko ito sa inyo sa ibabaw ng altar upang gumawa ng pagtubos para sa inyong mga buhay,[a] sapagkat ang dugo ang gumagawa ng pagtubos sa pamamagitan ng buhay.[b]
