  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: tl
  text: Sapagkat ang buhay ng laman ay nasa dugo, at ibinigay ko ito sa inyo sa altar upang magbayad-sala para sa inyong mga buhay,[a] sapagkat ang dugo ang nagbabayad-sala sa pamamagitan ng buhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong nefesh ay maaaring mangahulugang “buhay,” “sarili,” o “tao,” depende sa konteksto; dito, “buhay” ang diwa.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “sapagkat ang dugo ay nagbabayad-sala sa pamamagitan ng buhay na nasa loob nito.”'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa buhay na nasa nilalang, hindi partikular sa isang di-materyal na “kaluluwa.” Pinananatili rin ng “buhay” ang ugnayan ng dugo at buhay sa buong talata.
- source_word: הַבָּשָׂר
  choice: laman
  rationale: Tuwirang katumbas ito ng בָּשָׂר at tumutukoy rito sa buhay na laman ng nilalang.
- source_word: בַּדָּם
  choice: nasa dugo
  rationale: Likas sa Tagalog at malinaw na ipinahahayag ang lokasyon o kaugnayan ng buhay sa dugo.
- source_word: נְתַתִּיו לָכֶם
  choice: ibinigay ko ito sa inyo
  rationale: Pinananatili ang ganap na kilos ng pandiwang Hebreo at ang diin na ang dugo ay kaloob ng Diyos para sa itinakdang gamit.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa ibabaw ng altar
  rationale: Pinananatili ang kongkretong kahulugan ng עַל at ang konteksto ng paghahandog.
- source_word: לְכַפֵּר / יְכַפֵּר
  choice: gumawa ng pagtubos / gumagawa ng pagtubos
  rationale: Nagbibigay ito ng pare-parehong terminolohiyang pangkulto nang hindi nagtatakda ng isang makitid na teorya kung paano nagaganap ang pagtubos.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: para sa inyong mga buhay
  rationale: Pinananatili ang pagkakapareho ng נֶפֶשׁ sa talata at iniiwasang ipahiwatig ang paghihiwalay ng katawan at kaluluwa na hindi hinihingi ng Hebreo.
- source_word: בַּנֶּפֶשׁ
  choice: sa pamamagitan ng buhay
  rationale: Pinananatili ang instrumental na posibilidad ng בְּ at ang siksik, bahagyang malabong ugnayan ng dugo, buhay, at pagtubos.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ sa batas tungkol sa paghahandog
  choice: “Buhay” sa lahat ng paglitaw nito sa talata
  alternative: “Kaluluwa” o “sarili/mga tao”
  rationale: Ibinabatay ng talata ang bisa ng dugo sa buhay na kaugnay nito. Ang “buhay” ang pinakamalinaw na nagpapanatili sa lohika at pag-uulit ng tekstong Hebreo.
- issue: Lakas ng בַּנֶּפֶשׁ sa huling sugnay
  choice: “Sa pamamagitan ng buhay” sa pangunahing teksto
  alternative: “Dahil sa buhay” o “sa pamamagitan ng buhay na nasa dugo”
  rationale: Siksik at pinagtatalunan ang pariralang Hebreo. Hindi nilulutas nang labis ng salin ang ugnayan; inilalahad sa talababa ang mas malinaw ngunit mas interpretatibong pagbasa.
- issue: Saklaw ng כּפר
  choice: “Pagtubos”
  alternative: “Pagbabayad-sala” o “pag-aalis ng sala”
  rationale: Ang “pagtubos” ay dignidad at madaling maunawaan sa Tagalog, habang hindi nito ikinukulong ang terminong pangkulto sa isang denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Ginamit ang “laman,” “altar,” at “pagtubos” bilang pamilyar na bokabularyong biblikal; pinanatili ang bahagyang di-karaniwang huling parirala upang huwag ikubli ang tunay na sintaktikong kalabuan ng Hebreo.
