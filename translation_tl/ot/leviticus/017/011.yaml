  rationale: Inayos ang terminong pangkulto at ang mga pandiwa upang maging tapat sa כפר at mas likas sa modernong Filipino. Pinanatili ang “buhay” sa lahat ng paglitaw ng נֶפֶשׁ at ang bahagyang kalabuan ng בַּנֶּפֶשׁ sa pangunahing teksto; ang mas pagpapaliwanag na pagbasa ay nasa talababa.
