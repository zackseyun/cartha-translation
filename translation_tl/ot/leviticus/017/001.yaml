lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang wayyiqtol ay nagbubukas ng panibagong pangyayari ng pagsasalita; pinananatili ng “At nagsalita” ang pormulang Hebreo at ang daloy mula sa naunang salaysay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ito ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakasanayan at malinaw na anyong Filipino ng pangalang Hebreo.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang panimulang-salita ng Hebreo at inihahanda ang tuwirang pahayag sa kasunod na talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na gawing titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormulang Hebreo na “nagsalita … na sinasabi,” bagaman mas karaniwang Filipino ang “sinabi,” upang maipakita ang magkahiwalay na pandiwang דִּבֵּר at לֵאמֹר at ang pormal na pambungad sa kasunod na pahayag.
