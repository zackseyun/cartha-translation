  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: tl
  text: 'Magsalita ka kay Aaron, sa kanyang mga anak na lalaki, at sa lahat ng mga anak ni Israel,[a] at sabihin mo sa kanila: “Ito ang bagay na iniutos ni Yahweh:[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng mga Israelita” o “buong sambayanan ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Ito ang salita/bagay.” Maaari ring “Ito ang usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: Magsalita ka
  rationale: Ang Piel imperative na panlalaking isahan ay tuwirang utos kay Moises. Pinananatili ng “Magsalita ka” ang lakas at pormal na himig ng utos.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo at tumutukoy sa mga anak na lalaking pari ni Aaron; nililinaw ito sa Tagalog upang hindi mapagkamalang lahat ng anak anuman ang kasarian.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: lahat ng mga anak ni Israel
  rationale: Pinananatili ang pampamilyang anyo ng nakaugaliang katawagang Hebreo sa sambayanan, habang natural at mauunawaan pa rin sa modernong Tagalog.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: at sabihin mo sa kanila
  rationale: Natural na kasunod na utos sa Tagalog na pinananatili ang koordinasyon at tuwirang pahayag ng Hebreo.
- source_word: זֶה הַדָּבָר
  choice: Ito ang bagay
  rationale: Malawak ang saklaw ng דָּבָר—salita, bagay, o usapin. Sa pormulang nagpapakilala ng isang utos, malinaw at natural ang “bagay,” habang itinatala sa talababa ang mga tunay na alternatibo.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang perpektong pandiwa ay tumutukoy sa utos na ibinigay na at ilalahad sa kasunod na mga talata. Sapat at natural ang pangnagdaang “iniutos” sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: לֵאמֹר
  choice: tutuldok pagkatapos ng pambungad na sugnay
  rationale: Ipinakikilala ng infinitive ang nilalaman ng utos na sumusunod. Sa natural na Tagalog, naipahihiwatig ito nang malinaw ng tutuldok, sa halip na idagdag ang mabigat at paulit-ulit na “na sinasabi.”
theological_decisions:
- issue: Paglilipat sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Pagpapanatili sa pampamilyang katawagang בְּנֵי יִשְׂרָאֵל
  choice: lahat ng mga anak ni Israel
  alternative: lahat ng mga Israelita; buong sambayanan ng Israel
  rationale: Ang parirala ay nakaugaliang katawagan sa bayang Israel ngunit may tunay na pampamilyang anyo. Pinananatili ito sa pangunahing teksto nang hindi ipinapalagay na mga lalaki lamang ang buong sambayanang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit tuwiran. Ginamit ang “mga anak na lalaki” para sa tiyak na mga anak ni Aaron, ngunit “mga anak ni Israel” bilang nakaugaliang etnikong katawagan. Ginawang tutuldok ang לֵאמֹר upang natural na ipakilala ang utos na magpapatuloy sa susunod na talata.
