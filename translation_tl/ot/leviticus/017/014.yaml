id: LEV.17.14
reference: Leviticus 17:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: tl
  text: Sapagkat ang buhay ng bawat nilalang ay ang dugo nito; nasa buhay nito iyon.[a] Kaya sinabi ko sa mga anak ni Israel[b], “Huwag ninyong kainin ang dugo ng anumang nilalang, sapagkat ang buhay ng bawat nilalang ay ang dugo nito.” Ang sinumang kumain nito ay ihihiwalay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “ang dugo nito ay nasa buhay nito,” o, nang mas malaya, “ang dugo nito ang buhay nito.”'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa konteksto ng pagbabawal sa pagkain ng dugo, tumutukoy ito sa buhay na taglay ng nilalang, hindi sa isang hiwalay at di-materyal na “kaluluwa.”
- source_word: כָּל בָּשָׂר
  choice: bawat nilalang
  rationale: Likas at malinaw ito sa makabagong Tagalog para sa Hebreong idyomang “lahat ng laman,” habang pinananatili ang saklaw nito sa mga nilalang na may buhay.
- source_word: דָּם / דָּמוֹ
  choice: dugo / dugo nito
  rationale: Tuwirang salin ito ng sentrong salita sa katuwiran at pagbabawal ng talata.
- source_word: בְנַפְשׁוֹ הוּא
  choice: nasa buhay nito iyon
  rationale: Pinananatili nito ang siksik at medyo malabong pagkakaugnay ng dugo at buhay sa Hebreo sa halip na lubusang ipaliwanag o pakinisin.
- source_word: וָאֹמַר
  choice: Kaya sinabi ko
  rationale: Ipinapakita ng “kaya” na ang utos ay sumusunod bilang bunga ng naunang pahayag tungkol sa dugo at buhay.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang literal at tradisyonal na anyo ng Hebreong parirala; nililinaw sa talababa ang tinutukoy nito.
- source_word: לֹא תֹאכֵלוּ
  choice: Huwag ninyong kainin
  rationale: Natural at mariing anyo ito ng tuwirang pagbabawal sa Tagalog.
- source_word: כָּל אֹכְלָיו
  choice: Ang sinumang kumain nito
  rationale: Ipinahahayag nito ang panlahatang ngunit indibiduwal na saklaw ng Hebreong participle.
- source_word: יִכָּרֵת
  choice: ay ihihiwalay
  rationale: Pinananatiling hindi tiyak ang paraan ng parusang tipan at iniiwasang tukuyin ito bilang pagpatay o pormal na pagtitiwalag lamang.
theological_decisions:
- issue: Kahulugan ng נֶפֶשׁ kaugnay ng dugo
  choice: Isinalin bilang “buhay,” na nagpapahayag ng malapit na kaugnayan ng dugo sa buhay ng nilalang.
  alternative: “kaluluwa” sa metapisikal na pakahulugan
  rationale: Ang katuwiran ng talata ay nakasalalay sa ugnayan ng dugo at buhay, hindi sa isang ganap na doktrina tungkol sa hiwalay na kaluluwa.
- issue: Lakas at paraan ng parusang יִכָּרֵת
  choice: “ihihiwalay,” nang hindi tinutukoy ang eksaktong paraan o ahente ng parusa
  alternative: “papatayin,” “ititiwalag,” o “aalisin sa pamayanan”
  rationale: Hindi tahasang nilulutas ng Hebreong idyoma rito kung ito ay kamatayan, pag-aalis sa pamayanan, o hatol ng Diyos; dapat panatilihin ang tensiyong iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “bawat nilalang” sa halip na ang mas literal ngunit di-gaanong likas na “lahat ng laman.” Pinanatili sa unang pangungusap ang siksik at tunay na malabong pag-uulit ng Hebreo, at hindi nilimitahan ang “ihihiwalay” sa isang partikular na anyo ng parusa.
