  naturalness: Likas at angkop sa legal-panrelihiyong rehistro ang binagong pangungusap. Ang ‘sa gitna nila’ ay mas natural at mas malapit sa pinagmulan kaysa ‘kasama nila.’
  terminology: Pinananatili ang ‘lalaki,’ ‘sambahayan ng Israel,’ ‘dayuhang naninirahan,’ ‘handog na sinusunog,’ at ‘hain.’ Inalis ang ‘ibang’ upang hindi magdagdag ng kahulugang wala sa Hebreo.
