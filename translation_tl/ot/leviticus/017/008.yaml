base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: tl
  text: 'At sabihin mo sa kanila: ‘Sinumang lalaki mula sa sambahayan ng Israel[a], o sinumang dayuhang naninirahan sa gitna nila[b], na maghandog ng handog na sinusunog o hain—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang salitang “lalaki” (“lalaki, lalaki”), isang legal na idyomang distributibo na tumutukoy sa bawat indibidwal na lalaki sa saklaw ng tuntunin.
    reason: lexical_alternative
  - marker: b
    text: O “residenteng dayuhan.” Ang Hebreong salita ay tumutukoy sa isang di-Israelitang naninirahan sa gitna ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: At sabihin mo sa kanila
  rationale: Pinananatili ng “At” ang pang-ugnay, at likas sa makabagong Tagalog ang pautos na “sabihin mo” para sa tagubiling ibinigay kay Moises.
- source_word: אִישׁ אִישׁ
  choice: Sinumang lalaki
  rationale: Ang inuulit na אִישׁ ay distributibong idyomang tumutukoy sa bawat indibidwal na lalaki; ipinahahayag ng “sinuman” ang distributibong diwa habang pinananatili ng “lalaki” ang kasariang nasa Hebreo.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: mula sa sambahayan ng Israel
  rationale: Pinananatili ng “sambahayan ng Israel” ang kolektibo at tipanang pahayag na “house of Israel,” sa halip na paikliin lamang bilang “Israel.”
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: o sinumang dayuhang naninirahang kasama nila
  rationale: Ang גֵּר ay isang di-Israelitang residenteng namumuhay sa gitna ng Israel. Mas malinaw sa karaniwang mambabasa ang “dayuhang naninirahan” kaysa “estranghero,” at iniiwasan nito ang diwang pansamantalang bisita lamang.
- source_word: אֲשֶׁר יַעֲלֶה
  choice: na maghandog
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng עלה ay nangangahulugang mag-alay o maghandog; sapat at likas sa Tagalog ang “maghandog.”
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang nakaugaliang malinaw na katawagan sa handog na lubusang sinusunog sa altar.
- source_word: אוֹ זָבַח
  choice: o ng ibang hain
  rationale: Ang זָבַח dito ay nominal na tumutukoy sa isang kinatay na hain na naiiba sa handog na sinusunog. Idinagdag ang “ibang” upang maging malinaw sa Tagalog ang pagkakaibang ipinahihiwatig ng koordinasyon, nang hindi tinutukoy ang isang mas makitid na uri ng hain.
theological_decisions:
- issue: Distributibong panlalaking pahayag na אִישׁ אִישׁ
  choice: Sinumang lalaki
  alternative: Sinumang tao; sinuman
  rationale: Masasalamin nito kapwa ang distributibong saklaw at ang tahasang panlalaking anyo ng legal na pahayag sa Hebreo, nang hindi ginagawang neutral ang teksto.
- issue: Kahulugan ng גֵּר
  choice: dayuhang naninirahang kasama nila
  alternative: pansamantalang nakikipamayan; residenteng dayuhan; estranghero
  rationale: Tumutukoy ito sa isang di-Israelitang naninirahan sa komunidad at saklaw ng mga tuntuning pangkulto. Nililinaw ng salin ang katayuang dayuhan at paninirahan nang hindi nag-aangkat ng makabagong legal na kategorya.
- issue: Ugnayan ng עֹלָה at זָבַח
  choice: handog na sinusunog o ibang hain
  alternative: handog na sinusunog o hain
  rationale: Ang dalawang termino ay magkaugnay ngunit magkaiba sa kontekstong pansakripisyo. Tinutulungan ng “ibang” ang mambabasa na maunawaan na ang ikalawa ay isa pang uri ng hain, hindi pag-uulit lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may legal-panrelihiyong himig. Ginamit ang “sambahayan ng Israel” upang mapanatili ang tipanang pormula, at “dayuhang naninirahan” upang maging madaling maunawaan ang sinaunang kategoryang panlipunan. Pinanatili ang gitling sa dulo dahil nagpapatuloy ang pangungusap sa susunod na talata.
