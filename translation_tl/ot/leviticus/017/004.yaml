  naturalness: Ang “Tolda ng Tagpuan,” “bilang alay,” at “mula sa gitna ng kanyang sambayanan” ay marangal, malinaw, at natural sa modernong Filipino Tagalog na may angkop na rehistrong legal at pangkasulatan. Ang “puputulin” ay sadyang pormal upang mapanatili ang bukas na saklaw ng legal na pormula.
  terminology: Pinanatili ang “Yahweh” ayon sa draft, “Tabernakulo” para sa מִשְׁכָּן, at “Tolda ng Tagpuan” para sa אֹהֶל מוֹעֵד upang hindi pag-isahin ang dalawang magkaibang katawagang Hebreo. Ang “alay” ay natural na katumbas ng קָרְבָּן sa pariralang “ihandog ... bilang alay.”
