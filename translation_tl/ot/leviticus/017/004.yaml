  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: tl
  text: at hindi niya ito dinala sa pasukan ng Tolda ng Tagpuan upang ihandog kay Yahweh bilang alay sa harap ng Tabernakulo ni Yahweh, ang dugo ay ibibilang sa taong iyon[a]; nagdanak siya ng dugo, at ang taong iyon ay puputulin mula sa gitna ng kanyang sambayanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang dugo ay ibibilang sa taong iyon.” Ang idyoma ay tumutukoy sa pananagutan sa pagdanak ng dugo.
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy rito kung ang “puputulin” ay nangangahulugang kamatayan, pagpapaalis, o ibang anyo ng pag-aalis mula sa sambayanan.
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pasukan ng Toldang Tipanan
  rationale: Ang פֶּתַח ay pasukan o bukana, at ang אֹהֶל מוֹעֵד ay ang karaniwang katawagan sa santuwaryo. Ang “Toldang Tipanan” ay natural at marangal sa modernong Tagalog.
- source_word: הֱבִיאוֹ
  choice: dinala niya ito
  rationale: Ang Hiphil ng בוא ay “dalhin.” Ang hulaping layon ay tumutukoy sa hayop na kinatay sa naunang talata.
- source_word: לְהַקְרִיב קָרְבָּן
  choice: upang ihandog bilang handog
  rationale: Ipinahahayag ng הקריב ang paglalapit o paghahandog sa kontekstong pansakripisyo. Pinananatili ng salin ang pag-uulit sa Hebreo nang hindi nagiging lubhang di-natural.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang יהוה bilang “Yahweh,” alinsunod sa tekstong Hebreo at sa consultation layer.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: sa harap ng Tabernakulo ni Yahweh
  rationale: Ang לִפְנֵי ay “sa harap ng,” at ang מִשְׁכָּן ay tirahan o tabernakulo ng santuwaryo. Ang “Tabernakulo” ay isang kinikilalang terminong pangkulto.
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: ibibilang na may pananagutan sa dugo ang taong iyon
  rationale: Literal na “dugo ang ibibilang sa taong iyon.” Nililinaw ng “may pananagutan sa dugo” ang legal na diwa habang pinananatili ang pandiwang “ibibilang.”
- source_word: דָּם שָׁפָךְ
  choice: nagbubo siya ng dugo
  rationale: Malapit ito sa karaniwang idyomang Hebreo para sa pagdanak ng dugo at pinananatili ang matinding legal at moral na pahayag.
- source_word: וְנִכְרַת
  choice: ititiwalag
  rationale: Ipinahahayag nito ang pag-aalis mula sa sambayanan nang hindi tinutukoy kung kamatayan, pagpapaalis, o ibang anyo ng pagkalagot ang kaparusahan.
- source_word: מִקֶּרֶב עַמּוֹ
  choice: mula sa kanyang bayan
  rationale: Natural na Tagalog para sa pormulang nangangahulugang pag-aalis mula sa gitna ng sariling sambayanan.
theological_decisions:
- issue: Legal na idyomang דָּם יֵחָשֵׁב
  choice: ibibilang na may pananagutan sa dugo ang taong iyon
  alternative: ibibilang sa taong iyon ang dugo
  rationale: Ang literal na anyo ay maaaring hindi malinaw sa ordinaryong mambabasa. Ipinapakita ng kasunod na “nagbubo siya ng dugo” na legal na pananagutan sa pagdanak ng dugo ang tinutukoy, ngunit inilalagay sa talababa ang literal na anyo.
- issue: Kahulugan ng kaparusahang וְנִכְרַת
  choice: ititiwalag mula sa kanyang bayan
  alternative: puputulin mula sa gitna ng kanyang bayan
  rationale: Hindi tinutukoy ng talata ang eksaktong paraan ng pag-aalis. Hindi ito isinalin bilang tiyak na pagpatay o ekskomunikasyon; ang talababa ay nagpapanatili sa saklaw ng posibleng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Yahweh” para sa banal na pangalan, “Toldang Tipanan” para sa אֹהֶל מוֹעֵד, at “Tabernakulo” para sa מִשְׁכָּן. Pinanatili ang legal na bigat at ang hindi tiyak na paraan ng kaparusahang “cut off.”
