base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: tl
  text: “Sinumang lalaki[a] mula sa sambahayan ng Israel na kakatay ng baka, tupa, o kambing sa loob ng kampo, o kakatay nito sa labas ng kampo—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “lalaki, lalaki.” Ang pag-uulit ay distributibo at tumutukoy sa sinumang kabilang sa lipunang Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: Sinumang lalaki
  rationale: Ang pag-uulit na “lalaki, lalaki” ay isang idyomang distributibo na nangangahulugang sinumang lalaki o bawat lalaki. Pinananatili ng salin ang anyong panlalaki ng Hebreo habang ipinahihiwatig ng talababa ang pangkalahatang gamit nito sa lipunang Israelita.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: mula sa sambahayan ng Israel
  rationale: Pinananatili nito ang literal at tipanang pambansang idyomang “sambahayan ng Israel,” sa halip na paikliin lamang bilang “mula sa Israel.”
- source_word: יִשְׁחַט
  choice: kumatay
  rationale: Ang “kumatay” ang natural na salitang Filipino para sa pagpatay ng hayop para sa pagkain o paghahandog at mas tiyak kaysa sa pangkalahatang “pumatay.”
- source_word: שׁוֹר
  choice: baka
  rationale: Ang salita ay tumutukoy sa isang hayop na mula sa mga bakahan at hindi kinakailangang lalaking toro; ang “baka” ang angkop na pangkalahatang katawagan sa Filipino.
- source_word: כֶשֶׂב
  choice: tupa
  rationale: Tumutukoy ito sa tupa sa pangkalahatan at hindi kinakailangang batang tupa.
- source_word: עֵז
  choice: kambing
  rationale: Ito ang karaniwang katumbas sa Filipino para sa hayop na binabanggit sa konteksto ng paghahandog.
- source_word: בַּמַּחֲנֶה
  choice: sa loob ng kampo
  rationale: Malinaw at natural nitong ipinapahayag ang lokasyong nasa kampo, kasalungat ng kasunod na “sa labas ng kampo.”
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Ito ang natural na salin ng lokasyong nasa labas ng hangganan ng kampo.
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: na ... o
  rationale: Naipapakita ng “na” at “o” ang dalawang magkatumbas na posibilidad sa batas nang hindi nagiging paulit-ulit o di-natural sa Filipino.
- source_word: '[implicit object after second יִשְׁחַט]'
  choice: kumatay nito
  rationale: Ipinahihiwatig ng Hebreo na ang ikalawang pandiwa ay may parehong layon na hayop; nililinaw ito ng “nito” nang walang idinaragdag na bagong kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan ng Israel” upang mapanatili ang pambansa at tipanang idyoma, at ang gitling sa hulihan upang ipakitang nagpapatuloy ang pangungusap sa susunod na talata.
