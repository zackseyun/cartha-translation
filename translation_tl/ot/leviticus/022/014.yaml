  source_fidelity: 'Tumpak ang pangunahing diwa: ang kaso ay di-sinasadyang pagkain ng kodesh, ang obligasyong magdagdag ng ikalimang bahagi, at ang pagbibigay nito sa pari. Gayunman, ang “makakain” ay mas tunog panghinaharap o kakayahan kaysa sa aktuwal na kasong legal na ipinahahayag ng Hebreong pandiwa; mas tapat at natural ang “kumain nang hindi sinasadya.” Ang talababa c ay nagdaragdag ng “halaga” at “bilang kabayaran,” na hindi tahasang sinasabi ng talata.'
  naturalness: Mas natural sa modernong Tagalog ang ayos na “Kung ang isang tao ay kumain nang hindi sinasadya ng banal na bagay.” Ang “dagdagan ito ng ikalimang bahagi” ay malinaw at idiomatiko, habang pinananatili ang relasyon ng karagdagang ikalimang bahagi sa bagay na banal.
  terminology: Ang “banal na bagay” ay katanggap-tanggap na malawak na katumbas ng קֹדֶשׁ at ang pag-uulit nito sa hulihan ay maayos. Ang “pari” ay wastong katumbas ng כֹּהֵן. Inayos ang paliwanag sa talababa tungkol sa “pagkain o ari-arian” at nilimitahan ang talababa c sa impormasyong sinusuportahan ng teksto.
