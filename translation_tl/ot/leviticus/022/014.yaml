base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: tl
  text: Kung ang isang tao[a] ay kumain nang hindi sinasadya ng banal na bagay[b], dapat niyang dagdagan ito ng ikalimang bahagi[c] at ibigay sa pari ang banal na bagay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang lalaki”; ang Hebreong אִישׁ ay panlalaking isahan ngunit maaaring gamitin sa pangkalahatang pormulang legal.
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy sa pagkain o ari-ariang itinalaga bilang banal at nakalaan sa paggamit ng mga pari.
    reason: cultural_note
  - marker: c
    text: Isang ikalimang bahagi nito, o dalawampung porsiyento.
    reason: clarification
lexical_decisions:
- source_word: וְאִישׁ
  choice: ang isang tao
  rationale: Ang אִישׁ ay panlalaking isahan sa anyo, ngunit sa pormulang legal maaari itong tumukoy sa sinumang tao. Natural sa modernong Tagalog ang “isang tao,” habang nililinaw sa talababa ang literal na anyo.
- source_word: כִּי
  choice: kung
  rationale: Nagpapakilala ito ng kondisyong legal; ang “kung” ang natural na katumbas sa Tagalog.
- source_word: יֹאכַל
  choice: makakain
  rationale: Sa kondisyong legal, ipinahahayag ng pandiwa ang maaaring mangyaring kaso. Ang “makakain” ay angkop sa hindi sinasadyang pagkain.
- source_word: קֹדֶשׁ
  choice: isang bagay na banal
  rationale: Pinananatili nito ang lawak ng קֹדֶשׁ at hindi nililimitahan sa pagkain lamang, bagaman ang konteksto ay isang bagay na maaaring kainin at nakalaan sa banal na gamit.
- source_word: בִּשְׁגָגָה
  choice: hindi sinasadya
  rationale: Ipinahihiwatig nito ang pagkilos dahil sa pagkakamali o kawalang-malay, hindi ang sadyang pagsuway.
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: dapat niyang dagdagan iyon ng ikalimang bahagi
  rationale: Ipinapahayag ng “dapat” ang preskriptibong puwersa ng batas. Ang ikalimang bahagi ay idinaragdag sa halaga ng banal na bagay bilang kabayaran.
- source_word: וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ
  choice: at ibigay sa pari ang banal na bagay
  rationale: Pinananatili ang pandiwang “ibigay” at ang pag-uulit ng קֹדֶשׁ, gaya ng Hebreo, nang hindi labis na tinutukoy kung bagay o katumbas na halaga ang ibinabalik.
theological_decisions:
- issue: Panlalaking isahan bilang pormulang legal
  choice: “ang isang tao” sa pangunahing teksto, na may talababa sa literal na “isang lalaki”
  alternative: “ang isang lalaki”
  rationale: Maaaring gumana nang pangkalahatan ang אִישׁ sa batas. Ang “isang tao” ay natural at hindi nagpapalagay na babae ay hindi saklaw, habang ang talababa ay nagpapanatili ng kaalaman sa anyong Hebreo.
- issue: Kalikasan ng banal na bagay at kabayaran
  choice: Panatilihin ang malawak na “bagay na banal” at “banal na bagay”
  alternative: “banal na pagkain” o “banal na bahagi”
  rationale: Ang קֹדֶשׁ ay mas malawak kaysa “pagkain” o “bahagi.” Hindi tahasang nilulutas ng talata kung mismong bagay o katumbas na halaga nito ang ibinibigay, kaya hindi ito pinakikitid sa salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “dapat” upang natural na maipahayag ang obligasyong legal, at iniwasan ang teknikal o makalumang pananalita. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
