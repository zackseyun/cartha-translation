  yaml_path: translation/ot/leviticus/022/029.yaml
  text: And when you sacrifice a thank offering to Yahweh[a], you shall sacrifice it for your acceptance.
translation:
  language: tl
  text: At kapag maghahandog kayo kay Yahweh ng handog na pasasalamat, ihandog ninyo ito upang maging katanggap-tanggap para sa inyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang tanggapin kayo.”
    reason: Ipinatatalâ ang mas literal na pagbasa na maaaring magtuon sa mga naghahandog, habang nililinaw ng pangunahing teksto ang karaniwang sakripisyal na kahulugang ang handog ay katanggap-tanggap alang-alang sa kanila.
lexical_decisions:
- source_word: וְ/כִי
  choice: At kapag
  rationale: Ipinagpapatuloy nito ang naunang tuntunin at inilalahad ang kalagayang saklaw ng utos; likas sa makabagong Tagalog ang temporal-kondisyonal na “kapag.”
- source_word: תִזְבְּחוּ
  choice: naghahandog kayo
  rationale: Sa kontekstong pansakripisyo, malinaw at natural ang “maghandog”; hindi nito nililimitahan ang kilos sa pagkatay lamang.
- source_word: זֶבַח תּוֹדָה
  choice: handog na pasasalamat
  rationale: Ipinapakita nito ang handog bilang isang uri ng hain na may katangiang pasasalamat, sa payak ngunit marangal na Filipino.
- source_word: לַ/יהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה; ang “kay” ang natural na pananda para sa pinag-uukulan ng handog.
- source_word: לִֽ/רְצֹנְ/כֶם
  choice: upang tanggapin kayo
  rationale: Sa kontekstong kultiko, ang רָצוֹן ay tumutukoy sa pagtanggap o pagiging kalugud-lugod sa Diyos. Pinananatili ng parirala ang kaugnayan ng pagtanggap sa mga naghahandog, bagaman maaari ring unawain na ang handog ang tinatanggap para sa kanila.
- source_word: תִּזְבָּחוּ
  choice: ihandog ninyo iyon
  rationale: Pinananatili ang pag-uulit ng pandiwang Hebreo bilang diin sa wastong paghahandog; ang “iyon” ay tumutukoy sa handog na pasasalamat.
theological_decisions:
- issue: Paglalarawan sa לִרְצֹנְכֶם
  choice: upang tanggapin kayo
  alternative: upang tanggapin iyon para sa inyo / ayon sa inyong kagustuhan
  rationale: Sa mga tuntunin tungkol sa paghahandog, mas malamang na tumutukoy ang parirala sa pagtanggap ng Diyos kaysa sa pansariling kagustuhan ng naghahandog. Gayunman, hindi ganap na tahasang sinasabi ng Hebreo kung ang binibigyang-diin ay ang pagtanggap sa mga tao o sa handog para sa kanila, kaya itinala ang ambiguwidad sa talababa.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang pinananatili ang personal na pangalang makikita sa tekstong Hebreo nang hindi pinapalitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang bokabularyong pansamba nang hindi nagiging arkaiko; pinanatili ang pag-uulit ng pandiwa sa Hebreo at ang tunay na ambiguwidad ng huling parirala.
