  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: tl
  text: Huwag kayong maghandog ng anumang may kapintasan[a], sapagkat hindi iyon tatanggapin para sa inyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang may depekto.” Ang salitang Hebreo ay karaniwang tumutukoy sa pisikal na kapintasan na nag-aalis sa pagiging karapat-dapat ng isang handog.
    reason: lexical_alternative
  - marker: b
    text: O “hindi iyon magiging katanggap-tanggap alang-alang sa inyo.”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: anumang may kapintasan
  rationale: Likas at komprehensibong pagpapahayag ito sa Tagalog na nagpapanatili sa ganap na pagbabawal ng Hebreong parirala.
- source_word: מוּם
  choice: kapintasan
  rationale: Tumutukoy ito sa pisikal na depekto na maaaring magpawalang-bisa sa isang hayop bilang handog; ang “kapintasan” ay malinaw at angkop sa kontekstong panghandog.
- source_word: לֹא תַקְרִיבוּ
  choice: Huwag kayong maghandog
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay tumutukoy sa paglapit o paghaharap ng isang bagay bilang handog. Natural sa modernong Tagalog ang “maghandog” at malinaw ang ritwal na konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal at pinananatili ang marangal na estilong pambatas.
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: hindi iyon tatanggapin para sa inyo
  rationale: Ipinahahayag nito ang hindi pagtanggap sa handog habang pinananatili ang לָכֶם, na maaaring tumukoy sa pagtanggap para sa kapakanan o sa ngalan ng naghahandog.
theological_decisions:
- issue: Wikang tumutukoy sa ritwal na pagtanggap
  choice: hindi iyon tatanggapin para sa inyo
  alternative: hindi iyon magiging katanggap-tanggap alang-alang sa inyo
  rationale: Pinananatili ng pangunahing salin ang diwa ng pagtanggap ng Diyos sa handog at ang kaugnayan nito sa naghahandog, nang hindi nagdaragdag ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa estilong pambatas. Ginamit ang pangmaramihang “kayo” ayon sa pandiwang Hebreo; iniwasan ang sobrang teknikal na pananalita habang pinanatili ang kahulugang pansakripisyo.
