base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: tl
  text: At kung ang isang lalaki ay maghahandog kay Yahweh ng haing pangkapayapaan[a] upang tuparin ang isang panata[b], o bilang kusang-loob na handog, mula sa mga baka o kawan ng tupa at kambing, ang hayop ay dapat walang kapintasan upang maging katanggap-tanggap[c]; hindi ito dapat magkaroon ng anumang depekto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang katawagang Hebreo ay nasa anyong maramihan at tradisyonal na isinasaling “mga handog pangkapayapaan.” Isinasalin naman ito ng ilan bilang “mga handog ng pakikipag-isa.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “upang isagawa ang isang panata” o “upang tuparin ang ipinangakong handog.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “upang tanggapin” o “upang kalugdan.”
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: At kung may lalaking
  rationale: Pinananatili ang panlalaking isahang legal na paksa ng אִישׁ, habang ang כִּי kasama ng pandiwang di-ganap ay ipinapahayag bilang kondisyong “kung.”
- source_word: יַקְרִיב
  choice: maghahandog
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay tumutukoy sa pagdadala o paghahain ng handog; natural at tumpak sa Filipino ang “maghahandog.”
- source_word: זֶבַח שְׁלָמִים
  choice: haing pangkapayapaan
  rationale: Pinananatili nito ang uri ng hain na tinutukoy ng שְׁלָמִים at ang ugnayang leksikal nito sa kapayapaan, nang hindi ipinapalagay na “pakikipag-isa” lamang ang kahulugan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” ayon sa tuwirang anyo ng tekstong Hebreo.
- source_word: לְפַלֵּא נֶדֶר
  choice: upang tuparin ang isang panata
  rationale: Sa legal na konteksto ng paghahandog, tumutukoy ang parirala sa pagsasakatuparan o pagtupad sa ipinangakong handog.
- source_word: אוֹ לִנְדָבָה
  choice: o bilang kusang-loob na handog
  rationale: Malinaw na ipinakikita ang kaibahan ng boluntaryong handog sa handog na bunga ng panata.
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: mula sa bakahan o sa kawan
  rationale: 'Tinutukoy ang dalawang malawak na pangkat ng alagang hayop na maaaring ihandog: malalaking hayop mula sa bakahan at maliliit na hayop mula sa kawan.'
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Sa batas ng paghahain, nangangahulugan itong walang pisikal na kapansanan o kapintasan na makapagpapawalang-bisa sa hayop bilang handog.
- source_word: לְרָצוֹן
  choice: upang ito'y tanggapin
  rationale: Ipinahahayag ang layunin o resultang pagiging katanggap-tanggap ng handog, habang inilalagay sa talababa ang saklaw na maaari ring may diwang pagkalugod.
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: hindi ito dapat magkaroon ng anumang depekto
  rationale: Pinananatili ang ganap na pagbabawal sa anumang pisikal na depektong makikita sa hayop.
theological_decisions:
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang tipan ang nasa tekstong Hebreo; ang “Yahweh” ang tuwirang transliterasyong naaayon sa pinagmulan.
- issue: Panlalaking legal na paksa na אִישׁ
  choice: may lalaking
  alternative: sinuman; isang tao
  rationale: Pinananatili ang panlalaking isahang anyo ng kinatawang legal na pormulasyon sa Hebreo, nang hindi ginagawang neutral ang kasarian.
- issue: Kahulugan ng שְׁלָמִים
  choice: haing pangkapayapaan
  alternative: handog ng pakikipag-isa
  rationale: Hindi nililimitahan ang mayamang kahulugan ng termino sa isang interpretasyong teolohikal lamang; pinananatili ang leksikal na kaugnayan nito sa kapayapaan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang karaniwang bokabularyong pansakripisyo—“hain,” “handog,” “panata,” at “walang kapintasan”—at iniwasan ang labis na teknikal o sektaryang pananalita.
