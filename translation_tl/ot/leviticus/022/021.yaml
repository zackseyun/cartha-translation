revisions:
- from: At kung may lalaking maghahandog kay Yahweh ng haing pangkapayapaan[a] upang tuparin ang isang panata[b], o bilang kusang-loob na handog, mula sa bakahan o sa kawan, dapat itong walang kapintasan upang ito'y tanggapin[c]; hindi ito dapat magkaroon ng anumang depekto.
  to: At kung ang isang lalaki ay maghahandog kay Yahweh ng haing pangkapayapaan[a] upang tuparin ang isang panata[b], o bilang kusang-loob na handog, mula sa mga baka o kawan ng tupa at kambing, ang hayop ay dapat walang kapintasan upang maging katanggap-tanggap[c]; hindi ito dapat magkaroon ng anumang depekto.
  rationale: Inayos ang kondisyunal na pormulasyon upang maging natural na modernong Filipino at pinalitan ang posibleng malabong “bakahan” ng mga katawagang tuwirang tumutukoy sa mga hayop. Ginawang tahasan ang “ang hayop” bilang paksa ng “walang kapintasan” upang hindi mapagkamalang ang naghahandog ang tinutukoy. Walang binagong kahulugan o idinagdag na teolohikal na interpretasyon.
