  text: Upang tanggapin ninyo ito, dapat ay lalaking hayop na walang kapintasan mula sa mga baka, mga tupa, o mga kambing.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: Upang tanggapin ito
  rationale: Ipinapahayag ang layunin ng handog—na ito ay maging katanggap-tanggap—sa natural na Tagalog, nang hindi ipinapalagay na tumutukoy ang parirala sa damdamin ng naghahandog.
- source_word: תָּמִים
  choice: walang kapintasan
  rationale: Sa konteksto ng mga hayop na inihahandog, tumutukoy ito sa pagiging buo at walang depektong makapagpapawalang-bisa sa handog; ito ang malinaw at nakaugaliang salin sa Tagalog.
- source_word: זָכָר
  choice: isang lalaki
  rationale: Tuwirang pinananatili ang hinihinging kasarian ng hayop.
- source_word: בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים
  choice: mula sa mga baka, mga tupa, o mga kambing
  rationale: Pinananatili ang tatlong uri ng alagang hayop at ginagawang malinaw sa Tagalog ang pagpipilian sa pamamagitan ng “o.”
theological_decisions:
- issue: Kahulugan ng לִרְצֹנְכֶם
  choice: Upang tanggapin ito
  alternative: Ayon sa inyong kagustuhan
  rationale: Sa batas tungkol sa handog, mas malamang na tumutukoy ang parirala sa pagiging katanggap-tanggap ng handog kaysa sa personal na kagustuhan ng naghahandog; hindi na idinagdag kung kanino ito tatanggapin sapagkat malinaw iyon sa konteksto.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “walang kapintasan” bilang natural at tiyak na pananalita para sa kwalipikasyon ng hayop na handog.
