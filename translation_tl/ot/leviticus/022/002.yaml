id: LEV.22.2
reference: Leviticus 22:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: tl
  text: Sabihin mo kay Aaron at sa kanyang mga anak na umiwas sila[a] sa mga banal na bagay ng mga anak ni Israel[b]—mga bagay na itinatalaga nila sa akin[c]—at huwag nilang lapastanganin ang aking banal na pangalan. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ihiwalay nila ang kanilang sarili” o “magpigil sila sa paglapit.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ang pormal na pananalita sa Hebreo; maaari ring isalin na “ang sambayanang Israel” o “ang mga Israelita.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, ang mga banal na bagay ang itinatalaga ng mga Israelita kay Yahweh.
    reason: clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Ang Piel imperative ng דבר ay isang tuwirang utos kay Moises na magsalita kina Aaron at sa kanyang mga anak. Likas at malinaw sa modernong Filipino ang “Sabihin mo.”
- source_word: וְיִנָּזְרוּ
  choice: umiwas sila
  rationale: Ang Niphal ng נזר ay nagpapahiwatig ng paglayo o pagpipigil sa sarili kaugnay ng mga banal na bagay. Ipinahahayag ng “umiwas” ang praktikal na diwa nang hindi dinaragdagan ang talata ng dahilan ng pag-iwas.
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: sa mga banal na bagay ng mga anak ni Israel
  rationale: Pinananatili ng “mga banal na bagay” ang malawak na saklaw ng קָדְשֵׁי; ang “mga handog” ay maaaring tama sa konteksto ngunit mas tiyak kaysa sa Hebreo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal na Hebreong katawagan sa bansang nagmula kay Israel, habang ang talababa ay nagbibigay ng mas idyomatikong alternatibo.
- source_word: יְחַלְּלוּ
  choice: lapastanganin
  rationale: Sa konteksto ng kabanalan, ang Piel ng חלל ay nangangahulugang gawing di-banal o lapastanganin. Ang salitang ito ay may angkop na bigat at malinaw sa kasalukuyang Filipino.
- source_word: שֵׁם קָדְשִׁי
  choice: aking banal na pangalan
  rationale: Tuwiran at likas na salin ito ng pariralang Hebreo at pinananatili ang kahalagahang tipan ng pangalan ng Diyos.
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: mga bagay na itinatalaga nila sa akin
  rationale: Ang sugnay ay inuugnay sa “mga banal na bagay,” na siyang itinatalaga ng Israel sa Diyos. Ang “itinatalaga” ay natural na Filipino para sa pagkakaloob o pagbubukod bilang banal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Tinutukoy ng sugnay na אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: Ang sugnay ay tumutukoy sa “mga banal na bagay” na itinatalaga ng mga Israelita kay Yahweh.
  alternative: Maaaring iugnay sa daloy ng pangungusap ang sugnay sa “aking banal na pangalan,” bagaman hindi ito ang mas malamang na pagbasa.
  rationale: Ang konteksto at kilos ng “pagtatalaga” ay mas likas na tumutukoy sa mga banal na bagay. Inilipat ang paliwanag na sugnay katabi ng tinutukoy nito upang maiwasan ang maling pag-unawa sa Filipino, at itinala sa talababa ang ugnayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bokabularyo ng kabanalan sa “mga banal na bagay,” “itinatalaga,” at “lapastanganin.” Ang gitling na mahaba ay naglalapit sa pantulong na sugnay sa wastong tinutukoy nito nang hindi ginagawang hiwalay na paliwanag ang diwa ng talata.
