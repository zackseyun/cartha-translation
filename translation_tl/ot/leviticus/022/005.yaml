base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: tl
  text: o isang lalaking humipo sa anumang gumagapang na nilalang na nagdudulot ng karumihan sa kanya[a], o sa isang taong nagdudulot ng karumihan sa kanya[b], anuman ang karumihan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “anumang nilalang na nagsisiksikan.” Ang salitang Hebreo ay tumutukoy sa maliliit na nilalang na maraming gumagalaw o gumagapang malapit sa lupa.
    reason: lexical_alternative
  - marker: b
    text: Ang mga panlalaking anyong isahan sa Hebreo ay ginagamit dito sa pangkalahatang diwang legal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: o
  rationale: Karaniwang pangatnig na nagpapakilala ng isa pang maaaring kalagayan sa nagpapatuloy na talaan.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking anyong isahan ng Hebreo, bagaman pangkalahatan ang gamit nito sa kontekstong legal.
- source_word: יִגַּע
  choice: humipo
  rationale: Tuwirang salin ng pandiwang נגע at likas na pananalita sa mga tuntunin tungkol sa ritwal na karumihan.
- source_word: בְּכָל שֶׁרֶץ
  choice: sa anumang gumagapang na nilalang
  rationale: Tumutukoy ang שֶׁרֶץ sa maliliit na nilalang na nagkukumpulan o kumikilos nang malapit sa lupa; hindi ito nililimitahan sa isang makabagong uring zoolohikal.
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: na makapagpaparumi sa kanya
  rationale: Ipinahahayag ang pinagmumulan o paraang nagdudulot ng ritwal na karumihan habang nananatiling natural sa Filipino.
- source_word: בְאָדָם
  choice: sa isang tao
  rationale: Ang אָדָם ay tumutukoy rito sa isang taong maaaring pagmulan ng karumihan; ang “tao” ay angkop sa pangkalahatang legal na diwa.
- source_word: לְכֹל טֻמְאָתוֹ
  choice: anuman ang karumihan nito
  rationale: Pinananatili ang maikli at bahagyang malabong konstruksiyon ng Hebreo nang hindi tinutukoy nang higit sa teksto ang uri ng karumihan.
- source_word: טֻמְאָה
  choice: karumihan
  rationale: Karaniwang katawagan sa Filipino para sa ritwal na kalagayang tinutukoy ng mga batas sa Levitico at kaugnay ng pandiwang “magparumi.”
theological_decisions:
- issue: Kalikasan ng karumihang tinutukoy sa batas ng Levitico
  choice: Ginamit ang “marumi/karumihan” bilang katawagan sa ritwal na kalagayan.
  alternative: “di-dalisay/kawalan ng kadalisayan” o wikang nagpapahiwatig ng kasalanang moral
  rationale: Ang konteksto ay tungkol sa ritwal na kalinisan ng mga pari, kaya hindi dapat ipahiwatig na ang bawat ganitong karumihan ay pagkakasalang moral.
- issue: Tinutukoy ng panghalip sa “karumihan nito”
  choice: Pinanatili ang panghalip na maaaring tumukoy sa taong nahipo.
  alternative: Tahasan itong palawakin bilang “anumang uri ng karumihan ng taong iyon.”
  rationale: Siksik ang Hebreong לְכֹל טֻמְאָתוֹ; pinananatili ng salin ang ugnayan nito nang hindi labis na nililinaw ang sintaks.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makapagpaparumi” upang natural na ipahayag ang paglipat o pagkatamo ng ritwal na karumihan, at pinanatili ang pagkakaiba ng “isang lalaki” (אִישׁ) at “isang tao” (אָדָם).
