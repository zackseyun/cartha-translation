  source_fidelity: Tumpak sa kabuuan ang mga pangunahing termino at ang putol na sintaks ng talata. Gayunman, kulang ang pangatnig sa listahan ng mga pinag-uutosang kausapin, kaya lumalabas na tila appositive ang “ang kanyang mga anak na lalaki” kay Aaron sa halip na hiwalay na tagapakinig.
  naturalness: May malinaw na estruktural na problema sa “Kausapin mo si Aaron, ang kanyang mga anak na lalaki,” dahil wala itong “at.” Ang “Sabihin mo kay Aaron, sa kanyang mga anak na lalaki, at sa lahat...” ay mas likas para sa pormal at legal na rehistro ng Levitico.
  terminology: Ang “Yahweh,” “sambahayan ng Israel,” “mga anak ni Israel,” “kusang-loob na mga handog,” at “handog na sinusunog” ay angkop. Ang “dayuhang naninirahan” ay maingat na paglalarawan ng גֵּר; pinanatili ang kolektibong maramihan, na natural sa Tagalog.
