  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אִישׁ֩ מִ/בֵּ֨ית יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קָרְבָּנ/וֹ֙ לְ/כָל נִדְרֵי/הֶם֙ וּ/לְ/כָל נִדְבוֹתָ֔/ם אֲשֶׁר יַקְרִ֥יבוּ לַ/יהוָ֖ה לְ/עֹלָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: tl
  text: '“Sabihin mo kay Aaron, sa kanyang mga anak na lalaki, at sa lahat ng mga anak ni Israel[a]: Sinumang lalaki mula sa sambahayan ng Israel o mula sa mga dayuhang naninirahan sa Israel[b] na maghahandog ng kanyang handog bilang pagtupad sa alinman sa kanilang mga panata o bilang alinman sa kanilang kusang-loob na mga handog[c], na inihahandog nila kay Yahweh bilang handog na sinusunog—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lahat ng Israelita.” Literal na “lahat ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong גֵּר ay tumutukoy sa isang dayuhang naninirahan sa gitna ng Israel at nasa ilalim ng kaayusang panlipunan nito.
    reason: lexical_clarification
  - marker: c
    text: Maaari ring isalin na “alinman sa kanilang mga handog na panata at alinman sa kanilang kusang-loob na mga handog.” Maaaring mas tiyak na tumukoy ang Hebreo sa mga handog na kaugnay ng mga panata.
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: Kausapin mo
  rationale: Ang Piel imperative ay pormal na utos na magsalita sa mga tinukoy na tagapakinig; natural sa Tagalog ang “Kausapin mo” sa ganitong pormula.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na panlalaki ang Hebreo at tumutukoy sa mga anak ni Aaron sa kontekstong pangpari.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: lahat ng mga anak ni Israel
  rationale: Pinananatili ang wikang pangkamag-anakan ng Hebreo, habang nililinaw sa talababa ang mas idyomatikong “lahat ng Israelita.”
- source_word: אִישׁ אִישׁ
  choice: Sinumang lalaki
  rationale: Ang pag-uulit ay distributibo, “bawat lalaki” o “sinumang lalaki”; pinananatili rito ang panlalaking anyo ng tekstong legal.
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: mula sa sambahayan ng Israel
  rationale: Pinananatili ang mahalagang kolektibo at pangtipang pariralang “sambahayan ng Israel.”
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: mga dayuhang naninirahan sa Israel
  rationale: Ang גֵּר ay isang hindi katutubong taong naninirahan sa gitna ng Israel sa ilalim ng kaayusang panlipunan nito; ang maramihang anyo ay natural sa Tagalog para sa kolektibong saklaw.
- source_word: יַקְרִיב קָרְבָּנוֹ
  choice: maghahandog ng kanyang handog
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay pagdadala o paghahandog ng קָרְבָּן; ang pag-uulit ay katanggap-tanggap at malinaw sa Tagalog.
- source_word: לְכָל נִדְרֵיהֶם
  choice: bilang pagtupad sa alinman sa kanilang mga panata
  rationale: Ipinahahayag ang kaugnayan ng handog sa mga panata nang hindi lubusang tinutukoy kung ang pangngalan mismo ay “mga handog na panata.”
- source_word: נִדְבוֹתָם
  choice: kanilang kusang-loob na mga handog
  rationale: Ito ang malinaw at likas na salin ng teknikal na kategorya ng boluntaryong handog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: לְעֹלָה
  choice: bilang handog na sinusunog
  rationale: Tumutukoy ang עֹלָה sa handog na ganap na sinusunog; malinaw at pangkaraniwan ang pariralang ito sa modernong Tagalog.
theological_decisions:
- issue: Panlalaking kinatawang pananalita sa tagubiling legal
  choice: Sinumang lalaki
  alternative: Sinuman
  rationale: Ginagamit ng Hebreo ang distributibong panlalaking אִישׁ אִישׁ. Pinananatili ang anyong ito nang hindi nagdaragdag ng limitasyong wala sa konteksto.
- issue: Paglalarawan sa גֵּר
  choice: mga dayuhang naninirahan sa Israel
  alternative: mga nakikipamayan sa Israel
  rationale: Nililinaw na ang tinutukoy ay mga hindi Israelitang residenteng kasama sa kaayusang panlipunan ng Israel, hindi basta pansamantalang bisita.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kaugnayan ng נדרים sa mga handog
  choice: bilang pagtupad sa alinman sa kanilang mga panata
  alternative: alinman sa kanilang mga handog na panata
  rationale: Maaaring tumukoy ang parirala sa mga panata sa pangkalahatan o, nang mas tiyak, sa mga handog na kaugnay ng panata. Pinananatili sa pangunahing teksto ang mas maluwag na pagbasa at itinatala ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na tonong legal at panrelihiyon. Pinanatili ang “mga anak ni Israel” at “sambahayan ng Israel” bilang mga pariralang pangkamag-anakan at pangtipan, ngunit ipinaliwanag ang mas idyomatikong kahulugan sa talababa. Pinanatili rin ang putol na pagtatapos na may gatlang sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
