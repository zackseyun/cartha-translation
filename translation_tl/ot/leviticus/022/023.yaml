  naturalness: Natural ang pangungusap, ngunit mas tuwiran at idiomatiko ang “handog na kusang-loob” at “bilang handog para sa isang panata.” Ang “masyadong mahaba o masyadong maikli” ay karaniwang modernong Filipino para sa pisikal na di-proporsiyon.
  terminology: Ang “handog na kusang-loob” ay malinaw para sa נְדָבָה. Ang “panata” ay wastong katumbas ng נֵדֶר. Pinanatili ang “biyas” para sa kongkretong pagbasa ng mga terminong Hebreo, habang ipinapakita ng talababa na hindi tiyak ang eksaktong anatomiya.
