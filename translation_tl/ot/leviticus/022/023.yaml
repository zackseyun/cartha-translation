base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: tl
  text: Ngunit ang isang baka o tupa na may biyas na masyadong mahaba o masyadong maikli—maaari mo itong ihandog bilang handog na kusang-loob[a], ngunit hindi ito tatanggapin bilang handog para sa isang panata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pangkalahatang diwa, “may kapinsalaan o bansot.” Malamang na inilalarawan ng mga salitang Hebreo ang magkasalungat na uri ng di-pantay na proporsiyon ng katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: ang toro
  rationale: Ang שׁוֹר ay tumutukoy sa hayop na baka; ang “toro” ay natural na tiyak na tawag sa isang lalaking baka sa konteksto ng paghahandog.
- source_word: וָשֶׂה
  choice: o tupa
  rationale: Ang שֶׂה ay isang hayop mula sa kawan at maaaring tupa o kambing; pinanatili ang karaniwang saling “tupa,” habang hindi ipinapasok ang ideya ng murang edad.
- source_word: שָׂרוּעַ וְקָלוּט
  choice: na may biyas na napakahaba o napakaikli
  rationale: Malamang na magkatunggaling uri ng di-pantay na proporsiyon ng katawan ang dalawang termino. Ginagawang kongkreto ng “biyas” ang malamang na diwa, habang inilalahad sa talababa ang mas pangkalahatang posibilidad.
- source_word: נְדָבָה
  choice: kusang-loob na handog
  rationale: Tumutukoy ito sa handog na ibinibigay nang kusa at hindi dahil sa isang umiiral na panata o pananagutan.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: maaari mo itong ihandog bilang
  rationale: Bagaman literal na “gawin mo ito,” sa konteksto ng paghahandog ay likas sa Filipino ang “ihandog bilang,” at malinaw nitong ipinapahayag ang gamit ng hayop.
- source_word: וּלְנֵדֶר
  choice: ngunit bilang handog sa pagtupad ng panata
  rationale: Nililinaw nito na ang hayop ay iniaalay kaugnay ng isang panatang dapat tuparin, salungat sa kusang-loob na handog.
- source_word: לֹא יֵרָצֶה
  choice: ay hindi ito tatanggapin
  rationale: Sa kontekstong panghandog, ang Niphal ng רצה ay tumutukoy sa pagtanggap nang may pagsang-ayon; ang “hindi ito tatanggapin” ay natural at tumpak.
theological_decisions:
- issue: Eksaktong uri ng kapintasang inilalarawan ng שָׂרוּעַ at קָלוּט
  choice: Isinalin bilang biyas na napakahaba o napakaikli.
  alternative: May kapinsalaan o bansot; o may bahagi ng katawang hindi pantay ang laki.
  rationale: Tila inilalarawan ng pares ang magkasalungat na anyo ng di-pantay na proporsiyon, ngunit hindi ganap na tiyak ang eksaktong anatomiya. Pinanatili sa pangunahing teksto ang kongkretong malamang na diwa at sa talababa ang tunay na leksikal na kawalang-katiyakan.
- issue: Pagkakaiba ng kusang-loob na handog at handog na kaugnay ng panata
  choice: 'Pinanatili ang malinaw na kaibahan: maaari para sa kusang-loob na handog ngunit hindi para sa pagtupad ng panata.'
  alternative: Gamitin lamang ang mas maikling “para sa isang panata.”
  rationale: Ang mas buong parirala sa Filipino ay nagpapalinaw sa kultikong gamit nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kusang-loob na handog” bilang madaling maunawaang terminong panghandog; iniwasan ang mas teknikal at di-pamilyar na bokabularyo. Ang talababa [a] ay nakamarka mismo sa pangunahing teksto.
