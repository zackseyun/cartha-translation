  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: tl
  text: Kaya sundin ninyo ang mga utos ko at isagawa ninyo ang mga ito. Ako si Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasalin bilang “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo at ang tradisyonal na alternatibong salin ng banal na pangalan.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kaya tuparin ninyo
  rationale: Sa kontekstong legal at tipan, ang שׁמר ay nangangahulugang ingatan, sundin, o tuparin. Likas sa makabagong Tagalog ang “tuparin” para sa mga utos, at ipinahihiwatig ng “Kaya” ang kaugnayan nito sa naunang pahayag.
- source_word: מִצְוֺתַי
  choice: ang mga utos ko
  rationale: Ang מִצְוָה ay utos o kautusan. Malinaw at natural sa karaniwang Tagalog ang “mga utos ko” habang pinananatili ang tonong legal at pangtipan.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: at gawin ang mga iyon
  rationale: Literal na ipinapahayag ng עשה ang paggawa sa mga utos. Pinananatili ang hiwalay na ikalawang pandiwa upang hindi mawala ang sinadyang tambalan ng pag-iingat/pagtupad at paggawa.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang mariing pormula ng pagpapakilala sa sarili at tuwirang isinasatitik ang pangalang tipan na יהוה bilang “Yahweh.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang natatanging pangalang tipan sa halip na palitan ng titulo.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Ginamit ang pangmaramihang “ninyo” ayon sa mga pandiwang Hebreo; pinanatili ang dalawang magkaugnay ngunit hiwalay na kilos: tuparin at gawin.'
