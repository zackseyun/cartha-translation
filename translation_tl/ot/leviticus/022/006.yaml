base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: tl
  text: Ang sinumang humipo rito ay magiging marumi sa ritwal hanggang gabi at hindi kakain ng alinman sa mga banal na bagay[a] malibang nahugasan na niya sa tubig ang kanyang katawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banal na handog” o “mga bagay na itinalaga.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nahugasan na niya ang kanyang laman sa tubig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: ang sinuman
  rationale: Sa kontekstong legal, tumutukoy ito sa isang tao, hindi sa hiwalay na di-materyal na “kaluluwa.” Likas at pangkalahatan sa kasarian ang “ang sinuman.”
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: humipo rito
  rationale: Ang anyong pambabae ng pandiwa ay umaayon sa gramatikal na kasarian ng נֶפֶשׁ, hindi sa kasarian ng tao. Pinananatili ng “rito” na hindi tiyak kung tao o bagay ang pinagmumulan ng karumihan na binanggit sa naunang konteksto.
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: ay magiging marumi hanggang gabi
  rationale: Ipinapahayag nito ang nagresultang kalagayang ritwal at ang tagal nito. Malinaw sa konteksto na ritwal, hindi moral, ang karumihan.
- source_word: וְלֹא יֹאכַל
  choice: at hindi kakain
  rationale: Ang di-ganap na pandiwa sa batas ay nagpapahayag ng pagbabawal o legal na kahihinatnan; pinananatili ng payak na hinaharap ang mariing tono nang hindi nagiging lipas ang pananalita.
- source_word: מִן הַקֳּדָשִׁים
  choice: ng alinman sa mga banal na bagay
  rationale: Ipinahihiwatig ng מִן ang bahaging kinukuha mula sa kabuuan, kaya “alinman sa.” Ang “mga banal na bagay” ay malawak na salin na hindi labis na nagtatakda kung mga handog o mga pagkaing itinalaga ang tinutukoy.
- source_word: כִּי אִם
  choice: malibang
  rationale: Ipinakikilala ng idyoma ang kundisyong kailangang matupad bago siya maaaring kumain.
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: hugasan niya ng tubig ang kanyang katawan
  rationale: Literal na “laman” ang בָּשָׂר, ngunit tumutukoy ito rito sa buong pisikal na katawan. Natural at malinaw sa modernong Filipino ang “katawan,” habang inilalagay sa talababa ang literal na anyo.
theological_decisions:
- issue: Kalikasan ng karumihan
  choice: karumihang ritwal
  alternative: karumihang moral
  rationale: Ang talata ay tungkol sa pagiging karapat-dapat sa ritwal na kumain ng mga banal na bagay matapos humipo sa pinagmumulan ng karumihan at maghugas. Hindi idinaragdag ng salin ang ideya ng kasalanang moral na hindi tahasang sinabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal at panritwal. Ginamit ang “sinuman” upang maging pangkalahatan sa kasarian, at iniwasan ang mga salitang maaaring magpahiwatig na moral na pagkakasala ang ritwal na karumihan.
