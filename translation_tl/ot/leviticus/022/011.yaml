base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: tl
  text: Ngunit kung bumili ang isang pari ng isang tao bilang kanyang pag-aari sa pamamagitan ng kanyang salapi[a], maaaring kumain ang taong iyon mula sa banal na pagkain, at maaari ring kumain ang mga ipinanganak sa sambahayan ng pari ng pagkain ng pari[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang tao, isang pag-aaring binili sa pamamagitan ng kanyang salapi”—samakatuwid, isang taong binili niya bilang pag-aari.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tinapay ng pari.” Dito, malamang na tumutukoy ang “tinapay” nang mas malawak sa pagkaing nakalaan sa pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: Ngunit kung ... ang isang pari
  rationale: Ipinagpapatuloy ng וְ ang magkakaugnay na mga tuntunin at ipinakikita rito ang kaibahan sa naunang kaso; ang כִּי ay nagpapakilala ng isang kondisyong legal.
- source_word: יִקְנֶה נֶפֶשׁ
  choice: bumili ... ng isang tao
  rationale: Ang קנה rito ay tumutukoy sa pagtatamo sa pamamagitan ng pagbili, at ang נֶפֶשׁ ay isang taong buháy, hindi isang kaluluwang hiwalay sa katawan.
- source_word: קִנְיַן כַּסְפּוֹ
  choice: bilang pag-aari gamit ang sarili niyang salapi
  rationale: Pinananatili nito ang malinaw na dimensiyon ng pagmamay-ari at pagbili sa pariralang Hebreo sa halip na palambutin iyon bilang pangkaraniwang paglilingkod.
- source_word: הוּא יֹאכַל בּוֹ
  choice: maaaring kumain ang taong iyon mula sa banal na pagkain
  rationale: Ang הוּא ay tumutukoy sa taong binili. Nilinaw ang ipinahihiwatig na banal na pagkain mula sa konteksto upang maiwasan ang malabong panghalip sa natural na Tagalog.
- source_word: וִילִיד בֵּיתוֹ
  choice: ang mga ipinanganak sa sambahayan ng pari
  rationale: Ang parirala ay tumutukoy nang kolektibo sa mga ipinanganak sa loob ng kanyang sambahayan; sinusuportahan ito ng kasunod na pangmaramihang panghalip at pandiwa.
- source_word: הֵם יֹאכְלוּ
  choice: maaari ring kumain
  rationale: Sa legal na konteksto, ang anyong pandiwa ay nagpapahayag ng pahintulot na makibahagi sa pagkain.
- source_word: בְלַחְמוֹ
  choice: sa kanyang pagkain
  rationale: Bagaman literal na 'tinapay' ang לֶחֶם, maaari itong tumukoy nang mas malawak sa pagkaing nakalaan sa pari.
theological_decisions:
- issue: Paglalarawan sa taong binili bilang pag-aari
  choice: bilang pag-aari gamit ang sarili niyang salapi
  alternative: binili gamit ang sarili niyang salapi
  rationale: Pinananatili ng salin ang legal na katayuang ipinahahayag ng קִנְיַן כַּסְפּוֹ nang hindi ito pinapahina o ipinagtatanggol.
- issue: Tinutukoy ng panghalip na הוּא
  choice: ang taong iyon
  alternative: siya
  rationale: Malamang na ang taong binili ang tinutukoy at siyang pinahihintulutang kumain; nililinaw ito ng salin nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino; ginamit ang “sambahayan” para sa legal at panlipunang diwa ng בַּיִת, at tahasang inulit ang “pari” upang maging malinaw ang mga tinutukoy ng mga panghalip.
