  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: tl
  text: Ang anumang hayop na bulag, may nabaling bahagi ng katawan, may bahaging naputol, o may kulugo, langib, o sakit sa balat—huwag ninyong iharap ang mga iyon kay Yahweh. Huwag din kayong maglagay ng alinman sa mga iyon sa altar bilang handog na pagkain[a] kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog na pinaraan sa apoy” o “handog na apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: bulag
  rationale: Tuwirang inilalarawan ang kapansanan ng hayop at likas sa modernong Tagalog.
- source_word: שָׁבוּר
  choice: bali ang buto
  rationale: Ipinahahayag ang pisikal na pagkabali nang mas malinaw kaysa sa payak na “bali.”
- source_word: חָרוּץ
  choice: may bahaging naputol
  rationale: Ipinapakita ang malubhang kapinsalaang dulot ng paghiwa o pagputol nang hindi nililimitahan sa isang tiyak na bahagi ng katawan.
- source_word: יַבֶּלֶת
  choice: kulugo
  rationale: Karaniwan at malinaw na katumbas ng abnormal na tumubo sa balat.
- source_word: גָרָב
  choice: langib
  rationale: Kongkretong katawagan sa nakikitang sakit o sugat sa balat, habang iniiwasan ang labis na tiyak na diagnosis.
- source_word: יַלֶּפֶת
  choice: sakit sa balat
  rationale: Hindi tiyak ang eksaktong karamdamang tinutukoy; pinananatili ng pangkalahatang salin ang kawalang-katiyakang leksikal.
- source_word: תַקְרִיבוּ
  choice: iharap
  rationale: Ang Hiphil ng קרב sa kontekstong pansakripisyo ay tumutukoy sa pagdadala o paghaharap ng handog sa Diyos.
- source_word: וְאִשֶּׁה
  choice: handog na pagkain
  rationale: Akma sa gamit ng terminong pansakripisyo sa Levitico, ngunit inilalahad sa talababa ang tradisyonal na pag-uugnay nito sa apoy.
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: maglagay ng alinman sa mga iyon sa altar
  rationale: Natural na Tagalog na nagpapanatili sa distributibong diwa ng מֵהֶם at sa kongkretong kilos na ipinagbabawal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh at ang natural na panandang Tagalog para sa pinatutungkulan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng אִשֶּׁה sa wikang pansakripisyo
  choice: handog na pagkain
  alternative: handog na pinaraan sa apoy; handog na apoy
  rationale: Maaaring tumukoy ang termino sa handog na inihahain sa Diyos at tinutupok sa apoy. Ginamit ang malinaw na pangunahing salin, habang pinananatili sa talababa ang mahalagang alternatibo.
translation_notes:
  register: 'Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Idinagdag ang “hayop” bilang malinaw na tinutukoy ng listahan sa konteksto. Pinanatili ang dalawang magkaugnay ngunit magkahiwalay na pagbabawal: ang paghaharap kay Yahweh at ang paglalagay sa altar.'
