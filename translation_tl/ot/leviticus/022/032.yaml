source:
  edition: WLC
  text: וְ/לֹ֤א תְחַלְּלוּ֙ אֶת שֵׁ֣ם קָדְשִׁ֔/י וְ/נִ֨קְדַּשְׁתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: tl
  text: Huwag ninyong lapastanganin ang aking banal na pangalan, at ituturing akong banal[a] sa gitna ng mga anak ni Israel.[b] Ako si Yahweh na nagpapabanal sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mahahayag akong banal” o “kikilalanin akong banal.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ay karaniwang katawagan sa Hebreo para sa sambayanan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: lapastanganin
  rationale: Ipinahihiwatig ng Piel ng חלל ang paglapastangan o pagtrato bilang karaniwan sa isang bagay na banal. Likas at malinaw sa modernong Filipino ang “lapastanganin” at pinananatili nito ang bigat na panrelihiyon ng salita.
- source_word: שֵׁם קָדְשִׁי
  choice: aking banal na pangalan
  rationale: Natural na salin ito ng pariralang Hebreo at pinananatili ang parehong konsepto ng pangalan at kabanalan.
- source_word: וְנִקְדַּשְׁתִּי
  choice: ituturing akong banal
  rationale: 'Ang Niphal ng קדשׁ ay maaaring pasibo o may refleksibong diwa: si Yahweh ay kikilalanin, ituturing, o mahahayag bilang banal. Ang saling ito ay natural sa Filipino at hindi ipinahihiwatig na may nagdaragdag ng kabanalan sa Diyos.'
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Pinananatili nito ang lokatibong diwa ng Hebreo habang nananatiling malinaw at karaniwan sa Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at sa tradisyonal na biblikal na pananalita; nililinaw sa talababa na tumutukoy ito sa sambayanan ng Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מְקַדִּשְׁכֶם
  choice: nagpapabanal sa inyo
  rationale: Ipinahahayag ng participle ang patuloy o katangiang pagkilos ni Yahweh. Pinananatili rin ng “nagpapabanal” ang ugnayang leksikal nito sa קדשׁ sa naunang sugnay.
theological_decisions:
- issue: Pagpapakahulugan sa וְנִקְדַּשְׁתִּי
  choice: ituturing akong banal
  alternative: ako ay pababanalin / mahahayag akong banal / kikilalanin akong banal
  rationale: Pinananatili ng napiling pasibong pahayag ang tensiyon ng Niphal nang hindi ipinahihiwatig na nagiging mas banal ang Diyos. Inilalagay sa talababa ang iba pang lehitimong pagbasa.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo, kaya pangalan din ang ginamit sa salin sa halip na isang pamalit na titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: sambayanan ng Israel / mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pormal na larawan ng Hebreo, habang nililinaw sa talababa na karaniwang tawag ito sa buong bayang Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang “ninyo/inyo” ayon sa mga pandiwang maramihan sa Hebreo. Iniwasan ang labis na teknikal na “sasantipikahin,” ngunit pinanatili ang magkakaugnay na bokabularyo ng kabanalan sa “banal” at “nagpapabanal.”
