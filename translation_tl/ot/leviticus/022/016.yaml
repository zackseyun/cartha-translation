  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: tl
  text: at sa gayon ay ipapasan sa kanila ang pananagutang nangangailangan ng kabayaran dahil sa pagkain nila ng kanilang mga banal na handog,[a][b] sapagkat ako si Yahweh na nagpapabanal sa kanila.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapataw sa kanila ng pagkakasala.” Mahirap ang pahayag sa Hebreo at maaaring idiin ang pananagutang dulot ng isang pagkakasalang nangangailangan ng kabayaran.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanilang mga banal na handog” ay tumutukoy sa mga itinalagang bahagi o handog.
    reason: cultural_note
  - marker: c
    text: O “na ginagawang banal sila” o “na nagtatalaga sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: at sa gayon ay magdala sa kanila
  rationale: Ipinahahayag ang causative na diwa ng Hiphil at ang bunga ng naunang pagbabawal, nang hindi nilulutas ang kahirapan ng pariralang Hebreo.
- source_word: עֲוֺן אַשְׁמָה
  choice: pagkakasalang nangangailangan ng kabayaran
  rationale: Pinagsasama nito ang diwa ng pagkakasala at pananagutang kultiko na may kaukulang pagbabayad o handog para sa pagkakasala.
- source_word: בְּאָכְלָם
  choice: kapag kinain nila
  rationale: Natural na Filipino para sa pangyayaring ipinahahayag ng בְּ na may infinitive construct; nananatiling bukas ang bahagyang instrumental o temporal na diwa.
- source_word: קָדְשֵׁיהֶם
  choice: kanilang mga banal na handog
  rationale: Sa kontekstong Levitico, ang literal na 'kanilang mga banal na bagay' ay tumutukoy sa mga itinalagang bahagi o handog; mas malinaw ito sa ordinaryong mambabasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מְקַדְּשָׁם
  choice: na nagpapabanal sa kanila
  rationale: Tumpak na inilalahad ang Piel participle ng קדשׁ at pinananatili ang bokabularyong kaugnay ng kabanalan sa Levitico.
theological_decisions:
- issue: Tinutukoy ng hulaping 'sila' sa huling sugnay
  choice: Ang 'sila' ay pinanatili nang walang idinagdag na tiyak na pangngalan.
  alternative: Tahasang sabihing pinapabanal ni Yahweh ang mga pari o ang Israel; o unawaing ang mga banal na handog ang pinapabanal.
  rationale: Pinakamalapit na pinananatili ng panghalip ang sintaks at tunay na posibilidad ng Hebreo nang hindi ipinipilit sa pangunahing teksto ang isang mas makitid na interpretasyon.
- issue: Likas na katangian ng עֲוֺן אַשְׁמָה
  choice: pagkakasalang nangangailangan ng kabayaran
  alternative: pagkakasala; parusa dahil sa paglabag; pagkakasalang nangangailangan ng handog para sa pagkakasala
  rationale: Ipinahahayag nito ang legal at kultikong pananagutan habang hindi nililimitahan ang kaparaanan ng pagtutuwid sa isang labis na tiyak na pormula.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang “kabayaran” upang maipahayag ang kultikong pananagutan, “mga banal na handog” para sa kalinawan sa konteksto, at “nagpapabanal” upang mapanatili ang mahalagang bokabularyo ng Levitico.
