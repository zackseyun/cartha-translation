  terminology: Ang “Yahweh,” “banal na handog,” at “nagpapabanal” ay angkop at pare-pareho sa terminolohiyang Levitico. Pinalitan ang “pagkakasala” sa pangunahing parirala ng “pananagutan” upang ipakita ang עָוֺן bilang guilt/liability, habang ang talababa ay nagpapanatili ng alternatibong “pagkakasala.”
