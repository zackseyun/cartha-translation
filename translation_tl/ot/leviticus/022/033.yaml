  yaml_path: translation/ot/leviticus/022/033.yaml
  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: tl
  text: na naglabas sa inyo mula sa lupain ng Ehipto upang maging Diyos ninyo. Ako si Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH (tradisyonal na isinasaling “ang PANGINOON”; maaari ring tumbasan ng “Yahweh”).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: na naglabas
  rationale: Ang Hiphil participle ay naglalarawan kay Yahweh at nagpapatuloy sa pangungusap ng naunang talata. Likas sa Tagalog ang sugnay na “na naglabas” kaysa sa mas literal na anyong participial.
- source_word: אֶתְכֶם
  choice: sa inyo
  rationale: Ang hulaping 2mp ay tumutukoy sa maramihang kausap. Sa Tagalog, natural na ipinahahayag ito ng “sa inyo” kasunod ng pandiwang “naglabas.”
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang buong pormulang pang-Exodo na “lupain ng Ehipto,” sa halip na paikliin lamang bilang “Ehipto.”
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: upang maging Diyos ninyo
  rationale: Malinaw at natural nitong naipahahayag ang layunin at ang ugnayang tipan na nasa היה + ל + אֱלֹהִים.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Ang sugnay na walang tahasang pandiwa sa Hebreo ay natural na pagpapakilala sa Tagalog, at ang personal na pangalang יהוה ay tinumbasan ng “Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalang kaugnay ng tipan, habang kinikilala sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Sinimulan sa maliit na titik ang “na” sapagkat ang talata ay pagpapatuloy ng pangungusap mula sa Levitico 22:32. Ginamit ang “Diyos ninyo” upang mapanatili ang relational at pangtipang diwa ng orihinal.
