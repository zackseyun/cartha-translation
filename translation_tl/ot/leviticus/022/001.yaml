  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Sinabi ni Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH.” Tradisyonal na isinasalin bilang “ang PANGINOON”; dito ay ginamit ang “Yahweh.”'
    reason: Ipinapaliwanag ang anyong Hebreo ng banal na pangalan at ang tradisyonal na salin nito.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive kasama ng דבר ay karaniwang nagbubukas ng bagong yunit ng pagsasalita. Pinananatili ng “At nagsalita” ang pormal na pambungad ng Hebreo nang hindi gumagamit ng lipas na pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang tetragrammaton bilang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na makabagong Tagalog para sa preposisyong אֶל kapag ang tinutukoy ay taong pinagsasabihan; “Moises” ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: לֵאמֹר
  choice: 'at sinabi niya:'
  rationale: Ang infinitive na ito ay nagpapakilala sa mismong nilalaman ng kasunod na pahayag. Ang “at sinabi niya:” ay mas natural sa makabagong Tagalog kaysa sa literal ngunit alanganing “na sinasabi,” habang pinananatili ang pormal na pormula ng pagsasalita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaibang ito mula sa isang titulo, samantalang kinikilala sa talababa ang tradisyonal na salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tutuldok upang ihanda ang mambabasa sa nilalaman ng pahayag sa kasunod na talata. Ang panghalip na “niya” ay natural na inuulit ang simuno nang hindi inilalayo ang teksto sa pormula ng Hebreo.
