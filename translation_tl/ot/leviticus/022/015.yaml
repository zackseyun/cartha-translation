  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: tl
  text: Huwag nilang lapastanganin ang mga banal na bagay ng mga anak ni Israel na inihahandog nila kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na itinataas nila para kay Yahweh” o “na inihaharap nila kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: lapastanganin
  rationale: Sa kontekstong pangkulto, ang Piel ng חלל ay nangangahulugang ituring na di-banal o lapastanganin; natural at marangal sa modernong Filipino ang “lapastanganin.”
- source_word: קָדְשֵׁי
  choice: mga banal na bagay
  rationale: Pinananatili ang malawak na kahulugan ng construct plural at iniiwasang limitahan ito sa “mga handog,” bagaman mga itinalagang kaloob ang tinutukoy sa konteksto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa karaniwang tipanang katawagan ng Hebreo at malinaw pa rin sa Tagalog.
- source_word: אֲשֶׁר יָרִימוּ
  choice: na inihahandog nila
  rationale: Ang Hiphil ng רום ay literal na may diwang “itinataas,” ngunit sa kontekstong panghandog ay natural na tumutukoy sa paghahain o paghahandog; inilalagay sa talababa ang kongkretong larawan.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na יהוה bilang “Yahweh.”
- source_word: וְלֹא
  choice: Huwag nilang
  rationale: Ang negatibong imperfect sa batas ay natural na ipinahahayag bilang pagbabawal sa modernong Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pinananatili ang natatanging pangalang tipan sa teksto sa halip na palitan ito ng titulo.
- issue: Saklaw ng קָדְשֵׁי
  choice: mga banal na bagay
  alternative: mga banal na handog
  rationale: Pinananatili ang leksikal na lawak at hindi tahimik na nililimitahan ang reperente, kahit malinaw na panghandog ang konteksto.
translation_notes:
  register: Makabago at dignidad na Filipino; legal ang himig ngunit hindi lipas. Pinanatili ang pormal na “mga anak ni Israel” at ang malawak na “mga banal na bagay,” habang ginawang likas sa Tagalog ang pandiwang panghandog.
