lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive na may דִּבֵּר ay nagpapakilala ng panibagong pangyayari ng pagsasalita; likas at pormal nang bahagya sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa taong kinakausap; “kay Moises” ang natural na katumbas sa modernong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nag-uugnay sa banal na pagsasalita sa tuwirang pahayag na sumusunod sa susunod na talata.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormulang “na sinasabi” dahil nakabitin ang talata at ang mismong mensahe ay nagpapatuloy sa kasunod na talata.
