base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: tl
  text: Dapat itong kainin sa araw ding iyon[a]; huwag kayong mag-iwan ng anuman mula rito hanggang umaga. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa araw na iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw ding iyon
  rationale: Ang literal na diwa ay “sa araw na iyon”; ipinahahayag ng “araw ding iyon” ang agarang takdang panahon sa konteksto ng handog habang nananatiling likas sa modernong Tagalog.
- source_word: יֵאָכֵל
  choice: Kailangang kainin iyon
  rationale: Ang Niphal imperfect ay isang pasibo o di-tiyak na legal na tagubilin. Mas natural sa Tagalog ang “kailangang kainin” kaysa sa mahigpit na pormal na pasibo, at malinaw nitong pinananatili ang puwersa ng utos.
- source_word: לֹא תוֹתִירוּ
  choice: huwag kayong magtira
  rationale: Ang Hiphil ng יתר ay nangangahulugang mag-iwan ng natira. Ang pangmaramihang “kayong” ay tumutugma sa pandiwang Hebreo at ang “huwag… magtira” ay tuwiran at natural na pagbabawal.
- source_word: מִמֶּנּוּ
  choice: niyon
  rationale: Tumutukoy ang panghalip sa handog na kinakain; ang “niyon” ay maikli at natural na katumbas ng “mula roon/niyon” sa pariralang “magtira niyon.”
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Karaniwang temporal na parirala ito na nagbabawal sa pagtatabi nang magdamag; “hanggang umaga” ang tuwirang modernong katumbas.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang personal na pangalan sa Tetragrammaton at likas na isinasalin sa Tagalog ang verbless self-identification sa pamamagitan ng “Ako si.”
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang personal na pangalang YHWH. Pinananatili ng “Yahweh” ang pagkakakilanlang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Puwersa ng יֵאָכֵל bilang legal na tagubilin
  choice: Kailangang kainin iyon
  alternative: Kakainin iyon; Dapat itong kainin
  rationale: Ipinakikita ng “kailangang” ang obligasyong nakapaloob sa impersonal/passive na anyo nang hindi tinutukoy kung sino ang kakain; hindi nito dinaragdagan ang teksto ng doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang legal na puwersa ng talata, ang pangmaramihang kausap, at ang personal na pangalang Yahweh. Hindi isinama ang ibinigay na footnote b sapagkat hindi ito aktuwal na alternatibong pagbasa at mali ang pagkakabit nito sa pariralang “hanggang umaga”; ang Hebreo ay tuwirang nagtatapos sa “Ako si Yahweh.”
