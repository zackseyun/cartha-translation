review_pass:
  verdict: revise
  source_fidelity: Tumpak na naihahatid ng draft ang pagbabawal at ang pag-uulit ng "banal na bahagi." Gayunman, ang "hindi kabilang sa sambahayan ng pari" ay masyadong tahasang inililimita ang זָר sa sambahayan, samantalang ang salitang Hebreo ay mas malawak na tumutukoy sa hindi awtorisadong tagalabas. Ang "nakikitira sa pari" ay hindi natural at maaaring magpahiwatig lamang na nakatira siya sa parehong lugar ng pari, sa halip na isang residenteng kaugnay ng sambahayan nito.
  naturalness: Mas natural sa makabagong Filipino ang "tagalabas" para sa זָר at "pansamantalang naninirahan sa sambahayan ng pari" para sa תּוֹשַׁב כֹּהֵן. Nanatiling marangal at malinaw ang legal na rehistro ng "hindi maaaring kumain."
  terminology: Ang "pari," "banal na bahagi," at "upahang manggagawa" ay angkop at pare-pareho. Ang "banal na bahagi" ay isang wastong kontekstuwal na salin ng קֹדֶשׁ bilang pagkaing/porisyong mula sa banal na handog; pinananatili ng talababa ang mas literal na alternatibo.
  issues:
  - severity: medium
    issue: Masyadong makitid ang "hindi kabilang sa sambahayan ng pari" para sa זָר.
    rationale: Ang זָר ay "tagalabas" o taong hindi awtorisado sa banal na pagkain; hindi tahasang sinasabi ng salita mismo na wala siya sa sambahayan ng pari. Ang kasunod na mga kategorya ay nagpapakita ng mga partikular na hindi awtorisadong tao, kabilang ang mga kaugnay ng sambahayan.
  - severity: medium
    issue: Hindi idiomatiko at malabo ang "nakikitira sa pari."
    rationale: Sa Filipino, mas karaniwan itong mauunawaan bilang simpleng pakikitira sa mismong pari. Kailangan ang "sa sambahayan ng pari" upang maipahayag ang ugnayang pangsambahayan na nasa parirala.
  revised_text: Walang tagalabas ang maaaring kumain ng banal na bahagi[a]; ang pansamantalang naninirahan sa sambahayan ng pari[b] o upahang manggagawa ay hindi maaaring kumain ng banal na bahagi.
