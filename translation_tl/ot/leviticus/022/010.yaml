revisions:
- from: Walang sinumang hindi kabilang sa sambahayan ng pari ang maaaring kumain ng banal na bahagi[a]. Ang isang nakikitira sa pari[b] o isang upahang manggagawa ay hindi maaaring kumain ng banal na bahagi.
  to: Walang tagalabas ang maaaring kumain ng banal na bahagi[a]; ang pansamantalang naninirahan sa sambahayan ng pari[b] o upahang manggagawa ay hindi maaaring kumain ng banal na bahagi.
  rationale: Pinalitan ang sobrang pagpapaliwanag sa זָר ng mas malawak at likas na "tagalabas," na hindi nagpapahiwatig ng etnisidad ngunit hindi rin nagdaragdag ng limitasyong wala sa teksto. Pinalinaw ang תּוֹשַׁב כֹּהֵן bilang residenteng pansamantalang naninirahan sa sambahayan ng pari, upang maiwasan ang malabong "nakikitira sa pari."
