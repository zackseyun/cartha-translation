  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: tl
  text: Walang tagalabas ang maaaring kumain ng banal na bahagi[a]; ang pansamantalang naninirahan sa sambahayan ng pari[b] o upahang manggagawa ay hindi maaaring kumain ng banal na bahagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “banal na pagkain,” “banal na bagay,” o “bahaging inilaan.” Ang isahang Hebreong salita ay tumutukoy rito sa pagkaing mula sa mga banal na handog na nakalaan sa mga pari.
    reason: lexical_alternative
  - marker: b
    text: Ang “pansamantalang naninirahan sa sambahayan ng pari” ay tumutukoy sa residenteng hindi kapamilya ngunit nakaugnay sa sambahayan ng pari. Maaari ring “isang sojourner ng pari” o “residenteng dayuhan ng isang pari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: hindi kabilang sa sambahayan ng pari
  rationale: Sa konteksto ng pagkaing nakalaan sa mga pari, tumutukoy ito sa taong wala sa awtorisadong sambahayan ng pari, hindi lamang sa isang dayuhan. Nililinaw ng salin ang kaugnay na hangganan nang hindi ito ginagawang usapin ng lahi.
- source_word: קֹדֶשׁ
  choice: banal na bahagi
  rationale: Bagaman literal na 'banal na bagay' ang pangngalang isahan, tumutukoy ito rito sa bahaging pagkain mula sa mga handog na nakalaan sa mga pari. Likas at malinaw sa Filipino ang 'banal na bahagi,' habang nasa talababa ang mas literal at ibang posibleng salin.
- source_word: תּוֹשַׁב כֹּהֵן
  choice: isang nakikitira sa pari
  rationale: Pinananatili nito ang diwa ng isang residenteng nakaugnay sa sambahayan ng pari ngunit hindi kabilang sa pamilya, nang hindi tiyak na ipinapalagay na isa siyang dayuhang etniko.
- source_word: שָׂכִיר
  choice: upahang manggagawa
  rationale: Tumutukoy ang salita sa taong nagtatrabaho kapalit ng sahod; malinaw at makabago ang pariralang ito.
- source_word: לֹא יֹאכַל
  choice: hindi maaaring kumain
  rationale: Ipinahahayag ng negatibong imperfect ang legal na pagbabawal; natural itong naihahatid ng 'hindi maaaring kumain.'
- source_word: וְכָל זָר
  choice: Walang sinumang hindi kabilang sa sambahayan ng pari
  rationale: Ang kabuuang parirala kasama ng kasunod na pagbabawal ay natural na isinasaling bilang pangkalahatang pagbabawal sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pari' ayon sa karaniwang bokabularyong biblikal. Ang unang sugnay ay bahagyang nagpapaliwanag sa saklaw ng זָר upang maiwasang mapagkamalan itong simpleng etnikong 'dayuhan'; pinananatili naman ng talababa ang mga alternatibong leksikal.
