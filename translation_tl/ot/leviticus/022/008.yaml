  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: tl
  text: Huwag siyang kumain ng hayop na natagpuang patay o nilapa ng mabangis na hayop[a], upang hindi siya maging marumi dahil rito. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hayop na kusang namatay o nilapa ng mabangis na hayop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבֵלָה
  choice: hayop na natagpuang patay
  rationale: Tumutukoy ito sa bangkay ng hayop, lalo na sa hayop na namatay nang hindi kinatay ayon sa wastong paraan. Malinaw at likas sa makabagong Filipino ang pariralang ito sa konteksto ng mga batas tungkol sa pagkain.
- source_word: וּטְרֵפָה
  choice: o nilapa ng mabangis na hayop
  rationale: Ang טְרֵפָה ay hayop na nilapa o pinatay ng maninila. Ginawang hayag ang ipinahihiwatig na gumawa upang maging malinaw sa karaniwang mambabasa.
- source_word: לֹא יֹאכַל
  choice: Huwag siyang kumain
  rationale: Ang negatibong imperfect sa tekstong legal ay nagpapahayag ng pagbabawal. Ang “Huwag siyang kumain” ang natural at mariing anyo nito sa Filipino.
- source_word: לְטָמְאָה בָהּ
  choice: at sa gayon ay maging marumi dahil dito
  rationale: Ipinahihiwatig ng infinitive na may ל ang bunga o layunin ng pagkain. Pinananatili ng “maging marumi” ang bokabularyo ng ritwal na karumihan nang hindi ito ginagawang pangkalahatang moral na pagdungis.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalang יְהוָה bilang “Yahweh,” ayon sa anyo ng Hebreo at sa gamit ng covenant formula sa Levitico.
theological_decisions:
- issue: Kahulugan ng pagiging marumi
  choice: maging marumi
  alternative: madungisan ang sarili
  rationale: Sa konteksto, ang טמא ay teknikal na kalagayang ritwal. Ang “maging marumi” ay hindi nagdaragdag ng pahiwatig na likas na kasalanang moral ang tinutukoy.
- issue: Pagbigkas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Nasa Hebreong teksto ang Tetragrammaton bilang personal na pangalan; pinanatili itong pangalan sa salin sa halip na palitan ng titulo.
- issue: Ugnayan ng pagkain at pagiging marumi
  choice: at sa gayon ay maging marumi dahil dito
  alternative: upang maging marumi dahil dito
  rationale: Maaaring magpahayag ng layunin o resulta ang לְטָמְאָה. Ang “at sa gayon” ay natural na naghahayag ng bunga rito nang hindi ipinapalagay na layunin ng pari ang maging marumi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinanatili ang legal na lakas ng pagbabawal at ang teknikal na wika ng ritwal na karumihan.
