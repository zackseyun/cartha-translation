base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: tl
  text: Kapag lumubog na ang araw, magiging malinis siya; pagkatapos, maaari na siyang kumain mula sa mga banal na bagay[b], sapagkat iyon ang pagkain niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sapagkat iyon ang tinapay niya.” Dito, ang “tinapay” ay tumutukoy sa pagkaing nakalaan sa kanya mula sa mga banal na bahagi.
    reason: lexical_alternative
  - marker: b
    text: O “mula sa mga banal na handog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: Kapag lumubog na ang araw
  rationale: Ang literal na idyomang Hebreo ay ‘dumating ang araw,’ ngunit ang kahulugan nito rito ay paglubog ng araw. Likas sa modernong Tagalog ang napiling anyo at malinaw nitong ipinahahayag ang takdang panahon.
- source_word: וְטָהֵר
  choice: magiging malinis siya
  rationale: Tumutukoy ang pandiwa sa panunumbalik sa kalinisan ayon sa ritwal matapos lumubog ang araw. Hindi nito ipinapasok ang ideya ng moral na kadalisayan.
- source_word: וְאַחַר
  choice: pagkatapos
  rationale: Pinananatili nito ang sunod-sunod na daloy ng tagubilin.
- source_word: יֹאכַל
  choice: maaari na siyang kumain
  rationale: Sa kontekstong legal, ipinahihiwatig ng anyo ng pandiwa ang pahintulot na kumain matapos manumbalik ang kalinisan.
- source_word: מִן הַקֳּדָשִׁים
  choice: mula sa mga banal na bagay
  rationale: Malapit ito sa malawak na kahulugan ng Hebreong pangmaramihan at hindi agad nililimitahan sa ‘mga handog,’ bagaman iyon ang malamang na tinutukoy sa konteksto.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinapakita na ang kasunod na sugnay ang dahilan ng pahintulot.
- source_word: לַחְמוֹ הוּא
  choice: iyon ang pagkain niya
  rationale: Bagaman literal na ‘iyon ang tinapay niya,’ ang לֶחֶם ay maaari ring tumukoy sa pagkain o panustos sa pangkalahatan. Pinananatili ng ‘iyon’ ang isahang anyo ng sugnay na Hebreo habang natural pa rin sa Tagalog.
theological_decisions:
- issue: Kalikasan ng kalinisan
  choice: Kalinisan ayon sa ritwal
  alternative: Moral o espirituwal na kadalisayan
  rationale: Ang konteksto ng Levitico 22 ay ang karapatan ng pari na kumain ng banal na pagkain matapos ang isang kalagayan ng karumihan. Kaya ginamit ang karaniwang salitang ‘malinis’ at hinayaang linawin ng konteksto ang ritwal na diwa nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at likas pakinggan. Ginamit ang ‘banal na mga bagay’ sa halip na mas interpretibong ‘mga banal na handog,’ at ang ritwal na kahulugan ng ‘malinis’ ay iniwan sa konteksto.
