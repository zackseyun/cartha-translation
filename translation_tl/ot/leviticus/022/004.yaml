language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: tl
  text: Sinumang lalaki sa lahi ni Aaron na may sakit sa balat[a] o may pag-agos ng likido mula sa katawan ay hindi kakain ng mga banal na handog hanggang sa maging malinis siya. At ang sinumang humipo sa isang taong naging ritwal na marumi dahil sa bangkay[b], o sa lalaking nilabasan ng semilya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasaling “may ketong.” Ang salitang Hebreo ay tumutukoy sa mas malawak na uri ng sakit sa balat na nagdudulot ng ritwal na karumihan, at hindi kinakailangang sa modernong ketong (Hansen’s disease).
    reason: lexical_alternative
  - marker: b
    text: O posibleng “sa anumang marumi dahil sa isang patay na tao.” Siksik at idyomatiko ang pariralang Hebreo at tumutukoy sa karumihang kaugnay ng bangkay.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: Sinumang lalaki sa lahi ni Aaron
  rationale: Ang inuulit na אִישׁ ay distributibong idyoma na nangangahulugang “sinumang lalaki.” Ang “lahi ni Aaron” ay natural na Filipino para sa genealogical na diwa ng זֶרַע at tumutukoy rito sa mga lalaking saserdote mula kay Aaron.
- source_word: צָרוּעַ
  choice: may sakit sa balat
  rationale: Malawak ang saklaw ng terminong Hebreo at hindi ito dapat itumbas nang tuwiran sa modernong ketong o Hansen’s disease. Pinananatili ng salin ang kondisyon nang walang maling espesipikong diagnosis.
- source_word: זָב
  choice: may umaagos na likido mula sa katawan
  rationale: Tumutukoy ito sa pag-agos ng likido sa katawan na nagdudulot ng ritwal na karumihan. Malinaw at marangal ang parirala nang hindi nagdaragdag ng hindi tiyak na medikal na detalye.
- source_word: בַּקֳּדָשִׁים
  choice: ng mga banal na handog
  rationale: Sa konteksto, tumutukoy ito sa mga itinalagang banal na bahagi na maaaring kainin ng mga saserdote. Nililinaw ng “handog” ang tinutukoy nang hindi inilalayo sa konsepto ng mga banal na bagay.
- source_word: לֹא יֹאכַל עַד אֲשֶׁר יִטְהָר
  choice: ay hindi kakain ... hanggang sa maging malinis siya
  rationale: Pinananatili nito ang legal na pagbabawal at ang paglipat tungo sa kalagayang ritwal na malinis, sa halip na ipahiwatig lamang ang paggaling sa sakit.
- source_word: וְהַנֹּגֵעַ בְּכָל טְמֵא נֶפֶשׁ
  choice: Gayundin, ang sinumang humipo sa taong marumi dahil sa bangkay
  rationale: Ang mahirap na idyomang Hebreo ay inuunawang tumutukoy sa paghipo sa isang taong nagkaroon ng karumihang kaugnay ng bangkay. Ang talababa ay nagpapanatili sa alternatibong posibleng pagkakabuo ng parirala.
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: sa lalaking nilabasan ng semilya
  rationale: Natural at malinaw itong Filipino para sa literal na paglabas ng semilya, habang pinananatili ang lalaking tinutukoy ng teksto at ang marangal na rehistro.
theological_decisions:
- issue: Paglalarawan sa ritwal na karumihan nang hindi nag-aangkat ng modernong diagnosis o moral na paghatol
  choice: “may sakit sa balat” at “maging malinis”
  alternative: “may ketong” at “gumaling”
  rationale: Ang talata ay tungkol sa ritwal na pagiging karapat-dapat ng isang saserdote na kumain ng banal na handog, hindi tungkol sa modernong medikal na diagnosis o likas na kasalanan ng maysakit.
- issue: Kasarian ng saklaw ng batas
  choice: “Sinumang lalaki sa lahi ni Aaron”
  alternative: “Sinumang tao sa lahi ni Aaron”
  rationale: Ang Hebreo ay panlalaki, at sa kontekstong ito ay tumutukoy sa mga lalaking inapo ni Aaron na kabilang sa sambahayan ng mga saserdote.
- issue: Ambiguidad ng טְמֵא נֶפֶשׁ
  choice: Taong marumi dahil sa bangkay, na may talababa para sa alternatibong pagbasa
  alternative: Anumang bagay na marumi dahil sa isang patay na tao
  rationale: Mas malamang sa sintaks at konteksto ang taong nagkaroon ng karumihan sa pamamagitan ng bangkay, ngunit hindi ganap na walang kalabuan ang siksik na pariralang Hebreo; kaya hindi dapat itago ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa legal at ritwal na konteksto ng Levitico. Ginamit ang “semilya” bilang tuwiran ngunit hindi magaspang na katawagan. Pinanatili ang kuwit sa dulo sapagkat nagpapatuloy ang pangungusap at talaan ng mga kalagayang nagpaparumi sa susunod na talata.
