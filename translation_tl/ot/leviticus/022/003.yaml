  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם לְ/דֹרֹ֨תֵי/כֶ֜ם כָּל אִ֣ישׁ אֲשֶׁר יִקְרַ֣ב מִ/כָּל זַרְעֲ/כֶ֗ם אֶל הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי יִשְׂרָאֵל֙ לַֽ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֞ה הַ/נֶּ֧פֶשׁ הַ/הִ֛וא מִ/לְּ/פָנַ֖/י אֲנִ֥י יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: tl
  text: 'Sabihin mo sa kanila: Sa lahat ng salinlahi ninyo, sinumang lalaki sa inyong mga supling ang lalapit sa mga banal na bagay na itinatalaga ng mga Israelita kay Yahweh habang taglay pa niya ang kanyang karumihan, ang taong iyon ay puputulin[a] mula sa aking harapan.[b] Ako si Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “puputulin” ay karaniwang pormula ng kaparusahan sa tipan. Pinagtatalunan ang eksaktong paraan ng pag-aalis na tinutukoy nito.
    reason: alternative_reading
  - marker: b
    text: O “mula sa aking presensiya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: Sabihin mo sa kanila
  rationale: Pinananatili ang tuwirang pautos kay Moises at ang maramihang tinutukoy na kausap.
- source_word: לְדֹרֹתֵיכֶם
  choice: Sa lahat ng salinlahi ninyo
  rationale: Likas na pormulang legal sa Tagalog para sa patuloy na bisa sa magkakasunod na salinlahi.
- source_word: כָּל אִישׁ אֲשֶׁר ... מִכָּל זַרְעֲכֶם
  choice: sinumang lalaki sa inyong mga supling
  rationale: Pinananatili ang panlalaking anyo ng אִישׁ at ang genealogical na diwa ng זֶרַע sa konteksto ng mga inapo ni Aaron.
- source_word: יִקְרַב
  choice: lalapit
  rationale: Nananatili ang spatial at ritwal na diwa ng paglapit sa mga sagradong bagay.
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Sadyang malawak tulad ng Hebreo at hindi nililimitahan sa isang partikular na uri ng handog.
- source_word: יַקְדִּישׁוּ
  choice: itinatalaga
  rationale: Natural na kasalukuyang Tagalog para sa pagtatabi o pagtatalaga bilang banal.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Natural at malinaw na katumbas sa modernong Tagalog ng idiomatikong katawagang Hebreo na 'mga anak na lalaki ni Israel.'
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: habang taglay pa niya ang kanyang karumihan
  rationale: Pinananatili ang larawan ng ritwal na karumihang nasa o nananatili sa tao, sa halip na patagin lamang bilang 'marumi siya.'
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon ay ihihiwalay
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa tao; ang 'ihihiwalay' ay nagpapanatili sa pormulang parusa nang hindi tiyakang ipinapakahulugan bilang kamatayan o simpleng pagtitiwalag.
- source_word: מִלְּפָנַי
  choice: sa aking harapan
  rationale: Pormal ngunit natural na salin na nagpapanatili sa larawang kaugnay ng presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang tipan na nasa tekstong Hebreo.
theological_decisions:
- issue: Kahulugan ng pormulang וְנִכְרְתָה, 'puputulin/ihihiwalay'
  choice: ihihiwalay
  alternative: papatayin; ititiwalag sa sambayanan; aalisin sa katayuan sa tipan
  rationale: Hindi tinutukoy ng talata ang eksaktong paraan ng parusa. Iniiwasang lutasin sa salin ang pinagtatalunang saklaw ng pormula.
- issue: Saklaw ng מִלְּפָנַי
  choice: sa aking harapan
  alternative: mula sa aking presensiya
  rationale: Parehong posible ang lokatibo at presensiyal na diwa; pinananatili ng pangunahing salin ang konkretong idyoma at inilalagay sa talababa ang natural na alternatibo.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang kinakatawan ang Tetragrammaton bilang personal na pangalan nang hindi nag-aangkat ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at legal-ritwal na himig. Ginamit ang “mga Israelita” sa halip na literal na “mga anak na lalaki ni Israel” para sa likas na pagkaunawa, ngunit pinanatili ang “sinumang lalaki” dahil ang agarang konteksto ay ang mga lalaking inapo ni Aaron. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
