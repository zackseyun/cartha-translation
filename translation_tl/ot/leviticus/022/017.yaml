  text: 'At nagsalita si Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring isatitik bilang “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapasimula ng panibagong pangyayari ng pagsasalita; likas sa Filipino ang “At nagsalita” at napapanatili nito ang pormal na hulma ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Minamarkahan ng אֶל ang taong pinatutunguhan ng pagsasalita; “kay” ang natural na panandang Filipino bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang modernong anyo ng pangalang biblikal sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na naghahanda sa tuwirang pahayag sa kasunod na talata, bagaman mas idyomatiko rin sana ang simpleng tutuldok.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na banal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang transliterasyon at hindi pinalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago at marangal na Filipino, habang sadyang pinananatili ang pormal at paulit-ulit na hulma ng panimulang pahayag sa Levitico.
