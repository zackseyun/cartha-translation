id: LEV.22.24
reference: Leviticus 22:24
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: tl
  text: Huwag kayong maghandog kay Yahweh ng anumang hayop na ang mga bayag ay napisa, nadurog, napunit, o naputol[a]; at huwag ninyo itong gawin sa inyong lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “napisa, nadurog, napunit, o naputol.” Apat na uri ng pinsala ang inililista sa Hebreo; ipinahihiwatig ng konteksto na mga bayag ng hayop ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוּךְ
  choice: napisa
  rationale: Ipinahihiwatig ng anyong pasibo ang pinsalang dulot ng pagdiin o pagpisâ; naiiba ito sa kasunod na mas matinding “nadurog.”
- source_word: כָתוּת
  choice: nadurog
  rationale: Tumutukoy sa bagay na binayo o dinurog, kaya pinananatili ang kongkretong uri ng pinsala.
- source_word: נָתוּק
  choice: napunit
  rationale: Tumutukoy sa pagkapunit o pagkahiwalay dahil sa paghila; pinananatili ng “napunit” ang paraan ng pinsala nang hindi labis na tinutukoy ang detalye.
- source_word: כָרוּת
  choice: naputol
  rationale: Mula sa pandiwang nangangahulugang putulin; malinaw at natural itong paglalarawan sa kalagayang napinsala.
- source_word: תַקְרִיבוּ
  choice: maghandog
  rationale: Sa kontekstong pansakripisyo, nangangahulugan itong maglapit o magharap bilang handog; “maghandog” ang pinakanatural na salin sa modernong Tagalog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos ayon sa ibinigay na patakaran ng proyekto.
- source_word: בְאַרְצְכֶם
  choice: sa inyong lupain
  rationale: Tuwirang pinananatili ang pagtukoy sa lupaing tinitirhan ng Israel.
- source_word: תַעֲשׂוּ
  choice: gawin
  rationale: Malawak at bitin ang Hebreong pandiwa; ang “gawin” ay nagpapanatili sa saklaw nito nang hindi tahasang nilulutas kung mutilasyon lamang o kaugnay na paghahanda ang tinutukoy.
- source_word: implicit object of the four participles
  choice: mga bayag
  rationale: Sa konteksto, ang apat na katawagan ay malinaw na tumutukoy sa mga panlalaking sangkap ng hayop. Ang “mga bayag” ay karaniwan, tiyak, at hindi lipas na katawagan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan sa Hebreo at sinusunod ang tahasang pamantayan ng proyekto.
- issue: Saklaw ng huling pagbabawal na וּבְאַרְצְכֶם לֹא תַעֲשׂוּ
  choice: “huwag ninyo itong gawin,” na pangunahing tumutukoy sa nabanggit na mutilasyon ngunit nananatiling malawak
  alternative: huwag kayong maghandog ng gayong mga hayop sa inyong lupain
  rationale: Malawak at eliptikal ang pandiwang “gawin.” Pinananatili ng salin ang tunay na kalabuan sa halip na ikulong ito sa paghahandog lamang.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “bayag” bilang malinaw at karaniwang terminong anatomikal; iniwasan ang malabo o lipas na eupemismo. Pinanatili ang apat na magkakaibang uri ng pinsala at ang eliptikal na “gawin” sa huling sugnay.
