  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: tl
  text: Baka man o tupa[a], huwag ninyong katayin ang hayop na iyon at ang anak nito[b] sa iisang araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa tupa o kambing, isang maliliit na hayop na pangkawan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “ito at ang anak na lalaki nito”; sa konteksto, ang ibig sabihin ay isang hayop at ang supling nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: baka
  rationale: Tumutukoy ito sa isang hayop na kabilang sa mga bovine livestock. Ang “baka” ay natural at hindi nagtatakda ng kasarian, di-gaya ng “toro.”
- source_word: שֶׂה
  choice: tupa
  rationale: Tumutukoy ito sa isang hayop mula sa maliit na kawan at maaaring tupa o kambing ayon sa konteksto. Ginamit ang karaniwang “tupa” sa pangunahing teksto, habang pinananatili sa talababa ang mas malawak na saklaw ng salitang Hebreo.
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: ito at ang anak nito
  rationale: Literal na “ito at ang anak nito.” Ang “anak” ay natural sa Filipino para sa supling ng hayop at hindi nagpapalagay na ina ang tinutukoy, isang detalye na hindi tahasang sinabi sa talata.
- source_word: תִשְׁחֲטוּ
  choice: huwag ninyong katayin
  rationale: Ang pandiwa ay tumutukoy sa pagkatay ng hayop, lalo na sa kontekstong legal at panghandog. Mas tiyak ang “katayin” kaysa “patayin.”
- source_word: בְּיוֹם אֶחָד
  choice: sa iisang araw
  rationale: Malapit ito sa literal na “sa isang araw” at malinaw na ipinagbabawal ang pagkatay sa dalawang hayop sa loob ng parehong araw.
- source_word: וְ ... אוֹ
  choice: Kung ... o
  rationale: Ipinakikilala ng panimulang pang-ugnay kasama ng אוֹ ang legal na kasong sumasaklaw sa alinman sa dalawang uri ng hayop. Natural sa Filipino ang hulma na “Kung baka o tupa ang hayop.”
theological_decisions:
- issue: Kung ang nakatatandang hayop ay tiyak na ina
  choice: Hindi tinukoy ang kasarian; “ito at ang anak nito”
  alternative: “ang inahin at ang anak nito”
  rationale: Bagaman maaaring may kaugnayan ang batas sa magulang at supling, hindi tahasang tinatawag ng Hebreo na inahin ang nakatatandang hayop. Iniwasang dagdagan ang teksto ng pagtukoy sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang hulma na “Kung baka o tupa ang hayop” ay natural sa isang legal na pagbabawal, at ang “sa iisang araw” ay nagpapanatili sa diin ng Hebreo nang hindi nagiging alanganin.
