  to: At huwag kayong maghandog bilang pagkain ng inyong Diyos[a] ng alinman sa mga ito mula sa kamay ng isang dayuhan, sapagkat may sira ang mga ito; may kapintasan ang mga ito[b]. Hindi sila tatanggapin para sa inyo.
