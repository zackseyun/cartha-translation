base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: tl
  text: At huwag kayong maghandog bilang pagkain ng inyong Diyos[a] ng alinman sa mga ito mula sa kamay ng isang dayuhan, sapagkat may sira ang mga ito; may kapintasan ang mga ito[b]. Hindi sila tatanggapin para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinapay ng inyong Diyos.” Ang “tinapay” dito ay idyomang Hebreo para sa pagkaing inihahandog sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “depekto.” Ang salitang Hebreo ay tumutukoy sa kapintasang nag-aalis ng pagiging karapat-dapat ng isang hayop bilang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang idyomang Hebreo na tumutukoy sa pinagmulan o taong pinanggalingan ng handog, at nauunawaan pa rin ito sa Filipino.
- source_word: בֶּן נֵכָר
  choice: isang dayuhan
  rationale: Ang literal na ‘anak ng dayuhan’ ay idyomang tumutukoy sa isang taong hindi Israelita; natural at malinaw sa modernong Filipino ang ‘isang dayuhan.’
- source_word: תַקְרִיבוּ
  choice: maghandog
  rationale: Sa kontekstong pansakripisyo, ang Hiphil ng קרב ay nangangahulugang magharap o mag-alay ng handog. Ang ‘maghandog’ ang pinakanatural na terminong pansamba sa Filipino.
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: pagkain ng inyong Diyos
  rationale: Bagaman literal na ‘tinapay,’ mas malawak ang gamit ng לֶחֶם dito para sa pagkaing inihahandog sa Diyos. Iniiwasan ng ‘pagkain’ ang maling pahiwatig na literal na tinapay lamang ang tinutukoy.
- source_word: מִכָּל אֵלֶּה
  choice: alinman sa mga ito
  rationale: Tumutukoy ito sa alinman sa mga hayop na may kapintasan na tinalakay sa naunang konteksto at pinananatili ang partitive na diwa ng Hebreo.
- source_word: מָשְׁחָתָם
  choice: may pagkasira sa mga ito
  rationale: Ipinahahayag nito ang pinsala, pagkasira, o disfigurement na dahilan ng pagiging di-karapat-dapat ng hayop, habang hindi ito lubusang ipinapareho sa kasunod na מוּם.
- source_word: מוּם
  choice: may kapintasan
  rationale: Ito ang karaniwang terminong Levitico para sa pisikal na depektong nag-aalis ng pagiging karapat-dapat ng isang hayop bilang handog.
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: Hindi tatanggapin ang mga ito alang-alang sa inyo
  rationale: Ipinapakita ng Niphal ng רצה na hindi kalulugdan o tatanggapin ang handog, at pinananatili ng ‘alang-alang sa inyo’ ang kaugnayan nito sa mga naghahandog.
theological_decisions:
- issue: Pansakripisyong kahulugan ng לֶחֶם
  choice: pagkain ng inyong Diyos
  alternative: tinapay ng inyong Diyos
  rationale: Saklaw ng talata ang mga hayop na ihahandog, kaya ang ‘pagkain’ ang mas malinaw na pagpapahayag ng idyomang pangkulto nang hindi nililimitahan ang kahulugan sa literal na tinapay.
- issue: Kabuluhan ng pagtanggap sa handog
  choice: Hindi tatanggapin ang mga ito alang-alang sa inyo
  alternative: Hindi kalulugdan ang mga ito para sa inyo
  rationale: Pinananatili nito ang pansakripisyong diwa ng banal na pagtanggap at ang ugnayan nito sa naghahandog, nang hindi nagpapasok ng karagdagang paliwanag na teolohikal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pansakripisyong bokabularyo at ang magkatabing pahayag na ‘pagkasira’ at ‘kapintasan’ upang hindi burahin ang diin at bahagyang pagkakaiba ng dalawang pariralang Hebreo.
