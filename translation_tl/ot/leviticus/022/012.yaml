  naturalness: Mas natural at malinaw sa makabagong Filipino ang “mag-asawa ng isang lalaking tagalabas” at “kumain ng nakalaang bahagi ng mga banal na handog.” Ang huli ay iniiwasan ang hindi likas na pariralang “inihandog sa mga banal na bagay.”
