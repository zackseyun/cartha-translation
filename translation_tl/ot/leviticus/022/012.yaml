  to: Ngunit kung ang anak na babae ng pari ay mag-asawa ng isang lalaking tagalabas[a], hindi siya maaaring kumain ng nakalaang bahagi ng mga banal na handog.[b]
  rationale: Inayos ang pandiwa ng pag-aasawa upang malinaw na ang anak na babae ng pari ang nag-asawa ng lalaking tagalabas. Pinalitan ang malabong “bahaging inihandog sa mga banal na bagay” ng “nakalaang bahagi ng mga banal na handog,” na mas tapat sa konstruktong Hebreo at natural sa Filipino. Pinanatili ang legal na puwersa ng pagbabawal sa “hindi siya maaaring kumain.”
