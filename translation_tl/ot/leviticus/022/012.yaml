base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: tl
  text: Ngunit kung ang anak na babae ng pari ay mag-asawa ng isang lalaking tagalabas[a], hindi siya maaaring kumain ng nakalaang bahagi ng mga banal na handog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalaking hindi kabilang sa angkan ng mga pari”; literal, “ibang lalaki.” Ang tinutukoy ay taong wala sa sambahayan o saklaw ng katayuang pari.
    reason: lexical_alternative
  - marker: b
    text: O “mga banal na bagay” o “mga sagradong kaloob.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Ngunit kung ang anak na babae ng isang pari
  rationale: Ginamit ang “Ngunit” upang ipakita ang pagsalungat sa naunang tuntunin, at tuwirang pinanatili ang ugnayang “anak na babae ng isang pari.”
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: kung ... ay mapangasawa ng isang tagalabas
  rationale: Ipinahihiwatig ng parirala ang pagbabago ng katayuan dahil sa pag-aasawa. Ang זָר dito ay isang taong nasa labas ng sambahayan o karapatang pari, hindi kinakailangang dayuhan sa lahi.
- source_word: הִוא
  choice: siya
  rationale: Pinananatili ang tahasang pambabaeng paksa sa natural na anyong Tagalog.
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: mula sa bahaging inihandog sa mga banal na bagay
  rationale: Ang תְּרוּמָה ay bahaging ibinukod at inihandog; pinananatili ng “mga banal na bagay” ang malawak na kategorya ng plural na קֳדָשִׁים.
- source_word: לֹא תֹאכֵל
  choice: hindi siya maaaring kumain
  rationale: Malinaw nitong ipinapahayag ang legal na kawalan ng pahintulot nang hindi nagmumukhang pahayag lamang tungkol sa pisikal na kakayahan.
theological_decisions:
- issue: Kahulugan ng זָר sa batas para sa mga pari
  choice: tagalabas, ibig sabihin ay hindi kabilang sa sambahayan o saklaw ng karapatang pari
  alternative: dayuhan; estranghero; hindi pari
  rationale: Ang konteksto ay tungkol sa kung sino ang may karapatang kumain ng banal na pagkain. Hindi hinihingi ng talata na unawain ang salita bilang pagkakaibang etniko.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “mapangasawa” upang natural na ipahayag ang pagpasok sa pag-aasawa, at ang “tagalabas” ay nilinaw sa talababa upang maiwasan ang maling pagpapakahulugang etniko.
