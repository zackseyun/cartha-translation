  to: Kapag ipinanganak ang isang baka, tupa, o kambing, mananatili ito sa piling ng ina nito nang pitong araw. Magmula sa ikawalong araw at pagkatapos nito, katanggap-tanggap na ito bilang handog na iniaalay sa pamamagitan ng apoy kay Yahweh.[a]
