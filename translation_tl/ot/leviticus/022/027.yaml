  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: tl
  text: Kapag ipinanganak ang isang baka, tupa, o kambing, mananatili ito sa piling ng ina nito nang pitong araw. Magmula sa ikawalong araw at pagkatapos nito, katanggap-tanggap na ito bilang handog na iniaalay sa pamamagitan ng apoy kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog na pagkain para kay Yahweh.” Ang salitang Hebreo ay terminong pansakripisyo para sa handog na inihaharap sa pamamagitan ng apoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: baka
  rationale: Tumutukoy sa hayop na mula sa uring bovine; ang “baka” ay likas na pangkalahatang katawagan sa Filipino at hindi nagtatakda ng kasarian.
- source_word: כֶשֶׂב
  choice: tupa
  rationale: Ginamit bilang pangkalahatang kategorya ng uri ng hayop, hindi kinakailangang batang tupa o lalaking tupa.
- source_word: עֵז
  choice: kambing
  rationale: Tumutukoy dito sa uri ng hayop at hindi kailangang tukuyin ang kasarian.
- source_word: כִּי יִוָּלֵד
  choice: kapag ipinanganak
  rationale: 'Sa batas na ito, ang כִּי ay nagbubukas ng isang karaniwang sitwasyon, at ang Niphal ng ילד ay pasibo: “ipinanganak.”'
- source_word: וְהָיָה שִׁבְעַת יָמִים
  choice: mananatili ito ... nang pitong araw
  rationale: Ipinahihiwatig ng konteksto ang patuloy na pananatili sa kalagayang binanggit, kaya mas natural kaysa sa literal na “ito ay magiging pitong araw.”
- source_word: תַּחַת אִמּוֹ
  choice: sa piling ng kanyang ina
  rationale: Literal itong “sa ilalim ng kanyang ina,” ngunit sa konteksto ng bagong silang na hayop ay tumutukoy sa pananatili nito sa ina, malamang habang sumususo. Pinananatili ng “sa piling” ang ugnayan nang hindi lumilikha ng di-likas na larawan sa Filipino.
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: mula sa ikawalong araw
  rationale: Ang “mula” ay likas na nagpapahiwatig na nagsisimula sa ikawalong araw at nagpapatuloy pagkatapos nito.
- source_word: יֵרָצֶה
  choice: maaari na itong tanggapin
  rationale: Ang Niphal ng רצה ay tumutukoy sa pagtanggap o pagiging katanggap-tanggap sa kontekstong pansakripisyo; ang “maaari na” ay malinaw na naghahayag ng pagiging karapat-dapat mula sa takdang araw.
- source_word: לְקָרְבַּן
  choice: bilang handog
  rationale: Ang קָרְבָּן ay handog na inilalapit o inihaharap sa Diyos; natural sa Filipino ang “bilang handog.”
- source_word: אִשֶּׁה
  choice: na pinaraan sa apoy
  rationale: Ang terminong pansakripisyo ay may kaugnayan sa handog na inihaharap sa pamamagitan ng apoy. Iniiwasan nito ang mas interpretatibong “handog na pagkain” habang pinananatili ang paraang ipinahihiwatig ng salita.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang “Yahweh”; likas sa Filipino ang “para kay” sa patutunguhan ng handog.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasan ang Tetragrammaton sa tekstong Hebreo. Ang transliterasyong “Yahweh” ay nagpapanatili sa personal na pangalang nasa pinagmulan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: May talakayan kung ang termino ay pangunahing tumutukoy sa handog na ginawa sa apoy o sa handog na pagkain para sa Diyos. Pinili ng pangunahing teksto ang kaugnayan nito sa apoy at inilagay sa talababa ang leksikal na alternatibo upang hindi ikubli ang tunay na usapin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sa piling ng kanyang ina” bilang natural na katumbas ng idyomatikong Hebreo, at pinanatili ang teknikal na pag-igting sa אִשֶּׁה sa pamamagitan ng talababa.
