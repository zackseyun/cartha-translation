  source_fidelity: Tumpak ang pangunahing kondisyon at pagbabalik sa bahay ng ama. Gayunman, ang “mahiwalayan” ay maaaring mangahulugang pansamantalang paghihiwalay at hindi malinaw na katumbas ng גרושה, at ang “pinahihintulutang sambahayan ng pari” ay nagdaragdag ng tiyak na saklaw na wala sa teksto. Ang זרע ay mas ligtas na isalin bilang “supling,” sapagkat maaari itong sumaklaw nang higit sa isang anak o sa mga inapo.
  naturalness: Malinaw at marangal ang Tagalog. Mas natural at mas tiyak sa legal na kalagayan ang “madiborsiyo” kaysa “mahiwalayan.” Ang “taong hindi awtorisado” ay mas maikli at hindi gaanong mapagpalagay kaysa sa paglilimita sa “sambahayan.”
  terminology: Pinananatili ang “pari,” “pagkain,” at “ama.” Ginamit ang “madiborsiyo” bilang modernong legal na katumbas ng “diborsiyada,” at “taong hindi awtorisado” para sa זר nang walang etnikong kahulugan o di-tekstuwal na pagdaragdag.
  issues:
