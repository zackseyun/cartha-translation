    issue: Ang “mahiwalayan” ay hindi tiyak na tumutukoy sa diborsiyo.
    rationale: Ang גרושה ay isang babaeng diborsiyada; ang “mahiwalayan” sa modernong Tagalog ay maaari ring mangahulugan lamang ng paglayo o pagkakahiwalay na walang legal na diborsiyo.
  - severity: medium
    issue: Ang “pinahihintulutang sambahayan ng pari” ay labis na pagtitiyak sa זר.
    rationale: Tinutukoy ng termino ang taong nasa labas ng awtorisadong pangkat; hindi tahasang nililimitahan ng talata ang pangkat na ito sa sambahayan.
  - severity: low
    issue: Ang “anak” ay maaaring mas makitid kaysa sa זרע.
    rationale: Ang “supling” ay mas maayos na sumasaklaw sa legal-pampamilyang diwa ng “seed/offspring,” nang hindi ipinapalagay na iisang anak lamang ang tinutukoy.
