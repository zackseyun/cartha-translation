  to: Ngunit kung ang anak na babae ng isang pari ay mabalo o madiborsiyo, wala siyang supling, at bumalik siya sa bahay ng kanyang ama gaya noong kabataan niya, maaari siyang kumain ng pagkain ng kanyang ama[a]. Ngunit walang taong hindi awtorisado ang maaaring kumain nito[b].
