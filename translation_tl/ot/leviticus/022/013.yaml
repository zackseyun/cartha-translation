  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: tl
  text: Ngunit kung ang anak na babae ng isang pari ay mabalo o madiborsiyo, wala siyang supling, at bumalik siya sa bahay ng kanyang ama gaya noong kabataan niya, maaari siyang kumain ng pagkain ng kanyang ama[a]. Ngunit walang taong hindi awtorisado ang maaaring kumain nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinapay ng kanyang ama.” Dito, malamang na mas malawak itong tumutukoy sa pagkaing laan sa sambahayan ng pari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “walang ibang tao” o “walang taong walang pahintulot.” Ang salitang Hebreo ay tumutukoy sa sinumang nasa labas ng grupong pinahihintulutang kumain, hindi kinakailangang isang dayuhan ayon sa lahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: Ngunit kung ang anak na babae ng isang pari
  rationale: Ipinahihiwatig ng וּ ang kaugnayan at pagsalungat sa naunang tuntunin, habang ang כִּי ay nagpapakilala ng kondisyong legal; natural sa Tagalog ang “Ngunit kung.”
- source_word: אַלְמָנָה וּ/גְרוּשָׁה
  choice: mabalo o mahiwalayan
  rationale: Bagaman pang-ugnay na “at” ang anyong Hebreo, dalawang alternatibong kalagayan ang inililista. Ang “o” ang malinaw na katumbas sa kontekstong legal.
- source_word: וְ/זֶרַע אֵין לָהּ
  choice: wala siyang anak
  rationale: Ang זֶרַע ay literal na “binhi” at maaaring tumukoy sa supling o inapo. Sa kontekstong ito, natural at sapat ang “anak,” nang hindi ginagamit ang di-likas na literalismo.
- source_word: וְ/שָׁבָה אֶל בֵּית אָבִיהָ
  choice: at bumalik siya sa bahay ng kanyang ama
  rationale: Tuwirang pinananatili ang ideya ng pagbabalik sa sambahayang pinagmulan.
- source_word: כִּ/נְעוּרֶיהָ
  choice: gaya noong kabataan niya
  rationale: Pinananatili ang paghahambing sa dati niyang kalagayan sa bahay ng ama, nang hindi dinaragdagan ng tahasang “walang asawa,” na ipinahihiwatig lamang ng konteksto.
- source_word: מִ/לֶּחֶם אָבִיהָ תֹּאכֵל
  choice: maaari siyang kumain sa pagkain ng kanyang ama
  rationale: Ang לֶחֶם ay literal na “tinapay” ngunit maaari ring tumukoy sa pagkain o panustos ng sambahayan. Ang “pagkain” ay malinaw sa modernong Tagalog, at ang “maaari” ay nagpapakita ng legal na pahintulot.
- source_word: וְ/כָל זָר לֹא יֹאכַל בּוֹ
  choice: Ngunit walang sinumang hindi kabilang sa pinahihintulutang sambahayan ng pari ang maaaring kumain nito
  rationale: Sa batas para sa mga pari, ang זָר ay hindi pangunahing tumutukoy sa dayuhan ayon sa lahi kundi sa taong nasa labas ng grupong may pahintulot. Inililinaw ito ng salin nang hindi ginagawang denominasyonal ang kahulugan.
theological_decisions:
- issue: Saklaw ng “pagkain ng kanyang ama” sa batas para sa mga pari
  choice: Isinalin ang לֶחֶם bilang “pagkain,” na maaaring sumaklaw sa mga pagkaing laan sa sambahayan ng pari.
  alternative: “tinapay ng kanyang ama”
  rationale: Pinananatili ng “pagkain” ang metonimikong gamit ng “tinapay” sa konteksto, ngunit hindi sinasabing lahat ng pagkain ng ama ay banal o pare-pareho ang katayuang ritwal.
- issue: Pagkakakilanlan ng זָר
  choice: Taong hindi kabilang sa pinahihintulutang sambahayan o saklaw ng pari.
  alternative: “dayuhan” o “estranghero”
  rationale: Ang terminong Hebreo rito ay nagsasaad ng kawalan ng karapatang kumain, hindi kinakailangang banyagang lahi o nasyonalidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mahiwalayan” para sa diborsiyo sa legal na kalagayan at isang mapaglarawang parirala para sa זָר upang maiwasan ang maling pagkaunawa na etnikong dayuhan ang tinutukoy. Ang mga talababa ay tumutugma sa mga marker [a] at [b] sa pangunahing teksto.
