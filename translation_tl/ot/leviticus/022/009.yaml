source:
  edition: WLC
  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתִּ֗/י וְ/לֹֽא יִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא וּ/מֵ֥תוּ ב֖/וֹ כִּ֣י יְחַלְּלֻ֑/הוּ אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: tl
  text: Tutuparin nila ang tungkuling iniatas ko[a], upang hindi sila pasanin ng kasalanan dahil dito[b] at mamatay dahil dito[c], sapagkat nilapastangan nila ito[d]. Ako si Yahweh na nagpapabanal sa kanila[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Babantayan nila ang aking bilin” o “Susundin nila ang ipinag-utos ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong idyomang “pasanin ang kasalanan” ay maaari ring mangahulugang “managot sa kasalanan dahil dito.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring, “mamatay sa pamamagitan nito” o “mamatay dahil dito.” Hindi tahasang tinutukoy ng Hebreo ang antecedent ng panghalip.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring isaling “gawing di-banal” o “ituring na karaniwan.”
    reason: lexical_alternative
  - marker: e
    text: Maaari ring, “na gumagawa sa kanila na banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: Tutuparin nila ang tungkuling iniatas ko
  rationale: Ang שׁמר ay may diwang ‘ingatan’ o ‘sundin,’ at ang מִשְׁמֶרֶת ay isang ipinagkatiwalang pananagutan o tungkulin. Sa kontekstong pangpari at legal, malinaw at likas sa modernong Tagalog ang ‘tutuparin ... ang tungkuling iniatas ko.’
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: mapasan ang kasalanan dahil dito
  rationale: Pinananatili ng ‘mapasan ang kasalanan’ ang Hebreong idyoma na maaaring tumukoy sa pagdadala ng kasalanan o sa pagkakaroon ng pananagutan dahil dito. Hindi nito nilulutas nang labis ang saklaw ng עָלָיו.
- source_word: וּמֵתוּ בוֹ
  choice: at mamatay dahil dito
  rationale: Ipinahahayag ng ‘dahil dito’ ang ugnayang sanhi na maaaring taglayin ng בּוֹ, habang iniiwang hindi tahasang tinutukoy ang antecedent ng panghalip.
- source_word: יְחַלְּלֻהוּ
  choice: nilapastangan nila ito
  rationale: Sa konteksto ng kabanalan sa Levitico, ang חלל ay nangangahulugang lapastanganin, gawing di-banal, o ituring na karaniwan. Ang ‘lapastanganin’ ay natural ngunit nananatiling matindi at angkop sa sagradong konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh bilang tuwirang representasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מְקַדְּשָׁם
  choice: na nagpapabanal sa kanila
  rationale: Ang participle ng קדשׁ ay naglalarawan kay Yahweh bilang siyang patuloy na nagbubukod o gumagawa sa kanila bilang banal. Ang ‘nagpapabanal’ ay maikli, marangal, at angkop sa bokabularyo ng Levitico.
theological_decisions:
- issue: Tinutukoy ng mga panghalip sa ‘dahil dito’ at ‘ito’
  choice: Pinanatiling pangkalahatan ang mga panghalip at hindi tahasang pinalitan ng ‘banal na pagkain,’ ‘tungkulin,’ o ibang tiyak na pangngalan.
  alternative: Maaaring tumukoy ang mga ito sa banal na pagkain sa agarang konteksto o sa ipinagkatiwalang tungkulin ni Yahweh.
  rationale: Pawang panlalaking isahang panghalip ang ginamit sa Hebreo nang hindi inuulit ang tinutukoy na pangngalan. Ang pagpapanatili sa ‘dito/ito’ ay nag-iingat sa tunay na kalabuan ng teksto.
- issue: Kahulugan ng ‘mapasan ang kasalanan’
  choice: Pinanatili ang metapora ng pagpasan, kalakip ang paliwanag na maaari itong mangahulugang managot sa kasalanan.
  alternative: ‘Magkaroon ng pananagutan sa kasalanan’ o ‘magkasala.’
  rationale: Ang literal na larawan ay nauunawaan sa Tagalog at pinananatili ang tensiyon sa pagitan ng kasalanan mismo at ng pananagutang bunga nito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘tungkuling iniatas’ upang likas na maipahayag ang pananagutang ipinagkatiwala sa mga pari; pinanatili naman ang sagradong bokabularyong ‘lapastanganin’ at ‘nagpapabanal.’ Ang mga panghalip ay sadyang hindi ginawang mas tiyak kaysa sa Hebreo.
