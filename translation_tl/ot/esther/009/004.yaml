translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang paliwanag na ugnayan ng dalawang sugnay at ang pag-uulit ng pangalang Mordecai, habang isinalin nang natural ang mga idyomang Hebreo.
