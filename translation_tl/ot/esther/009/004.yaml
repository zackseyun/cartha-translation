source:
  edition: WLC
  text: כִּֽי גָ֤דוֹל מָרְדֳּכַי֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/שָׁמְע֖/וֹ הוֹלֵ֣ךְ בְּ/כָל הַ/מְּדִינ֑וֹת כִּֽי הָ/אִ֥ישׁ מָרְדֳּכַ֖י הוֹלֵ֥ךְ וְ/גָדֽוֹל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: tl
  text: Sapagkat mataas ang katayuan ni Mordecai sa palasyo ng hari, at kumakalat sa lahat ng lalawigan ang balita tungkol sa kanya[a], sapagkat si Mordecai ay lalo pang nagiging dakila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kanyang katanyagan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “patuloy na lumalakad at nagiging dakila,” isang idyomang Hebreo na nagpapahiwatig ng patuloy na pagtaas ng katayuan o katanyagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag kaugnay ng naunang pahayag sa konteksto.
- source_word: גָדוֹל מָרְדֳּכַי
  choice: mataas ang katayuan ni Mordecai
  rationale: Ang גָדוֹל dito ay tumutukoy sa kadakilaan, katanyagan, o mataas na kalagayan sa maharlikang sambahayan; malinaw sa Filipino ang 'mataas ang katayuan' nang hindi ito nililimitahan sa kapangyarihang pampolitika lamang.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: sa palasyo ng hari
  rationale: Literal itong 'sa bahay ng hari,' ngunit sa konteksto ng Persia ay natural na tumutukoy sa palasyo o maharlikang sambahayan.
- source_word: שָׁמְעוֹ
  choice: ang balita tungkol sa kanya
  rationale: Maaaring mangahulugan ang salita ng balita, ulat, reputasyon, o katanyagan. Pinananatili ng 'balita tungkol sa kanya' ang lawak ng kahulugan nang hindi ipinapalagay na katanyagan lamang ang tinutukoy.
- source_word: הוֹלֵךְ
  choice: kumakalat
  rationale: Kapag ang paksa ay balita o ulat, ipinahihiwatig ng pandiwari ang patuloy na paglaganap; natural itong ipinapahayag sa Filipino bilang 'kumakalat.'
- source_word: בְּכָל הַמְּדִינוֹת
  choice: sa lahat ng lalawigan
  rationale: Ang מְדִינוֹת ay mga administratibong lalawigan ng imperyo sa konteksto ng Esther.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: si Mordecai
  rationale: Hindi natural sa modernong Filipino ang literal na 'ang lalaking si Mordecai' sa pangungusap na ito. Naipahahayag ng tahasang pag-uulit ng pangalan ang diin ng Hebreo.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: lalo pang nagiging dakila
  rationale: Isa itong idyomang Hebreo para sa patuloy at papataas na kadakilaan o katanyagan. Natural na ipinahahayag ng 'lalo pang nagiging dakila' ang progresibong diwa.
