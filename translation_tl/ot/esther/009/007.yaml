translation:
  language: tl
  text: sina Parsandata[a], Dalfon, at Aspata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ito ang unang tatlong pangalan sa talaan ng mga anak ni Haman. Ipinagpapatuloy ng talatang ito ang pahayag sa naunang talata na pinatay sila ng mga Judio.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵת
  choice: sina / kuwit at “at”
  rationale: Ang אֵת ay pananda ng tiyak na tuwirang layon at hindi kailangang isalin nang hiwalay. Ang paulit-ulit na וְאֵת ay kinakatawan ng natural na pag-uugnay sa isang talaan; ginamit ang “sina” dahil mga pangalan ng tao ang kasunod at nagpapatuloy ang mga ito bilang layon ng pandiwa sa naunang talata.
- source_word: פַּרְשַׁנְדָּתָא
  choice: Parsandata
  rationale: Pangngalang pantangi na malamang ay mula sa Persiano; tinumbasan sa baybay na natural sa Filipino, kung saan ang Hebrew שׁ ay “s” at ang תּ ay “t” sa halip na English na “sh” at “th.”
- source_word: דַּלְפוֹן
  choice: Dalfon
  rationale: Pangngalang pantangi; ang anyong ito ay tuwirang transliterasyon na angkop sa baybay at bigkas ng Filipino.
- source_word: אַסְפָּתָא
  choice: Aspata
  rationale: Pangngalang pantangi; pinanatili ang anyo ng pangalan sa baybay na natural sa Filipino, gamit ang “t” para sa תּ.
