  register: Maikli at dignified na modernong Filipino. Pinanatili ang anyong talaan at ang pagkakaugnay nito sa pandiwa ng naunang talata. Ginamit ang “sina” upang maging malinaw at natural na mga tao ang nakatalang tuwirang layon.
