source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: tl
  text: At ang iba pang mga Judio na nasa mga lalawigan ng hari ay nagtipon at tumindig upang ipagtanggol ang kanilang buhay[a]. Nagkaroon sila ng ginhawa mula sa kanilang mga kaaway at pumatay sila ng pitumpu't limang libo sa mga napopoot sa kanila; ngunit hindi nila kinuha ang mga samsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tumindig para sa kanilang buhay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: At ang iba pang mga Judio
  rationale: Ipinapakita ng שְׁאָר ang natitirang pangkat, bilang kaibahan sa mga Judio sa Susa; natural sa makabagong Tagalog ang “iba pang mga Judio.”
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: na nasa mga lalawigan ng hari
  rationale: Ang מְדִינוֹת ay mga administratibong lalawigan ng kaharian.
- source_word: נִקְהֲלוּ
  choice: nagtipon
  rationale: Tumutukoy ito sa sama-samang pagtitipon ng mga Judio bilang tugon sa banta at sa utos ng hari.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: upang ipagtanggol ang kanilang buhay
  rationale: Ang literal na larawang “tumayo para sa kanilang buhay” ay isang idyoma ng paninindigan upang iligtas o ipagtanggol ang sarili; malinaw at natural sa Tagalog ang napiling salin.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: Nakalaya sila sa kanilang mga kaaway
  rationale: Ang נוּחַ dito ay pagkakaroon ng kapahingahan o ginhawa mula sa mga kaaway; ipinahahayag ng “nakalaya” ang pagtatapos ng kanilang pananalakay nang hindi nagdaragdag ng paliwanag.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: at pumatay ... sa mga napopoot sa kanila
  rationale: Tuwirang inilalarawan ng parirala ang pagpatay sa bilang na kabilang sa kanilang mga napopoot; pinananatili ang matinding kahulugan ng שֹׂנְאֵיהֶם.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: pitumpu't limang libo
  rationale: Karaniwan at malinaw na ayos ng bilang sa Tagalog.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: Ngunit hindi nila ginalaw ang mga nasamsam
  rationale: Ang literal na “hindi nila iniunat/ipinadala ang kanilang kamay” ay idyoma ng hindi pagkuha; ang “hindi ginalaw” ay likas na idyomang Tagalog, at ang בִּזָּה ay mga ari-ariang maaaring samsamin sa digmaan.
theological_decisions:
- issue: Moral na paglalarawan sa ginawa ng mga Judio
  choice: upang ipagtanggol ang kanilang buhay
  alternative: tumayo para sa kanilang buhay; ipinagtanggol ang kanilang sarili
  rationale: Malinaw na iniuugnay ng Hebreong parirala ang kanilang pagkilos sa pangangalaga sa buhay. Pinananatili nito ang konteksto ng pagtatanggol sa sarili nang hindi pinapahina ang karahasang tahasang isinasalaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Judio,” “lalawigan,” at “mga nasamsam” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay. Ang marker na [a] ay inilagay mismo sa pangunahing teksto.
