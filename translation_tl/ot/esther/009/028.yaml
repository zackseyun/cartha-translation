translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘salinlahi,’ ‘angkan,’ ‘lalawigan,’ at ‘mga inapo’ upang mapanatili ang saklaw at solemneng himig ng Hebreo nang hindi nagiging lipas o labis na literal.
