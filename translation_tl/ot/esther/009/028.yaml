  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: tl
  text: Ang mga araw na ito ay aalalahanin at ipagdiriwang[a] sa bawat salinlahi, sa bawat angkan, sa bawat lalawigan, at sa bawat lungsod.[b] Ang mga araw na ito ng Purim ay hindi mawawala sa gitna ng mga Judio, at ang pag-alaala sa mga ito ay hindi maglalaho sa kanilang mga inapo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aalalahanin at tutuparin.” Literal na “gagawin” ang pandiwang isinaling “ipagdiriwang,” at tumutukoy ito sa aktuwal na pagsasagawa ng kapistahan.
    reason: lexical_alternative
  - marker: b
    text: O “sa salinlahi at salinlahi, angkan at angkan, lalawigan at lalawigan, at lungsod at lungsod.” Gumagamit ang Hebreo ng inuulit na pangngalang isahan upang idiin ang saklaw sa bawat isa.
    reason: lexical_alternative
  - marker: c
    text: O “at ang alaala ng mga ito ay hindi magwawakas sa kanilang mga inapo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: aalalahanin
  rationale: Tuwirang ipinapahayag ang patuloy na pag-iingat sa alaala ng mga araw na ito, habang ang kasunod na pandiwa ang nagpapahayag ng aktuwal na pagdiriwang.
- source_word: וְנַעֲשִׂים
  choice: at ipagdiriwang
  rationale: Literal itong ‘gagawin,’ ngunit sa konteksto ng mga araw ng kapistahan ay tumutukoy sa aktuwal na pagtupad o pagdiriwang sa mga ito.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: sa bawat salinlahi
  rationale: Inihahatid nito ang distributibong diwa ng bawat sunod-sunod na henerasyon sa natural at marangal na Tagalog.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: sa bawat angkan
  rationale: Ang inuulit na pangngalan ay distributibo. Pinili ang ‘angkan’ dahil maaaring saklawin ng מִשְׁפָּחָה ang mas malawak na pangkat ng magkakamag-anak kaysa nuklear na pamilya.
- source_word: מְדִינָה וּמְדִינָה
  choice: sa bawat lalawigan
  rationale: Sa Esther, tumutukoy ito sa administratibong lalawigan ng Imperyo ng Persia.
- source_word: וְעִיר וָעִיר
  choice: at sa bawat lungsod
  rationale: Natural na inililipat ng ‘bawat lungsod’ ang distributibong pag-uulit sa Hebreo.
- source_word: יְמֵי הַפּוּרִים
  choice: mga araw ng Purim
  rationale: Pinananatili ang ugnayang konstruktibo at ang kinikilalang transliterasyon ng pangalan ng kapistahan.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: ay hindi mawawala sa mga Judio
  rationale: Ipinahahayag ng עבר kasama ng מִתּוֹךְ ang hindi pagkawala ng mga araw na ito mula sa buhay at kaugalian ng pamayanang Judio.
- source_word: וְזִכְרָם
  choice: at ang pag-alaala sa mga ito
  rationale: Malinaw na ibinabalik ang panghalip sa mga araw ng Purim at pinananatili ang diwang komemoratibo.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: ay hindi maglalaho sa kanilang mga inapo
  rationale: Ang יסוף ay ‘matapos’ o ‘maglaho,’ at ang זֶרַע rito ay tumutukoy sa mga susunod na salinlahi o inapo.
