base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: tl
  text: At nagpadala siya ng mga liham sa lahat ng Judio sa 127 lalawigan ng kaharian ni Ahasuerus,[a] na naglalaman ng mga salita ng kapayapaan at katotohanan.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ahasuerus ay ang Hebreong anyo ng pangalan; iniuugnay siya ng ilan sa kasaysayan kay Xerxes I.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin na “isang mensahe ng kapayapaan at katotohanan.” Literal sa Hebreo: “mga salita ng kapayapaan at katotohanan.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “katotohanan” ay maaari ring maunawaan dito bilang “katapatan” o “pagiging maaasahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: At nagpadala siya
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay. Pinananatili ng “At” ang pagkakaugnay sa naunang pangyayari nang hindi nagdaragdag ng tiyak na pansamantalang diwa.
- source_word: סְפָרִים
  choice: mga liham
  rationale: Sa kontekstong administratibo ng Persia, tumutukoy ito sa mga nakasulat na komunikasyong ipinadala sa buong kaharian; likas at malinaw sa Filipino ang “mga liham.”
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: sa lahat ng Judio
  rationale: Kolektibo ang parirala at tumutukoy sa buong pamayanang Judio sa nasasakupan.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: sa 127 lalawigan
  rationale: Ipinahihiwatig ng ikalawang אֶל ang heograpikong saklaw ng mga tatanggap. Ang “sa” ay natural na nagpapakitang nasa mga lalawigang iyon ang mga Judio.
- source_word: מְדִינָה
  choice: lalawigan
  rationale: Tumutukoy ito sa mga administratibong rehiyon ng Imperyo ng Persia; “lalawigan” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: kaharian ni Ahasuerus
  rationale: Tuwirang ipinapahayag nito ang ugnayang nasa construct chain at hindi idinaragdag ang titulong “Haring,” na wala sa pariralang Hebreo rito.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuerus
  rationale: Pinananatili ang anyo ng pangalan sa Hebreo sa halip na palitan ito ng isang historikal na pagkakakilanlan.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: mga salita ng kapayapaan at katotohanan
  rationale: Pinananatili nito ang literal at pormal na hulma ng Hebreo. Ang שָׁלוֹם ay kapayapaan o mabuting kalagayan, at ang אֱמֶת ay katotohanan na maaari ring magpahiwatig ng pagiging tapat o maaasahan.
