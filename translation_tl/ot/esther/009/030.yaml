- from: At nagpadala siya ng mga liham sa lahat ng Judio sa 127 lalawigan ng kaharian ni Ahasuerus,[a] na may mga salita ng kapayapaan at katotohanan.[b][c]
  to: At nagpadala siya ng mga liham sa lahat ng Judio sa 127 lalawigan ng kaharian ni Ahasuerus,[a] na naglalaman ng mga salita ng kapayapaan at katotohanan.[b][c]
  rationale: Ginawang mas natural ang ugnayan ng mga liham at ng “mga salita ng kapayapaan at katotohanan,” nang hindi pinapalitan ang literal na larawan o ang saklaw ng Hebreo. Pinakinis din ang talababa tungkol sa Ahasuerus at pinanatili ang maingat, hindi mapagpasyang historikal na pagkakaugnay.
