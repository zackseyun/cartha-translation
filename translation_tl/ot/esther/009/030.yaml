  source_fidelity: Tumpak na naisasalin ang salaysay na “nagpadala,” ang mga liham, ang lahat ng Judio, ang 127 lalawigan, ang kaharian ni Ahasuerus, at ang pangwakas na pariralang “mga salita ng kapayapaan at katotohanan.” Hindi idinadagdag ng salin ang pagkakakilanlan ni Ahasuerus kay Xerxes sa mismong talata.
  naturalness: Nauunawaan ang draft, ngunit ang “mga liham ... na may mga salita” ay bahagyang mabigat at paulit-ulit sa makabagong Filipino. Ang “na naglalaman ng mga salita” ay mas malinaw na ikinakabit ang pangwakas na parirala sa nilalaman ng mga liham habang pinananatili ang literal na “mga salita.”
  terminology: Ang “Judio,” “lalawigan,” “kaharian,” “Ahasuerus,” “kapayapaan,” at “katotohanan” ay angkop sa marangal at makabagong rehistro. Ang talababa tungkol sa אֱמֶת ay wastong nagpapanatili ng mga posibleng nuance na “katapatan” at “pagiging maaasahan.”
