revisions:
- from: Sinabi ng hari kay Reyna Ester, “Sa kuta ng Susa, pinatay at nilipol ng mga Judio ang limang daang lalaki, pati ang sampung anak ni Haman. Ano pa kaya ang ginawa nila sa iba pang mga lalawigan ng hari?[a] Ngayon, ano ang iyong kahilingan? Ipagkakaloob iyon sa iyo. At ano pa ang iyong hinihiling? Gagawin iyon.”
  to: Sinabi ng hari kay Reyna Ester, “Sa kuta ng Susa, pinatay at nilipol ng mga Judio ang limang daang lalaki, pati ang sampung anak ni Haman. Ano kaya ang ginawa nila sa natitirang mga lalawigan ng hari?[a] Ngayon, ano ang iyong kahilingan? Ipagkakaloob iyon sa iyo. At ano pa ang iyong hinihiling? Gagawin iyon.”
  rationale: Inalis ang “pa” mula sa unang tanong upang hindi magdagdag ng kahulugang “ano pang iba,” at pinalitan ang “iba pang” ng “natitirang” upang mas tuwirang maipahayag ang שְׁאָר. Iniayon din ang talababa sa binagong pangunahing teksto.
