  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: tl
  text: Sinabi ng hari kay Reyna Ester, “Sa kuta ng Susa, pinatay at nilipol ng mga Judio ang limang daang lalaki, pati ang sampung anak ni Haman. Ano kaya ang ginawa nila sa natitirang mga lalawigan ng hari?[a] Ngayon, ano ang iyong kahilingan? Ipagkakaloob iyon sa iyo. At ano pa ang iyong hinihiling? Gagawin iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ano ang ginawa nila sa natitirang mga lalawigan ng hari?” Maaaring basahin nang payak ang tanong sa Hebreo; ipinahihiwatig ng “kaya” sa pangunahing teksto na naghihinuha ang hari mula sa ulat tungkol sa Susa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: Sa kuta ng Susa
  rationale: Ang בִּירָה ay tumutukoy sa napapaderang sentrong maharlika o citadel. Likas at malinaw sa modernong Filipino ang “kuta ng Susa.”
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: pinatay at nilipol
  rationale: Pinananatili ang dalawang pandiwang Hebreo at ang pinatinding diin ng magkatambal na kilos.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: limang daang lalaki
  rationale: Ang אִישׁ ay ginamit nang distributibo pagkatapos ng bilang; tuwirang salin ang “lalaki” at angkop ito sa konteksto.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: pati ang sampung anak ni Haman
  rationale: Malinaw at natural na ipinapakita ng “pati” na karagdagang tuwirang layon ang mga anak ni Haman.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: sa iba pang mga lalawigan ng hari
  rationale: Ang “mga lalawigan” ay angkop sa administrasyong Persiano, at natural na naihahayag ng “iba pang” ang nalalabing mga lalawigan.
- source_word: מֶה עָשׂוּ
  choice: Ano pa kaya ang ginawa nila
  rationale: Pinananatili ang anyong tanong habang ipinahihiwatig ng “kaya” ang posibleng paghinuha ng hari mula sa nangyari sa Susa. Hindi nito ginagawang tiyak ang retorikal na pagbasa.
- source_word: שְּׁאֵלָתֵךְ
  choice: iyong kahilingan
  rationale: Ang “kahilingan” ay angkop sa pormal na pakiusap sa hari at may marangal na rehistro.
- source_word: וְיִנָּתֵן לָךְ
  choice: Ipagkakaloob iyon sa iyo
  rationale: Sa konteksto ng pakiusap sa hari, likas na katumbas ng pasibong נתן ang “ipagkakaloob.”
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: ano pa ang iyong hinihiling
  rationale: Inihahayag ng “pa” ang karagdagang kahilingan, habang bahagyang iniiba ng pandiwang “hinihiling” ang pananalita mula sa naunang “kahilingan” nang hindi lumilikha ng di-nararapat na pagkakaiba.
- source_word: וְתֵעָשׂ
  choice: Gagawin iyon
  rationale: Tuwiran at natural nitong ipinahahayag na isasagawa ang karagdagang hiling ni Ester.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Reyna Ester” bilang natural na anyo ng אֶסְתֵּר הַמַּלְכָּה, at pinanatili ang pormal na himig ng pakikipag-usap sa hari.
