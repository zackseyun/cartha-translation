id: EST.9.1
reference: Esther 9:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: tl
  text: 'Sa ikalabindalawang buwan, na siyang buwan ng Adar, sa ikalabintatlong araw nito, nang dumating ang panahon upang isagawa ang salita ng hari at ang kanyang kautusan—sa araw na umasa ang mga kaaway ng mga Judio na paghaharian sila—kabaligtaran ang nangyari[a]: ang mga Judio mismo ang naghari sa mga napopoot sa kanila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nabáligtad ang kalagayan” o “bumaligtad ito.”
    reason: Pinananatili ang mga posibleng idyomatikong salin ng Hebreong וְנַהֲפוֹךְ הוּא.
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: Sa ikalabindalawang buwan
  rationale: Tuwirang temporal na panimula; hindi dinagdagan ng hiwalay na panandang katumbas ng “ngayon” dahil wala nito sa Hebreo.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: na siyang buwan ng Adar
  rationale: Likas na paliwanag sa Filipino na tumutukoy kung ano ang ikalabindalawang buwan.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: sa ikalabintatlong araw nito
  rationale: Pinananatili ang tahasang pagtukoy ng panghalip sa buwan.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: nang dumating ang panahon upang isagawa ang salita ng hari at ang kanyang kautusan
  rationale: Ipinahahayag ang kontekstuwal na diwa ng הִגִּיעַ bilang pagsapit ng takdang panahon ng pagpapatupad, habang pinananatili ang pagkakaiba ng דְּבַר (“salita”) at דָת (“kautusan”).
- source_word: שִׂבְּרוּ
  choice: umasa
  rationale: Sinasalamin ang pag-asa o inaasahan ng mga kaaway, pati ang ironiya ng sumunod na pagbaligtad.
- source_word: לִשְׁלֹט בָּהֶם
  choice: na paghaharian sila
  rationale: Natural na Filipino para sa paggamit ng kapangyarihan o paghahari laban sa kanila.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: kabaligtaran ang nangyari
  rationale: Malinaw at likas na idyomatikong pahayag ng biglang pagbaligtad ng inaasahang kalagayan.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: ang mga Judio mismo ang naghari
  rationale: Ang “mismo” ay nagpapanatili sa diin ng הֵמָּה at sa matinding paghahambing sa inaasahan ng kanilang mga kaaway.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: sa mga napopoot sa kanila
  rationale: 'Pinananatili ang pandiwang diwa ng participle: hindi lamang mga kaaway kundi mga taong napopoot sa kanila.'
