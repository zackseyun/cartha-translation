base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: tl
  text: Ngunit nang humarap siya sa hari, iniutos nito sa pamamagitan ng sulat[a] na ang masamang pakana ni Haman na pinlano niya laban sa mga Judio ay bumalik sa sarili niyang ulo; at ibinitin siya at ang kanyang mga anak sa poste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sinabi niya kasama ng kasulatan” o “sinabi niya sa pamamagitan ng sulat.” Ang diwa ay nagpalabas ang hari ng nakasulat na utos.'
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay maaaring tumukoy sa pagbibitin o pagtuhog, at ang salitang isinaling “poste” ay literal na “puno” o “kahoy.” Maaaring isang tulos o kahoy na poste ito, hindi kinakailangang isang makabagong bitayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: nang humarap siya
  rationale: Ang pambabaeng panghalip ay likas na tumutukoy kay Esther sa konteksto; ipinahahayag ng “humarap” ang pagpasok niya sa presensiya ng hari nang hindi inuulit ang pangalan.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa hari
  rationale: Kasama ng “humarap,” natural nitong ipinahahayag ang Hebreong idyoma na pagharap sa presensiya ng hari.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: iniutos nito sa pamamagitan ng isang nakasulat na utos
  rationale: Siksik at di-pangkaraniwan ang Hebreo, na literal na “sinabi niya kasama/sa pamamagitan ng kasulatan.” Ipinakikita ng konteksto na nagpalabas ang hari ng nakasulat na kautusan.
- source_word: יָשׁוּב
  choice: bumalik
  rationale: Pinananatili nito ang larawan ng masamang balak na bumabalik sa nagbalak.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: ang masama niyang balak
  rationale: Natural na Filipino ito para sa planong may masamang layunin; hindi na kailangang ulitin ang magkaugat na pangngalan at pandiwa sa Hebreo.
- source_word: עַל הַיְּהוּדִים
  choice: laban sa mga Judio
  rationale: Ang עַל ay may malinaw na mapanlabang diwa sa kontekstong ito.
- source_word: עַל רֹאשׁוֹ
  choice: sa sariling ulo ni Haman
  rationale: Pinananatili ang idyoma ng ganting pagbabalik. Nililinaw ang tinutukoy ng panghalip sa paraang natural sa Filipino.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו
  choice: ibinitin siya at ang kanyang mga anak
  rationale: Ang תלה ay tumutukoy sa pagbibitin o paglalagay sa isang kahoy na kasangkapang pamparusa; hindi tiyak sa salita lamang kung pagbigti o pagtuhog ang eksaktong paraan.
- source_word: עַל הָעֵץ
  choice: sa poste
  rationale: Ang עֵץ ay literal na kahoy o puno at sa Esther ay maaaring isang tulos o kahoy na poste; ang “poste” ay mas kaunti ang modernong palagay na ipinapasok kaysa “bitayan.”
