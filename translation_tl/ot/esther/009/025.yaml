  to: Ngunit nang humarap siya sa hari, iniutos nito sa pamamagitan ng sulat[a] na ang masamang pakana ni Haman na pinlano niya laban sa mga Judio ay bumalik sa sarili niyang ulo; at ibinitin siya at ang kanyang mga anak sa poste[b].
