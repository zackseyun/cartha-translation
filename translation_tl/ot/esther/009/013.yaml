base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: tl
  text: Sinabi ni Esther, “Kung ikalulugod ng hari, ipahintulot sa mga Judiong nasa Susa na kumilos din sila bukas ayon sa utos sa araw na ito. At ibitin sa kahoy[a] ang sampung anak ni Haman.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibitin sa puno,” “ibitin sa bitayan,” o “itulos sa tulos.” Literal na “sa kahoy/puno” ang Hebreo; sa kontekstong ito, tumutukoy ito sa isang estrukturang pambitay.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Kung ikalulugod ng hari
  rationale: Likas at magalang na pormula ito ng paghiling sa hari; tumutukoy ito sa pagsang-ayon ng hari, hindi sa moral na kabutihan.
- source_word: יִנָּתֵן
  choice: ipahintulot
  rationale: Ipinahahayag ng pasibong anyong jussive ang kahilingan para sa opisyal na pahintulot; natural itong isinasalin sa Filipino bilang “ipahintulot.”
- source_word: גַּם מָחָר
  choice: din bukas
  rationale: Nililinaw nitong hinihiling na palawigin hanggang kinabukasan ang pahintulot na umiiral sa araw na iyon.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: sa mga Judiong nasa Susa
  rationale: Pinananatili ang mga Judio bilang tumatanggap ng pahintulot at ang Susa bilang tiyak na lugar.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: na gawin ang ayon sa utos para sa araw na ito
  rationale: Ang דָּת ay opisyal na utos sa konteksto ng korte ng Persia. Hindi tinutukoy nang higit sa Hebreo kung ano ang “gawin,” kaya pinananatiling malawak ang pandiwa.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ang sampung anak ni Haman
  rationale: Natural na Filipino para sa Hebreong construct phrase at malinaw ang bilang.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: ibitin sa kahoy
  rationale: Pinananatili ng “ibitin” ang pangunahing diwa ng תלה, samantalang ang “kahoy” ay mas malapit sa literal at sadyang malawak na עֵץ kaysa sa tiyak na “bitayan.” Inilalahad sa talababa ang posibleng anyo ng estruktura.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Ang “Kung ikalulugod ng hari” ay nagpapanatili sa magalang na pananalita sa korte. Pinili ang “utos” bilang karaniwang salitang madaling maunawaan para sa opisyal na royal decree, at iniwasang gawing mas tiyak kaysa sa Hebreo ang paraan ng pagbitin o paglalantad sa mga anak ni Haman.
