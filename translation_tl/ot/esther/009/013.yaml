revisions:
- from: Sinabi ni Esther, “Kung ikalulugod ng hari, ipahintulot din bukas sa mga Judiong nasa Susa na gawin ang ayon sa utos para sa araw na ito. At ibitin sa kahoy[a] ang sampung anak ni Haman.”
  to: Sinabi ni Esther, “Kung ikalulugod ng hari, ipahintulot sa mga Judiong nasa Susa na kumilos din sila bukas ayon sa utos sa araw na ito. At ibitin sa kahoy[a] ang sampung anak ni Haman.”
  rationale: Inayos ang pangunahing sugnay upang maging malinaw at likas na ang pahintulot ay para sa mga Judio sa Susa na kumilos muli kinabukasan ayon sa utos na umiiral sa araw na iyon. Iningatan ang malawak na diwa ng pandiwang Hebreo sa “kumilos,” at hindi tinukoy ang eksaktong paraan ng pagbitay higit sa ipinahihiwatig ng teksto. Inayos din ang talababa upang manatiling leksikal at hindi magdagdag ng di-tahasang detalye.
