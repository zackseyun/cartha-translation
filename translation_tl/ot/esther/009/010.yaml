  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: tl
  text: Pinatay nila ang sampung anak na lalaki ni Haman—na anak ni Hamedata at kaaway ng mga Judio—ngunit hindi nila kinuha ang samsam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ang sampung anak na lalaki ni Haman
  rationale: Ang bilang ay nasa construct na parirala kasama ng mga anak ni Haman. Nililinaw ng “anak na lalaki” na ang tinutukoy ay ang sampung lalaking anak na nakalista sa naunang mga talata.
- source_word: בֶּן הַמְּדָתָא
  choice: na anak ni Hamedata
  rationale: Appositional na pagkakakilanlan kay Haman; isinalin ang ugnayang genealogical at tinumbasan sa makabagong baybay-Tagalog ang pangalang Hebreo.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: ang kaaway ng mga Judio
  rationale: Ang צֹרֵר ay tumutukoy sa taong napopoot, kumakalaban, o nagpapahirap. Ang “kaaway” ang malinaw at likas na katumbas sa kontekstong ito.
- source_word: הָרָגוּ
  choice: pinatay nila
  rationale: Tuwirang katumbas ng qatal 3cp ng הרג; natural at malinaw sa modernong Filipino.
- source_word: וּבַבִּזָּה
  choice: ngunit ... ang mga nasamsam
  rationale: Ang בִּזָּה ay samsam o ari-ariang maaaring kunin matapos ang labanan. Ginawang adversative ang waw bilang “ngunit” dahil malinaw na ikinokontrast ang pagpatay sa hindi pagkuha ng samsam.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: hindi nila ginalaw
  rationale: Idyoma ito para sa hindi pag-abot upang kunin o angkinin ang isang bagay. Ang “hindi ginalaw” ay natural sa Filipino at ipinahihiwatig na hindi nila kinuha ang samsam.
