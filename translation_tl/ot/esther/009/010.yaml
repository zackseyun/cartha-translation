translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang appositional na paglalarawan kay Haman at ang kontrast sa pagitan ng pagpatay sa kanyang mga anak at ng sadyang hindi pagkuha sa samsam.
