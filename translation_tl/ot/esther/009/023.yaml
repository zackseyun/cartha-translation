  register: Modernong Filipino na malinaw at marangal. Pinanatili ang dalawang magkatulad na layon ng “tinanggap,” ngunit inayos ang ikalawa bilang “ang isinulat sa kanila ni Mardoqueo” upang maging natural ang pangungusap. Inilagay ang panandang [a] kaagad pagkatapos ng pariralang may leksikal na alternatibo.
