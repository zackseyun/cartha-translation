  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: tl
  text: Kaya tinanggap ng mga Judio ang nasimulan na nilang gawin[a] at ang isinulat ni Mardoqueo sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inako ang nasimulan na nilang gawin.” Ang pandiwang Hebreo ay maaari ring mangahulugang tumanggap o umako ng isang gawain o pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: tinanggap
  rationale: Ipinahihiwatig dito ng קבל ang pagtanggap o pag-ako sa isang gawain o pananagutan. Likas sa Filipino ang “tinanggap” at pinananatili nito ang lawak ng kahulugan nang hindi labis na binibigyang-diin ang kusang pagpapasiya.
- source_word: הַיְּהוּדִים
  choice: ang mga Judio
  rationale: Tuwirang salin ng tiyak na katawagang etnorelihiyoso; karaniwan at marangal na anyo sa modernong Filipino.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: ang nasimulan na nilang gawin
  rationale: Inilalarawan nito ang gawaing sinimulan na bago ang kanilang pagtanggap dito. Maayos na ipinapahayag ng “nasimulan na” ang naunang yugto ng kilos.
- source_word: וְאֵת אֲשֶׁר
  choice: at ang
  rationale: Pinananatili ang ikalawang tuwirang layon ng pandiwang “tinanggap” habang natural ang daloy sa Filipino.
- source_word: כָּתַב
  choice: isinulat
  rationale: Ang aspektong naganap ay sapat upang ipakitang nauna nang naisulat ang liham; hindi kailangang gawing tahasang pangnagdaan-sa-nakaraan sa Filipino.
- source_word: מָרְדֳּכַי
  choice: Mardoqueo
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa tradisyong salin-Bibliya sa Filipino.
- source_word: אֲלֵיהֶם
  choice: sa kanila
  rationale: Natural na katumbas ng direksiyon o pinag-ukulan ng nakasulat na pahayag sa Filipino.
