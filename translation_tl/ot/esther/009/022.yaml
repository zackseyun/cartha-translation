revisions:
- from: bilang mga araw na nagkaroon ng kapahingahan ang mga Judio mula sa kanilang mga kaaway, at bilang buwan na nabago para sa kanila mula sa dalamhati tungo sa kagalakan at mula sa pagluluksa tungo sa araw ng pagdiriwang,[a] upang gawin nila ang mga iyon na mga araw ng handaan at kagalakan, ng pagpapadala ng mga bahagi ng pagkain[b] sa isa’t isa,[c] at ng pagbibigay ng mga regalo sa mga dukha.
  to: ang mga araw nang nakapagpahinga ang mga Judio mula sa kanilang mga kaaway, at ang buwan na nabaligtad para sa kanila mula sa dalamhati tungo sa kagalakan at mula sa pagluluksa tungo sa isang mabuting araw,[a] ay gawin nilang mga araw ng handaan at kagalakan, ng pagpapadala ng mga bahagi[b] sa isa’t isa,[c] at ng pagbibigay ng mga kaloob sa mga dukha.
  rationale: Inayos ang sintaks upang maging malinaw at likas sa Filipino ang ugnayan ng mga araw at ng buwang nabaligtad, habang pinananatili ang mahabang daloy ng Hebreo. Pinalitan ang “mga bahagi ng pagkain” ng mas di-tiyak na “mga bahagi,” dahil ang pagkaing kahulugan ay malamang ngunit hindi tahasang isinasaad. Ginawang “nakapagpahinga” ang katumbas ng נָחוּ at “nabaligtad” ang katumbas ng נֶהְפַּךְ upang malinaw na marinig ang ideya ng reversal. Hindi binago ang kahulugan ng talata o nagdagdag ng interpretasyong doktrinal.
