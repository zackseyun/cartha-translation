base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: tl
  text: ang mga araw nang nakapagpahinga ang mga Judio mula sa kanilang mga kaaway, at ang buwan na nabaligtad para sa kanila mula sa dalamhati tungo sa kagalakan at mula sa pagluluksa tungo sa isang mabuting araw,[a] ay gawin nilang mga araw ng handaan at kagalakan, ng pagpapadala ng mga bahagi[b] sa isa’t isa,[c] at ng pagbibigay ng mga kaloob sa mga dukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “tungo sa isang mabuting araw”; maaari ring “tungo sa isang araw ng kapistahan” o “tungo sa isang araw ng pagdiriwang.”
    reason: lexical_alternative
  - marker: b
    text: Literal, “mga bahagi.” Sa konteksto ng handaan, malamang na mga bahagi ng pagkain ang ipinadadala bilang mga kaloob pangkapistahan.
    reason: cultural_note
  - marker: c
    text: Literal, “ang bawat lalaki sa kaniyang kapuwa,” isang distributibong pahayag na tumutukoy sa pagbibigay ng bawat isa sa kapuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ
  choice: nagkaroon ng kapahingahan
  rationale: Ipinahihiwatig ng pandiwang נוח ang pagdating sa kalagayan ng pahinga o ginhawa. Pinananatili ng pariralang ito ang diwa ng pagkakaroon ng katiwasayan mula sa mga kaaway nang hindi dinaragdagan ang teksto.
- source_word: מֵאֹיְבֵיהֶם
  choice: mula sa kanilang mga kaaway
  rationale: Ang מִן ay nagpapahayag ng pagkahiwalay o paglaya mula sa banta; tuwiran at natural itong naihahayag sa Filipino.
- source_word: נֶהְפַּךְ
  choice: nabago
  rationale: Ang Niphal ng הפך ay nagsasaad ng pasibong pagbabago o pagbaligtad ng kalagayan. Ang “nabago” ay malinaw at hindi tinutukoy kung sino ang gumawa ng pagbabago.
- source_word: יָגוֹן
  choice: dalamhati
  rationale: Ang יָגוֹן ay malalim na lungkot o dalamhati. Ang salitang ito ay marangal at malinaw na katapat ng kagalakan.
- source_word: שִׂמְחָה
  choice: kagalakan
  rationale: Tumutukoy ito sa masayang damdamin at pagdiriwang; ang “kagalakan” ay natural at angkop sa dignidad ng salaysay.
- source_word: אֵבֶל
  choice: pagluluksa
  rationale: Mas tiyak ito kaysa pangkalahatang kalungkutan at pinananatili ang pagkakaiba nito sa יָגוֹן.
- source_word: לְיוֹם טוֹב
  choice: tungo sa araw ng pagdiriwang
  rationale: Literal itong “tungo sa mabuting araw,” ngunit sa konteksto ang parirala ay tumutukoy sa isang masayang araw ng kapistahan. Inilagay sa talababa ang literal na anyo upang mapanatili ang leksikal na posibilidad.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: upang gawin nila ang mga iyon
  rationale: Pinananatili nito ang layuning ipinakikilala ng pawatas at ang panghalip na tumutukoy sa mga araw.
- source_word: יְמֵי מִשְׁתֶּה
  choice: mga araw ng handaan
  rationale: Ang מִשְׁתֶּה ay piging o handaan, kadalasang may inumin. Ang “handaan” ay likas sa Filipino at hindi labis na nagtatampok sa pag-inom.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: ng pagpapadala ng mga bahagi ng pagkain
  rationale: Literal na tumutukoy ang מָנוֹת sa mga bahagi o takdang bahagi; sa konteksto ng handaan, malamang na mga bahagi ito ng pagkain na ipinadadala bilang handog. Nililinaw ito sa pangunahing teksto at itinatala ang literal na saklaw sa talababa.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: sa isa’t isa
  rationale: Isa itong panlalaking isahang pormang ginagamit nang distributibo, literal na “ang bawat lalaki sa kaniyang kapuwa.” Likas na ipinahahayag sa Filipino ng “sa isa’t isa” ang gantihang pamamahagi nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: ng pagbibigay ng mga regalo sa mga dukha
  rationale: Ang אֶבְיוֹנִים ay mga taong dukha o nangangailangan. Malinaw at tuwiran ang “mga dukha,” at pinananatili nito ang panlipunang diin ng talata.
theological_decisions:
- issue: Ang saklaw ng panlalaking distributibong pahayag na אִישׁ לְרֵעֵהוּ
  choice: sa isa’t isa
  alternative: ang bawat lalaki sa kaniyang kapuwa
  rationale: Bagaman panlalaking isahan ang literal na porma, idiomatikong distributibo ito at naglalarawan ng gantihang pagbibigay sa komunidad. Iniiwasan ng pangunahing salin ang di-makatwirang paglilimita sa mga lalaki, habang ibinibigay ng talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mahabang sintaktikong daloy ng Hebreo dahil bahagi ang talata ng mas malawak na pangungusap, ngunit gumamit ng likas na mga pariralang Filipino. Ang “Judio,” “dalamhati,” “pagluluksa,” at “mga dukha” ay pormal ngunit karaniwang nauunawaan.
