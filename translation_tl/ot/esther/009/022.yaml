  terminology: Ang “mga Judio,” “dalamhati,” “pagluluksa,” “kagalakan,” “handaan,” at “mga dukha” ay angkop. Ginamit ang “mga kaloob” sa halip na “mga regalo” upang umayon sa pormal na rehistro at sa kahulugang “gifts.” Pinanatili sa talababa ang literal na panlalaking distributibong pahayag nang hindi nililimitahan ang pangunahing teksto sa mga lalaki.
