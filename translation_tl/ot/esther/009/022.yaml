  source_fidelity: 'Ang draft ay karaniwang tapat sa Hebreo: naipapakita nito ang pagpapahinga mula sa mga kaaway, ang pagbabaligtad mula dalamhati at pagluluksa tungo sa kagalakan at mabuting araw, ang handaan, at ang pagbibigay sa kapuwa at sa mga dukha. Gayunman, ang “mga bahagi ng pagkain” sa pangunahing teksto ay pinatitiyak ang isang posibilidad na hindi tahasang tinukoy ng מָנוֹת; sapat na ang “mga bahagi,” na may paliwanag sa talababa. Ang “bilang mga araw ... at bilang buwan” ay hindi rin likas o malinaw na Filipino para sa magkaugnay na pagbabalangkas ng Hebreo.'
