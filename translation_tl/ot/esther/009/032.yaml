  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “utos,” “pinagtibay,” at “mga tuntunin” upang maipahayag ang opisyal na konteksto nang hindi labis na tinutukoy ang uri ng dokumento o ang eksaktong saklaw ng mga probisyon.
