base_translation:
  language: en
  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: tl
  text: Pinagtibay ng utos ni Ester ang mga usaping ito tungkol sa Purim[a], at isinulat ito sa aklat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang mga salitang ito tungkol sa Purim” o “ang mga tuntuning ito tungkol sa Purim.”'
    reason: Ang Hebreong דִּבְרֵי ay literal na “mga salita” ngunit maaari ring tumukoy sa mga usapin o bagay; hindi ito dapat limitahan sa mga tuntunin lamang.
  - marker: b
    text: 'Maaari ring: “at itinala ito sa aklat.”'
    reason: Ang “itinala” ay posibleng administratibong pagpapahayag ng pasibong Hebreong “isinulat.”
lexical_decisions:
- source_word: מַאֲמַר
  choice: utos
  rationale: Sa kontekstong opisyal, tumutukoy ito sa makapangyarihang pahayag o tagubilin ni Ester, hindi lamang sa isang karaniwang salita.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong saling Tagalog.
- source_word: קִיַּם
  choice: pinagtibay
  rationale: Ipinahihiwatig ng pandiwa ang pagpapatatag o pagpapatunay sa isang umiiral na tuntunin o pagdiriwang; ang “pinagtibay” ay natural sa legal at administratibong konteksto.
- source_word: דִּבְרֵי
  choice: mga tuntunin
  rationale: Bagaman literal na “mga salita,” maaari itong tumukoy sa mga usapin, probisyon, o tuntuning may kinalaman sa opisyal na pagdiriwang. Inilalagay sa talababa ang mas malawak na alternatibo.
- source_word: הַפֻּרִים הָאֵלֶּה
  choice: ito tungkol sa Purim
  rationale: Napananatili ang demonstratibong “ito” at ang pangalan ng kapistahan, habang iniaangkop ang ayos sa natural na Tagalog.
- source_word: וְנִכְתָּב
  choice: at isinulat ito
  rationale: Tuwirang ipinapakita ang pasibong anyo ng Hebreo. Hindi nililinaw nang higit sa teksto kung ang tinutukoy ng “ito” ay ang utos o ang mga tuntunin.
- source_word: בַּסֵּפֶר
  choice: sa aklat
  rationale: Tuwirang katumbas na hindi nagpapalagay kung aling partikular na aklat, balumbon, o opisyal na talaan ang tinutukoy.
