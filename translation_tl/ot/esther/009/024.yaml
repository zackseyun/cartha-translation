  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: tl
  text: Sapagkat si Haman na anak ni Hamedata, na Agagita, ang kaaway ng lahat ng Judio, ay nagbalak laban sa mga Judio upang lipulin sila. Inihagis niya ang Pur[a]—iyon ay, ang bunot—upang guluhin[b] at lipulin sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Pur ay salitang hiram mula sa Persyano. Ipinaliliwanag ito mismo ng talata bilang “bunot”; pinanatili ang Pur upang makita ang kaugnayan nito sa pangalang Purim.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “lituhin,” “sindakin,” o “durugin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag sa pagdiriwang na tinatalakay sa konteksto.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: si Haman na anak ni Hamedata, na Agagita
  rationale: Isinalin sa karaniwang anyong Filipino ang mga pangalang pantangi at pinanatili ang Agagita bilang katawagang etniko o dinastiko.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: ang kaaway ng lahat ng Judio
  rationale: Malinaw at natural na ipinapahayag ng “kaaway” ang aktibong pagkapoot ng participle, habang pinananatili ng “lahat” ang saklaw ng Hebreo.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: nagbalak laban sa mga Judio
  rationale: Sa konteksto, ang parirala ay tumutukoy sa masamang pakana, hindi lamang sa pag-iisip.
- source_word: לְאַבְּדָם ... וּלְאַבְּדָם
  choice: upang lipulin sila ... at lipulin sila
  rationale: Ang “lipulin” ay angkop sa layuning ganap na puksain ang isang pangkat at pinananatili ang pag-uulit sa Hebreo.
- source_word: וְהִפִּיל פּוּר
  choice: Inihagis niya ang Pur
  rationale: Pinananatili ang konkretong kilos ng paghahagis at ang salitang hiram na Pur upang manatili ang kaugnayan nito sa pangalang Purim.
- source_word: הוּא הַגּוֹרָל
  choice: ibig sabihin, ang palabunot
  rationale: Ginagawang malinaw na ang kasunod na parirala ay paliwanag sa salitang Pur; ang “palabunot” ay natural na katawagan sa bagay o paraang ginagamit upang magpasya sa pamamagitan ng lots.
- source_word: לְהֻמָּם
  choice: upang lituhin sila
  rationale: Ang pandiwa ay maaaring tumukoy sa pagdudulot ng kalituhan, sindak, o pagkawasak. Pinananatili ng “lituhin” ang pangunahing diwa nang hindi isinasara ang mas malawak na puwersa ng salita.
