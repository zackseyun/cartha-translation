  register: Makabagong Filipino na malinaw at marangal ang himig. Pinanatili ang paliwanag na Pur—palabunot at ang pag-uulit ng “lipulin sila,” habang inilagay sa talababa ang tunay na lawak ng kahulugan ng לְהֻמָּם.
