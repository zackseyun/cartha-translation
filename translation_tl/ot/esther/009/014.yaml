- from: Kaya sinabi ng hari na gawin iyon. Isang utos ang inilabas sa Susa, at ibinitin[a] ang sampung anak na lalaki ni Haman.
  to: Sinabi ng hari na gawin ang gayon. Isang kautusan ang inilabas sa Susa, at ibinitin[a] ang sampung anak na lalaki ni Haman.
  rationale: Inalis ang “Kaya” upang huwag magdagdag ng ugnayang lohikal na hindi malinaw sa Hebreo, at pinalitan ang “utos” ng “kautusan” upang masaklaw ang administratibong diwa ng דָּת. Pinanatili ang kalabuan ng תלה sa pangunahing teksto at talababa.
