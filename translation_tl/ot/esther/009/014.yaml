  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: tl
  text: Sinabi ng hari na gawin ang gayon. Isang kautusan ang inilabas sa Susa, at ibinitin[a] ang sampung anak na lalaki ni Haman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinarak sa tulos.” Maaaring tumukoy ang pandiwang Hebreo sa pagbibitin o paglalantad ng mga katawan sa isang tulos o poste, at hindi kinakailangang sa pagbigti sa leeg ayon sa makabagong pagkaunawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang kahulugan ng אמר ang “sabihin.” Sa konteksto, ipinahihiwatig nito ang pahintulot ng hari nang hindi pinalalabis bilang tahasang pormal na pag-uutos.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: na gawin iyon
  rationale: Likas sa modernong Tagalog at naipahahayag ang pagpapatupad sa hiniling ni Ester; hindi kailangang gayahin ang pasibong anyo ng Hebreo kung magiging mabigat ang pangungusap.
- source_word: וַתִּנָּתֵן דָּת
  choice: Isang utos ang inilabas
  rationale: Ang נתן + דת ay pormulang administratibo sa panahong Persiano. Ang “utos ang inilabas” ay malinaw at natural; ang “batas” ay maaaring magpahiwatig ng mas pangkalahatan at permanenteng tuntunin.
- source_word: בְּשׁוּשָׁן
  choice: sa Susa
  rationale: Ginamit ang kinikilalang makabagong anyo ng pangalan ng lugar.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ang sampung anak na lalaki ni Haman
  rationale: Tuwirang salin ng construct chain, na nililinaw ang kasarian sapagkat tumutukoy ito sa mga anak na binanggit sa naunang salaysay.
- source_word: תָּלוּ
  choice: ibinitin
  rationale: Maaaring tumukoy ang תלה sa pagbibitin o paglalantad ng katawan sa kahoy, tulos, o poste. Pinananatili ng “ibinitin” ang mas malawak na diwa nang hindi ipinapalagay na pagbigti sa leeg ang paraan.
