    rationale: May bahagyang redundansiya at hindi kasinglinaw ng tuwirang “sa Susa,” habang napapanatili pa rin ang inuulit na pangalan ng lungsod sa Hebreo.
  - severity: low
    issue: “mga samsam”
    rationale: Ang “samsam” ay likas na kolektibong katawagan para sa plunder/booty; ang anyong walang “mga” ay mas idiomatiko rito at mas malapit sa tiyak na pangngalan sa Hebreo.
  - severity: low
    issue: 'Talababa: “iniunat ang kanilang kamay sa mga samsam”'
    rationale: Naiintindihan ang literal na larawan, ngunit mas malinaw sa Filipino ang paggamit ng “upang kunin ang samsam,” nang hindi isinusuko ang literal na anyo.
