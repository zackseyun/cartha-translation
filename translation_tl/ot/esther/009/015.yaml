base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: tl
  text: Nagtipon din ang mga Judio na nasa Susa noong ikalabing-apat na araw ng buwan ng Adar. Pumatay sila sa Susa ng tatlong daang lalaki, ngunit hindi nila ginalaw ang samsam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “hindi nila iniunat ang kanilang kamay upang kunin ang samsam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: Nagtipon
  rationale: Tuwirang ipinahahayag ang sama-samang pagtitipon ng pangkat at natural sa makabagong Filipino.
- source_word: הַיְּהוּדִים
  choice: ang mga Judio
  rationale: Tumutukoy sa mga Judio bilang pangkat etniko at panrelihiyon sa diaspora ng Persia; ito ang malinaw at nakasanayang katawagan sa Filipino.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: na nasa Susa
  rationale: Nililinaw na ang tinutukoy ay ang mga Judiong naroon sa lungsod ng Susa.
- source_word: גַּם
  choice: din
  rationale: Pinananatili ang dagdag na diwa kaugnay ng mga pangyayari noong nakaraang araw.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: noong ikalabing-apat na araw ng buwan ng Adar
  rationale: Pinananatili ang buong pormang pangkalendaryo ng Hebreo sa natural na Filipino.
- source_word: וַיַּהַרְגוּ
  choice: Pumatay sila
  rationale: Direkta at hindi pinapalambot ang karaniwang kahulugan ng pandiwang הרג.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: tatlong daang lalaki
  rationale: Pinananatili ang panlalaking katawagang אִישׁ pagkatapos ng bilang sa halip na gawing neutral.
- source_word: וּבַבִּזָּה
  choice: ngunit ... ang mga samsam
  rationale: Ang בִּזָּה ay mga ari-ariang maaaring kunin matapos ang labanan; natural at tiyak ang “mga samsam,” at ang “ngunit” ay nagpapakita ng kontekstwallyong pagsalungat.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: hindi nila ginalaw
  rationale: Natural na idyomang Filipino para sa hindi pagkuha o pag-angkin sa mga samsam, habang ang literal na larawan ay inilalagay sa talababa.
