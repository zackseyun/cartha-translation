revisions:
- from: Nagtipon din ang mga Judio na nasa Susa noong ikalabing-apat na araw ng buwan ng Adar. Pumatay sila roon sa Susa ng tatlong daang lalaki, ngunit hindi nila ginalaw ang mga samsam.[a]
  to: Nagtipon din ang mga Judio na nasa Susa noong ikalabing-apat na araw ng buwan ng Adar. Pumatay sila sa Susa ng tatlong daang lalaki, ngunit hindi nila ginalaw ang samsam.[a]
  rationale: Munting estilistikong rebisyon lamang ang ginawa upang maging mas natural ang Filipino at upang maging mas malinaw ang literal na talababa. Hindi binago ang kahulugan, pagkakasunod ng mga pangyayari, o ang tahasang paglalarawan ng pagpatay at pag-iwas sa samsam.
