  text: וְ/כָל שָׂרֵ֨י הַ/מְּדִינ֜וֹת וְ/הָ/אֲחַשְׁדַּרְפְּנִ֣ים וְ/הַ/פַּח֗וֹת וְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁ֣ר לַ/מֶּ֔לֶךְ מְנַשְּׂאִ֖ים אֶת הַ/יְּהוּדִ֑ים כִּֽי נָפַ֥ל פַּֽחַד מָרְדֳּכַ֖י עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: tl
  text: At ang lahat ng mga pinuno ng mga lalawigan, ang mga satrapa, ang mga gobernador, at ang mga gumagawa ng gawain para sa hari ay sumusuporta sa mga Judio[a], sapagkat bumagsak sa kanila ang takot kay Mardokeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumutulong sa mga Judio” o “nagbibigay-pabor sa mga Judio”; ang pandiwang Hebreo ay maaari ring mangahulugang “itinataas” sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: mga pinuno ng mga lalawigan
  rationale: Ang שָׂרִים ay tumutukoy sa mga pinuno o mataas na opisyal. Ang “mga pinuno” ay natural sa modernong Filipino at hindi ito ipinagkakamali sa mas tiyak na mga titulong kasunod.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: mga satrapa
  rationale: Hiram na titulong administratibo mula sa Persia; pinananatili ng “satrapa” ang natatanging ranggo at makasaysayang konteksto.
- source_word: פַּחוֹת
  choice: mga gobernador
  rationale: Malinaw at karaniwang katumbas sa Filipino ng titulong panrehiyon na naiiba sa mga satrapa.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: mga nangangasiwa sa gawain ng hari
  rationale: Ipinahahayag nito ang mga tauhang gumaganap o namamahala sa gawaing nauukol sa hari, habang nananatiling natural at marangal sa Filipino.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: sumusuporta sa mga Judio
  rationale: Sa konteksto, ang Hiphil ng נָשָׂא ay nagpapahiwatig ng praktikal na pagtulong o pagkiling. Ang “sumusuporta” ay hindi labis na nagpapahiwatig na itinataas sila sa katayuan; inilalagay sa talababa ang leksikal na ambiguwidad.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagsuporta; ang “sapagkat” ay malinaw at angkop sa dignified na salaysay.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: bumagsak sa kanila ang takot kay Mardokeo
  rationale: Pinananatili ang matingkad na metaporang Hebreo na ang takot ay “bumagsak” sa kanila, pati ang ideya ng pagkatakot kay Mardokeo.
- source_word: מָרְדֳּכַי
  choice: Mardokeo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng personal na pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang makasaysayang titulong “satrapa” at ang Hebreong larawang “bumagsak sa kanila ang takot,” habang ginawang natural ang paglalarawan sa mga lingkod ng hari.
