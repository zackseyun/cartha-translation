  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: tl
  text: Kaya tinawag nilang Purim[a] ang mga araw na ito, ayon sa pangalan ng Pur. Kaya, dahil sa lahat ng nakasaad sa liham na ito, sa nakita nila tungkol sa bagay na ito, at sa nangyari sa kanila[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa Pur.” Literal sa Hebreo, “ayon sa pangalan ng Pur.”
    reason: lexical_alternative
  - marker: b
    text: O “sa sumapit sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: tinawag
  rationale: Ang Qal perfect 3cp ng קרא ay ginagamit dito sa pagbibigay ng pangalan; natural at malapit sa Hebreo ang “tinawag.”
- source_word: לַיָּמִים הָאֵלֶּה
  choice: ang mga araw na ito
  rationale: Tumutukoy ang parirala sa tiyak na mga araw ng kapistahang tinatalakay.
- source_word: פוּרִים
  choice: Purim
  rationale: Pangalan ito ng kapistahan at angkop na panatilihin bilang transliterasyon.
- source_word: עַל שֵׁם הַפּוּר
  choice: ayon sa pangalan ng Pur
  rationale: Pinananatili nito ang tahasang pagbanggit sa “pangalan” at ang etimolohikal na kaugnayan ng Purim sa Pur.
- source_word: הַפּוּר
  choice: Pur
  rationale: Pinananatili ang salitang hiram sa paliwanag ng pangalan ng kapistahan; ang kahulugan nitong “palabunutan” ay nililinaw sa talababa.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Natural na Filipino ito para sa sanhi at konklusyon, at napananatili ang pag-uulit ng parirala sa talata.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: dahil sa lahat ng nakasaad sa liham na ito
  rationale: Natural na inilalahad ang sanhi at ang diwa ng דִּבְרֵי bilang mga salita o nilalaman ng liham.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: sa nakita nila tungkol sa bagay na ito
  rationale: Pinananatili ang literal na diwa ng ראה na “makita” habang idiomatikong isinasalin ang עַל כָּכָה.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: sa nangyari sa kanila
  rationale: Ang הִגִּיעַ אֲלֵי ay maaaring mangahulugang dumating o sumapit sa isang tao; “nangyari sa kanila” ang natural na Filipino sa konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang “Kaya” upang maipakita ang pag-uulit ng עַל כֵּן. Pinanatili rin ang kuwit sa hulihan sapagkat nagpapatuloy ang pangungusap sa kasunod na talata.
