lexical_decisions:
- source_word: וְ/אֵת
  choice: at sina …, …, at …
  rationale: Ang וְ ay nagpapatuloy sa talaan mula sa naunang talata, samantalang ang אֵת ay pananda ng tuwirang layon at walang hiwalay na katumbas sa natural na Tagalog. Ginamit ang “sina” para sa magkakasunod na pangalan ng mga tao at ang “at” upang ipakita ang pagpapatuloy at ayos ng talaan.
- source_word: פּוֹרָתָא
  choice: Porata
  rationale: Pangalan ng tao; tinumbasan sa baybay na angkop sa modernong Filipino habang malapit sa anyong Hebreo.
- source_word: אֲדַלְיָא
  choice: Adalia
  rationale: Pangalan ng tao; isinalin sa baybay na malinaw at natural basahin sa Filipino.
- source_word: אֲרִידָתָא
  choice: Aridata
  rationale: Pangalan ng tao; tinumbasan sa baybay na angkop sa modernong Filipino habang pinananatili ang anyong Hebreo.
