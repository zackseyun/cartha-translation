source:
  edition: WLC
  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: tl
  text: Nagtipon ang mga Judio sa kani-kanilang mga lungsod sa lahat ng lalawigan ni Haring Ahasuerus upang salakayin ang mga naghahangad na ipahamak sila[a]. Walang sinumang makalaban sa kanila[b], sapagkat ang takot sa kanila ay dumapo sa lahat ng mga bayan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang iunat ang kamay laban sa”; nangangahulugan itong gumawa ng marahas na pagkilos o sumalakay.
    reason: lexical_alternative
  - marker: b
    text: O “Walang sinumang makatayo sa harap nila.”
    reason: lexical_alternative
  - marker: c
    text: Ang “mga bayan” ay malamang na tumutukoy sa sari-saring pangkat ng mga tao o populasyon sa loob ng imperyo, hindi lamang sa iisang bansa.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: Nagtipon
  rationale: Ang Niphal ng קהל ay tumutukoy sa sama-samang pagtitipon; natural at malinaw sa modernong Tagalog ang “nagtipon.”
- source_word: בְּעָרֵיהֶם
  choice: sa kani-kanilang mga lungsod
  rationale: Ipinahahayag nito ang lokatibong parirala at ang hulaping panghalip na tumutukoy sa mga lungsod na kinaroroonan nila sa iba't ibang dako.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: sa lahat ng lalawigan ni Haring Ahasuerus
  rationale: Ang מְדִינוֹת ay mga administratibong lalawigan ng imperyo; tuwirang pinananatili ang kabuuang saklaw.
- source_word: לִשְׁלֹחַ יָד
  choice: upang salakayin
  rationale: Ang literal na idyomang “iunat/ipadala ang kamay laban sa” ay nagpapahiwatig ng marahas na pagkilos. Mas malinaw at natural sa Tagalog ang “salakayin,” habang inilalagay sa talababa ang literal na larawan.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: ang mga naghahangad na ipahamak sila
  rationale: Pinananatili nito ang aktibong layunin ng mga kalaban na magdulot sa kanila ng kapahamakan.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Walang sinumang makalaban sa kanila
  rationale: Ang literal na “walang taong tumayo sa harap nila” ay idyomatikong nangangahulugang walang nakayang humarap o lumaban sa kanila.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: sapagkat nasindak sa kanila
  rationale: Ipinahahayag ng פחד ang matinding takot o sindak. Natural sa Tagalog ang pandiwang “nasindak,” bagaman hindi nito kinokopya ang Hebreong larawang ang takot ay “nahulog/dumapo.”
- source_word: עַל כָּל הָעַמִּים
  choice: ang lahat ng mga bayan
  rationale: Ang pangmaramihang עַמִּים ay tumutukoy sa sari-saring pangkat ng mga tao o populasyon sa imperyo, hindi lamang sa iisang bansa.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: Ahasuerus
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalan sa tradisyong biblikal na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Judio,” “lalawigan,” at “Haring Ahasuerus” bilang pamilyar na bokabularyong biblikal. Isinalin nang idyomatiko ang mga Hebreong parirala, ngunit pinanatili sa mga talababa ang mahahalagang literal na alternatibo at ang saklaw ng pangmaramihang “mga bayan.”
