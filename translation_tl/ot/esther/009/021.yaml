base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: tl
  text: upang pagtibayin na ipagdiwang nila ang ika-labing-apat na araw ng buwan ng Adar at ang ika-labinlimang araw nito, taon-taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa bawat taon at taon,” isang paulit-ulit na anyong nagbibigay-diin na gagawin ito bawat taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: upang pagtibayin
  rationale: Ang Piel infinitive ng קום ay tumutukoy sa pagpapatibay o pagtatatag ng isang obligasyon o kaugalian. Ang “pagtibayin” ay natural sa konteksto ng liham at hindi nagpapahiwatig na noon lamang unang itinatag ang pagdiriwang.
- source_word: עֲלֵיהֶם
  choice: sa kanila
  rationale: Bagaman literal na “sa ibabaw nila,” ipinahahayag dito ng parirala ang obligasyong pinagtitibay para sa pamayanang Judio. Pinananatili ng “sa kanila” ang puwersang ito nang hindi nagiging pilit sa Tagalog.
- source_word: לִהְיוֹת עֹשִׂים
  choice: na ipagdiwang nila
  rationale: Literal itong “na sila ay gumagawa,” ngunit kapag mga natatanging araw ang layon, ang natural na kahulugan ay ang regular na pangingilin o pagdiriwang sa mga iyon. Ang “ipagdiwang” ay malinaw at angkop sa konteksto ng Purim.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: ang ikalabing-apat na araw ng buwan ng Adar
  rationale: Ito ang natural at pormal na paraan sa Tagalog ng pagpapahayag sa Hebreong petsa.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: at ang ikalabinlimang araw nito
  rationale: Ang בּוֹ ay tumutukoy pabalik sa buwan ng Adar. Ang “nito” ay maikli at malinaw nang hindi inuulit ang salitang “buwan.”
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: taon-taon
  rationale: Ang inuulit na Hebreong “taon at taon” ay isang distributibong idyoma na nagbibigay-diin sa taunang pag-uulit. Likas na naipahahayag ito sa Tagalog sa pamamagitan ng reduplikasyong “taon-taon.”
theological_decisions: []
translation_notes:
  register: Gumamit ng makabagong ngunit marangal na Tagalog. Pinanatili ang anyong sugnay na nagsisimula sa “upang,” sapagkat ang talata ay pagpapatuloy ng naunang pangungusap. Ang “ipagdiwang” ay mas natural kaysa literal na “gawin” para sa taunang pagtalima sa mga araw ng Purim.
