  source_fidelity: Tapat ang salin sa apat na pangalang Hebreo at sa tungkulin ng talata bilang pagpapatuloy ng talaan mula sa naunang talata. Ang pag-uulit ng “si” ay angkop na paraan sa Filipino upang markahan ang bawat pangalang pantao bilang layon sa ipinagpapatuloy na pangungusap.
  naturalness: Natural at maikli ang “si Parmasta, si Arisai, si Aridai, at si Vaizata.” Ang paulit-ulit na “si” ay bahagyang mas tahasan kaysa sa karaniwang payak na talaan, ngunit makatuwiran ito dahil sinasalamin nito ang paulit-ulit na panandang layon sa Hebreo at nananatiling maayos sa modernong Filipino.
