  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit bago sa bawat pangalan ang “at” kasama ng panandang nagpapakilala sa tiyak na layon: “at si Parmasta, at si Arisai, at si Aridai, at si Vaizata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְמַשְׁתָּא
  choice: Parmasta
  rationale: Pangalang pantangi na isinalin sa baybay na likas at madaling bigkasin sa modernong Filipino; ang Hebreong שׁ ay kinakatawan ng “s” ayon sa karaniwang pag-aangkop ng mga pangalang biblikal sa Tagalog.
- source_word: אֲרִיסַי
  choice: Arisai
  rationale: Tuwirang transliterasyon ng pangalang pantangi mula sa binigkas na anyong Hebreo.
- source_word: אֲרִדַי
  choice: Aridai
  rationale: Tuwirang transliterasyon ng pangalang pantangi mula sa anyong Hebreo.
- source_word: וַיְזָתָא
  choice: Vaizata
  rationale: Transliterasyon ng pangalang pantangi; pinananatili ang paunang tunog na v at ang pagkakasunod ng mga patinig na makikita sa Masoretikong anyo.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: si ... si ... si ... at si
  rationale: Ang inuulit na וְאֵת ay nagpapakilala sa bawat kasapi ng nagpapatuloy na listahan bilang tiyak na layon. Ginamit ang “si” bago sa bawat pangalan upang maging malinaw at natural sa Filipino, habang kuwit at pangwakas na “at” ang naghuhugpong sa listahan.
