  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: tl
  text: Kaya, ipinagdiriwang ng mga Judiong nakatira sa mga bayang walang pader[a] ang ikalabing-apat na araw ng buwan ng Adar bilang araw ng kagalakan at pagpipista, at isang araw na kapistahan; nagpapadala rin ang bawat isa ng mga bahagi[b] sa kaniyang kapuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Judiong mula sa mga pamayanan, na nakatira sa mga bayang walang pader.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga bahagi” ay malamang na mga bahagi ng pagkain o mga kaloob para sa kapistahan.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Likas na panandang naghahayag ng bunga o kongklusyon mula sa naunang salaysay.
- source_word: הַיְּהוּדִים
  choice: ang mga Judio
  rationale: Tumutukoy sa bayang Judio bilang pangkat na etniko at panrelihiyon sa Imperyong Persiano, hindi lamang sa mga taga-Juda.
- source_word: הפרוזים הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: ang mga Judiong nasa mga pamayanang walang pader
  rationale: Pinagsama nang natural ang magkaugnay na paglalarawan. Pinananatili ng 'walang pader' ang tahasang kaibahan sa napapaderang lunsod sa konteksto.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: ipinagdiriwang ang ikalabing-apat na araw
  rationale: Sa kaugnayan nito sa isang araw, ang עשה ay nangangahulugang ipagdiwang o tuparin ang pagdiriwang nito; ito ang natural na Filipino.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: ng buwan ng Adar
  rationale: Karaniwang pormula ng petsa at malinaw na ikinakabit ang ikalabing-apat na araw sa Adar.
- source_word: שִׂמְחָה
  choice: kagalakan
  rationale: Pinananatili ang pangngalang tumutukoy sa masayang damdamin ng pagdiriwang.
- source_word: וּמִשְׁתֶּה
  choice: pagsasalu-salo
  rationale: Natural at kasalukuyang Filipino para sa pistang may pagkain at inumin, nang hindi labis na itinatampok ang alak.
- source_word: וְיוֹם טוֹב
  choice: kapistahan
  rationale: Inihahayag ang idyomatikong kahulugan na isang itinakdang masaya at maligayang araw.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: nagpapadalhan sila ng mga bahagi
  rationale: Pinananatili ang bahagyang kalabuan ng מָנוֹת; malamang na mga bahagi ng pagkain ang tinutukoy ngunit hindi iyon tahasang nililimitahan sa pangunahing teksto.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: ang bawat isa sa kaniyang kapuwa
  rationale: Ipinapahayag ang distributibong diwa sa natural na Filipino. Ang 'kapuwa' ay akma sa kasapi ng komunidad at hindi nagpapasok ng di-kinakailangang eksklusibong pagtukoy sa lalaki.
theological_decisions:
- issue: Kasariang ipinahihiwatig ng distributibong pariralang אִישׁ לְרֵעֵהוּ
  choice: ang bawat isa sa kaniyang kapuwa
  alternative: ang bawat lalaki sa kaniyang kapuwa
  rationale: Bagaman panlalaki ang anyong gramatikal sa Hebreo, karaniwan itong distributibong pahayag para sa mga kasapi ng pamayanan. Ang salin ay nagpapanatili sa indibiduwal at tumbasang kilos nang hindi ipinapalagay na mga lalaki lamang ang kalahok.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang 'Judio,' 'Adar,' at 'kapistahan' bilang pamilyar na bokabularyong biblikal; pinanatili sa talababa ang heograpikong detalye at ang posibleng kahulugan ng ipinadadalang mga bahagi.
