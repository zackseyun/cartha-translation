base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: tl
  text: Ngunit ang mga Judio na nasa Susa ay nagtipon noong ikalabintatlo at ikalabing-apat na araw ng buwang iyon[a]. Nagpahinga sila noong ikalabinlimang araw, at ginawa nila itong araw ng handaan at kagalakan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa ikalabintatlo nito … at sa ikalabing-apat nito … at sa ikalabinlima nito”; ang “nito” ay tumutukoy sa buwan ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “araw ng piging at pagsasaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: Ngunit ang mga Judio
  rationale: Ang waw ay nagpapakita rito ng paghahambing o pagsalungat sa mga Judio sa mga lalawigan sa talata 17; natural itong ipinahahayag ng “Ngunit.”
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: na nasa Susa
  rationale: Tinutukoy ng pariralang ito ang pangkat ng mga Judio na nasa Susa; “Susa” ang karaniwang anyo ng pangalang-lugar sa makabagong salin.
- source_word: נִקְהֲלוּ
  choice: nagtipon
  rationale: Ang Niphal ng קהל ay nangangahulugang nagtipon o nagkatipon, nang hindi dinaragdagan ang dahilan o layunin ng pagtitipon.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: noong ikalabintatlo at ikalabing-apat na araw ng buwang iyon
  rationale: Ang hulaping “nito/niyon” sa Hebreo ay tumutukoy sa buwang malinaw sa konteksto. Ginawang tahasan ang “buwan” upang maging natural at malinaw sa Filipino, habang pinananatili ang dalawang petsa.
- source_word: וְנוֹחַ
  choice: Nagpahinga sila
  rationale: Ipinahahayag ng נוח ang pagtigil at pamamahinga matapos ang labanan; ang “nagpahinga” ang tuwiran at likas na pandiwang Filipino.
- source_word: בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: noong ikalabinlimang araw
  rationale: Ang tinutukoy na buwan ay malinaw na mula sa naunang parirala, kaya hindi na kailangang ulitin sa Filipino.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: at ginawa nila itong
  rationale: Ang עשה na may layong panghalip ay nangangahulugang itinuring o ginawang gayong uri ng araw; pinananatili ng salin ang payak na idyoma ng Hebreo.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: araw ng handaan at kagalakan
  rationale: Ang מִשְׁתֶּה ay isang piging o handaan, at ang שִׂמְחָה ay kagalakan. Ang mga salitang ito ay natural, marangal, at angkop sa pagdiriwang.
theological_decisions: []
translation_notes:
  register: Makabago at dignidad na Filipino para sa karaniwang mambabasa. Ginamit ang “Judio,” “Susa,” “handaan,” at “kagalakan” bilang malinaw at pamilyar na mga anyo. Hinati sa dalawang pangungusap upang luminaw ang pagkakasunod-sunod ng pagtitipon, pamamahinga, at pagdiriwang nang hindi binabago ang ugnayan ng mga pangyayari.
