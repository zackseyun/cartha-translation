  source_fidelity: Tumpak na naihahatid ng salin ang pagkakaiba ng mga Judio sa Susa, ang kanilang pagtitipon sa ika-13 at ika-14 na araw ng buwan, ang pagpapahinga sa ika-15 araw, at ang paggawa rito bilang araw ng handaan at kagalakan. Hindi nito dinaragdagan o binabawasan ang diwa ng Hebreo.
  naturalness: Likas at malinaw ang modernong Filipino. Ang paghahati sa dalawang pangungusap ay hindi nakasisira sa lohikal na daloy o pagkakasunod-sunod ng Hebreo. Ang “noong ikalabintatlo at ikalabing-apat na araw ng buwang iyon” ay natural at malinaw na sumasaklaw sa kapwa petsa.
  terminology: Ang “Judio,” “Susa,” “nagtipon,” “handaan,” at “kagalakan” ay angkop, marangal, at pare-pareho ang antas ng wika. Ang “handaan at kagalakan” ay sapat na katumbas ng מִשְׁתֶּה וְשִׂמְחָה nang hindi ipinipilit ang mas makitid na kahulugang may pag-inom.
