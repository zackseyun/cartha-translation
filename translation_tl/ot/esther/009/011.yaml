  text: On that day the number of those killed in Susa the citadel came before the king.
translation:
  language: tl
  text: Noong araw na iyon, dumating sa harap ng hari ang bilang ng mga napatay sa Susa na kuta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Likas at malinaw na panandang temporal sa makabagong Tagalog.
- source_word: בָּא
  choice: nakarating
  rationale: Pinananatili ang literal na diwa ng ‘dumating’ habang natural na ipinahihiwatig na ang bilang o ulat nito ay nakarating sa hari, nang hindi nagdaragdag ng tahasang pasibong ‘iniharap.’
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: ang bilang ng mga napatay
  rationale: Tuwirang katumbas ng bilang at ng mga taong pinatay; hindi tinutukoy rito kung sino ang pumatay.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Susan na kuta
  rationale: Isinasalin ang pangalan bilang Susan at ang הַבִּירָה bilang ‘kuta,’ na angkop sa pinatibay na sentrong tinutukoy sa salaysay.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa hari
  rationale: Sa idyomang ito, ang bilang ay nakarating ‘sa harap ng hari,’ ibig sabihi’y sa kanyang kaalaman o presensiya; ‘sa hari’ ang natural na Tagalog.
