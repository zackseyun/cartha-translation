  source_fidelity: Napananatili ng draft ang pangatnig at lokasyon, ang dalawang pandiwang Hebreo, at ang bilang na limang daan. Gayunman, ang pangalan ng lugar na שׁוּשַׁן ay dapat isalin bilang “Susa,” hindi “Susan”; ang huli ay karaniwang personal na pangalan sa Filipino at hindi ang kinikilalang anyo ng sinaunang lungsod.
  naturalness: Hindi natural at maaaring malito ang “sa Susan na tanggulan.” Mas malinaw at likas ang “sa kuta ng Susa.” Ang ayos na “Pinatay at nilipol ng mga Judio ang ...” ay mas maayos ding Tagalog kaysa sa aktibong “pumatay at lumipol ... ng.”
