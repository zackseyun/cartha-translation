  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: tl
  text: At sa kuta ng Susa[a], pinatay at nilipol ng mga Judio ang limang daang lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tanggulan.” Ang salitang Hebreo ay maaaring tumukoy sa isang pinatibay na kompleks ng palasyo o sa isang tanggulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: At sa Susan
  rationale: Pinananatili ng “At” ang ugnayan sa naunang salaysay, at malinaw na isinasalin ng “sa” ang lokatibong panlapi. “Susan” ang karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: הַ/בִּירָה
  choice: na tanggulan
  rationale: Ang בִּירָה ay tumutukoy sa pinatibay na sentrong palasyo o kuta ng kabisera. Likas sa Filipino ang pariralang “Susan na tanggulan,” at hindi nito nililimitahan ang kahulugan sa tirahan lamang ng hari.
- source_word: הָרְגוּ
  choice: pumatay
  rationale: Tuwirang katumbas ito ng pandiwang הרג at gumagamit ng kasalukuyan at dignidad na modernong pananalita.
- source_word: הַ/יְּהוּדִים
  choice: ang mga Judio
  rationale: Sa Esther, tumutukoy ito sa kinikilalang pangkat etniko at panrelihiyon; “mga Judio” ang natural at karaniwang salin sa Filipino.
- source_word: וְ/אַבֵּד
  choice: at lumipol
  rationale: Ang piel ng אבד ay nagpapahayag ng pagwasak o pagpapahamak. Pinananatili ng hiwalay na “lumipol” ang dalawang pandiwa ng Hebreo at ang tindi nito, sa halip na pagsamahin lamang sa “pumatay.”
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: limang daang lalaki
  rationale: Tumpak na pinananatili ang bilang at ang panlalaking pangngalang אִישׁ sa likas na anyong Filipino.
