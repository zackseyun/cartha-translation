  source_fidelity: 'Tumpak ang pangunahing diwa ng talata: ang pormal na pagpapatibay ng mga araw ng Purim, ang kaugnayan nito kina Mordecai at Esther, ang pag-ako ng pamayanan para sa sarili at mga inapo nila, at ang mga pag-aayuno at kaugnay na pagdaing. Gayunman, ang paulit-ulit na קים ay higit na malinaw na mapananatili sa magkakatugmang “pagtibayin/pinagtibay,” at ang pangwakas na tuon ay dapat manatiling “mga bagay tungkol sa” mga pag-aayuno at pagdaing, nang hindi higit na binibigyang-kahulugan ang pagdaing bilang isang tiyak na uri ng panalangin.'
  naturalness: Ang “sa mga takdang panahon ng mga ito” ay nauunawaan ngunit mabigat at di-likas sa modernong Filipino. Mas natural ang “sa kanilang mga takdang panahon.” Ang “itinakda para sa kanila nina” ay maaari ring gawing “pinagtibay para sa kanila nina” upang maging mas malinaw ang daloy at ang pag-uulit ng pandiwang Hebreo.
  terminology: Ang “Purim,” “Mordecai na Judio,” “Reyna Esther,” “mga salinlahi,” “mga pag-aayuno,” at “pagdaing” ay angkop sa marangal ngunit modernong rehistro. Ang “pagdaing” ay wastong malawak na katumbas ng זַעֲקָתָם; hindi nito isinasara ang kahulugan sa panaghoy o pagsamo lamang.
