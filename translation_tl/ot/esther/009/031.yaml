translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong sugnay na nagsisimula sa “upang,” sapagkat ang talata ay nagpapatuloy sa layunin ng naunang pahayag. Iniwasan ang denominasyonal na pagpapakahulugan at pinanatili ang kalabuan ng זַעֲקָה.
