base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: tl
  text: upang pagtibayin ang mga araw na ito ng Purim sa kanilang mga takdang panahon[a], gaya ng pinagtibay para sa kanila nina Mordecai na Judio at Reyna Esther, at gaya ng pinagtibay nila para sa kanilang sarili at sa kanilang mga salinlahi ang mga bagay tungkol sa mga pag-aayuno at sa kanilang pagdaing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “itakda” ang paulit-ulit na pandiwang Hebreo na קים; dito, tumutukoy ito sa pormal na pagtatakda o pagpapatibay ng pagdiriwang.
    reason: lexical_alternative
  - marker: b
    text: Ang “pagdaing” ay maaari ring isaling “pagsigaw” o “panaghoy.” Malamang na tumutukoy ito sa sama-samang pagdaing na kaugnay ng mga pag-aayuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: upang pagtibayin
  rationale: Ipinahahayag ng piel infinitive ng קום ang pormal na pagpapatatag o pagpapatibay ng pagdiriwang. Likas sa modernong Tagalog ang “pagtibayin” sa ganitong legal o administratibong konteksto.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: ang mga araw na ito ng Purim
  rationale: Pinananatili nito ang tahasang pantukoy sa mga partikular na araw ng kapistahang tinatalakay.
- source_word: בִּזְמַנֵּיהֶם
  choice: sa mga takdang panahon ng mga ito
  rationale: Ang זְמָן ay tumutukoy sa itinakda o tiyak na panahon; nililinaw rin ng “ng mga ito” na ang panghalip ay tumutukoy sa mga araw.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: gaya ng itinakda para sa kanila
  rationale: Ipinakikita ng parirala ang naunang pormal na pagtatakda para sa komunidad nang hindi ipinahihiwatig ang pamimilit na maaaring dala ng “ipinataw.”
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mordecai na Judio
  rationale: Ang “Judio” ang karaniwan at malinaw na katawagang etniko sa konteksto ng Esther.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Reyna Esther
  rationale: Ito ang likas at marangal na anyo sa modernong Tagalog para sa Hebreong apposition.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: at gaya ng pinagtibay nila para sa kanilang sarili at sa kanilang mga salinlahi
  rationale: Ang “pinagtibay nila para sa kanilang sarili” ay naghahatid ng diwang kusang pag-ako ng pananagutan, habang ang “mga salinlahi” ay natural na tumutukoy sa nagpapatuloy na mga inapo.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: ang tungkol sa mga pag-aayuno at sa kanilang pagdaing
  rationale: Malawak ang דִּבְרֵי bilang “ang tungkol sa” o mga bagay na nauukol sa pag-aayuno. Ang “pagdaing” ay nagpapanatili sa tindi at kalabuan ng זַעֲקָה bilang pag-iyak, pagsamo, o panaghoy.
