  text: קִיְּמ֣וּ ו/קבל הַ/יְּהוּדִים֩ עֲלֵי/הֶ֨ם וְ/עַל זַרְעָ֜/ם וְ/עַ֨ל כָּל הַ/נִּלְוִ֤ים עֲלֵי/הֶם֙ וְ/לֹ֣א יַעֲב֔וֹר לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֣ת שְׁנֵ֤י הַ/יָּמִים֙ הָ/אֵ֔לֶּה כִּ/כְתָבָ֖/ם וְ/כִ/זְמַנָּ֑/ם בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: tl
  text: Pinagtibay at tinanggap ng mga Judio para sa kanilang sarili, sa kanilang mga salinlahi, at sa lahat ng umanib sa kanila[a] na hindi dapat mapabayaan[b] ang pagdiriwang ng dalawang araw na ito ayon sa nakasulat na tuntunin para sa mga ito at sa itinakdang panahon ng mga ito, taon-taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng kumampi sa kanila” o “lahat ng nakipag-ugnay sa kanila.” Tumutukoy ang Hebreo sa mga taong umanib o nagkaugnay sa mga Judio.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, maaari ring unawaing “hindi dapat lumipas” o “hindi dapat maligtaan.” Ang diwa ay hindi dapat mahinto ang pagdiriwang.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ וְקִבֵּל
  choice: itinakda at tinanggap
  rationale: 'Pinananatili ang dalawang pandiwa: ang una ay nagpapahiwatig ng pagpapatibay o pagtatatag ng tuntunin, at ang ikalawa ay ng pagtanggap sa pananagutan.'
- source_word: עֲלֵיהֶם
  choice: para sa kanilang sarili
  rationale: Likas na Filipino para sa pag-ako nila sa obligasyon, nang hindi nawawala ang pansariling bisa nito.
- source_word: זַרְעָם
  choice: kanilang mga salinlahi
  rationale: Ipinahahayag ang kolektibo at patuloy na kahulugang panghenerasyon ng זֶרַע sa kontekstong ito.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: lahat ng umanib sa kanila
  rationale: Ang לוה ay tumutukoy sa mga taong kumakabit, sumasama, o umuugnay sa mga Judio; malinaw at dignificado ang 'umanib' nang hindi tinutukoy nang higit sa teksto ang uri ng ugnayan.
- source_word: וְלֹא יַעֲבוֹר
  choice: na hindi dapat mapabayaan
  rationale: Sa konteksto, ipinagbabawal ng idyoma ang pagkaligtaan o paghinto ng taunang pagdiriwang, sa halip na literal na pagdaan.
- source_word: לִהְיוֹת עֹשִׂים
  choice: ang pagdiriwang
  rationale: Bagaman literal na 'patuloy na gawin,' ang tinutukoy ay ang taunang pagganap o pagdiriwang sa dalawang araw; natural ito sa Filipino sa konteksto ng kapistahan.
- source_word: כִּכְתָבָם
  choice: ayon sa nakasulat tungkol sa mga ito
  rationale: Pinananatili ang pagtukoy sa nakasulat na tagubilin habang hindi pinipilit ang malabong reperente ng hulapi.
- source_word: וְכִזְמַנָּם
  choice: sa itinakdang panahon ng mga ito
  rationale: Pinananatili ang maramihang reperente sa dalawang araw at ang diwa ng takdang panahon.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: taon-taon
  rationale: Karaniwan at malinaw na Filipino para sa idyomang nagsasaad ng taunang pag-uulit.
theological_decisions:
- issue: Saklaw ng mga 'umanib' sa mga Judio
  choice: Hindi tinukoy kung relihiyosong pagbabalik-loob, pampolitikang pakikiisa, o ibang uri ng pag-anib.
  alternative: Tawaging mga naging Judio o mga proselita.
  rationale: Ang pandiwang לוה ay nagsasaad ng pag-anib o pagkakaugnay ngunit hindi nito sa sarili lamang nililinaw ang eksaktong katayuang panrelihiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'itinakda at tinanggap' upang mapanatili ang legal at kolektibong himig, at ang 'taon-taon' para sa likas na pagpapahayag ng taunang pag-uulit.
