base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: tl
  text: Pagkatapos, isinulat ni Mardokeo ang mga bagay na ito[a] at nagpadala siya ng mga liham sa lahat ng Judio sa lahat ng lalawigan ni Haring Ahasuero, kapuwa sa malapit at sa malayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang mga salitang ito.” Maaaring tumukoy ang Hebreo sa mga bagay o pangyayaring kasasabi lamang, o sa mga salitang isinulat ni Mardokeo tungkol sa mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: isinulat
  rationale: Tuwirang ipinapahayag ng pandiwang כתב ang pagsulat; ang aspektong ganap na “isinulat” ay likas sa salaysay sa Tagalog.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga bagay na ito
  rationale: Maaaring tumukoy ang דְּבָרִים sa mga bagay o pangyayaring isinalaysay, o sa mga salitang isinulat. Pinananatili ng “mga bagay na ito” ang malawak na kahulugan; inilalahad sa talababa ang ibang posibilidad.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: nagpadala siya ng mga liham
  rationale: Sa kontekstong administratibo, ang סְפָרִים ay mga nakasulat na komunikasyon. Likas at malinaw sa modernong Tagalog ang “mga liham.”
- source_word: כָּל הַיְּהוּדִים
  choice: lahat ng Judio
  rationale: Tuwiran at karaniwang katawagan ito sa buong pamayanang tinutukoy.
- source_word: בְּכָל מְדִינוֹת
  choice: sa lahat ng lalawigan
  rationale: Ang מְדִינוֹת ay tumutukoy sa mga administratibong sakop ng imperyo; pinakamalinaw na katumbas ang “mga lalawigan.”
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: ni Haring Ahasuero
  rationale: Likas na ayos ito sa Tagalog at ginagamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: maging sa malapit o sa malayo
  rationale: Pinananatili nito ang magkatambal na saklaw ng Hebreo habang natural na ipinahihiwatig na kabilang ang mga Judiong nasa malapit at nasa malayo.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinakikita nito ang pagpapatuloy at pagkakasunod-sunod ng salaysay nang mas natural kaysa sa paulit-ulit na “At.”
