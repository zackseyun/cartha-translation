translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “Judio,” “Mardokeo,” at “Ahasuero” bilang mga anyong pamilyar sa tradisyong biblikal sa Tagalog. Inilagay ang pananda ng talababa kaagad pagkatapos ng pariralang may tunay na leksikal na kalabuan.
