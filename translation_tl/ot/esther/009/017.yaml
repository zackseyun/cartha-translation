translation:
  language: tl
  text: noong ikalabintatlong araw ng buwan ng Adar, nagpahinga sila noong ikalabing-apat na araw ng buwang iyon[b], at ginawa[a] nila itong araw ng handaan at kagalakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ginawa nila itong araw ng handaan at kagalakan.” Ang anyong pandiwang Hebreo ay maaari ring katawanin sa Tagalog sa isang mas tahasang natapos na anyo.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang ikalabing-apat na araw ng buwan ng Adar.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר
  choice: noong ikalabintatlong araw
  rationale: Ang בְּ ay pananda ng panahon, at ang bilang ay ginagamit bilang panunuran sa pormula ng petsa. Likas sa modernong Tagalog ang “noong ikalabintatlong araw.”
- source_word: לְחֹדֶשׁ אֲדָר
  choice: ng buwan ng Adar
  rationale: Pinananatili nito ang Hebreong pormula ng petsa at ang transliteradong pangalan ng buwan.
- source_word: וְנוֹחַ
  choice: nagpahinga sila
  rationale: Ang נוח ay tumutukoy rito sa pagtigil mula sa labanan. Ginawang tahasang pandiwa sa Tagalog ang anyong Hebreo ayon sa hinihingi ng konteksto; ang “sila” ay tumutukoy sa mga Judio sa naunang talata.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: noong ikalabing-apat na araw ng buwang iyon
  rationale: Ang panghalip na בּוֹ ay tumutukoy pabalik sa buwan. Nilinaw ito sa natural na Tagalog nang hindi dinaragdagan ang diwa.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: at ginawa nila itong
  rationale: Sa daloy ng salaysay, inilalarawan nito ang ginawa nila sa araw na iyon. Ang tahasang anyong pandiwa ay natural sa Tagalog, habang itinatala sa talababa ang anyong gramatikal ng Hebreo.
- source_word: יוֹם מִשְׁתֶּה
  choice: araw ng handaan
  rationale: Ang מִשְׁתֶּה ay isang piging o handaan, na maaaring may kasamang pag-inom. Ang “handaan” ay malawak, natural, at marangal na katumbas.
- source_word: וְשִׂמְחָה
  choice: at kagalakan
  rationale: Pinananatili ng “kagalakan” ang pangngalang anyo at ang diwa ng masayang pagdiriwang.
