  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: tl
  text: Sumulat si Reyna Ester, na anak ni Abihail, at si Mardokeo na Judio, taglay ang buong awtoridad[a], upang pagtibayin ang ikalawang liham na ito tungkol sa Purim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taglay ang buong bisa” o “nang buong lakas.” Binibigyang-diin ng pananalitang Hebreo ang ganap na opisyal na awtoridad o bisa ng liham.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Pagkatapos, sumulat
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, sumulat” at hindi kailangang ipakita sa pandiwang Tagalog ang kasariang pambabae at isahang bilang ng pandiwang Hebreo.
- source_word: אֶסְתֵּר הַמַּלְכָּה בַת אֲבִיחַיִל
  choice: si Reyna Ester, na anak ni Abihail
  rationale: Pinananatili ang maharlikang titulo at ang tuwirang pagkakakilanlan kay Ester sa pamamagitan ng pangalan ng kanyang ama, sa natural na ayos ng Tagalog.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: kasama ni Mardokeo na Judio
  rationale: Ang “Judio” ay ang natural na katawagang etniko sa konteksto ng Ester. Ginamit ang “kasama ni” upang katawanin ang pagkakasama ni Mardokeo sa pagsulat habang iginagalang ang isahang pambabaeng anyo ng וַתִּכְתֹּב, na tahasang tumutukoy kay Ester.
- source_word: אֶת כָּל תֹּקֶף
  choice: nang buong kapangyarihan
  rationale: Sa konteksto ng opisyal na liham, ang תֹּקֶף ay tumutukoy sa ganap na lakas o bisa ng awtoridad, hindi sa pisikal na lakas.
- source_word: לְקַיֵּם
  choice: upang pagtibayin
  rationale: Ipinahahayag ng infinitive ang layunin ng pagsulat. Ang “pagtibayin” ay angkop sa pormal na pagkumpirma at pagpapatatag ng naunang itinakdang pagdiriwang.
- source_word: אֵת אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: ang ikalawang liham na ito tungkol sa Purim
  rationale: Malinaw na inilalahad ang liham bilang ikalawa at bilang may kinalaman sa Purim. Mas natural at malinaw sa Tagalog ang “tungkol sa Purim” kaysa sa posibleng malabong “liham ng Purim.”
theological_decisions:
- issue: Ang isahang pambabaeng pandiwang וַתִּכְתֹּב kasunod ng pagbanggit kina Ester at Mardokeo
  choice: “sumulat si Reyna Ester ... kasama ni Mardokeo”
  alternative: “sumulat sina Reyna Ester ... at Mardokeo”
  rationale: Pinananatili ng napiling anyo ang gramatikal na pagtuon ng pandiwang Hebreo kay Ester ngunit hindi inaalis ang tunay na pakikibahagi ni Mardokeo na ipinahihiwatig ng kasunod na parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Reyna Ester” at “Mardokeo na Judio” bilang mga likas na katawagan, habang pinanatili ang pormal na himig ng isang opisyal na liham.
