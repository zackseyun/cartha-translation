  to: Sumulat si Reyna Ester, na anak ni Abihail, at si Mardokeo na Judio, taglay ang buong awtoridad[a], upang pagtibayin ang ikalawang liham na ito tungkol sa Purim.
  rationale: Pinalitan ang “kasama ni Mardokeo” ng “at si Mardokeo” upang tuwirang katawanin ang pagkakaugnay ng dalawang pangalan sa Hebreo. Pinili ang “taglay ang buong awtoridad” upang maging malinaw na ang tinutukoy ay opisyal na puwersa o bisa ng liham. Nananatiling isahan ang “Sumulat si,” na hindi sumasalungat sa Filipino at maingat na hindi binubura ang pambabaeng isahang anyo ng pandiwang Hebreo.
