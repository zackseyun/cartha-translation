  naturalness: Mas natural at malinaw ang “sa pamamagitan ng tabak, pagpatay, at paglipol” kaysa “sa patayan at paglipol.” Ang “ang nais nila” ay tuwirang modernong Filipino para sa pagkilos “ayon sa kanilang kagustuhan,” habang nananatiling malinaw na ang ginawa ay laban sa mga napopoot sa kanila.
  terminology: Ang “mga Judio” ay angkop. Pinananatili ang magkahiwalay na “mga kaaway” at “mga napopoot sa kanila,” gaya ng pagkakaiba ng Hebreong אֹיְבֵיהֶם at שֹׂנְאֵיהֶם. Ang “pagpatay” at “paglipol” ay naghahatid ng tindi ng הֶרֶג at אֲבְדָן nang hindi dinaragdagan ang teksto.
