base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: tl
  text: Kaya, sinaktan ng mga Judio ang lahat nilang kaaway sa pamamagitan ng tabak[a], pagpatay, at paglipol; at ginawa nila sa mga napopoot sa kanila ang nais nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa hampas ng tabak.”
    reason: lexical_alternative
  - marker: b
    text: O “ayon sa kanilang kagustuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: pinuksa
  rationale: Ang נכה ay tumutukoy sa paghampas o pagpabagsak; sa kasunod na hanay na “tabak, patayan, at paglipol,” malinaw na nakamamatay ang pagkilos. Ang “pinuksa” ay natural sa Filipino at hindi pinahihina ang tindi ng konteksto.
- source_word: הַיְּהוּדִים
  choice: mga Judio
  rationale: Tumutukoy ito sa bayang Judio sa konteksto ng diaspora sa Persia; “mga Judio” ang karaniwan at malinaw na katawagan sa modernong Filipino.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: lahat nilang kaaway
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at natural ang ayos sa Filipino.
- source_word: מַכַּת חֶרֶב
  choice: sa pamamagitan ng tabak
  rationale: Ang literal na “taga/hampas ng tabak” ay mabigat at di-likas sa Filipino. Inilalagay sa talababa ang mas literal na anyo upang mapanatili ang larawan ng Hebreo.
- source_word: וְהֶרֶג וְאַבְדָן
  choice: sa patayan at paglipol
  rationale: Pinananatili ang magkasunod at matitinding katawagan sa pagpatay at pagkawasak nang hindi dinaragdagan ang kahulugan.
- source_word: בְשֹׂנְאֵיהֶם
  choice: sa mga napopoot sa kanila
  rationale: Pinananatili ang pagkakaiba nito sa naunang “mga kaaway”; participial ang anyo at literal na tumutukoy sa mga napopoot sa kanila.
- source_word: כִּרְצוֹנָם
  choice: ang anumang maibigan nila
  rationale: Natural na Filipino ito para sa literal na “ayon sa kanilang kalooban/kagustuhan” at nagpapahayag ng malayang pagkilos.
theological_decisions:
- issue: Paglalarawan sa marahas at nakamamatay na pagkilos
  choice: Panatilihin ang tahasang “tabak, patayan at paglipol”
  alternative: Palambutin bilang “tinalo” lamang, o palalain bilang lubos na paglipol sa bawat isa
  rationale: Sadyang pinagsasama ng Hebreo ang mga salitang nagpapahayag ng nakamamatay na karahasan. Dapat mapanatili ang tindi nito nang hindi lumalampas sa sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at tuwiran. Pinanatili ang matinding hanay ng mga salitang marahas sa Hebreo, ngunit iniwasan ang di-likas na literalismo sa pangunahing teksto.
