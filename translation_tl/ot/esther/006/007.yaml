  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: tl
  text: Sinabi ni Haman sa hari, “Para sa lalaking kinalulugdan ng hari na parangalan—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang payak na “Sinabi” sa kontekstong ito.
- source_word: הָמָן
  choice: Haman
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: אֶל הַמֶּלֶךְ
  choice: sa hari
  rationale: Karaniwang Tagalog para sa kausap na pinatutungkulan ng pagsasalita.
- source_word: אִישׁ
  choice: lalaking
  rationale: Pinananatili ang panlalaking isahan ng Hebreo; sa konstruksiyong “para sa lalaking...” natural na tumutukoy ito sa di pa pinangalanang taong nasa isip ng hari.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na pang-ugnay sa Tagalog para sa sugnay na naglalarawan sa tao.
- source_word: חָפֵץ
  choice: kinalulugdan
  rationale: Ipinahahayag ang kasiyahan o lugod, hindi lamang ang simpleng pagnanais.
- source_word: בִּיקָרוֹ
  choice: na parangalan
  rationale: Ang יְקָר ay tumutukoy sa karangalan o pagkilala; natural itong ipahayag bilang pandiwang “parangalan” sa Tagalog.
