translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maharlikang kasuotan” sa halip na mas espesipikong “balabal” upang huwag higpitan ang kahulugan ng לְבוּשׁ. Nasa pangunahing teksto ang lahat ng panandang talababa.
