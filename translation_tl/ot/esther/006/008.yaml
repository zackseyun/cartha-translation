base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: tl
  text: “Dalhin nila ang isang maharlikang kasuotang isinuot ng hari, at isang kabayong sinakyan ng hari at nilagyan ng maharlikang korona ang ulo nito.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at inilagay ang isang maharlikang korona sa ulo nito.” Ang panghalip ay pinakamalamang na tumutukoy sa kabayo, bagaman inuunawa ito ng ilan na tumutukoy sa hari.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Ipadala ninyo
  rationale: Ang Hiphil imperfect na may diwang pautos ay humihiling na ipakuha at dalhin ang mga bagay. Sa konteksto ng utos sa mga lingkod, natural sa Filipino ang “Ipadala ninyo,” bagaman maaari ring sabihing “Ipalabas ninyo.”
- source_word: לְבוּשׁ מַלְכוּת
  choice: isang maharlikang kasuotan
  rationale: Tumutukoy ang parirala sa kasuotang nauukol sa pagkahari. Mas malawak at mas tapat ang “kasuotan” kaysa “balabal,” sapagkat hindi tiyak sa Hebreo ang eksaktong uri ng damit.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: isinuot na ng hari
  rationale: Tinutukoy nito ang kasuotang aktuwal nang ginamit ng hari. Ang “na” ay likas na naghahatid ng dating pagkakasuot at kasalukuyang kaugnayan nito.
- source_word: וְסוּס
  choice: at ang isang kabayo
  rationale: Ipinakikilala ang ikalawang bagay na ipapakuha; pinananatili ng “isang” ang kawalan ng tiyak na pantukoy sa Hebreo, habang ang “ang” ay minamarkahan ito bilang layon sa Filipino.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: sinakyan na ng hari
  rationale: Malinaw at natural nitong ipinahahayag na ang kabayo ay personal nang nasakyan ng hari, nang hindi kailangang tumbasan nang mekanikal ang preposisyong עַל.
- source_word: וַאֲשֶׁר נִתַּן
  choice: at pinutungan
  rationale: Ang passive na “inilagay” kasama ng “sa ulo nito” ay likas na naipahahayag sa Filipino bilang “pinutungan,” habang nananatiling ang kabayo ang pinakamalapit at pinakanatural na tinutukoy.
- source_word: כֶּתֶר מַלְכוּת
  choice: ng maharlikang korona
  rationale: Ang “maharlikang korona” ay maikli at idiomatikong katumbas ng koronang nauukol sa pagkahari; hindi ginawang tiyak dahil walang artikulo ang Hebreo.
- source_word: בְּרֹאשׁוֹ
  choice: pinutungan
  rationale: Nakapaloob sa pandiwang Filipino ang ideyang inilagay ang korona sa ulo. Ang panlalaking panghalip sa Hebreo ay pinakamalamang na tumutukoy sa kabayo, ngunit maaaring iugnay ng ilang mambabasa sa hari; kaya nililinaw sa talababa ang tunay na sintaktikong tensiyon.
