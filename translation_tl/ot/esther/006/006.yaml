base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: tl
  text: Kaya pumasok si Haman, at sinabi sa kanya ng hari, “Ano ang dapat gawin para sa taong kinalulugdan ng hari na parangalan?” Sinabi ni Haman sa kanyang sarili[a], “Sino ang nanaisin ng hari na parangalan nang higit kaysa sa akin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Sinabi ni Haman sa kanyang puso.”
    reason: Ipinaaalam ang literal na idyomang Hebreo sa likod ng natural na saling “sa kanyang sarili.”
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: Kaya pumasok si Haman
  rationale: Isinusulong ng wayyiqtol ang salaysay. Likas sa Filipino ang “pumasok,” at ipinakikita ng “kaya” ang pagpapatuloy mula sa naunang pangyayari.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: at sinabi sa kanya ng hari
  rationale: Pinananatili ang karaniwang kahulugan ng אָמַר na “sinabi,” kahit patanong ang kasunod na pananalita.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: Ano ang dapat gawin para sa taong
  rationale: Ipinahahayag ng infinitive construction ang nararapat gawin, at natural na katumbas ng בָּאִישׁ sa kontekstong ito ang “para sa taong.”
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: kinalulugdan ng hari na parangalan
  rationale: Ipinapahayag ng חָפֵץ ang pagkagiliw o pagkalugod, samantalang ang יְקָר dito ay karangalang ipinagkakaloob. Ang parirala ay natural at nagpapanatili sa dalawang ideya.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Sinabi ni Haman sa kanyang sarili
  rationale: Ang literal na idyomang Hebreo ay “sinabi sa kanyang puso,” na tumutukoy sa panloob na pagsasalita. Ang “sa kanyang sarili” ang malinaw at natural na katumbas sa modernong Filipino; inilalahad sa talababa ang literal na larawan.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: Sino ang nanaisin ng hari na parangalan
  rationale: Ang “nanaisin” ay angkop sa retorikal na paghihinuha ni Haman, at ang “parangalan” ay maikli at tumpak na katumbas ng paggawa o pagkakaloob ng karangalan.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: nang higit kaysa sa akin
  rationale: Malinaw nitong pinananatili ang paghahambing at ang mapagmataas na palagay ni Haman nang hindi nagdaragdag ng paliwanag.
