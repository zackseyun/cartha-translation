translation_notes:
  register: Gumamit ng natural, makabago, at marangal na Filipino. Pinanatili ang pangatlong panauhang pagtukoy ng hari sa sarili, gaya ng nasa Hebreo, at iniwasang dagdagan ang retorikal na tanong ni Haman ng mga salitang wala sa teksto.
