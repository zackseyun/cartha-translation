translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na pag-uulit ng “bumagsak/babagsak” at “sa harap niya,” gayundin ang katawagang “mga pantas” na angkop sa sinaunang tagpo.
