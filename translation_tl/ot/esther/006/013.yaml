base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: tl
  text: Isinalaysay ni Haman sa asawa niyang si Zeres at sa lahat ng kanyang kaibigan ang lahat ng nangyari sa kanya. Sinabi sa kanya ng kanyang mga pantas at ng asawa niyang si Zeres, “Kung si Mardokeo ay mula sa lahi ng mga Judio,[a] at nagsimula ka nang bumagsak sa harap niya, hindi mo siya madadaig, sapagkat tiyak na babagsak ka sa harap niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa binhi ng mga Judio.”
    reason: Pinananatili ang literal na larawang taglay ng זֶרַע habang gumagamit ang pangunahing teksto ng mas natural na pahayag para sa angkan o pinagmulan.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Isinalaysay
  rationale: Ipinahihiwatig ng pandiwa ang pagkukuwento o paglalahad ni Haman ng mga naganap; natural at marangal sa makabagong Filipino ang “isinalaysay.”
- source_word: אֹהֲבָיו
  choice: kanyang kaibigan
  rationale: Bagaman literal na tumutukoy sa mga umiibig o nagmamahal sa kanya, ang konteksto ay tungkol sa mga malapit na kasamahan ni Haman; malinaw at idiomatiko ang “mga kaibigan.”
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: ang lahat ng nangyari sa kanya
  rationale: Tuwirang ipinapahayag nito ang lahat ng sumapit o naganap kay Haman, sa natural na anyong Filipino.
- source_word: חֲכָמָיו
  choice: kanyang mga pantas
  rationale: Pinananatili ng “mga pantas” ang literal na diwa ng mga taong kinikilalang marunong, nang hindi tahasang nililimitahan ang kanilang tungkulin sa pagiging mga tagapayo.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: ay mula sa lahi ng mga Judio
  rationale: Ang זֶרַע ay literal na “binhi” ngunit dito ay tumutukoy sa angkan o pinagmulan. Natural sa Filipino ang “mula sa lahi,” habang inilalagay sa talababa ang literal na larawan.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: sa harap niya ay nagsimula ka nang bumagsak
  rationale: Pinananatili ang pagsisimula ng pagbagsak at ang pariralang “sa harap niya,” na mahalagang inuulit sa hulihan ng pangungusap.
- source_word: לֹא תוּכַל לוֹ
  choice: hindi mo siya madadaig
  rationale: Sa konteksto ng tunggalian, ang parirala ay nangangahulugang hindi mananaig si Haman laban kay Mardokeo; maikli at natural ang “hindi mo siya madadaig.”
- source_word: נָפוֹל תִּפּוֹל
  choice: tiyak na babagsak ka
  rationale: Ang infinitive absolute na kasunod ng pandiwang may parehong ugat ay nagbibigay ng matinding katiyakan; ipinapahayag ito ng “tiyak.”
- source_word: לְפָנָיו
  choice: sa harap niya
  rationale: Pinananatili ang pag-uulit sa Hebreo at ang diwa ng pagkatalo o pagbagsak kaugnay ni Mardokeo.
