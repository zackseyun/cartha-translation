revisions:
- from: Isinalaysay ni Haman sa asawa niyang si Zeres at sa lahat ng kanyang kaibigan ang lahat ng nangyari sa kanya. Sinabi sa kanya ng kanyang mga pantas at ng asawa niyang si Zeres, “Kung si Mardokeo, na sa harap niya ay nagsimula ka nang bumagsak, ay mula sa lahi ng mga Judio,[a] hindi mo siya madadaig, sapagkat tiyak na babagsak ka sa harap niya.”
  to: Isinalaysay ni Haman sa asawa niyang si Zeres at sa lahat ng kanyang kaibigan ang lahat ng nangyari sa kanya. Sinabi sa kanya ng kanyang mga pantas at ng asawa niyang si Zeres, “Kung si Mardokeo ay mula sa lahi ng mga Judio,[a] at nagsimula ka nang bumagsak sa harap niya, hindi mo siya madadaig, sapagkat tiyak na babagsak ka sa harap niya.”
  rationale: Inayos ang pagkakasunod ng mga sugnay upang malinaw na si Mardokeo ang tinutukoy ng “niya.” Napanatili ang kundisyunal na pahayag, ang konsepto ng lahi, ang pag-uulit ng “bumagsak/babagsak,” ang “sa harap niya,” at ang mariing katiyakan ng Hebreong infinitive absolute.
