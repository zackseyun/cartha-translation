  to: Pagkatapos ay sinabi ng hari[a], “Anong karangalan at kadakilaan ang iginawad kay Mordecai dahil dito?” Sumagot ang mga kabataang lalaki ng hari na naglilingkod sa kaniya, “Walang ginawa para sa kaniya.”
