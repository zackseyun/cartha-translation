base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari[a], “Anong karangalan at kadakilaan ang iginawad kay Mordecai dahil dito?” Sumagot ang mga kabataang lalaki ng hari na naglilingkod sa kaniya, “Walang ginawa para sa kaniya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Anong karangalan at kadakilaan ang ginawa para kay Mordecai dahil dito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: Anong ... ang iginawad
  rationale: Ang pasibong anyo ng עשה ay nagtatanong kung anong pagkilos ang isinagawa. Sa kaugnayan ng ‘karangalan at kadakilaan,’ natural sa Filipino ang ‘iginawad’ at pinananatili nito ang pasibong diwa.
- source_word: יְקָר
  choice: karangalan
  rationale: Sa konteksto ng korte, tumutukoy ito sa pagpaparangal sa isang tao, hindi sa materyal na kahalagahan.
- source_word: וּגְדוּלָּה
  choice: kadakilaan
  rationale: Pinananatili nito ang karaniwang kahulugan na ‘greatness’ at ang pagkakahanay nito sa ‘karangalan,’ nang hindi nililimitahan sa promosyon o partikular na katungkulan.
- source_word: לְמָרְדֳּכַי
  choice: kay Mordecai
  rationale: Ang lamed ay nagmamarka sa tumanggap o benepisyaryo; ang ‘kay’ ang natural na anyo sa Filipino kasunod ng ‘iginawad.’
- source_word: עַל זֶה
  choice: dahil dito
  rationale: Tumutukoy ito sa naunang iniulat na ginawa ni Mordecai at malinaw na ipinahahayag ang sanhi o batayan ng paggawad.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: mga kabataang lalaki ng hari
  rationale: Pinananatili ang literal na sangkap na ‘young men,’ habang ang kasunod na parirala ang nagpapahayag ng kanilang paglilingkod.
- source_word: מְשָׁרְתָיו
  choice: na naglilingkod sa kaniya
  rationale: Ang participle mula sa שרת ay tumutukoy sa personal na paglilingkod o pag-aasikaso sa hari; malinaw at natural ang parirala sa Filipino.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: Wala pang ginawa para sa kaniya
  rationale: Idyomatikong ipinahihiwatig na walang anumang pagkilos na naisagawa para sa kapakanan ni Mordecai. Ang ‘pang’ ay angkop sa kontekstong sinusuri ang mga naunang pangyayari.
