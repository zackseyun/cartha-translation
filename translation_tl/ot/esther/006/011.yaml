translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “balabal,” “liwasan,” at “ipinahayag” upang mapanatili ang pormal at pampublikong tagpo, habang iniwasang idagdag ang “maharlika” kung wala ito sa mismong talata.
