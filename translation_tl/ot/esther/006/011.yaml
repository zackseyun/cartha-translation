base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: tl
  text: Kaya kinuha ni Haman ang balabal at ang kabayo. Isinuot niya kay Mardoqueo ang balabal at pinasakay niya si Mardoqueo sa kabayo sa liwasan ng lungsod.[a] Sumigaw siya sa harap niya, “Ganito ang gagawin para sa lalaking kinalulugdan ng hari na parangalan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “pinangyari niyang sumakay si Mardoqueo sa kabayo sa liwasan ng lungsod.” Causative ang pandiwang Hebreo: ipinahihiwatig nito na si Haman ang nagpangyari na makasakay si Mardoqueo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: ang balabal
  rationale: Tumutukoy ang tiyak na pangngalang isahan sa natatanging kasuotang nabanggit sa naunang konteksto. Ang “balabal” ay likas, marangal, at mas tiyak kaysa sa pangkalahatang “kasuotan.”
- source_word: הַסּוּס
  choice: ang kabayo
  rationale: Payak na “ang kabayo” ang nasa Hebreo. Hindi na idinagdag ang “maharlika” sapagkat malinaw na ang kaugnayan nito sa hari mula sa naunang talata.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: Isinuot niya kay Mardoqueo ang balabal
  rationale: Ipinahahayag ng Hiphil ng לבש na dinamitan ni Haman si Mardoqueo. Natural sa modernong Tagalog ang tahasang pagbanggit sa balabal bilang isinuot.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: pinasakay ito sa kabayo at inilibot
  rationale: 'Ang pandiwa ay causative mula sa רכב: pinasakay o pinangyaring sumakay ni Haman si Mardoqueo. Ipinakikita ng “inilibot” ang pampublikong prusisyon sa liwasan nang hindi ipinapalagay na si Haman mismo ang nakasakay.'
- source_word: בִּרְחוֹב הָעִיר
  choice: sa liwasan ng lungsod
  rationale: Ang רְחוֹב ay karaniwang malawak na pampublikong lugar o liwasan, hindi lamang isang karaniwang lansangan.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: Habang nasa unahan ni Mardoqueo, ipinahayag ni Haman
  rationale: Ang קרא rito ay pormal at pampublikong paghahayag. Pinananatili ng “nasa unahan” ang lokasyong ipinahahayag ng לְפָנָיו nang hindi dinaragdagan ang paraan ng paglakad o pangunguna.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Ganito ang gagawin
  rationale: Pinananatili nito ang demonstratibo at pasibong diwa ng pormula, kasama ang prospektibong puwersa nito sa konteksto.
- source_word: לָאִישׁ
  choice: sa lalaking
  rationale: Pinananatili ang tiyak at pangkalahatang isahang panlalaki ng Hebreo at ang paulit-ulit na pormula sa korte.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: kinalulugdan ng hari na parangalan
  rationale: Ipinapahayag ng חפץ ang lugod o kasiyahan, samantalang ang יקר sa kontekstong ito ay karangalang ipinagkakaloob. Pinananatili ng parirala ang parehong pabor ng hari at ang layuning parangalan.
