translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘kasuotan’ sa halip na mas teknikal o makalumang termino, at ‘liwasan’ upang ilarawan ang pampublikong bukas na lugar. Pinanatili ang pormal na pahayag sa tuwirang sipi.
