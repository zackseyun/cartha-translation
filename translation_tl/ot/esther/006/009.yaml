  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: tl
  text: At ipagkatiwala ang kasuotan at ang kabayo sa isa sa mga marangal na mataas na opisyal ng hari. Bihisan nila ang lalaking nais parangalan ng hari, pasakayin siya sa kabayo at ilibot sa liwasan ng lungsod, at isigaw sa harap niya, ‘Ganito ang gagawin sa lalaking nais parangalan ng hari.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתוֹן ... עַל יַד
  choice: ipagkatiwala ... sa
  rationale: Ang idyomang Hebreo ay literal na ‘ibigay sa kamay’; ipinahahayag dito ang pagpapasa ng pananagutan o pangangasiwa, kaya natural ang ‘ipagkatiwala sa.’
- source_word: מִשָּׂרֵי הַמֶּלֶךְ הַפַּרְתְּמִים
  choice: isa sa mga marangal na pinuno ng hari
  rationale: Ang שָׂרֵי ay mga pinuno o mataas na opisyal, at ang hiram na terminong פַּרְתְּמִים ay tumutukoy sa mga maharlika o marangal na tao. Pinananatili ng salin ang dalawang ideya nang hindi gumagamit ng lipas na katawagan.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: nais parangalan
  rationale: Ang parirala ay tumutukoy sa taong kinalulugdan o ninanais ng hari na bigyan ng karangalan; ‘nais parangalan’ ang malinaw at natural na katumbas sa konteksto.
- source_word: וְהִרְכִּיבֻהוּ עַל הַסּוּס
  choice: pasakayin siya sa kabayo
  rationale: Ang pandiwang causative ay ‘ipinasakay/pasakayin,’ hindi lamang ‘pangunahan’ ang taong nakasakay.
- source_word: בִּרְחוֹב הָעִיר
  choice: sa liwasan ng lungsod
  rationale: Ang רְחוֹב ay maluwang na pampublikong lugar o plaza sa lungsod, kaya higit na tiyak ang ‘liwasan’ kaysa karaniwang ‘daan.’
- source_word: וְקָרְאוּ לְפָנָיו
  choice: ipahayag sa unahan niya
  rationale: Ang לְפָנָיו ay literal na ‘sa harap/unahan niya’ at maaaring mangahulugang habang nauuna sa prusisyon; pinananatili ang larawang ito.
