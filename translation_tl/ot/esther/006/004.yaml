base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: tl
  text: At sinabi ng hari, “Sino ang nasa looban?” Noon, nakapasok na si Haman sa panlabas na looban ng palasyo ng hari upang kausapin ang hari tungkol sa pagbitay kay Mordecai sa bitayan[a] na inihanda niya para kay Mordecai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “puno” o “kahoy” ang salitang Hebreo na עֵץ. Dito, tumutukoy ito sa istrukturang inihanda ni Haman para sa pagpatay kay Mordecai; maaaring tulos o bitayan ang anyo nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: looban / panlabas na looban
  rationale: Ang חָצֵר ay isang napaliligirang court o courtyard. Ang “looban” ay likas sa Filipino at malinaw sa konteksto ng palasyo; idinagdag ang “panlabas” sa ikalawang pagbanggit ayon sa הַחִיצוֹנָה.
- source_word: וְהָמָן בָּא
  choice: Noon, nakapasok na si Haman
  rationale: Nagbibigay ang sugnay ng pangyayaring kasabay at nasa likuran ng tanong ng hari. Ang “nakapasok na” ay nagpapakitang naroon na si Haman sa panlabas na looban nang magtanong ang hari, nang hindi labis na pinipino ang eksaktong pagkakasunod-sunod.
- source_word: בֵּית הַמֶּלֶךְ
  choice: palasyo ng hari
  rationale: Bagaman literal na “bahay ng hari,” ang tinutukoy sa maharlikang konteksto ay ang palasyo.
- source_word: הַחִיצוֹנָה
  choice: panlabas
  rationale: Ipinakikita ng pang-uri ang pagkakaiba nito sa panloob na looban.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: upang kausapin ang hari
  rationale: Ang infinitive ng אמר dito ay nagpapahayag ng layunin ng paglapit ni Haman para magsalita sa hari. Malinaw at natural ang “kausapin” nang hindi dinaragdagan ang nilalaman ng kanyang sasabihin.
- source_word: לִתְלוֹת
  choice: tungkol sa pagbitay
  rationale: Ang תלה ay nangangahulugang ibitin o isabit at sa kontekstong ito ay tumutukoy sa pagpatay kay Mordecai. Ang pariralang “tungkol sa pagbitay” ay natural na nakakabit sa “kausapin ang hari.”
- source_word: הָעֵץ
  choice: bitayan
  rationale: Literal na “puno” o “kahoy” ang עֵץ, ngunit dito ay isang istrukturang kahoy na inihanda para sa pagpatay. Ginamit ang madaling maunawaang “bitayan,” habang inilalahad sa talababa ang mas malawak na kahulugan ng Hebreo.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: na inihanda niya para rito
  rationale: Si Haman ang likas na simuno ng “inihanda,” at si Mordecai ang tinutukoy ng hulíng panghalip. Ang “rito” ay umiiwas sa kalituhan ng magkakasunod na “niya” sa Filipino.
