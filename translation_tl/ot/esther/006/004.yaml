translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maikling tanong ng hari at ang dramatikong pagsabay ng pagdating ni Haman. Inilagay ang panandang [a] sa “bitayan,” ang salitang aktuwal na tinatalakay ng talababa.
