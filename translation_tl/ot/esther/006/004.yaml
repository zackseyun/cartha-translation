  to: At sinabi ng hari, “Sino ang nasa looban?” Noon, nakapasok na si Haman sa panlabas na looban ng palasyo ng hari upang kausapin ang hari tungkol sa pagbitay kay Mordecai sa bitayan[a] na inihanda niya para kay Mordecai.
