  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: tl
  text: Habang kausap pa nila siya, dumating ang mga eunuko[a] ng hari at nagmadali silang dalhin[b] si Haman sa handaang inihanda ni Ester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal ng hari,” sapagkat ang salitang Hebreo ay maaaring tumukoy sa mga opisyal ng palasyo at hindi lamang sa mga eunuko.
    reason: lexical_alternative
  - marker: b
    text: O “dali-dali nilang dinala” o “minadali nilang dalhin”; ipinahihiwatig ng pandiwang Hebreo ang apurahang pagkilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: Habang kinakausap pa nila siya
  rationale: Ipinahahayag ng עוֹדָם kasama ng pandiwaring מְדַבְּרִים ang patuloy at hindi pa tapos na pagsasalita. Ang “kinakausap pa nila siya” ay natural sa modernong Tagalog at malinaw na nagpapanatili sa kaugnayan nila kay Haman.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: mga eunuko ng hari
  rationale: Maaaring tumukoy ang סָרִיס sa mga opisyal ng palasyo, ngunit karaniwan din itong nangangahulugang mga eunuko. Pinili ang mas tuwirang kahulugan at inilagay sa talababa ang mas malawak na alternatibo.
- source_word: הִגִּיעוּ
  choice: dumating
  rationale: Tuwirang ipinahahayag nito ang pagdating ng mga tauhan ng hari sa pinangyayarihan.
- source_word: וַיַּבְהִלוּ לְהָבִיא
  choice: dali-dali nilang dinala
  rationale: Ang Hiphil ng בהל sa kontekstong ito ay nagpapahiwatig ng apurahang pagkilos upang dalhin si Haman. Ang “dali-dali nilang dinala” ay natural at hindi kinakailangang magpahiwatig ng takot o pagkataranta.
- source_word: הַמִּשְׁתֶּה
  choice: handaang
  rationale: Ang מִשְׁתֶּה ay isang piging o bangkete, kadalasang may alak. Ang “handaan” ay malinaw, natural, at marangal sa salaysay.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: inihanda ni Ester
  rationale: Bagaman literal na “ginawa,” ang “inihanda” ang likas na gamit sa Tagalog para sa isang handaan at ipinahihiwatig na nakahanda na iyon bago nila sunduin si Haman.
