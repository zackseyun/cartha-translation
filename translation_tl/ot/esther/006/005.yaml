base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: tl
  text: Sinabi sa kanya ng mga tagapaglingkod ng hari, “Narito, nakatayo si Haman sa patyo[a].” Sinabi ng hari, “Papasukin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “looban ng palasyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: mga tagapaglingkod ng hari
  rationale: Sa konteksto ng palasyo, ang נַעַר ay maaaring tumukoy sa isang kabataan, lingkod, o tagapaglingkod. Ang “mga tagapaglingkod” ay malinaw na naghahayag ng kanilang tungkulin nang hindi ipinapalagay ang kanilang edad.
- source_word: הִנֵּה
  choice: Narito
  rationale: Ang הִנֵּה ay pantawag-pansin na tumutukoy sa kasalukuyang kalagayan. Ang “Narito” ay natural at marangal sa Filipino at pinananatili ang agarang pagtukoy kay Haman.
- source_word: עֹמֵד
  choice: nakatayo
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na kalagayan. Ang “nakatayo” ay tuwirang nagsasaad ng postura at hindi nagdaragdag ng interpretasyong “naghihintay.”
- source_word: בֶּחָצֵר
  choice: sa patyo
  rationale: Ang חָצֵר ay tumutukoy sa isang court o courtyard. Ang “patyo” ang malinaw at karaniwang salitang Filipino para sa bukás na looban sa konteksto ng palasyo; ang “looban” ay pinanatili bilang alternatibo sa talababa.
- source_word: יָבֹא
  choice: Papasukin siya
  rationale: Ang anyong ito ay may puwersa ng utos o pahintulot. Ang “Papasukin siya” ay natural na utos sa Filipino at malinaw na ipinahihiwatig ang pagpasok ni Haman sa kinaroroonan ng hari.
- source_word: הָמָן
  choice: Haman
  rationale: Pinanatili ang karaniwang transliterasyon ng pangalang pantangi.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling himig ng salaysay at ang tuwirang utos ng hari. Inilagay ang talababa sa “patyo,” ang salitang may tunay na leksikal na alternatibo.
