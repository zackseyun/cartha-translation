  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: tl
  text: Pagkaraan nito, bumalik si Mordecai sa tarangkahan ng hari. Ngunit dali-daling umuwi si Haman[a], nagdadalamhati at nakatalukbong ang ulo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “napilitang umuwi” o “itinulak pauwi,” upang maipakita ang pasibong diwa ng pandiwang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang pagtatakip ng ulo ay tanda noon ng dalamhati, kahihiyan, o pagluluksa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Ang pandiwang שׁוּב sa daloy ng salaysay ay nagsasaad ng pagbabalik sa dating lugar o tungkulin; tuwiran at likas sa modernong Tagalog ang “bumalik.”
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: pintuang-daan ng hari
  rationale: Pinananatili nito ang konkretong tambalang Hebreo para sa pasukan o pook sa kompleks ng palasyo na kaugnay ng hari.
- source_word: נִדְחַף
  choice: dali-daling umuwi
  rationale: Ang Niphal ng דחף ay maaaring magpahiwatig na siya ay itinulak o napilitang kumilos. Sa konteksto, malinaw ang mabilis at kahiya-hiyang pag-alis ni Haman; natural na ipinahahayag ito ng “dali-daling umuwi,” habang inilalagay sa talababa ang tunay na posibleng pasibong diwa.
- source_word: בֵּיתוֹ
  choice: umuwi
  rationale: Ang literal na “sa kanyang bahay” ay likas na naipahahayag sa Tagalog sa pandiwang “umuwi,” nang hindi binabago ang patutunguhan.
- source_word: אָבֵל
  choice: nagdadalamhati
  rationale: Inilalarawan nito ang kalagayan ni Haman bilang nasa dalamhati o pagluluksa; ang “nagdadalamhati” ay marangal at malinaw sa kasalukuyang Tagalog.
- source_word: חֲפוּי רֹאשׁ
  choice: may takip ang ulo
  rationale: Pinananatili ang konkretong larawang Hebreo sa halip na palitan ito ng interpretasyong gaya ng “napahiya.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “pintuang-daan” upang malinaw na tumukoy sa mahalagang pasukan ng palasyo, at pinanatili ang konkretong kilos ng pagtatakip ng ulo. Ang mga pananda ng talababa ay inilagay sa mismong pariralang kanilang ipinaliliwanag.
