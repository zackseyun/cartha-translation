- from: Pagkatapos, bumalik si Mordecai sa pintuang-daan ng hari. Ngunit si Haman ay dali-daling umuwi[a], nagdadalamhati at may takip ang ulo[b].
  to: Pagkaraan nito, bumalik si Mordecai sa tarangkahan ng hari. Ngunit dali-daling umuwi si Haman[a], nagdadalamhati at nakatalukbong ang ulo[b].
  rationale: Pinalitan ang “pintuang-daan” ng “tarangkahan” upang tumpak na maipahiwatig ang hariang tarangkahan sa salaysay. Pinalitan ang di-likas na “may takip ang ulo” ng “nakatalukbong ang ulo,” na pinananatili ang kongkretong imahen at ang hindi tiyak na saklaw nito (pagdadalamhati at/o kahihiyan). Nananatili ang talababa sa “umuwi,” kung saan naroon ang pandiwang Hebreong may pasibong puwersa, at sa pariralang tumutukoy sa natakpang ulo.
