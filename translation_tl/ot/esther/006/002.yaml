base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: tl
  text: At natagpuang nakasulat na iniulat ni Mardokeo ang tungkol kina Bigtana at Teres[a], dalawa sa mga eunuko[b] ng hari na kabilang sa mga bantay ng pasukan, na naghangad na magbuhat ng kamay laban kay Haring Ahasuero.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Bigtana” ay mula sa anyong Hebreo ng pangalan sa talatang ito; sa ibang bahagi, lumilitaw ang pangalan bilang “Bigtan.”
    reason: alternative_reading
  - marker: b
    text: O “mga opisyal sa korte.” Ang salitang Hebreo ay maaaring tumukoy mismo sa mga eunuko o, sa mas malawak na diwa, sa mga opisyal ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: natagpuang nakasulat
  rationale: Pinananatili nito ang impersonal na anyong pasibo at ang diwang natuklasan ang bagay sa nakasulat na tala.
- source_word: הִגִּיד
  choice: isinumbong
  rationale: Sa konteksto ng sabwatan at opisyal na tala ng palasyo, likas na ipinahihiwatig ng pandiwa na ipinaalam ni Mardokeo sa awtoridad ang ginawa ng dalawang lalaki.
- source_word: עַל
  choice: ang tungkol kina
  rationale: Ipinakikilala rito ng pang-ukol ang paksa ng isinumbong; hindi kailangang gawing tahasang “laban kina.”
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Bigtana at Teres
  rationale: Sinusunod ng “Bigtana” ang anyo ng pangalang nasa talatang ito; iniangkop sa karaniwang baybay at bigkas sa Filipino ang dalawang pangalan.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: dalawa sa mga eunuko ng hari
  rationale: Ang סָרִיס ay karaniwang tumutukoy sa eunuko sa maharlikang korte, bagaman maaari rin itong mangahulugang opisyal; pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: kabilang sa mga bantay ng pasukan
  rationale: Ipinahahayag ng “kabilang sa” ang partitive na מִן, samantalang mas natural sa modernong Filipino ang “pasukan” kaysa sa literal na “bungad” o “bukana” sa tungkuling ito.
- source_word: בִּקְשׁוּ
  choice: nagnais
  rationale: Pinananatili nito ang kahulugan ng paghahangad o pagnanais nang hindi ipinapalagay na naisagawa na nila ang balak.
- source_word: לִשְׁלֹחַ יָד
  choice: pagbuhatan ng kamay
  rationale: Ito ang natural na idyomang Filipino para sa pag-unat ng kamay laban sa isang tao na may masamang layunin, nang hindi nililimitahan ang diwa sa isang tiyak na paraan ng pananakit.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: si Haring Ahasuero
  rationale: Ang “si” ang likas na pananda sa Filipino kasunod ng idyomang “pagbuhatan ng kamay,” at “Ahasuero” ang nakaugaliang anyong Filipino ng pangalan.
