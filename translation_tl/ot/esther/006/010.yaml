    rationale: Ang Hebreo ay nagsasabing “sa tarangkahan ng hari.” Malinaw na maaaring iyon ay tarangkahan ng kompleks ng hari sa konteksto, ngunit mas mainam na iwan ang pagpapaliwanag na ito sa talababa upang hindi lumawak ang pangunahing teksto.
  - severity: low
