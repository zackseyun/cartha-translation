base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: tl
  text: Sinabi ng hari kay Haman, “Magmadali ka! Kunin mo ang kasuotan at ang kabayo, gaya ng sinabi mo, at gawin mo iyon para kay Mardokeo na Judio[a], na nakaupo sa tarangkahan ng hari.[b] Huwag mong kaligtaan ang anuman sa lahat ng sinabi mo.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “Judeano.” Dito, malamang na tinutukoy nito ang etniko at panrelihiyong pagkakakilanlan ni Mardokeo sa loob ng salaysay.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “tarangkahan ng hari.” Sa konteksto, malamang na tumutukoy ito sa tarangkahan ng kompleks ng hari at sa lugar ng paglilingkod o opisyal na gawain.
    reason: cultural_clarity
  - marker: c
    text: Sa mas literal na salin, “Huwag mong hayaang may anumang mahulog mula sa lahat ng sinabi mo,” isang idyomang nangangahulugang walang dapat kaligtaan o alisin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Magmadali ka!
  rationale: Tuwirang pautos na nagpapahayag ng agarang pagkilos; natural at kasalukuyang Filipino ang “Magmadali ka.”
- source_word: קַח
  choice: Kunin mo
  rationale: Karaniwang katumbas ng pautos na לקח at angkop sa pagkuha sa kasuotan at kabayo upang gamitin sa parangal.
- source_word: הַלְּבוּשׁ
  choice: ang kasuotan
  rationale: Tumutukoy sa maharlikang kasuotang binanggit sa naunang talata. Mas malawak nang kaunti kaysa “balabal,” kaya hindi labis na tinutukoy ang eksaktong anyo ng damit.
- source_word: הַסּוּס
  choice: ang kabayo
  rationale: Payak na isinasalin ang tahasang pangngalan; hindi idinagdag sa mismong teksto ang “maharlika,” bagaman malinaw iyon sa konteksto.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: gaya ng sinabi mo
  rationale: Pinananatili ang ironikong diin na ang sariling mungkahi ni Haman ang ipinagagawa ngayon ng hari.
- source_word: וַעֲשֵׂה כֵן
  choice: at gawin mo iyon
  rationale: Natural at maikli sa Filipino, at malinaw na tumutukoy sa lahat ng paraang iminungkahi ni Haman.
- source_word: לְמָרְדֳּכַי
  choice: para kay Mardokeo
  rationale: 'Ipinapahayag ang benepaktibong gamit ng לְ: si Mardokeo ang pararangalan sa paraang ito.'
- source_word: הַיְּהוּדִי
  choice: na Judio
  rationale: Sa salaysay ng Esther, karaniwang tumutukoy ito sa etniko at panrelihiyong pagkakakilanlan, hindi lamang sa heograpikong pinagmulan.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: na nakaupo sa tarangkahan ng palasyo ng hari
  rationale: Ang participle ay naglalarawan sa kinikilalang puwesto ni Mardokeo. Idinagdag ang “palasyo” para maging likas at malinaw sa Filipino ang “tarangkahan ng hari,” nang hindi binabago ang tinutukoy na lugar.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: Huwag mong kaligtaan ang kahit ano sa lahat ng sinabi mo
  rationale: 'Ipinahahayag nang malinaw ang Hebreong idyoma: walang bahagi ng mungkahi ni Haman ang dapat alisin o hindi gawin.'
