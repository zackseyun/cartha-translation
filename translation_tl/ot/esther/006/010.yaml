revisions:
- from: Sinabi ng hari kay Haman, “Magmadali ka! Kunin mo ang kasuotan at ang kabayo, gaya ng sinabi mo, at gawin mo iyon para kay Mardokeo na Judio[a], na nakaupo sa tarangkahan ng palasyo ng hari.[b] Huwag mong kaligtaan ang kahit ano sa lahat ng sinabi mo.[c]”
  to: Sinabi ng hari kay Haman, “Magmadali ka! Kunin mo ang kasuotan at ang kabayo, gaya ng sinabi mo, at gawin mo iyon para kay Mardokeo na Judio[a], na nakaupo sa tarangkahan ng hari.[b] Huwag mong kaligtaan ang anuman sa lahat ng sinabi mo.[c]”
  rationale: Inalis ang “palasyo” sa pangunahing teksto upang sundin ang tahasang pananalita ng Hebreo (“tarangkahan ng hari”), habang pinanatili ang kontekstuwal na paliwanag sa talababa. Bahagyang pinakinis din ang huling utos at ang literal na talababa upang maging mas natural na Filipino nang hindi nawawala ang saklaw ng Hebreong idyoma.
