  source_fidelity: Maayos na naipapahayag ng draft ang pagkabalisa ng hari sa pagtulog, ang utos na dalhin ang aklat, at ang pagbasa nito sa presensiya ng hari. Gayunman, ang “mga pangyayari sa kaharian” ay nagdaragdag ng “sa kaharian,” na wala sa Hebreo. Bagaman maharlika ang konteksto, hindi ito kailangang isingit sa salin.
  naturalness: Likas at angkop sa modernong Filipino Tagalog ang daloy ng pangungusap. Ang “sa harap ng hari” ay mas tuwirang tumutugma sa Hebreo kaysa “sa harap niya,” at iniiwasan nito ang bahagyang malabong panghalip.
  terminology: Ang “aklat ng mga tala ng alaala, ang mga talaan ng mga pangyayari” ay nagpapanatili sa magkadugtong ngunit appositional na mga katawagang Hebreo nang walang dagdag na saklaw. Ang “mga talaan ng mga pangyayari” ay natural na katumbas ng mga annal/chronicle sa kontekstong ito.
