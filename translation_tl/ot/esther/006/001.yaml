  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang 'mga salaysay ng mga pangyayari sa kaharian' upang linawin ang royal-annals context, habang inilalagay sa talababa ang mas pormal na 'mga taunang tala.'
