base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: tl
  text: Nang gabing iyon, hindi makatulog ang hari.[a] Kaya iniutos niyang dalhin ang aklat ng mga tala ng alaala, ang mga talaan ng mga pangyayari,[b] at binasa ang mga ito sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumayo ang tulog ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aklat ng mga alaala, ang mga taunang talaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Nang gabing iyon
  rationale: Likas na panandang temporal sa Tagalog na nagpapanatili sa pagtukoy sa partikular na gabi sa salaysay.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: hindi makatulog ang hari
  rationale: Malinaw at likas na Tagalog para sa idyomang Hebreo na literal na nagsasabing lumayo o gumala ang tulog ng hari; inilalahad sa talababa ang larawan ng orihinal.
- source_word: וַיֹּאמֶר
  choice: Kaya iniutos niyang
  rationale: Bagaman literal na 'at sinabi niya,' isang utos ang tungkulin ng pandiwa sa konteksto; ipinakikita rin ng 'kaya' ang bunga ng hindi niya pagkakatulog.
- source_word: לְהָבִיא
  choice: dalhin
  rationale: Ang pawatas ang nilalaman ng utos. Hindi kailangang tukuyin ang mga lingkod na inutusang magdala.
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: aklat ng mga tala
  rationale: Tumutukoy sa aklat ng mga bagay na iniingatan upang maalala, lalo na sa konteksto ng mga talaang maharlika.
- source_word: דִּבְרֵי הַיָּמִים
  choice: mga salaysay ng mga pangyayari sa kaharian
  rationale: Ipinahahayag ang annalistikong diwa ng parirala at ang appositional na ugnayan nito sa aklat ng mga tala, nang hindi ito mapagkamalang pangalan ng biblikal na aklat na Mga Cronica.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: at binasa ang mga iyon
  rationale: Pinananatili ang pasibong pagkilos at ang maramihang reperente ng mga tala o salaysay.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap niya
  rationale: Likas na Tagalog para sa pagbasa sa presensiya ng hari; malinaw ang reperente mula sa naunang sugnay.
