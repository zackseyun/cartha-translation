- from: Nang gabing iyon, hindi makatulog ang hari.[a] Kaya iniutos niyang dalhin ang aklat ng mga tala, ang mga salaysay ng mga pangyayari sa kaharian,[b] at binasa ang mga iyon sa harap niya.
  to: Nang gabing iyon, hindi makatulog ang hari.[a] Kaya iniutos niyang dalhin ang aklat ng mga tala ng alaala, ang mga talaan ng mga pangyayari,[b] at binasa ang mga ito sa harap ng hari.
  rationale: Inalis ang hindi tahasang “sa kaharian” upang maiwasan ang pagpapalawak ng saklaw ng Hebreo. Ginawang “aklat ng mga tala ng alaala, ang mga talaan ng mga pangyayari” ang appositional na parirala upang malinaw na isang aklat ng mga opisyal na tala ang tinutukoy. Ibinalik ang “hari” sa huling sugnay para sa tuwiran at malinaw na pagtutugma sa pinagmulan.
