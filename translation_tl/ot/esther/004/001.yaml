  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: tl
  text: Nang malaman ni Mardokeo ang lahat ng ginawa, pinunit niya ang kanyang mga damit at nagsuot ng kasuutang-sako at naglagay ng abo sa sarili. Pagkatapos, nagtungo siya sa gitna ng lungsod at sumigaw nang may malakas at mapait na sigaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, inuulit ang magkaugnay na pandiwa at pangngalan upang magbigay-diin; maaari ring isalin, “humiyaw siya ng isang malakas at mapait na hiyaw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: malaman
  rationale: Sa konteksto, tumutukoy ito sa pagkabatid ni Mardokeo sa naganap; natural na ipinahahayag ng “nang malaman” ang pag-usad ng salaysay.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: ang lahat ng ginawa
  rationale: Pinananatili nito ang pasibong diwa ng Hebreo nang hindi tahasang tinutukoy ang gumawa.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Malinaw at likas na Tagalog ito para sa nakaugaliang tanda ng matinding pagluluksa.
- source_word: שַׂק וָאֵפֶר
  choice: nagsuot ng telang-sako at naglagay ng abo sa katawan
  rationale: Nililinaw sa karaniwang mambabasa ang dalawang kilos ng pagluluksa nang hindi ipinapalagay na ang abo ay isinusuot na gaya ng damit.
- source_word: בְּתוֹךְ הָעִיר
  choice: sa gitna ng lungsod
  rationale: Tuwirang pinananatili ang puwersang panlunan ng בְּתוֹךְ nang natural sa Tagalog.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: humiyaw nang malakas at buong kapaitan
  rationale: Natural na inililipat sa Tagalog ang diin ng magkaugnay na pandiwa at pangngalan; ipinahahayag ng “malakas” ang גְדֹלָה sa kontekstong pandinig at ng “buong kapaitan” ang matinding dalamhati ng מָרָה.
