revisions:
- from: Nang malaman ni Mardokeo ang lahat ng ginawa, pinunit niya ang kanyang mga damit at nagsuot ng telang-sako at naglagay ng abo sa katawan. Pagkatapos, pumunta siya sa gitna ng lungsod at humiyaw nang malakas at buong kapaitan.[a]
  to: Nang malaman ni Mardokeo ang lahat ng ginawa, pinunit niya ang kanyang mga damit at nagsuot ng kasuutang-sako at naglagay ng abo sa sarili. Pagkatapos, nagtungo siya sa gitna ng lungsod at sumigaw nang may malakas at mapait na sigaw.[a]
  rationale: Inayos ang huling parirala upang maging likas na Filipino at sabay na mapanatili ang Hebreong pandiwa na may kaugnay na pangngalan para sa diin. Ginawang mas tuwiran ang paglalarawan sa abo at mas malinaw na kasuotan ang katawagang “kasuutang-sako.”
  reviewer_model: gpt-5.6-terra
