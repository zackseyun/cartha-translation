  text: And they told Mordecai Esther’s words[a].
translation:
  language: tl
  text: At sinabi nila kay Mardokeo ang mga salita ni Ester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mensahe ni Ester” o “ang sagot ni Ester.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: At sinabi nila
  rationale: Ang Hiphil wayyiqtol ng נגד ay nagsasaad ng kasunod na kilos sa salaysay at may di-tiyak na maramihang simuno. Likas sa modernong Tagalog ang “sinabi nila” at hindi ito kasing pormal ng “iniulat nila.”
- source_word: לְמָרְדֳּכָי
  choice: kay Mardokeo
  rationale: Minamarkahan ng ל ang di-tuwirang layon; natural itong isalin sa Tagalog gamit ang “kay.” Ang pangalang Hebreo ay tinumbasan bilang “Mardokeo,” isang malinaw at kinikilalang anyo sa Tagalog.
- source_word: אֵת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon sa Hebreo at wala itong bukod na katumbas sa Tagalog; ipinahihiwatig ng ayos ng pangungusap ang tungkulin nito.
- source_word: דִּבְרֵי
  choice: ang mga salita
  rationale: Ang construct plural ng דָּבָר ay maaaring mangahulugang “mga salita,” “mensahe,” o, ayon sa konteksto, “sagot.” Pinananatili ng “mga salita” ang pormal na anyo at ang pagtukoy sa mismong sinabi ni Ester.
- source_word: אֶסְתֵּר
  choice: ni Ester
  rationale: Ang construct na ugnayan sa דִּבְרֵי ay natural na ipinahahayag sa Tagalog sa pamamagitan ng “ni”; ang pangalan ay isinalin sa kinikilalang anyong “Ester.”
