  source_fidelity: 'Tumpak ang pagsasalin sa Hebreong וַיַּגִּידוּ לְמָרְדֳּכָי אֵת דִּבְרֵי אֶסְתֵּר: pinananatili nito ang di-tiyak na maramihang simuno, ang kilos ng pagsasabi/pagbibigay-alam, ang di-tuwirang layon na si Mardokeo, at ang “mga salita ni Ester.”'
  naturalness: Ang “At sinabi nila kay Mardokeo ang mga salita ni Ester” ay malinaw, maikli, at natural sa makabagong marangal na Tagalog. Bahagyang mas idiomatiko ang “ipinaalam nila,” ngunit mas malawak iyon kaysa sa payak na “sinabi,” kaya ang kasalukuyang anyo ay angkop sa optimal-equivalence.
