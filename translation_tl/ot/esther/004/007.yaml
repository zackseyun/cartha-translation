  to: Isinalaysay ni Mordecai sa kanya ang lahat ng nangyari sa kanya, pati ang eksaktong halaga ng salapi[a] na sinabi ni Haman na titimbangin niya para sa mga kabang-yaman ng hari upang lipulin ang mga Judio.
