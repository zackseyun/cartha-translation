base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: tl
  text: Isinalaysay ni Mordecai sa kanya ang lahat ng nangyari sa kanya, pati ang eksaktong halaga ng salapi[a] na sinabi ni Haman na titimbangin niya para sa mga kabang-yaman ng hari upang lipulin ang mga Judio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang detalyadong ulat tungkol sa salapi” o “ang kabuuan ng salapi.” Ang pariralang Hebreo ay tumutukoy sa tinukoy na halagang iminungkahi ni Haman na ibayad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: Isinalaysay
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Ang “isinalaysay” ay natural sa kontekstong pasalaysay at nagpapahiwatig ng pagbibigay ng buong ulat.
- source_word: לוֹ
  choice: sa kanya
  rationale: Tumutukoy kay Hatac ayon sa konteksto at tuwirang pinananatili ang panghalip ng Hebreo.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: ang lahat ng nangyari sa kanya
  rationale: Pinananatili nito ang kahulugan ng קָרָה at ang hulaping panghalip na tahasang tumutukoy sa nangyari kay Mordecai.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: ang eksaktong halaga ng salapi
  rationale: Maaaring tumukoy ang פָּרָשָׁה sa espesipikasyon, eksaktong pahayag, o buong ulat. Sa konteksto, malinaw at natural na ipinahahayag ng “eksaktong halaga” ang tinukoy na halagang iminungkahi ni Haman, habang inilalahad sa talababa ang tunay na leksikal na saklaw.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: sinabi ... na titimbangin niya
  rationale: Pinananatili nito kapwa ang kilos ng pagsasalita at ang konkretong larawan ng salaping sinusukat ayon sa timbang, sa halip na gawing pangkalahatang “babayaran.”
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: para sa mga ingatang-yaman ng hari
  rationale: Ipinapakita ng “para sa” ang nilalayong paglalagakan ng salapi, at pinananatili ng maramihang “mga ingatang-yaman” ang anyong maramihan ng גִּנְזֵי.
- source_word: ביהודיים לְאַבְּדָם
  choice: upang lipulin ang mga Judio
  rationale: Ipinahahayag nang natural sa Filipino ang layunin ng salapi at ang mga Judio bilang tudlaan ng mapanirang kilos. Ang “lipulin” ay angkop sa Piel ng אבד nang hindi kinakailangang gumamit ng mas teknikal na salita.
