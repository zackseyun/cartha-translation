  text: וַ/תִּקְרָא֩ אֶסְתֵּ֨ר לַ/הֲתָ֜ךְ מִ/סָּרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר הֶעֱמִ֣יד לְ/פָנֶ֔י/הָ וַ/תְּצַוֵּ֖/הוּ עַֽל מָרְדֳּכָ֑י לָ/דַ֥עַת מַה זֶּ֖ה וְ/עַל מַה זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Esther si Hatac[a], isa sa mga eunuko ng hari na itinalaga nitong maglingkod sa kanya. Inutusan niya ito tungkol kay Mardokeo upang alamin kung ano ang nangyayari at kung bakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isa sa mga opisyal ng hari.” Ang salitang Hebreo ay maaaring tumukoy mismo sa isang eunuko o, sa ilang konteksto, sa isang opisyal ng palasyo sa mas pangkalahatang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: Pagkatapos, ipinatawag ni Esther
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” at malinaw na ipinahihiwatig ng “ipinatawag” na pinapunta niya ang tao sa kanyang harapan.
- source_word: לַהֲתָךְ
  choice: si Hatac
  rationale: Isinalin sa baybay-Tagalog ang personal na pangalang Hebreo na Hathach bilang Hatac.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: isa sa mga eunuko ng hari
  rationale: Karaniwang tumutukoy ang סָרִיס sa isang eunuko sa kapaligiran ng palasyo, bagaman maaari rin itong mangahulugang opisyal ng hari; pinanatili sa talababa ang mas malawak na posibilidad.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: na itinalaga nitong maglingkod sa kanya
  rationale: Ang hari ang pinakanatural na paksa ng הֶעֱמִיד. Ipinahahayag ng parirala ang opisyal na pagtatalaga kay Hatac upang humarap at maglingkod kay Esther.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: Inutusan niya ito tungkol kay Mardokeo
  rationale: Pinananatili ng “inutusan” ang lakas ng צוה, habang ang “tungkol kay Mardokeo” ay maingat na naglalahad sa עַל nang hindi dinaragdagan ang di-tiyak na nilalaman ng utos.
- source_word: לָדַעַת
  choice: upang alamin
  rationale: Isinasalin ito bilang layunin ng utos at nagpapahiwatig ng aktibong pagsisiyasat.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: kung ano ang nangyayari at kung bakit
  rationale: Ang pares na tanong ay likas na tumutukoy sa kung ano ang kalagayan at ano ang dahilan nito. Iniiwasan ng salin ang matigas na literalismong “ano ito at dahil sa ano ito” habang pinananatili ang dalawang magkaibang tanong.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “eunuko” bilang tumpak at karaniwang terminong pangkasaysayan, na may talababa para sa posibleng mas malawak na kahulugan. Ang “nito” ay tumutukoy sa hari at iniiwasan ang kalabuan ng sunod-sunod na panghalip.
