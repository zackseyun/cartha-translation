translation:
  language: tl
  text: Kaya lumabas si Hatak at nagtungo kay Mardokeo sa liwasan[a] ng lungsod na nasa harap ng tarangkahan ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “maluwang na pampublikong lugar ng lungsod.” Ang salitang Hebreo ay tumutukoy sa isang malawak at bukás na pampublikong pook, hindi kinakailangang sa isang kalye sa makabagong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Ipinahihiwatig ng pandiwang יצא ang paglabas mula sa kinaroroonan ni Ester; likas at tuwiran ang “lumabas” sa salaysay.
- source_word: הֲתָךְ
  choice: Hatak
  rationale: Isinalin sa baybay na angkop sa modernong Tagalog ang pangalang Hebreo.
- source_word: אֶל מָרְדֳּכָי
  choice: pinuntahan si Mardokeo
  rationale: Ang אֶל ay nagpapahayag ng patutunguhan; malinaw at natural sa Tagalog ang “pinuntahan” sa kontekstong ito.
- source_word: אֶל רְחוֹב הָעִיר
  choice: sa liwasan ng lungsod
  rationale: Ang רְחוֹב ay isang maluwang at bukás na pampublikong lugar sa lungsod, kaya mas tumpak ang “liwasan” kaysa “kalye.”
- source_word: אֲשֶׁר לִפְנֵי
  choice: na nasa harap ng
  rationale: Pinananatili nito ang payak na ugnayang panlunan ng pariralang Hebreo.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: pintuang-daan ng hari
  rationale: Tumutukoy ito sa tarangkahan o pasukan ng kompleks ng hari; ang “pintuang-daan” ay malinaw at marangal na katumbas.
