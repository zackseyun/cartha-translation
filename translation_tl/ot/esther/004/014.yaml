  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: tl
  text: Sapagkat kung mananatili kang tahimik sa panahong ito, magmumula sa ibang lugar ang ginhawa at pagliligtas para sa mga Judio, ngunit ikaw at ang angkan ng iyong ama ay mapapahamak. At sino ang nakaaalam kung nakarating ka sa iyong katayuan bilang reyna para sa panahong tulad nito?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kung
  rationale: Pinananatili nito kapwa ang paliwanag na kaugnay ng naunang pahayag at ang kondisyon ng babala.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: mananatili kang tahimik
  rationale: Ipinahihiwatig ng magkaugnay na anyo ng pandiwa ang mariin at patuloy na pananahimik; natural itong naipahahayag sa Filipino sa ganitong paraan.
- source_word: בָּעֵת הַזֹּאת
  choice: sa panahong ito
  rationale: Tumutukoy ito sa kasalukuyang krisis at tuwirang nauunawaan sa modernong Filipino.
- source_word: רֶוַח וְהַצָּלָה
  choice: ginhawa at pagliligtas
  rationale: Ang una ay pahinga o luwag mula sa panganib, at ang ikalawa ay aktuwal na pagsagip. Pinananatili ang dalawang magkaugnay ngunit hindi lubos na magkaparehong diwa.
- source_word: יַעֲמֹד ... מִמָּקוֹם אַחֵר
  choice: magmumula sa ibang lugar
  rationale: Sa konteksto, ang literal na 'tatayo' ay tumutukoy sa paglitaw o pagdating ng tulong. Ang 'magmumula' ay natural at pinananatiling di-tiyak ang pinagmulan.
- source_word: לַיְּהוּדִים
  choice: para sa mga Judio
  rationale: Karaniwang modernong tawag ito sa bayang Judio sa konteksto ng aklat ni Esther.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: ngunit ikaw at ang angkan ng iyong ama
  rationale: Ang 'bahay ng ama' ay isang pananalitang Hebreo para sa pangkat ng kamag-anak sa panig ng ama. Mas malinaw sa Filipino ang 'angkan' kaysa literal na 'bahay' o 'sambahayan' sa kontekstong ito.
- source_word: תֹּאבֵדוּ
  choice: ay mapapahamak
  rationale: Saklaw nito ang pagkamatay at pagkawasak na maaaring ipahiwatig ng pandiwa nang hindi labis na nililimitahan ang kahulugan.
- source_word: וּמִי יוֹדֵעַ
  choice: At sino ang nakaaalam
  rationale: Pinananatili nito ang retorikal na tanong at ang kawalan ng tahasang katiyakan.
- source_word: אִם לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת
  choice: kung nakarating ka sa iyong katayuan bilang reyna para sa panahong tulad nito
  rationale: Inilalarawan ng הִגַּעַתְּ ang pagdating sa isang kalagayan, at sa konteksto ang מַלְכוּת ay ang maharlikang katayuan ni Esther. Iniiwasan ng salin ang pahiwatig na nakamit niya ito sa sariling pagsisikap.
theological_decisions:
- issue: Di-tahasang pagkilos ng Diyos sa 'ibang lugar' at 'panahong tulad nito'
  choice: Panatilihing hindi pinangalanan ang pinagmumulan ng pagliligtas at ang dahilan ng pagkareyna ni Esther.
  alternative: Tahasan itong iugnay sa Diyos o sa banal na kalooban.
  rationale: Malakas ang pahiwatig ng pagkalinga ng Diyos, ngunit hindi Siya tahasang binabanggit sa tekstong Hebreo. Pinananatili ng salin ang sinadyang pahiwatig at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang 'Judio,' 'angkan,' at 'katayuan bilang reyna' upang maging malinaw sa karaniwang mambabasa nang hindi pinapawi ang di-tiyak at di-tahasang pananalita ng Hebreo.
