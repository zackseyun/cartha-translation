  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: tl
  text: Kaya umalis si Mardokeo at ginawa ang lahat ng iniutos sa kanya ni Ester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpatuloy” o “dumaan.” Literal na nangangahulugang “dumaan” o “tumawid” ang pandiwang Hebreo, ngunit dito malamang na tumutukoy ito sa pag-alis ni Mardokeo upang gawin ang iniutos ni Ester.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: umalis
  rationale: Ang עבר ay literal na tumutukoy sa pagdaan o pagtawid, ngunit sa kontekstong ito malamang na nagsasaad ito ng pag-alis ni Mardokeo upang sundin ang tagubilin ni Ester. Natural at malinaw sa modernong Tagalog ang “umalis.”
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ang עשה ay karaniwang pandiwang “gumawa.” Pinananatili ng “ginawa” ang payak na estilo ng salaysay at natural itong kaugnay ng “ang lahat ng iniutos.”
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahihiwatig ng parirala ang lubos na pagsunod sa iniutos ni Ester. Sa Tagalog, naipapahayag nang natural ang diwang “ayon sa lahat ng” sa pamamagitan ng “ginawa ang lahat ng iniutos.”
- source_word: צִוְּתָה
  choice: iniutos
  rationale: Ang צוה ay nangangahulugang “mag-utos.” Ang “iniutos” ay neutral at malinaw, at ipinakikitang nauna ang utos ni Ester sa pagkilos ni Mardokeo.
- source_word: עָלָיו
  choice: sa kanya
  rationale: Kasama ng צוה, tinutukoy ng על ang taong inutusan. Ang “sa kanya” ang natural na katumbas sa Tagalog.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Ginamit ang karaniwang anyo ng pangalan sa Bibliyang Tagalog.
