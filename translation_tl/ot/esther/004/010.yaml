  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: tl
  text: Pagkatapos, sinabi ni Ester kay Hatac at inutusan siyang pumunta kay Mardokeo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Pagkatapos, sinabi ni Ester kay Hatac at inutusan siya kay Mardokeo.” Ipinahihiwatig ng Hebreo na inutusan ni Ester si Hatac na pumunta kay Mardokeo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, kaya isinalin bilang “Pagkatapos.” Ang אמר ay karaniwang nangangahulugang “sabihin”; natural sa Filipino ang “sinabi ... kay” sa ganitong konstruksiyon.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa modernong saling Tagalog.
- source_word: לַהֲתָךְ
  choice: kay Hatac
  rationale: Ang ל ay nagmamarka sa taong kinausap ni Ester. Ang pangalang הֲתָךְ ay tinumbasan ng “Hatac,” ayon sa bigkas na malapit sa Hebreo at sa baybay-Filipino.
- source_word: וַתְּצַוֵּהוּ
  choice: at inutusan siya
  rationale: Ang piel ng צוה ay nagpapahayag ng pag-uutos. Ang hulaping panghalip ay tumutukoy kay Hatac.
- source_word: אֶל
  choice: pumunta kay
  rationale: Literal na “sa/patungo kay.” Dahil walang tahasang pandiwa ng pagpunta sa Hebreo, idinagdag ang “pumunta” upang maging likas at malinaw sa Filipino, habang inilalahad sa talababa ang literal na anyo.
- source_word: מָרְדֳּכָי
  choice: Mardokeo
  rationale: Ginamit ang anyong pangalang pamilyar sa tradisyong biblikal sa Filipino.
