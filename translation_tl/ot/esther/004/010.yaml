translation_notes:
  register: Modernong Filipino na natural at marangal. Pinanatili ang lakas ng pandiwang “inutusan,” at nilinaw sa pangunahing teksto ang ipinahihiwatig na pagpunta nang hindi ikinukubli ang literal na konstruksiyon, na inilagay sa talababa.
