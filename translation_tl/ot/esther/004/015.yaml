  text: Then Esther told them to reply to Mordecai:[a]
translation:
  language: tl
  text: Pagkatapos, iniutos ni Ester na ipaabot kay Mardokeo ang sagot:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “At sinabi ni Ester na magpabalik kay Mardokeo.” Ang diwa ay iniutos niyang ipaabot sa kanya ang isang sagot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, iniutos
  rationale: Isinusulong ng waw-consecutive ang salaysay. Sa konstruksiyong may kasunod na לְהָשִׁיב, ang sinabi ni Ester ay isang tagubilin na magpabalik ng sagot, kaya natural sa Filipino ang “iniutos.”
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Karaniwang anyo ng pangalan sa modernong Filipino.
- source_word: לְהָשִׁיב
  choice: na ipaabot ... ang sagot
  rationale: Ang Hiphil infinitive ng שוב ay literal na tumutukoy sa pagpapabalik, ngunit sa kontekstong ito ay idyomatikong nangangahulugang magpabalik o magpadala ng sagot. Ang “ipaabot ... ang sagot” ay malinaw at natural nang hindi dinaragdagan ang nilalaman ng sagot.
- source_word: אֶל
  choice: kay
  rationale: Ipinapakita ng pang-ukol ang patutunguhan ng sagot; “kay” ang natural na katumbas bago ang pangalan ng tao.
- source_word: מָרְדֳּכָי
  choice: Mardokeo
  rationale: Ginamit ang kinagawiang Filipino na anyo ng pangalan.
