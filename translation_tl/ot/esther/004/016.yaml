  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: tl
  text: Pumunta ka at tipunin mo ang lahat ng Judiong naroroon sa Susa[a]. Mag-ayuno kayo para sa akin[b]. Huwag kayong kumain o uminom sa loob ng tatlong araw, gabi at araw. Ako at ang mga babaeng tagapaglingkod ko[c] ay mag-aayuno rin nang gayon. Pagkatapos, pupunta ako sa hari kahit hindi ito ayon sa batas[d]; at kung mapahamak ako, mapahamak ako[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng Judiong matatagpuan sa Susa” o “lahat ng Judiong nasa Susa.” Ang salitang Hebreo ay literal na tumutukoy sa mga naroroon o matatagpuan doon.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mag-ayuno kayo alang-alang sa akin.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga dalaga ko” o “mga babaeng kasama ko.” Ang salitang Hebreo ay maaaring tumukoy sa mga dalaga o babaeng tagapaglingkod.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “bagaman labag ito sa batas.”
    reason: lexical_alternative
  - marker: e
    text: Maaari ring “at kapag napahamak ako, napahamak ako.” Maikli at mariin ang Hebreo at ipinahahayag nito ang pagtanggap ni Esther sa panganib.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Pumunta ka at tipunin mo
  rationale: Pinananatili ang dalawang pautos—ang pagpunta at ang pagtitipon—sa natural at malinaw na modernong Tagalog.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: ang lahat ng Judiong naroroon sa Susa
  rationale: Ang participle na הַנִּמְצְאִים ay tumutukoy sa mga Judiong naroroon o matatagpuan sa Susa; natural sa Tagalog ang “naroroon” at hindi nito binabawasan ang saklaw ng “lahat.”
- source_word: וְצוּמוּ עָלַי
  choice: Mag-ayuno kayo para sa akin
  rationale: Ang עָלַי ay nag-uugnay sa pag-aayuno sa kalagayan ni Esther; malinaw at natural itong naihahayag ng “para sa akin.”
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ
  choice: Huwag kayong kumain o uminom
  rationale: Likas sa Tagalog ang iisang “huwag” na sinusundan ng dalawang kilos; buo pa rin ang dalawang pagbabawal.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: sa loob ng tatlong araw, gabi at araw
  rationale: Pinananatili ang ayos at diin ng Hebreo sa tuloy-tuloy na pag-aayuno sa gabi at araw nang hindi binibigyang-kahulugang higit sa sinasabi ng teksto.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: Ako at ang mga babaeng tagapaglingkod ko
  rationale: Ang נַעֲרוֹת ay maaaring tumukoy sa mga dalaga o babaeng attendant; ipinahihiwatig ng konteksto ng palasyo ang tungkuling paglilingkod nang hindi nagdaragdag ng tiyak na ranggo.
- source_word: אָצוּם כֵּן
  choice: ay mag-aayuno rin nang gayon
  rationale: Ang כֵּן ay tumutukoy pabalik sa paraang inilalarawan; ang “nang gayon” ay maikli at tapat sa ugnayang iyon.
- source_word: וּבְכֵן
  choice: Pagkatapos
  rationale: Ipinakikita ng parirala ang susunod na hakbang bunga ng paghahanda at pag-aayuno.
- source_word: אָבוֹא אֶל הַמֶּלֶךְ
  choice: pupunta ako sa hari
  rationale: Ang בוא אֶל dito ay paglapit o pagpunta sa hari; malinaw ito sa karaniwang Tagalog.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: kahit hindi ito ayon sa batas
  rationale: Pinananatili ang diwa ng “hindi ayon sa batas” at ipinahahayag ang likas na konsesibong ugnayan nito sa pasiya ni Esther.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: at kung mapahamak ako, mapahamak ako
  rationale: Pinananatili ang maikli, mariin, at paulit-ulit na pahayag ng pagtanggap ni Esther sa panganib. Ang “mapahamak” ay hindi naglilimita sa kahulugan sa kamatayan lamang, bagaman kasama iyon sa banta.
theological_decisions:
- issue: Kung ipinahihiwatig ba ng pag-aayuno ang panalangin sa Diyos
  choice: Hindi idinagdag ang “manalangin” o tuwirang pagtukoy sa Diyos.
  alternative: “Mag-ayuno at manalangin kayo sa Diyos para sa akin.”
  rationale: Pag-aayuno lamang ang tahasang binabanggit sa Hebreong teksto. Maaaring kaugnay nito ang panalangin, ngunit hindi iyon dapat ipasok sa salin.
- issue: Antas ng katiyakan sa huling pahayag ni Esther
  choice: “Kung mapahamak ako, mapahamak ako.”
  alternative: “Kapag napahamak ako, napahamak ako.”
  rationale: May saklaw ang כַּאֲשֶׁר na maaaring unawaing “kung,” “kapag,” o “gaya ng.” Pinananatili ng pangunahing salin ang karaniwang kondisyunal na pagbasa, habang kinikilala sa talababa ang mas tiyak o nakatalagang himig ng alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Iniwasan ang mga salitang lubhang makaluma at ang pagdaragdag ng panalangin o ibang teolohikal na detalye na hindi tahasang nasa Hebreo. Ginamit ang “Judio” bilang karaniwang katawagan at “Susa” bilang pamantayang modernong anyo ng pangalan.
