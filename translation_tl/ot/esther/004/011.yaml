source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: tl
  text: 'Alam ng lahat ng lingkod ng hari at ng mga mamamayan sa mga lalawigan ng hari na sinumang lalaki o babae na lumapit sa hari sa panloob na patyo nang hindi ipinatawag[a] ay saklaw ng iisang batas[b]: papatayin siya, maliban na lamang sa taong uunatan ng hari ng gintong setro upang siya ay mabuhay. Ngunit tatlumpung araw na akong hindi ipinatawag upang humarap sa hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nang hindi tinatawag.” Ang pandiwang Hebreo ay maaaring isalin nang mas literal na “tinatawag,” ngunit ipinahihiwatig dito ang pormal na pagpapatawag sa hukuman ng hari.
    reason: lexical_alternative
  - marker: b
    text: 'O “iisa lamang ang hatol sa kanya: kamatayan.” Literal na binabanggit ng idyomang Hebreo ang “iisang batas” na umiiral sa ganitong kaso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: mga lingkod ng hari
  rationale: Malawak itong tumutukoy sa mga naglilingkod sa hari sa konteksto ng palasyo; hindi kailangang ipahiwatig na sila ay mga alipin.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: at ng mga mamamayan sa mga lalawigan ng hari
  rationale: Ipinakikita ng parirala na bukod sa mga tauhan ng palasyo, alam din ito ng mga tao sa buong mga lalawigan ng imperyo.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: sinumang lalaki o babae
  rationale: Pinananatili nito ang tahasang pagbanggit sa kapwa lalaki at babae at ang distributibong diwa ng כָּל.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: lumapit sa hari sa loob na patyo
  rationale: Ipinahihiwatig ng Hebreo ang pagpasok sa ipinagbabawal na panloob na patyo upang lumapit sa hari.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: nang hindi ipinatawag
  rationale: Ang pasibong anyo ng קרא ay tumutukoy rito sa pormal na pagpapatawag sa presensiya ng hari.
- source_word: אַחַת דָּתוֹ
  choice: ay saklaw ng iisang batas
  rationale: Pinananatili nito ang idyomang Hebreo tungkol sa iisang nakapirming tuntuning legal nang hindi nagiging alanganin sa Tagalog.
- source_word: לְהָמִית
  choice: ipapatay siya
  rationale: Malinaw nitong ipinapahayag na ang kamatayan ay parusang ipapataw, hindi basta pangyayaring mamamatay ang tao.
- source_word: יוֹשִׁיט לוֹ הַמֶּלֶךְ אֶת שַׁרְבִיט הַזָּהָב
  choice: iunat sa kanya ng hari ang gintong setro
  rationale: Tuwirang inilalarawan nito ang kilos ng hari at pinananatili ang setro bilang sagisag ng pahintulot at pabor ng hari.
- source_word: וְחָיָה
  choice: sa gayon ay mabubuhay siya
  rationale: 'Pinananatili ang resulta ng pag-unat ng setro: hindi ipatutupad sa tao ang parusang kamatayan.'
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: tatlumpung araw nang
  rationale: Natural na Tagalog ito para sa panahong umabot na sa tatlumpung araw hanggang sa kasalukuyan.
