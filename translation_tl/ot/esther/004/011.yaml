  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “loob na patyo” para sa terminolohiya ng palasyo, “ipinatawag” para sa pormal na protokol, at “gintong setro” bilang malinaw at karaniwang katawagan. Inilipat ang marker [b] sa “iisang batas,” ang mismong pariralang tinatalakay ng talababa.
