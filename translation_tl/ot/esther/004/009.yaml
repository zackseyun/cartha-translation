  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: tl
  text: Kaya bumalik si Hatak at sinabi kay Ester ang mga salita ni Mordecai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mensahe ni Mordecai” o “ang sinabi ni Mordecai.” Sa literal, “ang mga salita ni Mordecai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: bumalik
  rationale: Ang בוא ay maaaring mangahulugang ‘dumating/pumarito/pumunta.’ Sa konteksto, nagbalik si Hatak kay Ester matapos kausapin si Mordecai, kaya malinaw at natural ang ‘bumalik.’
- source_word: הֲתָךְ
  choice: Hatak
  rationale: Isinalin sa karaniwang baybay-Tagalog ang personal na pangalang Hebreo.
- source_word: וַיַּגֵּד
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay ‘ipaalam/sabihin/iulat.’ Ang ‘sinabi’ ay natural sa payak na salaysay at hindi labis na pormal.
- source_word: לְאֶסְתֵּר
  choice: kay Ester
  rationale: Ang לְ ay nagmamarka sa di-tuwirang layon; natural itong ipinahahayag sa Tagalog sa pamamagitan ng ‘kay.’
- source_word: אֵת
  choice: '[hindi bukod na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon at wala itong hiwalay na katumbas na salita sa Tagalog.
- source_word: דִּבְרֵי
  choice: ang mga salita ni
  rationale: Ang construct plural ng דָּבָר ay literal na ‘mga salita ni.’ Pinananatili nito ang anyo at bahagyang lawak ng Hebreo, na maaari ring tumukoy sa mensahe o sa sinabi ng isang tao.
- source_word: מָרְדֳּכָי
  choice: Mordecai
  rationale: Ginamit ang nakasanayang anyo ng pangalan sa mga saling Tagalog.
