base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: tl
  text: Dumating ang mga dalagang tagapaglingkod ni Ester[a] at ang kanyang mga eunuko[b], at ipinaalam nila ito sa kanya. Labis na nabagabag ang reyna. Nagpadala siya ng mga kasuotan upang bihisan si Mardokeo at alisin ang telang-sako na suot niya[c], ngunit hindi tinanggap ni Mardokeo ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga babaeng tagapaglingkod ni Ester.”
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, ang salitang isinaling “mga eunuko” ay maaaring tumukoy sa mga opisyal ng korte, ngunit sa tagpuan ng palasyo sa aklat ng Ester, malamang na ang mas tiyak na kahulugan ang tinutukoy.
    reason: cultural_note
  - marker: c
    text: Ang telang-sako ay magaspang na kasuotang isinusuot bilang tanda ng pagluluksa, matinding dalamhati, o kahihiyan.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת אֶסְתֵּר
  choice: mga dalagang tagapaglingkod ni Ester
  rationale: Pinagsasama nito ang karaniwang diwa ng נַעֲרוֹת bilang mga dalaga at ang tungkulin nila bilang mga tagapaglingkod ni Ester sa palasyo.
- source_word: וְסָרִיסֶיהָ
  choice: at ang kanyang mga eunuko
  rationale: Ang סָרִיס ay karaniwang tumutukoy sa eunuko sa maharlikang korte; pinananatili ng salin ang tiyak at makasaysayang kahulugan, habang inilalahad sa talababa ang posibleng mas malawak na diwa.
- source_word: וַיַּגִּידוּ לָהּ
  choice: at ibinalita sa kanya ang nangyari
  rationale: Likas sa Tagalog ang 'ibinalita' para sa pag-uulat; ang 'ang nangyari' ay isang malinaw ngunit maingat na pagsasapantaha sa di-binanggit na nilalaman ng ulat.
- source_word: וַתִּתְחַלְחַל ... מְאֹד
  choice: Labis na nabagabag
  rationale: Ipinahahayag nito ang matinding pagkayanig o pagkabalisa ng reyna nang hindi nililimitahan ang pandiwa sa pisikal na panginginig lamang.
- source_word: בְּגָדִים
  choice: mga damit
  rationale: Modernong, malinaw, at natural na katumbas sa Tagalog.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: upang bihisan si Mardokeo
  rationale: Pinananatili ang layunin ng ipinadalang mga damit at ang tuwirang kilos ng sanhiang anyo ng pandiwa.
- source_word: שַׂקּוֹ
  choice: suot nitong telang-sako
  rationale: Pinananatili ang tiyak na bagay at kaugaliang pagluluksa, habang nililinaw na ito ay suot ni Mardokeo at hindi karaniwang sako lamang.
- source_word: וְלֹא קִבֵּל
  choice: ngunit hindi iyon tinanggap ni Mardokeo
  rationale: Likas sa Tagalog ang tahasang pagbanggit kay Mardokeo; ang 'iyon' ay tumutukoy sa ipinadalang kasuotan at sa tangkang pagpapalit ng kanyang suot.
