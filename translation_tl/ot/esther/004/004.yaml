  verdict: revise
  source_fidelity: 'Ang draft ay tapat sa pangunahing daloy ng Hebreo: dumating ang mga tagapaglingkod ni Ester, nagsabi sila sa kanya, lubhang nabagabag ang reyna, at nagpadala siya ng kasuotan para kay Mardokeo. Gayunman, ang idinagdag na “ang nangyari” ay hindi hayagang nasa teksto at maaaring magpahiwatig ng isang tiyak na nilalaman ng ulat. Mas mabuting panatilihing hindi tinukoy ang bagay ng pagsasabi, gaya ng Hebreo.'
  naturalness: Marangal at madaling maunawaan ang Tagalog. Mas likas ang “ipinaalam nila sa kanya” kaysa sa magkakasunod na “at ... at ibinalita,” at mas malinaw ang “telang-sako na suot niya” kaysa “suot nitong telang-sako.”
  terminology: Ang “mga dalagang tagapaglingkod,” “mga eunuko,” at “telang-sako” ay angkop na modernong Tagalog at pinananatili ang mahahalagang pangkulturang termino. Inayos ang talababa tungkol sa eunuko upang maging mas natural at mas malinaw ang pagtukoy sa aklat ng Ester.
  issues:
