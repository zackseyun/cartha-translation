translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'dalagang tagapaglingkod' upang maipakita kapwa ang leksikal na diwa at papel sa palasyo; pinanatili ang 'eunuko' at 'telang-sako' bilang mahahalagang terminong pangkultura, na may paliwanag sa mga talababa.
