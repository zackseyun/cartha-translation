    issue: May dagdag na “ang nangyari” sa iniulat kay Ester.
    rationale: Ang וַיַּגִּידוּ לָהּ ay “nagsabi/ipinaalam nila sa kanya” nang walang tahasang bagay. Bagaman mahihinuha ang nilalaman mula sa konteksto, hindi dapat tukuyin ng salin ang hindi binanggit ng teksto.
  - severity: low
    issue: Medyo hindi natural ang pagkakabit ng unang pangungusap at ang ayos ng pariralang “suot nitong telang-sako.”
    rationale: Ang bahagyang rebisyon ay nagpapakinis sa Tagalog nang hindi binabago ang saklaw o kahulugan ng Hebreo.
