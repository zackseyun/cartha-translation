  to: Dumating ang mga dalagang tagapaglingkod ni Ester[a] at ang kanyang mga eunuko[b], at ipinaalam nila ito sa kanya. Labis na nabagabag ang reyna. Nagpadala siya ng mga kasuotan upang bihisan si Mardokeo at alisin ang telang-sako na suot niya[c], ngunit hindi tinanggap ni Mardokeo ang mga iyon.
