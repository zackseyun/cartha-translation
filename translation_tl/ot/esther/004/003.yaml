  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang retorikal na pagkakasunod ng mga anyo ng pagluluksa at ang tunay na kalabuan ng hulíng pariralang Hebreo nang hindi pinipilit ang iisang interpretasyon.
