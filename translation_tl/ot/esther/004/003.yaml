  terminology: Ang “utos” ay katanggap-tanggap para sa דָּת, ngunit ang “kautusan” ay mas angkop sa opisyal na atas o dekreto sa kontekstong panghukuman ng hari. Pinanatili ang “telang-sako at abo” at ang talababa upang huwag igiit kung ang mga ito ay inilatag para sa marami o ginamit ng marami.
