base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: tl
  text: At sa bawat lalawigan, saanman nakarating ang salita ng hari at ang kanyang kautusan, nagkaroon ng matinding pagluluksa sa mga Judio, kasama ang pag-aayuno, pag-iyak, at panaghoy. Inilatag para sa marami ang telang-sako at abo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Marami ang gumamit ng telang-sako at abo.” Maikli at maaaring unawain sa dalawang paraan ang Hebreong pariralang לָרַבִּים pagkatapos ng “inilatag”: maaaring inilatag ang mga tanda ng pagluluksa para sa marami, o maaaring ipinahihiwatig na ginamit ang mga ito ng maraming tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: sa bawat lalawigan
  rationale: Ang inuulit na pangngalan ay distributibong idyoma na natural na ipinahahayag sa Tagalog bilang “sa bawat lalawigan,” habang pinananatili ang saklaw na walang eksepsiyon.
- source_word: מְקוֹם אֲשֶׁר
  choice: saanman
  rationale: Maikli at natural itong katumbas ng lokatibong pormulang tumutukoy sa bawat lugar na inabot ng utos.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: ang salita ng hari at ang kanyang utos
  rationale: Pinananatili ng “salita” ang literal na דבר, samantalang ipinahahayag ng “utos” ang opisyal at legal na diwa ng דת sa konteksto ng korte ng Persia.
- source_word: מַגִּיעַ
  choice: nakarating
  rationale: Ipinahahayag nito nang natural ang pagdating at paglaganap ng pahayag at utos ng hari sa mga lalawigan.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: nagkaroon ng matinding pagluluksa sa mga Judio
  rationale: Ang “matinding pagluluksa” ay kumakatawan sa tindi ng אֵבֶל גָּדוֹל, at ang “sa mga Judio” ay sadyang hindi labis na nililinaw kung ito ay “sa gitna ng” o “para sa” kanila.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: na may pag-aayuno, pag-iyak, at paghihinagpis
  rationale: Ang tatlong magkakaugnay na pangngalan ay pinananatiling magkakahiwalay; ang “paghihinagpis” ay angkop sa hayag at masidhing pagdadalamhati ng מִסְפֵּד.
- source_word: שַׂק וָאֵפֶר
  choice: telang-sako at abo
  rationale: Ang “telang-sako” ay mas malinaw sa karaniwang modernong mambabasa kaysa sa “sako” lamang at tumutukoy sa magaspang na telang ginagamit bilang tanda ng pagluluksa.
- source_word: יֻצַּע לָרַבִּים
  choice: Inilatag para sa marami
  rationale: Pinananatili nito ang pasibong larawan ng literal na paglalatag sa יֻצַּע at ang maikli at hindi ganap na tiyak na לָרַבִּים; inilalagay sa talababa ang posibleng diwang malawak itong ginamit ng marami.
