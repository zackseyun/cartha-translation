translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-daan” para sa monumental na pasukan ng palasyo at “telang-sako” para sa materyal na kasuotang panluksa. Inilagay ang mga pananda ng talababa sa mismong tekstong pangunahing salin.
