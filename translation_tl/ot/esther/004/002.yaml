  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: tl
  text: Nakarating siya hanggang sa harap ng pintuan ng hari[a], sapagkat hindi maaaring pumasok sa pintuan ng hari ang sinumang nakasuot ng damit na sako.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa tapat ng pintuan ng hari.” Idinidiin ng Hebreo na lumapit lamang siya hanggang sa puntong nasa harap nito.
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: “sapagkat walang pagpasok sa pintuan ng hari na nakasuot ng damit na sako.” Sa konteksto, hindi pinahihintulutan ang pagpasok na suot ang kasuotang panluksa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pumunta siya
  rationale: Isinasalaysay ng wayyiqtol ng בוא ang paglapit ni Mordecai sa pintuang-daan. Likas sa salaysay na Filipino ang “Pumunta siya” at hindi nito ipinahihiwatig na nakapasok siya.
- source_word: עַד לִפְנֵי
  choice: hanggang sa tapat ng
  rationale: Pinagsasama nito ang hangganan ng paglapit at ang lokasyong nasa harap ng pintuang-daan; malinaw na hanggang doon lamang siya nakarating.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: pintuang-daan ng hari
  rationale: Ang “pintuang-daan” ay angkop sa malaking pasukan ng palasyo o bakuran at iniiwasang mapagkamalan itong karaniwang pinto lamang.
- source_word: כִּי אֵין לָבוֹא
  choice: sapagkat walang sinumang maaaring pumasok
  rationale: Ang אֵין kasama ng pawatas ay nagpapahayag dito ng hindi maaaring gawin o ipinagbabawal na pagpasok. Pinananatili ng “maaaring” ang bahagyang puwang sa pagitan ng imposibilidad at pagbabawal, habang malinaw ang praktikal na diwa.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: sa pintuang-daan ng hari
  rationale: Sa Filipino, natural ang “pumasok sa pintuang-daan,” na tumutukoy sa pagpasok sa pasukang sakop ng hari nang hindi labis na tinutukoy ang eksaktong arkitektural na hangganan.
- source_word: בִּלְבוּשׁ שָׂק
  choice: na nakadamit ng telang-sako
  rationale: Tapat ito sa literal na ideyang “nakasuot ng kasuotang sako” at ipinapahayag ang kasuotang pagluluksa sa dignificado ngunit madaling maunawaang Filipino.
