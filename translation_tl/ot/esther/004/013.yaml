  text: Kaya sinabi ni Mordecai na ipasagot kay Esther, “Huwag mong isipin na ikaw lamang, sa lahat ng Judio, ang makaliligtas sa sambahayan ng hari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: Kaya sinabi ni Mordecai na sagutin si Esther
  rationale: Pinananatili ang di-tuwirang utos ng Hebreo na iparating kay Esther ang tugon ni Mordecai, nang hindi nagdaragdag ng tahasang tagatanggap na wala sa talata.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: Huwag mong isipin
  rationale: Likas sa makabagong Tagalog at tumpak sa idiomang Hebreo na nangangahulugang huwag ipalagay o isipin sa sarili.
- source_word: לְהִמָּלֵט בֵּית הַמֶּלֶךְ
  choice: makatatakas dahil nasa palasyo ka ng hari
  rationale: Ipinahahayag ang diwa na ang pagiging nasa sambahayan o palasyo ng hari ang inaasahang batayan ng pagtakas; ang “palasyo” ay natural na tawag sa kontekstong maharlika.
- source_word: מִכָּל־הַיְּהוּדִים
  choice: ikaw lamang sa lahat ng Judio
  rationale: Sa konteksto, ang paghahambing ay tumutukoy sa maling pag-aakalang si Esther ang tanging makaliligtas sa gitna ng lahat ng Judio.
