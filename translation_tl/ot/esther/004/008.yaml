  to: Ibinigay rin niya sa kanya ang isang sipi[a] ng nakasulat na kautusang inilabas sa Susa upang lipulin sila, upang ipakita ito kay Ester at ipaliwanag sa kanya, at utusan siyang pumunta sa hari, magsumamo sa kanya para sa kanyang lingap, at makiusap sa harap niya alang-alang sa kanyang bayan.
