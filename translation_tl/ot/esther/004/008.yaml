base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: tl
  text: Ibinigay rin niya sa kanya ang isang sipi[a] ng nakasulat na kautusang inilabas sa Susa upang lipulin sila, upang ipakita ito kay Ester at ipaliwanag sa kanya, at utusan siyang pumunta sa hari, magsumamo sa kanya para sa kanyang lingap, at makiusap sa harap niya alang-alang sa kanyang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang hiram sa Persiano na isinaling “sipi” ay maaari ring tumukoy sa teksto ng isang opisyal na kasulatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: isang sipi ng nakasulat na kautusan
  rationale: Ang salitang hiram sa Persiano ay maaaring tumukoy sa sipi o sa mismong teksto ng isang opisyal na kasulatan. Pinili ang “sipi” sa pangunahing teksto at inilagay sa talababa ang mas malawak na saklaw nito.
- source_word: הַדָּת
  choice: kautusan
  rationale: Sa konteksto ng maharlikang pamahalaan sa Ester, tumutukoy ito sa opisyal na utos o dekreto; natural at malinaw sa modernong Tagalog ang “kautusan.”
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: inilabas sa Susa
  rationale: Ang pasibong pandiwa ay tumutukoy sa opisyal na pagpapalabas ng kautusan, hindi lamang sa literal na pagbibigay nito.
- source_word: לְהַשְׁמִידָם
  choice: upang lipulin sila
  rationale: Tuwirang pinananatili ang layunin ng kautusan at ang panghalip na nasa Hebreo.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: Ipapakita niya iyon kay Ester at ipaliliwanag sa kanya
  rationale: Nililinaw ng “iyon” na ang kasulatan ang ipapakita, at ipinahahayag ng “ipaliliwanag” ang pagpapabatid ng nilalaman nito sa konteksto.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: at mahigpit na ipagbilin sa kanya
  rationale: Pinananatili nito ang mariing puwersa ng צוה nang hindi ipinahihiwatig na si Mardokeo ay isang hari o opisyal na nakatataas kay Ester.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: magmakaawa rito para sa lingap nito
  rationale: Ipinahahayag nito kapuwa ang taimtim na pagsusumamo at ang paghingi ng pabor o lingap na nasa חנן.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: at makiusap sa harap nito alang-alang sa kanyang bayan
  rationale: Natural na inilalarawan nito ang paghaharap ng kahilingan sa presensiya ng hari para sa kapakanan ng bayan ni Ester.
