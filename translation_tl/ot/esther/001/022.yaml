revisions:
- from: At nagpadala siya ng mga liham sa lahat ng lalawigan ng hari—sa bawat lalawigan ayon sa sarili nitong paraan ng pagsulat[a], at sa bawat bayan ayon sa sarili nitong wika—na ang bawat lalaki[b] ay dapat mamahala sa sarili niyang sambahayan at magsalita sa wika ng sarili niyang bayan.[c]
  to: At nagpadala siya ng mga liham sa lahat ng lalawigan ng hari—sa bawat lalawigan ayon sa kani-kaniyang paraan ng pagsulat[a], at sa bawat pangkat ng mga tao ayon sa kani-kaniyang wika—na ang bawat lalaki[b] ay dapat mamahala sa sarili niyang sambahayan at magsalita sa wika ng sarili niyang pangkat ng mga tao.[c]
  rationale: Pinalitan ang “bayan” ng “pangkat ng mga tao” upang hindi mailipat ang kahulugan mula sa isang grupong etnolingguwistiko tungo sa isang lugar o modernong bansa. Iningatan ang tuwirang kahulugan ng huling sugnay at binago ang talababa upang ilarawan lamang ang tunay na kahirapan ng teksto, sa halip na magmungkahi ng mas malawak na interpretasyong hindi tahasang isinasaad ng Hebreo.
