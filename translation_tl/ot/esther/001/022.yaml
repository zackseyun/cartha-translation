base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: tl
  text: At nagpadala siya ng mga liham sa lahat ng lalawigan ng hari—sa bawat lalawigan ayon sa kani-kaniyang paraan ng pagsulat[a], at sa bawat pangkat ng mga tao ayon sa kani-kaniyang wika—na ang bawat lalaki[b] ay dapat mamahala sa sarili niyang sambahayan at magsalita sa wika ng sarili niyang pangkat ng mga tao.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa pagsulat nito,” na tumutukoy sa sistema o anyo ng pagsulat na ginagamit sa bawat lalawigan.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “bawat asawang lalaki.” “Bawat lalaki” ang literal na sinasabi ng Hebreo, ngunit tungkol sa awtoridad sa pag-aasawa at sambahayan ang konteksto.
    reason: lexical_alternative
  - marker: c
    text: Literal na sinasabi ng Hebreo na magsalita ang bawat lalaki “ayon sa wika ng kaniyang bayan/pangkat ng mga tao.” Hindi ganap na malinaw kung bakit idinagdag ang utos na ito sa kautusan tungkol sa sambahayan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: At nagpadala siya
  rationale: Isinusulong ng wayyiqtol ang salaysay. Pinananatili ng “At nagpadala siya” ang daloy at ang panghalip ng Hebreo nang hindi tahasang pinapalitan ng “ang hari.”
- source_word: סְפָרִים
  choice: mga liham
  rationale: Sa kontekstong maharlika at administratibo, tumutukoy ito sa mga nakasulat na opisyal na komunikasyon. Likas at malinaw sa modernong Filipino ang “mga liham.”
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: lahat ng lalawigan ng hari
  rationale: Malapit ito sa anyong Hebreo at malinaw na tumutukoy sa mga lalawigang sakop ng kaharian.
- source_word: אֶל מְדִינָה וּמְדִינָה
  choice: sa bawat lalawigan
  rationale: Ang pag-uulit sa Hebreo ay distributibo; natural itong ipinahahayag sa Filipino sa pamamagitan ng “bawat.”
- source_word: כִּכְתָבָהּ
  choice: ayon sa sarili nitong paraan ng pagsulat
  rationale: Ipinahihiwatig nito ang angkop na sistema o anyo ng pagsulat ng bawat lalawigan. Mas madaling maunawaan sa karaniwang Filipino ang pariralang ito kaysa sa teknikal na “iskrip.”
- source_word: וְאֶל עַם וָעָם
  choice: at sa bawat bayan
  rationale: Distributibo rin ang pag-uulit. Ginamit ang “bayan” para sa pangkat ng mga taong may sariling wika sa loob ng imperyo, nang hindi ito awtomatikong ginagawang makabagong bansang-estado.
- source_word: כִּלְשׁוֹנוֹ
  choice: ayon sa sarili nitong wika
  rationale: Ang לָשׁוֹן ay tumutukoy rito sa wika; malinaw at angkop sa administratibong konteksto ang “wika.”
- source_word: לִהְיוֹת
  choice: na ... ay dapat
  rationale: Ipinahahayag ng infinitive ang nilalaman o layunin ng kautusan. Inililinaw ng “dapat” ang puwersang nag-uutos nang hindi dinaragdagan ang nilalaman nito.
- source_word: כָּל אִישׁ
  choice: ang bawat lalaki
  rationale: Panlalaking isahan at distributibo ang Hebreo. Pinananatili ng “bawat lalaki” ang tuwirang kahulugan, habang inilalahad sa talababa ang kontekstuwal na posibilidad na “bawat asawang lalaki.”
- source_word: שֹׂרֵר
  choice: mamahala
  rationale: Ipinahahayag ng pandiwa ang paggamit ng pamumuno o kapangyarihan. Dignified at natural ang “mamahala,” at hindi kasing bigat o di-likas ng “maging panginoon” sa makabagong Filipino.
- source_word: בְּבֵיתוֹ
  choice: sa sarili niyang sambahayan
  rationale: Ang “sambahayan” ay mas malinaw na sumasaklaw sa buong yunit ng tahanan kaysa sa gusali lamang.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: at magsalita sa wika ng sarili niyang bayan
  rationale: Pinananatili nito ang tuwirang diwa ng huling sugnay at ang pagkakaugnay nito sa naunang utos, habang hindi itinatago sa talababa ang posibleng mas malawak na implikasyon nito.
theological_decisions:
- issue: Saklaw ng כָּל אִישׁ sa kautusan tungkol sa sambahayan
  choice: bawat lalaki
  alternative: bawat asawang lalaki
  rationale: Bagaman tungkol sa awtoridad sa pag-aasawa ang agarang konteksto, “lalaki” ang tuwirang leksikal na kahulugan. Hindi tahasang nilutas sa pangunahing teksto ang kontekstuwal na pagtukoy sa mga asawang lalaki.
- issue: Kahulugan ng huling sugnay tungkol sa wika
  choice: at magsalita sa wika ng sarili niyang bayan
  alternative: na ang kaayusan ng sambahayan ay umayon sa pagkakakilanlang pangwika ng lalaki
  rationale: Ang tuwirang pagbasa ay tungkol sa pagsasalita sa sariling wika, ngunit maaaring may mas malawak na pahiwatig tungkol sa pagkakakilanlan at kaayusan ng sambahayan. Pinanatili ang mas malapit na salin at inilagay sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “mga liham,” “lalawigan,” “bayan,” at “sambahayan” bilang likas na bokabularyo sa salaysay at administratibong konteksto. Iniwasan ang labis na teknikal na “iskrip” sa pangunahing teksto at ang teolohikal na mabigat na “panginoon ng tahanan.”
