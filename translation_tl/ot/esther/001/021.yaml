  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: tl
  text: Nagustuhan ng hari at ng mga pinuno ang panukala, at kumilos ang hari ayon sa sinabi ni Memucan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na salin, “ayon sa salita ni Memucan”; maaari rin itong mangahulugang alinsunod sa kanyang panukala o payo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: Nagustuhan
  rationale: Natural na Filipino para sa Hebreong idyomang “naging mabuti sa mga mata,” at pinananatili ang diwang positibong pagtanggap.
- source_word: הַדָּבָר
  choice: ang panukala
  rationale: Bagaman malawak ang kahulugan ng דָּבָר (“salita, bagay, usapin”), sa konteksto ay tumutukoy ito sa panukalang kabibigay lamang ni Memucan.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang katumbas ng מֶלֶךְ sa konteksto.
- source_word: וְהַשָּׂרִים
  choice: at ng mga pinuno
  rationale: Ang שָׂרִים ay mga matataas na pinuno o opisyal sa korte; malinaw at marangal sa modernong Filipino ang “mga pinuno.”
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Pinananatili ang payak at malawak na kahulugan ng עָשָׂה, habang ang kasunod na parirala ang naglilinaw sa isinagawa.
- source_word: כִּדְבַר מְמוּכָן
  choice: ang ayon sa sinabi ni Memucan
  rationale: Natural na Filipino para sa literal na “ayon sa salita ni Memucan”; pinananatili ang pagtukoy sa kanyang sinabi nang hindi nililimitahan iyon sa “payo” lamang.
- source_word: מְמוּכָן
  choice: Memucan
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyong ginagamit.
