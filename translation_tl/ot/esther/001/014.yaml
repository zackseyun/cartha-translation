source:
  edition: WLC
  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: tl
  text: At ang mga pinakamalapit sa kanya ay sina Carsena, Setar, Admata, Tarsis, Meres, Marsena, at Memucan—ang pitong mataas na opisyal ng Persia at Media na nakakakita sa mukha ng hari[a] at nakauupo sa mga pangunahing puwesto sa kaharian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nakakakita sa mukha ng hari.” Isa itong pananalita sa korte ng Persia para sa mga may tuwirang paglapit sa presensiya ng hari.
    reason: cultural_note
  - marker: b
    text: O “at humahawak sa pinakamataas na mga katungkulan sa kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: At ang mga pinakamalapit sa kanya ay
  rationale: Bagaman anyong isahan ang קָרוֹב, kolektibo nitong ipinakikilala ang pitong taong nakalista. Likas sa modernong Tagalog ang maramihang “mga pinakamalapit sa kanya.”
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Carsena, Setar, Admata, Tarsis, Meres, Marsena, at Memucan
  rationale: Isinalin-titik ang mga pangalang pantangi ayon sa karaniwang baybay at tunog na angkop sa Tagalog.
- source_word: שִׁבְעַת שָׂרֵי
  choice: ang pitong mataas na opisyal
  rationale: Ang שָׂרִים ay mga pinuno o opisyal na may mataas na ranggo. Nililinaw ng “mataas na opisyal” ang katayuan nila nang hindi ipinahihiwatig na mga prinsipeng maharlika sila.
- source_word: פָּרַס וּמָדַי
  choice: ng Persia at Media
  rationale: Pinananatili ang dalawang pangalang heopolitikal ng imperyo sa malinaw at nakasanayang anyong Tagalog.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: na nakakakita sa mukha ng hari[a]
  rationale: Pinananatili ang kongkretong idyoma ng tekstong Hebreo; ipinaliliwanag sa talababa na tumutukoy ito sa tuwirang paglapit sa presensiya ng hari.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: at nakauupo sa mga pangunahing puwesto sa kaharian.[b]
  rationale: Pinananatili ang larawang may kaugnayan sa pag-upo at ranggo, ngunit ginagawang natural sa Tagalog. Ang “mga pangunahing puwesto” ay nagpapahayag ng kanilang pangunguna sa pamamahala.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang idyomang “nakakakita sa mukha ng hari” at ang larawang “nakauupo” upang maingatan ang anyo at kulturang pampalasyong nasa Hebreo, habang nililinaw ang kahulugan sa mga talababa.
