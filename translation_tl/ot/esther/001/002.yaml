  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: tl
  text: Noong mga araw na iyon, nang nakaupo si Haring Ahasuero sa kaniyang maharlikang trono na nasa Susa, ang tanggulan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, Shushan, ang tanggulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Noong mga araw na iyon
  rationale: Pinananatili ang karaniwang pormulang pasalaysay at ang puwersa ng demonstratibong הָהֵם sa natural na modernong Tagalog.
- source_word: כְּשֶׁבֶת
  choice: nang nakaupo
  rationale: Ang כ na may infinitive construct ng ישׁב ay nagpapakilala ng sugnay na pamanahon; natural na ipinahahayag ito ng “nang nakaupo.”
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuero
  rationale: Inilalagay ang titulong “Hari” bago ang pangalan ayon sa likas na ayos sa Tagalog, at ginagamit ang nakaugaliang anyong Filipino ng pangalan.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: sa kanyang maharlikang trono
  rationale: Ang literal na “trono ng kanyang paghahari/kaharian” ay isinalin sa malinaw at likas na pariralang nagpapanatili sa maharlikang diwa at sa panghalip na hulapi.
- source_word: אֲשֶׁר
  choice: na
  rationale: Ipinakikilala nito ang sugnay na naglalarawan sa trono; “na” ang likas na pang-ugnay sa Tagalog.
- source_word: בְּשׁוּשַׁן
  choice: sa Susa
  rationale: Ginagamit ang malawak na kinikilalang modernong anyo ng pangalan ng lugar; inilalahad sa talababa ang mas tuwirang transliterasyong “Susan.”
- source_word: הַבִּירָה
  choice: tanggulan
  rationale: Tumutukoy ang salita sa nakukutaan o pinatibay na sentrong palasyo at administrasyon. Mas tiyak ang “tanggulan” kaysa “kabisera,” na maaaring magpalawak nang labis sa kahulugan.
