  source_fidelity: Tapat ang salin sa Hebreo. Naipapahayag ng “ipinamalas niya” ang בְּהַרְאֹתוֹ (“habang/nang ipinakikita niya”), at ang “maraming araw—isang daan at walumpung araw” ay wasto para sa יָמִים רַבִּים ... שְׁמוֹנִים וּמְאַת יוֹם. Napananatili rin ang magkakasunod na retorikal na mga pangngalan sa dalawang parirala ng papuri at kayamanan.
