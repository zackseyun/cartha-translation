base_translation:
  language: en
  yaml_path: translation/ot/esther/001/004.yaml
  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: tl
  text: Sa loob ng maraming araw—isang daan at walumpung araw—ipinamalas niya ang kayamanan ng kaluwalhatian ng kaniyang kaharian at ang karilagan ng karangalan ng kaniyang kadakilaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: ipinamalas niya
  rationale: Ipinahahayag nito ang sinadyang pagpapakita o pagtatanghal ng hari, habang ang pariralang “sa loob ng” ay natural na naghahatid ng pangyayaring nagpatuloy sa itinakdang panahon.
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: ang kayamanan ng kaluwalhatian ng kaniyang kaharian
  rationale: 'Pinananatili ang magkakaugnay na mga pangngalan sa Hebreo: kayamanan, kaluwalhatian, at kaharian, nang hindi ginagawang simpleng “maluwalhating kayamanan.”'
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: ang karilagan ng karangalan ng kaniyang kadakilaan
  rationale: Ang יְקָר ay tumutukoy sa halaga, dangal, o karangalan; ang תִּפְאֶרֶת ay karilagan o maringal na kagandahan. Pinananatili ng salin ang parehong sangkap at ang sadyang matayog na retorika.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: Sa loob ng maraming araw—isang daan at walumpung araw—
  rationale: Malinaw at natural sa Filipino ang tagal, at pinananatili ng gitling ang pagpapaliwanag na ang “maraming araw” ay tiyak na 180 araw.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Sadyang pinanatili ang masinsing pag-uugnay ng “kayamanan,” “kaluwalhatian,” “karilagan,” “karangalan,” at “kadakilaan” upang maipakita ang magarbo at paulit-ulit na estilo ng Hebreo.
