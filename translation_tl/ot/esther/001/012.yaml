base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: tl
  text: Ngunit tumangging pumunta si Reyna Vasti ayon sa utos ng hari na ipinaabot sa pamamagitan ng mga eunuko[a], at lubhang nagalit ang hari, at nag-alab sa loob niya ang poot niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa kamay ng mga eunuko,” isang idyomang nangangahulugang ipinaabot ang utos sa pamamagitan nila.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “at nag-alab sa loob niya ang kanyang matinding galit.” Pinananatili ng Hebreo ang larawan ng galit bilang apoy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: tumangging
  rationale: Tuwirang ipinahahayag ng מאן ang sadyang pagtanggi o hindi pagsang-ayon; natural sa modernong Filipino ang “tumangging pumunta.”
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: si Reyna Vasti
  rationale: Natural sa Filipino ang titulo bago ang pangalan, at pinananatili nito ang katungkulan at pagkakakilanlan niya.
- source_word: לָבוֹא
  choice: pumunta
  rationale: Sa konteksto ng pagpapatawag ng hari, mas natural ang “pumunta” kaysa “pumasok,” bagaman maaaring taglayin ng בוא ang alinmang diwa.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: ayon sa utos ng hari
  rationale: Ang דָּבָר ay tumutukoy rito sa iniutos o ipinatawag ng hari; malinaw at natural sa Filipino ang “ayon sa utos.”
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: na ipinaabot sa pamamagitan ng mga eunuko
  rationale: Ang literal na “sa kamay ng” ay idyoma ng tagapamagitan o ahensiya. Ipinahahayag ng “ipinaabot sa pamamagitan” na sila ang nagdala ng utos, habang pinananatili ang tiyak na katawagang סָרִיסִים bilang “mga eunuko.”
- source_word: וַיִּקְצֹף ... מְאֹד
  choice: galit na galit ang hari
  rationale: Pinagsasama nito nang natural ang pandiwang nagsasaad ng matinding galit at ang pampalakas na מְאֹד.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: nag-alab sa loob niya ang kanyang poot
  rationale: Pinananatili ang Hebreong larawan ng galit bilang apoy at inuunawa ang בּוֹ bilang “sa loob niya,” na angkop dahil walang ibang panlalaking tinutukoy.
