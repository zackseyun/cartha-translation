  source_fidelity: 'Tumpak ang pangunahing diwa: tumanggi si Reyna Vasti sa utos ng hari na ipinadala sa pamamagitan ng mga eunuko, lubhang nagalit ang hari, at ang poot niya ay inilarawang nag-aalab sa loob niya. Gayunman, ang “Kaya” ay nagdaragdag ng malinaw na ugnayang sanhi-bunga na hindi tuwirang ipinahahayag ng magkakasunod na waw ng Hebreo. Ang “galit na galit ang hari” ay nagpapahayag ng tindi ngunit hindi gaanong malinaw ang pag-usad na “nagalit” ng וַיִּקְצֹף.'
  naturalness: Natural at angkop sa makabagong Filipino ang karamihan ng salin. Mas maayos ang isang magkakaugnay na pangungusap na may “at,” na pinananatili rin ang daloy ng salaysay sa Hebreo. Ang “lubhang nagalit” ay malinaw at marangal na katumbas ng pandiwa at pampalakas.
  terminology: Ang “Reyna Vasti,” “utos ng hari,” at “mga eunuko” ay angkop. Wastong hindi pinalalabo ang סָרִיסִים bilang mga opisyal lamang. Ang “poot” ay mabuting katumbas ng חֵמָה at pinananatili ang metaporang apoy.
