translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “eunuko” sa halip na palabuin bilang “opisyal,” sapagkat iyon ang karaniwang kahulugan ng salita sa konteksto ng korte ng Persia. Ang pangalawang pangungusap ay nagpapanatili sa pag-uulit at maalab na talinghaga ng Hebreo.
