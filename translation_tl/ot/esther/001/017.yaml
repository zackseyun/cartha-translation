  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: tl
  text: Sapagkat mababalitaan ng lahat ng babae ang usapin tungkol sa reyna, kaya mawawalan sila ng paggalang sa kani-kanilang asawa at sasabihin, ‘Sinabi ni Haring Ahasuerus na iharap sa kaniya si Reyna Vasti, ngunit hindi siya dumating.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: ang ginawa ng reyna
  rationale: Ang דָּבָר ay maaaring mangahulugang salita, bagay, usapin, o pangyayari. Sa konteksto, tumutukoy ito sa naiulat na pagtanggi ng reyna; mas natural sa Tagalog ang “ang ginawa ng reyna” kaysa literal na “ang bagay ng reyna,” nang hindi espesipikong hinahatulan ang kilos bilang masamang asal.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: mababalitaan ng lahat ng babae
  rationale: Literal itong ‘lalabas/aabot ... sa lahat ng babae.’ Ang “mababalitaan” ay likas na Tagalog para sa pagkalat at pagdating ng balita sa kanila.
- source_word: לְהַבְזוֹת ... בְּעֵינֵיהֶן
  choice: kaya hahamakin nila
  rationale: Ang בּזה ay ‘hamakin’ o ‘ituring na walang halaga.’ Ang idyomang ‘sa kanilang mga mata’ ay ipinahihiwatig ng pandiwang “hahamak,” kaya hindi na inuulit sa paraang alanganin sa Tagalog.
- source_word: בַּעְלֵיהֶן
  choice: ang kani-kanilang asawa
  rationale: Sa kontekstong ito ang בַּעַל ay mga asawang lalaki. Ang “kani-kanilang asawa” ay malinaw at natural sa modernong Tagalog.
- source_word: אָמַר לְהָבִיא
  choice: Sinabi ... na iharap
  rationale: Pinananatili ang mas literal na ‘sinabi na dalhin/iharap’ sa halip na palakasin bilang ‘iniutos,’ sapagkat אָמַר mismo ay ‘sinabi.’ Ang “iharap” ay angkop sa pagdadala sa reyna sa presensiya ng hari.
theological_decisions:
- issue: Kung ilalarawan bilang ‘asal’ o ‘ginawa’ ang דְבַר ng reyna
  choice: ang ginawa ng reyna
  alternative: ang asal ng reyna / ang usapin tungkol sa reyna
  rationale: Hindi tahasang tinatawag ng Hebreo na masama ang kanyang asal sa pariralang ito. Ang “ginawa” ay hindi nagdaragdag ng moral na paghatol, samantalang malinaw pa rin ang tinutukoy sa konteksto.
- issue: Lakas ng pananalita ng hari sa אָמַר לְהָבִיא
  choice: Sinabi ... na iharap
  alternative: Iniutos ... na iharap
  rationale: Pinananatili ang leksikal na anyong ‘sinabi’ at hindi ipinapasok ang mas mariing ‘iniutos,’ kahit maaaring utos ang pragmatikong diwa sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Iniwasan ang matigas na literalismong “lalabas ang bagay ng reyna” at ang di-likas na “hahamak sa kanilang mga mata,” habang pinananatili ang sanhi-bungang daloy at ang direktang sipi.
