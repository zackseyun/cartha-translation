  terminology: Ang “Ahasuero,” “India,” “Kus,” at “lalawigan” ay angkop at pare-pareho sa layuning panatilihin ang anyong Hebreo at sinaunang heograpikong pangalan. Ang mga talababa ay wastong nagpapaliwanag na ang “Xerxes” ay makasaysayang pagkakakilanlan at na ang Kus ay minsang isinasaling Ethiopia.
