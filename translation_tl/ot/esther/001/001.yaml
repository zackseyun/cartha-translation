  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: tl
  text: Nangyari ito noong panahon ni Ahasuero[a]—ang Ahasuerong naghari mula sa India hanggang sa Kus[b], sa 127 lalawigan—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Xerxes,” kung gagamitin ang pagkakakilanlan sa kaniya bilang hari ng Persia sa kasaysayan sa halip na baybayin ang pangalan mula sa Hebreo.
    reason: alternative_reading
  - marker: b
    text: Ang “Kus” ay sinaunang pangalan ng isang rehiyon; isinasalin ito ng ilang salin bilang “Ethiopia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nangyari ito
  rationale: Likas na panimulang salaysay sa modernong Filipino at tapat sa karaniwang gamit ng pandiwang היה na may waw-consecutive, nang hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: בִּימֵי
  choice: noong panahon ni
  rationale: Natural at malinaw na katumbas sa Filipino ng Hebreong pormulang temporal na nangangahulugang “sa mga araw ni” o “sa panahon ni.”
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuero
  rationale: Isinasalin sa baybay na angkop sa Filipino ang pangalang Hebreo, sa halip na palitan ito ng makasaysayang pagkakakilanlang “Xerxes.”
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: ang Ahasuero
  rationale: Pinananatili ang pag-uulit ng pangalan at ang puwersang tumutukoy kung aling Ahasuero ang tinutukoy; idinugtong ang hulaping -ng para sa natural na daloy bago ang sugnay na naglalarawan.
- source_word: הַמֹּלֵךְ
  choice: naghari
  rationale: Ang participle ay naglalarawan kay Ahasuero ayon sa lawak ng kaniyang pamamahala; ang pandiwang “naghari” ay maikli, natural, at angkop sa hari.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: mula sa India hanggang sa Kus
  rationale: Ang Hodu ay karaniwang kinikilalang India. Pinanatili bilang sinaunang pangalang heograpiko ang Kus upang maiwasang itumbas nang walang pasubali sa makabagong bansang Ethiopia.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: '127'
  rationale: Ang numerong Hebreo ay isang daan at dalawampu't pito; ginamit ang mga digit para sa mabilis at karaniwang pagbasa sa modernong Filipino.
- source_word: מְדִינָה
  choice: lalawigan
  rationale: Sa konteksto ng Imperyong Persia, malinaw at nakaugaliang katumbas sa Filipino ang “lalawigan” para sa mga sakop na yunit ng pamamahala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong hindi pa tapos sa pamamagitan ng gitling sa dulo, sapagkat nagpapatuloy ang pangungusap sa kasunod na talata. Ang pag-uulit ng pangalang Ahasuero ay sadyang pinanatili upang katawanin ang diin at pagtukoy ng Hebreo.
