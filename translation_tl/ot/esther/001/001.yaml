  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pambungad na pangyayaring naganap, ang panahong tinutukoy, ang pagkakakilanlang paglilinaw kay Ahasuero sa pag-uulit ng pangalan, ang kaniyang paghahari mula India hanggang Kus, at ang 127 lalawigan. Ang nakabitin na gitling sa dulo ay wastong nagpapakita na nagpapatuloy ang pangungusap sa kasunod na talata.'
