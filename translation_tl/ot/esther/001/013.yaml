translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang gitling na nagpapakitang nagpapatuloy ang pangungusap sa kasunod na talata. Hindi nilinaw nang lampas sa Hebreo kung ano mismo ang saklaw ng ‘mga panahon.’
