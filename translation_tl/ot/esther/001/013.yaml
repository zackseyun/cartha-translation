  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari sa marurunong na nakaaalam sa mga panahon—sapagkat ganito ang pamamaraan ng hari sa harap ng lahat ng nakaaalam ng batas at paghatol—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֲכָמִים
  choice: marurunong
  rationale: Tuwirang katumbas ng pangmaramihang ‘mga pantas/marurunong,’ sa natural at dignified na modernong Tagalog.
- source_word: יֹדְעֵי הָעִתִּים
  choice: nakaaalam sa mga panahon
  rationale: Pinananatili ang sadyang malawak at maaaring teknikal na kahulugan ng ‘mga panahon’ nang hindi nililimitahan sa mga kaugalian o pangyayari.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: inilalahad ng hari ang kanyang usapin
  rationale: Sa konteksto, ang דָּבָר ay tumutukoy sa bagay o usaping inihaharap ng hari; ginawang buong parirala upang maging malinaw at natural sa Tagalog.
- source_word: דָּת וָדִין
  choice: batas at paghatol
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na konsepto: ang umiiral na batas at ang hudisyal na pagpapasiya o paghatol.'
