translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “piging,” “kuta,” at “patyo” upang panatilihin ang maharlika at pisikal na tagpuan nang hindi nagiging makaluma. Ang mga tunay na alternatibong kahulugan ng משתה, בירה, idyomang panlipunan, at ביתן ay pinanatili sa mga talababa.
