base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: tl
  text: At nang matapos ang mga araw na ito, nagdaos ang hari ng piging[a] na tumagal nang pitong araw para sa lahat ng taong naroroon sa kuta ng Susan[b], mula sa dakila hanggang sa maliit[c], sa patyo ng hardin ng palasyo[d] ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handaan”; ang salitang Hebreo ay madalas tumukoy sa isang piging na may pag-inom.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa Susan, ang kuta.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “mula sa dakila hanggang sa maliit,” isang idyomang tumutukoy sa mga tao sa bawat antas.
    reason: lexical_alternative
  - marker: d
    text: Ang salitang Hebreo ay maaari ring isaling “pabilyon” o “bahay”; ang “palasyo” ay angkop sa maharlikang tagpuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: At nang matapos ang mga araw na iyon
  rationale: Ang ב na may infinitive construct ay nagsasaad ng panahong pangyayari. Likas sa modernong Tagalog ang “nang matapos,” at malinaw na tumutukoy ang “mga araw na iyon” sa naunang panahon.
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: naghanda ... ng ... piging
  rationale: Bagaman karaniwang nangangahulugang “gumawa” ang עשה, kasama ng משתה ay idyoma itong tumutukoy sa paghahanda o pagdaraos ng isang piging. Ang “naghanda ng piging” ay natural at hindi labis na nagpapakahulugan.
- source_word: מִשְׁתֶּה
  choice: piging
  rationale: Tumutukoy ito sa isang handaan na kadalasang may pag-inom. Ang “piging” ay angkop sa maharlikang tagpuan at pinananatili sa talababa ang diin sa inuman.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: para sa lahat ng taong naroroon
  rationale: Dito, malawak ang saklaw ng עָם at ang Niphal participle ng מצא ay nangangahulugang mga taong naroon o matatagpuan sa lugar.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: sa kuta ng Susan
  rationale: Ang בִּירָה ay isang muog o pinatibay na sentrong administratibo. Mas natural sa Tagalog ang “kuta ng Susan” kaysa sa tuwirang apposisyon, habang inilalahad sa talababa ang ibang posibleng ayos.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: mula sa mataas hanggang sa mababa
  rationale: Idyoma ito para sa lahat ng antas ng lipunan. Napananatili ng salin ang magkatambal na mga dulo ng saklaw nang hindi ipinapalagay na edad o pisikal na laki ang tinutukoy.
- source_word: שִׁבְעַת יָמִים
  choice: pitong araw na
  rationale: Isinama ang pariralang panahunan bilang panuring sa “piging,” isang malinaw at maikling paraan upang ipahayag ang tagal nito sa Tagalog.
- source_word: בַּחֲצַר גִּנַּת
  choice: sa patyo ng hardin
  rationale: Ang חָצֵר ay patyo o courtyard, at ang construct chain ay nag-uugnay rito sa hardin.
- source_word: בִּיתַן הַמֶּלֶךְ
  choice: palasyo ng hari
  rationale: Ang hiram na salitang Persian na בִּיתַן ay maaaring mangahulugang palasyo, bahay, o pabilyon. Ang “palasyo” ang pinakamalinaw sa maharlikang konteksto, ngunit pinananatili sa talababa ang tunay na leksikal na kawalang-katiyakan.
