base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: tl
  text: At kapag narinig sa buong kaharian ang utos na ilalabas ng hari—sapagkat napakalawak nito—igagalang ng lahat ng babae ang kani-kanilang asawang lalaki[a], maging mataas man o mababa ang katayuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magbibigay ng karangalan sa kani-kanilang asawang lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: At kapag narinig
  rationale: Pinananatili ang pasibong diwa ng Nifal at ipinahahayag ang temporal na ugnayan ng pangyayari at bunga sa natural na Tagalog.
- source_word: פִּתְגָם הַמֶּלֶךְ אֲשֶׁר יַעֲשֶׂה
  choice: ang utos na ilalabas ng hari
  rationale: Sa konteksto ng korte ng Persia, ang פִּתְגָם ay opisyal na pahayag o utos. Ang 'ilalabas' ay natural na katambal ng isang opisyal na utos at malinaw na naghahatid sa gamit ng עשה rito.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: sa buong kaharian
  rationale: Ipinahahayag nito ang saklaw ng pagkalat ng utos sa lahat ng nasasakupan ng hari nang hindi mabigat ang pananalita.
- source_word: כִּי רַבָּה הִיא
  choice: sapagkat napakalawak nito
  rationale: Ang רַבָּה ay tumutukoy rito sa lawak o laki ng kaharian; ang 'napakalawak' ay malinaw at likas sa modernong Tagalog.
- source_word: וְכָל הַנָּשִׁים
  choice: ng lahat ng babae
  rationale: Pinananatili ang pangkalahatang plural na 'mga babae'; nililinaw ng kasunod na 'kani-kanilang asawa' na mga babaeng may asawa ang tinutukoy.
- source_word: יִתְּנוּ יְקָר
  choice: igagalang
  rationale: Ang idyomang Hebreo ay literal na 'magbibigay ng karangalan.' Ang 'igagalang' ay natural at malinaw sa Tagalog, habang ang mas literal na anyo ay inilalagay bilang alternatibo sa talababa.
- source_word: לְבַעְלֵיהֶן
  choice: ang kani-kanilang asawa
  rationale: Sa kontekstong pantahanan, ang בַּעַל ay nangangahulugang 'asawang lalaki.' Ang 'kani-kanilang asawa' ay malinaw at hindi nagdaragdag ng diwang 'panginoon' o 'may-ari.'
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: mula sa mataas hanggang sa mababa
  rationale: Tumutukoy ang idyoma sa buong antas ng lipunan. Ang 'mataas' at 'mababa' ay nagpapakita ng katayuang panlipunan at umiiwas sa maling pagbasa na pisikal na laki ang tinutukoy.
