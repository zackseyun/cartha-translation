  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: tl
  text: At ngayong araw, ang mga babaeng maharlika[a] ng Persia at Media na nakarinig ng salita ng reyna[b] ay magsasabi rin nito sa lahat ng mga pinuno ng hari. Kaya magkakaroon ng saganang paghamak at galit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga prinsesa ng Persia at Media.” Ang salitang Hebreo ay tumutukoy sa mga kababaihang mataas ang katayuan, ngunit hindi nangangahulugang mga anak sila ng hari.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang sinabi ng reyna” o “ang usapin tungkol sa reyna.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa sinabi niya o sa ibinalitang pangyayari tungkol sa kanya.
    reason: lexical_alternative
  - marker: c
    text: Bitin ang huling sugnay sa Hebreo; literal itong gaya ng “at sapat na paghamak at galit.” Isiningit ang “magkakaroon” upang maging malinaw sa Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: At ngayong araw
  rationale: Likas na pahayag sa modernong Tagalog na nagpapanatili sa diin ng agarang panahon.
- source_word: תֹּאמַרְנָה
  choice: gayon din ang sasabihin
  rationale: Ang pandiwa ay literal na 'sasabihin'; idinagdag ang 'gayon din' upang malinaw ang ipinahihiwatig na gagayahin nila ang ginawa o tugon ng reyna sa konteksto.
- source_word: שָׂרוֹת
  choice: mga babaeng maharlika
  rationale: Tumutukoy sa matataas ang katayuang kababaihan at hindi kinakailangang mga anak ng hari; mas tiyak ito kaysa 'mga prinsesa' at mas marangal kaysa payak na 'mga babae.'
- source_word: פָּרַס וּמָדַי
  choice: ng Persia at Media
  rationale: Ginamit ang nakaugaliang modernong pangalan ng mga lupain.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: na nakarinig
  rationale: Ipinahahayag ng perfect ang naganap nang pagkarinig na mahalaga sa hinuhulaang magiging tugon nila.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: sa sinabi ng reyna
  rationale: Ang דָּבָר ay maaaring 'salita,' 'sinabi,' o 'pangyayari'; natural sa Tagalog ang 'sinabi' habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: sa lahat ng mga pinuno ng hari
  rationale: Ang שָׂרִים ay matataas na pinuno o opisyal; iniiwasan ng 'mga pinuno' ang maling pahiwatig na sila ay mga anak ng hari.
- source_word: וּכְדַי
  choice: Kaya magkakaroon ng saganang
  rationale: Elliptical ang Hebreo; ipinahahayag ng 'magkakaroon' ang kinakailangang pandiwa sa natural na Tagalog, at ng 'sagana' ang diwang sapat o labis-labis.
- source_word: בִּזָּיוֹן
  choice: paghamak
  rationale: Tumpak na inilalarawan ang mapanghamak na pakikitungo o kawalan ng paggalang.
- source_word: וָקָצֶף
  choice: at galit
  rationale: Natural at matindi sa modernong Tagalog; hindi kinakailangang tukuyin kung kaninong galit dahil hindi rin iyon tahasang sinasabi ng Hebreo.
