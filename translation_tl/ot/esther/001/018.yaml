translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na himig ng usapang makahari, habang iniwasan ang lipas o lubhang teknikal na pananalita. Ang 'gayon din' ay tahasang naghahayag ng paghahambing na ipinahihiwatig ng konteksto.
