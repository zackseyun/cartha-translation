  source_fidelity: 'Tapat ang salin sa Hebreo: ang כְּדָת ay maayos na “Ayon sa batas,” ang deliberatibong מַה לַּעֲשׂוֹת ay “ano ang dapat gawin,” at ang “kay Reyna Vasti” ay natural na tumutukoy sa hakbang na gagawin hinggil sa kaniya nang hindi ipinagpapalagay ang uri ng parusa. Ang “dahil hindi niya isinagawa ang utos” ay maingat na isinasalin ang עַל אֲשֶׁר לֹא עָשְׂתָה בלי pagdaragdag ng mas mariing interpretasyong “sumuway.” Ang “na ipinaabot ng mga eunuko” ay wastong pagpapahayag ng בְּיַד הַסָּרִיסִים bilang pamamagitan ng mga tagapaghatid.'
