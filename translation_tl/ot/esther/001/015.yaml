base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: tl
  text: “Ayon sa batas, ano ang dapat gawin kay Reyna Vasti dahil hindi niya isinagawa ang utos ni Haring Ahasuerus na ipinaabot ng mga eunuko[a][b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa pamamagitan ng kamay ng mga eunuko”; maaari ring isalin na “sa pamamagitan ng mga eunuko.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring tumukoy nang mas malawak sa mga opisyal ng palasyo, bagaman “mga eunuko” ang mas tuwirang salin.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדָת
  choice: Ayon sa batas
  rationale: Sa konteksto ng hukuman ng Persia sa Ester, ang דָּת ay tumutukoy sa batas o opisyal na tuntunin; pinananatili nito ang legal na himig ng tanong.
- source_word: מַה לַּעֲשׂוֹת
  choice: ano ang dapat gawin
  rationale: Likas sa modernong Tagalog at naipapahayag ang deliberatibo at impersonal na tanong tungkol sa nararapat na hakbang.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: kay Reyna Vasti
  rationale: Ang pang-ukol kasama ng עשה ay tumutukoy sa gagawing pakikitungo o hakbang tungkol sa isang tao; ang “gawin kay” ay natural sa Tagalog nang hindi paunang ipinapalagay na kaparusahan ang tiyak na aksiyon.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: dahil hindi niya isinagawa
  rationale: Tuwirang ipinapahayag ang batayan ng tanong at pinananatili ang payak na diwa ng “hindi ginawa,” habang natural na iniuugnay sa isang utos; hindi isinasama sa pangunahing teksto ang mas interpretatibong “sumunod.”
- source_word: מַאֲמַר
  choice: ang utos
  rationale: Sa konteksto ng hari, ang salita o pahayag ay may awtoridad at ang “utos” ang malinaw at natural na katumbas.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuerus
  rationale: Isinalin ang titulo at tinumbasan sa karaniwang transliterasyong Filipino ang pangalang pantangi.
- source_word: בְּיַד הַסָּרִיסִים
  choice: na ipinaabot ng mga eunuko
  rationale: Ang literal na “sa pamamagitan ng kamay ng mga eunuko” ay idyoma ng ahensiya o pamamagitan; malinaw na ipinapahayag ng “ipinaabot” ang paghahatid ng utos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Pinanatili ang pormal na legal na balangkas, ngunit gumamit ng likas na pariralang “ano ang dapat gawin kay.” Ang mga talababa ay inilagay kaagad pagkatapos ng pariralang “mga eunuko,” na siyang tinutukoy ng mga ito.
