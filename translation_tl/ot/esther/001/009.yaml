- from: Nagdaos din si Reyna Vasti ng isang handaan para sa mga babae sa maharlikang tahanan[a] na pag-aari ni Haring Ahasuerus.
  to: Nagdaos din si Reyna Vasti ng isang handaan para sa mga babae sa palasyong maharlika[a] ni Haring Ahasuerus.
