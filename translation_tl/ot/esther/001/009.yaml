translation:
  language: tl
  text: Nagdaos din si Reyna Vasti ng isang handaan para sa mga babae sa palasyong maharlika[a] ni Haring Ahasuerus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa maharlikang tahanan”; literal na “sa bahay ng kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: din
  rationale: Ipinakikita ang pagdaragdag sa naunang salaysay tungkol sa handaan ng hari; natural sa Filipino ang hulaping pang-ugnay na “din.”
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: si Reyna Vasti
  rationale: Ginamit ang titulo bago ang pangalang isinalin sa karaniwang anyong Filipino; natural at marangal ang ayos na ito.
- source_word: עָשְׂתָה
  choice: nagdaos
  rationale: Bagaman literal na “gumawa,” ang “nagdaos” ang likas na katambal ng “handaan” sa makabagong Filipino.
- source_word: מִשְׁתֵּה
  choice: isang handaan
  rationale: Tumutukoy sa piging o handaang karaniwang may inuman; malinaw ang “handaan” nang hindi labis na nililimitahan ang kahulugan sa pag-inom.
- source_word: נָשִׁים
  choice: para sa mga babae
  rationale: Tuwirang ipinakikita na ang mga babae ang mga panauhin o kalahok sa handaan.
- source_word: בֵּית הַמַּלְכוּת
  choice: maharlikang tahanan
  rationale: Pinananatili ang larawang “bahay/tahanan” at ang kaugnayan nito sa pagkahari; maaaring tumukoy sa palasyo.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: na pag-aari ni Haring Ahasuerus
  rationale: Pinananatili ang tahasang diwa ng Hebreong sugnay na ang maharlikang tahanan ay sa hari.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuerus
  rationale: Transliterasyon ng pangalang Hebreo na naaayon sa ibinigay na pangalan ng hari at malinaw na makikilala sa aklat ng Esther.
