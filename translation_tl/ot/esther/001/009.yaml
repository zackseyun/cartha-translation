    issue: Ang "maharlikang tahanan" ay hindi sapat na tiyak para sa בֵּית הַמַּלְכוּת.
    rationale: Sa modernong Filipino, maaari itong mangahulugang bahay ng isang taong maharlika. Sa salaysay, ang tinutukoy ay ang royal residence/palace na kaugnay ni Haring Ahasuerus.
  - severity: low
    issue: Hindi natural ang literal na talababang “bahay ng kaharian/pagkahari.”
    rationale: Mas malinaw ang “bahay ng kaharian,” at ang alternatibong “maharlikang tahanan” ay maibibigay nang maayos bilang pagpipiliang salin.
  revised_text: Nagdaos din si Reyna Vasti ng isang handaan para sa mga babae sa palasyong maharlika[a] ni Haring Ahasuerus.
