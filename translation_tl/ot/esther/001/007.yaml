base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: tl
  text: Inihain ang mga inumin sa mga sisidlang ginto, na bawat sisidlan ay naiiba sa iba, at sagana ang alak ng kaharian, ayon sa kasaganaan ng hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: Inihain ang mga inumin
  rationale: Ang infinitibong anyo sa konteksto ay naglalarawan sa paghahain o pagpapainom; ang pasibong Tagalog ay natural at tumutugma sa di-tiyak na tagapaglingkod.
- source_word: בִּכְלֵי זָהָב
  choice: sa mga sisidlang ginto
  rationale: Pinananatili ang pangkalahatang kahulugan ng כְּלִי bilang sisidlan, hindi nililimitahan sa kopa o baso.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: na bawat sisidlan ay naiiba sa iba
  rationale: Ipinahahayag ang Hebreong pag-uulit nang malinaw at natural habang pinananatili ang diwa na magkakaiba ang mga sisidlan.
- source_word: וְיֵין מַלְכוּת רָב
  choice: at sagana ang alak ng kaharian
  rationale: Ang מַלְכוּת ay literal na tumutukoy sa kaharian o pagkahari; pinananatili ang pariralang may posibleng diwang alak na mula sa panustos ng hari.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: ayon sa kasaganaan ng hari
  rationale: Ang idyomang 'ayon sa kamay ng hari' ay tumutukoy sa lawak ng kakayahan, yaman, o kagandahang-loob ng hari; 'kasaganaan' ang malinaw na katumbas sa konteksto.
