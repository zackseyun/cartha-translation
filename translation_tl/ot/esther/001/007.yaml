  source_fidelity: 'Tapat ang salin sa Hebreo: ang paghahain ng inumin sa mga sisidlang ginto, ang pagkakaiba-iba ng mga sisidlan, ang saganang alak na pangkaharian, at ang sukat na itinatakda ng kakayahan o kagandahang-loob ng hari ay lahat naipahayag. Ang “alak ng kaharian” ay maingat na pinananatili ang saklaw ng יֵין מַלְכוּת nang hindi ito labis na binibigyang-kahulugan.'
