  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: tl
  text: '“Kung mamarapatin ng hari[a], magpalabas siya ng isang maharlikang kautusan at ipatala iyon sa mga batas ng Persia at Media, upang hindi iyon mabawi[b]: hindi dapat humarap si Vasti kay Haring Ahasuerus. At ibigay ng hari ang pagiging reyna niya[c] sa ibang babaeng higit na mainam kaysa sa kanya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Kung kalugdan ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang hindi iyon mabago” o “upang hindi iyon malabag.” Tumutukoy ang idyomang Hebreo sa nakapirming bisa ng kautusan.
    reason: lexical_alternative
  - marker: c
    text: Literal na “ang kanyang pagka-reyna” o “ang kanyang maharlikang katayuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Kung mamarapatin ng hari
  rationale: Likas na pormulang magalang sa korte ang parirala. Ipinahahayag ng “mamarapatin” ang pagsang-ayon ng hari habang pinananatili ang pormal at marangal na tono.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: magpalabas siya ng isang maharlikang kautusan
  rationale: Ang דְבַר מַלְכוּת ay isang opisyal na atas ng hari, hindi karaniwang salita lamang. Natural sa Filipino ang “magpalabas ... ng kautusan” para sa isang atas na nagmumula sa awtoridad ng hari.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: ipatala iyon sa mga batas ng Persia at Media
  rationale: Ipinahihiwatig ng Hebreo ang pormal na pagsasama ng kautusan sa kinikilalang kalipunan ng mga batas. Pinananatili rin ang ayos na Persia bago Media.
- source_word: וְלֹא יַעֲבוֹר
  choice: upang hindi iyon mabawi
  rationale: Sa kontekstong legal, tumutukoy ang idyoma sa kautusang hindi mapawawalang-bisa o mababawi. Inilalagay sa talababa ang iba pang posibleng diwa ng hindi mabago o hindi malabag.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: hindi dapat humarap si Vasti kay Haring Ahasuerus
  rationale: Malinaw na nilalaman ng kautusan ang pagbabawal. Ang “hindi dapat humarap” ay natural at hindi nagdaragdag ng salitang “muli,” na hindi tahasang nasa Hebreo.
- source_word: וּמַלְכוּתָהּ
  choice: ang pagiging reyna niya
  rationale: Sa konteksto, ang מַלְכוּת ay tumutukoy sa katayuan o tungkulin ni Vasti bilang reyna, hindi sa isang teritoryal na kaharian.
- source_word: יִתֵּן הַמֶּלֶךְ לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: ibigay ng hari ... sa ibang babaeng higit na mainam kaysa sa kanya
  rationale: Sa konteksto ng pagpapalit kay Vasti, ang רְעוּתָהּ ay tumutukoy sa ibang babae. Ang “higit na mainam” ay nagpapanatili sa pangkalahatang paghahambing ng Hebreo nang hindi tinutukoy kung moralidad, kakayahan, o pagiging angkop ang batayan.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit, na angkop sa pananalita sa korte. Iniwasan ang labis na literal na “magmula sa kanyang harapan” dahil hindi ito natural sa Filipino, ngunit pinanatili ang diwang ang kautusan ay opisyal na nagmumula sa hari. Ginamit ang “Vasti” at “Ahasuerus” bilang malinaw na transliterasyon ng mga pangalang Hebreo.
