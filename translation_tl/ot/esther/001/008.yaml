translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “walang pilitan” bilang likas na idyoma, at “tuntunin” upang ipakita ang agarang diwang pamamaraang itinakda para sa handaan nang hindi ikinukubli ang alternatibong “batas.”
