  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: tl
  text: 'Ang pag-inom ay ayon sa tuntunin[a]: walang pilitan[b], sapagkat iniutos ng hari sa bawat pinuno ng kanyang sambahayan na gawin ang nais ng bawat isa[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa batas.” Ang salitang Hebreo ay maaaring tumukoy sa batas, utos, o pormal na tuntunin.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, walang sinumang pinilit uminom.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “bawat lalaki at lalaki,” isang paraan ng pagsasabing bawat indibidwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: Ang pag-inom
  rationale: Tumutukoy ang pangngalan sa mismong gawain ng pag-inom sa konteksto ng handaan; pinananatili nitong tiyak ang diwa nang hindi pinalalawak sa buong piging.
- source_word: כַדָּת
  choice: ayon sa tuntunin
  rationale: Ang דָּת ay maaaring mangahulugang batas, utos, o pormal na patakaran. Sa konteksto ng paraan ng pag-inom sa handaan, mas natural at tiyak ang “tuntunin,” habang itinatala sa talababa ang “batas” bilang lehitimong alternatibo.
- source_word: אֵין אֹנֵס
  choice: walang pilitan
  rationale: Natural na modernong Tagalog ito para sa kawalan ng pamimilit, at malinaw sa konteksto na walang pinilit uminom.
- source_word: כִּי כֵן
  choice: sapagkat
  rationale: Ipinahahayag nito ang dahilan ng kawalan ng pilitan; likas sa Tagalog na isama ang demonstratibong diwa sa kasunod na pahayag tungkol sa iniutos ng hari.
- source_word: יִסַּד
  choice: iniutos
  rationale: Bagaman ang saligang diwa ng pandiwa ay magtatag o magtakda, sa administratibong kontekstong ito ay tumutukoy ito sa pagtatakda ng hari ng isang direktibang ipatutupad.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: sa bawat pinuno ng kanyang sambahayan
  rationale: Ang רַב ay isang nakatataas o pinuno. Pinananatili ng “sambahayan” ang saklaw ng בֵּיתוֹ, na sa kontekstong maharlika ay maaaring kabilang ang pamamahala sa palasyo.
- source_word: לַעֲשׂוֹת
  choice: na gawin
  rationale: Tuwirang katumbas ito ng infinitibong “gawin” at maayos na nag-uugnay sa iniutos ng hari at sa kagustuhan ng bawat panauhin.
- source_word: כִּרְצוֹן
  choice: ang nais ng
  rationale: Ang רָצוֹן dito ay tumutukoy sa kagustuhan o pinipili ng isang tao. Ang “nais” ay natural, malinaw, at marangal sa modernong Tagalog.
- source_word: אִישׁ וָאִישׁ
  choice: bawat isa
  rationale: Isa itong Hebreong distributibong pahayag, literal na “lalaki at lalaki,” na nangangahulugang bawat indibidwal. Ang “bawat isa” ang natural na katumbas sa Tagalog at hindi nagpapahiwatig na binago ang saklaw ng mga dumalo.
