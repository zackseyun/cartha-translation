base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: tl
  text: Sa ikatlong taon ng paghahari niya, nagdaos siya ng isang piging[a] para sa lahat ng kanyang mga pinuno at lingkod—ang hukbo[b] ng Persia at Media, ang mga maharlika, at ang mga pinuno ng mga lalawigan na nasa harapan niya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang handaan na karaniwang may pag-inom at pagdiriwang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “puwersang militar” o “lakas.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa harapan niya,” ibig sabihin, nasa presensya ng hari.
    reason: clarification
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: Nang ikatlong taon ng paghahari niya
  rationale: Likas na pahayag sa modernong Tagalog para sa panandang panahon; malinaw na tumutukoy sa ikatlong taon ng patuloy niyang paghahari.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: nagdaos siya ng isang piging
  rationale: Sa tambalang ito, ang עָשָׂה ay idiomatikong nangangahulugang magdaos, at ang מִשְׁתֶּה ay isang piging na may pag-inom at pagdiriwang.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: para sa lahat ng kanyang mga pinuno at lingkod
  rationale: Ang שָׂרִים ay mga pinunong may katungkulan, samantalang ang עֲבָדִים sa kontekstong pangkorte ay mga lingkod o tauhan ng hari, hindi kailangang mga alipin.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: ang hukbo ng Persia at Media
  rationale: Ang חֵיל ay maaaring tumukoy sa hukbo, puwersang militar, o lakas; ang “hukbo” ang pinakanatural at tuwirang pagbasa rito.
- source_word: הַפַּרְתְּמִים
  choice: ang mga maharlika
  rationale: Ang salitang hiram sa Persiano ay tumutukoy sa mga taong may mataas na antas sa lipunan at pamahalaan.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: at ang mga pinuno ng mga lalawigan
  rationale: Hindi labis na tinutukoy ang eksaktong titulo ng mga pinunong panlalawigan; iniiwasan ng saling ito ang mas makitid na “mga gobernador.”
- source_word: לְפָנָיו
  choice: Nasa harapan niya
  rationale: Pinananatili ang pormal na larawan ng pagharap sa hari habang malinaw na ipinahihiwatig na naroon sila sa kanyang presensya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “piging” para sa pormal na handaang maharlika, “lingkod” para sa mga tauhan ng korte, at “maharlika” para sa mataas na uring Persiano. Hinati sa dalawang pangungusap upang maiwasan ang kalituhan sa saklaw ng לְפָנָיו at upang natural na maipakita na ang hukbo, mga maharlika, at mga pinuno ng lalawigan ay nasa presensya ng hari.
