base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: tl
  text: May mga tabing na puting koton at asul na tela[a], na ikinabit sa mga argolyang pilak[b] sa mga haliging marmol sa pamamagitan ng mga panaling yari sa pinong lino at purpurang tela. May mga higaang ginto at pilak[c] sa ibabaw ng lapag na yari sa alabastro, marmol, nákre, at mamahaling bato[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “asul” ay maaari ring tumukoy sa kulay na asul-lila o biyoleta.
    reason: lexical_alternative
  - marker: b
    text: O “mga paminggalang pilak.” Ang salitang Hebreo ay maaaring tumukoy sa mga bilog o nirolyong kagamitang pilak; hindi tiyak ang eksaktong anyo nito.
    reason: lexical_alternative
  - marker: c
    text: Ang “mga higaan” ay mga higaang ginagamit sa paghilig habang kumakain sa isang piging, hindi karaniwang tulugan.
    reason: cultural_note
  - marker: d
    text: Hindi tiyak ang eksaktong mga materyales sa listahan ng lapag. Ang “alabastro,” “marmol,” “nákre” (ina-ng-perlas), at “mamahaling bato” ay karaniwang mga pagkakakilanlan; isinasalin ng iba ang ilan sa mga ito bilang “porpiri,” “puting marmol,” o “maitim na bato.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: mga tabing na puting koton at asul na tela
  rationale: Ipinapakita nito ang puti, koton, at prestihiyosong asul na materyal nang natural sa Tagalog, habang hindi pinipilit ang mas tiyak na uri o lilim ng tela kaysa sa pinahihintulutan ng Hebreo.
- source_word: אָחוּז
  choice: ikinabit
  rationale: Ang balintiyak na pandiwari ay naglalarawan kung paano matatag na ikinabit ang mga tabing.
- source_word: חַבְלֵי בּוּץ וְאַרְגָּמָן
  choice: mga panaling yari sa pinong lino at purpurang tela
  rationale: Ang 'panali' ay angkop sa pandekorasyong pagkakabit; nililinaw ng 'pinong lino' at 'purpurang tela' ang mamahaling materyales nang hindi ginagawang mabigat na lubid ang larawan.
- source_word: גְּלִילֵי כֶסֶף
  choice: mga argolyang pilak
  rationale: Sa konteksto ng pagkakabit ng mga tabing, ang bilog o nirolyong kagamitang pilak ay natural na mauunawaan bilang mga argolya, bagaman hindi tiyak ang eksaktong hugis.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: mga haliging marmol
  rationale: Dito ang שֵׁשׁ ay tumutukoy sa puting bato, hindi sa lino; ang 'marmol' ay malinaw at angkop sa arkitektura, kahit hindi ganap na tiyak ang mineral.
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: mga higaang ginto at pilak
  rationale: Pinananatili ng 'higaan' ang konkretong larawan, samantalang ipinapaliwanag sa talababa na mga higaang ginagamit sa paghilig habang nagpipista ang tinutukoy.
- source_word: רִצְפַת
  choice: lapag
  rationale: Karaniwan at natural na salitang Tagalog para sa ginawang ibabaw ng sahig, nang hindi ipinapalagay na mosaiko ito.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: alabastro, marmol, kabibeng perlas, at mamahaling bato
  rationale: Gumagamit ito ng mga karaniwang pagkakakilanlan sa isang listahan ng marangyang materyales, ngunit inilalagay sa talababa ang tunay na kawalang-katiyakan ng mga terminong Hebreo.
