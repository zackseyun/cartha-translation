translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “purpura” bilang tiyak na katawagan sa marangyang kulay/tela at ang “kabibeng perlas” bilang likas na katumbas ng mother-of-pearl. Inilagay kaagad ang bawat panandang [a]–[d] sa bahaging ipinapaliwanag nito.
