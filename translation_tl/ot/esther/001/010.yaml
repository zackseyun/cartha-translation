translation_notes:
  register: Modernong, marangal, at madaling maunawaang Filipino. Pinanatili ang bitin na sintaks sa hulihan sa pamamagitan ng em dash sapagkat sa kasunod na talata pa ibinibigay ang ipinagagawa ng hari. Inilipat ang mga talababa sa mismong mga salitang tinatalakay ng mga ito.
