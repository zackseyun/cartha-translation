  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י כְּ/ט֥וֹב לֵב הַ/מֶּ֖לֶךְ בַּ/יָּ֑יִן אָמַ֡ר לִ֠/מְהוּמָן בִּזְּתָ֨א חַרְבוֹנָ֜א בִּגְתָ֤א וַ/אֲבַגְתָא֙ זֵתַ֣ר וְ/כַרְכַּ֔ס שִׁבְעַת֙ הַ/סָּ֣רִיסִ֔ים הַ/מְשָׁ֣רְתִ֔ים אֶת פְּנֵ֖י הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: tl
  text: Sa ikapitong araw, nang sumaya ang puso ng hari dahil sa alak[a], sinabi niya kina Mehuman, Bizta, Harbona, Bigta, Abagta, Zetar, at Karkas—ang pitong eunuko[b] na naglilingkod sa harapan ni Haring Ahasuero—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “nang maging masaya ang hari dahil sa alak.” Ang idyomang Hebreo ay nagsasabing naging masaya ang puso ng hari dahil sa alak, ngunit hindi nito tahasang sinasabing lasing siya.'
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa mga opisyal ng palasyo, ngunit “eunuko” ang mas tuwirang kahulugan nito rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Sa ikapitong araw
  rationale: Likas na panandang temporal sa Tagalog; hindi idinagdag ang “ng pagdiriwang” sapagkat wala iyon sa mismong talata.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: nang sumaya ang puso ng hari dahil sa alak
  rationale: Pinananatili ang Hebreong larawang tumutukoy sa pusong naging masaya dahil sa alak, nang hindi ipinapalagay na tahasang sinasabi ng teksto na lasing ang hari.
- source_word: אָמַר
  choice: sinabi niya kina
  rationale: Karaniwang pandiwa itong “sinabi.” Ang “kina” ay natural bago ang talaan ng mga taong kinausap, habang ang nilalaman ng sinabi ay susunod pa sa kasunod na talata.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: kina Mehuman, Bizta, Harbona, Bigta, Abagta, Zetar, at Karkas
  rationale: Isinalin sa baybay na madaling basahin sa Filipino habang nananatiling malapit sa anyong Hebreo ng mga pangalang pantangi.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: ang pitong eunuko
  rationale: Ang tuwirang leksikal na kahulugan ng סָרִיס ay “eunuko,” bagaman maaari rin itong gamitin nang mas malawak para sa isang opisyal ng palasyo; pinanatili ang pangunahing kahulugan at nilagyan ng talababa.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: na naglilingkod sa harapan ni
  rationale: Pinananatili ang idyomang pangkorte na literal na “naglilingkod sa harapan” ng hari, at malinaw pa rin ito sa modernong Filipino.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuero
  rationale: Natural na ayos sa Filipino para sa titulong maharlika at pangalan; ginamit ang nakaugaliang anyong Filipino na “Ahasuero.”
