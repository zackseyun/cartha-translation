base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: tl
  text: na dalhin si Reyna Vasti, na may putong ng pagkahari[a], sa harap ng hari, upang ipakita sa mga bayan[b] at sa mga pinuno ang kanyang kagandahan, sapagkat maganda ang kanyang anyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suot ang putong ng pagkahari.” Maaaring ipahiwatig ng pang-ukol sa Hebreo ang pagsama o pagsusuot ng putong.
    reason: lexical_alternative
  - marker: b
    text: Nasa anyong maramihan sa Hebreo ang “mga bayan,” na maaaring tumukoy sa maraming bayang sakop ng imperyo.
    reason: lexical_alternative
  - marker: c
    text: Literal na “mabuti ang anyo,” isang idyomang Hebreo na nangangahulugang maganda ang pisikal na kaanyuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: na dalhin
  rationale: Ang Hiphil infinitive ng בוא ay nagsasaad ng pagpapapunta o pagdadala. Likas sa Filipino ang “dalhin” sa kontekstong ito at umaayon sa pagkakasunod ng utos mula sa naunang talata.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: si Reyna Vasti
  rationale: Ginamit ang karaniwang ayos ng titulo at pangalan sa modernong Filipino habang pinananatili ang katayuan niya bilang reyna.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Tuwirang ipinapahayag nito ang pagharap o pagpasok sa presensiya ng hari nang hindi ipinapasok ang pangalan niyang wala sa sugnay.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: na taglay ang putong ng pagkahari
  rationale: Pinananatili ng “taglay” ang maluwag na diwa ng pang-ukol na ב—maaaring kasama o suot—nang hindi tiyakang nagpapasiya kung paano niya dala ang putong. Ang “putong ng pagkahari” ay malinaw at marangal na katumbas ng construct phrase.
- source_word: לְהַרְאוֹת
  choice: upang ipakita
  rationale: Ang Hiphil infinitive ng ראה ay nangangahulugang “magpakita” o “magpatanaw”; malinaw ring ipinahahayag ng “upang” ang layunin.
- source_word: הָעַמִּים
  choice: mga bayan
  rationale: Pinananatili ang anyong maramihan, na maaaring tumukoy sa sari-saring bayang sakop ng imperyo.
- source_word: וְהַשָּׂרִים
  choice: at sa mga pinuno
  rationale: Ang שׂרים ay tumutukoy sa matataas na pinuno o opisyal. Ang “mga pinuno” ay natural at hindi nagpapahiwatig na mga anak sila ng hari.
- source_word: יָפְיָהּ
  choice: ang kanyang kagandahan
  rationale: Tuwirang isinasalin ang pangngalang tumutukoy sa pisikal na kagandahan, kasama ang hulaping panghalip na pambabae.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang paliwanag na dahilan ng hangarin ng hari sa isang dignified ngunit kasalukuyang rehistro.
- source_word: טוֹבַת מַרְאֶה
  choice: maganda ang kanyang anyo
  rationale: Natural na Filipino ito para sa Hebreong idyomang literal na “mabuti ang anyo,” at pinananatili ang tuon sa nakikitang kaanyuan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at pasalaysay na himig. Ginamit ang “putong” sa halip na mas kolokyal na “korona” upang umayon sa rehistrong pampanitikan, ngunit nanatiling madaling maunawaan. Ang pangungusap ay fragmentong nagpapatuloy sa utos sa naunang talata, gaya ng sintaks ng Hebreo.
