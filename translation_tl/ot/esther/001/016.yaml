  text: וַ/יֹּ֣אמֶר מומכן לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/הַ/שָּׂרִ֔ים לֹ֤א עַל הַ/מֶּ֨לֶךְ֙ לְ/בַדּ֔/וֹ עָוְתָ֖ה וַשְׁתִּ֣י הַ/מַּלְכָּ֑ה כִּ֤י עַל כָּל הַ/שָּׂרִים֙ וְ/עַל כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֕ר בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Memucan sa harap ng hari at ng mga opisyal: “Hindi lamang laban sa hari gumawa ng mali si Reyna Vasti, kundi laban din sa lahat ng mga opisyal at sa lahat ng mga mamamayan na nasa lahat ng lalawigan ni Haring Ahasuerus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: מומכן
  choice: Memucan
  rationale: Isinalin sa baybay na malapit sa personal na pangalang Hebreo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Ipinahihiwatig nito na nagsalita siya sa presensya ng hari at ng mga pinuno.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Tumutukoy sa matataas na opisyal o tagapamahala sa korte; malinaw at marangal ang “mga pinuno” sa Filipino.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ
  choice: Hindi lamang sa hari
  rationale: Pinananatili ang balangkas na “hindi lamang… kundi…” at ang diwang nakatuon laban o ukol sa isang tao.
- source_word: עָוְתָה
  choice: nagkasala
  rationale: Ipinapahayag ng pandiwa ang paggawa ng mali o baluktot; natural ang “nagkasala” dito nang hindi nililimitahan ang pagkakamali sa personal na pag-insulto lamang.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: si Reyna Vasti
  rationale: Natural sa Filipino ang paglalagay ng titulo bago ang pangalan, kasama ang pantukoy na “si.”
- source_word: כִּי
  choice: kundi
  rationale: 'Ipinakikilala nito ang pagpapalawak matapos ang pagtanggi: hindi lamang sa hari, kundi sa iba rin.'
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: sa lahat ng pinuno at sa lahat ng mga bayan
  rationale: Pinananatili ang pag-uulit ng “lahat” at ang maramihang עַמִּים, na angkop sa maraming pangkat ng imperyo.
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת
  choice: na nasa lahat ng lalawigan
  rationale: Tuwirang inilalarawan ang mga pinuno at mga bayan bilang nasa mga lalawigan ng imperyo.
- source_word: מְדִינוֹת
  choice: mga lalawigan
  rationale: Karaniwang salin para sa mga administratibong rehiyon ng imperyo sa aklat ng Ester.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuerus
  rationale: Pinananatili ang tradisyonal at madaling makilalang anyo ng pangalan sa halip na palitan ito ng ibang pangalang historikal.
