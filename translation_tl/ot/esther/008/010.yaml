translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang opisyal na himig ng kautusang maharlika. Inilagay ang talababa sa mismong pariralang may leksikal na kawalang-katiyakan, at hindi sa pangalan ng hari.
