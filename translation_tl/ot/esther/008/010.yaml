revisions:
- from: Sumulat siya sa pangalan ni Haring Ahasuero, tinatakan iyon ng singsing na pantatak ng hari, at ipinadala ang mga sulat sa pamamagitan ng mga mensaherong nakasakay sa mga kabayo—mga kabayong pan-hari na mula sa piling lahi.[a]
  to: Sumulat siya sa pangalan ni Haring Ahasuero, tinatakan iyon ng singsing na pantatak ng hari, at ipinadala ang mga sulat sa pamamagitan ng mga mensaherong nakasakay sa mga kabayo—mga kabayong panghari na mula sa mga rammakim.[a]
  rationale: Pinalitan ang “mula sa piling lahi,” na maaaring magmungkahi ng kahulugang wala sa teksto, ng “mula sa mga rammakim,” upang mapanatili ang kawalang-katiyakan ng bihirang terminong Hebreo. Pinanatili ang maayos at pormal na daloy ng Tagalog at ipinaliwanag ang mga posibleng pagbasa sa talababa.
