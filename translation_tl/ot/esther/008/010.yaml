base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: tl
  text: Sumulat siya sa pangalan ni Haring Ahasuero, tinatakan iyon ng singsing na pantatak ng hari, at ipinadala ang mga sulat sa pamamagitan ng mga mensaherong nakasakay sa mga kabayo—mga kabayong panghari na mula sa mga rammakim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira at mahirap tiyakin ang mga salitang Hebreo para sa mga kabayo sa talatang ito. Mas literal na mababasa ang huling parirala na “ang mga kabayo, ang mga achashteranim, mga anak ng mga rammakim.” Maaaring tumukoy ang mga ito sa mga kabayong mula sa maharlikang kawan o sa serbisyong panghatid-singaw ng hari, ngunit hindi tiyak ang eksaktong kahulugan ng mga katawagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Sumulat siya
  rationale: Isinasalaysay ng wayyiqtol ang kasunod na pangyayari; natural sa modernong Tagalog ang payak na aspektong naganap.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: sa pangalan ni Haring Ahasuero
  rationale: Ipinahahayag ng parirala ang pagkilos sa ilalim ng opisyal na kapangyarihan ng hari; malinaw at karaniwan ang idyomang Tagalog.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: tinatakan iyon ng singsing na pantatak ng hari
  rationale: Ang טַבַּעַת sa kontekstong maharlika ay singsing na ginagamit sa pagtatatak. Ang “iyon” ay tumutukoy sa isinulat na kautusan bilang isang kabuuan, alinsunod sa isahang pandiwa.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: ipinadala ang mga sulat
  rationale: Ang סְפָרִים dito ay mga opisyal na nakasulat na mensahe; ang “mga sulat” ay natural at sapat na pormal.
- source_word: בְּיַד הָרָצִים
  choice: sa pamamagitan ng mga mensahero
  rationale: Ang בְּיַד ay idyoma ng ahensiya, at ang הָרָצִים ay mga tagapagdala ng mensahe; mas malinaw sa konteksto ang “mga mensahero” kaysa literal na “mga mananakbo.”
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: nakasakay sa mga kabayo
  rationale: Pinagsama sa natural na pariralang Tagalog ang tahasang pagbanggit sa mga kabayo at ang participleng naglalarawan sa mga mensahero.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: mga kabayong pan-hari na mula sa piling lahi
  rationale: Bihira at pinagtatalunan ang mga terminong ito. Ipinapahiwatig ng salin ang natatanging mga kabayong kaugnay ng maharlikang paglilingkod at ang kanilang pinagmulan o lahi, ngunit iniiwasang magtakda nang tiyak sa uri ng hayop o bilis na hindi malinaw sa Hebreo.
