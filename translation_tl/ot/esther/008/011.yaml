  to: na ipinahintulot ng hari sa mga Judio sa bawat lungsod na magtipon at ipagtanggol ang kanilang buhay, lipulin, patayin, at puksain ang bawat armadong pangkat ng alinmang bayan o lalawigan na kumakalaban sa kanila, kasama ang mga bata at mga babae[a], at samsamin ang kanilang mga ari-arian.
