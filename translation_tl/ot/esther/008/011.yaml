reference: Esther 8:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: tl
  text: na ipinahintulot ng hari sa mga Judio sa bawat lungsod na magtipon at ipagtanggol ang kanilang buhay, lipulin, patayin, at puksain ang bawat armadong pangkat ng alinmang bayan o lalawigan na kumakalaban sa kanila, kasama ang mga bata at mga babae[a], at samsamin ang kanilang mga ari-arian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga bata at mga babae.” Tahasang isinama sila sa grupong kumakalaban sa mga Judio na inilalarawan sa kautusan.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: na ipinahintulot
  rationale: Ipinagpapatuloy ng sugnay ang nilalaman ng utos; sa kontekstong maharlika at legal, likas na ipinapahayag ng “ipinahintulot” ang awtorisasyong ibinigay ng hari.
- source_word: בְּכָל עִיר וָעִיר
  choice: sa bawat lungsod
  rationale: Ang pag-uulit sa Hebreo ay distributibo at mariin; sapat at natural sa modernong Tagalog ang “bawat lungsod” upang ipahayag ang saklaw nito.
- source_word: לְהִקָּהֵל
  choice: magtipon
  rationale: Tuwirang ipinapahayag nito ang sama-samang pagtitipon na nasa Niphal infinitive.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: at ipagtanggol ang kanilang buhay
  rationale: Literal itong “tumayo para sa kanilang buhay,” ngunit ang idyomatikong kahulugan sa konteksto ay pagtatanggol ng buhay; mas malinaw at natural ito sa Tagalog.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: lipulin, patayin, at puksain
  rationale: Pinananatili ang tatlong magkakasunod at magkakalapit na pandiwa at ang matinding wikang marahas ng kautusan nang hindi ito pinapalambot.
- source_word: כָּל חֵיל
  choice: lahat ng sandatahang lakas
  rationale: Sa kontekstong ito, tumutukoy ang חֵיל sa puwersang militar o armadong pangkat, hindi sa kayamanan.
- source_word: עַם וּמְדִינָה
  choice: ng alinmang bayan o lalawigan
  rationale: Ipinahahayag ng “alinmang” ang malawak at di-tiyak na saklaw ng mga grupong etniko-politikal sa imperyo.
- source_word: הַצָּרִים אֹתָם
  choice: na sasalakay sa kanila
  rationale: Ang participle ay tumutukoy sa pagkilos bilang kaaway o pagkapoot; sa depensibong konteksto ng utos, natural itong naipapahayag bilang aktuwal o inaasahang pagsalakay.
- source_word: טַף וְנָשִׁים
  choice: pati ang mga bata at mga babae
  rationale: Tapat nitong pinananatili ang tahasang pagbanggit sa mga bata at babae at ipinakikitang saklaw sila ng grupong tinutukoy, nang hindi ikinukubli ang etikal na bigat ng teksto.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: at samsamin ang kanilang mga ari-arian
  rationale: Ipinahahayag nito sa likas na Tagalog ang pahintulot na kunin bilang samsam ang pag-aari ng mga kaaway.
theological_decisions:
- issue: Marahas na wika sa kautusan ng hari
  choice: Tuwirang isinalin ang tatlong pandiwa ng paglipol at ang pahintulot na manamsam, habang pinananatili ang depensibong konteksto.
  alternative: Palambutin bilang “talunin” lamang o ibuod bilang pangkalahatang pagtatanggol sa sarili.
  rationale: Tahasan at mariin ang Hebreo tungkol sa nakamamatay na karahasan. Hindi ito dapat palambutin, ngunit ipinakikita rin ng konteksto na ang kautusan ay tugon sa mga sasalakay sa mga Judio.
- issue: Saklaw ng “mga bata at mga babae”
  choice: Isinama sila nang tahasan sa grupong saklaw ng marahas na pahintulot at nilagyan ng maikling talababa.
  alternative: Ikubli, alisin, o muling isaayos ang parirala upang mapahina ang etikal na tensiyon.
  rationale: Pinakamalikas sa sintaks na ang parirala ay kasama sa inilalarawang target na pangkat. Dapat panatilihin ng salin ang mahirap na moral na tensiyon sa halip na lutasin o pagtakpan ito.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang malinaw na legal at militar na pananalita; iniwasan ang arkaiko at denominasyonal na bokabularyo. Ang em dash ay tumutulong na ipakita ang appositional na ugnayan ng “mga bata at mga babae” sa target na pangkat.
