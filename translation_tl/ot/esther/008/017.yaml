base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: tl
  text: Sa bawat lalawigan at sa bawat lungsod, saanman makarating ang utos ng hari at ang kaniyang batas, nagkaroon ng galak at tuwa ang mga Judio, ng handaan at araw ng pagdiriwang. At marami sa mga mamamayan ng lupain ang naging Judio[a], sapagkat natakot sila sa mga Judio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpaka-Judio” o “nakikiisa sa mga Judio.” Maaaring tumukoy ang bihirang salitang Hebreo sa pagyakap sa pagkakakilanlang Judio, pakikiayon sa mga Judio, o pagpapakilalang Judio.
    reason: Ipinakikita ang saklaw ng מִתְיַהֲדִים nang hindi ipinipilit sa pangunahing teksto ang isang tiyak na uri ng pagbabalik-loob o pagpapanggap.
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: bawat lalawigan / bawat lungsod
  rationale: Ang inuulit na pangngalan sa Hebreo ay distributibo; likas at tumpak itong ipinahahayag sa Tagalog sa pamamagitan ng “bawat.”
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: ang utos ng hari at ang kaniyang batas
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkahiwalay na katawagan: ang ipinahayag na utos at ang opisyal na batas o atas.'
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: handaan at araw ng pagdiriwang
  rationale: Ang מִשְׁתֶּה ay piging o handaan, samantalang ang יוֹם טוֹב ay literal na “mabuting araw” na sa konteksto ay araw ng kapistahan o pagdiriwang.
- source_word: מִתְיַהֲדִים
  choice: naging Judio
  rationale: Ang hitpael participle ay bihira at maaaring tumukoy sa pagyakap sa pagkakakilanlan o relihiyong Judio; ang payak na salin ay nagpapanatili sa lawak ng kahulugan.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: nahulog sa kanila ang takot sa mga Judio
  rationale: Pinananatili ang matalinghagang pandiwa at ang tunay na kalabuan ng genitibo, bagaman sa konteksto ay malamang na takot na nadama nila dahil sa mga Judio.
theological_decisions:
- issue: Kung tunay na nagbalik-loob o nagkunwari lamang ang mga tao
  choice: naging Judio
  alternative: nagkunwaring mga Judio / yumakap sa Judaismo
  rationale: Hindi tiyak sa bihirang anyo ng pandiwa kung ganap na pagbabalik-loob, pakikiayon sa pamumuhay ng mga Judio, o pagpapanggap dahil sa takot ang tinutukoy. Hindi ito dapat tahasang lutasin sa pangunahing teksto.
- issue: Kahulugan ng “takot sa mga Judio”
  choice: takot sa mga Judio
  alternative: pagkatakot dahil sa mga Judio / sindak na dulot ng mga Judio
  rationale: Pinananatili ang pormal na ugnayan ng mga salita at iniiwasang dagdagan ang teksto ng tiyak na paliwanag sa sanhi o uri ng takot.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Judio” bilang karaniwang katawagan at ang “kaniyang” upang mapanatili ang pormal na himig. Ang distributibong pag-uulit sa Hebreo ay isinalin sa natural na “bawat,” hindi sa di-likas na “lalawigan at lalawigan.”
