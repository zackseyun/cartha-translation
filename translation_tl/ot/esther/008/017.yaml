  to: Sa bawat lalawigan at sa bawat lungsod, saanman makarating ang utos ng hari at ang kaniyang batas, nagkaroon ng galak at tuwa ang mga Judio, ng handaan at araw ng pagdiriwang. At marami sa mga mamamayan ng lupain ang naging Judio[a], sapagkat natakot sila sa mga Judio.
