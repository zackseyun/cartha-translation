  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: tl
  text: Nagkaroon ang mga Judio ng liwanag, tuwa, galak, at karangalan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Para sa mga Judio ay nagkaroon ng liwanag, tuwa, galak, at karangalan.” Maaaring isalin ang konstruksiyon sa Hebreo bilang pagmamay-ari (“Nagkaroon ang mga Judio”) o bilang eksistensiyal (“Para sa mga Judio ay nagkaroon”).
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Para sa mga Judio
  rationale: Pinananatili nito ang panandang ל bilang pagtukoy sa mga nakinabang, at natural itong kaakibat ng konstruksiyong eksistensiyal sa Filipino. Posible rin ang tahasang pagmamay-ari na “Nagkaroon ang mga Judio,” ngunit mas interpretatibo iyon.
- source_word: הָיְתָה
  choice: ay nagkaroon ng
  rationale: Sa konstruksiyong may nauunang pariralang לַיְּהוּדִים, likas na naihahatid ng “nagkaroon ng” ang paglitaw o pagdating ng mga bagay na ito para sa mga Judio. Iniiwasan nito ang di-likas na “mayroong liwanag” habang hindi labis na nagpapaliwanag.
- source_word: אוֹרָה
  choice: liwanag
  rationale: Tuwirang katumbas ito ng salitang Hebreo at pinananatili ang metaporikal na larawan ng kaginhawahan at kaligtasan sa halip na ipaliwanag iyon sa salin.
- source_word: שִׂמְחָה
  choice: tuwa
  rationale: Ang “tuwa” ay natural na modernong salita at naipag-iiba ito sa kasunod na שָׂשׂוֹן, kaya hindi nagsasanib ang dalawang magkalapit na katawagan sa kagalakan.
- source_word: שָׂשׂוֹן
  choice: galak
  rationale: Ipinahihiwatig ng “galak” ang masiglang kagalakan at maayos itong ipinapares sa “tuwa” upang mapanatili ang sunod-sunod na halos magkasingkahulugang salita sa Hebreo.
- source_word: יְקָר
  choice: karangalan
  rationale: Sa konteksto ng pagbabaligtad ng kalagayan ng mga Judio, tumutukoy ito sa dangal o mataas na pagkilala. Mas angkop ang “karangalan” kaysa “ningning,” na maaaring magbigay-diin nang labis sa panlabas na kaningningan.
