  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: tl
  text: Pagkatapos, iniunat ng hari kay Ester ang gintong setro[a]. Bumangon si Ester at tumayo sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iniabot ng hari kay Ester ang gintong setro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: iniunat
  rationale: Tumutukoy ang pandiwa sa pag-uunat o pag-abot ng isang bagay. Natural sa Filipino ang “iniunat” para sa pormal na kilos ng hari gamit ang setro.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: ang gintong setro
  rationale: Malinaw at natural na tumutukoy sa tiyak na maharlikang setro na yari sa ginto o may anyong ginto.
- source_word: וַתָּקָם
  choice: Tumayo
  rationale: Ang pandiwa ay nangangahulugang bumangon o tumayo. Ang “Tumayo” ay maikli, marangal, at angkop matapos ang naunang pagyukod o pagluhod ni Ester.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: at humarap sa hari
  rationale: Ang parirala ay literal na “tumayo sa harap ng hari.” Ginamit ang “humarap sa hari” upang maiwasan ang alanganing pag-uulit ng “tumayo” habang pinananatili ang pormal na pagharap sa presensiya ng hari.
- source_word: וַ
  choice: Pagkatapos
  rationale: Ang panimulang waw-consecutive ay nagsusulong sa sunod-sunod na salaysay; malinaw itong ipinahahayag ng “Pagkatapos” sa modernong Filipino.
- source_word: לְאֶסְתֵּר
  choice: kay Ester
  rationale: Minamarkahan ng pang-ukol ang taong pinatutungkulan ng kilos ng hari; “kay Ester” ang natural na anyo sa Filipino.
