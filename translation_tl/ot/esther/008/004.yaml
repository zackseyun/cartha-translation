translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang pormal na tagpo sa korte at ang pagkakasunod ng dalawang kilos ni Ester nang hindi gumagamit ng mabigat na literal na pag-uulit.
