base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Haring Ahasuerus kay Reyna Ester at kay Mardokeo na Judio, “Tingnan ninyo, ibinigay ko na kay Ester ang bahay ni Haman, at ibinitin siya sa kahoy[a] dahil iniunat niya ang kanyang kamay laban sa mga Judio.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa puno” o “sa kahoy.” Tumutukoy ito rito sa kahoy na istrukturang ginamit sa pagbitay kay Haman.
    reason: Pinananatili sa teksto ang literal na larawan at ipinapaliwanag ang kontekstuwal na gamit nang hindi tiyakang ipinapalagay ang anyo ng istruktura.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuerus
  rationale: Natural sa Filipino ang paglalagay ng titulong “Hari” bago ang isinaling-baybay na pangalan.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: kay Reyna Ester
  rationale: Makinis at karaniwang ayos sa Filipino habang pinananatili ang maharlikang titulo.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: at kay Mardokeo na Judio
  rationale: Ipinananatili ang etnikong pantukoy; mas natural dito ang “na Judio” kaysa sa appositive na may kuwit.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pinananatili ang pantawag-pansing puwersa ng הִנֵּה sa magalang at likas na pananalita ng hari sa dalawang kausap.
- source_word: בֵית הָמָן
  choice: ang sambahayan at ari-arian ni Haman
  rationale: Ang בֵּית ay maaaring tumukoy hindi lamang sa gusali kundi sa kabahayan o estate; nililinaw ng konteksto ng paglilipat kay Ester ang saklaw ng pag-aari.
- source_word: נָתַתִּי
  choice: ibinigay ko na
  rationale: Ang perpektong pandiwa ay isang natapos na kilos na may kasalukuyang bisa; ipinahihiwatig ito ng “na.”
- source_word: וְאֹתוֹ תָּלוּ
  choice: at ibinitin siya
  rationale: Ang Hebreo ay aktibong pangmaramihan na may di-tiyak na tagaganap. Ang pasibong Filipino ay natural at hindi nagdaragdag ng isang tahasang tagaganap.
- source_word: עַל הָעֵץ
  choice: sa kahoy
  rationale: Pinananatili ang pangunahing kahulugang “kahoy/puno” at ang kalabuan tungkol sa tiyak na anyo ng kasangkapang pambitay; ipinapaliwanag ito sa talababa.
- source_word: עַל אֲשֶׁר
  choice: dahil
  rationale: Nagpapakilala ito ng dahilan ng kaparusahan.
- source_word: שָׁלַח יָדוֹ
  choice: tinangka niyang saktan
  rationale: Ang idyoma ay tumutukoy sa mapaminsalang pagkilos o pagtatangka laban sa isang tao o pangkat. Natural itong naipahahayag sa Filipino nang hindi ipinapalagay na natupad ang balak.
- source_word: בַּיְּהוּדִים
  choice: ang mga Judio
  rationale: Sa idyomang Filipino, ang direksiyon ng pagkapoot ay nasa pandiwang “saktan”; “mga Judio” ang angkop na etnikong tawag sa konteksto ng Ester.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan ninyo” dahil dalawa ang kinakausap ng hari. Iniwasan ang makalumang “masdan” at pinanatili sa talababa ang leksikal na kalabuan ng עֵץ.
