revisions:
- from: Pagkatapos, sinabi ni Haring Ahasuerus kay Reyna Ester at kay Mardokeo na Judio, “Tingnan ninyo, ibinigay ko na kay Ester ang sambahayan at ari-arian ni Haman, at ibinitin siya sa kahoy[a] dahil tinangka niyang saktan ang mga Judio.”
  to: Pagkatapos, sinabi ni Haring Ahasuerus kay Reyna Ester at kay Mardokeo na Judio, “Tingnan ninyo, ibinigay ko na kay Ester ang bahay ni Haman, at ibinitin siya sa kahoy[a] dahil iniunat niya ang kanyang kamay laban sa mga Judio.”
  rationale: Inalis ang pagpapalawak ng “bahay” tungo sa tahasang “sambahayan at ari-arian,” at pinalitan ang interpretatibong “tinangka niyang saktan” ng saling nagpapanatili sa larawan at saklaw ng Hebreong idyoma. Nananatili ang modernong Filipino, marangal na rehistro, at ang maingat na talababa para sa “kahoy.”
