translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagpatirapa” at “nagsumamo” upang mapanatili ang pormal at matinding himig ng tagpo; ginamit ang “nito/rito” upang malinaw na ang hari ang tinutukoy at maiwasan ang kalituhan sa mga panghalip.
