base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: tl
  text: Muli pang nagsalita si Ester sa harap ng hari. Nagpatirapa siya sa paanan niya, umiyak, at nagsumamo sa kanya na alisin[a] ang kasamaan ni Haman na Agageo at ang pakanang binuo niya laban sa mga Judio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipawalang-bisa” o “palipasin.” Ang pandiwang Hebreo ay nagpapahiwatig ng pagpapaalis, pagpaparaan, o pagpapawalang-bisa sa kasamaan at pakana ni Haman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר
  choice: Muling nagsalita
  rationale: Ang יסף na sinusundan ng isa pang pandiwa ay nagpapahiwatig ng pag-uulit o pagpapatuloy. Likas sa modernong Tagalog ang “muling nagsalita.”
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Pinananatili nito ang literal na larawang pangpuwang at ang pormal na tagpo sa korte.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: Nagpatirapa siya sa paanan nito
  rationale: Ipinahahayag ng parirala ang pisikal na pagpapatirapa bilang kilos ng pagsusumamo. Nililinaw ng “nito” na ang tinutukoy ay ang hari.
- source_word: וַתֵּבְךְּ
  choice: umiyak
  rationale: Karaniwan at marangal na katumbas ito ng בכה sa salaysay.
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: nagsumamo rito
  rationale: Ipinakikita ng hitpael ng חנן ang taimtim na paghingi ng awa o pabor; ang “nagsumamo” ay angkop sa tindi at pormalidad ng tagpo.
- source_word: לְהַעֲבִיר
  choice: na alisin
  rationale: Ang hiphil ng עבר ay ‘paraanin’ at, sa kontekstong ito, ‘alisin’ o ‘ipawalang-bisa.’ Pinananatiling malawak ng “alisin” ang maaaring saklaw nito.
- source_word: אֶת רָעַת הָמָן
  choice: ang kasamaan ni Haman
  rationale: Ang רָעָה ay maaaring mangahulugang kasamaan, kapahamakan, o pinsala. Pinananatili ng “kasamaan” ang moral na diin at hindi ito isinasanib sa kasunod na hiwalay na “pakana.”
- source_word: הָאֲגָגִי
  choice: na Agagita
  rationale: Karaniwang anyong Tagalog ito para sa katawagang tumutukoy sa angkan o pangkat ni Haman.
- source_word: מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: ang pakanang binuo niya
  rationale: Iniiwasan nito ang alanganing pag-uulit na “binalak na balak” ngunit pinananatili ang diwa ng sinadya at pinag-isipang masamang pakana.
- source_word: עַל הַיְּהוּדִים
  choice: laban sa mga Judio
  rationale: Sa kontekstong mapanlaban, malinaw na ipinahahayag ng עַל ang puntirya ng pakana.
