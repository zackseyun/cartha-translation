  to: Muli pang nagsalita si Ester sa harap ng hari. Nagpatirapa siya sa paanan niya, umiyak, at nagsumamo sa kanya na alisin[a] ang kasamaan ni Haman na Agageo at ang pakanang binuo niya laban sa mga Judio.
