revisions:
- from: At sinabi niya, “Kung minamabuti ng hari, kung nakamit ko ang kanyang pagsang-ayon, kung itinuturing ng hari na nararapat ang bagay na ito, at kung ako ay kalugod-lugod sa kanyang paningin, isulat sana na bawiin[a] ang mga liham na naglalaman ng pakana ni Haman[b] na Agagita, na anak ni Hamedata—mga liham na isinulat niya upang lipulin ang mga Judio sa lahat ng lalawigan ng hari.”
  to: At sinabi niya, “Kung minamabuti ng hari, kung nakamit ko ang kanyang pagsang-ayon, kung itinuturing ng hari na nararapat ang bagay na ito, at kung ako ay kalugod-lugod sa kanyang paningin, nawa’y maisulat na pawalang-bisa[a] ang mga liham na naglalaman ng pakana ni Haman, anak ni Hamedata na Agagita[b], na isinulat niya upang lipulin ang mga Judio na nasa lahat ng lalawigan ng hari.”
  rationale: Inayos ang pasibong pakiusap upang maging malinaw at likas sa Filipino, at ginawang “na nasa” ang huling parirala upang mas malinaw na tumukoy ito sa mga Judio. Inilipat sa mas karaniwang ayos sa Filipino ang pagkakakilanlan kay Haman (“anak ni Hamedata na Agagita”) nang hindi binabago ang kahulugan. Inayos din ang mga talababa upang tumugma sa binagong salin at maiwasan ang labis na pagpapaliwanag.
