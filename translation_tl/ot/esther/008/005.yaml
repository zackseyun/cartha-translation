  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: tl
  text: At sinabi niya, “Kung minamabuti ng hari, kung nakamit ko ang kanyang pagsang-ayon, kung itinuturing ng hari na nararapat ang bagay na ito, at kung ako ay kalugod-lugod sa kanyang paningin, nawa’y maisulat na pawalang-bisa[a] ang mga liham na naglalaman ng pakana ni Haman, anak ni Hamedata na Agagita[b], na isinulat niya upang lipulin ang mga Judio na nasa lahat ng lalawigan ng hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawiin” o “baligtarin.” Ang pandiwang Hebreo ay maaaring mangahulugang “pabalikin” o, sa kontekstong administratibo, pawalang-bisa ang naunang mga liham.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang mga liham, ang pakana ni Haman.” Ang saling “mga liham na naglalaman ng pakana ni Haman” ay nagpapakita na ang mga liham ay kaugnay at nagsasakatuparan sa kanyang pakana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Kung minamabuti ng hari
  rationale: Likas at magalang na pormulang ginagamit sa paghaharap ng kahilingan sa hari; pinananatili nito ang kondisyonal at pormal na himig.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: kung nakamit ko ang kanyang pagsang-ayon
  rationale: Ang חֵן sa kontekstong makahari ay tumutukoy sa pabor o pagsang-ayon. Naiiba rin ito sa kasunod na pahayag tungkol sa personal na pagiging kalugod-lugod.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: kung itinuturing ng hari na nararapat ang bagay na ito
  rationale: Ipinahahayag ng כָשֵׁר ang pagiging angkop o nararapat. Pinananatili ng “bagay na ito” ang lawak ng דָּבָר nang hindi ito nililimitahan sa “panukala.”
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: kung ako ay kalugod-lugod sa kanyang paningin
  rationale: Pinananatili ang idyomang “sa kanyang paningin” at ang diin sa personal na pagtanggap sa nagsasalita.
- source_word: יִכָּתֵב
  choice: isulat sana
  rationale: Isinasalin ang pasibong pakiusap nang hindi tahasang nagdaragdag ng salitang “kautusan,” na wala sa Hebreo.
- source_word: לְהָשִׁיב
  choice: bawiin
  rationale: Sa administratibong konteksto, nangangahulugan itong ipawalang-bisa o baligtarin ang bisa ng naunang mga liham. Ang “bawiin” ay natural sa Filipino at pinananatili ang posibilidad ng literal na pagpapabalik o pagpapawalang-bisa.
- source_word: הַסְּפָרִים
  choice: mga liham
  rationale: Sa Esther, tumutukoy ito sa mga opisyal na sulat na ipinadala sa mga lalawigan; malinaw at karaniwan sa Filipino ang “mga liham.”
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: na naglalaman ng pakana ni Haman
  rationale: Ang literal na ayos ay “ang mga liham, ang pakana ni Haman.” Ginagawang malinaw ng salin na kinakatawan o nilalaman ng mga liham ang kanyang pakana, nang hindi pinag-iisa ang liham at pakana.
- source_word: לְאַבֵּד
  choice: upang lipulin
  rationale: Ipinahahayag nito ang layuning ganap na wasakin ang mga Judio at ang matinding bigat ng pandiwa sa konteksto.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: ang mga Judio sa lahat ng lalawigan ng hari
  rationale: Pinananatili ang saklaw na distributibo sa buong imperyo at ang pormal na kaugnayan ng mga lalawigan sa hari.
