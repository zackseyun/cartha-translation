base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: tl
  text: Lumabas si Mordecai mula sa harapan ng hari[a], suot ang kasuutang panghari na asul[b] at puti, may malaking koronang ginto[c], at balabal[d] na pinong lino at kulay-ube. At naghiyawan at nagalak ang lungsod ng Susa[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa presensiya ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa mamahaling kulay na asul-lila.
    reason: lexical_alternative
  - marker: c
    text: O “marilag na koronang ginto.”
    reason: lexical_alternative
  - marker: d
    text: Ang terminong isinaling “balabal” ay maaaring tumukoy sa isang manta o kasuotang ibinabalot.
    reason: lexical_alternative
  - marker: e
    text: O “sumigaw sa galak at nagsaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: Lumabas ... mula sa harapan ng hari
  rationale: Pinananatili nito ang kilos ng paglabas at ang literal ngunit likas sa Tagalog na idyomang tumutukoy sa paglisan mula sa presensiya ng hari.
- source_word: לְבוּשׁ מַלְכוּת
  choice: maharlikang kasuotan
  rationale: Malinaw at marangal na katawagan ito para sa kasuotang kaugnay ng pagkahari.
- source_word: תְּכֵלֶת וָחוּר
  choice: asul at puti
  rationale: Tuwirang inilalarawan ang magkatambal na mga kulay; maaaring saklawin ng unang termino ang asul-lila.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: malaking koronang ginto
  rationale: Pinananatili ang uri ng palamuti sa ulo, materyal, at laki nang natural sa Tagalog.
- source_word: תַכְרִיךְ
  choice: balabal
  rationale: Ipinahihiwatig ng salita ang isang panlabas na kasuotang ibinabalot; mas tiyak dito ang 'balabal' kaysa pangkalahatang 'damit.'
- source_word: בּוּץ וְאַרְגָּמָן
  choice: pinong lino at kulay-ube
  rationale: Pinananatili ang marangyang materyal at kulay na may kaugnayan sa mataas na katayuan.
- source_word: הָעִיר שׁוּשָׁן
  choice: ang lungsod ng Susa
  rationale: Likas na ayos sa modernong Tagalog para sa lungsod na pinangalanang Susa.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: naghiyawan at nagalak
  rationale: 'Pinananatili ang dalawang magkaibang kilos: ang naririnig na masayang sigaw at ang pagkaranas o pagpapahayag ng galak.'
