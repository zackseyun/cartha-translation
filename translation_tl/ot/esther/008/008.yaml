base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: tl
  text: Ngunit kayo, sumulat kayo tungkol sa mga Judio ayon sa nakikita ninyong mabuti[a], sa pangalan ng hari, at tatakan ninyo iyon ng singsing na pantatak ng hari. Sapagkat ang kasulatang isinulat sa pangalan ng hari at tinatakan ng singsing na pantatak ng hari ay hindi na mababawi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ayon sa nakikita ninyong nararapat.” Literal sa Hebreo: “ayon sa mabuti sa inyong paningin.”'
    reason: lexical_alternative
  - marker: b
    text: O “hindi na mababaligtad.” Ang Hebreong pananalita ay nangangahulugang hindi na maibabalik, mababawi, o mapawawalang-bisa ang gayong kasulatan ng hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ngunit kayo
  rationale: Ipinahihiwatig ng pangatnig at tahasang panghalip ang pagsalungat sa naunang pahayag; pinananatili rin ang maramihang kausap.
- source_word: כִּתְבוּ
  choice: sumulat kayo
  rationale: Tahasang pautos na maramihan ang anyo. Sa konteksto, ito ay utos na may kasamang pahintulot ng hari, kaya hindi na kailangang idagdag ang salitang “maaari.”
- source_word: עַל הַיְּהוּדִים
  choice: tungkol sa mga Judio
  rationale: Pinananatili ang malawak na diwa ng preposisyon bilang paksa o usaping tinutukoy ng kasulatan, nang hindi nililimitahan sa “para sa.”
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: ayon sa mabuti sa inyong paningin
  rationale: Pinananatili ang Hebreong larawang “sa inyong paningin,” habang ang “ayon sa” ay nagbibigay ng likas at marangal na daloy sa Tagalog.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: sa pangalan ng hari
  rationale: Tuwirang katumbas na natural sa Tagalog at nagpapahiwatig ng pagkilos sa ilalim ng awtoridad ng hari.
- source_word: וְחִתְמוּ
  choice: at tatakan ninyo iyon
  rationale: Ang pandiwa ay nangangahulugang maglagay ng tatak. Nilinaw ng “iyon” na ang tinatatakan ay ang isusulat na kasulatan.
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: ng singsing na pantatak ng hari
  rationale: Sa kontekstong administratibo, ang singsing ay ginagamit bilang opisyal na pantatak; malinaw ito sa modernong mambabasa.
- source_word: כְתָב
  choice: ang kasulatan
  rationale: Pangkalahatang tawag ito sa nakasulat na dokumento at hindi kasing-tiyak ng “kautusan” o “dekreto.”
- source_word: אֵין לְהָשִׁיב
  choice: ay hindi na mababawi
  rationale: Ang idyoma ay tumutukoy sa kawalan ng kakayahang bawiin o pawalang-bisa ang opisyal na kasulatan; natural ang “hindi na mababawi” sa legal-administratibong konteksto.
