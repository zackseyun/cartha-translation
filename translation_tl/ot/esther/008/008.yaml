translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang Hebreong idyoma sa pangunahing teksto at ipinaliwanag ang mas natural na kahulugan sa talababa. Ginamit ang “mga Judio,” “kasulatan,” at “singsing na pantatak” bilang mga salitang madaling maunawaan ngunit angkop sa maharlikang-administratibong tagpo.
