base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: tl
  text: Nang araw na iyon, ibinigay ni Haring Ahasuerus kay Reyna Esther ang ari-arian ni Haman, ang kaaway ng mga Judio. At humarap si Mordecai sa hari, sapagkat sinabi ni Esther kung ano ang kaugnayan ni Mordecai sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: ang sambahayan at mga ari-arian ni Haman
  rationale: Ang בַּיִת ay maaaring tumukoy hindi lamang sa gusaling bahay kundi sa buong sambahayan o pag-aaring saklaw nito; inilalahad ang malawak na diwa na angkop sa pagkakaloob ng hari.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: ang kaaway ng mga Judio
  rationale: Ang צֹרֵר ay tumutukoy sa isang kumakalaban o umuusig; natural at tumpak dito ang “kaaway.”
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: humarap ... sa hari
  rationale: Ang idyomang Hebreo ay nagpapahiwatig ng pagpasok o pagharap sa presensiya ng hari, marahil bilang tinanggap na opisyal sa korte.
- source_word: מַה הוּא לָהּ
  choice: kung ano ang kaugnayan nito sa kanya
  rationale: Literal itong “kung ano siya sa kanya.” Pinananatili ng “kung ano ang kaugnayan” ang hindi tahasang pagtukoy sa eksaktong ugnayan, bagaman malinaw sa salaysay na magkamag-anak sila.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinapahayag dito ang dahilan kung bakit nakaharap si Mordecai sa hari; pormal ngunit likas sa marangal na salaysay ang “sapagkat.”
theological_decisions:
- issue: Eksaktong relasyon ni Mordecai kay Esther
  choice: kung ano ang kaugnayan nito sa kanya
  alternative: na kamag-anak niya ito / na pinsan niya ito
  rationale: Hindi espesipikong pinangalanan ng talata ang relasyon; iniiwasang ipasok dito ang impormasyong mula sa naunang konteksto at pinananatili ang pagkakalahad ng Hebreo.
translation_notes:
  register: Modernong Filipino na may dignidad ng makasaysayang salaysay. Ginamit ang “Judio,” ang karaniwang modernong katawagan, at iniwasan ang sobrang literal na “bahay” kung maaari itong mapagkamalang gusali lamang.
