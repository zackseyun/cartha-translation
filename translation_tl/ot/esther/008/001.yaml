  to: Nang araw na iyon, ibinigay ni Haring Ahasuerus kay Reyna Esther ang ari-arian ni Haman, ang kaaway ng mga Judio. At humarap si Mordecai sa hari, sapagkat sinabi ni Esther kung ano ang kaugnayan ni Mordecai sa kanya.
