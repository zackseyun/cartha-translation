  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: tl
  text: Sapagkat paano ko matitiis na makita ang kapahamakang sasapit sa aking bayan? At paano ko matitiis na makita ang pagkalipol ng aking mga kaangkan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pagkalipol ng aking mga kamag-anak” o “ng mga taong kaugnay ng aking kapanganakan.” Ang Hebreong מוֹלַדְתִּי ay maaaring tumukoy sa mga kaangkan o kamag-anak, hindi lamang sa lugar ng kapanganakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pakiusap ni Esther sa naunang konteksto.
- source_word: אֵיכָכָה אוּכַל
  choice: paano ko matitiis
  rationale: Ang retorikal na tanong ay hindi lamang tungkol sa kakayahan kundi sa hindi niya kayang batahin ang masasaksihan; natural itong ipinahahayag sa Tagalog bilang “paano ko matitiis.”
- source_word: וְרָאִיתִי
  choice: na makita
  rationale: Bagaman literal na may anyong “at makikita ko,” gumaganap itong kaugnay na pandiwa pagkatapos ng אוּכַל; ang “na makita” ay likas sa Tagalog at pinananatili ang diwa ng pagsaksi.
- source_word: בָּרָעָה
  choice: ang kapahamakan
  rationale: Sa konteksto, tumutukoy ang רָעָה sa sakuna o pinsalang sasapit, hindi sa kasamaan bilang moral na katangian.
- source_word: אֲשֶׁר יִמְצָא
  choice: na sasapit
  rationale: Ang Hebreong idyoma na literal na “makasusumpong” sa isang tao ay nangangahulugang mangyayari o sasapit sa kaniya.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Malinaw nitong ipinahahayag ang pagkakaugnay ni Esther sa kaniyang sambayanan at likas itong katumbas ng עַם sa Filipino.
- source_word: בְּאָבְדַן
  choice: ang pagkalipol
  rationale: Ang pangngalan mula sa אבד ay tumutukoy sa pagkawala o pagkawasak; sa konteksto ng banta sa buong pangkat, tumpak ang “pagkalipol” nang hindi dinaragdagan ang detalye.
- source_word: מוֹלַדְתִּי
  choice: aking mga kababayan
  rationale: Maaaring tumukoy ang salita sa mga taong kaugnay ng kapanganakan o angkan ni Esther. Ang “mga kababayan” ay natural sa modernong Filipino at pinananatili ang kolektibong ugnayang etniko, habang inilalahad sa talababa ang ibang posibleng pakahulugan.
