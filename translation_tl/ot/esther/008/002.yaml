translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinili ang “singsing na pantatak” sa halip na teknikal o hiram na katawagan, at ang “Mardoqueo” bilang karaniwang anyong Filipino ng pangalan.
