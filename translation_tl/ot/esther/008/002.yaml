base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: tl
  text: Pagkatapos, hinubad ng hari ang kanyang singsing na pantatak, na binawi niya kay Haman, at ibinigay iyon kay Mardoqueo. Itinalaga naman ni Ester si Mardoqueo na mamahala sa bahay[a] ni Haman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sambahayan” o “ari-arian.” Maaaring tumukoy ang “bahay” sa gusali, sa sambahayan, o sa ari-ariang kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: hinubad
  rationale: Sa konteksto ng singsing, likas sa Filipino ang “hinubad” at malinaw na inilalarawan ang pag-aalis nito ng hari sa kanyang kamay.
- source_word: טַבַּעְתּוֹ
  choice: kanyang singsing na pantatak
  rationale: Bagaman maaaring mangahulugang simpleng singsing ang טַבַּעַת, sa konteksto ng korte sa Ester ito ang singsing na ginagamit upang magpatibay ng mga utos ng hari.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: na binawi niya kay Haman
  rationale: Ipinahihiwatig ng Hiphil ng עבר ang pag-aalis o paglilipat. Ang “binawi” ay angkop sa naunang pagkakaloob ng singsing kay Haman at sa pagkumpiska nito matapos ang kanyang pagbagsak.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: at ibinigay iyon kay Mardoqueo
  rationale: Tuwirang isinasalin ang נתן bilang “ibinigay”; ang “iyon” ay tumutukoy sa singsing.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: Itinalaga naman ni Ester si Mardoqueo na mamahala sa
  rationale: Ang שׂוּם na may עַל ay nagpapahayag ng paglalagay o pagtatalaga sa isang saklaw ng pananagutan. Nililinaw ng “na mamahala sa” ang administratibong tungkulin.
- source_word: בֵּית הָמָן
  choice: buong ari-arian ni Haman
  rationale: Maaaring tumukoy ang בַּיִת sa bahay, sambahayan, o kabuuang pag-aari. Dahil ipinagkaloob kay Ester ang pag-aari ni Haman sa 8:1 at may itinalagang tagapamahala rito, ang “buong ari-arian” ang pinakamalinaw sa konteksto, habang pinananatili sa talababa ang ibang posibleng diwa.
