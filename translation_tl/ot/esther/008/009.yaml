revisions:
- from: Nang panahong iyon ay ipinatawag ang mga tagasulat ng hari. Noon ay ikatlong buwan, ang buwan ng Siwan, at ikadalawampu’t tatlong araw ng buwang iyon.[b] Isinulat ang lahat ayon sa iniutos ni Mardokeo para sa mga Judio at sa mga satrapa, mga gobernador, at mga pinuno ng mga lalawigan mula India hanggang Cush[a]—127 lalawigan. Isinulat ito para sa bawat lalawigan sa sarili nitong paraan ng pagsulat, para sa bawat bayan sa sarili nitong wika, at para sa mga Judio sa sarili nilang paraan ng pagsulat at sa sarili nilang wika.
  to: Nang panahong iyon, ipinatawag ang mga tagasulat ng hari, sa ikatlong buwan, ang buwan ng Siwan, noong ikadalawampu’t tatlong araw nito.[b] Isinulat ito ayon sa lahat ng iniutos ni Mardokeo para sa mga Judio at para sa mga satrapa, mga gobernador, at mga opisyal ng mga lalawigan mula India hanggang Cush[a]—127 lalawigan. Isinulat ito para sa bawat lalawigan sa sarili nitong paraan ng pagsulat, para sa bawat pangkat ng tao sa sarili nitong wika, at para sa mga Judio sa sarili nilang paraan ng pagsulat at sa sarili nilang wika.
  rationale: Inayos ang paglalahad ng petsa at ang pasibong sugnay tungkol sa pagsulat upang maging malinaw at likas sa Filipino, nang pinananatili ang saklaw ng “lahat ng iniutos.” Pinalitan ang “mga pinuno” ng “mga opisyal” para sa administratibong kahulugan, at ang “bayan” ng “pangkat ng tao” upang maipakita ang עַם bilang isang pangkat ng mga tao, hindi isang lugar. Napanatili ang mga umiiral na footnote anchor at mga tala dahil wastong nakatali ang [a] sa Cush at [b] sa petsa.
