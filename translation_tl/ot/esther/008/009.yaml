  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: tl
  text: Nang panahong iyon, ipinatawag ang mga tagasulat ng hari, sa ikatlong buwan, ang buwan ng Siwan, noong ikadalawampu’t tatlong araw nito.[b] Isinulat ito ayon sa lahat ng iniutos ni Mardokeo para sa mga Judio at para sa mga satrapa, mga gobernador, at mga opisyal ng mga lalawigan mula India hanggang Cush[a]—127 lalawigan. Isinulat ito para sa bawat lalawigan sa sarili nitong paraan ng pagsulat, para sa bawat pangkat ng tao sa sarili nitong wika, at para sa mga Judio sa sarili nilang paraan ng pagsulat at sa sarili nilang wika.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ethiopia.” Ang Hebreo ay “Cush,” isang sinaunang pangalang heograpiko na hindi laging eksaktong katumbas ng makabagong Ethiopia.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa ikadalawampu’t tatlo nito,” na tumutukoy sa ikatlong buwan.
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: ipinatawag ang mga tagasulat ng hari
  rationale: Ang Niphal ay pasibo; malinaw na ipinatawag sila para sa gawaing opisyal. Mas madaling maunawaan ang “mga tagasulat” kaysa sa hiram na “mga eskriba,” habang nananatili ang tungkulin nila sa korte.
- source_word: בָּעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Tuwirang pinananatili ang tahasang pahayag ng panahon sa Hebreo.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: ikatlong buwan, ang buwan ng Siwan
  rationale: Pinananatili ang bilang ng buwan at ang paliwanag na pangalan nito. “Siwan” ang angkop na transliterasyon sa baybay-Filipino.
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: ikadalawampu’t tatlong araw ng buwang iyon
  rationale: Natural na Filipino ito para sa anaporikong בּוֹ, na tumutukoy sa nabanggit na buwan.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: Isinulat ang lahat ayon sa iniutos ni Mardokeo
  rationale: Pinananatili ang di-tiyak na gumagawa sa pasibong anyo at ang saklaw ng כְּכָל, nang hindi dinaragdagan ng tahasang “kautusan” o “dokumento” na wala sa teksto.
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: mga satrapa
  rationale: Ito ang kinikilalang katawagang pangkasaysayan para sa mataas na opisyal ng Imperyong Persia at iniiwasang ipantay sa ibang antas ng pamamahala.
- source_word: הַפַּחוֹת
  choice: mga gobernador
  rationale: Malinaw at pangkaraniwang katumbas sa makabagong Filipino para sa mga pinunong panlalawigan.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: mga pinuno ng mga lalawigan
  rationale: Ang שׂרים ay maaaring mga opisyal o pinuno; pinananatili ng “mga pinuno” ang lawak nito nang hindi nagpapahiwatig ng pagkamaharlika.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: mula India hanggang Cush
  rationale: Ang הֹדּוּ ay karaniwang tumutukoy sa India. Pinananatili ang sinaunang pangalang “Cush” upang hindi ito awtomatikong ipantay sa mga hangganan ng makabagong Ethiopia.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: para sa bawat lalawigan sa sarili nitong paraan ng pagsulat, para sa bawat bayan sa sarili nitong wika
  rationale: Inilalarawan ng כְּתָב ang sistema o anyo ng pagsulat, hindi lamang indibiduwal na mga titik. Ang “bayan” dito ay kolektibong pangkat ng mga tao, ayon sa konteksto.
