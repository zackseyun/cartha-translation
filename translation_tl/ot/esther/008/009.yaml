translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Hinati sa maiikling pangungusap ang napakahabang sugnay ng Hebreo upang maging madaling basahin, ngunit pinanatili ang pagkakasunod-sunod ng panahon, mga tumanggap, 127 lalawigan, at magkakaibang paraan ng pagsulat at wika. Ginamit ang “Judio” at “Mardokeo” bilang natural na anyong Filipino, at pinanatili ang teknikal na “satrapa” dahil wala itong eksaktong karaniwang katumbas.
