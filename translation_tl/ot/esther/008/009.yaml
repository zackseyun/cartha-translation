    issue: Hindi malinaw ang saklaw ng “Isinulat ang lahat ayon sa iniutos ni Mardokeo.”
    rationale: Ang וַיִּכָּתֵב ay pasibong isahan, na tumutukoy sa liham o kautusang isinulat, samantalang כְּכָל אֲשֶׁר ay “ayon sa lahat ng iniutos.” Ang “Isinulat ito ayon sa lahat ng iniutos ni Mardokeo” ay mas malinaw at mas malapit sa estruktura ng pinagmulan.
  - severity: low
    issue: Ang “Noon ay ikatlong buwan” ay medyo di-likas na paglalatag ng petsa.
    rationale: Mas natural ang “sa ikatlong buwan ... noong ikadalawampu’t tatlong araw nito,” habang naiiwan ang tahasang “nang panahong iyon” ng Hebreo.
  - severity: low
    issue: Maaaring tumukoy ang “bayan” sa isang pamayanan o lugar.
    rationale: Ang עַם ay isang pangkat o sambayanan. Ang “bawat pangkat ng tao” ay umiiwas sa heograpikong pagbasa at pinapanatili ang pagkakaiba nito sa “lalawigan.”
