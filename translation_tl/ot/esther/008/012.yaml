base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: tl
  text: sa iisang araw sa lahat ng lalawigan ni Haring Ahasuerus, sa ikalabintatlong araw ng ikalabindalawang buwan, na siyang buwan ng Adar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: sa iisang araw
  rationale: Ang בְּ ay panandang temporal, at ang אֶחָד ay pinananatiling tahasang 'iisa.' Likas sa Filipino ang 'sa iisang araw' at binibigyang-diin nitong sabay na itinakda ang pangyayari nang hindi lumalampas sa Hebreo.
- source_word: בְּכָל מְדִינוֹת
  choice: sa lahat ng lalawigan
  rationale: Ang מְדִינוֹת ay mga administratibong lalawigan ng imperyo. Tuwiran at natural sa modernong Filipino ang 'sa lahat ng lalawigan.'
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: ni Haring Ahasuerus
  rationale: Ipinahahayag ng parirala ang pag-aari o nasasakupan. Ang 'ni Haring Ahasuerus' ang natural na anyong Filipino at pinananatili ang transliterasyon ng pangalan.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: sa ikalabintatlong araw
  rationale: Bagaman cardinal ang anyo sa Hebreo, ginagamit ito bilang petsang ordinal. Idinagdag ang 'araw' para sa malinaw at likas na pormula ng petsa sa Filipino.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: ng ikalabindalawang buwan
  rationale: Literal itong tumutukoy sa 'buwan na labindalawa.' Ang ordinal na 'ikalabindalawang buwan' ang malinaw at idiomatikong katumbas sa Filipino.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: samakatuwid, ang buwan ng Adar
  rationale: Ang הוּא ay nagpapakilala rito ng paliwanag o aposisyon. Ang 'samakatuwid' ay naghahatid ng paglilinaw, at ang 'buwan ng Adar' ay natural na tawag sa Filipino.
