  to: Ang mga tagapagdala ng mensahe[a], na nakasakay sa mga kabayong panghari, ay nagmamadaling umalis, na minamadali at itinutulak ng utos ng hari. At ang kautusan ay inilabas sa tanggulan ng Susa.
