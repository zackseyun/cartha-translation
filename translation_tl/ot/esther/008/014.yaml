  source_fidelity: Ang “tagapagdala ng mensahe” ay tumutugma sa tungkulin ng הָרָצִים sa kontekstong imperyal, at wastong naihahatid ang opisyal na kautusan at ang tanggulan ng Susa. Gayunman, ang “mga kabayong maharlika” ay maaaring mangahulugang mga kabayong may dugong maharlika, sa halip na mga kabayong ginagamit ng hari. Ang “mabilis na lumabas” ay bahagyang mahina para sa magkasunod na diwa ng pagmamadali at pagpapaapurahan sa מְבֹהָלִים וּדְחוּפִים.
  naturalness: Natural ang pangkalahatang register, ngunit mas idiomatiko at mas matapat ang “nagmamadaling umalis, na minamadali at itinutulak” kaysa “mabilis na lumabas, minamadali.” Ang “kabayong panghari” ay mas malinaw sa modernong Filipino kaysa “kabayong maharlika.”
  terminology: Ang “kautusan,” “utos ng hari,” at “tanggulan ng Susa” ay angkop. Pinananatili ng talababa ang kinakailangang kawalang-katiyakan tungkol sa mga bihirang katawagang Hebreo para sa mga hayop.
