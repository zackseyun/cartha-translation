base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: tl
  text: Ang mga tagapagdala ng mensahe[a], na nakasakay sa mga kabayong panghari, ay nagmamadaling umalis, na minamadali at itinutulak ng utos ng hari. At ang kautusan ay inilabas sa tanggulan ng Susa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga mananakbo.” Bihira ang mga salitang Hebreo para sa mga hayop na sinasakyan, kaya hindi tiyak ang eksaktong pagkakakilanlan ng mga ito. Maaari ring unawain ang parirala bilang “nakasakay sa mga kabayo mula sa kawan ng hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: mga tagapagdala ng mensahe
  rationale: Bagaman kaugnay sa literal na “mga mananakbo,” tumutukoy ito sa konteksto sa mga opisyal na tagapagdala ng utos ng hari; natural at malinaw ito sa modernong Filipino.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: na nakasakay sa mga kabayong maharlika
  rationale: Inilalarawan ang mga sugo bilang nakasakay sa mga hayop na ginagamit sa mabilis na paglilingkod sa hari. Hindi tiniyak ang eksaktong uri sapagkat bihira at di-ganap na tiyak ang mga terminong Hebreo.
- source_word: יָצְאוּ מְבֹהָלִים וּדְחוּפִים
  choice: ay mabilis na lumabas, minamadali
  rationale: Pinananatili ang mabilis na pagkilos at ang diwang sila ay inuudyukan o itinutulak na magmadali, nang hindi inuulit nang alanganin ang magkalapit na ideya sa Filipino.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: ng utos ng hari
  rationale: Ang דָּבָר dito ay isang makapangyarihang utos; ipinakikita ng parirala na iyon ang dahilan at puwersang nagtutulak sa kanilang pagmamadali.
- source_word: וְהַדָּת נִתְּנָה
  choice: At ang kautusan ay inilabas
  rationale: Sa administratibong konteksto ng Esther, ang דָּת ay opisyal na kautusan at ang literal na “ibinigay” ay natural na ipinahahayag bilang “inilabas.”
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: sa tanggulan ng Susa
  rationale: Ang הַבִּירָה ay tumutukoy sa tanggulan o muog na bahagi ng Susa; ang ayos na ito ay likas sa Filipino.
