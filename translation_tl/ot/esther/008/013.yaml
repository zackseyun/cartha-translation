  terminology: Ang “sipi,” “nakasulat na kautusan,” “bilang batas,” “lalawigan,” at “mga Judio” ay angkop sa kontekstong administratibo at pangkasaysayan. Pinalitan ang “mga bayan” ng “mga sambayanan” upang mapanatili ang kahulugang “mga peoples,” hindi “mga towns.”
