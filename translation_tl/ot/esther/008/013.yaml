  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: tl
  text: Isang sipi ng nakasulat na kautusan ang ilalabas bilang batas sa bawat lalawigan[a], at ihahayag ito sa lahat ng mga sambayanan[b], upang maging handa ang mga Judio para sa araw na iyon[c] at maghiganti sa kanilang mga kaaway.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa bawat lalawigan at lalawigan.” Ang pag-uulit sa Hebreo ay nangangahulugang bawat isa sa lahat ng lalawigan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ilalathala” o “hayagang ipapakita.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “para sa araw na ito,” na tumutukoy sa itinakdang petsa.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring isalin na “upang gumanti sa kanilang mga kaaway.” Isinasalin ito ng ilan nang mas interpretibo bilang “upang ipagtanggol ang kanilang sarili,” ngunit ang pandiwa sa Hebreo ay partikular na nangangahulugang maghiganti o gumanti.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: isang sipi ng nakasulat na kautusan
  rationale: Ang salitang hiram sa Persiano ay tumutukoy sa sipi ng isang opisyal na kasulatan, samantalang ang הַכְּתָב ay literal na “ang nakasulat” o “ang kasulatan.” Sa kontekstong maharlika at administratibo, malinaw at likas sa Tagalog ang “nakasulat na kautusan.”
- source_word: לְהִנָּתֵן דָּת
  choice: ilalabas bilang batas
  rationale: Ipinahihiwatig ng parirala ang opisyal na pagpapalabas ng kasulatan na may bisa bilang batas. Pinananatili ng “bilang batas” ang legal na puwersa ng דָּת.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: sa bawat lalawigan
  rationale: Ang pag-uulit na “lalawigan at lalawigan” ay idyomang distributibo sa Hebreo; natural itong ipinahahayag sa Tagalog bilang “sa bawat lalawigan,” habang inilalahad sa talababa ang literal na anyo.
- source_word: גָּלוּי
  choice: ihahayag
  rationale: Ang salita ay nangangahulugang hayag o inilalantad sa madla. Sa konteksto ng isang opisyal na kautusan, ang “ihahayag” ay malinaw at natural.
- source_word: לְכָל הָעַמִּים
  choice: sa lahat ng mga bayan
  rationale: Tumutukoy ang maramihang anyo sa iba't ibang sambayanan o pangkat-etniko sa imperyo, hindi lamang sa mga indibidwal na mamamayan.
- source_word: הַיְּהוּדִים
  choice: mga Judio
  rationale: Sa Ester, tumutukoy ito sa bayang Judio na nakakalat sa Imperyo ng Persia, hindi lamang sa mga naninirahan sa Judea.
- source_word: עֲתוּדִים
  choice: handa
  rationale: Tuwirang ipinahahayag ng pang-uri ang pagiging nakahanda o handa.
- source_word: לַיּוֹם הַזֶּה
  choice: para sa araw na iyon
  rationale: Literal itong “para sa araw na ito,” ngunit ang tinutukoy ay ang takdang araw na binanggit sa kautusan; mas natural sa salaysay na Tagalog ang “araw na iyon.”
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: makapaghiganti sa kanilang mga kaaway
  rationale: Ang Niphal ng נקם ay tahasang tumutukoy sa paghihiganti o pagganti. Ang “makapaghiganti” ay likas sa Tagalog at hindi pinahihina ang leksikal na diwa tungo lamang sa pagtatanggol.
theological_decisions:
- issue: Posibleng pagpapalambot sa marahas na pananalita tungkol sa pagganti
  choice: makapaghiganti sa kanilang mga kaaway
  alternative: maipagtanggol ang kanilang sarili laban sa kanilang mga kaaway
  rationale: Bagaman kasama sa mas malawak na konteksto ang pagtatanggol sa sarili, ang pandiwang נקם sa talatang ito ay partikular na nangangahulugang maghiganti o gumanti. Pinananatili ng salin ang tensiyon at lakas ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinili ang mga karaniwang salitang “sipi,” “kautusan,” “batas,” at “lalawigan,” habang pinanatili ang opisyal na tono ng isang atas ng hari. Inilagay ang lahat ng panandang talababa sa mismong teksto.
