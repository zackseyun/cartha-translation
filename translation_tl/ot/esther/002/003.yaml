translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang administratibong himig ng utos at ang magkahiwalay na diwa ng kabataan at pagiging birhen. Ginamit ang mas pormal na “bahay ng mga babae” sa teksto, samantalang inilagay sa talababa ang “harem.”
