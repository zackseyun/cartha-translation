  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: tl
  text: Magtalaga ang hari ng mga opisyal sa lahat ng lalawigan ng kanyang kaharian. Tipunin nila ang bawat dalagang birhen na maganda ang anyo at dalhin sa tanggulan ng Susa, sa bahay ng mga babae[a], sa pangangalaga ni Hegai, ang eunuko ng hari na tagapangalaga ng mga babae. At ibigay sa kanila ang mga pampaganda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harem.” Mas literal sa Hebreo ang “bahay ng mga babae.”
    reason: lexical_alternative
  - marker: b
    text: O “ipagkaloob sa kanila ang mga paggamot na pampaganda.” Maaaring tumukoy ang salitang Hebreo sa mga preparasyong kosmetiko o, sa mas malawak na diwa, sa mga paggamot para sa pagpapaganda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: magtalaga
  rationale: Ang Hiphil ng פקד ay tumutukoy dito sa paghirang o pagtatalaga ng mga opisyal para sa isang tungkulin; natural sa makabagong Filipino ang “magtalaga.”
- source_word: פְּקִידִים
  choice: mga opisyal
  rationale: Tumutukoy sa mga tauhan ng hari na inatasan sa gawaing administratibo, hindi kinakailangang mga militar.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: lahat ng lalawigan ng kanyang kaharian
  rationale: Ang “mga lalawigan” ay malinaw at natural na katumbas ng mga nasasakupang administratibo ng imperyo.
- source_word: וְיִקְבְּצוּ
  choice: tipunin nila
  rationale: Pinananatili nito ang pautos na pagpapatuloy ng mungkahi at ang diwa ng pagdadala ng mga tao sa iisang lugar.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: bawat dalagang birhen
  rationale: Pinananatili ng “dalaga” ang kabataan at ng “birhen” ang tahasang pagtukoy sa virginity; hindi inaalis ang alinman sa dalawang sangkap ng Hebreo.
- source_word: טוֹבַת מַרְאֶה
  choice: maganda ang anyo
  rationale: Natural na Filipino ito na nagpapanatili sa biswal na diin ng literal na “mabuti sa anyo.”
- source_word: שׁוּשַׁן הַבִּירָה
  choice: tanggulan ng Susa
  rationale: Ang בירה ay tumutukoy sa napapaderan o pinatibay na maharlikang sentro; iniiwasan ng “tanggulan” na ituring lamang itong karaniwang lungsod.
- source_word: בֵּית הַנָּשִׁים
  choice: bahay ng mga babae
  rationale: Malapit ito sa literal na Hebreo at hindi agad ipinapasok sa pangunahing teksto ang mas interpretatibong “harem.”
- source_word: אֶל יַד הֵגֶא
  choice: sa pangangalaga ni Hegai
  rationale: Idyomatiko itong katumbas ng “sa kamay ni Hegai,” na dito ay nangangahulugang nasa ilalim ng kanyang awtoridad at pangangasiwa.
- source_word: סְרִיס
  choice: eunuko
  rationale: Ito ang pangunahing kahulugan ng salita at angkop sa konteksto ng tirahan ng mga babae, bagaman maaari rin itong tumukoy nang mas malawak sa opisyal ng palasyo sa ibang konteksto.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: tagapangalaga ng mga babae
  rationale: Malinaw nitong inilalarawan ang tungkulin ni Hegai nang hindi dinaragdagan ang saklaw ng kanyang titulo.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: bigyan ang mga dalaga ng kanilang mga pampaganda
  rationale: Ang “mga pampaganda” ay maikli, natural, at maaaring tumukoy sa mga preparasyong kosmetiko; nililinaw sa talababa ang posibleng mas malawak na diwa ng mga pagpapagandang paggamot.
