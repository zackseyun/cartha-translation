base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: tl
  text: Hindi pa rin ibinubunyag ni Ester ang kanyang pinagmulan[a] at ang kanyang bayan, gaya ng iniutos sa kanya ni Mardokeo. Patuloy na sinusunod ni Ester ang sinabi ni Mardokeo, gaya noong siya ay nasa pangangalaga ni Mardokeo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang kanyang angkan.” Ang salitang Hebreo ay maaaring tumukoy sa kapanganakan, angkan, o pinagmulan.
    reason: lexical_alternative
  - marker: b
    text: O “gaya noong siya ay pinalalaki ni Mardokeo.” Ipinapaalala ng Hebreo ang naunang buhay ni Ester sa ilalim ng pagkalinga ni Mardokeo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... מַגֶּדֶת
  choice: Hindi pa rin ipinagtatapat
  rationale: Ang אֵין kasama ng participle ay nagpapahayag ng nagpapatuloy na hindi pagsasabi sa puntong ito ng salaysay. Ipinakikita ng “hindi pa rin” ang pagpapatuloy, at ang “ipinagtatapat” ay natural na paglalahad ng sadyang pagsisiwalat nang hindi nagdaragdag ng motibo.
- source_word: מוֹלַדְתָּהּ
  choice: ang kanyang pinagmulan
  rationale: Maaaring tumukoy ang salita sa kapanganakan, angkan, o pinagmulang kinship group. Malinaw at likas sa modernong Filipino ang “pinagmulan,” habang pinananatili sa talababa ang mas tiyak na alternatibong “angkan.”
- source_word: עַמָּהּ
  choice: ang kanyang bayan
  rationale: Ang עַם ay karaniwang “people.” Sa konteksto, tumutukoy ito sa kanyang pambansa o etnikong pagkakakilanlan; dignified at biblikal ngunit nauunawaan pa rin ang “kanyang bayan.”
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ מָרְדֳּכָי
  choice: gaya ng iniutos sa kanya ni Mardokeo
  rationale: Pinananatili ng “iniutos” ang lakas ng צוה, na higit sa payo lamang, at likas ang ayos ng pangungusap sa Filipino.
- source_word: מַאֲמַר מָרְדֳּכַי ... עֹשָׂה
  choice: Patuloy na sinusunod ni Ester ang sinabi ni Mardokeo
  rationale: Ang מַאֲמַר ay maaaring salita, sinabi, o utos; “ang sinabi” ay hindi inuulit nang di-kailangan ang “iniutos.” Ang participle na עֹשָׂה ay inilalahad na patuloy o kinagawiang pagsunod.
- source_word: כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ
  choice: gaya noong siya ay nasa pangangalaga nito
  rationale: Ang anyo mula sa אמן ay tumutukoy sa pagpapalaki o pagkalinga ni Mardokeo kay Ester. Sinasaklaw ng “nasa pangangalaga nito” ang ugnayang tagapag-alaga nang hindi labis na nililimitahan sa isang modernong legal na kategorya.
