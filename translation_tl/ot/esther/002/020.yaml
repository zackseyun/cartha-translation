translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “Mardokeo,” ang karaniwang anyong Tagalog ng pangalan. Pinanatili ang pagkakaiba ng “pinagmulan” at “bayan,” gayundin ang patuloy na aspekto ng hindi pagsasabi at pagsunod.
