  to: Minahal ng hari si Ester nang higit sa lahat ng babae. Nagtamo siya ng higit na paglingap at kagandahang-loob sa paningin ng hari[a] kaysa sa lahat ng birhen[b]. Kaya ipinutong ng hari sa ulo niya ang maharlikang korona at ginawa siyang reyna kapalit ni Vasti.
