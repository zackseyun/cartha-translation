base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: tl
  text: Minahal ng hari si Ester nang higit sa lahat ng babae. Nagtamo siya ng higit na paglingap at kagandahang-loob sa paningin ng hari[a] kaysa sa lahat ng birhen[b]. Kaya ipinutong ng hari sa ulo niya ang maharlikang korona at ginawa siyang reyna kapalit ni Vasti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong idyoma ay literal na “nagdala siya ng paglingap at kagandahang-loob sa harap niya.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo rito ay mas tiyak kaysa sa “mga babae” sa naunang pangungusap at tahasang tumutukoy sa mga birhen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Minahal
  rationale: Tuwirang ipinahahayag ng pandiwang אהב ang pag-ibig o pagmamahal; hindi ito pinalalabnaw bilang simpleng pagpabor.
- source_word: מִכָּל הַנָּשִׁים
  choice: nang higit sa lahat ng ibang babae
  rationale: Malinaw na inihahayag ang paghahambing, habang pinananatili ang pangkalahatang kahulugan ng נָשִׁים bilang mga babae.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: Nagtamo siya ng higit na paglingap at kagandahang-loob
  rationale: Ang 'nagtamo' ay natural na katumbas ng Hebreong idyoma na literal na 'nagdala.' Pinananatiling magkahiwalay ang חֵן bilang paglingap o pabor at חֶסֶד bilang mabuting-loob na pakikitungo.
- source_word: לְפָנָיו
  choice: sa paningin nito
  rationale: Natural na Filipino ito para sa idyomang literal na 'sa harap niya,' at ipinahihiwatig ang personal na pagtingin ng hari. Ginamit ang 'nito' upang malinaw na hari ang tinutukoy.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: kaysa sa lahat ng mga birhen
  rationale: Pinananatili ng 'mga birhen' ang mas tiyak na kahulugan ng בְּתוּלֹת at ang kaibahan nito sa naunang pangkalahatang 'mga babae.'
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: ipinutong ng hari ... ang maharlikang korona
  rationale: Ang 'maharlikang korona' ay natural at marangal na salin ng 'korona ng paghahari,' at ang 'ipinutong' ang karaniwang pandiwa para sa paglalagay ng korona sa ulo.
- source_word: וַיַּמְלִיכֶהָ
  choice: ginawa siyang reyna
  rationale: Malinaw na inilalahad ang causative na anyo ng מלך sa kontekstong tumutukoy sa isang babae.
- source_word: תַּחַת וַשְׁתִּי
  choice: kapalit ni Vasti
  rationale: Sa konteksto ng paghalili, ang תַּחַת ay nangangahulugang pumalit sa posisyon ng iba.
