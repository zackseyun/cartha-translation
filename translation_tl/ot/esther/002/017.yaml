translation_notes:
  register: Makabagong Filipino na natural at marangal ang himig. Ginamit ang 'paglingap at kagandahang-loob' upang maipakita ang dalawang magkaugnay ngunit magkahiwalay na pangngalan sa Hebreo. Pinanatili rin ang pagkakaiba ng pangkalahatang 'mga babae' at mas tiyak na 'mga birhen.'
