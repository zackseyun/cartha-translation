base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: tl
  text: Noong mga araw na iyon, habang nakaupo si Mardokeo sa pintuan ng hari, nagalit sina Bigtan at Teres, dalawang eunuko[a] ng hari na kabilang sa mga bantay ng pasukan. Sinikap nilang magtaas ng kamay[b] laban kay Haring Ahasuerus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal ng hari.” Maaari ring tumukoy ang salitang Hebreo sa mga opisyal ng hari sa mas malawak na diwa, bagaman malamang na “mga eunuko” ang kahulugan dito.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “iunat ang kamay laban sa”; ibig sabihin, lusubin o patayin ang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Nang mga araw na iyon
  rationale: Likas na pormulang Filipino para sa malawak na panahong tagpuan ng salaysay, nang hindi ito ginagawang mas tiyak kaysa sa Hebreo.
- source_word: יֹשֵׁב
  choice: nakaupo
  rationale: Pinananatili ang patuloy na kalagayang ipinahihiwatig ng participle at ang kongkretong tagpo sa pintuang-daan.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: sa pintuang-daan ng hari
  rationale: Pinananatili ang larawan ng tarangkahan o opisyal na lugar sa pasukan ng hari nang hindi idinaragdag ang salitang 'palasyo,' na hindi tahasang nasa teksto.
- source_word: קָצַף
  choice: nagalit
  rationale: Tuwirang katumbas na hindi nagpapalabis sa tindi; bagaman anyong isahan ang pandiwa sa Hebreo, nauuna ito sa tambalang simuno na sina Bigtan at Teres.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: mga eunuko ng hari
  rationale: Ang kongkreto at malamang na kahulugan sa konteksto ng maharlikang hukuman; inilalagay sa talababa ang mas malawak na posibilidad na 'mga opisyal ng hari.'
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: kabilang sa mga bantay ng pasukan
  rationale: Natural sa modernong Filipino at malinaw na inilalarawan ang kanilang tungkulin; ang literal na 'bungad' o 'threshold' ay tumutukoy sa lugar ng pagpasok.
- source_word: וַיְבַקְשׁוּ
  choice: Hinangad nilang
  rationale: Ipinahahayag ang sadyang layuning gumawa ng marahas na kilos nang hindi ipinapalagay na naisagawa na ang pagtatangka; malapit ito sa diwang 'hinanap/ninais' ng pandiwa.
- source_word: לִשְׁלֹחַ יָד
  choice: pagbuhatan ng kamay
  rationale: Pinananatili ang idyomatikong larawan ng Hebreo at ang bahagyang lawak ng kahulugan nito; nililinaw sa talababa na tumutukoy ito sa marahas na paglusob o pagpatay.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasuerus
  rationale: Transliterasyon ng pangalang Hebreo sa halip na palitan ito ng karaniwang historikal na pagkakakilanlang Xerxes.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kongkretong larawan ng pintuang-daan at ang idyomang “pagbuhatan ng kamay,” habang ipinaliwanag sa mga talababa ang mahahalagang alternatibong leksikal. Inilipat ang mga pananda ng talababa sa mga salitang talagang tinutukoy ng bawat paliwanag.
