translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Ester” at “Susa” ayon sa karaniwang anyong Filipino. Iniwasan ang arkaikong pananalita at ang pagdaragdag ng denominasyonal o teolohikal na interpretasyon.
