base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: tl
  text: Nang marinig ang utos ng hari at ang kaniyang kautusan, at nang matipon sa Susang tanggulan ang maraming dalaga sa ilalim ng pangangasiwa ni Hegai, kinuha rin si Ester at dinala sa palasyo ng hari, sa ilalim ng pangangasiwa ni Hegai, na tagapag-ingat ng mga babae.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר
  choice: utos
  rationale: Sa konteksto ng hari, tumutukoy ito sa isang opisyal na utos; mas tiyak at natural ito kaysa literal na “salita.”
- source_word: דָת
  choice: kautusan
  rationale: Ipinahihiwatig ng salita ang isang opisyal na atas o batas ng pamahalaan. Ang “kautusan” ay pormal ngunit malinaw sa karaniwang mambabasa.
- source_word: נְעָרוֹת
  choice: mga dalaga
  rationale: Tumutukoy ito sa mga batang babaeng nasa edad na maaaring mag-asawa. Natural sa Tagalog ang “mga dalaga” at hindi nito idinaragdag ang tahasang ideya ng pagkabirhen na wala sa mismong salita rito.
- source_word: רַבּוֹת
  choice: maraming
  rationale: Tuwiran at natural na katumbas ng pang-uri na naglalarawan sa mga dalaga.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Susang tanggulan
  rationale: Ang הַבִּירָה ay tumutukoy sa pinatibay na sentrong maharlika o kuta. Pinananatili ng “Susang tanggulan” ang pagkakaugnay ng pangalan ng lugar at ng royal citadel.
- source_word: אֶל יַד
  choice: sa pangangalaga ni
  rationale: Ang literal na “sa kamay ni” ay isang idyoma para sa pamamahala o kustodiya. Ang “sa pangangalaga ni” ay malinaw sa Tagalog nang hindi ginagawang kusang-loob ang sitwasyon.
- source_word: וַתִּלָּקַח
  choice: dinala
  rationale: 'Pinananatili nito ang pasibong papel ni Ester: ibang tao ang kumuha at nagdala sa kaniya. Hindi nito pinalalabis ang puwersa gaya ng “dinakip,” ngunit hindi rin ipinahihiwatig na siya ang nagpasiyang pumunta.'
- source_word: בֵּית הַמֶּלֶךְ
  choice: palasyo ng hari
  rationale: Literal itong “bahay ng hari,” ngunit sa konteksto ay ang maharlikang palasyo o kompleks. Ang “palasyo ng hari” ang likas at malinaw na salin sa modernong Tagalog.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: tagapag-ingat sa mga babae
  rationale: Malapit ito sa diwa ng participle na “nag-iingat/nagbabantay” at hindi ipinapalagay na mabait o mapagkalinga ang kaniyang tungkulin.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: Nang marinig ... at nang matipon
  rationale: Pinananatili ng magkatugmang mga sugnay na “nang” ang temporal na ayos at daloy ng Hebreong pangungusap.
