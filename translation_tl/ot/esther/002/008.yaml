revisions:
- from: Nang marinig ang utos ng hari at ang kaniyang kautusan, at nang matipon sa Susang tanggulan ang maraming dalaga sa pangangalaga ni Hegai, dinala rin si Ester sa palasyo ng hari, sa pangangalaga ni Hegai, na tagapag-ingat sa mga babae.
  to: Nang marinig ang utos ng hari at ang kaniyang kautusan, at nang matipon sa Susang tanggulan ang maraming dalaga sa ilalim ng pangangasiwa ni Hegai, kinuha rin si Ester at dinala sa palasyo ng hari, sa ilalim ng pangangasiwa ni Hegai, na tagapag-ingat ng mga babae.
  rationale: Nilinaw ang passive na “was taken” sa pamamagitan ng “kinuha rin si Ester,” at ginawang mas neutral at tumpak ang dalawang pagbanggit sa idyomang “sa kamay ni Hegai.” Hindi nagdagdag ng impormasyon tungkol sa antas ng puwersa, kusang-loob na pagsang-ayon, o anumang teolohikal na pagpapakahulugan.
