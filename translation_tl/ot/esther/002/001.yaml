  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito, nang humupa na ang galit ni Haring Ahasuerus, naalaala niya si Vasti, ang ginawa ni Vasti, at ang ipinasiya laban kay Vasti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Likas sa modernong Tagalog at malinaw na naghuhudyat ng kasunod na tagpo; pinananatili ang temporal na pormula ng Hebreo.
- source_word: כְּשֹׁךְ חֲמַת
  choice: nang humupa na ang galit
  rationale: Ipinahahayag ng שׁכך ang paghupa o pagkalma, samantalang ang חֵמָה ay matinding galit; natural ang pariralang ito sa salaysay.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuerus
  rationale: Karaniwang ayos sa Tagalog ang titulong 'Haring' bago ang pangalan, habang pinananatili ang kinagawiang transliterasyon.
- source_word: זָכַר
  choice: naalaala niya
  rationale: Tuwirang katumbas ng pandiwang nangangahulugang umalaala o isaisip.
- source_word: אֶת וַשְׁתִּי
  choice: si Vasti
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalan at ang pantukoy na 'si' para sa tiyak na tao.
- source_word: וְאֵת אֲשֶׁר עָשָׂתָה
  choice: ang ginawa nito
  rationale: Pinananatili ang payak na pagtukoy sa ginawa ni Vasti; nililinaw ng 'nito' ang reperensiya nang hindi nagdaragdag ng paliwanag.
- source_word: וְאֵת אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: ang ipinasiya laban dito
  rationale: Ipinahahayag ng pasibong נִגְזַר ang isang opisyal na pasiya, at pinananatili ng 'laban dito' ang masamang epekto ng עָלֶיהָ.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinili ang 'ipinasiya' kaysa mas teknikal na 'iniutos' o 'itinakda' upang mapanatili ang juridikal na diwa nang hindi labis na pinatitindi ito. Walang talababa sapagkat ang mga leksikal na alternatibo ay hindi lumilikha ng mahalagang ambiguwidad sa Tagalog.
