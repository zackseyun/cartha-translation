base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: tl
  text: na ipinatapon mula sa Jerusalem kasama ng mga ipinatapon na kasama ni Jeconias na hari ng Juda[a], na ipinatapon ni Nebucadnezar na hari ng Babilonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, maaaring tumukoy ang “na” kay Kis, na ninuno ni Mardokeo, sa halip na kay Mardokeo mismo, sapagkat ang pagpapatapon na kasama ni Jeconias ay naganap ilang salinlahi bago ang panahon ni Mardokeo.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: na
  rationale: Likas na pang-ugnay na panuring sa Tagalog; pinananatili nitong bukas ang ugnayan sa naunang tinutukoy.
- source_word: הָגְלָה
  choice: dinalang bihag
  rationale: Ipinahahayag ang sapilitang pagpapatapon at ang balintiyak na diwa ng pandiwa sa maikli at likas na Tagalog.
- source_word: מִירוּשָׁלַיִם
  choice: mula sa Jerusalem
  rationale: Tuwirang katumbas ng pang-ukol at pangalan ng lugar.
- source_word: עִם הַגֹּלָה
  choice: kasama ng mga bihag
  rationale: Itinuturing ang kolektibong pangngalan bilang pangkat ng mga taong ipinatapon, hindi bilang abstraktong kalagayan.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: na dinalang
  rationale: Pinananatili ang pag-uulit ng ugat na גלה at likas na ikinakabit sa kolektibong “mga bihag.”
- source_word: יְכָנְיָה
  choice: Jeconias
  rationale: Kinakatawan ang anyong Hebreo sa pangalang nakikilala at angkop sa tradisyong Filipino, nang hindi ito pinapalitan ng ibang anyo ng pangalan ng hari.
- source_word: מֶלֶךְ יְהוּדָה
  choice: hari ng Juda
  rationale: Karaniwan at malinaw na salin ng pariralang konstrakto.
- source_word: אֲשֶׁר הֶגְלָה
  choice: na dinalang bihag ni
  rationale: Nililinaw ang hari ng Babilonia bilang gumaganap sa sapilitang pagpapatapon habang inuulit ang pangunahing leksikal na diwa.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebucadnezar
  rationale: Karaniwang anyong Filipino ng pangalan at madaling makilala ng mga mambabasa.
- source_word: מֶלֶךְ בָּבֶל
  choice: hari ng Babilonia
  rationale: Likas at pamantayang salin sa modernong Filipino.
theological_decisions:
- issue: Tinutukoy ng unang sugnay na may אֲשֶׁר sa Esther 2:6
  choice: Sa pangunahing teksto, ang sugnay ay binabasang tumutukoy kay Mardokeo, ang pinakamalapit na tinutukoy sa daloy mula talata 5.
  alternative: Maaaring tumukoy ang sugnay kay Kis, ninuno ni Mardokeo, dahil ilang salinlahi ang pagitan ng pagpapatapon kay Jeconias at ng panahon ni Mardokeo.
  rationale: Sinusunod ng pangunahing teksto ang pinakamalapit na ugnayang panggramatika, ngunit hindi tahimik na nilulutas ang tunay na suliraning kronolohikal; inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “dinalang bihag” upang maging kongkreto ang sapilitang pagpapatapon at mapanatili ang pag-uulit ng גלה. Ang talata ay bahagi ng mahabang pangungusap mula sa naunang talata, kaya nagsisimula ito sa “na.”
