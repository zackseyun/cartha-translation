    rationale: Ang “naganap ang pagkakabihag kay Jeconias” ay maaaring unawaing siya ang binihag. Mas tumpak na tukuyin ang pagpapatapon na kasama ni Jeconias at ihambing ito sa panahon ni Mardokeo.
