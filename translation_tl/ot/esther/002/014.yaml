translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang “eunuko” at “concubina” bilang tiyak na mga katawagang pangkorte, at hindi ginawang tahasan ang seksuwal na pahiwatig na nananatiling di-tahas sa Hebreo.
