revisions:
- from: Sa gabi siya pumapasok sa hari[a], at sa umaga ay bumabalik siya sa ikalawang bahay ng mga babae[b], sa pangangalaga ni Shaasgaz, ang eunuko ng hari na namamahala sa mga concubina. Hindi na siya muling makapapasok sa hari maliban kung kinalugdan siya ng hari at ipinatawag siya sa pangalan.
  to: Sa gabi ay pumapasok siya sa hari[a], at sa umaga ay bumabalik siya sa ikalawang bahay ng mga babae[b], sa pangangalaga ni Shaashgaz, ang eunuko ng hari na tagapangasiwa ng mga konkubina. Hindi na siya muling papasok sa hari maliban kung kinalugdan siya ng hari at tinawag siya sa pangalan.
