source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: tl
  text: Sa gabi ay pumapasok siya sa hari[a], at sa umaga ay bumabalik siya sa ikalawang bahay ng mga babae[b], sa pangangalaga ni Shaashgaz, ang eunuko ng hari na tagapangasiwa ng mga konkubina. Hindi na siya muling papasok sa hari maliban kung kinalugdan siya ng hari at tinawag siya sa pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pumasok sa hari” ay idyomang Hebreo para sa pagpasok sa silid o presensiya ng hari; ipinahihiwatig ng konteksto ang pakikipagtalik ngunit hindi ito tahasang sinasabi.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin na “ikalawang harem.” Literal sa Hebreo: “ikalawang bahay ng mga babae.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: Sa gabi siya pumapasok
  rationale: Ipinapahayag ng parirala ang takdang oras at ang paulit-ulit na kaayusan para sa bawat babae. Ang “pumapasok” ay likas sa Filipino at pinananatili ang di-tahasang idyoma ng Hebreo.
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: at sa umaga ay bumabalik siya
  rationale: Tuwirang pinananatili ang pagkakasunod ng gabi at umaga at ang kahulugan ng שׁוב na “bumalik.”
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: ikalawang bahay ng mga babae
  rationale: Pinananatili ang literal na estruktura at ang pagkakaiba nito sa unang tirahan ng mga babae; ang “ikalawang harem” ay mas interpretatibo.
- source_word: אֶל יַד שַׁעֲשְׁגַז
  choice: sa pangangalaga ni Shaasgaz
  rationale: Ang idyomang “sa kamay ni” ay tumutukoy sa pagiging nasa pangangalaga o pamamahala ng isang tao.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: ang eunuko ng hari
  rationale: Sa konteksto ng korte ng Persia, malamang na ang סריס ay tumutukoy sa isang eunuko, hindi lamang sa isang opisyal.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: na namamahala sa mga concubina
  rationale: Ang participle ay nagsasaad ng pag-iingat o pamamahala. Mas natural sa modernong Filipino ang “namamahala sa” kaysa sa literal na “tagapag-ingat ng.”
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: Hindi na siya muling makapapasok sa hari
  rationale: Pinananatili ang idyomang “pumasok sa hari” at ang diwa ng muling pagpasok, nang hindi ginagawang mas tahas ang seksuwal na implikasyon kaysa sa Hebreo.
- source_word: כִּי אִם חָפֵץ בָּהּ הַמֶּלֶךְ
  choice: maliban kung kinalugdan siya ng hari
  rationale: Ang חפץ ב־ ay maaaring mangahulugang malugod, masiyahan, o magnasa sa isang tao. Ang “kinalugdan” ay nagpapanatili sa lawak ng kahulugan nang hindi ito nililimitahan sa seksuwal na pagnanasa.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: at ipinatawag siya sa pangalan
  rationale: Likas na Filipino para sa pormal at tiyak na pagpapatawag sa kaniya, habang pinananatili ang detalye na siya ay tinawag sa pangalan.
