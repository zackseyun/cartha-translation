translation:
  language: tl
  text: Hindi ibinunyag ni Ester ang kanyang mga kababayan at ang kanyang angkan[a], sapagkat inutusan siya ni Mardokeo na huwag itong ibunyag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinagmulan ng kanyang pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa pagkakamag-anak, angkan, o lugar na pinagmulan; dito, malamang na tumutukoy ito sa pinagmulan ni Ester sa pamilya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: hindi sinabi
  rationale: Ang Hifil ng נגד ay nangangahulugang ipaalam o sabihin. Likas sa modernong Tagalog ang “hindi sinabi” at ang naunang-pangyayaring diwa ay sapat nang ipinahihiwatig ng konteksto.
- source_word: עַמָּהּ
  choice: kanyang bayan
  rationale: Ang עַם ay tumutukoy sa pangkat-etniko o sambayanang kinabibilangan niya. Pinananatili ng “bayan” ang kolektibong diwa nang hindi ito nililimitahan sa legal na pagkamamamayan.
- source_word: מוֹלַדְתָּהּ
  choice: kanyang angkan
  rationale: Maaaring tumukoy ang מוֹלֶדֶת sa pagkakamag-anak, lahi, o pinagmulan. Sa pagkakatambal nito sa “bayan,” malinaw at likas na ipinahahayag ng “angkan” ang pinagmulan sa pamilya nang hindi lubusang inuulit ang unang termino.
- source_word: צִוָּה עָלֶיהָ
  choice: iniutos sa kanya
  rationale: Malakas ang puwersa ng צוה bilang pag-uutos; natural na isinasalin sa Tagalog ang pariralang may עַל bilang “iniutos sa kanya.”
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: na huwag niya itong sabihin
  rationale: Ibinibigay ng sugnay ang nilalaman ng utos. Ang “ito” ay tumutukoy sa kanyang bayan at angkan, at ang pag-uulit ng “sabihin” ay tumutugma sa pag-uulit ng pandiwang נגד sa Hebreo.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Ginamit ang karaniwang anyo ng pangalan sa mga saling Bibliya sa Tagalog.
- source_word: מָרְדֳּכַי
  choice: Mardokeo
  rationale: Ginamit ang pamilyar at matagal nang kinikilalang anyo ng pangalan sa Tagalog.
