translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Susan,” “Mardokeo,” “Simei,” at “Cis” bilang mga anyong pangalang pamilyar sa tradisyong biblikal sa Filipino. Inayos ang huling parirala bilang “mula sa lipi ni Benjamin” upang maging natural nang hindi nawawala ang tribong tinutukoy.
