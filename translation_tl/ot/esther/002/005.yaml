base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: tl
  text: May isang lalaking Judio[a] sa tanggulan ng Susan[b]. Ang pangalan niya ay Mardokeo, na anak ni Jair, na anak ni Simei, na anak ni Cis[c], at mula sa lipi ni Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang lalaking taga-Juda.”
    reason: lexical_alternative
  - marker: b
    text: O “sa Susan, ang tanggulan.”
    reason: lexical_alternative
  - marker: c
    text: Sa mga talaangkanan, ang Hebreong “anak” ay maaari ring tumukoy sa isang inapo o sa mas malayong kaugnayan sa angkan.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: isang lalaking Judio
  rationale: Maaaring tumukoy ang יְהוּדִי sa isang Judio o sa isang taga-Juda. Sa konteksto ng mga Judiong nasa Persia, likas at malinaw sa modernong Filipino ang “Judio” bilang pagkakakilanlan ng bayan, habang pinananatili sa talababa ang heograpikong posibilidad.
- source_word: הָיָה
  choice: May
  rationale: Ginagamit dito ang הָיָה upang magpakilala ng tauhan sa salaysay. Ang “May isang…” ang natural na eksistensiyal na panimula sa Filipino.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: sa Susan na tanggulan
  rationale: Ang שׁוּשַׁן ay Susan, at ang הַבִּירָה ay ang pinatibay na sentrong maharlika o tanggulan. Pinananatili ng parirala ang appositional na anyo ng Hebreo nang hindi ipinapalagay na ang buong lungsod at ang tanggulan ay ganap na magkapareho.
- source_word: וּשְׁמוֹ
  choice: Ang pangalan niya ay
  rationale: Natural at marangal itong paraan sa Filipino ng pagpapatuloy sa pagpapakilala ng tauhan.
- source_word: מָרְדֳּכַי
  choice: Mardokeo
  rationale: Ginamit ang anyong pangalan na pamilyar sa tradisyong biblikal sa Filipino.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: anak ni Jair, na anak ni Simei, na anak ni Cis
  rationale: Pinananatili ang literal na genealogical na “anak,” ngunit nililinaw sa talababa na maaari rin itong tumukoy sa mas malayong ninuno.
- source_word: אִישׁ יְמִינִי
  choice: mula sa lipi ni Benjamin
  rationale: Tumutukoy ang parirala sa ugnayang pantribo kay Benjamin. Mas natural at madaling maunawaan sa modernong Filipino ang “mula sa lipi ni Benjamin” kaysa sa isang hiniram na katawagang etniko.
