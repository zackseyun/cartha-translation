base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: tl
  text: Nang siyasatin ang usapin at mapatunayang totoo ito, kapwa sila ibinitin sa isang puno.[a] At isinulat ito sa aklat ng mga tala ng mga pangyayari sa harap ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “inulos sa isang tulos.” Literal na sinasabi ng Hebreo na “ibinitin sa isang puno/kahoy,” ngunit maaaring pag-ulos o pampublikong pagsasabit ang paraan ng pagbitay sa kontekstong Persiano.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: Nang siyasatin ang bagay
  rationale: Ipinahahayag ng pasibong anyo ang pormal na pagsisiyasat sa iniulat na sabwatan. Natural sa modernong Filipino ang pariralang ito at nananatili ang diwang panghukuman.
- source_word: וַיִּמָּצֵא
  choice: at mapatunayang totoo
  rationale: Sa konteksto, napatunayang totoo ang iniulat na balak. Ginagawang malinaw ng salin ang ipinahihiwatig na resulta ng Hebreo nang hindi nagdaragdag ng detalye.
- source_word: וַיִּתָּלוּ
  choice: ibinitin
  rationale: Ang תלה ay pangunahing tumutukoy sa pagbibitin o pagsasabit. Hindi nito tiyak na itinatakda kung pagbigti, pag-ulos, o pampublikong pagbitin ang pamamaraang Persiano, kaya pinanatili ang mas malawak na salin.
- source_word: שְׁנֵיהֶם
  choice: kapwa sila
  rationale: Likas at malinaw itong katumbas ng tahasang pagtukoy sa dalawang nagsabwatan.
- source_word: עַל עֵץ
  choice: sa isang kahoy
  rationale: Ang עֵץ ay maaaring mangahulugang puno, kahoy, o isang estrukturang yari sa kahoy. Sa konteksto ng pagbitay, ang 'isang kahoy' ay malapit sa anyo ng Hebreo at hindi ipinapalagay ang tiyak na pamamaraan.
- source_word: וַיִּכָּתֵב
  choice: At isinulat ito
  rationale: Pinananatili nito ang pasibong diwa ng כתב at malinaw na tumutukoy sa pangyayaring itinala.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: sa aklat ng mga pangyayari
  rationale: Tumutukoy ang parirala sa opisyal na talaan ng mga kaganapan sa kaharian. Ang saling ito ay natural at madaling maunawaan sa Filipino.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: sa harap ng hari
  rationale: Ito ang tuwirang katumbas ng 'sa harapan/presensiya ng hari' at pinananatili ang larawan ng talaang ginawa o binasa sa presensiya niya.
