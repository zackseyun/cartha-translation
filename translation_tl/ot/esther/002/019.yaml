  text: וּ/בְ/הִקָּבֵ֥ץ בְּתוּל֖וֹת שֵׁנִ֑ית וּ/מָרְדֳּכַ֖י יֹשֵׁ֥ב בְּ/שַֽׁעַר הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: tl
  text: Nang tipunin sa ikalawang pagkakataon[a] ang mga dalagang birhen, nakaupo si Mardokeo sa tarangkahan ng hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muli.” Literal sa Hebreo, “sa ikalawang pagkakataon.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tarangkahan ng hari” ay malamang na tumutukoy sa pook ng tarangkahan ng palasyo, na kaugnay ng paglilingkod sa pamahalaan at pangangasiwa.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: Nang tipunin
  rationale: Ang waw na sinusundan ng preposisyon at infinitive construct ay nagpapakilala ng sugnay na temporal. Pinananatili ng pasibong “tipunin” ang Niphal ng קבץ, at likas sa modernong Tagalog ang “Nang” sa ganitong salaysay.
- source_word: בְּתוּלוֹת
  choice: ang mga dalagang birhen
  rationale: Tiyak na tumutukoy ang salita sa mga birhen, hindi lamang sa mga kabataang babae. Nililinaw ng “dalagang birhen” ang katayuang ipinahihiwatig ng Hebreo habang nananatiling madaling maunawaan.
- source_word: שֵׁנִית
  choice: sa ikalawang pagkakataon
  rationale: Tuwirang pinananatili nito ang kahulugang “sa ikalawang pagkakataon”; ang posibleng mas maikling saling “muli” ay inilagay sa talababa.
- source_word: וּמָרְדֳּכַי
  choice: si Mardokeo
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang Mordecai.
- source_word: יֹשֵׁב
  choice: nakaupo
  rationale: Ang Qal participle ay naglalarawan ng nagpapatuloy na kalagayan; ang “nakaupo” ay angkop na natural na katumbas sa konteksto.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: sa tarangkahan ng hari
  rationale: Ang שַׁעַר ay maaaring tumukoy hindi lamang sa mismong pintuan kundi sa buong pook ng tarangkahan. Ang “sa” ay natural sa Tagalog at hindi pinipilit ang mas makitid na lokasyong “loob.”
