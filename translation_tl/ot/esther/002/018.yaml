  - severity: low
    issue: Maaaring malabo ang alternatibong “kapatawaran sa mga lalawigan” sa talababa.
    rationale: Ang lexical na posibilidad ay remission ng mga obligasyon, hindi kinakailangang personal na pagpapatawad. Ang mas tahasang banggit sa obligasyon ay nagpapanatili ng kahulugan nang hindi nagtatakda kung anong obligasyon ito.
