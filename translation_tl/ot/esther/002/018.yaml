  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: tl
  text: Pagkatapos, nagdaos ang hari ng isang malaking handaan para sa lahat ng kanyang mga pinuno at mga lingkod—ang handaan ni Ester. Nagkaloob siya ng ginhawa sa mga lalawigan[a] at nagbigay ng mga regalo ayon sa pagkabukas-palad ng hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagdeklara siya ng araw ng pahinga para sa mga lalawigan,” o “nagkaloob siya ng pagpapatawad sa mga obligasyon ng mga lalawigan.” Ang salitang Hebreo ay maaaring tumukoy sa pahinga, ginhawa, o pagpapatawad sa isang obligasyon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ayon sa kamay ng hari”—isang idyoma para sa bukas-palad na pagbibigay o sa antas na nararapat sa isang hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: isang malaking handaan
  rationale: Ang מִשְׁתֶּה ay isang piging o handaang may inuman; ang “malaking handaan” ay natural, marangal, at angkop sa maharlikang konteksto.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: para sa lahat ng kanyang mga pinuno at mga lingkod
  rationale: Ang שָׂרִים ay tumutukoy sa matataas na pinuno o opisyal, samantalang pinananatili ng “mga lingkod” ang malawak na diwa ng עֲבָדִים nang hindi labis na tinutukoy ang kanilang tungkulin.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: ang handaan ni Ester
  rationale: Likas itong salin ng pariralang konstrukto at pinananatiling bukas kung ang handaan ay para sa karangalan ni Ester o natatanging kaugnay sa kanya.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: Nagkaloob siya ng ginhawa sa mga lalawigan
  rationale: Maaaring mangahulugan ang הֲנָחָה ng pahinga, ginhawa, o kapatawaran/pagpapatawad sa obligasyon. Ang “ginhawa” ay nagpapanatili sa lawak ng kahulugan nang hindi ipinapalagay na tiyak itong pista opisyal o pagpapatawad ng buwis.
- source_word: מַשְׂאֵת
  choice: mga regalo
  rationale: Sa kontekstong ito, tumutukoy ito sa mga ipinagkaloob ng hari; malinaw at sapat na malawak ang “mga regalo.”
- source_word: כְּיַד הַמֶּלֶךְ
  choice: ayon sa kagandahang-loob ng hari
  rationale: Ang literal na “ayon sa kamay ng hari” ay isang idyoma para sa antas ng maharlikang kakayahan o kasaganaan; ipinahahayag ng “kagandahang-loob” ang likas na diwa nito sa Filipino.
- source_word: וַיַּעַשׂ
  choice: nagdaos
  rationale: Bagaman literal na “gumawa,” ang “nagdaos” ang natural na pandiwang Filipino para sa pag-oorganisa o pagho-host ng isang handaan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nagdaos,” “handaan,” at “kagandahang-loob” bilang natural na pananalita, habang pinanatili sa talababa ang tunay na kalabuan ng הֲנָחָה at ang literal na larawan ng idyomang כְּיַד הַמֶּלֶךְ.
