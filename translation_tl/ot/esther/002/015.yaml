base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: tl
  text: Nang dumating ang pagkakataon ni Ester—ang anak ni Abihail, na tiyuhin ni Mardokeo, at kinupkop ni Mardokeo bilang sarili niyang anak[a]—upang humarap sa hari, wala siyang hiniling kundi kung ano ang sasabihin ni Hegai, ang eunuko[b] ng hari na tagapangasiwa sa mga babae. At nagkamit si Ester ng pagsang-ayon mula sa lahat ng nakakakita sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inaring anak.” Ang idyomang Hebreo ay nangangahulugang tinanggap ni Mardokeo si Ester sa kanyang pangangalaga bilang anak; hindi nito kinakailangang tukuyin ang isang pormal na legal na pag-aampon.
    reason: lexical_alternative
  - marker: b
    text: Sa ilang konteksto, ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa isang opisyal ng palasyo, ngunit mas malamang dito ang tiyak na kahulugang “eunuko” dahil siya ang tagapangasiwa sa mga babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Nang dumating ang pagkakataon
  rationale: Ang pariralang may infinitive ay temporal, at ang תֹּר ay tumutukoy sa nakatakdang pagkakataon o turno ni Ester. Mas natural sa modernong Tagalog ang “pagkakataon” kaysa “turno” sa marangal na salaysay.
- source_word: דֹּד
  choice: tiyuhin
  rationale: Sa konteksto at ayon sa naunang tala ng ugnayan ng pamilya, si Abihail ang tiyuhin ni Mardokeo. Pinananatili ng “tiyuhin” ang tiyak na ugnayang ito.
- source_word: לָקַח לוֹ לְבַת
  choice: kinupkop ni Mardokeo bilang sarili niyang anak
  rationale: Ipinahahayag ng idyoma ang pagtanggap kay Ester sa pangangalaga bilang anak, nang hindi iginigiit na nagkaroon ng pormal na legal na pag-aampon.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: upang humarap sa hari
  rationale: Natural itong paglalarawan ng pagpasok sa presensiya ng hari at hindi nito ginagawang mas tahasan kaysa sa Hebreo ang ipinahihiwatig ng tagpo.
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: wala siyang hiniling kundi
  rationale: Malinaw na ipinakikita ng konstruksiyon na walang ibang hiniling si Ester maliban sa itinakda o ipinayo ni Hegai.
- source_word: אֲשֶׁר יֹאמַר
  choice: ang ipinayo
  rationale: Bagaman literal na “ang sasabihin,” ipinahihiwatig ng konteksto na si Hegai ang nagbibigay ng tagubilin tungkol sa dapat dalhin o gamitin. Ang “ipinayo” ay natural ngunit hindi nagdaragdag ng tiyak na bagay na hindi binanggit sa teksto.
- source_word: סְרִיס
  choice: eunuko
  rationale: Ito ang karaniwang tiyak na kahulugan ng salita at angkop sa konteksto ng mga silid ng kababaihan sa palasyo; hindi ito pinalalabo bilang pangkalahatang “opisyal.”
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: tagapangasiwa sa mga babae
  rationale: Malinaw at likas sa modernong Tagalog ang paglalarawan sa tungkulin ni Hegai nang hindi nagpapahiwatig na siya lamang ay bantay.
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן
  choice: kinalugdan si Ester
  rationale: Ipinahahayag nito ang Hebreong idyoma ng pagtatamo o pagtataglay ng pabor sa natural at marangal na Tagalog.
- source_word: בְּעֵינֵי כָּל רֹאֶיהָ
  choice: ng lahat ng nakakita sa kanya
  rationale: Natural na katumbas ito ng idyomang “sa paningin ng” at pinananatili ang saklaw na lahat ng nakakita kay Ester.
