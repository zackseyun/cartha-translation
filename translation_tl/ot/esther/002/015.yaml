revisions:
- from: Nang dumating ang pagkakataon ni Ester—na anak ni Abihail na tiyuhin ni Mardokeo, at kinupkop ni Mardokeo bilang sarili niyang anak[a]—upang humarap sa hari, wala siyang hiniling kundi ang ipinayo ni Hegai, ang eunuko[b] ng hari na tagapangasiwa sa mga babae. At kinalugdan si Ester ng lahat ng nakakita sa kanya.
  to: Nang dumating ang pagkakataon ni Ester—ang anak ni Abihail, na tiyuhin ni Mardokeo, at kinupkop ni Mardokeo bilang sarili niyang anak[a]—upang humarap sa hari, wala siyang hiniling kundi kung ano ang sasabihin ni Hegai, ang eunuko[b] ng hari na tagapangasiwa sa mga babae. At nagkamit si Ester ng pagsang-ayon mula sa lahat ng nakakakita sa kanya.
  rationale: Pinalitan ang mas interpretatibong “ang ipinayo” ng “kung ano ang sasabihin” upang mapanatili ang saklaw ng Hebreong pandiwa nang hindi isinasara ang kontekstuwal na implikasyon nito. Pinalitan din ang “kinalugdan si Ester” ng “nagkamit si Ester ng pagsang-ayon” upang mas malinaw na maihatid ang Hebreong idiom ng pagtatamo ng pabor at ang patuloy na pagtingin ng mga nakakakita sa kanya.
