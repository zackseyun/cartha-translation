  naturalness: Marangal at nauunawaan ang rehistro. Nilinaw ang mga pang-ugnay sa mahabang pagpapakilala kay Ester at ginawang mas natural ang huling pangungusap nang hindi isinasantabi ang Hebreong idiom.
  terminology: Ang “eunuko” at “tagapangasiwa sa mga babae” ay angkop sa konteksto. Pinanatili ang “kinupkop ... bilang sarili niyang anak,” na hindi nagpapalagay ng pormal na legal na pag-aampon.
