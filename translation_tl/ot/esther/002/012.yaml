  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: tl
  text: 'Nang dumating ang turno ng bawat dalaga upang pumaroon kay Haring Ahasuerus, matapos siyang sumailalim sa loob ng labindalawang buwan sa itinakdang kaayusan para sa mga babae—sapagkat sa ganitong paraan nakukumpleto ang mga araw ng kanilang pagpapaganda: anim na buwan sa langis ng mira, at anim na buwan sa mga mababangong sangkap at mga pampaganda para sa mga babae—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: pagkakataon
  rationale: Tumutukoy sa nakatakdang turno o pagkakataon ng bawat dalaga; natural sa modernong Tagalog ang “dumating na ang pagkakataon” sa kontekstong ito.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: pumaroon kay Haring Ahasuerus
  rationale: Pinananatili ang payak na diwa ng paglapit o pagpunta sa hari nang hindi dinaragdagan ang talata ng tahasang seksuwal na kahulugan.
- source_word: כְּדָת הַנָּשִׁים
  choice: ang itinakdang paghahanda para sa mga babae
  rationale: Ang דָּת ay tuntunin o itinakdang kaayusan; ayon sa kasunod na paliwanag, saklaw nito ang panahon at proseso ng paghahanda.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: panahon ng kanilang pagpapaganda
  rationale: Ang מְרוּקִים ay tumutukoy sa mga paggamot o gamit na pampaganda/paglilinis; ang saling ito ay malinaw at likas sa Tagalog.
- source_word: שֶׁמֶן הַמֹּר
  choice: langis ng mira
  rationale: Tuwirang katumbas ng oil of myrrh; pinananatili ang tradisyonal at kinikilalang katawagang “mira.”
- source_word: בְּשָׂמִים
  choice: mga pabango
  rationale: Sa konteksto ng paghahanda sa katawan, ang salita ay tumutukoy sa mababangong sangkap o spices; “mga pabango” ang mas natural na pangkalahatang salita.
- source_word: תַמְרוּקֵי הַנָּשִׁים
  choice: iba pang pampaganda para sa mga babae
  rationale: Iniiwasan ang paulit-ulit na tunog habang pinananatili ang hiwalay na kategorya mula sa mababangong sangkap; ipinahihiwatig ng “iba pang” na kasama pa ito sa ikalawang anim na buwan.
theological_decisions:
- issue: Kahulugan ng pagparoon sa hari
  choice: pumaroon kay Haring Ahasuerus
  alternative: sumiping kay Haring Ahasuerus
  rationale: Hindi tahasang sinasabi ng Hebreo sa talatang ito ang pakikipagtalik. Pinananatili ng napiling salin ang pagkukubli at tensiyon ng orihinal sa halip na ipaliwanag ito sa mismong teksto.
- issue: Kalikasan ng “tuntunin para sa mga babae”
  choice: itinakdang paghahanda para sa mga babae
  alternative: kautusan para sa mga babae
  rationale: Ang konteksto ay administratibong proseso ng paghahanda, hindi isang teolohikal o moral na kautusan; nililinaw ito nang hindi nagdaragdag ng denominasyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mahabang pangungusap at pangwakas na gatlang dahil nagpapatuloy ang kaisipan sa susunod na talata. Ginamit ang “dalaga” para sa נַעֲרָה at ang karaniwang anyong “Ahasuerus” para sa pangalan ng hari.
