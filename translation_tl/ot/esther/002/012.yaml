revisions:
- from: 'Kapag dumating na ang pagkakataon ng bawat dalaga na pumaroon kay Haring Ahasuerus, matapos niyang sundin sa loob ng labindalawang buwan ang itinakdang paghahanda para sa mga babae—sapagkat ganito kinukumpleto ang panahon ng kanilang pagpapaganda: anim na buwan na gumagamit ng langis ng mira, at anim na buwan na gumagamit ng mga pabango at iba pang pampaganda para sa mga babae—'
  to: 'Nang dumating ang turno ng bawat dalaga upang pumaroon kay Haring Ahasuerus, matapos siyang sumailalim sa loob ng labindalawang buwan sa itinakdang kaayusan para sa mga babae—sapagkat sa ganitong paraan nakukumpleto ang mga araw ng kanilang pagpapaganda: anim na buwan sa langis ng mira, at anim na buwan sa mga mababangong sangkap at mga pampaganda para sa mga babae—'
  rationale: Inayos ang pandiwa at sintaks upang maipahayag na ang bawat dalaga ay dumaan sa nakatakdang labindalawang-buwang kaayusan. Inalis ang di-nakasulat na "iba pang," ginawang mas tiyak ang "turno," at pinanatiling bukas ang "pumaroon kay Haring Ahasuerus," gaya ng di-tahasang pananalita ng Hebreo. Pinanatili ang pangwakas na gatlang dahil hindi pa tapos ang pangungusap sa talatang ito.
