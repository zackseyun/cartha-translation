  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga kabataang lalaki ng hari na naglilingkod sa kanya, “Maghanap sila para sa hari ng mga dalagang birhen na magaganda ang anyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng pangyayari.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: mga kabataang lalaki ng hari
  rationale: Pinananatili nito ang pangunahing kahulugan ng נַעַר at ang pagkakaiba nito sa kasunod na מְשָׁרְתָיו, na tahasang nagsasaad ng paglilingkod.
- source_word: מְשָׁרְתָיו
  choice: na naglilingkod sa kanya
  rationale: Isinasalin ang participle bilang likas na sugnay na naglalarawan sa personal nilang paglilingkod sa hari.
- source_word: יְבַקְשׁוּ
  choice: Maghanap sila
  rationale: Pinananatili ang aktibong anyo at di-tiyak na pangmaramihang simuno ng Hebreo, pati ang diwa ng mungkahi o utos.
- source_word: לַמֶּלֶךְ
  choice: para sa hari
  rationale: Tuwirang ipinahahayag ang dative ng kapakinabangan o layunin nang walang idinadagdag na interpretasyon.
- source_word: נְעָרוֹת
  choice: mga dalaga
  rationale: Sa kontekstong kasama ng בְּתוּלוֹת, ang “mga dalaga” ay natural at marangal na tawag sa mga kabataang babaeng nasa gulang nang mapangasawa.
- source_word: בְּתוּלוֹת
  choice: birhen
  rationale: Pinananatili ang tiyak na pagtukoy sa kawalan ng karanasang seksuwal sa halip na palambutin ang salita.
- source_word: טוֹבוֹת מַרְאֶה
  choice: magaganda ang anyo
  rationale: Malapit ito sa literal na idyomang “mabuti ang anyo” ngunit natural sa modernong Tagalog at tahasang tumutukoy sa pisikal na kaakit-akit na anyo.
