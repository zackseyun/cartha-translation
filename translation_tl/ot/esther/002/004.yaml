base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: tl
  text: At ang dalagang makalugod sa hari[a] ay maging reyna kapalit ni Vasti[b]. Nalugod ang hari sa panukalang ito[c], at ginawa niya ang gayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “maging kaaya-aya sa paningin ng hari.” Literal sa Hebreo: “maging mabuti sa mga mata ng hari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “maghari kapalit ni Vasti.”'
    reason: lexical_alternative
  - marker: c
    text: O “Naging mabuti sa paningin ng hari ang bagay na ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: ang dalaga
  rationale: Ang נַעֲרָה ay tumutukoy sa isang batang babae o kabataang babae. Natural at marangal sa modernong Filipino ang “dalaga” sa kontekstong ito, nang hindi gumagamit ng masyadong batang pahiwatig ng “batang babae.”
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: makalugod sa hari
  rationale: Ang idyomang Hebreo ay literal na “maging mabuti sa mga mata ng hari” at nangangahulugang maging kalugod-lugod ayon sa pasiya ng hari. Pinananatili ng “makalugod sa hari” ang diwang ito sa natural na Filipino.
- source_word: תִּמְלֹךְ
  choice: maging reyna
  rationale: Literal na tumutukoy ang pandiwa sa paghahari, ngunit sa konteksto ng pagpili ng hahalili kay Vasti, malinaw at natural sa Filipino ang “maging reyna,” na ipinahihiwatig ng pambabaeng anyo at ng salaysay.
- source_word: תַּחַת וַשְׁתִּי
  choice: kapalit ni Vasti
  rationale: Dito, ang תַּחַת ay nagsasaad ng paghalili, hindi ng lokasyong “sa ilalim.” Ang “kapalit ni Vasti” ang pinakanatural at malinaw na katumbas.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: Nalugod ang hari sa panukalang ito
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, bagay, usapin, o panukala. Dahil mungkahing hakbang ang naunang sinabi, ang “panukalang ito” ang malinaw na kahulugan; ang inuulit na idyoma ay isinaling “nalugod ang hari.”
- source_word: וַיַּעַשׂ כֵּן
  choice: kaya ginawa niya iyon
  rationale: Natural na salin ito ng pormulang nagsasabing isinagawa ng hari ang iminungkahing hakbang. Ang “kaya” ay malinaw na nag-uugnay sa pagsang-ayon at pagkilos nang hindi dinaragdagan ang diwa.
