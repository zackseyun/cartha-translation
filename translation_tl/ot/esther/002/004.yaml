translation_notes:
  register: Modernong Filipino na natural, dignified, at madaling maunawaan. Ginamit ang “dalaga” at “maging reyna” para sa malinaw na salaysay, habang inilagay sa mga talababa ang mas literal na mga anyo at ang idyomang Hebreo. Ang pangalan ay binaybay na “Vasti,” ayon sa karaniwang anyong Filipino.
