base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: tl
  text: 'Ganito ang pagpunta ng dalaga sa hari: anumang hilingin niya ay ibinibigay sa kanya upang isama niya sa pagpunta mula sa bahay ng mga babae hanggang sa bahay ng hari.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “anumang sabihin niya” o “lahat ng sabihin niya.” Literal na “anumang sabihin niya” ang Hebreo, ngunit sa konteksto ay tumutukoy ito sa mga bagay na hinihiling niyang isama.
    reason: lexical_alternative
  - marker: b
    text: Ang “bahay ng mga babae” ay pormal na salin ng Hebreong pananalita; tumutukoy ito sa tirahan o mga silid na nakalaan para sa mga babae.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: At ganito
  rationale: Ipinakikilala nito ang paraang o pamamaraang inilarawan sa konteksto; natural at maikli ang “At ganito” sa Filipino.
- source_word: הַנַּעֲרָה
  choice: ang dalaga
  rationale: Tumutukoy ang salita sa isang batang babae o kabataang babae. Ang “dalaga” ay likas at marangal sa kontekstong ito nang hindi gumagamit ng makalumang pananalita.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: pumupunta sa hari
  rationale: Karaniwang nangangahulugan ang בוא na pumunta o lumapit. Ginamit ang aspektong pangkaugalian upang tumugma sa paglalarawan ng regular na pamamaraan.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: anumang sabihin niya
  rationale: Pinananatili nito ang literal na pandiwang “sabihin,” habang ipinahihiwatig ng konteksto na tumutukoy ito sa anumang hingin niya. Ipinaliwanag sa talababa ang kontekstuwal na kahulugan.
- source_word: יִנָּתֵן לָהּ
  choice: ay ibinibigay sa kanya
  rationale: Ang anyong Hebreo ay pasibo at may pangkaugalian o pamamaraang diwa rito; ipinapahayag iyon ng “ibinibigay.”
- source_word: לָבוֹא עִמָּהּ
  choice: upang dalhin
  rationale: Literal itong may diwang “upang sumama sa pagpasok niya.” Sa Filipino, malinaw at natural ang “upang dalhin” para sa mga bagay na ibinigay upang sumama sa kanya.
- source_word: מִבֵּית הַנָּשִׁים
  choice: mula sa bahay ng mga babae
  rationale: Pormal nitong pinananatili ang Hebreong larawan at iniiwasang ipasok sa pangunahing teksto ang mas interpretatibong salitang “harem.”
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: hanggang sa bahay ng hari
  rationale: Pinananatili nito ang literal na “bahay ng hari” at ang hangganang ipinahihiwatig ng עַד, sa halip na agad itong gawing “palasyo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Pinanatili ang pormal na “bahay ng mga babae” at “bahay ng hari” upang manatiling malapit sa Hebreo, habang nililinaw sa talababa ang kahulugang pangkultura. Ang kasalukuyang aspektong “pumupunta” at “ibinibigay” ay nagpapakita ng pangkalahatang pamamaraang sinusunod, hindi lamang ng isang natatanging pangyayari.
