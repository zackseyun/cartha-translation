base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: tl
  text: At dinala si Ester kay Haring Ahasuero[a], sa kaniyang maharlikang palasyo, sa ikasampung buwan, na siyang buwan ng Tebet[b], sa ikapitong taon ng kaniyang paghahari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kinuha si Ester at dinala kay Haring Ahasuero.” Pasibo ang pandiwa sa Hebreo, na nagbibigay-diin na si Ester ang ginawan ng kilos.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang buwan ng Tebet,” ang pangalang Babilonio para sa ikasampung buwan.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: dinala
  rationale: 'Pinananatili ang diwang pasibo ng Niphal: si Ester ang ginawan ng kilos at hindi ang nagpasimula nito. Mas natural sa makabagong Filipino ang “dinala” kaysa sa lantad na pasibong “kinuha,” na maaari ring magpahiwatig ng pag-agaw.'
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuero
  rationale: Ginagamit ang karaniwang ayos ng titulo at pangalan sa Filipino at ang nakasanayang anyong Tagalog ng pangalan.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: sa maharlikang palasyo nito
  rationale: Ang literal na “bahay ng kanyang paghahari/kaharian” ay tumutukoy sa tirahang maharlika ng hari. Malinaw at natural ang “maharlikang palasyo,” at ang “nito” ay tahasang tumutukoy sa hari.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: nang ikasampung buwan
  rationale: Natural na panandang temporal sa Filipino na tapat sa bilang ng buwan sa Hebreo.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: ang buwan ng Tebet
  rationale: Pinananatili ang paliwanag na ang ikasampung buwan ay may pangalang Tebet.
- source_word: טֵבֵת
  choice: Tebet
  rationale: Transliterasyon sa baybay na madaling bigkasin ng mambabasang Filipino.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: noong ikapitong taon ng paghahari niya
  rationale: Likas na Filipino para sa pormula ng taon ng paghahari, habang pinananatili ang eksaktong kronolohiya.
