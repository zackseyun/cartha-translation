  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pasibong pagganap kay Ester sa pamamagitan ng “dinala,” at gumamit ng gitling upang likas na maipaloob ang paliwanag sa pangalan ng buwan.
