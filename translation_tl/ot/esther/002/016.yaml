revisions:
- from: Kaya dinala si Ester sa Haring Ahasuero[a], sa maharlikang palasyo nito, nang ikasampung buwan—ang buwan ng Tebet[b]—noong ikapitong taon ng paghahari niya.
  to: At dinala si Ester kay Haring Ahasuero[a], sa kaniyang maharlikang palasyo, sa ikasampung buwan, na siyang buwan ng Tebet[b], sa ikapitong taon ng kaniyang paghahari.
  rationale: Inayos ang mga panandang temporal at panghalip upang maging mas natural at tiyak sa Filipino, habang pinanatili ang pasibong pagkilos kay Ester, ang pagkakasunod ng mga parirala sa pinagmulan, at ang dalawang umiiral na talababa.
