base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: tl
  text: Pinalalaki ni Mardokeo si Hadasa—siya rin si Ester—na anak ng tiyuhin ni Mardokeo, sapagkat wala siyang ama ni ina. Maganda ang pangangatawan ng dalaga at kaakit-akit ang kanyang anyo. Nang mamatay ang kanyang ama at ina, kinuha siya ni Mardokeo bilang sarili niyang anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maaari ring isalin, “inampon siya ni Mardokeo bilang anak.” Sa mas literal na Hebreo, “kinuha siya ni Mardokeo para sa kanyang sarili bilang anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: nagpalaki
  rationale: Ipinapahayag ng participle ang patuloy na papel ni Mardokeo sa pag-aaruga at pagpapalaki kay Ester. Likas sa modernong Tagalog ang “nagpalaki” at kaayon ito ng kasunod na pahayag na kinuha niya si Ester bilang anak.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Hadasa—na siya ring si Ester
  rationale: Pinananatili ang dalawang pangalan at malinaw na ipinakikilalang iisang tao ang tinutukoy ng mga ito.
- source_word: בַּת דֹּדוֹ
  choice: anak ng kanyang tiyuhin
  rationale: Pinananatili ang tahasang katawagang pampamilya ng Hebreo sa halip na isalin lamang ang hinuha nitong “pinsan.”
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: sapagkat wala na siyang ama at ina
  rationale: Tuwirang pinananatili ang pagbanggit sa parehong magulang; ang “wala na” ay natural na Tagalog at ipinahihiwatig ng kasunod na sugnay na namatay sila.
- source_word: הַנַּעֲרָה
  choice: dalaga
  rationale: Angkop sa batang babaeng nasa konteksto ng pagpili para sa hari at mas natural kaysa sa makalumang “birhen” o sa mas batang tunog ng “batang babae.”
- source_word: יְפַת תֹּאַר
  choice: maganda ang hubog ng katawan
  rationale: Inilalarawan ng parirala ang kagandahan ng anyo o pangangatawan. Malinaw itong ibinubukod sa kasunod na paglalarawan ng panlabas na anyo.
- source_word: טוֹבַת מַרְאֶה
  choice: kaakit-akit ang kanyang anyo
  rationale: Inihahatid nito ang kaaya-ayang panlabas na hitsura habang pinananatili ang dalawang bahaging paglalarawan sa Hebreo.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: Nang mamatay ang kanyang ama at ina
  rationale: Natural na ipinahahayag sa Tagalog ang temporal na kalagayang tinutukoy ng Hebreong parirala.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: kinuha siya ni Mardokeo bilang sarili niyang anak
  rationale: Malapit ito sa literal na “kinuha niya para sa kanyang sarili bilang anak” at hindi nagpapasok ng tiyak na makabagong legal na proseso ng pag-aampon.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw at marangal ang himig. Ginamit ang karaniwang anyong Filipino ng mga pangalan: Hadasa, Ester, at Mardokeo. Pinanatili ang tahasang ugnayang pampamilya at ang dalawang magkaugnay ngunit hindi ganap na magkaparehong paglalarawan sa kagandahan ni Ester.'
