base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: tl
  text: Nang malaman ni Mardokeo[a] ang bagay na iyon, sinabi niya ito kay Reyna Ester, at sinabi naman ni Ester sa hari na si Mardokeo ang pinagmulan ng balita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang ipaalam kay Mardokeo.” Maaaring idiin ng pasibong anyo sa Hebreo na nalaman niya ang bagay o na may isang taong nagpaalam nito sa kaniya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pangalan ni Mardokeo”; ibig sabihin, ipinahayag ni Ester na kay Mardokeo nagmula ang ulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: Nang malaman
  rationale: Ipinahahayag nito sa natural na Filipino na ang bagay ay nakarating sa kaalaman ni Mardokeo, nang hindi tinutukoy kung sino ang nagbalita sa kaniya.
- source_word: הַדָּבָר
  choice: ang bagay na iyon
  rationale: Malawak ang kahulugan ng דָּבָר; tinutukoy nito rito ang balak na nabanggit sa naunang talata nang hindi tahasang pinapalitan ng mas interpretatibong 'sabuwatan.'
- source_word: לְמָרְדֳּכַי
  choice: ni Mardokeo
  rationale: Sa natural na kayarian ng Filipino na 'malaman ni Mardokeo,' si Mardokeo ang taong nakaalam, katumbas ng tungkulin ng ל sa Hebreong pasibong pahayag.
- source_word: וַיַּגֵּד
  choice: sinabi niya ito
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o mag-ulat; malinaw at karaniwan ang 'sinabi niya ito' sa salaysay.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: kay Reyna Ester
  rationale: Natural na modernong Filipino ang titulo bago ang pangalan at pinananatili nito ang katayuan ni Ester bilang reyna.
- source_word: וַתֹּאמֶר ... לַמֶּלֶךְ
  choice: sinabi naman ni Ester sa hari
  rationale: Direktang sinasalamin nito ang אמר at ang taong pinagsabihan; ipinakikita rin ng 'naman' ang sunod na paghahatid ng impormasyon.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: na si Mardokeo ang pinagmulan ng balita
  rationale: Ipinahahayag sa malinaw at natural na Filipino na iniulat ni Ester ang impormasyon bilang nagmula kay Mardokeo. Nasa talababa ang mas pormal at literal na anyo.
theological_decisions: []
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Iniwasan ang sobrang literal na 'sa pangalan ni Mardokeo' sa pangunahing teksto dahil maaari itong maging malabo sa ordinaryong mambabasa, ngunit pinanatili ito sa talababa. Ang pangalan ay isinaling 'Mardokeo,' ang karaniwang anyong Filipino.
