  text: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם מָרְדֳּכַי֙ מִתְהַלֵּ֔ךְ לִ/פְנֵ֖י חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים לָ/דַ֨עַת֙ אֶת שְׁל֣וֹם אֶסְתֵּ֔ר וּ/מַה יֵּעָשֶׂ֖ה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: tl
  text: Araw-araw, naglalakad-lakad si Mardokeo sa harap ng patyo ng tirahan ng mga babae upang malaman kung kumusta si Ester at kung ano ang gagawin sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל־יוֹם וָיוֹם
  choice: Araw-araw
  rationale: Natural na modernong Tagalog para sa distributibong idyomang Hebreo na nagbibigay-diin sa regular na pang-araw-araw na pagkilos.
- source_word: מִתְהַלֵּךְ
  choice: naglalakad-lakad
  rationale: Ipinahihiwatig ng anyong Hebreo ang paulit-ulit o pabalik-balik na paglalakad, hindi lamang isang pagdaan.
- source_word: בֵּית הַנָּשִׁים
  choice: tirahan ng mga babae
  rationale: Ang בַּיִת dito ay bahagi ng palasyo kung saan naninirahan ang mga babaeng nasa pangangalaga ng hari; mas malinaw sa Tagalog kaysa sa literal na 'bahay ng mga babae' nang hindi dinaragdagan ang teksto ng tiyak na katawagang institusyonal.
- source_word: אֶת־שְׁלוֹם אֶסְתֵּר
  choice: kung kumusta si Ester
  rationale: Ang שָׁלוֹם sa ganitong parirala ay tumutukoy sa kalagayan o kapakanan ng isang tao; ito ang likas na katumbas sa modernong Tagalog.
- source_word: וּמַה־יֵּעָשֶׂה בָּהּ
  choice: at kung ano ang gagawin sa kanya
  rationale: Pinananatili ang pasibong di-tiyak na diwa at ang tensiyon tungkol sa maaaring mangyari kay Ester.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang salaysay na imperpektibo bilang nakaugaliang pagkilos sa pamamagitan ng 'Araw-araw' at 'naglalakad-lakad,' at hindi nilinaw kung sino ang gagawa o kung ano ang magiging kapalaran ni Ester.
