base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: tl
  text: Nagustuhan niya ang dalaga, at nakamit nito ang kanyang pabor. Kaya agad niyang ibinigay sa kanya ang mga pampaganda at ang takdang bahagi niya, pati ang pitong dalagang angkop na ibigay sa kanya mula sa palasyo ng hari. Inilipat din niya ang dalaga at ang mga dalagang kasama niya sa pinakamagandang lugar sa tirahan ng mga babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa pinakamainam na bahagi ng tirahan ng mga babae.” Tinutukoy ng parirala ang isang higit na mabuting lugar sa loob ng tirahan ng mga babae sa palasyo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: ang dalaga
  rationale: Ang נַעֲרָה ay isang kabataang babae; natural at marangal sa konteksto ang “dalaga,” at hindi ito kasimbata ng maaaring ipahiwatig ng “batang babae.”
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: Nagustuhan niya
  rationale: Likas na katumbas sa Filipino ng idyomang literal na “naging mabuti sa kanyang mga mata,” nang hindi nagdaragdag ng romantiko o seksuwal na pahiwatig.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: nakamit nito ang kanyang pabor
  rationale: Sa konteksto ng palasyo, ang חֶסֶד ay tumutukoy sa pabor o mabuting pagtanggap. Pinananatili rin ng “nakamit” na ang dalaga ang tumanggap nito.
- source_word: וַיְבַהֵל
  choice: agad niyang ibinigay
  rationale: Ipinahahayag ng pandiwa ang pagmamadali; malinaw at natural na naihahatid ito ng “agad” habang pinananatili ang kilos na pagbibigay.
- source_word: תַּמְרוּקֶיהָ
  choice: mga pampaganda
  rationale: Tumutukoy ito sa mga kosmetiko o mga gamit sa pagpapaganda at paghahanda. Ang “mga pampaganda” ay malinaw sa karaniwang mambabasa nang hindi nililimitahan sa pamahid lamang.
- source_word: מָנוֹתֶיהָ
  choice: ang takdang bahagi nito
  rationale: Ang מָנוֹת ay mga bahaging inilaan, malamang pagkain o panustos. Pinananatili ng salin ang lawak ng salita sa halip na tukuying pagkain lamang.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: pitong angkop na dalaga
  rationale: Ang mga ito ay kabataang babaeng itinakdang maglingkod sa kanya; ang “angkop” ay tumutugma sa הָרְאֻיוֹת nang hindi nagdaragdag ng isang pormal na proseso ng pagpili.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: mula sa palasyo ng hari
  rationale: Bagaman literal na “bahay ng hari,” ang “palasyo” ang natural na tawag sa institusyonal na tahanan ng hari sa kontekstong ito.
- source_word: וַיְשַׁנֶּהָ
  choice: Inilipat din niya
  rationale: Maaaring tumukoy ang pandiwa sa pagbabago o paglilipat. Sa kasunod na pariralang tumutukoy sa mas mabuting lugar, ang paglilipat ang pinakanatural na kahulugan, ngunit binabanggit sa talababa ang posibleng diin sa pinabuting kalagayan.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: sa pinakamagandang lugar sa tirahan ng mga babae
  rationale: Ipinahihiwatig ng parirala ang higit na mabuting bahagi o puwesto sa loob ng tirahan ng mga babae. Ang saling ito ay malinaw at hindi gumagamit ng mas interpretibong terminong “harem.”
