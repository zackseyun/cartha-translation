revisions:
- from: Nagustuhan niya ang dalaga, at nakamit nito ang kanyang pabor. Kaya agad niyang ibinigay dito ang mga pampaganda at ang takdang bahagi nito, pati ang pitong angkop na dalagang ibinigay dito mula sa palasyo ng hari. Inilipat din niya ang dalaga at ang mga kasama nito sa pinakamagandang lugar sa tirahan ng mga babae.[a]
  to: Nagustuhan niya ang dalaga, at nakamit nito ang kanyang pabor. Kaya agad niyang ibinigay sa kanya ang mga pampaganda at ang takdang bahagi niya, pati ang pitong dalagang angkop na ibigay sa kanya mula sa palasyo ng hari. Inilipat din niya ang dalaga at ang mga dalagang kasama niya sa pinakamagandang lugar sa tirahan ng mga babae.[a]
  rationale: Nilinaw ang maramihang pitong dalaga at ang kaugnayan nilang ibibigay sa dalaga, habang pinananatili ang pagkakaiba ng pangunahing tauhan at ng mga kabataang babaeng kasama niya. Inayos din ang talababa upang ipakita lamang ang ligtas na leksikal na alternatibo para sa nakahihigit na bahagi ng tirahan.
