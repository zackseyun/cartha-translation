translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nito” para sa dalaga upang maiwasan ang kalituhan sa mga panghalip na “niya” sa sunod-sunod na pagtukoy kay Hegai at kay Esther. Ang “tirahan ng mga babae” ay mas malinaw at hindi gaanong interpretibo kaysa “harem.”
