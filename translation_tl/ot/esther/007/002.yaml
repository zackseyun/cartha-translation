    rationale: Isinasalin ng Hebreo ang lokasyon o tagpuan na “sa piging ng alak,” hindi ang kilos na “habang nag-iinuman.” Ang kasalukuyang salita ay nagdaragdag din ng isang plural na kalahok na hindi isinasaad ng teksto.
  - severity: low
    issue: Hindi na angkop ang talababa a kapag ginamit ang “sa piging ng alak.”
    rationale: Kung ang mismong salin ay ang literal na parirala, inuulit lamang ng talababa ang teksto at wala nang ibinibigay na alternatibong leksikal.
