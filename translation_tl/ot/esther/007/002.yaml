base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: tl
  text: Muli, noong ikalawang araw, sinabi ng hari kay Reyna Esther sa piging ng alak, “Ano ang iyong kahilingan, Reyna Esther? Ipagkakaloob ito sa iyo. At ano ang iyong hinihiling? Kahit hanggang kalahati ng kaharian[b], matutupad ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ang pananalitang “hanggang kalahati ng kaharian” ay nakasanayang pahayag ng hari na nagpapakita ng pambihirang paglingap; hindi ito kinakailangang literal na alok na hatiin ang kaharian.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: rin ... nang ikalawang araw
  rationale: Pinananatili ng “rin” ang pagpapatuloy mula sa naunang piging, at tuwirang isinasalin ng “nang ikalawang araw” ang temporal na parirala.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: habang nag-iinuman sa piging
  rationale: Natural sa modernong Tagalog at malinaw na ipinahihiwatig ang piging na nakasentro sa pag-inom ng alak, nang hindi ginagawang malamya ang literal na “piging ng alak.”
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: Ano ang iyong kahilingan
  rationale: Ang “kahilingan” ay angkop sa pormal at makaharing tagpo at nagpapahayag ng bagay na hinihingi.
- source_word: וְתִנָּתֵן לָךְ
  choice: Ipagkakaloob iyon sa iyo
  rationale: Mas natural kaysa literal na “ibibigay,” habang pinananatili ang puwersa ng tugon ng hari sa isang pormal na kahilingan.
- source_word: בַּקָּשָׁתֵךְ
  choice: iyong hinihiling
  rationale: Pinananatili ang bahagyang baryasyon mula sa “kahilingan” nang hindi nagpapahiwatig ng tiyak na pagkakaibang semantiko na hindi malinaw sa Hebreo.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Hanggang kalahati ng kaharian
  rationale: Malapit sa anyo ng Hebreo at hindi idinaragdag ang “aking,” na wala sa teksto.
- source_word: וְתֵעָשׂ
  choice: gagawin iyon
  rationale: Natural na Tagalog para sa resultang katuparan ng hinihiling; hindi nito tinutukoy kung sino ang mismong magsasagawa.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Reyna Esther
  rationale: Karaniwang ayos ng titulo at pangalan sa modernong Tagalog, habang pinananatili ang marangal na pagtukoy.
