revisions:
- from: At sinabi rin ng hari kay Esther nang ikalawang araw, habang nag-iinuman sa piging[a], “Ano ang iyong kahilingan, Reyna Esther? Ipagkakaloob iyon sa iyo. Ano ang iyong hinihiling? Hanggang kalahati ng kaharian[b]—gagawin iyon.”
  to: Muli, noong ikalawang araw, sinabi ng hari kay Reyna Esther sa piging ng alak, “Ano ang iyong kahilingan, Reyna Esther? Ipagkakaloob ito sa iyo. At ano ang iyong hinihiling? Kahit hanggang kalahati ng kaharian[b], matutupad ito.”
  rationale: Pinalitan ang pandiwang paglalarawan ng pag-inom ng tuwirang “sa piging ng alak,” upang tumugma sa Hebreo at maiwasan ang idinagdag na kilos. Inayos ang ayos ng panahon at pahayag para sa likas ngunit marangal na Tagalog. Inalis ang labis na talababa a, habang pinanatili ang mahalagang paliwanag sa nakaugaliang makaharing alok.
