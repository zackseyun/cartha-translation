  text: וַ/יֹּ֣אמֶר חַ֠רְבוֹנָה אֶחָ֨ד מִן הַ/סָּרִיסִ֜ים לִ/פְנֵ֣י הַ/מֶּ֗לֶךְ גַּ֣ם הִנֵּה הָ/עֵ֣ץ אֲשֶׁר עָשָׂ֪ה הָמָ֟ן לְֽ/מָרְדֳּכַ֞י אֲשֶׁ֧ר דִּבֶּר ט֣וֹב עַל הַ/מֶּ֗לֶךְ עֹמֵד֙ בְּ/בֵ֣ית הָמָ֔ן גָּבֹ֖הַּ חֲמִשִּׁ֣ים אַמָּ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ תְּלֻ֥/הוּ עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: tl
  text: At sinabi ni Harbona, isa sa mga eunukong naglilingkod sa harap ng hari, “Narito rin ang bitayang[a] ginawa ni Haman para kay Mardokeo, na nagsalita para sa ikabubuti ng hari.[b] Nakatayo iyon sa bahay ni Haman at limampung siko ang taas.” Sinabi ng hari, “Bitayin siya sa bitayang iyan.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kahoy” o “punongkahoy”; dito ay tumutukoy sa isang estrukturang kahoy na ginagamit sa pagpatay, na tradisyonal na isinasaling “bitayan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “nagsalita nang mabuti tungkol sa hari” o “nagsalita nang pabor sa hari.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “Ituhog siya rito.” Ang terminong Hebreo ay maaaring tumukoy nang mas malawak sa pagsasabit o paglalagay ng katawan sa isang estrukturang kahoy, hindi lamang sa pagbigti sa isang makabagong bitayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Harbona
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalan.
- source_word: הַסָּרִיסִים
  choice: mga eunuko
  rationale: Tuwirang kahulugan sa konteksto ng maharlikang korte, bagaman maaari rin itong tumukoy nang mas malawak sa mga opisyal ng palasyo.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: naglilingkod sa harap ng hari
  rationale: Ipinahahayag ang pagdalo at paglilingkod sa presensiya ng hari sa natural na Filipino.
- source_word: גַּם הִנֵּה
  choice: Naroon din
  rationale: Pinananatili ang dagdag na impormasyon at ang pagtawag-pansin, nang hindi gumagamit ng di-likas na literalismong gaya ng 'masdan' sa usapang ito.
- source_word: הָעֵץ
  choice: bitayan
  rationale: Literal na 'punongkahoy/kahoy,' ngunit sa salaysay ay isang estrukturang kahoy para sa pagpatay. Ang 'bitayan' ay malinaw at tradisyonal, habang inilalahad sa talababa ang mas malawak na kahulugan.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: ipinagawa ... para kay Mardokeo
  rationale: 'Ang causative na diwa ay natural sa konteksto: si Haman ang nagpagawa ng estruktura para gamitin laban kay Mardokeo.'
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: nagsalita para sa ikabubuti ng hari
  rationale: Pinananatili ang kapaki-pakinabang na diwa ng sinabi ni Mardokeo nang hindi labis na tinutukoy ang eksaktong pangyayari.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: Nakatayo iyon sa bahay ni Haman
  rationale: Inilalarawan ang kasalukuyang kalagayan at lokasyon ng estruktura sa malinaw na Filipino.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: limampung siko ang taas
  rationale: Pinananatili ang sinaunang yunit na 'siko' bilang pormal at makasaysayang katumbas ng cubit.
- source_word: תְּלֻהוּ עָלָיו
  choice: Bitayin siya roon
  rationale: Natural na utos sa Filipino at malinaw ang pagtukoy sa nabanggit na estruktura; ang posibleng mas malawak na paraang pagbitin o pagtuhog ay inilalagay sa talababa.
