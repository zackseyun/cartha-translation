  - severity: low
    issue: “Bitayin siya roon”
    rationale: Ang עָלָיו ay tumutukoy sa nabanggit na estrukturang kahoy (“sa/dito sa ibabaw nito”), samantalang ang “roon” ay tumutukoy lamang sa lugar at maaaring lumabo ang antecedent.
