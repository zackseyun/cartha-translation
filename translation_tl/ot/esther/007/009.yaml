revisions:
- from: At sinabi ni Harbona, isa sa mga eunukong naglilingkod sa harap ng hari, “Naroon din ang bitayang[a] ipinagawa ni Haman para kay Mardokeo, na nagsalita para sa ikabubuti ng hari.[b] Nakatayo iyon sa bahay ni Haman at limampung siko ang taas.” Sinabi ng hari, “Bitayin siya roon.”[c]
  to: At sinabi ni Harbona, isa sa mga eunukong naglilingkod sa harap ng hari, “Narito rin ang bitayang[a] ginawa ni Haman para kay Mardokeo, na nagsalita para sa ikabubuti ng hari.[b] Nakatayo iyon sa bahay ni Haman at limampung siko ang taas.” Sinabi ng hari, “Bitayin siya sa bitayang iyan.”[c]
  rationale: Pinalitan ang di-tiyak na causative na “ipinagawa” ng “ginawa,” alinsunod sa payak na pandiwang Hebreo. Pinalitan din ang “roon” ng “sa bitayang iyan” upang malinaw na maipahayag ang pagtukoy ng utos sa mismong estruktura. Ang ibang mga salita at talababa ay pinanatili, na may maliit na pagsasaayos sa talababa c upang tumugma sa mas malinaw na antecedent.
