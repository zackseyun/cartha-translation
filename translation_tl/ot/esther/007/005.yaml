base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Haring Ahasuerus kay Reyna Esther, “Sino siya, at nasaan siya[a]—ang nangahas[b] na gawin ito?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, bagaman hindi gaanong malamang, “at alin siya?” kung ang parirala ay tanong kung aling tao ang tinutukoy sa halip na kung nasaan siya.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “pinuno ang kanyang puso upang gawin ito,” isang idyomang nangangahulugang naglakas-loob o nangahas siyang gumawa ng gayong bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng magkakaugnay na pandiwa ang salaysay. Hindi kailangang ulitin sa Filipino ang dalawang anyo ng ‘sinabi,’ na idiomatiko sa Hebreo ngunit magiging mabigat sa Tagalog.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuerus
  rationale: Ito ang natural na ayos ng titulo at pangalan sa modernong Filipino, habang pinananatili ang transliterasyon ng pangalan.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: kay Reyna Esther
  rationale: Natural sa Filipino ang titulo bago ang pangalan; katumbas ito ng Hebreong aposisyon na ‘kay Esther na reyna.’
- source_word: מִי הוּא זֶה
  choice: Sino siya
  rationale: Pinananatili ang tuwirang tanong tungkol sa pagkakakilanlan nang hindi idinaragdag ang ‘lalaki,’ na wala sa Hebreo.
- source_word: וְאֵי זֶה הוּא
  choice: at nasaan siya
  rationale: Karaniwang lokatibo ang אֵי, kaya ang pangunahing diwa ay pagtatanong kung nasaan ang taong tinutukoy. Itinatala sa talababa ang posibleng tanong tungkol sa pagtukoy kung alin ang tao.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: ang nangahas
  rationale: Ang literal na larawang ‘pinuno ang kanyang puso’ ay isang Hebreong idyoma para sa pagkakaroon ng kapangahasang gumawa ng isang bagay. Ang ‘nangahas’ ang malinaw at natural na katumbas sa Filipino.
- source_word: לַעֲשׂוֹת כֵּן
  choice: na gawin ito
  rationale: Tumutukoy ang כֵּן sa banta na kababanggit lamang; natural at tiyak sa Filipino ang ‘gawin ito.’
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang natural na ‘Reyna Esther’ at ang idyomatikong ‘nangahas,’ habang inilalahad sa mga talababa ang literal na Hebreong larawan at ang tunay na alternatibong pagbasa.
