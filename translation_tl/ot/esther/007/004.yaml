base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: tl
  text: Sapagkat ipinagbili kami—ako at ang aking bayan—upang lipulin, patayin, at puksain. Kung ipinagbili lamang sana kami bilang mga aliping lalaki at mga aliping babae, nanahimik sana ako; sapagkat hindi makababawi ang kaaway sa pinsala sa hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap tiyakin ang eksaktong diwa ng huling bahagi sa Hebreo. Maaari rin itong isalin, “sapagkat hindi katumbas ng kaaway ang pagkalugi ng hari,” o unawain na ang gayong usapin ay hindi sana sapat upang abalahin ang hari. Ang salitang isinaling “pinsala” ay maaaring tumukoy sa kapinsalaan o pagkalugi ng hari.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: ipinagbili kami
  rationale: Pinananatili nito ang pasibong diwa at ang talinghagang pangkalakalan ng מכר, na mahalaga sa paghahambing sa literal na pagbebenta bilang mga alipin.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Ang עַם ay tumutukoy sa pangkat etniko o pambansang kinabibilangan ni Esther; natural at marangal sa Filipino ang “aking bayan.”
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: upang lipulin, patayin, at puksain
  rationale: Pinananatili ang tatlong magkakasunod na pandiwang halos magkasingkahulugan at ang kanilang matinding retorikal na puwersa. Dahil malinaw na “kami” ang layon, natural sa Filipino ang aktibong pawatas na may ipinahihiwatig na tagaganap.
- source_word: וְאִלּוּ
  choice: Kung ... lamang sana
  rationale: 'Ipinahahayag nito ang salungat-sa-katotohanang kondisyon: hindi sila ipinagbili lamang sa pagkaalipin kundi itinakdang patayin.'
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: bilang mga aliping lalaki at mga aliping babae
  rationale: Tahasan nitong pinananatili ang pagkakaiba ng panlalaki at pambabaeng anyo at hindi pinapalambot ang sapilitang kalagayan bilang simpleng paglilingkod.
- source_word: הֶחֱרַשְׁתִּי
  choice: mananahimik ako
  rationale: Natural na Filipino ito para sa hipotetikal na resulta ng kundisyon at pinananatili ang diwang hindi sana magsasalita si Esther.
- source_word: הַצָּר
  choice: ang kaaway
  rationale: Tumutukoy ito sa taong kumakalaban o nagdudulot ng kapighatian, sa konteksto ay kay Haman. Mas karaniwan sa modernong Filipino ang “kaaway” kaysa “kalaban sa hukuman,” habang hindi labis na nililimitahan ang kahulugan.
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: hindi kayang tumbasan ... ang pinsala sa hari
  rationale: Pinananatili ng “tumbasan” ang pangunahing diwa ng שׁוה na pagkakapantay o katumbas na halaga, at ng “pinsala” ang malawak na saklaw ng נזק—maaaring pagkalugi, kapinsalaan, o iba pang masamang epekto sa hari.
