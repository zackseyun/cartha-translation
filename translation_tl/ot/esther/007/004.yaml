  register: Gumamit ng moderno, dignificado, at madaling maunawaang Filipino. Pinanatili ang matinding tatluhang pahayag at ang tahasang wika ng pagkaalipin. Inilagay sa talababa ang tunay na leksikal at sintaktikong kalabuan ng huling sugnay sa halip na tahimik na pumili ng iisang interpretasyon.
