  to: Sapagkat ipinagbili kami—ako at ang aking bayan—upang lipulin, patayin, at puksain. Kung ipinagbili lamang sana kami bilang mga aliping lalaki at mga aliping babae, nanahimik sana ako; sapagkat hindi makababawi ang kaaway sa pinsala sa hari.[a]
