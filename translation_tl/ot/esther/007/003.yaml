translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pananalita sa korte. Ginamit ang ‘inyong’ bilang magalang na isahan, at pinanatili ang pormal na pagbanggit ni Esther sa hari sa ikatlong panauhan.
