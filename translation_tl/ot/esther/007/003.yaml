base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: tl
  text: Sumagot si Reyna Esther, “Kung nakatagpo ako ng lingap sa inyong paningin, Mahal na Hari, at kung kalugud-lugod sa hari, ipagkaloob nawa sa akin ang aking buhay ayon sa aking kahilingan, at ang aking bayan ayon sa aking pakiusap.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן אֶסְתֵּר הַמַּלְכָּה וַתֹּאמַר
  choice: Sumagot si Reyna Esther
  rationale: Ang pares na ‘sumagot at nagsabi’ ay karaniwang pormula sa salaysay na Hebreo; sapat at mas natural sa modernong Tagalog ang ‘sumagot,’ samantalang pinananatili ng ‘Reyna Esther’ ang titulong maharlika.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Kung nakatagpo ako ng lingap sa inyong paningin
  rationale: Pinananatili ng ‘lingap’ ang magalang na diwa ng חֵן at ng ‘sa inyong paningin’ ang larawan ng idyomang Hebreo, sa paraang nauunawaan pa rin sa pormal na pananalita.
- source_word: הַמֶּלֶךְ
  choice: Mahal na Hari
  rationale: Ginagawang likas sa magalang na pananalitang Tagalog ang bokatibong pagtawag sa hari nang hindi ipinapasok ang ‘aking hari,’ na wala sa Hebreo.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: at kung ito'y kalugud-lugod sa hari
  rationale: Natural na katumbas ito ng idyomang nagsasaad na ang hinihiling ay mabuti o katanggap-tanggap sa hari, habang pinananatili ang ikatlong-panauhang katawagan ng pananalita sa korte.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: ibigay nawa sa akin ang aking buhay
  rationale: Pinananatili ng ‘ibigay nawa’ ang pasibong/pakiusap na anyo ng Hebreo. Ang נֶפֶשׁ ay tumutukoy rito sa buhay ni Esther, hindi sa ‘kaluluwa.’
- source_word: בִּשְׁאֵלָתִי
  choice: bilang tugon sa aking kahilingan
  rationale: Ipinahahayag nito ang kahilingang ipinagkakaloob batay sa petisyon; mas malinaw sa kasalukuyang Tagalog kaysa sa literal ngunit alanganing ‘sa aking kahilingan.’
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: at ang aking bayan bilang tugon sa aking pakiusap
  rationale: Pinananatili ang paralelismo at ang bahagyang pagkakaiba ng שְׁאֵלָה at בַּקָּשָׁה sa pamamagitan ng ‘kahilingan’ at ‘pakiusap.’
