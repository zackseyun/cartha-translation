  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: tl
  text: Kaya, ibinitin nila si Haman sa kahoy na inihanda niya para kay Mardokeo.[a] At humupa ang matinding galit ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Itinarak nila si Haman sa tulos na inihanda niya para kay Mardokeo.” Ang salitang Hebreo para sa “kahoy” ay maaari ring tumukoy sa puno o tulos, at ang pandiwa ay mas malawak na nangangahulugang pagsasabit o pagbibitin. Hindi tiyak ang eksaktong paraan ng pagpatay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: ibinitin nila
  rationale: Ang תלה ay karaniwang nangangahulugang magsabit o magbitin. Pinananatili ng “ibinitin” ang lawak ng salitang Hebreo nang hindi tiyak na ipinapalagay kung pagbigti o pagtuhog ang paraan ng pagpatay.
- source_word: הָמָן
  choice: Haman
  rationale: Ginamit ang karaniwang anyo ng pangalan sa mga saling Tagalog.
- source_word: עַל הָעֵץ
  choice: sa kahoy
  rationale: Ang עֵץ ay maaaring mangahulugang puno, kahoy, o tulos. Ang “kahoy” ay tuwirang salin na hindi labis na nagtatakda sa eksaktong anyo ng kasangkapang pamuksa; inilalahad sa talababa ang mga posibleng pakahulugan.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: na inihanda niya para kay Mardokeo
  rationale: Natural sa modernong Tagalog at pinananatili ang kabalintunaang si Haman ang dumanas ng kapalarang inilaan niya kay Mardokeo.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: ang matinding galit ng hari
  rationale: Ang חֵמָה ay tumutukoy sa nag-aalab o matinding galit. Malinaw at dignified ang “matinding galit” sa kasalukuyang Tagalog.
- source_word: שָׁכָכָה
  choice: humupa
  rationale: Ang שׁכך ay nangangahulugang humupa, kumalma, o mawala ang tindi. Ang “humupa” ay natural na ginagamit para sa matinding galit.
