translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Pinili ang “ibinitin … sa kahoy” upang mapanatili ang leksikal na lawak at tunay na kalabuan ng Hebreo; iniwasan ang mas tiyak na “binitay sa bitayan,” na maaaring magpahiwatig ng pagbigti bilang tiyak na paraan.
