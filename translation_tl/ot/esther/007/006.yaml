  rationale: Inayos ang parirala tungkol kay Haman upang maging likas sa modernong Filipino, habang pinananatili ang dobleng paglalarawan na “kaaway at kalaban,” ang paghatol na “masamang,” ang demonstratibong “ito,” at ang pagkasindak ni Haman sa presensya ng hari at reyna. Ang pangkalahatang “lalaki/tao” sa Hebreo ay hindi kailangang tahasang ulitin sa Filipino dahil malinaw nang tinutukoy si Haman at magiging pilit ang literal na ayos.
