lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: ang lalaking kaaway at kalaban
  rationale: Pinananatili ang tahasang אִישׁ (‘lalaki’) at ang magkatambal na paglalarawan na צַר at אוֹיֵב, nang hindi pinag-iisa ang dalawang katawagan.
- source_word: הָמָן הָרָע הַזֶּה
  choice: itong masamang si Haman
  rationale: Natural sa modernong Tagalog at pinananatili ang diin ng demonstratibong הַזֶּה (‘itong’) at ng הָרָע (‘masamang’).
- source_word: נִבְעַת
  choice: nasindak
  rationale: Ipinahahayag ang biglaan at matinding pagkatakot o pagkagimbal na saklaw ng pandiwa.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: sa harap ng hari at ng reyna
  rationale: Tuwirang pinananatili ang eksenang si Haman ay nasindak sa presensya ng parehong hari at reyna.
