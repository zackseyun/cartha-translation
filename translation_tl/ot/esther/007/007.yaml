base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: tl
  text: At tumindig ang hari sa matinding galit, iniwan ang piging ng alak, at nagtungo sa hardin ng palasyo.[a] Ngunit nanatili si Haman upang magmakaawa kay Reyna Ester para sa kanyang buhay,[b] sapagkat nakita niyang ipinasiya na ng hari ang kapahamakang sasapit sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hardin ng pabilon” o “hardin ng kompleks ng palasyo.”
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “tumayo upang makiusap para sa kanyang buhay kay Ester na reyna.”'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nakita niyang ang kapahamakang laban sa kanya ay ganap nang napagpasiyahan ng hari.” Ipinahihiwatig ng Hebreong pananalita na tiyak na ang hatol ng hari laban kay Haman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: sa matinding galit
  rationale: Ipinahahayag ng חֵמָה ang nag-aalab at matinding galit. Natural sa modernong Tagalog ang “matinding galit” at hindi nito pinahihina ang tindi ng Hebreo.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: iniwan ang piging ng alak
  rationale: Ang מִשְׁתֶּה ay piging na kaugnay ng pag-inom; pinananatili ng “piging ng alak” ang tahasang pagbanggit sa alak. Isinama ang diwa ng מִן sa natural na salaysay na “iniwan.”
- source_word: גִּנַּת הַבִּיתָן
  choice: hardin ng palasyo
  rationale: Ang גִּנָּה ay hardin, at ang בִּיתָן ay maaaring tumukoy sa palasyo, pavilon, o gusali sa loob ng kompleks. “Hardin ng palasyo” ang pinakamalinaw sa karaniwang mambabasa, habang itinatala sa talababa ang alternatibo.
- source_word: עָמַד
  choice: nanatili
  rationale: 'Bagaman literal na “tumayo,” ipinakikita rito ng pandiwa ang kaibahan sa pag-alis ng hari: naiwan o nanatili si Haman upang makiusap. Ito ang natural na puwersang pansalaysay sa Tagalog.'
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: upang magmakaawa ... para sa kanyang buhay
  rationale: Idyoma itong tumutukoy sa paghiling o pagmamakaawa na iligtas ang sariling buhay. Ang salin ay natural at naghahayag ng desperasyon ni Haman.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: kay Reyna Ester
  rationale: Karaniwang nauuna sa pangalan ang titulong maharlika sa Tagalog; pinananatili nito ang parehong reperensiya.
- source_word: כִּי רָאָה
  choice: sapagkat nakita niyang
  rationale: Ang כִּי ay nagbibigay ng dahilan kung bakit nagmakaawa si Haman; malinaw at angkop sa marangal na salaysay ang “sapagkat.”
- source_word: כִּי כָלְתָה
  choice: ipinasiya na
  rationale: Sa konstruksyong ito, ang כלה ay nagpapahiwatig na buo at tiyak na ang pasiya. Ang “ipinasiya na” ay naghahatid ng pagiging pinal nito nang hindi labis na nagpapaliwanag.
- source_word: הָרָעָה
  choice: ang kapahamakang sasapit sa kanya
  rationale: Maaaring mangahulugan ang רָעָה ng kasamaan, pinsala, sakuna, o kapahamakan. Sa konteksto, ito ang masamang kahihinatnan o hatol na darating kay Haman; “kapahamakan” ang natural ngunit pinananatili sa talababa ang mas literal na anyo.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: ng hari
  rationale: Tinutukoy ng מֵאֵת ang pinagmulan o ahente. Kasama ng “ipinasiya,” natural sa Tagalog ang “ng hari.”
