translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “matinding galit” sa halip na mas arkaikong “poot,” at “piging” upang mapanatili ang pormal na tagpo sa korte. Inayos ang sugnay ng pagbangon at pag-alis upang maging malinaw sa Tagalog nang hindi inaalis ang sunod-sunod na kilos sa Hebreo.
