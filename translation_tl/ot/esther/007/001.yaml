lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kaya pumunta
  rationale: Ang wayyiqtol ng בוא ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “pumunta” para sa pagkilos patungo sa handaan, at ang “kaya” ay naghuhudyat ng kasunod na pangyayari nang hindi dinaragdagan ang kilos ng pandiwa.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang katumbas ng may-artikulong מֶלֶךְ; malinaw na sa konteksto kung sinong hari ang tinutukoy.
- source_word: וְהָמָן
  choice: at si Haman
  rationale: Pinanatili ang pang-ugnay at ginamit ang karaniwang panandang pantangi sa Tagalog.
- source_word: לִשְׁתּוֹת
  choice: upang uminom
  rationale: Ang infinitive construct ng שׁתה ay literal na “uminom.” Hindi idinagdag ang “alak” o pinalawak sa “magpista” sapagkat wala ang mga iyon sa mismong parirala.
- source_word: עִם
  choice: kasama ni
  rationale: Natural na Tagalog para sa pakikisama o accompaniment sa isang taong pinangalanan.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Reyna Ester
  rationale: Ang Hebreo ay literal na “Ester, ang reyna.” Mas natural sa Tagalog na ilagay ang titulo bago ang pangalan nang hindi binabago ang kahulugan.
