  source_fidelity: Kailangang ibalik ang tahasang pagtukoy sa “handaan ng alak,” na nasa Hebreo (בֵּית מִשְׁתֵּה הַיַּיִן). Ang “nakadapa” ay masyadong tiyak para sa נֹפֵל עַל־הַמִּטָּה, na naglalarawan kay Haman na bumabagsak o nakalugmok sa ibabaw ng higaan/sopa. Ang paratang ng hari ay dapat manatiling paratang at hindi magpahiwatig na napatunayang naganap ang panggagahasa.
  naturalness: Natural at marangal ang binagong Filipino. Ang “nakalugmok sa higaan” ay mas likas kaysa literal na “bumabagsak” ngunit hindi itinatakda ang eksaktong posisyon ng katawan. Ang “habang narito ako sa loob ng palasyo” ay malinaw na pagpapahayag ng עִמִּי בַּבָּיִת.
  terminology: Pinanatili ang “Ester,” ang karaniwang anyong Tagalog. Ginamit ang “higaan” para sa מִטָּה, na maaari ring maging sopa o higaan sa konteksto ng piging. Ang “gagahasain” ay nasa tuwirang pananalita ng galít na hari at naghahayag ng marahas na paratang nang hindi ito isinasalaysay bilang naganap na katotohanan.
