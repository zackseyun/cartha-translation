base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: tl
  text: Bumalik ang hari mula sa hardin ng palasyo patungo sa bulwagan ng handaan ng alak, at si Haman ay nakalugmok sa higaan kung saan naroon si Ester. Sinabi ng hari, “Gagahasain pa ba niya ang reyna habang narito ako sa loob ng palasyo?” Nang lumabas ang salita mula sa bibig ng hari, tinakpan nila ang mukha ni Haman.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: bulwagan ng handaan
  rationale: Literal itong “bahay ng handaan ng alak,” ngunit sa konteksto ay tumutukoy sa silid o bulwagang pinagdarausan ng piging. Likas sa modernong Tagalog ang “bulwagan ng handaan” nang hindi kinakailangang ulitin ang alak na malinaw na bahagi ng piging.
- source_word: נֹפֵל עַל־הַמִּטָּה
  choice: nakadapa ... sa higaan
  rationale: Ang participle na נֹפֵל ay naglalarawan kay Haman na bumabagsak o nakalugmok sa ibabaw ng muwebles habang nagsusumamo. Ipinahihiwatig ng “nakadapa” ang posisyon at kilos nang hindi ipinapalagay na aksidente lamang ang pagkabagsak.
- source_word: הַמִּטָּה
  choice: higaan
  rationale: Ang salita ay maaaring tumukoy sa higaan o sopa na ginagamit sa paghilig sa piging. Pinili ang karaniwang “higaan”; hindi nito nilulutas nang labis ang eksaktong anyo ng muwebles.
- source_word: לִכְבּוֹשׁ
  choice: pagtatangkaan niyang gahasain
  rationale: Pangunahing diwa nito ang manupil o puwersahang sakupin. Sa paratang ng hari tungkol sa reyna, malinaw ang seksuwal at marahas na pahiwatig; inilalahad ng “pagtatangkaang gahasain” ang akusasyon nang hindi sinasabing naganap na ito.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: tinakpan nila ang mukha ni Haman
  rationale: Bagaman pasibo o di-tiyak ang gumagawa sa Hebreo, natural sa Tagalog ang di-tiyak na maramihang “nila,” gaya ng pagkilos ng mga lingkod o opisyal na naroon.
theological_decisions:
- issue: Kung ang kilos ni Haman ay isang aktuwal na seksuwal na pag-atake o pagsusumamo na binigyang-kahulugan ng hari bilang pag-atake
  choice: Inilarawan lamang si Haman na nakadapa sa higaan; ang pagtatangkang panggagahasa ay inilagay bilang paratang ng hari.
  alternative: Isalaysay na talagang sinasalakay ni Haman si Ester.
  rationale: Hindi tuwirang sinasabi ng tagapagsalaysay na seksuwal na sinasalakay ni Haman si Ester. Ang marahas at seksuwal na pagbasa ay lumilitaw sa tanong ng hari, kaya pinanatili ang pagitan ng nasaksihang kilos at interpretasyon ng hari.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Ester” ayon sa karaniwang anyong Tagalog. Ang “sa harap ko, dito mismo sa palasyo” ay likas na paglalahad ng עִמִּי בַּבָּיִת at pinananatili ang galit at pagkagulat ng hari.
