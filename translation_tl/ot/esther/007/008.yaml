revisions:
- from: Bumalik ang hari mula sa hardin ng palasyo patungo sa bulwagan ng handaan, at nadatnan niyang nakadapa si Haman sa higaan na kinaroroonan ni Ester. Sinabi ng hari, “Pati ba naman ang reyna ay pagtatangkaan niyang gahasain sa harap ko, dito mismo sa palasyo?” Pagkasambit ng hari ng mga salitang iyon, tinakpan nila ang mukha ni Haman.
  to: Bumalik ang hari mula sa hardin ng palasyo patungo sa bulwagan ng handaan ng alak, at si Haman ay nakalugmok sa higaan kung saan naroon si Ester. Sinabi ng hari, “Gagahasain pa ba niya ang reyna habang narito ako sa loob ng palasyo?” Nang lumabas ang salita mula sa bibig ng hari, tinakpan nila ang mukha ni Haman.
  rationale: Idinagdag ang “ng alak” upang isalin ang הַיַּיִן. Pinalitan ang “nakadapa” ng “nakalugmok” upang hindi magpataw ng isang tiyak na postura samantalang nananatiling malinaw ang mapagkumbabang/kagipitang posisyon ni Haman sa higaan. Pinanatili ang “gagahasain” bilang tanong at paratang ng hari, hindi bilang pahayag ng tagapagsalaysay. Inihanay rin ang huling pangungusap sa pormula ng Hebreo.
