  source_fidelity: 'Tumpak na naihahatid ng draft ang daloy at pangunahing diwa ng Hebreo: lumabas si Haman na masaya, nakita niya si Mordecai sa tarangkahan ng hari, hindi tumayo o nanginig si Mordecai sa harap niya, at napuno si Haman ng galit laban kay Mordecai. Ang “nanginig sa harap niya” ay isang katanggap-tanggap na pagpili para sa disputed/elastic na וְלֹא זָע מִמֶּנּוּ, at ang talababa ay maayos na nagtatala ng alternatibo.'
  naturalness: 'Kailangan ang maliit ngunit malinaw na pagwawasto sa pambungad: mas natural at wastong modernong Tagalog ang “Noong araw na iyon” kaysa “Nang araw na iyon.” Ang “masaya at magaan ang loob” ay mas likas na katumbas ng paired idiom na “joyful and glad/good of heart” kaysa “masaya at galak na galak,” habang pinananatili ang dalawang magkaugnay na paglalarawan.'
  terminology: Ang mga pangalang Haman at Mordecai ay wastong napanatili. Ang “tarangkahan ng hari” ay angkop para sa בְּשַׁעַר הַמֶּלֶךְ. Ang “napuno ... ng matinding galit kay Mordecai” ay natural at sapat na malakas para sa חֵמָה, kahit ang “laban kay” ay maaari ring gamitin upang ilantad ang adversative nuance.
  issues:
