    issue: “Nang araw na iyon”
    rationale: Hindi ito ang pinakalikas na temporal na parirala sa modernong Tagalog sa kontekstong ito. Ang “Noong araw na iyon” ang karaniwang anyo para sa “on/that day.”
  - severity: low
    issue: “masaya at galak na galak”
    rationale: Nauunawaan ito, ngunit ang “galak na galak” ay higit na nagpapatingkad sa unang “masaya” kaysa magbigay ng ikalawang idiomatikong paglalarawan ng kalooban. Ang “masaya at magaan ang loob” ay mas natural at malapit sa טוב לב.
