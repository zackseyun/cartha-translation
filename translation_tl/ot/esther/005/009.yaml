  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: tl
  text: Noong araw na iyon, umalis si Haman na masaya at magaan ang loob. Ngunit nang makita niya si Mordecai sa tarangkahan ng hari at mapansing hindi ito tumayo ni nanginig sa harap niya[a], napuno siya ng matinding galit kay Mordecai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ni nagpakita ng takot sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: masaya at galak na galak
  rationale: Ipinahahayag ng tambalang Hebreo ang matindi at masayang kalagayan ng kalooban. Likas sa modernong Tagalog ang parirala at pinananatili nito ang dalawang magkaugnay na paglalarawan.
- source_word: בַּיּוֹם הַהוּא
  choice: Nang araw na iyon
  rationale: Natural na panandang temporal sa Tagalog na nagpapanatili sa tiyak na pagtukoy ng Hebreo.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: sa tarangkahan ng hari
  rationale: Ang בְּ ay maaaring mangahulugang nasa loob o nasa kinaroroonan ng tarangkahan. Ang “sa” ay natural at hindi labis na nagtatakda kung eksaktong nasa loob o tabi ng kompleks ng tarangkahan.
- source_word: וְלֹא קָם
  choice: hindi ito tumayo
  rationale: Tumutukoy ang קוּם sa pagtayo bilang kilos ng paggalang. Malinaw sa Tagalog ang “tumayo” nang hindi idinaragdag ang interpretasyong “bilang paggalang.”
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: ni nanginig sa harap niya
  rationale: Maaaring tumukoy ang זוע sa panginginig, pagkilos, o pagpapakita ng takot. Pinananatili ng “nanginig” ang kongkretong larawan at ang posibleng diwa ng takot; inilalahad sa talababa ang alternatibo.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: napuno siya ng matinding galit
  rationale: Tuwirang inilalarawan nito ang idyomang “mapuno ng חֵמָה” at ipinahahayag ang tindi ng poot sa natural na modernong Tagalog.
- source_word: עַל מָרְדֳּכַי
  choice: kay Mordecai
  rationale: Sa konteksto ng galit, tinutukoy ng עַל ang taong pinatutungkulan nito. Dahil malinaw na ang “galit,” natural sa Tagalog ang “kay Mordecai” at hindi kailangang ulitin ang adversatibong “laban.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tarangkahan” para sa kompleks ng pasukan ng palasyo at iniwasang dagdagan ang teksto ng hayag na paliwanag tungkol sa paggalang. Ang panghalip na “ito” ay tumutukoy kay Mordecai upang luminaw ang pagbabago ng simuno.
