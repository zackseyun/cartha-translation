  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: tl
  text: At sinabi ng hari kay Ester sa piging ng alak, “Ano ang iyong kahilingan? Ipagkakaloob ito sa iyo. At ano ang iyong hinihiling? Kahit hanggang sa kalahati ng kaharian[a], gagawin ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hanggang sa kalahati ng kaharian”; hindi tahasang sinasabi ng teksto na “hanggang sa kalahati ng aking kaharian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: habang nag-iinuman sila sa piging
  rationale: Ang מִשְׁתֶּה ay piging na may pag-inom, at tinutukoy ng הַיַּיִן ang alak. Likas sa modernong Tagalog ang pariralang ito at malinaw na ipinapakita ang tagpo nang hindi nagiging kahoy ang salin.
- source_word: שְּׁאֵלָתֵךְ
  choice: iyong kahilingan
  rationale: Sa kontekstong maharlikang hukuman, tumutukoy ito sa bagay na hinihingi, hindi sa isang tanong lamang.
- source_word: וְיִנָּתֵן לָךְ
  choice: Ibibigay iyon sa iyo
  rationale: Pinananatili nito ang pangunahing diwa ng נתן at ang katiyakan ng hari, habang natural ang anyo sa Tagalog.
- source_word: בַּקָּשָׁתֵךְ
  choice: iyong hinihiling
  rationale: Ipinapahayag nito ang bagay na nais matamo ni Ester at bahagyang iniiba ang pananalita mula sa naunang 'kahilingan' nang hindi lumilikha ng diwang wala sa Hebreo.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Kahit hanggang kalahati ng kaharian
  rationale: Pinananatili ang tiyak na pantukoy ng Hebreo at hindi idinaragdag ang salitang 'aking,' na wala sa teksto. Ipinahihiwatig ng 'kahit hanggang' ang mariing pagmamalabis ng pormulang maharlika.
- source_word: וְתֵעָשׂ
  choice: gagawin iyon
  rationale: Likas at maikli itong katumbas ng pangakong tutuparin o isasagawa ang hinihiling.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'piging' para sa pormal na handaan at ang natural na pariralang 'habang nag-iinuman sila' upang maipakita ang wine-banquet setting. Pinanatili ang pag-uulit at pormulang maharlika ng talata.
