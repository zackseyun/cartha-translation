- from: At sinabi ng hari kay Ester habang nag-iinuman sila sa piging, “Ano ang iyong kahilingan? Ibibigay iyon sa iyo. Ano ang iyong hinihiling? Kahit hanggang kalahati ng kaharian[a], gagawin iyon.”
  to: At sinabi ng hari kay Ester sa piging ng alak, “Ano ang iyong kahilingan? Ipagkakaloob ito sa iyo. At ano ang iyong hinihiling? Kahit hanggang sa kalahati ng kaharian[a], gagawin ito.”
