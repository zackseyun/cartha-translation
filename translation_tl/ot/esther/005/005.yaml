  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: tl
  text: At sinabi ng hari[a], “Magmadali kayo! Dalhin si Haman upang maisagawa ang sinabi ni Esther.” Pagkatapos, dumating ang hari at si Haman sa handaan na inihanda ni Esther.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang gawin ang salita ni Esther.” Sa Hebreo, ang “salita” ay maaaring tumukoy sa sinabi, kahilingan, o utos ni Esther.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת־הָמָן
  choice: Madali! Papuntahin ninyo rito si Haman
  rationale: Ang maramihang pautos na מַהֲרוּ ay nakatuon sa mga lingkod at humihingi ng agarang pagkilos tungkol kay Haman. Likas sa Tagalog ang “Madali!” at malinaw na ipinahihiwatig ng “papuntahin ninyo rito” ang pagpapatawag sa kanya nang hindi sinasabing pisikal siyang dalhin.
- source_word: לַעֲשׂוֹת אֶת־דְּבַר אֶסְתֵּר
  choice: upang maisagawa ang sinabi ni Esther
  rationale: Ang דָּבָר ay maaaring tumukoy sa salita, sinabi, usapin, o kahilingan. Pinananatili ng “ang sinabi ni Esther” ang mas malawak na saklaw ng Hebreo kaysa sa tahasang “kahilingan,” habang ang “maisagawa” ay natural na katumbas ng לַעֲשׂוֹת sa kontekstong ito.
- source_word: וַיָּבֹא
  choice: pumunta
  rationale: Maaaring mangahulugan ang בוא ng pagparito o pagpunta ayon sa pananaw ng salaysay. Dahil tahasang binanggit ang patutunguhang handaan, natural sa Tagalog ang “pumunta.”
- source_word: הַמִּשְׁתֶּה
  choice: handaan
  rationale: Ang מִשְׁתֶּה ay isang piging o handaan, karaniwang may inuman. Ang “handaan” ay malinaw, dignified, at natural sa makabagong Tagalog.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: na inihanda ni Esther
  rationale: Kapag handaan ang layon, ang עשה ay idiomatikong tumutukoy sa paghahanda o pagdaraos nito. Ang “inihanda” ay natural at nagpapakitang nauna ang paghahanda sa pagdating nila.
