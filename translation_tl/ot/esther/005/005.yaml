translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Madali!” upang mapanatili ang tuwirang pagkamadalian ng pautos, at “ang sinabi ni Esther” upang hindi paliitin ang tunay na semantikong lawak ng דְּבַר sa “kahilingan” lamang.
