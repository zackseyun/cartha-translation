    issue: Idinagdag na lokasyon sa “rito.”
    rationale: Walang katumbas na “rito” sa Hebreo; hindi kailangan ang dagdag na deiktikong lokasyon upang maging likas ang utos.
  - severity: low
    issue: Ang “Kaya” ay maaaring magpahiwatig ng sanhi o bunga.
    rationale: Ang magkakasunod na waw narrative forms ay mas neutral na maisasalin bilang “At” o sa pamamagitan ng simpleng pagpapatuloy ng salaysay.
  - severity: low
    issue: Walang talababa para sa malawak na kahulugan ng דְּבַר.
    rationale: May audit-trail footnote ang Ingles para sa literal na “word”; kapaki-pakinabang na panatilihin ito sa Tagalog upang hindi matabunan ang ambigwidad.
