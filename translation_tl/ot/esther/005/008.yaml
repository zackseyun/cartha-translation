base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: tl
  text: “Kung nakasumpong ako ng lingap sa paningin ng hari[a], at kung minamabuti ng hari na ipagkaloob ang aking kahilingan at tuparin ang aking pakiusap, pumarito sana ang hari at si Haman sa piging na ihahanda ko para sa kanila. At bukas ay gagawin ko ayon sa sinabi ng hari.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas idyomatiko, “Kung kinalugdan ako ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “at bukas ay gagawin ko ayon sa salita ng hari.” Malamang tumutukoy ito sa pagtugon ni Esther sa sinabi ng hari at sa paghahayag ng kanyang kahilingan kinabukasan, ngunit nananatiling eliptiko ang pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: nakasumpong ako ng lingap sa paningin ng hari
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma at ang magalang na pananalita sa korte. Ang “lingap” ay tumutukoy sa mabuting pagtanggap, hindi sa isang tahasang teolohikal na konsepto ng biyaya.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: minamabuti ng hari
  rationale: Likas at marangal na katumbas ito ng idyomang nagsasaad ng bagay na kalugod-lugod o katanggap-tanggap sa hari.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: ipagkaloob ang aking kahilingan
  rationale: Ang literal na “ibigay ang aking hinihingi” ay likas na ipinahahayag sa Filipino bilang “ipagkaloob ang aking kahilingan,” na angkop sa pormal na konteksto.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: tuparin ang aking pakiusap
  rationale: Ipinapakita ng “tuparin” ang Hebreong pandiwang “gawin” nang hindi nagiging asiwa, at pinananatili ng “pakiusap” ang pagkakaiba nito sa naunang “kahilingan.”
- source_word: יָבֹא
  choice: pumarito sana
  rationale: Bagaman anyong imperfect ang pandiwa, magalang na paanyaya o pakiusap ang gamit nito rito. Ipinahahayag ng “sana” ang mahinahong jussive na puwersa.
- source_word: הַמִּשְׁתֶּה
  choice: piging
  rationale: Ang “piging” ay natural, marangal, at angkop sa maharlikang handaan; hindi nito labis na itinatampok ang pag-inom na maaaring saklawin ng salitang Hebreo.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: na ihahanda ko para sa kanila
  rationale: Sa konteksto ng piging, natural na katumbas ng Hebreong “gagawin ko” ang “ihahanda ko.”
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: At bukas ay gagawin ko ang ayon sa sinabi ng hari
  rationale: Pinananatili nito ang bahagyang eliptiko at bukas na pahayag ng Hebreo sa halip na tahasang idagdag na ibubunyag ni Esther ang kanyang kahilingan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may marangal at magalang na rehistrong angkop sa pananalita ni Esther sa korte. Pinanatili ang larawang “sa paningin ng hari” sa pangunahing teksto, habang ibinigay sa talababa ang mas idyomatikong alternatibo. Hindi nilinaw nang higit sa Hebreo ang pangwakas na pangungusap.
