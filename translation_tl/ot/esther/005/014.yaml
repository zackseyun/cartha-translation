- from: Sinabi sa kanya ni Zeres na kanyang asawa at ng lahat ng kanyang kaibigan, “Magpagawa ng isang bitayang[a] limampung siko[b] ang taas. Sa umaga, sabihin mo sa hari na ibitay si Mordecai roon.[c] Pagkatapos, masaya kang sumama sa hari sa handaan.” Nagustuhan ni Haman ang mungkahi, kaya ipinagawa niya ang bitayan.
  to: Sinabi sa kanya ng kanyang asawang si Zeres at ng lahat ng kanyang kaibigan, “Magpagawa ka ng isang bitayang[a] limampung siko[b] ang taas. Sa umaga, sabihin mo sa hari na ibitay si Mordecai roon.[c] Pagkatapos, sumama ka sa hari sa handaan nang masaya.” Nagustuhan ni Haman ang mungkahi, at ginawa niya ang bitayan.
  rationale: Inayos ang sintaks ng unang pangungusap para sa malinaw at likas na Tagalog. Ibinalik ang pangwakas na pandiwa sa payak na “ginawa niya” upang hindi magdagdag ng causative na hindi tahasang nasa Hebreo, at pinalitan ang “kaya” ng “at” upang mapanatili ang payak na pagkakaugnay ng pinagmulan. Pinanatili ang mga footnote anchor at lahat ng kinakailangang paglilinaw hinggil sa pinagtatalunang paraan ng pagpatay.
