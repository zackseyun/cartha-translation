base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: tl
  text: Sinabi sa kanya ng kanyang asawang si Zeres at ng lahat ng kanyang kaibigan, “Magpagawa ka ng isang bitayang[a] limampung siko[b] ang taas. Sa umaga, sabihin mo sa hari na ibitay si Mordecai roon.[c] Pagkatapos, sumama ka sa hari sa handaan nang masaya.” Nagustuhan ni Haman ang mungkahi, at ginawa niya ang bitayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “posteng kahoy.” Ang salitang Hebreo ay maaaring mangahulugang kahoy, puno, o kayariang kahoy na ginagamit sa pagpatay; hindi tiyak ang eksaktong anyo nito.
    reason: lexical_alternative
  - marker: b
    text: Ang limampung siko ay humigit-kumulang 23 metro.
    reason: cultural_note
  - marker: c
    text: Maaari ring “ituhog si Mordecai doon” o “isabit si Mordecai roon.” Maaaring tumukoy ang pananalita sa Hebreo sa pagsasabit o pagtuhog sa isang kayariang kahoy; pinagtatalunan ang eksaktong paraan ng pagpatay.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: kanyang kaibigan
  rationale: Bagaman literal na ‘mga umiibig sa kanya,’ sa konteksto ay tumutukoy ito sa malalapit na kasamahan ni Haman; ‘mga kaibigan’ ang natural na katumbas sa modernong Tagalog.
- source_word: יַעֲשׂוּ
  choice: Magpagawa
  rationale: Ang di-tiyak na maramihang tagaganap ay nagpapahayag ng mungkahi. Natural sa Tagalog ang ‘magpagawa’ at hindi nito kailangang tukuyin kung sino ang gagawa.
- source_word: עֵץ
  choice: bitayan
  rationale: Sa konteksto ng paglalapat ng parusang kamatayan sa Esther, ang salita ay tumutukoy sa isang kayariang kahoy. ‘Bitayan’ ang malinaw at likas na pangunahing salin, habang inilalahad sa talababa ang hindi tiyak na eksaktong anyo nito.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: limampung siko ang taas
  rationale: Pinananatili ang sinaunang sukat na ‘siko’ sa pangunahing teksto at inilalagay ang makabagong tantiya sa talababa.
- source_word: וּבַבֹּקֶר
  choice: Sa umaga
  rationale: Tuwirang isinasalin ang pariralang pangpanahon nang hindi idinaragdag ang tahasang ‘kinabukasan,’ bagaman iyon ang ipinahihiwatig ng salaysay.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: sabihin mo sa hari
  rationale: Pinananatili ang tuwirang diwa ng pandiwang ‘sabihin’; hindi ipinapasok sa mismong pandiwa ang mas interpretibong ‘hilingin.’
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: na ibitay si Mordecai roon
  rationale: Natural na ipinahahayag sa Tagalog ang utos sa di-tiyak na mga tagapagpatupad. Ang ‘ibitay’ ay tradisyonal at malinaw, ngunit ang posibilidad ng pagtuhog o pagsasabit sa poste ay pinananatili sa talababa.
- source_word: וּבֹא עִם־הַמֶּלֶךְ אֶל־הַמִּשְׁתֶּה
  choice: sumama sa hari sa handaan
  rationale: Ang ‘handaan’ ay angkop sa marangal na konteksto at natural sa modernong Tagalog.
- source_word: שָׂמֵחַ
  choice: masaya
  rationale: Inilalarawan nito ang masayang kalagayan ni Haman habang pumupunta siya sa handaan.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: Nagustuhan ni Haman ang mungkahi
  rationale: Natural na katumbas ito ng Hebreong idyoma na nagsasabing naging mabuti o kalugod-lugod sa paningin niya ang sinabi.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: ipinagawa niya ang bitayan
  rationale: Bagaman literal na ‘ginawa niya,’ natural sa konteksto na si Haman ang nag-utos o nagsaayos na gawin ito; hindi ipinapalagay na siya mismo ang pisikal na gumawa.
theological_decisions:
- issue: Hindi tiyak na paraan ng pagpatay na ipinahihiwatig ng עֵץ at תלה
  choice: Gamitin sa pangunahing teksto ang ‘bitayan’ at ‘ibitay,’ kalakip ang talababa tungkol sa kayariang kahoy at posibleng pagtuhog o pagsasabit.
  alternative: ‘Poste’ at ‘tuhugin’ o ‘isabit.’
  rationale: Hindi tiyak sa Hebreo ang eksaktong anyo ng kayarian at paraan ng pagpatay. Pinananatili ng pangunahing salin ang malinaw at pamilyar na pagbasa, habang hindi ikinukubli ng talababa ang tunay na leksikal at makasaysayang kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang ‘siko’ para sa sinaunang yunit at ‘handaan’ para sa maharlikang piging. Iniwasan ang sobrang teknikal o makalumang pananalita, at pinanatili sa mga talababa ang tunay na kalabuan tungkol sa kayariang kahoy at paraan ng pagpatay.
