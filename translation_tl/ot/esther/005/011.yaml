base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: tl
  text: Ikinuwento ni Haman sa kanila ang karangyaan ng kaniyang kayamanan[a], ang dami ng kaniyang mga anak na lalaki[b], ang lahat ng ginawa ng hari upang dakilain siya[c], at kung paano siya itinaas ng hari nang higit sa mga pinuno at mga lingkod ng hari[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang kaningningan ng kaniyang mga kayamanan.” Binibigyang-diin ng pariralang Hebreo ang kahanga-hangang karangyaang kaugnay ng kayamanan ni Haman.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang dami ng kaniyang mga anak na lalaki.” Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo, hindi ang mas pangkalahatang “mga anak.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang lahat ng ginawa ng hari upang itaguyod siya.”
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “kung paano siya itinaas ng hari nang higit sa mga pinuno at mga lingkod ng hari.” Ang tinutukoy ay pag-angat sa ranggo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Ikinuwento
  rationale: Likas na salaysay sa modernong Tagalog at pinananatili ang diwa ng pag-uulat o pagsasalaysay ni Haman sa kaniyang mga kausap.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: ang karangyaan ng kaniyang kayamanan
  rationale: Ipinahahayag ng כָּבוֹד kasama ng עֹשֶׁר ang kahanga-hanga at marangyang anyo ng kayamanan, hindi lamang ang dami nito.
- source_word: רֹב בָּנָיו
  choice: ang dami ng kaniyang mga anak na lalaki
  rationale: Ang רֹב ay tumutukoy sa dami, at ang בָּנִים ay tahasang 'mga anak na lalaki,' kaya hindi ito ginawang pangkalahatang 'mga anak.'
- source_word: גִּדְּלוֹ
  choice: ginawa siyang dakila
  rationale: Pinananatili nito ang causative na diwa ng Piel ng גדל at ang hari bilang gumagawa, sa halip na paliitin ang kahulugan sa teknikal na 'itinaas sa tungkulin.'
- source_word: נִשְּׂאוֹ עַל
  choice: itinaas siya ... nang higit sa
  rationale: Ipinahahayag nito ang pag-angat sa ranggo at ang paghahambing kay Haman sa ibang mga opisyal ng hari.
- source_word: הַשָּׂרִים
  choice: mga pinuno
  rationale: Malinaw at malawak na katumbas para sa mga may mataas na katungkulan sa korte, nang hindi ipinapalagay na namamanang maharlika sila.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: mga lingkod ng hari
  rationale: Tuwirang katumbas na angkop sa konteksto ng korte at hindi kinakailangang nagpapahiwatig ng teknikal na kalagayan ng pagkaalipin.
