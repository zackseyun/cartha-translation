  to: Ikinuwento ni Haman sa kanila ang karangyaan ng kaniyang kayamanan[a], ang dami ng kaniyang mga anak na lalaki[b], ang lahat ng ginawa ng hari upang dakilain siya[c], at kung paano siya itinaas ng hari nang higit sa mga pinuno at mga lingkod ng hari[d].
