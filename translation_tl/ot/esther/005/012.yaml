base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: tl
  text: Sinabi pa ni Haman, “Wala nang ibang isinama si Reyna Ester, kasama ng hari, sa handaang inihanda niya kundi ako lamang; at bukas ay inanyayahan niya rin akong dumalo kasama ng hari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi pa
  rationale: Isinusulong ng waw-consecutive ang salaysay, at likas sa konteksto ang “Sinabi pa” dahil ipinagpapatuloy ni Haman ang pagyayabang niya.
- source_word: אַף לֹא
  choice: Wala nang ibang
  rationale: Ipinahahayag nito ang mariing pagbubukod sa lahat ng iba; natural sa Tagalog ang “Wala nang ibang” sa ganitong mapagmalaking pahayag.
- source_word: הֵבִיאָה
  choice: isinama
  rationale: Literal itong “dinala” o “pinapunta,” ngunit sa konteksto ng handaan, malinaw at natural ang “isinama” nang hindi tahasang pinapalitan ng “inanyayahan.”
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Reyna Ester
  rationale: Ito ang natural na ayos ng titulo at pangalan sa modernong Tagalog.
- source_word: עִם הַמֶּלֶךְ
  choice: sa hari
  rationale: Sa konstruksiyong “isinama ... sa hari,” ipinahihiwatig na kasama ng hari si Haman sa handaan; iniiwasan nito ang alanganing “kasama ng hari” kaagad kasunod ng pandiwa.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: sa handaan
  rationale: Ang מִשְׁתֶּה ay isang piging o handaan, madalas na may pag-inom. “Handaan” ang mas pangkaraniwan at marangal na salitang Filipino sa kontekstong ito.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: na inihanda niya
  rationale: Bagaman literal na “na ginawa niya,” ang “inihanda” ang natural na gamit para sa isang handaan at pinananatili ang papel ni Ester bilang punong-abala.
- source_word: כִּי אִם אוֹתִי
  choice: kundi ako lamang
  rationale: Malinaw nitong pinananatili ang eksklusibong diin at pagmamapuri ni Haman.
- source_word: וְגַם לְמָחָר
  choice: at bukas ... din
  rationale: Pinananatili ng “din” ang panagdag na puwersa ng וְגַם sa natural na ayos ng Tagalog.
- source_word: קָרוּא לָהּ
  choice: inanyayahan ... niya
  rationale: Literal itong “tinawag niya,” ngunit sa konteksto ng handaan ay nangangahulugang inimbitahan; “inanyayahan” ang malinaw at idiomatikong katumbas.
- source_word: עִם הַמֶּלֶךְ
  choice: makasama ng hari
  rationale: Sa hulihan ng pangungusap, likas na ipinapahayag nito na si Haman ay dadalo kasama ng hari, nang hindi ipinahihiwatig na ang hari ang nag-anyaya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang mapagmalaking tono ni Haman at ang eksklusibong diin ng Hebreo. Walang talababa dahil walang mahalagang tekstuwal o teolohikal na kalabuan na kailangang ilahad para sa talatang ito.
