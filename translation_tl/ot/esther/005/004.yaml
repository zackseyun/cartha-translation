  source_fidelity: 'Tumpak ang karamihan ng salin: naipapahayag ang magalang na kondisyon, ang paanyayang may kusang-loob na puwersa, ang pagbanggit sa hari at kay Haman, ang “ngayon,” at ang pang-isahang “kanya” sa hulihan. Gayunman, ang “pumarito” ay may deiktikong kahulugang ‘pumunta rito/sa kinaroroonan ng nagsasalita,’ na hindi tahasang isinasaad ng Hebreo.'
  naturalness: Ang “Kung mamarapatin ng hari” at “handaan” ay angkop sa marangal ngunit nauunawaang modernong Filipino. Mas likas at mas hindi deiktiko ang “magtungo ... sa handaan” kaysa “pumarito ... sa handaan.”
  terminology: Wasto ang “hari,” “Haman,” at “handaan.” Dapat panatilihin ang “para sa kanya,” hindi “para sa kanila,” sapagkat pang-isahan ang לוֹ at malamang na tumutukoy sa hari, bagaman hindi ito tahasang pinapangalanan sa Hebreo.
