  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: tl
  text: Sinabi ni Esther, “Kung mamarapatin ng hari, magtungo sana ngayon ang hari at si Haman sa handaang inihanda ko para sa kanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Kung mamarapatin ng hari
  rationale: Isang magalang na pormula ng paghiling sa harapan ng hari. Likas sa marangal na modernong Filipino ang “mamarapatin” at ipinahahayag nito ang pagsang-ayon ng hari.
- source_word: יָבוֹא
  choice: pumarito sana
  rationale: Bagaman anyong imperfect ang pandiwa, jussive o magalang na paanyaya ang gamit nito sa konteksto. Ipinahahayag ng “sana” ang mapitagang paghiling.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: ang hari at si Haman
  rationale: Pinananatili ang pag-uulit ng titulong “ang hari” at hindi idinaragdag ang pangalang hindi makikita sa talata.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na modernong katumbas na nagpapanatili sa agarang panahon ng paanyaya.
- source_word: הַמִּשְׁתֶּה
  choice: handaan
  rationale: Ang salita ay tumutukoy sa isang piging o salusalo, kadalasang may inuman. Ang “handaan” ay natural, malinaw, at angkop sa kontekstong maharlika nang hindi labis na itinatampok ang pag-inom.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: na inihanda ko para sa kanya
  rationale: Sa kaugnayan ng handaan, natural ang “inihanda” para sa עָשִׂיתִי. Pinananatili ng “kanya” ang pang-isahang panghalip na pinakamalamang na tumutukoy sa hari, kahit kasama ring inanyayahan si Haman.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na may magalang at marangal na himig na angkop sa korte. Ginamit ang “pumarito sana” upang maging likas ang mapitagang paanyaya, at pinanatili ang pang-isahang “kanya” upang huwag pakinisin ang detalye ng Hebreo tungo sa “kanila.”
