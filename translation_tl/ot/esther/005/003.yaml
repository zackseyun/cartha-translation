  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: tl
  text: Sinabi ng hari sa kanya, “Ano ang kailangan mo, Reyna Ester?[a] At ano ang kahilingan mo?[b] Hanggang sa kalahati ng kaharian ay ibibigay sa iyo.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin, “Ano ang bumabagabag sa iyo, Reyna Ester?” Literal sa Hebreo: “Ano sa iyo?”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pakiusap” o “petisyon.”
    reason: lexical_alternative
  - marker: c
    text: Isa itong nakaugaliang pananalita ng hari na nagpapahayag ng bukas-palad na pangako; hindi ito kinakailangang literal na alok na hatiin ang kaharian.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהּ הַמֶּלֶךְ
  choice: Sinabi sa kanya ng hari
  rationale: Likas na salaysay sa modernong Tagalog na pinananatili ang hari bilang nagsasalita at si Ester bilang pinatutungkulan.
- source_word: מַה לָּךְ
  choice: Ano ang kailangan mo
  rationale: Ipinahahayag ang Hebreong idyomang literal na ‘Ano sa iyo?’ bilang magalang na pagtatanong sa pakay o kailangan ni Ester, nang hindi ipinapalagay na nababagabag siya.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Reyna Ester
  rationale: Natural sa Tagalog ang paglalagay ng titulong maharlika bago ang pangalan.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: At ano ang kahilingan mo?
  rationale: Ang ‘kahilingan’ ay malinaw, dignified, at angkop sa pormal na pagharap sa hari; saklaw nito ang diwa ng isang request o petition.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Kahit hanggang kalahati ng kaharian
  rationale: Pinananatili ang sukdulang lawak ng pangakong ipinahahayag ng pormulang maharlika.
- source_word: וְיִנָּתֵן לָךְ
  choice: ibibigay iyon sa iyo
  rationale: Natural na pasibong pangako sa Tagalog; ang ‘iyon’ ay tumutukoy sa anumang hihilingin niya.
