- from: Sa ikatlong araw, isinuot ni Ester ang kanyang kasuotang maharlika[a] at tumayo siya sa panloob na patyo ng palasyo ng hari, sa tapat ng gusali ng hari. Nakaupo naman ang hari sa kanyang maharlikang trono sa bulwagan ng palasyo[b], sa tapat ng pasukan nito.
  to: Sa ikatlong araw, isinuot ni Ester ang kanyang kasuotang maharlika[a] at tumayo siya sa panloob na patyo ng palasyo ng hari, sa tapat ng palasyo ng hari, habang nakaupo ang hari sa kanyang maharlikang trono sa maharlikang palasyo[b], sa tapat ng pasukan ng palasyo.
