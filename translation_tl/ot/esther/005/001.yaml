translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Iniwasan ang lipas na “nangyari nga” bilang pambungad at ang masyadong literal ngunit malabong “bahay ng pagkahari.” Pinanatili ang mga ugnayang panglokasyon at ang pag-uulit ng konsepto ng palasyo/gusali hangga't natural sa Tagalog.
