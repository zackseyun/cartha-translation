base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: tl
  text: Sa ikatlong araw, isinuot ni Ester ang kanyang kasuotang maharlika[a] at tumayo siya sa panloob na patyo ng palasyo ng hari, sa tapat ng palasyo ng hari, habang nakaupo ang hari sa kanyang maharlikang trono sa maharlikang palasyo[b], sa tapat ng pasukan ng palasyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “nagsuot ng pagkahari,” ibig sabihin, nagsuot siya ng kasuotang maharlika o regalya.'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay literal na “bahay,” ngunit maaari rin itong tumukoy sa palasyo sa ganitong konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Sa ikatlong araw
  rationale: Likas na panimulang pariralang temporal sa modernong Tagalog; hindi dinagdagan ng tahasang panandang gaya ng “ngayon” sapagkat wala nito sa Hebreo.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: isinuot ni Ester ang kanyang kasuotang maharlika
  rationale: Literal na tumutukoy ang מַלְכוּת sa pagkahari o pagiging maharlika, ngunit sa idyomang ito ay konkreto itong tumutukoy sa kasuotan o regalya ng reyna. Pinananatili sa talababa ang literal na anyo.
- source_word: וַתַּעֲמֹד
  choice: tumayo siya
  rationale: Direkta at natural na katumbas ng payak na pandiwang nagsasalaysay.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: sa panloob na patyo ng palasyo ng hari
  rationale: Sa kontekstong maharlikang gusali, ang בֵּית־הַמֶּלֶךְ ay malinaw na tumutukoy sa kompleks ng palasyo; “panloob na patyo” ang natural na paglalarawan sa lokasyon.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: sa tapat ng gusali ng hari
  rationale: Ipinapakita ng נֹכַח ang pagkakaharap o pagiging nasa tapat. Ginamit ang “gusali ng hari” upang maiba ito sa mas malawak na kompleks ng palasyo nang hindi tiyakang pinapangalanan ang silid.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: Nakaupo naman ang hari
  rationale: Ang “naman” ay maayos na naghuhudyat ng kasabay na tagpo at paglilipat ng pokus, nang hindi nagpapakilala ng bagong ugnayang wala sa teksto.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: sa kanyang maharlikang trono
  rationale: Natural na katumbas ng construct phrase na tumutukoy sa trono ng hari bilang sagisag at luklukan ng kanyang pagkahari.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: sa bulwagan ng palasyo
  rationale: Ang literal na “bahay ng pagkahari” ay tumutukoy sa maharlikang bahagi o bulwagan ng palasyo. Ang saling ito ay malinaw sa mambabasa habang ang lawak ng בַּיִת ay itinatala sa talababa.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: sa tapat ng pasukan nito
  rationale: Pinananatili ang tiyak na ayos na nakaharap ang trono sa pasukan; ang “nito” ay likas na umuugnay sa naunang bulwagan ng palasyo.
