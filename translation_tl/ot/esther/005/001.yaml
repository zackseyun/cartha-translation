  naturalness: Natural ang karamihan ng Tagalog, ngunit mas malinaw at mas magkakatugma ang paulit-ulit na pagtukoy sa palasyo. Ang “habang nakaupo ang hari” ay tuwirang nagpapahayag ng kasabay na tagpo nang hindi nagdaragdag ng bahagyang kontrast na maaaring ipahiwatig ng “naman.”
  terminology: Ang “kasuutang maharlika,” “panloob na patyo,” at “maharlikang trono” ay angkop. Pinananatili ng “maharlikang palasyo” ang kaugnayan sa מַלְכוּת nang hindi ipinipilit ang hindi natural na “bahay ng pagkahari.”
