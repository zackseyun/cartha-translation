base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: tl
  text: Nang makita ng hari si Reyna Ester na nakatayo sa patyo[a], nakasumpong siya ng lingap sa paningin ng hari[b]. Iniunat ng hari kay Ester ang gintong setro na nasa kamay niya. At lumapit si Ester at hinipo ang dulo ng setro[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “looban.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nagdala siya ng lingap sa mga mata ng hari,” isang idyomang nangangahulugang tumanggap siya ng paborableng pagtingin.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hinipo ang tuktok ng setro.” Sa Hebreo, “ulo ng setro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Nang makita
  rationale: Ang וַיְהִי na sinusundan ng infinitive construct ay nagpapakilala ng sugnay na panahunan. Likas sa modernong Tagalog ang “Nang makita” at naipagpapatuloy nito ang salaysay nang hindi gumagamit ng mabigat na literal na pormula.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: si Reyna Ester
  rationale: Bagaman nauuna sa Hebreo ang pangalan bago ang titulo, “Reyna Ester” ang natural at marangal na ayos sa modernong Tagalog.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: na nakatayo sa looban
  rationale: Pinananatili ng “nakatayo” ang kilos o tindig ng participle. Ang חָצֵר ay tumutukoy rito sa loobang bahagi ng palasyo; malinaw ang “looban” habang hindi nito ipinapakahulugang hukuman.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: kinalugdan niya ito
  rationale: Ang literal na idyomang “nagdala ng lingap sa kanyang mga mata” ay hindi likas sa Tagalog. Ipinahahayag ng “kinalugdan” ang paborableng pagtanggap ng hari, samantalang inilalagay sa talababa ang mas literal na larawan.
- source_word: וַיּוֹשֶׁט
  choice: Iniunat
  rationale: Tuwirang ipinahahayag nito ang pag-abot o pag-uunat ng setro patungo kay Ester at natural sa konteksto.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: ang gintong setro
  rationale: Ang “gintong setro” ang karaniwan at marangal na salin para sa sagisag ng kapangyarihang maharlika.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: na nasa kamay niya
  rationale: Malinaw at natural na tinutukoy ng sugnay ang setrong hawak ng hari.
- source_word: וַתִּקְרַב
  choice: Kaya lumapit si Ester
  rationale: Ipinakikita ng “lumapit” ang tugon ni Ester sa kilos ng hari. Ang “Kaya” ay likas na nag-uugnay sa pagkakasunod at bunga sa tagpo.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: hinawakan ang dulo ng setro
  rationale: Literal na “ulo” ang רֹאשׁ, ngunit para sa setro ay natural ang “dulo.” Ang pandiwang נגע ay maaaring “humipo” o “humawak”; “hinawakan” ay malinaw sa ritwal na kilos, habang itinatala sa talababa ang lexical na saklaw.
