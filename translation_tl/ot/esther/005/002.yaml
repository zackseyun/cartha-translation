revisions:
- from: Nang makita ng hari si Reyna Ester na nakatayo sa looban[a], kinalugdan niya ito[b]. Iniunat ng hari kay Ester ang gintong setro na nasa kamay niya. Kaya lumapit si Ester at hinawakan ang dulo ng setro[c].
  to: Nang makita ng hari si Reyna Ester na nakatayo sa patyo[a], nakasumpong siya ng lingap sa paningin ng hari[b]. Iniunat ng hari kay Ester ang gintong setro na nasa kamay niya. At lumapit si Ester at hinipo ang dulo ng setro[c].
  rationale: Pinalitan ang “looban” ng “patyo” para sa mas malinaw na royal-courtyard sense; ginawang “nakasumpong ... sa paningin ng hari” upang mapanatili ang kahulugan at larawan ng Hebreong idyoma; pinalitan ang “Kaya” ng “At” upang hindi magdagdag ng sanhi-bunga; at pinalitan ang “hinawakan” ng “hinipo” upang tumugma sa pandiwang “touched.” Inayos din ang talababa [b] upang mas tumpak na ilarawan ang literal na Hebreong idyoma.
