translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “looban” upang malinaw na tumukoy sa courtyard ng palasyo, hindi sa royal court bilang institusyon. Pinanatili ang mga marker [a], [b], at [c] sa mismong tekstong kaugnay ng bawat talababa.
