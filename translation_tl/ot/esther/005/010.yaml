translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Zeres,” ang karaniwang anyong Filipino ng pangalang Zeresh. Pinanatili ang maigsi at sunod-sunod na kilos ng Hebreong salaysay; ang “Pagkatapos” ay tumutulong upang maging natural ang daloy sa Tagalog.
