base_translation:
  language: en
  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: tl
  text: Ngunit nagpigil[a] si Haman at umuwi[b]. Pagkatapos, nagsugo siya at ipinatawag ang kanyang mga kaibigan at ang asawa niyang si Zeres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpigil sa sarili” o “pinigil ang sarili.”
    reason: lexical_alternative
  - marker: b
    text: O “pumunta siya sa kanyang bahay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: nagpigil
  rationale: Ipinahahayag ng hitpael ng אפק ang pagpipigil ni Haman sa sarili sa kabila ng galit na binanggit sa naunang talata. Likas sa modernong Tagalog ang “nagpigil,” at malinaw sa konteksto na sarili niyang damdamin o kilos ang pinipigil niya.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: umuwi
  rationale: Literal itong pagpunta sa sarili niyang bahay. Ang “umuwi” ang pinakanatural at maikli sa Tagalog, habang ang talababa ay nag-iingat sa mas literal na anyo.
- source_word: וַיִּשְׁלַח
  choice: nagsugo siya
  rationale: Walang tahasang layon ang pandiwa sa Hebreo. Pinananatili ng “nagsugo” ang maikling pagkakasunod-sunod ng salaysay at ipinahihiwatig na may inutusang magpatawag.
- source_word: וַיָּבֵא
  choice: ipinatawag
  rationale: Ang hiphil ng בוא ay “pinapunta” o “dinala.” Sa konteksto ng pagsusugo upang papuntahin sa bahay ang mga tao, natural na katumbas sa Tagalog ang “ipinatawag,” nang hindi ito ginagawang simpleng “tinipon.”
- source_word: אֹהֲבָיו
  choice: kanyang mga kaibigan
  rationale: Bagaman nagmula sa ugat na “umibig,” tumutukoy rito ang pangngalang maramihan sa mga kaibigan o malalapit na kasamahan ni Haman.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: ang asawa niyang si Zeres
  rationale: Mas natural sa modernong Tagalog ang ganitong ayos kaysa “si Zeres na kanyang asawa,” habang malinaw pa rin ang ugnayan ng pangalan at katungkulan.
- source_word: וַ
  choice: Ngunit
  rationale: 'Bagaman karaniwang pang-ugnay sa salaysay ang waw, may tunay na pagsalungat dito: sa kabila ng galit ni Haman sa naunang konteksto, nagpigil siya.'
