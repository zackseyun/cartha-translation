translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Pinanatili ang pormal na tambalang “sumagot ... at sinabi” at ang magkalapit ngunit hindi ganap na magkaparehong “kahilingan” at “pakiusap.”
