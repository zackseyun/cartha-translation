  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: tl
  text: Sumagot si Ester at sinabi, “Ang aking kahilingan at pakiusap ay ito:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן
  choice: Sumagot
  rationale: Ipinahahayag ang karaniwang diwa ng ענה bilang tugon sa naunang sinabi, habang likas sa modernong Tagalog ang daloy ng salaysay nang hindi kailangang hiwalay na isalin ang waw.
- source_word: אֶסְתֵּר
  choice: si Ester
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog at ang pantukoy na “si” para sa likas na balarila.
- source_word: וַתֹּאמַר
  choice: at sinabi
  rationale: Pinanatili ang dalawang pandiwang Hebreo na “sumagot at sinabi,” kahit bahagyang magkasingkahulugan, upang maipakita ang pormal na estilo ng pinagmulang teksto.
- source_word: שְׁאֵלָתִי
  choice: aking kahilingan
  rationale: Sa konteksto ng pormal na paglapit ni Ester sa hari, tumutukoy ito sa hinihingi o petisyon, hindi sa isang tanong.
- source_word: וּבַקָּשָׁתִי
  choice: at pakiusap
  rationale: Ang “pakiusap” ay nagpapahayag ng magalang at taimtim na paghiling at nagpapanatili ng banayad na pagkakaiba nito sa “kahilingan.”
