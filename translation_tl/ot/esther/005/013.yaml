  yaml_path: translation/ot/esther/005/013.yaml
  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: tl
  text: Ngunit walang halaga sa akin ang lahat ng ito tuwing nakikita ko si Mardokeo na Judio na nakaupo sa pintuang-daan ng hari.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At walang kabuluhan sa akin ang lahat ng ito sa tuwing nakikita ko si Mardokeo na Judio na nakaupo sa pintuang-daan ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Judio” ay maaari ding isaling “taga-Juda”; dito, malamang na itinatampok nito ang etnikong pagkakakilanlan ni Mardokeo sa loob ng korte ng Persia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: Ngunit ... ang lahat ng ito
  rationale: Bagaman maaaring payak na “at” ang וְ, nagpapahiwatig ito rito ng pagsalungat sa naunang pagmamalaki ni Haman. Likas na ipinahahayag ng “ngunit” ang kontrast habang pinananatili ang כָל זֶה bilang “ang lahat ng ito.”
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: walang halaga sa akin
  rationale: Ang idyoma ay nagsasaad na, sa pagtataya ni Haman, nawawalan ng saysay o halaga ang lahat ng kanyang karangalan. Ang “walang halaga sa akin” ay malinaw at natural sa modernong Tagalog nang hindi dinaragdagan ang kahulugan.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: tuwing
  rationale: Ipinahahayag ng parirala ang paulit-ulit na temporal na diwa, “sa bawat pagkakataong.” Maikli at natural itong naihahatid ng “tuwing.”
- source_word: רֹאֶה
  choice: nakikita ko
  rationale: Ang participle kasama ng אֲנִי ay nagpapahayag ng nagpapatuloy o paulit-ulit na pagkakita; ang “nakikita ko” ay angkop sa “tuwing.”
- source_word: מָרְדֳּכַי
  choice: Mardokeo
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Mordecai.
- source_word: הַיְּהוּדִי
  choice: na Judio
  rationale: Maaaring tumukoy ang יְהוּדִי sa isang Judio o taga-Juda. Sa tagpuang Persiano ng Esther, malamang na itinatampok nito ang etnikong pagkakakilanlan ni Mardokeo; natural sa Tagalog ang apositibong “na Judio.”
- source_word: יוֹשֵׁב
  choice: nakaupo
  rationale: Tuwirang inilalarawan ng participle ang postura o kinalalagyan ni Mardokeo at pinananatili ang matingkad na larawan ng teksto.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: sa pintuang-daan ng hari
  rationale: Tumutukoy ito sa lugar ng pintuang-daan na kaugnay ng palasyo at pangharing pangangasiwa. Pinananatili ng “pintuang-daan ng hari” ang konkretong larawan at pormal na tagpuan.
