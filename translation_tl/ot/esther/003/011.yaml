lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos ay” upang ipakita ang pagkakasunod-sunod.
- source_word: הַמֶּלֶךְ
  choice: ang hari
  rationale: Tuwirang salin ng tiyak na pangngalan; pinananatili ang titulong ginamit sa Hebreo sa halip na idagdag ang pangalan ng hari.
- source_word: לְהָמָן
  choice: kay Haman
  rationale: Likas na anyong Tagalog para sa di-tuwirang layon na isang pangalang pantangi.
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Ang כֶּסֶף ay literal na “pilak” at maaari ring tumukoy sa “salapi.” Pinananatili sa teksto ang kongkretong larawan ng Hebreo, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: נָתוּן לָךְ
  choice: Ibinibigay sa iyo
  rationale: Pinananatili ang pasibong konstruksyon at ang di-tiyak na himig ng pagkakaloob o paglalagay sa kapangyarihan ni Haman, nang hindi ito ginagawang tahasang pagtanggi o pagtanggap sa salapi.
- source_word: וְהָעָם
  choice: pati ang bayan
  rationale: Ipinakikita ng “pati” na kapuwa ang pilak at ang bayan ay inilalagay sa kapangyarihan ni Haman. Ang “bayan” ay likas na kolektibong pangngalan sa Tagalog.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: upang gawin mo rito
  rationale: Ipinahahayag ng pawatas ang layunin o pahintulot na kumilos laban o patungkol sa bayan. Ang “rito” ay umaayon sa isahang kolektibong “bayan” at hindi nagdaragdag ng kahulugang wala sa teksto.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: ang anumang mabuti sa paningin mo
  rationale: Pinananatili ang idyomatikong larawan ng Hebreo tungkol sa kung ano ang mabuti sa paningin ng isang tao, habang nananatiling malinaw sa modernong Tagalog.
