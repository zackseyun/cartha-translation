  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ng hari kay Haman, “Ibinibigay sa iyo ang pilak[a], pati ang bayan, upang gawin mo sa bayan ang anumang sa tingin mo ay mabuti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “salapi.” Ang Hebreong כֶּסֶף ay literal na “pilak” ngunit ginagamit din sa kahulugang “salapi.”
