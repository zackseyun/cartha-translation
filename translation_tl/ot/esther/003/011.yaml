  naturalness: Moderno at marangal ang kabuuang rehistro. Mas malinaw at mas likas ang “gawin mo sa bayan ang anumang sa tingin mo ay mabuti” kaysa “gawin mo rito ang anumang mabuti sa paningin mo.”
  terminology: Ang “pilak” para sa כֶּסֶף at “bayan” para sa kolektibong הָעָם ay angkop. Pinananatili ng “sa tingin mo ay mabuti” ang kahulugan ng idyomang כַּטּוֹב בְּעֵינֶיךָ nang hindi pinipilit ang Hebreong larawan sa isang di-likas na anyo.
