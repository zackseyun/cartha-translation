  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong idyomang “mabuti sa paningin mo” at ang kolektibong isahan ng “bayan,” habang iniwasan ang labis na pagpapaliwanag sa mismong talata.
