  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: tl
  text: Ipinadala sa pamamagitan ng mga sugo ang mga liham sa lahat ng lalawigan ng hari[a], upang lipulin, patayin, at puksain ang lahat ng Judio—mula sa kabataan hanggang sa matanda, pati mga bata at mga babae—sa isang araw, sa ikalabintatlong araw ng ikalabindalawang buwan, samakatuwid ay ang buwan ng Adar[b], at samsamin ang kanilang mga ari-arian bilang pandarambong.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa kamay ng mga mananakbo”; tumutukoy ito sa mga tagapagdala ng mahahalagang liham o utos ng hari.
    reason: lexical_alternative
  - marker: b
    text: Ang Adar ang ikalabindalawang buwan sa kalendaryong Hebreo, na karaniwang pumapatak sa Pebrero–Marso.
    reason: historical_context
  - marker: c
    text: 'Maaari ring isalin: “at dambungin ang kanilang mga ari-arian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: Ipinadala ... ang mga liham
  rationale: Ginagawang natural sa Tagalog ang pasibong pagpapadala ng mga nakasulat na utos, habang pinananatili ang administratibong diwa ng סְפָרִים.
- source_word: בְּיַד הָרָצִים
  choice: sa pamamagitan ng mga sugo
  rationale: Ang literal na 'sa kamay ng mga mananakbo' ay idyoma para sa paghahatid sa pamamagitan ng mga tagapagdala ng mensahe; 'mga sugo' ang malinaw at marangal na katumbas sa konteksto.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: upang lipulin, patayin, at puksain
  rationale: Pinananatili ang tatlong magkakasunod na pandiwa at ang tumitinding diin ng utos, sa halip na pagsamahin ang mga ito sa iisang salita.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: mula sa kabataan hanggang sa matanda
  rationale: Ipinahahayag ang distribusyon sa buong saklaw ng edad. Ang 'kabataan' ay hindi nililimitahan sa lalaki, samantalang ang kasunod na 'mga bata at mga babae' ay tahasang pinananatili.
- source_word: טַף וְנָשִׁים
  choice: pati mga bata at mga babae
  rationale: Tuwirang isinasaad ang pagsama sa mga bata at kababaihan; ang 'pati' ay natural na nag-uugnay nito sa saklaw na mula bata hanggang matanda.
- source_word: בְּיוֹם אֶחָד
  choice: sa loob ng isang araw
  rationale: Pinananatili ang diin na ang buong paglipol ay itinakdang mangyari sa iisang araw.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: sa ikalabintatlong araw ng ikalabindalawang buwan, samakatuwid ay ang buwan ng Adar
  rationale: Natural na anyo ng petsa sa Tagalog at malinaw na appositional na pagtukoy sa pangalan ng buwan.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: upang samsamin ang kanilang mga ari-arian bilang pandarambong
  rationale: Ipinakikita kapwa ang pagkilos na pagsamsam at ang katayuan ng mga ari-arian bilang samsam, nang hindi gumagamit ng alanganing tautolohiya sa Tagalog.
