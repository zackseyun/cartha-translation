    rationale: Maaaring tumukoy ito sa haba o tagal ng pagkilos. Ang בְּיוֹם אֶחָד ay mas tuwirang “sa isang araw,” na nagbibigay-diin sa iisang itinakdang araw.
  - severity: low
    issue: Paulit-ulit na pangatnig ng layunin bago ang huling pandiwa
    rationale: Ang “at upang samsamin” ay nauunawaan ngunit mas maayos ang koordinasyong “at samsamin,” yamang kapantay ito ng naunang mga infinitive ng layunin.
