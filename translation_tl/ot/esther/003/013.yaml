- from: Ipinadala sa pamamagitan ng mga sugo ang mga liham sa lahat ng lalawigan ng hari[a], upang lipulin, patayin, at puksain ang lahat ng Judio—mula sa kabataan hanggang sa matanda, pati mga bata at mga babae—sa loob ng isang araw, sa ikalabintatlong araw ng ikalabindalawang buwan, samakatuwid ay ang buwan ng Adar[b], at upang samsamin ang kanilang mga ari-arian bilang pandarambong.[c]
  to: Ipinadala sa pamamagitan ng mga sugo ang mga liham sa lahat ng lalawigan ng hari[a], upang lipulin, patayin, at puksain ang lahat ng Judio—mula sa kabataan hanggang sa matanda, pati mga bata at mga babae—sa isang araw, sa ikalabintatlong araw ng ikalabindalawang buwan, samakatuwid ay ang buwan ng Adar[b], at samsamin ang kanilang mga ari-arian bilang pandarambong.[c]
  rationale: Ginawa lamang ang dalawang maliit na pagbabago upang mas tumpak na maipahayag ang itinakdang iisang araw at upang luminaw ang sintaksis ng magkakaugnay na layunin ng kautusan. Walang binagong kahulugan, antas ng karahasan, o saklaw ng utos.
