translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pormal at mabagsik na himig ng kautusang maharlika, kasama ang tatluhang pandiwang nagpapatingkad sa ganap na paglipol. Ginamit ang 'Judio' bilang karaniwan at malinaw na katawagan sa modernong saling biblikal.
