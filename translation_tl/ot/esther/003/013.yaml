  verdict: revise
  source_fidelity: Tumpak na naihahatid ng salin ang pagpapadala ng mga liham sa pamamagitan ng mga tagapaghatid, ang tatluhang pandiwa ng marahas na utos, ang saklaw na lahat ng Judio ayon sa edad, mga bata at kababaihan, ang petsa, at ang pahintulot na samsamin ang kanilang mga ari-arian. Gayunman, ang “sa loob ng isang araw” ay maaaring magpahiwatig ng tagal ng isang araw, samantalang ang Hebreo ay nagtatalaga ng isang tiyak na araw na pagdarausan nito.
  naturalness: Mataas ang antas ng pagiging natural at angkop ang pormal na rehistro. Mas malinaw at mas tuwirang Tagalog ang “sa isang araw,” at hindi kailangan ang ikalawang “upang” bago ang huling pandiwa, dahil iisa ang saklaw ng layunin ng utos.
  terminology: Ang “mga sugo,” “mga liham,” “mga Judio,” “Adar,” at “samsamin ... bilang pandarambong” ay angkop. Napananatili ng “lipulin, patayin, at puksain” ang sinadyang pagpapatindi ng tatlong pandiwa sa Hebreo.
