  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: tl
  text: Humayo ang mga mensahero, na pinagmamadali ayon sa utos ng hari, at ipinalabas[a] ang kautusan sa kuta ng Susa. Naupo ang hari at si Haman upang uminom, ngunit naguluhan[b] ang lungsod ng Susa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ibinigay.” Maaari ring isalin ang parirala na “ibinigay ang batas sa kuta ng Susa.” Sa kontekstong administratibo ng Persia, ang דָּת ay maaaring mangahulugang “batas” o “kautusan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nabagabag” o “nagkagulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: mga mensahero
  rationale: Tumutukoy ito sa mga opisyal na tagapagdala ng mga utos ng hari. Mas natural sa makabagong Filipino ang “mga mensahero” kaysa sa literal na “mga mananakbo.”
- source_word: דְחוּפִים
  choice: pinagmamadali
  rationale: Ipinahihiwatig ng anyong Hebreo na may panlabas na awtoridad na nag-uudyok sa kanila na kumilos nang mabilis.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: ayon sa utos ng hari
  rationale: Ang דָּבָר dito ay isang makapangyarihang atas, hindi lamang binigkas na salita.
- source_word: הַדָּת
  choice: ang kautusan
  rationale: Sa kontekstong administratibo ng Persia, tumutukoy ito sa isang opisyal at may-bisang atas. Ang “kautusan” ay malinaw at marangal sa Filipino.
- source_word: נִתְּנָה
  choice: ipinalabas
  rationale: Bagaman literal na “ibinigay,” ipinapahayag dito ang pormal na paglalabas o pagpapahayag ng isang kautusan.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: kuta ng Susa
  rationale: Ang בִּירָה ay tumutukoy sa pinatibay na sentrong maharlika o administratibo, kaya ang “kuta ng Susa” ay maikli at malinaw.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: naupo ... upang uminom
  rationale: Pinananatili nito ang payak na larawan at ang matinding pagkakaiba sa pagitan ng pag-inom ng mga pinuno at ng kalagayan ng lungsod.
- source_word: נָבוֹכָה
  choice: naguluhan
  rationale: Sinasaklaw nito ang kolektibong pagkalito at pagkabagabag ng lungsod nang hindi labis na tinutukoy kung kaguluhan, sindak, o pagkalito lamang ang nangingibabaw.
- source_word: וְ
  choice: ngunit
  rationale: Bagaman karaniwang “at” ang pang-ugnay, malinaw na may pagsalungat sa salaysay sa pagitan ng pag-inom ng hari at ni Haman at ng pagkalito ng lungsod.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang opisyal na himig ng atas ng hari at ang matalim na pagsalungat sa pagitan ng pag-inom ng mga pinuno at ng pagkalito ng buong lungsod.
