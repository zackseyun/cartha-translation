translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “hari” at ang katawagang “mga lingkod” upang manatiling malapit sa anyo at diin ng Hebreo, habang ginawang natural ang ayos ng pangungusap sa Filipino.
