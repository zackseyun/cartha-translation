translation:
  language: tl
  text: Pagkatapos, sinabi ng mga lingkod ng hari na nasa tarangkahan ng hari kay Mardokeo, “Bakit mo nilalabag ang utos ng hari?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay; natural sa makabagong Filipino ang “Pagkatapos” bilang panandang pasalaysay.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: mga lingkod ng hari
  rationale: Ang עֶבֶד ay pangunahing tumutukoy sa lingkod o alipin. Sa kontekstong maharlikang ito, “mga lingkod” ang nagpapanatili sa katawagan ng Hebreo nang hindi ipinapalagay na sila ay mga aliping pag-aari.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: na nasa tarangkahan ng hari
  rationale: Tinutukoy ng parirala ang kanilang kinaroroonan sa sentrong pasukan ng palasyo o hukuman. Mas angkop dito ang “tarangkahan” kaysa karaniwang “pintuan.”
- source_word: לְמָרְדֳּכָי
  choice: kay Mardokeo
  rationale: Tuwirang katumbas ng panandang datibo para sa taong kinausap.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Natural at tuwirang tanong sa dahilan.
- source_word: אַתָּה עוֹבֵר
  choice: mo nilalabag
  rationale: Sa pagsama sa “utos,” ang עוֹבֵר ay nangangahulugang lumampas o sumuway sa itinakdang hangganan. Malinaw na naihahayag ng “nilalabag” ang diwang ito at ang aspektong nagpapatuloy o nakagawian sa konteksto.
- source_word: אֵת מִצְוַת הַמֶּלֶךְ
  choice: ang utos ng hari
  rationale: Ang מִצְוָה ay “utos.” Ang karaniwang “utos ng hari” ay tumpak sa kontekstong pampamahalaan at hindi nagbibigay ng di-kinakailangang relihiyosong kulay.
