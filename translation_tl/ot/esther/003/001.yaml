  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: tl
  text: Pagkatapos ng mga pangyayaring ito,[a] itinaas ni Haring Ahasuerus sa tungkulin si Haman na anak ni Hamedata, ang Agagita,[b] pinarangalan siya, at inilagay ang luklukan ni Haman nang higit sa lahat ng pinunong kasama ng hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pagkatapos ng mga bagay na ito.”
    reason: lexical_alternative
  - marker: b
    text: Pinananatili ng “Agagita” ang katawagang Hebreo at maaaring tumukoy sa lahi, angkan, o kaugnayang nakaugnay kay Agag.
    reason: cultural_note
  - marker: c
    text: Maaari ring “upuan,” na dito ay sagisag ng katungkulan at ranggo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Pagkatapos ng mga pangyayaring ito
  rationale: Likas na panandang temporal sa modernong Tagalog; ipinahihiwatig ng דְּבָרִים sa konteksto ang mga naganap, hindi lamang mga sinabi.
- source_word: גִּדַּל
  choice: itinaas ... sa tungkulin
  rationale: Sa konteksto ng korte, tumutukoy ito sa pagtataas ng katayuan o ranggo; malinaw at natural ito kaysa sa literal na “ginawang dakila.”
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Haring Ahasuerus
  rationale: Natural sa Tagalog ang titulong inuunahan ang pangalan; pinanatili ang nakaugaliang transliterasyon ng pangalan.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: si Haman na anak ni Hamedata
  rationale: Tahasan nitong pinananatili ang pangalan at patronimiko sa paraang natural sa Tagalog.
- source_word: הָאֲגָגִי
  choice: ang Agagita
  rationale: Pinananatili ang Hebreong katawagan bilang posibleng tanda ng lahi, angkan, o kaugnayan kay Agag nang hindi pinipili ang isang tiyak na pakahulugan.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: pinarangalan siya
  rationale: Iniiwasang ulitin lamang ang ideya ng pagtaas sa ranggo sa naunang pandiwa, habang pinananatili ang diwa ng pagpaparangal at pag-aangat.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: inilagay ang kanyang luklukan
  rationale: Ang כִּסֵּא ay maaaring upuan o luklukan ng kapangyarihan; ang “luklukan” ay marangal at angkop sa korte ngunit nilalagyan ng tala ang alternatibo.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: nang higit sa lahat ng pinuno
  rationale: Ipinapahayag nito ang nakahihigit na ranggo ni Haman sa ibang mga opisyal; ang “pinuno” ay malinaw at hindi labis na tiyak sa uri ng kanilang katungkulan.
- source_word: אֲשֶׁר אִתּוֹ
  choice: kasama ng hari
  rationale: Nililinaw ang malamang na tinutukoy ng panlalaping panghalip—ang hari—upang maiwasan ang malabong reperensiya sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “itinaas ... sa tungkulin” para sa kontekstong administratibo, habang pinanatili ang hiwalay na diwa ng kasunod na pandiwa sa “pinarangalan.” Ang mga marker na [a], [b], at [c] ay nasa mismong teksto.
