  to: Pagkatapos ng mga pangyayaring ito,[a] itinaas ni Haring Ahasuerus sa tungkulin si Haman na anak ni Hamedata, ang Agagita,[b] pinarangalan siya, at inilagay ang luklukan ni Haman nang higit sa lahat ng pinunong kasama ng hari.[c]
