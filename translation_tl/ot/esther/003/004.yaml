base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: tl
  text: At nang magsalita sila sa kanya araw-araw ngunit ayaw niya silang pakinggan, iniulat nila ito kay Haman upang tingnan kung mapaninindigan ang sinabi ni Mardokeo[a], sapagkat sinabi niya sa kanila na siya ay isang Judio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kung mananatili ang mga salita ni Mardokeo.” Maaaring tumukoy ito sa kung mapaninindigan ang paliwanag niya o kung mananatili ang kaniyang paninindigan sa kabila ng panggigipit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: At nang ... silang makiusap sa kanya
  rationale: Ang וַיְהִי na may ב plus infinitive construct ay nagsasaad ng temporal na paglipat. Sa konteksto, ang אמר ay hindi lamang neutral na pagsasalita kundi paulit-ulit na paghimok kay Mardokeo, kaya natural ang “makiusap.”
- source_word: יוֹם וָיוֹם
  choice: araw-araw
  rationale: Ipinahahayag ng inuulit na anyo ang patuloy at araw-araw na pagkilos.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: ngunit ayaw niya silang pakinggan
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o tumalima. Ipinakikita ng “ayaw” ang patuloy na pagtanggi sa gitna ng paulit-ulit nilang paghimok.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: isinumbong nila siya kay Haman
  rationale: Ang Hiphil ng נגד ay magpabatid o mag-ulat. Ang “isinumbong” ay likas sa Filipino at malinaw na ipinahihiwatig ang pag-uulat nila tungkol kay Mardokeo, bagaman hindi tahasang nakasaad ang layon sa Hebreo.
- source_word: לִרְאוֹת
  choice: upang malaman
  rationale: Ang infinitive ay nagpapahayag ng layunin. Sa Filipino, mas natural dito ang “upang malaman” kaysa literal na “upang makita,” yamang ang sinusubok ay kung ano ang mangyayari sa sinabi o paninindigan ni Mardokeo.
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: kung maninindigan ang mga sinabi ni Mardokeo
  rationale: Pinananatili ng “maninindigan” ang talinghaga ng עמד, ‘tumayo/manatiling matatag,’ at ang “mga sinabi” ay hindi nagpapasya kung ang tinutukoy ay paliwanag niya o ang pagpapatuloy ng kaniyang tindig.
- source_word: כִּי הִגִּיד לָהֶם
  choice: sapagkat sinabi niya sa kanila
  rationale: Nagbibigay ang כִּי ng dahilan kung bakit nila iniulat ang bagay kay Haman. Sapat na sa Filipino ang aspektong perpektibo upang ipakitang nauna ang pagsasabi niya.
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: na siya ay isang Judio
  rationale: Ang יְהוּדִי ay pangngalang tumutukoy sa pagkakakilanlang etniko at panrelihiyon; tuwirang katumbas nito ang “isang Judio.”
theological_decisions:
- issue: Dahilan ng pagtanggi ni Mardokeo
  choice: Hindi tahasang sinabi na ang pagiging Judio mismo ang teolohikal na dahilan ng hindi pagyukod.
  alternative: Ipaliwanag na ipinagbabawal ng pananampalatayang Judio ang ginawa.
  rationale: Sinasabi lamang ng talata na ipinabatid niyang siya ay Judio. Hindi nito nililinaw ang eksaktong kaugnayan ng kaniyang pagkakakilanlan sa pagtanggi, kaya hindi dapat dagdagan ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “Judio” bilang karaniwang katawagan sa Bibliya at pinanatili sa talababa ang tunay na kalabuan ng Hebreong talinghaga.
