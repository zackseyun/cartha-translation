  register: Makabagong, marangal, at madaling maunawaang Tagalog. Ginamit ang pormal na bokabularyong angkop sa isang kautusang imperyal, ngunit iniwasan ang salitang-salitang pag-uulit na hindi likas sa Tagalog. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
