base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: tl
  text: Ang sipi ng nakasulat na utos ay ilalabas bilang batas sa bawat lalawigan[a] at ihahayag sa lahat ng mga mamamayan, upang maging handa sila para sa araw na iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa bawat lalawigan at lalawigan.” Inuulit sa Hebreo ang “lalawigan” upang idiin ang bawat isang lalawigan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “para sa araw na ito,” na tumutukoy sa tiyak na araw na itinakda sa utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: sipi
  rationale: Ang salitang hiram sa Persiano ay tumutukoy sa sipi o kopya ng isang opisyal na dokumento; natural at angkop sa kontekstong administratibo ang “sipi.”
- source_word: הַכְּתָב
  choice: kasulatan
  rationale: Tumutukoy ito sa nakasulat na opisyal na dokumento. Pinananatili ng “kasulatan” ang anyong dokumentaryo nang hindi inuulit ang diwa ng batas na kasunod.
- source_word: לְהִנָּתֵן דָּת
  choice: ilalabas bilang batas
  rationale: Ipinahihiwatig ng pasibong pawatas ang opisyal na pagpapalabas, at ng דָּת ang bisa nito bilang batas.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: sa bawat lalawigan
  rationale: Ang pag-uulit sa Hebreo ay distributibo at nagbibigay-diin sa bawat isang lalawigan; likas na naipapahayag ito sa Tagalog sa “bawat lalawigan,” habang inilalagay sa talababa ang literal na anyo.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: ihahayag sa lahat ng mga bayan
  rationale: Ang גָּלוּי ay nagpapahiwatig ng hayag na pagpapabatid. Ang עַמִּים dito ay iba't ibang pangkat ng mga tao sa imperyo, kaya “mga bayan” sa halip na mga bansang malaya.
- source_word: לִהְיוֹת עֲתִדִים
  choice: upang maging handa sila
  rationale: Malinaw at natural nitong ipinapahayag ang layuning nakapaloob sa pawatas at pang-uri.
- source_word: לַיּוֹם הַזֶּה
  choice: para sa araw na iyon
  rationale: Literal itong “para sa araw na ito,” ngunit sa konteksto ay tumutukoy sa tiyak na araw na itinakda sa kautusan. Mas natural sa salaysay ng Tagalog ang “araw na iyon,” habang pinananatili sa talababa ang literal na alternatibo.
