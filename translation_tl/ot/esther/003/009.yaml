base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: tl
  text: Kung mamarapatin ng hari[a], ipasulat na lipulin sila. At magtitimbang ako ng sampung libong talento ng pilak[b] sa mga kamay ng mga gumaganap ng gawain[c], upang dalhin iyon sa mga kabang-yaman ng hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kung kalulugdan ng hari.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sampung libong talento ng pilak”—napakalaking halaga ng pilak na sinusukat ayon sa timbang, hindi bilang salaping barya.
    reason: cultural_note
  - marker: c
    text: O “sa pamamagitan ng mga gumaganap ng gawain”; maaaring tumukoy ito sa mga taong magsasagawa ng tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Kung mamarapatin ng hari
  rationale: Ang idyoma ay humihingi ng pagsang-ayon o pagkalugod ng hari. Natural at marangal sa modernong Filipino ang “Kung mamarapatin ng hari,” habang pinananatili ang pormal na pananalita sa korte.
- source_word: יִכָּתֵב
  choice: ipasulat
  rationale: Literal na tumutukoy sa pagpapasulat. Sa konteksto, ipinahihiwatig nito ang isang opisyal na kautusan nang hindi tahasang idinaragdag ang salitang “dekreto.”
- source_word: לְאַבְּדָם
  choice: na lipulin sila
  rationale: Malinaw nitong ipinahahayag ang nilalayong ganap na pagpatay o pagpuksa sa kanila, nang walang dagdag na dramatikong pagpapakahulugan.
- source_word: וַעֲשֶׂרֶת אֲלָפִים כִּכַּר כֶּסֶף
  choice: At ... sampung libong talento ng pilak
  rationale: Pinananatili ang bilang at ang sinaunang yunit ng timbang. Hindi ito kinokonbert sa isang tiyak ngunit mapagtatalunang modernong halaga.
- source_word: אֶשְׁקוֹל
  choice: magtitimbang ako
  rationale: Pinananatili ang konkretong kahulugan ng שקל na “tumimbang,” sapagkat ang pilak ay sinusukat ayon sa timbang.
- source_word: עַל יְדֵי
  choice: sa mga kamay ng
  rationale: Pinananatili ang larawang nasa Hebreo, habang ang talababa ay nagpapaliwanag na maaari rin itong magpahiwatig ng ahensiya o pamamagitan.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: mga nangangasiwa sa gawain
  rationale: Natural ito sa konteksto ng administrasyong maharlika ngunit hindi tinutukoy nang labis kung eksaktong sino ang mga taong ito.
- source_word: לְהָבִיא
  choice: upang dalhin iyon
  rationale: Tuwirang salin ng infinitive na “dalhin”; ang “iyon” ay tumutukoy sa pilak.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: mga kabang-yaman ng hari
  rationale: Pinananatili ang anyong maramihan ng Hebreo at gumagamit ng dignified ngunit madaling maunawaang ekspresyon sa Filipino.
