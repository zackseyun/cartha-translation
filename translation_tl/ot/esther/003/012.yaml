  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: tl
  text: 'Noong unang buwan, sa ikalabintatlong araw nito, ipinatawag ang mga eskriba ng hari. Isinulat ang lahat ayon sa iniutos ni Haman: para sa mga satrapa ng hari, sa mga gobernador na namamahala sa bawat lalawigan, at sa mga pinuno ng bawat pangkat ng mga tao; para sa bawat lalawigan ayon sa paraan nito ng pagsulat[a], at para sa bawat pangkat ng mga tao ayon sa wika nito. Isinulat ito sa pangalan ni Haring Ahasuero at tinatakan ng singsing-panatak ng hari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “paraan ng pagsulat” ay tumutukoy sa sistema o anyo ng pagsulat na ginagamit ng bawat lalawigan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ
  choice: ipinatawag
  rationale: Ang Niphal ay pasibo rito; natural at pormal sa makabagong Filipino ang “ipinatawag” para sa pagtitipon ng mga opisyal.
- source_word: סֹפְרֵי הַמֶּלֶךְ
  choice: mga eskriba ng hari
  rationale: Tumutukoy ito sa mga opisyal na tagasulat sa korte; pinananatili ng “eskriba” ang tiyak na sinaunang tungkulin.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: noong ikalabintatlong araw ng unang buwan
  rationale: Likas na ayos sa Filipino at tumpak na pinagsasama ang buwan at araw nang walang pagdaragdag ng pangalan ng buwan.
- source_word: וַיִּכָּתֵב
  choice: Isinulat nila
  rationale: Bagaman pasibo ang Hebreo, ang mga eskribang katatawag lamang ang malinaw na gumaganap; natural ito sa Filipino at hindi nagdaragdag ng tahasang pangngalang gaya ng “kautusan.”
- source_word: כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: ang lahat ayon sa iniutos ni Haman
  rationale: Pinananatili ang saklaw ng כְּכָל at ang pormal na diwa ng pagsunod sa utos.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: mga satrapa ng hari
  rationale: Ang “satrapa” ang tiyak na terminong pangkasaysayan para sa mataas na opisyal na Persiano at naihihiwalay ito sa kasunod na mga gobernador.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: mga gobernador na namamahala sa bawat lalawigan
  rationale: Malinaw na ipinapahayag ang nakabababang katungkulang administratibo at ang distributibong “bawat lalawigan.”
- source_word: שָׂרֵי עַם וָעָם
  choice: mga pinuno ng bawat bayan
  rationale: Ang שָׂרִים ay maaaring mga opisyal o pinuno; “pinuno” ay malinaw at hindi labis na tumutukoy sa isang modernong posisyon.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: sa bawat lalawigan ayon sa sarili nitong sistema ng pagsulat
  rationale: Ang כְּתָב ay tumutukoy sa script o sistema ng pagsulat, hindi lamang sa nilalaman ng sulat.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: sa bawat bayan ayon sa sarili nitong wika
  rationale: Tumpak at likas na paglilipat ng distributibong parirala at ng לָשׁוֹן bilang wika.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: tinatakan ng singsing-panatak ng hari
  rationale: Ipinapakita ng “singsing-panatak” na ang singsing ang kasangkapang naglalagay ng opisyal na tatak.
