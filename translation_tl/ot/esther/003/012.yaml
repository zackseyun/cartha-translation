review_pass:
  verdict: revise
  source_fidelity: Kailangang iwasto ang tahasang paglalagay ng aktibong tagaganap sa “Isinulat nila” at ang pandiwang “ipinadala,” na wala sa Hebreo. Pasibo ang וַיִּכָּתֵב at ang talata ay nagsasabing isinulat ang dokumento ayon sa lahat ng iniutos ni Haman; hindi nito tahasang sinasabing ipinadala ito. Napananatili ng rebisyon ang mga antas ng administrasyon, ang pag-uulit na ‘bawat,’ at ang pagsulat sa pangalan ng hari at pagtatatak sa singsing-panatak.
  naturalness: Ang rebisyon ay gumagamit ng malinaw at marangal na makabagong Filipino. Ang “sa paraan nito ng pagsulat” ay mas likas kaysa “ayon sa sarili nitong sistema ng pagsulat,” habang malinaw pa ring tinutukoy ang script.
  terminology: Ang “mga eskriba,” “mga satrapa,” “mga gobernador,” at “singsing-panatak” ay angkop sa kontekstong panghukuman at pang-administratibo. Isinalin ang עַם bilang “pangkat ng mga tao” upang maiwasan ang posibleng pagbasa sa “bayan” bilang isang lugar o munisipalidad.
  issues:
  - severity: high
    issue: Ginawang aktibo ang pasibong pandiwa at idinagdag ang pagpapadala.
    rationale: Ang “Isinulat nila” ay tahasang nagtatalaga ng mga eskriba bilang gumaganap, samantalang pasibo ang וַיִּכָּתֵב. Ang “ipinadala” ay dagdag na kilos na wala sa talata.
  - severity: low
    issue: Hindi gaanong tiyak ang paliwanag ng talababa tungkol sa script.
    rationale: Ang “natatanging mga titik o paraan” ay maaaring magpahiwatig na magkakaibang alpabeto lamang ang tinutukoy. Mas tumpak ang ‘paraan o sistema ng pagsulat.’
  revised_text: 'Noong unang buwan, sa ikalabintatlong araw nito, ipinatawag ang mga eskriba ng hari. Isinulat ang lahat ayon sa iniutos ni Haman: para sa mga satrapa ng hari, sa mga gobernador na namamahala sa bawat lalawigan, at sa mga pinuno ng bawat pangkat ng mga tao; para sa bawat lalawigan ayon sa paraan nito ng pagsulat[a], at para sa bawat pangkat ng mga tao ayon sa wika nito. Isinulat ito sa pangalan ni Haring Ahasuero at tinatakan ng singsing-panatak ng hari.'
