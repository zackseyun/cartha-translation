revisions:
- from: Kaya ipinatawag ang mga eskriba ng hari noong ikalabintatlong araw ng unang buwan. Isinulat nila ang lahat ayon sa iniutos ni Haman at ipinadala sa mga satrapa ng hari, sa mga gobernador na namamahala sa bawat lalawigan, at sa mga pinuno ng bawat bayan—sa bawat lalawigan ayon sa sarili nitong sistema ng pagsulat[a], at sa bawat bayan ayon sa sarili nitong wika. Isinulat ito sa pangalan ni Haring Ahasuero at tinatakan ng singsing-panatak ng hari.
  to: 'Noong unang buwan, sa ikalabintatlong araw nito, ipinatawag ang mga eskriba ng hari. Isinulat ang lahat ayon sa iniutos ni Haman: para sa mga satrapa ng hari, sa mga gobernador na namamahala sa bawat lalawigan, at sa mga pinuno ng bawat pangkat ng mga tao; para sa bawat lalawigan ayon sa paraan nito ng pagsulat[a], at para sa bawat pangkat ng mga tao ayon sa wika nito. Isinulat ito sa pangalan ni Haring Ahasuero at tinatakan ng singsing-panatak ng hari.'
  rationale: Inalis ang hindi ipinahihiwatig na aktibong tagaganap at ang idinagdag na pagpapadala. Pinanatili ang pasibong paglalarawan ng pagsulat, ang saklaw ng ‘lahat ng iniutos ni Haman,’ ang magkakaibang opisyal, at ang distribusyon ayon sa paraan ng pagsulat at wika.
