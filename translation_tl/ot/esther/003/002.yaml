  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: tl
  text: At ang lahat ng lingkod ng hari na nasa tarangkahan ng hari ay yumuyukod at nagpapatirapa sa harap ni Haman[a], sapagkat gayon ang iniutos ng hari tungkol sa kanya[b]. Ngunit ayaw yumukod ni Mardokeo o magpatirapa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbibigay-pugay kay Haman.” Ang pandiwang Hebreo ay maaari ding isaling “sumasamba” kapag Diyos ang pinatutungkulan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sapagkat gayon ang iniutos ng hari sa kanya,” bagaman mas malamang na si Haman ang tinutukoy—samakatuwid, ang utos ay tungkol sa parangal na dapat ibigay sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Karaniwang tumutukoy ang עֶבֶד sa lingkod; sa konteksto ng palasyo, saklaw nito ang mga tauhan ng hari nang hindi ipinapalagay na alipin silang lahat o na pawang matataas na opisyal.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: nasa pintuang-daan ng hari
  rationale: Pinananatili nito ang kongkretong lugar na kaugnay ng pampubliko at administratibong gawain ng korte.
- source_word: כֹּרְעִים
  choice: yumuyukod
  rationale: Ang participle ay nagsasaad ng nakagawian o paulit-ulit na kilos; likas sa Filipino ang pangkasalukuyang anyong ito sa ganitong pagsasalaysay.
- source_word: וּמִשְׁתַּחֲוִים
  choice: nagpapatirapa
  rationale: Ipinahahayag nito ang pisikal na pagpugay o pagpapasakop nang hindi agad tinatawag na pagsamba ang kilos sa isang tao.
- source_word: לְהָמָן
  choice: sa harap ni Haman
  rationale: Natural na Filipino ito para sa taong pinatutungkulan ng pagpapatirapa at malinaw na ipinakikita ang kilos ng pagpugay.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: sapagkat gayon ang iniutos ng hari tungkol sa kanya
  rationale: 'Mas malamang na si Haman ang tinutukoy ng לוֹ: ang utos ay tungkol sa parangal na dapat igawad sa kanya. Pinananatili sa talababa ang posibleng pagbasa na siya mismo ang inutusan.'
- source_word: וּמָרְדֳּכַי
  choice: Ngunit ... si Mardokeo
  rationale: Bagaman literal na pang-ugnay ang וְ, malinaw na salungat ang kilos ni Mardokeo sa ginagawa ng lahat ng iba pa.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: ayaw yumukod ... o magpatirapa
  rationale: Ipinahahayag ng mga imperfect ang patuloy at sinasadyang pagtanggi ni Mardokeo, hindi lamang isang minsanang hindi pagkilos.
theological_decisions:
- issue: Kung ang הִשְׁתַּחֲוָה ay dapat isaling gamit ang tahasang panrelihiyong salitang “sumamba”
  choice: Isinaling “nagpapatirapa/magpatirapa,” na nagpapahayag ng matinding pagpugay sa tao nang hindi ipinapalagay na pagsambang panrelihiyon iyon.
  alternative: sumasamba/sumamba; nagbibigay-galang/magbigay-galang
  rationale: Maaaring tumukoy ang pandiwa sa pagsamba sa Diyos o sa pagpapatirapa sa harap ng tao. Dahil si Haman ang pinatutungkulan dito, hindi dapat ipasok sa salin ang isang teolohikong pagpapakahulugang hindi tahasang hinihingi ng konteksto; pinananatili ng talababa ang mas malawak na saklaw ng salita.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pintuang-daan” upang ipakita na isang kilalang lugar sa korte ang tinutukoy, hindi lamang karaniwang pinto. Pinili ang “nagpapatirapa” upang mapanatili ang pisikal at seremonyal na bigat ng kilos at ang likas na kalabuan nito sa pagitan ng pagpugay at pagsamba. Ginamit ang tradisyonal at malawak na kinikilalang anyong “Mardokeo.”
