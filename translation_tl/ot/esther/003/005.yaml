  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: tl
  text: Nang makita ni Haman na si Mordecai ay hindi yumuyukod ni nagpapatirapa sa harap niya[a], napuno ng matinding galit si Haman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “yumuyukod” at “nagbibigay-galang.” Gumagamit ang Hebreo ng dalawang magkaugnay ngunit magkaibang pandiwa para sa mga kilos ng pagpapakumbaba at pagpaparangal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita ni Haman
  rationale: Isinusulong ng waw-consecutive ang salaysay, at likas na ipinahahayag ng “Nang makita” ang temporal na ugnayan sa kasunod na reaksiyon ni Haman.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: na si Mordecai ay hindi
  rationale: Ang אֵין kasama ng mga participle ay nagsasaad ng patuloy na hindi paggawa; isinaayos ito ayon sa likas na balangkas ng Filipino.
- source_word: כֹּרֵעַ
  choice: yumuyukod
  rationale: Ang כרע ay tumutukoy sa pagbaluktot ng tuhod o pagyukod. Ang “yumuyukod” ay angkop sa konteksto ng pagpaparangal sa korte nang hindi nililimitahan ang kilos sa pagluhod lamang.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: ni nagpapatirapa
  rationale: Ang השתחוה ay karaniwang tumutukoy sa pagpapatirapa o pisikal na pagpapakumbaba. Pinananatili ng “nagpapatirapa” ang mas matinding kilos ng katawan at ang pagkakaiba nito sa “yumuyukod.”
- source_word: לוֹ
  choice: sa harap niya
  rationale: Bagaman literal na “sa kaniya,” likas sa Filipino na ilarawan ang ganitong kilos bilang ginagawa “sa harap niya.”
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: napuno ng matinding galit
  rationale: Pinananatili ang idyomang “napuno ng,” habang ipinahahayag ng “matinding galit” ang tindi ng חֵמָה sa natural at makabagong Filipino.
- source_word: חֵמָה
  choice: matinding galit
  rationale: Malinaw nitong ipinahahayag ang marahas at matinding emosyon ni Haman nang hindi nagdaragdag ng di-tiyak na teolohikal na kahulugan.
theological_decisions: []
