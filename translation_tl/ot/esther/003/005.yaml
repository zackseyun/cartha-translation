  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang magkaibang kilos sa Hebreo sa pamamagitan ng “yumuyukod” at “nagpapatirapa,” at iniwasang gawing sobrang teknikal ang pananalita.
