  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: tl
  text: Sinabi ni Haman kay Haring Ahasuero, “May isang pangkat ng mga tao na nakakalat at nakahiwalay sa gitna ng mga pangkat ng tao sa lahat ng lalawigan ng iyong kaharian. Ang kanilang mga batas ay naiiba sa mga batas ng lahat ng ibang pangkat, at hindi nila sinusunod ang mga batas ng hari. Kaya hindi makabubuti sa hari na hayaan silang manatili.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pabayaan sila” o “pagtiisan sila.” Ang pandiwang Hebreo ay maaaring mangahulugang hayaan ang isang tao o pahintulutan siyang manatiling hindi ginagambala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: May isang lahi
  rationale: Likas itong panimula sa Filipino para sa isang tiyak ngunit hindi pinangalanang pangkat; pinananatili nito ang mapagparatang at sadyang malabong tono ni Haman.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: nakakalat at nakahiwalay
  rationale: Kapuwa participle ay isinalin. Ang “nakahiwalay” ay nagpapahayag ng pagiging bukod sa iba nang hindi ipinapalagay na watak-watak sila sa loob ng sarili nilang pangkat.
- source_word: בֵּין הָעַמִּים
  choice: sa gitna ng mga lahi
  rationale: Sa kontekstong imperyal, tumutukoy ito sa maraming pangkat-etniko o populasyon, hindi sa mga bansang-estado; natural dito ang “mga lahi” sa modernong Filipino.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: sa lahat ng lalawigan ng iyong kaharian
  rationale: Ang מְדִינוֹת sa Esther ay mga administratibong lalawigan; tuwiran at likas ang parirala sa Filipino.
- source_word: דָתֵיהֶם
  choice: kanilang mga batas
  rationale: Pinananatili ng “mga batas” ang legal na bigat at ang tahasang paghahambing sa mga batas ng hari.
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: naiiba sa mga batas ng lahat ng ibang lahi
  rationale: Nililinaw ng pag-uulit sa “mga batas” na mga batas ang pinaghahambing, gaya ng ipinahihiwatig ng Hebreo; ang “ibang” ay natural na nagpapahayag ng comparative force.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: hindi nila sinusunod ang mga batas ng hari
  rationale: Ang עָשָׂה kasama ng “mga batas” ay nangangahulugang sundin o tuparin; “sinusunod” ang pinakanatural sa Filipino.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: hindi makabubuti sa hari
  rationale: Ipinahahayag nito ang kawalan ng pakinabang o kapakanan para sa hari at pinananatili ang mapanghikayat na pang-ekonomiya/pampolitikang apela ni Haman.
- source_word: לְהַנִּיחָם
  choice: na hayaan silang manatili
  rationale: Sinasaklaw nito ang diwa ng pagpapabaya o pagpapahintulot na magpatuloy sila, nang hindi agad pinatitindi tungo sa “pagtiisan” o tahasang paglipol.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lahi” para sa עַם bilang pangkat-etniko sa loob ng imperyo, at pinanatili ang magkatambal na “nakakalat at nakahiwalay.” Ang panghalip na “iyong” ay angkop sa tuwirang pormal na pakikipag-usap sa hari. Inilagay ang footnote marker [a] kaagad pagkatapos ng pariralang may leksikal na kalabuan.
