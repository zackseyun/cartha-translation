  to: Sinabi ni Haman kay Haring Ahasuero, “May isang pangkat ng mga tao na nakakalat at nakahiwalay sa gitna ng mga pangkat ng tao sa lahat ng lalawigan ng iyong kaharian. Ang kanilang mga batas ay naiiba sa mga batas ng lahat ng ibang pangkat, at hindi nila sinusunod ang mga batas ng hari. Kaya hindi makabubuti sa hari na hayaan silang manatili.[a]”
