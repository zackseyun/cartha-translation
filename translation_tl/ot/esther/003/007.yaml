base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: tl
  text: Sa unang buwan, na siyang buwan ng Nisan, sa ikalabindalawang taon ng paghahari ni Haring Ahasuerus, inihagis ang Pur—ibig sabihin, ang sapalaran—sa harap ni Haman, mula araw hanggang araw at mula buwan hanggang buwan, hanggang sa ikalabindalawang buwan, na siyang buwan ng Adar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mula sa araw tungo sa araw at mula sa buwan tungo sa buwan, labindalawa, na siyang buwan ng Adar.” Ipinahihiwatig ng konteksto na ang paghahagis ng sapalaran ay umabot hanggang sa ikalabindalawang buwan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Sa unang buwan
  rationale: Likas na panandang pamanahon sa Tagalog at pinananatili ang balangkas ng kalendaryo.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: na siyang buwan ng Nisan
  rationale: Ipinakikita ang paliwanag na apposisyon ng Hebreo nang malinaw at marangal sa modernong Tagalog.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: sa ikalabindalawang taon ng paghahari ni Haring Ahasuerus
  rationale: Likas na paraan sa Tagalog ng pagtukoy sa taon ng paghahari; nililinaw lamang ang relasyong likas sa pormulang Hebreo.
- source_word: הִפִּיל פּוּר
  choice: inihagis ang Pur
  rationale: Pinananatili ang sinaunang idyoma ng paghahagis ng sapalaran at hindi nagdaragdag ng tahasang gumagawa, yamang walang malinaw na simuno sa pangungusap.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: ang Pur—ibig sabihin, ang sapalaran
  rationale: Pinananatili ang salitang hiram na Persian na Pur at ang kasunod nitong tahasang paliwanag sa karaniwang salitang Hebreo; ang “sapalaran” ay maikli at angkop na katumbas ng bagay na inihahagis upang magpasya.
- source_word: לִפְנֵי הָמָן
  choice: sa harap ni Haman
  rationale: Tumpak at likas na katumbas ng “sa harap” o “sa presensiya” ni Haman.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: para sa sunod-sunod na mga araw at buwan
  rationale: Inihahatid sa likas na Tagalog ang progresibong pagsusuri ng mga araw at buwan, habang iniiwasan ang napakailang literal na “mula sa araw tungo sa araw.”
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: hanggang sa ikalabindalawang buwan, na siyang buwan ng Adar
  rationale: Ginagawang malinaw ang patutunguhan ng progresibong parirala ayon sa konteksto, habang itinatala sa talababa ang mas putol na anyo ng Hebreo.
