translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Pinanatili ang mga pangalang Nisan, Adar, Ahasuerus, Haman, at ang salitang Pur. Hinati sa dalawang pangungusap ang mahabang sugnay upang maging malinaw, at ginamit ang “sapalaran” para sa sinaunang lot nang hindi ipinapalagay ang paraan o teolohiya sa likod nito.
