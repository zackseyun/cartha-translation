base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: tl
  text: Ngunit minamaliit ni Haman ang pagbuhat ng kamay laban kay Mardokeo lamang[a], sapagkat sinabi sa kanya kung aling bayan ang kinabibilangan ni Mardokeo. Kaya hinangad ni Haman na lipulin ang lahat ng Judio sa buong kaharian ni Ahasuerus—ang bayan ni Mardokeo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang bayan ni Mardokeo”; ibig sabihin, ang bayang kinabibilangan ni Mardokeo.
    reason: Nililinaw nito ang literal na anyo ng unang paglitaw ng pariralang Hebreo, na isinaling paliwanag sa pangunahing teksto upang hindi magmukhang bayang pag-aari ni Mardokeo.
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: sa paningin ni Haman, napakaliit na bagay
  rationale: 'Pinananatili nito ang larawang ‘sa kanyang mga mata’ at ang diwa ng paghamak: itinuring ni Haman na napakaliit o kulang ang pagtutuon kay Mardokeo lamang.'
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: pagbuhatan ng kamay
  rationale: Likas na idyomang Filipino ito para sa marahas na pagkilos laban sa isang tao at pinananatili ang konkretong larawan ng Hebreo.
- source_word: לְבַדּוֹ
  choice: lamang
  rationale: Malinaw nitong itinatampok ang kaibahan sa pagitan ng nag-iisang si Mardokeo at ng buong bayang pinuntirya ni Haman.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: kung saang bayan kabilang si Mardokeo
  rationale: Nililinaw sa unang paglitaw na ang ‘bayan ni Mardokeo’ ay ang kanyang pangkat-etniko o sambayanan, hindi isang bayang pag-aari niya.
- source_word: וַיְבַקֵּשׁ
  choice: binalak
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang sinadyang hangarin ni Haman, nang hindi sinasabing naisakatuparan na niya ito.
- source_word: לְהַשְׁמִיד
  choice: lipulin
  rationale: Ang ‘lipulin’ ay natural at mariing nagpapahayag ng lubusang pagwasak na ipinahihiwatig ng Hiphil ng שׁמד.
- source_word: כָּל הַיְּהוּדִים
  choice: lahat ng Judio
  rationale: Tumutukoy ito sa sambayanang Judio sa imperyong Persiano, hindi lamang sa mga naninirahan sa Juda.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: sa buong kaharian ni Ahasuerus
  rationale: Maikli at likas itong naghahatid ng saklaw ng lahat ng Judiong nasa iba’t ibang bahagi ng kaharian.
- source_word: עַם מָרְדֳּכָי
  choice: ang bayan ni Mardokeo
  rationale: Pinananatili sa hulihan ang literal na pag-uulit ng Hebreo bilang appositional na pagbibigay-diin.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘pagbuhatan ng kamay’ upang mapanatili ang idyoma at larawang Hebreo, at ‘lipulin’ upang ihayag ang tindi ng planong pagwasak nang gumamit ng makabagong teknikal na termino.
