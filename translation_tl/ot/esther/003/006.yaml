revisions:
- from: Ngunit sa paningin ni Haman, napakaliit na bagay ang pagbuhatan ng kamay si Mardokeo lamang, sapagkat sinabi sa kanya kung saang bayan kabilang si Mardokeo. Kaya binalak ni Haman na lipulin ang lahat ng Judio sa buong kaharian ni Ahasuerus—ang bayan ni Mardokeo.[a]
  to: Ngunit minamaliit ni Haman ang pagbuhat ng kamay laban kay Mardokeo lamang[a], sapagkat sinabi sa kanya kung aling bayan ang kinabibilangan ni Mardokeo. Kaya hinangad ni Haman na lipulin ang lahat ng Judio sa buong kaharian ni Ahasuerus—ang bayan ni Mardokeo.
  rationale: Pinalitan ang pagbubukas upang maipahayag ang paghamak ni Haman sa pag-atake kay Mardokeo lamang, nang mapanatili ang konkretong idyomang 'pagbuhat ng kamay laban.' Ginawang 'hinangad' ang וַיְבַקֵּשׁ upang ipakita ang sinadyang layunin nang hindi ipahiwatig na naisakatuparan na ito. Inilipat ang talababa sa pinalawak na unang paglitaw ng 'bayan ni Mardokeo.'
