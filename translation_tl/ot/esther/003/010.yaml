  text: וַ/יָּ֧סַר הַ/מֶּ֛לֶךְ אֶת טַבַּעְתּ֖/וֹ מֵ/עַ֣ל יָד֑/וֹ וַֽ/יִּתְּנָ֗/הּ לְ/הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י צֹרֵ֥ר הַ/יְּהוּדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: tl
  text: Kaya hinubad ng hari sa kanyang kamay ang kanyang singsing na pantatak at ibinigay iyon kay Haman na anak ni Hamedata, ang Agagita, na kaaway ng mga Judio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga taga-Juda.” Ang Hebreong יְהוּדִים ay maaaring tumukoy sa mga Judio bilang isang bayan o, sa ilang konteksto, sa mga tao mula sa Juda o Judea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: hinubad
  rationale: Ang pandiwa ay nangangahulugang mag-alis o kumuha. Dahil singsing ang bagay at mula sa kamay ito inalis, natural at tiyak sa Filipino ang “hinubad.”
- source_word: טַבַּעְתּוֹ
  choice: kanyang singsing na pantatak
  rationale: Sa konteksto ng korte, ito ay singsing na ginagamit bilang opisyal na tatak, hindi lamang palamuti. Nililinaw ng “singsing na pantatak” ang tungkuling pampamahalaan nito.
- source_word: מֵעַל יָדוֹ
  choice: sa kanyang kamay
  rationale: Kasama ng “hinubad,” natural nitong ipinapahayag na inalis ng hari ang singsing mula sa sarili niyang kamay habang pinananatili ang larawan sa Hebreo.
- source_word: וַיִּתְּנָהּ
  choice: ibinigay iyon
  rationale: Tuwirang salin ng נתן at ng hulaping tumutukoy pabalik sa singsing. Ang “iyon” ay malinaw at natural sa Filipino.
- source_word: לְהָמָן
  choice: kay Haman
  rationale: Ginamit ang karaniwang anyong Filipino para sa personal na pangalang pinagbigyan.
- source_word: בֶּן הַמְּדָתָא
  choice: anak ni Hamedata
  rationale: Literal na pinanatili ang patronimiko at isinatitik ang pangalan sa paraang madaling bigkasin sa Filipino.
- source_word: הָאֲגָגִי
  choice: ang Agagita
  rationale: Pinananatili ang katawagang tumutukoy sa angkan o pinagmulan at ang ugnay nito kay Agag nang walang dagdag na interpretasyon.
- source_word: צֹרֵר
  choice: kaaway
  rationale: Ang participle ay tumutukoy sa isang kumakalaban o nagpapakita ng pagkapoot. Ang “kaaway” ang pinakanatural at matibay na katumbas sa konteksto.
- source_word: הַיְּהוּדִים
  choice: mga Judio
  rationale: Sa Ester, tumutukoy ito sa kinikilalang bayang etniko na pinupuntirya sa salaysay. Ang “mga Judio” ang malinaw at karaniwang tawag sa modernong Filipino, habang inilalagay sa talababa ang posibleng heograpikong pagbasa.
- source_word: וַ
  choice: Kaya
  rationale: Ipinagpapatuloy ng waw ang salaysay at dito ay lohikal na bunga ng naunang pahayag. Natural na ipinakikita ng “Kaya” ang ugnayang iyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “singsing na pantatak” upang maunawaan ng karaniwang mambabasa ang opisyal na gamit ng bagay, at pinanatili ang mga pangalang pantangi at katawagang “Agagita” nang walang pagpapalawak na interpretatibo.
