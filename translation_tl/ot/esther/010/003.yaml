base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: tl
  text: Sapagkat si Mardokeo na Judio ay pangalawa sa ranggo kay Haring Ahasuerus. Dakila siya sa mga Judio at kinalulugdan ng karamihan sa kanyang mga kapatid[a][b]. Hinahangad niya ang ikabubuti ng kanyang bayan at nagsasalita ng kapayapaan sa lahat ng kanyang mga inapo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ng napakarami niyang mga kapatid.” Ang Hebreong parirala ay maaaring tumukoy sa nakararami o sa isang malaking bilang.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga kapatid” dito ay tumutukoy sa mga kapwa Judio o mga kababayan ni Mardokeo, hindi lamang sa literal niyang mga kapatid na lalaki.
    reason: lexical_alternative
  - marker: c
    text: O “sa lahat ng kanyang supling.” Ang Hebreong salita ay isang kolektibong katawagan para sa mga inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag na ugnayan ng talata sa naunang buod tungkol sa kadakilaan at kapangyarihan ni Mardokeo.
- source_word: הַיְּהוּדִי
  choice: na Judio
  rationale: Tumutukoy sa etniko at panrelihiyong pagkakakilanlan ni Mardokeo sa kontekstong Persiano; mas likas ito kaysa sa heograpikong “Judeano.”
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  choice: pangalawa sa ranggo kay Haring Ahasuerus
  rationale: Malinaw na ipinahahayag ang pagiging ikalawa niya sa hari nang hindi nag-aangkat ng tiyak na titulong pampamahalaan gaya ng “bisir.”
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: Dakila siya sa mga Judio
  rationale: Inilalarawan ang mataas niyang katayuan at pagkilala sa loob ng pamayanang Judio habang nananatiling malapit sa larawan ng Hebreong גָּדוֹל.
- source_word: וְרָצוּי
  choice: kinalulugdan
  rationale: Ipinahahayag ang pagtanggap at pagsang-ayon ng komunidad sa natural at marangal na Tagalog.
- source_word: לְרֹב אֶחָיו
  choice: ng karamihan sa kanyang mga kapatid
  rationale: Ang רֹב ay maaaring tumukoy sa nakararami o sa isang malaking bilang. Ginamit sa teksto ang likas na “karamihan,” at pinanatili sa talababa ang saklaw ng leksikal na posibilidad.
- source_word: אֶחָיו
  choice: kanyang mga kapatid
  rationale: Pinananatili ang pampamilyang salita ng Hebreo; nililinaw sa talababa na ang tinutukoy sa konteksto ay mga kapwa Judio o kababayan, hindi lamang literal na magkakapatid.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: Hinahangad niya ang ikabubuti ng kanyang bayan
  rationale: Ipinakikita ang aktibong paghahanap at pagtataguyod ni Mardokeo sa kapakanan ng kanyang mga kababayan.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: nagsasalita ng kapayapaan
  rationale: Pinananatili ang Hebreong idyoma at ang malawak na diwa ng שָׁלוֹם—kapayapaan, kagalingan, at maayos na kalagayan—nang hindi ito pinaliliit sa isang interpretasyon lamang.
- source_word: לְכָל זַרְעוֹ
  choice: sa lahat ng kanyang mga inapo
  rationale: Ang זֶרַע ay kolektibong katawagan sa supling o mga inapo. Ang “mga inapo” ay malinaw sa modernong Tagalog at hindi kasing-opako ng literal na “binhi.”
