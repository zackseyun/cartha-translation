translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang anyong retorikal ng Hebreo at ang estilong pangkronika. Inilagay ang paliwanag na “kung paano siya itinaas ng hari” sa pagitan ng mga gitling upang luminaw ang ugnayan nito sa kadakilaan ni Mardokeo nang hindi binabago ang diwa.
