base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: tl
  text: At ang lahat ng ginawa niya na nagpapakita ng kanyang kapangyarihan at lakas, at ang buong salaysay tungkol sa kadakilaan ni Mardokeo, na pinadakila ng hari—hindi ba nakasulat ang mga iyon sa Aklat ng mga Talaan ng mga Hari ng Media at Persia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Aklat ng mga Annal ng mga Hari ng Media at Persia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: mga ginawa
  rationale: Malawak ang saklaw ng salita para sa mga kilos o gawa; natural sa makabagong Tagalog ang “mga ginawa” sa isang buod na pangkasaysayan.
- source_word: תָקְפּוֹ
  choice: kanyang kapangyarihan
  rationale: Sa kontekstong maharlika, tumutukoy ito sa mabisa at pampolitikang kapangyarihan ng hari, hindi lamang sa pisikal na lakas.
- source_word: גְבוּרָתוֹ
  choice: lakas
  rationale: Kaagapay ng תָקְפּוֹ, ipinahahayag nito ang lakas o kapangyarihang naipamalas. Pinananatili ng “kapangyarihan at lakas” ang pares nang hindi ginagawang lubhang teknikal.
- source_word: וּפָרָשַׁת
  choice: ang buong salaysay
  rationale: Ipinahihiwatig ng pangngalan ang isang ganap o detalyadong paglalahad; malinaw at likas sa Tagalog ang “buong salaysay.”
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: kadakilaan ni Mardokeo
  rationale: Pinananatili nito ang pormal na anyo ng pariralang Hebreo at maaaring tumukoy sa mataas na katayuan at karangalan ni Mardokeo.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: kung paano siya itinaas ng hari
  rationale: Ang piel ng גדל ay nangangahulugang gawing dakila o itaas sa katungkulan. Malinaw na ipinahahayag ng salin ang pag-angat ni Mardokeo sa ranggo.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: hindi ba nakasulat ang mga iyon
  rationale: Pinananatili nito ang retorikal na tanong at ang nakaugaliang pormula ng biblikal na pagsulat ng kasaysayan.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Aklat ng mga Talaan
  rationale: Tumutukoy ito sa opisyal na kronika o mga annal. Ang “mga Talaan” ay malinaw, marangal, at angkop bilang pamagat ng opisyal na rekord.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: ng mga Hari ng Media at Persia
  rationale: Sa pormulang pamagat na ito, natural na ipinahahayag ng “ng” ang rekord na nauukol sa mga paghahari ng mga hari ng Media at Persia.
