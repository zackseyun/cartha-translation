    rationale: Ang pariralang “ginawa niya sa kanyang kapangyarihan at lakas” ay mas madaling unawain bilang paraan o kasangkapan ng paggawa. Ang Hebreo ay tumutukoy sa mga gawang nagpapamalas ng kapangyarihan at lakas ng hari.
  - severity: low
    issue: Ang “Taunang Ulat” ay hindi ang pinakamalapit na alternatibo para sa mga annal/kronika.
    rationale: Ang mga annal ay mga rekord na nakaayos ayon sa panahon o taon, ngunit hindi kinakailangang mga taunang ulat sa makabagong diwa.
