  text: וַ/יָּשֶׂם֩ הַ/מֶּ֨לֶךְ אחשרש מַ֛ס עַל הָ/אָ֖רֶץ וְ/אִיֵּ֥י הַ/יָּֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: tl
  text: Nagpataw si Haring Ahasuerus ng buwis[a] sa lupain at sa mga pulo sa dagat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tributo” o “singil.” Sa ilang konteksto, ang salitang Hebreo ay maaari ring tumukoy sa sapilitang paggawa para sa pamahalaan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga baybaying lupain.” Ang salitang Hebreo ay maaaring tumukoy sa mga pulo o sa mga lupaing nasa baybayin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... מַס עַל
  choice: nagpataw ... ng buwis sa
  rationale: Ang pariralang Hebreo ay tumutukoy sa opisyal na pagpapataw ng buwis, tributo, o obligasyong pampamahalaan. Natural sa makabagong Tagalog ang “nagpataw ng buwis sa.”
- source_word: הַמֶּלֶךְ אחשרש
  choice: si Haring Ahasuerus
  rationale: Ito ang natural at marangal na ayos ng titulo at pangalang pantangi sa Tagalog.
- source_word: מַס
  choice: buwis
  rationale: Sa kontekstong saklaw ang malawak na lupain at mga pook sa dagat, malamang na pananalaping singil o tributo ang tinutukoy. Pinakamadaling maunawaan ng karaniwang mambabasa ang “buwis,” habang inilalahad sa talababa ang iba pang posibleng kahulugan.
- source_word: הָאָרֶץ
  choice: lupain
  rationale: Tumutukoy ito sa teritoryong nasasakupan, hindi kinakailangang sa buong daigdig. Pinananatili ng “lupain” ang lawak nang hindi labis na tinutukoy ang hangganan.
- source_word: וְאִיֵּי הַיָּם
  choice: at sa mga pulo sa dagat
  rationale: Malapit ito sa anyo ng Hebreo at malinaw sa Tagalog, habang ang kahulugang “mga baybaying lupain” ay pinananatili bilang leksikal na alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “buwis” para sa agarang linaw, ngunit pinanatili sa talababa ang saklaw ng מַס. Ang “mga pulo sa dagat” ay sadyang malapit sa Hebreo at hindi nilimitahan ang heograpikong pahiwatig.
