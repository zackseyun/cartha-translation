base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: tl
  text: Ngayon, makinig ka sa akin; papayuhan kita, at sumaiyo nawa ang Diyos.[a] Ikaw ang humarap sa Diyos para sa bayan,[b] at ikaw ang magdala ng kanilang mga usapin sa Diyos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at sumaiyo ang Diyos.” Ang anyong Hebreo ay nagpapahayag ng hangarin o pagpapala.
    reason: lexical_alternative
  - marker: b
    text: O “Ikaw ang kumatawan sa bayan sa harap ng Diyos.”
    reason: alternative_reading
  - marker: c
    text: Ang “mga usapin” ay tumutukoy rito sa mga kaso o alitang dinadala upang pagpasyahan.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Ngayon
  rationale: Likas na panandang temporal at pandiskurso na nagpapasimula sa susunod na tagubilin ni Jetro.
- source_word: שְׁמַע בְּקֹלִי
  choice: makinig ka sa akin
  rationale: Ang literal na idyomang 'makinig sa aking tinig' ay natural na ipinapahayag sa makabagong Tagalog bilang 'makinig ka sa akin,' nang hindi ito pinalalakas tungo sa mahigpit na 'sumunod.'
- source_word: אִיעָצְךָ
  choice: papayuhan kita
  rationale: Tuwirang ipinahahayag ang diwa ng יעץ na magbigay ng payo o tagubilin.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: at sumaiyo nawa ang Diyos
  rationale: Malinaw na pinananatili ang jussive na diwa ng hangarin o pagpapala.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Ikaw ang humarap sa Diyos para sa bayan
  rationale: Natural at marangal na Tagalog na nananatiling malapit sa estrukturang 'maging ikaw para sa bayan sa harap ng Diyos,' habang ipinahihiwatig ang kinatawang tungkulin ni Moises.
- source_word: וְהֵבֵאתָ
  choice: at ikaw ang magdala
  rationale: Ang pandiwang kasunod ng pautos ay may diwang patuloy na tagubilin; ang 'magdala' ay natural sa Filipino at hindi labis na pormal.
- source_word: הַדְּבָרִים
  choice: kanilang mga usapin
  rationale: Sa kontekstong panghukuman, tumutukoy ang malawak na דְּבָרִים sa mga bagay, kaso, o alitang kailangang pagpasyahan; pinananatili ng 'mga usapin' ang sapat na lawak.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Payak at tumpak na pagtukoy sa Diyos ng Israel bilang patutunguhan ng mga usaping inihaharap ni Moises.
theological_decisions:
- issue: Pagpapahayag sa אֱלֹהִים sa salaysay na tumutukoy sa Diyos ng Israel
  choice: Diyos
  alternative: ang tunay na Diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, malinaw na isahan ang tinutukoy rito. Hindi kailangan ang dagdag na 'tunay,' na wala sa mismong teksto.
- issue: Antas ng pagpapakahulugan sa papel ni Moises para sa bayan sa harap ng Diyos
  choice: Ikaw ang humarap sa Diyos para sa bayan
  alternative: Ikaw ang kumatawan sa bayan sa harap ng Diyos
  rationale: Ipinakikita ng konteksto ang papel na kinatawan ni Moises, ngunit pinananatili ng pangunahing salin ang mas malapit na larawan ng pagharap niya sa Diyos para sa bayan; inilalagay sa talababa ang mas tahasang interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'makinig ka sa akin' sa halip na literal ngunit medyo matigas na 'makinig ka sa aking tinig.' Ang 'sumaiyo nawa' ay nagpapanatili sa tono ng pagpapala, at ang 'humarap sa Diyos para sa bayan' ay natural habang hindi labis na nilulutas ang kinatawang diwa ng Hebreo.
