  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: tl
  text: Kaya nakinig si Moises sa tinig ng kanyang biyenang lalaki at ginawa niya ang lahat ng sinabi ng kanyang biyenang lalaki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sinunod ni Moises ang sinabi ng kanyang biyenang lalaki.” Ang idyomang Hebreo ay maaaring magpahiwatig ng pakikinig na may kasamang pagsunod, na tahasang ipinakikita ng kasunod na sugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nakinig
  rationale: Ang שׁמע na may לְקוֹל ay nangangahulugang makinig o tumalima. Pinananatili ng “nakinig” ang larawang pandinig, habang nililinaw ng kasunod na sugnay na humantong ito sa pagsunod.
- source_word: לְקוֹל
  choice: sa tinig ng
  rationale: Literal na “tinig” ang קוֹל. Nauunawaan sa Filipino ang idyomang “nakinig sa tinig ng,” at napapanatili nito ang anyo at himig ng Hebreo.
- source_word: חֹתְנוֹ
  choice: kanyang biyenang lalaki
  rationale: Sa konteksto, tumutukoy ito kay Jetro, ang ama ng asawa ni Moises. Nililinaw ng “biyenang lalaki” ang kaugnayang ipinahihiwatig ng anyong panlalaki sa Hebreo.
- source_word: וַיַּעַשׂ
  choice: ginawa niya
  rationale: Karaniwang kahulugan ng עשה ang “gumawa.” Direktang inilalahad nito na isinakatuparan ni Moises ang sinabi sa kanya.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: ang lahat ng sinabi nito
  rationale: Tuwirang katumbas ito ng “lahat ng sinabi niya.” Ginamit ang “nito” upang natural na tumukoy sa biyenang lalaki at maiwasan ang kalituhan sa dalawang lalaking binabanggit.
