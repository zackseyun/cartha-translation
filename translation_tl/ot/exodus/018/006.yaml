  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: tl
  text: Sinabi niya kay Moises, “Ako, si Jetro, ang biyenan mo, ay papunta sa iyo, kasama ang asawa mo at ang dalawa niyang anak na lalaki[a] na kasama niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang dalawa niyang anak na lalaki,” na tumutukoy sa asawa ni Moises. Isinasalin ito ng ilan na “ang dalawa mong anak na lalaki,” ngunit pambabaeng ikatlong panauhang isahang hulapi ang nasa Masoretikong Teksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: Sinabi niya kay Moises
  rationale: Likas sa makabagong Tagalog ang ganitong pagsulong ng salaysay; hindi na kailangang isalin nang hiwalay ang panimulang waw bilang “at.”
- source_word: אֲנִי חֹתֶנְךָ יִתְרוֹ
  choice: Ako, si Jetro na biyenan mo
  rationale: Pinananatili ang tahasang אֲנִי at ang pagkakakilanlan ni Jetro bilang biyenan ni Moises sa isang natural ngunit mariing pahayag.
- source_word: בָּא אֵלֶיךָ
  choice: ay papunta sa iyo
  rationale: Ipinahahayag ng participle ang kasalukuyan o nalalapit na pagdating; ang “papunta” ay likas na Tagalog at hindi ipinapalagay na nakarating na siya.
- source_word: וְאִשְׁתְּךָ
  choice: kasama ang asawa mo
  rationale: Ipinakikita ng “kasama” na kabilang ang asawa ni Moises sa mga dumarating kay Moises.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: at ang dalawa niyang anak na lalaki
  rationale: Ang hulaping pambabaeng isahan ay nangangahulugang “niyang/her,” na tumutukoy sa asawa ni Moises; pinananatili rin ng “anak na lalaki” ang panlalaking anyo ng בָנִים.
- source_word: עִמָּהּ
  choice: na kasama niya
  rationale: Pinananatili ang tahasang pahayag ng Hebreo na ang dalawang anak ay kasama ng asawa ni Moises, kahit may bahagyang pag-uulit sa Tagalog.
theological_decisions:
- issue: Kung kanino iniuugnay ang dalawang anak
  choice: dalawa niyang anak na lalaki
  alternative: dalawa mong anak na lalaki
  rationale: Ang Masoretikong Teksto ay may hulaping ikatlong panauhang pambabae isahan, kaya “niya/her,” hindi ikalawang panauhang “mo/your.” Hindi ito dapat tahimik na ihanay sa inaakalang relasyon ni Moises sa mga anak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “biyenan” bilang karaniwang katawagan sa ama ng asawa at pinanatili ang bahagyang pag-uulit sa hulihan upang katawanin ang tahasang עִמָּהּ.
