revisions:
- from: Ngunit pumili ka mula sa buong bayan ng mga lalaking may kakayahan[a], may takot sa Diyos, mapagkakatiwalaan[b], at napopoot sa di-matuwid na pakinabang[c]. At italaga mo sila bilang mga pinuno ng tig-iisang libo, tig-iisang daan, tiglilimampu, at tig-iisang sampu.
  to: Ngunit pumili ka mula sa buong bayan ng mga lalaking may kakayahan[a], na may takot sa Diyos, tapat[b], at napopoot sa di-makatarungang pakinabang[c]; italaga mo silang mamuno sa kanila bilang mga pinuno sa bawat libo, bawat daan, bawat limampu, at bawat sampu.
  rationale: Inayos ang pagpapahayag ng pagtatalaga upang maisama ang ugnayang “mamuno sa kanila” na nasa Hebreo, at pinalitan ang distributibong anyo ng mga bilang ng mas likas at malinaw na Tagalog para sa mga antas ng pangangasiwa. Ginawang “tapat” ang pangunahing salin ng אַנְשֵׁי אֱמֶת; ang literal at iba pang katanggap-tanggap na salin ay nananatili sa talababa.
