language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: tl
  text: Ngunit pumili ka mula sa buong bayan ng mga lalaking may kakayahan[a], na may takot sa Diyos, tapat[b], at napopoot sa di-makatarungang pakinabang[c]; italaga mo silang mamuno sa kanila bilang mga pinuno sa bawat libo, bawat daan, bawat limampu, at bawat sampu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalakas na lalaki” o “mga lalaking magigiting.” Ang salitang Hebreo ay maaaring tumukoy sa lakas, kakayahan, o kagitingan ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga lalaki ng katotohanan”; maaari ring “mapagkakatiwalaan” o “maaasahan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “napopoot sa tiwaling pakinabang.” Tumutukoy ang parirala sa pagtanggi sa pakinabang na nakuha sa masama o di-makatarungang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: pumili ka
  rationale: Bagaman pangunahing kaugnay ng pagtingin o pagkilatis ang pandiwa, sa kontekstong ito ay tumutukoy ito sa maingat na pagpili ng mga kuwalipikadong pinuno.
- source_word: מִכָּל הָעָם
  choice: mula sa buong bayan
  rationale: 'Likas na salin ng partitive na parirala: pipili mula sa kabuuan ng bayang Israel.'
- source_word: אַנְשֵׁי חַיִל
  choice: mga lalaking may kakayahan
  rationale: Maaaring tumukoy ang חַיִל sa lakas, kagitingan, o kakayahan. Sa kontekstong panghukuman at pangangasiwa, malinaw na ang praktikal na kakayahan ang nangingibabaw, habang pinananatili ang panlalaking anyo ng Hebreo.
- source_word: יִרְאֵי אֱלֹהִים
  choice: may takot sa Diyos
  rationale: Ipinahahayag nito ang magalang at masunuring pagkatakot sa Diyos bilang kuwalipikasyong moral.
- source_word: אַנְשֵׁי אֱמֶת
  choice: mapagkakatiwalaan
  rationale: Ang literal na 'mga lalaki ng katotohanan' ay hindi likas sa makabagong Tagalog. Saklaw ng אֱמֶת dito ang katapatan, pagiging maaasahan, at pagkamatapat.
- source_word: שֹׂנְאֵי בָצַע
  choice: napopoot sa di-matuwid na pakinabang
  rationale: Ang בָצַע ay pakinabang na hinahangad o nakukuha sa tiwali o di-makatarungang paraan; mas malawak ito kaysa suhol lamang.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: italaga mo sila bilang mga pinuno
  rationale: Ipinahahayag ang paglalagay sa mga piniling lalaki sa kapangyarihan sa bayan nang hindi inuulit ang malabong mga panghalip sa paraang asiwa sa Tagalog.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Ang שַׂר ay pinuno o opisyal. Ang 'pinuno' ay natural at hindi nagdaragdag ng tiyak na konotasyong militar.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: tig-iisang libo, tig-iisang daan, tiglilimampu, at tig-iisang sampu
  rationale: Inilalarawan ng mga bilang ang magkakaantas na pangkat na pinamumunuan. Nililinaw ng distributibong 'tig-' ang ugnayan sa natural na Tagalog.
theological_decisions:
- issue: Panlalaking wika sa mga kuwalipikasyon sa pamumuno
  choice: mga lalaking may kakayahan
  alternative: mga taong may kakayahan
  rationale: Tahasan ang panlalaking pangmaramihang anyo ng אַנְשֵׁי. Pinananatili ito bilang katumpakan sa teksto, nang hindi bumubuo ng doktrinal na pahayag na lampas sa talata.
- issue: Kahulugan ng 'takot sa Diyos'
  choice: may takot sa Diyos
  alternative: may paggalang sa Diyos
  rationale: Pinananatili ang karaniwang biblikal na pahayag at ang tensiyon ng ירא, na maaaring magsangkot ng takot, pagpipitagan, at paggalang; ang 'paggalang' lamang ay maaaring magpahina rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'bayan' para sa Israel bilang isang sambayanan at ang distributibong 'tig-' upang likas na maipahayag ang mga antas ng pangangasiwa. Inilagay ang lahat ng pananda ng talababa sa mismong pangunahing teksto at inayos ang mga ito sa wastong pagkakasunod.
