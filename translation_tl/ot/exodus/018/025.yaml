  to: Pumili si Moises ng mga lalaking may kakayahan[a] mula sa buong Israel at itinalaga silang mga pinunong mamamahala sa bayan—mga pinuno ng tig-iisang libo, tig-iisang daan, tig-lilimampu, at tig-sasampu.
