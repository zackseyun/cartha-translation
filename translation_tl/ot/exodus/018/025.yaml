  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: tl
  text: Pumili si Moises ng mga lalaking may kakayahan[a] mula sa buong Israel at itinalaga silang mga pinunong mamamahala sa bayan—mga pinuno ng tig-iisang libo, tig-iisang daan, tig-lilimampu, at tig-sasampu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga lalaking mahusay” o “mga lalaking subok ang kakayahan.” Ang pariralang Hebreo ay maaaring tumukoy sa lakas, kakayahan, katapangan, o napatunayang halaga ng isang tao; dito, ang diin ay nasa pagiging karapat-dapat mamuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Pumili
  rationale: Tuwirang ipinapahayag ng בחר ang pagpili; natural at malinaw ang “pumili” sa makabagong Tagalog.
- source_word: אַנְשֵׁי חַיִל
  choice: mga lalaking may kakayahan
  rationale: Sa kontekstong panghukuman at pangangasiwa, ang parirala ay tumutukoy sa mga lalaking may sapat na kakayahan at subok na katangian, hindi lamang sa matatapang na mandirigma.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: mula sa buong Israel
  rationale: Ipinakikita nitong ang mga pinili ay nagmula sa kabuuan ng Israel.
- source_word: וַיִּתֵּן אֹתָם
  choice: itinalaga silang
  rationale: Bagaman literal na “inilagay/ibinigay,” ang נתן dito ay tumutukoy sa pagtatalaga sa isang tungkulin.
- source_word: רָאשִׁים
  choice: mga tagapanguna
  rationale: Ang literal na “mga ulo” ay metapora para sa mga taong may awtoridad. Pinananatili ng “mga tagapanguna” ang diwa nang hindi nagiging asiwa sa Tagalog.
- source_word: עַל הָעָם
  choice: sa bayan
  rationale: Kasama ng pagtatalaga bilang mga tagapanguna, ipinahihiwatig nito ang pamumuno at awtoridad na saklaw ang bayan.
- source_word: שָׂרֵי
  choice: mga pinuno
  rationale: Tumutukoy ang שַׂר sa mga opisyal na may itinalagang awtoridad. Ang “mga pinuno” ay angkop sa estrukturang binubuo ng mga pangkat na may iba’t ibang laki at hindi kinakailangang magpahiwatig ng tungkuling militar.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: tig-iisang libo, tig-iisang daan, tig-lilimampu, at tig-sasampu
  rationale: Malinaw na ipinahahayag sa natural na Tagalog ang laki ng bawat pangkat na pinamumunuan, habang pinananatili ang apat na antas ng tekstong Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bayan” para sa kolektibong Israel at ang mga anyong “tig-iisang libo” at iba pa upang madaling maunawaan ang antas ng pangangasiwa. Iniwasan ang “mga kumander” sapagkat maaaring magbigay ng higit na militar na diin kaysa sa hinihingi ng konteksto.
