translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pagkakaugnay sa naunang talata sa panimulang “at,” ngunit ginawang dalawang pangungusap upang maging natural at madaling basahin. Hindi tinukoy kung sino ang “niya” sapagkat panghalip lamang ang nasa tekstong Hebreo.
