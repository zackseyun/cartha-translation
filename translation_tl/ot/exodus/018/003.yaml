  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: tl
  text: at ang dalawa niyang anak na lalaki, na ang pangalan ng isa ay Gersom, sapagkat sinabi ni Moises, “Naging dayuhan[a] ako sa isang banyagang lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pansamantalang naninirahan” o “tagalabas.” Ang Hebreong גֵּר ay maaaring tumukoy sa isang taong naninirahan bilang hindi katutubo o hindi ganap na kabilang sa lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: at
  rationale: Ipinagpapatuloy ng וְ ang pangungusap mula sa naunang talata, samantalang ang אֵת ay pananda ng tuwirang layon at walang hiwalay na katumbas sa Tagalog.
- source_word: שְׁנֵי בָנֶיהָ
  choice: ang dalawa niyang anak na lalaki
  rationale: Malinaw na ipinapakita ng parirala ang bilang, pag-aari, at panlalaking anyo ng בָנִים, habang nananatiling natural sa makabagong Tagalog.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: Ang pangalan ng isa ay
  rationale: Pinananatili nito ang pagtukoy sa isa sa dalawang anak nang hindi ipinapalagay na siya ang panganay o una ayon sa pagkakasunod-sunod.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Karaniwang anyong Tagalog ng transliterasyon ng pangalang Hebreo.
- source_word: כִּי אָמַר
  choice: sapagkat sinabi niya
  rationale: Ipinapahayag ng כִּי ang paliwanag sa ipinangalan, at pinananatili ng “niya” ang panghalip na nasa Hebreo nang hindi tahasang nagdaragdag ng pangalang Moises.
- source_word: גֵּר
  choice: dayuhan
  rationale: Nauunawaan ito ng karaniwang mambabasa at ipinapahayag ang katayuan ng isang tagalabas na naninirahan sa lupaing hindi kanya; nililinaw sa talababa ang mas malawak na saklaw ng salitang Hebreo.
- source_word: הָיִיתִי
  choice: Naging ... ako
  rationale: Natural na salin ng Hebreong qatal bilang naganap na kalagayan, nang hindi ipinapalagay kung nagpapatuloy pa ito sa oras ng pagsasalita.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: sa isang banyagang lupain
  rationale: Tuwirang inilalarawan ang isang lupaing hindi sarili ng nagsasalita at pinananatili ang pag-uugnay sa kaniyang pagiging dayuhan.
