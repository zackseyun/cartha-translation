    issue: Naputol ang sintaks sa pagitan ng “ang dalawa niyang anak na lalaki” at “Ang pangalan ng isa ay Gersom.”
    rationale: Ang אֲשֶׁר ay nag-uugnay sa paglalarawan ng mga anak; ang kasalukuyang tuldok ay ginagawang putol na parirala ang unang pangungusap at hindi gaanong nasasalamin ang ugnayan sa Hebreo.
  - severity: medium
    issue: Hindi malinaw ang tinutukoy ng “niya” sa “sapagkat sinabi niya.”
    rationale: Sa mas malawak na agarang konteksto, si Jetro ang tahasang paksa, ngunit ang paliwanag sa pangalang Gersom ay salita ni Moises. Ang tahasang “ni Moises” ay paglilinaw ng referent na hinihingi ng konteksto, hindi dagdag na kahulugan.
