  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: tl
  text: At sinabi ni Jetro, “Purihin si Yahweh,[a] na nagligtas sa inyo mula sa kamay ng mga Ehipcio at sa kamay ng Paraon, na nagligtas sa bayan mula sa ilalim ng kamay ng mga Ehipcio.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Pinagpala si Yahweh” o “Pagpalain si Yahweh.” Ang pormulang Hebreo ay maaaring likas na ipahayag sa iba’t ibang paraan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kamay ng mga Ehipcio … mula sa ilalim ng kamay ng mga Ehipcio”—larawan ng pagliligtas mula sa kanilang mapaniil na kapangyarihan o kontrol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Ipinagpapatuloy ng waw-consecutive ang daloy ng salaysay; likas sa Tagalog ang “At sinabi” nang hindi dinaragdagan ang temporal na diwa.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Hebreo na Yitro, na madaling makilala ng karaniwang mambabasa.
- source_word: בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  rationale: Natural at marangal na katumbas sa Tagalog ng pormulang Hebreo ng pagpupuri; hindi nito sapilitang nilulutas kung ito ay deklarasyon o paghiling, kaya nilinaw ang saklaw sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הִצִּיל
  choice: nagligtas
  rationale: Ipinahihiwatig ng Hiphil ng נצל ang pag-agaw o pagliligtas mula sa kapangyarihang mapaniil; malinaw at natural dito ang “nagligtas.”
- source_word: אֶתְכֶם
  choice: sa inyo
  rationale: Tumutukoy ang hulaping panghalip sa ikalawang panauhang maramihan; ang “sa inyo” ang natural na layon ng “nagligtas” sa Tagalog.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang malinaw na metapora ng kamay bilang kapangyarihan o kontrol.
- source_word: מִצְרַיִם
  choice: mga Ehipcio
  rationale: Sa pariralang “kamay ng,” ang konteksto ay tumutukoy sa sama-samang kapangyarihan ng mga Ehipcio, hindi lamang sa heograpikong lugar.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Ito ang karaniwan at madaling makilalang anyong Tagalog ng titulong maharlika.
- source_word: הָעָם
  choice: bayan
  rationale: Tumutukoy ang עָם sa Israel bilang isang sambayanan; maikli at natural dito ang “bayan.”
- source_word: מִתַּחַת יַד
  choice: mula sa ilalim ng kamay ng
  rationale: Pinananatili ang mas buong larawang Hebreo ng pagkakasailalim sa mapaniil na kapangyarihan at ang pagkakaiba nito sa naunang מִיַּד.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasan sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang personal sa halip na palitan ito ng titulo.
- issue: Diwa ng pormulang בָּרוּךְ יְהוָה
  choice: Purihin si Yahweh
  alternative: Pinagpala si Yahweh; Pagpalain si Yahweh
  rationale: Ang pormulang Hebreo ay maaaring unawain bilang pagpapahayag ng papuri o panawagang magpuri. Pinili ang natural na doxological na Tagalog at pinanatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang kongkretong larawang “kamay” at “ilalim ng kamay,” habang ipinaliwanag sa talababa ang idyomatikong kahulugan. Ginamit ang “Jetro,” “Ehipcio,” at “Paraon” bilang mga anyong pamilyar sa mambabasang Tagalog.
