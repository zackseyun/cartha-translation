  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: tl
  text: At humahatol sila sa bayan sa lahat ng oras. Dinadala nila kay Moises[a] ang bawat mahirap na usapin, ngunit sila mismo ang humahatol sa bawat maliit na usapin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bawat mahirap na kaso … bawat maliit na kaso.” Sa kontekstong panghukuman, magkatapat sa Hebreo ang mahihirap na kaso at ang mas maliliit na kaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: At hinatulan nila
  rationale: Ang Qal ng שׁפט ay naglalarawan sa patuloy na tungkulin ng mga itinalagang hukom; ang aspektong nakagawian ay higit na nililinaw ng kasunod na mga pandiwang nasa anyong pangkasalukuyang-ulit.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang עַם ay tumutukoy sa buong sambayanan ng Israel; natural at marangal sa Tagalog ang “bayan.”
- source_word: בְּכָל עֵת
  choice: sa lahat ng panahon
  rationale: Pinananatili nito ang malawak na diwa ng palagian o regular na kahandaang humatol, hindi lamang isang pagkakataon.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: ang bawat mahirap na usapin
  rationale: Sa kontekstong panghukuman, ang דָּבָר ay isang usapin o kasong kailangang pasiyahan; ipinahihiwatig ng tiyak na parirala ang bawat kabilang sa uring ito.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: ay dinadala nila kay Moises
  rationale: Ang anyo ay nagpapahayag ng paulit-ulit at nakagawiang kilos sa kaayusang panghukuman.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: ang bawat maliit na usapin
  rationale: Ang קָטֹן ay tuwirang itinatambal sa קָשֶׁה at tumutukoy sa mga usaping mas maliit o mas payak.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: sila mismo ang humahatol
  rationale: 'Pinananatili ng “sila mismo” ang diin ng hiwalay na panghalip na הֵם: ang mga hinirang na hukom, hindi si Moises, ang nagpapasiya sa maliliit na usapin.'
