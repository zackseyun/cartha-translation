  rationale: Inayos ang aspekto ng unang pandiwa upang maging kasuwato ng nakagawiang gawaing inilalarawan sa buong talata at upang maiwasan ang posibleng diwang “kinondena.” Pinanatili ang mga pangunahing termino at ang diin ng “sila mismo,” pati ang leksikal na kontrast na “mahirap” at “maliit.”
