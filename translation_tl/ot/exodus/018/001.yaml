language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: tl
  text: Nabalitaan ni Jetro, ang pari ng Midian at biyenan ni Moises, ang lahat ng ginawa ng Diyos para kay Moises at sa Israel na kanyang bayan[a]—na inilabas ni Yahweh ang Israel mula sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “ang Israel na bayan ni Moises.” Sa gramatika, maaaring tumukoy kay Moises ang “kanyang,” ngunit sa konteksto ay mas malamang na tumutukoy ito sa Diyos.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Nabalitaan
  rationale: Likas sa makabagong Tagalog para sa pagkarinig o pagkatanggap ng balita tungkol sa mga naganap, at naipagpapatuloy nito ang salaysay nang hindi nagdaragdag ng tahasang panandang pamanahon.
- source_word: כֹהֵן מִדְיָן
  choice: ang pari ng Midian
  rationale: Pinananatili ang tiyak na pagkakakilanlan at tungkulin ni Jetro ayon sa pariralang construct sa Hebreo.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Sa kontekstong ito, tumutukoy ang חֹתֵן sa ama ng asawa ni Moises; ang “biyenan” ang natural at karaniwang katumbas sa Tagalog.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: ang lahat ng ginawa ng Diyos
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng כָּל אֲשֶׁר sa malinaw at natural na Tagalog.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: para kay Moises at sa Israel
  rationale: Ipinahahayag ng “para” ang kapakinabangang diwa ng ל, samantalang ang “sa Israel” ay natural matapos ang magkatambal na parirala.
- source_word: עַמּוֹ
  choice: kanyang bayan
  rationale: Pinananatili ang panghalip na panlalaking isahan nang hindi tahasang pinapangalanan ang tinutukoy nito.
- source_word: כִּי
  choice: kung paanong
  rationale: Ipinakikilala nito nang natural sa Tagalog ang nilalaman at paliwanag ng nabalitaan ni Jetro, hindi lamang isang payak na dahilan.
- source_word: הוֹצִיא
  choice: inilabas
  rationale: 'Tumpak na ipinapahayag ang causative na diwa ng Hiphil ng יצא: pinapangyari o dinadala palabas.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Natural sa Tagalog kasunod ng “inilabas” at malinaw na nagpapahayag ng pag-alis mula sa lupain ng Ehipto.
theological_decisions:
- issue: Tinutukoy ng panghalip sa עַמּוֹ
  choice: “kanyang bayan,” na sa konteksto ay malamang na tumutukoy sa Diyos
  alternative: “bayan ni Moises”
  rationale: Ang Diyos ang pinakamalapit at pinakanaaangkop na tinutukoy sa konteksto, lalo na dahil si Yahweh ang tahasang kumikilos sa kasunod na sugnay. Gayunman, hindi pinangalanan sa pangunahing teksto ang antecedent upang mapanatili ang tunay na gramatikal na posibilidad na tumukoy ito kay Moises.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang mga pangalang Jetro, Moises, Midian, at Ehipto; pinanatili ang Yahweh bilang personal na pangalan. Inilagay ang talababa sa mismong pariralang may gramatikal na kalabuan.
