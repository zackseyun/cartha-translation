    text: O “Tiyak na mauubusan ka ng lakas, pati ang bayang ito.” Inuulit sa Hebreo ang pandiwa upang idiin ang katiyakan at tindi ng pagkapagod.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: Tiyak na mapapagod kayo nang husto
  rationale: Ang infinitive absolute na sinusundan ng imperfect ng parehong pandiwa ay nagbibigay-diin sa katiyakan at tindi. Ang magalang na panghalip na “kayo” ay natural sa payo ng biyenan kay Moises, at ang “mapapagod nang husto” ay malinaw na naghahatid ng pagkaubos ng lakas dahil sa labis na trabaho.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: ikaw at ang mga taong ito
  rationale: Ipinapaloob ng inuulit na גַּם ang dalawang panig. Pinananatili ng “mga taong ito” ang demonstratibong lapit, habang ang “ikaw” ay angkop bilang nakahiwalay na paksa kahit “kayo” ang magalang na anyo sa pangunahing sugnay.
- source_word: אֲשֶׁר עִמָּךְ
  choice: na kasama mo
  rationale: Natural na panuring sa modernong Tagalog at hindi nagdaragdag ng kahulugang wala sa Hebreo.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng babala sa isang dignidad ngunit madaling maunawaang rehistro.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: napakabigat para sa iyo ang gawaing ito
  rationale: Pinananatili ng “mabigat” ang metapora ng כָבֵד. Sa konteksto, ang דָּבָר ay tumutukoy sa ginagawa ni Moises, kaya natural ang “gawaing ito” nang hindi labis na tinutukoy ang uri nito.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: Hindi mo ito kayang gawin
  rationale: Tuwirang ipinahahayag ang kawalan ng kakayahan at pinananatili ang malawak na kahulugan ng עשה bilang “gawin.”
- source_word: לְבַדֶּךָ
  choice: nang mag-isa
  rationale: Karaniwan at malinaw na katumbas ng paggawa nang walang katuwang.
