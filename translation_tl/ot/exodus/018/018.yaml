  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang magalang na “kayo” sa tuwirang pakikipag-usap ni Jetro kay Moises, ngunit “ikaw” sa pariralang naghihiwalay at nagdiriin sa dalawang grupong apektado. Pinanatili ang metaporang “mabigat” at ang diin ng Hebreong pag-uulit.
