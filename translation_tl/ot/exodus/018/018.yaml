  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: tl
  text: Tiyak na mapapagod nang husto kapuwa ikaw at ang bayang ito na kasama mo,[a] sapagkat napakabigat para sa iyo ang gawaing ito. Hindi mo ito kayang gawin nang mag-isa.
  philosophy: optimal-equivalence
