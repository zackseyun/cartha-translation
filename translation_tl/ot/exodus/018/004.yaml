base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: tl
  text: At ang pangalan ng isa pa ay Eliezer[a], sapagkat ang Diyos ng aking ama ang tumulong sa akin at nagligtas sa akin mula sa tabak ng Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Eliezer ay may kahulugang kaugnay ng “Ang Diyos ko ay tulong.” Walang tahasang “sinabi niya” sa Hebreo; tuwirang kasunod ng pangalan ang paliwanag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: At ang pangalan ng isa pa
  rationale: Pinananatili ng “At” ang daloy ng salaysay, at ang “isa pa” ang likas na katumbas sa konteksto matapos pangalanan ang unang anak sa naunang talata.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Isinalin sa karaniwang transliterasyon bilang pangalang pantangi; ang kahulugan nitong kaugnay ng tulong ng Diyos ay ipinapaliwanag ng kasunod na sugnay.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o paliwanag sa ipinangalan, sa isang marangal at malinaw na anyong Tagalog.
- source_word: אֱלֹהֵי אָבִי
  choice: ang Diyos ng aking ama
  rationale: Malapit sa anyong Hebreo at hindi pinapawi ang posibleng kaugnayang pampamilya at pangtipan ng parirala.
- source_word: בְּעֶזְרִי
  choice: ang tumulong sa akin
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang diwang “aking tulong”; ang konteksto ng pagliligtas ay nakaraan.
- source_word: וַיַּצִּלֵנִי
  choice: at nagligtas sa akin
  rationale: Tumpak at karaniwang katumbas ng pandiwang nangangahulugang iligtas o sagipin mula sa panganib.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: mula sa tabak ng Faraon
  rationale: Pinananatili ang konkretong larawang Hebreo, na maaaring tumukoy sa nakamamatay na kapangyarihan o banta ng Faraon.
theological_decisions:
- issue: Walang tahasang pandiwa ng pagsasalita sa paliwanag ng pangalan
  choice: Hindi idinagdag ang “sinabi niya”
  alternative: Idagdag ang “sapagkat sinabi niya” upang tukuyin si Moises bilang nagsasalita
  rationale: Walang pandiwa ng pagsasalita sa Hebreo. Ang hindi pagdaragdag nito ay mas tapat sa pinagmulan at pinananatili kung ang paliwanag ay tuwirang pormula ng pagpapangalan o tinig ng tagapagsalaysay.
- issue: Nominal na pariralang בְּעֶזְרִי
  choice: ang tumulong sa akin
  alternative: aking tulong
  rationale: Ang pandiwang anyo ay mas natural sa kasalukuyang Tagalog, ngunit hindi binabago ang teolohikal na diwa na ang Diyos ang pinagmulan ng tulong.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang “tabak” bilang larawang pampanitikan at ang “Diyos ng aking ama” bilang malapit na anyo ng pariralang Hebreo.
