translation_notes:
  register: Modernong Filipino Tagalog na payak, natural, at marangal. Hindi kinailangan ang talababa sapagkat ang “ang ginagawa mo” ay malinaw na katumbas ng Hebreong nominal-relative construction nang walang mahalagang nawalang alternatibong kahulugan.
