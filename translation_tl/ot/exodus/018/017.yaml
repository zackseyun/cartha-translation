translation:
  language: tl
  text: Sinabi ng biyanang lalaki ni Moises sa kanya, “Hindi mabuti ang ginagawa mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang payak na “Sinabi” nang hindi na isinasalin nang hiwalay ang panimulang pang-ugnay.
- source_word: חֹתֵן מֹשֶׁה
  choice: ang biyenan ni Moises
  rationale: Tumutukoy ang construct chain sa ama ng asawa ni Moises. Sa Tagalog, “biyenan” ang natural at dignified na katawagan; malinaw sa konteksto na lalaki ang tinutukoy.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang pinananatili ang panghalip ng Hebreo, na tumutukoy kay Moises, nang hindi inuulit ang pangalan.
- source_word: לֹא טוֹב
  choice: Hindi mabuti
  rationale: Pinananatili nito ang malawak at tuwirang pagtataya ng טוֹב nang hindi nililimitahan sa “hindi tama” o “hindi kapaki-pakinabang.”
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: ang ginagawa mo
  rationale: Natural na Tagalog ito para sa literal na “ang bagay na ginagawa mo,” at naipapahayag ng anyong “ginagawa” ang nagpapatuloy na kilos.
