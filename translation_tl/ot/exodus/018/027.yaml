base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: tl
  text: Pagkatapos, pinayaon ni Moises ang kanyang biyenan[a], at umuwi ito sa sarili niyang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinaalis ni Moises ang kanyang biyenan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: pinayaon
  rationale: Ang Piel ng שׁלח na may taong layon ay nangangahulugang magpaalis o magpadala upang humayo. Ang “pinayaon” ay magalang at likas sa konteksto ng pormal na paghihiwalay, nang hindi nagpapahiwatig na itinaboy si Jetro.
- source_word: חֹתְנוֹ
  choice: kanyang biyenan
  rationale: Sa kontekstong ito, tumutukoy ang חֹתֵן kay Jetro, ama ng asawa ni Moises. Karaniwang ginagamit sa Filipino ang “biyenan” para sa ugnayang ito, bagaman hindi nito tahasang tinutukoy ang kasarian.
- source_word: וַיֵּלֶךְ לוֹ
  choice: at umuwi ito
  rationale: Isinasalaysay ng idyoma ang pag-alis ni Jetro. Dahil ang patutunguhan ay ang sarili niyang lupain, natural sa Filipino ang “umuwi”; ang “ito” ay naglilinaw na ang biyenan, hindi si Moises, ang umalis.
- source_word: אֶל אַרְצוֹ
  choice: sa sarili niyang lupain
  rationale: Ang אֶרֶץ ay maaaring “lupain” o “bayan.” Pinananatili ng “lupain” ang heograpikong diwa nang hindi nagpapahiwatig ng makabagong bansang-estado, at malinaw na ipinahahayag ng “sarili niyang” ang hulaping paari.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na may marangal na himig. Ginamit ang “pinayaon” upang ipakita ang pormal ngunit hindi marahas na pagpapaalis; inilagay ang “umuwi” para sa natural na pagsasabi ng pagbabalik sa sariling lupain.
