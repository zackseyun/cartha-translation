revisions:
- from: At hatulan nila ang mga tao sa lahat ng panahon. Ang bawat malaking usapin ay dadalhin nila sa iyo, ngunit ang bawat maliit na usapin ay sila mismo ang hahatol.[a] Sa gayon, pagaanin mo ang iyong pasan,[b] at papasanin nila iyon kasama mo.
  to: At hatulan nila ang mga tao sa lahat ng oras. Ang bawat malaking usapin ay dadalhin nila sa iyo, ngunit ang bawat maliit na usapin ay sila mismo ang hahatol.[a] Sa gayon, pagaanin mo ang iyong pasan,[b] at papasanin nila ito kasama mo.
  rationale: Pinalitan ang “sa lahat ng panahon” ng “sa lahat ng oras” upang mas tumpak at likas na maipahayag ang temporal na diwa ng בְּכָל־עֵת. Bahagyang inayos din ang talababa [a] upang ang alternatibo ay manatiling malapit sa leksikal na magkatambal na “malaki/maliit,” nang hindi ipinapasok ang interpretasyong “mahalaga/di-gaanong mahalaga.” Walang pagbabagong pangkahulugan sa iba pang bahagi.
