  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: tl
  text: At hatulan nila ang mga tao sa lahat ng oras. Ang bawat malaking usapin ay dadalhin nila sa iyo, ngunit ang bawat maliit na usapin ay sila mismo ang hahatol.[a] Sa gayon, pagaanin mo ang iyong pasan,[b] at papasanin nila ito kasama mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “malaking usapin” at “maliit na usapin” bilang “malaking kaso” at “maliit na kaso.” Ginagamit ng Hebreo ang “malaki” at “maliit” para sa mga usaping dinadala upang hatulan.
    reason: lexical_alternative
  - marker: b
    text: Ang “pasan” ay tumutukoy sa tungkulin ng paghatol sa mga tao; ipinahihiwatig ito ng konteksto ngunit walang tahasang pangngalan para rito sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: At hatulan nila ang mga tao
  rationale: Ang שׁפט ay tumutukoy sa paghatol o pagpapasiya sa mga usapin. Ang anyong “hatulan nila” ay likas na payo o tagubilin sa Filipino at umaayon sa konteksto.
- source_word: בְּכָל־עֵת
  choice: sa lahat ng panahon
  rationale: 'Pinananatili nito ang tuwirang temporal na diwa ng Hebreo: palagian o sa anumang oras na kailangan ang paghatol.'
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: bawat malaking usapin
  rationale: Ang דָּבָר dito ay isang usaping dinadala para hatulan. Pinananatili ng “malaking usapin” ang literal na pagsalungat sa “maliit na usapin” nang hindi labis na ginagawang teknikal na terminong legal.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: ay dadalhin nila sa iyo
  rationale: Ang Hiphil ng בוא ay nangangahulugang magdala; si Moises ang pagdadalhan ng mabibigat na usapin upang pagpasyahan.
- source_word: כָּל־הַדָּבָר הַקָּטֹן
  choice: bawat maliit na usapin
  rationale: Pinananatili ang leksikal na katambal ng “malaking usapin”; maaari rin itong unawain bilang bawat di-gaanong mahalagang kaso.
- source_word: יִשְׁפְּטוּ הֵם
  choice: sila mismo ang hahatol
  rationale: 'Ipinahahayag ng tahasang panghalip na הֵם ang diin at paghahambing: ang mga hinirang na tagahatol, hindi si Moises, ang hahawak sa maliliit na usapin.'
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: pagaanin mo ang iyong pasan
  rationale: Ang וְהָקֵל ay Hiphil imperative, kaya pinanatili ang utos na “pagaanin mo.” Ang “pasan” ay likas na Filipino para sa bagay na inaalis mula sa ibabaw ng isang tao, bagaman ipinahiwatig lamang ito sa Hebreo.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: at papasanin nila iyon kasama mo
  rationale: Ang נשׂא ay “magbuhat/magpasan.” Ang “iyon” ay tumutukoy sa ipinahiwatig na pasanin ng paghatol, habang pinananatili ang maikling anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “usapin” sa halip na mas teknikal na “kaso” upang mapanatili ang lawak ng דָּבָר. Pinanatili ang imperatibong puwersa ng וְהָקֵל at ang diin ng הֵם. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
