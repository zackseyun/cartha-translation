base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: tl
  text: Nang makita ng biyenang lalaki ni Moises ang lahat ng ginagawa niya para sa bayan, sinabi niya, “Ano itong ginagawa mo para sa bayan? Bakit ikaw lamang ang nakaupo, samantalang ang buong bayan ay nakatayo sa harap mo[a] mula umaga hanggang gabi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa ibabaw mo.” Sa kontekstong ito, tumutukoy ito sa mga taong nakatayo sa harap ni Moises upang maghintay ng kanyang paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Ang חֹתֵן ay kamag-anak sa pamamagitan ng pag-aasawa at sa konteksto ay tumutukoy sa biyenang lalaki ni Moises. Natural sa Filipino ang “biyenan ni Moises,” at malinaw na ang tinutukoy dahil sa naunang konteksto.
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Karaniwang kahulugan ng ראה ang “makita.” Ang anyong “Nang makita” ay natural na nag-uugnay sa kasunod na pagsasalita sa salaysay.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה
  choice: ang lahat ng ginagawa niya
  rationale: Ipinahihiwatig ng participle na עֹשֶׂה ang nagpapatuloy na gawain ni Moises; ang “ginagawa niya” ay natural na nagpapahayag nito sa Filipino.
- source_word: לָעָם
  choice: para sa bayan
  rationale: Ang ל dito ay nagpapahayag ng gawaing isinasagawa para sa kapakanan ng mga tao. Pinili ang “bayan” upang tumukoy sa Israel bilang kolektibong pamayanan.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: Ano itong ginagawa mo
  rationale: Sa konteksto, ang דָּבָר ay tumutukoy sa gawain o kaayusang nasaksihan ng biyenan ni Moises. Ang natural na tanong sa Filipino ay “Ano itong ginagawa mo,” na hindi nangangailangan ng mekanikal na “bagay na ito.”
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: ikaw lamang ang nakaupo
  rationale: Ang ישב ay literal na pag-upo ngunit maaari ring magpahiwatig ng pag-upo upang humatol. Pinananatili ng salin ang konkretong larawan at ang diin ng לְבַדֶּךָ na si Moises lamang ang gumaganap ng tungkulin.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: samantalang nakatayo sa harap mo ang buong bayan
  rationale: Ang נצב ay “tumayo,” at ang עָלֶיךָ sa eksenang ito ay idiomatikong tumutukoy sa pagharap o paghihintay sa isang may awtoridad, hindi kinakailangang literal na pagtayo sa ibabaw ni Moises.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: mula umaga hanggang gabi
  rationale: Natural na katumbas ito ng Hebreong pahayag sa buong tagal ng maghapon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at iniwasan ang sobrang literal na mga pariralang magiging asiwa sa karaniwang mambabasa. Pinanatili ang larawan ng nakaupong Moises at nakatayong bayan, kasama ang maikling talababa para sa hudisyal na konteksto.
