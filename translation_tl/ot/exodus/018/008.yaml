language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: tl
  text: Isinalaysay ni Moises sa kanyang biyenan ang lahat ng ginawa ni Yahweh kay Faraon at sa Ehipto alang-alang sa Israel[a], ang lahat ng paghihirap na sinapit nila sa daan[b], at kung paano sila iniligtas ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “ang lahat ng ligalig” o “lahat ng kapighatiang dumating sa kanila sa paglalakbay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Isinalaysay
  rationale: Ang piel ng ספר ay nangangahulugang magkuwento o magsalaysay nang may detalye. Likas at marangal sa makabagong Filipino ang “isinalaysay.”
- source_word: חֹתְנוֹ
  choice: kanyang biyenan
  rationale: Sa konteksto, si Jetro na ama ng asawa ni Moises ang tinutukoy. Karaniwang tawag sa Filipino ang “biyenan,” bagaman hindi nito tahasang tinutukoy ang kasarian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: alang-alang sa Israel
  rationale: Likas na Filipino ito para sa idyomang nagsasaad na ang ginawa ay may kaugnayan sa kapakanan o dahil sa Israel; inilalahad sa talababa ang alternatibong sanhi.
- source_word: הַתְּלָאָה
  choice: paghihirap
  rationale: Saklaw nito ang hirap, ligalig, at kapighatiang naranasan sa paglalakbay nang hindi labis na nililimitahan ang kahulugan.
- source_word: מְצָאָתַם
  choice: sinapit nila
  rationale: Ipinahihiwatig ng literal na “nakahanap sa kanila” na dumating sa kanila ang paghihirap. Ang “sinapit nila” ay natural sa Filipino at pinananatili ang diwa ng dinanas na kasawian.
- source_word: בַּדֶּרֶךְ
  choice: sa daan
  rationale: Maikli at natural itong katumbas na maaaring tumukoy kapuwa sa ruta at sa kanilang paglalakbay.
- source_word: וַיַּצִּלֵם
  choice: iniligtas sila
  rationale: Ang נצל ay tumutukoy sa pagliligtas o pagsagip mula sa panganib. Ang “iniligtas” ay malinaw at angkop sa salaysay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang pantangi at hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Kaugnayan ng mga ginawa ni Yahweh sa Israel sa pariralang עַל אֹדוֹת
  choice: alang-alang sa Israel
  alternative: dahil sa Israel
  rationale: Maaaring magpahiwatig ang idyoma ng kapakanan o sanhi. Iniiwasang tuluyang isara ang saklaw sa pamamagitan ng paglalagay ng alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “biyenan” bilang karaniwang katawagan sa ama ng asawa ayon sa konteksto, at pinanatili ang pangalang Yahweh. Nasa pangunahing teksto ang lahat ng marker ng talababa.
