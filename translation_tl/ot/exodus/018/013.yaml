  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: tl
  text: Nang sumunod na araw, umupo si Moises upang humatol para sa mga tao, at tumayo ang mga tao sa harap niya[a] mula umaga hanggang gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa palibot ni Moises.” Maaaring unawain nang mas literal ang pang-ukol sa Hebreo, ngunit sa konteksto, naghihintay ang mga tao sa harap niya upang pagpasyahan ang kanilang mga usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Nang sumunod na araw
  rationale: Likas itong panimulang pangyayari sa salaysay sa modernong Tagalog at malinaw na ipinahihiwatig ang kasunod na araw, nang hindi gumagamit ng makalumang pormula.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  choice: umupo si Moises
  rationale: Pinananatili ang kongkretong larawan ng pag-upo ni Moises sa kanyang gawaing panghukuman.
- source_word: לִשְׁפֹּט אֶת־הָעָם
  choice: upang humatol para sa mga tao
  rationale: Ang שפט ay tumutukoy rito sa pagdinig at pagpapasya sa mga usapin ng sambayanan. Ang 'humatol para sa' ay likas sa Tagalog at hindi nagpapahiwatig na hinatulan niya silang lahat bilang mga nasasakdal.
- source_word: וַיַּעֲמֹד הָעָם
  choice: tumayo ang mga tao
  rationale: Tuwirang pinananatili ang kilos at tindig na ipinahahayag ng עמד.
- source_word: עַל מֹשֶׁה
  choice: sa harap niya
  rationale: Sa kontekstong panghukuman, malinaw nitong ipinahahayag na naghihintay ang mga tao kay Moises, habang ang mas literal na posibilidad na 'sa palibot niya' ay inilalagay sa talababa.
- source_word: מִן־הַבֹּקֶר עַד־הָעָרֶב
  choice: mula umaga hanggang gabi
  rationale: Natural at tumpak na Tagalog para sa buong haba ng araw na tinutukoy ng Hebreo.
