  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: tl
  text: Pagkatapos, kumuha si Jetro, na biyenan ni Moises, ng isang handog na sinusunog at ng mga hain para sa Diyos. Dumating si Aaron at ang lahat ng nakatatanda sa Israel upang kumain ng tinapay[a] kasama ng biyenan ni Moises sa harap ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kumain ng tinapay,” isang idyomang maaari ring mangahulugang “magsalo sa pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kumuha
  rationale: Pinananatili nito ang karaniwang kahulugan ng לקח. Bagaman maaaring ipakahulugang “nagdala” o “naghandog” sa kontekstong ito, ang mga kasunod na layon ang malinaw na nagpapakita ng gawaing paghahandog.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Sa salaysay na ito, ang חֹתֵן ay tumutukoy sa ama ng asawa ni Moises. Ang “biyenan” ang natural at malinaw na katawagan sa modernong Tagalog.
- source_word: עֹלָה
  choice: isang handog na sinusunog
  rationale: Ito ang karaniwang handog na lubusang sinusunog. Ang salin ay malinaw sa pangkalahatang mambabasa at hindi gumagamit ng di-pamilyar na teknikal na katawagan.
- source_word: זְבָחִים
  choice: mga hain
  rationale: Pinananatili ng “mga hain” ang malawak na kahulugan ng plural na זְבָחִים at ang pagkakaiba nito sa tiyak na handog na sinusunog.
- source_word: לֵאלֹהִים
  choice: para sa Diyos
  rationale: Likas ito sa Tagalog para sa mga handog na iniuukol sa Diyos at tapat sa gamit ng pang-ukol na ל.
- source_word: וַיָּבֹא אַהֲרֹן וְכֹל זִקְנֵי יִשְׂרָאֵל
  choice: Dumating si Aaron at ang lahat ng nakatatanda sa Israel
  rationale: Ang “dumating” ang natural na katumbas ng בוא rito. Ang “mga nakatatanda” ay nagpapanatili sa tungkuling panlipunan ng זִקְנֵי nang hindi basta pinapantay sa pangkalahatang “mga pinuno.”
- source_word: לֶאֱכָל לֶחֶם
  choice: upang kumain ng tinapay
  rationale: Pinananatili sa pangunahing teksto ang konkretong Hebreong idyoma. Ipinaliliwanag ng talababa na maaari itong mangahulugang pagsasalo sa pagkain.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: kasama ng biyenan ni Moises
  rationale: Inuulit ng Hebreo ang katawagang kaugnayan sa halip na ang pangalang Jetro, kaya pinananatili rin iyon sa salin.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: sa harap ng Diyos
  rationale: Ito ay tuwiran, marangal, at nagpapanatili sa diwa ng pagkain sa presensiya ng Diyos nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
theological_decisions:
- issue: Kahulugan ng pagkain sa konteksto ng paghahain
  choice: Pinananatili ang literal na “kumain ng tinapay,” habang ipinahihiwatig ng konteksto ang isang sama-samang pagkain na kaugnay ng paghahain sa harap ng Diyos.
  alternative: Isalin nang tuwiran bilang “makisalo sa isang sagradong pagkain.”
  rationale: Malakas ang pahiwatig ng sagradong pagsasalo dahil sa mga hain, sa pagdalo nina Aaron at ng mga nakatatanda, at sa pariralang “sa harap ng Diyos.” Gayunman, hindi tahasang tinatawag ng Hebreo ang pagkain na “sagrado,” kaya hindi iyon idinagdag sa teksto.
- issue: Tinutukoy ng אֱלֹהִים
  choice: Diyos
  alternative: mga diyos
  rationale: Ang konteksto ng salaysay ay malinaw na tumutukoy sa Diyos ng Israel; hindi nilalayon rito ang isang maramihang reperensiya.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang pormal na “sa harap ng Diyos” at ang konkretong idyomang “kumain ng tinapay,” samantalang inilagay sa talababa ang natural na kahulugang pagsasalo sa pagkain.
