  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: tl
  text: Nagalak si Jetro dahil sa lahat ng kabutihang ginawa ni Yahweh para sa Israel, na iniligtas niya mula sa kapangyarihan ng Ehipto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa kamay ng Ehipto,” isang idyoma na nangangahulugang mula sa kapangyarihan o kontrol ng Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: Nagalak
  rationale: Ipinahahayag ng pandiwa ang pagkagalak o matinding tuwa. Likas at marangal sa makabagong Tagalog ang “nagalak.”
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa mga saling Tagalog.
- source_word: עַל כָּל הַטּוֹבָה
  choice: dahil sa lahat ng kabutihang
  rationale: Sa pandiwa ng damdamin, ipinakikita ng עַל ang sanhi o dahilan ng pagkagalak. Ang pang-isahang kolektibong הַטּוֹבָה ay natural na naipapahayag bilang “lahat ng kabutihang.”
- source_word: אֲשֶׁר עָשָׂה יְהוָה לְיִשְׂרָאֵל
  choice: ginawa ni Yahweh para sa Israel
  rationale: Ang לְ ay tumutukoy sa kapakinabangan ng Israel, kaya “para sa Israel.” Pinananatili ang personal na pangalang Yahweh.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: na iniligtas niya
  rationale: Ang hulaping panghalip na pang-isahan ay tumutukoy sa Israel bilang isang sambayanan. Pinananatili ng “na” ang posibleng kaugnayan nito sa Israel nang hindi dinaragdagan ang teksto.
- source_word: מִיַּד מִצְרָיִם
  choice: mula sa kapangyarihan ng Ehipto
  rationale: Ang literal na “mula sa kamay ng Ehipto” ay isang idyomang Hebreo para sa pagliligtas mula sa kontrol o kapangyarihan nito; malinaw at natural sa Tagalog ang kahulugang idyomatiko.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Yahwe / PANGINOON
  rationale: Personal na pangalan ang יְהוָה sa pinagmulang teksto; pinananatili itong transliterasyon sa halip na palitan ng isang titulo.
- issue: Tinutukoy ng pang-isahang hulapi sa הִצִּילוֹ
  choice: Israel bilang kolektibong sambayanan
  alternative: Si Jetro o isang indibidwal na lalaki
  rationale: Sa sintaks at konteksto, ang pinakamalapit at likas na tinutukoy ay Israel, na itinuturing na isang kolektibong pang-isahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagalak” sa halip na mas kolokyal na “natuwa,” at isinalin nang idyomatiko ang “kamay ng Ehipto” upang maging madaling maunawaan habang inilalahad sa talababa ang literal na larawan.
