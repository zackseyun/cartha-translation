  terminology: Ang “usapin,” “humahatol,” “mga tuntunin,” at “mga kautusan” ay angkop at magkakatugma sa kontekstong panghukuman. Ang “isang tao at ng kaniyang kapwa” ay wastong kinatawang pahayag; ipinaliliwanag ng talababa na panlalaki ang anyong Hebreo nang hindi nililimitahan ang saklaw ng pangunahing salin.
