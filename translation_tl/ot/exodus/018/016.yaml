  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: tl
  text: Kapag may usapin sila[a], dumarating ito sa akin, at humahatol ako sa pagitan ng isang tao at ng kaniyang kapwa[b]. Ipinababatid ko ang mga tuntunin ng Diyos at ang kaniyang mga kautusan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaso.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa pagitan ng isang lalaki at ng kaniyang kapwa,” isang isahang pananalitang kumakatawan sa mga taong may alitan.
    reason: cultural_note
  - marker: c
    text: O “mga tagubilin.” Maaaring tumukoy ang salitang Hebreo sa pagtuturo o tagubilin sa mas malawak na diwa, bagaman legal ang konteksto rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikita rito ng כִּי ang paulit-ulit o pangkalahatang kalagayan na nagpapaliwanag sa ginagawa ni Moises; natural sa Tagalog ang “kapag.”
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: may usapin sila
  rationale: Malawak ang דָּבָר, ngunit sa kontekstong panghukuman ay tumutukoy ito sa isang usapin o kaso. Pinananatili ng “usapin” ang sapat na lawak ng kahulugan.
- source_word: בָּא אֵלַי
  choice: lumalapit iyon sa akin
  rationale: Ang pandiwang בָּא ay isahan at pinakamalamang na ang naunang “usapin” ang simuno. Ang “iyon” ay nagpapalinaw nito nang hindi ginagawang tahasang mga tao ang simuno.
- source_word: וְשָׁפַטְתִּי
  choice: humahatol ako
  rationale: Sa kontekstong ito, ang שׁפט ay tumutukoy sa pagganap ng tungkuling panghukuman at pagbibigay ng hatol.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: sa pagitan ng isang tao at ng kaniyang kapwa
  rationale: Pinananatili nito ang isahang kinatawang pahayag ng Hebreo habang natural at inklusibo sa ordinaryong Tagalog ang “tao” at “kapwa.”
- source_word: וְהוֹדַעְתִּי
  choice: Ipinababatid ko
  rationale: Ipinahahayag ng Hiphil ng ידע ang pagpapakilala o pagpapabatid; pinananatili ng “ipinababatid” ang causative na diwa.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: mga tuntunin ng Diyos
  rationale: Ang חֻקִּים ay mga itinakda o ipinag-utos na tuntunin. Dignified at madaling maunawaan ang “mga tuntunin.”
- source_word: תּוֹרֹתָיו
  choice: kaniyang mga kautusan
  rationale: Bagaman maaaring mangahulugan ang תּוֹרָה ng mas malawak na “tagubilin,” ang legal na konteksto at pagkakatambal nito sa חֻקִּים ay sumusuporta sa “mga kautusan.”
theological_decisions:
- issue: Kinatawang pananalita sa אִישׁ ... רֵעֵהוּ
  choice: isang tao at ng kaniyang kapwa
  alternative: isang lalaki at ng kaniyang kapwa
  rationale: Ang mga anyo sa Hebreo ay panlalaking isahan, ngunit gumaganap bilang karaniwang kinatawang pormula sa batas. Ang “isang tao” ay tumpak sa sanggunian at mas natural sa Filipino nang hindi nililimitahan ang saklaw sa mga lalaki.
- issue: Kahulugan ng תּוֹרֹתָיו sa legal na konteksto
  choice: kaniyang mga kautusan
  alternative: kaniyang mga tagubilin
  rationale: Pinananatili ng “mga kautusan” ang normatibo at legal na puwersa sa konteksto, habang itinatala sa talababa ang mas malawak na posibleng kahulugang “mga tagubilin.”
- issue: Simuno ng בָּא אֵלַי
  choice: ang usapin—“lumalapit iyon sa akin”
  alternative: ang mga may usapin—“lumalapit sila sa akin”
  rationale: Isahan ang בָּא at ang pinakamalapit na isahang pangngalan ay דָּבָר, “usapin.” Gayunman, posible ayon sa konteksto ang kolektibong pagtukoy sa mga partidong lumalapit kay Moises; hindi ito tahasang ipinapasok sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “usapin,” “humahatol,” at “ipinababatid” upang mapanatili ang tonong panghukuman nang hindi maging lipas o labis na teknikal. Inayos ang pagkakalagay ng mga talababa upang tuwirang sumunod ang bawat marker sa salitang ipinaliliwanag nito.
