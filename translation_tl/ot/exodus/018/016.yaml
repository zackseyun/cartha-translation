- from: Kapag may usapin sila[a], lumalapit iyon sa akin, at humahatol ako sa pagitan ng isang tao at ng kaniyang kapwa[b]. Ipinababatid ko rin sa kanila ang mga tuntunin ng Diyos at ang kaniyang mga kautusan[c].
  to: Kapag may usapin sila[a], dumarating ito sa akin, at humahatol ako sa pagitan ng isang tao at ng kaniyang kapwa[b]. Ipinababatid ko ang mga tuntunin ng Diyos at ang kaniyang mga kautusan[c].
  rationale: Pinalitan ang “lumalapit iyon” ng “dumarating ito” upang maging natural na Filipino habang pinananatili ang usapin bilang isahang simuno, isang lehitimong pagbasa ng Hebreo. Pinasimple ang huling sugnay upang huwag magdagdag ng tahasang tagatanggap na wala sa teksto. Napanatili ang mga angkla at nilalaman ng mga talababa.
