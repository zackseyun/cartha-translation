    issue: Inaalis ng pangunahing teksto ang kalabuan ng “kaniyang mga anak at kaniyang asawa.”
    rationale: Bagaman malakas ang kontekstuwal na pagbasa na pamilya ito ni Moises (18:2–4), ang Hebreo ay gumagamit ng mga hulaping pangatlong panauhan. Dahil kinikilala ng audit trail ang posibleng ibang reperente, dapat huwag tahasang lutasin ng teksto ang kalabuang ito; ipaliwanag ito sa talababa.
  - severity: medium
