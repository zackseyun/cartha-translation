revisions:
- from: Pagkatapos, dumating kay Moises sa ilang si Jetro, na biyenan niya, kasama ang mga anak at asawa ni Moises.[a] Nagkakampo roon si Moises sa bundok ng Diyos.[b]
  to: Pagkatapos, dumating si Jetro, biyenan ni Moises, kasama ang kaniyang mga anak at ang kaniyang asawa,[a] kay Moises sa ilang, kung saan nagkakampo si Moises sa bundok ng Diyos.[b]
  rationale: Nilinaw ang relasyon ni Jetro kay Moises, ibinalik sa pangunahing teksto ang pormal na kalabuan ng mga panghalip sa Hebreo, at pinanatili ang kontekstuwal na paliwanag sa talababa nang hindi ipinapataw ito bilang tanging kahulugan. Inayos din ang ayos ng sugnay upang ang pagkakampo ni Moises sa bundok ng Diyos ay malinaw na maikabit sa tamang lugar.
