  source_fidelity: 'Ang draft ay naipapasa ang lahat ng pangunahing sangkap ng Hebreo: pagdating ni Jetro, ang ugnayan niya kay Moises, ang ilang, pagkakampo ni Moises, at ang bundok ng Diyos. Gayunman, ang tahasang “mga anak at asawa ni Moises” ay nag-aalis ng pormal na kalabuan ng mga hulaping Hebreo na kinikilala rin ng audit trail at ng kasalukuyang talababa.'
  naturalness: Natural ang pangkalahatang rehistro, ngunit hindi malinaw ang “si Jetro, na biyenan niya,” dahil ang panghalip na “niya” ay walang sapat na tuwirang tinutukoy. Mas malinaw at mas natural ang “si Jetro, biyenan ni Moises.” Ang pinagsamang pangungusap sa rebisyon ay maayos na nag-uugnay sa lugar ng pagkakampo sa bundok ng Diyos.
  terminology: Ang “Jetro,” “biyanen ni Moises,” “ilang,” at “bundok ng Diyos” ay angkop sa modernong Filipino Tagalog at matapat sa mga katawagan ng pinagmulan. Pinananatili ang “bundok ng Diyos” sa halip na ipalit ang Sinai o Horeb.
  issues:
