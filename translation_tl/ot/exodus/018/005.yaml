base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: tl
  text: Pagkatapos, dumating si Jetro, biyenan ni Moises, kasama ang kaniyang mga anak at ang kaniyang asawa,[a] kay Moises sa ilang, kung saan nagkakampo si Moises sa bundok ng Diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “ang kaniyang mga anak at ang kaniyang asawa.” Batay sa Exodo 18:2–4, malamang na si Moises ang tinutukoy; ngunit sa anyong gramatikal, maaari ring iugnay ang mga panghalip kay Jetro.
    reason: referent_ambiguity
  - marker: b
    text: Ang “bundok ng Diyos” ay katawagang kaugnay ng Sinai o Horeb; hindi ginagamit dito sa Hebreo ang alinman sa dalawang pangalang iyon.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, dumating
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay; natural na ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Ginamit ang karaniwang makabagong anyo ng pangalang Hebreo sa Filipino.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Tumpak at natural na katawagan ito sa ugnayang pampamilya; malinaw na lalaki si Jetro mula sa pangalan at konteksto kaya hindi kailangang idagdag ang “lalaki.”
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: kasama ang mga anak at asawa ni Moises
  rationale: Ipinahahayag ng “kasama” ang pagsama ng mga taong nakaugnay sa pandiwang “dumating.” Batay sa agarang konteksto ng 18:2–4, ang mga hulapi ay pinakanatural na tumutukoy kay Moises.
- source_word: אֶל־מֹשֶׁה אֶל־הַמִּדְבָּר
  choice: kay Moises sa ilang
  rationale: Pinananatili ang paglapit kay Moises at ang lugar ng pagdating sa natural na ayos ng Filipino.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: Nagkakampo roon si Moises
  rationale: Nilinaw ang reperente ng panghalip at iniwasan ang alanganing sunod-sunod na sugnay, habang pinananatili ang diwang nagpapatuloy ang pagkakampo.
- source_word: הַר הָאֱלֹהִים
  choice: bundok ng Diyos
  rationale: Tuwirang pinananatili ang deskriptibong tawag sa Hebreo sa halip na palitan ito ng Sinai o Horeb.
theological_decisions:
- issue: Tinutukoy ng mga hulapi sa “mga anak niya” at “asawa niya”
  choice: Si Moises ang tinutukoy, kaya isinaling “mga anak at asawa ni Moises.”
  alternative: Maaaring basahin sa antas ng gramatika na si Jetro ang tinutukoy.
  rationale: Malinaw sa agarang konteksto ng Exodo 18:2–4 na dinala ni Jetro kay Moises ang asawa at dalawang anak ni Moises. Gayunman, itinala sa talababa ang pormal na posibilidad ng ibang reperente.
- issue: Pagkakakilanlan ng “bundok ng Diyos”
  choice: Panatilihin ang “bundok ng Diyos.”
  alternative: Bundok Sinai o Horeb
  rationale: Hindi tahasang ginagamit sa talatang ito ang pangalang Sinai o Horeb; pinananatili ng salin ang mismong katawagan sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang dalawang pangungusap ang mahabang ayos ng Hebreo upang maiwasan ang malabong reperente at mapanatili ang natural na daloy, nang hindi inaalis ang anumang detalye.
