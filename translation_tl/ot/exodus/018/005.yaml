    rationale: Maaaring pansamantalang hindi malinaw kung sino ang tinutukoy ng “niya.” Ang Hebreong construct na “biyanen ni Moises” ay dapat isalin nang tuwiran upang malinaw ang relasyon ni Jetro kay Moises.
