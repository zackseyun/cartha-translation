  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: tl
  text: Lumabas si Moises upang salubungin ang kanyang biyenang lalaki. Yumukod siya at hinalikan niya ang kanyang biyenang lalaki. Pagkatapos, nangumusta sila sa isa’t isa[a], at pumasok sila sa tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagtanungan sila sa isa’t isa tungkol sa kapayapaan.” Ang idyomang Hebreo ay tumutukoy sa pagtatanong tungkol sa mabuting kalagayan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Sa konteksto ng pagtanggap sa dumarating na kamag-anak, likas na ipinahihiwatig ng pariralang may יצא ang paglabas upang salubungin siya, hindi isang di-sinasadyang pagkikita.
- source_word: חֹתְנוֹ
  choice: ang kanyang biyenang lalaki
  rationale: Tumutukoy ang חֹתֵן kay Jetro bilang ama ng asawa ni Moises. Pinananatili ng “biyenang lalaki” ang tiyak na ugnayang pampamilya.
- source_word: וַיִּשְׁתַּחוּ
  choice: Yumukod siya
  rationale: Ipinahahayag ng pandiwa ang pisikal na pagyukod bilang pagpipitagan, nang hindi ipinapalagay na pagsamba ang kilos.
- source_word: וַיִּשַּׁק לוֹ
  choice: at hinalikan ito
  rationale: Tuwirang inilalarawan ang nakaugaliang halik sa pagbati. Malinaw sa naunang pangungusap na ang tinutukoy ng “ito” ay ang biyenang lalaki ni Moises.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: nangumusta sila sa isa’t isa
  rationale: Ang idyomang שאל לשלום ay pagtatanong tungkol sa mabuting kalagayan ng isang tao. Ang “sa isa’t isa” ay kumakatawan sa אִישׁ לְרֵעֵהוּ at natural sa makabagong Tagalog.
- source_word: הָאֹהֱלָה
  choice: sa tolda
  rationale: Ipinakikita ng hulaping patungo ang pagpasok sa tolda. Hindi idinagdag ang “ni Moises” sapagkat hindi iyon tahasang sinasabi ng Hebreo.
theological_decisions:
- issue: Kahulugan ng pagyukod ni Moises sa harap ni Jetro
  choice: Pisikal na pagyukod bilang pagpipitagan
  alternative: Pagpapatirapa bilang pagsamba
  rationale: Maaari ring gamitin ang pandiwa sa mga tagpo ng pagsamba, ngunit sa pagkakasunod-sunod ng pagbati sa isang taong kamag-anak, hindi ipinapahayag ng talata na pagsamba ang kilos. Pinananatili ng “yumukod” ang kilos nang hindi nilulutas nang lampas sa teksto ang layunin nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “biyenang lalaki” para sa tiyak na ugnayan, “salubungin” para sa sadyang pagtanggap sa dumarating, at “nangumusta” bilang natural na katumbas ng idyomang Hebreo. Inilagay ang talababa sa pariralang aktuwal nitong ipinapaliwanag.
