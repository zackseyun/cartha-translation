  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: tl
  text: At babalaan mo sila tungkol sa mga tuntunin at mga kautusan[a]. Ipaalam mo sa kanila ang daang dapat nilang lakaran[b] at ang gawaing dapat nilang gawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga tagubilin” o “mga aral” para sa “mga kautusan” (Hebreo: torot). Mas malawak ang maaaring kahulugan ng salita, ngunit pinapaboran dito ng legal na konteksto ang “mga kautusan.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang daang lalakaran nila roon.” Pinanatili ang “lakaran” upang maipakita ang Hebreong talinghaga para sa asal at pamumuhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: At babalaan mo
  rationale: Pinananatili ng “babalaan” ang diwa ng Hiphil ng זהר bilang taimtim na pagtuturo na may kasamang pag-iingat at pananagutan.
- source_word: הַחֻקִּים
  choice: mga tuntunin
  rationale: Ipinahihiwatig ng חֻקִּים ang mga itinakdang alituntunin o batas; natural at malinaw sa modernong Filipino ang “mga tuntunin.”
- source_word: הַתּוֹרֹת
  choice: mga kautusan
  rationale: Bagaman maaaring mangahulugan ang תּוֹרֹת ng “mga aral” o “mga tagubilin,” pinapaboran ng legal at panghukom na konteksto ang “mga kautusan.”
- source_word: וְהוֹדַעְתָּ
  choice: Ipaalam mo
  rationale: Tuwirang ipinapahayag ng “ipaalam” ang causative na diwang “gawing malaman” ng Hiphil ng ידע.
- source_word: הַדֶּרֶךְ
  choice: ang daan
  rationale: Pinananatili ng “daan” ang Hebreong talinghaga para sa asal o paraan ng pamumuhay.
- source_word: יֵלְכוּ בָהּ
  choice: dapat nilang lakaran
  rationale: Pinananatili ang larawang “paglakad” at ipinapahayag ng “dapat” ang preskriptibong puwersa ng konteksto.
- source_word: הַמַּעֲשֶׂה
  choice: ang gawain
  rationale: Ang מַעֲשֶׂה ay tumutukoy sa bagay na ginagawa; ang “gawain” ay likas sa Filipino at sapat na malawak para sa hinihinging kilos o tungkulin.
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: dapat nilang gawin
  rationale: Natural na ipinapahayag nito ang obligasyong nakapaloob sa konteksto sa halip na ituring lamang ang anyo bilang payak na panghinaharap.
