base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: tl
  text: Kung gagawin mo ito[a] at uutusan ka ng Diyos, makatatagal ka[b], at ang buong bayang ito ay makararating din nang payapa sa kani-kanilang mga lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bagay na ito,” “ang usaping ito,” o “ang planong ito.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “magagawa mong tumayo”; sa kontekstong ito, “makatatagal ka” o “mananatili kang matatag.”
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo, “darating sa kaniyang lugar.” Kolektibo ang “bayan,” kaya distributibo ang diwa: makararating ang bawat isa sa kani-kaniyang lugar nang payapa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶת־הַדָּבָר הַזֶּה תַּעֲשֶׂה
  choice: Kung gagawin mo ito
  rationale: Tuwirang ipinahahayag ang kondisyon. Ang “ito” ay natural na tumutukoy sa panukalang kalalagay lamang ni Jetro nang hindi nililimitahan kung ito ay bagay, usapin, o plano.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: at iuutos ito sa iyo ng Diyos
  rationale: Pinananatili ang ikalawang kondisyon—ang pagsang-ayon sa payo ay nakasalalay rin sa utos ng Diyos. Nilinaw ng “ito” ang likas na layon ng pandiwang Tagalog.
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: makatatagal ka
  rationale: Ang יכל kasama ng pawatas ay nagsasaad ng kakayahan, at ang עמד, bagaman literal na “tumayo,” ay tumutukoy rito sa kakayahang manatiling matatag sa bigat ng tungkulin.
- source_word: כָּל־הָעָם הַזֶּה
  choice: ang buong bayang ito
  rationale: Ang עָם ay kolektibong pangngalan. Natural sa Tagalog ang “buong bayang ito” at napananatili nito ang kolektibong diwa at pantukoy.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: makauuwi ... bawat isa sa kani-kanilang lugar
  rationale: Ang בוא ay maaaring “pumaroon/dumating,” at ang panlalaking isahan sa “kaniyang lugar” ay distributibo dahil kolektibo ang “bayan.” Ipinahahayag ng salin ang pagbabalik ng bawat tao sa sariling lugar.
- source_word: בְשָׁלוֹם
  choice: nang payapa
  rationale: Natural na Tagalog para sa שָׁלוֹם sa kontekstong ito, habang pinananatili ang diwa ng kapayapaan at mabuting kalagayan.
theological_decisions:
- issue: Ang kondisyon ng payo ni Jetro kaugnay ng utos ng Diyos
  choice: Iniharap ang paggawa nito at ang pag-uutos ng Diyos bilang magkaugnay na mga kondisyon.
  alternative: 'Maaaring unawain ang sugnay bilang kasunod na pangyayari: “at uutusan ka ng Diyos.”'
  rationale: Sa pagkakaugnay ng mga sugnay, hindi ipinapalagay na sapat ang sariling awtoridad ni Jetro; nakasalalay ang payo sa utos ng Diyos.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “makatatagal” sa halip na literal ngunit maaaring malabong “makatatayo,” at ang distributibong parirala sa hulihan upang maipahayag nang natural ang kolektibong isahan ng Hebreo.
