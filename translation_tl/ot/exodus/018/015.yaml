base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: tl
  text: Sinabi ni Moises sa kanyang biyenan, “Sapagkat lumalapit sa akin ang mga tao upang hanapin ang Diyos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang sumangguni sa Diyos” o “upang humingi ng pasiya mula sa Diyos.” Maaaring kabilang sa idyomang Hebreo ang pagsangguni sa Diyos para sa patnubay o paghatol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salin ng pandiwang nagsisimula ng tugon ni Moises sa salaysay; natural ang payak na aspektong naganap sa Filipino.
- source_word: לְחֹתְנוֹ
  choice: sa kanyang biyenan
  rationale: Sa konteksto, tumutukoy ang חֹתֵן kay Jetro bilang biyenan ni Moises. Likas sa Filipino ang “biyenan” kahit hindi nito tahasang tinutukoy kung ama o ina ng asawa; malinaw sa konteksto ang tinutukoy.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng ginagawa ni Moises bilang sagot sa tanong ni Jetro. Ang “sapagkat” ay malinaw, marangal, at angkop sa tuwirang pananalita.
- source_word: יָבֹא אֵלַי הָעָם
  choice: lumalapit sa akin ang mga tao
  rationale: Ipinahihiwatig ng בוא + אֶל ang paglapit o pagpunta kay Moises. Ang aspektong nagaganap o inuulit-ulit ay angkop sa paliwanag tungkol sa nakaugaliang ginagawa ng mga tao.
- source_word: לִדְרֹשׁ
  choice: upang hanapin
  rationale: Maaaring mangahulugan ang דרש na hanapin, sumangguni, o magtanong. Pinananatili ng “hanapin” ang mas malawak na diwa ng Hebreo, habang inilalahad sa talababa ang mas tiyak na kahulugang kaugnay ng paggabay o paghatol.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Tuwirang tumutukoy ang Hebreo sa Diyos, hindi lamang sa kanyang kalooban o sa isang pasiya; kaya pinanatili ang tahasang reperensiyang teolohikal.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang לִדְרֹשׁ אֱלֹהִים
  choice: upang hanapin ang Diyos
  alternative: upang sumangguni sa Diyos; upang humingi ng pasiya mula sa Diyos
  rationale: Maaaring tumukoy ang parirala sa pangkalahatang paghahanap sa Diyos o sa pagsangguni sa kanya para sa patnubay o paghatol, lalo na sa konteksto ng mga usapin ng bayan. Pinananatili ng pangunahing salin ang lawak at tensiyon ng orihinal, at inilalagay sa talababa ang mas tiyak na mga posibilidad.
translation_notes:
  register: Makabagong Filipino na natural ngunit marangal. Ginamit ang “lumalapit” sa halip na mas literal na “pumupunta” upang maging maayos sa konteksto ng pagharap kay Moises. Ang “biyenan” ay karaniwang katawagan sa Filipino; ipinauunawa ng konteksto na ama ng asawa ni Moises ang tinutukoy.
