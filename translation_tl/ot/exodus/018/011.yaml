  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: tl
  text: Ngayon ay alam kong higit na dakila si Yahweh kaysa sa lahat ng mga diyos, sapagkat sa bagay na nagmataas sila laban sa kanila, nanaig siya sa kanila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “sapagkat sa bagay na nagmataas sila laban sa kanila.” Mahirap unawain ang hulíng sugnay sa Hebreo, lalo na ang mga tinutukoy ng mga panghalip. Maaaring tumukoy ito sa mapagmataas na pagtrato ng mga Ehipsiyo sa mga Israelita at sa pangingibabaw ni Yahweh sa mga Ehipsiyo.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Ngayon ay alam ko
  rationale: Ipinahahayag ng ganap na pandiwa ang kasalukuyang pagkilalang bunga ng nasaksihang pagliligtas; natural ito sa modernong Filipino.
- source_word: גָדוֹל ... מִכָּל
  choice: higit na dakila ... kaysa sa lahat
  rationale: Ang מִן kasama ng כָּל ay naghuhudyat ng paghahambing; malinaw at marangal ang katumbas sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הָאֱלֹהִים
  choice: mga diyos
  rationale: Ang maramihang anyo ay tumutukoy sa mga diyos na inihahambing kay Yahweh sa pahayag ni Jetro.
- source_word: בַדָּבָר אֲשֶׁר זָדוּ
  choice: sa mismong bagay na ipinagmalaki nila
  rationale: Ipinahihiwatig ng זָדוּ ang mapagmataas o mapangahas na pagkilos; ipinakikita ng “mismong” na doon mismo nahayag ang pangingibabaw ni Yahweh.
- source_word: עֲלֵיהֶם
  choice: laban sa mga Israelita ... sa kanila
  rationale: 'Mahirap at siksik ang hulíng sugnay. Ginagawang malinaw sa pangunahing teksto ang malamang na mga tinutukoy: ang kayabangan ng mga Ehipsiyo laban sa Israel at ang pangingibabaw ni Yahweh sa mga Ehipsiyo, habang itinatala sa talababa ang mas literal at malabong anyo.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang pinagmulan ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng mahirap na hulíng sugnay
  choice: Ang mga Ehipsiyo ay nagmalaki laban sa mga Israelita, ngunit nanaig sa kanila si Yahweh
  alternative: “sapagkat sa bagay na ipinagmalaki nila laban sa kanila” nang hindi nililinaw ang mga tinutukoy
  rationale: Ito ang pinakamalamang na diwa ayon sa konteksto ng pagliligtas sa Israel mula sa Ehipto, ngunit hindi tiyak ang sintaks at mga tinutukoy kaya pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “higit na dakila” para sa tahasang paghahambing at “nanaig” upang maipahayag nang natural ang malamang na diwa ng siksik na hulíng sugnay. Ang talababa ay minarkahan sa pangunahing teksto bilang [a].
