  - severity: low
    issue: Hindi gaanong idiomatiko ang “ipinagmalaki nila laban sa”
    rationale: Mas malinaw na naipahahayag ng “nagmataas sila laban sa kanila” ang pandiwang זָדוּ at mas natural ito sa modernong Filipino.
