  to: Ngayon ay alam kong higit na dakila si Yahweh kaysa sa lahat ng mga diyos, sapagkat sa bagay na nagmataas sila laban sa kanila, nanaig siya sa kanila.[a]
  rationale: Inalis ang mga pangkat na idinagdag sa pangunahing teksto upang mapanatili ang sintaktikong kalabuan ng Hebreo, habang itinatala sa talababa ang posibleng kontekstuwal na pagtukoy. Pinalitan din ang hindi gaanong natural na “ipinagmalaki nila laban sa” ng “nagmataas sila laban sa kanila.”
