base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: tl
  text: Kinuha ni Jetro, na biyenan ni Moises, si Zipora na asawa ni Moises, matapos siyang paalisin ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “matapos siyang paalisin.” Literal sa Hebreo, “matapos ang pagpapaalis sa kaniya”; hindi tahasang tinutukoy kung sino ang nagpaalis.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang kahulugan ng לקח ang “kunin.” Pinananatili ng “kinuha” na bukas kung tinanggap ni Jetro si Zipora sa kaniyang pangangalaga o isinama niya ito.
- source_word: יִתְרוֹ
  choice: Jetro
  rationale: Ginamit ang karaniwang makabagong Tagalog na anyo ng pangalan.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Tinutukoy ng חֹתֵן ang kaugnayan sa pamamagitan ng pag-aasawa; natural at malinaw sa Tagalog ang “biyenan ni Moises.”
- source_word: צִפֹּרָה
  choice: Zipora
  rationale: Ginamit ang nakaugaliang transliterasyon sa Tagalog.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: asawa ni Moises
  rationale: Tuwirang katumbas at natural na pagkakabuo sa Tagalog.
- source_word: אַחַר
  choice: matapos
  rationale: Ipinapahayag nito ang temporal na pagkakasunod ng mga pangyayari sa natural na Tagalog.
- source_word: שִׁלּוּחֶיהָ
  choice: siyang paalisin ni Moises
  rationale: Ang literal na diwa ay “pagpapaalis sa kaniya,” ngunit hindi tahasang binabanggit sa Hebreo ang gumawa nito. Isinasaad sa pangunahing teksto ang malamang na ahenteng si Moises, habang pinananatili sa talababa ang likas na kalabuan.
theological_decisions:
- issue: Hindi tahasang tinukoy na ahente sa שִׁלּוּחֶיהָ (“pagpapaalis sa kaniya”)
  choice: “matapos siyang paalisin ni Moises”
  alternative: “matapos siyang paalisin” o “matapos ang pagpapaalis sa kaniya”
  rationale: Nominal ang anyong Hebreo at hindi nito tahasang sinasabi kung sino ang nagpaalis. Malamang na si Moises ang ipinahihiwatig ng konteksto, ngunit tunay ang kalabuan kaya itinala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “biyenan” dahil hindi kailangang ulitin ang kasarian ng kaugnayan matapos pangalanang si Jetro. Ang pangungusap ay nananatiling malapit sa ayos at diwa ng Hebreo habang natural sa karaniwang mambabasa.
