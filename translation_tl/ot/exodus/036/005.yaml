base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: tl
  text: Sinabi nila kay Moises, “Higit pa sa kailangan[a] ang dinadala ng mga tao para sa gawaing ipinag-utos ni Yahweh na isagawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Sobra ang dinadala ng mga tao para sa gawain.” Idiniriin ng Hebreong pananalita na lumalampas sa kailangan ang kanilang mga ambag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Sinabi nila kay Moises
  rationale: Likas sa makabagong Tagalog na alisin ang literal at paulit-ulit na ‘na sinasabi,’ habang pinananatili ang pagpapakilala sa tuwirang pananalita.
- source_word: מַרְבִּים ... לְהָבִיא מִדֵּי
  choice: Higit pa sa kailangan ang dinadala
  rationale: Ipinahahayag ng parirala ang patuloy na pagdadala ng mga handog na lumalampas sa sapat na dami; natural itong sabihin sa Tagalog nang hindi pinahihina ang diwa ng kalabisan.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tuwirang kolektibong pagtukoy sa sambayanan ng Israel sa konteksto.
- source_word: הָעֲבֹדָה ... לַמְּלָאכָה
  choice: para sa gawain
  rationale: Magkaugnay rito ang ‘paglilingkod/paggawa’ at ang tiyak na gawaing kailangang isakatuparan. Ang ‘gawain’ ay malinaw at natural sa konteksto ng pagtatayo ng tabernakulo.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: na ipinag-utos ni Yahweh na isagawa
  rationale: Pinananatili nito ang utos ng Diyos at ang diwa ng pagsasakatuparan sa gawain, sa natural at marangal na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang pangalang tipan na ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa dami ng mga ambag
  choice: Higit pa sa kailangan
  alternative: Sobra ang dinadala
  rationale: Hindi lamang kasaganaan kundi paglampas sa kinakailangang dami ang ipinahahayag ng Hebreo. Pinananatili ng pangunahing salin ang diin sa kasapatan nang hindi nagbibigay ng negatibong moral na pahiwatig.
- issue: Paglalapat sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tahasang ginagamit sa Hebreo ang banal na pangalan, kaya pinananatili ito bilang ‘Yahweh’ sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘ipinag-utos’ at ‘isagawa’ upang maging angkop sa banal na salaysay nang hindi nagiging makaluma o labis na teknikal.
