  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: tl
  text: Gumawa siya ng mga tabing na yari sa balahibo ng kambing[a] upang magsilbing tolda sa ibabaw ng tabernakulo; gumawa siya ng labing-isang tabing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga tabing na mula sa kambing,” sapagkat hindi tahasang binabanggit ang materyal; ipinahihiwatig ng konteksto ng mga tela ng tabernakulo na balahibo ng kambing ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: gumawa / ginawa
  rationale: Karaniwang pandiwa ang עשה para sa “gumawa.” Pinananatili ng pag-uulit na “Gumawa siya” at “ginawa niya” ang diin at balangkas ng Hebreo habang natural sa Tagalog.
- source_word: יְרִיעֹת
  choice: mga tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang יְרִיעָה sa malalaking panel ng telang pantakip. Malinaw at likas sa modernong Tagalog ang “mga tabing.”
- source_word: עִזִּים
  choice: na yari sa balahibo ng kambing
  rationale: Literal na “mga kambing” ang salita, ngunit sa konteksto ng mga hinabing pantakip ay malamang na balahibo ng kambing ang materyal. Isinaad ito sa teksto habang pinanatili sa talababa ang pagiging di-tahas ng Hebreo.
- source_word: לְאֹהֶל
  choice: upang maging tolda
  rationale: Ang לְ ay nagpapahiwatig dito ng layunin o gamit. Ang “upang maging tolda” ay malinaw na nagsasabing ang mga tabing ang bumubuo sa panlabas na toldang pantakip, hindi isang hiwalay na tolda.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Ipinahihiwatig ng עַל ang lokasyon ng pantakip kaugnay ng tabernakulo; natural sa Tagalog ang “sa ibabaw ng.”
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Teknikal na katawagan ang מִשְׁכָּן para sa santuwaryong istruktura sa Exodo. Pinananatili ng “tabernakulo” ang pagkakaiba nito sa toldang pantakip sa ibabaw.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: labing-isa
  rationale: Tuwirang katumbas ng bilang na Hebreo ang “labing-isa.”
- source_word: אֹתָם
  choice: ang ginawa niya
  rationale: Ang hulaping layon ay tumutukoy pabalik sa mga tabing. Sa Tagalog, likas na muling banggitin ang “tabing” sa pariralang “labing-isang tabing ang ginawa niya,” kaya hindi kailangan ang hiwalay na panghalip.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang nakaugaliang teknikal na salitang “tabernakulo,” samantalang ang natitirang pananalita ay payak at natural. Pinanatili ang pag-uulit ng pandiwang Hebreo at ang kaibhan ng tabernakulo at ng toldang nasa ibabaw nito.
