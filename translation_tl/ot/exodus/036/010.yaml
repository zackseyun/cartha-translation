  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: tl
  text: Pinagdugtong niya ang limang tabing sa isa’t isa, at ang iba pang limang tabing ay pinagdugtong din niya sa isa’t isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at limang tabing” lamang ang nakasaad sa ikalawang sugnay. Idinagdag ang “iba pang” upang linawin na ikalawang pangkat ng limang tabing ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: pinagdugtong
  rationale: Ang חבר ay nangangahulugang pagdugtungin o pag-ugnayin. Ang “pinagdugtong” ay natural sa konteksto ng paggawa ng tabernakulo at hindi nito labis na tinutukoy ang paraan ng pagkakabit.
- source_word: יְרִיעֹת
  choice: mga tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa malalaking telang nagsisilbing pantakip o tabing. Ang “mga tabing” ay malinaw, dignified, at karaniwang salin sa Filipino.
- source_word: חֲמֵשׁ
  choice: lima
  rationale: Tuwirang salin ng bilang.
- source_word: אַחַת אֶל אֶחָת
  choice: sa isa't isa
  rationale: Ipinapahayag ng idyoma ang pagdurugtong ng bawat tabing sa kapwa nito sa loob ng bawat pangkat; natural itong pahayag sa modernong Filipino.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: at ... ang limang tabing
  rationale: Pinanatili ang literal na pag-uulit ng Hebreo, na walang tahasang salitang “iba” o “natitira.” Nililinaw ng talababa na ikalawang pangkat ng lima ang tinutukoy.
