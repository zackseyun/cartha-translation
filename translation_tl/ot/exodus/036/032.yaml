  register: Modernong Filipino na may dignidad at malinaw na bokabularyong pangkonstruksiyon. Ginamit ang “Tabernakulo” bilang nakaugaliang pantukoy sa santuwaryo; pinanatili ang estilong listahan at ang pagkakaiba ng “ikalawang tagiliran” at “pinakadulong likuran.”
