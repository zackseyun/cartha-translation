  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: tl
  text: At limang halang[a] para sa mga tabla sa ikalawang tagiliran ng Tabernakulo, at limang halang para sa mga tabla ng Tabernakulo sa pinakadulong likuran, sa dakong kanluran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pahalang na baras.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa likurang bahagi ng Tabernakulo, pakanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: mga halang
  rationale: Tumutukoy sa mahahabang pahalang na piyesang nagdurugtong at nagpapatatag sa mga tabla. Likas at maikli sa Filipino ang “halang,” habang iniiwasang magdagdag ng materyal na hindi tahasang binanggit.
- source_word: קַרְשֵׁי
  choice: mga tabla
  rationale: Ang קֶרֶשׁ ay mga yunit na kahoy na bumubuo sa estruktura ng Tabernakulo. Malinaw sa karaniwang mambabasa ang “mga tabla” at hindi nito ipinapalagay ang mas tiyak na rekonstruksiyong ipinahihiwatig ng “mga balangkas.”
- source_word: צֶלַע
  choice: tagiliran
  rationale: Ipinahihiwatig ng salita ang isang panig o gilid ng estruktura. Ang “tagiliran” ay natural sa paglalarawan ng magkabilang mahabang panig ng Tabernakulo.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Pinananatili ang literal na pagkakasunod na “ikalawa” sa halip na gawing “kabila,” yamang tahasang ordinal ang Hebreo.
- source_word: הַמִּשְׁכָּן
  choice: Tabernakulo
  rationale: Bagaman kaugnay ng “tirahan” ang literal na kahulugan, ang “Tabernakulo” ang malinaw at nakaugaliang tawag sa santuwaryong estruktura sa salaysay ng Exodo.
- source_word: לַיַּרְכָתַיִם
  choice: sa pinakadulong likuran
  rationale: Ipinahihiwatig ng יַרְכָתַיִם hindi lamang ang likuran kundi ang dulong bahagi nito. Pinananatili ng “pinakadulong likuran” ang puwersang ito nang hindi tinutukoy nang higit sa teksto ang eksaktong anyo ng estruktura.
- source_word: יָמָּה
  choice: sa dakong kanluran
  rationale: Sa kontekstong heograpiko at pang-oryentasyon, ang direksiyonal na anyong mula sa “dagat” ay nangangahulugang pakanluran o nasa dakong kanluran.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: at limang ... at limang
  rationale: Pinananatili ang paulit-ulit na koordinasyon at estilong imbentaryo ng Hebreo.
