  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hanay” upang maipahayag ang pangkat ng magkakadugtong na tabing, habang pinanatili sa “pagdurugtungan” ang saklaw ng Hebreong מַחְבָּרֶת.
