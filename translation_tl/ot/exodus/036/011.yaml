base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: tl
  text: Gumawa siya ng mga loop na yari sa asul na sinulid sa gilid ng unang tabing, sa dulong bahagi ng unang magkakadugtong na hanay[a]. Gayundin ang ginawa niya sa gilid ng pinakadulong tabing ng ikalawang magkakadugtong na hanay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pagdurugtungan.” Ang salitang Hebreo ay tumutukoy sa lugar o kaayusan kung saan pinagdudugtong ang mga tabing.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: mga silo
  rationale: Tumutukoy ito sa mga loop na yari sa tela na ginagamit sa pagdurugtong ng mga tabing; ang “mga silo” ay maikli at likas sa Filipino.
- source_word: תְּכֵלֶת
  choice: asul na sinulid
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa materyal na tinina ng asul, hindi lamang sa kulay.
- source_word: שְׂפַת
  choice: gilid
  rationale: Ang salita ay tumutukoy rito sa hangganan o gilid ng tabing.
- source_word: הַיְרִיעָה
  choice: tabing
  rationale: Tumutukoy sa isang panel ng pantabing sa tabernakulo; malinaw at karaniwan ang “tabing” sa Filipino.
- source_word: הָאֶחָת
  choice: unang
  rationale: Bagaman literal na “isa,” ginagamit ito rito bilang ordinal na kaagapay ng “ikalawa” sa hulihan ng talata.
- source_word: מִקָּצָה
  choice: sa dulo
  rationale: Ipinakikita nito ang kinalalagyan sa pinakahangganan ng tabing.
- source_word: בַּמַּחְבָּרֶת
  choice: sa pagdurugtungan
  rationale: Pinananatili nito ang di-tiyak na pagtukoy sa lugar o kaayusan kung saan pinagdudugtong ang mga tabing, nang hindi ito labis na nililinaw.
- source_word: כֵּן עָשָׂה
  choice: Gayundin ang ginawa niya
  rationale: Likas na Filipino na nagpapanatili sa magkatugmang kilos sa dalawang hanay.
- source_word: הַקִּיצוֹנָה
  choice: pinakadulong
  rationale: Ipinahahayag ang tabing na nasa sukdulang dulo ng hanay.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Malinaw na kinikilala ang ikalawang pinagdudugtong na hanay.
theological_decisions: []
