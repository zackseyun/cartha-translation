revisions:
- from: At ang lahat ng bihasang manggagawa[a] na kabilang sa mga gumagawa ng gawain ay gumawa ng tabernakulo mula sa sampung tabing na yari sa pinong sinulid na linong pinilipit, at sa asul, purpura, at eskarlatang sinulid. Ginawa niya[b] ang mga iyon na may mga kerubin, na gawa ng isang bihasang tagapagdisenyo.
  to: At ang lahat ng bihasang manggagawa[a] na kasali sa gawain ay gumawa ng tabernakulo gamit ang sampung tabing na yari sa pinong pinilipit na sinulid na lino, at sa sinulid na asul, purpura, at eskarlata. Ginawa niya[b] ang mga iyon na may mga kerubin, na gawa ng isang bihasang tagapagdisenyo.
  rationale: Inayos ang mga pariralang hindi likas sa Tagalog at nilinaw ang relasyon ng sampung tabing sa paggawa ng tabernakulo. Hindi binago ang bilang na maramihan sa simula o ang isahang “ginawa niya” sa dulo; pinananatili rin ang talababa para sa tekstuwal na iregularidad na ito.
