base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: tl
  text: At ang lahat ng bihasang manggagawa[a] na kasali sa gawain ay gumawa ng tabernakulo gamit ang sampung tabing na yari sa pinong pinilipit na sinulid na lino, at sa sinulid na asul, purpura, at eskarlata. Ginawa niya[b] ang mga iyon na may mga kerubin, na gawa ng isang bihasang tagapagdisenyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “marunong sa puso,” isang idyoma para sa bihasang manggagawa o artisan.
    reason: lexical_alternative
  - marker: b
    text: Nagtatapos ang Hebreo sa pandiwang isahan, “ginawa niya ang mga iyon,” bagaman maramihan ang simuno at pandiwa sa simula ng talata. Isinasalin naman ito ng ilan bilang “ginawa nila ang mga iyon.”
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: bihasang manggagawa
  rationale: Ang literal na “marunong sa puso” ay isang idyoma para sa taong may kasanayan sa gawaing-kamay. Ang “bihasang manggagawa” ay malinaw at natural sa modernong Tagalog.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: na kabilang sa mga gumagawa ng gawain
  rationale: Ipinahahayag nito na ang mga bihasang manggagawa ay kabilang sa mas malaking pangkat na abala sa gawain.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakaugaliang terminong Tagalog para sa santuwaryong tirahan sa salaysay ng Exodo at mas tiyak kaysa sa pangkalahatang “tirahan.”
- source_word: יְרִיעֹת
  choice: mga tabing
  rationale: Tumutukoy ito sa malalaking piraso ng telang bumubuo sa tabernakulo; natural at angkop sa konteksto ang “mga tabing.”
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong sinulid na linong pinilipit
  rationale: Pinananatili nito kapuwa ang kalidad ng lino at ang detalye na ang hibla o sinulid ay pinilipit.
- source_word: תְכֵלֶת
  choice: asul
  rationale: Tumutukoy sa mamahaling materyal o sinulid na tinina ng asul; ang “sinulid” ay ipinahihiwatig sa magkakasunod na kulay.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Ang “purpura” ay dignified at nakaugaliang katawagan sa mamahaling kulay na ito sa kontekstong biblikal.
- source_word: תוֹלַעַת שָׁנִי
  choice: eskarlatang sinulid
  rationale: Ipinakikita ng parirala ang materyal na tinina ng matingkad na pula; nililinaw ng “sinulid” ang gamit nito sa paghahabi.
- source_word: כְּרֻבִים
  choice: mga kerubin
  rationale: Ang “kerubin” ang pormal at nakaugaliang anyong biblikal sa Tagalog.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: gawa ng isang bihasang tagapagdisenyo
  rationale: Ipinahahayag nito ang masining at planadong pagkakayari nang hindi ipinapalagay nang higit sa teksto ang isang tiyak na teknik gaya ng pagbuburda.
- source_word: עָשָׂה אֹתָם
  choice: Ginawa niya ang mga iyon
  rationale: Pinananatili ang pandiwang isahan sa hulihan ng Hebreo sa halip na pakinisin ito bilang maramihan.
theological_decisions:
- issue: Paglalarawan sa חֲכַם לֵב sa pangkalahatang konteksto ng mga artisan
  choice: bihasang manggagawa
  alternative: lalaking bihasa; taong may kasanayan
  rationale: Bagaman panlalaki ang anyong Hebreo, kolektibo at pangkalahatan ang gamit kasama ng כָּל at ng pandiwang maramihan. Hindi kailangang magdagdag ng “lalaki” sa Tagalog, samantalang pinananatili ng “manggagawa” ang papel sa konteksto.
- issue: Pandiwang isahan sa dulo matapos ang simuno at pandiwang maramihan sa simula
  choice: Ginawa niya ang mga iyon
  alternative: Ginawa nila ang mga iyon
  rationale: Hindi pinapantay ang di-pagkakatugma ng bilang sa tekstong Hebreo. Pinananatili ang tunay na tensiyon sa gramatika at ipinapaliwanag ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang mga nakaugaliang terminong biblikal na “tabernakulo,” “purpura,” “eskarlata,” at “kerubin.” Inilipat ang mga pananda ng talababa sa mismong salitang o pariralang kanilang ipinaliliwanag.
