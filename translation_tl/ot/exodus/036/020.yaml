  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: tl
  text: At ginawa niya mula sa kahoy na akasya ang mga tabla para sa tabernakulo; nakatayo ang mga ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “At ginawa niya ang mga tabla para sa tabernakulo mula sa kahoy na akasya, na nakatayo.”'
    reason: Ipinapakita ang mas malapit na ayos ng mga pariralang Hebreo habang pinananatiling ang “nakatayo” ay tumutukoy sa mga tabla.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay at likas na isinasalin bilang payak na naganap na kilos. Pinananatili ng “At ginawa niya” ang pagkakasunod-sunod nang hindi dinaragdagan ang paraan ng paggawa.
- source_word: הַקְּרָשִׁים
  choice: ang mga tabla
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang קֶרֶשׁ sa mahahabang sangkap na bumubuo sa matibay na dingding o balangkas. Ang “mga tabla” ay malinaw at karaniwang salitang pang-arkitektura sa Filipino.
- source_word: לַמִּשְׁכָּן
  choice: para sa tabernakulo
  rationale: Ang מִשְׁכָּן ay ang banal na tirahang inilalarawan sa Exodo. Ang “tabernakulo” ang kinikilalang terminong Filipino at mas tiyak dito kaysa sa pangkalahatang “tirahan.”
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang parirala ay literal na tumutukoy sa kahoy ng punong shittah, na karaniwang kinikilalang akasya. Likas sa Filipino ang “kahoy na akasya,” at ipinahihiwatig ng “mula sa” na ito ang materyales ng mga tabla.
- source_word: עֹמְדִים
  choice: patayong nakatayo ang mga ito
  rationale: Ang pangmaramihang participle ay tumutukoy sa ayos o posisyon ng mga tabla. Nililinaw ng sugnay na ito sa natural na Filipino na ang mga tabla, hindi lamang ang kahoy bilang materyales, ang nakatayong patayo.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang tradisyonal at tiyak na terminong “tabernakulo,” samantalang inayos ang huling participle bilang maikling sugnay upang maging natural at malinaw sa Filipino.
