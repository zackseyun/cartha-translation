  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: tl
  text: Sampung siko ang haba ng bawat balangkas[a], at isang siko at kalahati ang lapad nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “tabla” o “makapal na tabla” ang salin sa “balangkas” (Hebreo: קֶרֶשׁ); tumutukoy ang salita sa mga bahaging bumubuo sa estruktura ng tabernakulo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת
  choice: sampung siko
  rationale: Tuwirang pinananatili ang sinaunang yunit na אַמָּה bilang “siko,” sa halip na tantiyahin sa makabagong sukat.
- source_word: אֹרֶךְ
  choice: haba
  rationale: Ang pangngalan ay tumutukoy sa dimensiyong haba; natural sa Tagalog ang hulma na “ang haba ng bawat…”
- source_word: הַקָּרֶשׁ
  choice: balangkas
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang קֶרֶשׁ sa mga nakatayong bahaging estruktural. Ipinahihiwatig ng “balangkas” ang tungkuling ito nang hindi tiyak na ipinapalagay na payak lamang itong tabla; inilalahad sa talababa ang mga leksikal na alternatibo.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: isang siko at kalahati
  rationale: Natural na katumbas sa Tagalog ng Hebreong idyomang literal na “isang siko at kalahati ng siko.”
- source_word: רֹחַב
  choice: lapad
  rationale: Karaniwan at malinaw na makabagong salin ng dimensiyong width/breadth.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: bawat balangkas
  rationale: Bagaman literal na “ang isang balangkas,” distributibo ang diwa sa kontekstong nagbibigay ng pare-parehong sukat ng mga bahagi.
