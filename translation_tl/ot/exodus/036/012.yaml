base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: tl
  text: Gumawa siya ng limampung loop sa isang tabing, at gumawa siya ng limampung loop sa gilid ng tabing na nasa ikalawang magkakadugtong na hanay; ang mga loop ay magkakatapat, isa’t isa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלָאֹת
  choice: mga silo
  rationale: Tumutukoy ito sa mga loop na yari sa tela para pagdugtungin ang mga tabing. Ang “silo” ay malinaw na naiiba sa mga kawit na metal na binabanggit sa kasunod na talata.
- source_word: יְרִיעָה
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa malalaking piraso ng telang nagsisilbing pantakip o kurtina; natural at marangal sa Filipino ang “tabing.”
- source_word: בִּקְצֵה
  choice: sa gilid ng
  rationale: Ipinahihiwatig ng קָצֶה ang gilid o dulo; dito, nasa hangganan ng tabing ang mga silong ginagamit sa pagdurugtong.
- source_word: מַחְבֶּרֶת
  choice: magkakadugtong na hanay
  rationale: Tumutukoy ito sa isang yunit na nabuo mula sa mga tabing na pinagdudugtong. Nililinaw ng parirala ang pisikal na ayos nang hindi ginagawang labis na teknikal ang salin.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Pinananatili ang tiyak na ordinal na kahulugan ng Hebreo.
- source_word: מַקְבִּילֹת
  choice: magkakatapat
  rationale: Ipinapahayag nito na ang mga silo ay nakahanay at nakaharap sa katumbas na silo sa kabilang tabing.
- source_word: אַחַת אֶל אֶחָת
  choice: isa sa isa
  rationale: Pinananatili ang kongkreto at distributibong pahayag ng Hebreo na bawat silo ay katapat ng isa pa.
- source_word: עָשָׂה
  choice: gumawa
  rationale: Payak at tuwirang katumbas ng karaniwang pandiwang Hebreo sa ulat ng pagtatayo.
