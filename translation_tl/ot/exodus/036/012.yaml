  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang paulit-ulit na “gumawa siya,” gaya ng Hebreo, at ginamit ang bokabularyong angkop sa paglalarawan ng konstruksiyon ng tabernakulo.
