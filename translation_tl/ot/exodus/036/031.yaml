base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: tl
  text: Gumawa siya ng limang halang na yari sa kahoy na akasya para sa mga balangkas[a] ng isang tagiliran ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla,” para sa mga nakatayong piyesang bumubuo sa tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang wayyiqtol ng עשה ay nagsasalaysay ng kasunod na ginawa. Natural sa modernong Tagalog ang pangungusap na walang tahasang “at” habang nananatili ang daloy ng salaysay.
- source_word: בְּרִיחֵי
  choice: mga halang
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa mahahabang pahalang na piyesang nag-uugnay at nagpapatatag sa mga nakatayong balangkas. Ang “halang” ay malinaw at hindi nagmumungkahi ng makitid na kahulugan ng kandado o trangka.
- source_word: עֲצֵי שִׁטִּים
  choice: na yari sa kahoy na akasya
  rationale: Ipinapahayag nito nang natural sa Tagalog na ang materyales ng mga halang ay kahoy mula sa akasya.
- source_word: חֲמִשָּׁה
  choice: limang
  rationale: Tuwirang salin ng bilang na tumutukoy sa mga halang.
- source_word: לְקַרְשֵׁי
  choice: para sa mga balangkas
  rationale: Ang קֶרֶשׁ ay tumutukoy sa mga nakatayong piyesang bumubuo sa estruktura. Mas naipahahayag ng “mga balangkas” ang tungkuling pang-estruktura kaysa sa mas tiyak ngunit posible ring “mga tabla.”
- source_word: צֶלַע
  choice: tagiliran
  rationale: Sa kontekstong pang-arkitektura, ang salita ay tumutukoy sa isang gilid o tagiliran ng gusali, hindi sa literal na tadyang.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakagawiang tawag sa Tagalog para sa santuwaryong istruktura sa Exodo at malinaw na naiiba sa karaniwang tirahan.
- source_word: הָאֶחָת
  choice: isang
  rationale: Ang anyong pambabaeng isahan ay kaayon ng צֶלַע at tumutukoy sa isa sa mga tagiliran; hindi nito kinakailangang sabihing ito ang una.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang “halang” bilang likas na terminong pangkonstruksiyon at pinanatili sa talababa ang posibleng saling “mga tabla” para sa קֶרֶשׁ.
