  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: tl
  text: Sapat ang mga materyales upang magawa ang lahat ng gawain, at may sobra pa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at may natira pa.” Maaaring idiin ng pandiwang Hebreo ang sobrang natira matapos matugunan ang kailangan para sa gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: ang mga materyales
  rationale: Karaniwang nangangahulugang “gawain” ang מְלָאכָה, ngunit sa kontekstong ito tumutukoy ito sa mga handog na gagamitin sa pagtatayo. Ang “mga materyales” ang likas at malinaw na salin sa Filipino.
- source_word: הָיְתָה דַיָּם
  choice: sapat
  rationale: Ipinahahayag ng דַּי ang kasapatan; ang hulaping panghalip ay tumutukoy sa mga materyales na dinala. Sapat nang naipahihiwatig sa natural na Filipino ang pandiwang copula na הָיְתָה.
- source_word: לְכָל הַמְּלָאכָה לַעֲשׂוֹת אֹתָהּ
  choice: para gawin ang lahat ng gawain
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at inilalahad nang natural ang layunin ng mga materyales—ang pagsasagawa ng buong gawain.
- source_word: וְהוֹתֵר
  choice: at may labis pa
  rationale: Ang Hiphil ng יתר ay nagpapahayag ng pag-iral ng sobrang higit sa kailangan. Ang “may labis pa” ay maikli, natural, at pinananatili ang diwa ng surplus.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang karaniwang “materyales” upang maging likas ang pahayag, habang pinanatili sa ikalawang gamit ng מְלָאכָה ang literal at malinaw na “gawain.”
