base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: tl
  text: Magkatugma ang mga iyon sa ibaba[a], at magkakabuo hanggang sa tuktok nito, hanggang sa iisang singsing[b]. Gayundin ang ginawa niya sa dalawang iyon, para sa dalawang sulok[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magkapares” o “magkatapat.” Idiniriin ng Hebreo na ang dalawang bahagi ay tumutugma sa isa’t isa sa kayarian.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ganap” o “buo hanggang sa tuktok nito.” Maaaring tumukoy ang parirala sa pagiging ganap ng dalawang bahagi o sa lubos nilang pagkakadugtong hanggang sa itaas.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “para sa dalawang piyesa sa sulok.” Literal na sinasabi ng Hebreo na “para sa dalawang sulok,” na malamang ay tumutukoy sa mga balangkas o tabla roon.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: magkatugma
  rationale: Ipinahihiwatig ng salita na ang dalawang bahagi ay magkatapat at tumutugma bilang pares; mas malinaw ito sa kontekstong pangkayarian kaysa sa payak na “magkapares.”
- source_word: מִלְּמַטָּה
  choice: sa ibaba
  rationale: Tinutukoy nito ang ibabang bahagi kung saan magkatugma ang mga piyesa.
- source_word: יַחְדָּו
  choice: magkasama
  rationale: Tuwirang pinananatili ang diin ng Hebreo na ang dalawang bahagi ay magkasamang umaabot o nabubuo.
- source_word: תַמִּים
  choice: buo
  rationale: Pinananatili ang maaaring kahulugang buo, ganap, o lubos na magkadugtong nang hindi inuulit lamang ang ideya ng naunang “magkatugma.”
- source_word: אֶל רֹאשׁוֹ
  choice: hanggang sa tuktok nito
  rationale: Ipinapakita ng “hanggang” ang pag-abot mula sa ibaba patungo sa itaas; pinananatili rin ang isahang panghalip ng Hebreo.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: sa iisang singsing
  rationale: Natural na Filipino ito para sa literal na “sa isang/kaisa-isang singsing” at hindi ito binibigyang-kahulugang “unang singsing.”
- source_word: כֵּן עָשָׂה
  choice: Gayundin ang ginawa niya
  rationale: Ipinahahayag nito na ang kaparehong paraan ng paggawa ang sinunod, habang pinananatili ang isahang pandiwa ng salaysay.
- source_word: לִשְׁנֵיהֶם
  choice: sa dalawang iyon
  rationale: Pinananatili ang tahasang pagtukoy sa kapuwa dalawang bahaging tinatalakay.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: para sa dalawang sulok
  rationale: Malapit ito sa literal na anyo at iniiwasang ipalagay sa pangunahing teksto na tahasang nangangahulugan ang salita ng mga tabla o balangkas sa sulok.
