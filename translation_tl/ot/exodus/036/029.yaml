translation_notes:
  register: Makabago ngunit marangal na Filipino; pinanatili ang teknikal na paglalarawan nang hindi ginagawang labis na espesipiko ang mga bahaging hindi tahasang pinangalanan sa Hebreo. Ginamit ang em dash upang linawin na ang iisang singsing ay kaugnay ng tuktok, habang pinananatili ang bahagyang sintaktikong hirap ng orihinal.
