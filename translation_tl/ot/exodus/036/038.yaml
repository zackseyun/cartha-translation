  footnotes:
  - marker: a
    text: O “mga panali” o “mga pang-ugnay.” Hindi tiyak ang eksaktong anyo ng mga bahaging ito ng mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: limang haligi nito
  rationale: Ang עַמּוּד ay patayong haligi o tukod; ang “haligi” ay natural at angkop sa paglalarawan ng tabernakulo. Ang hulaping isahan ay tumutukoy sa naunang tabing/pasukan.
- source_word: וָוֵיהֶם
  choice: mga kawit ng mga iyon
  rationale: Sa konteksto ng tabernakulo, ang וָו ay mga kawit na nakakabit sa mga haligi upang pagsabitan ng tela.
- source_word: וְצִפָּה
  choice: Binalutan niya
  rationale: Ang צפה ay tumutukoy sa paglalapat ng balot na metal; malinaw sa Filipino ang “binalutan ... ng ginto” at pinananatili nito ang diwa ng gawaing-kamay.
- source_word: רָאשֵׁיהֶם
  choice: mga tuktok ng mga iyon
  rationale: Literal itong “mga ulo,” ngunit sa mga haligi ay tumutukoy sa pinakamataas na bahagi. Hindi nito ipinapalagay ang mas tiyak na arkitektural na anyong “capital.”
- source_word: חֲשֻׁקֵיהֶם
  choice: mga bigkis ng mga iyon
  rationale: Hindi ganap na tiyak ang eksaktong anyo ng mga bahaging ito; ang “bigkis” ay maaaring tumukoy sa mga elementong pumapalibot o nag-uugnay sa mga haligi nang hindi labis na tinutukoy ang hugis.
- source_word: זָהָב
  choice: ng ginto
  rationale: Ito ang materyal na ipinambalot sa mga tuktok at bigkis.
- source_word: אַדְנֵיהֶם
  choice: limang patungan ng mga iyon
  rationale: Ang אֶדֶן ay base o socket na kinatatayuan ng haligi. Mas madaling maunawaan sa karaniwang Filipino ang “patungan” kaysa “saksakan.”
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay karaniwang tawag sa tansong metal sa sinaunang konteksto at maaaring tumukoy sa copper o bronze; ang “tanso” ay natural na salitang Filipino at hindi labis na nagtatakda ng eksaktong haluang metal.
