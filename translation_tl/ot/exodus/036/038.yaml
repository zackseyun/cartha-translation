translation:
  language: tl
  text: at ang limang haligi nito, kasama ang mga kawit ng mga haligi. Binalutan niya ng ginto ang mga tuktok at mga bigkis[a] ng mga haligi, at ang limang patungan ng mga ito ay tanso.
