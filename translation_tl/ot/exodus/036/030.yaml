base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/030.yaml
  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: tl
  text: May walong balangkas[a], at labing-anim ang kanilang mga patungang pilak[b]—dalawang patungan sa ilalim ng bawat balangkas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabla”; ang salitang Hebreo ay tumutukoy sa mga nakatayong bahaging estruktural ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: O “saksakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: May
  rationale: Likas na paraang Tagalog upang ipakilala ang bilang sa isang talaan; hindi kailangang hiwalay na isalin ang pang-ugnay.
- source_word: קְרָשִׁים
  choice: mga balangkas
  rationale: Tumutukoy sa mga nakatayong bahaging estruktural ng tabernakulo; ipinahihiwatig ng “balangkas” ang gamit ng mga ito nang hindi nililimitahan sa karaniwang tabla.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: mga patungan
  rationale: Malinaw na tumutukoy sa mga suportang metal sa ilalim ng bawat balangkas; pinananatili sa talababa ang posibleng mas teknikal na “saksakan.”
- source_word: כֶּסֶף
  choice: pilak
  rationale: Tuwirang pagtukoy sa materyales ng mga patungan.
- source_word: שִׁשָּׁה עָשָׂר
  choice: labing-anim
  rationale: Karaniwang salin ng bilang.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: dalawang patungan sa ilalim ng bawat balangkas
  rationale: 'Ang inuulit na “dalawang patungan” at ang isahang “isang balangkas” ay distributibo sa konteksto: bawat isa sa walong balangkas ay may dalawang patungan. Iniiwasan ng natural na Tagalog ang nakalilitong literal na pag-uulit habang pinananatili ang diwa.'
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Karaniwang panandang panlunan sa konteksto ng pagtatayo.
