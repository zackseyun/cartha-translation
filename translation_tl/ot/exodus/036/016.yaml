translation:
  language: tl
  text: Pinagdugtong niya ang limang tabing sa isang pangkat, at ang anim na tabing sa isa pang pangkat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: pinagdugtong
  rationale: Ang חָבַר ay nangangahulugang pagdugtungin o pag-ugnayin. Ang “pinagdugtong” ay natural sa konteksto ng pagbubuo ng tabernakulo nang hindi tinutukoy ang eksaktong paraan ng pagkakabit.
- source_word: הַיְרִיעֹת
  choice: ang mga tabing
  rationale: Sa konteksto ng tabernakulo, ang יְרִיעָה ay malalaking piraso ng telang bumubuo sa tolda. Ang “tabing” ay malinaw, dignificado, at nakaugaliang salin.
- source_word: לְבָד
  choice: nang bukod
  rationale: Ipinahihiwatig ng לְבָד na ang limang tabing at ang anim na tabing ay pinagdugtong bilang dalawang magkahiwalay na hanay. Pinananatili ng “nang bukod” ang maikling pahayag at ang saklaw ng orihinal.
- source_word: חֲמֵשׁ
  choice: lima
  rationale: Tuwirang salin ng bilang.
- source_word: שֵׁשׁ
  choice: anim
  rationale: Tuwirang salin ng bilang.
- source_word: אֶת ... וְאֶת
  choice: ang ... at ... ang
  rationale: Hindi isinasalin nang hiwalay ang mga pananda ng tuwirang layon; ipinakikita sa ayos ng pangungusap ang dalawang magkatambal na pangkat.
