  source_fidelity: Tumpak ang pagtukoy sa dalawang magkahiwalay na pangkat ng mga telang tabing. Gayunman, ang “nang bukod” ay hindi natural na pang-abay sa modernong Filipino at maaaring magpahiwatig na ang bawat tabing ay pinagdugtong nang magkahiwalay, sa halip na ang lima ay isang pangkat at ang anim ay isa pang pangkat.
