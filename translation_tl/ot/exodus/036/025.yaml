  yaml_path: translation/ot/exodus/036/025.yaml
  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: tl
  text: Para sa ikalawang panig ng tabernakulo, sa gawing hilaga, gumawa siya ng dalawampung tabla.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “dalawampung balangkas.” Ang salitang Hebreo ay maaaring tumukoy sa mga tabla o balangkas na bahagi ng estruktura, at pinagtatalunan ang eksaktong anyo ng mga bahaging ito ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Para sa ... panig
  rationale: Sa paglalarawan ng pagtatayo ng tabernakulo, ang צֶלַע ay tumutukoy sa isang panig ng gusali, hindi sa literal na tadyang. Likas sa Tagalog ang “Para sa ... panig” para sa pinagsamang pangatnig at pang-ukol.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakagawiang katawagan sa Tagalog para sa santuwaryo ng Israel sa ilang; pinananatili rin nito ang tiyak na kahulugang pangkulto ng מִשְׁכָּן sa kontekstong ito.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Tahasang tinutukoy ng pang-uri ang pangalawang panig sa pagkakasunod-sunod; mas eksakto ito kaysa “kabila.”
- source_word: לִפְאַת צָפוֹן
  choice: sa gawing hilaga
  rationale: Ipinapahayag nito nang natural sa Tagalog ang puwesto o oryentasyon patungo sa hilagang panig.
- source_word: עָשָׂה
  choice: gumawa siya
  rationale: Ang karaniwang kahulugan ng עשה ay “gumawa,” at angkop ito sa ulat tungkol sa pagtatayo.
- source_word: עֶשְׂרִים
  choice: dalawampu
  rationale: Tuwirang salin ng bilang na dalawampu.
- source_word: קְרָשִׁים
  choice: mga tabla
  rationale: Tumutukoy ito sa mga bahaging kahoy na bumubuo sa estruktura. Ang “mga tabla” ay malinaw at nakagawiang salin, habang pinananatili sa talababa ang posibleng “mga balangkas.”
