base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/017.yaml
  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: tl
  text: Gumawa siya ng limampung silo sa gilid ng pinakadulong tabing sa unang pangkat[a], at gumawa siya ng limampung silo sa gilid ng tabing sa ikalawang pangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinagdugtong na seksiyon” o “sa pagkakadugtong”; ang salitang Hebreo ay tumutukoy sa pinagdugtong na pangkat o pagkakadugtong ng mga tabing.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: mga silo
  rationale: Tumutukoy ito sa mga loop na yari sa tela at ginagamit upang pagdugtungin ang mga tabing. Ang “mga silo” ay payak at hindi nagdaragdag ng kulay o materyal na wala sa talata.
- source_word: שְׂפַת
  choice: gilid
  rationale: Bagaman literal na maaaring mangahulugang “labi,” ang salita rito ay tumutukoy sa gilid ng isang piraso ng tela.
- source_word: יְרִיעָה
  choice: tabing
  rationale: Sa paglalarawan ng tabernakulo, tumutukoy ito sa malalaking piraso ng telang nagsisilbing mga tabing.
- source_word: הַקִּיצֹנָה
  choice: pinakadulo
  rationale: Ipinahihiwatig ng salita ang tabing na nasa dulong posisyon ng pangkat; mas tiyak dito ang “pinakadulo” kaysa “panlabas.”
- source_word: בַּמַּחְבָּרֶת
  choice: sa unang pangkat
  rationale: Ang מַחְבָּרֶת ay isang pinagdugtong na pangkat o seksiyon ng mga tabing. Ang “unang” ay ipinahihiwatig ng paghahambing sa “ikalawang” pangkat sa kasunod na sugnay, ngunit minarkahan sa talababa ang saklaw ng salitang Hebreo.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: sa ikalawang pangkat
  rationale: Sa konteksto, inilalarawan nito ang katapat na tabing sa ikalawang pinagdugtong na pangkat. Pinananatili ng salin ang pagkakaiba ng dalawang pangkat nang hindi ipinapalagay ang isang paraan ng pagkakadugtong na hindi tahasang sinabi.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Gumawa siya ... gumawa siya
  rationale: Pinananatili ang pag-uulit ng pandiwang Hebreo sa dalawang sugnay.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “silo” para sa loop ng tela, “tabing” para sa malaking kurtinang bahagi ng tabernakulo, at “pinakadulo” upang maipakita ang posisyon ng tabing. Iniwasang idagdag ang kulay ng mga silo, sapagkat wala iyon sa mismong talata.
