  source_fidelity: Ang “nag-utos,” ang pagpapalaganap ng pahayag sa kampo, ang tahasang pagsama sa lalaki at babae, at ang pasibong pagpigil sa mga tao ay tumutugma sa Hebreo. Gayunman, ang “Wala nang sinumang lalaki o babae na gagawa pa ng anuman” ay hindi tuwirang anyong pagbabawal at ang “anuman” ay mas malawak kaysa מְלָאכָה (“gawain”).
  naturalness: Nauunawaan ang draft, ngunit mas natural at malinaw sa modernong Filipino ang tuwirang “Huwag nang gumawa ang sinumang lalaki o babae ng anumang gawain.” Mas idiomatiko rin ang “na magdala pa” kaysa “sa pagdadala pa.”
  terminology: Ang “handog ukol sa santuwaryo” ay katanggap-tanggap na kontekstuwal na salin ng לִתְרוּמַת הַקֹּדֶשׁ at pinananatili ng talababa ang mga lehitimong alternatibo. Ang “santuwaryo” ay angkop na rehistro sa kontekstong ito.
