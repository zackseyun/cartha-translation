- from: 'Kaya nag-utos si Moises, at ipinaikot nila sa buong kampo ang pahayag[a]: “Wala nang sinumang lalaki o babae na gagawa pa ng anuman para sa handog ukol sa santuwaryo.”[b] Kaya pinigil na ang mga tao sa pagdadala pa.'
  to: 'Kaya nag-utos si Moises, at nagpalaganap sila ng pahayag sa buong kampo[a], na nagsasabi: “Huwag nang gumawa ang sinumang lalaki o babae ng anumang gawain para sa handog ukol sa santuwaryo.”[b] Kaya napigil ang mga tao na magdala pa.'
