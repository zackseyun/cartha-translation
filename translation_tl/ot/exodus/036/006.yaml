base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: tl
  text: 'Kaya nag-utos si Moises, at nagpalaganap sila ng pahayag sa buong kampo[a], na nagsasabi: “Huwag nang gumawa ang sinumang lalaki o babae ng anumang gawain para sa handog ukol sa santuwaryo.”[b] Kaya napigil ang mga tao na magdala pa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ipinadaan nila ang isang tinig sa kampo”; idyomang Hebreo ito para sa pagpapalaganap ng isang pampublikong pahayag.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog ukol sa santuwaryo” ay maaari ring isaling “banal na handog” o “ambag para sa santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: nag-utos
  rationale: Pinananatili nito ang awtoritatibong lakas ng utos ni Moises sa daloy ng salaysay.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: ipinaikot nila sa buong kampo ang pahayag
  rationale: Inilalarawan ng idyomang Hebreo ang pagpapalaganap ng isang pampublikong pahayag; pinananatili ng “ipinaikot” ang causative na diwa nito sa natural na Filipino.
- source_word: בַּמַּחֲנֶה
  choice: sa buong kampo
  rationale: Ipinahihiwatig sa konteksto na ipinalaganap ang pahayag sa saklaw ng kampo, bagaman ang pang-ukol ay literal na “sa kampo.”
- source_word: אִישׁ וְאִשָּׁה
  choice: sinumang lalaki o babae
  rationale: Malinaw nitong pinananatili ang tahasang pagsama sa kapwa lalaki at babae sa pagbabawal.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: Wala nang ... gagawa pa ng anuman
  rationale: Likas sa Filipino ang negatibong pahayag na ito at sinasaklaw nito ang karagdagang gawain o paggawa ng mga bagay para sa handog.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: para sa handog ukol sa santuwaryo
  rationale: Ang תְּרוּמָה ay handog o ambag na inilaan, at sa konteksto ang הַקֹּדֶשׁ ay tumutukoy sa santuwaryo; iniiwasan ng “ukol sa” ang malabong pag-aari.
- source_word: וַיִּכָּלֵא
  choice: pinigil na
  rationale: Pinananatili nito ang diwang passive na ang mga tao ay pinatigil o nahadlangan, nang hindi ipinahihiwatig na ayaw nilang sumunod.
- source_word: מֵהָבִיא
  choice: sa pagdadala pa
  rationale: Ipinahahayag ng pariralang ito ang pagpigil sa pagpapatuloy ng pagdadala ng karagdagang handog.
theological_decisions:
- issue: Kaugnayan ng “handog” at “santuwaryo” sa לִתְרוּמַת הַקֹּדֶשׁ
  choice: handog ukol sa santuwaryo
  alternative: banal na handog; ambag para sa santuwaryo
  rationale: Pinananatili ang kontekstuwal na kaugnayan sa pagtatayo ng santuwaryo nang hindi tiyakang nilulutas kung ang genitive ay naglalarawan ng kabanalan ng handog o ng layunin nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “santuwaryo” upang tukuyin ang banal na dako sa konteksto ng tabernakulo, at ang “ipinaikot ... ang pahayag” upang mapanatili ang larawan ng Hebreong causative idiom nang hindi nagiging salitang-salita.
