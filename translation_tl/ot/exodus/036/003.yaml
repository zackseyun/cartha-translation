language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: tl
  text: Kinuha nila mula sa harapan ni Moises[a] ang lahat ng handog na dinala ng mga Israelita[b] para sa gawain ng paglilingkod sa santuwaryo[c], upang maisagawa iyon. At patuloy pa rin silang nagdadala sa kanya ng mga kusang-loob na handog, umaga-umaga[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mula kay Moises” o “mula sa kinaroroonan ni Moises.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak na lalaki ng Israel”; isang nakaugaliang kolektibong tawag sa mga Israelita.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “banal na lugar.”
    reason: lexical_alternative
  - marker: d
    text: 'Literal na inuulit sa Hebreo ang “sa umaga”: “umaga sa umaga.”'
    reason: source_form
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha nila
  rationale: Pinananatili ang pangunahing diwa ng לקח na “kumuha.” Sa konteksto, kinuha ng mga manggagawa ang mga materyales na nasa pangangalaga ni Moises; ang “tinanggap nila” ay posible ngunit mas mapagpaliwanag.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: mula sa harapan ni Moises
  rationale: Inilalarawan nito ang pagkuha mula sa kinaroroonan o agarang pangangalaga ni Moises, habang pinananatili ang larawang nasa Hebreo.
- source_word: הַתְּרוּמָה
  choice: ang lahat ng handog
  rationale: Ang תְּרוּמָה ay handog o ambag na ibinukod para sa banal na layunin. Natural sa Tagalog ang kolektibong “lahat ng handog” sa konteksto ng mga materyales para sa tabernakulo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at inklusibong modernong Tagalog para sa nakaugaliang kolektibong katawagang literal na “mga anak na lalaki ng Israel.”
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: para sa gawain ng paglilingkod sa santuwaryo
  rationale: Pinananatili ang magkaugnay ngunit magkaibang ideya ng “gawain” at “paglilingkod.” Sa kontekstong ito, ang הַקֹּדֶשׁ ay tumutukoy sa banal na lugar o santuwaryo.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: upang maisagawa iyon
  rationale: 'Malawak ang עשה: “gawin” o “isagawa.” Ang panghalip ay malamang na tumutukoy sa gawaing nabanggit, at ang “maisagawa iyon” ay natural nang hindi labis na nililinaw ang reperente.'
- source_word: וְהֵם הֵבִיאוּ
  choice: At patuloy pa rin silang nagdadala
  rationale: Pinananatili ng “At” ang payak na pang-ugnay, samantalang ang “patuloy pa rin” ay nagpapahayag ng nagpapatuloy at binibigyang-diin na pagkilos na ipinahihiwatig ng hiwalay na panghalip at ng daloy ng salaysay.
- source_word: נְדָבָה
  choice: mga kusang-loob na handog
  rationale: Ipinahahayag ng נְדָבָה na ang mga handog ay boluntaryo. Ginawang maramihan sa Tagalog dahil paulit-ulit ang pagdadala ng mga handog.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: umaga-umaga
  rationale: Natural na idyomang Tagalog ito para sa inuulit na pariralang Hebreo at malinaw na nagsasaad ng regular na pag-uulit.
theological_decisions:
- issue: Ang lakas ng ugnayan sa וְהֵם הֵבִיאוּ
  choice: At patuloy pa rin silang nagdadala
  alternative: Ngunit patuloy pa rin silang nagdadala
  rationale: Hindi ginawang tahasang pasalungat ang payak na וְ. Gayunman, pinanatili ang diwa ng pagpapatuloy at bahagyang paghahambing sa “patuloy pa rin,” nang hindi nagdaragdag ng mas matinding teolohikal o retorikal na kontras kaysa sa malinaw sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “santuwaryo” bilang pamilyar na terminong panrelihiyon, ngunit nilagyan ng talababa ang mas literal na “banal na lugar.” Iniwasan ang sobrang literal at alanganing “upang gawin iyon” pabor sa natural na “upang maisagawa iyon,” habang pinananatili ang reperente ng panghalip.
