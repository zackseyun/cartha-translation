  terminology: Ang “tabla” ay angkop para sa קְרָשִׁים, at ang “tabernakulo” ay isang matatag at madaling makilalang terminong biblikal sa modernong Filipino Tagalog. Maingat na pinananatili ng “mga sulok” at ng talababa ang arkitektural na kalabuan ng לִמְקֻצְעֹת.
