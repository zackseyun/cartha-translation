  text: And he made two boards for the corners of the tabernacle at the rear[a].
translation:
  language: tl
  text: At gumawa siya ng dalawang tabla para sa mga sulok ng tabernakulo sa likuran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa mga bahaging panulok ng tabernakulo, sa dalawang panig sa likuran.” Inilalarawan ng mga salitang Hebreo ang dalawang dulong bahagi o sulok sa likod ng istruktura at maaaring idiin ang kinaroroonan ng mga sulok o ang mga tablang pantanging pinagdugtong doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: At ... dalawang
  rationale: Pinananatili ng “At” ang pagkakaugnay sa naunang tala ng paggawa, at tahasang isinasalin ang bilang na dalawa.
- source_word: קְרָשִׁים
  choice: mga tabla
  rationale: Sa konteksto ng pagtatayo ng tabernakulo, tumutukoy ito sa malalaking bahaging kahoy na bumubuo sa balangkas; natural at malinaw sa Filipino ang “mga tabla.”
- source_word: עָשָׂה
  choice: gumawa siya
  rationale: Payak at tuwirang katumbas ito ng karaniwang pandiwang Hebreo na nangangahulugang gumawa.
- source_word: לִ/מְקֻצְעֹת
  choice: para sa mga sulok
  rationale: Maaaring tumukoy ang salita sa mga sulok mismo o sa mga bahaging tablang inilaan at pinagdugtong doon; pinananatili ng salin ang pangunahing lokasyonal na diwa.
- source_word: הַ/מִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakaugaliang katawagan sa Filipino para sa santuwaryong tirahan sa salaysay ng Exodo at malinaw na tumutukoy sa istrukturang tinatalakay.
- source_word: בַּ/יַּרְכָתָיִם
  choice: sa likuran
  rationale: Ipinahihiwatig ng anyong dual ang dalawang dulong bahagi sa likod. Ang “sa likuran” ay natural at umiiwas sa paulit-ulit na “mga sulok,” habang nililinaw ng talababa ang posibleng mas tiyak na arkitektural na diwa.
