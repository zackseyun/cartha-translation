translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “biga” para sa estruktural na bar at “bumagtas” upang mapanatili ang diwa ng pagdaan o pag-abot nito sa buong hanay nang hindi nagmumungkahi ng aktuwal na paggalaw.
