  text: Ginawa niya ang gitnang biga na dumaraan sa gitna ng mga tabla, mula sa isang dulo hanggang sa kabilang dulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ginawa niya ang gitnang biga upang dumaan sa loob ng mga tabla, mula sa isang dulo hanggang sa kabilang dulo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay karaniwang nagsasaad ng sunod-sunod na kilos sa salaysay. Likas sa modernong Tagalog ang payak na “Ginawa niya,” kahit hindi tahasang isalin ang pang-ugnay.
- source_word: הַבְּרִיחַ
  choice: ang biga
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang בְּרִיחַ sa mahabang pahalang na piyesang nag-uugnay at nagpapatibay sa mga tabla. Mas malinaw dito ang “biga” kaysa “baras” o “halang.”
- source_word: הַתִּיכֹן
  choice: gitnang
  rationale: Ang pang-uri ay tumutukoy sa nasa gitna o sentro. Ang “gitnang” ay natural at tumpak sa paglalarawan ng pagkakagawa.
- source_word: לִבְרֹחַ
  choice: upang bumagtas
  rationale: Sa kontekstong pang-arkitektura, inilalarawan ng pawatas ang pagdaan o pag-abot ng biga sa kabuuan ng estruktura. Hindi ipinahihiwatig ng “bumagtas” na kumikilos ito sa sandaling iyon.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Maaaring mangahulugan ang בְּתוֹךְ ng nasa loob, sa gitna, o dumaraan sa loob. Kasama ng “bumagtas,” malinaw na ipinakikita ng parirala ang landas ng biga sa mga tabla.
- source_word: הַקְּרָשִׁים
  choice: mga tabla
  rationale: Ang קֶרֶשׁ ay mga estruktural na tabla o balangkas sa tabernakulo. Ang “mga tabla” ay karaniwan, malinaw, at angkop sa ordinaryong mambabasa.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: mula sa isang dulo hanggang sa kabila
  rationale: Ipinahihiwatig ng idyoma ang buong haba mula sa isang dulo hanggang sa isa pa. Likas at malinaw ang napiling anyo sa Tagalog.
