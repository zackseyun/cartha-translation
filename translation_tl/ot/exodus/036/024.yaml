  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: tl
  text: 'At gumawa siya ng apatnapung patungang yari sa pilak sa ilalim ng dalawampung balangkas: dalawang patungan sa ilalim ng isang balangkas para sa dalawang usli nito, at dalawang patungan sa ilalim ng isang balangkas para sa dalawang usli nito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי / אֲדָנִים
  choice: patungan / mga patungan
  rationale: Tumutukoy sa mga baseng pilak na kinalalagyan ng mga usli ng balangkas; malinaw at likas ang “patungan” sa modernong Filipino.
- source_word: הַקְּרָשִׁים / הַקֶּרֶשׁ
  choice: mga balangkas / balangkas
  rationale: Sa konteksto ng tabernakulo, ang qeresh ay isang nakatayong bahagi ng estruktura. Pinananatili ng “balangkas” ang gamit nito bilang structural frame nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: יְדֹתָיו
  choice: mga usli nito
  rationale: Literal na “mga kamay,” ngunit dito ay teknikal na tawag sa dalawang nakausling bahagi na ipinapasok sa mga patungan. Ang “usli” ay madaling maunawaan at hindi nagdaragdag ng di-tiyak na detalye.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: isang ... kasunod na
  rationale: 'Ang inulit na Hebrew na “the one” ay distributibo: bawat balangkas ay may dalawang patungan. Ang “kasunod na” ay natural sa Filipino at iniiwasang magmukhang iisang balangkas lamang ang dalawang ulit na tinutukoy.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, dignified, at angkop sa paglalarawan ng konstruksiyon. Gumamit ng isahan at maramihang anyo nang natural, at pinanatili ang eksaktong bilang at ugnayan ng mga bahagi.
