base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: tl
  text: Binalutan niya ng ginto ang mga balangkas[a], at gumawa siya ng mga gintong singsing para sa mga iyon bilang mga lagayan ng mga pahalang na baras[b]. Binalutan din niya ng ginto ang mga pahalang na baras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla.” Ang salitang Hebreo ay tumutukoy sa mga kahoy na sangkap ng estruktura ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga bahay para sa mga pahalang na baras,” isang idyoma para sa mga lagayan o puwestong pinagsusuutan ng mga baras.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: mga balangkas
  rationale: Tumutukoy ang salita sa mga patayong sangkap na kahoy na bumubuo sa estruktura ng tabernakulo. Ipinahahayag ng “mga balangkas” ang gamit ng mga ito nang mas malinaw kaysa sa payak na “mga tabla,” habang pinananatili ang kongkretong larawang arkitektural.
- source_word: צִפָּה / וַיְצַף
  choice: binalutan
  rationale: Sa konstruksiyong ito, nangangahulugan ang pandiwa ng paglalagay ng isang suson ng materyal sa ibabaw ng isang bagay. Natural at malinaw sa modernong Tagalog ang “binalutan ng ginto” para sa dalawang paglitaw nito.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal. Pinanatili ito sa lahat ng tatlong paglitaw upang maingatan ang pag-uulit at diin ng Hebreo.
- source_word: טַבְּעֹתָם
  choice: mga singsing ng mga iyon
  rationale: Karaniwang nangangahulugang “singsing” ang טַבַּעַת; ang hulaping panghalip ay tumutukoy sa mga balangkas. Iniiwasan ng pariralang ito ang posibleng kalituhan sa gamit ng “kanilang” para sa mga bagay.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Payak at natural na katumbas ng karaniwang pandiwang Hebreo na nangangahulugang gumawa.
- source_word: בָּתִּים
  choice: mga lalagyan
  rationale: Literal itong “mga bahay,” ngunit dito ay tumutukoy sa mga puwesto o sisidlang tumatanggap at humahawak sa mga baras. Malinaw na naihahatid ng “mga lalagyan” ang gamit nito nang hindi ipinapalagay ang mas tiyak na anyong hindi tahasang sinasabi ng teksto.
- source_word: לַבְּרִיחִם
  choice: para sa mga pahalang na baras
  rationale: Ang בְּרִיחִים ay mga crossbar na nagdurugtong at nagpapatatag sa mga balangkas. Idinagdag ang “pahalang” upang malinaw itong maiba sa mga patayong sangkap.
