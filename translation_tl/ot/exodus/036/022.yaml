  text: Dalawang nakausling dugtungan sa bawat tabla[a], na magkakabit sa isa’t isa[b]; gayon ang ginawa niya sa lahat ng tabla ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga kamay”; ginamit sa Hebreo ang karaniwang salita para sa kamay bilang larawan ng mga nakausling dugtungan ng bawat tabla.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “magkatapat ang isa sa isa,” na nagbibigay-diin sa magkatugmang pagkakaayos ng dalawang dugtungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי
  choice: dalawang
  rationale: Tuwirang ipinahahayag ang bilang ng mga nakausling bahagi ng bawat tabla.
- source_word: יָדֹת
  choice: nakausling dugtungan
  rationale: Ang literal na kahulugan ay “mga kamay,” ngunit sa konteksto ng paggawa ng tabernakulo, tumutukoy ito sa mga nakausling bahaging ginagamit sa pagdurugtong. Mas madaling maunawaan ng karaniwang mambabasa ang “nakausling dugtungan” kaysa sa teknikal na terminong pangkarpintero.
- source_word: קֶּרֶשׁ
  choice: tabla
  rationale: Tumutukoy sa bawat yunit na kahoy na bumubuo sa balangkas ng tabernakulo; natural at malinaw sa modernong Filipino ang “tabla.”
- source_word: מְשֻׁלָּבֹת
  choice: magkatugma
  rationale: Inilalarawan ang magkaugnay at nagtutugmang pagkakaayos ng dalawang dugtungan nang hindi labis na tinutukoy ang eksaktong hugis o mekanismo.
- source_word: אַחַת אֶל אֶחָת
  choice: ang isa sa isa
  rationale: Pinananatili ang katumbasang ugnayan ng dalawang dugtungan at ang bahagyang kalabuan kung ang diin ay pagkakaugnay o pagkakaharap.
- source_word: כֵּן עָשָׂה
  choice: gayon ang ginawa niya
  rationale: Tuwirang isinasalin ang pahayag tungkol sa paraang ginamit niya sa lahat ng tabla.
- source_word: מִּשְׁכָּן
  choice: tabernakulo
  rationale: Karaniwang katawagang biblikal sa Filipino para sa naililipat na santuwaryong inilalarawan sa Exodo, at hindi nagdaragdag ng paliwanag na wala sa talata.
