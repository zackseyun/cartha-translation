base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: tl
  text: Ginawa niya ang tabing[a] mula sa asul, purpura, at iskarlatang sinulid, at pinong linong pinilipit. Ginawa niya itong may mga kerubin, bilang gawa ng isang bihasang tagapagdisenyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina.”
    reason: lexical_alternative
  - marker: c
    text: O “gawa ng isang bihasang manggagawa” o “gawang may burda.” Tumutukoy ang Hebreo sa masining at may-padron na pagkakayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: ang tabing
  rationale: Tumutukoy ito sa panloob na tabing na naghahati sa santuwaryo. Ang “tabing” ay natural sa makabagong Filipino at hindi labis na eklesyastiko; pinananatili sa talababa ang “kurtina” bilang alternatibo.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Tumutukoy ang salita sa materyal na tinina ng asul na ginagamit sa mga tela ng tabernakulo. Nilinaw ang materyal na diwa sa pamamagitan ng “sinulid.”
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Karaniwang salin para sa mamahaling materyal o kulay na purpura; ang salitang “sinulid” sa simula ng hanay ay nauunawaan ding saklaw ito.
- source_word: תוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Ang parirala ay tumutukoy sa materyal o sinulid na tinina ng scarlet. Ang “matingkad na pula” ay malinaw at likas sa Filipino, habang itinatala sa talababa ang posibleng “krimson.”
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili nito kapwa ang pinong uri ng lino at ang katangiang pinilipit o iniikid.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: gawa ng isang bihasang tagapagdisenyo
  rationale: Ipinahihiwatig ng Hebreo ang masining at may-padron na pagkakayari. Ang saling ito ay nauunawaan sa kasalukuyang Filipino nang hindi nililimitahan ang parirala sa pagbuburda lamang.
- source_word: כְּרֻבִים
  choice: mga kerubin
  rationale: Ito ang nakaugaliang katawagang biblikal sa Filipino para sa mga makalangit na nilalang na inilalarawan sa tabing.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: Nilagyan niya ito ng mga kerubin
  rationale: Ipinakikita ng sintaks na isinama ang mga kerubin sa disenyo ng tabing; likas at malinaw itong pagpapahayag sa Filipino.
