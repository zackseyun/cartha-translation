translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tabernakulo” bilang pamilyar na katawagang biblikal, at pinanatili sa natural na anyo ang pag-uulit ng direksiyong timog sa Hebreo.
