  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: tl
  text: 'Ginawa niya ang mga balangkas para sa tabernakulo: dalawampung balangkas para sa panig na timog[a], sa dakong timog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawampung tabla para sa panig na timog.” Dalawang magkaugnay na salitang tumutukoy sa timog ang ginamit sa Hebreo (“timog, sa dakong timog”) bilang pagdidiin o higit na pagtutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay nagsasalaysay ng natapos na kilos; natural sa modernong Tagalog ang payak na pangnagdaan, at nananatiling isahan ang paksa ayon sa konteksto.
- source_word: הַקְּרָשִׁים
  choice: ang mga balangkas
  rationale: Sa pagtatayo ng tabernakulo, ang קֶרֶשׁ ay tumutukoy sa mga patayong sangkap ng estruktura. Mas naipahahayag ng “mga balangkas” ang gamit ng mga ito kaysa sa “mga tabla,” bagaman posible rin ang huli.
- source_word: לַמִּשְׁכָּן
  choice: para sa tabernakulo
  rationale: Ang מִשְׁכָּן ang karaniwang katawagan sa santuwaryong estruktura sa Exodo; ang “tabernakulo” ay kinikilalang terminong biblikal sa Tagalog.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: dalawampung balangkas
  rationale: Tuwirang isinalin ang bilang at inulit ang pangngalan upang mapanatili ang estilong talaan ng Hebreo.
- source_word: לִפְאַת
  choice: para sa bahaging
  rationale: Ang פֵּאָה rito ay tumutukoy sa panig o bahagi ng estruktura; natural sa pariralang Filipino ang “bahaging timog.”
- source_word: נֶגֶב
  choice: timog
  rationale: Direksiyon ang gamit ng נֶגֶב rito, hindi ang pangalang pantangi na Negeb.
- source_word: תֵּימָנָה
  choice: sa gawing timog
  rationale: Pinananatili nito sa natural na Tagalog ang ikalawang pagtukoy sa timog, na nagbibigay ng pagdidiin o higit na pagtutukoy sa Hebreo.
