  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: tl
  text: Gumawa siya ng limampung pangkabit na bronse upang pagdugtungin ang tolda[a], upang ang tolda ay maging iisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabernakulo,” dahil ang “tolda” rito ay tumutukoy sa estruktura ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang wayyiqtol ng עשה ay nagsusulong ng salaysay bilang payak na nagdaang kilos; natural sa Tagalog ang “Gumawa siya.”
- source_word: קַרְסֵי
  choice: mga pang-ipit
  rationale: Tumutukoy ito sa mga piyesang pangkabit na nagdurugtong sa mga bahagi ng tolda. Malinaw at pangkasalukuyan ang “pang-ipit,” nang hindi gumagamit ng makaluma o labis na pangkalahatang salita.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa konteksto ng mga materyales ng tabernakulo, karaniwang tumutukoy ang נְחֹשֶׁת sa bronse, ang malamang na metal na ginamit dito.
- source_word: חֲמִשִּׁים
  choice: limampu
  rationale: Tuwirang salin ng bilang na naglalarawan sa dami ng mga pang-ipit.
- source_word: לְחַבֵּר
  choice: upang pagdugtungin
  rationale: Ipinahahayag ng pawatas ang layunin ng paggawa sa mga pang-ipit. Ang “pagdugtungin” ay natural at angkop sa pagsasama ng mga bahagi ng estruktura.
- source_word: אֶת הָאֹהֶל
  choice: ang tolda
  rationale: Literal na “tolda” ang אֹהֶל. Bagaman ang tabernakulo ang tinutukoy sa konteksto, pinananatili ng pangunahing teksto ang mismong leksikal na larawan ng Hebreo.
- source_word: לִהְיוֹת אֶחָד
  choice: at maging isang buo ito
  rationale: Ipinahahayag ng parirala ang layunin o bunga na ang pinagdikit na estruktura ay maging iisang kabuuan. Mas natural sa Tagalog ang “isang buo” kaysa sa literal ngunit malabong “isa.”
