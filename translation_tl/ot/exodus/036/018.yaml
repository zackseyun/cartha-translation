  - severity: low
    issue: Hindi ganap na malinaw ang tinutukoy ng “ito” sa hulihan.
    rationale: Ang Hebreo ay tumutukoy sa toldang pinagdugtong upang maging isang yunit. Ang pag-uulit ng “tolda” ay nagbibigay ng mas malinaw na ugnayan at pinananatili ang saklaw ng pahayag.
