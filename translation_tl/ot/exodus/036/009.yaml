base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: tl
  text: Ang haba ng bawat tabing ay dalawampu't walong siko[a], at ang lapad ng bawat tabing ay apat na siko; iisa ang sukat ng lahat ng tabing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang siko ay humigit-kumulang 45 sentimetro.
    reason: measurement_clarification
lexical_decisions:
- source_word: אֹרֶךְ
  choice: haba
  rationale: Karaniwang salitang Filipino para sa pisikal na dimensiyong pahaba.
- source_word: יְרִיעָה
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa isang telang pantakip o panel; natural at dignified ang “tabing” sa Filipino.
- source_word: הָאַחַת / הָאֶחָת
  choice: bawat
  rationale: 'Bagaman literal na “ang isa,” distributibo ang gamit dito: ang sukat ay ukol sa bawat indibiduwal na tabing.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: dalawampu't walo
  rationale: Likas na makabagong Filipino para sa bilang na 28.
- source_word: אַמָּה
  choice: siko
  rationale: Tradisyonal at malinaw na katawagang Filipino sa sinaunang yunit na cubit; pinananatili ang yunit sa halip na tantiyahin sa modernong sukat.
- source_word: רֹחַב
  choice: lapad
  rationale: Karaniwang katapat ng “haba” sa paglalarawan ng dimensiyon.
- source_word: אַרְבַּע
  choice: apat
  rationale: Tuwirang salin ng bilang.
- source_word: מִדָּה אַחַת
  choice: iisa ang sukat
  rationale: Malapit sa literal na “isang sukat” at natural na ipinahahayag ang pagkakapare-pareho.
- source_word: לְכָל הַיְרִיעֹת
  choice: ng lahat ng tabing
  rationale: 'Ipinapakita ang saklaw ng iisang sukat: lahat ng mga tabing.'
