  source_fidelity: 'Tapat ang salin sa Hebreo: ginawa ang limampung gintong kawit/pangkabit, pinagdugtong ang mga tabing sa pamamagitan ng mga ito, at ang resulta ay isang nagkakaisang tabernakulo. Ang “kaya” ay maayos na naghahayag ng resultang ipinahihiwatig ng sunod na וַיְהִי, at ang “iisang kabuuan” ay angkop na paglilinaw sa kontekstong pangkayarian.'
