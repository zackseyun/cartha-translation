  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: tl
  text: Gumawa siya ng limampung kawit na ginto at pinagdugtong-dugtong ang mga tabing sa pamamagitan ng mga kawit, kaya ang tabernakulo ay naging iisang kabuuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at ang tabernakulo ay naging isa.”
    reason: Pinananatili ang mas pormal na posibilidad ng Hebreong וַיְהִי הַמִּשְׁכָּן אֶחָד, samantalang inililitaw ng pangunahing salin ang bunga ng pagdurugtong.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang עשה ay karaniwang pandiwang nangangahulugang “gumawa”; natural at tapat dito ang “Gumawa siya.”
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: limampung kawit na ginto
  rationale: Sa konteksto ng tabernakulo, ang קֶרֶס ay isang pangkabit na nagdurugtong sa mga tabing. Ang “kawit” ay malinaw at karaniwang katawagan sa Filipino nang hindi labis na tinutukoy ang eksaktong hugis.
- source_word: וַיְחַבֵּר
  choice: pinagdugtong-dugtong
  rationale: Ang חבר ay nangangahulugang pagdugtungin o pag-ugnayin. Ipinahihiwatig ng reduplikasyon ang pagdurugtong ng maraming tabing sa isa't isa.
- source_word: אֶת הַיְרִעֹת
  choice: ang mga tabing
  rationale: Ang יְרִיעוֹת ay mga telang panel o tabing na bumubuo sa pantakip ng tabernakulo. Ang “mga tabing” ay natural, maikli, at angkop sa konteksto.
- source_word: אַחַת אֶל אַחַת
  choice: pinagdugtong-dugtong ang mga tabing
  rationale: Ang literal na “isa sa isa” ay may diwang resiprokal. Sa Filipino, natural itong naipahahayag sa “pinagdugtong-dugtong,” na nagpapakitang ang mga tabing ay magkakaugnay.
- source_word: בַּקְּרָסִים
  choice: sa pamamagitan ng mga kawit
  rationale: 'Instrumental ang בְּ dito: ang mga kawit ang ginamit upang pagdugtungin ang mga tabing.'
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang “tabernakulo” ang nakaugaliang terminong Filipino para sa santuwaryong tolda sa Exodo at malinaw sa karaniwang mambabasa ng Bibliya.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: kaya ang tabernakulo ay naging iisang kabuuan
  rationale: Maaaring pormal na isaling “at ang tabernakulo ay naging isa.” Nililinaw ng “kaya” ang resultang ugnayan, at ng “iisang kabuuan” ang estruktural na pagkakaisa nang hindi nagbibigay ng teolohikal na pakahulugang wala sa konteksto.
