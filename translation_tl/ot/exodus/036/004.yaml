revisions:
- from: Kaya lumapit ang lahat ng bihasang gumagawa ng lahat ng gawain para sa santuwaryo, bawat isa mula sa gawaing ginagawa niya.
  to: Dumating ang lahat ng bihasang manggagawa na gumagawa ng lahat ng gawain ng santuwaryo, at ang bawat isa ay nagmula sa gawaing ginagawa niya.
  rationale: Pinalitan ang inferensiyal na “Kaya” ng payak na narratibong “Dumating,” ginawang “gawain ng santuwaryo” ang mas tuwirang katumbas ng pariralang Hebreo, at nilinaw ang distributibong אִישׁ אִישׁ sa pamamagitan ng “ang bawat isa.” Pinananatili ng isahang “niya” ang distributibong diwa kahit plural ang panghalip sa huling sugnay na Hebreo.
