translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “santuwaryo” bilang pamilyar at tiyak na katawagan sa banal na lugar/tabernakulo. Hindi kailangan ng talababa sapagkat natural na naihahatid ng “bawat isa ... ginagawa niya” ang distributibong konstruksyon ng Hebreo.
