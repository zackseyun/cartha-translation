translation:
  language: tl
  text: Dumating ang lahat ng bihasang manggagawa na gumagawa ng lahat ng gawain ng santuwaryo, at ang bawat isa ay nagmula sa gawaing ginagawa niya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kaya lumapit
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay; ang “lumapit” ay natural sa konteksto ng pag-alis nila sa kani-kanilang gawain upang magsadya kina Moises.
- source_word: כָּל הַחֲכָמִים
  choice: lahat ng bihasang gumagawa
  rationale: Sa kontekstong ito, ang חֲכָמִים ay tumutukoy sa mga taong may kasanayan sa paggawa, hindi lamang sa mga marunong o pantas. Ang parirala ay natural at hindi labis na nililimitahan sila sa isang uri ng manggagawa.
- source_word: הָעֹשִׂים אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: gumagawa ng lahat ng gawain para sa santuwaryo
  rationale: Pinananatili ng “gumagawa” ang nagpapatuloy na kilos ng participle, samantalang ang “para sa santuwaryo” ay nagpapahayag na ang gawaing banal ay ukol sa tabernakulo/santuwaryo.
- source_word: אִישׁ אִישׁ
  choice: bawat isa
  rationale: Ang pag-uulit ng אִישׁ ay distributibo; malinaw at natural itong naipapahayag sa Filipino bilang “bawat isa.”
- source_word: מִמְּלַאכְתּוֹ אֲשֶׁר הֵמָּה עֹשִׂים
  choice: mula sa gawaing ginagawa niya
  rationale: Pinananatili nito ang isahang panghalip ng מְלַאכְתּוֹ at ang distributibong diwa ng “bawat isa,” kahit maramihan ang הֵמָּה sa Hebreo.
