  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: tl
  text: At gumawa siya ng pantabing sa pasukan ng tolda[a], na yari sa sinulid na asul, purpura, at iskarlata, at pinong linong pinilipit—gawa ng isang tagapagburda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kurtina.” Ang salitang Hebreo ay tumutukoy sa nakasabit na pantakip sa isang pasukan, na naiiba sa panloob na “tabing” (פָּרֹכֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At gumawa siya
  rationale: Pinananatili ang pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive, sa natural na Tagalog.
- source_word: מָסָךְ
  choice: pantabing
  rationale: Tumutukoy ito sa nakasabit na pantakip sa isang pasukan at naiiba sa panloob na tabing na פָּרֹכֶת. Natural at malinaw ang “pantabing” sa modernong Tagalog.
- source_word: לְפֶתַח הָאֹהֶל
  choice: sa pasukan ng tolda
  rationale: Tuwirang isinasalin ang פֶּתַח bilang “pasukan” at ang karaniwang pangngalang אֹהֶל bilang “tolda,” nang hindi ito pinalalawak bilang “tabernakulo.”
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: sinulid na asul, purpura, at matingkad na pula
  rationale: Ipinahahayag ang mga kulay at ginagawang malinaw ang kontekstong pantela sa pamamagitan ng “sinulid.” Ang “matingkad na pula” ay natural na katumbas ng kulay na tinutukoy ng תוֹלַעַת שָׁנִי.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: pinong lino na pinilipit
  rationale: Pinananatili ang kalidad ng lino at ang paraan ng pagkakayari nito.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: gawa ng isang mahusay na tagapagburda
  rationale: Ipinakikita ang dalubhasang gawaing pagbuburda na tinutukoy ng parirala; ang “mahusay” ay likas na nagpapahayag ng kasanayang nakapaloob sa teknikal na katawagan.
