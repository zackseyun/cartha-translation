translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pantabing” upang mapanatili ang pagkakaiba nito sa panloob na tabing, at iniwasan ang sobrang teknikal o makalumang pananalita.
