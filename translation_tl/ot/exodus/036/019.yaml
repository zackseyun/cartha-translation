  text: וַ/יַּ֤עַשׂ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵלִ֖ים מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: tl
  text: Gumawa siya ng isang pantakip para sa tolda mula sa mga balat ng lalaking tupa na tinina ng pula, at ng isang pantakip na yari sa pinong katad[a] sa ibabaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na תְּחָשִׁים; maaaring tumukoy ito sa mga balat ng bakang-dagat, porpoise, dugong, o, ayon sa tradisyonal na salin, badger.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Isinasalaysay ng wayyiqtol ng עשה ang kasunod na kilos sa nakaraan. Likas sa modernong Tagalog ang “Gumawa siya” nang hindi kailangang isalin nang hiwalay ang pang-ugnay.
- source_word: מִכְסֶה לָאֹהֶל
  choice: isang pantakip para sa tolda
  rationale: Ang מִכְסֶה ay isang pantakip o panlabas na sapin, at ang אֹהֶל ay literal na “tolda.” Pinananatili ng salin ang payak na katawagan sa Hebreo sa halip na gawing “tabernakulo.”
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: mula sa mga balat ng lalaking tupa na tinina ng pula
  rationale: Ang parirala ay tumutukoy sa mga balat ng mga lalaking tupa na pinapula. Nililinaw ng “tinina ng pula” na ang kulay ay inilapat sa mga balat.
- source_word: וּמִכְסֵה
  choice: at ng isang pantakip
  rationale: Inuulit ng Hebreo ang “pantakip” para sa karagdagang sapin; hindi idinaragdag ang interpretatibong “ikalawang.”
- source_word: עֹרֹת תְּחָשִׁים
  choice: pinong katad[a]
  rationale: Hindi tiyak ang pagkakakilanlan ng תְּחָשִׁים. Ang “pinong katad” ay maingat na saling hindi pumipili ng isang haka-hakang uri ng hayop, habang inilalahad sa talababa ang leksikal na kalabuan.
- source_word: מִלְמָעְלָה
  choice: sa ibabaw
  rationale: Ipinahihiwatig ng parirala na ang saping ito ang nasa itaas. Natural at malapit sa Hebreo ang “sa ibabaw.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tolda” upang sundin ang literal na אֹהֶל, at “pantakip” para sa inuulit na מִכְסֶה. Inilagay ang panandang [a] kaagad pagkatapos ng “pinong katad,” ang mismong pariralang may leksikal na katiyakan.
