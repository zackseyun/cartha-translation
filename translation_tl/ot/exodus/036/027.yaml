  yaml_path: translation/ot/exodus/036/027.yaml
  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: tl
  text: At para sa likuran ng tabernakulo, sa gawing kanluran, gumawa siya ng anim na balangkas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla.” Ang salitang Hebreo ay maaaring tumukoy sa mga tabla o balangkas na bahagi ng estruktura; pinili rito ang “balangkas” dahil maaaring mas angkop ito sa pagkakagawa ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: At para sa likuran ng
  rationale: Ipinahihiwatig ng parirala ang dulong bahagi o likuran ng gusali. Natural sa modernong Tagalog ang “para sa likuran” at hindi nito ipinapalagay na maraming panig ang tinutukoy.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Tagalog para sa banal na tolda o santuwaryong inilalarawan sa Exodo, at mas tiyak dito kaysa sa pangkalahatang “tahanan.”
- source_word: יָמָּה
  choice: sa gawing kanluran
  rationale: Ang literal na diwang “patungo sa dagat” ay idyomatikong tumutukoy sa kanluran. Malinaw at natural sa Tagalog ang “sa gawing kanluran.”
- source_word: עָשָׂה
  choice: gumawa siya
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang Hebreo na nangangahulugang gumawa, at pinananatili ang payak na estilo ng salaysay ng pagtatayo.
- source_word: שִׁשָּׁה
  choice: anim
  rationale: Tuwirang salin ng bilang.
- source_word: קְרָשִׁים
  choice: balangkas
  rationale: Tumutukoy ang salita sa mga patayong sangkap ng estruktura. Ipinahihiwatig ng “balangkas” ang gamit na pang-istruktura, habang pinananatili sa talababa ang posibleng saling “tabla.”
