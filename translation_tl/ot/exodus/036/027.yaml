  source_fidelity: Tumpak na naipapahayag ng salin ang וּלְיַרְכְּתֵי bilang “At para sa likuran,” ang direksiyong יָמָּה bilang “sa gawing kanluran,” at ang bilang at kilos na “gumawa siya ng anim.” Ang “balangkas” ay isang katanggap-tanggap na salin para sa קְרָשִׁים sa kontekstong pangkonstruksiyon, at maayos na pinananatili ng talababa ang alternatibong “mga tabla.”
