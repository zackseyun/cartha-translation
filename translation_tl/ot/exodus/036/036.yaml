base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: tl
  text: Gumawa siya para rito[a] ng apat na haliging yari sa kahoy na akasya at binalutan ang mga iyon ng ginto. Ginto rin ang mga kawit ng mga iyon, at naghulma siya para sa mga iyon ng apat na patungang pilak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “rito” ay tumutukoy sa tabing na binanggit sa naunang talata.
    reason: cross_reference
  - marker: b
    text: O “apat na paanang pilak.” Ang mga ito ay mga patungang pinagsusuksukan ng mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שִׁטִּים
  choice: mga haliging yari sa kahoy na akasya
  rationale: Tumpak na ipinahahayag ang mga patayong suporta at ang materyales ng mga ito sa natural na modernong Tagalog.
- source_word: וַיְצַפֵּם
  choice: binalutan ang mga iyon ng ginto
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang pandiwa sa paglalagay ng metal na balot sa isang bagay; malinaw at karaniwan sa Tagalog ang 'binalutan ng ginto.'
- source_word: וָוֵיהֶם
  choice: mga kawit ng mga iyon
  rationale: Ang וָוִים ay mga pangkabit na kabit sa mga haligi; 'mga kawit' ang pinakanatural at matatag na salin sa kontekstong ito.
- source_word: אַדְנֵי כָסֶף
  choice: mga patungang pilak
  rationale: Ang mga ito ang pundasyong piyesang metal na kinalalagyan o pinagsusuksukan ng mga haligi. Malinaw sa karaniwang mambabasa ang 'patungan' at hindi nito labis na tinutukoy ang eksaktong hugis.
- source_word: לָהּ
  choice: para rito
  rationale: Pinananatili ang pambabaeng isahang panghalip ng Hebreo nang hindi inuulit sa pangunahing teksto ang tinutukoy nito mula sa naunang talata.
- source_word: וַיִּצֹק
  choice: naghulma siya
  rationale: Sa paggawa ng mga piyesang metal, ang pandiwa ay tumutukoy sa pagbubuhos at paghuhulma ng metal; natural sa Tagalog ang 'naghulma.'
