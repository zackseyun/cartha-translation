translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'mga iyon' para sa maramihang bagay upang maiwasan ang di-likas na sunod-sunod na 'nila' at mapanatiling malinaw na ang tinutukoy ay ang mga haligi.
