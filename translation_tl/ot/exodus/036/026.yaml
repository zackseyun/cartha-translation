translation:
  language: tl
  text: 'at ang apatnapung patungang pilak ng mga ito: dalawang patungan sa ilalim ng bawat tabla,[a] at dalawang patungan sa ilalim ng bawat tabla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawang patungan sa ilalim ng bawat balangkas, at dalawang patungan sa ilalim ng bawat balangkas.” Inuulit ng Hebreo ang pariralang “ang isang tabla/balangkas” sa dalawang sugnay; hindi nito tahasang sinasabing “kabilang tabla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: at ang apatnapung
  rationale: Ipinagpapatuloy ng pang-ugnay ang talaan ng mga bahagi, at tuwirang isinalin ang bilang na apatnapu.
- source_word: אַדְנֵי/הֶם כָּסֶף
  choice: pilak na patungan ng mga iyon
  rationale: Ang אֲדָנִים ay mga suportang patungan o socket ng mga balangkas. Likas sa modernong Tagalog ang 'pilak na patungan,' at ang 'ng mga iyon' ay nagpapanatili sa panghalip na tumutukoy sa naunang mga balangkas.
- source_word: שְׁנֵי אֲדָנִים
  choice: dalawang patungan
  rationale: Pare-parehong isinalin ang terminong pangkonstruksiyon at tuwirang pinanatili ang bilang.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Malinaw nitong ipinapahayag ang kinalalagyan ng mga patungan kaugnay ng bawat balangkas.
- source_word: הַ/קֶּרֶשׁ
  choice: balangkas
  rationale: Sa konteksto ng tabernakulo, ito ay isang patayong bahaging istruktural; mas malinaw ang 'balangkas' kaysa sa pangkalahatang 'tabla,' habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: הָ/אֶחָד
  choice: isang
  rationale: Ang Hebreo ay inuulit ang 'the one' sa parehong sugnay. Ang 'isang' ay natural sa Tagalog at pinananatili ang sinadyang pag-uulit nang hindi ginagawang 'isa pa' o 'kabila.'
