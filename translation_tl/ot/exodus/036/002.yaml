  terminology: Ang “Yahweh,” “karunungan,” at larawan ng “puso” ay angkop. Pinanatili ang “pusong marunong” bilang malapit na salin ng idyoma, na may talababa upang ipaliwanag ang saklaw nitong karunungan o kasanayan.
