base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: tl
  text: Pagkatapos, tinawag ni Moises sina Bezalel at Oholiab, at ang bawat taong may pusong marunong[a], na nilagyan ni Yahweh ng karunungan ang kanyang puso—bawat isa na inudyukan ng kanyang puso[b] na lumapit sa gawain upang gawin ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “marunong sa puso,” isang idyoma para sa taong pinagkalooban ng karunungan o kasanayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hinimok ng kanyang puso” o “itinaas ng kanyang puso.” Ipinahihiwatig ng Hebreong idyoma ang panloob na pagkukusa o paghimok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Sa kayariang קרא אֶל, ipinahihiwatig ng pandiwa ang pagtawag o pagpapapunta sa mga tao para sa isang gawain. Likas at sapat na tiyak sa modernong Tagalog ang “tinawag.”
- source_word: בְּצַלְאֵל וְאֶל אָהֳלִיאָב
  choice: sina Bezalel at Oholiab
  rationale: Ginamit ang “sina” bilang likas na pananda sa dalawang pangalang pantangi sa Tagalog; isinalin sa baybay-Latin ang mga pangalan.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: ang lahat ng taong may pusong marunong
  rationale: Pinananatili nito ang Hebreong larawan ng “marunong sa puso,” habang nililinaw sa talababa na tumutukoy ito sa karunungan at kasanayan, lalo na sa gawaing pansining at pagtatayo.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: bawat isang nilagyan ni Yahweh ng karunungan ang puso
  rationale: Pinananatili ang puso bilang kinaroroonan ng karunungang kaloob ng Diyos at malinaw na si Yahweh ang nagbibigay nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinalitan ng isang titulo.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: bawat isang inudyukan ng kanyang puso
  rationale: Ipinahahayag nito ang panloob na pagkukusa o paghimok nang hindi ipinapalagay kung damdamin, pasiya, o pagnanais lamang ang tinutukoy.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה
  choice: na lumapit sa gawain
  rationale: Pinananatili ng “lumapit” ang larawan ng קרב at ipinakikitang kusang humarap o nakibahagi ang tao sa gawaing itinakda.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: upang isagawa iyon
  rationale: Ang “isagawa” ay natural sa Tagalog para sa paggawa o pagtupad sa tinutukoy na gawain at malinaw ang layunin ng paglapit.
theological_decisions:
- issue: Paglalarawan sa pinagmulan ng karunungan
  choice: nilagyan ni Yahweh ng karunungan ang puso
  alternative: binigyan ni Yahweh ng karunungan
  rationale: Pinananatili ng napili ang tahasang Hebreong wika tungkol sa puso at ang pagkilos ni Yahweh bilang pinagmulan ng karunungan, nang hindi ito ginagawang likas lamang na talento.
- issue: Pagbaybay sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa halip na palitan ng titulo.
- issue: Kalikasan ng panloob na paghimok
  choice: inudyukan ng kanyang puso
  alternative: kusang-loob na nagnanais
  rationale: Hindi nililimitahan ng salin ang idyoma sa isang tiyak na sikolohikal o teolohikal na paliwanag; pinananatili nito ang panloob na pagkukusa o paghimok.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang Hebreong larawan ng puso sa pangunahing teksto at ipinaliwanag ang mga idyoma sa maiikling talababa. Ginamit ang “tao” sa halip na “lalaki” sapagkat kinakatawan ng panlalaking isahan sa konteksto ang bawat kabilang sa pangkat ng mga manggagawa; walang idinagdag na denominasyonal na pagpapakahulugan.
