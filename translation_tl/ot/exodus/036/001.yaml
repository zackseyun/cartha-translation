  naturalness: Nauunawaan ang draft, ngunit hindi likas ang “nina Bezalel at Oholiab, kasama ng bawat...” bilang magkakaugnay na simuno. Mas malinaw at natural ang magkakasunod na “nina/ni/ng” at isang hiwalay na pangungusap para sa kolektibong pagkakaloob.
  terminology: Ang “Yahweh,” “karunungan at pagkaunawa,” at “santuwaryo” ay angkop. Ang “gawaing kailangan sa” ay maaaring basahin bilang karagdagang ideya ng kinakailangan; mas malapit ang “gawain para sa paglilingkod sa santuwaryo.”
