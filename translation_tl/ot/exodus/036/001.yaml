  text: וְ/עָשָׂה֩ בְצַלְאֵ֨ל וְ/אָהֳלִיאָ֜ב וְ/כֹ֣ל אִ֣ישׁ חֲכַם לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה חָכְמָ֤ה וּ/תְבוּנָה֙ בָּ/הֵ֔מָּה לָ/דַ֣עַת לַ/עֲשֹׂ֔ת אֶֽת כָּל מְלֶ֖אכֶת עֲבֹדַ֣ת הַ/קֹּ֑דֶשׁ לְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: tl
  text: Gagawin nina Bezalel at Oholiab, at ng bawat lalaking dalubhasa[a], ang lahat ng gawain para sa paglilingkod sa santuwaryo[c], ayon sa lahat ng iniutos ni Yahweh. Pinagkalooban silang lahat ni Yahweh ng karunungan at pagkaunawa[b] upang malaman nila kung paano ito gawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat lalaking marunong ang puso”; sa kontekstong ito, tumutukoy ito sa bawat manggagawang may kasanayan, at maaaring gamitin ang parirala sa pangkalahatang diwa.
    reason: lexical_alternative
  - marker: b
    text: 'O “nilagyan silang lahat ni Yahweh ng karunungan at pagkaunawa.” Literal na maramihan ang Hebreo: “sa kanila,” na sama-samang tumutukoy kina Bezalel, Oholiab, at sa bawat lalaking dalubhasa.'
    reason: lexical_alternative
  - marker: c
    text: O “lahat ng gawain ng paglilingkod sa banal na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: Kaya gagawin
  rationale: Ang Qal perfect na may waw ay nagpapahayag dito ng bunga o pagpapatuloy ng naunang tagubilin. Ang “gagawin” ay likas sa Filipino at sumasaklaw sa iba’t ibang gawain.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: nina Bezalel at Oholiab
  rationale: Isinalin ang mga pangalang pantangi sa karaniwang transliterasyon; ang “nina” ay angkop dahil sila ang mga tagaganap ng pandiwa.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: kasama ng bawat lalaking dalubhasa
  rationale: Ang literal na idyomang “lalaking marunong ang puso” ay tumutukoy sa kasanayan at kakayahang panloob, lalo na sa konteksto ng paggawa. Pinananatili ng “lalaki” ang אִישׁ, samantalang malinaw at natural ang “dalubhasa.”
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: na pinagkalooban ni Yahweh ng karunungan at pagkaunawa
  rationale: Likas na Filipino ang “pinagkalooban” para sa pagbibigay ng kakayahan. Ang Hebreo ay literal na “sa kanila,” kaya kolektibo ang tinutukoy; itinatala ito sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: upang malaman kung paano gawin
  rationale: Ipinahahayag ng dalawang infinitive ang praktikal na kaalaman o kakayahang maisagawa ang gawain.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: ang lahat ng gawaing kailangan sa paglilingkod sa santuwaryo
  rationale: Pinananatili ang ugnayan ng מְלָאכָה, עֲבֹדָה, at הַקֹּדֶשׁ habang ginagawang malinaw sa modernong Filipino na ang mga gawain ay para sa paglilingkod sa banal na lugar.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: ang lahat ayon sa iniutos ni Yahweh
  rationale: Ang לְ ay nauunawaan bilang pagsunod o pag-ayon sa lahat ng iniutos; ang ayos ng pangungusap ay ginawang natural sa Filipino.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit sa teksto ang Tetragrammaton, kaya pinananatili ang personal na pangalang Yahweh nang hindi ito pinapalitan ng titulo.
- issue: Kasariang ipinahahayag ng אִישׁ חֲכַם לֵב
  choice: bawat lalaking dalubhasa
  alternative: bawat taong dalubhasa; bawat manggagawang dalubhasa
  rationale: Tahasang panlalaki ang אִישׁ. Pinananatili ito sa pangunahing teksto, ngunit ipinapaliwanag sa talababa na maaaring pangkalahatan ang gamit ng parirala sa konteksto.
- issue: Karunungan bilang praktikal na kasanayan
  choice: karunungan at pagkaunawa
  alternative: kasanayan at pagkaunawa
  rationale: Pinananatili ang karaniwang saklaw ng חָכְמָה at תְבוּנָה, habang ipinakikita ng kasunod na parirala na kabilang dito ang kakayahang pansining at teknikal.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “santuwaryo” bilang malinaw at nakaugaliang terminong biblikal; iniwasan ang labis na literal na “marunong ang puso” sa pangunahing teksto ngunit pinanatili ito sa talababa. Inayos ang sintaks upang malinaw na ang lahat ng pinangalanang manggagawa ang simuno ng “gagawin.”
