  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “komadrona,” “Paraon,” “Ehipsiyo,” at “Hebreo” bilang mga katawagang madaling makilala ng karaniwang mambabasa. Inilagay ang [a] pagkatapos ng “masisigla,” ang salitang aktuwal na tinatalakay ng talababa.
