base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: tl
  text: Sinabi ng mga komadrona sa Paraon, “Hindi tulad ng mga babaeng Ehipsiyo ang mga babaeng Hebreo, sapagkat masisigla[a] sila; nakapanganak na sila bago pa dumating sa kanila ang komadrona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malalakas” o “matitibay.” Maaaring tumukoy ang salitang Hebreo sa kanilang lakas at bilis sa panganganak; inuunawa naman ito ng ilan sa mas literal na diwang “tulad ng mga hayop.”
    reason: Pinananatili ang leksikal na kalabuan ng חָיוֹת nang hindi ginagawang pangunahing salin ang posibleng nakahihiyang paghahambing.
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Sinabi
  rationale: Ang wayyiqtol ng אמר ay karaniwang nagpapakilala ng tuwirang pananalita sa salaysay; natural dito ang “Sinabi.”
- source_word: הַמְיַלְּדֹת
  choice: mga komadrona
  rationale: Ito ang karaniwan at madaling maunawaang katawagan sa modernong Filipino para sa mga babaeng tumutulong sa panganganak.
- source_word: אֶל־פַּרְעֹה
  choice: sa Paraon
  rationale: Ipinahihiwatig ng אֶל ang pinatutungkulan ng pagsasalita; “Paraon” ang nakaugaliang anyo sa Filipino.
- source_word: לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: Hindi tulad ng mga babaeng Ehipsiyo ang mga babaeng Hebreo
  rationale: Pinananatili nito ang tahasang paghahambing at ang diin sa pagkakaiba ng dalawang pangkat sa natural na ayos ng Filipino.
- source_word: חָיוֹת
  choice: masisigla
  rationale: Naipapahayag nito ang lakas at bilis na ipinahihiwatig sa konteksto ng panganganak, habang inilalahad sa talababa ang tunay na lawak at kalabuan ng salitang Hebreo.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: bago pa dumating sa kanila ang komadrona
  rationale: Malinaw na ipinapahayag ng “bago pa” ang naunang pangyayari; ang isahang “komadrona” ay ginamit sa panlahatang diwa gaya ng nasa Hebreo.
- source_word: וְיָלָדוּ
  choice: nakapanganak na sila
  rationale: Ipinakikita ng aspektong ganap na tapos na ang panganganak bago dumating ang komadrona.
