  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: tl
  text: At naging mabuti ang Diyos sa mga komadrona[a], at dumami ang bayan at lubhang lumakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gumawa ng mabuti ang Diyos para sa mga komadrona” o “pinagpala ng Diyos ang mga komadrona.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: ginawan ... ng mabuti
  rationale: Ang Hiphil ng יטב na may ל ay nagpapahayag ng paggawa ng mabuti para sa isang tao. Pinananatili ng pariralang ito ang malawak na diwang benefaktibo nang hindi ito agad tinutukoy bilang pagpapala.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Sa kontekstong ito, tumutukoy ang אֱלֹהִים sa Diyos at ang pandiwa ay nasa anyong isahan.
- source_word: לַמְיַלְּדֹת
  choice: ang mga komadrona
  rationale: Ang ל ay nakapaloob sa natural na konstruksiyong Filipino na “ginawan ... ng mabuti,” na nagpapakitang sila ang tumanggap ng kabutihan.
- source_word: וַיִּרֶב
  choice: dumami
  rationale: Ang רבה ay tumutukoy rito sa pagdami ng bilang ng bayan.
- source_word: הָעָם
  choice: ang bayan
  rationale: Pinananatili ang payak na pagtukoy ng Hebreo sa kolektibong sambayanan nang hindi idinaragdag ang “Israel,” na malinaw na sa konteksto.
- source_word: וַיַּעַצְמוּ
  choice: lalo silang lumakas
  rationale: Ang עצם ay nagpapahayag ng paglakas o pagiging makapangyarihan. Ang “lumakas” ay natural sa modernong Filipino, at ang “lalo” kasama ng מְאֹד ay nagpapakita ng mataas na antas.
- source_word: מְאֹד
  choice: lalo
  rationale: Ginagamit ang “lalo” bilang natural na pampatingkad sa pag-unlad na ipinahihiwatig ng “lumakas”; iniiwasan nito ang mas mabigat na “lubhang.”
theological_decisions:
- issue: Kung isasalin ang ginawa ng Diyos bilang “pinagpala” o sa mas malawak na diwa ng paggawa ng mabuti
  choice: ginawan ng Diyos ng mabuti
  alternative: pinagpala ng Diyos
  rationale: Ang יטב ay nagsasaad na gumawa ng mabuti o naging mabuti sa kanila, ngunit hindi nito mismo tinutukoy ang tiyak na paraan ng pabor ng Diyos. Pinananatili ng salin ang lawak ng salita at hinahayaang ang kasunod na talata ang magbigay ng higit na detalye.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “komadrona,” ang karaniwang salitang Filipino para sa mga babaeng tumutulong sa panganganak. Ang “bayan” ay kolektibo at akma sa konteksto ng Israel bilang isang sambayanan.
