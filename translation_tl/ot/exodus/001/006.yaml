  text: Then Joseph died, and all his brothers, and all that generation.
translation:
  language: tl
  text: Pagkatapos, namatay si Jose, pati ang lahat ng kanyang mga kapatid at ang buong salinlahing iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Ang waw-consecutive kasama ng מות ay nagsusulong sa salaysay sa kasunod na pangyayari. Likas sa modernong Tagalog ang “Pagkatapos, namatay” at malinaw nitong naipapakita ang pagkakasunod-sunod.
- source_word: יוֹסֵף
  choice: Jose
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: וְכָל אֶחָיו
  choice: pati ang lahat ng kanyang mga kapatid
  rationale: Ang כָּל ay kolektibo, at ang אֶחָיו ay tumutukoy sa mga lalaking kapatid ni Jose sa konteksto. Ang “pati” ay natural na nag-uugnay sa kanilang pagkamatay sa naunang pagbanggit kay Jose.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: at ang buong salinlahing iyon
  rationale: Ang דּוֹר ay tumutukoy sa pangkat ng mga taong magkakasabay na nabuhay. Ang “buong salinlahing iyon” ay likas at pinananatili ang saklaw ng כֹּל.
theological_decisions: []
