base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: tl
  text: At pinait nila ang buhay ng mga Israelita sa mabigat na paggawa sa argamasa at mga ladrilyo at sa lahat ng gawain sa bukid—lahat ng gawaing ipinagawa nila sa mga Israelita nang buong lupit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nang walang awa.” Ang salitang Hebreo ay tumutukoy sa malupit at mapaniil na pang-aapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: pinapait nila ang buhay ng mga Israelita
  rationale: Pinananatili ng “pinapait” ang Hebreong metapora mula sa מרר. Nilinaw ang tinutukoy ng hulaping “kanila” bilang mga Israelita upang maging natural at malinaw sa Tagalog.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: sa pamamagitan ng mabigat na paggawa
  rationale: Likas na salin ito ng mahirap at mapaniil na paggawa; ang “sa pamamagitan ng” ay malinaw na nag-uugnay sa paraan kung paano pinapait ang kanilang buhay.
- source_word: בְּחֹמֶר
  choice: sa argamasa
  rationale: Sa konteksto ng paggawa ng ladrilyo, tumutukoy ang חֹמֶר sa putik o materyal na panali. Ang “argamasa” ay tiyak at nauunawaang katawagan para sa mortar.
- source_word: וּבִלְבֵנִים
  choice: at mga ladrilyo
  rationale: Pinananatili ang kongkretong pangmaramihang anyo ng Hebreo sa halip na gawing abstraktong “paggawa ng ladrilyo.”
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: at sa lahat ng uri ng gawain sa bukid
  rationale: Ipinahahayag nito ang lawak ng כָל עֲבֹדָה at natural sa modernong Tagalog.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: lahat ng gawaing ipinagawa nila sa mga ito
  rationale: Bahagyang pinakinis ang mabigat at resumptibong konstruksiyon ng Hebreo. Ipinakikita ng “ipinagawa” na ang mga Ehipsiyo ang nagtakda at nagpataw ng gawain.
- source_word: בְּפָרֶךְ
  choice: nang buong lupit
  rationale: Ipinahahayag nito ang malupit at mapangwasak na tindi ng פָרֶךְ nang hindi nagdaragdag ng paraang hindi sinasabi ng teksto.
