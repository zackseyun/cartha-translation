revisions:
- from: At pinapait nila ang buhay ng mga Israelita sa pamamagitan ng mabigat na paggawa sa argamasa at mga ladrilyo, at sa lahat ng uri ng gawain sa bukid—lahat ng gawaing ipinagawa nila sa mga ito nang buong lupit.[a]
  to: At pinait nila ang buhay ng mga Israelita sa mabigat na paggawa sa argamasa at mga ladrilyo at sa lahat ng gawain sa bukid—lahat ng gawaing ipinagawa nila sa mga Israelita nang buong lupit.[a]
  rationale: Ginawang pangnagdaan ang pangunahing pandiwa upang tumugma sa anyo at daloy ng salaysay sa Hebreo. Pinalitan ang “mga ito” ng “mga Israelita” upang lutasin ang kalabuan at mapanatili ang pagtukoy sa mga taong sapilitang pinagtrabaho. Pinagaan din ang “lahat ng uri ng gawain” tungo sa mas tuwirang salin ng “lahat ng gawain.”
