  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: tl
  text: Kaya ipinatawag ng hari ng Ehipto ang mga komadrona at sinabi sa kanila, “Bakit ninyo ginawa ito at hinayaang mabuhay ang mga bata[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang huling bahagi: “pinanatili ninyong buhay ang mga bata.” Ang pandiwang Hebreo ay maaaring mangahulugang hayaang mabuhay o panatilihing buhay, ayon sa konteksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa konstruksiyong קרא na may ל para sa mga tao, ang diwa ay ipatawag o papuntahin sila; natural ito sa Filipino para sa utos ng hari.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: hari ng Ehipto
  rationale: Tuwirang katumbas ng Hebrew construct chain at karaniwang anyo sa Filipino.
- source_word: לַמְיַלְּדֹת
  choice: ang mga komadrona
  rationale: Tiyak at karaniwang katawagan sa Filipino para sa mga babaeng tumutulong sa panganganak.
- source_word: וַיֹּאמֶר לָהֶן
  choice: at sinabi sa kanila
  rationale: Pinananatili ang payak na pandiwa ng pagsasalita at ang tahasang tagapakinig.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Natural at maikling katumbas ng tanong tungkol sa dahilan.
- source_word: עֲשִׂיתֶן
  choice: ninyo ginawa
  rationale: Ipinahihiwatig ng “ninyo” ang maramihang kinakausap; hindi minamarkahan ng modernong Filipino ang pambabaeng kasarian ng pandiwa.
- source_word: הַדָּבָר הַזֶּה
  choice: ito
  rationale: Sa Filipino, ang “ginawa ito” ay natural at sapat upang katawanin ang ‘bagay/gawa na ito’ nang hindi mabigat ang pananalita.
- source_word: וַתְּחַיֶּיןָ
  choice: hinayaang mabuhay
  rationale: Inilalarawan ang kontekstuwal na diwa ng hindi pagpatay at pagpapahintulot na manatiling buhay, habang kinikilala sa talababa ang posibleng diwang ‘pinanatiling buhay.’
- source_word: הַיְלָדִים
  choice: ang mga bata
  rationale: Pinananatili ang leksikal na lawak ng pangngalang Hebrew; malinaw naman sa naunang konteksto na ang tinutukoy ay mga sanggol na lalaki.
