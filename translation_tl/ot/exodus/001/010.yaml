  naturalness: 'Ang binagong teksto ay gumagamit ng malinaw at makabagong Filipino: “Halika” bilang panawagan tungo sa sama-samang pagkilos, “pakitunguhan natin sila nang may katusuhan,” at “baka” para sa kinatatakutang posibilidad. Ang “umahon mula sa lupain” ay bahagyang mas pormal kaysa “umalis,” ngunit sinadyang pinanatili upang katawanin ang Hebreong larawan; ipinaliliwanag ito ng talababa.'
  terminology: Ang “may katusuhan” ay angkop sa mapanlinlang o mapan-kalkulang puwersa ng נִתְחַכְּמָה. Ang “pumanig sa ating mga kaaway” ay natural na katumbas ng pagdaragdag ng sarili sa panig ng mga kaaway. Wala itong problemang teolohikal o pangalang kailangang baguhin.
