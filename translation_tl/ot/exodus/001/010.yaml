source:
  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: tl
  text: “Halika, pakitunguhan natin sila nang may katusuhan,[a] baka dumami sila. Kung sumiklab ang digmaan, baka pumanig din sila sa ating mga kaaway, makipaglaban sa atin, at umahon mula sa lupain.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kaniya.” Isahan ang panghalip sapagkat kolektibong tinutukoy ang Israel bilang isang bayan. Maaari ring isalin ang parirala na “pakitunguhan natin sila nang may katalinuhan,” ngunit sa kontekstong ito ay tuso at mapan-kalkulang pagkilos ang ipinahihiwatig.
    reason: lexical_alternative
  - marker: b
    text: O “umalis mula sa lupain.” Sa literal, “umahon” o “umakyat mula sa lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Halikayo
  rationale: Likas at makabagong paanyaya sa sama-samang agarang pagkilos; pinananatili ang puwersang panghikayat ng Hebreo.
- source_word: נִתְחַכְּמָה
  choice: kumilos tayo nang may katusuhan
  rationale: Ipinahihiwatig ng anyo at konteksto ang tuso at mapan kalkulang patakaran, hindi lamang positibong karunungan; iniiwasan din nitong gawing labis na tiyak ang paraang gagamitin.
- source_word: לוֹ
  choice: laban sa kanila
  rationale: Bagaman isahan ang panghalip sa Hebreo, kolektibo ang tinutukoy nitong Israel. Ang maramihang 'kanila' ay natural sa Tagalog; ang 'laban sa' ay naghahayag ng masamang layunin sa konteksto.
- source_word: פֶּן יִרְבֶּה
  choice: upang hindi sila dumami
  rationale: Malinaw na ipinapahayag ang layuning pigilan ang kinatatakutang pagdami, habang ginagamit ang maramihan para sa kolektibong bayan.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: Kung sumiklab ang digmaan
  rationale: Natural na Filipino para sa isang posibleng pagdating o pagsiklab ng digmaan.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: baka pumanig din sila sa ating mga kaaway
  rationale: Sa pariralang ito, ang literal na pagdagdag sa sarili sa isang pangkat ay idiomatikong nangangahulugang pagpanig o pagsanib sa kanila; ang 'baka' ay natural na nagdadala ng kinatatakutang posibilidad.
- source_word: וְנִלְחַם בָּנוּ
  choice: makipaglaban sa atin
  rationale: Direkta at natural na katumbas ng pakikipaglaban laban sa nagsasalita at sa kanyang bayan.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: umalis sa lupain
  rationale: Ipinapahayag ang malamang na idiomatikong diwa ng Hebreong 'umahon/umakyat mula sa lupain.' Inilalagay sa talababa ang mas literal na larawan dahil maaaring makabuluhan at may tunay na kalabuan ang pangwakas na parirala.
theological_decisions:
- issue: Ang kinatatakutang resulta sa וְעָלָה מִן הָאָרֶץ
  choice: umalis sa lupain
  alternative: umahon mula sa lupain / sakupin ang lupain
  rationale: Karaniwang nauunawaan ang Hebreo bilang pag-alis mula sa lupain, ngunit ang literal na 'umakyat mula' ay hindi lubos na nagpapasiya sa lahat ng iminungkahing pagbasa. Hindi isinasama sa pangunahing teksto ang interpretasyong 'sakupin' sapagkat hindi iyon ang tuwirang leksikal na diwa; pinananatili sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Halikayo” sa utos ng hari upang maging natural ngunit hindi impormal. Ang kolektibong Israel ay isinalin sa maramihang panghalip. Pinanatili sa talababa ang literal na larawan at kalabuan ng huling parirala.
