base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: tl
  text: Isang bagong hari[a] ang bumangon bilang pinuno ng Ehipto, na hindi nakakilala kay Yosef.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibang hari.” Literal na “bago” ang pang-uring Hebreo, ngunit nauunawaan ito ng ilan bilang pahiwatig ng ibang dinastiya o rehimen.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hindi kumilala kay Yosef.” Maaaring ang “makilala” rito ay tumukoy sa pagkilala o pagbibigay-halaga sa kaniya, at hindi lamang sa kawalan ng impormasyon tungkol sa kaniya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bumangon
  rationale: Pinananatili nito ang larawan ng קום at likas ding naipahihiwatig sa konteksto ang paglitaw o pag-akyat ng isang pinuno.
- source_word: מֶלֶךְ
  choice: hari
  rationale: Tuwirang katumbas ito ng tiyak na katawagang Hebreo para sa hari.
- source_word: חָדָשׁ
  choice: bago
  rationale: Ito ang payak na leksikal na kahulugan; hindi ipinapasok sa pangunahing teksto ang palagay na nagbago ang dinastiya o rehimen.
- source_word: עַל מִצְרָיִם
  choice: upang mamuno sa Ehipto
  rationale: Likas sa Tagalog ang pariralang ito at ipinahahayag nito ang kapangyarihan ng hari sa Ehipto na dala ng עַל, sa halip na lokasyon lamang.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: hindi nakakilala
  rationale: Pinananatili ang saligang diwa ng 'hindi nakaalam/nakakilala' habang iniiwang bukas kung kakulangan ito ng personal na kaalaman o ng pagkilala at pagpapahalaga.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Tuwirang transliterasyon ito ng pangalang Hebreo יוֹסֵף sa halip na paggamit ng anyong nagmula sa ibang wika.
theological_decisions:
- issue: Kung dapat ipahiwatig ang pagbabago ng dinastiya o sinasadyang pagwawalang-bahala kay Yosef
  choice: Pinanatili ang payak na 'bagong hari' at 'hindi nakakilala kay Yosef.'
  alternative: Ibang hari o dinastiya; hindi kinilala o sadyang binale-wala si Yosef
  rationale: Hindi tahasang sinasabi ng talata na nagbago ang dinastiya o na sinadya ng hari ang pagwawalang-bahala. Pinananatili ng salin ang tunay na kalabuan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pag-uulit na “isang haring” pagkatapos ng gatlang upang maging natural ang kaugnay na sugnay at maiwasan ang alanganing pagkakabit nito sa “Ehipto.”
