  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: tl
  text: Kaya nagtalaga sila ng mga tagapangasiwa ng sapilitang paggawa sa mga Israelita[a] upang pahirapan sila sa mga pasaning ipinataw sa kanila. Nagtayo ang mga Israelita ng mga lunsod na imbakan[b] para sa Faraon—ang Pitom at Rameses.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahan ang mga anyong “sa kanya,” “pahirapan siya,” at “nagtayo siya”; kolektibo nilang tinutukoy ang Israel bilang isang bayan.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isalin na “mga lunsod-panustos.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring baybayin ang Rameses na “Raamses,” na mas malapit sa anyong Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: nagtalaga sila
  rationale: Sa konteksto, ang שׂים ay tumutukoy sa paglalagay o pagtatalaga ng mga opisyal; natural at malinaw sa modernong Tagalog ang “nagtalaga.”
- source_word: עָלָיו
  choice: sa mga Israelita
  rationale: Bagaman pang-isahang panlalaki ang anyong Hebreo, kolektibo nitong tinutukoy ang Israel. Ginawang tahasan at maramihan sa Tagalog upang maging likas at hindi mapagkamalang isang indibidwal; ipinaliwanag sa talababa ang anyong Hebreo.
- source_word: שָׂרֵי מִסִּים
  choice: mga tagapangasiwa ng sapilitang paggawa
  rationale: Ang parirala ay tumutukoy sa mga opisyal na namamahala sa corvée o sapilitang paggawa. Mas eksakto at madaling maunawaan ito kaysa sa salitang maaaring magpahiwatig lamang ng pangkalahatang superbisyon.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: upang pahirapan sila
  rationale: Ang piel ng ענה ay nangangahulugang pahirapan, apiin, o ibaba. Napananatili ng “pahirapan” ang tindi nang hindi nagdaragdag ng tiyak na uri ng pang-aapi.
- source_word: בְּסִבְלֹתָם
  choice: sa mga pasaning ipinataw sa kanila
  rationale: Saklaw ng סִבְלֹת ang mga pasan at mabibigat na obligasyon sa paggawa. Pinananatili ng “mga pasanin” ang larawang literal habang nililinaw ng “ipinataw” ang konteksto ng sapilitang paggawa.
- source_word: וַיִּבֶן
  choice: Nagtayo ang mga Israelita
  rationale: Pang-isahan ang pandiwang Hebreo dahil kolektibong pang-isahan ang Israel, ngunit ang likas na Tagalog ay gumagamit ng maramihang reperente. Nasa talababa ang literal na gramatikal na anyo.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: mga lunsod-imbakan
  rationale: Tumutukoy ito sa mga lunsod na nagsisilbing imbakan o sentro ng mga panustos. Maikli, malinaw, at malapit sa Hebreo ang “lunsod-imbakan.”
- source_word: לְפַרְעֹה
  choice: para sa Faraon
  rationale: Karaniwang makabagong Tagalog para sa layon o benepisyaryo ng pagtatayo.
- source_word: פִּתֹם
  choice: Pitom
  rationale: Transliterasyon ng pangalang-pook na angkop sa bigkas at baybay sa Tagalog.
- source_word: רַעַמְסֵס
  choice: Rameses
  rationale: Pamilyar na anyo ng pangalang-pook sa tradisyong biblikal sa Filipino; inilagay sa talababa ang mas titik-sa-titik na alternatibo.
theological_decisions:
- issue: Kolektibong pang-isahang pagtukoy sa Israel
  choice: Gumamit ng likas na maramihang pagtukoy sa pangunahing teksto at ipaliwanag ang pang-isahang Hebreo sa talababa.
  alternative: Panatilihin sa teksto ang “sa kanya,” “siya,” at “nagtayo siya.”
  rationale: Hindi ito pagkakaibang teolohikal kundi idyomang panggramatika. Sa Tagalog, ang tahasang pang-isahan ay madaling mapagkamalang tumutukoy sa isang tao, kaya pinananatili ang kahulugan at inilalantad sa talababa ang tunay na anyo ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sapilitang paggawa” upang malinaw ang institusyong tinutukoy, at “lunsod-imbakan” bilang maikli at natural na tambalang katawagan. Isinaayos ang mga pananda ng talababa sa mismong pariralang nililinaw ng bawat isa.
