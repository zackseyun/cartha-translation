base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: tl
  text: Ngunit may takot sa Diyos ang mga komadrona, at hindi nila ginawa ang iniutos sa kanila ng hari ng Ehipto. Sa halip, hinayaan nilang mabuhay ang mga bata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “pinanatili nilang buhay ang mga bata.”
    reason: Ipinakikita ang alternatibong causative na diwa ng וַתְּחַיֶּיןָ.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: natakot
  rationale: Ang ירא ay maaaring tumukoy sa takot na may kasamang pagpipitagan. Pinananatili ng “natakot sa Diyos” ang karaniwang idyomang biblikal nang hindi ito pinahihina bilang paggalang lamang.
- source_word: הַמְיַלְּדֹת
  choice: mga komadrona
  rationale: Ang anyong participle mula sa ילד ay tumutukoy sa mga babaeng tumutulong sa panganganak; “mga komadrona” ang tiyak at likas na katumbas sa modernong Filipino.
- source_word: אֶת־הָאֱלֹהִים
  choice: sa Diyos
  rationale: Sa pariralang may pandiwang ירא, ang tinutukoy ay ang Diyos. Likas sa Filipino ang “natakot sa Diyos,” nang hindi na tinutumbasan ang artikulong Hebreo.
- source_word: וְלֹא עָשׂוּ
  choice: hindi nila ginawa
  rationale: Tuwirang isinasalin ang negatibong anyo ng עשׂה at malinaw na inihahanda ang kasunod na paglalarawan sa utos.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: ang iniutos sa kanila
  rationale: Bagaman literal na “ang sinabi sa kanila,” utos ng hari ang tinutukoy sa konteksto. Ang “iniutos” ay natural at tumpak sa Filipino.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: hari ng Ehipto
  rationale: Karaniwan, malinaw, at tuwirang katumbas ng construct phrase sa Hebreo.
- source_word: וַתְּחַיֶּיןָ
  choice: hinayaan nilang mabuhay
  rationale: Ang piel ng חיה ay maaaring mangahulugang magpanatiling buhay o hayaang mabuhay. Ang saling ito ay likas at malinaw na kasalungat ng utos na pumatay.
- source_word: הַיְלָדִים
  choice: mga bata
  rationale: Mas malawak sa “mga batang lalaki” ang mismong pangngalang Hebreo, bagaman ipinakikita ng naunang konteksto na mga sanggol na lalaki ang tinutukoy. Pinananatili ng “mga bata” ang saklaw ng salita.
theological_decisions:
- issue: Pagkakasalin ng אֱלֹהִים sa pariralang “matakot sa Diyos”
  choice: Diyos
  alternative: ang Diyos
  rationale: Tinutukoy ng salaysay ang tunay na Diyos bilang kinatatakutan at iginagalang ng mga komadrona. Sa Filipino, likas ang “sa Diyos” sa pariralang ito at hindi nangangailangan ng dagdag na pantukoy.
- issue: Saklaw ng pagkatakot sa Diyos
  choice: natakot sa Diyos
  alternative: nagpitagan sa Diyos
  rationale: Pinananatili ng “natakot” ang lakas at teolohikal na tensiyon ng ירא, habang hinahayaan ang konteksto na magpahiwatig ng mapitagang pagsunod.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “komadrona,” na karaniwan at tiyak, at hinati sa dalawang pangungusap upang maging natural ang daloy nang hindi binabago ang ugnayan ng mga sugnay. Inilagay ang talababa sa pariralang “hinayaan nilang mabuhay,” na siyang aktuwal na may leksikal na alternatibo.
