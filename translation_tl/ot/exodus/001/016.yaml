  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בְּ/יַלֶּדְ/כֶן֙ אֶת הָֽ/עִבְרִיּ֔וֹת וּ/רְאִיתֶ֖ן עַל הָ/אָבְנָ֑יִם אִם בֵּ֥ן הוּא֙ וַ/הֲמִתֶּ֣ן אֹת֔/וֹ וְ/אִם בַּ֥ת הִ֖יא וָ/חָֽיָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: tl
  text: At sinabi niya, “Kapag tinutulungan ninyong manganak ang mga babaeng Hebreo at nakita ninyo sila sa upuang panganganak[a], kung lalaki ang sanggol, patayin ninyo siya; ngunit kung babae, hayaan ninyo siyang mabuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa dalawang bato,” na malamang ay tumutukoy sa isang luklukan o upuang ginagamit sa panganganak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: Kapag tinutulungan ninyong manganak
  rationale: Ipinahahayag ng anyong Piel at ng konteksto ng mga komadrona ang pagtulong sa panganganak. Likas at malinaw ito sa modernong Tagalog.
- source_word: הָעִבְרִיּוֹת
  choice: ang mga babaeng Hebreo
  rationale: Tuwirang katumbas ng pambabaeng pangmaramihang substantibo; sapat na ang konteksto upang ipakitang nanganganak sila.
- source_word: וּרְאִיתֶן
  choice: at nakita ninyo sila
  rationale: Pinananatili ang payak na diwa ng pagkakita; idinagdag ang likas na layon sa Tagalog upang malinaw ang pangungusap.
- source_word: עַל הָאָבְנָיִם
  choice: sa upuang panganganak
  rationale: Ang literal na ‘sa dalawang bato’ ay malamang na katawagan sa luklukan o upuang ginagamit sa panganganak. Ang kahulugang ayon sa konteksto ang nasa teksto, habang nasa talababa ang literal na anyo at kawalang-katiyakan.
- source_word: אִם בֵּן הוּא
  choice: kung lalaki ang sanggol
  rationale: Sa Tagalog, mas natural at di-malabo ang ‘lalaki ang sanggol’ kaysa ‘kung anak na lalaki,’ habang tumpak na ipinapahayag ang kasarian ng bagong silang.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: patayin ninyo siya
  rationale: Ang Hiphil ng מות ay tahasang utos na sanhiin ang kamatayan. Ang ‘patayin’ ang tuwiran at natural na katumbas sa Tagalog, nang hindi pinahihina ang kalupitan ng utos.
- source_word: וְאִם בַּת הִיא
  choice: ngunit kung babae
  rationale: Natural na ipinapakita ng ‘ngunit’ ang paghahambing sa lalaking sanggol; ang ‘babae’ ay malinaw sa konteksto bilang sanggol na babae.
- source_word: וָחָיָה
  choice: hayaan ninyo siyang mabuhay
  rationale: Sa konteksto ng utos, ipinahihiwatig ng pandiwa na hindi papatayin kundi pababayaang manatiling buhay ang batang babae.
