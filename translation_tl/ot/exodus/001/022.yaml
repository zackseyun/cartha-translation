  source_fidelity: Ang “nasasakupan” ay isang mas makitid at mas interpretibong katumbas ng לְכָל עַמּוֹ (“sa lahat ng kanyang bayan/mamamayan”), sapagkat binibigyang-diin nito ang katayuang politikal ng mga tao bilang sakop. Mas tuwiran ang “buong sambayanan niya.” Ang natitirang diwa ng utos—lahat ng sanggol na lalaki ay ihagis sa Nilo at ang mga babae ay hayaang mabuhay—ay tapat sa Hebreo.
  naturalness: Natural at marangal ang pangungusap matapos palitan ang “kanyang nasasakupan” ng “buong sambayanan niya.” Ang “anak na lalaking isisilang” at “hayaan ninyong mabuhay” ay malinaw na modernong Tagalog sa konteksto ng isang kautusan.
  terminology: Ang “Paraon,” “Ilog Nilo,” “anak na lalaki,” at “anak na babae” ay angkop. Pinananatili ng “buong sambayanan niya” ang saklaw ng “lahat ng kanyang bayan” nang hindi nagdaragdag ng kahulugang “mga sakop.”
