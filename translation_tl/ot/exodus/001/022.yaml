  text: וַ/יְצַ֣ו פַּרְעֹ֔ה לְ/כָל עַמּ֖/וֹ לֵ/אמֹ֑ר כָּל הַ/בֵּ֣ן הַ/יִּלּ֗וֹד הַ/יְאֹ֨רָ/ה֙ תַּשְׁלִיכֻ֔/הוּ וְ/כָל הַ/בַּ֖ת תְּחַיּֽוּ/ן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: tl
  text: Pagkatapos, iniutos ni Paraon sa buong sambayanan niya, “Ang bawat anak na lalaking isisilang ay itapon ninyo sa Ilog Nilo[a], ngunit[b] ang bawat anak na babae ay hayaan ninyong mabuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa ilog.” Sa Exodo, ang salitang ito ay karaniwang tumutukoy sa Ilog Nilo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at”; isinaling “ngunit” upang ipakita ang pagsalungat sa dalawang bahagi ng utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: iniutos
  rationale: Malinaw nitong ipinahahayag ang mahigpit na utos ng hari at likas ito sa makabagong Tagalog.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Ito ang nakaugaliang anyong Tagalog ng titulong Ehipsiyo.
- source_word: לְכָל עַמּוֹ
  choice: sa lahat ng kanyang nasasakupan
  rationale: Ang עַם ay ‘bayan’ o ‘mga tao’; sa konteksto ng utos ng hari, malinaw at natural na ipinakikita ng ‘mga nasasakupan’ na ang kausap ay ang mga taong nasa ilalim ng kapangyarihan ng Paraon, nang hindi nililimitahan ang utos sa mga opisyal lamang.
- source_word: לֵאמֹר
  choice: —
  rationale: Hindi na isinalin nang hiwalay ang pormulang pambanggit sapagkat sapat at mas natural sa Tagalog ang kuwit at tuwirang sipi pagkatapos ng ‘iniutos.’
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: Ang bawat anak na lalaking isisilang
  rationale: Pinananatili ng ‘anak na lalaki’ ang kahulugan ng בֵּן, at ipinahahayag ng ‘isisilang’ ang diwa ng Hebreong pasibong anyo nang hindi idinaragdag sa talata kung kaninong mga anak ang tinutukoy.
- source_word: הַיְאֹרָה
  choice: sa Ilog Nilo
  rationale: Bagaman literal na ‘sa ilog,’ ang יְאֹר sa Exodo ay karaniwang tumutukoy sa Nilo; binabanggit ang tradisyunal na pangalan upang maging malinaw sa mambabasa.
- source_word: תַּשְׁלִיכֻהוּ
  choice: ay itapon ninyo
  rationale: Naihahatid nito ang tahasang utos sa maramihang kausap at ang marahas na kilos ng paghahagis; nauunawaan na sa naunang parirala ang layon na ‘siya.’
- source_word: וְכָל הַבַּת
  choice: ngunit ang bawat anak na babae
  rationale: Literal na ‘at’ ang pangatnig, ngunit malinaw na pagsalungat ang gamit nito rito; ang ‘ngunit’ ay natural na naghahayag ng kontrast habang ang ‘anak na babae’ ay tuwirang katumbas ng בַּת.
- source_word: תְּחַיּוּן
  choice: ay hayaan ninyong mabuhay
  rationale: Ipinahahayag nito ang Piel na kahulugang ‘panatilihing buhay’ o ‘hayaang mabuhay’ at malinaw na ikinokontrast sa pagpatay sa mga anak na lalaki.
theological_decisions:
- issue: Kung tahasang tutukuyin na mga anak ng mga Hebreo o Israelita ang saklaw ng utos
  choice: Hindi idinagdag ang ‘Hebreo’ o ‘Israelita.’
  alternative: ‘Ang bawat anak na lalaking Hebreo/Israelita na isisilang’
  rationale: Hindi tahasang inuulit ng Hebreong talata ang grupong tinutukoy. Bagaman ipinahihiwatig iyon ng konteksto, pinananatili ng salin ang saklaw at tindi ng mismong pahayag nang hindi nagpapasok ng paliwanag sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘nasasakupan’ upang maging natural ang royal-command context, at pinanatili ang matalim at tuwirang anyo ng utos. Inayos ang mga panandang talababa upang tumapat ang bawat isa sa salitang ipinaliliwanag nito.
