base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: tl
  text: Ngunit ang mga anak ni Israel ay naging mabunga, naglipana,[a] dumami, at lumakas nang lubha; napuno ng mga anak ni Israel ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dumagsa”; ang pandiwang Hebreo ay naglalarawan ng mala-umaapaw na pagdami, gaya ng paglipana ng mga nilalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Ngunit ang mga anak ni Israel
  rationale: Pinananatili ng “mga anak ni Israel” ang pampamilya at pambansang pananalita ng Hebreo. Ang “ngunit” ay likas na naghahayag ng pagsalungat sa pagkamatay ng naunang salinlahi sa talatang 6, bagaman maaari ring payak na “at” ang pang-ugnay.
- source_word: פָּרוּ
  choice: naging mabunga
  rationale: Pinananatili nito ang larawan ng pagkamabunga at ang posibleng alingawngaw ng wika ng pagpapala sa Genesis, nang hindi nagdaragdag ng paliwanag sa teksto.
- source_word: וַיִּשְׁרְצוּ
  choice: dumami nang napakabilis
  rationale: Ang pandiwa ay naglalarawan ng saganang pagdami na gaya ng pagdagsa o pagdami ng mga nilalang. Mas natural ito sa makabagong Tagalog kaysa literal na “nagkumpol-kumpol” o “naglipana,” habang nilalagyan ng talababa ang matinding larawan.
- source_word: וַיִּרְבּוּ
  choice: naging napakarami
  rationale: Malinaw at natural na ipinapahayag ang pagiging marami, at iniiwasang pag-isahin ito sa naunang mas makulay na pandiwa.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: lubhang lumakas
  rationale: Ang עצם ay pangunahing tumutukoy sa paglakas o pagiging makapangyarihan. Ang “lubhang” ay naghahatid ng matinding pag-uulit ng מְאֹד, habang hindi nililimitahan ang diwa sa dami lamang.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: kaya napuno nila ang lupain
  rationale: Natural na Tagalog na naghahayag ng bunga ng kanilang pagdami. Ang “lupain” ay tumutukoy sa teritoryong tinitirhan nila, hindi sa buong daigdig; bagaman passive ang anyong Hebreo, pareho ang pangunahing diwa ng aktibong salin.
theological_decisions:
- issue: Posibleng alingawngaw ng wika ng paglikha at pagpapala sa Genesis
  choice: Panatilihin ang sunod-sunod na “naging mabunga” at “naging napakarami” nang walang tahasang paliwanag sa pangunahing teksto.
  alternative: Gumamit ng mas mapagpaliwanag na pananalita upang idiin ang kaugnayan sa pagpapala sa Genesis.
  rationale: Maaaring sadyang umalingawngaw rito ang naunang wika ng pagpapala, ngunit dapat ihatid iyon sa pamamagitan ng pagpili ng mga salita at hindi sa pagdaragdag ng pahayag na wala sa Hebreo.
- issue: Saklaw ng paglakas ng Israel
  choice: “lubhang lumakas”
  alternative: “lubhang dumami at naging makapangyarihan”
  rationale: Pinananatili ng salin ang pangunahing diwa ng עצם at ang posibilidad na ang lakas ay kinabibilangan, ngunit hindi lamang tumutukoy, sa kanilang dami.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang makalumang-biblikal na “mga anak ni Israel” dahil mahalaga ang pambansa at pampamilyang pahayag, ngunit ginawang natural ang mga pandiwa sa karaniwang mambabasa.
