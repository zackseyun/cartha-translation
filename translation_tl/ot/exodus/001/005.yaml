  source_fidelity: Tumpak ang bilang na pitumpu at ang pahiwatig na naroon na si Jose sa Ehipto. Gayunman, ang pangunahing teksto ay mas malinaw kung gagawing tahasang tumutukoy ang pariralang Hebreo sa mga taong “lumabas” mula kay Jacob, habang pinananatili ang literal na larawan sa pamamagitan ng talababa.
