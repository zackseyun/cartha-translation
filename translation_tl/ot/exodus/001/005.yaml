  terminology: Ang “balakang” ay katanggap-tanggap na literal na katumbas ng Hebreong yarek sa idyomang ito, basta ipaliwanag sa talababa na tumutukoy ito sa mga tuwirang inapo. Ang “Ehipto,” “Jose,” at “pitumpu” ay wasto at angkop sa rehistro.
