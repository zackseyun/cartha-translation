  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: tl
  text: Ang lahat ng taong lumabas mula sa balakang ni Jacob ay pitumpu[a], at si Jose ay nasa Ehipto na.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga taong lumabas mula sa balakang ni Jacob.” Isa itong idyoma para sa mga tuwiran niyang inapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang payak na pangungusap kaysa sa literal at mabigat na “at nangyari na.”
- source_word: כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  choice: ang lahat ng taong ... ay pitumpu
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa mga indibidwal na tao, hindi sa “kaluluwa” bilang teknikal na konsepto. Nananatili ang kabuuang puwersa ng כָּל at ang bilang na pitumpu.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: nagmula sa balakang ni Jacob
  rationale: Pinananatili ang kongkretong idyomang Hebreo tungkol sa mga tuwirang pisikal na inapo ni Jacob. Ang “balakang” ang malinaw at dignified na katumbas ng יֶרֶךְ, samantalang ipinapaliwanag sa talababa ang idyoma.
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: at si Jose ay nasa Ehipto na
  rationale: Pinananatili bilang hiwalay na karagdagang pahayag ang payak na pang-ugnay. Ipinahihiwatig ng “na” na naroon na si Jose bago ang pagdating ng sambahayan ni Jacob.
