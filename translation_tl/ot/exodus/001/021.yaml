base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: tl
  text: At dahil may takot sa Diyos ang mga komadrona, nagtayo siya para sa kanila ng mga sambahayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “gumawa siya para sa kanila ng mga bahay.” Maaaring tumukoy ang Hebreo sa pagtatatag ng mga sambahayan o pamilya, sa halip na sa pagpapatayo ng mga pisikal na bahay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: At dahil
  rationale: Likas na ipinahahayag sa Tagalog ang ugnayang sanhi at bunga sa konteksto, nang hindi mekanikal na isinasalin ang idyomang Hebreo.
- source_word: יָרְאוּ
  choice: may takot
  rationale: Pinananatili ang biblikal na diwa ng pagkatakot sa Diyos, na maaaring saklawin ang pagpipitagan at pagsunod.
- source_word: הַמְיַלְּדֹת
  choice: ang mga komadrona
  rationale: Karaniwan at malinaw na modernong katawagan sa mga babaeng tumutulong sa panganganak.
- source_word: הָאֱלֹהִים
  choice: sa Diyos
  rationale: Ang tiyak na katawagang Hebreo ay natural na isinasalin bilang Diyos sa Tagalog.
- source_word: וַיַּעַשׂ
  choice: binigyan niya
  rationale: Sa idyomang ito, ipinahahayag ng עשה ang pagkakaloob o pagtatatag; mas natural sa Tagalog ang 'binigyan' kaysa literal na 'ginawan.'
- source_word: לָהֶם
  choice: sila
  rationale: Bagaman panlalaking maramihan ang hulapi sa Hebreo, malinaw na tumutukoy ito sa mga komadrona; hindi minamarkahan ng Tagalog ang kasarian ng panghalip.
- source_word: בָּתִּים
  choice: sariling mga sambahayan
  rationale: Pinananatili ang metapora ng 'bahay' habang ipinahahayag ang malamang na kahulugang mga pamilya o sambahayang itinatag para sa kanila.
theological_decisions:
- issue: Kahulugan ng וַיַּעַשׂ לָהֶם בָּתִּים
  choice: Pinagkalooban ng Diyos ang mga komadrona ng sarili nilang mga sambahayan o pamilya.
  alternative: Literal na ginawan sila ng Diyos ng mga bahay.
  rationale: Maaaring tumukoy ang Hebreong 'gumawa ng mga bahay' sa pagtatatag ng sambahayan o angkan. Ang konteksto ay nagpapahiwatig ng pagpapala ng Diyos, ngunit inilalagay sa talababa ang literal na posibilidad upang hindi alisin ang tunay na saklaw ng pahayag.
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang 'komadrona,' na malawak na nauunawaan, at ang pariralang 'may takot sa Diyos' upang mapanatili ang tradisyonal na biblikal na bigat nang hindi maging lipas ang pananalita.
