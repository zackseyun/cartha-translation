  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: tl
  text: Pagkatapos, sinabi ng hari ng Ehipto sa mga komadronang Hebreo[a], na ang pangalan ng isa ay Shifra at ang pangalan ng ikalawa ay Pua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa mga komadrona ng mga Hebreo.” Maaaring mangahulugan ang pariralang Hebreo na ang mga komadrona ay mga Hebreo, o na naglilingkod sila sa mga babaeng Hebreo.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi” nang hindi nawawala ang puwersang naratibo.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ang hari ng Ehipto
  rationale: Tuwirang ipinapahayag ang construct phrase at hindi ipinapasok ang titulong “Paraon,” na wala sa talata.
- source_word: לַמְיַלְּדֹת
  choice: sa mga komadrona
  rationale: Ang participle mula sa ילד ay tumutukoy sa mga babaeng tumutulong sa panganganak; “komadrona” ang malinaw at karaniwang katumbas sa Filipino.
- source_word: הָעִבְרִיֹּת
  choice: Hebreo
  rationale: Pinananatili sa pangunahing teksto ang natural na attributive na pagbasa, “mga komadronang Hebreo,” habang inilalahad sa talababa ang tunay na sintaktikong kalabuan.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: na ang pangalan ng isa ay ... at ang pangalan ng ikalawa ay ...
  rationale: Pinananatili ang distributibong anyong “ang isa ... ang ikalawa” at ang pagbanggit sa pangalan, sa malinaw at dignidad na Tagalog.
- source_word: שִׁפְרָה
  choice: Shifra
  rationale: Transliterasyon ng pangalang Hebreo ayon sa bigkas at ortograpiyang madaling basahin sa Filipino.
- source_word: פּוּעָה
  choice: Pua
  rationale: Tuwirang transliterasyon sa anyong natural basahin sa Filipino.
