  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: tl
  text: At malupit[b] na pinagtrabaho ng mga Ehipsiyo ang mga anak ni Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Ang “mga anak ni Israel” ay tumutukoy sa buong bayang nagmula kay Israel, hindi lamang sa mga bata.
    reason: lexical_alternative
  - marker: b
    text: O “nang walang awa” o “nang may matinding kalupitan.” Ang salitang Hebreo ay tumutukoy sa malupit at mapaniil na paraan ng sapilitang paggawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: pinagtrabaho
  rationale: Ang Hiphil ng עבד ay causative, “pinaglingkod/pinagtrabaho.” Sa konteksto ng sapilitang paggawa, likas at malinaw sa modernong Tagalog ang “pinagtrabaho,” nang hindi inilalagay sa mismong pandiwa ang mas interpretibong “inalipin.”
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Bagaman maaaring tumukoy ang anyo sa lupain o bayan ng Ehipto, ang mga Ehipsiyo bilang pangkat ang likas na simuno ng kilos sa konteksto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilya at panlahing anyo ng Hebreo at ang kaugnayan kay Israel bilang ninuno, habang natural pa rin sa Tagalog. Maaari ring sabihing “mga Israelita.”
- source_word: בְּפָרֶךְ
  choice: malupit na
  rationale: Ipinahahayag ng פָרֶךְ ang malupit, mabigat, at walang-awang paraan ng sapilitang paggawa. Ang “malupit na pinagtrabaho” ay natural na Tagalog at pinananatili ang pagganap nito bilang paglalarawan sa paraan ng pagkilos.
theological_decisions:
- issue: Paglilipat ng kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang pangunahing salin ay nagpapanatili sa genealogical at kolektibong larawan ng Hebreo. Hindi ito tumutukoy lamang sa mga menor de edad kundi sa buong bayang nagmula kay Israel; nililinaw ito sa talababa nang hindi pinapawi ang anyo ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “pinagtrabaho” sa halip na mas makalumang “pinaglingkod,” at pinanatili ang “mga anak ni Israel” upang maipakita ang kolektibo at genealogical na anyo ng Hebreo.
