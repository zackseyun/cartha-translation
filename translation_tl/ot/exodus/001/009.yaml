  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: tl
  text: At sinabi niya sa kanyang bayan, “Tingnan ninyo, ang bayan ng mga anak ni Israel ay mas marami at mas makapangyarihan kaysa sa atin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Karaniwang salaysay na katumbas ng wayyiqtol ng אמר; ipinagpapatuloy nito ang daloy ng kuwento nang hindi dinaragdagan ang tiyak na ugnayang temporal.
- source_word: אֶל עַמּוֹ
  choice: sa kanyang bayan
  rationale: Ang עַם ay tumutukoy sa isang kolektibong sambayanan; natural at marangal sa Filipino ang “kanyang bayan” sa konteksto ng Faraon at ng mga sakop niya.
- source_word: הִנֵּה
  choice: Tingnan ninyo
  rationale: Pantawag-pansin ang הִנֵּה. Ang maramihang anyo ay likas sa Filipino dahil isang kolektibong bayan ang kinakausap.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: ang bayan ng mga anak ni Israel
  rationale: Pinananatili ang estruktura at pampamilyang katawagan ng Hebreo, sa halip na payakan bilang “mga Israelita.”
- source_word: רַב
  choice: mas marami
  rationale: Ipinahahayag ang pahambing na diwa na tinutukoy ng מִמֶּנּוּ at ang paglaki ng bilang ng Israel.
- source_word: וְעָצוּם
  choice: at mas makapangyarihan
  rationale: Ang עָצוּם ay maaaring tumukoy sa lakas, kapangyarihan, o pagiging makapangyarihan; ang salin ay nagpapanatili sa pahambing na diwa at hindi lamang sa pisikal na lakas.
- source_word: מִמֶּנּוּ
  choice: kaysa sa atin
  rationale: 'Ang מן na may hulaping unang panauhang maramihan ay naghuhudyat ng paghahambing: “kaysa sa atin.”'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang literal na katawagang “bayan ng mga anak ni Israel” dahil natural pa rin ito sa Tagalog at mahalaga ang anyong pampamilya ng Hebreo. Walang talababa dahil hindi kailangan ng leksikal na alternatibo upang maunawaan ang talata.
