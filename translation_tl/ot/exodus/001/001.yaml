translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “sambahayan” para sa yunit ng pamilya at mga kasamang nasa ilalim ng isang tahanan; pinanatili ang “mga anak na lalaki” dahil iyon ang tiyak na tinutukoy ng Hebreo.
