  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: tl
  text: Ito ang mga pangalan ng mga anak na lalaki ni Israel na pumunta sa Ehipto kasama ni Jacob[a], bawat lalaki kasama ang kaniyang sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At ito ang mga pangalan.” Nagsisimula ang Hebreo sa isang pangatnig na nag-uugnay sa Exodo sa naunang salaysay sa Genesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Ito ang
  rationale: Likas na pambungad sa modernong Tagalog para sa demonstratibong parirala. Hindi tahasang isinalin ang וְ bilang “At” sa pangunahing teksto upang maging natural, ngunit itinabi sa talababa ang ugnay nito sa naunang salaysay.
- source_word: שְׁמוֹת
  choice: mga pangalan
  rationale: Tuwirang katumbas at pinananatili ang tematikong kaugnayan sa Hebreong pamagat ng aklat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  rationale: Tiyak na ipinahahayag ang panlalaking anyo ng Hebreo at iniiwasang gawing mas malawak na “mga anak” o “mga inapo.”
- source_word: הַבָּאִים
  choice: na pumunta
  rationale: Bagaman participle ang anyo sa Hebreo, tumutukoy ito rito sa makasaysayang pagpunta ng pangkat; natural ang sugnay na ito sa Tagalog.
- source_word: מִצְרָיְמָה
  choice: sa Ehipto
  rationale: Ang directional ending ay nagpapahiwatig ng pagkilos patungo sa Ehipto; sapat at idiomatiko sa Tagalog ang “pumunta sa Ehipto.”
- source_word: אֵת יַעֲקֹב
  choice: kasama ni Jacob
  rationale: Ang אֵת ay pananda ng pagsama rito, hindi ng tuwirang layon.
- source_word: אִישׁ וּ/בֵית/וֹ
  choice: bawat isa kasama ang kaniyang sambahayan
  rationale: Ang isahang אִישׁ ay distributibo, at ang בַּיִת ay tumutukoy sa buong sambahayan, hindi lamang sa gusaling bahay.
- source_word: בָּאוּ
  choice: ipinahihiwatig sa “na pumunta”
  rationale: Ang hulíng pandiwa sa Hebreo ay bumabalik at kumukumpleto sa naunang participial na parirala. Hindi ito inulit sa Tagalog sapagkat magiging mabigat at di-likas, samantalang buo na ang diwa sa “na pumunta.”
