id: EXO.1.12
reference: Exodus 1:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: tl
  text: Ngunit habang lalo nila silang pinahihirapan, lalo silang dumarami at lumalaganap; at nangilabot sila[a] dahil sa mga Israelita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nasuklam sila” o “natakot sila.” Maaaring magpahayag ang pandiwang Hebreo ng matinding pangamba o pagkasuklam.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga anak ni Israel.” Tumutukoy ito sa mga Israelita, ang bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: habang lalo ... lalo naman ... at lalo
  rationale: 'Ipinahahayag ng magkakaugnay na parirala ang proporsiyonal na ugnayan: habang tumitindi ang pang-aapi, lalo namang dumarami at lumalaganap ang Israel.'
- source_word: יְעַנּוּ
  choice: pinahihirapan
  rationale: Ang Piel ng ענה ay tumutukoy sa pagpapahirap o pang-aapi; natural at malinaw sa modernong Tagalog ang “pinahihirapan.”
- source_word: אֹתוֹ
  choice: silang
  rationale: Bagaman isahan sa Hebreo, kolektibong tumutukoy ang panghalip sa Israel bilang isang bayan; ang maramihang anyo ang likas sa Tagalog.
- source_word: יִרְבֶּה
  choice: dumarami
  rationale: Tumutukoy sa paglaki ng bilang ng kolektibong Israel.
- source_word: יִפְרֹץ
  choice: lumalaganap
  rationale: Ipinahihiwatig ng פרץ ang mabilis na paglawak o pagkalat; ang “lumalaganap” ay malinaw at hindi labis na nagpapakahulugan.
- source_word: וַיָּקֻצוּ
  choice: labis na nangilabot
  rationale: Maaaring magpahayag ang קוץ ng matinding pangamba o pagkasuklam. Pinananatili ng “nangilabot” ang saklaw ng matinding takot at pag-ayaw nang hindi ganap na nilulutas ang ambiguwidad.
- source_word: מִפְּנֵי
  choice: sa
  rationale: Sa kaugnayan ng pandiwang קוץ, ipinakikita nito ang dahilan o bagay ng kanilang matinding reaksiyon.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at isa ring likas at kinikilalang ekspresyon sa Tagalog para sa bayang nagmula kay Israel.
theological_decisions:
- issue: Kolektibong pagkakakilanlan ng Israel
  choice: silang ... mga anak ni Israel
  alternative: siya ... mga Israelita
  rationale: Pinananatili ang kolektibong diwa ng isahang Hebreo sa natural na maramihang Tagalog, habang iniiwasang gawing indibidwal ang tinutukoy.
- issue: Saklaw ng kahulugan ng וַיָּקֻצוּ
  choice: labis na nangilabot
  alternative: nasuklam
  rationale: May saklaw ang pandiwa mula sa matinding pangamba hanggang pagkasuklam. Ang pangunahing teksto ay gumagamit ng salitang maaaring magpahiwatig ng kapwa takot at pag-ayaw, at inilalahad sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga anak ni Israel” upang mapanatili ang Hebreong idyoma, at “nangilabot” upang huwag patahimikin ang ambiguwidad sa pagitan ng matinding takot at pagkasuklam.
