source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh kay Moises, at sinabi niya, “Hindi ba si Aaron, kapatid mo, ang Levita? Alam kong mahusay siyang magsalita.[a] At heto, lumalabas na siya upang salubungin ka. Kapag nakita ka niya, magagalak siya sa kanyang puso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “matatas siyang magsalita” o, mas literal, “sa pagsasalita ay magsasalita siya.”
    reason: Ipinakikita ang mga posibleng pagbasa sa Hebreong infinitive absolute na sinusundan ng finite verb, nang hindi ikinukubli ang diin at bahagyang kalabuan nito.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang Hebreong metapora ng galit na nag-aalab, at likas pa rin itong pakinggan sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng pangalan na “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הֲלֹא
  choice: Hindi ba naroon
  rationale: Isinasalin ito bilang retorikal na tanong na umaasang sasang-ayon ang kausap; ang “naroon” ay naghaharap kay Aaron bilang tugon sa pagtutol ni Moises.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Karaniwang katawagan ito sa isang kabilang sa lipi ni Levi at hindi nito ipinapalagay na kultikong tungkulin na hindi tahasang sinasabi rito.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Alam kong mahusay siyang magsalita
  rationale: Ipinahahayag nito sa natural na Tagalog ang diin ng infinitive absolute at finite verb sa konteksto ng kakayahan ni Aaron sa pagsasalita, habang itinatala sa talababa ang mas literal na anyo at posibleng alternatibo.
- source_word: וְגַם הִנֵּה
  choice: At tingnan mo
  rationale: Pinananatili ng “at” ang pagdaragdag at ng “tingnan mo” ang pantawag-pansing lakas ng הִנֵּה sa kasalukuyan at madaling maunawaang Tagalog.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: papalabas na siya upang salubungin ka
  rationale: Ipinahihiwatig ng anyong participle ang nagaganap o nalalapit na kilos; inilalarawan ng “papalabas na” ang pag-alis ni Aaron upang makipagtagpo kay Moises.
- source_word: וְרָאֲךָ
  choice: Kapag nakita ka niya
  rationale: Natural na ipinakikita ng sugnay na temporal ang pangyayaring hahantong sa kagalakan ni Aaron.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: magagalak ang kanyang puso
  rationale: Pinananatili nito ang tahasang pagtukoy sa puso bilang kaloob-loobang damdamin at ang lakas ng pandiwang nangangahulugang magalak.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Lakas ng pariralang דַבֵּר יְדַבֵּר
  choice: mahusay siyang magsalita
  alternative: talagang magsasalita siya; matatas siyang magsalita; literal, “sa pagsasalita ay magsasalita siya”
  rationale: Maaaring markahan ng konstruksyon ang diin o matibay na kakayahang magsalita. Sa konteksto ng pag-aatubili ni Moises, likas ang pagbasa tungkol sa kakayahan ni Aaron, ngunit pinananatili sa talababa ang tunay na saklaw ng parirala.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino Tagalog. Pinanatili ang metapora ng nag-aalab na galit at ang salitang “puso,” samantalang ginawang natural ang retorikal na tanong at daloy ng pagsasalaysay. Inilagay ang marker [a] sa pariralang talagang tinatalakay ng talababa.
