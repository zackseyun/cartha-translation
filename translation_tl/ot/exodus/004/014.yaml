revisions:
- from: Kaya nag-alab ang galit ni Yahweh kay Moises, at sinabi niya, “Hindi ba naroon ang kapatid mong si Aaron, ang Levita? Alam kong mahusay siyang magsalita.[a] At tingnan mo, papalabas na siya upang salubungin ka. Kapag nakita ka niya, magagalak ang kanyang puso.”
  to: Kaya nag-alab ang galit ni Yahweh kay Moises, at sinabi niya, “Hindi ba si Aaron, kapatid mo, ang Levita? Alam kong mahusay siyang magsalita.[a] At heto, lumalabas na siya upang salubungin ka. Kapag nakita ka niya, magagalak siya sa kanyang puso.”
  rationale: Inayos ang retorikal na tanong upang alisin ang idinagdag na ideya ng lokasyon at upang sundin ang appositional na ayos ng Hebreo. Pinalitan ang “tingnan mo” ng “At heto” upang mas tuwirang katawanin ang הִנֵּה, at ibinalik si Aaron bilang paksa ng huling sugnay habang pinananatili ang tahasang “puso.” Walang pagbabagong doktrinal o pagpapakahulugang sektaryan ang ginawa.
