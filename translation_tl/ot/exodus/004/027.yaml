base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: tl
  text: Sinabi ni Yahweh kay Aaron, “Pumunta ka sa ilang upang salubungin si Moises.” Kaya pumunta siya at nakipagkita kay Moises sa bundok ng Diyos, at hinalikan niya si Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לֵךְ
  choice: Pumunta ka
  rationale: Likas at tuwirang salin ng pautos na anyo ng הלך sa makabagong Tagalog.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag ng לִקְרַאת ang sadyang pagpunta upang makatagpo ang isang paparating; ang “salubungin” ay natural sa konteksto.
- source_word: הַמִּדְבָּרָה
  choice: sa ilang
  rationale: Ang hulaping direksiyonal ay nagpapahiwatig ng pagpunta tungo sa ilang. Sa Tagalog, sapat na ipinahihiwatig ng “Pumunta ka sa ilang” ang direksiyon nang hindi nagiging alanganin.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: nakipagkita kay Moises
  rationale: Ang פגשׁ ay nangangahulugang makatagpo o makipagkita. Inulit ang pangalang Moises upang malinaw ang tinutukoy ng mga panghalip sa Tagalog.
- source_word: בְּהַר הָאֱלֹהִים
  choice: sa bundok ng Diyos
  rationale: Malapit na salin ng pariralang konstruktong Hebreo at hindi pinipilit kung ang pagtatagpo ay nasa mismong bundok o sa pook nito.
- source_word: וַיִּשַּׁק לוֹ
  choice: hinalikan niya ito
  rationale: Tuwirang isinasalin ang kilos na “humalik”; hindi idinagdag sa teksto ang paliwanag na ito ay pagbati.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili nito ang personal na pangalang nasa tekstong Hebreo at iniiwasang palitan iyon ng titulo.
- issue: Kahulugan ng הַמִּדְבָּרָה kaugnay ng utos
  choice: “Pumunta ka sa ilang upang salubungin si Moises”
  alternative: “Pumunta ka upang salubungin si Moises sa ilang”
  rationale: Ang hulaping direksiyonal ay likas na nagpapakita ng pagkilos tungo sa ilang. Gayunman, hindi nito binabago ang pangunahing diwa na doon magtatagpo sina Aaron at Moises.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ilang” bilang karaniwang katawagang biblikal sa wilderness; iniwasan ang mas paliwanag na “disyerto” sapagkat hindi iyon laging eksaktong katumbas ng מִדְבָּר. Nilinaw ang reperensiya ng panghalip sa ikalawang pangungusap upang maging natural sa Tagalog.
