  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: tl
  text: Siya ang magsasalita para sa iyo sa mga tao, at siya ang magiging bibig mo[a]. Ikaw naman ay magiging Diyos sa kanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magiging bibig siya para sa iyo”—ibig sabihin, si Aaron ang magiging tagapagsalita ni Moises.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “magiging parang Diyos ka sa kanya.” Tinutukoy nito ang bigay-Diyos na tungkulin ni Moises na maghatid ng mga salita at tagubilin kay Aaron.
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר הוּא לְךָ אֶל הָעָם
  choice: Siya ang magsasalita sa mga tao para sa iyo
  rationale: Ang piel na וְדִבֶּר ay karaniwang nangangahulugang “magsasalita.” Sa konteksto, ang לְךָ ay nagpapahayag na magsasalita si Aaron para kay Moises o bilang kinatawan niya.
- source_word: וְהָיָה הוּא יִהְיֶה לְּךָ לְפֶה
  choice: siya ang magiging bibig mo
  rationale: Pinananatili ng “bibig” ang matingkad na metapora ng Hebreo habang likas na ipinahihiwatig sa Filipino na si Aaron ang magiging tagapagsalita ni Moises.
- source_word: וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים
  choice: Ikaw naman ay magiging parang Diyos sa kanya
  rationale: Ipinahahayag nito ang tungkulin ni Moises bilang tagatanggap at tagapaghatid ng salita ng Diyos kay Aaron. Ang “parang” ay nililinaw na tungkulin at paghahambing ang tinutukoy, hindi na si Moises ay Diyos sa likas na pagkatao.
theological_decisions:
- issue: Kung ang לֵאלֹהִים ay dapat isaling tuwirang “Diyos” o bilang paghahambing
  choice: magiging parang Diyos sa kanya
  alternative: magiging Diyos sa kanya
  rationale: Walang tahasang katumbas ng “parang” sa Hebreo, kaya lehitimo ang mas tuwirang alternatibo. Gayunman, ipinakikita ng konteksto na ang tinutukoy ay ang awtoritatibo at kinatawang tungkulin ni Moises kay Aaron; pinananatili sa talababa ang lakas at bahagyang tensiyon ng literal na anyo.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Pinanatili ang metaporang “bibig,” samantalang nilinaw sa pangunahing teksto at talababa ang malakas ngunit gumaganang paghahambing kay Moises bilang Diyos para kay Aaron.
