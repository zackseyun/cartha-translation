  source_fidelity: 'Kailangang baguhin ang pangunahing teksto mula sa “mga ninuno” tungo sa “mga ama.” Ang אֲבֹתָם ay literal na “kanilang mga ama,” at ang tahasang pagbanggit kina Abraham, Isaac, at Jacob ay hindi nagbibigay ng sapat na dahilan upang i-neutralize ang panlalaking terminong ito sa pangunahing salin. Tumpak ang ibang bahagi: layunin ng לְמַעַן, nilalaman ng כִּי, at “nagpakita sa iyo” para sa נִרְאָה אֵלֶיךָ.'
  naturalness: Natural at marangal ang ayos na “upang maniwala sila na nagpakita sa iyo si Yahweh.” Ang “ang Diyos ng kanilang mga ama” ay likas din sa biblikal ngunit naiintindihang modernong Filipino Tagalog.
  terminology: Ang “Yahweh” ay naaayon sa itinakdang pag-render ng יהוה. Napananatili rin ang inuulit na “ang Diyos ni” para sa tatlong patriyarka. Inayos ang mga talababa upang ang tala b ay tunay na alternatibong pagbasa ng tekstong binago, at upang hindi ilista ng tala a ang “Yahweh” bilang alternatibo sa sarili nitong pangunahing anyo.
