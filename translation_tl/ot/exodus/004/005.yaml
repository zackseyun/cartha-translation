  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: tl
  text: upang maniwala sila na nagpakita sa iyo si Yahweh[a], ang Diyos ng kanilang mga ama[b], ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH”; ayon sa tradisyon ay isinasaling “ang PANGINOON.” Maaari rin itong baybayin bilang “Jehova.”'
    reason: alternative_reading
  - marker: b
    text: 'O: “kanilang mga ninuno.” Mas literal na sinasabi ng Hebreo: “kanilang mga ama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at malinaw na nagpapakilala ng layunin sa modernong Tagalog.
- source_word: יַאֲמִינוּ
  choice: maniwala sila
  rationale: Sa konteksto, tumutukoy ito sa pagtanggap nila bilang totoo sa pahayag ni Moises na nagpakita sa kanya ang Diyos.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng paniniwala, hindi ang dahilan nito.
- source_word: נִרְאָה אֵלֶיךָ
  choice: nagpakita sa iyo
  rationale: Ang Niphal ng ראה ay may diwang ‘magpakita’ o ‘makita’; ang karaniwang aspektong Tagalog na ‘nagpakita’ ay angkop sa natapos na pagpapakita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Ang ‘mga ninuno’ ang pinakanatural na Tagalog para sa mga naunang salinlahing tinutukoy ng idiomang ito; inilalahad sa talababa ang mas literal na ‘mga ama.’
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob
  rationale: Pinananatili ang pag-uulit ng ‘ang Diyos ni’ upang maipakita ang diin at maringal na indayog ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang katangian nito bilang personal na pangalan habang binabanggit sa talababa ang tradisyonal at iba pang anyo.
- issue: Saklaw ng אֲבֹתָם
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Bagaman panlalaking maramihan ang anyong Hebreo, dito ay idiomatiko itong tumutukoy sa salinlahing pinagmulan ng Israel, na agad nililinaw sa pagbanggit kina Abraham, Isaac, at Jacob. Pinananatili sa talababa ang mas literal na anyo upang hindi maitago ang tekstuwal na detalye.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang likas na ayos na ‘nagpakita sa iyo si Yahweh,’ at pinanatili ang paulit-ulit na pagtukoy sa Diyos ng bawat patriyarka.
