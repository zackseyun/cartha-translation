  yaml_path: translation/ot/exodus/004/002.yaml
  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: tl
  text: Sinabi sa kanya ni Yahweh, “Ano iyang nasa kamay mo?” Sinabi niya, “Isang tungkod[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pamalo” o “patpat.” Ang Hebreong מַטֶּה ay maaaring tumukoy sa tungkod, pamalo, o patpat, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang panatilihin ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Sinabi ... Sinabi
  rationale: Ang אָמַר ang karaniwang pandiwang “magsabi.” Pinanatili ang pag-uulit sa Hebreo; malinaw naman sa daloy na tanong ang una at tugon ang ikalawa.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at natural sa makabagong Tagalog.
- source_word: מַה־זֶּה / מִזֶּה
  choice: Ano iyan
  rationale: Humihingi ang parirala ng pagkakakilanlan ng isang bagay. Ang “iyan” ay natural dahil ang tinutukoy ay nasa kamay ng kausap.
- source_word: בְּיָדֶךָ
  choice: nasa kamay mo
  rationale: Tumutukoy ito sa mismong bagay na hawak ni Moises; natural sa Tagalog ang “nasa kamay mo” kaysa sa mas mahigpit na literal na anyo.
- source_word: מַטֶּה
  choice: tungkod
  rationale: Maaaring tumukoy ang salita sa tungkod, pamalo, o patpat. Ang “tungkod” ang pinakanatural sa konteksto ng bagay na dala ni Moises, habang pinananatili sa talababa ang leksikal na lawak.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ng “Yahweh” ang personal na pangalan sa pinagmulang teksto nang hindi ito pinapalitan ng titulong “Panginoon” o nag-aangkat ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na pag-uulit ng “Sinabi” mula sa Hebreo, at ginamit ang natural na demonstratibong “iyan” para sa bagay na nasa kamay ng kausap.
