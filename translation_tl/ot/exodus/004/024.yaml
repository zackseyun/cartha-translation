  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: tl
  text: At nangyari, habang nasa daan, sa lugar na tinutuluyan sa gabi[b], na sinalubong siya[a] ni Yahweh at tinangkang patayin siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang tinutukoy sa Hebreo kung sino ang “siya.” Maaaring si Moises ang tinutukoy o, ayon sa ilang pagpapakahulugan, ang kaniyang anak.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa dakong pinagkampuhan sa gabi.” Ang salitang Hebreo ay tumutukoy sa isang lugar na tinutuluyan, hindi kinakailangang isang komersiyal na bahay-panuluyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari
  rationale: Pinananatili nito ang gamit ng Hebreong anyong pasalaysay na nagpapakilala ng isang bagong pangyayari, nang hindi gumagamit ng makalumang pananalita.
- source_word: בַדֶּרֶךְ
  choice: habang nasa daan
  rationale: Likas na salin ito ng pariralang panlunan at maaari ring magpahiwatig na nagaganap ang pangyayari sa paglalakbay.
- source_word: בַמָּלוֹן
  choice: sa dakong tinutuluyan sa gabi
  rationale: Ang מָלוֹן ay isang lugar na pinagpapahingahan o tinutuluyan sa gabi, hindi kinakailangang isang komersiyal na bahay-panuluyan.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: sinalubong siya
  rationale: Ang פגע ay nangangahulugang makatagpo o sumalubong. Ang “sinalubong” ay natural sa Filipino at hinahayaan ang kasunod na sugnay na maghayag ng banta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיְבַקֵּשׁ הֲמִיתוֹ
  choice: at tinangkang patayin
  rationale: Sa ganitong pagkakabuo, ang בקש na sinusundan ng Hiphil infinitive ng מות ay likas na naihahayag sa Filipino bilang pagsisikap o pagtatangkang patayin. Malinaw ito ngunit pinananatili ang matinding tensiyon ng salaysay.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Tinutukoy ng mga hulaping panghalip na panlalaki
  choice: Panatilihin ang hindi tahasang tinutukoy sa pamamagitan ng “siya”
  alternative: Pangalanang Moises o ang kaniyang anak
  rationale: Hindi pinangalanan sa talata kung sino ang sinalubong at tatangkaing patayin. Hindi ito dapat tahasang tukuyin sa pangunahing teksto.
- issue: Gumagawa ng pagtatangkang pumatay
  choice: Si Yahweh ang nauunawaang simuno ng parehong pandiwa
  alternative: Gawing malabo rin ang simuno ng ikalawang pandiwa
  rationale: Sa Hebreo, si Yahweh ang tahasang simuno ng וַיִּפְגְּשֵׁהוּ at nananatiling simuno ng magkasunod na וַיְבַקֵּשׁ; ang kalabuan ay nasa layon na “siya,” hindi sa gumagawa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dakong tinutuluyan sa gabi” upang maiwasan ang anakronistikong larawan ng isang modernong otel o bahay-panuluyan. Inilagay ang [a] kaagad sa “siya” upang malinaw ang saklaw ng talababa.
