  rationale: Idinagdag ang hayag na “siya” matapos ng “patayin” upang katawanin ang hulaping panghalip sa Hebreo at upang maging ganap at natural ang sugnay sa Filipino. Pinalitan ang “dakong tinutuluyan sa gabi” ng mas likas na “lugar na tinutuluyan sa gabi.” Hindi binibigyang-pangalan ang tinutukoy na lalaki, at nananatili si Yahweh bilang simuno ng parehong pandiwa.
