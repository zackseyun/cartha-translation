  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: tl
  text: At sinabi ko sa iyo, ‘Palayain mo ang anak ko upang maglingkod siya sa akin.’ Ngunit tumanggi kang palayain siya. Narito, papatayin ko ang iyong anak, ang iyong panganay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: paalisin
  rationale: Ipinahahayag ang causative na utos na palayain o payagang umalis ang Israel; pinananatili rin ito sa ikalawang paglitaw para sa pagkakaugnay ng talata.
- source_word: וְיַעַבְדֵנִי
  choice: upang maglingkod siya sa akin
  rationale: Ang עבד ay maaaring tumukoy sa paglilingkod at pagsamba; ang ‘maglingkod’ ay nagpapanatili sa lawak ng kahulugan nang hindi nililimitahan sa isang gawaing panrelihiyon lamang.
- source_word: הִנֵּה
  choice: Kaya ngayo’y
  rationale: Sa kontekstong ito, ipinakikilala nito nang mariin ang kasunod na kapahayagan bilang bunga ng pagtanggi; natural itong Tagalog habang pinananatili ang diin.
- source_word: הֹרֵג
  choice: papatayin ko
  rationale: Ang participle kasama ng אָנֹכִי ay nagpapahayag ng nalalapit at tiyak na kilos; ang payak na hinaharap sa Tagalog ay natural at tuwiran.
- source_word: בְּכֹרֶךָ
  choice: ang iyong panganay
  rationale: Tahasang katumbas ng ‘iyong panganay’ at pinananatili ang appositional na paglilinaw sa ‘iyong anak.’
theological_decisions:
- issue: Saklaw ng ‘maglingkod’ (עבד)
  choice: maglingkod siya sa akin
  alternative: sumamba siya sa akin
  rationale: Hindi nililimitahan ng salin ang salita sa pagsamba lamang; napapaloob sa ‘maglingkod’ ang tipang paglilingkod na maaaring kabilang ang pagsamba.
- issue: Lakas ng pahayag na הִנֵּה אָנֹכִי הֹרֵג
  choice: Kaya ngayo’y papatayin ko
  alternative: Narito, papatayin ko / papatayin ko na
  rationale: Pinananatili ang agarang babala at malinaw na ugnayang bunga ng pagtanggi, nang hindi nagdaragdag ng paliwanag tungkol sa paraan o eksaktong oras.
translation_notes:
  register: Makabago, tuwiran, at marangal na Filipino. Pinanatili ang pag-uulit ng ‘paalisin’ at ang matinding paghahambing sa anak ng Diyos at panganay na anak ng Faraon. Walang idinagdag na talababa sapagkat walang kailangang tekstuwal o leksikal na alternatibong ilantad sa maikling talatang ito.
