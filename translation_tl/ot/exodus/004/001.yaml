base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: tl
  text: Sumagot si Moises, “Ngunit tingnan mo, hindi sila maniniwala sa akin[a] ni makikinig sa akin, sapagkat sasabihin nila, ‘Hindi nagpakita sa iyo si Yahweh.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal na Hebreo: “hindi sila makikinig sa aking tinig”; maaari rin itong mangahulugang “hindi sila didinggin” o “hindi sila susunod sa akin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Sumagot si Moises
  rationale: Ang pinagsamang Hebreong pormula na literal na ‘sumagot at nagsabi’ ay likas na naipahahayag sa modernong Tagalog bilang ‘sumagot,’ nang hindi nawawala ang diwa ng tugon sa naunang sinabi.
- source_word: וְהֵן
  choice: Ngunit paano kung
  rationale: Sa konteksto, ipinakikilala ng particle ang pagtutol o ipinapalagay na pangyayari ni Moises. Mas natural sa Tagalog ang ‘Ngunit paano kung’ kaysa sa literal at matigas na ‘Narito,’ habang pinananatili ang pangamba sa maaaring mangyari.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: hindi sila maniwala sa akin
  rationale: Ang Hiphil ng אמן kasama ng לִי ay tumutukoy sa hindi paniniwala kay Moises o sa kaniyang pahayag; tuwiran at likas ang ‘maniwala sa akin.’
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: at hindi makinig sa sinabi ko
  rationale: Ang idyomang שׁמע בקול ay maaaring mangahulugang makinig, dinggin, o sundin. Sa kontekstong pagtanggap sa ulat ni Moises, ang ‘makinig sa sinabi ko’ ay natural at hindi labis na nagpapahiwatig ng pagsunod.
- source_word: כִּי יֹאמְרוּ
  choice: Baka sabihin nila
  rationale: Ipinapaliwanag ng כּי ang inaasahang pagtutol. Dahil inilalahad ni Moises ang isang posibleng reaksiyon, likas sa Tagalog ang ‘Baka sabihin nila,’ bagaman maaari ring isalin nang mas tuwiran na ‘sapagkat sasabihin nila.’
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: Hindi nagpakita sa iyo
  rationale: Ang Niphal ng ראה dito ay nangangahulugang ‘magpakita’ o ‘magpakita ng sarili.’ Ang aspektong ganap ay natural na naihahayag sa Tagalog na ‘hindi nagpakita.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nasa Hebreo sa pamamagitan ng kinikilalang transliterasyong ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa diwa ng שׁמע בקול
  choice: hindi makinig sa sinabi ko
  alternative: hindi sumunod sa akin
  rationale: Saklaw ng Hebreong idyoma ang pakikinig, pagdinig, at pagsunod. Sa talatang ito, ang pangunahing usapin ay kung paniniwalaan at tatanggapin ng mga Israelita ang pahayag ni Moises; ang ‘sumunod’ ay maaaring maging mas tiyak kaysa sa hinihingi ng konteksto.
- issue: Paglalathala ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang ginamit sa pinagmulang Hebreo. Pinananatili ng ‘Yahweh’ ang pagkakaiba ng personal na pangalan at ng titulong ‘Panginoon,’ nang hindi nagdaragdag ng denominasyonal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniiwasan ang lipas na ‘narito’ bilang katumbas ng וְהֵן at ang di-likas na dobleng ‘sumagot at nagsabi.’ Ang tanong at ‘baka’ ay naghahayag sa Tagalog ng ipinapalagay na pagtutol ni Moises; ibinibigay sa talababa ang mas literal na anyong panghinaharap.
