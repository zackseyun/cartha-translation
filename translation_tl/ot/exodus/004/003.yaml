  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: tl
  text: At sinabi niya, “Ihagis mo iyan sa lupa.” Kaya inihagis niya iyon sa lupa, at naging ahas iyon. Tumakas si Moises palayo rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mula sa harap nito” o “mula sa harap niya,” isang idyomang nangangahulugang lumayo mula rito o sa presensiya nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ang tiyak na temporal na diwa.
- source_word: הַשְׁלִיכֵהוּ
  choice: Ihagis mo iyan
  rationale: Likas at makabagong utos sa Tagalog; ang panghalip ay tumutukoy sa tungkod sa naunang talata.
- source_word: אַרְצָה
  choice: sa lupa
  rationale: Ang directional he ay nagpapahiwatig ng galaw patungo o pababa sa lupa; natural itong ipinapahayag sa Tagalog bilang “sa lupa.”
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Kaya inihagis niya iyon
  rationale: Ipinakikita ng “Kaya” ang agarang pagsunod sa utos habang nananatiling natural ang daloy ng salaysay.
- source_word: וַיְהִי לְנָחָשׁ
  choice: at naging ahas iyon
  rationale: Ang נָחָשׁ ay karaniwang tumutukoy sa ahas; malinaw at hindi lipas ang “ahas” sa modernong Tagalog.
- source_word: וַיָּנָס
  choice: Tumakas si Moises
  rationale: Tumpak na ipinapahayag ng “tumakas” ang puwersa ng pandiwang Hebreo na nangangahulugang lumayo dahil sa panganib.
- source_word: מִפָּנָיו
  choice: palayo rito
  rationale: Natural na Tagalog para sa idyomang literal na “mula sa harap/mukha nito”; ang hulaping panlalaki ay pinakamalamang na tumutukoy sa ahas.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ahas” sa halip na mas pampanitikang “serpiyente,” at pinanatili sa talababa ang literal na anyo at bahagyang kalabuan ng מִפָּנָיו.
