translation:
  language: tl
  text: Sinabi sa kanya ng PANGINOON, “Sino ang nagbigay ng bibig sa tao? O sino ang gumagawa sa isang tao na maging pipi, bingi, nakakakita, o bulag? Hindi ba ako, ang PANGINOON?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: nagbigay ng bibig sa tao
  rationale: Likas sa modernong Tagalog at tapat sa idyomang Hebreo na literal na ‘naglagay ng bibig sa tao,’ na tumutukoy sa pagbibigay ng kakayahang magsalita.
- source_word: אִלֵּם
  choice: pipi
  rationale: Karaniwang tuwirang katumbas ng taong hindi makapagsalita; pinananatili ang pagkakaiba nito sa ‘bingi.’
- source_word: חֵרֵשׁ
  choice: bingi
  rationale: Tuwirang katumbas ng Hebreong tumutukoy sa hindi nakaririnig.
- source_word: פִּקֵּחַ
  choice: nakakakita
  rationale: Sa pagtutumbas nito sa ‘bulag,’ ang kahulugan dito ay taong may paningin; natural ang ‘nakakakita’ at hindi nito dinaragdagan ang diwa.
- source_word: עִוֵּר
  choice: bulag
  rationale: Tuwirang katumbas ng salitang Hebreo.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong maliit na kapital upang katawanin ang banal na pangalang YHWH, alinsunod sa consultation layer.
theological_decisions:
- issue: Pagpapahayag na ang PANGINOON ang gumagawa sa tao na pipi, bingi, nakakakita, o bulag
  choice: Pinanatili ang tahasang pahayag na ‘Sino ang gumagawa... Hindi ba ako, ang PANGINOON?’
  alternative: Palambutin bilang ‘Sino ang nagpapahintulot na maging...’
  rationale: Tahasang sanhi ang ipinahahayag ng יָשׂוּם at ng retorikal na sagot sa Hebreo. Ang pagpapalit nito sa pahintulot lamang ay magpapasok ng interpretasyong wala sa teksto at mag-aalis ng teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang ‘Sinabi sa kanya’ kaysa mas lumang ‘At sinabi sa kaniya’; inalis ang panimulang ‘At’ dahil hindi ito kailangan sa natural na Tagalog, habang napapanatili ang ugnayang pasalaysay. Walang kinakailangang talababa.
