  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Sa pagbalik mo sa Ehipto, tiyakin mong gawin mo sa harap ng Paraon ang lahat ng mga kababalaghang inilagay ko sa iyong kamay.[a] Ngunit patitigasin ko ang kanyang puso,[b] at hindi niya pahihintulutang umalis ang bayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tanda” o “mga himala.” Ang salitang Hebreo ay tumutukoy sa pambihirang mga gawa na nagpapamalas ng kapangyarihan ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: O “patatatagin ko ang kanyang puso” o “gagawin kong matatag ang kanyang loob.” Maaaring mangahulugan ang pandiwang Hebreo ng pagpapalakas o pagpapatatag; dito, inilalarawan nito ang pagpapatibay sa kanya sa kanyang matigas na pagtanggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa halip na palitan ng titulong “PANGINOON.”
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Sa pagbabalik mo sa Ehipto
  rationale: Likas na temporal na parirala sa Tagalog na nagpapanatili sa diwa ng pagbalik at sa direksiyong patungo sa Ehipto.
- source_word: רְאֵה
  choice: tiyakin mong
  rationale: Ang pautos na “tingnan” ay gumaganap dito bilang mahigpit na tagubilin; natural itong ipinahahayag sa Tagalog bilang “tiyakin mong.”
- source_word: הַמֹּפְתִים
  choice: mga kababalaghan
  rationale: Saklaw nito ang pambihirang mga gawa na nagpapamalas ng kapangyarihan ng Diyos at maaari ring magsilbing mga tanda.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: inilagay ko sa iyong kamay
  rationale: Pinananatili ang konkretong larawang Hebreo ng pagkakatiwala at pagbibigay-kakayahan kay Moises.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: gawin sa harap ng Paraon
  rationale: Tuwirang ipinapahayag ang paggawa ng mga kababalaghan sa mismong presensiya ng Paraon.
- source_word: וַאֲנִי
  choice: Ngunit
  rationale: Bagaman karaniwang “at” ang pang-ugnay, malinaw dito ang paglipat at pagsalungat mula sa gagawin ni Moises tungo sa gagawin ni Yahweh.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: patitigasin ko ang kanyang puso
  rationale: Sa salaysay tungkol sa Paraon, ang causative ng חזק ay tumutukoy sa pagpapatatag sa kanyang matigas na pagtanggi; “patitigasin” ang natural at kinikilalang salin habang inilalagay sa talababa ang literal na alternatibo.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: hindi niya pahihintulutang umalis ang bayan
  rationale: Natural na Tagalog para sa pagtanggi ng Paraon na payagang lumabas ang sambayanan mula sa Ehipto.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa puso ng Paraon
  choice: patitigasin ko ang kanyang puso
  alternative: patatatagin ko ang kanyang puso / gagawin kong matatag ang kanyang loob
  rationale: Pinananatili ng pangunahing salin ang matinding pahayag tungkol sa pagkilos ng Diyos at hindi nito pinapahina o ipinapaliwanag palayo ang tensiyon sa pananagutan ng Paraon. Itinatala ng talababa ang leksikal na saklaw ng חזק.
translation_notes:
  register: 'Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang larawang “sa iyong kamay,” at ang teolohikal na tensiyon ng banal na pagpapatigas. Iniayos ang mga marker upang tumugma sa wastong salita: [a] sa “mga kababalaghan” at [b] sa “puso.”'
