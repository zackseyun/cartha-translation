  naturalness: 'Kailangan lamang ng munting ayos para maging mas likas at malinaw ang saklaw ng pautos: ang “gawin mo” ay tahasang tumutukoy kay Moises bilang gagawa ng mga kababalaghan. Inaayos din ang pangungusap sa talababa [b], na sa kasalukuyan ay medyo alanganin ang ayos.'
  terminology: 'Ang “Yahweh,” “Moises,” “Ehipto,” at “Paraon” ay angkop. Ang “mga kababalaghan” ay mahusay na salin ng מֹפְתִים, at ang “patitigasin ko ang kanyang puso” ay natural at tapat sa konteksto ng חזק. Nananatiling maayos ang mga anchor: [a] para sa mga kababalaghan at [b] para sa puso.'
