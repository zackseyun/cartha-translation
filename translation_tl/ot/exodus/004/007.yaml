translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pansin-pukaw na “narito” at ang bahagyang di-tahasang paglalarawan sa pagpapanumbalik ng kamay; ipinaliwanag sa mga talababa ang anyo ng kasuotan at ang ipinahihiwatig na normal na kalagayan.
