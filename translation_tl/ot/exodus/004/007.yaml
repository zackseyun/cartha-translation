    text: Literal na “sa iyong dibdib.” Tumutukoy ito sa tupi ng damit sa may dibdib.
    reason: cultural_note
  - marker: b
    text: Ibig sabihin, bumalik sa normal ang kanyang kamay.
    reason: lexical_alternative
