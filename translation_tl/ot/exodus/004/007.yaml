base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: tl
  text: At sinabi niya, “Ibalik mo ang iyong kamay sa tupi ng iyong damit sa may dibdib[a].” Kaya ibinalik niya ang kanyang kamay sa tupi ng kanyang damit sa may dibdib. Nang ilabas niya ito mula roon, narito, muli itong naging tulad ng kanyang laman.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa iyong dibdib.” Tumutukoy ito sa tupi ng damit sa may dibdib.
    reason: cultural_note
  - marker: b
    text: Ibig sabihin, bumalik sa normal ang kanyang kamay.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: Ibalik mo
  rationale: Ang Hiphil na pautos ng שוב ay nagpapahiwatig na ibalik ang kamay sa dating kinalalagyan. Likas at tuwiran sa modernong Tagalog ang “ibalik mo.”
- source_word: חֵיק
  choice: dibdib
  rationale: Tumutukoy ang חֵיק sa dibdib o sa tupi ng damit sa bahaging iyon. “Dibdib” ang maikli at likas na katumbas, habang inilalagay sa talababa ang kultural na detalye tungkol sa tupi ng damit.
- source_word: וַיָּשֶׁב
  choice: ibinalik niya
  rationale: Inuulit nito sa salaysay ang kilos na iniutos sa naunang pandiwa at pinananatili ang ugnayang leksikal sa “Ibalik mo.”
- source_word: וַיּוֹצִאָהּ
  choice: inilabas niya iyon
  rationale: Ang Hiphil ng יצא ay nangangahulugang ilabas ang isang bagay. Tuwiran at natural ang “inilabas niya iyon.”
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinupukaw ng particle ang pansin sa kagulat-gulat na resulta. Pinananatili ng “narito” ang mariin at marangal na himig nang hindi dinaragdagan ang kahulugan.
- source_word: שָׁבָה
  choice: nanumbalik iyon
  rationale: Ang pandiwa ay literal na nagsasaad ng pagbabalik. Ang “nanumbalik” ay angkop sa pagbabalik ng kamay sa dati nitong kalagayan ngunit hindi tahasang ipinapalit ang mas interpretibong “gumaling.”
- source_word: כִּבְשָׂרוֹ
  choice: gaya ng kanyang laman
  rationale: Pinananatili nito ang paghahambing na ipinakikita ng כ at ang karaniwang kahulugan ng בשר bilang “laman,” nang hindi tahasang ipinapasok sa pangunahing teksto ang paliwanag na normal na muli ang kamay.
