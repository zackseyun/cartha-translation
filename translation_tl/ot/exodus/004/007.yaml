revisions:
- from: At sinabi niya, “Ibalik mo ang kamay mo sa iyong dibdib[a].” Kaya ibinalik niya ang kanyang kamay sa kanyang dibdib. Nang ilabas niya iyon mula sa kanyang dibdib, narito, nanumbalik iyon na gaya ng kanyang laman.[b]
  to: At sinabi niya, “Ibalik mo ang iyong kamay sa tupi ng iyong damit sa may dibdib[a].” Kaya ibinalik niya ang kanyang kamay sa tupi ng kanyang damit sa may dibdib. Nang ilabas niya ito mula roon, narito, muli itong naging tulad ng kanyang laman.[b]
  rationale: Pinalitan ang “dibdib” sa pangunahing teksto ng paglalarawang tumutukoy sa tupi ng damit upang tumpak na maihatid ang kahulugan ng חֵיק at maiwasan ang anatomikal na maling pagbasa. Pinalinaw at ginawang mas idiomatiko ang huling sugnay, habang pinananatili ang paghahambing na “tulad ng kanyang laman” at ang pansin-pukaw na “narito.”
