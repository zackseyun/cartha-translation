  text: וַ/יְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּ֥עַשׂ הָ/אֹתֹ֖ת לְ/עֵינֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: tl
  text: Sinabi ni Aaron ang lahat ng salitang sinabi ni Yahweh kay Moises, at isinagawa niya ang mga tanda sa harap ng mga mata ng bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa paningin ng bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Sinabi
  rationale: Ang piel ng דבר ay karaniwang nangangahulugang “magsalita.” Ang “sinabi” ay likas sa salaysay at angkop kasama ng “lahat ng salita.”
- source_word: אֵת כָּל הַדְּבָרִים
  choice: ang lahat ng salita
  rationale: Pinananatili nito ang kongkretong anyo ng Hebreo sa halip na gawing mas maluwag na “ang lahat,” kahit bahagyang inuulit sa Filipino ang pandiwang “sinabi.”
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: na sinabi ni Yahweh kay Moises
  rationale: Malinaw at likas itong nagpapakitang naunang sinabi ni Yahweh kay Moises ang mensaheng ibinahagi ni Aaron.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng titulong “PANGINOON.”
- source_word: וַיַּעַשׂ
  choice: isinagawa niya
  rationale: Sa konteksto ng אֹתֹת, ipinahihiwatig ng עשה ang pagsasagawa ng mga tandang ibinigay kay Moises; malinaw ito nang hindi dinaragdagan ng salitang “mahimala.”
- source_word: הָאֹתֹת
  choice: ang mga tanda
  rationale: Pinananatili ng “mga tanda” ang saklaw ng אות at hindi tahasang idinaragdag ang “mahimala,” bagaman malinaw iyon sa konteksto.
- source_word: לְעֵינֵי הָעָם
  choice: sa harap ng mga mata ng bayan
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo; ang mas karaniwang alternatibo ay “sa paningin ng bayan.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong “lahat ng salita” at ang matingkad na “sa harap ng mga mata,” habang inilagay ang talababa sa mismong pariralang tinutukoy nito.
