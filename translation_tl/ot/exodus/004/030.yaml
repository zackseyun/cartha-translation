  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang kilos sa Hebreo: nagsalita si Aaron ng lahat ng salitang sinabi ni Yahweh kay Moises, at siya ang nagsagawa ng mga tanda sa harap ng bayan. Napananatili ang pangmaramihang “mga tanda” at ang matingkad na saklaw ng לְעֵינֵי הָעָם.'
  naturalness: Likas at malinaw ang modernong Filipino. Ang pag-uulit ng “sinabi” ay katanggap-tanggap at tumutulong na mapanatili ang kongkretong “lahat ng salita” ng pinagmulan. Ang “sa harap ng mga mata ng bayan” ay bahagyang mas literal ngunit nauunawaan at angkop sa marangal na salaysay.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה, “mga tanda” para sa אֹתֹת, at “bayan” para sa הָעָם. Walang idinagdag na interpretasyong teolohikal.
