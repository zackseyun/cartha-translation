base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: tl
  text: Pagkatapos, umalis si Moises at bumalik kay Jetro, na biyenan niya[a]. Sinabi niya rito, “Pahintulutan mo akong umalis at bumalik sa mga kapatid ko[b] na nasa Ehipto upang tingnan ko kung buháy pa sila.” Sinabi ni Jetro kay Moises, “Humayo kang payapa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa unang banggit, “Yeter” ang anyo ng pangalan sa Hebreo; sa ikalawa ay “Yitro” (Jetro). Iisang tao ang malinaw na tinutukoy.
    reason: textual_variant
  - marker: b
    text: Ang literal na salin ay “mga kapatid ko”; maaari rin itong tumukoy sa “mga kaanak ko” o “mga kababayan ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... וַיָּשָׁב
  choice: Pagkatapos, umalis ... at bumalik
  rationale: Isinusulong ng mga anyong wayyiqtol ang salaysay. Likas sa modernong Tagalog ang “Pagkatapos,” habang pinananatili ng “bumalik” ang kahulugan ng שׁוב.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Jetro
  rationale: 'Dalawang anyo ng pangalan ang nasa Hebreo: Yeter sa unang banggit at Yitro sa ikalawa. Ginamit sa teksto ang nakaugaliang anyong Tagalog na “Jetro” para sa iisang malinaw na tinutukoy, at inilagay sa talababa ang pagkakaiba.'
- source_word: חֹתְנוֹ
  choice: kanyang biyenan
  rationale: Sa konteksto, ito ang ama ng asawa ni Moises. Ang “biyenan” ang natural na tawag sa Tagalog, bagaman hindi nito tahasang tinutukoy ang kasarian; malinaw iyon mula sa konteksto.
- source_word: אֵלֲכָה נָּא וְאָשׁוּבָה
  choice: Pahintulutan mo akong bumalik
  rationale: Ipinahihiwatig ng cohortative at נָא ang magalang na pakiusap. Natural at marangal sa Tagalog ang “Pahintulutan mo akong,” at ang “bumalik” ay sumasaklaw sa pagpunta niyang muli sa Ehipto.
- source_word: אַחַי
  choice: mga kapatid ko
  rationale: Literal itong “aking mga kapatid,” ngunit maaari ring tumukoy nang mas malawak sa mga kaanak o kababayan. Pinanatili sa pangunahing teksto ang literal na anyo at itinala sa talababa ang mas malawak na diwa.
- source_word: וְאֶרְאֶה הַעוֹדָם חַיִּים
  choice: upang malaman ko kung buháy pa sila
  rationale: Literal na “upang makita ko kung buháy pa sila.” Sa Tagalog, ang “malaman” ang likas na pagpapahayag ng layuning alamin ang kanilang kalagayan, habang pinananatili ang kawalang-katiyakan ng tanong.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Humayo kang payapa
  rationale: Isang idyomatikong basbas o mapayapang pagpapaalam. Ang “Humayo kang payapa” ay marangal, malinaw, at malapit sa anyo ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Jetro,” “Ehipto,” at “Moises” ayon sa karaniwang anyong Tagalog. Nilagyan ng tuldik ang “buháy” upang maiwasan ang maling pagbasa. Pinanatili ang magalang na pakiusap at ang idyomatikong basbas sa hulihan.
