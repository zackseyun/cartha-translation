  to: Pagkatapos, umalis si Moises at bumalik kay Jetro, na biyenan niya[a]. Sinabi niya rito, “Pahintulutan mo akong umalis at bumalik sa mga kapatid ko[b] na nasa Ehipto upang tingnan ko kung buháy pa sila.” Sinabi ni Jetro kay Moises, “Humayo kang payapa.”
  rationale: Inayos ang pakiusap ni Moises upang maipahayag ang dalawang cohortative na pandiwa—pag-alis at pagbabalik—at pinalitan ang interpretatibong “malaman ko” ng mas tuwirang “tingnan ko.” Pinanatili ang lahat ng kawalang-katiyakan, ang magalang na himig, ang tradisyonal na mga pangalan, at ang mga talababa sa kanilang wastong angkla.
