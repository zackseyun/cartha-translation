base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay at kapitan mo ang buntot nito[a].” Kaya iniunat niya ang kanyang kamay at kinapitan ito, at ito’y naging tungkod[b] sa kanyang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kapitan mo ito sa buntot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “baras.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos ayon sa Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: שְׁלַח יָדְךָ
  choice: Iunat mo ang iyong kamay
  rationale: Tuwirang inilalarawan nito ang ipinag-uutos na pagkilos at natural itong pakinggan sa makabagong Tagalog.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: hawakan mo ang buntot nito
  rationale: Ang אָחַז ay nangangahulugang humawak o kumapit; ang parirala ay malinaw at natural, samantalang pinananatili sa talababa ang posibleng diin ng pang-ukol sa paghawak dito sa buntot.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: mahigpit niya itong hinawakan
  rationale: Ang anyo ng חזק dito ay nagpapahiwatig ng matatag o mahigpit na paghawak, kaya naiiba nang bahagya sa naunang utos na אָחַז.
- source_word: וַיְהִי לְמַטֶּה
  choice: naging tungkod ito
  rationale: Sa konteksto ng pagbabago ng ahas, ang היה ay ‘naging,’ at ang מַטֶּה ay natural na ‘tungkod,’ bagaman maaari ring tumukoy sa isang baras.
- source_word: בְּכַפּוֹ
  choice: sa kanyang kamay
  rationale: Bagaman ang כַּף ay maaaring tumukoy nang mas tiyak sa palad, ‘sa kanyang kamay’ ang natural na katumbas sa Tagalog sa kontekstong ito.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulong ‘Panginoon.’
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang payak na pagkakasunod-sunod ng utos, pagsunod, at pagbabago, at ginamit ang ‘mahigpit na hinawakan’ upang maipakita ang lakas ng חזק.
