  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: tl
  text: Kaya nilubayan niya siya.[a] Noon ay sinabi ni Zipora, “Asawang lalaki ng dugo,”[b] dahil sa mga pagtutuli.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nilubayan niya siya” o “tumigil siya mula sa kanya.” Batay sa talata 24, ang PANGINOON ang pinakamalamang na simuno at si Moises ang pinakamalamang na layon.
    reason: referent_ambiguity
  - marker: b
    text: Ang Hebreong “asawang lalaki ng dugo” ay isang mahirap at hindi tiyak na idyoma, marahil ay isang bulalas o katawagang kaugnay ng ritwal ng pagtutuli.
    reason: lexical_alternative
  - marker: c
    text: 'Nasa anyong maramihan ang Hebreo: “mga pagtutuli,” na maaari ring tumukoy sa mga ritwal ng pagtutuli.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: nilubayan siya ng PANGINOON
  rationale: Ang רפה na may מן ay nagsasaad dito ng pagtigil sa mapanganib na pagkilos laban sa isang tao. Ginawang tahasan ang PANGINOON bilang simuno ayon sa agarang konteksto ng talata 24, habang ang layon ay nananatiling panghalip.
- source_word: אָז
  choice: Noon
  rationale: Likas na panandang temporal sa Filipino para sa sumunod na pangyayari matapos siyang lubayan.
- source_word: אָמְרָה
  choice: sinabi ni Zipora
  rationale: Payak na pandiwang pasalaysay ang אמר. Tinukoy si Zipora ayon sa agarang konteksto upang maging malinaw at natural sa Filipino.
- source_word: חֲתַן דָּמִים
  choice: Asawang lalaki ng dugo
  rationale: Pinananatili ang maikli at sadyang mahirap na idyomang Hebreo sa halip na pagpasyahan kung ito ay pahayag ng pagkasuklam, ritwal na katawagan, o iba pang pahiwatig. Sa kontekstong ito, ang חֲתַן ay maaaring tumukoy sa asawang lalaki o lalaking ikakasal.
- source_word: לַמּוּלֹת
  choice: dahil sa mga pagtutuli
  rationale: Pinananatili ang pambihirang anyong maramihan ng pangngalan at ang paliwanag na kaugnayan nito sa ginawang pagtutuli.
theological_decisions:
- issue: Mga tinutukoy ng simuno at layon sa וַיִּרֶף מִמֶּנּוּ
  choice: Ang PANGINOON ang simuno; si Moises ang malamang na tinutukoy ng “siya.”
  alternative: Maaaring iwang parehong di-tiyak ang simuno at layon, gaya ng literal na mga panghalip sa Hebreo.
  rationale: Sa talata 24, ang PANGINOON ang kumilos laban sa kanya, kaya pinakamalapit sa daloy ng salaysay na ang PANGINOON ang tumigil. Gayunman, hindi pinangalanan sa talata 26 ang layon, kaya pinanatili itong panghalip at ipinaliwanag sa talababa.
- issue: Kahulugan ng חֲתַן דָּמִים
  choice: Panatilihin ang literal at malabong idyomang “Asawang lalaki ng dugo.”
  alternative: Maaaring unawain bilang pahayag ng pagkasuklam, ritwal na katawagan, o pahayag na tuwirang inuukol kay Moises o sa bata.
  rationale: Hindi tiyak ang eksaktong kultural at emosyonal na puwersa ng parirala. Hindi ito dapat lutasin sa pamamagitan ng interpretatibong paraphrase.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang kakaibang tunog ng “Asawang lalaki ng dugo” upang hindi pagtakpan ang tunay na kalabuan ng Hebreo. Ginamit ang “PANGINOON” bilang karaniwang anyo para sa banal na pangalan ayon sa konteksto.
