  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: tl
  text: 'At mangyayari ito: kung hindi sila maniniwala sa iyo at hindi makikinig sa tinig ng unang tanda, maniniwala sila sa tinig ng kasunod na tanda.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “huling tanda.” Ang salitang Hebreo ay maaaring mangahulugang “kasunod” o “huli,” ngunit hindi ipinahihiwatig ng “kasunod” na wala nang iba pang tandang susunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At mangyayari
  rationale: Pinananatili ang karaniwang pormulang Hebreo na naghaharap ng magiging kalagayan, habang natural sa makabagong Tagalog.
- source_word: יַאֲמִינוּ לָךְ
  choice: maniniwala sa iyo
  rationale: Ang Hiphil ng אמן na may ל ay tumutukoy sa paniniwala o pagtitiwala sa isang tao; akma rito ang pagtanggap sa sinabi ni Moises.
- source_word: יִשְׁמְעוּ
  choice: makikinig
  rationale: Saklaw ng שׁמע ang pagdinig, pakikinig, o pagsunod. Dito, ang konteksto ay mapagtanggap na pakikinig sa patotoo ng tanda, hindi tahasang pagsunod.
- source_word: לְקוֹל
  choice: sa tinig ng
  rationale: Pinananatili ang larawang Hebreo na wari'y nagsasalita at nagpapatotoo ang tanda, sa halip na gawing tahasang 'mensahe.'
- source_word: הָאֹת
  choice: tanda
  rationale: Karaniwang katumbas ng אוֹת ang 'tanda'; hindi na idinagdag ang 'mahimala' sapagkat hindi iyon tahasang nasa salita.
- source_word: הָרִאשׁוֹן
  choice: unang
  rationale: Tuwirang ipinapahayag ng רִאשׁוֹן ang una sa paghahambing.
- source_word: וְהֶאֱמִינוּ
  choice: maniniwala sila
  rationale: Ito ang bunga ng kondisyon. Sapat na ipinahihiwatig ng ayos ng pangungusap ang 'kung... maniniwala,' kaya hindi kailangang idagdag ang 'kung gayon.'
- source_word: הָאַחֲרוֹן
  choice: kasunod na
  rationale: Maaaring mangahulugang 'huli' o 'sumunod/kasunod' ang אַחֲרוֹן. Ang 'kasunod' ay nagpapanatili sa kaugnayang temporal nang hindi ipinahihiwatig na wala nang ibang tandang susunod.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang di-pangkaraniwang ngunit makahulugang larawang “tinig ng ... tanda” mula sa Hebreo; ginamit ang “kasunod” upang mapanatili ang tunay na saklaw ng kahulugan ng אַחֲרוֹן.
