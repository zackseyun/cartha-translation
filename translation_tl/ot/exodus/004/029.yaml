  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: tl
  text: Nagpunta sina Moises at Aaron at tinipon nila ang lahat ng matatanda ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita”; ayon sa tradisyon, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pumunta
  rationale: Karaniwang ipinagpapatuloy ng wayyiqtol ng הלך ang salaysay sa payak na diwang “pumunta.” Bagaman isahan ang pandiwang Hebreo bago ang dalawang magkaugnay na simuno, likas sa Tagalog ang “pumunta sina Moises at Aaron.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: וַיַּאַסְפוּ
  choice: tinipon nila
  rationale: Ang אסף dito ay tumutukoy sa pagtitipon ng mga tao. Nilinaw ng “nila” ang paksa at pinananatiling natural ang daloy sa Tagalog.
- source_word: אֵת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Pananda ito ng tiyak na tuwirang layon at wala itong bukod na katumbas sa Tagalog.
- source_word: כָּל
  choice: lahat
  rationale: Tuwirang ipinahahayag ng כָּל ang kabuuan.
- source_word: זִקְנֵי
  choice: matatandang pinuno
  rationale: Ang זקנים ay kaugnay ng katandaan ngunit dito ay tumutukoy sa mga kinikilalang pinuno ng pamayanan. Inihahatid ng “matatandang pinuno” ang edad at tungkuling panlipunan nang mas malinaw kaysa sa “matatanda” lamang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang tahasang pananalitang pangkamag-anakan sa Hebreo at ang pagkakakilanlang nagmumula kay Israel/Jacob, sa halip na gawing etnikong katawagang “mga Israelita.”
theological_decisions:
- issue: Pagkakasalin ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Walang malaking usaping doktrinal dito, ngunit taglay ng parirala ang tipanang pagkakakilanlan bilang mga inapo ni Israel/Jacob. Pinananatili ng salin ang anyong pangkamag-anakan ng Hebreo nang hindi nilulutas o pinapahina ang ugnayang iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sina” para sa dalawang pangalang pantangi at ang “matatandang pinuno” upang maipakita ang diwa ng kinikilalang mga elder ng pamayanan.
