  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: tl
  text: Muli, sinabi ni Yahweh sa kanya, “Ipasok mo nga ang iyong kamay sa loob ng damit mo, sa may dibdib.” Kaya ipinasok niya ang kanyang kamay doon. Nang ilabas niya ito, narito, ang kanyang kamay ay may tsaraat[a], maputi gaya ng niyebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “may tsaraat.” Ang tsaraat ay katawagan sa Lumang Tipan para sa isang uri ng karamdaman o abnormalidad sa balat at maaaring hindi ito eksaktong katumbas ng modernong ketong (Hansen’s disease).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa tekstong Hebreo sa pamamagitan ng kinikilalang transliterasyong “Yahweh.”
- source_word: עוֹד
  choice: muli
  rationale: Ipinapakita rito ng salita ang karagdagang utos sa sunod-sunod na mga tanda; natural sa Tagalog ang “muli.”
- source_word: הָבֵא נָא
  choice: ipasok mo nga
  rationale: Sa kontekstong ito, ang literal na “dalhin” ay tumutukoy sa paglalagay ng kamay sa loob ng damit. Ipinahihiwatig ng “nga” ang pagpapalambot o paghimok na dala ng נָא nang hindi nagiging labis na pormal.
- source_word: חֵיק
  choice: loob ng iyong damit, sa tapat ng dibdib
  rationale: Tumutukoy ito sa bahagi o tupi ng damit sa may dibdib kung saan maaaring ipasok ang kamay. Mas malinaw ito sa karaniwang mambabasang Tagalog kaysa sa literal ngunit malabong “sinapupunan” o “dibdib” lamang.
- source_word: וְהִנֵּה
  choice: narito
  rationale: Pinananatili ang biglaan at dramatikong pagpapakita ng kinalabasan ng tanda.
- source_word: מְצֹרַעַת
  choice: tinubuan ng sakit sa balat
  rationale: Inilalarawan nito ang kamay bilang apektado ng צָרַעַת. Iniiwasan ng saling ito ang maling tahasang pagtutumbas nito sa modernong ketong o Hansen’s disease.
- source_word: כַּשָּׁלֶג
  choice: parang niyebe
  rationale: Pinananatili ang payak na paghahambing ng Hebreo nang hindi idinaragdag sa pangunahing teksto ang salitang “maputi.”
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Pagkilala sa karamdamang מְצֹרַעַת
  choice: sakit sa balat na nililinaw sa talababa
  alternative: ketong
  rationale: Ang saklaw ng katawagang biblikal ay hindi tiyak na katumbas ng modernong Hansen’s disease; kaya hindi dapat tahimik na paglapatin ang dalawang kategorya.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sa loob ng iyong damit, sa tapat ng dibdib” upang maipaliwanag nang natural ang sinaunang larawan ng חֵיק. Pinanatili ang dramatikong “narito” at ang payak na “parang niyebe,” habang inilagay ang kinakailangang paglilinaw tungkol sa tsaraat sa talababa.
