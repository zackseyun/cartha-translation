  naturalness: Makabago at malinaw ang karamihan ng salin. Ang “sa loob ng iyong damit, sa tapat ng dibdib mo” ay naiintindihan, ngunit mas likas ang “sa loob ng damit mo, sa may dibdib.” Ang binagong pananalita para sa kondisyon ng kamay at kaputian nito ay mas tuwiran at natural sa Tagalog.
  terminology: Ang “Yahweh” ay wasto at pare-pareho. Pinananatili ang teknikal na “tsaraat” sa pangunahing teksto, na may talababa upang hindi ito mapagkamalang eksaktong modernong ketong o Hansen’s disease. Ito ay mas tapat kaysa sa malabong “sakit sa balat” at mas maingat kaysa sa walang-paliwanag na “ketong.”
