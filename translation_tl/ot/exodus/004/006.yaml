revisions:
- from: Muling sinabi sa kanya ni Yahweh, “Ipasok mo nga ang kamay mo sa loob ng iyong damit, sa tapat ng dibdib mo.” Kaya ipinasok niya roon ang kanyang kamay. Nang ilabas niya ito, narito, ang kamay niya ay tinubuan ng sakit sa balat[a], parang niyebe.
  to: Muli, sinabi ni Yahweh sa kanya, “Ipasok mo nga ang iyong kamay sa loob ng damit mo, sa may dibdib.” Kaya ipinasok niya ang kanyang kamay doon. Nang ilabas niya ito, narito, ang kanyang kamay ay may tsaraat[a], maputi gaya ng niyebe.
  rationale: Pinalitan ang “tinubuan ng sakit sa balat” ng “may tsaraat” upang mapanatili ang saklaw at kalabuan ng terminong Hebreo nang hindi ipinipilit na ito ay modernong ketong. Idinagdag ang “maputi” bilang likas na paglalahad sa Tagalog ng paghahambing na “gaya ng niyebe.” Pinagaan din ang paglalarawan ng חֵיק bilang “sa loob ng damit mo, sa may dibdib.”
