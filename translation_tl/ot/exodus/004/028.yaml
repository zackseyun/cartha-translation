  source_fidelity: Tumpak ang pangunahing salin sa pagkakalahad ni Moises kay Aaron ng lahat ng salita ni Yahweh at ng lahat ng mga tanda. Ang “na nagsugo sa kanya” ay isang makatwirang pangunahing pagbasa ng sugnay na Hebreo, habang ang pagkakaugnay nito sa “mga salita” ay nararapat panatilihin bilang alternatibo sa talababa. Ang “iniutos ni Yahweh sa kanya” ay mas malinaw na Tagalog kaysa sa anyong maaaring magmukhang ang mga tanda mismo ang tumanggap ng utos.
  naturalness: Natural at marangal ang “Sinabi ni Moises kay Aaron.” Nilinaw ang ikalawang bahagi upang maging mas idiomatiko at hindi malabo ang ugnayan ng pandiwang “iniutos” at ng mga panghalip.
  terminology: Ang “Yahweh,” “mga salita,” at “mga tanda” ay angkop at matapat sa terminolohiya ng Hebreo. Pinanatili ang “mga tanda” nang walang dagdag na pagpapakahulugang “makahimala.”
