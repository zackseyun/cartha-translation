  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: tl
  text: Sinabi ni Moises kay Aaron ang lahat ng salita ni Yahweh na nagsugo sa kanya[a], at ang lahat ng tandang iniutos ni Yahweh sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang lahat ng salita ni Yahweh na taglay ni Moises nang isugo siya ni Yahweh.” Maaaring iugnay nang mas malapit sa “mga salita” ang sugnay sa Hebreo, bagaman nananatili ang diwang si Yahweh ang nagsugo kay Moises.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: Sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang ipaalam o sabihin. Ang “sinabi” ay natural sa makabagong Tagalog at angkop sa pagsasalaysay.
- source_word: דִּבְרֵי יְהוָה
  choice: mga salita ni Yahweh
  rationale: Pinananatili ng “mga salita” ang maramihang anyo at ang diwa ng ipinahayag na atas, sa halip na paliitin ito sa pangkalahatang “mensahe.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: na nagsugo sa kanya
  rationale: Natural na maiuugnay ang sugnay kay Yahweh bilang nagsugo kay Moises, habang itinatala sa talababa ang posibleng mas malapit na pagkakaugnay nito sa “mga salita.”
- source_word: הָאֹתֹת
  choice: mga tanda
  rationale: Ang “mga tanda” ang tuwirang katumbas ng אוֹת at hindi nito labis na ipinapaliwanag kung paano naging makahimala ang mga iyon.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: na iniutos sa kanya
  rationale: Pinananatili nito ang maikli at bahagyang masinsing kayarian ng Hebreo nang hindi tahasang nagdaragdag ng “na gawin,” bagaman nauunawaan sa konteksto na si Moises ang magsasagawa ng mga tanda.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tinutukoy ng אֲשֶׁר שְׁלָחוֹ
  choice: Si Yahweh ang nagsugo kay Moises
  alternative: Ang mga salita ang ipinadala o siyang taglay ni Moises sa pagkasugo
  rationale: Pinakamadaling basahin ang sugnay bilang paglalarawan kay Yahweh, ngunit kayang iugnay ng kayariang Hebreo ang sugnay sa “mga salita”; kaya hindi itinatago ang alternatibo at inilalagay ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “mga salita” at “mga tanda” para sa katapatan sa bokabularyong Hebreo, at iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
