  - severity: low
    issue: Medyo malabo ang “mga tandang iniutos sa kanya.”
    rationale: Bagaman malapit sa siksik na Hebreo, maaaring hindi malinaw sa Tagalog kung sino ang nag-utos. Ang pagbanggit kay Yahweh ay paglilinaw lamang ng hayag na antecedent at hindi nagdaragdag ng kahulugan.
