base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: tl
  text: Sinabi ni Moises kay Yahweh, “Pakiusap, Panginoon, hindi ako mahusay magsalita[a]—hindi kahapon man o noong isang araw, ni mula nang magsalita ka sa iyong lingkod—sapagkat mabigat ang aking bibig at mabigat ang aking dila[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “hindi ako taong may mga salita,” ibig sabihin, hindi mahusay o bihasa sa pagsasalita.'
    reason: lexical_alternative
  - marker: b
    text: Ang “mabigat ang aking bibig at mabigat ang aking dila” ay metapora para sa kahirapan sa pagsasalita; maaaring tumukoy ito sa kakulangan sa kahusayan o sa isang kapansanan sa pagsasalita.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בִּי אֲדֹנָי
  choice: Pakiusap, Panginoon
  rationale: Ang בִּי ay magalang na pakiusap, at ang אֲדֹנָי ay tuwirang tawag na ‘Panginoon.’
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: hindi ako mahusay magsalita
  rationale: Natural nitong ipinahahayag sa modernong Tagalog ang idyomang literal na ‘hindi ako taong may mga salita,’ habang inilalagay sa talababa ang mas literal na anyo.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם
  choice: hindi noon, ni nitong mga nakaraang araw
  rationale: Ipinahahayag nito ang Hebreong pormulang tumutukoy sa dati at kamakailang panahon nang hindi ipinipilit ang literal na ‘kahapon at ikatlong araw’ sa Tagalog.
- source_word: גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: ni mula nang magsalita ka sa iyong lingkod
  rationale: Pinananatili ang temporal na diwang ‘mula nang’ at ang mapagpakumbabang pagtukoy ni Moises sa sarili bilang lingkod.
- source_word: כְבַד פֶּה וּכְבַד לָשׁוֹן
  choice: mabigat ang aking bibig at mabigat ang aking dila
  rationale: Pinananatili ang magkatugmang metapora ng Hebreo at hindi tinutukoy kung kakulangan sa husay, kumpiyansa, o pisikal na kapansanan sa pagsasalita ang ibig sabihin.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang tahasang ginamit sa pinagmulang teksto; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Eksaktong uri ng suliranin ni Moises sa pagsasalita
  choice: Panatilihin ang ‘mabigat ang aking bibig at mabigat ang aking dila’
  alternative: ‘Mabagal magsalita’ o ‘may kapansanan sa pagsasalita’
  rationale: Hindi nililinaw ng Hebreo kung kawalan ng kahusayan, pag-aatubili, o pisikal na kapansanan ang tinutukoy, kaya pinananatili ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal. Ginawang natural ang idyoma tungkol sa pagiging ‘taong may mga salita,’ ngunit pinanatili sa pangunahing teksto ang mahalagang Hebreong metapora ng mabigat na bibig at dila.
