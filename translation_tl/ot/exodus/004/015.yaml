base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: tl
  text: Kausapin mo siya at ilagay mo sa bibig niya ang mga salita. Ako ay magiging kasama ng bibig mo at ng bibig niya, at ituturo ko sa inyo[a] kung ano ang inyong gagawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “inyo” at “inyong” ay maramihan; tumutukoy ang mga ito kina Moises at Aaron.
    reason: Nililinaw ang maramihang anyo ng panghalip at pandiwa sa Hebreo.
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Kausapin mo siya
  rationale: Ang anyong pandiwa sa kontekstong ito ay utos. Likas at tuwiran sa modernong Tagalog ang “kausapin mo siya” para sa דִבַּרְתָּ אֵלָיו.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: at ilagay mo sa bibig niya ang mga salita
  rationale: Pinananatili ng “ilagay” ang karaniwang kahulugan ng שׂים at ng “sa bibig niya” ang konkretong idyoma ng Hebreo, sa halip na ipakahulugang lamang na “sabihin mo sa kanya ang sasabihin niya.”
- source_word: הַדְּבָרִים
  choice: ang mga salita
  rationale: Tuwirang kinakatawan nito ang tiyak na pangngalang maramihan. Ang “mensahe” ay mas malayang pagpapakahulugan.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: Ako'y sasaiyong bibig at sa bibig niya
  rationale: Pinananatili ang kapansin-pansing konkretong larawan ng Hebreo—literal na presensiya ng Diyos “kasama ng” bibig ni Moises at ng bibig ni Aaron—kahit bahagyang di-karaniwan ang anyo sa Tagalog. Iniiwasan nitong paliitin ang diwa sa simpleng “tutulungan ko kayong magsalita.”
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: at ituturo ko sa inyo
  rationale: Ang Hiphil ng ירה ay angkop na isaling “ituturo” o “tuturuan.” Ang “sa inyo” ay nagpapanatili sa maramihang anyo ng Hebreo.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: kung ano ang inyong gagawin
  rationale: Natural itong katumbas ng sugnay na “what you will do.” Ipinakikita ng “inyong” ang maramihang tinutukoy nang hindi dinaragdagan ang lakas nito bilang obligasyon.
theological_decisions:
- issue: Konkretong paglalarawan sa tulong ng Diyos sa pagsasalita
  choice: Panatilihin ang “Ako'y sasaiyong bibig at sa bibig niya.”
  alternative: “Sasamahan kita habang nagsasalita ka, at sasamahan ko rin siya habang nagsasalita siya.”
  rationale: Ang Hebreo ay gumagamit ng larawang tumutukoy sa bibig upang ipahayag ang presensiya at pagbibigay-kakayahan ng Diyos. Ang pagpapanatili rito ay hindi agad nagpapasya kung paano eksaktong isasagawa ang tulong na iyon.
- issue: Maramihang bilang ng panghalip at pandiwa sa hulihan
  choice: Gamitin ang “sa inyo” at “inyong gagawin,” na tumutukoy kina Moises at Aaron.
  alternative: “sa inyong dalawa kung ano ang gagawin ninyong dalawa”
  rationale: Malinaw na maramihan ang אֶתְכֶם at תַּעֲשׂוּן. Sapat at mas likas sa Tagalog ang maramihang “inyo/inyong”; nililinaw ng talababa ang tinutukoy nang hindi binibigatan ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Pinanatili ang sadyang konkretong larawan ng “bibig,” bagaman higit itong minarkahan kaysa sa karaniwang pananalita, upang hindi mapawi ang anyo at teolohikal na tensiyon ng Hebreo.
