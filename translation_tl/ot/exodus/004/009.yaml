source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: tl
  text: At kung hindi sila maniwala kahit sa dalawang tandang ito at hindi makinig sa iyo[a], kumuha ka ng tubig mula sa Ilog Nilo at ibuhos mo iyon sa tuyong lupa. Ang tubig na kukunin mo mula sa Ilog Nilo ay magiging dugo[b] sa tuyong lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi makinig sa iyong tinig.” Maaari rin itong mangahulugang “hindi tumalima sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, ang pagkakabuo ng parirala ay nagsasaad na ang tubig ay magiging dugo, hindi lamang magmumukhang dugo o magiging kulay-dugo.
    reason: theological_clarity
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: At kung
  rationale: Likas na panimula ito ng kondisyong pangungusap sa Tagalog at pinananatili ang daloy ng Hebreo nang hindi isinasalin nang mekanikal ang וְהָיָה.
- source_word: יַאֲמִינוּ
  choice: hindi ... maniwala
  rationale: Sa kontekstong ito, ang Hiphil ng אמן ay tumutukoy sa pagtanggap sa bisa ng mga tanda bilang katibayan; malinaw at karaniwan ang “maniwala.”
- source_word: גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: kahit sa dalawang tandang ito
  rationale: 'Ipinahahayag ng “kahit” ang pagdidiin ng גַּם at ang pag-igting ng sitwasyon: hindi sila naniniwala maging sa dalawang tandang na nauna nang ibinigay.'
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: makinig sa iyo
  rationale: Natural nitong ipinahahayag sa modernong Tagalog ang idyomang Hebreo na maaaring mangahulugang makinig o tumalima, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: tubig mula sa Ilog Nilo
  rationale: Ipinahahayag nito ang partitive na diwa ng מִן sa natural na Tagalog. “Ilog Nilo” ang karaniwang tawag sa יְאֹר sa konteksto ng Exodo.
- source_word: וְשָׁפַכְתָּ
  choice: ibuhos mo iyon
  rationale: Tuwirang katumbas ng שפך ang “ibuhos”; malinaw na tumutukoy ang “iyon” sa tubig na kukunin.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: tuyong lupa
  rationale: Pinananatili nito ang pagkakaiba ng lupa at tubig at ang pag-uulit ng salita sa dalawang bahagi ng talata.
- source_word: וְהָיוּ ... לְדָם
  choice: ay magiging dugo
  rationale: Ang היה + לְ ay nagpapahayag ng pagbabago o kinalabasan. Tuwiran at malinaw sa Tagalog ang “magiging dugo.”
- source_word: דָם
  choice: dugo
  rationale: Ito ang payak na kahulugan ng salita; walang batayan sa teksto upang palambutin ito bilang kulay o pagkakahawig lamang.
theological_decisions:
- issue: Kalikasan ng tandang kaugnay ng tubig mula sa Nilo
  choice: “magiging dugo,” bilang tuwirang pagbabago
  alternative: “magiging kulay-dugo” o “magmumukhang dugo”
  rationale: Tahasang nagsasaad ang Hebreo ng pagiging dugo at walang salitang naglilimita rito sa kulay o anyo lamang. Hindi dapat pahinain ng salin ang pahayag o magpasok ng paliwanag na naturalistiko.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tanda” para sa אֹות at “Ilog Nilo” para sa יְאֹר. Iniwasan ang sobrang literal na “makinig sa iyong tinig” sa pangunahing teksto ngunit pinanatili ito sa talababa; pinanatili rin ang dalawang pagbanggit sa “tuyong lupa” ayon sa Hebreo.
