translation:
  language: tl
  text: Kaya ngayon, humayo ka. Ako ay magiging kasama ng iyong bibig[a] at ituturo ko sa iyo ang iyong sasabihin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “Makakasama mo ako sa pagsasalita.” Pinananatili ng pangunahing teksto ang kongkretong larawan ng Hebreo: “kasama ng iyong bibig.”'
    reason: Ibinibigay ang idiomatikong alternatibo habang pinananatili sa pangunahing teksto ang literal na larawan ng Hebreo.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ginagamit ito bilang panandang diskurso at panahon na naghahatid sa agarang utos ng Diyos bilang tugon sa pagtutol ni Moises.
- source_word: לֵךְ
  choice: humayo ka
  rationale: Tuwirang pautos ito ng הלך. Ang “humayo ka” ay marangal at malinaw sa konteksto ng pagsusugo.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Ako ay sasaiyo
  rationale: Pinananatili nito ang diin ng hiwalay na panghalip na אָנֹכִי at ang pormula ng presensiya ng Diyos nang hindi ito ginagawang paliwanag lamang tungkol sa kakayahan.
- source_word: עִם־פִּיךָ
  choice: sa iyong bibig
  rationale: Pinananatili ang kongkretong larawan ng Hebreo at ang tuon sa bibig ni Moises kaugnay ng kanyang pangamba sa pagsasalita.
- source_word: וְהוֹרֵיתִיךָ
  choice: at ituturo ko sa iyo
  rationale: Ang Hiphil ng ירה ay nangangahulugang magturo o magbigay-tagubilin; natural at malinaw ang “ituturo ko sa iyo.”
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: ang iyong sasabihin
  rationale: Ipinapahayag nito nang natural sa modernong Tagalog ang nilalaman ng ituturo ng Diyos, habang pinananatili ang hinaharap na diwa ng pandiwa.
theological_decisions:
- issue: Pormula ng presensiya ng Diyos sa pagsusugo
  choice: Ako ay sasaiyong bibig
  alternative: Sasamahan kita habang nagsasalita ka
  rationale: Pinananatili ng pangunahing salin ang kakaiba at kongkretong pahayag na ang Diyos ay magiging kasama ng bibig ni Moises, sa halip na tahimik itong ipakahulugan bilang tulong lamang sa pagsasalita.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang “humayo” para sa tono ng banal na pagsusugo, ngunit iniwasan ang labis na makalumang balangkas. Ang “sasaiyong bibig” ay sadyang kongkreto upang mapanatili ang larawan at teolohikal na diin ng Hebreo.
