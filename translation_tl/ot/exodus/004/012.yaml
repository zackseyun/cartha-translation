  naturalness: Natural ang kabuuang daloy, at ang “humayo ka” ay angkop na marangal na rehistro. Bagaman sadyang kakaiba ang “kasama ng iyong bibig,” ito ang pinakamalapit na Tagalog na nagpapanatili sa literal na larawan; nililinaw ito ng talababa sa isang idiomatikong alternatibo.
  terminology: Ang “ituturo ko sa iyo” at “ang iyong sasabihin” ay tapat at malinaw. Pinanatili ang “bibig,” sa halip na palitan ng “pagsasalita,” sa pangunahing teksto.
