  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: tl
  text: Ngunit sinabi niya[a], “Pakiusap, Panginoon ko, magsugo ka sa pamamagitan ng sinumang isusugo mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas interpretatibo: “Pakiusap, Panginoon ko, magsugo ka ng iba.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi niya
  rationale: Karaniwang ipinagpapatuloy ng waw-consecutive ang salaysay, ngunit malinaw sa konteksto ang pagsalungat ni Moises matapos sagutin ng Diyos ang kanyang mga pagtutol; kaya likas ang “Ngunit.”
- source_word: בִּי
  choice: Nakikiusap ako
  rationale: Sa idyomang ito bago ang magalang na pagtawag, nagpapahayag ang בִּי ng mapitagang pakiusap, hindi ng literal na “sa akin.”
- source_word: אֲדֹנָי
  choice: Panginoon ko
  rationale: Mapitagang tuwirang pagtawag ito sa Diyos at taglay ang panlaping unang panauhang isahan; hindi ito ang banal na pangalang יהוה.
- source_word: שְׁלַח־נָא
  choice: isugo mo na lang
  rationale: Ang שְׁלַח ay pautos na “isugo,” at pinapalambot ng נָא ang pakiusap. Sa Filipino, ang “na lang” ay likas sa konteksto ng nag-aatubiling pakiusap, nang hindi tahasang idinaragdag ang “ibang tao.”
- source_word: בְּיַד
  choice: sa pamamagitan ng
  rationale: Literal itong “sa kamay ng,” ngunit karaniwan itong idyoma ng ahensiya. Mas natural at malinaw sa modernong Filipino ang “sa pamamagitan ng.”
- source_word: תִּשְׁלָח
  choice: isusugo mo
  rationale: Pinananatili ng anyong panghinaharap ang sadyang malabong pahayag ni Moises at hindi tahasang ginagawang “ibang tao” ang tinutukoy.
theological_decisions:
- issue: Ang malabong pakiusap ni Moises na umiwas sa pagsusugo
  choice: Panatilihin sa pangunahing teksto ang “sinumang isusugo mo.”
  alternative: “Magsugo ka na lang ng iba.”
  rationale: Ipinahihiwatig ng konteksto na ayaw ni Moises na siya ang isugo, ngunit hindi tahasang sinasabi ng Hebreo ang “iba.” Pinananatili ng salin ang interpretatibong tensiyon at inilalagay sa talababa ang mas tuwirang pagpapakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Panginoon ko” bilang personal at mapitagang tawag, at ang “sa pamamagitan ng” sa halip na literal na “sa kamay ng” upang maging natural habang pinananatili ang di-tiyak na tinutukoy ng Hebreo.
