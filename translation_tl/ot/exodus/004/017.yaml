  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: tl
  text: At dalhin mo sa iyong kamay ang tungkod na ito,[a] na gagamitin mo upang gawin ang mga tanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pamalo.” Ang salitang Hebreo ay maaaring tumukoy sa tungkod o pamalo; mas angkop dito ang “tungkod” dahil pastol si Moises.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga mahimalang tanda.” Payak na “mga tanda” ang nasa Hebreo; ipinauunawa ng konteksto na mahimala ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: At
  rationale: Iniuugnay ng pangatnig ang utos na ito sa naunang tagubilin; hindi hiwalay na isinasalin ang pantukoy sa tuwirang layon.
- source_word: הַמַּטֶּה הַזֶּה
  choice: ang tungkod na ito
  rationale: Ang מַטֶּה ay maaaring tumukoy sa tungkod o pamalo; ang “tungkod” ay angkop sa konteksto ni Moises bilang pastol at natural sa makabagong Tagalog.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: dalhin mo sa iyong kamay
  rationale: Ang anyong di-ganap ay may puwersang pautos dito. Ipinahihiwatig ng תִּקַּח na dapat kunin at dalhin ni Moises ang tungkod, samantalang pinananatili ng “sa iyong kamay” ang tahasang larawan ng Hebreo.
- source_word: אֲשֶׁר ... בּוֹ
  choice: na gagamitin mo
  rationale: 'Isinasaloob nito nang natural sa Tagalog ang ugnayang panghalip at instrumental na בּוֹ: ang tungkod ang gagamiting kasangkapan.'
- source_word: תַּעֲשֶׂה
  choice: sa paggawa
  rationale: Ang עָשָׂה ay malawak na “gawin”; sa pariralang ito, natural ang “paggawa ng mga tanda” nang hindi nagdaragdag ng tahasang paliwanag na mahimala ang mga iyon.
- source_word: הָאֹתֹת
  choice: ang mga tanda
  rationale: Pinananatili nito ang tiyak ngunit payak na pananalita ng Hebreo. Ang kalikasan ng mga tanda ay ipinauunawa ng konteksto.
theological_decisions:
- issue: Kung tahasang tatawaging mahimala ang mga tanda
  choice: mga tanda
  alternative: mga mahimalang tanda
  rationale: Ang Hebreo ay nagsasabi lamang ng הָאֹתֹת, “ang mga tanda.” Hindi kailangang gawing tahasan sa pangunahing teksto ang ipinahihiwatig ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dalhin” upang maipahayag ang pagkuha at patuloy na pagdadala sa tungkod, at pinanatili ang “sa iyong kamay” upang manatiling malapit sa konkretong larawan ng Hebreo.
