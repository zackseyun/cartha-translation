  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: tl
  text: Naniwala ang bayan. Nang marinig nilang dinalaw[a] ni Yahweh ang mga anak ni Israel[b] at nakita niya ang kanilang paghihirap[c], yumukod sila at sumamba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagtuunan ng pansin” o “inalagaan.” Ang pandiwang Hebreo ay maaaring mangahulugang dumalaw, magbigay-pansin, o kumalinga, at madalas na nagpapahiwatig na kikilos ang Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga Israelita.” Literal na “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “kanilang pagdurusa” o “kanilang kaapihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: Naniwala
  rationale: Ipinahihiwatig ng Hiphil ng אמן na pinaniwalaan ng bayan ang mensahe at mga tandang iniharap nina Moises at Aaron. Hindi nilagyan ng tahasang layon sapagkat wala nito sa Hebreo.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang kolektibong pangngalan ay likas at marangal na isinasalin bilang “ang bayan” sa konteksto ng Israel.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: Nang marinig nilang
  rationale: Ipinakikita ng parirala ang nilalaman ng kanilang narinig at ang temporal-sanhing kaugnayan nito sa kanilang paniniwala at pagsamba.
- source_word: פָקַד
  choice: dinalaw
  rationale: Pinananatili ng “dinalaw” ang kongkretong idyomang Hebreo at ang diwang ang Diyos ay nagbigay-pansin upang kumilos para sa kanyang bayan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang pampamilya ng Hebreo, habang malinaw at natural pa rin sa Tagalog.
- source_word: רָאָה אֶת עָנְיָם
  choice: nakita niya ang kanilang paghihirap
  rationale: Pinananatili ang kongkretong pandiwang “nakita,” samantalang natural na ipinahahayag ng “paghihirap” ang עֳנִי bilang pagdurusa o kaapihan.
- source_word: וַיִּקְּדוּ
  choice: yumukod sila
  rationale: Tuwirang inilalarawan ng pandiwa ang pagyuko ng katawan.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sumamba
  rationale: Dahil may hiwalay nang pandiwa para sa pisikal na pagyuko, ipinahahayag ng “sumamba” ang debosyonal na kahulugan ng kasunod na kilos nang hindi inuulit lamang ang nauna.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagpapanatili sa pampamilyang pariralang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak ng Israel
  rationale: Pinananatili ng salin ang pampamilyang larawan ng pinagmulang teksto nang hindi ipinapalagay na mga lalaki lamang ang buong tinutukoy na bayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang Hebreong idyoma sa “dinalaw” at ang pampamilyang katawagang “mga anak ni Israel,” na may mga talababa para sa mga likas na alternatibo.
