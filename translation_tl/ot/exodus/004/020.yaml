  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה אֶת אִשְׁתּ֣/וֹ וְ/אֶת בָּנָ֗י/ו וַ/יַּרְכִּבֵ/ם֙ עַֽל הַ/חֲמֹ֔ר וַ/יָּ֖שָׁב אַ֣רְצָ/ה מִצְרָ֑יִם וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: tl
  text: Pagkatapos, isinama ni Moises ang kanyang asawa at mga anak na lalaki, pinasakay niya sila sa asno, at bumalik siya sa lupain ng Egipto. Dinala rin ni Moises ang tungkod ng Diyos, tangan niya ito sa kanyang kamay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kaya isinama ni Moises
  rationale: Isinusulong ng waw-consecutive ang salaysay. Sa kontekstong kasama ang pamilya sa paglalakbay, mas natural sa Tagalog ang “isinama” kaysa sa literal na “kinuha,” habang nananatili ang diwang siya ang nagdala sa kanila.
- source_word: אִשְׁתּוֹ
  choice: ang kanyang asawa
  rationale: Tuwirang salin ng אשה na may hulaping panghalip na panlalaking isahan; hindi kailangang idagdag dito ang pangalang Zipora.
- source_word: בָּנָיו
  choice: mga anak na lalaki
  rationale: Tiyak na panlalaking maramihan ang Hebreo, kaya pinanatili ang “mga anak na lalaki” sa halip na pangkalahatang “mga anak.”
- source_word: וַיַּרְכִּבֵם
  choice: pinasakay sila
  rationale: Ang Hiphil ng רכב ay causative, “pinangyaring sumakay.” Ang “pinasakay” ay maikli, natural, at tumpak sa modernong Tagalog.
- source_word: הַחֲמֹר
  choice: sa asno
  rationale: May tiyak na pantukoy ang pangngalang Hebreo. Sa Tagalog, likas na naipahihiwatig ng konteksto ang pagiging tiyak kahit walang katumbas na hiwalay na artikulo sa pariralang “sa asno.”
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Karaniwang kahulugan ng שוב sa kontekstong ito ang pagbabalik.
- source_word: אַרְצָה מִצְרָיִם
  choice: sa lupain ng Egipto
  rationale: Pinananatili ang “lupain” at ang direksiyonal na diwa ng hulaping ה sa אֶרֶץ.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: ang tungkod ng Diyos
  rationale: Ang “tungkod” ay natural at dignified na katumbas ng מַטֶּה sa kontekstong ito, at pinananatili ang genitibong “ng Diyos.”
- source_word: בְּיָדוֹ
  choice: sa kanyang kamay
  rationale: Pinananatili ang konkretong larawan ng paghawak ni Moises sa tungkod.
theological_decisions:
- issue: Kahulugan ng הָאֱלֹהִים sa pariralang מַטֵּה הָאֱלֹהִים
  choice: Diyos
  alternative: banal na tungkod
  rationale: Tumutukoy ang parirala sa tungkod na kaugnay ng atas at mga tanda ng Diyos; ang personal na “Diyos” ang pinakapayak at pinakaangkop na pagbasa rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “asno” at “tungkod” bilang karaniwang biblikal ngunit nauunawaang mga salita. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ipakita sa talatang ito; ang mga footnote sa ibinigay na English consultation layer ay tila hindi tugma ang pagkakalagay sa mga alternatibong tinutukoy.
