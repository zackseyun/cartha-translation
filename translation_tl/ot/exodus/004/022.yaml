  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: tl
  text: 'Pagkatapos, sabihin mo sa Paraon, “Ganito ang sabi ni Yahweh: Ang Israel ay anak ko, ang panganay ko.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang Israel ang panganay kong anak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Pagkatapos, sabihin mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na may waw ay nagsisilbing sunod na tagubilin kay Moises. Ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod, at ng “sabihin mo” ang tuwirang utos.
- source_word: אֶל־פַּרְעֹה
  choice: sa Paraon
  rationale: Karaniwang gamit ng pang-ukol para sa kinakausap; “Paraon” ang nakaugaliang makabagong anyong Tagalog ng titulo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Natural at marangal na salin ng pormulang ginagamit ng sugo upang ipakilala ang mismong pahayag ng nagsugo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּנִי
  choice: anak ko
  rationale: Pinananatili ang tahasang ugnayang pampamilya. Sa Tagalog, hindi kailangang markahan ang kasarian sa “anak,” ngunit hindi nito inaalis ang kahulugan ng Hebreong ben sa kontekstong ito.
- source_word: בְכֹרִי
  choice: ang panganay ko
  rationale: Pinananatili ng “panganay” ang katayuan ng unang isinilang nang hindi ipinapasiya kung ang diin ay kronolohikal, legal, o pandangal.
- source_word: יִשְׂרָאֵל
  choice: Ang Israel
  rationale: Pinananatili ang pangalang pantangi at inilalagay bilang paksa ng sugnay na walang pandiwa sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili itong pangalan sa halip na halinhan ng titulo.
- issue: Pagkakaugnay ng “anak ko” at “panganay ko”
  choice: Ang Israel ay anak ko, ang panganay ko
  alternative: Ang Israel ang panganay kong anak
  rationale: Mas malapit ang napiling ayos sa pagkakasunod at apposisyon ng Hebreo at pinananatili ang bahagyang pagdidiin sa dalawang paglalarawan. Ang alternatibo ay natural ding pagbasa ngunit mas mahigpit na pinag-iisa ang mga ito sa iisang parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon” bilang karaniwang anyong Tagalog at pinanatili ang “Yahweh” bilang personal na pangalan. Ang bantas at ayos ng pangungusap ay nagpapadulas sa pagbasa nang hindi tinatakpan ang apposisyon sa Hebreo.
