base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: tl
  text: Habang nasa Midian si Moises, sinabi ni Yahweh sa kanya, “Humayo ka, bumalik ka sa Ehipto[a], sapagkat patay na ang lahat ng lalaking noon ay naghahangad na kumitil sa iyong buhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Bumalik ka sa Ehipto.” Pinananatili ng Hebreo ang dalawang pautos na pandiwa, na literal na “Humayo ka, bumalik ka sa Ehipto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang personal na pangalan ng Diyos bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang anyo ito ng pagsasalaysay sa Hebreo; natural at tumpak sa modernong Tagalog ang “Sinabi.”
- source_word: בְּמִדְיָן
  choice: sa Midian
  rationale: Tuwirang ipinapahayag ng pang-ukol ang lugar kung nasaan si Moises nang magsalita si Yahweh.
- source_word: לֵךְ שֻׁב
  choice: Humayo ka, bumalik ka
  rationale: 'Pinananatili ang dalawang pautos na pandiwa: ang una ay nag-uutos na humayo, at ang ikalawa ay tumutukoy sa pagbabalik. Ipinaliliwanag sa talababa ang mas maikling natural na salin.'
- source_word: מִצְרָיִם
  choice: sa Ehipto
  rationale: Ang patutunguhan ng pagbabalik ay natural na ipinahahayag sa Tagalog sa pamamagitan ng “sa.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: מֵתוּ
  choice: patay na
  rationale: Ipinahahayag ng ganap na pandiwa ang natapos na pangyayari at ang kasalukuyang bunga nito.
- source_word: כָּל הָאֲנָשִׁים
  choice: lahat ng lalaking
  rationale: Pinananatili ang tiyak na pagtukoy sa mga lalaki, sa halip na gawing pangkalahatang “mga tao.”
- source_word: הַמְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: nagtatangkang pumatay sa iyo
  rationale: Ang idyomang “hinahanap ang buhay” ay nangangahulugang nagsisikap na kitlin ang buhay ng isang tao. Ang saling ito ang malinaw at natural na katumbas sa Tagalog.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang יְהוָה sa teksto. Pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “Panginoon.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili sa pangunahing teksto ang dalawang pautos na pandiwa, habang ginawang likas sa Tagalog ang idyomang tumutukoy sa pagtatangkang pumatay.
