- from: Sinabi ni Yahweh kay Moises sa Midian, “Humayo ka, bumalik ka sa Ehipto[a], sapagkat patay na ang lahat ng lalaking nagtatangkang pumatay sa iyo.”
  to: Habang nasa Midian si Moises, sinabi ni Yahweh sa kanya, “Humayo ka, bumalik ka sa Ehipto[a], sapagkat patay na ang lahat ng lalaking noon ay naghahangad na kumitil sa iyong buhay.”
