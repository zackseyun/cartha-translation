base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: tl
  text: Pagkatapos, kumuha si Zipora ng isang batong pingkian at pinutol ang balat ng ari ng kanyang anak. Idinampi niya iyon sa mga paa niya[a] at sinabi, “Tunay ngang kasintahang lalaki ng dugo ka para sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa kaniyang mga paa.” Ang “mga paa” ay maaaring eupemismo para sa ari, at maaaring si Moises o ang kanyang anak ang tinutukoy ng panghalip.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: batong pingkian
  rationale: Tumutukoy ang salita sa batong flint na ginamit na pantabas; ang “batong pingkian” ay likas at tiyak na katawagan sa Filipino.
- source_word: עָרְלַת בְּנָהּ
  choice: balat ng maselang bahagi ng kanyang anak
  rationale: Tumpak itong tumutukoy sa foreskin sa paraang malinaw ngunit hindi labis na klinikal para sa karaniwang mambabasa.
- source_word: וַתַּגַּע
  choice: Idinikit
  rationale: Pinananatili nito ang payak na diwa ng paghipo o paglalapat nang hindi tinutukoy ang eksaktong paraan ng pagdikit.
- source_word: לְרַגְלָיו
  choice: sa mga paa nito
  rationale: Pinananatili ang payak na leksikal na kahulugang “mga paa” at ang kalabuan ng panghalip; inilalahad sa talababa ang posibleng eupemismo at mga maaaring tinutukoy.
- source_word: כִּי
  choice: Tunay ngang
  rationale: Naihahatid nito ang mariin at padamdam na gamit ng כִּי sa pahayag ni Zipora.
- source_word: חֲתַן דָּמִים
  choice: lalaking ikinasal sa akin sa pamamagitan ng dugo
  rationale: Inilalahad sa likas na Filipino ang kakaiba at mahirap na larawang “bridegroom of blood” nang hindi nagpapasya sa eksaktong ritwal o teolohikal na kahulugan nito.
- source_word: לִי
  choice: sa akin
  rationale: Ipinakikita nito ang personal na kaugnayang ipinahahayag ng pariralang Hebreo.
theological_decisions:
- issue: Kung ang “mga paa nito” ay eupemismo para sa maselang bahagi at kung si Moises o ang anak ang tinutukoy
  choice: Panatilihin sa pangunahing teksto ang literal na “mga paa nito” nang hindi pinapangalanan ang tinutukoy
  alternative: maselang bahagi ni Moises; mga paa ni Moises; maselang bahagi ng anak; mga paa ng anak
  rationale: Sadyang malabo ang Hebreo. Hindi nilulutas ng salin ang interpretatibong tensiyon; sa halip, inilalahad sa talababa ang pangunahing mga posibilidad.
- issue: Kahulugan ng חֲתַן דָּמִים
  choice: lalaking ikinasal sa akin sa pamamagitan ng dugo
  alternative: kasintahang lalaki ng dugo; asawang lalaki ng dugo; kamag-anak sa pag-aasawa sa pamamagitan ng dugo
  rationale: Pinananatili ng salin ang ugnayan sa pag-aasawa at sa dugo habang iniiwasang ipataw ang isang tiyak na paliwanag sa mahiwagang pahayag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “batong pingkian” bilang tiyak na katawagan sa flint, at pinanatili ang kalabuan ng Hebreo sa “mga paa nito.”
