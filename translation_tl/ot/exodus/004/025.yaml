  rationale: Pinanatili ng rebisyon ang tiyak na anatomikong kahulugan ng עָרְלָה, ang payak ngunit hindi ganap na tinutukoy na kilos ng נגע, at ang kalabuan ng panghalip sa לְרַגְלָיו. Isinalin ang חֲתַן דָּמִים nang malapit bilang “kasintahang lalaki ng dugo,” upang huwag ipataw ang paliwanag na wala sa Hebreo. Ang talababa ay nagpapanatili ng parehong eupemistikong posibilidad at hindi tiyak na reperente.
