base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At ikinabit nila rito ang isang panaling sinulid na asul[a], upang mailagay sa ibabaw ng turbante, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang asul na panali” o “isang panaling kulay-lila.” Ang Hebreong תְּכֵלֶת ay tumutukoy sa natatanging materyal na tinina upang maging asul o asul-lila, na ginamit sa tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: ikinabit nila rito
  rationale: Bagaman literal na ‘inilagay nila sa ibabaw nito,’ ipinahihiwatig ng konteksto na ikinabit ang panali sa banal na plaka; natural at malinaw sa Tagalog ang ‘ikinabit nila rito.’
- source_word: פְּתִיל
  choice: panaling sinulid
  rationale: Tumutukoy sa pinilipit na sinulid o pisi. Pinananatili ng ‘panaling sinulid’ ang katangiang tekstil at ang gamit nito bilang pangkabit.
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Tumutukoy sa natatanging asul o asul-lilang tina at materyal na ginamit sa tabernakulo; ‘asul’ ang pinakanatural na pangunahing tawag, habang inilalahad sa talababa ang saklaw ng kulay at materyal.
- source_word: לָתֵת עַל הַמִּצְנֶפֶת מִלְמָעְלָה
  choice: upang ilagay ito sa ibabaw ng turbante
  rationale: Ang infinitive ay nagsasaad ng layunin, at ang מִלְמָעְלָה ay nagpapahiwatig ng pagkakalagay sa itaas. Ang ‘sa ibabaw ng turbante’ ay natural sa Tagalog nang hindi dinaragdagan ang teksto ng ‘harap.’
- source_word: הַמִּצְנֶפֶת
  choice: turbante
  rationale: Ito ang tiyak na pantakip sa ulo ng punong pari; pamilyar at tumpak ang ‘turbante’ sa modernong Filipino.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Pinananatili ang paulit-ulit na pormula ng pagtupad at ang personal na pangalang YHWH.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Tinutukoy ng mga panghalip sa layuning sugnay
  choice: Ang ‘ito’ ay tumutukoy sa banal na plaka na ilalagay sa turbante sa pamamagitan ng panali
  alternative: Ang panali mismo ang bagay na inilalagay sa ibabaw ng turbante
  rationale: Mas malamang ayon sa konteksto ng naunang talata at sa tungkulin ng panali na ang plaka ang inilalagay sa turbante, ngunit hindi pinangalanang muli ng Hebreo ang bagay.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘rito’ para sa naunang binanggit na banal na plaka, ‘panaling sinulid’ upang ipakita kapwa ang materyal at gamit, at ‘turbante’ bilang malinaw na katawagan sa pantakip sa ulo ng punong pari.
