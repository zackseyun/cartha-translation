revisions:
- from: Ikinabit nila ang pektoral, mula sa mga argolya nito hanggang sa mga argolya ng efod, gamit ang panaling asul[a], upang manatili ito sa ibabaw ng mahusay na hinabing sinturon[b] ng efod at hindi humiwalay ang pektoral mula sa ibabaw ng efod, gaya ng iniutos ni Yahweh kay Moises.
  to: Ikinabit nila ang pektoral sa mga argolya ng efod sa pamamagitan ng mga argolya nito, gamit ang asul na panali[a], upang ito ay nasa ibabaw ng mahusay na hinabing sinturon[b] ng efod at upang hindi humiwalay ang pektoral mula sa ibabaw ng efod, gaya ng iniutos ni Yahweh kay Moises.
