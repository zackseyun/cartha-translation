base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Ikinabit nila ang pektoral sa mga argolya ng efod sa pamamagitan ng mga argolya nito, gamit ang asul na panali[a], upang ito ay nasa ibabaw ng mahusay na hinabing sinturon[b] ng efod at upang hindi humiwalay ang pektoral mula sa ibabaw ng efod, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panaling yari sa asul na sinulid.”
    reason: Pinahihintulutan ng pariralang Hebreo na bigyang-diin ang kulay ng panali o ang tinina nitong materyal.
  - marker: b
    text: O “hinabing bigkis”; tumutukoy ang salitang Hebreo sa hinabi at dekoradong bahaging nakakabit sa efod.
    reason: Teknikal ang katawagan sa kasuotang pansaserdote, at maaaring ilarawan bilang sinturon, bigkis, o hinabing banda.
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: ikinabit nila
  rationale: Ipinahihiwatig ng pandiwa ang matibay na pagkakabit ng dalawang bahagi ng kasuotang pansaserdote; natural at tiyak sa modernong Tagalog ang “ikinabit.”
- source_word: הַחֹשֶׁן
  choice: ang pektoral
  rationale: Teknikal itong bahagi ng kasuotan ng punong pari na nakapatong sa dibdib. Iniiwasan ng “pektoral” ang maling pahiwatig ng kagamitang pandigma na maaaring idulot ng “baluti sa dibdib.”
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: mula sa mga argolya nito hanggang sa mga argolya ng efod
  rationale: Pinananatili nito ang direksiyon ng dalawang pang-ukol sa Hebreo habang malinaw na ang mga argolya ang mga puntong pinagkakabitan.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: gamit ang panaling asul
  rationale: Ang פְתִיל ay panali o pisi, at ang תְּכֵלֶת ay tumutukoy sa asul na kulay o sinulid na tinina nito. Maikli at natural ang pangunahing salin, habang inilalahad sa talababa ang posibleng materyal na diwa.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: mahusay na hinabing sinturon ng efod
  rationale: Sa kontekstong ito, ang חֵשֶׁב ay ang dekorado at hinabing bigkis o sinturong nakakabit sa efod. Ipinapahayag ng salin ang pagkakahabi at gamit nito nang hindi labis na teknikal.
- source_word: וְלֹא יִזַּח ... מֵעַל הָאֵפֹד
  choice: hindi humiwalay ang pektoral mula sa ibabaw ng efod
  rationale: Ang pandiwa ay nagsasaad ng pagkalas o pag-alis mula sa wastong puwesto; pinananatili ng “mula sa ibabaw” ang tahasang spatial na diwa ng מֵעַל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa transliterasyon ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa isang kinikilalang modernong transliterasyon nang hindi ito ginagawang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang mga kinikilalang teknikal na katawagang “pektoral” at “efod,” samantalang ginawang malinaw sa konteksto at talababa ang hindi pamilyar na bahagi ng kasuotan.
