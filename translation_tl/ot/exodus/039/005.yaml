revisions:
- from: Ang mahusay na hinabing bigkis ng kaniyang efod[a], na nasa ibabaw nito, ay kabahagi mismo nito at kapareho nito ang pagkakayari—ginto, asul, purpura, sinulid na iskarlata, at pinong linong pinilipit—ayon sa iniutos ni Yahweh kay Moises.
  to: Ang mahusay na hinabing bigkis ng kaniyang efod[a], na nasa ibabaw ng efod, ay bahagi mismo ng efod at ginawa rin ito sa katulad na paraan, mula sa ginto, asul, purpura, sinulid na iskarlata, at pinong pinilipit na lino, ayon sa iniutos ni Yahweh kay Moises.
  rationale: Inayos ang sintaks upang ang “mula sa” ay malinaw na tumukoy sa paggawa ng bigkis, hindi sa “pagkakayari.” Nilinaw rin ang reperent ng “nito” sa pamamagitan ng pag-uulit ng “efod,” nang hindi binabago ang ugnayang “nasa ibabaw” na nasa Hebreo. Pinanatili ng footnote ang alternatibong mas literal na “mula rito” at ang integral na kaugnayan ng bigkis sa efod.
