base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: tl
  text: Ang mahusay na hinabing bigkis ng kaniyang efod[a], na nasa ibabaw ng efod, ay bahagi mismo ng efod at ginawa rin ito sa katulad na paraan, mula sa ginto, asul, purpura, sinulid na iskarlata, at pinong pinilipit na lino, ayon sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang pinalamuting bigkis ng kaniyang efod … ay mula rito at kapareho nito ang pagkakayari.” Idiniriin ng Hebreo na ang bigkis ay bahagi mismo ng efod at katulad nito ang pagkakagawa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: mahusay na hinabing bigkis
  rationale: Tumutukoy ito sa hinabing bigkis na kaugnay ng efod. Ipinahahayag ng salin ang anyong tela at ang mahusay na pagkakayari nito nang hindi ginagawang teknikal o lipas ang pananalita.
- source_word: אֲפֻדָּתוֹ
  choice: kaniyang efod
  rationale: Pinananatili ang panghalip na panlalaking isahan at ang teknikal na pangalan ng kasuotang pangpari.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa ibabaw nito
  rationale: Tuwirang ipinapahayag ang lokasyon ng bigkis sa efod; hindi tahasang idinaragdag na ikinabit ito sapagkat hindi iyon eksaktong sinasabi ng parirala.
- source_word: מִמֶּנּוּ הוּא
  choice: ay kabahagi mismo nito
  rationale: Ipinahihiwatig ng Hebreo na ang bigkis ay integral sa efod at hindi isang hiwalay na piraso. Ang 'kabahagi mismo nito' ay natural sa Filipino at hindi labis na tumutukoy sa paraan ng paggawa.
- source_word: כְּמַעֲשֵׂהוּ
  choice: kapareho nito ang pagkakayari
  rationale: Pinananatili ang diwa na magkatugma ang pagkakagawa o workmanship ng bigkis at ng efod.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: ginto, asul, purpura, sinulid na iskarlata
  rationale: Karaniwan at madaling maunawaang mga tawag sa mga materyal at kulay. Nilinaw ang tekstil na diwa ng תוֹלַעַת שָׁנִי sa pamamagitan ng 'sinulid na iskarlata.'
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili kapuwa ang mataas na uri ng lino at ang pagkakapilipit ng hibla o sinulid.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ayon sa iniutos ni Yahweh kay Moises
  rationale: Natural na pormula sa Filipino para sa pagsunod sa naunang utos, habang tuwirang inilalahad ang pangalang tipan na יְהוָה bilang 'Yahweh.'
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang taglay ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng 'Yahweh' ang natatanging pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, marangal, at malinaw na Filipino. Pinanatili ang teknikal na salitang “efod” dahil wala itong eksaktong karaniwang katumbas; ginawang natural ang sintaks habang iniingatan ang bahagyang pag-uulit at ugnayan ng mga panghalip sa Hebreo.
