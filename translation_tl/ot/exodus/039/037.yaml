translation:
  language: tl
  text: ang dalisay na patungan ng ilawan, ang mga ilawan nito—ang mga ilawang nakahanay[a]—at ang lahat ng kagamitan nito, at ang langis para sa ilaw,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga ilawang inayos sa wastong hanay.” Binibigyang-diin ng pariralang Hebreo נֵרֹת הַמַּעֲרָכָה ang maayos na pagkakahilera ng mga ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: patungan ng ilawan
  rationale: Tumutukoy ang מְנוֹרָה sa patungan na kinalalagyan ng mga ilawan, hindi lamang sa isang ilawan. Malinaw ito sa modernong Filipino at hindi nangangailangan ng transliterasyong “menora.”
- source_word: הַטְּהֹרָה
  choice: dalisay
  rationale: Sa konteksto ng kagamitan sa santuwaryo, ipinahihiwatig ng טָהוֹר ang kadalisayang ritwal at materyal. Ang “dalisay” ay angkop din sa paglalarawan sa gintong patungan ng ilawan.
- source_word: נֵרֹתֶיהָ
  choice: mga ilawan nito
  rationale: Ang נֵר ay maaaring tumukoy sa ilawan o liyab nito; sa talaan ng mga kagamitan ng tabernakulo, tumutukoy ito sa bawat ilawang kabilang sa patungan.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: mga ilawang inayos ayon sa takdang hanay
  rationale: Ipinahihiwatig ng מַעֲרָכָה ang maayos o itinakdang pagkakahilera. Pinananatili ng salin ang ideya ng itinakdang ayos habang natural na nauunawaan sa Filipino.
- source_word: כָּל כֵּלֶיהָ
  choice: lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי at maaaring mangahulugang kasangkapan, sisidlan, o kagamitan. Hindi labis na tinutukoy ng “kagamitan” kung anu-anong bagay ang kabilang dito.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: langis para sa ilaw
  rationale: Ang pariralang konstrakto ay tumutukoy sa langis na ginagamit sa pagbibigay-liwanag. Malapit ito sa Hebreo at angkop sa pormal na talaan.
