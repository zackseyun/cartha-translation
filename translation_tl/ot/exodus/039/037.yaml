  terminology: Ang “patungan ng ilawan,” “dalisay,” “kagamitan,” at “langis para sa ilaw” ay angkop at hindi labis na nagpapakahulugan. Pinananatili ang pagkakaiba ng patungan at ng mga ilawan nito.
