translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino, habang pinananatili ang anyong talaan at ang pag-uulit sa Hebreo. Ginamit ang “patungan ng ilawan” sa halip na transliterasyong “menora” para sa agarang linaw.
