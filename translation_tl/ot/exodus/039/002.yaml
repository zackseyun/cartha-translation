  yaml_path: translation/ot/exodus/039/002.yaml
  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: tl
  text: At ginawa niya ang efod[a] mula sa ginto, sinulid na asul at lila, sinulid na iskarlata,[b] at pinong linong pinilipit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang efod ay isang natatanging kasuotang pangpari sa sinaunang Israel.
    reason: cultural_term
  - marker: b
    text: Ang Hebreong parirala ay tumutukoy sa materyal na tinina sa iskarlata; maaari rin itong isaling “matingkad na pula.”
    reason: lexical_alternative
  - marker: c
    text: Tradisyonal ding isinasalin na “pinong linong pinagsalikop ang mga hibla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay. Pinananatili ng “At ginawa niya” ang payak at sunod-sunod na kilos ng teksto.
- source_word: אֶת
  choice: '[pananda ng tiyak na layon; hindi isinalin]'
  rationale: Minamarkahan nito ang הָאֵפֹד bilang tiyak na layon ng pandiwa, ngunit wala itong likas na hiwalay na katumbas sa Tagalog.
- source_word: הָאֵפֹד
  choice: ang efod
  rationale: Ang אֵפֹד ay isang natatanging kasuotang kaugnay ng paglilingkod ng pari. Ang transliterasyong “efod” ay mas tumpak kaysa sa isang paliwanag na maaaring labis na magtakda sa eksaktong anyo nito.
- source_word: זָהָב
  choice: mula sa ginto
  rationale: Karaniwang pangngalan para sa ginto bilang materyal. Hindi idinagdag sa pangunahing teksto ang “sinulid na ginto,” sapagkat “ginto” lamang ang tahasang sinasabi sa talatang ito, bagaman ipinapaliwanag ng kasunod na konteksto kung paano ito ginawang sinulid.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Tumutukoy ito sa mamahaling materyal na tinina ng asul na ginagamit sa mga tela ng santuwaryo. Idinagdag ang “sinulid” ayon sa kontekstong pantela upang maging malinaw at natural sa Tagalog.
- source_word: וְאַרְגָּמָן
  choice: lila
  rationale: Ang “lila” ay natural at madaling maunawaang modernong Tagalog para sa kulay na tinutukoy ng terminong ito; nakikibahagi ito sa salitang “sinulid” sa magkakaugnay na talaan.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: at matingkad na pula
  rationale: Ang parirala ay tumutukoy sa materyal na tinina sa matingkad na pula o scarlet. Pinananatili ang kulay nang hindi ipinapasok sa pangunahing teksto ang pinagmulan ng tina.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: at sa pinong linong pinilipit
  rationale: Ang שֵׁשׁ ay pinong lino at inilalarawan ng מָשְׁזָר bilang pinilipit o pinagtuhog-tuhog na hibla. Ang “pinong linong pinilipit” ay malinaw at pinananatili ang dalawang sangkap ng parirala.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Tagalog. Pinanatili ang teknikal na terminong “efod” at ipinaliwanag ito sa talababa. Inayos ang talaan ng mga materyal sa natural na sintaks ng Tagalog, habang iniwasang gawing tahasang “sinulid na ginto” ang זָהָב dahil “ginto” lamang ang nakasaad sa mismong talata.
