  yaml_path: translation/ot/exodus/039/035.yaml
  text: the ark of the testimony[a], its poles, and the mercy seat.
translation:
  language: tl
  text: ang kaban ng patotoo, ang mga pingga nito, at ang luklukan ng awa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pantakip na pantubos.” Ang salitang Hebreo ay tumutukoy sa takip ng kaban at may kaugnayan sa pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֹן
  choice: kaban
  rationale: Karaniwang tawag sa Filipino para sa sagradong sisidlan sa konteksto ng tabernakulo; malinaw at hindi lipas ang wika.
- source_word: הָעֵדֻת
  choice: ng patotoo
  rationale: Tuwirang pinananatili ang diwa ng עֵדוּת bilang ‘patotoo’ o ‘saksi’ at ang kaugnayan ng kaban sa mga tapyas na nagsisilbing patotoo.
- source_word: בַּדָּיו
  choice: ang mga pingga nito
  rationale: Sa kontekstong ito, tumutukoy ang בַּד sa mahahabang pinggang ginagamit sa pagbubuhat ng kaban.
- source_word: הַכַּפֹּרֶת
  choice: ang luklukan ng awa
  rationale: Nakaugaliang katawagan sa Filipino para sa gintong takip ng kaban na may kaugnayan sa pagtubos; nililinaw sa talababa ang mas literal na paglalarawan dito bilang takip.
theological_decisions:
- issue: Pagsasalin ng כַּפֹּרֶת bilang kagamitang panritwal
  choice: luklukan ng awa
  alternative: pantakip na pantubos; takip
  rationale: Pinananatili ng ‘luklukan ng awa’ ang kinikilalang katawagan at ang panritwal na kahulugan ng bagay, samantalang inilalahad sa talababa ang alternatibong nagbibigay-diin na ito ang takip ng kaban. Hindi nito nilulutas nang labis ang ugnayang leksikal nito sa pagtubos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng talaan sa pinagmulang talata at ang tradisyonal ngunit nauunawaang terminolohiyang panritwal.
