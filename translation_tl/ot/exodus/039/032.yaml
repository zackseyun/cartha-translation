  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: tl
  text: Sa gayon, natapos ang lahat ng gawain sa tabernakulo[a], ang tolda ng pakikipagtagpo; at ginawa ng mga Israelita[b] ang lahat ayon sa iniutos ni Yahweh kay Moises—ganoon ang ginawa nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “tirahan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: natapos
  rationale: Ipinahahayag ng pandiwang כלה ang ganap na pagkumpleto ng gawain; natural sa Filipino ang “natapos” at nananatili ang pokus sa gawain.
- source_word: כָּל עֲבֹדַת
  choice: ang lahat ng gawain
  rationale: Pinananatili ang komprehensibong diin ng כָּל at ang kahulugan ng עֲבֹדָה bilang gawaing pagtatayo at paggawa sa kontekstong ito.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Ito ang nakikilalang katawagan sa naililipat na santuwaryo sa Exodo, samantalang ipinapaliwanag sa talababa ang literal na diwang “tirahan.”
- source_word: אֹהֶל מוֹעֵד
  choice: ang tolda ng pakikipagtagpo
  rationale: Tuwirang ipinapakita nito ang toldang itinalaga bilang dako ng pakikipagtagpo; iniiwasan ang “Toldang Tipanan,” na maaaring mapagkamalang salin ng ibang salitang Hebreo para sa tipan.
- source_word: וַיַּעֲשׂוּ
  choice: ginawa
  rationale: Dito, ibinubuod ng עשה ang pagsunod ng Israel sa iniutos, kaya ang karaniwang “ginawa” ay angkop.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na pambansang katawagan sa modernong Filipino; inilalagay sa talababa ang literal na anyong pampamilya ng Hebreo.
- source_word: כְּכֹל אֲשֶׁר
  choice: ang lahat ayon sa
  rationale: Ipinahahayag nito ang lubos na pagsunod at pagkakaayon sa buong utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang aspektong naganap na ng “iniutos” ay malinaw na nagpapakitang nauna ang utos sa natapos na gawain nang hindi kailangang dagdagan ang teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatunog ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כֵּן עָשׂוּ
  choice: ganoon nga ang ginawa nila
  rationale: Pinananatili ang pangwakas na pag-uulit ng Hebreo at ang diin nito sa eksaktong pagsunod; ang “nga” ay likas na nagpapatingkad nito sa Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan ang nasa tekstong Hebreo, hindi ang titulong אֲדֹנָי; pinananatili ng “Yahweh” ang pagkakaibang iyon.
- issue: Korporatibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Ang parirala ay pambansang katawagan sa buong Israel sa konteksto. Mas natural sa Filipino ang “mga Israelita,” habang ang literal na anyo ay inilalahad sa talababa upang hindi maitago ang Hebreong pananalita.
- issue: Pagpapanatili sa pag-uulit ng pagsunod
  choice: ganoon nga ang ginawa nila
  alternative: alisin bilang kalabisan
  rationale: Sadyang inuulit ng Hebreo ang עשה upang idiin ang ganap na pagsunod; hindi ito dapat pakinisin o alisin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabernakulo” bilang nakikilalang terminong biblikal, ngunit ipinaliwanag ang literal na diwa nito. Ang “tolda ng pakikipagtagpo” ay mas tumpak sa אֹהֶל מוֹעֵד kaysa “Toldang Tipanan.” Pinanatili ang mariing pangwakas na pag-uulit ng Hebreo.
