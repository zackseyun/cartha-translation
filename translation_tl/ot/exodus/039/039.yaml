    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח
  choice: altar
  rationale: Karaniwan at malinaw sa makabagong Filipino ang “altar.” Bagaman ito ang altar para sa handog na sinusunog, ang Hebreo sa talatang ito ay gumagamit lamang ng pangkalahatang salitang “altar.”
- source_word: הַנְּחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze. “Tanso” ang likas at nakaugaliang katumbas sa Filipino para sa metal na ginagamit sa mga kagamitan ng tabernakulo, nang hindi nagpapanggap ng higit na katiyakan sa eksaktong haluang metal.
- source_word: מִכְבַּר
  choice: parilya
  rationale: Tumutukoy ito sa sala-sala o rehas na kaugnay ng altar. Malinaw sa karaniwang mambabasa ang “parilya” bilang isang metal na sala-sala.
- source_word: אֲשֶׁר לוֹ
  choice: na para rito
  rationale: Iniuugnay ng parirala ang parilya sa altar nang hindi tiyak na sinasabi kung eksakto itong nasa ibabaw, loob, o gilid nito.
- source_word: בַּדָּיו
  choice: mga pingga nito
  rationale: Ang mga בַּדִּים ay mahahabang pinggang ginagamit sa pagbubuhat ng mga kagamitan ng tabernakulo. Maikli at natural ang “mga pingga nito” sa konteksto.
- source_word: כָּל־כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כֵּלִים at maaaring tumukoy sa sari-saring kasangkapan o kagamitan. Ang “kagamitan” ay natural at hindi labis na nagpapakitid sa kahulugan.
- source_word: כִּיֹּר
  choice: hugasan
  rationale: Tumutukoy ito sa sisidlang ginagamit sa paghuhugas. Mas madaling maunawaan sa modernong Filipino ang “hugasan” kaysa sa isang makaluma o hiniram na teknikal na termino.
- source_word: כַּנּוֹ
  choice: patungan nito
  rationale: Tumutukoy ang כֵּן sa suportang kinatatayuan o saligan ng hugasan. Inilalarawan nang natural ng “patungan” ang gamit nito.
