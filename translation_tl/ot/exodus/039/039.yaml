translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong bahagi ng isang talaan at ang pangwakas na tuldok-kuwit. Inilagay ang [a] pagkatapos ng “parilya,” sapagkat ang mga alternatibo sa talababa ay tumutukoy sa מִכְבַּר, hindi sa altar.
