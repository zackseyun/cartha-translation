  source_fidelity: Naisasalin ng draft ang tatlong uri ng kasuotang pari at ang mga materyal na שֵׁשׁ at מָשְׁזָר. Gayunman, ang “sumbrero” ay masyadong pangkaraniwan para sa mga natatanging pantakip sa ulo sa kontekstong pangkulto, at ang pagbuo ng huling parirala ay maaaring gawing higit na malinaw nang hindi inaalis ang kalabuan ng saklaw nito.
  naturalness: Marangal ang pangkalahatang rehistro, ngunit mas natural at mas angkop sa konteksto ang “mga mariringal na takip sa ulo” kaysa “mariringal na sumbrero.” Ang “pinong linong pinilipit” ay maaaring gawing “pinong lino na pinilipit.”
  terminology: Ang “turbante” ay angkop para sa מִצְנֶפֶת. Para sa פַּאֲרֵי הַמִּגְבָּעוֹת, ang “mga mariringal na takip sa ulo” ay mas tumpak sa rehistrong ritwal kaysa “sumbrero.” Ang “mga panloob na kasuotan” ay malinaw para sa מִכְנְסֵי הַבָּד; ang “pinong lino na pinilipit” ay maingat na naghahatid ng מָשְׁזָר.
