translation:
  language: tl
  text: ang turbante na pinong lino, ang mga mariringal na takip sa ulo na pinong lino, at ang mga panloob na kasuotang yari sa lino—pinong lino na pinilipit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “at ang mga panloob na kasuotang yari sa pinong lino na pinilipit.” Dahil sa ayos ng mga salita sa Hebreo, ang huling pariralang “pinong lino na pinilipit” ay maaaring iugnay lalo na sa huling kasuotan, bagaman inuulit din nito ang paglalarawan sa materyal na ginagamit sa mga kasuotang pang-pari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: ang turbante
  rationale: Tumutukoy ito sa natatanging pantakip sa ulo ng punong pari; ang “turbante” ang malinaw at kinikilalang katawagan sa kontekstong ito.
- source_word: שֵׁשׁ
  choice: pinong lino
  rationale: Ipinahihiwatig ng salita ang mataas na uri ng lino, hindi lamang lino sa pangkalahatan.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: ang mariringal na sumbrero
  rationale: Ang parirala ay naglalarawan sa mga sumbrero ng mga pari bilang maringal o pampalamuti; natural sa modernong Tagalog ang “mariringal na sumbrero.”
- source_word: מִכְנְסֵי הַבָּד
  choice: ang mga panloob na kasuotang yari sa lino
  rationale: Ang מִכְנָסַיִם ay kasuotang pantakip sa ibabang bahagi ng katawan. Iniiwasan ng “panloob na kasuotan” ang makalumang katawagan at malinaw na ipinapahayag ng “yari sa lino” ang materyal.
- source_word: מָשְׁזָר
  choice: pinilipit
  rationale: Inilalarawan nito ang paggawa sa sinulid sa pamamagitan ng pagpilipit o pagtitirintas; ang “pinilipit” ay tuwiran at madaling maunawaan.
