  yaml_path: translation/ot/exodus/039/027.yaml
  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: tl
  text: Ginawa nila ang mga tunika na yari sa pinong lino, na gawa sa paghahabi, para kay Aaron at sa kanyang mga anak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ginawa nila
  rationale: Likas na salaysay sa modernong Tagalog para sa Qal wayyiqtol ng עשה; hindi kailangang isalin nang tahasan ang panimulang waw.
- source_word: הַכָּתְנֹת
  choice: ang mga tunika
  rationale: Tiyak na tumutukoy sa kasuotang pambalot sa katawan; mas eksakto kaysa sa pangkalahatang “mga kasuotan.”
- source_word: שֵׁשׁ
  choice: mula sa pinong lino
  rationale: Sa konteksto ng tabernakulo at kasuotang pangpari, tumutukoy ito sa de-kalidad na pinong lino; nilinaw ng “mula sa” na ito ang materyales.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: na hinabi ng isang manghahabi
  rationale: Natural na Tagalog na pinananatili ang diin ng Hebreo sa paraang paghabi at sa kasanayan ng manggagawa.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: para kay Aaron at sa kanyang mga anak
  rationale: Tumpak na ipinapahayag ang mga pinaglaanan ng mga tunika at ang ugnayang pampamilya.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “tunika” bilang tiyak na katawagan sa sinaunang kasuotan; inayos ang pagkakasunod ng mga parirala upang maging natural sa Tagalog habang pinananatili ang lahat ng impormasyon ng Hebreo.
