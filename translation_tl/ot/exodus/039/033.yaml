  - severity: low
    issue: Hindi inuulit sa pangunahing teksto ang “nito” sa bawat kasunod na bahagi ng talaan.
    rationale: Bagaman nauunawaan mula sa konteksto, inuulit ng Hebreo ang panghalip-pantaglay sa bawat item. Ang pag-uulit sa Tagalog ay nananatiling natural at nagpapalinaw ng saklaw.
