base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/033.yaml
  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: tl
  text: 'Pagkatapos, dinala nila kay Moises ang tabernakulo—ang tolda at ang lahat ng kagamitan nito: ang mga pangkabit nito, ang mga balangkas nito[a], ang mga pahalang na biga nito, ang mga haligi nito, at ang mga tuntungan nito[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla.” Ang salitang Hebreo ay tumutukoy sa mga patayong sangkap ng estruktura ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: O “mga suksukan.” Ang salitang Hebreo ay maaaring tumukoy sa mga piyesang pundasyon na pinagsusuksukan ng mga balangkas o haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Pagkatapos, dinala nila
  rationale: Ang wayyiqtol na Hiphil ng בוא ay nagsasaad ng kasunod na kilos sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” para sa ganitong pagkakasunod-sunod.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ito ang kinikilalang katawagan sa sagradong naililipat na tahanan sa konteksto ng Exodo; iniiwasan nitong ipagkamali ang buong estruktura sa karaniwang tolda lamang.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Tuwirang ipinahihiwatig ng אֶל ang direksiyon patungo sa isang tao.
- source_word: הָאֹהֶל
  choice: ang tolda
  rationale: Karaniwang kahulugan ng אֹהֶל ang “tolda.” Dito, tinutukoy nito ang bahaging tolda ng tabernakulo nang hindi dinaragdagan ang detalye ng Hebreo.
- source_word: כָּל כֵּלָיו
  choice: ang lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga kasangkapan, kagamitan, at mga sangkap ng estruktura. Ang “kagamitan” ay malinaw at sapat na malawak.
- source_word: קְרָסָיו
  choice: ang mga pang-ipit nito
  rationale: Ang קְרָסִים ay mga pandugtong na ginagamit upang pag-ugnayin ang mga tabing. Ipinahahayag ng “pang-ipit” ang gamit nito sa natural na Tagalog.
- source_word: קְרָשָׁיו
  choice: ang mga balangkas
  rationale: Tumutukoy ang salita sa mga patayong sangkap ng estruktura. Mas malinaw sa kasalukuyang Tagalog ang “mga balangkas” kaysa sa simpleng “mga tabla,” habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: בריחו
  choice: ang mga pahalang na biga
  rationale: Ang בְּרִיחַ ay mga bigang nagdurugtong at nagpapatatag sa mga balangkas. Nililinaw ng “pahalang” ang tungkulin ng mga ito sa estruktura.
- source_word: עַמֻּדָיו
  choice: ang mga haligi
  rationale: Ang עַמּוּד ay patayong suportang estruktural; “haligi” ang malinaw at kinikilalang katumbas sa Tagalog.
- source_word: אֲדָנָיו
  choice: ang mga patungan
  rationale: Sa paglalarawan ng tabernakulo, ang אֶדֶן ay pundasyong piyesa o socket na pinagsusuksukan ng mga balangkas o haligi. Natural at malinaw ang “patungan,” samantalang nasa talababa ang mas teknikal na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Pinanatili ang kinikilalang terminong “tabernakulo,” at gumamit ng karaniwang mga salitang pang-estruktura. Inilagay ang mga panandang [a] at [b] sa mismong mga salitang tinutukoy ng kani-kanilang talababa.
