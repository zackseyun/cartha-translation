revisions:
- from: 'Pagkatapos, dinala nila kay Moises ang tabernakulo—ang tolda at ang lahat ng kagamitan nito: ang mga pang-ipit nito, ang mga balangkas[a], ang mga pahalang na biga, ang mga haligi, at ang mga patungan[b].'
  to: 'Pagkatapos, dinala nila kay Moises ang tabernakulo—ang tolda at ang lahat ng kagamitan nito: ang mga pangkabit nito, ang mga balangkas nito[a], ang mga pahalang na biga nito, ang mga haligi nito, at ang mga tuntungan nito[b].'
  rationale: Pinalitan ang hindi gaanong tiyak na “mga patungan” ng “mga tuntungan” upang mas maipahayag ang mga base ng estruktura. Ginawang “mga pangkabit” ang “mga pang-ipit” bilang mas malawak na katumbas ng mga clasp, at inulit ang “nito” para sa malinaw na pagtukoy sa bawat bahagi, alinsunod sa Hebreo.
