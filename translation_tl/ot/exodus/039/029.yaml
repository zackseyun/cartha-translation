  text: וְֽ/אֶת הָ/אַבְנֵ֞ט שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י מַעֲשֵׂ֣ה רֹקֵ֑ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: at ang pamigkis[a] na yari sa pinong linong pinilipit at sa mga sinulid na asul, purpura, at iskarlata[b]—gawa ng isang mangbuburda—ayon mismo sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sinturon” o “bigkis sa baywang.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong ekspresyon ay tumutukoy sa materyal na tinina ng iskarlata; maaari rin itong isaling “krimson.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: ang pamigkis
  rationale: Tumutukoy ito sa pamigkis o sinturong bahagi ng kasuotang saserdote. Ang “pamigkis” ay marangal at angkop sa konteksto nang hindi nagiging labis na teknikal.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili nito kapuwa ang uri ng tela (pinong lino) at ang pagkakayari nito (pinilipit o pinagsalikop na hibla).
- source_word: תְכֵלֶת
  choice: sinulid na asul
  rationale: Sa konteksto ng mga telang pangtabernakulo, tumutukoy ito sa mamahaling materyal na tinina ng asul; nilinaw ang ipinahihiwatig na materyal bilang sinulid.
- source_word: אַרְגָּמָן
  choice: sinulid na purpura
  rationale: Ang “purpura” ay karaniwang katawagan sa marangal na kulay ng tinina nilang tela at pinananatili ang natatanging kulay nito.
- source_word: תוֹלַעַת שָׁנִי
  choice: sinulid na iskarlata
  rationale: Tumutukoy ang parirala sa materyal na tinina ng matingkad na pula; ang “sinulid” ay tahasang idinagdag mula sa kontekstong pantela.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: gawa ng isang mangbuburda
  rationale: Pinananatili nito ang diin sa dalubhasang manggagawa at sa pandekorasyong pagkakayari ng tela.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ayon mismo sa iniutos ni Yahweh kay Moises
  rationale: Ipinakikita ng “ayon mismo” ang eksaktong pagsunod na binibigyang-diin ng paulit-ulit na pormulang ito sa Exodo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang anyong karugtong ng pangungusap sa pagsisimula sa “at,” gaya ng Hebreo at ng konteksto ng talaan. Ginamit ang “lino,” “purpura,” at “iskarlata” bilang malinaw na mga terminong pantela, at nilinaw ang magkakatulad na serye sa pamamagitan ng “mga sinulid.”
