translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang teknikal na terminong “efod,” ngunit ipinaliwanag sa mga pasyang leksikal. Ginamit ang “pirasong pantakip sa dibdib” upang maging malinaw sa karaniwang mambabasa at maiwasan ang maling larawan ng metal na baluti.
