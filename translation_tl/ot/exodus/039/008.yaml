base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: tl
  text: 'Ginawa niya ang pantakip sa dibdib[a], na gawa ng masining na manggagawa, katulad ng pagkakagawa ng efod: yari sa ginto, sinulid na asul, lila, at iskarlata, at pinong linong pinilipit.


    [a] Tradisyonal na “pektoral” o “baluti sa dibdib.” Tumutukoy ito sa isang kasuotang pansaserdote na nakaugnay sa efod, hindi sa baluting metal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na “pektoral” o “baluti sa dibdib.” Tumutukoy ito sa isang kasuotang pansaserdote na nakaugnay sa efod, hindi sa baluting metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay at likas na isinasalin sa payak na nagdaang kilos; hindi kailangang tahasang idagdag ang pangatnig sa Filipino.
- source_word: הַחֹשֶׁן
  choice: ang pirasong pantakip sa dibdib
  rationale: Tumutukoy ito sa natatanging kasuotang pansaserdote na nakakabit sa efod. Iniiwasan ng saling ito ang pahiwatig ng baluting metal na maaaring idulot ng “baluti sa dibdib,” habang nananatiling madaling maunawaan.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: isang gawa ng bihasang tagahabi
  rationale: Ipinahihiwatig ng parirala ang dalubhasa at masining na paggawa ng disenyong hinabi. Ang “tagahabi” ay angkop sa konteksto ng mga sinulid at lino, bagaman maaari ring unawain ang חֹשֵׁב bilang bihasang tagadisenyo.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: na gaya ng pagkakagawa sa efod
  rationale: Pinananatili ang paghahambing ng pagkakayari ng pantakip sa dibdib at ng efod, sa natural na ayos ng Filipino.
- source_word: אֵפֹד
  choice: efod
  rationale: Teknikal itong katawagan sa kasuotang pansaserdote at walang eksaktong katumbas sa Filipino; pinananatili ang transliterasyon upang hindi mawala ang tiyak na reperensiya.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Sa kontekstong tekstil, tumutukoy ito sa materyal na tinina ng asul; ang “sinulid” ay nilinaw para sa listahan ng mga sangkap.
- source_word: וְאַרְגָּמָן
  choice: lila
  rationale: Karaniwang katumbas ng kulay o materyal na tinina ng purpura sa mga tekstil ng tabernakulo; saklaw ito ng naunang “sinulid na.”
- source_word: וְתוֹלַעַת שָׁנִי
  choice: iskarlata
  rationale: Tumutukoy sa sinulid o materyal na tinina ng matingkad na pula. Pinili ang nakikilalang terminong “iskarlata,” na saklaw rin ng naunang “sinulid na.”
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: at pinong linong pinilipit
  rationale: Ang שֵׁשׁ ay pinong lino at ang מָשְׁזָר ay nagsasaad ng sinulid na pinilipit o tinuwid nang magkakasama; pinananatili ang detalye ng pagkakayari.
