revisions:
- from: Gumawa sila ng dalawang singsing na ginto at ikinabit ang mga iyon sa magkabilang dulo ng pektoral, sa gilid nitong nakaharap sa epod, sa dakong panloob.[a]
  to: Gumawa sila ng dalawang singsing na ginto at inilagay ang mga iyon sa magkabilang dulo ng pektoral, sa panloob na bahagi ng gilid nito na nakaharap sa epod.[a]
  rationale: Pinalitan ang “ikinabit” ng “inilagay” upang mas malapit sa pandiwang Hebreo. Inayos ang huling pariralang panlunan upang malinaw na ang mga singsing ay nasa panloob na bahagi ng gilid ng pektoral, samantalang ang talababa ay nagpapanatili sa posibleng saling “nasa tapat ng epod” para sa malawak na saklaw ng אֶל עֵבֶר.
