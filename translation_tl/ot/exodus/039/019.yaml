  - severity: medium
    issue: Medyo alanganin ang saklaw at daloy ng “sa dakong panloob.”
    rationale: Ang בָּיְתָה ay direksiyonal na “paloob/sa panloob na bahagi.” Dapat itong iugnay nang mas malinaw sa gilid/posisyon ng pektoral, habang pinananatili ang hindi ganap na tiyak na ugnayan ng אֶל עֵבֶר הָאֵפֹד.
