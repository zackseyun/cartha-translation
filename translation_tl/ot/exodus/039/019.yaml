translation:
  language: tl
  text: Gumawa sila ng dalawang singsing na ginto at inilagay ang mga iyon sa magkabilang dulo ng pektoral, sa panloob na bahagi ng gilid nito na nakaharap sa epod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sa gilid nito na nasa tapat ng epod, paloob.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: mga singsing na ginto
  rationale: Likas sa modernong Filipino at malinaw na tumutukoy sa mga singsing na pangkabit at sa materyal ng mga ito.
- source_word: הַחֹשֶׁן
  choice: pektoral
  rationale: Tumutukoy sa natatanging kasuotang nakapatong sa dibdib ng punong pari; iniiwasan nito ang maling pahiwatig ng baluting maaaring idulot ng “baluti sa dibdib.”
- source_word: שְׂפָתוֹ
  choice: gilid nito
  rationale: Ang שָׂפָה ay literal na labi ngunit tumutukoy rito sa gilid o hangganan ng ginawang bagay.
- source_word: שְׁנֵי קְצוֹת
  choice: magkabilang dulo
  rationale: Natural na Filipino para sa dalawang dulo, nang hindi ipinapalagay na mga sulok ang tinutukoy.
- source_word: וַיָּשִׂימוּ עַל
  choice: ikinabit ... sa
  rationale: Sa konteksto ng paggawa ng kasuotang pansaserdote, ipinahihiwatig ng paglalagay ng mga singsing na inilagay o ikinabit ang mga ito sa pektoral.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: nakaharap sa epod
  rationale: 'Pinananatili ang ugnayang panlunan: ang gilid ay nakatuon o nakaharap sa epod, nang hindi labis na nililinaw ang bahagyang malawak na saklaw ng עֵבֶר.'
- source_word: בָּיְתָה
  choice: sa dakong panloob
  rationale: Ang direksiyonal na anyo mula sa בַּיִת ay nangangahulugang paloob o sa panloob na bahagi; malinaw at natural ito sa Filipino.
