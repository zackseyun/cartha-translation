translation:
  language: tl
  text: Gumawa sila para rito ng mga bahaging pambalikat na ikinakabit sa dalawang dulo nito; sa gayon ay pinagdugtong ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: mga bahagi sa balikat
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mga bahaging nakapatong sa balikat at nag-uugnay sa mga seksiyon ng efod. Likas sa modernong Filipino ang “mga bahagi sa balikat” at hindi nito ipinapalagay na tiyak na mga panali ang mga ito.
- source_word: עָשׂוּ
  choice: Gumawa sila
  rationale: Karaniwang kahulugan ng Qal perfect 3cp ng עשה ang “gumawa,” at tuwiran itong angkop sa salaysay ng paggawa ng kasuotang pangpari.
- source_word: ל/וֹ
  choice: para rito
  rationale: Ang panlalaking isahang hulapi ay tumutukoy sa efod, isang bagay; kaya natural sa Filipino ang “para rito.”
- source_word: חֹבְרֹת
  choice: na pinagdugtong
  rationale: Mula ito sa ugat na חבר, “magdugtong/mag-ugnay.” Ipinahihiwatig ng anyo na ang mga bahagi sa balikat ay magkakaugnay o nakakabit; pinananatili ng “pinagdugtong” ang konkretong larawan at ang pag-uulit ng ugat sa talata.
- source_word: עַל
  choice: sa
  rationale: Sa pariralang tumutukoy sa dalawang dulo, ang “sa” ang likas at sapat na katumbas sa Filipino.
- source_word: שְׁנֵי קצוות/ו
  choice: dalawang dulo nito
  rationale: Ang קצוות ay tumutukoy sa mga dulo o hangganan ng efod. Pinakamalinaw at natural dito ang “dalawang dulo nito.”
- source_word: חֻבָּר
  choice: pinagdugtong ito
  rationale: Ang Pual perfect 3ms ng חבר ay pasibong “ito ay pinagdugtong.” Inuulit ang “pinagdugtong” upang mapanatili ang leksikal na ugnayan at diin ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “rito/nito” para sa efod at iniwasan ang mas teknikal o di-tiyak na “panali” sa pangunahing teksto. Napanatili ang medyo paulit-ulit na diwa ng חבר sa dalawang sugnay, gaya ng Hebreo.
