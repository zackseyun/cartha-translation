  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: tl
  text: At nilagyan nila ito ng apat na hanay ng mga bato. Ang unang hanay ay rubi,[a] topasyo, at esmeralda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga batong-hiyas na ito. Ang “rubi,” “topasyo,” at “esmeralda” ay sumusunod sa karaniwang tradisyonal na mga salin. Maaaring kornalina ang rubi, krisolito ang topasyo, at ibang matingkad na berde o kumikislap na bato ang esmeralda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ בֹו
  choice: inilagay nila roon
  rationale: Literal na tumutukoy ang pandiwa sa pagpuno, ngunit sa konteksto ng mga batong inilalagay sa pektoral, natural sa Tagalog ang “inilagay nila roon” at hindi nito labis na tinutukoy ang paraan ng pagkakabit.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: apat na hanay ng mga bato
  rationale: Ang טוּרֵי ay mga hanay, at kolektibo ang gamit ng אָבֶן; malinaw at natural ang parirala sa modernong Tagalog.
- source_word: טוּר ... הַטּוּר הָאֶחָד
  choice: Sa unang hanay ay
  rationale: Sa konteksto, ipinakikilala ng parirala ang una sa apat na hanay. Pinananatili ng “hanay” ang pagkakatugma sa naunang parirala.
- source_word: אֹדֶם
  choice: rubi
  rationale: Karaniwang tradisyonal na katumbas ito, ngunit hindi tiyak ang eksaktong uri ng batong tinutukoy; pinananatili sa talababa ang posibleng “kornalina” o ibang pulang batong-hiyas.
- source_word: פִּטְדָה
  choice: topasyo
  rationale: Ito ang pamilyar na tradisyonal na katumbas sa Tagalog, bagaman maaaring ibang batong-hiyas gaya ng krisolito ang tinutukoy.
- source_word: בָרֶקֶת
  choice: esmeralda
  rationale: Karaniwang tradisyonal na salin ito. Maaaring tumukoy ang salitang Hebreo sa isang makinang o kumikislap na bato, kaya ipinapaliwanag ang kawalang-katiyakan sa talababa.
