  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: tl
  text: Alinsunod sa lahat ng iniutos ni Yahweh kay Moises, gayon ginawa ng mga anak na lalaki ni Israel[a] ang buong gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga anak ni Israel” o “mga Israelita.” Sa Hebreo, literal na “mga anak na lalaki ni Israel,” isang karaniwang katawagang pangtipan para sa sambayanang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Alinsunod sa lahat ng
  rationale: Ipinahahayag ng כְּ na may pagsunod o pagtutugma sa kabuuan ng iniutos. Ang “Alinsunod sa lahat ng” ay likas at marangal sa Filipino at pinananatili ang saklaw ng כֹּל.
- source_word: צִוָּה
  choice: iniutos
  rationale: Tuwirang ipinapahayag ang kahulugang ‘mag-utos.’ Nauunawaan na nauna ang utos sa pagsasagawa, kaya hindi kailangang dagdagan ng hiwalay na panandang aspektong katumbas ng English past perfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Sa konstruksiyong may צוה, si Moises ang taong inutusan. Ang “iniutos ... kay Moises” ang natural na pagpapahayag nito sa Filipino.
- source_word: כֵּן
  choice: gayon
  rationale: Iniuugnay nito ang ginawa ng Israel sa naunang pamantayan ng utos. Pinananatili ng “gayon” ang tahasang pagtutugma ng dalawang sugnay.
- source_word: עָשׂוּ
  choice: isinagawa
  rationale: Saklaw ng עשה rito ang pagtupad o pagsasagawa sa iniatas na gawain. Mas natural ang “isinagawa ... ang buong gawain” kaysa literal ngunit mabigat na “ginawa ... ang buong gawain.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Literal itong ‘mga anak na lalaki ni Israel,’ ngunit isa rin itong nakaugaliang panlahatang katawagan sa bayang Israel. Pinananatili ng “mga anak ni Israel” ang anyong pampamilya at panlahat nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: ang buong gawain
  rationale: Sa konteksto ng paggawa ng tabernakulo, tumutukoy ang עֲבֹדָה sa kabuuan ng iniatas na paggawa o paglilingkod. Malinaw at angkop dito ang “buong gawain.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang paglilipat sa karaniwang rekonstruksiyon ng pagbigkas at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak na lalaki ni Israel
  rationale: Ang parirala ay nasa anyong panlalaking maramihan ngunit ginagamit bilang pamantayang katawagan sa sambayanang Israel. Ang “mga anak ni Israel” ay nagpapanatili sa talinghagang pampamilya at sa kolektibong saklaw, habang iniiwasang ipakahulugang mga lalaki lamang.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “alinsunod” at “gayon” upang mapanatili ang pormal na pagtutugma ng כְּכֹל ... כֵּן, at ang “isinagawa” upang maging natural ang parirala nang hindi nililimitahan ang gawain sa paggawa lamang ng mga bagay.
