  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: tl
  text: Ang bukasan ng balabal ay nasa gitna nito, gaya ng bukasan ng baluti[a]. May pinatibay na gilid sa palibot ng bukasan nito upang hindi ito mapunit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baluting magkakawing” o “baluting pantakip sa katawan.” Bihira ang salitang Hebreo na תַּחְרָא at tumutukoy sa isang pananggalang na kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי
  choice: bukasan
  rationale: Sa konteksto ng kasuotan, tumutukoy ang פֶּה sa butas o bukasan, hindi sa literal na bibig. Likas at malinaw sa Filipino ang “bukasan.”
- source_word: הַמְּעִיל
  choice: balabal
  rationale: Ang מְעִיל ay isang panlabas na kasuotan o mahabang damit. Pinananatili ng “balabal” ang dignidad at natatanging katangian ng kasuotang pangpari.
- source_word: בְּתוֹכוֹ
  choice: nasa gitna nito
  rationale: Ipinahihiwatig ng parirala na ang bukasan ay nasa gitnang bahagi ng kasuotan.
- source_word: כְּפִי תַחְרָא
  choice: gaya ng bukasan ng baluti
  rationale: Bihira ang תַּחְרָא at tumutukoy sa isang pananggalang na kasuotan, marahil baluting magkakawing o baluting pantakip sa katawan. Sapat na malawak ang “baluti” upang mapanatili ang leksikal na kawalang-katiyakan.
- source_word: שָׂפָה
  choice: tahing gilid
  rationale: Literal itong “labi” o “gilid,” ngunit dito ay tumutukoy sa tinahing pampatibay sa gilid ng bukasan.
- source_word: לְפִיו סָבִיב
  choice: sa palibot ng bukasan nito
  rationale: Malinaw nitong ipinapahayag na pumapalibot sa buong bukasan ang pinatibay na gilid.
- source_word: לֹא יִקָּרֵעַ
  choice: upang hindi ito mapunit
  rationale: Ipinapahayag ng anyong Niphal imperfect ang layunin o inaasahang bunga ng pinatibay na gilid.
