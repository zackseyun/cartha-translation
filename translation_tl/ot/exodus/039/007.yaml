base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At inilagay niya ang mga iyon sa mga pangbalikat ng efod bilang mga batong pang-alaala[a] para sa mga anak ni Israel[b], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga bato ng pag-alaala.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “mga anak na lalaki ni Israel,” isang nakaugaliang katawagan sa sambayanan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: At inilagay niya ang mga iyon
  rationale: Ang שׂוּם ay nangangahulugang ilagay o ipuwesto. Malinaw na tumutukoy ang “mga iyon” sa dalawang batong onise sa naunang talata.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: sa mga bahagi sa balikat ng efod
  rationale: Literal na “mga balikat ng efod,” ngunit sa paglalarawan ng kasuotan ay tumutukoy ang כָּתֵף sa mga bahaging nakapatong sa balikat. Tumpak at likas sa Filipino ang napiling parirala.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: bilang mga batong pang-alaala
  rationale: Pinananatili nito ang diwa ng mga batong nagsisilbing tanda upang maalala, habang natural ang anyo sa makabagong Filipino.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Ang pariralang Hebreo ay literal na “mga anak na lalaki ni Israel,” ngunit isa itong nakaugaliang tawag sa sambayanan ng Israel. Ang “mga anak ni Israel” ay natural sa Filipino at hindi nagmumungkahing mga lalaki lamang ang tinutukoy.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Ipinahahayag ng כַּאֲשֶׁר ang pagtutugma ng ginawa sa iniutos. Ginamit ang pangalang Yahweh para sa יהוה at ang natural na ayos ng pangungusap sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang tipang pangalan na יהוה; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga anak na lalaki ni Israel; mga Israelita
  rationale: Bagaman panlalaki ang literal na anyong Hebreo, ang nakaugaliang parirala ay tumutukoy sa sambayanan ng Israel. Pinananatili ng salin ang ugnayan kay Israel nang hindi nililimitahan ang tinutukoy sa kalalakihan; inilalahad sa talababa ang literal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na katawagang “efod,” samantalang ipinaliwanag nang likas ang mga bahaging nakapatong sa balikat.
