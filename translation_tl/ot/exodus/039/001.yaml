base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Mula sa asul, purpura, at matingkad na pulang sinulid, gumawa sila ng mga kasuotang hinabi nang mahusay[a] para sa paglilingkod sa santuwaryo. Ginawa rin nila ang mga banal na kasuotan para kay Aaron, ayon sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kasuotan para sa paglilingkod.” Natatangi ang pariralang Hebreo at maaaring idiin ang gamit ng mga kasuotan sa paglilingkod sa tabernakulo o ang mahusay na pagkakahabi ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: Mula sa asul, purpura, at matingkad na pulang sinulid
  rationale: Pinananatili ang tradisyonal na mga katawagang kulay ng mga telang pantabernakulo. Ginawang tahasan ang “sinulid” dahil tekstil ang konteksto, nang hindi labis na tinutukoy ang eksaktong sinaunang kulay o tina.
- source_word: בִגְדֵי שְׂרָד
  choice: mga kasuotang mahusay ang pagkakahabi[a]
  rationale: Ang bihirang parirala ay maaaring tumukoy sa mahusay na pagkakagawa o sa gamit ng mga kasuotan sa banal na paglilingkod. Ang pangunahing salin ay akma sa konteksto ng paggawa ng mga tela, habang pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: לְשָׁרֵת
  choice: para sa paglilingkod
  rationale: Ipinahahayag nito ang pormal na paglilingkod na panrelihiyon nang natural sa modernong Tagalog.
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Tumutukoy ito sa sagradong saklaw ng paglilingkod sa tabernakulo, hindi sa abstraktong kabanalan; hindi rin nito nililimitahan ang kahulugan sa isang partikular na silid.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: mga banal na kasuotan
  rationale: Tuwirang pinananatili ang pormal na katawagan sa mga kasuotang pangpari ni Aaron.
- source_word: לְאַהֲרֹן
  choice: para kay Aaron
  rationale: Likas na ipinahahayag sa Tagalog ang layon o pagkakatalaga ng mga kasuotan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ayon sa iniutos ni Yahweh kay Moises
  rationale: Natural na buod sa Tagalog na tumutukoy sa naunang utos ng Diyos at pinananatili ang ugnayan nina Yahweh at Moises.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng titulo.
- issue: Saklaw ng בַּקֹּדֶשׁ
  choice: sa santuwaryo
  alternative: sa Banal na Lugar
  rationale: Maaaring tumukoy ang salita sa banal na lugar o sagradong saklaw ng paglilingkod. Ang “santuwaryo” ay hindi labis na nagpapakitid sa isang partikular na bahagi ng tabernakulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “purpura” at “santuwaryo” bilang karaniwang terminong biblikal, at hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap para sa likas na daloy nang hindi binabago ang ugnayan ng mga sugnay.
