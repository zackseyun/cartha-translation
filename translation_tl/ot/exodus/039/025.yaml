base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: tl
  text: Gumawa sila ng mga kampanang yari sa purong ginto, at inilagay nila ang mga kampana sa gitna ng mga granada[a], sa laylayan ng balabal, sa buong paligid, sa gitna ng mga granada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pagitan ng mga granada.” Ang Hebreong parirala ay literal na “sa gitna ng mga granada” at inilalarawan ang pagkakalagay ng mga kampana kaugnay ng mga palamuting granada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Gumawa sila
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol ng עשה at malinaw na ipinagpapatuloy ang hakbang sa paggawa.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: mga kampanang purong ginto
  rationale: Tuwirang ipinapahayag ang bagay, materyal, at kalidad nang natural sa modernong Filipino.
- source_word: וַיִּתְּנוּ
  choice: inilagay nila
  rationale: Sa kontekstong ito, ang נתן ay nangangahulugang paglalagay o pagtatakda sa wastong puwesto.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: sa pagitan ng mga granada
  rationale: Bagaman literal na 'sa gitna ng mga granada,' ipinakikita ng ayos ng palamuti na ang mga kampana ay nakapuwesto sa pagitan o kasama sa hanay ng mga granada; mas tiyak at natural dito ang 'sa pagitan.'
- source_word: הָרִמֹּנִים
  choice: mga granada
  rationale: Pinananatili ang payak na tawag ng Hebreo; malinaw sa konteksto na mga palamuting hugis granada ang tinutukoy.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: sa laylayan ng balabal
  rationale: Ang שׁוּלִים ay ibabang laylayan, at ang מְעִיל ay balabal na bahagi ng kasuotang pangpari.
- source_word: סָבִיב
  choice: paikot sa buong laylayan
  rationale: Nililinaw sa natural na Filipino na ang ayos ay nakapalibot sa laylayan ng balabal.
- source_word: בְּתוֹךְ הָרִמֹּנִים (repeated)
  choice: sa pagitan ng mga granada
  rationale: Pinananatili ang pag-uulit ng Hebreo upang mapanatili ang diin at estruktura ng paglalarawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'kampana,' 'granada,' 'laylayan,' at 'balabal' bilang karaniwan ngunit angkop na mga terminong pangkasuotan at palamuti. Walang footnote dahil ang 'sa pagitan' ay malinaw na katumbas sa kontekstong ornamental at hindi nangangailangan ng hiwalay na paglilinaw.
