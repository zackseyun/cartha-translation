  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘mga anak ni Israel’ upang mapanatili ang pormal at tradisyonal na katawagan; hinati sa dalawang pangungusap ang mahabang Hebreong hanay upang maging malinaw nang hindi binabago ang ugnayan ng mga parirala.
