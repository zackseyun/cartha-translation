  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: tl
  text: At ang mga bato ay tumutugma sa mga pangalan ng mga anak ni Israel[a]—labindalawa, ayon sa kanilang mga pangalan. Inukitan ang mga ito gaya ng pag-ukit sa isang pantatak[b], bawat isa ayon sa pangalan nito, para sa labindalawang lipi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taglay ang mga pangalan ng mga anak ni Israel.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng malapit na kaugnayan o pagtutugma.
    reason: lexical_alternative
  - marker: b
    text: O “mga ukit na gaya ng sa isang pantatak.” Tumutukoy ang parirala sa paraan ng pag-ukit ng mga titik na gaya ng ginagawa sa isang pantatak o selyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: At ang mga bato
  rationale: Pinananatili ang payak na kahulugan ng tiyak na pangngalan at ang pang-ugnay; sapat ang konteksto upang maunawaang mahahalagang bato ang tinutukoy.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: tumutugma sa mga pangalan ng mga anak ni Israel
  rationale: Ang עַל ay nagpapahayag dito ng pagtutugma o malapit na kaugnayan, hindi lamang ng lokasyong ‘sa ibabaw ng.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pormal at natural na salin ng tradisyonal na katawagang pangtipan, nang hindi pinapalitan ng mas malawak na ‘mga Israelita.’
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: labindalawa
  rationale: Malinaw na ipinahahayag ang bilang; ang gitling na paghinto ay natural na naghahatid ng pagbibigay-diin ng Hebreong panghalip at bilang.
- source_word: עַל שְׁמֹתָם
  choice: ayon sa kanilang mga pangalan
  rationale: Pinananatili ang inuulit na ideya ng pagtutugma sa bawat pangalan.
- source_word: פִּתּוּחֵי חֹתָם
  choice: Inukitan ang mga ito gaya ng pag-ukit sa isang pantatak
  rationale: Ipinahahayag ang paraan ng maselang pag-ukit na ginagamit sa isang seal o signet, sa natural na modernong Tagalog.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: bawat isa ayon sa pangalan nito
  rationale: Distributibo ang אִישׁ; ang ‘nito’ ay tumutukoy sa bawat bato at iniiwasang ipalagay na tao ang agarang tinutukoy.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: para sa labindalawang lipi
  rationale: Ang לְ ay nagpapakita ng kaugnayan o representasyon ng mga bato sa labindalawang lipi.
