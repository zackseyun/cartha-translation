base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/040.yaml
  text: the hangings of the court[a], its pillars and its bases, and the screen for the gate of the court, its ropes and its pegs, and all the utensils for the service of the tabernacle, for the tent of meeting[c][b];
translation:
  language: tl
  text: ang mga kurtina ng looban, ang mga haligi at mga patungan nito, ang tabing para sa pasukan ng looban, ang mga lubid at mga tulos nito, at ang lahat ng kagamitan para sa paglilingkod sa tabernakulo, para sa tolda ng pagpupulong;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי
  choice: mga kurtina
  rationale: Tumutukoy sa mga hinabing telang bumubuo sa bakod ng looban; natural sa modernong Filipino at naihihiwalay sa natatanging tabing sa pasukan.
- source_word: חָצֵר
  choice: looban
  rationale: Tumutukoy sa nakabakod na banal na lugar sa palibot ng tabernakulo; malinaw at likas na salin sa Filipino.
- source_word: עַמֻּדֶיהָ
  choice: ang mga haligi nito
  rationale: Ang mga patayong suportang humahawak sa mga kurtina ng looban.
- source_word: אֲדָנֶיהָ
  choice: ang mga patungan nito
  rationale: Mga pundasyong piyesa na pinagsasalpakan o pinagtatayuan ng mga haligi; mas madaling maunawaan kaysa sa teknikal na hiram na salita.
- source_word: הַמָּסָךְ
  choice: ang tabing
  rationale: Isang nakasabit na telang pantakip sa pasukan; pinananatili ang pagkakaiba nito sa mga kurtina sa paligid.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: para sa pasukan ng looban
  rationale: Sa kontekstong ito, ang שַׁעַר ay ang entrada sa telang bakod, kaya mas natural ang 'pasukan' kaysa 'pintuan' o 'tarangkahan.'
- source_word: מֵיתָרָיו
  choice: ang mga lubid nito
  rationale: Mga panaling ginagamit upang mapatatag ang estruktura; karaniwan at malinaw na katawagan.
- source_word: וִיתֵדֹתֶיהָ
  choice: ang mga tulos nito
  rationale: Mga piyesang ibinabaon sa lupa upang pagtalian ng mga lubid; ang 'tulos' ay mas malinaw sa Filipino kaysa 'peg.'
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: ang lahat ng kagamitan para sa paglilingkod
  rationale: Malawak ang saklaw ng כְּלֵי, kaya ang 'kagamitan' ay angkop sa kolektibong imbentaryo; ang עֲבֹדָה ay tumutukoy sa gawaing paglilingkod sa santuwaryo.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Nakaugaliang terminong Filipino para sa banal at naililipat na tahanan; pinananatili ang natatanging kahulugang pangkulto.
- source_word: לְאֹהֶל מוֹעֵד
  choice: para sa tolda ng pagpupulong
  rationale: Tapat na isinasalin ang pormal na tawag sa santuwaryo at pinananatili ang ugnayan nito sa naunang parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong imbentaryo at ang sunod-sunod na parirala ng Hebreo, habang ginawang natural ang mga katawagang teknikal. Walang talababa sapagkat hindi kailangan ng mga leksikal na alternatibo upang maunawaan ang talata.
