translation:
  language: tl
  text: 'at ang ikatlong hanay: hasinto[a], agata[b], at ametista.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga sinaunang batong hiyas sa pektoral ng punong pari; ang “hasinto” ay maaari ring isaling “ambar” o, ayon sa mas matandang tradisyon, “ligure.”
    reason: lexical_alternative
  - marker: b
    text: O “oniks” para sa ikalawang bato sa hanay na ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: at ang ... hanay
  rationale: Sa talaan ng mga batong nakalagay sa pektoral, ang טוּר ay tumutukoy sa isang hanay ng mga bato. Isinalin din ang pang-ugnay na וְ bilang “at” upang mapanatili ang pagkakaugnay nito sa naunang hanay.
- source_word: הַשְּׁלִישִׁי
  choice: ikatlo
  rationale: Tuwirang ipinapahiwatig ng ordinal na pang-uri na ito ang ikatlong hanay.
- source_word: לֶשֶׁם
  choice: hasinto
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan sa sinaunang batong ito. Ginamit ang “hasinto” bilang makabagong katumbas ng jacinth, habang inilalahad sa talababa ang kawalang-katiyakan at ibang posibleng salin.
- source_word: שְׁבוֹ
  choice: agata
  rationale: Ang “agata” ang tradisyonal at malawak na gamit na katumbas sa kontekstong ito, ngunit binanggit sa talababa ang “onise” bilang posibleng alternatibo.
- source_word: וְאַחְלָמָה
  choice: at ametista
  rationale: Karaniwang kinikilalang ametista ang אַחְלָמָה sa mga talaan ng mga bato sa pektoral; isinalin din ang pang-ugnay na וְ bilang “at.”
