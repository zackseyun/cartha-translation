translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong patuloy na talaan sa pambungad na “at,” at ginamit ang karaniwang mga katawagang Filipino sa mga batong hiyas. Ang tunay na kawalang-katiyakan sa pagkakakilanlan ng mga sinaunang bato ay hindi nilutas nang sapilitan kundi ipinaliwanag sa mga talababa.
