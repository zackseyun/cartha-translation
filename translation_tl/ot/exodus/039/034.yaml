  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: tl
  text: ang pantakip na yari sa mga balat ng lalaking tupa na tinina nang pula, ang pantakip na yari sa pinong katad[a], at ang tabing ng pantabing;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak kung ano ang tinutukoy ng salitang Hebreo na תְּחָשִׁים (tehashim). Maaaring tumukoy ito sa balat ng isang partikular na hayop—ayon sa ilang tradisyon, balat ng porpoise o dugong—o kaya ay transliterahin bilang “mga balat ng takash.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: pantakip
  rationale: Likas at malinaw na pangngalan sa Filipino para sa isang bagay na ipinantatakip; hindi nito labis na tinutukoy ang anyo o estruktura.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: mga balat ng lalaking tupa na tinina ng pula
  rationale: Ipinahahayag ang mga balat, ang tiyak na hayop na lalaking tupa, at ang prosesong pagpapapula o pagtitina, sa halip na ipalagay na likas lamang ang kulay.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: pinong katad[a]
  rationale: Hindi tiyak kung anong hayop o uri ng materyal ang tinutukoy ng תְּחָשִׁים. Ang 'pinong katad' ay madaling maunawaan at hindi nagpapanggap na tiyak ang hayop; inilalahad sa talababa ang tunay na kawalang-katiyakan.
- source_word: פָּרֹכֶת
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa tabing na naghihiwalay o nagkukubli sa isang bahagi; natural ang 'tabing' sa modernong Filipino.
- source_word: הַמָּסָךְ
  choice: panakip
  rationale: Ipinananatili ang diwa ng isang tabing na tumatakip o humaharang. Ang pariralang 'tabing na panakip' ay natural na inilalarawan ang gamit nito nang hindi nagdaragdag ng lokasyong hindi tahasang binanggit rito.
