  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: tl
  text: ang mga kasuutang yari sa mahusay na hinabing tela para sa paglilingkod sa santuwaryo[a], ang mga banal na kasuutan para kay Aaron, na pari, at ang mga kasuutan ng kanyang mga anak upang maglingkod bilang mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga kasuutan para sa paglilingkod.” Malamang na tumutukoy ang pananalitang Hebreo sa mga telang natatanging ginawa para gamitin sa paglilingkod sa santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: mga kasuutan
  rationale: Ang בֶּגֶד ay tumutukoy sa damit o kasuutan. Ang “mga kasuutan” ay natural at marangal sa modernong Filipino, at angkop sa konteksto ng pananamit ng mga pari.
- source_word: הַשְּׂרָד
  choice: mahusay ang pagkakahabi
  rationale: Sa konteksto ng tabernakulo, malamang na tumutukoy ang שְׂרָד sa natatangi at mahusay na gawang tela. Ipinahahayag ng salin ang aspeto ng pagkakayari nang hindi nagpapasok ng mas tiyak na detalyeng wala sa teksto; pinananatili sa talababa ang alternatibong pag-unawa rito bilang “para sa paglilingkod.”
- source_word: לְשָׁרֵת
  choice: para sa paglilingkod
  rationale: Ang שׁרת ay tumutukoy sa pormal na paglilingkod, lalo na sa banal na gawain. Ang pariralang ito ay malinaw at angkop sa konteksto ng santuwaryo.
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Dito, ang קֹדֶשׁ ay tumutukoy sa banal na lugar o saklaw ng paglilingkod sa tabernakulo. Ang “santuwaryo” ay maikli, malinaw, at pamilyar sa modernong Filipino.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mga banal na kasuutan
  rationale: Malapit nitong tinutumbasan ang pariralang Hebreo at pinananatili ang tahasang paglalarawan sa mga kasuutan bilang banal.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: para kay Aaron na pari
  rationale: Tuwirang ipinakikita nito na ang mga kasuutan ay para kay Aaron at pinananatili ang kanyang katungkulan bilang pari.
- source_word: בִּגְדֵי בָנָיו
  choice: mga kasuutan ng kanyang mga anak
  rationale: Pinananatili nito ang kayarian at malinaw na ugnayang paari sa tekstong Hebreo.
- source_word: לְכַהֵן
  choice: para maglingkod bilang mga pari
  rationale: Ang pandiwang mula sa כֹּהֵן ay nangangahulugang gumanap o maglingkod bilang pari. Natural itong ipinahahayag ng salin nang hindi nawawala ang diwang bokasyonal at pangkatungkulan.
theological_decisions:
- issue: Pagkakaiba ng בִּגְדֵי הַשְּׂרָד at בִּגְדֵי הַקֹּדֶשׁ
  choice: Ituring ang una bilang mga kasuutang may natatangi at mahusay na pagkakahabi na ginagamit sa paglilingkod sa santuwaryo, at ang ikalawa bilang mga banal na kasuutan para kay Aaron at sa kanyang mga anak.
  alternative: Ituring ang dalawang parirala bilang halos magkasingkahulugan at isalin ang una bilang “mga kasuutan para sa paglilingkod.”
  rationale: Pinananatili ng salin ang dalawang magkahiwalay na parirala at ang pag-uulit sa Hebreo, ngunit hindi nito higit na tinutukoy ang kanilang pagkakaiba kaysa sa ipinahihiwatig ng teksto. Inilalahad sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan ng talata, ang pag-uulit ng “mga kasuutan,” at ang pagkakaiba ng paglilingkod sa santuwaryo at paglilingkod bilang mga pari. Ang “santuwaryo” ay pinili bilang natural na katawagan sa banal na lugar sa kontekstong ito.
