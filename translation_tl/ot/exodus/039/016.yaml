translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “pektoral” bilang pangalan ng natatanging kasuotang pambiblikal, at nilagyan ng talababa ang hindi tiyak na anyo ng מִשְׁבְּצֹת.
