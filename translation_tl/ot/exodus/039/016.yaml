translation:
  language: tl
  text: Gumawa sila ng dalawang kabitang yari sa ginto[a] at dalawang singsing na ginto, at inilagay nila ang dalawang singsing sa magkabilang dulo ng pektoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “dalawang monturang ginto” o “dalawang palamuting gawang-ginto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Gumawa sila
  rationale: Likas na salin ng Qal wayyiqtol ng עשה; naipahihiwatig ng pagkakasunod ng mga pangungusap ang sunod na kilos kahit walang panimulang “at.”
- source_word: שְׁתֵּי מִשְׁבְּצֹת זָהָב
  choice: dalawang lalagyang ginto
  rationale: Ang מִשְׁבְּצֹת ay tumutukoy sa gawang-gintong pinaglalagyan o kinakabitan; pinananatili ng “lalagyan” ang pangkalahatang kahulugan nang hindi nagpapalagay ng tiyak na teknik tulad ng filigree.
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: at dalawang singsing na ginto
  rationale: Ang טַבְּעֹת ay mga singsing na nagsisilbing pagkakabitan. Inuulit ang “ginto” gaya ng Hebreo.
- source_word: וַיִּתְּנוּ
  choice: Ikinabit nila
  rationale: Sa kontekstong ito, ang נתן ay paglalagay ng mga singsing sa kasuutan; mas tiyak at natural sa Filipino ang “ikinabit” kaysa literal na “inilagay,” nang hindi binabago ang kilos.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: sa magkabilang dulo
  rationale: Natural na Filipino para sa literal na “sa dalawang dulo,” at malinaw na kapuwa dulo ang tinutukoy.
- source_word: הַחֹשֶׁן
  choice: pektoral
  rationale: Tumutukoy sa natatanging bahagi ng kasuotan ng punong pari na isinusuot sa dibdib; ang “pektoral” ay maikli at dignified na terminong Filipino sa kontekstong biblikal.
