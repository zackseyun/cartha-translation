  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: tl
  text: At gumawa sila ng mga granada[a] na yari sa pinilipit na sinulid na asul, purpura, at iskarlata, sa laylayan ng balabal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga palamuting hugis-granada.” Ang literal na sinabi sa Hebreo ay “mga granada,” na ginagamit ang pangalan ng bunga para sa hugis ng palamuti.
    reason: lexical_alternative
  - marker: b
    text: Inililista sa Hebreo ang asul, purpura, at iskarlatang materyal, at inilalarawan ng “pinilipit” ang pagkakagawa ng tela. Idinagdag ang “sinulid” sa salin upang luminaw ang diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: At gumawa sila
  rationale: Karaniwang anyong pasalaysay ng עשה; tuwiran at natural ang “gumawa sila.”
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: sa laylayan ng balabal
  rationale: Ang עַל ay tumutukoy sa kinalalagyan, ang שׁוּלֵי sa ibabang gilid ng kasuotan, at ang מְעִיל sa balabal na bahagi ng kasuotang pampari.
- source_word: רִמּוֹנֵי
  choice: mga granadang
  rationale: Literal na “mga granada”; sa konteksto, mga palamuting hugis-granada ang tinutukoy, ngunit pinananatili sa pangunahing teksto ang payak na katawagan ng Hebreo.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: sinulid na asul, purpura, at iskarlata
  rationale: Mga terminong tumutukoy sa mamahaling tininaang materyales sa mga paglalarawan ng santuwaryo. Idinagdag ang “sinulid” upang maging malinaw sa Filipino ang materyal na ginamit.
- source_word: מָשְׁזָר
  choice: pinilipit
  rationale: Inilalarawan nito ang sinulid o gawaing tela bilang twisted/twined; malinaw at likas sa modernong Filipino ang “pinilipit.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “laylayan” at “balabal” bilang natural na mga katawagan sa kasuotan; pinanatili ang mga tradisyonal ngunit nauunawaang kulay na “purpura” at “iskarlata.”
