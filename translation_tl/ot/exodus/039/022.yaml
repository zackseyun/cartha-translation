translation:
  language: tl
  text: At ginawa niya ang balabal ng efod, na gawa ng manghahabi[a] at pawang asul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “hinabing gawa.” Literal sa Hebreo: “gawa ng manghahabi.”'
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na isinaling “asul” ay tumutukoy sa isang mamahaling materyal na tekstil na tinina nang asul, na ginamit sa tabernakulo at sa mga kasuotang pampari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa niya
  rationale: Ipinagpapatuloy ng waw-consecutive ang sunod-sunod na salaysay; tuwiran at natural sa Filipino ang “At ginawa niya.”
- source_word: מְעִיל
  choice: balabal
  rationale: Tumutukoy ito sa isang panlabas na kasuotang mahaba; ang “balabal” ay angkop at madaling maunawaan sa konteksto ng kasuotang pampari.
- source_word: הָאֵפֹד
  choice: ng efod
  rationale: Teknikal na tawag ang אֵפוֹד sa natatanging kasuotang pampari, kaya pinanatili ito sa transliterasyong “efod.” Pinananatili rin ng “ng” ang ugnayan ng balabal sa efod.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: gawa ng manghahabi
  rationale: Malapit ito sa literal na “gawa ng isang manghahabi” at pinananatili ang pagtukoy sa uri ng pagkakayari nang hindi idinaragdag ang ideyang “dalubhasa,” na wala sa Hebreo.
- source_word: כְּלִיל
  choice: pawang
  rationale: Ipinahihiwatig nito ang kabuuan o pagiging lubos; maikli at natural na inilalarawan ng “pawang” ang buong balabal.
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Sa pangungusap na ito, natural na inilalarawan ng termino ang kulay ng buong balabal. Hindi tahasang inuulit sa Hebreo ang salitang “sinulid,” kaya “asul” ang ginamit sa pangunahing teksto habang ipinaliliwanag sa talababa ang materyal na tinutukoy.
