  source_fidelity: Kailangang linawin na ang ginto ay pinukpok upang maging maninipis na lamina at saka ginupit bilang mga hibla. Ang "lanang" ay tumutukoy sa lana at hindi angkop bilang pangkalahatang katawagan para sa mga materyales na ito. Masyado ring makitid ang "manghahabi" para sa מַעֲשֵׂה חֹשֵׁב, na tumutukoy sa masining o may-disensyong pagkakayari, hindi kinakailangang sa isang manghahabi lamang.
  naturalness: Mas natural at malinaw ang "mga lamina ng ginto," "mga hibla," at "maisama sa paghahabi." Iniiwasan ng rebisyon ang hindi pangkaraniwang "lanang" at ginagawang malinaw na ang asul at purpura ay mga materyales na panghabing kasama ng pulang sinulid at pinong lino.
  terminology: Pinananatili ang "purpura," "matingkad na pulang sinulid," at "pinong lino." Isinasalin ang teknikal na מַעֲשֵׂה חֹשֵׁב bilang "gawang may masining na disenyo" upang hindi labis na tukuyin ang propesyon ng dalubhasa.
