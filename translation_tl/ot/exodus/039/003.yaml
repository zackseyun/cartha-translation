  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: tl
  text: Pinukpok nila ang ginto upang maging maninipis na mga lamina[a], at ginupit nila ito bilang mga hibla[b] upang maisama sa paghahabi ng asul, purpura, matingkad na pulang sinulid, at pinong lino, bilang gawang may masining na disenyo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga manipis na piraso ng ginto.” Tumutukoy ang Hebreo sa maninipis na piraso ng metal na pinukpok.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga sinulid na ginupit” o “mga pirasong ginupit.” Ang diwa ay inihanda ang ginto bilang maninipis na hiblang maisasama sa paghahabi.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “gawa ng isang mahusay na manggagawa” o “masining na pagkakayari.” Teknikal ang Hebreong parirala para sa mahusay at masining na gawaing may disenyo; hindi nito tahasang tinutukoy ang isang partikular na uri ng manggagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ
  choice: Pinukpok nila
  rationale: Sa konteksto ng paggawa sa metal, ang רקע ay tumutukoy sa pagpupukpok upang numipis at lumapad ang ginto.
- source_word: פַּחֵי הַזָּהָב
  choice: mga manipis na piraso ng ginto
  rationale: Ang פַּחִים ay manipis na mga piraso o lamina ng metal; malinaw sa karaniwang mambabasa ang paglalarawang ito at hindi nito ipinapalagay na malalaki ang mga ito.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: ginupit ang mga iyon upang maging mga sinulid
  rationale: Ipinahihiwatig ng parirala na ginupit ang pinukpok na ginto bilang maninipis na hibla para maisama sa paghahabi.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: na ihahabi sa
  rationale: Sa kontekstong tekstil, ipinapahayag nito ang layuning isama ang mga hibla ng ginto sa mismong hinabing materyales.
- source_word: הַתְּכֵלֶת
  choice: lanang asul
  rationale: Tumutukoy ito sa materyal na tinina ng asul; nilinaw ang tekstil na diwa sa natural na Tagalog.
- source_word: הָאַרְגָּמָן
  choice: purpura
  rationale: Ang אַרְגָּמָן ay mamahaling materyal o sinulid na kulay purpura; ang maikling katawagan ay akma sa magkakasunod na kulay.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: matingkad na pula
  rationale: Tumutukoy ang tambalang ito sa telang o sinulid na tinina ng matingkad na pulang tina; hindi na isinama ang literal na pinagmulan ng tina dahil hindi iyon ang pokus ng talata.
- source_word: הַשֵּׁשׁ
  choice: pinong lino
  rationale: Sa mga tekstong tungkol sa tabernakulo, ang שֵׁשׁ ay pinong lino.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: gawa ng isang mahusay na manghahabi
  rationale: Teknikal na parirala ito para sa mahusay at masining na gawaing tekstil; pinananatili ng salin ang kasanayan at uri ng gawain nang hindi inaangking ganap na tiyak ang espesipikong tungkulin.
