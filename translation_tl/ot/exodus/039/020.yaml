  source_fidelity: 'Tumpak na naipapahayag ang dalawang gintong singsing, ang dalawang bahaging pambalikat ng efod, at ang magkakasunod na panandang panglokasyon: sa ibaba, sa harapang panig, katapat ng dugtungan, at sa ibabaw ng hinabing sinturon. Ang “dugtungan nito” ay maingat na salin ng מֶחְבַּרְתּוֹ at hindi labis na tinutukoy bilang tahi lamang.'
