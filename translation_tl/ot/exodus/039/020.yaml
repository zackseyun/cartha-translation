  language: en
  yaml_path: translation/ot/exodus/039/020.yaml
  text: They made two gold rings and put them on the two shoulder pieces of the ephod[a], below, on its front side, opposite its joining[b], above the skillfully woven band of the ephod.
translation:
  language: tl
  text: Gumawa sila ng dalawang singsing na ginto at ikinabit ang mga iyon sa dalawang bahagi ng efod na nasa balikat, sa ibabang bahagi sa harapan nito, katapat ng dugtungan nito, at sa ibabaw ng mahusay na hinabing sinturon ng efod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: mga singsing
  rationale: Karaniwang tumutukoy ang salita sa mga singsing na metal na ginagamit bilang kabitan; malinaw at natural ito sa konteksto.
- source_word: כִתְפֹת
  choice: mga bahagi ng efod na nasa balikat
  rationale: Tumutukoy ito sa mga bahaging pambalikat ng kasuotan, hindi lamang sa mismong mga balikat ng tao.
- source_word: מִלְמַטָּה
  choice: sa ibabang bahagi
  rationale: Ipinahihiwatig nito ang pagkakalagay sa mas mababang bahagi ng efod.
- source_word: מִמּוּל פָּנָיו
  choice: sa harapan nito
  rationale: Ang literal na ideya ay nasa o nakaharap sa harapang panig ng bagay; natural ito sa Filipino.
- source_word: לְעֻמַּת
  choice: katapat
  rationale: Pinananatili nito ang spatial na ideya ng pagkakatapat o pagkakaayon ng posisyon.
- source_word: מֶחְבַּרְתּוֹ
  choice: dugtungan nito
  rationale: Tumutukoy ang salita sa lugar kung saan pinagdurugtong o pinagkakabit ang mga bahagi; hindi nito ipinapalagay na tahi lamang iyon.
- source_word: חֵשֶׁב
  choice: mahusay na hinabing sinturon
  rationale: Sa konteksto ng efod, ito ang hinabing bahaging parang sinturon na nagsisilbing panali; ipinapahayag din ng salin ang masining na pagkakayari.
- source_word: אֵפֹד
  choice: efod
  rationale: Teknikal itong katawagan sa kasuotang pansaserdote at higit na tumpak na panatilihin bilang transliterasyon.
- source_word: וַיִּתְּנֻם
  choice: ikinabit ang mga iyon
  rationale: Bagaman pangunahing nangangahulugang inilagay, ipinakikita ng konteksto na inilagay ang mga singsing bilang mga kabitan; natural at malinaw ang 'ikinabit' sa Filipino.
