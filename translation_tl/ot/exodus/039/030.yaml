  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: tl
  text: 'Ginawa nila ang plaka, ang banal na korona, mula sa dalisay na ginto, at isinulat nila rito, gaya ng ukit sa isang pantatak: “Banal kay Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Kabanalan kay Yahweh.”
    reason: Pinananatili ang alternatibong pagbasa sa קֹדֶשׁ bilang abstraktong pangngalang “kabanalan.”
lexical_decisions:
- source_word: צִיץ
  choice: laminang ginto
  rationale: Sa konteksto ng kasuotang saserdote, tumutukoy ito sa laminang nakakabit sa turbante. Idinagdag ang “ginto” bilang likas na paglalarawan sa Filipino, ayon sa materyal na tahasang binanggit sa talata.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: ang banal na korona
  rationale: 'Pinananatili ang appositional na ugnayan: ang lamina ay inilalarawan din bilang banal na korona o diadema.'
- source_word: זָהָב טָהוֹר
  choice: mula sa dalisay na ginto
  rationale: Likas at malinaw na salin ng materyal at kalidad nito.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: inukitan nila iyon
  rationale: Bagaman literal na “isinulat,” nililinaw ng kasunod na parirala na ang pagsulat ay ginawa sa paraang pag-ukit sa pantatak; ang “inukitan” ay natural sa Filipino para sa inskripsiyon sa ginto.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: gaya ng pag-ukit sa isang pantatak
  rationale: Ipinahahayag ang paraan at uri ng inskripsiyon, na katulad ng ukit sa isang seal o pantatak.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Banal para kay Yahweh
  rationale: Pinananatili ang maikli at pormulang pananalita ng inskripsiyon at ang diwang nakatalaga o ibinukod para kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh.
- issue: Kahulugan ng inskripsiyong קֹדֶשׁ לַיהוָה
  choice: Banal para kay Yahweh
  alternative: Kabanalan kay Yahweh
  rationale: Maaaring unawain ang קֹדֶשׁ bilang “banal” o “kabanalan.” Mas natural sa modernong Filipino ang “Banal para kay Yahweh,” samantalang inilalahad sa talababa ang posibleng nominal na anyo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pantatak” para sa חוֹתָם upang maipahayag ang bagay na ginagamit sa paglalagay ng selyo, at pinanatili ang maikli at seremonyal na anyo ng inskripsiyon.
