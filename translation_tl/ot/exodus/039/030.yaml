  naturalness: Ang “plaka” ay malinaw at likas na modernong Filipino para sa manipis na plaka ng metal sa kasuotang saserdote. Ang “Banal kay Yahweh” ay maikli, seremonyal, at mas natural na anyo ng inskripsiyon kaysa “Banal para kay Yahweh.”
  terminology: Pinananatili ang “banal na korona,” “dalisay na ginto,” “pantatak,” at “Yahweh.” Ang “plaka” at “banal na korona” ay nananatiling magkaappositive, gaya ng nasa Hebreo.
