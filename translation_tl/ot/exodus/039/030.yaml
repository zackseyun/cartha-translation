- from: 'Ginawa nila ang laminang ginto, ang banal na korona, mula sa dalisay na ginto, at inukitan nila iyon gaya ng pag-ukit sa isang pantatak: “Banal para kay Yahweh.”[a]'
  to: 'Ginawa nila ang plaka, ang banal na korona, mula sa dalisay na ginto, at isinulat nila rito, gaya ng ukit sa isang pantatak: “Banal kay Yahweh.”[a]'
