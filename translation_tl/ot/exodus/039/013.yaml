translation:
  language: tl
  text: 'at ang ikaapat na hanay: berilo[a], onise, at haspe, na nakalagay sa mga enggasteng ginto sa kani-kanilang mga lagayan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga batong hiyas sa pektoral ng punong pari. Ang “berilo,” “onise,” at “haspe” ay karaniwang tradisyonal na mga katumbas.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “na nakalagay sa mga enggasteng ginto ayon sa kani-kanilang pagkakalagay.” Teknikal ang huling pariralang Hebreo at maaaring tumukoy sa paraan ng pagkakabit ng mga bato sa kanilang nakatalagang mga lagayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: at ang ikaapat na hanay
  rationale: Sa talaan ng mga batong nasa pektoral, ang טוּר ay isang hanay. Likas na pinananatili ng “at” ang pang-ugnay.
- source_word: תַּרְשִׁישׁ
  choice: berilo
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan ng sinaunang batong ito. Ang “berilo” ay isang kinikilalang tradisyonal na katumbas, ngunit inilalahad sa talababa ang kawalang-katiyakan.
- source_word: שֹׁהַם
  choice: onise
  rationale: Ang “onise” ang karaniwang tradisyonal na salin sa konteksto ng mga kagamitang makasaserdote, bagaman pinagtatalunan ang tiyak na mineral.
- source_word: וְיָשְׁפֵה
  choice: at haspe
  rationale: Ang “haspe” ay malinaw at matatag na katumbas sa Filipino ng יָשְׁפֵה; tahasang pinanatili ang pang-ugnay.
- source_word: מֽוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: na nakalagay sa mga enggasteng ginto
  rationale: Ipinahihiwatig ng anyong balintiyak na ang mga bato ay ikinabit o ipinaloob sa ginintuang pagkakagawa. Ang “enggaste” ay natural na terminong Filipino para sa metal na kinakapitan ng hiyas.
- source_word: בְּמִלֻּאֹתָם
  choice: ayon sa pagkakalagay sa mga iyon
  rationale: Teknikal at bahagyang malabo ang parirala. Ipinahahayag ng salin ang pagkakabit ng mga bato sa kani-kanilang nakatalagang lagayan nang hindi gumagamit ng di-likas na literalismong “sa kanilang mga pagpuno.”
