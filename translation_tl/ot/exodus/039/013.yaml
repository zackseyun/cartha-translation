translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hanay” para sa kaayusan ng mga bato at “enggaste” bilang tiyak ngunit karaniwang katawagan sa lagayang metal ng hiyas. Inilagay ang dalawang pananda ng talababa sa pangunahing teksto.
