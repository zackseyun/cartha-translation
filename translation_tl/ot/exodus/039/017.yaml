translation:
  language: tl
  text: At inilagay nila ang dalawang gintong tanikala[a] sa dalawang singsing sa mga dulo ng pektoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dalawang gintong panaling pinilipit.” Ang salitang Hebreo ay maaaring tumukoy sa mga pinilipit na panali o kurdon, o sa mga hiblang tulad ng kadena; dito, yari sa ginto ang mga ito at ikinakabit sa pektoral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: At inilagay nila
  rationale: Ang נתן sa konstruksyong ito ay nangangahulugang maglagay; natural sa modernong Filipino ang “inilagay” at pinananatili ng “At” ang pagpapatuloy ng salaysay.
- source_word: שְׁתֵּי הָעֲבֹתֹת
  choice: ang dalawang ... panali
  rationale: Tiyak ang bilang na dalawa. Ang עֲבֹתֹת ay maaaring tumukoy sa mga pinilipit na panali o sa mga hiblang tulad ng kadena; ang “panali” ay nagpapanatili sa pangunahing larawan nang hindi agad nilulutas ang leksikal na kalabuan.
- source_word: הַזָּהָב
  choice: gintong
  rationale: Tinutukoy nito ang materyal ng mga panali; maikli at natural sa Filipino ang pang-uring “gintong.”
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: sa dalawang singsing
  rationale: Ang עַל ay nagsasaad ng pagkakabit o paglalagay sa mga singsing; ang “sa” ang pinakanatural na katumbas sa kontekstong ito.
- source_word: עַל קְצוֹת
  choice: sa mga dulo
  rationale: Ang קְצוֹת ay tumutukoy sa mga dulong bahagi o hangganan; malinaw at karaniwan ang “mga dulo.”
- source_word: הַחֹשֶׁן
  choice: pektoral
  rationale: Sa konteksto ng kasuotan ng punong pari, ito ang natatanging sagradong pirasong isinusuot sa dibdib. Ang “pektoral” ay isang dignified at maikling terminong Filipino na hindi ito ipinagkakamali sa karaniwang bahagi ng baluti.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pektoral” bilang teknikal ngunit madaling makilalang katawagan sa sagradong kasuotang pandibdib ng punong pari; iniwasan ang mas mabigat at posibleng mapanlinlang na “baluti sa dibdib.”
