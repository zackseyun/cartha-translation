- from: At inilagay nila ang dalawang gintong panali[a] sa dalawang singsing sa mga dulo ng pektoral.
  to: At inilagay nila ang dalawang gintong tanikala[a] sa dalawang singsing sa mga dulo ng pektoral.
  rationale: Pinalitan ang «panali» ng «tanikala» upang maging mas malinaw at natural ang pangunahing teksto sa kontekstong ito. Pinanatili sa talababa ang posibilidad na ang tinutukoy ay pinilipit na panali o kurdon, alinsunod sa leksikal na saklaw ng Hebreo.
