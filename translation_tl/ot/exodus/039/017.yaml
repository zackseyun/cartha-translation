    issue: Hindi sapat na malinaw ang «panali» para sa עֲבֹתֹת.
    rationale: Sa modernong Filipino, ang «panali» ay maaaring unawain bilang anumang pangkabit at hindi agad nagpapahiwatig ng isang bagay na gawa sa ginto na mala-kadena o pinilipit. Ang «tanikala» ay mas natural sa kasuotang ito; dapat ilagay sa talababa ang alternatibong «pinilipit na panali/kurdon» upang hindi burahin ang kalabuan ng Hebreo.
  revised_text: At inilagay nila ang dalawang gintong tanikala[a] sa dalawang singsing sa mga dulo ng pektoral.
