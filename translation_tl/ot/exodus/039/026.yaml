  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Kampanilya at granada, kampanilya at granada, sa laylayan ng balabal, sa buong palibot, para sa paglilingkod[a], ayon sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang maglingkod.” Ipinahahayag ng pawatas sa Hebreo ang layunin ng balabal sa paglilingkod ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: kampanilya
  rationale: Tumutukoy ang pangngalan sa isang kampanilya. Hindi idinagdag ang “ginto” dahil bagaman malinaw iyon sa naunang konteksto, hindi ito tahasang nasa talatang ito.
- source_word: רִמּוֹן
  choice: granada
  rationale: Literal na nangangahulugang “granada.” Sa kontekstong ito, isa itong palamuting hugis-granada, ngunit sapat at natural ang literal na katawagan.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: sa buong palibot ng laylayan ng balabal
  rationale: Ang שׁוּלֵי ay tumutukoy sa ibabang gilid o laylayan, ang מְעִיל ay balabal, at binibigyang-diin ng סָבִיב na nakapalibot ang pagkakaayos.
- source_word: לְשָׁרֵת
  choice: para sa paglilingkod
  rationale: Ipinahahayag ng pawatas na may לְ ang layunin. Nananatiling bukas ang salin kung ito ay tumutukoy sa gamit ng balabal sa paglilingkod o sa paglilingkod ng paring nagsusuot nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan ng Diyos sa halip na palitan ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ayon sa iniutos ni Yahweh kay Moises
  rationale: Natural na ipinahahayag sa Filipino ang pagsunod ng natapos na gawain sa naunang utos nang hindi kailangang lagyan ng tahasang aspektong pluperpekto.
theological_decisions:
- issue: Paglalarawan sa layunin ng לְשָׁרֵת
  choice: para sa paglilingkod
  alternative: upang maglingkod
  rationale: Pinananatili ng pangngalang parirala ang bahagyang kalabuan kung ang diin ay nasa gamit ng kasuotan sa ministeryo o sa kilos ng paring naglilingkod.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Direktang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na ayos na “kampanilya at granada” at ang diin ng “sa buong palibot,” na kapuwa nasa Hebreo.
