  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: tl
  text: 'at ang ikalawang hanay: turkesa[a], sapiro, at diyamante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga sinaunang batong hiyas. Ang נֹפֶךְ ay maaari ring isaling “esmeralda” o “karbungko,” at ang יָהֲלֹם ay maaari ring isaling “hasinto” o “haspe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: at ang ... hanay
  rationale: Sa konteksto ng mga batong nakalagay sa pektoral, ang טוּר ay isang hanay ng mga bato; natural at malinaw sa Filipino ang “hanay,” at isinasalin ang וְ bilang “at.”
- source_word: הַ/שֵּׁנִי
  choice: ikalawang
  rationale: Pang-uring pamilang na nangangahulugang “ikalawa”; ang “ikalawang hanay” ang likas na ayos sa Filipino.
- source_word: נֹפֶךְ
  choice: turkesa[a]
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan ng sinaunang batong ito. Ang “turkesa” ay isang makatwirang makabagong katumbas, habang inilalahad sa talababa ang ibang posibleng salin.
- source_word: סַפִּיר
  choice: sapiro
  rationale: Ang “sapiro” ang kinikilalang karaniwang katumbas sa Filipino, bagaman maaaring hindi ganap na kapareho ng mineral na tinatawag ngayong sapphire.
- source_word: וְ/יָהֲלֹם
  choice: at diyamante
  rationale: Karaniwang tradisyonal na katumbas ang “diyamante,” ngunit hindi tiyak ang pagkakakilanlan ng sinaunang batong tinutukoy kaya pinananatili sa talababa ang mga alternatibo.
