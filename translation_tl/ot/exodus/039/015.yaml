translation:
  language: tl
  text: At gumawa sila para sa pektoral ng mga tanikalang tinirintas, na parang mga lubid, mula sa purong ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tanikalang pinilipit” o “mga tanikalang mala-lubid.” Inilalarawan ng Hebreo ang mga tanikalang may tinirintas, pinilipit, o mala-lubid na pagkakayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: At gumawa sila
  rationale: Tuwirang salin ng karaniwang pandiwang עשה sa anyong pasalaysay; natural ito sa modernong Tagalog.
- source_word: עַל הַחֹשֶׁן
  choice: sa pektoral
  rationale: Ipinahihiwatig ng עַל ang pagkakabit o pagkakalagay sa pektoral. Ang “pektoral” ay maikli at kinikilalang tawag sa kasuotang pambanal ng punong pari.
- source_word: שַׁרְשְׁרֹת
  choice: mga tanikala
  rationale: Ang pangngalan ay tumutukoy sa maramihang tanikala; dignified at malinaw ang “mga tanikala” sa kontekstong ito.
- source_word: גַּבְלֻת
  choice: pinilipit na hibla
  rationale: Inilalarawan ng bihirang terminong ito ang pagkakayaring tila tinirintas, pinilipit, o hinubog na parang lubid. Iniiwasan ng salin ang labis na katiyakan sa eksaktong teknik.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: yari ... na parang mga lubid
  rationale: Pinananatili ang diwa ng pagkakayari at ang anyong kahawig ng makakapal o pinilipit na lubid.
- source_word: זָהָב טָהוֹר
  choice: mula sa purong ginto
  rationale: Natural na pahayag sa Tagalog para sa materyales na ginamit at tumpak na sumasalamin sa pariralang Hebreo.
