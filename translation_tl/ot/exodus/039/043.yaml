base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/043.yaml
  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: tl
  text: Nakita ni Moises ang lahat ng gawain, at tunay ngang ginawa nila iyon. Kung ano mismo ang iniutos ni Yahweh, iyon ang ginawa nila. At binasbasan sila ni Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Pinananatili ang karaniwang kahulugan ng ראה nang hindi dinaragdagan ng tahasang diwa ng masusing pagsusuri.
- source_word: כָּל הַמְּלָאכָה
  choice: ang lahat ng gawain
  rationale: Ang מְלָאכָה ay tumutukoy sa kabuuan ng gawaing nauukol sa tabernakulo; malinaw at likas sa modernong Filipino ang “lahat ng gawain.”
- source_word: וְהִנֵּה
  choice: at tunay ngang
  rationale: Ipinahahayag nito ang pansin at pagpapatunay na dala ng הִנֵּה, nang hindi gumagamit ng di-likas na “masdan” sa salaysay na Filipino.
- source_word: עָשׂוּ אֹתָהּ
  choice: ginawa nila iyon
  rationale: Pinananatili ang malawak na kahulugan ng עשה at ang pagtukoy nito sa buong gawain, sa halip na paliitin sa paggawa lamang ng mga bagay.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה כֵּן עָשׂוּ
  choice: Kung ano mismo ang iniutos ni Yahweh, iyon ang ginawa nila
  rationale: Ipinapakita ng “mismo” at ng magkatugmang “kung ano… iyon” ang eksaktong pagsunod na ipinahahayag ng כַּאֲשֶׁר…כֵּן, habang pinananatili ang pag-uulit ng pandiwang “ginawa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: At binasbasan sila
  rationale: Ang “binasbasan” ay natural at marangal na katumbas ng piel na anyo ng ברך sa kontekstong si Moises ang nagpahayag ng pagpapala sa kanila.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan ng Diyos at ang karaniwang rekonstruksiyon ng bigkas nito.
translation_notes:
  register: Modernong Filipino na malinaw sa karaniwang mambabasa ngunit may marangal na himig. Pinanatili ang emphatic na pagpapatunay at ang pag-uulit tungkol sa kanilang paggawa upang maipakita ang ganap na pagsunod, nang hindi nagpapasok ng paliwanag na wala sa Hebreo.
