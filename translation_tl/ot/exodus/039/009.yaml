  text: It was square; they made the breastpiece doubled[a], a span its length and a span its width, doubled.
translation:
  language: tl
  text: Parisukat ito. Ginawa nilang may dobleng suson ang pektoral[a]; kapag nakatiklop nang doble, isang dangkal ang haba nito at isang dangkal ang lapad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakatiklop nang doble.” Ang Hebreong כָּפוּל ay maaaring mangahulugang ginawa itong dalawang suson o tiniklop upang maging doble.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ הָיָה
  choice: Parisukat ito
  rationale: Likas at tuwirang paglalarawan sa hugis; ang הָיָה ay nagsisilbing kopula.
- source_word: כָּפוּל
  choice: patong / nakapatong
  rationale: Ipinahihiwatig ng salita na ang tela ay doble ang suson o nakatiklop. Pinananatili ng talababa ang tunay na leksikal na posibilidad.
- source_word: עָשׂוּ
  choice: ginawa nila
  rationale: Tuwirang salin ng karaniwang pandiwang 'gumawa' nang walang dagdag na estilistikong kulay.
- source_word: הַחֹשֶׁן
  choice: ang pektoral
  rationale: Sa kontekstong pangsaserdote, tumutukoy ito sa kasuotang nasa dibdib ng punong pari. Ang 'pektoral' ay maikli, dignified, at hindi nagdaragdag ng pariralang wala sa talata.
- source_word: זֶרֶת
  choice: isang dangkal
  rationale: Ang dangkal ang natural na katumbas sa Filipino ng sinaunang sukat na span at hindi nangangailangan ng di-tiyak na modernong conversion.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Tuwirang inililipat ang pangngalan at panghalip na hulapi na tumutukoy sa pektoral.
- source_word: רָחְבּוֹ
  choice: ang lapad nito
  rationale: Natural na modernong Filipino para sa sukat na pahalang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang 'pektoral' bilang terminong pangkasuotang nasa dibdib; iniwasan ang mas mahabang 'pektoral ng paghatol' dahil wala ang karagdagang salita sa talatang ito. Ang pag-uulit ng כָּפוּל ay kinatawan sa 'patong' at 'habang nakapatong,' bagaman ang hulíng parirala ay bahagyang nagpapaliwanag ng kaugnayan nito sa mga sukat.
