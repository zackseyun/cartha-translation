  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: tl
  text: ang mesa, lahat ng kagamitan nito, at ang tinapay ng Presensya[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinapay ng mukha”; ayon sa tradisyon, “tinapay na handog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Tuwirang tumutukoy ang שֻׁלְחָן sa isang mesa. Sapat ang payak na salin dahil malinaw sa konteksto na kabilang ito sa mga kagamitan ng tabernakulo.
- source_word: כָּל כֵּלָיו
  choice: ang lahat ng kagamitan nito
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa kasangkapan, sisidlan, o kagamitan. Natural at sapat na malawak sa modernong Tagalog ang “mga kagamitan.”
- source_word: לֶחֶם הַפָּנִים
  choice: ang tinapay ng Presensya
  rationale: Literal na tumutukoy ang parirala sa “tinapay ng mukha/presensya.” Pinananatili ng “tinapay ng Presensya” ang natatanging katawagan at ang kaugnayan nito sa banal na presensya nang hindi ito tahasang pinapaliwanag sa pangunahing teksto.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: '[hindi hiwalay na isinalin]'
  rationale: Mga pananda ito sa tuwirang layon na nag-uugnay sa mga bagay sa talaan. Naipahahayag sa Tagalog ang tungkulin ng mga ito sa pamamagitan ng ayos at pangatnig.
theological_decisions:
- issue: Ang tinutukoy ng “Presensya” sa לֶחֶם הַפָּנִים
  choice: Hindi tahasang idinagdag ang “ng Diyos” o “ng PANGINOON” sa pangunahing teksto.
  alternative: ang tinapay na nasa harapan ng PANGINOON
  rationale: Nauunawaan sa konteksto na banal na presensya ang tinutukoy, ngunit walang tahasang banal na pangalan sa pariralang Hebreo. Iniiwasan ng salin ang pagdaragdag nito habang pinananatili ang pahiwatig ng orihinal.
translation_notes:
  register: Modernong, marangal, at madaling maunawaang Tagalog. Pinanatili ang anyong talaan at ang pangwakas na gatlang dahil bahagi lamang ito ng nagpapatuloy na pangungusap. Inilipat ang talababa sa pariralang “tinapay ng Presensya,” na siyang aktuwal na tinutukoy ng leksikal na paliwanag.
