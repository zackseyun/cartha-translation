  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: tl
  text: Ginawa nila ang mga batong oniks[a], na nakapaloob sa mga enggasteng ginto, at inukitan gaya ng pag-ukit sa isang pantatak, ayon sa mga pangalan ng mga anak na lalaki ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga batong shoham.” Hindi tiyak ang eksaktong uri ng batong tinutukoy, bagaman “oniks” ang tradisyonal na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ginawa nila
  rationale: Karaniwang kahulugan ng עשה ang “gumawa”; malinaw at likas ito sa konteksto ng paggawa ng kasuotang pansaserdote.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: mga batong onix[a]
  rationale: Tradisyonal at madaling maunawaang katumbas ng שֹׁהַם ang “onix,” ngunit pinanatili sa talababa ang kawalan ng katiyakan sa eksaktong uri ng batong tinutukoy.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: nakapaloob sa mga enggasteng ginto
  rationale: Ipinahihiwatig ng parirala na ang mga bato ay napalilibutan o nakakabit sa ginawang lalagyang ginto. Ang “enggaste” ay angkop na salitang Filipino para sa lagayan o kabitan ng hiyas nang hindi labis na tinutukoy ang eksaktong anyo ng pagkakayari.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: inukitan gaya ng pag-ukit sa isang pantatak
  rationale: Pinananatili nito ang pag-uulit at paghahambing sa estilong ukit ng isang pantatak o panselyo.
- source_word: עַל שְׁמוֹת
  choice: ayon sa mga pangalan
  rationale: Dito, ipinahihiwatig ng עַל ang pagkakatugma ng mga ukit sa mga pangalang tinutukoy.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  rationale: Tumpak nitong pinananatili ang tahasang panlalaking anyo ng pariralang Hebreo at ang pagtukoy sa mga anak na pinagmulan ng mga lipi.
theological_decisions:
- issue: Panlalaking katawagang tipan na בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  alternative: mga anak ni Israel; mga Israelita
  rationale: Tahasan ang panlalaking maramihan sa Hebreo. Sa talatang ito, kaugnay ng mga pangalang iuukit, ang mas tiyak na salin ay nagpapanatili rin ng ugnayan sa mga anak na lalaki ni Israel na pinagmulan ng mga lipi.
translation_notes:
  register: Makabago at marangal na Filipino, na may bokabularyong angkop sa paggawa ng alahas. Ginamit ang “enggaste” bilang natural na teknikal na katawagan sa kabitan ng hiyas, at “pantatak” upang malinaw na mailarawan ang חוֹתָם nang hindi umaasa sa hiram na salitang “selyo.”
