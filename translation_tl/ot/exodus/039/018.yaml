  terminology: Panatilihin ang “efod,” isang kinikilalang salitang teknikal para sa kasuotang pansaserdote. Ang “pinilipit na tanikala” ay angkop para sa braided/twisted chainwork. “Mga kabitan” ang neutral at malinaw na katawagan para sa מִשְׁבְּצוֹת nang hindi nagdaragdag ng detalye tungkol sa materyal o paraan ng pagkakagawa.
