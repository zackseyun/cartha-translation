revisions:
- from: At inilagay nila ang dalawang dulo ng dalawang pinilipit na tanikala sa dalawang kalupkop na lalagyan[a]. Pagkatapos, inilagay nila ang mga iyon sa mga bahagi ng efod na nasa balikat, sa harapan nito.
  to: At inilagay nila ang dalawang dulo ng dalawang pinilipit na tanikala sa dalawang kabitan[a], at inilagay nila ang mga ito sa mga piyesang pambalikat ng efod, sa harapan nito.
  rationale: Pinalitan ang hindi idiomatikong “kalupkop na lalagyan” ng “mga kabitan,” na malinaw na tumutukoy sa mga setting o mounting. Inayos din ang katawagan sa mga shoulder pieces bilang “mga piyesang pambalikat ng efod,” habang pinanatili ang lahat ng ugnayang pangbilang, pagkilos, at lokasyon sa Hebreo.
