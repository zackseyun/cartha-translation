base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/018.yaml
  text: And they put the two ends of the two braided chains on the two settings[a], and put them on the shoulder pieces of the ephod[b], at its front.
translation:
  language: tl
  text: At inilagay nila ang dalawang dulo ng dalawang pinilipit na tanikala sa dalawang kabitan[a], at inilagay nila ang mga ito sa mga piyesang pambalikat ng efod, sa harapan nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kalupkop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: mga dulo
  rationale: Tumutukoy ito sa mga dulong bahagi ng mga tanikala; natural at tiyak ang “mga dulo” sa modernong Filipino.
- source_word: הָעֲבֹתֹת
  choice: pinilipit na tanikala
  rationale: Sa konteksto ng kagamitang panrelihiyon at alahas, tumutukoy ito sa tanikalang hinubog sa pamamagitan ng pagpilipit o paghahabi, hindi sa payak na lubid.
- source_word: מִּשְׁבְּצֹת
  choice: kalupkop na lalagyan
  rationale: Tumutukoy sa mga ginintuang setting o mounting na pinaglalagyan at kinakabitan ng bahagi ng pektoral; ipinahihiwatig ng parirala ang masining na pagkakagawa.
- source_word: וַיִּתְּנֻם
  choice: inilagay nila ang mga iyon
  rationale: Ang pandiwang נתן ay pangunahing nangangahulugang ilagay o ipuwesto; iniiwasan nitong idagdag ang mas tiyak na diwang “ikinabit” na hindi tahasang sinasabi rito.
- source_word: כִּתְפֹת
  choice: mga bahagi ng efod na nasa balikat
  rationale: Sa konteksto ng kasuotan, mga piyesa o bahaging nakapatong sa balikat ang tinutukoy, hindi ang anatomikal na mga balikat lamang.
- source_word: אֶל מוּל פָּנָיו
  choice: sa harapan nito
  rationale: Ipinapahiwatig ng pariralang panlunan ang bahaging nakaharap sa unahan ng efod; ang “nito” ay malinaw na tumutukoy sa efod.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang terminong “efod” bilang natatanging katawagan sa kasuotang pansaserdote. Ginamit ang “pinilipit na tanikala” upang madaling maunawaan ang anyo ng ginawang tanikala, at ang “kalupkop na lalagyan” upang maipakita ang artisanong gamit ng מִשְׁבְּצוֹת nang hindi labis na nagpapakahulugan.
