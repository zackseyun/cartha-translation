  source_fidelity: Tumpak na naisasalin ng draft ang dalawang dulo, dalawang pinilipit na tanikala, dalawang setting/kabitan, mga piyesang pambalikat ng efod, at ang lokasyong nasa harapan nito. Gayunman, ang “kalupkop na lalagyan” ay hindi wastong natural na katumbas ng mga setting o mounting at maaaring magpahiwatig ng sisidlan.
