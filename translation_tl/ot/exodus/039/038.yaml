  text: ang gintong altar[a], ang langis na pampahid, ang insensong mabango[b], at ang tabing[c] sa pasukan ng tolda;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang altar na ginto.”
    reason: lexical_alternative
  - marker: b
