lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: ang altar na ginto
  rationale: Tuwirang ipinapakita ng pariralang Hebreo ang altar at ang materyal nitong ginto. Natural at malinaw sa modernong Filipino ang “altar na ginto.”
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: ang langis na pamahid
  rationale: Tumutukoy ito sa langis na ginagamit sa ritwal na pagpapahid. Ang “langis na pamahid” ay malinaw, maikli, at angkop sa konteksto.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: ang mabangong insenso
  rationale: Ang קְטֹרֶת ay insenso, at ang הַסַּמִּים ay mga mababangong sangkap. Ipinahahayag ng “mabangong insenso” ang kahulugan sa natural na Filipino nang hindi labis na tinutukoy ang eksaktong halo.
- source_word: מָסַךְ
  choice: ang tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa nakasabit na pantakip sa isang pasukan. Mas natural at malawak na nauunawaan sa Filipino ang “tabing” kaysa “screen,” habang nananatiling iba sa mas tiyak na panloob na belo.
- source_word: פֶּתַח הָאֹהֶל
  choice: sa pasukan ng tolda
  rationale: Malinaw na tinutumbasan nito ang pasukan o bukana ng tolda at pinananatili ang payak na katawagan ng tekstong Hebreo.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: listahang pinaghihiwalay ng kuwit, na may “at” bago ang huling bagay
  rationale: Minamarkahan ng inuulit na וְאֵת ang bawat tuwirang layon. Sa natural na Filipino, sapat ang mga pantukoy at kuwit, kasama ang “at” bago ang huling aytem.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan at ang tuloy na sintaks ng nakaraang talata; kaya nagtatapos ang sipi sa tuldok-kuwit. Ang “tolda” ay sumusunod sa payak na אֹהֶל at hindi ipinapalit ang mas interpretibong “tabernakulo.”
