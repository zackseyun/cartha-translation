  text: the pegs of the tabernacle[a], and the pegs of the courtyard, and their ropes—
translation:
  language: tl
  text: ang mga tulos ng Tabernakulo, at ang mga tulos ng looban, at ang mga lubid[a] ng mga ito—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga tali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְדֹת
  choice: mga tulos
  rationale: Tumutukoy sa mga tulos na ipinapako sa lupa upang patatagin ang tolda at ang mga tabing. Karaniwan at malinaw ang “mga tulos” sa makabagong Filipino.
- source_word: הַמִּשְׁכָּן
  choice: ang Tabernakulo
  rationale: Ito ang nakaugaliang katawagan sa sagradong tahanang-tolda sa Exodo at mas tiyak kaysa sa literal ngunit malabong “tirahan.”
- source_word: הֶחָצֵר
  choice: ang looban
  rationale: Tumutukoy sa nababakurang panlabas na lugar sa palibot ng Tabernakulo. Natural at madaling maunawaan ang “looban” sa Filipino.
- source_word: מֵיתְרֵיהֶם
  choice: ang mga lubid ng mga iyon
  rationale: Ang מֵיתָר ay lubid o tali na ginagamit upang patatagin ang estruktura. Pinananatili ng “ng mga iyon” ang pangmaramihang hulaping Hebreo nang hindi nililimitahan ang tinutukoy nito sa isa lamang sa mga naunang bagay.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: ang mga tulos ... at ang mga tulos ... at ang mga lubid
  rationale: Hindi tuwirang isinasalin ang panandang layon na אֶת, ngunit pinananatili ang paulit-ulit na ayos ng talaan sa pamamagitan ng magkakaugnay na parirala.
