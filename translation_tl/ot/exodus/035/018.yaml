translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang nakaugaliang “Tabernakulo” para sa terminong panritwal, samantalang pangkaraniwang salita ang “looban,” “tulos,” at “lubid.” Pinanatili ang anyong bahagi ng isang nagpapatuloy na talaan at ang pangwakas na gitling.
