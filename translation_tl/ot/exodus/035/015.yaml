  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: tl
  text: ang altar ng insenso[a] at ang mga pingga nito, ang langis para sa pagpapahid, ang mabangong insenso[b], at ang tabing para sa pasukan ng tabernakulo[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “altar para sa pagsusunog ng insenso.”
    reason: lexical_alternative
  - marker: b
    text: O “insensong yari sa mababangong sangkap” o “insensong may mga espesya.”
    reason: lexical_alternative
  - marker: c
    text: O “kurtina para sa pasukan” o “tabing sa pasukan ng tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: altar ng insenso
  rationale: Tuwirang ipinapahayag ng pariralang konstruktong Hebreo ang altar na kaugnay ng insenso. Likas at malinaw sa makabagong Filipino ang “altar ng insenso” at hindi nito dinaragdagan ang kahulugan ng tekstong pinagmulan.
- source_word: בַּדָּיו
  choice: mga pingga nito
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa mahahabang pinggang ginagamit sa pagbuhat ng sagradong kagamitan. Ang “mga pingga” ay maikli at nauunawaan nang hindi gumagamit ng lipas na katawagan.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Pinananatili nito ang ritwal na gamit ng langis sa pagpapahid at tumutugma sa karaniwang bokabularyong biblikal sa Filipino.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: mabangong insenso
  rationale: Ang הַסַּמִּים ay tumutukoy sa mababangong sangkap o espesya. Natural na naihahatid ng “mabangong insenso” ang diwa, habang itinatala sa talababa ang mas pormal na mga alternatibo.
- source_word: מָסַךְ הַפֶּתַח
  choice: tabing para sa pasukan
  rationale: Ang מָסָךְ ay isang nakasabit na pantabing sa pintuan o pasukan. Ang “tabing” ay natural at sapat na malawak upang hindi sapilitang tukuyin ang eksaktong anyo nito bilang kurtina.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: para sa pasukan ng tabernakulo
  rationale: Ipinapakita ng לְ ang kaugnayan o layunin ng tabing para sa pasukan. Ang saling ito ay natural sa Filipino; ang posibleng lokatibong pagbasa na “sa pasukan” ay pinananatili sa talababa.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ang “tabernakulo” ang kinikilalang katawagan sa santuaryong naililipat-lipat sa Exodo at nagpapanatili ng terminolohikal na pagkakapare-pareho.
