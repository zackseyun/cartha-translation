  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: tl
  text: At ang lahat ng babaeng naudyukan ng kanilang puso ay nag-ikid nang may kasanayan ng balahibo ng kambing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang mga kambing”; sa Hebreo, ipinahihiwatig ang balahibo ng kambing na ginagamit sa pag-iikid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: At lahat ng babae
  rationale: Ang כָּל kasama ng pangmaramihang pangngalan ay may kolektibong diwa; natural itong isalin bilang “lahat ng babae.”
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: ang puso ay nag-udyok sa kanila
  rationale: Ang literal na larawan ng pusong “nag-angat” sa kanila ay isang idyoma para sa panloob na pagkukusa o pagganyak; pinananatili ng “nag-udyok” ang diwa sa natural na Tagalog.
- source_word: בְּחָכְמָה
  choice: nang may kasanayan
  rationale: Sa konteksto ng paggawa ng tela, ang חָכְמָה ay tumutukoy sa praktikal na husay, hindi lamang sa abstraktong karunungan.
- source_word: טָווּ
  choice: nag-ikid
  rationale: Ang pandiwa ay tumutukoy sa pag-ikid o pagpilipit ng hibla upang maging sinulid; ang “nag-ikid” ay tiyak at angkop sa gawaing tela.
- source_word: אֶת הָעִזִּים
  choice: ng balahibo ng mga kambing
  rationale: Literal na “ang mga kambing,” ngunit elipsis ito sa konteksto ng tela at tumutukoy sa balahibo ng kambing na iniikid. Ginawang tahasan ang ipinahihiwatig na materyal upang hindi mapagkamalang mismong mga hayop ang iniikid.
