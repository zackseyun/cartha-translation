translation:
  language: tl
  text: Huwag kayong magsindi ng apoy sa alinman sa inyong mga tirahan sa araw ng Sabbath.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: magpaningas
  rationale: Ang Piel ng בער ay tumutukoy rito sa pagsisindi o pagpapaliyab ng apoy. Ang “magpaningas” ay tiyak at marangal na katumbas sa Filipino, at hindi nito pinalalawak ang utos tungo sa lahat ng paggamit ng apoy.
- source_word: אֵשׁ
  choice: ng apoy
  rationale: Likas sa Filipino ang pariralang “magpaningas ng apoy.” Hindi kailangan ang pantukoy na katumbas ng English na “a,” sapagkat walang gayong artikulong di-tiyak sa Filipino.
- source_word: בְּכֹל
  choice: sa alinman sa
  rationale: 'Ipinahahayag nito ang distributibong diwa ng כֹּל: saklaw ng pagbabawal ang bawat tirahan, nang hindi nagiging kahoy ang salin na “sa lahat ng.”'
- source_word: מֹשְׁבֹתֵיכֶם
  choice: inyong mga tirahan
  rationale: Ang “mga tirahan” ay nagpapanatili sa malawak na kahulugan ng מוֹשָׁב bilang mga lugar na tinitirhan; hindi ito nililimitahan sa pribadong bahay lamang o binabago tungo sa mga pamayanan.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: sa araw ng Sabbath
  rationale: Tuwirang pinananatili nito ang tahasang “araw” sa Hebreo at gumagamit ng malinaw at kinikilalang katawagang “Sabbath.”
theological_decisions:
- issue: Saklaw ng pagbabawal tungkol sa apoy sa Sabbath
  choice: Isinalin bilang tuwirang pagbabawal sa pagpapaningas ng apoy sa mga tirahan.
  alternative: Palawakin ito upang ipagbawal ang lahat ng paggamit o pagpapanatili ng apoy, o ang lahat ng gawaing may init.
  rationale: Tiyak na pagpapaningas ng apoy ang ipinagbabawal ng tekstong Hebreo. Hindi dapat ipasok sa salin ang mga mas malawak na pagpapakahulugang hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “magpaningas” dahil mas tiyak ito kaysa “magsunog” at mas angkop sa apoy kaysa sa payak na “magsindi.”
