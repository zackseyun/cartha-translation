  text: and rams’ skins dyed red[a], and hides of sea cows, and acacia wood.
translation:
  language: tl
  text: at mga balat ng lalaking tupa na kinulayan ng pula, mga balat ng hayop na tehash[a], at kahoy na akasya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang pagkakakilanlan ng hayop na tinutukoy ng salitang Hebreo na תְּחָשִׁים (tehashim). Isinasalin din ito bilang “pinong katad,” “katad na kambing,” “mga balat ng marsopa,” “mga balat ng dugong,” o “mga balat ng bakang-dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: mga balat
  rationale: Ang pangmaramihang anyong construct ng עוֹר ay tumutukoy sa mga balat ng hayop na ginagamit bilang materyal.
- source_word: אֵילִם
  choice: lalaking tupa
  rationale: Tiyak na tumutukoy ang אֵיל sa lalaking tupa; malinaw at likas sa modernong Filipino ang pariralang ito.
- source_word: מְאָדָּמִים
  choice: kinulayan ng pula
  rationale: Ipinahihiwatig ng passive/resultative na anyo na ginawang pula ang mga balat, malamang sa pamamagitan ng pagkukulay.
- source_word: עֹרֹת תְּחָשִׁים
  choice: pinong katad
  rationale: Hindi tiyak ang kahulugan ng תְּחַשׁ. Iniiwasan ng saling ito ang di-matiyak na pagtukoy sa isang partikular na hayop, habang ipinahihiwatig na katad na pantakip ang materyal; inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: עֲצֵי שִׂטִּים
  choice: kahoy na akasya
  rationale: Tumutukoy ang parirala sa kahoy mula sa punong akasya; ito ang malinaw at karaniwang katawagan sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang anyong listahan ng Hebreo, ngunit hindi inulit ang “at” bago ang bawat sangkap upang maging likas sa Filipino. Inilagay ang talababa sa “pinong katad,” ang mismong salitang may leksikal na katiyakan, sa halip na sa “kinulayan ng pula.”
