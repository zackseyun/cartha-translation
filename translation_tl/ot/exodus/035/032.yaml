    text: Maaari ring “upang magplano ng mga plano” o “upang magdisenyo ng mga disenyo.” Gumagamit ang Hebreo ng pandiwa at pangngalang mula sa iisang ugat upang idiin ang bihasang pagbuo ng disenyo.
