lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: upang mag-isip ng masining na mga disenyo
  rationale: Ang pandiwa at kaugnay na pangngalan ay mula sa iisang ugat at tumutukoy sa malikhaing pagpaplano sa konteksto ng bihasang paggawa. Pinananatili ng “mag-isip ng ... mga disenyo” ang pag-uulit ng diwa nang natural sa modernong Tagalog; idinagdag ang “masining” upang linawin ang konteksto ng pagdidisenyo, hindi karaniwang pag-iisip lamang.
- source_word: לַ/עֲשֹׂת
  choice: gumawa
  rationale: Malawak ang kahulugan ng עשה na “gumawa,” at dito ay tumutukoy sa pagsasakatuparan ng mga disenyo sa mga materyal na metal.
- source_word: בַּ/זָּהָב וּ/בַ/כֶּסֶף וּ/בַ/נְּחֹשֶׁת
  choice: gamit ang ginto, pilak, at tanso
  rationale: Sa Tagalog, natural na ipinahahayag ng “gamit ang” ang mga materyales na pinagtatrabahuhan. Ang “tanso” ang karaniwang salin ng נְחֹשֶׁת, bagaman maaaring tukuyin ng sinaunang termino ang copper o bronze.
