lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: ang mabangong sangkap
  rationale: Ang בֹּשֶׂם ay tumutukoy sa isang mabangong materyal, espesya, o balsamo. Ang “mabangong sangkap” ay malinaw sa modernong Filipino at hindi labis na nagpapakipot sa kahulugan.
- source_word: הַשָּׁמֶן
  choice: ang langis
  rationale: Karaniwang salita para sa langis ang שֶׁמֶן. Hindi idinagdag ang “olibo” sapagkat hindi iyon tahasang sinabi rito.
- source_word: לְמָאוֹר
  choice: para sa ilaw
  rationale: Tumutukoy ang מָאוֹר sa liwanag o pinagmumulan nito; sa talaang ito, ang langis ay ginagamit upang magbigay-liwanag. Iniiwasan ng salin ang pagdaragdag ng isang partikular na lampara.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Natural at pamilyar na parirala ito para sa sagradong langis na ginagamit sa pagpapahid, habang pinananatili ang dalawang sangkap ng pariralang Hebreo.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: insensong yari sa mga sangkap na mabango
  rationale: Pinananatili nito ang parehong ideya ng insenso at ng mga aromatikong sangkap sa konstruksiyong Hebreo, sa paraang malinaw at natural sa Filipino.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: at ... at ... para sa ... at para sa
  rationale: Pinananatili ang sunod-sunod na pag-uugnay ng mga bagay bilang pagpapatuloy ng listahan mula sa naunang talata.
