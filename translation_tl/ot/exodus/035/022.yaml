revisions:
- from: Kaya dumating ang mga lalaki kasama ng mga babae[a]. Ang bawat kusang-loob ang puso ay nagdala ng mga panara, hikaw, singsing, at mga palamuti—lahat ng uri ng alahas na ginto[b]. At ang bawat lalaking naghandog ng gintong handog na iwinagayway para kay Yahweh ay nagdala nito.
  to: Kaya dumating ang mga lalaki kasama ng mga babae[a]. Bawat may kusang-loob na puso ay nagdala ng mga panara, hikaw, singsing, at mga palamuti—lahat ng uri ng alahas na yari sa ginto[b]. At bawat lalaking naghandog kay Yahweh ng gintong handog na iwinagayway ay nagdala rin ng mga handog.
  rationale: 'Inayos ang dalawang suliranin sa Filipino nang hindi binabago ang kahulugan: ang kusang-loob na disposisyon ng puso at ang karagdagang paglalarawan sa mga lalaking nagdala ng gintong handog na iwinagayway. Pinanatili ang maingat na kawalang-katiyakan sa idyoma at sa mga katawagan ng alahas sa mga talababa.'
