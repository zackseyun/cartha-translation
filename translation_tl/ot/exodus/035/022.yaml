  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: tl
  text: Kaya dumating ang mga lalaki kasama ng mga babae[a]. Bawat may kusang-loob na puso ay nagdala ng mga panara, hikaw, singsing, at mga palamuti—lahat ng uri ng alahas na yari sa ginto[b]. At bawat lalaking naghandog kay Yahweh ng gintong handog na iwinagayway ay nagdala rin ng mga handog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Idyomatiko at maaaring unawain sa higit sa isang paraan ang Hebreong pariralang “ang mga lalaki sa/kasama ng mga babae.” Malamang na nangangahulugan itong dumating ang mga lalaki kasama ng mga babae, o dumating din sila bukod sa mga babae.
    reason: alternative_reading
  - marker: b
    text: Hindi tiyak ang eksaktong kahulugan ng ilan sa mga salitang Hebreo para sa alahas. Ang “mga panara” ay maaari ring mga pang-ipit o singsing; ang “hikaw” ay maaari ring singsing sa ilong; at ang “mga palamuti” ay maaaring isang partikular na uri ng palawit, pulseras, o pambraso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kaya dumating
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “Kaya” bilang pag-uugnay sa naunang panawagan at tugon.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: ang mga lalaki kasama ng mga babae
  rationale: Idyomatiko at hindi tiyak ang gamit ng עַל dito. Sa konteksto, malamang na magkasamang dumating, o dumating din bukod sa mga babae, ang mga lalaki; hindi ito literal na lokasyong “sa ibabaw.”
- source_word: כֹּל נְדִיב לֵב
  choice: ang bawat kusang-loob ang puso
  rationale: Pinananatili nito ang Hebreong larawan ng puso bilang kalooban habang malinaw na kusang pagbibigay ang tinutukoy.
- source_word: הֵבִיאוּ
  choice: nagdala
  rationale: Karaniwan at tuwirang katumbas ng הביא sa konteksto ng pagdadala ng mga ambag.
- source_word: חָח
  choice: mga panara
  rationale: Hindi tiyak ang eksaktong alahas; ang “panara” ay sapat na malawak upang tumukoy sa brotsa o pang-ipit nang hindi labis na nagpapasya.
- source_word: נֶזֶם
  choice: hikaw
  rationale: Maaaring singsing sa tainga o ilong ang נֶזֶם. Natural na pangunahing salin ang “hikaw,” at inilalahad sa talababa ang ibang posibilidad.
- source_word: טַבַּעַת
  choice: singsing
  rationale: Tiyak ang pangkalahatang diwang singsing, ngunit hindi tahasang sinasabi ng talata na pantatak ito; iniiwasan ang sobrang espesipikong salin.
- source_word: כוּמָז
  choice: mga palamuti
  rationale: Bihira at hindi tiyak ang salita. Ang malawak na “mga palamuti” ay umiiwas sa huwad na katiyakan.
- source_word: כָּל כְּלִי זָהָב
  choice: lahat ng uri ng alahas na ginto
  rationale: Bagaman malawak ang כְּלִי, ang agarang talaan ay mga personal na palamuting ginto; natural at kontekstuwal ang saling ito.
- source_word: וְכָל אִישׁ
  choice: At ang bawat lalaki
  rationale: Pinananatili ang tahasang panlalaking anyong אִישׁ sa pinagmulan.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: naghandog ng gintong handog na iwinagayway
  rationale: Pinananatili ang ritwal na kilos at teknikal na diwa ng תְּנוּפָה, sa halip na gawing pangkalahatang “handog” lamang.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang יהוה bilang Yahweh.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; pinananatili itong “Yahweh” sa halip na palitan ng titulo.
- issue: Panlalaking wika sa וְכָל אִישׁ
  choice: ang bawat lalaki
  alternative: ang bawat isa / bawat tao
  rationale: Tahasan ang אִישׁ na “lalaki”; hindi ito ginawang neutral, habang malinaw na binabanggit din sa unang pangungusap ang pakikibahagi ng mga babae.
- issue: Ritwal na kahulugan ng תְּנוּפָה
  choice: handog na iwinagayway
  alternative: handog / handog na iniharap
  rationale: Pinananatili ang ritwal na espesipikasyon nang hindi ipinapaliwanag kung eksakto kung paano isinagawa ang pagwawagayway.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kusang-loob ang puso” upang mapanatili ang Hebreong larawan nang hindi maging labis na makaluma. Pinanatili ang dalawang talababa dahil tunay na hindi tiyak ang idyoma at ang ilang katawagan sa alahas.
