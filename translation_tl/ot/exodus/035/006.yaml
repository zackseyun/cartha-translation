  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: tl
  text: at asul na sinulid, at purpurang sinulid, at matingkad na pulang sinulid, at pinong lino, at balahibo ng kambing[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga kambing”; sa kontekstong ito, tumutukoy ito sa balahibo ng kambing na ginagamit na materyal para sa tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְכֵלֶת
  choice: mga sinulid na asul
  rationale: Tumutukoy ang salita sa asul o asul-purpurang materyal na tinina para sa mga tela ng tabernakulo. Ginamit ang “mga sinulid” bilang likas na pagpapahayag ng ipinahihiwatig na materyal sa listahang ito.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Tumutukoy ito sa mamahaling materyal na tinina ng kulay purpura. Nakaugnay ito sa naunang “mga sinulid,” kaya hindi na kailangang ulitin ang pangngalan.
- source_word: תוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Ang parirala ay tumutukoy sa materyal na tinina ng pulang pangkulay na mula sa isang uri ng insekto. Ang “matingkad na pula” ay malinaw at likas sa modernong Filipino, habang ang “mga sinulid” sa simula ay saklaw rin ito.
- source_word: שֵׁשׁ
  choice: pinong lino
  rationale: Sa konteksto ng tabernakulo, karaniwang tumutukoy ang salita sa lino na pino ang kalidad, hindi lamang sa lino sa pangkalahatan.
- source_word: עִזִּים
  choice: balahibo ng kambing
  rationale: Literal na “mga kambing” ang anyo ng Hebreo, ngunit sa listahan ng mga materyales ay tumutukoy ito sa balahibo ng kambing na ginagamit sa paghahabi ng mga pantakip.
- source_word: וְ
  choice: at
  rationale: Pinanatili ang paulit-ulit na pangatnig ng Hebreo hangga't likas sa Filipino upang maipakita ang ayos ng listahan.
