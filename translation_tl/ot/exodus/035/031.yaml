base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: tl
  text: At pinuspos niya siya ng Espiritu ng Diyos[a], ng karunungan, pang-unawa, kaalaman, at bawat uri ng gawaing-kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “espiritu ng Diyos” o “isang espiritung mula sa Diyos.” Maaaring unawain nang mas pangkalahatan ang pariralang Hebreo, ngunit dito ay malamang na tumutukoy ito sa sariling Espiritu ng Diyos na nagbibigay ng kakayahan.
    reason: alternative_reading
  - marker: b
    text: O “sa lahat ng gawain” o “sa bawat uri ng pagkakagawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: At pinuspos
  rationale: Isinasalin ang Piel na pandiwang pasalaysay bilang ganap na pagkakaloob o pagpuno. Likas at marangal sa Filipino ang “pinuspos” sa konteksto ng kapangyarihang mula sa Diyos.
- source_word: אֹתוֹ
  choice: niya siya
  rationale: Ang “siya” ay tumutukoy kay Bezalel mula sa naunang talata; ang paksa ng “niya” ay ang Diyos na binanggit din sa naunang konteksto.
- source_word: רוּחַ אֱלֹהִים
  choice: Espiritu ng Diyos
  rationale: Sa konteksto ng pagbibigay ng kakayahan para sa banal na gawain, malamang na tumutukoy ito sa sariling Espiritu ng Diyos. Nananatili sa talababa ang mas pangkalahatang mga posibilidad ng pariralang Hebreo.
- source_word: בְּחָכְמָה
  choice: ng karunungan
  rationale: Ang חָכְמָה ay karunungang ibinigay ng Diyos na may praktikal at malikhaing bisa sa kontekstong ito.
- source_word: בִּתְבוּנָה
  choice: pang-unawa
  rationale: Ang “pang-unawa” ay natural na katumbas ng תְּבוּנָה at pinananatiling naiiba sa karunungan at kaalaman.
- source_word: וּבְדַעַת
  choice: at kaalaman
  rationale: Pinananatili ang pangunahing kahulugan ng דַּעַת bilang “kaalaman” sa halip na paliitin ito sa teknikal na husay lamang.
- source_word: וּבְכָל מְלָאכָה
  choice: at ng kasanayan sa lahat ng uri ng gawain
  rationale: Sa agarang konteksto ng paggawa ng tabernakulo, ang מְלָאכָה ay tumutukoy sa gawaing nangangailangan ng kasanayan. Ipinahahayag ng “lahat ng uri” ang saklaw ng כָּל sa natural na Filipino.
theological_decisions:
- issue: Kung ang רוּחַ אֱלֹהִים ay personal na “Espiritu ng Diyos” o mas pangkalahatang “espiritu ng Diyos/isang espiritung mula sa Diyos”
  choice: Espiritu ng Diyos
  alternative: espiritu ng Diyos; isang espiritung mula sa Diyos
  rationale: Pinakamalamang sa konteksto na ang sariling Espiritu ng Diyos ang nagbibigay-kakayahan kay Bezalel. Gayunman, hindi ganap na nilulutas ng anyong Hebreo lamang ang lahat ng posibleng pagbasa, kaya inilalahad ang mga ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “pinuspos” upang maiwasan ang alanganing “pinuno niya siya,” at pinanatili ang magkakahiwalay na karunungan, pang-unawa, at kaalaman. Hindi ginawang malaking titik ang panghalip na tumutukoy sa Diyos sapagkat walang gayong pagtatangi sa tekstong Hebreo.
