  source_fidelity: 'Tumpak ang salin sa Hebreo: naipapahayag ang pagpapatuloy ng salaysay, ang pangmaramihang panawagan na magbigay-pansin, ang pagtawag ni Yahweh kay Bezalel “sa pangalan,” ang talaangkanang Uri–Hur, at ang pagkakabilang niya sa lipi ni Juda. Ang “mga anak ni Israel” ay pinananatili ang pampamilyang larawan ng בני ישראל; nililinaw ng talababa ang literal na anyong panlalaki at ang kolektibong gamit nito.'
