id: EXO.35.30
reference: Exodus 35:30
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Moises sa mga anak ni Israel[a], “Tingnan ninyo, tinawag ni Yahweh sa pangalan si Bezalel na anak ni Uri, na anak ni Hur, mula sa lipi ni Juda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga Israelita.” Literal sa Hebreo: “mga anak na lalaki ni Israel,” isang kolektibong tawag sa bayang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang tahasang pananalitang pampamilya ng Hebreo at ang kolektibong pagtukoy sa bayang Israel.
- source_word: רְאוּ
  choice: Tingnan ninyo
  rationale: Pautos na maramihan ito na tumatawag ng pansin sa kasunod na pahayag; malinaw at natural ang “Tingnan ninyo.”
- source_word: קָרָא ... בְּשֵׁם
  choice: tinawag ... sa pangalan
  rationale: Pinananatili ang idyomang Hebreo at ang diwa ng personal at tiyak na pagpili kay Bezalel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: si Bezalel na anak ni Uri, na anak ni Hur
  rationale: Malinaw na pinananatili ang sunod-sunod na talaangkanan sa natural na anyong Tagalog.
- source_word: לְמַטֵּה יְהוּדָה
  choice: mula sa lipi ni Juda
  rationale: Likas na Tagalog ito para sa pagkakaugnay ni Bezalel sa tribo o lipi ni Juda.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: May kasariang pananalitang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga supling ni Israel
  rationale: Pormal na panlalaking maramihan ang Hebreo ngunit kolektibo ang etnikong saklaw. Pinananatili sa pangunahing teksto ang pampamilyang larawan nang hindi nililimitahan ang tinutukoy sa mga lalaki lamang; inilalahad sa talababa ang mas idyomatikong alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “lipi” sa halip na “tribo” bilang likas na katawagan sa kontekstong biblikal, at pinanatili ang pangalang Yahweh at ang pampamilyang anyo ng pariralang Hebreo.
