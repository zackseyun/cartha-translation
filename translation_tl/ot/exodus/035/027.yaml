  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: tl
  text: Dinala rin ng mga pinuno ang mga batong oniks[a] at ang mga batong ilalagay sa mga enggaste, para sa efod at sa pektoral[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “mga batong shoham.” Hindi tiyak kung anong hiyas ang tinutukoy, bagaman “oniks” ang tradisyonal na salin.
    reason: lexical_alternative
  - marker: b
    text: O “palamuti sa dibdib.” Ang Hebreo ay tumutukoy sa kasangkapang pangpari na isinusuot sa dibdib, hindi sa baluting pandigma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: mga pinuno
  rationale: Ang נְשִׂיאִים ay tumutukoy sa mga kinatawan o pinuno ng sambayanan; malinaw ang “mga pinuno” at hindi ito nagpapahiwatig ng pagkamaharlika.
- source_word: הֵבִיאוּ
  choice: dinala
  rationale: Ang Hiphil ng בוא dito ay karaniwang nangangahulugang magdala; ang “dinala” ay natural sa konteksto ng paghahandog ng mga materyales.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: mga batong onix
  rationale: Tradisyonal at madaling makilala ang “onix,” ngunit hindi tiyak ang eksaktong uri ng batong tinutukoy ng שֹׁהַם, kaya pinanatili ang pag-aalinlangan sa talababa.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: mga batong ilalagay sa mga enggaste
  rationale: Sa konteksto ng alahas, tumutukoy ang מִלֻּאִים sa paglalagay o pagkakabit ng mga bato sa kanilang enggaste. Ipinahahayag ng salin ang gamit nang hindi sumusunod sa malabong literal na “mga bato ng pagpuno.”
- source_word: לָאֵפֹד
  choice: para sa efod
  rationale: Walang ganap na katumbas sa Filipino ang אֵפֹד; ang transliterasyong “efod” ay kinikilalang katawagan sa kasuotang pangpari.
- source_word: וְלַחֹשֶׁן
  choice: at sa pektoral
  rationale: Ang חֹשֶׁן ay sagradong kasangkapang isinusuot sa dibdib at nakakabit sa efod. Ang “pektoral” ay maikli at hindi nagmumungkahing ito ay baluting pandigma.
