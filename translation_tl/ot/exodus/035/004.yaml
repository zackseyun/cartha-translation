  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Moises sa buong kapulungan ng mga anak ni Israel[a], “Ito ang iniutos ni Yahweh[b]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “buong kapulungan ng mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “Ito ang salita/bagay na iniutos ni Yahweh, na sinasabi.” Ipinakikilala nito ang mismong utos na sumusunod.'
    reason: source_transparency
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi” at napapanatili nito ang sunod-sunod na kilos.
- source_word: עֲדַת
  choice: kapulungan
  rationale: Tumutukoy ang עֵדָה sa sama-samang pamayanan ng Israel, lalo na bilang nagkakatipong pangkat; malinaw at marangal ang “kapulungan” sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyong pangkamag-anakan ng Hebreo at ang tradisyonal na pagkakakilanlan ng bayan, nang hindi ipinapalagay na mga literal na anak lamang ng patriyarka ang tinutukoy.
- source_word: זֶה הַדָּבָר
  choice: Ito ang
  rationale: Sa pormulang nagpapakilala ng utos, idiomatiko sa Tagalog ang “Ito ang iniutos.” Saklaw ng דָּבָר ang “salita,” “bagay,” o “usapin,” ngunit magiging matigas at malabo rito ang literal na “Ito ang salita/bagay na iniutos.”
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang aspektong ganap ng pandiwa ay natural na naihahayag sa Tagalog sa aspektong perpektibo na “iniutos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat ang personal na pangalang יהוה sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לֵאמֹר
  choice: tutuldok pagkatapos ng pambungad
  rationale: Ang huling לֵאמֹר ay nagpapakilala sa nilalaman ng utos na sumusunod sa susunod na talata. Sa natural na Tagalog, sapat at mas malinaw ang tutuldok kaysa sa kalabisan na “na sinasabi.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa isang titulo nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Saklaw ng kasarian sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang tahasang larawang pangkamag-anakan sa Hebreo. Sa konteksto, ang parirala ay tawag sa sambayanan ng Israel, hindi kinakailangang paghihigpit sa mga lalaki lamang.
- issue: Pagpapakahulugan sa זֶה הַדָּבָר
  choice: Ito ang iniutos
  alternative: Ito ang salita/bagay na iniutos
  rationale: Hindi nilulutas sa isang makitid na kahulugan ang malawak na saklaw ng דָּבָר; inililipat sa likas na pormulang Tagalog ang tungkulin nitong magpakilala ng utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kapulungan” para sa kolektibong sambayanan at ang tutuldok upang likas na ipakilala ang utos sa kasunod na talata. Lahat ng marker ng talababa ay nasa pangunahing teksto.
