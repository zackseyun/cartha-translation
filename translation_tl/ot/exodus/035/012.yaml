base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/012.yaml
  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: tl
  text: ang kaban at ang mga pingga nito, ang luklukan ng awa[a], at ang tabing na pangharang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang takip na pantubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֹן
  choice: ang kaban
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang אָרוֹן sa banal na kaban. Likas at kinikilalang katawagan sa Filipino ang “kaban,” at mas tiyak ito rito kaysa sa pangkalahatang “baul.”
- source_word: בַּדָּיו
  choice: ang mga pingga nito
  rationale: Ang בַּדִּים ay mahahabang pinggang ginagamit sa pagbuhat at pagdadala ng mga banal na kagamitan. Malinaw at kasalukuyang Filipino ang “mga pingga.”
- source_word: הַכַּפֹּרֶת
  choice: ang luklukan ng awa[a]
  rationale: Tumutukoy ang כַּפֹּרֶת sa gintong takip ng kaban na may natatanging papel sa ritwal ng pagtubos. Pinananatili ng “luklukan ng awa” ang nakaugaliang katawagang kultiko, habang inilalagay sa talababa ang mas lantad na alternatibong “takip na pantubos.”
- source_word: פָּרֹכֶת
  choice: ang tabing
  rationale: Ang פָּרֹכֶת ay ang panloob na tabing na naghihiwalay sa mga bahagi ng tabernakulo. Ang “tabing” ay likas at naipapakita ang gamit nitong paghihiwalay.
- source_word: הַמָּסָךְ
  choice: na pangharang
  rationale: Ang מָסָךְ ay isang pantabing o harang. Sa pariralang פָּרֹכֶת הַמָּסָךְ, ang “tabing na pangharang” ay natural sa Filipino at pinananatili ang mapaglarawang diwa ng ikalawang pangngalan nang hindi nagdaragdag ng hindi tiyak na layunin.
- source_word: אֶת / וְאֶת
  choice: '[hindi isinalin ang mga pananda ng tiyak na layon]'
  rationale: Ang paulit-ulit na אֶת ay pananda ng tiyak na tuwirang layon at walang tuwirang katumbas sa Filipino; ipinahahayag ang pagkakaugnay sa pamamagitan ng kuwit at “at.”
theological_decisions:
- issue: Paglalahad sa הַכַּפֹּרֶת sa konteksto ng tabernakulo
  choice: ang luklukan ng awa
  alternative: ang takip na pantubos
  rationale: Parehong mahalaga ang pisikal na katangian nito bilang takip ng kaban at ang kaugnayan nito sa ritwal ng pagtubos. Ginamit sa teksto ang nakaugaliang katawagang “luklukan ng awa,” ngunit pinanatili sa talababa ang mas literal at nagpapaliwanag na alternatibo upang hindi itago ang saklaw ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong talaan ng talata at ang pangwakas na kuwit dahil bahagi ito ng nagpapatuloy na pangungusap. Inilipat nang wasto ang tandang [a] sa “luklukan ng awa,” sapagkat doon nauukol ang leksikal na alternatibo.
