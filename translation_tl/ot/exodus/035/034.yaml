base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: tl
  text: At binigyan niya ng kakayahang magturo[a] si Bezalel, gayundin si Oholiab na anak ni Ahisamac, mula sa lipi ni Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magbigay ng tagubilin.” Malawak ang saklaw ng pandiwang Hebreo at maaaring tumukoy sa pagtuturo, kabilang ang paggabay sa gawaing nangangailangan ng kasanayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: kakayahang magturo
  rationale: Ang Hiphil infinitive ng ירה ay nangangahulugang “magturo” o “magbigay ng tagubilin.” Ang “kakayahang magturo” ay natural sa Filipino kasunod ng idyomang נָתַן בְּלִבּוֹ at ipinahihiwatig ang panloob na pagkakaloob ng kakayahan.
- source_word: נָתַן בְּלִבּוֹ
  choice: binigyan niya siya ng kakayahan
  rationale: Ang literal na “inilagay sa kanyang puso” ay isang Hebreong idyoma para sa panloob na pagkakaloob o paghubog ng disposisyon. Mas malinaw at natural sa modernong Filipino ang “binigyan niya siya ng kakayahan,” habang pinananatili ang Diyos bilang pinagmulan ng kakayahan.
- source_word: הוּא
  choice: siya
  rationale: Pinananatili ang tahasang panghalip at ang diin nito sa pariralang “siya at si Oholiab.”
- source_word: וְאָהֳלִיאָב
  choice: at si Oholiab
  rationale: Isinalin ang pang-ugnay at ginamit ang karaniwang transliterasyon ng pangalang pantangi.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: na anak ni Ahisamac
  rationale: Tuwirang ipinapahayag ang ugnayang mag-ama sa natural na ayos ng Filipino.
- source_word: לְמַטֵּה דָן
  choice: mula sa lipi ni Dan
  rationale: Ang לְ dito ay nagpapahayag ng pagkakaugnay sa lipi. Ang “mula sa lipi ni Dan” ay natural at malinaw sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “kakayahang magturo” upang malinaw na maipahayag ang Hebreong idyoma nang hindi nililimitahan ang pagtuturo sa pormal na pagtuturo lamang. Pinanatili ang marker na [a] sa pangunahing teksto.
