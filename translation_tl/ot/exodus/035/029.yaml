  source_fidelity: 'Tumpak ang pangunahing kahulugan: kapwa lalaki at babae, ang panloob at kusang pag-uudyok, ang gawaing iniutos ni Yahweh sa pamamagitan ni Moises, at ang kusang-loob na handog. Gayunman, ang “magdala para sa lahat ng gawain” ay kulang at hindi likas sa Filipino dahil walang tahasang layon ang “magdala”; ang “ng ambag” ay isang ligtas na kontekstuwal na paglilinaw ng ipinahiwatig na layon.'
  naturalness: May kabigatan at pag-uulit sa “kusang-loob na naudyukan ng kanilang puso.” Mas natural ang “na inudyukan ng kanilang puso na kusang-loob na magdala.” Hindi rin kailangan ang resumptive na “sila” upang maging malinaw ang pangungusap.
  terminology: 'Ang “Yahweh,” “mga Israelita,” at “kusang-loob na handog” ay angkop at pare-pareho. Kailangang itama ang paliwanag sa talababa b: ang “sa pagkakaatas kay Moises” ay hindi katumbas ng idyomang “sa pamamagitan ng kamay ni Moises,” na tumutukoy sa pamamagitan o ahensiya ni Moises.'
