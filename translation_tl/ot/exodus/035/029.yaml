base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: tl
  text: Bawat lalaki at babae na inudyukan ng kanilang puso na kusang-loob na magdala ng ambag para sa lahat ng gawaing iniutos ni Yahweh na gawin sa pamamagitan ni Moises—ang mga Israelita ay nagdala ng kusang-loob na handog kay Yahweh.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na hinimok ng kanilang puso” o “na ginawang handa ng kanilang puso.” Ipinahahayag ng idyomang Hebreo ang panloob na pagkukusa o paghimok.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pamamagitan ng kamay ni Moises,” isang idyoma na nangangahulugang “sa pamamagitan ni Moises” o “sa pamamagitan ng kanyang ahensiya.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang mga anak ni Israel.” Karaniwang katawagan ito sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Bawat lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa kapwa lalaki at babae at ang distributibong diwa ng כָּל.
- source_word: נָדַב לִבָּם אֹתָם
  choice: na kusang-loob na naudyukan ng kanilang puso
  rationale: Ipinahahayag ng idyoma ang panloob na pagkukusa o paghimok. Ang 'naudyukan ng kanilang puso' ay natural sa Filipino, at pinananatili ng 'kusang-loob' ang boluntaryong diwa ng נָדַב.
- source_word: לְהָבִיא
  choice: na magdala
  rationale: Tuwirang katumbas ng infinitibong 'dalhin'; nauunawaan mula sa konteksto na mga ambag ang dinadala, kaya hindi kailangang magdagdag ng tahasang layon.
- source_word: לְכָל הַמְּלָאכָה
  choice: para sa lahat ng gawain
  rationale: Ang מְלָאכָה ay tumutukoy sa kabuuang gawaing kaugnay ng tabernakulo at mga kagamitan nito; malawak at natural ang 'gawain.'
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: iniutos ni Yahweh na gawin sa pamamagitan ni Moises
  rationale: Isinasalin ang בְּיַד מֹשֶׁה ayon sa idyomatikong diwa ng ahensiya o pamamagitan, habang pinananatili ang anyong 'na gawin.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: sila, ang mga Israelita, ay nagdala
  rationale: Ang בְנֵי יִשְׂרָאֵל ay karaniwang etnonimo. Nililinaw ng resumptive na 'sila' ang mahabang pangungusap at ipinakikitang ang naunang mga lalaki at babae ang tinutukoy na mga Israelita.
- source_word: נְדָבָה
  choice: kusang-loob na handog
  rationale: Tumpak na ipinahahayag ang handog na ibinigay nang bukal sa loob at hindi dahil sa pamimilit.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong pangalan sa pamamagitan ng karaniwang akademikong transliterasyong 'Yahweh' sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang mahaba ngunit malinaw na estruktura ng Hebreo, gamit ang gitling at resumptive na 'sila' upang maiwasan ang kalituhan. Ang 'kusang-loob na naudyukan' ay sadyang nagpapanatili sa parehong boluntaryong pagkilos at panloob na paghimok ng orihinal.
