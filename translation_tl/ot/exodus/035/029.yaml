    rationale: Ang לְהָבִיא ay walang hayag na layon sa Hebreo, ngunit ang konteksto ay mga ambag. Sa Filipino, kailangan ang layong gaya ng “ng ambag” upang maging malinaw at idiomatiko ang pangungusap.
  - severity: low
