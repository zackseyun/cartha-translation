revisions:
- from: Bawat lalaki at babae na kusang-loob na naudyukan ng kanilang puso na magdala para sa lahat ng gawaing iniutos ni Yahweh na gawin sa pamamagitan ni Moises—sila, ang mga Israelita, ay nagdala ng kusang-loob na handog kay Yahweh.[a][b][c]
  to: Bawat lalaki at babae na inudyukan ng kanilang puso na kusang-loob na magdala ng ambag para sa lahat ng gawaing iniutos ni Yahweh na gawin sa pamamagitan ni Moises—ang mga Israelita ay nagdala ng kusang-loob na handog kay Yahweh.[a][b][c]
  rationale: Inayos ang idiomatikong Filipino sa pamamagitan ng pagdaragdag ng kontekstuwal na “ng ambag,” gaya ng pinahihintulutan ng ipinahiwatig na layon sa Hebreo at ng audit trail. Inilipat ang “kusang-loob” upang malinaw na mailarawan ang boluntaryong pagkilos nang hindi inuulit nang mabigat ang diwa ng pag-uudyok ng puso. Itinama rin ang talababa tungkol sa “sa pamamagitan ng kamay ni Moises.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:14:53Z'
