translation:
  language: tl
  text: langis para sa ilaw, mga sangkap na mabango para sa langis na pampahid, at para sa mabangong insenso[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “insenso na gawa sa mga sangkap na mabango.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן
  choice: langis
  rationale: Pangkalahatang tumutukoy ang salita sa langis, na malamang ay langis ng olibo sa kontekstong ito; hindi idinagdag sa pangunahing teksto ang espesipikong uri na hindi tahasang binanggit.
- source_word: לַמָּאוֹר
  choice: para sa ilaw
  rationale: Pinananatili nito ang anyong pangngalan ng Hebreo at malinaw na tumutukoy sa langis na gagamitin upang magbigay-liwanag sa tabernakulo.
- source_word: בְשָׂמִים
  choice: mga sangkap na mabango
  rationale: Tumutukoy ito sa sari-saring aromatikong sangkap na ginagamit sa banal na paghahanda. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na “mga aromatiko,” at mas angkop kaysa sa “mga pampalasa” sa kontekstong ito.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Ito ang natural at malapit na katumbas ng kinikilalang langis na ginagamit sa ritwal ng pagpapahid, nang hindi ginagawang tahasang “pantatalaga” ang layuning ipinahihiwatig lamang ng konteksto.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa insensong sinusunog, hindi sa anumang pangkalahatang handog na sinusunog.
- source_word: הַסַּמִּים
  choice: mabango
  rationale: Natural na inilalarawan ng “mabango” sa Filipino ang aromatikong katangian ng insenso, samantalang inilalahad sa talababa ang mas literal na kayarian.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan at ang kultikong katawagang “langis na pamahid,” habang iniwasan ang labis na teknikal o denominasyonal na pananalita. Inilagay ang talababa sa “mabangong insenso,” ang pariralang talagang tinutukoy nito.
