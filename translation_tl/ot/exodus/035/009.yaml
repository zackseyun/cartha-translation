  text: mga batong oniks[a], at mga batong ikakabit sa epod at sa pektoral.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שֹׁהַם (shoham) ay tradisyonal na isinasaling “oniks,” ngunit hindi tiyak ang eksaktong pagkakakilanlan ng batong ito; maaaring berilo ito o batong shoham.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: mga batong onise
  rationale: Ang שֹׁהַם ay isang mahalagang bato na tradisyonal na tinutumbasan ng onyx; ginamit ang kinikilalang katawagang Filipino na “onise,” habang inilalahad sa talababa ang kawalan ng katiyakan sa eksaktong uri ng bato.
- source_word: אַבְנֵי מִלֻּאִים
  choice: mga batong ilalagay
  rationale: Ang מִלֻּאִים ay tumutukoy sa mga batong ikakabit o ilalagay sa nakahandang lalagyan ng kasuotang pangpari. Ang “ilalagay” ay natural at malinaw sa modernong Filipino nang hindi dinaragdagan ang teksto.
- source_word: לָאֵפֹד
  choice: sa epod
  rationale: Pinanatili ang teknikal na katawagang Hebreo para sa natatanging kasuotang pangpari; “epod” ang natural na baybay sa Filipino.
- source_word: וְלַחֹשֶׁן
  choice: at sa pektoral
  rationale: Ang חֹשֶׁן ay kasuotang nakalagay sa dibdib ng punong pari, hindi baluting pandigma. Ang “pektoral” ay isang kinikilalang katawagang Filipino para sa sagradong pirasong ito at mas maikli kaysa isang mapagpaliwanag na paraprasis.
