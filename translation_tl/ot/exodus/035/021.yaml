  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: tl
  text: Dumating ang bawat isa na pinakilos ng kanyang puso[a], at ang bawat isa na kusang-loob na hinimok ng kanyang espiritu; dinala nila ang handog para kay Yahweh[b] para sa paggawa ng Toldang Tipanan, para sa lahat ng paglilingkod nito, at para sa mga banal na kasuotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “iniangat siya ng kanyang puso.” Idyoma ito para sa panloob na pag-uudyok o pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “ang handog ni Yahweh,” ibig sabihin, ang handog na nakatalaga sa kanya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Dumating
  rationale: Tuwirang katumbas ng pandiwang בוא; hindi idinagdag ang mas interpretatibong diwang 'lumapit.'
- source_word: כָּל אִישׁ
  choice: ang bawat isa
  rationale: Pinananatili ang distributibong diwa nang hindi nililimitahan sa mga lalaki lamang.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: na pinakilos ng kanyang puso
  rationale: Likas sa modernong Tagalog at ipinahahayag ang Hebreong idyoma ng panloob na pag-uudyok; ang mas literal na larawan na 'iniangat siya ng kanyang puso' ay maaaring makalito.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: at ... ang bawat kusang-loob na hinimok ng kanyang espiritu
  rationale: Kapwa pinananatili ang boluntaryong pagkukusa ng נדב at ang panloob na pagkilos ng רוּחַ.
- source_word: הֵבִיאוּ
  choice: dinala
  rationale: Payak at kongkretong paglalarawan sa pagdadala ng mga ambag.
- source_word: תְּרוּמַת יְהוָה
  choice: ang handog para kay Yahweh
  rationale: Sa konteksto, ang תְּרוּמָה ay materyal na ambag o handog na inilalaan kay Yahweh. Nililinaw ng 'para kay' ang maaaring layuning ugnayan ng genitibo nang hindi ipinapalagay na si Yahweh ang nagbigay nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan sa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: para sa paggawa ng Toldang Tipanan
  rationale: Ang מְלָאכָה ay tumutukoy sa gawaing kinakailangan, lalo na sa paggawa nito; ang 'Toldang Tipanan' ay likas na katawagan para sa אֹהֶל מוֹעֵד bilang tolda kung saan nakikipagtagpo ang Diyos sa Israel.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: sa lahat ng paglilingkod dito
  rationale: Ipinapakita ng עֲבֹדָה ang mga gawain o paglilingkod na kaugnay ng tolda; ang 'dito' ay malinaw na tumutukoy sa Toldang Tipanan.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: at sa mga banal na kasuotan
  rationale: Malinaw at marangal na salin para sa mga kasuotang itinalaga sa banal na paglilingkod.
theological_decisions:
- issue: Paglalapat ng panloob na pagkilos at kusang-loob na pagbibigay
  choice: Pinanatiling magkaugnay ngunit magkahiwalay ang 'pinakilos ng kanyang puso' at 'kusang-loob na hinimok ng kanyang espiritu.'
  alternative: Pagsamahin bilang isang pangkalahatang pahayag na 'lahat ng kusang nagnais.'
  rationale: Dalawang magkakatabing Hebreong paglalarawan ang nasa teksto. Hindi dapat alisin ang bahagyang pag-uulit o ipasya kung ang puso at espiritu ay teknikal na magkaiba.
- issue: Ugnayan ng תְּרוּמָה kay Yahweh
  choice: handog para kay Yahweh
  alternative: handog ni Yahweh
  rationale: Maaaring ipahayag ng konstruksyon ang pag-aari o pagtatalaga. Sa konteksto ng kusang ambag ng bayan, mas malinaw sa Tagalog ang handog na inilaan para kay Yahweh, ngunit itinatala sa talababa ang alternatibong mas pormal na anyo.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang pinagmulang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng transliterasyon ang personal na pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'kusang-loob' upang idiin ang boluntaryong pagbibigay, at iniwasan ang sobrang literal na idyomang magiging malabo. Ang mga marker na [a] at [b] ay kapwa nasa pangunahing teksto.
