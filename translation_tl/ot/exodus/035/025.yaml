  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: tl
  text: 'At ang bawat babaeng may karunungan sa puso[a] ay nagsulid gamit ang kaniyang mga kamay. Dinala nila ang kanilang inikid: ang asul, ang purpura, ang iskarlatang sinulid[b], at ang pinong lino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “may karunungan sa puso,” isang idyoma para sa praktikal na kasanayang nakaugat sa panloob na karunungan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ang asul, ang purpura, ang iskarlata, at ang pinong lino.” Inililista ng Hebreo ang mga materyales pagkatapos ng “ang kanilang inikid.”'
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: may karunungan sa puso
  rationale: Pinananatili nito ang idyomang Hebreo na nag-uugnay sa panloob na karunungan at praktikal na kasanayan, sa halip na paikliin lamang bilang “mahusay.”
- source_word: בְּיָדֶיהָ
  choice: gamit ang sarili niyang mga kamay
  rationale: Likas na Filipino para sa gamit o instrumentong ipinahihiwatig ng Hebreo, at binibigyang-diin ang manu-manong paggawa ng bawat babae.
- source_word: טָוּוּ
  choice: nagsulid
  rationale: Tumutukoy ang pandiwa sa pag-ikot ng hibla upang maging sinulid; maikli at angkop sa konteksto ng paghahabi.
- source_word: וַיָּבִיאוּ
  choice: Dinala nila
  rationale: Pinananatili ang paglipat ng Hebreo mula sa pamudmod na isahan na “bawat babae” tungo sa pangmaramihang pagtukoy sa mga babae bilang isang pangkat.
- source_word: מַטְוֶה
  choice: ang mga nasulid nila
  rationale: Ipinahahayag ang produktong nalikha sa pagsulid at malinaw na iniuugnay iyon sa kasunod na talaan ng mga materyales.
- source_word: תְּכֵלֶת
  choice: ang asul
  rationale: Tumutukoy sa mahalagang materyal na tinina ng asul sa konteksto ng tabernakulo; sapat nang ipinahihiwatig ng “mga nasulid” na materyal na pansinulid ito.
- source_word: אַרְגָּמָן
  choice: ang purpura
  rationale: Ang “purpura” ay isang tiyak at dignified na katawagan sa kulay o tinang materyal, at iniiwasan ang mas malabong “lila” na maaaring mas malawak ang saklaw.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: ang matingkad na pula
  rationale: Inilalarawan nito ang iskarlatang tinang materyal nang natural sa modernong Filipino, nang hindi ipinapasok sa pangunahing teksto ang literal ngunit malabong pagtukoy sa pinagmulan ng tina.
- source_word: שֵׁשׁ
  choice: ang pinong lino
  rationale: Sa mga tekstong tungkol sa tabernakulo, karaniwang tumutukoy ito sa mataas na uring lino; pinananatili ng “pinong lino” ang pagkakaibang iyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawan ng karunungan sa puso at ang paglipat mula sa isahang “bawat babae” tungo sa pangmaramihang “nila.” Ginamit ang “nagsulid” bilang tiyak na katawagan sa gawaing panghinla, habang ipinaliliwanag ng talababa ang idyoma at ang maaaring ibang paraan ng pagbasa sa talaan ng mga materyales.
