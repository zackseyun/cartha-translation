  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: tl
  text: Pinuspos niya sila ng karunungan ng puso[a] upang gawin ang bawat uri ng gawain ng isang bihasang manggagawa[b], ng isang tagapagdisenyo, ng isang tagapagburda na gumagamit ng asul, purpura, at matingkad na pulang sinulid, at pinong lino, at ng isang manghahabi—mga gumagawa ng bawat uri ng gawain at mga nagdidisenyo ng mga disenyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “karunungan ng puso”—isang ekspresyong Hebreo para sa panloob na karunungan, pagkaunawa, at kasanayan sa paggawa.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mang-uukit.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa isang bihasang artisan sa pangkalahatan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga bumabalangkas ng masining na mga disenyo.” Inuulit sa Hebreo ang magkaugnay na mga salita upang bigyang-diin ang malikhaing pagdidisenyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא
  choice: Pinuspos
  rationale: Ang Piel ng מלא ay nangangahulugang ‘punuin.’ Ang ‘pinuspos’ ay likas at marangal sa Filipino at nagpapahayag ng saganang pagkakaloob ng kakayahan.
- source_word: חָכְמַת לֵב
  choice: karunungan ng puso
  rationale: Pinananatili ang konkretong idyomang Hebreo, na tumutukoy sa panloob na karunungan, pagkaunawa, at kasanayang praktikal; nililinaw ito sa talababa.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: upang gawin ang bawat uri ng gawain
  rationale: Sinasalamin ang malawak na saklaw ng עשה at ang pangkalahatang puwersa ng כל מלאכת bago isa-isahin ang mga sining.
- source_word: חָרָשׁ
  choice: bihasang manggagawa
  rationale: Maaaring tumukoy ang salita sa isang artisan sa pangkalahatan at hindi lamang sa mang-uukit; pinananatili ng salin ang lawak nito sa konteksto ng paggawa ng tabernakulo.
- source_word: חֹשֵׁב
  choice: tagapagdisenyo
  rationale: Sa konteksto ng sining, tumutukoy ang participle sa taong bumabalangkas ng masalimuot na disenyo o padron.
- source_word: רֹקֵם
  choice: tagapagburda
  rationale: Tuwirang katawagan sa manggagawang gumagawa ng pandekorasyong burda.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: sinulid na asul, purpura, at matingkad na pula
  rationale: Ginagawang hayag ang tekstil na diwa ng mga terminong pangkulay; ang ‘purpura’ ay angkop sa mamahaling kulay na tinutukoy ng אַרְגָּמָן.
- source_word: שֵׁשׁ
  choice: pinong lino
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa de-kalidad o pinong lino.
- source_word: אֹרֵג
  choice: manghahabi
  rationale: Likas at tiyak na katawagang Filipino para sa taong naghahabi.
- source_word: עֹשֵׂי כָּל מְלָאכָה וְחֹשְׁבֵי מַחֲשָׁבֹת
  choice: mga gumagawa ng bawat uri ng gawain at mga nagdidisenyo ng mga disenyo
  rationale: Pinananatili kapwa ang pangkalahatang ‘gumagawa’ at ang sadyang pag-uulit ng magkaugnay na salita sa pariralang Hebreo חֹשְׁבֵי מַחֲשָׁבֹת.
