  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang idyomang ‘karunungan ng puso’ at ang retorikal na pag-uulit sa hulihan, habang gumamit ng karaniwang mga katawagan sa mga artisan at tekstil.
