  yaml_path: translation/ot/exodus/035/020.yaml
  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: tl
  text: Pagkatapos, umalis ang buong kapulungan ng mga anak ni Israel mula sa harapan ni Moises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa kinaroroonan ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Pagkatapos, umalis
  rationale: Ang wayyiqtol ng יצא ay nagsusulong ng salaysay. Likas sa modernong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod at ang “umalis” para sa payak na diwa ng paglabas mula sa kinaroroonan ni Moises.
- source_word: כָּל
  choice: buong
  rationale: Binibigyang-diin nito ang kabuuan ng kapulungang tinutukoy; mas natural sa Tagalog ang “ang buong kapulungan” kaysa “ang lahat ng kapulungan.”
- source_word: עֲדַת
  choice: kapulungan
  rationale: Tumutukoy ang עֵדָה sa sama-samang pamayanan o pagtitipon ng Israel. Pinananatili ng “kapulungan” ang kolektibo at Pentateukal na diwa nang hindi labis na teknikal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal na anyong “mga anak ni Israel,” ngunit sa Tagalog ay maaari itong sumaklaw sa mga inapo bilang isang bayan. Iniiwasan nitong gawing payak na “mga Israelita” ang larawang pangangkanan ng Hebreo.
- source_word: מִלִּפְנֵי
  choice: mula sa harapan ni
  rationale: Pinananatili nito ang spatial na idyomang Hebreo, na sa konteksto ay nangangahulugang umalis sila sa kinaroroonan o presensiya ni Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang pamantayang anyo ng pangalan sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kapulungan” bilang likas na katawagan sa nagkakatipong pamayanan, at pinanatili ang “mga anak ni Israel” upang maipakita ang pangangkanang anyo ng Hebreo. Nilagyan ng talababa ang literal na spatial na idyoma upang malinaw ang natural na kahulugan nito.
