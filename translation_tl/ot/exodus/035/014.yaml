lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: ang patungan ng ilawan para sa pagbibigay-liwanag
  rationale: Ang מְנוֹרָה ay ang patungan ng mga ilawan sa tabernakulo, hindi lamang isang lampara. Ipinahihiwatig ng pariralang “para sa pagbibigay-liwanag” ang gamit ng הַמָּאוֹר habang pinananatiling malinaw at natural sa modernong Tagalog.
- source_word: כֵּלֶיהָ
  choice: ang mga kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga kasangkapan, sisidlan, o kagamitang kaugnay ng patungan ng ilawan. Ang “mga kagamitan” ay natural at hindi labis na espesipiko.
- source_word: נֵרֹתֶיהָ
  choice: ang mga lampara nito
  rationale: Ang נֵר ay tumutukoy sa isang lampara o apoy ng lampara. Sa kontekstong ito, ito ang mga indibiduwal na lamparang nakaugnay sa patungan.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: ang langis para sa pagbibigay-liwanag
  rationale: Pinananatili nito ang pag-uulit ng מָאוֹר at ipinapahayag ang layunin ng langis nang hindi nililimitahan ang kahulugan sa mas interpretatibong “langis ng lampara.”
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: at ... at ... at ... at
  rationale: Ang paulit-ulit na “at” ay nagpapanatili sa anyo at ritmo ng talaan sa Hebreo.
