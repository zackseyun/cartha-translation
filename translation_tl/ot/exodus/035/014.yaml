  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinili ang “patungan ng ilawan” upang maiba ang mismong lampstand sa “mga lampara nito,” at pinanatili ang estilong talaan sa pamamagitan ng pag-uulit ng “at.”
