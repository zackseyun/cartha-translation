id: EXO.35.1
reference: Exodus 35:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: tl
  text: Pagkatapos, tinipon ni Moises ang buong kapulungan ng mga anak ni Israel at sinabi sa kanila, “Ito ang mga bagay[a] na iniutos ni Yahweh na gawin:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga salita” o “mga usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: tinipon
  rationale: Ang Hifil ng קהל ay nagsasaad na pinulong o pinagsama ni Moises ang bayan bilang isang kapulungan. Likas at malinaw sa modernong Filipino ang “tinipon.”
- source_word: כָּל עֲדַת
  choice: ang buong kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa organisadong sambayanan o kapulungan ng Israel; pinananatili ng “buong kapulungan” ang kolektibo at pormal na diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang isinasalin ang covenantal at lahing katawagang Hebreo. Sa konteksto, saklaw nito ang buong sambayanan, hindi lamang ang mga lalaki.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Ito ang mga bagay
  rationale: Maaaring mangahulugan ang דְּבָרִים ng mga salita, bagay, o usapin. Ang “mga bagay” ay angkop dito dahil ang kasunod ay mga utos na isasagawa, habang inilalahad sa talababa ang tunay na leksikal na kalabuan.
- source_word: צִוָּה יְהוָה
  choice: iniutos ni Yahweh
  rationale: Ang “iniutos” ay likas na anyong Filipino para sa naganap nang utos na nananatiling may bisa; pinananatili ang personal na pangalang יהוה bilang Yahweh.
- source_word: לַעֲשֹׂת אֹתָם
  choice: na gawin
  rationale: Ipinahahayag ng infinitive construct at panghalip na layon ang mga bagay na iniutos na isagawa. Naiiwasan ng “na gawin” ang mabigat at di-likas na pasibong pagkakabuo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang Tetragrammaton sa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ng salin ang pormang angkan at tipan ng Hebreo, ngunit hindi ito inuunawang para lamang sa mga lalaking Israelita sapagkat ang parirala ay tumutukoy dito sa buong kapulungan.
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “kapulungan” upang mapanatili ang kolektibo at covenantal na diwa ng עֵדָה. Ang tutuldok sa hulihan ay nagpapahiwatig na ang pahayag ay ipinagpapatuloy ng mga kasunod na talata.
