lexical_decisions:
- source_word: קַלְעֵי
  choice: mga telang-tabing
  rationale: Tumutukoy sa mga panel na tela na bumubuo sa bakod ng patyo. Nililinaw ng tambalang “telang-tabing” na tela ang mga ito at na naiiba sila sa natatanging tabing sa pasukan.
- source_word: הֶחָצֵר / חָצֵר
  choice: patyo
  rationale: Natural at malinaw na tawag sa nakabakod na panlabas na bahagi ng tabernakulo.
- source_word: עַמֻּדָיו
  choice: mga haligi nito
  rationale: Ang mga ito ang patayong suportang pang-istruktura ng nakapalibot na tabing; ang “haligi” ay angkop sa marangal na wikang pangsantuwaryo.
- source_word: אֲדָנֶיהָ
  choice: mga tuntungan ng mga iyon
  rationale: Tumutukoy sa mga suportang nasa ibaba ng mga haligi. Ginawang malinaw sa Filipino na ang mga tuntungan ay para sa mga haliging kababanggit lamang, habang hindi isinasara ang posibilidad na teknikal na mga socket ang tinutukoy.
- source_word: מָסַךְ
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, ito ay telang tumatakip o humaharang sa pasukan. Natural sa Filipino ang “tabing” at hindi nito ipinapalagay na matigas ang materyal.
- source_word: שַׁעַר
  choice: pasukan
  rationale: Bagaman maaari itong tumukoy sa pintuang-daan, sa kontekstong ito ay mas natural ang “pasukan” sapagkat isang telang-tabing, hindi isang matigas na pinto, ang nakalagay rito.
