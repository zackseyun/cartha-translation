translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong pira-piraso ng talata at ang pangwakas na gitling dahil bahagi ito ng nagpapatuloy na talaan. Ginamit ang “patyo” kaysa mas teknikal o makalumang katawagan, at iniwasang pag-isahin ang dalawang magkaibang terminong Hebreo para sa mga telang nakapalibot at sa tabing ng pasukan.
