base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: tl
  text: ang mga kasuotang pinong hinabi[a] para sa paglilingkod sa santuwaryo[b], ang mga banal na kasuotan para kay Aaron na pari, at ang mga kasuotan ng kanyang mga anak para sa paglilingkod bilang mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga kasuotang panserbisyo”; hindi tiyak kung binibigyang-diin ng salitang Hebreo ang natatanging pagkakahabi ng mga kasuotan o ang gamit ng mga ito sa paglilingkod.
    reason: lexical_alternative
  - marker: b
    text: O, “sa banal na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: mga kasuotang pinong hinabi
  rationale: Ipinahahayag nito ang malamang na diwa ng mga kasuotang yari sa natatanging mahusay na paghabi, habang inilalagay sa talababa ang posibleng kahulugang nakatuon sa gamit o paglilingkod.
- source_word: לְשָׁרֵת
  choice: para sa paglilingkod
  rationale: Pinananatili ang layunin ng mga kasuotan at ang sagradong konteksto ng pandiwang tumutukoy sa paglilingkod.
- source_word: בַּקֹּדֶשׁ
  choice: sa santuwaryo
  rationale: Sa konteksto ng tabernakulo, natural itong tumutukoy sa sagradong lugar; pinananatili sa talababa ang mas literal na alternatibong “sa banal na lugar.”
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mga banal na kasuotan
  rationale: Direkta at likas na salin ng pariralang tumutukoy sa sagradong kasuotan ng mga pari.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: para kay Aaron na pari
  rationale: Malinaw na kinikilala si Aaron ayon sa kanyang tungkulin nang hindi nagdaragdag ng katawagang pansekta.
- source_word: בִּגְדֵי בָנָיו
  choice: mga kasuotan ng kanyang mga anak
  rationale: Pinananatili ang malinaw na ugnayang pag-aari sa Hebreo at natural itong basahin sa Filipino.
- source_word: לְכַהֵן
  choice: para sa paglilingkod bilang mga pari
  rationale: Ipinakikita ang pandiwang diwa ng pagganap sa tungkulin bilang pari, hindi lamang ang pagkakaroon ng titulong pari.
theological_decisions:
- issue: Ugnayan ng בִּגְדֵי הַשְּׂרָד at בִּגְדֵי הַקֹּדֶשׁ
  choice: Inilalahad ang una bilang isang hiwalay na pangkat ng mga kasuotang ginagamit sa paglilingkod sa santuwaryo, kasunod ng mga banal na kasuotan para kay Aaron at sa kanyang mga anak.
  alternative: Maaaring unawain ang unang parirala bilang isa pang paglalarawan sa parehong mga kasuotang pampari.
  rationale: Ang pag-uulit ng pantukoy sa tuwirang layon na אֶת ay sumusuporta sa pagkakatalogo ng magkakahiwalay na bagay, bagaman hindi nito ganap na inaalis ang posibilidad na magkaugnay o appositional ang mga parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kasuotan” sa halip na mas teknikal o eklesiyastikong katawagan, at ang “santuwaryo” bilang natural na tawag sa sagradong lugar sa konteksto ng tabernakulo.
