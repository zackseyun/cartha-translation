base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: tl
  text: Ang bawat lalaking may taglay na sinulid na asul, sinulid na purpura, sinulid na matingkad na pula, pinong lino, balahibo ng kambing, mga balat ng lalaking tupa na tinina sa pula, at mga balat ng tahash[a] ay nagdala ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak kung anong hayop o materyales ang tinutukoy ng salitang Hebreo na tahash. Kabilang sa mga mungkahing salin ang “pinong katad,” “balat ng porpoise,” at “balat ng dugong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Ang bawat lalaking
  rationale: Pinananatili ng “bawat lalaking” ang panlalaking anyo at distributibong diwa ng Hebreong אִישׁ na may כָל, habang natural sa konteksto ng bawat nagkaloob.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: may taglay na
  rationale: Ang literal na diwang “natagpuang kasama niya” ay ipinahayag sa natural na Tagalog bilang “may taglay na,” na malinaw na tumutukoy sa mga materyales na nasa kani-kanilang pag-aari.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa asul na materyales na panghabi; nililinaw ng “sinulid” ang gamit nito nang hindi ito ginagawang yari nang tela.
- source_word: אַרְגָּמָן
  choice: sinulid na purpura
  rationale: Ipinapakita nito ang purpurang materyales na panghabi at pinananatiling kaayon ng iba pang sinulid sa talaan.
- source_word: תוֹלַעַת שָׁנִי
  choice: sinulid na matingkad na pula
  rationale: Inihahatid nito sa karaniwang makabagong Tagalog ang iskarlata o matingkad na pulang materyales na panghabi, nang hindi umaasa sa di-gaanong pamilyar na salitang hiram.
- source_word: שֵׁשׁ
  choice: pinong lino
  rationale: Ang “pinong lino” ay nagpapahayag ng mataas na uri ng linen na karaniwang tinutukoy ng salita sa mga tekstong tungkol sa tabernakulo.
- source_word: עִזִּים
  choice: balahibo ng kambing
  rationale: Bagaman literal na “mga kambing,” ang tinutukoy sa talaan ng mga materyales ay ang balahibo ng kambing na ginagamit sa paghahabi, hindi mga buhay na hayop.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: mga balat ng lalaking tupa na tinina sa pula
  rationale: Malinaw nitong pinananatili kapwa ang uri ng balat at ang participial na diwang ang mga ito ay kinulayan o tinina sa pula.
- source_word: עֹרֹת תְּחָשִׁים
  choice: mga balat ng tahash
  rationale: Hindi tiyak ang hayop o materyales na tinutukoy ng תְּחָשׁ. Ang transliterasyong “tahash” ay umiiwas sa isang haka-hakang pagkakakilanlan, at ipinapaliwanag ang suliranin sa talababa.
- source_word: הֵבִיאוּ
  choice: ay nagdala ng mga iyon
  rationale: Ginagawang hayag ng “mga iyon” ang ipinahiwatig na layon ng pandiwa at natural na ibinabalik ito sa buong talaan ng mga materyales.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “may taglay na” bilang natural na katumbas ng Hebreong pasibong parirala, at inulit ang “sinulid” upang madaling maunawaan ang tatlong materyales na may kulay. Inilagay ang talababa sa “tahash,” ang tunay na salitang may leksikal na katiyakan.
