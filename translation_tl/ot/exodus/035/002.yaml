base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: tl
  text: Sa loob ng anim na araw ay maaaring gawin ang gawain, ngunit sa ikapitong araw ay magiging banal para sa inyo ang ikapitong araw—isang Sabat, isang ganap na pamamahinga[a] para kay Yahweh.[b] Ang sinumang gumawa ng gawain sa araw na iyon ay papatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang Sabat ng lubos na pamamahinga.” Ang Hebreong pananalitang “Sabat, sabat-pamamahinga” ay nagpapatingkad sa ganap na paghinto sa gawain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kay Yahweh.” Maaari rin itong unawain na “ukol kay Yahweh” o “pag-aari ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה
  choice: maaaring gawin
  rationale: 'Pinananatili nito ang di-tiyak na legal na puwersa at ang balintiyak na anyo ng Nifal: ang gawain ang maaaring gawin, sa halip na direktang utusan ang isang tiyak na gumagawa.'
- source_word: מְלָאכָה
  choice: gawain
  rationale: Ang מְלָאכָה ay tumutukoy sa trabaho o gawaing karaniwang isinasagawa, lalo na sa mga batas tungkol sa Sabat. Likas at malawak ang “gawain” sa modernong Filipino.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Ipinahahayag nito ang pagiging inilaan ng ikapitong araw nang hindi nagdaragdag ng konseptong wala sa Hebreo.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: isang Sabat na ganap na pamamahinga
  rationale: Ang magkaugnay na mga salita ay nagpapatingkad sa lubos na paghinto sa gawain. Malinaw sa karaniwang mambabasa ang “ganap na pamamahinga,” samantalang pinananatili ng “Sabat” ang katawagang biblikal.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Maaaring magpahiwatig ang ל ng paglalaan, kaugnayan, o patutunguhan. Likas sa Filipino ang “para kay” at hindi nito nililimitahan ang diwa sa simpleng pag-aari.
- source_word: כָּל הָעֹשֶׂה
  choice: ang sinumang gumawa
  rationale: Pinananatili nito ang pangkalahatan at legal na saklaw ng parirala.
- source_word: בּוֹ
  choice: sa araw na iyon
  rationale: Ang panghalip ay tumutukoy sa ikapitong araw o Sabat. Nililinaw ito sa Filipino nang hindi binabago ang reperente.
- source_word: יוּמָת
  choice: ay papatayin
  rationale: 'Ang Hophal ng מות ay isang sanhiang balintiyak: “ipapatay/papatayin.” Hindi idinagdag ang “tiyak” sapagkat walang hiwalay na infinitive absolute sa talatang ito.'
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kaugnayan ng Sabat kay Yahweh sa לַיהוָה
  choice: para kay Yahweh
  alternative: ukol kay Yahweh; pag-aari ni Yahweh
  rationale: Pinananatili ng “para kay Yahweh” ang maaaring diwa ng paglalaan o pagkakaugnay nang hindi ipinipilit na pag-aari lamang ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabat” bilang nakikilalang katawagang biblikal, ngunit ipinaliwanag ang pinatinding Hebreong parirala sa payak na wikang “ganap na pamamahinga.” Inilagay ang mga talababa sa mismong mga pariralang tinatalakay ng mga ito.
