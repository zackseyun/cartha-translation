  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: tl
  text: ang mesa, ang mga pingga nito, ang lahat ng kagamitan nito, at ang tinapay ng Presensya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ayon sa tradisyon, “tinapay na pantanghal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Payak na tumutukoy ang pangngalan sa mesang ginagamit sa santuwaryo. Hindi idinagdag ang gamit nito dahil nililinaw iyon ng kasunod na pariralang “tinapay ng Presensya.”
- source_word: בַּדָּיו
  choice: ang mga pingga nito
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang בַּד sa mahahabang pinggang ginagamit sa pagbuhat ng banal na kasangkapan. Likas at malinaw sa modernong Filipino ang “mga pingga.”
- source_word: כָּל כֵּלָיו
  choice: ang lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga sisidlan o kasangkapang ginagamit sa mesa. Pinananatili ng “kagamitan” ang lawak ng kahulugan nang hindi ito di-kailangang nililimitahan.
- source_word: לֶחֶם הַפָּנִים
  choice: ang tinapay ng Presensya
  rationale: Literal na “tinapay ng mukha/presensya” ang parirala. Pinananatili ng “tinapay ng Presensya” ang natatanging katawagang panritwal at ang kaugnayan nito sa banal na presensya, nang hindi ipinapasok sa pangunahing teksto ang paliwanag na wala roon.
theological_decisions:
- issue: Kung tahasang kikilalanin bilang presensya ng PANGINOON ang הַפָּנִים
  choice: Presensya
  alternative: tinapay na inilalagay sa harap ng PANGINOON
  rationale: Hindi tahasang binabanggit sa parirala ang banal na pangalan. Ang mas literal na anyo ay nagpapanatili sa siksik at bahagyang di-tiyak na katawagang Hebreo, samantalang ang alternatibo ay nagpapaliwanag na agad sa ipinahihiwatig nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyong listahan at ang pangwakas na kuwit dahil bahagi ang talata ng nagpapatuloy na talaan. Inilagay ang talababa sa pariralang “tinapay ng Presensya,” na siyang may leksikal na alternatibo.
