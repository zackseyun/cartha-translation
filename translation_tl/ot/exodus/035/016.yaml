  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: tl
  text: ang altar ng handog na sinusunog nang buo, ang parilyang tanso[a] na para rito, ang mga pingga ng altar at lahat ng kagamitan nito, at ang palanggana at ang patungan nito[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “rehas na tanso” o “sala-salang tanso.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “base nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: altar ng handog na sinusunog nang buo
  rationale: Tinutukoy ng pariralang construct ang altar para sa עֹלָה, isang handog na lubusang sinusunog. Nililinaw ng “nang buo” ang katangian ng handog nang hindi nagdaragdag ng denominasyonal na paliwanag.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: parilyang tanso
  rationale: Ang מִכְבָּר ay isang sala-salang metal o rehas na kaugnay ng altar. Ang “parilya” ay natural at madaling maunawaan sa modernong Filipino.
- source_word: אֲשֶׁר לוֹ
  choice: na para rito
  rationale: Ipinapahayag nito ang pag-aari o pagkakaugnay sa altar nang hindi ipinapalagay ang eksaktong puwesto ng parilya.
- source_word: בַּדָּיו
  choice: mga pingga nito
  rationale: Ang בַּדִּים ay mahahabang pinggang ginagamit sa pagbuhat ng mga kagamitan sa tabernakulo. Maikli at pamilyar ang “mga pingga” sa Filipino.
- source_word: כָּל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כֵּלִים at maaaring tumukoy sa sari-saring kasangkapan o kagamitan ng altar. Pinananatili ng “kagamitan” ang lawak na iyon.
- source_word: הַכִּיֹּר
  choice: palanggana
  rationale: Tumutukoy ito sa malaking sisidlang hugasan sa bakuran ng tabernakulo. Karaniwan at kongkreto ang “palanggana” sa modernong Filipino.
- source_word: כַּנּוֹ
  choice: patungan nito
  rationale: Tumutukoy ang כֵּן sa suportang kinatatayuan o base ng palanggana. Natural sa Filipino ang “patungan” at hindi nito labis na tinutukoy ang anyo.
theological_decisions:
- issue: Saklaw ng kahulugang עֹלָה
  choice: handog na sinusunog nang buo
  alternative: handog na sinusunog
  rationale: Kasama sa kahulugan ng עֹלָה ang handog na lubusang sinusunog; ang tahasang “nang buo” ay tumpak sa rituwal na katawagan at nakatutulong sa karaniwang mambabasa.
translation_notes:
  register: Modernong Filipino na may dignidad at angkop sa talaan ng mga kagamitang panrituwal. Pinanatili ang anyong parirala at ang gitling sa hulihan dahil bahagi ang talata ng nagpapatuloy na listahan.
