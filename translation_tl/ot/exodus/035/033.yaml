  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: tl
  text: sa pagtatabas ng mga bato para sa pagkakabit, at sa pag-ukit ng kahoy, upang gawin ang bawat uri ng gawaing may mahusay na disenyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bawat uri ng masining na gawain” o “bawat uri ng gawaing nangangailangan ng kasanayan.” Ang salitang Hebreo ay tumutukoy sa gawaing pinag-isipan, idinisenyo, o isinagawa nang may kasanayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: sa pag-ukit ... at sa pag-ukit
  rationale: Tumutukoy ang חֲרֹשֶׁת sa bihasang paggawa sa isang materyal. Ang “pag-ukit” ay likas sa Filipino para sa paggawa kapwa sa bato at sa kahoy at pinananatili ang pag-uulit sa Hebreo.
- source_word: אֶבֶן
  choice: mga bato
  rationale: Bagaman isahan ang anyo sa Hebreo, materyal ang pangkalahatang tinutukoy; mas natural sa Filipino ang maramihang “mga bato” sa ganitong konteksto.
- source_word: לְמַלֹּאת
  choice: ilalagay sa hiyasang lalagyan
  rationale: Sa konteksto ng paggawa para sa tabernakulo, tumutukoy ito sa paglalagay o pagkakabit ng mga batong hiyas sa kanilang lalagyan, hindi lamang sa pangkalahatang diwang “punuin.”
- source_word: עֵץ
  choice: kahoy
  rationale: Materyal na kahoy ang tinutukoy, hindi isang buhay na puno.
- source_word: לַעֲשׂוֹת
  choice: upang gawin
  rationale: Pinananatili nito ang malawak na diwa ng עשה at natural na inuugnay ang layunin sa kasunod na parirala.
- source_word: בְּכָל מְלֶאכֶת
  choice: ang bawat uri ng ... gawain
  rationale: Ipinahihiwatig ng parirala ang buong saklaw ng mga gawaing pansining; malinaw at natural sa modernong Filipino ang “bawat uri ng gawain.”
- source_word: מַחֲשָׁבֶת
  choice: masining
  rationale: Sa kontekstong ito, ang salita ay tumutukoy sa gawaing pinag-isipan, idinisenyo, at isinagawa nang may kasanayan. Ang “masining” ay natural, ngunit inilalahad sa talababa ang saklaw ng kahulugan.
