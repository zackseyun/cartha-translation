  register: Modernong Filipino na malinaw at marangal. Ginamit ang “hiyasang lalagyan” upang maging malinaw na mga batong hiyas ang ikinakabit sa setting; ang talababa ay nagpapanatili sa lawak ng kahulugan ng מַחֲשָׁבֶת.
