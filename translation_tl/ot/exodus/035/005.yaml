base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: tl
  text: Mula sa inyong kalipunan ay kumuha kayo ng handog para kay Yahweh.[a] Ang bawat isa na bukal sa loob[b] ay magdala nito—ang handog para kay Yahweh:[c] ginto, pilak, at bronse.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang personal na pangalan ng Diyos na isinusulat na יהוה sa Hebreo.
    reason: divine_name
  - marker: b
    text: 'Sa literal: “bawat isa na kusang-loob ang kanyang puso”; tumutukoy ito sa boluntaryong panloob na kahandaan.'
    reason: lexical_alternative
  - marker: c
    text: 'Sa literal na anyong gramatikal: “ang handog ni Yahweh.” Sa konteksto, ito ang handog na inilalaan para kay Yahweh.'
    reason: alternative_reading
  - marker: d
    text: Ang salitang Hebreo ay maaari ring tumukoy sa tanso o sa haluang metal na tanso; karaniwang isinasaling “bronse” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Kumuha kayo
  rationale: Ang maramihang pautos ng לקח ay tuwirang nag-uutos sa kapulungan. Pinananatili ng “Kumuha kayo” ang payak na kilos ng tekstong Hebreo.
- source_word: מֵאִתְּכֶם
  choice: mula sa inyong kalipunan
  rationale: Ipinahihiwatig ng parirala ang pinagmumulan sa loob mismo ng sambayanan. Mas malinaw sa Tagalog ang “mula sa inyong kalipunan” kaysa sa alanganing “mula sa inyo.”
- source_word: תְּרוּמָה
  choice: handog
  rationale: Sa konteksto ng mga materyales para sa tabernakulo, tumutukoy ito sa ambag na ibinukod para sa banal na layunin. Likas at madaling maunawaan ang “handog,” samantalang magiging labis na teknikal ang katumbas na “handog na itinaas.”
- source_word: לַיהוָה / יְהוָה
  choice: para kay Yahweh / Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה bilang “Yahweh.” Sa unang parirala, malinaw na ang handog ay inilalaan para sa kanya.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: bawat may pusong kusang-loob
  rationale: Pinananatili nito ang larawan ng puso at ang diwa ng boluntaryong panloob na kahandaan, nang hindi nililimitahan ang tinutukoy sa kalalakihan lamang.
- source_word: יְבִיאֶהָ
  choice: ay magdala nito
  rationale: Ang hulaping pambabae ay tumutukoy pabalik sa תְּרוּמָה. Ipinahahayag ng “magdala nito” ang inaasahang kilos nang hindi ginagawang sapilitan ang kusang handog.
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: ang handog para kay Yahweh
  rationale: Ang parirala ay muling tumutukoy at nagbibigay-linaw sa handog. Ginamit ang “para kay Yahweh” upang maiwasan ang maling pahiwatig na si Yahweh ang nagbigay ng handog, habang itinatala sa talababa ang mas literal na anyong paari.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: ginto, pilak, at bronse
  rationale: Ang “bronse” ang karaniwan at makatuwirang tawag sa נְחֹשֶׁת sa mga talaan ng sinaunang materyales para sa tabernakulo, bagaman maaari rin itong tumukoy nang mas malawak sa tanso o haluang tanso.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Ugnayan sa pariralang תְּרוּמַת יְהוָה
  choice: handog para kay Yahweh
  alternative: handog ni Yahweh
  rationale: Gramatikal na anyong construct ang Hebreo at maaaring ilipat nang literal bilang “handog ni Yahweh.” Gayunman, sa konteksto, ang mga tao ang nagdadala ng handog na nakatalaga sa kanya; kaya mas malinaw ang “para kay Yahweh,” habang pinananatili sa talababa ang literal na alternatibo.
- issue: Kusang-loob na katangian ng pagbibigay
  choice: may pusong kusang-loob
  alternative: bukal sa loob ang pagbibigay
  rationale: Pinananatili ang tahasang banggit sa “puso” at ang boluntaryong disposisyon, nang hindi ginagawang sapilitan ang handog.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “kalipunan” upang likas na maipahayag ang pinagmumulang nasa loob ng sambayanan, at pinanatili ang idyoma ng “puso” upang hindi mawala ang diin sa kusang panloob na disposisyon.
