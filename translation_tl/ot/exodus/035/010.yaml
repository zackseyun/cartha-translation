translation:
  language: tl
  text: At ang bawat taong may kasanayan sa inyo ay dapat lumapit at gumawa ng lahat ng iniutos ni Yahweh:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “marunong sa puso,” isang idyoma para sa taong may kasanayan o kahusayan, lalo na sa mga gawaing-kamay.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “lahat ng may kasanayan sa inyo.” Panlalaking isahan ang anyong panggramatika sa Hebreo, ngunit ginagamit ito nang pamamahagi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: At bawat
  rationale: 'Ang וְ ay nag-uugnay sa naunang tagubilin, at ang כָל na sinusundan ng pangngalang isahan ay may pamamahaging diwa: bawat isa.'
- source_word: חֲכַם לֵב
  choice: taong mahusay
  rationale: Literal itong “marunong sa puso,” isang idyoma para sa taong may kasanayan o kahusayan, lalo na sa gawaing-kamay. Natural sa Filipino ang “taong mahusay” habang pinananatili sa talababa ang literal na larawan.
- source_word: בָּכֶם
  choice: sa inyo
  rationale: Ipinahihiwatig ng בְּ na may hulaping pangmaramihan ang mga taong kabilang sa pamayanan; ang “sa inyo” ang natural na katumbas sa Filipino.
- source_word: יָבֹאוּ
  choice: ay lumapit
  rationale: Ang imperfect na pangmaramihan ay may puwersang panawagan o tagubilin. Sa kontekstong ito, malinaw at natural ang “lumapit.”
- source_word: וְיַעֲשׂוּ
  choice: at gumawa
  rationale: Bagaman malawak ang saklaw ng עָשָׂה na “gawin/gumawa,” tumutukoy rito ang konteksto sa paglikha ng tabernakulo at mga kagamitan nito, kaya ang “gumawa” ang angkop.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ng lahat ng
  rationale: Ipinakikilala nito ang kabuuan ng mga bagay na iniutos; natural sa Filipino ang “lahat ng iniutos.”
- source_word: צִוָּה יְהוָה
  choice: iniutos ni Yahweh
  rationale: Ang perfect na צִוָּה ay tumutukoy sa utos na naibigay na bago ang gagawing pagkilos. Pinananatili ang personal na pangalang Yahweh para sa יהוה.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na palitan ito ng titulo.
- issue: Kasarian at pamamahaging diwa ng חֲכַם לֵב
  choice: bawat taong mahusay
  alternative: bawat lalaking mahusay / lahat ng mahusay sa inyo
  rationale: Masculine singular ang anyong Hebreo ngunit pamamahagi ang gamit nito at tumutukoy sa bawat kuwalipikadong manggagawa. Hindi tiyak na eksklusibong lalaki ang tinutukoy, kaya hindi dinaragdagan ng “lalaki” ang pangunahing teksto; ipinaliliwanag sa talababa ang gramatikal na anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “taong mahusay” bilang likas at inklusibong paglalahad sa idyomang Hebreo, habang pinanatili sa mga talababa ang literal na larawan at gramatikal na kalabuan.
