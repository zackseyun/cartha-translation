lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Itinatag na katawagan sa sagradong tahanang itinayo para sa presensiya ng Diyos sa gitna ng Israel; pinananatili rin nito ang kaibhan sa אָהֶל, ang toldang bahagi nito.
- source_word: אָהֳלוֹ
  choice: ang tolda nito
  rationale: Tuwirang ipinapahayag ang toldang kaugnay ng tabernakulo, habang ang “nito” ay natural na tumutukoy sa buong estruktura.
- source_word: מִכְסֵהוּ
  choice: ang pantakip nito
  rationale: Pinananatiling pangkalahatan ang uri at materyal ng pantakip, gaya ng tekstong Hebreo.
- source_word: קְרָסָיו
  choice: ang mga kawit nito
  rationale: Ang mga ito ang pandugtong sa mga kurtina o pantakip; ang “kawit” ay malinaw at karaniwang katawagan sa Filipino.
- source_word: קְרָשָׁיו
  choice: ang mga tabla nito
  rationale: Ang קֶרֶשׁ ay karaniwang tumutukoy sa mga tabla o plankang bumubuo sa estruktura, bagaman maaari rin itong unawain bilang mga balangkas.
- source_word: בְּרִיחָיו
  choice: ang mga pahalang na baras nito
  rationale: Ipinahihiwatig ng “pahalang” ang gamit ng mga baras sa pagdurugtong at pagpapatatag sa mga tabla nang hindi gumagamit ng di-pamilyar na teknikal na salita.
- source_word: עַמֻּדָיו
  choice: ang mga haligi nito
  rationale: Natural at marangal na katawagan para sa mga patayong suportang bahagi ng santuwaryo.
- source_word: אֲדָנָיו
  choice: ang mga patungan nito
  rationale: Malinaw sa modernong Filipino bilang mga bahaging sumusuporta sa mga elementong nakatayo, habang ang mas tiyak na anyong “saksakan” ay inilalahad sa talababa.
