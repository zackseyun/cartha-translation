  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: tl
  text: Lahat ng naglaan ng ambag na pilak o bronse ay nagdala ng handog para kay Yahweh[a]. At lahat ng may kahoy na akasya[b] para sa anumang gawain ng paglilingkod ay nagdala nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “handog na pilak at bronse.” Maaaring tumukoy ang Hebreong pangatnig sa pinagsamang talaan ng mga materyales, samantalang ang “o” ay nagpapakitang dinala ng bawat tao ang alinman sa mayroon siya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bawat isa na natagpuang may kahoy na akasya.” Isa itong Hebreong idyoma na nangangahulugang may kahoy na akasya siyang taglay o magagamit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Ang bawat naghandog
  rationale: Ang participle ng רוּם kasama ng תְּרוּמָה ay idyomatikong tumutukoy sa paghahandog o paglalaan ng ambag. Likas at malinaw sa makabagong Tagalog ang “naghandog.”
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: handog ng pilak o bronse
  rationale: Ang תְּרוּמָה ay handog o ambag na inilaan para sa banal na gamit. Sa konteksto ng mga materyales ng tabernakulo, “bronse” ang angkop na salin ng נְחֹשֶׁת; ang “o” ay nagpapahayag na maaaring isa sa dalawang metal ang dinala ng bawat tao.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: nagdala ng handog para kay Yahweh
  rationale: Ipinahahayag nito na ang handog ay nakatalaga kay Yahweh. Mas natural sa Tagalog ang “para kay Yahweh” kaysa sa literal ngunit maaaring malabong “handog ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tahasang pangalan ng Diyos bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: Ang bawat may
  rationale: Ang literal na “natagpuang kasama niya” ay isang Hebreong idyoma para sa bagay na taglay o makukuha ng isang tao. Ang “may” ang pinakanatural na katumbas sa Tagalog, habang inilalagay sa talababa ang literal na anyo.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Ito ang malinaw at karaniwang makabagong tawag sa materyal, sa halip na transliterasyong “shittim.”
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: para sa anumang gawain ng paglilingkod
  rationale: Pinananatili ng “gawain” at “paglilingkod” ang magkaugnay ngunit magkahiwalay na diwa ng מְלָאכָה at עֲבֹדָה, nang hindi idinaragdag ang “tabernakulo,” na ipinahihiwatig lamang ng konteksto.
- source_word: הֵבִיאוּ
  choice: nagdala nito
  rationale: Ang “nito” ay likas na tumutukoy pabalik sa kahoy na akasya bilang materyal at bumubuo ng malinaw na pangungusap sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng handog kay Yahweh
  choice: handog para kay Yahweh
  alternative: handog ni Yahweh
  rationale: Maaaring ipahiwatig ng construct phrase ang handog na nauukol o nakatalaga kay Yahweh. Iniiwasan ng “para kay Yahweh” ang maling pagkaunawang si Yahweh ang nagbigay ng handog, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “handog” at “paglilingkod” upang mapanatili ang sagradong konteksto nang hindi nagiging lipas o labis na teknikal. Hinati sa dalawang pangungusap para sa likas na daloy sa Tagalog.
