  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: tl
  text: At sa tuwing itinataas ni Moises ang kanyang kamay[a], nananaig ang Israel; at sa tuwing ibinababa niya ang kanyang kamay[b], nananaig ang Amalek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Kapag itinataas ni Moises ang kanyang kamay … kapag ibinababa niya ang kanyang kamay.” Maaaring isalin ang kayariang Hebreo bilang “kapag,” ngunit ipinahihiwatig ng konteksto ang paulit-ulit na pagkilos habang nagaganap ang labanan, kaya ginamit ang “sa tuwing.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “ibinababa” ay salin ng pandiwang maaari ring mangahulugang “pinagpapahinga” o “hinahayaang mamahinga.” Dahil kasalungat ito ng “itinataas ang kanyang kamay,” ang diwang “ibinababa” ang pinakamalinaw dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: At tuwing
  rationale: Ang kayariang ito ay nagpapakilala ng paulit-ulit na pangyayari sa panahon ng labanan. Likas na ipinahahayag sa modernong Tagalog ng “tuwing,” sa halip na wariing minsanan lamang ang kilos.
- source_word: יָרִים
  choice: itinataas
  rationale: Ang Hiphil ng רום ay nangangahulugang itaas. Ang aspektong di-ganap sa kontekstong paulit-ulit ay natural na isinasalin sa pangkasalukuyang anyong “itinataas,” nang hindi idinaragdag ang di-tiyak na ideya ng patuloy na paghawak nito sa itaas.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tuwirang tinutukoy ng יָד ang kamay. Pinanatili ito sa halip na “braso” upang hindi lumayo sa tiyak na salita ng Hebreo.
- source_word: וְגָבַר
  choice: nananaig
  rationale: Ang גבר ay tumutukoy sa pagiging higit na malakas o pagkakaroon ng kalamangan. Sa konteksto ng labanan, ipinahahayag ng “nananaig” ang pansamantalang pag-igpaw nang hindi ipinahihiwatig ang ganap at pangwakas na pagkatalo ng kalaban.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo sa modernong Filipino para sa pangalan ng bayan.
- source_word: יָנִיחַ
  choice: ibinababa
  rationale: Ang Hiphil ng נוח ay maaaring mangahulugang ipahinga, hayaang mamahinga, o ibaba. Dahil tuwirang kasalungat ito ng “itinataas,” malinaw at likas dito ang “ibinababa,” habang inilalahad sa talababa ang saklaw ng salitang Hebreo.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalan ng bayan, na kaayon ng tradisyonal na baybay ng mga pangalang biblikal sa Tagalog.
