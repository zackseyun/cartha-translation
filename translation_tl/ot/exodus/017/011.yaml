translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang maindayog na magkatulad na kayarian ng dalawang sugnay at ang “kamay” ng tekstong Hebreo. Ginamit ang “nananaig” upang ipakita ang pabago-bagong kalamangan sa labanan, hindi isang ganap na tagumpay.
