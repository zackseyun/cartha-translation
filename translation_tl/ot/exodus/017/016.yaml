base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: tl
  text: At sinabi niya, “Isang kamay ang nakapatong sa trono ni Yah[a]; makikipagdigma si Yahweh laban kay Amalek sa sali’t salinlahi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap at bitin ang Hebreo; literal, “Isang kamay sa trono ni Yah.” Maaari rin itong unawain na “isang kamay laban sa trono ni Yah,” o, bagaman hindi gaanong malamang, na “bandila” ang kahulugan ng כֵּס.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Karaniwang pagpapatuloy ng salaysay; hindi muling pinangalanan sa Hebreo ang panlalaking paksa kaya pinanatili ang “niya.”
- source_word: כִּי
  choice: hindi tahasang isinalin
  rationale: Ipinakikilala rito ng particle ang nilalaman ng sinabi. Likas sa Tagalog na ipahiwatig ito sa tuwirang sipi, nang hindi ipinipilit ang “sapagkat” o “tunay na” sa malabong sintaks.
- source_word: יָד עַל כֵּס יָהּ
  choice: Isang kamay ang nasa trono ni Yah
  rationale: 'Pinananatili ang maigsi at eliptikal na anyo: walang pantukoy ang “kamay,” ang עַל ay unang-unang “nasa/sa ibabaw ng,” at ang כֵּס ay pinakamalamang na kaugnay ng “trono.”'
- source_word: יָהּ
  choice: Yah
  rationale: Ito ang pinaikling anyo ng banal na pangalan at dapat maiba sa buong יהוה na kasunod nito.
- source_word: מִלְחָמָה לַיהוָה בַּעֲמָלֵק
  choice: makikipagdigma si Yahweh laban kay Amalek
  rationale: Ginagawang likas sa Tagalog ang nominal na pahayag tungkol sa patuloy na digmaan ni Yahweh, habang malinaw na ipinahahayag ang pakikipaglaban kay Amalek.
- source_word: מִדֹּר דֹּר
  choice: sa sali’t salinlahi
  rationale: Likas at matatag na idyomang Tagalog para sa pagpapatuloy sa magkakasunod na mga salinlahi.
theological_decisions:
- issue: Magkasamang paglitaw ng יָהּ at יהוה
  choice: Isinalin bilang “Yah” at “Yahweh”
  alternative: Isalin ang dalawa bilang “PANGINOON” o pareho bilang isang anyo ng pangalan
  rationale: Pinananatili nito ang pagkakaiba ng maikling banal na pangalan at ng buong Tetragrammaton sa mismong tekstong Hebreo.
- issue: Malabo at eliptikal na pariralang כִּי יָד עַל כֵּס יָהּ
  choice: “Isang kamay ang nasa trono ni Yah” na may talababa
  alternative: “Isang kamay ang laban sa trono ni Yah” o unawain ang כֵּס bilang “bandila”
  rationale: Hindi tinutukoy ng Hebreo kung kaninong kamay ito o ang tiyak na ugnayan nito sa trono. Pinananatili ng pangunahing teksto ang karaniwang kahulugan ng mga salita at inilalagay sa talababa ang tunay na mga alternatibo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “sali’t salinlahi” bilang likas na idyoma, at pinanatiling sadyang maigsi at mahiwaga ang unang pangungusap sa halip na tukuyin kung kaninong kamay iyon o gawin itong hayagang panunumpa.
