  rationale: Pinalitan lamang ang “nasa trono” ng “nakapatong sa trono” upang mas tumpak na maipahayag ang pangunahing kahulugan ng עַל (“sa ibabaw ng/nakapatong sa”) at maiwasan ang hindi sinasadyang kahulugang ang kamay ay nasa loob o nakaupo sa trono. Hindi binago ang sadyang malabo at eliptikal na katangian ng parirala; nananatili ang mga alternatibo sa talababa.
