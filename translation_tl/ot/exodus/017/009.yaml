  to: Sinabi ni Moises kay Josue, “Pumili ka ng mga lalaki para sa atin, at lumabas ka upang makipaglaban sa Amalek.[a] Bukas, tatayo ako sa tuktok ng burol,[b] at hawak ko sa aking kamay ang tungkod ng Diyos.”
