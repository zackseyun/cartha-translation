  source_fidelity: Tumpak na naipapahayag ng salin ang dalawang utos kay Josue, ang pakikipaglaban laban sa Amalek, at ang panghinaharap na pagtayo ni Moises kinabukasan sa tuktok ng burol na may tungkod ng Diyos sa kanyang kamay. Pinananatili rin nito ang “mga lalaki” para sa אֲנָשִׁים at ang hindi-pinalawak na “tungkod ng Diyos.”
  naturalness: Karaniwang malinaw ang Filipino, ngunit mas natural ang ayos na “Pumili ka ng mga lalaki para sa atin.” Ang huling pariralang “tangan sa aking kamay ang tungkod” ay medyo matalinghaga at hindi gaanong karaniwan sa modernong Filipino; ang “hawak ko sa aking kamay” ay mas tuwiran at malinaw.
  terminology: Ang “Moises,” “Josue,” “Amalek,” “mga lalaki,” “burol,” at “tungkod ng Diyos” ay angkop at pare-pareho ang rehistro. Ang mga talababa ay tumpak at tama ang mga pananda.
