base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: tl
  text: Sinabi ni Moises kay Josue, “Pumili ka ng mga lalaki para sa atin, at lumabas ka upang makipaglaban sa Amalek.[a] Bukas, tatayo ako sa tuktok ng burol,[b] at hawak ko sa aking kamay ang tungkod ng Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makipagdigma laban sa Amalek.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ulo ng burol,” isang idyoma para sa “sa tuktok ng burol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay sa Filipino; hindi nito labis na tinutukoy kung simpleng pagkakasunod o bunga ang kaugnayan sa naunang pangyayari.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Pumili ka para sa atin ng mga lalaki
  rationale: Tuwirang ipinapahayag ang pagpili at ang לָנוּ na “para sa atin.” Ang “mga lalaki” ay tumutugma sa אֲנָשִׁים at sa kontekstong pandigma.
- source_word: וְצֵא
  choice: at lumabas ka
  rationale: Pinananatili ang karaniwang kahulugan ng יצא na “lumabas,” na sa konteksto ay paglabas upang humarap sa labanan.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: upang makipaglaban sa Amalek
  rationale: Natural sa Filipino ang “makipaglaban sa” para sa utos na humarap sa isang kaaway; hindi tinutukoy nang higit sa Hebreo kung ang Amalek dito ay pangalan ng bayan o kinatawang katawagan sa hukbo nito.
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: Bukas, tatayo ako
  rationale: Bagaman participle ang נִצָּב, malinaw na panghinaharap ang bisa nito dahil sa “bukas.”
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: sa tuktok ng burol
  rationale: Ang literal na “ulo ng burol” ay idyomatikong tumutukoy sa pinakamataas na bahagi nito; “tuktok” ang malinaw at natural na katumbas.
- source_word: וּמַטֵּה הָאֱלֹהִים בְּיָדִי
  choice: tangan sa aking kamay ang tungkod ng Diyos
  rationale: Ikinakabit ang pariralang walang pandiwa sa pagtayo ni Moises at pinananatili ang larawan ng tungkod na nasa kamay niya. Ang “tungkod ng Diyos” ay tuwirang tumutugma sa construct phrase.
theological_decisions:
- issue: Kahulugan ng הָאֱלֹהִים sa pariralang מַטֵּה הָאֱלֹהִים
  choice: ang tungkod ng Diyos
  alternative: ang tungkod na mula sa Diyos
  rationale: Pinananatili ng “tungkod ng Diyos” ang maikli at tunay na ugnayang construct sa Hebreo nang hindi ipinapaliwanag kung pagmamay-ari, pagkakaloob, o pagkakaugnay ang eksaktong diin.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang tono. Ginamit ang “lumabas” sa halip na mas makalumang “humayo,” at “tangan” upang natural na ilarawan ang tungkod na hawak ni Moises. Inilipat ang panandang [a] sa pariralang tinutukoy talaga ng talababa, sa halip na ilagay pagkatapos ng pangalang Josue.
