  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “Samantala” upang maipakita ang magkasabay na kilos ng dalawang pangkat nang hindi binabago ang ugnayang pasalaysay. Inilagay ang panandang talababa [a] kaagad pagkatapos ng “Amalec,” ang salitang nililinaw nito.
