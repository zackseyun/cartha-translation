  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: tl
  text: Kaya ginawa ni Josue ang sinabi sa kanya ni Moises at nakipaglaban laban sa Amalec[a]. Samantala, umakyat sina Moises, Aaron, at Hur sa tuktok ng burol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Amalec”; maaaring tumukoy ito sa bayang nagmula kay Amalec, samakatuwid, sa mga Amalecita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Ang עשה sa pariralang ito ay nangangahulugang ginawa o isinagawa ang iniutos; natural sa Tagalog ang “ginawa ... ang sinabi.”
- source_word: כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: ang sinabi sa kanya ni Moises
  rationale: Ipinahihiwatig ng konteksto na sinunod ni Josue ang naunang tagubilin ni Moises. Pinananatili ng “sinabi” ang payak na diwa ng אמר nang hindi dinaragdagan ang teksto.
- source_word: לְהִלָּחֵם
  choice: nakipaglaban
  rationale: Ang Niphal infinitive ng לחם ay tumutukoy sa pakikipaglaban; malinaw at likas sa modernong Tagalog ang “nakipaglaban.”
- source_word: בַּעֲמָלֵק
  choice: kay Amalec
  rationale: Pinananatili ang pangalang Amalec na nasa Hebreo sa halip na tahasang gawing pangalang-bayan na “mga Amalecita”; sa konteksto, maaari itong tumukoy sa bayang nagmula kay Amalec.
- source_word: עָלוּ
  choice: umakyat
  rationale: Tuwirang ipinapahayag ang pataas na pagkilos patungo sa mataas na bahagi ng burol.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: tuktok ng burol
  rationale: Ang literal na “ulo ng burol” ay isang idyoma para sa pinakamataas na bahagi nito; “tuktok ng burol” ang natural na katumbas sa Tagalog.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang karaniwang anyo ng pangalang biblikal sa Tagalog.
- source_word: חוּר
  choice: Hur
  rationale: Isinalin sa titik ang pangalang Hebreo sa payak at nakikilalang anyo.
