source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: tl
  text: Umalis ang buong kapulungan ng mga Israelita mula sa ilang ng Sin, yugto-yugto, ayon sa utos ni Yahweh.[a] Nagkampo sila sa Refidim, ngunit walang tubig na maiinom ang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ayon sa bibig ni Yahweh,” isang Hebreong idyoma na nangangahulugang ayon sa kaniyang utos o tagubilin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: nagpatuloy sa paglalakbay
  rationale: Sa konteksto ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo at pagpapatuloy sa susunod na lugar. Likas sa modernong Tagalog ang pariralang ito at malinaw ang galaw ng salaysay.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ang buong kapulungan ng mga Israelita
  rationale: Pinananatili ng “buong kapulungan” ang kolektibong diwa ng עֵדָה, samantalang natural at inklusibong katawagan sa makabagong Tagalog ang “mga Israelita” para sa idyomang בְּנֵי יִשְׂרָאֵל.
- source_word: מִמִּדְבַּר סִין
  choice: mula sa ilang ng Sin
  rationale: Ang “ilang” ay angkop na salin ng מִדְבָּר sa salaysay ng Pentateuco. Ang Sin ay pangalang pantangi ng lugar at hindi isinalin.
- source_word: לְמַסְעֵיהֶם
  choice: nang yugto-yugto
  rationale: Ang מַסָּע ay tumutukoy sa sunod-sunod na yugto o paghimpil sa isang paglalakbay. Maikli at malinaw na ipinahahayag ng “nang yugto-yugto” ang adberbiyal na gamit nito rito.
- source_word: עַל פִּי יְהוָה
  choice: ayon sa utos ni Yahweh
  rationale: Ang literal na “ayon sa bibig ni Yahweh” ay isang Hebreong idyoma para sa pagkilos ayon sa kaniyang utos o tagubilin. Inilalahad ng pangunahing teksto ang kahulugan at inilalagay sa talababa ang literal na larawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: Nagkampo sila sa Refidim
  rationale: Karaniwan at malinaw sa modernong Tagalog ang “nagkampo.” Ang Refidim ay anyong baybay na angkop sa ponolohiya at ortograpiyang Filipino.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: ngunit walang tubig na maiinom ang bayan
  rationale: Ang “ngunit” ay natural na nagpapakita ng biglang suliraning kasunod ng pagkakampo. Ang “walang tubig na maiinom ang bayan” ay tuwiran at idiomatikong naghahatid ng diwa ng Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang יהוה sa teksto. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל sa buong kapulungan
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Sa konteksto, ang parirala ay katawagan sa buong sambayanan, hindi lamang sa mga lalaking anak. Iniiwasan ng “mga Israelita” ang posibleng maling pagkaunawa habang pinananatili ang kolektibong identidad.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “kapulungan” upang mapanatili ang kolektibong diwa ng עֵדָה, ngunit iniwasan ang sobrang lumang mga anyo. Pinanatili ang pangalang Yahweh at ginamit ang Filipino na baybay na Refidim.
