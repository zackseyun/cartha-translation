  to: Umalis ang buong kapulungan ng mga Israelita mula sa ilang ng Sin, yugto-yugto, ayon sa utos ni Yahweh.[a] Nagkampo sila sa Refidim, ngunit walang tubig na maiinom ang bayan.
  rationale: Pinalitan ang “nagpatuloy sa paglalakbay” ng “Umalis” upang mas tumpak na maipahayag ang pandiwang Hebreo para sa pag-alis ng kampo. Pinanatili ang lahat ng iba pang mahahalagang kahulugan, kabilang ang paglalakbay nang yugto-yugto, ang banal na pangalang Yahweh, at ang kawalan ng tubig para sa bayan. Bahagyang inayos din ang talababa upang maging mas likas ang Filipino.
