base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: tl
  text: At nakipagtalo ang mga tao kay Moises at sinabi, “Bigyan ninyo kami ng tubig upang makainom kami.” Sinabi ni Moises sa kanila, “Bakit kayo nakikipagtalo sa akin? Bakit ninyo sinusubok[b] si Yahweh[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; nakaugaliang isalin na “ang PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: O “inilalagay ninyo sa pagsubok si Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶב
  choice: nakipagtalo
  rationale: Ang ריב ay tumutukoy sa pakikipagtalo o pakikipagtunggali. Pinananatili ng “nakipagtalo” ang matinding salungatan at likas ito sa makabagong Filipino.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tahasang katumbas ito ng kolektibong “ang bayan/mga tao” nang hindi idinaragdag sa talata ang “ng Israel.”
- source_word: עִם מֹשֶׁה
  choice: kay Moises
  rationale: Sa Filipino, likas na sabihin ang “nakipagtalo kay Moises”; ipinahihiwatig na nito ang pagsalungat nang hindi kailangang gawing “laban kay Moises.”
- source_word: תְּנוּ לָנוּ מַיִם
  choice: Bigyan ninyo kami ng tubig
  rationale: Pinananatili ang maramihang anyo ng pautos na תְּנוּ sa “ninyo,” na maaari ring maging magalang na pagtukoy sa iisang kausap sa Filipino.
- source_word: וְנִשְׁתֶּה
  choice: upang makainom kami
  rationale: Ipinapahayag ng cohortative ang layunin o ninanais na bunga ng utos; malinaw at natural itong naihahatid ng “upang makainom kami.”
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Bakit kayo nakikipagtalo sa akin?
  rationale: Ang מַה ay gumaganap dito bilang “bakit.” Inuulit ang salitang “nakikipagtalo” upang mapanatili ang leksikal at retorikal na ugnayan sa unang sugnay.
- source_word: מַה תְּנַסּוּן
  choice: Bakit ninyo sinusubok
  rationale: Ang piel ng נסה ay “subukin” o “ilagay sa pagsubok.” Ang “sinusubok” ay maikli, natural, at hindi pinahihina ang bigat ng kanilang paghamon sa Diyos.
- source_word: אֶת יְהוָה
  choice: si Yahweh
  rationale: Ang יְהוָה ay sariling pangalan ng Diyos; ang “Yahweh” ay tuwirang transliterasyon, at ang pantukoy na “si” ay angkop sa pangalang pantangi sa Filipino.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang pangalan, habang inilalahad sa talababa ang nakaugaliang salin.
- issue: Diwa ng נסה kapag Diyos ang layon
  choice: sinusubok si Yahweh
  alternative: inilalagay si Yahweh sa pagsubok
  rationale: 'Pinananatili ng “sinusubok” ang teolohikal na tensiyon: ang pakikipagtalo nila kay Moises ay inilarawan bilang pagsubok kay Yahweh, nang hindi ito pinapalambot o labis na ipinapaliwanag.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “nakipagtalo/nakikipagtalo” at ang tuwirang tindi ng pagsaway ni Moises. Inilagay ang mga tanda ng talababa sa mismong mga salitang tinutukoy ng mga ito.
