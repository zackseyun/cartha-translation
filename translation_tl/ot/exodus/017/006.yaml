  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: tl
  text: “Narito[a], tatayo ako roon sa harap mo, sa ibabaw ng bato sa Horeb. Hampasin mo ang bato; lalabas mula rito ang tubig, at iinom ang bayan.” Gayon nga ang ginawa ni Moises sa paningin ng mga nakatatanda ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Narito, nakatayo ako roon sa harap mo, sa ibabaw ng bato sa Horeb.” Maaaring ipahayag ng Hebreong participle ang kilos na pangkasalukuyan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito
  rationale: Likas at marangal na panawag-pansin sa Filipino na nagpapanatili sa mariing pagpapakilala ng Diyos.
- source_word: עֹמֵד
  choice: tatayo ako
  rationale: Bagaman participle ang anyong Hebreo, ang konteksto ng tagubilin ay tumutukoy sa nalalapit na pagkilos; pinananatili sa talababa ang posibleng pangkasalukuyang pagbasa.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Tuwirang katumbas na malinaw na nagsasaad ng kinalalagyan ng Diyos kaugnay ni Moises.
- source_word: הַצּוּר
  choice: ang bato
  rationale: Karaniwan at natural na katumbas ng צוּר; inulit upang mapanatili ang pag-uulit sa Hebreo.
- source_word: בְּחֹרֵב
  choice: sa Horeb
  rationale: Likas na Filipino para sa pagtukoy sa lugar.
- source_word: וְהִכִּיתָ
  choice: Hampasin mo
  rationale: Nagpapahayag ng tuwirang utos at nagpapanatili sa lakas ng pandiwang Hebreo.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: lalabas mula rito ang tubig
  rationale: Malapit sa payak na pahayag ng Hebreo nang hindi idinaragdag ang larawang ‘aagos,’ na hindi tahasang nasa pandiwa.
- source_word: וְשָׁתָה הָעָם
  choice: at iinom ang bayan
  rationale: 'Pinananatili ang payak na pagkakasunod ng resulta: hahampasin ang bato, lalabas ang tubig, at iinom ang bayan.'
- source_word: וַיַּעַשׂ כֵּן
  choice: Gayon nga ang ginawa
  rationale: Natural na Filipino para sa pormulang nagsasaad na isinagawa ang iniutos.
- source_word: לְעֵינֵי זִקְנֵי יִשְׂרָאֵל
  choice: sa paningin ng matatandang pinuno ng Israel
  rationale: Pinananatili ang diwa ng hayag na pagsaksi; nililinaw ng ‘pinuno’ ang tungkulin ng mga זְקֵנִים at hindi lamang ang kanilang edad.
theological_decisions:
- issue: Panahunan ng participle sa pagpapahayag ng Diyos
  choice: Narito, tatayo ako roon sa harap mo
  alternative: Narito, nakatayo ako roon sa harap mo
  rationale: Maaaring pangkasalukuyan ang Hebreong participle, ngunit ang daloy ng tagubilin ay natural ding nagbibigay rito ng nalalapit na hinaharap na diwa. Hindi inaalis ang tunay na kalabuan; inilalahad sa talababa ang alternatibo.
- issue: Pagkakaugnay ng ‘sa ibabaw ng bato’
  choice: Ang Diyos ay tatayo sa harap ni Moises, sa ibabaw ng bato sa Horeb
  alternative: Ang Diyos ay tatayo sa harap ni Moises doon, sa tabi ng bato sa Horeb
  rationale: Pinakanatural na iniuugnay ng sintaks ang pariralang ‘sa ibabaw ng bato sa Horeb’ sa pagtayo ng Diyos. Pinananatili ang kapansin-pansing larawan nang walang idinaragdag na paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘bayan’ para sa kolektibong הָעָם at ‘matatandang pinuno’ para maipakita na ang זִקְנֵי Israel ay mga kinatawang lider, hindi lamang matatanda sa edad.
