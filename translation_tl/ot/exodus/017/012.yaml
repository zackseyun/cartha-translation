  to: Ngunit bumigat ang mga kamay ni Moises, kaya kumuha sila ng isang bato at inilagay ito sa ilalim niya, at umupo siya sa bato. Sinuportahan naman nina Aaron at Hur ang kanyang mga kamay—isang nasa isang panig at isa naman sa kabila—kaya nanatiling matatag ang kanyang mga kamay hanggang sa paglubog ng araw.
