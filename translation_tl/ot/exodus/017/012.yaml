base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: tl
  text: Ngunit bumigat ang mga kamay ni Moises, kaya kumuha sila ng isang bato at inilagay ito sa ilalim niya, at umupo siya sa bato. Sinuportahan naman nina Aaron at Hur ang kanyang mga kamay—isang nasa isang panig at isa naman sa kabila—kaya nanatiling matatag ang kanyang mga kamay hanggang sa paglubog ng araw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: bumigat ang mga kamay ni Moises
  rationale: Pinananatili ang konkretong larawan ng Hebreong כְּבֵדִים (“mabigat”), ngunit ginagamit ang likas na pandiwang Tagalog na nagpapahiwatig ng pagkapagod habang nagpapatuloy ang pangyayari.
- source_word: וַיִּקְחוּ
  choice: kumuha sila
  rationale: Pinananatili ang di-tiyak na pangmaramihang simuno ng Hebreo; hindi tahasang ipinapalagay na sina Aaron at Hur lamang ang gumawa nito.
- source_word: אֶבֶן
  choice: isang bato
  rationale: Karaniwan at tuwirang katumbas ng אֶבֶן sa kontekstong ginamit ang bato bilang upuan.
- source_word: וַיָּשִׂימוּ תַחְתָּיו וַיֵּשֶׁב עָלֶיהָ
  choice: inilagay iyon sa ilalim niya, at umupo siya roon
  rationale: Malinaw at natural sa Tagalog; ang “roon” ay tumutukoy sa batong inilagay sa ilalim niya nang hindi mabigat pakinggan ang literal na “umupo siya sa ibabaw niyon.”
- source_word: תָּמְכוּ בְיָדָיו
  choice: sinuportahan ... ang kanyang mga kamay
  rationale: Ipinahahayag ang pisikal na pag-alalay at pinananatili ang pag-uulit ng “mga kamay” sa Hebreo.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: isa sa isang panig at isa sa kabila
  rationale: 'Likas na Tagalog na nagpapanatili sa distribusyon: tig-isa sa magkabilang panig ni Moises.'
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: nanatiling matatag ang kanyang mga kamay
  rationale: Sa konteksto ng pagkapagod at pisikal na pagsuporta, ang אֱמוּנָה ay tumutukoy sa katatagan o hindi paggalaw. Ang “nanatiling” ay naghahatid ng nagpapatuloy na kalagayan.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: hanggang sa paglubog ng araw
  rationale: Natural at marangal na salin ng Hebreong idyoma para sa pagtatapos ng maghapon.
theological_decisions:
- issue: Kahulugan ng אֱמוּנָה kapag inilalarawan ang mga kamay ni Moises
  choice: pisikal na katatagan (“matatag”)
  alternative: “tapat” o “matibay” sa mas abstraktong diwa
  rationale: Ang agarang konteksto ay ang mabibigat na kamay ni Moises na pisikal na inalalayan nina Aaron at Hur. Ang “matatag” ay angkop sa tagpo ngunit pinananatili rin ang semantikong kaugnayan sa pagiging matibay at hindi natitinag, nang hindi ipinapasok ang abstraktong teolohikal na kahulugang hindi hinihingi ng talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “bumigat” kaysa literal ngunit di-likas na “mabigat ang mga kamay,” at ang mga pangalang Aaron at Hur ay pinanatili sa karaniwang anyong biblikal. Walang talababa dahil ang “matatag” ay sapat na kumakatawan sa kahulugan sa konteksto nang hindi kinakailangang maglista ng mga alternatibo.
