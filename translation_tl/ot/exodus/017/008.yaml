  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: tl
  text: Pagkatapos nito, dumating ang Amalek at nakipaglaban sa Israel sa Refidim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kasama” ang pang-ukol sa Hebreo. Sa konteksto ng digmaan, tumutukoy ito sa kabilang panig, kaya “nakipaglaban sa Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, dumating
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Pagkatapos” upang ipahayag ang pagkakasunod-sunod, habang pinananatili ng “dumating” ang payak na diwa ng בוא.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Isinalin bilang pangalang pantangi. Sa konteksto, kumakatawan ito sa bayang Amalekita bilang isang kabuuan, ngunit pinananatili ang anyong isahan ng pangalang Hebreo.
- source_word: וַיִּלָּחֶם
  choice: nakipaglaban
  rationale: Ang Niphal ng לחם dito ay nangangahulugang makipaglaban o makidigma. Ang “nakipaglaban” ay natural at tuwiran sa Tagalog.
- source_word: עִם
  choice: sa
  rationale: Literal na “kasama/kasalo” ang עִם, ngunit sa konteksto ng labanan ay ang kabilang panig ang Israel. Sa Tagalog, ang “nakipaglaban sa Israel” ay natural at maaari pa ring tumukoy sa pakikipaglaban laban dito; inilalahad sa talababa ang mas tahasang alternatibo.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo ng pangalan ng bayang Israel sa modernong Tagalog.
- source_word: בִּרְפִידִם
  choice: sa Refidim
  rationale: Ang בְּ ay nagmamarka ng lugar. Natural sa Tagalog ang “sa Refidim” para sa pook na pinangyarihan ng labanan.
