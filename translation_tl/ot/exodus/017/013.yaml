  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: tl
  text: At dinaig ni Josue si Amalec at ang kanyang mga tauhan sa pamamagitan ng tabak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “sa talim ng tabak.” Ang Hebreo ay literal na “sa bibig ng tabak,” isang idyoma para sa paggapi sa pamamagitan ng tabak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: dinaig
  rationale: Sa konteksto ng labanan, ipinahihiwatig ng pandiwa ang panghihina o paggapi sa kalaban. Ang “dinaig” ay natural sa modernong Tagalog at nagpapahayag ng pagtatagumpay nang hindi ipinapalagay ang ganap na paglipol.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang biblikal sa Tagalog.
- source_word: עֲמָלֵק
  choice: Amalec
  rationale: Ginamit ang nakaugaliang anyo sa Tagalog; dito, ang pangalan ay kumakatawan sa pinuno o pangkat na lumalaban sa ilalim niya.
- source_word: עַמּוֹ
  choice: ang mga tauhan nito
  rationale: Literal na “kanyang bayan/mga tao,” ngunit sa salaysay ng labanan ay tumutukoy sa mga mandirigmang kasama ni Amalec. Ang “mga tauhan” ay malinaw at natural nang hindi tahasang nililimitahan sa isang pormal na hukbo.
- source_word: לְפִי חָרֶב
  choice: sa pamamagitan ng tabak
  rationale: Ito ay idyomang Hebreo na literal na “sa bibig ng tabak” at tumutukoy sa paggapi sa armadong labanan. Ang salin ay malinaw sa modernong Tagalog; pinanatili sa talababa ang literal na larawan.
