source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Magpatuloy ka sa unahan ng bayan at isama mo ang ilan sa mga nakatatanda ng Israel.[a] Dalhin mo sa iyong kamay ang tungkod mo na ipinampalo mo sa Nilo,[b] at humayo ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa mga nakatatanda ng Israel”; malamang na nangangahulugang pipili si Moises ng ilan sa kanila upang isama niya.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ilog”; sa Exodo, karaniwang tumutukoy ang salitang ito sa Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Dumaan ka sa unahan ng bayan
  rationale: Pinananatili nito ang diwa ng pagdaan o pagpapatuloy sa harap ng sambayanan nang natural sa makabagong Tagalog.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: at isama mo ang ilan sa matatandang pinuno ng Israel
  rationale: 'Ang מִן ay partitive: pipili si Moises ng ilan mula sa pangkat ng matatandang pinuno, hindi niya isasama ang lahat.'
- source_word: וּמַטְּךָ
  choice: ang tungkod mo
  rationale: Ang “tungkod” ang natural at angkop na salin ng מַטֶּה sa konteksto ng tungkod ni Moises.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: na ipinampalo mo sa Nilo
  rationale: Ipinahahayag ng “ipinampalo” ang instrumental na gamit ng tungkod; sa konteksto ng Exodo, ang יְאֹר ay tumutukoy sa Nilo.
- source_word: קַח בְּיָדְךָ
  choice: Kunin mo sa iyong kamay
  rationale: Pinananatili ang inuulit na utos na קַח at ang tahasang paghawak sa tungkod.
- source_word: וְהָלָכְתָּ
  choice: at humayo ka
  rationale: Dito, ang anyo ay nagpapatuloy sa sunod-sunod na mga utos; ang “humayo ka” ay maikli at marangal.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinakikita nito ang pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehovah
  rationale: Pinananatili ang personal na pangalang tipan sa pamamagitan ng karaniwang akademikong transliterasyon, nang hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong sambayanan ng Israel at “matatandang pinuno” upang maipakita na ang mga elder ay kinikilalang mga pinuno, hindi lamang matatanda sa edad.
