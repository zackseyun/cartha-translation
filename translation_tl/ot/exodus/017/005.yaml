revisions:
- from: Pagkatapos, sinabi ni Yahweh kay Moises, “Dumaan ka sa unahan ng bayan at isama mo ang ilan sa matatandang pinuno ng Israel.[a] Kunin mo sa iyong kamay ang tungkod mo na ipinampalo mo sa Nilo,[b] at humayo ka.”
  to: Pagkatapos, sinabi ni Yahweh kay Moises, “Magpatuloy ka sa unahan ng bayan at isama mo ang ilan sa mga nakatatanda ng Israel.[a] Dalhin mo sa iyong kamay ang tungkod mo na ipinampalo mo sa Nilo,[b] at humayo ka.”
  rationale: Inalis ang karagdagang “pinuno” upang huwag lumampas sa tahasang sinasabi ng Hebreo. Nilinaw ang utos na pumunta sa unahan ng bayan at pinasigla ang ayos ng ikalawang utos nang hindi binabago ang kahulugan o ang mga footnote anchor.
