id: EXO.17.4
reference: Exodus 17:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: tl
  text: Kaya dumaing si Moises kay Yahweh, “Ano ang gagawin ko sa bayang ito? Kaunti na lang[a] at babatuhin na nila ako!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kaunti pa, at babatuhin nila ako,” na nagpapahiwatig na napipinto na ang banta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: dumaing
  rationale: Ipinahihiwatig ng צעק ang matinding paghingi ng tulong dahil sa panganib o pagkabalisa. Likas sa Tagalog ang “dumaing” para sa apurahang pagsusumamo ni Moises, hindi lamang karaniwang pagsasalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: לֵאמֹר
  choice: —
  rationale: Ipinakikita na ng tuwirang sipi pagkatapos ng “dumaing” ang tungkulin ng infinitibong לֵאמֹר; ang tahasang “na sinasabi” ay magiging mabigat at di-likas sa modernong Tagalog.
- source_word: מָה אֶעֱשֶׂה
  choice: Ano ang gagawin ko
  rationale: Pinananatili nito ang tuwiran at apurahang tanong ni Moises tungkol sa dapat niyang gawin.
- source_word: לָעָם הַזֶּה
  choice: sa bayang ito
  rationale: Ang “sa” ay likas at sapat na malawak upang katawanin ang ugnayang ipinahihiwatig ng ל—kung ano ang gagawin niya hinggil sa, para sa, o sa pakikitungo sa bayang ito—nang hindi labis na nililinaw ang tunay na kalabuan.
- source_word: עֹוד מְעַט
  choice: Kaunti na lang
  rationale: Natural itong modernong idyoma para sa literal na “kaunti pa” at malinaw na naghahayag na napipinto na ang banta.
- source_word: וּסְקָלֻנִי
  choice: at babatuhin na nila ako
  rationale: Ang “babatuhin” ang tuwirang katumbas ng pagkilos na סקל. Ang “na” ay naghahatid ng nalalapit na resultang ipinahihiwatig ng konteksto.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng sektaryong paliwanag.
- issue: Lakas at anyo ng banta ng bayan
  choice: babatuhin na nila ako
  alternative: papatayin na nila ako sa pamamagitan ng pagbato
  rationale: Pinananatili ng salin ang tiyak na pandiwang “babatuhin” at ang nalalapit na banta, ngunit hindi tahasang idinaragdag ang “papatayin” sapagkat hindi iyon hiwalay na sinabi sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עָם at “dumaing” upang maipahayag ang matinding pagsusumamo. Inilipat ang talababa sa “Kaunti na lang,” ang bahaging tunay nitong ipinaliliwanag.
