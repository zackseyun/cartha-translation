  to: Doon ay nauhaw sa tubig ang bayan, at nagreklamo sila laban kay Moises. Sinabi nila, “Bakit mo kami iniahon mula sa Ehipto—para patayin sa uhaw ako, ang mga anak ko, at ang mga alaga kong hayop?”
