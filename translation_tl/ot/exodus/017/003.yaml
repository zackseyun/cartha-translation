base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: tl
  text: Doon ay nauhaw sa tubig ang bayan, at nagreklamo sila laban kay Moises. Sinabi nila, “Bakit mo kami iniahon mula sa Ehipto—para patayin sa uhaw ako, ang mga anak ko, at ang mga alaga kong hayop?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא שָׁם הָעָם לַמַּיִם
  choice: Doon ay nauhaw sa tubig ang bayan
  rationale: Tuwirang pinananatili ang lokasyon, pagkauhaw, at pangangailangan sa tubig, sa natural ngunit marangal na Tagalog.
- source_word: וַיָּלֶן הָעָם עַל־מֹשֶׁה
  choice: kaya nagreklamo sila kay Moises
  rationale: Ang לון dito ay pagrereklamo o pagbulung-bulong laban kay Moises. Ginawang panghalip ang ikalawang 'ang bayan' upang maiwasan ang di-likas na pag-uulit; ang 'kaya' ay nagpapahayag ng ugnayang malinaw sa konteksto nang hindi nagdaragdag ng bagong pangyayari.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: Bakit mo pa kami iniahon mula sa Ehipto?
  rationale: Ang הֶעֱלִיתָנוּ ay literal na 'iniahon/inakyat mo kami,' karaniwang pananalita sa pag-alis mula sa Ehipto. Ang לָמָּה זֶּה ay natural na naipapahayag bilang mapanumbat na 'Bakit mo pa...?' nang hindi isinasapinal ang kakaibang Hebreong konstruksyon.
- source_word: לְהָמִית אֹתִי וְאֶת־בָּנַי וְאֶת־מִקְנַי בַּצָּמָא
  choice: Para patayin sa uhaw ako, ang mga anak ko, at ang mga alaga kong hayop?
  rationale: Pinananatili ang biglang paglipat mula sa maramihang 'kami' tungo sa isahang 'ako/ko' sa Hebreo. Ang מִקְנֶה ay mga alagang hayop o livestock, hindi lamang isang uri ng hayop.
theological_decisions:
- issue: Layunin o paratang sa pariralang לְהָמִית
  choice: Para patayin sa uhaw... ?
  alternative: upang mamatay sa uhaw...
  rationale: Ang infinitive ay inilalahad bilang paratang ng bayan na layunin ni Moises ang kanilang kamatayan; hindi ito pinahihinang maging resulta lamang, ni ipinapalagay na tunay na layunin iyon ni Moises.
- issue: Paglipat mula maramihan tungo sa isahan
  choice: kami ... ako, ang mga anak ko, at ang mga alaga kong hayop
  alternative: kami ... kami, ang aming mga anak, at ang aming mga alagang hayop
  rationale: Sinusunod ang Masoretic Text, na may maramihang object sa 'iniahon mo kami' ngunit isahang mga anyo sa kasunod na talaan. Maaaring kumakatawan ang nagsasalita sa bawat miyembro ng bayan; hindi ito pinapantay para lamang maging mas madulas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignificado. Pinanatili ang retorikal na panunumbat at ang kapansin-pansing pagbabago ng bilang sa Hebreo. Walang footnote dahil kayang katawanin ng pangunahing teksto ang mga detalyeng ito.
