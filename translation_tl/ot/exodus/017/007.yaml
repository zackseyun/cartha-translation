base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: tl
  text: At tinawag niya ang lugar na Masa at Meriba[a], dahil sa pakikipagtalo ng mga anak ni Israel[b] at dahil sinubok nila si Yahweh sa pagsasabing, “Nasa gitna ba natin si Yahweh o wala?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Masa ay kaugnay ng salitang Hebreo para sa “pagsubok,” at ang Meriba ay kaugnay ng salitang para sa “pakikipagtalo” o “alitan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ay maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: tinawag niya ang lugar na
  rationale: Ang קרא na may שֵׁם ay pormula ng pagpapangalan. Ang likas na Tagalog na “tinawag niya ang lugar na” ay naghahatid ng buong diwa nang hindi pinananatili ang alanganing literal na “tinawag niya ang pangalan ng lugar.”
- source_word: מַסָּה וּמְרִיבָה
  choice: Masa at Meriba
  rationale: Mga pangalang-pook ang mga ito kaya tinumbasan sa transliterasyong angkop sa Tagalog; ipinaliliwanag sa talababa ang paglalaro sa kahulugan ng mga pangalang Hebreo.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: dahil sa pakikipagtalo ng mga anak ni Israel
  rationale: Ang עַל ay nagpapahayag ng dahilan, at ang רִיב ay pagtatalo o pakikipagtalo. Pinanatili ang anyong “mga anak ni Israel,” habang nililinaw sa talababa ang kolektibong gamit nito.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: at dahil sinubok nila si Yahweh
  rationale: Ang piel ng נסה ay “subukin” o “ilagay sa pagsubok.” Ang tuwirang pandiwang Tagalog ay malinaw at tapat sa pagkakabuo ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalang banal na nakasulat sa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: לֵאמֹר
  choice: sa pagsasabi
  rationale: Ipinakikilala nito ang mismong pananalitang naging paraan ng pagsubok kay Yahweh.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Nasa kalagitnaan ba natin si Yahweh o wala?
  rationale: Ang בְּקִרְבֵּנוּ ay “sa ating kalagitnaan” o “kasama natin.” Pinili ang mas malapit sa larawang Hebreo, at pinanatili ng “o wala” ang matalim na polar na tanong.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa pinagmulang teksto. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang tahasang larawang pangkamag-anakan ng Hebreo, ngunit nililinaw sa talababa na tumutukoy ito sa bayang Israel bilang kabuuan.
- issue: Kalikasan ng tanong tungkol sa presensiya ni Yahweh
  choice: Nasa kalagitnaan ba natin si Yahweh o wala?
  alternative: Kasama ba natin si Yahweh o hindi?
  rationale: Hindi nilulutas ang tensiyong teolohikal ng tanong. Ang salin ay nagpapakita ng pagdududa ng bayan sa presensiya ni Yahweh sa gitna nila, hindi lamang sa kaniyang pagsang-ayon o tulong.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Masa” at “Meriba” ayon sa karaniwang baybay-Tagalog ng mga pangalang Biblikal, at pinanatili ang “Yahweh” bilang personal na pangalan. Ang pangungusap ay bahagyang pormal upang mapanatili ang bigat ng salaysay ngunit madaling maunawaan ng karaniwang mambabasa.
