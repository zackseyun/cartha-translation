  source_fidelity: 'Tumpak na naihahatid ng salin ang mga pangunahing bahagi ng Hebreo: ang utos na isulat ito bilang pang-alaala sa aklat, ang idyomang iparinig kay Josue, ang mariing pangako ng pagbura, at ang saklaw na “sa silong ng langit.” Napapanatili rin ang sinadyang ugnayan/kaibahan ng זִכָּרוֹן (“pang-alaala”) at זֵכֶר (“pag-alaala”).'
