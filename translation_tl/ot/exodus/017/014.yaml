source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Isulat mo ito sa aklat[a] bilang pang-alaala, at iparinig mo ito kay Josue[b], sapagkat tiyak na tiyak na buburahin ko[c] ang pag-alaala kay Amalek sa silong ng langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “sa isang aklat” o “sa balumbon.” Literal sa Hebreo: “sa aklat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Literal: “ilagay mo sa mga tainga ni Josue,” ibig sabihin, iparinig o bigkasin ito sa kaniya.'
    reason: lexical_alternative
  - marker: c
    text: 'Mariin ang anyo ng pananalita sa Hebreo: “buburahin ko nga” o “tiyak na buburahin ko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כְּתֹב
  choice: Isulat mo
  rationale: Tuwirang pautos ang anyo ng pandiwa at natural itong maipahahayag sa Filipino bilang “Isulat mo.”
- source_word: זֹאת זִכָּרוֹן
  choice: ito ... bilang pang-alaala
  rationale: Ipinahihiwatig ng parirala na isusulat ang pangyayari upang manatili itong alaala; pinananatili rin nito ang ugnayan at kaibahan sa pag-aalis sa pag-alaala kay Amalek.
- source_word: בַּסֵּפֶר
  choice: sa aklat
  rationale: May tiyak na pantukoy ang Hebreo. Ang “aklat” ay malinaw at natural, bagaman maaaring sinaunang balumbon ang tinutukoy.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: at iparinig mo ito kay Josue
  rationale: Literal itong “ilagay sa mga tainga ni Josue,” isang idyoma na nangangahulugang tiyaking maririnig niya ito. Inihahayag ng salin ang kahulugan sa likas na Filipino.
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalang Joshua sa Filipino.
- source_word: מָחֹה אֶמְחֶה
  choice: tiyak na tiyak na buburahin ko
  rationale: Ang infinitive absolute na kasabay ng pandiwa ay mariing nagpapahayag ng katiyakan; ang pag-uulit ng “tiyak” ay naghahatid ng diin sa natural na Filipino.
- source_word: זֵכֶר עֲמָלֵק
  choice: ang pag-alaala kay Amalek
  rationale: Tumutukoy ang זֵכֶר sa alaala o pag-alaala. Iniiwasan ng “kay Amalek” ang posibleng maling pakahulugan na si Amalek ang umaalaala.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: sa silong ng langit
  rationale: Pinananatili nito ang malawak na Hebreong idyoma para sa lubusang pag-aalis sa buong daigdig.
theological_decisions:
- issue: Paglalahad sa banal na pangalan
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tahasang ginagamit sa Hebreo ang יְהוָה. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iparinig” upang natural na maipahayag ang Hebreong idyoma, samantalang inilagay sa talababa ang literal na larawan. Pinanatili ang magkaugnay na “pang-alaala” at “pag-alaala” upang maipakita ang sinadyang kaibahan sa talata.
