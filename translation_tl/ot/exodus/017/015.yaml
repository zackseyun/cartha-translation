  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: tl
  text: At nagtayo si Moises ng isang altar at pinangalanan niya itong “Si Yahweh ang aking Bandila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH, aking bandila,” o “ang PANGINOON ang aking bandila.” Malamang na ang pangalan ay nangangahulugang si Yahweh ang bandila o panandang pinagtitipunan ng Israel sa kanilang tagumpay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Ang בנה sa sunod-sunod na salaysay ay tuwirang tumutukoy sa pagtatayo; natural sa Filipino ang “nagtayo” para sa isang altar.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Ang מִזְבֵּחַ ay karaniwang tawag sa lugar ng paghahandog; malinaw at nakasanayan sa modernong Filipino ang “altar.”
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Literal na “tinawag ang pangalan nito” ang Hebreong idyoma, ngunit ang “pinangalanan niya itong” ang natural at tumpak na pormula ng pagbibigay-pangalan sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Personal na pangalan ng Diyos ang Tetragrammaton; pinananatili rito ang transliterasyong “Yahweh” sa halip na palitan ng isang titulo.
- source_word: נִסִּי
  choice: ang Aking Bandila
  rationale: 'Ang נֵס ay bandila o sagisag na itinataas bilang hudyat at pagtitipunan. Sa pariralang walang tahasang pandiwa, natural na ipinapasok sa Filipino ang “ang”: “Si Yahweh ang Aking Bandila.”'
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה sa pangalan ng altar
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Tahasang ginagamit ng Hebreo ang banal na pangalan; ang “Yahweh” ang nagpapanatili rito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Ugnayan ng יְהוָה at נִסִּי sa pangalang ibinigay sa altar
  choice: Si Yahweh ang Aking Bandila
  alternative: Yahweh, aking bandila
  rationale: Walang nakasulat na pandiwang “ay” sa Hebreo, ngunit maaaring maunawaan ang parirala bilang isang nominal na pangungusap. Ang pangunahing salin ay natural sa Filipino, habang itinatala sa talababa ang mas literal na anyo upang mapanatili ang tunay na sintaktikong lapit.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “pinangalanan niya itong” sa halip na literal ngunit alanganing “tinawag niya ang pangalan nito.” Pinanatili ang “Yahweh” at ang metaporang “bandila,” at inilagay ang marker na [a] kaagad pagkatapos ng pangalan ng altar.
