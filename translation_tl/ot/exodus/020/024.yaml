base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: tl
  text: Gumawa ka para sa akin ng altar na yari sa lupa. Sa ibabaw nito mo ihahandog ang iyong mga handog na sinusunog at mga handog para sa kapayapaan—ang iyong mga tupa at kambing at ang iyong mga baka. Sa bawat lugar kung saan ipaaalala ko ang aking pangalan[a], pupunta ako sa iyo at pagpapalain kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin na “ipahahayag ko ang aking pangalan” o “ipatatala ko ang aking pangalan.” Causative ang pandiwang Hebreo: ipinapagawa o pinapangyayari ng Diyos na maalala o mabanggit ang kanyang pangalan. Maaaring saklawin nito ang pagpapahayag, paggunita, o pagtawag sa kanyang pangalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: altar na yari sa lupa
  rationale: Tuwirang ipinahahayag na ang altar ay gawa sa lupa; natural at malinaw ito sa modernong Tagalog.
- source_word: תַּעֲשֶׂה לִּי
  choice: Gumawa ka para sa akin
  rationale: Ang di-ganap na pandiwa sa kontekstong legal ay may puwersa ng utos; pinananatili ng “para sa akin” ang layon ng pagtatalaga.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: Doon mo ihahandog
  rationale: Sa konteksto ng pagsamba, ang זבח ay paghahandog bilang sakripisyo; ang “doon” ay natural na tumutukoy sa altar.
- source_word: עֹלֹתֶיךָ
  choice: iyong mga handog na sinusunog
  rationale: Tumutukoy ito sa handog na lubusang sinusunog sa altar; malinaw ang pariralang Filipino nang hindi nagdaragdag ng paliwanag sa talata.
- source_word: שְׁלָמֶיךָ
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili nito ang kaugnayan ng salitang Hebreo sa kapayapaan, kabuuan, at kagalingan nang hindi nililimitahan sa pakikisama lamang.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: ang iyong mga tupa at kambing at ang iyong mga baka
  rationale: Saklaw ng צאן ang maliliit na alagang hayop, karaniwang tupa at kambing, samantalang ang בקר ay mga baka. Mas tiyak ito kaysa “kawan” at “bakahan” at hindi inaalis ang mga kambing.
- source_word: בְּכָל הַמָּקוֹם
  choice: Sa bawat lugar
  rationale: Pinananatili ang distributibong diwa ng pariralang Hebreo sa natural na Tagalog.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: na ipaaalaala ko ang aking pangalan
  rationale: Ang Hiphil ng זכר ay causative. Ipinahahayag ng salin na ang Diyos ang nagpapangyaring maalaala o mabanggit ang kanyang pangalan, habang ang talababa ay nagpapanatili sa ibang posibleng nuances.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: pupunta ako sa iyo at pagpapalain kita
  rationale: Natural na ipinapahayag ang paglapit at pagpapala ng Diyos, at tahasang pinananatili ang unang panauhang simuno at ikalawang panauhang layon.
theological_decisions:
- issue: Kahulugan ng pagkilos ng Diyos sa אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: na ipaaalaala ko ang aking pangalan
  alternative: na ipahahayag ko ang aking pangalan; na ipatatala ko ang aking pangalan
  rationale: Pinananatili ng pangunahing salin ang causative na anyo at ang banal na pagkilos nang hindi ipinapasiya kung ang paraan ay pagpapahayag, pagtatala, paggunita, o pagtawag sa pangalan ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “altar” bilang karaniwang terminong biblikal; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
