  naturalness: Natural at marangal ang gamit ng “baitang,” “altar,” at “kahubaran.” Mas malinaw at natural ang ayos na “umakyat ... patungo sa aking altar” kaysa “umakyat sa aking altar ...,” sapagkat iniiwasan nito ang posibleng pagkaunawang nasa altar mismo ang pag-akyat.
  terminology: Ang “altar” para sa מִזְבֵּחַ at “kahubaran” para sa עֶרְוָה ay angkop, tumpak, at may wastong antas ng paggalang. Hindi dapat tukuyin bilang mga pari ang kausap, dahil hindi iyon sinasabi ng talata.
