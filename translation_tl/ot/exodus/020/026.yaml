  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: tl
  text: Huwag kang umakyat sa pamamagitan ng mga baitang patungo sa aking altar, upang hindi malantad sa ibabaw nito ang iyong kahubaran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “baka malantad sa ibabaw nito ang iyong kahubaran.”
    reason: Ipinapakita ng “baka” ang alternatibong paraan ng pagsasalin sa panandang panglayon o pang-iwas na אֲשֶׁר לֹא, na katumbas ng “lest,” habang pinananatili ang tuwirang pagtukoy ng “nito” sa altar.
lexical_decisions:
- source_word: תַעֲלֶה
  choice: aakyat
  rationale: Karaniwang kahulugan ng עלה ang ‘umakyat.’ Kasama ng לֹא, malinaw nitong ipinapahayag ang pagbabawal sa natural na modernong Tagalog.
- source_word: בְמַעֲלֹת
  choice: sa pamamagitan ng mga baitang
  rationale: Ang מַעֲלוֹת ay tumutukoy sa mga baitang o hagdan. Nililinaw ng parirala ang paraan ng pag-akyat na ipinagbabawal.
- source_word: מִזְבְּחִי
  choice: aking altar
  rationale: Tuwirang salin ng מִזְבֵּחַ na may hulaping unang panauhang isahan; ang ‘altar’ ang karaniwan at madaling maunawaang katawagan sa Tagalog.
- source_word: אֲשֶׁר לֹא
  choice: upang hindi
  rationale: Sa kontekstong ito, ipinapakilala ng אֲשֶׁר לֹא ang layunin o ibinibigay na dahilan ng pagbabawal. Natural sa Tagalog ang ‘upang hindi’ at hindi nito labis na tinutukoy kung layunin o kinalabasan ang diin.
- source_word: תִּגָּלֶה
  choice: malantad
  rationale: Ang Niphal ng גלה ay nangangahulugang ‘malantad’ o ‘maalisan ng takip.’ Ang ‘malantad’ ay malinaw at angkop sa konteksto ng katawan.
- source_word: עֶרְוָתְךָ
  choice: iyong kahubaran
  rationale: Ang עֶרְוָה ay tumutukoy sa kahubaran, na may pahiwatig ng maseselang bahagi ng katawan. Pinananatili ng ‘kahubaran’ ang lawak at dignidad ng orihinal nang hindi nagpapakitid ng kahulugan.
- source_word: עָלָיו
  choice: doon
  rationale: Tumutukoy ang panghalip sa altar. Ang ‘doon’ ay natural sa Tagalog para sa pagkalantad na nangyayari sa ibabaw o harap ng altar, habang ang mas literal na ugnayan ay inilalahad sa talababa.
theological_decisions:
- issue: Dahilan ng pagbabawal sa paggamit ng mga baitang patungo sa altar
  choice: 'Inilalahad ang tahasang dahilan ng teksto: upang hindi malantad ang kahubaran ng umaakyat kaugnay ng altar.'
  alternative: Maaaring unawain ang pagbabawal bilang sagisag ng pagpapakumbaba sa harap ng Diyos o bilang tiyak na tuntunin dahil sa kasuotan ng mga pari.
  rationale: Kahubaran at pagkalantad ang tahasang binabanggit ng Hebreo. Hindi dapat idagdag sa salin ang simbolikong paliwanag o ipalagay ang isang tiyak na uri ng kasuotan na hindi sinasabi sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘baitang’ sa halip na mas kolokyal na ‘hagdan’ upang tukuyin nang wasto ang mga hakbang paakyat, at ‘kahubaran’ upang mapanatili ang dignidad at lawak ng Hebreo.
