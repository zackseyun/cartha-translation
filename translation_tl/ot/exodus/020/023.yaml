  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: tl
  text: Huwag kayong gumawa ng mga diyos na pilak na kasama ko[a], at huwag kayong gumawa para sa inyong mga sarili ng mga diyos na ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa tabi ko.” Literal sa Hebreo ang “kasama ko”; ang “sa tabi ko” ay isang interpretibong salin na nagdiriin sa pagbabawal sa mga karibal na diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: gagawa
  rationale: Ang עשה ay tumutukoy rito sa paggawa o paglikha ng mga bagay na sasambahin. Likas at tuwiran sa modernong Tagalog ang “gagawa.”
- source_word: אִתִּי
  choice: upang makasama ko
  rationale: Pinananatili nito ang literal na ugnayang “with me” ng Hebreo nang hindi agad ipinapasok ang mas interpretibong “katabi ko.”
- source_word: אֱלֹהֵי כֶסֶף
  choice: mga diyos na pilak
  rationale: Natural itong katumbas ng construct phrase na “mga diyos ng/pilak,” at malinaw na tumutukoy sa mga diyos na yari sa pilak.
- source_word: וֵאלֹהֵי זָהָב
  choice: mga diyos na ginto
  rationale: Pinananatili ang paralelismo sa “mga diyos na pilak” at ang materyal na tinutukoy ng Hebreo.
- source_word: לָכֶם
  choice: para sa inyong sarili
  rationale: Ipinapahayag nito ang personal na paglalaan o pag-aangkin na dala ng לָכֶם.
- source_word: לֹא ... לֹא
  choice: Huwag ... at huwag ...
  rationale: Ang inuulit na “huwag” ay malinaw at may bigat ng tuwirang pagbabawal sa natural na Tagalog.
theological_decisions:
- issue: Kung ang אִתִּי ay dapat isaling mas interpretibo bilang “katabi ko” upang idiin ang pagbabawal sa mga karibal na diyos
  choice: upang makasama ko
  alternative: katabi ko / kasama ko
  rationale: Literal na “with me” ang Hebreo. Pinananatili ng salin ang tunay na saklaw ng parirala at hinahayaang manggaling sa konteksto ang diwa ng eksklusibong pagsamba, sa halip na tahimik itong ipasok sa teksto.
translation_notes:
  register: Makabago, tuwiran, at marangal na Tagalog. Ginamit ang maramihang “kayo” ayon sa mga pandiwang nasa ikalawang panauhang maramihan sa Hebreo; pinanatili ang inuulit na pagbabawal at ang bahagyang di-karaniwang ugnayan ng אִתִּי, na nililinaw sa talababa.
