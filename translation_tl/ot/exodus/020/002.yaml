base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: tl
  text: “Ako si Yahweh,[a] ang iyong Diyos, na naglabas sa iyo mula sa lupain ng Ehipto, mula sa bahay ng mga alipin.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH, na kinaugaliang isalin bilang “ang PANGINOON”; dito ay isinalin bilang “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: O, sa mas idyomatikong pananalita, “mula sa bahay ng pagkaalipin.” Sa literal, “mula sa bahay ng mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Ako si
  rationale: Ang malayang panghalip na אָֽנֹכִי ay mariin. Sa natural na Tagalog, ang “Ako si” angkop sa taimtim na pagpapakilala sa sarili na sinusundan ng pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֱלֹהֶיךָ
  choice: ang iyong Diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, malinaw na iisa ang tinutukoy dito. Pinananatili ng “iyong” ang ikalawang panauhang isahan ng hulaping Hebreo.
- source_word: אֲשֶׁר
  choice: na
  rationale: Natural na nag-uugnay ang “na” sa Diyos at sa kasunod na sugnay tungkol sa ginawa niya.
- source_word: הוֹצֵאתִיךָ
  choice: naglabas sa iyo
  rationale: Ang Hiphil ng יצא ay nangangahulugang “maglabas” o “papalabasin.” Malinaw at tuwiran ang “naglabas sa iyo.”
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ng “mula sa” ang diwa ng pinagmulan at ng “lupain ng Ehipto” ang pormal na heograpikong parirala.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  rationale: Pinananatili nito ang kongkretong larawan at maramihang pangngalan ng Hebreong parirala, na literal na “bahay ng mga alipin,” habang malinaw sa konteksto na tumutukoy ito sa pagkaalipin sa Ehipto.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa teksto; ang transliterasyong “Yahweh” ay hindi nagpapalit dito ng isang titulo.
- issue: Kahulugan ng עֲבָדִים sa pagkaalipin ng Israel sa Ehipto
  choice: mga alipin
  alternative: mga lingkod; pagkaalipin
  rationale: Sapilitang paggawa at pagkakabihag ang konteksto, kaya mas tiyak ang “mga alipin” kaysa “mga lingkod.” Pinananatili rin nito ang kongkretong maramihang anyo ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang isahang “iyong” at “sa iyo” upang mapanatili ang bilang ng Hebreo. Iningatan ang magkatulad na “mula sa … mula sa …” at ang kongkretong larawan ng “bahay ng mga alipin.”
