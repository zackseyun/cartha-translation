  text: Nakatayo ang mga tao sa malayo, at lumapit si Moises sa makapal na kadiliman[a] na kinaroroonan ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “madilim na ulap” o “karimlan.” Ang salitang Hebreo ay maaaring tumukoy sa matinding kadilimang kaugnay ng pagpapakita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Nanatiling nakatayo
  rationale: Ipinahihiwatig ng pandiwa rito na ang mga tao ay pumuwesto at nanatili roon; natural itong Tagalog sa konteksto.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tumutukoy ito sa sambayanang nagkakatipon na binabanggit sa konteksto, nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: מֵרָחֹק
  choice: sa malayo
  rationale: Malinaw at likas na pahayag ito ng pisikal na agwat o pagkakahiwalay.
- source_word: נִגַּשׁ
  choice: lumapit
  rationale: Tuwirang katumbas ito ng paglapit o pagparoon nang malapit at angkop sa modernong Tagalog.
- source_word: הָעֲרָפֶל
  choice: makapal na kadiliman
  rationale: Pinananatili nito ang diwa ng siksik o matinding dilim at ang maringal, mahiwagang kalagayan ng pagpapakita ng Diyos, nang hindi ito nililimitahan sa isang ulap.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: na kinaroroonan ng Diyos
  rationale: Natural nitong ipinapahayag ang lugar ng presensiya ng Diyos nang hindi nagdaragdag ng paliwanag.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Sa konteksto, malinaw na tumutukoy ito sa Diyos ng Israel at ginagamit bilang pantanging katawagan.
theological_decisions:
- issue: Paglalarawan sa pagpapakita ng Diyos sa kadiliman
  choice: makapal na kadiliman
  alternative: madilim na ulap; karimlan
  rationale: Pinananatili ng salin ang kabalintunaan ng banal na presensiya ng Diyos na kaugnay ng pagkatago at hindi malapitan, sa halip na gawing meteorolohikal lamang o lubusang simboliko ang larawan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ngunit” upang maipakita ang paghahambing ng pananatili ng mga tao sa malayo at paglapit ni Moises, bagaman pang-ugnay na waw ang nasa Hebreo. Nasa pangunahing teksto ang panandang talababa [a].
