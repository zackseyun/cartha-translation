translation:
  language: tl
  text: Huwag kang mangalunya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Ang לֹא na kasama ng di-ganap na anyong pandiwa ay naghahayag ng tuwirang pagbabawal. “Huwag” ang likas at mariing anyo nito sa modernong Tagalog.
- source_word: תִּנְאָף
  choice: kang mangalunya
  rationale: Ang pandiwang נאף sa qal ay nangangahulugang gumawa ng pangangalunya. Ang “mangalunya” ang malinaw, maikli, at karaniwang katumbas sa Tagalog; ipinapakita ng “kang” na ang utos ay tuwirang nakatuon sa kausap.
theological_decisions:
- issue: Anyo ng pagbabawal sa Sampung Utos
  choice: Huwag kang mangalunya.
  alternative: Hindi ka mangangalunya.
  rationale: Bagaman maaaring tularan ng “Hindi ka mangangalunya” ang pormal na kayarian ng Hebreo, maaari itong marinig sa Tagalog bilang simpleng pahayag o hula. Mas natural at hindi malabo ang “Huwag kang mangalunya” bilang mariin at patuloy na umiiral na pagbabawal.
- issue: Saklaw ng panlalaking isahang anyo ng pandiwa
  choice: Pangkalahatang isahang kausap na “ka”
  alternative: Pananalitang tahasang para lamang sa lalaki
  rationale: Panlalaking isahan ang anyong Hebreo, ngunit kinakausap nito ang kasapi ng tipan bilang kinatawan. Hindi minamarkahan ng Tagalog na “ka” ang kasarian, kaya napapanatili nito ang tuwirang isahang pagtawag nang hindi nagdaragdag ng limitasyong para lamang sa lalaki.
translation_notes:
  register: Maikli, marangal, at tuwiran. Gumagamit ng likas na modernong Tagalog habang pinananatili ang bigat ng isang utos sa tipan.
