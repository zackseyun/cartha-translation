  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: tl
  text: At kung gagawa ka para sa akin ng altar na yari sa mga bato, huwag mo itong itayo gamit ang mga batong tinabas; sapagkat kapag itinaas mo sa ibabaw nito ang iyong tabak[a], malalapastangan mo ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa kontekstong ito, maaaring tumukoy ang “tabak” sa isang kasangkapang metal na ginagamit sa pagtapyas o paghubog ng mga bato.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyong ipinahihiwatig ng אִם, bilang pagpapatuloy ng naunang tagubilin.
- source_word: מִזְבַּח אֲבָנִים
  choice: altar na yari sa mga bato
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag ang altar na binubuo ng mga bato.
- source_word: תַּעֲשֶׂה לִּי
  choice: gagawa ka para sa akin
  rationale: Pinananatili ang datibong לִי nang hindi dinaragdagan ang kahulugan.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: huwag mo itong itayo gamit ang mga batong tinabas
  rationale: Ang pagbabawal ay natural na ipinahayag sa Tagalog; ang גָּזִית ay mga batong hinugis o tinabas. Ang 'ito' ay tumutukoy sa altar, gaya ng lohika ng pangungusap.
- source_word: חַרְבְּךָ
  choice: iyong tabak
  rationale: Pinananatili ang tahasang salitang Hebreo para sa 'tabak' sa halip na palitan ito sa pangunahing teksto ng interpretatibong 'kasangkapang metal.'
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: iwinasiwas mo rito
  rationale: Inihahatid ang aktibong pag-angat o paggamit ng tabak laban sa bato habang pinananatili ang matingkad na larawan ng Hebreo.
- source_word: וַתְּחַלְלֶהָ
  choice: malalapastangan mo ito
  rationale: 'Ipinahahayag ang kultiko at kabanalang diwa ng חלל: ang paggawang hindi banal o paglapastangan sa altar.'
theological_decisions:
- issue: Dahilan at uri ng paglapastangan sa altar
  choice: Pinananatiling tahasan na ang paggamit ng tabak sa mga bato ang magpapalapastangan sa altar.
  alternative: Maaaring ipaliwanag ito bilang pagbabawal sa anumang kasangkapang metal, sa karahasan, o sa marangyang pagkakayari.
  rationale: Tahasan sa talata ang tabak at ang paglapastangan, ngunit hindi nito ganap na ipinapaliwanag kung bakit; kaya hindi inilalagay sa salin ang isang tiyak na simboliko o ritwal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang karaniwang biblikal na salitang “altar” dahil mas natural at mas madaling makilala kaysa sa mas teknikal o di-gaanong karaniwang kapalit. Ang “malalapastangan” ay nagpapanatili sa diwa ng paglapastangan sa isang banal na bagay.
