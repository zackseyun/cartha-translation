  text: You shall not bear false witness against your neighbor[a].
translation:
  language: tl
  text: Huwag kang magbigay ng maling patotoo laban sa kapwa mo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kang sumaksi nang hindi totoo laban sa kapwa mo.”
    reason: Ipinapakita ang pandiwang salin ng legal na parirala at ang leksikal na alternatibo para sa תַעֲנֶה.
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Karaniwang anyo ng tuwirang pagbabawal sa makabagong Tagalog at angkop sa ikalawang panauhan ng utos.
- source_word: תַעֲנֶה
  choice: magbigay ng ... patotoo
  rationale: Sa kontekstong legal, ang pandiwa ay tumutukoy sa pagsagot o pagsaksi bilang saksi. Likas sa Tagalog ang pariralang “magbigay ng patotoo,” at naipapahayag nito ang hudisyal na diwa nang hindi makaluma.
- source_word: בְרֵעֲךָ
  choice: laban sa kapwa mo
  rationale: Sa kontekstong hudisyal, ipinahihiwatig ng pang-ukol na ang patotoo ay nakapipinsala o nakatuon laban sa ibang tao. Ang “kapwa mo” ay natural at malawak na katumbas ng רֵעַ.
- source_word: עֵד
  choice: patotoo
  rationale: Bagaman maaari itong tumukoy sa isang saksi, sa pariralang ito ay natural na naihahatid sa Tagalog bilang nilalaman o gawa ng pagpapatotoo.
- source_word: שָׁקֶר
  choice: maling
  rationale: Ipinahihiwatig ng salita ang kabulaanan o pandaraya. Sa pariralang “maling patotoo,” malinaw at karaniwan ang kahulugang patotoong hindi totoo.
theological_decisions:
- issue: Saklaw ng pagbabawal
  choice: Pinanatili ang tahasang wikang hudisyal tungkol sa patotoo.
  alternative: Palawakin ang teksto bilang pangkalahatang pagbabawal sa lahat ng uri ng pagsisinungaling.
  rationale: Ang mismong pariralang Hebreo ay tumutukoy sa saksi o patotoo laban sa kapwa. Hindi dapat ipasok sa salin ang mas malawak na aplikasyon, bagaman maaaring mahango iyon sa pagpapakahulugan.
translation_notes:
  register: Makabago, tuwiran, at marangal ang pananalita. Ginamit ang “kapwa mo” sa halip na mas makitid na “kapitbahay mo,” at iniwasan ang mas makalumang ayos na “huwag kang sasaksi ng kasinungalingan.”
