base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: tl
  text: Sinabi nila kay Moises, “Ikaw ang magsalita sa amin, at makikinig kami[a]. Ngunit huwag magsalita sa amin ang Diyos, baka mamatay kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maririnig namin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pakikinig nang mabuti o sa pakikinig na may kasamang pagtugon at pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Sinabi nila kay Moises
  rationale: Likas na pasalaysay na Filipino para sa wayyiqtol at sa direksiyonal na אֶל; sapat nang ipinahihiwatig ng ayos ng pangungusap ang pagpapatuloy ng salaysay.
- source_word: דַּבֵּר אַתָּה עִמָּנוּ
  choice: Ikaw ang makipag-usap sa amin
  rationale: 'Pinananatili ng “Ikaw ang” ang diin sa tahasang panghalip: si Moises, hindi ang Diyos, ang nais nilang magsalita. Ang “makipag-usap sa amin” ay likas at pinananatili ang diwang kaugnayan ng עִם.'
- source_word: וְנִשְׁמָעָה
  choice: at makikinig kami
  rationale: Ipinapahayag ang kohortatibo o kusang tugon bilang pangakong makikinig; maaari ring saklawin ng pandiwang Hebreo ang masunuring pagtugon.
- source_word: וְאַל־יְדַבֵּר עִמָּנוּ
  choice: Ngunit huwag makipag-usap sa amin
  rationale: Ang אַל kasama ng imperfect ay nagdadala ng pagbabawal o jussive na diwa; malinaw na inilalahad ng “Ngunit” ang pagsalungat sa naunang kahilingan.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal, isahan ang pandiwa at ang tinutukoy sa konteksto ay ang Diyos ng Israel.
- source_word: פֶּן נָמוּת
  choice: baka kami ay mamatay
  rationale: Ang פֶּן ay nagpapakilala ng kinatatakutang bunga. Ang “baka” ay natural sa makabagong Filipino at pinananatili ang posibilidad na kinatatakutan, nang hindi ito ginagawang tiyak na resulta.
theological_decisions:
- issue: Bilang at tinutukoy ng אֱלֹהִים
  choice: ang Diyos (isahan)
  alternative: mga diyos
  rationale: Itinuturo ng konteksto sa Sinai at ng isahang anyo ng pandiwa na ang Diyos ng Israel ang tinutukoy; pasyang gramatikal at kontekstuwal ito.
- issue: Saklaw ng וְנִשְׁמָעָה
  choice: makikinig kami
  alternative: maririnig namin / susunod kami
  rationale: Pinananatili ng “makikinig” ang posibleng saklaw mula sa maingat na pagdinig hanggang sa tumutugong pagsunod, sa halip na limitahan ito sa pandinig lamang o gawing tahasang pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Ikaw ang” upang madama ang diin ng Hebreo, at “makipag-usap” upang natural na maipahayag ang עִם (“kasama/kausap”), nang hindi nagiging lipas o labis na pormal.
