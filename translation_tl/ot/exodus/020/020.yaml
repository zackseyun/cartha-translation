  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל הָ/עָם֮ אַל תִּירָאוּ֒ כִּ֗י לְ/בַֽ/עֲבוּר֙ נַסּ֣וֹת אֶתְ/כֶ֔ם בָּ֖א הָ/אֱלֹהִ֑ים וּ/בַ/עֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛/וֹ עַל פְּנֵי/כֶ֖ם לְ/בִלְתִּ֥י תֶחֱטָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: tl
  text: Sinabi ni Moises sa bayan, “Huwag kayong matakot[a], sapagkat naparito ang Diyos upang subukin kayo, at upang ang takot sa kanya[c] ay nasa harapan ninyo[b], upang hindi kayo magkasala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Huwag kayong mangamba.” Iisang salitang-ugat ng takot ang ginamit dito at sa “takot sa kanya” sa bandang huli ng talata, kaya may sinadyang paghahambing sa pagitan ng sindak at wastong takot sa Diyos.
    reason: lexical_alternative
  - marker: b
    text: Literal na “sa ibabaw ng inyong mga mukha,” isang idyoma para sa isang bagay na laging nasa harap ng tao o nananatili sa kanyang kamalayan.
    reason: cultural_note
  - marker: c
    text: Maaari ring “pagpipitagan sa kanya.” Ang pangngalang Hebreo ay maaaring tumukoy sa takot na may mapitagang paghanga, gayundin sa pangamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Huwag kayong matakot
  rationale: Ang pandiwang ירא ay maaaring tumukoy sa takot, pangamba, o pagpipitagan ayon sa konteksto. Pinananatili ng “matakot” ang sinadyang ugnayan nito sa יִרְאָתוֹ (“takot sa kanya”) sa hulihan ng talata.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: upang subukin kayo
  rationale: Ipinapahayag ng לְבַעֲבוּר ang layunin, at ang נסה ay nangangahulugang sumubok o magsuri. Ang “subukin” ay malinaw at hindi nagpapahiwatig na hinihikayat ng Diyos ang kasamaan.
- source_word: בָּא הָאֱלֹהִים
  choice: naparito ang Diyos
  rationale: Ipinahihiwatig ng qatal na בָּא ang pagdating ng Diyos na may kasalukuyang kabuluhan sa tagpo sa Sinai. Likas sa Filipino ang “naparito” para sa pagdating sa kinaroroonan ng bayan.
- source_word: יִרְאָתוֹ
  choice: ang takot sa kanya
  rationale: Maaaring mangahulugan ang יִרְאָה ng takot o mapitagang paghanga. Pinananatili ng “takot” ang leksikal at teolohikal na tensiyon sa utos na “Huwag kayong matakot,” sa halip na agad itong ipaliwanag bilang pagpipitagan lamang.
- source_word: עַל־פְּנֵיכֶם
  choice: manatili sa harapan ninyo
  rationale: Literal itong “sa ibabaw ng inyong mga mukha,” ngunit isa itong idyoma para sa isang bagay na palaging nasa harap o kamalayan ng tao. Inihahatid ng salin ang diwa nang hindi gumagamit ng alanganing literal na pananalita.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: nang hindi kayo magkasala
  rationale: 'Malinaw at natural na ipinapahayag nito ang negatibong layunin ng konstruksiyon: upang maiwasan nilang magkasala.'
theological_decisions:
- issue: Ang wari'y tensiyon sa pagitan ng “Huwag kayong matakot” at “ang takot sa kanya”
  choice: Panatilihin ang salitang-ugat na “takot” sa dalawang bahagi ng pangunahing teksto.
  alternative: Isalin ang una bilang “Huwag kayong mangamba” at ang ikalawa bilang “pagpipitagan sa kanya.”
  rationale: Iisang salitang-ugat ng takot ang ginamit sa Hebreo upang pag-ibahin ang ipinagbabawal na sindak at ang wastong takot sa Diyos. Hindi dapat tahimik na lutasin ng salin ang sinadyang tensiyong ito.
- issue: Ang likas ng pagsubok ng Diyos
  choice: Isalin ang נַסּוֹת bilang “subukin” nang walang idinagdag na moral na paliwanag.
  alternative: “suriin” o “patunayan”
  rationale: Ipinakikita ng konteksto na sinusubok ang bayan upang hindi sila magkasala; hindi sinasabi ng teksto na tinutukso sila ng Diyos na gumawa ng masama.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” bilang kolektibong katumbas ng הָעָם at pinanatili ang pag-uulit ng “takot” upang maipakita ang retorikal at teolohikal na tensiyon ng Hebreo.
