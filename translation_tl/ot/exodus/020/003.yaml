  text: You shall have no other gods before me[a].
translation:
  language: tl
  text: Huwag kang magkaroon ng ibang mga diyos sa harap ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “bukod sa akin” o “sa aking presensiya.” Literal sa Hebreo: “sa harap ng aking mukha.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Likas na paraan sa modernong Tagalog upang ipahayag ang tuwirang pagbabawal.
- source_word: יִהְיֶה לְךָ
  choice: kang magkaroon
  rationale: Bagaman literal na tumutukoy sa pagiging o pag-iral “para sa iyo,” ang buong konstruksiyon ay natural na nagpapahayag ng pagkakaroon; pinananatili rin ng “ka” ang isahang kausap.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang ipinapahayag ang maramihang mga karibal na diyos nang hindi dinaragdagan ng kahulugang “dayuhan,” na hindi tahasang nasa Hebreo.
- source_word: עַל פָּנָי
  choice: sa harap ko
  rationale: Malapit sa literal na “sa harap ng aking mukha” at pinananatili ang posibleng saklaw na presensiya at pagiging bukod-tangi, sa halip na pumili lamang ng isang interpretasyon.
theological_decisions:
- issue: Kahulugan ng עַל פָּנָי sa unang utos
  choice: sa harap ko
  alternative: bukod sa akin; sa aking presensiya
  rationale: Maaaring ipahiwatig ng idyomang Hebreo ang pagiging nasa presensiya ng Diyos at, sa kontekstong tipan, ang eksklusibong katapatan sa kanya. Pinananatili ng pangunahing salin ang tensiyong ito, at inilalagay sa talababa ang mga lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Huwag kang magkaroon” bilang likas na anyo ng pagbabawal at ang “sa harap ko” upang mapanatili ang idyomang Hebreo at ang tunay na interpretatibong lawak nito.
