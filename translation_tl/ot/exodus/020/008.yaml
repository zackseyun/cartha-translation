  text: זָכ֛וֹר אֶת י֥וֹם הַ/שַּׁבָּ֖ת לְ/קַדְּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: tl
  text: Alalahanin mo ang araw ng Sabbath upang panatilihin itong banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang pabanalin ito” o “upang italaga ito bilang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Alalahanin mo
  rationale: Ang Qal imperative na isahan ay nag-uutos ng aktibong pag-alaala. Pinananatili ng “Alalahanin mo” ang tuwirang utos at ang bigat nito sa konteksto ng tipan.
- source_word: אֶת
  choice: '[pananda ng tiyak na layon, hindi isinalin]'
  rationale: Minamarkahan nito sa Hebreo ang tiyak na tuwirang layon at hindi nangangailangan ng hiwalay na katumbas sa Tagalog.
- source_word: יוֹם
  choice: araw
  rationale: Ito ang karaniwan at tuwirang kahulugan ng יוֹם.
- source_word: הַשַּׁבָּת
  choice: ang araw ng Sabbath
  rationale: Tumutukoy ito sa tiyak na araw ng pamamahinga na kinikilala sa tipan. Ang “Sabbath” ay malinaw at nakaugat na katawagang biblikal sa modernong Tagalog.
- source_word: לְקַדְּשׁוֹ
  choice: upang panatilihin itong banal
  rationale: 'Ang infinitive construct na may hulaping panlalaking isahan mula sa קדשׁ ay nagpapahayag ng layunin: alalahanin ang araw sa paraang itinuturing at iniingatan itong banal. Likas sa Tagalog ang pangunahing salin, habang ang talababa ay nagpapanatili sa maaaring mas aktibong diwang “pabanalin” o “italaga bilang banal.”'
theological_decisions:
- issue: Paglalarawan sa pagkabanal ng Sabbath sa salitang mula sa קדשׁ
  choice: upang panatilihin itong banal
  alternative: upang pabanalin ito; upang italaga ito bilang banal
  rationale: Hindi lamang pangkaraniwang paggunita o ritwal na pagsunod ang ipinahihiwatig ng Hebreo kundi ang pagtrato sa araw bilang banal at bukod-tangi. Ang pangunahing salin ay natural at malinaw, samantalang pinananatili sa talababa ang tunay na lawak ng pandiwang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Sabbath” bilang kinikilalang katawagang biblikal; iniwasan ang pagpapakahulugang nakatali sa isang denominasyon.
