  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: tl
  text: ngunit nagpapakita ako ng tapat na pag-ibig sa libu-libo[a], sa mga umiibig sa akin at tumutupad sa aking mga utos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa isang libong salinlahi.” Ihambing sa Deuteronomio 5:10; “sa libu-libo” lamang ang tahasang mababasa sa Hebreo rito.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: ngunit nagpapakita ako
  rationale: Ang participle ay nagpapatuloy sa paglalarawan ng ginagawa ng Diyos, samantalang ipinahihiwatig ng וְ ang pagsalungat sa hatol na binanggit sa naunang talata. Likas sa Filipino ang tahasang unang panauhan dahil sa kasunod na mga hulaping 'akin/aking'.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Sinasaklaw nito ang matatag, mapagkalinga, at tipanang katapatan ng חֶסֶד nang hindi ito nililimitahan sa awa lamang.
- source_word: לַאֲלָפִים
  choice: sa libu-libo
  rationale: Literal na 'sa mga libo' ang Hebreo at walang tahasang salitang 'salinlahi' sa talatang ito. Pinananatili ng salin ang tunay na di-tiyak na saklaw.
- source_word: לְאֹהֲבַי
  choice: sa mga umiibig sa akin
  rationale: Natural na isinasalin ang participle na may hulaping unang panauhan bilang pariralang tumutukoy sa mga patuloy na umiibig sa Diyos.
- source_word: וּלְשֹׁמְרֵי
  choice: at tumutupad
  rationale: Kapag mga utos ang layon, ang שׁמר ay nangangahulugang sundin o tuparin; ang 'tumutupad' ay dignified at karaniwang gamit sa modernong Filipino.
- source_word: מִצְוֺתָי
  choice: sa aking mga utos
  rationale: Pinananatili nito ang legal at tipanang diwa ng מִצְוָה sa konteksto ng Sampung Utos.
theological_decisions:
- issue: Saklaw ng לַאֲלָפִים
  choice: sa libu-libo
  alternative: hanggang sa ikasanlibong salinlahi / sa libu-libong salinlahi
  rationale: Walang tahasang 'salinlahi' sa Hebreo ng talatang ito. Hindi ito idinaragdag sa pangunahing teksto, ngunit itinatala sa talababa ang karaniwang interpretasyon batay sa paghahambing sa Deuteronomio 5:10.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'ngunit' upang ihayag ang kontekstuwal na pagsalungat sa naunang hatol, at em dash upang luminaw na ang 'mga umiibig' ang tinutukoy ng 'libu-libo' nang hindi nagdaragdag ng 'salinlahi' sa pangunahing teksto.
