base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: tl
  text: Ngunit ang ikapitong araw ay Sabbath para kay Yahweh, ang iyong Diyos; huwag kang gagawa ng anumang gawain—ikaw, ang iyong anak na lalaki o anak na babae, ang iyong aliping lalaki o aliping babae, ang iyong mga alagang hayop, o ang dayuhang naninirahan sa iyong mga pintuang-bayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: Ngunit ang ikapitong araw
  rationale: Maaaring mangahulugang “at” ang וְ, ngunit malinaw dito ang pagsalungat sa anim na araw ng paggawa sa naunang talata; natural sa Tagalog ang “ngunit.”
- source_word: שַׁבָּת
  choice: Sabbath
  rationale: Pinananatili ang katawagang Hebreo bilang pangalan ng araw na inilaan sa pamamahinga, sa halip na paliitin ito sa parapraseng “araw ng pahinga.”
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Ipinahahayag ng לְ ang paglalaan o natatanging kaugnayan ng araw kay Yahweh; ang “para kay” ay malinaw at natural sa Tagalog.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: huwag kang gagawa ng anumang gawain
  rationale: Ang לֹא kasama ng imperfect sa batas ay tuwirang pagbabawal. Ipinapanatili ng “anumang gawain” ang malawak na saklaw ng כָל מְלָאכָה.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: ang iyong aliping lalaki o aliping babae
  rationale: Tapat na ipinakikita ng “alipin” ang nakagapos na katayuang panlipunan ng pares na עֶבֶד at אָמָה, nang hindi ito pinalalambot bilang karaniwang katulong.
- source_word: וּבְהֶמְתֶּךָ
  choice: ang iyong mga alagang hayop
  rationale: Tumutukoy ang kolektibong בְּהֵמָה sa mga domestikadong hayop ng sambahayan; mas madaling maunawaan sa modernong Tagalog ang “mga alagang hayop.”
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: ang dayuhang naninirahan sa loob ng iyong mga pintuang-bayan
  rationale: Ang גֵּר ay isang hindi katutubong naninirahan sa pamayanan, hindi lamang panandaliang bisita. Ang “mga pintuang-bayan” ay nagpapanatili sa sinaunang larawan at tumutukoy sa nasasakupang pamayanan.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng utos tungkol sa Sabbath
  choice: Tahasang isama ang mga anak, alipin, hayop, at dayuhang naninirahan
  alternative: Ibuod sila bilang buong sambahayan
  rationale: Isa-isang binabanggit ng Hebreo ang mga nasa ilalim ng sambahayan upang ipakitang hindi lamang ang pinatutungkulan na puno ng sambahayan ang saklaw ng pagbabawal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sabbath” bilang kinikilalang terminong biblikal, “alipin” upang hindi pagtakpan ang sinaunang katayuang panlipunan, at “pintuang-bayan” upang mapanatili ang historikal na larawan ng sakop na pamayanan.
