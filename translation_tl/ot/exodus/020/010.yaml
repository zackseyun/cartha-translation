  to: Ngunit ang ikapitong araw ay Sabbath para kay Yahweh, ang iyong Diyos; huwag kang gagawa ng anumang gawain—ikaw, ang iyong anak na lalaki o anak na babae, ang iyong aliping lalaki o aliping babae, ang iyong mga alagang hayop, o ang dayuhang naninirahan sa iyong mga pintuang-bayan.
