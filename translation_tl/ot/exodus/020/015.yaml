translation:
  language: tl
  text: Huwag kang magnakaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Hindi ka magnanakaw.”
    reason: Alternatibong anyo na mas malapit sa pormal na kayarian ng Hebreo, bagaman hindi gaanong tuwirang utos ang dating sa modernong Tagalog.
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Ang לֹא na sinusundan ng anyong imperfect ay naghahayag dito ng tuwirang pagbabawal. Ang “Huwag” ang natural at malinaw na katumbas nito sa modernong Tagalog.
- source_word: תִּגְנֹב
  choice: kang magnakaw
  rationale: Ito ang Qal imperfect, ikalawang panauhang panlalaki na isahan, ng גנב. Malawak at karaniwan ang kahulugang “magnakaw.” Maaari itong tumukoy sa pagdukot sa ilang konteksto, ngunit walang layon o ibang pahiwatig sa talatang ito na naglilimita sa utos sa pagnanakaw ng tao.
theological_decisions:
- issue: Anyo ng pagbabawal sa Sampung Utos
  choice: Huwag kang magnakaw.
  alternative: Hindi ka magnanakaw.
  rationale: Ang Hebreong לֹא + imperfect ay isang tuwirang pagbabawal sa konteksto ng batas ng tipan. Ang “Huwag kang” ay natural, marangal, at malinaw sa modernong Tagalog; ang “Hindi ka magnanakaw” ay mas pormal ang tunog ngunit maaari ring mabasa bilang simpleng pahayag o hula.
translation_notes:
  register: Maikli, tuwiran, at marangal ang pananalita, alinsunod sa maigsi at legal na estilo ng Dekalogo. Ginamit ang pang-isahang “kang” dahil ikalawang panauhang isahan ang pandiwang Hebreo.
