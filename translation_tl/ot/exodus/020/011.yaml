source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: tl
  text: Sapagkat sa loob ng anim na araw ay ginawa ni Yahweh ang langit at ang lupa, ang dagat, at ang lahat ng nasa mga ito. Nagpahinga siya sa ikapitong araw.[a] Kaya binasbasan ni Yahweh ang araw ng Sabbath at ginawa niya itong banal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumigil siya” sa ikapitong araw. Maaaring idiin ng pandiwang Hebreo ang pamamahinga o ang pagtigil sa gawain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita nito na ang talata ang nagbibigay ng batayan para sa naunang utos tungkol sa Sabbath.
- source_word: שֵׁשֶׁת יָמִים
  choice: sa loob ng anim na araw
  rationale: Natural itong pahayag sa modernong Tagalog para sa yugto ng panahong saklaw ng paggawa.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Ang malawak na pandiwang Hebreo ay tumutukoy rito sa malikhaing paggawa ng Diyos at tuwirang sinusundan ng mga bagay na ginawa niya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הַשָּׁמַיִם
  choice: ang langit
  rationale: Sa Tagalog, karaniwang ginagamit ang pang-isahang kolektibong “langit” para sa Hebreong anyong maramihan sa pormulang “langit at lupa.”
- source_word: הָאָרֶץ
  choice: ang lupa
  rationale: Sa pagkakatambal nito sa langit sa konteksto ng paglikha, tumutukoy ito sa daigdig, hindi lamang sa isang lupain.
- source_word: הַיָּם
  choice: ang dagat
  rationale: Tinutularan nito ang pang-isahang anyo ng Hebreo at natural sa Tagalog.
- source_word: כָּל אֲשֶׁר בָּם
  choice: ang lahat ng naroroon
  rationale: Komprehensibong saklaw nito ang lahat ng nasa langit, lupa, at dagat, nang hindi mabigat ang pag-uulit sa Tagalog.
- source_word: וַיָּנַח
  choice: nagpahinga siya
  rationale: Ito ang natural na salin sa konteksto ng Sabbath; maaari rin nitong ipahiwatig ang pagtigil sa gawain, kaya inilalahad ang alternatibo sa talababa.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Ito ang karaniwang paraan sa Tagalog upang tukuyin kung kailan naganap ang kilos.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Malinaw at natural nitong ipinahahayag ang konklusyong nagmumula sa huwaran ng paglikha.
- source_word: בֵּרַךְ
  choice: binasbasan
  rationale: Karaniwang salin ito ng pagkakaloob ng Diyos ng pagpapala sa araw.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: ginawa niya itong banal
  rationale: 'Malinaw nitong ipinahahayag ang causative sense: ibinukod o itinalaga ng Diyos ang araw bilang banal.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi nagpapalit ng pangalan ng isang titulo.
- issue: Paglalarawan sa ginawa ng Diyos sa ikapitong araw
  choice: nagpahinga siya
  alternative: tumigil siya
  rationale: Kapuwa sinusuportahan ng pandiwang נוח ang pamamahinga at ang paghinto sa gawain. Pinili ang natural na “nagpahinga” sa konteksto ng Sabbath, ngunit pinanatili sa talababa ang tunay na leksikal na alternatibo nang hindi ipinahihiwatig na napagod ang Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang tradisyonal ngunit nauunawaang “Sabbath,” at inilagay ang talababa kaagad pagkatapos ng pariralang tinutukoy nito.
