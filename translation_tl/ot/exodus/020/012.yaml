base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: tl
  text: Igalang mo ang iyong ama at ang iyong ina, upang humaba ang iyong mga araw[b] sa lupaing ibinibigay sa iyo ni Yahweh, ang iyong Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ibabaw ng lupain.” Literal na may diwang “sa ibabaw ng” ang pang-ukol sa Hebreo, ngunit likas na ipinahahayag ito sa Tagalog bilang “sa lupain.”
    reason: lexical_alternative
  - marker: b
    text: Ang “humaba ang iyong mga araw” ay idyomang Hebreo na nangangahulugang mabuhay nang matagal.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: Igalang mo
  rationale: Ang Piel na pautos ng כבד ay humihiling na kilalanin at pakitunguhan ang mga magulang bilang marangal at mahalaga. Ang “igalang” ay natural sa modernong Tagalog at mas malakas kaysa sa simpleng paggalang sa opinyon o damdamin lamang.
- source_word: אָבִיךָ וְאֶת־אִמֶּךָ
  choice: ang iyong ama at ang iyong ina
  rationale: Tuwiran at natural na salin ng magkatambal na mga katawagan sa magulang, kasama ang isahang panlalaking ikalawang panauhan sa Hebreo.
- source_word: לְמַעַן
  choice: upang
  rationale: Maikli at likas na ipinapahayag ang layunin o bunga nang hindi ipinapasya nang labis ang ugnayan ng utos at pangako.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: humaba ang iyong mga araw
  rationale: Pinananatili ang Hebreong idyoma at ang biblikal na larawan nito; ipinaliliwanag sa talababa na tumutukoy ito sa mahabang buhay.
- source_word: עַל הָאֲדָמָה
  choice: sa lupain
  rationale: Sa konteksto, ang אֲדָמָה ay ang lupaing ibinibigay ng Diyos sa Israel, hindi lamang lupa o putik. Ang “sa” ay natural sa Tagalog at maaaring tumumbas sa diwang “sa” o “sa ibabaw ng” ayon sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang salin ng pangngalang may hulaping tumutukoy sa ikalawang panauhan; pinananatili ang tuwirang pakikipag-usap sa Israel.
- source_word: נֹתֵן לָךְ
  choice: ibinibigay sa iyo
  rationale: Pinananatili ang aspektong nagpapatuloy o nalalapit ng participle נֹתֵן at naaangkop sa tagpong hindi pa lubusang inaangkin ng Israel ang lupain.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pinapalitan ng titulong maaaring magkubli sa pagkakakilanlan nito bilang pangalang tipan.
- issue: Saklaw ng הָאֲדָמָה sa pangako
  choice: lupain
  alternative: lupa; daigdig
  rationale: Itinuturo ng konteksto at ng pariralang “ibinibigay sa iyo” ang lupaing ibinibigay ng Diyos sa Israel. Hindi idinaragdag ang salitang “ipinangako” sapagkat wala iyon sa mismong talata.
- issue: Ugnayan ng utos at mahabang buhay
  choice: upang humaba ang iyong mga araw
  alternative: at mabubuhay ka nang matagal
  rationale: Pinananatili ng “upang” ang maaaring diwa ng layunin o bunga sa לְמַעַן at iniiwasang gawing payak na mekanikal na garantiya ang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang Hebreong idyoma tungkol sa “mga araw,” ngunit nilinaw ito sa talababa. Ginamit ang “lupain” upang ipakita ang historikal at tipanang konteksto nang hindi nagdaragdag ng “ipinangakong lupain.”
