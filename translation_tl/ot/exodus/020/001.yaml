  text: 'At sinabi ng Diyos ang lahat ng salitang ito:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At sinabi
  rationale: Likas na salin ng wayyiqtol na nag-uugnay sa naunang salaysay at nagpapakilala sa mismong pahayag ng Diyos.
- source_word: אֱלֹהִים
  choice: ng Diyos
  rationale: Karaniwang modernong Tagalog para sa pagtukoy sa Diyos ng Israel sa kontekstong ito.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: ang lahat ng salitang ito
  rationale: Pinananatili ang lawak ng כָּל at ang kongkretong diwa ng דְּבָרִים bilang mga salitang kasunod na binigkas.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitive na nagpapakilala sa tuwirang pananalita ay natural na naipahahayag sa modernong Tagalog sa pamamagitan ng tutuldok, nang hindi inuulit ang 'sinabi'.
theological_decisions: []
translation_notes:
