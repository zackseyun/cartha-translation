  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: tl
  text: Huwag kang yuyukod sa mga iyon[a] ni maglilingkod sa mga iyon[b], sapagkat ako, si Yahweh na iyong Diyos, ay Diyos na mapanibughuin. Dinadalaw ko ang kasamaan ng mga ama sa mga anak, sa ikatlo at sa ikaapat na salinlahi ng mga napopoot sa akin.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapatirapa sa mga iyon”; tumutukoy ang pandiwang Hebreo sa pagyukod o pagpapatirapa bilang pagpipitagan.
    reason: lexical_alternative
  - marker: b
    text: O “sasamba sa mga iyon”; sa kontekstong ito, ang “maglingkod” ay maaaring tumukoy sa paglilingkod na panrelihiyon sa mga diyus-diyosan.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “dinadalaw ang kasamaan ng mga ama sa mga anak.” Pinananatili rito ang idyomang Hebreo; ihambing ang Deuteronomio 24:16 at Ezekiel 18 tungkol sa pananagutan ng bawat tao.
    reason: cross_reference
  - marker: d
    text: Maaari ring isalin, “hanggang sa ikatlo at ikaapat na salinlahi ng mga napopoot sa akin.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: yuyukod
  rationale: Pinananatili nito ang kongkretong kilos ng pagyukod bilang pagpipitagan at hindi agad ipinapantay sa mas malawak na salitang “sumamba.”
- source_word: תָעָבְדֵם
  choice: maglilingkod
  rationale: Pinananatili ang leksikal na kaibahan sa naunang pandiwa; sa konteksto ng mga diyus-diyosan, tumutukoy ito sa paglilingkod na panrelihiyon o pagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֵל קַנָּא
  choice: Diyos na mapanibughuin
  rationale: Ipinahahayag nito ang matuwid at bukod-tanging pag-angkin ng Diyos sa katapatan ng kanyang bayan at ang hindi niya pagtanggap sa karibal na pagsamba.
- source_word: פֹּקֵד
  choice: Dinadalaw ko
  rationale: Pinananatili ang Hebreong idyoma at ang saklaw nito ng aktibong pagsusuri at makatarungang pagtugon, nang hindi ito nililimitahan agad sa “pinarurusahan.”
- source_word: עֲוֺן
  choice: kasamaan
  rationale: Natural sa modernong Tagalog at pinananatili ang moral na bigat ng salita, na maaari ring sumaklaw sa sala at bunga nito.
- source_word: אָבֹת
  choice: mga ama
  rationale: Pinananatili ang tahasang panlalaking anyo ng Hebreo sa pormulang ito.
- source_word: בָּנִים
  choice: mga anak
  rationale: Ang salita ay maaaring mangahulugang mga anak o inapo; “mga anak” ang likas at malawak na katumbas sa pormulang salinlahi.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: hanggang sa ikatlo at ikaapat na salinlahi
  rationale: Ginagawang malinaw sa Tagalog ang eliptikong pagtukoy ng Hebreo sa magkakasunod na salinlahi.
- source_word: לְשֹׂנְאָי
  choice: ng mga napopoot sa akin
  rationale: Natural na inilalarawan ang mga salinlahing nagpapatuloy sa pagtanggi sa Diyos, habang pinananatili ang matinding puwersang relational ng “napopoot.”
theological_decisions:
- issue: Paglalarawan sa banal na paninibugho
  choice: Diyos na mapanibughuin
  alternative: Diyos na masigasig
  rationale: Sa konteksto ng pagbabawal sa idolatriya, mas malinaw na pinananatili ng “mapanibughuin” ang nararapat at bukod-tanging pag-angkin ng Diyos sa katapatan, sa halip na pahinain ito bilang karaniwang kasigasigan.
- issue: Pagpapahayag ng hatol sa magkakasunod na salinlahi
  choice: Dinadalaw ko ang kasamaan ng mga ama sa kanilang mga anak, hanggang sa ikatlo at ikaapat na salinlahi ng mga napopoot sa akin
  alternative: Pinarurusahan ko ang mga anak dahil sa mga kasalanan ng kanilang mga ama hanggang sa ikatlo at ikaapat na salinlahi
  rationale: Pinananatili ng salin ang Hebreong idyoma at ang tunay na tensiyong teolohikal nito nang hindi pinakikitid ang kahulugan sa isang mas tiyak na paliwanag kaysa sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang isahang “ka/iyo” dahil isahang panlalaki ang kausap sa Hebreo. Pinanatili ang pangalang Yahweh, ang kongkretong pagkakaiba ng pagyukod at paglilingkod, at ang Hebreong idyoma tungkol sa pagdalaw ng kasamaan.
