  source_fidelity: Tumpak ang pangunahing paghahatid ng pagbabawal sa pagyukod at paglilingkod, ng pangalang Yahweh, at ng Hebreong idyoma tungkol sa pagdalaw ng kasamaan. Gayunman, ang “hanggang sa” sa pangunahing teksto ay mas madaling magpahiwatig ng saklaw o hangganang temporal kaysa sa dalawang magkahiwalay na “sa” (עַל ... וְעַל) ng Hebreo. Mas malapit ang “sa ikatlo at sa ikaapat na salinlahi.”
  naturalness: Marangal at madaling maunawaan ang Tagalog. Ang “Dinadalaw ko ang kasamaan” ay sinadyang pormal na pananalitang nag-iingat sa Hebreong idyoma; hindi ito papalitan ng “pinarurusahan,” na magpapaliit sa saklaw ng פֹּקֵד. Ang bahagyang pag-aayos sa pariralang salinlahi ay nagpapalinaw nang hindi nagdadagdag ng interpretasyon.
  terminology: Ang “Yahweh,” “Diyos na mapanibughuin,” “mga ama,” “mga anak,” at “mga napopoot sa akin” ay angkop. Pinananatili ang pagkakaiba ng “yuyukod” at “maglilingkod.”
  issues:
  - severity: medium
    issue: Ang “hanggang sa ikatlo at ikaapat na salinlahi” ay hindi ganap na tumutugma sa saklaw ng dalawang pag-uulit ng עַל sa Hebreo.
    rationale: Inilalarawan ng Hebreo ang pagdalaw “sa ikatlo at sa ikaapat” na salinlahi. Maaaring basahin ang “hanggang sa” bilang isang tuloy-tuloy na hangganan at hindi gaanong malinaw ang dalawang tinukoy na salinlahi. Ginawang pangunahing salin ang mas malapit na pormulasyon; inilagay ang “hanggang sa” bilang lehitimong alternatibong pahayag sa talababa.
  - severity: low
