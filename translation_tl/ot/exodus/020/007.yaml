base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: tl
  text: Huwag mong dalhin sa walang kabuluhan ang pangalan ni Yahweh na iyong Diyos[a], sapagkat hindi pawawalang-sala ni Yahweh ang sinumang nagdadala ng kanyang pangalan sa walang kabuluhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradisyonal na salin: “Huwag mong gamitin nang walang kabuluhan ang pangalan ng PANGINOON mong Diyos.” Mas malawak ang Hebreo; literal itong tumutukoy sa “pagdadala ng pangalan ... sa kawalang-kabuluhan,” na maaaring sumaklaw sa maling panunumpa, hungkag na pagtawag sa Diyos, o maling pagkatawan sa kanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: taglayin / nagtataglay
  rationale: Ang pandiwa ay literal na ‘buhatin, dalhin, taglayin.’ Pinananatili ng “taglayin” ang kongkretong diwa at ang pag-uulit ng pandiwa sa dalawang sugnay, nang hindi agad nililimitahan ang utos sa pagsasalita lamang.
- source_word: שֵׁם
  choice: pangalan
  rationale: Tuwirang katumbas na maaari ring tumukoy sa ipinahayag na pagkakakilanlan, reputasyon, at pag-angkin ni Yahweh sa kanyang bayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Pinananatili ang isahang tuwirang pakikipag-usap at ang personal na ugnayang tipan.
- source_word: לַשָּׁוְא
  choice: nang walang kabuluhan
  rationale: Saklaw ng שָׁוְא ang kawalan ng kabuluhan, kabulaanan, at kawalang-halaga. Likas sa modernong Tagalog ang pariralang ito at hindi nito nililimitahan ang utos sa pagmumura o maling panunumpa lamang.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang batayan o dahilan ng pagbabawal.
- source_word: יְנַקֶּה (נקה)
  choice: hindi pawawalang-sala
  rationale: Ipinahahayag nito ang hudisyal na diwa ng hindi pagpapalaya sa pagkakasala o kaparusahan, at natural itong mabasa sa Tagalog.
- source_word: אֲשֶׁר
  choice: ang sinumang
  rationale: Ipinakikitang tumutukoy ang babala sa kahit sinong gumagawa ng inilalarawan.
- source_word: שְׁמוֹ
  choice: kanyang pangalan
  rationale: Malinaw na pinananatili ang panghalip na tumutukoy pabalik kay Yahweh.
theological_decisions:
- issue: Saklaw ng pagbabawal tungkol sa pangalan ng Diyos
  choice: Malawak na pagbabawal sa walang-kabuluhan, huwad, o di-wastong pagtataglay ng pangalan ni Yahweh.
  alternative: Limitahan ito sa maling panunumpa o sa lapastangang pagbigkas ng pangalan.
  rationale: Ang pagsasama ng נשא (‘dalhin/taglayin’), שֵׁם (‘pangalan’), at שָׁוְא (‘kawalang-kabuluhan/kabulaanan’) ay maaaring sumaklaw sa maling panunumpa, hungkag na pagtawag sa Diyos, at maling pagkatawan sa kanya. Hindi nilulutas ng salin ang lawak na ito sa isang makitid na interpretasyon.
- issue: Paglalahad sa banal na pangalang YHWH
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ang personal na pangalan na kinakatawan ng יהוה sa tekstong Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “taglayin” upang mapanatili ang larawang Hebreo at ang pag-uulit sa dalawang sugnay; ipinaliliwanag ng talababa ang mas pamilyar na tradisyonal na pananalita at ang mas malawak na saklaw ng orihinal.
