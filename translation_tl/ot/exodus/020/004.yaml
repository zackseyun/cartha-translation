base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: tl
  text: Huwag kang gumawa para sa iyong sarili ng larawang inukit[a], o ng anumang wangis[b] ng nasa kalangitan sa itaas, o ng nasa lupa sa ibaba, o ng nasa tubig sa ilalim ng lupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “larawang nililok.” Ang Hebreong salita ay partikular na tumutukoy sa larawang ginawa sa pamamagitan ng pag-ukit; mas mapagpakahulugan ang “diyus-diyosan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “anyo” o “representasyon.”
    reason: lexical_alternative
  - marker: c
    text: 'Inilalarawan ng talata ang mga larangan ng sangnilikha ayon sa sinaunang paglalarawang pangkalawakan: ang kalangitan sa itaas, ang lupa sa ibaba, at ang tubig sa ilalim ng lupa.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: Huwag kang gumawa
  rationale: Ang לֹא na may Qal imperfect na ikalawang panauhang panlalaki at isahan ay tuwirang pagbabawal. Likas at mariing naipahahayag ito sa modernong Tagalog sa pamamagitan ng “Huwag kang gumawa.”
- source_word: לְךָ
  choice: para sa iyong sarili
  rationale: Ipinahahayag ng dative pronoun ang pansariling kaugnayan o kapakinabangan. Pinananatili ng parirala ang reflexive na diwa nang hindi nagpapahiwatig ng layuning hindi tahasang binanggit sa talata.
- source_word: פֶסֶל
  choice: larawang inukit
  rationale: Ang פֶסֶל ay larawang hinubog sa pamamagitan ng pag-ukit. Mas tiyak ito kaysa “diyus-diyosan,” na agad nang nagpapakahulugan sa gamit ng larawan, at mas malinaw sa modernong mambabasa kaysa isang makalumang termino.
- source_word: וְכָל תְּמוּנָה
  choice: o ng anumang wangis
  rationale: Maaaring tumukoy ang תְּמוּנָה sa wangis, anyo, o representasyon. Ang “wangis” ay maikli, marangal, at sapat na malawak upang mapanatili ang saklaw at bahagyang kalabuan ng Hebreo.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: ng nasa kalangitan sa itaas
  rationale: Ang “kalangitan” ay natural na kolektibong katumbas ng Hebreong שָׁמַיִם at pinananatili ng “sa itaas” ang patayong paglalarawan ng teksto.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: ng nasa lupa sa ibaba
  rationale: Natural sa Tagalog ang “nasa lupa,” samantalang pinananatili ng “sa ibaba” ang kaibahan nito sa kalangitan sa itaas.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: o ng nasa tubig sa ilalim ng lupa
  rationale: Tapat nitong inilalarawan ang ikatlong larangan sa talata at pinananatili ang sinaunang larawang pangkalawakan nang hindi ito ipinapaliwanag sa mismong salin.
- source_word: וְ
  choice: o
  rationale: Bagaman karaniwang “at” ang pang-ugnay, nag-uugnay ito rito ng magkakabilang ipinagbabawal na kategorya; mas likas sa Tagalog ang “o” sa ganitong talaan.
theological_decisions:
- issue: Saklaw ng pagbabawal sa ikalawang utos
  choice: Isinalin ang tahasang pagbabawal sa paggawa ng larawang inukit o anumang wangis mula sa mga nilikhang larangan, nang hindi dinaragdagan ng “upang sambahin” o pinapalitan ng “diyus-diyosan.”
  alternative: Maaaring unawain ito bilang ganap na pagbabawal sa lahat ng larawang biswal, o bilang pagbabawal lamang sa mga larawang sadyang gagamitin sa pagsamba.
  rationale: Hindi tahasang nililimitahan ng talatang ito ang pagbabawal sa mga larawang ginagamit sa pagsamba, bagaman ibinibigay ng kasunod na talata ang konteksto ng pagyukod at paglilingkod. Kaya hindi dapat lutasin ng salin mismo ang tensiyong ito sa pamamagitan ng pagdaragdag o pagpapakitid sa sinabi ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog ang ginamit. Ang “Huwag kang gumawa” ay tuwiran at madaling maunawaan; ang “wangis” at “kalangitan” ay nagpapanatili ng biblikal na dignidad nang hindi nagiging lipas o labis na teknikal.
