  text: שֵׁ֤שֶׁת יָמִים֙ תַּֽעֲבֹ֔ד וְ/עָשִׂ֖יתָ כָּל מְלַאכְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: tl
  text: Anim na araw kang magtatrabaho at gagawin mo ang lahat ng iyong gawain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa loob ng anim na araw, magtrabaho ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Anim na araw
  rationale: Tuwirang temporal na parirala ito; hindi tahasang ipinahahayag ng Hebreo ang pang-ukol na katumbas ng “sa loob ng.”
- source_word: תַּעֲבֹד
  choice: kang magtatrabaho
  rationale: Ang Qal ng עבד ay maaaring mangahulugang magtrabaho o maglingkod. Sa konteksto ng utos tungkol sa Sabbath, natural at may direktibong lakas ang “magtatrabaho.”
- source_word: וְעָשִׂיתָ
  choice: at gagawin mo
  rationale: Malawak ang saklaw ng עשה bilang “gawin” o “likhain”; kasama ng מְלַאכְתֶּךָ, pinakanatural dito ang “gagawin mo.”
- source_word: כָּל
  choice: lahat ng
  rationale: Karaniwan at tuwirang katumbas ito ng כָּל sa konstruksiyong ito.
- source_word: מְלַאכְתֶּךָ
  choice: iyong gawain
  rationale: Ang מְלָאכָה ay tumutukoy sa gawain, trabaho, o hanapbuhay. Iniiwasan ng “gawain” ang alanganing pag-uulit ng “trabaho” habang pinananatili ang lawak ng salitang Hebreo.
theological_decisions:
- issue: Direktibong lakas ng imperfect sa batas tungkol sa Sabbath
  choice: “kang magtatrabaho” at “gagawin mo” bilang mariing tagubilin
  alternative: “maaari kang magtrabaho” o “dapat kang magtrabaho”
  rationale: Sa konteksto ng Sampung Utos, ang mga anyo ay covenantal na tagubilin, hindi simpleng hula. Hindi ginamit ang “maaari” dahil magiging pahintulot lamang iyon; hindi rin idinagdag ang tahasang “dapat,” na wala sa Hebreo.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang legal at direktibong himig, habang iniiba ang “magtatrabaho” at “gawain” upang maging natural at hindi paulit-ulit.
