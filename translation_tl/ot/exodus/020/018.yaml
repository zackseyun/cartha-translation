  source_fidelity: Tumpak na naipapasa ng draft ang pagkakasunod ng mga kababalaghan, ang di-karaniwang pandiwang ‘nakikita’ na sumasaklaw pati sa mga tunog, ang tunog ng shofar, ang umuusok na bundok, at ang pagkatakot at paglayo ng bayan. Gayunman, ang לַפִּידִים ay mas mabuting ilarawan bilang mga kislap o liyab na nakikita, sa halip na karaniwang ‘mga ningas,’ upang mas malinaw na maihatid ang biglaang maningning na mga pagpapakita sa kontekstong ito.
  naturalness: Natural at marangal ang karamihan ng Filipino. Ang ‘Nakikita ... ang mga kulog’ ay sadyang di-karaniwan ngunit makatwiran at kailangang panatilihin upang igalang ang pandamang paghahalo sa Hebreo. Mas idiomatiko at mas malinaw sa tagpong ito ang ‘mga kislap ng apoy’ kaysa ‘mga ningas ng apoy.’
  terminology: Ang ‘buong bayan,’ ‘trumpeta,’ ‘umuusok,’ at ‘tumayo sa malayo’ ay angkop sa modernong Filipino Tagalog at sa rehistrong biblikal. Ang ‘mga kislap ng apoy’ ay nagpapanatili ng konkretong larawang apoy nang hindi tahasang ipinapasok ang interpretasyong ‘kidlat.’
