language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: tl
  text: Nakikita ng buong bayan ang mga kulog[a], ang mga kislap ng apoy[b], ang tunog ng trumpeta, at ang bundok na umuusok. Nang makita iyon ng bayan[c], nanginig sila at tumayo sa malayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga tunog” o “mga tinig”; sa kontekstong ito, malamang na tumutukoy sa mga kulog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga sulo”; sa kontekstong ito, malamang na tumutukoy sa mga kislap ng apoy na gaya ng kidlat.
    reason: lexical_alternative
  - marker: c
    text: Sinasabi ng Hebreo na “nakikita” ng bayan ang mga pangyayaring kinabibilangan ng tunog, kaya napapanatili ang matinding paghahalo ng pandama sa tagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: Nakikita
  rationale: Pinananatili ng aspektong imperpektibo ng participle ang nagpapatuloy at matingkad na pagdama sa pangyayari. Hindi ginawang simpleng “nakita” upang mapanatili ang kasalukuyang-larawang bisa ng Hebreo.
- source_word: הַקּוֹלֹת
  choice: mga kulog
  rationale: Bagaman literal na “mga tunog” o “mga tinig,” tumutukoy ito sa konteksto ng Sinai sa mga kulog; inilalahad sa talababa ang literal na saklaw.
- source_word: הַלַּפִּידִם
  choice: mga ningas ng apoy
  rationale: Literal itong maaaring mangahulugang “mga sulo,” ngunit sa teopanikong tagpo ay tumutukoy sa kumikislap o sumisiklab na apoy. Ang “mga ningas ng apoy” ay kongkreto at hindi lubhang nagpapakahulugan bilang kidlat lamang.
- source_word: קוֹל הַשֹּׁפָר
  choice: tunog ng trumpeta
  rationale: Malapit ito sa pariralang Hebreo at karaniwang nauunawaan sa modernong Filipino; ang instrumento ay isang shofar o tambuling sungay.
- source_word: הָהָר עָשֵׁן
  choice: ang bundok na umuusok
  rationale: Pinananatili ang matingkad at nagpapatuloy na larawang biswal ng bundok na naglalabas ng usok.
- source_word: וַיַּרְא הָעָם
  choice: Nang makita iyon ng bayan
  rationale: Ang “iyon” ay likas na tumutukoy nang sama-sama sa mga kababalaghang kababanggit lamang, at ang “nang” ay nagpapakita ng ugnayang temporal patungo sa kanilang reaksiyon.
- source_word: וַיָּנֻעוּ
  choice: nanginig sila
  rationale: Likas na ipinahahayag nito sa Filipino ang panginginig o pagyanig dahil sa takot.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: tumayo sa malayo
  rationale: Direkta nitong pinananatili ang kilos at pisikal na paglayo sa Hebreo; hindi ito pinalitan ng mas interpretatibong “lumayo sila.”
- source_word: וְכָל הָעָם
  choice: buong bayan
  rationale: Natural at marangal na Filipino ito para sa lahat ng nagkakatipong mamamayan ng Israel bilang isang kabuuan.
theological_decisions:
- issue: Ang pandiwang “makita” ay may mga layong kinabibilangan ng naririnig na mga pangyayari.
  choice: Panatilihin ang magkahalong pandamang larawan sa “Nakikita ... ang mga kulog” at ipaliwanag ito sa talababa.
  alternative: Gawing “Naririnig ng buong bayan ang mga kulog” o “Nadarama ng buong bayan ang mga pangyayari.”
  rationale: 'Sadyang pambihira ang Hebreo: “nakikita” ng bayan ang mga bagay na kabilang ang mga tunog. Ang pagpapanatili nito ay naghahayag ng matindi at nangingibabaw na karanasan sa pagpapakita ng Diyos nang hindi nilulutas ang tensiyon ng teksto.'
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinili ang “buong bayan” kaysa mas teknikal na “buong sambayanan,” at “trumpeta” bilang pamilyar na tawag sa instrumento. Ang di-karaniwang “nakikita ... ang mga kulog” ay sadyang pinanatili dahil mahalaga ito sa anyo at bisa ng Hebreo.
