  source_fidelity: 'Tapat ang salin sa estruktura at saklaw ng Hebreo: pinananatili ang inuulit na pagbabawal, ang pagkakasunod ng bahay, asawa, mga alipin, mga hayop, at pangwakas na malawakang saklaw ng anumang pag-aari. Ang “pag-imbutan” ay angkop para sa ipinagbabawal na paghahangad; ang “bahay,” “kapwa,” “aliping lalaki/babae,” “baka,” at “asno” ay katanggap-tanggap na modernong Filipino na katumbas sa kontekstong ito.'
  naturalness: 'Natural, malinaw, at marangal ang daloy: “Huwag mong pag-imbutan ...” ay idiomatiko at ang listahan ay madaling sundan. Ang paggamit ng “kanyang” sa mga kasunod na pag-aari ay malinaw na tumutukoy sa kapwa.'
