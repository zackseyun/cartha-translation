  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: tl
  text: Huwag mong pag-imbutan ang bahay ng iyong kapwa[a]; huwag mong pag-imbutan ang asawa ng iyong kapwa, ang kanyang aliping lalaki o aliping babae, ang kanyang baka o asno, o ang anumang pag-aari ng iyong kapwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sambahayan ng iyong kapwa.” Ang salitang Hebreo para sa “bahay” ay maaari ring tumukoy sa isang sambahayan, ngunit mas angkop dito ang “bahay” dahil magkakahiwalay na inililista ang mga taong-bahay at mga hayop sa kasunod na bahagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: pag-imbutan
  rationale: Ipinapahayag ng חמד sa utos na ito ang maling paghahangad sa pag-aari ng iba. Ang “pag-imbutan” ay likas sa modernong Filipino at malinaw ang etikal na bigat nito.
- source_word: בֵּית רֵעֶךָ
  choice: bahay ng iyong kapwa
  rationale: Maaaring tumukoy ang בַּיִת sa gusali o sa sambahayan. Dahil hiwalay na inililista kasunod nito ang asawa, mga alipin, at mga hayop, “bahay” ang mas angkop na pangunahing kahulugan dito.
- source_word: רֵעֶךָ
  choice: iyong kapwa
  rationale: Sa batas ng tipan, ang רֵעַ ay tumutukoy sa ibang taong kabilang sa pamayanan. Ang “kapwa” ay natural at pinananatili ang ugnayang etikal.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: asawa ng iyong kapwa
  rationale: Tuwirang ipinahahayag ng parirala ang asawa ng kapwa; hindi kailangang idagdag ang kasarian dahil malinaw ito sa konteksto at sa Hebreong אִשָּׁה.
- source_word: עַבְדּוֹ
  choice: kanyang aliping lalaki
  rationale: Sa talaang legal na ito, mahalaga ang kalagayang nakagapos sa paglilingkod na ipinahihiwatig ng עֶבֶד. Pinananatili ng “aliping lalaki” ang katayuan at pagkakaiba ng kasarian.
- source_word: אֲמָתוֹ
  choice: aliping babae
  rationale: Ang אָמָה ay babaeng alipin o lingkod. Sa paralelismo nito sa עֶבֶד at sa kontekstong legal, malinaw na naihahatid ng “aliping babae” ang katayuan at kasarian.
- source_word: שׁוֹרוֹ
  choice: kanyang baka
  rationale: Ang שׁוֹר ay karaniwang tumutukoy sa bovine na hayop, madalas bilang hayop na pantrabaho. Ang “baka” ang malinaw at natural na salitang Filipino nang hindi labis na nililimitahan ito sa “toro.”
- source_word: חֲמֹרוֹ
  choice: kanyang asno
  rationale: Ang “asno” ay malinaw at karaniwang salin sa Filipino para sa חֲמוֹר at angkop sa marangal na rehistro ng teksto.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: o ang anumang pag-aari ng iyong kapwa
  rationale: Komprehensibong pangwakas na parirala ito. Natural sa Filipino ang “anumang pag-aari” at pinananatili nito ang diwa ng pagmamay-ari sa לְ.
- source_word: לֹא ... לֹא
  choice: Huwag mong ... huwag mong
  rationale: Pinananatili ang dalawang magkasunod na pagbabawal upang mapanatili ang diin at estruktura ng Hebreo.
theological_decisions:
- issue: Kung ang בֵּית sa unang sugnay ay “bahay” o “sambahayan”
  choice: bahay
  alternative: sambahayan
  rationale: Bagaman maaaring mangahulugan ng “sambahayan” ang בַּיִת, magkakahiwalay na binabanggit pagkatapos nito ang asawa, mga alipin, at mga hayop. Iniiwasan ng “bahay” ang pag-uulit at sinusunod ang pag-usad ng talaan mula sa tirahan tungo sa iba pang pag-aari.
- issue: Pagsasalin ng mga katawagang tumutukoy sa pagkaalipin sa batas ng tipan
  choice: aliping lalaki / aliping babae
  alternative: lalaking lingkod / babaeng lingkod
  rationale: Litaw sa legal na talaan ang nakagapos na katayuan ng עֶבֶד at אָמָה. Ang “alipin” ay mas tapat dito kaysa sa mas malawak at mas banayad na “lingkod,” habang pinananatili ang pagkakaiba ng kasarian sa Hebreo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pag-imbutan” upang ihatid ang ipinagbabawal na paghahangad, “kapwa” para sa ugnayang panlipunan, at “alipin” upang hindi pagaanin ang kalagayang panlipunang nasa tekstong Hebreo.
