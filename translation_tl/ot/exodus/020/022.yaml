base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Ganito ang sabihin mo sa mga anak ni Israel:[a] Kayo mismo ang nakakita na nagsalita ako sa inyo mula sa langit.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita” o “sambayanang Israel.” Sa literal, “mga anak na lalaki ni Israel,” ngunit kolektibo ang gamit nito para sa bayan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula sa mga langit”; karaniwang “mula sa langit” ang likas na pagpapahayag sa Filipino.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isaling “nakipag-usap ako sa inyo.” Mas literal na gumagamit ang Hebreo ng “kasama ninyo,” na nagbibigay-diin sa tuwirang pakikipagtagpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: כֹּה תֹאמַר
  choice: Ganito ang sabihin mo
  rationale: Natural at marangal na katumbas ng pormula ng mensahero, habang pinananatili ang tuwirang utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa literal na “mga anak na lalaki ni Israel,” ngunit ang “mga anak ni Israel” ay likas na kolektibong tawag sa Filipino at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: אַתֶּם רְאִיתֶם
  choice: Kayo mismo ang nakakita
  rationale: Ipinahahayag ng “kayo mismo” ang diin ng hiwalay na panghalip na אַתֶּם.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng kanilang nakita, hindi ang isang dahilan.
- source_word: מִן הַשָּׁמַיִם
  choice: mula sa langit
  rationale: Bagaman anyong maramihan ang Hebreo, pang-isahan ang likas na idyomang Filipino sa ganitong diwa.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: nagsalita ako sa inyo
  rationale: Ang “nagsalita ... sa inyo” ang pinakanatural na Filipino para sa banal na pagpapahayag; itinatala sa talababa na mas literal na “kasama ninyo,” na nagbibigay-diin sa tuwirang pakikipagtagpo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na gawin itong titulo.
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel; mga anak na lalaki ni Israel
  rationale: Pinananatili ang ugnayang angkan na nasa Hebreo nang hindi ipinipilit sa Filipino na mga lalaking miyembro lamang ang tinutukoy.
- issue: Diwa ng דִּבַּרְתִּי עִמָּכֶם
  choice: nagsalita ako sa inyo
  alternative: nakipag-usap ako sa inyo; nagsalita akong kasama ninyo
  rationale: Pinipili ang natural na Filipino para sa pahayag ng Diyos, ngunit hindi ikinukubli ang mas literal na halaga ng עִם; inilalahad iyon sa talababa upang mapanatili ang diin sa tuwirang pakikipagtagpo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sinabi” at “nagsalita” sa halip na mas makalumang mga anyo. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat isa.
