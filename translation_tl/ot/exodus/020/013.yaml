  text: Huwag kang papaslang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Huwag kang papatay.” Mas malawak ang saklaw ng “pumatay”; ang pandiwang Hebreo rito ay karaniwang tumutukoy sa labag sa batas o maling pagpatay, gaya ng pagpaslang, sa halip na sa bawat uri ng pagpatay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Ang לֹא kasama ng di-ganap na anyong pandiwa ay nagpapahayag dito ng tuwirang pagbabawal. Ang “Huwag kang…” ang natural at malinaw na katumbas nito sa modernong Tagalog.
- source_word: תִּרְצָח
  choice: papaslang
  rationale: Ang רצח ay karaniwang tumutukoy sa pagkitil ng buhay ng tao nang labag sa batas o mali, hindi sa bawat uri ng pagpatay. Mas tiyak ang “papaslang” kaysa sa pangkalahatang “papatay,” habang nananatiling maikli at mariin ang utos.
theological_decisions:
- issue: Saklaw ng pagbabawal sa Dekalogo
  choice: Isalin ang רצח bilang “papaslang” sa halip na “papatay.”
  alternative: Huwag kang papatay.
  rationale: Pinananatili ng “papaslang” ang pokus sa mali o labag na pagkitil ng buhay at iniiwasang ipahiwatig na ipinagbabawal ng talata ang lahat ng posibleng pagkitil ng buhay. Isa muna itong pasyang leksikal na may implikasyong teolohikal, hindi paglalapat ng isang natatanging doktrina.
translation_notes:
  register: Maikli, mariin, at dignidad ang himig, gaya ng isang tuwirang utos. Ginamit ang karaniwang modernong balangkas na “Huwag kang…” at ang “papaslang” upang maging tiyak nang hindi teknikal.
