  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: tl
  text: Ngunit kung talagang susundin mo ang kanyang tinig[a] at gagawin mo ang lahat ng sinasabi ko[b], magiging kaaway ako ng iyong mga kaaway at kalaban ng iyong mga kalaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung tunay ngang makikinig ka sa kanyang tinig.” Gumagamit ang Hebreo ng infinitive absolute kasama ng finite verb upang magbigay-diin.
    reason: lexical_alternative
  - marker: b
    text: Lumilipat ang talata mula sa “kanyang tinig” tungo sa “sinasabi ko,” na pinananatili ang malapit na kaugnayan ng mensahero at ng PANGINOON sa konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Ngunit kung
  rationale: Natural na ipinahahayag ang mariing kondisyong sumasalungat sa naunang babala at pangako.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: talagang pakikinggan at susundin mo
  rationale: Ang infinitive absolute na kasama ng finite verb ay nagbibigay-diin. Pinananatili ng pares na “pakikinggan at susundin” ang literal na diwa ng pakikinig at ang implikasyon nitong pagsunod.
- source_word: בְּקֹלוֹ
  choice: ang kanyang tinig
  rationale: Pinananatili ang personal na pananalita at ang pagtukoy sa mensahero sa konteksto.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: at gagawin mo ang lahat ng aking sasabihin
  rationale: Natural sa modernong Tagalog at malinaw na pinananatili ang paglipat mula sa “kanyang tinig” tungo sa unang panauhang pananalita ng PANGINOON.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: magiging kaaway ako ng iyong mga kaaway
  rationale: Pinananatili ang ugnayang leksikal sa pagitan ng pandiwa at ng pangngalang “mga kaaway,” sa halip na gawing mas pangkalahatang “sasalungatin.”
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: at kalaban ng iyong mga kalaban
  rationale: Ipinapakita ang paralelismo at salitang magkaugnay sa Hebreo, habang iniiwasan ang di-kinakailangang pagpapakahulugang “pahihirapan.”
theological_decisions:
- issue: Paglipat ng tinutukoy mula sa “kanyang tinig” tungo sa “aking sasabihin”
  choice: Panatilihin ang paglipat mula sa tinig ng mensahero tungo sa unang panauhang pananalita ng PANGINOON.
  alternative: Pag-isahin ang dalawang sugnay bilang kapuwa tumutukoy lamang sa mensahero o kapuwa tuwirang pananalita lamang ng Diyos.
  rationale: Pinananatili nito ang malapit na kaugnayan ng mensahero at ng PANGINOON sa konteksto nang hindi nilulutas ang tunay na teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “talagang pakikinggan at susundin” upang maipahayag kapuwa ang diin at ang masunuring pakikinig; pinanatili rin ang simetrikong “kaaway…mga kaaway” at “kalaban…mga kalaban.”
