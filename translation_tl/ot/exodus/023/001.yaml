base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: tl
  text: Huwag kang magpakalat ng maling ulat.[a] Huwag kang makiisa sa taong masama upang magbigay ng mapanirang patotoo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magdala/magpalaganap ng maling ulat.” Literal na “magbuhat” o “magdala” ang pandiwang Hebreo; dito ay tumutukoy ito sa pagpapalaganap ng isang ulat.
    reason: lexical_alternative
  - marker: b
    text: Literal na “ilagay ang iyong kamay kasama ng taong masama upang maging saksing marahas.” Sa kontekstong legal, maaari rin itong unawain bilang “saksing di-makatarungan” o “saksing mapaminsala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: magpakalat
  rationale: Ang נָשָׂא ay literal na ‘magbuhat/magdala,’ ngunit kasama ng שֵׁמַע ay tumutukoy sa pagdadala o pagpapalaganap ng isang balita. Likas at malinaw sa modernong Tagalog ang ‘magpakalat.’
- source_word: שֵׁמַע שָׁוְא
  choice: huwad na balita
  rationale: Ang שֵׁמַע ay bagay na narinig, kaya ‘balita’ o ‘ulat,’ at ang שָׁוְא ay kabulaanan, kawalang-kabuluhan, o pandaraya. Ang ‘huwad na balita’ ay maikli at angkop sa kontekstong legal.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: makipagsabwatan
  rationale: Literal itong ‘ilagay ang iyong kamay kasama ng.’ Sa konteksto, nangangahulugan itong makiisa o makipagtulungan sa masamang gawain. Ipinahihiwatig ng ‘makipagsabwatan’ ang sadyang pakikiisa sa maling patotoo.
- source_word: רָשָׁע
  choice: taong masama
  rationale: Maaaring mangahulugan ang רָשָׁע ng ‘masama’ o ‘salarin.’ Ang ‘taong masama’ ay natural at hindi nagpapasok ng hatol na higit sa sinasabi ng konteksto.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: upang maging saksing mapanira
  rationale: Ang עֵד ay ‘saksi,’ at ang חָמָס ay karahasan, pinsala, o marahas na kawalang-katarungan. Sa kontekstong panghukuman, ang ‘mapanira’ ay nagpapakita ng patotoong nakapipinsala at gumagawa ng kawalang-katarungan, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: לֹא / אַל
  choice: Huwag kang
  rationale: Kapuwa nagpapahayag ng pagbabawal sa talata. Ang ‘Huwag kang’ ay tuwiran, natural, at nagpapanatili ng pang-isahang pakikipag-usap.
theological_decisions:
- issue: Pangkasariang anyo ng pang-isahang tagubilin at ng masamang tao
  choice: Gumamit ng pang-isahang ‘kang’ at ng likas na walang-tiyak-na-kasariang ‘taong masama’
  alternative: Tahasang gumamit ng ‘lalaking masama’ upang tumbasan ang anyong panlalaki sa Hebreo
  rationale: May anyong panlalaking pang-isahan ang Hebreo, ngunit karaniwang kinatawan nito ang taong saklaw ng batas. Hindi likas na kailangang tukuyin ang kasarian sa Tagalog; pinananatili ng ‘kang’ ang pang-isahang pakikipag-usap nang hindi nagpapaliit sa saklaw ng utos.
- issue: Kahulugan ng עֵד חָמָס
  choice: saksing mapanira
  alternative: saksing marahas; saksing di-makatarungan; bulaang saksi
  rationale: Pinananatili ng ‘mapanira’ ang bigat ng חָמָס bilang nakapipinsalang kasamaan sa kontekstong legal, nang hindi ito tahasang nililimitahan sa pisikal na karahasan o ipinapantay lamang sa pagsisinungaling.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang ‘huwad na balita’ sa halip na mas kolokyal na ‘fake news’ upang maiwasan ang makabagong pampolitikang kulay. Ang dalawang pagbabawal ay pinanatiling pang-isahan at malinaw.
