base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: tl
  text: “Narito, nagsusugo ako ng isang anghel[a] sa unahan mo upang ingatan ka sa daan at dalhin ka sa lugar na inihanda ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo.” Ang Hebreong מַלְאָךְ ay maaaring mangahulugang taong sugo o anghel; sa kontekstong ito, pinakamalamang ang “anghel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pinananatili ang tungkuling tumawag ng pansin ng Hebreong kataga sa natural at makabagong Tagalog.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: magsusugo ako
  rationale: Ipinahahayag ang nalalapit na pagkilos ng Diyos. Mas natural ito sa Tagalog kaysa sa literal na aspektong progresibo, habang napapanatili ang diin sa nagsasalitang “ako.”
- source_word: מַלְאָךְ
  choice: isang anghel
  rationale: Maaaring tumukoy ang salita sa isang sugo o anghel. Sa konteksto, pinakamalamang ang makalangit na sugo, ngunit inilalahad sa talababa ang leksikal na alternatibo.
- source_word: לְפָנֶיךָ
  choice: sa unahan mo
  rationale: Malinaw at likas na ipinahahayag ang pag-una ng anghel sa paglalakbay.
- source_word: לִשְׁמָרְךָ
  choice: upang ingatan ka
  rationale: Tumpak na inilalahad ang proteksiyon at pagbabantay na ipinahihiwatig ng שׁמר.
- source_word: בַּדָּרֶךְ
  choice: sa daan
  rationale: Maikli at natural na tumutukoy sa ruta o paglalakbay.
- source_word: וְלַהֲבִיאֲךָ
  choice: at dalhin ka
  rationale: Direktang isinasalin ang causative na anyo ng בוא bilang pagdadala sa patutunguhan.
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: sa lugar na inihanda ko
  rationale: Pinananatili ang diwa ng isang patutunguhang inihanda o ginawang handa ng Diyos.
theological_decisions:
- issue: Ang pagkakakilanlan ng מַלְאָךְ
  choice: Isinalin bilang “isang anghel” nang hindi tinutukoy kung siya ay isang nilikhang anghel o isang natatanging pagpapakita o sugo ng PANGINOON.
  alternative: “isang sugo,” isang taong mensahero, o ang Anghel ng PANGINOON bilang natatanging banal na sugo
  rationale: Ang talata mismo ay tumatawag lamang sa nilalang na מַלְאָךְ. Pinananatili ng salin ang tensiyong teolohikal at hindi ipinapasok sa pangunahing teksto ang isang tiyak na pagkakakilanlan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Tingnan mo” bilang natural na pantawag-pansin at ang “sa unahan mo” upang malinaw na ipakita ang paggabay sa paglalakbay.
