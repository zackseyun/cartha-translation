translation:
  language: tl
  text: Huwag mong baluktutin ang katarungang nararapat sa dukhang tao sa kanyang usapin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag mong pagkaitan ng katarungan ang dukhang tao sa kanyang kaso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Likas na anyo ng tuwirang pagbabawal sa modernong Tagalog.
- source_word: תַטֶּה
  choice: baluktutin
  rationale: Ang Hiphil ng נטה ay tumutukoy rito sa paglihis o pagpilipit ng katarungan sa kontekstong panghukuman; malinaw at matalinghaga ang “baluktutin” sa Tagalog.
- source_word: מִשְׁפַּט
  choice: ang katarungang nararapat sa
  rationale: Sa kontekstong legal, tumutukoy ito sa makatarungang pasiya o karapatang dapat igawad, hindi lamang sa abstraktong katarungan.
- source_word: אֶבְיֹנְךָ
  choice: dukhang kasama mo
  rationale: Ang אֶבְיוֹן ay dukha o nangangailangan. Ipinahihiwatig ng hulaping ikalawang panauhan ang ugnayang “iyong”; ang “kasama mo” ay natural na Tagalog na hindi nagpapasok ng kasariang hindi kailangang idiin.
- source_word: בְּרִיבוֹ
  choice: sa kanyang usapin
  rationale: Maaaring tumukoy ang רִיב sa alitan, kasong legal, o usaping pinagtatalunan; pinananatili ng “usapin” ang lawak ng kahulugan.
theological_decisions:
- issue: Kung ang utos ay laban sa pagkiling laban sa dukha o isang pangkalahatang panawagan lamang para sa katarungan
  choice: Ipinagbabawal ang pagbaluktot sa katarungang nararapat sa dukha sa isang usaping legal.
  alternative: Huwag pagkaitan ng katarungan ang dukha sa kanyang kaso.
  rationale: Ginagawang layon ng sintaks na Hebreo ang מִשְׁפַּט, samantalang ang dukha ang taong dapat tumanggap nito sa kanyang רִיב. Kaya pinananatili ang tiyak na kontekstong panghukuman at hindi ito ginagawang pangkalahatang sawikain.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ang “baluktutin” ay nagpapanatili sa larawan ng Hebreong pandiwa, habang nililinaw ng “katarungang nararapat” ang legal na diwa ng מִשְׁפַּט.
