base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: tl
  text: Huwag kang makipagtipan sa kanila o sa kanilang mga diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “pumutol ng tipan.”
    reason: lexical_alternative
  - marker: b
    text: O, sa mas pormal na pagkakasalin, “at sa kanilang mga diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: Huwag
  rationale: Karaniwang panandang Tagalog para sa tuwirang pagbabawal; malinaw nitong naipapahayag ang lakas ng Hebreong pagtanggi.
- source_word: תִכְרֹת ... בְּרִית
  choice: makipagtipan
  rationale: Ang כרת ברית ay isang nakapirming idyomang Hebreo na literal na ‘pumutol ng tipan.’ Natural na ipinapahayag sa modernong Tagalog ng ‘makipagtipan,’ na pinananatili rin ang diwang may kapwa panig sa tipan.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Sa pariralang tungkol sa pakikipagtipan, natural na ipinakikilala ng ‘sa’ ang kabilang panig ng tipan.
- source_word: וְלֵאלֹהֵיהֶם
  choice: o sa kanilang mga diyos
  rationale: Bagaman karaniwang ‘at’ ang ו, mas malinaw na ipinahahayag ng ‘o’ sa isang negatibong talaan na kapuwa ipinagbabawal ang dalawang posibleng panig. Ang maramihang ‘mga diyos’ ay tumutugma sa anyong Hebreo at sa konteksto.
- source_word: בְּרִית
  choice: tipan
  rationale: Ang ‘tipan’ ang kinikilalang salin ng בְּרִית at pinananatili ang legal, panrelihiyon, at kaugnayang bigat nito nang higit kaysa sa ‘kasunduan.’
theological_decisions:
- issue: Pagpapahayag sa idyomang כרת ברית
  choice: makipagtipan
  alternative: pumutol ng tipan
  rationale: Iniiwasan ng salin ang di-natural na literalismo ngunit pinananatili ang buong legal at teolohikal na diwa ng pagbabawal. Inilalagay sa talababa ang literal na larawan ng Hebreo.
- issue: Lakas ng ו bago ang ‘kanilang mga diyos’
  choice: o sa kanilang mga diyos
  alternative: at sa kanilang mga diyos
  rationale: Tunay na maaaring isalin ang ו bilang ‘at,’ ngunit sa saklaw ng pagbabawal, natural na ‘o’ sa Tagalog upang ipakitang walang tipang dapat gawin sa alinman sa dalawang binanggit na panig. Hindi nito ipinapalagay na magkapareho ang mga tao at ang kanilang mga diyos.
- issue: Bilang at kausap sa pandiwa
  choice: Huwag kang
  alternative: Huwag kayong
  rationale: Ang pandiwang Hebreo ay ikalawang panauhang panlalaking isahan. Pinananatili ng ‘kang’ ang gramatikal na isahan, bagaman ang utos ay nasa konteksto ng pakikipag-usap sa Israel bilang isang sambayanan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘makipagtipan’ bilang natural ngunit may bigat na salitang biblikal; iniwasan ang arkaikong ayos at ang labis na teknikal na pananalita.
