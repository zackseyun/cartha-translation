  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: tl
  text: Huwag mong ihandog ang dugo ng aking handog kasama ng anumang may pampaalsa[a], at huwag mong ititira hanggang umaga ang taba ng aking kapistahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kasama ng pampaalsa” o, sa literal, “sa ibabaw ng pampaalsa.” Ang Hebreong pang-ukol ay literal na “sa ibabaw,” ngunit sa kontekstong ito ay malamang na nangangahulugang hindi dapat ihandog ang handog na kaugnay ng anumang pinaalsa.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa isang banal na pistang ipinagdiriwang; maaari ring isaling “pista.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  choice: Huwag mong ihahandog
  rationale: Ang Qal imperfect na may לֹא ay isang tuwirang pagbabawal sa ikalawang panauhan. Natural sa modernong Tagalog ang anyong “Huwag mong ihahandog,” at pinananatili nito ang kontekstong pansakripisyo.
- source_word: עַל חָמֵץ
  choice: kasama ng anumang may pampaalsa
  rationale: Literal na “sa ibabaw ng pampaalsa,” ngunit sa kontekstong ito ay malamang na tumutukoy sa paghahandog na kaugnay ng anumang pinaalsa. Nililinaw ng “kasama ng” ang ugnayan nang hindi itinatago ang alternatibong literal sa talababa.
- source_word: דַּם זִבְחִי
  choice: ang dugo ng aking handog
  rationale: Pinananatili ang tahasang “dugo” at ang unang-panauhang hulapi. Ang “handog” ay natural at sapat na pansakripisyong katawagan sa Tagalog.
- source_word: וְלֹא יָלִין
  choice: at huwag mong ititira
  rationale: Ang לין ay nangangahulugang manatili o magpalipas ng gabi. Sa legal na konteksto, ipinahihiwatig ng anyong sanhi sa Tagalog na hindi dapat hayaang matira ang taba; ang “hanggang umaga” ang nagpapanatili sa buong temporal na diwa.
- source_word: חֵלֶב
  choice: ang taba
  rationale: Tahasang taba ang tinutukoy ng Hebreo, malamang ang mga bahaging taba para sa paghahandog. Hindi ito pinalitan ng mas interpretibong “pinakamainam na bahagi.”
- source_word: חַגִּי
  choice: ng aking kapistahan
  rationale: Ang חַג ay isang banal na kapistahan o pistang panrelihiyon. Ang “kapistahan” ay dignitado at malinaw sa modernong Tagalog.
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Natural at tumpak na katumbas ng karaniwang pariralang temporal.
theological_decisions:
- issue: Tinutukoy ng mga hulaping unang panauhan sa “aking handog” at “aking kapistahan”
  choice: Panatilihin ang tuwirang banal na pananalita bilang “aking handog” at “aking kapistahan.”
  alternative: “handog para sa akin” o “kapistahan para sa PANGINOON”
  rationale: Tahasang nasa tekstong Hebreo ang mga hulaping unang panauhan. Ang pagpapaliwanag kung kanino inihahandog o ang paglalagay ng banal na pangalan ay lalampas sa mismong pahayag.
- issue: Ugnayan ng handog at ng may pampaalsa
  choice: “kasama ng anumang may pampaalsa,” na may talababa para sa literal na posibilidad
  alternative: “sa ibabaw ng pampaalsa” o “kasama ng pampaalsa”
  rationale: May tunay na lawak ang gamit ng עַל. Ang pangunahing salin ay natural sa kontekstong ritwal, habang pinananatili ng talababa ang literal at mas makitid na mga alternatibo.
translation_notes:
  register: 'Modernong Filipino Tagalog na tuwiran, marangal, at angkop sa wikang legal at pangsamba. Ginamit ang “pampaalsa” bilang madaling maunawaang katawagan sa leaven, at “kapistahan” para sa banal na festival. Inayos ang mga pananda sa mismong salitang tinutukoy: [a] pagkatapos ng pampaalsa at [b] pagkatapos ng kapistahan.'
