  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: tl
  text: Kung makatagpo ka ng baka o asno ng iyong kaaway na naliligaw[a], tiyak na ibalik mo ito sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Kapag makatagpo ka ng baka o asno ng iyong kaaway na gumagala.”'
    reason: Ipinapakita ang maaaring temporal na pagbasa sa כִּי (“Kapag”) at ang leksikal na alternatibo sa תֹּעֶה (“gumagala”).
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng kondisyong karaniwan sa mga kasong legal. Pinananatili ng “Kung” ang anyong kondisyonal, bagaman maaari rin ang “Kapag.”
- source_word: תִפְגַּע
  choice: makatagpo mo
  rationale: Ipinahihiwatig ng pandiwang פגע ang di-sinasadyang pagkakatagpo o pagdating sa kinaroroonan ng hayop; natural itong ipinapahayag sa Filipino bilang “makatagpo.”
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay bovine na karaniwan sa gawaing pansakahan. Ang “baka” ang malinaw at karaniwang katumbas sa modernong Filipino nang hindi labis na tinutukoy ang kasarian o gamit nito.
- source_word: אֹיִבְךָ
  choice: ng kaaway mo
  rationale: Tuwirang pinananatili ang אֹיֵב bilang “kaaway,” kaya hindi napapahina ang etikal na tensiyon ng utos.
- source_word: חֲמֹרוֹ
  choice: asno
  rationale: Ang חֲמוֹר ay karaniwang katawagan sa donkey; ang “asno” ay malinaw, maikli, at angkop sa marangal na rehistro ng salin.
- source_word: תֹּעֶה
  choice: na naliligaw
  rationale: Inilalarawan ng participle mula sa תעה ang hayop na lumilihis o gumagala palayo sa dapat nitong kinaroroonan. Hindi ipinapalagay ng “naliligaw” na tuluyan na itong nawala.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: dapat mo talaga itong ibalik
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa utos. Ipinapahayag ng “dapat mo talaga” kapwa ang obligasyon at ang diin sa natural na Filipino.
- source_word: לוֹ
  choice: sa kanya
  rationale: Ang panghalip ay tumutukoy pabalik sa kaaway na may-ari; pinananatili ng “sa kanya” ang tuwirang anyo nang hindi dinaragdagan ang teksto ng “may-ari.”
theological_decisions:
- issue: Etikal na tungkulin sa isang kaaway
  choice: Tahasan pa ring tinatawag na “kaaway” ang tao, at iniuutos ang pagbabalik ng naliligaw niyang hayop.
  alternative: Palitan ang “kaaway” ng mas neutral na “kapwa” o ipakahulugan bilang “napopoot sa iyo.”
  rationale: Malinaw na אֹיֵב ang nasa Hebreo. Pinananatili nito ang tensiyon ng paggawa ng matuwid at mahabaging kilos kahit sa isang kalaban, sa halip na gawing mas magaan ang ugnayan.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “makatagpo” sa halip na mas kolokyal na “makasalubong,” at “dapat mo talaga” upang malinaw na maipahayag ang mariing utos nang hindi nagiging makaluma.
