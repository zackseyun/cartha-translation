  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: tl
  text: Huwag mong apihin ang isang dayuhang naninirahan sa inyo[a]. Alam ninyo mismo kung ano ang pakiramdam ng isang dayuhang naninirahan[b], sapagkat naging mga dayuhang naninirahan din kayo sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dayuhan,” “residenteng dayuhan,” o “estranghero.” Ang Hebreong ger ay isang hindi katutubong naninirahan sa gitna ng isang bayan, kadalasa’y nasa mahinang kalagayang panlipunan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “alam ninyo ang nephesh ng dayuhang naninirahan.” Maaaring tumukoy ang nephesh sa buhay, sarili, kalooban, o panloob na karanasan ng isang tao; dito, idiniriin ang kaalamang nagmula sa sarili nilang pinagdaanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר
  choice: dayuhang naninirahan
  rationale: Tumutukoy ito sa isang hindi katutubo na namumuhay sa gitna ng ibang bayan, madalas sa isang mahinang kalagayang panlipunan. Mas tiyak ito kaysa simpleng “dayuhan” at mas natural kaysa teknikal na “residenteng dayuhan.”
- source_word: תִלְחָץ
  choice: apihin
  rationale: Sa kontekstong legal, ipinahihiwatig ng pandiwa ang mapaniil na pagdiin, pagsasamantala, o pagmamalupit sa isang taong mahina ang katayuan.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: Alam ninyo mismo
  rationale: Ipinakikita ng tahasang panghalip at ng pandiwa ang mariing kaalamang nagmula sa sariling karanasan ng Israel.
- source_word: אֶת נֶפֶשׁ הַגֵּר
  choice: kung ano ang pakiramdam ng isang dayuhang naninirahan
  rationale: Ang נֶפֶשׁ sa idyomang ito ay tumutukoy sa panloob at aktuwal na karanasan ng tao. Natural itong ipinahahayag sa modernong Tagalog nang hindi nag-aangkat ng di-kailangang paghahating katawan-kaluluwa.
- source_word: כִּי
  choice: sapagkat
  rationale: Nagpapakilala ito ng dahilan ng utos at nagpapanatili ng marangal na himig.
- source_word: גֵרִים הֱיִיתֶם
  choice: naging mga dayuhang naninirahan din kayo
  rationale: Inuulit ang salin ng גֵר upang mapanatili ang retorikal na ugnayan sa pagitan ng kanilang pagtrato sa dayuhan at ng sarili nilang karanasan sa Ehipto. Ang “din” ay natural na nagpapatingkad sa paghahambing.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Malapit ito sa anyong Hebreo at nagpapanatili ng pormal na indayog ng paalaalang legal.
theological_decisions:
- issue: Pagpapakahulugan sa גֵר sa batas ng tipan
  choice: dayuhang naninirahan
  alternative: dayuhan; estranghero; residenteng dayuhan
  rationale: Hindi lamang etnisidad o panandaliang paglalakbay ang tinutukoy, kundi ang kalagayan ng isang hindi katutubong namumuhay sa gitna ng bayan. Pinananatili ng salin ang panlipunan at legal na diwa ng salita.
- issue: Pagpapakahulugan sa נֶפֶשׁ sa idyoma
  choice: kung ano ang pakiramdam
  alternative: kaluluwa; kalooban; kalagayan; buhay
  rationale: Ipinahihiwatig ng konteksto ang kaalamang bunga ng sariling karanasan sa pagiging dayuhang naninirahan. Inilalagay sa talababa ang mas literal na anyo upang mapanatiling lantad ang saklaw at tensiyon ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Pinanatili ang paglipat mula sa isahang utos na “mong” tungo sa maramihang “ninyo/kayo” sa Hebreo, at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
