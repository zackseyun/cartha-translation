base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: tl
  text: Huwag silang manirahan sa iyong lupain, baka udyukan ka nilang magkasala laban sa akin.[a] Sapagkat kung paglilingkuran mo ang kanilang mga diyos,[b] magiging bitag iyon sa iyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “baka maging dahilan sila upang magkasala ka laban sa akin” o “baka akayin ka nila sa pagkakasala laban sa akin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sapagkat paglilingkuran mo ang kanilang mga diyos.” Maaaring unawain ang sugnay sa Hebreo bilang inaasahang kahihinatnan, hindi lamang bilang kondisyon.
    reason: alternative_reading
  - marker: c
    text: Ang “bitag” ay salin ng Hebreong moqesh—isang patibong na ginagamit dito bilang talinghaga para sa bagay na umaakay sa kapahamakan o pagtataksil sa Diyos.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ בְּאַרְצְךָ
  choice: manirahan sa iyong lupain
  rationale: Ang יָשַׁב ay tumutukoy rito sa patuloy na paninirahan, at ang אֶרֶץ ay ang lupaing ibinigay at tinitirhan ng Israel. Likas at malinaw sa modernong Tagalog ang pariralang ito.
- source_word: פֶּן
  choice: baka
  rationale: Ipinakikilala ng פֶּן ang masamang kahihinatnang nilalayong maiwasan. Ang “baka” ang natural na katumbas sa Tagalog at nagpapanatili sa babalang diwa.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: udyukan ka nilang magkasala laban sa akin
  rationale: 'Causative ang Hiphil ng חטא: sila ang magiging sanhi o tulak upang magkasala ang Israel. Ipinahahayag ng “laban sa akin” ang etikal na diwa ng לִי.'
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: kung paglilingkuran mo ang kanilang mga diyos
  rationale: Kapag diyos ang layon, ang עבד ay paglilingkod na may diwa ng pagsamba at katapatan. Pinananatili ng “paglilingkuran” ang tuwirang bokabularyong tipan, habang ang “kung” ay nagpapakita ng posibleng kondisyong pagbasa.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: magiging bitag iyon sa iyo
  rationale: Ang מוֹקֵשׁ ay literal na bitag at ginagamit dito bilang talinghaga para sa bagay na humahantong sa kapahamakan o pagtataksil sa Diyos. Hindi idinagdag ang “tiyak” sapagkat walang hiwalay na salitang Hebreo para rito.
theological_decisions:
- issue: Likas ng kasalanang ibinabala
  choice: Iniugnay ang kasalanan sa paglilingkod sa mga diyos ng mga naninirahan sa lupain.
  alternative: Isang pangkalahatang babala lamang tungkol sa masamang impluwensiya ng mga dayuhan.
  rationale: Ang kasunod na sugnay tungkol sa paglilingkod sa kanilang mga diyos ang tumutukoy sa kasalanang nasa isip ng talata. Hindi pinalawak ang teksto tungo sa etnikong paghihiwalay o pangkalahatang pagkasira ng asal.
- issue: Ugnayan ng כִּי תַעֲבֹד sa naunang babala
  choice: 'Isinalin bilang paliwanag na may kondisyong sugnay: “Sapagkat kung paglilingkuran mo...”'
  alternative: “Sapagkat paglilingkuran mo ang kanilang mga diyos,” na naglalahad ng inaasahang kahihinatnan sa halip na payak na kondisyon.
  rationale: Maaaring magpakilala ang כִּי ng dahilan o paliwanag, at maaaring unawain ang imperfect na תַעֲבֹד bilang kondisyon o inaasahang resulta. Pinili ang natural na kondisyong pagbasa ngunit inilagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “manirahan,” “udyukan,” at “bitag” bilang pangkaraniwan ngunit angkop na mga salita. Iniwasan ang masyadong makalumang “nang huwag” o “silo,” at pinanatili ang tuwirang pananalita ng babala.
