  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: tl
  text: at ang Kapistahan[a] ng Pag-aani, ang mga unang bunga ng iyong paggawa, ng iyong inihasik sa bukid; at ang Kapistahan ng Pagtitipon ng Ani[c] sa pagtatapos ng taon[b], kapag tinitipon mo mula sa bukid ang iyong mga pinaghirapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pista” sa dalawang paglitaw ng salitang Hebreo na חַג.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “sa paglabas ng taon.”
    reason: lexical_alternative
  - marker: c
    text: Ang “Pagtitipon ng Ani” ay tumutukoy sa kapistahang ipinagdiriwang kaugnay ng pagtipon ng mga bunga mula sa bukid.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: Kapistahan
  rationale: Ipinahahayag nito ang isang itinakdang masayang pagdiriwang na panrelihiyon at angkop itong gamitin sa pangalan ng mga kapistahan.
- source_word: הַקָּצִיר
  choice: Pag-aani
  rationale: Natural itong katawagan sa Filipino para sa pag-aani at malinaw bilang pangalan ng kapistahang kaugnay ng ani.
- source_word: בִּכּוּרֵי
  choice: mga unang bunga
  rationale: Pinananatili nito ang agrikultural at panrelihiyong diwa ng unang bahagi ng ani.
- source_word: מַעֲשֶׂיךָ
  choice: mga bunga ng iyong paggawa
  rationale: Ang literal na diwa ay 'mga gawa mo,' ngunit sa kontekstong agrikultural tumutukoy ito sa bungang nalikha ng paggawa. Pinananatili ng salin ang kaugnayan ng ani sa paggawa ng tao.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: mula sa inihasik mo sa bukid
  rationale: Natural sa modernong Filipino at pinananatili ang tuwirang pagtukoy sa itinanim ng kausap sa bukid.
- source_word: הָאָסִף
  choice: Pagtitipon ng Ani
  rationale: Ipinakikita nito ang pagtipon ng bunga mula sa bukid at malinaw na gumaganap bilang pangalan ng kapistahan.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: sa pagtatapos ng taon
  rationale: Ito ang natural na temporal na kahulugan ng literal na pariralang 'sa paglabas ng taon.'
- source_word: בְּאָסְפְּךָ
  choice: kapag tinipon mo
  rationale: Natural na temporal na salin ng infinitive construct at pinananatili ang ikalawang panauhang isahan.
- source_word: מִן הַשָּׂדֶה
  choice: mula sa bukid
  rationale: Direkta at natural na salin ng pariralang nagsasaad ng pinagmulan.
