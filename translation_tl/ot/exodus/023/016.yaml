review_pass:
  verdict: revise
  source_fidelity: 'Ang salin ay tapat sa pangunahing diwa ng Hebreo: dalawang kapistahang pang-ani ang binanggit, kasama ang mga unang bunga at ang pagtipon mula sa bukid. Gayunman, ang “mula sa inihasik mo” ay nagpapalit sa ugnayang relatibo ng אֲשֶׁר (“na/ang iyong inihasik”) tungo sa isang ugnayang pinagmulan. Sa hulihan, ang “mga bunga ng iyong paggawa” ay katanggap-tanggap sa kontekstong agrikultural ngunit masyadong inuulit ang “bunga” at bahagyang pinakikitid ang מַעֲשֶׂיךָ.'
  naturalness: Marangal at malinaw ang rehistro. Mas natural at mas tuwirang Filipino ang “ng iyong inihasik sa bukid” kaysa “mula sa inihasik mo sa bukid.” Ang “kapag tinitipon mo” ay mas mahusay na tumutugma sa pangkalahatan/temporal na gamit ng infinitive construct kaysa sa aspektong natapos na “kapag tinipon mo.”
  terminology: Ang “Kapistahan,” “Pag-aani,” “mga unang bunga,” at “Pagtitipon ng Ani” ay angkop at pare-pareho. Pinananatili ang tradisyonal ngunit nauunawaang katawagang “mga unang bunga,” nang hindi nagdaragdag ng doktrinal na pakahulugan.
  issues:
  - severity: medium
    issue: Ang “mula sa inihasik mo sa bukid” ay hindi ganap na sumasalamin sa אֲשֶׁר תִּזְרַע בַּשָּׂדֶה.
    rationale: Ang Hebreo ay relatibong sugnay na “na/ang iyong inihasik sa bukid,” hindi tahasang pariralang “mula sa.” Maaaring panatilihin ang likas na Filipino sa pamamagitan ng “ng iyong inihasik sa bukid.”
  - severity: low
    issue: Ang “kapag tinipon mo” ay may aspektong maaaring basahing natapos na, at inuulit ng “mga bunga” ang nauna nang “mga unang bunga.”
    rationale: Ang בְּאָסְפְּךָ ay temporal na “kapag/sa pagtitipon mo.” Ang “kapag tinitipon mo ... ang iyong mga pinaghirapan” ay natural, pinananatili ang ikalawang panauhan, at hinahayaan ang kontekstong agrikultural na magpaliwanag sa ‘mga gawa/pinaghirapan.’
  revised_text: at ang Kapistahan[a] ng Pag-aani, ang mga unang bunga ng iyong paggawa, ng iyong inihasik sa bukid; at ang Kapistahan ng Pagtitipon ng Ani[c] sa pagtatapos ng taon[b], kapag tinitipon mo mula sa bukid ang iyong mga pinaghirapan.
