  rationale: Binago ang unang sugnay upang maipakita ang relatibong “iyong inihasik sa bukid,” sa halip na magpahiwatig ng pinagmulan sa pamamagitan ng “mula sa.” Binago rin ang huling pandiwa sa imperpektibong “tinitipon mo,” at ang pangngalan sa “iyong mga pinaghirapan,” upang maging mas natural sa modernong Filipino habang nananatiling bukas ang saklaw ng Hebreong מַעֲשֶׂיךָ sa kontekstong agrikultural. Hindi binago ang mga pangalan ng kapistahan o ang mga talababa.
