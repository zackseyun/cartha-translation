base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: tl
  text: Paglingkuran ninyo si Yahweh na inyong Diyos, at pagpapalain niya ang inyong tinapay[a] at tubig; at aalisin ko ang karamdaman[b] sa gitna ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “tinapay” ay maaari ring tumukoy nang mas malawak sa pagkain o panustos.
    reason: lexical_alternative
  - marker: b
    text: O “sakit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Paglingkuran ninyo
  rationale: Ang עבד ay tumutukoy sa paglilingkod na may kasamang pagsamba at katapatan sa tipan. Pinananatili ng “paglingkuran” ang mas malawak na diwa kaysa sa “sambahin” lamang, at malinaw na maramihan ang kausap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Ang anyong maramihan ng hulaping paari ay tumutugma sa maramihang kausap, samantalang ang אֱלֹהִים ay malinaw na tumutukoy sa iisang Diyos na si Yahweh.
- source_word: וּבֵרַךְ
  choice: at pagpapalain niya
  rationale: Sa konteksto, ang anyong ganap ay nagpapahayag ng ipinangakong bunga ng paglilingkod. Ginawang lantad ang ipinahihiwatig na simuno na si Yahweh.
- source_word: לַחְמְךָ
  choice: ang inyong tinapay
  rationale: Pinananatili ang literal at kongkretong “tinapay,” bagaman maaari itong kumatawan sa pagkain o panustos sa mas malawak na diwa.
- source_word: מֵימֶיךָ
  choice: at tubig
  rationale: Likas sa Tagalog ang kolektibong pangngalang “tubig.” Hindi na inulit ang “inyong” dahil kapuwa nito tinutukoy ang tinapay at tubig, habang nananatiling malinaw ang pag-aari.
- source_word: וַהֲסִרֹתִי
  choice: at aalisin ko
  rationale: Pinananatili ang biglang paglipat ng nagsasalita mula sa ikatlong panauhan (“niya”) tungo sa unang panauhan (“ko”) na nasa Hebreo, sa halip na pakinisin ito.
- source_word: מַחֲלָה
  choice: ang karamdaman
  rationale: Ang “karamdaman” ay dignificado at karaniwang salitang Filipino na sumasaklaw sa sakit o malubhang pagkakasakit nang hindi labis na klinikal.
- source_word: מִקִּרְבֶּךָ
  choice: sa gitna ninyo
  rationale: Ipinahahayag nito ang kolektibo at pangkomunidad na diwa ng parirala, hindi lamang sakit sa loob ng katawan ng isang indibidwal.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa pinagmulang teksto; ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagbabago mula maramihan tungong isahan sa ikalawang panauhan
  choice: Gamitin ang likas na maramihang Filipino sa buong talata
  alternative: Subukang markahan ang isahang mga hulaping paari sa ikalawang bahagi
  rationale: Nagsisimula ang Hebreo sa 2mp ngunit sumusunod ang mga hulaping 2ms bilang kolektibong pagtukoy sa Israel. Walang likas na paraan sa Filipino upang mapanatili ang pormal na pagbabagong ito nang hindi nakalilito; ang “ninyo” ay tapat sa kolektibong kausap.
- issue: Paglipat mula “pagpapalain niya” tungong “aalisin ko”
  choice: Panatilihin ang pagbabago ng panauhan
  alternative: Gawing pare-parehong “pagpapalain ko ... aalisin ko” o “pagpapalain niya ... aalisin niya”
  rationale: Tunay na nasa Hebreo ang pagbabago ng ikatlong panauhan tungo sa unang panauhan. Hindi ito dapat tahimik na ipantay, sapagkat maaaring mahalaga ang retorikal o tekstuwal na tensiyon.
translation_notes:
  register: Modernong Filipino na dignificado ngunit madaling maunawaan. Ginamit ang “Paglingkuran ninyo” upang mapanatili ang covenantal na paglilingkod na maaari ring sumaklaw sa pagsamba. Sinadya ring panatilihin ang pagbabago mula “niya” tungong “ko” sa pinagmulang Hebreo.
