  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: tl
  text: Huwag kang susunod sa nakararami upang gumawa ng masama. Huwag kang magpapatotoo sa isang usapin upang kumiling sa panig ng nakararami at baluktutin ang katarungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Huwag kang sumagot sa isang usapin upang lumihis, kasunod ng nakararami, at baluktutin ang hatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: susunod sa nakararami
  rationale: Ang היה אַחֲרֵי ay idyomatikong nangangahulugang sumunod o pumanig, at ang רַבִּים ay tumutukoy sa marami o nakararami. Likas sa modernong Tagalog ang “susunod sa nakararami” at pinananatili nito ang babala laban sa pagpapadala sa bilang ng karamihan.
- source_word: לְרָעֹת
  choice: upang gumawa ng masama
  rationale: Ang ל na kasama ng anyong pawatas ay nagpapahayag dito ng layunin o bunga. Pinananatili ng “gumawa ng masama” ang malinaw at matinding puwersang moral ng רָעֹת.
- source_word: תַעֲנֶה
  choice: magpapatotoo
  rationale: Sa kontekstong legal ng עַל רִיב, ang ענה ay tumutukoy sa pagsagot o pagsasalita bilang saksi. Nililinaw ng “magpapatotoo” ang hudisyal na tagpo nang hindi nagpapalawak nang labis.
- source_word: עַל רִיב
  choice: sa isang usapin
  rationale: Ang רִיב ay maaaring tumukoy sa alitan, usaping legal, o kaso. Ang “usapin” ay natural at malawak, samantalang ang “magpapatotoo” at “katarungan” ay nagpapanatili sa legal na diwa.
- source_word: לִנְטֹת אַחֲרֵי רַבִּים
  choice: nang kumikiling sa nakararami
  rationale: Ang נטה ay nangangahulugang kumiling o lumihis. Ang pariralang ito ay natural sa Tagalog at inilalarawan ang pagpanig sa nakararami habang pinananatili ang metapora ng pagkiling.
- source_word: לְהַטֹּת
  choice: upang baluktutin ang katarungan
  rationale: Sa legal na konteksto, ang Hiphil ng נטה ay may diwang pagbaling, pagbaluktot, o pagsira sa wastong hatol. Ang “katarungan” ay ipinahihiwatig na layon at ginagawang malinaw ang kahulugan sa Tagalog.
theological_decisions:
- issue: Hudisyal at etikal na puwersa ng huling sugnay
  choice: Gawing tahas ang ipinahihiwatig na legal na layon bilang “katarungan” sa “upang baluktutin ang katarungan.”
  alternative: upang ilihis; upang baluktutin ang hatol
  rationale: Maikli at walang tahasang layon ang huling pawatas sa Hebreo, ngunit ang konteksto ng pagpapatotoo at legal na usapin ay nagpapahiwatig ng pagbaluktot sa hatol o katarungan. Nililinaw ito ng salin nang hindi nagdaragdag ng doktrinal na pakahulugan.
- issue: Ugnayan ng לִנְטֹת sa patotoo
  choice: 'Iugnay ito sa paraan o layunin ng pagpapatotoo: “nang kumikiling sa nakararami.”'
  alternative: upang lumihis, kasunod ng nakararami
  rationale: Maaaring unawain ang anyong pawatas bilang layunin o bunga. Pinananatili ng “nang kumikiling” ang semantikong tensiyon habang nagbibigay ng natural na sintaks sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nakararami” sa halip na mas kolokyal na “karamihan” upang mapanatili ang pag-uulit at legal na tono ng Hebreo. Ang tandang [a] ay inilagay sa pangunahing teksto at tumutukoy sa alternatibong mas pormal at mas malapit-sa-anyong salin.
