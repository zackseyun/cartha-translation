  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: tl
  text: Lumayo ka sa huwad na usapin[a]. Huwag mong patayin ang walang sala at ang matuwid, sapagkat hindi ko pawawalang-sala ang masama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa kasinungalingan,” “sa huwad na paratang,” o “sa huwad na patotoo.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa salita, usapin, o kasong hindi totoo o mapanlinlang.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sapagkat hindi ko ituturing na matuwid ang may-sala.” Forensiko ang pandiwang Hebreo at maaaring mangahulugang magpahayag na matuwid, magbigay-katwiran, o magpawalang-sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִ/דְּבַר שֶׁקֶר
  choice: sa anumang kasinungalingan
  rationale: Malawak ang saklaw ng דָּבָר—salita, usapin, o kaso. Sa kontekstong legal, likas sa Filipino ang “anumang kasinungalingan” at hindi ito naglilimita sa kahulugan sa huwad na paratang lamang; nililinaw ng talababa ang mas tiyak na mga posibilidad.
- source_word: תִּרְחָק
  choice: Lumayo ka
  rationale: Ang Qal imperfect na may puwersang pautos ay humihiling ng aktibong paglayo, hindi lamang pasibong pag-iwas.
- source_word: וְ/נָקִי
  choice: ang walang sala
  rationale: Ipinapahayag ng נָקִי ang pagiging malaya sa paratang o pagkakasala; malinaw at natural ang “walang sala” sa makabagong kontekstong legal.
- source_word: וְ/צַדִּיק
  choice: ang matuwid
  rationale: Pinananatili ng “matuwid” ang moral at hudisyal na saklaw ng צַדִּיק at ang kaugnayan nito sa ugat na צדק.
- source_word: אַל תַּהֲרֹג
  choice: Huwag mong ipapatay
  rationale: Sa kontekstong tumutukoy sa paglilitis at hatol, natural na ipinahihiwatig ng causative na ekspresyong Filipino ang pagpapataw o pagsasagawa ng kamatayan, nang hindi pinakikitid ang הָרַג tungo sa ‘pagpaslang.’
- source_word: לֹא אַצְדִּיק
  choice: hindi ko pawawalang-sala
  rationale: Forensiko ang Hiphil ng צדק dito. Pinakamalinaw sa ordinaryong Filipino ang “pawawalang-sala” para sa deklarasyong hudisyal na acquittal o vindication.
- source_word: רָשָׁע
  choice: ang masama
  rationale: Pinananatili ng “masama” ang malawak na moral-legal na kahulugan ng רָשָׁע; itinatala sa talababa ang kontekstuwal na alternatibong “may-sala.”
theological_decisions:
- issue: Forensikong diwa ng pahayag ng Diyos
  choice: hindi ko pawawalang-sala ang masama
  alternative: hindi ko ituturing na matuwid ang may-sala
  rationale: Ipinapakita ng pangunahing salin ang hudisyal na diwa ng אַצְדִּיק sa natural na Filipino. Pinananatili sa talababa ang alternatibong nagpapakita ng ugnayang leksikal sa צַדִּיק at ng tensiyon sa pagitan ng moral na ‘masama’ at legal na ‘may-sala.’
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “Lumayo ka” upang mapanatili ang mariing pautos, at ang bokabularyong “walang sala” at “pawawalang-sala” upang maging malinaw ang legal na konteksto. Ang mga talababa ay nagpapanatili sa tunay na lawak at tensiyong leksikal ng Hebreo.
