  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: tl
  text: Tatlong beses sa isang taon ay magdiriwang ka ng isang kapistahan para sa akin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “tatlong paa.” Ang Hebreong idyomang ito ay karaniwang tumutukoy sa tatlong taunang kapistahang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: Tatlong beses
  rationale: Ang literal na anyo ay “tatlong paa,” ngunit isa itong Hebreong idyoma para sa tatlong taunang pagkakataon ng pagdiriwang, na may kaugnayan sa paglalakbay patungo sa santuwaryo.
- source_word: תָּחֹג
  choice: magdiriwang kayo ng isang pista
  rationale: Ang pandiwang חגג ay tumutukoy sa pagdiriwang ng isang relihiyosong pista. Likas sa modernong Tagalog ang “magdiriwang ... ng isang pista” at pinananatili nito ang diwang pangkulto ng utos.
- source_word: לִי
  choice: para sa akin
  rationale: Ipinakikita ng parirala na ang mga pista ay iniaalay o idinaraos para kay YHWH, na siyang nagsasalita.
- source_word: בַּשָּׁנָה
  choice: bawat taon
  rationale: Bagaman literal na “sa taon,” natural na ipinahahayag sa Tagalog ang paulit-ulit na taunang tungkulin bilang “bawat taon.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang pangmaramihang “kayo” upang katawanin ang ikalawang panauhang panlalaki na isahan sa Hebreo bilang utos sa bayang Israel, gaya ng likas na gamit sa Filipino.
