  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: tl
  text: Sa lahat ng sinabi ko sa inyo, mag-ingat kayo. Huwag ninyong banggitin ang pangalan ng ibang mga diyos[a]; huwag marinig ang pangalang iyon mula sa inyong bibig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring, sa mas tiyak na kahulugan: “tawagin” o “sambitin ang pangalan ng ibang mga diyos sa paghingi ng tulong.”'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “huwag itong marinig sa ibabaw ng iyong bibig.” Nag-iisang anyo ang “iyong,” bagaman maramihan ang mga panghalip sa naunang bahagi ng talata.
    reason: literal_rendering
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: Sa lahat ng sinabi ko sa inyo
  rationale: Ipinapanatili nito ang malawak na saklaw ng בְכֹל at malinaw na tumutukoy sa mga tagubiling nauna nang sinabi.
- source_word: תִּשָּׁמֵרוּ
  choice: mag-ingat kayo
  rationale: Ang Niphal ng שׁמר ay may diwang magbantay o mag-ingat sa sarili. Likas at malinaw sa modernong Tagalog ang “mag-ingat kayo” nang hindi labis na tinutukoy kung ang ibig sabihin ay sundin, ingatan, o bantayan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang inilalarawan ng parirala ang mga diyos na iba sa Diyos ng Israel, nang walang idinaragdag na pahayag tungkol sa kanilang kalikasan o pag-iral.
- source_word: לֹא תַזְכִּירוּ
  choice: Huwag ninyong banggitin
  rationale: Maaaring mangahulugan ang Hiphil ng זכר na banggitin, ipaalaala, o tawagin/invoke. Pinananatili ng “banggitin” ang mas malawak na kahulugan ng salitang Hebreo.
- source_word: לֹא יִשָּׁמַע
  choice: huwag itong marinig
  rationale: Pinananatili ang pasibong anyo at ang mariing pagbabawal ng Hebreo.
- source_word: עַל פִּיךָ
  choice: sa inyong bibig
  rationale: Ang literal na larawan ay “sa ibabaw ng iyong bibig.” Ang “sa inyong bibig” ay natural sa Tagalog at tumutukoy sa anumang binibigkas nila.
theological_decisions:
- issue: Saklaw ng pagbabawal sa pangalan ng ibang mga diyos
  choice: Isinalin bilang pagbabawal na banggitin ang kanilang pangalan.
  alternative: Mas tiyak na isalin bilang “huwag ninyong tawagin” o “huwag ninyong sambitin sa panalangin.”
  rationale: Maaaring tumukoy ang konteksto sa pagtawag o panunumpa sa pangalan ng ibang mga diyos, ngunit mas malawak ang tuwirang kahulugan ng זכר. Hindi nilulutas ng salin ang saklaw nang higit sa sinasabi ng teksto.
- issue: Pagbanggit sa “ibang mga diyos”
  choice: Pinanatili ang mismong katawagan ng teksto nang walang paliwanag tungkol sa kanilang ontolohikal na katayuan.
  alternative: Palawakin bilang “mga diyus-diyosan na hindi tunay na diyos.”
  rationale: Hindi tinatalakay ng talatang ito kung ano ang kalikasan o katayuan ng mga tinatawag na ibang diyos; ang idinidiin nito ay ang pagbabawal sa Israel.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mag-ingat kayo” upang mapanatili ang bukas na diwa ng utos, at ang “sa inyong bibig” bilang likas na katumbas ng Hebreong idyoma. Ang paglipat ng Hebreo mula sa maramihang kausap tungo sa nag-iisang “iyong bibig” ay ipinaliwanag sa talababa sa halip na gawing di-likas ang pangunahing teksto.
