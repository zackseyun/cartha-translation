  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: tl
  text: Itatakda ko ang inyong hangganan mula sa Dagat na Pula[a] hanggang sa Dagat ng mga Filisteo, at mula sa ilang hanggang sa Ilog[b]. Sapagkat ibibigay ko sa inyong kamay ang mga naninirahan sa lupain, at palalayasin ninyo sila mula sa inyong harapan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Dagat ng mga Tambo.”'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang Ilog Eufrates.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: Itatakda ko
  rationale: Ang Qal perfect na may pang-ugnay ay may puwersang panghinaharap sa banal na pangako; natural sa Filipino ang “itatakda” para sa pagtatatag ng hangganan.
- source_word: גְּבֻלְךָ
  choice: ang inyong hangganan
  rationale: Tumutukoy ang גְּבוּל sa heograpikong hangganan; pinananatili rin ng “inyong” ang kolektibong kausap bagaman isahan ang anyong Hebreo.
- source_word: מִיַּם סוּף
  choice: mula sa Dagat na Pula[a]
  rationale: Ginamit ang nakagawiang pangalang heograpiko para madaling makilala, habang inilalahad sa talababa ang mas literal na “Dagat ng mga Tambo.”
- source_word: יָם פְּלִשְׁתִּים
  choice: Dagat ng mga Filisteo
  rationale: Tuwirang pinananatili ang etniko-heograpikong katawagan ng Hebreo sa halip na tahasang tukuyin ito bilang Mediteraneo.
- source_word: וּמִמִּדְבָּר
  choice: at mula sa ilang
  rationale: Ang “ilang” ay natural, marangal, at malawak na katumbas ng מִדְבָּר bilang lupaing kakaunti ang naninirahan.
- source_word: הַנָּהָר
  choice: sa Ilog[b]
  rationale: Pinananatili ang tiyak ngunit hindi pinangalanang “Ilog” ng Hebreo; tinutukoy sa talababa ang karaniwang referent nito.
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikita ang ugnayang nagbibigay-dahilan sa naunang pangako.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: ibibigay ko sa inyong kamay
  rationale: Pinananatili ang konkretong idyomang Hebreo ng pagbibigay sa kamay, na malinaw ding nagpapahiwatig ng pagpapasailalim sa kapangyarihan.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: ang mga naninirahan sa lupain
  rationale: Natural na isinasalin ang participle bilang mga taong naninirahan, nang hindi dinaragdagan ang pagkakakilanlan nila.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: at palalayasin ninyo sila
  rationale: Ang גרשׁ ay nangangahulugang magtaboy o magpalayas; malinaw at angkop sa konteksto ang “palalayasin.”
- source_word: מִפָּנֶיךָ
  choice: mula sa inyong harapan
  rationale: Pinananatili ang larawang “mula sa harapan ninyo” ng Hebreo habang nananatiling nauunawaan sa modernong Filipino.
theological_decisions:
- issue: Heograpikong katawagang יַם סוּף
  choice: Dagat na Pula
  alternative: Dagat ng mga Tambo
  rationale: Ang “Dagat na Pula” ang kinikilalang tradisyonal na pangalan, ngunit pinananatili sa talababa ang mas literal at leksikal na posibleng pagbasa.
- issue: Pagkakakilanlan ng הַנָּהָר
  choice: Ilog sa pangunahing teksto, na kinilalang Eufrates sa talababa
  alternative: Ilog Eufrates sa pangunahing teksto
  rationale: Hindi tahasang binabanggit ng Hebreo ang pangalang Eufrates, kaya pinananatili ang anyo ng teksto at ibinibigay ang karaniwang heograpikong pagkakakilanlan bilang paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “inyong/ninyo” upang ipakita ang kolektibong Israel bilang kausap, kahit isahan ang morpolohiya ng ilang panghalip at pandiwa sa Hebreo. Pinanatili ang mga larawang “sa inyong kamay” at “mula sa inyong harapan” dahil malinaw pa rin ang mga ito sa Filipino.
