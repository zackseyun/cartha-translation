source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: tl
  text: Ipagdiwang mo ang Pista ng Tinapay na Walang Pampaalsa. Sa loob ng pitong araw ay kakain ka ng tinapay na walang pampaalsa, gaya ng iniutos ko sa iyo, sa takdang panahon sa buwan ng Abib, sapagkat sa buwang iyon ay lumabas ka sa Ehipto. At walang sinumang haharap sa akin[a] nang walang dala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa harap ng aking mukha,” isang idyomang nangangahulugang “sa harap ko” o “sa aking presensiya.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “At hindi sila haharap sa akin nang walang dala.” Mula sa ikalawang panauhang isahan, lumilipat ang Hebreo sa pandiwang nasa ikatlong panauhang maramihan sa sugnay na ito.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Pista ng Tinapay na Walang Pampaalsa
  rationale: Ang חַג ay isang itinakdang kapistahan, at ang מַצּוֹת ay tinapay na walang pampaalsa. Ang “Pista” ay natural at malinaw sa makabagong Filipino.
- source_word: תִּשְׁמֹר
  choice: Ipagdiwang mo
  rationale: Sa kontekstong pangkulto at pangkautusan, ang שׁמר ay nangangahulugang tuparin o sundin ang itinakdang pagdiriwang. Mas natural dito ang “ipagdiwang” kaysa sa literal na “ingatan.”
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Sa loob ng pitong araw ay kakain ka ng tinapay na walang pampaalsa
  rationale: Pinananatili nito ang haba ng panahon at ang tuwirang utos, habang gumagamit ng natural na ekspresyon sa Filipino.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: gaya ng iniutos ko sa iyo
  rationale: Tapat itong naghahatid sa paghahambing at sa tuwirang utos ng nagsasalita.
- source_word: לְמוֹעֵד
  choice: sa takdang panahon
  rationale: Ang מוֹעֵד dito ay ang nakatalagang panahon sa kalendaryo para sa pagdiriwang.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: buwan ng Abib
  rationale: Pinananatili ang Abib bilang pangalang pangkalendaryo sa halip na palitan ito ng kahulugang “murang uhay.”
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: sapagkat sa buwang iyon ay lumabas ka sa Ehipto
  rationale: Nililinaw ng “sa buwang iyon” ang tinutukoy ng panghalip na בוֹ, at pinananatili ng “lumabas ka” ang ikalawang panauhang isahan ng Hebreo.
- source_word: וְלֹא יֵרָאוּ פָנַי
  choice: At walang sinumang haharap sa akin
  rationale: Ang Niphal ng ראה kasama ng פָנַי ay idyomang nangangahulugang humarap sa presensiya ng Diyos. Natural na naipapahayag sa Filipino ang di-tiyak na maramihan sa pamamagitan ng “walang sinuman.”
- source_word: רֵיקָם
  choice: nang walang dala
  rationale: Ang רֵיקָם ay “walang laman” o “walang dala.” Hindi tahasang idinagdag ang “handog,” bagaman ipinahihiwatig iyon ng konteksto.
theological_decisions:
- issue: Paglalarawan sa pagharap sa Diyos
  choice: haharap sa akin
  alternative: makikita sa harap ng aking mukha
  rationale: Ang literal na “aking mukha” ay isang Hebreong idyoma para sa pagharap sa presensiya ng Diyos. Ang “haharap sa akin” ay natural at hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Paglipat ng gramatikal na panauhan sa huling sugnay
  choice: walang sinumang haharap
  alternative: hindi sila haharap
  rationale: Ang pandiwang Hebreo ay ikatlong panauhang maramihan matapos ang mga utos sa ikalawang panauhang isahan. Ipinapahayag ng “walang sinuman” ang di-tiyak na saklaw nang natural, habang itinatala sa talababa ang pagbabagong gramatikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ikalawang panauhang isahan sa pangunahing utos sa pamamagitan ng “mo/ka/iyo,” ang pangalang Abib, at ang pahiwatig ng רֵיקָם nang hindi tahasang dinaragdagan ng salitang “handog.”
