base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: tl
  text: Huwag kang tumanggap ng suhol, sapagkat binubulag ng suhol ang mga nakakakita nang malinaw[a] at binabaluktot ang mga salita ng mga matuwid[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang mga may unawa.” Pinananatili ng Hebreo ang larawan ng malinaw na paningin habang ipinahihiwatig ang mahusay na pagpapasiya.
    reason: lexical_alternative
  - marker: b
    text: Sa kontekstong legal, ang “mga salita ng mga matuwid” ay maaari ring unawain bilang “mga pahayag” o “usapin” ng mga nasa tama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: suhol
  rationale: Karaniwang makabagong salitang Filipino para sa bayad na ibinibigay upang impluwensiyahan o baluktutin ang paghatol.
- source_word: לֹא תִקָּח
  choice: Huwag kang tatanggap
  rationale: Likas na paraan sa Filipino ng pagpapahayag ng tuwirang pagbabawal; ipinahihiwatig ng “tatanggap” na ang suhol ay iniaalok at kinukuha.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng pagbabawal at angkop sa marangal na rehistro ng batas.
- source_word: יְעַוֵּר
  choice: binubulag
  rationale: Pinananatili ang matalinghagang larawan ng pagkabulag habang malinaw na nagpapahiwatig ng pagsira sa wastong paghatol.
- source_word: פִּקְחִים
  choice: ang mga nakakakita nang malinaw
  rationale: Pinananatili ang larawan ng paningin sa Hebreo at kasabay na nagpapahiwatig ng malinaw na pagkaunawa o paghatol.
- source_word: וִיסַלֵּף
  choice: binabaluktot
  rationale: Malinaw at masiglang katumbas ng pagpilipit o paglihis sa mga salita, pahayag, o usapin.
- source_word: דִּבְרֵי
  choice: ang mga salita ng
  rationale: Pinananatili ang malawak na kahulugan ng Hebreong דָּבָר; sa kontekstong legal maaari rin itong tumukoy sa mga pahayag o usapin.
- source_word: צַדִּיקִים
  choice: mga matuwid
  rationale: 'Pinananatili ang parehong moral at legal na puwersa: maaaring tumukoy sa mga taong matuwid o sa mga nasa tama sa isang usapin.'
theological_decisions:
- issue: Saklaw ng צַדִּיקִים
  choice: mga matuwid
  alternative: mga nasa tama
  rationale: Hindi nililimitahan ang teksto sa legal na kawalang-sala lamang; pinananatili ang tunay na lawak ng salitang Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang “kang” ayon sa 2ms ng Hebreo at sa tuwirang pananalita ng batas. Pinanatili ang larawan ng pagkabulag at pagbaluktot, pati ang legal at moral na lawak ng huling parirala.
