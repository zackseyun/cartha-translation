  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: tl
  text: Sa loob ng anim na taon, hahasikan mo ang iyong lupain at titipunin mo ang ani nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bunga nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Sa loob ng anim na taon
  rationale: Ginawang likas na panandang temporal sa Tagalog ang pariralang may pang-ugnay, sa halip na panatilihin ang literal ngunit mabigat na panimulang “At.”
- source_word: תִּזְרַע
  choice: hahasikan mo
  rationale: Ang imperfect na ikalawang panauhang panlalaki sa kontekstong legal ay may puwersang nag-uutos; ang anyong panghinaharap sa Tagalog ay likas na naghahayag ng itinakdang gawain.
- source_word: אַרְצֶךָ
  choice: ang iyong lupain
  rationale: Tumutukoy ito sa lupaing sinasaka, hindi sa daigdig sa pangkalahatan; pinananatili rin ng “iyong” ang ikalawang panauhang isahan ng Hebreo.
- source_word: וְאָסַפְתָּ
  choice: at titipunin
  rationale: Pinananatili ng “titipunin” ang malawak na diwa ng pag-iipon o pagkuha ng ani nang hindi ito nililimitahan sa isang tiyak na paraan ng pag-aani.
- source_word: תְּבוּאָתָהּ
  choice: ang bunga nito
  rationale: Ang “bunga” ay natural at pangkalahatang tawag sa iniluluwal ng lupain, habang malinaw na ibinabalik ng “nito” ang hulaping pambabae sa “lupain.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hahasikan” kaysa sa mas kolokyal na “tataniman” upang mapanatili ang tiyak na kilos ng paghahasik sa Hebreo; ang “bunga” ay madaling maunawaan ngunit sapat na malawak para sa תְּבוּאָה.
