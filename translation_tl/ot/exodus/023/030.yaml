  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: tl
  text: Unti-unti ko silang[a] itataboy palayo sa iyo, hanggang sa dumami ka at maangkin mo ang lupain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, pang-isahang “siya”; malamang na kolektibong tumutukoy ito sa mga naninirahan o mga bayan sa lupain.
    reason: lexical_alternative
  - marker: b
    text: O “manahin mo ang lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Unti-unti
  rationale: Likas na idyomang Tagalog ito para sa inuulit na מְעַט at malinaw na nagpapahayag ng dahan-dahang pagkilos sa paglipas ng panahon.
- source_word: אֲגָרְשֶׁנּוּ
  choice: ko silang palalayasin
  rationale: Ang גרשׁ ay nangangahulugang “palayasin” o “itaboy.” Bagaman pang-isahang panlalaki ang hulaping Hebreo, kolektibo ang tinutukoy nito sa konteksto; kaya mas malinaw at natural sa Tagalog ang “sila,” habang itinatala sa talababa ang anyong pang-isahan.
- source_word: מִפָּנֶיךָ
  choice: mula sa harapan mo
  rationale: Pinananatili nito ang konkretong idyoma ng Hebreo tungkol sa mukha o presensiya, at nauunawaan pa rin sa marangal na modernong Tagalog bilang pagpapaalis sa lugar na nasa harap o kinaroroonan ng kausap.
- source_word: עַד אֲשֶׁר
  choice: hanggang sa
  rationale: Karaniwan at tumpak na panandang Tagalog para sa hangganan o layunin ng unti-unting pagkilos.
- source_word: תִּפְרֶה
  choice: dumami ka
  rationale: Sa konteksto, ang פרה ay tumutukoy sa paglago ng bilang ng Israel hanggang makaya nilang punuin at sakupin ang lupain. Mas likas dito ang “dumami” kaysa literal na “maging mabunga.”
- source_word: וְנָחַלְתָּ
  choice: maangkin mo
  rationale: Saklaw ng נחל ang pagtanggap bilang mana at ang pagkakaroon bilang pag-aari. Ipinahahayag ng “maangkin” ang aktuwal na pagtataglay nang hindi ganap na inaalis ang diwang tumanggap ng lupaing ipinagkaloob.
- source_word: אֶת־הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa partikular na lupaing ipinangako sa konteksto; ang “lupain” ay pamantayan, malinaw, at marangal na salin.
theological_decisions:
- issue: Pang-isahang hulaping layon na kolektibo ang tinutukoy
  choice: Isinalin sa pangmaramihang “sila” para sa likas at malinaw na Tagalog, na may talababa tungkol sa literal na anyong Hebreo.
  alternative: “Siya” o “iyon,” na mas tuwirang susunod sa gramatikal na pang-isahan ngunit maaaring magpalabo sa kolektibong tinutukoy.
  rationale: Pang-isahang panlalaki ang אֲגָרְשֶׁנּוּ, ngunit ang tinutukoy sa konteksto ay ang mga naninirahan o mga bayan bilang isang kolektibo. Pinananatili ng talababa ang tekstuwal na tensiyon nang hindi ginagawang di-likas ang pangunahing salin.
- issue: Saklaw ng kahulugan ng נחל
  choice: “maangkin mo ang lupain”
  alternative: “manahin mo ang lupain”
  rationale: Maaaring mangahulugan ang pandiwa ng pagmana o pagtanggap bilang pag-aari, ngunit sa kontekstong ito ay tampok din ang aktuwal na paninirahan at pagtataglay. Ang pangunahing salin ay gumagamit ng “maangkin,” samantalang pinananatili sa talababa ang “manahin” bilang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “unti-unti,” “dumami,” at “maangkin” bilang natural na mga katumbas, habang pinanatili sa mga talababa ang mahalagang gramatikal at leksikal na mga alternatibo.
