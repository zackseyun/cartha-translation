  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: tl
  text: Sapagkat mauuna sa iyo ang aking anghel[a] at dadalhin ka niya sa mga Amorreo, mga Heteo, mga Perezeo, mga Cananeo, mga Heveo, at mga Jebuseo; at lilipulin ko sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking sugo.” Ang salitang Hebreo na מַלְאָךְ ay maaaring tumukoy sa isang taong sugo o sa isang makalangit na anghel; sa kontekstong ito, ang “anghel” ay angkop sa banal na paggabay.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lilipulin ko siya/iyon.” Isahan ang hulaping layon ngunit kolektibo nitong tinutukoy ang mga bayang nakalista, kaya “sila” ang ginamit sa salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang paliwanag o batayan na inihahayag ng talata kaugnay ng naunang pangako at utos.
- source_word: יֵלֵךְ ... לְפָנֶיךָ
  choice: mauuna sa iyo
  rationale: Likas na salin sa modernong Tagalog ng paglakad sa unahan bilang pangunguna at paggabay.
- source_word: מַלְאָכִי
  choice: aking anghel
  rationale: Maaaring mangahulugang sugo o anghel ang מַלְאָךְ; anghel ang pinakamalinaw sa konteksto ng banal na paggabay, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: וֶהֱבִיאֲךָ
  choice: dadalhin ka niya
  rationale: Tuwirang ipinapahayag ng Hiphil ng בוא ang pagpaparating o pagdadala; nilinaw ng panghalip ang anghel bilang paksa nang hindi nagdaragdag ng bagong kahulugan.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: mga Amoreo, mga Heteo, mga Perezeo, mga Cananeo, mga Heveo, at mga Jebuseo
  rationale: Ginamit ang nakaugaliang anyong Filipino ng mga pangalang etniko at ang “mga” upang ihayag ang kolektibong kahulugan ng mga anyong gentiliko sa Hebreo.
- source_word: וְהִכְחַדְתִּיו
  choice: at lilipulin ko sila
  rationale: Ipinahahayag ng Hiphil ng כחד ang pagpapawi o lubos na paglipol. Bagaman isahan ang hulaping layon sa Hebreo, kolektibo nitong tinutukoy ang nakalistang mga bayan kaya likas sa Tagalog ang “sila.”
theological_decisions:
- issue: Pagkakakilanlan at kalikasan ng מַלְאָכִי
  choice: aking anghel
  alternative: aking sugo; isang pagpapakita ng PANGINOON; ang Anak bago nagkatawang-tao
  rationale: Ang talata ay tumatawag lamang sa tauhan na anghel o sugo ng Diyos. Hindi ito higit na kinikilala ng salin upang hindi ipasok ang isang tiyak na interpretasyong teolohikal.
- issue: Bilang ng layon sa וְהִכְחַדְתִּיו
  choice: sila, bilang kolektibong pagtukoy sa mga bayang nakalista
  alternative: siya/iyon, ayon sa gramatikal na isahan ng hulapi
  rationale: Isahan ang anyong Hebreo ngunit kolektibo ang tinutukoy. Mas malinaw at natural sa Tagalog ang maramihang “sila,” habang itinatala sa talababa ang anyong literal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mauuna sa iyo” sa halip na mas makalumang “lalakad sa harap mo,” at pinanatili ang “anghel” kasama ng talababa upang hindi mawala ang leksikal na posibilidad na “sugo.”
