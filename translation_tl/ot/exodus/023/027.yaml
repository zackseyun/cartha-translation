base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: tl
  text: “Ipapadala ko sa unahan mo ang aking sindak[a]. Lilituhin ko[b] ang lahat ng taong iyong daratnan, at papatakasín ko sa harap mo ang lahat ng iyong kaaway[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang aking sindak”; maaari ring “ang aking pangamba” o “ang aking takot.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “guguluhin ko,” “ilalagay ko sa matinding kaguluhan,” o “papanikahin ko.”
    reason: lexical_alternative
  - marker: c
    text: 'Idyomang Hebreo: “ibibigay ko sa iyo ang lahat ng iyong kaaway bilang likod o batok,” ibig sabihin, tatalikod sila at tatakas sa harap mo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  choice: ang sindak na mula sa akin
  rationale: Ang אֵימָה ay matinding sindak o pangamba. Nililinaw ng pariralang “mula sa akin” na ito ang takot na ipinadadala at idinudulot ng Diyos, nang hindi magmukhang ang Diyos mismo ang natatakot.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: Ipapadala ko sa unahan mo
  rationale: Pinananatili nito ang larawan ng isang bagay na ipinadadala bago dumating ang kausap at natural ito sa makabagong Tagalog.
- source_word: וְהַמֹּתִי
  choice: Lilituhin ko
  rationale: Ang pandiwang המם ay tumutukoy sa paglalagay sa kaguluhan, sindak, o kalituhan. Hindi muna nito ipinapalagay ang ganap na pagkatalo sa mismong sugnay.
- source_word: כָּל הָעָם אֲשֶׁר תָּבֹא בָהֶם
  choice: ang lahat ng bayang mapapasok mo
  rationale: Ang singular na עָם ay kolektibong tumutukoy sa mga bayang daratnan. Ang “mapapasok mo” ay nagpapanatili sa diwa ng pagpasok sa gitna nila at hindi nagdaragdag ng tahasang “sasalakayin.”
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: patatalikurin ko sa iyo ang lahat ng iyong kaaway
  rationale: Pinananatili nito ang konkretong larawang Hebreo ng mga kaaway na naghaharap ng kanilang likod o batok dahil umatras sila, sa halip na palitan agad ng paliwanag na “patatakasin.”
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa sindak at pagkatalo ng mga kaaway
  choice: 'Pinanatili ang Diyos bilang tahasang gumagawa: “Ipapadala ko,” “Lilituhin ko,” at “patatalikurin ko.”'
  alternative: Mga pahayag na nagpapalabnaw o ginagawang di-tuwiran ang pagkilos ng Diyos.
  rationale: Ang tekstong Hebreo ay gumagamit ng tahasang mga pandiwa sa unang panauhan na ang Diyos ang simuno. Hindi dapat palambutin ng salin ang pahayag tungkol sa kaniyang aktibong pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “bayan” bilang kolektibong tawag sa mga populasyong daratnan, at pinanatili sa pangunahing teksto ang larawang “patatalikurin” habang ipinaliwanag sa talababa ang idyoma ng pagtakas.
