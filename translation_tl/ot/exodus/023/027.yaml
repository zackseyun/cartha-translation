  - severity: medium
    issue: Malabo ang direksiyon at idyomatikong kahulugan ng “patatalikurin ko sa iyo.”
    rationale: Sa karaniwang Tagalog, ang “tatalikod sa iyo” ay maaari ring mangahulugang iiwan o sasalungatin ka. Sa Hebreo, ang larawan ay ng mga kaaway na umurong at tumakas sa harap ng kausap.
