  to: Mag-ingat ka sa harap niya[a] at pakinggan mo ang kanyang tinig. Huwag kang maghimagsik laban sa kanya, sapagkat hindi niya patatawarin ang inyong pagsalangsang, dahil ang aking pangalan ay nasa kanya.
