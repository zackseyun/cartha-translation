base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: tl
  text: Mag-ingat ka sa harap niya[a] at pakinggan mo ang kanyang tinig. Huwag kang maghimagsik laban sa kanya, sapagkat hindi niya patatawarin ang inyong pagsalangsang, dahil ang aking pangalan ay nasa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘mag-ingat ka sa kanya’ o ‘mag-ingat ka sa kanyang presensya.’ Ang ‘ang aking pangalan ay nasa kanya’ ay maaari ring isaling ‘ang aking pangalan ay nasa loob niya’ o ‘nasa kalooban niya’; sa mas malayang salin, ‘taglay niya ang aking pangalan.’ Ipinahihiwatig ng parirala ang ipinagkatiwalang banal na awtoridad, ngunit hindi tahasang ipinapaliwanag ng talata ang eksaktong likas ng mensahero.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Mag-ingat ka sa harap niya
  rationale: Pinananatili ang mariing babala ng Niphal imperative at ang relational na diwa ng literal na ‘mula/sa harap ng kanyang mukha,’ nang hindi ginagawang simpleng ‘mag-ingat sa kanya,’ na maaaring magpahiwatig na likas siyang panganib.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: at pakinggan mo ang kanyang tinig
  rationale: Malapit ito sa Hebreong pananalita at hinahayaang ipahiwatig ng konteksto ang kasamang diwa ng pagsunod, sa halip na tuwirang ipalit ang ‘sundin.’
- source_word: אַל תַּמֵּר בּוֹ
  choice: Huwag kang maghimagsik laban sa kanya
  rationale: Ang מרה ay tumutukoy sa paghihimagsik o tahasang pagsuway sa awtoridad; ipinapahayag ng ‘maghimagsik laban’ ang bigat ng babalang tipan.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: hindi niya patatawarin ang inyong pagsuway
  rationale: Ang נשא kapag ginagamit kaugnay ng kasalanan ay maaaring mangahulugang magpatawad o mag-alis ng sala. Natural sa modernong Tagalog ang ‘patatawarin,’ habang ang kolektibong פשע ay isinaling ‘pagsuway’ upang maipakita ang sadyang paglabag.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: ang aking pangalan ay nasa kalooban niya
  rationale: Ang בְּקִרְבּוֹ ay literal na ‘sa loob/kalooban niya.’ Pinananatili ng salin ang matibay ngunit hindi lubos na ipinaliwanag na ugnayan ng pangalan ng Diyos sa mensahero, sa halip na agad itong gawing ‘taglay niya ang aking pangalan.’
theological_decisions:
- issue: Ang likas na pagkakakilanlan ng mensahero at ang kahulugan ng pangalan ng Diyos na nasa kalooban niya
  choice: Panatilihing malapit sa Hebreo ang pahayag nang hindi tinutukoy kung ang mensahero ay isang nilikhang anghel na binigyan ng ganap na awtoridad o isang tuwirang pagpapakita ng presensya ng Diyos.
  alternative: Isalin nang mas interpretibo bilang ‘taglay niya ang aking pangalan,’ na nagbibigay-diin sa ipinagkatiwalang banal na awtoridad.
  rationale: Malinaw sa talata ang natatanging banal na awtoridad ng mensahero, ngunit hindi nito tahasang nilulutas ang eksaktong likas niya. Kaya pinananatili ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang isahang ‘ka/mo’ dahil isahan ang mga utos sa Hebreo, ngunit ‘inyong’ sa pagsuway dahil maramihan ang hulaping כֶם, na tumutukoy sa sambayanan bilang kabuuan.
