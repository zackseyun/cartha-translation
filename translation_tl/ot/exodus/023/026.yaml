  source_fidelity: Tumpak ang salin sa Hebreo. Ang “Walang babaeng makukunan o baog” ay angkop na pagsasalin ng negatibong eksistensiyal na pahayag kasama ng dalawang pambabaeng participial/adjectival na anyo; pinananatili rin nito ang saklaw na “sa iyong lupain.” Ang “Lubos kong pupunuin ang bilang ng iyong mga araw” ay malapit sa metapora ng אֲמַלֵּא at sa idiomang tumutukoy sa ganap na takdang haba ng buhay.
