  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: tl
  text: Walang babaeng makukunan o baog sa iyong lupain.[a] Lubos kong pupunuin ang bilang ng iyong mga araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mawawalan ng anak.” Mas malawak ang maaaring kahulugan ng salitang Hebreo, ngunit dahil katambal ito ng “baog” sa kontekstong ito, malamang na tumutukoy ito sa pagkalaglag ng dinadalang sanggol o pagkawala ng anak sa panganganak.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Pupunuin ko ang bilang ng iyong mga araw,” ibig sabihin, dadalhin ng Diyos ang haba ng iyong buhay sa buong takdang sukat nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: babaeng makukunan
  rationale: Sa pagkakaugnay nito sa עֲקָרָה at sa pangakong pagpapala sa pag-aanak, tumutukoy ito rito sa babaeng nawawalan ng dinadalang anak. Ang “makukunan” ay natural sa modernong Filipino at hindi lumalampas sa ipinahihiwatig ng konteksto.
- source_word: עֲקָרָה
  choice: baog
  rationale: Karaniwan at tuwirang salitang Filipino para sa kawalan ng kakayahang magkaanak, at angkop sa konteksto ng pagpapala sa pag-aanak.
- source_word: בְּאַרְצֶךָ
  choice: sa iyong lupain
  rationale: Tumutukoy sa lupaing tinitirhan at ipinagkakaloob sa Israel; pinananatili ng “lupain” ang kontekstong tipan.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: ang bilang ng iyong mga araw
  rationale: Malapit sa idyomang Hebreo at nauunawaan bilang takdang haba ng buhay.
- source_word: אֲמַלֵּא
  choice: Lubos kong pupunuin
  rationale: Pinananatili ang metapora ng מלא, “punuin/gawing ganap,” habang nililinaw ng “lubos” na dadalhin ang haba ng buhay sa buong takdang sukat nito.
- source_word: לֹא תִהְיֶה
  choice: Walang
  rationale: Natural na eksistensiyal na pahayag sa Filipino para sa “hindi magkakaroon/mayroon,” nang hindi binabago ang saklaw ng pangako.
theological_decisions:
- issue: Saklaw ng pangako tungkol sa pag-aanak at haba ng buhay
  choice: 'Inilalahad ang pangako bilang pagpapalang kaugnay ng tipan sa lupain: walang makukunan o baog, at mapupuno ang takdang bilang ng mga araw.'
  alternative: Isang pangkalahatan at walang-kondisyong pangako na walang sinumang mananampalataya sa anumang panahon ang makukunan, magiging baog, o mamamatay nang maaga.
  rationale: Ang agarang konteksto ay ang mga pangako ni YHWH sa Israel tungkol sa buhay sa lupain. Hindi pinalalawak ng salin ang pangako lampas sa tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “makukunan” bilang likas na katumbas ng participial na diwa sa konteksto, at pinanatili sa pangunahing teksto ang Hebreong metapora ng pagpuno sa bilang ng mga araw.
