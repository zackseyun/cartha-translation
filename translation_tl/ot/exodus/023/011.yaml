  source_fidelity: 'Tumpak ang pangunahing diwa: ang lupang tinutukoy mula sa naunang talata ay hindi sasakahin sa ikapitong taon, makakakain ang mga dukha, at ang matitira ay para sa mga hayop sa parang. Gayunman, ang “ang matira nila” ay hindi likas at hindi malinaw sa Filipino. Ang “ang matitira” ay mas tapat sa Hebreong ‘ang kanilang nalalabi/ang natitira.’'
  naturalness: Marangal at madaling maunawaan ang rehistro. Inayos ang hulíng sugnay sa “ang matitira ay kakainin ng mga maiilap na hayop” upang maging natural at malinaw ang sintaks.
