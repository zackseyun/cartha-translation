  to: Ngunit sa ikapitong taon, hahayaan mo itong mamahinga at iiwan mo itong hindi sinasaka[a], upang makakain ang mga dukha ng iyong bayan; at ang matitira ay kakainin ng mga maiilap na hayop sa parang[b]. Gayundin ang gawin mo sa iyong ubasan at taniman ng olibo.
  rationale: Pinalitan ang hindi likas na “ang matira nila” ng “ang matitira,” na malinaw na tumutukoy sa nalalabi matapos kumain ang mga dukha at pinananatili ang saklaw ng Hebreo. Inayos din ang pariralang ukol sa mga dukha upang mas tuwirang maipahayag ang ugnayang “ng iyong bayan.”
