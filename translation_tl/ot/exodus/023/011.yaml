base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: tl
  text: Ngunit sa ikapitong taon, hahayaan mo itong mamahinga at iiwan mo itong hindi sinasaka[a], upang makakain ang mga dukha ng iyong bayan; at ang matitira ay kakainin ng mga maiilap na hayop sa parang[b]. Gayundin ang gawin mo sa iyong ubasan at taniman ng olibo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “palalayain mo ito at pababayaan mo ito.” Idiniriin ng dalawang pandiwang Hebreo ang paghinto sa karaniwang pagsasaka at ang pag-iwang hindi sinasaka sa ikapitong taon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hayop sa parang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Ngunit sa ikapitong taon
  rationale: Ginawang pariralang panahunan ang ordinal at ipinahayag ng “ngunit” ang kaibahan nito sa naunang anim na taon.
- source_word: תִּשְׁמְטֶנָּה
  choice: hahayaan mo itong mamahinga
  rationale: Sa kontekstong pansakahan, ang ugat na שׁמט ay tumutukoy sa pagpapalaya sa lupa mula sa karaniwang pagsasaka; malinaw at natural itong naipahahayag ng “hahayaan mo itong mamahinga.”
- source_word: וּנְטַשְׁתָּהּ
  choice: at iiwan mo itong hindi sinasaka
  rationale: Pinananatili ng “iiwan” ang diwa ng נטשׁ na pag-iwan o pagpapabaya, habang nililinaw ng konteksto na ang lupa ay hindi sasakahin, hindi na tuluyang tatalikuran.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: ang mga dukha sa iyong bayan
  rationale: Ang אביון ay mga dukha o nangangailangan; ang “sa iyong bayan” ay likas na Filipino para sa mga kabilang sa sambayanan ng kausap.
- source_word: וְיִתְרָם
  choice: ang matira nila
  rationale: Isinasalamin nito ang pangmaramihang hulapi at ang natirang ani matapos kumain ang mga dukha.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: ay makakain ng maiilap na hayop sa parang
  rationale: Ang חַיַּת הַשָּׂדֶה ay karaniwang tawag sa mga hayop na ligaw; natural sa modernong Filipino ang “maiilap na hayop sa parang.”
- source_word: כֵּן תַּעֲשֶׂה
  choice: Gayundin ang gawin mo
  rationale: Maikli at tuwirang utos ito na ilapat ang parehong tuntunin sa mga susunod na taniman.
- source_word: לְכַרְמְךָ
  choice: sa iyong ubasan
  rationale: Ang כֶּרֶם ay ubasan, at ang “sa” ay angkop sa paglalapat ng utos dito.
- source_word: לְזֵיתֶךָ
  choice: taniman ng olibo
  rationale: Bagaman nasa anyong isahang kolektibo ang זית, tumutukoy ito rito sa taniman ng mga punong olibo, na kahilera ng ubasan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang anyong tuwirang utos at ang dalawang magkaugnay ngunit hindi ganap na magkaparehong pandiwa tungkol sa pagpapahinga at pag-iwan sa lupa.
