  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶל פְּנֵ֖י הָ/אָדֹ֥ן יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: tl
  text: Tatlong beses sa isang taon, haharap ang bawat lalaki sa inyo sa Panginoong Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang Panginoong Yahweh,” isang banal na titulo na sinusundan ng personal na pangalang Yahweh.'
    reason: Nililinaw ang di-karaniwang pagsasama ng titulong “Panginoon” at ng banal na pangalang “Yahweh.”
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Tatlong beses sa isang taon
  rationale: Likas at tuwirang ipinapahayag nito ang tatlong takdang pagkakataon sa taunang siklo.
- source_word: יֵרָאֶה
  choice: haharap
  rationale: Sa kontekstong ito, ang Niphal ng ראה ay idyomatikong tumutukoy sa pagharap o paglitaw sa presensiya ng isang nakatataas; natural sa Filipino ang “haharap.”
- source_word: כָּל זְכוּרְךָ
  choice: ang bawat lalaki sa inyo
  rationale: Pinananatili nito ang tahasang pagtukoy ng Hebreo sa bawat lalaking kabilang sa sambayanan, sa malinaw at kasalukuyang Filipino.
- source_word: אֶל פְּנֵי
  choice: sa
  rationale: Kasama ng pandiwang “haharap,” likas na ipinahihiwatig ng “sa” ang pagharap sa presensiya ng tinutukoy; ang “sa harap ng” ay magiging kalabisan sa Filipino.
- source_word: הָאָדֹן
  choice: Panginoon
  rationale: Ang אָדוֹן ay titulong banal na ang karaniwang marangal na katumbas sa Filipino ay “Panginoon.” Sa anyong parirala, naging “Panginoong” bago ang pangalang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na “Yahweh” ang personal na banal na pangalan sa halip na palitan ito ng isa pang titulo.
theological_decisions:
- issue: Paglalahad sa kombinasyong הָאָדֹן יְהוָה
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS
  rationale: Pinananatili ng “Panginoong Yahweh” ang pagkakaiba ng titulong הָאָדֹן at ng personal na pangalang יְהוָה, nang hindi pinag-iisa ang dalawa bilang mga titulo lamang.
- issue: Saklaw ng כָּל זְכוּרְךָ
  choice: bawat lalaki sa inyo
  alternative: bawat isa sa inyo
  rationale: Tahasang panlalaki ang pangngalang Hebreo, kaya hindi ito ginawang neutral sa kasarian.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na “haharap” sa halip na mas kahoy na “makikita” o mas mabigat na “magpapakita ng sarili.”
