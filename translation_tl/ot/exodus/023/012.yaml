source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: tl
  text: Sa loob ng anim na araw ay gagawin mo ang iyong gawain, ngunit sa ikapitong araw ay titigil ka[a], upang makapagpahinga ang iyong baka at asno, at upang makabawi ng lakas ang anak ng iyong aliping babae[b] at ang dayuhang naninirahan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapahinga ka.” Ang pangunahing kahulugan ng pandiwang Hebreo ay “tumigil” o “huminto.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “anak na lalaki ng iyong aliping babae.”
    reason: lexical_alternative
  - marker: c
    text: Ang tinutukoy ay isang dayuhang naninirahan sa Israel sa ilalim ng kaayusang panlipunan at legal nito.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sa loob ng anim na araw
  rationale: Ipinahahayag ng parirala ang tagal ng panahon; natural sa modernong Tagalog ang “sa loob ng anim na araw.”
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: gagawin mo ang iyong gawain
  rationale: Pinananatili ang legal na utos at ang malawak na kahulugan ng מַעֲשֶׂיךָ bilang gawain, hindi lamang pisikal na paggawa.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת
  choice: ngunit sa ikapitong araw ay titigil ka
  rationale: Natural na ipinakikita ng “ngunit” ang pagsalungat sa anim na araw ng paggawa; ang “titigil” ay nagpapanatili sa pangunahing diwa ng שׁבת na paghinto.
- source_word: לְמַעַן יָנוּחַ
  choice: upang makapagpahinga
  rationale: Malinaw na ipinahahayag ang layunin at ang diwa ng נוח na pamamahinga.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: ang iyong baka at asno
  rationale: Sa kontekstong agrikultural, ang שׁוֹר ay hayop na bovine na ginagamit sa trabaho; mas madaling maunawaan sa karaniwang Tagalog ang “baka” kaysa “barakong baka,” samantalang “asno” ang karaniwang marangal na salin ng חמור.
- source_word: וְיִנָּפֵשׁ
  choice: mapanariwa
  rationale: Ipinahahayag ang muling pagkakaroon ng lakas o ginhawa, na siyang diwa ng Niphal na anyo ng נפשׁ rito.
- source_word: בֶּן אֲמָתְךָ
  choice: ang anak ng iyong aliping babae
  rationale: Pinananatili ang literal na ugnayang panlipunan at ang pagiging walang tiyak na kasarian ng “anak” sa natural na Tagalog, bagaman ang בֶּן ay literal na “anak na lalaki.”
- source_word: הַגֵּר
  choice: ang dayuhang naninirahan sa inyo
  rationale: Inilalarawan nang malinaw ang residenteng dayuhan sa ilalim ng kaayusang panlipunan at legal ng Israel; mas madaling maunawaan ito kaysa sa malabong “estranghero.”
theological_decisions:
- issue: Kahulugan ng שׁבת sa batas tungkol sa ikapitong araw
  choice: titigil ka
  alternative: magpapahinga ka
  rationale: Ang pangunahing diwa ng pandiwa ay paghinto o pagtigil. Hindi nito ipinapalagay na personal na pagpapahinga lamang ang utos; ipinapaliwanag ng kasunod na sugnay ang pahingang dulot nito sa iba.
- issue: Paglalarawan sa גֵּר
  choice: dayuhang naninirahan sa inyo
  alternative: estranghero; nakikipamayang dayuhan
  rationale: Pinananatili nito ang legal at panlipunang kategorya ng isang dayuhang naninirahan sa Israel, at hindi ito ginagawang isang panandaliang bisita lamang.
- issue: Saklaw ng habag sa utos ng ikapitong araw
  choice: hayop, anak ng aliping babae, at residenteng dayuhan ang tahasang nakikinabang
  alternative: pangkalahatang pahayag lamang tungkol sa sambahayan
  rationale: Sinusunod ang partikular na talaan ng tekstong Hebreo at hindi pinapantay o pinalalawak nang walang batayan ang mga kategoryang binanggit.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “titigil” upang mapanatili ang leksikal na diin ng Hebreo, “mapanariwa” para sa muling pagkakaroon ng lakas, at isang malinaw na parirala para sa legal-panlipunang kategoryang גֵּר.
