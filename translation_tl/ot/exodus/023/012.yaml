- from: Sa loob ng anim na araw ay gagawin mo ang iyong gawain, ngunit sa ikapitong araw ay titigil ka[a], upang makapagpahinga ang iyong baka at asno, at upang mapanariwa ang anak ng iyong aliping babae[b] at ang dayuhang naninirahan sa inyo[c].
  to: Sa loob ng anim na araw ay gagawin mo ang iyong gawain, ngunit sa ikapitong araw ay titigil ka[a], upang makapagpahinga ang iyong baka at asno, at upang makabawi ng lakas ang anak ng iyong aliping babae[b] at ang dayuhang naninirahan[c].
  rationale: Pinalitan ang hindi likas na “mapanariwa” ng “makabawi ng lakas,” isang malinaw at tumpak na modernong Tagalog na katumbas ng וְיִנָּפֵשׁ. Inalis ang “sa inyo” upang hindi magdagdag sa tahasang sinasabi ng teksto, samantalang nananatili sa talababa ang kinakailangang paliwanag sa terminong גֵּר. Hindi binago ang saklaw ng mga binanggit na nakikinabang sa paghinto ng paggawa.
