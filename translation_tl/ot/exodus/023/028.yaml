base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: tl
  text: Ipapadala ko ang putakti sa unahan mo[a], at itataboy nito ang mga Hivita, mga Cananeo, at mga Heteo mula sa harapan mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring isang matalinghagang larawan ng sindak o ng iba pang paraan ng panggigipit na ipinadala ng Diyos upang mauna sa Israel; ang salitang Hebreo ay karaniwang nangangahulugang “putakti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: At ipauuna ko
  rationale: Ang Qal perfect na first-person singular, na may prefixed conjunction, ay pangakong tumutukoy sa hinaharap sa konteksto. Likas sa Filipino ang “ipauuna ko” at malinaw na pinananatili ang pagkilos ng Diyos.
- source_word: הַצִּרְעָה
  choice: ang putakti
  rationale: Karaniwang tumutukoy ang pangngalan sa putakti o insektong nanunugat sa pamamagitan ng tibo. Pinananatili ng singular na “ang putakti” ang anyong kolektibo o kumakatawan sa uri, nang hindi ipinapasok sa pangunahing teksto ang posibleng matalinghagang pakahulugan.
- source_word: לְפָנֶיךָ
  choice: sa iyo
  rationale: Sa pariralang “ipauuna ko sa iyo,” naipahahayag nang natural ang pag-una ng ipinadala sa landas ng Israel. Iniiwasan nito ang di-likas na literalismong “sa harap ng iyong mukha.”
- source_word: וְגֵרְשָׁה
  choice: at itataboy nito
  rationale: Ang גרשׁ ay nangangahulugang itaboy o palayasin. Ang “nito” ay tahasang tumutukoy sa putakti at sinasalamin ang feminine singular na pandiwa na umaayon sa הַצִּרְעָה.
- source_word: הַחִוִּי
  choice: ang mga Hivita
  rationale: Karaniwang Filipinong anyo ng etnonimo; ang maramihang anyo ay natural dahil isang pangkat ng mga tao ang tinutukoy.
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Karaniwang makabibliyang Filipinong etnonimo para sa mga Canaanita, na pinananatili ang katangian nitong pangalan ng isang bayan.
- source_word: הַחִתִּי
  choice: mga Heteo
  rationale: Karaniwang Filipinong etnonimo para sa mga Hittita, na angkop sa maramihang pagtukoy sa isang pangkat.
- source_word: מִלְּפָנֶיךָ
  choice: mula sa harapan mo
  rationale: Pinananatili nito ang spatial na larawan ng Hebreo at ang pag-uugnay sa naunang לְפָנֶיךָ, habang malinaw na tumutukoy sa pagpapaalis sa daraanan o presensiya ng Israel.
theological_decisions:
- issue: Kung literal o matalinghaga ang הַצִּרְעָה
  choice: Literal na “ang putakti” sa pangunahing teksto
  alternative: “Sindak,” “pagkalito,” o ibang matalinghagang larawan ng puwersang ipinadala ng Diyos
  rationale: Ang pinakapayak na leksikal na kahulugan ng salitang Hebreo ay putakti o insektong may tibo. Hindi tiyak kung literal ang paraan ng katuparan o kung nagsisilbi itong larawan ng sindak o ibang banal na panggigipit, kaya pinananatili ang literal na salita sa teksto at inilalagay ang posibilidad na matalinghaga sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “ipauuna” upang natural na maipahayag ang pagpadala sa unahan, at pinanatili ang “mula sa harapan mo” upang maingatan ang spatial na larawan ng Hebreo.
