base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: tl
  text: Huwag kang yumukod sa kanilang mga diyos ni maglingkod sa mga diyos na iyon, at huwag mong tularan ang kanilang mga ginagawa. Sa halip, lubusan mong gibain ang mga iyon at lubusan mong durugin ang kanilang mga sagradong haliging bato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga sagradong haligi” o “mga nakatayong bato.” Ang salitang Hebreo ay tumutukoy sa mga monumentong bato na may kaugnayan sa pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: yumukod
  rationale: Pinananatili nito ang kongkretong kilos ng pagyukod bilang pagpaparangal, sa halip na agad itong gawing mas malawak na salitang “sumamba.”
- source_word: לֵאלֹהֵיהֶם
  choice: sa kanilang mga diyos
  rationale: Likas na katambal sa Filipino ng “yumukod” ang “sa,” at malinaw na tumutukoy ito sa mga diyos ng mga bansang iyon.
- source_word: תָעָבְדֵם
  choice: maglingkod sa mga iyon
  rationale: Tuwirang ipinapahayag ng עבד ang paglilingkod, kasama rito sa konteksto ang panrelihiyong paglilingkod, nang hindi ito ipinapantay lamang sa naunang kilos ng pagyukod.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: tularan ang kanilang mga ginagawa
  rationale: Natural itong Filipino para sa literal na “gumawa ayon sa kanilang mga gawa” at malinaw na ipinagbabawal ang paggaya sa kanilang mga gawain.
- source_word: כִּי
  choice: sa halip
  rationale: Sa kontekstong ito, nagpapakilala ang כִּי ng mariing pagsalungat sa mga naunang ipinagbabawal.
- source_word: הָרֵס תְּהָרְסֵם
  choice: lubusan mong gibain ang mga iyon
  rationale: Ipinahahayag ng “lubusan” ang diin ng infinitive absolute na kasunod ng pandiwa. Pinananatili ng “ang mga iyon” ang pagkaluwag ng reperensiya ng hulaping panghalip.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: at durugin
  rationale: Ang “durugin” ay angkop sa mariing pagwasak sa mga bagay na bato; ang kabuuang paralelismo at “lubusan” sa unang sugnay ay nagdadala ng diin sa magkapares na utos.
- source_word: מַצֵּבֹתֵיהֶם
  choice: kanilang mga sagradong haliging bato
  rationale: Ipinakikita nito na ang מַצֵּבָה ay isang nakatayong monumentong bato na kaugnay ng pagsamba, hindi isang karaniwang haligi ng gusali.
theological_decisions:
- issue: Uri ng mga ipinagbabawal na kilos sa mga banyagang diyos
  choice: Magkahiwalay na isinalin ang pagyukod at paglilingkod.
  alternative: Pagsamahin o ipakahulugan ang dalawang pandiwa bilang “sumamba.”
  rationale: Dalawang magkaibang pandiwa ang ginamit sa Hebreo. Ang pagpapanatili sa dalawa ay sumasaklaw kapwa sa panlabas na pagpaparangal at sa patuloy na panrelihiyong paglilingkod.
- issue: Tinutukoy ng utos na gibain
  choice: Pinanatili ang panghalip na “ang mga iyon,” habang nililinaw ng kasunod na sugnay ang pagwasak sa mga bagay na panrelihiyon.
  alternative: Tahasang palitan ang panghalip ng “kanilang mga diyus-diyosan” o “mga bagay na ginagamit nila sa pagsamba.”
  rationale: Hindi tahasang inuulit ng Hebreo ang pangngalan. Ang panghalip ay nagpapanatili sa retorikal na puwersa at tunay na kaluwagan ng reperensiya, samantalang ang pagbanggit sa mga haliging bato ay nag-uugnay sa utos sa nasasalat na mga bagay ng kulto.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinanatili ang isahang “kang/mong” dahil isahang panlalaki ang anyo ng utos sa Hebreo, bagaman kolektibong kinakatawan nito ang Israel. Iniwasan ang sobrang teknikal na bokabularyo; ipinaliwanag sa talababa ang kultikong kahulugan ng haliging bato.
