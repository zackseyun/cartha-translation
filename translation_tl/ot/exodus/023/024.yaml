  to: Huwag kang yumukod sa kanilang mga diyos ni maglingkod sa mga diyos na iyon, at huwag mong tularan ang kanilang mga ginagawa. Sa halip, lubusan mong gibain ang mga iyon at lubusan mong durugin ang kanilang mga sagradong haliging bato.[a]
