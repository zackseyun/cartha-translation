  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: tl
  text: At huwag kang magpakita ng pagkiling sa isang dukha sa usapin niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “parangalan ang isang dukha sa kaso niya.” Mas literal na maaaring mangahulugang “parangalan” ang pandiwang Hebreo, ngunit sa kontekstong panghukuman ay tumutukoy ito sa pagpapakita ng pabor o pagkiling.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: At
  rationale: Likas na iniuugnay nito ang pagbabawal sa naunang mga tuntunin nang hindi nagdaragdag ng tahasang pagsalungat.
- source_word: דָל
  choice: isang dukha
  rationale: Tumutukoy ang isahang anyo sa isang taong mahirap o mababa ang kalagayang panlipunan o pangkabuhayan; malinaw at marangal sa modernong Tagalog ang “isang dukha.”
- source_word: לֹא תֶהְדַּר
  choice: huwag kang magpakita ng pagkiling
  rationale: Bagaman maaaring literal na mangahulugang “parangalan” ang pandiwa, sa kontekstong panghukuman ay tumutukoy ito sa pagbibigay ng di-makatarungang pabor.
- source_word: בְּרִיבוֹ
  choice: sa usapin niya
  rationale: Ang רִיב ay maaaring tumukoy sa alitan o kasong legal. Pinananatili ng “usapin” ang lawak ng salita at ang panghukuman nitong diwa sa konteksto, habang ang “niya” ay kumakatawan sa hulaping ikatlong panauhang panlalaki.
theological_decisions:
- issue: Pagkalinga sa dukha at kawalang-kinikilingan sa paghatol
  choice: Ipinagbabawal ng talata ang pagkiling pabor sa dukha sa legal niyang usapin.
  alternative: Iniuutos ng talata na parangalan ang dukha sa pangkalahatan.
  rationale: Ipinakikita ng agarang kontekstong panghukuman at ng pariralang “sa usapin niya” na patas na paghatol ang paksa. Hindi nito itinatanggi ang pagkalinga sa dukha, ngunit hindi rin iyon ang tiyak na utos ng talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at tuwiran. Ginamit ang “dukha” upang tukuyin ang mababang kalagayang pangkabuhayan nang hindi nagiging kolokyal; pinili ang “usapin” sa halip na mas makitid na “demanda” upang mapanatili ang saklaw ng רִיב.
