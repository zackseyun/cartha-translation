base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: tl
  text: Ang unang bahagi ng mga unang ani ng iyong lupa[a] ay dalhin mo sa bahay ni Yahweh, na iyong Diyos. Huwag mong pakuluan ang batang kambing[b] sa gatas ng ina nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang unang ani ng iyong lupa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, gedi; karaniwan itong nangangahulugang batang kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: ang pinakauna sa mga unang ani
  rationale: Pinananatili nito ang konkretong diwa ng רֵאשִׁית bilang unang bahagi at ang kultikong kahulugan ng בִּכּוּרִים bilang unang ani, nang hindi ito tahasang binibigyang-kahulugang ‘pinakamainam.’
- source_word: אַדְמָתְךָ
  choice: mula sa iyong lupa
  rationale: Ang אֲדָמָה ay tumutukoy sa lupang pinagmumulan ng ani; malinaw sa Filipino ang ‘mula sa iyong lupa’ at hindi nito nililimitahan ang kahulugan sa prutas lamang.
- source_word: תָּבִיא
  choice: ay dalhin mo
  rationale: Ang anyong pandiwa ay isang legal na tagubilin. Ang ‘dalhin mo’ ay likas at tuwirang pautos sa modernong Filipino.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: sa bahay ni Yahweh na iyong Diyos
  rationale: Pinananatili ng ‘bahay’ ang malawak na kahulugan ng santuwaryo at hindi ipinapalagay ang mas huling gusali ng templo; isinasalin ang banal na pangalan bilang Yahweh.
- source_word: לֹא תְבַשֵּׁל
  choice: huwag mong pakuluan
  rationale: Mas tiyak ang ‘pakuluan’ kaysa sa pangkalahatang ‘lutuin’ at angkop sa pariralang nagsasabing nasa gatas ito.
- source_word: גְּדִי
  choice: batang kambing
  rationale: Karaniwang tumutukoy ang salita sa isang batang kambing. Malinaw ito sa kasalukuyang Filipino at iniiwasan ang labis na malawak na ‘batang hayop.’
- source_word: בַּחֲלֵב אִמּוֹ
  choice: sa gatas ng ina nito
  rationale: Direkta at natural itong katumbas ng Hebreong parirala at pinananatili ang literal na larawan ng pagbabawal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng pagbabawal na pakuluan ang batang kambing sa gatas ng ina nito
  choice: Panatilihin ang literal na pagbabawal nang walang idinagdag na paliwanag sa pangunahing teksto.
  alternative: Ipaliwanag ito bilang pagbabawal sa isang ritwal ng Canaan, bilang utos laban sa kalupitan, o bilang tuntunin sa paghihiwalay ng mga pagkain.
  rationale: Hindi sinasabi ng Hebreong teksto ang dahilan ng pagbabawal. Kaya hindi dapat ipasok sa salin ang alinman sa mga kalaunang paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang ‘unang ani’ bilang likas na katumbas ng kultikong katawagan, ‘bahay’ sa halip na ‘templo’ upang hindi maging anakronistiko, at payak na anyong pautos para sa legal na tagubilin.
