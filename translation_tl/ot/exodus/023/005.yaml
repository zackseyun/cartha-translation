base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: tl
  text: Kung makita mong nakahiga sa ilalim ng pasan nito ang asno ng taong napopoot sa iyo, at mag-aatubili kang tumulong sa kanya, tiyak na tumulong ka sa pag-alis ng pasan, kasama niya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring unawain ang “kasama niya” bilang “kasama nito,” na tumutukoy sa asno. Maaaring tumukoy ang panlalaking panghalip sa Hebreo sa may-ari o sa hayop.
    reason: alternative_reading
  - marker: b
    text: Ang pandiwang Hebreo ay karaniwang nangangahulugang “iwan” o “pabayaan,” ngunit sa kontekstong ito ay may diwang tumulong, lalo na sa pagpapagaan o pag-aalis ng pasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִרְאֶה
  choice: Kung makita mo
  rationale: Ipinahahayag ng כִּי ang kondisyong karaniwan sa legal na pananalita, at tuwirang isinasalin ng “makita” ang ראה.
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: ang asno ng taong napopoot sa iyo
  rationale: Pinananatili nito ang literal na diwa ng participle na “taong napopoot sa iyo” sa halip na palawakin agad bilang “kaaway.”
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: nakahandusay sa ilalim ng pasan nito
  rationale: Ang רֹבֵץ ay tumutukoy sa hayop na nakahiga o nakabagsak; ang “nakahandusay” ay natural na nagpapakita rito na hindi ito makatayo dahil sa pasan, nang hindi tahasang nagsasabing namatay o nasaktan ito.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: at mag-aatubili kang tulungan siya
  rationale: Mahirap at idyomatiko ang parirala. Ipinahihiwatig nito ang pagpipigil o pag-uurong na tumulong; natural itong naihahayag ng “mag-aatubili.”
- source_word: עָזֹב תַּעֲזֹב
  choice: tiyak na tutulungan mo siyang buhatin iyon
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa utos. Sa konteksto, ang עזב ay may diwang tumulong sa pag-alis o pagbuhat ng pasan, kaya nilinaw ito nang hindi inaalis ang alternatibong leksikal sa talababa.
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Maaaring tumukoy ang panlalaking panghalip sa may-ari o sa asno. Sa pangunahing teksto, inuunawa itong pakikipagtulungan sa may-ari, habang itinatala sa talababa ang ibang posibilidad.
theological_decisions:
- issue: Tinutukoy ng עִמּוֹ
  choice: kasama niya—kasama ng taong napopoot sa iyo
  alternative: kasama nito—kaugnay ng asno
  rationale: Parehong panlalaking isahan sa Hebreo ang may-ari at ang asno, kaya tunay ang kalabuan. Pinili sa teksto ang may-ari dahil sa panlipunang diin ng utos na tulungan kahit ang napopoot sa iyo, ngunit pinanatili sa talababa ang pagbasa na nakatuon sa hayop.
- issue: Kahulugan ng עזב sa konteksto
  choice: tumulong sa pagbuhat o pag-aalis ng pasan
  alternative: iwan o pabayaan
  rationale: Bagaman karaniwang nangangahulugang “iwan” o “pabayaan” ang ugat, hinihingi ng konteksto ang natatanging gamit nito para sa pagtulong sa hayop at may-ari. Hindi tuluyang ikinubli ang leksikal na tensiyon; ipinaliwanag ito sa talababa.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “asno,” “pasan,” at “nakahandusay” bilang malinaw at dignified na bokabularyo. Ang mga panandang [a] at [b] ay inilagay sa dulo ng pangungusap sapagkat kapuwa tumutukoy sa interpretasyon ng huling sugnay.
