revisions:
- from: Kung makita mong nakahandusay sa ilalim ng pasan nito ang asno ng taong napopoot sa iyo, at mag-aatubili kang tulungan siya, tiyak na tutulungan mo siyang buhatin iyon kasama niya.[a][b]
