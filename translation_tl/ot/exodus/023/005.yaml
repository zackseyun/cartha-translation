  naturalness: Hindi natural at nagiging paulit-ulit ang “tutulungan mo siyang buhatin iyon kasama niya.” Mas malinaw at mas idiomatiko ang utos na tumulong sa pag-alis ng pasan kasama ng may-ari.
  terminology: Ang “asno,” “pasan,” at “taong napopoot sa iyo” ay angkop sa makabagong Filipino Tagalog at sapat na malapit sa Hebreo. Ang “nakahiga” ay mas tumpak at hindi nagdaragdag ng pahiwatig ng matinding pagkabuwal.
