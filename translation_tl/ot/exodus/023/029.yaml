  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: tl
  text: Hindi ko sila palalayasin sa harap mo sa loob ng isang taon,[a] baka maging tiwangwang ang lupain at dumami laban sa iyo ang mga ligaw na hayop sa parang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa loob lamang ng iisang taon.” Isahan ang hulaping tumutukoy sa layon sa Hebreo, ngunit malamang na kolektibo itong tumutukoy sa mga naninirahan o kaaway.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga ligaw na hayop sa parang” ay maaari ring isaling “mga hayop sa parang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Hindi ko sila palalayasin
  rationale: Ang גרש ay nangangahulugang “palayasin” o “itaboy.” Bagaman isahan ang hulaping layon sa Hebreo, kolektibo ang tinutukoy nitong mga naninirahan o kaaway sa konteksto, kaya likas at malinaw sa Tagalog ang “sila.”
- source_word: מִפָּנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili nito ang kongkreto at panlunan na diwa ng idyomang Hebreo nang hindi nagiging mabigat sa modernong Tagalog.
- source_word: בְּשָׁנָה אֶחָת
  choice: sa loob ng isang taon
  rationale: Malinaw nitong ipinapahayag ang panahong saklaw; maaari ring unawain bilang “sa loob lamang ng iisang taon.”
- source_word: פֶּן
  choice: upang hindi
  rationale: Natural na Tagalog ito para sa negatibong layunin o kinatatakutang resulta na ipinahihiwatig ng פֶּן.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: maging tiwangwang ang lupain
  rationale: Ang “tiwangwang” ay dignificado ngunit karaniwang nauunawaan, at mahusay na naghahatid ng kalagayang walang tao at napabayaan na saklaw ng שְׁמָמָה.
- source_word: וְרַבָּה עָלֶיךָ
  choice: dumami laban sa iyo
  rationale: Pinananatili ng “dumami” ang payak na kahulugan ng רבה, samantalang ang “laban sa iyo” ay naghahatid ng mapanganib na diwa ng עָלֶיךָ sa konteksto.
- source_word: חַיַּת הַשָּׂדֶה
  choice: mababangis na hayop sa parang
  rationale: Natural sa Tagalog ang pariralang ito para sa mga hayop na ligaw sa bukirin o di-tinatahanang lupain; iniiwasan nito ang malabong literalismong “hayop ng parang.”
