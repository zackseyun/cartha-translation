language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֗ה וַ/יִּקְרָא֙ לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֔ן וַ/יֹּ֥אמֶר אֲלֵ/הֶ֖ם חָטָ֣אתִי הַ/פָּ֑עַם יְהוָה֙ הַ/צַּדִּ֔יק וַ/אֲנִ֥י וְ/עַמִּ֖/י הָ/רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: tl
  text: Nagsugo ang Paraon at ipinatawag sina Moises at Aaron. Sinabi niya sa kanila, “Nagkasala ako sa pagkakataong ito. Si Yahweh ang matuwid[a], at ako at ang bayan ko ang masasama[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Si Yahweh ang makatarungan” o “Si Yahweh ang nasa tama.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ako at ang bayan ko ang nasa mali” o “may sala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Pinananatili nito ang hiwalay na kilos ng pagpapadala ng tauhan bago ang pagpapatawag kina Moises at Aaron.
- source_word: וַיִּקְרָא לְמֹשֶׁה וּלְאַהֲרֹן
  choice: ipinatawag sina Moises at Aaron
  rationale: Likas sa modernong Tagalog ang “ipinatawag” para sa pagpapasundo o pagpapaharap sa mga tao.
- source_word: חָטָאתִי הַפָּעַם
  choice: Nagkasala ako sa pagkakataong ito
  rationale: Tuwirang ipinahahayag ang pag-amin ng Paraon, habang pinananatili ang pansamantalang saklaw na maaaring ipinahihiwatig ng “sa pagkakataong ito.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הַצַּדִּיק
  choice: ang matuwid
  rationale: Pinananatili ang moral at hudisyal na bigat ng salitang Hebreo at ang mariing paghahambing kay Yahweh laban sa Paraon at sa kanyang bayan.
- source_word: וַאֲנִי וְעַמִּי הָרְשָׁעִים
  choice: at ako at ang bayan ko ang masasama
  rationale: Sinusunod ang pagkakasunod sa Hebreo upang maunang idiin ang pananagutan ng Paraon; ang “masasama” ay nagpapanatili sa moral na bigat ng pangmaramihang pang-uri.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang nasa teksto ang banal na pangalan, kaya pinananatili ito bilang pangalan at hindi pinapalitan ng titulo.
- issue: Saklaw ng pahayag na הַצַּדִּיק at הָרְשָׁעִים
  choice: Si Yahweh ang matuwid … ako at ang bayan ko ang masasama
  alternative: Si Yahweh ang nasa tama … ako at ang bayan ko ang nasa mali / may sala
  rationale: Pinananatili ng pangunahing teksto ang moral na puwersa ng mga pang-uring Hebreo, samantalang inilalahad sa mga talababa ang posibleng hudisyal o relasyonal na diwa nang hindi nilulutas ang tunay na saklaw ng pag-amin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ipinatawag” bilang likas na katumbas ng pagpapaharap, ngunit pinanatili ang naunang “nagsugo” upang hindi pagsamahin ang dalawang kilos sa Hebreo. Ang “bayan ko” ay mas natural sa tuwirang pananalita kaysa “aking bayan,” at nananatiling angkop sa dignidad ng salaysay.
