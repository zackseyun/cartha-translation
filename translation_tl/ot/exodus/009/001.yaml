base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: tl
  text: 'Pagkatapos ay sinabi ng PANGINOON kay Moises, “Pumunta ka sa Faraon at sabihin mo sa kanya, ‘Ganito ang sabi ng PANGINOON, ang Diyos ng mga Hebreo: Palayain mo ang aking bayan upang maglingkod sila sa akin.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Pumunta ka sa Faraon
  rationale: Ang literal na ‘pumasok ka sa Faraon’ ay di-likas sa modernong Tagalog; ipinahihiwatig ng parirala ang pagharap o pagpunta sa hari.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ng PANGINOON
  rationale: Pinananatili ang pormulang pangmensahero at isinasalin ang banal na pangalan ayon sa nakaugaliang anyong PANGINOON.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Payagan mong umalis ang bayan ko
  rationale: Ang piel imperative ng שׁלח sa kontekstong ito ay utos na palayain o pahintulutang umalis ang bayan; malinaw at natural ang napiling anyo nang hindi dinaragdagan ang dahilan.
- source_word: וְיַעַבְדֻנִי
  choice: upang maglingkod sila sa akin
  rationale: Sinasaklaw ng עבד ang paglilingkod na may kontekstong panrelihiyon; pinananatili ng ‘maglingkod’ ang lawak nito nang hindi nililimitahan sa ‘sumamba.’
theological_decisions:
- issue: Paglalahad ng tetragrammaton יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang tradisyonal at malawak na nauunawaang salin, na may malaking titik upang maipakitang tumutukoy ito sa banal na pangalan.
- issue: Saklaw ng pandiwang עבד
  choice: maglingkod
  alternative: sumamba
  rationale: Ang ‘maglingkod’ ay mas malawak at higit na tuwirang katumbas, habang nananatiling bukas ang malinaw na dimensiyong pagsamba sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘Faraon,’ ‘mga Hebreo,’ at ‘bayan ko’ bilang natural na mga anyo; pinanatili ang tuwirang pananalita at pormulang propetiko.
