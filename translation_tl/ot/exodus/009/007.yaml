  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: tl
  text: Nagpasugo si Paraon[a], at nakita niyang wala ni isa man sa mga alagang hayop ng Israel ang namatay. Ngunit naging matigas ang puso ni Paraon[b], at hindi niya pinayaang umalis ang mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi sinasabi sa Hebreo kung sino ang isinugo ni Paraon; maliwanag sa konteksto na nagpasugo siya upang alamin ang nangyari.
    reason: implicit_object
  - marker: b
    text: Sa literal na Hebreo, “naging mabigat ang puso ni Paraon,” isang idyoma para sa pagiging matigas o mapagmatigas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Nagpasugo
  rationale: Literal na nangangahulugang ‘nagpadala’ ang pandiwa, ngunit hindi binanggit sa Hebreo kung sino ang isinugo. Likas sa Tagalog ang ‘nagpasugo’ at pinananatili nitong hindi tahasang tinutukoy ang mga sugo o ang layunin ng pagsusugo.
- source_word: וְהִנֵּה
  choice: at nakita niyang
  rationale: Itinatampok ng הִנֵּה ang natuklasan matapos magpasugo si Paraon. Mas natural sa makabagong Tagalog ang ‘nakita niyang’ kaysa sa literal ngunit lipas o matigas na ‘narito,’ habang nananatili ang biglang pagbibigay-pansin sa resulta.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: wala ni isa man sa mga alagang hayop ng Israel ang namatay
  rationale: Ang עַד אֶחָד ay idyomatikong nagsasaad na walang kahit isa. Malawak ang saklaw ng מִקְנֶה at tumutukoy sa mga hayop na pag-aari o inaalagaan, hindi lamang sa baka.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: naging matigas ang puso ni Paraon
  rationale: Literal na ‘naging mabigat ang puso ni Paraon,’ ngunit ang ‘mabigat ang puso’ sa Tagalog ay karaniwang nagpapahiwatig ng lungkot at maaaring makalito. Ipinahahayag ng ‘naging matigas ang puso’ ang idyomatikong diwa ng pagmamatigas nang hindi nagtatalaga ng panlabas na gumawa nito.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: at hindi niya pinayaang umalis ang mga tao
  rationale: Sa konteksto ng Exodo, ang שׁלח na ang bayan ang layon ay nangangahulugang payagang umalis o palayain. Natural at malinaw sa Tagalog ang ‘pinayaang umalis.’
theological_decisions:
- issue: Kung sino ang sanhi ng pagtigas ng puso ni Paraon
  choice: naging matigas ang puso ni Paraon
  alternative: pinatigas ang puso ni Paraon / pinatigas ni Paraon ang kanyang puso
  rationale: Puso ni Paraon ang simuno ng sugnay sa Hebreo, at walang tahasang binanggit na panlabas na tagagawa. Pinananatili ng salin ang tensiyon hinggil sa banal at pantao na pananagutan sa halip na tukuyin ang sanhi.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Paraon’ at payak na ayos ng pangungusap. Iniwasan ang literal na ‘mabigat ang puso’ sa pangunahing teksto dahil karaniwan itong nangangahulugang malungkot sa Filipino; inilagay sa talababa ang larawang Hebreo.
