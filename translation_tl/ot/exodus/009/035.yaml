base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: tl
  text: Kaya naging matigas ang puso ng Paraon[a], at hindi niya pinahintulutang umalis ang mga anak ni Israel[b], gaya ng sinabi ni Yahweh sa pamamagitan ni Moises.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tumigas ang puso ng Paraon.” Ang pandiwang Hebreo ay maaaring mangahulugang “naging malakas o matatag,” dito ay sa diwang matigas na pagtutol.
    reason: alternative_reading
  - marker: b
    text: O “ang mga Israelita”; literal na “ang mga anak na lalaki ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: Literal na “sa kamay ni Moises,” isang idyomang nangangahulugang “sa pamamagitan ni Moises.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: naging matigas
  rationale: Ang pandiwang חזק ay maaaring mangahulugang naging malakas o matatag. Sa salaysay na ito, tumutukoy ito sa matigas at mapambansag na paninindigan ng Paraon. Pinananatili ng “naging matigas” ang pahiwatig na nagkaroon ng ganitong kalagayan nang hindi tahasang itinatakda kung sino ang sanhi.
- source_word: לֵב פַּרְעֹה
  choice: ang puso ng Paraon
  rationale: Likas na pariralang Filipino na pinananatili ang Hebreong larawan ng puso bilang kalooban at panloob na pagpapasiya.
- source_word: שִׁלַּח
  choice: pinahintulutang umalis
  rationale: Sa konteksto ng Exodo, tumutukoy ang pandiwa sa pagtanggi o pagpapahintulot ng Paraon na makaalis ang Israel. Malinaw at natural ito sa makabagong Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang pormal na Hebreong pananalitang “mga anak na lalaki ni Israel,” ngunit ginagamit ang natural at kolektibong Filipino na “mga anak ni Israel.” Maaari rin itong unawain bilang “mga Israelita.”
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Malinaw na ipinapakita ang pagtutugma ng pangyayari sa naunang sinabi ni Yahweh.
- source_word: דִּבֶּר יְהוָה
  choice: sinabi ni Yahweh
  rationale: Natural na salin sa Filipino para sa naunang pahayag ng Diyos na natupad sa pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ang literal na “sa kamay ni Moises” ay isang idyoma ng pamamagitan o ahensiya; malinaw itong ipinahahayag ng saling ito.
theological_decisions:
- issue: Ang sanhi ng pagtigas ng puso ng Paraon
  choice: naging matigas ang puso ng Paraon
  alternative: pinatigas ang puso ng Paraon; nagmatigas ang Paraon
  rationale: Inilalarawan ng anyong Hebreo rito ang puso bilang naging malakas o matatag sa pagtutol, ngunit hindi tahasang tinutukoy sa sugnay na ito kung Diyos o ang Paraon ang tuwirang sanhi. Iniiwasan ng salin na lutasin ang tensiyong hindi nilulutas ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinahintulutang umalis” sa halip na mas lumang “pinayaon,” at pinanatili ang pangalang “Yahweh” at ang metaporang “puso.”
