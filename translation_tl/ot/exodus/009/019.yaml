  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: tl
  text: Kaya ngayon, magpasugo ka at ipasilong mo[a] ang iyong mga alagang hayop at ang lahat ng mayroon ka sa bukid. Ang bawat tao[b] at hayop na matagpuan sa bukid at hindi maipasok sa bahay—babagsakan sila ng graniso, at mamamatay sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “mag-utos ka agad at dalhin sa ligtas na lugar”; ipinahihiwatig ng utos ang agarang pagkilos.'
    reason: lexical_alternative
  - marker: b
    text: Isinasalin dito ang Hebreong adam bilang pangkalahatang katawagan sa mga tao, hindi lamang sa mga lalaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: 'Ipinahahayag ang agarang bunga at paglipat ng diwa: ang וְ ay konnektibo at ang עַתָּה ay “ngayon.”'
- source_word: שְׁלַח הָעֵז
  choice: magpasugo ka at ipasilong
  rationale: Pinananatili ng “magpasugo” ang utos na שְׁלַח, samantalang ipinapahayag ng “ipasilong” ang causative na diwa ng הָעֵז—ang pagdadala o paglalagay sa ligtas na kalagayan. Ang talababa ay nagtatala ng posibleng diin sa pagmamadali.
- source_word: מִקְנְךָ
  choice: iyong mga alagang hayop
  rationale: Ang מִקְנֶה ay tumutukoy sa mga domestikadong hayop bilang pag-aari; malinaw at karaniwan sa Filipino ang “mga alagang hayop.”
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: at ang lahat ng mayroon ka sa bukid
  rationale: Sinasaklaw nito ang lahat ng pag-aari o nasa pangangalaga ng kausap na nasa labas; hindi nililimitahan sa mga hayop lamang.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: ang bawat tao at hayop
  rationale: Kolektibo at distributibo rito ang אָדָם. Ang “bawat tao” ay likas sa Filipino at hindi nagpapasok ng kasariang wala namang kailangang tukuyin sa konteksto; pinananatili rin ang tambalang tao-hayop.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: na matagpuan sa bukid
  rationale: Sinasalamin ng “matagpuan” ang pasibong/Niphal na anyo ng מָצָא.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: at hindi maipasok sa bahay
  rationale: Ang Niphal ng אָסַף ay may pasibong diwang “matipon/maipasok,” at ang hulaping direksiyonal sa הַבַּיְתָה ay nangangahulugang papasok sa bahay. Mas natural sa kasalukuyang Filipino ang “maipasok sa bahay.”
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: babagsakan sila ng graniso
  rationale: Likas na Filipino itong pagpapahayag sa pagbaba ng graniso sa kanila, habang malinaw na sila ang tatamaan.
- source_word: וָמֵתוּ
  choice: at mamamatay sila
  rationale: Ipinahahayag ang tiyak na kahihinatnan ng hindi pagsilong sa kontekstong ito.
theological_decisions:
- issue: Saklaw ng אָדָם sa pangkalahatang babala
  choice: bawat tao
  alternative: bawat lalaki
  rationale: Ang אָדָם dito ay pangkalahatan at kolektibong tumutukoy sa sinumang tao sa bukid, hindi partikular sa mga lalaking nasa hustong gulang. Ang “bawat tao” ang tumpak at likas na katumbas sa Filipino.
- issue: Lakas ng babala tungkol sa kamatayan
  choice: mamamatay sila
  alternative: maaari silang mamatay
  rationale: Hindi posibilidad lamang ang ipinahahayag ng Hebreo; tahasang sinasabi ang kahihinatnan kapag bumagsak sa kanila ang graniso.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bukid” para sa שָׂדֶה at “graniso” para sa בָּרָד. Iniwasan ang sobrang literal na “tipunin sa bahay” dahil hindi ito likas sa Filipino, ngunit pinanatili ang pasibong diwa at direksiyong papasok sa bahay.
