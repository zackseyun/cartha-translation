- from: Kaya iniunat ni Moises ang kanyang tungkod patungo sa langit, at nagpadala si Yahweh ng kulog at graniso. At ang apoy ay bumaba sa lupa.[a] Pinaulanan ni Yahweh ng graniso ang lupain ng Ehipto.
  to: Kaya iniunat ni Moises ang kanyang tungkod patungo sa langit, at nagpadala si Yahweh ng kulog at graniso, at bumaba sa lupa ang apoy.[a] Pinaulanan ni Yahweh ng graniso ang lupain ng Ehipto.
  rationale: Pinagdikit ang magkakasunod na sugnay tungkol sa kulog, graniso, at apoy upang maging mas natural ang daloy sa modernong Filipino at masalamin ang sunod-sunod na pagkakaugnay ng Hebreo. Pinanatili ang lahat ng leksikal at teolohikal na pagpapasya ng draft, kabilang ang “Yahweh” at “apoy.” Bahagya ring pinasimple ang literal na pahayag sa talababa para sa mas idiomatikong Filipino.
