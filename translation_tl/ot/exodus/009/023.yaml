base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: tl
  text: Kaya iniunat ni Moises ang kanyang tungkod patungo sa langit, at nagpadala si Yahweh ng kulog at graniso, at bumaba sa lupa ang apoy.[a] Pinaulanan ni Yahweh ng graniso ang lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa kontekstong ito, malamang na kidlat ang tinutukoy ng “apoy.” Mas literal: “ang apoy ay nagpunta sa lupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: iniunat
  rationale: Karaniwang kahulugan ng נָטָה ang iunat o iabot; natural ang “iniunat” para sa kilos ni Moises na may hawak na tungkod.
- source_word: מַטֵּהוּ
  choice: ang kanyang tungkod
  rationale: Ang מַטֶּה ay tungkod o pamalo; “tungkod” ang malinaw at karaniwang salin sa salaysay tungkol kay Moises.
- source_word: עַל הַשָּׁמַיִם
  choice: patungo sa langit
  rationale: Sa konteksto, ipinahihiwatig ng parirala ang direksiyon ng pag-uunat ng tungkod paitaas. Ang “langit” ay natural na tumutukoy rito sa kalangitan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: nagpadala ... ng kulog at graniso
  rationale: Bagaman literal na “nagbigay ng mga tinig/tunog at graniso,” ang קֹלֹת sa konteksto ng bagyo ay kulog; idiomatiko sa Filipino ang “nagpadala.”
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: ang apoy ay bumaba sa lupa
  rationale: Pinananatili ang larawang “apoy” at ang direksiyong patungo sa lupa, habang gumagamit ng natural na Filipino. Malamang na kidlat ang tinutukoy, ngunit hindi ito ipinapalit sa tahasang salita ng Hebreo.
- source_word: וַיַּמְטֵר
  choice: pinaulanan
  rationale: Ang causative na anyo ng מָטַר ay “nagpaulan” o “nagpaulan pababa”; mahusay na naipapahayag ng “pinaulanan” ang kilos at ang saklaw nito.
- source_word: בָּרָד
  choice: graniso
  rationale: Ito ang karaniwang modernong salitang Filipino para sa hail.
- source_word: אֶרֶץ מִצְרָיִם
  choice: ang lupain ng Ehipto
  rationale: Pinananatili ang tahasang “lupain” ng Hebreo at ang heograpikong saklaw ng salot.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Pagkilala sa אֵשׁ bilang kidlat
  choice: apoy sa pangunahing teksto, na may paliwanag sa talababa
  alternative: kidlat
  rationale: Malamang na kidlat ang tinutukoy sa konteksto ng bagyo, ngunit literal na “apoy” ang salita. Pinananatili nito ang matinding larawan at ang bahagyang interpretatibong tensiyon ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “graniso,” “tungkod,” at “lupain” bilang mga salitang madaling maunawaan ngunit angkop sa salaysay. Inilagay ang marker [a] kaagad pagkatapos ng sugnay na ipinaliliwanag nito.
