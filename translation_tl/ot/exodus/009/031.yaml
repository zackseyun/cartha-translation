translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinili ang “nasalanta” para sa madaling maunawaang paglalarawan ng pinsala sa pananim, at inilagay ang mga panandang talababa kaagad pagkatapos ng mga salitang may tunay na leksikal na alternatibo.
