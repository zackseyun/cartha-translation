base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: tl
  text: Nasalanta ang lino at ang sebada, sapagkat may uhay na ang sebada[a] at namumuko na ang lino.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nahihinog na ang sebada.”
    reason: lexical_alternative
  - marker: b
    text: O “namumulaklak na ang lino.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: ang lino
  rationale: Tumutukoy ang פִּשְׁתָּה sa halamang flax na pinagmumulan ng telang lino. Ang “lino” ang maikli at karaniwang katumbas sa Filipino sa kontekstong agrikultural.
- source_word: הַשְּׂעֹרָה
  choice: ang sebada
  rationale: Tuwirang tumutukoy ang שְׂעֹרָה sa barley; “sebada” ang kinikilalang tawag dito sa modernong Filipino.
- source_word: נֻכָּתָה
  choice: nasalanta
  rationale: Ang pasibong anyo ng נכה ay nagpapahiwatig na tinamaan at napinsala ang mga pananim. Natural na ipinahahayag ng “nasalanta” ang naging epekto ng graniso nang hindi idinaragdag na lubusang nawasak ang mga ito.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan kung bakit madaling napinsala ang dalawang pananim. Ang “sapagkat” ay malinaw at marangal ngunit likas pa rin sa makabagong Filipino.
- source_word: אָבִיב
  choice: may uhay na
  rationale: Inilalarawan ng אָבִיב ang sebada sa yugtong nabuo na ang sariwa at nahihinog na uhay. Pinananatili ng “may uhay na” ang kongkretong larawang agrikultural nang hindi ipinapalagay na ganap na itong hinog.
- source_word: גִּבְעֹל
  choice: namumuko na
  rationale: Tumutukoy ang גִּבְעֹל sa maunlad na yugto ng paglaki ng lino, na maaaring unawaing pagkakaroon ng usbong, bulaklak, o kapsula. Ang “namumuko na” ay maikli at hindi labis na tiyak; itinatala sa talababa ang isa pang makatuwirang salin.
