  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: tl
  text: At magiging pinong alikabok ito sa buong lupain ng Ehipto, at sa mga tao at mga hayop sa buong lupain ng Ehipto ay magiging mga pigsa itong naglalabasan at may mga paltos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: at magiging pinong alikabok iyon
  rationale: Ipinahahayag ng היה ang pagbabagong-kalagayan, at malinaw na inilalarawan ng “pinong alikabok” ang אָבָק sa konteksto ng abo na ikakalat sa hangin.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Natural sa Tagalog ang “sa buong” para sa paglaganap sa saklaw ng buong teritoryo.
- source_word: עַל הָאָדָם
  choice: sa mga tao
  rationale: Kolektibo at pangkalahatan ang אָדָם dito, na inihahambing sa mga hayop; ang “mga tao” ang malinaw at likas na makabagong salin.
- source_word: וְעַל הַבְּהֵמָה
  choice: at sa mga hayop
  rationale: Kolektibo ang בְּהֵמָה at hindi kailangang limitahan sa alagang hayop; ang “mga hayop” ay natural at sapat ang lawak.
- source_word: לִשְׁחִין
  choice: mga pigsa
  rationale: Ang שְׁחִין ay tumutukoy sa eruptibong karamdaman sa balat; karaniwan at malinaw sa Tagalog ang “mga pigsa.”
- source_word: פֹּרֵחַ
  choice: pumuputok
  rationale: Ang participle ay literal na may diwang pagsibol o paglitaw at idyomatikong tumutukoy sa pagputok o paglabas ng sakit sa balat.
- source_word: אֲבַעְבֻּעֹת
  choice: mga paltos
  rationale: Tumutukoy ito sa mga namamagang umbok o blister na kaakibat ng mga pigsa; “mga paltos” ang malinaw na modernong katumbas.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Pinananatili ng pag-uulit ang diin ng Hebreo sa lubos na saklaw ng salot sa Ehipto.
theological_decisions:
- issue: Pagsasalin sa אָדָם bilang pangkalahatang katawagan sa sangkatauhan
  choice: mga tao
  alternative: tao / sangkatauhan
  rationale: Sa kontekstong itinatambal ang tao at hayop, kolektibong tumutukoy ang salita sa lahat ng taong apektado. Ang “mga tao” ay tumpak, natural, at hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang magkakahiwalay na kahulugan ng שְׁחִין, פֹּרֵחַ, at אֲבַעְבֻּעֹת sa halip na pagsamahin ang mga ito sa iisang paglalarawan.
