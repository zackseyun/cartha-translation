revisions:
- from: At magiging pinong alikabok iyon sa buong lupain ng Ehipto, at magiging mga pigsa itong pumuputok na may mga paltos sa mga tao at sa mga hayop sa buong lupain ng Ehipto.
  to: At magiging pinong alikabok ito sa buong lupain ng Ehipto, at sa mga tao at mga hayop sa buong lupain ng Ehipto ay magiging mga pigsa itong naglalabasan at may mga paltos.
  rationale: 'Pinalitan ang “pumuputok” ng “naglalabasan” upang maipahayag ang eruptibong paglitaw ng mga pigsa nang hindi ipinahihiwatig na pumuputok o napupunit ang mga ito. Pinanatili ang tatlong magkakahiwalay na elemento ng Hebreo: mga pigsa, paglitaw ng mga ito, at mga paltos.'
