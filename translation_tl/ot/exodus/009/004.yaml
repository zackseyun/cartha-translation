id: EXO.9.4
reference: Exodus 9:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: tl
  text: Ngunit ibubukod ni Yahweh ang mga alagang hayop ng Israel sa mga alagang hayop ng Ehipto, at wala ni isang hayop na pag-aari ng mga Israelita[a] ang mamamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָה
  choice: ibubukod
  rationale: Ang Hiphil ng פלא ay tumutukoy sa malinaw na pagtatangi o pagbubukod sa dalawang pangkat. Likas sa Tagalog ang “ibubukod ... sa ...” at napananatili nito ang causative na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang banal na pangalang יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בֵּין ... וּבֵין
  choice: ang ... sa ...
  rationale: Sa konstruksiyong “ibubukod ang X sa Y,” likas na naipapahayag sa Tagalog ang paghahambing at pagkakaiba ng dalawang tinutukoy ng Hebreong pares na בֵּין ... וּבֵין.
- source_word: מִקְנֵה
  choice: mga alagang hayop
  rationale: Malawak ang saklaw ng מִקְנֶה at tumutukoy sa mga domestikadong hayop bilang ari-arian, hindi lamang sa mga baka. Mas malinaw at natural sa modernong Tagalog ang “mga alagang hayop.”
- source_word: מִצְרַיִם
  choice: Ehipto
  rationale: Ang pariralang construct ay literal na tumutukoy sa “mga alagang hayop ng Ehipto,” isang pambansang pagtukoy na natural din sa Tagalog.
- source_word: וְלֹא יָמוּת ... דָּבָר
  choice: at wala ni isang hayop ... ang mamamatay
  rationale: Ang negated singular na דָּבָר ay idyomatikong nangangahulugang walang kahit isa. Nilinaw bilang “hayop” ang tinutukoy mula sa agarang konteksto ng מִקְנֵה, nang hindi binabago ang saklaw ng pahayag.
- source_word: מִכָּל לִבְנֵי יִשְׂרָאֵל
  choice: na pag-aari ng mga Israelita
  rationale: Ipinahihiwatig ng לִבְנֵי יִשְׂרָאֵל ang pagmamay-ari o pag-uukol sa bayan ng Israel. Ang “mga Israelita” ay natural na modernong Tagalog; inilagay sa talababa ang literal na pambansang ekspresyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Pagsasalin sa pambansang ekspresyong בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Sa konteksto, ang stock expression ay tumutukoy sa buong bayang Israel, hindi lamang sa mga lalaking anak. Natural at malinaw ang “mga Israelita,” habang pinananatili sa talababa ang literal na anyo.
- issue: Ugnayan ng dalawang sugnay
  choice: at
  alternative: kaya; upang
  rationale: Ang Hebreo ay gumagamit ng payak na וְ. Pinanatili ang “at” upang huwag gawing tahasang layunin o resulta ang isang ugnayang maaaring unawain mula sa konteksto ngunit hindi minarkahan nang tiyak sa gramatika.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “ibubukod ... sa ...” sa halip na mas mabigat na “gagawa ng pagkakaiba sa pagitan,” at nilinaw ang ellipsis sa huling sugnay sa pamamagitan ng “hayop,” batay sa agarang konteksto.
