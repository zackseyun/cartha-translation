base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kina Moises at Aaron, “Kumuha kayo ng mga dakot na puno ng uling[a] mula sa isang hurno[b], at ihagis iyon ni Moises paitaas[c] sa paningin ng Paraon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang kapunuan ng inyong mga palad.” Ang “uling” dito ay maitim na pinong latak (soot) mula sa hurno; maaari rin itong isaling “pinong maitim na abo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pugon.”
    reason: lexical_alternative
  - marker: c
    text: O “patungo sa langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Ang אמר ang karaniwang pandiwa para sa pagsasalita; natural at tuwiran sa Filipino ang “sinabi.”
- source_word: קְחוּ לָכֶם
  choice: Kumuha kayo
  rationale: Ipinakikita ng “kayo” ang maramihang utos kina Moises at Aaron. Hindi na tahasang isinalin ang datibong לָכֶם bilang “para sa inyong sarili” dahil magiging mabigat at hindi kailangan sa natural na Filipino.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: tig-isang buong dakot
  rationale: Ipinahihiwatig ng pariralang Hebreo ang daming pumupuno sa nakakupkop na kamay ng bawat isa. Inililinaw ng “tig-isang” na kapuwa inuutusan sina Moises at Aaron, samantalang pinananatili ng “buong dakot” ang diwa ng מְלֹא.
- source_word: פִּיחַ
  choice: pinong uling
  rationale: Tumutukoy ang פִּיחַ sa maitim at pinong latak o pulbos na mula sa pagsunog, mas tiyak kaysa sa pangkalahatang “abo.” Ang “pinong uling” ay maikli at mauunawaan sa konteksto, habang ipinapaliwanag sa talababa ang saklaw ng salita.
- source_word: כִּבְשָׁן
  choice: hurno
  rationale: Maaaring tumukoy ang salita sa hurno o pugon. Ang “hurno” ay malawak, natural, at hindi labis na tumutukoy sa isang partikular na gamit na industriyal.
- source_word: וּזְרָקוֹ
  choice: at isaboy iyon ni Moises
  rationale: Bagaman maramihan ang unang utos, isahan ang pandiwang ito at si Moises ang tahasang gumaganap. Pinananatili ng ayos na ito ang paglipat mula sa kanilang dalawa tungo kay Moises lamang. Ang “isaboy” ay angkop sa pinong materyal na inihahagis.
- source_word: הַשָּׁמַיְמָה
  choice: paitaas
  rationale: Ipinahihiwatig ng hulaping direksiyon ang paggalaw patungo sa kalangitan. Natural sa pisikal na kilos ang “paitaas,” at iniiwan sa talababa ang mas literal na “patungo sa langit.”
- source_word: לְעֵינֵי פַרְעֹה
  choice: sa harap mismo ng Paraon
  rationale: Ang idyomang literal na “sa mga mata ng Paraon” ay nangangahulugang hayag at nakikita niya. Pinananatili ng “mismo” ang diin nang hindi nagiging asiwa sa Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi ginamit ang “Jehova” dahil mas malayo ito sa malamang na sinaunang bigkas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kina Moises at Aaron” at tuwirang pautos na “Kumuha kayo” para sa natural na daloy. Ang “hurno,” “isaboy,” at “paitaas” ay pangkaraniwang salitang madaling maunawaan ngunit sapat ang pormalidad para sa tekstong banal.
