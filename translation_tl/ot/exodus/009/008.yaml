    rationale: Tumutukoy ang Hebreong idyoma sa pagkilos sa paningin o harap ng mga mata ni Paraon. Ang “sa paningin ng Paraon” ay tuwiran at natural; ang “mismo” ay dagdag na diin na wala sa teksto.
