  verdict: revise
  source_fidelity: Tumpak ang pangunahing balangkas ng utos at ang paglipat mula sa maramihang utos kina Moises at Aaron tungo kay Moises bilang tanging gagawa ng paghahagis. Gayunman, ang “pinong uling” ay karaniwang tumutukoy sa pinulbos na charcoal at maaaring hindi maipakita ang soot na tinutukoy ng פִּיחַ. Ang “sa harap mismo ng Paraon” ay mas mahina kaysa sa idyomang “sa paningin ng Paraon.”
  naturalness: Natural at marangal ang kabuuang daloy, ngunit mas malinaw at mas idiomatiko ang “mga dakot na puno ng uling” kaysa “tig-isang buong dakot,” na maaaring magpahiwatig ng isang tiyak na dami para sa bawat isa. Mas natural din ang “sa paningin ng Paraon” para sa hayag na pagkilos na nasasaksihan niya.
  terminology: Pinanatili ang “Yahweh,” “Moises,” “Aaron,” “hurno,” at “Paraon.” Pinalitan ang “pinong uling” ng “uling,” na maaaring tumukoy sa maitim na latak/soot sa kontekstong ito nang hindi ipinahihiwatig na ito ay charcoal na pinulbos. Nilinaw ang talababa upang tukuyin ang literal na “kapunuan ng inyong mga palad.”
