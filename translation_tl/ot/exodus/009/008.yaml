    issue: Ang “pinong uling” ay maaaring mangahulugang pinulbos na charcoal.
    rationale: Ang פִּיחַ ay soot—maitim na pinong latak mula sa hurno—at hindi pangunahing charcoal. Ang “uling” sa konteksto ng hurno, na nililinaw ng talababa, ay mas ligtas kaysa sa “pinong uling.”
