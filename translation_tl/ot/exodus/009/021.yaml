  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: tl
  text: Ngunit ang sinumang hindi nagbigay-pansin sa salita ni Yahweh ay iniwan sa bukid ang kanyang mga lingkod at mga alagang hayop.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hindi inilagay ang kanyang puso sa salita ni Yahweh,” ibig sabihin, hindi niya ito dinibdib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Ngunit ang sinumang
  rationale: Ipinapakita ng waw at panghalip na pantukoy ang pagsalungat sa mga sumunod sa babala sa naunang talata, habang pinananatili ang di-tiyak na pagtukoy.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: hindi nagbigay-pansin sa
  rationale: Ang literal na idyoma ay ‘hindi inilagay ang kanyang puso sa’; sa konteksto, nangangahulugan itong hindi pinansin o hindi dinibdib ang babala.
- source_word: דְּבַר יְהוָה
  choice: salita ni Yahweh
  rationale: Ang דָּבָר ay tumutukoy rito sa ipinahayag na babala, at pinananatili ng ‘salita’ ang karaniwang biblikal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang banal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעֲזֹב
  choice: iniwan
  rationale: Tumpak at likas itong naglalarawan sa pagpapaiwan sa mga tao at hayop na nakalantad sa bukid.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng alipin o lingkod; ‘mga lingkod’ ang angkop dito dahil ang diin ay nasa mga tauhan ng sambahayan na naiwan sa labas, hindi sa kanilang legal na katayuan.
- source_word: מִקְנֵהוּ
  choice: mga alagang hayop
  rationale: Tumutukoy ang salita sa sama-samang domestikadong hayop o kawan; malinaw at karaniwan sa modernong Filipino ang ‘mga alagang hayop.’
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Payak at natural na katumbas ng lokatibong parirala; malinaw sa konteksto na nakalantad sila sa paparating na graniso.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ginagamit mismo ng Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng ‘hindi inilagay ang puso’
  choice: hindi nagbigay-pansin
  alternative: hindi dinibdib; hindi inilagay ang kanyang puso sa
  rationale: Inihahayag ng pangunahing teksto ang praktikal na diwa ng idyoma nang hindi ipinapalagay ang isang partikular na panloob na motibo; nasa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘nagbigay-pansin’ para sa likas na pagpapahayag ng idyomang Hebreo, habang pinanatili sa talababa ang literal na larawan. Ang ‘mga lingkod’ at ‘mga alagang hayop’ ay pangkaraniwang salitang madaling maunawaan.
