language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: tl
  text: Narito, sasapit ang kamay ni Yahweh sa iyong mga alagang hayop na nasa bukid—sa mga kabayo, mga asno, mga kamelyo, mga baka, at mga tupa at kambing—isang napakatinding salot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakamamatay na epidemya”; ang salitang Hebreo ay tumutukoy sa isang laganap at nakamamatay na sakit na tumatama sa mga alagang hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang biglaan at mariing pagpapakilala sa babala sa paraang likas at marangal sa modernong Tagalog.
- source_word: יַד יְהוָה
  choice: ang kamay ni Yahweh
  rationale: Pinananatili ang Hebreong idyoma para sa kapangyarihan at hatol ng Diyos sa halip na ipaliwanag lamang bilang pagkilos niya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na nakasulat sa tekstong Hebreo.
- source_word: הוֹיָה
  choice: sasapit
  rationale: Ipinahahayag ng anyo ang napipintong pangyayari; ang 'sasapit' ay likas na nagpapakita na darating at tatama ang kamay ni Yahweh.
- source_word: בְּמִקְנְךָ
  choice: sa iyong mga alagang hayop
  rationale: Malawak ang saklaw ng מִקְנֶה at kabilang dito ang iba't ibang uri ng domestikadong hayop na kasunod na inililista.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: na nasa parang
  rationale: Tinutukoy nito ang mga alagang hayop na nasa labas, sa bukas na lupain; mas likas dito ang 'parang' kaysa sa literal ngunit malabong 'bukid.'
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: sa mga kabayo, mga asno, mga kamelyo, mga baka, at mga kawan
  rationale: Pinananatili ang pagkakasunod-sunod ng listahan. Ang 'mga kawan' ay nag-iiwan sa צֹאן ng kolektibo at hindi labis na nililimitahan ito sa tupa lamang.
- source_word: דֶּבֶר
  choice: salot
  rationale: Madaling maunawaan at angkop sa nakamamatay na epidemya sa mga hayop; inilalahad sa talababa ang mas tiyak na diwa.
- source_word: כָּבֵד מְאֹד
  choice: napakatinding
  rationale: Likas na ipinahahayag sa Tagalog ang sukdulang bigat o kalubhaan ng salot.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa Hebreo, kaya pinananatili ang tuwirang pagtukoy rito nang hindi pinapalitan ng isang titulo.
- issue: Idyomang 'kamay ni Yahweh'
  choice: Pinanatili bilang 'kamay ni Yahweh'
  alternative: kapangyarihan ni Yahweh; parusa ni Yahweh
  rationale: Ang idyoma ay maaaring magpahiwatig kapwa ng makapangyarihang pagkilos at paghatol. Ang pagpapanatili rito ay hindi tahimik na naglilimita sa kahulugan sa isa lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang Hebreong idyomang 'kamay ni Yahweh,' samantalang ginawang likas ang pahayag ng napipintong pagdating nito. Inilagay ang talababa sa 'salot,' ang salitang aktuwal na nililinaw nito.
