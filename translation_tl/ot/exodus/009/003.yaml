revisions:
- from: Narito, sasapit ang kamay ni Yahweh sa iyong mga alagang hayop na nasa parang—sa mga kabayo, mga asno, mga kamelyo, mga baka, at mga kawan—sa pamamagitan ng isang napakatinding salot.[a]
  to: Narito, sasapit ang kamay ni Yahweh sa iyong mga alagang hayop na nasa bukid—sa mga kabayo, mga asno, mga kamelyo, mga baka, at mga tupa at kambing—isang napakatinding salot.[a]
  rationale: Inayos ang sintaks upang ang “isang napakatinding salot” ay direktang magpaliwanag sa sasapit na kamay ni Yahweh, nang hindi nagdaragdag ng instrumental na kahulugan. Ginawang mas tumpak ang katumbas ng צֹאן at bahagyang nilinaw ang lokasyon bilang “bukid.” Napanatili ang hinihinging ambiguity at ang footnote anchor sa “salot.”
