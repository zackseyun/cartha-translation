  terminology: Ang “kapangyarihan ko,” “pangalan ko,” at “buong daigdig” ay angkop. Ang “Faraon” sa talababa ay wastong pangalan/titulo. Pinananatili ng talababa ang alternatibong diwa ng pandiwang Hebreo nang hindi ipinipilit na tumutukoy ito sa pagluklok sa katungkulan.
