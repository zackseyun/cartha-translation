base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: tl
  text: 'Ngunit pinanatili kita[a] para sa layuning ito: upang ipakita sa iyo ang kapangyarihan ko, at upang maipahayag ang pangalan ko sa buong daigdig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinatayo kita” o “itinaas kita.” Maaaring mangahulugan ang Hebreo na pinanatili ng Diyos ang Faraon, o hinayaan siyang manatiling buhay, sa halip na agad siyang lipulin.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Ngunit
  rationale: Malinaw na ipinahihiwatig ang matibay na pagsalungat sa naunang pahayag, habang nananatiling natural at marangal sa modernong Tagalog.
- source_word: בַּעֲבוּר זֹאת
  choice: ito ang dahilan kung bakit
  rationale: Ipinahahayag nito ang layunin ng Diyos, hindi lamang ang sanhi, at natural nitong inihahanda ang kasunod na mga sugnay na nagsasaad ng layunin.
- source_word: הֶעֱמַדְתִּיךָ
  choice: pinanatili kita
  rationale: Ang Hiphil ng עמד ay maaaring tumukoy sa pagpapapanatiling nakatayo o patuloy na umiiral. Sa konteksto, hindi agad nilipol ng Diyos ang Faraon. Iniiwasan ng salin ang di-likas na literal na 'pinatayo kita' at hindi rin nito tahasang nililimitahan ang kahulugan sa pagkakaluklok sa tungkulin.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: upang ipakita sa iyo
  rationale: Tuwirang ipinapahayag ang layunin at pinananatili ang Faraon bilang tumatanggap ng ipinakikitang kapangyarihan.
- source_word: כֹּחִי
  choice: ang kapangyarihan ko
  rationale: Ang 'kapangyarihan' ang pinakanatural na katumbas sa salaysay ng mga salot at saklaw nito ang lakas o makapangyarihang pagkilos ng Diyos.
- source_word: וּלְמַעַן
  choice: at upang
  rationale: Malinaw nitong iniuugnay ang ikalawang layunin sa una nang hindi nagdaragdag ng sanhi o resulta na wala sa Hebreo.
- source_word: סַפֵּר
  choice: maipahayag
  rationale: Ang Piel ng ספר ay nangangahulugang isalaysay o ipahayag. Ang anyong walang tiyak na tagaganap ay angkop sa bukas na paksa ng Hebreo at sa pandaigdig na saklaw ng pahayag.
- source_word: שְׁמִי
  choice: ang pangalan ko
  rationale: Pinananatili ang konkretong Hebreong pahayag, na maaaring saklawin ang pagkakakilanlan at katanyagan ng Diyos nang hindi iyon ipinapaliwanag sa mismong teksto.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Sa kontekstong ito, ang pangkalahatang saklaw ng כָּל הָאָרֶץ ay higit na natural na tumutukoy sa buong daigdig kaysa sa isang lokal na lupain lamang.
theological_decisions:
- issue: Kahulugan ng הֶעֱמַדְתִּיךָ kaugnay ng Faraon
  choice: Sinasabi ng Diyos na pinanatili niya ang Faraon—ibig sabihin, hinayaan niya itong patuloy na manatili sa halip na agad lipulin.
  alternative: Itinaas o iniluklok ng Diyos ang Faraon sa kaniyang maharlikang katungkulan para sa layuning ito.
  rationale: Sa agarang konteksto, inihahambing ang maaaring ginawa na ng Diyos—ang lubusang paglipol sa Faraon—sa katotohanang nananatili pa ito. Kaya mas malamang ang diwang pagpapanatili o patuloy na pag-iral. Gayunman, inilalagay sa talababa ang alternatibong pagbasa upang mapanatili ang tunay na lawak ng Hebreo at ang teolohikal na tensiyon tungkol sa soberanya ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang payak na ayos ng pangungusap at ang karaniwang 'kapangyarihan' at 'daigdig,' habang iniwasan ang sobrang literal ngunit di-likas na 'pinatayo kita' sa pangunahing teksto.
