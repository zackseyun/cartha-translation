  text: רַ֚ק בְּ/אֶ֣רֶץ גֹּ֔שֶׁן אֲשֶׁר שָׁ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל לֹ֥א הָיָ֖ה בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: tl
  text: Sa lupain lamang ng Gosen[a], kung saan naroon ang mga anak ni Israel, walang graniso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Sa Hebreo, “ang mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: lamang
  rationale: Naghahayag ito ng pagtatangi o pagbubukod; ang hulaping “lamang” ay natural sa Tagalog at nagpapanatili ng diin na ang Gosen ang tanging eksepsiyon.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: sa lupain ng Gosen
  rationale: Ang “lupain” ay angkop para sa pinangalanang rehiyon, at ang Gosen ay karaniwang anyong Tagalog ng pangalang pook.
- source_word: אֲשֶׁר שָׁם
  choice: kung saan naroon
  rationale: Natural nitong ipinapahayag ang panlunan na kaugnayan at pinananatili ang diwa ng שָׁם, “naroon.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na pampamilyang pananalitang Hebreo habang malinaw at likas pa rin sa modernong Tagalog.
- source_word: לֹא הָיָה בָּרָד
  choice: walang graniso
  rationale: 'Ito ang tuwiran at likas na Tagalog para sa eksistensiyal na pagkakaila: walang naganap o umiral na graniso roon.'
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Ang pinagmulang Hebreo ay literal na “mga anak ni Israel.” Pinananatili ng salin ang pampamilyang larawan nang hindi ipinapalagay na mga lalaki lamang ang buong sambayanan; inilalahad sa talababa ang natural na kolektibong alternatibo.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Ginamit ang “graniso” bilang karaniwang katawagan sa hail at pinanatili ang “mga anak ni Israel” upang maipakita ang anyo ng Hebreo.
