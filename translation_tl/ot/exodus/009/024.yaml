base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: tl
  text: Nagkaroon ng graniso[a], at may apoy na kumikislap sa gitna ng graniso. Napakatindi nito—wala pang naging katulad nito sa buong lupain ng Ehipto mula nang ito ay maging isang bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at may apoy na humahagibis sa gitna ng graniso.” Literal na “apoy” ang salitang Hebreo, at malamang na inilalarawan nito ang mga kislap na tulad ng kidlat sa loob ng bagyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: Nagkaroon ng graniso
  rationale: Natural na salaysay sa Tagalog na pinananatili ang pag-uulat ng pagdating ng graniso.
- source_word: וְאֵשׁ
  choice: at may apoy
  rationale: Pinananatili ang literal at matingkad na larawang 'apoy' sa Hebreo sa halip na tahimik itong ipakahulugang kidlat.
- source_word: מִתְלַקַּחַת
  choice: na kumikislap
  rationale: Ipinahahayag ang gumagalaw o paulit-ulit na pagliyab ng apoy sa bagyo sa natural na modernong Tagalog.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: sa gitna ng graniso
  rationale: Pinananatili ang pambihirang larawan ng apoy na lumilitaw sa loob o kalagitnaan ng graniso.
- source_word: כָּבֵד מְאֹד
  choice: Napakatindi nito
  rationale: Sa paglalarawan ng bagyo, ang idiomatikong diwa ng כבד ay sukdulang tindi, hindi pisikal na bigat lamang.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: wala pang naging katulad nito
  rationale: Natural na Tagalog para sa paghahambing na nagsasabing walang kapantay ang pangyayari.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: sa buong lupain ng Ehipto
  rationale: Tumpak at karaniwang panumbas sa teritoryal na parirala.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: mula nang ito ay maging isang bansa
  rationale: Pinananatili ang historikal na panukat at ang posibilidad na ang tinutukoy ng pambabaeng pandiwa ay ang lupain o bansang Ehipto.
