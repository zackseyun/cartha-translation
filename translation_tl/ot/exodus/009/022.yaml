  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay patungo sa langit[a], at magkaroon ng graniso sa buong lupain ng Ehipto—sa mga tao[b], sa mga hayop, at sa lahat ng halaman sa bukid sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring isaling “kalangitan” o “mga langit”; dito, ang nakikitang langit na pinagmumulan ng graniso ang pangunahing tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa tao.” Ginamit ito sa pangkalahatang diwa para sa mga tao, bilang katapat ng mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Iunat mo ang iyong kamay
  rationale: Tuwirang ipinapahayag ang pautos na anyo ng נָטָה at ang karaniwang kahulugan ng יָד bilang “kamay.”
- source_word: עַל הַשָּׁמַיִם
  choice: patungo sa langit
  rationale: Ang עַל ay direksiyonal dito, at ang “langit” ay likas na salin sa Filipino para sa nakikitang kalangitan na pinagmumulan ng graniso habang nananatiling bukas ang mas malawak na saklaw ng salitang Hebreo.
- source_word: וִיהִי בָרָד
  choice: at magkaroon ng graniso
  rationale: 'Pinananatili ang koordinadong, jussive na diwa: kasunod ng utos na iunat ang kamay ay ang hangaring magkaroon ng graniso.'
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Malinaw at likas na ipinahahayag ang kabuuang saklaw ng parirala.
- source_word: הָאָדָם
  choice: mga tao
  rationale: Bagaman anyong isahan sa Hebreo, pangkalahatan ang tinutukoy nito; ang “mga tao” ay natural na Filipino at malinaw na katapat ng mga hayop.
- source_word: הַבְּהֵמָה
  choice: mga hayop
  rationale: Sapat ang lawak ng “mga hayop” upang hindi paliitin ang termino sa baka lamang o sa isang tiyak na uri ng alagang hayop.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: lahat ng halaman sa bukid
  rationale: Sinasaklaw ng “halaman” ang damo, pananim, at iba pang pananim na maaaring tukuyin ng עֵשֶׂב sa kontekstong ito.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo nang hindi ito pinapalitan ng titulo o ng ibang tradisyonal na anyo.
- issue: Pangkalahatang kahulugan ng הָאָדָם
  choice: mga tao
  alternative: ang tao / sangkatauhan
  rationale: Ang salita ay kolektibo at tumutukoy sa mga taong maaaring tamaan ng graniso, hindi lamang sa isang lalaking indibidwal; hindi rin kinakailangang gawing abstraktong “sangkatauhan.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang pag-uulit ng “sa lupain ng Ehipto” dahil inuulit din ito sa Hebreo upang idiin ang saklaw. Inilagay ang mga talababa sa mismong mga salitang tinatalakay ng mga ito.
