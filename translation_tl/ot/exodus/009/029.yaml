  to: Sinabi ni Moises sa kanya, “Sa sandaling makalabas ako ng lungsod, iuunat ko ang aking mga kamay patungo kay Yahweh. Titigil ang kulog[a], at hindi na magkakaroon ng graniso, upang malaman mo na ang daigdig ay kay Yahweh[b].”
