base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: tl
  text: Sinabi ni Moises sa kanya, “Sa sandaling makalabas ako ng lungsod, iuunat ko ang aking mga kamay patungo kay Yahweh. Titigil ang kulog[a], at hindi na magkakaroon ng graniso, upang malaman mo na ang daigdig ay kay Yahweh[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga tinig” o “mga tunog”; sa konteksto ng bagyong ito, tumutukoy ito sa kulog.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na, “ang lupain ay kay Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: Pagkalabas ko
  rationale: Ang כְ na sinusundan ng infinitive construct at hulaping unang panauhan ay nagsasaad ng oras ng paglabas ni Moises. Likas sa modernong Tagalog ang “Pagkalabas ko” at naipahihiwatig nito na agad niyang gagawin ang kasunod na kilos.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: iuunat ko ang aking mga kamay
  rationale: Ang pariralang ito ay tumutukoy sa pag-uunat o pagbubuka ng mga kamay bilang kilos ng pananalangin. Pinananatili ng salin ang pisikal na larawan sa malinaw at likas na Tagalog.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh / kay Yahweh
  rationale: Isinasalin nang tuwiran ang pangalang tipan na יהוה bilang “Yahweh”; ginamit ang “kay” sa ikalawang paglitaw upang ipahayag ang pagmamay-ari.
- source_word: הַקֹּלוֹת
  choice: ang kulog
  rationale: Bagaman literal na “mga tinig” o “mga tunog,” tumutukoy ito sa kulog sa konteksto ng bagyong may graniso.
- source_word: יֶחְדָּלוּן
  choice: Titigil
  rationale: Tumpak at karaniwang katumbas ng חדל ang “titigil,” at malinaw nitong inilalarawan ang paghinto ng kulog.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: at hindi na magkakaroon ng graniso
  rationale: Ipinahahayag ng sugnay na hindi na iiral o magpapatuloy ang graniso. Likas at malinaw sa modernong Tagalog ang ganitong pagkakasabi.
- source_word: לְמַעַן תֵּדַע
  choice: upang malaman mo
  rationale: Pinananatili ng “upang” ang layuning ipinahahayag ng לְמַעַן nang hindi dinaragdagan ang diwa ng Hebreo.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: na kay Yahweh ang buong lupa
  rationale: Ipinahahayag ng לְ ang pagmamay-ari. Ang “buong lupa” ay likas na Tagalog para sa malawak na saklaw ng הָאָרֶץ, habang ang posibleng kahulugang “lupain” ay inilalahad sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang ginamit sa tekstong Hebreo, kaya pinanatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng הָאָרֶץ
  choice: ang buong lupa
  alternative: ang lupain
  rationale: Maaaring mangahulugan ang הָאָרֶץ ng “lupa/daigdig” o “lupain.” Ang konteksto ng kapangyarihan ni Yahweh sa salot ay umaayon sa mas malawak na “buong lupa,” ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang “lungsod,” “kulog,” at “graniso,” habang pinanatili ang kilos ng pag-uunat ng mga kamay at ang pangalang Yahweh.
