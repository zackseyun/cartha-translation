  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: tl
  text: Nagmamataas ka pa rin ba laban sa aking bayan dahil hindi mo sila pinapalaya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nag-aangat ka pa rin ng sarili laban sa aking bayan” o “nagmamataas ka pa rin sa ibabaw ng aking bayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  choice: Patuloy mo pa bang
  rationale: Ipinahahayag nito ang nagpapatuloy na kalagayan at, ayon sa konteksto, ang retorikal na tanong na tuwirang inihaharap sa Faraon.
- source_word: מִסְתּוֹלֵל
  choice: itinataas ang iyong sarili
  rationale: Pinananatili nito ang mapanumbalik na diwa at ang kahulugan ng mapagmataas na pagpapakataas sa sarili, sa halip na gawing simpleng pagsalungat lamang.
- source_word: בְּעַמִּי
  choice: laban sa aking bayan
  rationale: Likas sa Tagalog ang pariralang ito para sa mapanlaban at mapaniil na tindig ng Faraon, habang pinananatili ang tuwirang pag-angkin ng Diyos sa bayan.
- source_word: לְבִלְתִּי
  choice: sa hindi mo
  rationale: 'Ipinakikita ng parirala kung paano nahahayag ang mapagmataas na pagkilos ng Faraon: sa patuloy niyang hindi pagpapalaya sa bayan.'
- source_word: שַׁלְּחָם
  choice: pagpapalaya sa kanila
  rationale: Sa salaysay ng mga salot, tumutukoy ang pandiwa sa pagpapakawala sa Israel mula sa pagkaalipin; malinaw at natural dito ang “pagpapalaya.”
theological_decisions:
- issue: Ang pag-angkin ng Diyos sa Israel sa pariralang “aking bayan”
  choice: Panatilihin ang “aking bayan” bilang tuwirang pag-angkin ng Diyos sa Israel
  alternative: “ang bayan” o “Israel”
  rationale: 'Mahalaga ang unang-panauhang hulapi sa konteksto ng Exodo: ipinakikita nitong ang paghadlang ng Faraon sa Israel ay pagsalungat din sa Diyos na kumikilala sa kanila bilang kanyang bayan.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinili ang “itinataas ang iyong sarili” upang mapanatili ang larawan at mapanumbalik na diwa ng Hebreo; inilakip sa talababa ang mga posibleng diwa ng pagmamataas at pagpapakataas sa ibabaw ng bayan.
