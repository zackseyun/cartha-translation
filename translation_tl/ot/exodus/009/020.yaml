revisions:
- from: Ang sinuman sa mga lingkod ng Faraon na natakot sa salita ni Yahweh ay dali-daling pinapasok sa mga bahay ang kanyang mga lingkod at mga alagang hayop.[a][b]
  to: Ang sinuman sa mga lingkod ng Faraon na natakot sa salita ni Yahweh ay dali-daling ipinasok sa mga bahay ang kanyang mga lingkod at alagang hayop.[a][b]
  rationale: Pinalitan ang ‘pinapasok’ ng ‘ipinasok’ upang maipahayag ang naganap na causative na pagkilos sa salaysay. Nilinaw rin ang alternatibong salin sa talababa a upang mapanatili ang partitive na kahulugang isang tao mula sa mga lingkod ng Faraon. Walang binagong kahulugan o teolohikal na pagpapakahulugan.
