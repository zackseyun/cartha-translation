  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: tl
  text: Ang sinuman sa mga lingkod ng Faraon na natakot sa salita ni Yahweh ay dali-daling ipinasok sa mga bahay ang kanyang mga lingkod at alagang hayop.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ang isa sa mga lingkod ng Faraon na natakot sa salita ni Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebrew, “pinatakas” o “pinatakbo”; ibig sabihin, mabilis niya silang dinala sa masisilungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Ang sinuman ... na natakot
  rationale: Ang artikulo at participle ay tumutukoy sa isang tao mula sa isang pangkat—‘ang natatakot’ o ‘sinumang natakot.’ Likas sa modernong Tagalog ang ‘ang sinuman ... na natakot’ at malinaw na tumutukoy sa ilan sa mga lingkod ng Faraon.
- source_word: דְּבַר יְהוָה
  choice: salita ni Yahweh
  rationale: Pinananatili ng ‘salita’ ang malawak at nakaugaliang diwa ng דָּבָר nang hindi ito nililimitahan sa ‘babala,’ kahit babala ang tungkulin nito sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: sa mga lingkod ng Faraon
  rationale: 'Ipinahahayag ng ‘sa mga’ kasunod ng ‘sinuman’ ang partitive na gamit ng מִן: isang tao mula sa pangkat ng mga lingkod ng Faraon.'
- source_word: הֵנִיס
  choice: dali-daling pinapasok
  rationale: Ang Hiphil ng נוּס ay literal na ‘pinatakas’ o ‘pinatakbo.’ Sa konteksto, natural na ipinahahayag ng ‘dali-daling pinapasok’ ang agarang pagpapasilong sa mga tao at hayop, habang inilalahad sa talababa ang mas literal na anyo.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד ng alipin o lingkod. Sa kontekstong ito ng mga tauhan sa ilalim ng isang opisyal, ang ‘mga lingkod’ ay tumpak at natural nang hindi nagpapasya nang higit sa sinasabi ng talata.
- source_word: מִקְנֵהוּ
  choice: kanyang mga alagang hayop
  rationale: Ang מִקְנֶה ay malawak na tumutukoy sa mga hayop na pag-aari o inaalagaan; mas malawak at mas tumpak ito kaysa ‘mga baka.’
- source_word: אֶל הַבָּתִּים
  choice: sa mga bahay
  rationale: Ipinakikita ng pandiwang ‘pinapasok’ ang kilos papaloob, kaya natural ang ‘sa mga bahay’ sa Tagalog habang pinananatili ang maramihang bilang ng Hebrew.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebrew ang banal na pangalan. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulong ‘PANGINOON.’
- issue: Kahulugan ng ‘pagkatakot’ sa salita ni Yahweh
  choice: natakot sa salita ni Yahweh
  alternative: gumalang sa salita ni Yahweh
  rationale: Pinananatili ang tuwirang kahulugan ng יָרֵא at ang tensiyon sa pagitan ng takot at pagpipitagan; hindi ito tahimik na nililimitahan sa ‘paggalang.’
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘Faraon,’ ‘mga lingkod,’ at ‘mga alagang hayop’ bilang mga salitang madaling maunawaan. Ang ‘dali-daling pinapasok’ ay natural sa Tagalog at naghahatid ng agarang pagkilos bago ang graniso; nililinaw ng talababa ang mas literal na causative na anyo.
