id: EXO.9.5
reference: Exodus 9:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: tl
  text: At nagtakda si Yahweh ng panahon[a] at sinabi, “Bukas ay gagawin ni Yahweh ang bagay na ito sa lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang takdang panahon” o “isang itinakdang panahon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: nagtakda
  rationale: Ang שׂוּם kasama ng מוֹעֵד ay tumutukoy sa pagtatakda o pagtiyak ng panahon; natural sa makabagong Tagalog ang “nagtakda ng panahon.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מוֹעֵד
  choice: panahon
  rationale: Maaari itong mangahulugang takdang panahon o itinakdang pagkakataon. Sapat at natural ang “panahon” dahil nililinaw ng kasunod na “Bukas” ang tiyak na oras.
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Sa salaysay na Hebreo, ipinakikilala nito ang tuwirang sinabi. Mas natural sa Tagalog ang pandiwang “at sinabi” kaysa literal na “na nagsasabi.”
- source_word: מָחָר
  choice: Bukas
  rationale: Tuwirang katumbas ng pang-abay na tumutukoy sa susunod na araw.
- source_word: יַעֲשֶׂה
  choice: gagawin
  rationale: Pinananatili ang payak at malawak na kahulugan ng עשה nang hindi tinutukoy nang higit sa teksto ang uri ng pagkilos.
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Ang דָּבָר ay maaaring “bagay,” “pangyayari,” o “usapin.” Ang “bagay na ito” ang pinakamalapit at natural na salin habang hindi nilulutas ang lawak ng kahulugan.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Pinananatili ang karaniwang kahulugan ng אֶרֶץ at hindi idinaragdag ang “Ehipto,” bagaman malinaw iyon sa konteksto.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nagtakda ng panahon” bilang natural na parirala, at pinanatiling payak ang tuwirang pahayag.
