base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: tl
  text: Ngunit pinatigas ni Yahweh ang puso ng Paraon[a], at hindi siya nakinig sa kanila, gaya ng sinabi ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pinatatag ni Yahweh ang puso ng Paraon” o “pinalakas ni Yahweh ang puso ng Paraon.” Mas literal na nangangahulugan ang pandiwang Hebreo na “ginawang malakas o matatag,” ngunit sa kontekstong ito ay tumutukoy ito sa matigas na pagtutol ng Paraon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: pinatigas
  rationale: Ang חזק ay literal na tumutukoy sa pagpapalakas o pagpapatatag. Sa paulit-ulit na paglalarawan sa puso ng Paraon sa Exodo, likas na ipinahihiwatig nito ang pagpapatibay sa matigas na pagtutol; malinaw at natural sa Filipino ang “pinatigas,” habang inilalahad sa talababa ang mas literal na mga posibilidad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לֵב פַּרְעֹה
  choice: ang puso ng Paraon
  rationale: Pinananatili ang Hebreong larawang “puso,” na tumutukoy rito sa kalooban at disposisyon, nang hindi ito pinalalawak sa pangunahing teksto.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: at hindi siya nakinig sa kanila
  rationale: Ang שׁמע na may אֶל ay natural na “makinig sa” o “pakinggan.” Hindi ginawang “sumunod” upang hindi labis na tukuyin ang kahulugan, at pinanatili ang panghalip na “kanila” gaya ng nasa Hebreo.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: gaya ng sinabi ni Yahweh kay Moises
  rationale: Ipinapahayag ng parirala ang pagtupad ayon sa naunang sinabi ni Yahweh. Ang “gaya ng sinabi” ay natural sa modernong Filipino at pinananatili ang paghahambing ng כַּאֲשֶׁר.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagpapatigas ng puso ng Paraon
  choice: pinatigas ni Yahweh ang puso ng Paraon
  alternative: pinatatag ni Yahweh ang puso ng Paraon / pinalakas ni Yahweh ang loob ng Paraon
  rationale: Tahasang si Yahweh ang simuno at ang puso ng Paraon ang tuwirang layon sa Hebreo. Pinananatili ng salin ang direktang pagkilos ng Diyos at hindi ito ginagawang pagpapahintulot lamang. Gayunman, kinikilala sa talababa na ang pandiwa ay mas literal na maaaring mangahulugang “palakasin” o “patatagin,” kaya hindi itinatago ang leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Paraon,” “puso,” at “nakinig” upang manatiling malapit sa anyo ng Hebreo nang hindi nagiging salitang-salita o lipas ang himig.
