base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: tl
  text: Sapagkat sa pagkakataong ito ay ipadadala ko ang lahat ng salot ko laban sa puso mo[a], laban sa mga lingkod mo, at laban sa bayan mo, upang malaman mong walang gaya ko sa buong daigdig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa puso mo.” Maaaring ipahiwatig ng pananalitang Hebreo na ang mga salot ay nakatuon mismo sa Faraon, sa kaibuturan ng kanyang pagkatao.
    reason: lexical_alternative
  - marker: b
    text: O “sa buong lupain,” kung inuunawa ang parirala sa mas lokal na saklaw. Isinalin ditong “daigdig” dahil binibigyang-diin ng pahayag ang walang-kapantay na katayuan ng PANGINOON sa buong mundo.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag na kaugnay ng naunang pahayag. Likas at malinaw sa Filipino ang “Sapagkat” sa ganitong ugnayang pangdiskurso.
- source_word: בַּפַּעַם הַזֹּאת
  choice: sa pagkakataong ito
  rationale: Tumutukoy ito sa kasalukuyang yugto o pagkakataon ng pagkilos. Pinananatili ng parirala ang temporal na diin nang hindi nagiging kolokyal.
- source_word: אֲנִי שֹׁלֵחַ
  choice: ipadadala ko
  rationale: Ang Hebreong participle ay nagpapahiwatig ng nalalapit na pagkilos sa konteksto. Mas natural sa Filipino ang aspektong kontemplatibo rito kaysa literal ngunit alanganing “ipinapadala ko.”
- source_word: כָּל מַגֵּפֹתַי
  choice: ang lahat ng salot ko
  rationale: Ang מַגֵּפָה ay maaaring tumukoy sa salot, hampas, o parusang nagpapahirap. Ang “salot” ang pinakanababagay sa konteksto ng Exodo at pinananatili ang bigat ng hatol.
- source_word: אֶל לִבְּךָ
  choice: laban sa puso mo
  rationale: Pinananatili nito ang tahasang metapora ng Hebreo at ang puwersang komprontasyonal. Hindi ito pinapantay lamang sa “laban sa iyo,” kaya nananatili ang kaugnayan sa kalooban at kaibuturan ng Faraon.
- source_word: וּבַעֲבָדֶיךָ
  choice: sa mga lingkod mo
  rationale: Sa kontekstong ito, tumutukoy ang עֶבֶד sa mga lingkod o opisyal ng Faraon, hindi partikular sa mga alipin. Nauunawaan mula sa koordinasyon ang diwang “laban sa.”
- source_word: וּבְעַמֶּךָ
  choice: at sa bayan mo
  rationale: Ang עַם ay ang bayang nasasakupan ng Faraon, samakatuwid ay ang mga Ehipsiyo. Mas angkop dito ang “bayan” kaysa “mga tao” bilang katawagang kolektibo.
- source_word: בַּעֲבוּר תֵּדַע
  choice: upang malaman mo
  rationale: Malinaw na layunin ang ipinahahayag ng בַּעֲבוּר. Pinananatili ng “upang” ang telikong diwa nang hindi ito ginagawang payak na hula tungkol sa hinaharap.
- source_word: אֵין כָּמֹנִי
  choice: walang gaya ko
  rationale: Maikli at likas na pahayag ito ng kawalang-kapantay sa Filipino, at hindi nito dinaragdagan ang saklaw ng sinabi ng Hebreo.
- source_word: בְּכָל הָאָרֶץ
  choice: sa buong daigdig
  rationale: Bagaman maaaring mangahulugan ang אֶרֶץ na “lupain,” ipinahahayag dito ang malawak na kawalang-kapantay ng PANGINOON. Ang “daigdig” ay malinaw na naghahatid ng pandaigdig na saklaw.
theological_decisions:
- issue: Saklaw ng kawalang-kapantay ng Diyos
  choice: 'Pandaigdig: “sa buong daigdig”'
  alternative: 'Panrehiyon: “sa buong lupain”'
  rationale: Sa salaysay ng mga salot, ang pahayag ay nagtatanghal sa PANGINOON bilang walang kapantay hindi lamang sa Ehipto kundi sa buong mundo. Gayunman, itinatala sa talababa ang lehitimong mas lokal na kahulugan ng אֶרֶץ.
- issue: Kahulugan ng “laban sa puso mo”
  choice: Panatilihin ang metapora ng mga salot na nakatuon sa puso o kaibuturan ng Faraon
  alternative: Ipaliwanag bilang “laban mismo sa iyo”
  rationale: Tahasang binabanggit ng Hebreo ang puso. Ang pagpapanatili nito ay nag-iingat sa kaugnayan sa pagpapatigas ng puso ng Faraon at sa personal at panloob na tudlaan ng hatol, nang hindi nilulutas ang buong kahulugan sa pamamagitan ng paraphrase.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Sapagkat,” “upang,” at “daigdig” para sa dignidad ng salin, habang iniwasan ang labis na arkaikong ayos. Pinanatili ang metaporang “puso” at inilagay ang mga alternatibong pagbasa sa mga talababa.
