id: EXO.9.18
reference: Exodus 9:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: tl
  text: Narito, bandang ganitong oras bukas[a], magpapaulan ako ng napakatinding graniso, na hindi pa kailanman nagkaroon ng katulad nito sa Ehipto mula nang ito ay itatag[b] hanggang ngayon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa oras ding ito bukas.”
    reason: lexical_alternative
  - marker: b
    text: O, “mula nang maitatag ang Ehipto.”
    reason: clarity
lexical_decisions:
- source_word: הִנְנִי
  choice: Narito
  rationale: Pinananatili nito ang mariin at maringal na pagpapakilala sa pahayag ng Diyos, nang hindi nagiging lipas o mahirap unawain.
- source_word: מַמְטִיר
  choice: magpapaulan ako
  rationale: Ang Hiphil na anyo ay tahasang nagpapahayag na ang Diyos ang magpapabagsak ng graniso; likas sa Tagalog ang pandiwang “magpapaulan” para sa ganitong sanhiang kilos.
- source_word: כָּעֵת מָחָר
  choice: bandang ganitong oras bukas
  rationale: Ipinahihiwatig ng כְּ ang pagtatantiya o paghahambing sa oras; malinaw at natural itong naihahayag ng “bandang ganitong oras bukas.”
- source_word: בָּרָד כָּבֵד מְאֹד
  choice: napakatinding graniso
  rationale: Bagaman literal na “napakabigat na graniso,” ang “napakatindi” ang mas likas na paglalarawan sa pambihirang lakas ng pag-ulan ng graniso sa modernong Tagalog.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: na hindi pa kailanman nagkaroon ng katulad nito
  rationale: Pinananatili nito ang tuwirang paghahambing sa Hebreo at ang pahayag na walang dating pangyayaring maitutulad dito.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: mula nang ito ay itatag
  rationale: Inihahayag nito ang pasibong diwa ng Niphal at tinutukoy ang pagkakatatag ng Ehipto bilang bansa.
- source_word: וְעַד עָתָּה
  choice: hanggang ngayon
  rationale: Karaniwan at eksaktong katumbas ito ng saklaw ng panahon hanggang sa kasalukuyang sandali.
theological_decisions:
- issue: Tahasang pagkilos ng Diyos sa salot
  choice: “magpapaulan ako”
  alternative: “uulan ng graniso”
  rationale: Ang pandiwa ay nasa unang panauhan at sanhiang anyo, kaya hindi dapat gawing impersonal ang tuwirang pahayag na ang Diyos ang nagpapasapit ng graniso.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “graniso,” ang karaniwang tiyak na katawagan sa hail, at iniwasan ang sobrang literal na “mabigat” dahil mas natural sa konteksto ng matinding unos ang “napakatindi.” Inilagay ang mga talababa sa mismong pariralang tinutukoy ng bawat isa.
