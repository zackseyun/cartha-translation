  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: tl
  text: 'At kinabukasan, ginawa ni Yahweh ang bagay na ito: namatay ang lahat ng alagang hayop ng Ehipto, ngunit mula sa mga alagang hayop ng mga anak ni Israel[a] ay wala ni isa ang namatay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “mga Israelita.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa anyong Yahweh ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַשׂ ... אֶת הַדָּבָר הַזֶּה
  choice: ginawa ... ang bagay na ito
  rationale: Pinananatili nito ang payak at kongkretong idyomang Hebreo habang natural pa rin sa makabagong Tagalog.
- source_word: מִמָּחֳרָת
  choice: kinabukasan
  rationale: Likas at tiyak na katumbas sa Tagalog ng araw na kasunod.
- source_word: כֹּל מִקְנֵה מִצְרָיִם
  choice: lahat ng alagang hayop ng mga Ehipsiyo
  rationale: Mas malawak ang saklaw ng מִקְנֶה kaysa baka lamang; ang 'alagang hayop' ay sumasaklaw sa mga kawan at hayop na pag-aari.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pormal na larawang 'mga anak ni Israel,' bagaman ginagamit ang parirala bilang katawagang pangkapulungan sa bayang Israel.
- source_word: לֹא מֵת אֶחָד
  choice: wala ni isa ang namatay
  rationale: 'Malinaw na naihahayag ang mariing pagtanggi: walang kahit isang hayop ang namatay.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng katawagang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pormal na anyo ng Hebreo, habang nililinaw sa talababa ang likas na katawagang pangkat na 'mga Israelita.'
- issue: Saklaw ng כֹּל sa salaysay ng salot
  choice: lahat ng alagang hayop ng mga Ehipsiyo
  alternative: lahat ng alagang hayop sa Ehipto
  rationale: Isinasalin ang tahasang unibersal na pahayag ng talata nang hindi nito pinapaliit o ipinapaliwanag batay sa mga kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'kinabukasan' para sa natural na daloy, 'alagang hayop' para sa malawak na kahulugan ng מִקְנֶה, at 'mga anak ni Israel' upang mapanatili ang pormal na anyo ng Hebreo.
