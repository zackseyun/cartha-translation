base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: tl
  text: Ngunit tungkol sa iyo at sa iyong mga lingkod, alam kong hindi pa kayo natatakot kay Yahweh na Diyos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi pa rin kayo natatakot” o “bago kayo matakot kay Yahweh na Diyos.” Ang salitang Hebreo ay maaaring magpahayag ng “bago” o, ayon sa konteksto, “hindi pa.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay kumakatawan sa banal na pangalang Hebreo na YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה וַעֲבָדֶיךָ
  choice: Ngunit tungkol sa iyo at sa iyong mga lingkod
  rationale: Ipinahahayag ng pangatnig at ng hiwalay na panghalip ang paghahambing o pagsalungat sa naunang sinabi. Ang “mga lingkod” ay likas sa konteksto ng mga tauhan o opisyal ni Paraon nang hindi nililimitahan ang kahulugan sa mga alipin.
- source_word: יָדַעְתִּי כִּי
  choice: alam kong
  rationale: Ang ganap na anyo ng pandiwa ay nagpapahayag dito ng kasalukuyan at matatag na pagkaalam ni Moises; ang כִּי ay nagpapakilala sa nilalaman ng nalalaman niya.
- source_word: טֶרֶם תִּירְאוּן
  choice: hindi pa kayo natatakot
  rationale: Sa kasunod na di-ganap na pandiwa, natural na ipinahahayag ng טֶרֶם ang temporal na diwa na “hindi pa,” bagaman maaari rin itong unawaing “bago.”
- source_word: תִּירְאוּן
  choice: natatakot
  rationale: Pinananatili ng “natatakot” ang saklaw ng ירא, na maaaring tumukoy sa pangamba, pagpipitagan, o wastong pagkilala sa Diyos, nang hindi ito pinalalambot bilang paggalang lamang.
- source_word: מִפְּנֵי
  choice: kay
  rationale: Sa pariralang may ירא, ang literal na “mula sa harap ng” ay natural na ipinahahayag sa Filipino sa pamamagitan ng “matakot kay.”
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh na Diyos
  rationale: Pinananatili ang personal na pangalang YHWH bilang “Yahweh” at ang אֱלֹהִים bilang “Diyos,” na nakaugnay bilang isang buong pagtukoy sa Diyos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng ירא kapag ang Diyos ang tinutukoy
  choice: natatakot
  alternative: gumagalang; nangingilabot
  rationale: Pinananatili ng “natatakot” ang tensiyon sa pagitan ng pangamba sa hatol at pagpipitagan sa Diyos, sa halip na ipasya na isa lamang sa dalawang diwang ito ang tinutukoy.
- issue: Temporal na diwa ng טֶרֶם
  choice: hindi pa
  alternative: bago; hindi pa rin
  rationale: Pinakamalinaw sa konteksto ang “hindi pa,” ngunit tunay na maaaring magpahiwatig ang Hebreo ng temporal na “bago,” kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “mga lingkod” ay madaling maunawaan at angkop sa mga tauhan ng hari. Sadyang pinanatili ang “natatakot” upang huwag alisin ang sabay na posibilidad ng pangamba at pagpipitagan.
