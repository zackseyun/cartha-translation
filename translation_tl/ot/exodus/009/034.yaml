base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: tl
  text: Ngunit nang makita ng Paraon na tumigil na ang ulan, ang graniso, at ang mga kulog[a], muli siyang nagkasala at pinatigas ang kanyang puso—siya at ang kanyang mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga tinig”; sa konteksto ng bagyo, tumutukoy ito sa mga kulog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nang makita
  rationale: Karaniwang kahulugan ng ראה ang “makita.” Sa pagkakaugnay sa כִּי, likas sa Tagalog ang “nang makita ... na,” na nagpapahayag kapwa ng pangyayari at ng napansin ng Paraon.
- source_word: כִּי
  choice: na
  rationale: 'Ipinakikilala ng כִּי ang nilalaman ng nakita ng Paraon: na tumigil na ang bagyo.'
- source_word: חָדַל
  choice: tumigil na
  rationale: Tuwirang ipinahahayag ang paghinto ng ulan, graniso, at kulog; ang “na” ay angkop sa aspektong natapos na bago ang kasunod na ginawa ng Paraon.
- source_word: הַמָּטָר
  choice: ang ulan
  rationale: Karaniwan at tuwirang katumbas ng מטר.
- source_word: הַבָּרָד
  choice: ang graniso
  rationale: Karaniwang makabagong salitang Tagalog para sa hail at malinaw sa konteksto ng salot.
- source_word: הַקֹּלֹת
  choice: ang mga kulog
  rationale: Literal na “mga tinig/mga tunog,” ngunit sa konteksto ng bagyo ay tumutukoy sa mga kulog. Pinanatili sa talababa ang literal na larawan.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: muli siyang nagkasala
  rationale: Ang hulma na יסף + pawatas ay nagsasaad ng muling paggawa o pagpapatuloy. Dito, ang “muli siyang nagkasala” ay natural at ipinapakita ang pag-uulit matapos ang pansamantalang pagsisisi.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: pinatigas ang kanyang puso
  rationale: Bagaman kaugnay ng “pagbigat” ang כבד, ang paulit-ulit na idyoma sa salaysay tungkol sa Paraon ay tumutukoy sa pagmamatigas o pagiging manhid ng puso. Pinananatili ng saling ito ang mahalagang temang iyon.
- source_word: הוּא וַעֲבָדָיו
  choice: siya at ang kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עֲבָדָיו ng mga alipin, lingkod, o opisyal. Sa maharlikang konteksto, sapat na malawak at angkop ang “mga lingkod” para sa mga tauhan ng Paraon.
- source_word: וַ
  choice: Ngunit
  rationale: Bagaman karaniwang nagdurugtong lamang ng salaysay ang waw, ang “Ngunit” ay natural na naghahayag ng kaibahan sa naunang pag-amin ng Paraon.
theological_decisions:
- issue: Sino ang kumilos sa pagpapatigas ng puso at gaano kalawak ang pangwakas na parirala
  choice: Tahasang iniuugnay kay Paraon ang pagpapatigas ng kanyang sariling puso, saka pinananatili ang idinugtong na “siya at ang kanyang mga lingkod.”
  alternative: Maaaring unawain na kolektibong inilalarawan ng pangwakas na parirala ang pakikibahagi ng Paraon at ng kanyang mga lingkod sa pagkakasala o pagmamatigas.
  rationale: Isahan ang “kanyang puso” at si Paraon ang tahasang paksa ng pandiwa, ngunit idinaragdag ng Hebreo ang “siya at ang kanyang mga lingkod.” Pinananatili ng gitling ang bahagyang sintaktikong pag-igting at hindi ipinapasya nang higit sa sinasabi ng talata ang saklaw ng kanilang pakikibahagi o ang mas malawak na usapin ng banal at pantaong pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Paraon,” “graniso,” at “mga lingkod” bilang mga karaniwang salitang mauunawaan ng pangkalahatang mambabasa. Pinanatili ang maikli at mariing pangwakas na parirala upang maipakita ang anyo at hindi lubusang lutasin ang kalabuan ng Hebreo.
