source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: tl
  text: Pagkatapos, umalis si Moises mula kay Paraon at lumabas ng lungsod. Iniunat niya ang kanyang mga kamay patungo kay Yahweh; tumigil ang kulog[a] at graniso, at hindi na bumuhos ang ulan sa lupa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga tinig”; sa konteksto ng bagyo, tumutukoy ito sa kulog.
    reason: lexical_alternative
  - marker: b
    text: O “at hindi ibinuhos ang ulan sa lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: umalis si Moises sa harap ng Paraon at lumabas ng lungsod
  rationale: Ipinahahayag ng מֵעִם ang paglayo mula sa presensiya ng Paraon, at ipinakikita ng kasunod na parirala ang paglabas sa lungsod. Natural sa modernong Tagalog ang paghahati sa dalawang magkaugnay na kilos.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: Iniunat niya ang kanyang mga kamay
  rationale: Tumutukoy ang idyoma sa pisikal na kilos ng pananalangin. Pinananatili ng “iniunat” ang larawan nang hindi ginagawang labis na literal ang כַּפָּיו bilang “mga palad.”
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ang אֶל ay nagsasaad ng patutunguhan ng panalangin, at ang tipanang pangalan na יְהוָה ay tuwirang isinasalin bilang “Yahweh.”
- source_word: הַקֹּלוֹת
  choice: ang kulog
  rationale: Literal na “mga tinig” o “mga tunog,” ngunit sa konteksto ng bagyo ay malinaw na tumutukoy sa kulog. Natural sa Tagalog ang kolektibong anyong isahan.
- source_word: וְהַבָּרָד
  choice: at graniso
  rationale: Tuwiran at karaniwang katumbas sa modernong Filipino ng בָּרָד.
- source_word: וַיַּחְדְּלוּ
  choice: tumigil
  rationale: Malinaw at likas na salin ng pandiwang nangangahulugang huminto o matapos.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: at hindi na bumuhos ang ulan sa lupa
  rationale: Ipinahihiwatig ng konteksto ang pagtigil ng pagbuhos ng ulan. Ang aktibong anyong “bumuhos” ay mas natural sa Tagalog kaysa sa literal na pasibo, habang pinananatili ang diwa ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton bilang sariling pangalan. Pinananatili ng “Yahweh” ang tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Ipinahihiwatig na tagapagpaulan sa pasibong לֹא נִתַּךְ
  choice: hindi na bumuhos ang ulan
  alternative: hindi na ibinuhos ang ulan
  rationale: Hindi tahasang binabanggit ng Hebreo ang gumagawa ng kilos. Iniiwasan ng natural na Tagalog na “bumuhos” ang pagdaragdag ng isang tahasang tagaganap, kaya nananatili ang di-tiyak na anyo ng pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “graniso,” na karaniwang nauunawaan, at pinanatili ang konkretong kilos ng pag-uunat ng mga kamay. Itinama ang pagkakalagay ng mga panandang talababa upang ang [a] ay tumukoy sa “kulog” at ang [b] sa huling sugnay tungkol sa ulan.
