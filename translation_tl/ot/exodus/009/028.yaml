id: EXO.9.28
reference: Exodus 9:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: tl
  text: Magsumamo kayo kay Yahweh, sapagkat sapat na ang kulog ng Diyos[a] at graniso. Pakakawalan ko kayo, at hindi na kayo mananatili pa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga tinig ng Diyos at graniso.” Sa konteksto ng unos, ang “mga tinig” ay tumutukoy sa kulog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Magsumamo kayo
  rationale: Ang Hiphil imperative na maramihan ng עתר ay tumutukoy sa taimtim na pananalangin o pagsusumamo. Ipinahahayag ng “magsumamo” ang tindi ng pakiusap ni Faraon nang hindi nagiging lipas o teknikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וְרַב מִהְיֹת
  choice: sapagkat sapat na ang
  rationale: Ang idyoma ay nagpapahayag na lampas na sa makakaya o tama na ang nangyayari. Natural sa Filipino ang “sapat na” bilang pakiusap na itigil na ang salot.
- source_word: קֹלֹת אֱלֹהִים
  choice: kulog ng Diyos
  rationale: Literal itong “mga tinig ng Diyos,” ngunit sa konteksto ng unos at graniso, ang mga “tinig” ay kulog. Pinananatili ng “ng Diyos” ang ugnayang ipinahahayag ng Hebreo; inilalahad sa talababa ang literal na anyo.
- source_word: וּבָרָד
  choice: at graniso
  rationale: Tuwirang katumbas ng בָּרָד ang “graniso,” isang malinaw at karaniwang salitang Filipino.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Pakakawalan ko kayo
  rationale: Sa konteksto ng Exodo, ang שלח na ang bayan ang layon ay nangangahulugang pahintulutan silang umalis o palayain. Ang “pakakawalan” ay natural at tuwiran.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: at hindi na kayo mananatili pa
  rationale: Ang literal na “hindi na magdaragdag na tumayo” ay isang idyoma para sa hindi na pagpapatuloy ng pananatili o pagkaantala. Malinaw itong ipinahahayag ng napiling salin.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang pangalan sa teksto sa halip na palitan ng titulo, nang walang pag-aangkat ng denominasyonal na pagpapakahulugan.
- issue: Kahulugan ng קֹלֹת אֱלֹהִים
  choice: kulog ng Diyos
  alternative: mga tinig ng Diyos
  rationale: Itinuturo ng agarang konteksto ng unos at graniso na kulog ang tinutukoy, ngunit hindi itinatago ang literal at matalinghagang anyong “mga tinig ng Diyos”; nakatala ito sa talababa upang mapanatili ang tekstuwal na kulay at posibleng teolohikal na diin.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “magsumamo” upang ipakita ang taimtim na pakiusap, at iniwasan ang sobrang literal ngunit di-natural na pariralang “mga tinig ng Diyos” sa pangunahing teksto habang pinananatili ito sa talababa.
