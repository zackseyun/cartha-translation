  text: For if you refuse to let them go and still hold on to them,[a]
translation:
  language: tl
  text: Sapagkat kung ayaw mo silang payagang umalis at patuloy mo silang pinipigilan,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at patuloy mo pa rin silang hinahawakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kung
  rationale: Pinananatili nito kapwa ang paliwanag na diwa ng כִּי at ang pasubaling diwa ng אִם, at natural itong nag-uugnay sa naunang talata.
- source_word: מָאֵן
  choice: ayaw mo
  rationale: Tumutukoy ang pandiwa sa sadyang pagtanggi, hindi sa kawalan ng kakayahan. Ang “ayaw mo” ay tuwiran at likas sa makabagong Tagalog.
- source_word: לְשַׁלֵּחַ
  choice: silang payagang umalis
  rationale: Sa konteksto ng Exodo, tumutukoy ito sa pagpapahintulot ni Faraon na makaalis ang Israel; malinaw at natural ang pariralang ito sa Tagalog.
- source_word: וְעוֹדְךָ
  choice: at patuloy mo
  rationale: Ipinahahayag ng anyo ang nagpapatuloy na kilos ni Faraon. Ang “patuloy mo” ay maikli at malinaw na naghahatid ng aspektong ito.
- source_word: מַחֲזִיק בָּם
  choice: silang pinipigilan
  rationale: Sa konteksto, ang participle ng חזק na may בָּם ay nagpapahiwatig ng patuloy na pagpigil o hindi pagpapalaya sa mga Israelita. Ang “pinipigilan” ay natural at angkop, habang inilalagay sa talababa ang mas literal na posibilidad.
theological_decisions:
- issue: Lawak ng kahulugan ng מַחֲזִיק בָּם
  choice: pinipigilan
  alternative: patuloy na hinahawakan
  rationale: Hindi nilulutas sa doktrinal na paraan ang salita; pinili sa pangunahing teksto ang kahulugang hinihingi ng konteksto ng pagpigil sa Israel, habang pinananatili sa talababa ang mas literal na larawan ng paghawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang karaniwang “ayaw mo” at “payagang umalis” sa halip na mas pormal ngunit hindi gaanong likas na mga parirala; nananatili ang anyong pasubali at ang bukas na pagpapatuloy ng pangungusap.
