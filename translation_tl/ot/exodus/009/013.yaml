base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Yahweh kay Moises, “Bumangon ka nang maaga kinabukasan at humarap ka sa Faraon. Sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh, ang Diyos ng mga Hebreo: Palayain mo ang bayan ko upang maglingkod sila sa akin.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang sumamba sila sa akin.” Ang pandiwang Hebreo ay tumutukoy sa paglilingkod sa Diyos, na kabilang ang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Bumangon ka nang maaga sa umaga
  rationale: Tumpak nitong ipinapahayag ang pautos na bumangon nang maaga at ang tahasang pagtukoy sa umaga.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: at humarap ka sa Faraon
  rationale: Natural sa modernong Tagalog at taglay ang diwa ng pagharap o pagtindig sa harapan ni Faraon.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili ang pormal na pormula ng mensahero sa paraang malinaw at natural sa Tagalog.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ang Diyos ng mga Hebreo
  rationale: Tuwirang salin ng construct chain at karaniwang tawag sa pangkat sa modernong Filipino.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Palayain mo ang bayan ko
  rationale: Ipinahahayag ang utos na hayaang makaalis ang bayan mula sa kapangyarihan ni Faraon; mas natural dito ang “palayain” kaysa sa literal na “paalisin.”
- source_word: וְיַעַבְדֻנִי
  choice: upang maglingkod sila sa akin
  rationale: Ang conjunction at imperfect ay nagsasaad ng layunin. Pinananatili ng “maglingkod” ang malawak na saklaw ng עבד, na kabilang ang pagsamba ngunit hindi limitado rito.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng וְיַעַבְדֻנִי
  choice: upang maglingkod sila sa akin
  alternative: upang sumamba sila sa akin
  rationale: Maaaring kabilang sa עבד ang pagsamba, ngunit mas malawak ang kahulugan nitong paglilingkod. Hindi ito dapat paliitin nang walang batayan sa mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Faraon,” “mga Hebreo,” at “bayan ko” bilang natural na mga anyo; iniwasan ang sobrang arkaikong ayos ng pangungusap.
