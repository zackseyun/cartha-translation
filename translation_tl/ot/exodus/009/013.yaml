  to: 'Pagkatapos, sinabi ni Yahweh kay Moises, “Bumangon ka nang maaga kinabukasan at humarap ka sa Faraon. Sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh, ang Diyos ng mga Hebreo: Palayain mo ang bayan ko upang maglingkod sila sa akin.[a]’”'
  rationale: 'Inayos ang dalawang mababang-panganib na usaping pangwika: ginawang pangkaraniwang Tagalog na messenger formula ang “Ganito ang sabi,” at pinalitan ang paulit-ulit na “nang maaga sa umaga” ng “nang maaga kinabukasan.” Hindi binago ang kahulugan, utos, mga pangalan, o ang malawak na kahulugan ng “maglingkod.”'
