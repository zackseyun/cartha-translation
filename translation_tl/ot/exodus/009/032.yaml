  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: tl
  text: Ngunit ang trigo at espelta[a] ay hindi nasalanta, sapagkat huli pa ang paglaki ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “espelta” ay maaaring tumukoy sa spelt, emmer, o isang kaugnay na uri ng sinaunang butil.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Ngunit ang trigo
  rationale: Ang חִטָּה ay trigo. Isinalin ang pang-ugnay na וְ bilang “Ngunit” upang natural na ipakita ang pagsalungat sa mga pananim na nasalanta sa naunang talata.
- source_word: וְהַכֻּסֶּמֶת
  choice: at kusim[a]
  rationale: Ang כֻּסֶּמֶת ay isang sinaunang uring butil na karaniwang kinikilalang spelt o emmer. Ginamit ang transliterasyong “kusim” dahil walang malawak na kilalang tiyak na katumbas sa modernong Tagalog, at nilinaw ang maaaring pagkakakilanlan sa talababa.
- source_word: לֹא נֻכּוּ
  choice: ay hindi nasalanta
  rationale: Ang pasibong anyo ng נכה ay tumutukoy sa hindi pagkakapinsala ng mga pananim dahil sa graniso. Ang “nasalanta” ay natural sa kontekstong pang-agrikultura at pinananatili ang bigat ng hagupit.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ng כִּי ang dahilan kung bakit hindi nasalanta ang dalawang pananim; ang “sapagkat” ay malinaw at marangal sa modernong Tagalog.
- source_word: אֲפִילֹת הֵנָּה
  choice: nahuhuli pa ang paghinog ng mga ito
  rationale: Malamang na inilalarawan ng parirala ang mga pananim bilang huli o hindi pa maunlad ang paglaki. Ang saling ito ay nagbibigay ng likas na kahulugang pang-agrikultura nang hindi gumagamit ng malabong literal na “madidilim.”
