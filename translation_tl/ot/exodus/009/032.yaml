translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang “nasalanta” para sa likas na paglalarawan ng pinsala ng graniso, at ginamit ang transliterasyong “kusim” upang hindi magbigay ng labis na katiyakan sa hindi tiyak na uri ng butil.
