  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: tl
  text: Hindi makatayo sa harap ni Moises ang mga salamangkero dahil sa mga pigsa, sapagkat ang mga pigsa ay nasa mga salamangkero at sa lahat ng taga-Ehipto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “at sa buong Ehipto.” Ipinahihiwatig ng konteksto na ang mga pigsa ay nasa mga tao sa buong lupain ng Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: mga salamangkero
  rationale: Sa salaysay ng Exodo, tumutukoy ito sa mga dalubhasa ni Faraon sa mga ritwal at mahika. Ang “mga salamangkero” ang malinaw at kinikilalang katumbas sa makabagong Tagalog.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: makatayo sa harap ni Moises
  rationale: Pinananatili nito ang konkretong larawan ng Hebreong idyoma at likas ding nagpapahiwatig na hindi nila kayang humarap o magpakita kay Moises.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: dahil sa mga bukol
  rationale: Ang מִפְּנֵי ay nagpapahayag dito ng sanhi, at ang שְׁחִין ay isang kolektibong katawagan sa namamagang mga sugat o bukol sa balat.
- source_word: הַשְּׁחִין
  choice: mga bukol
  rationale: Ginamit ang maramihan upang natural na maipahayag sa Tagalog ang kolektibo at laganap na sakit sa balat.
- source_word: בַּחֲרְטֻמִּם
  choice: may mga bukol ang mga salamangkero
  rationale: Ang Hebreong pang-ukol ay tumutukoy sa pisikal na pagkakaroon ng mga bukol sa kanilang katawan; ang hulma na “may… ang” ay natural sa Tagalog.
- source_word: וּבְכָל מִצְרָיִם
  choice: at ang mga tao sa buong Ehipto
  rationale: Literal itong “at sa buong Ehipto.” Dahil katapat ito ng pagbanggit sa mga salamangkero at tumutukoy ang salot sa mga taong apektado, ginawang tahasan ang ipinahihiwatig na personal na diwa habang itinatala sa talababa ang literal na anyo.
