translation:
  language: tl
  text: Sapagkat maaari ko na sanang iunat ang aking kamay at hampasin ka at ang iyong bayan ng salot,[a] at nalipol ka na sana mula sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Sapagkat ngayo’y iniunat ko ang aking kamay at hinampas kita at ang iyong bayan ng salot, at nalipol ka mula sa lupa.” Pormal na tumutukoy sa nakaraan ang mga anyo ng pandiwa sa Hebreo, ngunit mariing sinusuportahan ng konteksto ang diwang pasubali.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinahihiwatig nito ang paliwanag o dahilan na kaugnay ng naunang pahayag.
- source_word: עַתָּה
  choice: maaari ko nang
  rationale: Ang “nang” ay likas na nagpapahayag ng diwang “sa puntong iyon / noon pa sana” sa kontekstong pasubali.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: maaari ko nang iniunat ang aking kamay
  rationale: Pinananatili ang Hebreong idyoma ng pag-unat ng kamay bilang makapangyarihang pagkilos, habang ang “maaari” ay nagpapahayag ng pasubaling diwa na hinihingi ng konteksto.
- source_word: וָאַךְ
  choice: at pinuksa
  rationale: Sa konteksto ng hatol at salot, ang “pinuksa” ay natural at nagpapakita ng matinding pagdagok, hindi lamang karaniwang paghampas.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: ka at ang iyong bayan
  rationale: Tuwiran at malinaw na salin ng mga layon ng hatol.
- source_word: בַּדָּבֶר
  choice: sa pamamagitan ng salot
  rationale: Ang דֶּבֶר ay tumutukoy sa nakamamatay na salot o epidemya; ang “salot” ay tumpak at karaniwang nauunawaan sa Filipino.
- source_word: וַתִּכָּחֵד
  choice: nalipol na sana kayo
  rationale: Ipinapahayag ng “nalipol” ang ganap na pagkawala o pagkapuksa, at ng “sana” ang pasubaling resulta. Ginawang maramihan ang panghalip upang natural na tumukoy kay Paraon kasama ng kanyang bayan.
- source_word: מִן־הָאָרֶץ
  choice: sa lupa
  rationale: Pinananatili ang malawak na saklaw ng אֶרֶץ bilang daigdig o ibabaw ng lupa, hindi lamang ang lupain ng Ehipto.
theological_decisions:
- issue: Pasubaling diwa ng mga pandiwang pormal na nasa aspektong ganap/naganap
  choice: 'Isinalin bilang hindi naganap na posibilidad: “maaari ko nang… nalipol na sana.”'
  alternative: 'Pormal na payak na nakaraan: “iniunat ko na… pinuksa… at nalipol kayo.”'
  rationale: Ipinakikita ng agarang konteksto, lalo na ng kasunod na talata, ang kaibahan ng maaaring ginawa ng Diyos at ng aktuwal niyang pagpapanatili kay Paraon. Ang payak na nakaraan ay sasalungat sa katotohanang buhay pa at kinakausap si Paraon.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang idyomang “iniunat ang aking kamay,” at ginamit ang malinaw na pasubaling hulma na “maaari… sana” upang maging natural nang hindi itinatago ang pormal na alternatibo ng Hebreo.
