  to: Kaya kumuha sila ng pinong uling mula sa hurno[a] at tumayo sa harap ng Paraon. Inihagis iyon ni Moises paitaas, at ito ay naging mga pigsa na may mga paltos na lumitaw sa mga tao at mga hayop.[b]
  rationale: Inayos ang pangwakas na paglalarawan upang maipakita na ang mga pigsa ay may mga paltos na lumitaw, na mas malapit sa pagkakasunud-sunod at imahen ng Hebreong “mga pigsa, mga paltos na lumilitaw.” Pinanatili ang lahat ng ibang makabuluhang pagpili, ang dalawang anchor ng talababa, at ang kolektibong “mga tao at mga hayop.”
