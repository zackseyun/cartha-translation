base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: tl
  text: Kaya kumuha sila ng pinong uling mula sa hurno[a] at tumayo sa harap ng Paraon. Inihagis iyon ni Moises paitaas, at ito ay naging mga pigsa na may mga paltos na lumitaw sa mga tao at mga hayop.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “abo mula sa pugon.” Mas tiyak na ipinahihiwatig ng Hebreo ang pinong maitim na pulbos o uling mula sa isang hurno o pugon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa tao at sa hayop,” na isang kolektibong paraan ng pagsasabing tinamaan ang mga tao at mga hayop.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: pinong uling
  rationale: Tumutukoy ito sa pinong maitim na pulbos o soot mula sa hurno; mas tiyak ang “pinong uling” kaysa pangkalahatang “abo” at mas madaling maunawaan sa modernong Tagalog.
- source_word: הַכִּבְשָׁן
  choice: hurno
  rationale: Maaaring tumukoy sa kiln o furnace; ang “hurno” ay natural at sapat na malawak sa Tagalog.
- source_word: לִפְנֵי פַרְעֹה
  choice: sa harap ng Paraon
  rationale: Likas na salin ng idyomang nangangahulugang nasa presensiya ng Paraon.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה הַשָּׁמָיְמָה
  choice: Inihagis iyon ni Moises paitaas
  rationale: Pinananatili ang payak na kilos at ang direksiyong pataas nang hindi dinaragdagan ng teolohikal na pakahulugan ang “kalangitan.”
- source_word: שְׁחִין
  choice: mga pigsa
  rationale: Karaniwang tumutukoy sa namamagang mga sugat o pigsa at malinaw sa konteksto ng salot.
- source_word: אֲבַעְבֻּעֹת
  choice: nagkaroon ng mga paltos
  rationale: Tiyak na inilalarawan ang mga blister o pustule na kaugnay ng mga pigsa, sa halip na ang mas malabong “nagnanaknak.”
- source_word: פֹּרֵחַ
  choice: naglabasan
  rationale: Ipinahahayag ang aktibong paglitaw o pagputok ng sakit sa balat sa natural na Tagalog.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: sa mga tao at mga hayop
  rationale: Ang mga pangngalan ay kolektibo sa Hebreo; malinaw at inklusibong inilalahad ng maramihang anyo sa Tagalog ang mga taong at hayop na tinamaan.
theological_decisions:
- issue: Kolektibong kahulugan ng אָדָם sa paghahambing sa בְּהֵמָה
  choice: mga tao at mga hayop
  alternative: tao at hayop
  rationale: Ang אָדָם dito ay tumutukoy sa sangkatauhan, hindi lamang sa mga lalaki. Natural sa Tagalog ang maramihang anyo at pinananatili nito ang kolektibong pagtutulad ng tao at hayop.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Paraon,” “hurno,” “pigsa,” at “paltos” bilang karaniwan at malinaw na mga termino. Inilipat ang ikalawang talababa sa hulihan ng sugnay na talagang ipinapaliwanag nito.
