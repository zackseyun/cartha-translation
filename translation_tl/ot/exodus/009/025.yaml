base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: tl
  text: Hinampas ng graniso sa buong lupain ng Ehipto ang lahat ng nasa bukid—mula sa tao hanggang sa hayop. Hinampas ng graniso ang lahat ng halaman sa bukid at binali ang lahat ng punongkahoy sa bukid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: hinampas
  rationale: Ang נכה ay tumutukoy sa malakas na paghampas o pananakit. Likas sa modernong Tagalog ang “hinampas” para sa mapaminsalang pagtama ng graniso, at pinananatili rin nito ang pag-uulit ng pandiwa sa Hebreo.
- source_word: הַבָּרָד
  choice: ang graniso
  rationale: Karaniwan at tiyak na katawagan sa Filipino para sa hail; inulit gaya ng nasa tekstong Hebreo.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: sa buong lupain ng Ehipto
  rationale: Malinaw na ipinahahayag ang lawak ng pangyayari sa lahat ng sakop ng lupain, nang hindi nagdaragdag sa pinagmulan.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: ang lahat ng nasa bukid
  rationale: Pinananatili ang malawak na saklaw ng כָּל אֲשֶׁר at ang agrikultural na tagpuan ng שׂדה.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: mula sa tao hanggang sa hayop
  rationale: Natural na saklawang pahayag sa Tagalog na kumakatawan sa lahat ng nilalang na nabubuhay sa bukid, mula tao hanggang hayop. Ang “tao” ay angkop sa pangkalahatang gamit ng אָדָם rito.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: lahat ng halaman sa bukid
  rationale: Sapat na malawak ang “halaman” upang saklawin ang damo, pananim, at iba pang pananim na maaaring tukuyin ng עֵשֶׂב sa kontekstong ito.
- source_word: עֵץ הַשָּׂדֶה
  choice: lahat ng punongkahoy sa bukid
  rationale: Tuwiran at likas na salin na pinananatili ang paulit-ulit na pagtukoy sa bukid.
- source_word: שִׁבֵּר
  choice: binali
  rationale: Ang Piel ng שׁבר ay nagpapahiwatig ng marahas at mapaminsalang pagbasag. Ang “binali” ay natural kapag mga punongkahoy ang layon at hindi lumalabis sa diwa ng teksto.
theological_decisions:
- issue: Saklaw ng אָדָם sa pariralang מֵאָדָם וְעַד בְּהֵמָה
  choice: tao
  alternative: mga tao; sangkatauhan
  rationale: Sa pariralang ito, ang אָדָם ay pangkalahatang tumutukoy sa tao bilang kaibahan sa hayop, hindi partikular sa lalaking kasarian. Pinananatili ng “tao” ang kolektibong saklaw at ang merismong tao-hayop nang walang idinadagdag na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang pag-uulit ng “Hinampas ng graniso” upang maipakita ang diin at estruktura ng Hebreo. Walang kailangang talababa dahil natural na naihahayag ng “tao” ang kolektibong kahulugan ng אָדָם sa kontekstong ito.
