  source_fidelity: 'Tapat ang salin sa Hebreo: ang graniso ang paksa ng kapwa paglitaw ng נכה; saklaw nito ang buong lupain ng Ehipto, lahat ng nasa bukid mula tao hanggang hayop, lahat ng halaman sa bukid, at lahat ng punongkahoy sa bukid. Napanatili rin ang pag-uulit ng ‘Hinampas ng graniso’ at ang mapaminsalang diwa ng שִׁבֵּר sa ‘binali.’'
