  verdict: revise
  source_fidelity: Tumpak ang talaan ng mga anak ni Ruben, ang pagkakakilanlan niya bilang panganay ni Israel, at ang pangwakas na pagtukoy sa mga angkan ni Ruben. Gayunman, ang “kani-kanilang sambahayan ng mga ninuno” ay hindi malinaw na naipapahayag ang possessive na “ng kanilang mga ninuno” sa Hebreo at maaaring magpahiwatig ng mga hiwa-hiwalay na sambahayan sa paraang hindi kinakailangan ng teksto.
  naturalness: Marangal at madaling basahin ang kabuuan. Mas natural at mas malinaw sa modernong Filipino ang “mga sambahayan ng kanilang mga ninuno” kaysa “kani-kanilang sambahayan ng mga ninuno.”
  terminology: Ang “mga pinuno” para sa רָאשֵׁי at “mga angkan” para sa מִשְׁפְּחֹת ay angkop sa kontekstong talaangkanan. Pinanatili ang mga pangalang Hanoc, Pallu, Hezron, at Carmi.
