base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: tl
  text: 'Ito ang mga pinuno ng mga sambahayan ng kanilang mga ninuno: ang mga anak ni Ruben, na panganay ni Israel, ay sina Hanoc, Pallu, Hezron, at Carmi. Ito ang mga angkan ni Ruben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבֹתָם
  choice: mga pinuno ng kani-kanilang sambahayan ng mga ninuno
  rationale: Pinananatili ang diwa ng mga kinikilalang ulo o pinuno ng mga yunit ng angkan, habang natural na ipinahahayag sa modernong Tagalog ang distributibong panghalip.
- source_word: בְּנֵי רְאוּבֵן
  choice: mga anak ni Ruben
  rationale: Tuwirang tumutukoy ang kasunod na talaan sa mga anak ni Ruben, hindi lamang sa mas malawak niyang mga inapo.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: na panganay ni Israel
  rationale: Malinaw na inuugnay kay Ruben ang appositional na paglalarawang siya ang panganay ni Israel.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: sina Hanoc, Pallu, Hezron, at Carmi
  rationale: Ginamit ang natural na pantukoy na “sina” para sa talaan ng mga pangalan at mga anyong transliterasyon na karaniwan at madaling basahin sa Filipino.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa kontekstong pantribo at talaangkanan, tumutukoy ito sa mga pangkat na magkakamag-anak na mas malawak kaysa karaniwang nukleyar na pamilya.
