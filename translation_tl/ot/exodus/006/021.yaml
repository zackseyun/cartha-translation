- source_word: וָ/נֶפֶג
  choice: at Nefeg
  rationale: Pangalang pantangi na may pangatnig; ginamit ang ‘Nefeg’ upang malapit na katawanin ang mga katinig ng Hebreo.
- source_word: וְ/זִכְרִי
  choice: at Zikri
  rationale: Pangalang pantangi na may pangatnig; ang ‘Zikri’ ay malapit sa anyong Hebreo at natural basahin sa Filipino.
