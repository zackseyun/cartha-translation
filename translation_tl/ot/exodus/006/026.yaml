  rationale: Ginawang “pinag-utusan ni Yahweh” ang pagkakalarawan kina Aaron at Moises upang maging mas natural at malinaw sa Filipino ang simpleng pandiwang “sinabi” kapag sinusundan ito ng isang tuwirang utos. Pinalitan ang “kanilang mga pangkat” ng “kani-kanilang mga pangkat” upang mas malinaw ang organisadong, distributibong diwa ng צְבָאֹתָם. Napanatili ang pangalan ni Yahweh, ang pampamilyang ekspresyong “mga anak ni Israel,” at ang mga talababa para sa mga leksikal na alternatibo.
