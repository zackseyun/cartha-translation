base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: tl
  text: 'Sina Aaron at Moises[a] ang pinag-utusan ni Yahweh: “Ilabas ninyo ang mga anak ni Israel[b] mula sa lupain ng Ehipto ayon sa kani-kanilang mga pangkat.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ang mga ito ay sina Aaron at Moises.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay literal na “mga anak na lalaki ni Israel”; sa konteksto, tumutukoy ito sa mga Israelita.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin, “ayon sa kanilang mga hukbo” o “kasama ng kanilang mga pangkat.” Ang salitang Hebreo ay maaaring tumukoy sa organisadong mga pangkat, kabilang ang mga pormasyong tulad ng hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Sina Aaron at Moises ang mga sinabihan
  rationale: Ang nagsasariling panghalip ay nagbibigay-diin sa pagkakakilanlan ng dalawang lalaking naunang binanggit. Isinaayos ito sa likas na hulma ng Tagalog habang pinananatili ang diin sa kanila.
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: Aaron at Moises
  rationale: Ginamit ang mga pangalang karaniwan at matagal nang kinikilala sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinumbasan ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הוֹצִיאוּ
  choice: Ilabas ninyo
  rationale: 'Pinananatili nito ang causative at pangmaramihang pautos: sila ang magpapalabas sa Israel mula sa Ehipto.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Likas sa Tagalog at tapat sa literal na larawang pampamilya ng Hebreo; tumutukoy ito sa sambayanang nagmula kay Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang pagbanggit sa lupain at ang diwa ng pinagmulan ng paglabas.
- source_word: עַל צִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Ipinahahayag ang organisadong pagkakahati ng Israel nang hindi nililimitahan ang salita sa purong militar na kahulugan; inilalahad sa talababa ang mas militar na alternatibo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang ekspresyong pampamilya ng Hebreo, habang nililinaw sa talababa ang mas kontekstuwal na tawag sa buong bayan.
- issue: Kahulugan ng צִבְאֹתָם
  choice: kanilang mga pangkat
  alternative: kanilang mga hukbo
  rationale: Maaaring tumukoy ang salita sa mga hukbo o organisadong pangkat. Hindi tiyak na purong militar ang diin dito, kaya pinanatili sa talababa ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” at ang hulma na “ang mga sinabihan” upang maging likas ang pangungusap sa Tagalog, habang pinanatili sa mga talababa ang mga alternatibong mas pormal o literal.
