  - severity: low
    issue: Maaaring mas malinaw ang saklaw ng “kanilang mga pangkat.”
    rationale: Ang צְבָאֹתָם ay tumutukoy sa pagkakaayos ng bayan sa kani-kanilang pangkat/host. Ang “ayon sa kani-kanilang mga pangkat” ay mas malinaw na nagpapakita ng organisadong pagkakahati.
