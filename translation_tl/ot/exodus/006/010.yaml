lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive at pandiwang דבר ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos, nagsalita” upang ipakita ang pagkakasunod-sunod at mapanatili ang diwang “speak.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Karaniwang panandang Tagalog para sa direksiyon ng pagsasalita patungo sa isang taong may pantanging pangalan.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakasanayang anyo ng pangalang biblikal sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nagpapakilala sa tuwirang pananalitang kasunod, bagaman maaari ring paikliin sa mas idyomatikong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay transliterasyon ng personal na pangalan at hindi pamalit na titulo; itinatala sa talababa ang ibang nakagawiang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal na hulma ng pormulang Hebreo dahil ang talata ay panimula sa kasunod na tuwirang pahayag.
