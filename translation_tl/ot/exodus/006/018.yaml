  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: tl
  text: Ang mga anak na lalaki ni Kohat ay sina Amram, Izhar, Hebron, at Uziel. At ang mga taon ng buhay ni Kohat ay isandaan at tatlumpu’t tatlong taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: Ang mga anak ni Kohat
  rationale: Ang בְּנֵי ay construct plural na nangangahulugang “mga anak na lalaki.” Sa talaangkanang ito, ang mga agarang anak ni Kohat ang pinapangalanan; likas sa modernong Tagalog na gamitin ang pangkalahatang “mga anak.” Hindi na hiwalay na isinalin ang panimulang waw sapagkat mas natural dito ang anyong paksa o talaan.
- source_word: קְהָת
  choice: Kohat
  rationale: Isinalin sa baybay na karaniwang ginagamit sa Tagalog para sa pangalang Hebreo.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Amram, Izhar, Hebron, at Uziel
  rationale: Apat na pangalang pantangi ang inilista; ginamit ang mga kuwit at panghuling “at” ayon sa likas na ayos ng Tagalog.
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: At ang mga taon ng buhay ni Kohat ay
  rationale: Pinananatili ang Hebreong idyomang “mga taon ng buhay” sa paraang malinaw at marangal sa Tagalog, sa halip na gawing mas interpretatibong “haba ng buhay.” Isinalin ang waw na “At” upang mapanatili ang pag-uugnay sa ikalawang pahayag.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: isandaan at tatlumpu't tatlong taon
  rationale: Inayos ang bilang ayon sa karaniwang pagkakasunod sa Tagalog. Ginawang maramihan ang “taon,” gaya ng hinihingi ng likas na gamit sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sina” sa listahan ng mga pangalan at pinanatili ang bahagyang pormal na pariralang “mga taon ng buhay” upang maging malapit sa anyo ng Hebreo nang hindi nagiging mahirap basahin.
