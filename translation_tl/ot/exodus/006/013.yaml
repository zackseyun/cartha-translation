  - severity: low
    issue: Maaaring pasinawin ang pariralang tumutukoy kay Faraon.
    rationale: Ang “si Faraon, na hari ng Ehipto” ay mas malinaw na apposition sa modernong Tagalog at pinananatili ang “Pharaoh king of Egypt.”
