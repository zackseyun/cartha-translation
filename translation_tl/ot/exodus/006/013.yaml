  naturalness: Likas sa makabagong Tagalog ang pangunahing pangungusap. Mas malinaw at mas idiomatiko ang appositional na “si Faraon, na hari ng Ehipto” kaysa “ang Faraon na hari ng Ehipto.”
  terminology: Ang “Yahweh,” “Moises,” “Aaron,” “Faraon,” “Ehipto,” “mga anak ni Israel,” at “lupain” ay angkop at magkakatugma sa salin. Kailangang alisin ang “Sa literal” sa talababa b, sapagkat literal na nasa pangunahing teksto ang “mga anak ni Israel.”
