  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: tl
  text: Pagkatapos, nagsalita si Yahweh kina Moises at Aaron at inutusan niya sila tungkol sa mga anak ni Israel[b] at kay Faraon, na hari ng Ehipto,[a] upang ilabas ang mga anak ni Israel mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring unawain na ang utos ay iparating sa mga anak ni Israel at kay Faraon, na hari ng Ehipto. Maaaring markahan ng pang-ukol sa Hebreo ang mga pinatutunguhan ng utos, ngunit sa konteksto ay malamang na tumutukoy ito sa mga taong may kinalaman sa utos na ibinigay kina Moises at Aaron.
    reason: alternative_reading
  - marker: b
    text: Maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” at naipapakita nito ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Sa pandiwang “nagsalita,” tinutukoy ng אֶל ang mga kinausap. Ang “kina” ang likas at maikling anyo sa Tagalog para sa dalawang pangalang pantangi.
- source_word: וַיְצַוֵּם
  choice: at inutusan niya sila
  rationale: Pinananatili ng “inutusan” ang awtoritatibong diwa ng צוה, at ang “sila” ay tumutukoy kina Moises at Aaron.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: tungkol sa mga anak ni Israel
  rationale: Pagkatapos ng צוה, maaaring tukuyin ng אֶל ang mga taong may kinalaman sa utos, hindi lamang ang tuwirang pinagsabihan. Pinananatili ng “tungkol sa” ang malamang na diwa habang itinatala sa talababa ang alternatibong pagbasa.
- source_word: וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: at sa Faraon na hari ng Ehipto
  rationale: Kaagapay ito ng naunang pariralang אֶל at saklaw pa rin ng “tungkol sa.” Ang “Faraon na hari ng Ehipto” ay malinaw at malapit sa ayos ng Hebreo.
- source_word: לְהוֹצִיא
  choice: upang ilabas
  rationale: Ang Hiphil infinitive ng יצא ay may sanhiang diwa, “papalabasin.” Ang “upang ilabas” ay likas na Tagalog at angkop sa konteksto ng paglabas mula sa Ehipto.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pampamilya at pambansang paglalarawan ng Hebreo; ibinibigay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Hayagang naroon sa Hebreo ang אֶרֶץ, “lupain,” kaya pinanatili ang kongkretong heograpikong pahayag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang personal na pangalan sa pamamagitan ng karaniwang rekonstruksiyong “Yahweh,” sa halip na tahimik itong palitan ng titulo.
- issue: Kung ang utos ay tungkol sa Israel at Faraon o tuwirang nakatuon sa kanila
  choice: tungkol sa mga anak ni Israel at sa Faraon
  alternative: ang utos ay iparating sa mga anak ni Israel at sa Faraon
  rationale: Ang mga tuwirang inutusan ay sina Moises at Aaron, kaya mas maayos sa konteksto na ang utos ay may kinalaman sa Israel at sa Faraon. Gayunman, kayang markahan ng אֶל ang mga pinatutunguhan ng utos, kaya pinanatili ang tunay na kalabuan sa talababa.
- issue: Pagpapakinis sa בְּנֵי יִשְׂרָאֵל bilang pangkalahatang katawagan
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili ng napiling anyo ang literal na pampamilya at pambansang katawagan ng Hebreo nang hindi nilulutas o binabago ang representatibong panlalaking anyo nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kina” para sa likas na pagtukoy kina Moises at Aaron, ngunit pinanatili ang “mga anak ni Israel” at “lupain ng Ehipto” upang maipakita ang mahahalagang anyo ng Hebreo. Ang dalawang talababa ay parehong may katugmang pananda sa pangunahing teksto.
