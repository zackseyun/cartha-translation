base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: tl
  text: Ang mga anak ni Kora ay sina Asir, Elkana, at Abiasaf. Ito ang mga angkan[a] ng mga Koraita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa malalaking pangkat ng magkakamag-anak sa loob ng isang lipi; ginamit dito ang “mga angkan” dahil sa kontekstong talaangkanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Ang mga anak ni
  rationale: Ang בְּנֵי ay construct plural na nangangahulugang “mga anak na lalaki/mga anak ni.” Sa tuwirang talaangkanang ito, natural at sapat sa Filipino ang “mga anak ni”; hindi na kailangang isalin nang hiwalay ang panimulang וּ bilang “at.”
- source_word: קֹרַח
  choice: Kora
  rationale: Pangalan ng tao; ginamit ang malinaw at likas na anyong Filipino.
- source_word: אַסִּיר
  choice: Asir
  rationale: Pangalan ng tao sa kontekstong talaangkanan, hindi ang karaniwang pangngalang maaaring mangahulugang “bilanggo.”
- source_word: וְאֶלְקָנָה
  choice: Elkana
  rationale: Pangalan ng tao; ang pang-ugnay na וְ ay likas na naipahahayag sa bantas at sa “at” bago ang huling pangalan.
- source_word: וַאֲבִיאָסָף
  choice: Abiasaf
  rationale: Pangalan ng tao; isina-Filipino ang transliterasyon at ginamit ang “f” para sa huling tunog na pe na walang dagesh.
- source_word: אֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala ng demonstratibo ang mga pangkat na kinilala sa kasunod na parirala; “Ito ang” ang natural na hulma sa Filipino.
- source_word: מִשְׁפְּחֹת
  choice: mga angkan
  rationale: Sa kontekstong pantribo at talaangkanan, tumutukoy ito sa malalaking pangkat ng magkakamag-anak, kaya mas tiyak ang “mga angkan” kaysa sa karaniwang “mga pamilya.”
- source_word: הַקָּרְחִי
  choice: mga Koraita
  rationale: Ang anyong gentilic ay tumutukoy sa mga kabilang sa angkan o linya ni Kora; “mga Koraita” ang maikli at malinaw na katawagang Filipino.
