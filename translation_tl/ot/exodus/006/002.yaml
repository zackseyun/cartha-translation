  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: tl
  text: Nagsalita ang Diyos kay Moises at sinabi niya sa kanya, “Ako si Yahweh[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, ang banal na pangalan ng Diyos.'
    reason: Ipinapaliwanag ang anyong Hebreo ng pangalang isinaling “Yahweh” nang hindi pinapalitan ang personal na pangalan ng isang titulo.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Nagsalita
  rationale: Karaniwang pandiwa ito sa salaysay upang ipakilala ang pagsasalita ng Diyos; natural at tuwiran ang “nagsalita” sa Filipino.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman anyong maramihan ang salita, isahan ang pandiwang kaugnay nito at tumutukoy ito sa Diyos ng Israel.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa pinag-uukulan ng pagsasalita, at “kay Moises” ang likas na anyo sa Filipino.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: at sinabi sa kanya
  rationale: Pinananatili ang ikalawang pandiwa ng pagsasalita sa Hebreo at ang malinaw na pagtukoy nito kay Moises.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Ang “Ako si” ang natural na Filipino para sa mariing pagpapakilala ng sarili sa nominal na pangungusap ng Hebreo; pinananatili ang personal na banal na pangalan bilang “Yahweh.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay malapit na transliterasyon ng banal na pangalan at hindi pinapalitan ng isang titulo; inilalahad sa talababa ang anyong YHWH at ang tradisyonal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang dalawang pandiwa ng pagsasalita sa Hebreo (“nagsalita” at “sinabi”) at ginamit ang natural na pormulang “Ako si” para sa pagpapakilala ng sarili.
