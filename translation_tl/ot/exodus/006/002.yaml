  - severity: low
    issue: Hindi tiyak ang pahayag sa talababa na “tinutumbasan din ng ‘Jehovah.’”
    rationale: Hindi ito ang karaniwang anyong Filipino (karaniwan ay “Jehova”), at hindi kailangan ang alternatibong ito upang ipaliwanag ang anyong Hebreo. Ang tuwirang paliwanag sa YHWH ay mas malinaw at mas kaayon ng napiling “Yahweh.”
