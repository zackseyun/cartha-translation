base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: tl
  text: Sinabi ni Moises ang mga bagay na ito sa mga Israelita, ngunit hindi sila nakinig kay Moises dahil sa panghihina ng loob[a] at sa malupit na pagkaalipin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “dahil sa kaiklian ng espiritu.” Maaari rin itong tumukoy sa panlulumo o sa nasisikil at durog na kalooban.
    reason: lexical_alternative
  - marker: b
    text: O, “dahil sa mabigat na paggawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sinabi
  rationale: Ang piel na דִּבֵּר ay nangangahulugang “magsalita.” Sa salaysay na ito, natural sa modernong Tagalog ang “sinabi” dahil may tinutukoy na mensaheng ipinahayag ni Moises.
- source_word: כֵּן
  choice: ito
  rationale: Tumutukoy ang כֵּן sa mensaheng nauna nang ibinigay ng Diyos. Ang “ito” ang pinakanatural na panumbas sa Tagalog nang hindi gumagamit ng makalumang “gayon.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” ang parirala ay karaniwang katawagan sa sambayanang Israel. Malinaw at likas sa modernong Tagalog ang “mga Israelita,” at hindi nito ipinahihiwatig na mga lalaki lamang ang kausap.
- source_word: שָׁמְעוּ אֶל
  choice: nakinig sa
  rationale: Ang idyomang שׁמע אל ay tumutukoy sa pakikinig o pagbibigay-pansin sa isang tao. Ang “nakinig sa” ay natural at pinananatili ang posibilidad na hindi nila kayang tanggapin o tugunan ang sinabi.
- source_word: מִקֹּצֶר רוּחַ
  choice: dahil sa panghihina ng loob
  rationale: Literal itong “dahil sa kaiklian ng espiritu,” na naglalarawan ng panloob na pagkasikil, kawalan ng sigla, o matinding pagkadurog ng loob. Ang “panghihina ng loob” ay malinaw at likas na idyomang Tagalog habang ang literal na larawan ay inilalagay sa talababa.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: at sa malupit na pagkaalipin
  rationale: Maaaring tumukoy ang עֲבֹדָה sa paggawa o paglilingkod, ngunit sa konteksto ng Ehipto ito ay sapilitang paggawa sa ilalim ng pagkaalipin. Ipinahahayag ng “malupit na pagkaalipin” ang mapaniil na kalagayan, habang binabanggit sa talababa ang mas literal na “mabigat na paggawa.”
theological_decisions:
- issue: Kung ang עֲבֹדָה קָשָׁה ay isasaling paggawa o pagkaalipin
  choice: malupit na pagkaalipin
  alternative: mabigat na paggawa
  rationale: Saklaw ng pangngalan ang paggawa o paglilingkod, ngunit malinaw sa konteksto ng Exodo na sapilitan at mapang-alipin ang gawaing ipinataw sa Israel. Pinili ang “pagkaalipin” sa teksto at pinanatili sa talababa ang leksikal na alternatibo.
- issue: Kahulugan ng מִקֹּצֶר רוּחַ
  choice: panghihina ng loob
  alternative: kaiklian ng espiritu; kawalan ng tiyaga
  rationale: Hindi tiyak na simpleng pagkainip ang tinutukoy. Sa konteksto ng matinding pang-aapi, mas malamang na inilalarawan nito ang durog o nasisikil na kalooban. Pinananatili ng talababa ang literal na larawan at ang tunay na lawak ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga Israelita” bilang likas na katawagan sa buong bayan, at inilagay ang mga literal o posibleng alternatibong pagbasa sa mga talababa upang hindi mawala ang ambiguity ng Hebreo.
