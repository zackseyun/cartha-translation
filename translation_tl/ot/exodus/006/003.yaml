base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: tl
  text: Nagpakita ako kay Abraham, kay Isaac, at kay Jacob bilang Diyos na Makapangyarihan sa Lahat,[a] ngunit sa pangalan kong Yahweh ay hindi nila ako nakilala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: El Shaddai; karaniwang isinasaling “Diyos na Makapangyarihan sa Lahat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Hindi ko ipinakilala ang sarili ko sa kanila sa pamamagitan ng pangalan kong Yahweh.” Maaaring hindi ito tumukoy sa hindi nila pag-alam sa mismong pangalan, kundi sa hindi pa nila ganap na pagkakilala sa kahulugan nito kaugnay ng tipan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: Nagpakita ako
  rationale: Ang Niphal na anyo ng ראה ay tuwirang nangangahulugang “nagpakita ako” sa konteksto ng pagpapakita ng Diyos sa mga patriyarka.
- source_word: אֶל ... אֶל ... וְאֶל
  choice: kay Abraham, kay Isaac, at kay Jacob
  rationale: Pinanatili ang inuulit na pang-ukol sa likas na Tagalog upang maipahayag ang ritmo at diin ng Hebreo.
- source_word: בְּאֵל שַׁדָּי
  choice: bilang Diyos na Makapangyarihan sa Lahat
  rationale: Ang בְּ ay ginagamit dito sa diwang “bilang,” at ang אֵל שַׁדָּי ay isinalin bilang titulo sa malinaw at marangal na modernong Tagalog.
- source_word: וּשְׁמִי יְהוָה
  choice: sa pangalan kong Yahweh
  rationale: Pinananatili ang konstruksiyong tumutukoy sa pangalan at isinasalin ang tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: hindi nila ako nakilala
  rationale: Likas itong pahayag sa Tagalog na kumakatawan sa statibo o pasibong “hindi ako nakilala sa kanila,” nang hindi nilulutas kung pangalan mismo o buong kabuluhan nito ang hindi pa nila nakilala.
theological_decisions:
- issue: Kahulugan ng hindi pagkakilala ng mga patriyarka sa Diyos sa pangalang Yahweh
  choice: Pinanatili sa pangunahing teksto ang “hindi nila ako nakilala sa pangalan kong Yahweh,” na hindi tahasang nagpapasiya kung ganap na hindi nila alam ang pangalan o hindi pa nila lubos na nakikilala ang kabuluhan nito.
  alternative: Hindi ko ipinakilala ang sarili ko sa kanila sa pamamagitan ng pangalan kong Yahweh.
  rationale: Maaaring ipakahulugan ang Niphal ng ידע bilang statibo o may refleksibong diwa. Dahil lumilitaw ang pangalang Yahweh sa mga salaysay tungkol sa mga patriyarka sa Genesis, dapat panatilihin ang tensiyon at ilagay sa talababa ang posibleng mas malalim na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “kay” sa bawat patriyarka para sa likas na ritmo, at “Yahweh” upang malinaw na katawanin ang personal na pangalan ng Diyos. Inilagay ang mga panandang [a] at [b] sa pangunahing teksto at itinugma ang bawat isa sa wastong talababa.
