  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Ngayon ay makikita mo kung ano ang gagawin ko sa Paraon. Sapagkat dahil sa makapangyarihang kamay[a] ay pakakawalan niya sila, at dahil sa makapangyarihang kamay ay itataboy niya sila mula sa kanyang lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “sapilitang pakakawalan niya sila, at sapilitang itataboy niya sila.” Ang dalawang ulit na pariralang “dahil sa makapangyarihang kamay” ay maaaring magpahiwatig na kikilos ang Paraon dahil sa puwersang hindi niya malalabanan—sa huli, dahil sa kapangyarihan ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos ay sinabi” upang ipakita ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עַתָּה תִרְאֶה
  choice: Ngayon ay makikita mo
  rationale: Pinananatili nito ang temporal na diin ng עַתָּה at ang tuwirang hinaharap na diwa ng pandiwa.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: kung ano ang gagawin ko sa Paraon
  rationale: Natural itong Filipino para sa relative clause at hindi nito labis na binibigyang-kahulugan ang ל bilang tahasang “laban kay.”
- source_word: בְיָד חֲזָקָה
  choice: sa pamamagitan ng makapangyarihang kamay
  rationale: Pinananatili ang Hebreong idyoma at ang dalawang ulit na paglitaw nito. Ang “makapangyarihan” ay malinaw at marangal na katumbas ng חֲזָקָה sa kontekstong tumutukoy sa puwersang hindi malalabanan.
- source_word: יְשַׁלְּחֵם
  choice: pakakawalan niya sila
  rationale: Sa konteksto ng Exodo, tumutukoy ang שלח sa pagpapahintulot ng Paraon na umalis ang Israel; natural at tuwiran ang “pakakawalan.”
- source_word: יְגָרְשֵׁם
  choice: itataboy niya sila
  rationale: Mas malakas ang גרש kaysa simpleng pagpapaalis; ipinahahayag ng “itataboy” ang sapilitang pagpapalayas.
- source_word: מֵאַרְצוֹ
  choice: mula sa kanyang lupain
  rationale: Ang “lupain” ay malawak at angkop na katumbas ng אֶרֶץ at pinananatili ang panghalip na tumutukoy sa Paraon.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ang pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo o magpasok ng tradisyong denominasyonal.
- issue: Kung kaninong kapangyarihan ang tinutukoy ng “makapangyarihang kamay”
  choice: Panatilihin sa pangunahing teksto ang idyomang “sa pamamagitan ng makapangyarihang kamay” nang hindi tahasang tinutukoy ang may-ari ng kamay
  alternative: Dahil sa pamimilit ay pakakawalan niya sila; dahil sa makapangyarihang kamay ng Diyos ay pakakawalan niya sila
  rationale: Maaaring ipahiwatig ng parirala na kikilos ang Paraon dahil sa di-malalabang puwersa, sa huli ay kapangyarihan ng Diyos, ngunit hindi tahasang binabanggit ng Hebreo ang may-ari ng kamay. Pinananatili ng salin ang tunay na kalabuan at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit at larawan ng Hebreong idyoma, habang ginawang natural ang daloy ng pangungusap. Inilagay ang tandang [a] sa mismong pariralang tinatalakay ng talababa.
