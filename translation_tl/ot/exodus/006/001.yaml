  to: Pagkatapos ay sinabi ni Yahweh kay Moises, “Ngayon ay makikita mo kung ano ang gagawin ko sa Paraon. Sapagkat dahil sa makapangyarihang kamay[a] ay pakakawalan niya sila, at dahil sa makapangyarihang kamay ay itataboy niya sila mula sa kanyang lupain.”
