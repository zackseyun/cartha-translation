  terminology: Ang “Yahweh,” “Moises,” at “Paraon” ay naaayon sa proyekto at sa modernong Filipino. Ang “pakakawalan,” “itataboy,” at “lupain” ay angkop at napananatili ang pagpapalakas mula sa pagpapalaya tungo sa sapilitang pagpapalayas.
