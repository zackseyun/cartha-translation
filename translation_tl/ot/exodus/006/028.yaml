translation:
  language: tl
  text: Nangyari ito noong araw na nagsalita si Yahweh kay Moises sa lupain ng Ehipto—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At nangyari ito” o “At naganap ito.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “YHWH”; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Nangyari ito
  rationale: Ang anyong ito ng היה na may waw ay naglilipat o nagpapatuloy sa salaysay. Natural sa modernong Tagalog ang “Nangyari ito”; ang “ito” ay kailangan upang maging buo at malinaw ang impersonal na pahayag, samantalang pinananatili ng gitling ang pagpapatuloy sa susunod na talata.
- source_word: בְּיוֹם
  choice: nang araw
  rationale: Pinananatili nito ang tahasang temporal na larawan ng Hebreong “sa/nang araw,” sa halip na paikliin lamang bilang “nang.”
- source_word: דִּבֶּר
  choice: magsalita
  rationale: Karaniwang kahulugan ng דבר ang “magsalita.” Sa sugnay na temporal, likas sa Tagalog ang anyong “nang ... magsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH bilang personal na pangalan, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ito ang natural na panandang Tagalog para sa taong pinatutungkulan sa pariralang “magsalita ... kay Moises.”
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang salitang אֶרֶץ, “lupain,” habang gumagamit ng karaniwan at marangal na anyong Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Personal na pangalang YHWH ang nasa Hebreo. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na ipalit ang titulong “ang PANGINOON”; ang “Jehova” ay isa pang tradisyonal na anyo ng pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Pinanatili ang “lupain ng Ehipto” at ang pangalang “Yahweh.” Ang em dash ay nagpapakitang hindi pa tapos ang pangungusap o salaysay sa hangganan ng talatang ito at nagpapatuloy ito sa kasunod na talata.
