base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: tl
  text: Kinuha ni Aaron bilang asawa si Eliseba, na anak na babae ni Aminadab at kapatid na babae ni Naason. Ipinanganak ni Eliseba kay Aaron sina Nadab, Abihu, Eleazar, at Itamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Pinananatili nito ang pangunahing diwa ng Hebrew na לקח, habang nililinaw ng pariralang “bilang asawa” na kasal ang tinutukoy.
- source_word: אֱלִישֶׁבַע
  choice: Eliseba
  rationale: Transliterasyon ng pangalang Hebreo na angkop sa makabagong bigkas at baybay sa Filipino.
- source_word: בַּת עַמִּינָדָב
  choice: anak ni Aminadab
  rationale: Natural na Filipino para sa tuwirang ugnayang anak na babae; hindi na kailangang tukuyin ang kasarian dahil malinaw na babae si Eliseba.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: kapatid ni Naason
  rationale: Ang “kapatid” ang natural na salin sa Filipino; malinaw sa tinutukoy na si Eliseba ang babaeng kapatid.
- source_word: לוֹ לְאִשָּׁה
  choice: bilang asawa
  rationale: Malinaw at natural na ipinahahayag ang pormal na ugnayang mag-asawa nang hindi dinaragdagan ang teksto.
- source_word: וַתֵּלֶד לוֹ
  choice: Ipinanganak niya kay Aaron
  rationale: Natural na Filipino para sa Hebreong pahayag na nanganak siya para sa kaniya; inuulit ang pangalang Aaron upang maiwasan ang malabong panghalip.
- source_word: נָדָב
  choice: Nadab
  rationale: Karaniwang transliterasyon ng pangalang Hebreo.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Karaniwang transliterasyon ng pangalang Hebreo.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Karaniwang transliterasyon ng pangalang Hebreo.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Transliterasyong malapit sa anyong Hebreo at natural sa Filipino.
