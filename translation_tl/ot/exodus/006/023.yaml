  terminology: Ang mga pangalang Aaron, Eliseba, Aminadab, Naason, Nadab, Abihu, Eleazar, at Itamar ay angkop at magkakatugma sa karaniwang Filipino/Tagalog na transliterasyon. Ang “bilang asawa” ay wastong katumbas ng pormulang Hebreo para sa pag-aasawa.
