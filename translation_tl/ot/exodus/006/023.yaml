  source_fidelity: 'Tumpak ang pangunahing nilalaman ng draft: si Aaron ang kumuha kay Eliseba bilang asawa, at si Eliseba ang nagsilang kay Aaron ng apat na anak na lalaki sa wastong pagkakasunod. Gayunman, ang hayagang mga katawagang pambabae sa Hebreo—“anak na babae” at “kapatid na babae”—ay hindi dapat alisin sa isang optimal-equivalence na salin, kahit mahihinuha ang mga ito mula sa pangalan ni Eliseba.'
