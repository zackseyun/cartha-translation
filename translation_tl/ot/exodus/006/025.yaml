revisions:
- from: At kumuha si Eleazar na anak ni Aaron ng mapapangasawa mula sa mga anak na babae ni Putiel[a], at ipinanganak nito sa kaniya si Finehas. Ito ang mga pinuno ng mga angkan ng mga ninunong Levita, ayon sa kani-kanilang lipi.[b]
  to: At kumuha si Eleazar, na anak ni Aaron, ng isang asawa mula sa mga anak na babae ni Putiel[a], at isinilang niya si Finehas para kay Eleazar. Ito ang mga pinuno ng mga sambahayan ng mga Levita, ayon sa kanilang mga lipi.[b]
  rationale: 'Pinalitan ang hindi likas na “ipinanganak nito sa kaniya” ng malinaw na pangungusap kung saan ang asawa ang implicit na simuno: “isinilang niya si Finehas para kay Eleazar.” Inayos ang pangwakas na teknikal na parirala bilang “mga pinuno ng mga sambahayan ng mga Levita” at ipinaliwanag sa talababa ang kinship-household na gamit nito. Hindi tinukoy kung aling anak na babae ni Putiel ang asawa.'
