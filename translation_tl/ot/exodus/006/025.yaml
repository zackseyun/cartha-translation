base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: tl
  text: At kumuha si Eleazar, na anak ni Aaron, ng isang asawa mula sa mga anak na babae ni Putiel[a], at isinilang niya si Finehas para kay Eleazar. Ito ang mga pinuno ng mga sambahayan ng mga Levita, ayon sa kanilang mga lipi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “isa sa mga anak na babae ni Putiel.” Maaaring tumukoy ang Hebreong pananalita sa pag-aasawa sa pamilya ni Putiel nang hindi tinutukoy kung aling anak na babae.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga pinuno ng mga ama.” Isa itong katawagang pangkamag-anakan para sa mga pinuno ng mga sambahayang-angkan sa loob ng mga lipi ng mga Levita.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: kumuha ... ng mapapangasawa
  rationale: Pinananatili nito ang Hebreong idyoma ng pagkuha ng isang babae bilang asawa, ngunit ipinahahayag ito sa natural at marangal na makabagong Tagalog.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: mula sa mga anak na babae ni Putiel
  rationale: Pinananatili ng parirala ang di-tiyak na pahayag ng Hebreo tungkol sa pag-aasawa sa loob ng pamilya ni Putiel, sa halip na tahasang tukuyin na isa lamang sa kaniyang mga anak na babae.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: ipinanganak nito sa kaniya si Finehas
  rationale: Ang panghalip na “nito” ay tumutukoy sa naging asawa ni Eleazar at pinananatili ang babae bilang simuno at si Eleazar bilang pinag-ukulan.
- source_word: רָאשֵׁי אֲבוֹת
  choice: mga pinuno ng mga angkan ng mga ninuno
  rationale: Ipinahahayag nito ang teknikal na ugnayang panlipi at sambahayan, hindi lamang ang mga biyolohikal na ama.
- source_word: הַלְוִיִּם
  choice: mga Levita
  rationale: Karaniwang katawagan sa Tagalog para sa mga kabilang sa lipi o mga inapo ni Levi.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang lipi
  rationale: Sa kontekstong talaangkanan, ang מִשְׁפָּחָה ay tumutukoy sa mga pangkat ng magkakamag-anak o mga lipi.
- source_word: פּוּטִיאֵל / פִּינְחָס / אֶלְעָזָר / אַהֲרֹן
  choice: Putiel / Finehas / Eleazar / Aaron
  rationale: Ginamit ang mga anyo ng pangalang natural at nakikilala sa tradisyong Tagalog habang transliterado pa rin ang mga pangalang pantangi.
