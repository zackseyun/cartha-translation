base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: tl
  text: Itinatag ko rin ang aking tipan sa kanila upang ibigay sa kanila ang lupain ng Canaan, ang lupaing pinanirahan nila bilang mga dayuhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang lupain ng kanilang paninirahan bilang mga dayuhan, na doon sila nanirahan bilang mga dayuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: rin
  rationale: Ipinahahayag ang pandagdag na diwa ng וְגַם at likas na nag-uugnay sa naunang pahayag.
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: Itinatag ko ang aking tipan
  rationale: Ang “itinatag” ay marangal at karaniwang katumbas ng idyomang קום + בְּרִית, nang hindi nilalagyan ng dagdag na teolohikal na pagpapakahulugan.
- source_word: אִתָּם
  choice: sa kanila
  rationale: Tuwirang pinananatili ang ugnayang ipinahahayag ng pang-ukol at ang pagtukoy nito sa mga ninuno sa konteksto.
- source_word: לָתֵת לָהֶם
  choice: upang ibigay sa kanila
  rationale: Malinaw na ipinahahayag ang layunin ng pawatas at ang di-tuwirang layon.
- source_word: אֶרֶץ כְּנָעַן
  choice: ang lupain ng Canaan
  rationale: Pinananatili kapuwa ang pangngalang “lupain” at ang pangalang pantangi.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: ang lupaing pinanirahan nila bilang mga dayuhan
  rationale: Likas sa modernong Tagalog at pinananatili ang mahalagang diwa ng pansamantalang paninirahan bilang mga dayuhan, bagaman hindi inuulit nang tahasan ang magkaugnay na pangngalan at pandiwa sa Hebreo.
theological_decisions:
- issue: Idyomang pangtipan na קום + ברית
  choice: itinatag ko ang aking tipan
  alternative: pinagtibay ko ang aking tipan
  rationale: Ang “itinatag” ay nagpapanatili sa taimtim na wikang pangtipan at hindi nagpapasiya kung ang diin ay sa unang pagtatatag o sa pagpapatibay ng naunang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tipan” para sa bokabularyong pangtipan at “bilang mga dayuhan” upang malinaw na maipakita ang katayuang nakapaloob sa מָגוּר at גור.
