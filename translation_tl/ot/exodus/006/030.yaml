  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: tl
  text: Ngunit sinabi ni Moises sa harap ng PANGINOON, “Narito, hindi tuli ang aking mga labi; at paano ako pakikinggan ni Paraon?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ng PANGINOON
  rationale: Pinananatili ang literal at marangal na pahayag na tumutukoy sa pagsasalita ni Moises sa presensiya ng Diyos; ang tipograpiyang PANGINOON ang karaniwang pagkatawan sa tetragrammaton.
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Isang natural na panawag-pansin sa modernong Filipino, na nagpapanatili sa diin ng Hebreong particle.
- source_word: עֲרַל שְׂפָתַיִם
  choice: hindi tuli ang aking mga labi
  rationale: Pinananatili ang matapang at konkretong metapora ng Hebreo sa halip na agad itong ipakahulugang ‘utal’ o ‘mahinang magsalita.’
- source_word: יִשְׁמַע אֵלַי
  choice: ako pakikinggan
  rationale: Ipinahahayag ang diwa ng pakikinig o pagdinig na may pagtugon, habang pinananatili ang tanong ni Moises kung bibigyan siya ng pansin ng Paraon.
- source_word: פַרְעֹה
  choice: Paraon
  rationale: Gamit ang nakaugaliang modernong anyong Filipino para sa titulo ng pinuno ng Ehipto.
theological_decisions:
- issue: Ang kahulugan ng ‘hindi tuli ang mga labi’
  choice: 'Pinanatili bilang metapora: “hindi tuli ang aking mga labi.”'
  alternative: “Mahina akong magsalita” o “utal ako.”
  rationale: Hindi tiyak na tumutukoy ang Hebreo sa isang partikular na kapansanan sa pagsasalita. Ang literal na metapora ay nagpapanatili sa tunay na kalabuan at sa teolohikal na tensiyon ng pagtutol ni Moises.
- issue: Paglalarawan sa tugon ng Paraon
  choice: “paano ako pakikinggan”
  alternative: “paano ako susundin”
  rationale: Maaaring saklawin ng Hebreong שׁמע ang pagdinig at pagtugon, ngunit hindi dapat tahasang gawing ‘susundin’ dito dahil mas tiyak iyon kaysa sa anyong pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang kakaibang Hebreong metapora upang hindi alisin ang ambiguwidad ng teksto. Ang “Tingnan ninyo” ay plural/polite sa anyo ngunit ginagamit dito bilang likas na panawag-pansin sa kausap na may mataas na katayuan.
