  - severity: low
    issue: Medyo bitin ang “sabihin mo sa Faraon.”
    rationale: Dahil ang kasunod ay di-tuwirang nilalaman at hindi isang aktuwal na sipi, mas idiomatiko ang “kausapin mo si Faraon.”
  revised_text: Pumunta ka, kausapin mo si Faraon, ang hari ng Ehipto, upang payagan niyang lumabas mula sa kanyang lupain ang mga anak ni Israel.[a]
