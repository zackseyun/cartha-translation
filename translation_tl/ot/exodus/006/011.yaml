  naturalness: Mas natural sa makabagong Filipino ang “kausapin mo si Faraon” kaysa “sabihin mo sa Faraon” kapag walang tuwirang siniping mensahe. Ang inayos na ayos ng pangungusap ay malinaw at marangal nang hindi nagiging sobrang malaya.
