base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: tl
  text: Pumunta ka, kausapin mo si Faraon, ang hari ng Ehipto, upang payagan niyang lumabas mula sa kanyang lupain ang mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa literal, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Pumunta ka
  rationale: Ang pautos na anyo ng בוא ay maaaring mangahulugang “halika” o “pumunta.” Sa kontekstong isinusugo si Moises sa Faraon, “Pumunta ka” ang likas na salin sa Filipino.
- source_word: דַבֵּר אֶל
  choice: sabihin mo sa
  rationale: Tumutukoy ito sa pagsasalita kay Faraon. Ginamit ang “sabihin mo sa” upang malinaw at natural na maipakilala ang ipinag-uutos na mensahe sa kasunod na sugnay.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: Faraon, ang hari ng Ehipto
  rationale: Pinananatili nito ang appositional na ugnayan ng pangalan o titulo at ng paglalarawang “hari ng Ehipto,” sa natural na ayos ng Filipino.
- source_word: וִישַׁלַּח
  choice: na paalisin niya
  rationale: Ang prefixed verb pagkatapos ng pautos ay nagpapahayag dito ng nilalaman o nilalayong resulta ng pagsasalita ni Moises. Ang “paalisin niya” ay angkop sa konteksto ng pagpapalaya at paglabas ng Israel.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ng salin ang pampamilyang larawan ng Hebreong parirala, ngunit gumagamit ng likas na ekspresyon sa Filipino para sa mga inapo o sambayanan ni Israel.
- source_word: מֵאַרְצוֹ
  choice: sa kanyang lupain
  rationale: Kasama ng pandiwang “paalisin,” likas sa Filipino ang “paalisin ... sa kanyang lupain” at malinaw nitong ipinahihiwatig ang paglabas mula sa nasasakupan ng Faraon.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak na lalaki ni Israel
  rationale: Ang “mga anak ni Israel” ay nagpapanatili sa pampamilyang pahayag ng Hebreo at sa kolektibong pagtukoy sa bayan. Inilalagay sa talababa ang mas literal na anyong panlalaki upang hindi maitago ang anyo ng pinagmulang teksto, nang hindi ipinahihiwatig sa pangunahing teksto na mga lalaki lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Faraon” at “Ehipto,” na karaniwang anyo sa saling Biblikal na Tagalog, habang iniwasan ang sobrang lumang balangkas ng pangungusap.
