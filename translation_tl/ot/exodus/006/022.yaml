translation:
  language: tl
  text: At ang mga anak na lalaki ni Uziel ay sina Misael, Elzafan[a], at Sitri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Elzafan ay binabaybay ding Elizafan sa ilang tradisyon ng pagsasalin.
    reason: lexical_alternative
  - marker: b
    text: Ang Sitri ay binabaybay ding Zitri sa ilang tradisyon ng pagsasalin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: At ang mga anak ni
  rationale: Pinananatili ng “At” ang pagkakaugnay ng talaangkanan sa naunang talata. Likas sa modernong Tagalog ang “mga anak ni” para sa Hebreong construct na nangangahulugang “mga anak na lalaki ni”; malinaw sa mga kasunod na pangalang panlalaki ang konteksto.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Isinatinig ang pangalang Hebreo sa anyong malinaw at karaniwan sa Tagalog, nang hindi isinasalin ang kahulugan nito.
- source_word: מִישָׁאֵל
  choice: Misael
  rationale: Ginamit ang natural na baybay-Tagalog ng pangalang Hebreo, na kumakatawan sa tunog na /sh/ sa pamamagitan ng “s,” gaya ng karaniwang pag-aangkop sa Filipino.
- source_word: וְ/אֶלְצָפָן
  choice: Elzafan
  rationale: Isinatinig ang pangalan bilang “Elzafan,” gamit ang “f” para sa tunog ng Hebreong pe na walang dagesh; isinama ang pang-ugnay sa huling koordinasyon sa Tagalog.
- source_word: וְ/סִתְרִי
  choice: Sitri
  rationale: Ang “Sitri” ay tuwirang pag-aangkop sa Tagalog ng Hebreong סִתְרִי. Hindi ginawang “Zitri” ang unang katinig sapagkat samekh ang nasa tekstong Hebreo.
