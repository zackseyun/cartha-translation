  source_fidelity: 'Tumpak na naipapahayag ng draft ang sunod-sunod na pangako ni Yahweh: paglabas mula sa mga pasanin ng Ehipto, pagliligtas mula sa pagkaalipin, at pagtubos sa pamamagitan ng nakaunat na bisig at malalaking paghatol. Gayunman, ang “mga pasanin ng mga Ehipsiyo” ay maaaring mabasa bilang mga pasaning pag-aari o dinaranas ng mga Ehipsiyo, samantalang ang Hebreo ay tumutukoy sa mga pasaning kaugnay at ipinataw ng Ehipto. Ang “mga dakilang hatol” ay posible ngunit mas madaling maunawaan bilang mga pasiyang legal kaysa mga gawaing paghatol sa salaysay ng Exodo.'
  naturalness: Marangal at malinaw ang pangkalahatang rehistro. Mas likas at mas malinaw sa modernong Filipino ang “mga pasaning ipinataw ng Ehipto,” “pagkaaliping ipinataw nila,” “bisig na nakaunat,” at “mga dakilang paghatol.”
  terminology: Ang “Yahweh,” “tutubusin,” at “pagkaalipin” ay angkop at tapat sa mahahalagang termino. Ang “mga dakilang paghatol” ay pinananatili ang judicial na diwa ng מִשְׁפָּטִים nang hindi nililimitahan ang kahulugan sa mga hatol lamang bilang pasiya.
  issues:
