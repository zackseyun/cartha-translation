  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: tl
  text: Kaya sabihin mo sa mga anak ni Israel[a], ‘Ako si Yahweh. Ilalabas ko kayo mula sa ilalim ng mga pasaning ipinataw ng Ehipto, ililigtas ko kayo mula sa pagkaaliping ipinataw nila[b], at tutubusin ko kayo sa pamamagitan ng bisig na nakaunat at ng mga dakilang paghatol[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel”; tumutukoy ito sa bayang Israel.'
    reason: lexical_alternative
  - marker: b
    text: O “mula sa sapilitang paglilingkod sa kanila.” Ang salitang Hebreo ay maaaring mangahulugang paglilingkod o paggawa, ngunit dito ay tumutukoy sa mapaniil na pagkaalipin na ipinataw ng mga Ehipsiyo.
    reason: lexical_alternative
  - marker: c
    text: O “sa pamamagitan ng mga dakilang gawang paghatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kaya
  rationale: Likas na panandang Filipino ng bunga o konklusyon mula sa naunang pahayag ng Diyos.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang literal at pampamilyang pagpapahayag ng Hebreo; maaaring unawain bilang buong bayang Israel.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Tuwirang pinananatili ang pansariling pangalan ng Diyos sa Tetragrammaton at ang diin ng pagpapakilala sa sarili.
- source_word: וְהוֹצֵאתִי
  choice: Ilalabas ko kayo
  rationale: Tumpak na ipinahahayag ang causative na diwa ng pag-aalis sa kanila mula sa kalagayan ng pang-aapi.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: mula sa ilalim ng mga pasanin ng mga Ehipsiyo
  rationale: Pinananatili ang kongkretong larawang ‘mula sa ilalim’ at ang mga pasaning ipinataw ng mga Ehipsiyo.
- source_word: וְהִצַּלְתִּי
  choice: ililigtas ko kayo
  rationale: Natural sa Filipino at malinaw na nagsasaad ng pagsagip mula sa kapangyarihan at pang-aapi.
- source_word: מֵעֲבֹדָתָם
  choice: mula sa pagkaalipin sa kanila
  rationale: Sa kontekstong ito, ang עֲבֹדָה ay sapilitang paglilingkod o pagkaalipin, at ang hulaping panghalip ay tumutukoy sa mga Ehipsiyo.
- source_word: וְגָאַלְתִּי
  choice: tutubusin ko kayo
  rationale: Pinananatili ang legal, pampamilya, at teolohikal na diwa ng pagkilos ng isang manunubos.
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: sa pamamagitan ng nakaunat na bisig
  rationale: Pinananatili ang Hebreong antropomorpikong larawan ng makapangyarihang pagkilos ng Diyos.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: at ng mga dakilang hatol
  rationale: Malapit sa anyo ng Hebreo at nagpapanatili ng judicial na diwa; maaaring tumukoy sa mga dakilang gawang paghatol laban sa Ehipto.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang teksto ay gumagamit ng personal na pangalang tipan na YHWH; ang ‘Yahweh’ ay tuwirang transliterasyon at hindi pinapalitan ng titulo.
- issue: Saklaw ng לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ang pampamilyang metapora ng Hebreo nang hindi ipinapalagay na mga lalaki lamang ang tinutukoy; ipinapaliwanag sa talababa ang kolektibong saklaw.
- issue: Diwa ng עֲבֹדָה
  choice: pagkaalipin
  alternative: paglilingkod; sapilitang paggawa
  rationale: Sa salaysay ng Exodo, hindi neutral na serbisyo ang tinutukoy kundi mapaniil at sapilitang kalagayan, kaya ‘pagkaalipin’ ang pinakamalinaw.
- issue: Diwa ng שְׁפָטִים
  choice: mga dakilang hatol
  alternative: mga dakilang gawang paghatol
  rationale: Pinananatili ang sadyang maikli at judicial na pananalita ng Hebreo, habang kinikilala na maaaring tumukoy ito sa kongkretong mga pagkilos ng Diyos laban sa Ehipto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinananatili ang magkakasunod na pangako ng Diyos at ang mga kongkretong larawang ‘sa ilalim ng mga pasanin’ at ‘nakaunat na bisig,’ habang nililinaw sa talababa ang mga posibleng kahulugang leksikal.
