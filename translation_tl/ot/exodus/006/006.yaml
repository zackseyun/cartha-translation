revisions:
- from: Kaya sabihin mo sa mga anak ni Israel[a], ‘Ako si Yahweh. Ilalabas ko kayo mula sa ilalim ng mga pasanin ng mga Ehipsiyo, ililigtas ko kayo mula sa pagkaalipin sa kanila[b], at tutubusin ko kayo sa pamamagitan ng nakaunat na bisig at ng mga dakilang hatol[c].’
  to: Kaya sabihin mo sa mga anak ni Israel[a], ‘Ako si Yahweh. Ilalabas ko kayo mula sa ilalim ng mga pasaning ipinataw ng Ehipto, ililigtas ko kayo mula sa pagkaaliping ipinataw nila[b], at tutubusin ko kayo sa pamamagitan ng bisig na nakaunat at ng mga dakilang paghatol[c].’
  rationale: Nilinaw ang pinagmulan at mapaniil na katangian ng mga pasanin at pagkaalipin upang maiwasan ang maling pagbasa sa Filipino. Pinalitan ang “mga dakilang hatol” ng “mga dakilang paghatol” upang mas natural na maihatid ang plural na Hebreong tumutukoy sa mga hatol o pagkilos ng paghatol. Napanatili ang lahat ng pangunahing larawan, ang pagkakasunod ng mga pangako, ang pangalang Yahweh, at ang maingat na pagkakatali ng mga talababa.
