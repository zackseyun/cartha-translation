    issue: Hindi sapat ang linaw ng “mga pasanin ng mga Ehipsiyo.”
    rationale: Ang genitive na “ng Ehipto” sa מִתַּחַת סִבְלֹת מִצְרַיִם ay tumutukoy sa mga pasaning nauugnay sa mapaniil na paghahari ng Ehipto. Sa Filipino, maaaring magmungkahi ang “ng mga Ehipsiyo” na ang mga Ehipsiyo ang may dinaranas na pasanin. Ang “ipinataw ng Ehipto” ay nililinaw ang konteksto nang hindi binabago ang diwa.
  - severity: low
    issue: Ang “mga dakilang hatol” ay maaaring maging masyadong abstrakto sa Filipino.
    rationale: Ang plural na מִשְׁפָּטִים ay maaaring mangahulugan ng mga hatol o mga gawang paghatol. Ang “mga dakilang paghatol” ay mas idiomatiko at pinananatili ang saklaw ng Hebreo.
