base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: tl
  text: At ang mga anak ni Simeon ay sina Jemuel, Jamin, Ohad, Jakin, Zohar, at Shaul[a], na anak ng babaeng Cananeo. Ito ang mga angkan ni Simeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin ang Shaul bilang “Saul.” Ang anyong Hebreo rito ay שָׁאוּל (Shaul).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: At ang mga anak ni Simeon
  rationale: Pinananatili ng “At” ang pang-ugnay na waw at ang pagpapatuloy ng talaangkanan; ang “mga anak” ang likas na salin ng construct plural na בְּנֵי sa kontekstong ito.
- source_word: יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר
  choice: Jemuel, Jamin, Ohad, Jakin, Zohar
  rationale: Ginamit ang nakagawiang anyo ng mga pangalang biblikal sa Filipino, na kaayon ng mga anyong malapit sa Hebreo at madaling makilala ng mambabasa.
- source_word: וְשָׁאוּל
  choice: at Shaul[a]
  rationale: Ang “Shaul” ay tuwirang kumakatawan sa Hebreong שָׁאוּל; inilakip sa talababa ang tradisyonal na anyong “Saul.”
- source_word: בֶּן הַכְּנַעֲנִית
  choice: na anak ng babaeng Cananeo
  rationale: Tahasan nitong ipinapakita ang pambabaeng anyo ng הַכְּנַעֲנִית at iniiwasan ang posibleng pag-aakalang lalaki ang tinutukoy.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: Ito ang mga angkan ni Simeon
  rationale: Ang “angkan” ay mas angkop kaysa “pamilya” para sa mga pangkat na magkakamag-anak sa loob ng isang tribo; likas sa Filipino ang isahang demonstratibong “Ito” bilang pagtukoy sa kabuuang tala.
