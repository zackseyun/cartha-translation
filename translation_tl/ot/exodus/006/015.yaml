translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng talaangkanan ngunit hindi inulit ang “at” bago ang bawat pangalan, sapagkat mas natural sa Filipino ang paggamit ng mga kuwit at isang panghuling “at.”
