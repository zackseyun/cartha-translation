  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: tl
  text: Sila ang mga nagsalita kay Faraon, na hari ng Egipto, upang ilabas sa Egipto ang mga anak na lalaki ni Israel—sina Moises at Aaron ang mga iyon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin nang mas literal: “Sila ang mga nagsasalita kay Faraon na hari ng Egipto.” Gumagamit ang Hebreo ng participle upang ilarawan sila ayon sa gawaing ito.'
    reason: lexical_alternative
  - marker: b
    text: Madalas na isinasalin ang pariralang Hebreo bilang “mga anak ni Israel” o “mga Israelita”; mas tiyak na literal ang “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: Sila ang
  rationale: Binibigyang-diin at muling kinikilala ng hiwalay na panghalip ang dalawang lalaking naunang binanggit.
- source_word: הַמְדַבְּרִים
  choice: nagsasalita
  rationale: Ang participle ay naglalarawan sa kanila ayon sa kanilang patuloy o katangiang gawain; natural sa Tagalog ang aspektong di-ganap na “nagsasalita.”
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: kay Faraon na hari ng Egipto
  rationale: Ang “kay” ang likas na pananda para sa taong kinakausap, at pinananatili ng “na hari ng Egipto” ang appositional na titulo.
- source_word: לְהוֹצִיא
  choice: upang ilabas
  rationale: Ang Hiphil ng יצא ay causative; malinaw na ipinapahayag ng “ilabas” ang pagpapalabas nang hindi dinaragdagan ng ideya ng pamumuno.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak na lalaki ni Israel
  rationale: Pinananatili nito ang tiyak na panlalaking anyo ng Hebrew na בְּנֵי, sa halip na gawing pangkalahatang “mga anak” o etnikong “mga Israelita.”
- source_word: מִמִּצְרָיִם
  choice: mula sa Egipto
  rationale: Natural itong kabit ng “ilabas” at tapat sa pinanggalingang ipinahihiwatig ng מִן.
- source_word: הוּא מֹשֶׁה וְאַהֲרֹן
  choice: sila nga sina Moises at Aaron
  rationale: Bagaman isahan ang resumptive pronoun na הוּא, tinutukoy nito ang tambalang Moses at Aaron; ang “sila nga sina” ay natural na mariing pagkakakilanlan sa Tagalog.
theological_decisions:
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  alternative: mga Israelita / mga anak ni Israel
  rationale: Hindi ginawang masaklaw o etnikong katawagan ang tahasang panlalaking parirala; pinanatili ang anyo ng pinagmulang teksto nang walang idinagdag na doktrinal na paliwanag.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “Faraon,” “Moises,” at “Aaron,” na mga pangalang pamilyar sa tradisyong Tagalog. Pinanatili ang mariing pag-uulit at pagkakakilanlan sa Hebreo, habang ginawang natural sa Tagalog ang di-karaniwang isahang הוּא bago ang dalawang pangalan.
