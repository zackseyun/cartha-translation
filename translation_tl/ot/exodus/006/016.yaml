  yaml_path: translation/ot/exodus/006/016.yaml
  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: tl
  text: 'Ito ang mga pangalan ng mga anak ni Levi ayon sa kanilang mga salinlahi: Gershon, Kohat, at Merari. Nabuhay si Levi nang 137 taon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: ayon sa kanilang mga salinlahi
  rationale: Pinananatili ang genealogical na diwa ng תולדות at ang kaugnayan nito sa mga angkan o henerasyong nagmula sa mga anak ni Levi.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: Nabuhay si Levi nang 137 taon
  rationale: Natural na modernong Tagalog para sa Hebreong idyomang literal na 'ang mga taon ng buhay ni Levi,' habang buo ang kahulugan.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 taon
  rationale: Malinaw at karaniwang pagsulat sa modernong Filipino ng eksaktong bilang na isang daan at tatlumpu't pito.
