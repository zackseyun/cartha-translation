base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: tl
  text: At ako rin ay nakarinig ng daing ng mga anak ni Israel[a], na inaalipin ng mga Ehipsiyo, at inalala ko ang aking tipan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita” o “bayan ng Israel.” Sa Hebreo, literal na “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ang “inalala” rito ay pananalitang may kaugnayan sa tipan. Hindi nito ipinahihiwatig na nakalimot ang Diyos, kundi na kikilos siya ayon sa kanyang tipan.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: At narinig ko rin
  rationale: Ipinahahayag ng “rin” ang dagdag na diin ng וְגַם. Likas sa Filipino na nasa “ko” na ang tahasang unang panauhan, kaya hindi na ginamit ang mas mabigat na “ako rin ay”.
- source_word: שָׁמַעְתִּי
  choice: narinig ko
  rationale: Ang aspektong ganap ng pandiwang Hebreo ay likas na naihahayag sa Filipino sa “narinig ko,” habang nananatili ang kaugnayan nito sa kasalukuyang pagkilos ng Diyos sa talumpati.
- source_word: נַאֲקַת
  choice: ang daing
  rationale: Ang “daing” ay malinaw at marangal na katawagan sa masakit na hibik ng mga taong inaapi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyo ng idyomang Hebreo at tumutukoy sa mga inapo ni Israel bilang isang buong bayan, hindi lamang sa mga lalaking anak.
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Bagaman ang anyo ng pangngalan ay “Ehipto,” ipinakikita ng maramihang pandiwaring Hebreo na ang tinutukoy na mga gumagawa ng pang-aalipin ay ang mga Ehipsiyo.
- source_word: מַעֲבִדִים
  choice: inaalipin
  rationale: 'Ipinahahayag nito ang sanhi at mapaniil na diwa ng Hiphil ng עבד: sapilitang pinaglingkod ang bayan bilang mga alipin.'
- source_word: וָאֶזְכֹּר
  choice: at inalala ko
  rationale: Pinananatili ang idyomang biblikal na “alalahanin” sa halip na ipaliwanag ito sa mismong teksto bilang pagkilos ayon sa tipan.
- source_word: בְּרִיתִי
  choice: ang aking tipan
  rationale: Ang “tipan” ang karaniwan at angkop na salin ng בְּרִית sa konteksto ng pakikipagtipan ng Diyos.
theological_decisions:
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; bayan ng Israel
  rationale: Pinananatili ng pangunahing teksto ang kongkretong idyomang Hebreo, samantalang nililinaw sa talababa na pangkalahatan at pangbayan ang saklaw nito.
- issue: Kahulugan ng pag-alaala ng Diyos
  choice: inalala ko ang aking tipan
  alternative: kumilos ako ayon sa aking tipan
  rationale: Hindi ipinapalit ang isang paliwanag sa mismong pahayag ng teksto. Sa ganitong gamit, ang pag-alaala ay wikang pangtipan na nakatuon sa pagkilos, ngunit pinananatili ang tunay na idyoma at teolohikal na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “mga anak ni Israel” at “inalala” upang maingatan ang mahahalagang idyomang Hebreo, na may maiikling talababa para sa karaniwang mambabasa.
