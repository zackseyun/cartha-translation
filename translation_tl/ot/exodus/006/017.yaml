  text: 'The sons of Gershon: Libni and Shimei[a], by their clans.'
translation:
  language: tl
  text: Ang mga anak ni Gershon ay sina Libni at Shimei, ayon sa kani-kanilang angkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: mga anak ni
  rationale: Ang construct plural ng בֵּן ay nagpapakilala ng talaangkanan. Pinananatili ng “mga anak ni” ang tuwirang ugnayang filial at natural ito sa makabagong Tagalog.
- source_word: גֵרְשׁוֹן
  choice: Gershon
  rationale: Pangngalang pantangi; tinumbasan sa karaniwang transliterasyong ginagamit sa Tagalog.
- source_word: לִבְנִי
  choice: Libni
  rationale: Pangngalang pantangi; isinalin sa pamamagitan ng transliterasyon.
- source_word: וְשִׁמְעִי
  choice: at Shimei
  rationale: Tuwirang tinumbasan ang pangatnig at ang ikalawang pangalan sa talaan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: ayon sa kani-kanilang angkan
  rationale: Sa kontekstong talaangkanan, ang מִשְׁפָּחָה ay karaniwang tumutukoy sa mas malawak na pangkat ng magkakamag-anak o angkan. Ipinahihiwatig ng panghalip na hulapi ang mga angkang nauugnay sa mga nabanggit.
