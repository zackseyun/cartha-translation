  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: tl
  text: At ang mga anak ni Merari ay sina Mahli at Musi. Ito ang mga angkan ni Levi[a] ayon sa kanilang mga salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga angkan ng Levita.” Pang-isahan sa Hebreo ang “Levita,” ngunit malamang na kolektibo itong tumutukoy sa lahi ni Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: At ang mga anak ni Merari
  rationale: Sa talaangkanan, ang בְּנֵי ay natural na isinasaling “mga anak,” at pinananatili ng “At” ang dugtungan sa naunang listahan.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: Mahli at Musi
  rationale: Mga pangalang pantangi; tinumbasan ayon sa karaniwang baybay at bigkas sa Filipino.
- source_word: אֵלֶּה מִשְׁפְּחֹת
  choice: Ito ang mga angkan
  rationale: Ang מִשְׁפָּחוֹת ay tumutukoy sa mga pangkat na magkakamag-anak sa loob ng isang lipi; mas tiyak rito ang “angkan” kaysa “pamilya.”
- source_word: הַ/לֵּוִי
  choice: ng mga Levita
  rationale: Bagaman pang-isahan ang anyong Hebreo, malamang na kolektibo ang gamit nito para sa lahi o pangkat ni Levi; natural itong ipinahahayag sa Filipino bilang “mga Levita.”
- source_word: לְ/תֹלְדֹתָם
  choice: ayon sa kani-kanilang salinlahi
  rationale: Pinananatili ng “salinlahi” ang pormal na diwa ng talaangkanan, habang nililinaw ng “kani-kanila” ang pangmaramihang hulaping “kanila” sa Hebreo.
theological_decisions:
- issue: Kolektibong kahulugan ng pang-isahang הַלֵּוִי
  choice: ng mga Levita
  alternative: ni Levi / ng Levita
  rationale: Hindi tiyak kung dapat idiin ang pormal na pang-isahan o ang kolektibong tinutukoy. Pinili ang natural na kolektibong Filipino, at inilagay sa talababa ang mga posibleng mas literal na pagbasa upang hindi maitago ang anyo at tensiyon ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “angkan” at “salinlahi” upang mapanatili ang pormal na himig ng talaangkanan nang hindi nagiging lipas o mabigat basahin.
