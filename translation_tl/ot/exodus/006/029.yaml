  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: tl
  text: 'Pagkatapos ay nagsalita si Yahweh kay Moises: “Ako si Yahweh. Sabihin mo sa Faraon, na hari ng Ehipto, ang lahat ng sinasabi ko sa iyo.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lahat ng patuloy kong sinasabi sa iyo.”
    reason: Ipinakikita ang posibleng mas tahasang progresibong diwa ng participle na דֹּבֵר nang hindi idinadagdag ang “ngayon,” na wala sa Hebreo.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos ay nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa makabagong Tagalog ang “Pagkatapos ay,” habang pinananatili ng “nagsalita” ang diwa ng דבר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Sa Tagalog, natural na ipakilala ang tuwirang sinabi sa pamamagitan ng tutuldok; hindi kailangang idagdag ang paulit-ulit na “na sinasabi.”
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Ang walang-pandiwang sugnay sa Hebreo ay natural na pagpapakilala ng sarili; ang “si” ang karaniwang pananda sa personal na pangalan sa Tagalog.
- source_word: דַּבֵּר
  choice: Sabihin mo
  rationale: Sa kontekstong ipinag-uutos ang buong mensahe, mas likas ang “Sabihin mo” kaysa “Magsalita ka,” at malinaw nitong ipinahahayag na dapat ihatid ang nilalaman sa Faraon.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: sa Faraon, na hari ng Ehipto
  rationale: Pinananatili nito ang appositional na paglalarawan ng Faraon sa malinaw at natural na ayos sa Tagalog.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng mensaheng dapat sabihin.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: sinasabi ko sa iyo
  rationale: Ang aspektong di-ganap ng “sinasabi” ay angkop sa participle na דֹּבֵר at hindi nililimitahan ang pahayag sa isang natapos na pagsasalita.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Lakas ng aspektong nasa אֲנִי דֹּבֵר אֵלֶיךָ
  choice: sinasabi ko sa iyo
  alternative: sinasabi ko ngayon sa iyo
  rationale: Maaaring magpahiwatig ng kasalukuyang nagpapatuloy na pagsasalita ang participle, ngunit hindi kinakailangang idiin ang “ngayon.” Pinananatili ng pangunahing salin ang likas na kaluwagan ng aspektong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Faraon” at “Ehipto,” na karaniwan sa biblikal na Tagalog, at iniwasan ang labis na literal na ayos na magiging alanganin sa pang-araw-araw na pagbasa.
