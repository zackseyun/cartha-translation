base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: tl
  text: At kukunin ko kayo upang maging bayan ko, at ako ang magiging Diyos ninyo. Malalaman ninyo na ako si Yahweh na inyong Diyos, na naglalabas sa inyo[a] mula sa ilalim ng mga pasanin ng Ehipto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na naglabas sa inyo.” Participle ang ginamit sa Hebreo, kaya maaari nitong idiin ang nagpapatuloy o katangiang pagkilos, o ang pagliligtas bilang gawang nagpakilala kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mula sa ilalim ng sapilitang paggawa sa Ehipto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: kukunin ko kayo upang maging bayan ko
  rationale: Pinananatili ng “kukunin” ang tuwirang diwa ng pandiwa at ipinahahayag ng “upang maging bayan ko” ang pag-aari at relasyong tipan na nasa dobleng ל construction, sa natural na modernong Tagalog.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: ako ang magiging Diyos ninyo
  rationale: Natural itong anyo ng pormulang tipan at pinananatili ang relasyonal na diwa nang hindi dinaragdagan ng sistematikong paliwanag.
- source_word: וִידַעְתֶּם
  choice: malalaman ninyo
  rationale: Saklaw ng karaniwang “malalaman” ang kaalaman at pagkilalang bunga ng karanasan; hindi nito labis na nililinaw ang dalawang aspektong maaaring taglay ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַמּוֹצִיא
  choice: na naglalabas sa inyo
  rationale: Ang anyong participle ay inilalarawan si Yahweh bilang Diyos na gumagawa ng pagliligtas. Pinananatili ng “naglalabas” ang nagpapatuloy o katangiang puwersa nito sa konteksto ng pangako.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: mula sa ilalim ng mga pasanin ng Ehipto
  rationale: Pinananatili ang larawang “mula sa ilalim” at ang malawak na kahulugan ng סִבְלֹת bilang mabibigat na pasanin o mapaniil na paggawa.
theological_decisions:
- issue: Pormulang tipan
  choice: “kukunin ko kayo upang maging bayan ko, at ako ang magiging Diyos ninyo”
  alternative: “kukunin ko kayo bilang aking bayan, at magiging Diyos ako para sa inyo”
  rationale: Ang pinili ay malinaw at natural sa Tagalog habang pinananatili ang magkaparis na relasyong tipan, nang hindi nag-aangkat ng mas huling sistemang teolohikal.
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang kinakatawan ng “Yahweh” ang tetragrammaton na יְהוָה at pinananatili itong personal na pangalan, hindi titulo.
- issue: Panahunan at aspekto ng הַמּוֹצִיא
  choice: na naglalabas sa inyo
  alternative: na naglabas sa inyo
  rationale: Dahil participle ang Hebreo at binibigkas ang pangako habang nagaganap pa ang pagliligtas, pinananatili sa pangunahing teksto ang patuloy o katangiang pagkilos. Itinatala sa talababa ang posibleng pagtingin dito bilang naganap nang gawa mula sa pananaw ng katuparan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa עָם, “Diyos ninyo” para sa pormulang tipan, at “Ehipto” bilang karaniwang biblikal na pangalang Tagalog. Ang mga talababa ay inilagay mismo sa mga pariralang tinutukoy ng mga ito.
