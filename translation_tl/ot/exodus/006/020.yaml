base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: tl
  text: Kinuha ni Amram si Jocabed, na kanyang tiya[a], bilang asawa, at ipinanganak niya kay Amram sina Aaron at Moises. Umabot sa 137 taon ang buhay ni Amram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas makitid na pakahulugan ng katawagang ito, “kapatid na babae ng ama ni Amram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Pinananatili ang Hebreong idyomang ‘kumuha’ sa konteksto ng pag-aasawa, at nililinaw ng kasunod na ‘bilang asawa’ ang kahulugan.
- source_word: דֹּדָתוֹ
  choice: kanyang tiya
  rationale: Ang anyong pambabae ng terminong pangkamag-anak ay tumutukoy sa isang tiya. Hindi tahasang tinutukoy sa mismong talata kung sa panig ng ama o ina, kaya inilagay sa talababa ang mas makitid na posibleng pakahulugan.
- source_word: לְאִשָּׁה
  choice: bilang asawa
  rationale: Natural at malinaw na Filipino para sa pariralang nagtatakda ng ugnayang mag-asawa.
- source_word: וַתֵּלֶד לוֹ
  choice: Ipinanganak ni Jocabed
  rationale: Natural na inilalahad sa Filipino ang panganganak; inulit ang pangalan upang maiwasan ang malabong panghalip. Hindi kailangang isalin nang mekanikal ang di-tuwirang layon na לוֹ dahil malinaw na ang ugnayan sa konteksto.
- source_word: שְׁנֵי חַיֵּי עַמְרָם
  choice: Umabot sa ... ang buhay ni Amram
  rationale: Natural na modernong Filipino para sa pormulang Hebreo na nagsasaad ng kabuuang haba ng buhay.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 taon
  rationale: Eksaktong pinananatili ang bilang sa malinaw at makabagong anyo.
- source_word: יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה / עַמְרָם
  choice: Jocabed / Aaron / Moises / Amram
  rationale: Ginamit ang mga anyo ng pangalang karaniwan at madaling makilala sa tradisyong Filipino.
theological_decisions:
- issue: Malapit na ugnayang pampamilya sa pag-aasawang isinasalaysay sa talata
  choice: kanyang tiya
  alternative: kapatid na babae ng kanyang ama
  rationale: Iniuulat ng teksto ang ugnayan nang walang hayag na paghatol. Pinananatili ng ‘tiya’ ang kahulugan nang hindi pinasisidhi o pinahihina ang tensiyong dulot ng mga pagbabawal na lumitaw kalaunan sa Kautusan; ang mas tiyak na pagbasa ay inilagay sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang pormal na Hebreong idyoma sa unang pangungusap, habang ginawang natural ang pahayag tungkol sa panganganak at haba ng buhay.
