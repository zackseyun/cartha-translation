  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: tl
  text: At dadalhin ko kayo sa lupaing isinumpa kong[a] ibigay kina Abraham, Isaac, at Jacob. Ibibigay ko iyon sa inyo bilang inyong pag-aari. Ako si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “na itinaas ko ang aking kamay upang ibigay.” Isa itong idyoma sa Hebreo para sa taimtim na panunumpa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: At dadalhin ko kayo
  rationale: Ang Hiphil ng בוא ay may diwang sanhi na natural na naipapahayag sa Tagalog bilang “dadalhin”; tuwirang pinananatili nito ang pangako ng unang panauhan sa kausap na maramihan.
- source_word: הָאָרֶץ
  choice: sa lupain
  rationale: Tumutukoy ang אֶרֶץ sa tiyak na lupaing ipinangako, kaya mas angkop ang “lupain” kaysa sa pangkalahatang “lupa” o “daigdig.”
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: ipinangako kong
  rationale: Literal itong “itinaas ko ang aking kamay,” isang idyoma ng panunumpa. Ang “ipinangako kong” ay natural sa makabagong Tagalog at malinaw na naghahatid ng puwersa ng taimtim na sumpa; nasa talababa ang literal na larawan.
- source_word: לָתֵת אֹתָהּ
  choice: ibigay
  rationale: Tuwiran at natural na katumbas ng נתן sa konstruksiyong ito.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Ang “kina” ay likas na panandang Tagalog para sa maramihang pangalang pantangi at sapat nang kumakatawan sa inuulit na preposisyong Hebreo.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: Ibibigay ko iyon sa inyo
  rationale: Pinananatili ang tuwiran at mariing pangako ng Hebreo; ang “iyon” ay malinaw na tumutukoy sa lupain.
- source_word: מוֹרָשָׁה
  choice: bilang inyong pag-aari
  rationale: Ang מוֹרָשָׁה ay pag-aaring ipinagkaloob upang ariin nang may matatag na karapatan, na maaaring may pahiwatig ng minanang pagmamay-ari. Ang “pag-aari” ay malinaw at hindi nagpapakitid sa kahulugan bilang karaniwang mana lamang.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה at ang taimtim na pagpapakilala sa sarili.
theological_decisions:
- issue: Idyoma ng panunumpa na נָשָׂאתִי אֶת יָדִי
  choice: ipinangako kong
  alternative: itinaas ko ang aking kamay upang ibigay
  rationale: Ang idyoma ay nangangahulugang taimtim na nanumpa. Ginamit sa pangunahing teksto ang natural na kahulugan, habang pinanatili sa talababa ang konkretong larawang Hebreo upang hindi mawala ang pahiwatig ng panunumpa.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang ipinakilala sa kontekstong ito.
- issue: Saklaw ng מוֹרָשָׁה
  choice: bilang inyong pag-aari
  alternative: bilang inyong mana
  rationale: Hindi tahasang nilulutas ng salita kung ang diin ay nasa mana o permanenteng pagmamay-ari. Ang “pag-aari” ay mas malawak at akma sa pagkakaloob ng lupain, habang kinikilala ang pahiwatig ng namamanang pag-aari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lupain” para sa tiyak na lupaing ipinangako, “kina” para sa natural na pag-uugnay ng tatlong pangalan, at “Ako si Yahweh” bilang tuwirang pormula ng banal na pagpapakilala. Ang pangungusap ay hinati sa tatlo upang maging madaling basahin nang hindi binabago ang lohika ng mga pangako.
