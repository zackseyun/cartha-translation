  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: tl
  text: 'Ngunit nagsalita si Moises sa harap ni Yahweh: “Narito, hindi nakinig sa akin ang mga anak ni Israel; kaya paano makikinig sa akin ang Paraon, gayong hindi tuli ang aking mga labi[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hindi tuli ang aking mga labi,” isang idyomang maaaring magpahiwatig na nahahadlangan o hindi sapat ang kanyang pagsasalita; ihambing sa Exodo 4:10.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ngunit nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay, habang ipinahihiwatig ng “Ngunit” ang pagsalungat ng pagtutol ni Moises sa naunang utos ng Diyos.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang literal na ugnayang ipinahahayag ng לִפְנֵי at ang personal na pangalang יְהוָה.
- source_word: הֵן
  choice: Narito
  rationale: Pormal ngunit likas na panandang pantawag-pansin sa makabagong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang pampamilyang anyo ng Hebreo at ang kolektibong pagtukoy sa bayan ng Israel.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: hindi nakinig sa akin
  rationale: Iningatan ang saklaw na “makinig/pakinggan” sa halip na tahasang gawing “sumunod,” yamang kasama rito ang pakikinig at pagtalima.
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: kaya paano makikinig sa akin ang Paraon
  rationale: Ipinahahayag ng “kaya paano” ang paghihinuha ni Moises mula sa hindi pakikinig ng Israel, at pinananatili ang pag-uulit ng pandiwang שׁמע.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: gayong hindi tuli ang aking mga labi
  rationale: Natural na ipinahahayag ng “gayong” ang batayan ng pagtutol, samantalang pinananatili ng “hindi tuli ang aking mga labi” ang matingkad at sadyang di-tiyak na metaporang Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang transliterasyong “Yahweh” ay hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng עֲרַל שְׂפָתָיִם
  choice: hindi tuli ang aking mga labi
  alternative: hirap akong magsalita
  rationale: Pinananatili ang metapora at ang tensiyon kung tumutukoy ito sa kapansanan, kakulangan, o pagiging di-karapat-dapat sa pagsasalita, sa halip na tahimik na pumili ng iisang diagnosis.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “Narito” para sa pormal na diin at ang literal na metapora tungkol sa mga labi; ipinaliliwanag ito sa talababa nang hindi nilulutas ang eksaktong saklaw ng kahulugan.
