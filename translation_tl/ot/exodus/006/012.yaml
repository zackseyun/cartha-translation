  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה, “Paraon” para sa Pharaoh, at “mga anak ni Israel” bilang pormal at transparent na katumbas ng בני ישראל. Ang talababa ay angkop na nagpapaliwanag sa idyoma nang hindi nilulutas ang kahulugan nito.
