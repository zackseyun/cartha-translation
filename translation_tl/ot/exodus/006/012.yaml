  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagsalungat sa salaysay, ang pagsasalita ni Moises sa harap ni Yahweh, ang retorikal na paghihinuha mula sa hindi pakikinig ng mga anak ni Israel, at ang metaporang עֲרַל שְׂפָתָיִם nang hindi ito binibigyan ng sobrang tiyak na pakahulugan.'
