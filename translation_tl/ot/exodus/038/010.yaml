translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinili ang “haligi,” “patungan,” “kawit,” at “bigkis” bilang mga karaniwang salitang pang-arkitektura at pangkabit; iniwasan ang lipas o labis na teknikal na katawagan. Inilagay ang talababa sa mismong tekstong tumutukoy sa tunay na leksikal na kalabuan.
