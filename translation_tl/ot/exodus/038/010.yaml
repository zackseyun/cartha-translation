translation:
  language: tl
  text: Ang mga haligi nito ay dalawampu, at ang dalawampung salalayan nito ay yari sa bronse; ang mga kawit ng mga haligi at ang mga bigkis ng mga iyon ay yari sa pilak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pangdugtong ng mga iyon.” Hindi tiyak ang eksaktong anyo o gamit ng salitang Hebreo na isinaling “mga bigkis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: ang mga haligi nito
  rationale: Ang עַמּוּדִים ay mga haligi o poste ng tabing sa looban. Ginamit ang isahang “nito” upang natural na iugnay ang panlalaking maramihang hulapi sa bahaging inilalarawan sa konteksto.
- source_word: עֶשְׂרִים
  choice: dalawampu / dalawampung
  rationale: Tuwirang salin ng bilang sa dalawang paglitaw nito, na iniangkop lamang sa likas na ayos ng Filipino.
- source_word: אַדְנֵיהֶם
  choice: mga patungan nito
  rationale: Sa konteksto ng tabernakulo, ang אֶדֶן ay baseng kinalalagyan at sumusuporta sa haligi. Mas malinaw sa karaniwang Filipino ang “patungan” kaysa sa teknikal na “saksakan.”
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang salita sa tanso o bronse, ngunit “bronse” ang kinagawiang at angkop na tawag sa materyal ng mga kagamitang ito.
- source_word: וָוֵי הָעַמֻּדִים
  choice: mga kawit ng mga haligi
  rationale: Tumutukoy ang וָוִים sa mga kawit o kabit na nakakabit sa mga haligi; pinananatili ng salin ang malinaw na ugnayang konstrakto.
- source_word: חֲשֻׁקֵיהֶם
  choice: mga bigkis nito
  rationale: Ang bihirang terminong ito ay tumutukoy sa mga metal na bigkis o elementong nagdurugtong sa mga haligi. Ang “bigkis” ay kasalukuyan at madaling maunawaan habang hindi labis na tinutukoy ang eksaktong anyo.
- source_word: כָּסֶף
  choice: pilak
  rationale: Tuwirang salin ng materyal na כָּסֶף.
