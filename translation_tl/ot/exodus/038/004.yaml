  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: tl
  text: Gumawa siya para sa altar ng isang parilyang[a] tanso na gawang lambat, sa ilalim ng pasamano[b] nito, mula sa ibaba hanggang sa kalagitnaan nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “rehas na gawang lambat at yari sa tanso.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo para sa bahaging ito ng altar ay maaari ring isaling “gilid,” “moldura,” o “palibot na umbok.”
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring unawain: “sa gawing ibaba, hanggang sa gitna nito.” Hindi ganap na tiyak kung pangunahing inilalarawan ng parirala ang puwesto o ang lawak ng parilya.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay. Likas sa makabagong Filipino ang “Gumawa siya”; hindi kailangang piliting ilantad ang pang-ugnay na וַ bilang “At.”
- source_word: לַמִּזְבֵּחַ
  choice: para sa altar
  rationale: Ipinapakita ng ל ang layon o bagay na paglalaanan, hindi lamang ang kinaroroonan.
- source_word: מִכְבָּר
  choice: parilya
  rationale: Tumutukoy ito sa isang grate o balangkas na may mga siwang. Karaniwan at madaling maunawaan sa Filipino ang “parilya,” habang nililinaw ng kasunod na parirala ang anyong lambat nito.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: yari na parang lambat
  rationale: Pinananatili nito ang diwa ng literal na “gawang lambat” sa mas natural na Filipino, nang hindi ipinapalagay na tunay na lambat na malambot ang materyal.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang “tanso” ang kinagawiang malinaw na katumbas sa konteksto ng mga kagamitang metal ng tabernakulo; maaaring saklawin ng salitang Hebreo ang bronze o copper.
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: sa ilalim ng pasamano nito
  rationale: Ang תַּחַת ay tuwirang panandang panlunan. Ang “pasamano” ay nagpapahiwatig ng nakausling bahaging nakapalibot sa altar nang hindi labis na tinutukoy ang eksaktong hugis nito.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: mula sa ibaba hanggang sa kalagitnaan nito
  rationale: Malapit ito sa anyong Hebreo at pinananatili ang paglalarawan sa saklaw o posisyon ng parilya hanggang sa gitnang bahagi.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “altar” bilang pamilyar na terminong biblikal. Ginamit ang “parilya” at “pasamano” bilang konkretong salitang pangkayarian, na may mga talababa upang mapanatili ang leksikal at estruktural na kawalang-katiyakan ng Hebreo.
