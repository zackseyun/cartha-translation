  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: tl
  text: At para sa silangang panig[a], sa dakong silangan, limampung siko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “para sa panig sa silangan, patungong silangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: At para sa ... panig
  rationale: Ang פאה ay tumutukoy sa panig, gilid, o hangganan. Sa konteksto ng pagsukat sa patyo, natural ang “panig”; pinananatili ng “At para sa” ang magkakaugnay at mapaglarawang ayos ng Hebreo.
- source_word: קֵדְמָה
  choice: silangang
  rationale: Maaaring mangahulugan ang salita ng silangan o harapan. Dahil sinusundan ito ng מִזְרָחָה, malinaw na direksiyon sa silangan ang tinutukoy.
- source_word: מִזְרָחָה
  choice: paharap sa sikatan ng araw
  rationale: Ang מזרח ay kaugnay ng lugar na sinisikatan ng araw, kaya tumutukoy sa silangan. Pinananatili ng salin ang ikalawang panandang-direksiyon sa Hebreo at ang konkretong larawan nito.
- source_word: חֲמִשִּׁים
  choice: limampu
  rationale: Tuwirang salin ng bilang na limampu.
- source_word: אַמָּה
  choice: siko
  rationale: Ang אַמָּה ay ang karaniwang sinaunang sukat na “cubit,” na tradisyonal at madaling makilalang isinasalin sa Filipino bilang “siko.”
