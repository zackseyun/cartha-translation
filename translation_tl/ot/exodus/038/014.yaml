  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: tl
  text: Ang mga tabing para sa isang gilid ay labinlimang siko ang haba. May tatlong haligi ang mga ito at tatlo ring patungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Sa konteksto ng looban ng tabernakulo, tumutukoy ito sa mga telang bumubuo sa bakod o enclosure. Ang “mga tabing” ay natural at malinaw sa modernong Filipino.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: labinlimang siko ang haba
  rationale: Tuwirang sukat ang nasa Hebreo; idinagdag ang “ang haba” upang maging natural at malinaw sa Filipino nang hindi binabago ang kahulugan.
- source_word: אֶל הַכָּתֵף
  choice: para sa isang gilid
  rationale: Ang כָּתֵף ay literal na “balikat” ngunit dito ay tumutukoy sa isang tagiliran o bahagi sa tabi ng pasukan. Ang “para sa isang gilid” ay tapat sa gamit na pang-arkitektura.
- source_word: עַמּוּדֵיהֶם
  choice: mga haligi nito
  rationale: Ang עַמּוּד ay haligi o poste. “Haligi” ang angkop na terminong pang-arkitektura; ang panghalip na isahan ay likas sa Filipino dahil tumutukoy ito sa kabuuang seksiyon ng mga tabing.
- source_word: אַדְנֵיהֶם
  choice: mga patungan nito
  rationale: Tumutukoy ang salita sa mga base o socket na kinatatayuan ng mga haligi. Ang “patungan” ay malinaw sa karaniwang mambabasa at naihahayag ang tungkulin ng mga ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang teknikal na larawan ng estruktura ngunit iniwasan ang hindi natural na pagkakasunod-sunod ng mga salita. Walang footnote dahil hindi kailangan ng tekstong Tagalog ang leksikal na alternatibo sa ibinigay na English footnote, na mali rin ang pagkakabit sa “pillars” sa halip na sa “bases.”
