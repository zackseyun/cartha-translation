  to: 'Ginawa niya ang lahat ng kagamitan ng altar: ang mga palayok[a], mga pala, mga palanggana, mga tinidor, at mga lalagyan ng baga. Ginawa niya mula sa bronse[b] ang lahat ng kagamitan nito.'
