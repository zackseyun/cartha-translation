base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: tl
  text: 'Ginawa niya ang lahat ng kagamitan ng altar: ang mga palayok[a], mga pala, mga palanggana, mga tinidor, at mga lalagyan ng baga. Ginawa niya mula sa bronse[b] ang lahat ng kagamitan nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na isinaling “mga palayok” ay maaaring tumukoy nang mas tiyak sa mga sisidlang ginagamit sa pag-aalis ng abo.
    reason: lexical_alternative
  - marker: b
    text: O “tanso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: mga kagamitan ng altar
  rationale: Malawak ang kahulugan ng כְּלִי at saklaw nito ang mga kasangkapan at sisidlang nakatala; natural at malinaw sa modernong Tagalog ang “mga kagamitan.”
- source_word: הַסִּירֹת
  choice: mga palayok
  rationale: Karaniwang tumutukoy ang סִירוֹת sa mga palayok. Hindi isinama sa pangunahing teksto ang “para sa abo” dahil hindi tahasang binabanggit ang abo sa Hebreo.
- source_word: הַיָּעִים
  choice: mga pala
  rationale: Tumutukoy ang יָעִים sa mga kasangkapang ginagamit sa pagpala o pagsalok; ang “mga pala” ang pinakanatural sa konteksto ng altar.
- source_word: הַמִּזְרָקֹת
  choice: mga palanggana
  rationale: Ang מִזְרָקוֹת ay mga sisidlang ginagamit sa ritwal na paghawak ng dugo o iba pang likido; ipinahihiwatig ng “palanggana” ang mas malaking sisidlan kaysa karaniwang mangkok.
- source_word: הַמִּזְלָגֹת
  choice: mga tinidor
  rationale: Tumutukoy ang salita sa mga kasangkapang hugis-tinidor. Hindi dinagdagan ng “pangkarne” sapagkat wala ang gayong pagtutukoy sa mismong parirala.
- source_word: הַמַּחְתֹּת
  choice: mga lalagyan ng baga
  rationale: Ang מַחְתָּה ay sisidlan o kawaling ginagamit sa pagdadala ng nagbabagang uling; malinaw at likas sa Tagalog ang deskriptibong salin.
- source_word: כָּל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Ang hulaping panghalip ay tumutukoy sa altar, at pinananatili ng “kagamitan” ang pagkakatugma sa unang paggamit ng כְּלִי.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa konteksto ng mga kagamitan ng tabernakulo, ang “bronse” ang malamang na sinaunang metal at malinaw na modernong katawagan, habang kinikilala sa talababa ang posibleng “tanso.”
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ginawa niya ... Ginawa niya
  rationale: Pinananatili ang dalawang paggamit ng pandiwang עשה at ang pagbubuod sa hulihan ng talata.
