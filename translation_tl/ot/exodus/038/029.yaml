translation:
  language: tl
  text: At ang bronse[a] mula sa handog na iwinagayway[b] ay pitumpung talento at 2,400 siklo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso”; ang Hebreong נְחֹשֶׁת ay maaaring tumukoy sa tanso o bronse, depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “handog na iwinagayway” ay teknikal na katawagan sa isang bagay na iniharap sa PANGINOON sa pamamagitan ng ritwal na pagwawagayway; maaari rin itong isalin nang mas pangkalahatan bilang “handog na iniharap” o “abuloy.”
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang salitang Hebreo sa copper o bronze. Ang “tanso” ay natural at malawak na katawagang Filipino para sa metal sa kontekstong ito, habang pinananatili sa talababa ang leksikal na posibilidad.
- source_word: הַתְּנוּפָה
  choice: handog na iwinagayway
  rationale: Inilalarawan ng תְּנוּפָה ang ritwal na paghahandog sa pamamagitan ng pagwawagayway sa harap ng PANGINOON. Mas malinaw sa karaniwang mambabasa ang pariralang ito kaysa sa teknikal ngunit di-likas na “handog na wagayway.”
- source_word: שִׁבְעִים כִּכָּר
  choice: pitumpung talento
  rationale: Pinananatili ang sinaunang yunit na כִּכָּר bilang “talento,” ayon sa nakaugaliang salin, sa halip na magbigay ng di-tiyak na modernong katumbas sa pangunahing teksto.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: at 2,400 siklo
  rationale: Pinananatili ang sinaunang yunit na שֶׁקֶל bilang “siklo,” at ginagamit ang numerong 2,400 para sa madaling pagbasa.
- source_word: וְ
  choice: At
  rationale: Ipinakikita ng “At” ang tuwirang pagkakaugnay ng talata sa naunang talaan ng mga kabuuang halaga.
