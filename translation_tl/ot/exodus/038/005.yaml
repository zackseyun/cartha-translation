  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: tl
  text: Naghulma siya ng apat na singsing na metal sa apat na sulok[a] ng parilyang bronse bilang mga lagayan[b] ng mga baras na pambuhat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa apat na dulo” ng parilyang bronse.
    reason: lexical_alternative
  - marker: b
    text: Literal na “mga bahay” para sa mga baras na pambuhat; ibig sabihin, mga lagayan o kabitan na pagtatalian ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Nagbuhos siya
  rationale: Ang pandiwang יצק ay tumutukoy sa pagbubuhos ng tunaw na metal sa hulma. Natural sa Filipino ang “nagbuhos” sa ganitong konteksto, at nililinaw ng “na metal” sa kasunod na parirala ang proseso.
- source_word: אַרְבַּע טַבָּעֹת
  choice: apat na singsing na metal
  rationale: Ang טַבָּעֹת ay mga singsing na kabitan; idinagdag ang “na metal” upang hindi mapagkamalang alahas at upang umayon sa konteksto ng paghuhulma.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: sa apat na sulok
  rationale: Maaaring mangahulugan ang קָצֶה ng dulo, gilid, o sukdulang bahagi. Sa parilyang may apat na panig, malinaw at natural ang “apat na sulok,” habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: ng parilyang tanso
  rationale: Ang מִכְבָּר ay sala-salang metal o parilya. Ang “parilyang tanso” ay maikli, malinaw, at angkop sa altar; ang נְחֹשֶׁת ay tanso/bronse, hindi modernong brass.
- source_word: בָּתִּים
  choice: mga lalagyan
  rationale: Literal itong “mga bahay,” ngunit dito ay mga kabitan o sisidlang tumatanggap sa mga pingga. Ang “mga lalagyan” ay likas at madaling maunawaan, at ang literal na larawan ay nasa talababa.
- source_word: לַבַּדִּים
  choice: ng mga pingga
  rationale: Ang בַּדִּים ay mahahabang pinggang ginagamit sa pagbuhat at pagdadala ng mga kagamitan sa tabernakulo. Ang “pingga” ay malinaw na terminong Filipino sa kontekstong ito.
