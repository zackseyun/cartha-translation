  naturalness: Likas at malinaw ang pangungusap sa makabagong Filipino. Ang “patungan” ay nauunawaan bilang base o tuntungan ng haligi sa konteksto.
  terminology: 'Ang “siko,” “haligi,” “kawit,” at “pilak” ay angkop. Kailangan lamang ayusin ang talababa: ang “pahalang na panungkit” ay hindi ligtas na alternatibo para sa teknikal na terminong Hebreo at ang pananda ay dapat ikabit sa “mga bigkis,” ang salitang tinatalakay.'
