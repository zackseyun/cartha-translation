  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: tl
  text: Sa dakong kanluran ay may mga tabing na limampung siko ang haba, na may sampung haligi at sampung patungan. Pilak ang mga kawit ng mga haligi at ang mga bigkis[a] ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga baras” o “mga pandugtong na palamuti.” Teknikal ang salitang Hebreo para sa mga bahaging ito ng haligi at maaaring tumukoy sa mga bigkis, baras, o pandugtong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: Sa dakong kanluran
  rationale: Ang יָם ay literal na “dagat” ngunit karaniwang tumutukoy sa kanluran sa paglalarawan ng tabernakulo; natural at malinaw sa Filipino ang “dakong kanluran.”
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Tumutukoy ito sa mga telang bumubuo sa bakod ng patyo. Ang “mga tabing” ay malinaw at hindi labis na tiyak tungkol sa anyo ng tela.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: limampung siko ang haba
  rationale: Ang אַמָּה ay siko, isang sinaunang sukat. Ginawang lantad ang ipinahihiwatig na haba upang maging natural sa Filipino.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: na may sampung haligi
  rationale: Ang עַמּוּדִים ay mga haliging sumusuporta sa mga tabing; ang “na may” ay maayos na nag-uugnay sa estilong talaan ng Hebreo.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: at sampung patungan
  rationale: Ang אֶדֶן ay baseng o socket na kinatatayuan ng haligi. Mas madaling maunawaan ng karaniwang mambabasa ang “patungan” kaysa sa teknikal na “soket.”
- source_word: וָוֵי הָעַמֻּדִים
  choice: mga kawit ng mga haligi
  rationale: Sa kontekstong ito, ang וָוִים ay mga kawit na nakakabit sa mga haligi.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: mga bigkis ng mga ito
  rationale: Teknikal at hindi ganap na tiyak ang tinutukoy ng חֲשׁוּקִים. Ipinahahayag ng “mga bigkis” ang ideya ng mga metal na bahaging bumabalot o nag-uugnay, habang inilalahad sa talababa ang ibang posibilidad.
- source_word: כָּסֶף
  choice: Pilak ang
  rationale: 'Predikatibo ang pangngalan sa Hebreo: inilalarawan nito ang materyal ng mga kawit at bigkis. Natural sa Filipino ang ayos na “Pilak ang….”'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang estilong paglilista ng talata ngunit gumamit ng likas na sintaks. Inilagay ang pananda ng talababa sa “mga bigkis,” ang salitang aktuwal na tinatalakay ng talababa.
