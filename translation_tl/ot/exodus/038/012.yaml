  - severity: low
    issue: Ang pananda ng talababa ay nasa dulo ng pangungusap sa halip na nakadikit sa “mga bigkis.”
    rationale: Dapat malinaw na nakaangkla ang talababa sa חֲשֻׁקִים, hindi sa buong pangungusap o sa “pilak.”
