revisions:
- from: Ang pilak mula sa mga kabilang sa bilang ng kapulungan ay isang daang talento at isang libo pitong daan at pitumpu't limang siklo, ayon sa siklo ng santuwaryo.[a]
  to: Ang pilak ng mga taong binilang mula sa kapulungan ay isang daang talento at isang libo, pitong daan at pitumpu't limang siklo, ayon sa siklo ng santuwaryo.[a]
  rationale: Pinalitan ang hindi gaanong likas na “mga kabilang sa bilang ng kapulungan” ng “mga taong binilang mula sa kapulungan,” upang maging malinaw ang tinutukoy na mga taong opisyal na binilang. Nilinaw rin ang paghahati ng bilang sa pamamagitan ng kuwit, nang hindi binabago ang halagang 1,775 siklo o ang kahulugan ng talata.
