  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: tl
  text: Ang pilak ng mga taong binilang mula sa kapulungan ay isang daang talento at isang libo, pitong daan at pitumpu't limang siklo, ayon sa siklo ng santuwaryo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, tinimbang ayon sa pamantayang timbang ng santuwaryo.
