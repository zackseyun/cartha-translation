lexical_decisions:
- source_word: כֶסֶף
  choice: pilak
  rationale: Sa talaan ng mga materyales, ang tinutukoy ay ang metal na pilak, hindi salapi sa pangkalahatan.
- source_word: פְּקוּדֵי הָעֵדָה
  choice: mga kabilang sa bilang ng kapulungan
  rationale: Ipinahihiwatig ng parirala ang mga taong opisyal na binilang o itinala mula sa buong kapulungan; natural ito sa Filipino at pinananatili ang administratibong diwa.
- source_word: מְאַת כִּכָּר
  choice: isang daang talento
  rationale: Pinananatili ang sinaunang malaking yunit ng timbang na כִּכָּר sa nakaugaliang saling “talento.”
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: isang libo pitong daan at pitumpu't limang siklo
  rationale: Isinasalin ang pinagsama-samang bilang bilang 1,775 at pinananatili ang sinaunang yunit na siklo.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Tinutukoy nito ang pamantayang timbang na ginagamit sa santuwaryo, hindi isang hiwalay na uri ng pilak.
