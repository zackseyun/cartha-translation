    rationale: 'Mas idiomatiko at mas malinaw ang tuwirang pasibong paglalarawan ng mga taong naitala sa bilang: “mga taong binilang mula sa kapulungan.” Pinananatili nito ang administratibong/census na diwa ng Hebreo nang walang dagdag na interpretasyon.'
  revised_text: Ang pilak ng mga taong binilang mula sa kapulungan ay isang daang talento at isang libo, pitong daan at pitumpu't limang siklo, ayon sa siklo ng santuwaryo.[a]
