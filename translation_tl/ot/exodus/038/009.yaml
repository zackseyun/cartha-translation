  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: tl
  text: Ginawa niya ang patyo. Sa gawing timog, sa dakong timog, ang mga tabing[a] ng patyo ay yari sa pinong lino na pinilipit, na may habang isang daang siko.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kurtina.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Ginawa niya” at pinananatili nito ang payak na diwa ng pandiwa.
- source_word: הֶחָצֵר
  choice: ang patyo
  rationale: Tumutukoy ang חָצֵר sa panlabas na patyo ng tabernakulo. Karaniwan at malinaw sa modernong Tagalog ang “patyo.”
- source_word: לִפְאַת
  choice: Sa gawing ...
  rationale: Tumutukoy ang salita sa isang panig o bahagi; idiomatiko sa Tagalog ang “sa gawing” kapag tinutukoy ang direksiyon ng isang panig.
- source_word: נֶגֶב תֵּימָנָה
  choice: timog, sa dakong timog
  rationale: Parehong tumutukoy sa timog ang dalawang katawagan. Isinalin ang dalawa upang mapanatili ang pag-uulit at kabuuan ng Hebreo sa halip na pagsamahin ang mga ito sa iisang parirala.
- source_word: קַלְעֵי הֶחָצֵר
  choice: ang mga tabing ng patyo
  rationale: Sa konteksto ng tabernakulo, ang קְלָעִים ay mga telang nakasabit na nagsisilbing hangganan ng patyo. Tumpak at natural ang “mga tabing.”
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Ang שֵׁשׁ ay pinong lino, at ang מָשְׁזָר ay naglalarawan sa sinulid o telang pinilipit. Naipahahayag ng parirala ang uri at pagkakayari ng materyal.
- source_word: מֵאָה בָּאַמָּה
  choice: may habang isang daang siko
  rationale: Ibinibigay ng parirala ang sukat. Nilinaw ng “may habang” ang dimensiyong likas na ipinahihiwatig sa Hebreo.
