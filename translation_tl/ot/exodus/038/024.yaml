base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: tl
  text: Ang lahat ng gintong ginamit sa gawain, sa buong gawain ng santuwaryo—ang gintong handog na iniwagayway[a]—ay dalawampu’t siyam na talento at pitong daan at tatlumpung siklo[b], ayon sa siklo ng santuwaryo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa handog na ritwal na iniharap sa harap ng PANGINOON sa pamamagitan ng pagwawagayway.
    reason: cultural_note
  - marker: b
    text: Ang talento at siklo ay mga sinaunang yunit ng timbang. Nagkakaiba ang mga pagtataya sa eksaktong katumbas ng mga ito sa modernong mga yunit.
    reason: measurement_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: ginamit sa gawain
  rationale: Sa konteksto ng talaan ng mga materyales, ang pasibong anyo ng עשה ay tumutukoy sa gintong inilaan at ginamit sa paggawa, hindi sa gintong mismong “ginawa.”
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: sa lahat ng gawain para sa santuwaryo
  rationale: Ipinapahayag nito ang kabuuan ng sagradong gawaing pagtatayo. Ang “para sa santuwaryo” ay malinaw at likas sa modernong Filipino.
- source_word: זְהַב הַתְּנוּפָה
  choice: ang ginto mula sa handog na itinaas
  rationale: Pinananatili ng “itinaas” ang ideya ng ritwal na paghaharap o pagkilos ng handog, habang nililinaw ng “mula sa” na ang tinutukoy ay ang gintong ibinigay bilang gayong handog.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: dalawampu't siyam na talento at pitong daan at tatlumpung siklo
  rationale: Direkta at likas na paglalahad ng mga bilang, habang pinananatili ang sinaunang mga yunit upang hindi magkunwaring tiyak ang katumbas na modernong timbang.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinakikita ng parirala na ang timbang ay kinalkula ayon sa opisyal na pamantayang ginagamit sa santuwaryo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Pinanatili ang teknikal na “santuwaryo,” “talento,” at “siklo” dahil mahalaga ang mga ito sa talaang pangkulto at pangtimbang; ipinaliwanag sa talababa ang hindi pamilyar na ritwal at mga yunit.
