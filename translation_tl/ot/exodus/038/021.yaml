  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: tl
  text: Ito ang talaan[a] ng tabernakulo—ang tabernakulo ng Patotoo[b]—na itinala ayon sa utos ni Moises, sa pamamagitan ng paglilingkod ng mga Levita sa ilalim ng pangangasiwa[c] ni Itamar na anak ni Aaron na pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “imbentaryo” o “pagtutuos.” Ang salitang Hebreo ay tumutukoy sa isang opisyal na pagtatala at pagsusuma.
    reason: lexical_alternative
  - marker: b
    text: Ang “Patotoo” ay malamang na tumutukoy sa patotoo ng tipan, lalo na sa mga tapyas na inilagay sa kaban.
    reason: cultural_note
  - marker: c
    text: Literal na “sa kamay ni Itamar,” isang idyoma para sa pagkilos sa pamamagitan ng isang tao o sa ilalim ng kanyang pangangasiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: talaan
  rationale: Tumutukoy ang anyong pangngalan ng פקד sa isang opisyal na pagtutuos o pagtatala. Likas sa modernong Filipino ang “talaan,” habang ipinapaliwanag sa talababa ang mas tiyak na diwang administratibo nito.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakaugaliang terminong Filipino para sa banal na toldang santuwaryo sa Exodo at malinaw na ipinakikilalang isang natatanging gusaling panrelihiyon.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: tabernakulo ng Patotoo
  rationale: Pinananatili ang pag-uulit at ang malawak na kahulugan ng עֵדֻת, sa halip na tahasang tukuyin sa pangunahing teksto ang mga tapyas o ang dokumento ng tipan.
- source_word: פֻּקַּד
  choice: ginawa
  rationale: Sa konteksto ng “talaan,” ang pasibong pandiwa ay tumutukoy sa pagsasagawa ng opisyal na pagtutuos. Ang “ginawa” ay natural sa Filipino at ang uri ng gawa ay malinaw mula sa naunang “talaan.”
- source_word: עַל פִּי מֹשֶׁה
  choice: ayon sa utos ni Moises
  rationale: Ang idyomang literal na “ayon sa bibig ni Moises” ay karaniwang nangangahulugang ayon sa kanyang salita o utos.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: sa pamamagitan ng gawain ng mga Levita
  rationale: Ipinakikita nito ang instrumental na papel ng nakatalagang gawain ng mga Levita nang hindi ipinapasok ang mas huling konotasyon ng salitang “ministeryo.”
- source_word: בְּיַד אִיתָמָר
  choice: sa pangangasiwa ni Itamar
  rationale: Ang “sa kamay ni Itamar” ay isang idyoma ng ahensiya o pangangasiwa; ang konteksto ay nagpapahiwatig na siya ang namahala sa gawain ng mga Levita.
- source_word: הַכֹּהֵן
  choice: na pari
  rationale: Tuwirang isinasalin ang titulong kumikilala kay Aaron bilang pari.
theological_decisions:
- issue: Kahulugan ng “Patotoo” (הָעֵדֻת)
  choice: Pinanatili sa pangunahing teksto ang “Patotoo.”
  alternative: “mga tapyas ng tipan” o “kasulatan ng tipan”
  rationale: Malamang na tumutukoy ito sa patotoo ng tipan, lalo na sa mga tapyas na nasa kaban, ngunit hindi tahasang tinutukoy ng talata ang bagay na iyon. Pinananatili ng salin ang saklaw at bahagyang kalabuan ng Hebreo.
translation_notes:
  register: Gumamit ng makabago ngunit marangal na Filipino. Pinanatili ang “tabernakulo” bilang pamilyar na terminong biblikal, samantalang ang administratibong diwa ng talata ay inihayag sa “talaan,” “gawain,” at “pangangasiwa.”
