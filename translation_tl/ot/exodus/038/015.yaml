base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: tl
  text: At para sa kabilang tagiliran[a]—sa panig na ito at sa panig na iyon ng pintuan ng patyo—may mga tabing na labinlimang siko; tatlo ang mga haligi ng mga ito, at tatlo ang kanilang mga tuntungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa magkabilang panig ng pintuan ng patyo.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga tuntungan” ay maaari ring isaling “mga suksukan” ng mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: para sa kabilang tagiliran
  rationale: Ang כָּתֵף ay literal na ‘balikat’ ngunit tumutukoy rito sa tagiliran o bahaging katabi ng pintuan. Pinananatili ng ‘kabilang tagiliran’ ang larawang pang-espasyo at ang pagkakaugnay nito sa naunang talata.
- source_word: מִזֶּה וּמִזֶּה
  choice: sa isang panig at sa kabila
  rationale: Ipinahahayag nito ang dalawang bahaging nasa magkabilang gilid ng pintuan, habang pinananatili ang distributibong anyo ng Hebreo sa halip na paikliin lamang bilang ‘sa magkabilang panig.’
- source_word: לְשַׁעַר הֶחָצֵר
  choice: ng pintuan ng patyo
  rationale: Ang parirala ay inuugnay sa mga bahaging nasa tabi ng pasukan ng patyo. Natural at malinaw sa Tagalog ang ‘pintuan ng patyo.’
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa mga telang bumubuo sa bakod ng patyo. Ang ‘mga tabing’ ay karaniwan, malinaw, at hindi labis na teknikal.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: labinlimang siko
  rationale: Pinananatili ang sinaunang sukat na ‘siko’ at hindi nagdaragdag ng salitang ‘haba,’ na hindi tahasang nasa Hebreo.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: tatlo ang mga haligi ng mga ito
  rationale: Ang עַמּוּד ay ‘haligi.’ Inililipat sa natural na ayos ng Tagalog ang walang-pandiwang talaan ng Hebreo habang pinananatili ang eksaktong bilang.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: tatlo ang kanilang mga tuntungan
  rationale: Ang אֶדֶן ay maaaring base o socket ng haligi. Nauunawaan sa modernong Tagalog ang ‘tuntungan’ bilang bahaging pinapatungan at sumusuporta sa haligi, nang hindi ito maling tukuyin bilang buong pundasyon.
