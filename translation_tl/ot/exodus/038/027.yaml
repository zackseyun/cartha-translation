base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: tl
  text: 'Ang sandaang talento ng pilak ay ginamit upang ihulma ang mga patungan[a] ng santuwaryo at ang mga patungan ng tabing[b]: sandaang patungan para sa sandaang talento, isang talento para sa bawat patungan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mga saksakan,” na tumutukoy sa mga pirasong metal na saligan ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Ang “tabing” ay ang panloob na kurtinang naghihiwalay sa banal na dako at sa kabanal-banalang dako.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: ay ginamit
  rationale: Sa konteksto ng pagtatala, ipinakikilala ng pandiwa kung saan inilaan o ginamit ang pilak, hindi ang pagbabago ng kalagayan nito.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: ang sandaang talento ng pilak
  rationale: Pinananatili ang eksaktong bilang at ang sinaunang yunit ng timbang; natural sa Tagalog ang pariralang “talento ng pilak.”
- source_word: לָצֶקֶת
  choice: upang hulmahin
  rationale: Layunin ang ipinahihiwatig ng pawatas, at sa konteksto ng paggawa sa metal ay tumutukoy ito sa pagbubuhos o paghuhulma ng metal.
- source_word: אַדְנֵי
  choice: mga tuntungan
  rationale: Tumutukoy ito sa mga pirasong metal na nagsisilbing saligan ng mga balangkas at haligi. Malinaw sa karaniwang mambabasa ang “tuntungan,” habang inilalagay sa talababa ang alternatibong “mga saksakan.”
- source_word: הַקֹּדֶשׁ
  choice: santuwaryo
  rationale: Dito ay tumutukoy sa banal na gusali o tolda sa kabuuan, kaiba sa tabing, at hindi lamang sa isang partikular na silid.
- source_word: הַפָּרֹכֶת
  choice: tabing
  rationale: Ito ang panloob na kurtinang naghihiwalay sa banal na dako at sa kabanal-banalang dako; likas at dignificado sa Tagalog ang “tabing.”
- source_word: מְאַת אֲדָנִים לִמְאַת הַכִּכָּר
  choice: sandaang tuntungan mula sa sandaang talento
  rationale: Ipinapakita ang pagtutugma ng bilang ng mga tuntungan at ng mga talentong pilak, at natural na ipinahihiwatig sa Tagalog na mula sa pilak ginawa ang mga ito.
- source_word: כִּכָּר לָאָדֶן
  choice: isang talento para sa bawat tuntungan
  rationale: 'Malinaw na ipinahahayag ang distributibong sukat: tig-isang talento ang ginamit sa bawat tuntungan.'
