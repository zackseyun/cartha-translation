  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: tl
  text: Ginawa niya ang altar para sa handog na sinusunog mula sa kahoy na akasya. Limang siko ang haba nito at limang siko ang lapad—parisukat ito—at tatlong siko ang taas nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang waw-consecutive na may עשה ay nagsasalaysay ng natapos na kilos. Likas at tuwiran sa makabagong Tagalog ang “Ginawa niya.”
- source_word: מִזְבַּח הָעֹלָה
  choice: ang altar para sa handog na sinusunog
  rationale: Ang pariralang construct ay tumutukoy sa altar na ginagamit para sa עֹלָה, ang handog na lubusang sinusunog. Malinaw sa karaniwang mambabasa ang “altar para sa handog na sinusunog.”
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang שִׁטִּים ay tumutukoy sa akasya. Mas nauunawaan sa kasalukuyang Tagalog ang pangalan ng kahoy kaysa sa transliterasyong “sitim.”
- source_word: חָמֵשׁ אַמּוֹת
  choice: limang siko
  rationale: Ang אַמָּה ay ang sinaunang yunit na cubit. Pinanatili ang tradisyonal na katumbas na Tagalog na “siko” sa halip na tantiyahang i-convert ang sukat.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Tumutukoy sa altar ang hulaping panghalip; natural na ipinapahayag ito sa Tagalog bilang “nito.”
- source_word: רָחְבּוֹ
  choice: ang lapad
  rationale: Ang “lapad” ang malinaw at karaniwang katumbas ng dimensional na רֹחַב sa makabagong Tagalog.
- source_word: רָבוּעַ
  choice: parisukat
  rationale: Ang salita ay nangangahulugang square o foursquare. Tumpak, maikli, at natural ang “parisukat.”
- source_word: קֹמָתוֹ
  choice: ang taas nito
  rationale: Sa kontekstong pang-arkitektura, tumutukoy ang קוֹמָה sa taas. “Ang taas nito” ang pinakatuwirang makabagong salin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “altar” bilang karaniwang terminong biblikal at ang “siko” bilang sinaunang yunit ng sukat. Walang footnote dahil walang tunay na kailangang markahang tekstuwal o leksikal na kalabuan sa talata; ang “parisukat” ay sapat na naghahatid ng רָבוּעַ.
