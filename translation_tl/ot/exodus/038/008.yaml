  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: tl
  text: Ginawa niya ang palangganang bronse at ang patungan nitong bronse mula sa mga salamin[b] ng mga babaeng naglilingkod[a] sa pasukan ng tolda ng pagpupulong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga babaeng nagtitipon sa pasukan ng tolda ng pagpupulong.” Maaaring idiin ng Hebreo kapwa ang organisadong pagtitipon at ang paglilingkod.
    reason: alternative_reading
  - marker: b
    text: Ang mga salamin noong sinaunang panahon ay karaniwang yari sa pinakintab na metal, gaya ng bronse, at hindi sa salamin na gaya ng ginagamit ngayon.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: palanggana
  rationale: Tumutukoy ito sa malaking sisidlang ginagamit sa paghuhugas sa paglilingkod sa tabernakulo. Ang “palanggana” ay malinaw at likas sa makabagong Filipino.
- source_word: כַּן
  choice: patungan
  rationale: Tumutukoy sa suportang kinapapatungan ng palanggana. Ang “patungan” ay karaniwan at malinaw na salita para sa pisikal na bagay na ito.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa konteksto ng mga kagamitan sa tabernakulo, malamang na bronse ang tinutukoy, bagaman maaaring mas malawak ang saklaw ng salitang Hebreo at tumukoy rin sa tanso o haluang metal na tanso.
- source_word: בְּמַרְאֹת
  choice: mula sa mga salamin
  rationale: 'Ang pang-ukol na ב ay nauunawaan dito bilang pagtukoy sa materyal o pinagmulan: ginamit ang mga salamin upang gawin ang palanggana at patungan.'
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: mga babaeng naglilingkod
  rationale: Ang pag-uulit ng ugat na צבא ay maaaring magpahiwatig ng organisadong pagtitipon o paglilingkod. Ang “naglilingkod” ay nagpapakita ng may-layuning gawain nang hindi ipinapalagay na may tungkuling pari ang mga babae.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: sa pasukan ng tolda ng pagpupulong
  rationale: Pinananatili nito ang lokasyong tinutukoy at ginagamit ang malinaw at nakaugaliang katawagan sa Filipino para sa tent of meeting.
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang payak na anyong pasalaysay ay natural sa Filipino at pinananatili ang isahang simuno ng pandiwang Hebreo.
theological_decisions:
- issue: Pagkakakilanlan at gawain ng הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: mga babaeng naglilingkod sa pasukan ng tolda ng pagpupulong
  alternative: mga babaeng nagtitipon sa pasukan ng tolda ng pagpupulong
  rationale: Maaaring tumukoy ang ugat na צבא sa pagtipon o pagharap para sa organisadong paglilingkod. Hindi nililinaw ng talata kung pormal o panliturhiya ang kanilang tungkulin, kaya hindi iyon idinagdag sa salin; inilalahad sa talababa ang tunay na alternatibong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palanggana” at “patungan” sa halip na mga salitang lipas o labis na teknikal. Pinanatili sa talababa ang kalabuan kung ang mga babae ay naglilingkod o nagtitipon.
