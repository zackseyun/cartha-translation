base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: tl
  text: 'isang beka para sa bawat tao[a]—kalahating siklo ayon sa siklo ng santuwaryo—para sa bawat dumaan sa hanay ng mga binilang[b], mula dalawampung taong gulang pataas: 603,550.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang beka ay katumbas ng kalahating siklo ayon sa pamantayan ng santuwaryo. Literal na “para sa bawat bungo” ang idyomang Hebreo, na nangangahulugang bawat indibiduwal na binilang.
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: Maaari ring isalin, “para sa bawat dumaan upang mapabilang sa mga binilang.” Gumagamit ang Hebreo ng pananalita ng sensus na may larawan ng pagdaan upang maitala.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: beka
  rationale: Isang tiyak na yunit ng timbang; pinanatili ang transliterasyon sapagkat agad itong ipinaliliwanag bilang kalahating siklo.
- source_word: לַגֻּלְגֹּלֶת
  choice: para sa bawat tao
  rationale: Literal na “para sa bawat bungo,” ngunit isang Hebreong idyoma ito para sa indibiduwal na bilang; natural at malinaw sa modernong Tagalog ang napiling salin.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: kalahating siklo
  rationale: Tuwirang ipinahahayag ang halaga ng isang beka.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinakikita nitong ang timbang ay sinusukat ayon sa pamantayang ginagamit sa santuwaryo.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: para sa bawat dumaan upang mapabilang sa mga binilang
  rationale: Pinananatili ang larawan ng pagdaan sa konteksto ng sensus habang nililinaw ang layuning mapabilang sa talaan.
- source_word: הַפְּקֻדִים
  choice: mga binilang
  rationale: Ang anyong pasibo ay tumutukoy sa mga taong binilang o itinala sa sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: mula dalawampung taong gulang pataas
  rationale: Natural na Tagalog para sa pormulang nagtatakda ng pinakamababang edad sa sensus.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 603,550
  rationale: Ginamit ang karaniwang anyong numero para sa malinaw at madaling pagbasa ng kabuuang bilang.
