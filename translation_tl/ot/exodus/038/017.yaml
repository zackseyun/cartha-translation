base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: tl
  text: Ang mga patungan[a] ng mga haligi ay yari sa bronse. Ang mga kawit ng mga haligi at ang mga bigkis[b] ng mga ito ay yari sa pilak, at ang patong sa mga tuktok ng mga ito ay pilak. Lahat ng haligi sa looban ay nilagyan ng mga bigkis na pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga soket” o “mga paanan.”
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal na isinasalin ang salitang Hebreo bilang “mga palamuti” o “mga palibot na piraso.” Hindi tiyak ang eksaktong anyo ng bahaging ito, ngunit tumutukoy ito sa mga kagamitang pilak na nakakabit sa mga haligi.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: mga patungan
  rationale: Tumutukoy ito sa mga suportang nasa ibaba ng mga haligi. Malinaw at likas sa modernong Filipino ang “mga patungan,” habang pinananatili sa talababa ang posibleng diwang mga soket.
- source_word: עַמֻּדִים
  choice: mga haligi
  rationale: Karaniwang katawagan ito sa Filipino para sa mga patayong suportang pang-arkitektura at angkop sa marangal na paglalarawan ng tabernakulo.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Sa konteksto ng mga kagamitang metal ng tabernakulo, “bronse” ang malinaw at kumbensiyonal na salin; maaari ring tumukoy ang salitang Hebreo sa tanso depende sa kontekstong metalurhikal.
- source_word: וָוֵי
  choice: mga kawit
  rationale: Tumutukoy ito sa mga nakakabit na pangsabitan o pangkabit sa mga haligi; “mga kawit” ang pinakanatural na salin.
- source_word: חֲשׁוּקֵיהֶם
  choice: mga bigkis ng mga ito
  rationale: Hindi tiyak ang eksaktong anyo ng bahaging pang-arkitektura, ngunit nagpapahiwatig ito ng mga pirasong pumapalibot o nagbibigkis sa mga haligi. Hindi ito labis na tinutukoy ng “mga bigkis.”
- source_word: צִפּוּי
  choice: balot
  rationale: Nangangahulugan ito ng isang patong o takip na metal sa ibabaw. Ang “balot” ay maikli, malinaw, at madaling maunawaan.
- source_word: רָאשֵׁיהֶם
  choice: mga tuktok ng mga ito
  rationale: Literal na “mga ulo ng mga ito,” ngunit tumutukoy sa itaas na bahagi ng mga haligi. Mas natural at hindi labis na teknikal ang “mga tuktok.”
- source_word: מְחֻשָּׁקִים
  choice: nilagyan ng mga bigkis
  rationale: Pinananatili nito ang ugnayang leksikal sa חֲשׁוּקֵיהֶם at malinaw na ipinahahayag na may mga kagamitang pilak na nakapalibot o nakakabit sa mga haligi.
- source_word: חָצֵר
  choice: looban
  rationale: Sa konteksto ng tabernakulo, ito ang nakabakod na panlabas na lugar. Natural at madaling maunawaan sa Filipino ang “looban.”
theological_decisions: []
translation_notes:
  register: Gumamit ng modernong Filipino na malinaw, marangal, at hindi labis na teknikal. Inulit ang “pilak” at pinanatili ang magkakaugnay na “mga bigkis” at “nilagyan ng mga bigkis” upang masundan ang pag-uulit at ugnayang leksikal sa Hebreo. Isinalin ang magkakasunod na pang-ugnay nang walang ipinapasok na diwa ng pagsalungat.
