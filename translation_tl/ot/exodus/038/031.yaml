  - marker: b
    text: O “mga estaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: mga patungan
  rationale: Tumutukoy sa mga pundasyong piyesa na sinasaksakan o kinatatayuan ng mga haligi; malinaw at kongkreto ang “mga patungan” sa modernong Filipino.
- source_word: חָצֵר
  choice: patyo
  rationale: Natural na tawag sa nababakurang panlabas na bahagi ng santuwaryo.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Pinananatili ang diwang nakapaligid o nasa lahat ng panig, at ang pag-uulit nito sa tekstong Hebreo.
- source_word: שַׁעַר
  choice: pintuang-daan
  rationale: Tiyak na tumutukoy sa pasukan o bukana ng patyo; mas angkop sa estruktura kaysa simpleng “pinto.”
- source_word: יִתְדֹת
  choice: mga tulos
  rationale: Tumutukoy sa mga ipinapako sa lupa upang panatilihing matatag ang tabernakulo at ang bakuran nito.
- source_word: מִּשְׁכָּן
  choice: tabernakulo
  rationale: Kinikilalang katawagan sa sagradong toldang tahanan sa Exodo at pinananatili ang pagiging tiyak ng terminong Hebreo.
- source_word: כָּל
  choice: lahat ng
  rationale: Likas na ipinahahayag ang kabuuang saklaw ng mga tulos na tinutukoy.
- source_word: וְאֵת / וְאֶת
  choice: at
  rationale: Ang mga pang-ugnay at panandang tuwirang layon ay bumubuo ng nagpapatuloy na talaan; sapat ang “at” sa Filipino, at hindi kailangang isalin ang panandang layon.
