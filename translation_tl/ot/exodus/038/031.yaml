translation:
  language: tl
  text: ang mga patungan[a] sa palibot ng patyo, ang mga patungan ng pintuang-daan ng patyo, ang lahat ng tulos[b] ng tabernakulo, at ang lahat ng tulos sa palibot ng patyo.
