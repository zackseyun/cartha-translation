base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: tl
  text: Ipinasok niya ang mga pingga sa mga argolya sa mga tagiliran ng altar[a] upang mabuhat iyon sa pamamagitan ng mga iyon. Ginawa niya itong hungkag, na yari sa mga tabla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dinala niya ang mga pingga sa mga argolya sa mga tagiliran ng altar.” Ang pandiwang Hebreo ay literal na maaaring mangahulugang “dinala,” ngunit sa konteksto ay tumutukoy ito sa paglalagay ng mga pingga sa mga argolya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “hungkag, mga tabla.” Malamang na ang ibig sabihin ay ginawa ang altar bilang hungkag na kayariang yari sa mga tabla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ipinasok niya
  rationale: Ang hiphil ng בוא kasunod ng pariralang tumutukoy sa mga argolya ay nagsasaad ng paglalagay o pagpapasok ng mga pingga sa kinalalagyan ng mga ito. Mas tiyak at natural dito ang “ipinasok” kaysa “dinala.”
- source_word: הַבַּדִּים
  choice: mga pingga
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa mahahabang pinggang ginagamit sa pagbuhat ng sagradong kagamitan; malinaw at karaniwang salitang Filipino ang “pingga.”
- source_word: בַּטַּבָּעֹת
  choice: sa mga argolya
  rationale: Ang בְּ ay tumutukoy sa pagpasok o pagkakalagay sa loob ng mga singsing. Ang “argolya” ay natural na tawag sa mga singsing na kabitan ng pingga.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: sa mga tagiliran ng altar
  rationale: Ang צלעות ay mga gilid o tagiliran. Pinananatili ng “mga tagiliran” ang pisikal na larawan nang hindi dinaragdagan ang detalye.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: upang mabuhat iyon sa pamamagitan ng mga iyon
  rationale: Ipinahahayag ng infinitive ang layunin. Pinananatili ng “sa pamamagitan ng mga iyon” ang tahasang pagtukoy ng panghalip sa mga pingga.
- source_word: נְבוּב
  choice: hungkag
  rationale: Tuwirang inilalarawan ng salita ang altar bilang walang laman sa loob; ang “hungkag” ay maikli, natural, at angkop sa marangal na rehistro.
- source_word: לֻחֹת
  choice: na yari sa mga tabla
  rationale: Elliptical ang Hebreong “hungkag, mga tabla.” Nililinaw ng parirala na ang hungkag na kayarian ay binuo mula sa mga tabla nang hindi inaangking ganap na malinaw ang sintaks.
- source_word: עָשָׂה אֹתוֹ
  choice: Ginawa niya ito
  rationale: Tuwirang katumbas ng pandiwa at hulaping layon; pinananatili ang hiwalay na sugnay ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “altar,” “argolya,” “pingga,” at “tabla” bilang karaniwang bokabularyo sa paglalarawan ng konstruksiyon. Iningatan sa talababa ang lexical at sintaktikong kalabuan ng וַיָּבֵא at נְבוּב לֻחֹת.
