base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: tl
  text: Kasama niya si Oholiab na anak ni Ahisamac[a], na kabilang sa lipi ni Dan, isang bihasang artisano, tagadisenyo, at tagaburda sa asul, purpura, iskarlata[b], at pinong lino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring baybayin na “Aholiab.” Iba-iba ang transliterasyon ng pangalang Hebreong ito.
    reason: lexical_alternative
  - marker: b
    text: Ang “iskarlata” ay salin ng isang pariralang Hebreo para sa materyal na tekstil na tinina ng matingkad na pula; maaari rin itong isaling “matingkad na pula.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Kasama niya si
  rationale: Ipinahahayag ng pariralang Hebreo na kasama ni Bezalel, na binanggit sa naunang talata, si Oholiab. Likas sa Tagalog ang sugnay na ito kahit walang katumbas na hayag na pandiwa sa Hebreo.
- source_word: אָהֳלִיאָב
  choice: Oholiab
  rationale: Tuwirang transliterasyon ng pangalang Hebreo ayon sa pagkakabigkas sa tekstong Masoretiko; inilagay sa talababa ang nakaugaliang alternatibong anyong “Aholiab.”
- source_word: בֶּן אֲחִיסָמָךְ
  choice: anak ni Ahisamac
  rationale: Likas na anyo sa Tagalog para sa patronimikong pariralang Hebreo; transliterado ang pangalan.
- source_word: לְמַטֵּה דָן
  choice: mula sa lipi ni Dan
  rationale: Malinaw at likas na ipinahahayag ang pagkakabilang niya sa lipi ni Dan.
- source_word: חָרָשׁ
  choice: mang-uukit
  rationale: Sa konteksto ng mga bihasang gawain sa tabernakulo, ang salita ay tumutukoy sa isang artisano; pinananatili ng “mang-uukit” ang mas tiyak na diwa ng listahan ng mga kasanayan.
- source_word: וְחֹשֵׁב
  choice: tagadisenyo
  rationale: Tumutukoy ito sa gumagawa o nag-iisip ng masalimuot at masining na mga disenyo, lalo na sa tela.
- source_word: וְרֹקֵם
  choice: tagaburda
  rationale: Karaniwan at malinaw na katawagan sa modernong Tagalog para sa gumagawa ng burda sa tela.
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן וּבְתוֹלַעַת הַשָּׁנִי
  choice: na gumagamit ng sinulid na asul, purpura, at iskarlata
  rationale: Ginagawang malinaw ang kontekstong pantela nang hindi ipinapalagay na ang bawat terminong pangkulay ay likas na nangangahulugang “sinulid.” Ang “purpura” at “iskarlata” ay marangal at nauunawaang tawag sa mga kulay.
- source_word: וּבַשֵּׁשׁ
  choice: at ng pinong lino
  rationale: Sa konteksto ng tabernakulo, ang שֵׁשׁ ay pinong lino. Ang pag-uulit ng “ng” ay nililinaw na isa rin itong materyal na ginagamit niya.
