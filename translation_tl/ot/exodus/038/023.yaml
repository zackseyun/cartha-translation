- from: Kasama niya si Oholiab na anak ni Ahisamac[a], mula sa lipi ni Dan. Siya ay isang mang-uukit, tagadisenyo, at tagaburda na gumagamit ng sinulid na asul, purpura, at iskarlata[b], at ng pinong lino.
  to: Kasama niya si Oholiab na anak ni Ahisamac[a], na kabilang sa lipi ni Dan, isang bihasang artisano, tagadisenyo, at tagaburda sa asul, purpura, iskarlata[b], at pinong lino.
  rationale: Inalis ang hindi hayag na “sinulid,” pinalawak ang “mang-uukit” sa “bihasang artisano” ayon sa saklaw ng terminong Hebreo, at inayos ang pahayag tungkol sa lipi at ang talababa upang maging tumpak at pare-pareho. Napanatili ang pagkakasunod ng mga tungkulin at materyales at ang maingat na antas ng katiyakan ng pinagmulan.
