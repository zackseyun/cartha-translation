    issue: Ang “mang-uukit” ay masyadong tiyak para sa חָרָשׁ.
    rationale: Sa listahang ito ng mga gawaing pansining, ang salita ay maaaring tumukoy nang mas malawak sa isang bihasa o dalubhasang manggagawa/artisano; hindi ligtas na limitahan ito sa pag-uukit.
  - severity: medium
    issue: Idinagdag ng saling “sinulid na asul, purpura, at iskarlata” ang materyal na “sinulid” sa lahat ng tatlong termino.
    rationale: Bagaman posibleng telang tinina o sinulid ang tinutukoy sa konteksto, hindi ito hayag na isinasaad para sa bawat termino sa talata. Dapat panatilihin ang antas ng pagtitiyak ng Hebreo.
