translation:
  language: tl
  text: Ginawa niya ang mga pingga mula sa kahoy na akasya at binalutan ang mga iyon ng bronse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay karaniwang anyong pasalaysay na nangangahulugang ‘at ginawa niya.’ Hindi na kailangang isalin nang tahasan ang pang-ugnay upang maging natural sa Tagalog, habang nananatili ang sunod-sunod na diwa ng salaysay.
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Sa konteksto ng mga kagamitan sa tabernakulo, tumutukoy ang בַּדִּים sa mahahabang pinggang ginagamit sa pagbubuhat. Ang ‘mga pingga’ ay maikli at likas sa Tagalog; maaaring magpahiwatig ng ibang uri ng estruktura ang ‘mga baras.’
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang pariralang construct ay literal na ‘kahoy ng akasya.’ Ang ‘mula sa kahoy na akasya’ ay malinaw at natural sa makabagong Tagalog.
- source_word: וַיְצַף
  choice: at binalutan
  rationale: Sa kontekstong ito ng paggawa, ang צפה ay nangangahulugang balutan o sapinan ng metal ang isang bagay. Ang ‘binalutan’ ay natural at madaling maunawaan, nang hindi nagpapahiwatig na purong metal ang buong pingga.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang hulaping tuwirang layon ay tumutukoy pabalik sa maramihang ‘mga pingga.’ Nililinaw ito ng ‘ang mga iyon’ sa natural na Tagalog.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa tanso o bronse depende sa konteksto. Pinili ang ‘bronse’ bilang karaniwang katawagan sa paglalarawan ng mga kagamitan sa tabernakulo, habang inilalahad sa talababa ang tunay na alternatibong leksikal.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pingga’ para sa mga kahoy na pambuhat at ‘binalutan’ para sa paglalapat ng metal. Nasa pangunahing teksto ang panandang [a], kaagad pagkatapos ng ‘bronse.’
