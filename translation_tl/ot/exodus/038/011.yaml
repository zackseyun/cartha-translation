  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: tl
  text: Sa hilagang panig ay isandaang siko ang haba. Dalawampu ang mga haligi nito at dalawampu rin ang mga tansong patungan nito. Pilak ang mga kawit ng mga haligi at ang mga bigkis[a] ng mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kawing.” Tumutukoy ang salitang Hebreo sa mga pilak na kasangkapang nakakabit sa mga haligi; hindi tiyak ang eksaktong anyo ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: sa hilagang panig
  rationale: Ang פאה ay panig o gilid; kasama ng צפון, malinaw itong tumutukoy sa hilagang panig ng patyo.
- source_word: מֵאָה בָאַמָּה
  choice: isandaang siko ang haba
  rationale: Ipinahahayag ng parirala ang sukat ng panig. Idinagdag ang “ang haba” upang maging likas at malinaw sa modernong Tagalog nang hindi binabago ang diwa.
- source_word: עַמּוּדֵיהֶם
  choice: dalawampu ang mga haligi nito
  rationale: Ang עמודים ay mga haligi o poste. Ang “haligi” ang karaniwang katawagan sa konteksto ng tabernakulo, at ang panghalip na hulapi ay natural na isinalin bilang “nito.”
- source_word: אַדְנֵיהֶם
  choice: dalawampu rin ang mga tansong patungan nito
  rationale: Ang אדן ay suportang tuntungan o socket ng haligi. Mas madaling maunawaan ng karaniwang mambabasa ang “patungan” kaysa sa teknikal na “socket.”
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay tumutukoy sa copper/bronze material sa sinaunang gamit. “Tanso” ang natural at nakaugaliang salin sa Filipino nang hindi nagtatakda nang labis sa eksaktong komposisyon ng haluang metal.
- source_word: וָוֵי הָעַמּוּדִים
  choice: mga kawit ng mga haligi
  rationale: Sa mga paglalarawan ng tabernakulo, ang וָוִים ay mga kawit na nakakabit sa mga haligi, hindi mga tulos ng tolda.
- source_word: חֲשֻׁקֵיהֶם
  choice: mga bigkis
  rationale: Tumutukoy ang salita sa mga pilak na kasangkapang pang-arkitektura na kaugnay ng mga haligi, marahil ay mga pirasong bumibigkis o nag-uugnay. Pinananatili ng “bigkis” ang pangunahing larawan habang inilalahad sa talababa ang kawalan ng katiyakan.
- source_word: כָּסֶף
  choice: pilak
  rationale: Ito ang tuwirang katawagan sa materyal na pilak; sa talata, inilalarawan nito ang mga kawit at mga bigkis.
