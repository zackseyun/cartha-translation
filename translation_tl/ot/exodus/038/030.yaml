base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: tl
  text: Ginamit niya ang tansong iyon sa paggawa ng mga patungan sa pasukan ng toldang tipanan[a], ng tansong altar, ng tansong parilya para rito[b], at ng lahat ng kagamitan ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga saket” sa pasukan ng toldang tipanan.
    reason: lexical_alternative
  - marker: b
    text: O “tansong sala-sala” na para rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ בָּהּ
  choice: Ginamit niya ang tansong iyon sa paggawa
  rationale: Ipinahahayag nang natural sa modernong Tagalog ang instrumental na diwa ng בָּהּ at ang pagtukoy nito sa tansong binanggit sa naunang talata.
- source_word: אַדְנֵי
  choice: mga patungan
  rationale: Ang mga ito ay suportang metal sa paanan ng balangkas; malinaw sa karaniwang mambabasa ang “mga patungan,” samantalang maaaring teknikal ang “mga saket.”
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pasukan ng toldang tipanan
  rationale: Ang פֶּתַח ay pasukan o bukana. Ang “toldang tipanan” ay maikli, marangal, at nagpapahayag ng itinakdang pakikipagtagpo nang hindi nagpapasok ng denominasyonal na katawagan.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: tansong altar
  rationale: Ang נְחֹשֶׁת sa kontekstong ito ay karaniwang nauunawaang bronze; “tanso” ang natural at tradisyonal na katumbas sa Filipino.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: tansong parilya
  rationale: Tumutukoy ang מִכְבָּר sa sala-salang bahagi ng altar. Malinaw na inilalarawan ng “parilya” ang pisikal na bagay.
- source_word: אֲשֶׁר לוֹ
  choice: para rito
  rationale: Pinananatili nito ang maikli at bahagyang malawak na ugnayan ng parilya sa altar nang hindi tiyak na sinasabing nasa ibabaw o nakakabit dito.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: lahat ng kagamitan ng altar
  rationale: Malawak ang saklaw ng כְּלִים; natural at sapat na pangkalahatan ang “kagamitan” sa modernong Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “tanso” para sa נְחֹשֶׁת at pinanatili sa talababa ang mas teknikal o alternatibong katawagan. Lahat ng panandang talababa ay nasa pangunahing teksto.
