  source_fidelity: 'Tapat ang salin sa Hebreo: ang instrumental na diwa ng בָּהּ ay malinaw sa “Ginamit niya ang tansong iyon,” at nasasaklaw ang mga patungan, tansong altar, tansong parilya na kaugnay ng altar, at lahat ng kagamitan nito. Hindi nito labis na tinutukoy ang eksaktong posisyon o pagkakabit ng parilya.'
