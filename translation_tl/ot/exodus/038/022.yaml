  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: tl
  text: At ginawa ni Bezalel, anak ni Uri, anak ni Hur, mula sa lipi ni Juda, ang lahat ng iniutos ni Yahweh[a] kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: Ipinababatid ang anyong Hebreo ng banal na pangalan at ang karaniwang tradisyonal na salin nito.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: At ginawa ni Bezalel
  rationale: Pinanatili ng “At” ang ugnayang pasalaysay na ipinahihiwatig ng וּ; isinalin ang pangungusap sa likas na ayos sa Tagalog habang tinutumbasan ang pangalang בְצַלְאֵל bilang “Bezalel.”
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: na anak ni Uri, na anak ni Hur
  rationale: Ang magkasunod na בֶּן ay pormal na pormulang pangangkanan; pinanatili ang “anak” sa parehong bahagi nang hindi pinalalawak bilang “inapo.”
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: mula sa lipi ni Juda
  rationale: Sa kontekstong ito, ang מַטֶּה ay tumutukoy sa tribo o liping kinabibilangan. Ang “mula sa lipi ni Juda” ay malinaw at likas sa modernong Tagalog.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Bagaman maaaring mangahulugang “gumawa” o “ginanap” ang עשה, ang “ginawa” ay angkop sa konteksto ng paggawa ng tabernakulo at sapat na malawak para sa lahat ng iniutos.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Ipinahahayag nito ang kabuuan ng mga bagay na iniutos at natural na nag-uugnay sa kasunod na sugnay sa Tagalog.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang aspektong ganap ng Hebreo ay maayos na naihahayag ng “iniutos”; malinaw na nauna ang utos sa paggawa kahit walang idinagdag na tahasang panandang pluperfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinumbasan ang Tetragrammaton bilang personal na pangalang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Sa konstruksiyong צִוָּה ... אֶת־מֹשֶׁה, si Moises ang taong inutusan; likas itong ipinahahayag sa Tagalog bilang “iniutos ... kay Moises.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit sa tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan, samantalang ang “PANGINOON” ay pamalit na titulo at ang “Jehova” ay tradisyonal na anyong hibrido.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang payak na pormulang pangangkanan at ang tuwirang diin na ginawa ni Bezalel ang lahat ng iniutos, nang walang idinagdag na pagpapakahulugang denominasyonal.
