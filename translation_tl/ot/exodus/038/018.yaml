base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: tl
  text: Ang tabing para sa pasukan ng patyo[a] ay gawa ng isang mangbuburda, mula sa sinulid na asul, purpura, at iskarlata, at sa pinong pinilipit na lino[b]. Dalawampung siko ang haba nito at limang siko ang taas sa lapad[c], na katumbas ng mga tabing sa palibot ng patyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pantabing para sa pasukan ng patyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “asul, purpura, at iskarlata”; ang salitang “sinulid” ay nilinaw mula sa konteksto ng mga materyales na ginamit sa tabing.
    reason: lexical_clarification
  - marker: c
    text: 'Mas literal: “at ang taas sa lapad ay limang siko.” Malamang na ipinahihiwatig ng pananalitang ito na ang tabing sa pasukan ay limang siko ang taas, gaya ng mga tabing sa palibot ng patyo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: tabing sa pasukan ng patyo
  rationale: Ang מָסַךְ ay isang telang pantakip o harang sa bukana; ang “tabing” ay natural sa Filipino. Ang שַׁעַר ay tumutukoy rito sa bukana o pasukan ng patyo, hindi kinakailangang sa isang matigas na pinto.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: gawa ng isang mangbuburda
  rationale: Pinananatili nito ang Hebreong pahayag tungkol sa gawa ng bihasang manggagawa sa telang may disenyo, sa halip na gawing simpleng pang-uri lamang.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: sinulid na asul, purpura, at iskarlata
  rationale: Ipinahahayag ng mga termino ang mamahaling kinulayang materyales. Idinagdag ang “sinulid” upang luminaw sa Filipino na mga materyales sa paghahabi ang tinutukoy.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Tuwirang inilalarawan nito ang mataas na uring lino na binubuo ng pinilipit na hibla.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: Dalawampung siko ang haba nito
  rationale: Pinananatili ang sinaunang yunit na siko at natural na inilalahad ang sukat sa Filipino.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: limang siko ang taas
  rationale: Ito ang malamang na kahulugan ng di-karaniwang Hebreong pananalita tungkol sa taas at lapad; ang literal na anyo at posibleng pagbasa ay inilagay sa talababa.
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: kapantay ng mga tabing sa palibot ng patyo
  rationale: Ang לְעֻמַּת ay nagsasaad ng pagtutugma o pagkakapantay. Sa konteksto, tumutugma ang limang-sikong taas sa mga nakapalibot na tabing.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal ang himig. Ginamit ang “patyo,” “tabing,” at “pasukan” bilang mga karaniwang salitang nauunawaan ng ordinaryong mambabasa; pinanatili ang “siko” bilang sinaunang yunit at ang tradisyonal na mga katawagang pangkulay na “purpura” at “iskarlata.”
