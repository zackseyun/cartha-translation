  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang buong anyo ng bilang upang umayon sa estilong salaysay at pagtutuos. Pinanatili ang teknikal na “mga bigkis,” na ipinaliliwanag sa talababa dahil hindi lubos na tiyak ang eksaktong anyo o gamit ng mga ito.
