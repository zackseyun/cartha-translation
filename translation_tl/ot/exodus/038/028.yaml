  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: tl
  text: At sa isang libo pitong daan at pitumpu't lima, gumawa siya ng mga kawit para sa mga haligi; kinalupkupan niya ang mga tuktok ng mga ito at nilagyan niya ng mga bigkis[a] ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pinagdugtong niya ang mga ito sa pamamagitan ng mga bigkis.” Ang pandiwang Hebreo rito ay maaaring tumukoy sa paglalagay sa mga haligi ng mga bigkis o palibot na pirasong pang-ugnay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: At mula sa isang libo pitong daan at pitumpu't lima
  rationale: Ipinagpapatuloy nito ang pagtutuos ng pilak sa naunang talata. Ang “mula sa” ay natural sa Tagalog at malinaw na nagpapahayag na ang halagang ito ang ginamit, nang hindi inuulit ang yunit na nasa konteksto ngunit wala sa mismong talata.
- source_word: עָשָׂה
  choice: gumawa siya
  rationale: Karaniwan at malinaw na salin sa konteksto ng paggawa ng mga bahagi ng tabernakulo.
- source_word: וָוִים
  choice: mga kawit
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa mga metal na kawit na nakakabit sa mga haligi; “mga kawit” ang tiyak at madaling maunawaang katumbas.
- source_word: לָעַמּוּדִים
  choice: para sa mga haligi
  rationale: Ang “mga haligi” ay angkop na katawagan sa mga patayong suportang bahagi at pamilyar sa mga modernong mambabasa.
- source_word: וְצִפָּה
  choice: binalutan niya
  rationale: Ang pandiwa ay tumutukoy sa pagbalot o pagkalupkop ng metal. Hindi tahasang idinagdag ang “ng pilak” sapagkat konteksto lamang, hindi ang talatang ito mismo, ang nagsasaad ng metal.
- source_word: רָאשֵׁיהֶם
  choice: ang mga tuktok ng mga iyon
  rationale: Literal itong “mga ulo ng mga iyon,” ngunit “mga tuktok” ang natural na Tagalog para sa itaas na bahagi ng mga haligi.
- source_word: וְחִשַּׁק אֹתָם
  choice: at nilagyan niya ng mga bigkis ang mga iyon
  rationale: Pinananatili ng “mga bigkis” ang larawang teknikal ng mga pirasong nakapalibot o nag-uugnay sa mga haligi, habang iniiwasan ang masyadong espesipikong pagpapakahulugan sa bihirang pandiwang Hebreo.
