  terminology: Ang “mga kawit” at “mga haligi” ay angkop. Pinanatili ang “mga bigkis” para sa hindi ganap na tiyak na חִשַּׁק, at nilinaw sa talababa na maaaring tumukoy ito sa mga palibot na pirasong pang-ugnay.
