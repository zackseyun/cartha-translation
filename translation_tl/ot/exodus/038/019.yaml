  naturalness: Nauunawaan ang draft, ngunit paulit-ulit at mabigat ang “ng mga iyon.” Ang bahagyang pag-aayos sa parirala ay nagpapanatili ng malinaw na pagtukoy sa mga haligi habang nananatiling natural ang daloy.
  terminology: “Haligi,” “patungan,” “tanso,” “kawit,” at “pilak” ay angkop. Pinalitan ang “balot” ng “kalupkop,” isang mas tiyak at natural na katawagan para sa metal overlay. Ginamit ang “mga banda” para sa terminong Hebreong hindi tiyak ang eksaktong anyo, nang hindi ito labis na binibigyang-kahulugan.
