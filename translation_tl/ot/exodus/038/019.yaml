  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: tl
  text: Ang apat na haligi nito at ang apat na patungang tanso ng mga iyon; ang mga kawit ng mga iyon ay pilak, at ang kalupkop sa mga tuktok ng mga iyon at ang mga banda ng mga iyon ay pilak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: mga haligi nito
  rationale: Ang עַמּוּד ay karaniwang tumutukoy sa haligi. Ang “haligi” ang natural at karaniwang terminong pang-arkitektura sa konteksto ng tabernakulo.
- source_word: אַדְנֵיהֶם
  choice: mga patungan ng mga iyon
  rationale: Ang אֶדֶן ay mga bahaging metal na sumusuporta sa paanan ng mga haligi. Malinaw sa makabagong Tagalog ang “patungan” nang hindi labis na tinutukoy ang eksaktong hugis.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay pangkalahatang katawagan sa tanso o tansong haluang metal; “tanso” ang nakagawiang natural na salin sa ganitong talaan ng mga materyales.
- source_word: וָוֵיהֶם
  choice: mga kawit ng mga iyon
  rationale: Ang וָו ay kagamitang pangkabit na maaaring kawit o tulos. “Kawit” ang pinakanaaangkop sa mga haligi ng bakuran.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Tuwirang tumutukoy ang כֶּסֶף sa pilak bilang materyal.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: ang balot sa mga tuktok ng mga iyon
  rationale: Ang צִפּוּי ay balot o kalupkop, at ang רָאשֵׁיהֶם ay literal na “mga ulo,” dito ay mga tuktok. Pinananatili ng parirala ang anyong pangngalan ng Hebreo.
- source_word: חֲשֻׁקֵיהֶם
  choice: mga bigkis ng mga iyon
  rationale: Hindi tiyak ang eksaktong anyo ng mga elementong tinutukoy. Ang “bigkis” ay malinaw ngunit hindi labis na espesipikong katumbas ng mga bandang nakakabit sa mga haligi.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginawang ganap na mga sugnay ang magkakasunod na pariralang nominal sa Hebreo upang maging natural sa Tagalog, habang pinananatili ang pag-uugnay ng tanso sa mga patungan at ng pilak sa mga kawit, balot, at bigkis. Ginamit ang “mga iyon” upang malinaw na tumukoy pabalik sa apat na haligi.
