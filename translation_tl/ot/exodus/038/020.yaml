  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: tl
  text: At ang lahat ng tulos para sa tabernakulo at sa patyo sa palibot nito ay yari sa bronse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso.” Maaaring tumukoy ang Hebreong נְחֹשֶׁת sa tanso o bronse, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: At ang lahat ng
  rationale: Likas na ipinapahayag ng וְ kasama ng כָּל ang kabuuan ng maramihang pangngalang sumusunod; malinaw at natural sa Filipino ang “At ang lahat ng.”
- source_word: הַיְתֵדֹת
  choice: mga tulos
  rationale: Ang יָתֵד ay tulos o peg na ipinapako sa lupa upang patatagin ang isang tolda o bakod. Mas natural at madaling maunawaan sa modernong Filipino ang “mga tulos.”
- source_word: לַמִּשְׁכָּן
  choice: para sa tabernakulo
  rationale: Ang מִשְׁכָּן ay literal na tirahan ngunit tumutukoy rito sa sagradong tolda ng Israel; pinananatili ng “tabernakulo” ang malinaw at nakaugaliang katawagan.
- source_word: וְלֶחָצֵר סָבִיב
  choice: at sa patyo sa palibot nito
  rationale: Ang חָצֵר ay nakabakod na patyo, at ang סָבִיב ay nagsasaad na nakapalibot ito sa tabernakulo. Ginagawang tahasan ng “nito” ang likas na reperensiya nang hindi binabago ang diwa.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa tanso o bronse ayon sa konteksto. Sa talaan ng mga materyales ng tabernakulo, “bronse” ang malinaw at nakaugaliang salin, habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “tabernakulo” bilang pamilyar na katawagang biblikal, “patyo” para sa malinaw na pang-araw-araw na wika, at “yari sa bronse” bilang natural na paglalarawan ng materyal.
