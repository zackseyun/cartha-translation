  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: tl
  text: Ginawa niya sa apat na sulok ng altar ang mga sungay nito. Ang mga sungay ay iisang piraso ng altar[a], at binalutan niya ng bronse[b] ang altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula rito ang mga sungay nito,” na nagpapahiwatig na hindi hiwalay na ginawa at saka ikinabit ang mga sungay.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong neḥoshet ay maaaring tumukoy sa bronse o tanso; “bronse” ang karaniwang salin sa konteksto ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Tuwirang salaysay mula sa pandiwang עשה; natural at malinaw sa modernong Tagalog.
- source_word: קַרְנֹתָיו
  choice: ang mga sungay nito
  rationale: Pinananatili ang konkretong larawang “sungay,” ang karaniwang tawag sa mga nakausling bahagi sa mga sulok ng altar.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: sa apat na sulok ng altar
  rationale: Ipinahahayag nang natural ang kinalalagyan ng mga sungay. Ginawang tahasan ang tinutukoy ng panghalip upang maiwasan ang malabong sunod-sunod na “nito.”
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Ang mga sungay ay kaisang piraso ng altar
  rationale: Ang literal na “mula rito ang mga sungay nito” ay wikang pangkonstruksiyon na nagpapahiwatig na hindi hiwalay na ginawa at saka ikinabit ang mga sungay. Ang “kaisang piraso” ay malinaw at natural habang pinananatili ang diwa.
- source_word: וַיְצַף אֹתוֹ
  choice: binalutan niya ... ang altar
  rationale: Sa konteksto ng paggawa ng santuwaryo, ang צפה ay tumutukoy sa paglalapat ng metal bilang balot o sapin. Natural sa Tagalog ang “binalutan.”
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang salitang Hebreo sa tanso o bronse. Pinili ang “bronse” bilang karaniwang salin sa konteksto ng mga kagamitan ng tabernakulo, habang inilalagay sa talababa ang tunay na leksikal na posibilidad na “tanso.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Inulit ang “altar” sa halip na gumamit ng magkakasunod na malalabong panghalip. Pinanatili ang terminong “mga sungay” at ipinaliwanag sa talababa ang paraan ng pagkakagawa at ang kalabuan sa uri ng metal.
