  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: tl
  text: Hinabol sila ng mga Ehipsiyo, at pumasok ang mga ito sa gitna ng dagat kasunod nila—lahat ng kabayo[a] ni Faraon, ang kanyang mga karwahe, at ang kanyang mga mangangabayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isahan ang “kabayo” ngunit kolektibo ang gamit nito; kaya isinalin itong “mga kabayo” sa natural na Tagalog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: Hinabol
  rationale: Ang רדף ay nangangahulugang humabol o tumugis; natural at malinaw sa salaysay-militar ang “hinabol.”
- source_word: מִצְרַיִם
  choice: mga Egipcio
  rationale: Bagaman maaari itong tumukoy sa Egipto bilang lupain o bayan, ang pandiwang maramihan at konteksto ay tumutukoy sa mga taong hukbo ng Egipto.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: sumunod sa kanila papasok
  rationale: Pinagsasama nito ang kilos ng בוא, ang pagsunod na ipinahihiwatig ng אַחֲרֵיהֶם, at ang direksiyong patungo sa loob ng dagat.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: ang lahat ng kabayo ng Faraon
  rationale: Pinananatili ang כֹּל bilang “lahat” at isinasalin sa natural na maramihan ang kolektibong isahan na סוּס.
- source_word: רִכְבּוֹ
  choice: ang kanyang mga karwahe
  rationale: Sa talaan ng mga puwersang militar, ang רכב ay likas na tumutukoy sa mga karwaheng pandigma.
- source_word: וּפָרָשָׁיו
  choice: at ang kanyang mga mangangabayo
  rationale: Ang פָּרָשׁ ay mangangabayo o kawal na nakasakay sa kabayo; pinananatili ng salin ang kongkretong larawan.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: papasok sa gitna ng dagat
  rationale: Ipinahahayag ng תּוֹךְ ang pagpasok sa kaloob-looban o gitnang bahagi, hindi lamang ang pagpasok sa dagat.
