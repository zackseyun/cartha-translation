translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “karwahe” para sa sasakyang pandigma at “mangangabayo” para sa mga kawal na nakasakay sa kabayo. Inilagay ang gitling upang malinaw na ang sumusunod na talaan ang kabuuan ng puwersa ng Faraon na pumasok sa dagat.
