  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: tl
  text: At malalaman ng mga Ehipsiyo na ako si Yahweh[a] kapag naluwalhati ako[b] sa pamamagitan ni Paraon, ng kanyang mga karwahe, at ng kanyang mga mangangabayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ang banal na pangalang YHWH, na madalas isinasaling “ang PANGINOON.”
    reason: divine_name
  - marker: b
    text: O, “kapag nagkamit ako ng karangalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: At malalaman
  rationale: Ang anyong pandiwa sa daloy ng salaysay ay nagpapahayag ng magiging bunga ng nalalapit na pangyayari. Likas sa makabagong Tagalog ang “malalaman” para sa pagkilalang darating.
- source_word: מִצְרַיִם
  choice: ang mga Ehipsiyo
  rationale: Bagaman maaari ring tumukoy ang salita sa bansang Ehipto, mga mamamayan nito ang siyang makakakilala kay Yahweh sa kontekstong ito.
- source_word: כִּי אֲנִי יְהוָה
  choice: na ako si Yahweh
  rationale: Pinananatili nito ang pormula ng pagkilala at ang personal na banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: בְּהִכָּבְדִי
  choice: kapag naluwalhati ako
  rationale: Ang Niphal infinitive ng כבד ay maaaring ipahayag bilang pagtanggap o pagtatamo ng karangalan. Ang pasibong “naluwalhati ako” ay natural at pinananatili ang diin na mahahayag ang karangalan ni Yahweh sa mangyayari.
- source_word: בְּפַרְעֹה
  choice: sa pamamagitan ng Paraon
  rationale: Dito, ang בְּ ay tumutukoy sa kaugnayan o paraang gagamitin upang mahayag ang kaluwalhatian ni Yahweh; hindi nito ipinahihiwatig na kusang luluwalhatiin siya ng Paraon.
- source_word: בְּרִכְבּוֹ
  choice: ng kanyang mga karwahe
  rationale: Ang רכב ay maaaring kolektibong tumukoy sa hukbo ng mga karwahe. Malinaw at karaniwan sa Tagalog ang “mga karwahe.”
- source_word: וּבְפָרָשָׁיו
  choice: at ng kanyang mga mangangabayo
  rationale: Ang פָרָשִׁים ay tumutukoy sa mga nakasakay sa kabayo o hukbong-kabalyerya. Ang “mga mangangabayo” ang tuwiran at madaling maunawaang katumbas.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang ipinakilala ng Diyos, samantalang ang “PANGINOON” ay pamalit na titulo.
- issue: Kung aktibo o pasibo ang pagpapahayag ng כבד
  choice: naluwalhati ako
  alternative: nagkamit ako ng karangalan
  rationale: Pinahihintulutan ng anyong Niphal at ng konteksto ang paglalarawan sa Diyos bilang niluluwalhati sa hatol niya sa Paraon. Inilalagay sa talababa ang aktibong katumbas upang hindi alisin ang tunay na saklaw ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga Ehipsiyo,” “mga karwahe,” at “mga mangangabayo” bilang mga salitang madaling maunawaan habang pinananatili ang paralelismo at bigat ng pahayag sa Hebreo.
