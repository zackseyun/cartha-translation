base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: tl
  text: Nang ibalita sa hari ng Ehipto na tumakas na ang bayan, bumaling laban sa bayan ang puso ng Paraon at ng kanyang mga lingkod.[a] Sinabi nila, “Ano itong ginawa natin, na pinaalis natin ang Israel mula sa paglilingkod sa atin?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbago ang isip ng Paraon at ng kanyang mga lingkod hinggil sa bayan.”
    reason: lexical_alternative
  - marker: b
    text: O, “pinalaya natin ang Israel mula sa paglilingkod sa atin,” o “mula sa pagiging mga alipin natin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Nang ibalita
  rationale: Pinananatili ng anyong balintiyak ang di-tinukoy na tagapagbalita sa Hebreo, habang likas ang daloy sa salaysay na Tagalog.
- source_word: לְמֶלֶךְ מִצְרַיִם
  choice: sa hari ng Ehipto
  rationale: Tuwirang inililipat ang ugnayang genitibo sa natural na ayos ng Tagalog.
- source_word: כִּי בָרַח הָעָם
  choice: na tumakas na ang bayan
  rationale: Ang ברח ay tumutukoy sa pagtakas; ipinahihiwatig ng ikalawang “na” na naganap na ito bago makarating ang balita.
- source_word: וַיֵּהָפֵךְ לְבַב
  choice: bumaling ... ang puso
  rationale: Pinananatili ang larawan ng pagbaling o pagbabago ng kalooban sa halip na gawing tahasang “nagbago ang isip.”
- source_word: לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: ang puso ng Paraon at ng kanyang mga lingkod
  rationale: Pinananatili ang “puso” bilang luklukan ng pag-iisip at pagpapasya at sinusundan ang isahang anyo ng Hebreo.
- source_word: אֶל הָעָם
  choice: laban sa bayan
  rationale: Sa konteksto, ang pagbaling ay naging mapanlaban; malinaw at natural itong ipinahahayag ng “laban sa.”
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Ano itong ginawa natin?
  rationale: Pinananatili ang idiomatikong tanong na may demonstratibong “ito,” na nagpapahayag ng pagkagulat at pagsisisi.
- source_word: שִׁלַּחְנוּ
  choice: Pinaalis natin
  rationale: Sa konteksto, tumutukoy ito sa pagpapayaong o pagpapakawala sa Israel; ang “pinaalis” ay likas at hindi labis na nagpapakahulugan.
- source_word: מֵעָבְדֵנוּ
  choice: mula sa paglilingkod sa atin
  rationale: Malapit ito sa pandiwang ideya ng pagtigil ng paglilingkod at hindi agad pinapalitan ng mas interpretatibong “pagiging mga alipin natin.”
theological_decisions:
- issue: Kahulugan ng לְבַב bilang antropolohikong katawagan
  choice: puso
  alternative: isip o kalooban
  rationale: Ang “puso” ay nagpapanatili sa talinghaga at sa lawak ng Hebreong konsepto, na saklaw ang pag-iisip, hangarin, at pagpapasya.
- issue: Kalagayan ng Israel sa מֵעָבְדֵנוּ
  choice: mula sa paglilingkod sa atin
  alternative: mula sa pagiging mga alipin natin
  rationale: Bagaman malinaw sa mas malawak na salaysay ang sapilitang pagkaalipin, ang mismong parirala rito ay nakatuon sa paglilingkod; hindi dinaragdagan ng pangunahing teksto ang tahasang sinabi.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang “bayan” para sa kolektibong הָעָם, ang talinghagang “puso,” at ang tono ng biglang pagsisisi. Inilagay ang mga talababa sa mismong sugnay na kanilang nililinaw.
