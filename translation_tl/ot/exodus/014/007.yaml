translation:
  language: tl
  text: Kumuha siya ng animnaraang piling karwahe at ng lahat ng karwahe ng Ehipto, na may mga opisyal[a] na namamahala sa lahat ng iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga opisyal ng karwahe.” Ang salitang Hebreo ay maaaring tumukoy sa matataas na ayudanteng militar o mga pinunong kaugnay ng mga karwahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kumuha siya
  rationale: Ang wayyiqtol ng לקח ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang ayos na ito nang hindi dinaragdagan ang diwang wala sa Hebreo.
- source_word: שֵׁשׁ מֵאוֹת
  choice: animnaraan
  rationale: Tuwirang salin ng bilang na anim na raan; ginamit ang modernong anyong tambalan.
- source_word: רֶכֶב
  choice: karwahe
  rationale: Bagaman maaari itong tumukoy nang kolektibo sa hukbong gumagamit ng mga karwahe, malinaw na mabibilang na mga sasakyang pandigma ang tinutukoy dito dahil may tiyak na bilang.
- source_word: בָּחוּר
  choice: piling
  rationale: Ipinahihiwatig ng anyong mula sa בחר na ang mga karwahe ay sadyang pinili o kabilang sa pinakamahusay; maikli at natural ang “piling.”
- source_word: וְכֹל רֶכֶב מִצְרָיִם
  choice: at ng lahat ng karwahe sa Ehipto
  rationale: Ipinakikita ng כֹל at ng construct chain ang kabuuang puwersa ng mga karwahe ng Ehipto, bukod sa animnaraang piling karwahe.
- source_word: וְשָׁלִשִׁם
  choice: na may mga opisyal
  rationale: Isang terminong militar ang שָׁלִשִׁים na maaaring tumukoy sa matataas na kawal, ayudante, o mga pinunong kaugnay ng mga karwahe. Pinananatili ng “mga opisyal” ang lawak ng kahulugan.
- source_word: עַל כֻּלּוֹ
  choice: na namamahala sa lahat ng iyon
  rationale: Bagaman isahan ang hulaping Hebreo, kolektibo ang tinutukoy nitong buong puwersa ng mga karwahe. Ipinahahayag ng salin ang tungkulin ng mga opisyal at ang saklaw nito sa natural na Tagalog.
