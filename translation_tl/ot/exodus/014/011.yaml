base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: tl
  text: At sinabi nila kay Moises, “Dahil ba walang mga libingan sa Ehipto[a] kaya isinama mo kami upang mamatay sa ilang? Ano itong ginawa mo sa amin sa paglalabas mo sa amin mula sa Ehipto?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “Dahil ba sa kawalan ng mga libingan sa Ehipto kaya isinama mo kami upang mamatay sa ilang?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: At sinabi nila kay Moises
  rationale: Ang karaniwang Hebreong pormula sa pagsasalaysay ay likas na isinasalin sa modernong Tagalog bilang “At sinabi nila,” habang ang אֶל ay ipinahahayag ng “kay.”
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Dahil ba walang mga libingan sa Ehipto
  rationale: Pinananatili nito ang mapait at mapanuyang tanong ng Hebreong idyoma sa isang malinaw at likas na anyong Tagalog.
- source_word: לְקַחְתָּנוּ
  choice: kaya isinama mo kami
  rationale: Ang לקח ay “kumuha/dalhin.” Ang “isinama” ay natural sa konteksto ng pag-akay sa isang pangkat at hindi lubos na inuulit ang הוציא na kasunod na isinaling “paglalabas.”
- source_word: לָמוּת בַּמִּדְבָּר
  choice: upang mamatay sa ilang
  rationale: Tuwirang ipinahahayag ng “upang mamatay” ang layon o kinahinatnan ng infinitibo; ang “ilang” ay saklaw ang di-nilinang at tigang na lupain, hindi lamang mabuhanging disyerto.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: Ano itong ginawa mo sa amin
  rationale: Pinananatili ang mariing anyo ng Hebreong tanong sa halip na tahimik itong gawing “Bakit mo ginawa ito?”
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: sa paglalabas mo sa amin mula sa Ehipto
  rationale: Ipinahahayag ng pariralang ito ang kilos na tinutukoy ng reklamo at pinananatili ang pangunahing diwa ng הוציא, “ilabas.”
theological_decisions: []
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Pinanatili ang mapanuyang tono, ang mariing tanong, at ang pagkakaiba ng לקח (“isinama”) at הוציא (“paglalabas”) hangga’t likas sa Tagalog.
