  text: וְ/אָמַ֤ר פַּרְעֹה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל נְבֻכִ֥ים הֵ֖ם בָּ/אָ֑רֶץ סָגַ֥ר עֲלֵי/הֶ֖ם הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/003.yaml
  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: tl
  text: Sapagkat sasabihin ng Paraon tungkol sa mga anak ni Israel[a], “Nalilito sila sa lupain; kinulong sila ng ilang[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “pinaligiran sila ng ilang” o “wala silang malabasan dahil sa ilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Sapagkat sasabihin
  rationale: Ang waw + qatal ay tumutukoy sa inaasahang sasabihin ng Paraon; natural na ipinapahayag sa Filipino ang paliwanag sa pamamagitan ng “Sapagkat” at ang hinaharap sa “sasabihin.”
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Filipino ng titulong Hebreo para sa hari ng Ehipto.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: tungkol sa mga anak ni Israel
  rationale: Maaaring markahan ng ל kasunod ng אמר ang paksa ng pagsasalita. Pinananatili ng “mga anak ni Israel” ang konkretong ekspresyong Hebreo nang hindi ito nililimitahan sa literal na mga anak lamang.
- source_word: נְבֻכִים הֵם בָּאָרֶץ
  choice: Nalilito sila sa lupain
  rationale: Ipinahahayag ng participle ang kalagayan ng pagkalito, pagkaligaw ng direksiyon, o pagkakasilo. Ang “nalilito” ay hindi nagdaragdag ng kilos na paglalagalag na hindi tahasang nasa teksto.
- source_word: סָגַר עֲלֵיהֶם
  choice: kinulong sila
  rationale: Inihahatid nito ang larawang wala silang malabasan o natabingan ang kanilang daan, sa malinaw at likas na Filipino.
- source_word: הַמִּדְבָּר
  choice: ilang
  rationale: Ang מִדְבָּר ay di-nilinang at tigang na pook, hindi kinakailangang mabuhanging disyerto. Ang “ilang” ay maikli, dignified, at angkop sa konteksto ng Exodo.
theological_decisions: []
translation_notes:
  register: Makabago at malinaw na Filipino na may dignidad na angkop sa Kasulatan. Pinanatili ang “mga anak ni Israel” sa pangunahing teksto at ang kalabuan ng נְבֻכִים sa pamamagitan ng payak na “nalilito.”
