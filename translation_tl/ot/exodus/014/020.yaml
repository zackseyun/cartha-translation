- from: Pumagitna ito sa kampo ng Egipto at sa kampo ng Israel. Naroon ang ulap at ang kadiliman, ngunit niliwanagan nito ang gabi.[a] Kaya hindi nakalapit ang isang kampo sa isa pa buong magdamag.
  to: Pumagitna ito sa pagitan ng kampo ng Egipto at ng kampo ng Israel. Naroon ang ulap at ang kadiliman, ngunit niliwanagan nito ang gabi.[a] At hindi nagkalapit ang mga kampo sa isa’t isa buong magdamag.
  rationale: Pinalitan ang “Kaya” ng “At” upang mapanatili ang payak na pagpapatuloy ng Hebreo. Inayos ang panghuling sugnay upang maging likas sa Tagalog habang malinaw na tumutukoy sa dalawang kampo. Binagong muli ang talababa upang mapanatili ang tekstuwal na kalabuan at huwag ipilit ang isang partikular na pamamahagi ng dilim at liwanag.
