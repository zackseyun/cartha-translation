base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: tl
  text: Pumagitna ito sa pagitan ng kampo ng Egipto at ng kampo ng Israel. Naroon ang ulap at ang kadiliman, ngunit niliwanagan nito ang gabi.[a] At hindi nagkalapit ang mga kampo sa isa’t isa buong magdamag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Naroon ang ulap at ang kadiliman, ngunit nagbigay ito ng liwanag sa gabi.” Maikli ang Hebreo, at nagkakaiba ang mga sinaunang bersiyon at mga salin sa pag-unawa kung paano nauugnay ang kadiliman at liwanag sa dalawang kampo.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pumagitna ito
  rationale: Ipinahahayag ang paggalaw tungo sa pagitan ng dalawang kampo. Pinananatili ng “ito” ang hindi tiyak na pagtukoy sa anghel ng Diyos o sa haliging ulap na binanggit sa naunang talata.
- source_word: בֵּין ... וּבֵין
  choice: sa kampo ng Egipto at sa kampo ng Israel
  rationale: Kasama ng pandiwang “pumagitna,” likas nitong ipinahahayag sa Tagalog ang puwang sa pagitan ng dalawang kampo.
- source_word: מַחֲנֵה
  choice: kampo
  rationale: Malinaw at karaniwang salita ito para sa pangkat ng mga tao at sa kanilang himpilan sa kontekstong militar at paglalakbay.
- source_word: מִצְרַיִם ... יִשְׂרָאֵל
  choice: Egipto ... Israel
  rationale: Pinananatili ang anyong “kampo ng Egipto” at “kampo ng Israel” ng Hebreo sa halip na tahasang palitan ng “mga Egipcio” at “mga Israelita.”
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: Naroon ang ulap at ang kadiliman
  rationale: Inilalahad ang maikli at eksistensiyal na sugnay ng Hebreo sa natural ngunit marangal na Tagalog.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: ngunit niliwanagan nito ang gabi
  rationale: Ang pandiwa ay nangangahulugang magbigay-liwanag, at ang “gabi” ang tuwirang layon. Ipinakikita ng “ngunit” ang matinding pagtatambis ng kadiliman at liwanag nang hindi nilulutas kung paano nauugnay ang mga ito sa bawat kampo.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: Kaya hindi nakalapit ang isang kampo sa isa pa
  rationale: Nililinaw ang idyomang “ang isang ito sa isang iyon” sa pamamagitan ng tahasang “kampo,” ang dalawang pangkat na tinutukoy sa konteksto.
- source_word: כָּל־הַלָּיְלָה
  choice: buong magdamag
  rationale: Natural na katumbas sa Tagalog ng buong haba ng gabi.
theological_decisions:
- issue: Ang tinutukoy ng mga pandiwang nasa isahan
  choice: Gamitin ang di-personal na “ito/nito” nang hindi tahasang pinapangalanan ang tinutukoy
  alternative: Gamitin ang “siya” para sa anghel ng Diyos, o idagdag ang “haliging ulap” bilang tahasang simuno
  rationale: Kapuwa binabanggit sa malapit na konteksto ang anghel ng Diyos at ang haliging ulap. Hindi ipinipilit ng Hebreo ang iisang pagtukoy, kaya pinananatili ng salin ang kalabuan.
- issue: Ugnayan ng ulap, kadiliman, liwanag, at dalawang kampo
  choice: Panatilihin sa pangunahing teksto ang maikling pagkakasunod ng ulap, kadiliman, at pagliliwanag sa gabi
  alternative: Tahasang sabihing madilim sa panig ng mga Egipcio at maliwanag sa panig ng Israel
  rationale: Maikli at hindi ganap na tiyak ang Hebreo, at nagkakaiba ang mga sinaunang bersiyon at mga salin sa pag-unawa sa ugnayang ito. Hindi dapat idagdag sa pangunahing teksto ang pamamahagi ng dilim at liwanag sa magkabilang kampo na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kampo,” “pumagitna,” at “buong magdamag” bilang mga salitang madaling maunawaan ng karaniwang mambabasa, habang pinananatili ang maikli at bahagyang mahiwagang anyo ng Hebreo.
