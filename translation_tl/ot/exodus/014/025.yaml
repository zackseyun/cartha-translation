  to: Inalis niya ang gulong ng kanyang mga karwahe[a] at pinatakbo niya ang mga ito nang may hirap. At sinabi ng Ehipto, “Tumakas ako palayo sa Israel,[b] sapagkat nakikipaglaban si Yahweh para sa kanila laban sa Ehipto.”
  rationale: Inayos ang salin upang mas malapit sa pang-isahang “gulong” at sa paglalarawang pinatakbo ang mga karwahe nang may hirap, habang pinananatili ang sinadyang kalabuan ng mga panghalip sa MT. Pinakinis din ang idiomang Filipino para sa pagtakas at pakikipaglaban.
