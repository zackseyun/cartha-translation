base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: tl
  text: Inalis niya ang gulong ng kanyang mga karwahe[a] at pinatakbo niya ang mga ito nang may hirap. At sinabi ng Ehipto, “Tumakas ako palayo sa Israel,[b] sapagkat nakikipaglaban si Yahweh para sa kanila laban sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa tekstong Hebreo, pang-isahan ang “gulong” at ang “kanyang,” bagaman maramihan ang “mga karwahe.” Ang ilang sinaunang saksi ay may diwang “kanilang mga karwahe.”
    reason: Ipinababatid ang pang-isahang anyo ng Masoretikong teksto at ang tekstuwal na pagbasa na maramihan, nang hindi nilulutas ang kalabuan ng mga panghalip.
  - marker: b
    text: Sa tekstong Hebreo, pang-isahan ang “Tumakas ako,” sapagkat ang Ehipto ay inilalarawan bilang isang kolektibong persona; maaari rin itong unawain sa diwang “Tumakas tayo.”
    reason: Pinananatili ang gramatikal na anyo habang nililinaw ang kolektibong kahulugan.
lexical_decisions:
- source_word: וַיָּסַר
  choice: Inalis niya
  rationale: Direktang inililipat ang karaniwang kahulugang ‘inalis’ nang hindi pinapalitan ng tekstuwal na variant na ‘pinabagal’ o ‘binarahan.’
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: ang mga gulong ng kanyang mga karwahe
  rationale: Pinananatili ang anyong pang-isahan ng hulaping Hebreo (‘kanyang’) at natural na ginagawang maramihan sa Filipino ang kolektibong ‘gulong’ ayon sa mga karwahe.
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: kaya nahirapan siyang patakbuhin ang mga iyon
  rationale: Ipinahahayag nang natural ang ideya ng pagpapatakbo o pagmamaneho nang mabigat o mahirap; ang kaugnayang bunga ay malinaw sa konteksto.
- source_word: מִצְרַיִם
  choice: ang Ehipto
  rationale: Pinananatili ang kolektibong personipikasyon ng bansang Ehipto sa Hebreo sa halip na tahimik na gawing ‘mga Ehipsiyo.’
- source_word: אָנ֨וּסָה
  choice: Tatakas ako
  rationale: Pinananatili ang unang panauhang pang-isahan ng cohortative na Hebreo, na tumutugma sa kolektibong ‘Ehipto.’
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos bilang tuwirang representasyon ng Tetragrammaton.
- source_word: נִלְחָם לָהֶם בְּמִצְרָיִם
  choice: ipinaglalaban sila ni Yahweh laban sa Ehipto
  rationale: Pinananatili ang tahasang pahayag na si Yahweh ang nakikipaglaban para sa Israel at laban sa Ehipto.
theological_decisions:
- issue: Referent ng panlalaking pang-isahang hulapi sa ‘kanyang mga karwahe’ at ‘siya’
  choice: Pinanatili ang pang-isahang anyo at nilagyan ng paliwanag sa talababa.
  alternative: 'Gawing maramihan: ‘kanilang mga karwahe’ at ‘sila.’'
  rationale: Pang-isahan ang anyong Masoretiko, ngunit kolektibo ang konteksto at may tekstuwal na patotoo para sa maramihan; hindi dapat ikubli ang tunay na kalabuan.
- issue: Bilang ng nagsasalita sa ‘Tatakas ako’
  choice: Pinanatili ang unang panauhang pang-isahan bilang pananalita ng kolektibong Ehipto.
  alternative: ‘Tumakas tayo’ o ‘Tatakas kami,’ na umaayon sa aktuwal na hukbong Ehipsiyo.
  rationale: Ang anyong Hebreo ay pang-isahan at ang simuno ay ‘Ehipto’; pinananatili nito ang personipikasyon at ang tensiyon sa pagitan ng gramatika at kolektibong kahulugan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “karwahe” para sa sasakyang pandigma, “patakbuhin” para sa natural na paglalarawan ng pagpapaandar nito, at “mula sa harap ng Israel” upang mapanatili ang larawang nasa Hebreo.
