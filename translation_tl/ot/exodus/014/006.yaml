  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: tl
  text: Kaya inihanda niya ang kaniyang karwahe[a] at isinama niya ang kaniyang mga tao[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itinali niya.” Literal na nangangahulugang “itali” o “ikabit” ang pandiwang Hebreo; sa konteksto ng karwahe, tumutukoy ito sa paghahanda nito, malamang sa pagkakabit ng mga hayop na hihila rito.
    reason: lexical_alternative
  - marker: b
    text: Ang “kaniyang mga tao” ay malamang na tumutukoy sa puwersang sumama kay Faraon. “Kaniyang bayan” o “kaniyang mga tao” ang nasa Hebreo, hindi tahasang “kaniyang hukbo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: ipinahanda
  rationale: Ang pandiwang אסר ay literal na “itali” o “ikabit.” Sa konteksto ng karwahe, tumutukoy ito sa pagkakabit ng mga hayop sa karwahe upang maihanda iyon sa paglakad. Ang “ipinahanda” ay natural sa Filipino at hindi nagpapahiwatig na si Faraon mismo ang gumawa nito.
- source_word: רִכְבּוֹ
  choice: ang kaniyang karwahe
  rationale: Bagaman maaaring tumukoy ang רכב sa mga karwahe bilang isang pangkat, ang anyong isahan na may hulaping paari ay pinakamalamang na tumutukoy sa sariling karwahe ni Faraon.
- source_word: עַמּוֹ
  choice: ang kaniyang mga tauhan
  rationale: Karaniwang nangangahulugang “bayan” o “mga tao” ang עם, ngunit sa kontekstong ito ay tumutukoy sa mga taong sumama kay Faraon, malamang na kaniyang puwersang militar. Pinananatili ng “mga tauhan” ang pagiging di-tiyak nang hindi tahasang ginagawang “hukbo.”
- source_word: לָקַח עִמּוֹ
  choice: isinama niya
  rationale: Likas at tuwirang salin ito sa Filipino ng pariralang nangangahulugang “dinala niyang kasama niya.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Ginamit ang “kaniya” sa halip na kolokyal na “niya” sa pariralang paari, at “karwahe” bilang malinaw at pangkaraniwang katawagan. Ang dalawang talababa ay minarkahan sa pangunahing teksto.
