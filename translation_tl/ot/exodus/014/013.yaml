base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: tl
  text: Sinabi ni Moises sa bayan, “Huwag kayong matakot. Manindigan kayo at masdan ninyo ang pagliligtas ng PANGINOON, na gagawin niya para sa inyo ngayon. Sapagkat ang mga Ehipsiyong nakikita ninyo ngayon ay hindi na ninyo muling makikita magpakailanman.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Huwag kayong matakot
  rationale: Tuwirang salin ng pangmaramihang pagbabawal; natural at malinaw sa modernong Tagalog.
- source_word: הִתְיַצְבוּ
  choice: Manindigan kayo
  rationale: Ipinahihiwatig ng pandiwa ang matatag na pagtayo o pananatili sa kinalalagyan; pinananatili ng “manindigan” ang pisikal at matatag na diwa nang hindi ito ginagawang tahasang doktrinal.
- source_word: יְשׁוּעַת יְהוָה
  choice: ang pagliligtas ng PANGINOON
  rationale: Ang “pagliligtas” ay likas na Tagalog para sa konkretong gawa ng pagliligtas dito. Isinalin ang tetragrammaton ayon sa tradisyong gumagamit ng “PANGINOON,” na malinaw na naiiba sa karaniwang titulo.
- source_word: יַעֲשֶׂה לָכֶם
  choice: gagawin niya para sa inyo
  rationale: Pinananatili ang payak na pandiwang “gagawin” at ang benepaktibong diwa ng לָכֶם.
- source_word: מִצְרַיִם
  choice: mga Egipcio
  rationale: Sa konteksto, tumutukoy ito sa mga taong Egipcio, lalo na sa hukbong humahabol, hindi lamang sa bansang Ehipto.
- source_word: לֹא תֹסִיפוּ לִרְאֹתָם עוֹד עַד עוֹלָם
  choice: hindi na ninyo makikita pang muli magpakailanman
  rationale: Pinananatili ang mariing pag-uulit ng Hebreo (“hindi na… muli”) at ang pangwakas na עַד עוֹלָם (“magpakailanman”).
theological_decisions:
- issue: Kung ang יְשׁוּעָה ay isasaling “kaligtasan” o “pagliligtas”
  choice: pagliligtas
  alternative: kaligtasan
  rationale: Ang salaysay ay tumutukoy sa aktuwal na pagliligtas ng Diyos mula sa hukbo ng Ehipto. Iniiwasan ng “pagliligtas” ang di-kinakailangang paglilimita sa terminong teknikal o espirituwal lamang, habang hindi itinatanggi ang mas malawak na teolohikal na kabuluhan nito.
- issue: Paglalahad sa banal na pangalan יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Sinusunod ang ibinigay na konsultasyong salin at ang malawak na nakaugaliang representasyon ng tetragrammaton, nang walang pag-aangkin sa tiyak na sinaunang bigkas.
- issue: Saklaw ng “magpakailanman”
  choice: Pinanatili nang tahasan ang “magpakailanman”
  alternative: hindi na ninyo makikita pang muli
  rationale: Naroon ang עַד עוֹלָם sa tekstong Hebreo at dapat mapanatili ang mariing, absolutong anyo nito sa talata sa halip na pahinain o ipaliwanag sa mismong teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “masdan” upang ipahayag ang utos na maging saksi sa gagawing pagliligtas ng Diyos, at “Manindigan” upang mapanatili ang maikli at mariing himig ng Hebreo.
