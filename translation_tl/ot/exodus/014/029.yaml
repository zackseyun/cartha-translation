  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: tl
  text: Ngunit lumakad ang mga anak ni Israel sa tuyong lupa sa gitna ng dagat,[a] at ang tubig ay naging pader sa kanilang kanan at kaliwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At ang mga Israelita ay lumakad sa tuyong lupa sa gitna ng dagat.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang tubig ay pader para sa kanila”; maaari ring unawaing “parang pader.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Ngunit … ang mga anak ni Israel
  rationale: Ang וּ ay ginawang “Ngunit” dahil ipinakikita ng sugnay ang kaibahan ng ligtas na pagtawid ng Israel sa sinapit ng mga Ehipsiyo. Ang “mga anak ni Israel” ay nagpapanatili sa pampamilya at pambansang ekspresyon ng Hebreo; ang “anak” sa Tagalog ay hindi nakatali sa kasarian.
- source_word: הָלְכוּ
  choice: lumakad
  rationale: Karaniwang kahulugan ng הלך ang paglakad o pagpunta; malinaw na inilalarawan ng “lumakad” ang pagtawid nila sa dagat.
- source_word: בַיַּבָּשָׁה
  choice: sa tuyong lupa
  rationale: Ang יַבָּשָׁה ay tuyong lupa o lupang tuyo. Likas sa modernong Tagalog ang pariralang ito at itinatampok nito ang kalagayan ng dinaanan nila.
- source_word: בְּתוֹךְ הַיָּם
  choice: sa gitna ng dagat
  rationale: Pinananatili nito ang malinaw na diwang panlunan ng בְּתוֹךְ at natural itong pakinggan sa Tagalog.
- source_word: וְהַמַּיִם
  choice: at ang tubig
  rationale: Bagaman anyong maramihan ang מַיִם sa Hebreo, likas na pangngalang di-mabilang ang “tubig” sa Tagalog at sapat nitong naihahatid ang kolektibong larawan.
- source_word: לָהֶם חֹמָה
  choice: ay pader para sa kanila
  rationale: Direktang pinananatili ang metaporang “pader” at ang kaugnayang ipinahahayag ng לָהֶם, nang hindi nagdaragdag ng tahasang pantulad na wala sa Hebreo.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: sa kanilang kanan at sa kanilang kaliwa
  rationale: Pinananatili ang balanseng pagkakahanay ng dalawang panig sa Hebreo at malinaw ito sa kasalukuyang Tagalog.
theological_decisions:
- issue: Pagpapahayag sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang pampamilya at pambansang idyoma ng Hebreo. Hindi rin ito lumilikha ng di-kinakailangang pagkiling sa kasarian dahil neutral sa kasarian ang salitang Tagalog na “anak.”
- issue: Kung literal o pantulad ang חֹמָה
  choice: pader
  alternative: parang pader
  rationale: Walang tahasang katagang pantulad sa tekstong Hebreo. Kaya pinananatili sa pangunahing teksto ang mas matibay na metapora, habang inilalagay sa talababa ang posibleng pantulad na pagkaunawa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang maikli at balanseng ayos ng salaysay at ang tuwirang larawan ng tubig bilang pader.
