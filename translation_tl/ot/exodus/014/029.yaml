  to: Ngunit lumakad ang mga anak ni Israel sa tuyong lupa sa gitna ng dagat,[a] at ang tubig ay naging pader sa kanilang kanan at kaliwa.[b]
  rationale: Inayos ang huling sugnay upang maging malinaw at likas sa modernong Tagalog ang larawan ng tubig bilang pader sa magkabilang panig. Ang “naging pader” ay idiomatikong naghahayag ng predikasyong Hebreo (“ang tubig [ay] pader”) sa nakaraang salaysay, nang hindi idinaragdag ang pantulad na “parang” sa pangunahing teksto. Napanatili ang mga talababa at ang kanilang mga angkla.
