  source_fidelity: Tumpak ang tuwirang pagkilos ng Diyos sa “pinatitigas ko” at ang kolektibong isahang “puso.” Gayunman, ang “sa pamamagitan ng Faraon” ay masyadong instrumental at hindi sapat na naihahayag ang diwa ng paghatol/tagumpay laban kay Faraon sa paggamit ng בְּ kasama ng כבד sa kontekstong ito. Ang “sumunod sila sa kanila papasok doon” ay hindi likas at ang “doon” ay walang malinaw na tinutukoy.
  naturalness: Marangal ang rehistro, ngunit mas natural at malinaw ang “pumasok silang kasunod nila” kaysa “sumunod sila sa kanila papasok doon.” Ang “magkakamit ako ng kaluwalhatian laban kay Faraon” ay malinaw na modernong Tagalog at angkop sa konteksto ng paghatol.
  terminology: Nananatiling angkop ang “Faraon,” “hukbo,” “mga karwahe,” at “mga mangangabayo.” Pinananatili ang “kaluwalhatian” para sa כבד sa pormulasyong nagpapahayag ng banal na karangalan sa pamamagitan ng paghatol.
  issues:
