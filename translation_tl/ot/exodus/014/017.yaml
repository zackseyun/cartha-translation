language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִ֤י מְחַזֵּק֙ אֶת לֵ֣ב מִצְרַ֔יִם וְ/יָבֹ֖אוּ אַחֲרֵי/הֶ֑ם וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ בְּ/רִכְבּ֖/וֹ וּ/בְ/פָרָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: tl
  text: At ako—narito[a]—pinatitigas ko ang puso ng mga Ehipsiyo upang pumasok silang kasunod nila. At magkakamit ako ng kaluwalhatian laban kay Faraon at sa buo niyang hukbo, sa kaniyang mga karwahe at mga mangangabayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Tunay ngang ako.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: At ako—narito
  rationale: Pinananatili ng “narito” at ng gitling ang mariing pagtukoy ng Diyos sa kaniyang sariling pagkilos, habang nananatiling marangal at nauunawaan sa modernong Tagalog.
- source_word: מְחַזֵּק
  choice: pinatitigas ko
  rationale: Ang Piel participle ng חזק ay nagpapahayag dito ng nagpapatuloy o nalalapit na tuwirang pagkilos ng Diyos na patigasin ang pasiya ng mga Ehipsiyo; hindi ito pinalalambot bilang pahintulot lamang.
- source_word: לֵב מִצְרַיִם
  choice: ang puso ng mga Ehipsiyo
  rationale: Pinananatili ang isahang “puso” ng Hebreo, na ginagamit nang kolektibo para sa mga Ehipsiyo. Likas din sa Tagalog ang ganitong kolektibong gamit.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: upang sumunod sila sa kanila papasok doon
  rationale: Ipinakikita ng “upang” ang layunin o bunga ng pagpapatigas, at nililinaw ng “papasok doon” ang pagpasok ng mga Ehipsiyo sa dinaanan ng Israel sa dagat nang hindi tahasang idinaragdag ang salitang “dagat.”
- source_word: וְאִכָּבְדָה
  choice: luluwalhatiin ako
  rationale: Ang Niphal na anyo ay natural na naihahayag sa Tagalog bilang pagtanggap ng Diyos ng luwalhati. Pinananatili nito ang pasibo o resultang diwa at ang solemne ngunit kasalukuyang gamit ng wika.
- source_word: בְּפַרְעֹה
  choice: sa pamamagitan ng Faraon
  rationale: Ang בְּ ay maaaring magpahiwatig ng paraan o larangan kung saan mahahayag ang kaluwalhatian ng Diyos. Ang saling ito ay nagpapanatili ng ugnayan sa hatol kay Faraon nang hindi pinipilit ang diwang lokatibo.
- source_word: חֵילוֹ
  choice: buo niyang hukbo
  rationale: Sa kontekstong militar, ang חַיִל ay tumutukoy sa sandatahang lakas; “hukbo” ang malinaw at marangal na katumbas.
- source_word: רִכְבּוֹ
  choice: kaniyang mga karwahe
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang kahulugan nito rito; ang maramihang “mga karwahe” ay mas natural sa Tagalog.
- source_word: פָרָשָׁיו
  choice: kaniyang mga mangangabayo
  rationale: Tumutukoy ito sa mga mandirigmang nakasakay sa kabayo; ang “mangangabayo” ay kongkreto, malinaw, at angkop sa larawang militar.
theological_decisions:
- issue: Tuwirang pagkilos ng Diyos sa pagpapatigas sa mga Ehipsiyo
  choice: “pinatitigas ko” upang tahasang ipahayag ang pagkilos ng Diyos
  alternative: “hinahayaan kong tumigas” o “pinalalakas ko”
  rationale: Tuwirang iniuugnay ng Hebreo sa Diyos ang pagpapatigas. Pinananatili ng salin ang tensiyon sa pagitan ng soberanong pagkilos ng Diyos at pananagutan ng tao sa halip na lutasin iyon sa pamamagitan ng pagpapalambot sa pandiwa.
- issue: Pagpapahayag ng כבד sa konteksto ng paghatol
  choice: “luluwalhatiin ako sa pamamagitan ng Faraon”
  alternative: “magtatamo ako ng kaluwalhatian laban kay Faraon”
  rationale: Kapuwa maaaring ipahayag ng mga saling ito ang karangalang mahahayag sa paghatol. Pinili ang mas likas na Tagalog na pasibong pahayag, habang kinikilala sa talababa ang posibleng diwa ng tagumpay laban kay Faraon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang kolektibong isahang “puso,” ang tuwirang banal na pagkilos, at ang bahagyang ambiguwidad ng pang-ukol בְּ. Ang “Faraon” at “mangangabayo” ay pormal ngunit karaniwan sa saling biblikal; iniwasan ang mas teknikal na “kabalerya.”
