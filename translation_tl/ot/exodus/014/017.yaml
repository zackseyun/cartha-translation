    issue: Ang “sa pamamagitan ng Faraon” ay kulang sa diwang adversatibo/judicial ng parirala.
    rationale: Sa Exodo 14:17, ang Diyos ay magkakamit o mahahayag na maluwalhati laban kay Faraon at sa hukbo nito. Maaaring maging posible sa ibang konteksto ang instrumental na “sa pamamagitan ng,” ngunit dito ay maaari nitong pahinain ang pagpapakitang-hatol at tagumpay na nasa teksto.
  - severity: medium
    issue: Hindi likas at malabo ang “upang sumunod sila sa kanila papasok doon.”
    rationale: Ang “doon” ay deiktikong walang tuwirang reperente, at hindi natural ang pagkakasunod ng “sumunod ... papasok.” Ang “upang pumasok silang kasunod nila” ay pinananatili ang pagpasok at pagsunod nang walang pagdaragdag ng “dagat.”}],
