base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: tl
  text: Pumasok ang mga Israelita[a] sa gitna ng dagat sa tuyong lupa, at ang tubig ay pader para sa kanila sa kanilang kanan at kaliwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pumasok
  rationale: Ang בוא sa kontekstong ito ay tumutukoy sa pagpasok sa isang lugar. Likas sa salaysay na Filipino ang “pumasok” at hindi nito ipinapalagay na natawid na nila ang buong dagat.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita[a]
  rationale: Ang idyomatikong Hebreo ay literal na “mga anak na lalaki ni Israel” ngunit tumutukoy sa bayang Israel. Mas malinaw at likas sa modernong Filipino ang “mga Israelita,” habang inilalahad sa talababa ang literal na anyo.
- source_word: בְּתוֹךְ הַיָּם
  choice: sa gitna ng dagat
  rationale: Tuwirang inilalarawan ng בְּתוֹךְ ang kinalalagyan sa loob o gitna ng dagat. Hindi ginamit ang “tumawid” sapagkat higit iyon sa tahasang sinasabi ng sugnay na ito.
- source_word: בַּיַּבָּשָׁה
  choice: sa tuyong lupa
  rationale: Ang יַבָּשָׁה ay tuyong lupa na kabaligtaran ng tubig. Pinananatili ng salin ang kongkretong larawan ng tuyong daraanan sa gitna ng dagat.
- source_word: וְהַמַּיִם
  choice: at ang tubig
  rationale: Bagaman maramihan ang anyong Hebreo, karaniwang pangngalang di-mabilang ang “tubig” sa Filipino at likas itong tumutukoy sa tubig sa magkabilang panig.
- source_word: חֹמָה
  choice: ay naging pader
  rationale: Ang חֹמָה ay tuwirang “pader,” at walang tahasang panandang paghahambing na katumbas ng “parang.” Idinagdag ang “naging” upang maging natural ang panaguri sa Filipino at maipahayag ang kalagayan ng tubig sa tagpong ito.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: sa kanan at kaliwa nila
  rationale: Pinananatili nito ang magkatimbang na paglalarawan ng tubig sa magkabilang panig, sa maikli at natural na ayos sa Filipino.
theological_decisions:
- issue: Kung literal o paghahambing ang paglalarawan sa tubig bilang pader
  choice: “ang tubig ay naging pader”
  alternative: “ang tubig ay parang pader”
  rationale: Walang katagang paghahambing sa Hebreo. Kaya pinanatili ang tuwirang metapora sa halip na pahinain ito sa pamamagitan ng “parang,” nang hindi nagdaragdag ng paliwanag tungkol sa mekanismo ng pangyayari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Ang “mga Israelita” ay mas natural kaysa sa literal na “mga anak na lalaki ni Israel,” samantalang pinananatili ng “sa gitna ng dagat” at “pader” ang kongkreto at masidhing larawan ng Hebreo.
