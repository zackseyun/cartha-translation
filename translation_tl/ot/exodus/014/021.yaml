  to: Pagkatapos, iniunat ni Moises ang kanyang kamay sa ibabaw ng dagat[a]. Buong magdamag, pinaurong ni Yahweh ang dagat[b] sa pamamagitan ng isang malakas na hanging silangan[c], at ginawa niyang tuyong lupa ang dagat[d]. Nabiyak ang tubig[e].
