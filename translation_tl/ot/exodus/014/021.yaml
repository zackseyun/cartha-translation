base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: tl
  text: Pagkatapos, iniunat ni Moises ang kanyang kamay sa ibabaw ng dagat[a]. Buong magdamag, pinaurong ni Yahweh ang dagat[b] sa pamamagitan ng isang malakas na hanging silangan[c], at ginawa niyang tuyong lupa ang dagat[d]. Nabiyak ang tubig[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘patungo sa dagat’ o ‘sa dagat.’
    reason: lexical_alternative
  - marker: b
    text: 'Mas literal: ‘pinayaon ni Yahweh ang dagat.’'
    reason: lexical_alternative
  - marker: c
    text: Maaari ring ‘sa pamamagitan ng isang napakalakas na hanging silangan.’
    reason: lexical_alternative
  - marker: d
    text: Maaari ring ‘ginawang tuyong lupain ang dagat’ o ‘ginawang tuyong lupa ang kinaroroonan ng dagat.’
    reason: lexical_alternative
  - marker: e
    text: Maaari ring ‘Nahati ang tubig.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: iniunat
  rationale: Ang נָטָה na may layong ‘kamay’ ay karaniwang tumutukoy sa pag-unat o pag-abot nito; natural at tuwiran sa modernong Tagalog ang ‘iniunat.’
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Pinananatili ang isahang pangngalan at ang malinaw na pagmamay-ari sa Hebreo.
- source_word: עַל הַיָּם
  choice: sa ibabaw ng dagat
  rationale: Maaaring mangahulugang ‘sa ibabaw,’ ‘sa,’ o ‘laban sa’ ang עַל. Sa kilos ng pag-unat ng kamay, malinaw at natural ang ‘sa ibabaw ng dagat.’
- source_word: וַיּוֹלֶךְ יְהוָה אֶת הַיָּם
  choice: itinaboy ni Yahweh ang dagat
  rationale: Ang Hiphil ng הָלַךְ ay causative, kaya literal na ‘pinayaon/pinaurong.’ Ipinahahayag ng ‘itinaboy’ ang puwersahang pagpapaurong sa dagat nang hindi dinaragdagan ang mekanismo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang יהוה sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: sa pamamagitan ng isang malakas na hangin mula sa silangan
  rationale: Dito, ang רוּחַ ay ‘hangin’ dahil inilalarawan itong mula sa silangan at siyang kasangkapan sa pagpapaurong ng dagat. Natural sa Tagalog ang ‘hangin mula sa silangan.’
- source_word: כָּל הַלַּיְלָה
  choice: buong magdamag
  rationale: Maikli at likas na salin na pinananatili ang tagal ng pangyayari.
- source_word: וַיָּשֶׂם אֶת הַיָּם לֶחָרָבָה
  choice: ginawa niyang tuyong lupa ang dagat
  rationale: Ang חָרָבָה ay tuyong lupa o tuyong lupain. Pinananatili ng ayos na ito ang ‘dagat’ bilang tuwirang layon at ang lakas ng pahayag sa Hebreo.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: Nahati ang tubig
  rationale: Ang Niphal ng בָּקַע ay nagsasaad na nabiyak o nahati ang tubig. Ang ‘nahati’ ay malinaw at hindi nagpapalagay kung sino ang tahasang gumaganap sa sugnay.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa teksto sa halip na palitan ito ng isang titulo.
- issue: Ugnayan ng hangin at ng paghahati ng tubig
  choice: Pinanatiling magkasunod ang pagpapaurong sa dagat sa pamamagitan ng hangin, ang pagiging tuyong lupa nito, at ang pagkahati ng tubig
  alternative: Ipaliwanag na ang hangin lamang ang ganap na sanhi ng paghahati
  rationale: Ipinakikilala ng Hebreo si Yahweh bilang kumikilos sa pamamagitan ng hangin, ngunit hindi nito hinihinging lutasin sa salin ang lahat ng detalye ng mekanismo. Kaya hindi dinagdagan ang teksto ng paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang maiikling pangungusap upang maging likas sa Tagalog habang pinananatili ang sunod-sunod na kilos ng tekstong Hebreo. Hindi ginamit ang mas arkaikong ‘silanganang hangin’ o ‘kalupaan,’ at pinanatili ang pangalang ‘Yahweh.’
