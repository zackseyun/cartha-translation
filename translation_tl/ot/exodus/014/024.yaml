base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: tl
  text: Sa pagbabantay sa madaling-araw, tumingin si Yahweh sa kampo ng mga Ehipsiyo mula sa haliging apoy at ulap[a], at ginulo niya ang kampo ng mga Ehipsiyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng haliging apoy at ulap.”
    reason: lexical_alternative
  - marker: b
    text: O “pinataranta niya ang kampo ng mga Ehipsiyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: Nang panahon ng pagbabantay sa madaling-araw
  rationale: Tumutukoy ang parirala sa huling yugto ng pagbabantay sa gabi habang papalapit ang umaga. Ang “madaling-araw” ay natural sa makabagong Tagalog at pinananatili ang tiyak na panahong tinutukoy.
- source_word: וַיַּשְׁקֵף
  choice: tumingin ... mula sa
  rationale: Ang pandiwa ay nagpapahiwatig ng pagtingin mula sa isang kinaroroonan o mataas na puwesto. Kasama ng kasunod na pariralang may בְּ, malinaw at natural sa Tagalog ang “tumingin ... mula sa.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalang Yahweh ang Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: kampo ng mga Ehipsiyo
  rationale: Natural itong tumutukoy sa kampong militar ng mga Ehipsiyo at malapit sa anyo ng pariralang Hebreo.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: mula sa haliging apoy at ulap
  rationale: Maaaring lokatibo o instrumental ang בְּ. Pinili sa teksto ang lokatibong diwa, na ang pagtingin ni Yahweh ay mula sa haligi, habang inilalahad sa talababa ang posibleng instrumental na pagbasa.
- source_word: וַיָּהָם
  choice: ginulo niya
  rationale: Pinananatili ng “ginulo” ang causative na diwa ng paglikha ng kaguluhan o pagkalito nang hindi ipinapalagay na lubusan nang natalo o nagapi ang hukbo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng isang titulo.
- issue: Paraan ng pagkilos ni Yahweh kaugnay ng haliging apoy at ulap
  choice: mula sa haliging apoy at ulap
  alternative: sa pamamagitan ng haliging apoy at ulap
  rationale: Maaaring ipahiwatig ng pang-ukol na בְּ ang kinaroroonan o kasangkapan. Hindi nilulutas nang tahimik ang ambiguwidad; nasa pangunahing teksto ang lokatibong pagbasa at nasa talababa ang instrumental na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “madaling-araw” upang madaling maunawaan ang sinaunang yugto ng pagbabantay, at pinanatili ang pag-uulit ng “kampo ng mga Ehipsiyo” ayon sa diin at estruktura ng Hebreo.
