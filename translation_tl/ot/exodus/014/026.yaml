  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay sa ibabaw ng dagat, upang bumalik[a] ang tubig sa ibabaw ng mga Ehipsiyo, ng kanilang mga karwahe, at ng kanilang mga mangangabayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at babalik ang tubig sa ibabaw ng mga Ehipsiyo, ng kanilang mga karwahe, at ng kanilang mga mangangabayo.” Maaaring isalin nang mas literal ang pandiwang Hebreo bilang payak na panghinaharap, ngunit malamang na ipinapahayag nito rito ang nilalayong resulta ng utos kay Moises.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural na ipinahahayag ito ng “Pagkatapos” sa makabagong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Iunat mo ang iyong kamay
  rationale: Tuwirang inilalarawan ng pautos ang pag-uunat ng kamay ni Moises; malinaw at natural ang parirala sa Tagalog.
- source_word: עַל־הַיָּם
  choice: sa ibabaw ng dagat
  rationale: Ipinapahayag nito ang kilos ng pag-uunat ng kamay sa ibabaw o dako ng dagat nang hindi ginagawang higit na tiyak ang direksiyon kaysa sa Hebreo.
- source_word: וְיָשֻׁבוּ
  choice: upang bumalik
  rationale: Sa kasunod ng pautos, maaaring ipahayag ng pandiwa ang nilalayong resulta ng kilos. Pinananatili sa talababa ang mas literal na pagbasa bilang payak na panghinaharap.
- source_word: הַמַּיִם
  choice: ang tubig
  rationale: Bagaman anyong maramihan ang Hebreo, karaniwang pangngalang di-mabilang ang “tubig” sa natural na Tagalog at sapat nitong tinutukoy ang tubig ng dagat.
- source_word: עַל מִצְרַיִם
  choice: tabunan ang mga Ehipsiyo
  rationale: Ipinahihiwatig ng עַל sa konteksto na babalik ang tubig sa ibabaw ng mga Ehipsiyo. Natural na naihahatid ng “tabunan” ang larawang ito nang hindi ginagawang abstraktong “laban sa.”
- source_word: עַל רִכְבּוֹ
  choice: ang kanilang mga karwaheng pandigma
  rationale: Ang רֶכֶב dito ay tumutukoy sa mga karwaheng ginagamit sa labanan. Isinalin sa maramihang pag-aari dahil kolektibo ang tinutukoy na mga Ehipsiyo.
- source_word: וְעַל פָּרָשָׁיו
  choice: at ang kanilang mga mangangabayo
  rationale: Tuwirang tumutukoy ang פָּרָשִׁים sa mga nakasakay sa kabayo; mas tiyak at madaling maunawaan ang “mga mangangabayo” kaysa sa teknikal na “kabalyerya.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng pautos at ng וְיָשֻׁבוּ
  choice: upang bumalik
  alternative: at babalik
  rationale: Malamang na ipinahahayag rito ng pandiwang kasunod ng pautos ang nilalayong resulta, ngunit tunay na posible rin ang mas literal na payak na panghinaharap; kaya hindi inaalis ang alternatibo at inilalagay ito sa talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “karwaheng pandigma” upang malinaw na maiba ang sasakyang militar sa karaniwang karwahe, at “mangangabayo” bilang natural na tawag sa mga nakasakay na mandirigma.
