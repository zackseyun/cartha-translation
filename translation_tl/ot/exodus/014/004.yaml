  to: At patitigasin ko ang puso ng Paraon[a], at hahabulin niya sila; magkakamit ako ng kaluwalhatian laban kay Paraon at sa buong hukbo niya[b], at malalaman ng mga Ehipsiyo na ako si Yahweh.” At ginawa nila iyon.
  rationale: Pinalitan ang di-idiomatikong “luluwalhatiin ako laban sa” ng “magkakamit ako ng kaluwalhatian laban kay Paraon,” na natural sa Tagalog at pinananatili ang ipinahihiwatig na pagkakamit ni Yahweh ng kaluwalhatian sa kanyang tagumpay laban kay Paraon at sa hukbo nito. Inayos din ang pangwakas na sugnay upang hindi magdagdag ng diin na wala sa pinagmulan, at ginawang “ni Paraon” ang anyo sa talababa para sa wastong gamit sa pangalan ng tao.
