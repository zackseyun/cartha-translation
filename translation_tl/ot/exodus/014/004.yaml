base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: tl
  text: At patitigasin ko ang puso ng Paraon[a], at hahabulin niya sila; magkakamit ako ng kaluwalhatian laban kay Paraon at sa buong hukbo niya[b], at malalaman ng mga Ehipsiyo na ako si Yahweh.” At ginawa nila iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papatatagin ko ang puso ng Paraon.” Ang pandiwang Hebreo ay maaaring mangahulugang gawing matatag o matibay; sa konteksto ng Exodo, nahahayag ang katatagang ito bilang pagmamatigas.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “luluwalhatiin ako sa pamamagitan ni Paraon at ng buong hukbo niya.” Ang pananalitang Hebreo ay tumutukoy sa pagtatamo ni Yahweh ng karangalan o kaluwalhatian kaugnay ni Paraon at ng buong hukbo niya sa mga susunod na pangyayari.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: patitigasin ko
  rationale: Tuwirang ipinapahayag ng Hiphil na si Yahweh ang sanhi ng pagpapatatag ng loob ng Paraon; sa konteksto, ang katatagang ito ay pagmamatigas, kaya natural ang “patitigasin.”
- source_word: לֵב
  choice: puso
  rationale: Pinananatili ang biblikal na idyoma para sa sentro ng pag-iisip, pagpapasya, at kalooban.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: hahabulin niya sila
  rationale: Natural at malinaw na Filipino para sa militar na pagtugis.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: luluwalhatiin ako laban sa Paraon
  rationale: Ang Niphal na anyo ay nagpapahiwatig na tatanggap si Yahweh ng kaluwalhatian, at ang “laban sa” ay nagpapanatili sa konteksto ng tagumpay at paghatol kaugnay ng Paraon.
- source_word: וּבְכָל חֵילוֹ
  choice: at sa buong hukbo niya
  rationale: Ang חַיִל dito ay tumutukoy sa puwersang militar ng Paraon; “hukbo” ang malinaw at marangal na katumbas.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: at malalaman ng mga Ehipsiyo
  rationale: Ang pangmaramihang pandiwa ay natural na tumutukoy sa mga mamamayan ng Ehipto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: At gayon nga ang ginawa nila
  rationale: Natural na pangwakas na pahayag na nagsasaad na isinagawa nila ang iniutos.
theological_decisions:
- issue: Pagkilos ng Diyos sa pagmamatigas ng puso ng Paraon
  choice: “patitigasin ko ang puso ng Paraon” bilang tuwirang pagsanhi ng Diyos
  alternative: “papatatagin ko ang puso ng Paraon” o “hahayaan kong tumigas ang puso ng Paraon”
  rationale: Si Yahweh ang tahasang simuno ng Hiphil sa Hebreo. Hindi ito dapat pahinain bilang pahintulot lamang, ngunit ang posibleng leksikal na diwa ng pagpapatatag ay itinatala sa talababa.
- issue: Kahulugan ng כבד sa konteksto ng paghatol
  choice: “luluwalhatiin ako laban sa Paraon”
  alternative: “luluwalhatiin ako sa pamamagitan ng Paraon”
  rationale: Pinananatili nito ang pasibo/reflexive na diwa ng pandiwa at ang tensiyon ng pagtatamo ng kaluwalhatian ni Yahweh sa Kaniyang tagumpay laban sa Paraon, nang hindi nilulutas nang labis ang saklaw ng pang-ukol.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang biblikal na “puso,” ang pangalang “Yahweh,” at ang tahasang banal na pagsanhi. Ginamit ang “luluwalhatiin ako” upang katawanin ang anyong pasibo/reflexive ng Hebreo, habang ipinapakita sa talababa ang tunay na kalabuan ng pang-ukol.
