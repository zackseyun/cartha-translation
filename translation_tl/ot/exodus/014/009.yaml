- from: Hinabol sila ng mga Ehipsiyo at inabutang nagkakampo sa tabi ng dagat. Naroon ang lahat ng kabayo at mga karwahe ng Faraon, ang kanyang mga mangangabayo, at ang kanyang hukbo, malapit sa Pi-hahirot, sa harap ng Baal-zefon.[a]
  to: Hinabol sila ng mga Ehipsiyo at inabutan habang nagkakampo sa tabi ng dagat—lahat ng kabayo at mga karwahe ni Faraon, ang kanyang mga mangangabayo, at ang kanyang hukbo—sa Pi-hahirot, sa harap ng Baal-zefon.[a]
