  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: tl
  text: Hinabol sila ng mga Ehipsiyo at inabutan habang nagkakampo sa tabi ng dagat—lahat ng kabayo at mga karwahe ni Faraon, ang kanyang mga mangangabayo, at ang kanyang hukbo—sa Pi-hahirot, sa harap ng Baal-zefon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa tapat ng Baal-zefon.” Maaaring tumukoy ang pariralang Hebreo sa isang lugar na nakaharap sa isang palatandaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ מִצְרַיִם אַחֲרֵיהֶם
  choice: Hinabol sila ng mga Ehipsiyo
  rationale: Ang רדף ay karaniwang nangangahulugang humabol o tumugis. Natural at malinaw sa kontekstong militar ang “hinabol,” at ang “mga Ehipsiyo” ang hinihingi ng maramihang pandiwa at ng konteksto.
- source_word: וַיַּשִּׂיגוּ אוֹתָם חֹנִים
  choice: inabutang nagkakampo
  rationale: Ang נשׂג ay “umabot/inabutan,” at ang participle na חֹנִים ay naglalarawan sa kalagayan ng mga Israelita nang maabutan sila. Pinananatili ng parirala ang sabayang pangyayari sa natural na Tagalog.
- source_word: עַל הַיָּם
  choice: sa tabi ng dagat
  rationale: Lokasyonal dito ang עַל; ang “sa tabi ng dagat” ay malinaw at likas na Tagalog nang hindi ginagawang pantanging pangalan ang karaniwang pangngalan.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: ang lahat ng kabayo at mga karwahe ng Faraon
  rationale: Siksik at kolektibo ang pariralang Hebreo. Inilalahad ito bilang kabayo at mga karwahe upang maging natural at madaling maunawaan sa Tagalog habang pinananatili ang kabuuang saklaw ng כָּל.
- source_word: וּפָרָשָׁיו
  choice: ang kanyang mga mangangabayo
  rationale: Ang פָּרָשִׁים ay mga nakasakay na kawal o mangangabayo. Mas tuwiran at mas madaling maunawaan ang “mga mangangabayo” kaysa sa teknikal na “kabalyerya.”
- source_word: וְחֵילוֹ
  choice: at ang kanyang hukbo
  rationale: Sa kontekstong ito, ang חַיִל ay tumutukoy sa puwersang militar; “hukbo” ang malinaw at marangal na katumbas.
- source_word: עַל פִּי הַחִירֹת
  choice: malapit sa Pi-hahirot
  rationale: Lokasyonal ang ekspresyon at tumutukoy sa lugar na Pi-hahirot. Natural sa Tagalog ang “malapit sa” para sa posisyong nasa tabi o kinaroroonan nito.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: sa harap ng Baal-zefon
  rationale: Ang לִפְנֵי ay maaaring mangahulugang nasa harap o nakatapat sa isang palatandaan. Pinananatili ng “sa harap ng” ang malawak na lokasyonal na diwa, habang inilalagay sa talababa ang mas tiyak na alternatibo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, dignificado, at madaling maunawaan. Ginamit ang “Faraon,” “Pi-hahirot,” at “Baal-zefon” bilang likas na anyong Tagalog ng mga pantanging pangalan. Hinati sa dalawang pangungusap ang mahabang Hebreong sugnay upang maging mas malinaw ang listahan ng mga puwersang Ehipsiyo nang hindi binabago ang ugnayan ng mga detalye.
