base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: tl
  text: 'Hindi ba ito ang sinabi namin sa iyo sa Ehipto: ‘Tigilan mo kami, at hayaan mo kaming maglingkod sa mga Ehipsiyo’? Sapagkat mas mabuti para sa amin ang maglingkod sa mga Ehipsiyo kaysa mamatay sa ilang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: ang sinabi
  rationale: Sa kontekstong ito, ang literal na ‘salita/bagay’ ay tumutukoy sa pahayag na dati nilang sinabi; natural at tumpak sa Filipino ang ‘ang sinabi.’
- source_word: חֲדַל מִמֶּנּוּ
  choice: Pabayaan mo kami
  rationale: Ang idyoma ay panawagang huwag silang pakialaman o panghimasukan; ‘Pabayaan mo kami’ ang malinaw at likas na katumbas.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: upang makapaglingkod kami sa mga Ehipsiyo
  rationale: Pinananatili ang layuning ipinahihiwatig ng magkakaugnay na mga sugnay at ang diwang sapilitang paglilingkod; ang ‘Ehipto’ rito ay metonimikong tumutukoy sa mga Ehipsiyo.
- source_word: כִּי טוֹב לָנוּ עֲבֹד
  choice: Mas mabuti pa sana para sa amin ang maglingkod
  rationale: Ang ‘sana’ ay angkop sa di-makatotohanang paghahambing matapos silang makaalis na sa Ehipto, nang hindi binabago ang reklamo ng mga nagsasalita.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang ‘ilang’ ay maikli, dignidad, at karaniwang salin para sa di-tinitirhang ilang na lupain, hindi kinakailangang buhangin lamang.
theological_decisions:
- issue: Paglalarawan sa dating kalagayan ng Israel sa Ehipto
  choice: maglingkod sa mga Ehipsiyo
  alternative: magpaalipin sa mga Ehipsiyo
  rationale: Ang Hebreong עבד ay maaaring tumukoy sa paglilingkod o pagkaalipin. Pinili ang mas malawak na ‘maglingkod’ upang mapanatili ang leksikal na anyo at hindi dagdagan ang tahasang terminong ‘alipin,’ habang malinaw sa konteksto ang mapaniil na kalagayan.
- issue: 'Anyo ng paghahambing: paglilingkod o kamatayan'
  choice: Mas mabuti pa sana
  alternative: Mas mabuti
  rationale: Ipinahahayag ng ‘sana’ ang kontrapaktuwal na pananaw ng mga nagrereklamo sa kasalukuyang kalagayan, ngunit hindi nito ipinapakitang sinasang-ayunan ng tagapagsalaysay ang kanilang pagtataya.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang tuwirang pananalita at payak na sintaks upang manatiling malinaw sa karaniwang mambabasa. Walang footnote dahil walang mahalagang tekstuwal o leksikal na kalabuan na kailangang ilagay sa mismong publikasyong teksto.
