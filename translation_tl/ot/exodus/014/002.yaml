id: EXO.14.2
reference: Exodus 14:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: tl
  text: Sabihin mo sa mga anak ni Israel[a] na bumalik sila at magkampo sa harap ng Pi-hahirot, sa pagitan ng Migdol at ng dagat. Sa harap ng Baal-zefon, sa tapat nito,[b] magkampo kayo sa tabi ng dagat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nakaharap dito.” Ang “nito” ay malamang na tumutukoy sa Baal-zefon.
    reason: lexical_alternative
  - marker: c
    text: Ang Pi-hahirot, Migdol, at Baal-zefon ay mga pangalang-pook, kaya tinumbasan ang mga tunog ng mga ito sa halip na isalin ang kahulugan.
    reason: cultural_note
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Sabihin mo sa
  rationale: Ang Piel imperative na דַּבֵּר, kasama ng אֶל, ay isang tuwirang utos kay Moises. Mas natural sa makabagong Tagalog ang “Sabihin mo sa” kaysa “Magsalita ka sa” sa ganitong pormula ng paghahatid ng utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at pampamilyang Hebreong pahayag. Ang “mga Israelita” ay mas idyomatiko, kaya inilagay bilang alternatibo sa talababa.
- source_word: וְיָשֻׁבוּ
  choice: na bumalik sila
  rationale: Ang jussive na kasunod ng pautos ay naghahayag ng ipinag-uutos na pagkilos. Ipinakikita ng “bumalik” ang pagbabago o pagbaligtad ng direksiyon nang hindi dinaragdagan ang di-tiyak sa Hebreo.
- source_word: וְיַחֲנוּ
  choice: at magkampo
  rationale: Ang חנה ay nangangahulugang magkampo o humimpil. Ang “magkampo” ay malinaw at pangkaraniwan sa modernong Tagalog.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: sa harap ng Pi-hahirot
  rationale: Ginawang tunog-Tagalog ang baybay ng pangalang-pook at hindi isinalin ang posibleng etimolohiya nito. Ang לִפְנֵי ay tuwirang isinaling “sa harap ng.”
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: sa pagitan ng Migdol at ng dagat
  rationale: Malinaw na tinutukoy ng dobleng בֵּין ang dalawang hangganan. Karaniwang pangngalan lamang ang “dagat” rito, kaya hindi ito ginawang pantanging pangalan.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: Sa harap ng Baal-zefon
  rationale: Pinananatili ang parehong locative na gamit ng לִפְנֵי at ginawang tunog-Tagalog ang baybay ng pangalang-pook.
- source_word: נִכְחוֹ
  choice: sa tapat nito
  rationale: Ang נֹכַח na may panlalaking isahang hulapi ay tumutukoy sa kinalalagyang katapat o kaharap. Pinananatili ng “nito” ang panghalip at ang bahagyang kalabuan ng tinutukoy nito.
- source_word: תַחֲנוּ
  choice: magkampo kayo
  rationale: Ang ikalawang panauhang maramihang imperfect ay ginagamit bilang tuwirang tagubilin. Likas sa Tagalog ang pautos na “magkampo kayo.”
- source_word: עַל הַיָּם
  choice: sa tabi ng dagat
  rationale: Sa kontekstong lokatibo, ang עַל ay nagsasaad ng kalapitan sa dagat, hindi literal na pag-iral sa ibabaw nito.
theological_decisions:
- issue: Tinutukoy ng hulaping panghalip sa נִכְחוֹ
  choice: Isinalin bilang “nito” at ipinaliwanag na malamang na tumutukoy sa Baal-zefon.
  alternative: Tahasan itong gawing “sa tapat ng Baal-zefon.”
  rationale: Pinananatili ng panghalip ang anyo at bahagyang referensiyal na kalabuan ng Hebreo, habang ang talababa ay nagbibigay ng pinakamalamang na pagbasa nang hindi ito ginagawang tiyak sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “mga anak ni Israel” upang mapanatili ang pampamilyang anyo ng Hebreo, ngunit ibinigay sa talababa ang mas idyomatikong “mga Israelita.” Ang mga pangalang-pook ay isinatunog sa karaniwang ortograpiyang Filipino.
