  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: tl
  text: At pinatigas ni Yahweh ang puso ng Faraon, na hari ng Ehipto,[a] at hinabol niya ang mga Israelita, samantalang lumalabas ang mga Israelita nang nakataas ang kamay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinalakas” o “ginawang matatag ni Yahweh ang puso ng Faraon.” Sa literal, ang pandiwang Hebreo ay nangangahulugang “pinalakas” o “ginawang matatag,” ngunit sa salaysay ng Exodo ay karaniwan itong nagpapahiwatig ng pagpapatigas ng pasiya.
    reason: lexical_alternative
  - marker: b
    text: Literal na “nang nakataas ang kamay.” Maaari ring mangahulugang “nang buong tapang,” “nang hayagan,” o “nang matagumpay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos upang tuwirang katawanin ang tetragrammaton sa tekstong Hebreo.
- source_word: וַיְחַזֵּק
  choice: pinatigas
  rationale: Bagaman literal na maaaring mangahulugang ‘pinalakas’ o ‘ginawang matatag,’ sa paulit-ulit na parirala tungkol sa puso ng Faraon ay natural na ipinahahayag nito ang pagpapatigas ng kaniyang pasiya; inilagay sa talababa ang leksikal na alternatibo.
- source_word: לֵב
  choice: puso
  rationale: Pinananatili ang konkretong larawang Hebreo para sa kalooban at panloob na pasiya.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: ang Faraon, na hari ng Ehipto
  rationale: Natural sa modernong Tagalog at malinaw na ang ‘hari ng Ehipto’ ay tumutukoy sa Faraon.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: hinabol niya
  rationale: Likas at tuwirang Tagalog para sa mapanlabang paghabol.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Mas natural at saklaw ang buong bayan sa modernong Tagalog kaysa sa literal na ‘mga anak na lalaki ni Israel’; hindi nito nililimitahan ang tinutukoy sa kalalakihan.
- source_word: יֹצְאִים
  choice: habang ... silang lumalabas
  rationale: Ipinapakita ng ‘habang’ at aspektong Tagalog ang nagpapatuloy na kilos kasabay ng paghabol.
- source_word: בְּיָד רָמָה
  choice: buong tapang
  rationale: Ipinahahayag ang idyomatikong diwa ng literal na ‘nang nakataas ang kamay’ sa natural na Tagalog, habang pinananatili sa talababa ang konkretong larawan at iba pang posibleng himig.
theological_decisions:
- issue: Ang pagkilos ni Yahweh sa puso ng Faraon
  choice: pinatigas ni Yahweh ang puso ng Faraon
  alternative: pinalakas ni Yahweh ang loob/pasiya ng Faraon
  rationale: Tuwirang iniuugnay ng Hebreo kay Yahweh ang kilos. Hindi ito pinalalambot o ipinapaliwanag upang alisin ang teolohikal na tensiyon, ngunit itinatala ang leksikal na alternatibo.
- issue: Himig ng בְּיָד רָמָה
  choice: buong tapang
  alternative: nang nakataas ang kamay / buong paghamon / matagumpay
  rationale: Maaaring magpahiwatig ang idyoma ng tapang, hayagang pagkilos, o paghamon. Pinili ang malawak at natural na ‘buong tapang’ at iniingatan sa talababa ang tunay na ambiguwidad.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang ‘mga Israelita’ bilang natural na katawagan sa buong bayan, at isinalin nang idyomatiko ang בְּיָד רָמָה habang inilalahad sa talababa ang literal na larawan at saklaw ng kahulugan.
