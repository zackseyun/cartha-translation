  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: tl
  text: Pagkatapos, ang anghel ng Diyos[a], na noo’y nauuna sa kampo ng Israel, ay lumipat at pumunta sa likuran nila. Ang haliging ulap ay lumipat din mula sa harapan nila at tumayo sa likuran nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ng Diyos.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “mensahero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: lumipat
  rationale: Bagaman maaari itong mangahulugang umalis o maglakbay, ang konteksto rito ay pagbabago ng puwesto ng anghel at ng haliging ulap. Likas at malinaw sa Filipino ang “lumipat.”
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ang anghel ng Diyos
  rationale: Maaaring mangahulugang “anghel” o “mensahero” ang מַלְאָךְ. Sa kontekstong ito, “anghel” ang natural at nakagawiang salin, habang inilalahad sa talababa ang tunay na alternatibong leksikal.
- source_word: הַהֹלֵךְ לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: na noo’y nauuna sa kampo ng Israel
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na naunang pagkilos o kinalalagyan. Inihahatid ng “noo’y nauuna” ang temporal at panlugar na diwa sa natural na Filipino.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: pumunta sa likuran nila
  rationale: Panlugar ang מֵאַחֲרֵי rito, hindi paghahabol. Tuwirang ipinapakita ng salin na lumipat ang anghel sa hulihang bahagi ng kampo.
- source_word: עַמּוּד הֶעָנָן
  choice: ang haliging ulap
  rationale: Pinananatili nito ang kongkretong larawan ng Hebreo at ang malinaw, nakagawiang katawagan sa Filipino.
- source_word: מִפְּנֵיהֶם
  choice: mula sa harapan nila
  rationale: Malinaw nitong ipinapahayag ang dating puwesto ng haliging ulap at pinananatili ang panlugar na ugnayan sa teksto.
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Karaniwang kahulugan ng עמד ang “tumayo.” Dito, ipinahihiwatig nitong huminto at nanatili sa isang tiyak na puwesto ang haligi nang hindi dinaragdagan ang teksto ng mas interpretibong pandiwa.
theological_decisions:
- issue: Pagkakakilanlan at kalikasan ng מַלְאַךְ הָאֱלֹהִים
  choice: Isinalin bilang “ang anghel ng Diyos” nang hindi nililinaw kung siya ay nilikhang anghel, pagpapakita ng Diyos, o iba pang teolohikal na pagkakakilanlan.
  alternative: “ang mensahero ng Diyos” o isang tahasang teopanikong paglalarawan
  rationale: Pinapangalanan ng Hebreo ang tauhan ngunit hindi tahasang ipinapaliwanag ang kaniyang ontolohikal na kalikasan sa talatang ito. Pinananatili ng salin ang teolohikal na tensiyon at iniiwasang ipasok ang isang tiyak na doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “noo’y nauuna” upang natural na maipakita ang dating nagpapatuloy na posisyon, at pinanatili ang “haliging ulap” bilang kongkreto at pamilyar na larawang biblikal.
