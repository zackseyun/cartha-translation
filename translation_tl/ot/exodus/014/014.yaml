id: EXO.14.14
reference: Exodus 14:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְהוָ֖ה יִלָּחֵ֣ם לָ/כֶ֑ם וְ/אַתֶּ֖ם תַּחֲרִישֽׁוּ/ן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/014.yaml
  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: tl
  text: Makikipaglaban si Yahweh para sa inyo; kayo naman ay manahimik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mananahimik kayo” o “manatili kayong tahimik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: יִלָּחֵם
  choice: makikipaglaban
  rationale: Ang Niphal imperfect ng לחם ay tumutukoy sa pakikipaglaban ni Yahweh para sa Israel; likas at malinaw sa modernong Tagalog ang “makikipaglaban.”
- source_word: לָכֶם
  choice: para sa inyo
  rationale: Ipinahahayag ng ל na may hulaping pangalawang panauhang maramihan na ang pagkilos ay alang-alang at sa kapakinabangan nila.
- source_word: וְאַתֶּם
  choice: kayo naman
  rationale: Pinananatili ng “naman” ang diin sa malayang panghalip at ang paghahambing sa pagkilos ni Yahweh, nang hindi labis na pinatitindi ang payak na pang-ugnay.
- source_word: תַּחֲרִישׁוּן
  choice: manahimik
  rationale: Ang pandiwa ay nangangahulugang maging tahimik o huwag kumilos sa pagsasalita; sa konteksto, natural itong basahin bilang tagubilin, ngunit tunay na posible rin ang pahiwatig na “mananahimik kayo.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng Hebreong teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: 'Lakas ng תַּחֲרִישׁוּן: utos o pahayag'
  choice: manahimik
  alternative: mananahimik kayo
  rationale: Ang konteksto ng pagpapalakas-loob ni Moises ay nagpapahintulot sa panawagang manahimik, ngunit ang imperfect na anyo ay maaari ring unawain bilang pahayag tungkol sa kanilang gagawin; inilalahad sa talababa ang hindi katiyakang ito.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at madaling maunawaan. Ginamit ang tuldok-kuwit upang luminaw ang pagtut contrast ng pagkilos ni Yahweh at ng tugon ng bayan, habang ang “kayo naman” ay kumakatawan sa diin ng Hebreong malayang panghalip.
