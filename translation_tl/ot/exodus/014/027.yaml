base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: tl
  text: Iniunat ni Moises ang kanyang kamay sa ibabaw ng dagat. Pagsapit ng bukang-liwayway, bumalik ang dagat sa dating kalagayan nito[a], habang tumatakas ang mga Ehipsiyo patungo rito. At inihagis ni Yahweh ang mga Ehipsiyo sa gitna ng dagat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa dati nitong lakas” o “sa karaniwan nitong kalagayan.” Maaaring ipahiwatig ng Hebreong parirala na nanumbalik ang dagat sa dati at matatag nitong kondisyon.
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay literal na maaaring mangahulugang “ipinagpag” o “kinalog palabas,” isang matingkad na larawan ng paghahagis ni Yahweh sa mga Ehipsiyo sa gitna ng dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: iniunat
  rationale: Ang נטה kasama ng “kamay” ay karaniwang tumutukoy sa pag-unat o pag-abot nito; natural at malinaw ang “iniunat” sa Tagalog.
- source_word: הַיָּם
  choice: dagat
  rationale: Karaniwang salita ito para sa dagat; hindi kailangan sa talatang ito mismo ang mas interpretatibong pantanging pangalan.
- source_word: וַיָּשָׁב הַיָּם
  choice: bumalik ang dagat
  rationale: Ipinahihiwatig ng שׁוב ang pagbabalik sa naunang kalagayan, na nililinaw ng kasunod na לְאֵיתָנוֹ.
- source_word: לִפְנוֹת בֹּקֶר
  choice: pagsapit ng bukang-liwayway
  rationale: Ang parirala ay tumutukoy sa pagdating o pagbaling ng umaga; likas sa modernong Tagalog ang “pagsapit ng bukang-liwayway.”
- source_word: לְאֵיתָנוֹ
  choice: sa dati nitong lakas
  rationale: Maaaring tukuyin ng אֵיתָן ang matatag, namamalagi, o ganap na lakas. Pinananatili ng “dati nitong lakas” ang larawan ng dagat na nanumbalik sa normal at makapangyarihang kalagayan nito nang hindi nililimitahan sa agos o lugar.
- source_word: נָסִים לִקְרָאתוֹ
  choice: tumatakas ... patungo rito
  rationale: Ang participle ay nagpapakita ng nagpapatuloy na pagtakas, at ang לִקְרָאתוֹ ay literal na “patungo upang salubungin ito.” Pinananatili ng “patungo rito” ang kabalintunaang direksiyon ng kanilang pagtakas habang bumabalik ang dagat.
- source_word: וַיְנַעֵר
  choice: ipinagpag
  rationale: Ang נער ay literal na “ipagpag” o “kalugin palabas.” Ang “ipinagpag” ay natural sa Tagalog at pinananatili ang matingkad na metapora sa halip na gawing payak na “itinapon” o “nilupig.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: בְּתוֹךְ הַיָּם
  choice: sa gitna ng dagat
  rationale: Ang בְּתוֹךְ ay tumutukoy sa loob o gitna. Sapat na ipinahihiwatig ng pandiwang “ipinagpag” ang marahas na kilos, kaya natural ang “sa gitna ng dagat.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa teksto sa halip na palitan ito ng titulo.
- issue: Ahensiya ni Yahweh sa kapahamakan ng mga Ehipsiyo
  choice: At ipinagpag sila ni Yahweh sa gitna ng dagat
  alternative: At nalipol ang mga Ehipsiyo sa gitna ng dagat
  rationale: Tahasan sa Hebreo na si Yahweh ang simuno ng pandiwa; hindi dapat gawing di-tuwiran o alisin ang kanyang aktibong pagkilos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bukang-liwayway” bilang pamilyar at dignified na katumbas ng pagdating ng umaga. Pinanatili ang matingkad na larawang “ipinagpag” at ang semantikong lawak ng לְאֵיתָנוֹ sa teksto at talababa.
