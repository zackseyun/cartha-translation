id: EXO.14.15
reference: Exodus 14:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Bakit ka dumaraing sa akin? Sabihin mo sa mga anak ni Israel[a] na humayo.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: O, “sumulong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahahayag ng anyong pasalaysay ang pagsulong ng pangyayari; natural sa modernong Tagalog ang “Pagkatapos ay sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מַה
  choice: Bakit
  rationale: Sa idyomang ito, ang מַה na sinusundan ng pandiwa ay may puwersang patanong na likas na isinasalin bilang “Bakit.”
- source_word: תִּצְעַק אֵלָי
  choice: ka dumaraing sa akin
  rationale: Ang צעק ay tumutukoy sa malakas at apurahang pagdaing o paghingi ng tulong; ipinapakita ng “dumaraing” ang pagkabalisa at pagsusumamo nang hindi ipinapalagay na literal na pagsigaw lamang.
- source_word: דַּבֵּר אֶל
  choice: Sabihin mo sa
  rationale: Natural na Tagalog ito para sa pautos na “magsalita sa,” at pinananatili ang direktibong puwersa nang hindi ito pinatitindi bilang tahasang “utusan.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit nitong pinananatili ang pormal na Hebreong pariralang “mga anak ni Israel,” habang inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: וְיִסָּעוּ
  choice: na humayo
  rationale: Ang נסע ay nangangahulugang umalis o magsimulang maglakbay. Ang “humayo” ay maikli, marangal, at angkop sa utos na magsimula silang kumilos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal at tipanang pangalan, sa halip na palitan ito ng titulo.
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pormal na anyo ng orihinal, ngunit ibinibigay sa talababa ang likas at saklaw-sa-lahat na katawagan sa bayan.
- issue: Direksiyon ng וְיִסָּעוּ
  choice: humayo
  alternative: sumulong
  rationale: Ang pandiwa ay pangunahing tumutukoy sa pag-alis o pagpapatuloy ng paglalakbay. Posible sa konteksto ang “sumulong,” ngunit hindi kailangang ipakahulugan sa pangunahing teksto na iyon lamang ang leksikal na diwa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “dumaraing” upang ihatid ang apurahang pagsusumamo, at “humayo” bilang maikli at dignified na utos na umalis o magsimulang maglakbay.
