revisions:
- from: Nakita ng Israel ang dakilang kamay na ipinamalas ni Yahweh laban sa Egipto[a]. Kaya natakot ang bayan kay Yahweh, at sumampalataya sila kay Yahweh at kay Moises na lingkod niya.
  to: Nakita ng Israel ang dakilang kamay[a] na ipinakita ni Yahweh sa Egipto[b]. Natakot ang bayan kay Yahweh, at naniwala sila kay Yahweh at kay Moises na kanyang lingkod.
  rationale: Inilapit ang pangunahing salin sa Hebreo sa pamamagitan ng “sa Egipto” at inalis ang interpretatibong “laban sa.” Inayos ang mga angkla ng talababa upang bawat alternatibong leksikal ay nakatali sa kaukulang parirala. Pinanatili ang literal na larawan ng kamay, ang banal na pangalang Yahweh, ang takot sa Yahweh, at ang paralelong paniniwala kay Yahweh at kay Moises bilang kanyang lingkod.
