  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: tl
  text: Nakita ng Israel ang dakilang kamay[a] na ipinakita ni Yahweh sa Egipto[b]. Natakot ang bayan kay Yahweh, at naniwala sila kay Yahweh at kay Moises na kanyang lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “makapangyarihang kamay” o “dakilang kapangyarihan.” Literal sa Hebreo ang “dakilang kamay,” isang karaniwang larawan ng kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa mga Egipcio.” Ang Hebreo ay literal na “sa Egipto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nakita
  rationale: Tuwirang pandama ang ipinahihiwatig ng ראה sa salaysay; natural sa Tagalog ang “nakita” para sa kinahinatnan ng pangyayari.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinananatili ang kolektibong pangalang nasa isahan sa Hebreo, na tumutukoy sa buong bayan.
- source_word: הַיָּד הַגְּדֹלָה
  choice: ang dakilang kamay
  rationale: Pinananatili ang literal at mahalagang larawan ng “kamay” bilang kapangyarihan ni Yahweh sa Exodo; ang “dakila” ay malapit sa גָּדוֹל.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: na ipinamalas ni Yahweh laban sa Egipto
  rationale: Ang “ipinamalas” ay likas na nakakabit sa larawang “kamay” at ipinahahayag ang gawang nakita ng Israel. Ang “laban sa” ay umaayon sa konteksto ng paghatol, habang kinikilala sa talababa ang maaaring mas literal na saklaw ng בְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalinwika ang banal na pangalan bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: וַיִּירְאוּ
  choice: natakot
  rationale: Pinananatili ang pangunahing kahulugan ng ירא at ang saklaw nitong maaaring magsama ng pagpipitagan at pagkamangha.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang “bayan” ay natural at marangal na katumbas ng kolektibong הָעָם sa kontekstong ito.
- source_word: וַיַּאֲמִינוּ
  choice: sumampalataya sila
  rationale: Ipinahahayag nito ang paniniwala at pagtitiwalang saklaw ng Hiphil ng אמן na may kasunod na בְ; ang istruktura ay napananatili para sa parehong Yahweh at Moises.
- source_word: בַּיהוָה
  choice: kay Yahweh
  rationale: Sa pandiwang “sumampalataya,” natural sa modernong Tagalog ang “kay” para sa taong pinagtutuunan ng pananampalataya o tiwala.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: at kay Moises na lingkod niya
  rationale: Pinananatili ang magkatulad na konstruksiyon para kay Yahweh at Moises, habang nililinaw ng “lingkod niya” ang nakabababang tungkulin ni Moises bilang lingkod ni Yahweh.
theological_decisions:
- issue: Ang uri ng tugon ng Israel kay Moises
  choice: Sumampalataya sila kay Yahweh at kay Moises bilang lingkod at kinatawan ni Yahweh.
  alternative: Nagtiwala sila kay Yahweh at hiwalay ding nagtiwala kay Moises bilang isang tao; o naniwala sila sa sinabi ni Yahweh at ni Moises.
  rationale: Parehong ginagamit ng Hebreo ang אמן + בְ para kay Yahweh at kay Moises. Pinananatili ng salin ang pagkakapantay ng gramatikal na konstruksiyon ngunit hindi ipinahihiwatig na magkapantay sila, sapagkat tahasang tinatawag si Moises na lingkod ni Yahweh.
- issue: Saklaw ng pagkatakot kay Yahweh
  choice: “Natakot” upang mapanatili ang tunay na saklaw ng takot, pagkamangha, at pagpipitagan.
  alternative: “Nagpitagan” o “namangha” lamang.
  rationale: Hindi tahasang nilulutas ng konteksto ang buong damdamin sa iisang mas makitid na kahulugan; mas tapat ang “natakot” sa leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinanatili ang Hebreong larawan ng “dakilang kamay” at ang banal na pangalang “Yahweh.” Ginamit ang “sumampalataya” upang maipakita ang paniniwala at pagtitiwala nang hindi pinapantay si Moises kay Yahweh.
