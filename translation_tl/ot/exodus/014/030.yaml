  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: tl
  text: Noong araw na iyon, iniligtas ni Yahweh ang Israel mula sa kamay ng Ehipto[a], at nakita ng Israel ang mga Ehipsiyong patay sa dalampasigan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mula sa kamay ng Ehipto” ay isang Hebreong idyoma na nangangahulugang mula sa kapangyarihan o kontrol ng Ehipto.
    reason: cultural_note
  - marker: b
    text: O, “sa pampang ng dagat.” Sa literal, “sa labi ng dagat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: iniligtas
  rationale: Ang Hifil ng ישׁע ay tumutukoy sa pagliligtas ni Yahweh sa Israel mula sa panganib at kapangyarihan ng Ehipto. Natural sa makabagong Tagalog ang “iniligtas” at pinananatili nito ang bigat ng ginawang pagliligtas ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na panandang temporal sa Tagalog para sa Hebreong “sa araw na iyon.”
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang metapora ng Hebreo, kung saan ang “kamay” ay tumutukoy sa kapangyarihan o kontrol; nililinaw ito sa talababa.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Ehipto / mga Ehipsiyo
  rationale: Sa unang sugnay, ang pangalan ay tumutukoy sa Ehipto bilang kapangyarihang umaalipin; sa ikalawa, tumutukoy ito sa mga taong nakita nilang patay.
- source_word: וַיַּרְא
  choice: nakita
  rationale: Tuwiran at natural na salin ng pandiwang ראה sa kontekstong pasalaysay.
- source_word: מֵת
  choice: patay
  rationale: Ang pang-uri ay kolektibong tumutukoy sa mga Ehipsiyo. Hindi idinagdag ang “nakahandusay” o katulad na larawang hindi tahasang nasa Hebreo.
- source_word: עַל שְׂפַת הַיָּם
  choice: sa dalampasigan
  rationale: Natural na salin sa Tagalog ng kinaroroonang nasa gilid o pampang ng dagat, nang hindi pinananatili sa pangunahing teksto ang literal ngunit di-likas na “labi ng dagat.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang יְהוָה sa talata; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Ang gumagawa ng pagliligtas
  choice: Malinaw na si Yahweh ang nagligtas sa Israel
  alternative: Pahinain bilang pangkalahatang pagtatagumpay ng Israel
  rationale: Tahasan sa Hebreo na si Yahweh ang simuno ng וַיּוֹשַׁע; kaya hindi ikinukubli ang teolohikal na diin sa pagkilos ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang Hebreong metapora na “kamay ng Ehipto” dahil mauunawaan ito sa konteksto, kalakip ang maikling paliwanag. Ginamit ang “mga Ehipsiyo” sa ikalawang sugnay upang natural na ipahayag ang kolektibong gamit ng מִצְרַיִם.
