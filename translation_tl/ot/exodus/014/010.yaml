  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: tl
  text: 'Nang papalapit na si Paraon, tumingala ang mga anak ni Israel[a], at narito, nagmamartsa sa likuran nila ang mga Ehipsiyo[b]. Labis silang natakot, at sumigaw kay Yahweh ang mga anak ni Israel.


    [a] O “mga Israelita.” Literal na “mga anak ni Israel”; isa itong pangkalahatang tawag sa sambayanang Israel.


    [b] Literal na “Ehipto”; kumakatawan dito ang pangalan ng bansa sa hukbong Ehipsiyong humahabol sa kanila.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak ni Israel”; isa itong pangkalahatang tawag sa sambayanang Israel.
    reason: lexical_alternative
  - marker: b
    text: Literal na “Ehipto”; kumakatawan dito ang pangalan ng bansa sa hukbong Ehipsiyong humahabol sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְרִיב
  choice: papalapit na
  rationale: 'Ang Hiphil ng קרב ay intransitibo ang diwa rito: si Paraon ang papalapit. Ipinahihiwatig ng progresibong anyo ang tumitinding panganib sa salaysay.'
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: tumingala
  rationale: Likas na katumbas sa modernong Tagalog ng Hebreong idyomang literal na ‘itinaas ang kanilang mga mata.’
- source_word: וְהִנֵּה
  choice: at narito
  rationale: Pinananatili ang biglaang pagkakita at dramatikong diin ng pangungusap.
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Bagaman literal na ‘Ehipto,’ kolektibong tumutukoy rito ang pangalan ng bansa sa puwersang Ehipsiyong sumusunod sa Israel; ipinaliliwanag sa talababa ang anyong Hebreo.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: nagmamartsa sa likuran nila
  rationale: Ipinahahayag ang aktibong pagkilos ng isang puwersang militar kasunod ng Israel nang hindi ginagawang tahasang ‘humahabol,’ na ipinahihiwatig lamang ng konteksto.
- source_word: וַיִּירְאוּ מְאֹד
  choice: Labis silang natakot
  rationale: Natural na modernong Tagalog na nagpapanatili sa matinding puwersa ng pandiwa at panuring.
- source_word: וַיִּצְעֲקוּ
  choice: sumigaw
  rationale: Naghahayag ng apurahan at malakas na pagtawag dahil sa matinding takot.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin sa baybay na ‘Yahweh’ ang personal na banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at panlahatang katawagan ng Hebreo, habang nililinaw sa talababa na maaari itong ipakahulugang ‘mga Israelita.’
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong pangalan sa salin at hindi pinapalitan ng titulong ‘PANGINOON.’
- issue: Panlahatang pananalitang בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyo at pambansang katawagan ng Hebreo; ibinibigay sa talababa ang mas idyomatikong katumbas.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang ‘tumingala’ bilang likas na Tagalog para sa idyomang Hebreo, samantalang pinanatili ang dramatikong ‘narito.’ Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat paliwanag.
