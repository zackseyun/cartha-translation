lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay; natural na ipinahahayag ito ng “Pagkatapos,” habang pinananatili ng “nagsalita” ang pormal na pagpapakilala sa salita ng Diyos.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang Tetragrammaton bilang pangalang tipan ng Diyos at nilalagyan ng talababa tungkol sa anyong Hebreo at alternatibong transliterasyon.
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinausap; “kay” ang likas na katumbas sa Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang pamantayan at madaling makilalang anyo ng pangalang Hebrew sa makabagong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nagpapakilala sa nilalaman ng kasunod na pahayag, sa halip na alisin ito bilang kalabisan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang banal na pangalan, samantalang itinatala sa talababa ang “Jehovah” bilang alternatibong anyo nang hindi pinapalitan ang pangalan ng isang titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang bahagyang pormal na hulma ng pormulang Hebreo sa “na sinasabi,” yamang pambungad ito sa kasunod na mismong pahayag.
