  terminology: Ang “tungkod,” “iunat ... ang iyong kamay,” “sa ibabaw ng dagat,” “hatiin mo ito,” “sa gitna ng dagat,” at “sa tuyong lupa” ay angkop na mga termino. Pinananatili ang pangalang “Israel” at ang footnote anchor.
