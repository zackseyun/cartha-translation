  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: tl
  text: Ngunit ikaw naman, itaas mo ang iyong tungkod at iunat mo ang iyong kamay sa ibabaw ng dagat at hatiin mo ito, upang makadaan ang mga anak ni Israel[a] sa gitna ng dagat sa tuyong lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, literal na “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Ngunit ikaw naman
  rationale: Ang pangatnig na וְ kasama ng tahasang panghalip na אַתָּה ay nagbibigay-diin at nagpapakita ng paghahambing sa naunang utos sa bayan; likas itong naipapahayag sa Tagalog sa pamamagitan ng “Ngunit ikaw naman.”
- source_word: הָרֵם אֶת מַטְּךָ
  choice: itaas mo ang iyong tungkod
  rationale: Ang Hiphil na pautos ng רום ay tumutukoy sa pag-angat, at ang מַטֶּה sa salaysay tungkol kay Moises ay natural na “tungkod,” hindi ang mas makitid na “pamalo.”
- source_word: וּנְטֵה אֶת יָדְךָ
  choice: at iunat mo ang iyong kamay
  rationale: Ang נטה ay karaniwang tumutukoy sa pag-uunat o pagpapahaba ng kamay; pinananatili ng salin ang tahasang larawan ng kilos.
- source_word: עַל הַיָּם
  choice: sa ibabaw ng dagat
  rationale: Sa konteksto ng pag-uunat ng kamay, ipinahihiwatig ng עַל ang posisyon o direksiyon sa ibabaw ng dagat.
- source_word: וּבְקָעֵהוּ
  choice: at hatiin mo ito
  rationale: Ang בקע ay nangangahulugang biyakin o hatiin. Ang “hatiin” ay malinaw at marangal sa makabagong Tagalog, samantalang pinananatili ng “ito” ang hulaping panghalip sa Hebreo.
- source_word: וְיָבֹאוּ
  choice: upang makadaan
  rationale: Sa pagkakasunod ng mga pautos, ang anyong ito ay likas na nagpapahayag ng layunin o bunga. Ang “upang makadaan” ay angkop sa konteksto ng pagtawid at natural sa Tagalog.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  rationale: Pinananatili nito ang tahasang panlalaking anyo ng Hebreong “mga anak na lalaki ni Israel,” habang inilalagay sa talababa ang mas natural na kolektibong katawagang “mga Israelita.”
- source_word: בְּתוֹךְ הַיָּם
  choice: sa gitna ng dagat
  rationale: Ang בְּתוֹךְ ay tumutukoy sa loob o gitnang bahagi; pinananatili ng “sa gitna ng dagat” ang kongkretong larawang panglokasyon.
- source_word: בַּיַּבָּשָׁה
  choice: sa tuyong lupa
  rationale: Ang יַבָּשָׁה ay tuyong lupa na kabaligtaran ng tubig ng dagat; malinaw na ipinakikita ng salin ang mahimalang kalagayan ng daraanan.
theological_decisions:
- issue: Panlalaking anyo ng בְנֵי יִשְׂרָאֵל at ang kolektibong tinutukoy nito
  choice: mga anak na lalaki ni Israel
  alternative: mga Israelita; mga anak ni Israel
  rationale: Tahasan sa anyong Hebreo ang panlalaking maramihan, kaya pinanatili ito sa pangunahing teksto. Gayunman, sa konteksto ay pangalan ito para sa bayang Israel bilang kabuuan; binabanggit sa talababa ang mas natural na kolektibong salin nang hindi binabago nang palihim ang anyo ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ikaw naman” upang ipahayag ang diin at paghahambing, at pinanatili ang kongkretong mga larawang “tungkod,” “kamay,” “gitna ng dagat,” at “tuyong lupa.”
