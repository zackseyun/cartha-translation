  to: Ngunit ikaw naman, itaas mo ang iyong tungkod at iunat mo ang iyong kamay sa ibabaw ng dagat at hatiin mo ito, upang makadaan ang mga anak ni Israel[a] sa gitna ng dagat sa tuyong lupa.
  rationale: Pinalitan ang di-likas na “mga anak na lalaki ni Israel” ng idiomatikong Filipino na “mga anak ni Israel.” Inililipat ng talababa ang impormasyong ang Hebreo ay literal na panlalaki, kaya napapanatili ang katapatan sa anyo ng pinagmulan nang hindi pinipilipit ang normal na gamit ng Filipino.
