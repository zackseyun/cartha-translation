  source_fidelity: 'Tumpak na naihahatid ng draft ang magkakasunod na utos: itaas ang tungkod, iunat ang kamay sa ibabaw ng dagat, hatiin ito, at makaraan ang בני ישראל sa gitna ng dagat sa tuyong lupa. Ang “upang makadaan” ay isang wastong pagpapahayag ng layon/bungang ipinahihiwatig ng וְיָבֹאוּ sa kontekstong ito.'
