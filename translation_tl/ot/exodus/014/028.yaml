  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: tl
  text: Bumalik ang tubig at tinakpan ang mga karwahe at ang mga mangangabayo[a]—ang buong hukbo ng Paraon na pumasok sa dagat kasunod nila. Wala ni isa man sa kanila ang natira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga kawal na nakakabayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּיִם
  choice: Bumalik ang tubig
  rationale: Ang שוב ay nagsasaad na ang tubig ay bumalik sa dati nitong kalagayan o kinalalagyan. Likas sa Tagalog ang pang-isahang anyong “tubig” bilang pangngalang di-mabilang.
- source_word: וַיְכַסּוּ
  choice: tinakpan
  rationale: Ito ang tuwirang kahulugan ng כסה at pinananatili ang kongkretong larawan nang hindi dinaragdagan ng interpretasyong gaya ng “nilunod.”
- source_word: הָרֶכֶב
  choice: ang mga karwahe
  rationale: Bagaman maaaring tumukoy nang kolektibo sa puwersang may mga karwahe, malinaw at karaniwan sa Tagalog ang “mga karwahe.”
- source_word: הַפָּרָשִׁים
  choice: ang mga mangangabayo
  rationale: Tuwirang tumutukoy ito sa mga mandirigmang nakasakay sa kabayo; pinananatili ng salita ang larawan ng orihinal.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: ang buong hukbo ng Paraon
  rationale: Ang חֵיל sa konteksto ay hukbong militar, at ipinapahayag ng “buong” ang saklaw ng לְכֹל.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: na pumasok sa dagat kasunod nila
  rationale: Ipinapahayag nito ang pagpasok ng hukbo sa dagat habang hinahabol ang mga Israelita, nang hindi nagpapabigat sa natural na daloy ng Tagalog.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: Wala ni isa man sa kanila ang natira
  rationale: Natural at mariing Tagalog ito para sa idyomang nagsasaad na walang sinumang natira sa tinutukoy na pangkat.
theological_decisions:
- issue: Saklaw ng pagkalipol ng hukbo ng Paraon
  choice: Ang “wala ni isa man” ay tumutukoy sa buong hukbo ng Paraon na pumasok sa dagat kasunod ng Israel.
  alternative: Maaaring ipalagay na tumutukoy ito sa lahat ng kawal ng Ehipto saanman naroon.
  rationale: Nililimitahan ng sugnay na Hebreo ang mariing kabuuan sa puwersang pumasok sa dagat upang habulin sila; hindi nito tahasang sinasaklaw ang bawat kawal ng Ehipto sa ibang lugar.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “Paraon” at “karwahe” bilang pamilyar na bokabularyong biblikal, habang iniwasan ang sobrang teknikal na “kabalyerya.”
