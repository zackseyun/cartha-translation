  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: tl
  text: Sinabi ni Moises, “Lilihis ako at titingnan ko ang pambihirang tanawing ito—kung bakit hindi natutupok ang palumpong[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi nasusunog ang palumpong” o “hindi nauubos sa pagkasunog ang palumpong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Ipinagpapatuloy ng anyong pandiwa ang salaysay. Natural sa makabagong Tagalog ang “Sinabi” nang hindi kailangang ulitin ang literal na pang-ugnay na “at.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: אָסֻרָה נָּא
  choice: Lilihis muna ako
  rationale: Ipinapahayag ng cohortative na may נָא ang kusang pasiya ni Moises. Ang “muna” ay natural na naghahatid ng mahinahong pansamantalang paglihis nang hindi ito ginagawang pakiusap sa ibang tao.
- source_word: וְאֶרְאֶה
  choice: at titingnan ko
  rationale: Sa konteksto, ang ראה ay hindi lamang basta pagkakita kundi sinasadyang pagmamasid; malinaw at natural dito ang “titingnan ko.”
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: ang pambihirang tanawing ito
  rationale: Ang מַרְאֶה ay bagay o pangyayaring nakikita, at ang גָּדֹל dito ay nagpapahiwatig ng kapansin-pansing kadakilaan. Ang “pambihirang tanawin” ay dignificado at madaling maunawaan nang hindi tinatawag itong himala sa mismong salin.
- source_word: מַדּוּעַ
  choice: kung bakit
  rationale: Natural na ipinakikilala ng “kung bakit” ang tanong na nais siyasatin ni Moises.
- source_word: לֹא יִבְעַר
  choice: hindi natutupok
  rationale: Pangunahing kahulugan ng בער ang “masunog,” ngunit sa konteksto ang ipinagtataka ay ang palumpong na nagliliyab ngunit hindi nauubos. Malinaw na ipinahahayag ng “hindi natutupok” ang kabalintunaang iyon, habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: הַסְּנֶה
  choice: ang palumpong
  rationale: Ang “palumpong” ang malinaw at karaniwang katumbas nang hindi tiyakang idinaragdag na matinik ito.
theological_decisions:
- issue: Ang eksaktong diwa ng hindi nangyayari sa nagliliyab na palumpong
  choice: hindi natutupok ang palumpong
  alternative: hindi nasusunog ang palumpong; hindi nauubos sa pagkasunog ang palumpong
  rationale: Ang pandiwang Hebreo ay karaniwang tumutukoy sa pagsunog o pagliyab, samantalang ipinakikita ng konteksto na nagliliyab nga ang palumpong ngunit hindi nauubos. Pinili ang “natutupok” upang maging malinaw ang kababalaghan, ngunit pinanatili sa talababa ang leksikal na posibilidad sa halip na ituring na walang anumang kalabuan ang parirala.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang pagsasalita ni Moises at ang himig ng pagtataka, ngunit iniwasang magdagdag ng tiyak na teolohikal na paliwanag sa tanda.
