  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: tl
  text: Sinabi ng Diyos kay Moises, “AKO AY KUNG SINO AKO.”[a] At sinabi niya, “Ganito ang sabihin mo sa mga anak ni Israel:[b] ‘AKO AY’ ang nagsugo sa akin sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ako ay magiging kung ano ang magiging ako,” o “Ako ay magiging kung sino ang magiging ako.” Maaaring magpahiwatig ng kasalukuyan o hinaharap ang pandiwang Hebreo rito.
    reason: alternative_reading
  - marker: b
    text: O “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman anyong maramihan ang salita, tumutukoy ito rito sa nag-iisang Diyos ng Israel; kaya “Diyos” ang likas na salin.
- source_word: אֶהְיֶה
  choice: AKO AY
  rationale: Ang Qal imperfect na unang panauhang isahan ng היה ay maaaring magkaroon ng puwersang pangkasalukuyan o panghinaharap. Sa pangunahing teksto, “AKO AY” ang ginamit dahil inuulit ito bilang banal na pagkakakilanlan; pinanatili sa talababa ang tunay na posibilidad na “AKO AY MAGIGING.”
- source_word: אֲשֶׁר
  choice: ANG ... NGA
  rationale: Sa buong pahayag, ang “ANG AKO NGA” ay isang likas at maringal na paraan sa Tagalog upang ihayag ang mariing pagtukoy ng Diyos sa sarili, nang hindi nagdaragdag ng hiwalay na katangian o paliwanag.
- source_word: כֹּה
  choice: Ganito
  rationale: Ipinakikilala ng כֹּה ang eksaktong mensaheng sasabihin ni Moises; malinaw at natural dito ang “Ganito.”
- source_word: תֹאמַר
  choice: ang sabihin mo
  rationale: May puwersang pautos ang imperfect na ikalawang panauhang panlalaki; ipinahahayag ito nang natural sa Tagalog sa pariralang “Ganito ang sabihin mo.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ng salin ang kongkretong salitang בְּנֵי, “mga anak,” at ang ugnayan kay Israel; inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: שְׁלָחַנִי
  choice: ang nagsugo sa akin
  rationale: Ipinahahayag ng perfect na pandiwa at hulaping unang panauhan ang natapos na pagsusugo. Ang ayos na “‘AKO AY’ ang nagsugo sa akin” ay natural sa Tagalog at malinaw na ginagawang simuno ang banal na pagtatalaga.
- source_word: וַיֹּאמֶר
  choice: Sinabi ... At sinabi
  rationale: Pinananatili nito ang pagkakasunod-sunod ng dalawang pahayag sa salaysay nang hindi pinapabigat ang Tagalog.
theological_decisions:
- issue: Pagpapakahulugan sa banal na pagpapakilalang אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: AKO AY ANG AKO NGA
  alternative: AKO AY MAGIGING KUNG ANO AKO AY MAGIGING / AKO AY MAGIGING KUNG SINO AKO AY MAGIGING
  rationale: Maaaring magpahiwatig ang Hebrew imperfect ng kasalukuyan o hinaharap. Pinananatili ng pangunahing salin ang anyong pagkakakilanlan at ang pag-uulit na parang pangalan, samantalang hayagang inilalahad sa talababa ang panghinaharap na posibilidad upang hindi alisin ang tensiyong nasa Hebreo.
- issue: Pagmamarka sa אֶהְיֶה bilang banal na pagtatalaga
  choice: 'Malalaking titik: AKO AY'
  alternative: Ako ay / Ako ay magiging
  rationale: Ipinakikita ng malalaking titik na ang parirala ay ginagamit dito bilang taimtim na banal na pagpapakilala at pagkatapos ay bilang pagtatalagang ipahahayag ni Moises. Paraan lamang ito ng paglilimbag sa Tagalog at hindi nagpapahiwatig ng naiibang anyo sa Hebreo.
translation_notes:
  register: Makabago ngunit maringal na Tagalog ang ginamit. Pinanatili ang maikli at taimtim na anyo ng banal na pagpapakilala, iniwasan ang pagdaragdag ng salitang “Diyos” sa mismong pangalan, at inilagay ang mga tunay na alternatibong kahulugan sa mga talababa.
