  to: Sinabi ng Diyos kay Moises, “AKO AY KUNG SINO AKO.”[a] At sinabi niya, “Ganito ang sabihin mo sa mga anak ni Israel:[b] ‘AKO AY’ ang nagsugo sa akin sa inyo.”
  rationale: Pinalitan ang pangunahing banal na pagpapakilala upang malinaw na maipakita ang relasyonal na puwersa ng אֲשֶׁר nang hindi isinasara ang ambigwidad ng imperfect na אֶהְיֶה. Inayos ang bantas ng pinaikling pagtatalaga sa ikalawang pangungusap at ginawang mas likas ang mga alternatibong panghinaharap sa talababa. Walang idinagdag na pagpapakahulugang doktrinal.
