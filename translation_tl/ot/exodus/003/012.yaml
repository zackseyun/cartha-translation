base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: tl
  text: 'At sinabi niya, “Tiyak na sasamahan kita. Ito ang magiging tanda para sa iyo na ako ang nagsugo sa iyo: kapag nailabas mo na ang bayan mula sa Ehipto, maglilingkod[a] kayo sa Diyos sa bundok na ito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sasamba kayo sa Diyos sa bundok na ito.” Ang pandiwang Hebreo ay maaaring mangahulugang kapuwa “maglingkod” at, kapag Diyos ang pinaglilingkuran, “sumamba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: Tiyak na sasaiyo ako
  rationale: Ang כִּי ay may puwersang nagbibigay-katiyakan sa tugon ng Diyos, at ang אֶהְיֶה ay tumutukoy sa ipinangakong presensiya sa hinaharap. Ang “sasaiyo” ay likas at marangal na Tagalog para sa kasamang presensiya.
- source_word: הָאוֹת
  choice: ang magiging tanda
  rationale: Ang אוֹת ay isang tanda o pagpapatunay. Idinagdag ang “magiging” upang malinaw sa Tagalog ang pasulong na pagtukoy ng tanda nang hindi binabago ang diwa.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: na ako ang nagsugo sa iyo
  rationale: Naipahahayag ng “ako ang” ang diin ng אָנֹכִי, samantalang ang “nagsugo” ay natural na katumbas ng perpektong anyo at ng banal na atas kay Moises.
- source_word: בְּהוֹצִיאֲךָ
  choice: kapag nailabas mo na
  rationale: Ang infinitive construct na may בְּ ay temporal, at ang hulaping ikalawang panauhan ay tumutukoy kay Moises bilang tagapaglabas. Ang anyong “nailabas mo na” ay natural na nagsasaad ng natapos na paglabas bago ang paglilingkod sa bundok.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tiyak na tumutukoy ito sa Israel bilang bayang inatasang ilabas ni Moises; ang “bayan” ay angkop sa kolektibo at tipanang konteksto.
- source_word: תַּעַבְדוּן
  choice: maglilingkod kayo
  rationale: Ang עבד ay maaaring mangahulugang maglingkod o sumamba kapag Diyos ang layon. Pinananatili ng “maglilingkod” ang mas malawak na saklaw ng salita, habang nililinaw sa talababa ang panrelihiyong kahulugan.
- source_word: עַל הָהָר הַזֶּה
  choice: sa bundok na ito
  rationale: Sa natural na Tagalog, ang “sa” ay maaaring tumukoy sa lokasyon sa ibabaw o lugar ng bundok nang hindi pilit; pinananatili rin nito ang kongkretong pagtukoy sa bundok na naroroon.
theological_decisions:
- issue: Ang kalikasan ng ipinangakong tanda
  choice: Ang magiging paglilingkod o pagsamba sa Diyos sa bundok na ito matapos ang paglabas ang tanda na nagpapatunay sa pagsusugo kay Moises.
  alternative: Maaaring unawain na ang pangako ng presensiya ng Diyos ang tanda, o na kapuwa saklaw ng tanda ang kasalukuyang pangako at ang katuparan sa hinaharap.
  rationale: Pinakanatural na iniuugnay ng pagkakasunod at balangkas ng Hebreo ang “tanda” sa kasunod na pangyayari sa bundok. Gayunman, hindi nilalagyan ng paliwanag sa mismong talata na ganap na magsasara sa iba pang posibleng ugnayang sintaktiko.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sasaiyo” para sa taimtim at maikling pahayag ng banal na presensiya, “bayan” para sa kolektibong Israel, at “maglilingkod” upang mapanatili ang leksikal na lawak ng Hebreo. Inilagay ang talababa [a] matapos ang pangungusap na kinauukulan.
