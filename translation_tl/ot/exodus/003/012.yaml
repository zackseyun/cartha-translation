  to: 'At sinabi niya, “Tiyak na sasamahan kita. Ito ang magiging tanda para sa iyo na ako ang nagsugo sa iyo: kapag nailabas mo na ang bayan mula sa Ehipto, maglilingkod[a] kayo sa Diyos sa bundok na ito.”'
