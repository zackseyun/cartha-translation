base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Moises sa Diyos, “Tingnan mo, kapag pumunta ako sa mga Israelita at sabihin ko sa kanila, ‘Isinugo ako sa inyo ng Diyos ng inyong mga ninuno,’ at sabihin nila sa akin, ‘Ano ang pangalan niya?’ ano ang sasabihin ko sa kanila?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing lakas ng Hebreong salita habang natural pa rin sa isang marangal na salaysay sa Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ang idiomatikong kahulugan dito ay ang sambayanang Israel, hindi lamang literal na mga anak na lalaki.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Diyos ng inyong mga ninuno
  rationale: Saklaw ng “mga ninuno” ang ancestral fathers na tinutukoy at mas malinaw ito sa karaniwang modernong Tagalog.
- source_word: שְׁלָחַנִי
  choice: Isinugo ako
  rationale: Ipinahahayag ang awtorisadong pagpapadala na taglay ng pandiwang שלח sa kontekstong ito.
- source_word: מַה שְּׁמוֹ
  choice: Ano ang pangalan niya?
  rationale: Tuwirang pinananatili ang tanong tungkol sa pangalan nang hindi ipinapaliwanag o nilulutas nang maaga ang kahalagahan nito.
theological_decisions:
- issue: Kahulugan ng tanong tungkol sa pangalan ng Diyos
  choice: Isinalin nang tuwiran bilang “Ano ang pangalan niya?”
  alternative: “Ano ang pagkakakilanlan o katangian niya?”
  rationale: Hindi tahasang nililinaw ng talata kung pangalan lamang o mas malawak na pagkakakilanlan ang hinihingi; pinananatili ng tuwirang salin ang tunay na saklaw at tensiyon ng tanong.
- issue: Pagkakakilanlan ng “Diyos ng inyong mga ninuno”
  choice: Hindi nagdagdag ng mga pangalan o paliwanag
  alternative: Tukuyin sina Abraham, Isaac, at Jacob sa mismong teksto
  rationale: Bagaman malinaw sa konteksto kung sinu-sino ang mga ninuno, wala ang mga pangalang iyon sa talatang ito at hindi dapat idagdag sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” bilang natural na katumbas ng Hebreong idyoma at pinanatili ang direktang pananalita at retorikal na pag-aalinlangan ni Moises.
