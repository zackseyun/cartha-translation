  source_fidelity: 'Kailangang ipakita ang pang-ugnay na pangyayari sa simula (waw: “Then/At”) at ang הִנֵּה bilang pantawag-pansin. Ang “Kapag tinanong nila ako” ay malapit sa diwa, ngunit ang Hebreo ay tahasang “at sabihin nila sa akin,” kaya mas tapat itong panatilihin nang hindi binabago ang sitwasyon sa isang pangkalahatang paglalarawan ng pagtatanong.'
  naturalness: Natural at marangal sa modernong Filipino ang “Tingnan mo, kapag pumunta ako...” at ang direktang mga tanong. Mas malinaw ang “sabihin nila sa akin” para sa sunod-sunod na retorikal na sitwasyong inilalahad ni Moises.
  terminology: Ang “mga Israelita,” “Diyos ng inyong mga ninuno,” at “Isinugo ako” ay angkop at tapat sa Hebreo. Ang “pangalan niya” ay wastong pinananatiling bukas ang saklaw ng tanong.
