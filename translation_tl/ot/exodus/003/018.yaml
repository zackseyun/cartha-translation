  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: tl
  text: “Pakikinggan nila ang tinig mo. Pagkatapos, ikaw at ang matatanda ng Israel ay pupunta sa hari ng Ehipto at sasabihin ninyo sa kanya, ‘Si Yahweh, ang Diyos ng mga Hebreo, ay nakipagtagpo sa amin.[a] Kaya ngayon, nakikiusap kaming pahintulutan mo kaming maglakbay nang isang paglalakbay na tatlong araw patungo sa ilang upang makapaghandog kami kay Yahweh na aming Diyos.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatagpo sa amin.” Ang pariralang Hebreo ay maaaring tumukoy sa pagdating o pakikipagtagpo ni Yahweh sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: Pakikinggan nila ang tinig mo
  rationale: Ang שׁמע ay maaaring mangahulugang makarinig, makinig, o tumalima. Pinananatili ng “pakikinggan” ang diwa ng pagtanggap at pagpansin sa mensahe nang hindi tahasang ginagawang “susunod”; ang “tinig mo” ay malapit sa idyomang Hebreo at malinaw pa rin sa Filipino.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: pupunta kayo ng matatandang lalaki ng Israel
  rationale: Ang pandiwa ay pang-isahan ngunit sinusundan ng tahasang pinagsamang simuno. Natural sa Filipino ang “kayo ng…” upang tukuyin si Moises kasama ng mga nakatatanda.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: hari ng Ehipto
  rationale: Tuwiran at likas na salin ng pariralang construct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: Diyos ng mga Hebreo
  rationale: Pinananatili ang katawagang etniko ng pinagmulang teksto sa natural na anyong Filipino.
- source_word: נִקְרָה עָלֵינוּ
  choice: nakipagtagpo sa amin
  rationale: Ang Niphal ng קרא kasama ng עַל ay nagpapahayag ng pagtatagpo o pagharap. Ang “nakipagtagpo” ay hindi nagpapasok ng mas tiyak na ideya ng pagtawag o pagsusugo.
- source_word: נֵלֲכָה נָּא
  choice: nakikiusap kaming pahintulutan mo kaming maglakbay
  rationale: Ipinahahayag ng cohortative at נָא ang magalang na pakiusap sa hari; malinaw itong naihahatid ng pariralang Filipino.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: maglakbay nang tatlong araw
  rationale: Likas na Filipino para sa idyomang Hebreo na tumutukoy sa haba o tagal ng paglalakbay.
- source_word: בַּמִּדְבָּר
  choice: papunta sa ilang
  rationale: Dahil may pandiwa ng pagkilos, ipinahahayag ang direksiyong papasok sa ilang. Ang “ilang” ay mas malawak at biblikal kaysa sa mas tiyak na “disyerto.”
- source_word: וְנִזְבְּחָה
  choice: upang makapaghandog kami
  rationale: Ang ikalawang cohortative ay natural na nauunawaan bilang layunin ng paglalakbay. Sa kontekstong ritwal, ang “maghandog” ay malinaw at dignidong katumbas ng paghahain ng handog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng נִקְרָה עָלֵינוּ sa paglalarawan ng pakikipagtagpo ng Diyos
  choice: nakipagtagpo sa amin
  alternative: nakatagpo sa amin; nagpakita sa amin; tumawag sa amin
  rationale: Pinananatili ng napiling salin ang pangyayari ng banal na pagtatagpo nang hindi ipinapalagay na ang parirala ay tiyak na tumutukoy sa pagpapakita o pagtawag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang lalaki” upang malinaw na tumukoy sa mga lalaking pinuno ng Israel, at ang magalang na pakiusap ay ginawang natural sa pakikipag-usap sa hari. Inilagay ang talababa sa pariralang “nakipagtagpo sa amin,” na siyang salitang may leksikal na alternatibo.
