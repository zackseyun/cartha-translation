    issue: Hindi likas at sobrang makitid ang “matatandang lalaki ng Israel.”
    rationale: Ang זִקְנֵי ay karaniwang tumutukoy sa mga matatanda o kinikilalang pinuno ng pamayanan. Bagaman panlalaki ang anyong Hebreo, ang “matatandang lalaki” ay hindi karaniwang Tagalog para sa institusyonal na katawagang ito at nagpapabigat sa teksto.
  - severity: low
    issue: Ang “maglakbay nang tatlong araw” ay maaaring basahing tagal ng pagkilos sa halip na sukat ng paglalakbay.
    rationale: Ang דֶּרֶךְ שְׁלֹשֶׁת יָמִים ay isang paglalakbay na ang haba ay tatlong araw. Ang “isang paglalakbay na tatlong araw” ay mas tahasan at nananatiling natural.
