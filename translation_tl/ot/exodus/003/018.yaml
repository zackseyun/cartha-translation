revisions:
- from: “Pakikinggan nila ang tinig mo. Pagkatapos, pupunta kayo ng matatandang lalaki ng Israel sa hari ng Ehipto at sasabihin sa kanya, ‘Si Yahweh, ang Diyos ng mga Hebreo, ay nakipagtagpo sa amin.[a] Kaya ngayon, nakikiusap kaming pahintulutan mo kaming maglakbay nang tatlong araw papunta sa ilang upang makapaghandog kami kay Yahweh na aming Diyos.’”
  to: “Pakikinggan nila ang tinig mo. Pagkatapos, ikaw at ang matatanda ng Israel ay pupunta sa hari ng Ehipto at sasabihin ninyo sa kanya, ‘Si Yahweh, ang Diyos ng mga Hebreo, ay nakipagtagpo sa amin.[a] Kaya ngayon, nakikiusap kaming pahintulutan mo kaming maglakbay nang isang paglalakbay na tatlong araw patungo sa ilang upang makapaghandog kami kay Yahweh na aming Diyos.’”
  rationale: Pinalitan ang hindi likas na “matatandang lalaki” ng “matatanda,” ang karaniwang Filipino sa ganitong katawagang pampamayanan. Ginawang tahasan ang pinagsamang simuno at nilinaw ang idyoma para sa paglalakbay na tatlong araw. Nananatili ang antas ng paggalang, ang kahilingang nakatuon sa hari, ang ambiguity ng נִקְרָה עָלֵינוּ, at ang talababa sa wastong parirala.
