  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang pakikinig sa tinig ni Moises, ang pagpunta niya kasama ng mga nakatatanda sa hari ng Ehipto, ang Yahweh bilang Diyos ng mga Hebreo, ang banal na pakikipagtagpo, ang magalang na kahilingang maglakbay nang tatlong araw, at ang paghahandog kay Yahweh. Gayunman, ang “matatandang lalaki” ay labis na literal at hindi likas na katumbas ng זִקְנֵי sa tungkuling ito.'
  naturalness: Kailangan ang ilang pagpapakinis. Mas malinaw at natural ang tahasang “ikaw at ang matatanda ng Israel” kaysa “kayo ng matatandang lalaki ng Israel.” Ang “paglalakbay na tatlong araw” ay mas malapit sa idyomang Hebreo kaysa sa pagbasa na ang mismong kilos ng paglalakbay ay tatagal nang tatlong araw.
  terminology: Pinananatili ang “Yahweh,” “Diyos ng mga Hebreo,” “Ehipto,” at “ilang.” Ginamit ang “matatanda ng Israel” sa karaniwang biblikal at makabagong Filipino para sa mga elder/pinuno, nang hindi nagdaragdag ng hindi kailangang paglalarawang “lalaki.”
  issues:
