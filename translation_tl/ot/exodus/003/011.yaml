  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: tl
  text: Ngunit sinabi ni Moises sa Diyos, “Sino ako upang pumunta kay Faraon at ilabas ang mga anak ni Israel[a] mula sa Ehipto?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; natural sa modernong Tagalog ang “sinabi.”
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Tuwirang tumutukoy sa Diyos; hindi natural o kailangan sa Tagalog ang literal na artikulong Hebreo.
- source_word: מִי אָנֹכִי
  choice: Sino ako
  rationale: Tuwirang pinananatili ang retorikal na tanong at ang pagkadama ni Moises ng sariling kakulangan nang walang dagdag na paliwanag.
- source_word: כִּי אֵלֵךְ אֶל פַּרְעֹה
  choice: para humarap sa Faraon
  rationale: Sa konteksto ng ipinag-uutos na paglapit sa hari, natural na Tagalog ang “humarap sa”; ipinahihiwatig nito ang pagpunta kay Faraon nang hindi pinalalabis ang kahulugan.
- source_word: וְכִי אוֹצִיא
  choice: at ilabas
  rationale: Pinananatili ang magkatimbang na dalawang gawain sa pagtutol ni Moises; ang Hiphil ng יצא ay sanhiing “ilabas.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilya at pangangkanang anyo ng Hebreo, samantalang malinaw pa rin sa karaniwang mambabasa.
- source_word: מִמִּצְרַיִם
  choice: mula sa Ehipto
  rationale: Likas na katuwang ng “ilabas” sa Tagalog at malinaw na nagsasaad ng pinanggalingan.
theological_decisions:
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal na ugnayang pangangkanan sa Hebreo. Inilalagay sa talababa ang mas idyomatikong kolektibong katawagan upang hindi mawala ang saklaw sa buong bayang Israel.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “para humarap” upang maging likas ang retorikal na tanong, habang pinananatili ang dalawang bahagi ng pagtutol ni Moises.
