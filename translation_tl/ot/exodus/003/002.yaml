  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: tl
  text: 'Nagpakita sa kanya ang anghel[a] ni Yahweh sa ningas ng apoy mula sa gitna ng palumpong. Nakita niya: nagliliyab sa apoy ang palumpong, ngunit hindi ito natutupok.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “sugo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: Nagpakita
  rationale: Likas na katumbas sa Filipino ng Niphal na anyong nagsasaad na siya ay nagpakita o naging nakikita sa isang pagpapakitang banal.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugang ‘anghel’ o ‘sugo’ ang מַלְאַךְ. Ang ‘anghel’ ang pinakanatural sa kontekstong ito, habang inilalahad sa talababa ang tunay na alternatibong leksikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong ‘Yahweh’ ang tipang pangalan na nakasulat sa tekstong Hebreo.
- source_word: בְּלַבַּת אֵשׁ
  choice: sa ningas ng apoy
  rationale: Pinananatili nito ang larawang apoy at ang kahulugan ng לַבָּה bilang ningas o liyab, sa natural na pariralang Filipino.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: mula sa gitna ng palumpong
  rationale: Malapit itong sumusunod sa kahulugang ‘mula sa loob/gitna,’ at ang ‘palumpong’ ay natural na tawag sa mababang halamang makahoy.
- source_word: וַיַּרְא
  choice: Tumingin siya
  rationale: Bagaman literal na ‘nakita niya,’ ipinahihiwatig ng kasunod na paglalarawan na ibinaling ni Moises ang kanyang pansin sa tanawin; natural itong naihahayag ng ‘Tumingin siya.’
- source_word: וְהִנֵּה
  choice: at naroon—
  rationale: Inihahatid ng ‘naroon’ at ng gitling ang puwersang pantawag-pansin ng הִנֵּה nang hindi gumagamit ng lipas o di-likas na pananalita.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: nagliliyab sa apoy
  rationale: Ipinapakita ng aspektong nagpapatuloy ng ‘nagliliyab’ ang tuloy-tuloy na pagkasunog at pinananatili ang tahasang pagbanggit sa apoy.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: hindi ito natutupok
  rationale: Ang pasibong anyo ng אכל dito ay tumutukoy sa hindi pagkaubos ng palumpong sa apoy; malinaw at natural ang ‘hindi natutupok.’
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pinananatili ng ‘Yahweh’ ang personal at tipang pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng מַלְאַךְ sa konteksto ng banal na pagpapakita
  choice: anghel
  alternative: sugo
  rationale: Ang konteksto ay ang pagpapakita ng isang makalangit na kinatawan, kaya natural ang ‘anghel’; gayunman, hindi nilulutas ng salin ang mas malawak na teolohikal na ugnayan ng anghel at ni Yahweh, at itinatala sa talababa ang ‘sugo.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kapansin-pansing larawan ng apoy at ang kabalintunaan na nagliliyab ang palumpong ngunit hindi natutupok.
