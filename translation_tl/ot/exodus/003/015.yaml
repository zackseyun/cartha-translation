revisions:
- from: 'Sinabi pa ng Diyos kay Moises, “Ito ang sabihin mo sa mga anak ni Israel: ‘Si Yahweh,[a] ang Diyos ng inyong mga ninuno, ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob, ang nagsugo sa akin sa inyo.’ Ito ang pangalan ko magpakailanman, at sa pangalang ito ako aalalahanin[b] sa sali''t salinlahi.”'
  to: 'Sinabi pa ng Diyos kay Moises, “Ito ang sabihin mo sa mga anak ni Israel: ‘Si Yahweh,[a] ang Diyos ng inyong mga ama—ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob—ang nagsugo sa akin sa inyo.’ Ito ang pangalan ko magpakailanman, at ito ang aking alaala sa sali’t salinlahi.[b]”'
  rationale: Ang rebisyon ay ibinabalik ang tahasang “mga ama” ng Hebreo at pinananatili ang paralelismo ng “Ito ang pangalan ko … / ito ang aking alaala …”. Hindi nito pinipilit ang isang doktrinal na pagpapakahulugan sa זִכְרִי; ang idiomatikong pagpapaliwanag ay nasa talababa. Nilinaw rin ng mga gitling ang magkakaugnay na apposition kay Yahweh.
