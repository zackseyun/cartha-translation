source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: tl
  text: 'Sinabi pa ng Diyos kay Moises, “Ito ang sabihin mo sa mga anak ni Israel: ‘Si Yahweh,[a] ang Diyos ng inyong mga ama—ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob—ang nagsugo sa akin sa inyo.’ Ito ang pangalan ko magpakailanman, at ito ang aking alaala sa sali’t salinlahi.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; isinasalin ding “Jehova.”'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “ito ang pangalang ipang-aalaala sa akin” o “ito ang aking pag-alaala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang malapit na transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Likas at tradisyonal itong katumbas sa Filipino ng literal na “mga anak na lalaki ni Israel,” at maaari nitong tukuyin ang sambayanang nagmula kay Israel nang hindi nagiging mabigat ang pananalita.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Diyos ng inyong mga ninuno
  rationale: Sa konteksto, ang אבות ay tumutukoy sa mga patriyarkang agad na pinangalanan; malinaw at natural sa modernong Filipino ang “mga ninuno.”
- source_word: שְׁלָחַנִי
  choice: ang nagsugo sa akin
  rationale: Ipinahahayag nito ang natapos na pagsusugo na may bisa sa kasalukuyang pagharap ni Moises sa Israel.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Ito ang pangalan ko magpakailanman
  rationale: Natural na ipinapahayag ng “magpakailanman” ang patuloy at walang takdang bisa ng לְעֹלָם.
- source_word: זִכְרִי
  choice: sa pangalang ito ako aalalahanin
  rationale: Isinasalin ang diwa ng pangngalang mula sa ugat na “alalahanin” bilang pangalang ginagamit sa pag-alaala at pagtawag sa Diyos; pinananatili sa talababa ang mas literal na posibilidad.
- source_word: לְדֹר דֹּר
  choice: sa sali't salinlahi
  rationale: Karaniwan at marangal na idyomang Filipino para sa pagpapatuloy sa bawat sunod na henerasyon.
- source_word: כֹּה תֹאמַר
  choice: Ito ang sabihin mo
  rationale: Direkta at natural na modernong Filipino para sa pormula ng tagubilin, nang hindi nawawala ang awtoritatibong himig.
- source_word: עוֹד
  choice: pa
  rationale: Ipinakikita nitong karugtong pa ito ng sinabi ng Diyos, hindi basta pag-uulit.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ng isang titulo; ipinapaliwanag sa talababa ang anyong YHWH at ang tradisyonal na “Jehova.”
- issue: Mga katawagang pampamilya para sa Israel at sa mga patriyarka
  choice: mga anak ni Israel / inyong mga ninuno
  alternative: mga anak na lalaki ni Israel / inyong mga ama
  rationale: Ang “mga anak ni Israel” ay malapit sa anyong Hebreo at likas sa Filipino bilang kolektibong katawagan. Sa “mga ninuno,” nililinaw ng kasunod na Abraham, Isaac, at Jacob ang panlalaking sanggunian, habang iniiwasan ang posibleng maling pagkaunawa na mga agarang ama lamang ang tinutukoy.
- issue: Kahulugan ng זִכְרִי
  choice: sa pangalang ito ako aalalahanin
  alternative: ito ang aking alaala; ito ang aking pang-alaalang pangalan
  rationale: Ang anyong Hebreo ay maaaring tumukoy sa “alaala” ng Diyos o sa katawagang nagpapanatili ng pag-alaala sa kaniya. Ang pangunahing salin ay malinaw sa Filipino ngunit ang leksikal na alternatibo ay pinanatili sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Sinabi pa” at “Ito ang sabihin mo” para sa natural na daloy ng salaysay. Ang “sali't salinlahi” ay nagpapanatili ng biblikal na dignidad nang hindi makaluma. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
