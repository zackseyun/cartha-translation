translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga Ehipsiyo” bilang pangkaraniwang katawagan at iniwasan ang salitang “biyaya” upang hindi magdagdag ng teolohikal na bigat na hindi hinihingi ng konteksto.
