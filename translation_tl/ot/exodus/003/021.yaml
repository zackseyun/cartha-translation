  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: tl
  text: At pagkakalooban ko ang bayang ito ng pabor sa paningin ng mga Ehipsiyo[a]. At kapag umalis kayo, hindi kayo aalis nang walang dala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa mga mata ng mga Ehipsiyo.”
    reason: lexical_alternative
  - marker: b
    text: O “hindi kayo aalis na walang anumang dala.” Ipinahihiwatig ng idyomang Hebreo na hindi sila aalis nang walang mga ari-arian o panustos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: At bibigyan ko
  rationale: Pinananatili ang karaniwang diwa ng נתן na “magbigay” at ang panghinaharap na kilos.
- source_word: חֵן
  choice: magandang pagtanggap
  rationale: Sa kontekstong panlipunan, tumutukoy ang חֵן sa pabor o mabuting pagtingin. Likas sa modernong Tagalog ang “magandang pagtanggap” at hindi ito kasing teolohikal ng “biyaya.”
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Kolektibong tinutukoy ng עָם ang Israel; ang “bayang ito” ay natural at nagpapanatili sa isahang anyo ng Hebreo.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: sa paningin ng mga Ehipsiyo
  rationale: Malapit ito sa idyomang Hebreo na “sa mga mata ng” at malinaw na nagpapahayag kung paano sila ituturing ng mga Ehipsiyo.
- source_word: וְהָיָה כִּי
  choice: Kaya kapag
  rationale: Ipinakikilala ng pormulang ito ang tiyak na pangyayari sa hinaharap. Ang “kapag” ay likas sa Tagalog; ipinahihiwatig ng “kaya” ang kaugnayan nito sa naunang pangako nang hindi inuulit ang mabigat na literal na pormula.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: umalis kayo / hindi kayo aalis
  rationale: Bagaman karaniwang “pumunta” ang הלך, malinaw sa konteksto na ang tinutukoy ay ang pag-alis ng Israel mula sa Ehipto.
- source_word: רֵיקָם
  choice: nang walang dala
  rationale: Natural na Tagalog ito para sa idyomang nangangahulugang hindi aalis na walang mga ari-arian o panustos.
