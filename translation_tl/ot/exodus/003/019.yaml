  source_fidelity: 'Tumpak ang pangunahing diwa ng talata: batid ng Diyos na hindi pahihintulutan ng hari ng Ehipto ang mga Israelita na umalis. Gayunman, ang “mapilitan siya” ay nagdaragdag ng tahasang pandiwang wala sa eliptikal na Hebreo. Mas maingat na panatilihin ang instrumental na larawan ng “kamay” nang hindi lubos na pinupunan ang sintaks.'
