  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: tl
  text: Ngunit alam kong hindi kayo pahihintulutan ng hari ng Ehipto na umalis[a] maliban sa pamamagitan ng isang makapangyarihang kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring unawain: “hindi kayo pahihintulutan ng hari ng Ehipto na umalis, kahit sa pamamagitan ng isang makapangyarihang kamay.” Eliptikal ang pariralang Hebreo; sa konteksto, maaaring ipahiwatig nito na matinding puwersa lamang ang makapagpapasunod sa hari.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit alam kong
  rationale: Ipinahahayag ng pang-ugnay at ng tahasang panghalip ang pagbibigay-diin at pagsalungat; natural itong naihahatid ng “Ngunit” sa makabagong Tagalog.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Ang anyong ganap ay nagpapahayag dito ng tiyak at matatag na kaalaman ng Diyos; ang pangkasalukuyang “alam ko” ang likas na katumbas sa Tagalog.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: hindi kayo pahihintulutan ... na umalis
  rationale: Ang נתן na may pawatas ay idyomatikong nangangahulugang magpahintulot. Malinaw at natural sa konteksto ang “pahihintulutan ... na umalis.”
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ang hari ng Ehipto
  rationale: Tuwirang salin ito ng pariralang konstrukt at karaniwang katawagan sa Tagalog.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: malibang mapilitan siya ng isang makapangyarihang kamay
  rationale: Siksik at eliptikal ang Hebreo. Ginagawang malinaw ng salin ang malamang na diwang hindi papayag ang hari kung walang mapuwersang kapangyarihan, habang pinananatili ang mahalagang larawang “kamay.” Ang “makapangyarihan” ay mas natural kaysa “malakas” para sa kapangyarihang pumipilit sa kontekstong ito.
theological_decisions:
- issue: Kahulugan ng eliptikal na pariralang וְלֹא בְּיָד חֲזָקָה
  choice: Hindi pahihintulutan ng hari ang Israel na umalis malibang mapilitan siya ng isang makapangyarihang kamay.
  alternative: 'Hindi pahihintulutan ng hari ang Israel na umalis, kahit sa pamamagitan ng isang makapangyarihang kamay; o: hindi siya papayag maliban sa pamamagitan ng isang makapangyarihang kamay.'
  rationale: Sinusuportahan ng kasunod na talata, kung saan sasaktan ng Diyos ang Ehipto sa pamamagitan ng mga kababalaghan, ang diwang mapapasunod lamang ang hari sa ilalim ng matinding puwersa. Gayunman, hindi lubos na tahasan ang sintaks, kaya itinatala sa talababa ang ibang posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Ehipto,” “pahihintulutan,” at “makapangyarihang kamay” upang mapanatili ang karaniwang wikang biblikal nang hindi nagiging lipas o labis na teknikal.
