  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: tl
  text: At sinabi ko[a], ‘Iaahon ko kayo mula sa paghihirap[b] sa Ehipto patungo sa lupain ng mga Cananeo, Heteo, Amoreo, Perezeo, Heveo, at Jebuseo—sa isang lupaing dinadaluyan ng gatas at pulot.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “At sinabi ko na.” Pormal na nasa aspektong nakalipas ang pandiwang Hebreo, ngunit sa konteksto ay maaaring tumukoy sa isang naunang pahayag na nananatiling may bisa.
    reason: alternative_reading
  - marker: b
    text: Ang “paghihirap” ay maaari ring isalin na “kaapihan” o “pagdurusa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Pinananatili nito ang pormal na aspektong nakalipas ng pandiwang Hebreo nang hindi dinaragdagan ang teksto ng tahasang salitang “ipinangako.” Sa konteksto, maaari rin itong unawain bilang nauna ngunit nananatiling may bisa na pahayag ng Diyos.
- source_word: אַעֲלֶה אֶתְכֶם
  choice: Iaahon ko kayo
  rationale: Ang Hiphil ng עלה ay nangangahulugang “paakyatin” o “iahon.” Ang “iaahon” ay natural sa Filipino at pinananatili ang larawan ng pag-akyat o pagdadala paitaas, hindi lamang ang paglabas.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: mula sa paghihirap sa Ehipto
  rationale: Maaaring tumukoy ang עֳנִי sa paghihirap, kaapihan, o pagdurusa. Ang “paghihirap sa Ehipto” ay malinaw at likas sa Filipino habang hindi nililimitahan ang diwa sa isang uri lamang ng pagdurusa.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: patungo sa lupain ng mga Cananeo, Heteo, Amoreo, Perezeo, Heveo, at Jebuseo
  rationale: Ipinahihiwatig ng אֶל ang patutunguhan. Bagaman isahan ang bawat katawagang etniko sa Hebreo, likas sa Filipino ang paggamit ng “mga” para sa mga bayang naninirahan sa lupain.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: sa isang lupaing dinadaluyan ng gatas at pulot-pukyutan
  rationale: Pinananatili ng salin ang matingkad na metapora ng Hebreo tungkol sa kasaganaan at pagkamabunga, sa halip na palitan ito ng paliwanag na “saganang lupain.”
theological_decisions:
- issue: Panahunan at bisa ng pahayag ng Diyos
  choice: At sinabi ko
  alternative: At ipinahayag ko na / At sinabi ko na
  rationale: Pormal na nakalipas ang anyong Hebreo, ngunit sa konteksto ay ipinapahayag nito ang isang naunang pasiyang may patuloy na bisa. Pinili ang mas tuwirang “sinabi ko” at inilagay sa talababa ang posibleng diin sa patuloy na bisa, upang hindi gawing tahasang “pangako” ang isang pandiwang ang payak na kahulugan ay “sabihin.”
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang tradisyonal at madaling makilalang anyo ng mga pangalan ng mga bayan, gayundin ang metaporang “dinadaluyan ng gatas at pulot-pukyutan.”
