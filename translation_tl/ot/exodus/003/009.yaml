  source_fidelity: 'Tumpak ang salin sa Hebreo: napapanatili ang transisyon na “At ngayon,” ang panawag-pansing הִנֵּה sa “narito,” ang daing ng בני ישראל, ang pagdating nito sa Diyos, at ang dagdag na pahayag na nakita rin niya ang pang-aaping patuloy na ginagawa ng mga Ehipsiyo.'
