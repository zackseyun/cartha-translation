id: EXO.3.9
reference: Exodus 3:9
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: tl
  text: 'At ngayon, narito: ang daing ng mga anak ni Israel[a] ay nakarating sa akin[b], at nakita ko rin ang pang-aaping ginagawa sa kanila ng mga Ehipsiyo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Literal na “mga anak na lalaki ni Israel,” isang katawagang pangkatan sa Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “dumating sa akin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang panandang temporal na nagpapakita ng pagpapatuloy at paglipat sa susunod na pahayag.
- source_word: הִנֵּה
  choice: narito
  rationale: Isang panawag-pansin na angkop sa marangal ngunit makabagong Tagalog; iniiwasan ang masyadong literal na utos na tumingin.
- source_word: צַעֲקַת
  choice: ang daing
  rationale: Tumutukoy sa sigaw na bunga ng matinding hirap at paghingi ng saklolo. Mas likas sa konteksto ang “daing” kaysa sa karaniwang “sigaw.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilya at tipanang idyoma ng Hebreo. Sa Tagalog, ang “mga anak” ay likas na maaaring tumukoy sa mga supling bilang isang pangkat.
- source_word: בָּאָה אֵלַי
  choice: ay nakarating sa akin
  rationale: Likas na Tagalog para sa isang daing na “dumating” sa Diyos, habang pinananatili ang larawan ng Hebreo.
- source_word: וְגַם
  choice: at ... rin
  rationale: Pinananatili ang pandagdag na diin sa isang natural na ayos sa Tagalog.
- source_word: רָאִיתִי
  choice: nakita ko
  rationale: Tuwirang salin ng ganap na pandiwa; sa konteksto, ang pagkakita ay may kasalukuyang kaugnayan sa pagkilos ng Diyos.
- source_word: הַלַּחַץ
  choice: ang pang-aapi
  rationale: Ipinahihiwatig ng pangngalan ang mapaniil na paggigipit; “pang-aapi” ang malinaw at karaniwang katumbas sa kontekstong panlipunan.
- source_word: אֲשֶׁר ... לֹחֲצִים אֹתָם
  choice: ginagawa sa kanila
  rationale: Likas na binubuo sa Tagalog kasama ng “pang-aapi,” at ipinahihiwatig ang nagpapatuloy na pagkilos nang hindi gumagamit ng alanganing pag-uulit na “pang-aaping ipinang-aapi.”
- source_word: מִצְרַיִם
  choice: mga Ehipsiyo
  rationale: Bagaman anyong pangalang pantangi ang salita, ang pangmaramihang participle ay nagpapakitang ang mga taga-Ehipto ang kolektibong gumagawa ng pang-aapi.
theological_decisions:
- issue: Pampamilya at tipanang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang talinghagang pampamilya ng orihinal nang hindi nililimitahan sa mga lalaking Israelita, sapagkat ang Tagalog na “anak” ay hindi nakatali sa kasarian.
- issue: Panawag-pansing הִנֵּה
  choice: narito
  alternative: masdan mo
  rationale: Ang “narito” ay nagpapanatili sa biglang pagtutuon ng pansin, samantalang ang “masdan mo” ay maaaring maling magpahiwatig na literal na ipinakikitang makita ni Moises ang daing.
- issue: Pagkakita ng Diyos sa pang-aapi
  choice: nakita ko rin
  alternative: nalaman ko rin
  rationale: Pinananatili ang kongkretong pandiwang “makita” at hindi ito pinapaliit sa kaalamang intelektuwal lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pampamilya at tipanang idyoma, ang panawag-pansin na “narito,” at ang kongkretong larawan ng daing na nakararating sa Diyos. Isinaayos ang huling parirala upang maging likas sa Tagalog nang hindi nawawala ang nagpapatuloy na pang-aapi ng mga Ehipsiyo.
