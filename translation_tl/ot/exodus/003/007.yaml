id: EXO.3.7
reference: Exodus 3:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: tl
  text: At sinabi ni Yahweh, “Talagang nakita ko ang paghihirap ng aking bayan na nasa Ehipto, at narinig ko ang kanilang daing dahil sa mga nagpapahirap sa kanila,[a] sapagkat alam ko ang kanilang mga pagdurusa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dahil sa mga tagapagpagawa sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: רָאֹה רָאִיתִי
  choice: Talagang nakita ko
  rationale: Ang infinitive absolute na kasama ng pandiwang may takdang anyo ay nagbibigay-diin sa pagkakita; natural na ipinahahayag ito ng “talagang” sa makabagong Tagalog.
- source_word: עֳנִי
  choice: paghihirap
  rationale: Saklaw nito ang kaawa-awang kalagayan at pagdurusang dulot ng malupit na pang-aapi, nang hindi nililimitahan ang salita sa isang sanhi lamang.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Natural at marangal na salin ng tipanang pagtukoy sa Israel bilang bayan ng Diyos.
- source_word: בְּמִצְרָיִם
  choice: na nasa Ehipto
  rationale: Malinaw na inuugnay ang pariralang lokatibo sa “aking bayan.”
- source_word: צַעֲקָתָם
  choice: kanilang daing
  rationale: Ipinahahayag ang malakas na paghingi ng tulong na nagmumula sa matinding paghihirap; mas angkop dito kaysa sa karaniwang “sigaw.”
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: dahil sa mga nagpapahirap sa kanila
  rationale: Ipinahahayag ang sanhi ng kanilang daing at ang papel ng נֹגֵשׂ bilang mga taong sapilitang nagpapagawa o naniningil; hindi ito labis na nililimitahan sa isang teknikal na katawagan.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang paliwanag o batayan ng naunang pahayag.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Bagaman perfect ang anyong Hebreo, ipinahahayag nito rito ang kasalukuyan at personal na pagkabatid ng Diyos.
- source_word: מַכְאֹבָיו
  choice: kanilang mga pagdurusa
  rationale: Natural na sumasaklaw sa sari-saring sakit at dalamhating dinaranas ng bayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang YHWH
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Pinananatili ang personal at tipanang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng paliwanag na wala sa talata.
- issue: Wikang naglalarawan sa kaalaman ng Diyos sa pagdurusa
  choice: alam ko ang kanilang mga pagdurusa
  alternative: batid ko ang kanilang mga pagdurusa; napansin ko ang kanilang mga pasakit
  rationale: Pinananatili ang tuwiran at personal na lakas ng יָדַעְתִּי, sa halip na gawing malamig na kamalayan o ipakahulugang isang tiyak na pagkilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “At sinabi” upang sundan ang Hebreong salaysay nang hindi pinabigat ang estilo. Ang “talagang” ay likas na Tagalog na panumbas sa mariing konstruksiyong Hebreo. Nilagyan lamang ng talababa ang נֹגְשׂ dahil mahalaga ang alternatibong mas teknikal na kahulugan nito sa konteksto ng sapilitang paggawa.
