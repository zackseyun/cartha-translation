base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: tl
  text: At sinabi niya, “Ako ang Diyos ng iyong ama, ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob.” Itinago ni Moises ang kanyang mukha, sapagkat natakot siyang tumingin sa Diyos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa marangal na salaysay sa Filipino ang “At sinabi niya,” at pinananatili nito ang pagkakasunod ng mga pangyayari.
- source_word: אָנֹכִי
  choice: Ako ang
  rationale: Mariin ang hiwalay na panghalip. Sa sugnay na nagpapakilala, natural na katumbas sa Filipino ang “Ako ang,” na taglay ang diin ng Hebreo.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: ang Diyos ng iyong ama
  rationale: Tuwirang pinananatili ang isahang “ama” at ang pormula ng pagkakakilanlan; hindi ito ginawang “mga ninuno.”
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob
  rationale: Inuulit ang “ang Diyos ni” gaya ng inuulit ang construct phrase sa Hebreo, upang mapanatili ang retorikal at tipanang diin.
- source_word: וַיַּסְתֵּר ... פָּנָיו
  choice: Tinakpan ... ang kanyang mukha
  rationale: Ang Hiphil ay nangangahulugang itago o ikubli. Sa ganitong pisikal na kilos, natural sa Filipino ang “tinakpan ang kanyang mukha” at malinaw nitong ipinahihiwatig ang pag-iwas na tumingin.
- source_word: כִּי יָרֵא
  choice: sapagkat natakot siya
  rationale: Pinananatili ng “sapagkat” ang sanhi na ipinahahayag ng כִּי, samantalang natural na inilalarawan ng “natakot siya” ang kalagayang ipinahihiwatig ng יָרֵא.
- source_word: מֵהַבִּיט אֶל הָאֱלֹהִים
  choice: tumingin sa Diyos
  rationale: Pagkatapos ng pandiwa ng pagkatakot, likas sa Filipino ang “natakot siyang tumingin.” Ang “sa Diyos” ang natural na katumbas ng direksiyon ng אֶל sa kontekstong ito.
theological_decisions:
- issue: Paglilipat ng אֱלֹהִים sa tuwirang pagpapakilala ng Diyos at pagpapakita niya kay Moises
  choice: Diyos
  alternative: isang banal na nilalang
  rationale: Malinaw na ang nagsasalita ay ang Diyos ng mga patriyarka. Ang “Diyos” ay nagpapanatili sa tiyak na tinutukoy nang hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Pagpapanatili sa paulit-ulit na pormulang אֱלֹהֵי
  choice: ang Diyos ni Abraham, ang Diyos ni Isaac, at ang Diyos ni Jacob
  alternative: ang Diyos nina Abraham, Isaac, at Jacob
  rationale: Ang pag-uulit ay tahasang nasa Hebreo at may retorikal at tipanang bigat; hindi ito pinaikli bilang isang buod.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Pinanatili ang pag-uulit ng pormulang patriyarkal at ang isahang “iyong ama.” Walang footnote na kailangan dahil walang mahalagang tekstuwal o leksikal na kalabuan na hindi kayang dalhin ng pangunahing salin.
