language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: tl
  text: 'Pumunta ka at tipunin mo ang mga nakatatanda ng Israel. Sabihin mo sa kanila, ‘Si Yahweh, ang Diyos ng inyong mga ama[a]—ang Diyos nina Abraham, Isaac, at Jacob—ay nagpakita sa akin at nagsabi: “Talagang binigyang-pansin ko kayo[b] at ang ginawa sa inyo sa Egipto.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “inyong mga ama.” Partikular itong tinutukoy ng kasunod na parirala: “ang Diyos nina Abraham, Isaac, at Jacob.” Maaari ring gamitin sa mas malawak na Tagalog ang “inyong mga ninuno.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin, “Talagang dinalaw ko kayo” o “Tiyak na inasikaso ko kayo.” Inuulit sa Hebreo ang ugat ng pandiwa upang idiin ang mapagpasiyang pagbibigay-pansin ng Diyos na humahantong sa pagkilos, hindi lamang isang karaniwang pagdalaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָסַפְתָּ
  choice: Pumunta ka at tipunin mo
  rationale: Pinananatili ang dalawang tuwirang utos, habang gumagamit ng likas na anyong pautos sa makabagong Tagalog.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: ang matatandang pinuno ng Israel
  rationale: Sa kontekstong ito, ang זְקֵנִים ay hindi lamang matatanda sa edad kundi kinikilalang mga pinuno ng pamayanan; nililinaw ito nang hindi gumagamit ng di-likas na katawagang “mga matanda ng Israel.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal na nakasulat sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: ang Diyos ng inyong mga ninuno
  rationale: Ang “mga ninuno” ang natural at marangal na salin sa makabagong Tagalog; nililinaw agad ng kasunod na parirala na partikular na tinutukoy sina Abraham, Isaac, at Jacob.
- source_word: נִרְאָה אֵלַי
  choice: nagpakita sa akin
  rationale: Ito ang karaniwang diwa ng Niphal ng ראה kapag tumutukoy sa pagpapakita ng Diyos at likas itong pakinggan sa Tagalog.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: ang Diyos nina Abraham, Isaac, at Jacob
  rationale: Pinananatili nang buo ang pagkakakilanlan ng Diyos kaugnay ng mga patriyarka; ang “nina” ang natural na panandang Tagalog para sa magkakasunod na pangalang pantangi.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Talagang binigyang-pansin ko kayo
  rationale: Ipinahahayag ng “talagang” ang pagpapaigting ng infinitive absolute at pandiwa. Ang “binigyang-pansin” ay nagpapakita ng sinadyang malasakit at pagkilos, bagaman hindi nito lubusang isinasara ang malawak na diwa ng פקד.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: at ang ginagawa sa inyo
  rationale: Pinananatili ang pasibong pagtukoy sa masamang pagtrato nang hindi nagdaragdag ng tahasang gumagawa na wala sa Hebreo. Ang participle ay natural na maisasalin bilang nagpapatuloy na “ginagawa.”
- source_word: בְּמִצְרָיִם
  choice: sa Egipto
  rationale: Ginagamit ang karaniwang makabagong anyo ng pangalan ng bansa sa Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Saklaw ng פקד sa pahayag ng Diyos
  choice: binigyang-pansin
  alternative: dinalaw
  rationale: Maaaring ipakahulugan ang pandiwa bilang pagdalaw, pagsisiyasat, pag-aasikaso, o mapagpasiyang pagbibigay-pansin na humahantong sa pagkilos. Ang pangunahing salin ay umiiwas sa impresyon ng karaniwang pakikipagdalaw, habang kinikilala sa talababa ang tradisyonal at posibleng alternatibo.
- issue: Panahunan ng הֶעָשׂוּי
  choice: ang ginagawa sa inyo
  alternative: ang ginawa sa inyo
  rationale: Ang anyong participle ay maaaring tumukoy sa umiiral o nagpapatuloy na pagtrato; sa salaysay, nagpapatuloy pa ang pang-aapi sa Egipto. Gayunman, posible ring idiin ang naganap nang pagtrato.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maipahayag ang tungkuling panlipunan ng זִקְנֵי, at “mga ninuno” para sa natural na daloy habang pinananatili sa talababa ang literal na “mga ama.”
