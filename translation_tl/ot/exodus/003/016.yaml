  naturalness: Ang binagong anyo ay makabago ngunit marangal na Filipino. Ang “mga nakatatanda ng Israel” ay malinaw na katawagan para sa kinikilalang pangkat, at ang pag-uugnay sa “Diyos ng inyong mga ama” at “Diyos nina Abraham, Isaac, at Jacob” ay dumadaloy nang natural.
  terminology: Pinanatili ang “Yahweh,” “Diyos,” at “Egipto.” Isinauli ang “inyong mga ama” upang mapanatili ang tiyak na patriyarkal na terminolohiya ng Hebreo; ipinaliliwanag ng talababa ang posibleng mas malawak na Tagalog na “mga ninuno” nang hindi ito ginagawang pangunahing salin.
