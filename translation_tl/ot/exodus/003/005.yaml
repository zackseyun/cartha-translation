  text: וַ/יֹּ֖אמֶר אַל תִּקְרַ֣ב הֲלֹ֑ם שַׁל נְעָלֶ֨י/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔י/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔י/ו אַדְמַת קֹ֖דֶשׁ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: tl
  text: Pagkatapos ay sinabi niya, “Huwag kang lumapit dito. Hubarin mo ang iyong mga sandalyas, sapagkat ang lugar na kinatatayuan mo ay banal na lupa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay; likas sa modernong Tagalog ang “Pagkatapos ay” at napapanatili nito ang pagkakasunod-sunod.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Huwag kang lumapit dito
  rationale: Ang אַל na may pandiwang imperfect/jussive ay pagbabawal, at ang הֲלֹם ay tumutukoy sa kinaroroonang lugar.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Hubarin mo ang iyong mga sandalyas
  rationale: Ang “hubarin” ay likas na pandiwa sa Tagalog para sa pagtanggal ng suot sa paa. Hindi na kailangang tahasang ulitin ang “mula sa iyong mga paa,” sapagkat malinaw na iyon sa “mga sandalyas” at magiging mabigat ang parirala.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang “sapagkat” ay malinaw, marangal, at angkop sa rehistro ng salaysay.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: ang lugar na kinatatayuan mo
  rationale: Likas at eksaktong ipinahahayag ng “kinatatayuan” ang kasalukuyang pagtayo ni Moises sa lugar na tinutukoy.
- source_word: אַדְמַת קֹדֶשׁ
  choice: banal na lupa
  rationale: Ang construct phrase ay literal na “lupa ng kabanalan”; ang “banal na lupa” ang malinaw at natural na katumbas sa Tagalog.
- source_word: הוּא
  choice: ay
  rationale: Gumaganap ang panghalip bilang copular conclusion; natural itong naipahahayag sa Tagalog sa panandang “ay.”
theological_decisions:
- issue: Kalikasan ng kabanalan ng lugar
  choice: Ilarawan lamang ang lugar bilang “banal na lupa” nang walang idinagdag na paliwanag.
  alternative: Tahasan itong ipaliwanag bilang banal dahil sa presensiya ng Diyos.
  rationale: Tuwirang sinasabi ng talata na banal ang lupa ngunit hindi nito mismo ipinapaliwanag ang pinagmulan o mekanismo ng kabanalang iyon; pinananatili ng salin ang pahayag nang walang dagdag na interpretasyong teolohikal.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “sandalyas” upang mapanatili ang konkretong kontekstong pangkultura. Walang talababa dahil walang mahalagang kalabuan sa Hebreo na nangangailangan ng paliwanag para sa talatang ito; ang ibinigay na English footnote a ay hindi tumutugma sa marker nito, at ang footnote b ay mas angkop sana sa “banal na lupa” kaysa sa utos tungkol sa sandalyas.
