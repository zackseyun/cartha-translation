  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: tl
  text: Bumaba ako upang iligtas siya mula sa kamay ng Ehipto[a] at upang iahon siya[b] mula sa lupaing iyon patungo sa isang mabuti at maluwang na lupain[c]—isang lupaing dinadaluyan ng gatas at pulot—patungo sa lugar ng mga Cananeo, Heteo, Amoreo, Perezeo, Heveo, at Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kamay ng Ehipto” ay isang Hebreong idyoma para sa kapangyarihan o kontrol ng Ehipto.
    reason: lexical_alternative
  - marker: b
    text: Pang-isahan sa Hebreo ang “siya” sa “iligtas siya” at “iahon siya”; tumutukoy ito sa Israel bilang isang buong bayan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “isang mabuti at malawak na lupain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Bumaba ako
  rationale: Pinananatili ang kongkretong pananalitang tumutukoy sa pagbaba ng Diyos at ang ganap na kilos sa salaysay, sa halip na ipaliwanag lamang ito bilang pakikialam.
- source_word: לְהַצִּילוֹ
  choice: upang iligtas siya
  rationale: Ipinahahayag ng Hiphil ng נצל ang pagsagip mula sa panganib o kapangyarihan. Ang “iligtas” ay natural sa Filipino at akma sa kongkretong pagliligtas sa konteksto.
- source_word: מִיַּד מִצְרַיִם
  choice: mula sa kamay ng Ehipto
  rationale: Pinananatili ang Hebreong larawan ng kamay bilang kapangyarihan o kontrol. Ang talababa ay nagpapaliwanag sa idyoma nang hindi ito inaalis sa pangunahing teksto.
- source_word: וּלְהַעֲלֹתוֹ
  choice: upang iahon siya
  rationale: Ang Hiphil ng עלה ay “paakyatin” o “iahon.” Ang “iahon” ay natural at pinananatili ang heograpiko at patayong larawan ng paglabas mula sa Ehipto.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: mula sa lupaing iyon
  rationale: Tuwirang isinasalin ang demonstratibong parirala at pinananatili ang pagtukoy pabalik sa Ehipto.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: patungo sa isang mabuti at maluwang na lupain
  rationale: Ang “mabuti” ay tumutugma sa טוֹבָה, at ang “maluwang” ay natural na naghahatid ng lawak at kaluwagan ng רְחָבָה.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing umaagos ang gatas at pulot-pukyutan
  rationale: Pinananatili ang masiglang larawang Hebreo ng pag-agos bilang sagisag ng kasaganaan. Ang “pulot-pukyutan” ay malinaw at karaniwang katumbas ng honey sa modernong Filipino.
- source_word: אֶל מְקוֹם
  choice: patungo sa lugar ng
  rationale: Pinananatili ang literal na diwa ng מָקוֹם bilang “lugar,” sa halip na palitan ito ng mas interpretatibong “teritoryo” o “lupain.”
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: mga Cananeo, Heteo, Amoreo, Perezeo, Heveo, at Jebuseo
  rationale: Bagaman pang-isahang kolektibo ang mga etnonimo sa Hebreo, likas sa Filipino ang “mga” kapag tinutukoy ang bawat pangkat ng mga tao. Hindi nito binabago ang kolektibong sanggunian.
theological_decisions:
- issue: Antropomorpikong pagkilos ng Diyos sa “bumaba ako”
  choice: Panatilihin ang literal na pananalita tungkol sa pagbaba
  alternative: Ipaliwanag bilang “kumilos ako” o “nakialam ako”
  rationale: Ang teksto mismo ay naglalarawan sa pagkilos ng Diyos sa paraang spatial at antropomorpiko. Ang pagpapanatili nito ay gumagalang sa salaysay at hindi pinapawi ang teolohikong tensiyon ng larawan.
- issue: Pang-isahang kolektibong panghalip para sa Israel
  choice: Gamitin ang “siya” sa dalawang kilos
  alternative: Gamitin ang “sila” para sa kolektibong bayan
  rationale: Pang-isahan ang dalawang hulaping panghalip sa Hebreo at inilalarawan ang Israel bilang isang kolektibong persona. Ang “siya” ay malinaw sa Filipino at pinananatili ang pananaw ng pinagmulang teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang matitingkad na larawang Hebreo (“bumaba,” “kamay,” “iahon,” at “umaagos”) habang gumamit ng natural na sintaks at karaniwang anyo ng mga pangalan ng sinaunang bayan sa Filipino.
