  to: Bumaba ako upang iligtas siya mula sa kamay ng Ehipto[a] at upang iahon siya[b] mula sa lupaing iyon patungo sa isang mabuti at maluwang na lupain[c]—isang lupaing dinadaluyan ng gatas at pulot—patungo sa lugar ng mga Cananeo, Heteo, Amoreo, Perezeo, Heveo, at Jebuseo.
