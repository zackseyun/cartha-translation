revisions:
- from: Hihingi ang bawat babae sa kanyang kapitbahay at sa babaeng naninirahan sa bahay nito[a] ng mga kagamitang pilak at ginto[b], at ng mga damit. Isusuot ninyo ang mga ito sa inyong mga anak na lalaki at babae. Sa gayon, sasamsaman ninyo ang Ehipto[c].
  to: Hihingi ang bawat babae sa kanyang kapitbahay at sa babaeng naninirahan sa kanyang bahay[a] ng mga bagay na pilak at mga bagay na ginto[b], at mga damit. Ilalagay ninyo ang mga ito sa inyong mga anak na lalaki at babae. Sa gayon, sasamsaman ninyo ang Ehipto[c].
  rationale: 'Inayos ang mga salitang maaaring magpaliit o maglinaw nang lampas sa Hebreo: “ilalagay” ang mas malawak na katumbas ng שׂים + עַל, at “sa kanyang bahay” kasama ng talababa ang nagpapanatili sa hindi ganap na tiyak na referent. Ginawang parallel ang mga bagay na pilak at ginto upang malinaw na magkahiwalay ang dalawang parirala sa pinagmulan.'
