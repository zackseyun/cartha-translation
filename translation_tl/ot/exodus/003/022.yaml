  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: tl
  text: Hihingi ang bawat babae sa kanyang kapitbahay at sa babaeng naninirahan sa kanyang bahay[a] ng mga bagay na pilak at mga bagay na ginto[b], at mga damit. Ilalagay ninyo ang mga ito sa inyong mga anak na lalaki at babae. Sa gayon, sasamsaman ninyo ang Ehipto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “kanyang bahay” sa bahay ng babaeng humihingi o sa bahay ng babaeng kapitbahay/naninirahan.
    reason: lexical_alternative
  - marker: b
    text: Malawak ang salitang Hebreo at maaari ring tumukoy sa mga kagamitan o sisidlang yari sa pilak at ginto.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring: “huhubaran ninyo ng ari-arian ang Ehipto.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: Hihingi
  rationale: Ang שׁאל ay pangunahing nangangahulugang humingi o humiling; hindi nito likas na ipinahihiwatig ang paghiram at pagsasauli.
- source_word: אִשָּׁה
  choice: ang bawat babae
  rationale: Ang di-tiyak na isahan ay ginamit nang distributibo, kaya natural sa Tagalog ang “bawat babae.”
- source_word: מִשְּׁכֶנְתָּהּ
  choice: sa kanyang kapitbahay
  rationale: Tumutukoy ito sa babaeng kapitbahay, ngunit sapat at natural ang karaniwang-gender na “kapitbahay” sa Tagalog.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: sa babaeng naninirahan sa bahay nito
  rationale: Pinananatili ng “naninirahan” ang diwa ng גור na paninirahan bilang dayuhan o pansamantalang residente, habang ang “nito” ay tumutukoy sa bahay ng kapitbahay ayon sa pinakamalapit na antecedent.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: mga kagamitang pilak at ginto
  rationale: Malawak ang saklaw ng כְּלִי—bagay, sisidlan, o kagamitan—kaya hindi ito nilimitahan sa alahas o sisidlan lamang.
- source_word: וּשְׂמָלֹת
  choice: mga damit
  rationale: Karaniwan at malawak na salin ito para sa mga kasuotan.
- source_word: וְשַׂמְתֶּם עַל
  choice: Isusuot ninyo ... sa
  rationale: Sa konteksto ng mga anak at ng mga bagay at damit, natural na ipinahahayag ng “isusuot” ang paglalagay ng mga ito sa kanila.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: inyong mga anak na lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa mga anak na lalaki at babae nang hindi inuulit ang salitang “anak” nang di-kailangan.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: Sa gayon, sasamsaman ninyo ang Ehipto
  rationale: Ang Piel ng נצל dito ay may malakas na diwa ng pagsamsam o paghubad sa ari-arian; malinaw at natural ang “sasamsaman.”
theological_decisions:
- issue: Posibleng pagpapalambot sa pagkuha ng Israel sa mga ari-arian ng mga Ehipsiyo
  choice: sasamsaman ninyo ang Ehipto
  alternative: huhubaran ninyo ng ari-arian ang Ehipto
  rationale: Hindi pinalalambot ng salin ang נצל at hindi rin ipinahihiwatig na ito ay simpleng pangungutang na may obligasyong isauli.
- issue: Pagkakakilanlan ng babaeng naninirahan sa bahay
  choice: sa bahay nito, na tumutukoy sa kapitbahay
  alternative: sa kanyang bahay, na maaaring tumukoy sa bahay ng babaeng Israelita
  rationale: Mas natural sa sintaks na ang ikinakabit na hulapi sa בֵּיתָהּ ay tumukoy sa pinakamalapit na babaeng binanggit, ngunit kinikilala sa talababa ang posibleng ibang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “hihingi,” hindi “hihiram,” upang sundin ang karaniwang kahulugan ng Hebreo at maiwasang magpasok ng ideya ng pagsasauli. Pinanatili ang matinding diwa ng pangwakas na pandiwa sa “sasamsaman.”
