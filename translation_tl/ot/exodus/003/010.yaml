  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: tl
  text: Kaya ngayon, humayo ka. Isusugo kita kay Faraon, at ilabas mo mula sa Ehipto ang aking bayan, ang mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas karaniwang pananalita, “ang mga Israelita.” Sa Hebreo: “ang mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahihiwatig nito ang paglipat mula sa naunang pahayag tungo sa atas na kasunod; natural sa Filipino ang “Kaya ngayon” bilang panandang diskursibo.
- source_word: לְכָה
  choice: humayo ka
  rationale: Ang pautos ng הלך ay nag-aatas kay Moises na umalis at tuparin ang misyon. Mas malinaw dito ang direksiyong “humayo” kaysa “halika,” habang nananatiling marangal ang himig.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Isusugo kita
  rationale: Tuwirang ipinapahayag ang banal na pagsusugo nang hindi nagdaragdag ng layunin o kondisyong wala sa Hebreo.
- source_word: אֶל־פַּרְעֹה
  choice: kay Faraon
  rationale: Karaniwang anyong Filipino para sa payak na pariralang patungo sa isang tao o pinuno.
- source_word: וְהוֹצֵא
  choice: at ilabas mo
  rationale: 'Pinananatili ng pautos na “ilabas” ang causative na diwa ng Hiphil: si Moises ang inaatasang maging kasangkapan upang makalabas ang bayan.'
- source_word: עַמִּי
  choice: ang aking bayan
  rationale: Pinananatili ang tuwirang pag-aangkin at ang bigat ng ugnayang tipan sa pariralang “aking bayan.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang literal na katawagang pampamilya at ang kaugnayan ng bayan sa ninunong si Israel; inilalagay sa talababa ang mas idyomatikong katawagang etniko.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Kasama ng “ilabas,” malinaw nitong ipinapahayag ang pag-alis mula sa Ehipto sa natural na ayos ng Filipino.
theological_decisions:
- issue: Paglalarawan sa bayang tipan sa בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang anyong pampamilya at ang pagkakaugnay sa ninunong si Israel, nang hindi nililimita ang tinutukoy sa mga literal na anak lamang; ibinibigay sa talababa ang mas karaniwang katawagang Filipino.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang “humayo” upang malinaw na ipahayag ang atas na umalis, at pinanatili ang “mga anak ni Israel” upang katawanin ang anyong pampamilya ng Hebreo.
