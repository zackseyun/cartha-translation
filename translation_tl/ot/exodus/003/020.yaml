base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: tl
  text: Iuunat ko ang aking kamay[a] at hahampasin ko ang Ehipto sa pamamagitan ng lahat ng aking kamangha-manghang gawa na gagawin ko sa gitna nito. Pagkatapos niyon, paaalisin niya kayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ipapadala ko ang aking kamay.” Ang idyomang Hebreo ay tumutukoy sa pag-unat ng kamay upang kumilos o gumamit ng kapangyarihan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “palalayain niya kayo.” Mas literal sa Hebreo ang “paaalisin niya kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: Iuunat ko ang aking kamay
  rationale: Pinananatili nito ang kongkretong larawan ng idyomang Hebreo tungkol sa pagkilos at kapangyarihan ng Diyos, habang natural ang pagkakasabi sa modernong Tagalog.
- source_word: וְהִכֵּיתִי
  choice: at hahampasin ko
  rationale: Ang נכה ay nangangahulugang humampas o manakit. Ang “hahampasin” ay malinaw at hindi labis na tumutukoy sa pagpatay o ganap na pagwasak.
- source_word: מִצְרַיִם
  choice: ang Ehipto
  rationale: Ang tuwirang layon ay ang Ehipto bilang lupain at bansa, hindi lamang ang mga indibidwal na Ehipsiyo.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: sa pamamagitan ng lahat ng aking kamangha-manghang gawa
  rationale: Ipinahahayag ng נִפְלְאוֹת ang pambihirang mga pagkilos na pumupukaw ng paghanga. Malinaw sa ordinaryong mambabasa ang “kamangha-manghang gawa” at hindi ito nagdadala ng di-kinakailangang pahiwatig ng mahika.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: na gagawin ko
  rationale: Tuwiran at payak na salin ito ng sugnay, na pinananatili ang karaniwang diwa ng עשה.
- source_word: בְּקִרְבּוֹ
  choice: sa gitna nito
  rationale: Pinananatili ang pang-isahang hulapi na tumutukoy sa Ehipto bilang isang kabuuan at ang larawang pansaklaw ng mga gawang magaganap sa loob nito.
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos niyon
  rationale: Natural na ipinakikita nito ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: paaalisin niya kayo
  rationale: Malapit ito sa literal na diwang “ipapadala palabas” at pinananatili ang lakas ng pagpapalabas, sa halip na gawing simpleng pahintulot lamang.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: Panatilihin ang larawang “Iuunat ko ang aking kamay”
  alternative: Gawing abstrakto bilang “ipakikita ko ang aking kapangyarihan”
  rationale: Gumagamit ang Hebreo ng kongkretong larawan ng kamay para sa makapangyarihang pagkilos ng Diyos. Ang pagpapanatili nito ay tapat sa teksto at hindi nangangailangan ng doktrinal na pagpapaliwanag.
- issue: Tinutukoy ng panghalip na “niya”
  choice: Panatilihin ang panghalip na ipinahihiwatig ng konteksto na tumutukoy sa Paraon
  alternative: Isingit nang tahasan ang “Paraon”
  rationale: Walang tahasang pangngalan sa talatang Hebreo. Pinananatili ng panghalip ang anyo ng pinagmulan at umaasa sa malinaw na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang kongkretong larawan ng kamay at ang pang-isahang pagtukoy sa Ehipto; iniwasan ang sobrang makaluma o denominasyonal na pananalita.
