base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: tl
  text: Nang makita ni Yahweh na lumihis siya upang tumingin, tinawag siya ng Diyos mula sa gitna ng palumpong[a] at sinabi, “Moises, Moises!” Sumagot siya, “Narito ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “palumpong” ay maaari ring tumukoy nang mas tiyak sa isang matinik na palumpong.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang panatilihin ang personal na pangalang nasa tekstong Hebreo at maipakita ang pagkakaiba nito sa אֱלֹהִים sa kasunod na sugnay.
- source_word: וַיַּרְא
  choice: nang makita
  rationale: Ang ראה ay karaniwang “makita”; ang “nang” ay likas na nag-uugnay sa pagkakita ni Yahweh at sa sumunod niyang pagtawag.
- source_word: כִּי סָר לִרְאוֹת
  choice: na lumihis siya upang tingnan iyon
  rationale: Pinananatili ng “lumihis” ang diwa ng סור na pagtalikod o paglihis sa dinaraanan, at ng “upang tingnan” ang layuning ipinahihiwatig ng infinitibong לִרְאוֹת. Idinagdag ang “iyon” bilang likas na layon sa Filipino, na tumutukoy sa pambihirang tanawin sa konteksto.
- source_word: וַיִּקְרָא אֵלָיו
  choice: tinawag siya
  rationale: Likas sa modernong Filipino ang “tinawag siya” para sa קרא אֶל; hindi na kailangang gawing “tumawag sa kaniya” upang maipahayag ang pagtawag na nakatuon kay Moises.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Ang karaniwang katumbas ng אֱלֹהִים dito ay “Diyos,” habang pinananatili ang pagkakaiba nito sa pangalang Yahweh.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: mula sa gitna ng palumpong
  rationale: Tuwirang pinananatili ng “mula sa gitna” ang lokatibong larawan ng מִתּוֹךְ. Ang “palumpong” ay natural at sapat na malawak na katumbas ng סְנֶה.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Moises, Moises!
  rationale: Pinananatili ang dobleng pagtawag sa pangalan, na nagpapahayag ng tuwiran at mariing pakikipag-usap.
- source_word: הִנֵּנִי
  choice: Narito ako
  rationale: Ito ang likas at tradisyonal na ekspresyon sa Filipino para sa tugon ng presensiya at kahandaang nakapaloob sa הִנֵּנִי, nang hindi dinaragdagan ng tahasang pagsunod na wala sa salita.
theological_decisions:
- issue: Magkasunod na paggamit ng יְהוָה at אֱלֹהִים
  choice: Isinalin bilang “Yahweh” at “Diyos,” ayon sa pagkakasunod.
  alternative: Gawing “Diyos” ang dalawang katawagan, o gawing “PANGINOON” ang יְהוָה.
  rationale: Sinasalamin nito ang sadyang leksikal na pagkakaiba sa tekstong Hebreo at hindi pinapantay ang personal na pangalan at ang katawagang Diyos.
- issue: Tinutukoy ng huling וַיֹּאמֶר
  choice: Ginawang “Sumagot siya,” na ang tinutukoy ay si Moises.
  alternative: “At sinabi ni Moises.”
  rationale: Malinaw sa palitan ng pananalita na si Moises ang tumutugon. Ang “sumagot” ay natural sa Filipino at hindi nagdaragdag ng nilalamang teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na daloy ng salaysay, ang dobleng pagtawag sa pangalan, at ang pagkakaiba ng “Yahweh” at “Diyos.”
