  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: tl
  text: Nagpapastol si Moises ng kawan ng biyenan niyang si Jetro, na pari ng Midian. Inakay niya ang kawan sa kabila ng ilang[a] at nakarating sa bundok ng Diyos na Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa dulong bahagi ng ilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: si Moises
  rationale: Hindi na isinalin nang hiwalay ang ו bilang “at” o “ngayon,” sapagkat nagsisilbi itong panandang pasalaysay sa bagong tagpo; natural sa Tagalog ang tuwirang pagsisimula sa pangalan.
- source_word: הָיָה רֹעֶה
  choice: nagpapastol
  rationale: Ipinahihiwatig ng anyong pandiwa ang nagpapatuloy na gawain sa nakaraan. Likas sa Tagalog na pasalaysay ang “nagpapastol” nang hindi na kailangang magdagdag ng tahasang “noon.”
- source_word: צֹאן
  choice: kawan
  rationale: Ang salita ay tumutukoy sa maliliit na alagang hayop bilang isang pangkat, karaniwang mga tupa at kambing; pinananatili ng “kawan” ang kolektibong diwa nang hindi nililimitahan sa isang uri lamang.
- source_word: יִתְרוֹ חֹתְנוֹ
  choice: biyenan niyang si Jetro
  rationale: Natural at malinaw sa makabagong Tagalog ang ayos na ito para tukuyin ang kaugnayan ni Jetro kay Moises. Hindi na tinukoy ang kasarian sa salitang “biyenan,” yamang malinaw na lalaki si Jetro sa konteksto.
- source_word: כֹּהֵן מִדְיָן
  choice: pari ng Midian
  rationale: Tuwirang inilalarawan nito ang tungkulin ni Jetro at pinananatili ang ugnayang nasa pariralang Hebreo.
- source_word: וַיִּנְהַג
  choice: Inakay niya
  rationale: Maaaring mangahulugang nagtaboy, nanguna, o gumabay ang pandiwa. Ang “inakay” ay natural sa paggalaw ng isang kawan at hindi nagdaragdag ng di-kinakailangang marahas na himig.
- source_word: אַחַר הַמִּדְבָּר
  choice: sa kabila ng ilang
  rationale: Sa kontekstong pangheograpiya, malamang na tumutukoy ito sa dako sa kabila o dulong bahagi ng ilang. Ang pangunahing salin ay maikli at natural, habang inilalahad sa talababa ang isa pang posibleng pagpapahayag.
- source_word: וַיָּבֹא
  choice: nakarating
  rationale: Ipinahahayag nito nang natural sa Tagalog ang pagdating ni Moises sa patutunguhan.
- source_word: הַר הָאֱלֹהִים
  choice: bundok ng Diyos
  rationale: Tuwirang pinananatili ang anyo ng pariralang Hebreo at hindi ipinapaliwanag kung kinikilala na bang banal ang bundok o tinawag lamang ito nang gayon mula sa pananaw ng tagapagsalaysay.
- source_word: חֹרֵבָה
  choice: sa Horeb
  rationale: Ang hulaping lokatibo ay nagpapahiwatig ng pagkilos patungo sa lugar; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “sa.”
theological_decisions:
- issue: Kung ang הַר הָאֱלֹהִים ay dapat ipakahulugang dati nang banal ang bundok o kinilala lamang ito nang gayon kalaunan
  choice: bundok ng Diyos
  alternative: banal na bundok
  rationale: Pinananatili ng tuwirang salin ang teolohikal at pasalaysay na pag-igting. Hindi nito ipinapasiya kung ang katawagan ay paunang pahiwatig, paglingon mula sa kalaunang pangyayari, o dati nang kilalang pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ilang” sa diwang ilang na lupain o wilderness, at iniwasan ang sobrang pormal o arkaikong ayos. Inilagay ang talababa sa pariralang talagang tinutukoy nito.
