  source_fidelity: Tumpak na naihahatid ng salin ang pagkilos ng mga salamangkero, ang paggamit nila ng lihim na sining, ang layuning magpalabas ng mga insekto, ang kanilang kabiguang gawin ito, at ang pagkapasa ng salot sa mga tao at hayop. Ang maramihang “mga tao” at “mga hayop” ay likas na paraan sa Tagalog upang katawanin ang mga kolektibong isahang pangngalan sa Hebreo.
  naturalness: Natural at malinaw ang modernong Tagalog. Ang “Gayon din ang ginawa” ay angkop sa pagsisimula ng Hebreong pagsasalaysay, at ang pag-uulit ng “mga niknik” ay malinaw at hindi mabigat.
