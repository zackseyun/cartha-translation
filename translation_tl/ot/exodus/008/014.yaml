base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: tl
  text: Gayon din ang ginawa ng mga salamangkero sa pamamagitan ng kanilang mga lihim na sining upang magpalabas ng mga niknik[a], ngunit hindi nila nagawa. At ang mga niknik ay nasa mga tao at mga hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kuto.” Hindi tiyak kung anong uri ng insekto ang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: mga salamangkero
  rationale: Tumutukoy ito sa mga ritwal na dalubhasa o salamangkero sa korte ng Paraon; natural at nakaugaliang katumbas sa modernong Tagalog ang “mga salamangkero.”
- source_word: בְּלָטֵיהֶם
  choice: sa pamamagitan ng kanilang mga lihim na sining
  rationale: Pinananatili nito ang diwa ng lihim o okultong mga pamamaraan nang hindi labis na tinutukoy kung ano mismo ang ginawa nila.
- source_word: לְהוֹצִיא
  choice: upang magpalabas
  rationale: Malapit ito sa literal na diwang “magpalabas,” at sa konteksto ay nangangahulugang tangkaing lumikha o maglabas ng salot.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: mga niknik
  rationale: Hindi tiyak ang eksaktong insektong tinutukoy. Ang “niknik” ay isang natural na salin para sa maliliit na insektong nangangagat; inilalagay sa talababa ang “kuto” bilang matagal nang alternatibo.
- source_word: וְלֹא יָכֹלוּ
  choice: ngunit hindi nila nagawa
  rationale: Malinaw at natural nitong ipinahahayag ang kanilang kawalan ng kakayahang maisagawa ang tangka.
- source_word: בָּאָדָם
  choice: sa mga tao
  rationale: Kolektibo ang gamit ng אָדָם at tumutukoy sa sangkatauhan sa pangkalahatan, hindi sa isang lalaking indibidwal. Mas natural sa Tagalog ang maramihang “mga tao.”
- source_word: וּבַבְּהֵמָה
  choice: at mga hayop
  rationale: Kolektibo rin ang pangngalan at mas natural sa modernong Tagalog ang “mga hayop” kaysa sa isang literal ngunit di-likas na anyong isahan.
theological_decisions:
- issue: Kolektibong kahulugan ng אָדָם
  choice: mga tao
  alternative: tao / sangkatauhan
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang kahulugan nito at katapat ng kolektibong בְּהֵמָה. Ang “mga tao” ay tumpak, inklusibo, at natural sa Tagalog nang hindi binabago ang pagkakaiba ng tao at hayop.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Gayon din” upang ipakita ang pagtulad sa naunang ginawa, at pinanatili ang pag-uulit ng “mga niknik” sa huling pangungusap upang masundan ang diin ng Hebreo.
