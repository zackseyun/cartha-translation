base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: tl
  text: Umalis sina Moises at Aaron mula sa harapan ni Paraon, at dumaing si Moises kay Yahweh tungkol sa mga palakang ipinasapit niya sa Paraon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga palakang inilagay niya laban sa Paraon.” Literal na “inilagay” o “itinakda” ang pandiwang Hebreo; ipinahahayag ng “ipinasapit” ang diwa nito sa konteksto ng salot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Ipinapahayag ng pandiwa ang paglayo nina Moises at Aaron mula sa kinaroroonan ng Paraon; natural at malinaw sa modernong Tagalog ang “umalis.”
- source_word: מֵעִם
  choice: mula sa harapan ng
  rationale: Ang parirala ay tumutukoy sa pag-alis mula sa presensiya o pakikipagharap sa Paraon. Mas malinaw dito ang “mula sa harapan ng” kaysa payak na “mula kay.”
- source_word: וַיִּצְעַק
  choice: dumaing
  rationale: Ang צעק ay isang matindi at apurahang pagtawag, lalo na bilang paghingi ng tulong sa Diyos. Pinananatili ng “dumaing” ang bigat ng pakiusap nang hindi ipinapalagay na panalangin lamang ang kahulugan nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa anyong transliterado ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: עַל דְּבַר
  choice: tungkol sa
  rationale: Sa konteksto, ang idyoma ay nagpapakilala sa paksa ng pagdaing ni Moises—ang mga palaka.
- source_word: הַצְפַרְדְּעִים
  choice: mga palaka
  rationale: Tuwirang salin ng pangmaramihang pangngalang tumutukoy sa mga hayop sa salot.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: na ipinasapit niya sa Paraon
  rationale: Literal na “inilagay/itinalaga niya para o laban sa Paraon,” ngunit sa konteksto ng salot, natural na ipinahahayag ng “ipinasapit” ang pagdating ng mga palaka bilang kapahamakang ipinataw sa Paraon. Nananatili ang panghalip na “niya” upang hindi tahasang tukuyin ang simuno na hindi pinangalanan sa sugnay na Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Hindi tahasang binanggit na simuno ng שָׂם
  choice: pinanatili ang “niya”
  alternative: “ipinasapit ni Yahweh”
  rationale: Bagaman malamang na si Yahweh ang tinutukoy ayon sa konteksto, hindi inuulit ng sugnay na Hebreo ang pangalan. Pinananatili ng panghalip ang anyo at bahagyang kalabuan ng pinagmulan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina” para sa tambalang simuno at “dumaing” upang maipakita ang tindi ng pagtawag nang hindi maging malamig o labis na teknikal. Inilagay ang talababa sa mismong pariralang tinutukoy nito.
