  source_fidelity: 'Tumpak sa kabuuan ang pagsasalin ng salaysay, ng matinding pagtawag ni Moises kay Yahweh, at ng mga palaka bilang paksa ng kanyang daing. Gayunman, ang pangatnig na “Kaya” ay nagdaragdag ng ugnayang bunga na wala sa payak na sunod-sunod na וַ– ng Hebreo. May problema rin ang talababa: ang “itinalaga” ay hindi angkop na literal na katumbas ng שָׂם sa talatang ito.'
