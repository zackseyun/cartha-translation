base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ng PANGINOON kay Moises, “Bumangon ka nang maaga kinaumagahan at tumayo ka sa harap ni Faraon. Tingnan mo, lumalabas siya patungo sa tubig. Sabihin mo sa kanya, ‘Ganito ang sabi ng PANGINOON: Pahintulutan mong umalis ang aking bayan upang maglingkod sila sa akin.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Bumangon ka nang maaga sa umaga
  rationale: Tuwirang pinananatili ang utos na gumising o bumangon nang maaga, sa natural at malinaw na Tagalog.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: at humarap ka kay Faraon
  rationale: Ang literal na ‘pumuwesto sa harap’ ay likas na ipinahahayag sa Tagalog bilang matatag na pagharap sa isang pinuno.
- source_word: הִנֵּה יוֹצֵא הַמַּיְמָה
  choice: Papunta siya sa tubig
  rationale: Pinananatili ang kilos patungo sa tubig nang hindi dinaragdagan ang teksto ng tiyak na dahilan o ng pangalang Nilo, na wala rito sa Hebreo.
- source_word: שַׁלַּח עַמִּי
  choice: Pahintulutan mong umalis ang aking bayan
  rationale: Naipapahayag ang utos na paalisin o pakawalan ang bayan nang natural, habang iniiwasan ang di-kailangang pagpapakitid sa kahulugan.
- source_word: וְיַעַבְדֻנִי
  choice: upang maglingkod sila sa akin
  rationale: Ang עבד ay maaaring tumukoy sa paglilingkod na may diwang pagsamba; pinanatili ng ‘maglingkod’ ang lawak at teolohikal na tensiyon ng salita.
theological_decisions:
- issue: Paglalarawan sa layunin ng pag-alis ng bayan
  choice: upang maglingkod sila sa akin
  alternative: upang sumamba sila sa akin
  rationale: Hindi nililimitahan sa gawaing kultiko lamang ang עבד; ang ‘maglingkod’ ay maaaring saklawin ang pagsamba at katapatan sa Diyos.
- issue: Pangalan ng Diyos, יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang kinaugaliang marangal na salin sa Tagalog para sa tetragrammaton, alinsunod sa consultation layer, nang walang idinaragdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Pinili ang payak na ayos ng mga pangungusap at iniwasang tukuyin ang tubig bilang Nilo dahil hindi iyon tahasang nakasaad sa talata.
