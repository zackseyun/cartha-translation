  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: tl
  text: At ginawa nila iyon. Iniunat ni Aaron ang kanyang kamay na may tungkod at hinampas ang alabok ng lupa. Nagkaroon ng mga niknik[a] sa mga tao[b] at sa mga hayop. Ang lahat ng alabok ng lupa ay naging mga niknik sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kuto.” Hindi tiyak ang eksaktong uri ng insektong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay nasa anyong kolektibo at tumutukoy sa mga tao sa pangkalahatan.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: At ginawa nila iyon
  rationale: Natural na salaysay sa makabagong Tagalog para sa pormulang nagsasaad na sinunod nila ang naunang utos.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: Iniunat ni Aaron ang kanyang kamay na may tungkod
  rationale: Pinananatili ang kilos ng pag-unat at ang pagkakaugnay ng kamay at tungkod nang hindi labis na nagpapasya kung accompaniment o instrumentality ang eksaktong diwa ng pang-ukol.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: at hinampas ang alabok ng lupa
  rationale: Ang “hinampas” ay malinaw at likas para sa נכה; ang “alabok ng lupa” ay nagpapanatili sa paulit-ulit na larawan ng עֲפַר הָאָרֶץ.
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: Dumagsa ang mga niknik sa mga tao at sa mga hayop
  rationale: Ang literal na “nagkaroon/naroon” ay ginawang likas na Tagalog na naglalarawan sa pagdating ng salot. Ang “mga tao” at “mga hayop” ay malinaw na naghahatid sa mga kolektibong katawagan sa Hebreo.
- source_word: הַכִּנָּם / כִנִּים
  choice: mga niknik
  rationale: Ang “niknik” ay karaniwang katawagan sa maliliit na insektong kahawig ng gnats. Dahil hindi tiyak ang eksaktong uri ng insektong tinutukoy ng Hebreo, inilagay sa talababa ang alternatibong “mga kuto.”
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: Ang lahat ng alabok ng lupa ay naging mga niknik
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng כָּל at ang resultative na diwa ng הָיָה.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Likas na Tagalog na nagpapahayag ng lawak sa kabuuan ng lupain.
theological_decisions:
- issue: Kolektibong gamit ng אָדָם
  choice: mga tao
  alternative: tao / sangkatauhan
  rationale: Kolektibo at hindi partikular sa kasarian ang אָדָם sa kontekstong ito. Ang “mga tao” ang pinakanatural at tumpak na modernong Tagalog, habang ipinapaliwanag sa talababa ang anyong kolektibo ng Hebreo.
- issue: Eksaktong pagkakakilanlan ng salot na כִּנִּים
  choice: mga niknik
  alternative: mga kuto
  rationale: Hindi tiyak sa leksikograpiya ang eksaktong insektong tinutukoy. Pinili ang “mga niknik” sa pangunahing teksto ngunit hindi itinago ang tunay na alinlangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Iniwasan ang lipas na pananalita at pinanatili ang pag-uulit ng “alabok ng lupa” at “mga niknik” na mahalaga sa larawan at ritmo ng tekstong Hebreo.
