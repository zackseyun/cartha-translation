base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Sabihin mo kay Aaron, ‘Iunat mo ang iyong kamay na may hawak na tungkod sa ibabaw ng mga ilog, mga kanal ng Nilo,[a] at mga tipunang tubig, at paahunin mo ang mga palaka sa lupain ng Ehipto.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga daluyan ng Nilo”; sa Ehipto, ang salitang Hebreo ay madalas tumukoy sa mga daluyang kaugnay ng Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahihiwatig ng anyong pasalaysay ang kasunod na pangyayari; natural sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אֱמֹר
  choice: Sabihin mo
  rationale: Likas at tuwirang katumbas ito ng pautos na anyo sa konteksto ng pagpapahatid ng utos kay Aaron.
- source_word: נְטֵה אֶת־יָדְךָ בְּמַטֶּךָ
  choice: Iunat mo ang iyong kamay na may hawak na tungkod
  rationale: Pinananatili ang kilos ng pag-unat ng kamay at malinaw na ipinapahayag sa Tagalog ang instrumental na kaugnayan ng tungkod nang hindi ipinahihiwatig na tungkod lamang ang iniunat.
- source_word: הַנְּהָרֹת
  choice: mga ilog
  rationale: Karaniwang kahulugan ng salita at nananatiling hiwalay sa kasunod na mga uri ng anyong-tubig.
- source_word: הַיְאֹרִים
  choice: mga kanal ng Nilo
  rationale: Sa kontekstong Ehipsiyo, tumutukoy ang maramihang anyo sa mga daluyan o kanal na kaugnay ng Nilo; mas tiyak ito kaysa sa pangkalahatang “mga kanal.”
- source_word: הָאֲגַמִּים
  choice: mga lawa
  rationale: Tumutukoy sa mga naipong anyong-tubig. Ang “mga lawa” ay natural at madaling maunawaan, bagaman maaari ring isalin na “mga tipunan ng tubig.”
- source_word: וְהַעַל
  choice: paahunin mo
  rationale: Pinananatili nito ang causative na diwa ng Hiphil at ang pag-ahon ng mga palaka mula sa tubig.
- source_word: הַצְפַרְדְּעִים
  choice: mga palaka
  rationale: Tuwirang katumbas ng hayop na tinutukoy sa salot.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Natural na Tagalog para sa pag-ahon at pagkalat ng mga palaka patungo sa lupain; iniiwasan ang di-likas na literal na “sa ibabaw ng lupain.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “iyong” sa loob ng banal na utos para sa bahagyang pormal na himig, habang nananatiling natural ang pangungusap. Pinanatili ang tatlong magkakaibang uri ng anyong-tubig at ang causative na kilos ng pagpapahon sa mga palaka.
