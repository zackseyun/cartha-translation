  source_fidelity: 'Ang diwa ng draft ay malapit sa Hebreo: aalis ang mga palaka sa Faraon, sa kanyang mga bahay, mga lingkod, at bayan, at mananatili lamang sa Nilo. Gayunman, ang magkakasunod na mga pariralang may “sa” matapos ang “lalayo” ay bahagyang malabo, sapagkat ang “sa” ay maaari ring magpahiwatig ng patutunguhan kaysa pinagmulan. Ang “mula sa” ay mas tahasang tumutugma sa מִן (“mula sa”).'
  naturalness: Ang “At aalis ang mga palaka mula sa iyo, sa iyong mga bahay, sa iyong mga lingkod, at sa iyong bayan” ay mas natural at malinaw sa modernong Filipino Tagalog kaysa sa konstruksyong “lalayo sa iyo ... gayundin sa.” Ang “iyong bayan” ay likas na katumbas ng kolektibong “iyong mga tao.”
  terminology: Pinanatili ang “mga palaka,” “mga lingkod,” at “Nilo.” Pinalitan ang “mga mamamayan” ng “iyong bayan,” dahil ang עַם ay tumutukoy sa sambayanan o mga taong sakop ng Faraon at hindi kinakailangang sa teknikal na kahulugang mga mamamayan/citizens.
