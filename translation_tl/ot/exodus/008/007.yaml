translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang sunod-sunod na saklaw—ang Faraon, kanyang mga bahay, mga lingkod, at mga mamamayan—at ang diin sa Nilo bilang tanging lugar na pananatilihan ng mga palaka.
