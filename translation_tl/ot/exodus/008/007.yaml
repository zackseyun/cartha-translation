- from: At lalayo sa iyo ang mga palaka, gayundin sa iyong mga bahay, mga lingkod, at mga mamamayan; sa Nilo[a] na lamang sila mananatili.
  to: At aalis ang mga palaka mula sa iyo, mula sa iyong mga bahay, mula sa iyong mga lingkod, at mula sa iyong bayan; sa Nilo[a] lamang sila mananatili.
  rationale: Ginawang tahasan ang paulit-ulit na kahulugang “mula sa” upang tumpak na maipakita ang serye ng Hebreong preposisyon. Ginamit ang “iyong bayan” para sa עַם, at pinanatili ang limitasyong “lamang” at ang pagkakakilanlan ng יְאֹר bilang Nilo. Inayos din ang panimulang pahayag ng talababa sa mas likas na “O kaya.”
