  - severity: low
    issue: Ang “mga mamamayan” ay mas makitid at mas makabago ang dating kaysa sa עַם.
    rationale: Ang “iyong bayan” ay mas malawak, natural, at hindi nagdaragdag ng konseptong legal-politikal na citizenship.
