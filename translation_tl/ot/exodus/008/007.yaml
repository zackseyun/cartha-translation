  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: tl
  text: At aalis ang mga palaka mula sa iyo, mula sa iyong mga bahay, mula sa iyong mga lingkod, at mula sa iyong bayan; sa Nilo[a] lamang sila mananatili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ilog.” Ang salitang Hebreo na יְאֹר ay maaaring mangahulugang “ilog,” ngunit sa Exodo ay karaniwan itong tumutukoy partikular sa Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: At lalayo
  rationale: Ang סוּר ay nangangahulugang lumihis o umalis. Sa konteksto ng pagtatapos ng salot, likas sa modernong Tagalog ang “lalayo” at hindi nito ipinahihiwatig na agad silang papatayin.
- source_word: הַצְפַרְדְּעִים
  choice: ang mga palaka
  rationale: Tuwirang salin ng tiyak na pangngalang maramihan.
- source_word: מִמְּךָ
  choice: sa iyo
  rationale: Kasunod ng “lalayo,” natural na ipinahahayag ng “sa iyo” ang paglayo mula sa presensiya ng kausap.
- source_word: וּמִבָּתֶּיךָ
  choice: gayundin sa iyong mga bahay
  rationale: Pinananatili ang maramihang anyo ng Hebrew habang ginagawang maayos ang daloy sa Tagalog.
- source_word: וּמֵעֲבָדֶיךָ
  choice: mga lingkod
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod, alipin, o opisyal. Ang “mga lingkod” ang pinakamalawak at pinakaangkop dito nang hindi labis na tinutukoy ang legal na katayuan o tungkulin.
- source_word: וּמֵעַמֶּךָ
  choice: mga mamamayan
  rationale: Sa konteksto ng Faraon, tumutukoy ang עַם sa bayang nasa ilalim ng kanyang pamamahala. Nililinaw ito ng “mga mamamayan” sa natural na Tagalog.
- source_word: רַק
  choice: na lamang
  rationale: Malinaw nitong ipinapahayag ang pagtatangi o limitasyon sa lokasyong natitira.
- source_word: בַּיְאֹר
  choice: sa Nilo
  rationale: Sa Exodo, karaniwang partikular na tumutukoy ang יְאֹר sa Ilog Nilo; kaya higit na malinaw sa konteksto ang “Nilo” kaysa sa pangkalahatang “ilog.”
- source_word: תִּשָּׁאַרְנָה
  choice: sila mananatili
  rationale: Ang Niphal imperfect ng שׁאר ay nagpapahayag ng pananatili o pagkaiwan. Ang “mananatili” ay natural at tapat sa diwa.
