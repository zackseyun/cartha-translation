base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Sabihin mo kay Aaron, ‘Iunat mo ang iyong tungkod at hampasin ang alikabok ng lupa, at magiging mga niknik[a] iyon sa buong lupain ng Ehipto.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kuto.” Tumutukoy ang salitang Hebreo sa maliliit na insektong nangangagat o nang-iirita, ngunit hindi tiyak ang eksaktong uri.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang pangalang tipan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahahayag ang pagsulong ng salaysay sa natural na modernong Tagalog.
- source_word: אֱמֹר
  choice: Sabihin mo
  rationale: Natural at tuwirang katumbas ng pautos na ipinapasabi kay Aaron.
- source_word: נְטֵה אֶת־מַטְּךָ
  choice: Iunat mo ang iyong tungkod
  rationale: Pinananatili ang kilos ng pag-uunat at ang karaniwang katawagan sa tungkod sa salaysay.
- source_word: וְהַךְ
  choice: at hampasin
  rationale: Malinaw na ipinahahayag ang malakas at sinadyang pagtama nang hindi gumagamit ng lipas na pananalita.
- source_word: עֲפַר הָאָרֶץ
  choice: ang alikabok ng lupa
  rationale: Malapit sa anyo at larawan ng Hebreo at natural ding pakinggan sa Tagalog.
- source_word: וְהָיָה לְכִנִּם
  choice: at magiging mga niknik iyon
  rationale: Ipinahahayag ang bunga ng pagbabago; ang “niknik” ay nauunawaang maliit na insektong peste, habang inilalagay sa talababa ang kawalan ng katiyakan sa tiyak na uri.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Maikli at natural na ipinahahayag ang kabuuang saklaw ng salot.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang ginamit sa tekstong Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iyong” sa halip na kolokyal na “mong” upang mapanatili ang dignidad ng tuwirang pahayag, at inilagay ang talababa sa “niknik,” ang salitang talagang nililinaw nito.
