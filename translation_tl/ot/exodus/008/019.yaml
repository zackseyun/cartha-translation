  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: tl
  text: Magtatakda ako ng pagkakaiba sa pagitan ng aking bayan at ng iyong bayan.[a] Bukas magaganap ang tandang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘pagtubos’ o ‘pagliligtas.’ Ang salitang Hebreo ay maaaring tumukoy sa pagkilos ng Diyos na tumubos o nagligtas; dito, ipinakikita ito sa pagtatakda niya ng pagkakaiba sa pagitan ng Israel at Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: At ibubukod ko
  rationale: Ang שׂים ay literal na ‘maglagay’ o ‘magtakda,’ ngunit kasama ng פְדֻת at ng pariralang ‘sa pagitan ng,’ ipinahahayag nito rito ang pagkilos ng Diyos na nagbubukod sa dalawang bayan. Mas natural sa makabagong Tagalog ang pandiwang ‘ibubukod’ kaysa ‘maglalagay ng pagkakaiba.’
- source_word: פְדֻת
  choice: ibubukod
  rationale: Maaaring tumukoy ang pangngalan sa pagtubos o pagliligtas, ngunit sa agarang konteksto ay ang bunga ng pagkilos ng Diyos—ang pagbubukod sa Israel mula sa Ehipto—ang itinatampok. Isinama sa pandiwang ‘ibubukod’ ang diwang ito, habang pinananatili sa talababa ang mas literal at teolohikal na mga posibilidad.
- source_word: בֵּין ... וּבֵין
  choice: ang aking bayan sa iyong bayan
  rationale: Sa Tagalog, likas na ipinahahayag ng ‘ibukod ang X sa Y’ ang paghihiwalay o pagtatangi sa dalawang panig; hindi na kailangang ulitin ang mas mabigat na ‘sa pagitan ng … at ng ….’
- source_word: עַמִּי
  choice: aking bayan
  rationale: Tuwirang katumbas ng anyong paari at tumutukoy sa Israel bilang bayan ng Diyos.
- source_word: עַמֶּךָ
  choice: iyong bayan
  rationale: Tuwirang katumbas ng anyong paari at tumutukoy sa bayan ng Paraon, ang mga Ehipsiyo.
- source_word: לְמָחָר
  choice: Bukas
  rationale: Karaniwang salin ng temporal na pang-abay; ang paglalagay nito sa unahan ay natural at nagpapanatili ng diin.
- source_word: יִהְיֶה
  choice: mangyayari
  rationale: Bagaman literal na ‘magiging’ o ‘iiral,’ kapag ang simuno ay isang tanda, mas malinaw at natural sa Tagalog ang ‘mangyayari.’
- source_word: הָאֹת הַזֶּה
  choice: ang tandang ito
  rationale: Ang אוֹת ay karaniwang ‘tanda,’ lalo na sa salaysay ng mga salot bilang palatandaan ng pagkilos ng Diyos.
theological_decisions:
- issue: Kung ang פְדֻת ay isasalin ayon sa mas literal na diwang ‘pagtubos/pagliligtas’ o ayon sa kontekstuwal na diwang pagbubukod
  choice: Ipinahayag sa pangunahing teksto bilang ‘ibubukod’
  alternative: ‘maglalagay ako ng pagtubos/pagliligtas sa pagitan’ o ‘gagawa ako ng pagkakaiba’
  rationale: Ipinakikita ng kayariang ‘sa pagitan ng aking bayan at ng iyong bayan’ ang magkaibang pakikitungo ng Diyos sa Israel at Ehipto. Gayunman, may tunay na diwa ng pagtubos o pagliligtas ang salitang Hebreo, kaya hindi ito inalis kundi ipinaliwanag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinili ang likas na ‘ibubukod’ sa halip na ang mas literal ngunit asiwa sa Tagalog na ‘maglalagay ng pagkakaiba.’
