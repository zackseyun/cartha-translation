base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: tl
  text: Gayon din ang ginawa ng mga salamangkero sa pamamagitan ng kanilang mga lihim na sining[a], at pinaahon nila ang mga palaka sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kanilang mga enkantasyon” o “sa pamamagitan ng kanilang mga gawaing okulto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Gayon din ang ginawa
  rationale: Likas na pariralang Filipino na nagpapanatili sa diwang ginawa nila ang katulad ng naunang ginawa.
- source_word: הַחֲרְטֻמִּים
  choice: mga salamangkero
  rationale: Malinaw at karaniwang tawag sa mga tauhan sa korte ng Faraon na nagsasagawa ng mahiwaga o esoterikong mga gawain.
- source_word: בְּלָטֵיהֶם
  choice: sa pamamagitan ng kanilang mga lihim na sining
  rationale: Ipinahihiwatig ng salita ang lihim o natatagong mga gawaing mahika; pinananatili ng salin ang instrumental na diwa nang hindi tinutukoy nang labis ang eksaktong pamamaraan.
- source_word: וַיַּעֲלוּ
  choice: pinaahon nila
  rationale: 'Pinananatili nito ang causative na anyong Hiphil: pinangyari nilang umahon ang mga palaka, hindi lamang basta sila mismo ang umakyat.'
- source_word: אֶת הַצְפַרְדְּעִים
  choice: ang mga palaka
  rationale: Tuwirang salin ng pangmaramihang pangngalang may tiyak na pantukoy.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Natural na Filipino para sa pag-ahon o paglitaw ng mga palaka sa lupain ng Ehipto, nang hindi nagdaragdag ng ideyang wala sa Hebreo.
theological_decisions:
- issue: Likas na katangian ng ginawa ng mga salamangkero
  choice: Tahasang inilahad na pinaahon din ng mga salamangkero ang mga palaka.
  alternative: Ilarawan ito bilang kunwaring paggaya, ilusyon, o panlilinlang.
  rationale: Iniuulat ng tekstong Hebreo ang kanilang ginawa nang walang pasubali; hindi dapat magdagdag ang salin ng naturalistiko o polemikong paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salamangkero” bilang madaling maunawaang katawagan, at ang “pinaahon” upang mapanatili ang causative na puwersa ng pandiwang Hebreo.
