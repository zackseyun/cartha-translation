  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: tl
  text: At kumilos si Yahweh ayon sa sinabi ni Moises, at nangamatay ang mga palaka sa mga bahay, sa mga bakuran, at sa mga bukid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos sa isang kinikilalang anyong transliterado sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: כִּדְבַר מֹשֶׁה
  choice: ayon sa sinabi ni Moises
  rationale: Ang דָּבָר dito ay tumutukoy sa sinabi o ipinahayag ni Moises; natural sa modernong Tagalog ang “ayon sa sinabi.”
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: sa mga bahay, mga bakuran, at mga bukid
  rationale: Sa kontekstong ito, minamarkahan ng מִן ang mga lugar kung saan namatay ang mga palaka. Ang “sa” ang pinakanatural na Tagalog at iniiwasan ang maling pahiwatig na namatay sila matapos lumabas mula sa mga lugar na iyon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pinananatili ang pagkakaiba ng personal na pangalan sa karaniwang titulong אֲדֹנָי, nang hindi nagdaragdag ng denominasyonal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na payak, marangal, at natural. Hinati sa dalawang pangungusap upang maging malinaw ang sunod-sunod na kilos habang pinananatili ang ugnayan ng mga sugnay sa Hebreo.
