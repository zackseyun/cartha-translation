base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: tl
  text: Sinabi ni Moises, “Masdan mo, aalis ako mula sa harapan mo at magsusumamo ako kay Yahweh. Bukas, aalis ang kuyog[a] mula kay Paraon, mula sa kanyang mga lingkod, at mula sa kanyang bayan. Ngunit huwag nang muling manlinlang si Paraon sa pamamagitan ng hindi pagpapahintulot na umalis ang bayan upang maghandog ng hain kay Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong עָרֹב ay maaaring tumukoy nang mas tiyak sa kuyog ng mga langaw o iba pang nagkukumpulang kulisap o nilalang; hindi tiyak ang eksaktong tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Masdan mo
  rationale: Pinananatili ang puwersang pantawag-pansin ng Hebreo sa isang marangal ngunit nauunawaang anyo.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: aalis ako mula sa harapan mo
  rationale: Ipinahihiwatig ang konkretong pag-alis ni Moises mula sa kinaroroonan o presensiya ni Paraon.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: magsusumamo ako kay Yahweh
  rationale: Ang pandiwang עתר ay tumutukoy rito sa taimtim na pakiusap o pamamagitan, hindi lamang sa pangkalahatang pananalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה bilang Yahweh.
- source_word: וְסָר
  choice: aalis
  rationale: Natural na inilalahad ang diwa ng pagtalikod o paglisan ng salot mula sa mga tao.
- source_word: הֶעָרֹב
  choice: ang kawan
  rationale: Pinananatili ang kolektibong diwa ng nagkukumpulang mga nilalang nang hindi tiyak na kinikilalang mga langaw ang mga ito; nililinaw sa talababa ang leksikal na kawalang-katiyakan.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: mula kay Paraon, sa kanyang mga lingkod, at sa kanyang bayan
  rationale: Pinananatili ang saklaw at ang pag-uulit ng ‘mula’ sa paraang natural sa Filipino.
- source_word: מָחָר
  choice: Bukas
  rationale: Tuwirang salin ng pang-abay na pamanahon.
- source_word: רַק
  choice: lamang
  rationale: Ipinakikita ang paghihigpit o mariing babala ni Moises.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: Huwag lamang muling manlinlang si Paraon
  rationale: Ang יסף kasama ng התל ay nagpapahiwatig ng pag-uulit ng mapanlinlang na kilos; ang ‘muling manlinlang’ ay natural at tumpak sa konteksto.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: sa pamamagitan ng hindi pagpapahintulot na umalis ang bayan
  rationale: 'Inilalahad ang mismong anyo ng panlilinlang ni Paraon: ang hindi niya pagpapalaya sa bayan.'
- source_word: לִזְבֹּחַ
  choice: upang maghandog
  rationale: Sa konteksto, tumutukoy ang זבח sa paghahandog ng hain bilang pagsamba, hindi sa pagsamba sa pangkalahatan.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Nasa talata mismo ang Tetragrammaton, kaya pinananatili ang tipanang pangalan sa transliterasyong Yahweh.
- issue: Tiyak na pagkakakilanlan ng עָרֹב
  choice: ang kawan
  alternative: kawan ng mga langaw; halu-halong kawan ng mga hayop o kulisap
  rationale: Hindi tiyak ang eksaktong zoolohikal na tinutukoy ng salitang Hebreo, kaya hindi ito nililimitahan sa mga langaw lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang ‘magsusumamo’ upang ipakita ang taimtim na pamamagitan, at ang ‘muling manlinlang’ upang maipahayag ang paulit-ulit na mapanlinlang na kilos ni Paraon. Ang ‘kawan’ ay sadyang pangkalahatan upang mapanatili ang kawalang-katiyakan ng עָרֹב.
