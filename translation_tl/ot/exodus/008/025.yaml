  source_fidelity: Kailangang baguhin ang “kawan,” na karaniwang tumutukoy sa mga hayop na gaya ng baka o tupa at hindi natural na katumbas ng hindi-tiyak na Hebreong עָרֹב. Dapat ding panatilihin ang inuulit na “mula” sa tatlong saklaw, at gawing hayag ang sakripisyal na diwa ng לִזְבֹּחַ sa “maghandog ng hain.”
  naturalness: Natural at marangal ang kabuuang daloy, ngunit mas angkop ang “kuyog” kaysa “kawan” para sa isang pulutong ng kulisap o iba pang nagkukumpulang nilalang. Ang “huwag nang muling manlinlang” ay mas likas na babala sa modernong Filipino.
  terminology: Pinanatili ang “Yahweh.” Ang “kuyog” ay hindi tumitiyak na mga langaw ang עָרֹב, samantalang ang “maghandog ng hain” ay pinananatili ang tiyak na sakripisyal na kahulugan ng זבח.
  issues:
  - severity: medium
    issue: Ang “kawan” ay hindi angkop na pangunahing salin ng הֶעָרֹב.
    rationale: Sa modernong Filipino, ang “kawan” ay karaniwang para sa herd o flock. Ang עָרֹב ay tumutukoy sa isang kuyog o pulutong ng nagkukumpulang nilalang, na ang eksaktong uri ay hindi tiyak.
  - severity: low
    issue: Hindi naulit ang “mula” bago ang “kanyang mga lingkod” at “kanyang bayan.”
    rationale: May inuulit na preposisyong מִן sa Hebreo; madaling mapanatili ito nang natural sa Filipino.
  - severity: medium
    issue: Ang “maghandog” lamang ay kulang sa sakripisyal na tiyak ng לִזְבֹּחַ.
    rationale: Maaaring tumukoy ang “maghandog” sa anumang alay. Ang “maghandog ng hain” ay nagsasaad ng sakripisyo nang hindi nagdaragdag ng interpretasyon.
