  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: tl
  text: Umalis si Moises mula sa harapan ng Faraon at taimtim na nakiusap kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “masidhing nanalangin kay Yahweh.” Ang pandiwang Hebreo ay nagpapahayag ng taimtim o apurahang pagsusumamo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Ang Qal wayyiqtol ng יצא ay tumutukoy sa pisikal na pag-alis at nagpapatuloy sa daloy ng salaysay. Natural at tuwiran ang “umalis” sa modernong Filipino.
- source_word: מֵעִם
  choice: sa harapan ng
  rationale: Ang מֵעִם ay nagpapahayag ng paglayo mula sa pakikisama o presensiya ng isang tao. Dito, malinaw at natural na ipinahihiwatig ng “umalis ... sa harapan ng Faraon” na nilisan ni Moises ang presensiya nito.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Ito ang karaniwang anyong Filipino ng maharlikang titulo sa salaysay ng Exodo.
- source_word: וַיֶּעְתַּר
  choice: taimtim na nakiusap
  rationale: Ang עתר ay nagsasaad ng masidhi o apurahang pagsusumamo, hindi lamang pangkalahatang pananalangin. Pinananatili ng parirala ang tindi habang natural sa Filipino.
- source_word: אֶל
  choice: kay
  rationale: Ang אֶל ay nagmamarka sa pinatutungkulan ng pagsusumamo. Ang “kay” ang natural na pang-ukol sa Filipino para sa personal na pinatutungkulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang tinutumbasan ng “Yahweh” ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon” nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Lakas ng pandiwang עתר
  choice: taimtim na nakiusap
  alternative: nanalangin
  rationale: May diwa ng masidhing pagsusumamo ang pandiwa sa kontekstong ito. Ang salin ay hindi nagpapasiya kung ito ay dapat uriin lamang bilang pormal na panalangin, ngunit pinananatili ang tindi ng kilos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa harapan ng Faraon” upang ilantad ang nuance ng pag-alis mula sa presensiya nito, at ang “taimtim na nakiusap” upang mapanatili ang lakas ng pandiwang Hebreo.
