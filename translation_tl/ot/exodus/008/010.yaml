  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: tl
  text: Tinambak nila ang mga iyon nang bunton-bunton[a], at bumaho ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa mga bunton” o “bunton sa bunton”; inuulit sa Hebreo ang salitang “bunton” bilang pagdidiin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: Tinipon
  rationale: Ang צבר ay tumutukoy sa pagtitipon ng mga bagay upang maging bunton. Likas sa modernong Tagalog ang “tinipon,” habang nililinaw ng kasunod na “nang bunton-bunton” ang kongkretong ayos ng mga ito.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy ang panghalip na layon sa mga palaka sa naunang konteksto. Ang “mga iyon” ay malinaw at natural na pagtukoy sa mga ito.
- source_word: חֳמָרִם חֳמָרִם
  choice: nang bunton-bunton[a]
  rationale: Inuulit sa Hebreo ang pangngalan upang idiin ang pagkakaroon ng maraming magkakahiwalay na bunton. Pinananatili ng “bunton-bunton” ang pag-uulit at distributibong diwa sa natural na Tagalog.
- source_word: וַתִּבְאַשׁ
  choice: bumaho
  rationale: Tuwiran at matingkad na katumbas ang “bumaho” ng pandiwang באש, na nangangahulugang naglabas o nagkaroon ng masamang amoy.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa salaysay ng mga salot, tumutukoy ang אֶרֶץ sa apektadong lupain o rehiyon, hindi sa buong daigdig.
