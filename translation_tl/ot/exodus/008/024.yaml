source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: tl
  text: Sinabi ni Faraon, “Pahihintulutan ko kayong umalis upang makapag-alay kayo ng hain kay Yahweh, na inyong Diyos, sa ilang. Huwag lamang kayong lumayo nang husto. Idalangin ninyo ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang payak na “Sinabi” nang hindi kailangang gawing mekanikal na “At sinabi.”
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwang anyong Tagalog ng titulong Ehipsiyo.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Pahihintulutan ko kayong umalis
  rationale: Sa konteksto ng pakikipagtawaran, ang שׁלח ay tumutukoy sa pagbibigay-pahintulot o pagpapalaya upang makaalis; ipinapahayag ng “Pahihintulutan ko” ang sariling pasiya ni Faraon.
- source_word: וּזְבַחְתֶּם
  choice: upang makapaghandog kayo
  rationale: Ang pandiwa kasunod ng pagpapahintulot ay nagpapahayag ng layunin. Ang “maghandog” ay likas at sapat sa kontekstong ritwal ng hain.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang pinananatili ang tipanang pangalan na יהוה bilang Yahweh.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: Malinaw na ipinapahayag ang kaugnayang paari at ang pagkakakilanlan ni Yahweh bilang Diyos ng mga Israelita.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, marangal, at karaniwang salin ng מִדְבָּר bilang lupaing hindi tinatahanan o sinasaka, nang hindi nililimitahan sa disyerto.
- source_word: רַק
  choice: lamang
  rationale: Ipinakikilala nito ang kondisyong ipinapataw ni Faraon sa kanyang pahintulot.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: Huwag lamang kayong lumayo nang husto
  rationale: Ang infinitive absolute at finite verb mula sa רחק ay nagbibigay-diin sa antas ng paglayo; natural itong naipahahayag ng “nang husto.”
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Idalangin ninyo ako
  rationale: Ang Hiphil ng עתר ay masidhing pagsusumamo o pananalangin para sa kapakanan ng iba. Sa Tagalog, natural na kahilingan ang “Idalangin ninyo ako.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang ginagamit sa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng kahilingang הַעְתִּירוּ בַּעֲדִי
  choice: Idalangin ninyo ako
  alternative: Magsumamo kayo para sa akin
  rationale: Hindi tinutukoy ng talata rito ang eksaktong nilalaman ng panalangin. Pinananatili ng salin ang pangkalahatang kahilingan ni Faraon nang hindi nagdaragdag na alisin ang salot, bagaman malinaw iyon sa mas malawak na konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “Faraon,” “Yahweh,” at “ilang” bilang madaling makilalang mga terminong biblikal; iniwasan ang labis na teknikal o makalumang pananalita.
