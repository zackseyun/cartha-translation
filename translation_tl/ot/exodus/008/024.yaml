  to: Sinabi ni Faraon, “Pahihintulutan ko kayong umalis upang makapag-alay kayo ng hain kay Yahweh, na inyong Diyos, sa ilang. Huwag lamang kayong lumayo nang husto. Idalangin ninyo ako.”
