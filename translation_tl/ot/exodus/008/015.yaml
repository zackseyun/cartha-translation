  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: tl
  text: Sinabi ng mga salamangkero kay Faraon, “Daliri ito ng Diyos.”[a] Ngunit tumigas ang puso ni Faraon,[b] at hindi niya sila pinakinggan, gaya ng sinabi ni Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “daliri ng Diyos” ay isang idyomang tumutukoy sa tuwirang pagkilos ng kapangyarihan ng Diyos.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “naging matigas o matatag ang puso ni Faraon.” Hindi tahasang sinasabi sa Hebreo kung sino ang sanhi ng pagtigas sa sugnay na ito.
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: YHWH, ang personal na pangalan ng Diyos; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: mga salamangkero
  rationale: Tumutukoy sa mga dalubhasa ni Faraon sa mga ritwal at mahika. Ang “mga salamangkero” ay malinaw at karaniwang katawagan sa makabagong Tagalog nang hindi dinaragdagan ang kanilang tiyak na tungkulin.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Daliri ito ng Diyos
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang diin nito sa tuwirang pagkilos ng kapangyarihan ng Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maaaring magkaroon ng ibang bilang o di-tiyak na diwa ang אֱלֹהִים sa ibang konteksto, ang isahan at tiyak na “Diyos” ang pinakanababagay sa salaysay na ito.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: tumigas ang puso ni Faraon
  rationale: Likas itong pahayag sa Tagalog para sa pagiging matigas at ayaw magpasakop. Hindi nito tahasang itinatakda kung sino ang naging sanhi ng pagtigas, gaya rin ng sugnay sa Hebreo.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: at hindi niya sila pinakinggan
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o tumalima. Ang “pinakinggan” ay natural at malinaw, habang naipahihiwatig sa konteksto ang hindi niya pagtalima.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Ipinakikita ng pormulang ito na natupad ang naunang pahayag ni Yahweh. Natural sa Tagalog ang “gaya ng sinabi,” at pinananatili ang personal na pangalan ng Diyos.
theological_decisions:
- issue: Paglalarawan sa pagtigas ng puso ni Faraon
  choice: tumigas ang puso ni Faraon
  alternative: pinatigas ang puso ni Faraon / pinatigas ni Faraon ang kanyang puso
  rationale: Hindi tahasang tinutukoy ng sugnay na Hebreo ang gumagawa o sanhi ng pagtigas. Pinananatili ng salin ang ganitong kalabuan at ang kaakibat na teolohikal na tensiyon.
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ang יהוה ay personal na pangalan ng Diyos sa teksto. Ang “Yahweh” ay tuwirang transliterasyon na hindi nagpapalit dito ng isang titulo.
- issue: Pag-unawa sa אֱלֹהִים sa pahayag ng mga salamangkero
  choice: Diyos
  alternative: isang diyos / mga diyos
  rationale: Sa agarang salaysay ng tunggalian at sa pagkilala ng mga salamangkero sa kapangyarihang hindi nila magaya, ang isahang “Diyos” ang pinakanatural, bagaman may mas malawak na saklaw ang anyong Hebreo sa ibang konteksto.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “Faraon” at “mga salamangkero” bilang mga pamilyar na katawagan. Pinanatili ang idyomang “daliri ng Diyos” sa pangunahing teksto at ipinaliwanag ito sa talababa; iniwasan ding tukuyin ang ahente ng pagtigas ng puso dahil hindi ito tahasan sa Hebreo.
