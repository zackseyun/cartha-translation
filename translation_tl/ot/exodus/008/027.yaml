base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: tl
  text: 'Kumilos si Yahweh ayon sa sinabi ni Moises: inalis niya ang kuyog[a] mula kay Faraon, mula sa kanyang mga lingkod, at mula sa kanyang bayan. Wala ni isa man ang natira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kuyog ng mga langaw.” Ang salitang Hebreo na עָרֹב ay tumutukoy sa salot ng nagkukuyog na mga insekto, ngunit hindi nito mismo tinutukoy ang eksaktong uri ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַשׂ ... כִּדְבַר מֹשֶׁה
  choice: ginawa ni Yahweh ang ayon sa sinabi ni Moises
  rationale: Ang עשה ay malawak na pandiwang ‘gumawa,’ at ang כִּדְבַר מֹשֶׁה ay likas na ipinahahayag sa Filipino bilang ‘ayon sa sinabi ni Moises,’ habang pinananatili ang diwang kumilos si Yahweh alinsunod sa salita niya.
- source_word: וַיָּסַר
  choice: inalis niya
  rationale: Ang Hiphil ng סור ay nangangahulugang ‘mag-alis’ o ‘maglayo’; ang ‘inalis’ ay tuwiran at angkop sa salot.
- source_word: הֶעָרֹב
  choice: ang kuyog
  rationale: Tumutukoy ang עָרֹב sa salot na binubuo ng nagkukuyog na mga nilalang, ngunit hindi tiyak sa salita mismo ang eksaktong uri; kaya hindi ito labis na tinukoy sa pangunahing teksto.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: kay Faraon, sa kanyang mga lingkod, at sa kanyang bayan
  rationale: Inulit ang mga pariralang may layuning pag-alis mula sa bawat pangkat, sa paraang natural sa Filipino.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: Wala ni isa ang natira
  rationale: Pinananatili nito ang mariing isahan ng אֶחָד at natural na ipinahahayag ang ganap na pagkawala ng kuyog.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Eksaktong uri ng עָרֹב
  choice: kuyog
  alternative: kuyog ng mga langaw
  rationale: Hindi tinutukoy ng terminong Hebreo mismo ang tiyak na uri ng nilalang, kaya pinanatili sa teksto ang leksikal na kalabuan at inilagay sa talababa ang mas tiyak na tradisyonal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kuyog’ upang mapanatili ang di-tiyak na katawagan sa Hebreo; iniwasan ang mas lumang ‘alipin’ para sa עֲבָדָיו dahil sa kontekstong tumutukoy sa mga tauhan o lingkod ni Faraon.
