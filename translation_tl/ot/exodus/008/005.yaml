base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: tl
  text: 'At sinabi ni Moises sa Paraon[a], “Akuin mo ang karangalang ito: sabihin mo kung kailan ako mananalangin para sa iyo, sa iyong mga lingkod, at sa iyong bayan, upang alisin ang mga palaka mula sa iyo at sa iyong mga bahay. Sa Nilo na lamang matitira ang mga iyon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa diwa, “Ikaw ang magtakda ng oras para sa akin.” Mahirap isalin ang idyomang Hebreo, na literal na may diwa ng pag-angkin ng karangalan kaugnay ni Moises; inaanyayahan ni Moises ang Paraon na sabihin kung kailan siya dapat manalangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Ibigay mo sa akin ang karangalang ito
  rationale: Pinananatili ang di-karaniwang idyoma tungkol sa karangalan habang nauunawaan sa konteksto na binibigyan ni Moises ang Paraon ng pagkakataong pumili ng oras. Inilalagay sa talababa ang mas tuwirang pagpapakahulugan.
- source_word: לְמָתַי
  choice: sabihin mo kung kailan
  rationale: Likas na Tagalog na nagpapahayag na ang Paraon ang magtatakda ng oras, gaya ng ipinahihiwatig ng tanong sa Hebreo.
- source_word: אַעְתִּיר
  choice: ako mananalangin
  rationale: Sa konteksto, tumutukoy ito sa taimtim na pagsusumamo sa Diyos para sa iba. Ang “mananalangin” ay malinaw at karaniwan nang hindi ginagawang teknikal ang salita.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: para sa iyo, sa iyong mga lingkod, at sa iyong bayan
  rationale: Pinananatili ang tatlong saklaw ng panalangin at ang pag-uulit para sa diin at linaw.
- source_word: לְהַכְרִית
  choice: upang alisin
  rationale: Bagaman literal na “putulin” o “lipulin,” ang kahulugan dito ay mawala o maalis ang mga palaka mula sa mga tao at bahay; ang literal na “putulin” ay hindi likas sa Tagalog para sa ganitong layon.
- source_word: הַצֲפַרְדְּעִים
  choice: ang mga palaka
  rationale: Tuwirang katumbas ng pangalan ng hayop na sangkot sa salot.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: sa iyo at sa iyong mga bahay
  rationale: Pinaghihiwalay ang Paraon mismo at ang kanyang mga bahay, alinsunod sa estruktura ng Hebreo.
- source_word: רַק
  choice: na lamang
  rationale: Malinaw na minamarkahan ang tanging lugar na hindi aalisan ng mga palaka.
- source_word: בַּיְאֹר
  choice: sa Nilo
  rationale: Ang יְאֹר sa salaysay ng Exodo ay tumutukoy sa Ilog Nilo; ang tiyak na pangalan ay angkop sa kontekstong Ehipsiyo.
- source_word: תִּשָּׁאַרְנָה
  choice: matitira ang mga iyon
  rationale: Ipinahahayag ang pananatili ng mga palaka at nililinaw sa Tagalog ang reperente ng pambabaeng maramihang anyo sa Hebreo.
