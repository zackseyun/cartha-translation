  to: 'At sinabi ni Moises sa Paraon[a], “Akuin mo ang karangalang ito: sabihin mo kung kailan ako mananalangin para sa iyo, sa iyong mga lingkod, at sa iyong bayan, upang alisin ang mga palaka mula sa iyo at sa iyong mga bahay. Sa Nilo na lamang matitira ang mga iyon.”'
