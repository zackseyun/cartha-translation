  register: Makabago, malinaw, at marangal na Filipino. Pinanatili sa pangunahing teksto ang larawan ng karangalan sa mahirap na idyomang Hebreo, ngunit nilinaw sa talababa ang kontekstuwal na diwang ang Paraon ang pipili ng oras.
