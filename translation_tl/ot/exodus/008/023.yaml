  source_fidelity: Tumpak na naipapahayag ng salin ang paglalakbay na tatlong araw patungo sa ilang, ang paghahain kay Yahweh bilang kanilang Diyos, at ang pagsunod sa kaniyang sasabihin. Ang hinaharap na “sasabi/sasabihin” ay isang lehitimong pagbasa ng Hebrew imperfect, habang ang kasalukuyan ay maayos na pinananatili sa talababa.
  naturalness: Natural at marangal ang modernong Filipino. Ang “Maglalakbay kami nang tatlong araw papunta sa ilang” ay malinaw at hindi nagdaragdag ng tiyak na layo. Ang “maghahain kay Yahweh” ay angkop sa kontekstong panrelihiyon at malinaw na tumutukoy sa paghahain ng handog.
  terminology: Ang “ilang” ay mabuting katumbas ng מִדְבָּר at hindi nililimitahan ang kahulugan sa mabuhanging disyerto. Ang “Yahweh” ay wastong pinananatili bilang personal na banal na pangalan; ang “aming Diyos” ay tapat sa אֱלֹהֵינוּ. Ang mga talababa ay wastong nakaangkla sa mga pariralang may alternatibong pagbasa.
