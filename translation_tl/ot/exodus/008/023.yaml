base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: tl
  text: Maglalakbay kami nang tatlong araw[a] papunta sa ilang at maghahain kay Yahweh na aming Diyos, ayon sa sasabihin niya sa amin.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tatahakin namin ang layo ng tatlong araw na paglalakbay.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ayon sa sinasabi niya sa amin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: maglalakbay kami nang tatlong araw
  rationale: Ang parirala ay isang Hebreong idyoma para sa paglalakbay o layong tinatahak sa loob ng tatlong araw. Natural ito sa makabagong Tagalog at hindi dinaragdagan ang tiyak na distansiyang hindi naman binanggit.
- source_word: נֵלֵךְ
  choice: maglalakbay kami
  rationale: Ang Qal imperfect na unang panauhang maramihan ay angkop na isinalin sa hinaharap; isinama sa pandiwa ang diwa ng דֶּרֶךְ upang maging natural sa Tagalog.
- source_word: בַּמִּדְבָּר
  choice: papunta sa ilang
  rationale: Ang מִדְבָּר ay karaniwang tumutukoy sa ilang o lupaing hindi tinitirhan, hindi kinakailangang mabuhanging disyerto. Ipinahahayag ng “papunta” ang kilos na nakapaloob sa נֵלֵךְ.
- source_word: וְזָבַחְנוּ
  choice: at maghahain
  rationale: Ang זבח ay tumutukoy sa paghahain o sakripisyal na pagkatay. Ang “maghahain” ay maikli, malinaw, at may angkop na kontekstong panrelihiyon.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinalin ang tetragrammaton bilang “Yahweh” upang mapanatili ang personal at tipanang pangalan sa tekstong Hebreo.
- source_word: אֱלֹהֵינוּ
  choice: na aming Diyos
  rationale: Tuwirang pinananatili ang unang panauhang maramihang hulapi at ang pagkakakilanlan kay Yahweh bilang Diyos ng nagsasalita at ng kanyang bayan.
- source_word: כַּאֲשֶׁר
  choice: ayon sa
  rationale: Ipinahahayag nito ang pagsunod o pag-ayon ng paghahain sa tagubilin ng Diyos, nang hindi dinaragdagan ang detalye.
- source_word: יֹאמַר אֵלֵינוּ
  choice: sasabihin niya sa amin
  rationale: Pinananatili ng anyong hinaharap ang karaniwang puwersa ng Hebrew imperfect sa kontekstong ito. Posible rin ang pangkasalukuyang pagbasa, kaya inilagay iyon sa talababa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang יְהוָה ang tahasang ginamit sa Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Panahunan ng יֹאמַר
  choice: sasabihin niya sa amin
  alternative: sinasabi niya sa amin
  rationale: Maaaring magpahiwatig ang imperfect ng inaasahang tagubilin sa hinaharap o ng pangkalahatan/pangkasalukuyang sinasabi. Pinili sa teksto ang hinaharap ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “ilang” sa halip na “disyerto” upang hindi maging mas tiyak kaysa sa Hebreo, at inilagay ang bawat talababa kaagad pagkatapos ng pariralang tinutukoy nito.
