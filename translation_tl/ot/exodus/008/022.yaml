revisions:
- from: Ngunit sinabi ni Moises, “Hindi tamang gawin iyon, sapagkat ihahandog namin kay Yahweh na aming Diyos ang kasuklam-suklam sa mga Ehipsiyo.[a] Kung ihahandog namin sa harap mismo nila ang kasuklam-suklam sa mga Ehipsiyo, hindi ba nila kami babatuhin?”
  to: Ngunit sinabi ni Moises, “Hindi nararapat na gawin iyon, sapagkat maghahandog kami kay Yahweh na aming Diyos ng itinuturing na kasuklam-suklam ng mga Ehipsiyo.[a] Kung maghahandog kami ng itinuturing na kasuklam-suklam ng mga Ehipsiyo sa harap ng kanilang mga mata, hindi ba nila kami babatuhin?”
  rationale: Pinalitan ang di-likas na nominal na “ang kasuklam-suklam sa mga Ehipsiyo” ng natural na Filipino na malinaw na naghahayag ng obhetibong diwa ng pariralang Hebreo. Inayos din ang talababa upang maipakita ang mas literal na konstruksyon nang hindi nagpapasok ng salitang “bagay” o nagtatakda ng tiyak na referent. Ang retorikal na tanong, ang pangalang Yahweh, at ang banta ng pambabato ay pinanatili.
