  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: tl
  text: Ngunit sinabi ni Moises, “Hindi nararapat na gawin iyon, sapagkat maghahandog kami kay Yahweh na aming Diyos ng itinuturing na kasuklam-suklam ng mga Ehipsiyo.[a] Kung maghahandog kami ng itinuturing na kasuklam-suklam ng mga Ehipsiyo sa harap ng kanilang mga mata, hindi ba nila kami babatuhin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang kasuklam-suklam ng mga Ehipsiyo.” Malamang na tumutukoy ang parirala sa itinuturing na kasuklam-suklam ng mga Ehipsiyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: tama
  rationale: Sa konteksto, tumutukoy ito sa nararapat o angkop. Ang “Hindi tamang gawin iyon” ay likas sa modernong Tagalog at pinananatili ang moral at praktikal na di-pagkaangkop.
- source_word: לַעֲשׂוֹת כֵּן
  choice: gawin iyon
  rationale: Likas at maikling katumbas ng idyomang “gawin nang gayon,” na tumutukoy sa mungkahi ni Faraon.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: ang kasuklam-suklam sa mga Ehipsiyo
  rationale: 'Pinananatili nito ang lakas ng תּוֹעֵבָה at ang posibleng obhetibong diwa: yaong itinuturing na kasuklam-suklam ng mga Ehipsiyo. Hindi tinutukoy nang tahasan kung mga hayop o ang gawa ng paghahandog ang tinutukoy.'
- source_word: נִזְבַּח
  choice: ihahandog namin
  rationale: Ang di-ganap na anyo ay nagpapahayag ng nilalayon o inaasahang paghahandog sa ilalim ng mungkahi ni Faraon. Ang “ihahandog” ay natural at malinaw sa Filipino.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang tahasang pangalang tipan na יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵינוּ
  choice: na aming Diyos
  rationale: Pinananatili ang tahasang panghalip na paari at ang pagkakakilanlan ni Yahweh bilang Diyos ng Israel.
- source_word: הֵן
  choice: Kung
  rationale: Dito ay ipinakikilala nito ang matingkad na kalagayang ipinapalagay na humahantong sa retorikal na tanong.
- source_word: לְעֵינֵיהֶם
  choice: sa harap mismo nila
  rationale: Natural na Filipino na pinananatili ang diin na hayagang makikita ng mga Ehipsiyo ang paghahandog.
- source_word: יִסְקְלֻנוּ
  choice: babatuhin ... kami
  rationale: Tiyak na tumutukoy ang pandiwa sa pag-atake o pagpatay sa pamamagitan ng mga bato; pinananatili ito nang tuwiran.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa pagkakaiba nito sa mga titulong gaya ng “Panginoon.”
- issue: Diwa ng תּוֹעֲבַת מִצְרַיִם
  choice: ang kasuklam-suklam sa mga Ehipsiyo
  alternative: ang kasuklam-suklam na bagay ng Ehipto; ang kinasusuklaman ng mga Ehipsiyo
  rationale: Pinakamalamang sa konteksto ang obhetibong diwa—ang handog na kasuklam-suklam sa paningin ng mga Ehipsiyo—ngunit ang pangunahing teksto at talababa ay hindi labis na tumutukoy kung ano mismo ang sanhi ng pagkasuklam.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ihahandog” para sa gawaing pansakripisyo, “sa harap mismo nila” upang maipahayag nang natural ang matingkad na idyomang Hebreo, at “babatuhin” upang mapanatili ang tiyak na banta.
