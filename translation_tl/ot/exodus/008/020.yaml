  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: tl
  text: At ginawa iyon ni Yahweh. Isang napakalaking kuyog[a] ang pumasok sa bahay ng Paraon at sa mga bahay ng kanyang mga lingkod. Sa buong lupain ng Ehipto, napinsala ang lupain dahil sa kuyog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang malaking kuyog.” Maaaring tumukoy ang salitang Hebreo sa napakalaking kuyog ng mga insekto; ayon sa tradisyon, mga langaw ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: ginawa nga iyon
  rationale: Likas na Filipino para sa idyomang Hebreo na nagsasaad na isinagawa ni Yahweh ang nauna niyang sinabi.
- source_word: וַיָּבֹא
  choice: pumasok
  rationale: Ipinahihiwatig ng kasunod na direksiyonal na anyo at ng mga bahay na ang kuyog ay pumasok, hindi lamang dumating.
- source_word: עָרֹב
  choice: kuyog
  rationale: Hindi tiyak ang eksaktong uri ng mga nilalang; pinananatili ng “kuyog” ang kalabuan at hindi tahasang nililimitahan sa mga langaw.
- source_word: כָּבֵד
  choice: napakalaking
  rationale: Sa kontekstong ito, ang literal na “mabigat” ay nagpapalakas sa laki o tindi ng kuyog; mas natural sa Filipino ang “napakalaking.”
- source_word: בֵּיתָה פַרְעֹה
  choice: sa bahay ng Paraon
  rationale: Ang direksiyonal na hulapi ay naipapahayag na ng pandiwang “pumasok”; pinananatili ang “bahay” sa halip na ipakahulugang “palasyo.”
- source_word: וּבֵית עֲבָדָיו
  choice: sa mga bahay ng kanyang mga lingkod
  rationale: Ginawang distributibo ang pang-isahang construct na “bahay” kasama ng maramihang “mga lingkod,” nang hindi nililimitahan ang עֲבָדִים sa “mga opisyal.”
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: sa buong lupain ng Ehipto
  rationale: Natural at komprehensibong salin ng saklaw na ipinahahayag ng parirala.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: napinsala ang lupain
  rationale: Ipinapahayag ang pagkasira o matinding pinsala nang hindi ipinapalagay na lubusang nawasak ang lupain.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: dahil sa kuyog
  rationale: Malinaw at likas na salin ng Hebreong idyomang nagsasaad ng sanhi.
theological_decisions:
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang banal na pangalan; pinananatili itong personal na pangalan sa halip na palitan ng titulong “PANGINOON.”
- issue: Pagkilala sa עָרֹב
  choice: Hindi tinukoy ang eksaktong uri; “kuyog”
  alternative: kuyog ng mga langaw
  rationale: Hindi tiyak sa salitang Hebreo ang espesye. Iniiwasang gawing tiyak sa pangunahing teksto ang tradisyonal ngunit interpretatibong pagkilalang mga langaw ang mga ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon,” “mga lingkod,” at “lupain” upang mapanatili ang biblikal na himig nang hindi nagiging lipas o teknikal. Inilagay ang talababa sa “kuyog,” ang salitang talagang nililinaw nito.
