  yaml_path: translation/ot/exodus/008/021.yaml
  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: tl
  text: Kaya ipinatawag ng Faraon sina Moises at Aaron at sinabi, “Humayo kayo at maghandog ng mga hain sa inyong Diyos sa lupain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maghandog ng mga hain sa inyong Diyos sa loob ng lupain,” ibig sabihin, sa loob ng Ehipto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa kontekstong ito, ang קרא ay tumutukoy sa pagpapatawag kina Moises at Aaron. Mas malinaw at natural sa Tagalog ang “ipinatawag” kaysa sa literal na “tinawag,” nang hindi dinaragdagan ang antas ng pormalidad.
- source_word: פַרְעֹה
  choice: Faraon
  rationale: Karaniwang anyong Tagalog ng titulong Hebreo na פַרְעֹה.
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: sina Moises at Aaron
  rationale: Ipinakikita ng אֶל ang mga taong ipinatawag. Ang “sina” ang natural na pananda sa Tagalog para sa dalawang pangalang pantangi bilang layon ng pandiwa.
- source_word: וַיֹּאמֶר
  choice: at sinabi
  rationale: Karaniwang salin ng narrative wayyiqtol ng אמר; malinaw na kina Moises at Aaron nakatuon ang sinabi.
- source_word: לְכוּ
  choice: Humayo kayo
  rationale: Pautos na maramihan ng הלך. Ang “humayo kayo” ay tuwiran, marangal, at angkop sa pahintulot na ibinibigay ng Faraon.
- source_word: זִבְחוּ
  choice: maghandog
  rationale: Ang זבח ay tumutukoy sa paghahandog ng hain. Sa modernong Tagalog, natural at sapat ang “maghandog”; hindi kailangang ulitin ang tahasang layon na “mga hain.”
- source_word: לֵאלֹהֵיכֶם
  choice: sa inyong Diyos
  rationale: Ang לְ ay tumutukoy sa tatanggap ng handog. Natural sa Tagalog ang “maghandog sa inyong Diyos.”
- source_word: בָּאָרֶץ
  choice: dito sa lupain
  rationale: Literal na “sa lupain.” Ang “dito” ay nagpapahayag ng kontekstuwal na kaibahan sa pagpunta sa ilang, ngunit hindi tahasang pinapalitan ang “lupain” ng “Ehipto.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Pinanatili ang “lupain” sa pangunahing teksto upang hindi gawing tahasan ang kontekstuwal na tinutukoy na Ehipto; ipinaliwanag ito sa talababa. Ginamit ang “Humayo” bilang dignified ngunit madaling maunawaang pautos.
