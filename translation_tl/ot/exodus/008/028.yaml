  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: tl
  text: Ngunit pinatigas din ng Faraon ang kanyang puso sa pagkakataong ito[a], at hindi niya hinayaang umalis ang bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “pinabigat niya ang kanyang puso.” Ipinahihiwatig ng idyomang ito na nagmatigas o hindi tumugon si Faraon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: pinatigas
  rationale: Ang pandiwa mula sa כבד ay literal na may diwang “magpabigat,” ngunit kapag puso ang layon, ipinahihiwatig nito ang kusang pagmamatigas o pagiging manhid. Ang “pinatigas” ay natural sa Filipino at pinananatiling si Faraon ang gumagawa ng kilos.
- source_word: לִבּוֹ
  choice: ang kanyang puso
  rationale: Pinananatili ang larawang Hebreo ng puso bilang sentro ng kalooban at saloobin.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: din ... sa pagkakataong ito
  rationale: Ipinakikita ng “din” na inulit ni Faraon ang dati niyang ginawa, samantalang natural na katumbas ng temporal na parirala ang “sa pagkakataong ito.”
- source_word: וְלֹא שִׁלַּח
  choice: at hindi niya hinayaang umalis
  rationale: Sa konteksto ng Exodo, ang שׁלח ay tumutukoy sa pagpapalaya o pagbibigay-pahintulot na umalis. Malinaw at likas sa modernong Filipino ang pariralang ito.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang pangngalang kolektibo ay tumutukoy sa Israel. Ang “bayan” ay maikli, marangal, at karaniwang salin sa ganitong konteksto.
- source_word: וַ
  choice: Ngunit
  rationale: Bagaman maaari itong payak na panandang pasalaysay, ipinakikita rito ng “Ngunit” ang salungat na tugon ni Faraon matapos ang naunang kaginhawahan.
theological_decisions:
- issue: Ang kumikilos sa pagpapatigas ng puso ni Faraon
  choice: Si Faraon mismo ang nagpatigas ng kanyang puso
  alternative: Tumigas ang puso ni Faraon
  rationale: Si Faraon ang tahasang simuno ng pandiwang Hebreo. Pinananatili nito ang kanyang pananagutan at ang tensiyong pasalaysay sa Exodo, kung saan sa ibang mga talata ay Diyos naman ang inilalarawang nagpapatigas sa puso ni Faraon.
translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang “Faraon” at “bayan” bilang pamilyar na bokabularyong biblikal, habang iniwasan ang labis na literal ngunit di-likas na “pinabigat ang puso” sa pangunahing teksto.
