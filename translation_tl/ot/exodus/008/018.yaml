  naturalness: Marangal at madaling unawain ang Tagalog. Mas natural para sa isang pulutong o kuyog ng insekto ang “pulutong ng mga insekto” kaysa “kawan ng mga insekto,” na mas karaniwang para sa hayop o ibon. Inayos din ang daloy ng pangungusap upang manatiling iisang pahayag ng layunin.
  terminology: Ang “Yahweh,” “lupain ng Gosen,” at “aking bayan” ay angkop. Pinananatili ng “pulutong ng mga insekto” ang di-tiyak na kahulugan ng עָרֹב nang hindi ito ipinagpapalagay na mga langaw lamang.
