  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: tl
  text: Ngunit sa araw na iyon, ibubukod ko ang lupain ng Gosen, kung saan naninirahan ang aking bayan, upang walang pulutong ng mga insekto[a] roon, at upang malaman mo na ako si Yahweh na nasa gitna ng lupain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kawan,” “mga pulutong,” o “pulutong ng mga langaw.” Hindi tiyak ang eksaktong uri ng nilalang na tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “nasa gitna ng daigdig.” Sa konteksto, malamang na tumutukoy ito sa lupain ng Ehipto.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: ibubukod ko
  rationale: Ang Hiphil ng פלא ay nagpapahayag dito ng pagtatangi o hiwalay na pakikitungo. Likas sa Tagalog ang “ibubukod ko” at malinaw na ipinahihiwatig ang pag-iingat sa Gosen mula sa salot.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: ang lupain ng Gosen
  rationale: Ang אֶרֶץ ay maaaring mangahulugang lupain, teritoryo, o rehiyon. Ang “lupain ng Gosen” ay malinaw at malapit sa anyo ng Hebreo.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: kung saan naninirahan ang aking bayan
  rationale: Bagaman literal na maaaring tumukoy ang עֹמֵד sa pagtayo o pananatili, sa kaugnayan nito sa isang lupain ay idiomatiko itong tumutukoy sa paninirahan.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: upang walang ... roon
  rationale: 'Pinananatili ng sugnay ang layunin o bunga ng konstruksiyong infinitive: hindi darating sa Gosen ang salot.'
- source_word: עָרֹב
  choice: kawan ng mga insekto
  rationale: Hindi tiyak ang eksaktong uri ng nilalang na tinutukoy ng עָרֹב. Ang “kawan ng mga insekto” ay natural at sapat na malawak upang hindi ito limitahan sa mga langaw lamang.
- source_word: לְמַעַן תֵּדַע
  choice: Sa gayon, malalaman mo
  rationale: Ipinahahayag nito ang layuning malaman ng kausap na lalaki, si Faraon. Natural sa modernong Tagalog ang “Sa gayon, malalaman mo” habang pinananatili ang puwersang purposibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: nasa gitna ng lupain
  rationale: Pinananatili nito ang lokatibong larawan ng Hebreo. Sa konteksto, malamang na tumutukoy ang “lupain” sa Ehipto, ngunit maaari ring basahin nang mas malawak bilang “daigdig.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng בְּקֶרֶב הָאָרֶץ
  choice: nasa gitna ng lupain
  alternative: nasa gitna ng daigdig
  rationale: Sa salaysay ng mga salot, malamang na ang tinutukoy ay ang lupain ng Ehipto. Gayunman, hindi nilulutas nang tahasan ng salin ang mas malawak na posibleng kahulugan ng הָאָרֶץ; inilalagay ito sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “bayan” para sa kolektibong עַם at ang “naninirahan” bilang natural na katumbas ng idiomatikong pananatili sa lupain. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
