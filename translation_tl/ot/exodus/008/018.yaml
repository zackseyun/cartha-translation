    rationale: Ang talababa [a] ay tungkol sa עָרֹב, ngunit nakadikit ito sa “roon” sa halip na sa katumbas nitong “kawan ng mga insekto.” Dapat itong ilagay agad pagkatapos ng katawagang iyon.
