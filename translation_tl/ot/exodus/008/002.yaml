  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: tl
  text: Iniunat ni Aaron ang kanyang kamay sa ibabaw ng mga katubigan ng Ehipto, at umahon ang mga palaka[a] at tinakpan ang lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, isahan ang anyo: “ang palaka.” Malamang na kolektibo ang gamit nito, kaya isinaling “mga palaka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: iniunat
  rationale: Ang pandiwang נָטָה sa kontekstong ito ay tumutukoy sa pag-uunat ng kamay bilang isang makapangyarihang tanda; natural at tiyak ang “iniunat” sa modernong Tagalog.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Tahasang “kamay” ang nasa Hebreo, kaya pinanatili ang kongkretong larawan sa halip na gawing “braso.”
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Ipinahihiwatig dito ang posisyong patong o nakataas kaugnay ng mga katubigan; malinaw at natural ang “sa ibabaw ng.”
- source_word: מֵימֵי מִצְרָיִם
  choice: mga katubigan ng Ehipto
  rationale: Ang anyong maramihan ay sama-samang tumutukoy sa mga anyong-tubig ng Ehipto. Naipahahayag ito nang maikli at marangal ng “mga katubigan.”
- source_word: וַתַּעַל
  choice: umahon
  rationale: Inilalarawan ng עָלָה ang pag-ahon ng mga palaka mula sa tubig patungo sa lupain; ito ang likas na pandiwa sa Tagalog para sa galaw na iyon.
- source_word: הַצְּפַרְדֵּעַ
  choice: mga palaka
  rationale: Bagaman isahan ang anyo ng pangngalan sa Hebreo, malamang na kolektibo ang gamit nito. Ang maramihang “mga palaka” ang natural sa Tagalog at naaayon sa pagtakip nila sa lupain.
- source_word: וַתְּכַס
  choice: tinakpan
  rationale: Direktang ipinahahayag ng pandiwa ang pagtatakip sa lupain; pinananatili ng “tinakpan” ang payak ngunit matingkad na larawan.
- source_word: אֶרֶץ מִצְרָיִם
  choice: lupain ng Ehipto
  rationale: Ang אֶרֶץ dito ay teritoryo o lupain ng Ehipto, hindi ang buong daigdig.
