translation_notes:
  register: Gumamit ng malinaw, kasalukuyan, at marangal na Tagalog. Pinili ang “mga katubigan” upang maipahayag ang kolektibong maramihan ng Hebreo, at inilagay ang talababa sa “mga palaka,” ang mismong salitang tinutukoy nito.
