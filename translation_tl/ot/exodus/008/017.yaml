base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: tl
  text: Sapagkat kung hindi mo pahihintulutang umalis ang aking bayan, narito, magpapadala ako ng kuyog laban sa iyo, sa iyong mga lingkod, sa iyong bayan, at sa iyong mga bahay. Mapupuno ng kuyog ang mga bahay sa Ehipto, pati ang lupang kinaroroonan nila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kung
  rationale: Ipinapanatili ang pang-ugnay at kondisyonal na babala na nakabatay sa naunang pahayag.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: kung hindi mo pahihintulutang umalis ang aking bayan
  rationale: Natural na Filipino para sa idyomang tumutukoy sa pagpapalaya sa bayan, hindi lamang sa pagpapadala sa kanila.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: masdan mo, magpapadala ako
  rationale: Ang “masdan mo” ay nagpapanatili sa taimtim na diin ng pormulang Hebreo, samantalang ang hinaharap na pandiwa ay malinaw na naghahayag ng nalalapit at tiyak na pagkilos.
- source_word: הֶעָרֹב
  choice: kawan-kawang mga insekto
  rationale: Hindi tiyak ang eksaktong uri ng nilalang sa salitang Hebreo. Ang pariralang ito ay natural sa Filipino at hindi nililimitahan ang kahulugan sa mga langaw lamang.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ וּבְבָתֶּיךָ
  choice: laban sa iyo, sa iyong mga lingkod, sa iyong bayan, at sa iyong mga bahay
  rationale: Ipinakikita ng mga pang-ukol ang mga tatamaan ng salot at pinananatili ang paulit-ulit na retorikal na pag-igting.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: Mapupuno ... ang mga bahay sa Ehipto
  rationale: Malinaw at likas na Filipino para sa resultang ipinahahayag ng pandiwang Hebreo.
- source_word: וְגַם הָאֲדָמָה אֲשֶׁר הֵם עָלֶיהָ
  choice: pati ang lupa na kinaroroonan nila
  rationale: Pinananatili ang posibilidad na pisikal na lupa o mas malawak na lupain ang tinutukoy, habang natural ang hulíng sugnay sa Filipino.
