translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עַם, “mga lingkod” bilang dignified at contextually appropriate na katumbas ng עֲבָדִים, at “kawan-kawang mga insekto” upang mapanatili ang leksikal na kawalang-katiyakan ng עָרֹב.
