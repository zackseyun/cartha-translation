base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: tl
  text: Sinabi niya, “Bukas.” At sinabi ni Moises, “Gaya ng sinabi mo[a], upang malaman mong walang katulad si Yahweh, ang aming Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ayon sa iyong salita.”
    reason: Ipinakikita ang literal na idyomang Hebreo na isinaling “Gaya ng sinabi mo.”
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya / At sinabi ni Moises
  rationale: Ang dalawang anyo ay karaniwang pandiwang pasalaysay mula sa אמר. Nilinaw sa ikalawang pangungusap na si Moises ang nagsasalita, ayon sa daloy ng pag-uusap, upang maiwasan ang kalituhan sa natural na Tagalog.
- source_word: לְמָחָר
  choice: Bukas
  rationale: Tuwirang sagot ni Faraon tungkol sa panahong hinihingi niya.
- source_word: כִּדְבָרְךָ
  choice: Masusunod ang sinabi mo
  rationale: Natural na Tagalog para sa literal na ‘ayon sa iyong salita’; ipinahahayag nito ang pagsang-ayon ni Moises sa panahong itinakda ni Faraon nang hindi binabago ang diwa.
- source_word: לְמַעַן תֵּדַע
  choice: upang malaman mo
  rationale: Pinananatili ang sugnay na nagsasaad ng layunin at ang tuwirang pagtukoy kay Faraon.
- source_word: אֵין כַּיהוָה
  choice: walang katulad si Yahweh
  rationale: Ang אֵין kasama ng paghahambing na כ־ ay nagpapahayag na walang sinumang maihahambing kay Yahweh.
- source_word: אֱלֹהֵינוּ
  choice: aming Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, iisang Diyos ng Israel ang tinutukoy rito; ang hulaping unang panauhang maramihan ay ‘aming.’
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang pangalang tipan na YHWH. Ang ‘Yahweh’ ay nag-iingat sa pagkakaiba nito sa titulong ‘Panginoon’ at hindi ginagawang karaniwang titulo ang personal na pangalan.
- issue: Diwa ng pahayag na אֵין כַּיהוָה
  choice: walang katulad si Yahweh
  alternative: walang ibang Diyos maliban kay Yahweh
  rationale: Paghahambing ang tahasang anyo ng Hebreo—‘walang tulad ni Yahweh’—kaya hindi ito pinalawak tungo sa ibang pormulasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Moises” sa ikalawang sugnay para malinaw ang nagpapalitan ng nagsasalita; hindi nito binabago ang tinutukoy ng tekstong Hebreo.
