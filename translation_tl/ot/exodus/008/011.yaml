base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: tl
  text: Ngunit nang makita ng Faraon na nagkaroon ng ginhawa[a], pinatigas niya ang kanyang puso at hindi siya nakinig sa kanila, gaya ng sinabi na ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagkaroon ng pagluwag.” Ang salitang Hebreo ay maaaring tumukoy sa ginhawa, pagluwag, o pagkakataong makahinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: nang makita
  rationale: Pinananatili ang karaniwang kahulugan ng ראה at likas din sa Filipino bilang pagkilala ng Faraon sa nagbago nang kalagayan.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: na nagkaroon ng ginhawa
  rationale: Ang הָרְוָחָה ay tumutukoy sa pagluwag ng paghihirap o presyon. Malinaw at natural ang “nagkaroon ng ginhawa” sa konteksto ng salot.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: pinatigas niya ang kanyang puso
  rationale: Bagaman literal na “pinabigat niya ang kanyang puso,” ang causative na idyoma ay tumutukoy sa kusang pagmamatigas. Pinananatili rin ng salin ang aktibong pananagutan ng Faraon.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: at hindi siya nakinig sa kanila
  rationale: Tuwirang sinasalin ang שׁמע אֶל bilang pakikinig o pagbibigay-pansin, nang hindi labis na tinutukoy ito bilang pagsunod.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Ipinahahayag na natupad ang naunang sinabi ni Yahweh. Sapat na ipinahihiwatig ng konteksto ng salaysay ang pagkauna ng pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa Tetragrammaton sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang gumaganap sa pagpapatigas ng puso ng Faraon
  choice: Ang Faraon mismo ang aktibong nagpatigas ng kanyang puso sa talatang ito.
  alternative: Naging matigas ang kanyang puso, o ipinahiwatig dito na Diyos ang nagpatigas nito.
  rationale: Aktibong causative ang pandiwang Hebreo at ang Faraon ang paksa. Hindi inililipat sa talatang ito ang pagkilos ng Diyos na hayagang binabanggit sa ibang mga talata, kaya nananatili ang tensiyong teolohikal ng salaysay.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang “Faraon” bilang karaniwang anyo ng titulo, “ginhawa” para sa malinaw na pagluwag mula sa salot, at ang nakaugaliang biblikal na idyomang “pinatigas ang puso.”
