  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ng Paraon sina Moises at Aaron at sinabi niya, “Magsumamo kayo[a] kay Yahweh na alisin niya ang mga palaka sa akin at sa aking bayan. Palalayain ko ang bayan[b] upang makapaghain sila kay Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Manalangin kayo” o “Mamagitan kayo.” Ang pandiwang Hebreo ay maaaring mangahulugan ng taimtim at madaliang pagdalangin o pakikiusap.
    reason: lexical_alternative
  - marker: b
    text: O “at makapaghain sila kay Yahweh.” Maaaring basahin ang Hebreo bilang payak na pag-uugnay, bagaman malamang na ipinahahayag dito ang layunin ng pagpapalaya ng Paraon.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa kayariang קרא + לְ, ipinahihiwatig na ipinatawag o ipinaharap ng Paraon sina Moises at Aaron; natural sa modernong Tagalog ang “ipinatawag.”
- source_word: הַעְתִּירוּ
  choice: Magsumamo kayo
  rationale: Ang Hiphil ng עתר ay tumutukoy sa taimtim o madaliang pagdalangin at pakikiusap. Mas malinaw na naipapahayag ng “magsumamo” ang tindi nito kaysa sa pangkalahatang “manalangin.”
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ang אֶל ay likas na isinasalin bilang “kay” kapag ang tinutukoy ay persona, at pinananatili ang pangalang tipan na Yahweh para sa יְהוָה.
- source_word: וְיָסֵר
  choice: na alisin niya
  rationale: Ang Hiphil ng סור ay “alisin.” Kasunod ng pautos na pakiusap, ipinakikita ng “na” ang nilalaman ng ipinapakiusap nang hindi dinaragdagan ang diwa.
- source_word: הַצְפַרְדְּעִים
  choice: ang mga palaka
  rationale: Tuwirang salin ng pangngalang maramihan na may pantukoy.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: sa akin at sa aking bayan
  rationale: Sa Tagalog, sapat at natural ang “alisin ... sa” upang ipahayag ang paglayo mula sa Paraon at sa kanyang bayan; pinananatili ang dalawang saklaw ng kahilingan.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: Palalayain ko ang bayan
  rationale: Ipinahahayag ng cohortative ang ipinangako o ipinasyang gagawin ng Paraon. Ang “palalayain” ay natural na katumbas ng idyomang “let the people go.”
- source_word: וְיִזְבְּחוּ
  choice: upang makapaghain sila
  rationale: Sa kontekstong ito, maaaring ipahayag ng prefixed verb ang layunin o bunga ng pagpapalaya. Ang “makapaghain” ay tumutukoy sa paghahandog ng sakripisyo nang natural sa Tagalog.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang “kay” sa paghahaing iniuukol sa isang persona, at pinananatili ang banal na pangalang Yahweh.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Hayagang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Ugnayan ng וְיִזְבְּחוּ sa pangakong pagpapalaya
  choice: 'layunin: “upang makapaghain sila”'
  alternative: 'payak na pag-uugnay: “at makapaghain sila”'
  rationale: Maaaring ipahiwatig ng kasunod na prefixed verb ang nilalayong bunga ng pagpapalaya. Ang “upang” ang pinakamalinaw na pagbasa sa konteksto, ngunit nananatiling posible ang payak na pag-uugnay at itinatala ito sa talababa.
- issue: Tindi ng utos na הַעְתִּירוּ
  choice: Magsumamo kayo
  alternative: Manalangin kayo; mamagitan kayo
  rationale: Hindi lamang karaniwang pananalangin ang maaaring ipahiwatig ng pandiwa kundi taimtim at madaliang pakiusap. Pinananatili ng “magsumamo” ang tinding iyon nang hindi nagdaragdag ng denominasyonal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “ipinatawag,” “magsumamo,” at “palalayain” bilang malinaw na pananalita para sa karaniwang mambabasa, habang pinanatili ang seryosong himig at ang posibleng ibang pagbasa ng huling sugnay sa talababa.
