  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: tl
  text: Nang makita iyon ng mga anak ni Israel, sinabi nila sa isa’t isa[a], “Ano ito?”[b] Sapagkat hindi nila alam kung ano iyon. Sinabi ni Moises sa kanila, “Iyan ang tinapay na ibinigay sa inyo ni Yahweh upang kainin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal sa Hebreo, “isang lalaki sa kanyang kapatid.” Idyoma ito na nangangahulugang nagsalita sila sa isa’t isa.
    reason: lexical_alternative
  - marker: b
    text: Ang pananalitang Hebreo sa likod ng “Ano ito?” ay tradisyonal na iniuugnay sa pangalang “manna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyong pangkamag-anakan ng Hebreo habang natural at pamilyar pa rin sa marangal na modernong Tagalog.
- source_word: אִישׁ אֶל־אָחִיו
  choice: sa isa't isa
  rationale: Idyoma ito para sa gantihang pagsasalita; mas natural sa Tagalog kaysa sa literal na 'bawat lalaki sa kanyang kapatid.'
- source_word: מָן הוּא
  choice: Ano ito?
  rationale: Sa konteksto, tanong ito tungkol sa hindi pa nila nakikilalang bagay. Hindi muna ginawang pangngalang 'manna' upang mapanatili ang daloy at paglalaro sa salita.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: hindi nila alam kung ano iyon
  rationale: Tuwirang inilalahad ang paliwanag ng salaysay at natural ang paglipat mula 'ito' sa tanong tungo sa 'iyon' bilang tinutukoy na bagay.
- source_word: הוּא הַלֶּחֶם
  choice: Iyan ang tinapay
  rationale: Ang panghalip at pangngalan ay nagpapakilala sa bagay na nasa harap nila; natural sa Tagalog ang 'Iyan ang tinapay.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalan ng Diyos, hindi pinapalitan ng titulong 'PANGINOON.'
- source_word: לְאָכְלָה
  choice: upang kainin
  rationale: Malinaw na ipinahahayag ang layunin ng pagkakaloob at tumutugma sa gamit ng anyong Hebreo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kung gagawing pangngalang pantangi ang מָן sa pangunahing teksto
  choice: Isinalin bilang tanong na “Ano ito?”
  alternative: “Manna iyon” o “Manna?”
  rationale: Ipinakikita ng kasunod na sugnay na hindi nila alam kung ano ang bagay. Ang paggamit agad ng 'manna' ay magpapahina sa tanong at sa pinagmulan ng katawagan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga anak ni Israel” upang mapanatili ang anyong Hebreo, at ang “sa isa't isa” upang likas na maipahayag ang idyoma. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto.
