  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: tl
  text: At habang nagsasalita si Aaron sa buong kapulungan ng mga anak ni Israel, humarap sila sa ilang, at narito, lumitaw sa ulap ang kaluwalhatian ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Habang nagsasalita
  rationale: Ang וַיְהִי ay bahagi ng daloy ng salaysay at ang כְּ na may infinitive construct ay nagpapahiwatig ng magkasabay na pangyayari. Natural sa modernong Tagalog ang “Habang nagsasalita” nang hindi gumagamit ng mabigat na “At nangyari.”
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: buong kapulungan ng mga anak ni Israel
  rationale: Pinananatili ng “kapulungan” ang diwa ng עֵדָה bilang buong nagkakatipong pamayanan, at ng “mga anak ni Israel” ang tahasang anyong pampamilya ng בְּנֵי יִשְׂרָאֵל.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: humarap sila sa ilang
  rationale: Ang פנה אֶל ay paglingon o pagharap sa direksiyon ng isang bagay. Ang “humarap sa ilang” ay maikli, natural, at hindi nagpapahiwatig na pumasok sila rito.
- source_word: וְהִנֵּה
  choice: at naroon—
  rationale: Ang הִנֵּה ay biglang nagtutuon ng pansin sa sumunod na tanawin. Ang “naroon” na sinusundan ng gitling ay naghahatid ng pagkabigla at diin nang mas natural kaysa sa arkaikong “masdan.”
- source_word: כְּבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Ang כָּבוֹד ay tumutukoy rito sa nakikitang pagpapakita ng banal na kaluwalhatian; ang personal na pangalang יְהוָה ay tinumbasan ng “Yahweh.”
- source_word: נִרְאָה בֶּעָנָן
  choice: nahayag sa ulap
  rationale: Ang Niphal נִרְאָה ay maaaring “lumitaw,” “nakita,” o “nahayag.” Ang “nahayag” ay natural para sa banal na pagpapakita at pinananatili ng “sa ulap” ang tiyak na artikulo sa Hebrew.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebrew, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Pagtutumbas sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang literal na ugnayang pampamilya sa Hebrew nang malinaw at katanggap-tanggap sa Tagalog.
- issue: Paraan ng pagpapakita ng kaluwalhatian
  choice: nahayag sa ulap
  alternative: nakita sa ulap / lumitaw sa ulap
  rationale: Hindi nililinaw ng teksto kung ang kaluwalhatian ay nasa loob ng ulap o ipinakita sa pamamagitan nito; pinananatili ng “sa ulap” ang saklaw ng orihinal na parirala.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang arkaikong “masdan” at ang mabigat na literalismong “at nangyari,” habang pinanatili ang biglang retorikal na diin ng וְהִנֵּה sa pamamagitan ng “at naroon—”.
