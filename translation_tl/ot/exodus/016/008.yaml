source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: tl
  text: Sinabi ni Moises, “Kapag binigyan kayo ni Yahweh ng karneng makakain sa gabi at ng tinapay sa umaga hanggang sa mabusog kayo, iyon ay dahil naririnig ni Yahweh ang mga reklamo ninyo—ang pagrereklamo ninyo laban sa kanya.[a] Ano ba kami? Hindi laban sa amin ang mga reklamo ninyo, kundi laban kay Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, magkaugnay na pangngalan at pandiwa ang inuulit: “ang mga reklamo ninyo … ang pagrereklamo ninyo.” Pinatitindi nito ang paratang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: Kapag binigyan
  rationale: Ang ב na may infinitive construct ay nagpapahayag dito ng kalagayang temporal. Likas sa Tagalog ang “kapag binigyan” at angkop ito sa ipinahahayag na gagawin ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin sa transliterasyong “Yahweh” ang personal na pangalang יְהוָה sa halip na palitan ito ng isang titulo.
- source_word: בָּשָׂר
  choice: karne
  rationale: Sa konteksto ng pagkain, “karne” ang natural at tiyak na katumbas sa makabagong Tagalog.
- source_word: לֶחֶם
  choice: tinapay
  rationale: Pinananatili ng “tinapay” ang kongkretong larawan ng salitang Hebreo at ang kaugnayan nito sa pagkaing ibibigay sa umaga.
- source_word: לִשְׂבֹּעַ
  choice: hanggang sa mabusog kayo
  rationale: Malinaw at natural nitong ipinahahayag ang ganap na pagkasapat o pagkabusog na tinutukoy ng שבע.
- source_word: בִּשְׁמֹעַ
  choice: iyon ay dahil naririnig
  rationale: Bagaman maaaring temporal ang konstruksiyon, ipinahihiwatig ng konteksto rito ang dahilan ng pagkakaloob. Nililinaw ng parirala ang ugnayang sanhi nang hindi dinaragdagan ang nilalaman.
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: mga reklamo ninyo—ang pagrereklamo ninyo
  rationale: Pinananatili ang pag-uulit ng pangngalan at kaugnay na pandiwa sa Hebreo, habang gumagamit ng karaniwan at madaling maunawaang salitang Tagalog.
- source_word: וְנַחְנוּ מָה
  choice: Ano ba kami?
  rationale: Pinananatili ang literal na “ano,” na nagdidiin sa kawalang-halaga nina Moises at Aaron bilang mga puntirya ng reklamo; nagbibigay ang “ba” ng natural na himig sa retorikal na tanong.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: Hindi laban sa amin ang mga reklamo ninyo, kundi laban kay Yahweh
  rationale: Malinaw na ipinapakita ng “hindi ... kundi” ang mariing pagsalungat sa huling sugnay.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang tuwirang ginagamit sa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Ang pinatutungkulan ng mga reklamo ng Israel
  choice: laban kay Yahweh
  alternative: tungkol kay Yahweh
  rationale: Sa konteksto ng pagsaway, ang עַל ay nagpapahiwatig ng pagtutol o pagreklamo laban sa Diyos, hindi lamang ng paksa ng reklamo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “karne,” “tinapay,” “mabusog,” at “mga reklamo” bilang karaniwang salitang madaling maunawaan. Pinanatili ang retorikal na “Ano ba kami?” at ang pag-uulit sa Hebreo nang hindi nagiging labis na mekanikal.
