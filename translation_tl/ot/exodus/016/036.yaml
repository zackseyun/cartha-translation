  text: An omer is a tenth of an ephah[a].
translation:
  language: tl
  text: Ang isang omer ay ikasampung bahagi ng isang efa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang omer at efa ay mga sinaunang Hebreong panukat sa tuyong bagay; itinatakda ng talatang ito na ang isang omer ay ikasampung bahagi ng isang efa.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: isang omer
  rationale: Ang עֹמֶר ay sinaunang yunit ng panukat sa tuyong bagay. Pinanatili ang transliterasyong “omer” upang maiwasan ang hindi tiyak na modernong katumbas; natural sa Filipino ang “isang omer” sa isang pahayag na nagbibigay-kahulugan.
- source_word: עֲשִׂרִית
  choice: ikasampung bahagi
  rationale: Tumutukoy ito sa isang bahagi sa sampung magkakapantay na bahagi. Malinaw at likas sa Filipino ang “ikasampung bahagi.”
- source_word: הָאֵיפָה
  choice: ng isang efa
  rationale: Ang אֵיפָה ay isa pang sinaunang yunit ng panukat sa tuyong bagay. Pinanatili bilang “efa,” ang karaniwang anyong transliterado sa Filipino, sa halip na palitan ng di-eksaktong modernong sukat.
- source_word: הוּא
  choice: ay
  rationale: Gumaganap ang panghalip bilang pang-ugnay sa nominal na sugnay; natural itong ipinapahayag sa Filipino sa pamamagitan ng “ay.”
- source_word: וְ
  choice: hindi tahasang isinalin
  rationale: Ang וְ dito ay nagpapakilala ng paliwanag. Hindi kailangan ang literal na “at” sa Filipino dahil magiging mas natural at malinaw ang tuwirang pahayag na nagbibigay-kahulugan.
