    issue: Malabo at paulit-ulit ang “Itabi ... upang ingatan.”
    rationale: Ang לְמִשְׁמֶרֶת ay tumutukoy sa pag-iingat/pagpapanatili ng buong omer. Ang “magtabi ... upang maingatan” ay mas malinaw at natural na Tagalog, nang hindi binabago ang kahulugan.
