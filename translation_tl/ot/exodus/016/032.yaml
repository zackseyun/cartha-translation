  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: tl
  text: 'At sinabi ni Moises, “Ito ang iniutos ni Yahweh: Magtabi kayo ng isang buong omer[a] nito upang maingatan para sa inyong mga salinlahi, nang sa gayon ay makita nila ang tinapay na ipinakain ko sa inyo sa ilang nang ilabas ko kayo mula sa lupain ng Ehipto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang omer ay isang sinaunang yunit ng takal; literal, “isang omer na puno,” ibig sabihin, isang buong takal na omer.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: At sinabi ni Moises
  rationale: Pinananatili ang karaniwang daloy ng salaysay sa Hebreo sa natural na paraang Tagalog.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: Ito ang iniutos ni Yahweh
  rationale: Natural at tuwirang ipinahahayag sa Tagalog ang tiyak na utos; isinasalin ang pangalang tipan na יְהוָה bilang “Yahweh.”
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: isang buong omer nito
  rationale: Pinananatili ang sinaunang yunit na omer at malinaw na ipinahahayag ang kahulugang isang punong takal mula sa manna.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: upang ingatan sa lahat ng inyong salinlahi
  rationale: Ipinakikita ang layuning mapanatili ang bahagi ng manna bilang alaala para sa sunod-sunod na mga salinlahi.
- source_word: לְמַעַן יִרְאוּ
  choice: nang sa gayon ay makita nila
  rationale: Pinananatili ang sugnay ng layunin at ang di-tahasang pagtukoy ng “nila” sa mga salinlahing kababanggit lamang.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: ang tinapay na ipinakain ko sa inyo
  rationale: Ang “tinapay” ay malapit sa literal na kahulugan ng לֶחֶם, habang ang “ipinakain” ay angkop sa causative na anyo ng pandiwang Hebreo.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, likas, at dignified na salin ng מִדְבָּר bilang lupaing ilang, hindi lamang mabuhanging disyerto.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: nang ilabas ko kayo mula sa lupain ng Ehipto
  rationale: Natural na ipinahahayag ang temporal na gamit ng infinitive construct at pinananatili ang “lupain ng Ehipto.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng tinapay
  choice: tinapay
  alternative: pagkain; manna
  rationale: Pinananatili ang mismong salitang לֶחֶם at hindi tahasang pinapalitan ng “manna,” bagaman iyon ang tinutukoy sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino; pinananatili ang sinaunang yunit at ang banal na pangalan, habang iniiwasan ang labis na literal o lipas na ayos ng pangungusap.
