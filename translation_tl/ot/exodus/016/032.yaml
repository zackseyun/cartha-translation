revisions:
- from: 'At sinabi ni Moises, “Ito ang iniutos ni Yahweh: Itabi ang isang buong omer[a] nito upang ingatan sa lahat ng inyong salinlahi, nang sa gayon ay makita nila ang tinapay na ipinakain ko sa inyo sa ilang nang ilabas ko kayo mula sa lupain ng Ehipto.”'
  to: 'At sinabi ni Moises, “Ito ang iniutos ni Yahweh: Magtabi kayo ng isang buong omer[a] nito upang maingatan para sa inyong mga salinlahi, nang sa gayon ay makita nila ang tinapay na ipinakain ko sa inyo sa ilang nang ilabas ko kayo mula sa lupain ng Ehipto.”'
  rationale: Pinalitan ang “Itabi ang ... upang ingatan” ng “Magtabi kayo ng ... upang maingatan” upang maging malinaw na ang buong omer ang pananatilihin. Ang “para sa inyong mga salinlahi” ay likas na pagpapahayag ng saklaw na panghinaharap ng לְדֹרֹתֵיכֶם. Walang ibang pagbabagong pangkahulugan ang ginawa.
