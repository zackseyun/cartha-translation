  source_fidelity: Tumpak ang pautos na maramihan na “Kainin ninyo ito,” ang tatlong diin sa היום (“ngayon/araw na ito”), ang Sabbath, at ang pagtukoy sa bukid. Gayunman, ang “matatagpuan nito” ay hindi wastong panghalip para sa tuwirang layon ng “matatagpuan”; ang Hebreo ay “hindi ninyo ito masusumpungan/matatagpuan.”
