  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: tl
  text: Sinabi ni Moises, “Kainin ninyo ito ngayon, sapagkat ang araw na ito ay Sabbath para kay Yahweh; ngayon ay hindi ninyo ito matatagpuan sa bukid.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Kainin ninyo ito
  rationale: Tuwirang inililipat ang pautos na maramihan at ang panghalip na tumutukoy sa manna.
- source_word: שַׁבָּת
  choice: Sabbath
  rationale: Pinananatili ang kinikilalang terminong biblikal para sa itinakdang araw ng pamamahinga.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Inililipat ang pangalang pantangi ng Diyos sa tekstong Hebreo sa karaniwang transliterasyong Tagalog.
- source_word: לֹא תִמְצָאֻהוּ בַּשָּׂדֶה
  choice: wala kayong matatagpuan nito sa bukid
  rationale: Likas na Tagalog na nagpapanatili sa ikalawang panauhang maramihan, sa bagay na tinutukoy, at sa lugar.
theological_decisions:
- issue: Ugnayan ng Sabbath kay Yahweh
  choice: Sabbath para kay Yahweh
  alternative: Sabbath ni Yahweh
  rationale: Pinananatili ng “para kay” ang malawak na diwa ng לַיהוָה—isang araw na nakatalaga o nauukol kay Yahweh—nang hindi labis na nililinaw ang eksaktong relasyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tatlong ulit na diin sa “ngayon/araw na ito” ayon sa Hebreo, habang ginawang natural ang daloy ng pangungusap.
