  terminology: Ang “Sabbath” at “Yahweh” ay pare-pareho sa mga nakasaad na terminolohikal na pasya. Ang “para kay Yahweh” ay katanggap-tanggap na malawak na pagsasalin ng lamed at hindi nagdaragdag ng doktrinal na pagpapakahulugan.
