base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: tl
  text: Umalis sila sa Elim, at ang buong kapulungan ng mga Israelita[a] ay dumating sa ilang ng Sin[b], na nasa pagitan ng Elim at Sinai, noong ikalabinlimang araw ng ikalawang buwan pagkatapos nilang lumabas mula sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel.” Karaniwang katawagan ito sa buong bayan ng Israel at hindi lamang sa mga lalaki.
    reason: lexical_alternative
  - marker: b
    text: Ang “Sin” ay pangalan ng lugar—ang ilang ng Sin—at hindi tumutukoy sa kasalanan. Naiiba rin ito sa Sinai.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Sa salaysay ng paglalakbay sa ilang, ang נסע ay tumutukoy sa pag-alis ng kampo upang magpatuloy sa paglalakbay. Natural sa makabagong Tagalog ang “umalis sila” nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: מֵאֵילִם
  choice: sa Elim
  rationale: Pangalan ng lugar ang אֵילִם, kaya tinumbasan ito sa pamamagitan ng transliterasyong “Elim.” Sa pariralang “umalis ... sa Elim,” likas na ipinahihiwatig ng “sa” ang pinanggalingan.
- source_word: וַיָּבֹאוּ
  choice: ay dumating
  rationale: Karaniwang pandiwa ng pagkilos ang בוא. Tumpak at natural na inilalahad ng “dumating” ang kasunod na yugto ng paglalakbay.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: ang buong kapulungan ng mga Israelita
  rationale: Pinananatili ng “buong kapulungan” ang kolektibong diwa ng כָּל עֲדַת. Ang “mga Israelita” ay natural at saklaw ang buong bayan; ipinaliliwanag sa talababa ang literal na ekspresyong pampamilya ng Hebreo.
- source_word: אֶל מִדְבַּר סִין
  choice: sa ilang ng Sin
  rationale: Ang מִדְבָּר ay lupaing ilang, hindi kinakailangang purong disyerto. Pangalan ng lugar ang סִין at pinanatili bilang “Sin.”
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: na nasa pagitan ng Elim at Sinai
  rationale: Direktang inilalarawan ng sugnay ang kinaroroonan ng ilang. Ang “nasa pagitan” ay malinaw at natural na katumbas ng בֵּין ... וּבֵין.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: noong ikalabinlimang araw ng ikalawang buwan
  rationale: Ito ang natural na anyo ng petsa sa Tagalog at tapat sa pagkakasunod ng araw at buwan sa Hebreo.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: mula nang lumabas sila sa lupain ng Ehipto
  rationale: Ginagamit ng parirala ang paglabas mula sa Ehipto bilang panimulang punto ng pagtukoy sa petsa. Malinaw itong naihahayag ng “mula nang,” habang pinananatili ang “lupain ng Ehipto.”
