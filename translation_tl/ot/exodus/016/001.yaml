translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan” para sa pambansang pagtitipon at “ilang” para sa מִדְבָּר. Hinati sa dalawang pangungusap ang mahabang Hebreong pangungusap upang maging natural basahin nang hindi binabago ang ugnayan ng mga detalye.
