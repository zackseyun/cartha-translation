base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: tl
  text: Sa loob ng anim na araw ay titipunin ninyo iyon, ngunit sa ikapitong araw—isang Sabbath[a]—ay wala niyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang ikapitong araw, Sabbath.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, walang manna sa araw na iyon.
    reason: clarification
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sa loob ng anim na araw
  rationale: Likas na ipinahahayag sa Tagalog ang panahong saklaw ng Hebreong pariralang nangangahulugang ‘anim na araw.’
- source_word: תִּלְקְטֻהוּ
  choice: titipunin ninyo iyon
  rationale: Ang pandiwa ay nasa ikalawang panauhang maramihan at may layong ikatlong panauhang panlalaki; pinananatili ng ‘titipunin ninyo iyon’ ang hinaharap na may lakas ng tagubilin at ang pagtukoy sa manna nang hindi inuulit ang pangalan nito.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ngunit sa ikapitong araw
  rationale: Maaaring payak na ‘at’ ang waw, ngunit malinaw na pasalungat ang ugnayan nito sa anim na naunang araw; natural sa Tagalog ang ‘ngunit.’
- source_word: שַׁבָּת
  choice: isang Sabbath
  rationale: Walang pantukoy ang שַׁבָּת at nakatambal bilang paliwanag sa ‘ikapitong araw.’ Pinananatili ng ‘isang Sabbath’ ang anyong pangngalan at hindi ito agad ipinapakahulugang ‘araw ng pahinga.’
- source_word: לֹא יִהְיֶה בּוֹ
  choice: ay wala niyon
  rationale: Literal na ‘hindi magkakaroon niyon doon/sa araw na iyon.’ Sa konteksto, ang tinutukoy ay ang manna. Ang ‘wala niyon’ ay natural at pinananatiling pahiwatig ang referent, gaya ng Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa שַׁבָּת bago ang pagbibigay ng Kautusan sa Sinai
  choice: isang Sabbath
  alternative: ang Sabbath; isang araw ng pahinga
  rationale: Pinananatili nito ang anarthrous at appositional na anyo ng Hebreo, at iniiwasang magpasok ng mas ganap na liturhikal o doktrinal na pakahulugan kaysa sa tahasang sinasabi ng talata.
- issue: Hindi tahasang binanggit ang manna sa huling sugnay
  choice: wala niyon
  alternative: walang manna
  rationale: Pinananatili ang ellipsis ng Hebreo habang malinaw pa rin sa konteksto ang tinutukoy, sa halip na tahasang idagdag sa pangunahing teksto ang salitang ‘manna.’
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Sabbath’ upang mapanatili ang partikular na terminong Hebreo; iniwasan ang sobrang pormal na ‘mag-iipon’ o ang interpretatibong ‘araw ng pamamahinga.’
