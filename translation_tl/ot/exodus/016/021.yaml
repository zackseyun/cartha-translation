  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: tl
  text: Tuwing umaga ay tinitipon nila iyon, bawat isa ayon sa kaya niyang kainin; ngunit kapag uminit na ang araw, natutunaw iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: tinitipon nila
  rationale: Ang לקט ay tumutukoy sa pagtitipon o pangongolekta, lalo na ng pagkain. Ang “tinitipon” ay natural at ang aspektong di-ganap ay angkop sa paulit-ulit na kilos sa konteksto.
- source_word: אֹתוֹ
  choice: iyon
  rationale: Panghalip ang nasa Hebreo at tumutukoy pabalik sa pagkaing inilarawan sa naunang konteksto; pinananatili ng “iyon” ang anyong panghalip nang hindi idinaragdag ang pangngalang “manna.”
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: tuwing umaga
  rationale: Ang pag-uulit ay distributibo at nagsasaad ng paulit-ulit na gawain. Ang “tuwing umaga” ang likas na modernong Tagalog para sa diwang ito.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Ginagamit nang distributibo ang isahang panlalaking anyo; sa Tagalog, natural at tumpak na kinakatawan ito ng “bawat isa” nang hindi kinakailangang magdagdag ng kasariang hindi binibigyang-diin ng pangungusap.
- source_word: כְּפִי אָכְלוֹ
  choice: ayon sa kaya niyang kainin
  rationale: Ang literal na idyomang “ayon sa bibig ng kaniyang pagkain” ay tumutukoy sa dami o sukat na kayang kainin ng bawat isa. Inihahatid ng salin ang kahulugan nang malinaw at hindi kahoy ang dating.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: kapag uminit na ang araw
  rationale: Ang pandiwa ay nagsasaad na umiinit ang araw; ang “kapag” ay natural na naghahayag ng temporal na kaugnayan sa kasunod na pagkatunaw.
- source_word: וְנָמָס
  choice: natutunaw iyon
  rationale: Ang מסס ay nangangahulugang matunaw o malusaw. Ang “natutunaw” ay ang karaniwang salitang angkop sa pagkaing naaapektuhan ng init at umaayon sa paulit-ulit na takbo ng salaysay.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tuwing umaga” sa halip na piliting ulitin ang “umaga” dahil iyon ang natural na distributibong pahayag sa Tagalog. Walang talababa dahil naipahayag nang malinaw sa teksto ang idyomang כְּפִי אָכְלוֹ.
