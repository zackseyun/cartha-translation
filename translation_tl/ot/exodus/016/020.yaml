base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: tl
  text: Ngunit hindi sila nakinig kay Moises[a], at may ilang lalaking nagtabi ng bahagi nito hanggang umaga. Inunod ito at bumaho[b], at nagalit sa kanila si Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hindi tumalima kay Moises.” Ang Hebreo ay maaaring tumukoy sa pagtangging makinig na nagpapahiwatig ng pagsuway.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “lumitaw ang mga uod dito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: nakinig kay Moises
  rationale: Ang שׁמע na may אֶל ay maaaring mangahulugang makinig o tumalima sa isang tao. Pinananatili ng “nakinig kay Moises” ang tuwirang diwa at ang pahiwatig ng pagsuway nang hindi agad pinapalitan ng mas tahasang “sumunod.”
- source_word: וַיּוֹתִרוּ
  choice: nagtira
  rationale: Ang Hiphil ng יתר ay tumutukoy sa pag-iiwan ng natira. Natural sa makabagong Tagalog ang “nagtira” para sa sadyang pagtabi ng isang bahagi.
- source_word: אֲנָשִׁים
  choice: ilang lalaki
  rationale: Tahasang panlalaking maramihan ang pangngalan at tumutukoy sa di-tiyak na bahagi ng pangkat; malinaw itong naihahayag ng “ilang lalaki.”
- source_word: מִמֶּנּוּ
  choice: ng kaunti nito
  rationale: Tumutukoy ito pabalik sa manna. Ang “ng kaunti nito” ay natural na Tagalog at malinaw na may bahaging itinira.
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Tuwiran at likas na salin ng pariralang temporal.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: nagkaroon ito ng mga uod
  rationale: Ipinahahayag nito sa natural na Tagalog ang paglitaw o pagdami ng mga uod sa itinira, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: וַיִּבְאַשׁ
  choice: bumaho
  rationale: Direkta at masiglang katumbas ng pandiwang nangangahulugang maging mabaho o mangamoy nang masama.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: nagalit sa kanila
  rationale: Natural na Tagalog para sa galit na nakatuon laban sa kanila, nang hindi pinalalabis ang tindi bilang “nagngitngit.”
theological_decisions:
- issue: Kung tahasang isasalin bilang pagsuway ang hindi pakikinig
  choice: nakinig kay Moises
  alternative: sumunod kay Moises / tumalima kay Moises
  rationale: May malinaw na implikasyon ng pagsuway sa konteksto, ngunit ang pangunahing diwa ng Hebreo ay pakikinig o pagbibigay-pansin. Pinananatili ng pangunahing teksto ang saklaw na iyon, at nililinaw sa talababa ang implikasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay. Ginamit ang karaniwang “nagtira,” “mga uod,” at “bumaho” upang maging madaling maunawaan, habang pinanatili ang panlalaking pagtukoy ng אֲנָשִׁים at ang leksikal na puwang sa pagitan ng pakikinig at pagsunod.
