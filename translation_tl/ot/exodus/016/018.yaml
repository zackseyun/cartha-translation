base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: tl
  text: Nang sukatin nila iyon gamit ang omer, ang nagtipon ng marami ay walang labis, at ang nagtipon ng kaunti ay hindi kinulang.[a] Ang bawat isa ay nagtipon ayon sa makakain niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang may marami ay walang sobra, at ang may kaunti ay walang kulang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: Nang sukatin nila
  rationale: Isinasagawa ng waw-consecutive ang salaysay, ngunit dito ay natural na nagsisilbing panimulang temporal ang sugnay bago ilahad ang resulta ng pagsukat.
- source_word: בָעֹמֶר
  choice: gamit ang omer
  rationale: Ang עֹמֶר ay isang sinaunang takal para sa tuyong bagay. Pinanatili ang pangalan ng yunit sa halip na gumamit ng di-tiyak na makabagong katumbas.
- source_word: הֶעְדִּיף ... הַמַּרְבֶּה
  choice: ang nagtipon ng marami ay walang labis
  rationale: Ipinahihiwatig ng pandiwa ang pagkakaroon ng sobra; nililinaw ng konteksto na ang participle ay tumutukoy sa taong nagtipon ng marami.
- source_word: הַמַּמְעִיט ... לֹא הֶחְסִיר
  choice: ang nagtipon ng kaunti ay hindi kinulang
  rationale: 'Pinananatili nito ang maikli at balanseng paghahambing ng Hebreo: walang sobra sa marami at walang kakulangan sa kaunti.'
- source_word: אִישׁ
  choice: ang bawat isa
  rationale: Distributibo ang gamit ng pangngalang panlalaki rito at tumutukoy sa bawat indibidwal, hindi lamang sa mga lalaking nasa hustong gulang.
- source_word: לְפִי אָכְלוֹ
  choice: ayon sa makakain niya
  rationale: Ang literal na idyomang may diwang ‘ayon sa bibig ng kaniyang pagkain’ ay tumutukoy sa dami ng kaya o kailangang kainin ng isang tao.
- source_word: לָקָטוּ
  choice: nagtipon
  rationale: Ito ang tuwirang at natural na salin ng karaniwang pandiwa sa salaysay ng pagtitipon ng manna.
theological_decisions:
- issue: Distributibong panlalaking isahan sa אִישׁ ... אָכְלוֹ
  choice: ang bawat isa ... makakain niya
  alternative: bawat lalaki ... ayon sa kaniyang pagkain
  rationale: Pinananatili ang distributibong isahan at ang panghalip na kasundo nito, ngunit hindi ipinahihiwatig na mga lalaki lamang ang saklaw ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na yunit na “omer” at ang balanseng paralelismo ng dalawang sugnay. Inilipat ang tandang-talâ sa dulo ng pariralang tinutukoy ng alternatibong salin upang maging malinaw ang saklaw nito.
