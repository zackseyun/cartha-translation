  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: tl
  text: Nang umangat ang sapin ng hamog, narito, sa ibabaw ng ilang ay may isang pinong bagay na tila natuklap-tuklap[a], pino gaya ng hamog na nagyelo sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tila maliliit na piraso.” Bihira ang salitang Hebreo rito, at hindi tiyak kung inilalarawan nito ang tekstura o ang anyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: pumaitaas
  rationale: Pinananatili ang literal na larawang ‘umakyat/pumaitaas’ ng עלה nang hindi tiyak na ipinapakahulugang sumingaw.
- source_word: שִׁכְבַת הַטָּל
  choice: sapin ng hamog
  rationale: Ang שִׁכְבָה ay isang nakalatag na sapin; natural at malinaw sa Tagalog ang ‘sapin ng hamog.’
- source_word: וְהִנֵּה
  choice: naroon
  rationale: Ipinahihiwatig ang biglang paglitaw na itinatampok ng הִנֵּה sa natural na modernong salaysay, nang hindi gumagamit ng mas makalumang ‘masdan.’
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: sa ibabaw ng ilang
  rationale: Ang ‘ibabaw’ ay malinaw na katumbas ng idiomang ‘mukha/ibabaw,’ at ang ‘ilang’ ay angkop sa מִדְבָּר nang hindi ipinapalagay na purong buhangin ang lugar.
- source_word: דַּק
  choice: pino
  rationale: Ang ‘pino’ ay natural para sa isang bagay na maliliit o maninipis ang anyo at naipananatili sa dalawang paglalarawan.
- source_word: מְחֻסְפָּס
  choice: parang mga butil
  rationale: Bihira at hindi tiyak ang salita; ang salin ay nagbibigay ng posibleng tekstura o anyo ngunit nilalagyan ng talababa upang mapanatili ang kawalang-katiyakan.
- source_word: דַּק כַּכְּפֹר
  choice: pino gaya ng hamog na nagyelo
  rationale: Pinananatili ang pag-uulit ng דַּק at ang tahasang paghahambing sa כְּפֹר, na karaniwang tumutukoy sa frost o hoarfrost.
- source_word: עַל הָאָרֶץ
  choice: sa lupa
  rationale: Sa pisikal na tagpong ito, ‘lupa’ ang natural na kontekstuwal na salin ng אֶרֶץ.
