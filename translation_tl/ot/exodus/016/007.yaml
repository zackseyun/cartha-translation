  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: tl
  text: At sa umaga ay makikita ninyo ang kaluwalhatian ni Yahweh, sapagkat narinig niya ang mga reklamo ninyo laban kay Yahweh.[a] At ano ba kami para magreklamo kayo laban sa amin?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kapag narinig niya ang mga reklamo ninyo laban kay Yahweh.” Maaaring ipahiwatig ng pagkakabuo sa Hebreo ang panahon o ang sanhi.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: At sa umaga
  rationale: Ginagamit ang pangngalan bilang pananda ng panahon; pinananatili ng “At” ang pagkakasunod mula sa naunang talata.
- source_word: וּ/רְאִיתֶם
  choice: ay makikita ninyo
  rationale: Ang anyo ng pandiwa sa konteksto ay nagpapahayag ng mangyayari; natural ito sa modernong Tagalog.
- source_word: כְּבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Ang כָּבוֹד ay tumutukoy sa hayag at maringal na presensiya o kadakilaan ni Yahweh; pinananatili ng “kaluwalhatian” ang teolohikal na bigat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan, hindi pinapalitan ng isang titulo.
- source_word: בְּ/שָׁמְע/וֹ
  choice: sapagkat narinig niya
  rationale: Maaaring sanhi o panahon ang ipahiwatig ng בְּ kasunod ng infinitive construct. Pinili ang sanhi dahil ipinapaliwanag nito kung bakit makikita ang kaluwalhatian, habang inilalagay sa talababa ang temporal na pagbasa.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: ang mga reklamo ninyo
  rationale: Sa konteksto, ang “reklamo” ay malinaw na pagsasalita ng di-kasiyahan laban sa Diyos; mas natural ito sa modernong Tagalog kaysa “bulung-bulungan” o “pag-ungol.”
- source_word: עַל יְהוָה
  choice: laban kay Yahweh
  rationale: Ang עַל kasama ng wikang tumutukoy sa pagrereklamo ay nagpapahiwatig na ang reklamo ay nakatuon laban kay Yahweh.
- source_word: וְנַחְנוּ מָה
  choice: At ano ba kami
  rationale: Pinananatili ng “At” ang payak na pang-ugnay na וְ; ang “ba” ay likas na naghahayag ng retorikal na tanong at ng kawalang-halaga nina Moises at Aaron sa paghahambing kay Yahweh.
- source_word: כִּי
  choice: upang
  rationale: 'Ipinakikilala nito ang kalagayan o batayan ng retorikal na tanong: ano sila para pagreklamuhan ng bayan? Ang “upang” ay natural sa pariralang Tagalog na “ano ba kami upang…?”'
- source_word: תלונו
  choice: magreklamo kayo
  rationale: Pinananatili ang kaugnayang leksikal sa naunang pangngalang “mga reklamo” at ang negatibong diwa sa konteksto.
- source_word: עָלֵינוּ
  choice: laban sa amin
  rationale: Ipinakikita ang adversatibong direksiyon ng reklamo at kaagapay ng “laban kay Yahweh.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Sanhi o panahon sa בְּשָׁמְעוֹ
  choice: sapagkat narinig niya
  alternative: kapag narinig niya
  rationale: 'Mas malinaw sa konteksto ang sanhi: makikita nila ang kaluwalhatian bilang tugon sa kanilang pagrereklamo. Gayunman, tunay na posible sa balarilang Hebreo ang temporal na pagbasa, kaya inilalahad ito sa talababa.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga reklamo” para sa natural na pananalita at ang “ano ba kami” upang mapanatili ang retorikal na diin. Inilagay ang pananda [a] pagkatapos ng buong sugnay na may pinagtatalunang sanhi/temporal na pagbasa.
