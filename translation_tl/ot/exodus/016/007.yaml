  naturalness: Natural at malinaw ang unang pangungusap sa modernong Filipino Tagalog. Mas natural at mas angkop sa retorikal na tanong ang 'para magreklamo kayo' kaysa 'upang magreklamo kayo.'
  terminology: Ang 'Yahweh' ay wastong pare-pareho para sa יְהוָה. Ang 'kaluwalhatian' ay angkop para sa כָּבוֹד, at ang pares na 'mga reklamo' / 'magreklamo' ay malinaw at magkakaugnay sa leksikon.
