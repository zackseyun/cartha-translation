  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Hanggang kailan kayo tatangging sumunod sa aking mga utos at mga kautusan[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tagubilin.” Ang salitang Hebreo na torot (pangmaramihan ng torah) ay maaaring tumukoy sa mga awtoritatibong tagubilin, gayundin sa mga kautusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang payak na “Sinabi” rito; malinaw na sa pagkakasunod ng konteksto ang diwang “pagkatapos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עַד אָנָה
  choice: Hanggang kailan
  rationale: Ito ang likas na katumbas sa Tagalog ng idyomang nagtatanong kung gaano pa katagal magpapatuloy ang pagsuway.
- source_word: מֵאַנְתֶּם
  choice: kayo tatangging
  rationale: Ang pandiwa ay nangangahulugang tumanggi o ayaw gawin ang isang bagay. Sa retorikal na pagsaway, ipinahihiwatig ng anyong ito ang patuloy na pagmamatigas ng maramihang kausap.
- source_word: לִשְׁמֹר
  choice: sumunod sa
  rationale: Kapag ang שׁמר ay ginagamit kaugnay ng mga utos, nangangahulugan itong tuparin o sundin ang mga iyon. Mas natural sa kasalukuyang Tagalog ang “sumunod sa” kaysa sa literal na “ingatan.”
- source_word: מִצְוֺתַי
  choice: aking mga utos
  rationale: Tumpak at natural na ipinapahayag ng “mga utos” ang awtoritatibo at tipanang diwa ng pangngalan.
- source_word: וְתוֹרֹתָי
  choice: at mga kautusan[a]
  rationale: Sa pagkakahanay nito sa “mga utos” at sa kontekstong legal, ipinahahayag ng “mga kautusan” ang normatibong bisa. Gayunman, maaaring tumukoy ang תּוֹרָה sa mas malawak na ‘mga tagubilin,’ kaya pinananatili iyon sa talababa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Kahulugan ng pangmaramihang תּוֹרָה na may hulaping unang panauhan
  choice: mga kautusan
  alternative: mga tagubilin
  rationale: Ang “mga kautusan” ay angkop sa legal at normatibong lakas ng pagsaway, ngunit hindi nito ganap na sinasaklaw ang posibleng diwa ng awtoritatibong pagtuturo; kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kayo” upang mapanatili ang pangmaramihang kausap sa Hebreo. Iniwasan ang masyadong literal na “ingatan” para sa pagsunod sa mga utos, at pinanatili sa talababa ang saklaw ng kahulugan ng torot.
