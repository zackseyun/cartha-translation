reference: Exodus 16:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: tl
  text: 'Tingnan ninyo: ibinigay sa inyo ni Yahweh ang Sabbath. Kaya naman, sa ikaanim na araw ay binibigyan niya kayo ng tinapay para sa dalawang araw. Manatili ang bawat isa[a] sa kanyang kinaroroonan; huwag lumabas ang sinuman mula sa kanyang kinaroroonan sa ikapitong araw.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “bawat lalaki” at “walang lalaki”; ginagamit dito ang anyong panlalaki upang tukuyin ang bawat indibiduwal sa pamayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: Tingnan ninyo
  rationale: Ang maramihang pautos ng ראה ay maaaring tumukoy sa literal na pagtingin o sa pagkilala at pag-unawa. Pinananatili ng “Tingnan ninyo” ang tuwirang larawan at ang bahagyang kalabuan ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: ibinigay sa inyo ... ang Sabbath
  rationale: Ipinahahayag ng ganap na pandiwa ang Sabbath bilang naipagkaloob na kaloob sa Israel. Natural sa Filipino ang ayos na may “sa inyo” bago ang simuno.
- source_word: הַשַּׁבָּת
  choice: ang Sabbath
  rationale: Tumutukoy ito sa itinakdang ikapitong araw at institusyon ng Sabbath. Ang kinikilalang katawagang “Sabbath” ay mas tiyak kaysa sa paglalarawang “pamamahinga” lamang.
- source_word: עַל כֵּן
  choice: Kaya naman
  rationale: Malinaw at natural nitong ipinakikita ang bunga o lohikal na kaugnayan sa naunang pahayag.
- source_word: נֹתֵן
  choice: binibigyan niya kayo
  rationale: Ang participle ay nagpapahiwatig ng kasalukuyan o nakaugaliang pagkakaloob; ipinananatili ito ng aspektong di-ganap ng “binibigyan.”
- source_word: לֶחֶם יוֹמָיִם
  choice: tinapay para sa dalawang araw
  rationale: Pinananatili ang kongkretong “tinapay” at malinaw na ipinahahayag na sapat ito para sa dalawang araw.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Manatili ang bawat isa sa kanyang kinaroroonan
  rationale: Sa konteksto, ang ישב ay “manatili,” at ang תַּחְתָּיו ay idyomatikong tumutukoy sa lugar na kinaroroonan ng bawat isa.
- source_word: אִישׁ ... אִישׁ
  choice: bawat isa ... sinuman
  rationale: Bagaman panlalaki ang anyong אִישׁ, distributibo itong tumutukoy sa bawat kasapi ng buong pamayanan. Ang mga katumbas na ito ay natural sa Filipino at hindi nagpapahiwatig na mga lalaki lamang ang inuutusan.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: huwag lumabas ang sinuman sa kanyang lugar
  rationale: Malinaw na ipinahahayag ng “huwag” ang pagbabawal, habang pinananatili ng “kanyang lugar” ang indibiduwal at distributibong anyo ng utos.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: sa ikapitong araw
  rationale: Tuwirang tinutukoy ang ikapitong araw nang walang idinaragdag na paliwanag na wala sa teksto.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong personal na pangalan sa pamamagitan ng karaniwang transliterasyong “Yahweh.”
- issue: Saklaw ng distributibong אִישׁ
  choice: bawat isa / sinuman
  alternative: bawat lalaki / walang lalaking
  rationale: Panlalaki ang anyong Hebreo ngunit ginagamit dito bilang distributibong utos sa pamayanan. Ang neutral na likas na pananalita sa Filipino ay naghahatid ng aktuwal na saklaw nang hindi binubura ang anyong Hebreo, na ipinaliliwanag sa talababa.
- issue: Sabbath bilang kaloob
  choice: ibinigay sa inyo ... ang Sabbath
  alternative: itinakda para sa inyo ang Sabbath
  rationale: Ang נָתַן ay tuwirang “nagbigay.” Pinananatili ng salin ang Sabbath bilang ipinagkaloob, nang hindi pinagpapasiyahan kung ang diin ay pribilehiyo, institusyon, o kapwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang “Yahweh” at “Sabbath” bilang tiyak na mga pangalang biblikal. Gumamit ng natural na distributibong “bawat isa/sinuman,” na may talababa para sa panlalaking anyo ng Hebreo.
