base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Tingnan mo, magpapaulan ako para sa inyo ng tinapay mula sa langit.[a] Lalabas ang mga tao at mangangalap ng bahaging kailangan sa bawat araw sa araw ding iyon,[b] upang subukin ko sila kung mamumuhay sila ayon sa aking tagubilin o hindi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagpapaulan ako para sa inyo ng tinapay mula sa langit.” Ang anyong Hebreo ay maaaring magpahiwatig ng kasalukuyan o nalalapit na kilos.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang bagay ng isang araw sa araw nito,” ibig sabihin, ang bahaging kailangan sa bawat araw ay titipunin sa araw ding iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal at tipanang pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: הִנְנִי
  choice: Tingnan mo
  rationale: Likas na makabagong panawag-pansin sa isang banal na pahayag; hindi angkop sa kontekstong ito ang literal na “Narito ako.”
- source_word: מַמְטִיר
  choice: magpapaulan ako
  rationale: Ang Hiphil participle ay nagpapahayag ng nalalapit na kilos na sanhi ng nagsasalita. Mas natural sa Tagalog ang hinaharap kaysa “nagpapaulan ako” para sa ipinahahayag na gagawin pa lamang.
- source_word: לֶחֶם מִן הַשָּׁמָיִם
  choice: tinapay mula sa langit
  rationale: Pinananatili ang kongkretong “tinapay” at ang mahalagang biblikal na pariralang “mula sa langit,” sa halip na gawing pangkalahatang “pagkain.”
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: bahagi para sa bawat araw sa araw ding iyon
  rationale: Ipinahahayag ang idyomang tumutukoy sa kailangang bahagi ng bawat araw na tinitipon sa mismong araw na iyon, habang iniiwasang ipakahulugang tiyak na dami ang hindi naman binanggit.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: upang subukin ko sila
  rationale: Bagaman isahan ang hulapi sa Hebreo, kolektibo ang tinutukoy nitong “mga tao,” kaya maramihan ang likas sa Tagalog.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: kung mamumuhay sila ayon sa aking tagubilin
  rationale: Ang “mamumuhay” ay natural na naghahatid ng Hebreong metapora ng paglakad bilang asal, at ang “tagubilin” ay angkop sa agarang konteksto bago ang Sinai nang hindi inaalis ang diwa ng may-awtoridad na utos.
theological_decisions:
- issue: Kahulugan ng תּוֹרָה bago ibigay ang kautusan sa Sinai
  choice: aking tagubilin
  alternative: aking kautusan
  rationale: Ang תּוֹרָה ay maaaring mangahulugang turo o tagubilin, at dito ay tumutukoy sa mga tuntuning kaugnay ng pang-araw-araw na pagtitipon. Hindi nito itinatanggi ang mas malawak na legal at tipanang gamit ng salita.
- issue: Metapora ng “paglakad” bilang pagsunod
  choice: mamumuhay ... ayon sa
  alternative: lalakad ... ayon sa
  rationale: Likas at malinaw sa modernong Tagalog ang “mamumuhay ayon sa” bilang paglalarawan ng patuloy na asal. Ang mas pormal na “lalakad sa aking kautusan” ay nagpapanatili ng anyo ngunit maaaring mapagkamalang literal.
- issue: Layunin ng pagsubok ng Diyos
  choice: upang subukin ko sila
  alternative: upang patunayan ko sila
  rationale: Pinananatili ang neutral na diwa ng pagsubok at hindi ipinapalagay kung ito ay para matuklasan, ihayag, o linangin ang kanilang pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Yahweh” para sa banal na pangalan, “Tingnan mo” bilang natural na panawag-pansin, at “mamumuhay ayon sa aking tagubilin” upang ihatid ang Hebreong idyoma nang hindi nagiging kahoy o sobrang teknikal.
