  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: tl
  text: Sinabi ng mga Israelita sa kanila, “Sana’y namatay na lamang kami sa kamay ni Yahweh sa lupain ng Ehipto, noong nakaupo kami sa tabi ng mga palayok ng karne at kumakain ng tinapay hanggang mabusog. Sapagkat inilabas ninyo kami sa ilang na ito upang patayin sa gutom ang buong kapulungang ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Likas at malinaw na katumbas sa modernong Tagalog ng kolektibong katawagang Hebreo; saklaw nito ang buong bayang Israel at hindi lamang ang mga lalaking anak.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Sana’y namatay na lamang kami
  rationale: Ang מִי יִתֵּן ay idyomang nagpapahayag ng matinding paghahangad, hindi literal na tanong; ang parirala ay isang di-natupad na hangarin tungkol sa nakaraan.
- source_word: בְיַד יְהוָה
  choice: sa kamay ni Yahweh
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang personal na pangalang YHWH.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: noong nakaupo kami sa tabi ng mga palayok na puno ng karne
  rationale: Ipinapahayag ang temporal na sugnay at nililinaw ang larawan ng mga lutuan ng karne nang hindi gumagamit ng lipas na pananalita.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: at kumakain ng tinapay hanggang mabusog
  rationale: Natural na Tagalog na nagpapanatili sa diwa ng pagkain hanggang sa kasapatan o kabusugan.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: ilang na ito
  rationale: Ang “ilang” ang maikli at tradisyonal ngunit nauunawaang katumbas ng מִדְבָּר bilang di-tinatahanang lupain, hindi kinakailangang mabuhanging disyerto.
- source_word: לְהָמִית אֶת כָּל הַקָּהָל הַזֶּה בָּרָעָב
  choice: upang patayin sa gutom ang buong kapulungang ito
  rationale: Tuwirang pinananatili ang paratang ng layunin at ang kolektibong kahulugan ng קָהָל.
theological_decisions:
- issue: Paglalarawan sa pagkamatay bilang בְיַד יְהוָה
  choice: sa kamay ni Yahweh
  alternative: sa pamamagitan ni Yahweh
  rationale: Pinananatili ang matinding idyoma ng pinagmulan na iniuugnay ang inaasam nilang kamatayan sa pagkilos ni Yahweh, nang hindi ipinapaliwanag kung anong paraan ng kamatayan ang tinutukoy.
- issue: Pag-render sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Isinasalin bilang personal na pangalan upang katawanin nang tuwiran ang Tetragrammaton sa tekstong Hebreo.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel
  rationale: Sa konteksto, ang idyomang pangkasunduan ay tumutukoy sa sambayanang Israel bilang kabuuan; ang literal na “mga anak na lalaki” ay maaaring maling magpahiwatig na mga lalaki lamang ang nagsalita.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sana’y … na lamang” para sa emosyonal na paghahangad, “ilang” para sa motif ng wilderness, at “kapulungan” para sa kolektibong קָהָל. Iniwasan ang artipisyal na literalismong “mga anak na lalaki ni Israel.”
