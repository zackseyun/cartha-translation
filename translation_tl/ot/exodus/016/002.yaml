  text: ו/ילינו כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: tl
  text: At nagreklamo laban kina Moises at Aaron ang buong kapulungan ng mga anak ni Israel[a] sa ilang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita”; maaari ring “sambayanan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: At nagreklamo
  rationale: Sa kontekstong ito, ang pandiwang לון/לין ay tumutukoy sa sama-samang pagrereklamo laban sa mga pinuno. Likas at malinaw sa makabagong Filipino ang “nagreklamo,” at pinananatili nito ang negatibong diwa ng pagtutol.
- source_word: כָּל עֲדַת
  choice: ang buong kapulungan
  rationale: Ipinahahayag ng כָּל ang kabuuan ng kolektibong עֵדָה. Ang “buong kapulungan” ay marangal at nauunawaang tumutukoy sa buong nagkakatipong pamayanan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ng mga anak ni Israel
  rationale: Malapit itong sumusunod sa Hebreong pariralang ang literal na anyo ay “mga anak na lalaki ni Israel,” ngunit sa Filipino, ang “mga anak ni Israel” ay likas na tawag sa mga inapo at hindi sapilitang nagtatakda ng kasarian. Inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: laban kina Moises at Aaron
  rationale: Sa konteksto ng pagrereklamo, adversatibo ang עַל. Ang “laban kina” ang likas na anyo sa Filipino para sa dalawang taong pinatutungkulan ng pagtutol.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang מִדְבָּר ay lupaing ilang at hindi kinakailangang mabuhanging disyerto. Maikli, tumpak, at biblikal ang “sa ilang.”
theological_decisions:
- issue: Ang kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ng pangunahing teksto ang anyong nagsasaad ng pinagmulang angkan nang hindi nililimitahan ang tinutukoy sa mga lalaking Israelita, sapagkat ang Filipino na “anak” ay hindi likas na panlalaki lamang. Pinananatili sa talababa ang mas idyomatikong etnikong katawagan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinili ang “kapulungan” upang mapanatili ang kolektibong larawan ng עֵדָה, at ang ayos ng pangungusap ay ginawang natural sa Filipino habang malinaw na ang buong kapulungan ang nagreklamo laban kina Moises at Aaron.
