base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: tl
  text: Kaya itinabi nila iyon hanggang kinaumagahan, gaya ng iniutos ni Moises. Hindi iyon bumaho, at wala ring mga uod[a] sa loob nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy sa mga uod o ulod na lumilitaw sa nabubulok na bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: itinabi nila
  rationale: Sa konteksto, ang manna ay inilaan at hindi ginalaw upang ingatan hanggang kinaumagahan. Likas sa modernong Tagalog ang “itinabi” at malinaw nitong ipinahihiwatig ang layunin ng pagkilos.
- source_word: אֹתוֹ
  choice: iyon
  rationale: Pinananatili ang pang-isahang panghalip na tumutukoy sa bahagi ng manna na itinabi.
- source_word: עַד הַבֹּקֶר
  choice: hanggang kinaumagahan
  rationale: Karaniwang ekspresyong Tagalog para sa pag-iingat ng isang bagay sa magdamag hanggang sa sumunod na umaga.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: gaya ng iniutos ni Moises
  rationale: Tuwirang pinananatili ang paghahambing at ang naunang utos ni Moises nang hindi nadaragdagan ang kahulugan.
- source_word: הִבְאִישׁ
  choice: bumaho
  rationale: Tuwiran at malinaw na katumbas ng pandiwang nangangahulugang mangamoy nang masama o maging bulok; tumutugma rin ito sa kaibahan sa naunang pangyayari.
- source_word: רִמָּה
  choice: mga uod
  rationale: Malawak at likas na salin para sa mga nilalang na tulad ng uod na nauugnay sa pagkabulok, nang hindi nililimitahan ang salitang Hebreo sa isang tiyak na uri.
- source_word: לֹא הָיְתָה בּוֹ
  choice: wala ring mga uod sa loob nito
  rationale: Pinananatili ang eksistensiyal na diwa—walang uod na naroon—at ang panghalip na tumutukoy sa manna, sa natural na ayos ng Tagalog.
theological_decisions: []
translation_notes:
  register: 'Makabago, malinaw, at marangal na Tagalog. Ginamit ang “itinabi” at “kinaumagahan” bilang likas na pananalita, habang pinananatili ang malinaw na pagtukoy sa manna at ang dalawang negatibong resulta: hindi ito bumaho at walang uod sa loob nito.'
