- from: At sa ikaanim na araw, ihahanda nila ang kanilang dinadala, at magiging doble[a] iyon sa tinitipon nila araw-araw.
  to: At sa ikaanim na araw, ihahanda nila ang anumang dadalhin nila, at magiging doble ang dami nito kaysa sa dami ng tinitipon nila araw-araw.[a]
  rationale: Pinalitan ang kasalukuyang ‘dinadala’ ng hinaharap na ‘dadalhin nila’ upang tumugma sa Hebreong pandiwang nasa relative clause. Idinagdag ang ‘ang dami nito’ upang malinaw na ang dobleng sukat ay tumutukoy sa dami ng inihanda at dinalang natipon. Inilipat ang panandang talababa sa hulihan ng pangungusap dahil ang alternatibo ay sumasaklaw sa buong pahayag ng paghahambing.
