  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: tl
  text: At sa ikaanim na araw, ihahanda nila ang anumang dadalhin nila, at magiging doble ang dami nito kaysa sa dami ng tinitipon nila araw-araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magiging dalawang beses ang dami nito kaysa sa dami ng tinitipon nila bawat araw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At ... magiging
  rationale: Ipinakikilala ng anyong pandiwa ang pangyayari at magiging resulta sa hinaharap; natural itong ipinahahayag sa Filipino sa pamamagitan ng “magiging.”
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: sa ikaanim na araw
  rationale: Tuwirang salin ng pariralang tumutukoy sa panahon; hindi idinagdag ang “ng linggo” sapagkat wala iyon sa Hebreo.
- source_word: וְהֵכִינוּ
  choice: ihahanda nila
  rationale: Pinananatili nito ang hayag na kilos ng paghahanda at ang hinaharap na diwa ng tagubilin.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: ang kanilang dinadala
  rationale: Ang sugnay ay tumutukoy sa anumang dinadala nila matapos tipunin; hindi nililimitahan ang kahulugan sa isang tahasang hindi binanggit na patutunguhan.
- source_word: וְהָיָה מִשְׁנֶה
  choice: magiging doble iyon
  rationale: Ang מִשְׁנֶה ay nagsasaad ng dobleng dami. Ang “doble” ay maikli, malinaw, at malapit sa kayarian ng Hebreo.
- source_word: עַל אֲשֶׁר
  choice: sa
  rationale: Sa pariralang “doble ... sa,” natural na naipahahayag sa Filipino ang paghahambing o sukat na tinutukoy ng עַל.
- source_word: יִלְקְטוּ
  choice: tinitipon nila
  rationale: Ang לקט ay tumutukoy sa pagpulot o pagtitipon; ang “tinitipon” ay angkop sa manna at nagpapanatili ng paulit-ulit na kilos.
- source_word: יוֹם יוֹם
  choice: araw-araw
  rationale: Natural nitong ipinahahayag ang distributibo at paulit-ulit na diwa ng pag-uulit sa Hebreo.
