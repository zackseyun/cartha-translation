    issue: Ang ‘ang kanilang dinadala’ ay hindi ganap na tumutugma sa hinaharap na relative clause na אֲשֶׁר יָבִיאוּ.
    rationale: Ang anyong ito ay mas madaling basahin bilang kasalukuyang ‘what they are carrying.’ Ang ‘anumang dadalhin nila’ ay malinaw na tumutukoy sa mga bagay na kanilang dadalhin sa itinakdang pagkakataon.
  - severity: low
    issue: Hindi tahasang ipinapakita ng ‘magiging doble iyon’ na ang dami ang siyang doble.
    rationale: Bagaman nauunawaan sa konteksto, ang ‘magiging doble ang dami nito’ ay mas malinaw at pinananatili ang paghahambing ng Hebreo sa dami ng karaniwang tinitipon.
  revised_text: At sa ikaanim na araw, ihahanda nila ang anumang dadalhin nila, at magiging doble ang dami nito kaysa sa dami ng tinitipon nila araw-araw.[a]
