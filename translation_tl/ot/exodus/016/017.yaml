  yaml_path: translation/ot/exodus/016/017.yaml
  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: tl
  text: Gayon nga ang ginawa ng mga anak ni Israel. Namulot sila—may nagtipon ng marami, at may nagtipon ng kaunti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Gayon nga ang ginawa
  rationale: Tumutukoy ang idyomang ito sa pagsunod sa naunang tagubilin. Likas sa modernong Tagalog ang “Gayon nga ang ginawa” at pinananatili nito ang diwa ng ‘ginawa nila ang gayon.’
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang anyo ng Hebreo sa isang pamilyar at marangal na ekspresyong Tagalog.
- source_word: וַיִּלְקְטוּ
  choice: Namulot sila
  rationale: Ang לקט ay pagtipon o pagpulot ng pagkain. Sa konteksto ng manna sa lupa, mas tiyak at natural ang “namulot” kaysa sa pangkalahatang “nagtipon.”
- source_word: הַמַּרְבֶּה
  choice: may nagtipon ng marami
  rationale: Isinasalamin ang substantivized participle bilang taong nagtipon ng malaking dami, nang hindi ipinapalagay kung iisa o marami ang tinutukoy sa bawat pangkat.
- source_word: הַמַּמְעִיט
  choice: may nagtipon ng kaunti
  rationale: Pinananatili ang tuwirang kaibahan sa הַמַּרְבֶּה at ang ideya ng taong nagtipon ng maliit na dami.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “mga anak ni Israel” upang mapanatili ang Hebreong larawang pampamilya; ginamit ang “namulot” para sa mismong kilos at “nagtipon” sa paghahambing ng dami upang maging malinaw at hindi paulit-ulit.
