  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: tl
  text: Kumain ng manna ang mga Israelita sa loob ng apatnapung taon, hanggang sa makarating sila sa lupaing may mga naninirahan; kumain sila ng manna hanggang sa makarating sila sa hangganan ng lupain ng Canaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gilid ng lupain ng Canaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Ang literal na ‘mga anak na lalaki ni Israel’ ay isang karaniwang katawagan sa buong bayang Israel. Mas natural at saklaw ang buong bayan sa makabagong Tagalog na ‘mga Israelita.’
- source_word: אָכְלוּ
  choice: kumain
  rationale: Ang Qal perfect ay isang tuwirang buod ng naganap sa nakaraan; natural itong isalin na ‘kumain.’
- source_word: הַמָּן
  choice: manna
  rationale: Ang ‘manna’ ang kinikilalang anyo ng terminong Hebreo sa kontekstong biblikal; hindi kailangan ang pantukoy na ‘ang’ matapos ang pandiwang ‘kumain ng.’
- source_word: אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taon
  rationale: Malinaw at likas na ipinapahayag ng pariralang ito ang tagal.
- source_word: עַד בֹּאָם
  choice: hanggang sa makarating sila
  rationale: Ipinapahayag ng עַד at infinitive construct ang hangganang temporal. Pinananatili ng ‘makarating’ ang diwa ng pagdating nang hindi ito pinakikitid sa ‘pumasok.’
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: sa lupaing may mga naninirahan
  rationale: Ipinahihiwatig ng Niphal participle נוֹשָׁבֶת ang lupaing tinitirhan o pinaninirahan, bilang kaibahan sa ilang.
- source_word: קְצֵה אֶרֶץ כְּנָעַן
  choice: hangganan ng lupain ng Canaan
  rationale: Sa heograpikong konteksto, natural na ipinapahayag ng ‘hangganan’ ang קְצֵה bilang dulo o gilid ng lupain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang ‘mga Israelita’ bilang natural na katawagan sa buong bayan at pinanatili ang pag-uulit ng ‘kumain sila ng manna’ na nasa Hebreo.
