  source_fidelity: 'Ang salin ay tapat sa pangunahing nilalaman ng Hebreo: utos ni Yahweh na mamulot ng manna, ang sukat na isang omer bawat tao, at ang pananagutang kumuha para sa mga nasa sariling tolda. Gayunman, ang “mga taong kasama ninyo” para sa מִסְפַּר נַפְשֹׁתֵיכֶם ay nagdaragdag ng di-tiyak na ideya ng pagiging ‘kasama’; mas malapit ang “inyong mga tao,” na pinananatili ang pag-uugnay sa mga kinakausap nang hindi ipinipilit ang isang partikular na uri ng ugnayan.'
