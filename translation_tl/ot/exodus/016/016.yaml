  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: tl
  text: 'Ito ang iniutos ni Yahweh: “Mamulot kayo nito, ang bawat lalaki ayon sa dami ng makakain niya—isang omer para sa bawat tao[a], ayon sa bilang ng inyong mga tao. Kumuha ang bawat lalaki para sa mga nasa tolda niya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang omer sa bawat ulo.”
    reason: Ipinapakita ang kongkretong Hebreong idyoma sa likod ng natural na saling “para sa bawat tao.”
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Ito ang iniutos
  rationale: Sa pormulang ito, ang הַדָּבָר ay tumutukoy sa nilalaman ng utos. Ang “Ito ang iniutos” ay tuwiran at natural sa modernong Tagalog, at hindi nito kailangang ipilit ang “salita” o “bagay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Mamulot kayo nito
  rationale: Ang לקט ay pagtipon o pagpulot ng mga pagkaing nakakalat. Sa konteksto ng manna, malinaw at likas ang “mamulot,” habang ang “nito” ay tumutukoy sa manna.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ang bawat lalaki ayon sa dami ng makakain niya
  rationale: Distributibo ang אִישׁ at nasa panlalaking anyo; pinananatili ito ng “bawat lalaki.” Isinasalin ang Hebreong idyoma ayon sa aktuwal na kahulugan nitong dami ng pagkain na kailangan o kayang kainin.
- source_word: עֹמֶר
  choice: isang omer
  rationale: Isang tiyak na sinaunang takal ng tuyong bagay ang omer; isinasatitik ito sa halip na tumbasan ng isang di-tiyak na modernong sukat.
- source_word: לַגֻּלְגֹּלֶת
  choice: para sa bawat tao
  rationale: Literal itong “bawat ulo,” ngunit ginagamit dito bilang paraan ng pagbibilang ng mga tao. Natural at malinaw sa Tagalog ang “para sa bawat tao”; inilalagay sa talababa ang literal na larawan.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: ayon sa bilang ng mga taong kasama ninyo
  rationale: Ang נֶפֶשׁ dito ay mga indibiduwal na tao, hindi “kaluluwa” sa di-materyal na kahulugan. Ipinahihiwatig ng hulaping pangmaramihan ang mga taong kabilang sa mga kinakausap.
- source_word: אִישׁ לַאֲשֶׁר בְּאָהֳלוֹ תִּקָּחוּ
  choice: Kumuha ang bawat lalaki para sa mga nasa tolda niya
  rationale: Pinananatili ang kongkretong larawan ng tolda at ang distributibong tungkulin ng bawat lalaki, habang natural na ipinahahayag sa Tagalog ang lakas ng utos.
theological_decisions:
- issue: Pagpapahayag sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang banal na pangalan. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tolda,” “omer,” at “Yahweh” upang mapanatili ang kongkretong tagpuan at mahahalagang katawagang nasa pinagmulang teksto; ang pananalita ng utos ay ginawang natural nang hindi binabago ang distributibong ayos.
