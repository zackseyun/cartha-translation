  terminology: Wastong pinananatili ang “Yahweh” para sa יהוה, “omer” para sa sinaunang sukat, at “tolda” para sa אָהֶל. Ang “bawat lalaki” ay katanggap-tanggap na distributibong salin ng אִישׁ. Ang talababa sa “bawat tao” ay wastong nagtatala ng literal na “bawat ulo.”
