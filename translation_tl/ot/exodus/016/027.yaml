base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: tl
  text: Nang sumapit ang ikapitong araw, may ilan sa mga tao na lumabas upang mamulot, ngunit wala silang nakita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Ipinagpapatuloy nito ang daloy ng salaysay at natural na ipinakikilala sa Tagalog ang pangyayaring naganap sa ikapitong araw.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: nang ikapitong araw
  rationale: Tuwirang ipinapahayag ang panahon nang hindi idinaragdag ang ‘ng linggo,’ na wala sa Hebreo.
- source_word: יָצְאוּ מִן הָעָם
  choice: may ilan sa mga tao na lumabas
  rationale: 'Ang מִן הָעָם ay partitive: isang bahagi lamang ng mga tao ang lumabas. Natural itong naipahahayag sa Tagalog sa ‘may ilan sa mga tao.’'
- source_word: לִלְקֹט
  choice: upang mamulot
  rationale: Sa konteksto ng manna na kinukuha mula sa lupa, mas tiyak at natural ang ‘mamulot’ kaysa sa pangkalahatang ‘magtipon,’ nang hindi tahasang idinaragdag ang bagay na pinupulot.
- source_word: וְלֹא מָצָאוּ
  choice: ngunit wala silang nakita
  rationale: Literal na hindi nila natagpuan ang hinahanap. Ipinakikita ng ‘ngunit’ ang kabiguang salungat sa layunin nilang mamulot, habang hindi idinaragdag ang di-tahasang layon.
