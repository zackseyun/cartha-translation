    issue: “para sa susunod na mga salinlahi ninyo”
    rationale: Ang “susunod” ay maaaring magpahiwatig ng limitadong susunod na henerasyon, hindi ng nagpapatuloy na saklaw ng לְדֹרֹתֵיכֶם. Ang “sa lahat ng salinlahi ninyo” ay mas tapat at natural.
  - severity: low
    issue: “upang ingatan”
    rationale: Mas natural at mas malinaw ang pasibong “upang maingatan,” sapagkat ang sisidlan na may manna ang inilalagay upang mapreserba.
