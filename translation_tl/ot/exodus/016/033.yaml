  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: tl
  text: At sinabi ni Moises kay Aaron, “Kumuha ka ng isang sisidlan,[a] lagyan mo ito ng isang buong omer ng manna, at ilagay mo ito sa harap ni Yahweh upang maingatan sa lahat ng salinlahi ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banga” o “palayok.”
    reason: Ang צִנְצֶנֶת ay pangalan ng isang lalagyan, ngunit hindi tiyak sa talatang ito ang eksaktong anyo o materyal nito.
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: sisidlan
  rationale: Ang bihirang pangngalan ay tumutukoy sa isang lalagyan. Ang “sisidlan” ay natural at sapat na malawak upang hindi tukuyin nang lampas sa ebidensiya kung ito ay banga o palayok.
- source_word: מְלֹא הָעֹמֶר
  choice: isang buong omer
  rationale: Pinananatili nito kapwa ang sinaunang takal na omer at ang diwa ng מְלֹא na punô o buong dami.
- source_word: מָן
  choice: manna
  rationale: Ito ang nakasanayan at malinaw na transliterasyon sa Filipino para sa pagkaing tinutukoy sa konteksto.
- source_word: וְתֶן שָׁמָּה
  choice: lagyan mo iyon
  rationale: Bagaman literal na “ilagay mo roon,” malinaw sa konteksto na ang manna ay ilalagay sa sisidlan; natural sa Filipino ang “lagyan mo iyon.”
- source_word: וְהַנַּח אֹתוֹ
  choice: ilagay mo iyon
  rationale: Malinaw at marangal na salin ng pandiwang nangangahulugang ilapag o ilagay ang bagay.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang karaniwang diwa ng לִפְנֵי bilang “sa harap” o “sa presensya,” at tinatrato ang Yahweh bilang personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: לְמִשְׁמֶרֶת
  choice: upang ingatan
  rationale: Ipinahahayag nito ang layuning mapanatili o maingatan ang manna bilang alaala.
- source_word: לְדֹרֹתֵיכֶם
  choice: para sa susunod na mga salinlahi ninyo
  rationale: Natural na Filipino para sa pagpapanatili nito alang-alang sa magkakasunod na salinlahi ng Israel.
- source_word: קַח ... אַחַת
  choice: Kumuha ka ng isang sisidlan
  rationale: Pinananatili ang pautos at ang pagtukoy sa iisang lalagyan.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ay nagpapanatili rito sa halip na palitan ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “sisidlan” sa pangunahing teksto upang mapanatili ang leksikal na lawak ng bihirang salitang Hebreo; nasa talababa ang mas tiyak na mga posibleng katawagan.
