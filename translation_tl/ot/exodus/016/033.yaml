- from: At sinabi ni Moises kay Aaron, “Kumuha ka ng isang sisidlan,[a] lagyan mo iyon ng isang buong omer ng manna, at ilagay mo iyon sa harap ni Yahweh upang ingatan para sa susunod na mga salinlahi ninyo.”
  to: At sinabi ni Moises kay Aaron, “Kumuha ka ng isang sisidlan,[a] lagyan mo ito ng isang buong omer ng manna, at ilagay mo ito sa harap ni Yahweh upang maingatan sa lahat ng salinlahi ninyo.”
  rationale: Inayos ang saklaw na temporal ng “mga salinlahi” upang maipahayag ang patuloy na diwa ng Hebreo, at ginawang pasibo ang layunin ng pag-iingat. Pinanatili ang maingat na “sisidlan,” ang sinaunang takal na “omer,” at ang pangalang “Yahweh.”
