  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: tl
  text: Pagsapit ng gabi, dumating ang mga pugo at tinakpan ang kampo; at kinaumagahan, may sapin ng hamog sa palibot ng kampo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Pagsapit ng gabi
  rationale: Likas na salaysay sa modernong Tagalog para sa panandang panahong nagpapakilala sa sumunod na pangyayari, nang hindi mabigat ang literal na “at nangyari.”
- source_word: וַתַּעַל הַשְּׂלָו
  choice: dumating ang mga pugo
  rationale: Ang עלה ay may pangunahing larawang “umakyat,” ngunit sa kontekstong paglapit ng mga ibon sa kampo, malinaw at likas ang “dumating.” Ginawang maramihan ang “mga pugo” dahil kolektibo ang Hebreong pangngalan.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: tinakpan ang kampo
  rationale: Tuwirang pinananatili ang larawan ng כסה, “takpan,” at ang karaniwang kahulugan ng מַחֲנֶה bilang “kampo.”
- source_word: וּבַבֹּקֶר
  choice: at kinaumagahan
  rationale: Ipinahihiwatig ng sunod-sunod na salaysay ang kasunod na umaga; natural itong ipinapahayag sa Tagalog bilang “kinaumagahan.”
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: may sapin ng hamog
  rationale: Ang שִׁכְבַת ay isang nakalatag na suson o sapin. Ang eksistensiyal na “may” ay likas sa Tagalog at pinananatili ang kongkretong larawan.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: sa palibot ng kampo
  rationale: Malinaw at natural na katumbas ng lokasyong nakapaligid sa kampo.
