  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang malinaw na pagkakasunod ng gabi at umaga at ang pisikal na larawan ng mga pugong tumatakip sa kampo at ng sapin ng hamog sa paligid nito.
