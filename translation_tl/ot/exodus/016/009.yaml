  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Moises kay Aaron, “Sabihin mo sa buong kapulungan ng mga Israelita[a], ‘Lumapit kayo sa harapan ni Yahweh[b], sapagkat narinig niya ang inyong mga pagrereklamo.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; ibig sabihin, ang mga Israelita.
    reason: lexical_alternative
  - marker: b
    text: Ang “Yahweh” ay salin-titik ng banal na pangalang יהוה (YHWH).
    reason: divine_name
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Tagalog ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod ng pangyayari.
- source_word: אֱמֹר
  choice: Sabihin mo
  rationale: Isang pautos ito kay Aaron na nagpapakilala sa tuwirang sasabihin niya; malinaw at natural ang “Sabihin mo” sa Tagalog.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: buong kapulungan ng mga Israelita
  rationale: Pinananatili ng “kapulungan” ang diwa ng עֵדָה bilang nagkakatipong pamayanan, samantalang natural na katumbas ng בְּנֵי יִשְׂרָאֵל sa kasalukuyang Tagalog ang “mga Israelita.”
- source_word: קִרְבוּ
  choice: Lumapit kayo
  rationale: Ang pangmaramihang pautos ay humihiling ng paglapit sa presensiya ng Diyos. Tuwiran at karaniwan sa Tagalog ang “Lumapit kayo.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harapan ni Yahweh
  rationale: Ang לִפְנֵי ay nangangahulugang “sa harapan” o “sa presensiya ng.” Pinananatili ng salin ang maikli at konkretong anyo ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos na lumapit. Ang “sapagkat” ay malinaw, marangal, at angkop sa tuwirang pananalita.
- source_word: שָׁמַע
  choice: narinig niya
  rationale: Ang qatal ay tumutukoy sa naganap nang pakikinig na siyang batayan ng kasalukuyang utos. Sa Tagalog, sapat na ipinahahayag ito ng aspektong kontemplatibo sa “narinig niya.”
- source_word: תְּלֻנֹּתֵיכֶם
  choice: inyong mga pagrereklamo
  rationale: Ipinahahayag nito ang paulit-ulit na pagrereklamo ng bayan at ang negatibong himig ng salita nang hindi gumagamit ng lipas o labis na kolokyal na pananalita.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na tahimik itong palitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapulungan” upang mapanatili ang kolektibo at nagkakatipong diwa ng עֵדָה, habang iniwasan ang sobrang literal na “mga anak ni Israel” sa pangunahing teksto at inilagay ito sa talababa.
