  source_fidelity: 'Tapat ang salin sa Hebreo. Naipapahayag nito ang pagsulong ng salaysay, ang utos ni Moises kay Aaron, ang buong kapulungan, ang pangmaramihang utos na lumapit sa harap ni Yahweh, at ang dahilan: narinig niya ang kanilang mga reklamo/pagrereklamo. Hindi ito nagdaragdag o nag-aalis ng kahulugan.'
