lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive kasama ng דִּבֵּר ay nagsisimula ng kasunod na pangyayari sa salaysay. Likas at marangal sa Filipino ang “At nagsalita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nang tuwiran ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa kinakausap; “kay Moises” ang natural na anyo sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang karaniwang Hebreong pormula na naghahanda sa tuwirang sinabi sa susunod na talata.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pormulang “na sinasabi” upang ihanda ang tuwirang pahayag sa kasunod na talata, kahit bahagyang mas Hebraiko ito kaysa karaniwang usapan.
