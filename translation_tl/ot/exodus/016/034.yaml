  naturalness: Marangal at likas ang pangungusap sa modernong Filipino Tagalog. Mas malinaw at mas idiomatiko ang “upang ito ay maingatan,” dahil tahasan nitong itinutukoy ang layon ng pag-iingat.
  terminology: Ang “Yahweh,” “Moises,” “Aaron,” at “Patotoo” ay angkop. Pinananatili ng “Patotoo” ang teknikal at hindi ganap na tiyak na saklaw ng הָעֵדֻת. Inayos ang talababa upang mas likas ang paglalarawan sa mga tapyas na bato ng tipan.
