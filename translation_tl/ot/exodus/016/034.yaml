base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: tl
  text: Ayon sa iniutos ni Yahweh kay Moises, inilagay iyon ni Aaron sa harap ng Patotoo[a] upang ito ay maingatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa harap ng Patotoo ng Tipan.” Ang salitang Hebreo para sa “Patotoo” ay isang teknikal na katawagang kaugnay ng tabernakulo at maaaring tumukoy nang mas tiyak sa mga tapyas na bato ng tipan o sa bagay na kaugnay ng mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Ayon sa
  rationale: Likas sa modernong Tagalog at malinaw na ipinapahayag na tumalima si Aaron sa naunang utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Pinananatili ang awtoritatibong puwersa ng pandiwa sa konteksto ng utos ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipan na nasa tekstong Hebreo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Karaniwang paraan sa Tagalog ng pagtukoy sa taong pinag-utusan.
- source_word: וַיַּנִּיחֵהוּ
  choice: inilagay iyon
  rationale: Malinaw at likas na tumutukoy sa paglalagay ni Aaron sa bagay na binanggit sa konteksto, nang hindi nagdaragdag ng tiyak na sisidlan sa talata.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalan sa Tagalog.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili ang payak na relasyong panlunan at ang gamit nito sa konteksto ng tabernakulo.
- source_word: הָעֵדֻת
  choice: ang Patotoo
  rationale: Pinananatili ang teknikal at sadyang hindi lubusang tiyak na katawagan sa tabernakulo; maaaring tumukoy sa mga tapyas ng tipan o sa kaugnay na sagradong patotoo.
- source_word: לְמִשְׁמָרֶת
  choice: upang ingatan
  rationale: Natural na Tagalog na nagpapahayag ng layuning panatilihin o ilagak nang ligtas, nang hindi nagdaragdag ng ideya ng pag-alaala na hindi tahasang nasa talata.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang tuwirang pagtukoy sa pangalang tipan.
- issue: Saklaw ng teknikal na katawagang הָעֵדֻת
  choice: Patotoo
  alternative: mga tapyas ng tipan
  rationale: Hindi tahasang nililinaw ng mismong talata kung ang tinutukoy ay ang mga tapyas o ang sagradong bagay na kaugnay ng mga ito, kaya pinananatili ang ambiguwidad sa pangunahing teksto at ipinaliliwanag sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ayon sa iniutos” sa halip na mas literal ngunit mas mabigat na “Kung paanong iniutos,” at pinanatili ang “Patotoo” bilang terminong teknikal na may talababa.
