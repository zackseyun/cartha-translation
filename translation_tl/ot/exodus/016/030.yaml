  text: So the people rested on the seventh day[a].
translation:
  language: tl
  text: Kaya nagpahinga ang mga tao sa ikapitong araw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tumigil.” Kaugnay ng salitang Sabbath ang pandiwa; kaya ang “ipinangilin ang Sabbath” ay isang interpretibong pagpapalawak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: nagpahinga
  rationale: Ang qal wayyiqtol ng שׁבת ay pangunahing nangangahulugang huminto o magpahinga. Sa konteksto ng ikapitong araw, natural sa modernong Tagalog ang “nagpahinga” at hindi nito pinalalawak ang diwa tungo sa mas interpretibong “ipinagdiwang ang Sabbath.”
- source_word: הָעָם
  choice: ang mga tao
  rationale: Kolektibo ang עָם at tumutukoy rito sa bayang Israel; ang “ang mga tao” ay malinaw at likas sa daloy ng salaysay.
- source_word: בַּיּוֹם הַשְּׁבִעִי
  choice: sa ikapitong araw
  rationale: Ang בְּ sa pagtukoy ng tiyak na araw ay natural na isinasalin sa Tagalog bilang “sa,” at ang ordinal ay “ikapitong.”
- source_word: וַ
  choice: Kaya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay at, sa konteksto, ipinakikita ang naging bunga ng naunang utos. Ang “Kaya” ay natural na naghahayag ng ugnayang ito.
theological_decisions:
- issue: Kung gagawing tahasan sa pandiwa ang pagtupad sa Sabbath
  choice: Isinalin bilang “nagpahinga.”
  alternative: “tumigil” o “ipinagdiwang ang Sabbath”
  rationale: Ang pandiwa ay nagsasaad ng paghinto o pamamahinga; malinaw na ang kaugnayan nito sa Sabbath dahil sa konteksto at sa pariralang “ikapitong araw.” Iniiwasan ng salin ang interpretibong pagpapalawak.
translation_notes:
  register: Modernong Filipino Tagalog na payak, natural, at marangal. Pinanatili ang maikling anyo at ang banayad na ugnayang bunga sa pamamagitan ng “Kaya.”
