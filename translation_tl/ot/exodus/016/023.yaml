base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanila, “Ito ang sinabi ni Yahweh: Bukas ay ganap na kapahingahan, isang banal na Sabbath para kay Yahweh. Ang ihuhurno ninyo ay ihurno ninyo, at ang pakukuluan ninyo ay pakuluan ninyo. Ang lahat ng matitira ay itabi ninyo para sa inyo, upang maingatan hanggang umaga.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ang karaniwang Hebreong pagkakasunod-sunod ng salaysay at ang tuwirang pagpapakilala sa sinabi.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Ito ang sinabi ni Yahweh
  rationale: Likas sa modernong Tagalog at malinaw na tumutukoy sa naunang pahayag ng Diyos.
- source_word: שַׁבָּתוֹן
  choice: ganap na kapahingahan
  rationale: Ipinahihiwatig ng salita ang natatangi at buong pagtigil sa gawain, hindi lamang pangkaraniwang pahinga.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: isang banal na Sabbath para kay Yahweh
  rationale: Pinananatili ang kabanalan ng araw at ang pagkakatalaga nito kay Yahweh.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Ang iluluto ninyo sa hurno ay lutuin na ninyo
  rationale: Ang אָפָה ay partikular na pagluluto sa hurno; ang pag-uulit ng pandiwa ay isinatinig sa likas na Tagalog na may “na ninyo.”
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: at ang pakukuluan ninyo ay pakuluan na ninyo
  rationale: Pinipili ang tiyak na diwang “pakuluan” at pinananatili ang magkatulad na emphatic na kayarian.
- source_word: כָּל הָעֹדֵף
  choice: ang lahat ng matitira
  rationale: Malinaw at natural na tumutukoy sa sobrang bahagi matapos ang paghahanda.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: itabi ninyo para maingatan hanggang umaga
  rationale: Ipinapahayag ang sinasadyang pagtatabi at layuning mapanatili ang natira hanggang sa umaga.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang natatanging pangalang tipan nang hindi pinapalitan ng titulo.
- issue: Ugnayan ng שַׁבָּתוֹן at שַׁבַּת קֹדֶשׁ
  choice: ganap na kapahingahan, isang banal na Sabbath para kay Yahweh
  alternative: isang Sabbath na banal para kay Yahweh
  rationale: Itinuturing ang ikalawang parirala bilang paglalarawan sa unang parirala, habang pinananatili kapwa ang ganap na pagpapahinga at ang banal na pagkakatalaga ng Sabbath.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Sabbath” bilang pamilyar na terminong biblikal; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Walang talababa dahil sapat na naipahahayag sa teksto ang leksikal na diin at walang kailangang markahang paliwanag.
