- from: 'At sinabi niya sa kanila, “Ito ang sinabi ni Yahweh: Bukas ay ganap na kapahingahan, isang banal na Sabbath para kay Yahweh. Ang iluluto ninyo sa hurno ay lutuin na ninyo, at ang pakukuluan ninyo ay pakuluan na ninyo. Ang lahat ng matitira ay itabi ninyo para maingatan hanggang umaga.”'
  to: 'At sinabi niya sa kanila, “Ito ang sinabi ni Yahweh: Bukas ay ganap na kapahingahan, isang banal na Sabbath para kay Yahweh. Ang ihuhurno ninyo ay ihurno ninyo, at ang pakukuluan ninyo ay pakuluan ninyo. Ang lahat ng matitira ay itabi ninyo para sa inyo, upang maingatan hanggang umaga.”'
