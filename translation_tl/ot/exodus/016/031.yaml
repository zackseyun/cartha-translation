  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: tl
  text: Tinawag ng sambahayan ni Israel na manna[a] ang pagkaing iyon. Para itong puting buto ng kulantro[b], at ang lasa nito ay tulad ng manipis na tinapay na may pulot[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: man; nakaugaliang tawaging “manna” sa Filipino.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “tulad ng buto ng kulantro, na puti.”
    reason: lexical_alternative
  - marker: c
    text: O “manipis na keyk na may pulot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Tinawag
  rationale: Ang Qal wayyiqtol ng קרא ay tumutukoy rito sa pagbibigay ng pangalan; tuwiran at natural ang “tinawag.”
- source_word: בֵּית יִשְׂרָאֵל
  choice: sambahayan ni Israel
  rationale: Pinananatili nito ang kolektibong larawang “bahay/sambahayan ni Israel” sa halip na gawing simpleng “mga Israelita,” habang natural pa rin sa Filipino.
- source_word: אֶת־שְׁמוֹ
  choice: na … ang pagkaing iyon
  rationale: Sa Filipino, likas na ipinapahayag ang pagbibigay-pangalan sa hulmaing “tinawag na X ang Y.” Ang “pagkaing iyon” ay nilinaw mula sa konteksto bilang tinutukoy ng hulaping panlalaki.
- source_word: מָן
  choice: manna
  rationale: Ang “manna” ang nakaugaliang transliterasyon sa Filipino at malinaw na tumutukoy sa pagkaing nasa ilang; itinatala sa talababa ang anyong Hebreo na man.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: Para itong puting buto ng kulantro
  rationale: Ang זֶרַע ay “buto,” ang גַּד ay karaniwang kinikilalang kulantro/coriander, at ang לָבָן ay “puti.” Pinananatili ng ayos ang malamang na pagbasa ngunit itinatala ang posibleng ibang pagkakaugnay ng “puti.”
- source_word: וְטַעְמוֹ
  choice: at ang lasa nito
  rationale: Tuwiran at karaniwang katumbas ng טַעַם sa paglalarawan ng pagkain ang “lasa.”
- source_word: כְּצַפִּיחִת
  choice: tulad ng manipis na tinapay
  rationale: Ang natatanging pangngalan ay tumutukoy sa isang manipis na nilutong tinapay o keyk. Mas madaling maunawaan ng karaniwang mambabasa ang “manipis na tinapay,” habang inilalahad sa talababa ang alternatibong “manipis na keyk.”
- source_word: בִּדְבָשׁ
  choice: na may pulot
  rationale: Ang בְּ ay may diwang pagkakaugnay o sangkap dito; natural sa Filipino ang “may pulot.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan ni Israel” upang mapanatili ang kolektibong ekspresyong Hebreo, at ang “kulantro” bilang pamilyar na tawag sa coriander. Inayos nang bahagya ang unang pangungusap ayon sa likas na sintaks ng Filipino nang hindi inaalis ang tahasang kilos ng pagbibigay-pangalan.
