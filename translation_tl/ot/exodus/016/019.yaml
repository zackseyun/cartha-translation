  text: At sinabi ni Moises sa kanila, “Huwag magtira ang sinuman ng anuman nito hanggang kinaumagahan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural at sapat na pormal sa Tagalog ang “At sinabi.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Bibliyang Tagalog.
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Tuwirang katumbas ng pang-ukol na אֶל na may hulaping pangatlong panauhang panlalaking maramihan; hindi kailangang tukuying “sa mga tao.”
- source_word: אִישׁ אַל
  choice: Huwag ... ang sinuman
  rationale: Distributibo ang אִישׁ at saklaw ng pagbabawal ang bawat isa. Natural at inklusibo sa modernong Tagalog ang “ang sinuman,” nang hindi binabago ang diwa.
- source_word: יוֹתֵר
  choice: magtira
  rationale: Sa konteksto ng manna, tumutukoy ito sa pag-iiwan o pagtatabi ng anumang natira.
- source_word: מִמֶּנּוּ
  choice: nito
  rationale: Tumutukoy pabalik sa manna bilang kolektibong bagay; likas sa Tagalog ang “magtira ... nito.”
- source_word: עַד בֹּקֶר
  choice: hanggang kinaumagahan
  rationale: Malinaw at natural na temporal na parirala para sa pagpapanatili mula sa kasalukuyang panahon hanggang sa susunod na umaga.
