id: EXO.16.12
reference: Exodus 16:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: tl
  text: “Narinig ko ang pagrereklamo ng mga Israelita.[a] Sabihin mo sa kanila, ‘Sa dapithapon[b] ay kakain kayo ng karne, at sa umaga ay mabubusog kayo sa tinapay, at malalaman ninyong ako si Yahweh na inyong Diyos.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa pagitan ng mga gabi,” isang Hebreong idyoma para sa panahon ng takip-silim.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Narinig ko
  rationale: Ang Hebreong perpekto ay tumutukoy sa pagdinig na naganap at may tuwirang kaugnayan sa kasalukuyang tugon ng Diyos. Natural sa Filipino ang payak na “Narinig ko.”
- source_word: תְּלוּנֹּת
  choice: pagrereklamo
  rationale: Ipinahihiwatig ng pangngalan ang paulit-ulit at di-nasisiyahang pagrereklamo ng bayan; malinaw at likas ito sa modernong Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural na tawag sa bayan ng Israel sa kontekstong ito. Ang mas literal na anyong “mga anak ni Israel” ay inilagay sa talababa upang mapanatili ang porma ng Hebreo nang hindi nagmumukhang tumutukoy lamang sa mga tuwirang anak na lalaki ni Jacob.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Sabihin mo sa kanila
  rationale: Natural na Filipino itong katumbas ng Hebreong pormula sa pagpapakilala ng tuwirang pananalita; hindi kailangang ulitin ang literal na “magsalita… na sinasabi.”
- source_word: בֵּין הָעַרְבַּיִם
  choice: Sa dapithapon
  rationale: Ang idyoma ay tumutukoy sa panahon ng takip-silim. Ang “dapithapon” ay dignified, malinaw, at natural; nasa talababa ang literal na anyo at ang bahagyang kalabuan nito.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: kakain kayo ng karne
  rationale: Sa konteksto ng pagkain, ang בָשָׂר ay natural na “karne,” at ang di-ganap na pandiwa ay nagpapahayag ng mangyayari ayon sa pangako ng Diyos.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: mabubusog kayo sa tinapay
  rationale: Tumpak na ipinapahayag ng “mabubusog” ang pagiging ganap na nasiyahan sa pagkain at pinananatili ang kongkretong larawang “tinapay.”
- source_word: וִידַעְתֶּם
  choice: Sa gayon, malalaman ninyo
  rationale: Ang pagkilala kay Yahweh ay bunga ng ipinangakong paglalaan; malinaw na ipinahahayag ng “Sa gayon” ang ugnayang ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman maramihan ang anyong morpolohikal ng אֱלֹהִים, dito ay singular ang tinutukoy at bahagi ito ng tipanang pahayag na “inyong Diyos.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Paglilipat sa בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel / mga anak na lalaki ni Israel
  rationale: Sa konteksto, ang parirala ay nakaugaliang katawagan sa buong bayang Israel. Ang “mga Israelita” ay hindi naglilimita sa tinutukoy sa kalalakihan lamang, samantalang pinananatili sa talababa ang literal na anyo ng Hebreo.
- issue: Ugnayan ng paglalaan at pagkilala kay Yahweh
  choice: Sa gayon, malalaman ninyo
  alternative: at malalaman ninyo
  rationale: Maaaring simpleng pag-uugnay lamang ang waw, ngunit sa daloy ng pahayag ang pagkilala ay bunga ng pagkain at pagkabusog. Inilalantad ng salin ang natural na resultang diwa nang hindi nagdaragdag ng hiwalay na teolohikal na paliwanag.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “pagrereklamo” sa halip na mas lumang “pagbubulung-bulungan,” at “Sabihin mo” bilang natural na paglilipat sa Hebreong pormula ng pananalita. Ang mga panandang talababa [a] at [b] ay inilagay mismo sa mga pariralang ipinaliliwanag ng mga ito.
