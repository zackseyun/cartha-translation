  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: tl
  text: Sinabi nina Moises at Aaron sa lahat ng mga anak ni Israel[a], “Pagsapit ng gabi, malalaman ninyong si Yahweh ang naglabas sa inyo mula sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lahat ng Israelita” o “sa buong sambayanan ng Israel.” Literal na “sa lahat ng mga anak na lalaki ni Israel” ang Hebreo; ang parirala ay tumutukoy sa bayang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang simpleng “Sinabi” rito; ipinahihiwatig na ng pagkakasunod ng mga pangyayari ang diwang “pagkatapos.”
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: nina Moises at Aaron
  rationale: Ginamit ang karaniwang anyo ng mga pangalang biblikal sa Tagalog, kasama ang panandang “nina” na hinihingi ng balarila.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng mga anak ni Israel[a]
  rationale: Pinananatili nito ang larawang pampamilya ng Hebreong בְּנֵי יִשְׂרָאֵל habang nauunawaan sa Tagalog bilang mga inapo o sambayanan ni Israel. Ipinaliliwanag sa talababa ang literal na panlalaking anyo at ang mga mas idyomatikong salin.
- source_word: עֶרֶב
  choice: Pagsapit ng gabi
  rationale: Ang pangngalan ay gumaganap bilang panandang-panahon. Ang “Pagsapit ng gabi” ay natural sa Tagalog at hindi nagdaragdag ng higit na espesipikong oras.
- source_word: וִידַעְתֶּם
  choice: malalaman ninyo
  rationale: Tuwirang ipinapahayag ang panghinaharap na pagkaalam ng buong pangkat; ang “ninyo” ay malinaw na maramihan.
- source_word: כִּי
  choice: -ng / na
  rationale: Ipinakakabit ng כִּי ang nilalaman ng malalaman nila. Sa Tagalog, likas itong ipinahahayag ng pang-angkop sa “malalaman ninyong” sa halip na hiwalay na salita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הוֹצִיא אֶתְכֶם
  choice: ang naglabas sa inyo
  rationale: Ang Hiphil ng יצא ay karaniwang nangangahulugang “maglabas.” Ang hulma na “si Yahweh ang naglabas” ay natural at malinaw na itinatangi ang gumawa ng pagliligtas.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Isinasama ang “lupain” upang katawanin ang אֶרֶץ, sa halip na paikliin lamang bilang “mula sa Ehipto.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; hindi rin ginagamit ang mas huling anyong “Jehovah.”
- issue: Pagkakakilanlan ng naglabas sa Israel mula sa Ehipto
  choice: si Yahweh ang naglabas sa inyo
  alternative: inilabas kayo ni Yahweh
  rationale: Pinananatili ng hulmang may “ang” ang pokus ng pahayag sa pagkilalang si Yahweh mismo ang gumawa nito, nang hindi nagdaragdag ng paliwanag tungkol sa paraan ng pagliligtas.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang pangalang “Yahweh,” ang temporal na diin ng “Pagsapit ng gabi,” at ang larawang “mga anak ni Israel,” habang inilagay sa talababa ang literal na kasarian ng Hebreong parirala at ang mga idyomatikong alternatibo.
