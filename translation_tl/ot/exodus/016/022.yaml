base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: tl
  text: At nang ikaanim na araw, nagtipon sila ng dobleng dami ng tinapay—dalawang omer[a] para sa bawat isa. Lumapit kay Moises ang lahat ng pinuno ng sambayanan at iniulat nila ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang omer ay yunit ng panukat ng tuyong bagay sa sinaunang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: At nang
  rationale: Likas na panimulang pasalaysay sa modernong Tagalog; ipinagpapatuloy nito ang daloy at ipinakikilala ang pangyayari nang hindi gumagamit ng makalumang parirala.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: nang ikaanim na araw
  rationale: Karaniwan at malinaw na temporal na parirala sa Tagalog.
- source_word: לָקְטוּ
  choice: kanilang tinipon
  rationale: Ang pandiwa ay tumutukoy sa pagtitipon o pangongolekta ng manna; natural ang “tinipon” sa kontekstong ito.
- source_word: לֶחֶם מִשְׁנֶה
  choice: dalawang ulit ang tinapay
  rationale: Pinananatili ang literal na “tinapay” at malinaw na ipinahahayag ang dobleng dami nang hindi ipinapalit ang “pagkain” o tahasang “manna.”
- source_word: שְׁנֵי הָעֹמֶר
  choice: dalawang omer
  rationale: Isinalin sa tunog ang sinaunang yunit sa halip na magbigay ng di-tiyak na makabagong katumbas.
- source_word: לָאֶחָד
  choice: para sa bawat isa
  rationale: Ipinapakita ang distributibong kahulugan ng literal na “para sa isa” sa natural na Tagalog.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: lahat ng pinuno ng sambayanan
  rationale: Ang “pinuno” ay malinaw para sa נְשִׂיאֵי, at ang “sambayanan” ay angkop sa nagkakatipong komunidad ng Israel nang hindi masyadong makitid o institusyonal.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: pumunta kay Moises ... at sinabi nila ito sa kanya
  rationale: Pinananatili ang sunod-sunod na kilos—pagpunta at pagsasabi—sa natural na ayos ng Tagalog.
