- from: At nang ikaanim na araw, dalawang ulit ang tinapay na kanilang tinipon—dalawang omer[a] para sa bawat isa. Kaya pumunta kay Moises ang lahat ng pinuno ng sambayanan at sinabi nila ito sa kanya.
  to: At nang ikaanim na araw, nagtipon sila ng dobleng dami ng tinapay—dalawang omer[a] para sa bawat isa. Lumapit kay Moises ang lahat ng pinuno ng sambayanan at iniulat nila ito.
  rationale: Pinalitan ang malabong “dalawang ulit ang tinapay” ng “dobleng dami ng tinapay” upang malinaw na maipahayag ang מִשְׁנֶה at manatiling kaayon ng kasunod na “dalawang omer para sa bawat isa.” Pinakinis din ang pangwakas na sugnay habang pinananatili ang paglapit ng mga pinuno kay Moises at ang kanilang pag-uulat. Inayos ang talababa sa mas likas na Tagalog.
