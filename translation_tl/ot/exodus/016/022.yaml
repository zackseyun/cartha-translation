  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang “tinapay” ng Hebreo sa halip na gawing “manna,” at gumamit ng paliwanag sa talababa para sa sinaunang sukat.
