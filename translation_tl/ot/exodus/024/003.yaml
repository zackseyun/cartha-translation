  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: tl
  text: Pagkatapos, dumating si Moises at isinalaysay sa bayan ang lahat ng salita ni Yahweh at ang lahat ng tuntunin[a]. Sumagot ang buong bayan nang may iisang tinig, “Gagawin namin ang lahat ng salitang sinabi ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga hatol” o “mga ordinansa.” Ang Hebreong mishpatim ay tumutukoy rito sa mga legal na pasiya o tuntunin ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pagkatapos, dumating si Moises
  rationale: Isinusulong ng waw-consecutive ang salaysay, at ang karaniwang diwa rito ng בוא ay “dumating.”
- source_word: וַיְסַפֵּר
  choice: isinalaysay
  rationale: Ang piel ng ספר ay nangangahulugang magsalaysay o maglahad; natural at marangal sa Filipino ang “isinalaysay” sa pormal na pagpapahayag sa bayan.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: ang lahat ng salita ni Yahweh
  rationale: Pinananatili ng “mga salita” ang tiyak na leksikal na diwa ng דְּבָרִים at ang ugnayan nito sa tugon ng bayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: הַמִּשְׁפָּטִים
  choice: mga tuntuning legal
  rationale: Sa konteksto ng tipan, ang מִשְׁפָּטִים ay mga legal na pasiya o tuntunin. Mas malinaw sa karaniwang mambabasang Filipino ang “mga tuntuning legal” kaysa sa literal ngunit maaaring malabong “mga hatol.”
- source_word: וַיַּעַן
  choice: Sumagot
  rationale: Karaniwang kahulugan ng ענה sa konstruksiyong ito ang sumagot o tumugon.
- source_word: קוֹל אֶחָד
  choice: nang may iisang tinig
  rationale: Pinananatili nito ang larawang Hebreo ng “isang tinig” at malinaw na ipinahihiwatig ang nagkakaisang tugon.
- source_word: כָּל הַדְּבָרִים
  choice: ang lahat ng salitang
  rationale: Inuulit ang “salita” upang mapanatili ang sinadyang leksikal na pagkakaugnay sa naunang ulat ni Moises.
- source_word: דִּבֶּר
  choice: sinabi
  rationale: Natural sa Filipino ang “sinabi” para sa naunang pagsasalita ni Yahweh, habang malinaw pa rin ang ugnayan sa “mga salita.”
- source_word: נַעֲשֶׂה
  choice: Gagawin namin
  rationale: Tuwirang pinananatili ang diwa ng עשה na “gawin,” nang hindi tahasang pinalalawak sa “susundin,” bagaman nakapaloob ang pagsunod.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng pangako ng bayan sa נַעֲשֶׂה
  choice: Gagawin namin
  alternative: Susundin namin
  rationale: Mas malapit ang “gagawin” sa pandiwang Hebreo at hindi nito nilulutas sa pamamagitan ng pagpapakahulugan ang buong saklaw ng tugon, kahit malinaw na ipinahihiwatig ang pagsunod.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עָם, pinanatili ang pag-uulit ng “salita,” at iniwasan ang sobrang legalistiko o denominasyonal na pananalita.
