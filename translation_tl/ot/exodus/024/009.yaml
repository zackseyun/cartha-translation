- source_word: וַיַּעַל
  choice: umakyat
  rationale: Tuwirang ipinapahayag ang pataas na pagkilos ng עלה nang hindi idinaragdag ang “sa bundok,” na ipinahihiwatig lamang ng konteksto.
- source_word: מֹשֶׁה וְאַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: sina Moises, Aaron, Nadab, Abihu
  rationale: Ginamit ang “sina” bilang likas na panandang maramihan para sa magkakasunod na pangalang pantangi sa Filipino; pinanatili ang karaniwang anyo ng mga pangalan.
- source_word: וְשִׁבְעִים מִזִּקְנֵי יִשְׂרָאֵל
  choice: at ang pitumpu sa matatandang pinuno ng Israel
  rationale: 'Ang מִן ay partitive: pitumpu mula sa pangkat ng matatandang pinuno. Ang “matatandang pinuno” ay malinaw at natural na salin ng זְקֵנִים sa kontekstong namumuno sa bayan.'
