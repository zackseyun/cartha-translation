id: EXO.24.2
reference: Exodus 24:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: tl
  text: Si Moises lamang ang lalapit kay Yahweh[a]. Ngunit sila ay hindi lalapit, at ang bayan ay hindi aakyat na kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: Nililinaw ang anyo ng banal na pangalan at ang karaniwang alternatibong salin nito.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: ang lalapit
  rationale: Ang נגשׁ ay nangangahulugang lumapit. Sa konteksto ng mga tagubilin, natural sa Tagalog ang anyong panghinaharap na may puwersang nag-uutos.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalan sa Tagalog.
- source_word: לְבַדּוֹ
  choice: lamang
  rationale: Malinaw na ipinahihiwatig na si Moises, at wala nang iba, ang lalapit.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng אֶל ang paglapit sa presensiya ni YHWH; pinanatili ang personal na pangalang Yahweh.
- source_word: וְהֵם
  choice: ngunit sila
  rationale: Ang panghalip ay tumutukoy sa grupong naunang binanggit sa konteksto. Ginamit ang “ngunit” upang natural na ihayag ang malinaw na pagsalungat sa natatanging paglapit ni Moises.
- source_word: לֹא יִגָּשׁוּ
  choice: ay hindi lalapit
  rationale: Inulit ang “lalapit” upang mapanatili ang leksikal na ugnayan at tuwirang paghahambing sa pahintulot kay Moises.
- source_word: וְהָעָם
  choice: at ang bayan
  rationale: Tuwirang salin ng הָעָם nang hindi idinaragdag ang “ng Israel,” na hindi hayagang nasa talata.
- source_word: לֹא יַעֲלוּ
  choice: ay hindi aakyat
  rationale: Ang עלה ay tumutukoy sa pag-akyat, dito ay paakyat sa bundok.
- source_word: עִמּוֹ
  choice: na kasama niya
  rationale: Tumutukoy kay Moises at natural na naghahayag na hindi sasabay sa kanyang pag-akyat ang bayan.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalang tipan ang יְהוָה; pinanatili ito bilang “Yahweh” sa pangunahing teksto, habang itinatala sa talababa ang tradisyonal na katumbas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pag-uulit ng “lalapit” at ang pagkakaiba ng pangkat na pinahihintulutang lumapit, samantalang iniwasan ang di-hayag na pagdaragdag sa teksto.
