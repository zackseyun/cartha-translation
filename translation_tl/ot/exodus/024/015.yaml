base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: tl
  text: Pagkatapos, umakyat si Moises sa bundok[a], at tinakpan ng ulap ang bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa bundok.” Maaaring ipakahulugan ang Hebreong pang-ukol bilang “patungo sa,” o, kasama ng “umakyat,” bilang pag-akyat sa bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Karaniwang nangangahulugan ang עלה na ‘umakyat’ o ‘pumaitaas.’ Natural at tuwiran ang ‘umakyat’ sa makabagong Filipino.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang kinagawiang anyo ng pangalan sa Filipino.
- source_word: אֶל
  choice: sa
  rationale: Kasama ng pandiwang ‘umakyat’ at ng ‘bundok,’ natural na ipinahihiwatig ng ‘sa’ ang pag-akyat patungo at papasok sa mataas na bahagi ng bundok; maaari rin itong unawain bilang simpleng ‘patungo sa.’
- source_word: הָהָר
  choice: ang bundok
  rationale: Sa konteksto ng Sinai, ang ‘bundok’ ang angkop at kinagawiang kahulugan ng הַר.
- source_word: וַיְכַס
  choice: tinakpan
  rationale: Tuwirang katumbas ito ng כסה, ‘takpan.’ Hindi nito dinaragdagan ang larawan gaya ng mas mapagpahiwatig na ‘binalot.’
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tiyak na ulap ang tinutukoy sa konteksto, kaya ginamit ang ‘ang ulap.’
- source_word: אֶת
  choice: '[pananda ng tiyak na tuwirang layon; hindi hiwalay na isinalin]'
  rationale: Walang tuwirang katumbas sa Filipino ang Hebreong pananda ng tiyak na tuwirang layon; ipinahahayag ito ng karaniwang ayos ng pangungusap.
- source_word: וַ
  choice: Pagkatapos / at
  rationale: Ang unang waw ay nagsusulong ng pagkakasunod-sunod ng salaysay, kaya ‘Pagkatapos’; ang ikalawa ay likas na pinag-uugnay ng ‘at.’
theological_decisions:
- issue: Kalikasan ng ulap
  choice: Isinalin lamang bilang ‘ang ulap,’ nang walang idinagdag na paliwanag sa pangunahing teksto.
  alternative: ‘ulap ng kaluwalhatian’ o ‘ulap ng PANGINOON’
  rationale: Ulap lamang ang tahasang pinangalanan ng Hebreo. Bagaman kaugnay ito ng presensya ng Diyos sa mas malawak na konteksto, hindi dapat idagdag sa talatang ito ang hindi nito tahasang sinasabi.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang ‘Pagkatapos’ upang malinaw ang pagsulong ng salaysay, habang pinanatili sa talababa ang tunay na kalabuan ng אֶל.
