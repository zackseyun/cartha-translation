base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: tl
  text: At isinugo niya ang mga kabataang lalaking Israelita[a]. Naghandog sila ng mga handog na sinusunog at nag-alay kay Yahweh ng mga handog na pangkapayapaan mula sa mga toro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “ang mga kabataang lalaki ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga handog para sa pakikipag-isa” o “mga handog para sa mabuting kalagayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: isinugo niya
  rationale: Tuwirang inilalahad ng pandiwa ang pagpapadala ni Moises sa mga kabataang lalaki. Ang “isinugo” ay natural at marangal sa konteksto ng isang iniatas na gawain.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: ang mga kabataang lalaki mula sa mga Israelita
  rationale: Pinananatili ng “kabataang lalaki” ang panlalaking pagtukoy ng נַעַר, samantalang natural na ipinahahayag ng “mula sa mga Israelita” ang kanilang kaugnayan sa bayan ng Israel.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: naghandog sila ng mga handog na sinusunog
  rationale: Ang magkapares na pandiwa at pangngalan ay isang terminong pansakripisyo. Malinaw sa modernong Tagalog ang “handog na sinusunog” at hindi nito ipinapalagay ang hayop na ginamit.
- source_word: וַיִּזְבְּחוּ
  choice: nag-alay
  rationale: Sa kontekstong pansakripisyo, tumutukoy ang זבח sa pagkatay at paghahandog bilang sakripisyo. Ang “nag-alay” ay natural at sapat na malinaw kasunod ng tiyak na uri ng handog.
- source_word: זְבָחִים שְׁלָמִים
  choice: mga handog para sa kapayapaan
  rationale: Pinananatili nito ang kinikilalang pangalan ng uring pansakripisyo, habang inilalagay sa talababa ang iba pang posibleng diin ng שְׁלָמִים.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinasalin ang tahasang tipanang pangalan na יהוה bilang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: פָּרִים
  choice: mga toro
  rationale: Tiyak na tinutukoy ng pangngalan ang mga lalaking baka na inialay bilang mga handog para sa kapayapaan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba ng pangalan sa titulong “Panginoon” nang hindi nagdaragdag ng paliwanag sa talata.
- issue: Kahulugan ng זְבָחִים שְׁלָמִים
  choice: mga handog para sa kapayapaan
  alternative: mga handog para sa pakikipag-isa; mga handog para sa mabuting kalagayan
  rationale: Maaaring magpahiwatig ang katawagan ng kapayapaan, kabuuan o kaginhawahan, at ng pakikisalo sa handog. Hindi ipinipilit ng pangunahing salin ang isang mas makitid na teolohikal na paliwanag; pinananatili sa talababa ang mga lehitimong alternatibo.
- issue: Paglalahad sa בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Ang parirala ay karaniwang katawagan sa sambayanang Israel. Natural sa Tagalog ang “mga Israelita,” habang nasa talababa ang mas literal na anyo upang mapanatili ang hugis ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga karaniwang terminong pansakripisyo at iniwasan ang labis na literal na pariralang magiging alanganin sa Tagalog. Nakalagay ang lahat ng pananda ng talababa sa mismong teksto.
