  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Umakyat ka sa akin sa bundok at manatili ka roon. Ibibigay ko sa iyo ang mga tapyas na bato, at ang kautusan[a] at ang utos[b], na isinulat ko upang turuan sila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tagubilin” o “turo.” Ang salitang Hebreo na torah ay madalas tumukoy sa pagtuturo, hindi lamang sa isang batas.
    reason: lexical_alternative
  - marker: b
    text: Ang pariralang “ang kautusan at ang utos” ay maaaring tumukoy sa karagdagang tagubilin ng tipan bukod sa mga tapyas na bato, o maaaring higit pang naglalarawan sa nakasulat sa mga tapyas.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Umakyat ka sa akin sa bundok
  rationale: Likas na ipinahahayag nito sa modernong Tagalog ang pag-akyat patungo kay Yahweh na nasa bundok.
- source_word: וֶהְיֵה שָׁם
  choice: at manatili ka roon
  rationale: Ipinahahayag ng “manatili” ang patuloy na pananatili na hinihingi sa konteksto, hindi lamang ang pagdating doon.
- source_word: וְאֶתְּנָה לְךָ
  choice: Ibibigay ko sa iyo
  rationale: Ang anyo ay nagpapahayag ng layunin o pangako ng Diyos kasunod ng utos.
- source_word: לֻחֹת הָאֶבֶן
  choice: ang mga tapyas na bato
  rationale: Ang “tapyas” ay malinaw at likas na katawagan sa mga patag na piraso ng batong sinulatan.
- source_word: וְהַתּוֹרָה
  choice: ang kautusan
  rationale: Ang “kautusan” ay pamilyar sa konteksto ng tipan sa Sinai, habang nililinaw sa talababa na maaari ring mangahulugang “tagubilin” o “turo” ang torah.
- source_word: וְהַמִּצְוָה
  choice: ang utos
  rationale: Pinanatili ang tahasang isahang anyo ng salitang Hebreo sa natural na Tagalog.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: na isinulat ko
  rationale: Pinananatili nito ang ganap nang pagkakasulat nang hindi ipinapasya kung alin sa naunang mga bagay ang eksaktong saklaw.
- source_word: לְהוֹרֹתָם
  choice: upang turuan sila
  rationale: Natural na inilalahad nito ang layunin ng Hiphil infinitive at ang panghalip na tumutukoy sa bayang Israel.
theological_decisions:
- issue: Saklaw ng “ang kautusan at ang utos” kaugnay ng “mga tapyas na bato”
  choice: Pinanatili ang magkakaugnay na mga pangngalan bilang “ang mga tapyas na bato, at ang kautusan at ang utos.”
  alternative: Unawain ang “ang kautusan at ang utos” bilang paliwanag lamang sa nilalaman ng mga tapyas, o pagsamahin ang tatlo bilang iisang pagtukoy sa Sampung Utos.
  rationale: Hindi tahasang nilulutas ng balarila ng Hebreo kung hiwalay na karagdagang tagubilin ang tinutukoy o kung inilalarawan nito ang nakasulat sa mga tapyas; kaya pinanatili ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “tapyas na bato” at “manatili ka roon” para sa likas na daloy, habang pinanatili ang isahang “utos” at ang kalabuan ng ugnayan ng mga parirala.
