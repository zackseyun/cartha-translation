source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: tl
  text: Nanahan ang kaluwalhatian ni Yahweh sa Bundok Sinai, at tinakpan ito ng ulap sa loob ng anim na araw.[a] Sa ikapitong araw, tinawag niya si Moises mula sa gitna ng ulap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “at tinakpan ng ulap ang kaluwalhatian ni Yahweh,” kung ang hulaping panghalip ay tumutukoy sa “kaluwalhatian” sa halip na sa Bundok Sinai.'
    reason: alternative_reading
  - marker: b
    text: 'Maaari ring: “mula sa loob ng ulap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: Nanahan
  rationale: Ipinahahayag ng ugat na שכן ang pananatili o pagtira sa isang lugar. Ang “nanahan” ay likas at marangal sa Filipino at ipinakikitang namalagi roon ang nahayag na kaluwalhatian.
- source_word: כְּבוֹד יְהוָה
  choice: ang kaluwalhatian ni Yahweh
  rationale: Pinananatili ang hulma ng pariralang Hebreo at ang karaniwang diwa ng כָּבוֹד bilang nahahayag na karangalan, karingalan, at presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עַל הַר סִינַי
  choice: sa Bundok Sinai
  rationale: Ang “sa” ang natural na Filipino para sa lokasyong nasa ibabaw o kinaroroonan sa isang bundok; malinaw ang “Bundok Sinai” bilang pangalang pantangi.
- source_word: וַיְכַסֵּהוּ
  choice: tinakpan ito
  rationale: Pinananatili ng “ito” ang panghalip na panlalaking isahan sa Hebreo nang hindi inuulit ang posibleng tinutukoy. Sa pangunahing pagbasa, tumutukoy ito sa Bundok Sinai.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tumutukoy ang tiyak na anyo sa kilalang ulap ng pagpapakita ng Diyos sa salaysay sa Sinai.
- source_word: שֵׁשֶׁת יָמִים
  choice: sa loob ng anim na araw
  rationale: Natural na Filipino ito para sa tagal ng panahon na ipinahahayag ng pariralang Hebreo.
- source_word: וַיִּקְרָא אֶל מֹשֶׁה
  choice: tinawag niya si Moises
  rationale: Ang “tinawag” ang malawak at tuwirang katumbas ng קרא sa konteksto. Pinananatili ang di-hayag na simuno sa anyong panghalip, gaya ng daloy ng Hebreo.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Sa ikapitong araw
  rationale: Ito ang natural na modernong Filipino para sa tiyak na ordinal na panahong binanggit.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: mula sa gitna ng ulap
  rationale: Pinananatili nito ang kongkretong larawan ng pagsasalita mula sa kaloob-looban o gitna ng ulap.
theological_decisions:
- issue: Ang simuno ng “tinawag niya”
  choice: Si Yahweh ang likas na tinutukoy, ngunit nananatiling panghalip ang salin
  alternative: Ang “kaluwalhatian ni Yahweh” bilang metonimikong simuno
  rationale: Walang tahasang pangngalang simuno sa sugnay na Hebreo. Itinuturo ng konteksto kay Yahweh ang tumatawag, ngunit hindi inuulit ang pangalan upang mapanatili ang anyo at bahagyang tensiyon ng orihinal.
- issue: Ang tinutukoy ng hulaping panghalip sa וַיְכַסֵּהוּ
  choice: Ang Bundok Sinai
  alternative: Ang kaluwalhatian ni Yahweh
  rationale: Kapuwa panlalaking isahan sa gramatikang Hebreo ang mga posibleng tinutukoy. Higit na umaangkop sa larawan ng salaysay na ang ulap ang tumakip sa bundok, ngunit tunay ang alternatibong pagbasa kaya inilagay ito sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “nanahan” upang panatilihin ang bigat ng pagpapakita at pananatili ng kaluwalhatian nang hindi nagiging lipas ang pananalita. Inilagay ang mga pananda ng talababa sa mismong sugnay na kanilang nililinaw.
