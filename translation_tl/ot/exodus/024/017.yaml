id: EXO.24.17
reference: Exodus 24:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: tl
  text: At ang anyo ng kaluwalhatian ni Yahweh ay parang apoy na tumutupok[a] sa tuktok ng bundok, sa paningin ng mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apoy na lumalamon.”
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: anyo
  rationale: Tumutukoy ito sa nakikitang anyo o pagpapakita; ang “anyo” ay tuwiran at hindi nagpapahiwatig na isa itong pangitain.
- source_word: כְּבוֹד
  choice: kaluwalhatian
  rationale: Sa pagtukoy sa nakikitang presensiya ni Yahweh, “kaluwalhatian” ang likas at kinikilalang katumbas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: parang apoy na tumutupok
  rationale: Ipinahahayag ng כְּ ang paghahambing, at ang participle mula sa אכל ay likas na tumutukoy sa apoy na umuubos o tumutupok.
- source_word: בְּרֹאשׁ הָהָר
  choice: sa tuktok ng bundok
  rationale: Malinaw at natural na ipinahahayag nito ang kinalalagyan sa pinakamataas na bahagi ng bundok.
- source_word: לְעֵינֵי
  choice: sa paningin ng
  rationale: 'Pinananatili nito ang biswal na diin ng idyomang Hebreo: hayag at nakikita nila.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at pinananatili ang katawagang tipan, habang inilalahad sa talababa ang mas idyomatikong katumbas.
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Katawagan sa tipang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ng pangunahing teksto ang literal na ugnayang “mga anak ni Israel,” nang hindi ipinapalagay na mga lalaki lamang ang buong pangkat na tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang simile na “parang,” ang biswal na diin ng “sa paningin,” at ang personal na pangalang Yahweh. Ginamit ang “mga anak ni Israel” bilang malapit na salin sa Hebreo, na may mas natural na alternatibo sa talababa.
