  source_fidelity: 'Ang pangunahing diwa ay naihahatid nang tapat: inuutusan ang mga elder na manatili roon hanggang sa pagbabalik ng nagsasalita, at sina Aaron at Hur ang tatanggap ng mga usaping pagtatalunan. Gayunman, ang “matatandang pinuno” ay bahagyang nagpapasok ng edad at tungkuling hindi kailangang pagsamahin sa salin; ang הַזְּקֵנִים ay mas ligtas na isalin bilang “mga matatanda,” na karaniwang katawagan sa kinikilalang mga elder. Ang “makabalik” ay maaari ring magpahiwatig ng kakayahang makabalik, samantalang tiyak na pagbabalik ang nasa Hebreo.'
  naturalness: Malinaw at marangal ang daloy. Mas natural at mas tumpak ang “hanggang sa bumalik kami sa inyo” kaysa “hanggang sa makabalik kami sa inyo.” Ang “Narito” ay katanggap-tanggap bilang pantawag-pansin sa ganitong rehistro.
  terminology: Panatilihin ang “mga matatanda” para sa kinikilalang elder ng pamayanan nang hindi pinipilit ang modernong administratibong “pinuno.” Ang “alitan” ay angkop para sa בעל דברים sa kontekstong pagdulog sa sina Aaron at Hur. Ang talababa ay dapat magbigay ng malinaw na alternatibong legal na pagbasa.
