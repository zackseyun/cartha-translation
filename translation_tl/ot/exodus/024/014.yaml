  to: Sinabi niya sa mga matatanda, “Hintayin ninyo kami rito hanggang sa bumalik kami sa inyo. Narito, kasama ninyo sina Aaron at Hur. Sinumang may alitan[a] ay lumapit sa kanila.”
  rationale: Pinalitan ang “matatandang pinuno” ng “mga matatanda” upang mapanatili ang kinikilalang terminong elder nang walang di-kinakailangang pagpapaliwanag, at pinalitan ang “makabalik” ng “bumalik” upang tumpak na maipahayag ang tiyak na pagbabalik. Nilinaw ang alternatibong legal na diwa ng בעל דברים sa talababa nang hindi isinasara ang saklaw nito sa isang tiyak na uri ng kaso.
