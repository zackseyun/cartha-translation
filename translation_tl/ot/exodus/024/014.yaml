  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: tl
  text: Sinabi niya sa mga matatanda, “Hintayin ninyo kami rito hanggang sa bumalik kami sa inyo. Narito, kasama ninyo sina Aaron at Hur. Sinumang may alitan[a] ay lumapit sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sinumang may usaping legal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: matatandang pinuno
  rationale: Sa konteksto, tumutukoy ito sa kinikilalang mga elder o pinuno ng sambayanan, hindi lamang sa matatandang lalaki. Nililinaw ng “matatandang pinuno” ang tungkulin nila.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Hintayin ninyo kami rito
  rationale: Bagaman literal na maaaring “maupo/manatili,” ang utos sa konteksto ay manatili sa lugar habang wala sina Moises at Josue. Natural na naihahatid ito ng “hintayin ninyo kami rito.”
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: hanggang sa makabalik kami sa inyo
  rationale: Tuwirang ipinapahayag ang temporal na hangganan at ang pagbabalik sa mga elder.
- source_word: וְהִנֵּה
  choice: Narito
  rationale: Pinananatili ang pantawag-pansing puwersa ng הִנֵּה sa dignidad ngunit hindi makalumang Filipino.
- source_word: עִמָּכֶם
  choice: kasama ninyo
  rationale: Tuwirang ipinahahayag ang presensya at pakikisama nina Aaron at Hur sa mga elder.
- source_word: מִי בַעַל דְּבָרִים
  choice: Sinumang may alitan
  rationale: Ang idyoma ay tumutukoy sa taong may legal na usapin, paghahabol, o sigalot. Malinaw at likas sa Filipino ang “may alitan,” habang ang alternatibong legal na diwa ay inilagay sa talababa.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: ay lumapit sa kanila
  rationale: Ang imperfect ay may puwersang pautos o jussive rito. Ang “lumapit sa kanila” ay natural na tagubilin at hindi nagpapalabis sa legal na pamamaraan.
theological_decisions:
- issue: Pangkalahatang isahan sa legal na tagubilin
  choice: Sinumang may alitan ay lumapit sa kanila
  alternative: Ang mga may alitan ay lumapit sa kanila
  rationale: Pinananatili ng “sinumang” ang pangkalahatang isahang anyo ng Hebreo nang hindi kinakailangang magtakda ng kasarian sa Filipino.
- issue: Pagkakakilanlan ng nagsasalita
  choice: Sinabi niya
  alternative: Sinabi ni Moises
  rationale: Panghalip lamang ang nasa talata. Hindi tahasang ipinapasok ang pangalang Moises, kahit malinaw ito sa mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy; pinanatili ang maikli at tuwirang anyo ng tagubilin.
