  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: tl
  text: Kaya tumindig si Moises kasama si Josue, na kanyang katulong[a], at umakyat si Moises sa bundok ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanyang lingkod.” Ang salitang Hebreo ay tumutukoy sa isang taong naglilingkod at umaalalay nang malapitan; dito, malamang na personal na katulong ni Moises si Josue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay nagsasaad ng pagtindig bilang kasunod na kilos sa salaysay; pinananatili ng “tumindig” ang anyo nang hindi agad ipinapalagay na ang kahulugan ay “umalis.”
- source_word: וִיהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang biblikal na Joshua.
- source_word: מְשָׁרְתוֹ
  choice: kanyang tagapaglingkod
  rationale: Ang שׁרת ay tumutukoy sa isang naglilingkod o umaalalay nang malapitan. Ang “tagapaglingkod” ay likas at marangal sa Tagalog, habang nililinaw ng “kanyang” na kay Moises nakatalaga si Josue; inilalahad sa talababa ang posibleng “katulong.”
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Ang עלה rito ay tahasang tumutukoy sa paakyat na pagkilos patungo sa bundok; natural at eksakto ang “umakyat.”
- source_word: הַר הָאֱלֹהִים
  choice: bundok ng Diyos
  rationale: Tuwirang pinananatili nito ang Hebreong parirala at ang kaugnayan ng bundok sa Diyos nang hindi ito ipinapaliwanag nang higit sa teksto.
theological_decisions:
- issue: Ang ugnayan nina Moises at Josue sa מְשָׁרְתוֹ
  choice: Inilarawan si Josue bilang personal na tagapaglingkod o katulong ni Moises.
  alternative: Maaaring isalin na “kanyang lingkod” o “kanyang katulong.”
  rationale: Malawak ang saklaw ng salitang Hebreo, ngunit sa konteksto ay serbisyo at pag-alalay kay Moises ang tinutukoy, hindi pagkaalipin o isang natatanging tungkuling panrelihiyon.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Pinili ang “tumindig” upang mapanatili ang salaysay na pagkakasunod at ang literal na kilos, at “tagapaglingkod” upang maiwasan ang pahiwatig ng pagkaalipin o ng institusyonal na ministeryo.
