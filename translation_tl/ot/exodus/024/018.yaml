  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: tl
  text: Pumasok si Moises sa gitna ng ulap at umakyat sa bundok.[a] Si Moises ay nasa bundok nang apatnapung araw at apatnapung gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “pumasok sa ulap” o “pumasok sa loob ng ulap.” Idinidiin ng Hebreo na pumasok si Moises sa mismong ulap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Pumasok
  rationale: Sa kontekstong ito, inilalarawan ng בוא ang pagpasok ni Moises sa ulap; tuwiran at natural ang “pumasok” sa Filipino.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Ipinahihiwatig ng תּוֹךְ ang loob o kalagitnaan, kaya pinananatili ng parirala ang diin na pumasok si Moises sa mismong ulap.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tuwirang salin ng עָנָן na may tiyak na pantukoy; tumutukoy ito sa ulap na nauna nang binanggit sa salaysay.
- source_word: וַיַּעַל אֶל הָהָר
  choice: umakyat sa bundok
  rationale: Likas na ipinapahayag sa Filipino ang pataas na kilos at patutunguhan nang hindi dinaragdagan ang detalye ng paraan ng pag-akyat.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: Nanatili si Moises sa bundok
  rationale: Bagaman payak na “nasa” ang literal na estado, natural na ipinahahayag ng “nanatili” ang lokasyon sa loob ng tahasang itinakdang tagal, nang hindi ipinahihiwatig na umalis siya sa pagitan.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: nang apatnapung araw at apatnapung gabi
  rationale: Karaniwan at tumpak na anyong Filipino para sa tagal na binabanggit sa Hebreo.
theological_decisions:
- issue: Paglalarawan sa ulap na kaugnay ng presensiya ng Diyos
  choice: ang ulap
  alternative: ang makapal na ulap
  rationale: Karaniwang pangngalang עָנָן lamang ang ginamit dito at walang pang-uring nangangahulugang “makapal”; kaya hindi pinalalawak ang larawan sa paraang interpretatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa gitna ng ulap” upang mapanatili ang matingkad na diwa ng Hebreo, at inilagay ang talababa pagkatapos ng buong sugnay na pagpasok at pag-akyat.
