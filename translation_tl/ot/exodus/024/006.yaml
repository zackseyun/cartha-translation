  source_fidelity: 'Tumpak na naipapahayag ng salin ang sunod-sunod na kilos sa Hebreo: kinuha ni Moises ang kalahati ng dugo, inilagay ito sa mga sisidlan, at isinaboy ang natitirang kalahati sa altar. Ang pag-uulit ng “kalahati ng dugo” ay wastong tumutugma sa pag-uulit sa pinagmulan. Ang “sa altar” ay isang maingat at natural na paglalapat ng עַל sa kontekstong ito nang hindi labis na pinipilit ang eksaktong puntong tinamaan.'
  naturalness: Malinaw at natural ang modernong Filipino Tagalog. Ang paghahati sa dalawang pangungusap ay hindi nakapagbabago ng ugnayan ng mga kilos at nakatutulong sa daloy. Ang “mga mangkok” ay mauunawaang mga sisidlang lalagyan ng likido at angkop sa karaniwang gamit.
  terminology: Wasto at pare-pareho ang “Moises,” “dugo,” at “altar.” Ang “isinaboy” ay angkop na mas mariing katumbas ng זָרַק sa kontekstong panghandog, samantalang pinananatili ng talababa ang leksikal na posibilidad ng “iwinisik.”
