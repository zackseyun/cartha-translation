  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ חֲצִ֣י הַ/דָּ֔ם וַ/יָּ֖שֶׂם בָּ/אַגָּנֹ֑ת וַ/חֲצִ֣י הַ/דָּ֔ם זָרַ֖ק עַל הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: tl
  text: Kinuha ni Moises ang kalahati ng dugo at inilagay iyon sa mga mangkok. Ang kalahati naman ng dugo ay isinaboy niya sa altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iwinisik sa altar.” Sa mga kontekstong panghandog, ang pandiwang Hebreo ay maaaring tumukoy sa pagwiwisik o pagsaboy ng dugo; pinili rito ang mas mariing pananalita upang ipakita ang malamang na pisikal na kilos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kinuha
  rationale: Karaniwang salaysay na gamit ng לָקַח; ang “kinuha” ang tuwiran at likas na katumbas sa modernong Tagalog.
- source_word: חֲצִי הַדָּם
  choice: ang kalahati ng dugo
  rationale: Pinananatili ang partitive na diwa ng pariralang Hebreo at malinaw itong nauunawaan sa Tagalog.
- source_word: וַיָּשֶׂם
  choice: inilagay
  rationale: Malawak na pandiwa ng paglalagay ang שׂים; ang “inilagay” ang natural na katumbas dito.
- source_word: בָּאַגָּנֹת
  choice: sa mga mangkok
  rationale: Ang אַגָּנֹת ay mga sisidlang lalagyan ng likido. Mas natural sa karaniwang modernong Tagalog ang “mga mangkok” kaysa “mga palanggana,” na maaaring magpahiwatig ng sisidlang panlinis.
- source_word: זָרַק
  choice: isinaboy
  rationale: Sa kontekstong panghandog, ipinahihiwatig ng pandiwa ang paghahagis o malakas na paglalapat ng dugo, hindi lamang marahang pagwiwisik. Natural at sapat na mariin ang “isinaboy” sa Tagalog.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Sa konstruksyong ito, ang עַל ay tumutukoy sa altar bilang ibabaw o puntirya ng pagsaboy. Ang “sa altar” ay natural at hindi labis na nagpapasiya kung sa ibabaw o sa tagiliran nito tumama ang dugo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwan at kinikilalang anyo ng pangalang מֹשֶׁה sa Tagalog.
theological_decisions:
- issue: Rituwal na paglalapat ng dugo
  choice: isinaboy niya sa altar
  alternative: iwinisik niya sa altar
  rationale: Sinusuportahan ng זָרַק sa kontekstong panghandog ang isang mas mariing kilos kaysa sa karaniwang ipinahihiwatig ng “winisik.” Pinananatili ng “isinaboy” ang lakas ng kilos nang hindi nagdaragdag ng doktrinal na pagpapakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “altar,” na mas natural at malawak na kinikilala kaysa sa mas tradisyonal na “dambana” sa partikular na kontekstong panghandog. Ang pag-uulit ng “dugo” sa ikalawang pangungusap ay sumusunod sa diin at balanse ng tekstong Hebreo.
