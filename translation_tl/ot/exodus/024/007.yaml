base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: tl
  text: Pagkatapos ay kinuha niya ang Aklat ng Tipan at binasa iyon sa pandinig ng bayan. Sinabi nila, “Gagawin namin ang lahat ng sinabi ni Yahweh, at makikinig kami.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “at susunod kami.” Ang pandiwang Hebreo ay maaaring mangahulugang “makinig” at, sa konteksto ng tipan, “sumunod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Pagkatapos ay kinuha niya
  rationale: Isinusulong ng wayyiqtol ang pagkakasunod-sunod ng salaysay; natural sa Tagalog ang “Pagkatapos ay” habang pinananatili ang ugnayang pasunod.
- source_word: סֵפֶר הַבְּרִית
  choice: ang Aklat ng Tipan
  rationale: Pinananatili nito ang konkretong larawan ng isang nasusulat na dokumento ng tipan at ang pagiging tiyak nito sa konteksto.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: at binasa iyon sa pandinig ng bayan
  rationale: Dahil isang nasusulat na dokumento ang layon ng קרא, ang diwa ay pagbasa. Ang “sa pandinig ng bayan” ay nagpapanatili sa idyomang Hebreo at malinaw na nagpapahiwatig ng pagbasa nang malakas sa harap nila.
- source_word: הָעָם
  choice: ang bayan
  rationale: Hindi dinaragdagan ng salin ang simpleng Hebreong tumutukoy sa kolektibong sambayanan; ipinakikilala na sila ng mas malawak na konteksto bilang Israel.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: ang lahat ng sinabi ni Yahweh
  rationale: Ang “lahat ng” ay nagpapanatili sa saklaw ng כֹּל אֲשֶׁר, at natural sa Tagalog ang “sinabi” para sa natapos nang pahayag na tinutugunan ngayon ng bayan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: נַעֲשֶׂה
  choice: Gagawin namin
  rationale: Pinananatili ng “gagawin” ang malawak at konkretong kahulugan ng עשה nang hindi agad pinapakahulugang “susundin.”
- source_word: וְנִשְׁמָע
  choice: at makikinig kami
  rationale: Maaaring mangahulugan ang שׁמע ng pakikinig o, sa konteksto ng tipan, pagsunod. Pinananatili ng “makikinig” ang pandinig na diwa na mahalaga sa konteksto ng pagbasa, habang inilalahad sa talababa ang kahulugang pagsunod.
theological_decisions:
- issue: Kahulugan ng tugon sa tipan na וְנִשְׁמָע
  choice: at makikinig kami
  alternative: at susunod kami
  rationale: Magkasangkot sa pandiwang שׁמע ang aktuwal na pakikinig at ang pakikinig na humahantong sa pagsunod, lalo na sa konteksto ng tipan. Hindi tahimik na nilulutas ng pangunahing teksto ang saklaw na ito; pinananatili nito ang pandinig na diwa at inilalagay sa talababa ang lehitimong kahulugang “susunod.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ang “Aklat ng Tipan” at “sa pandinig ng bayan” ay bahagyang pormal upang mapanatili ang kongkretong dokumento at idyomang Hebreo, ngunit nananatiling malinaw sa karaniwang mambabasa.
