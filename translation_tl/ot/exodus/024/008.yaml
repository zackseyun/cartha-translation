  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: tl
  text: Pagkatapos, kinuha ni Moises ang dugo at inihagis niya ito sa mga tao[a]. Sinabi niya, “Narito ang dugo ng tipang ginawa ni Yahweh sa inyo[b] ayon sa lahat ng salitang ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iwinisik niya ito sa mga tao.” Ang pandiwang Hebreo ay mas literal na “inihagis” o “ipinukol,” ngunit sa konteksto ng paghahandog ay maaari itong tumukoy sa ritwal na paglalapat ng dugo.
    reason: lexical_alternative
  - marker: b
    text: Literal na “pinutol ni Yahweh kasama ninyo ang isang tipan,” isang idyomang Hebreo na nangangahulugang “ginawa” o “itinatag” ang isang tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Karaniwang salaysay na anyo ng לקח; ang “kinuha” ang tuwiran at natural na katumbas sa modernong Tagalog.
- source_word: הַדָּם
  choice: ang dugo
  rationale: May tiyak na pantukoy sa Hebreo at tumutukoy sa dugong inihandog na nabanggit na sa konteksto.
- source_word: וַיִּזְרֹק
  choice: inihagis
  rationale: Pinananatili nito ang konkretong lakas ng זרק, na karaniwang nangangahulugang ihagis o ipukol, bagaman sa ritwal na konteksto ay maaari itong tumukoy sa pagwisik o ritwal na paglalapat ng dugo.
- source_word: עַל הָעָם
  choice: sa mga tao
  rationale: Natural na Tagalog para sa kilos na nakatuon o inilapat sa sambayanan; hindi nito tinutukoy kung bawat tao ay tuwirang tinamaan.
- source_word: הִנֵּה
  choice: Narito
  rationale: Dignified at natural na panandang panturo para sa maringal na paghaharap o pagpapahayag.
- source_word: דַם הַבְּרִית
  choice: ang dugo ng tipan
  rationale: Tuwirang pinananatili ang construct chain at ang mahalagang teolohikal at intertekstuwal na parirala.
- source_word: כָּרַת
  choice: ginawa
  rationale: Ang literal na “pinutol” ay isang idyomang Hebreo sa paggawa ng tipan; ang “ginawa” ang malinaw at likas na katumbas sa Tagalog nang hindi nag-aangkat ng malabong parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang ipinahahayag ng Tetragrammaton, hindi pinapalitan ng isang titulo.
- source_word: עִמָּכֶם
  choice: sa inyo
  rationale: Likas na Tagalog sa pariralang “gumawa ng tipan sa inyo”; ang maramihang kausap ay malinaw sa “inyo.”
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ayon sa lahat ng salitang ito
  rationale: Pinananatili ang leksikal na “mga salita” at ang posibleng diwa ng batayan o mga itinakdang nilalaman ng tipan, nang hindi ito agad pinapakahulugang “mga tuntunin.”
theological_decisions:
- issue: Paglalahad sa idyomang כָּרַת ... בְּרִית (“pumutol ng tipan”)
  choice: tipang ginawa
  alternative: tipang pinutol
  rationale: Sa Tagalog, ang “pinutol na tipan” ay karaniwang maiintindihang winakasan ang tipan, kabaligtaran ng Hebreong idyoma. Kaya ginamit ang malinaw na kahulugang “ginawa” habang pinananatili sa tala ang anyong literal.
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Direktang ginagamit ng talata ang banal na pangalan; pinananatili ng “Yahweh” ang pagkakaiba ng personal na pangalan at titulo.
- issue: Ugnayan ng עַל כָּל הַדְּבָרִים הָאֵלֶּה sa tipan
  choice: ayon sa lahat ng salitang ito
  alternative: tungkol sa lahat ng salitang ito
  rationale: Maaaring ipahiwatig ng עַל ang batayan, pagkakaayon, o paksa. Pinili ang “ayon sa” dahil sa konteksto ng pagpapatibay ng tipan, ngunit hindi isinasara ang alternatibong diwang “tungkol sa.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Narito” para sa solemne ngunit natural na tono, “tipan” bilang nakasanayang salitang biblikal, at “Yahweh” bilang pangalan. Iniwasan ang literal na “pinutol ang tipan” dahil mali ang karaniwang kahulugan nito sa Tagalog.
