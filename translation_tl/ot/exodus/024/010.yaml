  naturalness: Mas natural at malinaw sa makabagong Filipino ang “parang isang latag na yari sa safiro” kaysa “parang nilikhang latag na batong safiro.” Ang “kasinlinaw ng mismong kalangitan” ay nananatiling malinaw at marangal.
  terminology: Ang “Diyos ng Israel,” “kaniyang mga paa,” at “safiro” ay angkop. Pinananatili ang “safiro” at ang maingat na talababa tungkol sa posibleng lapis lazuli. Ang “latag” ay katanggap-tanggap para sa brick- o tile-like na ibabaw, na nililinaw ng talababa.
