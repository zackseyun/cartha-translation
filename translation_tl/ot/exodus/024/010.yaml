base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: tl
  text: At nakita nila ang Diyos ng Israel, at sa ilalim ng kaniyang mga paa ay parang isang latag na yari sa safiro[a], na kasinlinaw ng mismong kalangitan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring “batong lapis lazuli.” Hindi tiyak kung anong uri ng mahalagang bato ang tinutukoy ng salitang Hebreo na סַפִּיר (sappir) noong sinaunang panahon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “parang pagkakayari ng isang latag na safiro,” isang larawang nagpapahiwatig ng ginawang ibabaw na gaya ng latag ng mga ladrilyo o baldosa sa ilalim ng kaniyang mga paa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: At nakita nila
  rationale: Tuwirang ipinahahayag ng Qal wayyiqtol ng ראה ang aktuwal na pagkakita; pinananatili ng “nakita” ang lakas ng salaysay nang hindi ito pinalalambot.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tinutukoy ng pariralang construct ang Diyos ng Israel bilang tuwirang layon ng kanilang pagkakita.
- source_word: וְתַחַת רַגְלָיו
  choice: at sa ilalim ng kaniyang mga paa ay may
  rationale: Ang תַּחַת ay “sa ilalim” o “sa ibaba.” Idinagdag ang “ay may” upang maging natural sa Tagalog ang sugnay na walang pandiwa sa Hebreo, habang pinananatili ang antropomorpikong “kaniyang mga paa.”
- source_word: כְּמַעֲשֵׂה
  choice: parang nilikhang
  rationale: Ang מַעֲשֶׂה ay tumutukoy sa gawa o pagkakayari. Ipinahihiwatig ng “parang nilikhang” ang paghahambing at ang anyong sadyang ginawa, nang hindi ipinapalagay ang eksaktong materyal o paraan ng paggawa.
- source_word: לִבְנַת
  choice: latag
  rationale: Bagaman maaaring tumukoy ang לִבְנָה sa ladrilyo, sa kontekstong nasa ilalim ng mga paa ay mas natural ang “latag,” na nagpapahiwatig ng isang inilatag o hinulmang ibabaw at hindi ng iisang ladrilyo.
- source_word: הַסַּפִּיר
  choice: batong safiro
  rationale: Pinananatili ang tradisyonal na pagkilalang “safiro,” ngunit tinutukoy sa talababa ang posibilidad na lapis lazuli ang sinaunang batong tinutukoy.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: ng mismong kalangitan
  rationale: 'Ginagamit dito ang עֶצֶם bilang pampatingkad: ang kalangitan mismo, hindi literal na “buto” o hiwalay na substansiya.'
- source_word: לָטֹהַר
  choice: kasinlinaw
  rationale: Sa biswal na konteksto, ang טֹהַר ay natural na tumutukoy sa linaw o dalisay na kaliwanagan. Ang “kasinlinaw” ay malinaw na nag-uugnay sa paghahambing sa kalangitan.
theological_decisions:
- issue: Antropomorpikong pangitain sa Diyos
  choice: Panatilihin ang tuwirang “nakita nila ang Diyos ng Israel” at “sa ilalim ng kaniyang mga paa.”
  alternative: “nakita nila ang isang pagpapakita ng Diyos ng Israel” o “nakita nila ang lugar na kinatatayuan ng Diyos ng Israel”
  rationale: Tuwirang sinasabi ng Hebreo na nakita nila ang Diyos ng Israel at inilalarawan ang nasa ilalim ng kaniyang mga paa. Hindi dinaragdagan ng salin ang teksto upang ipaliwanag o lutasin ang tensiyong teolohikal tungkol sa pagkakita sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “kaniyang” para sa dignidad at linaw ng reperensiya. Ang “nilikhang latag” ay bahagyang pormal ngunit madaling maunawaan at pinananatili ang diwa ng מַעֲשֶׂה at לִבְנַת. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
