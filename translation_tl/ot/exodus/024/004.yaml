  source_fidelity: 'Tumpak ang salin sa Hebreo: isinulat ni Moises ang lahat ng mga salita ni Yahweh; maaga siyang bumangon sa umaga; nagtayo siya ng altar sa paanan ng bundok at ng labindalawang batong patayo para sa labindalawang lipi ng Israel. Ang “sa paanan ng bundok” ay angkop na idyomatikong salin ng תַּחַת הָהָר, nang hindi ipinahihiwatig na nasa ilalim mismo ng bundok.'
  naturalness: Malinaw, natural, at marangal ang modernong Tagalog. Ang “Kinaumagahan, maaga siyang bumangon” ay maayos na naghahatid ng Hebreong idyoma para sa maagang pagbangon sa umaga. Ang “haliging bato” ay mauunawaan at angkop sa daloy ng pangungusap.
  terminology: Wasto at pare-pareho ang “Yahweh” para sa יהוה. Ang “altar,” “haliging bato,” at “lipi ng Israel” ay mga angkop na katawagang pangkasulatan sa modernong Filipino Tagalog. Hindi pinalalawak ng “para sa” ang bahagyang bukas na ugnayang ipinahihiwatig ng ל sa mga lipi.
