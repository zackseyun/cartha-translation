  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: tl
  text: Isinulat ni Moises ang lahat ng salita ni Yahweh. Kinaumagahan, maaga siyang bumangon at nagtayo ng altar sa paanan ng bundok[a], at ng labindalawang haliging bato[b] para sa labindalawang lipi ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa ilalim ng bundok,” ibig sabihin, sa ibabang bahagi o paanan nito.
    reason: lexical_alternative
  - marker: b
    text: O “labindalawang batong itinayo nang patayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Isinulat
  rationale: Tuwirang ipinapahayag ng כתב ang pagsulat; sapat ang “isinulat” upang ilarawan ang pagtatala ng mga salitang binigkas.
- source_word: דִּבְרֵי
  choice: mga salita
  rationale: Pinananatili nito ang karaniwang kahulugan ng דָּבָר at hindi ito nililimitahan sa mas interpretatibong “mga utos,” kahit kasama sa konteksto ang mga tuntunin ng tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Kinaumagahan, maaga siyang bumangon
  rationale: Likas na Tagalog ito para sa idyomang Hebreo na nangangahulugang bumangon nang maaga, habang malinaw na pinananatili ang pagtukoy sa umaga.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: nagtayo ng altar
  rationale: Ang “nagtayo” ay natural na katumbas ng בנה sa kontekstong ito, at ang “altar” ay malinaw at karaniwang katawagan sa modernong Tagalog.
- source_word: תַּחַת הָהָר
  choice: sa paanan ng bundok
  rationale: Bagaman literal na “sa ilalim ng bundok,” ang parirala ay tumutukoy sa kinaroroonan sa ibabang bahagi o paanan nito.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: labindalawang haliging bato
  rationale: Ang מַצֵּבָה ay isang batong itinayo nang patayo. Ang “haliging bato” ay maikli, natural, at hindi nagdaragdag ng tiyak na gamit na hindi tahasang sinabi sa teksto.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: para sa labindalawang lipi ng Israel
  rationale: Natural na ipinahihiwatig ng “para sa” ang pagtutugma o pagkatawan ng labindalawang bato sa labindalawang lipi nang hindi labis na ipinapaliwanag ang ugnayan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ugnayan ng labindalawang bato sa labindalawang lipi
  choice: para sa labindalawang lipi
  alternative: kumakatawan sa labindalawang lipi
  rationale: Pinananatili ng “para sa” ang lawak ng gamit ng pang-ukol na ל; ang “kumakatawan” ay makatwirang paliwanag ngunit mas tahasang interpretasyon kaysa sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinili ang payak na ayos ng pangungusap at mga salitang madaling maunawaan, habang pinananatili ang Hebreong pagkakasunod-sunod ng mga pangyayari at ang bahagyang di-tiyak na ugnayan ng mga bato sa mga lipi.
