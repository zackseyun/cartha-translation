  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: tl
  text: Ngunit hindi iniunat ng Diyos ang kanyang kamay laban sa mga pinuno ng mga anak ni Israel. Nakita nila ang Diyos[a], at sila'y kumain at uminom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “minasdan nila ang Diyos”—maaaring magpahiwatig ang pandiwa ng matamang pagtingin o pagmamasid.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: laban sa
  rationale: Kasama ng idyomang שָׁלַח יָד, ipinahihiwatig nito ang mapanakit o mapanghatol na pagkilos, kaya likas at tumpak ang “laban sa.”
- source_word: אֲצִילֵי
  choice: mga pinuno
  rationale: Tumutukoy ito sa mga prominenteng kinatawan ng bayan; mas malinaw sa karaniwang modernong Filipino ang “mga pinuno” kaysa “mga maharlika.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pamilyang larawan ng Hebreo habang nananatiling malinaw at marangal sa Filipino.
- source_word: שָׁלַח יָדוֹ
  choice: iniunat ... ang kanyang kamay
  rationale: Pinananatili ang metapora ng Hebreo para sa pagkilos upang manakit o humatol, sa halip na tuwirang ipakahulugang “pinarusahan.”
- source_word: וַיֶּחֱזוּ
  choice: Nakita
  rationale: Ito ang pinakanatural na salin, habang inilalagay sa talababa ang posibleng mas matinding diwang “tinitigan” o “minasdan.”
- source_word: אֶת הָאֱלֹהִים
  choice: ang Diyos
  rationale: Tuwirang pinananatili ang pahayag ng tekstong Hebreo at hindi ito pinahihinang gawing “isang pagpapakita ng Diyos.”
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: at sila'y kumain at uminom
  rationale: Payak at natural na inilalarawan ang magkasunod na kilos gaya ng nasa Hebreo.
theological_decisions:
- issue: Simuno ng “hindi iniunat ... ang kanyang kamay”
  choice: Ginawang tahasang Diyos ang simuno.
  alternative: 'Panatilihing di-binanggit ang simuno: “hindi iniunat laban sa kanila ang kamay.”'
  rationale: Pahiwatig lamang ang simuno sa Hebreo, ngunit Diyos ang pinakamalinaw na tinutukoy sa konteksto. Ang pagtukoy sa kanya ay nag-aalis ng di-likas na kalabuan sa Filipino nang walang idinaragdag na bagong teolohikal na pahayag.
- issue: Paglalarawan sa pakikipagtagpo sa Diyos
  choice: “Nakita nila ang Diyos”
  alternative: “Nakita nila ang pagpapakita ng Diyos” o “Minasdan nila ang Diyos.”
  rationale: Tuwirang sinasabi ng Hebreo na nakita nila ang Diyos. Hindi ito dapat pahinain upang lutasin ang tensiyon sa ibang mga talata tungkol sa pagkakita sa Diyos.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “mga pinuno” para sa malinaw na gamit, ngunit pinanatili ang mas pormal at tekstuwal na “mga anak ni Israel.”
