  source_fidelity: Wasto ang pangunahing pagkilala sa di-pangkaraniwang Hebreong pananalita na ang kausap ay inuutusang umakyat “kay Yahweh,” at wastong pinananatili ang pangmaramihang utos na yumukod. Gayunman, ang “matatandang pinuno” ay nagdaragdag ng ‘pinuno,’ na hindi tahasang nasa זִקְנֵי; ang ‘mga nakatatanda’ ay mas tapat at maaari pa ring tumukoy sa kinikilalang mga elder ng pamayanan.
  naturalness: Likas ang kabuuang ayos at ang paggamit ng mga panandang pantangi. Mas malinaw at mas natural sa modernong Filipino ang “mga nakatatanda ng Israel” kaysa “matatandang pinuno ng Israel,” habang napapanatili ang partitibong “mula sa.”
