  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya kay Moises[a], “Umakyat ka patungo kay Yahweh—ikaw, si Aaron, sina Nadab at Abihu, at pitumpu mula sa mga nakatatanda ng Israel—at yumukod kayo mula sa malayo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Umakyat ka patungo kay Yahweh.” Pinananatili rito ang pananalitang ito kahit si Yahweh ang waring nagsasalita; isinasalin naman ito ng ilan bilang “Umakyat ka patungo sa akin” o “Umakyat ka sa harapan ni Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Pagkatapos, sinabi niya kay Moises
  rationale: Ang panandang וְ ay nag-uugnay sa naunang salaysay, at ang אָמַר ay ikatlong panauhang panlalaki bagaman hindi tahasang pinangalanan ang simuno. Likas sa modernong Tagalog ang ayos na ito at pinananatili ang ‘niya’ ayon sa agarang konteksto.
- source_word: עֲלֵה
  choice: Umakyat ka
  rationale: Ang pautos na עֲלֵה ay tumutukoy sa pag-akyat. Mas tuwiran at likas sa Tagalog ang ‘umakyat ka’ kaysa sa mas pormal na ‘pumanhik ka.’
- source_word: אֶל יְהוָה
  choice: patungo kay Yahweh
  rationale: Ang אֶל ay nagsasaad ng direksiyon o paglapit. Pinananatili ang tahasang banal na pangalang יהוה bilang ‘Yahweh’ at hindi pinapalitan ng ‘sa akin,’ upang huwag ayusin ang di-karaniwang pananalita ng Hebreo.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: ikaw, si Aaron, sina Nadab at Abihu
  rationale: Pinananatili ng ‘ikaw’ ang tahasang panghalip na nagbubukas sa talaan. Ginamit ang karaniwang mga panandang pantangi sa Tagalog para sa malinaw at natural na koordinasyon ng mga pangalan.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: at pitumpu mula sa matatandang pinuno ng Israel
  rationale: 'Ang מִן ay partitibo: pitumpung tao mula sa mas malaking pangkat ng mga זְקֵנִים. Ang ‘matatandang pinuno’ ay naghahatid kapwa ng katandaan at tungkuling pampamayanan, samantalang pinananatili ng ‘mula sa’ ang partitibong diwa.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: at yumukod kayo
  rationale: Ang pandiwa ay nagsasaad ng pagyukod o pagpapatirapa bilang paggalang. Ang ‘yumukod’ ay nagpapanatili sa pisikal na kilos nang hindi agad nililimitahan ang kahulugan sa abstraktong ‘sumamba.’
- source_word: מֵ/רָחֹק
  choice: mula sa malayo
  rationale: Malinaw nitong ipinahahayag ang pisikal na distansiya habang lumalapit sila sa banal na presensiya, at likas ito sa modernong Tagalog.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang ‘Yahweh’ ay nagpapanatili rito bilang sariling pangalan sa halip na palitan ng titulo.
- issue: Ang di-karaniwang ‘umakyat patungo kay Yahweh’ bagaman si Yahweh ang waring nagsasalita
  choice: Pinanatili sa pangunahing teksto ang ‘patungo kay Yahweh’
  alternative: Umakyat ka patungo sa akin; umakyat ka sa harapan ni Yahweh
  rationale: Eksaktong binabanggit ng Hebreo ang paglapit אֶל־יְהוָה. Ang pagpapalit nito sa ‘sa akin’ ay tahimik na lulutas sa tensiyong hindi nilulutas ng pinagmulang teksto, kaya pinanatili ang anyo at ipinaliwanag sa talababa.
- issue: Kahulugan ng הִשְׁתַּחֲוָה
  choice: yumukod
  alternative: sumamba; magpatirapa
  rationale: Maaaring taglayin ng kilos ang diwang pagsamba, ngunit ang salitang Hebreo ay tahasang naglalarawan rin ng pisikal na pagyukod. Pinananatili ng salin ang konkretong kilos at ang posibleng teolohikal na bigat nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘matatandang pinuno’ para sa זִקְנֵי upang maiwasan ang impresyong edad lamang ang tinutukoy, at ‘yumukod’ upang mapanatili ang konkretong kilos. Ang gitling na mahaba ay tumutulong na malinaw na ihiwalay ang talaan ng mga inuutusang umakyat.
