translation:
  language: tl
  text: Pagkatapos, kunin mo ang langis na pampahid at ibuhos mo ito sa kanyang ulo, at pahiran mo siya ng langis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pagkatapos, kunin mo
  rationale: Ang waw na kasama ng pandiwa ay nagpapatuloy sa sunod-sunod na tagubilin. Likas sa makabagong Tagalog ang “Pagkatapos,” at pinananatili ng pautos na “kunin mo” ang direktang tono ng ritwal na utos.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: ang langis na pamahid
  rationale: Ang pariralang konstrukto ay tumutukoy sa langis na ginagamit sa ritwal na pagpapahid. Ang “langis na pamahid” ay malinaw at likas sa Tagalog, at hindi nito ginagawang abstrakto ang espesipikong langis.
- source_word: וְיָצַקְתָּ
  choice: ibuhos mo
  rationale: Karaniwang kahulugan ng יצק ang pagbuhos. Ang “ibuhos mo” ay tuwirang nagsasaad ng pisikal na kilos at angkop sa kasunod na layong “iyon.”
- source_word: עַל רֹאשׁוֹ
  choice: sa kanyang ulo
  rationale: Tuwiran at natural na katumbas ng preposisyunal na parirala; ang “sa” ang karaniwang gamit sa Tagalog para sa pagbuhos ng isang bagay sa ibabaw ng ulo.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: at pahiran mo siya
  rationale: Ang משׁח ay ritwal na pagpapahid. Pinananatili ng “pahiran” ang mismong kilos sa halip na ipaliwanag lamang ito bilang pagtatalaga o pagbubukod.
theological_decisions:
- issue: Pagkakasunod ng pagbuhos at pagpapahid sa ritwal
  choice: 'Panatilihing magkahiwalay ang dalawang kilos: “ibuhos mo iyon sa kanyang ulo, at pahiran mo siya.”'
  alternative: Pagsamahin bilang “pahiran mo siya sa pamamagitan ng pagbuhos nito sa kanyang ulo.”
  rationale: Dalawang magkaugnay ngunit magkahiwalay na pandiwa ang nasa Hebreo. Ang pagpapanatili sa dalawa ay hindi nagpapasya kung ang ikalawa ay karagdagang pisikal na kilos o ang ritwal na kabuluhan ng una.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang pautos na “kunin mo / ibuhos mo / pahiran mo” upang likas na maipahayag ang Hebreong procedural directive nang hindi nagiging arkaiko.
