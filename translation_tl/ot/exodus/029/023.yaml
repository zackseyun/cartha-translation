id: EXO.29.23
reference: Exodus 29:23
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: tl
  text: at isang bilog na tinapay, isang tinapay na may langis, at isang manipis na tinapay, mula sa basket ng mga tinapay na walang pampaalsa na nasa harap ni Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring isatitik na “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: bilog na tinapay
  rationale: Ang כִּכָּר ay tumutukoy sa isang bilog na tinapay o hugis-bilog na pagkaing inihurno. Pinananatili ng salin ang hugis at naibubukod ito sa kasunod na חַלָּה.
- source_word: אַחַת / אֶחָד
  choice: isang
  rationale: Inuulit ang bilang para sa bawat bagay upang mapanatili ang eksaktong detalye ng ritwal.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: isang tinapay na may langis
  rationale: Ang חַלָּה ay isang tinapay o keyk na inihurno; ang pariralang שֶׁמֶן ay nagsasaad ng langis. Ang “may langis” ay malapit sa anyo ng Hebreo at hindi nagpapasya kung ang langis ay inihalo o ipinahid.
- source_word: רָקִיק
  choice: manipis na tinapay
  rationale: Tumutukoy ang רָקִיק sa manipis at patag na pagkaing inihurno. Mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa hiram na “ostiya” o “wafer,” na maaaring magdala ng ibang kaugnay na kahulugan.
- source_word: מִסַּל הַמַּצּוֹת
  choice: mula sa basket ng mga tinapay na walang pampaalsa
  rationale: Tuwirang ipinahahayag ng מִן ang pinagmulan, ng סַל ang basket, at ng מַצּוֹת ang mga tinapay na walang pampaalsa.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: na nasa harap ni Yahweh
  rationale: Pinananatili ng “nasa harap” ang literal at panritwal na diwa ng לִפְנֵי bilang nasa harapan o presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Banal na pangalan mismo ang nasa tekstong Hebreo. Ang “Yahweh” ay malawak na kinikilalang pagsasatitik, habang inilalagay sa talababa ang tradisyonal na anyong “Jehovah.”
- issue: Kung paano nauugnay ang langis sa חַלַּת לֶחֶם שֶׁמֶן
  choice: tinapay na may langis
  alternative: tinapay na hinaluan ng langis
  rationale: Hindi tahasang tinutukoy ng maikling pariralang Hebreo kung inihalo o ipinahid ang langis, kaya pinananatili ng “may langis” ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pampaalsa” bilang karaniwang terminong madaling maunawaan, at iniiwasan ang mga salitang maaaring magpahiwatig ng partikular na tradisyong denominasyonal.
