    issue: Hindi naulit ang “kasama niya” sa huling sugnay.
    rationale: Nasa Hebreo ang אִתּוֹ pagkatapos ng “mga kasuotan ng kanyang mga anak” sa parehong unang listahan at sa resultang pahayag. Ang pag-alis nito sa ikalawang paglitaw ay nagbabawas ng isang elemento ng teksto.
  - severity: medium
    issue: “Mga anak” ang salin ng בָּנָיו.
    rationale: Ang בָּנָיו ay panlalaking maramihan at, sa agarang konteksto, tumutukoy sa mga anak na lalaki ni Aaron na naglilingkod bilang mga pari. Ang “mga anak na lalaki” ang mas tumpak nang hindi nagdaragdag ng interpretasyon.
  - severity: low
    issue: Hindi ganap na idiomatiko ang “iwisik mo ang mga ito kay Aaron.”
    rationale: Ang pandiwang “wisikan” ang likas na Tagalog kapag ang taong tatanggap ng wiwinisikan ay binabanggit.
