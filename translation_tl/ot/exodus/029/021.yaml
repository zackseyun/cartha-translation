  to: Pagkatapos, kumuha ka ng kaunting dugo na nasa altar at kaunti sa langis na pampahid, at wisikan mo ng mga ito si Aaron, ang kanyang mga kasuotan, ang kanyang mga anak na lalaki, at ang mga kasuotan ng kanyang mga anak na lalaki, kasama niya. Sa gayon, magiging banal[a] siya at ang kanyang mga kasuotan, pati ang kanyang mga anak na lalaki at ang mga kasuotan ng kanyang mga anak na lalaki, kasama niya.
