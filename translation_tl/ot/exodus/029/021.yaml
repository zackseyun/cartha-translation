  source_fidelity: 'Kailangang itama ang saklaw ng אִתּוֹ (“kasama niya”): lumilitaw ito sa parehong talaan ng mga tatanggap at sa talaan ng mga magiging banal. Hindi ito dapat alisin sa huling sugnay. Mas tumpak din ang “mga anak na lalaki” para sa בָּנָיו sa kontekstong ito.'
  naturalness: Ang “iwisik mo ang mga ito kay Aaron” ay hindi gaanong likas para sa pagwiwisik sa isang tao. Mas natural ang “wisikan mo ng mga ito si Aaron.” Ang “langis na pampahid” ay mas idiomatiko kaysa “langis na pamahid.”
  terminology: Pinananatili ang “altar,” “langis na pampahid,” “kasuotan,” at “banal.” Ang “magiging banal” ay wastong tuwirang salin ng וְקָדַשׁ; ang talababa ay nananatiling lehitimong alternatibong pagpapakahulugan.
  issues:
