  text: וְ/לָקַחְתָּ֞ מִן הַ/דָּ֨ם אֲשֶׁ֥ר עַֽל הַ/מִּזְבֵּחַ֮ וּ/מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָה֒ וְ/הִזֵּיתָ֤ עַֽל אַהֲרֹן֙ וְ/עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וְ/קָדַ֥שׁ הוּא֙ וּ/בְגָדָ֔י/ו וּ/בָנָ֛י/ו וּ/בִגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: tl
  text: Pagkatapos, kumuha ka ng kaunting dugo na nasa altar at kaunti sa langis na pampahid, at wisikan mo ng mga ito si Aaron, ang kanyang mga kasuotan, ang kanyang mga anak na lalaki, at ang mga kasuotan ng kanyang mga anak na lalaki, kasama niya. Sa gayon, magiging banal[a] siya at ang kanyang mga kasuotan, pati ang kanyang mga anak na lalaki at ang mga kasuotan ng kanyang mga anak na lalaki, kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “itatalaga bilang banal.” Literal sa Hebreo, “magiging banal,” na tumutukoy sa banal na katayuang bunga ng ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: kumuha ka
  rationale: Ang Qal perfect na may prefixed conjunction sa sunod-sunod na tagubiling ritwal ay may puwersang pautos. Likas sa modernong Tagalog ang anyong pautos na “kumuha ka.”
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: ng kaunting dugo na nasa altar
  rationale: Ang מִן ay nagpapahiwatig na bahagi lamang ng dugo ang kukunin; malinaw itong naipahahayag ng “kaunting dugo.” Pinananatili ng “na nasa altar” ang relative clause.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Tumutukoy ang construct phrase sa langis na ginagamit sa ritwal na pagpapahid. Ang “langis na pamahid” ay natural at madaling maunawaan sa Tagalog.
- source_word: הִזֵּיתָ
  choice: iwisik mo
  rationale: Sa kontekstong pangritwal, ang Hiphil ng נזה ay tumutukoy sa pagwiwisik ng likido.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: kanyang mga kasuotan / mga kasuotan ng kanyang mga anak
  rationale: Pangkalahatang salita ang בגד para sa damit o kasuotan. Ang “kasuotan” ay marangal at angkop sa kontekstong pangpari nang hindi nag-aangkat ng mas huling terminolohiyang pansimbahan.
- source_word: בָּנָיו
  choice: kanyang mga anak
  rationale: Bagaman tumutukoy ang Hebreo sa mga anak na lalaki ni Aaron sa konteksto, natural sa Tagalog ang “mga anak”; malinaw mula sa salaysay na ang tinutukoy ay ang mga anak ni Aaron na kasamang itinalaga bilang mga pari.
- source_word: אִתּוֹ
  choice: na kasama niya
  rationale: Direktang ipinahahayag nito ang ugnayan ng mga anak kay Aaron sa ritwal. Sa ikalawang paglitaw, hindi na ito inuulit upang maiwasan ang mabigat at malabong Tagalog, ngunit nananatili ang saklaw sa buong pangkat.
- source_word: וְקָדַשׁ
  choice: magiging banal
  rationale: Ipinahahayag ng pandiwa ang kalagayang bunga ng ritwal. Pinananatili ng “magiging banal” ang mismong kategoryang קדשׁ at ang resultang katayuan, sa halip na palitan ito ng mas teknikal na termino.
- source_word: הוּא
  choice: siya
  rationale: Malinaw na si Aaron ang tinutukoy ng panghalip, kaya pinananatili ang pronominal na anyo ng Hebreo.
theological_decisions:
- issue: Paglalarawan sa resultang kalagayan matapos ang pagwiwisik
  choice: magiging banal
  alternative: itatalaga bilang banal
  rationale: Ang “magiging banal” ay pinakamalapit sa tahasang pahayag ng Hebreo at pinananatili ang teolohikal na kategorya ng kabanalan. Ang alternatibo ay posibleng pagpapaliwanag sa ritwal na konsagrasyon ngunit mas interpretatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang tuwirang pautos para sa tagubiling ritwal. Inayos nang bahagya ang magkakaugnay na parirala upang maging natural at malinaw sa Tagalog, habang pinananatili ang lahat ng kalahok at ang resultang kabanalan.
