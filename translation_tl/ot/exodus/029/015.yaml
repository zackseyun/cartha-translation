  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang isang lalaking tupa[a], at ipapatong ni Aaron at ng kanyang mga anak na lalaki ang kanilang mga kamay sa ulo ng lalaking tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “ang isang lalaking tupa,” upang ipagkaiba ito sa isa pang lalaking tupa sa ritwal ng pagtatalaga; isinasalin naman ito ng ilan na “ang unang lalaking tupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Pagkatapos
  rationale: Ipinakikilala ng pang-ugnay at pananda ng layon ang kasunod na hakbang sa ritwal; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod ng mga tagubilin.
- source_word: הָ/אַיִל
  choice: ang lalaking tupa
  rationale: Ang אַיִל ay isang adultong lalaking tupa. Mas madaling maunawaan sa pangkalahatang Filipino ang “lalaking tupa” kaysa sa hiram na terminong “barakong tupa.”
- source_word: הָ/אֶחָד
  choice: ang isang
  rationale: Pinananatili nito ang literal na diwang “ang isang lalaking tupa,” na ipinagkaiba sa isa pang lalaking tupa sa ritwal, nang hindi agad binibigyang-kahulugang ordinal na “una.”
- source_word: תִּקָּח
  choice: kunin mo
  rationale: Ang pandiwa ay ikalawang panauhang panlalaking isahan at ginagamit bilang tuwirang tagubilin kay Moises; natural sa Filipino ang pautos na “kunin mo.”
- source_word: וְ/סָמְכוּ
  choice: ipapatong
  rationale: Sa kontekstong paghahandog, tumutukoy ang סמך sa ritwal na pagpapatong o pagdiin ng mga kamay sa hayop. Ang “ipapatong” ay malinaw at hindi nagdaragdag ng teolohikal na paliwanag.
- source_word: אַהֲרֹן וּ/בָנָיו
  choice: ni Aaron at ng kanyang mga anak
  rationale: Ang בנים ay tumutukoy sa mga anak na lalaki ni Aaron na itinatalaga bilang mga pari. Sa kontekstong ito, malinaw ang referent kahit gamitin ang likas na Filipino na “mga anak.”
- source_word: אֶת יְדֵיהֶם
  choice: ang kanilang mga kamay
  rationale: Pinananatili ang maramihang “mga kamay” ng Hebreo at ang sama-samang ritwal na kilos.
- source_word: עַל רֹאשׁ
  choice: sa ulo ng
  rationale: Tuwirang lokatibong katumbas ito na natural sa modernong Filipino.
- source_word: הָ/אָיִל
  choice: lalaking tupa
  rationale: Inuulit ang pangngalan gaya sa Hebreo upang manatiling malinaw kung saang hayop ipapatong ang mga kamay.
theological_decisions:
- issue: Kahulugan ng ritwal na pagpapatong ng mga kamay sa paghahandog
  choice: ipapatong ... ang kanilang mga kamay sa ulo ng lalaking tupa
  alternative: idiin ... ang kanilang mga kamay sa ulo ng lalaking tupa
  rationale: Maaaring magpahiwatig ang pandiwang Hebreo ng pagsandig o pagdiin, ngunit sa batas tungkol sa paghahandog ay inilalarawan nito ang kinikilalang ritwal na pagpapatong ng mga kamay. Hindi ipinapaliwanag ng salin kung ano ang teolohikal na bisa ng kilos, sapagkat hindi iyon tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong ritwal. Ginamit ang tuwirang pautos na “kunin mo” para sa tagubilin kay Moises at iniwasan ang hindi pangkaraniwang bokabularyo. Ang “isang” ay sadyang pinanatili sa halip na “unang” upang mapangalagaan ang tunay na anyo at bahagyang ambiguwidad ng Hebreo.
