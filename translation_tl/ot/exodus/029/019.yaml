  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang ikalawang lalaking tupa, at ipapatong ni Aaron at ng kanyang mga anak na lalaki ang kanilang mga kamay sa ulo ng tupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pagkatapos, kunin mo
  rationale: Ang Qal perfect na may prefixed conjunction ay nagpapatuloy sa serye ng mga tagubilin at may puwersang pautos. Likas sa modernong Tagalog ang “Pagkatapos” para sa pagkakasunod-sunod at “kunin mo” para sa tuwirang utos kay Moises.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: ang ikalawang lalaking tupa
  rationale: Ang אַיִל ay lalaking tupa, at ang הַשֵּׁנִי ay tiyak na ordinal na “ikalawa,” hindi lamang “isa pang” tupa.
- source_word: וְסָמַךְ
  choice: ipapatong
  rationale: Sa konteksto ng paghahandog, ang סמך ay tumutukoy sa ritwal na pagpapatong o pagdidiin ng kamay sa hayop. Malinaw at likas ang “ipapatong” nang hindi nagdaragdag ng paliwanag sa kahulugan ng ritwal.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ni Aaron at ng kanyang mga anak na lalaki
  rationale: Ang בָּנִים dito ay ang mga lalaking anak ni Aaron na itinatalaga bilang mga pari; pinananatili ng “mga anak na lalaki” ang kasarian at kontekstuwal na katiyakan.
- source_word: אֶת יְדֵיהֶם
  choice: ang kanilang mga kamay
  rationale: Maramihan ang anyong Hebreo at ang paksa, kaya pinananatili ang “mga kamay.”
- source_word: עַל רֹאשׁ הָאָיִל
  choice: sa ulo ng tupa
  rationale: Tuwirang inilalarawan nito ang lokasyon ng mga kamay. Sapat at natural sa Tagalog ang “sa ulo,” habang malinaw sa naunang parirala na lalaking tupa ang tinutukoy.
theological_decisions:
- issue: Paglalarawan sa ritwal ng pagpapatong ng mga kamay nang hindi nagdaragdag ng teolohikal na paliwanag
  choice: ipapatong ... ang kanilang mga kamay sa ulo ng tupa
  alternative: idiin ... ang kanilang mga kamay sa ulo ng tupa
  rationale: Inilalarawan lamang ng talata ang konkretong ritwal. Hindi ipinapasok sa salin ang anumang paliwanag tungkol sa paglilipat ng kasalanan, pakikiisa, o ordinasyon na hindi tahasang sinasabi rito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang pautos na “kunin mo” para kay Moises at ang natural na anyong “ipapatong ... ang kanilang mga kamay” para sa ritwal na kilos. Walang footnote dahil walang kailangang ipaliwanag na tekstuwal na variant o mahalagang di-mapapanatiling ambiguity.
