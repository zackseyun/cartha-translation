base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: tl
  text: Bigkisan mo ng mga pamigkis si Aaron at ang kanyang mga anak, at itali mo sa kanilang ulo ang mga takip sa ulo. Ang pagkapari ay mapapasakanila bilang isang tuntuning panghabang-panahon. Sa gayon, italaga mo si Aaron at ang kanyang mga anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na salin, “punuin mo ang kamay ni Aaron at ang kamay ng kanyang mga anak”—isang idyomang Hebreo para sa pagtatalaga o pagluklok sa kanila sa paglilingkod bilang mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: Bigkisan ... ng mga pamigkis
  rationale: Ang חגר kasama ng אַבְנֵט ay tumutukoy sa pagsusuot at paghihigpit ng pamigkis. Likas at marangal sa Filipino ang “bigkisan ... ng mga pamigkis,” at malinaw nitong pinananatili ang kilos ng pananamit.
- source_word: אַהֲרֹן וּבָנָיו
  choice: si Aaron at ang kanyang mga anak
  rationale: Ang pariralang ito ang tuwirang nagpapakilala sa tinutukoy ng naunang panghalip sa Hebreo. Mas natural sa Filipino na tahasang pangalanan sila kaysa ulitin ang “sila.”
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: itali mo sa kanilang ulo ang mga pantakip sa ulo
  rationale: Ang חבשׁ ay may diwang pagtatali o pagbabalot sa ulo, at ang מִגְבָּעוֹת ay mga pantakip sa ulo ng mga pari na naiiba sa turbante ng punong pari. Pinananatili ng salin ang kilos at ang mas pangkalahatang katawagan sa kasuotan.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Ang pagkapari ay mapapasakanila
  rationale: Ipinahahayag ng לָהֶם ang pagkakaloob o pag-aari ng tungkuling makapari. Ang “mapapasakanila” ay maikli, dignificado, at hindi nagdaragdag ng paliwanag na wala sa teksto.
- source_word: לְחֻקַּת עוֹלָם
  choice: bilang isang tuntuning panghabang-panahon
  rationale: Ang חֻקָּה ay isang itinakdang tuntunin, samantalang ang עוֹלָם sa kontekstong legal at pangkulto ay nagpapahiwatig ng patuloy at namamalaging bisa. Ang “panghabang-panahon” ay karaniwang saling Filipino na nagpapanatili sa lawak ng salita nang hindi nilulutas ang mga susunod na tanong na teolohikal.
- source_word: וּמִלֵּאתָ יַד
  choice: italaga
  rationale: Ang literal na “punuin ang kamay” ay isang teknikal na idyomang Hebreo para sa pagtatalaga o pagluklok sa paglilingkod bilang pari. Malinaw sa modernong Filipino ang “italaga,” habang inilalahad sa talababa ang literal na anyo ng idyoma.
theological_decisions:
- issue: Saklaw ng tagal sa לְחֻקַּת עוֹלָם
  choice: bilang isang tuntuning panghabang-panahon
  alternative: bilang isang walang-hanggang tuntunin; bilang isang palagiang tuntunin
  rationale: Pinananatili ng “panghabang-panahon” ang matibay at patuloy na bisa ng tuntunin sa tipang kaayusan ng Israel, ngunit hindi tahasang nagpapasiya kung paano ito iuugnay sa mga sumunod na yugto ng kasaysayan ng pagtubos.
- issue: Idyoma ng pagtatalaga sa וּמִלֵּאתָ יַד
  choice: italaga mo si Aaron at ang kanyang mga anak
  alternative: punuin mo ang kamay ni Aaron at ang kamay ng kanyang mga anak; iluklok mo si Aaron at ang kanyang mga anak
  rationale: Ang “italaga” ang malinaw na katumbas ng tungkuling ipinahihiwatig ng teknikal na idyoma. Pinananatili sa talababa ang literal na larawan upang maging malinaw at masusuri ang batayang Hebreo.
translation_notes:
  register: Modernong Filipino na may dignidad at angkop sa tekstong legal at pangkulto. Ginamit ang “pamigkis,” “pagkapari,” at “tuntuning panghabang-panahon” bilang malinaw ngunit hindi kolokyal na mga katawagan. Iniwasan ang katawagang maaaring magpahiwatig ng natatanging ritwal ng isang denominasyon.
