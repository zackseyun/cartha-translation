base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: tl
  text: Ito ay magiging para kay Aaron at sa kanyang mga anak bilang permanenteng karapatan mula sa mga Israelita, sapagkat ito ay handog na ibinukod. Magiging handog na ibinukod ito mula sa mga Israelita, mula sa mga hain ng kanilang mga handog pangkapayapaan[a]—ang handog na ibinukod nila para sa PANGINOON.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga handog ng pakikisama” o “mga handog para sa mabuting kalagayan.” Ang salitang Hebreo ay may kaugnayan sa kapayapaan, kabuuan, at mabuting kalagayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ito ay mapupunta
  rationale: Bagaman literal na “at ito ay magiging,” ipinahihiwatig ng konteksto ang paglalaan ng bahaging ito kay Aaron at sa kanyang mga anak. Likas sa modernong Tagalog ang “mapupunta” para sa legal na pag-aari o takdang bahagi.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: kay Aaron at sa kanyang mga anak
  rationale: Ipinapahayag ng לְ ang pinaglalaanan o nagmamay-ari ng bahaging tinutukoy.
- source_word: לְחָק עוֹלָם
  choice: bilang palagiang takda
  rationale: Ang חָק ay kautusan o takdang karapatan, at sa kontekstong pangkulto ang עוֹלָם ay tumutukoy sa patuloy o permanenteng bisa, hindi kinakailangang pilosopikal na kawalang-hanggan.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga Israelita
  rationale: Natural at malinaw na katumbas ito ng “mga anak ni Israel” bilang tawag sa sambayanan.
- source_word: תְרוּמָה
  choice: bahaging handog
  rationale: Tumutukoy ang salita sa isang bahaging ibinukod at iniharap sa Diyos. Iniiwasan ng “bahaging handog” ang makitid na modernong kahulugan ng “abuloy” at ang lipas o labis na teknikal na “handog na itinaas.”
- source_word: וּתְרוּמָה יִהְיֶה
  choice: Magiging bahaging handog ito
  rationale: Pinananatili ang sadyang pag-uulit ng terminong pangkulto sa tekstong Hebreo.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: mula sa mga hain ng kanilang mga handog pangkapayapaan
  rationale: Pinananatili ang ugnayang konstrukto ng זֶבַח at שְׁלָמִים at ang kinikilalang katawagang pangkulto, habang inilalagay sa talababa ang mas malawak na saklaw ng kahulugan.
- source_word: תְּרוּמָתָם
  choice: ang kanilang bahaging handog
  rationale: Pinananatili ang pag-uulit ng תְרוּמָה at ang hulaping nagsasaad na ito ang handog na nagmumula sa mga Israelita.
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ang banal na pangalang YHWH ay isinalin bilang “PANGINOON,” ayon sa nakaugaliang magalang na tradisyon; ang pang-ukol ay nagpapakita kung kanino inihahandog ang bahagi.
theological_decisions:
- issue: Paglalarawan sa שְׁלָמִים
  choice: mga handog pangkapayapaan
  alternative: mga handog para sa pakikipagkaisa; mga handog para sa mabuting kalagayan
  rationale: Maaaring tumukoy ang terminong Hebreo sa kapayapaan, kabuuan o mabuting kalagayan, at naibalik na ugnayan. Pinananatili sa teksto ang kinikilalang katawagang “handog pangkapayapaan,” ngunit hindi itinatago sa talababa ang mas malawak nitong kahulugan.
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: PANGINOON
  alternative: Yahweh; Jehovah
  rationale: Ginagamit ang tradisyonal na pamalit na “PANGINOON” bilang paggalang sa banal na pangalan at bilang malinaw na pantukoy sa YHWH.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang legal at pangkultong himig, pati ang pag-uulit ng “bahaging handog,” nang hindi gumagamit ng lipas o denominasyonal na teknikal na pananalita.
