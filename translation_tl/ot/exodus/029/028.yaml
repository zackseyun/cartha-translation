revisions:
- from: Ito ay mapupunta kay Aaron at sa kanyang mga anak bilang palagiang takda mula sa mga Israelita, sapagkat ito ay bahaging handog. Magiging bahaging handog ito mula sa mga Israelita, mula sa mga hain ng kanilang mga handog pangkapayapaan[a]—ang kanilang bahaging handog sa PANGINOON.
  to: Ito ay magiging para kay Aaron at sa kanyang mga anak bilang permanenteng karapatan mula sa mga Israelita, sapagkat ito ay handog na ibinukod. Magiging handog na ibinukod ito mula sa mga Israelita, mula sa mga hain ng kanilang mga handog pangkapayapaan[a]—ang handog na ibinukod nila para sa PANGINOON.
  rationale: Nilinaw ang legal-kultikong kahulugan ng לְחָק עוֹלָם bilang permanenteng karapatan, at ginawang mas natural ang katumbas ng תְּרוּמָה habang pinananatili ang pag-uulit nito sa Hebreo. Iningatan ang ugnayang “mula sa mga hain ng kanilang mga handog pangkapayapaan” at ang pangwakas na pagtukoy na ang handog ay para sa PANGINOON. Pinagaan din ang talababa upang magbigay ng leksikal na alternatibo nang hindi nagdaragdag ng interpretasyong hindi tahasang nasa salita.
