  terminology: Pinananatili ang “mga handog pangkapayapaan” para sa שְׁלָמִים at ang “PANGINOON” para sa יהוה. Isinasalin ang תְּרוּמָה nang pare-pareho bilang “handog na ibinukod,” na nagpapahayag na ito ay isang bahaging inilaan/presentado nang hindi gumagamit ng lipas na teknikal na termino.
