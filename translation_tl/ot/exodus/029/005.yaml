translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang anyo ng tagubilin (“kunin mo,” “bihisan mo,” “ikabit mo”), na natural sa Tagalog at tumutugma sa procedural na pagkakasunod-sunod ng Hebreo. Pinanatili ang mga teknikal na terminong “efod” at “pektoral,” na may maiikling paliwanag sa talababa.
