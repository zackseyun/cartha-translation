  source_fidelity: Tumpak ang pagkakasunod ng mga kasuotang isinusuot kay Aaron at wasto ang pag-iingat sa mga teknikal na terminong "efod" at "pektoral." Gayunman, ang "nang mahigpit" ay nagdaragdag ng antas ng higpit na hindi tahasang nasa bihirang pandiwang אפד. Mas mabuting panatilihin ang mas malawak na diwang pagkakabit/pagbibigkis. Ang חֵשֶׁב ay tumutukoy sa masining na pagkakayari ng pamigkis; dapat itong maipahayag sa salin.
  naturalness: Natural at angkop sa makabagong Filipino ang mga utos na "kunin mo," "bihisan mo," at "ikabit mo." Mas malinaw ang buong pariralang "masining na hinabing pamigkis ng efod" kaysa sa panghalip na "nito," lalo na sa pangungusap na may ilang magkakasunod na kasuotan.
  terminology: Ang "tunika," "balabal," "efod," at "pektoral" ay angkop sa marangal ngunit modernong rehistro. Pinananatili ng "pektoral" ang diwang kagamitang pandibdib nang hindi nagmumungkahing baluting pandigma.
