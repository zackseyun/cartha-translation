base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang mga kasuotan at bihisan mo si Aaron ng tunika, ng balabal ng efod[a], ng efod, at ng pektoral[b]. Ikabit mo sa kanya ang efod gamit ang masining na hinabing pamigkis ng efod.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang efod ay isang natatanging kasuotang saserdotal; walang eksaktong katumbas sa Tagalog ang salitang Hebreo.
    reason: lexical_explanation
  - marker: b
    text: Tradisyonal ding isinasalin itong “baluti sa dibdib,” ngunit mas malawak ang kahulugan ng salitang Hebreo at hindi nito kinakailangang ipahiwatig ang baluting pandigma.
    reason: lexical_alternative
  - marker: c
    text: Bihira ang pandiwang Hebreo rito. Maaari rin itong isalin na “ibigkis mo ito sa kanya gamit ang masining na hinabing pamigkis ng efod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: Pagkatapos, kunin mo ang mga kasuotan
  rationale: Ang waw na kasama ng pandiwang nasa sunod-sunod na tagubilin ay likas na isinalin bilang “Pagkatapos.” Ang “mga kasuotan” ay dignified at hindi nag-aangkat ng mas huling terminolohiyang pansimbahan.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: at bihisan mo si Aaron
  rationale: Ipinapahayag ng “bihisan” ang causative na diwa ng Hiphil ng לבש at natural ito sa makabagong Tagalog.
- source_word: הַכֻּתֹּנֶת
  choice: tunika
  rationale: Karaniwang katawagang Filipino ito para sa pangunahing mahabang kasuotang isinusuot malapit sa katawan at angkop sa kontekstong saserdotal.
- source_word: מְעִיל הָאֵפֹד
  choice: balabal ng efod
  rationale: Pinananatili nito ang ugnayang construct sa Hebreo nang hindi ipinapalagay nang tahasan kung eksaktong paano isinusuot ang balabal kaugnay ng efod.
- source_word: הָאֵפֹד
  choice: efod
  rationale: Teknikal na katawagang Hebreo ito para sa natatanging kasuotang saserdotal at walang ganap na katumbas sa Tagalog, kaya transliterasyon ang pinakamalinaw na pagpili.
- source_word: הַחֹשֶׁן
  choice: pektoral
  rationale: Tumutukoy ito sa natatanging kagamitang isinusuot sa dibdib. Mas angkop ang “pektoral” kaysa “baluti sa dibdib,” na maaaring magpahiwatig ng kagamitang pandigma.
- source_word: וְאָפַדְתָּ לוֹ
  choice: Ikabit mo nang mahigpit sa kanya ang efod
  rationale: Bihira ang pandiwang אפד at may diwang pagkakabit o pagbibigkis ng efod. Ginawang tahas ang ipinahihiwatig na layon upang maging malinaw sa Tagalog, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: gamit ang hinabing pamigkis nito
  rationale: Sa kontekstong ito, ang חֵשֶׁב ay kongkretong hinabi o masining na pamigkis na kaugnay ng efod. Ang “nito” ay malinaw na tumutukoy sa efod at umiiwas sa mabigat na pag-uulit.
