base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: tl
  text: At susunugin mo sa altar ang buong lalaking tupa. Ito ay handog na sinusunog para kay Yahweh, isang kalugod-lugod na samyo[a], isang handog na inihandog sa pamamagitan ng apoy para kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “samyo na nagbibigay-ginhawa.” Isa itong nakapirming pormula sa paghahandog na tumutukoy sa handog na katanggap-tanggap kay Yahweh.
    reason: lexical_alternative
  - marker: b
    text: O “pagkaing handog.” Hindi tiyak ang eksaktong kahulugan ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: At susunugin mo
  rationale: Ang Hiphil ng קטר sa kontekstong paghahandog ay tumutukoy sa pagpapausok ng handog sa altar. Likas sa modernong Filipino ang “susunugin,” at malinaw sa konteksto ang ritwal na kahulugan.
- source_word: כָּל הָאַיִל
  choice: ang buong lalaking tupa
  rationale: Binibigyang-diin ng כָּל na ang buong hayop ang ihahandog. Ang אַיִל ay lalaking tupa, hindi karaniwang tupa o kordero.
- source_word: הַמִּזְבֵּחָה
  choice: sa ibabaw ng altar
  rationale: Bagaman may patungong hulapi ang anyo, ang diwa sa konteksto ay ilagay at sunugin ang handog sa altar; nililinaw ng “sa ibabaw ng altar” ang lokasyon.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang malinaw at nakaugaliang katawagan sa handog na lubos na sinusunog; iniiwasan nitong gawing pangunahing kahulugan ang etimolohikal na ideya ng pag-akyat.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pag-aalay o pagtatalaga ng handog kay Yahweh.
- source_word: רֵיחַ נִיחוֹחַ
  choice: isang kalugod-lugod na samyo
  rationale: Ang nakapirming pormulang pansakripisyo ay nagsasaad ng handog na kalugod-lugod at katanggap-tanggap sa Diyos. Natural at marangal sa Filipino ang “kalugod-lugod na samyo.”
- source_word: אִשֶּׁה
  choice: isang handog na pinaraan sa apoy
  rationale: Malamang na tumutukoy ito sa handog na inihahandog sa pamamagitan ng apoy. Pinananatili ng salin ang kaugnayan nito sa apoy nang hindi ipinapalagay ang mas tiyak ngunit pinagtatalunang kahulugang “pagkaing handog.”
- source_word: הוּא
  choice: Ito ay
  rationale: Gumaganap ang panghalip bilang pang-ugnay sa pagkilala sa lalaking tupa bilang handog na sinusunog; natural dito ang “Ito ay.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan at hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng רֵיחַ נִיחוֹחַ
  choice: kalugod-lugod na samyo
  alternative: samyo na nagbibigay-ginhawa
  rationale: Ipinahahayag ng pormula na katanggap-tanggap sa Diyos ang handog, nang hindi ipinahihiwatig na kailangang payapain o literal na ginhawahan ang Diyos.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: pagkaing handog
  rationale: May pagtatalo kung dapat idiin ang paraang apoy o ang konsepto ng handog na pagkain. Pinipili ng pangunahing teksto ang mas tuwirang kaugnayan sa apoy at inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lalaking tupa” dahil mas madaling maunawaan ng karaniwang mambabasa kaysa “barakong tupa.” Ang mga tandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga tala.
