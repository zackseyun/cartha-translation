translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “langis” sa halip na espesipikong “langis ng olibo” dahil langis lamang ang tahasang nakasaad sa talata. Hindi nilagyan ng talababa sapagkat maipapahayag nang malinaw sa pangunahing teksto ang mga leksikal na pagkakaiba.
