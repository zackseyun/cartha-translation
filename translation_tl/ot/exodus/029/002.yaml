translation:
  language: tl
  text: at tinapay na walang lebadura, mga tinapay na walang lebadura na hinaluan ng langis, at maninipis na tinapay na walang lebadura na pinahiran ng langis; gawin mo ang mga ito mula sa pinong harinang trigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Likas at malinaw na katumbas sa modernong Filipino; pinananatili nito ang ritwal na katangian ng tinapay nang hindi ipinapalagay na lebadura lamang ang tinutukoy ng מַצּוֹת.
- source_word: חַלֹּת מַצֹּת
  choice: mga tinapay na walang pampaalsa
  rationale: Ang חַלָּה ay maaaring tumukoy sa isang hugis-bilog o buo-buong tinapay. Mas malinaw ang “mga tinapay” kaysa “mga keyk” sa kontekstong ito, bagaman hindi ganap na naipapakita sa Filipino ang kaibhan nito sa pangkalahatang לֶחֶם.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: na hinaluan ng langis
  rationale: Tumpak na inilalarawan ang paghahalo ng langis sa sangkap at natural ang parirala sa Filipino.
- source_word: רְקִיקֵי מַצּוֹת
  choice: maninipis na tinapay na walang pampaalsa
  rationale: Ang רָקִיק ay manipis na tinapay o wafer; iniiwasan ng saling ito ang modernong konotasyon ng “wafer” at pinananatili ang kaibhan sa mas makapal na חַלּוֹת.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: na pinahiran ng langis
  rationale: Bagaman karaniwang nangangahulugang “pinahiran/anointed” ang משׁח, sa paghahanda ng pagkain ang natural at kontekstuwal na kahulugan ay pagpapahid ng langis sa ibabaw.
- source_word: סֹלֶת חִטִּים
  choice: pinong harinang trigo
  rationale: Direktang ipinahahayag ang uri at kalidad ng harina sa natural na ayos ng Filipino.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: gawin mo ang mga ito
  rationale: Pinananatili ang tahasang utos sa ikalawang panauhang isahan, ayon sa anyong Hebreo.
