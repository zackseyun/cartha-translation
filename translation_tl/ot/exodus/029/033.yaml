base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: tl
  text: Kakainin nila ang mga ito, na sa pamamagitan ng mga ito ay isinagawa ang pagbabayad-sala, upang italaga sila sa tungkulin bilang pari at pabanalin sila. Ngunit hindi dapat kumain ng mga ito ang isang tagalabas[c], sapagkat banal ang mga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Ang “tagalabas” dito ay taong hindi awtorisadong makibahagi sa ritwal ng mga pari, hindi kinakailangang dayuhan ayon sa lahi.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Kakainin nila ang mga bagay
  rationale: Ang pandiwa ay may panghinaharap na nag-uutos sa daloy ng ritwal. Ang “mga bagay” ay nilinaw mula sa panghalip na tumutukoy sa mga bahaging handog sa naunang konteksto.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: na ginamit sa pagtubos
  rationale: Ipinapakita ng בָּהֶם ang mga bagay bilang kasangkapan o paraan sa gawaing כּפר. Likas sa modernong Tagalog ang “ginamit sa pagtubos,” habang hindi tahasang nagdaragdag ng benepisyaryong wala sa sugnay.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: upang italaga sila bilang mga pari
  rationale: Ang literal na “punuin ang kanilang kamay” ay teknikal na idyoma para sa pagluklok o pagtatalaga sa tungkuling pari; inilalahad ang kahulugan nang hindi inuugnay sa isang makabagong denominasyonal na ordinasyon.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: at pabanalin sila
  rationale: Sa kontekstong ritwal, nangangahulugan ang קדשׁ na ibukod bilang banal para sa paglilingkod; pinananatili ng “pabanalin” ang ugnayan sa salitang “banal” sa hulihan ng talata.
- source_word: וְזָר
  choice: Ngunit ... ang sinumang hindi kabilang sa mga pari
  rationale: Sa batas pangkulto, ang זָר ay isang taong nasa labas ng awtorisadong pangkat ng mga pari, hindi kinakailangang dayuhan sa lahi.
- source_word: לֹא יֹאכַל
  choice: hindi kakain ng mga iyon
  rationale: Direktang ipinahahayag ang pagbabawal, at idinagdag ang malinaw na layon na ipinahihiwatig ng konteksto.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: sapagkat banal ang mga iyon
  rationale: Ipinapahayag ng sugnay ang dahilan ng pagbabawal at pinananatili ang panrelihiyong bigat ng קֹדֶשׁ.
theological_decisions:
- issue: Kahulugan ng כפר sa konteksto ng paghahandog
  choice: pagtubos
  alternative: pagbabayad-sala; pagpawi ng sala
  rationale: Ang “pagtubos” ay madaling maunawaan at may sapat na bigat na panrelihiyon. Hindi nito pilit na nilulutas kung ang diin ng כפר dito ay pagpawi ng sala, pagtatakip, o mas malawak na pakikipagkasundo.
- issue: Teknikal na idyomang מִלֵּא יָד para sa mga pari
  choice: italaga sila bilang mga pari
  alternative: punuin ang kanilang kamay; iluklok sila
  rationale: Ipinapahayag ng pangunahing salin ang tungkuling ritwal ng idyoma at iniiwasang ipakahulugan itong literal o iugnay sa isang partikular na makabagong paraan ng ordinasyon.
- issue: Saklaw ng זָר
  choice: sinumang hindi kabilang sa mga pari
  alternative: tagalabas; hindi awtorisadong tao
  rationale: Nililinaw nito na ang pagtatangi ay ayon sa awtorisasyon sa ritwal, hindi ayon sa lahi o bansang pinagmulan.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na himig. Ginamit ang “mga pari” upang maging tiyak ang ritwal na konteksto; iniwasan ang sobrang teknikal na bokabularyo at ang denominasyonal na gamit ng “ordinahan.”
