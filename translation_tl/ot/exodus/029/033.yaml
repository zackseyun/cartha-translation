revisions:
- from: Kakainin nila ang mga bagay na ginamit sa pagtubos[a], upang italaga sila bilang mga pari[b] at pabanalin sila. Ngunit hindi kakain ng mga iyon ang sinumang hindi kabilang sa mga pari[c], sapagkat banal ang mga iyon.
  to: Kakainin nila ang mga ito, na sa pamamagitan ng mga ito ay isinagawa ang pagbabayad-sala, upang italaga sila sa tungkulin bilang pari at pabanalin sila. Ngunit hindi dapat kumain ng mga ito ang isang tagalabas[c], sapagkat banal ang mga ito.
  rationale: Pinalitan ang “pagtubos” ng “pagbabayad-sala” upang mas tapat na maipahayag ang כּפר sa ritwal na konteksto, at muling inayos ang sugnay upang ipakita na ang mga ito ang paraan kung saan isinagawa ang pagbabayad-sala. Pinalitan ang tahasang paliwanag sa pangunahing teksto ng “tagalabas,” habang iningatan ang kinakailangang paliwanag sa talababa. Inilaan ang mga talababa a at b bilang mga leksikal na paliwanag, ngunit walang anchor para sa mga ito sa binagong teksto dahil hindi kailangan ang mga ito upang maunawaan ang piniling pangunahing salin; kung hinihingi ng sistema na bawat talababa ay may anchor, maaaring ilagay ang [a] pagkatapos ng “pagbabayad-sala” at [b] pagkatapos ng “pari.”
