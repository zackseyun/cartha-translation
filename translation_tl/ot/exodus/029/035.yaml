  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: tl
  text: Ganito ang gawin mo para kay Aaron at sa kanyang mga anak, ayon sa lahat ng iniutos ko sa iyo. Sa loob ng pitong araw ay italaga mo sila bilang mga pari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “punuin mo ang kamay nila,” isang Hebreong idyoma na tumutukoy sa pagtatalaga o pagluklok ng isang tao sa paglilingkod bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Ang Qal perfect na may prefixed conjunction sa konteksto ng magkakasunod na tagubilin ay may puwersang pautos. Likas at malinaw sa modernong Tagalog ang “Gawin mo.”
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: para kay Aaron at sa kanyang mga anak
  rationale: Ipinapakita ng inuulit na לְ na ang ritwal ay gagawin para kay Aaron at sa kanyang mga anak; ang “para kay” at “sa” ay natural sa Tagalog.
- source_word: כָּכָה
  choice: ang ganito
  rationale: Tumutukoy ito pabalik sa paraang itinakda sa naunang mga tagubilin. Pinananatili ng “ang ganito” ang deiktikong diwa nang hindi nagiging labis na pormal.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: ayon sa lahat ng iniutos ko sa iyo
  rationale: Pinananatili ng “lahat” ang saklaw ng כְּכֹל, samantalang malinaw na ipinapahayag ng parirala ang ganap na pagsunod sa mga naunang utos.
- source_word: שִׁבְעַת יָמִים
  choice: Sa loob ng pitong araw
  rationale: Ito ay accusative of duration. Natural na ipinahahayag ng “sa loob ng pitong araw” ang haba ng proseso.
- source_word: תְּמַלֵּא יָדָם
  choice: italaga mo sila sa tungkulin bilang mga pari
  rationale: Ang literal na “punuin ang kanilang kamay” ay isang Hebreong idyoma para sa pormal na pagtatalaga at pagluklok sa paglilingkod bilang pari. Inihahayag ng salin ang kahulugan sa konteksto nang hindi nag-aangkat ng natatanging kaugaliang denominasyonal.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang pangpari na מִלֵּא יָד
  choice: italaga mo sila sa tungkulin bilang mga pari
  alternative: punuin mo ang kanilang kamay; italaga o iluklok mo sila
  rationale: Sa kontekstong ito, ang idyoma ay tumutukoy sa ritwal na pagtatalaga nina Aaron at ng kanyang mga anak sa katungkulan bilang mga pari. Nililinaw ito sa pangunahing teksto, habang pinananatili sa talababa ang literal na anyo para sa pagiging masusuri ng salin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong ritwal. Ginamit ang tuwirang pautos na “Gawin mo” at “italaga mo” upang ipakita ang puwersa ng tagubilin. Iniwasan ang teknikal o denominasyonal na gamit ng “ordinahan.”
