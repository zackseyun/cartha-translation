base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: tl
  text: Kung may matira hanggang umaga mula sa laman ng handog sa pagtatalaga[a] o mula sa tinapay, sunugin mo sa apoy ang natira. Hindi iyon dapat kainin, sapagkat banal iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa handog na kaugnay ng ritwal ng pagtatalaga sa tungkulin ng mga pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: may matira
  rationale: Ang Niphal ng יתר ay tumutukoy sa bagay na nananatili o natitira; natural sa modernong Tagalog ang “may matira” sa kondisyunal na pangungusap.
- source_word: בְּשַׂר
  choice: laman
  rationale: Pinananatili ng “laman” ang kongkretong katawagang pansakripisyo nang mas tuwiran kaysa sa pangkalahatang “karne.”
- source_word: הַמִּלֻּאִים
  choice: handog sa pagtatalaga
  rationale: Sa konteksto ng Exodus 29, tumutukoy ang מִלֻּאִים sa ritwal ng paglalagay o pagtatalaga sa tungkuling pari. Idinagdag ang “handog” ayon sa konteksto ng laman ng sakripisyo.
- source_word: לֶּחֶם
  choice: tinapay
  rationale: Tuwiran at likas na katumbas sa Tagalog.
- source_word: עַד הַבֹּקֶר
  choice: hanggang umaga
  rationale: Pinananatili nito ang hangganang temporal na ipinahahayag ng עַד.
- source_word: וְשָׂרַפְתָּ
  choice: sunugin mo
  rationale: Ang waw + qatal ay bumubuo sa resulta ng kondisyong nauna; malinaw na ipinahihiwatig ng ayos ng pangungusap sa Tagalog ang ugnayang “kung… sunugin mo.”
- source_word: הַנּוֹתָר
  choice: ang natira
  rationale: Likas at malinaw na salin ng substantivized participle mula sa parehong ugat ng יִוָּתֵר.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Karaniwang paraan sa Tagalog upang ipahayag ang pagsunog sa pamamagitan ng apoy.
- source_word: לֹא יֵאָכֵל
  choice: Hindi iyon dapat kainin
  rationale: Ipinahahayag ng pasibong imperfect ang pagbabawal; pinananatili ng “dapat” ang legal at obligadong puwersa sa natural na Tagalog.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Karaniwang salitang biblikal na nagpapanatili sa kultiko at teolohikal na diwa ng Hebreo.
theological_decisions:
- issue: Pagbibigay-kahulugan sa kultikong terminong הַמִּלֻּאִים sa konteksto ng pagtatalaga ng mga pari
  choice: handog sa pagtatalaga
  alternative: handog sa pagkatalaga; handog para sa ritwal ng pagtatalaga
  rationale: Tumutukoy ang termino sa ritwal ng paglalagay sa tungkulin o pagtatalaga sa mga pari sa Exodus 29. Ang “pagtatalaga” ay malinaw at malawak na nauunawaan, habang ipinapaliwanag ng talababa ang tiyak na ritwal na diwa nang hindi nag-aangkat ng denominasyonal na terminolohiya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa legal-kultikong konteksto. Ginamit ang isahang “mo” dahil isahan ang pandiwang Hebreo. Inilagay ang talababa kasunod ng “handog sa pagtatalaga,” ang mismong terminong ipinaliliwanag nito.
