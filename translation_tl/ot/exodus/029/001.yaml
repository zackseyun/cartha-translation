base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: tl
  text: 'At ito ang gagawin mo para sa kanila upang italaga silang maglingkod bilang mga pari sa akin: kumuha ka ng isang toro mula sa kawan ng baka[a] at dalawang lalaking tupa na walang kapintasan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “isang batang toro.” Literal sa Hebreo: “isang toro, anak ng baka,” isang idyoma para sa hayop na mula sa kawan ng baka.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “walang depekto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: ang gagawin
  rationale: Sa konteksto ng tagubiling panseremonya, likas sa Filipino ang “ito ang gagawin mo”; ipinahahayag nito ang bagay o pamamaraang kasunod nang hindi gumagamit ng matigas na literalismong “ang bagay.”
- source_word: תַּעֲשֶׂה
  choice: gagawin mo
  rationale: Ang anyong Hebreo ay may puwersang pantagubilin; malinaw at natural itong naihahatid ng hinaharap na anyong Filipino sa konstruksiyong “ito ang gagawin mo.”
- source_word: לְקַדֵּשׁ
  choice: upang italaga
  rationale: Sa kontekstong pangpari, tumutukoy ito sa pagbubukod para sa banal na tungkulin. Ang “italaga” ay dignified, malinaw, at karaniwang Filipino para sa konsekrasyon.
- source_word: לְכַהֵן לִי
  choice: na maglingkod bilang mga pari sa akin
  rationale: Pinananatili nito kapuwa ang aktuwal na pagganap sa tungkuling pari at ang direksiyon ng paglilingkod sa Diyos, nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: לְקַח
  choice: Kumuha ka
  rationale: Tuwirang katumbas ito ng pautos na Hebreo at natural sa modernong Filipino.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: isang toro mula sa bakahan
  rationale: Inihahatid nito ang idiomang Hebreo na literal na “isang toro, anak ng baka/bakahan” bilang hayop na mula sa kawan ng baka, habang iniiwasan ang malabong literal na salin.
- source_word: אֵילִם שְׁנַיִם
  choice: dalawang lalaking tupa
  rationale: Ang אֵיל ay adultong lalaking tupa. Mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o di-pamilyar na terminong teknikal.
- source_word: תְּמִימִם
  choice: walang kapintasan
  rationale: Sa kontekstong pansakripisyo, nangangahulugan itong walang pisikal na depekto. Ang “walang kapintasan” ay malinaw at hindi nagpapahiwatig ng abstraktong moral na kasakdalan.
theological_decisions:
- issue: Wika tungkol sa tungkuling pangpari
  choice: maglingkod bilang mga pari sa akin
  alternative: gumanap bilang mga pari para sa akin
  rationale: Pinananatili ng pinili ang opisyal at sagradong tungkulin ng mga pari at ang paglilingkod nila sa Diyos, nang hindi ipinapasok ang anumang mas huling konseptong eklesiastikal.
- issue: Kahulugan ng pagtatalaga
  choice: italaga
  alternative: pabanalin
  rationale: Sa ritwal na konteksto, ang pokus ay pagbubukod at paghirang sa banal na paglilingkod. Maaaring mapagkamalan ang “pabanalin” bilang pangunahing moral na pagbabago, kaya mas angkop rito ang “italaga.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong panseremonya. Ginamit ang “pari,” “italaga,” at “walang kapintasan” bilang pamilyar ngunit hindi sektaryong bokabularyo. Nasa pangunahing teksto ang lahat ng panandang talababa.
