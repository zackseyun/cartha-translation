  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: tl
  text: Pagkatapos, hiwa-hiwain mo ang lalaking tupa, hugasan ang mga lamang-loob[a] at mga paa nito, at ilagay ang mga iyon sa ibabaw ng mga piraso nito at ng ulo nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga panloob na bahagi.” Mas malawak ang maaaring saklaw ng salitang Hebreo, ngunit sa konteksto ng paghahain ay malamang na tumutukoy ito sa mga lamang-loob.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kasama ng mga piraso nito at ng ulo nito.” Literal na “sa ibabaw ng mga piraso nito at sa ibabaw ng ulo nito”; maaaring inilalarawan dito ang pag-aayos ng mga hinugasang bahagi kasama ng ibang mga bahagi para sa handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: ang lalaking tupa
  rationale: Ang אַיִל ay isang lalaking tupa, lalo na sa konteksto ng paghahain. Mas madaling maunawaan ng karaniwang mambabasa ang “lalaking tupa” kaysa sa hiram o teknikal na katawagan.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: hiwa-hiwain mo ... sa mga piraso
  rationale: Ipinahihiwatig ng piel na pandiwa ang pagputol sa hayop sa magkakahiwalay na piraso bilang paghahanda sa paghahain. Natural at malinaw sa modernong Tagalog ang “hiwa-hiwain.”
- source_word: קִרְבּוֹ
  choice: mga lamang-loob
  rationale: Bagaman maaaring tumukoy ang קֶרֶב sa panloob na bahagi sa pangkalahatan, sa tagubiling pansakripisyo ay malamang na tumutukoy ito sa mga lamang-loob na hinuhugasan.
- source_word: כְרָעָיו
  choice: mga paa nito
  rationale: Tumutukoy ang כְּרָעַיִם sa mga paa o ibabang bahagi ng mga binti ng hayop. Ang “mga paa” ang pinakanatural at madaling maunawaang salin sa Tagalog.
- source_word: וְנָתַתָּ עַל
  choice: ilagay ... sa ibabaw ng
  rationale: Pinananatili ng “sa ibabaw ng” ang karaniwang kongkretong kahulugan ng עַל at ang posibleng pisikal na pagkakaayos ng mga bahaging inihahain.
- source_word: נְתָחָיו
  choice: mga piraso nito
  rationale: Ang נְתָחִים ay mga bahaging nalikha sa paghiwa sa hayop; tuwiran at malinaw ang “mga piraso.”
- source_word: רֹאשׁוֹ
  choice: ulo nito
  rationale: Tuwiran at natural na katumbas ng anatomikal na katawagan.
- source_word: וְ
  choice: Pagkatapos / at
  rationale: Ipinapakita ng “Pagkatapos” ang sunod-sunod na hakbang ng ritwal, samantalang pinananatili ng “at” ang koordinasyon ng kasunod na mga utos.
theological_decisions:
- issue: Kaugnayan ng hinugasang mga bahagi sa mga piraso at ulo
  choice: sa ibabaw ng mga piraso nito at ng ulo nito
  alternative: kasama ng mga piraso nito at ng ulo nito
  rationale: Mas tuwirang sinasalamin ng pangunahing salin ang עַל (“sa ibabaw ng”), ngunit itinatala sa talababa ang posibleng diwang pagsasama-sama o pag-aayos ng lahat ng bahagi para sa handog.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong nagbibigay ng ritwal na tagubilin. Ginamit ang tuwirang ikalawang panauhan at mga karaniwang salitang anatomikal; iniwasan ang labis na teknikal o makalumang pananalita.
