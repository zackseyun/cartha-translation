  terminology: Ang “toro,” “sa harap ng,” at “Toldang Tagpuan” ay angkop na modernong Filipino at tapat sa mga terminong Hebreo. Hindi nagdaragdag ang salin ng anumang paliwanag na doktrinal sa ritwal.
