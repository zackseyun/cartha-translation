  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: tl
  text: Dalhin mo ang toro sa harap ng Toldang Tagpuan[a], at ipatong nina Aaron at ng kanyang mga anak na lalaki ang kanilang mga kamay sa ulo ng toro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Iharap mo” o “Ilapit mo ang toro sa harap ng Toldang Tagpuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Dalhin mo
  rationale: Ang Hiphil ng קרב ay nangangahulugang maglapit o magharap, lalo na sa kontekstong paghahandog. Natural sa modernong Tagalog ang “Dalhin mo,” habang pinananatili ng “sa harap ng” ang direksiyon at ritwal na diwa.
- source_word: הַפָּר
  choice: ang toro
  rationale: Ang פַּר ay lalaking baka na ginagamit sa paghahandog; “toro” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Tuwirang ipinapahayag nito ang posisyon sa harapan o presensiya ng Toldang Tagpuan.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tagpuan
  rationale: Ipinahahayag nito ang toldang itinakdang lugar ng pakikipagtagpo, nang hindi ipinagkakamali ang מוֹעֵד sa salitang Hebreo para sa tipan.
- source_word: וְסָמַךְ
  choice: ipapatong
  rationale: Sa ritwal na konteksto, ang סמך ay tumutukoy sa paglalagay o pagpapatong ng mga kamay sa ulo ng hayop.
- source_word: יְדֵיהֶם
  choice: ang kanilang mga kamay
  rationale: Pinananatili ang maramihang anyo ng Hebreo at ang sama-samang kilos nina Aaron at ng kanyang mga anak.
- source_word: עַל רֹאשׁ הַפָּר
  choice: sa ulo ng toro
  rationale: Natural at kongkretong Tagalog para sa pisikal na kilos na inilalarawan ng Hebreo.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ni Aaron at ng mga anak niyang lalaki
  rationale: Nililinaw na mga anak na lalaki ni Aaron ang tinutukoy sa konteksto ng pagtatalaga sa pagkapari.
theological_decisions:
- issue: Ritwal na pagpapatong ng mga kamay sa hayop na ihahandog
  choice: ipapatong ... ang kanilang mga kamay sa ulo ng toro
  alternative: ilalagay ... ang kanilang mga kamay sa ulo ng toro
  rationale: Inilalarawan lamang ng talata ang aktuwal na ritwal. Hindi dinaragdagan ng salin ng paliwanag tungkol sa paglilipat ng kasalanan o iba pang simbolikong kahulugan na hindi tahasang sinasabi rito.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “Toldang Tagpuan” bilang tumpak at madaling maunawaang katawagan sa santuwaryo, at pinanatili ang konkretong wikang ritwal nang walang idinagdag na doktrinal na paliwanag.
