base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: tl
  text: Ilagay mo ang mga iyon sa iisang basket[a], at ilapit mo ang mga iyon habang nasa basket[b], kasama ang toro at ang dalawang lalaking tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang basket.” Literal na “sa ibabaw ng isang basket” ang pang-ukol sa Hebreo, ngunit sa kontekstong ito ng sisidlan, ang diwa ay ilagay ang mga iyon sa loob ng iisang basket.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “iharap mo” o “ihandog mo.” Ang pandiwang Hebreo ay karaniwang terminong pansakripisyo na literal na nangangahulugang “ilapit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Ilagay mo
  rationale: Ang נתן ay maaaring mangahulugang ‘magbigay,’ ‘maglagay,’ o ‘ilagay.’ Sa tagubiling ito, natural at tiyak ang “ilagay mo.”
- source_word: אוֹתָם
  choice: ang mga iyon
  rationale: Tumutukoy ang panlalaking pangmaramihang panghalip sa mga tinapay na binanggit sa naunang talata; malinaw sa Filipino ang “ang mga iyon.”
- source_word: עַל סַל אֶחָד
  choice: sa iisang basket
  rationale: Bagaman karaniwang nangangahulugang ‘sa ibabaw ng’ ang עַל, sa konteksto ng paglalagay sa isang sisidlan, natural ang “sa.” Pinananatili ng “iisang” ang diin ng אֶחָד na magkakasama ang lahat sa isang basket.
- source_word: וְהִקְרַבְתָּ
  choice: at ilapit mo
  rationale: Ang hiphil ng קרב ay literal na ‘dalhin o ilapit’ at karaniwang terminong pansakripisyo. Pinananatili ng “ilapit” ang pahiwatig na kultiko nang hindi agad nililimitahan sa “ihandog.”
- source_word: בַּסָּל
  choice: na nasa basket
  rationale: Ipinahihiwatig ng ב na nasa loob ng basket ang mga tinapay habang inilalapit. Mas malinaw sa Filipino ang relasyong ito kaysa sa literal ngunit alanganing “ilapit mo sila sa basket.”
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: kasama ang toro at ang dalawang lalaking tupa
  rationale: Ipinakikita ng inuulit na pananda ng tuwirang layon na ang toro at ang dalawang lalaking tupa ay kabilang din sa mga ilalapit. Natural na ipinahahayag ito ng “kasama.”
- source_word: הַפָּר
  choice: ang toro
  rationale: Ang פַּר ay toro; pinananatili ng “ang toro” ang tiyak na anyo ng Hebreo.
- source_word: שְׁנֵי הָאֵילִם
  choice: ang dalawang lalaking tupa
  rationale: Ang אַיִל ay adultong lalaking tupa. Mas madaling maunawaan ng karaniwang mambabasang Filipino ang “lalaking tupa” kaysa sa hiram o di-gaanong pangkaraniwang “ram.”
theological_decisions:
- issue: Saklaw ng pandiwang וְהִקְרַבְתָּ
  choice: Ilapit ang mga tinapay na nasa basket, pati ang toro at dalawang lalaking tupa
  alternative: Ihandog ang lahat ng ito
  rationale: Sinasaklaw ng mga pananda ng tuwirang layon ang tinapay at mga hayop. Ang “ilapit” ay nagpapanatili sa batayang larawang pansakripisyo at hindi pa ipinapalagay na ang mismong paghahandog o pagpatay ang tinutukoy sa hakbang na ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang pautos na “Ilagay mo” at “ilapit mo,” na natural para sa tagubilin. Ang “lalaking tupa” ay pinili para sa malawak na pagkaunawa; iniwasan ang mas teknikal na hiram na “ram.”
