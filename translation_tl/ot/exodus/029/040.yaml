  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: tl
  text: at ikasampung bahagi[a] ng pinong harina na hinaluan ng sangkapat na hin ng langis mula sa dinikdik na mga olibo[b], at sangkapat na hin ng alak bilang handog na inumin, para sa isang kordero[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas tahasang: “ikasampung bahagi ng isang efa.” Ginagamit dito ng Hebreo ang “ikasampung bahagi” bilang takdang sukat para sa handog.'
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa langis na ginawa mula sa mga olibong dinikdik o dinurog; maaari ring isaling “langis mula sa pinisang mga olibo.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “para sa korderong iyon.” Sa konteksto, malamang na tumutukoy ito sa una sa dalawang korderong inihahandog araw-araw.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עִשָּׂרֹן
  choice: at ikasampung bahagi
  rationale: Ang עִשָּׂרוֹן ay isang takdang sukat sa mga handog, karaniwang ikasampung bahagi ng isang efa. Pinananatili sa pangunahing teksto ang bahaging tahasang sinabi sa Hebreo, habang inilalagay sa talababa ang ipinahihiwatig na yunit.
- source_word: סֹלֶת
  choice: pinong harina
  rationale: Karaniwang tumutukoy ang סֹלֶת sa harinang pinong giniling at ginagamit sa mga handog. Likas at malinaw sa modernong Filipino ang “pinong harina.”
- source_word: בָּלוּל בְּ/שֶׁמֶן
  choice: hinaluan ng ... langis
  rationale: Ipinahihiwatig ng balintiyak na anyo at ng pang-ukol na ang harina ay inihalo sa langis. Ang “hinaluan ng” ay natural sa Filipino at tumpak sa paraan ng paghahanda.
- source_word: כָּתִית
  choice: langis mula sa dinikdik na mga olibo
  rationale: Inilalarawan ng כָּתִית ang langis na nagmula sa mga olibong dinikdik o dinurog. Mas malinaw ito sa karaniwang mambabasa kaysa sa literal ngunit alanganing “dinikdik na langis.”
- source_word: רֶבַע הַ/הִין
  choice: sangkapat na hin
  rationale: Tumpak na pinananatili ang sinaunang yunit na hin at ang sukat na isang-kapat, nang hindi ito kinokonvert sa makabagong sukat.
- source_word: וְ/נֵסֶךְ
  choice: at ... bilang handog na inumin
  rationale: Ang נֶסֶךְ ay teknikal na katawagan sa handog na ibinubuhos. Ang “handog na inumin” ay malinaw at madaling maunawaan, at ipinakikita ng ayos ng pangungusap na alak ang inihahandog.
- source_word: רְבִעִית הַ/הִין יָיִן
  choice: sangkapat na hin ng alak
  rationale: Parehong pinananatili ang sukat na isang-kapat ng hin at ang karaniwang kahulugan ng יַיִן bilang alak.
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: para sa isang kordero
  rationale: Pinananatili nito ang pagtukoy sa isang kordero nang hindi tahasang nilulutas sa pangunahing teksto kung ito ang “unang” kordero. Nililinaw sa talababa ang posibleng pagtukoy batay sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang ginamit. Pinanatili ang sinaunang yunit na “hin,” ang teknikal na pariralang “handog na inumin,” at ang hindi ganap na tiyak na pagtukoy ng הָאֶחָד sa kordero. Ang mga marker na [a], [b], at [c] ay inilagay kaagad pagkatapos ng kaugnay na parirala.
