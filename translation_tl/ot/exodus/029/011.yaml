  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: tl
  text: Kakatayin mo ang toro sa harap ni Yahweh[a], sa pasukan ng tolda ng tagpuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; nakaugaliang isalin bilang “ang PANGINOON.” Kabilang sa mga anyo ng pangalan ang “Yahweh” at “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Kakatayin mo
  rationale: Ang Qal perfect na may prefixed conjunction ay nagpapatuloy sa serye ng mga tagubiling ritwal at may puwersang pautos. Mas tiyak ang “katayin” kaysa sa pangkalahatang “patayin” sa konteksto ng paghahandog.
- source_word: הַפָּר
  choice: ang toro
  rationale: Karaniwang tumutukoy ang פַּר sa isang toro sa konteksto ng paghahandog; malinaw at natural ito sa modernong Tagalog.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ng “sa harap” ang literal at sagradong diwa ng לִפְנֵי, samantalang ang “ni” ay natural na pananda sa personal na pangalan sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa titik ang banal na pangalang YHWH sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: פֶּתַח
  choice: sa pasukan
  rationale: Ang פֶּתַח ay tumutukoy sa pasukan o bukana; “sa pasukan” ang pinakanatural na paglalarawan ng lokasyon.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tagpuan
  rationale: Ipinahahayag ng parirala ang toldang itinakdang lugar ng pakikipagtagpo. Ang “toldang tagpuan” ay maikli, marangal, at madaling maunawaan nang hindi ginagawang “tipan” ang מוֹעֵד.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakaiba nito sa titulong “Panginoon,” habang kinikilala sa talababa ang nakaugaliang salin at isa pang anyo ng pangalan.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang aspektong kontemplatibo sa “Kakatayin mo” upang ihatid ang pautos na tagubilin sa sunod-sunod na ritwal. Ang kuwit bago ang pariralang panlunan ay nagpapanatili sa malinaw na ugnayan ng “sa harap ni Yahweh” at “sa pasukan ng toldang tagpuan.”
