  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: tl
  text: Doon ako makikipagtagpo sa mga anak ni Israel[a], at iyon ay gagawing banal sa pamamagitan ng aking kaluwalhatian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Ang literal na mababasa sa Hebreo ay “mga anak ni Israel,” isang karaniwang tipanang katawagan sa bayan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Hindi tahasang binabanggit sa Hebreo kung ano ang gagawing banal. Maaaring tumukoy ito sa lugar ng santuwaryo sa pangkalahatan, o mas tiyak sa tolda ng pagpupulong o sa altar.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: makikipagtagpo ako
  rationale: Ang Niphal ng יעד sa konteksto ng santuwaryo ay tumutukoy sa itinakdang pakikipagtagpo ng Diyos sa kanyang bayan. Natural at tuwiran sa modernong Tagalog ang “makikipagtagpo.”
- source_word: שָׁמָּה
  choice: doon
  rationale: Pang-abay na tumutukoy sa lugar ng santuwaryo na binanggit sa naunang konteksto.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang pormal na Hebreong ekspresyong “mga anak ni Israel,” habang ang “sa” ay likas na kaakibat ng pandiwang “makipagtagpo” sa Tagalog.
- source_word: וְנִקְדַּשׁ
  choice: at iyon ay gagawing banal
  rationale: Pinananatili ng “gagawing banal” ang pasibong diwa ng Niphal ng קדש. Ang “iyon” ay hindi tahasang pinapangalanan upang mapanatili ang kalabuan ng paksa sa Hebreo.
- source_word: בִּכְבֹדִי
  choice: sa pamamagitan ng aking kaluwalhatian
  rationale: 'Ipinahahayag nito ang instrumental na gamit ng בְּ: ang kaluwalhatian ng Diyos ang kaparaanang nagpapabanal.'
theological_decisions:
- issue: Hindi tahasang paksa ng וְנִקְדַּשׁ (“gagawing banal”)
  choice: Ginamit ang “iyon” nang hindi tinutukoy kung anong bagay ang tinutukoy nito.
  alternative: Tukuyin nang tahasan ang tolda ng pagpupulong, altar, o lugar ng santuwaryo; o iugnay kay Aaron.
  rationale: Ang pandiwa ay panlalaking isahan sa ikatlong panauhan ngunit walang hayag na paksa. Ang pangkalahatang pagtukoy na “iyon” ang pinakamainam na nagpapanatili sa kalabuan ng Hebreo at sa mga posibleng reperensiyang kaugnay ng santuwaryo.
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Ang literal na pormulasyong ito ay karaniwang tipanang katawagan sa bayan ng Israel. Pinananatili ito sa pangunahing teksto, habang inilalagay sa talababa ang natural na idyomatikong katumbas.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “makikipagtagpo” sa halip na mas teknikal na pananalita, at ang “gagawing banal” upang malinaw na mapanatili ang pasibong anyo. Inayos ang mga pananda ng talababa ayon sa pagkakasunod ng paglitaw sa teksto.
