revisions:
- from: At kukuha ka mula sa lalaking tupa ng taba, ng matabang buntot, ng tabang bumabalot sa mga lamang-loob, ng umbok ng atay, ng dalawang bato at ng tabang nasa ibabaw ng mga iyon, at ng kanang hita, sapagkat ito ang lalaking tupa para sa pagtatalaga.[a]
  to: At kukuha ka mula sa lalaking tupa ng taba, ng matabang buntot, ng taba na bumabalot sa mga lamang-loob, ng umbok na bahagi ng atay, ng dalawang bato at ng tabang nasa ibabaw ng mga iyon, at ng kanang hita, sapagkat ito ay lalaking tupa para sa pagtatalaga.[a]
  rationale: Inayos ang anyong panggramatika ng pariralang tumutukoy sa tabang tumatakip sa mga lamang-loob. Pinalinaw rin ang tinutukoy na bahagi ng atay sa paraang natural sa Filipino at maingat sa hindi tiyak na anatomiya ng Hebreo. Walang binago sa kahulugan, daloy ng utos, o neutral na ritwal na terminolohiya.
