base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: tl
  text: At kukuha ka mula sa lalaking tupa ng taba, ng matabang buntot, ng taba na bumabalot sa mga lamang-loob, ng umbok na bahagi ng atay, ng dalawang bato at ng tabang nasa ibabaw ng mga iyon, at ng kanang hita, sapagkat ito ay lalaking tupa para sa pagtatalaga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lalaking tupa para sa pagluklok sa tungkulin” o “lalaking tupa ng ordinasyon.” Ang pariralang Hebreo ay tumutukoy sa lalaking tupang ginagamit sa ritwal ng pagtatalaga sa mga pari sa kanilang tungkulin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: At kukuha ka
  rationale: Ang waw na sinusundan ng perfect sa magkakasunod na tagubilin ay likas na ipinapahayag sa Filipino bilang utos na nasa anyong panghinaharap; pinananatili ng “At” ang daloy ng ritwal.
- source_word: חֵלֶב
  choice: taba
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa mga takdang bahaging taba ng hayop; tuwiran at malinaw ang “taba.”
- source_word: אַלְיָה
  choice: matabang buntot
  rationale: Tumutukoy ito sa makapal at matabang buntot ng tupa, hindi lamang sa buntot sa pangkalahatan.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: bumabalot sa mga lamang-loob
  rationale: Inilalarawan nito ang tabang nakabalot sa mga panloob na bahagi; natural at kongkreto sa modernong Filipino ang “mga lamang-loob.”
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: umbok ng atay
  rationale: Hindi tiyak ang eksaktong anatomiya ng bahaging ito. Ang “umbok ng atay” ay nauunawaan at hindi nagpapanggap ng higit na katiyakan kaysa sa ebidensiyang Hebreo.
- source_word: כְּלָיֹת
  choice: mga bato
  rationale: Ito ang karaniwang salitang Filipino para sa kidneys at malinaw sa anatomikal na konteksto.
- source_word: שׁוֹק הַיָּמִין
  choice: kanang hita
  rationale: Tumutukoy ang שׁוֹק sa bahagi ng hita o binti; ang “hita” ay angkop sa bahaging kinakatay at itinatakda sa ritwal.
- source_word: אֵיל מִלֻּאִים
  choice: lalaking tupa para sa pagtatalaga
  rationale: Ipinahahayag nito ang lalaking tupang ginagamit sa ritwal ng pagtatalaga sa tungkulin, nang hindi nag-aangkat ng mas huling estrukturang eklesiastiko.
theological_decisions:
- issue: Terminolohiya para sa paglalagay sa katungkulan ng mga pari sa אֵיל מִלֻּאִים
  choice: lalaking tupa para sa pagtatalaga
  alternative: lalaking tupa para sa pagluklok sa tungkulin; lalaking tupa ng ordinasyon
  rationale: Malinaw na tumutukoy ang parirala sa tupang ginagamit upang italaga sina Aaron at ang kanyang mga anak sa paglilingkod bilang pari. Natural at malawak ang “pagtatalaga,” samantalang iniiwasan nitong ipasok sa teksto ang mga teknikal na kahulugan ng ordinasyon sa mga tradisyong mas huli.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang sunod-sunod na anyo ng ritwal na tagubilin at ang espesipikong mga bahaging anatomikal. Ang “lalaking tupa” ay mas natural sa Filipino kaysa sa hiram na “barakong tupa” sa pormal na salin.
