  - severity: low
    issue: Maaaring gawing mas maingat at idiomatiko ang “umbok ng atay.”
    rationale: Pinagtatalunan ang eksaktong anatomikal na tinutukoy ng יֹתֶרֶת. Ang “umbok na bahagi ng atay” ay malinaw na tumutukoy sa isang bahagi/protuberansiya ng atay nang hindi ito tinutukoy bilang isang tiyak na lobe.
