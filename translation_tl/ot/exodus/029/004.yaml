  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: tl
  text: Ilapit mo si Aaron at ang kanyang mga anak na lalaki sa pasukan ng Tolda ng Pakikipagtagpo[a], at hugasan mo sila ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iharap mo si Aaron at ang kanyang mga anak na lalaki.” Ang pandiwang Hebreo ay maaari ring tumukoy sa pormal na paghaharap ng isang tao para sa gawaing ritwal.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: Ilapit mo
  rationale: Ang Hiphil ng קרב ay nangangahulugang “ilapit” o “iharap.” Pinananatili ng “ilapit” ang diwa ng paglapit sa santuwaryo sa konteksto ng pagtatalaga, habang natural bilang utos sa Filipino.
- source_word: אֶל
  choice: sa
  rationale: Ipinapahayag ng pang-ukol ang kilos patungo sa isang hantungan; natural sa Filipino ang “sa pasukan.”
- source_word: פֶּתַח
  choice: pasukan
  rationale: Tumutukoy ito sa bukasan o entrada at hindi kinakailangang sa isang pisikal na pinto.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ginagamit ang kinikilalang katawagang Filipino para sa santuwaryong itinakda bilang dako ng pakikipagtagpo; ang talababa ay nagpapanatili ng mas literal na alternatibo.
- source_word: וְרָחַצְתָּ
  choice: at hugasan mo
  rationale: Ang רחץ ay “hugasan” o “paliguan.” Sa sunod-sunod na tagubiling ritwal, malinaw at natural ang anyong pautos na “hugasan mo.”
- source_word: בַּמָּיִם
  choice: ng tubig
  rationale: Ipinakikita nito ang gamit o kasangkapan sa paghuhugas; “hugasan ... ng tubig” ang likas na parirala sa Filipino.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Pinanatili ang karaniwang anyo ng pangalang pantangi sa Bibliyang Filipino.
- source_word: בָּנָיו
  choice: ang kanyang mga anak
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking anak ni Aaron. Natural sa Filipino ang “mga anak,” at malinaw na ang tinutukoy ay ang mga anak na lalaking pinangalanan at itatalaga bilang mga pari sa nakapaligid na talata.
theological_decisions:
- issue: Ritwal na diwa ng קרב sa pagtatalaga ng mga pari
  choice: Ilapit mo si Aaron at ang kanyang mga anak
  alternative: Iharap mo si Aaron at ang kanyang mga anak
  rationale: Pinananatili ng “ilapit” ang konkretong kilos patungo sa pasukan at ang ritwal na paglapit nang hindi ipinapasok ang mas tiyak na interpretasyong nakapaloob sa “iharap.”
- issue: Pagpapakahulugan sa אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  alternative: Tolda ng Pakikipagtagpo
  rationale: Ang “Toldang Tipanan” ay dignified at pamilyar na katawagang Filipino sa tabernakulo. Gayunman, maaaring katawanin ng pariralang Hebreo ang toldang itinakda para sa pakikipagtagpo, kaya inilalahad ang mas literal na alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang pautos upang likas na maipahayag ang mga tagubiling ritwal. Iniwasan ang labis na teknikal o denominasyonal na pananalita.
