  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: tl
  text: Mananahan ako sa piling ng mga anak ni Israel[a][b], at magiging Diyos nila ako.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa gitna ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel”; maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
  - marker: c
    text: Mas malapit sa ayos ng Hebreo, “magiging Diyos ako para sa kanila.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Mananahan ako
  rationale: Ang pandiwang שׁכן ay tumutukoy sa paninirahan o pananahan sa isang lugar. Likas at marangal sa modernong Filipino ang “mananahan,” at pinananatili nito ang diwa ng patuloy na presensya ng Diyos nang hindi idinaragdag sa teksto ang mas mapagpaliwanag na “maninirahan sa tabernakulo.”
- source_word: בְּתוֹךְ
  choice: sa piling ng
  rationale: Kapag ginagamit sa isang pangkat ng tao, ipinapahayag ng בְּתוֹךְ ang presensya sa loob o kasama ng pamayanan. Natural sa Filipino ang “sa piling ng”; inilalagay sa talababa ang mas pormal at mas tuwirang “sa gitna ng.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Tuwirang pinananatili nito ang pamilyang idyoma ng Hebreong “mga anak ni Israel.” Naiintindihan ito sa Filipino bilang mga inapo o sambayanang nagmula kay Israel, samantalang ang “mga Israelita” ay mas maikli ngunit hindi gaanong literal.
- source_word: וְהָיִיתִי
  choice: at ako ang magiging
  rationale: Dito, ang היה ay bahagi ng pormulang tipan at hindi pangunahing nagsasaad ng pagbabago tungo sa isang bagong kalagayan. Ang “ako ang magiging” ay natural na paraan upang ipahayag ang pangakong “I will be.”
- source_word: לָהֶם לֵאלֹהִים
  choice: Diyos nila
  rationale: Bagaman mas literal na “Diyos para sa kanila,” ang “Diyos nila” ang likas na pormulang pangtipan sa Filipino at malinaw na ipinapahayag ang ugnayang tinutukoy ng Hebreo.
theological_decisions:
- issue: Paglalahad ng pormulang pangtipan
  choice: ako ang magiging Diyos nila
  alternative: magiging Diyos ako para sa kanila
  rationale: Pinananatili ng pangunahing salin ang ugnayang pangtipan sa likas na Filipino. Inilalagay sa talababa ang mas literal na hulma upang hindi mawala ang konstruksiyong Hebreo nang gawin itong pangunahing teksto.
- issue: Pamilyang katawagan sa bayan ng Israel
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Hayagang gumagamit ang pinagmulan ng panlalaking maramihang anyong “mga anak ni.” Pinananatili ito sa pangunahing teksto sa halip na palitan agad ng katawagang etniko, habang nililinaw sa talababa ang likas na alternatibo sa Filipino.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mananahan” upang mapanatili ang solemneng diwa ng banal na presensya, ang “sa piling ng” bilang natural na katumbas ng presensya sa loob ng pamayanan, at ang tradisyonal ngunit malinaw na “mga anak ni Israel” upang mapanatili ang pamilyang idyoma ng Hebreo.
