  source_fidelity: Tapat ang salin sa Hebreong teksto. Naipapahayag ng “itatala kong banal” ang dalawang paglitaw ng piel ng קדשׁ; pinananatili ang “tolda ng tipanan,” ang altar, si Aaron, at ang tahasang “mga anak na lalaki.” Ang “upang maglingkod sa akin bilang mga pari” ay natural at sapat na katumbas ng לְכַהֵן לִי.
  naturalness: Natural at marangal ang modernong Filipino. Ang pag-uulit ng “itatatalaga kong banal” ay angkop, sapagkat inuulit din ang pandiwa sa Hebreo. Katanggap-tanggap at malinaw sa kontekstong biblikal ang “tolda ng tipanan” at “altar.”
  terminology: Ang mga terminong “itatatalaga kong banal,” “tolda ng tipanan,” “altar,” at “mga pari” ay magkakatugma sa rehistro at sa terminolohiyang pangkultong Hebreo. Ang “mga anak na lalaki” ay wastong pinananatili ang panlalaking pagtukoy ng בָּנָיו.
