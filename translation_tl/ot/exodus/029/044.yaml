  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: tl
  text: At itatalaga kong banal ang tolda ng tipanan at ang altar; at itatalaga kong banal si Aaron at ang kanyang mga anak na lalaki upang maglingkod sa akin bilang mga pari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: itatalaga kong banal
  rationale: Ipinahahayag ng piel ng קדשׁ ang pagbubukod bilang banal para sa sagradong gamit. Natural sa modernong Filipino ang pariralang ito at pinananatili ang parehong diwa sa dalawang paglitaw ng pandiwa.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng tipanan
  rationale: Tumutukoy ito sa sagradong tolda kung saan nakikipagtagpo ang Diyos sa Israel; ang 'tolda ng tipanan' ay maikli, malinaw, at nakaugat sa gamit ng parirala sa kontekstong ito.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Karaniwan at madaling maunawaang terminong Filipino para sa dambanang pinaghahandugan.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang nakaugaliang transliterasyon ng pangalang Hebreo sa Filipino.
- source_word: בָּנָיו
  choice: kanyang mga anak na lalaki
  rationale: Tiyak na 'mga anak na lalaki' ang anyong Hebreo at tumutukoy sa mga lalaking maglilingkod bilang mga pari; hindi ito ginawang pangkalahatang 'mga anak.'
- source_word: לְכַהֵן לִי
  choice: upang maglingkod sa akin bilang mga pari
  rationale: Ipinahahayag ng infinitibong כהן ang pagganap ng tungkuling pari, samantalang pinananatili ng 'sa akin' ang לִי. Natural ang ayos na ito sa modernong Filipino.
theological_decisions:
- issue: Paglilipat ng wikang nauukol sa kabanalan at pagtatalaga
  choice: itatalaga kong banal
  alternative: pababanalin ko / ikokonsagra ko
  rationale: Pinagsasama ng napiling parirala ang pagbubukod para sa Diyos at ang pagiging banal nang hindi nililimitahan ang kahulugan sa isang denominasyonal na ritwal.
- issue: Tiyak na kasarian ng mga itinalagang pari
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tiyak na panlalaki ang בָּנָיו at iyon ang hinihingi ng konteksto ng pagkapari ni Aaron; pinananatili ang espesipikong pahayag ng teksto.
- issue: Ugnayan ng paglilingkod ng mga pari sa Diyos
  choice: maglingkod sa akin bilang mga pari
  alternative: maging mga pari para sa akin
  rationale: Pinananatili nito kapwa ang aktibong diwa ng כהן at ang layon ng paglilingkod na ipinahahayag ng לִי, nang walang idinadagdag na doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Iningatan ang pag-uulit ng pandiwang קדשׁ sa dalawang sugnay at ang tahasang pagtukoy sa mga anak na lalaki ni Aaron.
