  source_fidelity: 'Tumpak ang salin sa mga pangunahing sangkap ng Hebreo: ang אֵיל ay “lalaking tupa,” ang הַמִּלֻּאִים ay wastong naipahayag bilang ritwal na “pagtatalaga,” ang dalawang pandiwa ay mga utos, at napanatili ang di-tiyak na “sa isang banal na lugar” para sa בְּמָקוֹם קָדֹשׁ.'
  naturalness: Likas at malinaw ang modernong Filipino. Ang “Kunin mo … at pakuluan mo” ay tuwiran, marangal, at angkop sa sunod-sunod na tagubilin. Ang “laman nito” ay natural sa konteksto ng handog.
  terminology: Ang “lalaking tupa” ay angkop para sa ram, at ang “pagtatalaga” ay mahusay na katumbas ng teknikal na terminong pang-ordinasyon sa kontekstong pari. Ang talababa ay maingat na naghahain ng “paglalaan” bilang katanggap-tanggap na alternatibo nang hindi ipinipilit ang isang doktrinal na pakahulugan. Ang “Dakong Banal” ay wastong inilalahad lamang bilang alternatibong pagbasa, samantalang ang pangunahing teksto ay hindi nagdaragdag ng espesipikong lokasyon.
