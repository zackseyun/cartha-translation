  text: וְ/אֵ֛ת אֵ֥יל הַ/מִּלֻּאִ֖ים תִּקָּ֑ח וּ/בִשַּׁלְתָּ֥ אֶת בְּשָׂר֖/וֹ בְּ/מָקֹ֥ם קָדֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: tl
  text: Kunin mo ang lalaking tupa para sa pagtatalaga[a], at pakuluan mo ang laman nito sa isang banal na lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “para sa paglalaan.” Ang terminong Hebreo ay tumutukoy sa ritwal ng pagtatalaga sa mga pari sa kanilang tungkulin.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa Dakong Banal,” ngunit mas literal sa Hebreo ang “sa isang banal na lugar.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: lalaking tupa
  rationale: Ito ang natural at tiyak na katawagan sa modernong Filipino para sa ram na handog; mas malinaw ito kaysa sa hiram o di-karaniwang terminong kultiko.
- source_word: הַמִּלֻּאִים
  choice: para sa pagtatalaga
  rationale: Sa konteksto ng pagluklok sa mga pari, tumutukoy ang teknikal na termino sa ritwal ng pagtatalaga sa tungkulin. Ang 'para sa pagtatalaga' ay natural sa Filipino at malinaw ang kaugnayan ng tupa sa seremonya.
- source_word: תִּקָּח
  choice: Kunin mo
  rationale: Ang ikalawang panauhang panlalaking isahan sa kontekstong nag-uutos ay likas na isinasalin bilang tuwirang utos sa Filipino.
- source_word: וּבִשַּׁלְתָּ
  choice: at pakuluan mo
  rationale: Ang pandiwa ay tumutukoy rito sa pagluluto sa pamamagitan ng pagpapakulo; pinananatili ng 'pakuluan' ang tiyak na paraan ng paghahanda.
- source_word: בְּשָׂרוֹ
  choice: ang laman nito
  rationale: Ang 'laman' ang natural at tuwirang katumbas ng בשר sa konteksto ng hayop na handog, nang hindi nagiging masyadong kolokyal.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: sa isang banal na lugar
  rationale: Walang pantukoy sa pariralang Hebreo, kaya hindi nito kinakailangang tukuyin ang espesipikong silid ng santuwaryo na tinatawag na Dakong Banal.
theological_decisions:
- issue: Teknikal na terminong הַמִּלֻּאִים sa konteksto ng pagluklok sa mga pari
  choice: lalaking tupa para sa pagtatalaga
  alternative: lalaking tupa para sa paglalaan
  rationale: Ang 'pagtatalaga' ay malinaw na nagpapahayag ng ritwal na paglalagay sa mga pari sa kanilang tungkulin, habang ang 'paglalaan' ay maaari ring magpahiwatig ng konsekrasyon. Hindi isinalin nang literal ang pinagmulan nitong idyoma na 'pagpuno' sapagkat magiging malabo iyon sa Filipino.
- issue: Kung ang בְּמָקוֹם קָדֹשׁ ay pangkalahatang banal na lugar o ang teknikal na silid na Dakong Banal
  choice: sa isang banal na lugar
  alternative: sa Dakong Banal
  rationale: Hindi hinihingi ng anyong Hebreo ang pagtukoy sa espesipikong silid ng tabernakulo. Pinananatili ng salin ang pagiging di-tiyak ng lokasyon at iniiwasang magdagdag ng detalyeng wala sa teksto.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang anyong pautos na 'Kunin mo' at 'pakuluan mo' upang likas na maipahayag ang tagubilin sa ikalawang panauhang isahan. Ang mga teknikal na kahulugang kultiko ay nilinaw sa mga talababa nang hindi ginagawang mas tiyak ang pangunahing teksto kaysa sa Hebreo.
