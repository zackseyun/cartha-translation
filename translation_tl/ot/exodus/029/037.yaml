  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: tl
  text: Sa loob ng pitong araw, magsasagawa ka ng ritwal ng pagtubos para sa altar at itatalaga mo ito bilang banal. At ang altar ay magiging pinakabanal. Anumang humipo sa altar ay magiging banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ang sinumang humipo sa altar ay magiging banal.” Maaaring unawain ang Hebreo alinman na ang kabanalan ay naipapasa sa pamamagitan ng paghipo, o na tanging ang banal ang maaaring humipo sa altar.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: magsasagawa ka ng pagtubos
  rationale: Sa kontekstong ritwal ng mga pari, tumutukoy ang כפר sa pagsasagawa ng ritwal ng pagtubos at paglilinis. Pinananatili ng “magsasagawa ng pagtubos” ang saklaw nito nang hindi labis na nililinaw ang paraan.
- source_word: עַל הַמִּזְבֵּחַ
  choice: para sa altar
  rationale: Kasama ng כפר, minamarkahan ng עַל ang bagay na pinagtutubusan. Mas likas at mas tumpak dito ang “para sa altar” kaysa “sa ibabaw ng altar.”
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: at itatalaga mo itong banal
  rationale: Ipinahahayag nito ang ritwal na pagbubukod sa altar bilang banal. Ang “itatalaga” ay natural sa modernong Filipino at ang “banal” ay tahasang nagpapanatili sa ideya ng קדש.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: pinakabanal
  rationale: Ang inuulit na anyong Hebreo ay nagpapahayag ng pinakamataas na antas ng kabanalan. Malinaw at natural na panaguri sa Filipino ang “pinakabanal.”
- source_word: כָּל הַנֹּגֵעַ
  choice: anumang humipo
  rationale: Malawak ang saklaw ng pariralang Hebreo at maaaring tumukoy sa tao o bagay. Pinananatili ng “anumang” ang lawak na ito.
- source_word: יִקְדָּשׁ
  choice: ay magiging banal
  rationale: Maaaring unawain ang pandiwa bilang pagkakaroon ng banal na kalagayan bunga ng paghipo. Ipinapakita ng “magiging banal” ang pagbabagong iyon habang inilalagay sa talababa ang tunay na alternatibong pagkaunawa.
theological_decisions:
- issue: Kung ang kabanalan ng altar ay naipapasa sa humihipo rito o kung banal lamang ang maaaring humipo
  choice: Ang humipo sa itinalagang altar ay magiging banal.
  alternative: Ang sinumang humipo sa altar ay dapat maging banal, o banal lamang ang maaaring humipo rito.
  rationale: Pinakamalapit sa payak na daloy ng יִקְדָּשׁ ang pagbasa na nagiging banal ang humihipo. Gayunman, pinananatili sa talababa ang posibleng regulatibong pagbasa upang hindi patahimikin ang tunay na ambiguwidad at tensiyong ritwal.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Ang “altar” ay pinanatili bilang karaniwang terminong biblikal; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
