  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: tl
  text: At bawat araw ay maghahandog ka ng isang toro bilang handog para sa kasalanan upang magbayad-sala.[a] Dadalisayin mo ang altar kapag nagbabayad-sala ka para rito, at papahiran mo ito ng langis upang italaga ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bilang handog para sa pagdadalisay.” Ang salitang Hebreo ay maaaring tumukoy sa “kasalanan” o, sa konteksto ng paghahandog, sa handog na ginagamit sa ritwal na pagdadalisay mula sa kasalanan o karumihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: isang toro
  rationale: Ang פַר ay tumutukoy sa toro; hindi sapilitang ipinahihiwatig ng salita na ito ay batang toro.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong pansakripisyo, tumutukoy ito sa handog na kaugnay ng kasalanan at ritwal na pagdadalisay. Likas at malinaw sa modernong Tagalog ang 'handog para sa kasalanan.'
- source_word: לַיּוֹם
  choice: sa bawat araw
  rationale: Ipinahihiwatig ng parirala ang paulit-ulit na gawa araw-araw sa ritwal na ito.
- source_word: עַל הַכִּפֻּרִים
  choice: upang magbayad-sala
  rationale: Ang anyong maramihan sa Hebreo ay tumutukoy rito sa mga ritwal ng pagbabayad-sala; likas sa Tagalog ang pandiwang pariralang ito.
- source_word: וְחִטֵּאתָ
  choice: dadalisayin mo
  rationale: Ang piel ng חטא, kapag sagradong bagay gaya ng altar ang layon, ay nangangahulugang ritwal na dalisayin, hindi patawarin sa moral na kasalanan.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Karaniwan at malinaw na salin sa konteksto ng tabernakulo at paghahandog.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: kapag nagbabayad-sala ka para rito
  rationale: Pinananatili ang posibleng temporal na gamit ng בְּ sa infinitive construct, at ang hulaping panghalip ay pinakanatural na tumutukoy sa altar.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: papahiran mo ito ng langis
  rationale: Ang משׁח ay ritwal na pagpapahid. Idinagdag ang 'ng langis' bilang likas na pagpapahayag sa Tagalog at malinaw na ipinahihiwatig ng konteksto ng pagpapahid.
- source_word: לְקַדְּשׁוֹ
  choice: upang italaga ito
  rationale: Tumutukoy ang קדשׁ sa pagbubukod sa altar bilang banal para sa sagradong gamit; malinaw at dignificado ang 'italaga' sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa ritwal na pagdadalisay at pagbabayad-sala nang hindi nag-aangkat ng mas huling mga kategoryang doktrinal
  choice: Gamitin ang 'handog para sa kasalanan,' 'dadalisayin,' at 'magbayad-sala' sa konteksto ng mga ritwal sa tabernakulo.
  alternative: Gamitin ang 'handog para sa pagdadalisay' at 'lilinisin,' o ipakahulugan ang altar na tila pinatatawad sa moral na kasalanan.
  rationale: Ang talata ay tungkol sa ritwal na pagtatalaga at pagdadalisay sa altar. Pinananatili ng salin ang mga kategoryang pansamba ng Hebreo at hindi ipinahihiwatig na nakagawa ng moral na kasalanan ang altar.
- issue: Ugnayan ng בְּכַפֶּרְךָ עָלָיו sa pagdadalisay ng altar
  choice: 'Isalin nang temporal: ''kapag nagbabayad-sala ka para rito.'''
  alternative: 'Isalin nang instrumental: ''sa pamamagitan ng pagbabayad-sala para rito,'' o locative: ''kapag nagbabayad-sala ka sa ibabaw nito.'''
  rationale: Pinahihintulutan ng Hebreo ang temporal o instrumental na diwa. Ang temporal na salin ay natural sa Tagalog at umaayon sa pagkakasunod ng mga ritwal, habang ang 'para rito' ay kumikilala sa altar bilang malamang na tinutukoy ng hulaping panghalip.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang pormal ngunit pangkaraniwang bokabularyong panrelihiyon—'altar,' 'handog para sa kasalanan,' 'magbayad-sala,' 'dadalisayin,' at 'italaga'—nang hindi nagiging arkaiko. Ang 'papahiran ng langis' ay mas malinaw sa karaniwang mambabasa kaysa sa payak na 'papahiran'.
