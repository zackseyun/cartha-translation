base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang dibdib ng lalaking tupa ng pagtatalaga para kay Aaron[a], at iwagayway mo iyon bilang handog na iwinagayway sa harap ni Yahweh. Iyon ang magiging bahagi mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lalaking tupa ng pagkatalaga.” Ang teknikal na terminong Hebreo ay tumutukoy sa lalaking tupang ginagamit sa seremonya ng paglalagay kay Aaron sa tungkulin bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: ang dibdib
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa tiyak na bahagi ng hayop na inilalaan ayon sa kautusan para sa mga pari.
- source_word: אֵיל
  choice: lalaking tupa
  rationale: Ito ang likas at malinaw na modernong Tagalog para sa adult male sheep na ginagamit sa ritwal.
- source_word: הַמִּלֻּאִים
  choice: para sa pagtatalaga
  rationale: Teknikal itong katawagan para sa seremonya ng paglalagay kay Aaron sa tungkulin bilang pari; mas madaling maunawaan ang “pagtatalaga” kaysa sa literal na “pagpupuno.”
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: kay Aaron
  rationale: Pinananatili nito ang kaugnayan ng partikular na lalaking tupa kay Aaron nang hindi ipinapalagay na pag-aari niya iyon.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: iwagayway mo iyon bilang handog na iwinawagayway
  rationale: Pinananatili ang pag-uulit ng pandiwa at kaugnay na pangngalan sa Hebreo at ang teknikal na kilos sa ritwal.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Likas na salin ito ng pariralang pangkulto at itinuturing ang Yahweh bilang personal na pangalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: Iyon ang magiging bahagi mo
  rationale: Ang מָנָה ay isang nakalaang bahagi o kaparte; malinaw at likas sa Tagalog ang “bahagi mo.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalang YHWH ang nasa tekstong Hebreo, kaya pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Teknikal na katawagang הַמִּלֻּאִים sa ritwal ng paglalagay sa tungkulin
  choice: pagtatalaga
  alternative: pagkatalaga; paglalaan; literal na pagpupuno
  rationale: Ipinahihiwatig ng konteksto ang seremonya ng paglalagay kay Aaron sa tungkulin bilang pari. Hindi nito ipinapasok ang mga natatanging kaayusan ng alinmang makabagong denominasyon.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “lalaking tupa” sa halip na mas bihirang “barakong tupa,” at pinanatili ang teknikal na pariralang “handog na iwinawagayway.”
