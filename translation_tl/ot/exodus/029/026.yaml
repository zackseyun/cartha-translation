    issue: Malabong pagkakaugnay ng pariralang "para sa pagtatalaga kay Aaron"
    rationale: Sa kasalukuyang ayos, maaari itong pansamantalang mabasa bilang paglalarawan sa "dibdib." Ang paggamit ng "lalaking tupa ng pagtatalaga para kay Aaron" ay mas malinaw na inilalakip ang parirala sa lalaking tupa, gaya ng Hebreo.
  - severity: low
    issue: Hindi gaanong likas ang "handog na iwinawagayway" pagkatapos ng "iwagayway mo"
    rationale: Ang "iwagayway mo iyon bilang handog na iwinagayway" ay mas maayos na Tagalog at nagpapahayag pa rin ng cognate ritual expression sa Hebreo.
