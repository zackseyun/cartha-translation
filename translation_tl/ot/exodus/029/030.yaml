base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: tl
  text: Sa loob ng pitong araw, isusuot[a] ng paring hahalili sa kanya, na isa sa kanyang mga anak, ang mga iyon kapag papasok siya sa Tolda ng Tipanan upang maglingkod sa banal na lugar[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “susuotin.” Maaaring mangahulugan ang pandiwang Hebreo ng “isuot” o “suotin,” ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “ang pari sa kanyang lugar mula sa kanyang mga anak,” na tumutukoy sa paring hahalili sa kanya.
    reason: lexical_alternative
  - marker: c
    text: O “sa santuwaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sa loob ng pitong araw
  rationale: Likas na ipinahahayag sa Filipino ang akusatibong nagsasaad ng tagal sa pariralang “sa loob ng,” na nililinaw ang buong panahong tinutukoy.
- source_word: יִלְבָּשָׁם
  choice: isusuot ang mga iyon
  rationale: Maaaring mangahulugan ang לָבַשׁ ng pagsusuot bilang kilos o ng pagkakaroon ng kasuotan sa katawan. Ang “isusuot” ay kongkreto at malinaw na tumutukoy sa mga kasuotang pangpari sa naunang konteksto, habang inilalahad sa talababa ang alternatibo.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: paring mula sa kanyang mga anak na hahalili sa kanya
  rationale: Ipinapahayag ng “hahalili sa kanya” ang pagkuha sa tungkulin, samantalang pinananatili ng “mula sa kanyang mga anak” ang partitive at pampamilyang diwa ng Hebreo.
- source_word: אֲשֶׁר יָבֹא
  choice: kapag pumapasok siya
  rationale: Bagaman pormal na sugnay na relatibo, inilalarawan nito rito ang kalagayan o pagkakataon ng pagpasok ng kahaliling pari para maglingkod.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Ito ay malinaw at nakaugaliang salin sa modernong Filipino para sa itinakdang tolda ng pakikipagtagpo sa kontekstong tabernakulo.
- source_word: לְשָׁרֵת
  choice: upang maglingkod
  rationale: Ang “maglingkod” ay natural sa Filipino at angkop kapwa sa pormal at sagradong paglilingkod ng pari.
- source_word: בַּקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Pinananatili nito ang kongkretong pagtukoy sa sagradong espasyo ng paglilingkod sa tolda, nang hindi ginagawang pangkalahatang abstraksiyon ang קֹדֶשׁ.
theological_decisions:
- issue: Wika tungkol sa paghalili sa pagkapari
  choice: paring mula sa kanyang mga anak na hahalili sa kanya
  alternative: paring mula sa kanyang mga anak na papalit sa kanya / paring nasa kanyang kalagayan mula sa kanyang mga anak
  rationale: Sa konteksto, ang parirala ay tumutukoy sa paghalili sa tungkuling pangpari, hindi lamang sa pagpalit ng kinalalagyan. Hindi nito dinaragdagan ang teksto ng anumang doktrina tungkol sa paghalili na lampas sa Aaronikong konteksto.
- issue: Sagradong lokasyon ng בַּקֹּדֶשׁ
  choice: sa banal na lugar
  alternative: sa santuwaryo
  rationale: Pinananatili ng “banal na lugar” ang kongkretong sanggunian sa sagradong espasyo, habang kinikilala sa talababa na maaari ring unawain ang termino bilang “santuwaryo.”
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “paring” at “toldang tipanan” bilang malinaw na bokabularyong pangkulto; iniwasan ang labis na teknikal o makalumang pananalita. Ang ayos ng pangungusap ay likas sa Filipino habang pinananatili ang tagal, tagapagmana sa tungkulin, layunin ng pagpasok, at sagradong lokasyon.
