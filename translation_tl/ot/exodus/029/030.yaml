  to: Sa loob ng pitong araw, isusuot[a] ng paring hahalili sa kanya, na isa sa kanyang mga anak, ang mga iyon kapag papasok siya sa Tolda ng Tipanan upang maglingkod sa banal na lugar[c].[b]
