  naturalness: 'May ilang hindi likas o hindi gaanong malinaw na pahayag: ang “paring mula sa kanyang mga anak” ay mas maayos bilang “paring hahalili sa kanya, na isa sa kanyang mga anak”; ang “daramtin” sa talababa ay hindi ang pinakanatural na modernong alternatibo para sa kasuotan.'
  terminology: Ang “Tolda ng Tipanan,” “maglingkod,” at “banal na lugar” ay angkop sa kultikong konteksto. Pinananatili ng “hahalili” ang diwa ng paghalili sa tungkuling pangpari nang hindi nagdaragdag ng teolohikal na pagpapakahulugan.
