base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: tl
  text: At malalaman nilang ako si Yahweh, ang kanilang Diyos, na naglabas sa kanila mula sa lupain ng Egipto upang ako ay manahan sa gitna nila[a]. Ako si Yahweh, ang kanilang Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa piling nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: At malalaman nila
  rationale: Ang anyong pandiwa sa konteksto ay nagpapahayag ng magiging bunga ng naunang mga pangako at tagubilin. Ang “malalaman” ay natural sa makabagong Tagalog at nagpapanatili ng hinaharap na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang transliterasyon ng personal na pangalang banal sa halip na palitan ito ng titulong “Panginoon.”
- source_word: אֱלֹהֵיהֶם
  choice: ang kanilang Diyos
  rationale: Bagaman anyong maramihan ang pangngalang Hebreo, malinaw na iisang Diyos ng Israel ang tinutukoy sa pagkakaugnay nito sa Yahweh at sa tipanang konteksto.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: naglabas sa kanila mula sa lupain ng Egipto
  rationale: Pinananatili nito ang karaniwang pananalita tungkol sa paglabas mula sa Egipto at ang puwersa ng pang-ukol na מִן, habang natural pa rin sa Tagalog.
- source_word: לְשָׁכְנִי
  choice: upang manahan ako
  rationale: 'Ang infinitive na may לְ ay nagpapahayag dito ng layunin: inilabas ng Diyos ang Israel upang manahan siya sa piling nila.'
- source_word: בְתוֹכָם
  choice: sa gitna nila
  rationale: Malapit itong tumutugma sa idyomang Hebreo at malinaw na nagpapahayag ng presensiya ng Diyos sa mismong pamayanan.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: Ako si Yahweh, ang kanilang Diyos
  rationale: Pinananatili ang mariing pormulang tipanan at inuulit ito ayon sa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng isang titulo.
- issue: Kabuluhan ng pariralang לְשָׁכְנִי sa layunin ng paglabas
  choice: upang manahan ako sa gitna nila
  alternative: para manahan sa gitna nila
  rationale: Pinakamalamang na nagpapahayag ng layunin ang לְ kasama ng infinitive. Hindi dinaragdagan ng salin ang teolohiya ng talata; nililinaw lamang nito ang relasyong gramatikal.
translation_notes:
  register: Makabago at dignified na Filipino ang ginamit. Ang pinaikling “malalaman nilang” ay likas sa kasalukuyang Tagalog, samantalang ang “lupain ng Egipto” at “manahan” ay nagpapanatili ng marangal na himig na angkop sa tekstong biblikal.
