    issue: Hindi tumpak ang talababa sa “sa kalooban nila.”
    rationale: Ang בְּתוֹכָם ay “sa gitna nila” o “sa piling nila,” hindi “sa kalooban nila” sa diwang panloob na damdamin o pagkatao. Maaari nitong baguhin ang kahulugan ng presensiya ni Yahweh sa gitna ng Israel.
  revised_text: At malalaman nilang ako si Yahweh, ang kanilang Diyos, na naglabas sa kanila mula sa lupain ng Egipto upang ako ay manahan sa gitna nila[a]. Ako si Yahweh, ang kanilang Diyos.
