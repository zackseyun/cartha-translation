  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: tl
  text: Ihahandog mo ang isang kordero sa umaga, at ihahandog mo ang ikalawang kordero sa pagitan ng dalawang dapithapon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng dalawang dapithapon,” isang tradisyonal na pananalitang madalas unawain bilang “sa dapithapon” o bilang panahong mula sa huling bahagi ng hapon hanggang sa paglubog ng araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: kordero
  rationale: Sa konteksto ng paghahandog, tumutukoy ito sa batang tupa na angkop na handog. Ang “kordero” ay maikli, natural, at pamilyar sa wikang biblikal na Filipino.
- source_word: הָאֶחָד
  choice: ang isang
  rationale: Pinananatili nito ang literal na diwa na “ang isa,” sa halip na gawing “ang una”; malinaw pa rin ang pagkakasunod dahil kasunod nito ang “ikalawa.”
- source_word: תַּעֲשֶׂה
  choice: ihahandog mo
  rationale: Bagaman karaniwang nangangahulugang “gawin” ang pandiwa, sa tagubiling panghandog ay tumutukoy ito sa pagsasagawa o paghahandog ng hain. Mas malinaw at likas dito ang “ihahandog mo.”
- source_word: בַבֹּקֶר
  choice: sa umaga
  rationale: Ito ang tuwiran at natural na panandang-panahon sa modernong Filipino.
- source_word: הַשֵּׁנִי
  choice: ang ikalawang
  rationale: Tuwirang pinananatili ang ordinal at ang pagkakasunod ng dalawang araw-araw na handog.
- source_word: בֵּין הָעַרְבָּיִם
  choice: sa pagitan ng dalawang gabi
  rationale: Pinananatili sa pangunahing teksto ang kakaiba at pinagtatalunang Hebreong idyoma, kabilang ang anyong dalawahan ng “gabi,” sa halip na tahimik itong ipakahulugang “sa dapithapon.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “kordero” bilang pamilyar na katawagang panghandog. Sadyang pinanatili sa teksto ang di-karaniwang pariralang “sa pagitan ng dalawang gabi,” at inilagay kaagad pagkatapos nito ang talababa upang mapanatili ang tunay na kalabuan ng Hebreo.
