base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: tl
  text: Ito ay magiging palagiang handog na sinusunog[a] sa lahat ng salinlahi ninyo, sa pasukan ng Tolda ng Pagtatagpo sa harap ni Yahweh. Doon ako makikipagtagpo sa inyo[b] upang magsalita sa iyo roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tuluy-tuloy na handog na sinusunog” o “panghabang-panahong handog na sinusunog.”
    reason: lexical_alternative
  - marker: b
    text: Mula sa maramihang “sa inyo,” lumilipat ang Hebreo sa isahang “sa iyo,” malamang na upang ibukod ang mas malawak na bayan o mga pari kay Moises na siyang tiyak na kakausapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: palagiang handog na sinusunog
  rationale: Ang עֹלָה ay handog na lubusang sinusunog, at ang תָּמִיד ay tumutukoy sa regular at nagpapatuloy na pag-aalay. Likas sa modernong Tagalog ang “palagiang” at hindi nito ipinahihiwatig na walang anumang patlang ang pagsasagawa.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahahayag ng parirala ang patuloy na bisa ng utos sa magkakasunod na salinlahi.
- source_word: פֶּתַח
  choice: sa pasukan
  rationale: Ang פֶּתַח ay ang bukana o pasukan ng isang gusali o tolda; malinaw at natural dito ang “pasukan.”
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtatagpo
  rationale: Pinananatili nito ang larawan ng tolda at ang tungkulin nitong pook na itinakda para sa pakikipagtagpo, nang hindi ito ginagawang pangkalahatang “tipanan.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay may lokatibo at panritwal na diwang “sa harap” o “sa presensiya,” at ang personal na pangalang יהוה ay isinaling Yahweh.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: Doon ako makikipagtagpo sa inyo
  rationale: Ang Niphal ng יעד ay tumutukoy sa pakikipagtagpo ayon sa itinakdang panahon o lugar. Ang “sa inyo” ay sadyang maramihan, gaya ng לָכֶם.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: upang magsalita sa iyo roon
  rationale: Ipinakikita ng infinitive ang layunin ng pakikipagtagpo. Pinananatili ng “sa iyo” ang isahang anyo ng אֵלֶיךָ, na malamang na tumutukoy kay Moises.
theological_decisions:
- issue: Pagpapahayag sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Paglipat mula sa maramihang panghalip tungo sa isahan
  choice: “sa inyo” at pagkatapos ay “sa iyo”
  alternative: Pag-isahin ang dalawa bilang maramihan o bilang isahan
  rationale: Maramihan ang לָכֶם ngunit isahan ang אֵלֶיךָ. Pinananatili ang tunay na pagbabago ng bilang, na maaaring magbukod sa mas malawak na pangkat at kay Moises bilang tiyak na kinakausap.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado ngunit madaling maunawaan. Ginamit ang “Tolda ng Pagtatagpo” upang maging malinaw ang kahulugan ng אֹהֶל מוֹעֵד. Sadyang pinanatili ang pagbabago mula sa maramihang “inyo” tungo sa isahang “iyo.”
