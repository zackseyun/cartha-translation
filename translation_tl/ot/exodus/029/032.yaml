base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: tl
  text: Si Aaron at ang kanyang mga anak na lalaki ay kakain ng laman[a] ng lalaking tupa at ng tinapay na nasa basket sa pasukan ng Tolda ng Pagtitipon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “karne ng lalaking tupa.” Literal na “laman” ang salitang Hebreo, ngunit sa konteksto ng paghahandog ay maaari itong tumukoy sa karneng kinakain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַל
  choice: Kakainin
  rationale: Sa konteksto ng mga tagubilin para sa ritwal, ang anyong Hebreo ay may itinakda o preskriptibong diwa, hindi simpleng nagsasalaysay ng nakalipas. Ipinahahayag ng “Kakainin” ang itinakdang gawain nang hindi pinatitindi bilang tahasang utos na “dapat.”
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalan sa makabagong Tagalog na salin ng Bibliya.
- source_word: וּ/בָנָי/ו
  choice: at ng kanyang mga anak na lalaki
  rationale: Ang בנים ay tumutukoy rito sa mga lalaking anak ni Aaron na kasama sa pagtatalaga bilang mga pari; pinananatili ng salin ang tiyak na kasarian at kaugnayang pampamilya ng teksto.
- source_word: בְּשַׂר
  choice: ang laman
  rationale: Ang בשר ay literal na “laman,” at maaari ring tumukoy sa karneng kinakain sa konteksto ng handog. Pinananatili ng “laman” ang konkreto at ritwal na diwa; inilagay sa talababa ang likas na alternatibong “karne.”
- source_word: הָ/אַיִל
  choice: ng lalaking tupa
  rationale: Ang אַיִל ay isang adultong lalaking tupa; malinaw at madaling maunawaan ang katutubong pariralang ito.
- source_word: הַ/לֶּחֶם
  choice: ang tinapay
  rationale: Karaniwang kahulugan ng לֶחֶם ang “tinapay.” Dito ay maaari itong gamiting pangkalahatang isahan para sa mga tinapay na nabanggit sa naunang konteksto.
- source_word: אֲשֶׁר בַּ/סָּל
  choice: na nasa basket
  rationale: Tuwirang inilalarawan ng sugnay ang tinapay na nakalagay sa basket; natural ito sa modernong Tagalog.
- source_word: פֶּתַח
  choice: sa pasukan ng
  rationale: Ang פֶּתַח ay tumutukoy sa pasukan o bukana. Ang “sa pasukan ng” ay natural at malinaw na lokatibong pahayag.
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtitipon
  rationale: Isinasalin nito ang kultikong katawagan bilang tolda kung saan nagaganap ang itinakdang pakikipagtagpo o pagtitipon, nang hindi ipinagpapalit ang מוֹעֵד sa salitang “tipan.”
theological_decisions:
- issue: Tiyak na panlalaking pagtukoy sa konteksto ng pagkapari
  choice: at ng kanyang mga anak na lalaki
  alternative: at ng kanyang mga anak
  rationale: Ang ritwal ay para kay Aaron at sa kanyang mga lalaking anak na itinatalaga bilang mga pari. Ang tahasang “mga anak na lalaki” ay nagpapanatili sa tiyak na tinutukoy ng Hebreo at hindi ginagawang pangkalahatan ang saklaw.
- issue: Diwang preskriptibo ng pandiwa sa tagubiling panritwal
  choice: Kakainin
  alternative: Dapat kainin; kinain
  rationale: Sa kontekstong legal at panritwal, ang pandiwa ay nagsasaad ng gawaing itinakdang isagawa. Ang aspektong kontemplatibo sa “Kakainin” ay nagpapanatili sa preskriptibo at hinaharap na diwa nang hindi nagdaragdag ng tahasang modal na wala sa anyo mismo.
- issue: Kahulugan ng אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtitipon
  alternative: Toldang Tipanan; Tolda ng Pakikipagtagpo
  rationale: Ang מוֹעֵד ay kaugnay ng itinakdang panahon, pagtitipon, o pakikipagtagpo, hindi ng salitang Hebreo para sa “tipan.” Pinili ang “Pagtitipon” bilang malinaw at neutral na katawagang kultiko.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “lalaking tupa” sa halip na mas di-pamilyar na “barakong tupa,” at “Tolda ng Pagtitipon” upang maging malinaw habang nananatiling malapit sa Hebreo.
