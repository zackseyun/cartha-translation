base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: tl
  text: Pagkatapos, katayin mo ang lalaking tupa. Kumuha ka ng kaunti sa dugo nito at ipahid sa pingol[a] ng kanang tainga ni Aaron at sa pingol ng kanang tainga ng kanyang mga anak na lalaki, gayundin sa hinlalaki ng kanilang kanang kamay at sa hinlalaki ng kanilang kanang paa. At ihagis mo ang dugo[b] sa lahat ng panig ng altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “dulo ng kanang tainga ni Aaron ... dulo ng kanang tainga ng kanyang mga anak na lalaki.” Maaaring tumukoy ang salitang Hebreo sa dulong bahagi ng tainga sa mas pangkalahatang diwa, bagaman malamang na “pingol” ang ibig sabihin sa ritwal na ito.
    reason: lexical_alternative
  - marker: b
    text: O “ibulwak mo ang dugo sa lahat ng panig ng altar.” Ang pandiwang Hebreo ay nagpapahiwatig ng malakas na ritwal na paglalagay ng dugo, hindi ng banayad na pagwiwisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: katayin
  rationale: Sa konteksto ng paghahandog, tiyak at likas sa Filipino ang “katayin,” hindi lamang ang pangkalahatang “patayin.”
- source_word: אַיִל
  choice: lalaking tupa
  rationale: Malinaw at karaniwang salin ito para sa adult na lalaking tupa; mas madaling maunawaan kaysa sa hiram o teknikal na katawagan.
- source_word: מִדָּמוֹ
  choice: kaunti sa dugo nito
  rationale: Ipinahihiwatig ng מִן na isang bahagi ng dugo ang kukunin para sa ritwal na paglalagay.
- source_word: תְּנוּךְ אֹזֶן
  choice: pingol ng ... tainga
  rationale: Ang “pingol” ang natural at tiyak na katawagang Filipino para sa ear lobe, na malamang na tinutukoy sa kontekstong ritwal.
- source_word: הַיְמָנִית
  choice: kanan
  rationale: Tuwirang ipinakikita ang kanang tainga, kamay, at paa na tinutukoy ng Hebreong pang-uri.
- source_word: בֹּהֶן יָד
  choice: hinlalaki ng ... kamay
  rationale: Ang בֹּהֶן kapag tumutukoy sa kamay ay ang thumb; nilinaw ang “kamay” upang iwasan ang kalituhan.
- source_word: בֹּהֶן רֶגֶל
  choice: hinlalaki sa paa
  rationale: Karaniwan at malinaw na katawagang Filipino para sa big toe.
- source_word: זָרַק
  choice: ihagis ... sa
  rationale: Pinananatili nito ang malakas na ritwal na pagkilos ng pandiwa, sa halip na ang mas banayad na “wisikan.”
- source_word: סָבִיב
  choice: sa lahat ng palibot
  rationale: Pinananatili ang distributibong diwa na inilalagay ang dugo sa paligid ng altar.
- source_word: וְ
  choice: Pagkatapos / at / gayundin
  rationale: Likas na inilalahad sa Filipino ang sunod-sunod na hakbang ng ritwal habang pinananatili ang ugnayan ng mga sugnay.
