revisions:
- from: Pagkatapos, katayin mo ang lalaking tupa. Kumuha ka ng kaunti sa dugo nito at ipahid sa pingol[a] ng kanang tainga ni Aaron at sa pingol ng kanang tainga ng kanyang mga anak, gayundin sa hinlalaki ng kanilang kanang kamay at sa hinlalaki sa paa ng kanilang kanang paa. Pagkatapos, ihagis mo ang dugo sa lahat ng palibot ng altar.[b]
  to: Pagkatapos, katayin mo ang lalaking tupa. Kumuha ka ng kaunti sa dugo nito at ipahid sa pingol[a] ng kanang tainga ni Aaron at sa pingol ng kanang tainga ng kanyang mga anak na lalaki, gayundin sa hinlalaki ng kanilang kanang kamay at sa hinlalaki ng kanilang kanang paa. At ihagis mo ang dugo[b] sa lahat ng panig ng altar.
  rationale: Ginawang tahasan ang "mga anak na lalaki" upang tumbasan ang Hebreo, inayos ang parirala para sa hinlalaki ng paa upang maging likas at walang pag-uulit, at inangkla ang talababa b sa pandiwang inililinaw nito. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
