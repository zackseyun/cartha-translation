base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang lahat ng taba na bumabalot sa mga laman-loob, ang bahaging nasa atay[a], ang dalawang bato, at ang taba na nasa ibabaw ng mga ito. Sunugin mo ang lahat ng iyon sa altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “umbok ng atay.” Tumutukoy ang salitang Hebreo sa isang tiyak na bahaging kaugnay ng atay, ngunit hindi tiyak ang eksaktong pagkakakilanlan nito sa makabagong anatomiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pagkatapos, kunin mo
  rationale: Ang Qal perfect na may waw sa sunod-sunod na tagubilin ay gumaganap bilang utos. Likas sa makabagong Tagalog ang pautos na “kunin mo,” at ipinahihiwatig ng “pagkatapos” ang pagkakasunod-sunod.
- source_word: כָּל הַחֵלֶב
  choice: lahat ng taba
  rationale: Tumutukoy ang חֵלֶב sa matatabang bahagi ng hayop na inihahandog. Ang “taba” ang pinakakaraniwan at malinaw na katumbas sa Tagalog.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: bumabalot sa mga laman-loob
  rationale: Sa kontekstong ito, ang קֶרֶב ay tumutukoy sa mga panloob na bahagi o organo ng hayop. Konkreto at likas ang “mga laman-loob,” at ang “bumabalot” ay tapat sa participle na מְכַסֶּה.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: ang bahaging nakakabit sa atay[a]
  rationale: Hindi tiyak ang eksaktong makabagong katawagang anatomiko para sa יוֹתֶרֶת. Iniiwasan ng “bahaging nakakabit sa atay” ang labis na katiyakan habang malinaw na ipinapakita ang kaugnayan nito sa atay.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: ang dalawang bato
  rationale: Ang “bato” ang karaniwang katawagang Tagalog para sa kidney; malinaw sa kontekstong anatomiko ang “dalawang bato.”
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: ang tabang nasa ibabaw ng mga ito
  rationale: Tuwirang pinananatili ng “nasa ibabaw ng mga ito” ang diwa ng עֲלֵיהֶן at ang pagtukoy nito sa dalawang bato.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: Sunugin mo ang lahat ng iyon sa altar
  rationale: Sa ritwal na konteksto, ang Hiphil ng קטר ay tumutukoy sa pagsusunog ng mga bahaging handog sa altar. Malinaw at likas ang “sunugin,” samantalang ipinapakita ng “sa altar” ang sakripisyal na konteksto at ang direksiyon ng ה־.
