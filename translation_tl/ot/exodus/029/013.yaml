  register: Makabago, malinaw, at marangal na Tagalog ang ginamit. Pinili ang tuwirang pautos na anyo para sa ritwal na tagubilin, at hinati sa dalawang pangungusap upang maiwasan ang mabigat na mahabang talaan nang hindi binabago ang ugnayang sintaktiko o kahulugan.
