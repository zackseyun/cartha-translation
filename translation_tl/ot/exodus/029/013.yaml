  source_fidelity: 'Kailangang palitan ang “tabang” ng “taba”: ang חֵלֶב ay tumutukoy sa taba/matatabang bahagi ng hayop, samantalang ang “tabang” sa makabagong Filipino ay karaniwang nangangahulugang walang alat o lasa. Ang natitirang talaan at ang utos na sunugin ang mga bahagi sa altar ay tapat sa Hebreo.'
  naturalness: Likas at malinaw ang pautos na “kunin mo” at “sunugin mo.” Ang “mga laman-loob,” “dalawang bato,” at “altar” ay angkop sa ritwal na tagubilin. Ang “bahaging nakakabit sa atay” ay mauunawaan, ngunit mas malapit ang “bahaging nasa atay” sa Hebreong עַל, habang pinananatili ng talababa ang kawalang-katiyakan sa eksaktong pagkakakilanlang anatomiko.
  terminology: Gamitin ang “taba,” hindi “tabang,” para sa חֵלֶב. Nananatiling angkop ang “mga laman-loob” para sa קֶרֶב at “mga bato” para sa כְּלָיוֹת. Hindi dapat ipilit ang “umbok” bilang pangunahing salin para sa יוֹתֶרֶת dahil hindi tiyak ang eksaktong anatomiya.
