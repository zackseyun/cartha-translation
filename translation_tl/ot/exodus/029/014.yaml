  text: וְ/אֶת בְּשַׂ֤ר הַ/פָּר֙ וְ/אֶת עֹר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ תִּשְׂרֹ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: tl
  text: Ngunit ang laman ng toro, ang balat nito, at ang dumi nito ay susunugin mo sa apoy sa labas ng kampo. Ito ay handog para sa kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “handog para sa paglilinis.” Ang Hebreong חַטָּאת ay maaaring tumukoy sa “kasalanan” o sa handog na inihahandog kaugnay nito. Sa mga kontekstong sakripisyal na gaya nito, marami ang nagsasaling “handog para sa kasalanan,” samantalang pinipili ng iba ang “handog para sa paglilinis” upang idiin ang tungkulin ng ritwal na maglinis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: ang laman ng toro
  rationale: Ang “laman” ay tuwiran at angkop sa konteksto ng paghahandog; ang פַּר ay karaniwang tumutukoy sa toro sa mga batas tungkol sa paghahandog.
- source_word: עֹרוֹ
  choice: ang balat nito
  rationale: Ang “balat” ang natural at malinaw na tawag sa hide ng hayop sa modernong Filipino.
- source_word: פִּרְשׁוֹ
  choice: ang dumi nito
  rationale: Tumutukoy ang פֶּרֶשׁ sa dumi o tae, hindi sa lamang-loob; pinananatili ng “dumi” ang tiyak na kahulugan nang may dignidad.
- source_word: תִּשְׂרֹף
  choice: susunugin mo
  rationale: Ang ikalawang panauhang panlalaking isahan sa kontekstong kautusan ay natural na naihahayag sa Filipino sa anyong “susunugin mo,” na may puwersang tagubilin.
- source_word: בָּאֵשׁ
  choice: sa apoy
  rationale: Natural na idyomang Filipino ito para sa pagsunog sa pamamagitan ng apoy.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: sa labas ng kampo
  rationale: Karaniwan, malinaw, at tumpak na katumbas ng lokasyong nasa labas ng hangganan ng kampo.
- source_word: חַטָּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong sakripisyal, tumutukoy ito sa handog na kaugnay ng kasalanan. Ang pariralang ito ay natural sa Filipino at hindi napagkakamalang ang handog mismo ang kasalanan.
- source_word: הוּא
  choice: iyon
  rationale: Tinutukoy at kinikilala ng panghalip ang toro o ritwal bilang handog para sa kasalanan.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: ang ... ang ... at ang ...
  rationale: Pinananatili ang malinaw na talaan ng mga bahaging susunugin, ngunit inaangkop ang koordinasyon sa natural na Filipino.
theological_decisions:
- issue: Kahulugan ng חַטָּאת sa batas tungkol sa paghahandog
  choice: handog para sa kasalanan
  alternative: handog para sa paglilinis
  rationale: Pangunahing sakripisyal ang diwa sa konteksto. Pinananatili sa pangunahing teksto ang kinikilalang kaugnayan nito sa kasalanan, habang inilalahad sa talababa ang saling nagbibigay-diin sa ritwal na paglilinis upang hindi tahimik na lutasin ang leksikal at teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “toro,” “balat,” “dumi,” at “kampo” bilang karaniwang kasalukuyang bokabularyo. Inilagay ang talababa kaagad pagkatapos ng terminong tinutukoy nito.
