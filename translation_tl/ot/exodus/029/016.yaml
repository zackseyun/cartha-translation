  yaml_path: translation/ot/exodus/029/016.yaml
  text: And you shall slaughter the ram, and take its blood and throw it against the altar all around.
translation:
  language: tl
  text: At katayin mo ang lalaking tupa, kunin mo ang dugo nito, at ihagis mo ito sa altar, sa buong palibot nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: At katayin mo
  rationale: Tuwirang ipinapahayag ang ritwal na pagkatay habang pinananatili ang ikalawang panauhang isahan ng pandiwang Hebreo.
- source_word: הָאָיִל
  choice: ang lalaking tupa
  rationale: Ang אַיִל ay isang adultong lalaking tupa; mas malinaw ito sa karaniwang mambabasa kaysa sa hiram o teknikal na katawagan.
- source_word: וְזָרַקְתָּ
  choice: at ihagis mo
  rationale: Pinananatili ang kongkretong lakas ng זָרַק, ‘ihagis,’ sa halip na gawing mas tiyak ang paraan bilang ‘iwisik’ o ‘isaboy.’
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: sa palibot ng altar
  rationale: Likas na Tagalog para sa pamamahagi ng dugo laban o patungo sa altar sa lahat ng panig, nang hindi nagdaragdag ng paraang hindi tahasang sinasabi.
theological_decisions:
- issue: Paraan ng paglalagay ng dugo sa altar
  choice: ihagis
  alternative: iwisik / isaboy
  rationale: Ang Hebreong זָרַק ay literal na ‘ihagis’ at hindi kailangang ipakahulugang isang partikular na ritwal na paraan; pinananatili ng salin ang pagiging kongkreto at ang posibleng lawak ng kahulugan.
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino; pinanatili ang sunod-sunod na utos at ritwal na tono ng orihinal.
