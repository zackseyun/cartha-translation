  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: tl
  text: At ilapit mo ang kanyang mga anak na lalaki at bihisan sila ng mga tunika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iharap mo ang kanyang mga anak na lalaki.” Sa Hebreo, ang pandiwa ay maaaring tumukoy sa pagpapalapit sa isang tao upang ritwal na iharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: At
  rationale: Ang pangatnig ay nag-uugnay sa utos na ito sa naunang serye; hindi hiwalay na isinasalin ang pananda sa tuwirang layon.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ni Aaron ang tinutukoy sa konteksto ng pagtatalaga sa pagkapari, kaya hindi ginamit ang mas pangkalahatang “mga anak.”
- source_word: תַּקְרִיב
  choice: ilapit mo
  rationale: Ang Hiphil ng קרב ay nangangahulugang magpalapit o magharap, lalo na sa ritwal na konteksto. Pinananatili ng “ilapit” ang kongkretong larawan at ritwal na pahiwatig.
- source_word: וְהִלְבַּשְׁתָּם
  choice: at bihisan sila
  rationale: Likas at malinaw sa modernong Tagalog ang “bihisan,” at angkop ito sa pormal na pagsusuot ng kasuotang pangpari.
- source_word: כֻּתֳּנֹת
  choice: mga tunika
  rationale: Ang כֻּתֹּנֶת ay kasuotang isinusuot sa katawan; ang “tunika” ang pinakatiyak na katawagang hindi ipinagkakamali sa balabal o modernong amerikana.
