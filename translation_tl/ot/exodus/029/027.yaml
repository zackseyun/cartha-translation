  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: tl
  text: At italaga mo bilang banal ang dibdib ng handog na iwinawagayway at ang hita ng handog na itinataas[a]—na iwinagayway at itinaas—mula sa lalaking tupa para sa pagtatalaga[b], mula sa bahaging para kay Aaron at sa bahaging para sa kanyang mga anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hita ng itinaas na handog”; tradisyonal na tinatawag itong “handog na iniangat.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lalaking tupa ng mga pagpuno,” isang idyoma para sa tupang ginagamit sa pagtatalaga ng mga pari.
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: italaga mong banal
  rationale: Ipinahahayag ng Piel ng קדשׁ ang pagbubukod bilang banal. Ang pariralang ito ay likas sa modernong Filipino at pinananatili ang puwersang panritwal.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dibdib ng handog na iwinawagayway
  rationale: Ang חֲזֵה ay bahagi ng dibdib ng hayop, at ang תְּנוּפָה ay tumutukoy sa ritwal na pagwawagayway. Pinananatili rin nito ang kaugnayan sa pandiwang הוּנַף.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: hita ng handog na itinataas
  rationale: Ang שׁוֹק ay ang hita o itaas na bahagi ng hulihang binti. Ang תְּרוּמָה ay isang bahaging itinaas at ibinukod bilang handog; malinaw ang saling ito at hindi gumagamit ng makalumang terminolohiya.
- source_word: הוּנַף וַאֲשֶׁר הוּרָם
  choice: na iwinagayway at itinaas
  rationale: Pinananatili ang dalawang magkaibang ritwal na kilos at ang tahasang ugnayan ng mga pandiwa sa naunang mga pangngalan.
- source_word: אֵיל הַמִּלֻּאִים
  choice: lalaking tupa para sa pagtatalaga
  rationale: Ang literal na parirala ay 'lalaking tupa ng mga pagpuno,' isang idyoma para sa tupang ginagamit sa pagtatalaga ng mga pari. Ang 'para sa pagtatalaga' ay malinaw at hindi labis na denominasyonal.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: mula sa bahaging para kay Aaron at sa bahaging para sa kanyang mga anak
  rationale: Ipinakikita ng pag-uulit ng konstruksyon ang magkahiwalay na bahaging inilaan kay Aaron at sa kanyang mga anak; nililinaw ito nang hindi ipinapalagay ang higit pa sa teksto.
theological_decisions:
- issue: Pagsasalin ng mga teknikal na katawagang pansakripisyo
  choice: Panatilihin ang kongkretong mga kilos na 'iwinawagayway' at 'itinataas' at tawaging mga handog ang mga kaugnay na bahagi.
  alternative: Gumamit ng pangkalahatang 'inihahandog' o 'natatanging bahagi.'
  rationale: Sinasadyang pag-ugnayin ng Hebreo ang mga pangngalan at pandiwa ng dalawang ritwal na kilos. Ang kongkretong wika ay mas tapat sa pamamaraang inilalarawan at hindi pinapawi ang pagkakaiba ng mga ito.
- issue: Kahulugan ng מִלֻּאִים sa ritwal ng mga pari
  choice: Isalin sa teksto bilang 'pagtatalaga' at ilagay sa talababa ang literal na anyo.
  alternative: Isalin nang literal bilang 'mga pagpuno' o gamitin ang 'ordinasyon.'
  rationale: Sa kontekstong ito, idyoma ang 'mga pagpuno' para sa pagluklok o pagtatalaga sa tungkulin ng pagkasaserdote. Ang 'pagtatalaga' ay natural at malawak na nauunawaan, samantalang pinananatili ng talababa ang anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lalaking tupa' sa halip na mas bihirang 'barakong tupa,' at pinanatili ang teknikal na pagkakaiba ng pagwawagayway at pagtataas. Parehong marker na [a] at [b] ay nasa pangunahing teksto.
