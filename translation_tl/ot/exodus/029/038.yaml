  text: 'Ito ang ihahandog mo sa altar: dalawang korderong tig-iisang taóng gulang bawat araw, nang palagian.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gagawin mo sa altar.” Malawak ang kahulugan ng pandiwang Hebreo na “gawin,” ngunit dito ay tumutukoy ito sa pagsasagawa ng paghahandog.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ng isang taon,” ibig sabihin, mga korderong tig-iisang taóng gulang.
    reason: lexical_alternative
  - marker: c
    text: O “bawat araw, nang palagian.” Ipinahihiwatig ng parirala ang tuloy-tuloy at regular na paghahandog araw-araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר
  choice: Ito ang
  rationale: Likas na Filipino para sa panimulang pariralang tumutukoy sa kasunod na tagubilin; hindi dinaragdagan ng temporal na “ngayon.”
- source_word: תַּעֲשֶׂה
  choice: ihahandog mo
  rationale: Bagaman malawak ang literal na diwang “gawin,” malinaw na sakripisyong paghahandog ang tinutukoy sa konteksto ng altar at mga kordero.
- source_word: עַל הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Karaniwan at natural na salin sa Filipino sa konteksto ng paghahandog.
- source_word: כְּבָשִׂים
  choice: mga kordero
  rationale: Tumutukoy sa mga batang tupa; “kordero” ang maikli at pamilyar na katawagan sa ganitong konteksto.
- source_word: בְּנֵי שָׁנָה
  choice: tig-iisang taóng gulang
  rationale: Idyomatikong ipinapahayag ang Hebreong “mga anak ng isang taon” at nililinaw na ang bawat isa sa dalawang kordero ay gayon ang edad.
- source_word: שְׁנַיִם לַיּוֹם תָּמִיד
  choice: dalawang ... araw-araw, palagian
  rationale: Pinananatili ang bilang, arawang dalas, at patuloy na regularidad ng paghahandog.
