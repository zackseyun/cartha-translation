base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: tl
  text: Ilagay mo ang lahat ng iyon sa mga palad ni Aaron at sa mga palad ng kanyang mga anak na lalaki[a], at iwagayway mo ang mga iyon bilang handog na iwinawagayway sa harap ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa mga palad ni Aaron at sa mga palad ng kanyang mga anak na lalaki.” Isinasalin ito ng ilan nang mas malawak bilang “mga kamay,” ngunit mas tiyak na “mga palad” ang salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Ilagay mo
  rationale: Ang Qal perfect na may pang-ugnay sa sunod-sunod na tagubilin ay may puwersa ng utos. Likas at malinaw sa modernong Tagalog ang “Ilagay mo.”
- source_word: הַכֹּל
  choice: ang lahat ng iyon
  rationale: Tumutukoy ito pabalik sa lahat ng bahaging binanggit sa naunang konteksto; nililinaw ng “iyon” ang ganitong pagtukoy.
- source_word: עַל כַּפֵּי
  choice: sa mga palad
  rationale: Ang כַּף ay tumutukoy nang mas tiyak sa palad, bagaman maaari rin itong gamitin sa mas malawak na diwang “kamay.” Pinananatili ng “mga palad” ang kongkretong larawan ng ritwal.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ito ang karaniwang anyo ng pangalang Hebreo sa Tagalog.
- source_word: בָנָיו
  choice: kanyang mga anak na lalaki
  rationale: Sa konteksto ng pagtatalaga sa pagkapari, ang בנים ay tumutukoy sa mga lalaking anak ni Aaron, kaya mas tiyak ito kaysa sa pangkalahatang “mga anak.”
- source_word: וְהֵנַפְתָּ
  choice: at iwagayway mo
  rationale: Ang Hiphil ng נוף sa kontekstong panghandog ay tumutukoy sa ritwal na pagwawagayway o paghaharap ng handog.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang panlalaking panghalip na maramihan ay tumutukoy sa maraming bahaging ilalagay at iwawagayway.
- source_word: תְּנוּפָה
  choice: bilang handog na iwinawagayway
  rationale: Pinangalanan ng salita ang uri o resulta ng ritwal na kilos. Malinaw sa karaniwang mambabasa ang pariralang ito at pinananatili nito ang ugnayan sa pandiwang “iwagayway.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ang לִפְנֵי ay likas na “sa harap ni,” at ang banal na pangalan ay isinalin bilang “Yahweh” upang katawanin ang mismong pangalang nasa tekstong Hebreo.
theological_decisions:
- issue: Paglalarawan sa ritwal na תְּנוּפָה
  choice: handog na iwinawagayway
  alternative: handog na inihaharap
  rationale: Pinananatili ng napiling salin ang aktuwal na kilos na ipinahihiwatig ng ugat נוף nang hindi nililimitahan ang eksaktong direksiyon o paraan ng ritwal.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Hayagang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” na pangalan ito sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang isahang anyo ng utos (“mo”) ayon sa gramatikang Hebreo, at pinanatili ang kongkretong bokabularyong panritwal.
