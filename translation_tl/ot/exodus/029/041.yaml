  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: tl
  text: Ihandog mo ang ikalawang kordero sa dapit-hapon.[a] Ihandog mo ito ayon sa handog na butil sa umaga at sa handog na inumin nito, bilang mabangong samyo na kalugod-lugod, isang handog na pinaraan sa apoy[b] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng mga gabi,” isang idyoma para sa huling bahagi ng hapon o sa oras ng takipsilim.
    reason: lexical_alternative
  - marker: b
    text: O, “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: ang ikalawang kordero
  rationale: Ang כֶּבֶשׂ ay batang tupa na ginagamit sa paghahandog; ipinagpapatuloy ng “ikalawang” ang pagkakasunod mula sa unang kordero sa naunang talata.
- source_word: תַּעֲשֶׂה
  choice: ihandog mo
  rationale: Bagaman literal na “gawin” ang עשה, ang “ihandog” ang likas at tiyak na kahulugan nito sa kontekstong pansakripisyo.
- source_word: בֵּין הָעַרְבָּיִם
  choice: sa dapit-hapon
  rationale: Isa itong idyomang Hebreo, literal na “sa pagitan ng mga gabi,” na tumutukoy sa huling bahagi ng hapon o pagsapit ng dilim; inilalahad sa talababa ang literal na anyo.
- source_word: מִנְחַת הַבֹּקֶר
  choice: ang handog na butil … gaya ng ginawa sa umaga
  rationale: Sa batas tungkol sa mga handog, ang מִנְחָה ay handog na butil. Pinananatili ng parirala ang pagtutulad sa kasamang handog sa umaga.
- source_word: נִסְכָּהּ
  choice: ang handog na inumin
  rationale: Ang נֶסֶךְ ay inuming ibinubuhos bilang handog; malinaw at karaniwan sa Filipino ang “handog na inumin.”
- source_word: לָּהּ
  choice: para rito
  rationale: Pinananatili nito ang tahasang panghalip sa Hebreo at tumutukoy sa kasamang mga handog para sa ikalawang kordero.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: mabangong samyo na kalugod-lugod
  rationale: Pinananatili nito ang metapora ng samyo at ang diwa ng pagtanggap o pagkalugod sa takdang pormulang pansakripisyo.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ipinahahayag nito ang tradisyonal na pag-unawa sa kultikong termino bilang handog na sinusunog o pinaraan sa apoy, habang inilalagay sa talababa ang alternatibong “handog na pagkain.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang “Yahweh” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili bilang “Yahweh” nang hindi ito pinapalitan ng titulong “PANGINOON.”
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain
  rationale: May leksikal na tensiyon kung dapat idiin ang paraan ng paghahandog sa apoy o ang kultikong kategorya bilang pagkaing handog. Ginamit sa pangunahing teksto ang tradisyonal na kahulugang kaugnay ng apoy at pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang pautos na “ihandog mo” upang likas na maipahayag ang ikalawang panauhang isahan sa Hebreo. Hinati sa maiikling pangungusap ang mahabang sugnay upang maging malinaw sa karaniwang mambabasa nang hindi inaalis ang mga ugnayang nasa orihinal.
