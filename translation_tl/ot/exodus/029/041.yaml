  to: Ihandog mo ang ikalawang kordero sa dapit-hapon.[a] Ihandog mo ito ayon sa handog na butil sa umaga at sa handog na inumin nito, bilang mabangong samyo na kalugod-lugod, isang handog na pinaraan sa apoy[b] para kay Yahweh.
