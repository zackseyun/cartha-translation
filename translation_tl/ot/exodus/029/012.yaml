base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: tl
  text: Kumuha ka ng kaunting dugo ng toro at ilagay mo ito sa mga sungay ng altar[a] gamit ang iyong daliri, at ibuhos mo ang lahat ng dugo sa paanan ng altar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga sungay” ay mga nakausling bahaging parang sungay sa mga sulok ng altar.
    reason: cultural_note
  - marker: b
    text: O “sa base ng altar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ מִדַּם הַפָּר
  choice: Kumuha ka ng kaunti sa dugo ng toro
  rationale: 'Ang sunod-sunod na anyong pandiwa ay utos sa ritwal. Ang מִן ay partitive rito: isang bahagi lamang ng dugo ang kukunin para sa mga sungay ng altar.'
- source_word: וְנָתַתָּה
  choice: at ipahid mo iyon
  rationale: Karaniwang nangangahulugang ‘ilagay’ ang נתן, ngunit sa kontekstong gumagamit ng daliri upang maglagay ng dugo sa altar, natural at malinaw sa Tagalog ang ‘ipahid’ nang hindi binabago ang ritwal na kilos.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: sa mga sungay ng altar
  rationale: Pinananatili ang kongkretong terminong ‘mga sungay,’ ang mga nakausling bahagi sa mga sulok ng altar.
- source_word: בְּאֶצְבָּעֶךָ
  choice: gamit ang iyong daliri
  rationale: Instrumental ang בְּ; malinaw at likas sa modernong Tagalog ang ‘gamit ang iyong daliri.’
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: pagkatapos, ibuhos mo ang lahat ng natitirang dugo
  rationale: Ang שׁפך ay ‘ibuhos.’ Ipinahihiwatig ng naunang pagkuha ng kaunting dugo na ang ‘lahat ng dugo’ dito ay ang lahat ng natira; ginagawang malinaw ito sa Tagalog.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: sa paanan ng altar
  rationale: Ang יְסוֹד ay pundasyon o base. Ang ‘paanan’ ay natural na Tagalog para sa ibabang bahagi ng altar, habang inilalahad sa talababa ang mas literal na alternatibo.
theological_decisions:
- issue: Tiyak na katawagan sa ritwal ng altar
  choice: Panatilihin ang ‘mga sungay ng altar’ at tukuyin ang ibabang bahagi bilang ‘paanan ng altar.’
  alternative: ‘mga sulok ng altar’ at ‘pundasyon ng altar’
  rationale: Mahalagang mapanatili ang pisikal at ritwal na detalye ng teksto nang hindi ito ginagawang pangkalahatang pananalita tungkol sa paghahandog.
- issue: Saklaw ng ‘lahat ng dugo’ matapos kumuha ng bahagi
  choice: ‘lahat ng natitirang dugo’
  alternative: ‘lahat ng dugo’
  rationale: Iisa ang dugo sa konteksto, ngunit may kaunti nang kinuha para sa mga sungay. Nililinaw ng ‘natitirang’ ang lohikal na pagkakasunod nang hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang anyong pautos upang likas na maipahayag ang Hebreong serye ng mga tagubilin. Ang ‘altar’ ay pinanatili bilang karaniwang katawagang biblikal sa Filipino.
