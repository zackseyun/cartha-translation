revisions:
- from: Kumuha ka ng kaunti sa dugo ng toro at ipahid mo iyon sa mga sungay ng altar gamit ang iyong daliri; pagkatapos, ibuhos mo ang lahat ng natitirang dugo sa paanan ng altar.[a][b]
  to: Kumuha ka ng kaunting dugo ng toro at ilagay mo ito sa mga sungay ng altar[a] gamit ang iyong daliri, at ibuhos mo ang lahat ng dugo sa paanan ng altar[b].
  rationale: Inalis ang “natitirang” upang hindi magdagdag ng paglilinaw na wala sa pinagmulan. Pinalitan ang “ipahid” ng “ilagay” upang mapanatili ang mas pangkalahatang pandiwang Hebreo. Inayos ang mga panandang talababa upang tumukoy ang bawat isa sa kaugnay nitong termino.
