base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang mga iyon mula sa kanilang mga kamay at sunugin mo sa altar, sa ibabaw ng handog na sinusunog, bilang kalugod-lugod na samyo sa harap ni Yahweh. Ito ay handog sa pamamagitan ng apoy[a] para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “handog na sinunog” o “handog na inihandog sa pamamagitan ng apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pagkatapos, kunin mo
  rationale: Ang anyong pandiwa na may pang-ugnay ay nagpapatuloy sa sunod-sunod na tagubilin. Ipinahihiwatig ng “Pagkatapos” ang pagkakasunod ng ritwal, at malinaw na utos ang “kunin mo.”
- source_word: אֹתָם מִיָּדָם
  choice: ang mga iyon mula sa kanilang mga kamay
  rationale: Tumutukoy ang panghalip sa mga bahaging inilagay sa kamay ng mga pari sa naunang konteksto. Pinananatili ng salin ang kongkretong kilos na nasa Hebreo.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: at sunugin mo sa altar
  rationale: Sa kontekstong paghahandog, ang Hiphil ng קטר ay tumutukoy sa pagsusunog upang pumailanlang bilang usok. Natural at malinaw sa modernong Tagalog ang “sunugin,” habang ibinibigay ng altar ang ritwal na diwa.
- source_word: עַל הָעֹלָה
  choice: sa ibabaw ng handog na sinusunog
  rationale: Ipinapakita ng עַל ang paglalagay sa ibabaw ng handog na lubos na sinusunog. Ang parirala ay malinaw at hindi makaluma.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: bilang kalugod-lugod na samyo
  rationale: Ang nakapirming pananalitang pansakripisyo ay nagpapahayag na ang samyo ay nakalulugod o katanggap-tanggap, hindi lamang mabango.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang relasyonal na diwa ng “sa harap” at isinasalin ang Tetragrammaton bilang pangalang Yahweh.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Ang terminong pansakripisyo ay malapit na nauugnay sa pagsunog sa altar. Iniiwasan ng saling ito na tukuyin ito bilang “pagkain” lamang at pinananatili ang kaugnayan nito sa apoy, habang inilalahad sa talababa ang maiikling alternatibo.
- source_word: הוּא לַיהוָה
  choice: Ito ay ... para kay Yahweh
  rationale: Isinasalin ang tahasang panghalip at ang lamed ng pagtatalaga o pag-uukol sa natural na Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ng Diyos ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan ng tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Kahulugan ng אִשֶּׁה bilang terminong pansakripisyo
  choice: handog na pinaraan sa apoy
  alternative: handog sa pamamagitan ng apoy; handog na pinagsusunog
  rationale: Hindi ganap na tiyak ang pinagmulan at eksaktong saklaw ng teknikal na termino. Pinananatili ng pangunahing salin ang malinaw na ugnayan nito sa apoy sa kontekstong ito, at inilalagay sa talababa ang lehitimong mga alternatibo sa halip na lutasin nang tahimik ang usapin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “altar” dahil karaniwan at malinaw ito sa kasalukuyang wikang panrelihiyon; iniwasan ang sobrang makaluma o teknikal na pananalita.
