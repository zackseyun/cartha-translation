review_pass:
  verdict: revise
  source_fidelity: Tumpak na naisasalin ang pagkakasunod ng utos, ang pagkuha ng mga bahagi mula sa mga kamay ng mga pari, ang pagsusunog sa altar sa ibabaw ng handog na sinusunog, at ang pormulang “kalugod-lugod na samyo sa harap ni Yahweh.” Gayunman, ang “handog na pinaraan sa apoy” ay maaaring magpahiwatig ng literal na pagpaparaan sa apoy kaysa sa teknikal na sakripisyong inihahandog sa pamamagitan ng apoy (אִשֶּׁה).
  naturalness: Marangal at malinaw ang Tagalog. Ang “Pagkatapos,” “altar,” “handog na sinusunog,” at “sa harap ni Yahweh” ay natural sa modernong Filipino Tagalog. Mas tuwiran at mas hindi mapanlinlang ang “handog sa pamamagitan ng apoy” kaysa “handog na pinaraan sa apoy.”
  terminology: Wasto ang “Yahweh” para sa יהוה at ang “handog na sinusunog” para sa עֹלָה. Para sa אִשֶּׁה, “handog sa pamamagitan ng apoy” ay pinananatili ang kaugnayan sa apoy nang hindi ipinipilit ang mas pinagtatalunang “handog na pagkain” o ang di-likas na “pinaraan sa apoy.”
  issues:
  - severity: medium
    issue: Ang “handog na pinaraan sa apoy” ay hindi angkop na pangunahing katumbas ng אִשֶּׁה.
    rationale: Sa modernong Tagalog, ang “pinaraan sa apoy” ay karaniwang nangangahulugang ipinadaan o isinailalim sa apoy, at maaari itong magpahiwatig ng ibang ritwal na kilos. Ang Hebreong terminong teknikal ay tumutukoy sa handog na may kaugnayan sa paghahandog sa pamamagitan ng apoy.
  revised_text: Pagkatapos, kunin mo ang mga iyon mula sa kanilang mga kamay at sunugin mo sa altar, sa ibabaw ng handog na sinusunog, bilang kalugod-lugod na samyo sa harap ni Yahweh. Ito ay handog sa pamamagitan ng apoy[a] para kay Yahweh.
