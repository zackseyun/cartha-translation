  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: tl
  text: At ang mga banal na kasuotan ni Aaron ay mapupunta sa mga anak niyang lalaki na hahalili sa kanya, upang, habang suot nila ang mga ito, pahiran sila ng langis at italaga sa tungkulin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “punuin ang kanilang kamay,” isang idyomang tumutukoy sa pagtatalaga o paglalagay sa tungkulin bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: mga banal na kasuotan
  rationale: Tumutukoy ang parirala sa mga kasuotang ibinukod para sa banal na paglilingkod ng mga pari. Likas at marangal sa modernong Filipino ang “mga banal na kasuotan.”
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: ni Aaron
  rationale: Ang לְ ay nagpapahayag dito ng pag-aari o pagkakatalaga kay Aaron; malinaw at maikli itong naihahayag ng “ni Aaron.”
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: ay mapupunta sa mga anak niyang lalaki na hahalili sa kanya
  rationale: Ipinahihiwatig ng sugnay ang pagpapasa ng mga kasuotan sa mga anak ni Aaron bilang mga kahalili niya. Pinananatili ng “mga anak na lalaki” ang tiyak na kahulugan ng בָנָיו sa kontekstong ito.
- source_word: לְמָשְׁחָה בָהֶם
  choice: Isusuot nila ang mga iyon kapag pinapahiran sila ng langis
  rationale: 'Ang בָהֶם ay sitwasyonal: suot nila ang mga kasuotan habang pinapahiran sila, hindi ginagamit ang mga kasuotan bilang instrumento ng pagpapahid. Ginawang tahasan ito upang maging likas sa Filipino.'
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: at itinatalaga sa tungkulin
  rationale: Ang “punuin ang kamay” ay teknikal na idyoma para sa paglalagay o pagtatalaga sa tungkulin bilang pari. Ang functional na salin ay malinaw sa karaniwang mambabasa, habang inilalahad sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagpapakahulugan sa idyomang pangpari na מִלֵּא אֶת־הַיָּד
  choice: itinatalaga sa tungkulin
  alternative: pinupuno ang kanilang kamay
  rationale: Ang literal na anyo ay hindi likas at maaaring hindi maunawaan sa Filipino. Ang “itinatalaga sa tungkulin” ay naghahatid ng ritwal na diwa nang hindi nag-aangkat ng katawagang natatangi sa isang denominasyon; pinananatili sa talababa ang Hebreong larawan.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Hinati sa dalawang pangungusap upang maiwasan ang mabigat at di-likas na pagkakasunod-sunod, habang pinananatili ang ugnayan ng mga kasuotan sa pagpapahid ng langis at pagtatalaga sa tungkulin.
