  text: וְ/שַׂמְתָּ֥ הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וְ/נָתַתָּ֛ אֶת נֵ֥זֶר הַ/קֹּ֖דֶשׁ עַל הַ/מִּצְנָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: tl
  text: At ipatong mo sa ulo niya ang turbante, at ilagay mo sa turbante ang banal na putong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na korona.” Ang Hebreong nezer ay maaaring tumukoy sa isang putong o koronang sagisag ng banal na pagkakatalaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: At ipatong mo
  rationale: Ang שׂים ay nangangahulugang ilagay o ipatong. Dahil ang turbante ay inilalagay sa ulo, natural at tiyak sa Filipino ang “ipatong mo,” habang pinananatili ng “At” ang pagkakasunod-sunod ng tagubilin.
- source_word: הַמִּצְנֶפֶת
  choice: ang turbante
  rationale: Ang מִצְנֶפֶת ay tumutukoy sa nakapulupot na pantakip sa ulo ng pari. Ang “turbante” ang malinaw at kasalukuyang katawagan, at iniiwasan nito ang mga terminong may mas makitid na ugnayang eklesiyastiko.
- source_word: עַל רֹאשׁוֹ
  choice: sa ulo niya
  rationale: Direkta at natural na salin ito ng pariralang nagsasaad kung saan ipapatong ang turbante.
- source_word: וְנָתַתָּ
  choice: at ilagay mo
  rationale: Sa kontekstong ito, ang נתן ay tumutukoy sa paglalagay ng isang bagay. Ang “ilagay mo” ay natural na utos sa Filipino at angkop sa seremonyal na tagubilin.
- source_word: אֵת
  choice: '[hindi isinalin nang hiwalay]'
  rationale: Pananda ito ng tiyak na layon sa Hebreo at wala itong tuwirang katumbas na kailangang ipahayag sa Filipino.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: ang banal na putong
  rationale: Ang נֵזֶר ay isang putong o koronang sagisag ng pagkakatalaga. Pinananatili ng “putong” ang anyong koronang palamuti nang hindi ipinapalagay na isa itong buong maharlikang korona; ang הַקֹּדֶשׁ ay likas na isinaling “banal.”
- source_word: עַל הַמִּצְנָפֶת
  choice: sa turbante
  rationale: Ipinapakita ng עַל na ang banal na putong ay inilalagay o ikinakabit sa ibabaw ng turbante. Natural sa Filipino ang “sa turbante” sa ganitong pandiwang konstruksyon.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “turbante” sa halip na tradisyonal ngunit maaaring mapanlinlang na katawagang eklesiyastiko, at “putong” upang mapanatili ang saklaw ng Hebreong נֵזֶר.
