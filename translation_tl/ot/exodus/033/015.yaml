  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Kung hindi sasama ang presensiya mo[a], huwag mo kaming dalhin mula rito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “ang mukha mo.” Madalas gamitin sa Hebreo ang “mukha” upang tukuyin ang personal na presensiya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Sinabi niya” at sapat nitong ipinahihiwatig ang kasunod na pangyayari nang hindi pilit na dinaragdagan ng “Pagkatapos.”
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Karaniwang pagpapahayag sa Tagalog ng pananalitang itinutuon sa naunang kausap.
- source_word: אִם אֵין
  choice: Kung hindi
  rationale: Ipinakikilala nito ang tunay na kondisyon at likas na inuugnay sa pandiwang “sasama” sa Tagalog.
- source_word: פָּנֶיךָ
  choice: ang presensiya mo
  rationale: Literal itong “ang mukha mo,” ngunit sa konteksto ay tumutukoy sa personal na presensiya ng Diyos. Pinananatili sa talababa ang kongkretong larawang Hebreo.
- source_word: הֹלְכִים
  choice: sasama
  rationale: Ipinahihiwatig ng participle ang paglakad o pagpunta na kasama nila. Mas natural at malinaw sa Tagalog ang “sasama” kaysa sa literal na “pupunta,” habang pinananatili ang diwa ng pagsama ng presensiya ng Diyos.
- source_word: אַל תַּעֲלֵנוּ
  choice: huwag mo kaming paalisin
  rationale: Ang Hiphil ng עלה ay literal na “paakyatin/dalhin paitaas,” ngunit dito ay tumutukoy sa pagpapakilos sa bayan mula sa kanilang kasalukuyang himpilan. Ang “paalisin” ay natural sa Tagalog at pinananatili ang causative na pakiusap, bagaman hindi nito tahasang inuulit ang direksiyong “paitaas.”
- source_word: מִזֶּה
  choice: dito
  rationale: Natural na katumbas sa Tagalog ng pagtukoy sa kasalukuyang lugar sa pariralang “paalisin dito.”
theological_decisions:
- issue: Paglalarawan sa פָּנֶיךָ na tumutukoy sa Diyos
  choice: ang presensiya mo
  alternative: ang mukha mo
  rationale: Sa kontekstong ito, ang Hebreong “mukha” ay idyoma para sa personal at kasamang presensiya ng Diyos. Ginagawang malinaw ng pangunahing salin ang kahulugan, habang inilalantad ng talababa ang orihinal na larawan at hindi binubura ang relasyonal na diin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “presensiya” bilang pamilyar na salitang Filipino sa kontekstong teolohikal; ang “sasama” ay mas natural kaysa sa literal na “pupunta.”
