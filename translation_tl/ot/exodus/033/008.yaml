revisions:
- from: Tuwing lumalabas si Moises papunta sa tolda[a], bumabangon ang buong bayan at pumupuwesto ang bawat lalaki sa pasukan ng sarili niyang tolda[b]. Sinusundan nila ng tingin si Moises hanggang sa makapasok siya sa tolda.
  to: Tuwing lumalabas si Moises patungo sa tolda[a], bumabangon ang buong bayan at tumatayo ang bawat lalaki sa pasukan ng sarili niyang tolda[b]. Sinusundan nila ng tingin si Moises hanggang sa makapasok siya sa tolda.
  rationale: Pinalitan ang “papunta sa” ng “patungo sa” para sa mas maayos na rehistro, at ang “pumupuwesto” ng “tumatayo” upang mas tuwirang isalin ang pandiwang Hebreo para sa pagtayo. Pinanatili ang aspektong paulit-ulit, ang distributibong “bawat lalaki,” at ang idyomang “sinusundan nila ng tingin,” na wastong naghahayag ng pagtanaw kay Moises habang siya ay lumalayo.
