    rationale: Ang “patungo sa” ay mas maayos sa modernong Filipino at tuwirang naghahayag ng direksiyong אֶל.
  - severity: low
    issue: Hindi gaanong likas ang “nakapaligid na konteksto” sa talababa.
    rationale: Mas idiomatiko ang “kalapit na konteksto,” nang hindi binabago ang impormasyong ibinibigay ng talababa.
