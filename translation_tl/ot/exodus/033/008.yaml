translation_notes:
  register: Makabago at malinaw na Filipino na may marangal na himig. Ginamit ang “Tuwing” at mga pandiwang nasa aspektong nagaganap upang ipakita ang nakaugaliang, paulit-ulit na kilos. Pinanatili ang “bawat lalaki” dahil tahasang panlalaki ang anyong Hebreo.
