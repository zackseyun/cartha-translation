base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: tl
  text: Tuwing lumalabas si Moises patungo sa tolda[a], bumabangon ang buong bayan at tumatayo ang bawat lalaki sa pasukan ng sarili niyang tolda[b]. Sinusundan nila ng tingin si Moises hanggang sa makapasok siya sa tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Tolda,” na tumutukoy sa tolda ng pagtitipon na binanggit sa kalapit na konteksto.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “bawat lalaki”; ginagamit nang distributibo ang panlalaking isahang anyo para sa mga kabilang sa bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Tuwing
  rationale: Ipinahahayag ng anyong pandiwa sa salaysay ang isang paulit-ulit o nakaugaliang pangyayari; likas itong naihahatid ng “Tuwing” sa Filipino.
- source_word: כְּצֵאת מֹשֶׁה
  choice: lumalabas si Moises
  rationale: Ang כ na may infinitive construct ay nagsasaad ng panahong “kapag/tuwing,” at pinananatili ng “lumalabas” ang galaw na ipinahahayag ng יצא.
- source_word: אֶל הָאֹהֶל
  choice: papunta sa tolda
  rationale: Ang אֶל ay nagsasaad ng direksiyon patungo sa tolda. Hindi idinagdag sa pangunahing teksto ang buong katawagang “tolda ng pagtitipon,” sapagkat הָאֹהֶל lamang ang nasa talata.
- source_word: יָקוּמוּ ... וְנִצְּבוּ
  choice: bumabangon ... at pumupuwesto
  rationale: Ipinakikita ng dalawang pandiwa ang pagbangon at pagkatapos ay pagtayo o pagpuwesto sa isang takdang lugar; ang aspektong nagaganap sa Filipino ay angkop sa kilos na paulit-ulit dahil sa “Tuwing.”
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: 'Ginagamit nang distributibo ang panlalaking isahang pangngalan: bawat lalaking kabilang sa bayan.'
- source_word: פֶּתַח אָהֳלוֹ
  choice: sa pasukan ng sarili niyang tolda
  rationale: Ang פֶּתַח ay bukana o pasukan, at ang hulaping panghalip ay tumutukoy sa tolda ng bawat isa.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: Sinusundan nila ng tingin si Moises
  rationale: Ipinahahayag ng parirala ang pagtanaw kay Moises habang papalayo siya, hindi ang pisikal na pagsunod sa kaniya.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: hanggang sa makapasok siya sa tolda
  rationale: Ang בוא at ang hulaping paturol sa direksiyon sa הָאֹהֱלָה ay nagpapahiwatig ng pagpasok sa loob ng tolda.
