  source_fidelity: 'Tumpak ang pangunahing diwa: inuulit na paglabas ni Moises patungo sa tolda, pagbangon at pagtayo ng buong bayan sa bukana ng kani-kanilang tolda, at pagsunod nila sa kaniya ng tingin hanggang makapasok siya sa tolda. Gayunman, mas tuwirang naihahayag ng “tumatayo” ang וְנִצְּבוּ kaysa “pumupuwesto.”'
  naturalness: Likas at malinaw ang salin. Ang “patungo sa” ay bahagyang mas maayos at mas angkop sa marangal na rehistro kaysa “papunta sa.” Ang paralelong “bumabangon ... at tumatayo” ay malinaw na nagpapanatili sa magkasunod na kilos sa Hebreo.
  terminology: Ang “tolda,” “bayan,” “bawat lalaki,” at “sinusundan nila ng tingin” ay angkop. Pinananatili ng “bawat lalaki” ang distributibong panlalaking isahan ng איש, at maayos ang paliwanag ng talababa.
  issues:
