  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: tl
  text: At sinabi niya, “Ang presensiya ko[a] ang sasama, at bibigyan kita ng kapahingahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na Hebreo, “Ang mukha ko ay lalakad.” Ang “mukha” rito ay tumutukoy sa personal na presensiya; ang Diyos mismo ang sasama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Karaniwang salaysay na wayyiqtol ng אמר; pinananatili ng “At sinabi niya” ang daloy ng Hebreong salaysay nang hindi labis na tinutukoy ang ugnayang temporal.
- source_word: פָּנַי
  choice: Ang presensiya ko
  rationale: Literal na “ang mukha ko,” ngunit idyomatiko itong tumutukoy sa personal na presensiya ng PANGINOON. Natural sa makabagong Filipino ang “presensiya ko,” habang inilalagay sa talababa ang konkretong larawang Hebreo.
- source_word: יֵלֵכוּ
  choice: ang sasama
  rationale: Bagaman literal na “pupunta,” sa konteksto ng paglalakbay at pangako ng pagsama ng Diyos, malinaw at natural ang “sasama.” Ang anyong pangmaramihan sa Hebreo ay umaayon sa morpolohikal na anyong pangmaramihan ng פָּנַי, ngunit iisa ang diwa nito rito.
- source_word: וַהֲנִחֹתִי
  choice: at bibigyan kita ng kapahingahan
  rationale: 'Ang Hiphil ng נוח ay causative: “pagpapahingahin” o “bibigyan ng kapahingahan.” Pinananatili ng napiling parirala ang causative na diwa at ang pangakong katiwasayan.'
- source_word: לָךְ
  choice: kita
  rationale: Ikalawang panauhang isahan ang hulapi. Sa pariralang Filipino na “bibigyan kita,” natural na naipapahayag ang Hebreong לָךְ.
theological_decisions:
- issue: Paglalarawan sa antropomorpikong ekspresyong פָּנַי
  choice: Ang presensiya ko
  alternative: Ang mukha ko; Ako mismo ang sasama
  rationale: Ginagamit ng Hebreo ang “mukha” upang ipahayag ang personal na presensiya ng Diyos. Iniiwasan ng “presensiya” ang di-natural na literalismo, ngunit hindi nito ginagawang impersonal ang pangako dahil malinaw sa pandiwang “sasama” na ang Diyos mismo ang kasama. Pinananatili sa talababa ang orihinal na larawan.
- issue: Saklaw ng panghalip sa לָךְ
  choice: Ikaw na isahan (“kita”), na tuwirang tumutukoy kay Moises
  alternative: Kayo / ang buong Israel
  rationale: Ang anyong Hebreo ay tahasang ikalawang panauhang isahan. Bagaman may implikasyon ang pangako para sa Israel sa mas malawak na konteksto, hindi pinalalawak sa salin ang gramatikal na kausap.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “presensiya” bilang karaniwang salitang nauunawaan ng mga mambabasa; ang “kapahingahan” ay nagpapanatili sa masaklaw na diwa ng pahinga, katiwasayan, at pagdating sa lugar na mapagpapahingahan. Ang “ang sasama” ay idiomatikong Filipino at angkop sa konteksto ng banal na paggabay.
