  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: tl
  text: At tuwing pumapasok si Moises sa tolda, bumababa ang haliging ulap at tumatayo sa pasukan ng tolda, at siya’y nakikipag-usap[a] kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, mas tahasan: “at nakikipag-usap ang PANGINOON kay Moises.” Hindi tahasang binanggit sa Hebreo ang simuno ng sugnay na ito, bagaman ipinakikilala ng konteksto na ang PANGINOON ang tinutukoy.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: At tuwing
  rationale: Ipinahihiwatig ng anyong pasalaysay ang isang pangyayaring paulit-ulit; likas na ipinapahayag ito sa Tagalog sa pamamagitan ng “tuwing.”
- source_word: כְּבֹא
  choice: pumapasok
  rationale: Ang כְּ kasama ng infinitive construct ay bumubuo ng sugnay na panahunan, “kapag/tuwing pumapasok.” Ang aspektong imperpektibo sa Tagalog ay angkop sa kilos na nakagawian.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: sa tolda / ng tolda
  rationale: “Ang tolda” lamang ang tahasang sinasabi ng Hebreo sa talata; hindi idinagdag ang mas mahabang katawagang “tolda ng pagpupulong.”
- source_word: יֵרֵד
  choice: bumababa
  rationale: Ipinagpapatuloy ng pandiwang ito ang paulit-ulit na pangyayaring ipinakilala ng “tuwing”; natural sa Tagalog ang aspektong imperpektibo.
- source_word: עַמּוּד הֶעָנָן
  choice: ang haliging ulap
  rationale: Pinananatili nito ang kongkretong larawan at ang ugnayang construct ng pariralang Hebreo.
- source_word: וְעָמַד
  choice: at tumatayo
  rationale: Ipinapahayag nito ang kasunod at paulit-ulit na kilos ng haliging ulap nang hindi ginagawang minsanang pangyayari.
- source_word: פֶּתַח הָאֹהֶל
  choice: sa pasukan ng tolda
  rationale: Ang “pasukan” ay malinaw at likas na makabagong Tagalog para sa bukasan o pintuan ng tolda.
- source_word: וְדִבֶּר
  choice: at nakikipag-usap
  rationale: Walang tahasang simuno ang pandiwang panlalaking isahan sa Hebreo. Maaaring mag-iwan ng di-binanggit na simuno sa Tagalog, kaya napapanatili ang anyo at kalabuan ng pinagmulan nang hindi ipinapasok sa pangunahing teksto ang pangalang “PANGINOON.”
- source_word: עִם מֹשֶׁה
  choice: kay Moises
  rationale: Kasama ng “nakikipag-usap,” natural na ipinahihiwatig ng “kay Moises” ang personal at may-palitang pakikipag-usap na taglay ng עִם.
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng “at nakikipag-usap kay Moises”
  choice: Iwanang di-binanggit ang simuno sa pangunahing teksto, gaya ng Hebreo.
  alternative: Tahasan itong isalin na “at nakikipag-usap ang PANGINOON kay Moises.”
  rationale: Malinaw sa konteksto na ang PANGINOON ang tinutukoy, ngunit hindi siya tahasang pinangalanan sa mismong sugnay. Ang pag-aalis ng tahasang simuno ay natural sa Tagalog at nagpapanatili sa pormal na kalabuan ng Hebreo; nililinaw sa talababa ang kontekstuwal na pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangkasalukuyang aspektong imperpektibo sa loob ng balangkas na “tuwing” upang likas na ipahayag ang paulit-ulit na kilos sa salaysay. Hindi ginawang pantanging pangalan ang “tolda,” sapagkat karaniwang pangngalan lamang ang nasa talata.
