  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: tl
  text: Pagkatapos, aalisin ko ang aking kamay, at makikita mo ang aking likod[a]; ngunit hindi makikita ang aking mukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking likuran” o “ang nasa likuran ko.” Ang salitang Hebreo ay maaaring tumukoy sa likod o sa bahaging nasa likuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Pagkatapos, aalisin ko
  rationale: Ang causative na anyo ng סור ay nangangahulugang alisin o iurong. Ipinagpapatuloy ng waw ang pagkakasunod-sunod mula sa naunang talata, kaya natural sa Filipino ang “Pagkatapos, aalisin ko.”
- source_word: כַּפִּי
  choice: ang aking kamay
  rationale: Maaaring tumukoy ang כַּף sa palad o kamay. Mas natural ang “kamay” sa konteksto ng pagtatakip at pinananatili nito ang konkretong larawang antropomorpiko.
- source_word: וְרָאִיתָ
  choice: at makikita mo
  rationale: Sa sunod-sunod na pangyayaring nasa hinaharap, ipinapahayag nito ang resultang kasunod ng pag-aalis ng kamay.
- source_word: אֲחֹרָי
  choice: ang aking likod
  rationale: Ang salita ay maaaring tumukoy sa likod o bahaging nasa hulihan. “Aking likod” ang pinakatuwiran at natural na salin, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: וּפָנַי
  choice: ngunit ... ang aking mukha
  rationale: Bagaman karaniwang “at” ang waw, malinaw na magkasalungat dito ang maaaring makita at ang hindi maaaring makita, kaya ang “ngunit” ay natural at tapat sa ugnayan ng mga sugnay.
- source_word: לֹא יֵרָאוּ
  choice: hindi makikita
  rationale: Ang Niphal ng ראה ay pasibo, “hindi makikita,” hindi aktibong “hindi makakakita.” Bagaman maramihan ang anyong Hebreo dahil sa פָּנִים, iisa ang diwa ng “mukha” sa Filipino.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos
  choice: Panatilihin sa pangunahing teksto ang konkretong mga salitang “kamay,” “likod,” at “mukha.”
  alternative: Gumamit ng mas abstraktong mga salitang gaya ng “presensiya” o “nalalabing kaluwalhatian.”
  rationale: Ang mismong Hebreo ay gumagamit ng konkretong larawang antropomorpiko. Ang pagpapanatili nito ay hindi sapilitang nagpapaliwanag sa kalikasan ng Diyos at hindi rin inaalis ang tensiyon sa paraan ng kaniyang pagpapakilala.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak at konkretong imahe ng Hebreo; ginamit ang “hindi makikita” upang maipahayag ang pasibong anyo nang natural.
