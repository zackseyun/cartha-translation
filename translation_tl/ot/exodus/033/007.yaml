base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: tl
  text: Kinukuha noon[b] ni Moises ang tolda[a], at itinatayo niya ito para sa sarili niya sa labas ng kampo, malayo sa kampo. Tinatawag niya itong Tolda ng Tagpuan. Ang sinumang naghahanap kay Yahweh ay lumalabas patungo sa Tolda ng Tagpuan na nasa labas ng kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang tolda.” Hindi tahasang sinasabi ng teksto na ito ay “tolda niya,” bagaman maaaring tumukoy ito sa sariling tolda ni Moises o sa isang bukod na toldang ginamit niya para sa layuning ito.
    reason: lexical_alternative
  - marker: b
    text: 'Malamang na inilalarawan dito ng mga pandiwang Hebreo ang nakagawiang kilos: “nakaugalian ni Moises na kunin” at, sa huling pangungusap, “nakaugalian ng bawat naghahanap kay Yahweh na lumabas.” Maaari rin itong unawain bilang payak na pagsasalaysay sa nakaraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: kinukuha noon
  rationale: Ang anyong yiqtol sa kontekstong ito ay malamang na nagsasaad ng nakagawiang o paulit-ulit na kilos, hindi lamang ng isang pangyayaring minsan nang naganap.
- source_word: הָאֹהֶל
  choice: ang tolda
  rationale: May tiyak na pantukoy ang Hebreo ngunit hindi nito tahasang sinasabing ‘tolda niya’; pinananatiling bukas ang pagkakakilanlan ng tolda.
- source_word: וְנָטָה לוֹ
  choice: at itinatayo niya iyon para sa sarili niya
  rationale: Sa konteksto ng tolda, ang נטה ay tumutukoy sa pagtatayo o pagbubuka nito. Pinananatili ng ‘para sa sarili niya’ ang לוֹ nang hindi ipinapalagay na pag-aari niya ang tolda.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: malayo sa kampo
  rationale: Pinananatili nito ang mariing paglalayo sa tolda mula sa kampo.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tagpuan
  rationale: Ang מוֹעֵד ay maaaring tumukoy sa itinakdang panahon o lugar ng pakikipagtagpo; ang ‘Toldang Tagpuan’ ay maikli, natural, at hindi labis na nagpapaliwanag.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: ang sinumang naghahanap kay Yahweh
  rationale: Pinananatili ng ‘naghahanap’ ang malawak na diwa ng paglapit sa Diyos, kabilang ang paghingi ng patnubay o pagsangguni sa kaniya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: יֵצֵא
  choice: ay lumalabas
  rationale: Ang aspektong di-ganap sa Filipino ay natural na naghahayag ng nakagawiang kilos na kaayon ng yiqtol sa konteksto.
theological_decisions:
- issue: Paglalarawan sa tolda bago maitayo ang tabernakulo
  choice: Hindi tinukoy kung sariling tolda ni Moises o isang bukod na tolda para sa layuning ito
  alternative: Tukuyin ito bilang ‘tolda ni Moises’
  rationale: ‘Ang tolda’ lamang ang tahasang nasa Hebreo; hindi dapat lutasin sa salin ang pagkakakilanlang iniwang bukas ng teksto.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo at iniiwasang palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang karaniwang ‘tolda’ at ‘kampo,’ at ang ‘Toldang Tagpuan’ bilang malinaw at maikling pangalan. Ang ‘noon’ at aspektong di-ganap ng mga pandiwa ay nagpapahiwatig ng nakagawiang kilos nang hindi ginagawang mabigat ang pangungusap.
