revisions:
- from: Kinukuha noon ni Moises ang tolda[a] at itinatayo niya iyon para sa sarili niya sa labas ng kampo, malayo sa kampo.[b] Tinawag niya itong Toldang Tagpuan. Ang sinumang naghahanap kay Yahweh ay lumalabas papunta sa Toldang Tagpuan na nasa labas ng kampo.
  to: Kinukuha noon[b] ni Moises ang tolda[a], at itinatayo niya ito para sa sarili niya sa labas ng kampo, malayo sa kampo. Tinatawag niya itong Tolda ng Tagpuan. Ang sinumang naghahanap kay Yahweh ay lumalabas patungo sa Tolda ng Tagpuan na nasa labas ng kampo.
  rationale: Inayos ang magkakatugmang aspektong pangkaugalian, pinahusay ang natural na Filipino ng ilang parirala, ginawang mas malinaw ang anyong ugnayan sa ‘Tolda ng Tagpuan,’ at inilipat ang angkla ng talababa b sa pandiwang direktang tinatalakay nito. Walang binagong kahulugan o paglutas sa hindi tahasang pagkakakilanlan ng tolda.
