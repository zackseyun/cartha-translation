base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: tl
  text: At kapag dumaan ang aking kaluwalhatian, ilalagay kita sa isang siwang ng bato[a], at tatakpan kita ng aking kamay hanggang sa makaraan ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sa siwang ng bato.” Sa Hebreo, maaaring isalin ang “siwang” nang may “isang” o wala nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: At kapag dumaan
  rationale: Ang וְהָיָה kasama ng ב at infinitive construct ay naglalatag ng temporal na kalagayan. Likas sa modernong Tagalog ang “At kapag dumaan” at pinananatili nito ang ugnayan sa kasunod na pangyayari.
- source_word: כְּבֹדִי
  choice: ang aking kaluwalhatian
  rationale: Sa konteksto ng pagpapakita ng Diyos, ang כָּבוֹד ay tumutukoy sa nahahayag na kaluwalhatian, hindi lamang sa dangal o reputasyon.
- source_word: וְשַׂמְתִּיךָ
  choice: ilalagay kita
  rationale: Tuwirang katumbas ito ng karaniwang diwa ng שׂים na “ilagay” o “ipuwesto,” at natural sa kasalukuyang Tagalog.
- source_word: בְּנִקְרַת הַצּוּר
  choice: sa isang siwang ng malaking bato
  rationale: Ang נִקְרָה ay siwang o bitak na maaaring mapagkublihan. Ipinahihiwatig ng הַצּוּר ang tiyak at malaking batong nasa tagpo; ang “malaking bato” ay mas malinaw kaysa sa payak na “bato” para sa צוּר.
- source_word: וְשַׂכֹּתִי
  choice: at tatakpan kita
  rationale: Ang סכך ay nangangahulugang takpan o sanggalangan. Pinananatili ng “tatakpan” ang kongkretong larawan at maayos itong kaugnay ng “aking kamay.”
- source_word: כַּפִּי עָלֶיךָ
  choice: ng aking kamay
  rationale: Bagaman maaaring tumukoy ang כַּף sa palad, natural na ginagamit sa Tagalog ang “kamay” at hindi nito labis na tinutukoy ang anatomiya. Ang diwa ng עָלֶיךָ ay naipapaloob sa pandiwang “tatakpan kita.”
- source_word: עַד עָבְרִי
  choice: hanggang sa makaraan ako
  rationale: Ipinakikita ng עַד ang hangganan ng pagtatakip. Ang “makaraan ako” ay natural at pinananatili ang diwa ng pagdaan nang hindi labis na nilulutas ang aspekto.
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa Diyos (“aking kamay”)
  choice: Panatilihin ang kongkretong pahayag na “aking kamay.”
  alternative: aking pag-iingat; aking kapangyarihan
  rationale: Tuwirang gumagamit ang Hebreo ng larawang pangkatawan. Hindi ito dapat gawing abstraktong paliwanag, upang mapanatili ang lakas ng salaysay nang hindi nagpapasya tungkol sa pisikal na anyo ng Diyos.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang kongkretong larawan ng kaluwalhatian, bato, at kamay; iniwasan ang labis na pormal o makalumang pananalita.
