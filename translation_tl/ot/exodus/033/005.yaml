  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Sabihin mo sa mga Israelita, ‘Kayo ay isang bayang matigas ang ulo. Kung aahon ako sa gitna ninyo kahit isang saglit, lilipulin ko kayo. Kaya ngayon, alisin ninyo ang inyong mga palamuti[a], at malalaman ko kung ano ang gagawin ko sa inyo[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alahas” o “mga gayak.”
    reason: lexical_alternative
  - marker: b
    text: Literal na pinananatili ng Hebreo ang “at malalaman ko kung ano ang gagawin ko sa inyo,” sa halip na ipakahulugang “at magpapasiya ako.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Natural at malinaw na katumbas sa modernong Tagalog para sa kolektibong katawagang literal na “mga anak na lalaki ni Israel.”
- source_word: עַם קְשֵׁה עֹרֶף
  choice: Lahi kayong matigas ang ulo
  rationale: Pinananatili ang matinding idyoma ng pagmamatigas sa paraang likas at madaling maunawaan sa Tagalog.
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: Kung sumama ako sa gitna ninyo kahit isang saglit lamang
  rationale: Ipinahahayag ang kondisyunal na diwa at ang napakaikling panahon; ang “sumama” ay natural sa konteksto ng presensiya ni Yahweh habang ang “sa gitna ninyo” ay nagpapanatili sa larawang Hebreo.
- source_word: וְכִלִּיתִיךָ
  choice: lilipulin ko kayo
  rationale: Naghahatid ng ganap na pag-ubos sa hatol nang hindi tinutukoy ang paraan nito.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: alisin ninyo ang inyong mga palamuti
  rationale: Malawak ang “mga palamuti” upang saklawin ang alahas at iba pang gayak, at natural ang utos sa Tagalog.
- source_word: וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ
  choice: at malalaman ko kung ano ang gagawin ko sa inyo
  rationale: Pinananatili ang tahasang pandiwang “malalaman” at ang bukas na diwa ng gagawin sa Israel, sa halip na gawing “magpapasiya.”
theological_decisions:
- issue: Antropomorpikong pananalita tungkol sa pagkaalam ng Diyos
  choice: at malalaman ko kung ano ang gagawin ko sa inyo
  alternative: upang makapagpasiya ako kung ano ang gagawin ko sa inyo
  rationale: Ang Hebreo ay gumagamit ng pandiwang “malaman.” Pinananatili ito upang huwag alisin ang teolohikal at relasyonal na tensiyon ng teksto.
- issue: Isahang mga hulapi na tumutukoy sa Israel bilang isang kolektibo
  choice: Gumamit ng maramihang “ninyo/kayo” sa Tagalog
  alternative: Gumamit ng isahang “mo/ka” bilang kolektibong katawagan
  rationale: Mas natural at malinaw sa Tagalog ang maramihan para sa buong bayan, habang nananatili ang kolektibong pakahulugan.
- issue: Kondisyunal na lakas ng pag-akyat ni Yahweh sa gitna ng bayan
  choice: Kung sumama ako sa gitna ninyo kahit isang saglit lamang
  alternative: Sa isang saglit ay aahon ako sa gitna ninyo
  rationale: 'Ipinakikita ng konteksto ang kondisyunal na babala: ang banal na presensiya sa gitna ng matigas na bayan ay hahantong sa kanilang pagkalipol.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” sa halip na literal na “mga anak na lalaki ni Israel,” at pinanatili ang pangalang Yahweh at ang antropomorpikong “malalaman ko.”
