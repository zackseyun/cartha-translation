  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: tl
  text: At magsusugo ako ng isang anghel sa unahan mo[a], at palalayasin ko ang mga Cananeo, mga Amoreo, mga Heteo, mga Perezeo, mga Heveo, at mga Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang sugo.” Ang salitang Hebreo na מַלְאָךְ ay maaaring tumukoy sa isang anghel o isang taong sugo; sa kontekstong ito, higit na angkop ang “anghel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: At magsusugo ako
  rationale: Ang Qal perfect na may waw sa konteksto ng pangako ng Diyos ay may hinaharap na diwa. Ang “magsusugo ako” ay natural at marangal sa modernong Tagalog.
- source_word: לְפָנֶיךָ
  choice: sa unahan mo
  rationale: Idyomang Hebreo na literal na tumutukoy sa harap ng isang tao at nangangahulugang mauuna o mangunguna sa kaniya.
- source_word: מַלְאָךְ
  choice: isang anghel
  rationale: Maaaring tumukoy ang salitang Hebreo sa isang makalangit o taong sugo. Sa kontekstong ito, ang “anghel” ang pinakamalamang, ngunit pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: וְגֵרַשְׁתִּי
  choice: at palalayasin ko
  rationale: Malinaw na ipinahahayag ng גרשׁ ang pagtataboy o pagpapaalis sa mga naninirahan sa lupain.
- source_word: הַכְּנַעֲנִי
  choice: ang mga Cananeo
  rationale: Bagaman isahan ang etnonimo sa Hebreo, kolektibo ang gamit nito. Likas sa Tagalog ang maramihang anyo para sa buong pangkat ng mga tao.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Isinalin bilang kolektibong pangkat ng mga tao sa natural na Tagalog.
- source_word: וְהַחִתִּי
  choice: mga Heteo
  rationale: Ginamit ang karaniwang Tagalog na anyo ng pangalan ng bayan at ang maramihang panandang “mga.”
- source_word: וְהַפְּרִזִּי
  choice: mga Perezeo
  rationale: Ginamit ang nakikilalang Tagalog na anyo ng etnonimo bilang kolektibong pangkat.
- source_word: הַחִוִּי
  choice: mga Heveo
  rationale: Ginamit ang nakikilalang Tagalog na anyo ng etnonimo bilang kolektibong pangkat.
- source_word: וְהַיְבוּסִי
  choice: at mga Jebuseo
  rationale: Pinanatili ang pang-ugnay sa huling kasapi ng talaan at ginamit ang natural na kolektibong anyo sa Tagalog.
theological_decisions:
- issue: Pagkakakilanlan ng מַלְאָךְ sa talatang ito
  choice: Isinalin bilang “isang anghel” nang hindi tinutukoy kung ito ang Anghel ng PANGINOON o ibang anghel.
  alternative: “isang sugo” o “ang anghel”
  rationale: Hindi tahasang kinikilala ng talata ang sugo nang higit sa salitang מַלְאָךְ. Iniiwasan ng salin ang pagpasok ng isang tiyak na teolohikal na pagkakakilanlan na hindi mismo sinasabi rito, habang kinikilala sa talababa ang saklaw ng salita.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sa unahan mo” para sa idyomang Hebreo at ang maramihang “mga” sa mga etnonimo dahil kolektibo ang isahang anyong Hebreo at mas natural ito sa Tagalog.
