revisions:
- from: Nakikipag-usap si Yahweh kay Moises nang mukhaan[a], gaya ng pakikipag-usap ng isang tao sa kanyang kaibigan. Pagkatapos, bumabalik si Moises sa kampo, ngunit ang tagapaglingkod niyang si Josue na anak ni Nun, isang binata, ay hindi umaalis sa loob ng tolda[b].
  to: Nakikipag-usap si Yahweh kay Moises nang mukha sa mukha[a], gaya ng pakikipag-usap ng isang tao sa kanyang kaibigan. Pagkatapos, bumabalik si Moises sa kampo, ngunit ang tagapaglingkod niyang si Josue na anak ni Nun, isang binata, ay hindi umaalis mula sa loob ng tolda[b].
  rationale: Pinalitan ang hindi likas na “mukhaan” ng karaniwang idyomang Filipino na “mukha sa mukha,” habang pinananatili ang hindi nilulutas na lakas ng idyomang Hebreo. Idinagdag ang “mula” upang malinaw na isalin ang pag-alis mula sa loob ng tolda. Walang pagbabagong doktrinal o pagpapakahulugan ang ginawa.
