  verdict: revise
  source_fidelity: Ang salin ay wastong nagpapakita ng nakaugaliang kilos sa mga pandiwa, ng pangalang Yahweh, ng paghahambing sa pakikipag-usap ng tao sa kaibigan, at ng pananatili ni Josue sa tolda. Gayunman, ang “nang mukhaan” ay hindi ligtas o likas na katumbas ng פָּנִים אֶל־פָּנִים; ang karaniwang idyoma ay “mukha sa mukha.” Ang “hindi umaalis sa loob ng tolda” ay maaari ring mangahulugang hindi siya umaalis habang nasa loob; kailangan ang “mula sa loob ng tolda” upang maipahayag ang מִתּוֹךְ.
  naturalness: Mas natural sa makabagong Filipino ang “nang mukha sa mukha” kaysa “nang mukhaan,” at ang pagdaragdag ng “mula” bago ang “sa loob ng tolda” ay nag-aalis ng kalabuan sa direksiyon ng pag-alis.
  terminology: Ang “Yahweh,” “Moises,” “Josue,” “Nun,” “kampo,” at “tolda ng pagkikita” ay angkop. Ang “tagapaglingkod niyang si Josue” ay katanggap-tanggap para sa מְשָׁרְתוֹ at hindi kinakailangang baguhin.
