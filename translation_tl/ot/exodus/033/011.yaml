  - severity: medium
    issue: Malabo ang “hindi umaalis sa loob ng tolda.”
    rationale: Ang Hebreo ay nagsasabing hindi siya lumalabas o umaalis mula sa loob ng tolda. Ang “mula sa loob ng tolda” ang tuwirang nagpapahayag ng pinagmumulan.
