base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: tl
  text: Nakikipag-usap si Yahweh kay Moises nang mukha sa mukha[a], gaya ng pakikipag-usap ng isang tao sa kanyang kaibigan. Pagkatapos, bumabalik si Moises sa kampo, ngunit ang tagapaglingkod niyang si Josue na anak ni Nun, isang binata, ay hindi umaalis mula sa loob ng tolda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nang tuwiran” o “nang personal.” Ang idyomang Hebreo na “mukha sa mukha” ay nagpapahayag ng di-pangkaraniwang tuwiran at personal na pakikipagtagpo.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ang tolda ng pagkikita.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: Nakikipag-usap
  rationale: Ipinahahayag ng aspektong pangkasalukuyan sa Filipino ang paulit-ulit o nakaugaliang kilos sa salaysay, at mas natural ito kaysa sa literal na simpleng pangnagdaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: פָּנִים אֶל־פָּנִים
  choice: nang mukhaan
  rationale: Pinananatili nito ang matingkad na idyomang Hebreo tungkol sa tuwiran at personal na pakikipagtagpo, nang hindi ipinapaliwanag kung literal na nakita ni Moises ang anyo ng Diyos.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: gaya ng pakikipag-usap ng isang tao sa kanyang kaibigan
  rationale: Natural na Filipino ito at malinaw na naghahayag ng personal at malapit na pag-uusap na nasa paghahambing.
- source_word: וְשָׁב
  choice: Pagkatapos, bumabalik si Moises
  rationale: Ang pandiwa ay nauunawaan bilang pagpapatuloy ng nakaugaliang pangyayari. Nilinaw ang ipinahihiwatig na simuno upang maiwasan ang kalituhan sa Filipino.
- source_word: הַמַּחֲנֶה
  choice: kampo
  rationale: Karaniwan at malinaw na katumbas para sa kampamento ng Israel.
- source_word: וּמְשָׁרְתוֹ
  choice: ang tagapaglingkod niya
  rationale: Ipinahahayag ang tungkulin ni Josue bilang personal na tumutulong kay Moises nang hindi ipinahihiwatig na siya ay aliping pambahay.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: Josue na anak ni Nun
  rationale: Ginagamit ang kinagawiang anyong Filipino ng pangalan at natural na ipinapahayag ang patronimiko.
- source_word: נַעַר
  choice: isang binata
  rationale: Sa kontekstong ito, tumutukoy ito sa isang kabataang lalaki; ang “binata” ay maikli at natural nang hindi inuulit ang ideya ng paglilingkod.
- source_word: לֹא יָמִישׁ
  choice: hindi umaalis
  rationale: Malinaw na ipinahahayag ang hindi paglayo ni Josue at umaayon sa nakaugaliang daloy ng salaysay.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: sa loob ng tolda
  rationale: Natural na Filipino para sa pananatili sa kaloob-looban ng tolda; tinutukoy sa talababa na ito ang tolda ng pagkikita.
theological_decisions:
- issue: Ang antropomorpikong pahayag na nakipag-usap si Yahweh kay Moises nang “mukhaan”
  choice: Pinanatili ang idyomang “nang mukhaan” sa pangunahing teksto bilang paglalarawan ng tuwiran at personal na pakikipag-usap.
  alternative: Isalin lamang bilang “nang tuwiran” o “nang personal.”
  rationale: Pinananatili nito ang teolohikal na tensiyon ng tekstong Hebreo at hindi ipinapasiya kung ang pahayag ay nangangahulugan ng literal na pagkakita sa Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pangkasalukuyang anyo ng mga pandiwa upang ipakita ang paulit-ulit na gawi sa salaysay. Inilipat ang panandang [b] sa “tolda,” sapagkat ang talababa ay nagpapaliwanag kung aling tolda ang tinutukoy.
