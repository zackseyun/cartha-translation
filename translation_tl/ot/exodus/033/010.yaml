base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: tl
  text: Nang makita ng buong bayan ang haligi ng ulap na nakatayo sa pasukan ng tolda, tumayo ang buong bayan at sumamba[a], at ang bawat lalaki ay sumamba sa pasukan ng sarili niyang tolda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “yumukod” o “magpatirapa.” Ang pandiwang Hebreo ay tumutukoy sa isang pisikal na kilos ng pagpipitagan at madalas na nagsisilbing kilos ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Nang makita
  rationale: Ipinahahayag ng waw-consecutive ang pagsulong ng salaysay; natural na ipinakikita ng “Nang” ang ugnayang temporal sa sumunod na pagtayo at pagsamba.
- source_word: כָל הָעָם
  choice: ang buong bayan
  rationale: Tumutukoy ito sa sama-samang pamayanan ng Israel nang hindi idinaragdag ang “ng Israel,” na hindi tahasang nasa talata.
- source_word: עַמּוּד הֶעָנָן
  choice: ang haliging ulap
  rationale: Tuwiran at malinaw na pinananatili ang konkretong larawan ng haligi na binubuo o nahahayag bilang ulap.
- source_word: עֹמֵד
  choice: na nakatayo
  rationale: Inilalarawan ng participle ang posisyon ng haliging ulap; ang “nakatayo” ang pinakatuwirang katumbas.
- source_word: פֶּתַח הָאֹהֶל
  choice: sa pasukan ng tolda
  rationale: Ang פֶּתַח ay bukana o pasukan. Pinananatili ang payak na “tolda” sa halip na idagdag ang “Tolda ng Tipanan,” na nasa konteksto ngunit hindi tahasang inuulit sa talata.
- source_word: וְקָם
  choice: tumayo
  rationale: Ipinahihiwatig ng pandiwa ang pagbangon o pagtayo bilang tugon sa nakita; natural at marangal ang “tumayo” sa Filipino.
- source_word: וְהִשְׁתַּחֲווּ
  choice: sumamba
  rationale: Ang pandiwa ay tumutukoy sa pagyukod o pagpapatirapa bilang pagpipitagan. Sa kontekstong tugon sa nahayag na presensya ng PANGINOON, naihahatid ng “sumamba” ang relihiyosong bisa, habang pinananatili sa talababa ang pisikal na kahulugan.
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: Ang anyo ay panlalaking isahan na distributibo. Pinananatili ng “bawat lalaki” ang anyo ng pinagmulan sa halip na gawing mas pangkalahatan.
- source_word: פֶּתַח אָהֳלוֹ
  choice: sa pasukan ng sarili niyang tolda
  rationale: Pinananatili ang larawan ng bawat isa sa bukana ng kani-kaniyang tolda; nililinaw ng “sarili niyang” ang distributibong panghalip nang natural sa Filipino.
theological_decisions:
- issue: Paglalarawan sa tugon ng bayan sa nakikitang tanda ng presensya ng Diyos
  choice: sumamba
  alternative: yumukod / nagpatirapa
  rationale: Maaaring tukuyin ng Hebreong pandiwa ang pisikal na pagyukod o pagpapatirapa, ngunit dito ay kilos ito ng pagpipitagan sa nahayag na presensya ng PANGINOON. Ipinahahayag ng “sumamba” ang tungkuling panrelihiyon nang hindi itinatanggi ang pisikal na kilos, na nakatala sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong bayan” para sa kolektibong Israel at “bawat lalaki” upang mapanatili ang panlalaking distributibong anyo ng Hebreo. Ang marker na [a] ay inilagay kaagad pagkatapos ng salitang tinatalababan.
