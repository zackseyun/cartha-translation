  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: tl
  text: Nang marinig ng mga tao ang masamang balitang ito[a], nagluksa sila, at walang sinuman ang nagsuot ng kaniyang mga palamuti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “masamang salitang ito,” “masamang bagay na ito,” o “mabigat na pahayag na ito.” Literal na “salita/bagay” ang salitang Hebreo, ngunit tumutukoy rito sa balitang kapapahayag lamang.
    reason: lexical_alternative
  - marker: b
    text: O “mga alahas” o “mga pang-adorno.” Malawak ang kahulugan ng salitang Hebreo at hindi lamang isang uri ng palamuti ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: Nang marinig ng mga tao
  rationale: Ang pandiwa ay nasa anyong isahan dahil kolektibong pangngalan ang הָעָם, ngunit likas sa Tagalog ang maramihang diwa na “mga tao.” Ang “marinig” ang angkop sa pagtanggap ng ipinahayag na balita.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: ang masamang balitang ito
  rationale: Literal na maaaring “ang masamang salitang/bagay na ito,” ngunit tumutukoy ito sa naunang pahayag ng Diyos; natural at malinaw sa Tagalog ang “masamang balita,” habang inilalahad sa talababa ang mas literal na saklaw.
- source_word: וַיִּתְאַבָּלוּ
  choice: nagluksa sila
  rationale: Ang hitpael ng אבל ay nagpapahayag ng pagpasok sa kalagayan o gawaing pagluluksa; mas tiyak ang “nagluksa” kaysa simpleng “nalungkot.”
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: at walang sinuman ang nagsuot
  rationale: Ang אִישׁ ay distributibo rito—bawat isa ay hindi nagsuot—kaya natural na ipinahahayag sa Tagalog bilang “walang sinuman.”
- source_word: עֶדְיוֹ עָלָיו
  choice: ng kaniyang mga palamuti
  rationale: Ang עֲדִי ay malawak na tumutukoy sa mga bagay na pandekorasyon o pang-adorno. Ipinapaloob ng “nagsuot” ang diwa ng עָלָיו, “sa ibabaw/sa sarili niya.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “walang sinuman” bilang natural na distributibong katumbas ng Hebreong אִישׁ, nang hindi kinakailangang gawing tiyak sa kasarian ang Filipino. Inilagay ang [b] pagkatapos ng “mga palamuti” upang malinaw ang salitang tinatalabaan.
