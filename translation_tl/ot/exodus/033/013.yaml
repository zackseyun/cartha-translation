base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: tl
  text: Kaya ngayon, kung nakasumpong ako ng lingap sa iyong paningin, ipaalam mo sana sa akin ang iyong mga daan, upang makilala kita at sa gayon ay makasumpong ako ng lingap sa iyong paningin. Isaalang-alang mo rin na ang bansang ito ay iyong bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, magkaibang salita ang ginamit: “bansa” at “bayan.”'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag ang paglipat at lohikal na paglalagom mula sa naunang pakiusap; natural itong katumbas ng temporal at inferensiyal na puwersa ng Hebreo.
- source_word: נָא
  choice: sana
  rationale: Magalang na kataga ng pagsusumamo; likas sa makabagong Tagalog at hindi arkaiko.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: nakasumpong ako ng lingap sa iyong paningin
  rationale: Pinananatili ang idyomang Hebreo at ang personal na pagtanggap na ipinahihiwatig ng חֵן; ang 'lingap' ay marangal ngunit nauunawaan.
- source_word: הוֹדִעֵנִי
  choice: ipaalam mo ... sa akin
  rationale: Tumpak sa causative na diwang 'gawing malaman' at natural sa Tagalog.
- source_word: דְּרָכֶךָ
  choice: ang iyong mga daan
  rationale: Plural ang anyong Hebreo at tumutukoy sa mga paraan ng pagkilos o pakikitungo ng Diyos; pinananatili ang bilang at talinghaga.
- source_word: וְאֵדָעֲךָ
  choice: upang makilala kita
  rationale: Pinananatili ang layunin ng pakiusap at ang personal at ugnayang diwa ng 'makilala,' hindi lamang ang pagkakaroon ng impormasyon.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: at sa gayon ay makasumpong ako ng lingap sa iyong paningin
  rationale: Ipinahahayag ang layunin o bunga at pinananatili ang mahalagang pag-uulit ng parirala.
- source_word: וּרְאֵה
  choice: Isaalang-alang mo rin
  rationale: Ang literal na 'tingnan' ay ginagamit dito bilang idyomatikong paghiling na pansinin o kilalanin ang isang mahalagang katotohanan.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: na ang bansang ito ay iyong bayan
  rationale: Pinananatili ang pagkakaiba ng גּוֹי bilang 'bansa' at עַם bilang 'bayan,' pati ang ugnayang ipinahihiwatig ng 'iyong bayan.'
theological_decisions:
- issue: Ugnayang tipan sa pangwakas na sugnay
  choice: ang bansang ito ay iyong bayan
  alternative: ang bayang ito ay iyong bayan
  rationale: Magkaibang salita ang ginamit sa Hebreo—גּוֹי at עַם. Pinananatili ng salin ang parehong pambansa at ugnayang wika nang hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Kahulugan ng pagkilala sa Diyos
  choice: upang makilala kita
  alternative: upang malaman ko ang tungkol sa iyo
  rationale: Ang tuwirang layon na panghalip sa Hebreo ay nagbibigay-daan sa personal at ugnayang pagkilala; hindi ito dapat paliitin sa kaalamang pangkaisipan lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang 'lingap' upang mapanatili ang pormal na himig at ang ideya ng mabuting pagtanggap; iniwasan ang labis na arkaikong pananalita. Ang tanging talababa ay nilagyan ng katugmang [a] sa pangunahing teksto.
