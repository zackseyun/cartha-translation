  terminology: Ang “Yahweh,” “Moises,” “Ehipto,” at mga pangalan ng mga patriarka ay wasto. Ang “supling” ay mas tuwirang katumbas ng kolektibong זֶרַע kaysa “lahi,” na maaari ring tumukoy sa pangkat-etniko.
