revisions:
- from: Pagkatapos, sinabi ni Yahweh kay Moises[a], “Umalis kayo rito—ikaw at ang bayang inilabas mo mula sa lupain ng Ehipto—at pumunta kayo sa lupaing ipinangako ko nang may panunumpa kina Abraham, Isaac, at Jacob nang sabihin ko, ‘Ibibigay ko ito sa iyong lahi.’[b]”
  to: Pagkatapos, sinabi ni Yahweh kay Moises[a], “Umalis ka rito at umahon, kasama ang bayang inilabas mo mula sa lupain ng Ehipto, patungo sa lupain na isinumpa ko kina Abraham, Isaac, at Jacob nang sabihin ko, ‘Ibibigay ko ito sa iyong supling.’[b]”
  rationale: Inayos ang mga pautos upang manatiling isahan, gaya ng Hebreo, at ibinalik ang diwa ng pag-ahon. Pinalitan ang “lahi” ng “supling” upang mas tumpak na maipahayag ang kolektibong זֶרַע nang hindi nilulutas ang saklaw nito. Napanatili ang kahulugan ng panunumpa, ang direksiyon patungo sa lupain, at ang mga angkla at nilalaman ng talababa.
