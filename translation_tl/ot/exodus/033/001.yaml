id: EXO.33.1
reference: Exodus 33:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises[a], “Umalis ka rito at umahon, kasama ang bayang inilabas mo mula sa lupain ng Ehipto, patungo sa lupain na isinumpa ko kina Abraham, Isaac, at Jacob nang sabihin ko, ‘Ibibigay ko ito sa iyong supling.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; tradisyonal na isinasalin na “ang PANGINOON.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “sa iyong binhi” o “sa iyong mga inapo.” Ang salitang Hebreo ay anyong isahan ngunit may kolektibong kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi” bilang pambungad sa tuwirang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Umalis kayo rito ... at pumunta kayo
  rationale: Ang magkasunod na pautos ay may diwang pag-alis at pag-ahon/pagpunta. Ang “umalis ... at pumunta” ay natural sa Tagalog at hindi nagpipilit ng literal na pisikal na pag-akyat.
- source_word: אַתָּה וְהָעָם
  choice: ikaw at ang bayan
  rationale: Tuwirang sinasalamin ang ikalawang panauhang isahan na si Moises at ang tiyak na bayang kasama niya.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: na inilabas mo
  rationale: Ang Hiphil ng עלה ay “ipinaahon/ilabas.” Sa konteksto ng Exodo, malinaw at natural ang “inilabas,” habang pinananatili na si Moises ang gramatikal na paksa.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwirang katumbas ng pariralang pinagmulan at akma sa marangal na rehistro ng salaysay.
- source_word: אֶל הָאָרֶץ
  choice: sa lupain
  rationale: Ipinahahayag ang direksiyon patungo sa ipinangakong lupain nang natural sa Tagalog.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: ipinangako ko nang may panunumpa
  rationale: Malinaw na inilalahad ang diwa ng pandiwang Hebreo na tumutukoy sa taimtim na panunumpa, hindi lamang sa karaniwang pangako.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Ang “kina” ay likas na pang-ukol sa Tagalog para sa maraming pangalang pantangi at sapat na kumakatawan sa inuulit na לְ sa Hebreo.
- source_word: לֵאמֹר
  choice: nang sabihin ko
  rationale: Natural na ipinakikilala ang mismong nilalaman ng sinumpaang pangako.
- source_word: לְזַרְעֲךָ
  choice: sa iyong lahi
  rationale: Ang זֶרַע ay kolektibong isahan na maaaring tumukoy sa mga supling o salinlahi; pinananatili ng “lahi” ang kolektibong lawak nang hindi nilulutas kung isa o marami ang tinutukoy.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay transliterasyong nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Pananagutan ni Moises sa pariralang “ang bayang inilabas mo”
  choice: 'Pinanatili ang ikalawang panauhan: “inilabas mo”'
  alternative: “inilabas ko” o “inilabas natin”
  rationale: Tahasan sa Hebreo na si Moises ang gramatikal na paksa. Pinananatili nito ang tensiyon sa konteksto at hindi ito inaayon sa ibang pahayag na Diyos ang naglabas sa Israel.
- issue: Kolektibong kahulugan ng זֶרַע
  choice: lahi
  alternative: binhi; mga inapo
  rationale: Ang “lahi” ay natural at kolektibo sa Tagalog. Hindi nito sapilitang ginagawang tahasang maramihan ang anyong isahan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangmaramihang “kayo” sa mga pautos dahil kasama ni Moises ang bayan, ngunit pinanatili ang isahang “mo” sa sugnay na tumutukoy kay Moises. Ang mga gitling na pahaba ay nagpapalinaw sa nakasingit na “ikaw at ang bayan” nang hindi binabago ang relasyon ng mga sugnay.
