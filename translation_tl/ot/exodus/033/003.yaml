  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: tl
  text: patungo sa isang lupain kung saan umaagos ang gatas at pulot. Hindi ako aahon sa gitna ninyo,[a] sapagkat kayo ay isang bayang matigas ang batok, baka ubusin ko kayo[b] habang nasa daan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa piling ninyo” o “kasama ninyo.”
    reason: lexical_alternative
  - marker: b
    text: O “lipulin ko kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: patungo sa isang lupain
  rationale: Ipinahahayag ng אֶל ang direksiyon, at ang anyong walang pantukoy ng אֶרֶץ ay natural na maisalin bilang “isang lupain,” bagaman malinaw sa konteksto na ito ang ipinangakong lupain.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: lupaing dinadaluyan ng gatas at pulot
  rationale: Pinananatili nito ang metapora ng masaganang lupain sa natural at dignified na modernong Tagalog. Hindi nililimitahan ng “pulot” ang דְבָשׁ sa isang tiyak na uri.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Sapagkat hindi ako aahon
  rationale: Ang “sapagkat” ay nagpapanatili sa paliwanag na ugnayan ng כִּי, at ang “aahon” ay tuwirang kumakatawan sa עלה at sa paglalakbay paakyat sa lupain.
- source_word: בְּקִרְבְּךָ
  choice: sa gitna ninyo
  rationale: Pinananatili nito ang larawang ang presensiya ng Diyos ay nasa loob o kalagitnaan ng sambayanan, hindi lamang kasabay nila.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: isang bayang matigas ang batok
  rationale: Pinananatili ang Hebreong metapora ng matigas na leeg o batok bilang paglalarawan sa mapanghamong katigasan ng loob, sa halip na gawing payak na “matigas ang ulo.”
- source_word: פֶּן אֲכֶלְךָ
  choice: baka ubusin ko kayo
  rationale: Ang “baka” ay natural na nagpapahayag ng kinatatakutang kahihinatnan ng פֶּן. Ang “ubusin” ay nagpapanatili sa tindi at larawan ng כלה nang hindi nagtatakda ng espesipikong paraan ng paghatol.
- source_word: בַּדָּרֶךְ
  choice: habang nasa daan
  rationale: Natural itong katumbas ng pariralang tumutukoy sa panahon ng kanilang paglalakbay.
theological_decisions:
- issue: Pahayag tungkol sa presensiya ng Diyos
  choice: hindi ako aahon sa gitna ninyo
  alternative: hindi ako aahon na kasama ninyo
  rationale: Ang “sa gitna ninyo” ay nagpapanatili sa tensiyon na ang banal na presensiya ng Diyos sa mismong kalagitnaan ng mapaghimagsik na bayan ang maaaring maghatid ng paghatol.
- issue: Tindi ng paghatol sa אֲכֶלְךָ
  choice: baka ubusin ko kayo
  alternative: baka lipulin ko kayo
  rationale: Ang “ubusin” ay mas malapit sa saklaw at matingkad na larawan ng pandiwa, samantalang ang “lipulin” ay wastong alternatibo ngunit mas tahasang nagpapakahulugang pagwasak.
translation_notes:
  register: Modernong Filipino Tagalog na may dignidad at malinaw sa karaniwang mambabasa. Pinanatili ang pamilyar ngunit makahulugang idyomang “matigas ang batok” at iniwasan ang labis na arkaikong pananalita. Inilagay ang bawat talababa sa pariralang aktuwal nitong ipinapaliwanag.
