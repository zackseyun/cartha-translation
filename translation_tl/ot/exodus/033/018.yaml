  text: Then he said[a], “Please show me your glory.”
translation:
  language: tl
  text: At sinabi niya, “Ipakita mo sa akin, nakikiusap ako, ang iyong kaluwalhatian[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipakita mo sa akin ang iyong kaningningan.” Literal na “pangyarihin mong makita ko” ang pandiwang Hebreo, at ang “kaluwalhatian” ay maaari ring tumukoy sa nahahayag na kaningningan o karangalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Pagkatapos ay sinabi niya
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos ay sinabi niya” at pinananatili nito ang pagkakasunod-sunod ng pangyayari.
- source_word: הַרְאֵנִי
  choice: Ipakita mo sa akin
  rationale: Ang Hiphil imperative ng ראה na may hulaping unang panauhang isahan ay literal na “pangyarihin mong makita ko.” Ang “Ipakita mo sa akin” ang natural na Tagalog na nagpapanatili sa causative at tuwirang pakiusap.
- source_word: נָא
  choice: nakikiusap ako
  rationale: Ang נָא ay nagpapahayag ng magalang at taimtim na pakiusap. Ang “nakikiusap ako” ay malinaw at marangal sa kasalukuyang Tagalog, at higit na tahasang kumakatawan sa puwersa ng partikula kaysa sa simpleng “sana.”
- source_word: אֶת
  choice: '[pananda ng tiyak na tuwirang layon; hindi isinalin nang hiwalay]'
  rationale: Ang אֶת ay panandang gramatikal ng tiyak na tuwirang layon at walang kailangang hiwalay na katumbas sa Tagalog.
- source_word: כְּבֹדֶךָ
  choice: ang iyong kaluwalhatian
  rationale: Ang כָּבוֹד ay maaaring tumukoy sa kaluwalhatian, karangalan, o nahahayag na kaningningan. Sa kontekstong ito, pinananatili ng “kaluwalhatian” ang lawak at teolohikal na tensiyon ng salitang Hebreo nang hindi nililimitahan ito sa nakikitang ningning lamang.
theological_decisions:
- issue: Kahulugan ng “iyong kaluwalhatian” sa kahilingan ni Moises
  choice: ang iyong kaluwalhatian
  alternative: ang iyong kaningningan; ang kapuspusan ng iyong presensya
  rationale: Hindi tahasang tinutukoy ng Hebreo kung nakikitang kaningningan, banal na kadakilaan, o pagpapahayag ng presensya ng Diyos ang hinihiling ni Moises na makita. Pinananatili ng “kaluwalhatian” ang sadyang lawak at tensiyon ng כָּבוֹד sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “nakikiusap ako” upang malinaw na katawanin ang נָא nang hindi gumagamit ng makalumang pananalita. Inilagay ang talababa matapos ang buong pangungusap sapagkat ipinapaliwanag nito kapwa ang pandiwa at ang “kaluwalhatian.”
