  to: Sapagkat paano nga malalaman na nakasumpong ako ng lingap sa iyong paningin—ako at ang iyong bayan? Hindi ba sa pagsama mo sa amin, at sa gayon ay magiging natatangi[a] kami—ako at ang iyong bayan—sa lahat ng bayan sa ibabaw ng lupa?
