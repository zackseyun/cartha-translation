    issue: Ang ‘anupat ... ay natatangi’ ay hindi gaanong malinaw na nagpapakita ng resultang ipinahahayag ng וְנִפְלֵינוּ.
    rationale: Ang ‘at sa gayon ay magiging natatangi kami’ ay pinananatili ang kaugnayan sa pagsama ng Diyos at mas malinaw na isinasalin ang pandiwang anyo nang natural sa modernong Filipino.
  - severity: low
    issue: Ang ‘lahat ng bayang nasa ibabaw ng lupa’ ay bahagyang mabigat at maaaring magmukhang ang ‘nasa ibabaw ng lupa’ ay mahigpit na pang-uring naglilimita sa ‘bayang.’
    rationale: Ang ‘lahat ng bayan sa ibabaw ng lupa’ ay mas likas habang pinananatili ang saklaw na pandaigdig ng Hebreong parirala.
