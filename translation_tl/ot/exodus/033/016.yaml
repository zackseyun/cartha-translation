base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: tl
  text: Sapagkat paano nga malalaman na nakasumpong ako ng lingap sa iyong paningin—ako at ang iyong bayan? Hindi ba sa pagsama mo sa amin, at sa gayon ay magiging natatangi[a] kami—ako at ang iyong bayan—sa lahat ng bayan sa ibabaw ng lupa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ibinukod” o “ginawang naiiba.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging kapansin-pansing natatangi o hiwalay sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה יִוָּדַע אֵפוֹא
  choice: Sapagkat paano nga malalaman
  rationale: Ipinakikita ng “Sapagkat” ang kaugnayan sa naunang pahayag, habang likas na ipinahahayag ng “paano nga” ang tanong tungkol sa paraan at ang diin ng אֵפוֹא. Pinananatili ng “malalaman” ang balintiyak na diwa ng Niphal na יִוָּדַע.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: na nakasumpong ako ng lingap sa iyong paningin
  rationale: Pinananatili ang Hebreong idyoma ng pagkakaroon ng mabuting pagtanggap sa paningin ng isang tao. Ang “lingap” ay marangal at malinaw sa makabagong Filipino.
- source_word: אֲנִי וְעַמֶּךָ
  choice: ako at ang iyong bayan
  rationale: Pinananatili ang tahasang pag-uugnay ni Moises sa sarili niya at sa bayan ng Diyos, pati ang bahagyang nakabitin na ayos nito sa unang sugnay.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: Hindi ba sa pagsama mo sa amin
  rationale: Pinananatili ng “Hindi ba” ang retorikal na tanong na umaasang sasang-ayon ang kausap. Ang “sa pagsama mo” ay likas na Filipino para sa paraang ipinahahayag ng בְּ plus infinitive.
- source_word: וְנִפְלֵינוּ
  choice: anupat ... ay natatangi
  rationale: Ipinahahayag ng “anupat” ang bunga ng presensiya ng Diyos, at ng “natatangi” ang pagiging hayag na naiiba o bukod nang hindi nililimitahan ang pandiwa sa isang denominasyonal na pakahulugan.
- source_word: מִכָּל הָעָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: sa lahat ng bayang nasa ibabaw ng lupa
  rationale: Ginagamit ang kolektibong “lahat ng bayan” para sa paghahambing sa mga tao sa buong daigdig. Ang “nasa ibabaw ng lupa” ay nagpapanatili sa karaniwang Hebreong pananalita.
theological_decisions:
- issue: Batayan ng pagiging natatangi ng Israel
  choice: Ang pagsama o presensiya ng Diyos ang hayag na tanda na nagtatangi kay Moises at sa bayan.
  alternative: Ang batas, lupain, o lahing pagkakakilanlan ang pangunahing batayan ng kanilang pagiging natatangi.
  rationale: Tuwirang iniuugnay ng talata ang kanilang pagiging natatangi sa pagsama ng Diyos sa kanila; pinananatili ito ng “sa pagsama mo ... anupat.”
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lingap” at “sa iyong paningin” upang mapanatili ang Hebreong idyoma, at ang gitling na mahaba upang malinaw ngunit hindi lubusang pakinisin ang idinugtong na “ako at ang iyong bayan.”
