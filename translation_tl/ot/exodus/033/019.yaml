  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: tl
  text: At sinabi niya, “Ako mismo ang palalampasin ko sa harap mo ang lahat ng aking kabutihan, at ipahahayag ko sa harap mo ang pangalang Yahweh. Magpapakita ako ng kagandahang-loob sa sinumang pagpapakitaan ko ng kagandahang-loob, at mahahabag ako sa sinumang kahahabagan ko.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “maaawa ako sa sinumang kaaawaan ko.”
    reason: Alternatibong natural na salin ng רחם, na maaaring ipahayag bilang “mahabag” o “maawa.”
lexical_decisions:
- source_word: אַעֲבִיר
  choice: magpaparaan
  rationale: 'Ang Hiphil ng עבר ay may diwang sanhi: iparaan o hayaang dumaan. Pinananatili ng “magpaparaan” ang diwang ito nang hindi nagiging labis na literal.'
- source_word: כָּל טוּבִי
  choice: lahat ng aking kabutihan
  rationale: Saklaw ng טוּב ang kabutihan at mapagbigay na likas; ang “kabutihan” ay angkop sa konteksto ng pagpapakilala ng Diyos sa kanyang sarili at ng kanyang habag.
- source_word: עַל־פָּנֶיךָ
  choice: sa harap mo
  rationale: Ito ang natural na salin ng Hebreong idyoma at pinananatili ang kongkretong diwa ng pagpapakita sa presensiya ni Moises.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: ipahahayag ko ... ang pangalang Yahweh
  rationale: Sa kontekstong ito, ang קרא בשם ay pagpapahayag ng banal na pangalan at kaugnay na pagkakakilanlan, hindi pagtawag sa pangalan bilang panalangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: לְפָנֶיךָ
  choice: sa harap mo
  rationale: Pinananatili nito ang lokasyonal na diwa at ang pag-uulit ng larawan sa Hebreo.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Magpapakita ako ng kagandahang-loob sa sinumang pagpapakitaan ko ng kagandahang-loob
  rationale: Ang “kagandahang-loob” ay nagpapahayag ng mapagpalang pabor o biyaya. Pinananatili rin ang sadyang pag-uulit ng iisang ugat sa Hebreo.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: mahahabag ako sa sinumang kahahabagan ko
  rationale: Ang “mahahabag” ay tuwirang nagpapahayag ng רחם bilang pagkahabag o awa, at pinananatili ang madiing pag-uulit ng Hebreo.
- source_word: אֲנִי
  choice: Ako mismo
  rationale: Ang tahasang panghalip ay nagbibigay-diin sa gumagawa; ipinahahayag ito ng “Ako mismo” nang hindi ipinapasok ang mas eksklusibong diwa ng “ako lamang.”
theological_decisions:
- issue: Ang malayang pagpapahayag ng Diyos tungkol sa kagandahang-loob at habag
  choice: 'Pinanatili ang paulit-ulit na unang-panauhang pahayag: “Magpapakita ako ... pagpapakitaan ko” at “mahahabag ako ... kahahabagan ko.”'
  alternative: Gawing pangkalahatang simulain tungkol sa kabutihan ng Diyos, o isalin sa paraang nagpapasok ng isang mas tiyak na sistemang teolohikal.
  rationale: Idinidiin ng Hebreo ang kalayaan ng Diyos sa pagpapakita ng kagandahang-loob at habag. Pinananatili ng salin ang tensiyong iyon nang hindi nagpapasiya para sa mga susunod na debateng doktrinal.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Ginamit ang “Yahweh” bilang personal na pangalan, ang “kagandahang-loob” para sa חנן, at ang bahagyang mas marangal na “mahabag” para sa רחם; iniwasan ang labis na teknikal o denominasyonal na pananalita.
