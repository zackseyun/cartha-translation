  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה גַּ֣ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי מָצָ֤אתָ חֵן֙ בְּ/עֵינַ֔/י וָ/אֵדָעֲ/ךָ֖ בְּ/שֵֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Gagawin ko rin ang bagay na ito[a] na sinabi mo, sapagkat nakasumpong ka ng lingap sa aking paningin[b], at kilala kita sa pangalan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “usaping ito” o “salitang ito.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “nakasumpong ng lingap sa aking mga mata,” isang idyomang nangangahulugang tumanggap ng kanais-nais na pagtingin.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: גַּם
  choice: rin
  rationale: Nagdaragdag ito sa naunang kahilingan ni Moises; natural na ipinahahayag sa Filipino ng “rin.”
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: Malawak ang saklaw ng דָּבָר—maaaring “bagay,” “usapin,” o “salita.” Ang “bagay na ito” ay angkop sa ipinangakong pagkilos at hindi labis na nililimitahan ang kahulugan.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: na sinabi mo
  rationale: Likas sa modernong Filipino at pinananatili ang tuwirang pagtukoy sa sinalita ni Moises.
- source_word: אֶעֱשֶׂה
  choice: Gagawin ko
  rationale: Payak at tuwirang katumbas ng karaniwang pandiwang עשה sa kontekstong ito.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: nakasumpong ka ng lingap sa aking paningin
  rationale: Pinananatili ang Hebreong idyoma at larawan habang malinaw na ipinahahayag ang kanais-nais na pagtanggap ng Diyos kay Moises.
- source_word: וָאֵדָעֲךָ
  choice: at kilala kita
  rationale: Ipinahahayag ng ידע rito ang personal na pagkakilala; ang pangkasalukuyang “kilala kita” ang pinakanatural sa Filipino.
- source_word: בְּשֵׁם
  choice: sa pangalan
  rationale: Pinananatili ang maikli ngunit personal na diwa ng tiyak na pagkakilala kay Moises.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na gawing titulo.
- issue: Diwa ng pagkakilala sa וָאֵדָעֲךָ בְּשֵׁם
  choice: at kilala kita sa pangalan
  alternative: at pinili kita; at kinikilala kita nang personal
  rationale: Pinananatili ang tahasang pahayag ng personal at tiyak na pagkakilala nang hindi nagdaragdag ng ideya gaya ng pagpili na hindi hayagang sinabi rito.
translation_notes:
  register: Modernong Filipino na may marangal at payak na himig. Pinanatili ang Hebreong larawan sa “sa aking paningin,” ngunit ginamit ang likas na ayos at pandiwa sa Filipino. Inilagay ang panandang [a] sa mismong pariralang tinutukoy ng talababa.
