  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: tl
  text: Sinabi ng PANGINOON, “Tingnan mo, may isang lugar sa tabi ko, at tatayo ka sa ibabaw ng malaking bato.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang salin sa malaking titik para sa banal na pangalang YHWH, alinsunod sa konsultasyong teksto at sa dignified na modernong gamit.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Direktang pantawag-pansin kay Moises; mas natural sa modernong Tagalog kaysa “Narito.”
- source_word: מָקוֹם אִתִּי
  choice: may isang lugar sa tabi ko
  rationale: Pinananatili ang spatial na diwa ng אִתִּי (“kasama/katabi ko”) nang hindi nilulutas nang higit sa sinasabi ng Hebreo.
- source_word: וְנִצַּבְתָּ
  choice: Tumayo ka
  rationale: Ang anyo ay maaaring magpahayag ng kasunod na gagawin o utos sa konteksto; natural na utos ang Tagalog habang pinananatili ang tuwirang tagubilin.
- source_word: הַצּוּר
  choice: malaking bato
  rationale: Ang צוּר ay tumutukoy sa malaking bato o batuhan, hindi lamang sa maliit na bato; “malaking bato” ang malinaw at pangkaraniwang Tagalog.
theological_decisions:
- issue: Paglalarawan sa “lugar” na kaugnay ng presensya ng Diyos
  choice: sa tabi ko
  alternative: malapit sa akin / kasama ko
  rationale: Hindi ginagawang abstraktong teolohikal ang pahayag; pinananatili ang kongkretong spatial na pananalita ng talata at ang likas nitong tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “PANGINOON” para sa tetragrammaton at tuwirang pananalita na madaling maunawaan.
