  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: tl
  text: Ngunit sinabi niya, “Hindi mo kayang makita ang mukha ko[a], sapagkat walang taong[b] makakakita sa akin at mabubuhay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang presensya ko.” Sa literal na Hebreo, “ang mukha ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang “tao” rito ay tumutukoy sa sinumang tao at sa sangkatauhan sa pangkalahatan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi niya
  rationale: Isinusulong ng waw-consecutive ang salaysay, ngunit ang “Ngunit” ay likas na nagpapahayag ng pagsalungat sa kahilingan ni Moises sa naunang talata.
- source_word: לֹא תוּכַל
  choice: Hindi mo maaaring
  rationale: Ang יכל ay tumutukoy dito sa kakayahan o posibilidad, hindi sa pahintulot.
- source_word: לִרְאֹת
  choice: makita
  rationale: Tuwirang tumutukoy ang ראה sa pagtingin o pagkakita; natural sa Filipino ang anyong “makita” kasunod ng “maaaring.”
- source_word: אֶת־פָּנַי
  choice: ang mukha ko
  rationale: Pinananatili nito ang kongkretong kahulugan ng פָּנִים at hindi agad ipinapalit ang interpretatibong “presensya.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang pahayag sa isang malinaw at marangal na rehistro.
- source_word: לֹא יִרְאַנִי
  choice: walang taong makakakita sa akin
  rationale: Ipinahahayag ng imperfect ang pangkalahatang tuntunin; ang negatibong Hebrew ay natural na naipapahayag sa Filipino sa pamamagitan ng “walang taong.”
- source_word: הָאָדָם
  choice: tao
  rationale: Generic ang singular na הָאָדָם at tumutukoy sa sinumang tao o sa sangkatauhan sa pangkalahatan; likas at inklusibo ang “tao” sa modernong Filipino.
- source_word: וָחָי
  choice: at mabubuhay
  rationale: 'Ipinahahayag nito ang bunga o kalalabasan: walang taong makakakita sa Diyos at patuloy na mabubuhay.'
theological_decisions:
- issue: Antropomorpikong pananalita sa “ang mukha ko”
  choice: Panatilihin sa pangunahing teksto ang “ang mukha ko”
  alternative: ang presensya ko
  rationale: Kongkreto ang pananalita ng Hebrew. Pinananatili ng salin ang tunay na larawan at inilalagay lamang sa talababa ang posibleng diwang “presensya,” sa halip na tahimik itong gawing abstrakto.
- issue: Pangkalahatang saklaw ng הָאָדָם
  choice: Isalin bilang “tao”
  alternative: sangkatauhan; isang taong nilalang
  rationale: Bagaman singular sa gramatika, generic ang salita at saklaw nito ang lahat ng tao. Ang “tao” ay tumpak at natural sa Filipino nang hindi nililimitahan sa lalaki.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang kongkretong “mukha” at ang pangkalahatang pahayag tungkol sa tao. Inilagay ang [a] kaagad pagkatapos ng pariralang tinutukoy nito at ang [b] pagkatapos ng buong pahayag na nililinaw nito.
