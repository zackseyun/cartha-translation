  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: tl
  text: Kaya hinubad ng mga Israelita ang kanilang mga palamuti mula sa Bundok Horeb[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hinubad ng mga Israelita ang kanilang mga palamuti sa Bundok Horeb.” Maaaring tumukoy ang pariralang Hebreo sa lugar kung saan nila hinubad ang mga ito, o sa panahong mula noon ay hindi na nila isinuot ang mga ito.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: inalis ... ang kanilang mga palamuti
  rationale: Ang hitpael ng נצל sa kontekstong ito ay tumutukoy sa pag-aalis sa sarili ng isinusuot na palamuti. Sa Filipino, likas nang ipinahihiwatig ng pagmamay-aring “kanilang” na inalis nila sa kanilang sarili ang mga ito.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ang “mga Israelita” ang natural at malinaw na modernong Filipino para sa kolektibong idyomang Hebreo na “mga anak na lalaki ni Israel,” nang hindi nagmumungkahi na mga lalaki lamang ang tinutukoy.
- source_word: עֶדְיָם
  choice: kanilang mga palamuti
  rationale: Malawak ang saklaw ng עֲדִי bilang palamuti o adornment; hindi ito labis na nililimitahan sa alahas o sa isang partikular na materyal.
- source_word: מֵהַר חוֹרֵב
  choice: mula sa Bundok Horeb
  rationale: 'Pinananatili ng “mula sa” ang anyo at tunay na kalabuan ng מִן: maaaring tumukoy sa lugar ng pag-aalis o sa panahong nagsimula roon at nagpatuloy pagkatapos.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” sa halip na literal na “mga anak na lalaki ni Israel” upang maging natural at inklusibo sa kolektibong tinutukoy. Hindi tahasang idinagdag ang “mula noon” sa pangunahing teksto upang mapanatili ang kalabuan ng Hebreo; ipinaliwanag ito sa talababa.
