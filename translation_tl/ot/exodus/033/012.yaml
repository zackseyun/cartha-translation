  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Moises kay Yahweh, “Tingnan mo, sinasabi mo sa akin, ‘Dalhin mo paakyat ang bayang ito,’ ngunit hindi mo ipinaalam sa akin kung sino ang isusugo mong kasama ko. Gayunman, sinabi mo, ‘Kilala kita sa pangalan[a], at nakasumpong ka rin ng lingap sa aking paningin[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “Kilala kita sa pangalan,” isang idyomang nagpapahayag ng personal na pagkakilala at pabor.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “nakatagpo ka rin ng biyaya sa aking mga mata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pinananatili ang tuwirang pautos na nagsisilbing pambungad sa pakiusap ni Moises, at natural pa rin ito sa makabagong Filipino.
- source_word: הַעַל
  choice: Dalhin mo paakyat
  rationale: Ipinahahayag nito ang causative at direksiyonal na diwa ng Hiphil ng עלה nang hindi ipinahihiwatig na literal na bubuhatin ni Moises ang bayan.
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Pinananatili ang isahang kolektibong pangngalan at ang demonstratibong maaaring may bahagyang mapaglayong himig.
- source_word: הוֹדַעְתַּנִי
  choice: ipinaalam sa akin
  rationale: Natural na Filipino ito para sa causative na diwang ‘ipaalam’ o ‘gawing malaman.’
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: kung sino ang isusugo mong kasama ko
  rationale: Pinananatili ang pagtukoy sa isang kasamang persona at ang payak na diwa ng pagsama sa עִם.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Kilala kita sa pangalan
  rationale: Pinanatili ang Hebreong idyoma at ang personal na puwersa nito nang hindi ito pinalawak tungo sa isang mas tiyak na teolohikal na paliwanag.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: nakasumpong ka rin ng lingap sa aking paningin
  rationale: Pinananatili ang larawan ng orihinal na idyoma; ang ‘lingap’ ay malinaw na naghahatid ng pabor o mabuting pagtanggap sa kontekstong ito.
- source_word: וְגַם
  choice: rin
  rationale: Ipinakikita ang dagdag na diin ng Hebreo sa ikalawang pahayag tungkol kay Moises.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: ngunit ... Gayunman, sinabi mo
  rationale: Malinaw na inilalahad sa natural na Filipino ang pagsalungat at diin ng paulit-ulit na panghalip sa Hebreo.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tuwirang lumilitaw sa Hebreo; pinananatili ito sa salin sa halip na palitan ng titulo.
- issue: Diwa ng ‘Kilala kita sa pangalan’
  choice: Panatilihin ang relasyonal na idyoma
  alternative: Kilala kita nang personal o personal kitang pinili
  rationale: Nagpapahayag ang idyoma ng personal na pagkakilala at pabor, ngunit hindi tahasang sinasabi rito ng Hebreo ang mas tiyak na ideya ng pagpili; kaya hindi iyon idinagdag sa pangunahing teksto.
- issue: Diwa ng חֵן
  choice: lingap
  alternative: biyaya o pabor
  rationale: Ang ‘lingap’ ay naghahatid ng mabuting pagtanggap o pabor nang hindi awtomatikong nililimitahan ang salita sa isang mas teknikal na doktrinal na kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tuwirang himig ng reklamo ni Moises, ang Hebreong mga idyoma, at ang pagkakaiba ng ‘ipinaalam’ at ‘sinabi’ nang hindi nagdaragdag ng denominasyonal na paliwanag.
