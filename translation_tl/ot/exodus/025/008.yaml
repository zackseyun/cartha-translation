  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: tl
  text: At gumawa sila para sa akin ng isang santuwaryo upang manahan ako sa gitna nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “sa gitna nila” o “sa kanilang kalagitnaan.” Maramihan ang anyong Hebreo at tumutukoy sa presensiya ng Diyos sa gitna ng bayan, hindi lamang sa loob ng santuwaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: At ipagawa nila
  rationale: Sa kontekstong nagbibigay ng tagubilin, ang anyo ay may puwersang pautos sa ikatlong panauhang maramihan. Ang “ipagawa nila” ay natural sa modernong Tagalog at ipinahihiwatig na ang bayan ang may pananagutang magpatayo o gumawa nito.
- source_word: לִי
  choice: para sa akin
  rationale: 'Ipinapahayag ng לִי ang layunin o kapakinabangan: ang santuwaryo ay gagawin para sa Diyos.'
- source_word: מִקְדָּשׁ
  choice: isang santuwaryo
  rationale: Ang מִקְדָּשׁ ay isang banal na lugar na ibinukod para sa presensiya ng Diyos. Ang “santuwaryo” ay maikli, dignified, at karaniwang terminong nauunawaan sa kontekstong biblikal.
- source_word: וְשָׁכַנְתִּי
  choice: upang manahan ako
  rationale: Ang שׁכן ay nangangahulugang manahan o tumira. Ang “upang” ay natural na naghahayag ng layunin o resultang kaugnay ng paggawa ng santuwaryo, nang hindi labis na nilulutas ang ugnayan ng dalawang sugnay.
- source_word: בְּתוֹכָם
  choice: sa gitna nila
  rationale: Literal na tumutukoy ang parirala sa kalooban o gitna ng isang pangkat. Pinananatili ng “sa gitna nila” ang maramihang panghalip at ang diin sa presensiya ng Diyos kasama ng bayan.
theological_decisions:
- issue: Ang tinutukoy na pananahanan ng Diyos
  choice: sa gitna nila
  alternative: sa loob nito
  rationale: Maramihan ang hulaping Hebreo—“nila,” hindi “nito.” Kaya ang tahasang sinabi ay mananahan ang Diyos sa gitna ng bayan; hindi dapat paliitin ang pahayag na para bang sa gusali lamang siya mananahan.
translation_notes:
  register: Modernong Filipino Tagalog na may dignified na tonong angkop sa Kasulatan. Pinanatili ang tradisyonal ngunit malinaw na “santuwaryo,” at ginamit ang natural na “sa gitna nila” upang maipakita ang maramihang referent ng Hebreo.
