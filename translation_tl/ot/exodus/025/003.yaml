base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: tl
  text: 'At ito ang handog na kukunin ninyo mula sa kanila: ginto, pilak, at tanso[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bronse”; ang Hebreong נְחֹשֶׁת ay maaaring tumukoy sa tanso o bronse, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: At ito ang
  rationale: Pinananatili ng “At” ang pang-ugnay na ו, at likas sa Filipino ang presentasyong “ito ang” upang ipakilala ang kasunod na talaan.
- source_word: הַ/תְּרוּמָה
  choice: handog
  rationale: Ang תְּרוּמָה ay ambag na ibinukod para sa banal na gamit. Sa kontekstong ito, natural at marangal ang “handog,” bagaman hindi nito ipinipilit ang isang tiyak na ritwal na kahulugan.
- source_word: אֲשֶׁר תִּקְח֖וּ מֵ/אִתָּם
  choice: na kukunin ninyo mula sa kanila
  rationale: Tuwirang inilalarawan ng pariralang ito ang handog; pinananatili ng “kukunin” ang karaniwang diwa ng Qal imperfect ng לקח at ng “mula sa kanila” ang pinagmulan.
- source_word: זָהָב
  choice: ginto
  rationale: Karaniwang katumbas sa Filipino ng materyal na tinutukoy.
- source_word: וָ/כֶסֶף
  choice: pilak
  rationale: Karaniwang katumbas sa Filipino ng metal na nasa talaan.
- source_word: וּ/נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay maaaring tumukoy sa copper o bronze. Ang “tanso” ang natural na malawak na katawagang Filipino para sa metal na ito, ngunit nililinaw sa talababa ang posibleng mas tiyak na kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handog” bilang madaling maunawaang katawagan sa banal na ambag, at pinanatili sa talababa ang leksikal na lawak ng נְחֹשֶׁת.
