base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: tl
  text: Mula sa isang talento ng dalisay na ginto, gagawin niya ito, pati ang lahat ng kagamitang ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy nang malawakan sa mga kasangkapan, sisidlan, o iba pang gamit na kaugnay ng ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: isang talento
  rationale: Isang pamantayang yunit ito ng timbang. Pinanatili ang tradisyonal na terminong metrologikal na “talento” sa halip na palitan ng di-tiyak na dami.
- source_word: זָהָב טָהוֹר
  choice: dalisay na ginto
  rationale: Likas at marangal na salin ito para sa gintong walang halo o malinis ang kalidad sa konteksto ng paggawa.
- source_word: יַעֲשֶׂה
  choice: gagawin niya
  rationale: Sinasalamin nito ang Qal imperfect na ikatlong panauhang panlalaki at ang himig ng tagubiling dapat isagawa.
- source_word: אֹתָהּ
  choice: ito
  rationale: Pinananatili ang pambabaeng isahang panghalip na tumutukoy sa ilawan sa naunang konteksto, nang hindi inuulit nang tahasan ang pangngalan.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: pati ang lahat ng kagamitang ito
  rationale: Ipinahahayag ng “pati” na ang iisang talento ng ginto ay para sa ilawan at sa mga kaugnay nitong gamit. Malawak ang saklaw ng כֵּלִים, kaya ang “kagamitan” ang pinakanatural na pangkalahatang katawagan.
