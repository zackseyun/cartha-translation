translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal ang tono. Ginamit ang mga pautos na “Gumawa ka” at “ikabit mo” upang likas na maipahayag ang sunod-sunod na tagubilin. Ang mga tunay na leksikal na alternatibo sa פֵּאָה at רֶגֶל ay pinanatili sa mga talababa.
