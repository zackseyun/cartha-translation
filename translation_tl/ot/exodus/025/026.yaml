  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: tl
  text: Gumawa ka para rito ng apat na singsing na ginto, at ilagay mo ang mga singsing sa apat na sulok[a] sa may apat nitong paa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apat na gilid” o “apat na dulo.”
    reason: lexical_alternative
  - marker: b
    text: O “apat na binti nito”; maaaring mangahulugan ang salitang Hebreo ng “paa” o “binti,” depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang Qal perfect na may prefixed conjunction sa sunod-sunod na tagubilin ay may puwersang pautos; natural itong ipinahahayag sa modernong Tagalog sa pamamagitan ng pandiwang pautos.
- source_word: לּוֹ
  choice: para rito
  rationale: Tumutukoy ang panlalaking isahang hulapi sa mesang inilalarawan sa konteksto; ang “rito” ay likas na pantukoy sa isang bagay.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: apat na singsing na ginto
  rationale: Malinaw at karaniwang parirala ito sa Tagalog para sa apat na ring na yari sa ginto.
- source_word: וְנָתַתָּ
  choice: at ikabit mo
  rationale: Bagaman pangunahing nangangahulugang “ilagay” ang נתן, ipinahihiwatig ng konteksto ng mga singsing sa mesa na ikinakabit ang mga ito; ang “ikabit” ay natural at hindi binabago ang praktikal na diwa ng tagubilin.
- source_word: עַל
  choice: sa
  rationale: Saklaw ng pang-ukol ang pagkakalagay sa o sa mismong tinutukoy na lokasyon; “sa” ang pinakanatural na katumbas dito.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: apat na sulok
  rationale: Maaaring tumukoy ang פֵּאָה sa dulo, gilid, o sulok; “sulok” ang pinakaangkop sa apat na puwesto ng mesa, habang pinananatili sa talababa ang ibang posibilidad.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: na kinaroroonan ng apat na paa nito
  rationale: Pinananatili ng parirala ang ugnayan ng apat na sulok sa apat na suporta ng mesa nang hindi labis na tinutukoy ang eksaktong konstruksiyon; maaaring mangahulugan ang רֶגֶל ng paa o binti.
