  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: tl
  text: Gagawa ka ng mga pinggan nito, mga munting sisidlan nito, mga pitsel nito[a], at mga mangkok nito[b], na gagamitin sa pagbubuhos ng handog na inumin. Gagawin mo ang mga iyon sa purong ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga banga” o “mga praskong pambuhos.” Bihira ang salitang Hebreo, kaya hindi tiyak ang eksaktong anyo ng sisidlan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga kopa.” Ang salitang Hebreo ay tumutukoy sa sisidlang kaugnay ng pagbubuhos ng handog na inumin, ngunit hindi tiyak ang eksaktong anyo nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: mga pinggan nito
  rationale: Ang קְעָרָה ay isang patag na sisidlan o pinggan. Ang “mga pinggan” ay natural sa modernong Tagalog at nababagay sa gamit ng mesa.
- source_word: כַפֹּתָיו
  choice: mga lalagyan nito
  rationale: Ang כַּף ay maaaring tumukoy sa isang maliit at tila hugis-palad na sisidlan. Pinananatili ng pangkalahatang “mga lalagyan” ang kawalan ng katiyakan sa tiyak na anyo nito at iniiwasang ipagkamali ito sa mga sisidlan para sa likido na kasunod.
- source_word: קְשׂוֹתָיו
  choice: mga pitsel
  rationale: Bihira ang terminong ito at tumutukoy sa sisidlang kaugnay ng pagbubuhos. Ang “mga pitsel” ay malinaw at makabagong tawag sa sisidlang naglalaman at nagbubuhos ng likido.
- source_word: מְנַקִּיֹּתָיו
  choice: mga mangkok nito
  rationale: Ang bihirang terminong ito ay tumutukoy sa mga sisidlang ginagamit sa paglilingkod sa mesa at sa pagbubuhos. Ang “mga mangkok” ay natural, habang kinikilala sa talababa ang posibleng saling “mga kopa.”
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: na gagamitin sa pagbubuhos ng handog na inumin
  rationale: Ang pandiwang נסך ay tumutukoy sa pagbubuhos ng handog na inumin. Ipinahahayag ng salin ang kultikong gamit na likas sa konteksto nang hindi tinutukoy nang higit sa Hebreo kung aling sisidlan ang gumaganap ng bawat bahagi ng gawain.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Ito ang malinaw at karaniwang modernong salin ng espesipikasyon sa materyal.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Gagawa ka ... Gagawin mo ang mga iyon
  rationale: Pinananatili ang paulit-ulit na pandiwa at ang tuwirang utos sa ikalawang panauhang isahan.
