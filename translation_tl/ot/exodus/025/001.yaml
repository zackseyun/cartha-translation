  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos ay nagsalita si Yahweh[a] kay Moises at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; maaari rin itong i-render bilang “Yahweh” o “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos,” at pinananatili ng “nagsalita” ang pagkakaiba ng דִּבֵּר sa kasunod na לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Karaniwang pananda sa Tagalog sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Tagalog at malinaw sa mga mambabasa.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Ang infinitive construct ay pormulang nagpapakilala sa tuwirang pananalita. Mas natural sa kasalukuyang Tagalog ang hiwalay na “Sinabi niya,” kaysa sa literal na “na sinasabi,” habang hindi ito isinasanib sa unang pandiwa.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON”; binabanggit sa talababa ang “Jehovah” bilang alternatibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang nakaugaliang Tagalog na “Moises” at pinanatili ang pormulang nagpapakilala sa susunod na tuwirang pahayag sa natural na dalawang pangungusap.
