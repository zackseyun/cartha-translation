  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na תְּחָשִׁים (tahash). Maaaring tumukoy ito sa isang hayop o materyal; kabilang sa mga mungkahi ang mga balat ng dugong, mga balat ng porpoise, o isang uri ng de-kalidad na katad.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: mga balat
  rationale: Tumutukoy ang pangmaramihang anyong construct sa mga balat ng hayop bilang materyales; natural at hindi labis na tiyak ang “mga balat” sa Filipino.
- source_word: אֵילִם
  choice: lalaking tupa
  rationale: Ang salita ay tumutukoy sa mga ram; “lalaking tupa” ang malinaw at karaniwang katumbas sa modernong Filipino.
- source_word: מְאָדָּמִים
  choice: tinina ng pula
  rationale: Ipinahihiwatig ng anyo na ginawang pula ang mga balat, hindi na likas lamang ang kulay; ang “tinina ng pula” ay angkop sa talaan ng mga materyales.
- source_word: עֹרֹת תְּחָשִׁים
  choice: mga balat na pinong katad[a]
  rationale: Hindi tiyak ang kahulugan ng תְּחָשִׁים. Iniiwasan nitong tukuyin nang walang katiyakan ang hayop at ipinakikitang de-kalidad na materyal na pantakip ang tinutukoy; inilalahad sa talababa ang kawalang-katiyakan.
- source_word: עֲצֵי
  choice: kahoy
  rationale: Bagaman pangmaramihan ang anyong Hebreo, likas sa Filipino ang pangkalahatang pangngalang “kahoy” sa isang talaan ng materyales.
- source_word: שִׁטִּים
  choice: akasya
  rationale: Malawak na kinikilalang tumutukoy ito sa akasya; malinaw at pamilyar ang “kahoy na akasya” sa modernong Filipino.
