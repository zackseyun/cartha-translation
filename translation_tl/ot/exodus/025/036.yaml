  naturalness: Marangal at madaling unawain ang draft, ngunit mas tuwiran at natural sa Tagalog ang “ay magmumula rito” kaysa “ay dapat maging kabahagi nito.” Ang “iisang piraso ng purong gintong hinubog sa pagpukpok” ay malinaw na nagpapahayag ng isang pirasong metal na hinubog.
  terminology: Ang “mga usbong,” “mga sanga,” at “purong ginto” ay angkop sa konteksto at modernong Filipino. Pinalitan ang “pinalo” sa talababa ng mas angkop na “hinubog sa pagpukpok,” dahil ang מִקְשָׁה ay tumutukoy sa hinubog na gawaing metal, hindi lamang sa literal na pagpalo.
