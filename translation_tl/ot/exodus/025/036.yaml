  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ilawan” sa talababa upang linawin ang tinutukoy na kabuuang bagay mula sa konteksto, habang hindi ito idinaragdag sa pangunahing teksto. Ang mga panandang [a] at [b] ay inilagay sa mismong mga pariralang kanilang nililinaw.
