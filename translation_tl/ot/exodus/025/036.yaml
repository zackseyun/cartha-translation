  text: Their buds and their branches shall be of one piece with it[b][a], all of it a single hammered work of pure gold.
translation:
  language: tl
  text: Ang mga usbong at mga sanga nito ay magmumula rito[a]. Ang kabuuan nito ay dapat na iisang piraso ng purong gintong hinubog sa pagpukpok[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kasama nito.” Ipinahihiwatig ng Hebreo na ang mga usbong at mga sanga ay hinubog mula mismo sa ilawan, hindi bilang mga piyesang hiwalay na ikinabit.
    reason: lexical_alternative
  - marker: b
    text: O “pinanday.” Binibigyang-diin ng Hebreo na ang buong ilawan ay hinubog bilang iisang piraso ng purong ginto.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: mga usbong nito
  rationale: Sa disenyong tila halaman ng ilawan, tumutukoy ang כַּפְתֹּר sa bilugang palamuting kahawig ng usbong; mas malinaw ito sa modernong Tagalog kaysa “umbok” at hindi arkitektural gaya ng “kapitel.”
- source_word: וּקְנֹתָם
  choice: at mga sanga nito
  rationale: Bagaman maaaring mangahulugang tambo o tangkay ang קָנֶה, ang tinutukoy rito ay ang mga nakausling bisig ng ilawan; pinananatili ng “mga sanga” ang larawang-halaman.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: ay dapat maging kabahagi nito
  rationale: Ipinahihiwatig ng parirala na ang mga bahagi ay hinubog mula mismo sa ilawan at hindi ikinabit nang hiwalay. Ipinapahayag ng “dapat” ang preskriptibong gamit ng imperfect.
- source_word: כֻּלָּהּ
  choice: ang kabuuan nito
  rationale: Pinatitibay nito na ang buong ilawan, hindi lamang ang mga sanga at palamuti, ay iisang yaring bagay.
- source_word: מִקְשָׁה אַחַת
  choice: yari sa isang piraso ... na pinanday
  rationale: Inilalarawan ng מִקְשָׁה ang metal na hinubog sa pamamagitan ng pagpukpok o pagmamartilyo, at binibigyang-diin ng אַחַת ang iisang-pirasong pagkakagawa.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Ito ang natural at karaniwang salin ng pariralang tumutukoy sa gintong walang halo o dinalisay.
