translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinili ang “ipapasok” para sa natural na paglalarawan ng kilos, habang inilagay sa talababa ang mas literal na diwa ng pandiwang Hebreo. Ginamit ang “kaban” bilang kinikilalang terminong biblikal at “mga pingga” bilang malinaw na katawagan sa mga pamalong pambuhat.
