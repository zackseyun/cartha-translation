  text: At ipapasok mo ang mga pingga sa mga singsing sa mga gilid ng kaban[a], upang madala ang kaban gamit ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas literal na salin, “dadalhin mo ang mga pingga sa mga singsing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: At ipapasok mo
  rationale: Bagaman karaniwang nangangahulugang “dalhin” ang בוא, ipinahihiwatig ng konstruksyon dito ang pagpasok o paglalagay ng mga pingga sa mga singsing; natural at tiyak sa Filipino ang “ipapasok.”
- source_word: הַ/בַּדִּים
  choice: ang mga pingga
  rationale: Tumutukoy ang בדים sa mahahabang pamalong ginagamit sa pagbuhat ng banal na kasangkapan. Ang “mga pingga” ay malinaw at kasalukuyang katawagan sa Filipino.
- source_word: בַּ/טַּבָּעֹת
  choice: sa mga singsing
  rationale: Sa kontekstong may pandiwang “ipapasok,” malinaw na ang mga singsing ang paglalagyan ng mga pingga; hindi kailangang dagdagan ng hiwalay na katumbas ng “into.”
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: sa mga gilid ng kaban
  rationale: Ang צלעות ay tumutukoy sa mga gilid o bahaging tagiliran; ang “mga gilid ng kaban” ay natural at sapat na tiyak.
- source_word: הָ/אָרֹן
  choice: ang kaban
  rationale: Bagaman maaaring mangahulugang karaniwang kahon o baul ang ארון, ang “kaban” ang kinikilalang katawagan sa sagradong bagay na ito sa konteksto ng tabernakulo.
- source_word: לָ/שֵׂאת
  choice: upang mabuhat
  rationale: Ang נשא rito ay pisikal na pagbuhat o pagdadala. Binibigyang-diin ng “mabuhat” ang layunin ng mga pingga nang natural sa Filipino.
- source_word: בָּ/הֶם
  choice: sa pamamagitan ng mga iyon
  rationale: Instrumental ang gamit ng panghalip at tumutukoy ito sa mga pingga; malinaw na ipinapahayag ng parirala na ang mga pingga ang kasangkapan sa pagbuhat.
