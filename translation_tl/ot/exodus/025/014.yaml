  source_fidelity: 'Tumpak ang pangunahing diwa: ang mga pingga ay inilalagay sa mga singsing na nasa mga gilid ng kaban upang magamit sa pagdadala nito. Gayunman, ang “upang mabuhat” ay mas madaling tumukoy sa simpleng pag-angat kaysa sa patuloy na pagdadala na ipinahihiwatig ng לָשֵׂאת. Mas tumpak ang “upang madala.”'
