base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: tl
  text: Gumawa ka ng isang kerubin sa isang dulo at ng isang kerubin sa kabilang dulo.[a] Mula sa luklukan ng awa ay gagawin ninyo ang mga kerubin sa dalawang dulo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, mas tahasan, “Gawin ninyo ang mga kerubin na iisang piraso kasama ng luklukan ng awa, sa dalawang dulo nito.” Ipinahihiwatig ng salitang Hebreo na isinaling “mula sa” na ang mga kerubin ay huhubugin mula sa luklukan ng awa mismo, hindi gagawing hiwalay at saka ikakabit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Gumawa ka
  rationale: Ang anyong pautos na pang-isahan ay tuwirang pinanatili; hindi na isinalin ang pang-ugnay upang maging natural ang daloy ng tagubilin sa Filipino.
- source_word: כְּרוּב ... וּכְרוּב
  choice: isang kerubin ... isang kerubin
  rationale: Pinanatili ang pang-isahang anyo at ang simetrikong pag-uulit ng Hebreo. Ang “kerubin” ay kinikilalang saling-teknikal para sa nilalang na inilalarawan dito.
- source_word: אֶחָד
  choice: isang
  rationale: Tuwirang pinanatili ang bilang sa dalawang paglitaw nito.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: sa isang dulo ... sa kabilang dulo
  rationale: Likas na Filipino ito para sa magkatapat na lokasyon ng dalawang anyo, habang pinananatili ang paralelismo ng Hebreo.
- source_word: מִן הַכַּפֹּרֶת
  choice: Mula sa luklukan ng awa
  rationale: 'Ang “luklukan ng awa” ay kinikilalang terminong Filipino para sa כַּפֹּרֶת sa konteksto ng kaban. Pinanatili ng “mula sa” ang ugnayang pinagmulan o materyal: ang mga kerubin ay hinubog mula sa mismong luklukan, hindi hiwalay na ikinabit.'
- source_word: תַּעֲשׂוּ
  choice: gagawin ninyo
  rationale: Pinanatili ang pangmaramihang kausap ng Hebreo at ang direktibang diwa ng imperfect sa konteksto ng mga tagubilin.
- source_word: הַכְּרֻבִים
  choice: ang mga kerubin
  rationale: Ginamit ang karaniwang panandang pangmaramihan sa Filipino, yamang plural ang anyong Hebreo.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: sa dalawang dulo nito
  rationale: Ang “sa” ay natural na nagpapahayag ng pisikal na kinalalagyan; ang “nito” ay tumutukoy sa luklukan ng awa gaya ng hulaping panghalip sa Hebreo.
theological_decisions:
- issue: Kahulugan ng כַּפֹּרֶת
  choice: luklukan ng awa
  alternative: takip ng kaban / takip na pantubos
  rationale: Pinili ang nakaugaliang terminong biblikal sa Filipino nang hindi ipinapasok sa mismong talata ang isang tiyak na paliwanag sa teolohikal na kaugnayan nito sa pagtubos. Nililinaw naman ng talababa ang pisikal na pagkakabuo na ipinahihiwatig ng מִן.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagbabago mula sa pang-isahang utos na “Gumawa ka” tungo sa pangmaramihang “gagawin ninyo,” gayundin ang teknikal na katawagang “kerubin” at “luklukan ng awa.”
