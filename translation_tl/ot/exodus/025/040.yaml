  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: tl
  text: Tiyakin mong gawin mo ang mga iyon ayon sa huwaran ng mga iyon[a] na ipinapakita sa iyo sa bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tingnan mo, at gawin mo ang mga iyon ayon sa kanilang huwaran na ipinapakita sa iyo sa bundok.”
    reason: Pinananatili ng alternatibo ang mas literal na pagkakaugnay ng dalawang pautos at ang anyong “kanilang huwaran.”
lexical_decisions:
- source_word: וּרְאֵה
  choice: Tiyakin mong
  rationale: Ang pautos na ראה ay idyomatikong babala na magbigay ng masusing pansin; natural itong naihahayag sa modernong Tagalog bilang “Tiyakin mong.”
- source_word: וַעֲשֵׂה
  choice: gawin
  rationale: Sa konteksto ng paggawa ng mga kagamitan ng santuwaryo, ang עשה ay nangangahulugang gumawa; ang “gawin” ay natural kasunod ng “Tiyakin mong.”
- source_word: בְּתַבְנִיתָם
  choice: ayon sa huwaran ng mga iyon
  rationale: Ang תבנית ay maaaring tumukoy sa huwaran, modelo, anyo, o balangkas. Pinananatili ng “huwaran” ang di-tiyak na likas ng ipinakitang modelo, at ipinahahayag ng “ng mga iyon” ang panlalaking pangmaramihang hulapi.
- source_word: אֲשֶׁר אַתָּה מָרְאֶה
  choice: na ipinakita sa iyo
  rationale: Ang מָרְאֶה ay pinakamainam unawain bilang Hophal participle, “ipinapakita/ipinakita.” Sa konteksto, ang ganap na “ipinakita” ay natural at tumutukoy sa banal na pagpapakita kay Moises nang hindi pinangalanan ang di-hayag na gumagawa.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Ang “sa bundok” ang natural na Tagalog para sa lokasyon ni Moises sa Sinai.
theological_decisions:
- issue: Likas ng ipinakitang modelo para sa mga kagamitan ng tabernakulo
  choice: huwaran
  alternative: modelo, anyo, o plano
  rationale: Hindi tinutukoy ng תבנית kung ito ay pisikal na modelo, biswal na anyo, o detalyadong plano. Pinananatili ng “huwaran” ang teolohikal na pagiging bukas ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Tiyakin mong” upang natural na maipahayag ang idyomatikong lakas ng וּרְאֵה, habang nasa talababa ang mas literal na ayos.
