  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: tl
  text: Balutan mo ito ng purong ginto, at gawan mo ito ng gintong palamuting gilid sa buong palibot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Balutan mo
  rationale: Sa kontekstong ito, ang pandiwang צפה ay tumutukoy sa paglalapat ng metal na sapin sa isang bagay. Likas at malinaw sa modernong Filipino ang “balutan” para sa pagbabalot sa mesang kahoy ng ginto.
- source_word: אֹתוֹ
  choice: ito
  rationale: Ang panghalip na layon ay tumutukoy sa mesa sa naunang talata.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Tuwirang ipinahahayag nito ang gintong may mataas na kadalisayan at natural itong pakinggan sa Filipino.
- source_word: וְעָשִׂיתָ
  choice: at gawan mo
  rationale: Pinananatili nito ang tuwirang utos ng karaniwang pandiwang עשה at ang diwa ng paggawa ng isang bahagi para sa mesa.
- source_word: לּוֹ
  choice: ito
  rationale: Sa pariralang “gawan mo ito,” malinaw na ang mesa ang bagay na paglalaanan ng ginagawang palamuti.
- source_word: זֵר
  choice: moldurang
  rationale: Dito, ang זֵר ay isang nakaangat o pandekorasyong gilid sa muwebles. Mas tiyak ang “moldura” kaysa “korona,” na maaaring magbigay ng maling larawan sa modernong mambabasa.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahahayag nito na ang moldura ay nakapaligid sa lahat ng panig ng mesa.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Filipino. Ang anyong pautos na “Balutan mo” at “gawan mo” ay natural na katumbas ng Hebreong ikalawang panauhang tagubilin. Hindi nilagyan ng talababa dahil malinaw sa konteksto ang “moldura”; iniiwasan ang tradisyonal ngunit posibleng mapanlinlang na “korona.”
