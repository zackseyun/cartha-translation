base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: tl
  text: Gagawa ka[a] ng isang mesa na yari sa kahoy na akasya. Dalawang siko ang haba nito, isang siko ang lapad, at isa’t kalahating siko ang taas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “At gagawa ka.” Iniuugnay ng pangatnig sa Hebreo ang tagubiling ito sa mga naunang utos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal perfect na may panimulang pangatnig sa sunod-sunod na tagubilin ay may puwersa ng utos. Likas at marangal sa modernong Tagalog ang “Gagawa ka”; inilalahad sa talababa ang mas literal na panimulang “At.”
- source_word: שֻׁלְחָן
  choice: isang mesa
  rationale: Karaniwang tawag ito sa kagamitang tinutukoy, at ang “isang” ay natural sa unang pagpapakilala rito.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Ang construct chain ay tumutukoy sa materyal na acacia wood; “kahoy na akasya” ang malinaw at likas na katumbas sa Tagalog.
- source_word: אַמָּתַיִם
  choice: dalawang siko
  rationale: Pinananatili ang sinaunang yunit na cubit bilang “siko” upang mapangalagaan ang sukat at kontekstong pangkultura ng teksto.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Pinananatili ang anyong pangngalan at ang hulaping tumutukoy sa mesa.
- source_word: וְאַמָּה
  choice: isang siko
  rationale: Malinaw na ipinapahayag ang kardinal na sukat sa talaan ng mga dimensiyon.
- source_word: רָחְבּוֹ
  choice: ang lapad
  rationale: Ang “lapad” ang natural na katawagan sa dimensiyong ito at kaagapay ng “haba” at “taas.”
- source_word: וְאַמָּה וָחֵצִי
  choice: at isa’t kalahating siko
  rationale: Likas na Tagalog na pagpapahayag ito ng eksaktong sukat na isang cubit at kalahati.
- source_word: קֹמָתוֹ
  choice: ang taas
  rationale: Sa konteksto ng sukat ng isang mesa, “taas” ang malinaw na katumbas ng salitang tumutukoy sa height o stature.
