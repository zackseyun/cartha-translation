  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: tl
  text: At sa patungan ng ilawan ay may apat na kopang hugis-bulaklak ng almendras[a], kasama ang mga usbong[b] at mga bulaklak nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hugis-almendras” o “pinalamutian ng mga bulaklak ng almendras.” Ang Hebreo ay gumagamit ng larawang mula sa puno ng almendras at maaaring tumukoy sa hugis o sa palamuti.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bilugang umbok.” Ang salitang Hebreo ay tumutukoy sa bilugan at nakausling palamuti sa patungan ng ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמְּנֹרָה
  choice: At sa patungan ng ilawan
  rationale: Ipinapahayag ng pariralang Hebreo ang kinaroroonan ng mga palamuti sa menorah. Ang “patungan ng ilawan” ay likas at malinaw na katawagan sa buong kasangkapang ito, hindi lamang sa ilawan mismo.
- source_word: אַרְבָּעָה גְבִעִים
  choice: apat na kopa
  rationale: Ang גְבִעִים ay tumutukoy sa mga anyong gaya ng mangkok o kopa; pinananatili ng “mga kopa” ang kongkretong larawan ng disenyong inilalarawan.
- source_word: מְשֻׁקָּדִים
  choice: hugis-bulaklak ng almendras
  rationale: Ang salita ay hinango sa salitang Hebreo para sa almendras at naglalarawan ng disenyong kaugnay ng puno o bulaklak nito. Malinaw ang pangunahing larawan, habang inilalahad sa talababa ang maaaring diin sa hugis o dekorasyon.
- source_word: כַּפְתֹּרֶיהָ
  choice: mga usbong nito
  rationale: Tumutukoy ang termino sa bilugan at nakausling palamuti. Ang “mga usbong” ay angkop sa larawang halaman ng talata, ngunit hindi nito inaalis ang mas literal na posibilidad na “mga bilugang umbok.”
- source_word: וּפְרָחֶיהָ
  choice: at mga bulaklak nito
  rationale: Karaniwang nangangahulugan ang פֶּרַח na bulaklak o blossom. Ang “mga bulaklak” ay natural sa modernong Filipino at malinaw na kaagapay ng “mga usbong.”
