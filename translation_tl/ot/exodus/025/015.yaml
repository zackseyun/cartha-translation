  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: tl
  text: Mananatili sa mga argolya ng Kaban ang mga pingga; hindi aalisin ang mga ito mula rito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ang mga pingga ay nasa mga argolya ng Kaban; hindi aalisin ang mga ito mula rito.”
    reason: Pinananatili nito ang mas literal na stative na kahulugan ng יִהְיוּ (“magiging/naroroon”) sa halip na ang kontekstuwal na “mananatili,” nang hindi ipinapasok ang kilos ng paglalagay.
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: sa mga argolya
  rationale: Ang טַבַּעַת ay mga argolyang nakakabit sa Kaban na kinalalagyan ng mga pingga. Likas sa Filipino ang “sa” para sa ganitong pagkakalagay, habang malinaw sa konteksto na nakapasok ang mga pingga sa mga argolya.
- source_word: הָאָרֹן
  choice: ang Kaban
  rationale: Sa konteksto ng tabernakulo, ang אָרוֹן ay ang sagradong Kaban, hindi lamang isang karaniwang kahon. Ginamit ang malaking titik bilang pantukoy sa natatanging bagay na ito.
- source_word: יִהְיוּ
  choice: mananatili
  rationale: Bagaman literal na “magiging/naroroon,” ipinahihiwatig dito ng היה ang patuloy na kalagayan, na pinagtitibay ng kasunod na pagbabawal na alisin ang mga pingga.
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Ang בַּדִּים ay mahahabang pamalong ginagamit sa pagbuhat sa Kaban. Ang “mga pingga” ay maikli, makabago, at madaling maunawaan sa konteksto.
- source_word: לֹא יָסֻרוּ
  choice: hindi aalisin ang mga ito
  rationale: Ang סוּר ay maaaring mangahulugang lumihis, umalis, o alisin. Ang anyong pasibo sa Filipino ay natural dito at malinaw na naghahayag ng pagbabawal sa pag-aalis sa mga pingga.
- source_word: מִמֶּנּוּ
  choice: mula roon
  rationale: Ang hulaping panghalip ay tumutukoy sa Kaban. Ang “mula roon” ay natural sa Filipino at iniiwasan ang maling pagbasa na ang isahan na “ito” ay tumutukoy sa maramihang mga pingga.
