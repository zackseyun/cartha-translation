  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: tl
  text: 'At anim na sanga ang lalabas mula sa mga tagiliran nito: tatlong sanga ng patungan ng mga ilawan mula sa isang tagiliran nito, at tatlong sanga ng patungan ng mga ilawan mula sa kabilang tagiliran nito.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: mga sanga / sanga
  rationale: Sa konteksto ng ilawan, tumutukoy ito sa mga bahaging nakausli mula sa katawan nito. Likas sa Filipino ang “sanga” at pinananatili nito ang larawang tila halaman.
- source_word: יֹצְאִים
  choice: ang lalabas
  rationale: Ipinahahayag ng participle ang mga sangang nagmumula o nakausli sa mga tagiliran; ang panghinaharap ay angkop sa konteksto ng tagubilin sa paggawa.
- source_word: מִצִּדֶּיהָ
  choice: mula sa mga tagiliran nito
  rationale: Pinananatili ang pangmaramihang “mga tagiliran” at ang pambabaeng panghalip na tumutukoy sa ilawan.
- source_word: מְנֹרָה
  choice: ilawan
  rationale: Karaniwang salitang Filipino para sa kagamitang may mga lampara; mas malinaw ito sa ordinaryong mambabasa kaysa transliterasyong “menorah.”
- source_word: הָאֶחָד
  choice: isang tagiliran nito
  rationale: Natural na ipinahahayag sa Filipino ang unang panig sa pares bilang “isang tagiliran nito.”
- source_word: הַשֵּׁנִי
  choice: kabilang tagiliran nito
  rationale: Bagaman literal na “ikalawa,” ang “kabilang” ang natural na Filipino para sa kaibahan ng isang panig at ng isa pang panig.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tagiliran” upang ilarawan ang dalawang panig ng ilawan at ang “sanga” upang mapanatili ang kongkretong larawan ng Hebreo.
