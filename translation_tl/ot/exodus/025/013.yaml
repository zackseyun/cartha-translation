  text: Gumawa ka ng mga pingga mula sa kahoy na akasya at balutan mo ng ginto ang mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang Qal perfect na may pang-ugnay sa sunod-sunod na tagubilin ay may puwersa ng utos; natural at tuwiran sa modernong Filipino ang “Gumawa ka.”
- source_word: בַדֵּי
  choice: mga pingga
  rationale: Tumutukoy sa mahahabang kahoy na ipinapasok sa mga argolya upang buhatin ang kaban; malinaw at karaniwang katawagan sa kontekstong ito ang “mga pingga.”
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang construct chain ay tumutukoy sa kahoy ng punong akasya; ang “kahoy na akasya” ay malinaw at hindi basta transliterasyon ng Hebreo.
- source_word: וְצִפִּיתָ
  choice: at balutan mo
  rationale: Ipinapahayag ng pandiwa ang pagtatakip o paglalapat ng isang materyal sa ibabaw; natural sa Filipino ang “balutan” para sa paglalapat ng ginto sa kahoy.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Pinananatili ang pangmaramihang tuwirang layon na tumutukoy sa mga pingga.
- source_word: זָהָב
  choice: ng ginto
  rationale: Sa Filipino, likas na ipinapahayag ang materyal na pantakip sa pariralang “balutan ng ginto.”
