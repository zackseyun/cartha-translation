  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: tl
  text: At ilalagay mo sa loob ng Kaban ang Patotoo na ibibigay ko sa iyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas tiyak ayon sa konteksto, “ang mga tapyas na bato ng Patotoo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: At ilalagay mo
  rationale: Sa konstruksyong may אֶל at sisidlang ‘Kaban,’ ang נתן ay tumutukoy sa paglalagay, hindi sa paglilipat ng pagmamay-ari.
- source_word: אֶל
  choice: sa loob ng
  rationale: Bagaman karaniwang ‘sa’ o ‘patungo sa,’ malinaw sa konteksto ng paglalagay sa isang sisidlan na ang diwa ay ‘sa loob ng.’
- source_word: הָאָרֹן
  choice: ang Kaban
  rationale: Ang אָרוֹן dito ay ang sagradong kaban sa konteksto ng tabernakulo; pinananatili ng ‘Kaban’ ang kinikilalang katawagang panrelihiyon.
- source_word: הָעֵדֻת
  choice: ang Patotoo
  rationale: Pinananatili nito ang pangkalahatang katawagang עֵדוּת at hindi tahasang dinaragdagan ng ‘mga tapyas,’ na hindi binanggit sa mismong talata.
- source_word: אֲשֶׁר אֶתֵּן אֵלֶיךָ
  choice: na ibibigay ko sa iyo
  rationale: Likas na Filipino ito para sa panghinaharap na kilos ng Diyos at tahasang pinananatili ang tatanggap.
theological_decisions:
- issue: Tinutukoy ng ‘Patotoo’
  choice: Panatilihin sa pangunahing teksto ang pangkalahatang ‘ang Patotoo.’
  alternative: Tukuyin ito bilang ‘mga tapyas ng Patotoo.’
  rationale: ‘Ang Patotoo’ lamang ang tahasang sinasabi ng Hebreo. Nililinaw ng mas malawak na konteksto na kaugnay ito ng mga tapyas, ngunit hindi iyon dapat ipasok nang walang pahiwatig sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang malaking titik sa ‘Kaban’ at ‘Patotoo’ bilang mga tiyak na katawagan sa kontekstong ito, nang hindi nilulutas nang labis ang referent ng עֵדוּת.
