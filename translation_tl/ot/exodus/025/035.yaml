translation:
  language: tl
  text: At isang umbok sa ilalim ng dalawang sanga nito, isa pang umbok sa ilalim ng dalawa pang sanga nito, at isa pang umbok sa ilalim ng dalawa pang sanga nito, para sa anim na sangang lumalabas mula sa patungan ng ilawan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: umbok
  rationale: Tumutukoy sa nakaumbok na pandekorasyong bahagi ng patungan ng ilawan; mas likas at madaling maunawaan sa Filipino kaysa sa teknikal o hiram na katawagan.
- source_word: קָנִים
  choice: mga sanga
  rationale: Sa konteksto ng menorah, ang mga bahaging nakausli sa magkabilang tagiliran ay likas tawaging mga sanga.
- source_word: מְנֹרָה
  choice: patungan ng ilawan
  rationale: Inilalarawan ang kasangkapang may mga ilawan nang hindi basta inililipat ang terminong Hebreo.
