  yaml_path: translation/ot/exodus/025/009.yaml
  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: tl
  text: Gawin ninyo iyon ayon na ayon sa lahat ng ipinakikita ko sa iyo—sa huwaran ng tabernakulo at sa huwaran ng lahat ng kagamitan nito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “plano,” “modelo,” o “disenyo” ang salin sa “huwaran” (תַּבְנִית).
    reason: lexical_alternative
  - marker: b
    text: Pangmaramihan sa Hebreo ang “gawin ninyo”; kinakausap si Moises kasama ng iba pang gagawa nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: ayon na ayon sa lahat ng
  rationale: Ipinahahayag ng כְּ kasama ng כֹּל אֲשֶׁר ang mahigpit at ganap na pagtutugma. Likas sa modernong Tagalog ang “ayon na ayon” at naipakikita nito ang hinihinging katiyakan nang hindi dinaragdagan ang diwa.
- source_word: מַרְאֶה
  choice: ipinakikita ko
  rationale: 'Ang participle ng ראה ay may nagpapatuloy o kasalukuyang diwa: ipinakikita ng Diyos kay Moises ang huwaran. Ang “ipinakikita ko” ay natural at tumpak.'
- source_word: תַּבְנִית
  choice: huwaran
  rationale: Maaaring tumukoy ang תַּבְנִית sa anyo, pattern, plano, modelo, o disenyo. Pinananatili ng “huwaran” ang ideya ng ipinakitang batayan na dapat sundin nang hindi ipinapalagay kung ito ay pisikal na modelo o ibang uri ng paghahayag.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Bagaman kaugnay ng “tirahan” ang literal na kahulugan, sa kontekstong ito ito ang natatanging banal na toldang tahanan. Ang “tabernakulo” ang maikli at nakaugaliang terminong Tagalog para rito.
- source_word: כָּל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כֵּלִים at maaaring tumukoy sa mga sisidlan, kasangkapan, at iba pang gamit. Hindi ito labis na nililimitahan ng pangkalahatang “mga kagamitan.”
- source_word: וְכֵן תַּעֲשׂוּ
  choice: Gawin ninyo iyon
  rationale: Ipinahahayag ng “iyon” ang buong gawaing inilarawan, samantalang pinananatili ng “ninyo” ang pangmaramihang anyo ng pandiwang Hebreo. Inuna ang sugnay sa Tagalog upang maging malinaw at natural ang pangungusap.
theological_decisions:
- issue: Kung tahasang ipahihiwatig ng תַּבְנִית ang isang makalangit na arketipo
  choice: huwaran
  alternative: plano, modelo, o disenyo
  rationale: Sinasabi ng talata na ipinakikita ng Diyos kay Moises ang תַּבְנִית, ngunit hindi nito nililinaw ang eksaktong kalikasan ng ipinakitang huwaran. Pinananatili ng salin ang posibilidad ng isang makalangit na batayan nang hindi iyon ipinipilit sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang nakaugaliang terminong “tabernakulo,” ang likas na idyomang “ayon na ayon,” at ang malinaw na pangmaramihang “ninyo.”
