  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: tl
  text: At ilagay mo sa mesa ang tinapay ng Presensya, na laging nasa harap ko.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “tinapay ng Presensya”; tradisyonal na salin: “tinapay na handog.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: At ilalagay mo
  rationale: Ang נתן ay maaaring mangahulugang ‘ibigay’ o ‘ilagay.’ Sa tagubilin tungkol sa mga kagamitan ng tabernakulo, natural at tumpak ang ‘ilalagay mo.’
- source_word: עַל הַ/שֻּׁלְחָן
  choice: sa mesa
  rationale: Tinutukoy ng parirala ang paglalagay sa ibabaw ng tiyak na mesang inilalarawan; sa natural na Tagalog, sapat at malinaw ang ‘sa mesa.’
- source_word: לֶחֶם פָּנִים
  choice: ang tinapay ng Presensya
  rationale: Pinananatili nito ang natatanging katawagang Hebreo na literal na kaugnay ng ‘mukha/presensya,’ nang hindi ito pinapantay sa kasunod at hiwalay na pariralang ‘sa harap ko.’
- source_word: לְ/פָנַ/י
  choice: sa harap ko
  rationale: Tuwirang ipinapahayag nito ang literal na diwang ‘sa harap ng aking mukha/ako’ at pinananatili ang unang panauhang pananalita ng Diyos.
- source_word: תָּמִיד
  choice: palagi
  rationale: Sa kontekstong pangkulto, ipinahihiwatig nito ang patuloy o regular na pagpapanatili. Ang ‘palagi’ ay natural sa modernong Tagalog at hindi nagpapasya kung walang patid o regular na inuulit ang pagkilos.
theological_decisions:
- issue: Katawagan sa kulto na לֶחֶם פָּנִים
  choice: tinapay ng Presensya
  alternative: tinapay na handog; tinapay sa harap ng Diyos
  rationale: Pinananatili ng salin ang teolohikal na diin sa presensya ng Diyos at ang natatanging Hebreong katawagan, habang iniiwasang ipaliwanag nang labis o ipantay ito sa kasunod na ‘sa harap ko.’
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang ‘Presensya’ bilang natatanging katawagang pangkulto at nilinaw sa talababa ang tradisyonal na alternatibo.
