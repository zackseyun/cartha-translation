  source_fidelity: 'Tumpak na naipapahayag ng salin ang dalawang utos: ilagay ang כַּפֹּרֶת sa ibabaw ng kaban at ilagay ang עֵדֻת sa loob nito. Ang hinaharap na “ibibigay ko sa iyo” ay maayos na tumutugma sa אֶתֵּן אֵלֶיךָ. Hindi idinagdag ang mga tapyas, na hindi tahasang binabanggit sa talata.'
