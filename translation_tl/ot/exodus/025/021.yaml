base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: tl
  text: Ilagay mo ang takip ng pagtubos sa ibabaw ng kaban[a], at sa loob ng kaban ay ilagay mo ang patotoong ibibigay ko sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “takip” o “luklukan ng awa.” Ang salitang Hebreo ay tumutukoy sa takip ng kaban at may kaugnayan sa ritwal ng pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: takip ng pagtubos
  rationale: Tinutukoy nito ang takip ng kaban at pinananatili ang kaugnayan ng salitang Hebreo sa ritwal ng pagtubos; mas malinaw ito sa karaniwang mambabasa kaysa sa isang transliterasyon o sa salitang 'luklukan.'
- source_word: מִלְמָעְלָה
  choice: sa ibabaw
  rationale: Natural na ipinapahayag ang tiyak na kinalalagyan ng takip kaugnay ng kaban.
- source_word: עֵדֻת
  choice: patotoo
  rationale: Malapit sa anyo at saklaw ng Hebreo at hindi nagdaragdag ng tahasang pagtukoy sa mga tapyas na wala sa mismong talata.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: ilagay / ilagay / ibibigay
  rationale: Ginagamit ang natural na pandiwa para sa paglalagay ng mga bagay, samantalang 'ibibigay' ang angkop sa ipinangakong pagkakaloob ng Diyos.
- source_word: אֶל הָאָרֹן
  choice: sa loob ng kaban
  rationale: Bagaman maaaring literal na 'tungo sa kaban,' malinaw sa konstruksyon na ang patotoo ay ilalagay sa loob nito.
theological_decisions:
- issue: Ang kahulugan ng כַּפֹּרֶת bilang bahagi ng kaban na may kaugnayan sa pagtubos
  choice: takip ng pagtubos
  alternative: takip; luklukan ng awa
  rationale: Ipinakikita ng salin na ito na ang bagay ay takip ng kaban habang pinananatili ang kaugnayan nito sa pagtubos, nang hindi ipinipilit ang isang mas makitid na doktrinal na paliwanag. Inilalagay sa talababa ang mga kinikilalang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang pautos na 'ilagay mo' upang natural na katawanin ang Hebreong second-person singular instruction, at iniwasang idagdag ang 'mga tapyas' dahil hindi iyon tahasang nasa talata.
