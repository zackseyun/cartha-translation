  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “isa pang sanga” sa ikalawang pagbanggit upang likas na ipakita ang dalawang magkatapat na sanga sa konteksto, habang pinananatili ang pag-uulit ng Hebreo. Inilagay ang mga marker [a], [b], at [c] sa mismong teksto.
