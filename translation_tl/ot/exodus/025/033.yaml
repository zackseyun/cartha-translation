base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: tl
  text: Tatlong kopang hugis-bulaklak ng almendras ang nasa isang sanga[a], na may umbok at bulaklak; at tatlong kopang hugis-bulaklak ng almendras ang nasa isang sanga, na may umbok[b] at bulaklak. Ganito rin ang gagawin sa anim na sangang lumalabas mula sa patungan ng ilawan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “tatlong kopang ginawang tulad ng mga bulaklak ng almendras sa isang sanga … at tatlong kopang ginawang tulad ng mga bulaklak ng almendras sa isang sanga.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “umbok” ay salin ng Hebreong כַּפְתֹּר, isang bilugan at nakausling palamuti; maaari ring “bilugang bukol.”
    reason: lexical_alternative
  - marker: c
    text: Ang Hebreong מְנֹרָה ay madalas na isinusulat bilang “menorah.” Dito ay isinalin itong “patungan ng ilawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: mga kopa
  rationale: Tumutukoy sa mga sisidlan o palamuting hugis-kopa; ang “kopa” ay malinaw at angkop sa pandekorasyong anyo ng patungan ng ilawan.
- source_word: מְשֻׁקָּדִים
  choice: hugis-bulaklak ng almendras
  rationale: Sa konteksto ng palamuti, inilalarawan nito ang disenyong tulad ng bulaklak ng punong almendras, hindi lamang ang hugis ng bunga nito.
- source_word: קָּנֶה
  choice: sanga
  rationale: Dito ay tumutukoy sa nakausling bahagi ng patungan ng ilawan; pinananatili ng “sanga” ang larawang-halaman ng disenyo.
- source_word: כַּפְתֹּר
  choice: umbok
  rationale: Tumutukoy sa bilugan at nakausling palamuti. Likas sa Filipino ang “umbok” at hindi nito labis na tinutukoy ang eksaktong botanikong bahagi.
- source_word: פֶרַח / פָרַח
  choice: bulaklak
  rationale: Tuwirang katumbas na akma sa disenyong halaman at madaling maunawaan.
- source_word: כֵּן
  choice: Ganito rin ang gagawin
  rationale: Ipinahihiwatig ng כֵּן na ang naunang ayos ay pare-parehong ilalapat sa lahat ng anim na sanga; ginawang ganap na pangungusap para sa likas na Filipino.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: sa anim na sanga
  rationale: Malinaw na ipinapakita ang paglalapat ng parehong disenyo sa lahat ng anim na sanga.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: lumalabas mula sa patungan ng ilawan
  rationale: Malapit sa anyo ng Hebreo at malinaw na inilalarawan ang mga sangang nakausli mula sa pangunahing patungan.
- source_word: מְנֹרָה
  choice: patungan ng ilawan
  rationale: Isinasalin ang karaniwang pangngalan sa halip na basta tumbasan ng transliterasyong “menorah”; malinaw ang gamit ng bagay sa konteksto.
