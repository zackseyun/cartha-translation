translation:
  language: tl
  text: Gawin mo ang pitong ilawan nito, at ilalagay niya ang mga ilawan nito upang magbigay-liwanag ang mga ito sa bandang harapan nito.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sisindihan niya ang mga ilawan nito upang magbigay-liwanag ang mga ito patungo sa harapan nito.” Ang pandiwang Hebreo ay literal na nagpapahiwatig ng pagpapataas o pagpapaakyat; sa kontekstong ito, maaari itong tumukoy sa paglalagay ng mga ilawan o sa pagsisindi sa mga ito.'
    reason: lexical_alternative
  - marker: b
    text: Ang “niya” ay panlalaking isahan sa Hebreo at malamang na tumutukoy sa paring nag-aasikaso sa kandelero, bagaman hindi tahasang pinangalanan ang gumagawa sa talatang ito.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Ang Qal perfect na may prefixed conjunction ay utos kay Moises sa kontekstong ito. Ang “Gawin mo” ay likas at malinaw na pautos sa modernong Tagalog.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ang pitong ilawan nito
  rationale: Ang נֵר ay karaniwang tumutukoy sa ilawan o apoy nito; sa konteksto ng kandelero, “ilawan” ang malinaw na katawagan. Ang hulaping pambabae ay tumutukoy sa kandelero.
- source_word: וְהֶעֱלָה
  choice: ilalagay niya
  rationale: Ang Hiphil ng עלה ay literal na “paakyatin” at sa kontekstong pangkulto ay maaaring tumukoy sa paglalagay/pag-aayos o pagsisindi ng mga ilawan. Pinananatili ng “ilalagay niya” ang ikatlong panauhang panlalaking isahan nang hindi labis na nililinaw ang pagkilos.
- source_word: וְהֵאִיר
  choice: upang magbigay-liwanag ang mga iyon
  rationale: Ipinahahayag ng Hiphil ng אור ang layunin o bunga ng paglalagay sa mga ilawan. Ginawang tahasan ang maramihang tinutukoy—ang mga ilawan—para sa likas na Tagalog.
- source_word: עַל עֵבֶר פָּנֶיהָ
  choice: sa harapan nito
  rationale: Ipinakikita ng parirala ang lugar o direksiyon ng liwanag kaugnay ng harapan ng kandelero. Ang “sa harapan nito” ay maikli, natural, at hindi labis na tiyak.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ilawan” para sa נֵר at pinanatili ang di-tahasang ikatlong panauhang isahan. Inilagay ang mga pananda ng talababa sa puntong may kaugnayan ang mga ito, at ipinaliwanag sa talababa ang tunay na leksikal na kalabuan.
