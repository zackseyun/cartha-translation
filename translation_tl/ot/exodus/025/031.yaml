  to: Gagawa ka ng isang patungan ng mga lampara na purong ginto. Ang patungan ng mga lampara ay gagawing hinubog sa pagpukpok[a]. Ang paanan at tangkay nito, pati ang mga kopa, mga usbong[b], at mga bulaklak nito, ay magiging kaisang piraso nito.
