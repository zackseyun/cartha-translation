  text: וְ/עָשִׂ֥יתָ מְנֹרַ֖ת זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה תֵּעָשֶׂ֤ה הַ/מְּנוֹרָה֙ יְרֵכָ֣/הּ וְ/קָנָ֔/הּ גְּבִיעֶ֛י/הָ כַּפְתֹּרֶ֥י/הָ וּ/פְרָחֶ֖י/הָ מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: tl
  text: Gagawa ka ng isang patungan ng mga lampara na purong ginto. Ang patungan ng mga lampara ay gagawing hinubog sa pagpukpok[a]. Ang paanan at tangkay nito, pati ang mga kopa, mga usbong[b], at mga bulaklak nito, ay magiging kaisang piraso nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gagawing pinukpok na yari.” Binibigyang-diin ng Hebreo na ang patungan ng mga lampara ay huhubugin sa pagpukpok mula sa iisang piraso ng metal, sa halip na pagdugtungin mula sa magkakahiwalay na piyesa.
    reason: lexical_alternative
  - marker: b
    text: Ang “mga usbong” ay maaari ring isaling “mga umbok.” Tumutukoy ang Hebreo sa mga bilugang nakausling palamuti sa disenyong floral ng patungan ng mga lampara.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: ilawan
  rationale: Tumutukoy ito sa tayuang pinaglalagyan ng mga lampara, hindi sa mga lampara mismo. Sa konteksto ng santuwaryo, malinaw at likas sa Tagalog ang “ilawan.”
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Likas na katumbas sa modernong Tagalog para sa gintong dalisay o walang halo.
- source_word: מִקְשָׁה
  choice: gagawin sa pamamagitan ng pagpukpok
  rationale: Ipinapahayag nito ang paraan ng paghubog sa metal sa pamamagitan ng pagpukpok, sa halip na pagbubuo mula sa magkakahiwalay na piyesa.
- source_word: יְרֵכָהּ
  choice: paanan nito
  rationale: Bagaman karaniwang nangangahulugang “hita” o “tagiliran,” dito ay tumutukoy ito sa ibabang bahaging sumusuporta sa ilawan.
- source_word: וְקָנָהּ
  choice: tangkay nito
  rationale: Ang singular na qaneh ay tumutukoy sa gitnang tangkay o katawan ng ilawan; ang “tangkay” ay angkop din sa disenyong may mga usbong at bulaklak.
- source_word: גְּבִיעֶיהָ
  choice: mga kopa
  rationale: Tumutukoy sa mga palamuting hugis-kopa; tuwiran at madaling maunawaan ang salin.
- source_word: כַּפְתֹּרֶיהָ
  choice: mga usbong
  rationale: Tumutukoy sa mga bilugang umbok na palamuti. Ang “mga usbong” ay umaayon sa disenyong floral, habang pinananatili sa talababa ang alternatibong anyong “mga umbok.”
- source_word: וּפְרָחֶיהָ
  choice: mga bulaklak
  rationale: Tuwirang inilalarawan ng salita ang mga palamuting anyong bulaklak.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: dapat maging kaisang piraso nito
  rationale: Ipinahihiwatig na ang mga bahaging ito ay hinubog mula sa mismong ilawan at hindi ikinabit bilang magkakahiwalay na piyesa.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno ngunit marangal at madaling maunawaang Tagalog. Pinili ang “ilawan” sa halip na transliterasyong “menorah,” at “tangkay” upang maging malinaw ang gitnang bahaging kaayon ng larawang halaman. Inilagay ang marker [a] kaagad sa pariralang tungkol sa pagpukpok upang tumugma nang malinaw ang talababa sa salitang ipinapaliwanag nito.
