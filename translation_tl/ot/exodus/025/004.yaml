lexical_decisions:
- source_word: תְּכֵלֶת
  choice: mga sinulid na asul
  rationale: Tumutukoy ang salita sa mamahaling materyal na tinina ng asul o asul-lilang kulay. Ang “sinulid na asul” ay malinaw at likas sa talaan ng mga materyales para sa tabernakulo, habang inilalahad sa talababa ang posibleng kulay na asul-lila.
- source_word: אַרְגָּמָן
  choice: lila
  rationale: Tumutukoy ito sa mamahaling tekstil o sinulid na kulay lila. Sapat at natural ang “lila” dahil malinaw sa parirala na mga sinulid ang tinutukoy.
- source_word: תוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Literal na inuugnay ng parirala ang pulang kulay sa insektong pinagmumulan ng tina. Isinasalin sa pangunahing teksto ang kinalabasang kulay, hindi ang literal na zoolohikal na larawan; pinananatili sa talababa ang pinagmulan ng tina.
- source_word: שֵׁשׁ
  choice: pinong lino
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa de-kalidad na lino, kaya malinaw at tradisyonal ang “pinong lino.”
- source_word: עִזִּים
  choice: balahibo ng kambing
  rationale: Literal na “mga kambing,” ngunit sa talaan ng mga sangkap, ang materyal na hinahabi mula sa mga ito—ang balahibo—ang nilalayon.
