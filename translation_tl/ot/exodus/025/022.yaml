revisions:
- from: At doon ay makikipagtagpo ako sa iyo at makikipag-usap sa iyo mula sa ibabaw ng takip ng pagtubos[a], mula sa pagitan ng dalawang kerubin na nasa ibabaw ng kaban ng patotoo. Sasabihin ko sa iyo ang lahat ng iuutos ko para sa mga anak ni Israel.[b]
  to: At doon ay makikipagtagpo ako sa iyo, at magsasalita ako sa iyo mula sa ibabaw ng takip ng pagbabayad-sala[a], mula sa pagitan ng dalawang kerubin na nasa ibabaw ng kaban ng patotoo, tungkol sa lahat ng iuutos ko sa iyo para sa mga anak ni Israel.[b]
