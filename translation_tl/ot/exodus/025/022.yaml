  verdict: revise
  source_fidelity: Kailangan ng rebisyon sa hulihan. Ang Hebreo ay nagpapatuloy sa iisang pahayag ng Diyos na magsasalita siya kay Moises tungkol sa lahat ng iuutos niya rito para/sa mga anak ni Israel. Ang hiwalay na “Sasabihin ko sa iyo” ay hindi kinakailangan at bahagyang inililihis ang “magsasalita ako sa iyo.”
  naturalness: Mas natural at malinaw sa makabagong Filipino ang “magsasalita ako sa iyo ... tungkol sa lahat ng iuutos ko sa iyo,” sa isang pangungusap. Ang “mga kerubin” at “kaban ng patotoo” ay angkop sa marangal na rehistro.
  terminology: Pinalitan ang “takip ng pagtubos” ng “takip ng pagbabayad-sala,” na mas malinaw na tumutukoy sa kultikong gamit ng כַּפֹּרֶת nang hindi ipinapakahulugang ito ay literal na luklukan. Pinanatili ang “kerubin,” “kaban ng patotoo,” at “mga anak ni Israel.”
  issues:
  - severity: medium
    issue: Ang “Sasabihin ko sa iyo ang lahat” ay hiwalay na pangungusap at mas makitid kaysa sa “magsasalita ako sa iyo ... tungkol sa lahat.”
    rationale: Ang וְדִבַּרְתִּי אִתְּךָ ay nagpapatuloy hanggang sa pariralang “lahat ng iuutos ko sa iyo”; ang אֵת ay nagpapahiwatig ng pakikipag-usap sa/sa harap ni Moises, hindi lamang simpleng pagbibigay-alam.
  - severity: low
    issue: Ang “takip ng pagtubos” ay maaaring maunawaan bilang takip na pag-aari ng pagtubos kaysa takip na ginagamit sa pagbabayad-sala.
    rationale: Ang “takip ng pagbabayad-sala” ay mas malinaw na Filipino para sa ritwal na tungkulin ng כַּפֹּרֶת, habang ang tradisyonal na “luklukan ng awa” ay nananatiling angkop na alternatibo sa talababa.
