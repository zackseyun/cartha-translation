base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: tl
  text: At doon ay makikipagtagpo ako sa iyo, at magsasalita ako sa iyo mula sa ibabaw ng takip ng pagbabayad-sala[a], mula sa pagitan ng dalawang kerubin na nasa ibabaw ng kaban ng patotoo, tungkol sa lahat ng iuutos ko sa iyo para sa mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luklukan ng awa.” Ang salitang Hebreo ay tumutukoy sa gintong takip ng kaban, na ginagamit kaugnay ng pagbabayad-sala.
    reason: lexical_alternative
  - marker: b
    text: O “sa mga anak ni Israel,” o “sa mga Israelita.” Ang Hebreo ay literal na “sa/para sa mga anak ni Israel” at maaaring tumukoy sa mga utos na para sa Israel o ipararating sa kanila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: At doon ay makikipagtagpo ako sa iyo
  rationale: Ang Niphal ng יעד ay tumutukoy rito sa pakikipagtagpo sa itinakdang lugar; natural at tapat dito ang “makikipagtagpo.”
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: at makikipag-usap sa iyo
  rationale: Pinananatili ng “makikipag-usap” ang tuwirang ugnayang ipinahihiwatig ng אִתְּךָ, sa halip na gawing basta paghahatid lamang ng salita.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: mula sa ibabaw ng takip ng pagtubos
  rationale: Ipinakikita ng מֵעַל ang pinagmumulan ng pagsasalita, at ang “takip ng pagtubos” ay malinaw na tumutukoy sa sagradong gintong takip ng kaban habang pinananatili ang kultikong bigat ng כַּפֹּרֶת.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: mula sa pagitan ng dalawang kerubin
  rationale: Tuwirang inilalarawan nito ang lokasyon; ang “kerubin” ang nakaugaliang salin sa Filipino para sa natatanging uri ng makalangit na nilalang.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: na nasa ibabaw ng kaban ng patotoo
  rationale: Ang “nasa ibabaw” ay malinaw sa ayos ng mga kerubin, at ang “kaban ng patotoo” ay malapit sa pormal na diwa ng Hebreo nang hindi ipinapalagay na tahasang binanggit rito ang mga tapyas.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אוֹתְךָ אֶל בְּנֵי יִשְׂרָאֵל
  choice: Sasabihin ko sa iyo ang lahat ng iuutos ko para sa mga anak ni Israel
  rationale: Ginagawang natural sa Filipino ang kaugnayan ng pagsasalita at ng mga utos, habang pinananatili ang kabuuan ng כָּל at ang pambansang-pamilyang katawagang “mga anak ni Israel.”
theological_decisions:
- issue: Pagpapakahulugan sa הַכַּפֹּרֶת
  choice: takip ng pagtubos
  alternative: luklukan ng awa; takip
  rationale: Ang salita ay tumutukoy sa sagradong takip ng kaban na kaugnay ng ritwal ng pagtubos. Mas malinaw sa karaniwang mambabasang Filipino ang “takip ng pagtubos” kaysa sa tradisyonal ngunit maaaring mapagkamalang literal na upuan na “luklukan ng awa.”
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanang Israel
  rationale: Pinananatili nito ang pamilyang anyo ng Hebreo at ang kolektibong pambansang kahulugan nang hindi binabago ang larawan tungo sa isang ganap na abstraktong katawagan.
- issue: Ugnayan ng pagsasalita at ng utos sa hulihan ng talata
  choice: Sasabihin ko sa iyo ang lahat ng iuutos ko para sa mga anak ni Israel
  alternative: makikipag-usap ako sa iyo tungkol sa lahat ng iuutos ko sa iyo para sa mga anak ni Israel
  rationale: Likas sa Filipino ang paghahating ito at malinaw na ang nilalaman ng pagsasalita ay ang lahat ng utos. Hindi nito nilulutas nang lampas sa teksto kung ang אֶל ay “para sa” o “patungo sa”; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “makikipagtagpo,” “takip ng pagtubos,” “kerubin,” at “kaban ng patotoo” upang mapanatili ang sagradong bokabularyo nang hindi maging lipas o labis na teknikal. Lahat ng marker ng talababa ay nakalagay sa pangunahing teksto.
