base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: tl
  text: At ilaladlad ng mga kerubin ang kanilang mga pakpak paitaas, at lililiman nila ng kanilang mga pakpak ang takip ng kaban[a]. Magkakatapat ang kanilang mga mukha; ang mga mukha ng mga kerubin ay nakaharap sa takip ng kaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “takip ng pagtubos” o “luklukan ng awa.” Ang Hebreong kapporet ay tumutukoy sa gintong takip ng kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: At ... ay mag-uunat / magkakaharap
  rationale: Sa konteksto ng mga tagubilin, ang anyo ay may hinaharap o nag-uutos na diwa; natural itong ipinahayag sa Filipino sa aspektong magaganap.
- source_word: הַכְּרֻבִים
  choice: ang mga kerubin
  rationale: Pinananatili ang nakaugaliang transliterasyon para sa mga nilalang na inilalarawan sa banal na kasangkapan.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: mag-uunat ng kanilang mga pakpak paitaas
  rationale: Ipinapahayag nito ang aktibong pagkalatag at paitaas na direksiyon ng mga pakpak sa natural na Filipino.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: nilililiman ng kanilang mga pakpak
  rationale: Ang pandiwa ay naglalarawan ng pagtatakip o paglukob mula sa itaas; ang 'nilililiman' ay nagpapanatili sa kongkretong larawan.
- source_word: עַל הַכַּפֹּרֶת
  choice: ang takip ng kaban
  rationale: Ang כַּפֹּרֶת ay ang gintong takip ng kaban. Mas malinaw sa karaniwang mambabasang Filipino ang reperensiyal na saling ito, habang inilalagay sa talababa ang kaugnayan nito sa pagtubos.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Magkakaharap sila
  rationale: Natural na katumbas sa Filipino ng distributibong idyomang literal na 'bawat isa tungo sa kaniyang kapatid,' na nangangahulugang nakaharap sa isa't isa.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: nak向 ang mga mukha ng mga kerubin sa takip ng kaban
  rationale: Pinananatili ang tahasang pagbanggit sa mga mukha at sa kanilang direksiyon tungo sa takip.
theological_decisions:
- issue: Pagsasalin ng כַּפֹּרֶת sa mga tagubilin tungkol sa tabernakulo
  choice: takip ng kaban
  alternative: luklukan ng awa; takip ng pagtubos
  rationale: Tumutukoy ang salita sa gintong takip ng kaban na may mahalagang papel sa ritwal ng pagtubos. Iniiwasan ng pangunahing salin ang maaaring malabong tradisyonal na parirala, ngunit pinananatili sa talababa ang teolohikal na kaugnayan at mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'kerubin' bilang nakaugaliang terminong biblikal at 'takip ng kaban' bilang madaling maunawaang katawagan sa bagay na tinutukoy.
