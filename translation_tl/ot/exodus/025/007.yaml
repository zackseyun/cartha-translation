translation:
  language: tl
  text: mga batong onix[a] at mga batong ikakabit[b], para sa efod at sa pektoral[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring ibang uri ng mahalagang bato ang tinutukoy ng salitang Hebreo na isinaling “onix”; hindi tiyak ang eksaktong pagkakakilanlan nito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga batong ilalagay” o “mga batong para sa mga kabitan.”
    reason: lexical_alternative
  - marker: c
    text: Tradisyonal na “pantakip sa dibdib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי
  choice: mga bato
  rationale: Ang anyong construct na maramihan ng אֶבֶן ay malawak na nangangahulugang “mga bato.” Ipinahihiwatig ng talaan na mahahalagang bato ang mga ito, ngunit ang “mga bato” ang pinakamalapit sa Hebreo.
- source_word: שֹׁהַם
  choice: onix
  rationale: Hindi tiyak ang eksaktong uri ng batong tinutukoy ng שֹׁהַם. Pinili ang kinikilalang tradisyonal na “onix,” habang nililinaw sa talababa ang kawalang-katiyakan.
- source_word: אַבְנֵי מִלֻּאִים
  choice: mga batong ilalagay sa mga lalagyan
  rationale: Ang מִלֻּאִים ay kaugnay ng pagpuno o paglalagay sa isang setting. Ang parirala ay natural sa Filipino at nagpapahayag na ang mga bato ay ikakabit sa nakahandang lalagyan nang hindi labis na tinutukoy ang paraan ng pagkakagawa.
- source_word: לָאֵפֹד
  choice: para sa efod
  rationale: Ang אֵפוֹד ay teknikal na tawag sa kasuotang pangpari; pinanatili ito bilang transliterasyong “efod” sa halip na bigyan ng di-tiyak na paglalarawan.
- source_word: וְלַחֹשֶׁן
  choice: at sa pektoral
  rationale: Ang חֹשֶׁן ay natatanging kasuotang pangdibdib ng punong pari na kinalalagyan ng mga bato. Ang “pektoral” ay maikli at hindi nagmumungkahi ng baluting pandigma, di-gaya ng “baluti sa dibdib.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang teknikal na “efod,” ginamit ang “pektoral” para sa natatanging kasuotang pangdibdib, at inilagay sa mga talababa ang mga tunay na kawalang-katiyakan sa pagkakakilanlan at pagkakabit ng mga bato.
