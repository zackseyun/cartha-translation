  yaml_path: translation/ot/exodus/025/038.yaml
  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: tl
  text: Ang mga sipit nito[a] at mga lalagyan nito ng baga[b] ay dapat yari sa purong ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pantabas ng mitsa”; tumutukoy ang salitang Hebreo sa kasangkapang panghawak o pantabas na ginagamit sa ilawan.
    reason: lexical_alternative
  - marker: b
    text: O “mga bandeha” o, bagaman hindi gaanong malamang sa kontekstong ito, “mga insensaryo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: mga sipit nito
  rationale: Ang pangngalan ay tumutukoy sa kasangkapang panghawak o pantabas na kaugnay ng ilawan. Likas at malinaw sa makabagong Filipino ang “mga sipit,” habang hindi nito labis na tinutukoy ang eksaktong gamit.
- source_word: מַחְתֹּתֶיהָ
  choice: mga lalagyan nito ng baga
  rationale: Karaniwang tumutukoy ang salita sa mga sisidlang ginagamit sa pagdadala ng baga o apoy. Pinananatili ng saling ito ang gamit ng kasangkapan sa santuwaryo nang hindi ito labis na nililimitahan sa insenso.
- source_word: זָהָב טָהוֹר
  choice: yari sa purong ginto
  rationale: Tuwirang inilalarawan ng parirala ang materyales ng mga kasangkapan; natural sa Filipino ang “yari sa purong ginto.”
- source_word: וּ
  choice: at
  rationale: Ikinakabit ng pang-ugnay ang dalawang uri ng kasangkapan.
- source_word: -הָ
  choice: nito
  rationale: Ang hulaping pambabaeng pangatlong panauhan ay tumutukoy pabalik sa ilawan; ang “nito” ang likas na panghalip para sa isang bagay sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sipit” at “lalagyan ng baga” bilang mga karaniwang salitang nauunawaan ng ordinaryong mambabasa, habang inilagay sa mga talababa ang tunay na mga alternatibong leksikal.
