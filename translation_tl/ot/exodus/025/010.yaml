  yaml_path: translation/ot/exodus/025/010.yaml
  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: tl
  text: Gagawa sila ng isang kaban na yari sa kahoy na akasya[a]. Ang haba nito ay dalawa at kalahating siko, ang lapad ay isa at kalahating siko, at ang taas ay isa at kalahating siko.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “kaban” ay maaari ding isaling “baul” o “kahon.” Ang salitang Hebreo ay tumutukoy sa isang sisidlan; “kaban” ang ginamit dito dahil ito ang sagradong kaban sa konteksto ng tipan.
    reason: lexical_alternative
  - marker: b
    text: Ang siko ay sinaunang yunit ng haba, humigit-kumulang sa distansiya mula sa siko ng braso hanggang sa dulo ng mga daliri.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Gagawa sila
  rationale: Ang anyong pandiwa sa konteksto ng mga tagubilin ay nagpapahayag ng iniutos na gawain. Natural sa modernong Tagalog ang hinaharap na anyong “Gagawa sila,” at hindi kailangang ilantad ang panimulang וְ bilang “At.”
- source_word: אֲרוֹן
  choice: kaban
  rationale: Ang אֲרוֹן ay isang sisidlang tulad ng baul o kahon. Ang “kaban” ang dignified at nakaugaliang salitang Tagalog para sa sagradong sisidlang ito, habang hindi nito ipinagkakamali ang bagay sa arka ni Noe.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Tuwirang ipinahahayag ang materyal sa malinaw na modernong Tagalog; mas nauunawaan ito kaysa sa tradisyonal na transliterasyong “sitim.”
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dalawa at kalahating siko
  rationale: Pinananatili ang sinaunang yunit na אַמָּה bilang “siko,” ang karaniwang terminong Filipino sa Bibliya, at natural na inilalahad ang bilang.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Tumpak at natural na tumutukoy ang “nito” pabalik sa kaban.
- source_word: וְאַמָּה וָחֵצִי
  choice: isa at kalahating siko
  rationale: Natural na paraan sa Tagalog ng pagsasabi ng sukat na isang siko at kalahati.
- source_word: רָחְבּוֹ
  choice: ang lapad nito
  rationale: Ang “lapad” ang malinaw at karaniwang modernong katumbas ng sukat na pahalang.
- source_word: קֹמָתוֹ
  choice: taas nito
  rationale: Sa paglalarawan ng isang bagay, ang קֹמָה ay tumutukoy sa patayong sukat, kaya ang “taas” ang natural na salin.
theological_decisions:
- issue: Pagkatawag sa אֲרוֹן
  choice: kaban
  alternative: kahon o baul
  rationale: Pinananatili ng “kaban” ang sagrado at tipan-kontekstong gamit nang hindi nagdaragdag ng doktrinal na pagpapakahulugan; itinatala sa talababa ang mas literal na mga alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinagsama ang magkaparehong sukat ng lapad at taas gamit ang “tig-iisa at kalahati” upang maging natural nang hindi binabago ang impormasyon ng Hebreo. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
