base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: tl
  text: Gumawa ka rin ng takip ng pagbabayad-sala[a] mula sa purong ginto. Dalawa’t kalahating siko ang haba nito at isa’t kalahating siko ang lapad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “luklukan ng awa” o “takip ng pagpapatawad.” Ang Hebreong כַּפֹּרֶת ay pangalan ng gintong takip na inilalagay sa ibabaw ng kaban at kaugnay ng salitang-ugat כפר, na tumutukoy sa pagbabayad-sala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka rin
  rationale: Ang Qal perfect na may prefixed conjunction ay nagsisilbing tagubilin sa kontekstong ito. Likas sa makabagong Tagalog ang pautos na “Gumawa ka,” at ipinahihiwatig ng “rin” ang pagpapatuloy ng mga naunang tagubilin.
- source_word: כַפֹּרֶת
  choice: takip ng pagpapatawad
  rationale: Tumutukoy ito sa gintong takip na inilalagay sa kaban at kaugnay ng salitang-ugat na כפר, na may diwa ng pagbabayad-sala o pagpapatawad. Iniiwasan ng “takip” ang maling larawan ng isang literal na upuan, samantalang pinananatili ng “ng pagpapatawad” ang teolohikal na ugnayan ng termino. Itinala sa talababa ang tradisyonal na salin.
- source_word: זָהָב טָהוֹר
  choice: mula sa purong ginto
  rationale: Malinaw at likas na ipinahahayag nito kapuwa ang materyal at ang kalidad nito.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dalawa’t kalahating siko
  rationale: Pinananatili ang sinaunang yunit na “siko” at likas na isinasaad sa Tagalog ang bilang.
- source_word: אָרְכָּהּ
  choice: ang haba nito
  rationale: Ang hulaping pambabae ay tumutukoy sa כַפֹּרֶת; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “nito.”
- source_word: וְאַמָּה וָחֵצִי
  choice: at isa’t kalahating siko
  rationale: Likas na Tagalog at kahanay ng unang sukat.
- source_word: רָחְבָּהּ
  choice: ang lapad
  rationale: Tumpak at payak na katumbas ng sukat ng bagay na tinutukoy.
theological_decisions:
- issue: Pagsasalin sa כַפֹּרֶת bilang katawagang panritwal at teolohikal
  choice: takip ng pagpapatawad
  alternative: luklukan ng awa; takip; takip ng pagbabayad-sala
  rationale: Ang bagay ay aktuwal na takip ng kaban, ngunit ang pangalan nito ay kaugnay ng salitang-ugat כפר. Pinananatili ng pangunahing salin ang dalawang aspektong ito nang hindi ipinapalagay na literal itong upuan. Ang “pagpapatawad” ay mas madaling maunawaan ng karaniwang mambabasa kaysa “pagbabayad-sala,” habang ang tradisyonal na “luklukan ng awa” ay pinananatili bilang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “siko” bilang karaniwang katawagang biblikal sa sinaunang cubit, nang hindi ito kinokonvert sa makabagong sukat. Nasa pangunahing teksto ang panandang [a] ayon sa talababa.
