  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: tl
  text: Gumawa ka ng dalawang kerubin na yari sa ginto. Gawin mo ang mga ito na hinubog sa pagpukpok, mula sa magkabilang dulo ng takip para sa pagtubos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “takip ng Kaban.” Tradisyunal itong isinasalin na “luklukan ng awa.” Ang salitang Hebreo ay tumutukoy sa takip ng Kaban na kaugnay ng ritwal ng pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang anyong pandiwa na may pang-ugnay ay nagsisilbing utos sa konteksto ng sunod-sunod na tagubilin. Likas at malinaw sa makabagong Tagalog ang tuwirang pautos.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: dalawang kerubin
  rationale: Pinanatili ang teknikal na katawagang biblikal na “kerubin” upang hindi ito mapagkamalang karaniwang larawan ng mga anghel.
- source_word: זָהָב
  choice: na yari sa ginto
  rationale: Malinaw na ipinapahayag ang gintong materyales ng mga kerubin sa natural na Tagalog.
- source_word: מִקְשָׁה
  choice: sa pamamagitan ng pagpukpok
  rationale: Tumutukoy ito sa paghubog ng metal sa pamamagitan ng pagpukpok. Hindi idinagdag sa pangunahing teksto ang “iisang piraso,” sapagkat maaari man itong ipahiwatig ng paraan ng paggawa, hindi iyon ang pinakatiyak na tahasang kahulugan ng salita rito.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Gawin mo ang mga ito
  rationale: Pinanatili ang pag-uulit ng pandiwang “gawin,” gaya ng Hebreo, upang idiin ang paraan ng paggawa.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: sa magkabilang dulo
  rationale: Natural na paglalarawan ito ng kinalalagyan o kaugnayan ng mga kerubin sa dalawang dulo, nang hindi labis na nagpapasya kung hiwalay silang ikinabit o tuwirang hinubog mula sa takip.
- source_word: הַכַּפֹּרֶת
  choice: takip na pantubos
  rationale: Ipinakikita ng “takip” na ito ang takip ng Kaban, samantalang pinananatili ng “pantubos” ang kaugnayan ng katawagan sa ritwal ng pagtubos. Mas malinaw ito sa kasalukuyang Tagalog kaysa sa tradisyunal ngunit posibleng mapanlinlang na “luklukan ng awa.”
theological_decisions:
- issue: Pagpapakahulugan sa הַכַּפֹּרֶת sa konteksto ng tabernakulo
  choice: takip na pantubos
  alternative: takip ng Kaban; tradisyunal na “luklukan ng awa”
  rationale: Ang tinutukoy ay ang gintong takip ng Kaban na may mahalagang tungkulin sa ritwal ng pagtubos at sa pagpapahayag ng presensiya ng Diyos. Pinagsasama ng salin ang pisikal na anyo at kultikong gamit nito nang hindi ito inilalarawan nang literal bilang isang upuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kerubin” bilang kinikilalang katawagang biblikal; iniwasan ang labis na teknikal o makalumang pananalita.
