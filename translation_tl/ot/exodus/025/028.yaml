  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: tl
  text: Gawin mo ang mga pingga mula sa kahoy na akasya at balutan mo ng ginto ang mga iyon. Sa pamamagitan ng mga iyon[a] ay bubuhatin ang mesa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gamit ang mga iyon.” Ang pang-ukol sa Hebreo ay maaaring magpahayag ng kasangkapan o paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Ang Qal perfect na may pang-ugnay ay ginagamit dito bilang utos sa konteksto ng mga tagubilin. Likas at tuwiran sa modernong Tagalog ang “Gawin mo.”
- source_word: הַבַּדִּים
  choice: mga pingga
  rationale: Tumutukoy ito sa mahahabang baras na ginagamit sa pagbubuhat ng sagradong kasangkapan. Ang “mga pingga” ay maikli at nakaugat sa gamit ng salita sa kontekstong ito.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Ang pariralang construct ay tumutukoy sa kahoy mula sa punong akasya. Ang “kahoy na akasya” ay malinaw sa karaniwang mambabasa at hindi gumagamit ng makalumang transliterasyon.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: balutan mo ng ginto ang mga iyon
  rationale: Sa konteksto ng paggawa, ang צפה ay nangangahulugang patungan o balutan ng isang materyal. Natural sa Tagalog ang “balutan ... ng ginto” at pinananatili nitong hiwalay ang mga pingga sa materyal na pantakip.
- source_word: וְנִשָּׂא בָם
  choice: Sa pamamagitan ng mga iyon ay bubuhatin
  rationale: Ang anyo ng נשא ay pasibo, at ang בָם ay nagsasaad ng kasangkapan o paraan. Malinaw na ipinahahayag ng salin na ang mga pingga ang gagamiting pambuhat.
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Tumutukoy ito sa mesang inilalarawan sa agarang konteksto. Pinananatili ng payak na “ang mesa” ang pagkakasabi ng Hebreo nang walang idinaragdag na paliwanag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang pang-isahang utos na “Gawin mo,” ayon sa ikalawang panauhang panlalaki na isahan sa Hebreo. Inilipat ang pananda ng talababa sa pariralang tinutukoy nito, ang instrumental na בָם.
