translation:
  language: tl
  text: langis para sa ilaw[a], mga mababangong sangkap para sa langis na pampahid at para sa insensong yari sa mababangong sangkap,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “para sa ilawan” o “para sa pagpapailaw.”
    reason: Pinahihintulutan ng salitang Hebreo ang pagtukoy sa ilaw, sa pinagmumulan nito, o sa pagpapailaw sa kontekstong ito.
lexical_decisions:
- source_word: שֶׁמֶן
  choice: langis
  rationale: Pangkalahatang tumutukoy ang salitang Hebreo sa langis. Bagaman malamang na langis ng olibo ang gamit sa kontekstong ito, hindi iyon tahasang tinukoy sa talata.
- source_word: לַמָּאֹר
  choice: para sa ilaw
  rationale: Ang מָאוֹר ay tumutukoy sa ilaw o pinagmumulan ng liwanag. Pinananatili ng “para sa ilaw” ang maikli at bahagyang malawak na pagpapahayag ng Hebreo.
- source_word: בְּשָׂמִים
  choice: mga mababangong sangkap
  rationale: Tumutukoy ito sa mga aromatikong sangkap na ginagamit sa sagradong langis at insenso. Mas angkop dito ang “mga mababangong sangkap” kaysa “mga pampalasa,” na maaaring magtunog pangkusina.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: para sa langis na pamahid
  rationale: 'Ipinahahayag ng parirala ang layunin ng mga mababangong sangkap: gagamitin ang mga ito sa natatanging langis na ipinapahid sa pagtatalaga.'
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Sa konteksto ng tabernakulo, ito ang malinaw at karaniwang kahulugan ng pangngalan.
- source_word: הַסַּמִּים
  choice: yari sa mababangong sangkap
  rationale: Malapit nitong inilalahad ang konstruksiyong Hebreo na literal na “insenso ng mga mababangong sangkap,” nang hindi lamang nagdaragdag ng pang-uring “mabango.”
