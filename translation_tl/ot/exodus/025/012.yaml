    issue: “Tagiliran” para sa צלע ng kaban
    rationale: Bagaman posible ang “tagiliran,” mas karaniwan at mas natural sa Filipino para sa panig ng isang bagay ang “gilid.”
  - severity: low
    issue: Kailangang linawin ang pahayag sa talababa tungkol sa alternatibong pagbasa
    rationale: Ang “mababang mga tukod o tuntungan” ay medyo mabigat at ang “hindi lamang sa mga sulok” ay hindi gaanong tumpak na katumbas ng paglilinaw sa Ingles tungkol sa mga abstraktong sulok. Maaaring ipahayag nang mas malinaw bilang mga paa o mababang tuntungan sa halip na mga sulok.
  revised_text: 'Maghulma ka ng apat na singsing na ginto para rito at ikabit mo ang mga iyon sa apat na paa nito: dalawang singsing sa isang gilid nito at dalawang singsing sa kabilang gilid nito.[a]'
