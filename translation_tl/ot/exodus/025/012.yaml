translation:
  language: tl
  text: 'Maghulma ka ng apat na singsing na ginto para rito at ikabit mo ang mga iyon sa apat na paa nito: dalawang singsing sa isang gilid nito at dalawang singsing sa kabilang gilid nito.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa apat na sulok nito” para sa “sa apat na paa nito.” Mahirap tiyakin ang kahulugan ng salitang Hebreo, ngunit malamang na tumutukoy ito sa mga paa o mababang tuntungan ng kaban, sa halip na sa mga sulok lamang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Maghulma ka
  rationale: Sa konteksto ng paggawa ng mga kagamitang ginto, ang pandiwa ay tumutukoy sa paghuhulma sa pamamagitan ng pagbubuhos ng tunaw na metal, hindi sa karaniwang pagbuhos lamang.
- source_word: טַבְּעֹת
  choice: mga singsing
  rationale: Tumutukoy ito sa mga bilog na kabit na pagdaraanan ng mga pingga; malinaw at likas sa Filipino ang “mga singsing.”
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal.
- source_word: וְנָתַתָּה
  choice: at ikabit mo
  rationale: Bagaman malawak ang kahulugan ng נתן, sa tagubiling ito ang mga singsing ay inilalagay bilang mga kabit sa kaban; mas tiyak at natural dito ang “ikabit.”
- source_word: פַּעֲמֹתָיו
  choice: apat na paa nito
  rationale: Mahirap tiyakin ang eksaktong kahulugan ng salita, ngunit sa kontekstong ito malamang na tumutukoy ito sa mga paa o mababang tukod ng kaban. Pinananatili ng “paa” ang kongkretong larawan ng Hebreo.
- source_word: צַלְעוֹ
  choice: tagiliran nito
  rationale: Sa mga gusali at bagay, ang צלע ay tumutukoy sa gilid o tagiliran. Ang “tagiliran” ay malinaw na tumutukoy sa magkabilang mahabang panig ng kaban.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: isang ... kabilang
  rationale: Natural sa modernong Filipino ang pares na “isang ... kabilang” para sa dalawang magkatapat na panig, bagaman literal na “isa ... ikalawa” ang Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang pang-isahang pautos na “Maghulma ka” at “ikabit mo” upang maipakita ang tuwirang tagubilin kay Moises. Pinili ang “kabilang tagiliran” kaysa literal na “ikalawang tagiliran” para sa likas na daloy nang hindi binabago ang diwa.
