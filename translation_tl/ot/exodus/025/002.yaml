  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: tl
  text: Sabihin mo sa mga anak ng Israel[a] na kumuha sila para sa akin ng handog[b]. Mula sa bawat lalaking inuudyukan ng kanyang puso, tanggapin ninyo ang aking handog.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng Israel,” isang karaniwang katawagang tipanan para sa bayan ng Israel.
    reason: cultural_note
  - marker: b
    text: Maaari ring “ambag.” Ang salitang Hebreo ay tumutukoy sa isang bagay na ibinukod at ibinigay para sa banal na gamit.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “pinupukaw ng kanyang puso” o “hinihikayat ng kanyang puso.” Binibigyang-diin ng idyomang Hebreo ang kusang panloob na pagkukusa.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Sabihin mo sa
  rationale: Ang Piel imperative ng דבר kasama ang אֶל ay tuwirang utos kay Moises na magsalita sa bayan. Natural sa modernong Tagalog ang “Sabihin mo sa” habang pinananatili ang puwersa ng utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Pinananatili nito ang literal at tipanang katawagang “mga anak ng Israel” sa halip na gawing simpleng “mga Israelita.”
- source_word: וְיִקְחוּ לִי
  choice: na kumuha sila ... para sa akin
  rationale: Ang prefixed verb pagkatapos ng imperative ay may diwang utos o layunin. Pinananatili ng “kumuha” ang karaniwang kahulugan ng לקח at ng “para sa akin” ang לִי, nang hindi tinutukoy nang higit sa Hebreo kung paano isasagawa ang pangongolekta.
- source_word: תְּרוּמָה
  choice: handog
  rationale: Tumutukoy ito sa isang ambag na ibinukod para sa banal na gamit. Ang “handog” ay natural at nagpapakita ng pag-uukol nito sa Diyos nang hindi ito nililimitahan sa isang haing ritwal.
- source_word: מֵאֵת כָּל אִישׁ
  choice: mula sa bawat lalaki
  rationale: Pinananatili ang distributibong singular at ang panlalaking anyo ng אִישׁ. Hindi nito ipinapalagay na neutral ang mismong pananalita ng Hebreo.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: inuudyukan ng kanyang puso na magbigay
  rationale: Ang idyoma ay naglalarawan ng panloob at kusang pagkukusa. Nililinaw ng “na magbigay” ang ipinahihiwatig na kilos sa konteksto, samantalang nananatili ang larawan ng pusong umuudyok.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: Tanggapin ninyo ang aking handog
  rationale: Ang maramihang “ninyo” ay pinananatili, gayundin ang pag-aari sa “aking handog.” Ginamit ang “tanggapin” sapagkat mas natural ito sa Tagalog para sa pagtanggap ng kusang handog, bagaman ang pandiwa ay literal na “kunin.”
theological_decisions:
- issue: Kahulugan ng תְּרוּמָה sa konteksto ng paggawa ng santuwaryo
  choice: handog
  alternative: ambag
  rationale: Ipinakikita ng “handog” na ang ibinibigay ay nakalaan sa Diyos at sa banal na gamit, ngunit hindi nito ipinapalagay na isa itong haing sinusunog o ibang tiyak na uri ng sakripisyo. Inilalagay sa talababa ang “ambag” bilang lehitimong alternatibo.
- issue: Kusang-loob na katangian ng pagbibigay
  choice: inuudyukan ng kanyang puso na magbigay
  alternative: kusang-loob na nahihikayat ang puso
  rationale: Pinananatili ang Hebreong larawan ng puso bilang pinagmumulan ng pagkukusa at hindi ginagawang sapilitang buwis ang handog.
- issue: Tinutukoy ng maramihang תִּקְחוּ
  choice: Tanggapin ninyo
  alternative: Kunin ninyo
  rationale: Hindi tahasang nilulutas ng salin kung si Moises lamang, ang mga tagapangasiwa, o ang bayang kinakausap bilang pangkat ang saklaw ng maramihang utos; pinananatili lamang ang anyong maramihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang tipanang katawagang “mga anak ng Israel,” ang panlalaking singular na “bawat lalaki,” at ang larawan ng pusong umuudyok. Ginamit ang “tanggapin” sa ikalawang sugnay para sa natural na Tagalog, samantalang ang unang “kumuha” ay nagpapanatili ng mas tuwirang ugnayan sa Hebreong לקח.
