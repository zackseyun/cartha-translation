  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: tl
  text: Babalutan mo ito ng purong ginto; babalutan mo ito sa loob at labas. Gagawa ka rin ng gintong moldura sa buong palibot nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gintong gilid” o “gintong bordeng palamuti”; ayon sa tradisyon, “koronang ginto.” Ang Hebreong זֵר ay tumutukoy sa pandekorasyong gilid na nakapalibot sa isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: babalutan mo
  rationale: Sa konteksto ng paggawa ng kaban, ang pandiwang צפה ay tumutukoy sa paglalagay ng patong na metal sa isang bagay. Likas sa Filipino ang “babalutan” at nililinaw ng “purong ginto” na metal na patong ang tinutukoy.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Tumutukoy ito sa dinalisay at walang halong ginto; ang “purong ginto” ang malinaw at karaniwang katumbas sa modernong Filipino.
- source_word: מִבַּיִת וּמִחוּץ
  choice: ang loob at labas nito
  rationale: Ipinahihiwatig ng magkatambal na parirala na kapwa papatungan ang panloob at panlabas na bahagi. Natural itong pahayag sa Filipino habang pinananatili ang malinaw na paghahambing.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: gagawa ka rin ... nito
  rationale: Pinananatili ng “gagawa ka rin” ang kasunod na utos, at ng “nito” sa pariralang “sa palibot nito” ang pagkakabit o pagkakalagay ng palamuti sa kaban.
- source_word: זֵר
  choice: moldura
  rationale: Sa konteksto ng mga kagamitan sa santuwaryo, tumutukoy ang זֵר sa isang ginawang pandekorasyong gilid o nakausling palamuti, hindi sa koronang isinusuot. Karaniwan at tiyak ang “moldura” para sa ganitong palibot na dekorasyon.
- source_word: סָבִיב
  choice: sa palibot nito
  rationale: Ipinahahayag nito na ang moldura ay nakapaligid sa bagay sa lahat ng panig.
