  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: tl
  text: Gagawa ka para rito ng balangkas sa palibot na kasinglapad ng isang palad, at gagawa ka ng gintong moldura[a] sa palibot ng balangkas nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gintong korona.” Ang Hebreong זֵר ay maaaring tumukoy sa isang pampalamuting gilid o moldura; “korona” ang tradisyonal na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: balangkas
  rationale: Tumutukoy ito sa isang nakapalibot na bahaging pansuporta o panggilid ng mesa. Ang “balangkas” ay likas at hindi labis na tiyak sa anyo nito.
- source_word: טֹפַח
  choice: kasinglapad ng isang palad
  rationale: Ang salita ay isang sukat na katumbas ng lapad ng kamay o palad. Nilinaw ng “kasinglapad” na sukat ng balangkas ang tinutukoy, at iniiwasan ang “dangkal,” na karaniwang mas mahabang sukat.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Inulit ang parirala upang mapanatili ang dalawang pagbanggit sa Hebreo na kapuwa nagsasaad ng pagkakalagay sa buong palibot.
- source_word: זֵר
  choice: moldura
  rationale: Sa konteksto ng mga kagamitan sa tabernakulo, tumutukoy ito sa nakaangat o pampalamuting gilid. Ang “moldura” ay malinaw sa makabagong Filipino; pinanatili sa talababa ang tradisyonal na alternatibong “korona.”
- source_word: זָהָב
  choice: gintong
  rationale: Likas na pang-uring anyo sa Filipino upang tukuyin na yari sa ginto ang moldura.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: para rito / ng balangkas nito
  rationale: Pinananatili ang mga panghalip na tumutukoy sa mesang binanggit sa naunang konteksto, nang hindi inuulit nang tahasan ang “mesa.”
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Pinananatili ang tuwirang lakas ng utos at ang pag-uulit ng pandiwa sa sunod-sunod na tagubilin.
