translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “palad” bilang sinaunang yunit ng sukat at hindi ang “dangkal,” sapagkat magkaiba ang mga sukat na iyon. Inilagay ang talababa sa “moldura,” ang salitang talagang may leksikal na alternatibo.
