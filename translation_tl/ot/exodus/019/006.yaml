base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: tl
  text: At kayo ay magiging isang kaharian ng mga pari[a] para sa akin at isang banal na bansa. Ito ang mga salitang sasabihin mo sa mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang kahariang makapari.” Maaaring unawain ang pariralang Hebreo bilang isang kahariang binubuo ng mga pari o isang kahariang may katangiang makapari. Ihambing sa 1 Pedro 2:9 ang kaugnay na pananalitang “maharlikang pagkapari.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga anak ni Israel” ay pananalitang Hebreo para sa buong sambayanan ng Israel, hindi lamang sa mga lalaking Israelita.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: kayo ay magiging
  rationale: Ang Qal imperfect ng היה ay nagpapahayag dito ng magiging kalagayan o bunga ng pahayag ng tipan. Pinananatili ng “magiging” ang hinaharap na diwa nang hindi ito ginagawang tahasang utos.
- source_word: לִי
  choice: para sa akin
  rationale: Ang ל na may hulaping unang panauhan ay nagsasaad ng kaugnayan o pag-aari ukol sa nagsasalita. Likas sa modernong Tagalog ang “para sa akin” at napapanatili nito ang pagkakaugnay sa Diyos sa loob ng tipan.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: isang kaharian ng mga pari
  rationale: Ito ang tuwirang anyo ng construct phrase at pinananatili ang pangngalang “kaharian.” Hindi nito ipinapasok sa pangunahing teksto ang pariralang mula sa kalaunang pagtanggap na “maharlikang pagkapari.”
- source_word: גּוֹי קָדוֹשׁ
  choice: isang banal na bansa
  rationale: Tumpak at pamilyar itong katumbas ng pariralang pangngalan at pang-uri, at pinananatili ng “banal” ang diwang kaugnay ng tipan at pagtatalaga sa Diyos.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Ito ang mga salita
  rationale: Sa konteksto ng ipinapasabing pahayag, ang דְּבָרִים ay likas na tumutukoy sa mga salita, hindi lamang sa mga bagay o usapin.
- source_word: תְּדַבֵּר
  choice: sasabihin mo
  rationale: Ang Piel imperfect na ikalawang panauhang panlalaking isahan ay nakatuon kay Moises. Ang “sasabihin mo” ay natural sa Tagalog at nagpapanatili ng tiyak na tagubilin.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang pampamilya ng Hebreo, habang nililinaw sa talababa na ang buong sambayanan ng Israel ang tinutukoy.
theological_decisions:
- issue: Ang sama-samang pagkakakilanlan at bokasyon ng Israel sa tipan
  choice: isang kaharian ng mga pari
  alternative: isang kahariang makapari
  rationale: Maaaring unawain ang pariralang Hebreo bilang kahariang binubuo ng mga pari o bilang kahariang may katangiang makapari. Pinananatili ng pangunahing salin ang pinakatuwirang anyo at inilalahad sa talababa ang tunay na kalabuan.
- issue: Ang saklaw ng katawagang pampamilya para sa Israel
  choice: mga anak ni Israel
  alternative: sambayanan ng Israel
  rationale: Ang anyong Hebreo ay literal na “mga anak na lalaki ni Israel” ngunit karaniwang tumutukoy sa buong bayan. Pinananatili sa teksto ang larawang pampamilya nang hindi ipinahihiwatig sa talababa na mga lalaki lamang ang saklaw.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormal na bigat ng pahayag ng tipan, ngunit iniwasan ang lipas o labis na literal na ayos ng pangungusap. Ang mga salitang “kaharian,” “mga pari,” “banal,” at “bansa” ay pamilyar at teolohikal na malinaw sa karaniwang mambabasa.
