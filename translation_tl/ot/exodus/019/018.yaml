base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: tl
  text: Nabalot ng usok ang buong Bundok Sinai sapagkat bumaba roon si Yahweh sa apoy. Umakyat ang usok nito na parang usok ng isang pugon[a], at yumanig nang napakalakas ang buong bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, hurno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַר סִינַי עָשַׁן כֻּלּוֹ
  choice: Nabalot ng usok ang buong Bundok Sinai
  rationale: Likas sa makabagong Tagalog ang ayos na ito at malinaw na ipinahahayag na ang buong bundok ay nasa usok, nang hindi ginagawang tahasang apoy ang bundok mismo.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: sapagkat
  rationale: Tuwirang ipinakikilala ng parirala ang sanhi; ang “sapagkat” ay malinaw at marangal na pang-ugnay.
- source_word: יָרַד עָלָיו יְהוָה בָּאֵשׁ
  choice: bumaba roon si Yahweh sa apoy
  rationale: Pinananatili ang konkretong kilos ng pagbaba, ang pagtukoy sa bundok sa pamamagitan ng “roon,” ang banal na pangalang Yahweh, at ang apoy bilang paraan o kapahayagan ng pagbaba.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: Umakyat ang usok nito
  rationale: Pinananatili ang payak na larawan ng usok na tumataas; ang “nito” ay tumutukoy sa bundok.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: na parang usok ng isang pugon
  rationale: Ang כִּבְשָׁן ay maaaring tumukoy sa pugon o hurno. Pamilyar at angkop sa matinding tagpo ang “pugon,” habang inilalagay sa talababa ang lehitimong kahalili.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: at yumanig nang napakalakas ang buong bundok
  rationale: Ang “yumanig” ay natural para sa pisikal na pagyanig ng bundok, at ang “nang napakalakas” ay nagpapanatili sa diin ng מְאֹד.
theological_decisions:
- issue: Pagpapangalan sa יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng Hebreong teksto ang Tetragrammaton bilang personal na pangalan; pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Paraan ng pagbaba ni Yahweh
  choice: sa apoy
  alternative: kasama ang apoy
  rationale: Ang בָּאֵשׁ ay pinananatiling maikli at hindi nilulutas nang higit sa teksto kung ang apoy ay kapaligiran, paraan, o anyo ng pagpapakita.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Bundok Sinai,” “pugon,” at “yumanig” bilang mga salitang madaling maunawaan ngunit angkop sa dakilang tagpo; iniwasan ang labis na makaluma o denominasyonal na pananalita.
