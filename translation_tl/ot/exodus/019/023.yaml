  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: tl
  text: At sinabi ni Moises kay Yahweh, “Hindi makakaakyat ang bayan sa Bundok Sinai, sapagkat ikaw mismo ang nagbabala sa amin[a] nang sabihin mo, ‘Magtakda ka ng hangganan sa paligid ng bundok at italaga mo ito bilang banal.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “taimtim na pinagbilinan kami” o “nagpatotoo sa amin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pormal na pagbababala o pagpapatotoo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Magtakda ka ng hangganan para sa bundok at pabanalin mo ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לֹא יוּכַל הָעָם
  choice: Hindi makakaakyat ang bayan
  rationale: Ipinahahayag ng anyong Hebreo ang kawalan ng kakayahan sa ilalim ng umiiral na pagbabawal; natural sa Filipino ang “hindi makakaakyat.”
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: makakaakyat ... sa Bundok Sinai
  rationale: Pinananatili ang pataas na galaw ng עלה at ginagamit ang karaniwang pangalang “Bundok Sinai.”
- source_word: כִּי אַתָּה
  choice: sapagkat ikaw mismo
  rationale: Ang “sapagkat” ay naghahayag ng dahilan, at ang “ikaw mismo” ay nagpapanatili sa diin ng hayag na panghalip na אַתָּה.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: mahigpit na nagbabala sa amin
  rationale: Sa kontekstong ito, ang Hiphil ng עוד ay tumutukoy sa pormal o mariing pagbababala; malinaw itong naihahatid ng parirala sa makabagong Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala nito ang tuwirang sinabi, kasunod ng karaniwang gamit ng Hebreong infinitive.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Magtakda ka ng hangganan sa paligid ng bundok
  rationale: Ipinapakita ng utos ang paglalagay ng limitasyong hindi dapat tawirin, at ipinananatili ng isahan na “ka” na kay Moises nakatuon ang utos.
- source_word: וְקִדַּשְׁתּוֹ
  choice: at italaga mo itong banal
  rationale: Ipinahahayag ang pagtatangi sa bundok bilang banal nang hindi ipinapalagay na likas na pagbabago lamang ang tinutukoy.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng הַעֵדֹתָה בָּנוּ
  choice: mahigpit na nagbabala sa amin
  alternative: taimtim na pinagbilinan kami; nagpatotoo sa amin
  rationale: Pinakamalinaw sa konteksto ng hangganan sa Sinai ang diwa ng babala, ngunit kinikilala sa talababa ang pormal na diwang maaari ring taglayin ng pandiwa.
- issue: Diwa ng וְקִדַּשְׁתּוֹ
  choice: italaga mo itong banal
  alternative: pabanalin mo ito
  rationale: Ang piniling salin ay nagpapakita ng pagbubukod sa bundok bilang banal at umiiwas sa hindi kinakailangang paglutas kung ritwal na pagtatalaga o pagpapabanal ang higit na idinidiin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa Israel bilang isang sama-samang pangkat, ang “Bundok Sinai” bilang karaniwang anyo ng pangalan, at ang isahang “ka/mo” upang mapanatili na kay Moises nakatuon ang siniping utos.
