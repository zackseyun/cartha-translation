revisions:
- from: At sinabi ni Moises kay Yahweh, “Hindi makakaakyat ang bayan sa Bundok Sinai, sapagkat ikaw mismo ang mahigpit na nagbabala sa amin[a], na sinasabi, ‘Magtakda ka ng hangganan sa paligid ng bundok at italaga mo itong banal.’[b]”
  to: At sinabi ni Moises kay Yahweh, “Hindi makakaakyat ang bayan sa Bundok Sinai, sapagkat ikaw mismo ang nagbabala sa amin[a] nang sabihin mo, ‘Magtakda ka ng hangganan sa paligid ng bundok at italaga mo ito bilang banal.’[b]”
  rationale: Inayos ang pag-uugnay ng babala at ng siniping utos upang maging likas sa makabagong Filipino, at nilinaw ang pandiwang tumutukoy sa pagpapabanal/pagtatalaga ng bundok. Walang binagong kahulugan, diin, pangalan, o saklaw ng mga talababa.
