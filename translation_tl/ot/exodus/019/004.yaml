  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: tl
  text: Kayo mismo ang nakakita kung ano ang ginawa ko sa Ehipto at kung paano ko kayo dinala sa mga pakpak ng mga agila[a][b] at dinala ko kayo sa piling ko.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ibabaw ng mga pakpak ng mga agila.” Ang Hebreong pananalita ay isang matingkad na larawan ng makapangyarihan at nag-iingat na pagliligtas.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo na isinaling “mga agila” ay maaari ring tumukoy nang mas malawak sa malalaking ibong mandaragit.
    reason: lexical_alternative
  - marker: c
    text: O, “dinala ko kayo sa akin.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  choice: Kayo mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa mga Israelitang mismong nakasaksi sa ginawa ng Diyos.
- source_word: רְאִיתֶם
  choice: ang nakakita
  rationale: Likas sa modernong Tagalog ang hulma na “Kayo mismo ang nakakita,” at malinaw nitong ipinapahayag ang natapos na karanasang mahalaga pa sa kasalukuyang pahayag.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: sa ginawa ko sa Ehipto
  rationale: Ang Ehipto ang bansang tinamaan ng mga ginawa ng Diyos; ang “sa Ehipto” ay natural sa Tagalog at hindi nagpapahiwatig na ginawa iyon para sa kapakinabangan ng Ehipto.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: Pinasan ko kayo
  rationale: Tumpak na ipinahahayag ng “pinasan” ang pagdadala o pagbuhat at pinananatili ang matingkad na larawang may pag-iingat at lakas.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: sa mga pakpak ng mga agila
  rationale: Pinananatili nito ang Hebreong metapora at ang maramihang anyo, habang gumagamit ng tradisyonal at malamang na kahulugan ng נְשָׁרִים sa kontekstong ito.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: at dinala ko kayo sa piling ko
  rationale: Ang “sa piling ko” ay natural at marangal na Tagalog na naghahayag ng pagdadala tungo sa presensiya at pakikipag-ugnayan ng Diyos, nang hindi dinaragdagan ang pangunahing diwa ng אֵלָי.
theological_decisions:
- issue: Ang relasyonal na layunin ng pagliligtas ng Diyos
  choice: dinala ko kayo sa piling ko
  alternative: dinala ko kayo sa akin
  rationale: Hindi lamang inilabas ng talata ang Israel mula sa Ehipto; dinala rin sila tungo sa Diyos. Ipinahahayag ng “sa piling ko” ang relasyonal na puwersa ng parirala, samantalang inilalagay sa talababa ang mas tuwirang anyo.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “pinasan” upang mapanatili ang matalinghagang larawan, at “sa piling ko” upang maging natural sa Tagalog ang relasyonal na diwa ng pagdadala tungo sa Diyos.
