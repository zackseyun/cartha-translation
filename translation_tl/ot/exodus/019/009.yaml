  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Narito, darating ako sa iyo sa isang makapal na ulap, upang marinig ng bayan habang nakikipag-usap ako sa iyo, at magtiwala rin sila sa iyo[a] magpakailanman.” Pagkatapos, iniulat ni Moises kay Yahweh ang mga sinabi ng bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maniwala rin sila sa iyo” o “manalig din sila sa iyo.” Maaaring ipahayag ng Hebreo ang pagtitiwala kay Moises bilang pinagtibay na tagapagsalita ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili nito ang pansin at maringal na diin ng Hebreong panandang ginagamit sa tuwirang pananalita.
- source_word: בָּא
  choice: darating ako
  rationale: Ang participle ay nagpapahiwatig ng nalalapit na pagkilos; natural itong ipinahahayag sa Filipino sa anyong darating.
- source_word: בְּעַב הֶעָנָן
  choice: sa isang makapal na ulap
  rationale: Malinaw at natural na inilalarawan nito ang kapal o kasinsinan ng ulap.
- source_word: בַּעֲבוּר
  choice: upang
  rationale: Ipinakikita rito ng parirala ang layunin ng pagdating ni Yahweh.
- source_word: יִשְׁמַע הָעָם
  choice: marinig ng bayan
  rationale: Ang anyong ito ay angkop sa sugnay na nagsasaad ng layunin at pinananatili ang bayan bilang tagapakinig.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: ang pagsasalita ko sa iyo
  rationale: Pinananatili ang temporal na kalagayan at ang diwa ng pakikipag-usap kay Moises nang hindi dinaragdagan ang teksto.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: at upang magtiwala rin sila sa iyo
  rationale: Likas sa Filipino ang 'magtiwala sa iyo' at ipinahahayag nito ang pagkilala kay Moises bilang mapagkakatiwalaang tagapagsalita ng Diyos; inilalahad sa talababa ang posibleng 'maniwala' o 'manalig.'
- source_word: לְעוֹלָם
  choice: magpakailanman
  rationale: Dignified at malinaw na katumbas ng pangmatagalang panahong ipinahahayag ng Hebreo.
- source_word: וַיַּגֵּד
  choice: Pagkatapos, iniulat ni Moises
  rationale: Ipinakikita ng 'Pagkatapos' ang pagsulong ng salaysay, at ang 'iniulat' ay angkop sa paghahatid kay Yahweh ng sinabi ng bayan.
- source_word: דִּבְרֵי הָעָם
  choice: ang mga sinabi ng bayan
  rationale: Natural na Filipino ito para sa 'mga salita ng bayan' habang tumpak na tumutukoy sa nilalaman ng kanilang sinabi.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng בְּךָ יַאֲמִינוּ tungkol kay Moises
  choice: magtiwala rin sila sa iyo
  alternative: maniwala rin sila sa iyo; manalig din sila sa iyo
  rationale: Tumutukoy ang konteksto sa patuloy na pagtanggap ng bayan kay Moises bilang pinagtibay na tagapagsalita ng Diyos. Hindi nito ipinahihiwatig na sasambahin si Moises, at pinananatili sa talababa ang leksikal na lawak ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Narito” upang mapanatili ang solemneng diin, samantalang ang “magtiwala” at “iniulat” ay madaling maunawaan ng karaniwang mambabasa.
