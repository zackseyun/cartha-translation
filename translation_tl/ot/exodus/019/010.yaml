base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Pumunta ka sa mga tao at pabanalin mo sila[a] ngayon at bukas, at maglaba sila ng kanilang mga kasuotan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “italaga mo sila” o “ibukod mo sila bilang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural itong ipinapahayag sa Tagalog bilang “Pagkatapos ay sinabi.”
- source_word: לֵךְ אֶל־הָעָם
  choice: Pumunta ka sa bayan
  rationale: Tuwirang utos ang לֵךְ, at ang הָעָם ay tumutukoy sa sambayanan ng Israel. Ang “bayan” ay natural na kolektibong katawagan sa kontekstong ito.
- source_word: וְקִדַּשְׁתָּם
  choice: at italaga mo sila
  rationale: Ang piel ng קדשׁ ay tumutukoy sa paghahanda o pagbubukod sa bayan bilang banal para sa pakikipagtagpo sa Diyos. Pinananatili ng “italaga” ang ritwal at sagradong diwa nang hindi ito nililimitahan sa panloob na pagbabagong moral.
- source_word: הַיּוֹם וּמָחָר
  choice: ngayon at bukas
  rationale: Tuwirang ipinapahayag ang dalawang araw ng paghahanda.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: at labhan nila ang kanilang mga kasuotan
  rationale: Pinananatili ang maramihang pandiwa at ang tahasang layon nito. Ang “mga kasuotan” ay angkop sa marangal at ritwal na konteksto.
theological_decisions:
- issue: Ritwal na paghahanda sa salitang קדשׁ
  choice: italaga mo sila
  alternative: pabanalin mo sila; ibukod mo sila bilang banal
  rationale: Ang konteksto ay paghahanda ng Israel sa pakikipagtagpo kay Yahweh sa Sinai. Ang “italaga” ay nagpapanatili sa ritwal at tipanang dimensiyon nang hindi ipinapalagay na panloob na moral na pagbabago lamang ang tinutukoy.
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang transliterasyon sa halip na palitan ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong sambayanan at “mga kasuotan” upang umangkop sa solemneng konteksto. Inilagay ang talababa pagkatapos ng “italaga mo sila,” ang pariralang talagang nililinaw nito.
