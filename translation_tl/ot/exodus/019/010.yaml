    issue: Ang “bayan” ay maaaring maunawaan bilang isang lugar o munisipalidad.
    rationale: Ang הָעָם ay tumutukoy sa mga tao bilang isang kolektibo, hindi sa isang pook. Ang “mga tao” ay mas malinaw at natural sa kontemporaryong Filipino.
  - severity: low
    issue: Ang “italaga mo sila” ay mas malawak kaysa sa ritwal na pagpapabanal.
    rationale: Bagaman posible ang “italaga,” maaari itong tumukoy sa pag-aatas o pagtatalaga sa gawain. Ang “pabanalin” ay mas direktang naghahatid ng קדשׁ sa kontekstong ito.
  - severity: low
