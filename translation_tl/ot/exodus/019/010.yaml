  source_fidelity: Ang pangunahing diwa at lahat ng sugnay ay nasa salin, kabilang ang pangalang Yahweh, ang dalawang araw ng paghahanda, at ang paghuhugas ng mga kasuotan. Gayunman, ang “bayan” ay karaniwang tumutukoy sa isang pamayanan o bayan/town sa makabagong Filipino, samantalang הָעָם ay ang kolektibong mga tao ng Israel. Ang “pabanalin” ay mas tuwirang tumutugma sa piel ng קדשׁ kaysa sa “italaga” lamang, na maaari ring mangahulugang magtalaga sa isang tungkulin.
  naturalness: Mas natural at malinaw sa modernong Filipino ang “mga tao” kaysa “bayan” sa utos na pumunta sa kolektibong grupo. Ang “at maglaba sila ng kanilang mga kasuotan” ay malinaw na maramihang kasunod na utos at iniiwasan ang bahagyang pilit na “labhan nila.”
  terminology: Pinanatili ang “Yahweh” bilang personal na pangalan. Ang “pabanalin mo sila” ay angkop na terminong sakral para sa ritwal na paghahanda; nililinaw ng talababa ang mga alternatibong “italaga” at “ibukod ... bilang banal” nang hindi binabawasan ang sakral na kahulugan.
  issues:
