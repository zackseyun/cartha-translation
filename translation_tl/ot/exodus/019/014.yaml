base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: tl
  text: Bumaba si Moises mula sa bundok patungo sa bayan, at ibinukod niya bilang banal ang bayan[a]; nilabhan naman nila ang kanilang mga kasuotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinabanal niya ang bayan” o “itinalaga niya ang bayan bilang banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Tuwirang ipinapahayag ng ירד ang pagkilos pababa at natural ito sa makabagong Tagalog.
- source_word: מִן הָהָר
  choice: mula sa bundok
  rationale: Ang הַר ay tumutukoy sa bundok na Sinai sa konteksto; malinaw at karaniwan ang “bundok.”
- source_word: אֶל הָעָם
  choice: patungo sa bayan
  rationale: Ang עָם ay ang sambayanan o bayan; pinananatili ng “bayan” ang kolektibong diwa nang hindi ipinapalagay na pormal na kapulungan ito.
- source_word: וַיְקַדֵּשׁ
  choice: itinalaga niya bilang banal
  rationale: Ang piel ng קדשׁ dito ay tumutukoy sa ritwal na paghahanda at pagbubukod para sa pakikipagtagpo sa Diyos. Naipahahayag ng parirala kapwa ang pagtatalaga at kaugnayan nito sa kabanalan.
- source_word: הָעָם
  choice: ang bayan
  rationale: Pinananatili ang pag-uulit sa Hebreo para sa linaw at diin.
- source_word: וַיְכַבְּסוּ
  choice: nilabhan nila
  rationale: Ang כבס ay partikular na tumutukoy sa paglalaba o paghuhugas ng kasuotan; mas tiyak dito ang “nilabhan” kaysa “hinugasan.”
- source_word: שִׂמְלֹתָם
  choice: ang kanilang mga kasuotan
  rationale: Ang שִׂמְלָה ay damit o kasuotan. Ang “mga kasuotan” ay dignified at angkop sa ritwal na konteksto nang hindi lipas ang tunog.
theological_decisions:
- issue: Paglalarawan sa ritwal na kabanalan bilang paghahanda sa pagpapakita ng Diyos sa Sinai
  choice: itinalaga niya bilang banal ang bayan
  alternative: pinabanal niya ang bayan; ibinukod niya ang bayan
  rationale: Ipinakikita ng konteksto ang ritwal na paghahanda, hindi kinakailangang pagbabagong moral. Pinananatili ng “itinalaga bilang banal” ang dalawang diwa ng pagbubukod at kabanalan nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עָם at “mga kasuotan” upang mapanatili ang bahagyang pormal na himig ng ritwal na paghahanda.
