  source_fidelity: Tumpak na naisalin ang pagtaas ng tindi ng tunog, ang pagsasalita ni Moises, at ang pagtugon ng Diyos. Ang “sa pamamagitan ng tinig” ay maingat na pinananatili ang di-tiyak na saklaw ng בְּקוֹל at hindi ito awtomatikong tinutumbasan ng kulog.
  naturalness: Natural ang pangunahing salin sa modernong Filipino. Gayunman, hindi gramatikal at hindi natural ang “nang naririnig” sa talababa; kailangan itong gawing “sa paraang naririnig.” Ang “palakas nang palakas” ay mas karaniwang pananalita para sa tumitinding tunog.
  terminology: Ang “trumpeta,” “Diyos,” at “tinig” ay angkop sa marangal ngunit modernong rehistro. Pinananatili ng “tinig” ang mahalagang kalabuan ng Hebreong qôl sa huling parirala.
