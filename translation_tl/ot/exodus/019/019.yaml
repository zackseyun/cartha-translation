  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: tl
  text: At ang tunog ng trumpeta ay patuloy na palakas nang palakas[a]. Nagsasalita si Moises, at sinasagot siya ng Diyos sa pamamagitan ng tinig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumalakas nang lumalakas.” Literal na inilalarawan ng Hebreo ang tunog ng trumpeta bilang “patuloy na lumalakad at nagiging napakalakas.”
    reason: lexical_alternative
  - marker: b
    text: O “sa pamamagitan ng kulog” o “sa paraang naririnig.” Sinasabi ng Hebreo, “sa pamamagitan ng tinig.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: At ... ay patuloy
  rationale: Iniuugnay nito ang pangyayari sa nagpapatuloy na paglakas ng tunog, sa halip na gamitin ang kahoy na literal na 'at nangyari.'
- source_word: קוֹל הַשּׁוֹפָר
  choice: ang tunog ng trumpeta
  rationale: Sa pagkakaugnay nito sa שׁוֹפָר, ang קוֹל ay likas na tumutukoy sa tunog. Ang 'trumpeta' ay malinaw at natural sa modernong Filipino.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: patuloy na lumalakas nang lumalakas
  rationale: Ipinapahayag ng parirala ang tuloy-tuloy at matinding pag-igting. Pinananatili ng 'lumalakas' ang mas malawak na larawan ng lakas, habang maaaring tumukoy ang konteksto sa paglakas ng volume.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Nagsasalita si Moises
  rationale: Ang imperfect ay naglalarawan ng nagpapatuloy o nauulit na kilos sa tagpo. Natural sa Filipino ang aspektong imperpektibo.
- source_word: יַעֲנֶנּוּ
  choice: sinasagot siya
  rationale: Tinutugma ng aspektong imperpektibo ang nagpapatuloy o nauulit na pagsasalita ni Moises at pagtugon ng Diyos.
- source_word: בְּקוֹל
  choice: sa pamamagitan ng tinig
  rationale: Pinananatili nito ang literal at malawak na diwa ng 'sa/pamamagitan ng isang tinig' nang hindi agad ipinapakahulugang kulog.
theological_decisions:
- issue: Kalikasan ng tugon ng Diyos sa Sinai
  choice: sumagot ang Diyos 'sa pamamagitan ng tinig'
  alternative: sumagot ang Diyos sa pamamagitan ng kulog; sumagot ang Diyos nang naririnig
  rationale: Hindi espesipikong sinasabi ng בְּקוֹל na kulog ang tugon. Pinananatili ng pangunahing salin ang leksikal na kaluwagan at teolohikal na tensiyon, habang inilalagay sa talababa ang mga posibleng pagpapakahulugan.
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang imperpektibong aspekto upang katawanin ang nagpapatuloy o nauulit na kilos sa tagpo; iniwasan ang denominasyonal na pagpapakahulugan.
