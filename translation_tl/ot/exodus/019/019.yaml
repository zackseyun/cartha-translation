  - severity: low
    issue: Mas idiomatiko ang “palakas nang palakas” kaysa “lumalakas nang lumalakas” para sa tunog.
    rationale: Kapwa nauunawaan, ngunit ang binagong anyo ay mas likas na Filipino at tumutugma sa posibleng kahulugang “grew louder and louder,” habang nananatiling nasa pangunahing teksto ang ideya ng pag-igting.
