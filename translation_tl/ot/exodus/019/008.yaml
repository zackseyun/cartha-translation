  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: tl
  text: Sabay-sabay na sumagot ang buong bayan, “Gagawin namin ang lahat ng sinabi ni Yahweh.” Pagkatapos, iniulat ni Moises kay Yahweh ang sinabi ng bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na salin: “ibinalik ni Moises kay Yahweh ang mga salita ng bayan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: sumagot
  rationale: Karaniwang nangangahulugang sumagot o tumugon ang ענה sa ganitong konteksto ng salaysay; malinaw rin itong naghahanda sa tuwirang sipi.
- source_word: כָל הָעָם יַחְדָּו
  choice: sabay-sabay na ... ang buong bayan
  rationale: Pinagsasama nito ang kolektibong diwa ng כָל הָעָם at ang nagkakaisang pagtugon na ipinahihiwatig ng יַחְדָּו, sa natural na modernong Tagalog.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: ang lahat ng sinabi
  rationale: Tuwirang inilalahad ang saklaw ng כֹּל אֲשֶׁר at natural na isinasalin ang natapos na pananalita sa Tagalog bilang “sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na nakasulat sa Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: נַעֲשֶׂה
  choice: Gagawin namin
  rationale: Ang עשה ay pangunahing nangangahulugang “gawin.” Iniiwasan ng saling ito ang mas interpretatibong “susundin namin,” kahit ipinahihiwatig ng konteksto ang pagsunod.
- source_word: וַיָּשֶׁב
  choice: iniulat
  rationale: Sa Hiphil, ang שוב dito ay tumutukoy sa pagbabalik o pag-uulat ng tugon. Ang “iniulat” ang pinakanatural sa Tagalog, samantalang inilalagay sa talababa ang mas literal na larawang “ibinalik.”
- source_word: דִּבְרֵי הָעָם
  choice: ang sinabi ng bayan
  rationale: Natural itong katumbas sa Tagalog ng “mga salita ng bayan” at pinananatili ang nilalaman ng kanilang tugon nang hindi nagdaragdag ng interpretasyon.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ipinahihiwatig ng אֶל ang patutunguhan ng iniulat ni Moises; “kay” ang natural na pananda para sa personal na pangalan sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kung gagawing tahasang wika ng pagsunod ang נַעֲשֶׂה
  choice: Gagawin namin
  alternative: Susundin namin
  rationale: Bagaman ang pangako ay may diwa ng pagsunod sa konteksto ng tipan, ang pandiwang Hebreo ay “gawin.” Pinananatili ng salin ang mismong pahayag nang hindi pinatitindi ang interpretasyon.
- issue: Pagpapakahulugan sa וַיָּשֶׁב bilang pag-uulat o literal na pagbabalik
  choice: iniulat
  alternative: ibinalik
  rationale: Ang anyong Hiphil ng שוב ay maaaring maglarawan ng pagbabalik ng mga salita at idiomatikong mangahulugang pag-uulat pabalik. Natural sa Tagalog ang “iniulat,” habang pinananatili sa talababa ang mas literal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “buong bayan” para sa kolektibong Israel at “sabay-sabay” para sa kanilang nagkakaisang tugon. Inilagay ang talababa sa sugnay na kaugnay ng וַיָּשֶׁב, ang salitang may leksikal na alternatibo.
