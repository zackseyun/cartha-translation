  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: tl
  text: Umalis sila sa Refidim at dumating sa ilang ng Sinai. Nagkampo sila sa ilang, at doon nagkampo ang Israel sa harap ng bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa tapat ng bundok.” Ang salitang Hebreo ay maaaring tumukoy sa puwestong kaharap o nasa harapan ng isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵרְפִידִים
  choice: Umalis sila sa Refidim
  rationale: Ang נסע sa salaysay ng paglalakbay ay tumutukoy sa pag-alis ng kampo upang magpatuloy. Likas at malinaw sa makabagong Tagalog ang “umalis,” at ang מֵ ay isinalin bilang “sa” sa pariralang “umalis sa Refidim.”
- source_word: וַיָּבֹאוּ
  choice: at dumating
  rationale: Maaaring mangahulugan ang בוא ng pagdating, pagpasok, o paglapit. Ang “dumating” ang pinakanatural sa pagkakasunod ng pag-alis at pagdating sa isang pook.
- source_word: מִדְבַּר סִינַי
  choice: ilang ng Sinai
  rationale: Ang מִדְבָּר ay tuyot at di-tinitirhang lupain; ang “ilang” ay maikli, dignificado, at karaniwang salin sa kontekstong biblikal. Pinanatili ang Sinai bilang pangalang pantangi.
- source_word: וַיַּחֲנוּ בַּמִּדְבָּר
  choice: Nagkampo sila sa ilang
  rationale: Ang חנה ay “magkampo.” Pinanatili ang pag-uulit ng “ilang” mula sa Hebreo sa halip na paikliin ang pangungusap.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: at doon nagkampo ang Israel
  rationale: Inilagay ang “doon” bago ang pandiwa upang maipakita ang bahagyang diin ng שָׁם. Ang Israel ay ginamit bilang pangngalang kolektibo para sa bayan.
- source_word: נֶגֶד הָהָר
  choice: sa harap ng bundok
  rationale: Ang נֶגֶד ay nagsasaad ng puwestong kaharap, katapat, o nasa harapan ng isang bagay. Ang “sa harap ng bundok” ay natural at hindi labis na nagtatakda ng eksaktong ayos ng kampo; inilakip sa talababa ang leksikal na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may dignidad na angkop sa salaysay. Pinanatili ang pag-uulit ng “ilang” at “nagkampo” upang maipakita ang estruktura at diin ng Hebreo. Inilagay ang talababa sa pariralang aktuwal nitong nililinaw.
