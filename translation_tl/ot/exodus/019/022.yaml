base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: tl
  text: Maging ang mga paring lumalapit kay Yahweh[a] ay dapat magpakabanal, baka bigla silang parusahan ni Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lumalapit sa harap ni Yahweh” o “humaharap kay Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “bumugso laban sa kanila.” Inilalarawan ng Hebreo ang biglaang pagbugso ng hatol ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Maging
  rationale: 'Ipinapakita ang mariing pagdaragdag: kahit ang mga pari ay saklaw ng babala, kaugnay ng naunang utos.'
- source_word: הַכֹּהֲנִים
  choice: ang mga pari
  rationale: Karaniwang katawagan sa mga paring gumaganap ng tungkuling panrelihiyon; pinananatili ang katiyakan ng anyong Hebreo.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: lumalapit kay Yahweh
  rationale: Pinananatili ang diwa ng paglapit sa presensiya ng Diyos para sa paglilingkod, nang hindi nililimitahan ang parirala sa isang tiyak na ritwal.
- source_word: יִתְקַדָּשׁוּ
  choice: dapat magpakabanal
  rationale: Ang reflexive na anyo ay tumutukoy sa paghahanda o pagtatalaga ng sarili bilang banal; natural at maikli ang “magpakabanal” sa modernong Tagalog.
- source_word: פֶּן
  choice: kung hindi ay
  rationale: Malinaw na naghahatid ng babala at ng maaaring masamang bunga ng hindi pagsunod.
- source_word: יִפְרֹץ בָּהֶם
  choice: biglang sasalakayin sila
  rationale: Ipinahahayag ang marahas at biglaang pagkilos laban sa kanila na inilalarawan ng pandiwang פרץ, habang iniiwasang tukuyin ang paraang hindi sinabi ng teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan ng Diyos at ang tahasang pag-uulit nito sa dulo ng talata.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Kalikasan ng babala sa יִפְרֹץ בָּהֶם יְהוָה
  choice: Bigla at mapanganib na pagkilos ni Yahweh laban sa kanila
  alternative: Paglagos o pagsiklab ni Yahweh sa kanila nang walang tahasang diwang maparusahan
  rationale: Sa konteksto ng mga hangganan sa Sinai, ang parirala ay nagbababala ng biglaang hatol laban sa mga hindi nakahandang lumapit, ngunit hindi tinutukoy ang eksaktong anyo ng kaparusahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “magpakabanal” para sa ritwal na paghahanda at pagtatalaga ng sarili, at nilinaw sa talababa ang matalinghagang puwersa ng biglaang “pagsiklab” ng hatol.
