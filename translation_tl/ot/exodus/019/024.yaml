base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: tl
  text: Sinabi sa kanya ni Yahweh, “Bumaba ka, at pagkatapos ay umakyat kayong dalawa ni Aaron. Ngunit huwag magpilit lumusot ang mga pari at ang bayan upang umakyat kay Yahweh, baka bigla siyang rumagasa laban sa kanila.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ngunit huwag magpilit lumusot ang mga pari at ang bayan upang umakyat kay Yahweh, baka bigla siyang sumalakay laban sa kanila.” Magkaugnay na larawan ng sapilitang paglusot ng mga tao at ng biglaang pagragasa ng hatol ni Yahweh ang ginagamit sa Hebreo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh upang tuwirang katawanin ang Tetragrammaton sa tekstong Hebreo.
- source_word: לֶךְ רֵד
  choice: Bumaba ka
  rationale: Ang magkasunod na pautos ay idyomatikong nagsasaad ng agarang pagbaba; natural at malinaw ito sa Tagalog.
- source_word: וְעָלִיתָ
  choice: Pagkatapos, umakyat ka
  rationale: Bagaman anyong perfect sa Hebreo, may lakas itong pautos o susunod na kilos sa konteksto. Nilinaw ng “Pagkatapos” ang pagkakasunod nang hindi binabago ang diwa.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: kasama si Aaron
  rationale: Natural na ipinahahayag sa Tagalog ang tahasang pagbanggit kay Moises at ang pagsama ni Aaron sa pandiwang “umakyat ka kasama si Aaron.”
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: ang mga pari at ang bayan
  rationale: Karaniwang mga katumbas sa kontekstong panrelihiyon at pangkomunidad.
- source_word: אַל יֶהֶרְסוּ
  choice: huwag lumampas sa hangganan
  rationale: Sa konteksto, tumutukoy ang הרס sa sapilitang paglagpas o paglusot sa itinakdang hangganan. Malinaw sa modernong Tagalog ang napiling parirala.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: upang umakyat kay Yahweh
  rationale: Pinananatili ang patayong kilos at ang paglapit sa presensiya ni Yahweh sa bundok.
- source_word: פֶּן יִפְרָץ בָּם
  choice: kung hindi ay sasalakayin niya sila
  rationale: Ipinahahayag ang biglaan at mapaminsalang pagkilos ng banal na hatol. Ipinaliliwanag sa talababa ang kaugnay na larawang “rumagasa” upang mapanatili ang ugnayang leksikal sa naunang babala.
theological_decisions:
- issue: Pagtukoy sa paksa ng יִפְרָץ
  choice: si Yahweh ang ipinahihiwatig na paksa sa “sasalakayin niya sila”
  alternative: impersonal na salot o kapahamakan ang sasapit sa kanila
  rationale: Ang pinakamalapit at makabuluhang paksa ay si Yahweh, gaya rin ng konteksto ng babala, ngunit hindi dinaragdagan ng paliwanag kung paano magaganap ang hatol.
- issue: Paglalarawan sa banal na hatol
  choice: sasalakayin niya sila
  alternative: ragasain niya sila / sumiklab siya laban sa kanila
  rationale: Pinananatili ang biglaan at mapanganib na hatol nang hindi ito inilalarawan bilang tiyak na uri ng kaparusahan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong Israel at “hangganan” upang maipakita ang ipinagbabawal na paglagpas sa itinakdang limitasyon. Nasa pangunahing teksto ang marker na [a].
