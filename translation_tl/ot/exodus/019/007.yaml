base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: tl
  text: Dumating si Moises at ipinatawag[a] ang mga nakatatanda ng bayan. Inilahad niya sa kanila ang lahat ng salitang[b] ito na iniutos sa kanya ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “tinawag ang mga nakatatanda ng bayan.”
    reason: lexical_alternative
  - marker: b
    text: O, “mga bagay” o “mga usapin.” Ang salitang Hebreo ay maaaring tumukoy sa mga salitang binigkas o sa mga bagay na tinatalakay; pinili rito ang “mga salita” sapagkat ipinababatid ni Moises ang mensahe ni Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: dumating
  rationale: Ang בוא ay maaaring mangahulugang ‘dumating’ o ‘pumunta’ ayon sa pananaw ng nagsasalaysay. Ang ‘dumating’ ay likas dito habang nagbabalik si Moises mula kay Yahweh patungo sa bayan.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: ipinatawag ang mga nakatatanda sa bayan
  rationale: Ang קרא na may ל ay maaaring tumukoy sa pagtawag sa kanila o pagpapatawag upang magtipon. Likas sa Filipino ang ‘ipinatawag’ sa kontekstong tinipon ni Moises ang kinikilalang matatandang kinatawan ng bayan.
- source_word: זִקְנֵי הָעָם
  choice: mga nakatatanda sa bayan
  rationale: Pinananatili nito ang literal at panlipunang diwa ng זקנים bilang kinikilalang matatandang kinatawan, nang hindi ito nililimitahan sa pangkalahatang salitang ‘mga pinuno.’
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: inilahad niya sa kanila
  rationale: Ang literal na ‘inilagay sa harap nila’ ay isang idyoma para sa malinaw na paghaharap o paglalahad ng mensahe. Ang ‘inilahad’ ay natural at marangal sa modernong Filipino.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: lahat ng salitang ito
  rationale: Maaaring mangahulugan ang דְּבָרִים ng ‘mga salita,’ ‘mga bagay,’ o ‘mga usapin.’ Pinili ang ‘mga salita’ sapagkat ipinababatid ni Moises ang sinabi ni Yahweh sa naunang talata, habang itinatala sa talababa ang tunay na lawak ng salita.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: na iniutos sa kanya ni Yahweh
  rationale: Malinaw nitong ipinakikita na si Yahweh ang pinagmulan at may awtoridad sa mensaheng inilahad ni Moises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang ‘Yahweh’ upang mapanatili ang personal na pangalang tipan na hayagang nasa tekstong Hebreo.
theological_decisions:
- issue: Paglalarawan sa mga זִקְנֵי הָעָם
  choice: mga nakatatanda sa bayan
  alternative: mga pinuno ng bayan
  rationale: Ang ‘mga nakatatanda’ ay nagpapanatili sa tiyak na katawagang panlipunan at pampamayanan nang hindi ipinapalagay na katumbas lamang ito ng lahat ng uri ng pinuno.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng Hebreo ang pangalang יְהוָה; pinananatili bilang ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang ‘mga nakatatanda sa bayan’ bilang malinaw ngunit hindi labis na interpretibong katawagan sa mga kinikilalang matatandang kinatawan. Ang ‘inilahad’ ay natural na katumbas ng idyomang Hebreo na ‘inilagay sa harap nila.’
