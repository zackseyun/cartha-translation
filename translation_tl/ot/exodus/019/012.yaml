base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: tl
  text: 'Magtakda ka ng hangganan sa palibot ng mga tao at sabihin mo, ‘Mag-ingat kayo: huwag kayong umakyat sa bundok ni humipo sa gilid nito. Ang sinumang humipo sa bundok ay tiyak na papatayin.[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tiyak na mamamatay.” Ang Hebreong pananalita ay mariing pormula tungkol sa kamatayan; isinalin itong “tiyak na papatayin” upang ipakita ang passive na anyo at ang paglalapat ng parusang kamatayan sa kasunod na talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Magtakda ka ng hangganan
  rationale: Ang Hiphil ng גבל ay nangangahulugang magtakda ng hangganan o limitasyon. Malinaw nitong ipinapahayag ang pagtatatag ng ipinagbabawal na saklaw.
- source_word: אֶת־הָעָם סָבִיב
  choice: sa palibot ng mga tao
  rationale: Ipinahihiwatig ng סָבִיב ang hangganang nakapaligid sa buong kapulungan.
- source_word: לֵאמֹר
  choice: at sabihin mo
  rationale: Ipinakikilala ng infinitive ang nilalaman ng utos; mas natural sa modernong Tagalog ang tahasang pandiwang ito kaysa literal na participle.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Mag-ingat kayo
  rationale: Ang Niphal imperative na may לָכֶם ay idyomang nag-uutos na bantayan ang sarili o mag-ingat.
- source_word: עֲלוֹת בָּהָר
  choice: huwag kayong umakyat sa bundok
  rationale: Sa saklaw ng babala, ang infinitive עֲלוֹת ay tumutukoy sa pag-akyat o pagtuntong sa bundok.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: ni humipo sa gilid nito
  rationale: Ang נגע ay ‘humipo,’ at ang קָצֶה ay dulo o gilid. Pinananatili ng salin ang konkretong ideya ng hangganan.
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Ang sinumang humipo sa bundok
  rationale: Ang konstruksyon ay pangkalahatan at sumasaklaw sa bawat taong lalabag.
- source_word: מוֹת יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ang infinitive absolute na kasunod ng passive imperfect ay nagbibigay-diin sa katiyakan ng kamatayan; ang ‘papatayin’ ay nagpapanatili sa passive na anyo, at ang ‘tiyak’ sa emphatic na puwersa.
theological_decisions:
- issue: Kung ang מוֹת יוּמָת ay tumutukoy sa tiyak na pagkamatay o sa paglalapat ng parusang kamatayan
  choice: tiyak na papatayin
  alternative: tiyak na mamamatay
  rationale: Pinananatili ng pangunahing salin ang passive na anyo ng יוּמָת at umaayon sa kasunod na talata, na naglalarawan ng pagpatay sa lumabag. Inilalagay sa talababa ang tunay na posibleng saling nakatuon sa tiyak na pagkamatay.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “ni” sa magkatambal na pagbabawal para sa maikli at natural na daloy. Inilagay ang talababa sa pariralang aktuwal nitong nililinaw.
