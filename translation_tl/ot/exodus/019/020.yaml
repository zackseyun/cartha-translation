  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: tl
  text: Bumaba si Yahweh sa Bundok Sinai, sa tuktok ng bundok. Pagkatapos, tinawag ni Yahweh si Moises paakyat sa tuktok ng bundok[a], at umakyat si Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa ulo ng bundok,” na nangangahulugang “sa tuktok ng bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Bumaba
  rationale: Tuwirang ipinapahayag ng ירד ang pagkilos pababa; natural ito sa salaysay at malinaw na katapat ng “umakyat” sa hulihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הַר סִינַי
  choice: Bundok Sinai
  rationale: Ito ang natural at karaniwang anyo ng pangalan ng lugar sa modernong Filipino.
- source_word: אֶל רֹאשׁ הָהָר
  choice: sa tuktok ng bundok
  rationale: Literal na “ulo ng bundok” ang parirala, ngunit ang idyomatikong kahulugan nito ay ang pinakamataas na bahagi o tuktok.
- source_word: וַיִּקְרָא
  choice: tinawag
  rationale: Pinananatili ang tuwirang kahulugan ng קרא nang hindi dinaragdagan ang lakas nito gaya ng maaaring ipahiwatig ng “ipinatawag.”
- source_word: לְמֹשֶׁה
  choice: si Moises
  rationale: Ginamit ang kinagawiang anyong Filipino ng personal na pangalan.
- source_word: וַיַּעַל
  choice: umakyat
  rationale: Tuwirang katumbas ng עלה at malinaw na kaibahan ng naunang “bumaba.”
theological_decisions:
- issue: Paglalahad sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan sa halip na palitan ng titulong “ang PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “paakyat sa tuktok” ay natural na nagsasaad na doon tinawag si Moises, nang hindi ipinahihiwatig na nasa tuktok na siya nang tawagin.
