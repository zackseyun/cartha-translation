  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: tl
  text: Pagkatapos, inilabas ni Moises ang bayan mula sa kampo upang salubungin ang Diyos, at pumuwesto sila sa paanan ng bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa ibabang bahagi ng bundok.” Ang pananalitang Hebreo ay tumutukoy sa mababang bahagi o paanan ng bundok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: inilabas
  rationale: 'Ang Hifil ng יצא ay nagpapahayag ng sanhi: si Moises ang nagpalabas sa bayan. Likas sa Tagalog ang “inilabas” at hindi nito dinaragdagan ang diwa ng paraan ng paggabay.'
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Ipinapahayag ng parirala ang pagkilos patungo sa isang pagtatagpo. Ang “salubungin” ay natural na Tagalog para sa paglabas upang makatagpo ang isang dumarating o nagpapakita.
- source_word: הָאֱלֹהִים
  choice: ang Diyos
  rationale: Tumutukoy ito sa Diyos sa tiyak na diwa. Ang “ang Diyos” ang natural at malinaw na anyo sa Tagalog.
- source_word: מִן הַמַּחֲנֶה
  choice: mula sa kampo
  rationale: Tinutukoy ng parirala ang pinanggalingan ng bayan. Kasama ng “inilabas,” malinaw na ipinahihiwatig ng “mula sa kampo” ang paglabas nila roon.
- source_word: וַיִּתְיַצְּבוּ
  choice: pumuwesto sila
  rationale: Ang Hitpael ay nagpapahiwatig ng sadyang pagtayo o paglalagay ng sarili sa isang lugar. Naipapahayag ng “pumuwesto sila” ang kusang pagkuha nila ng kinatatayuan.
- source_word: בְּתַחְתִּית
  choice: sa paanan ng
  rationale: Sa konteksto ng bundok, tumutukoy ito sa ibabang bahagi o base. Ang “sa paanan ng bundok” ang karaniwan at malinaw na idyomatikong katumbas sa Tagalog.
- source_word: הָהָר
  choice: bundok
  rationale: Sa konteksto ng Sinai, ang הַר ay isang bundok, at ang panandang “ng” sa pariralang “paanan ng bundok” ay angkop sa tiyak na bundok na tinutukoy sa konteksto.
theological_decisions:
- issue: Pagpapahayag sa הָאֱלֹהִים sa teopaniya sa Sinai
  choice: ang Diyos
  alternative: ang [tanging] Diyos
  rationale: Sapat na tiyak at natural ang “ang Diyos.” Hindi kailangang idagdag ang “tanging,” na magpapasok ng paliwanag na wala sa mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עָם at ang “pumuwesto” upang mapanatili ang sadyang pagkuha ng kinatatayuan nang hindi nagiging labis na pormal.
