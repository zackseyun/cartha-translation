id: EXO.19.1
reference: Exodus 19:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: tl
  text: Sa ikatlong buwan mula nang lumabas ang mga anak ni Israel[a] sa lupain ng Egipto, sa mismong araw na ito[b] ay dumating sila sa ilang ng Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak na lalaki ni Israel” ang Hebreo, ngunit nakaugaliang tawag ito sa buong sambayanan.
    reason: lexical_alternative
  - marker: b
    text: O “sa araw na ito.” Maaaring idiin ng parirala ang tiyak na araw ng kanilang pagdating.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: Sa ikatlong buwan
  rationale: Karaniwang tumutukoy ang חֹדֶשׁ sa isang buwan sa mga pormulang nagsasaad ng panahon. Likas at malinaw sa Filipino ang “sa ikatlong buwan.”
- source_word: לְצֵאת
  choice: mula nang lumabas
  rationale: Ang infinitive construct na may לְ ay nagtatakda ng panahong pinagbabatayan ng pagbilang. Ipinahahayag ng “mula nang lumabas” ang ugnayang temporal nang hindi ipinapalagay na tatlong buong buwan na ang lumipas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang kongkretong anyo ng Hebreo bilang nakaugaliang tawag sa sambayanang nagmula kay Israel; sa Filipino, maaari itong tumukoy sa buong bayan, hindi lamang sa mga lalaki.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Egipto
  rationale: Hayagang naroon ang אֶרֶץ, “lupain,” kaya pinananatili ang buong parirala sa natural na Filipino.
- source_word: בַּיּוֹם הַזֶּה
  choice: sa mismong araw na ito
  rationale: Hayagan ang demonstratibong “ito.” Ipinahihiwatig ng “mismo” ang diin ng parirala, habang itinatala sa talababa ang mas literal na alternatibo.
- source_word: בָּאוּ
  choice: dumating sila
  rationale: Maaaring mangahulugan ang בוא ng “pumunta,” “dumating,” o “pumasok.” Sa salaysay ng paglalakbay tungo sa isang pook, natural na ipinahahayag ng “dumating” ang konteksto.
- source_word: מִדְבַּר סִינָי
  choice: ilang ng Sinai
  rationale: Ang מִדְבָּר ay lupaing ilang o disyerto. Ang “ilang ng Sinai” ay maikli, marangal, at hindi labis na nagtatakda sa uri ng klima.
theological_decisions:
- issue: Paglilipat ng tawag na בְּנֵי יִשְׂרָאֵל sa bayang tipan
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang talinghagang pampamilya at ang anyo ng pinagmulang Hebreo. Gayunman, ang parirala ay tumutukoy sa buong sambayanan; hindi nito nilalayong ibukod ang mga babae.
translation_notes:
  register: Makabago at dignidad na Filipino ang ginamit. Pinanatili ang “mga anak ni Israel” upang maging malinaw ang anyo ng Hebreo, ngunit nilinaw sa talababa ang pambansang saklaw nito. Ang “ilang” ay mas angkop sa estilong biblikal kaysa “disyerto” at nananatiling madaling maunawaan.
