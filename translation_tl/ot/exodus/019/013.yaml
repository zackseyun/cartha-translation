base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: tl
  text: Walang kamay ang dapat humipo sa kanya[a], sapagkat tiyak na babatuhin siya o papanain[b]. Hayop man o tao, hindi siya dapat mabuhay. Kapag tumunog nang matagal ang tambuli na yari sa sungay ng lalaking tupa[c], saka sila maaaring umakyat sa bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Walang kamay ang dapat humipo rito,” kung mas pangkalahatan ang tinutukoy ng panghalip. Ang diwa ay hindi dapat direktang hipuin ang lumabag kundi patayin siya mula sa malayo.
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tutusukin” o “tatamaan ng palaso.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapana o pagtama ng palaso, malamang sa pamamagitan ng mga palaso sa kontekstong ito.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kapag hinabaan ang yobel.” Malamang na tumutukoy ito sa isang matagal na tunog ng tambuling yari sa sungay ng lalaking tupa.
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Huwag siyang hahawakan ng kamay
  rationale: Pinananatili ang di-personal na estilong legal at ang panlalaking isahang panghalip, na pinakamalamang na tumutukoy sa lumabag; ipinahihiwatig na hindi siya dapat direktang hipuin.
- source_word: סָקוֹל יִסָּקֵל
  choice: tiyak na babatuhin siya
  rationale: Ang infinitive absolute kasunod ng finite verb ay nagbibigay-diin sa katiyakan ng parusa; natural itong naipapahayag sa Tagalog sa pamamagitan ng “tiyak na.”
- source_word: יָרֹה יִיָּרֶה
  choice: papanain
  rationale: Sa konteksto ng pagpatay mula sa malayo, ang pandiwa ay malamang na tumutukoy sa pagpana; hindi inuulit ang “tiyak” dahil saklaw nito ang dalawang magkatambal na paraan ng pagpatay.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Maging hayop man o tao
  rationale: Natural at maikli nitong ipinapakita na pareho ang kaparusahan anuman sa dalawang kategorya.
- source_word: לֹא יִחְיֶה
  choice: hindi siya dapat mabuhay
  rationale: Ipinananatili ang mariing puwersang legal at ang isahang anyo, habang malinaw na inihahayag ang kinakailangang kahinatnan.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Kapag pinahaba na ang tunog ng tambuling sungay ng lalaking tupa
  rationale: Inilalahad ang literal na ideya ng “pagpapahaba” at kinikilala ang yobel bilang sungay ng lalaking tupa na ginagamit na tambuli.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: saka sila maaaring umakyat sa bundok
  rationale: Ang “maaaring” ay natural na naghahayag na sa hudyat na iyon ay inaalis na ang dating pagbabawal.
theological_decisions:
- issue: Tinutukoy ng panlalaking isahang hulapi sa “huwag siyang hahawakan”
  choice: Ang lumabag na humipo o tumawid sa hangganan ng bundok
  alternative: Anumang naging bawal dahil sa pagdikit, o ang bundok mismo bilang mas pangkalahatang tinutukoy
  rationale: Ang agarang konteksto ay tungkol sa tao o hayop na lumampas sa hangganan at papatayin nang hindi direktang hinahawakan. Gayunman, inilalagay sa talababa ang mas pangkalahatang posibilidad.
- issue: Puwersa ng יַעֲלוּ pagkatapos ng mahabang tunog
  choice: 'Pahintulot: “maaari silang umakyat”'
  alternative: 'Payak na hinaharap o utos: “aakyat sila”'
  rationale: Sa daloy ng konteksto, ang hudyat ay nagtatapos sa naunang pagbabawal; ang pahintulot ang pinakamalinaw na kahulugan sa modernong Tagalog nang hindi nagdaragdag ng sektaryong paliwanag.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang maigsi at mariing tono ng batas, ngunit ginawang natural ang mga idyomang Hebreo. Ginamit ang “tambuling sungay ng lalaking tupa” upang maging malinaw ang sinaunang instrumentong tinutukoy nang hindi ito napagkakamalang modernong trumpeta.
