  to: Walang kamay ang dapat humipo sa kanya[a], sapagkat tiyak na babatuhin siya o papanain[b]. Hayop man o tao, hindi siya dapat mabuhay. Kapag tumunog nang matagal ang tambuli na yari sa sungay ng lalaking tupa[c], saka sila maaaring umakyat sa bundok.
