  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Moises, “Bumaba ka at balaan ang mga tao, baka pilitin nilang lumusot patungo kay Yahweh upang tumingin[a], at marami sa kanila ang mabuwal.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang makita.” Ang pandiwang Hebreo ay maaaring mangahulugang “tumingin” o “makakita”; dito, tumutukoy ito sa pagtatangkang masdan ang pagpapakita ni Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at maraming mula sa kanila ang mabuwal.” Maaaring magpahiwatig ng kamatayan ang “mabuwal” sa kontekstong ito, ngunit hindi iyon mas tahasang sinasabi sa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: רֵד
  choice: Bumaba ka
  rationale: Likas na pautos sa modernong Tagalog at pinananatili ang direksiyon ng kilos.
- source_word: הָעֵד בָּעָם
  choice: balaan ang mga tao
  rationale: Ang Hifil ng עוד sa kontekstong ito ay tumutukoy sa pagbibigay ng mariing babala sa bayan.
- source_word: יֶהֶרְסוּ
  choice: pilitin nilang lumampas
  rationale: Ipinahihiwatig ng pandiwa ang sapilitang paglabag sa itinakdang hangganan; mas malinaw ito sa Tagalog kaysa sa literal na 'bumutas' o 'sumagasa.'
- source_word: אֶל יְהוָה
  choice: papunta kay Yahweh
  rationale: Pinananatili ang diwa ng pagkilos patungo sa presensiya ni Yahweh.
- source_word: לִרְאוֹת
  choice: upang tumingin
  rationale: Ipinapahayag ng pawatas ang layunin ng paglapit at pinananatili ang kongkretong diwa ng pagtatangkang tumingin.
- source_word: וְנָפַל
  choice: at ... mabuwal
  rationale: Pinananatili ang pangkalahatang pandiwang 'mahulog/mabuwal' sa Hebreo nang hindi tahasang ginagawang 'mamatay,' kahit maaaring kamatayan ang ipinahihiwatig ng konteksto.
- source_word: מִמֶּנּוּ רָב
  choice: marami sa kanila
  rationale: Natural na Tagalog para sa malaking bilang mula sa pangkat.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang ipinahayag sa Israel sa halip na palitan ito ng titulo.
- issue: Kung tahasang kamatayan ang ibig sabihin ng וְנָפַל
  choice: mabuwal
  alternative: mamatay
  rationale: Maaaring nagpapahiwatig ng kamatayan ang konteksto, ngunit hindi iyon mas tahasang sinabi ng pandiwang Hebreo; pinananatili ng salin ang pagkaigting at lawak ng orihinal.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “pilitin nilang lumampas” upang natural na maipahayag ang sapilitang paglabag sa hangganan, at “mabuwal” upang mapanatili ang sadyang di-tahasang bunga sa Hebreo. Ang mga talababa ay inilagay sa mismong mga salitang tinatalakay.
