base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: tl
  text: At ngayon, kung talagang makikinig kayo sa aking tinig at tutuparin ninyo ang aking tipan, magiging aking mahalagang pag-aari kayo mula sa gitna ng lahat ng mga bayan[a], sapagkat akin ang buong daigdig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aking natatanging pag-aari.” Ang “mula sa gitna ng lahat ng mga bayan” ay tumutukoy sa pagpili mula sa kanila; hindi nito itinatanggi na ang buong daigdig ay pag-aari ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay na ו at ang temporal na עַתָּה, na nag-uugnay sa pahayag sa naunang konteksto.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: talagang makikinig kayo sa aking tinig
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa pakikinig. Pinananatili ng 'makikinig ... sa aking tinig' ang konkretong wikang Hebreo, samantalang ipinahihiwatig ng konteksto ang masunuring pakikinig.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: at tutuparin ninyo ang aking tipan
  rationale: Sa konteksto ng tipan, ang שׁמר ay tumutukoy sa tapat na pag-iingat o pagsunod. Mas natural sa modernong Tagalog ang 'tuparin ang tipan' kaysa 'ingatan ang tipan.'
- source_word: וִהְיִיתֶם לִי סְגֻלָּה
  choice: magiging mahalagang pag-aari ko kayo
  rationale: Ang סְגֻלָּה ay isang natatangi at pinahahalagahang pag-aari. Inihahayag ng 'mahalagang pag-aari' kapwa ang halaga at pagmamay-ari nang hindi nagdaragdag ng ideyang wala sa teksto.
- source_word: מִכָּל הָעַמִּים
  choice: mula sa lahat ng mga bayan
  rationale: Ang מִן ay nauunawaan bilang pagpili mula sa kalipunan ng lahat ng bayan; iniiwasan nito ang di-kinakailangang pahiwatig na mas mataas sila kaysa sa iba.
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: sapagkat akin ang buong daigdig
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang הָאָרֶץ ay pandaigdigan dito dahil kaugnay ito ng lahat ng mga bayan.
theological_decisions:
- issue: Kung ang שׁמע ay isasaling 'makinig' o 'sumunod' sa konteksto ng tipan
  choice: makikinig kayo sa aking tinig
  alternative: susunod kayo sa akin
  rationale: Taglay ng idyomang Hebreo ang masunuring pakikinig, ngunit tahasang itinatampok nito ang pakikinig. Pinananatili ito sa salin, habang ipinakikita ng kasunod na 'tutuparin ninyo ang aking tipan' ang dimensiyon ng pagsunod.
- issue: Kung paano ilalarawan ang katayuan ng Israel bilang סְגֻלָּה nang hindi pinalalabis ang pagiging bukod-tangi
  choice: mahalagang pag-aari ko kayo mula sa lahat ng mga bayan
  alternative: natatangi kong pag-aari kayo, higit sa lahat ng mga bayan
  rationale: Pinananatili ng napiling salin ang natatanging kaugnayan sa tipan at kasabay nito ang pahayag na pag-aari ng Diyos ang buong daigdig; hindi nito ipinapasok ang ideya ng likas na kahigitan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'tinig' at 'tipan' upang mapanatili ang konkretong at teolohikal na bokabularyo ng Hebreo, habang ang ayos ng pangungusap ay ginawang natural sa Tagalog.
