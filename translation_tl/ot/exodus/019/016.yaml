  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: tl
  text: Pagsapit ng umaga sa ikatlong araw, kumulog[a] at kumidlat. Isang makapal na ulap ang nasa ibabaw ng bundok, at napakalakas ng tunog ng trumpeta[b][c]. Nanginig ang buong bayang nasa kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “may mga tinig” o “may mga tunog.” Malawak ang kahulugan ng salitang Hebreo, ngunit dahil katambal ito ng kidlat, malamang na kulog ang tinutukoy rito.
    reason: lexical_alternative
  - marker: b
    text: O “tunog ng shofar.” Ang shofar ay trumpeta na karaniwang yari sa sungay ng hayop.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “napakatindi” o “napakalakas.” Dito, inilalarawan nito ang tindi ng tunog ng trumpeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: Pagsapit ng umaga sa ikatlong araw
  rationale: Likas na temporal na panimula sa modernong Tagalog; ipinapahayag nito ang pagdating ng umaga at ang ikatlong araw nang hindi gumagamit ng mabigat na literalismong “at nangyari.”
- source_word: קֹלֹת וּבְרָקִים
  choice: kumulog at kumidlat
  rationale: Sa konteksto ng pagpapakita sa Sinai, ang קֹלֹת na katambal ng mga kidlat ay pinakamalamang na mga dagundong ng kulog. Ang mga pandiwang Tagalog ay natural at malinaw na naghahatid ng pangyayari.
- source_word: עָנָן כָּבֵד
  choice: isang makapal na ulap
  rationale: Bagaman literal na “mabigat” ang כָּבֵד, kapag inilalarawan ang ulap ay tumutukoy ito sa kapal o densidad; “makapal na ulap” ang likas na katumbas sa Tagalog.
- source_word: עַל הָהָר
  choice: nasa ibabaw ng bundok
  rationale: Pinananatili ang saklaw ng עַל bilang nasa ibabaw o nakapatong sa bundok, nang hindi tiyakang nilulutas kung dumadampi o nakalutang ang ulap.
- source_word: קֹל שֹׁפָר
  choice: tunog ng trumpeta
  rationale: Ipinapakita ng parirala ang naririnig na tunog. Ang “trumpeta” ay madaling maunawaan, samantalang nililinaw sa talababa ang mas tiyak na instrumentong shofar.
- source_word: חָזָק מְאֹד
  choice: napakalakas
  rationale: Ang חָזָק ay “malakas”; sa tunog, likas na tumutukoy ito sa matinding lakas o lakas ng dating, nang hindi kailangang gawing teknikal ang paglalarawan.
- source_word: וַיֶּחֱרַד כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: Nanginig ang buong bayang nasa kampo
  rationale: Ang “nanginig” ay sumasaklaw sa pisikal na panginginig at takot o pagkagimbal nang hindi dinaragdagan ang teksto. Ang “bayang nasa kampo” ay natural na kolektibong pagtukoy sa הָעָם.
theological_decisions:
- issue: Mga penomeno sa pagpapakita ng Diyos sa Sinai
  choice: Ilarawan ang mga pandamang penomeno nang hindi nagdaragdag ng interpretasyong teolohikal; isalin ang קֹלֹת bilang kulog ngunit itala ang saklaw nitong “mga tinig/mga tunog.”
  alternative: Isalin ang קֹלֹת bilang “mga tinig” upang ipahiwatig ang mga makalangit na tinig.
  rationale: Ang pagkakatambal nito sa kidlat ay malakas na sumusuporta sa “kulog,” ngunit tunay ang leksikal na kalabuan at kaya ay pinananatili sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Gumamit ng maiikling sugnay para sa malinaw na daloy, habang pinananatili ang maringal at nakapanghihilakbot na tagpo. Ang lahat ng marker ng talababa ay nasa pangunahing teksto at nakaayos ayon sa puntong tinutukoy.
