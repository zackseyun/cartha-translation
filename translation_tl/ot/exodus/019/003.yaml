id: EXO.19.3
reference: Exodus 19:3
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: tl
  text: 'Umakyat si Moises patungo sa Diyos, at tinawag siya ni Yahweh mula sa bundok: “Ganito ang sasabihin mo sa sambahayan ni Jacob at ipahahayag sa mga anak ni Israel:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ni Israel”; isa itong panlalaking pananalitang kolektibo na maaaring tumukoy sa mga anak o sa bayan ng Israel.
    reason: Pinananatili ang detalye ng panlalaking anyo sa Hebreo at nililinaw ang kolektibong saklaw nito.
lexical_decisions:
- source_word: עָלָה
  choice: umakyat
  rationale: Tuwirang ipinahahayag ang pataas na pagkilos at likas ito sa makabagong Filipino.
- source_word: הָאֱלֹהִים
  choice: sa Diyos
  rationale: Bagaman may pantukoy ang Hebreo, malinaw sa konteksto na tumutukoy ito sa Diyos ng Israel; ang “sa Diyos” ang likas na anyo sa Filipino.
- source_word: וַיִּקְרָא אֵלָיו
  choice: tinawag siya
  rationale: Ipinahahayag nito ang pagtawag ni Yahweh kay Moises; hindi na kailangang tumbasan nang hiwalay ang pang-ukol upang maging natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: מִן הָהָר
  choice: mula sa bundok
  rationale: Ang הַר ay tumutukoy sa bundok sa konteksto ng Sinai, at eksaktong naihahatid ng pariralang ito ang pinagmulan ng pagtawag.
- source_word: לֵאמֹר
  choice: tutuldok bago ang tuwirang pahayag
  rationale: Sa halip na ang di-likas na “na sinasabi,” ipinakikilala ng tutuldok ang mismong sinabi habang pinananatili ang tungkulin ng infinitive sa Hebreo.
- source_word: כֹּה תֹאמַר
  choice: Ganito ang sasabihin mo
  rationale: Pinananatili nito ang pormal na pormula at ang paraan ng paghahatid ng mensaheng iniutos.
- source_word: לְבֵית יַעֲקֹב
  choice: sa sambahayan ni Jacob
  rationale: Ang “sambahayan” ay nagpapanatili sa kolektibo at tipanang diwa ng “bahay ni Jacob” nang mas malinaw kaysa sa literal na gusaling bahay.
- source_word: וְתַגֵּיד
  choice: at ipahahayag
  rationale: Ipinakikita ng pandiwang ito ang pagpapabatid o pagdedeklara at pinananatili ang bahagyang pagkakaiba nito sa naunang “sasabihin.”
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel[a]
  rationale: Ang “mga anak ni Israel” ay likas na kolektibong tawag sa mga inapo o bayan ng Israel sa Filipino. Inilalagay sa talababa ang tahasang panlalaking anyo ng Hebreo upang hindi mawala ang detalye ng pinagmulan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Panlalaking kolektibo sa לִבְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel, na may talababa
  alternative: mga anak na lalaki ni Israel; bayan ng Israel
  rationale: Sa konteksto, kolektibong tumutukoy ang parirala sa Israel, hindi lamang sa mga lalaking anak. Natural sa Filipino ang “mga anak ni Israel,” habang nililinaw ng talababa na panlalaki ang literal na anyong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pormal na tono ng pahayag ng Diyos, ngunit iniwasan ang di-likas na literalismong gaya ng “na sinasabi.” Inilipat ang marker [a] sa pariralang aktuwal na tinatalakay ng talababa.
