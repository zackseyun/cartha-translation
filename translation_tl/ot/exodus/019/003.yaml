  source_fidelity: 'Tapat ang salin sa pangunahing mga elemento ng Hebreo: umakyat si Moises sa Diyos, tinawag siya ni Yahweh mula sa bundok, at iniutos ang mensahe para sa sambahayan ni Jacob at mga anak ni Israel. Ang “tinawag siya” ay likas na Filipino para sa וַיִּקְרָא אֵלָיו at sapat na naghahatid ng diwa sa konteksto.'
