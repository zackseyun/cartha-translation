  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: tl
  text: At maging handa sila para sa ikatlong araw, sapagkat sa ikatlong araw ay bababa si Yahweh sa Bundok Sinai, na makikita ng buong bayan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ נְכֹנִים
  choice: At maging handa sila
  rationale: Sa konteksto ng mga tagubilin, ang anyo ng הָיָה kasama ng נְכֹנִים ay may diwang pautos. Likas sa modernong Tagalog ang “maging handa” at pinananatili nito ang kalagayang hinihingi sa bayan.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: para sa ikatlong araw
  rationale: Ipinahihiwatig ng ל ang araw na pinagtutuunan ng paghahanda, hindi lamang ang huling takdang oras; kaya mas angkop ang “para sa” kaysa “pagsapit ng.”
- source_word: כִּי
  choice: sapagkat
  rationale: Nagbibigay ito ng dahilan sa naunang tagubilin. Ang “sapagkat” ay malinaw, marangal, at natural sa salaysay na biblikal.
- source_word: יֵרֵד
  choice: bababa
  rationale: Tuwirang ipinapahayag ng ירד ang pagbaba ni Yahweh at pinananatili ang larawan ng pagpapakita ng Diyos sa bundok.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: לְעֵינֵי כָל הָעָם
  choice: sa paningin ng buong bayan
  rationale: Pinananatili ng “sa paningin” ang diwa ng literal na “sa harap ng mga mata,” habang likas itong pakinggan sa Tagalog. Ang “buong bayan” ay tumutukoy sa lahat ng nagkakatipong Israelita bilang isang sambayanan.
- source_word: עַל הַר סִינָי
  choice: sa Bundok Sinai
  rationale: Sa ugnayan nito sa pandiwang “bababa,” itinuturo ng עַל ang bundok bilang lugar na bababaan ni Yahweh. Karaniwang gamit sa Tagalog ang “sa” para rito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON”; mas malapit din ito sa malawak na tinatanggap na anyong pang-agham kaysa “Jehovah.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang bahagyang pormal na “sapagkat” at ang payak na estruktura ng Hebreo nang hindi nagiging tunog-salin o lipas.
