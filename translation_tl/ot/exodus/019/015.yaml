  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang wayyiqtol na pagsasalaysay, ang utos na maging handa, ang yugto ng tatlong araw, at ang negatibong utos na may eupemistikong pananalita tungkol sa paglapit sa babae. Hindi nito ginagawang tahasan sa pangunahing teksto ang seksuwal na kahulugang ipinahihiwatig lamang ng orihinal.'
