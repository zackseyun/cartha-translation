  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: tl
  text: At sinabi niya sa bayan, “Maghanda kayo sa loob ng tatlong araw. Huwag kayong lumapit sa isang babae.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag kayong lumapit sa isang babae.” Sa kontekstong ito, isa itong eupemismong utos na umiwas muna sa pakikipagtalik habang naghahanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng tiyak na temporal na diwa.
- source_word: הָעָם
  choice: sa bayan
  rationale: Ang עָם ay tumutukoy sa sama-samang mamamayan ng Israel; natural at marangal sa Tagalog ang “bayan” sa kontekstong ito.
- source_word: הֱיוּ נְכֹנִים
  choice: Maghanda kayo
  rationale: Ipinahahayag ng parirala ang utos na maging handa para sa nalalapit na pagpapakita ng Diyos; mas natural sa modernong Tagalog ang pandiwang “maghanda.”
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: sa loob ng tatlong araw
  rationale: Pinananatili nito ang posibleng diwa ng yugto ng paghahanda nang hindi ginagawang “para sa ikatlong araw,” na mas tahasang pagbasa kaysa sa mismong anyo rito.
- source_word: אַל תִּגְּשׁוּ
  choice: Huwag kayong lumapit
  rationale: Tuwirang isinasalin ang negatibong utos at ang karaniwang kahulugan ng נגשׁ na lumapit o dumaop.
- source_word: אֶל אִשָּׁה
  choice: sa isang babae
  rationale: Pinananatili ang literal at eupemistikong pananalita ng Hebreo; nililinaw sa talababa ang kahulugan nito sa konteksto.
theological_decisions:
- issue: Kung tahasang sasabihin na ang pagbabawal ay tungkol sa pakikipagtalik habang naghahanda
  choice: Panatilihin sa pangunahing teksto ang eupemismong “Huwag kayong lumapit sa isang babae.”
  alternative: “Huwag kayong makipagtalik sa isang babae” o “Huwag kayong lumapit sa inyong mga asawa.”
  rationale: Eupemistiko ang orihinal at hindi gumagamit ng tahasang seksuwal na pandiwa. Ang pagpapanatili nito sa teksto, kasama ng malinaw na talababa, ay nag-iingat sa anyo at pahiwatig ng pinagmulan nang hindi ikinukubli ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong Israel at pinanatili ang eupemismo ng Hebreo, na ipinaliwanag sa talababa.
