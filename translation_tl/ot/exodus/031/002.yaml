  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: tl
  text: “Tingnan mo[a], tinawag ko sa pangalan si Bezalel, anak ni Uri, anak ni Hur, mula sa lipi ni Juda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Masdan mo, tinawag ko si Bezalel sa pangalan.” Ang Hebreong idyomang “tumawag sa pangalan” ay maaaring magpahiwatig ng partikular at personal na pagtukoy sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Pautos na anyo ng ראה na ginagamit upang ituon ang pansin ng kausap. Ang “Tingnan mo” ay tuwiran at natural sa makabagong Tagalog.
- source_word: קָרָאתִי
  choice: tinawag ko
  rationale: Ang Qal perfect na 1cs ng קרא, kasama ng בְּשֵׁם, ay tumutukoy sa pagtawag o tiyak na pagpili sa isang tao. Pinananatili ng “tinawag ko” ang tuwirang diwa nang hindi agad ipinapasok ang mas interpretatibong “hinirang” o “itinalaga.”
- source_word: בְּשֵׁם
  choice: sa pangalan
  rationale: Pinananatili nito ang Hebreong idyomang “tumawag sa pangalan,” na maaaring magpahiwatig ng personal at tiyak na pagpili.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Isinalin-titik ang personal na pangalan ayon sa karaniwang anyo sa Filipino.
- source_word: בֶּן
  choice: anak ni
  rationale: Sa pormulang pangangkan, karaniwang nangangahulugang “anak ni” ang בֶּן; ang pag-uulit nito ay pinananatili upang malinaw ang tuwirang angkan.
- source_word: אוּרִי
  choice: Uri
  rationale: Isinalin-titik ang personal na pangalan ayon sa karaniwang anyo.
- source_word: חוּר
  choice: Hur
  rationale: Isinalin-titik ang personal na pangalan ayon sa karaniwang anyo.
- source_word: לְמַטֵּה
  choice: mula sa lipi ni
  rationale: Sa kontekstong pangtribo at pangangkan, tumutukoy ang מַטֶּה sa isang lipi o tribo, at ipinahahayag dito ng לְ ang kaugnayan o kinabibilangan. Natural sa Tagalog ang “mula sa lipi ni.”
- source_word: יְהוּדָה
  choice: Juda
  rationale: Ginamit ang nakagawiang anyong Filipino ng pangalan ng patriyarka at lipi.
