translation:
  language: tl
  text: at ang langis na pampahid[a], at ang mabangong insenso para sa banal na lugar. Gagawin nila ang mga ito ayon sa lahat ng iniutos ko sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “langis ng pagpapahid”; maaari ring isalin ang kasunod na parirala na “insenso ng mga mababangong sangkap para sa banal na lugar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pambuhos
  rationale: Tumutukoy ito sa langis na ginagamit sa ritwal na pagbubuhos at pagtatalaga. Likas sa makabagong Tagalog ang “langis na pambuhos” at hindi nito idinaragdag ang salitang “banal,” na hindi tahasang nasa parirala.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: mabangong insenso
  rationale: Ang parirala ay tumutukoy sa insensong yari sa mababangong sangkap. Malinaw at natural sa Tagalog ang “mabangong insenso,” habang nasa talababa ang mas literal na anyo.
- source_word: לַקֹּדֶשׁ
  choice: para sa banal na dako
  rationale: Pinananatili nito ang lantad na diwa ng קֹדֶשׁ bilang banal na lugar o dako at ang layuning ipinahihiwatig ng לְ, nang hindi ito nililimitahan sa isang mas teknikal na katawagang wala sa mismong parirala.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: ayon sa iniutos ko sa iyo
  rationale: Ang “ayon sa” ay nagpapahayag ng pagsunod sa buong utos; ang “ang lahat” na layon ng pandiwa ay nagpapanatili sa komprehensibong puwersa ng כְּכֹל.
- source_word: יַעֲשׂוּ
  choice: Gagawin nila
  rationale: Pinananatili ang ikatlong panauhang maramihan na tumutukoy sa mga manggagawang binanggit sa konteksto. Ang karaniwang anyong panghinaharap sa Tagalog ay angkop sa ipinag-uutos na konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “banal na dako” upang panatilihin ang spatial na posibilidad ng לַקֹּדֶשׁ, at iniwasan ang mas denominasyonal na terminolohiya.
