  yaml_path: translation/ot/exodus/031/009.yaml
  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: tl
  text: at ang altar para sa handog na sinusunog, kasama ang lahat ng kagamitan nito, at ang palanggana kasama ang patungan nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: altar para sa handog na sinusunog
  rationale: Ang מִזְבַּח ay karaniwang tumutukoy sa altar, at ang kasunod na עֹלָה ang nagsasaad ng handog na lubusang sinusunog. Likas sa modernong Tagalog ang “para sa” upang ipakita ang gamit ng altar.
- source_word: כָּל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Saklaw ng כְּלִי ang iba't ibang kasangkapan o kagamitan ng altar; malinaw at natural ang “kagamitan” sa kontekstong ito.
- source_word: הַכִּיּוֹר
  choice: ang palanggana
  rationale: Tumutukoy ito sa sisidlang hugasan sa looban ng tabernakulo. Mas madaling maunawaan ng karaniwang mambabasa ang “palanggana” kaysa sa tradisyonal ngunit di-pamilyar na “laver.”
- source_word: כַּנּוֹ
  choice: patungan nito
  rationale: Ang כֵּן ay suportang kinapapatungan ng palanggana. Ang “patungan” ay natural at tiyak nang hindi ipinapalagay kung ito ay hiwalay na tuntungan o mismong base.
- source_word: וְאֶת
  choice: at / kasama ang
  rationale: Ang inuulit na וְאֶת ay nagdurugtong ng mga tuwirang layon sa talaan. Ginamit ang “at” at “kasama ang” ayon sa natural na daloy ng Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong talaan ng Hebreo, ngunit gumamit ng natural na mga pang-ugnay. Walang talababa dahil ang “patungan” ay sapat na kumakatawan sa diwa ng suportang tinutukoy ng כֵּן.
