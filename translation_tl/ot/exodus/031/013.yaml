id: EXO.31.13
reference: Exodus 31:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: tl
  text: 'At ikaw, sabihin mo sa mga Israelita: ‘Tiyak na iingatan ninyo ang aking mga Sabbath,[a] sapagkat ito ay tanda sa pagitan ko at ninyo sa lahat ng inyong salinlahi, upang malaman ninyo na ako si Yahweh, ang nagpapabanal sa inyo.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang “Tiyak na” bilang “Tanging” o “Gayunman.” Ang Hebreong אַךְ ay maaaring magpahiwatig ng paghihigpit o matinding pagdiriin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ikaw
  rationale: Pinananatili ang tahasang panghalip at ang pagbaling ng diskurso kay Moises, nang hindi dinaragdagan ang di-tiyak na antas ng paghahambing sa naunang utos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Sa modernong Filipino, ito ang likas at malinaw na katawagang panlahat para sa literal na ‘mga anak na lalaki ni Israel’; hindi nito ipinahihiwatig na mga lalaking indibidwal lamang ang saklaw.
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ipinahahayag ang matinding diin ng partikula sa kontekstong ito habang hindi lubusang ipinapasya kung ang puwersa nito ay restriktibong ‘lamang’ o adversatibong ‘gayunman’; inilalahad sa talababa ang mga alternatibo.
- source_word: שַׁבְּתֹתַי
  choice: aking mga Sabbath
  rationale: Pinananatili ang tahasang maramihan at ang pagkakaugnay nito kay Yahweh.
- source_word: תִּשְׁמֹרוּ
  choice: iingatan ninyo
  rationale: Ang ‘ingatan’ ay sumasaklaw sa ideya ng pag-iingat at pagtupad sa isang kautusang tipan; likas din ito sa marangal na wikang Filipino.
- source_word: אוֹת
  choice: tanda
  rationale: Karaniwang salitang Filipino para sa tanda o palatandaan, at angkop sa tungkulin ng Sabbath bilang tanda ng tipan.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahahayag ang pagpapatuloy ng tanda sa sunod-sunod na mga salinlahi.
- source_word: לָדַעַת
  choice: upang malaman ninyo
  rationale: Malinaw na inilalarawan ang layunin ng infinitibong may לְ nang hindi isinasara ang posibleng bahid ng resulta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng titulong ‘Panginoon.’
- source_word: מְקַדִּשְׁכֶם
  choice: ang nagpapabanal sa inyo
  rationale: 'Inilalarawan ang aktibong ginagampanan ni Yahweh: siya ang nagbubukod at gumagawang banal sa Israel.'
theological_decisions:
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang Hebreo ay gumagamit ng Tetragrammaton bilang personal na pangalan; ang transliterasyong ‘Yahweh’ ang tuwirang nagpapanatili nito.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel
  rationale: Bagaman literal na panlalaki ang idyoma, ginagamit ito rito bilang pangkalahatang katawagang pangtipan sa sambayanang Israel. Ang literal na Filipino ay maaaring maling magpahiwatig na mga lalaki lamang ang kausap.
- issue: Kahulugan ng מְקַדִּשְׁכֶם
  choice: ang nagpapabanal sa inyo
  alternative: ang gumagawa sa inyong banal / ang nagbubukod sa inyo
  rationale: Pinananatili ng ‘nagpapabanal’ ang teolohikal at leksikal na lawak ng ugat קדש, kabilang ang paggawa o pagbubukod bilang banal, nang pumili lamang ng isang aspekto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘mga Israelita’ bilang likas na katawagang panlahat, pinanatili ang maramihang ‘mga Sabbath,’ at iniwasan ang sobrang teknikal o denominasyonal na pananalita.
