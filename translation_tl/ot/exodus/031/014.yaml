  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: tl
  text: Ingatan ninyo ang Sabbath, sapagkat banal ito sa inyo. Ang sinumang lumapastangan dito ay tiyak na papatayin. Sapagkat ang sinumang gumawa ng trabaho sa Sabbath, ang taong iyon ay ihihiwalay mula sa gitna ng kanyang bayan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “puputulin mula sa gitna ng kanyang bayan,” isang legal na pormula na hindi tinutukoy rito ang eksaktong paraan ng paghatol.
    reason: Pinananatili ang Hebreong idyoma at ang tunay na kawalang-tiyak nito.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: iingatan ninyo
  rationale: Pinananatili ng “ingatan” ang diwang magbantay at tumupad sa isang banal na takda, gayundin ang lakas ng legal na utos.
- source_word: הַשַּׁבָּת
  choice: ang Sabbath
  rationale: Karaniwang katawagan ito sa institusyon at araw ng pamamahinga; mas tiyak kaysa sa pangkalahatang “araw ng pahinga.”
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: banal ito para sa inyo
  rationale: Ipinahahayag nito na ang Sabbath ay nakatalaga bilang banal kaugnay ng Israel, habang natural sa makabagong Tagalog.
- source_word: מְחַלְלֶיהָ
  choice: ang sinumang lumapastangan dito
  rationale: Ang pandiwang חלל sa piel ay nangangahulugang gawing di-banal o lapastanganin; malinaw at marangal ang “lumapastangan” sa kontekstong panrelihiyon.
- source_word: מוֹת יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ipinakikita ng infinitive absolute at pandiwang nasa passive causative ang tiyak at mariing parusang kamatayan, hindi lamang ang posibilidad na mamatay.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: ang sinumang gumawa rito ng trabaho
  rationale: Tuwirang inilalahad ang pangkalahatang pagbabawal sa paggawa sa Sabbath nang hindi idinaragdag ang “anumang,” na hindi tahasang nasa Hebreo.
- source_word: וְנִכְרְתָה
  choice: ay ihihiwalay
  rationale: Inililipat sa natural na Tagalog ang legal na idyomang “puputulin,” ngunit hindi tinutukoy ang paraan ng paghatol.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon
  rationale: Sa legal na konteksto, ang נֶפֶשׁ ay tumutukoy sa mismong tao, hindi partikular sa isang hiwalay na “kaluluwa.”
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: mula sa gitna ng kanyang bayan
  rationale: Malapit ito sa Hebreong idyoma at pinananatili ang ugnayan sa komunidad nang hindi ipinapalagay ang eksaktong mekanismo ng paghiwalay.
theological_decisions:
- issue: Kahulugan ng pormulang וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: “ihihiwalay mula sa gitna ng kanyang bayan,” na may talababa tungkol sa di-tiyak na paraan ng hatol
  alternative: “itatakwil sa pamayanan,” “papatayin ng Diyos,” o literal na “puputulin”
  rationale: Mabigat ang legal at tipanang pormula, ngunit hindi tinutukoy sa talata kung pagbitay, pagpapaalis, o hatol ng Diyos ang paraan. Pinananatili ng salin at talababa ang kawalang-tiyak na ito.
- issue: Paglilipat ng נֶפֶשׁ sa legal na konteksto
  choice: “tao”
  alternative: “kaluluwa” o “buhay”
  rationale: Ang tinutukoy ay ang nagkasalang indibidwal; maiiwasan ng “tao” ang pagpasok ng antropolohikal na doktrinang hindi ipinapahayag ng teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Sabbath” bilang pamilyar at tiyak na terminong biblikal. Ang “tiyak na papatayin” ay nagpapanatili sa diin ng Hebreo, samantalang ang “ihihiwalay” at talababa ay hindi nagpapasya nang lampas sa teksto kung paano isinasagawa ang ikalawang pormula ng parusa.
