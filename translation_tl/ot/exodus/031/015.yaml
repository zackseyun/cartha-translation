base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: tl
  text: Maaaring gawin ang trabaho sa loob ng anim na araw, ngunit ang ikapitong araw ay isang Sabat ng ganap na pamamahinga[a], banal para kay Yahweh. Ang sinumang gumawa ng trabaho sa araw ng Sabat ay tiyak na papatayin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang Sabat, isang ganap na pamamahinga.” Pinatitingkad ng pariralang Hebreo ang diwa ng ganap na paghinto o pamamahinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: Maaaring gawin ang trabaho
  rationale: Pinananatili nito ang balintiyak na anyo ng Hebreo at ang pahintulot na ipinahihiwatig ng kontekstong legal, nang hindi ito ginagawang payak na hula tungkol sa hinaharap.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ngunit ang ikapitong araw
  rationale: Maaaring mangahulugang “at” ang ו, ngunit malinaw na ipinakikita ng “ngunit” ang pagsalungat ng anim na araw ng paggawa at ng ikapitong araw ng pamamahinga.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: isang Sabat ng lubos na pamamahinga
  rationale: Pinananatili ng “Sabat” ang katawagan, samantalang ipinahahayag ng “lubos na pamamahinga” ang pinatinding diwa ng paghinto o pamamahinga sa tambalang Hebreo.
- source_word: קֹדֶשׁ לַיהוָה
  choice: banal para kay Yahweh
  rationale: Ipinahahayag nito kapwa ang banal na katangian ng araw at ang pagkakatalaga nito kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: Ang sinumang gumawa ng trabaho
  rationale: Likas na ipinahahayag ng “sinuman” ang pangkalahatan at legal na saklaw ng participial na parirala.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: sa araw ng Sabat
  rationale: Kasama ang “araw” upang katawanin ang tahasang יוֹם sa Hebreo.
- source_word: מוֹת יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ipinakikita ng “tiyak” ang diin ng infinitive absolute, at pinananatili ng “papatayin” ang balintiyak na legal na parusa ng Hophal.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit sa talata ang tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulong “Panginoon.”
- issue: Lakas ng katawagang שַׁבַּת שַׁבָּתוֹן
  choice: isang Sabat ng lubos na pamamahinga
  alternative: isang Sabat, isang taimtim na pamamahinga
  rationale: Pinananatili nito ang pinatinding diwa ng ganap na paghinto o pamamahinga nang hindi nagdaragdag ng mas huling doktrinal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyong “Sabat,” tuwirang pangalang “Yahweh,” at payak ngunit mariing wikang legal para sa parusang kamatayan.
