lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: mag-isip ng mga masining na disenyo
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa malikhaing pagpaplano sa konteksto ng bihasang paggawa. Likas sa modernong Filipino ang pariralang ito at napananatili nito ang pag-uulit ng ugat sa Hebreo sa diwa, bagaman hindi sa anyo.
- source_word: לַעֲשׂוֹת
  choice: gumawa
  rationale: Sa kasunod na talaan ng mga materyales, tumutukoy ito sa aktuwal na paglikha o paggawa ng mga bagay; malinaw at karaniwan ang “gumawa” sa Filipino.
- source_word: בַּזָּהָב וּבַכֶּסֶף
  choice: gamit ang ginto, pilak
  rationale: Ang pang-ukol na בְּ ay maaaring magpahiwatig ng materyales o kasangkapan. Mas natural sa Filipino ang “gamit ang” kaysa literal na “sa” para sa paggawa sa mga metal.
- source_word: וּבַנְּחֹשֶׁת
  choice: at tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze. Ang “tanso” ay karaniwang salin sa Filipino at maaari ring gamitin nang mas malawak para sa metal na ito o haluang metal nito sa sinaunang konteksto.
