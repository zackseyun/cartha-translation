  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: tl
  text: At ako—narito—ay itinalaga kong kasama niya si Oholiab na anak ni Ahisamac, mula sa lipi ni Dan. At sa puso ng bawat taong may pusong marunong[a] ay naglagay ako ng karunungan, upang magawa nila ang lahat ng iniutos ko sa iyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong “may pusong marunong” ay idyoma para sa mga pinagkalooban ng karunungan at kasanayan.
    reason: cultural_note
  - marker: b
    text: 'Maaari ring isalin: “at gagawin nila ang lahat ng iniutos ko sa iyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: At ako naman—narito—
  rationale: Pinananatili ang diin ng hiwalay na panghalip na אֲנִי at ang pantawag-pansing הִנֵּה. Ang mga gitling ay nagbibigay ng marangal ngunit malinaw na diin sa makabagong Tagalog.
- source_word: נָתַתִּי אִתּוֹ
  choice: itinalaga kong kasama niya
  rationale: Bagaman literal na ‘ibinigay’ o ‘inilagay’ ang נָתַתִּי, sa konteksto ng pagtatalaga sa gawain ay likas ang ‘itinalaga.’ Tahasang pinananatili ng ‘kasama niya’ ang אִתּוֹ at ang ugnayan kay Bezalel.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: si Oholiab na anak ni Ahisamac
  rationale: Isinasalin ang pormulang pangangkan at tinutumbasan sa baybay na madaling basahin sa Filipino ang mga pangalang Hebreo.
- source_word: לְמַטֵּה דָן
  choice: mula sa lipi ni Dan
  rationale: Ang מַטֶּה rito ay tumutukoy sa tribo o liping kinabibilangan; natural sa Tagalog ang ‘mula sa lipi ni Dan.’
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: At sa puso ng bawat may pusong marunong
  rationale: Pinananatili ang pag-uulit ng ‘puso’ at ang Hebreong pananaw na ang puso ang luklukan ng pag-unawa at praktikal na kakayahan, habang nililinaw sa talababa ang idyoma.
- source_word: נָתַתִּי חָכְמָה
  choice: ay naglagay ako ng karunungan
  rationale: Pinananatili ang konkretong larawan ng paglalagay ng karunungan sa puso. Sa kontekstong ito, saklaw ng ‘karunungan’ ang kasanayan sa paggawa ngunit hindi nililimitahan dito ang kahulugan.
- source_word: וְעָשׂוּ
  choice: upang magawa nila
  rationale: Ipinapahayag ang likas na layunin o bunga ng pagbibigay ng karunungan, nang hindi ikinakaila ang posibleng tuwirang pagbasa na ‘at gagawin nila.’
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: ang lahat ng iniutos ko sa iyo
  rationale: Tuwirang ipinapahayag ang kabuuan ng iniutos ng Diyos kay Moises at natural ang aspektong pangnagdaan sa Tagalog.
theological_decisions:
- issue: Ang kahulugan ng חֲכַם־לֵב sa konteksto ng paggawa ng tabernakulo
  choice: may pusong marunong / karunungan
  alternative: mga bihasa / kasanayan
  rationale: Kabilang sa kahulugan ang praktikal na kahusayan ng mga manggagawa, ngunit pinananatili ng salin ang ‘puso’ at ‘karunungan’ upang huwag paliitin ang Hebreong konsepto ng kaloob ng Diyos tungo lamang sa teknikal na kasanayan.
- issue: Ang puwersa ng וְעָשׂוּ kasunod ng pagbibigay ng karunungan
  choice: upang magawa nila
  alternative: at gagawin nila
  rationale: Maaaring ipahiwatig ng sugnay ang layunin o bunga ng pagkakaloob ng karunungan, ngunit maaari rin itong basahin bilang kasunod na pahayag. Inilalagay sa pangunahing teksto ang purposibong pagbasa at itinatala ang alternatibo upang mapanatili ang tunay na kalabuan.
translation_notes:
  register: Makabago at marangal na Filipino, na may bahagyang pormal na ayos upang mapanatili ang diin at pag-uulit ng Hebreo. Ginamit ang ‘lipi’ sa halip na mas teknikal na ‘tribo,’ at iniwasan ang bokabularyong nakatali sa isang denominasyon.
