    issue: Ang “ako naman” ay may di-kinakailangang pahiwatig ng pagkokontrast.
    rationale: Ang וַאֲנִי ay emphatic na “at ako,” hindi kinakailangang “ako naman.”
  - severity: medium
    issue: Hindi gaanong likas ang “bawat may pusong marunong.”
    rationale: Kulang ito sa pangngalang pantukoy sa tao at tunog pilit sa modernong Filipino. Ang “bawat taong may pusong marunong” ay natural habang pinananatili ang idyoma at pag-uulit ng Hebreo.
