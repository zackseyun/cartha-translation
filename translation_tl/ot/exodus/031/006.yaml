revisions:
- from: At ako naman—narito—itinalaga kong kasama niya si Oholiab na anak ni Ahisamac, mula sa lipi ni Dan. At sa puso ng bawat may pusong marunong[a] ay naglagay ako ng karunungan, upang magawa nila ang lahat ng iniutos ko sa iyo.[b]
  to: At ako—narito—ay itinalaga kong kasama niya si Oholiab na anak ni Ahisamac, mula sa lipi ni Dan. At sa puso ng bawat taong may pusong marunong[a] ay naglagay ako ng karunungan, upang magawa nila ang lahat ng iniutos ko sa iyo.[b]
  rationale: Inalis ang “naman,” na nagdaragdag ng kontrast na wala sa pinagmulan, at pinalitan ang hindi likas na konstruksiyong “bawat may pusong marunong” ng “bawat taong may pusong marunong.” Pinanatili ang emphatic na “ako,” ang pantawag-pansing “narito,” ang Hebreong idyoma ng pusong marunong, at ang maingat na pangunahing purposibong pagbasa na may alternatibo sa talababa.
