  naturalness: Bahagyang mabigat sa modernong Tagalog ang ayos na “Nang matapos ang Diyos na makipag-usap.” Mas natural at malinaw ang “Nang matapos makipag-usap ang Diyos,” nang walang pagbabago sa aspekto o kahulugan.
