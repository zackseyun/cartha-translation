  text: וַ/יִּתֵּ֣ן אֶל מֹשֶׁ֗ה כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֤ר אִתּ/וֹ֙ בְּ/הַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָ/עֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּ/אֶצְבַּ֥ע אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: tl
  text: Nang matapos makipag-usap ang Diyos kay Moises sa Bundok Sinai, ibinigay niya kay Moises ang dalawang tapyas ng Patotoo—mga tapyas na bato na sinulatan ng daliri ng Diyos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “sa pamamagitan ng daliri ng Diyos.” Matingkad na iniuugnay ng pananalitang Hebreo ang pagkakasulat nang tuwiran sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ibinigay niya
  rationale: Ang wayyiqtol ng נתן ay nagsasaad ng kasunod na pangyayari sa salaysay. Likas sa modernong Tagalog ang payak na nagdaang anyo nang hindi na kailangang simulan sa “at.”
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Nang matapos ... na makipag-usap
  rationale: Ang כ kasama ng infinitive construct ng כלה ay nagmamarka ng panahong natapos ang kilos; malinaw at natural itong naihahayag ng “nang matapos.”
- source_word: אִתּוֹ
  choice: kay Moises
  rationale: Sa konteksto, si Moises ang tinutukoy ng hulaping panghalip. Ginamit ang pangalan sa halip na “sa kanya” upang maiwasan ang malabong reperensiya sa Tagalog.
- source_word: בְּהַר סִינַי
  choice: sa Bundok Sinai
  rationale: Ito ang natural na paraan sa Tagalog upang tukuyin ang lokasyon ng pag-uusap sa Sinai.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: ang dalawang tapyas ng Patotoo
  rationale: Ang “tapyas” ay angkop sa mga lapad na pirasong batong sinusulatan. Pinananatili ng “Patotoo” ang covenantal na diwa ng עֵדוּת nang hindi ito pinapakahulugang tuwiran bilang “kautusan” o “kasulatan ng tipan.”
- source_word: לֻחֹת אֶבֶן
  choice: mga tapyas na bato
  rationale: Malinaw nitong ipinapahayag ang materyal ng mga tapyas at pinananatili ang appositional na pag-uulit ng Hebreo.
- source_word: כְּתֻבִים
  choice: sinulatan
  rationale: Ang passive participle ng כתב ay tumutukoy sa mga tapyas bilang may nakasulat. Ang “sinulatan” ay mas natural sa Tagalog para sa isang ibabaw na pinagsulatan.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: ng daliri ng Diyos
  rationale: Pinananatili nito ang kongkreto at masidhing larawang antropomorpiko ng Hebreo at ipinapakita ang tuwirang pagkilos ng Diyos.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Dito, ang אֱלֹהִים ay tumutukoy sa Diyos ng Israel at isahan ang kahulugan.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa banal na pagkakasulat
  choice: sinulatan ng daliri ng Diyos
  alternative: tuwirang isinulat ng Diyos / isinulat sa pamamagitan ng kapangyarihan ng Diyos
  rationale: Hindi inalis o ipinaliwanag palayo ang larawang “daliri ng Diyos.” Pinananatili nito ang diin ng teksto sa tuwirang banal na pagkilos nang hindi nagdaragdag ng paliwanag na teolohikal.
- issue: Pagkilala sa simuno ng unang sugnay
  choice: ang Diyos
  alternative: siya
  rationale: Panghalip lamang ang nasa Hebreo, ngunit malinaw sa konteksto na Diyos ang nagsasalita at nagbibigay ng mga tapyas. Ang tahasang pangalan ay kailangan sa Tagalog upang hindi mapagkamalang si Moises ang nakipag-usap at pagkatapos ay nagbigay sa sarili niya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tapyas” para sa stone tablets at pinalaking titik ang “Patotoo” bilang katawagan sa covenantal na patotoong taglay ng mga ito. Inilagay ang talababa sa mismong pariralang “daliri ng Diyos,” na siyang tinatalakay nito.
