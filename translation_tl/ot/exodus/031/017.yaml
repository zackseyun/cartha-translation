  source_fidelity: 'Tumpak ang pangunahing daloy ng salin: ang tanda ay nasa pagitan ni Yahweh at ng mga anak ni Israel nang magpakailanman, at ang dahilan ay ang paggawa sa loob ng anim na araw at paghinto sa ikapitong araw. Gayunman, ang וַיִּנָּפַשׁ ay Niphal at mas tuwirang nangangahulugang “naginhawahan” o “napanariwa,” hindi simpleng “nakahinga.”'
  naturalness: Malinaw, makabago, at marangal ang Tagalog. Ang “nakahinga” ay maaaring mangahulugang nakayang huminga o huminga lamang, kaya hindi nito lubos na naihahatid ang resulta/damdaming ipinahihiwatig ng pandiwang Hebreo. “Naginhawahan” ang mas natural at tumpak sa kontekstong ito.
  terminology: Ang “tanda,” “mga anak ni Israel,” “magpakailanman,” “Yahweh,” at “tumigil siya” ay angkop. Ang “mga Israelita” bilang alternatibo sa talababa ay kapaki-pakinabang at hindi binabago ang pangunahing pampamilyang pahayag.
