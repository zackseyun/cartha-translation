base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: tl
  text: Ito ay tanda sa pagitan ko at ng mga anak ni Israel[a] magpakailanman, sapagkat sa loob ng anim na araw ay ginawa ni Yahweh ang langit at ang lupa, at sa ikapitong araw ay tumigil siya[b] at naginhawahan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: O “nagpahinga siya”; ang pangunahing diwa ng pandiwang Hebreo ay “tumigil.”
    reason: lexical_alternative
  - marker: c
    text: O “nanariwa”; gumagamit ang Hebreo ng matingkad na makataong pananalita na kaugnay ng paghinga o pagbawi ng sigla.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: sa pagitan ko at ng
  rationale: Likas na katumbas sa Tagalog ng Hebreong magkaugnay na mga pang-ukol na tumutukoy sa dalawang panig.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang tahasang pampamilyang larawan ng Hebreo; ang mas idyomatikong “mga Israelita” ay inilagay bilang alternatibo sa talababa.
- source_word: אוֹת
  choice: tanda
  rationale: Karaniwang salitang Tagalog para sa isang palatandaan o sagisag ng tipanang ugnayan.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Tuwirang ipinapahayag ang pangmatagalang bisa ng tanda nang hindi idinaragdag ang pananalitang wala sa talata.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan o batayan ng naunang pahayag.
- source_word: שֵׁשֶׁת יָמִים
  choice: sa loob ng anim na araw
  rationale: Natural sa makabagong Tagalog at malinaw na inilalahad ang panahong saklaw ng paggawa.
- source_word: עָשָׂה
  choice: ginawa
  rationale: Pinakapayak at angkop na pandiwa para sa malikhaing pagkilos ng Diyos sa kontekstong ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa paraang kinikilala sa makabagong salin.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: ang langit at ang lupa
  rationale: Karaniwan at likas na pariralang Tagalog para sa Hebreong merismo na tumutukoy sa buong nilikha.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: at sa ikapitong araw
  rationale: Pinananatili ang payak na pagkakasunod at walang idinadagdag na diwang pasalungat.
- source_word: שָׁבַת
  choice: tumigil siya
  rationale: Inihahayag ang pangunahing diwa ng pandiwa na paghinto o pagtigil, sa halip na agad itong pakahulugang pamamahinga.
- source_word: וַיִּנָּפַשׁ
  choice: nakahinga
  rationale: Pinananatili ang matingkad at makataong larawan ng Hebreo. Natural ito sa Tagalog ngunit hindi tahasang ipinapaliwanag o pinapahina ang teolohikal na tensiyon.
theological_decisions:
- issue: Makataong paglalarawan sa Diyos sa wika ng Sabbath
  choice: tumigil siya at nakahinga
  alternative: nagpahinga siya at naginhawahan
  rationale: Pinananatili ng salin ang tahasang larawan ng paghinto at paghinga nang hindi ito ginagawang abstraktong pahayag o ipinapahiwatig na tiyak na napagod ang Diyos.
- issue: Pagsasalin ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pampamilyang anyo ng Hebreo, habang ibinibigay sa talababa ang karaniwang katawagan sa pangkat.
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang personal na pangalan sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pampamilyang katawagang “mga anak ni Israel,” ang banal na pangalang “Yahweh,” at ang antropomorpikong lakas ng huling dalawang pandiwa. Ang “nakahinga” ay sadyang hindi pinalambot upang mapanatili ang tunay na larawan at tensiyon ng tekstong Hebreo.
