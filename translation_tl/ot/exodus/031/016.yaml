  text: וְ/שָׁמְר֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת הַ/שַּׁבָּ֑ת לַ/עֲשׂ֧וֹת אֶת הַ/שַּׁבָּ֛ת לְ/דֹרֹתָ֖/ם בְּרִ֥ית עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: tl
  text: At iingatan ng mga anak ni Israel[a] ang Sabbath at ipangingilin[b] nila ang Sabbath sa sali’t salinlahi bilang isang tipang walang hanggan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Literal na “mga anak na lalaki ni Israel,” isang kolektibong katawagan sa bayan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: Literal na “gawin ang Sabbath”; ibig sabihin, ipangilin o tuparin ito.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tipang panghabang-panahon” o “tipang magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: Kaya iingatan
  rationale: Ang שׁמר ay nangangahulugang ingatan o tuparin. Pinananatili ng “iingatan” ang puwersang pangtipan, at ipinahihiwatig ng “Kaya” ang ugnayan ng pangungusap sa naunang pahayag.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit ito sa literal na “mga anak na lalaki ni Israel,” ngunit sa Filipino, ang “mga anak ni Israel” ay natural na kolektibong katawagan sa bayang nagmula kay Israel nang hindi nililimitahan ang tinutukoy sa mga lalaking anak lamang.
- source_word: הַשַּׁבָּת
  choice: ang Sabbath
  rationale: Pinananatili ang kinikilalang pangalan ng institusyong pangtipan at hindi lamang ang pangkalahatang ideya ng pagpapahinga.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: ipangingilin nila ang Sabbath
  rationale: Literal itong “gawin ang Sabbath,” isang idyomang Hebreo. Ang “ipangingilin” ay natural na Filipino para sa pagsasagawa o pagtupad sa banal na araw at pinananatili ang pag-uulit ng “Sabbath” sa Hebreo.
- source_word: לְדֹרֹתָם
  choice: sa sali’t salinlahi
  rationale: Malinaw at natural nitong ipinapahayag ang pagpapatuloy sa magkakasunod na henerasyon.
- source_word: בְּרִית עוֹלָם
  choice: bilang isang tipang walang hanggan
  rationale: Ang “tipan” ay tumpak para sa בְּרִית, at ang “walang hanggan” ay nagpapanatili sa malawak na duratibong puwersa ng עוֹלָם. Ang “bilang” ay nagpapahayag sa ugnayang panaguri ng huling parirala.
theological_decisions:
- issue: Kolektibong katawagan na בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak na lalaki ni Israel
  rationale: Pinananatili ang pamilyal na larawan ng Hebreo. Hindi ginamit ang “mga anak na lalaki” sapagkat ang parirala ay kolektibong tumutukoy sa bayang Israel, samantalang ang “mga anak ni Israel” ay malapit sa anyo at likas sa Filipino.
- issue: Saklaw ng tagal sa בְּרִית עוֹלָם
  choice: tipang walang hanggan
  alternative: tipang panghabang-panahon; tipang magpakailanman
  rationale: Pinananatili nito ang matibay at pangmatagalang wika ng talata nang hindi ipinapaliwanag sa mismong teksto kung paano ito iuugnay sa mga susunod na yugto ng kasaysayan ng tipan.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “Sabbath” ay pinanatili bilang pangalan ng institusyong tinutukoy, samantalang ang “ipangingilin” ay nagbibigay ng malinaw na relihiyoso at pangtipang diwa nang maging di-natural ang literal na “gawin ang Sabbath.”
