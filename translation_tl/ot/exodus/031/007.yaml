  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: tl
  text: ang tolda ng pakikipagtagpo, ang kaban ng Patotoo,[a] ang luklukan ng awa na nasa ibabaw nito,[b] at ang lahat ng kagamitan ng tolda—
  philosophy: optimal-equivalence
  footnotes:
