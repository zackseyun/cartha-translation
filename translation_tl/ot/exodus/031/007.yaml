  source_fidelity: Tumpak ang saklaw ng talaan at ang pagtukoy ng “nito” sa kaban. Gayunman, sa pangalang pangkultong הָאָרֹן לָעֵדֻת, ang likas at mas matatag na Tagalog na ugnayan ay “kaban ng Patotoo,” hindi “kaban para sa Patotoo.” Ang ל sa ganitong konstruksiyon ay maaaring magpahiwatig ng kaugnayan, ngunit hindi kailangang isalin bilang layunin sa pangunahing teksto.
  naturalness: Malinaw at marangal ang karamihan ng salin. Mas natural at mas angkop sa katawagang pangkasulatan ang “kaban ng Patotoo.” Ang “luklukan ng awa” ay kinikilalang katawagan at maayos na sinusundan ng “na nasa ibabaw nito.”
  terminology: Pinananatili ang “tolda ng pakikipagtagpo” para sa אֹהֶל מוֹעֵד at “luklukan ng awa” para sa כַּפֹּרֶת. Inayos ang pangunahing katawagan ng kaban; pinanatili sa talababa ang posibilidad na “para sa Patotoo.” Ang “takip na pantubos” ay mas malinaw na alternatibo kaysa “takip ng pagtubos,” na maaaring magpahiwatig ng redemption sa halip na atonement.
  issues:
