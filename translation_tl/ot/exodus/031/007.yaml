    text: O “kaban para sa Patotoo.”
    reason: lexical_alternative
  - marker: b
    text: O “takip na pantubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  rationale: Likas at malinaw na salin ng pariralang tumutukoy sa toldang itinakdang lugar ng pakikipagtagpo ng Diyos sa Israel; hindi nito ipinapasok ang salitang “tipan,” na wala rito.
- source_word: הָאָרֹן לָעֵדֻת
  choice: kaban para sa Patotoo
  rationale: Pinananatili ng “para sa” ang ugnayan o layuning ipinahihiwatig ng ל, samantalang ang “Patotoo” ay tumutukoy sa banal na patotoong inilalagay sa kaban nang hindi ito tahasang pinapalitan ng “Tipan.”
- source_word: הַכַּפֹּרֶת
  choice: luklukan ng awa
  rationale: Ito ang nakikilalang katawagan sa sagradong takip na nasa ibabaw ng kaban at pinananatili ang kaugnayan nito sa awa at pagtubos. Inilalagay sa talababa ang mas literal at malinaw sa anyong alternatibo.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa ibabaw nito
  rationale: Tuwirang inilalarawan ang lokasyon ng כַּפֹּרֶת kaugnay ng kaban; ang panlalaking hulapi ay tumutukoy pabalik sa kaban.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: lahat ng kagamitan ng tolda
  rationale: Saklaw ng “kagamitan” ang sari-saring kasangkapan at sagradong bagay sa tolda nang hindi nililimitahan ang kahulugan sa mga sisidlan lamang.
theological_decisions:
- issue: Pagpapakahulugan sa כַּפֹּרֶת sa konteksto ng santuwaryo
  choice: luklukan ng awa
  alternative: takip ng pagtubos
  rationale: Ang termino ay tumutukoy sa gintong takip ng kaban at may kaugnayan sa ritwal ng pagtubos. Pinananatili sa pangunahing teksto ang kinikilalang katawagang “luklukan ng awa,” habang inilalahad sa talababa ang mas lantad na katawagang nakatuon sa anyo at tungkulin nito.
- issue: Ugnayan ng kaban at עֵדֻת
  choice: kaban para sa Patotoo
  alternative: Kaban ng Patotoo
  rationale: Ang ל ay maaaring magpahiwatig ng layunin o kaugnayan. Pinili ang “para sa” upang mapanatili ang anyo ng Hebreo, ngunit hindi itinatanggi ang tradisyonal at likas na pagbasa na “ng Patotoo.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang anyong talaan ng talata at ang pangwakas na gitling dahil nagpapatuloy ang pangungusap. Ginamit ang malaking titik sa “Patotoo” bilang katawagan sa banal na patotoong kaugnay ng kaban, hindi bilang pagdaragdag ng salitang “Tipan.”
