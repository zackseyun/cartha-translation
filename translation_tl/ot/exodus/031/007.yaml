    rationale: Bagaman maaaring ipahiwatig ng ל ang layunin o kaugnayan, ang konstruksyon ay isang nakapirming katawagan para sa kaban na kaugnay ng Patotoo. Ang “kaban ng Patotoo” ay mas natural sa modernong Tagalog at hindi nagdaragdag ng “Tipan.”
  - severity: low
    issue: Ang alternatibong “takip ng pagtubos” ay maaaring hindi tiyak ang kahulugang pangkultong pagbabayad-sala.
    rationale: Ang “pagtubos” sa modernong Tagalog ay madalas tumutukoy sa redemption. Ang “takip na pantubos” ay mas tuwirang naglalarawan sa alternatibong “atonement cover” nang hindi nagpapataw ng doktrinal na paliwanag.
