base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/008.yaml
  text: and the table with its utensils[a], and the pure lampstand with all its utensils, and the altar of incense[c][b],
translation:
  language: tl
  text: ang mesa at ang mga kagamitan nito, ang dalisay na patungan ng mga ilawan[a] at ang lahat ng kagamitan nito, at ang altar ng insenso[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong salita para sa “patungan ng mga ilawan” ay maaari ring tumbasan ng “menora.” Ang “dalisay” ay maaaring tumukoy sa ritwal na kalinisan at, sa konteksto ng tabernakulo, maaari ring umalingawngaw sa pagkakagawa nito sa dalisay na ginto, gaya ng inilalarawan sa mga kaugnay na talata.
    reason: lexical_alternative; cultural_note
  - marker: b
    text: O “altar para sa insenso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Tuwirang nangangahulugang “mesa.” Hindi na idinagdag ang mas buong katawagang tumutukoy sa tinapay ng Presensya dahil wala iyon sa mismong talata.
- source_word: כֵּלָיו
  choice: ang mga kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי—mga sisidlan, kasangkapan, o gamit. Ang “mga kagamitan” ay natural at sapat na malawak para sa mga gamit na kaugnay ng mesa.
- source_word: הַמְּנֹרָה
  choice: ang patungan ng ilawan
  rationale: Karaniwang pangngalan ito para sa sanctuary lampstand. Isinalin ang kahulugan sa halip na tumbasan lamang ng transliterasyong “menora.”
- source_word: הַטְּהֹרָה
  choice: dalisay
  rationale: Maaaring mangahulugang malinis o dalisay. Sa konteksto ng tabernakulo, ang “dalisay” ay angkop at maaari ring umalingawngaw sa pagkakagawa nito sa dalisay na ginto.
- source_word: כָּל כֵּלֶיהָ
  choice: ang lahat ng kagamitan nito
  rationale: Pinananatili ng “lahat” ang kabuuang saklaw ng כָּל, samantalang ang “mga kagamitan” ay natural na tumutukoy sa mga kasangkapang kasama ng patungan ng ilawan.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ang altar ng insenso
  rationale: Tapat at natural na salin ng construct chain na “altar of incense”; pinananatili rin nito ang pormal na tono ng konteksto ng santuwaryo.
- source_word: וְאֶת
  choice: at
  rationale: Hindi hiwalay na isinasalin ang pananda ng tiyak na layon na אֵת; ang וְ ay isinasalin bilang “at” upang mapanatili ang ayos ng talaan.
theological_decisions:
- issue: Saklaw ng kahulugang הַטְּהֹרָה
  choice: dalisay
  alternative: malinis
  rationale: Hindi nilulutas nang labis kung ritwal na kalinisan lamang o pati materyal na dalisay na ginto ang tinutukoy; inilalagay sa talababa ang posibleng pag-alingawngaw ng dalawang diwa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “patungan ng ilawan” bilang malinaw na salin ng karaniwang pangngalang מְנוֹרָה, at “mga kagamitan” bilang likas at malawak na katumbas ng כְּלִי. Pinanatili ang anyong parirala at pangwakas na kuwit dahil bahagi ang talata ng nagpapatuloy na talaan.
