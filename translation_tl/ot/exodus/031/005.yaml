  text: sa pagtabas ng bato para sa pagkakabit[a], at sa paglilok ng kahoy, upang maisagawa ang bawat uri ng gawain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa bihasang paggawa ng bato para sa pagkakabit,” o “sa pag-ukit ng bato para sa pagkakabit.”
    reason: lexical_alternative
  - marker: b
    text: Pangkalahatan ang “bato” rito; ayon sa konteksto, maaaring kabilang dito ang mga mamahaling batong ginamit sa paggawa ng tabernakulo.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: sa pag-ukit / sa paglilok
  rationale: Ang pangngalan ay tumutukoy sa bihasang paggawa. Ginamit ang “pag-ukit” para sa bato at “paglilok” para sa kahoy upang maging natural sa Filipino at malinaw ang gawaing angkop sa bawat materyal.
- source_word: אֶבֶן
  choice: bato
  rationale: Ito ang pangkalahatang salita para sa bato. Bagaman maaaring kabilang dito ang mahahalagang bato ayon sa konteksto ng tabernakulo, hindi iyon tahasang tinutukoy ng talata.
- source_word: לְמַלֹּאת
  choice: para ikabit
  rationale: Sa konteksto ng paggawa, tumutukoy ito sa paghahanda ng bato upang mailagay o maikabit sa lalagyan o hantungan nito. Mas natural ang “para ikabit” kaysa sa literal na “para punuin.”
- source_word: עֵץ
  choice: kahoy
  rationale: Karaniwan at natural na katumbas ito ng salitang Hebreo para sa materyal na kahoy.
- source_word: לַעֲשׂוֹת
  choice: upang gawin
  rationale: Pinananatili nito ang malawak na kahulugan ng pandiwang Hebreo at maayos itong kaugnay ng “lahat ng uri ng gawain.”
- source_word: בְּכָל מְלָאכָה
  choice: ang lahat ng uri ng gawain
  rationale: Ipinapahayag nito ang kabuuan at lawak ng bihasang gawa nang hindi nililimitahan ang kahulugan sa iisang uri ng sining o hanapbuhay.
