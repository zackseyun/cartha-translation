  yaml_path: translation/ot/exodus/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh kay Moises at sinabi:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “Pagkatapos, nagsalita” at napapanatili nito ang pagkakasunod-sunod ng mga pangyayari; mas tiyak din ang “nagsalita” kaysa sa payak na “sinabi” para sa דבּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Tinutukoy ng pang-ukol ang taong kinakausap; ang “kay Moises” ang natural at tuwirang anyo sa Tagalog.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalang ito sa Filipino.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Ipinakikilala ng infinitive na ito ang nilalaman ng susunod na pahayag. Pinananatili ng “na sinasabi” ang pormal na ugnayan nito sa kasunod na sipi.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa teksto sa halip na tahimik itong palitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na pormal ngunit madaling maunawaan. Pinanatili ang pormulang pananalita ng Hebreo, bagaman bahagyang pormal sa Tagalog ang “na sinasabi,” dahil ipinagpapatuloy nito ang pangungusap tungo sa susunod na talata.
