  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: tl
  text: At pinuspos ko siya ng Espiritu ng Diyos[a], ng karunungan, pang-unawa, kaalaman, at kasanayan sa lahat ng uri ng gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “espiritu ng Diyos” o “isang banal na espiritu.” Maaaring unawain nang mas pangkalahatan ang pariralang Hebreo, ngunit dito ay malamang na tumutukoy ito sa sariling Espiritu ng Diyos na nagbibigay sa kanya ng kakayahan.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: At pinuspos ko
  rationale: Ang pandiwang מלא ay nangangahulugang ‘punuin’ o ‘puspusin.’ Ang aspektong ganap ay inilalarawan bilang natapos na pagkakaloob ng Diyos na may bisa sa kasalukuyang konteksto.
- source_word: אֹתוֹ
  choice: siya
  rationale: Tuwirang layon na tumutukoy kay Bezalel sa naunang talata.
- source_word: רוּחַ אֱלֹהִים
  choice: Espiritu ng Diyos
  rationale: Maaaring unawain ang parirala bilang espiritu mula sa Diyos o banal na espiritu, ngunit sa konteksto ng tuwirang pagbibigay-kakayahan ng Diyos kay Bezalel, malamang na tumutukoy ito sa sariling Espiritu ng Diyos.
- source_word: בְּחָכְמָה
  choice: ng karunungan
  rationale: Ipinapakita ng ב ang ipinagkaloob na katangiang kalakip ng pagpuspos; natural sa Filipino ang ‘pinuspos ... ng karunungan.’
- source_word: וּבִתְבוּנָה
  choice: pang-unawa
  rationale: Ang תבונה ay tumutukoy sa pag-unawa, pagkilatis, o malalim na kabatiran. Pinananatili ng ‘pang-unawa’ ang malinaw na kaibhan nito sa karunungan at kaalaman.
- source_word: וּבְדַעַת
  choice: kaalaman
  rationale: Tuwirang katumbas ng דעת at natural na bahagi ng tatluhang hanay na karunungan, pang-unawa, at kaalaman.
- source_word: וּבְכָל מְלָאכָה
  choice: at kasanayan sa lahat ng uri ng gawain
  rationale: Ang מלאכה ay maaaring mangahulugang gawain, hanapbuhay, o gawaing nangangailangan ng kasanayan. Sa konteksto ng paggawa ng tabernakulo, ipinahahayag ng salin ang praktikal at malikhaing kahusayan nang hindi nililimitahan ito sa iisang uri ng sining.
theological_decisions:
- issue: Kung ang רוּחַ אֱלֹהִים ay tumutukoy sa sariling Espiritu ng Diyos o, sa mas pangkalahatang diwa, sa espiritung mula sa Diyos
  choice: Espiritu ng Diyos
  alternative: espiritu ng Diyos; isang banal na espiritu
  rationale: Ang nagsasalita ay ang Diyos at inilalarawan niya ang tuwirang pagbibigay-kakayahan kay Bezalel para sa banal na gawain. Pinapaboran nito ang pagtukoy sa sariling Espiritu ng Diyos, ngunit inilalahad sa talababa ang tunay na lawak ng kahulugan ng Hebreo nang hindi ipinapasok ang mas huling pormulasyong doktrinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘pinuspos’ bilang natural na wikang biblikal na nauunawaan pa rin ng karaniwang mambabasa. Inayos ang hulíng parirala bilang ‘kasanayan sa lahat ng uri ng gawain’ upang maging likas sa Filipino at maipakita ang konteksto ng bihasa at malikhaing paggawa.
