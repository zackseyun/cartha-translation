  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: tl
  text: at ang mga kasuotang mahusay ang pagkakahabi[a], ang mga banal na kasuotan para kay Aaron na pari, at ang mga kasuotan ng kanyang mga anak para sa kanilang paglilingkod bilang mga pari,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kasuotan para sa paglilingkod,” “mga kasuotang ginagamit sa paglilingkod,” o “mga hinabing kasuotan.” Mahirap tiyakin ang kahulugan ng Hebreong בִּגְדֵי הַשְּׂרָד; maaaring binibigyang-diin nito ang pagkakayari ng mga kasuotan o ang gamit ng mga ito sa paglilingkod sa tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: mga kasuotang hinabing mabuti
  rationale: Ang בִּגְדֵי ay “mga kasuotan,” samantalang mahirap tiyakin ang kahulugan ng שְׂרָד. Malamang na tumutukoy ito sa natatanging pagkakahabi o pagkakayari ng mga kasuotan, ngunit maaari rin itong tumukoy sa gamit ng mga iyon sa paglilingkod. Pinananatili sa talababa ang tunay na pag-aalinlangan.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: mga banal na kasuotan
  rationale: Tuwirang ipinapahayag ng pariralang ito ang mga kasuotang itinalaga bilang banal; natural at marangal sa modernong Tagalog ang “mga banal na kasuotan.”
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: para kay Aaron na pari
  rationale: Ipinakikita ng לְ na ang mga kasuotan ay nakatalaga para kay Aaron, at ang הַכֹּהֵן ay pamagat na “ang pari.” Ang “kay Aaron na pari” ay malinaw at likas sa Tagalog.
- source_word: בִּגְדֵי בָנָיו
  choice: mga kasuotan ng kanyang mga anak
  rationale: Pinananatili nito ang ugnayang ipinahahayag ng construct phrase at ng hulaping tumutukoy kay Aaron.
- source_word: לְכַהֵן
  choice: para sa paglilingkod nila bilang mga pari
  rationale: Ang infinitive na כהן ay nangangahulugang gumanap o maglingkod bilang pari. Idinagdag ang “nila” upang maging malinaw sa Tagalog na ang mga anak ni Aaron ang gaganap bilang mga pari, nang hindi binabago ang diwa.
- source_word: וְאֵת / וְאֶת
  choice: at
  rationale: Hindi tuwirang isinasalin ang pananda ng tiyak na layon na אֵת; isinasalin ang וְ bilang “at” upang mapanatili ang anyo ng talaang nagpapatuloy mula sa naunang talata.
