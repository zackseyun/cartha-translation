  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: tl
  text: Sa iisang bahay[a] ito kakainin. Huwag kang maglabas ng anumang bahagi ng karne mula sa bahay patungo sa labas, at huwag kang magbali ng kahit isang buto nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa iisang sambahayan.” Ang salitang Hebreo ay maaaring tumukoy sa pisikal na bahay o sa sambahayang nagkakatipon doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: sa iisang bahay
  rationale: Ang בַּיִת ay maaaring tumukoy sa pisikal na bahay o sa sambahayang naroon. Pinapaboran ng kasunod na pagbabawal na maglabas ng karne ang kongkretong kahulugang “bahay,” habang pinananatili sa talababa ang alternatibong “sambahayan.”
- source_word: יֵאָכֵל
  choice: ito kakainin
  rationale: Pinananatili ng anyong pasibo ang Niphal at ang lakas ng isang tagubiling legal, sa natural na ayos ng modernong Tagalog.
- source_word: לֹא תוֹצִיא
  choice: Huwag kayong maglabas
  rationale: Tuwirang ipinahahayag ang Hiphil na diwang “ilabas” at pinananatili ang maramihang kausap na nasa pandiwang Hebreo.
- source_word: מִן הַבָּשָׂר
  choice: ng anumang karne
  rationale: Sa konteksto ng pagkain, natural na katumbas ng בָּשָׂר ang “karne.” Ipinahihiwatig ng “anumang” ang partitive na מִן at na walang bahagi nito ang dapat ilabas.
- source_word: מִן הַבַּיִת ... חוּצָה
  choice: mula sa bahay patungo sa labas
  rationale: Sabay na inilalahad ang pinagmulan at ang direksiyong ipinapahiwatig ng חוּצָה, sa malinaw at natural na Tagalog.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: at huwag kayong babali ng kahit isang buto nito
  rationale: 'Ang isahang עֶצֶם ay may diwang pamamahagi: walang kahit isang buto ang dapat baliin. Ang “nito” ay nagpapanatili sa hindi tahasang pinangalanang handog na pampaskuwa bilang tinutukoy ng panghalip.'
theological_decisions:
- issue: Ang tinutukoy ng panghuling panghalip na בוֹ
  choice: ang handog na pampaskuwa bilang kabuuan (“nito”)
  alternative: partikular na ang kordero
  rationale: Ang panlalaking isahang panghalip ay tumutukoy sa hayop na pampaskuwang tinatalakay. Hindi nagdaragdag ang “nito” ng isang pangngalang hindi tahasang nasa talata, ngunit tugma pa rin ito sa mas malawak na konteksto ng korderong pampaskuwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “huwag kayong” upang natural na maipahayag ang maramihang utos, at pinanatili ang pasibong anyo sa unang pangungusap.
