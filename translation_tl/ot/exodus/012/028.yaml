    rationale: Ang Hebreo ay ‘gaya ng iniutos ni Yahweh kina Moises at Aaron,’ kung saan sina Moises at Aaron ang tuwirang pinag-utusan. Ang kasalukuyang ayos ay maaaring maglipat ng diin sa bagay o nilalaman ng utos.
  - severity: low
