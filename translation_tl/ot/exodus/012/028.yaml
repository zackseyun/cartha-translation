  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: tl
  text: Pagkatapos, pumunta ang mga anak ni Israel at ginawa nila iyon; gaya ng iniutos ni Yahweh kina Moises at Aaron, gayon ang ginawa nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas idyomatiko, “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: umalis
  rationale: Ang wayyiqtol ng הלך ay nagpapatuloy sa salaysay. Sa konteksto, ang “umalis” ay likas na nagpapahiwatig na humayo sila upang isagawa ang mga tagubilin, nang hindi nagdaragdag ng bagay na wala sa pandiwa.
- source_word: וַיַּעֲשׂוּ
  choice: ginawa nila iyon
  rationale: Ang עשה ay tumutukoy pabalik sa mga iniutos na gawain para sa Paskuwa; malinaw at natural sa Tagalog ang anaporikong “ginawa nila iyon.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na pananalitang pampamilya ng Hebreo, samantalang inilalagay sa talababa ang mas idyomatikong “mga Israelita.”
- source_word: כַּאֲשֶׁר
  choice: kung ano ang
  rationale: 'Kasama ng pangwakas na כֵּן, bumubuo ito ng likas na Tagalog na pagtutumbas: “Kung ano ang ... gayon nga ...,” na nagpapakita ng lubos na pagsunod sa utos.'
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang aspektong ganap ng Hebreo ay tumutukoy sa naunang utos; sapat sa natural na Tagalog ang “iniutos” nang hindi kailangang tahasang markahan ang pluperfect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang אֶת ay nagmamarka kina Moises at Aaron bilang mga tuwirang inutusan. Likas sa Tagalog ang “iniutos ... kina Moises at Aaron,” at hindi nito ipinapasok ang ideyang “sa pamamagitan nina.”
- source_word: כֵּן עָשׂוּ
  choice: gayon nga ang ginawa nila
  rationale: Pinananatili ng “gayon nga” ang panapos at mariing pagtiyak ng Hebreo na eksakto ang kanilang pagsunod.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pampamilya at pormal na anyo ng Hebreo, habang ibinibigay sa talababa ang karaniwang idyomatikong katumbas.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mga anak ni Israel” upang maging pormal na malinaw sa Hebreo, ngunit ibinigay ang “mga Israelita” bilang mas natural na alternatibo. Ang pares na “Kung ano ang ... gayon nga ...” ay sadyang nagpapanatili sa paulit-ulit na diin ng orihinal sa ganap na pagsunod.
