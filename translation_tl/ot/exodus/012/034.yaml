  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: tl
  text: Kaya dinala ng mga tao ang kanilang masa bago pa ito malagyan ng pampaalsa, kasama ang kanilang mga mangkok na pangmamasa[a] na nakabalot sa kanilang mga balabal at pasan sa kanilang mga balikat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga batya na pangmamasa.” Ang salitang Hebreo ay tumutukoy sa mga sisidlang ginagamit sa paghahanda ng masa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: dinala
  rationale: Sa konteksto ng kanilang pag-alis, ang pandiwa ay tumutukoy sa pagbuhat at pagdadala ng mga gamit. Likas sa makabagong Tagalog ang “dinala.”
- source_word: הָעָם
  choice: ang mga tao
  rationale: Kolektibong tumutukoy ito sa bayang Israel; malinaw at karaniwan sa Tagalog ang “ang mga tao.”
- source_word: בְּצֵקוֹ
  choice: ang kanilang masa
  rationale: Bagaman isahan ang hulaping Hebreo dahil kolektibo ang simuno, mas natural sa Tagalog ang pangmaramihang “kanilang.” Ang “masa” ay tumutukoy sa hinalong harina na hindi pa umaalsa.
- source_word: טֶרֶם יֶחְמָץ
  choice: bago pa ito umalsa
  rationale: Ipinahihiwatig ng parirala na hindi pa naaalsahan o napapaalsa ang masa. Ang “umalsa” ay natural at nauunawaan sa konteksto ng paggawa ng tinapay.
- source_word: מִשְׁאֲרֹתָם
  choice: kanilang mga mangkok na pangmasa
  rationale: Ang pangngalan ay tumutukoy sa mga sisidlang ginagamit sa paghahanda o pagmamasa ng masa. Ang “mangkok na pangmasa” ay kongkreto at madaling maunawaan, habang inilalahad sa talababa ang posibleng anyong batya.
- source_word: צְרֻרֹת
  choice: ibinalot at itinali
  rationale: Ang balintiyak na anyo ay naglalarawan sa mga sisidlang pinagsama at tiniyak para madala. Ang tambalang parirala ay malinaw na naghahatid ng larawan ng mga gamit na nakabalot at nakatali.
- source_word: בְּשִׂמְלֹתָם
  choice: sa kanilang mga balabal
  rationale: Karaniwang tumutukoy ang salitang Hebreo sa panlabas na kasuotan. Ang “balabal” ay kongkreto at angkop sa paggamit dito bilang pambalot.
- source_word: עַל שִׁכְמָם
  choice: pinasan sa kanilang mga balikat
  rationale: Inilalarawan nito ang mga binalot na sisidlang pasan ng mga tao. Pinananatili ng pangmaramihang “mga balikat” ang kolektibong diwa.
