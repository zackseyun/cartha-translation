- from: Kaya dinala ng mga tao ang kanilang masa bago pa ito umalsa, at ang kanilang mga mangkok na pangmasa[a] ay ibinalot at itinali sa kanilang mga balabal, saka pinasan sa kanilang mga balikat.
  to: Kaya dinala ng mga tao ang kanilang masa bago pa ito malagyan ng pampaalsa, kasama ang kanilang mga mangkok na pangmamasa[a] na nakabalot sa kanilang mga balabal at pasan sa kanilang mga balikat.
  rationale: Pinalitan ang pariralang ukol sa pag-alsa upang mas malinaw na maihatid ang leksikal na diwa ng hindi pa nale-leaven ang masa. Inayos ang katawagan para sa mga sisidlan at ang ayos ng pangungusap upang likas na maipakita na ang mga ito ay nakabalot sa mga balabal at pasan sa mga balikat.
