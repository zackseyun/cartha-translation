translation_notes:
  register: 'Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang larawan ng agarang pag-alis: hindi pa umaalsa ang masa, at nakabalot sa mga panlabas na kasuotan ang mga sisidlan upang pasanin.'
