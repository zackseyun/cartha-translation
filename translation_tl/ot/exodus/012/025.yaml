base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: tl
  text: At kapag dumating kayo sa lupaing ibibigay sa inyo ni Yahweh, gaya ng ipinangako niya,[a] tuparin ninyo ang ritwal na ito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa sinabi niya.” Literal sa Hebreo ang “ayon sa kanyang sinalita,” na sa kontekstong ito ay tumutukoy sa nauna niyang pangako.
    reason: lexical_alternative
  - marker: b
    text: O “paglilingkod na ito” o “pagdiriwang na ito.” Ang salitang Hebreo ay tumutukoy rito sa itinakdang ritwal ng Paskuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Ipinakikilala ng karaniwang pormulang Hebreo ang isang kalagayang mangyayari sa hinaharap. Likas sa modernong Tagalog ang “At kapag” at napananatili nito ang temporal na diwa.
- source_word: תָבֹאוּ אֶל־הָאָרֶץ
  choice: nakarating kayo sa lupain
  rationale: Ang בוא ay maaaring mangahulugang dumating o pumasok. Ang “nakarating ... sa lupain” ay natural sa Tagalog at malinaw na tumutukoy sa pagdating sa lupaing ipinangako.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: ibibigay sa inyo ni Yahweh
  rationale: Ang anyo ng נתן ay tumutukoy rito sa hinaharap. Pinanatili ang personal na pangalang Yahweh para sa יהוה.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: gaya ng ipinangako niya
  rationale: Literal itong “gaya ng sinabi niya,” ngunit sa konteksto, ang naunang sinabi ni Yahweh ay isang pangako. Inihahayag ng “ipinangako” ang kontekstuwal na diwa, habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: וּשְׁמַרְתֶּם
  choice: sundin ninyo
  rationale: Kapag ritwal ang layon, ang שׁמר ay nangangahulugang panatilihin, tuparin, o isagawa nang tapat. Malinaw at natural ang “sundin ninyo” bilang tagubilin.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ang ritwal na ito
  rationale: Ang עֲבֹדָה ay literal na paglilingkod o gawain, ngunit dito ay tumutukoy sa itinakdang ritwal ng Paskuwa. Ang “ritwal” ay malinaw sa karaniwang mambabasa at hindi nagdaragdag ng denominasyonal na kahulugan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang natatanging pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- issue: Promisoryong diwa ng כַּאֲשֶׁר דִּבֵּר
  choice: gaya ng ipinangako niya
  alternative: gaya ng sinabi niya
  rationale: Ang pandiwa ay literal na “nagsalita/nagsabi,” ngunit sa konteksto ay tumutukoy sa naunang pangako tungkol sa lupain. Pinanatili sa talababa ang literal na pagbasa upang hindi maitago ang saklaw ng Hebreo.
- issue: Kahulugan ng עֲבֹדָה sa konteksto ng Paskuwa
  choice: ritwal
  alternative: paglilingkod; pagdiriwang; gawaing ito
  rationale: Sa konteksto, hindi ito pangkalahatang paggawa kundi ang itinakdang gawaing panrelihiyon ng Paskuwa. Ang “ritwal” ang pinakamaikli at pinakamalinaw na katumbas, habang kinikilala sa talababa ang literal na “paglilingkod.”
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “lupain” upang mapanatili ang biblikal at pangakong konteksto, at “ritwal” upang maging malinaw ang kultikong kahulugan nang hindi nagiging makaluma o denominasyonal.
