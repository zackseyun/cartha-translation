revisions:
- from: 'Sabihin ninyo sa buong kapulungan ng Israel: ‘Sa ikasampung araw ng buwang ito, bawat lalaki ay kukuha ng isang tupa o kambing[a] para sa sambahayan ng kanyang mga ninuno—isa para sa bawat sambahayan.’'
  to: 'Sabihin ninyo sa buong kapulungan ng Israel: ‘Sa ikasampung araw ng buwang ito, bawat lalaki ay kukuha ng isang tupa o kambing[a] ayon sa sambahayan ng kanyang angkan—isang tupa o kambing para sa bawat sambahayan.’'
  rationale: Pinalitan ang posibleng mapanlinlang na “sambahayan ng kanyang mga ninuno” ng “sambahayan ng kanyang angkan” upang maipahayag ang yunit ng sambahayan sa linya ng ama na nasa לְבֵית אָבֹת. Ginawang tuwiran ang huling parirala upang malinaw na isang hayop ang para sa sambahayan. Pinanatili ang lexical na saklaw ng שֶׂה sa pangunahing teksto at sa talababa.
  reviewer_model: gpt-5.6-terra
