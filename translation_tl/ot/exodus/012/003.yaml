  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: tl
  text: 'Sabihin ninyo sa buong kapulungan ng Israel: ‘Sa ikasampung araw ng buwang ito, bawat lalaki ay kukuha ng isang tupa o kambing[a] ayon sa sambahayan ng kanyang angkan—isang tupa o kambing para sa bawat sambahayan.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na שֶׂה ay tumutukoy sa isang hayop mula sa kawan at maaaring tupa o kambing; hindi lamang ito nangangahulugang “kordero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל ... לֵאמֹר
  choice: Sabihin ninyo sa ...
  rationale: Pinagsama sa likas na modernong Tagalog ang maramihang pautos at ang Hebreong pormulang nagpapakilala sa tuwirang pahayag.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: buong kapulungan ng Israel
  rationale: Ang “kapulungan” ay nagpapahayag ng Israel bilang sama-samang pamayanan nang hindi nagiging makaluma o nakatali sa isang denominasyon.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: Sa ikasampung araw ng buwang ito
  rationale: Idinagdag ang “araw,” na ipinahihiwatig sa Hebreo, upang maging malinaw at natural sa Tagalog.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: bawat lalaki ay kukuha
  rationale: Pinananatili ng “bawat lalaki” ang distributibong אִישׁ; ang panghinaharap na anyo ay may malinaw na puwersang pautos sa konteksto ng tagubilin.
- source_word: שֶׂה
  choice: isang tupa o kambing
  rationale: Ang שֶׂה ay maaaring tumukoy sa isang hayop mula sa maliit na kawan, tupa man o kambing. Hindi ito nilimitahan sa “kordero,” lalo na't tahasang pinahihintulutan ng kasunod na konteksto ang alinman sa tupa o kambing.
- source_word: לְבֵית אָבֹת
  choice: para sa sambahayan ng kanyang mga ninuno
  rationale: Ipinahahayag nito ang sambahayang nakaugnay sa angkan ng ama, habang nananatiling nauunawaan sa karaniwang modernong Tagalog.
- source_word: שֶׂה לַבָּיִת
  choice: isa para sa bawat sambahayan
  rationale: Ang בַּיִת dito ay sambahayan, hindi gusali; nililinaw ng “bawat” ang distributibong diwa sa konteksto.
