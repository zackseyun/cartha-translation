  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Moises ang lahat ng matatandang pinuno ng Israel at sinabi sa kanila, “Pumili kayo[a] at kumuha para sa inyong mga angkan ng hayop mula sa kawan[b], at katayin ninyo ang hayop na ihahandog para sa Paskuwa[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaari ring mangahulugang “ilabas” o “hilahin palabas” mula sa kawan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa maliliit na alagang hayop sa kawan, gaya ng tupa o kambing.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “ang Paskuwa”; dito ay tumutukoy ito sa hayop na inihahandog para sa Paskuwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa konteksto, ipinatawag ni Moises ang mga pinuno upang bigyan sila ng tagubilin; natural na ipinahahayag ng “ipinatawag” ang diwa ng pagtitipon o pagpapaharap.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: matatandang pinuno ng Israel
  rationale: Ang זְקֵנִים ay mga kinikilalang nakatatanda at kinatawang pinuno, hindi lamang mga taong may edad.
- source_word: מִשְׁכוּ
  choice: Humayo kayo
  rationale: Maaaring literal na mangahulugang “hilahin,” ngunit sa pariralang מִשְׁכוּ וּקְחוּ malamang na panawagang kumilos upang kumuha ng hayop; pinananatili ng salin ang hiwalay na utos nang hindi nagmumungkahi ng tiyak na paraang hindi malinaw sa teksto.
- source_word: וּקְחוּ לָכֶם
  choice: kumuha para sa inyong
  rationale: Natural na Tagalog ito para sa utos na kumuha sila ng hayop para sa kani-kanilang pangkat.
- source_word: צֹאן
  choice: isang hayop mula sa kawan
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop at maaaring tumukoy sa tupa o kambing; iniiwasan nitong paliitin ang kahulugan sa kordero lamang.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: para sa inyong mga angkan
  rationale: Ang מִשְׁפָּחָה rito ay pangkat na pampamilya o angkan; ang “mga angkan” ay angkop sa panlipunang kaayusan ng Israel.
- source_word: וְשַׁחֲטוּ
  choice: katayin ninyo
  rationale: Ang “katayin” ang karaniwan at tiyak na salitang Tagalog para sa pagpatay ng hayop, kabilang sa kontekstong handog.
- source_word: הַפָּסַח
  choice: ang handog para sa Paskuwa
  rationale: Literal itong “ang Paskuwa,” ngunit metonimikong tumutukoy rito sa hayop na kinakatay; nililinaw ng “handog” ang tinutukoy nang hindi ito nililimitahan sa kordero.
theological_decisions:
- issue: Ang tinutukoy ng הַפָּסַח
  choice: ang handog para sa Paskuwa
  alternative: ang Paskuwa; ang kordero ng Paskuwa
  rationale: Tumutukoy ang pangngalan sa hayop na ihahandog sa Paskuwa. Ang “handog para sa Paskuwa” ay malinaw sa Tagalog at pinananatili ang lawak ng konteksto, sapagkat maaaring tupa o kambing ang hayop ayon sa Exodo 12:5.
- issue: Uri ng hayop sa צֹאן
  choice: isang hayop mula sa kawan
  alternative: tupa; kordero; maliit na alagang hayop
  rationale: Hindi tiyak sa salitang Hebreo kung tupa o kambing, kaya hindi ipinapasok sa pangunahing teksto ang mas makitid na “kordero.”
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “matatandang pinuno” upang malinaw ang tungkulin ng mga elder, “angkan” para sa sinaunang pangkat-pamilya, at “Paskuwa” bilang kinikilalang katawagan. Iniwasan ang “kordero” dahil mas malawak ang צֹאן at pinahihintulutan ng kalapit na konteksto ang tupa o kambing.
