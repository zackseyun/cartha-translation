  to: Pagkatapos, ipinatawag ni Moises ang lahat ng matatandang pinuno ng Israel at sinabi sa kanila, “Pumili kayo[a] at kumuha para sa inyong mga angkan ng hayop mula sa kawan[b], at katayin ninyo ang hayop na ihahandog para sa Paskuwa[c].”
  rationale: Pinalitan ang maling “Humayo kayo” ng “Pumili kayo” upang katawanin ang utos na magbukod ng hayop mula sa kawan, at idinagdag ang talababa para sa literal na saklaw ng pandiwa. Inayos din ang huling parirala upang malinaw na ang “Paskuwa” ay tumutukoy sa hayop na kakatayin, samantalang pinananatili ang malawak na saklaw na tupa o kambing.
