  terminology: Ang “matatandang pinuno ng Israel,” “mga angkan,” “katayin,” at “Paskuwa” ay angkop sa rehistro at konteksto. Pinananatili ng “hayop mula sa kawan” ang saklaw na tupa o kambing. Ang “Paskuwa” ay ipinaliliwanag sa talababa bilang metonimikong tawag sa hayop na inihahandog.
