  yaml_path: translation/ot/exodus/012/001.yaml
  text: The LORD said to Moses and to Aaron in the land of Egypt, saying,
translation:
  language: tl
  text: 'Sinabi ni YHWH kina Moises at Aaron sa lupain ng Ehipto:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: YHWH
  rationale: Pinananatili ang natatanging personal na pangalan ng Diyos sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Natural na salin sa modernong Tagalog para sa pagsasalita na nakatuon sa dalawang taong pinangalanan; hindi na kailangang ulitin ang 'kay' upang maipakita ang inuulit na אֶל.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Tuwirang pinananatili ang lokasyong binanggit ng Hebreo.
- source_word: לֵאמֹר
  choice: —
  rationale: Hindi isinalin nang hiwalay ang pormulang Hebreong nagpapakilala sa kasunod na tuwirang pahayag, sapagkat sapat at natural sa Tagalog ang 'Sinabi ...' at magpapatuloy ang pahayag sa susunod na talata.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan
  choice: YHWH
  alternative: PANGINOON
  rationale: Ang tetragrammaton ay personal na pangalan sa pinagmulan; ang transliterasyong YHWH ay umiiwas na ipalit dito ang titulong 'Panginoon' o magtakda ng di-tiyak na pagbigkas.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang pangmaramihang pantukoy na 'kina' para sa natural na daloy, at inalis ang literal na 'na sinasabi' dahil hindi ito likas sa Tagalog bilang pambungad sa kasunod na pagsasalita.
