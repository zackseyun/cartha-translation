  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: tl
  text: At sasabihin ninyo, “Ito ang hain ng Paskuwa para kay Yahweh,[a] na nilampasan ang mga bahay ng mga anak ni Israel sa Ehipto nang hampasin niya ang Ehipto at iniligtas niya ang aming mga bahay.” At yumukod ang bayan at sumamba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang isinaling “nilampasan” ay mula sa ugat na kaugnay ng salitang “Paskuwa”; maaari rin itong magpahiwatig ng paglampas upang iligtas o ingatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: handog na pampaskuwa
  rationale: Pinananatili nito ang kultikong diwa ng זֶבַח bilang handog na hain at ang kaugnayan nito sa Paskuwa, sa natural na makabagong Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahayag dito ng pag-aalay o pagtatalaga; natural sa Tagalog ang “para kay” sa konteksto ng handog.
- source_word: פָּסַח
  choice: lumampas
  rationale: Pinananatili ang ugnayang pandiwa sa pangalang Paskuwa. Maaari rin itong magpahiwatig ng paglampas upang iligtas o ingatan, kaya nililinaw ito sa talababa.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: mga bahay ng mga anak ni Israel
  rationale: Malinaw at medyo pormal na salin ng Hebreong pananalitang pampamilya at pangtipan, nang hindi ito pinapantay lamang sa “mga Israelita.”
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: nang salutin niya ang Ehipto
  rationale: Ang בְּ + infinitive construct ay temporal. Sa kontekstong ito ng salot at paghatol, ang “salutin” ay natural at mas tiyak kaysa sa pangkalahatang “saktan,” habang hindi nililimitahan ang kilos sa iisang tao lamang.
- source_word: הִצִּיל
  choice: iniligtas
  rationale: Tuwirang ipinahahayag ang pagliligtas o pagsagip na kahulugan ng Hiphil ng נצל at pinananatili ang “mga bahay” bilang layon.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: yumukod ... at sumamba
  rationale: 'Pinananatili ang dalawang magkaugnay ngunit magkakaibang kilos: pagyukod at pagsamba.'
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang pangtipan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng פָּסַח kaugnay ng pagliligtas
  choice: lumampas
  alternative: nilampasan at iningatan; pinalampas
  rationale: Ang “lumampas” ay nagpapanatili sa pagkakaugnay ng pandiwa at Paskuwa, samantalang ang posibleng proteksiyon o pagliligtas na pahiwatig ay hindi ikinukubli at inilalagay sa talababa.
- issue: Paglalarawan sa בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang Hebreong ekspresyong pampamilya at pangtipan nang hindi nagpapasok ng dagdag na interpretasyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “handog na pampaskuwa” upang maging natural ngunit mapanatili ang sakripisyal na diwa; iniwasan ang sobrang teknikal o denominasyonal na pananalita.
