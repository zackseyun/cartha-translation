  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: tl
  text: Iingatan ninyo iyon hanggang sa ikalabing-apat na araw ng buwang ito. Pagkatapos, kakatayin iyon ng buong kapulungan ng sambayanan ng Israel sa dapithapon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa pagitan ng dalawang dapithapon,” isang idyomang karaniwang inuunawa bilang panahon sa paligid ng paglubog ng araw o takipsilim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: Iingatan ninyo iyon
  rationale: Ang parirala ay tumutukoy sa pananagutan nilang panatilihin at alagaan ang napiling hayop hanggang sa takdang araw. Ang aktibong anyo ay mas natural sa Tagalog kaysa sa pasibong literal na hulma.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: hanggang sa ikalabing-apat na araw ng buwang ito
  rationale: Malinaw at likas na paraan ito ng pagpapahayag ng petsa sa modernong Tagalog.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: kakatayin iyon
  rationale: Ang שׁחט ay partikular na pagkatay sa hayop, kaya mas angkop ang “kakatayin” kaysa sa pangkalahatang “papatayin.”
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: buong kapulungan ng sambayanan ng Israel
  rationale: Pinananatili nito ang dalawang magkaugnay na kolektibong katawagan sa Hebreo at ang diin sa sama-samang pakikibahagi ng Israel.
- source_word: בֵּין הָעַרְבָּיִם
  choice: sa dapithapon
  rationale: Likas itong salin sa Tagalog para sa panahong tinutukoy ng idyomang Hebreo, habang inilalahad sa talababa ang literal na anyo at ang hindi ganap na tiyak na saklaw ng oras.
theological_decisions:
- issue: Ang kolektibong simuno ng utos na kumatay
  choice: kakatayin iyon ng buong kapulungan ng sambayanan ng Israel
  alternative: kakatayin ng bawat sambahayan ang sarili nitong hayop
  rationale: Kolektibo ang tahasang simuno sa Hebreo. Hindi ginawang paliwanag tungkol sa bawat sambahayan ang salin, kahit iyon ang praktikal na konteksto sa mga nakapaligid na talata.
- issue: Ang tiyak na oras na tinutukoy ng בֵּין הָעַרְבָּיִם
  choice: sa dapithapon, na may talababa
  alternative: sa pagitan ng dalawang dapithapon
  rationale: Hindi ganap na tiyak ang eksaktong saklaw ng idyoma. Nagbibigay ang pangunahing teksto ng natural na katumbas ngunit pinananatili ng talababa ang literal na anyo at ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “kapulungan ng sambayanan” upang mapanatili ang pormal at kolektibong diin ng Hebreo nang hindi nagiging labis na makaluma.
