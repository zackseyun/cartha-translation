base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: tl
  text: Umalis ang mga anak ni Israel mula sa Rameses patungong Sucot, na may humigit-kumulang animnaraang libong lalaking naglalakad[a], bukod pa sa mga bata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang humigit-kumulang animnaraang libo ay tumutukoy sa mga lalaking naglalakad; hindi kasama sa bilang na ito ang mga batang binanggit pagkatapos.
    reason: cultural_note
  - marker: b
    text: Ang salitang Hebreo ay maaaring tumukoy sa maliliit na bata o mga batang umaasa sa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis
  rationale: Sa konteksto ng paglalakbay, ang נסע ay tumutukoy sa pag-alis o pagsisimula ng paglalakbay. Likas sa modernong Tagalog ang “umalis” at ipinahihiwatig nito ang pag-alis ng pangkat mula sa Rameses.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang pampamilya ng Hebreong בני ישראל nang hindi nagiging mahirap unawain. Posible rin ang “mga Israelita,” ngunit hindi iyon kasinglapit sa anyo ng pinagmulan.
- source_word: מֵרַעְמְסֵס סֻכֹּתָה
  choice: mula sa Rameses patungong Sucot
  rationale: Tuwirang ipinapahayag ng “mula” ang pinanggalingan, samantalang ipinahihiwatig ng directional he sa סֻכֹּתָה ang pagpunta sa Sucot. Ginamit ang karaniwang anyong Filipino na “Sucot.”
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: Mga animnaraang libo
  rationale: Ang panlaping כְּ ay nagpapahiwatig ng pagtataya; natural na naihahatid ito ng “mga” bago ang bilang.
- source_word: רַגְלִי הַגְּבָרִים
  choice: lalaki ang naglakad
  rationale: Tinukoy ng הַגְּבָרִים ang mga lalaki, at ng רַגְלִי na sila ay naglalakbay nang naglalakad. Ang ayos na ito ay malinaw at likas sa Tagalog.
- source_word: לְבַד מִטָּף
  choice: bukod pa sa mga bata
  rationale: Ang טף ay karaniwang tumutukoy sa maliliit na bata o batang dependiente. Ipinakikita ng “bukod pa” na hindi sila kasama sa naunang bilang.
