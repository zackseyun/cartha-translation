  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: tl
  text: Huwag ninyong kainin ang alinman dito nang hilaw o pinakuluan sa tubig, kundi inihaw lamang sa apoy, kasama ang ulo, mga binti, at mga laman-loob nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: hilaw
  rationale: Sa konteksto ng pagluluto, tumutukoy ito sa karneng hindi niluto sa apoy o pinakuluan; “hilaw” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: o pinakuluan sa tubig
  rationale: Binibigyang-diin ng anyong Hebreo at ng pariralang “sa tubig” ang pagpapakulo bilang tiyak na paraan ng pagluluto.
- source_word: כִּי אִם
  choice: kundi ... lamang
  rationale: 'Malinaw nitong naipapahayag ang mahigpit na pagtatangi: hindi sa mga ipinagbabawal na paraan, kundi sa paraang itinakda lamang.'
- source_word: צְלִי אֵשׁ
  choice: inihaw ... sa apoy
  rationale: Natural ito sa modernong Tagalog at pinananatili ang apoy bilang paraan ng pagluluto.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: kasama ang ulo, mga binti, at mga laman-loob nito
  rationale: Inihahatid nito ang paglilista ng mga bahaging kasama sa pag-ihaw, nang hindi ipinapalagay nang higit sa tahasang sinasabi ng teksto.
- source_word: מִמֶּנּוּ
  choice: ang alinman dito
  rationale: 'Natural na Tagalog ito para sa partitive na diwa ng Hebreo: huwag kainin ang anumang bahagi nito.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “mga binti” para sa כְּרָעָיו at “mga laman-loob” para sa קִרְבּוֹ bilang natural ngunit tapat na mga katawagan.
