  source_fidelity: 'Tapat ang salin sa mga pangunahing elemento ng Hebreo: ang pagbabawal sa pagkain nang hilaw, sa pagpapakulo sa tubig, at ang eksklusibong utos na ihawin sa apoy. Naipapahayag din ang paglilista ng ulo, mga binti, at mga laman-loob bilang mga bahaging kasama sa pag-ihaw.'
