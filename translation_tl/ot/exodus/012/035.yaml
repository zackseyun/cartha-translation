  text: וּ/בְנֵי יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּ/דְבַ֣ר מֹשֶׁ֑ה וַֽ/יִּשְׁאֲלוּ֙ מִ/מִּצְרַ֔יִם כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: tl
  text: 'At ginawa ng mga Israelita ang sinabi ni Moises: humingi sila sa mga Ehipsiyo ng mga kagamitang pilak, mga kagamitang ginto, at mga damit.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humiling.” Ang pandiwang Hebreo rito ay karaniwang nangangahulugang “humingi” o “humiling,” hindi “humiram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Natural at malinaw sa modernong Tagalog bilang katawagan sa sama-samang bayan; iniiwasan ang masyadong literal ngunit di-likas na “mga anak na lalaki ni Israel.”
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: ginawa ... ang ayon sa sinabi ni Moises
  rationale: Pinananatili ang payak na diwa ng עשה at ang ideya ng pagkilos ayon sa salita ni Moises, habang natural ang ayos sa Tagalog.
- source_word: וַיִּשְׁאֲלוּ
  choice: humingi
  rationale: Ang pangunahing diwa ng שאל dito ay humingi o humiling, hindi humiram. Hindi nito ipinapasok ang konklusyong moral o ang kinalabasang pandarambong mula sa kasunod na salaysay.
- source_word: מִמִּצְרַיִם
  choice: sa mga Ehipsiyo
  rationale: Bagaman literal na “mula sa Ehipto,” tumutukoy sa konteksto sa mga taong Ehipsiyo na hiningan nila; ito ang natural na personal na layon sa Tagalog.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: mga kagamitang pilak at ginto
  rationale: Ang כְּלִי ay malawak na katawagan sa kagamitan o bagay. Ang “kagamitan” ay hindi naglilimita sa sisidlan lamang, at ang koordinasyong ito ay likas sa Tagalog.
- source_word: וּשְׂמָלֹת
  choice: mga damit
  rationale: Malinaw, kasalukuyan, at malawak na katumbas ng kasuotan.
theological_decisions:
- issue: Maaaring magpahiwatig ng moral na paghatol ang salin ng וַיִּשְׁאֲלוּ sa konteksto ng pag-alis sa Ehipto
  choice: humingi
  alternative: humiram; humiling
  rationale: Pinananatili ng “humingi” ang karaniwang leksikal na kahulugan nang hindi ipinapalagay na utang ang mga bagay o na ang pandiwa mismo ay nangangahulugang pandarambong. Ang “humiling” ay maaari rin ngunit bahagyang mas pormal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Israelita” sa halip na literal na “mga anak ni Israel,” at “mga damit” sa halip na mas pormal na “mga kasuotan.”
