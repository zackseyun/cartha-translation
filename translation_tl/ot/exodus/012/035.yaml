  source_fidelity: 'Tumpak ang pangunahing kahulugan: ang mga Israelita ay kumilos ayon sa sinabi ni Moises at humingi sa mga Ehipsiyo ng mga bagay na pilak, ginto, at mga damit. Ang “mga Israelita” ay likas na katumbas ng kolektibong “mga anak ni Israel,” at ang “humingi” ay wastong salin ng שאל nang hindi ipinapasok ang kahulugang “humiram.”'
  naturalness: May di-likas at di-gramatikal na pagkakabuo sa “ginawa ng mga Israelita ang ayon sa sinabi ni Moises.” Mas natural at malinaw ang “Ginawa ng mga Israelita ang sinabi ni Moises.”
  terminology: Ang “mga Ehipsiyo,” “humingi,” at “mga damit” ay angkop sa modernong Tagalog at sa antas ng pananalita ng salaysay. Upang maipakita nang malinaw ang dalawang magkahiwalay na pariralang Hebreo para sa mga bagay na pilak at mga bagay na ginto, inuulit ang “mga kagamitang.”
