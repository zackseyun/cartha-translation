    rationale: Hindi maaaring maging tuwirang layon ng “ginawa” ang pariralang “ang ayon sa.” Ang pag-aalis ng “ayon sa” ay nagbibigay ng likas na Tagalog at pinananatili ang diwa ng paggawa ayon sa salita ni Moises.
  - severity: low
    issue: Maaaring hindi gaanong malinaw na magkahiwalay ang mga kagamitang pilak at mga kagamitang ginto.
    rationale: Ang Hebreo ay may dalawang pariralang כְּלֵי, isa para sa pilak at isa para sa ginto. Ang pag-uulit ng “mga kagamitang” ay nagpapanatili ng estrukturang ito nang hindi nagiging di-likas.
