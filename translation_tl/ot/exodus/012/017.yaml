  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: tl
  text: At ipangingilin ninyo ang Tinapay na Walang Pampaalsa[a], sapagkat sa mismong araw na ito ay inilabas ko ang inyong mga pangkat[b] mula sa lupain ng Ehipto. At ipangingilin ninyo ang araw na ito sa bawat salinlahi ninyo bilang isang tuntuning panghabang panahon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang Pista ng Tinapay na Walang Pampaalsa.” Literal sa Hebreo, “ang mga tinapay/bagay na walang pampaalsa”; maaari itong tumukoy sa tinapay mismo o, sa pamamagitan ng kaugnayan, sa pagdiriwang.
    reason: lexical_alternative
  - marker: b
    text: O “mga hanay,” “mga pangkat na organisado,” o “mga hukbo.” Inilalarawan ng salitang Hebreo ang Israel bilang isang organisadong sambayanang lumalabas sa Ehipto.
    reason: lexical_alternative
  - marker: c
    text: O “bilang isang tuntunin magpakailanman” o “bilang isang walang-hanggang tuntunin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: ipangingilin ninyo
  rationale: Sa kontekstong ritwal, ang שׁמר ay nangangahulugang sundin o ipagdiwang nang tapat. Natural sa Tagalog ang “ipangingilin” at napananatili nito ang pag-uulit sa dalawang utos.
- source_word: הַמַּצּוֹת
  choice: ang Tinapay na Walang Pampaalsa
  rationale: Literal itong tumutukoy sa mga tinapay o bagay na walang pampaalsa, ngunit maaari ring tumukoy sa pagdiriwang sa pamamagitan ng metonimiya. Hindi tahasang idinagdag sa pangunahing teksto ang “Pista” upang mapanatili ang lawak ng Hebreo.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa mismong araw na ito
  rationale: Ipinahahayag ng parirala ang eksakto at mariing pagtukoy sa araw; natural na katumbas sa modernong Tagalog ang “sa mismong araw na ito.”
- source_word: הוֹצֵאתִי
  choice: inilabas ko
  rationale: Ang Hiphil ng יצא ay “ilabas” o “pangyaring lumabas”; tuwiran at natural ang “inilabas ko.”
- source_word: צִבְאוֹתֵיכֶם
  choice: ang inyong mga pangkat
  rationale: Ang צבא ay maaaring mangahulugang hukbo, organisadong pangkat, o hanay. Ang “mga pangkat” ay madaling maunawaan at pinananatili ang diwa ng organisadong sambayanan nang hindi ipinapalagay na mga mandirigma silang lahat.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Malinaw na ipinakikita ng “mula sa” ang pinagmulan, samantalang nasa pandiwang “inilabas” na ang galaw palabas.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Ipinahahayag nito ang patuloy na pagsunod ng sunod-sunod na salinlahi sa natural na modernong Tagalog.
- source_word: חֻקַּת עוֹלָם
  choice: bilang isang tuntuning panghabang panahon
  rationale: Ang חֻקָּה ay itinakdang tuntunin, at ang עוֹלָם ay nagsasaad ng namamalagi o patuloy na panahon. Pinananatili ng salin ang lakas ng idyoma nang hindi nilulutas ang saklaw nito sa isang pilosopikal na paraan.
theological_decisions:
- issue: Kung ang הַמַּצּוֹת ay ang pagkain mismo o tahasang pangalan ng pista
  choice: “ang Tinapay na Walang Pampaalsa” sa pangunahing teksto
  alternative: “ang Pista ng Tinapay na Walang Pampaalsa”
  rationale: Hindi nakasulat sa parirala ang salitang “pista,” bagaman maaaring tumukoy ang pagkain sa buong pagdiriwang. Pinananatili sa pangunahing teksto ang tunay na lawak at sa talababa inilalahad ang alternatibo.
- issue: Ang saklaw ng חֻקַּת עוֹלָם
  choice: “bilang isang tuntuning panghabang panahon”
  alternative: “bilang isang tuntunin magpakailanman” o “bilang isang walang-hanggang tuntunin”
  rationale: Ipinahahayag ng salin ang patuloy at matibay na bisa ng utos, ngunit hindi nito sapilitang nilulutas kung ang idyoma ay nangangahulugan ng ganap na walang hanggan sa lahat ng konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipangingilin” dahil ritwal at banal na pagtalima ang konteksto; iniwasan ang sobrang teknikal o denominasyonal na pananalita. Inayos ang mga pananda sa lohikal na katabi ng mga salitang ipinapaliwanag.
