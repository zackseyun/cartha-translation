revisions:
- from: At ipangingilin ninyo ang Tinapay na Walang Pampaalsa[a], sapagkat sa mismong araw na ito ay inilabas ko ang inyong mga pangkat[b] mula sa lupain ng Ehipto. Kaya ipangingilin ninyo ang araw na ito sa lahat ng salinlahi ninyo bilang isang tuntuning panghabang panahon[c].
  to: At ipangingilin ninyo ang Tinapay na Walang Pampaalsa[a], sapagkat sa mismong araw na ito ay inilabas ko ang inyong mga pangkat[b] mula sa lupain ng Ehipto. At ipangingilin ninyo ang araw na ito sa bawat salinlahi ninyo bilang isang tuntuning panghabang panahon[c].
  rationale: Pinalitan ang 'Kaya' ng 'At' upang hindi magdagdag ng ugnayang panghinuha na wala sa Hebreo. Inayos din ang parirala para sa mga salinlahi upang maging mas natural na Tagalog habang pinananatili ang diwa ng patuloy na pagtalima sa bawat henerasyon. Hindi binago ang pangunahing pagsasalin ng הַמַּצּוֹת o ang mga talababa, sapagkat maayos nilang pinananatili ang leksikal na saklaw ng pinagmulan.
