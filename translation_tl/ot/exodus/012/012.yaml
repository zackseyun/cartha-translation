base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: tl
  text: Sapagkat daraan ako sa lupain ng Ehipto sa gabing ito[a], at hahampasin ko ang bawat panganay sa lupain ng Ehipto, mula sa tao hanggang sa hayop[b]. Ipatutupad ko ang mga hatol laban sa lahat ng diyos ng Ehipto. Ako si Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “magdaraan ako sa lupain.” Ang pandiwa rito ay tumutukoy sa pagdaan sa lupain, hindi sa “paglampas” upang hindi pinsalain.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “mula sa tao hanggang sa hayop.”'
    reason: source_form
  - marker: c
    text: Sa Hebreo, YHWH; tradisyonal na isinasaling “ang PANGINOON.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: daraan ako
  rationale: Ipinapahayag ng pandiwa ang pagdaan sa loob o kabuuan ng lupain, hindi ang paglampas upang iligtas ang isang bahay.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang heograpikong saklaw ng אֶרֶץ.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: sa gabing ito
  rationale: Likas na modernong Tagalog na nagpapanatili sa diin ng demonstratibong ‘ito.’
- source_word: וְהִכֵּיתִי
  choice: papatayin ko
  rationale: Sa konteksto ng salot sa mga panganay, ang נכה ay tumutukoy sa nakamamatay na paglapastangan o pagpatay; mas malinaw at natural ito kaysa sa literal ngunit malabong ‘hahampasin.’
- source_word: כָּל בְּכוֹר
  choice: ang bawat panganay
  rationale: Tumpak na inilalarawan ang kolektibong parirala nang hindi idinaragdag ang ‘lalaki,’ na wala sa Hebreo.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: mula sa tao hanggang sa hayop
  rationale: Pinananatili ang merismong sumasaklaw sa tao at hayop at ang pormal na anyo ng parirala.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: laban sa lahat ng diyos ng Ehipto
  rationale: Ipinakikita ng ‘laban sa’ na ang mga hatol ay tuwirang nakatuon sa mga diyos ng Ehipto; hindi binabago ang ‘mga diyos’ tungo sa ‘mga diyus-diyosan.’
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: ipatutupad ko ang mga hatol
  rationale: Pinananatili ang bigat na panghukuman ng idyoma sa natural at marangal na Tagalog.
- source_word: אֲנִי יְהוָה
  choice: Ako si Yahweh
  rationale: Tinatrato ang tetragrammaton bilang ipinahayag na personal na pangalan ng Diyos at hindi bilang titulong ‘Panginoon.’
theological_decisions:
- issue: Paglalarawan sa אֱלֹהֵי מִצְרַיִם
  choice: mga diyos ng Ehipto
  alternative: mga diyus-diyosan ng Ehipto
  rationale: Tahasang ‘mga diyos’ ang nasa Hebreo. Pinananatili nito ang pahayag na laban sa mga diyos ng Ehipto ang mga hatol nang hindi paunang nilulutas ang ontolohikal na katayuan ng mga ito.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pinananatili sa pangunahing teksto ang pangalang tipan na kinakatawan ng YHWH, habang itinatala sa talababa ang tradisyonal na salin.
- issue: Lakas ng וְהִכֵּיתִי sa konteksto
  choice: papatayin ko
  alternative: hahampasin ko
  rationale: Bagaman pangunahing diwa ng pandiwa ang ‘humampas,’ malinaw sa konteksto ng kamatayan ng mga panganay na nakamamatay ang pagkilos. Pinipili ang natural na Tagalog nang hindi ginagawang mas banayad ang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang ‘Ehipto,’ ‘panganay,’ at ‘hatol’ bilang pamilyar na bokabularyong biblikal na nananatiling madaling maunawaan. Iniwasan ang makalumang ‘sasaktan’ o ‘hahamapsin’ sa nakamamatay na konteksto at ang denominasyonal na pagpapakahulugan sa mga diyos ng Ehipto.
