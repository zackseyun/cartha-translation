base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: tl
  text: Ang araw na ito ay magiging alaala para sa inyo. Ipagdiriwang ninyo ito bilang isang kapistahan para kay Yahweh. Sa lahat ng salinlahi ninyo, ipagdiriwang ninyo ito. Ito ay magiging isang tuntuning panghabang-panahon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang permanenteng tuntunin” o “isang tuntuning mananatili.” Ang pariralang Hebreo na חֻקַּת עוֹלָם ay karaniwang tumutukoy sa isang tuntuning patuloy na umiiral o may pangmatagalang bisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה לָכֶם
  choice: Ang araw na ito ay magiging ... para sa inyo
  rationale: Ipinahahayag ng anyong pandiwa sa kontekstong ito ang itinakdang magiging katayuan ng araw para sa Israel; likas sa modernong Tagalog ang ayos na ito.
- source_word: לְזִכָּרוֹן
  choice: araw ng pag-alaala
  rationale: Ang זִכָּרוֹן ay tumutukoy sa isang alaala o gawaing nagpapanatili ng paggunita. Nililinaw ng 'araw ng pag-alaala' ang kaugnayan nito sa 'araw na ito' nang hindi nagdaragdag ng kahulugang wala sa Hebreo.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: Ipagdiriwang ninyo ito bilang isang kapistahan
  rationale: Magkaugnay ang pandiwa חגג at pangngalang חַג. Pinananatili ng 'ipagdiriwang' at 'kapistahan' ang diwa ng masayang ritwal na pagdiriwang sa natural na Tagalog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahayag na ang kapistahan ay ukol at iniaalay kay Yahweh. Ginamit ang personal na pang-ukol na 'kay' sapagkat pangalan ang Yahweh.
- source_word: לְדֹרֹתֵיכֶם
  choice: Sa lahat ng salinlahi ninyo
  rationale: Ipinahahayag ng parirala ang patuloy na pagtalima sa magkakasunod na salinlahi; malinaw at dignified ang katumbas na ito sa modernong Tagalog.
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning panghabang-panahon
  rationale: Ang חֻקָּה ay isang nakatakdang tuntunin o batas, at ang עוֹלָם ay maaaring magpahiwatig ng patuloy at di-tiyak na mahabang bisa. Pinananatili ng salin ang lakas at likas na saklaw ng idyomang Hebreo.
- source_word: תְּחָגֻּהוּ
  choice: ipagdiriwang ninyo ito
  rationale: Ang pag-uulit ng pandiwang חגג ay sadyang pinanatili upang maipakita ang pagbibigay-diin at pagpapatibay ng utos sa Hebreo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng 'Yahweh' ang natatanging pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng חֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  alternative: tuntuning permanente; walang hanggang tuntunin
  rationale: Hindi tahasang nilulutas ng salin kung ang עוֹלָם ay nangangahulugan ng ganap na walang katapusang panahon o ng patuloy na bisa sa di-tiyak na hinaharap. Ang talababa ay nagpapanatili sa leksikal na saklaw nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Pinanatili ang pag-uulit ng 'ipagdiriwang' mula sa tekstong Hebreo at iniwasan ang labis na teknikal o makalumang pananalita.
