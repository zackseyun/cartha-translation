id: EXO.12.51
reference: Exodus 12:51
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: tl
  text: At sa mismong araw na iyon, inilabas ni Yahweh ang mga anak ni Israel[a] mula sa lupain ng Ehipto ayon sa kanilang mga pangkat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang kolektibong katawagang pampamilya para sa bayang nagmula kay Israel.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ayon sa kanilang mga hanay” o “ayon sa kanilang mga hukbo.” Maaaring idiin ng Hebreo ang organisadong mga pangkat ng Israel sa kanilang paglabas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: At
  rationale: Ipinahahayag ng anyong ito ang pagpapatuloy ng salaysay at ipinapasok ang takdang panahon; sapat at natural sa modernong Tagalog ang “At” kasunod ng pariralang temporal.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa mismong araw na iyon
  rationale: Pinananatili ng “mismong” ang diin ng idyomang Hebreo sa eksaktong araw, habang ang “iyon” ay angkop sa pananaw ng nagsasalaysay.
- source_word: הוֹצִיא
  choice: inilabas
  rationale: Ang Hiphil ng יצא ay sanhiang anyo, kaya malinaw na ipinahahayag ng “inilabas” na si Yahweh ang nagpangyaring makaalis ang Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Natural sa Tagalog at malapit sa literal na pamilyar at kolektibong katawagang “mga anak ni Israel”; maaari itong tumukoy sa buong bayang nagmula kay Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang salitang אֶרֶץ, “lupain,” at ang paggalaw palayo sa Ehipto.
- source_word: עַל צִבְאֹתָם
  choice: ayon sa kanilang mga pangkat
  rationale: Ipinahahayag nito ang organisadong pagkakahati-hati ng bayan nang lumabas sila, nang hindi ipinapalagay na ang tinutukoy ay mga yunit na nakikipagdigma.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak na lalaki ni Israel
  rationale: Pinananatili ng “mga anak ni Israel” ang pamilyar at tipanang kulay ng Hebreo, ngunit hindi nito nililimitahan ang tinutukoy sa mga lalaking indibidwal lamang, sapagkat kolektibong katawagan ito sa bayan.
- issue: Kahulugan ng צִבְאֹתָם
  choice: kanilang mga pangkat
  alternative: kanilang mga hukbo; kanilang mga hanay
  rationale: Maaaring magpahiwatig ang salita ng hukbo o organisadong mga pangkat. Sa konteksto ng paglabas ng buong bayan, pinananatili ang organisasyonal na diwa nang hindi labis na ginagawang militar ang kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “mismong” upang likas na maipahayag ang diin ng Hebreo, at inilagay ang bawat talababa kaagad pagkatapos ng pariralang tinutukoy nito.
