  terminology: Wastong pinanatili ang pangalang “Yahweh.” Ang “mga hukbo” ay pinananatili ang organisado at posibleng militar na himig ng צְבָאוֹת, habang ang talababa ay maingat na nagbibigay ng “mga pangkat” bilang alternatibong leksikal.
