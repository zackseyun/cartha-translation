id: EXO.12.41
reference: Exodus 12:41
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: tl
  text: At sa pagtatapos ng apatnaraan at tatlumpung taon, sa mismong araw na iyon, lumabas mula sa lupain ng Ehipto ang lahat ng mga hukbo[a] ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga pangkat.” Ang salitang Hebreo ay maaaring tumukoy sa mga organisadong pangkat o mga hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: sa pagtatapos ng
  rationale: Ipinahahayag ng parirala ang punto ng pagkakumpleto ng isang takdang panahon. Likas sa modernong Filipino ang “sa pagtatapos ng” at malinaw nitong pinananatili ang temporal na diwa.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: apatnaraan at tatlumpung taon
  rationale: Inayos ang pagkakasunod ng bilang ayon sa likas na gamit sa Filipino habang pinananatili ang kabuuang 430 taon.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: sa mismong araw na iyon
  rationale: Pinananatili ng “mismong” ang diin sa eksakto at tiyak na araw; ang “iyon” ay angkop sa pananaw ng salaysay.
- source_word: יָצְאוּ
  choice: lumabas
  rationale: Payak at tuwirang katumbas ito ng pandiwang יצא at angkop sa pag-alis mula sa Ehipto.
- source_word: כָּל צִבְאוֹת
  choice: ang lahat ng mga hukbo
  rationale: Pinananatili ng “lahat” ang kabuuang saklaw, samantalang ang “mga hukbo” ay nagpapahiwatig ng organisadong mga pangkat nang hindi inaalis ang bahaging militar ng salitang Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ (“lupain”) at ang heograpiko at pambansang diwa ng paglabas.
theological_decisions:
- issue: Paglalarawan sa mga Israelita bilang צִבְאוֹת יְהוָה
  choice: mga hukbo ni Yahweh
  alternative: mga pangkat ni Yahweh
  rationale: Maaaring tumukoy ang צָבָא sa hukbo o sa organisadong pangkat. Pinananatili ng “mga hukbo” ang masidhing kolektibo at bahagyang militar na diwa, habang inilalahad sa talababa ang mas malawak na posibilidad.
- issue: Pagbibigay ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na kilos ng salaysay at ang diin ng “sa mismong araw na iyon,” habang iniwasan ang labis na arkaikong pananalita.
