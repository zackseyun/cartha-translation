  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: tl
  text: Nang gabing iyon, ipinatawag niya sina Moises at Aaron at sinabi, “Bumangon kayo at umalis sa gitna ng bayan ko—kapuwa kayo at ang mga Israelita.[a] Humayo kayo at paglingkuran ninyo si Yahweh, gaya ng sinabi ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag niya
  rationale: Sa konteksto, ipinatawag ng Faraon sina Moises at Aaron nang apurahan. Likas sa modernong Tagalog ang “ipinatawag” at malinaw na nagpapahiwatig ng pagpapasundo o pagpapaharap.
- source_word: לַיְלָה
  choice: nang gabing iyon
  rationale: Ang salita ay gamit na pananda ng panahon. Ipinahahayag ng “nang gabing iyon” ang oras ng pangyayari sa natural na salaysay sa Tagalog.
- source_word: קוּמוּ
  choice: Bumangon kayo
  rationale: Pinananatili nito ang maramihang pautos at ang apurahang lakas ng Hebreo nang hindi nagiging makaluma.
- source_word: צְּאוּ מִתּוֹךְ עַמִּי
  choice: umalis sa gitna ng bayan ko
  rationale: Pinananatili ng parirala ang larawang paglabas mula sa loob o kalagitnaan ng bayan ng Faraon, sa halip na simpleng sabihing “lumayas.”
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: kapuwa kayo at ang mga Israelita
  rationale: Ipinapakita ng “kapuwa…at” ang inuulit na גַּם…גַּם, samantalang ang “mga Israelita” ay natural na katumbas sa kasalukuyang Tagalog. Itinala sa talababa ang literal na idyomang Hebreo.
- source_word: וּלְכוּ
  choice: Humayo kayo
  rationale: Pinananatili nito ang hiwalay na kasunod na pautos ng Hebreo at hindi isinasanib sa naunang “umalis.” Ang “humayo” ay marangal ngunit madaling maunawaan.
- source_word: עִבְדוּ
  choice: paglingkuran ninyo
  rationale: Mas malawak ang עבד kaysa sa pagsamba lamang; maaaring tumukoy ito sa paglilingkod na may kasamang pagsamba. Pinananatili ng “paglingkuran” ang lawak na iyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang יהוה sa halip na palitan iyon ng isang titulo.
- source_word: כְּדַבֶּרְכֶם
  choice: gaya ng sinabi ninyo
  rationale: Natural nitong ipinahahayag ang pagsang-ayon ng Faraon sa nauna nilang hiniling o sinabi nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi nagpapalit ng pangalan ng isang titulo.
- issue: Saklaw ng עבד kaugnay ng Diyos
  choice: paglingkuran
  alternative: sambahin
  rationale: Maaaring kasama sa pandiwa ang pagsamba, ngunit mas malawak ang pangunahing diwa nitong paglilingkod. Hindi ito dapat paliitin nang walang kailangan sa “sambahin” lamang.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang “bayan” para sa עַם, “ipinatawag” para sa apurahang pagpapaharap, at “mga Israelita” sa pangunahing teksto para sa likas na daloy. Inayos ang mga marker batay sa aktuwal na nilalaman ng talababa; hindi sinunod ang hindi tugmang pagkakalagay ng mga marker sa English consultation layer.
