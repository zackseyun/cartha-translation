  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: tl
  text: Nang hatinggabi, pinatay ni Yahweh ang bawat panganay sa lupain ng Ehipto, mula sa panganay ni Paraon na nakaupo sa kanyang trono hanggang sa panganay ng bihag na nasa piitan,[a] at ang bawat panganay ng mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ng bihag na nasa bilangguang hukay.”
    reason: Ipinahihiwatig ng בְּבֵית הַבּוֹר ang isang piitan na literal na kaugnay ng “hukay”; pinananatili ng alternatibo ang konkretong imaheng ito.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: At nang hatinggabi na
  rationale: Likas na panandang pasalaysay sa modernong Tagalog; malinaw nitong ipinagpapatuloy ang salaysay at isinasalin ang idyomang tumutukoy sa kalagitnaan ng gabi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: הִכָּה
  choice: pinatay
  rationale: Bagaman pangunahing nangangahulugang 'humampas' o 'sumakit,' malinaw sa konteksto na kamatayan ang bunga. Ang 'pinatay' ang pinakanatural at hindi malabong salin sa Tagalog.
- source_word: כָל בְּכוֹר
  choice: ang bawat panganay
  rationale: Ipinapakita ng 'bawat' ang distributibong saklaw ng כָל, habang ang 'panganay' ang karaniwang salin ng בְּכוֹר.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang pormal na heograpikong pariralang nasa Hebreo.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: mula sa panganay ng Paraon ... hanggang sa panganay ng bihag
  rationale: Pinananatili ang saklaw na ipinahahayag ng Hebreong kayariang מִן ... עַד, mula sa pinakamataas na kalagayang panlipunan hanggang sa pinakamababa.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: na nakaupo sa kanyang trono
  rationale: Natural na inilalarawan sa Tagalog ang maharlikang katayuan ng Paraon na ipinahahayag ng participle.
- source_word: הַשְּׁבִי
  choice: bihag
  rationale: Ang salita ay tumutukoy sa taong dinalang bihag; mas malapit ito sa Hebreo kaysa sa mas pangkalahatang 'bilanggo.'
- source_word: בְּבֵית הַבּוֹר
  choice: nasa bilangguang hukay
  rationale: Pinananatili ang konkretong larawan ng בּוֹר na 'hukay' at ang gamit nito bilang piitan o bartolina, bagaman hindi lubos na karaniwan ang tambalang ito sa Tagalog.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: pati ang bawat panganay ng mga alagang hayop
  rationale: Ang בְּהֵמָה ay malawak na tumutukoy sa domestikadong hayop, hindi lamang sa baka; natural sa Tagalog ang 'mga alagang hayop.'
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng 'Yahweh' ang pagkakakilanlan nito bilang pangalan at hindi ito pinapalitan ng titulong 'PANGINOON.'
- issue: Lakas at bunga ng pandiwang הִכָּה
  choice: pinatay
  alternative: pinabagsak; hinampas
  rationale: Sa konteksto ng ikasampung salot, tiyak na kamatayan ang bunga. Iniiwasan ng 'pinatay' ang posibleng maling pagkaunawa na nasaktan lamang ang mga panganay.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang 'Yahweh,' 'Paraon,' at 'Ehipto.' Ginamit ang 'bilangguang hukay' sa pangunahing teksto upang mapanatili ang larawang literal ng Hebreo, at inilagay sa talababa ang mas natural na 'piitan.'
