  source_fidelity: 'Tapat ang pangunahing teksto sa Masoretikong Hebreo: ang מוֹשָׁב ay naipahayag bilang tagal ng paninirahan, ang בני ישראל bilang “mga anak ni Israel,” ang Ehipto bilang saklaw ng paninirahan, at ang bilang na 430 taon ay eksakto. Ang pagsasama ng diwa ng relative clause sa “paninirahan ... sa Ehipto” ay ligtas at hindi nagdaragdag ng kahulugan.'
