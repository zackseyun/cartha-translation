source:
  edition: WLC
  text: וּ/מוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּ/מִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: tl
  text: Ang panahon ng paninirahan ng mga anak ni Israel[a] sa Ehipto ay apatnaraan at tatlumpung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ganito ang mababasa sa ilang sinaunang saksi: “Ang panahon ng paninirahan ng mga anak ni Israel at ng kanilang mga ninuno sa Ehipto at Canaan ay apatnaraan at tatlumpung taon.”'
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: panahon ng paninirahan
  rationale: Sa kontekstong ito, tumutukoy ang pangngalan sa tagal ng kanilang paninirahan, hindi lamang sa isang tirahan. Likas at malinaw sa modernong Tagalog ang “panahon ng paninirahan.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal at tradisyonal na anyo ng Hebreong parirala, sa halip na gawing mas malayang “mga Israelita.”
- source_word: אֲשֶׁר יָשְׁבוּ בְּמִצְרָיִם
  choice: sa Ehipto
  rationale: Isinama sa pariralang “panahon ng paninirahan ... sa Ehipto” ang diwa ng relative clause. Naiiwasan nito ang alanganing literal na ayos habang malinaw na ang tinutukoy ay ang kanilang paninirahan sa Ehipto.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: apatnaraan at tatlumpung taon
  rationale: Inayos ang bilang ayon sa likas na pagkakasunod sa Tagalog habang pinananatili ang eksaktong kabuuang 430 taon.
theological_decisions:
- issue: Kung ang 430 taon ay tumutukoy lamang sa paninirahan sa Ehipto o kabilang din ang naunang paninirahan sa Canaan
  choice: 'Sinusunod ng pangunahing teksto ang Masoretikong pagbasa: ang paninirahan ng mga anak ni Israel sa Ehipto ay 430 taon.'
  alternative: Sa ilang sinaunang saksi, kabilang sa panahong ito ang paninirahan ng mga anak ni Israel at ng kanilang mga ninuno sa Ehipto at Canaan.
  rationale: Malinaw na “sa Ehipto” lamang ang ibinigay na tekstong Masoretiko. Dahil mahalaga sa kronolohiya ang sinaunang alternatibong pagbasa, inilalahad ito sa talababa sa halip na ipasok sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “mga anak ni Israel” upang mapanatili ang anyo ng Hebreo, at “panahon ng paninirahan” upang malinaw na tagal—hindi lugar lamang—ang tinutukoy.
