base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: tl
  text: At binigyan ni Yahweh ng lingap ang bayan sa paningin ng mga Ehipsiyo, kaya ipinagkaloob nila sa mga Israelita ang mga bagay na hinihingi nila[a]. Sa gayon, sinamsaman nila ang Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “ipinahiram nila sa mga Israelita ang mga bagay na hinihingi nila.” Ang pandiwang Hebreo rito ay maaaring unawain bilang pagpapahiram o pagkakaloob ng hiniling.
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: ni Yahweh
  rationale: Ginamit ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa anyong natural sa balarilang Tagalog.
- source_word: נָתַן אֶת חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: ginawa ni Yahweh na kalugdan ng mga Ehipsiyo ang bayan
  rationale: Likas na salin sa Tagalog ng Hebreong idyomang literal na ‘nagbigay ng lingap sa bayan sa paningin ng mga Ehipsiyo’; ipinahahayag nito ang mabuting pagtanggap ng mga Ehipsiyo nang hindi nagdaragdag ng sanhi na wala sa teksto.
- source_word: וַיַּשְׁאִלוּם
  choice: ibinigay nila sa mga Israelita ang kanilang hinihingi
  rationale: Sa kontekstong ito, maaaring tumukoy ang Hiphil ng שאל sa pagpapaubaya o pagkakaloob ng hiniling. Malinaw at natural ito sa Tagalog, samantalang pinananatili sa talababa ang tradisyonal at posible ring kahulugang ‘ipinahiram.’
- source_word: וַיְנַצְּלוּ
  choice: sinamsaman nila
  rationale: Ipinahahayag ng Piel ng נצל ang pagkuha ng mga ari-arian o pananamsam; ang ‘sinamsaman’ ay malinaw at may angkop na lakas sa makabagong Tagalog.
- source_word: אֶת מִצְרָיִם
  choice: ang Ehipto
  rationale: Ang tahasang layon ay ang Ehipto bilang bansa o kabuuang lipunan, hindi lamang ang indibidwal na mga Ehipsiyo.
theological_decisions:
- issue: Kung ang וַיַּשְׁאִלוּם ay nangangahulugang ipinahiram ng mga Ehipsiyo ang mga bagay o ipinagkaloob nila ang mga hiniling
  choice: ibinigay nila sa mga Israelita ang kanilang hinihingi
  alternative: ipinahiram nila sa mga Israelita ang kanilang hinihingi
  rationale: Itinatampok ng konteksto ang mabuting pagtugon ng mga Ehipsiyo sa hinihingi ng Israel at ang kinalabasang pananamsam sa Ehipto. Hindi ipinapalagay ng pangunahing salin ang isang karaniwang pautang na inaasahang babayaran, ngunit kinikilala sa talababa ang tunay na leksikal at tradisyonal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginawang natural ang Hebreong idyomang ‘sa paningin ng’ bilang ‘kalugdan,’ at nilinaw ang mga tinutukoy ng panghalip upang maiwasan ang kalituhan sa pagitan ng bayan at ng mga Ehipsiyo.
