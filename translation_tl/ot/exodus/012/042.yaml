revisions:
- from: Iyon ay gabi ng pagbabantay para kay Yahweh[a], upang ilabas niya sila mula sa lupain ng Ehipto. Ang gabi ring ito ay gabi ng pagbabantay para kay Yahweh para sa lahat ng anak ni Israel sa lahat ng salinlahi nila.
  to: Iyon ay isang gabi ng pagbabantay para kay Yahweh, upang ilabas sila mula sa lupain ng Ehipto; ang gabing ito rin ay isang gabi ng pagbabantay para kay Yahweh, para sa lahat ng anak ni Israel sa lahat ng kanilang salinlahi.
  rationale: Pinanatili ang “gabi ng pagbabantay” bilang pare-parehong salin ng שִׁמֻּרִים at ang pangalang “Yahweh.” Inalis ang idinagdag na “niya” upang hindi gawing hayag sa Tagalog ang tagaganap na hindi hayag sa Hebreong infinitive. Itinama rin ang talababa upang ang mga alternatibo ay tumugma sa leksikal at kontekstuwal na saklaw ng salita.
