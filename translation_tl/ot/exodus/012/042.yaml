base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: tl
  text: Iyon ay isang gabi ng pagbabantay para kay Yahweh, upang ilabas sila mula sa lupain ng Ehipto; ang gabing ito rin ay isang gabi ng pagbabantay para kay Yahweh, para sa lahat ng anak ni Israel sa lahat ng kanilang salinlahi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: gabi ng pagbabantay
  rationale: Pinananatili ng parirala ang construct na “gabi ng” at ang diwa ng ugat na שׁמר—pagbabantay, pag-iingat, o pagtupad—nang hindi ito nililimitahan sa ritwal na paggunita lamang.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Likas sa Tagalog ang “para kay” para sa kaugnayan o pagtatalaga sa isang persona, habang pinananatili ang posibleng diwa na ang gabing ito ay natatanging nauukol kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang tipanang pangalan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: לְהוֹצִיאָם
  choice: upang ilabas niya sila
  rationale: Ipinahahayag ng “upang” ang layuning dala ng infinitive na may ל; ang “niya” ay tumutukoy kay Yahweh bilang gumagawa ng pagliligtas.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang אֶרֶץ, “lupain,” sa tekstong Hebreo.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: Ang gabi ring ito
  rationale: Ipinapakita ng “rin” ang mariing pagkakakilanlan at pag-uugnay ng gabing binanggit sa naunang sugnay.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: para sa lahat ng anak ni Israel
  rationale: Pinananatili ang pampamilyang anyo ng בְּנֵי יִשְׂרָאֵל sa halip na gawing pangkat-etnikong katawagang “mga Israelita.”
- source_word: לְדֹרֹתָם
  choice: sa lahat ng salinlahi nila
  rationale: Likas na Tagalog para sa nagpapatuloy na bisa o pagtupad sa magkakasunod na salinlahi.
theological_decisions:
- issue: Pagpapakahulugan sa שִׁמֻּרִים bilang pagbabantay o banal na paggunita
  choice: gabi ng pagbabantay
  alternative: gabi ng pag-iingat; gabing dapat ipagdiwang
  rationale: Pinananatili ng “pagbabantay” ang konkretong diwa ng pagiging mapagmatyag at hindi nito isinasara ang posibleng diwa ng taunang banal na pagtupad o paggunita.
- issue: Kung kaninong pagbabantay ang tinutukoy
  choice: para kay Yahweh
  alternative: pagbabantay ni Yahweh; pagbabantay para sa kapurihan ni Yahweh
  rationale: Hindi tahasang nilulutas ng Hebreo kung pangunahing tumutukoy ito sa pagbabantay ni Yahweh o sa pagbabantay/pagtupad ng Israel para sa kanya; pinananatili ng salin at talababa ang tensiyong ito.
- issue: Pangalan ng Diyos na יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na tipanang pangalan sa tekstong pinagmulan.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “gabi ng pagbabantay” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang leksikal at teolohikal na kalabuan ng Hebreo.
