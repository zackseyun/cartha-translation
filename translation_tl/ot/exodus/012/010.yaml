review_pass:
  verdict: revise
  source_fidelity: Ang dalawang utos at ang saklaw na “hanggang umaga” ay naipapahayag ng draft. Gayunman, ang “mula rito” ay deiktikong pananalita (“from here”) at hindi likas na katumbas ng מִמֶּנּוּ sa kontekstong ito, na tumutukoy sa bahagi ng handog na tinutukoy. Dapat ding ihayag ang בָּאֵשׁ bilang “sa apoy” upang mapanatili ang tahasang paraan ng pagsunog sa Hebreo.
  naturalness: Natural ang maramihang anyong “kayo/ninyo” at ang pautos na “sunugin ninyo.” Mas malinaw at mas likas ang pagbanggit ng “anuman nito” kaysa “anuman mula rito,” at ang “hanggang kinaumagahan” ay mas idiomatiko para sa hangganang temporal na tinutukoy.
  terminology: Ang “magtira” ay angkop sa natitirang pagkain ng Paskuwa. Ang “sunugin ... sa apoy” ay malinaw, marangal, at hindi nagdadagdag ng interpretasyon.
  issues:
  - severity: medium
    issue: Ang “mula rito” ay hindi angkop na pagtukoy sa bagay na tinutukoy ng panghalip.
    rationale: Sa Filipino, karaniwang tumutukoy ang “rito” sa isang lugar o sa isang bagay na itinuturo sa kasalukuyang usapan. Dito ang מִמֶּנּוּ ay mas natural na “nito,” ibig sabihin, anumang bahagi nito.
  - severity: low
    issue: Hindi tahasang naisalin ang “sa apoy.”
    rationale: Bagaman ipinahihiwatig ng “sunugin” ang apoy, tahasang nasa Hebreo ang בָּאֵשׁ. Madaling mapanatili ang detalyeng ito nang natural sa Filipino.
  revised_text: Huwag kayong magtira ng anuman nito hanggang kinaumagahan; at anumang matira hanggang kinaumagahan ay sunugin ninyo sa apoy.
