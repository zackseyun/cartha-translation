  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: tl
  text: Huwag kayong magtira ng anuman nito hanggang kinaumagahan; at anumang matira hanggang kinaumagahan ay sunugin ninyo sa apoy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: mag-iwan / magtira
  rationale: Ang Hiphil ng יתר ay nangangahulugang mag-iwan ng natira. Pinili ang “magtira” sapagkat natural ito sa Filipino kapag pagkain ang tinutukoy at malinaw na ipinagbabawal ang pagtatabi ng anumang bahagi.
- source_word: מִמֶּנּוּ
  choice: mula rito
  rationale: Ang מן na may panghalip na hulapi ay literal na “mula rito/dito.” Sa konteksto, tumutukoy ito sa pagkaing inilarawan sa naunang mga talata; idinagdag ang “anuman” sa unang sugnay upang natural na maipahayag ang saklaw ng negatibong utos.
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Tuwirang ipinapahayag nito ang hangganan ng panahon nang hindi dinaragdagan ang katiyakan o detalye ng Hebreo.
- source_word: הַנֹּתָר
  choice: anumang matira
  rationale: Ang Niphal participle ng יתר ay tumutukoy sa bagay na naiwan o natira. Ang “anumang matira” ay malinaw at likas sa modernong Filipino.
- source_word: בָּאֵשׁ
  choice: sunugin
  rationale: Sa Filipino, taglay na ng pandiwang “sunugin” ang paggamit ng apoy bilang paraan. Ang tahasang “sa apoy” ay posible ngunit kalabisan at hindi gaanong natural dito.
- source_word: תִּשְׂרֹפוּ
  choice: sunugin ninyo
  rationale: Ang imperfect sa kontekstong legal at ritwal ay may puwersa ng tuwirang utos. Ang “sunugin ninyo” ay natural, marangal, at malinaw na pautos.
theological_decisions:
- issue: Katangian ng utos tungkol sa pagkaing matitira sa Paskuwa
  choice: Tuwirang pagbabawal na sundan ng sapilitang tagubilin sa pagsunog
  alternative: Praktikal lamang na tagubilin na walang puwersang legal o ritwal
  rationale: 'Dalawang kaugnay na utos ang nasa Hebreo: huwag magtira hanggang umaga, at sunugin ang anumang matira. Hindi nagdaragdag ang salin ng simbolikong kahulugang wala sa talata.'
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang maramihang “kayo/ninyo” upang katawanin ang ikalawang panauhang maramihan ng mga pandiwang Hebreo. Walang talababa dahil walang mahalagang kalabuan na hindi kayang panatilihin ng pangunahing teksto.
