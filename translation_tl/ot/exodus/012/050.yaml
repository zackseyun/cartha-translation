  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: tl
  text: Ang ginawa ng lahat ng mga anak ni Israel[b] ay ayon sa iniutos ni Yahweh[a] kina Moises at Aaron; gayon nga ang ginawa nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebreo YHWH; tradisyonal na isinasaling “ang PANGINOON.”
    reason: alternative_reading
  - marker: b
    text: Ang “mga anak ni Israel” ay maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ginawa
  rationale: Ang עשה ay karaniwang nangangahulugang “gawin.” Sa konteksto ng pagsunod sa utos, natural ang “ginawa,” at pinananatili nito ang pag-uulit ng pandiwa sa hulihan.
- source_word: כָּל
  choice: lahat ng
  rationale: Ipinahihiwatig ng כָּל ang kabuuan ng grupong tinutukoy.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang pormal at pampamilyang anyo ng Hebreong “mga anak ni Israel,” na maaari ring unawain bilang kolektibong tawag sa mga Israelita.
- source_word: כַּאֲשֶׁר
  choice: ang ayon sa
  rationale: Ipinapahayag nito na ang ginawa nila ay kaayon ng iniutos; natural ito sa modernong Tagalog sa loob ng pangungusap.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang aspektong naganap ay angkop dahil nauna ang utos sa kanilang pagsunod; hindi kailangang gawing tahasang pluperfect sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Sina Moises at Aaron ang tuwirang pinag-utusan ni Yahweh. Ang “kina” ay likas na Tagalog para sa dalawang personal na pangalang layon.
- source_word: כֵּן עָשׂוּ
  choice: gayon nga ang ginawa nila
  rationale: Pinananatili ang mariing paglalagom at ang pag-uulit ng עשה, habang nananatiling natural at marangal sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon, samantalang ang “PANGINOON” ang tradisyonal na pamalit na titulo.
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang pampamilya at pormal na ekspresyon ng Hebreo. Nililinaw sa talababa ang natural na kolektibong kahulugan nito.
- issue: Kaugnayan nina Moises at Aaron sa pandiwang צִוָּה
  choice: iniutos ... kina Moises at Aaron
  alternative: iniutos sa pamamagitan nina Moises at Aaron
  rationale: Minamarkahan sila ng Hebreo bilang mga tuwirang layon ng pandiwa—sila ang pinag-utusan. Hindi tahasang sinasabi rito ng gramatika ang “sa pamamagitan.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng pandiwang “ginawa” upang maipakita ang diin ng Hebreo sa ganap na pagsunod. Ang dalawang talababa ay kapuwa may katugmang pananda sa pangunahing teksto.
