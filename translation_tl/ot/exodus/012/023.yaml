revisions:
- from: Sapagkat daraan si Yahweh upang salutin ang Ehipto, at kapag nakita niya ang dugo sa biga sa itaas ng pinto at sa dalawang haligi ng pinto, lalampasan ni Yahweh ang pasukan[a] at hindi niya pahihintulutang pumasok ang tagapuksa sa inyong mga bahay upang manalot.[b]
  to: Sapagkat daraan si Yahweh upang salutin ang Ehipto, at kapag nakita niya ang dugo sa pahalang na biga ng pintuan at sa dalawang hamba nito, lalampasan ni Yahweh ang pintuan[a] at hindi niya pahihintulutang pumasok sa inyong mga bahay ang tagapuksa[b] upang manalot.
  rationale: 'Inayos ang mga katawagan para sa mga bahagi ng pintuan upang mas malapit sa Hebreo, at inilipat ang marker b sa salitang ipinaliliwanag nito. Hindi binago ang kahulugan: nananatiling magkaiba si Yahweh at ang di-tinukoy na tagapuksa, at nananatili ang ‘lalampasan’ bilang salin ng mahalagang pandiwang פסח.'
