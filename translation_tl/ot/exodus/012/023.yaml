  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: tl
  text: Sapagkat daraan si Yahweh upang salutin ang Ehipto, at kapag nakita niya ang dugo sa pahalang na biga ng pintuan at sa dalawang hamba nito, lalampasan ni Yahweh ang pintuan[a] at hindi niya pahihintulutang pumasok sa inyong mga bahay ang tagapuksa[b] upang manalot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring mangahulugang “iligtas” o “ipagsanggalang.” Ang pandiwang Hebreo rito ang pandiwang kaugnay ng Paskuwa.
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy ng Hebreo kung sino ang “tagapuksa”; inuunawa ito ng ilan bilang isang anghel na tagapagdulot ng hatol.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וְעָבַר
  choice: daraan
  rationale: Ipinahahayag ang pagkilos ni Yahweh sa gitna ng Ehipto; iniiba ito sa mahalagang pandiwang פסח sa kasunod na sugnay.
- source_word: לִנְגֹּף / לִנְגֹּף
  choice: upang salutin / upang manalot
  rationale: Ang נגף ay tumutukoy rito sa nakamamatay na paghampas bilang hatol. Ginamit ang magkaugnay na likas na salitang Filipino ayon sa kani-kanilang layon.
- source_word: הַמַּשְׁקוֹף
  choice: biga sa itaas ng pinto
  rationale: Mas madaling maunawaan ng karaniwang mambabasa kaysa sa teknikal na 'lintel' at tumpak na tumutukoy sa pahalang na bahagi sa itaas ng balangkas ng pinto.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: dalawang haligi ng pinto
  rationale: Tumutukoy sa dalawang patayong bahagi ng balangkas ng pinto at natural sa modernong Filipino.
- source_word: וּפָסַח
  choice: lalampasan
  rationale: Pinananatili ang pangunahing larawan ng פסח at ang ugnay nito sa Paskuwa, habang kinikilala sa talababa ang maaaring diwang 'ililigtas' o 'ipagsasanggalang.'
- source_word: עַל הַפֶּתַח
  choice: ang pasukan
  rationale: Ang פתח ay ang bukana o pasukan ng bahay; iniiwasan nitong ipakahulugang mismong dahon ng pinto.
- source_word: וְלֹא יִתֵּן
  choice: hindi niya pahihintulutan
  rationale: Likas na salin ng idyomang נתן kasunod ng pawatas, na nangangahulugang hindi papayagan.
- source_word: הַמַּשְׁחִית
  choice: ang tagapuksa
  rationale: Isinasalin ang tinutukoy na tagaganap ng pagpuksa nang hindi dinaragdagan ng salitang 'anghel,' na wala sa Hebreo.
theological_decisions:
- issue: Ang kaugnayan ni Yahweh at ng tagapuksa
  choice: 'Kapuwa binanggit nang magkahiwalay: gumagawa si Yahweh ng paghatol at hindi niya pinahihintulutang pumasok ang tagapuksa sa mga bahay ng Israel.'
  alternative: Ituring ang tagapuksa bilang isa pang tawag kay Yahweh, o tukuyin ito bilang isang anghel.
  rationale: Pinag-iiba ng Hebreo ang יְהוָה at הַמַּשְׁחִית. Pinananatili ng salin ang pagkakaibang iyon ngunit hindi ipinapasiya ang pagkakakilanlan ng tagapuksa.
- issue: Kahulugan ng פסח
  choice: Isinalin bilang 'lalampasan' sa pangunahing teksto.
  alternative: Ililigtas o ipagsasanggalang.
  rationale: Pinananatili nito ang larawang pandiwa at ang mahalagang ugnay sa Paskuwa, samantalang ang konteksto mismo ang nagpapakita ng bunga nitong proteksiyon.
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Ginamit ang 'biga sa itaas ng pinto' bilang madaling maunawaang paglalarawan ng lintel, at 'tagapuksa' upang mapanatili ang di-tiyak na pagkakakilanlan ng ahente. Ang dalawang talababa ay may katugmang marker sa pangunahing teksto.
