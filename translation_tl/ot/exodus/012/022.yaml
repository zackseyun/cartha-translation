  verdict: revise
  source_fidelity: 'Ang pangunahing diwa at mga kilos sa Hebreo ay wastong naihahatid: pagkuha ng bigkis ng isopo, pagsawsaw sa dugong nasa sisidlan, paglalagay ng dugo sa itaas at magkabilang gilid ng pintuan, at pagbabawal lumabas hanggang umaga. Ang “palanggana” ay isang makatwirang pangunahing salin ng הַסַּף sa kontekstong ito. Gayunman, ang alternatibo sa talababa na “bungad ng pinto” ay hindi sapat na tiyak para sa ‘threshold’; mas angkop ang “sahig ng pintuan” o “sahigan.”'
  naturalness: Natural at malinaw sa pangkalahatan ang modernong Tagalog. Ang “mga poste sa magkabilang gilid ng pintuan” ay mas tiyak at mas karaniwang larawan ng doorposts kaysa “mga haligi ng pinto,” na maaaring magpahiwatig ng mga kolum. Ang pag-uugnay sa ikalawang utos sa pamamagitan ng “at” ay mas malapit din sa payak na pagdurugtong ng Hebreo kaysa “Pagkatapos.”
  terminology: Ang “isopo,” “palanggana,” at “biga sa itaas ng pintuan” ay angkop. Pinananatili ang hindi tiyak na botanikal na katawagan na “isopo.” Inayos ang talababa upang ang leksikal na alternatibo para sa הַסַּף ay tunay na ‘threshold,’ hindi lamang ang mas malawak na ‘entrance.’
  issues:
