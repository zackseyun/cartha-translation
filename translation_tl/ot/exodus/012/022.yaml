    issue: Hindi tumpak ang alternatibong “bungad ng pinto” sa talababa para sa הַסַּף.
    rationale: Ang ‘bungad’ ay pasukan o bukasan; samantalang ang leksikal na alternatibong tinutukoy ng audit trail ay ‘threshold.’ Dapat itong isalin nang mas tiyak bilang “sahig ng pintuan” (o “sahigan”) upang mapanatili ang tunay na ambigwidad.
  - severity: low
    issue: Ang “mga haligi ng pinto” ay mas malabo kaysa kinakailangan para sa dalawang patayong doorposts.
    rationale: Mas malinaw na ipinahihiwatig ng “mga poste sa magkabilang gilid ng pintuan” ang dalawang patayong bahagi ng kuwadro ng pinto.
