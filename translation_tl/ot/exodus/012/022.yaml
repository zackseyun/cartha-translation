  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: tl
  text: Kumuha kayo ng isang bigkis ng isopo at isawsaw ninyo ito sa dugong nasa palanggana[a], at idampi ninyo sa biga sa itaas ng pintuan at sa dalawang poste sa magkabilang gilid ng pintuan ang ilan sa dugong nasa palanggana. Walang sinuman sa inyo ang lalabas sa pintuan ng kanyang bahay hanggang umaga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sahig ng pintuan” sa halip na “palanggana” (Hebreo, saf). Mas pinili rito ang “palanggana” sapagkat sinasabing naroon ang dugo at doon isinasawsaw ang isopo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: isang bigkis ng isopo
  rationale: Ang אֲגֻדָּה ay isang kumpol na pinagsama o itinali. Likas at kongkreto ang “bigkis,” at pinananatili ng “isopo” ang nakaugaliang tawag sa halamang ginagamit sa ritwal kahit hindi tiyak ang eksaktong uring botanikal nito.
- source_word: בַּדָּם
  choice: sa dugo
  rationale: Kasama ng pandiwang טבל (“isawsaw”), ipinahihiwatig ng pang-ukol na ב ang bagay na pinaglulubugan; natural sa Tagalog ang “isawsaw … sa dugo.”
- source_word: הַסַּף
  choice: palanggana
  rationale: Ang dugong sinasabing nasa loob nito at ang pagsawsaw ng isopo rito ay malakas na nagpapahiwatig ng isang sisidlan. Gayunman, pinanatili sa talababa ang posibleng kahulugang “bungad ng pinto.”
- source_word: וְהִגַּעְתֶּם
  choice: idampi ninyo
  rationale: Ang Hiphil ng נגע ay tumutukoy rito sa pagpapadikit o pagpapadampi sa isang ibabaw. Mas malapit sa kongkretong kilos ang “idampi” kaysa sa mas interpretatibong “ipahid.”
- source_word: הַמַּשְׁקוֹף
  choice: biga sa itaas ng pinto
  rationale: Tumutukoy ito sa pahalang na bahagi sa ibabaw ng pintuan. Mas madaling maunawaan ng karaniwang mambabasa ang pariralang ito kaysa sa teknikal na salitang “lintel.”
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: dalawang haligi ng pinto
  rationale: Tumutukoy ang מְזוּזוֹת sa dalawang patayong poste sa magkabilang gilid ng pintuan; malinaw at natural ang “mga haligi ng pinto.”
- source_word: מִן הַדָּם
  choice: ang ilan sa dugo
  rationale: Ipinahihiwatig ng מִן na bahagi ng dugong nasa sisidlan ang gagamitin. Ginagawang malinaw ng “ilan sa dugo” ang partitive na diwa nang hindi dinaragdagan ang kilos.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: Walang sinuman sa inyo ang lalabas
  rationale: May distributibong diwa ang אִישׁ pagkatapos ng pangmaramihang pagbabawal. Natural na ipinapahayag ito sa Tagalog ng “walang sinuman sa inyo.”
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: sa pintuan ng kanyang bahay
  rationale: Ang פֶּתַח ay ang bukasan o pasukan. Pinananatili ng “kanyang bahay” ang isahang distributibong anyo ng Hebreo habang natural sa Tagalog.
- source_word: עַד בֹּקֶר
  choice: hanggang umaga
  rationale: Direkta at natural na katumbas ito ng temporal na parirala.
theological_decisions:
- issue: Ang may-kasariang distributibong pahayag na אִישׁ ... בֵּיתוֹ
  choice: Walang sinuman sa inyo ang lalabas sa pintuan ng kanyang bahay
  alternative: Walang sinuman sa inyo ang lalabas sa mga pintuan ng inyong mga bahay
  rationale: Pinananatili ang isahang distributibong ayos ng Hebreo sa “kanyang bahay.” Sa modernong Tagalog, hindi likas na nagtatakda ng kasarian ang “sinuman” at “kanyang”; saklaw ng utos ang bawat taong kabilang sa kausap, hindi lamang ang mga lalaki.
- issue: Kahulugan ng הַסַּף sa talatang ito
  choice: palanggana
  alternative: bungad ng pinto
  rationale: Mas sinusuportahan ng agarang konteksto ang sisidlan sapagkat nasa loob nito ang dugo at dito isinasawsaw ang isopo. Sapagkat tunay na posibleng leksikal ang “bungad ng pinto,” hindi ito inalis kundi inilagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “biga sa itaas ng pinto” sa halip na teknikal na “lintel,” at “idampi” upang mapanatili ang kongkreto at hindi labis na interpretatibong kilos. Ang pag-uulit ng “dugong nasa palanggana” ay sumusunod sa diin at estruktura ng Hebreo.
