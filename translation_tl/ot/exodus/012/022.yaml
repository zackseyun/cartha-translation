revisions:
- from: Kumuha kayo ng isang bigkis ng isopo at isawsaw ninyo iyon sa dugong nasa palanggana[a]. Pagkatapos, idampi ninyo sa biga sa itaas ng pinto at sa dalawang haligi ng pinto ang ilan sa dugong nasa palanggana. Walang sinuman sa inyo ang lalabas sa pintuan ng kanyang bahay hanggang umaga.
  to: Kumuha kayo ng isang bigkis ng isopo at isawsaw ninyo ito sa dugong nasa palanggana[a], at idampi ninyo sa biga sa itaas ng pintuan at sa dalawang poste sa magkabilang gilid ng pintuan ang ilan sa dugong nasa palanggana. Walang sinuman sa inyo ang lalabas sa pintuan ng kanyang bahay hanggang umaga.
