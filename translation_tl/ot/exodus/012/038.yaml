revisions:
- from: Kasama rin nilang umalis ang isang malaking halu-halong pangkat[a], pati ang napakarami nilang kawan at bakahan.
  to: Umalis ding kasama nila ang isang malaking halu-halong pangkat[a], at mga kawan at mga baka—napakaraming alagang hayop.
  rationale: Inayos ang ayos ng pangungusap upang maging mas malinaw ang “kasama nila,” pinalitan ang “bakahan” ng “mga baka,” at inalis ang hindi tahasang pagmamay-ari sa “nilang.” Pinanatili ang idyomatikong “umalis,” ang dami ng pangkat, at ang pagbibigay-diin sa napakaraming alagang hayop. Pinaiikli rin ng talababa ang paliwanag upang hindi nito tukuyin nang lampas sa teksto ang uri ng pagkakaiba-iba ng pangkat.
