  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: tl
  text: Huwag kayong kakain ng anumang pinaalsa[a]. Sa lahat ng lugar na tinitirhan ninyo[b], kakain kayo ng tinapay na walang pampaalsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “anumang may pampaalsa.” Mas malawak kaysa tinapay lamang ang salitang Hebreo at tumutukoy sa anumang pagkaing pinaalsa.
    reason: lexical_alternative
  - marker: b
    text: O “sa lahat ng inyong pamayanan.” Tumutukoy ang parirala sa bawat lugar na tinitirhan ninyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: anumang may pampaalsa
  rationale: Sa isang pagbabawal, ipinahihiwatig ng כָּל kasama ng מַחְמֶצֶת na walang anumang pinaalsa ang maaaring kainin. Hindi ito nililimitahan sa tinapay lamang.
- source_word: לֹא תֹאכֵלוּ
  choice: Huwag kayong kakain
  rationale: Natural itong makabagong Tagalog para sa tuwirang pagbabawal, habang pinananatili ang marangal at legal na himig.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: Sa lahat ng lugar na inyong tinitirhan
  rationale: Saklaw ng מוֹשָׁב ang tirahan o pamayanan. Malinaw na ipinapahayag ng salin na umiiral ang utos saanman sila naninirahan.
- source_word: תֹּאכְלוּ
  choice: ang inyong kakainin
  rationale: Ipinapahayag nito ang positibong utos at pinananatili ang pagkakatapat nito sa naunang pagbabawal.
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Ito ang malinaw at madaling maunawaang katumbas ng tinapay na inihanda nang walang pampaalsa.
