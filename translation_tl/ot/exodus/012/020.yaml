translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pampaalsa” bilang karaniwang salitang madaling maunawaan; pinanatili sa talababa ang mas literal na “pinaalsa” at ang alternatibong “mga pamayanan.”
