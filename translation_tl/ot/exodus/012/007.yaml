  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: tl
  text: At kukuha sila ng kaunting dugo at ilalagay iyon sa dalawang haligi ng pinto at sa biga sa ibabaw ng pinto ng mga bahay kung saan nila iyon kakainin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “kung saan nila iyon kinakain.” Maaaring ipahayag ng Hebreong imperfect ang panghinaharap o ang karaniwang kilos sa ganitong konteksto ng tagubilin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: At kukuha sila
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubiling ito ay may puwersang hinaharap at nag-uutos; likas sa modernong Tagalog ang simpleng anyong panghinaharap.
- source_word: מִן הַדָּם
  choice: ng kaunting dugo
  rationale: 'Partitibo ang מִן: bahagi lamang ng dugo ang kukunin, hindi ang lahat nito.'
- source_word: וְנָתְנוּ
  choice: at ilalagay iyon
  rationale: Saklaw ng נתן ang diwang ‘ilagay’; malinaw at kongkreto ito sa konteksto ng ritwal.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: sa dalawang haligi ng pinto
  rationale: Tumutukoy ang מְזוּזוֹת sa dalawang patayong poste sa magkabilang gilid ng pintuan; mas madaling maunawaan ng karaniwang mambabasa ang ‘mga haligi ng pinto.’
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: at sa biga sa ibabaw ng pinto
  rationale: Ang מַשְׁקוֹף ay ang pahalang na biga sa itaas ng pintuan; inilalarawan ito sa halip na gumamit ng teknikal at di-karaniwang terminong arkitektural.
- source_word: עַל הַבָּתִּים
  choice: ng mga bahay
  rationale: Bagaman karaniwang ‘sa ibabaw ng’ ang עַל, inuugnay rito ng parirala ang mga bahagi ng pintuan sa mga bahay; natural sa Tagalog ang ‘ng mga bahay.’
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: kung saan nila iyon kakainin
  rationale: Binabago ng sugnay ang ‘mga bahay.’ Pinananatili ng panghinaharap na ‘kakainin’ ang posibleng hinaharap na diwa ng imperfect sa kontekstong nagbibigay ng tagubilin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang ‘biga sa ibabaw ng pinto’ upang maging tiyak nang hindi umaasa sa teknikal na salitang ‘lintel.’ Ang panghalip na ‘iyon’ ay nagpapanatili sa pagtukoy ng Hebreo sa hayop na kakainin, na malinaw mula sa naunang konteksto.
