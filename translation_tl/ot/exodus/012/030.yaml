base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: tl
  text: Bumangon nang gabing iyon ang Paraon, ang lahat ng kanyang mga lingkod, at ang buong Ehipto.[a] Nagkaroon ng matinding sigaw sa Ehipto, sapagkat walang bahay na walang namatay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “buong Ehipto” ay sama-samang tumutukoy sa mga mamamayan ng Ehipto.
    reason: cultural_note
  - marker: b
    text: 'Mas literal: “walang bahay na walang taong patay roon.” Maaari ring saklawin ng “bahay” ang sambahayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Bumangon
  rationale: Ang Qal wayyiqtol ng קום ay payak na kilos sa salaysay. Ang “bumangon” ay natural at hindi nagdaragdag ng dahilan o damdamin.
- source_word: לַיְלָה הוּא
  choice: nang gabing iyon
  rationale: Ang parirala ay idyomatikong tumutukoy sa tiyak na gabing iyon. Malinaw at natural ito sa makabagong Tagalog.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng palasyo, tumutukoy ito sa mga tauhan o tagapaglingkod ng Paraon; hindi kinakailangang idiin dito ang katayuang alipin.
- source_word: וְכָל מִצְרַיִם
  choice: at ang buong Ehipto
  rationale: Pinananatili ang metonimiya ng Hebreo, kung saan ang pangalan ng lupain ay sama-samang tumutukoy sa mga mamamayan nito.
- source_word: צְעָקָה גְדֹלָה
  choice: matinding sigaw
  rationale: Ang צְעָקָה ay sigaw o daing na bunga ng matinding paghihirap. Inilalahad ng “matinding sigaw” ang lakas at bigat nito nang hindi nililimitahan sa isang partikular na anyo ng pagdadalamhati.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng matinding sigaw at ang “sapagkat” ay angkop sa marangal na salaysay.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: walang bahay na walang namatay
  rationale: Pinananatili nito ang mariing dobleng pagkakait ng Hebreo at ang literal na “bahay,” habang natural pa rin sa Tagalog.
- source_word: מֵת
  choice: namatay
  rationale: Bagaman substantibal ang anyo at maaaring isaling “taong patay,” mas natural sa Tagalog ang “may namatay” sa ganitong pahayag, nang hindi tinutukoy kung sino ang namatay.
