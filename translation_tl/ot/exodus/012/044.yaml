  source_fidelity: 'Tumpak na naihahatid ang pangunahing kahulugan: ang alipin ng isang lalaki na binili kapalit ng pilak ay maaari lamang makikain matapos siyang tuliin. Ang “alipin,” ang panlalaking “lalaki,” ang tuwirang “mo,” at ang di-tiyak na “nito” ay naaayon sa Hebreo.'
  naturalness: Kailangan ng munting pag-aayos. Ang “na binili sa pilak” ay hindi gaanong likas sa modernong Filipino at maaaring pansamantalang magmukhang ang lalaki ang binili. Ang “kapalit ng pilak” ay mas natural at mas malinaw na katumbas ng pagbiling gamit ang pilak.
