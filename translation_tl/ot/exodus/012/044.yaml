  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: tl
  text: Ngunit ang bawat alipin ng isang lalaki, na binili kapalit ng pilak—kapag natuli mo na siya, saka siya maaaring kumain nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל
  choice: Ngunit ang bawat
  rationale: Iniuugnay ng וְ ang tuntuning ito sa naunang pagbabawal sa mga dayuhan; ipinahihiwatig ng “Ngunit” ang kaibahan, habang pinananatili ng “bawat” ang distributibong puwersa ng כָּל.
- source_word: עֶבֶד
  choice: alipin
  rationale: Dahil tahasang binanggit ang pagbili sa kaniya, ang salita ay tumutukoy sa isang taong nasa kalagayang pag-aari at pagkakagapos, hindi lamang sa isang karaniwang lingkod.
- source_word: אִישׁ
  choice: ng isang lalaki
  rationale: Pinananatili nito ang panlalaking isahan ng Hebreo at tinutukoy ang lalaking nagmamay-ari, nang hindi ipinapalit ang mas interpretatibong “puno ng sambahayan.”
- source_word: מִקְנַת כָּסֶף
  choice: na binili sa pilak
  rationale: Malapit ito sa larawang Hebreo ng pagkuha kapalit ng pilak; sa konteksto, malinaw na nangangahulugan itong binili bilang alipin.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: kapag natuli mo na siya
  rationale: Ipinakikita ng ayos ng legal na pahayag na ang pagtutuli ay kailangang mauna. Pinananatili rin nito ang tuwirang ikalawang panauhang isahan, bagaman ginamit ang natural na pokus sa layon sa Filipino.
- source_word: אָז
  choice: saka
  rationale: Ang “saka” ay likas na Filipino para sa bunga o susunod na hakbang matapos matupad ang kundisyon.
- source_word: יֹאכַל בּוֹ
  choice: siya maaaring kumain nito
  rationale: Sa kontekstong legal, ang di-ganap na pandiwa ay nagpapahayag ng pahintulot na makibahagi sa pagkain; ang “nito” ay natural na tumutukoy sa Paskuwa o handa ng Paskuwa.
theological_decisions:
- issue: Pagtukoy sa kalagayang alipin sa kontekstong legal at tipan
  choice: alipin
  alternative: lingkod
  rationale: Ang tahasang pagbili sa pamamagitan ng pilak ay ginagawang mahalagang bahagi ng kahulugan ang pag-aari at pagkakagapos. Hindi dapat pagaanin ng salin ang institusyong inilalarawan ng teksto.
- issue: Panlalaking anyo ng אִישׁ
  choice: ng isang lalaki
  alternative: ng isang tao
  rationale: Pinananatili ng salin ang panlalaking isahan ng tekstong Hebreo at ang papel nito bilang kinatawang legal na paksa, nang hindi ginagawang neutral ang kasarian.
- issue: Likas na di-tiyak na tinutukoy ng בּוֹ
  choice: nito
  alternative: sa pagkain ng Paskuwa
  rationale: Pinananatili ng “nito” ang panghalip ng Hebreo at ang pag-asa nito sa naunang konteksto, sa halip na isingit sa pangunahing teksto ang tahasang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alipin” upang tapat na ilarawan ang kalagayang legal, “pilak” upang mapanatili ang konkretong larawan ng Hebreo, at “saka” upang natural na ipahayag ang pagkakasunod at kundisyon.
