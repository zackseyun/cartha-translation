  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: tl
  text: At kapag sinabi sa inyo ng mga anak ninyong lalaki, “Ano ang paglilingkod na ito para sa inyo?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ano ang kahulugan ng paglilingkod na ito para sa inyo?”
    reason: Nagbibigay ito ng mas likas na pagpapahayag sa Tagalog ng posibleng idyomatikong diwa ng Hebreong “Ano ang paglilingkod na ito sa/para sa inyo?” nang hindi iyon ipinapalit sa mas pormal na pangunahing salin.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Ang pormulang Hebreo ay nagpapakilala ng isang pangyayaring inaasahang magaganap sa hinaharap. Likas itong ipinahahayag sa Tagalog bilang “At kapag.”
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: sinabi sa inyo
  rationale: Pinananatili ang karaniwang kahulugan ng אמר na “sabihin” sa halip na gawing “magtanong,” bagaman tanong ang kasunod na pananalita.
- source_word: בְּנֵיכֶם
  choice: inyong mga anak na lalaki
  rationale: Tiyak na panlalaking pangmaramihan ang salitang Hebreo, kaya hindi ito ginawang pangkalahatang “mga anak.”
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ang paglilingkod na ito
  rationale: Maaaring tumukoy ang עֲבֹדָה sa gawain, paglilingkod, o ritwal na paglilingkod. Pinananatili ng “paglilingkod” ang lawak nito sa konteksto ng Paskuwa nang hindi agad nililimitahan sa “seremonya” o “pagsamba.”
- source_word: מָה ... לָכֶם
  choice: Ano ... para sa inyo?
  rationale: Malapit ito sa anyo ng Hebreo at pinananatili ang posibleng tanong tungkol sa kaugnayan o kabuluhan ng paglilingkod sa sambayanan, sa halip na tahasang idagdag sa pangunahing teksto ang salitang “kahulugan.”
