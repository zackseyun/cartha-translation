translation_notes:
  register: Makabago at marangal na Tagalog. Ang “sinabi” ay sadyang pinanatili sa halip na “tinanong,” at ang bahagyang pormal na “Ano ang paglilingkod na ito para sa inyo?” ay nagpapanatili sa anyo at tunay na kalabuan ng Hebreo; inilagay sa talababa ang mas idyomatikong pagbasa.
