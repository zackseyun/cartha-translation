  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: tl
  text: Mahigpit na pinilit ng mga Ehipsiyo ang bayan na magmadaling umalis sa lupain, sapagkat sinabi nila, “Mamamatay tayong lahat!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל הָעָם
  choice: Mahigpit na pinilit ng mga Ehipsiyo ang bayan
  rationale: Ang חזק na may עַל ay nagpapahiwatig ng matinding paggigiit o pamimilit. Ang “mahigpit na pinilit” ay likas sa Filipino at ipinakikita ang bigat ng panggigipit nang hindi ipinapalagay na pisikal na dahas ito. Ang מִצְרַיִם ay kolektibong tumutukoy sa mga Ehipsiyo.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: na magmadaling umalis
  rationale: Ang magkasunod na pawatas ay naghahayag ng layunin at matinding pagmamadali. Bagaman literal na may diwang “madaliin ang pagpapaalis sa kanila,” ang “magmadaling umalis” ay malinaw at natural, at ang causative na puwersa ay naipahahayag na ng “pinilit.”
- source_word: מִן הָאָרֶץ
  choice: sa lupain
  rationale: Sa Filipino, ang “umalis sa lupain” ay natural na katumbas ng paglabas mula sa lupain. Pinananatili ng “lupain” ang הָאָרֶץ sa halip na tahasang ipalit ang “Ehipto.”
- source_word: כִּי אָמְרוּ
  choice: sapagkat sinabi nila
  rationale: Ipinakikilala ng כִּי ang dahilan ng kanilang matinding pagmamadali; ang “sapagkat” ay angkop sa marangal na salaysay.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Mamamatay tayong lahat!
  rationale: Ang participle מֵתִים ay maaaring maglarawan ng kasalukuyan o napipintong kamatayan. Sa konteksto ng takot matapos ang salot, ipinahahayag ng natural na Filipino na “Mamamatay tayong lahat!” ang kanilang paniniwalang wala nang makaliligtas, nang hindi awkward na sabihing buhay pa silang “patay na.”
theological_decisions:
- issue: Kung ang מֵתִים ay nangangahulugang patay na, namamatay, o tiyak na mamamatay
  choice: Mamamatay tayong lahat!
  alternative: Patay tayong lahat! / Namamatay tayong lahat!
  rationale: Pinananatili ng salin ang napipintong at tiyak na panganib na ipinahahayag sa konteksto, ngunit hindi ipinapakahulugang literal na patay na ang mga nagsasalita. Isa itong kontekstuwal at panggramatikang pasiya, hindi doktrinal na pagpapaliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa Israel bilang kolektibong grupo at “mga Ehipsiyo” para sa kolektibong paksa. Walang talababa dahil naipahayag sa natural na sintaks ang pagmamadaling taglay ng dalawang magkasunod na pawatas.
