source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: tl
  text: Sa loob ng pitong araw, walang pampaalsa ang matatagpuan sa inyong mga bahay. Sapagkat sinumang kumain ng anumang may pampaalsa, ang taong iyon ay puputulin[a] mula sa sambayanan[b] ng Israel, maging dayuhang naninirahan[c] o katutubo ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang idyomang literal na “puputulin.” Maaaring tumukoy ito sa pagpapaalis, kamatayan, o paghatol ng Diyos, ayon sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “kapulungan” o “pamayanan.”
    reason: lexical_alternative
  - marker: c
    text: Tumutukoy sa dayuhang naninirahan sa gitna ng Israel, hindi lamang sa isang panandaliang bisita.
    reason: lexical_clarification
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sa loob ng pitong araw
  rationale: Ipinahahayag nito ang buong tagal ng ipinag-uutos at natural ito sa makabagong Tagalog.
- source_word: שְׂאֹר
  choice: pampaalsa
  rationale: Tumutukoy ito sa sangkap na nagpapaalsa, hindi sa lahat ng pagkaing pinaalsa.
- source_word: לֹא יִמָּצֵא
  choice: walang ... na matatagpuan
  rationale: Pinananatili ang anyong pasibo at ang diwa ng mahigpit na pagbabawal sa pagkanaroroon nito.
- source_word: בְּבָתֵּיכֶם
  choice: sa inyong mga bahay
  rationale: Tuwirang pinananatili ang maramihang anyo at ang pagtukoy sa mga tirahan ng Israel.
- source_word: כָּל אֹכֵל מַחְמֶצֶת
  choice: sinumang kumain ng anumang may pampaalsa
  rationale: Ipinapakita ang pangkalahatang saklaw ng כָּל at hindi nililimitahan sa tinapay lamang ang מַחְמֶצֶת.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon ay aalisin
  rationale: Ang נֶפֶשׁ ay tumutukoy rito sa buong tao. Ang 'aalisin' ay nagpapanatili sa bigat ng parusang pangtipan nang hindi tiyakang ipinapakahulugan bilang kamatayan o simpleng pagpapatalsik.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: mula sa sambayanan ng Israel
  rationale: Ang 'sambayanan' ay natural at marangal na katumbas para sa Israel bilang sama-samang pamayanang pangtipan.
- source_word: בַּגֵּר
  choice: dayuhang naninirahan
  rationale: Tumutukoy sa isang hindi katutubo na permanenteng o matagal nang naninirahan sa gitna ng Israel, hindi sa panandaliang bisita.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: o katutubo ng lupain
  rationale: Malinaw nitong pinananatili ang kaibahan sa dayuhang naninirahan nang hindi nag-aangkat ng makabagong kategoryang pampolitika gaya ng pagkamamamayan.
theological_decisions:
- issue: Kahulugan ng parusang וְנִכְרְתָה, 'aalisin'
  choice: Panatilihin ang sadyang hindi tiyak na parusang pangtipan sa saling 'aalisin.'
  alternative: Papatayin; ititiwalag sa pamayanan; hahatulan ng Diyos.
  rationale: Hindi tahasang nililinaw ng parirala sa talatang ito kung ang kaparusahan ay kamatayan, pagpapatalsik, o tuwirang paghatol ng Diyos. Hindi dapat lutasin ng salin ang nananatiling tensiyon sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang 'pampaalsa' at 'dayuhang naninirahan' upang maging madaling maunawaan ng karaniwang mambabasa, habang pinanatili sa talababa ang tunay na kalabuan ng parusang pangtipan.
