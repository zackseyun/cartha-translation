  to: Sa loob ng pitong araw, walang pampaalsa ang matatagpuan sa inyong mga bahay. Sapagkat sinumang kumain ng anumang may pampaalsa, ang taong iyon ay puputulin[a] mula sa sambayanan[b] ng Israel, maging dayuhang naninirahan[c] o katutubo ng lupain.
