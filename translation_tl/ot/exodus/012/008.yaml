  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: tl
  text: Kakainin nila nang gabing iyon[a] ang karne na inihaw sa apoy[b]; kakainin nila ito kasama ng tinapay na walang pampaalsa at mapapait na gulay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gabing ito.” Literal sa Hebreo ang “sa gabing ito,” na tumutukoy sa tiyak na gabi ng pagkain ng Paskuwa.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inihaw gamit ang apoy.” Binibigyang-diin ng pariralang Hebreo na dapat itong lutuin sa pag-ihaw, hindi sa ibang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Kakainin nila
  rationale: Sa kontekstong nagbibigay ng tagubilin, ang pandiwa ay may puwersang pautos o nagtatakda ng dapat gawin. Likas sa modernong Tagalog ang anyong hinaharap na “Kakainin nila” para rito.
- source_word: הַבָּשָׂר
  choice: ang karne
  rationale: Bagaman maaari itong literal na tumukoy sa “laman,” ang “karne” ang malinaw at natural na salita sa konteksto ng pagkain.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: nang gabing iyon
  rationale: Tumutukoy ito sa tiyak na gabing itinakda para sa pagkain ng Paskuwa. Natural sa salaysay at tagubilin ang “nang gabing iyon,” samantalang nananatiling posible ang mas literal na “sa gabing ito.”
- source_word: צְלִי אֵשׁ
  choice: inihaw sa apoy
  rationale: Ipinahahayag nito ang pagluluto sa pamamagitan ng pag-ihaw sa apoy, na mahalaga bilang kaibahan sa pagpapakulo sa kasunod na talata.
- source_word: וּמַצּוֹת
  choice: kasama ng tinapay na walang pampaalsa
  rationale: Ang מַצּוֹת ay tinapay o mga tinapay na walang pampaalsa. Ginawang tahasan ang ugnayang “kasama ng” upang maging natural sa Tagalog.
- source_word: עַל
  choice: kasama ng
  rationale: Bagaman karaniwan itong nangangahulugang “sa ibabaw ng,” sa kontekstong ito ay nagpapahiwatig ito ng mga pagkaing kasabay na kinakain.
- source_word: מְרֹרִים
  choice: mapapait na gulay
  rationale: Ang pangngalan ay tumutukoy sa mapapait na halamang kinakain sa hapunan ng Paskuwa. Ang “mapapait na gulay” ay malinaw at karaniwang mauunawaan sa modernong Tagalog.
- source_word: יֹאכְלֻהוּ
  choice: kakainin nila ito
  rationale: Pinananatili ang pag-uulit sa Hebreo at ang panghalip na tumutukoy sa karne upang maipakita ang diin ng tagubilin.
