revisions:
- from: Kung may dayuhang naninirahang kasama ninyo at magdiriwang siya ng Paskuwa para kay Yahweh, kailangang tuliin ang lahat ng lalaking kabilang sa kanyang sambahayan. Pagkatapos, maaari na siyang lumapit upang ipagdiwang iyon, at ituturing siyang gaya ng isang katutubo sa lupain. Ngunit walang lalaking di-tuli ang maaaring kumain nito.
  to: Kung may dayuhang naninirahang kasama mo at magdiriwang siya ng Paskuwa para kay Yahweh, kailangang tuliin ang lahat ng lalaking kabilang sa kanya. Pagkatapos, maaari na siyang lumapit upang ipagdiwang ito, at magiging gaya siya ng isang katutubo ng lupain. Ngunit walang lalaking di-tuli ang maaaring kumain nito.
  rationale: Inalis ang “sambahayan” upang huwag limitahan ang saklaw na hindi hayagang tinutukoy ng Hebrew. Pinalitan ang “ituturing siyang” ng “magiging gaya siya” upang mapanatili ang direktang pahayag ng teksto. Ginawang isahan ang panghalip na “mo” alinsunod sa Hebreong kausap na isahan, habang pinanatili ang malinaw at marangal na modernong Filipino.
