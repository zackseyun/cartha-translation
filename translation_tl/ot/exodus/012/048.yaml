base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: tl
  text: Kung may dayuhang naninirahang kasama mo at magdiriwang siya ng Paskuwa para kay Yahweh, kailangang tuliin ang lahat ng lalaking kabilang sa kanya. Pagkatapos, maaari na siyang lumapit upang ipagdiwang ito, at magiging gaya siya ng isang katutubo ng lupain. Ngunit walang lalaking di-tuli ang maaaring kumain nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֵּר / יָגוּר אִתְּךָ
  choice: dayuhang naninirahang kasama ninyo
  rationale: Ipinahahayag nito ang isang hindi katutubong naninirahan sa gitna ng Israel, hindi isang dumaraan lamang; mas likas ito sa modernong Filipino kaysa sa literal na “nakikipamayan.”
- source_word: וְעָשָׂה פֶסַח
  choice: magdiriwang siya ng Paskuwa
  rationale: Ang literal na “gagawa ng Paskuwa” ay idyomatikong tumutukoy sa pagdiriwang o pagtupad sa ritwal ng Paskuwa. Ang anyong prospektibo ay nababagay sa kondisyong inilalahad ng talata nang hindi nagdaragdag ng “nais.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang YHWH at ang diwa ng pag-aalay o pagdiriwang na nakatalaga sa kanya.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: kailangang tuliin ang lahat ng lalaking kabilang sa kanyang sambahayan
  rationale: Ipinakikita ng konstruksiyon ang isang mahigpit na kahilingan. Nililinaw ng “sambahayan” ang saklaw ng “lahat ng lalaking kanya” sa kontekstong panlipunan, hindi lamang ang kanyang mga anak.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: Pagkatapos, maaari na siyang lumapit upang ipagdiwang iyon
  rationale: Ang “lumapit” ay pinananatili upang maipahayag ang pahintulot na makilahok matapos matugunan ang kahilingan, habang ang “ipagdiwang” ay likas na salin ng ritwal na paggawa ng Paskuwa.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: gaya ng isang katutubo sa lupain
  rationale: Pinananatili ang legal at panlipunang paghahambing sa isang katutubong kasapi ng lupain, nang hindi pinalalawak ang saklaw nito lampas sa konteksto.
- source_word: וְכָל עָרֵל לֹא יֹאכַל בּוֹ
  choice: walang lalaking di-tuli ang maaaring kumain nito
  rationale: Dahil ang עָרֵל ay panlalaking isahan at tuwirang kasunod ng kahilingan sa lahat ng lalaki, tahasang “lalaking di-tuli” ang ginamit. Ang “maaaring” ay nagpapahayag ng pagbabawal o kawalan ng karapatang makibahagi.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Direktang nasa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang tipanang personal na pangalan nang hindi pinapalitan ng titulo.
- issue: Paglahok ng dayuhang naninirahan sa Paskuwa
  choice: Maaari siyang makilahok matapos tuliin ang lahat ng lalaking kabilang sa kanyang sambahayan, at ituturing siyang gaya ng katutubo sa kontekstong ito.
  alternative: Ganap na etnikong pagbubukod, o pagpapawalang-bisa sa lahat ng hangganang tipanan
  rationale: Pinagsasama ng teksto ang kondisyon ng pagtutuli at ang pagkakapantay sa katutubo. Hindi pinalalawak ng salin ang pahayag tungo sa mga teolohikong kategoryang wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “dayuhang naninirahan” sa halip na mas lumang “nakikipamayan,” at “Paskuwa” bilang nakikilalang terminong biblikal. Walang talababa sapagkat naipahayag nang sapat sa teksto ang mahahalagang leksikal na diwa.
