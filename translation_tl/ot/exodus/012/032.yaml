  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: tl
  text: Dalhin ninyo ang inyong mga tupa at kambing, pati ang inyong mga baka, gaya ng sinabi ninyo; umalis kayo, at pagpalain din ninyo ako.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Pati ako’y pagpalain ninyo.” Maaaring idiniriin ng pananalita ni Paraon na pati siya ay humihingi ng pagpapala habang umaalis ang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: ang inyong mga tupa at kambing, pati ang inyong mga baka
  rationale: Ang צֹאן ay kolektibong tawag sa maliliit na alagang hayop, lalo na sa mga tupa at kambing, samantalang ang בָּקָר ay tumutukoy sa mga baka o malalaking alagang hayop. Likas sa modernong Tagalog ang pares na ito, at ipinahahayag ng “pati” ang inuulit na גַּם.
- source_word: קְחוּ
  choice: Dalhin ninyo
  rationale: Bagaman karaniwang nangangahulugang “kunin,” sa kontekstong ito ay inuutusan silang isama ang kanilang mga hayop sa pag-alis; kaya mas malinaw at likas ang “dalhin ninyo.”
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: gaya ng sinabi ninyo
  rationale: Pinananatili nito ang paghahambing at ang pagkilala ni Paraon sa nauna nilang kahilingan.
- source_word: וָלֵכוּ
  choice: at umalis na kayo
  rationale: Ang הלך ay literal na “humayo,” ngunit sa tagpong ito malinaw na tumutukoy sa agarang pag-alis. Ang “na” ay likas na naghahatid ng puwersa ng utos sa Tagalog nang hindi nagdaragdag ng bagong nilalaman.
- source_word: וּבֵרַכְתֶּם גַּם אֹתִי
  choice: Pagpalain din ninyo ako
  rationale: Direktang pinananatili ang kahulugan ng ברך na “pagpalain” at ang pandagdag na diin ng גַּם sa pagkakasama ni Paraon sa hinihinging pagpapala.
theological_decisions:
- issue: Kalikasan ng hinihinging pagpapala ni Paraon
  choice: Isinalin bilang tuwirang kahilingang pagpalain siya, nang hindi tinutukoy kung ito ay pamamagitan sa Diyos ng Israel o isang basbas ng mabuting kalooban.
  alternative: Ipaliwanag ito bilang tahasang panalangin kay Yahweh para kay Paraon, o bilang karaniwang basbas sa pamamaalam.
  rationale: Malinaw ang pandiwang ברך, ngunit hindi tahasang sinasabi ng talata kung paano o kanino inaasahan ni Paraon ang pagpapala. Pinananatili ng payak na salin ang teolohikal na tensiyon.
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “mga tupa at kambing” sa halip na mas malabong “kawan,” at “mga baka” sa halip na teknikal na “malalaking alagang hayop.”
