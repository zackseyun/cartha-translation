  text: הַ/חֹ֧דֶשׁ הַ/זֶּ֛ה לָ/כֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָ/כֶ֔ם לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: tl
  text: Ang buwang ito ang magiging pasimula ng mga buwan para sa inyo[a]; ito ang magiging unang buwan ng taon para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ang bagong buwang ito,” sapagkat ang salitang Hebreo ay maaaring maiugnay sa siklo ng bagong buwan; dito, tumutukoy ito sa buwan sa kalendaryo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Ang buwang ito
  rationale: Sa kontekstong nagtatakda ng kalendaryo, ang חֹדֶשׁ ay likas na tumutukoy sa buwan, bagaman maaari rin itong maiugnay sa bagong buwan.
- source_word: לָכֶם
  choice: para sa inyo
  rationale: 'Pinananatili nito ang ugnayan sa mga kausap: ang pagtatakdang pangkalendaryo ay para sa Israel.'
- source_word: רֹאשׁ חֳדָשִׁים
  choice: pasimula ng mga buwan
  rationale: Bagaman literal na “ulo” ang רֹאשׁ, sa pagkakasunod-sunod ng panahon ay nangangahulugan itong pasimula o una.
- source_word: רִאשׁוֹן הוּא
  choice: ito ang magiging unang buwan
  rationale: Ipinahahayag ng רִאשׁוֹן ang pagiging una; idinagdag ang “buwan” ayon sa malinaw na ipinahihiwatig ng konteksto, at ang “magiging” ay angkop sa pagtatakdang ginagawa rito.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: ng taon
  rationale: Maikli at likas itong paraan sa Tagalog upang tukuyin na ito ang una sa mga buwan ng taon.
theological_decisions:
- issue: Lakas ng pangungusap na walang tahasang pandiwa sa kontekstong lehislatibo
  choice: 'Isinalin sa paraang nagtatakda: “ang magiging”'
  alternative: 'Payak na kasalukuyan: “ang … ay”'
  rationale: Walang tahasang pandiwa sa Hebreo, ngunit ang konteksto ay tagubilin ng Diyos na nagtatatag ng kalendaryo ng Israel. Ang “magiging” ay naghahatid ng puwersang nagtatakda nang hindi nagdaragdag ng doktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pasimula” upang maipahayag ang temporal na diwa ng רֹאשׁ nang hindi maging alanganin ang literal na “ulo.”
