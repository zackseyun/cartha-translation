base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: tl
  text: 'Sinabi ni Yahweh kina Moises at Aaron, “Ito ang tuntunin tungkol sa Paskuwa: Hindi maaaring kumain nito ang sinumang dayuhan[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “anak ng pagiging dayuhan.” Tumutukoy ito sa isang dayuhan, samakatuwid ay isang taong hindi kabilang sa sambayanan ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas at tuwirang salin ng karaniwang pandiwang ginagamit sa salaysay.
- source_word: חֻקַּת
  choice: tuntunin
  rationale: Ipinahahayag ang itinakdang regulasyon sa malinaw at makabagong Filipino habang pinananatili ang legal na himig.
- source_word: הַפָּסַח
  choice: Paskuwa
  rationale: Karaniwang katawagan sa Filipino para sa pagdiriwang at handog na tinutukoy ng Hebreo; hindi nililimitahan nang di-kailangan sa handog o pagkain lamang.
- source_word: בֶּן נֵכָר
  choice: dayuhan
  rationale: Natural na katumbas ng idyomang Hebreo na literal na 'anak ng pagiging dayuhan'; hindi nagdaragdag ng mas makitid na kategoryang wala sa mismong parirala.
- source_word: לֹא יֹאכַל בּוֹ
  choice: Walang ... na makakain nito
  rationale: Natural na pagpapahayag sa Filipino ng pangkalahatang pagbabawal na makibahagi sa pagkain ng Paskuwa.
theological_decisions:
- issue: Pagkakakilanlan ng mga hindi pinahihintulutang kumain ng Paskuwa
  choice: dayuhan
  alternative: dayuhang nasa labas ng sambayanan ng tipan; di-tuling dayuhan
  rationale: Ang mismong talata ay nagsasabing בֶּן נֵכָר, 'dayuhan.' Hindi idinagdag sa pangunahing teksto ang mga paglilinaw mula sa mas malawak na konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tuntunin” para sa legal na himig nang hindi nagiging lipas, at “makakain nito” bilang natural na anyo ng pagbabawal sa konteksto.
