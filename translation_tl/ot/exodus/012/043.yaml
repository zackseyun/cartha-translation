  verdict: revise
  source_fidelity: 'Tumpak ang mga pangunahing elemento: si Yahweh ang nagsalita kina Moises at Aaron, at ang utos ay ukol sa Paskuwa at sa isang dayuhan. Gayunman, ang “Walang dayuhan na makakain nito” ay maaaring mangahulugang walang dayuhang magkakaroon ng kakayahang kumain, sa halip na isang legal na pagbabawal. Kailangang ipahayag nang malinaw ang modal na pagbabawal ng לֹא יֹאכַל.'
  naturalness: Malinaw at makabago ang pangungusap. Mas natural at mas tiyak sa kontekstong legal ang “Hindi maaaring kumain nito ang sinumang dayuhan.”
