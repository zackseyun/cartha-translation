  naturalness: Marangal at madaling unawain ang Tagalog. Mas malinaw at mas likas ang “nakasuot sa inyong mga paa ang inyong mga sandalyas” at “nasa inyong kamay ang inyong tungkod” kaysa sa mga anyong walang tahasang lokatibong parirala.
  terminology: Ang “Paskuwa” at “Yahweh” ay angkop at pare-pareho. Ang “nakabigkis ang inyong mga baywang” ay malapit sa Hebreong idyoma; ang talababa ay angkop na nagpapaliwanag nito.
