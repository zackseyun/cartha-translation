source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: tl
  text: 'Ganito ninyo ito kakainin: nakabigkis ang inyong mga baywang[a], nakasuot sa inyong mga paa ang inyong mga sandalyas, at nasa inyong kamay ang inyong tungkod. Kainin ninyo ito nang nagmamadali; ito ang Paskuwa para kay Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “nakabigkis ang inyong mga balakang”—isang idyoma para sa pagiging bihis at handang umalis agad.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ito ang Paskuwa ni Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: Ganito
  rationale: Likas at tuwirang panimula sa Tagalog para sa tagubilin tungkol sa paraan ng pagkain.
- source_word: תֹּאכְלוּ אֹתוֹ
  choice: ninyo ito kakainin
  rationale: Pinananatili ang direktibong lakas ng imperfect sa kontekstong nag-uutos, habang natural ang ayos sa modernong Tagalog.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: nakabigkis ang inyong baywang
  rationale: Pinananatili ang kongkretong larawan ng paghahandang maglakbay; ipinaliliwanag sa talababa ang idyomatikong diwa.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: nakasuot ang inyong mga sandalyas
  rationale: Ang 'sandalyas' ay angkop sa sinaunang kasuotan; hindi na kailangang ulitin ang 'sa mga paa' sa Tagalog dahil malinaw na ito sa pandiwang 'nakasuot.'
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: at nasa kamay ang inyong tungkod
  rationale: Ang 'tungkod' ay natural at tumpak sa konteksto ng agarang paglalakbay.
- source_word: בְּחִפָּזוֹן
  choice: nang nagmamadali
  rationale: Malinaw na naghahatid ng pagmamadali at agarang kahandaan nang hindi gumagamit ng lipas na pananalita.
- source_word: פֶּסַח
  choice: Paskuwa
  rationale: Kinikilalang salin sa Tagalog para sa pangalan ng ritwal at kapistahang ito.
- source_word: הוּא לַיהוָה
  choice: ito ang Paskuwa para kay Yahweh
  rationale: Ang לַ ay maaaring magpahiwatig ng pag-uukol o kaugnayan kay Yahweh; pinananatili ng 'para kay' ang anyong ito nang hindi ipinapakahulugang pag-aari lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreo. Ang 'Yahweh' ay malapit na transliterasyon at hindi ito pinapalitan ng titulong 'PANGINOON.'
- issue: Ugnayang ipinahihiwatig ng לַ sa פֶּסַח הוּא לַיהוָה
  choice: Paskuwa para kay Yahweh
  alternative: Paskuwa ni Yahweh
  rationale: Maaaring ipahiwatig ng parirala na ang Paskuwa ay ukol o nakatalaga kay Yahweh, o kaugnay sa kaniya. Pinananatili ng pangunahing salin ang direksiyonal/dedikatoryong diwa, at inilalahad sa talababa ang posibleng anyong nagtataglay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang magalang at pangmaramihang 'ninyo/inyong' at ang tuwirang pautos na 'Kainin ninyo.' Iniwasan ang sobrang arkaikong pananalita, ngunit pinanatili ang kongkretong larawan at ritwal na katawagang 'Paskuwa.'
