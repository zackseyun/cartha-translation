base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: tl
  text: Inihurno nila ang masang inilabas nila mula sa Ehipto bilang mga tinapay na walang pampaalsa, sapagkat hindi pa ito umalsa. Pinalayas sila mula sa Ehipto kaya hindi sila nakapag-antala, at wala rin silang naihandang baon para sa kanilang sarili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: Inihurno nila
  rationale: Tuwirang ipinapahayag ang kilos sa natural na ayos ng modernong Tagalog; hindi kailangang isalin nang hiwalay ang panimulang וַ bilang “At” sa nagsasariling talata.
- source_word: הַבָּצֵק
  choice: ang masa
  rationale: Ang בָּצֵק ay minasa o dough; “masa” ang maikli at karaniwang katawagan sa Filipino sa kontekstong pagbe-bake.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: na inilabas nila mula sa Ehipto
  rationale: Pinananatili nito ang tahasang aktibong pandiwa at ang kaugnayan ng sugnay sa masa.
- source_word: עֻגֹת מַצּוֹת
  choice: bilang mga tinapay na walang pampaalsa
  rationale: Ang עֻגֹת ay mga bilog o lapad na tinapay, hindi matatamis na cake; malinaw na inilalarawan ng “mga tinapay” ang pagkain, at ipinapahayag ng “walang pampaalsa” ang מַצּוֹת.
- source_word: כִּי לֹא חָמֵץ
  choice: sapagkat hindi pa ito napaalsa
  rationale: Ang חָמֵץ dito ay pandiwang nagsasaad na ang masa ay naging pinaalsa. Ang “hindi pa napaalsa” ay natural at pinananatili ang naganap-na-kalagayang di natupad bago ang pagluluto.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: Pinalayas sila mula sa Ehipto
  rationale: Ang pasibong גֹרְשׁוּ ay nagpapahiwatig ng sapilitang pagpapaalis; ang “pinalayas” ay malinaw at kasalukuyang gamit.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: at hindi na sila nakapag-antala
  rationale: Ipinahihiwatig ng התמהמה ang pananatili o pagpapaliban. Ang “hindi na sila nakapag-antala” ay naghahatid ng kawalan nila ng pagkakataong maghintay.
- source_word: צֵדָה
  choice: baon
  rationale: Tumutukoy ang צֵדָה sa pagkaing o panustos na inihahanda para sa paglalakbay. Ang “baon” ay natural at madaling maunawaang Filipino sa kontekstong ito.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: Tahasang pinananatili ang pronominal na pariralang nagsasaad na ang baon ay para sa sarili nilang gamit.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “pampaalsa” sa halip na “lebadura” upang ilarawan ang katangian ng tinapay nang hindi ipinapalagay na modernong komersiyal na yeast lamang ang tinutukoy; ginamit ang “baon” bilang natural na salin ng panustos sa paglalakbay.
