  naturalness: Natural sa pangkalahatan ang register, ngunit mas maayos ang ayos na “ang masang inilabas nila” kaysa “ang masa na inilabas nila,” at mas tuwiran ang “wala rin silang naihandang baon” para sa huling sugnay.
  terminology: Ang “masa,” “tinapay na walang pampaalsa,” “pinalayas,” at “baon” ay angkop sa modernong Filipino Tagalog at tumutugma sa mga pangunahing termino ng pinagmulan. Walang kailangang talababa.
