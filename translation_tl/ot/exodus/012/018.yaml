  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang paulit-ulit na pormulang pangkalendaryo at ang dalawang magkatulad na pagtukoy sa gabi nang hindi tinutukoy nang mas makitid ang eksaktong sandali.
