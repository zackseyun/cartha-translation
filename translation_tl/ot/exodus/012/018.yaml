base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: tl
  text: Sa unang buwan, sa ikalabing-apat na araw ng buwan, sa gabi[a], kakain kayo ng tinapay na walang lebadura hanggang sa ikadalawampu't isang araw ng buwan, sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “pagsapit ng gabi”; gayundin sa ikalawang paglitaw ng “sa gabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: Sa unang buwan
  rationale: Bagaman literal na “sa una,” ipinahihiwatig ng kasunod na pormulang pangkalendaryo na ang tinutukoy ay ang unang buwan; idinagdag ang “buwan” para sa likas at malinaw na Tagalog.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: sa ikalabing-apat na araw
  rationale: Karaniwang pormula ito ng Hebreo sa pagtukoy ng petsa; likas sa Tagalog ang anyong ordinal.
- source_word: לַחֹדֶשׁ
  choice: ng buwan
  rationale: Bagaman maaaring tumukoy ang חֹדֶשׁ sa bagong buwan, sa pormula ng petsa ay nangangahulugan itong “buwan.”
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: sa gabi
  rationale: Pinananatili nito ang pangkalahatang kahulugan ng עֶרֶב bilang oras ng gabi at hindi ito nililimitahan nang labis sa mismong takipsilim; pareho ang salin sa dalawang paglitaw.
- source_word: תֹּאכְלוּ
  choice: kakain kayo
  rationale: Ang imperfect ay may puwersang tagubilin sa kontekstong legal; ang ganitong anyong panghinaharap ay natural ding ginagamit sa Tagalog para sa mariing utos o itinakdang gawain.
- source_word: מַצֹּת
  choice: tinapay na walang pampaalsa
  rationale: Malinaw nitong ipinapahayag ang tinapay na hindi pinaalsa at iniiwasan ang di-kinakailangang transliterasyon.
- source_word: עַד
  choice: hanggang sa
  rationale: Tinutukoy nito ang hulíng hangganan ng itinakdang panahon.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: ikaladalawampu't isang araw
  rationale: Ito ang natural na ordinal na anyo sa Tagalog para sa ikadalawampu't isang araw.
