  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: tl
  text: Ang naninirahang dayuhan[a] at ang upahang manggagawa ay hindi maaaring kumain nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pansamantalang residente” o “dayuhang naninirahan.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sa handa ng Paskuwa; sa mas makitid na diwa, sa kordero ng Paskuwa.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: naninirahang dayuhan
  rationale: Ipinahihiwatig ng salita ang isang hindi katutubong naninirahan sa Israel ngunit hindi lubos na kabilang sa sambayanang tipan. Malinaw at likas sa makabagong Tagalog ang “naninirahang dayuhan,” at pinananatili nito kapuwa ang paninirahan at pagiging tagalabas.
- source_word: שָׂכִיר
  choice: upahang manggagawa
  rationale: Tumutukoy ito sa taong nagtatrabaho kapalit ng sahod. Ang “upahang manggagawa” ay malinaw, kasalukuyang gamit, at walang mapanlait o makalumang himig.
- source_word: לֹא יֹאכַל
  choice: hindi dapat kumain
  rationale: Ang negatibong imperfect sa kontekstong pambatas ay naghahayag ng pagbabawal. Ang “hindi dapat kumain” ay natural sa Tagalog at nagpapanatili ng mariing puwersang legal.
- source_word: בּוֹ
  choice: niyon
  rationale: Ang panghalip na may ב pagkatapos ng pandiwang “kumain” ay tumutukoy sa pagkain o pakikibahagi mula sa naunang binanggit na Paskuwa. Ang “kumain niyon” ay maikli at likas sa Tagalog habang hindi labis na nililinaw ang tahasang hindi binanggit na antecedent.
theological_decisions:
- issue: Ang tinutukoy ng “niyon” sa mga tuntunin tungkol sa Paskuwa
  choice: Pinanatili ang maikling panghalip na “niyon,” na sa konteksto ay tumutukoy sa handa o hayop ng Paskuwa.
  alternative: Tahasang isalin bilang “kumain ng kordero ng Paskuwa.”
  rationale: Hindi tahasang inuulit ng Hebreo ang pangngalan. Pinananatili ng panghalip ang kaiklian at bahagyang lawak ng orihinal, samantalang ipinauunawa ng konteksto kung ano ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “hindi dapat” upang natural na maipahayag ang pagbabawal na legal, at pinanatili ang “at” ng Hebreong וְ sa pagbanggit sa dalawang uring hindi pahihintulutang kumain.
