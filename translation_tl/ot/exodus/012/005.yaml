  to: Ang hayop[a] na kukunin ninyo ay dapat walang kapintasan, isang lalaking isang taóng gulang. Kukunin ninyo ito mula sa mga tupa o sa mga kambing.
  rationale: Pinalitan ang “hayop na pipiliin ninyo” ng “hayop na kukunin ninyo” upang maiwasan ang di-tahasang ideya ng pagpili at upang iugnay ang hayop sa utos na kunin ito. Inilipat at itinama ang talababa upang ipaliwanag ang saklaw ng שֶׂה, habang pinanatili ang malinaw na pagpapahayag na ang hayop ay dapat lalaki, isang taóng gulang, at walang kapintasan.
