base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: tl
  text: Ang hayop[a] na kukunin ninyo ay dapat walang kapintasan, isang lalaking isang taóng gulang. Kukunin ninyo ito mula sa mga tupa o sa mga kambing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaaring tumukoy nang mas malawak sa isang batang hayop mula sa kawan, kabilang ang tupa o batang kambing. Nililinaw ng kasunod na sugnay na maaari itong kunin mula sa mga tupa o sa mga kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: hayop na pipiliin
  rationale: Ang שֶׂה ay mas malawak kaysa “kordero” at maaaring tumukoy sa batang tupa o batang kambing. Pinananatili ng pangkalahatang “hayop” ang saklaw na nililinaw ng huling sugnay.
- source_word: תָמִים
  choice: walang kapintasan
  rationale: Sa kontekstong panghandog, tumutukoy ito sa hayop na walang depekto; natural at tumpak sa Filipino ang “walang kapintasan.”
- source_word: זָכָר
  choice: lalaki
  rationale: Tuwirang katawagan sa kasarian ng hayop.
- source_word: בֶּן שָׁנָה
  choice: isang taóng gulang
  rationale: Natural na salin ng idyomang Hebreo na tumutukoy sa hayop na isang taon ang edad o nasa unang taon nito.
- source_word: יִהְיֶה לָכֶם
  choice: ay dapat
  rationale: Ipinahahayag nito ang itinakdang katangian ng hayop para sa mga Israelita; naihahatid ng “dapat” ang preskriptibong diwa.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: mula sa mga tupa o sa mga kambing
  rationale: Ang dalawang uri ang pinahihintulutang pagkunan. Isinalin ang waw bilang “o” dahil alinman sa tupa o kambing ang maaaring piliin.
- source_word: תִּקָּחוּ
  choice: Kukuha kayo nito
  rationale: Ang ikalawang panauhang maramihan ay isang tagubilin. Ang “nito” ay likas na idinagdag sa Filipino at tumutukoy sa hayop na binanggit na.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hayop na pipiliin” sa halip na “kordero” upang hindi mawala ang tahasang posibilidad na tupa o kambing ang kunin. Inilagay ang marker [a] sa pangunahing teksto.
