  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: tl
  text: At sundin ninyo ang bagay na ito bilang isang tuntunin para sa inyo at sa inyong mga anak na lalaki magpakailanman.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “usaping ito” o “salitang ito.” Ang salitang Hebreo ay maaaring tumukoy sa isang bagay, usapin, o binigkas na salita.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “para sa inyo at sa inyong mga anak” o “para sa inyo at sa inyong mga salinlahi.” Sa Hebreo, “inyong mga anak na lalaki” ang nakasulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kaya sundin ninyo
  rationale: Sa kontekstong legal at tipan, ang שׁמר ay tumutukoy sa maingat at patuloy na pagsunod. Likas sa modernong Tagalog ang “sundin,” at ang pang-ugnay na “kaya” ay naghahayag ng pagpapatuloy mula sa naunang tagubilin.
- source_word: הַדָּבָר הַזֶּה
  choice: ang bagay na ito
  rationale: 'Malawak ang saklaw ng דָּבָר: maaaring bagay, usapin, o salita. Pinananatili ng “bagay na ito” ang lawak at bahagyang kalabuan ng Hebreo nang hindi ito nililimitahan sa isang pasalitang utos lamang.'
- source_word: לְחָק
  choice: bilang tuntunin
  rationale: Ang חֹק ay isang itinakda o ipinag-utos na alituntunin. Ang “tuntunin” ay natural, marangal, at may sapat na legal na bigat sa kasalukuyang Tagalog.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: para sa inyo at sa inyong mga anak na lalaki
  rationale: Tahasan sa Hebreo ang “iyong mga anak na lalaki.” Ginamit ang maramihang “inyo” dahil ang pandiwang וּשְׁמַרְתֶּם ay nakatuon sa maramihang kausap; pinanatili ang tiyak na kasarian ng בָּנִים sa pangunahing teksto.
- source_word: עַד עוֹלָם
  choice: magpakailanman
  rationale: Karaniwang ipinahahayag ng parirala ang nagpapatuloy o walang takdang-hanggang bisa. Ang “magpakailanman” ang pinakanatural na katumbas sa Tagalog.
theological_decisions:
- issue: Saklaw ng wikang pamana sa “inyong mga anak na lalaki”
  choice: Pinanatili sa pangunahing teksto ang tahasang “mga anak na lalaki.”
  alternative: “mga anak” o “mga salinlahi”
  rationale: Ang Hebreo ay tahasang nagsasabing “mga anak na lalaki.” Maaaring kumatawan ito sa pagpapatuloy ng sambahayan o mga salinlahi, ngunit hindi dapat ipalit ang interpretasyong iyon sa tiyak na anyong leksikal ng teksto.
- issue: Tagal ng bisa ng tuntunin
  choice: “magpakailanman”
  alternative: “sa lahat ng panahon” o “habang panahon”
  rationale: Pinananatili nito ang malakas na pahayag ng עַד עוֹלָם nang hindi nilulutas sa salin ang mas malawak na teolohikal na tanong tungkol sa paraan ng patuloy na bisa nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “ninyo/inyo” upang ipakita ang maramihang kausap sa pandiwa, bagaman isahan ang anyo ng mga kasunod na panghalip sa Hebreo bilang kolektibong pagtukoy. Inilagay ang mga talababa matapos ang buong pangungusap upang hindi maputol ang daloy.
