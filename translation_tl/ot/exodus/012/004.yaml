revisions:
- from: At kung napakakaunti ng sambahayan para sa isang batang tupa[a], siya at ang pinakamalapit niyang kapitbahay ay kukuha ng isa ayon sa bilang ng mga tao. Bibilangin ninyo para sa batang tupa ang bawat isa ayon sa dami ng makakain niya.[b]
  to: At kung masyadong kakaunti ang mga tao sa sambahayan para sa isang batang tupa[a], siya at ang kapitbahay na pinakamalapit sa kanyang bahay ay kukuha ng isa ayon sa bilang ng mga tao; ibibilang ninyo ang bawat isa para sa batang tupa ayon sa dami ng makakain niya.[b]
  rationale: Inayos ang unang sugnay upang malinaw na ang kakulangan ay sa bilang ng mga tao sa sambahayan. Ginawang tahasan ang ugnayan ng pinakamalapit na kapitbahay sa bahay, at inayos ang huling utos sa mas likas na Tagalog nang hindi binabago ang saklaw ng pagtutuos. Pinanatili ang talababa para sa mas malawak na kahulugan ng שֶׂה.
