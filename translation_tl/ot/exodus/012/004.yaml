base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: tl
  text: At kung masyadong kakaunti ang mga tao sa sambahayan para sa isang batang tupa[a], siya at ang kapitbahay na pinakamalapit sa kanyang bahay ay kukuha ng isa ayon sa bilang ng mga tao; ibibilang ninyo ang bawat isa para sa batang tupa ayon sa dami ng makakain niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong שֶׂה ay maaari ring tumukoy nang mas malawak sa isang hayop na mula sa tupa o kambing.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Ayon sa makakain ng bawat isa, tutuusin ninyo ang para sa batang tupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: napakakaunti ng sambahayan para sa isang batang tupa
  rationale: Ang הַבַּיִת ay tumutukoy dito sa sambahayan, at ang יִמְעַט ... מִהְיֹת ay nagsasaad na napakakaunti ng mga kasapi upang ubusin ang isang hayop.
- source_word: שֶׂה
  choice: batang tupa
  rationale: Natural ito sa konteksto ng Paskuwa, ngunit maaaring mas malawak ang Hebreo at tumukoy sa isang hayop mula sa mga tupa o kambing; pinanatili ang saklaw na iyon sa talababa.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: siya at ang pinakamalapit niyang kapitbahay ay kukuha ng isa
  rationale: Malinaw at natural na ipinahahayag ang magkasamang pagkuha kasama ng kapitbahay na pinakamalapit sa kanyang bahay; ang layon na 'isa' ay ipinahihiwatig ng konteksto.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: ayon sa bilang ng mga tao
  rationale: Ang נְפָשֹׁת ay nangangahulugang mga tao sa kontekstong ito, at ang מִכְסַת ay tumutukoy sa bilang o takdang dami.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Distributibo ang gamit ng panlalaking isahan; ang 'bawat isa' ay likas sa Tagalog at sumasaklaw sa bawat taong kabilang sa bilang nang hindi binabago ang diwa.
- source_word: לְפִי אָכְלוֹ
  choice: ayon sa dami ng makakain niya
  rationale: Ipinahahayag ng idyoma ang konsumo o kakayahang kumain ng bawat isa, hindi lamang ang abstraktong kilos ng pagkain.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: Bibilangin ninyo para sa batang tupa
  rationale: Pinananatili ang kahulugang pagtutuos o pagbibilang kaugnay ng hayop, habang ang buong pangungusap ay nilinaw upang maging natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sambahayan” sa halip na literal na “bahay” upang tukuyin ang pangkat ng mga taong kakain. Inayos ang huling sugnay sa likas na ayos ng Tagalog habang pinananatili ang pagtutuos batay sa makakain ng bawat tao.
