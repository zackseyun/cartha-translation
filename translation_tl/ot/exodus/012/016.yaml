  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “banal na pagtitipon” sa halip na mas teknikal o makalumang katawagan; pinanatili ang pasibong pagbabawal at nilinaw lamang na ang panghalip ay tumutukoy sa dalawang araw.
