base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: tl
  text: Sa unang araw ay magkakaroon kayo ng banal na pagtitipon[a], at sa ikapitong araw ay banal na pagtitipon din. Walang anumang gawain ang dapat gawin sa mga araw na iyon, maliban sa pagkaing kailangan para sa bawat tao[b]; iyon lamang ang maaaring ihanda ninyo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sagradong pagtitipon” o, ayon sa tradisyonal na salin, “banal na kapulungan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “para sa bawat nefesh.” Dito, ang ibig sabihin ng nefesh ay bawat tao, hindi partikular na “kaluluwa” ayon sa karaniwang makabagong pagkaunawa.
    reason: lexical_alternative
  - marker: c
    text: Sa literal na Hebreo, “iyon lamang ang gagawin para sa inyo.” Ipinakikita ng konteksto na ang tanging pinahihintulutan ay ang paghahanda ng pagkaing kailangan para kainin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: banal na pagtitipon
  rationale: Tumutukoy ang parirala sa isang ipinatawag at itinalagang sagradong pagtitipon. Likas at malinaw sa makabagong Filipino ang “banal na pagtitipon,” habang napapanatili ang diwa ng kapulungan at kabanalan.
- source_word: יִהְיֶה לָכֶם
  choice: magkakaroon kayo
  rationale: Natural nitong ipinahahayag sa Filipino ang Hebreong konstruksiyong eksistensiyal na may datibo, nang hindi nawawala ang tuwirang pagtukoy sa mga kausap.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה
  choice: Walang anumang gawain ang dapat gawin
  rationale: Pinananatili nito ang malawak na saklaw ng כָּל at ang pasibong anyo ng pandiwa, at malinaw na ipinahahayag ang pagbabawal.
- source_word: בָהֶם
  choice: sa mga araw na iyon
  rationale: Ginagawang hayag ang temporal na tinutukoy ng panghalip na maramihan—ang una at ikapitong araw—upang maging malinaw sa Filipino.
- source_word: אַךְ
  choice: maliban sa
  rationale: Nagpapasok ito rito ng tanging eksepsiyon sa naunang pagbabawal.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: sa pagkaing kakainin ng bawat tao
  rationale: Ipinahihiwatig ng konteksto na pagkain ang maaaring ihanda. Ang נֶפֶשׁ ay tumutukoy rito sa bawat tao, hindi partikular sa “kaluluwa” sa makabagong metapisikal na kahulugan.
- source_word: הוּא לְבַדּוֹ
  choice: iyon lamang
  rationale: 'Pinananatili ang mariing pagtatangi: ito ang nag-iisang pinahihintulutang eksepsiyon.'
- source_word: יֵעָשֶׂה לָכֶם
  choice: ang maaaring ihanda para sa inyo
  rationale: Bagaman literal na “gawin para sa inyo,” tumutukoy ang pandiwa sa konteksto sa paghahanda ng pagkaing binanggit. Pinananatili ng “para sa inyo” ang datibong לָכֶם.
