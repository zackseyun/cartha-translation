revisions:
- from: Sa loob ng pitong araw, kakain kayo ng tinapay na walang pampaalsa. Ngunit sa unang araw pa lamang, alisin ninyo ang pampaalsa sa inyong mga bahay.[a] Sapagkat sinumang kumain ng anumang pinaalsa, mula sa unang araw hanggang sa ikapitong araw, ang taong iyon ay aalisin mula sa Israel.[b]
  to: Pitong araw kayong kakain ng tinapay na walang pampaalsa. Ngunit sa unang araw, alisin ninyo ang pampaalsa sa inyong mga bahay.[a] Sapagkat ang sinumang kumain ng anumang may pampaalsa mula sa unang araw hanggang sa ikapitong araw ay ihihiwalay mula sa Israel.[b]
  rationale: Inalis ang “pa lamang” upang huwag magdagdag ng aspektong wala sa Hebreo. Inayos ang pangungusap upang maging mas tuwiran sa modernong Filipino at inilagay ang pananda ng unang tala sa mismong utos na ipinaliliwanag nito. Ang “ihihiwalay mula sa Israel” at ang tala nito ay pinananatili ang legal-teolohikal na bigat at sinadyang di-katiyakan ng וְנִכְרְתָה.
  reviewer_model: gpt-5.6-terra
