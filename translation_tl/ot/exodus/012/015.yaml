  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: tl
  text: Pitong araw kayong kakain ng tinapay na walang pampaalsa. Ngunit sa unang araw, alisin ninyo ang pampaalsa sa inyong mga bahay.[a] Sapagkat ang sinumang kumain ng anumang may pampaalsa mula sa unang araw hanggang sa ikapitong araw ay ihihiwalay mula sa Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pangyarihin ninyong mawala ang pampaalsa”; maaari ring isalin na “alisin” o “sirain ang pampaalsa sa inyong mga bahay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ihihiwalay” ay salin ng isang legal na pananalita sa Hebreo na literal na “puputulin” o “ihihiwalay.” Maaaring tumukoy ito sa pagkakatiwalag sa sambayanan, kamatayan, o hatol ng Diyos; hindi tinutukoy ng talatang ito ang eksaktong paraan.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Tumutukoy ito sa tinapay na ginawa nang walang sangkap na nagpapaalsa. Likas at malinaw ang parirala sa makabagong Filipino at angkop sa konteksto ng Paskuwa.
- source_word: אַךְ
  choice: Ngunit
  rationale: Ipinahihiwatig ng kataga ang mariing paglipat mula sa pangkalahatang utos tungo sa tiyak na gagawin sa unang araw.
- source_word: תַּשְׁבִּיתוּ
  choice: alisin ninyo
  rationale: Ang anyong Hiphil ng pandiwa ay literal na 'patigilin' o 'pangyaring mawala.' Sa kontekstong ito, malinaw na ipinag-uutos na alisin ang pampaalsa sa mga bahay.
- source_word: שְּׂאֹר
  choice: pampaalsa
  rationale: Tumutukoy ito sa sangkap o minasa na ginagamit upang paalsahin ang masa. Mas malawak at mas angkop dito ang 'pampaalsa' kaysa sa 'lebadura,' na maaaring unawain bilang isang partikular na uri lamang.
- source_word: חָמֵץ
  choice: anumang pinaalsa
  rationale: Malawak ang saklaw ng salita at hindi lamang tinapay ang tahasang tinutukoy; pinananatili ng salin ang pangkalahatang saklaw nito.
- source_word: וְנִכְרְתָה
  choice: aalisin
  rationale: Pinananatili nito ang legal at tipanang diwa ng pagiging 'cut off' nang hindi tiyak na ipinapakahulugan bilang pagpapatapon, kamatayan, o hatol ng Diyos.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: ang taong iyon
  rationale: Sa ganitong legal na pahayag, ang נֶפֶשׁ ay tumutukoy sa indibiduwal na tao, hindi lamang sa 'kaluluwa' bilang isang bahagi ng pagkatao.
- source_word: מִיִּשְׂרָאֵל
  choice: mula sa Israel
  rationale: Pinananatili nito ang maikli at tuwirang anyo ng Hebreo at ang diwa ng pag-aalis mula sa bayang nakipagtipan.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: mula sa unang araw hanggang sa ikapitong araw
  rationale: Iniuugnay ang pariralang pamanahon sa pagkain ng pinaalsa, gaya ng pinakalikás na daloy ng pangungusap sa Hebreo.
theological_decisions:
- issue: Kahulugan ng parusang וְנִכְרְתָה ('aalisin')
  choice: Panatilihin ang pangkalahatang legal na pahayag na 'aalisin mula sa Israel.'
  alternative: Ititiwalag sa sambayanan; papatayin; aalisin sa pamamagitan ng hatol ng Diyos.
  rationale: Hindi tinutukoy ng talata kung ang parusa ay pagpapatalsik sa sambayanan, kamatayan, o tuwirang hatol ng Diyos. Hindi nilulutas ng salin ang sinadyang di-tiyak na saklaw ng pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'pampaalsa' sa halip na mas teknikal o hiram na 'lebadura,' at pinanatiling di-tiyak ang legal-teolohikal na parusang 'aalisin mula sa Israel.'
