  text: All the congregation of Israel shall do it[a].
translation:
  language: tl
  text: Gagawin ito ng buong kapulungan ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ipagdiriwang ito ng buong kapulungan ng Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: buong
  rationale: Ipinahahayag ng pang-uring pamilang ang kabuuan ng sama-samang pamayanan; natural sa Filipino ang “buong kapulungan.”
- source_word: עֲדַת
  choice: kapulungan ng
  rationale: Tumutukoy ang עֵדָה sa sama-samang pamayanan ng Israel, lalo na sa kontekstong pangkomunidad at panrelihiyon. Dignified at malinaw sa modernong Filipino ang “kapulungan.”
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Pinanatili ang kinikilalang anyo ng pangalang pantangi sa Filipino.
- source_word: יַעֲשׂוּ
  choice: Gagawin
  rationale: Pinananatili ang malawak at tuwirang kahulugan ng עשה na “gawin,” habang ang aspektong kontemplatibo ng pandiwang Hebrew ay likas na naihahayag ng anyong panghinaharap sa Filipino.
- source_word: אֹתוֹ
  choice: ito
  rationale: Pinananatili ang panghalip na layon nang hindi labis na tinutukoy kung ito ay ang Paskuwa, ang ritwal, o ang naunang iniutos.
theological_decisions:
- issue: Ang sama-samang simuno sa utos tungkol sa Paskuwa
  choice: “buong kapulungan ng Israel” bilang isang sama-samang katawan
  alternative: “bawat Israelita” bilang indibiduwal na simuno
  rationale: Ang kolektibong pangngalan at pambansang katawagan sa Hebrew ay tumutukoy sa buong pamayanan bilang isang katawan. Hindi ito dapat tahimik na gawing tahasang utos sa bawat indibiduwal nang hiwalay.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Pinili ang “kapulungan” upang mapanatili ang kolektibo at pangkomunidad na diwa; inilagay sa talababa ang mas kontekstuwal na “ipagdiriwang.”
