base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: tl
  text: At ang dugo ay magiging tanda para sa inyo sa mga bahay na kinaroroonan ninyo. Kapag nakita ko ang dugo, lalampasan ko kayo[a], at hindi magkakaroon sa inyo ng salot na pupuksa[b] sa paghampas ko sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “palalampasin ko kayo” o “iingatan ko kayo.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring: “at hindi magkakaroon sa inyo ng salot para sa tagapuksa,” kung ang salita ay inuunawa bilang tumutukoy sa isang tagapuksa.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: ang dugo ay magiging tanda para sa inyo
  rationale: Pinananatili ang hinaharap na diwa ng pandiwa at ang tungkulin ng dugo bilang tanda para sa kapakinabangan ng Israel.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: sa mga bahay na kinaroroonan ninyo
  rationale: Natural sa Tagalog ang “sa mga bahay” para sa dugong nakalagay sa mga bahay; ang “kinaroroonan ninyo” ay tapat sa sugnay na tumutukoy sa mga bahay na kinalalagyan nila.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: Kapag nakita ko ang dugo
  rationale: Ang pormal na magkasunod na sugnay sa Hebreo ay may malinaw na temporal na ugnayan; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “kapag.”
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: lalampasan ko kayo
  rationale: Pinananatili nito ang pangunahing larawang leksikal at ang kaugnayan sa Paskuwa, habang inilalagay sa talababa ang mga posibleng diwang “hindi sasaktan” o “ipagsasanggalang.”
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: at hindi magkakaroon sa inyo ng salot
  rationale: Ang “sa inyo” ay sumasalamin sa בָכֶם nang hindi nililimitahan kung ito ay “sa gitna ninyo” o “sa ibabaw ninyo”; ang נֶגֶף ay natural na “salot” sa konteksto.
- source_word: לְמַשְׁחִית
  choice: na pupuksa
  rationale: Isinasalin ang parirala bilang layon o bunga ng salot. Hindi nito ipinapalagay na may tahasang personal na tagapuksa sa pangungusap, ngunit itinatala sa talababa ang substantibong pagbasa.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: kapag hinampas ko ang lupain ng Ehipto
  rationale: Ang infinitive construct na may בְּ ay temporal. Ang “hinampas” ay nagpapanatili sa larawan ng pagtama at natural ang anyong naganap pagkatapos ng “kapag” sa Tagalog kahit hinaharap ang tinutukoy.
theological_decisions:
- issue: Kahulugan ng וּפָסַחְתִּי עֲלֵכֶם sa pagtatatag ng Paskuwa
  choice: lalampasan ko kayo
  alternative: hindi ko kayo sasaktan; ipagsasanggalang ko kayo
  rationale: Pinananatili ng pangunahing salin ang leksikal at kanonikong kaugnayan sa Paskuwa, ngunit hindi itinatago ang posibleng diwa ng pagliligtas o pag-iingat.
- issue: Kung ang לְמַשְׁחִית ay nagsasaad ng pagpuksa o ng isang personal na tagapuksa
  choice: na pupuksa
  alternative: dahil sa tagapuksa
  rationale: Maaaring unawain ang anyo bilang layon/bunga o bilang substantibong “tagapuksa.” Ang pandiwang salin sa pangunahing teksto ay hindi nagdaragdag ng isang tiyak na personal na ahente na hindi hinihingi ng sintaks, samantalang pinananatili ng talababa ang ibang pagbasa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kinaroroonan,” “salot,” at “pupuksa” bilang pormal ngunit karaniwang bokabularyong angkop sa tekstong biblikal. Ang ayos ng pangungusap ay malapit sa Hebreo nang hindi nagiging matigas o di-likas sa Tagalog.
