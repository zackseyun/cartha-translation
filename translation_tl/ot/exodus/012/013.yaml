  source_fidelity: 'Malapit ang salin sa Hebreo: naipapahayag ang dugo bilang tanda, ang kondisyunal na pagkakita ng Diyos, ang ''paglampas,'' at ang kawalan ng salot sa Israel habang hinahampas ang Ehipto. Gayunman, ang ''kapag hinampas ko'' ay karaniwang nagpapahiwatig sa Tagalog na tapos na ang paghampas bago ang pangunahing kilos. Mas tapat at mas malinaw ang nominal na ''sa paghampas ko,'' na tumutugma sa temporal na infinitive construct na בְּהַכֹּתִי.'
  naturalness: Marangal at nauunawaan ang rehistro. Ang 'hindi magkakaroon sa inyo ng salot' ay pormal ngunit katanggap-tanggap na Tagalog na malapit sa Hebreo. Ang 'sa paghampas ko sa lupain ng Ehipto' ay mas likas sa ugnayang panahon kaysa sa perpektibong 'kapag hinampas ko.'
  terminology: Ang 'dugo,' 'tanda,' 'salot,' 'pupuksa,' at 'Ehipto' ay angkop. Ang 'lalampasan ko kayo' ay wastong pangunahing salin ng וּפָסַחְתִּי עֲלֵכֶם at pinananatili ang kaugnayan sa Paskuwa. Inayos ang unang talababa upang ang mga alternatibo ay tuwirang tumugma sa mga diwang 'spare' at 'protect,' nang hindi labis na ipinapakahulugan ang pandiwa.
  issues:
  - severity: low
    issue: Ang 'kapag hinampas ko' ay may aspektong maaaring basahing 'kapag natapos ko nang hampasin.'
    rationale: Ang בְּהַכֹּתִי ay temporal na 'sa/kapag ako'y humahampas' o 'sa paghampas ko,' hindi kinakailangang kilos na tapos na bago ang paglagpas.
  - severity: low
    issue: Ang alternatibong 'hindi ko kayo sasaktan' sa talababa a ay mas makitid kaysa sa 'I will spare you.'
    rationale: Ang paglalampas ay nagpapahiwatig ng pag-iwas sa mapuksaing salot, hindi lamang ng hindi pananakit. Ang 'palalampasin ko kayo' at 'iingatan ko kayo' ay mas malapit na mga alternatibo nang hindi nagdaragdag ng doktrina.
  revised_text: At ang dugo ay magiging tanda para sa inyo sa mga bahay na kinaroroonan ninyo. Kapag nakita ko ang dugo, lalampasan ko kayo[a], at hindi magkakaroon sa inyo ng salot na pupuksa[b] sa paghampas ko sa lupain ng Ehipto.
