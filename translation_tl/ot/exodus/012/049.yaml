  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: tl
  text: Iisa ang kautusan para sa katutubo at sa dayuhang naninirahan sa gitna ninyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Iisa ang tuntunin para sa katutubo at sa dayuhang naninirahan sa piling ninyo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: kautusan
  rationale: Sa kontekstong legal ng Paskuwa, tumutukoy ito sa umiiral at may-bisang tuntunin; mas angkop ang “kautusan” kaysa sa pangkalahatang “turo.”
- source_word: אַחַת
  choice: iisa
  rationale: Idinidiin nito na iisa ang pamantayang legal para sa dalawang pangkat; likas sa Tagalog ang “iisang kautusan.”
- source_word: יִהְיֶה
  choice: ang para sa
  rationale: Inihahayag ng pandiwa ang pag-iral ng iisang kautusan para sa dalawang pangkat. Ang konstruksiyong “ang para sa” ay natural at malapit sa Hebreong “magiging para sa,” nang hindi labis na nagpapaliwanag.
- source_word: אֶזְרָח
  choice: katutubo
  rationale: Tumutukoy sa taal na kasapi ng pamayanan. Iniiwasan ng “katutubo” ang makabagong pampolitikang kahulugang maaaring ipahiwatig ng “mamamayan.”
- source_word: גֵּר
  choice: dayuhang naninirahan
  rationale: Tumutukoy sa isang hindi taal na kabilang ngunit naninirahan sa pamayanan. Mas malinaw ito sa modernong Tagalog kaysa “nakikipamayan” o simpleng “dayuhan.”
- source_word: הַגָּר
  choice: naninirahan
  rationale: Pinananatili nito ang tahasang paglalarawan sa גֵּר bilang isang dayuhang naninirahan, bagaman likas na pinagsama sa pariralang Tagalog upang maiwasan ang alanganing pag-uulit.
- source_word: בְּתוֹכְכֶם
  choice: sa gitna ninyo
  rationale: Malinaw at marangal na katumbas ito ng lokatibong parirala, at ipinakikita ang paninirahan sa loob ng pamayanan.
