  source_fidelity: Tumpak na isinasalin ng “At inilagay niya ang tabing sa pasukan ng tabernakulo” ang וַיָּשֶׂם אֶת־מָסַךְ הַפֶּתַח לַמִּשְׁכָּן. Ang “inilagay” ay tumutugon sa וַיָּשֶׂם nang hindi nagdaragdag ng paraan ng pagkakabit; ang “tabing” ay angkop para sa מָסָךְ na pantabing sa bukana; at ang “pasukan ng tabernakulo” ay likas na pagpapahayag ng relasyon ng הַפֶּתַח at לַמִּשְׁכָּן.
  naturalness: Natural, malinaw, at marangal ang modernong Filipino. Ang ayos na “At inilagay niya...” ay angkop sa naratibong daloy ng talata.
