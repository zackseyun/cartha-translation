  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: tl
  text: At inilagay niya ang tabing sa pasukan ng tabernakulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina sa pintuan ng tabernakulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: At inilagay niya
  rationale: Ang שׂוּם ay nangangahulugang “ilagay” o “itakda.” Ang “inilagay” ay tuwiran at natural, at hindi nito dinaragdagan ang teksto ng tiyak na paraan ng pagkakabit.
- source_word: מָסַךְ
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa nakasabit na pantakip o harang sa pasukan. Ang “tabing” ay likas sa modernong Filipino at naihihiwalay sa natatanging panloob na “kurtina” o belo (פָּרֹכֶת).
- source_word: הַפֶּתַח
  choice: pasukan
  rationale: Ang פֶּתַח ay bukana o pasukan. Ang “pasukan” ang pinakanatural dito bilang lokasyon ng tabing.
- source_word: לַמִּשְׁכָּן
  choice: ng tabernakulo
  rationale: Ang מִשְׁכָּן ay ang santuwaryong tolda. Sa pariralang ito, natural na ipinapakita ng “pasukan ng tabernakulo” ang ugnayan ng pasukan sa gusali, habang pinananatili ang nakaugaliang terminong “tabernakulo.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang “tabing” para sa pantabing sa pasukan at “tabernakulo” bilang pamilyar na terminong biblikal. Ang panandang [a] ay nasa pangunahing teksto.
