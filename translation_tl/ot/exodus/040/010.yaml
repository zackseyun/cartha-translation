  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: tl
  text: Pahiran mo ng langis ang altar para sa handog na sinusunog at ang lahat ng kagamitan nito. Italaga mo bilang banal ang altar, at magiging kabanal-banalan[a] ang altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “banal ng mga banal,” isang superlatibong pahayag na nangangahulugang “kabanal-banalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Pahiran mo ng langis
  rationale: Sa kontekstong pangritwal, ang משׁח ay tumutukoy sa pagpapahid ng langis upang italaga sa banal na gamit. Nililinaw ng “ng langis” ang kahulugang likas sa pandiwa.
- source_word: מִזְבַּח הָעֹלָה
  choice: ang altar para sa handog na sinusunog
  rationale: Ipinakikita ng pariralang Hebreo na ito ang altar na ginagamit para sa עֹלָה, ang handog na buong sinusunog. Natural at malinaw sa modernong Tagalog ang “altar para sa handog na sinusunog.”
- source_word: כָּל כֵּלָיו
  choice: ang lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כֵּלִים at tumutukoy rito sa mga kasangkapang kaugnay ng altar. Ang “kagamitan” ay malinaw at hindi labis na nagpapakitid sa uri ng mga bagay.
- source_word: וְקִדַּשְׁתָּ
  choice: Italaga mo bilang banal
  rationale: Sa ritwal na konteksto, ang קדשׁ ay nangangahulugang ibukod o italaga para sa banal na gamit. Pinananatili ng parirala kapwa ang pagkilos ng pagtatalaga at ang banal na katayuan.
- source_word: וְהָיָה
  choice: at magiging
  rationale: Ipinahahayag ng pandiwa ang magiging kalagayan ng altar bilang bunga ng pagpapahid at pagtatalaga.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ang inuulit na anyong Hebreo ay isang superlatibong pahayag. Ang “kabanal-banalan” ay likas at maikli sa Tagalog at naghahatid ng pinakamataas na antas ng kabanalan.
theological_decisions:
- issue: Pagpapakahulugan sa pormulang pangkabanalan na קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  alternative: banal ng mga banal
  rationale: Superlatibo ang parirala at inilalarawan nito ang pinakamataas na antas ng kabanalan ng altar; hindi ito kinakailangang tumukoy sa panloob na bahagi ng santuwaryo. Inilalagay sa talababa ang literal na anyo upang mapanatili ang Hebreong larawan nang hindi nagdaragdag ng pahiwatig na panlunan.
translation_notes:
  register: Gumamit ng modernong, malinaw, at marangal na Tagalog. Pinanatili ang tuwirang anyo ng utos sa “Pahiran mo” at “Italaga mo,” at ang pag-uulit ng “altar” sa huling sugnay upang sundan ang diin ng Hebreo. Ginamit ang “altar” bilang karaniwan at madaling maunawaang katawagang pangritwal.
