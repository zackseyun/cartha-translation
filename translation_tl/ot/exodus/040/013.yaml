base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: tl
  text: At bihisan mo si Aaron ng mga banal na kasuotan, pahiran mo siya ng langis at italaga mo siya sa banal na paglilingkod, at maglilingkod siya sa akin bilang pari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “at gaganap siya bilang pari para sa akin.” Ang pandiwang Hebreo ay tumutukoy sa paglilingkod o pagganap sa katungkulan ng pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: isusuot mo kay Aaron
  rationale: 'Ang Hiphil ng לבשׁ ay causative: si Moises ang magpapasuot ng kasuotan kay Aaron. Likas sa modernong Tagalog ang hulma na “isusuot mo kay Aaron.”'
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: ang mga banal na kasuotan
  rationale: Tuwirang ipinahahayag nito ang construct na “mga kasuotan ng kabanalan” habang nananatiling natural at marangal sa Tagalog.
- source_word: וּמָשַׁחְתָּ
  choice: papahiran mo siya ng langis
  rationale: Sa konteksto ng pagtatalaga ng pari, ipinahihiwatig ng משׁח ang ritwal na pagpapahid ng langis; nilinaw ang langis upang madaling maunawaan ng karaniwang mambabasa.
- source_word: וְקִדַּשְׁתָּ
  choice: itatalaga para sa banal na gawain
  rationale: Ang Piel ng קדשׁ dito ay pagbubukod kay Aaron para sa sagradong paglilingkod. Iniiwasan ng parirala ang malabong teknikal na salita habang pinananatili ang diwa ng kabanalan.
- source_word: וְכִהֵן
  choice: maglilingkod siya ... bilang pari
  rationale: Ang כהן ay tumutukoy sa pagganap o paglilingkod sa katungkulan ng pari. Pinananatili ang ikatlong panauhan at ang koordinadong daloy ng Hebreo nang hindi ipinipilit na tahasang layunin ang ugnayan.
- source_word: לִי
  choice: sa akin
  rationale: Natural na katumbas ito ng personal na dative na nagsasaad na ang paglilingkod ay iniuukol sa Diyos.
theological_decisions:
- issue: Wika ng pagtatalaga sa pagkapari
  choice: Panatilihing magkahiwalay ang pagpapahid ng langis at pagtatalaga para sa banal na gawain.
  alternative: Pagsamahin ang dalawang kilos sa iisang salita gaya ng “ordinahan.”
  rationale: Magkakasunod at magkakaugnay ngunit magkakaibang ritwal na kilos ang inilalahad ng Hebreo. Ang pagpapanatili sa bawat isa ay umiiwas sa pagpasok ng mga kategoryang pangsimbahan na wala sa teksto.
- issue: Lakas ng וְכִהֵן לִי
  choice: “at maglilingkod siya sa akin bilang pari”
  alternative: “upang makapaglingkod siya sa akin bilang pari”
  rationale: Maaaring maunawaan ang huling sugnay bilang bunga ng mga naunang kilos, ngunit ang payak na “at” ay mas direktang nagpapanatili sa sintaktikong pagkakasunod at sa posibleng ambiguwidad ng ugnayan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “pari,” ang karaniwang salitang Tagalog para sa priest, nang walang pag-aangkop sa isang tiyak na tradisyong denominasyonal.
