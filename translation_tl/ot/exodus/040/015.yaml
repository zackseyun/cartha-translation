base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: tl
  text: Pahiran mo sila kung paanong pinahiran mo ang kanilang ama, upang makapaglingkod sila sa akin bilang mga pari. At ang pagpapahid sa kanila ay magdudulot sa kanila ng pagkaparing panghabang-panahon[a] sa lahat ng salinlahi nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “walang-hanggang pagkapari.” Sa kontekstong pangtipan, ang salitang Hebreo ay maaaring tumukoy sa namamalaging pagpapatuloy ng pagkapari sa bawat salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Pahiran mo sila
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubilin ay may puwersang pautos; natural itong ipinapahayag sa modernong Tagalog sa pamamagitan ng pautos na anyo.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: gaya ng pagpahid mo sa kanilang ama
  rationale: Pinananatili ang malinaw na paghahambing sa pagpapahid kay Aaron, na ama ng mga anak na tinutukoy.
- source_word: וְכִהֲנוּ לִי
  choice: upang makapaglingkod sila sa akin bilang mga pari
  rationale: Ang pandiwang כהן ay nangangahulugang gumanap o maglingkod bilang pari; malinaw sa Tagalog ang layunin at ang paglilingkod na ukol sa Diyos.
- source_word: מָשְׁחָתָם
  choice: pagkakapahid sa kanila
  rationale: Tumutukoy ito sa pagpapahid o pagtatalaga sa pamamagitan ng pagpapahid, hindi tahasang sa langis; ang anyong ito ay mas natural kaysa sa literal na 'kanilang pagpapahid.'
- source_word: לִכְהֻנַּת עוֹלָם
  choice: walang-hanggang pagkapari
  rationale: Ang כְּהֻנָּה ay kalagayan o tungkulin ng pagkapari, at ang עוֹלָם ay nagsasaad ng namamalagi o patuloy na bisa sa kontekstong tipan.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng salinlahi nila
  rationale: Ipinahahayag ang pagpapatuloy sa magkakasunod na salinlahi ng mga inapo ni Aaron sa natural na modernong Tagalog.
theological_decisions:
- issue: Tagal na ipinahihiwatig ng עוֹלָם sa wikang pangtipan tungkol sa pagkapari
  choice: walang-hanggang pagkapari
  alternative: panghabang-panahong pagkapari
  rationale: Pinananatili sa pangunahing teksto ang matibay na pahayag ng Hebreo, ngunit nililinaw sa talababa na maaari itong tumukoy sa patuloy na bisa sa bawat salinlahi sa loob ng kontekstong pangtipan, nang hindi ipinipilit ang isang abstraktong pilosopikal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pagkapari” para sa institusyon o tungkuling saserdotal, at iniwasan ang sobrang literal na ayos ng Hebreo na magiging mabigat sa karaniwang mambabasa.
