base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: tl
  text: Pagkatapos, itinayo niya ang bakuran sa palibot ng tabernakulo at ng altar, at inilagay ang tabing[a] sa pasukan ng bakuran. At natapos ni Moises ang gawain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pantabing” o “kurtina.” Ang salitang Hebreo ay tumutukoy sa telang pantakip sa pasukan ng bakuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: itinayo
  rationale: Ang Hiphil ng קום sa konteksto ng pagtatayo ng santuwaryo ay nangangahulugang itayo o ilagay sa ayos ang isang estruktura. Likas at malinaw sa Filipino ang “itinayo.”
- source_word: הֶחָצֵר
  choice: ang bakuran
  rationale: Tumutukoy ang חָצֵר sa nakabakod na panlabas na lugar sa palibot ng tabernakulo. Mas karaniwan at madaling maunawaan ang “bakuran” kaysa “looban” o “patyo” sa kontekstong ito.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahihiwatig ng pang-abay ang pag-ikot o pagkakapaligid ng bakuran sa tabernakulo at altar.
- source_word: לַמִּשְׁכָּן
  choice: ng tabernakulo
  rationale: Ang “tabernakulo” ang kinikilalang teknikal na katawagan sa toldang santuwaryo sa Exodo at pinananatili nito ang natatanging kultikong kahulugan ng מִשְׁכָּן.
- source_word: וְלַמִּזְבֵּחַ
  choice: at ng altar
  rationale: Tuwirang salin ng מִזְבֵּחַ; magkasamang nasa loob at napalilibutan ng bakuran ang tabernakulo at altar.
- source_word: וַיִּתֵּן
  choice: ikinabit
  rationale: Bagaman pangunahing nangangahulugang “inilagay” ang נתן, sa konteksto ng pantabing na inilalagay sa pasukan, mas tiyak at natural ang “ikinabit” nang hindi dinaragdagan ang diwa.
- source_word: מָסַךְ
  choice: ang tabing
  rationale: Ang מָסַךְ ay telang nagsisilbing pantakip sa pasukan. Ang “tabing” ay natural, marangal, at sapat na malawak upang mapanatili ang leksikal na saklaw nito.
- source_word: שַׁעַר הֶחָצֵר
  choice: sa pasukan ng bakuran
  rationale: Bagaman literal na “pintuang-bayan/tarangkahan ng bakuran,” telang tabing ang nakalagay rito; mas malinaw sa modernong Filipino ang “pasukan” at hindi nito ipinahihiwatig ang isang matigas na pintuan.
- source_word: וַיְכַל
  choice: natapos
  rationale: Ipinahahayag ng כלה ang pagdadala ng gawain sa ganap na katapusan. Likas sa Filipino ang “natapos ni Moises ang gawain.”
- source_word: הַמְּלָאכָה
  choice: ang gawain
  rationale: Tumutukoy ang מְלָאכָה sa kabuuang gawaing pagtatayo at paghahanda; ang “gawain” ang malinaw at natural na buod nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang kinikilalang terminong “tabernakulo,” habang pinili ang pangkaraniwang “bakuran,” “pasukan,” at “tabing” upang madaling maunawaan ng karaniwang mambabasa. Inilipat ang panandang talababa sa mismong “tabing,” ang salitang aktuwal na tinutukoy ng tala.
