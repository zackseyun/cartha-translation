  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At nagsunog siya ng mabangong insenso[a] sa ibabaw nito, ayon sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “insensong gawa sa mababangong sangkap” o “insensong may mga espesiya.” Ang pariralang Hebreo ay tumutukoy sa insensong gawa sa mababangong sangkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: nagsunog
  rationale: Ang Hiphil ng קטר ay tumutukoy sa pagsunog ng handog upang pumailanlang ang usok; sa kontekstong ito, malinaw sa layon na insenso ang sinusunog.
- source_word: עָלָיו
  choice: roon
  rationale: Tumutukoy ito sa altar ng insenso sa naunang talata. Mas natural sa modernong Tagalog ang “nagsunog siya roon” kaysa “nagsunog siya sa ibabaw nito,” nang hindi nawawala ang lokatibong diwa.
- source_word: קְטֹרֶת סַמִּים
  choice: mabangong insenso
  rationale: Ang parirala ay tumutukoy sa insensong yari sa mababangong sangkap. Ang “mabangong insenso” ay natural at malinaw, samantalang pinananatili ng talababa ang mas literal na alternatibo.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ayon sa iniutos
  rationale: Ipinahahayag nito ang ganap na pagsunod ng kilos sa naunang utos; natural sa Tagalog ang “ayon sa iniutos.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalang Moses sa Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng interpretasyong denominasyonal.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “roon” bilang natural na pagtukoy sa altar na binanggit sa konteksto; iniwasan ang mas mabigat at di-likas na “sa ibabaw nito.”
