  text: וְ/נָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה לִ/פְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: tl
  text: At ilalagay mo ang altar ng handog na sinusunog sa harap ng pasukan ng tabernakulo, ang tolda ng pakikipagtagpo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: At ilalagay mo
  rationale: Ang נָתַתָּה ay nangangahulugang ilagay o itakda sa kontekstong ito; natural at malinaw ang panghinaharap na utos na “ilalagay mo.”
- source_word: מִזְבַּח הָעֹלָה
  choice: ang altar ng handog na sinusunog
  rationale: Ang מִזְבַּח ay altar, at ang עֹלָה ay handog na lubusang sinusunog; pinananatili ng parirala ang teknikal na kahulugang panghain sa paraang madaling maunawaan.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Dito ay malinaw na tumutukoy ang לִפְנֵי sa pisikal na lokasyon sa unahan ng pasukan.
- source_word: פֶּתַח
  choice: pasukan
  rationale: Ang פֶּתַח ay bukana o pasukan; “pasukan” ang pinakanatural sa paglalarawan ng estruktura.
- source_word: מִשְׁכַּן
  choice: tabernakulo
  rationale: Ginagamit ang kinikilalang terminong “tabernakulo” para sa banal na tirahang inilalarawan sa Exodo.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pakikipagtagpo
  rationale: Ang takdang katawagan ay literal na tolda ng itinakdang pakikipagtagpo; ipinahihiwatig nito ang lugar ng pakikipagtagpo nang hindi nililimitahan kung sino ang nagtatagpo.
theological_decisions:
- issue: Ugnayan ng מִשְׁכַּן at אֹהֶל מוֹעֵד
  choice: “ang tabernakulo, ang tolda ng pakikipagtagpo” bilang dalawang magkaugnay na katawagan
  alternative: Ituring ang “tolda ng pakikipagtagpo” bilang hiwalay na estrukturang pinangungunahan ng pasukan ng tabernakulo
  rationale: 'Pinakamalamang na appositional ang Hebreo: ang אֹהֶל מוֹעֵד ay nagpapakilala o naglalarawan sa מִשְׁכַּן. Pinananatili ng kuwit ang anyo nang hindi nagdaragdag ng paliwanag.'
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang mga kinikilalang katawagang pangsantuwaryo, habang ginawang tuwiran at natural ang utos.
