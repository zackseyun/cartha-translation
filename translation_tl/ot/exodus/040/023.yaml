  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At inayos niya sa ibabaw nito ang hanay ng mga tinapay[a] sa harap ni Yahweh, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang pagkakaayos ng mga tinapay”; tradisyonal na salin, “ang tinapay ng Presensya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: inayos
  rationale: Ang pandiwang ערך ay nangangahulugang mag-ayos o maglagay ayon sa takdang kaayusan; natural at angkop sa kontekstong pangsamba ang “inayos.”
- source_word: עָלָיו
  choice: sa ibabaw nito
  rationale: Tumutukoy ang panghalip sa mesa sa naunang talata at pinananatili ang malinaw na ugnayang panlunan.
- source_word: עֵרֶךְ לֶחֶם
  choice: ang tinapay ayon sa pagkakaayos nito
  rationale: Ipinahahayag nito ang tinapay na inilatag sa takdang ayos, nang hindi ipinapalit ang mas tradisyonal ngunit hindi eksaktong pariralang “tinapay ng Presensya.”
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na katumbas ng pormulang Hebreo na nangangahulugang nasa harap o presensya ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Malinaw na ipinakikita ang pagtupad ayon sa naunang utos ng Diyos, sa natural na makabagong Tagalog.
theological_decisions:
- issue: Paglalarawan sa עֵרֶךְ לֶחֶם
  choice: ang tinapay ayon sa pagkakaayos nito
  alternative: ang tinapay ng Presensya
  rationale: Ang mismong talata ay gumagamit ng pariralang tumutukoy sa kaayusan ng tinapay, hindi ng teknikal na pariralang לֶחֶם הַפָּנִים; pinananatili sa talababa ang tradisyonal na katawagan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sa ibabaw nito” upang maging malinaw ang pagtukoy sa mesa, at pinanatili ang bahagyang teknikal na diwa ng takdang pagkakaayos ng tinapay nang hindi nagiging sobrang literal.
