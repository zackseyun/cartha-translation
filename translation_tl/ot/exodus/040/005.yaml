  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: tl
  text: Ilagay mo ang gintong altar para sa insenso[a] sa harap ng kaban ng patotoo[b], at ilagay mo ang tabing para sa pasukan ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na katawagan, “ang gintong altar ng insenso.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kaban ng patotoo”; madalas itong tawaging “kaban ng tipan” sa tradisyonal na mga salin.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Ilagay mo
  rationale: Ang נתן ay maaaring mangahulugang ‘ilagay’; natural ito para sa pagpuwesto ng kagamitang banal at pinananatili ang anyong utos ng Hebreo.
- source_word: מִזְבַּח הַזָּהָב
  choice: ang altar na ginto
  rationale: Tuwirang inilalarawan ng parirala ang altar ayon sa materyal nito. Mas natural sa modernong Tagalog ang ‘altar na ginto’ kaysa ‘gintong altar’ sa pormal na salin.
- source_word: לִקְטֹרֶת
  choice: para sa insenso
  rationale: Ipinahihiwatig ng ל ang layunin o gamit ng altar; malinaw itong naipapahayag ng ‘para sa insenso’ nang hindi ginagawang simpleng katawagang ‘altar ng insenso.’
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pangunahing diwang panglokasyon ng לִפְנֵי rito ang ‘sa harap ng.’
- source_word: אֲרוֹן הָעֵדֻת
  choice: kaban ng patotoo
  rationale: Pinananatili ang tahasang עֵדֻת, ‘patotoo,’ sa halip na ipalit ang tradisyonal ngunit hindi eksaktong ‘tipan.’
- source_word: וְשַׂמְתָּ
  choice: ikabit mo
  rationale: Bagaman literal na ‘ilagay mo,’ ang tabing sa pasukan ay isinasabit o ikinakabit; ang ‘ikabit’ ay natural na pagpapahayag ng nilalayong paglalagay sa kontekstong ito.
- source_word: מָסַךְ
  choice: ang tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa nakasabit na pantabing sa pasukan. Ang ‘tabing’ ay natural at naiiba sa katawagang ‘belo.’
- source_word: הַפֶּתַח
  choice: sa pasukan
  rationale: Ang פֶּתַח ay bukana o pasukan; ‘pasukan’ ang pinakanatural dito.
- source_word: לַמִּשְׁכָּן
  choice: ng tabernakulo
  rationale: Sa pariralang tumutukoy sa tabing ng pasukan, natural sa Tagalog ang ‘pasukan ng tabernakulo.’ Ang ‘tabernakulo’ ay kinikilalang terminong panrelihiyon para sa מִשְׁכָּן.
theological_decisions:
- issue: Pagbibigay-kahulugan sa עֵדֻת sa katawagan sa kaban
  choice: kaban ng patotoo
  alternative: kaban ng tipan
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng עֵדֻת, ‘patotoo.’ Pinananatili ito upang hindi ipalit ang mas pamilyar ngunit hindi eksaktong tradisyonal na katawagang ‘kaban ng tipan.’
translation_notes:
  register: Modernong Filipino na pormal at marangal ngunit madaling maunawaan. Ginamit ang karaniwang biblikal na mga terminong ‘altar,’ ‘insenso,’ at ‘tabernakulo’; iniwasan ang labis na makalumang ayos ng pangungusap. Inayos ang pagkakasunod upang luminaw agad ang lokasyon ng altar.
