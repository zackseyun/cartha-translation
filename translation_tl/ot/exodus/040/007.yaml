  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: tl
  text: Ilagay mo ang palanggana sa pagitan ng toldang tipanan at ng altar,[a] at maglagay ka roon ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “palanggana” ay isinasalin ding “hugasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Ilagay mo
  rationale: Ang נתן ay malawak na pandiwang maaaring mangahulugang magbigay, maglagay, o magtakda. Sa utos tungkol sa lokasyon ng isang kagamitan, natural at tumpak ang “ilagay.”
- source_word: הַכִּיֹּר
  choice: ang palanggana
  rationale: Ang כִּיּוֹר ay sisidlang ginagamit sa paghuhugas sa paglilingkod sa tabernakulo. Ang “palanggana” ay malinaw at pangkaraniwang salitang Filipino; mas madaling maunawaan ito kaysa sa tradisyonal ngunit di-pamilyar na “laver.”
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: sa pagitan ng toldang tipanan at ng altar
  rationale: Ang בֵּין...וּבֵין ay tumutukoy sa puwang sa pagitan ng dalawang bagay. Isinasalin ng “toldang tipanan” ang אֹהֶל מוֹעֵד sa natural at dignified na Filipino habang pinananatili ang ideya ng itinakdang pakikipagtagpo.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ang מִזְבֵּחַ ay tuwirang nangangahulugang altar. Walang mas tiyak na uri ng altar na binanggit sa talata.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: at lagyan mo roon ng tubig
  rationale: Literal na ayos nito ang “at maglagay ka roon ng tubig.” Sa Filipino, ang “lagyan mo roon ng tubig” ay natural at ipinahihiwatig na ang palanggana ang lalagyan, habang pinananatili ng “roon” ang שָׁם.
