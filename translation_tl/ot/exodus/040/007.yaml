translation_notes:
  register: Modernong Filipino Tagalog na malinaw, maikli, at marangal. Ginamit ang tuwirang anyong pautos na “Ilagay mo” at “lagyan mo,” na angkop sa Hebreong ikalawang panauhang panlalaki na isahan. Pinanatiling maliit ang titik sa mga paglalarawang “toldang tipanan” at “altar,” at inilagay ang panandang talababa [a] sa mismong teksto.
