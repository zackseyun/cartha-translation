    issue: Hindi likas ang “lagyan mo roon ng tubig.”
    rationale: Karaniwang nangangailangan ang “lagyan” ng malinaw na layon, gaya ng “lagyan mo ito ng tubig.” Dahil ang Hebreo ay gumagamit ng שָׁם (“roon/doon”) at hindi ng tahasang “ito,” mas angkop ang “maglagay ka roon ng tubig.”
  - severity: low
    issue: Ang talababa ay gumagamit ng “laver,” isang terminong Ingles, bilang alternatibo sa tekstong Tagalog.
    rationale: Mas kapaki-pakinabang sa mambabasang Filipino ang alternatibong “hugasan,” habang malinaw na ito ay isang salin lamang ng terminong Hebreo at hindi pagbabago ng kahulugan.
