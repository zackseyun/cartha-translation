  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: tl
  text: At ilapit mo ang mga anak na lalaki niya, at bihisan mo sila ng mga tunika.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “iharap mo ang mga anak na lalaki niya.” Ang pandiwang Hebreo ay madalas may pormal at panritwal na diwa ng paglalapit ng isang tao para sa sagradong paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: At
  rationale: Ang pangatnig at pananda ng tuwirang layon ay nagpapatuloy sa sunod na tagubilin; hindi kailangang isalin nang hiwalay sa Tagalog ang pananda ng layon.
- source_word: בָּנָיו
  choice: ang kanyang mga anak
  rationale: Sa konteksto, tumutukoy ito sa mga lalaking anak ni Aaron. Likas sa Tagalog ang “mga anak,” at malinaw na ang tinutukoy na mga anak dito ay yaong itatalaga bilang mga pari.
- source_word: תַּקְרִיב
  choice: ilapit mo
  rationale: Ang Hiphil ng קרב ay nangangahulugang magpalapit o iharap, at may pormal na kahulugang kaugnay ng paglilingkod sa santuwaryo. Pinananatili ng “ilapit” ang kongkretong larawan at sagradong pahiwatig ng pandiwa.
- source_word: וְהִלְבַּשְׁתָּ
  choice: at bihisan
  rationale: Tumpak at natural na ipinapahayag ng “bihisan” ang sanhiang diwa na ipasuot sa isang tao ang kasuutan.
- source_word: אֹתָם
  choice: sila
  rationale: Tuwirang tumutukoy ang panghalip sa mga anak na naunang binanggit.
- source_word: כֻּתֳּנֹת
  choice: mga tunika
  rationale: Ang salita ay tumutukoy sa mahahabang panloob o pangunahing kasuutan. Ang “tunika” ay mas tiyak kaysa “damit” at hindi nagdaragdag ng materyal na hindi binanggit sa talata.
theological_decisions:
- issue: Pampagkapari at panritwal na pahiwatig ng קרב
  choice: ilapit mo
  alternative: iharap mo; papuntahin mo sa harap
  rationale: Nasa konteksto ang pagtatalaga at pagsusuot ng kasuotang pampagkapari sa mga anak ni Aaron. Pinananatili ng “ilapit” ang posibleng pormal at panritwal na diwa nang hindi ipinapakahulugang higit sa tahasang sinasabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tunika” bilang tiyak ngunit madaling maunawaang katawagan sa sinaunang kasuutan; iniwasang idagdag ang “lino” dahil wala iyon sa talatang Hebreo.
