  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Tuwing pumapasok sila sa tolda ng tipanan at tuwing lumalapit sila sa altar, naghuhugas sila, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Tuwing pumapasok sila
  rationale: Ang ב na sinusundan ng infinitive construct at hulaping 3mp ay nagsasaad ng panahong pangyayari. Ipinahihiwatig ng konteksto ang paulit-ulit na gawaing makasaserdote, kaya ang “tuwing” angkop at likas sa Tagalog.
- source_word: אֹהֶל מוֹעֵד
  choice: toldang tipanan
  rationale: Likas at maikli itong katawagan sa santuwaryong tolda kung saan nakikipagtagpo si Yahweh sa Israel; pinananatili nito ang natatanging kahulugang pangkulto ng parirala.
- source_word: וּבְקָרְבָתָם
  choice: at tuwing lumalapit sila
  rationale: Ang ikalawang ב na may infinitive construct ay temporal din. Ang “lumalapit” ay natural na paglalarawan ng paglapit sa altar at nagpapanatili sa paralelismo ng dalawang sugnay.
- source_word: הַמִּזְבֵּחַ
  choice: sa altar
  rationale: Ang “altar” ang karaniwan at malinaw na modernong salin ng מִזְבֵּחַ; naipapakita ng “sa” at ng konteksto ang tiyak na altar.
- source_word: יִרְחָצוּ
  choice: naghuhugas sila
  rationale: Ang imperfect ay naglalarawan dito ng nakaugaliang kilos sa salaysay. Ang aspektong nagaganap ng “naghuhugas” kasabay ng “tuwing” ay malinaw na naghahayag ng paulit-ulit na gawain nang hindi nagdaragdag ng tahasang layon na wala sa talata.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Natural itong nagpapahayag ng pagsunod alinsunod sa naunang utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang ganap na anyong Hebreo ay tumutukoy sa utos na naibigay na. Sa Tagalog, sapat at natural ang “iniutos” upang ipakita ang naunang utos nang hindi nangangailangan ng mabigat na konstruksyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Bagaman minamarkahan ng אֶת ang taong inutusan sa Hebreo, likas sa Tagalog ang konstruksyong “iniutos … kay Moises.”
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
- issue: Kung ano ang hinuhugasan
  choice: Hindi tahasang tinukoy ang layon ng paghuhugas
  alternative: “hinuhugasan nila ang kanilang mga kamay at paa”
  rationale: Bagaman malinaw ang mga kamay at paa mula sa kalapit na konteksto, walang tahasang layon ang יִרְחָצוּ sa talatang ito. Hindi ito idinagdag upang mapanatili ang anyo at saklaw ng mismong talata.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “tuwing” upang ihayag ang nakaugaliang pagpasok at paglapit, at “toldang tipanan” bilang maikli at pamilyar na katawagang biblikal. Walang footnote dahil hindi kailangan ng tekstuwal o leksikal na paglilinaw sa mismong limbag na talata.
