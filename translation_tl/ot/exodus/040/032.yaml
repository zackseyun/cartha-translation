  verdict: revise
  source_fidelity: Tumpak na naihahayag ng draft ang paulit-ulit na pagpasok sa Ohel Moed, paglapit sa altar, at paghuhugas, pati ang pagsunod sa utos ni Yahweh kay Moises. Ang “tuwing” ay angkop sa nakaugaliang kilos na isinasaad ng dalawang temporal na infinitive construction.
  naturalness: Likas ang kabuuang pangungusap sa modernong Filipino Tagalog. Gayunman, mas malinaw at mas karaniwan sa katawagang biblikal ang “tolda ng tipanan” kaysa “toldang tipanan”; malinaw nitong ipinahihiwatig na ang tipanan/pakikipagtagpo ang tinutukoy ng ikalawang pangngalan.
  terminology: Panatilihin ang “Yahweh,” “altar,” at “Moises.” Ang “tolda ng tipanan” ay mas tapat ding kumakatawan sa construct phrase na אֹהֶל מוֹעֵד kaysa sa anyong pang-uri na “toldang tipanan.”
