  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: tl
  text: At hindi makapasok si Moises sa tolda ng pagpupulong, sapagkat dumapo sa ibabaw nito ang ulap[a], at napuno ng kaluwalhatian ni Yahweh ang tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nanatili sa ibabaw nito” o “nanahan sa ibabaw nito.” Maaaring tumukoy ang pandiwang Hebreo sa paninirahan, pananatili, o pagdapo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא יָכֹל
  choice: At hindi makapasok
  rationale: Pinananatili ng “At” ang tuwirang pagpapatuloy ng salaysay, habang malinaw na ipinahahayag ng “hindi makapasok” ang kawalan ng kakayahang pumasok, hindi lamang ang katotohanang hindi siya pumasok.
- source_word: לָ/בוֹא
  choice: makapasok
  rationale: Natural sa makabagong Tagalog para sa pagpasok sa isang gusali o banal na tolda at angkop sa pandiwang nagsasaad ng kakayahan.
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Tuwirang ipinahahayag ang toldang itinakda bilang dako ng pakikipagtagpo o pagpupulong, nang hindi ito ginagawang pantanging pangalan.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikita ang sanhi kung bakit hindi makapasok si Moises, sa isang dignified ngunit karaniwang rehistro.
- source_word: שָׁכַן עָלָיו
  choice: humimpil sa ibabaw nito
  rationale: Ipinakikita ang kongkretong larawan ng ulap na tumigil at nanatili sa ibabaw ng tolda. Hindi nito lubusang isinasara ang mas malawak na diwa ng paninirahan na taglay ng ugat.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Pinananatili ang katiyakan ng tinutukoy na ulap, na kilala na sa naunang salaysay.
- source_word: וּ/כְבוֹד יְהוָה
  choice: at ... ng kaluwalhatian ni Yahweh
  rationale: Pinananatili ang ugnayang genitibo at ang mabigat na teolohikal na kahulugan ng כָּבוֹד bilang “kaluwalhatian.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מָלֵא
  choice: napuno
  rationale: Natural na inilalarawan sa Tagalog ang naganap na kalagayan ng tabernakulo na lubos na napuspos ng kaluwalhatian.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ito ang nakagawiang tiyak na katawagan sa portable na santuwaryo sa Exodo at ipinag-iiba ito sa “tolda ng pagpupulong” sa parehong talata.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng שָׁכַן kaugnay ng paninirahan ng Diyos
  choice: humimpil sa ibabaw nito
  alternative: nanahan dito o namalagi rito
  rationale: Itinatampok ng pangunahing teksto ang kongkretong larawan ng ulap na tumigil sa ibabaw ng tolda, samantalang inilalagay sa talababa ang tunay na leksikal na posibilidad ng paninirahan o pananatili.
- issue: Ugnayan ng kaluwalhatian at tabernakulo sa מָלֵא
  choice: napuno ng kaluwalhatian ni Yahweh ang tabernakulo
  alternative: pinuno ng kaluwalhatian ni Yahweh ang tabernakulo
  rationale: Iniiwasan ng anyong “napuno” ang pagdaragdag ng tahasang gumaganap na hindi hiwalay na ipinahahayag ng pandiwang Hebreo, habang malinaw pa rin ang kinalabasan.
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “sapagkat” at “tabernakulo” bilang pamilyar na wikang biblikal, ngunit iniwasan ang lipas o labis na teknikal na pananalita. Inilipat ang pananda [a] sa “ulap,” kung saan malinaw na nauugnay ito sa pandiwang may leksikal na alternatibo.
