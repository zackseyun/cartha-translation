reference: Exodus 40:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ מֹשֶׁ֑ה כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: tl
  text: At ginawa ni Moises ang lahat ayon sa iniutos sa kanya ni Yahweh[a]; gayon nga ang ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; ayon sa tradisyon ay isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: At ginawa
  rationale: Ang עשה ay maaaring mangahulugang “gumawa” o “isagawa.” Dito, tumutukoy ito sa masunuring pagsasagawa ni Moises ng lahat ng iniutos, at natural sa Tagalog ang “ginawa.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa modernong Filipino.
- source_word: כְּכֹל
  choice: ang lahat ayon sa
  rationale: Pinananatili nito kapwa ang saklaw ng כֹל (“lahat”) at ang diwa ng pagsunod o pagtutugma na ipinahihiwatig ng כְּ (“ayon sa”).
- source_word: אֲשֶׁר צִוָּה
  choice: iniutos
  rationale: Likas at tuwirang Filipino para sa utos na naunang ibinigay; hindi kailangang gawing lantad ang aspektong pluperfect dahil malinaw ang pagkakasunod sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֹתוֹ
  choice: sa kanya
  rationale: Ang direct-object marker na may panlaping panlalaking isahan ay tumutukoy kay Moises; hinihingi ng pandiwang Filipino na “iniutos” ang pariralang “sa kanya.”
- source_word: כֵּן עָשָׂה
  choice: gayon nga ang ginawa niya
  rationale: Pinananatili ang resumptibo at mariing pag-uulit ng Hebreo. Ang “nga” ay natural na nagpapatingkad sa eksaktong pagtupad nang hindi inaalis ang pag-uulit.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang tekstong Hebreo ay tahasang gumagamit ng Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan at hindi bilang pamalit na titulo.
- issue: Mariing paglalarawan sa pagsunod ni Moises
  choice: 'Pinanatili ang pag-uulit: “ginawa … gayon nga ang ginawa niya”'
  alternative: Pinaikli sa “sinunod niya ang lahat”
  rationale: Ang pag-uulit ng עשה at ang resumptibong כֵּן ay sadyang nagbibigay-diin sa ganap na pagtutugma ng ginawa ni Moises sa utos; hindi ito dapat pakinisin hanggang mawala ang retorikal na diin.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang bahagyang pormal at mariing pag-uulit ng Hebreo, ngunit inayos ang ayos ng mga salita upang maging natural sa Tagalog.
