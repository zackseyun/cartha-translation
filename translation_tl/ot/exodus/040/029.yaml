base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Inilagay niya ang altar ng handog na sinusunog sa pasukan ng tabernakulo ng tolda ng pagpupulong. Sa ibabaw nito ay inihandog niya ang handog na sinusunog at ang handog na butil, ayon mismo sa iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: altar ng handog na sinusunog
  rationale: Pinananatili ang tiyak na katawagan sa altar ayon sa pangunahing gamit nito, habang gumagamit ng malinaw at karaniwang pariralang Filipino.
- source_word: שָׂם
  choice: Inilagay
  rationale: Likas at tuwirang salin sa konteksto ng paglalagay ng mga kagamitan sa tabernakulo.
- source_word: פֶּתַח
  choice: sa pasukan ng
  rationale: Malinaw na ipinahahayag ang lokasyon sa bungad o pasukan nang hindi dinaragdagan ang spatial na kahulugan.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: tabernakulo, ang tolda ng pagtitipon
  rationale: Pinananatili ang dalawang katawagan sa Hebreo at inuunawa ang ikalawa bilang paliwanag sa una; mas natural ito sa Filipino kaysa sa sunod-sunod na pariralang may “ng.”
- source_word: וַיַּעַל עָלָיו
  choice: Sa ibabaw nito ay inihandog niya
  rationale: Ang עלה sa kontekstong panghandog ay nangangahulugang maghandog; malinaw ring pinananatili na sa altar ginawa ang paghahandog.
- source_word: הָעֹלָה
  choice: handog na sinusunog
  rationale: Tiyak at madaling maunawaang katawagan para sa עֹלָה, ang handog na lubusang sinusunog sa altar.
- source_word: הַמִּנְחָה
  choice: handog na butil
  rationale: Sa kontekstong pangsaserdote, tumutukoy ang מִנְחָה sa handog na mula sa butil, hindi lamang sa pangkalahatang regalo o tributo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ayon mismo sa iniutos ni Yahweh kay Moises
  rationale: Ipinahahayag ng “ayon mismo” ang eksaktong pagsunod ni Moises, at likas sa Filipino ang “iniutos ... kay Moises” para sa naunang utos.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Ugnayan ng מִשְׁכַּן at אֹהֶל מוֹעֵד
  choice: tabernakulo, ang tolda ng pagtitipon
  alternative: tabernakulo ng tolda ng pagtitipon
  rationale: Maaaring basahin ang magkakasunod na katawagan bilang magkaugnay na pagtukoy sa santuwaryo. Ang appositional na anyo ay nagpapanatili sa dalawang termino at umiiwas sa hindi likas na pagsasalansan ng mga pariralang “ng” sa Filipino.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “tabernakulo” bilang nakasanayang katawagang biblikal at agad itong nilinaw ng “ang tolda ng pagtitipon.” Hinati sa dalawang pangungusap para sa natural na daloy nang hindi binabago ang ugnayan ng mga kilos.
