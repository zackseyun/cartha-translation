base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: tl
  text: Pagkatapos, ilapit mo si Aaron at ang kanyang mga anak na lalaki sa pasukan ng Toldang Tipanan, at hugasan mo sila ng tubig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: ilapit mo
  rationale: Ang Hiphil ng קרב ay nagsasaad ng pagpapalapit. Likas sa modernong Tagalog ang “ilapit mo” at napananatili nito ang causative at ritwal na diwa.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Ginamit ang karaniwang anyo ng pangalang ito sa Tagalog na Bibliya.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga lalaking anak ang tinutukoy ng Hebrew, na mahalaga rin sa konteksto ng pagkasaserdote.
- source_word: פֶּתַח
  choice: pasukan
  rationale: Natural at malinaw na tumutukoy sa dakong dinaraanan papasok sa tolda.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ito ang pamilyar at dignified na katawagan sa modernong saling Tagalog para sa banal na toldang itinakdang lugar ng pakikipagtagpo; hindi nito dinaragdagan ang ritwal na detalye ng teksto.
- source_word: וְרָחַצְתָּ
  choice: hugasan mo
  rationale: Sapat na malawak ang “hugasan” upang katawanin ang רחץ nang hindi ipinapalagay ang mas tiyak na paraan ng paliligo.
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy ito kay Aaron at sa kanyang mga anak na lalaki bilang isang pangkat.
- source_word: בַּמָּיִם
  choice: ng tubig
  rationale: Instrumental ang gamit ng בּ; ang “hugasan ... ng tubig” ang natural na pagpapahayag nito sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong nag-uutos. Ginamit ang “Pagkatapos” upang natural na ipakita ang pagkakasunod-sunod na ipinahihiwatig ng וְ sa konteksto. Walang kinakailangang talababa.
