- from: Doon naghugas sina Moises, Aaron, at ang mga anak niyang lalaki ng kanilang mga kamay at paa.[a]
  to: Mula roon ay naghugas sina Moises, Aaron, at ang mga anak ni Aaron ng kanilang mga kamay at paa.[a]
  rationale: Pinalitan ang locative na “Doon” ng “Mula roon” upang maipakita ang מן (“mula sa/from”) nang hindi dinaragdagan ang teksto ng “tubig.” Inayos din ang pagtukoy sa mga anak bilang “mga anak ni Aaron” para sa malinaw na antecedent at likas na Tagalog.
