review_pass:
  verdict: revise
  source_fidelity: 'Kailangang baguhin ang “Doon,” dahil locative ito (“there”) samantalang ang מִמֶּנּוּ ay may kahulugang pinagmulan: “mula rito/mula roon,” na tumutukoy sa palanggana. Pinananatili ng rebisyon ang nakaraang kilos ng wayyiqtol at ang pagtukoy sa mga anak na lalaki ni Aaron.'
  naturalness: Likas at malinaw sa modernong Tagalog ang “Mula roon ay naghugas sina Moises, Aaron, at ang mga anak ni Aaron ...” Mas maayos ding tahasang banggitin si Aaron sa huling parirala kaysa umasa sa panghalip na “niyang,” na maaaring bahagyang bumagal sa pag-unawa sa isang talaang may maraming tauhan.
  terminology: Ang “palanggana,” “naghugas,” “mga anak ni Aaron,” “mga kamay,” at “paa” ay angkop sa payak ngunit marangal na rehistro. Hindi idinadagdag ng teksto ang “tubig,” sapagkat ang Hebreo ay tumutukoy sa palanggana sa pamamagitan ng panghalip.
  issues:
  - severity: medium
    issue: Ang “Doon” ay hindi tumutumbas sa kahulugang pinagmulan ng מִמֶּנּוּ.
    rationale: Ang מן na may hulaping panghalip ay “mula rito/mula roon” (“from it”), hindi lamang “doon” (“there”). Ang kasalukuyang salin ay naglilipat ng diin mula sa pinagmulan tungo sa lugar.
  - severity: low
    issue: Hindi lubos na magkatugma ang katawan ng salin at ang talababa.
    rationale: Ang katawan ay “Doon,” ngunit sinasabi ng talababa na ang mas literal ay “mula roon.” Ang rebisyon ay ginagawang pangunahing salin ang literal na direksiyong ito.
  revised_text: Mula roon ay naghugas sina Moises, Aaron, at ang mga anak ni Aaron ng kanilang mga kamay at paa.[a]
  revised_footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan nito”; mas literal sa Hebreo ang “mula roon,” na tumutukoy sa palanggana.
    reason: lexical_alternative
