  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: tl
  text: Mula roon ay naghugas sina Moises, Aaron, at ang mga anak ni Aaron ng kanilang mga kamay at paa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan nito”; mas literal sa Hebreo ang “mula roon,” na tumutukoy sa palanggana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: naghugas
  rationale: Ang Qal wayyiqtol ng רחץ ay nagsasalaysay ng naganap na kilos sa pagkakasunod-sunod; likas sa modernong Tagalog ang aspektong naganap na “naghugas.”
- source_word: מִמֶּנּוּ
  choice: Doon
  rationale: Ang מן na may hulaping 3ms ay literal na “mula roon/mula rito” at tumutukoy sa palanggana. Ang “doon” ay natural na Tagalog na nagpapanatili sa palangganang pinagmumulan o lugar ng paghuhugas nang hindi tahasang ginagawang instrumento ang tubig.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: sina Moises, Aaron
  rationale: Ginamit ang “sina” para sa likas na pagmamarka ng maramihang pangalang pantangi sa Tagalog; pinanatili ang karaniwang anyo ng mga pangalan.
- source_word: וּבָנָיו
  choice: at ang mga anak niyang lalaki
  rationale: Tiyak na mga anak na lalaki ni Aaron ang tinutukoy sa kontekstong makasaserdote. Ang “niyang” ay malinaw na tumutukoy kay Aaron, ang pinakamalapit na isahang antecedent.
- source_word: אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: ng kanilang mga kamay at paa
  rationale: Tuwirang inililipat ang magkatambal na bahagi ng katawan; hindi kailangang ulitin ang “kanilang mga” bago ang “paa” sa natural na Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na simple, marangal, at madaling maunawaan. Ginamit ang “naghugas” sa halip na mas teknikal na “naghilamos” o “naghugas sila sa ritwal,” sapagkat kamay at paa ang tuwirang layon at walang idinagdag na paliwanag na wala sa talata.
