  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: tl
  text: Sapagkat ang ulap ni Yahweh ay nasa ibabaw ng tabernakulo sa araw, at sa gabi naman ay may apoy roon[a], sa paningin ng buong sambahayan ng Israel, sa bawat yugto ng kanilang paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “may apoy sa loob nito.” Maaaring tumukoy ang “nito” sa ulap o sa tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag at pangwakas na buod ng naunang salaysay; likas sa Tagalog ang “Sapagkat” sa ganitong daloy.
- source_word: עֲנַן יְהוָה
  choice: ang ulap ni Yahweh
  rationale: Natural na ipinahahayag sa Tagalog ang ugnayang construct bilang “ulap ni Yahweh,” nang hindi dinaragdagan ang kahulugan nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na YHWH sa halip na palitan ito ng isang titulo.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ito ang nakaugaliang katawagan sa naililipat na banal na santuwaryo sa Exodo at mauunawaan sa modernong Filipino.
- source_word: יוֹמָם
  choice: sa araw
  rationale: Maikli at natural na panahong parirala, na katapat ng “sa gabi.”
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: at sa gabi naman ay may apoy roon[a]
  rationale: Likas ang ayos sa Filipino, at pinananatili ng “roon” ang pagkakaroon ng apoy sa lugar na tinutukoy nang hindi sapilitang nagpapasya kung ang hulaping בּוֹ ay tumutukoy sa ulap o sa tabernakulo.
- source_word: לְעֵינֵי
  choice: sa paningin ng
  rationale: Pinananatili ang konkretong idyomang Hebreo at malinaw pa rin sa kasalukuyang Tagalog.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: buong sambahayan ng Israel
  rationale: Pinananatili ang kolektibo at tipanang diwa ng “bahay/sambahayan ng Israel,” sa halip na paikliin lamang bilang “buong Israel.”
- source_word: בְּכָל מַסְעֵיהֶם
  choice: sa bawat yugto ng kanilang paglalakbay
  rationale: Ang מַסָּע ay maaaring tumukoy sa isang paglalakbay o yugto/himpilan ng paglalakbay; malinaw na ipinahahayag ng salin ang lahat ng sunud-sunod na yugto ng paglalakbay sa ilang.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na gawing titulong “PANGINOON.”
- issue: Tinutukoy ng hulaping panghalip sa בּוֹ
  choice: Hindi tahasang tinukoy sa pangunahing teksto sa pamamagitan ng “roon”
  alternative: “sa loob ng ulap” o “sa tabernakulo”
  rationale: Parehong panlalaki sa Hebreo ang “ulap” at “tabernakulo,” kaya maaaring tumukoy ang hulapi sa alinman; hindi dapat tahimik na lutasin ng salin ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang nakaugaliang terminong “tabernakulo,” ang kolektibong “sambahayan ng Israel,” at ang natural na “roon” upang mapanatili ang kalabuan ng panghalip sa Hebreo.
