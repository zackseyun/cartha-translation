  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: tl
  text: Sa unang araw ng unang buwan, itatayo mo ang Tabernakulo, ang Tolda ng Tagpuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas pormal na pagkakasalin, “ang tabernakulo ng Tolda ng Tagpuan.” Pinagdurugtong ng Hebreo ang dalawang katawagan sa santuwaryo; maaaring unawain ang mga ito bilang magkatumbas na katawagan o bilang isang mas mahigpit na pariralang may ugnayang “ng.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם הַ/חֹדֶשׁ הָ/רִאשׁוֹן בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: Sa unang araw ng unang buwan
  rationale: Ang dalawang pariralang Hebreo ay bumubuo ng karaniwang pormula ng petsa. Ang natural na Tagalog na ito ay malinaw na naghahayag ng unang araw ng unang buwan.
- source_word: תָּקִים
  choice: itatayo mo
  rationale: Ang Hiphil ng קום ay nangangahulugang ipatayo o ilagay nang nakatindig. Ang anyong panghinaharap na “itatayo mo” ay natural sa Tagalog para sa tiyak na tagubilin na nakatali sa isang petsa.
- source_word: מִשְׁכַּן
  choice: Tabernakulo
  rationale: Ito ang natatanging katawagan sa naililipat na banal na tahanan sa Exodo. Pinananatili ng “Tabernakulo” ang pagkakakilanlan nito bilang teknikal na pangalan ng santuwaryo.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tagpuan
  rationale: Ang אֹהֶל ay “tolda,” at ang מוֹעֵד dito ay tumutukoy sa itinakdang pakikipagtagpo. Ang “Toldang Tagpuan” ay maikli, natural, at hindi nag-aangkat ng ideya ng tipan na wala sa mismong parirala.
theological_decisions:
- issue: Ugnayan ng מִשְׁכַּן at אֹהֶל מוֹעֵד
  choice: 'Aposisyon: “ang Tabernakulo, ang Toldang Tagpuan”'
  alternative: 'Mas mahigpit na ugnayang tulad ng construct: “ang tabernakulo ng Toldang Tagpuan”'
  rationale: Magkatabing inilalagay ng Hebreo ang dalawang katawagan sa santuwaryo nang walang tahasang panandang henitibo. Ipinapakita ng aposisyon na iisang banal na estruktura ang tinutukoy, habang pinananatili sa talababa ang tunay na posibilidad ng mas mahigpit na pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang payak na pormula ng petsa at natural na pandiwang “itatayo mo.” Pinanatili bilang mga natatanging katawagan ang “Tabernakulo” at “Toldang Tagpuan,” at inilagay ang talababa sa mismong pariralang tinatalakay nito.
