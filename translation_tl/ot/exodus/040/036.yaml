  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: tl
  text: Tuwing umaangat ang ulap mula sa ibabaw ng tabernakulo, umaalis ang mga anak ni Israel[a] sa lahat ng kanilang paglalakbay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Sa Hebreo, “ang mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הֵעָל֤וֹת
  choice: Tuwing umaangat
  rationale: Ang waw na sinusundan ng בְּ at infinitive construct ay bumubuo ng sugnay na temporal. Ipinahihiwatig ng konteksto ang paulit-ulit na pangyayari, kaya ang “Tuwing” angkop sa habitual na diwa; pinananatili ng “umaangat” ang galaw ng ulap nang hindi tahasang nagtatakda kung sino ang nag-angat nito.
- source_word: הֶֽ/עָנָן֙
  choice: ang ulap
  rationale: Tiyak na pangngalan ito at tumutukoy sa ulap ng presensiya ng Diyos na nabanggit na sa konteksto.
- source_word: מֵ/עַ֣ל
  choice: mula sa ibabaw ng
  rationale: Ipinapahayag nito ang paggalaw palayo mula sa kinalalagyang nasa ibabaw ng tabernakulo.
- source_word: הַ/מִּשְׁכָּ֔ן
  choice: tabernakulo
  rationale: Ito ang kinikilalang katawagan sa Filipino para sa portable na santuwaryo o tahanang itinayo para sa presensiya ng Diyos sa salaysay ng Exodo.
- source_word: יִסְע֖וּ
  choice: humahayo
  rationale: Ang pandiwang נסע ay tumutukoy rito sa pag-alis upang ipagpatuloy ang paglalakbay. Ang aspektong di-ganap, kasama ng “Tuwing,” ay likas na naghahayag ng nakagawiang kilos.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang literal na anyong “mga anak na lalaki ni Israel” ngunit ginagamit ang natural na kolektibong ekspresyong Filipino na “mga anak ni Israel,” na maaaring sumaklaw sa buong sambayanan.
- source_word: בְּ/כֹ֖ל מַסְעֵי/הֶֽם
  choice: sa bawat yugto ng kanilang paglalakbay
  rationale: Ang plural na מַסְעֵיהֶם ay maaaring tumukoy sa mga paglalakbay o mga himpilan/yugto ng paglalakbay. Ang “sa bawat yugto” ay natural na nagpapahayag ng distributibong diwa ng בְּכֹל sa buong paglalakbay sa ilang.
theological_decisions:
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang anyo at ugnayang pampamilya ng Hebreo nang hindi ipinapalagay na mga lalaking indibidwal lamang ang tinutukoy; inilalahad sa talababa ang mas karaniwang kolektibong katumbas.
- issue: Kung kusang umangat o iniangat ang ulap
  choice: umaangat
  alternative: itinataas
  rationale: Ang pormang Hebreo sa temporal na sugnay ay maaaring isalin ayon sa pag-angat o pagkakaangat ng ulap. Iniiwasan ng “umaangat” ang pagdaragdag ng tahasang tagaganap habang malinaw na inilalarawan ang nakikitang tanda para sa pag-alis.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “tabernakulo” ay pinanatili bilang pamilyar na terminong biblikal; ang “humahayo” ay dignified ngunit madaling maunawaan sa konteksto. Inilagay ang [a] pagkaraan ng “mga anak ni Israel,” ang mismong pariralang tinutukoy ng talababa.
