  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: tl
  text: Ilagay mo roon ang kaban ng patotoo[b], at tabingan mo ng kurtina[a] ang kaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabing.” Ang salitang Hebreo na פָּרֹכֶת ay tumutukoy sa panloob na kurtina ng tabernakulo na humaharang sa kinaroroonan ng kaban.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kaban ng patotoo,” hindi “kaban ng tipan,” na ginagamit sa ilang tradisyonal na salin.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Ilagay mo
  rationale: Ang Qal perfect na may prefixed conjunction sa sunod-sunod na tagubilin ay may puwersa ng utos. Likas at malinaw sa modernong Tagalog ang “ilagay mo.”
- source_word: שָׁם
  choice: roon
  rationale: Pinananatili ang pang-abay na panlunan at tumutukoy sa tabernakulo o toldang nabanggit sa konteksto nang hindi ito labis na tinutukoy.
- source_word: אֲרוֹן הָעֵדוּת
  choice: ang kaban ng patotoo
  rationale: Tuwirang pinananatili ang עֵדוּת bilang “patotoo,” sa halip na iayon sa mas pamilyar ngunit naiibang pariralang “kaban ng tipan.” Ang “kaban” ang angkop na katawagan sa sagradong sisidlang ito.
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: at tabingan mo … ang kaban
  rationale: Sa kontekstong ito, ang kurtina ay nagsisilbing harang na nagkukubli sa kaban, hindi telang ipinapatong dito. Ang “tabingan” ay natural na naghahayag ng ganitong gamit.
- source_word: הַפָּרֹכֶת
  choice: kurtina
  rationale: Tumutukoy ang פָּרֹכֶת sa panloob na kurtina ng tabernakulo. Madaling maunawaan sa kasalukuyang Tagalog ang “kurtina,” samantalang inilalahad sa talababa ang “tabing” bilang alternatibo.
theological_decisions:
- issue: Katawagan sa kaban sa tabernakulo
  choice: kaban ng patotoo
  alternative: kaban ng tipan
  rationale: Hayagang “patotoo” (עֵדוּת) ang nasa Hebreo. Hindi ito pinalitan ng mas pamilyar na “tipan,” upang mapanatili ang pagkakaiba ng mga katawagan sa pinagmulang teksto.
- issue: Pagsasalin sa פָּרֹכֶת
  choice: kurtina
  alternative: tabing
  rationale: Mas madaling maunawaan ng karaniwang modernong mambabasa ang “kurtina,” habang ang “tabing” ay tumpak ding nagpapahayag ng tungkulin nitong humarang at magkubli.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang tuwirang anyong pautos na “ilagay mo” at “tabingan mo,” na angkop sa tagubilin kay Moises. Iniwasan ang labis na tradisyonal o teknikal na pananalita, ngunit pinanatili ang natatanging terminolohiyang “patotoo” ng tekstong Hebreo.
