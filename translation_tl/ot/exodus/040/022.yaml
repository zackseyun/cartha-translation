  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: tl
  text: Inilagay niya ang mesa sa Tolda ng Tipanan, sa hilagang bahagi ng tabernakulo, sa labas ng tabing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina.” Ang Hebreong פָּרֹכֶת ay tumutukoy sa panloob na nakasabit na harang na nagtatakip sa Kabanal-banalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Inilagay niya
  rationale: Sa konteksto ng pagsasaayos ng santuwaryo, malinaw at natural na ipinahahayag ng “inilagay” ang diwang spatial ng נתן.
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: “Ang mesa” lamang ang tahasang sinasabi ng Hebreo; hindi idinagdag sa talata ang tinapay o Presensya.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa toldang tipanan
  rationale: Pinananatili nito ang kinikilalang pantawag sa אֹהֶל מוֹעֵד at likas itong maunawaan sa modernong Filipino.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: sa hilagang bahagi ng tabernakulo
  rationale: Ang יֶרֶךְ ay tumutukoy sa tagiliran o bahagi, at ang צָפֹנָה ay tumutukoy sa kinalalagyan sa hilaga.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakaugaliang teknikal na katawagan sa gusaling-santuwaryo sa Exodo at malinaw na naiiba sa “tolda.”
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: sa labas ng tabing
  rationale: Ang פָּרֹכֶת ay ang nakasabit na panloob na harang; mas natural at tumpak sa Filipino ang “tabing” kaysa “belo” para sa isang partisyong tela.
