  source_fidelity: 'Tapat ang salin sa pagkakasunod at saklaw ng Hebreo: ipinapasok ang mesa, inaayos ang itinakdang laman o ayos nito, pagkatapos ay ipinapasok ang patungan ng ilawan at inaasikaso ang mga ilawan nito. Ang “sindihan” ay isang makatwirang pangunahing pagbasa ng Hiphil ng עלה kaugnay ng mga ilawan, habang pinananatili ng talababa ang alternatibong pagkaunawang paglalagay o paghahanda sa ayos.'
  naturalness: Natural, malinaw, at angkop sa makabagong Filipino ang mga utos na “ipasok mo,” “ayusin,” at “sindihan.” Ang “patungan ng ilawan” ay mauunawaan at angkop na katumbas ng menorah/lampstand sa kontekstong ito.
  terminology: Wasto ang “mesa,” “patungan ng ilawan,” at “mga ilawan nito.” Hindi nagdaragdag ang “mga bagay na nakalaan dito” ng tiyak na kultikong katawagan na wala sa mismong talata at maayos nitong isinasalin ang cognate construction na וְעָרַכְתָּ אֶת־עֶרְכּוֹ.
