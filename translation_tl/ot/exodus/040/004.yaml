  yaml_path: translation/ot/exodus/040/004.yaml
  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: tl
  text: Pagkatapos, ipasok mo ang mesa at ayusin ang mga bagay na nakalaan dito. Ipasok mo rin ang patungan ng ilawan at sindihan ang mga ilawan nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ilagay sa ayos ang mga ilawan nito.” Literal na nangangahulugan ang pandiwang Hebreo na “paakyatin” at maaaring tumukoy sa pagpapaliyab ng mga ilawan o sa paghahanda at paglalagay sa ayos ng mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: ipasok mo
  rationale: Ang Hiphil ng בוא ay nagpapahiwatig ng pagdadala ng mga kasangkapan papasok sa santuwaryo; natural at tuwiran sa Filipino ang “ipasok mo.”
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Payak na “mesa” ang kahulugan ng pangngalan; hindi idinaragdag sa teksto ang mas tiyak na pagkakakilanlan nito mula sa konteksto.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: ayusin ang mga bagay na nakalaan dito
  rationale: Ang magkaugnay na pandiwa at pangngalan ay tumutukoy sa maayos na paglalagay ng itinakdang ayos o mga bagay sa mesa. Iniiwasan nito ang di-natural na literalismong “ayusin ang ayos nito.”
- source_word: הַמְּנֹרָה
  choice: ang patungan ng ilawan
  rationale: Isinasalin ang karaniwang pangngalan ayon sa kahulugan sa halip na tumbasan lamang ng transliterasyong “menorah.”
- source_word: וְהַעֲלֵיתָ
  choice: sindihan
  rationale: Kapag ang Hiphil ng עלה ay ginamit kaugnay ng mga ilawan, maaari itong mangahulugang paiilawin o pasisiklabin ang mga ito—literal na “paakyatin” ang apoy. Ang “sindihan” ay natural sa Filipino at angkop sa bagay na נֵרוֹתֶיהָ.
- source_word: נֵרֹתֶיהָ
  choice: ang mga ilawan nito
  rationale: Ang נֵר ay maliit na ilawan o ningas nito; malinaw at natural dito ang “mga ilawan nito.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang pautos na “mo,” gaya ng anyong pangalawang panauhang isahan sa Hebreo. Pinanatili sa talababa ang tunay na kalabuan ng וְהַעֲלֵיתָ.
