  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: tl
  text: Inilagay niya ang palanggana sa pagitan ng Tolda ng Tipanan at ng altar, at nilagyan niya ito ng tubig para sa paghuhugas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Inilagay niya
  rationale: Ang שׂוּם ay karaniwang pandiwa para sa paglalagay o pagtatakda ng isang bagay sa puwesto; natural at tumpak ang “inilagay” sa modernong Tagalog.
- source_word: הַכִּיֹּר
  choice: ang hugasan
  rationale: Ang כִּיּוֹר ay malaking sisidlang ginagamit sa ritwal na paghuhugas. Mas malinaw at likas sa Tagalog ang “hugasan” kaysa sa hiram o teknikal na “lababo,” na maaaring magpahiwatig ng makabagong kasangkapan.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: sa pagitan ng toldang tipanan at ng altar
  rationale: Tuwirang ipinapahayag ng parirala ang lokasyon. Ang “toldang tipanan” ay natural na salin ng אֹהֶל מוֹעֵד at pinananatili ang ideya ng itinakdang pakikipagtagpo nang hindi ito ipinapantay sa buong tabernakulo.
- source_word: וַיִּתֵּן שָׁמָּה מַיִם
  choice: at nilagyan niya iyon ng tubig
  rationale: Literal na “naglagay siya roon ng tubig.” Sa Tagalog, malinaw at natural ang “nilagyan niya iyon ng tubig”; ang “iyon” ay tumutukoy sa hugasan, gaya ng hinihingi ng konteksto.
- source_word: לְרָחְצָה
  choice: para sa paghuhugas
  rationale: Ang infinitibong anyo ng רָחַץ ay nagsasaad ng layunin. Hindi tahasang binabanggit ng Hebreo kung sino ang maghuhugas o kung ano ang huhugasan, kaya hindi iyon idinagdag.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinili ang “hugasan” bilang pangngalang tumutukoy sa sisidlan, hindi sa lugar o kilos, at iniwasan ang mas makabagong dating ng “lababo.”
