  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: tl
  text: Pagkatapos, kunin mo ang langis na pampahid[a] at pahiran mo ng langis ang tabernakulo at ang lahat ng naroon. Italaga mo bilang banal ang tabernakulo at ang lahat ng kagamitan nito, at magiging banal iyon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “langis ng pagpapahid.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “banal,” hindi “kabanal-banalan.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Pagkatapos, kunin mo
  rationale: Ang Qal perfect na may pang-ugnay ay bahagi ng sunod-sunod na tagubilin. Likas sa modernong Tagalog ang pautos na “kunin mo,” at ipinakikita ng “Pagkatapos” ang pagkakasunod ng gawain.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: langis na pamahid
  rationale: Natural at malinaw itong katumbas ng langis na ginagamit sa ritwal na pagpapahid at pagtatalaga; pinananatili ng talababa ang mas literal na anyo.
- source_word: וּמָשַׁחְתָּ
  choice: pahiran mo
  rationale: Sa kontekstong pangkulto, tumutukoy ang משׁח sa pagpapahid ng langis upang italaga sa banal na gamit. Sapat ang “pahiran” dahil tahasang nabanggit ang langis.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Tagalog para sa santuwaryong nadadala sa ilang; mas tiyak ito sa konteksto kaysa sa literal na “tahanan.”
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: ang lahat ng naroon
  rationale: Saklaw nito ang lahat ng nasa loob o kaugnay na nilalaman ng tabernakulo nang hindi mabigat ang pananalita.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: Italaga mo bilang banal ang tabernakulo
  rationale: Ang Piel ng קדשׁ ay nangangahulugang ibukod o italaga para sa banal na gamit. Inulit ang “tabernakulo” upang maging malinaw ang tinutukoy ng panghalip.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: at ang lahat ng kagamitan nito
  rationale: Malawak ang כֵּלִים at maaaring tumukoy sa mga kasangkapan, sisidlan, at iba pang kagamitang ginagamit sa santuwaryo; ang “kagamitan” ay hindi labis na makitid.
- source_word: וְהָיָה קֹדֶשׁ
  choice: at magiging banal iyon
  rationale: Inihahayag ng resultang sugnay ang banal na katayuan pagkatapos ng pagtatalaga. Ang קֹדֶשׁ ay simpleng “banal,” hindi “kabanal-banalan.”
theological_decisions:
- issue: Banal na katayuan ng tabernakulo matapos pahiran at italaga
  choice: magiging banal
  alternative: magiging kabanal-banalan
  rationale: קֹדֶשׁ lamang ang mababasa sa Hebreo, hindi קֹדֶשׁ קָדָשִׁים. Kaya hindi dinaragdagan ng pasukdol na antas ang pahayag.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at tuwiran. Ginamit ang karaniwang biblikal na terminong “tabernakulo,” habang iniwasan ang sobrang teknikal o makalumang pananalita. Ang sunod-sunod na pautos ay inihayag sa likas na anyong Tagalog.
