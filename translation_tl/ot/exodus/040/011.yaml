translation:
  language: tl
  text: Pahiran mo ng langis ang palanggana at ang patungan nito,[a] at italaga mo ito bilang banal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “saligan.”
    reason: lexical_alternative
  - marker: b
    text: O “gawin mo itong banal” o “pabanalin mo ito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Pahiran mo ng langis
  rationale: Sa kontekstong ritwal, ang משׁח ay pagpapahid ng langis upang italaga sa banal na gamit. Mas malinaw sa karaniwang mambabasa ang tahasang pagbanggit sa langis kaysa sa payak na “pahiran.”
- source_word: הַכִּיֹּר
  choice: ang palanggana
  rationale: Ang כִּיּוֹר ay malaking sisidlan ng tubig para sa paghuhugas sa paglilingkod sa tabernakulo. Ang “palanggana” ay natural at nauunawaang modernong katumbas.
- source_word: כַּנּוֹ
  choice: ang patungan nito
  rationale: Ang כֵּן ay suportang kinatatayuan ng palanggana. Ang “patungan” ay likas sa Filipino; maaari rin itong unawaing “paanan.”
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: at italaga mo itong banal
  rationale: Ang Piel ng קדשׁ ay tumutukoy sa pagbubukod o pagtatalaga para sa banal na gamit. Pinananatili ng “italaga mo itong banal” kapwa ang ideya ng pagtatalaga at kabanalan. Ang panghalip ay isahan, gaya ng Hebreo.
theological_decisions:
- issue: Kahulugan ng קדשׁ sa konteksto ng mga kagamitan sa tabernakulo
  choice: italaga mo itong banal
  alternative: gawin mo itong banal / pabanalin mo ito
  rationale: Ritwal na pagbubukod para sa banal na gamit ang tinutukoy, hindi moral na pagbabago. Ang napiling anyo ay malinaw ngunit hindi nagdaragdag ng doktrinal na paliwanag.
- issue: Tinutukoy ng isahang אֹתוֹ pagkatapos banggitin ang palanggana at patungan
  choice: ito
  alternative: ang mga ito
  rationale: Pinananatili ang isahang panghalip ng Hebreo at hindi ito ginagawang tahasang maramihan. Maaaring ituring ang palanggana kasama ang patungan nito bilang isang kabuuang kagamitan.
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang pautos na “mo” bilang natural na katumbas ng ikalawang panauhang isahang utos sa konteksto. Hindi na isinalin nang hiwalay ang unang וּ bilang “at” sapagkat nagpapatuloy ang talata sa sunod-sunod na tagubilin.
