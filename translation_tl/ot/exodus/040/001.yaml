  yaml_path: translation/ot/exodus/040/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos ay nagsalita si Yahweh[a] kay Moises:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, na karaniwang isinasatitik na “Yahweh”; maaari ring “Jehovah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay at ang דִּבֵּר ay likas na isinasaling “nagsalita” sa pormulang nagpapakilala ng banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ito ang natural na panandang Filipino para sa taong pinatutungkulan ng pagsasalita.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakagawiang anyo ng pangalang ito sa Filipino.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Ang infinitive na לֵאמֹר ay pormulang nagpapakilala sa mismong sasabihin. Sa natural na Filipino, malinaw itong naipahahayag ng tutuldok nang hindi inuulit ang “sinabi.”
- source_word: וַ
  choice: Pagkatapos
  rationale: Ipinahahayag nito ang pagsulong at pagkakasunod-sunod ng salaysay sa natural na modernong Filipino.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalang tipan at ang transliterasyong ginamit sa consultation layer, habang inilalagay sa talababa ang lehitimong alternatibong anyo.
translation_notes:
  register: Modernong Filipino na simple at marangal. Ginamit ang “Pagkatapos” upang ipakita ang pagpapatuloy ng salaysay, at tutuldok para sa natural na pagpapakilala sa kasunod na tuwirang pahayag.
