  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: tl
  text: Pagkatapos, tinakpan ng ulap ang Tolda ng Pagtatagpo, at pinuno ng kaluwalhatian ni Yahweh[a] ang tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay may banal na pangalang יהוה (YHWH), na isinalin dito bilang “Yahweh.”
    reason: Nililinaw na personal na banal na pangalan ang nasa pinagmulang teksto, hindi ang karaniwang titulong “Panginoon.”
lexical_decisions:
- source_word: וַיְכַס
  choice: Pagkatapos, tinakpan
  rationale: Ang pandiwang כסה ay nangangahulugang “takpan.” Ipinahahayag ng “Pagkatapos” ang pagsulong ng salaysay na dala ng waw-consecutive, habang pinananatili ng “tinakpan” ang kongkretong larawan ng ulap na bumabalot sa tolda.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: May tiyak na pantukoy ang pangngalan at tumutukoy sa natatanging ulap ng presensiya ng Diyos na nauna nang lumitaw sa salaysay ng Exodo.
- source_word: אֹהֶל מוֹעֵד
  choice: Tolda ng Pagtatagpo
  rationale: Tuwirang ipinapahayag nito ang tolda bilang itinakdang lugar ng pakikipagtagpo. Mas malapit ito sa מוֹעֵד kaysa “Tolda ng Tipanan,” na maaaring magpasok ng ideya ng tipan na wala sa mismong parirala.
- source_word: כְבוֹד יְהוָה
  choice: kaluwalhatian ni Yahweh
  rationale: Ang כָּבוֹד dito ay tumutukoy sa hayag at maringal na presensiya ng Diyos. Likas sa modernong Tagalog ang konstruksiyong “kaluwalhatian ni Yahweh.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalan sa halip na palitan ng titulong “PANGINOON,” upang mapanatili ang banal na pangalang nasa tekstong Hebreo.
- source_word: מָלֵא
  choice: pinuno
  rationale: Dito, ang kaluwalhatian ang simuno at ang tabernakulo ang tuwirang layon; malinaw na ipinapahayag ng “pinuno” na nasakop ng kaluwalhatian ang buong gusali.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang מִשְׁכָּן ay teknikal na katawagan sa santuwaryong gusali sa Exodo. Pinananatili ng “tabernakulo” ang partikular na sangguniang ito at iniiba ito sa Tolda ng Pagtatagpo sa unang sugnay.
theological_decisions:
- issue: Paglalarawan sa כְבוֹד bilang pumupuno sa tabernakulo
  choice: pinuno ng kaluwalhatian ni Yahweh ang tabernakulo
  alternative: napuno ng kaluwalhatian ni Yahweh ang tabernakulo
  rationale: 'Pinananatili ng aktibong ayos ang balarila at diin ng Hebreo: ang kaluwalhatian ni Yahweh ang simuno na pumupuno sa tabernakulo, nang hindi ipinapaliwanag pa kung paano nauugnay ang kaluwalhatian sa mismong presensiya ng Diyos.'
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Nasa Hebreo ang Tetragrammaton bilang personal na pangalan. Ang “Yahweh” ay isang tuwirang transliterasyon na hindi nagpapalit sa pangalan ng isang titulo; ipinapaliwanag ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang teknikal ngunit pamilyar na “tabernakulo,” at ang mas malinaw na “Tolda ng Pagtatagpo” para mapanatili ang pagkakaiba ng אֹהֶל מוֹעֵד at מִשְׁכָּן. Inilagay ang panandang [a] kaagad pagkatapos ng “Yahweh,” ang salitang aktuwal na tinatalakay ng talababa.
