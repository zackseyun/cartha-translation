  text: וַ/יַּ֥עַל הַ/נֵּרֹ֖ת לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: At inayos niya ang mga ilawan sa harap ni Yahweh[a], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “pinaakyat ang mga ilawan.” Maaaring tumukoy ang pahayag sa pag-aayos o sa pagpapasindi ng mga ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: inayos
  rationale: Ang Hiphil ng עלה ay literal na “pinaakyat,” ngunit sa konteksto ng mga ilawan sa tabernakulo, isa itong ritwal na pahayag na maaaring tumukoy sa pag-aayos o pagpapasindi sa mga ilawan. Ang “inayos” ay natural sa modernong Tagalog at hindi tahasang nagpapasya sa pagitan ng dalawang posibilidad.
- source_word: הַנֵּרֹת
  choice: ang mga ilawan
  rationale: Tumutukoy ang נֵרֹת sa kongkretong mga ilawan ng kandelero, hindi lamang sa liwanag na nagmumula sa mga ito.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili nito ang spatial at kultikong diwa ng לִפְנֵי. Ginamit ang “ni” sapagkat personal na pangalan ang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Likas na ipinahahayag ng “gaya ng” ang pagsunod ng ginawa ni Moises sa naunang utos.
- source_word: צִוָּה
  choice: iniutos
  rationale: Ipinakikita ng anyong ganap na nauna na ang utos sa isinasalaysay na pagkilos; malinaw na ito sa Tagalog kahit walang hiwalay na anyong past perfect.
- source_word: אֶת מֹשֶׁה
  choice: kay Moises
  rationale: Si Moises ang taong inutusan. Sa natural na Tagalog, ginagamit ang “kay” sa ganitong konstruksiyon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng titulo.
- issue: Kung inayos o sinindihan ang mga ilawan
  choice: inayos, na may talababa
  alternative: sinindihan
  rationale: Ang Hebreong idyoma ay maaaring maglarawan sa pag-aayos/paglalagay o sa pagpapasindi ng mga ilawan. Hindi tahasang nilulutas ng salin ang tunay na leksikal na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na ayos ng pangungusap at ang “Yahweh” bilang personal na pangalan. Ang “inayos” ay piniling hindi labis na tukuyin ang ritwal na kilos, samantalang inilalahad sa talababa ang posibleng kahulugang “sinindihan.”
