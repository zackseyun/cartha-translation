  text: וַ/יָּ֛שֶׂם אֶת מִזְבַּ֥ח הַ/זָּהָ֖ב בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵ֖י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: tl
  text: At inilagay niya ang altar na ginto sa tolda ng pagpupulong, sa harap ng tabing.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina.” Ang salitang Hebreo ay tumutukoy sa panloob na telang naghahati sa tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: At inilagay niya
  rationale: Ang wayyiqtol ng שׂוּם ay nagsasaad ng kasunod na kilos sa salaysay. Likas sa modernong Tagalog ang “inilagay,” at ipinahihiwatig nito ang maingat na pagpoposisyon ng kagamitan.
- source_word: מִזְבַּח הַזָּהָב
  choice: ang altar na ginto
  rationale: Literal itong “altar ng ginto.” Malinaw at likas ang “altar na ginto,” habang nananatiling malapit sa nominal na anyo ng Hebreo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pagpupulong
  rationale: Karaniwang tawag ito sa santuwaryong tolda. Pinananatili ng “pagpupulong” ang diwa ng pakikipagtagpo sa מוֹעֵד nang hindi ito ginagawang “tipan,” na ibang salita sa Hebreo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Nagsasaad ito rito ng kinalalagyan ng altar kaugnay ng tabing. Natural at tiyak sa Tagalog ang “sa harap ng.”
- source_word: הַפָּרֹכֶת
  choice: ang tabing
  rationale: Tumutukoy ang פָּרֹכֶת sa panloob na telang naghahati sa tabernakulo. Ang “tabing” ay dignified at angkop sa gamit nitong panritwal; maaari rin itong tawaging “kurtina.”
theological_decisions:
- issue: Terminong panritwal para sa הַפָּרֹכֶת
  choice: ang tabing
  alternative: ang kurtina
  rationale: Pinananatili ng “tabing” ang natatanging bigat ng panloob na harang sa santuwaryo nang hindi lumalampas sa payak na kahulugan ng Hebreo. Ang “kurtina” ay lehitimong alternatibo ngunit mas pangkaraniwan ang dating.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang karaniwang salitang “altar” sa kontekstong panritwal at iniwasan ang “tolda ng tipanan” upang hindi mapaghalo ang מוֹעֵד sa terminong Hebreo para sa tipan.
