base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/019.yaml
  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Pagkatapos, inilatag niya ang tolda sa ibabaw ng tabernakulo at inilagay ang pantakip ng tolda sa ibabaw nito mula sa itaas, gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: inilatag
  rationale: Ang פרשׂ ay tumutukoy sa paglalatag o pag-uunat ng isang pantakip. Natural sa Filipino ang “inilatag” para sa pagkilos na ginawa sa ibabaw ng estruktura.
- source_word: הָאֹהֶל
  choice: ang tolda
  rationale: Karaniwang kahulugan ng אֹהֶל ang “tolda.” Pinananatili nito ang pagkakaiba sa מִכְסֶה, ang hiwalay na panlabas na pantakip.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang “tabernakulo” ang nakasanayang katawagang Filipino para sa sagradong mishkan sa Exodo at malinaw itong naiiba sa “tolda.”
- source_word: וַיָּשֶׂם
  choice: inilagay
  rationale: Tuwirang katumbas ito ng karaniwang pandiwang שׂים at natural sa modernong Filipino.
- source_word: מִכְסֵה הָאֹהֶל
  choice: ang pantakip ng tolda
  rationale: Tuwirang inilalarawan ng parirala ang pantakip na para sa tolda at pinananatili ang leksikal na pagkakaiba ng tolda at ng panlabas na pantakip nito.
- source_word: עָלָיו מִלְמָעְלָה
  choice: sa ibabaw nito
  rationale: Magkasamang ipinahahayag ng עָלָיו at מִלְמָעְלָה ang posisyong nasa ibabaw. Ang “sa ibabaw nito” ay malinaw at hindi alanganing paulit-ulit sa Filipino.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Pinananatili nito ang pormulang nagbibigay-diin sa eksaktong pagsunod ni Moises sa naunang utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Pinanatili ang terminong “tabernakulo” dahil pamilyar ito sa kontekstong biblikal, habang ang “tolda” at “pantakip” ay malinaw na pinag-iba. Walang kinakailangang talababa sa talatang ito.
