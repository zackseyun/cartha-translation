base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/037.yaml
  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: tl
  text: Ngunit kung hindi umangat ang ulap, hindi sila umaalis hanggang sa araw na umangat ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas literal, “hanggang sa araw ng pag-angat nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinahihiwatig ng parirala ang kundisyong kasalungat ng nangyayari sa naunang talata; natural itong ipinapahayag sa Tagalog bilang “Ngunit kung.”
- source_word: יֵעָלֶה
  choice: umangat
  rationale: Ang pandiwang עלה ay nangangahulugang umakyat o pumaitaas. Sa konteksto ng ulap sa ibabaw ng tabernakulo, malinaw at natural ang “umangat” nang hindi ipinapalagay na may tahasang pasibong diwa.
- source_word: הֶעָנָן
  choice: ang ulap
  rationale: Tuwirang salin ng tiyak na pangngalang tumutukoy sa ulap na nabanggit na sa konteksto.
- source_word: יִסְעוּ
  choice: umaalis
  rationale: Sa konteksto ng paglalakbay at kampamento, tumutukoy ang נסע sa pag-alis upang magpatuloy sa paglalakbay. Ang “umaalis” ay maikli at likas sa modernong Tagalog.
- source_word: עַד יוֹם
  choice: hanggang sa araw
  rationale: Pinananatili nito ang tahasang salitang “araw” sa Hebreo at ang temporal na hangganan ng pagkilos.
- source_word: הֵעָלֹתוֹ
  choice: umangat ito
  rationale: Ang infinitive construct na may hulaping panlalaki ay literal na “pag-angat nito” at tumutukoy sa ulap. Ginawang sugnay ang parirala para sa mas natural na Tagalog, habang inilalahad sa talababa ang mas literal na anyo.
