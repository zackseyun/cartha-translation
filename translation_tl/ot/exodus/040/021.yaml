language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֶת הָ/אָרֹן֮ אֶל הַ/מִּשְׁכָּן֒ וַ/יָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַ/מָּסָ֔ךְ וַ/יָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָ/עֵד֑וּת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: tl
  text: Dinala niya ang kaban sa loob ng tabernakulo, inilagay ang tabing na panharang, at ikinubli ang kaban ng patotoo sa pamamagitan nito[a], gaya ng iniutos ni Yahweh kay Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tinakpan” o “hinarangan ang kaban ng patotoo.” Ipinahihiwatig ng Hebreo ang pagkukubli o pagharang sa kaban sa pamamagitan ng tabing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Dinala niya ... sa loob
  rationale: Ang Hiphil ng בוא ay causative; natural sa Tagalog ang “dinala ... sa loob” para sa pagpapasok ni Moises sa kaban.
- source_word: הָאָרֹן
  choice: ang kaban
  rationale: Sa kontekstong pansantuwaryo, ang אָרוֹן ay ang sagradong kaban, hindi lamang isang karaniwang kahon.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Tumutukoy ito sa naililipat na santuwaryo sa Exodo; ang “tabernakulo” ay maikli at kinikilalang terminong Filipino.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: ang tabing na pantakip
  rationale: Pinananatili ng “tabing” ang kahulugan ng פָּרֹכֶת bilang panloob na kurtina, at ipinahahayag ng “pantakip” ang tungkulin nitong humarang at magkubli.
- source_word: וַיָּשֶׂם
  choice: inilagay
  rationale: Ang שׂים ay nangangahulugang ilagay o ipuwesto; malinaw sa konteksto na ikinabit o inilagay ang tabing sa takdang puwesto.
- source_word: וַיָּסֶךְ
  choice: itinabing
  rationale: Ipinahahayag ng pandiwa ang pagtatakip o pagkukubli sa pamamagitan ng tabing; ang “itinabing” ay natural at inuugnay ang kilos sa naunang tabing.
- source_word: אֲרוֹן הָעֵדוּת
  choice: kaban ng patotoo
  rationale: Pinananatili nito ang tradisyonal at tuwirang diwa ng עֵדוּת nang hindi pinalalawak sa “mga tapyas ng tipan.”
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: gaya ng iniutos ni Yahweh kay Moises
  rationale: Natural na Filipino ito para sa paulit-ulit na pormulang nagdiriin sa pagsunod ni Moises sa utos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinatransliterasyon ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa pagkakaugnay ng tabing at kaban
  choice: itinabing ang kaban ng patotoo
  alternative: tinakpan ang kaban ng patotoo / inilagay ang tabing sa harap ng kaban ng patotoo
  rationale: Maaaring tumukoy ang וַיָּסֶךְ עַל sa pagtatakip, pagkukubli, o pagharang sa kaban. Iniiwasan ng “itinabing” na tiyaking pisikal na nakapatong ang tabing sa kaban, habang pinananatili ang ideya ng pagkukubli.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang pangalan ang nasa Hebreo; pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalan nang hindi nagdaragdag ng denominasyonal na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “tabernakulo,” “kaban,” at “patotoo” bilang pamilyar na bokabularyong biblikal; iniwasan ang sobrang teknikal o arkaikong pananalita. Ang marker na [a] ay nakalagay mismo sa pangunahing teksto.
