  text: וַ/יְהִ֞י בַּ/חֹ֧דֶשׁ הָ/רִאשׁ֛וֹן בַּ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הוּקַ֖ם הַ/מִּשְׁכָּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/017.yaml
  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: tl
  text: 'At nangyari ito noong unang buwan ng ikalawang taon, sa unang araw ng buwan: itinayo ang tabernakulo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: At nangyari ito
  rationale: Ipinagpapatuloy ng waw-consecutive ang salaysay. Likas sa modernong Tagalog ang “At nangyari ito” at hindi makaluma.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: noong unang buwan
  rationale: Sa kontekstong pangkalendaryo, ang חֹדֶשׁ ay “buwan”; malinaw na ipinapahayag ng parirala ang panahon.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: ng ikalawang taon
  rationale: Kaugnay ito ng “unang buwan” sa pormula ng pagtukoy ng petsa, kaya natural ang “unang buwan ng ikalawang taon.”
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: sa unang araw ng buwan
  rationale: Ang literal na “sa isa ng buwan” ay idyomang Hebreo para sa unang araw ng buwan; ginawang tahasan upang maging malinaw sa Tagalog.
- source_word: הוּקַם
  choice: itinayo
  rationale: Ang Hophal ng קום ay pasibo o causative-passive. Sa Tagalog, natural na naihahayag ng “itinayo” ang pagkakatatag o pag-erecta ng santuwaryo nang hindi kailangang gumamit ng tahasang pasibong anyo.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang מִשְׁכָּן dito ay ang natatanging naililipat na santuwaryo sa Exodo. Ang “tabernakulo” ay tiyak at nakaugaliang terminong Tagalog para rito.
