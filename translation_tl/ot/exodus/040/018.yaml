  naturalness: Natural at marangal ang pangungusap, ngunit mas tuwiran at likas ang paggamit ng “pagkatapos” o “noon” kaysa “Kaya” sa pagsasalaysay. Mas malinaw sa makabagong Filipino ang “mga salalayan” para sa mga base/socket at “mga baras” para sa mga structural bars.
  terminology: Ang “tabernakulo” at “mga haligi” ay angkop. Pinanatili ang “mga balangkas” bilang kontekstuwal na salin ng קְרָשִׁים, kalakip ang talababa para sa “mga tabla.”
