base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: tl
  text: Pagkatapos, itinayo ni Moises ang tabernakulo. Inilagay niya ang mga salalayan nito, itinayo ang mga balangkas nito,[a] inilagay ang mga baras nito, at itinayo ang mga haligi nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla nito.” Ang salitang Hebreo ay maaari ring tumukoy sa mga tabla, ngunit sa kontekstong ito ay tumutukoy sa mga patayong bahagi ng estruktura ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: itinayo
  rationale: Ang Hiphil ng קום ay nangangahulugang patayuin o itatag; natural ang “itinayo” sa konteksto ng pagbubuo ng tabernakulo.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Bagaman literal na “tirahan,” ito ang kinikilalang katawagan sa sagradong naililipat na santuwaryo sa Exodo.
- source_word: אֲדָנָיו
  choice: mga tuntungan nito
  rationale: Tumutukoy ang אֶדֶן sa mga pundasyong piyesa na kinasasaksakan o kinatatayuan ng mga balangkas; malinaw at likas sa Filipino ang “mga tuntungan.”
- source_word: קְרָשָׁיו
  choice: mga balangkas nito
  rationale: Maaaring tumukoy ang קֶרֶשׁ sa mga tabla, ngunit dito ang mga ito ay patayong bahagi ng estruktura; ipinahahayag ng “balangkas” ang tungkulin ng mga ito.
- source_word: בְּרִיחָיו
  choice: mga pahalang na biga nito
  rationale: Ang בְּרִיחַ ay mga baras na nagdurugtong at nagpapatibay sa mga balangkas; ang “pahalang na biga” ay madaling maunawaan at angkop sa konstruksiyon.
- source_word: עַמּוּדָיו
  choice: mga haligi nito
  rationale: Ang עַמּוּד ay patayong suporta; karaniwan, marangal, at angkop sa santuwaryo ang “haligi.”
- source_word: וַיָּשֶׂם
  choice: itinayo
  rationale: Bagaman karaniwang “ilagay,” ang pandiwa ay inilapat dito sa pagpupuwesto ng mga patayong balangkas; natural sa Filipino ang “itinayo.”
- source_word: וַיִּתֵּן
  choice: inilagay / ikinabit
  rationale: 'Malawak ang kahulugan ng נָתַן na “ilagay.” Iba-iba ang likas na pandiwang Filipino ayon sa bagay: “inilagay” sa mga tuntungan at “ikinabit” sa mga bigang nagdurugtong.'
