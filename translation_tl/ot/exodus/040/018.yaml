  register: Makabago at dignified na Filipino, na may malinaw na bokabularyong pangkonstruksiyon. Pinanatili ang sunod-sunod na mga kilos sa tekstong Hebreo. Ginamit ang “tabernakulo” bilang kinikilalang katawagan sa santuwaryo, at iniwasan ang sobrang teknikal na mga salitang hindi agad mauunawaan.
