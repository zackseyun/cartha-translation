base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: tl
  text: Pagkatapos, kinuha niya ang Patotoo at inilagay ito sa loob ng kaban.[a] Inilagay niya ang mga pingga sa kaban, at inilagay ang luklukan ng awa[b] sa ibabaw ng kaban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tapyas na bato ng Patotoo.” Ang Hebreong “Patotoo” ay teknikal na katawagan dito para sa bagay na inilagay sa kaban.
    reason: lexical_alternative
  - marker: b
    text: O “takip na pantubos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: ang Patotoo
  rationale: Pinananatili ang teknikal na katawagang Hebreo para sa patotoo ng tipan na inilagay sa kaban, nang hindi tahasang nililimitahan ang kahulugan sa mga tapyas bagaman malamang na ang mga iyon ang tinutukoy.
- source_word: הָאָרֹן
  choice: ang kaban
  rationale: Ang אָרוֹן ay isang kaban o baul; sa kontekstong ito, malinaw na ito ang banal na kaban. Hindi idinagdag ang “ng tipan” sapagkat wala iyon sa talata.
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Tumutukoy ito sa mahahabang pinggang ginagamit sa pagbuhat sa kaban. Ang “mga pingga” ay malinaw at likas sa makabagong Filipino.
- source_word: הַכַּפֹּרֶת
  choice: ang luklukan ng awa
  rationale: Ito ang kinikilalang katawagan sa natatanging gintong takip sa ibabaw ng kaban at pinananatili nito ang kahalagahang panritwal ng bagay, sa halip na gawing karaniwang “takip” lamang.
- source_word: מִלְמָעְלָה
  choice: sa ibabaw ng kaban
  rationale: Sa konteksto, inilalarawan ng parirala ang pagkakalagay ng luklukan ng awa sa itaas o ibabaw ng kaban. Ang pag-uulit sa “kaban” ay malinaw at natural sa Filipino.
- source_word: וַיִּתֵּן ... אֶל
  choice: inilagay ... sa loob ng
  rationale: Sa pisikal na kontekstong ito, ang נתן na may אֶל ay nangangahulugang maglagay sa loob ng isang sisidlan.
- source_word: וַיָּשֶׂם ... עַל
  choice: inilagay ... sa
  rationale: Tumpak at payak nitong inilalarawan ang paglalagay ng mga pingga sa wastong posisyon sa kaban nang hindi nagdaragdag ng paraang hindi tahasang sinabi sa Hebreo.
theological_decisions:
- issue: Ang tinutukoy ng “Patotoo”
  choice: Pinanatili bilang teknikal na katawagang “ang Patotoo” para sa kongkretong patotoo ng tipan na inilagay sa kaban.
  alternative: Tahasang tukuyin bilang “mga tapyas ng Patotoo” o “mga tapyas ng tipan.”
  rationale: May pisikal na bagay na inilagay sa kaban, malamang ang mga tapyas na bato, ngunit עֵדוּת lamang ang ginamit ng Hebreo. Pinananatili ng salin ang pagiging tiyak sa gamit ngunit hindi dinaragdagan ang tahasang pagkakakilanlan nito.
- issue: Kahulugan ng כַּפֹּרֶת
  choice: luklukan ng awa
  alternative: takip na pantubos; takip
  rationale: Tinutukoy nito ang natatanging bagay sa ibabaw ng kaban na may mahalagang papel sa ritwal ng pagtubos. Ang “luklukan ng awa” ay kinikilalang katawagan at hindi nito ibinababa ang kahulugan sa isang pangkaraniwang takip lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaban,” “mga pingga,” at “luklukan ng awa” bilang mga katawagang madaling maunawaan ngunit angkop sa kontekstong panritwal. Ginawang malaking titik ang “Patotoo” upang ipakitang teknikal itong katawagan sa kontekstong ito, hindi isang pangkalahatang patotoo.
