base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/024.yaml
  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: tl
  text: Inilagay niya ang kandelero sa tolda ng pagpupulong, sa tapat ng mesa,[a] sa gawing timog ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakaharap sa mesa.” Ang salitang Hebreo na נֹכַח ay maaaring tumukoy sa pagiging katapat o kaharap ng isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Inilagay niya
  rationale: Ang pandiwa mula sa שׂים ay nagsasalaysay ng natapos na kilos. Natural sa makabagong Tagalog ang “inilagay” at angkop sa maingat na pag-aayos ng mga kagamitan.
- source_word: הַמְּנֹרָה
  choice: ang ilawan
  rationale: Tumutukoy ang מְנוֹרָה sa patayong kagamitang kultiko na may mga lampara. Malinaw at karaniwang salin sa Tagalog ang “ilawan,” nang hindi gumagamit ng di-gaanong pamilyar na transliterasyong “menorah.”
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa tolda ng pagpupulong
  rationale: Ito ang tawag sa santuwaryo bilang lugar ng pakikipagtagpo. Tuwiran, dignipikado, at madaling maunawaan ang parirala sa modernong Tagalog.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: sa tapat ng mesa
  rationale: Ang נֹכַח ay maaaring magpahiwatig ng posisyong kaharap, katapat, o nasa harap. Pinananatili ng “sa tapat” ang pangunahing ugnayang panglokasyon nang hindi ito labis na nililinaw.
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: “Mesa” lamang ang sinasabi ng Hebreo; hindi idinagdag ang kaugnayan nito sa tinapay, bagaman malinaw iyon sa mas malawak na konteksto.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן נֶגְבָּה
  choice: sa gawing timog ng tabernakulo
  rationale: Ang יֶרֶךְ ay “tagiliran” o “gilid,” at nililinaw ng נֶגְבָּה na ang tinutukoy ay ang bahaging nasa timog. Natural na ipinahahayag ito sa Tagalog bilang “sa gawing timog.”
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Bagaman kaugnay ng diwang “tirahan” ang מִשְׁכָּן, ang “tabernakulo” ang nakaugaliang tiyak na katawagan sa santuwaryong ito sa Exodo.
