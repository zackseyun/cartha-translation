translation_notes:
  register: Modernong Filipino na tuwiran at marangal. Pinanatili ang anyong utos sa hinaharap sa pamamagitan ng ‘ilalagay mo’ at ‘ikakabit mo.’ Ginamit ang ‘looban,’ ‘tabing,’ at ‘pasukan’ upang maging malinaw sa karaniwang mambabasa nang hindi nagdaragdag ng denominasyonal o teknikal na pagpapakahulugan.
