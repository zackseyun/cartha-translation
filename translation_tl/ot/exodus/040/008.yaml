translation:
  language: tl
  text: Itatayo mo ang looban sa buong palibot, at ikakabit mo ang tabing[a] sa pasukan ng looban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kurtina”; ang salitang Hebreo ay tumutukoy sa nakasabit na pantakip sa pasukan ng looban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: At ilalagay mo
  rationale: Malawak ang kahulugan ng שׂים na ‘ilagay/itakda.’ Ang ‘ilalagay’ ay tuwiran at natural, at hindi nito labis na tinutukoy kung paano itatayo ang looban.
- source_word: הֶחָצֵר
  choice: ang looban
  rationale: Ang חָצֵר ay tumutukoy sa nakabakod na lugar na nakapalibot sa tabernakulo. Ang ‘looban’ ay malinaw at karaniwang salitang Filipino para rito.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahahayag nito na ang looban ay nakapaligid sa tabernakulo; natural sa Filipino ang ‘sa palibot.’
- source_word: וְנָתַתָּ
  choice: at ikakabit mo
  rationale: Bagaman karaniwang nangangahulugang ‘ilagay’ ang נתן, ang bagay na tinutukoy ay isang nakasabit na pantakip sa pasukan. Ang ‘ikakabit’ ay likas sa konteksto ng paglalagay nito nang hindi labis na nagdaragdag ng detalye.
- source_word: מָסַךְ
  choice: ang tabing
  rationale: Sa konteksto ng tabernakulo, ang מָסָךְ ay isang nakasabit na pantakip o harang sa pasukan. Ang ‘tabing’ ay dignificado, natural, at hindi labis na tumutukoy sa materyal nito.
- source_word: שַׁעַר
  choice: sa pasukan
  rationale: Ang שַׁעַר ay ang bukana o daanan papasok sa looban. Dahil tela ang nagsisilbing harang dito, mas malinaw sa modernong Filipino ang ‘pasukan’ kaysa ‘pintuang-bayan’ o isang matigas na ‘pinto.’
- source_word: הֶחָצֵר
  choice: ng looban
  rationale: Likas na isinasalin ang construct chain na שַׁעַר הֶחָצֵר bilang ‘pasukan ng looban.’
