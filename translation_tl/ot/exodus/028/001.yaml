base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: tl
  text: 'At ikaw, ilapit mo sa iyong harapan si Aaron na kapatid mo, pati ang mga anak niyang lalaki na kasama niya, mula sa hanay ng mga anak ni Israel, upang maglingkod sila sa akin bilang mga pari: si Aaron, sina Nadab at Abihu, Eleazar at Itamar—mga anak na lalaki ni Aaron.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ikaw
  rationale: Pinananatili ang mariing panghalip at ang paglipat ng pahayag patungo sa tuwirang tagubilin kay Moises.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: ilapit mo sa iyo
  rationale: Inilalarawan ng Hiphil ng קרב ang pagpapalapit o paghaharap; pinananatili ng salin ang konkretong diwang ritwal nang hindi agad ipinapakahulugang ganap na pagtatalaga.
- source_word: אַהֲרֹן אָחִיךָ
  choice: si Aaron na kapatid mo
  rationale: Likas sa modernong Tagalog at tahasang pinananatili ang ugnayang pampamilya.
- source_word: וְאֶת־בָּנָיו אִתּוֹ
  choice: kasama ang kanyang mga anak
  rationale: Ipinapahayag ang accompaniment marker na אִתּוֹ at malinaw na magkakasamang inilalapit si Aaron at ang kanyang mga anak.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: mula sa gitna ng mga anak ni Israel
  rationale: Pinananatili ang pormang nakabatay sa Hebreo at ang diwa ng pagpili mula sa loob ng bayang Israel.
- source_word: לְכַהֲנוֹ לִי
  choice: upang maglingkod sa akin bilang mga pari
  rationale: Ipinahahayag ang tungkuling makapari at ang tahasang לִי, habang natural at malinaw sa kasalukuyang Tagalog.
- source_word: בְּנֵי אַהֲרֹן
  choice: ang mga anak ni Aaron
  rationale: Malinaw at idiomatikong tinutukoy ang mga lalaking pinangalanan bilang mga anak ni Aaron.
theological_decisions:
- issue: Ang kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Ang Hebreo ay literal na gumagamit ng “mga anak ni Israel” bilang katawagan sa bayang tipan. Pinananatili ito dahil malinaw at nauunawaan din sa Tagalog, nang hindi pinapalitan ng mas pangkalahatang kolektibong termino.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “pari” bilang karaniwang tawag sa tungkuling kultiko, at pinanatili ang bahagyang pormal na “mga anak ni Israel” upang maipakita ang hugis at teolohikal na bigat ng katawagang Hebreo. Walang footnote dahil hindi kailangan ang leksikal na alternatibo upang maunawaan ang talata.
