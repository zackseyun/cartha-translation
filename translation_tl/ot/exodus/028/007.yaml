    rationale: Maaaring unawain itong ang dalawang piraso mismo ang magkadugtong sa isa't isa. Ang «nakakabit sa dalawang dulo nito» ay mas tuwirang nagpapahayag ng relasyong minarkahan ng אֶל.
  revised_text: Magkakaroon ito ng dalawang pirasong pambalikat na nakakabit sa dalawang dulo nito, at pagdudugtungin ito.
