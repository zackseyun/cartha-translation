translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “bahaging pambalikat” upang malinaw na kasuutan ang tinutukoy, at “magkabigkis” upang maiwasan ang alanganing pag-uulit habang pinananatili ang larawan ng pinagdudugtong na efod.
