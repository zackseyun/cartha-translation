translation:
  language: tl
  text: Magkakaroon ito ng dalawang pirasong pambalikat na nakakabit sa dalawang dulo nito, at pagdudugtungin ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: dalawang bahaging pambalikat
  rationale: Sa konteksto ng efod, tumutukoy ito sa mga bahagi ng kasuutang nasa balikat, hindi sa mismong mga balikat. Likas at malinaw sa Filipino ang “bahaging pambalikat.”
- source_word: חֹבְרֹת
  choice: magkadugtong
  rationale: Ang pambabaeng maramihang participle mula sa חבר ay naglalarawan sa dalawang bahaging pambalikat bilang magkakabit o nagdurugtong. Pinananatili ng “magkadugtong” ang ideya ng pagkakaugnay.
- source_word: יִהְיֶה לּוֹ
  choice: magkakaroon ito ng
  rationale: Ang Hebreong konstruksiyong may ל at hulaping panghalip ay nagsasaad ng pagmamay-ari; natural itong ipahayag sa Filipino bilang “magkakaroon ito ng.”
- source_word: אֶל שְׁנֵי קְצוֹתָיו
  choice: sa dalawang dulo nito
  rationale: Ang קָצֶה ay dulo o hangganan. Ang “sa dalawang dulo nito” ay tuwiran at angkop sa paggawa ng kasuutan.
- source_word: וְחֻבָּר
  choice: upang ito ay magkabigkis
  rationale: Ang passive na anyo ng חבר ay nagsasaad na ang efod ay mapagdurugtong o mapagbibigkis. Ang “magkabigkis” ay natural sa konteksto ng kasuutan at pinananatili ang ugnayan sa naunang anyo ng parehong ugat.
