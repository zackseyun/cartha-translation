  verdict: revise
  source_fidelity: Tumpak ang pagtukoy sa dalawang bahagi ng efod na nasa balikat at sa dalawang dulo nito. Gayunman, ang pangwakas na «magkabigkis» ay hindi sapat na tumutugma sa Hebreong passive na וְחֻבָּר, na nagsasabing ang efod ay pagdudugtungin/pagkakabitin, hindi lamang na kusang ‘magkakabigkis.’
  naturalness: Nauunawaan ang draft, ngunit ang «upang ito ay magkabigkis» ay medyo di-karaniwan para sa isang piraso ng kasuotan at maaaring magmungkahi ng katumbasang kilos. Mas malinaw at likas ang tahasang passive na «at pagdudugtungin ito.»
