  text: וְ/עָשִׂיתָ֮ שְׁתֵּ֣י טַבְּע֣וֹת זָהָב֒ וְ/נָתַתָּ֣ה אֹתָ֡/ם עַל שְׁתֵּי֩ כִתְפ֨וֹת הָ/אֵפ֤וֹד מִ/לְּ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: tl
  text: Gagawa ka ng dalawang gintong singsing at ikakabit mo ang mga iyon sa dalawang bahagi sa balikat ng efod, sa ilalim, sa harapang bahagi nito, katapat ng dugtungan nito[a], at sa ibabaw ng mahusay na hinabing bigkis ng efod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinagdurugtungan nito” o “lugar na kinakabitan nito.” Malawak ang kahulugan ng salitang Hebreo at tumutukoy sa lugar kung saan pinag-uugnay ang efod.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “hinabing sinturon ng efod.” Ang salitang Hebreo na חֵשֶׁב ay tumutukoy sa espesyal na ginawang bigkis o bahaging pansara ng efod.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעוֹת
  choice: mga singsing
  rationale: Karaniwang tumutukoy ang salita sa mga metal na singsing na ginagamit na pangkabit; ito rin ang pinakanatural na katawagan sa konteksto ng kasuotang pansaserdote.
- source_word: כִתְפוֹת
  choice: mga bahagi sa balikat
  rationale: Bagaman kaugnay ito ng literal na 'mga balikat,' tinutukoy rito ang mga seksiyon ng efod na nasa balikat, hindi ang mismong balikat ng tao.
- source_word: הָאֵפוֹד
  choice: efod
  rationale: Pinanatili ang kinikilalang transliterasyon ng teknikal na katawagan sa kasuotang pansaserdote sapagkat walang maikli at ganap na katumbas nito sa Tagalog.
- source_word: מִלְּמַטָּה
  choice: sa ilalim
  rationale: Malinaw at natural nitong ipinahahayag na ang mga singsing ay ilalagay sa mas mababang bahagi.
- source_word: מִמּוּל פָּנָיו
  choice: sa harapang bahagi nito
  rationale: Isinasalin nito nang natural para sa isang bagay ang literal na ideya ng pagiging nasa o nakaharap sa 'mukha' nito.
- source_word: לְעֻמַּת
  choice: katapat ng
  rationale: Pinananatili nito ang diwa ng pagkakatapat o pagkakahanay ng posisyon.
- source_word: מֶחְבַּרְתּוֹ
  choice: dugtungan nito
  rationale: Mas malawak ito kaysa 'tahi' at maaaring tumukoy sa lugar kung saan pinagdurugtong o ikinakabit ang mga bahagi ng efod.
- source_word: מִמַּעַל
  choice: sa ibabaw ng
  rationale: Tuwirang ipinahahayag nito ang posisyong mas mataas sa kasunod na bahaging tinutukoy.
- source_word: לְחֵשֶׁב הָאֵפוֹד
  choice: mahusay na hinabing bigkis ng efod
  rationale: Ang חֵשֶׁב sa kontekstong ito ay teknikal na tawag sa espesyal na hinabi at parang sinturong bahagi ng efod; ang 'bigkis' ay hindi labis na naglilimita sa eksaktong anyo nito.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na katawagang “efod,” habang isinalin sa karaniwang wika ang mga bahagi at direksiyon ng kasuutan. Inayos ang mga panandang talababa upang ang [a] ay tumukoy sa “dugtungan” at ang [b] sa “bigkis.”
