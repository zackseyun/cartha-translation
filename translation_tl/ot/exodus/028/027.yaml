  source_fidelity: 'Tapat ang salin sa Hebreo: dalawang gintong singsing, ang dalawang bahaging nasa balikat ng efod, ang lokasyong nasa ibaba at sa harapang bahagi, ang pagkakatapat sa dugtungan, at ang posisyong nasa ibabaw ng bigkis ng efod ay lahat naipahayag. Hindi nito ipinipilit na ang מֶחְבַּרְתּוֹ ay isang tahi lamang, kundi pinananatili ang mas malawak na diwa ng dugtungan.'
