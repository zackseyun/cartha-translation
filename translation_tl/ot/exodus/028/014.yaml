  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: tl
  text: Gumawa ka rin ng dalawang tanikala na yari sa purong ginto, na ang pagkakayari ay parang lubid na pinilipit; at ikabit mo ang mga tanikalang iyon sa mga engaste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga engaste” ay maaari ring isaling “mga kabitan” o “mga balangkas na ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת זָהָב טָהוֹר
  choice: dalawang tanikala na purong ginto
  rationale: Tuwirang inililipat ang bilang, bagay, at materyal; ang “tanikala” ay natural para sa gintong chainwork ng kasuotang pangpari.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: pinilipit na parang lubid
  rationale: Ang dalawang magkaugnay at mahirap na pananalita ay kapwa tumutukoy sa anyong pinilipit o tulad-lubid. Pinananatili ng parirala ang pangunahing larawan nang hindi nagpapanggap na tiyak kung eksaktong tirintas o ibang uri ng pagkakapilipit ang pamamaraan.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Gumawa ka
  rationale: Natural na pang-isahang utos kay Moises sa modernong Filipino.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: mga pinilipit na tanikala
  rationale: Pinananatili ang inuulit na paglalarawan sa mga tanikala bilang corded o twisted.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: sa mga enggaste
  rationale: Ang “enggaste” ay tiyak na terminong Filipino para sa balangkas o kabitan ng hiyas at angkop sa kagamitang ginto sa konteksto.
