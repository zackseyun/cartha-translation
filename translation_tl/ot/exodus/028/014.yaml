  register: Makabagong Filipino na marangal at malinaw. Ginamit ang “pinilipit na parang lubid” upang maipahayag ang magkaugnay na mga terminong Hebreo para sa corded workmanship, at nilagyan ng paliwanag ang teknikal na salitang “enggaste.”
