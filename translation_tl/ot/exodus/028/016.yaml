  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: tl
  text: Dapat itong maging parisukat at doble[a]—isang dangkal ang haba nito at isang dangkal ang lapad nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakatiklop nang doble.” Inilalarawan ng Hebreo ang pektoral bilang ginawang doble, malamang sa pamamagitan ng pagtitiklop.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: parisukat
  rationale: Tuwirang ipinahihiwatig ng pang-uri ang hugis na parisukat; ito ang natural at malinaw na katawagan sa modernong Filipino.
- source_word: יִהְיֶה
  choice: dapat itong maging
  rationale: Ang imperfect sa kontekstong ito ay nagbibigay ng takdang anyo sa paggawa; pinananatili ng “dapat” ang preskriptibong puwersa nang natural sa Filipino.
- source_word: כָּפוּל
  choice: doble
  rationale: Inilalarawan ng passive participle ang bagay bilang ginawang patong-dalawa o nakatiklop. Ang “doble” ay maikli at hindi labis na nagpapasya kung paano ito dinoble.
- source_word: זֶרֶת
  choice: dangkal
  rationale: Ang זֶרֶת ay sukat mula sa nakabukang kamay; “dangkal” ang katumbas na karaniwang sukat at salita sa Filipino.
- source_word: אָרְכּוֹ
  choice: ang haba
  rationale: Natural na pagpapahayag sa Filipino ng sukat ng haba; malinaw sa pangungusap na tumutukoy ito sa pektoral na inilalarawan sa konteksto.
- source_word: וְזֶרֶת
  choice: at isang dangkal
  rationale: Inuulit ang yunit ng ikalawang dimensiyon ayon sa pormula ng Hebreo, sa natural na ayos ng Filipino.
- source_word: רָחְבּוֹ
  choice: ang lapad
  rationale: Ang “lapad” ang karaniwang modernong Filipino para sa dimensiyong katapat ng haba.
