base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: tl
  text: Gagawa ka sa laylayan nito ng mga granada na yari sa sinulid na asul, lila, at matingkad na pula[a], sa palibot ng laylayan nito, at maglalagay ka ng mga kampanang ginto sa pagitan ng mga iyon sa buong palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga palamuting hugis-granada.” Literal na “mga granada” ang nasa Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal perfect na may prefixed conjunction sa konteksto ng mga tagubilin ay nagpapahayag ng utos. Ang “Gagawa ka” ay tuwiran at natural sa modernong Filipino.
- source_word: שׁוּלָיו
  choice: laylayan nito
  rationale: Tumutukoy ito sa ibabang gilid ng kasuutan; “laylayan” ang natural at tiyak na salitang Filipino para rito.
- source_word: רִמֹּנֵי
  choice: mga granada
  rationale: Literal na “mga granada” ang Hebreo. Pinananatili ng pangunahing teksto ang kongkretong katawagan sa halip na ipakahulugang agad na mga palamuting hugis-granada.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Tumutukoy sa mamahaling materyal na tinina ng asul na ginagamit sa mga tela ng tabernakulo. Ipinahahayag ang tekstil na diwa sa pariralang “sinulid na asul.”
- source_word: אַרְגָּמָן
  choice: lila
  rationale: Karaniwang katawagan ito sa kulay ng tekstil sa mga paglalarawan ng tabernakulo; natural itong isalin na “lila.”
- source_word: תוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Tumutukoy ang parirala sa materyal o sinulid na tinina ng matingkad na pulang kulay. Ang “matingkad na pula” ay malinaw sa mga karaniwang mambabasa at hindi labis na teknikal.
- source_word: סָבִיב
  choice: sa buong palibot
  rationale: Ipinahihiwatig nito na nakapalibot ang pagkakalagay sa buong laylayan.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: at maglalagay ka ng mga kampanang ginto
  rationale: Idinaragdag ng pangatnig ang mga kampana bilang isa pang elemento ng disenyo. Isinaayos ang pandiwa para maging malinaw at natural ang utos sa Filipino.
- source_word: בְּתוֹכָם
  choice: sa pagitan ng mga iyon
  rationale: Ang mga kampana ay nasa gitna ng mga granada, kaya ang “sa pagitan ng mga iyon” ay malinaw na naghahatid ng salit-salitang pagkakaayos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang literal na “mga granada” sa pangunahing teksto, habang nilinaw sa talababa ang malamang na pandekorasyong anyo. Ginamit ang “laylayan” at “kampanang ginto” bilang natural ngunit malapit-sa-pinagmulan na mga katumbas.
