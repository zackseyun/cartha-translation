base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: tl
  text: Dapat itong suot ni Aaron habang siya’y naglilingkod, at maririnig ang tunog nito kapag pumapasok siya sa Banal na Lugar sa harap ni Yahweh at kapag lumalabas siya, upang hindi siya mamatay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin ang hulihan: “nang huwag siyang mamatay” o “kung hindi ay mamamatay siya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Isusuot iyon ni Aaron
  rationale: Sa konteksto, ang tinutukoy ay ang kasuotang inilarawan sa mga naunang talata. Mas natural sa modernong Tagalog ang aktibong ‘isusuot’ kaysa literal na ‘iyon ay mapapasakaniya,’ habang pinananatili ang preskriptibong diwa.
- source_word: לְשָׁרֵת
  choice: kapag naglilingkod siya
  rationale: Ang infinitive na may לְ ay maaaring magpahayag ng layunin o kalagayan. Ang temporal na ‘kapag naglilingkod siya’ ay natural at angkop sa paglilingkod bilang pari.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: at maririnig ang tunog nito
  rationale: Malamang na tumutukoy ang hulaping panaguri sa balabal na may mga kampanilyang inilarawan sa agarang konteksto, hindi sa tinig ni Aaron. Hindi idinagdag ang ‘mga kampanilya’ sa pangunahing teksto upang manatiling malapit sa Hebreo.
- source_word: בְּבֹאוֹ
  choice: kapag pumapasok siya
  rationale: Ang infinitive construct na may בְּ at hulaping panghalip ay temporal. Ipinahihiwatig ng kasunod na pariralang patutunguhan ang pagpasok, kaya malinaw at natural ang ‘pumapasok.’
- source_word: אֶל הַקֹּדֶשׁ
  choice: sa Dakong Banal
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang הַקֹּדֶשׁ sa banal na bahagi ng santuwaryo. Pinananatili ng ‘Dakong Banal’ ang partikular na katawagang pangkulto.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Direktang inilalarawan ng parirala ang pagharap sa presensiya ng Diyos. Isinalin ang banal na pangalan bilang ‘Yahweh’ alinsunod sa patakaran ng proyekto.
- source_word: וּבְצֵאתוֹ
  choice: at kapag lumalabas siya
  rationale: Pinananatili ang temporal na pagkakapantay sa ‘kapag pumapasok siya’ at natural itong pahayag sa Tagalog.
- source_word: וְלֹא יָמוּת
  choice: upang hindi siya mamatay
  rationale: Sa kontekstong ritwal at legal, malinaw na ipinahahayag ng sugnay ang nilalayong pag-iwas sa kamatayan. Natural sa modernong Tagalog ang ‘upang hindi,’ bagaman posible rin ang mas mahigpit na babalang ‘kung hindi ay mamamatay siya.’
theological_decisions:
- issue: Tinutukoy ng ‘tunog nito’
  choice: Ang tunog ng kasuotang may mga kampanilya
  alternative: Ang tunog ng pagkilos o presensiya ni Aaron sa pangkalahatan
  rationale: Inilalarawan sa Exodo 28:33–34 ang mga kampanilya sa laylayan ng balabal, kaya iyon ang pinakamalapit at pinakamalamang na pinagmumulan ng tunog.
- issue: Pangwakas na ugnayan ng וְלֹא יָמוּת
  choice: 'Layunin o kinalabasan: ‘upang hindi siya mamatay’'
  alternative: 'Babala: ‘kung hindi ay mamamatay siya’ o ‘nang huwag siyang mamatay’'
  rationale: Maaaring dalhin ng Hebreo ang diwa ng pag-iwas o babala. Pinili ang natural na pahayag ng layunin/kinalabasan nang hindi ipinapaliwanag kung paano eksaktong nakapipigil sa kamatayan ang ritwal.
- issue: Pagsasalin ng יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Ginamit ang transliterasyong ‘Yahweh’ upang katawanin ang banal na pangalan at sundin ang patakaran ng proyekto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang ‘naglilingkod’ para sa gawaing pangpari at ‘Dakong Banal’ bilang pormal ngunit pamilyar na katawagang pangsantuwaryo. Iniwasan ang sobrang literal na ayos na magiging alanganin sa Tagalog.
