base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: tl
  text: 'Gagawa ka ng isang plakang yari sa purong ginto, at uukitan mo ito gaya ng ukit sa isang pantatak: “Banal para kay Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “Kabanalan para kay Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka rin
  rationale: Ipinahahayag ng pandiwa ang kasunod na tagubilin sa paggawa ng kasuotan ng pari; likas sa Tagalog ang anyong panghinaharap bilang mariing utos, at ipinapakita ng “rin” ang pagpapatuloy ng mga tagubilin.
- source_word: צִּיץ
  choice: plaka
  rationale: Bagaman maaari itong tumukoy sa bulaklak o palamuti sa ibang konteksto, dito ay isang manipis na gintong palamuting may ukit na ikinakabit sa turbante. Malinaw at kongkreto ang “plaka” sa makabagong Tagalog.
- source_word: זָהָב טָהוֹר
  choice: na purong ginto
  rationale: Natural na inilalarawan nito sa Tagalog ang materyal at kadalisayan ng plaka.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: at uukitan mo iyon
  rationale: Sa konteksto ng paggawa sa metal, ang pandiwa ay tumutukoy sa pag-ukit ng mga titik o inskripsiyon sa bagay.
- source_word: פִּתּוּחֵי חֹתָם
  choice: gaya ng pag-ukit sa isang pantatak
  rationale: Pinananatili nito ang paraan ng pag-ukit na katulad ng ukit sa isang selyo o pantatak, nang hindi ipinapalagay kung ang tinutukoy ay kagamitan o manggagawa.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Banal para kay Yahweh
  rationale: Pinananatili ang maikli at pormal na anyo ng inskripsiyon. Ang “para kay” ay likas na nagpapahayag ng pagtatalaga habang nananatiling bukas ang pangngalang pagbasa na inilagay sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Pag-render sa inskripsiyong קֹדֶשׁ לַיהוָה
  choice: Banal para kay Yahweh
  alternative: Kabanalan para kay Yahweh
  rationale: Maaaring magkaroon ng pang-uri o pangngalang diwa ang קֹדֶשׁ sa maikling inskripsiyon. Pinili sa pangunahing teksto ang maigsi at dedikatoryong “Banal para kay Yahweh,” habang pinananatili sa talababa ang posibleng abstraktong pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “plaka” at “pantatak” bilang madaling maunawaang katawagan sa bagay at paraan ng pag-ukit; pinanatiling maikli at pormal ang mismong inskripsiyon.
