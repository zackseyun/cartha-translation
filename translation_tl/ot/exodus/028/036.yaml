  terminology: Ang “plaka,” “pantatak,” at “Yahweh” ay angkop sa makabagong Filipino at sa konteksto. Ang “Banal para kay Yahweh” ay isang katanggap-tanggap na maigsi, inskripsiyonal na salin; ang alternatibong pangngalang pagbasa ay maayos na nasa talababa.
