base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: tl
  text: Para sa mga anak ni Aaron, gumawa ka ng mga tunika, mga pamigkis, at mga pantakip sa ulo[a], para sa karangalan at karilagan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kupya,” “mga turbante,” o “mga putong”; hindi tiyak ang eksaktong anyo ng kasuotang pangsaser­dote sa ulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: para sa mga anak ni Aaron
  rationale: Pinananatili nito ang tuwirang kahulugang anak, sa halip na palawakin bilang mga inapo.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: gumawa ka
  rationale: Ang mga anyong pandiwa sa kontekstong ito ay utos; natural at marangal sa modernong Tagalog ang pautos na anyo.
- source_word: כֻתֳּנֹת
  choice: mga tunika
  rationale: Tumutukoy ito sa pangunahing kasuotang pant katawan; mas tiyak ang tunika kaysa amerikana o pangkalahatang kasuotan.
- source_word: אַבְנֵטִים
  choice: mga pamigkis
  rationale: Ang salita ay tumutukoy sa telang ibinabalot sa baywang; ang pamigkis ay mas angkop kaysa sinturon, na maaaring magpahiwatig ng matigas at makabagong kagamitan.
- source_word: מִגְבָּעוֹת
  choice: mga pantakip sa ulo
  rationale: Ligtas at malinaw itong katawagan sa kasuotang pansaser­dote sa ulo nang hindi labis na tinutukoy ang eksaktong hugis nito.
- source_word: לְכָבוֹד
  choice: upang magbigay sa kanila ng karangalan
  rationale: Sa konteksto, ang כָּבוֹד ay dignidad o karangalang ipinagkakaloob ng mga kasuotan; natural itong ipinahahayag sa Tagalog bilang layunin.
- source_word: וּלְתִפְאָרֶת
  choice: at karilagan
  rationale: Saklaw ng תִּפְאֶרֶת ang kagandahan at maringal na anyo; pinananatili ng karilagan ang mataas ngunit nauunawaang rehistro.
theological_decisions:
- issue: Layunin ng mga kasuotang pansaser­dote
  choice: upang magbigay sa kanila ng karangalan at karilagan
  alternative: para sa kaluwalhatian at kagandahan
  rationale: Inilalarawan ng pariralang Hebreo ang marangal at magandang anyo o epekto ng mga kasuotan. Iniiwasan ng salin ang pagdagdag ng simbolismong teolohikal na wala mismo sa talata.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong pambatas. Pinagsama ang magkakatulad na utos sa isang natural na pangungusap habang pinananatili ang tatlong magkakahiwalay na uri ng kasuotan at ang layuning ipinahahayag sa hulihan.
