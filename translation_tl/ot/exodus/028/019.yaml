  register: Gumamit ng maikli, dignificado, at likas na modernong Filipino na angkop sa pagpapatuloy ng isang talaan. Pinanatili ang mga karaniwang salitang Filipino para sa mga batong hiyas at ang tunay na kawalang-katiyakan sa pagkakakilanlan ng dalawang sinaunang pangalan sa pamamagitan ng mga talababa.
