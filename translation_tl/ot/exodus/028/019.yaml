translation:
  language: tl
  text: 'at ang ikatlong hanay: hasinto[a], agata[b], at amatista.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga batong pinangalanan dito; ang “hasinto” ay salin ng לֶשֶׁם, na ayon sa tradisyon ay isinasaling “ligure.”
    reason: lexical_alternative
  - marker: b
    text: Posible ring “onise” ang שְׁבוֹ; ang mga sinaunang katawagan sa mga batong hiyas ay hindi laging eksaktong tumutugma sa mga pangalan ng mineral sa kasalukuyan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: at ang ... hanay
  rationale: Sa konteksto ng mga batong nakalagay sa pektoral, ang טוּר ay tumutukoy sa isang hanay; pinananatili ng “at” ang pagpapatuloy ng talaan mula sa naunang talata.
- source_word: הַשְּׁלִישִׁי
  choice: ikatlong
  rationale: Tuwirang isinasalin ang bilang na panunuran na tumutukoy sa ikatlong hanay.
- source_word: לֶשֶׁם
  choice: hasinto
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan ng batong ito. Ang “hasinto” ay isang kinikilalang makabagong katawagan sa batong hiyas na jacinth; inilalahad sa talababa ang kawalang-katiyakan.
- source_word: שְׁבוֹ
  choice: agata
  rationale: Ang “agata” ang tradisyonal at madaling makilalang katumbas, bagaman hindi tiyak ang eksaktong modernong mineral na tinutukoy; binabanggit sa talababa ang posibleng alternatibo.
- source_word: וְאַחְלָמָה
  choice: at amatista
  rationale: Karaniwang kinikilalang amatista ang אַחְלָמָה; malinaw at natural ang katawagang ito sa modernong Filipino.
