translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “batong hiyas” upang likas na ipahayag ang mga gemstone, at “nakaayos” upang maipakita ang estruktura ng apat na hanay nang hindi nagdaragdag ng teknikal na detalyeng wala sa Hebreo.
