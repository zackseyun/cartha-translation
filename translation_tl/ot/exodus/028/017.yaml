  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: tl
  text: At lalagyan mo iyon ng mga batong hiyas[a] na nakaayos sa apat na hanay. Sa unang hanay ay rubi, topasyo, at esmeralda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng mga batong hiyas na ito. Ang “rubi” ay maaari ring “karnelyan”; ang “topasyo” ay maaari ring “krisolito” o “peridot”; at ang “esmeralda” ay maaari ring “berilo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: lalagyan mo iyon ng mga batong hiyas
  rationale: Ang מלא ay literal na “punuin,” ngunit sa konteksto ng paggawa ng pektoral, tumutukoy ito sa paglalagay o pagkakabit ng mga batong hiyas. Ang natural na Filipino ay “lalagyan ... ng,” nang hindi labis na tinutukoy ang uri ng pagkakabit.
- source_word: אַרְבָּעָה טוּרִים אֶבֶן
  choice: mga batong hiyas na nakaayos sa apat na hanay
  rationale: Ang טוּר ay hanay ng magkakasunod na bato. Ginagawang malinaw ng ayos ng parirala sa Filipino na ang mga bato ang nakaayos sa apat na hanay.
- source_word: טוּר ... הָאֶחָד
  choice: sa unang hanay
  rationale: Sa pagkakasunod ng apat na hanay, ang literal na “isang hanay” ay natural na nagpapahiwatig ng una; “unang hanay” ang malinaw at idiomatikong katumbas.
- source_word: אֹדֶם
  choice: rubi
  rationale: Tradisyonal at madaling makilalang salin para sa mapulang batong ito, bagaman hindi tiyak ang eksaktong mineral; pinananatili sa talababa ang posibleng carnelian.
- source_word: פִּטְדָה
  choice: topasyo
  rationale: Karaniwang salin ng hindi tiyak na pangalan ng batong ito. Inilalahad sa talababa ang posibleng crisolita o peridot.
- source_word: בָרֶקֶת
  choice: esmeralda
  rationale: Karaniwang salin na angkop sa modernong Filipino, bagaman maaaring ibang makinang na batong gaya ng berilo ang tinutukoy; itinatala ang kawalang-katiyakan sa talababa.
