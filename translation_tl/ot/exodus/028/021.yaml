base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: tl
  text: At ang mga bato ay tutugma sa mga pangalan ng mga anak ni Israel[a]—labindalawa, ayon sa kanilang mga pangalan. Uukitan ang mga ito gaya ng ukit sa pantatak[b], bawat isa ayon sa pangalan nito, para sa labindalawang lipi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni Israel”; maaari ring isaling “mga Israelita.” Ito ay isang nakapirming pormula para sa mga liping nagmula kay Israel.
    reason: lexical_alternative
  - marker: b
    text: O “ng mga ukit ng pantatak” o “ukit na gaya ng sa isang selyo.” Ang Hebreo ay tumutukoy sa uri ng ukit na ginagamit sa pantatak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: At ang mga bato
  rationale: Pinananatili ng “At” ang pang-ugnay na waw at ng tiyak na pariralang “ang mga bato” ang pagtukoy sa mga batong nauna nang inilalarawan.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: ay tutugma sa mga pangalan ng mga anak na lalaki ni Israel
  rationale: Payak na “magiging ayon/sa ibabaw ng mga pangalan” ang anyong Hebreo, ngunit ang עַל dito ay nagpapahayag ng kaugnayan. Ang “tutugma sa” ay likas sa modernong Tagalog at hindi ipinapalagay na literal na nakapatong ang mga bato sa mga pangalan.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: labindalawa, ayon sa kanilang mga pangalan
  rationale: Pinananatili ang bilang at ang pag-uulit ng Hebreo na bawat isa sa labindalawang bato ay kaugnay ng isang pangalan.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: Uukitan ang mga ito na gaya ng pantatak
  rationale: Tumutukoy ang parirala sa ukit na tulad ng nasa isang selyo o pantatak. Ang pandiwang “uukitan” ay malinaw at likas sa Tagalog sa konteksto ng paggawa sa mga bato.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: bawat isa ng kani-kaniyang pangalan
  rationale: 'Ginagamit nang distributibo ang אִישׁ: bawat bato ay lalagyan ng nakatalaga ritong pangalan. Iniiwasan ng “kani-kaniyang” ang di-likas na paglalapat ng kasariang panlalaki sa mga bato habang pinananatili ang isa-sa-isang pagtutugma.'
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: para sa labindalawang lipi
  rationale: Tapat at maikli nitong ipinapahayag na ang mga bato at pangalan ay kumakatawan sa labindalawang lipi.
theological_decisions:
- issue: Ang pormulang tipan na בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  alternative: mga anak ni Israel / mga Israelita
  rationale: Literal na “mga anak na lalaki ni Israel” ang Hebreo. Pinananatili ito sa teksto upang hindi burahin ang anyong panlalaki ng makasaysayang pormula, samantalang nililinaw sa talababa na tumutukoy ito sa mga liping nagmula kay Israel.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “pantatak” bilang madaling maunawaang katumbas ng selyong inuukitan, at “lipi” para sa mga tribo ng Israel. Pinanatili ang pag-uulit at ang isa-sa-isang ugnayan ng labindalawang bato, pangalan, at lipi.
