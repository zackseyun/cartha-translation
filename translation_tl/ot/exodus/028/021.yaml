    rationale: Sa modernong Filipino, 'mga anak ni Israel' ang likas na katumbas ng nakapirming Hebreong pormulang בני ישראל. Maaaring banggitin sa talababa ang literal na anyong 'mga anak na lalaki' at ang saklaw nitong kolektibo.
  - severity: low
    issue: Ang 'gaya ng pantatak' ay maaaring magpahiwatig na ang mga bato mismo ay mga pantatak.
    rationale: Ang פִּתּוּחֵי חוֹתָם ay tumutukoy sa estilong ukit ng pantatak. Ang 'gaya ng ukit sa pantatak' ay mas tiyak.
