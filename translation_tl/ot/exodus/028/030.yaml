revisions:
- from: Ilalagay mo sa loob ng pektoral ng paghatol[b] ang Urim at ang Tummim.[a] Ang mga ito ay mapapasa ibabaw ng puso ni Aaron kapag pumapasok siya sa harapan ni Yahweh. At dadalhin ni Aaron sa ibabaw ng kanyang puso ang paghatol sa mga anak ni Israel[c] sa harapan ni Yahweh nang palagi.
  to: Ilalagay mo sa loob ng pektoral ng paghatol[b] ang Urim at ang Tummim.[a] Ang mga ito ay nasa tapat ng puso ni Aaron kapag pumapasok siya sa presensya ni Yahweh. At dadalhin ni Aaron sa tapat ng kanyang puso ang paghatol para sa mga anak ni Israel[c] sa presensya ni Yahweh palagi.
  rationale: Inayos ang mga pariralang hindi likas sa modernong Filipino at nilinaw ang ugnayan ng “paghatol” sa mga anak ni Israel. Pinanatili ang pag-uulit ng “paghatol,” ang transliterasyon ng Urim at Tummim, ang pangalang Yahweh, at ang maingat na kawalang-katiyakan sa mga talababa.
