source:
  edition: WLC
  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: tl
  text: Ilalagay mo sa loob ng pektoral ng paghatol[b] ang Urim at ang Tummim.[a] Ang mga ito ay nasa tapat ng puso ni Aaron kapag pumapasok siya sa presensya ni Yahweh. At dadalhin ni Aaron sa tapat ng kanyang puso ang paghatol para sa mga anak ni Israel[c] sa presensya ni Yahweh palagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Urim at Tummim ay mga pangalang Hebreo ng mga sagradong bagay na kaugnay ng paghatol o pagpapasya ng pari. Hindi tiyak ang eksaktong anyo at paraan ng paggamit sa mga ito. Posibleng batay sa etimolohiya ang mga kahulugang “mga liwanag” at “mga kasakdalan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “pektoral para sa pagpapasya” o “pektoral ng katarungan.” Ang salitang Hebreo na מִשְׁפָּט ay maaaring mangahulugang paghatol, pasya, o katarungan depende sa konteksto.
    reason: alternative_reading
  - marker: c
    text: Ang “mga anak ni Israel” ang literal na pananalita sa Hebreo; tumutukoy ito sa bayang Israel bilang bayan ng tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: pektoral ng paghatol
  rationale: Ang “pektoral” ay likas na katawagang Filipino para sa kasuotang pansaserdote sa dibdib. Pinananatili ng “paghatol” ang pag-uulit at bigat ng מִשְׁפָּט, samantalang inilalahad sa talababa ang iba pang posibleng diwa.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ang Urim at ang Tummim
  rationale: Isinalin sa pamamagitan ng transliterasyon ang mga teknikal na pangalang Hebreo sapagkat hindi tiyak ang anyo, gamit, at etimolohiya ng mga bagay na ito.
- source_word: אֶל
  choice: sa loob ng
  rationale: Kasama ng pandiwang נָתַתָּ at ng pektoral na tila sisidlan o bulsa, malinaw na ipinahihiwatig nito ang paglalagay sa loob.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: Ang mga ito ay mapapasa ibabaw ng puso ni Aaron
  rationale: Pinananatili ang kongkretong larawan ng mga bagay na nasa ibabaw ng puso ni Aaron at ang posibleng sagisag na kahulugan nito.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: kapag pumapasok siya sa harapan ni Yahweh
  rationale: Ipinahihiwatig ng “pumapasok” ang pagpasok ni Aaron sa banal na dako at paglapit niya sa presensiya ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וְנָשָׂא
  choice: dadalhin
  rationale: Ang “dadalhin” ay likas sa Filipino at maaaring tumukoy kapwa sa pisikal na pagdadala at sa kinatawang pananagutan ni Aaron.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: ang paghatol sa mga anak ni Israel
  rationale: Pinananatili ng “paghatol” ang ugnayang leksikal sa “pektoral ng paghatol”; ang “sa” ay natural na nagpapahayag na ang paghatol ay may kinalaman sa Israel nang hindi ipinahihiwatig na sila ang humatol.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang literal at nakaugaliang katawagang pangtipan sa Hebreo, habang nililinaw sa talababa na tumutukoy ito sa bayan ng Israel.
- source_word: עַל לִבּוֹ
  choice: sa ibabaw ng kanyang puso
  rationale: Inuulit nang pare-pareho ang pisikal at sagisag na larawan ng naunang parirala.
- source_word: תָּמִיד
  choice: nang palagi
  rationale: Ipinahahayag nito ang tuloy-tuloy o regular na tungkuling pansaserdote sa harapan ni Yahweh nang hindi kinakailangang mangahulugan ng walang patid na pisikal na kilos.
theological_decisions:
- issue: Kung isasalin ayon sa kahulugan o itatranslitera ang אוּרִים at תֻּמִּים
  choice: Transliterasyon bilang “Urim” at “Tummim”
  alternative: “mga liwanag” at “mga kasakdalan”
  rationale: Hindi tiyak ang anyo at tiyak na gamit ng mga ito, at ang pagsasaling etimolohikal ay maaaring magharap bilang tiyak ng isang pinagtatalunang paliwanag.
- issue: Kahulugan ng מִשְׁפָּט sa dalawang paglitaw nito
  choice: “paghatol” sa dalawang pagkakataon
  alternative: “pagpapasya” o “katarungan”
  rationale: Pinananatili nito ang leksikal na pag-uulit at ang diwa ng makapangyarihang pasya, nang hindi nililimitahan ang salita sa isang mekanismo o kahulugang hindi ganap na tiyak.
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: “mga anak ni Israel” sa pangunahing teksto
  alternative: “mga Israelita” o “bayan ng Israel”
  rationale: Pinananatili nito ang anyo ng Hebreo at ang nakaugaliang katawagang pangtipan; nililinaw ng talababa ang saklaw ng tinutukoy.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang teknikal ngunit pamilyar na “pektoral” para sa kasuotang pansaserdote, pinanatili ang pangalang “Yahweh,” at iniwasang ipaliwanag nang labis sa pangunahing teksto ang hindi tiyak na gamit ng Urim at Tummim.
