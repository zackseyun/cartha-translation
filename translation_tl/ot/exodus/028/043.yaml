  to: Dapat isuot nina Aaron at ng kanyang mga anak ang mga iyon kapag pumapasok sila sa tolda ng pagpupulong o kapag lumalapit sila sa altar upang maglingkod sa banal na lugar, upang hindi nila pasanin ang kasalanan[a] at mamatay. Ito ay magiging pangmatagalang tuntunin[b] para kay Aaron at sa kanyang mga supling sa mga susunod na salinlahi.
