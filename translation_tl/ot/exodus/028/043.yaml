  source_fidelity: 'Tumpak ang pangunahing diwa: ang tinutukoy ay ang mga kasuotang dapat isuot ni Aaron at ng kanyang mga anak sa pagpasok sa tolda ng pagpupulong o paglapit sa altar, upang hindi sila managot at mamatay. Gayunman, ang “palagiang tuntunin” ay maaaring mangahulugang regular o paulit-ulit, samantalang ang חֻקַּת עוֹלָם ay tumutukoy sa isang tuntuning may nagpapatuloy o pangmatagalang bisa.'
  naturalness: Malinaw at marangal ang karamihan ng salin. Mas natural at mas tiyak ang “sa kanyang mga supling sa mga susunod na salinlahi” kaysa “sa kanyang mga supling na susunod sa kanya,” na maaaring tunog literal na pagsunod sa isang tao.
  terminology: Ang “tolda ng pagpupulong,” “altar,” “banal na lugar,” at “pasanin ang kasalanan” ay angkop. Ang talababa sa [a] ay wastong nagpapaliwanag ng idyomang Hebreo. Pinalitan ang katawagang para sa חֻקַּת עוֹלָם upang hindi humina ang aspektong nagpapatuloy ng ordinansa.
  issues:
  - severity: medium
    issue: Ang “palagiang tuntunin” ay semantikong hindi sapat na tiyak para sa חֻקַּת עוֹלָם.
    rationale: Ang “palagian” ay karaniwang tumutukoy sa dalas o pag-uulit, hindi kinakailangang sa nagpapatuloy na bisa ng isang batas. Ang “pangmatagalang tuntunin” ay mas malapit sa legal na puwersa ng Hebreo nang hindi ipinipilit ang isang partikular na teolohikal na pagbasa ng עוֹלָם.
  - severity: low
    issue: Ang “mga supling na susunod sa kanya” ay bahagyang literal at malabo.
    rationale: Ang אַחֲרָיו ay tumutukoy sa mga inapo ni Aaron sa pagdaan ng mga salinlahi; mas malinaw ito sa “mga supling sa mga susunod na salinlahi.”
