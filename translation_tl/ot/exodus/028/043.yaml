base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: tl
  text: Dapat isuot nina Aaron at ng kanyang mga anak ang mga iyon kapag pumapasok sila sa tolda ng pagpupulong o kapag lumalapit sila sa altar upang maglingkod sa banal na lugar, upang hindi nila pasanin ang kasalanan[a] at mamatay. Ito ay magiging pangmatagalang tuntunin[b] para kay Aaron at sa kanyang mga supling sa mga susunod na salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “managot sa kasalanan”; ang literal na Hebreong idyoma ay “pasanin ang kasalanan.”
    reason: lexical_alternative
  - marker: b
    text: O “tuntuning magpakailanman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: Dapat isuot ... ang mga iyon
  rationale: Ang pangmaramihang pandiwa at pang-ukol ay tumutukoy sa mga kasuotang binanggit sa naunang talata. Natural sa modernong Tagalog ang aktibong anyong “isuot,” habang nananatili ang diwang nag-uutos ng legal na tagubilin.
- source_word: בְּבֹאָם
  choice: kapag pumapasok sila
  rationale: Ang infinitive construct na may ב at hulaping panghalip ay nagsasaad ng panahong kalagayan; malinaw at natural ang “kapag pumapasok sila.”
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Pinananatili nito ang literal na larawan ng tolda at ang kahulugan ng itinakdang pagpupulong, nang hindi gumagamit ng katawagang maaaring magpasok ng dagdag na interpretasyon.
- source_word: בְגִשְׁתָּם
  choice: kapag lumalapit sila
  rationale: Ang נגשׁ sa kontekstong pangpari ay tumutukoy sa paglapit upang magsagawa ng sagradong paglilingkod.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at malinaw na katawagan sa modernong Filipino para sa dambanang pinaghahandugan.
- source_word: לְשָׁרֵת
  choice: upang maglingkod
  rationale: Ang “maglingkod” ay likas sa Tagalog at sapat na naipahihiwatig ng konteksto ang sagradong paglilingkod ng mga pari.
- source_word: בַּקֹּדֶשׁ
  choice: sa banal na lugar
  rationale: Pinananatili nito ang tahasang wika ng kabanalan at hindi labis na nililimitahan ang tinutukoy sa isang teknikal na bahagi ng santuwaryo.
- source_word: וְלֹא יִשְׂאוּ עָוֺן
  choice: upang hindi nila pasanin ang kasalanan
  rationale: Pinananatili ang legal at panritwal na idyomang “pasanin ang kasalanan,” pati ang maaaring diwa ng pagkakasala at pananagutan.
- source_word: וָמֵתוּ
  choice: at mamatay
  rationale: Tuwirang pinananatili ang mabigat na bunga ng paglabag at ang pagkakaugnay nito sa naunang sugnay.
- source_word: חֻקַּת עוֹלָם
  choice: palagiang tuntunin
  rationale: Ipinahahayag nito ang tumatagal at patuloy na bisa ng kautusan sa natural na modernong Tagalog, habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: זַרְעוֹ
  choice: kanyang mga supling
  rationale: Ang “mga supling” ay natural na kolektibong katumbas ng זרע at tumutukoy sa mga inapo ni Aaron.
theological_decisions:
- issue: Ang bunga ng di-wastong paglapit ng mga pari
  choice: Ang itinakdang kasuotan ay kailangang suot nila upang hindi nila pasanin ang kasalanan at mamatay.
  alternative: “Upang hindi sila magkasala at mamatay” o “upang hindi sila managot at mamatay.”
  rationale: Pinananatili ng salin ang tunay na legal-panritwal na bigat ng Hebreong idyoma at ang tahasang parusang kamatayan, nang hindi pinahihina o ipinapaliwanag nang lampas sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Dapat isuot ... ang mga iyon” upang malinaw na maiugnay ang pangmaramihang Hebreo sa mga kasuotang binanggit sa naunang talata. Iniwasan ang masyadong teknikal o denominasyonal na pananalita.
