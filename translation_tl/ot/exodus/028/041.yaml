review_pass:
  verdict: revise
  source_fidelity: Ang “upang” ay nagdaragdag ng tahasang ugnayang layunin na wala sa Hebreo. Magkakaugnay ang mga utos, ngunit ang huling sugnay ay nagsasaad na “at maglilingkod sila sa akin bilang mga pari,” hindi “upang” gawin nila ito. Gayundin, ang “mga kasuotang ito” ay hindi ang layon ng pandiwang Hebreo; ang “sila,” na pagkatapos ay tinutukoy bilang si Aaron at ang kanyang mga anak, ang layon. Mas tumpak ang pandiwang “bihisan.”
  naturalness: Natural at marangal ang binagong Filipino. Ang “bihisan” ay tuwirang ginagamit para sa pagpapatakip ng kasuotan sa mga tao, at ang magkakasunod na “at” ay angkop sa ritwal at pormal na rehistro ng talata.
  terminology: Pinananatili ang “pari,” “pahiran ... ng langis,” at “pabanalin” bilang malinaw at karaniwang mga terminong panritwal. Ang “italaga sila sa tungkulin” ay isang ligtas na idyomatikong salin ng Hebreong “punuin ang kanilang mga kamay,” na ipinaliliwanag sa talababa nang walang pagpapataw ng denominasyonal na kahulugan.
  issues:
  - severity: medium
    issue: Ang “Isusuot mo ... ang mga kasuotang ito” ay inililipat ang layon ng pandiwang mula sa mga tao tungo sa mga kasuotan.
    rationale: Ang אֹתָם ay tumutukoy kina Aaron at sa kanyang mga anak. Bagaman ipinahihiwatig ng konteksto ang mga kasuotang pangpari, ang Hebreo ay nagsasabing bihisan sila.
  - severity: medium
    issue: Ang “upang makapaglingkod sila” ay nagpapahayag ng layunin sa halip na ang kasunod na pahayag na nasa Hebreo.
    rationale: Ang וְכִהֲנוּ לִי ay nakaugnay sa naunang mga pandiwa sa pamamagitan ng “at”; hindi kailangan ang pangatnig na “upang.”
  - severity: low
    issue: Mas tumpak na anyo sa literal na talababa ang “Punuin mo ang kanilang mga kamay.”
    rationale: Inilalapit nito ang talababa sa anyong pautos/panghinaharap na gamit sa pangunahing salin at hindi nito ipinapalit ang isang hiwalay na aspekto.
