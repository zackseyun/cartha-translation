base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: tl
  text: Bihisan mo si Aaron na kapatid mo at ang kanyang mga anak na kasama niya. Pahiran mo sila ng langis, italaga mo sila sa tungkulin[a], at pabanalin mo sila, at maglilingkod sila sa akin bilang mga pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Punuin mo ang kanilang mga kamay,” isang idyomang Hebreo para sa pormal na pagtatalaga sa paglilingkod bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Isusuot mo ... ang mga kasuotang ito
  rationale: Ang Hiphil ng לבשׁ ay causative, kaya ipinahihiwatig na ipasuot ni Moises ang mga kasuotang inilalarawan sa konteksto. Nilinaw sa Tagalog ang likas na ipinahihiwatig na layon.
- source_word: אֹתָם ... אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: kay Aaron na iyong kapatid at sa kanyang mga anak na kasama niya
  rationale: Tinutukoy ng kasunod na parirala ang naunang panghalip. Natural sa Tagalog na tuwirang pangalanan ang mga tatanggap; ang “kasama niya” ay nagpapanatili sa אִתּוֹ.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Papahiran mo sila ng langis
  rationale: Sa ritwal na konteksto, ang משׁח ay pagpapahid ng langis. Mas malinaw ito sa karaniwang mambabasa kaysa sa “hihirangin,” na mawawala ang pisikal na ritwal.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: itatalaga sila sa tungkulin
  rationale: Ang literal na “pupunuin ang kanilang kamay” ay isang idyomang Hebreo para sa pormal na paglalagay sa katungkulang pari. Ang salin ay naghahatid ng tungkulin nang hindi nag-aangkat ng partikular na makabagong seremonya ng ordinasyon.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: ibubukod sila bilang banal
  rationale: Ang קדשׁ dito ay pagtatalaga o pagbubukod para sa banal na paglilingkod. Pinananatili ng parirala kapwa ang pagbubukod at kabanalan.
- source_word: וְכִהֲנוּ לִי
  choice: makapaglingkod sila sa akin bilang mga pari
  rationale: Ang Piel ng כהן ay nangangahulugang gumanap o maglingkod bilang pari; pinananatili rin ng “sa akin” ang לִי.
theological_decisions:
- issue: Ang idyomang pantatalaga sa pagkapari na מִלֵּא אֶת־יָד
  choice: itatalaga sila sa tungkulin
  alternative: pupunuin mo ang kanilang mga kamay
  rationale: Ang pangunahing teksto ay gumagamit ng malinaw na kahulugang pangkonteksto, habang itinatala sa talababa ang literal na anyo upang manatiling lantad ang idyomang Hebreo at maiwasang ikabit ito sa isang partikular na tradisyong denominasyonal.
- issue: Ugnayan ng pagpapabanal at paglilingkod bilang pari
  choice: ibubukod sila bilang banal, upang makapaglingkod sila sa akin bilang mga pari
  alternative: pabanalin sila, at maglilingkod sila sa akin bilang mga pari
  rationale: Ang “upang” ay natural na naghahayag ng layuning malinaw sa pagkakasunod ng mga utos at sa konteksto, nang hindi ginagawang hiwalay na doktrinal na pahayag ang ritwal.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “pari” at “ibubukod bilang banal” bilang malinaw na mga katawagang panritwal, at iniwasan ang mga salitang maaaring magpahiwatig ng natatanging doktrinang denominasyonal.
