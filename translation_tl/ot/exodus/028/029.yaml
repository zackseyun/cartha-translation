revisions:
- from: Dadalhin ni Aaron[a] ang mga pangalan ng mga anak ni Israel[b] sa kasuutang pandibdib ng paghatol[c], sa tapat ng kanyang puso, kapag pumapasok siya sa Banal na Lugar, bilang palagiang paalaala sa harap ni Yahweh.[d]
  to: Dadalhin ni Aaron[a] ang mga pangalan ng mga anak ni Israel[b] sa kasuutang pandibdib ng paghatol[c], sa ibabaw ng kanyang puso, tuwing papasok siya sa Banal na Lugar, bilang palagiang paalaala sa harap ni Yahweh.[d]
  rationale: 'Ginawa lamang ang mga ligtas na pagbabago para sa katumpakan at likas na Tagalog: itinuwid ang maling pandiwang alternatibo sa talababa a, ginawang “sa ibabaw ng kanyang puso” ang spatial na parirala, at ginawang “tuwing papasok siya” ang temporal na sugnay. Hindi binago ang kahulugan ng talata o nilinaw nang lampas sa teksto ang tungkulin ng alaala.'
