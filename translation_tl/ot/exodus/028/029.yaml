id: EXO.28.29
reference: Exodus 28:29
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: tl
  text: Dadalhin ni Aaron[a] ang mga pangalan ng mga anak ni Israel[b] sa kasuutang pandibdib ng paghatol[c], sa ibabaw ng kanyang puso, tuwing papasok siya sa Banal na Lugar, bilang palagiang paalaala sa harap ni Yahweh.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Magpapasan si Aaron.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel”; isa itong genealogical na pananalitang tumutukoy sa mga liping nagmula kay Israel.
    reason: lexical_clarification
  - marker: c
    text: Maaari ring isalin na “kasuutang pandibdib para sa pagpapasya.” Ang titulong Hebreo ay tumutukoy sa kagamitang pansaserdote na kaugnay ng paghatol o pagpapasya sa harap ng Diyos.
    reason: alternative_reading
  - marker: d
    text: Maaari ring unawain na “upang laging maalaala sa harap ni Yahweh.” Hindi tahasang sinasabi ng Hebreo kung sino ang umaalaala.
    reason: ambiguity
lexical_decisions:
- source_word: וְנָשָׂא
  choice: Dadalhin
  rationale: Ang נָשָׂא ay nangangahulugang “dalhin” o “pasanin.” Ang “dadalhin” ay natural sa makabagong Tagalog at pinananatili ang konkretong larawan ng pagdadala ni Aaron sa mga pangalan habang naglilingkod.
- source_word: שְׁמוֹת
  choice: ang mga pangalan
  rationale: Tuwirang isinasalin ang pangmaramihang anyo; ang tinutukoy ay ang mga pangalang nakaukit, hindi lamang ang mga lipi bilang abstraktong pangkat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang genealogical na anyo ng Hebreo at malinaw pa rin sa Tagalog na tumutukoy ito sa mga liping nagmula kay Israel.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: sa kasuutang pandibdib ng paghatol
  rationale: Ang חֹשֶׁן ay natatanging kagamitang pansaserdote na isinusuot sa dibdib. Pinananatili ng “ng paghatol” ang malawak na kahulugan ng מִשְׁפָּט nang hindi nagpapasiya kung “paghatol” o “pagpapasya” ang eksaktong diin.
- source_word: עַל לִבּוֹ
  choice: sa tapat ng kanyang puso
  rationale: Natural itong paglalarawan sa Tagalog ng kinalalagyan ng kasuutang pandibdib, habang pinananatili ang simbolikong larawan ng pagdadala sa mga pangalan malapit sa puso.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: kapag pumapasok siya sa Banal na Lugar
  rationale: Ipinahahayag ng parirala ang panahon ng pagkilos. Sa konteksto ng tabernakulo, ang הַקֹּדֶשׁ ay tumutukoy sa sagradong lugar na pinapasukan ng pari.
- source_word: לְזִכָּרוֹן
  choice: bilang ... paalaala
  rationale: Ipinakikita ng לְ ang layunin o tungkulin ng bagay bilang isang memorial o paalaala sa harap ng Diyos.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Natural na katumbas ito ng idyomang nangangahulugang nasa harap o presensya ni YHWH.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang Yahweh upang katawanin ang tetragrammaton sa tekstong Hebreo.
- source_word: תָּמִיד
  choice: palagiang
  rationale: Ipinahahayag nito ang nagpapatuloy o regular na katangian ng paalaala sa konteksto ng gawaing pansamba.
theological_decisions:
- issue: Kahulugan ng titulong חֹשֶׁן הַמִּשְׁפָּט
  choice: kasuutang pandibdib ng paghatol
  alternative: kasuutang pandibdib para sa pagpapasya
  rationale: Ang pormal na “ng paghatol” ay nagpapanatili sa ugnayan ng bagay sa paghatol o pagpapasya sa harap ng Diyos, nang hindi nililimitahan ang kahulugan sa iisang paliwanag.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang genealogical na pananalita ng Hebreo; sa konteksto, kumakatawan ang mga pangalan sa mga liping nagmula kay Israel.
- issue: Tinutukoy ng הַקֹּדֶשׁ
  choice: Banal na Lugar
  alternative: santuwaryo
  rationale: Sa kontekstong pansaserdote, tumutukoy ito sa sagradong espasyo ng tabernakulo. Hindi nito nilulutas nang higit sa teksto ang lahat ng tanong tungkol sa eksaktong hangganan ng lugar.
- issue: Tungkulin ng לְזִכָּרוֹן לִפְנֵי יְהוָה
  choice: bilang palagiang paalaala sa harap ni Yahweh
  alternative: upang laging maalaala sa harap ni Yahweh
  rationale: Pinananatili ng “paalaala” ang ritwal at teolohikal na diin nang hindi tahasang tinutukoy kung sino ang inaasahang umaalaala.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “kasuutang pandibdib” sa halip na teknikal at di-gaanong pamilyar na “pektoral.” Ginamit ang “kanyang” ayon sa karaniwang modernong baybay, at pinanatili ang “Yahweh” bilang personal na pangalan sa Hebreo.
