    issue: Hindi wastong anyo ng alternatibo sa talababa a
    rationale: Ang “Pasanin ni Aaron” ay karaniwang nangangahulugang ‘ang pasanin ni Aaron,’ hindi ‘si Aaron ay magdadala/magpapasan.’ Dapat itong maging pandiwang alternatibo na umaayon sa sugnay, gaya ng “Magpapasan si Aaron.”
  - severity: low
    issue: Mas malapit na pagsasalin ng עַל לִבּוֹ
    rationale: Ang “sa tapat ng kanyang puso” ay maaaring tumukoy lamang sa harapang bahagi ng katawan. Ang “sa ibabaw ng kanyang puso” ay tuwirang naghahayag ng posisyong ipinapakita ng Hebreo.
  - severity: low
    issue: Aspekto ng “kapag pumapasok siya”
    rationale: Sa loob ng panghinaharap na sugnay at sa kontekstong regular na ritwal, ang “tuwing papasok siya” ay mas idiomatiko at malinaw na naghahayag ng paulit-ulit na pagkakataon.
