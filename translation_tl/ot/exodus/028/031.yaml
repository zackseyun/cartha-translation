lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawin mo
  rationale: Ang Qal perfect na may prefixed conjunction sa sunod-sunod na tagubilin ay nagpapahayag ng utos. Likas sa modernong Tagalog ang anyong panghinaharap na “Gagawin mo” para sa marangal at legal na tagubilin.
- source_word: מְעִיל
  choice: balabal
  rationale: Tumutukoy ito sa kasuotang kaugnay ng mga kasuotang pangpari. Malinaw at karaniwang salin ang “balabal,” nang hindi gumagamit ng makalumang katawagan.
- source_word: הָאֵפֹד
  choice: ng efod
  rationale: Teknikal na katawagan ang efod para sa kasuotang pangpari, kaya tinumbasan ito sa paraang transliterado sa halip na bigyan ng di-tiyak na paglalarawan. Ipinahihiwatig ng construct phrase ang balabal na kaugnay ng efod.
- source_word: כְּלִיל
  choice: pawang
  rationale: Ipinapahayag nito ang kabuuan o pagiging lubos. Ang “pawang asul” ay maikli, natural, at pinananatili ang posibilidad na ang buong balabal o materyal nito ang tinutukoy.
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Tumutukoy ang salita sa mamahaling materyal na tinina sa kulay na nasa saklaw ng asul hanggang asul-lila. “Asul” ang pinakamalinaw at madaling maunawaang pangunahing salin; ipinaliliwanag sa talababa ang kulay at materyal na nuances.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at malinaw. Pinanatili ang “efod” bilang teknikal na katawagan sa kasuotang pangpari. Ginamit ang “pawang asul” upang maging likas ang pangungusap habang hindi inaalis ang bahagyang kalabuan kung kulay lamang o ang buong tinang materyal ang binibigyang-diin.
