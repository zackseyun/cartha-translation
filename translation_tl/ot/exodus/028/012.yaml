  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: tl
  text: At ilalagay mo ang dalawang bato sa mga bahagi sa balikat ng efod bilang mga batong pang-alaala para sa mga anak na lalaki ni Israel[a]. Dadalhin ni Aaron ang kanilang mga pangalan sa harap ni Yahweh, sa kanyang dalawang balikat, bilang alaala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni Israel”; isang pampamilyang pahayag na karaniwang tumutukoy sa buong bayan ng Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: At ilalagay mo
  rationale: Tuwirang ipinapahayag ang ikalawang panauhang panlalaking isahan at ang iniutos na paglalagay; natural ito sa makabagong Filipino.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: ang dalawang bato
  rationale: Pinananatili ang tiyak na pagtukoy sa dalawang batong nabanggit na sa konteksto, nang hindi inuulit ang uri ng bato na wala sa talatang ito.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: mga balikatang bahagi ng efod
  rationale: Sa konteksto ng kasuotang pansaserdote, tumutukoy ito sa mga bahaging nakapatong o nakakabit sa balikat, hindi sa literal na mga balikat ng tao.
- source_word: אַבְנֵי זִכָּרֹן
  choice: mga batong paalaala
  rationale: Likas na Filipino para sa mga batong nagsisilbing alaala o tanda, at pinananatili ang ugnayang leksikal sa panghuling לְזִכָּרֹן.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: para sa mga anak ni Israel
  rationale: Pinananatili ang pampamilyang pahayag ng Hebreo; sa konteksto, saklaw nito ang bayang nagmula kay Israel.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Dadalhin ni Aaron ang kanilang mga pangalan
  rationale: Ang 'dadalhin' ay malinaw at natural na katumbas ng konkretong pagdadala ni Aaron sa mga pangalang nakaukit sa mga bato.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang diwa ng pagharap o pagiging nasa presensiya ng Diyos at isinasalin ang banal na pangalan bilang Yahweh.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: sa kanyang dalawang balikat
  rationale: Tumutukoy ito sa sariling mga balikat ni Aaron at pinananatili ang tahasang bilang na dalawa.
- source_word: לְזִכָּרֹן
  choice: bilang paalaala
  rationale: Ipinapahayag ang layunin nang hindi tinutukoy kung kaninong pag-alaala ang pangunahing nasa isip, kaya napapanatili ang ambiguwidad ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang ginagamit ng tekstong Hebreo ang Tetragrammaton; ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalang tipan.
- issue: Saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: bayang Israel; mga Israelita
  rationale: Pinananatili ang pampamilyang anyo ng orihinal habang ipinapaliwanag sa talababa na maaari itong tumukoy sa buong bayan, hindi lamang sa mga lalaking anak.
- issue: Tinutukoy na tagapag-alaala sa לְזִכָּרֹן
  choice: bilang paalaala
  alternative: upang alalahanin sila ni Yahweh; bilang alaala sa harap ni Yahweh
  rationale: Hindi tahasang sinasabi ng Hebreo kung sino ang umaalaala; iniingatan ng salin ang tunay na ambiguwidad sa halip na ipasya ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang teknikal ngunit mauunawaang pariralang “mga balikatang bahagi” upang maiba ang mga bahagi ng efod sa literal na dalawang balikat ni Aaron. Ang “efod” ay pinanatiling transliterasyon bilang pangalan ng natatanging kasuotang pansaserdote.
