base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: tl
  text: Itatali nila ang pektoral sa pamamagitan ng mga singsing nito sa mga singsing ng efod gamit ang isang panaling sinulid na kulay asul[a], upang ito ay nasa ibabaw ng hinabing pamigkis ng efod, at hindi maaalis ang pektoral mula sa efod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gamit ang isang asul na panali.” Ang salitang Hebreo ay tumutukoy sa materyal na tinina ng asul na ginagamit sa tabernakulo at sa mga kasuotang pangsaserdote.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: Itatali nila
  rationale: Ipinahihiwatig ng pandiwa ang mahigpit na pagkakabit ng dalawang bahagi; natural ang “itatali” sa konteksto ng mga singsing at panali.
- source_word: הַחֹשֶׁן
  choice: ang pektoral
  rationale: Tumutukoy ito sa natatanging kasuotang pansaserdote na nakakabit sa dibdib, hindi sa baluting pandigma. Ang “pektoral” ay maikli at kinikilalang katawagan sa kasuotang ito.
- source_word: מִטַּבְּעֹתָיו
  choice: sa pamamagitan ng mga singsing nito
  rationale: Ipinakikita ng מִן ang pinagmumulan o punto ng pagkakabit; malinaw na ipinahahayag ng parirala na ginagamit ang sariling mga singsing ng pektoral.
- source_word: טַבְּעֹת הָאֵפֹד
  choice: mga singsing ng efod
  rationale: Tuwirang inililipat ang ugnayang construct at pinananatili ang teknikal na katawagang “efod.”
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: gamit ang isang panaling sinulid na asul
  rationale: Ang פְּתִיל ay sinulid o panali, samantalang ang תְּכֵלֶת ay asul na tinang materyal. Iniiwasan ng salin na ipalagay na kulay lamang, sa halip na materyal, ang tinutukoy.
- source_word: לִהְיוֹת עַל
  choice: upang manatili ito sa
  rationale: Ang infinitive ay nagpapahayag ng layunin. Ang “manatili” ay natural sa Filipino at akma sa layuning panatilihin ang pektoral sa tamang puwesto, bagaman literal na “upang ito ay nasa.”
- source_word: חֵשֶׁב הָאֵפֹד
  choice: hinabing sinturon ng efod
  rationale: Sa kontekstong ito, ang חֵשֶׁב ay ang hinabing bandang nagsisilbing sinturon ng efod. Hindi idinagdag ang “mahusay ang pagkakahabi” sapagkat wala rito ang hiwalay na salitang tahasang nagsasaad niyon.
- source_word: וְלֹא יִזַּח
  choice: hindi mahiwalay
  rationale: Ang anyong Niphal ay nagsasaad na hindi dapat maalis o malipat ang pektoral mula sa efod. Ang “mahiwalay” ay malinaw at angkop sa pagkakabit ng kasuotan.
- source_word: מֵעַל הָאֵפֹד
  choice: sa efod
  rationale: Kasama ng “mahiwalay,” natural na ipinapahayag ng “sa efod” ang paglayo mula sa kinalalagyan nito sa ibabaw ng efod.
theological_decisions: []
translation_notes:
  register: Makabagong, marangal, at madaling maunawaang Filipino. Pinanatili ang mga teknikal na katawagang “pektoral” at “efod,” habang nilinaw sa konteksto ang paraan at layunin ng pagkakabit.
