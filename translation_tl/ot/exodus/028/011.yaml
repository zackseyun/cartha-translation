  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: tl
  text: Gaya ng gawa ng isang tagaukit ng bato, gaya ng mga ukit ng isang pantatak[a], iukit mo sa dalawang bato ang mga pangalan ng mga anak na lalaki ni Israel[b]. Gawin mong nakapaloob ang mga ito sa mga enggaste na ginto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ukit ng isang selyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki ni Israel”; tumutukoy ito sa labindalawang anak ni Israel na pinagmulan ng mga lipi, na ang mga pangalan ay iniukit sa mga bato.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: Gaya ng gawa ng isang tagaukit ng bato
  rationale: Ipinahahayag nito ang paraan o pamantayan ng pagkakagawa habang pinananatili ang pagtukoy sa bihasang manggagawang umuukit sa bato.
- source_word: פִּתּוּחֵי חֹתָם
  choice: mga ukit sa isang pantatak
  rationale: Ang חֹתָם ay isang pantatak o seal na may nakaukit na disenyo; natural sa Tagalog ang pariralang ito at hindi nito labis na tinutukoy ang anyo ng sinaunang bagay.
- source_word: תְּפַתַּח
  choice: iukit mo
  rationale: Sa konteksto ng paglalagay ng mga pangalan sa mahahalagang bato, ang “iukit” ang pinakatumpak at likas na pandiwa.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: dalawang bato
  rationale: Pinananatili ang payak na salitang “bato” ng Hebreo sa halip na gawing mas tiyak na “hiyas.”
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: sa dalawang bato ang mga pangalan ng mga anak na lalaki ni Israel
  rationale: Likas sa Tagalog ang ayos na ito para ipakita kung ano ang iuukit at kung saan ito iuukit; pinananatili rin ang panlalaking katawagang pangkamag-anakan ng Hebreo.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: nakapaloob ... sa mga enggasteng ginto
  rationale: Ipinahihiwatig ng passive participle na napalilibutan o nakalagay ang mga bato sa gintong mounting; ang “enggaste” ang tiyak at karaniwang terminong gamit sa alahas.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Gawin mong ... ang mga ito
  rationale: Tuwirang pinananatili ang utos na hubugin o ihanda ang mga bato sa inilalarawang kalagayan.
theological_decisions:
- issue: Ang panlalaking katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  alternative: mga anak ni Israel
  rationale: Tumutukoy ang konteksto sa mga lalaking anak ni Israel na pinagmulan ng mga lipi at ang kanilang mga pangalan ang iuukit. Pinananatili ng salin ang tiyak na panlalaking diwa nang hindi ginagawang “mga Israelita,” na maaaring magpalawak sa reperensiya.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pantatak” sa pangunahing teksto bilang madaling maunawaang katumbas ng sinaunang seal/signet, at “enggaste” bilang tiyak na terminong pang-alahas. Pinanatili ang pag-uulit ng ideya ng pag-ukit at ang panlalaking katawagang pampamilya ng pinagmulang Hebreo.
