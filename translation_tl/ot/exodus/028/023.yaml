translation_notes:
  register: Makabagong Filipino na tuwiran at marangal ang ginamit. Pinili ang “argolya” upang malinaw na mga singsing na pangkabit ang tinutukoy, at “pektoral” bilang maikli at kilalang katawagan sa kasuotang pansaserdote.
