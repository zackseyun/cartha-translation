  yaml_path: translation/ot/exodus/028/023.yaml
  text: You shall make two gold rings on the breastpiece[b][a], and put the two rings on the two ends of the breastpiece.
translation:
  language: tl
  text: Gumawa ka ng dalawang gintong argolya sa pektoral, at ilagay mo ang dalawang argolya sa dalawang dulo ng pektoral.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa magkabilang dulo ng pektoral.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang Qal perfect na may pang-ugnay sa sunod-sunod na tagubilin ay may puwersa ng utos. Likas at tuwiran sa modernong Filipino ang “Gumawa ka.”
- source_word: הַחֹשֶׁן
  choice: pektoral
  rationale: Tumutukoy ito sa natatanging kasuotang nakakabit sa dibdib ng punong pari. Ang “pektoral” ay maikli, marangal, at hindi nagdaragdag ng “ng paghatol,” na wala sa talatang ito.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: dalawang gintong argolya
  rationale: Ang טַבַּעַת dito ay singsing na pangkabit, kaya mas tiyak ang “argolya” kaysa “singsing,” na karaniwang nauunawaan bilang alahas sa daliri. Natural na ipinahahayag ng “gintong” ang materyal.
- source_word: וְנָתַתָּ
  choice: at ilagay mo
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pisikal na paglalagay. Pinananatili ng “ilagay” ang simple at pamamaraang tono ng tagubilin.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: sa dalawang dulo ng pektoral
  rationale: Ang קָצֶה ay “dulo” o “gilid na hangganan.” Tuwirang sinusundan ng salin ang pagbanggit sa dalawang dulo nang hindi nagpapalagay kung alin ang mga ito.
