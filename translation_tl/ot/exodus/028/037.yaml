  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: tl
  text: At ilagay mo ito sa isang asul na pisi[a], at ito ay dapat nasa turbante; dapat itong nasa harapan ng turbante.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “asul na tali” o “asul na sinulid.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “patungo sa/tapat ng harapan ng turbante,” na tumutukoy sa harapang bahagi nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: At itali mo ito
  rationale: Bagaman karaniwang nangangahulugang ‘ilagay’ ang שׂים, ang kasunod na עַל פְּתִיל ay nagpapahiwatig dito ng pagkakabit sa pamamagitan ng panali. Ang ‘itali’ ay natural sa Filipino at malinaw ang praktikal na ugnayan, nang hindi isinasantabi ang diwang paglalagay.
- source_word: פְּתִיל
  choice: panali
  rationale: Tumutukoy ang פְּתִיל sa pisi, sinulid, o panaling ginagamit sa pagkakabit. Ang ‘panali’ ay likas at sapat na malawak sa modernong Filipino; inilalagay sa talababa ang ibang posibleng anyo.
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Ang תְּכֵלֶת ay mamahaling kulay o telang asul na ginagamit sa tabernakulo. ‘Asul’ ang pinakakaraniwan at malinaw na salin, habang hindi tiyak ang mas eksaktong antas ng kulay.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: at ilagay ito sa turbante
  rationale: Ang מִצְנֶפֶת ay ang nakabalot na putong sa ulo ng punong pari. Ang ‘turbante’ ang maikli at kinikilalang katawagan; ginawang tuwirang utos ang sugnay upang maging natural sa Filipino habang pinananatili ang hinihinging lokasyon.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת יִהְיֶה
  choice: dapat itong nasa harapan ng turbante
  rationale: Ipinahihiwatig ng אֶל מוּל פְּנֵי ang pagkakaharap o pagkakalagay sa harapang bahagi. Ang ‘nasa harapan’ ay malinaw sa Filipino, at ang ‘dapat’ ay naghahatid ng normatibong lakas ng imperfect sa tagubiling ito.
