translation:
  language: tl
  text: Gumawa ka ng dalawang gintong singsing at ilagay mo ang mga ito sa dalawang dulo ng pektoral, sa gilid nito na nakaharap sa panloob na bahagi ng epod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa gilid nito na nakaharap paloob sa epod.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubilin ay may puwersang pautos; natural at tuwiran sa modernong Tagalog ang “Gumawa ka.”
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: dalawang singsing na ginto
  rationale: Malinaw na ipinahahayag ang bilang, bagay, at materyal sa likas na ayos ng Tagalog.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: at ikabit mo ang mga ito
  rationale: Bagaman karaniwang nangangahulugang “ilagay” ang שׂים, ipinakikita ng konteksto ng mga singsing sa kasuotan na ang layunin ay ikabit ang mga ito; “ikabit” ang mas eksaktong likas na salita sa Tagalog.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: sa dalawang dulo ng pektoral
  rationale: Ang קצה ay “dulo” o “pinakadulo.” Ginamit ang “pektoral” para sa espesyal na kasuotang חֹשֶׁן ng punong pari, nang hindi ito napagkakamalang karaniwang baluti sa dibdib.
- source_word: עַל שְׂפָתוֹ
  choice: sa laylayan nito
  rationale: Ang שׂפה ay maaaring labi, gilid, o hangganan. Sa konteksto ng telang kasuotan, natural at tiyak ang “laylayan,” bagaman posible rin ang “gilid.”
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: na nakaharap paloob sa epod
  rationale: Pinagsasama nito ang ideya ng bahaging nakaharap sa epod at ang direksiyong paloob, habang pinananatili ang maigsi ngunit bahagyang masalimuot na ugnayang spatial ng Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang mga teknikal na katawagang “pektoral” at “epod” para sa natatanging kasuotang saserdotal. Walang talababa dahil maisasalin nang maikli sa pangunahing teksto ang spatial na parirala nang hindi kinakailangang magtakda ng alternatibong interpretasyon.
