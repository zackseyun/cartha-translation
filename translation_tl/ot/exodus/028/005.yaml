translation:
  language: tl
  text: At kukunin nila ang ginto, ang sinulid na asul, ang sinulid na kulay-ube[a], ang sinulid na iskarlata[b], at ang pinong lino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang asul” at “ang kulay-ube”; ang mga salitang Hebreo ay maaaring tumukoy sa tininaang materyal na pantela, hindi lamang sa mga kulay.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “iskarlata ng uod,” isang idyoma para sa materyal na kinulayan ng pulang tina mula sa isang uri ng insekto; kaya “sinulid na iskarlata.”
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: At ... nila
  rationale: Pinananatili ang tahasang pangmaramihang simuno ng Hebreo sa natural na ayos ng pangungusap sa Tagalog.
- source_word: יִקְחוּ
  choice: kukunin
  rationale: Ang anyong di-ganap ay may puwersang tagubilin sa konteksto; natural na naihahatid ito ng panghinaharap na 'kukunin' sa serye ng mga utos.
- source_word: הַזָּהָב
  choice: ang ginto
  rationale: Tuwirang tumutukoy sa itinakdang materyal at pinananatili ang tiyak na pantukoy.
- source_word: הַתְּכֵלֶת
  choice: ang sinulid na asul
  rationale: Ang termino ay tumutukoy sa tininaang materyal na pantela, hindi lamang sa abstraktong kulay; ang 'sinulid' ay angkop sa paggawa ng kasuotang inilalarawan.
- source_word: הָאַרְגָּמָן
  choice: ang sinulid na kulay-ube
  rationale: Inihahayag ang tininaang materyal at gumagamit ng karaniwan at malinaw na modernong katawagan sa kulay.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: ang sinulid na iskarlata
  rationale: Ang idyoma ay tumutukoy sa matingkad na pulang materyal na tinina mula sa insektong ginagamit bilang pangkulay; malinaw sa konteksto ang 'sinulid na iskarlata.'
- source_word: הַשֵּׁשׁ
  choice: ang pinong lino
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang termino sa de-kalidad na pinong lino.
