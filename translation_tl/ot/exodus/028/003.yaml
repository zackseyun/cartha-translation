base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: tl
  text: At kausapin mo ang lahat ng may pusong marunong[a], na pinuspos ko ng espiritu ng karunungan[b], at gawin nila ang mga kasuotan ni Aaron upang italaga siya upang maglingkod sa akin bilang pari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “marurunong ang puso.” Isa itong Hebreong idyoma para sa mga pinagkalooban ng karunungan, pang-unawa, at kasanayan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “Espiritu ng karunungan.” Maaaring tumukoy ang Hebreo sa isang espiritu o disposisyon ng karunungang kaloob ng Diyos; hindi higit na tinutukoy ng pangunahing teksto kaysa sa hinihingi ng pananalita.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: kausapin mo
  rationale: Ang Piel imperfect sa konteksto ng tagubilin ay may puwersang pautos. Natural at tuwiran sa makabagong Tagalog ang “kausapin mo.”
- source_word: חַכְמֵי לֵב
  choice: mga may pusong marunong
  rationale: Pinananatili nito ang Hebreong idyoma na inuugnay ang karunungan at kasanayan sa puso bilang luklukan ng pag-unawa, sa halip na paliitin ang kahulugan sa mga bihasang manggagawa lamang.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: na pinuspos ko ng espiritu ng karunungan
  rationale: Pinananatili ng “pinuspos” ang larawan ng מלא, at ng maliit-na-titik na “espiritu” ang tunay na kalabuan kung tumutukoy ito sa kaloob na disposisyon o sa Espiritu ng Diyos.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: mga kasuotan ni Aaron
  rationale: Tuwirang salin ng pariralang konstrukt; hindi idinagdag ang “pampari” sapagkat hindi iyon tahasang nasa parirala.
- source_word: לְקַדְּשׁוֹ
  choice: upang italaga siya
  rationale: Sa kontekstong pangpari, ang קדשׁ ay tumutukoy sa pagbubukod o pagtatalaga sa banal na tungkulin. Mas natural dito ang “italaga” kaysa “pabanalin.”
- source_word: לְכַהֲנוֹ לִי
  choice: na maglingkod sa akin bilang pari
  rationale: Ipinahahayag nito ang pandiwang kahulugan ng כהן—gumanap o maglingkod bilang pari—at pinananatili ang לִי bilang paglilingkod sa Diyos.
- source_word: וְעָשׂוּ
  choice: Gawin nila
  rationale: Ang anyong ito sa sunod-sunod na tagubilin ay may pautos na bisa; malinaw at natural itong naihahayag ng Tagalog na pakiusap/pautos na may “nila.”
theological_decisions:
- issue: Kung ang רוּחַ חָכְמָה ay tahasang tumutukoy sa Banal na Espiritu
  choice: espiritu ng karunungan
  alternative: Espiritu ng karunungan
  rationale: Walang pantukoy ang רוּחַ sa Hebreo, at maaaring tumukoy ang parirala sa espiritu o disposisyong kaloob ng Diyos para sa karunungan at kasanayan. Hindi ginagawang tahasang trinitaryong titulo ang hindi tiyak sa mismong anyo ng teksto.
- issue: Ugnayan ng pagtatalaga at paglilingkod bilang pari
  choice: upang italaga siya na maglingkod sa akin bilang pari
  alternative: upang italaga siya, upang maglingkod siya sa akin bilang pari
  rationale: 'Ang dalawang infinitive ay nagsasaad ng magkaugnay na layunin: ang pagtatalaga kay Aaron ay nakatuon sa paglilingkod niya bilang pari. Pinananatili ang ugnayang ito nang hindi ipinapalagay ang higit pa sa teksto.'
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang metapora ng puso at ang kalabuan ng “espiritu ng karunungan,” habang iniwasan ang sobrang teknikal na wikang panrelihiyon.
