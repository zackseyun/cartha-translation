translation_notes:
  register: Makabago at marangal na Filipino; pinanatili ang anyong parirala ng talata dahil karugtong ito ng naunang utos. Ginamit ang “ikalawang” sa halip na “pangalawang” bilang mas angkop sa pormal na tekstong pampanitikan.
