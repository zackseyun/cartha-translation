translation:
  language: tl
  text: anim sa kanilang mga pangalan sa isang bato, at ang mga pangalan ng anim na natitira sa ikalawang bato, ayon sa pagkakasunod-sunod ng kapanganakan nila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ayon sa kanilang salinlahi.” Ang salitang Hebreo ay maaaring tumukoy sa pinagmulang angkan o sa pagkakasunod-sunod na nagmumula rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: anim sa kanilang mga pangalan
  rationale: Ang partitive na מִן ay nagsasaad na anim na pangalan ang kukunin mula sa kabuuang bilang; natural itong ipinahahayag sa Tagalog sa pamamagitan ng “anim sa.”
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: sa isang bato
  rationale: Ang עַל ay tumutukoy sa kinalalagyan ng ukit, at ang הָאֶחָת ay literal na “ang isa,” na ikinokontra sa “ikalawang bato.” Ang “sa isang bato” ay natural at hindi tahasang ginagawang ordinal na “una” ang bilang.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: ang anim na natitira
  rationale: Tuwirang pinananatili ng “natitira” ang diwa ng נוֹתָרִים bilang mga nalalabi mula sa kabuuang pangkat.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: sa ikalawang bato
  rationale: Ang הַשֵּׁנִית ay malinaw na ordinal na “ikalawa”; ang “sa” ang likas na gamit sa Tagalog para sa pangalang nakaukit sa ibabaw ng bato.
- source_word: כְּתוֹלְדֹתָם
  choice: ayon sa pagkakasunod-sunod ng kanilang kapanganakan
  rationale: Bagaman maaaring tumukoy ang תּוֹלְדוֹת sa salinlahi o talaangkanan, sa konteksto ng paghahanay sa mga pangalan ng mga anak ni Israel, ang ipinahihiwatig ay ang ayos ng kanilang kapanganakan. Inilalahad sa talababa ang mas literal na saklaw ng salita.
