  naturalness: Marangal at malinaw ang kabuuang Tagalog. Mas natural at tapat ang “upang maglingkod siya sa akin bilang pari” matapos banggitin si Aaron at ang kanyang mga anak na lalaki. Ang “tunikang may hinabing padron” ay mas maingat kaysa sa tiyak na “disenyong parisukat.”
