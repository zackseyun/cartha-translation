  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: tl
  text: 'At ito ang mga kasuotang gagawin nila: isang pektoral[a], isang efod[b], isang balabal, isang tunikang may hinabing padron[c], isang turbante, at isang pamigkis. Gagawa sila ng mga banal na kasuotan[d] para sa kapatid mong si Aaron at sa kanyang mga anak na lalaki, upang maglingkod siya sa akin bilang pari.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pektoral” ay natatanging kasuotang isinusuot sa dibdib ng pari; maaari ring isaling “kasuutan sa dibdib.” Hindi ito baluting pandigma.
    reason: lexical_alternative
  - marker: b
    text: Ang efod ay isang natatanging kasuotang pangpari na walang eksaktong katumbas sa Tagalog.
    reason: cultural_note
  - marker: c
    text: Maaaring tumukoy ang Hebreo sa tunikang hinabi sa isang masalimuot o parisukat-parisukat na padron; hindi tiyak ang eksaktong disenyo.
    reason: lexical_alternative
  - marker: d
    text: Maaari ring “mga sagradong kasuotan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: mga kasuotan
  rationale: Natural at marangal na katumbas sa konteksto ng kasuotang pangpari; hindi nito ipinapasok ang terminolohiyang eklesiastikal ng mas huling panahon.
- source_word: יַעֲשׂוּ
  choice: gagawin nila / gagawa sila
  rationale: Ipinahahayag ng imperfect ang iniutos na gawain sa konteksto, at natural itong naipapahayag sa modernong Tagalog sa anyong panghinaharap.
- source_word: חֹשֶׁן
  choice: pektoral
  rationale: Teknikal na katawagan para sa kasuotang nasa dibdib ng punong pari; iniiwasan nito ang maling pahiwatig na baluting pandigma.
- source_word: אֵפוֹד
  choice: efod
  rationale: Transliterasyon ng natatanging kasuotang pangpari na walang eksaktong katumbas sa Tagalog.
- source_word: מְעִיל
  choice: balabal
  rationale: Malinaw at karaniwang salitang Tagalog para sa panlabas na kasuotan, nang hindi labis na tinutukoy ang anyo nito.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: tunikang hinabing may disenyong parisukat
  rationale: Ang כְתֹנֶת ay tunika, at ang תַּשְׁבֵּץ ay tumutukoy sa hinabing obrang may padron, malamang na parisukat; pinananatili ng parirala ang bahagyang kawalang-katiyakan sa detalye.
- source_word: מִצְנֶפֶת
  choice: turbante
  rationale: Malinaw na katumbas para sa nakapulupot na pantakip sa ulo ng punong pari.
- source_word: אַבְנֵט
  choice: pamigkis
  rationale: Tumutukoy sa telang ipinupulupot sa baywang at angkop sa seremonyal na konteksto.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: mga banal na kasuotan
  rationale: Malapit sa Hebreo at pinananatili ang mahalagang bokabularyo ng kabanalan sa kontekstong pangpari.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: para sa kapatid mong si Aaron
  rationale: Natural na ayos sa Tagalog na pinananatili ang tuwirang pagtukoy kay Aaron bilang kapatid ni Moises.
- source_word: וּלְבָנָיו
  choice: at sa kanyang mga anak na lalaki
  rationale: Tumpak na pinananatili ang panlalaking kahulugan ng Hebreo at ang pagtukoy sa mga anak na lalaking maglilingkod bilang pari.
- source_word: לְכַהֲנוֹ לִי
  choice: upang maglingkod sila sa akin bilang mga pari
  rationale: Ipinapahayag ang layunin ng paggawa ng mga kasuotan. Bagaman pang-isahan ang anyong Hebreo, maaaring saklawin ng hulaping panghalip si Aaron bilang pinuno o ang kolektibong naunang binanggit; ang salin ay sumusunod sa natural na kolektibong diwa sa konteksto at itinatala ang gramatikal na tensiyon.
theological_decisions:
- issue: Mga teknikal na katawagan sa kasuotang pangpari
  choice: Isalin ang mga katawagang may malinaw na katumbas, ngunit panatilihin sa transliterasyon ang “efod” at gamitin ang teknikal na “pektoral.”
  alternative: Gumamit ng mga mapaglarawang katawagan gaya ng “apron ng pari” o “baluti sa dibdib.”
  rationale: Pinananatili nito ang natatanging kontekstong pangtabernakulo nang hindi ipinapasok ang maling imaheng pandigma o ang tradisyon ng mas huling mga kasuotang pansimbahan.
- issue: Kasarian ng mga anak ni Aaron
  choice: “mga anak na lalaki”
  alternative: “mga anak” o “mga inapo”
  rationale: Tahasang panlalaki ang בָּנָיו sa kontekstong ito at tumutukoy sa mga lalaking itinalaga sa pagkapari.
- issue: Bilang ng tinutukoy sa לְכַהֲנוֹ
  choice: Isinalin sa pangmaramihang “upang maglingkod sila ... bilang mga pari,” ayon sa kolektibong sanggunian kina Aaron at sa kanyang mga anak.
  alternative: “upang maglingkod siya sa akin bilang pari,” na mahigpit na sumusunod sa pang-isahang hulaping Hebreo.
  rationale: Pang-isahan ang gramatikal na anyo ngunit kasunod ito ng pagbanggit kay Aaron at sa kanyang mga anak; hindi dapat ikubli ang tensiyong ito, kaya inilalahad sa talababa ang mas pormal na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “kasuotan,” “balabal,” “turbante,” at “pamigkis” bilang malinaw na karaniwang salita; pinanatili ang “efod” at “pektoral” bilang kinakailangang teknikal na katawagan. Inayos ang pariralang “kapatid mong si Aaron” ayon sa natural na sintaks ng Tagalog.
