translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang paulit-ulit na ayos na “isang kampanang ginto at isang granada” upang katawanin ang salit-salitang disenyo sa Hebreo. Ginamit ang “sa palibot ng laylayan” upang malinaw na maipahayag ang pinagsamang diwa ng עַל at סָבִיב nang hindi maging alanganin ang pag-uulit.
