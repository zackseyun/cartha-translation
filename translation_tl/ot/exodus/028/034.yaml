translation:
  language: tl
  text: isang kampanang ginto at isang granada[a], isang kampanang ginto at isang granada, sa laylayan ng balabal sa buong palibot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “granada” ay malamang na palamuting hugis-granada na nakakabit sa pagitan ng mga kampana.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, pinagsama rito ang pang-ukol na maaaring mangahulugang “sa” o “sa ibabaw ng” at ang salitang nangangahulugang “paikot” o “sa buong palibot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: kampana
  rationale: Tumutukoy ito sa maliit na kampanang nakakabit sa kasuotang saserdotal; “kampana” ang natural at tuwirang katumbas sa modernong Filipino.
- source_word: זָהָב
  choice: ginto
  rationale: Ipinahahayag ang materyal ng kampana. Ang “kampanang ginto” ay malinaw at malapit sa konstruksiyong Hebreo.
- source_word: רִמּוֹן
  choice: granada
  rationale: Karaniwang kahulugan nito ang bunga ng granada. Pinananatili sa pangunahing teksto ang payak na katawagan, habang ipinapaliwanag sa talababa na malamang na palamuting hugis-granada ito.
- source_word: עַל
  choice: sa palibot ng
  rationale: Bagaman karaniwang “sa ibabaw ng” o “sa,” kapag isinama sa שׁוּלֵי at סָבִיב ay inilalarawan nito ang pagkakalagay na paikot sa laylayan.
- source_word: שׁוּלֵי
  choice: laylayan
  rationale: Sa konteksto ng kasuotan, tumutukoy ito sa ibabang gilid o laylayan. “Laylayan” ang likas at tiyak na salitang Filipino.
- source_word: מְעִיל
  choice: balabal
  rationale: Tumutukoy sa sagradong panlabas na kasuotan ng punong pari. Ang “balabal” ay madaling maunawaan at angkop sa konteksto, bagaman maaari ring isaling “mahaba at maluwang na kasuotan.”
- source_word: סָבִיב
  choice: sa palibot
  rationale: Binibigyang-diin nito na ang ayos ay paikot sa buong laylayan. Naipapahayag ito nang natural ng “sa palibot,” na hindi nangangailangan ng salitang inuulit.
