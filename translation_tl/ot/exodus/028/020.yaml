translation:
  language: tl
  text: 'At ang ikaapat na hanay: berilo[a], oniks, at jaspe; ang mga ito ay ilalagay sa mga kabitang ginto sa kani-kanilang kinalalagyan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga batong-hiyas sa pektoral ng punong pari. Kabilang sa mga tradisyonal na salin ang “berilo” para sa תַּרְשִׁישׁ at “oniks” para sa שֹׁהַם, ngunit may iba pang iminungkahing pagkakakilanlan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: At ang ikaapat na hanay
  rationale: Sa pagkakasunod-sunod ng mga batong nasa pektoral, ang טוּר ay isang hanay; tuwirang ipinahahayag ng הָרְבִיעִי na ito ang ikaapat.
- source_word: תַּרְשִׁישׁ
  choice: berilo
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan ng sinaunang batong ito. Ang “berilo” ay isang kinikilalang tradisyonal na katumbas, kaya nilagyan ng talababa upang hindi magpahiwatig ng labis na katiyakan.
- source_word: שֹׁהַם
  choice: onise
  rationale: Tradisyonal at madaling makilalang pangalan ng batong ito sa Filipino, bagaman hindi rin lubos na tiyak ang sinaunang mineral na tinutukoy.
- source_word: יָשְׁפֵה
  choice: jaspe
  rationale: Karaniwang katumbas sa Filipino ng batong malawak na kinikilalang jasper.
- source_word: מְשֻׁבָּצִים זָהָב יִהְיוּ בְּמִלּוּאֹתָם
  choice: Ilalagay ang mga ito sa mga lalagyang ginto
  rationale: Ipinahahayag ng pasibong participle at imperfect ang itinakdang pagkakabit ng mga bato. Ang מִלּוּאֹתָם ay tumutukoy sa mga lagayan o setting na pinagkakabitan ng mga ito; natural sa Filipino ang “mga lalagyang ginto.”
