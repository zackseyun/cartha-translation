translation:
  language: tl
  text: At gumawa ka para sa kanila ng mga panloob na kasuotang yari sa lino[a] upang takpan ang kanilang hubad na laman; ang mga ito ay mula sa baywang hanggang sa mga hita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga salawal na lino” o “maiikling pantalong lino.” Tumutukoy ang Hebreo sa kasuotang isinusuot sa ibabang bahagi ng katawan sa ilalim ng kasuotang pangpari.
    reason: lexical_alternative
  - marker: b
    text: Literal na, “mula sa mga balakang hanggang sa mga hita.” Ginamit dito ang “baywang” bilang natural na paglalarawan sa itaas na hangganan ng kasuotan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: At gumawa ka
  rationale: Pinananatili ang pautos na anyo at ang pang-ugnay na waw sa sunod-sunod na mga tagubilin.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Likas na pagpapahayag ng di-tuwirang layon na tumutukoy sa mga paring binanggit sa konteksto.
- source_word: מִכְנְסֵי בָד
  choice: mga panloob na kasuotang lino
  rationale: Ipinahahayag ang uri at gamit ng kasuotang pantakip sa ibabang bahagi ng katawan nang hindi gumagamit ng lipas o labis na tiyak na termino.
- source_word: לְכַסּוֹת
  choice: upang takpan
  rationale: Malinaw na isinasalin ang pawatas na nagsasaad ng layunin.
- source_word: בְּשַׂר עֶרְוָה
  choice: ang kanilang kahubaran
  rationale: Natural at marangal sa Filipino; inihahatid ang diwa ng literal na 'laman ng kahubaran' nang hindi labis na eupemistiko o mekanikal.
- source_word: מִמָּתְנַיִם
  choice: mula baywang
  rationale: Ang מָתְנַיִם ay maaaring tumukoy sa balakang, baywang, o balakangang bahagi; ang 'baywang' ang pinakanatural na panimulang hangganan ng kasuotan sa Filipino.
- source_word: וְעַד יְרֵכַיִם
  choice: hanggang mga hita
  rationale: Tuwirang ipinapahayag ang ibabang hangganan ng kasuotan; ang יָרֵךְ ay karaniwang 'hita.'
- source_word: יִהְיוּ
  choice: ang mga iyon
  rationale: Sa sugnay na walang tahasang pandiwang katumbas sa natural na Filipino, ipinahahayag ang Hebreong 'ang mga iyon ay mula...hanggang...' sa isang maikli at idiomatikong pangungusap.
