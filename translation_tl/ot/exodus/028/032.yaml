base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: tl
  text: Ang bukasan para sa ulo ay nasa gitna nito. Sa palibot ng bukasan ay magkakaroon ito ng hinabing gilid, tulad ng bukasan ng baluti[a], upang hindi ito mapunit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bukasan ng kasuotang pandigma” o “bukasan ng baluting tunika.” Bihira ang salitang Hebreo na תַּחְרָא; malamang na tumutukoy ito sa isang uri ng baluti o kasuotang pandigma na may pinatibay na bukasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: butas para sa ulo
  rationale: Sa konteksto ng kasuotan, ang פֶּה (literal na “bibig”) ay tumutukoy sa isang butas o bukasan; nililinaw ng רֹאשׁוֹ na para ito sa ulo.
- source_word: בְּתוֹכוֹ
  choice: nasa gitna nito
  rationale: Ipinapahayag nito ang lokasyon ng butas sa loob o gitnang bahagi ng kasuotan; natural at malinaw sa modernong Tagalog ang “nasa gitna nito.”
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: hinabing laylayan
  rationale: Ang שָׂפָה ay “gilid” o “laylayan,” at ang מַעֲשֵׂה אֹרֵג ay gawa sa paghahabi. Ipinahihiwatig ng parirala ang hinabi at pinatibay na gilid sa palibot ng butas.
- source_word: לְפִיו סָבִיב
  choice: sa palibot ng butas
  rationale: Ang ikalawang פֶּה ay muling tumutukoy sa bukasan ng kasuotan, at ang סָבִיב ay nagsasaad na napalilibutan ito.
- source_word: כְּפִי תַחְרָא
  choice: tulad ng butas ng baluting tunika
  rationale: Bihira ang תַחְרָא at malamang na tumutukoy sa isang tunikang pandigma o baluting kasuotan na may matibay na bukasan. Pinananatili ng “baluting tunika” ang posibleng sinaunang bagay nang hindi ito nililimitahan sa isang tiyak na uri ng metal na baluti.
- source_word: לֹא יִקָּרֵעַ
  choice: upang hindi ito mapunit
  rationale: Ang Niphal ay may pasibong diwa, “mapunit.” Sa konteksto, likas na nauunawaan ang sugnay bilang layunin o kinalabasan ng pinatibay na laylayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “butas” bilang karaniwang terminong pangkasuotan, “laylayan” para sa natapos at pinatibay na gilid, at isang talababa upang mapanatili ang leksikal na alternatibo.
