  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: tl
  text: Gagawa ka rin sa pektoral ng mga tanikalang yari sa purong ginto, na pinilipit na parang mga lubid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tanikalang pinintas” o “mga tanikalang parang lubid”; inilalarawan ng Hebreo ang mga tanikalang ginawa sa paraang nakapilipit o nakapintas na gaya ng lubid.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka rin
  rationale: Ang Qal perfect na may pang-ugnay sa sunod-sunod na tagubilin ay may puwersang pautos. Likas sa modernong Filipino ang anyong panghinaharap na “gagawa ka,” at ipinahihiwatig ng “rin” ang pagpapatuloy ng mga tagubilin.
- source_word: עַל הַחֹשֶׁן
  choice: sa pektoral
  rationale: Maaaring mangahulugang “sa ibabaw ng” o tumukoy sa pagkakabit. Ang “sa pektoral” ay natural at hindi labis na nagpapasya kung eksaktong nasa ibabaw o nakakabit dito ang mga tanikala.
- source_word: שַׁרְשֹׁת
  choice: mga tanikala
  rationale: Tumutukoy ang pangmaramihang pangngalan sa mga chain o magkakawing na piraso. Ang “tanikala” ay malinaw at angkop sa pormal na paglalarawan ng kasuotang pansaserdote.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: na pinilipit na parang mga lubid
  rationale: Inilalarawan ng magkakaugnay na mga salita ang paraang hinubog ang mga tanikala—nakapilipit, nakapintas, o tulad ng lubid. Pinananatili ng salin ang larawan nang hindi gumagamit ng di-tiyak na teknikal na termino.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Ito ang karaniwan, literal, at natural na tawag sa materyal sa mga tagubilin tungkol sa tabernakulo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pektoral” bilang maikli at pormal na katawagan sa sagradong kasuotang nasa dibdib; iniwasan ang mas paliwanag ngunit mabigat na “baluti sa dibdib.”
