  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: tl
  text: 'at ang ikalawang hanay: turkesa[a], sapiro, at diyamante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng ilan sa mga sinaunang batong hiyas. Ang נֹפֶךְ ay maaaring “esmeralda” o “karbungko”; ang סַפִּיר ay maaaring tumukoy sa “lapis lazuli”; at ang יָהֲלֹם ay maaaring “hasinto” o “haspe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: at ang hanay
  rationale: Sa konteksto ng mga batong nakalagay sa pektoral, ang טוּר ay tumutukoy sa isang hanay ng mga bato; natural sa Filipino ang “hanay,” at isinasalin ng “at” ang וְ.
- source_word: הַ/שֵּׁנִי
  choice: ikalawang
  rationale: Pamilang na panunuring tumutukoy sa hanay; ang “ikalawang” ang tuwiran at likas na salin.
- source_word: נֹפֶךְ
  choice: turkesa
  rationale: Hindi tiyak ang eksaktong pagkakakilanlan ng sinaunang batong ito. Ang “turkesa” ay isang makatwirang modernong katumbas, habang inilalahad sa talababa ang mahahalagang alternatibo.
- source_word: סַפִּיר
  choice: sapiro
  rationale: Ang “sapiro” ang nakagawiang katawagan at madaling maunawaan, bagaman maaaring lapis lazuli ang tinutukoy ng sinaunang salita; pinananatili sa talababa ang kawalang-katiyakang ito.
- source_word: וְ/יָהֲלֹם
  choice: at diyamante
  rationale: Karaniwang tradisyonal na salin ang “diyamante,” ngunit pinagtatalunan ang eksaktong uri ng bato; dahil dito, inilalagay sa talababa ang ibang posibleng pagkakakilanlan.
