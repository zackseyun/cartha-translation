translation_notes:
  register: Modernong Filipino na maikli, dignificado, at angkop sa anyong talaan. Pinanatili ang mga karaniwang pangalan ng hiyas sa pangunahing teksto, at hayagang inilagay sa talababa ang tunay na leksikal na kawalang-katiyakan.
