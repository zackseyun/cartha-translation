  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: tl
  text: Hahabihin mo ang tunika mula sa pinong lino na may parisukat-parisukat na disenyo[a]. Gagawa ka rin ng turbante mula sa pinong lino, at gagawa ka ng pamigkis na gawa ng isang magbuburda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gawin mo ang tunika mula sa pinong lino na may parisukat-parisukat na disenyo.” Malamang na tumutukoy ang pandiwang Hebreo sa paggawa ng telang may padron.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  choice: hahabihin ... na may disenyong parisukat
  rationale: Ipinahihiwatig ng pandiwa sa konteksto ng kasuotang pangpari ang paggawa ng telang may padron, malamang ay parisukat-parisukat; pinananatili ng salin ang paraan ng paggawa at ang malamang na anyo nito.
- source_word: הַכְּתֹנֶת
  choice: tunika
  rationale: Ang כְּתֹנֶת ay kasuotang isinusuot sa katawan; ang “tunika” ay malinaw at angkop na katawagan sa modernong Filipino.
- source_word: שֵׁשׁ
  choice: pinong lino
  rationale: Sa konteksto ng tabernakulo at mga kasuotang pangpari, tumutukoy ang שֵׁשׁ sa mataas na uring lino.
- source_word: מִצְנֶפֶת
  choice: turbante
  rationale: Tumutukoy ito sa pantakip sa ulo na ipinupulupot; “turbante” ang pinakamaikli at malinaw na katumbas.
- source_word: אַבְנֵט
  choice: pamigkis
  rationale: Isa itong mahabang pandekorasyong kasuotang itinatali sa baywang; mas tumpak ang “pamigkis” kaysa “sinturon.”
- source_word: מַעֲשֵׂה רֹקֵם
  choice: binurdahan
  rationale: Natural na ipinapahayag sa Filipino ang mahusay na pandekorasyong gawa sa tela bilang bagay na binurdahan, habang pinananatili ang diwa ng kasanayang artisano.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “tunika,” “turbante,” at “pamigkis” bilang malinaw na katawagan sa mga kasuotang pangpari; iniwasan ang mga salitang labis na arkaiko.
