source:
  edition: WLC
  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: tl
  text: 'At ang mahusay na hinabing bigkis ng efod[a] na nasa efod ay magiging kapareho ng pagkakayari nito at magiging kaisa nito: ginto, asul, purpura, iskarlatang sinulid[b], at pinong pinilipit na lino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “efod” ay isang natatanging kasuotang saserdotal; sa kontekstong ito, bahagi ito ng kasuutan ng punong saserdote.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, ang “asul, purpura, at iskarlata” ay tumutukoy sa mga tininaang materyales na tela na ginagamit sa tabernakulo at sa mga kasuotang saserdotal.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: mahusay na hinabing bigkis
  rationale: Sa konteksto ng kasuotang saserdotal, tumutukoy ito sa hinabing bahaging nagsisilbing bigkis; ipinahahayag ng salin ang anyong tela at maingat na pagkakayari nito.
- source_word: אֲפֻדָּתוֹ
  choice: ng efod
  rationale: Pinanatili ang kinikilalang transliterasyon ng teknikal na pangalan ng kasuotang saserdotal.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa ibabaw nito
  rationale: Ang pinakamalapit na tinutukoy ng hulapi ay ang efod. Hindi ginawang mas tiyak na 'nakakabit' sapagkat interpretatibo iyon.
- source_word: כְּמַעֲשֵׂהוּ
  choice: sa paraang tulad ng pagkagawa rito
  rationale: Tahasang pinananatili ang paghahambing sa paraan o uri ng pagkakayari, sa halip na isama lamang ito sa ideya ng pagiging isang piraso.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: magiging kabahagi nito
  rationale: 'Ipinahahayag ang literal na diwang ''mula rito ito magiging'': ang bigkis ay integral sa efod at hindi hiwalay na bahagi, nang hindi labis na pinipilit ang eksaktong mekanismo ng pagkagawa.'
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katumbas ng materyal na binanggit.
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Karaniwang salin ng kulay o tininaang materyal sa mga paglalarawan ng tabernakulo.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Ang 'purpura' ay marangal at madaling maunawaang tawag sa kulay o tininaang materyal na ito.
- source_word: תוֹלַעַת שָׁנִי
  choice: iskarlatang sinulid
  rationale: Ipinakikita ang pulang kulay at ang tekstil na gamit nito sa talaan ng mga materyales.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: 'Pinananatili ang dalawang sangkap ng parirala: pinong lino at ang pagiging pinilipit o tinuwid bilang sinulid.'
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at malinaw. Pinanatili ang teknikal na salitang “efod,” samantalang ginawang natural ang paglalarawan sa bigkis at sa pagkakaugnay nito sa kasuutan. Kapuwa ipinahayag ang כְּמַעֲשֵׂהוּ at מִמֶּנּוּ יִהְיֶה upang hindi mawala ang pagkakatulad ng pagkakayari at ang pagiging integral ng bigkis sa efod.
