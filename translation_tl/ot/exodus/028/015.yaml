base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: tl
  text: Gawin mo ang pektoral ng paghatol[a], na may masining na pagkakayari, gaya ng pagkakayari ng efod. Gawin mo ito mula sa ginto, asul, purpura, matingkad na pulang sinulid, at pinong pinilipit na lino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pektoral para sa paghatol” o “pektoral ng pagpapasya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: pektoral
  rationale: Tumutukoy sa natatanging kasuotang pansarili na isinusuot sa dibdib ng pinakapunong pari. Pinananatili ng “pektoral” ang teknikal na diwa nang hindi nagpapahiwatig ng baluting pandigma.
- source_word: מִשְׁפָּט
  choice: ng pagpapasya
  rationale: Pinananatili ang ugnayan ng kasuotang ito sa paghatol o pagpapasyang pansamba, ngunit hindi tinutukoy ang eksaktong paraan ng paggana nito.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: yari ng isang dalubhasang tagahabi
  rationale: Ipinahihiwatig ng parirala ang gawaing tekstil na masining, planado, at ginawa ng bihasang manggagawa.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: gaya ng pagkakayari sa efod
  rationale: Ipinapakita ang paghahambing sa uri o pamantayan ng pagkakayari ng efod.
- source_word: אֵפֹד
  choice: efod
  rationale: Teknikal itong pangalan ng isang natatanging kasuotang pampari, kaya higit na tumpak ang transliterasyon kaysa isang malawak na paliwanag.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal na nasa talaan.
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Karaniwang salin ng kulay o tina sa mga tekstil ng tabernakulo.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Likas at marangal na katawagan sa mamahaling kulay o tinang tinutukoy.
- source_word: תוֹלַעַת שָׁנִי
  choice: matingkad na pulang sinulid
  rationale: Nililinaw ang tekstil na diwa ng parirala at inilalarawan ang scarlet na kulay sa likas na modernong Tagalog.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili ang kalidad ng lino at ang paraan ng pagkakapilipit ng hibla.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: Gawin mo ito ... yari
  rationale: Pinananatili ang pautos na estilo at ang ikalawang pagbanggit sa paggawa, habang iniiwasan ang alanganing pag-uulit sa Tagalog.
theological_decisions:
- issue: Gampanin ng חֹשֶׁן מִשְׁפָּט
  choice: pektoral ng pagpapasya
  alternative: pektoral para sa paghatol; pektoral ng paghatol
  rationale: May ritwal at hudisyal na kaugnayan ang parirala, malamang sa pagpapasyang pampari, ngunit hindi ipinaliliwanag ng talata ang mekanismo. Pinananatili ng salin ang ugnayang iyon nang hindi ito nililimitahan sa isang tiyak na interpretasyon.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang teknikal na “pektoral” at “efod” para sa mga natatanging kasuotang pampari; ang iba pang paglalarawan ay ginawang likas sa kasalukuyang Tagalog.
