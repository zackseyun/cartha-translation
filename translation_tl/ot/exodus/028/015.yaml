revisions:
- from: 'Gawin mo ang pektoral ng pagpapasya[a], na yari ng isang dalubhasang tagahabi. Gawin mo ito na gaya ng pagkakayari sa efod: yari sa ginto, asul, purpura, at matingkad na pulang sinulid, at pinong linong pinilipit.'
  to: Gawin mo ang pektoral ng paghatol[a], na may masining na pagkakayari, gaya ng pagkakayari ng efod. Gawin mo ito mula sa ginto, asul, purpura, matingkad na pulang sinulid, at pinong pinilipit na lino.
