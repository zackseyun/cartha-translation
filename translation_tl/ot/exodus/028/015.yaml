  naturalness: May ilang di-likas na parirala sa draft, lalo na ang “pinong linong pinilipit.” Ang “pinong pinilipit na lino” ay malinaw at natural. Ang binagong pangungusap ay nananatiling marangal ngunit madaling basahin sa modernong Filipino Tagalog.
  terminology: Pinananatili ang mga teknikal na katawagang “pektoral” at “efod.” Ginamit ang “pektoral ng paghatol” upang mapanatili ang pormal at sinadyang hindi ganap na tinutukoy na ugnayan ng kasuotan sa paghatol/pagpapasya.
