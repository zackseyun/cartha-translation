translation_notes:
  register: Modernong Filipino na malinaw at marangal ang tono. Ginamit ang tuwirang pautos na “ikabit mo,” ang karaniwang “singsing,” at ang teknikal ngunit madaling maipaliwanag na “pektoral” para sa natatanging kasuotang saserdotal.
