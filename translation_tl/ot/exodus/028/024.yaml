  text: וְ/נָתַתָּ֗ה אֶת שְׁתֵּי֙ עֲבֹתֹ֣ת הַ/זָּהָ֔ב עַל שְׁתֵּ֖י הַ/טַּבָּעֹ֑ת אֶל קְצ֖וֹת הַ/חֹֽשֶׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: tl
  text: At ikabit mo ang dalawang tinirintas na tanikala na yari sa ginto[a] sa dalawang singsing, sa mga dulo ng pektoral.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinilipit na mga tanikala.”
    reason: lexical_alternative
  - marker: b
    text: Ang “pektoral” ay ang palamuting bahagi ng kasuotang saserdotal na isinusuot sa dibdib; tradisyonal din itong tinatawag na “baluti sa dibdib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: At ikabit mo
  rationale: Ang Qal perfect na may waw sa sunod-sunod na tagubilin ay may lakas ng utos. Sa konteksto, ang mga tanikala ay ikinakabit sa mga singsing, kaya mas tiyak at likas ang “ikabit” kaysa sa pangkalahatang “ilagay.”
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: ang dalawang tinirintas na tanikala na yari sa ginto
  rationale: Ang עֲבֹתֹת ay tumutukoy sa mga tanikalang hinubog na parang lubid o pinilipit na magkakasama. Ipinahihiwatig ng “tinirintas na tanikala” kapwa ang anyo at ang gamit, samantalang malinaw na ipinapahayag ng “yari sa ginto” ang materyal.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: sa dalawang singsing
  rationale: Ang עַל ay nagpapahiwatig dito ng pagkakabit sa mga singsing. Likas sa Filipino ang “ikabit ... sa,” at ang “singsing” ang karaniwang tawag sa ganitong pirasong pangkabit.
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: sa mga dulo ng pektoral
  rationale: Ang קְצֹוֹת ay mga dulo o dulong bahagi. Ang אֶל ay nauunawaan sa konteksto bilang lokasyon ng mga singsing sa mga dulo ng kasuutan.
- source_word: הַחֹשֶׁן
  choice: pektoral
  rationale: Ang חֹשֶׁן ay natatanging bahagi ng kasuotang saserdotal sa dibdib at hindi baluting metal. Ang “pektoral” ay maikli, dignificado, at umiiwas sa maling pahiwatig ng “baluti sa dibdib.”
