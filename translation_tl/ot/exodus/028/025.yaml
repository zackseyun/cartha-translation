  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: tl
  text: At ilalagay mo ang dalawang dulo ng dalawang panali[a] sa dalawang kabitan, at ilalagay mo ang mga kabitang ito sa mga piraso sa balikat ng efod, sa harapang bahagi nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tanikala.” Ang salitang Hebreo ay maaaring tumukoy sa mga pinilipit na panali o sa gawaing kawing-kawing; dahil sa konteksto ng ginto, maaaring tanikala ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: mga dulo
  rationale: Tumutukoy ito sa mga dulong bahagi ng mga panali; ang “mga dulo” ang likas at malinaw na katumbas sa modernong Tagalog.
- source_word: הָעֲבֹתֹת
  choice: mga panali
  rationale: Maaaring tumukoy ang salita sa makakapal o pinilipit na panali, pati sa gawaing kawing-kawing. Pinananatili ng “mga panali” ang pangunahing larawan nang hindi ipinapasya ang tunay na anyo; inilalagay sa talababa ang posibleng “mga tanikala.”
- source_word: הַמִּשְׁבְּצֹת
  choice: mga balangkas na ginto
  rationale: Tumutukoy sa mga gintong lagayan o balangkas na pinagkakabitan. Ang “balangkas na ginto” ay malinaw sa konteksto at hindi labis na nagtatakda sa eksaktong disenyong pandekorasyon.
- source_word: כִּתְפֹת
  choice: mga piraso sa balikat
  rationale: Bagaman literal na “mga balikat,” tumutukoy ito rito sa mga bahagi ng kasuotang nasa balikat, hindi sa mismong balikat ni Aaron.
- source_word: אֵפֹד
  choice: efod
  rationale: Isang natatanging kasuotang pangpari na walang eksaktong katumbas sa Tagalog; ang transliterasyong “efod” ay tumpak at hindi mapagpakahulugan.
- source_word: אֶל מוּל פָּנָיו
  choice: sa harapang bahagi nito
  rationale: Ipinahihiwatig ng parirala ang bahaging nakaharap sa unahan ng efod. Natural at malinaw ito sa Tagalog habang pinananatili ang direksiyong panlunan.
- source_word: וְנָתַתָּה
  choice: ikakabit mo ang mga iyon
  rationale: Sa konteksto ng paggawa ng kasuotan, malinaw na ang ikalawang paglalagay ay pagkakabit ng mga balangkas at dulo sa mga piraso sa balikat. Ginagawang malinaw ng “mga iyon” ang ipinahihiwatig na layon nang hindi nagdaragdag ng bagong bagay.
