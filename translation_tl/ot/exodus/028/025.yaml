    rationale: Sa konstruksyon ng Hebreo, ang mga setting/kabitan ang natural na ipinahihiwatig na layon ng ikalawang “ilalagay.” Ang “mga kabitang ito” ay nagbibigay ng kinakailangang kalinawan nang hindi nagdaragdag ng kahulugan.
