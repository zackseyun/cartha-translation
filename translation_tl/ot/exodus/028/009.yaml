  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: tl
  text: Kumuha ka ng dalawang batong oniks[a] at iukit mo sa mga batong iyon ang mga pangalan ng mga anak na lalaki ni Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong shoham ay tumutukoy sa isang mahalagang bato na tradisyonal na isinasaling “oniks.” Hindi tiyak ang eksaktong uri nito; iminungkahi rin ang sardonyx o berilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kumuha ka
  rationale: Ang Qal perfect na may waw sa sunod-sunod na tagubilin ay may puwersang pautos. Natural at tuwiran sa modernong Tagalog ang pandiwang pautos na “Kumuha ka.”
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: dalawang batong onise
  rationale: Hindi tiyak ang eksaktong uri ng mahalagang batong שֹׁהַם. Ginamit ang tradisyonal at kilalang katumbas na “onise,” habang pinanatili sa talababa ang kawalang-katiyakan.
- source_word: וּפִתַּחְתָּ
  choice: at iukit mo
  rationale: Sa konteksto ng paglalagay ng mga pangalan sa mahahalagang bato, malinaw na ipinahihiwatig ng “iukit” ang paghiwa o paglilok ng inskripsiyon sa ibabaw.
- source_word: עֲלֵיהֶם
  choice: sa mga iyon
  rationale: Tumutukoy ito sa dalawang bato. Ang “sa mga iyon” ay natural at malinaw na Tagalog para sa lokasyon ng pag-ukit.
- source_word: שְׁמוֹת
  choice: ang mga pangalan
  rationale: Tiyak sa konteksto ang mga pangalang iuukit, kaya angkop ang panandang “ang.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak na lalaki ni Israel
  rationale: Dito ay tumutukoy ang parirala sa mismong mga anak na lalaki ng patriyarkang si Israel, na pinagmulan ng mga lipi, hindi lamang sa sambayanang Israel sa pangkalahatan.
