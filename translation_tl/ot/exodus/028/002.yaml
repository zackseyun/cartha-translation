  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: tl
  text: Gagawa ka ng mga banal na kasuotan para kay Aaron, na kapatid mo, para sa karangalan at kagandahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “para sa kaluwalhatian at kagandahan” o “para sa karangalan at karilagan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na may pang-ugnay ay may puwersa ng utos sa kontekstong ito; natural na ipinahahayag ito sa Filipino sa anyong panghinaharap na direktiba.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: mga banal na kasuotan
  rationale: Pinananatili ng “banal” ang diwa ng mga kasuotang ibinukod para sa sagradong gamit, samantalang ang “kasuotan” ay marangal ngunit hindi nag-aangkat ng mas huling terminolohiyang eklesyastikal.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: para kay Aaron na kapatid mo
  rationale: Tuwirang pinananatili ang pangalan at ang ugnayang pampamilya kay Moises.
- source_word: לְכָבוֹד
  choice: upang magbigay ng karangalan
  rationale: Ang כבוד ay maaaring tumukoy sa kaluwalhatian, karangalan, o dignidad. Sa paglalarawan ng layunin o epekto ng kasuotan, malinaw at likas sa Filipino ang “karangalan” nang hindi nililimitahan kung kanino nauukol ito.
- source_word: וּלְתִפְאָרֶת
  choice: at maringal na kagandahan
  rationale: Saklaw ng תפארת ang kagandahan, karilagan, at karingalan. Pinagsasama ng pariralang ito ang estetiko at maringal na diwa nito sa natural na Filipino.
theological_decisions:
- issue: Ang layuning ipinahahayag ng לְכָבוֹד וּלְתִפְאָרֶת tungkol sa kasuotang pangpari
  choice: “upang magbigay ng karangalan at maringal na kagandahan”
  alternative: “para sa kaluwalhatian at kagandahan” o “para sa karangalan at karilagan”
  rationale: Hindi tinutukoy nang tahasan ng Hebreo kung kanino eksaktong nauukol ang karangalan o kaluwalhatian. Pinananatili ng salin ang lawak at tensiyong ito at kapuwa ang dignidad at kagandahan ng kasuotang pangpari, nang hindi ito itinatakda bilang tanging karangalan ng tao o tanging kaluwalhatian ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga banal na kasuotan” upang mapanatili ang sagradong konteksto, at ang bahagyang pinalawak na layuning parirala upang maging natural sa Filipino habang iniingatan ang semantikong lawak ng Hebreo.
