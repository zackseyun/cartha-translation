  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang teknikal na katawagang “efod,” gumamit ng bokabularyong angkop sa paghahabi, at iniwasang tukuyin ang paraan bilang pagbuburda dahil hindi iyon tahasang sinasabi ng Hebreo.
