base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: tl
  text: Gagawin nila ang efod mula sa ginto[a], asul at purpura, sinulid na iskarlata, at pinong linong pinilipit, na may masining na disenyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinulid na ginto.” “Ginto” lamang ang literal na nasa Hebreo, ngunit sa ganitong paggawa ay maaaring tumukoy ito sa gintong ginawang hibla at inihabi sa tela.
    reason: lexical_alternative
  - marker: b
    text: O “gawa ng isang tagadisenyo” o “gawa ng isang dalubhasang manggagawa.” Tumutukoy ang Hebreong pananalita sa masining at may disenyong pagkakayari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Gagawin nila
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubilin ay nagpapahayag ng iniutos na gagawin; natural itong naihahatid sa Filipino sa panghinaharap.
- source_word: הָאֵפֹד
  choice: ang efod
  rationale: Teknikal itong katawagan para sa kasuotang panseremonya ng punong pari at walang eksaktong katumbas sa Filipino, kaya tinumbasan sa anyong transliterado.
- source_word: זָהָב
  choice: ginto
  rationale: Ginto lamang ang tahasang sinasabi ng Hebreo; hindi idinagdag sa pangunahing teksto ang “sinulid” bagaman malamang na ginawang hibla ito para sa paghahabi.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Kulay o materyal na tinina ang tinutukoy sa talaan ng mga sangkap; ang “sinulid na asul” ay malinaw at natural sa konteksto ng paghahabi.
- source_word: וְאַרְגָּמָן
  choice: purpura
  rationale: Karaniwang katawagan sa kulay na mamahaling tina sa kontekstong ito; nauunawaan mula sa magkahanay na mga salita na sinulid na tinina ang materyal.
- source_word: תּוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Tumutukoy sa pulang tina o materyal na kinulayan nito. Pinananatili ang kulay nang hindi ipinapasok sa teksto ang pinagmulan ng tina.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Naipapahayag nito kapuwa ang pinong lino at ang pinilipit na pagkakayari ng hibla.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: gawa ng isang mahusay na tagadisenyo
  rationale: Ipinahihiwatig ng parirala ang masining at planadong pagkakayari; hindi ito nilimitahan sa pagbuburda.
