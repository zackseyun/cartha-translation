id: EXO.28.38
reference: Exodus 28:38
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: tl
  text: Dapat itong nasa noo ni Aaron, at papasanin ni Aaron ang kasalanang kaugnay ng mga banal na bagay[a] na itinatalaga bilang banal ng mga Israelita[b], kaugnay ng lahat ng kanilang banal na kaloob. Dapat itong laging nasa noo niya, upang sila ay maging katanggap-tanggap sa harap ni Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “papasanin ang pananagutan sa pagkakasala.” Ang idyomang Hebreo ay literal na “papasanin ang kasalanan” at maaaring tumukoy sa pananagutan sa kasalanang kaugnay ng mga banal na handog.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “mga anak na lalaki ng Israel,” isang karaniwang katawagang pangtipan para sa sambayanan ng Israel.
    reason: cultural_note
  - marker: c
    text: Maaari ring “upang kalugdan sila” o “para sa kanilang pagtanggap.” Sa konteksto, ang pagtanggap sa mga tao ay nakaugnay rin sa kanilang mga handog.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: noo / noo niya
  rationale: Ang “noo” ang malinaw at likas na katumbas sa modernong Tagalog para sa harapang bahagi ng ulo, at pinananatili nito ang pag-uulit sa Hebreo.
- source_word: נָשָׂא ... עֲוֺן
  choice: papasanin ... ang kasalanang kaugnay
  rationale: Pinananatili ng “papasanin” ang larawan at bigat ng idyomang pari at legal, habang nililinaw ng “kaugnay” na ang tinutukoy ay kasalanan o pananagutang nakaugnay sa mga banal na handog, hindi na likas na makasalanan ang mga bagay mismo.
- source_word: הַקֳּדָשִׁים
  choice: mga banal na bagay
  rationale: Pinananatili nito ang malawak na kategoryang panritwal ng Hebreo nang hindi ito nililimitahan sa isang uri lamang ng handog o kagamitan.
- source_word: יַקְדִּישׁוּ
  choice: itinatalaga bilang banal
  rationale: Likas itong pakinggan sa modernong Tagalog at malinaw na nagpapahayag ng paghahandog o pagbubukod para sa Diyos.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at inklusibong katawagang pangkapulungan sa modernong Tagalog; ipinapaliwanag sa talababa ang literal na anyo ng Hebreo.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: kaugnay ng lahat ng kanilang banal na kaloob
  rationale: Ang parirala ay mahirap sa sintaks. Ang “kaugnay ng” ay nagpapanatili sa malawak na ugnayan nang hindi tiyak na ipinapakahulugang sanhi, paraan, o simpleng pag-uuri lamang.
- source_word: תָּמִיד
  choice: lagi
  rationale: Direkta, natural, at malinaw nitong ipinahahayag ang patuloy na pagkalagay ng bagay sa noo ni Aaron.
- source_word: לְרָצוֹן לָהֶם
  choice: upang tanggapin sila
  rationale: Ipinahahayag nito ang layunin o bunga ng parirala sa natural na Tagalog, habang pinananatili sa talababa ang posibilidad ng “pagkalugod” at ang kaugnayan ng pagtanggap sa mga handog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang kahulugan ng pagpasan ni Aaron sa “kasalanan ng mga banal na bagay”
  choice: Pinapasan ni Aaron, bilang kinatawang pari, ang kasalanan o pananagutang kaugnay ng mga banal na bagay.
  alternative: Tuwirang inaalis ni Aaron ang kasalanan ng mga handog, o sagisag lamang niyang dinadala ang alaala ng mga kasalanan ng Israel.
  rationale: Hindi tinutukoy ng talata ang eksaktong paraan ng pagpasan o pagpapawalang-sala. Kaya pinananatili ng salin ang idyomang “papasanin” at ang teolohikal na tensiyon nito.
- issue: Ang tinutukoy ng “upang tanggapin sila”
  choice: Ang mga Israelita ang pangunahing tinutukoy, ngunit ang pagtanggap sa kanila ay nakaugnay sa kanilang mga banal na kaloob.
  alternative: Ang mga kaloob lamang ang tinatanggap.
  rationale: Ang panghalip na לָהֶם ay tumutukoy nang pinakanatural sa mga tao, ngunit ipinapakita ng konteksto na kasangkot din ang kanilang mga handog; hindi lubusang pinaghihiwalay ng salin ang dalawang ideya.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang mga karaniwang salitang “noo,” “kaloob,” at “mga Israelita,” habang pinanatili ang panritwal at teolohikal na bigat ng “papasanin,” “banal,” at “Yahweh.”
