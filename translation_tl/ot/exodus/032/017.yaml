  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: tl
  text: Nang marinig ni Josue ang ingay ng mga tao habang sumisigaw sila[a], sinabi niya kay Moises, “May ingay ng digmaan sa kampo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ng kanilang kaguluhan” o “habang sumisigaw ang bayan.” Ang pariralang Hebreo ay tumutukoy sa malakas na sigaw o maingay na pagsigaw ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: nang marinig
  rationale: Ang Qal wayyiqtol ng שׁמע ay simpleng pandinig sa sunod-sunod na salaysay; natural itong ipahayag sa Tagalog bilang “nang marinig.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Bibliyang Tagalog.
- source_word: קוֹל
  choice: ingay
  rationale: Sa konteksto, tumutukoy ang קוֹל sa naririnig na malakas na kaguluhan, hindi sa malinaw na pananalita. Ang “ingay” ay natural sa parehong paglitaw nito.
- source_word: הָעָם בְּרֵעֹה
  choice: ang ingay ng mga tao habang nagsisigawan sila
  rationale: Ang בְּרֵעֹה ay tumutukoy sa malakas na sigaw o maingay na pagsigaw. Bagaman pang-isahan ang hulapi ayon sa kolektibong עָם, likas sa Tagalog ang pangmaramihang “sila.”
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: sinabi niya kay Moises
  rationale: Natural at tapat na salin ng karaniwang pormula ng pagsasalaysay.
- source_word: קוֹל מִלְחָמָה
  choice: ingay ng digmaan
  rationale: Pinananatili ang ugnayang literal na “sound/noise of war”; ang “digmaan” ay mas malapit sa מִלְחָמָה kaysa “labanan.”
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Tuwirang tumutukoy sa kampamento ng Israel; karaniwan at malinaw ang “sa kampo.”
