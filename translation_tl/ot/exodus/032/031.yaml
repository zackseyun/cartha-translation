base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: tl
  text: Kaya bumalik si Moises kay Yahweh at sinabi, “Nakikiusap ako, napakalaking kasalanan ang nagawa ng bayang ito; gumawa sila para sa kanilang sarili ng mga diyos na yari sa ginto.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang diyos na yari sa ginto.” Maramihan sa Hebreo ang “mga diyos na yari sa ginto,” ngunit dahil sa mas malawak na konteksto, nauunawaan ito ng ilan bilang pagtukoy sa iisang gintong guya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Likas at tuwirang ipinahahayag nito ang pagbabalik ni Moises kay Yahweh.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Ginagamit ang pantanging pangalang Yahweh para sa Tetragrammaton, at ang “kay” ay angkop sa direksiyong tinutukoy ng אֶל.
- source_word: אָנָּא
  choice: Nakikiusap ako
  rationale: Ipinakikita nito ang mapagpakumbaba at nagsusumamong tono ng partikula, nang hindi gumagamit ng makalumang pananalita.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: napakalaki ng kasalanang ginawa ng bayang ito
  rationale: Natural sa modernong Tagalog at pinananatili ang tindi ng Hebreong cognate construction, bagaman hindi inuulit nang alanganin ang salitang “kasalanan.”
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: gumawa sila para sa kanilang sarili
  rationale: Pinananatili ang reflexive o benefactive na diwa ng לָהֶם.
- source_word: אֱלֹהֵי זָהָב
  choice: mga diyos na ginto
  rationale: Pinananatili sa pangunahing teksto ang gramatikal na maramihan ng Hebreo at ang materyal na ginto.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; ang “Yahweh” ay nagpapanatili sa tipanang pantanging pangalan nang hindi ito ginagawang titulo.
- issue: Bilang ng אֱלֹהֵי sa pariralang אֱלֹהֵי זָהָב
  choice: mga diyos na ginto
  alternative: isang diyos na ginto
  rationale: Ang anyong Hebreo ay maramihan, kaya iyon ang pinanatili sa teksto. Gayunman, maaaring unawain itong tumutukoy sa iisang gintong guya dahil sa konteksto; nakasaad ang posibilidad na iyon sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Nakikiusap ako” upang maipahayag ang pagsusumamo ni Moises, at inayos ang Hebreong cognate construction bilang natural na “napakalaki ng kasalanang ginawa” habang pinananatili ang diin.
