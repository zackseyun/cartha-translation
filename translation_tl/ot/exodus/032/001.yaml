source:
  edition: WLC
  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: tl
  text: Nang makita ng mga tao na matagal bago bumaba si Moises mula sa bundok, nagtipon sila sa palibot ni Aaron at sinabi sa kanya, “Tumayo ka at gumawa ka para sa amin ng mga diyos[a] na mangunguna sa amin. Sapagkat itong si Moises, ang taong nag-ahon sa amin mula sa lupain ng Ehipto—hindi namin alam kung ano na ang nangyari sa kanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang diyos na mangunguna sa amin.” Nauunawaan ng ilan ang אֱלֹהִים dito bilang isahan dahil nakatuon agad ang salaysay sa iisang imahen ng guya, ngunit maramihan ang anyo ng salitang Hebreo at maramihan din ang kasunod na pandiwa.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: matagal bumaba
  rationale: Likas at maikli sa makabagong Tagalog; ipinahahayag nito na sa pananaw ng mga tao ay matagal bago bumaba si Moises, nang hindi ipinapalagay ang dahilan ng pagkaantala.
- source_word: לָרֶדֶת מִן הָהָר
  choice: bumaba ... mula sa bundok
  rationale: Pinananatili ang direksiyon at pinagmulan sa payak at natural na Tagalog.
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: nagtipon sila sa palibot ni Aaron
  rationale: Inilalarawan ang pagtitipon ng mga tao kay Aaron at ipinahihiwatig ang kanilang paggigiit nang hindi tahasang ginagawang 'laban kay Aaron' ang malabong pang-ukol.
- source_word: קוּם
  choice: Tumayo ka
  rationale: Tuwiran at mariing pautos, katumbas ng biglang imperatibo sa Hebreo.
- source_word: עֲשֵׂה לָנוּ
  choice: gumawa ka para sa amin
  rationale: Malinaw na pinananatili ang diwang gumagawa si Aaron para sa kapakanan o kahilingan ng mga tao.
- source_word: אֱלֹהִים ... יֵלְכוּ
  choice: mga diyos ... mangunguna
  rationale: Ang pangngalan ay anyong maramihan at maramihan din ang pandiwang Hebreo. Sa Tagalog, hindi minamarkahan ng 'mangunguna' ang bilang, kaya ang 'mga diyos' ang tahasang nagpapanatili rito.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: na mangunguna sa amin
  rationale: Natural na Tagalog para sa paglakad sa unahan bilang paggabay o pamumuno.
- source_word: הֶעֱלָנוּ
  choice: nag-ahon sa amin
  rationale: Pinananatili ang pataas na larawan ng Hiphil ng עלה at ang karaniwang wika ng pag-ahon mula sa Ehipto.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tapat sa buong parirala at malinaw sa modernong Tagalog.
- source_word: מֶה הָיָה לוֹ
  choice: kung ano na ang nangyari sa kanya
  rationale: Likas na makabagong idyoma para sa pagtatanong tungkol sa sinapit ni Moises; ang 'na' ay angkop sa konteksto ng matagal na paghihintay.
theological_decisions:
- issue: Kung isahan o maramihan ang אֱלֹהִים sa talatang ito
  choice: 'Maramihan: “mga diyos”'
  alternative: 'Isahan: “isang diyos”'
  rationale: 'Mas pinapaboran ng agarang gramatika ang maramihan: maramihan ang anyo ng אֱלֹהִים at maramihan din ang kasunod na pandiwang יֵלְכוּ. Gayunman, dahil nakatuon kalaunan ang salaysay sa iisang imahen ng guya, inilalahad sa talababa ang posibleng pagbasa na isahan.'
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mariing tono ng kahilingan at ang bahagyang mapanghamak na “itong si Moises,” habang iniwasan ang labis na makaluma o denominasyonal na pananalita.
