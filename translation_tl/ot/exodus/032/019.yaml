  source_fidelity: Tumpak sa kabuuan ang paglapit sa kampo, pagkakita sa guya at mga sayaw, nag-aalab na galit ni Moises, paghahagis ng mga tapyas, at pagbabasag sa mga ito sa paanan ng bundok. Gayunman, ang pandiwang "makita" sa kasalukuyang pangungusap ay kailangang gawing "nakita" upang maipahayag ang nakaraang pangyayaring nasa Hebreo. Hindi rin kailangang idagdag ang "na bato," sapagkat hindi ito tahasang nasa talatang ito.
  naturalness: Hindi likas ang pagkakasunod na "Nang malapit na siya sa kampo at makita niya." Ang "Nang lumapit siya sa kampo at nakita niya" ay malinaw, natural, at nananatiling nasa nakaraang panahon. Mas maayos din ang "mga tapyas na hawak niya" kaysa "mula sa kanyang mga kamay."
  terminology: Ang "guya," "mga tapyas," at "sa paanan ng bundok" ay angkop. Ang "sayawan" ay katanggap-tanggap bilang kolektibong katawagan; pinananatili ng talababa ang mas pormal na pangmaramihang "mga sayaw."
