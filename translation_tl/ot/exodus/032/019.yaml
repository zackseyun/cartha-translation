base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: tl
  text: Nang lumapit siya sa kampo at nakita niya ang guya at ang sayawan[a], nag-alab ang galit ni Moises. Inihagis niya ang mga tapyas na hawak niya at binasag niya ang mga ito sa paanan ng bundok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga sayaw.” Pangmaramihan ang pangngalang Hebreo; maaari rin itong ipahayag bilang kolektibong “sayawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Ang pormulang pasalaysay at ang temporal na כַּאֲשֶׁר ay natural na naihahayag sa Filipino sa pamamagitan ng “Nang,” nang hindi pinananatili ang mabigat at di-likas na literal na “At nangyari na nang.”
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: malapit na siya sa kampo
  rationale: Pinananatili nito ang diwa ng paglapit sa kampo at maayos na nakakabit sa temporal na sugnay sa natural na Filipino.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: at makita niya ang guya
  rationale: Ang ראה ay karaniwang “makita,” at ang tiyak na pantukoy sa עגל ay tumutukoy sa partikular na guyang nabanggit na sa salaysay.
- source_word: וּמְחֹלֹת
  choice: at ang sayawan
  rationale: Ang pangmaramihang מְחֹלֹת ay tumutukoy sa mga sayaw o pagsasayaw. Ang kolektibong “sayawan” ay mas natural pagkatapos ng “makita” at hindi nagdaragdag ng interpretatibong diwa ng magulong pagsasaya.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: nag-alab ang galit ni Moises
  rationale: Pinananatili ng “nag-alab” ang matingkad na idyomang Hebreo tungkol sa nag-aapoy na galit, sa halip na pahinain ito bilang simpleng “nagalit.”
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: Inihagis niya mula sa kanyang mga kamay
  rationale: Ang שׁלך ay “ihagis.” Ginawang maramihan ang “mga kamay” bilang likas na Filipino sapagkat dalawang tapyas ang dala niya, bagaman pang-isahan ang anyong Hebreo.
- source_word: הַלֻּחֹת
  choice: ang mga tapyas na bato
  rationale: Ang “mga tapyas” ang katumbas ng לֻחֹת; idinagdag ang “na bato” para malinaw sa ordinaryong mambabasa kung anong mga tapyas ang tinutukoy, ayon sa hayag na paglalarawan sa kalapit na konteksto ng salaysay.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: at binasag ang mga iyon
  rationale: Ang שׁבר ay nangangahulugang basagin o durugin. Ang “binasag” ay tuwiran, natural, at sapat na nagpapahayag ng marahas na pagkawasak.
- source_word: תַּחַת הָהָר
  choice: sa paanan ng bundok
  rationale: Bagaman maaaring literal na “sa ilalim ng bundok,” ang parirala ay topograpikal dito; “sa paanan ng bundok” ang malinaw at natural na katumbas sa Filipino.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang matingkad na larawang “nag-alab ang galit,” habang ginawang natural ang daloy ng salaysay. Ang “guya” ay iniwang walang dagdag na “ginto” dahil hindi iyon binabanggit sa mismong talata, samantalang ang “na bato” sa “mga tapyas na bato” ay nagbibigay-linaw batay sa malinaw na kalapit na konteksto.
