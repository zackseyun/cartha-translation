    rationale: Bagaman malinaw ito sa malapit na konteksto, ang Hebreong talata ay simpleng tumutukoy sa "mga tapyas/tablets." Maaaring iwan ang "mga tapyas" upang huwag magdagdag ng impormasyong wala sa mismong talata.
