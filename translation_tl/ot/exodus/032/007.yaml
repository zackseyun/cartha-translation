source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Humayo ka, bumaba ka, sapagkat nagpakasama[a] ang iyong bayan na iniahon mo mula sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gumawi nang tiwali.” Maaaring idiin ng pandiwang Hebreo ang kanilang tiwaling asal sa halip na ang pagkasira nila sa kanilang sarili.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos,” at ang “sinabi” ay angkop na panimula sa tuwirang pananalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: לֶךְ רֵד
  choice: Bumaba ka
  rationale: Ang magkasunod na pautos ay bumubuo rito ng likas na Hebreong utos na humayo at bumaba. Ang “Bumaba ka” ang malinaw at natural na katumbas sa Tagalog nang hindi lumilikha ng artipisyal na pag-uulit.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos; ang “sapagkat” ay malinaw, marangal, at natural sa ganitong pahayag.
- source_word: שִׁחֵת
  choice: nagpakasama
  rationale: Naipapahayag nito ang kusang pagkakasangkot ng bayan sa katiwalian at ang kinalabasang moral na pagkasira, habang nananatiling maikli at natural.
- source_word: עַמְּךָ
  choice: ang iyong bayan
  rationale: Pinananatili ang panghalip na “iyong,” na mahalaga sa retorika dahil tinutukoy ni Yahweh ang Israel bilang bayan ni Moises sa gitna ng kanilang pagtataksil.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: na iniahon mo
  rationale: Ang “iniahon” ay nagpapanatili sa pataas na larawan ng causative na pandiwa at likas ding tumutukoy sa pagdadala sa kanila mula sa Ehipto.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwirang pinananatili nito ang “lupain” sa Hebreo habang nananatiling natural sa Tagalog.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang nasa teksto. Ang “Yahweh” ay nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Saklaw ng kahulugan ng שִׁחֵת
  choice: nagpakasama
  alternative: gumawi nang tiwali; pinasama ang kanilang sarili
  rationale: Maaaring idiin ng pandiwa ang tiwaling asal o ang sariling pagkasira ng bayan. Pinagsasama ng “nagpakasama” ang kusang pagkilos at kinalabasang katiwalian nang hindi labis na nilulutas ang saklaw ng pandiwa; inilalahad sa talababa ang alternatibong diin.
translation_notes:
  register: Makabago ngunit marangal na Tagalog, na may payak na ayos ng pangungusap at salitang madaling maunawaan. Ginamit ang “sapagkat” para sa bahagyang pormal na himig ng banal na pahayag, at iniwasan ang sobrang literal ngunit di-likas na pag-uulit sa utos.
