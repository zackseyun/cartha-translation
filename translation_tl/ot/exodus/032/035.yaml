  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: tl
  text: At hinampas ni Yahweh ang bayan dahil ginawa nila ang guya na ginawa ni Aaron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “At sinalot ni Yahweh ang bayan dahil ginawa nila ang guya na ginawa ni Aaron.” Ang pandiwang Hebreo ay maaaring mangahulugang “hampasin,” “pahirapan,” o “salutin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: sinalot
  rationale: Ang pandiwang נָגַף ay tumutukoy sa paghampas o pagpapahirap bilang hatol, at madalas ay may diwang salot. Likas sa Filipino ang “sinalot” at hindi nito ipinapalagay na namatay ang lahat ng tinamaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: הָעָם
  choice: ang bayan
  rationale: Tumutukoy ito sa sambayanan ng Israel bilang isang pangkat; ang “bayan” ay natural at marangal na salin sa kontekstong ito.
- source_word: עַל אֲשֶׁר
  choice: dahil sa
  rationale: Malinaw nitong ipinapahayag ang sanhi o batayan ng hatol.
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: ginawa nila sa guya
  rationale: Pinananatili nito ang malawak na kahulugan ng עשה at ang pananagutan ng bayan kaugnay ng guya, nang hindi ipinapantay ang kanilang kilos sa tiyak na paggawa ni Aaron na binabanggit sa kasunod na sugnay.
- source_word: הָעֵגֶל
  choice: ang guya
  rationale: “Guya” ang tuwirang kahulugan; hindi idinaragdag sa talata ang “ginto,” bagaman malinaw iyon sa mas malawak na konteksto.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: na ginawa ni Aaron
  rationale: Tuwirang tinutukoy ng sugnay ang guya bilang yaong ginawa ni Aaron.
theological_decisions:
- issue: Anyo ng hatol ng Diyos sa וַיִּגֹּף
  choice: sinalot ni Yahweh ang bayan
  alternative: hinampas ni Yahweh ang bayan
  rationale: Saklaw ng pandiwa ang paghampas o pagpapahirap, na madalas may diwang salot. Ipinahahayag ng “sinalot” ang hatol nang hindi nagdaragdag ng tiyak na sakit o nagsasabing namatay ang lahat.
- issue: Ugnayan ng ginawa ng bayan at ng ginawa ni Aaron
  choice: dahil sa ginawa nila sa guya na ginawa ni Aaron
  alternative: dahil ginawa nila ang guya na ginawa ni Aaron
  rationale: May kapansin-pansing tensiyon sa Hebreo sa pagitan ng maramihang “ginawa nila” at isahang “ginawa ni Aaron.” Pinananatili ng salin ang sama-samang pananagutan ng bayan at ang tahasang papel ni Aaron nang hindi pilit na nilulutas ang tensiyong iyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa sambayanang Israel at “sinalot” bilang likas na saling may saklaw na kapuwa paghampas at salot. Iniwasan ang pagdaragdag ng “gintong” dahil wala ito sa mismong talata.
