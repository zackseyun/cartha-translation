base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: tl
  text: At sinabi ni Moises, “Italaga ninyo ang inyong sarili ngayon kay YHWH, sapagkat ang bawat isa ay kumilos laban sa sarili niyang anak at kapatid, upang pagkalooban niya kayo ng pagpapala sa araw na ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: Italaga ninyo ang inyong sarili
  rationale: Literal na ‘punuin ninyo ang inyong kamay,’ isang idyomang maaaring tumukoy sa pagtatalaga sa tungkulin. Ang saling ito ay natural sa modernong Tagalog at pinananatili ang diwang kusang pag-aalay o pagtatalaga nang hindi ipinapasok ang mas tiyak na terminong denominasyonal na ‘ordinahan.’
- source_word: לַיהוָה
  choice: kay YHWH
  rationale: Tinutukoy ng Hebreo ang banal na pangalang apat na titik, hindi ang karaniwang titulong ‘Panginoon.’ Ang ‘YHWH’ ay tapat sa anyo ng pinagmulang teksto nang hindi nagpapasiya sa pinagtatalunang bigkas nito.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: sapagkat ang bawat isa ay kumilos laban sa sarili niyang anak at kapatid
  rationale: Eliptikal ang Hebreo—literal na ‘bawat lalaki laban/sa pamamagitan ng kanyang anak at kanyang kapatid’—at nauunawaan mula sa konteksto bilang pagkilos laban sa malalapit na kamag-anak. Idinagdag ang ‘kumilos’ upang maging malinaw sa Tagalog ngunit hindi tinukoy rito ang kilos nang higit sa sinasabi ng talata.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: upang pagkalooban niya kayo ng pagpapala sa araw na ito
  rationale: Pinananatili ang layuning ipinahahayag ng infinitive at ang di-tiyak na paksa ng pandiwang ‘magbigay’; ang ‘niya’ ay natural na tumutukoy kay YHWH sa pangungusap nang hindi ginagawang tahasan ang pangalan sa bahaging ito.
theological_decisions:
- issue: Kahulugan ng idyomang ‘punuin ang kamay’
  choice: Italaga ninyo ang inyong sarili
  alternative: Punuin ninyo ang inyong kamay / Ordinahan ninyo ang inyong sarili
  rationale: Ang idyoma ay may kaugnayan sa pagtatalaga, ngunit ang literal na anyo ay malabo sa karaniwang mambabasa at ang ‘ordinahan’ ay maaaring magpahiwatig ng kalaunang institusyong eklesiastiko. Ang ‘italaga’ ay malinaw at hindi denominasyonal.
- issue: Pagkakakilanlan ng nagbibigay ng pagpapala
  choice: Pinanatili ang panghalip na ‘niya’
  alternative: upang pagkalooban kayo ni YHWH
  rationale: Walang tahasang paksa ang anyong Hebreo sa huling parirala. Malamang na si YHWH ang tinutukoy, ngunit pinananatili ng panghalip ang bahagyang sintaktikong pagkalabo ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘YHWH’ bilang transliterasyon ng tetragrammaton. Iniwasan ang arkaikong ‘bawa’t,’ ang denominasyonal na ‘ordinahan,’ at ang sobrang literal ngunit di-malinaw na ‘punuin ang kamay.’
