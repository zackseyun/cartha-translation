base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: tl
  text: Nang makita ni Moises na wala nang pagpipigil ang mga tao—sapagkat hinayaan sila ni Aaron na mawalan ng pagpipigil[a] at maging tampulan ng pangungutya[b] ng mga kumakalaban sa kanila—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “wala nang kontrol” / “hinayaang mawalan ng kontrol.” Inuulit sa Hebreo ang iisang salitang-ugat para sa kalagayan ng mga tao at sa ginawa ni Aaron.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “paghamak” o “kahihiyan” sa gitna ng kanilang mga kalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita ni Moises
  rationale: Isinasabay ng anyong pasalaysay ang pagkakita ni Moises sa kasunod niyang pagkilos; natural na ipinahahayag ito sa Tagalog sa pamamagitan ng “Nang makita.”
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tumutukoy ito sa sambayanang Israel na nagkakatipon sa kampo; ang “mga tao” ang karaniwan at malinaw na katumbas sa kontekstong ito.
- source_word: כִּי פָרֻעַ הוּא
  choice: na wala nang kontrol ang mga tao
  rationale: Ipinahihiwatig ng anyo mula sa ugat na פרע ang pagkawala ng pagpipigil at kaayusan. Malinaw at likas sa makabagong Tagalog ang “wala nang kontrol,” nang hindi ito pinakikitid sa ideyang “hubad.”
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: sapagkat hinayaan sila ni Aaron na mawalan ng kontrol
  rationale: Inuulit dito ang ugat na פרע, ngayon ay kasama si Aaron bilang gumagawa. Inuulit din sa salin ang “kontrol” upang mapanatili ang ugnayang leksikal at ang pananagutan ni Aaron nang hindi sinasabing sinadya niya ang lahat ng kaguluhan.
- source_word: לְשִׁמְצָה
  choice: kaya naging tampulan sila ng pangungutya
  rationale: Ang שִׁמְצָה ay tumutukoy sa paghamak, panunuya, o kahiya-hiyang usap-usapan. Ang “naging tampulan ng pangungutya” ay natural na Tagalog at malinaw na naghahayag ng naging bunga.
- source_word: בְּקָמֵיהֶם
  choice: ng mga kumakalaban sa kanila
  rationale: Ang parirala ay mula sa pandiwang קום at literal na tumutukoy sa mga tumitindig laban sa Israel. Pinananatili ng “mga kumakalaban sa kanila” ang pandiwang diwa sa malinaw na Tagalog.
theological_decisions:
- issue: Moral at panlipunang diwa ng פרע
  choice: Isinalin bilang “wala nang kontrol” at “mawalan ng kontrol.”
  alternative: “wala nang pagpipigil,” “pinakawalan,” o “hubad/nakalantad”
  rationale: Bagaman maaaring magpahiwatig ang ugat ng pagkalag o pagkakalantad, nakatuon ang konteksto sa pagkawala ng pagpipigil at kaayusan sa ilalim ng pamumuno ni Aaron. Masyadong tiyak at posibleng mapanlinlang dito ang “hubad.”
- issue: Ugnayan ng לְשִׁמְצָה sa mga kalaban ng Israel
  choice: 'Isinalin bilang bunga: “kaya naging tampulan sila ng pangungutya ng mga kumakalaban sa kanila.”'
  alternative: “upang kutyain sila ng kanilang mga kalaban” o “bilang kahihiyan sa gitna ng kanilang mga kalaban”
  rationale: Maaaring ipahayag ng לְ ang layunin o bunga. Pinananatili ng salin ang posibleng resultang diwa nang hindi ipinapahiwatig na sadyang layunin ni Aaron na ipahiya ang Israel sa mga kalaban nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang putol na estruktura ng talata sa pamamagitan ng mahabang gitling dahil nagpapatuloy ang pangungusap sa susunod na talata. Inuulit ang “kontrol” upang katawanin ang pag-uulit ng ugat na פרע sa Hebreo.
