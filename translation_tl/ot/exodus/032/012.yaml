revisions:
- from: Bakit sasabihin ng mga Ehipsiyo[a], ‘Masama ang layunin niya sa paglalabas sa kanila—para patayin sila sa mga bundok at lubusang lipulin sa ibabaw ng lupa[b]’? Talikuran mo ang iyong nag-aalab na galit, at magbago ka ng pasiya tungkol sa kapahamakang ilalapat mo sa iyong bayan.[c]
  to: Bakit sasabihin ng mga Ehipsiyo[a], ‘Inilabas niya sila nang may masamang layunin—upang patayin sila sa mga bundok at lubusang lipulin sila mula sa ibabaw ng lupa[b]’? Iurong mo ang iyong nag-aalab na galit, at maglubag ka tungkol sa kapahamakang nakaamba sa iyong bayan.[c]
  rationale: Nilinaw ang pag-aalis “mula sa ibabaw ng lupa,” pinasimple ang pagpapahayag ng masamang motibo, at ginawang “maglubag ka” ang pangunahing panawagan upang maging likas ang Tagalog at manatiling tapat sa kahulugan. Iningatan ng talababa ang alternatibong pagsasalin para sa disputed anthropopathic phrasing.
