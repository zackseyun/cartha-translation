base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: tl
  text: Bakit sasabihin ng mga Ehipsiyo[a], ‘Inilabas niya sila nang may masamang layunin—upang patayin sila sa mga bundok at lubusang lipulin sila mula sa ibabaw ng lupa[b]’? Iurong mo ang iyong nag-aalab na galit, at maglubag ka tungkol sa kapahamakang nakaamba sa iyong bayan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bakit maaaring sabihin ng mga Ehipsiyo.” Pinananatili nito ang retorikal na puwersa ng Hebreong imperfect kasunod ng לָמָּה.
    reason: lexical_alternative
  - marker: b
    text: O “at ubusin sila mula sa ibabaw ng lupa.” Ang pandiwang Hebreo ay nagpapahiwatig ng ganap na paglipol.
    reason: lexical_alternative
  - marker: c
    text: O “at magbago ka ng pasiya tungkol sa kapahamakang nakaamba sa iyong bayan.” Gumagamit ang Hebreo ng pananalitang pantao sa pakiusap ni Moises.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Bakit sasabihin ng mga Ehipsiyo
  rationale: Likas na retorikal na tanong sa modernong Tagalog; ang ‘mga Ehipsiyo’ ay tumutukoy sa mga tao, hindi lamang sa lupain.
- source_word: בְּרָעָה הוֹצִיאָם
  choice: Masama ang layunin niya sa paglalabas sa kanila
  rationale: Ipinakikita ng בְּרָעָה ang masamang motibong ipaparatang ng mga Ehipsiyo sa Diyos, hindi lamang ang masamang kinalabasan.
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: para patayin sila sa mga bundok
  rationale: Direktang ipinahahayag ang layunin ng infinitive at pinananatili ang pangmaramihang ‘mga bundok.’
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: at lubusang lipulin sa ibabaw ng lupa
  rationale: Ang Piel ng כלה ay nagpapahiwatig ng ganap na pagwasak; natural sa Tagalog ang ‘lubusang lipulin’ at pinananatili ang larawan ng pagkawala sa ibabaw ng lupa.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Talikuran mo ang iyong nag-aalab na galit
  rationale: Ang imperatibong שׁוּב ay panawagang tumalikod sa galit; pinananatili ng ‘nag-aalab’ ang Hebreong metapora ng matinding init ng galit.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: at magbago ka ng pasiya tungkol sa kapahamakang ilalapat mo sa iyong bayan
  rationale: Pinananatili ang tunay na puwersa ng pakiusap ni Moises at nililinaw na ang רָעָה rito ay kapahamakang nagbabanta sa bayan, hindi moral na kasamaan sa Diyos.
theological_decisions:
- issue: Antropopatikong pananalita tungkol sa Diyos sa וְהִנָּחֵם
  choice: magbago ka ng pasiya
  alternative: maglubag ka / iurong mo
  rationale: Malinaw nitong pinananatili ang matapang at relasyonal na panawagan ni Moises nang hindi ipinahihiwatig na nagsisisi ang Diyos sa isang moral na pagkakamali. Ang talababa ay nagpapanatili ng alternatibong ‘maglubag.’
- issue: Kahulugan ng הָרָעָה kaugnay ng nagbabantang kilos ng Diyos
  choice: kapahamakan
  alternative: pinsala / sakuna / masama
  rationale: Ang ‘kapahamakan’ ay tumutukoy sa mapanirang hatol na nakalaan sa bayan at umiiwas sa pahiwatig na moral na masama ang Diyos, habang hindi pinapahina ang tindi ng banta.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘Ehipsiyo,’ ‘nag-aalab na galit,’ at ‘kapahamakan’ upang mapanatili ang bigat at larawan ng Hebreo nang walang lipas o sobrang teknikal na pananalita. Ang mga talababa [a], [b], at [c] ay nasa mismong teksto.
