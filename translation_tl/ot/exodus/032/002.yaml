base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: tl
  text: At sinabi sa kanila ni Aaron[a], “Alisin ninyo ang mga singsing na ginto na nasa mga tainga ng inyong mga asawa, mga anak na lalaki, at mga anak na babae, at dalhin ninyo ang mga iyon sa akin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Kalasin ninyo ang mga singsing na ginto …” Maaaring magpahiwatig ang pandiwang Hebreo ng marahas na paghugot o pagkalas sa mga palamuti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם אַהֲרֹן
  choice: At sinabi sa kanila ni Aaron
  rationale: Pinananatili ng “At” ang tuloy-tuloy na daloy ng salaysay, at tuwirang isinasalin ang tahasang panghalip na “sa kanila.”
- source_word: פָּרְקוּ
  choice: Alisin ninyo
  rationale: Likas at malinaw ito para sa pag-aalis ng alahas sa katawan. Maaari ring magpahiwatig ang pandiwang Hebreo ng marahas na paghugot o pagkalas, kaya inilagay ang alternatibo sa talababa.
- source_word: נִזְמֵי הַזָּהָב
  choice: mga singsing na ginto
  rationale: Ang נֶזֶם ay singsing na maaaring isuot sa ilong o tainga; nililinaw ng kasunod na parirala na narito ang mga ito sa tainga. Ang “mga singsing na ginto” ay natural sa modernong Tagalog.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: na nasa mga tainga ng
  rationale: Tuwirang pinananatili ang lokasyon ng mga singsing ayon sa pariralang Hebreo.
- source_word: נְשֵׁיכֶם
  choice: inyong mga asawa
  rationale: Sa konteksto ng sambahayan, ang tinutukoy ay mga asawang babae; natural sa Tagalog ang “mga asawa” nang hindi na kailangang ulitin ang kasarian.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: mga anak na lalaki, at mga anak na babae
  rationale: Pinananatili ang tahasang pagkakahiwalay ng mga anak na lalaki at mga anak na babae sa Hebreo.
- source_word: וְהָבִיאוּ אֵלָי
  choice: at dalhin ninyo ang mga iyon sa akin
  rationale: Ang “mga iyon” ay likas na pantukoy pabalik sa mga singsing at nagbibigay-linaw sa layon ng utos.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang pangmaramihang “ninyo” at “inyong” upang panatilihin ang bilang ng mga utos at tagapakinig. Iniwasan ang sobrang literal ngunit hindi likas na ayos ng salita.
