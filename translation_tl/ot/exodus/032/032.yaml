  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: tl
  text: Ngunit ngayon, kung patatawarin mo ang kasalanan nila—ngunit kung hindi, pakiusap, burahin mo ako mula sa aklat mo na isinulat mo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Ngunit ngayon
  rationale: Ipinahihiwatig nito ang agarang paglipat sa pakiusap ni Moises at ang bahagyang pagsalungat sa naunang sinabi.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: patatawarin mo ang kasalanan nila
  rationale: Ang נשׂא ay literal na ‘buhatin/dalhin,’ ngunit kapag kasalanan ang layon, isa itong idyoma para sa pagpapatawad o pag-aalis ng kasalanan. Likas at malinaw sa modernong Tagalog ang ‘patawarin.’
- source_word: וְאִם אַיִן
  choice: ngunit kung hindi
  rationale: Pinananatili ang putol at pasalungat na ikalawang kondisyon ng Hebreo.
- source_word: מְחֵנִי נָא
  choice: pakiusap, burahin mo ako
  rationale: Ang מחה ay tumutukoy sa pagbura o pagpawi, na angkop sa larawan ng isang nakasulat na aklat; ipinapahayag ng נָא ang taimtim na pagsusumamo.
- source_word: מִסִּפְרְךָ
  choice: sa aklat mo
  rationale: Maaaring mangahulugan ang סֵפֶר ng aklat, balumbon, o talaan. Ang ‘aklat’ ay natural at hindi nito nililimitahan ang eksaktong uri ng banal na talaan.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: na isinulat mo
  rationale: Tuwirang pinananatili ang sugnay na nagsasabing ang Diyos mismo ang sumulat sa aklat.
theological_decisions:
- issue: Ang tinutukoy ng “aklat mo”
  choice: aklat mo
  alternative: talaan mo / aklat ng buhay
  rationale: Hindi tahasang tinutukoy ng Hebreo kung ito ay talaan ng mga nabubuhay, aklat ng buhay, o ibang banal na talaan. Pinananatili ng payak na ‘aklat mo’ ang sadyang kalabuan.
- issue: Ang hindi natapos na unang kondisyon
  choice: panatilihin ang putol na pahayag sa pamamagitan ng gitling
  alternative: dagdagan ng ‘kung gayon, patawarin mo sila’
  rationale: Sa Hebreo, walang tahasang kasunod na sugnay ang ‘kung patatawarin mo ang kasalanan nila.’ Hindi dinaragdagan ng salin ang hindi sinabi, kaya nananatili ang bigat at tensiyon ng pakiusap.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang “pakiusap” upang mapanatili ang taimtim na tono nang hindi nagiging lipas ang pananalita. Pinanatili ng mahabang gitling ang biglang pagkaputol ng unang kondisyong Hebreo.
