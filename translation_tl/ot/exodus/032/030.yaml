  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: tl
  text: At nang sumunod na araw, sinabi ni Moises sa mga tao, “Kayo ay nagkasala ng isang malaking kasalanan.[a] At ngayon, aakyat ako kay Yahweh; baka makapagbayad-sala ako para sa kasalanan ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “nagkasala kayo ng isang malaking kasalanan.” Ang paggamit ng magkaugnay na pandiwa at pangngalan ay nagbibigay-diin sa bigat ng kanilang ginawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: At nang sumunod na araw
  rationale: Ipinahahayag nito ang pagkakasunod ng salaysay at ang araw matapos ang naunang mga pangyayari, sa natural na modernong Tagalog.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: sinabi ni Moises sa mga tao
  rationale: Tuwirang katumbas ng karaniwang pormula ng pagsasalita sa Hebreo at malinaw sa Tagalog.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: Kayo ay nagkasala ng isang malaking kasalanan
  rationale: Pinananatili ang tahasang panghalip na nagbibigay-diin at ang magkaugnay na pandiwa at pangngalang ‘nagkasala/kasalanan,’ na nagpapabigat sa tindi ng pagkakasala.
- source_word: וְעַתָּה
  choice: Ngayon
  rationale: Minamarkahan ang paglipat mula sa pagsaway tungo sa balak na pamamagitan ni Moises; hindi kailangang ulitin ang pangatnig dahil naipahahayag na ng bagong pangungusap ang transisyon.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: aakyat ako kay Yahweh
  rationale: Ang עלה ay ‘umakyat,’ angkop sa pag-akyat ni Moises patungo sa bundok at sa presensiya ng Diyos; ang יְהוָה ay isinalin bilang personal na pangalang Yahweh.
- source_word: אוּלַי אֲכַפְּרָה
  choice: baka maipagbayad-sala ko
  rationale: Ang ‘baka’ ay nagpapanatili sa kawalang-katiyakan o pag-asang ipinahahayag ng אוּלַי, samantalang ang ‘maipagbayad-sala’ ay naghahatid ng diwang pang-atonement ng Piel na כפר.
- source_word: בְּעַד חַטַּאתְכֶם
  choice: ang kasalanan ninyo
  rationale: Sa Tagalog, likas na pinamamahalaan ng pandiwang ‘maipagbayad-sala’ ang kasalanang tinutukoy; naipapahiwatig nito ang pagkilos alang-alang sa mga tao nang hindi mabigat ang pahayag.
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Ginagamit mismo ng tekstong Hebreo ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Lakas ng pahayag ni Moises tungkol sa pagbabayad-sala
  choice: baka maipagbayad-sala ko ang kasalanan ninyo
  alternative: maipagbayad-sala ko ang kasalanan ninyo / baka makamit ko ang kapatawaran sa kasalanan ninyo
  rationale: Hindi ginagarantiyahan ng Hebreo ang magiging bunga ng pamamagitan ni Moises. Pinananatili ng ‘baka’ ang pag-asa at kawalang-katiyakan, at hindi nito ipinapalit ang ‘kapatawaran’ sa mas tiyak na konsepto ng כפר.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Sadyang pinanatili ang bahagyang pag-uulit sa ‘nagkasala ... kasalanan’ upang maipakita ang diin ng Hebreo; ipinaliliwanag ito sa talababa.
