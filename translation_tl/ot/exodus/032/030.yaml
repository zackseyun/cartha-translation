  to: At nang sumunod na araw, sinabi ni Moises sa mga tao, “Kayo ay nagkasala ng isang malaking kasalanan.[a] At ngayon, aakyat ako kay Yahweh; baka makapagbayad-sala ako para sa kasalanan ninyo.”
