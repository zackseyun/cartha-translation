base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: tl
  text: Nang makita ito ni Aaron,[a] nagtayo siya ng altar sa harap nito. Pagkatapos, nagpahayag si Aaron, “Bukas ay magkakaroon ng kapistahan para kay Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Nang makita ni Aaron”; walang tahasang layon ang pandiwang “makita” sa Hebreo, ngunit ipinahihiwatig ng konteksto na ang guya ang tinutukoy. Ang “sa harap nito” ay maaari ring unawain bilang “sa harap niya,” na tumutukoy kay Aaron, bagaman mas malamang na ang guya ang tinutukoy.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita iyon ni Aaron
  rationale: Ang pandiwa ay nangangahulugang “nakita.” Idinagdag ang “iyon” ayon sa konteksto, na tumutukoy sa guya sa naunang talata; ang “Nang” ay likas na naghahayag ng pagkakasunod sa salaysay.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: nagtayo siya ng altar
  rationale: Likas at tuwirang salin ng בנה + מזבח; pinananatili ng “altar” ang kahulugang panrelihiyon at karaniwan ito sa makabagong Filipino.
- source_word: לְפָנָיו
  choice: sa harap niyon
  rationale: Ang hulaping panghalip ay panlalaking isahan at maaaring tumukoy sa guya o, sa gramatika, kay Aaron. Mas malamang sa konteksto na ang altar ay nasa harap ng guya; ang “niyon” ay hindi nagbibigay ng katauhan sa larawan.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: ipinahayag ni Aaron
  rationale: Sa konteksto, ang קרא ay isang pampublikong pagpapahayag. Hindi na inuulit ang literal na “ipinahayag at sinabi” dahil hindi iyon likas sa Filipino, ngunit napananatili ang diwa ng pormal na anunsiyo.
- source_word: חַג
  choice: kapistahan
  rationale: Ang חג ay isang relihiyosong pista o kapistahan. Ang “kapistahan” ay malinaw, marangal, at natural sa Filipino nang hindi labis na tinutukoy na ito ay isang pistang peregrino.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang לְ ay nagpapahayag dito ng pag-uukol o kaugnayan. Ang “para kay” ay natural sa Filipino, at ang pangalang tipan na יהוה ay isinaling “Yahweh.”
- source_word: מָחָר
  choice: Bukas ay magkakaroon ng
  rationale: Nominal ang pahayag sa Hebreo. Ang “Bukas ay magkakaroon ng” ay malinaw at natural na pagpapahayag sa Filipino ng nakaabang na kapistahan.
theological_decisions:
- issue: Pagbibigay-salin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Tinutukoy ng panghalip sa לְפָנָיו
  choice: ang altar ay itinayo sa harap ng guya o larawan
  alternative: ang altar ay itinayo sa harap ni Aaron
  rationale: Bagaman maaaring tumukoy kay Aaron ang hulapi ayon sa gramatika, mas malamang sa daloy ng salaysay na tumutukoy ito sa bagong ginawang guya. Pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” na higit na karaniwan at madaling maunawaan kaysa sa mas teknikal o makalumang mga katumbas. Iniwasan ang hindi natural na pag-uulit na “ipinahayag at sinabi,” habang pinanatili ang pampublikong katangian ng anunsiyo.
