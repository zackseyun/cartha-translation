  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: tl
  text: Sinabi ni Moises kay Aaron, “Ano ang ginawa ng bayang ito sa iyo kaya ipinasapit mo sa kanila ang isang malaking kasalanan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang salaysay sa nakaraan; natural sa modernong Filipino nang hindi kailangang isalin nang hiwalay ang panandang pang-ugnay.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Ano ang ginawa sa iyo ng bayang ito
  rationale: Pinananatili ang tuwirang tanong, ang diwang ‘ginawa sa iyo,’ at ang demonstratibong ‘bayang ito,’ na may bahagyang mapaglayong tono.
- source_word: כִּי
  choice: at
  rationale: Sa kontekstong ito, inuugnay nito ang ipinapalagay na ginawa ng bayan sa naging kilos ni Aaron; ang ‘at’ ay natural na nagpapahayag ng resultang ipinupukol sa tanong nang hindi tahasang nagpapasya sa pagitan ng sanhi at bunga.
- source_word: הֵבֵאתָ עָלָיו
  choice: ipinasapit mo sa kanila
  rationale: Ang Hiphil ng בוא ay causative, ‘magdala/magpasapit.’ Ang ‘ipinasapit’ ay malinaw na nagpapakitang si Aaron ang naging sanhi ng pagdating ng kasalanan sa bayan. Ang isahang panghalip Hebreo ay kolektibong tumutukoy sa הָעָם, kaya likas sa Filipino ang maramihang ‘kanila.’
- source_word: חֲטָאָה גְדֹלָה
  choice: isang malaking kasalanan
  rationale: Tuwirang pinananatili ang moral na kahulugan ng חטאה at ang paglalarawang ‘malaki,’ nang walang dagdag na pagpapatingkad na wala sa Hebreo.
theological_decisions:
- issue: Pananagutan ni Aaron sa kasalanan ng bayan
  choice: ipinasapit mo sa kanila ang isang malaking kasalanan
  alternative: inakay mo sila sa isang malaking kasalanan
  rationale: Tahasang iniuugnay ng Hebreo kay Aaron ang pagpapasapit ng malaking kasalanan sa bayan. Hindi ito pinalalambot bilang simpleng kaguluhan, ngunit hindi rin idinaragdag ang mas tiyak na larawang ‘inakay’ na wala sa pandiwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘bayan’ bilang kolektibong katawagan sa הָעָם at iniwasan ang mas makalumang ayos o labis na interpretatibong pananalita.
