base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: tl
  text: Kinabukasan, maaga silang bumangon at naghandog ng mga handog na sinusunog. Nagdala rin sila ng mga handog pangkapayapaan. Pagkatapos, umupo ang mga tao upang kumain at uminom, at saka tumayo upang magpakasaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “maglaro” o “magdiwang.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglalaro, pagdiriwang, o magulong pagpapakasaya. Sa kontekstong ito, malamang na hindi inosenteng libangan ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: Kinabukasan, maaga silang bumangon
  rationale: Ipinapahayag ng Hiphil ng שׁכם ang maagang pagbangon, at ang מִמָּחֳרָת ay tumutukoy sa sumunod na araw. Natural sa modernong Tagalog ang ayos na ito at napapanatili ang diin sa oras.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: naghandog ng mga handog na sinusunog
  rationale: Sa kontekstong pansakripisyo, ang parirala ay tumutukoy sa pag-aalay ng עֹלָה, isang handog na lubusang sinusunog. Malinaw ang salin at hindi nito ipinapalagay na alam ng karaniwang mambabasa ang teknikal na katawagang Hebreo.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: Nagdala rin sila ng mga handog pangkapayapaan
  rationale: Ang נגשׁ dito ay ‘magdala’ o ‘magharap’ ng handog. Pinananatili ng ‘handog pangkapayapaan’ ang natatanging uri ng handog na tinutukoy ng שְׁלָמִים nang hindi ito nililimitahan sa isang interpretasyon lamang gaya ng ‘handog para sa pagsasalu-salo.’
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: umupo ang mga tao upang kumain at uminom
  rationale: Direkta at natural nitong inilalarawan ang pagkakaupo ng bayan para sa pagkain at pag-inom.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: tumayo upang magpakasaya
  rationale: 'Malawak ang saklaw ng צחק: maaari itong mangahulugang maglaro, magdiwang, o magpakasaya nang walang pagpipigil. Pinananatili ng ‘magpakasaya’ ang likas na kalabuan ng pandiwa, habang nililinaw ng talababa ang masamang pahiwatig na ibinibigay ng konteksto.'
theological_decisions:
- issue: Pahiwatig ng לְצַחֵק sa pangyayari tungkol sa gintong guya
  choice: tumayo upang magpakasaya
  alternative: tumayo upang maglaro; tumayo upang magdiwang nang magulo
  rationale: Ipinahihiwatig ng pagsamba sa guya, piging, at kasunod na hatol na hindi inosenteng paglalaro lamang ang nangyari. Gayunman, hindi tahasang tinutukoy ng talata ang eksaktong uri ng kahalayan o kaguluhan. Kaya pinananatili sa pangunahing teksto ang mas malawak na kahulugan at inilalagay sa talababa ang negatibong kontekstuwal na pahiwatig.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Gumamit ng madaling maunawaang pananalitang pansakripisyo, iniwasan ang arkaikong bokabularyo, at pinanatili ang kalabuan ng huling pandiwang Hebreo sa pamamagitan ng talababa.
