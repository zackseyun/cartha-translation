  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: tl
  text: At sinunod ng mga anak ni Levi ang sinabi ni Moises, at noong araw na iyon ay bumagsak[a] mula sa sambayanan ang humigit-kumulang tatlong libong lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay “bumagsak,” isang karaniwang idyoma para sa pagkamatay o pagkasawi; maaari rin itong isaling “pinatay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ginawa
  rationale: Pinananatili ang tuwiran at malawak na diwa ng עשה; natural itong kaugnay ng pariralang “ayon sa sinabi ni Moises.”
- source_word: בְנֵי לֵוִי
  choice: mga anak ni Levi
  rationale: Tuwirang inililipat ang Hebreong pananalitang pampamilya, sa halip na gawing katawagang pangkat na “mga Levita.”
- source_word: כִּדְבַר מֹשֶׁה
  choice: ayon sa sinabi ni Moises
  rationale: Ang דָּבָר dito ay tumutukoy sa sinabi o utos ni Moises. Mas natural sa modernong Tagalog ang “sinabi” kaysa “salita,” habang nananatiling malapit sa diwa ng konstruksyong Hebreo.
- source_word: וַיִּפֹּל
  choice: bumagsak
  rationale: Pinananatili ang literal na idyomang Hebreo para sa pagkamatay o pagkasawi, nang hindi tahasang nagdaragdag ng pandiwang “pinatay.”
- source_word: מִן הָעָם
  choice: mula sa bayan
  rationale: 'Ipinahahayag ang partitive na diwa ng מִן: ang mga bumagsak ay kabilang sa mas malaking sambayanan.'
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural at malinaw na panandang temporal sa modernong Tagalog.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: humigit-kumulang tatlong libong lalaki
  rationale: Ang כְּ sa bilang ay nagpapahiwatig ng pagtatantiya, at ang “lalaki” ay tiyak na kumakatawan sa אִישׁ.
theological_decisions:
- issue: Paglalarawan sa mga nasawi sa konteksto ng paghatol
  choice: bumagsak ang humigit-kumulang tatlong libong lalaki
  alternative: pinatay ang humigit-kumulang tatlong libong lalaki; namatay ang humigit-kumulang tatlong libong lalaki
  rationale: Pandiwang “bumagsak” ang ginamit sa Hebreo, hindi isang tahasang pandiwa para sa pagpatay. Pinananatili ng salin ang idyoma at bigat ng salaysay nang hindi nilulutas ang paraan ng pagkamatay nang higit sa sinasabi ng mismong pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong ekspresyong “mga anak ni Levi” at ang idyomang “bumagsak,” habang ginawang natural ang כִּדְבַר מֹשֶׁה bilang “ayon sa sinabi ni Moises.”
