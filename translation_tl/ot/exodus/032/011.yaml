  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: tl
  text: Ngunit taimtim na nakiusap si Moises kay Yahweh, na kanyang Diyos[a]. Sinabi niya, “Yahweh, bakit mag-aalab ang galit mo laban sa iyong bayan, na inilabas mo mula sa lupain ng Ehipto sa pamamagitan ng dakilang kapangyarihan at malakas na kamay?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “hinanap ang mukha ni Yahweh na kanyang Diyos”; isang idyoma na nangangahulugang taimtim na humingi ng pabor o nakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל מֹשֶׁה אֶת־פְּנֵי
  choice: taimtim na nakiusap si Moises kay
  rationale: Ang piel ng חלה kasama ng ‘mukha’ ay isang idyoma ng masidhing paghiling ng pabor. Likas sa modernong Tagalog ang ‘taimtim na nakiusap kay,’ samantalang iniiwasan nitong ipahiwatig na minanipula o pinayapa lamang ni Moises ang Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהָיו
  choice: kanyang Diyos
  rationale: Malinaw sa konteksto ang pang-isahang kahulugan at pinananatili nito ang ugnayan ni Moises sa Diyos.
- source_word: לָמָה יְהוָה יֶחֱרֶה אַפְּךָ
  choice: Yahweh, bakit mag-aalab ang galit mo
  rationale: Pinananatili ng ‘mag-aalab ang galit’ ang metapora ng init sa Hebreo at natural itong tanong na retorikal sa Tagalog.
- source_word: בְּעַמֶּךָ
  choice: laban sa iyong bayan
  rationale: Sa konteksto ng galit, ang בְּ ay tumutukoy sa pinatutungkulan nito; pinananatili rin ng ‘iyong bayan’ ang panawagang nakabatay sa tipan.
- source_word: אֲשֶׁר הוֹצֵאתָ מֵאֶרֶץ מִצְרַיִם
  choice: na inilabas mo mula sa lupain ng Ehipto
  rationale: Malapit ito sa pormal na anyo at sa karaniwang paglalarawan ng pagliligtas sa Exodo.
- source_word: בְּכֹחַ גָּדוֹל
  choice: sa pamamagitan ng dakilang kapangyarihan
  rationale: Malinaw na ipinahahayag ang instrumental na gamit ng בְּ at ang diin sa kapangyarihan ng Diyos.
- source_word: וּבְיָד חֲזָקָה
  choice: at ng malakas na kamay
  rationale: Pinananatili ang kongkretong metapora at malapit na isinasalin ang חֲזָקָה bilang ‘malakas,’ bagaman maaari rin ang ‘makapangyarihang kamay.’
theological_decisions:
- issue: Antropomorpikong paglalarawan sa galit ng Diyos
  choice: mag-aalab ang galit mo
  alternative: magagalit ka
  rationale: Pinananatili ang metapora ng nag-aalab na galit at ang lakas ng pakiusap ni Moises nang hindi isinasalin nang labis na literal bilang pag-aalab ng ilong.
- issue: Paglalahad sa pakikiusap ni Moises
  choice: taimtim na nakiusap
  alternative: hinanap ang mukha/pabor
  rationale: Ipinahahayag ang kahulugan ng idyoma nang hindi nagpapasiya sa mas malawak na usaping teolohikal kung paano nauugnay ang pamamagitan ni Moises sa pasiya ng Diyos.
- issue: Pagsasalin ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pinananatili ang personal na pangalan ayon sa patakaran ng proyekto at sa anyo ng tekstong pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘taimtim na nakiusap’ para sa natural na pagpapahayag ng Hebreong idyoma, habang pinanatili ang mga metaporang ‘mag-aalab ang galit’ at ‘malakas na kamay.’
