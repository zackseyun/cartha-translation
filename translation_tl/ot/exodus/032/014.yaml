  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: tl
  text: At nagbago ng pasiya si Yahweh tungkol sa kapahamakang sinabi niyang gagawin niya sa kanyang bayan.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbago ng isip” o “nagsisi” tungkol sa kapahamakang sinabi niyang gagawin niya sa kanyang bayan.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “ang masama/kapahamakan.” Dito, tumutukoy ito sa ibinantang sakuna o pinsala, hindi sa masamang gawang moral ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: nagbago ng pasiya
  rationale: Ang Niphal ng נחם ay nagpapahayag dito ng pagtalikod sa naunang ipinahayag na gagawin. Natural ito sa makabagong Tagalog at pinananatili ang tunay na pagbabagong inilalarawan ng salaysay nang hindi ipinapaliwanag ang implikasyong teolohikal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: עַל הָרָעָה
  choice: tungkol sa kapahamakan
  rationale: Ang עַל ay tumutukoy sa bagay na kaugnay ng pagbabago ng pasiya, at ang רָעָה sa kontekstong ito ay kapahamakang ibinanta, hindi kasamaan sa moral.
- source_word: אֲשֶׁר דִּבֶּר
  choice: na sinabi niya
  rationale: Tuwirang tumutukoy ito sa naunang ipinahayag ni Yahweh at natural na umuugnay sa kasunod na pawatas.
- source_word: לַעֲשׂוֹת
  choice: gagawin niya
  rationale: Pinananatili nito ang payak na kahulugan ng עשׂה at malinaw na ipinahahayag sa Tagalog ang binabalak na kilos.
- source_word: לְעַמּוֹ
  choice: sa kanyang bayan
  rationale: Ang bayan ni Yahweh ang tatamaan ng ibinantang kapahamakan; ang “sa” ang natural na katumbas sa Tagalog.
theological_decisions:
- issue: Antropopatikong paglalarawan sa Diyos sa pandiwang נחם
  choice: nagbago ng pasiya
  alternative: umurong sa balak; nanghinayang
  rationale: Ipinakikita ng talata ang tunay na pagbabago sa ipinahayag na gagawin bilang tugon sa pamamagitan ni Moises. Hindi dapat alisin ng salin ang tensiyong ito o dagdagan ng paliwanag tungkol sa kalikasan ng Diyos; inilalagay sa talababa ang iba pang posibleng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa covenant people at pinanatili ang pangalang “Yahweh.”
