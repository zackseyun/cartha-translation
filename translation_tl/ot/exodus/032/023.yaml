source:
  edition: WLC
  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: tl
  text: At sinabi nila sa akin, ‘Gumawa ka para sa amin ng mga diyos[a] na mangunguna sa amin, sapagkat itong si Moises, ang taong nag-ahon sa amin mula sa lupain ng Ehipto—hindi namin alam kung ano na ang nangyari sa kaniya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang diyos na mangunguna sa amin.” Bagaman maramihan ang pangngalan at pandiwa sa talatang ito (“mga diyos … mangunguna”), isahan ang salin ng ilan dahil iisang imahen ng guya ang nasa nakapaligid na salaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: At sinabi nila sa akin
  rationale: Isinusulong ng wayyiqtol ang salaysay; likas sa modernong Tagalog ang “At sinabi nila sa akin” at hindi nito dinaragdagan ang ugnayang lohikal.
- source_word: עֲשֵׂה לָנוּ
  choice: Gumawa ka para sa amin
  rationale: Pinananatili nito ang pautos na anyo at ang diwang para sa kapakinabangan ng nagsasalita.
- source_word: אֱלֹהִים
  choice: mga diyos
  rationale: Maaaring isahan o maramihan ang pangngalan, ngunit ang kasamang pandiwang maramihan na יֵלְכוּ ay malakas na sumusuporta sa “mga diyos” sa talatang ito.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: na mangunguna sa amin
  rationale: Natural na ipinahahayag sa Tagalog ng “mangunguna” ang idyomang paglakad sa unahan bilang paggabay o pamumuno; hindi na kailangang markahan sa pandiwa ang bilang.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw nitong ipinakikita ang dahilang ibinigay ng bayan, sa dignified ngunit nauunawaang rehistro.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: itong si Moises, ang taong
  rationale: Pinananatili ng “itong si Moises” ang bahagyang mapaglayong diin ng demonstratibo, habang malinaw na naihahatid ng “ang taong” ang appositive.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: na nag-ahon sa amin mula sa lupain ng Ehipto
  rationale: Ang Hiphil ng עלה ay literal na “nagpaahon/nag-ahon”; ang “nag-ahon” ay maikli at pinananatili ang pataas na larawan ng Hebreo, habang ang “lupain ng Ehipto” ay ganap na kumakatawan sa parirala.
- source_word: לֹא יָדַעְנוּ
  choice: hindi namin alam
  rationale: Ang ganap na anyo ay nagpapahayag dito ng kasalukuyang kalagayan ng kawalan ng kaalaman; ito ang pinakanatural na Tagalog sa tuwirang sipi.
- source_word: מֶה הָיָה לוֹ
  choice: kung ano na ang nangyari sa kaniya
  rationale: Natural na Tagalog ito para sa idyomang nagtatanong sa sinapit ng isang tao; ipinahihiwatig ng “na” ang kalagayang umabot na sa kasalukuyan.
theological_decisions:
- issue: Kung isahan o maramihan ang אֱלֹהִים sa ulat ni Aaron
  choice: 'Maramihan: “mga diyos”'
  alternative: 'Isahan: “isang diyos”'
  rationale: Ang pandiwang יֵלְכוּ ay maramihan, kaya ang maramihang salin ang pinakamalapit sa gramatika ng talatang ito. Hindi nito sapilitang pinagkakasundo ang pananalita rito sa iisang imahen ng guya sa konteksto; inilalahad sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagbasa ng karaniwang mambabasa. Ginamit ang “sapagkat” at “lupain” para sa dignified na biblikal na rehistro, ngunit iniwasan ang lipas o labis na pormal na pananalita. Pinanatili ang pag-igting sa pagitan ng maramihang gramatika at ng iisang imahen sa konteksto.
