  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: tl
  text: Alalahanin mo sina Abraham[a], Isaac, at Israel, na mga lingkod mo, na pinanumpaan mo sa iyong sarili at sinabihan mo, ‘Pararamihin ko ang inyong lahi na gaya ng mga bituin sa langit, at ang buong lupaing ito na sinabi kong ibibigay ko ay ibibigay ko sa inyong lahi, at mamanahin nila iyon magpakailanman.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Jacob”—ang patriyarkang nang maglaon ay pinangalanang Israel. “Israel” ang mababasa sa tekstong Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Alalahanin mo
  rationale: Likas na pautos sa modernong Tagalog na nakatuon sa Diyos at pinananatili ang panawagang alalahanin ang tipan.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: sina Abraham, Isaac, at Israel
  rationale: Pinananatili ang pangalang Israel na tahasang nasa Hebreo, sa halip na palitan ito ng Jacob.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Ang 'mga lingkod' ay angkop sa katayuan nila bilang mga lingkod ng Diyos sa tipan, nang hindi ipinapasok ang di-kinakailangang diin ng 'mga alipin.'
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: na sinumpaan mo sa iyong sarili
  rationale: Inihahayag nito na ang Diyos mismo ang batayan o garantiya ng kanyang sumpa.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: at sinabihan mo
  rationale: Natural itong pambungad sa tuwirang sipi sa Tagalog habang tapat sa diwang 'nagsalita sa kanila.'
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Pararamihin ko ang inyong lahi
  rationale: Ang 'lahi' ay natural na kolektibong katumbas ng זֶרַע sa kontekstong tumutukoy sa mga inapo.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: na gaya ng mga bituin sa langit
  rationale: Natural at marangal na Tagalog na malinaw na nagpapanatili sa paghahambing.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: at ang buong lupaing ito
  rationale: Pinananatili ang demonstratibo at kabuuang saklaw ng lupang ipinangako.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: na sinabi ko
  rationale: Tuwirang pinananatili ang hiwalay na sugnay ng Hebreo nang hindi isinasama rito ang kasunod na pangakong 'ibibigay ko.'
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: ay ibibigay ko sa inyong lahi
  rationale: Tapat sa hinaharap na pangako at pare-pareho ang pagsasalin ng זֶרַע bilang 'lahi.'
- source_word: וְנָחֲלוּ
  choice: at mamanahin nila iyon
  rationale: Ang 'iyon' ay likas na idinagdag sa Tagalog bilang tahasang layon na tumutukoy sa lupa.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Karaniwan at marangal na katumbas na nagpapanatili sa walang-hanggang tagal ng pangako.
theological_decisions:
- issue: Paggamit ng Israel sa halip na Jacob para sa patriyarka
  choice: Panatilihin ang Israel sa pangunahing teksto
  alternative: Jacob
  rationale: Israel ang tahasang binabanggit ng tekstong Hebreo; pinananatili rin nito ang kabuluhan ng pangalang ibinigay sa patriyarka sa loob ng tipan.
- issue: Paglilipat ng pormula ng sumpa na בָּךְ
  choice: sa iyong sarili
  alternative: sa sarili mong pangalan
  rationale: Ang 'sa iyong sarili' ang tuwirang nagpapahayag na ang Diyos mismo ang pinanumpaan, nang hindi nagdaragdag ng salitang 'pangalan' na wala sa teksto.
- issue: Ugnayan ng אֲשֶׁר אָמַרְתִּי at אֶתֵּן
  choice: 'Panatilihing magkahiwalay: ''na sinabi ko ay ibibigay ko'''
  alternative: na sinabi kong ibibigay ko
  rationale: Pinananatili nito ang pormal na pagkakahiwalay ng relatibong sugnay at ng kasunod na pandiwang pangako, sa halip na pagsamahin ang mga ito sa interpretatibong paraphrase.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'iyong' at 'inyong' upang luminaw ang paglipat mula sa Diyos na kinakausap tungo sa maramihang mga patriyarka sa loob ng sipi.
