revisions:
- from: Alalahanin mo sina Abraham[a], Isaac, at Israel, na iyong mga lingkod, na sinumpaan mo sa iyong sarili at sinabihan mo, ‘Pararamihin ko ang inyong lahi na gaya ng mga bituin sa langit, at ang buong lupaing ito na sinabi ko ay ibibigay ko sa inyong lahi, at mamanahin nila iyon magpakailanman.’
  to: Alalahanin mo sina Abraham[a], Isaac, at Israel, na mga lingkod mo, na pinanumpaan mo sa iyong sarili at sinabihan mo, ‘Pararamihin ko ang inyong lahi na gaya ng mga bituin sa langit, at ang buong lupaing ito na sinabi kong ibibigay ko ay ibibigay ko sa inyong lahi, at mamanahin nila iyon magpakailanman.’
  rationale: Inayos ang dalawang parirala para maging likas at malinaw na Tagalog habang pinananatili ang lahat ng kahulugan ng Hebreo. Ang “na sinabi kong ibibigay ko” ay angkop na paraan sa Tagalog upang katawanin ang ellipsis sa “ang lupaing ito na sinabi ko, ibibigay ko,” nang hindi binabago ang saklaw ng pangako.
