revisions:
- from: 'At sinabi niya sa kanila, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Ibigkis ng bawat lalaki ang kanyang espada sa kanyang tagiliran. Magparoo’t parito kayo mula sa isang pasukan hanggang sa isa pa sa buong kampo, at patayin ng bawat lalaki ang kanyang kapatid, ng bawat lalaki ang kanyang kasama, at ng bawat lalaki ang taong malapit sa kanya[a].”'
  to: 'At sinabi niya sa kanila, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Ibigkis ng bawat lalaki ang kanyang espada sa kanyang tagiliran. Dumaan kayo at bumalik mula sa isang tarangkahan hanggang sa isa pang tarangkahan sa loob ng kampo, at patayin ng bawat lalaki ang kanyang kapatid, at ng bawat lalaki ang kanyang kasama, at ng bawat lalaki ang taong malapit sa kanya[a].”'
