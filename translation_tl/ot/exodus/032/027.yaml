language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanila, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Ibigkis ng bawat lalaki ang kanyang espada sa kanyang tagiliran. Dumaan kayo at bumalik mula sa isang tarangkahan hanggang sa isa pang tarangkahan sa loob ng kampo, at patayin ng bawat lalaki ang kanyang kapatid, at ng bawat lalaki ang kanyang kasama, at ng bawat lalaki ang taong malapit sa kanya[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang malapit sa kanya”; maaari ring isaling “ang kanyang kamag-anak” o “ang kanyang malapit na kamag-anak.”
    reason: Pinananatili ang leksikal na kalabuan ng קְרֹבוֹ.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: At sinabi niya sa kanila
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol nang hindi dinaragdagan ang temporal na diin.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Likas at marangal na katumbas sa modernong Tagalog ng pormulang naghahayag ng may-awtoridad na mensahe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang personal na pangalang Hebreo sa pamamagitan ng karaniwang transliterasyon sa halip na palitan ito ng isang titulo.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Ibigkis ng bawat lalaki ang kanyang espada sa kanyang tagiliran
  rationale: Ipinahahayag nang natural ang idyoma ng paghahanda o pagdadala ng sandata, habang pinananatili ang distributibong 'bawat lalaki.'
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: Magparoo’t parito kayo
  rationale: Ipinahahayag ang pabalik-balik na pagkilos na taglay ng magkatambal na pautos nang malinaw sa modernong Tagalog.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: mula sa isang pasukan hanggang sa isa pa sa buong kampo
  rationale: Ang 'pasukan' ay mas malinaw kaysa literal na 'pinto' para sa mga bukana ng kampo; ipinahahayag ng 'sa buong kampo' ang lawak ng pagkilos.
- source_word: וְהִרְגוּ
  choice: at patayin
  rationale: Tuwiran at malinaw na katumbas ng pandiwang nangangahulugang pumatay, nang walang idinagdag na larawan.
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: ng bawat lalaki ang kanyang kapatid, ng bawat lalaki ang kanyang kasama, at ng bawat lalaki ang taong malapit sa kanya
  rationale: Pinananatili ang tatlong ulit na distributibong אִישׁ at ang tatlong antas ng malapit na ugnayan. Ang huling parirala ay sadyang malawak upang hindi limitahan ang קְרֹבוֹ sa isang tiyak na uri ng kamag-anak.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyon sa halip na palitan ng titulo.
- issue: Pagpapanatili sa paulit-ulit na panlalaking distributibong אִישׁ
  choice: bawat lalaki ... bawat lalaki ... bawat lalaki
  alternative: bawat isa ... bawat isa ... bawat isa
  rationale: Mga lalaking Levita ang tuwirang kinakausap sa konteksto, at ang pag-uulit ay nagbibigay-diin sa indibiduwal at masakit na pananagutan ng utos.
- issue: Saklaw ng קְרֹבוֹ
  choice: ang taong malapit sa kanya
  alternative: ang kanyang kamag-anak; ang kanyang malapit na kamag-anak
  rationale: Maaaring tumukoy ang salita sa isang taong malapit o sa isang malapit na kamag-anak. Pinananatili sa teksto ang lawak ng kahulugan at inilalagay sa talababa ang mas tiyak na mga posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at tuwiran. Ginamit ang “ibigkis” bilang malinaw ngunit hindi lipas na paglalarawan ng pagsasakbat ng espada, at pinanatili ang mabigat na pag-uulit ng “bawat lalaki” kahit mas mahaba ito sa karaniwang pananalita.
