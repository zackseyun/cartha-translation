    rationale: Naipahihiwatig nito ang pabalik-balik na pagkilos, ngunit nilulubos nito ang dalawang magkaibang pautos sa isang idyoma. Ang “Dumaan kayo at bumalik” ay mas malapit sa pinagmulang teksto.
