  naturalness: Marangal at malinaw ang Tagalog. Ang “Dumaan kayo at bumalik” at “tarangkahan” ay natural sa modernong Filipino Tagalog at mas tiyak sa tagpo ng kampo.
  terminology: Ang “Yahweh,” “Diyos ng Israel,” “bawat lalaki,” at “taong malapit sa kanya” ay angkop. Pinananatili ng talababa ang hindi tiyak na saklaw ng קְרֹבוֹ nang hindi ipinipilit na kamag-anak lamang ang kahulugan.
