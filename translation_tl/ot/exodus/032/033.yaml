base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Moises, “Ang sinumang nagkasala laban sa akin ay buburahin ko mula sa aking aklat.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “aking aklat” sa talaan ng Diyos tungkol sa mga nasa ilalim ng kanyang pangangalaga; mas tiyak naman itong nauunawaan ng ilan bilang “aklat ng buhay.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “At sinabi” at napapanatili nito ang daloy ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֶל מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang natural na pananda sa Tagalog para sa taong kinausap; “Moises” ang karaniwang anyo ng pangalan sa Filipino.
- source_word: מִי אֲשֶׁר
  choice: Ang sinumang
  rationale: Ipinahahayag nito ang di-tiyak at panlahat na puwersa ng sugnay na Hebreo.
- source_word: חָטָא לִי
  choice: nagkasala laban sa akin
  rationale: Ipinakikita ng לִי na ang kasalanan ay nakatuon laban sa Diyos; ang aspektong naganap ay angkop sa konteksto.
- source_word: אֶמְחֶנּוּ
  choice: siya ang buburahin ko
  rationale: Ang מחה ay tumutukoy sa pagpawi o pagbura; malinaw at natural ang “buburahin” kasama ng metapora ng aklat. Ginamit ang “siya” sapagkat hindi karaniwang minamarkahan ng kasarian ang panghalip sa Tagalog.
- source_word: מִסִּפְרִי
  choice: sa aking aklat
  rationale: Sa Tagalog, likas na ipinahihiwatig ng “buburahin ... sa aking aklat” ang pag-aalis mula sa talaan, habang pinananatili ang payak na salitang “aklat” ng Hebreo.
theological_decisions:
- issue: Kalikasan ng “aking aklat”
  choice: Pinanatili ang metaporang “aking aklat” nang hindi tinutukoy kung anong uri ng banal na talaan ito.
  alternative: “aklat ng buhay,” “talaan ng mga nabubuhay,” o “talaan ng tipan”
  rationale: “Aking aklat” lamang ang sinasabi ng Hebreo. Ang pagdaragdag ng mas tiyak na katawagan sa pangunahing teksto ay magpapasya sa isang usaping sadyang hindi nililinaw ng talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pangalang Yahweh at ang di-tiyak na metapora ng banal na aklat. Ang marker na [a] ay inilagay kaagad pagkatapos ng “aklat,” ang mismong pariralang ipinaliliwanag nito.
