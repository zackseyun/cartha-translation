base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: tl
  text: Tumayo si Moises sa tarangkahan ng kampo at sinabi[a], “Sinumang nasa panig ni Yahweh ay lumapit sa akin.” At nagtipon sa kaniya ang lahat ng mga anak ni Levi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “Sino ang para kay Yahweh? Sa akin!” Nilinaw ng salin ang ipinahihiwatig na panawagang “lumapit sa akin.”'
    reason: lexical_alternative
  - marker: b
    text: 'O “lahat ng mga Levita.” Literal: “lahat ng mga anak ni Levi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: tumayo
  rationale: Tuwirang ipinapahayag ng עמד ang pagtayo ni Moises; natural ito sa makabagong Tagalog at hindi nagdaragdag ng pormal o militar na himig.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: sa pintuan ng kampo
  rationale: Ang שַׁעַר ay tarangkahan o pintuan. Ang “sa pintuan ng kampo” ay natural sa Tagalog at pinananatili ang konkretong larawan ng pasukan.
- source_word: מִי לַיהוָה
  choice: Sinumang panig kay Yahweh
  rationale: Literal itong “Sino ang para kay Yahweh?” ngunit sa konteksto ay hamon at panawagan ng katapatan. Ang “panig kay” ay malinaw at likas na Tagalog nang hindi ginagawang pag-aari ang diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin bilang personal na pangalang Yahweh sa halip na palitan ng titulong “PANGINOON.”
- source_word: אֵלָי
  choice: lumapit sa akin
  rationale: Elliptical ang Hebreo, literal na “sa akin!” Ang “lumapit sa akin” ang pinakamaliit na likas na paglalantad ng ipinahiwatig na utos sa Tagalog.
- source_word: וַיֵּאָסְפוּ
  choice: nagtipon
  rationale: Ang Niphal ng אסף ay tumutukoy sa pagtitipon o paglapit bilang isang pangkat; neutral ang “nagtipon” at walang idinadagdag na kulay-militar.
- source_word: אֵלָיו
  choice: sa kanya
  rationale: Pinananatili nito ang direksiyon ng pagkilos patungo kay Moises nang hindi idinaragdag ang ideyang “sa paligid niya.”
- source_word: כָּל בְּנֵי לֵוִי
  choice: ang lahat ng mga anak ni Levi
  rationale: Pinananatili ang literal at panlalaking katawagang panlipi na “mga anak ni Levi”; maaaring ipahayag nang mas maikli bilang “mga Levita.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng katapatan sa מִי לַיהוָה
  choice: Sinumang panig kay Yahweh
  alternative: Sino ang para kay Yahweh?
  rationale: Pinananatili ang diwa ng pagpapanig o katapatan habang inilalahad sa natural na Tagalog ang paggana nito bilang isang panawagan.
- issue: Panlalaking katawagang panlipi בְּנֵי לֵוִי
  choice: lahat ng mga anak ni Levi
  alternative: lahat ng mga Levita
  rationale: Tahasan sa Hebreo ang “mga anak ni Levi.” Pinananatili ito sa pangunahing teksto at inilalagay sa talababa ang mas karaniwang katumbas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kampo,” “panig,” at “nagtipon” bilang mga salitang madaling maunawaan, habang pinanatili ang personal na pangalang Yahweh at ang konkretong katawagang “mga anak ni Levi.”
