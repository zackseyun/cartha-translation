base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: tl
  text: At sinabi niya, “Hindi iyon sigaw ng tagumpay, at hindi rin iyon sigaw ng pagkatalo; tunog ng pag-awit ang naririnig ko.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tunog ng pagsigaw ang naririnig ko.” Ang mga anyong Hebreo mula sa ענה ay maaaring tumukoy sa pagtugon sa tinig o pagsigaw; maaari ring isalin nang mas pangkalahatan ang huling sugnay bilang “tunog ng pagsigaw ang naririnig ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi niya
  rationale: Pinananatili ang daloy ng Hebreong salaysay at ang panlalaking panghalip na tumutukoy kay Moises sa konteksto.
- source_word: קוֹל
  choice: sigaw / tunog
  rationale: Ang קוֹל ay pangkalahatang tunog; sa unang dalawang sugnay, likas ang “sigaw” dahil sa kontekstong pandigma, samantalang “tunog” ang mas natural sa huling sugnay.
- source_word: עֲנוֹת / עַנּוֹת
  choice: sigaw / pag-awit
  rationale: Maaaring tumukoy ang mga anyo mula sa ענה sa pagtugon sa tinig, pagsigaw, o pag-awit. Sa unang dalawang sugnay, ang pagkakaugnay sa tagumpay at pagkatalo ay nagpapahiwatig ng sigaw sa labanan; sa huli, umaangkop ang pag-awit sa pagsasaya sa paligid ng guya, habang itinatala sa talababa ang tunay na alternatibo.
- source_word: גְּבוּרָה
  choice: tagumpay
  rationale: Bagaman pangunahing tumutukoy sa lakas o kapangyarihan, sa paghahambing ng mga sigaw sa labanan ay likas nitong ipinahihiwatig ang matagumpay na sigaw.
- source_word: חֲלוּשָׁה
  choice: pagkatalo
  rationale: Kaugnay ito ng kahinaan, ngunit sa tuwirang pagsalungat sa גְּבוּרָה at sa kontekstong pandigma ay tumutukoy sa sigaw ng mga nagapi.
- source_word: אֵין
  choice: Hindi iyon / hindi rin iyon
  rationale: Natural na Filipino ang hulmaing ito para sa inuulit na pagtanggi at malinaw na tumutukoy sa tunog na pinag-uusapan.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: ang naririnig ko
  rationale: Ipinahahayag ng panghalip at participle ang kasalukuyang pandamang pagkarinig; natural itong isinasalin sa kasalukuyang aspekto sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “sigaw ng tagumpay/pagkatalo” para sa malinaw na kontekstong pandigma, at “pag-awit” sa huling sugnay dahil sa konteksto ng pagsasaya, nang hindi ikinukubli ang leksikal na kalabuan. Inilagay ang talababa pagkatapos ng buong sipi upang markahan ang alternatibong pagbasa sa huling sugnay.
