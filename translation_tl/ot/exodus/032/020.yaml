base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: tl
  text: Kinuha niya ang guya na ginawa nila, sinunog niya ito sa apoy, dinurog nang pino, ikinalat sa ibabaw ng tubig, at ipinainom niya ito sa mga anak ni Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita.” Sa Hebreo, “mga anak ni Israel,” isang karaniwang katawagan para sa buong bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: ang guya
  rationale: Karaniwang tumutukoy ang עֵגֶל sa guya o batang baka. Ang “guya” ay malinaw, likas, at pamilyar sa konteksto ng ginintuang guya.
- source_word: אֲשֶׁר עָשׂוּ
  choice: na ginawa nila
  rationale: Tinutukoy ng sugnay ang guyang ginawa na ng mga tao; natural sa Tagalog ang payak na “na ginawa nila.”
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: sinunog iyon sa apoy
  rationale: Tuwirang inilalarawan ng pandiwa at pariralang may pang-ukol ang pagsunog sa apoy; likas at kongkreto ang salin.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: dinurog nang pino
  rationale: Ang טחן ay paggiling o pagdurog, at ang דק ay pagiging pino o napakaliit. Inihahatid ng parirala ang resulta nang hindi labis na tinutukoy na naging pulbos.
- source_word: וַיִּזֶר
  choice: ikinalat
  rationale: Sa konteksto, tumutukoy ito sa pagpapangalat ng pinong labi ng guya; malinaw at kasalukuyang gamit ang “ikinalat.”
- source_word: עַל פְּנֵי הַמַּיִם
  choice: sa ibabaw ng tubig
  rationale: Pinananatili nito ang larawang literal na “sa mukha/ibabaw ng tubig” sa natural na Tagalog.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: ipinainom sa mga anak ni Israel
  rationale: Ang Hiphil ng שׁקה ay causative, “painumin/ipainom.” Pinananatili ng “mga anak ni Israel” ang hayag na anyo ng Hebreong בְּנֵי יִשְׂרָאֵל habang nananatiling nauunawaan sa Tagalog.
theological_decisions:
- issue: Paglalahad ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Hayagang “mga anak ni Israel” ang anyo ng Hebreo at isa itong pangkalahatang katawagan sa bayang tipan. Pinananatili ng pangunahing teksto ang pormang ito nang hindi nilulutas o pinapaliit ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng magkakasunod na pandiwang kilos upang mapanatili ang mabilis na daloy ng salaysay at ang konkretong detalye ng Hebreo.
