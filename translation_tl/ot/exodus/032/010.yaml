  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: tl
  text: Ngayon, hayaan mo ako[a], upang mag-alab ang galit ko laban sa kanila at ubusin ko sila[b]; at gagawin kitang isang dakilang bansa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pabayaan mo ako.”
    reason: lexical_alternative
  - marker: b
    text: O “lipulin ko sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ang panandang pandiskurso ay nag-uugnay sa naunang sinabi at nagpapakilala sa agarang utos; natural sa Filipino ang “Kaya ngayon.”
- source_word: הַנִּיחָה לִּי
  choice: hayaan mo ako
  rationale: Sa idyomang ito, ang Hiphil imperative ay nangangahulugang huwag pigilan o pabayaan ang nagsasalita. Ang “hayaan mo ako” ay tuwiran, kasalukuyan, at likas sa modernong Filipino.
- source_word: וְיִחַר אַפִּי
  choice: upang mag-alab ang galit ko
  rationale: Pinananatili ng “mag-alab” ang matingkad na metapora ng Hebreong idyoma para sa pagliyab ng galit. Ang “upang” ay angkop sa layunin o resultang ipinahihiwatig ng pagkakasunod sa utos.
- source_word: בָהֶם
  choice: laban sa kanila
  rationale: Malinaw nitong ipinapahayag ang direksiyon ng galit na tinutukoy ng pang-ukol sa konteksto.
- source_word: וַאֲכַלֵּם
  choice: at lipulin ko sila
  rationale: Ang Piel ng כלה ay nangangahulugang ubusin, wakasan, o lipulin. Ang “lipulin” ay natural at marangal sa Filipino at malinaw na naghahatid ng ganap na paghatol, habang itinatala sa talababa ang mas imahen-preserving na alternatibo.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: At gagawin kitang
  rationale: Likas na Filipino ang hulma na “gagawin kitang,” at tumpak nitong ipinahahayag ang paggawa kay Moises bilang pinagmulan o kinatawan ng bansang binanggit.
- source_word: לְגוֹי גָּדוֹל
  choice: isang dakilang bansa
  rationale: Ang גוי ay tuwirang “bansa” o pangkat ng bayan. Pinananatili ng “dakila” ang saklaw ng גָּדוֹל at ang alingawngaw ng pangakong tipan nang walang idinaragdag na paliwanag.
theological_decisions:
- issue: Antropopatikong paglalarawan sa galit ng Diyos
  choice: Pinanatili ang metaporang “mag-alab ang galit ko.”
  alternative: “Magalit ako sa kanila.”
  rationale: Matingkad ang larawan sa Hebreo. Ang pagpapanatili rito ay hindi nagpapalabnaw sa bigat ng banal na galit at paghatol.
- issue: Lakas ng utos na הַנִּיחָה לִּי kaugnay ng pamamagitan ni Moises
  choice: 'Isinalin bilang tunay at tuwirang utos: “hayaan mo ako.”'
  alternative: Ipaliwanag ito bilang di-tuwirang paanyaya kay Moises na mamagitan.
  rationale: Hindi ipinapaliwanag ng mismong talata kung retorikal o paanyaya ang utos. Hindi dapat isingit sa salin ang interpretasyong iyon.
- issue: Ugnayan ng utos at ng kasunod na galit at paglipol
  choice: Ginamit ang “upang” upang katawanin ang posibleng layunin o resulta.
  alternative: “At mag-aalab ang galit ko … at lilipulin ko sila.”
  rationale: Maaaring ipahiwatig ng Hebreong waw pagkatapos ng imperative ang layunin o resulta. Pinananatili ng “upang” ang ugnayang iyon nang hindi nilulutas kung alin sa dalawa ang nangingibabaw.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Iniwasan ang labis na arkaikong pananalita; pinanatili ang matinding metapora ng galit at ang tuwirang utos nang walang idinagdag na doktrinal na paliwanag.
