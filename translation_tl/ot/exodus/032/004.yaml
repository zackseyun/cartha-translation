  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מִ/יָּדָ֗/ם וַ/יָּ֤צַר אֹת/וֹ֙ בַּ/חֶ֔רֶט וַֽ/יַּעֲשֵׂ֖/הוּ עֵ֣גֶל מַסֵּכָ֑ה וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: tl
  text: Kinuha niya ito mula sa kanilang mga kamay at hinubog niya ito gamit ang isang kasangkapang pang-ukit[a], at ginawa niya itong isang guya na hinulma sa pamamagitan ng pagbubuhos. Pagkatapos ay sinabi nila, “Ang mga ito ang iyong mga diyos, Israel,[b][c] na nag-akyat sa iyo mula sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “panulat,” “pang-ukit,” o “pait”; pinagtatalunan ang eksaktong kahulugan ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: 'Ganito ang Hebreo: “Ang mga ito ang iyong mga diyos.” Madalas itong isalin ayon sa tradisyon bilang “Ito ang iyong diyos,” marahil dahil iisa ang larawang guya.'
    reason: alternative_reading
  - marker: c
    text: 'Sa ilang tradisyong tekstuwal: “sinabi niya,” sa halip na “sinabi nila.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: Kinuha niya ang mga iyon mula sa kanilang mga kamay
  rationale: Ang לקח ay karaniwang nangangahulugang ‘kumuha’ o ‘tumanggap.’ Ginawang maramihan ang bagay na tinutukoy sapagkat ang konteksto sa naunang talata ay ang mga gintong hikaw, samantalang pinanatili ang literal na ‘mula sa kanilang mga kamay.’
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: hinubog ang mga iyon sa pamamagitan ng isang kasangkapang pang-ukit
  rationale: Ang יצר ay tumutukoy sa sinasadyang paghubog ng isang artisan. Hindi tiyak ang eksaktong kahulugan ng חֶרֶט, kaya gumamit ng pangkalahatang ngunit malinaw na katawagan at inilagay sa talababa ang ibang posibilidad.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: ginawang isang binuhos na guya
  rationale: Ang מַסֵּכָה ay larawang metal na ginawa sa pamamagitan ng pagbubuhos ng tunaw na metal sa hulma. Ang ‘binuhos na guya’ ay likas at nauunawaan sa Filipino at pinananatili ang paraan ng paggawa.
- source_word: וַיֹּאמְרוּ
  choice: sinabi nila
  rationale: Maramihan ang pandiwa sa Masoretic Text at pinakamalinaw na tumutukoy sa mga tao. Hindi ito ginawang isahan sa pangunahing teksto.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Ang mga ito ang iyong mga diyos
  rationale: Kapwa maramihan ang demonstratibo at anyong morpolohikal ng pangngalan sa Hebreo. Pinanatili ang tunay na tensiyon sa iisang larawang guya sa halip na tahimik na gawing isahan.
- source_word: אֲשֶׁר הֶעֱלוּךָ
  choice: na nag-ahon sa iyo
  rationale: Pinananatili ng ‘nag-ahon’ ang diwang ‘nagpaakyat’ ng Hiphil ng עלה at ang karaniwang metapora ng pag-ahon mula sa Ehipto.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tapat ito sa buong pariralang Hebreo at angkop sa marangal na himig ng pormulang ito.
theological_decisions:
- issue: Maramihan o isahan sa pagpapahayag tungkol sa diyus-diyosan
  choice: Ang mga ito ang iyong mga diyos, Israel
  alternative: Ito ang iyong diyos, Israel
  rationale: Maramihan ang mga anyo sa WLC/Masoretic Text. Pinananatili ng salin ang gramatika at retorikal na tensiyon kahit iisa ang larawang guya; ibinibigay sa talababa ang tradisyonal na isahang salin.
- issue: Pananagutan ni Aaron sa paggawa ng larawan
  choice: Tuwirang iniugnay kay Aaron ang pagkuha, paghubog, at paggawa
  alternative: Ipalabas na tumanggap o nangasiwa lamang siya
  rationale: Ang sunod-sunod na pandiwang isahan sa Hebreo ay tuwirang nag-uugnay sa mga kilos sa paksa. Hindi dapat pagaanin ng salin ang kaniyang pananagutan.
- issue: Pagkakasunod at teknikal na ugnayan ng paghubog at pagbubuhos
  choice: Pinanatili ang sunod-sunod na mga sugnay ng Hebreo
  alternative: Gawing pantulong ang ‘paghubog’ sa ‘paggawa’ upang lutasin ang teknikal na hirap
  rationale: Isang kilalang kahirapan ang ugnayan ng pag-ukit at pagbubuhos. Ang pangunahing teksto ay hindi dapat magtakda ng prosesong hindi tiyak sa pinagmulan; ang talababa ay nagpapaalam sa leksikal na kawalang-katiyakan.
translation_notes:
  register: Makabago ngunit marangal na Filipino; iniwasan ang lipas na panawagang “O Israel.” Ginamit ang “kasangkapang pang-ukit” sa halip na isang labis na tiyak na modernong instrumento. Ang mga pangungusap ay malapit sa pagkakasunod ng Hebreo upang mapanatili ang pananagutan ni Aaron at ang hindi nalulutas na teknikal na hirap ng talata.
