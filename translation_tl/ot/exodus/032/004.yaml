  to: Kinuha niya ito mula sa kanilang mga kamay at hinubog niya ito gamit ang isang kasangkapang pang-ukit[a], at ginawa niya itong isang guya na hinulma sa pamamagitan ng pagbubuhos. Pagkatapos ay sinabi nila, “Ang mga ito ang iyong mga diyos, Israel,[b][c] na nag-akyat sa iyo mula sa lupain ng Ehipto.”
