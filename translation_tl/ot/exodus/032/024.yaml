  to: At sinabi ko sa kanila[a], ‘Sinumang may ginto ay mag-alis nito.’ Kaya ibinigay nila ito sa akin, at inihagis ko ito sa apoy, at lumabas ang guyang ito.
  rationale: Inayos ang anyo ng utos upang maging natural at sintaktikong magkakatugma sa Filipino. Pinanatili ang di-tiyak na saklaw ng Hebreong idyoma, ang ipinahiwatig na bagay na ginto, at ang walang-komentaryong pahayag ni Aaron na lumabas ang guya. Inayos din ang talababa upang hindi nito ulitin ang dating hindi tugmang panghalip at anyo ng pandiwa.
