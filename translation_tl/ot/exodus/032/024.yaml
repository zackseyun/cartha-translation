base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: tl
  text: At sinabi ko sa kanila[a], ‘Sinumang may ginto ay mag-alis nito.’ Kaya ibinigay nila ito sa akin, at inihagis ko ito sa apoy, at lumabas ang guyang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sino ang may ginto? Alisin ito.” Literal sa Hebreo: “Kanino ang ginto? Alisin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: At sinabi ko
  rationale: Pinananatili ang sunod-sunod na daloy ng salaysay ng wayyiqtol nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: לְמִי זָהָב
  choice: Sinumang may ginto
  rationale: Likas na Tagalog para sa literal na idyomang ‘kanino ang ginto,’ na may di-tiyak na kahulugang tumutukoy sa lahat ng nagtataglay nito.
- source_word: הִתְפָּרָקוּ
  choice: alisin ninyo iyon
  rationale: Sa konteksto, tumutukoy ang hitpael ng פרק sa pag-aalis ng suot na gintong palamuti; pinananatili ng ‘alisin’ ang sapat na lawak ng pandiwa.
- source_word: וַיִּתְּנוּ לִי
  choice: Kaya ibinigay nila iyon sa akin
  rationale: Ang ‘iyon’ ay likas na pagtukoy sa naunang ginto, at ipinahihiwatig ng ‘kaya’ ang pag-usad ng tugon sa utos.
- source_word: וָאַשְׁלִכֵהוּ
  choice: at inihagis ko iyon
  rationale: Tuwirang katumbas ng שלך; ang isahang panghalip ay tumutukoy sa ginto bilang kabuuang materyal.
- source_word: בָאֵשׁ
  choice: sa apoy
  rationale: Natural sa Tagalog ang ‘inihagis ... sa apoy’ at naipapahayag nito ang galaw patungo sa apoy.
- source_word: וַיֵּצֵא
  choice: at lumabas
  rationale: Tuwirang pinananatili ang di-karaniwang pahayag ni Aaron nang hindi ipinapaliwanag kung paano lumabas ang diyus-diyosan.
- source_word: הָעֵגֶל הַזֶּה
  choice: ang guyang ito
  rationale: Ang עגל ay batang baka o guya; ‘guya’ ang malinaw at nakaugaliang katawagan sa diyus-diyosan sa kontekstong ito.
theological_decisions:
- issue: Ang palusot ni Aaron tungkol sa pinagmulan ng diyus-diyosan
  choice: Isinalin nang payak ang ‘at lumabas ang guyang ito,’ nang walang dagdag na paliwanag.
  alternative: Lagyan ng mga salitang gaya ng ‘di-umano’ o ipahiwatig na mahimala ang paglabas nito.
  rationale: Ang teksto mismo ang naglalahad ng sinabi ni Aaron. Hinahayaan ng salin na ihayag ng konteksto ang pag-iwas niya sa pananagutan, sa halip na ipasok ang interpretasyon sa pangunahing teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘ginto,’ ‘apoy,’ at ‘guya’ bilang karaniwang salitang madaling maunawaan; pinanatili ang tuwiran at halos katawa-tawang paliwanag ni Aaron nang walang idinagdag na komentaryo.
