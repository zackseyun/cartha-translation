  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: tl
  text: At sinabi ni Aaron, “Huwag pong mag-alab ang inyong galit, panginoon ko. Alam mo ang bayan—nakahilig sila sa kasamaan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakatuon sila sa kasamaan” o “madali silang mahila sa kasamaan.” Idyomatiko ang Hebreong pananalita at inilalarawan ang bayan bilang may masamang hilig.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: At sinabi ni Aaron
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive, sa likas na anyong Filipino.
- source_word: אַל יִחַר אַף
  choice: Huwag pong mag-alab ang galit
  rationale: Pinananatili ang Hebreong metapora ng nag-aalab na galit habang gumagamit ng magalang at natural na pakiusap sa Filipino.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Magalang na tawag ito ni Aaron kay Moises, hindi banal na titulo. Ginamit ang maliit na titik upang maiwasang ipakahulugang tumutukoy sa Diyos.
- source_word: אַתָּה יָדַעְתָּ אֶת הָעָם
  choice: Kilala mo ang mga taong ito
  rationale: Sa konteksto, ang pandiwang 'alam/kilala' ay tumutukoy sa pagkakilala ni Moises sa ugali ng bayan. Ang 'mga taong ito' ay natural na pagtukoy sa kolektibong הָעָם.
- source_word: כִּי בְרָע הוּא
  choice: nakahilig sila sa kasamaan
  rationale: Ang Hebreo ay idyomatiko, literal na 'ito/siya ay nasa kasamaan,' na tumutukoy sa bayan bilang kolektibo. Ang 'nakahilig' ay nagpapanatili sa ideya ng masamang disposisyon nang hindi tiyak na ipinapakahulugang lubos na nakatalaga sila rito.
theological_decisions:
- issue: Ang אֲדֹנִי bilang tawag sa isang tao
  choice: aking panginoon
  alternative: ginoo ko; aking amo
  rationale: Si Moises ang kausap, kaya hindi ito isinaling parang banal na titulong 'Panginoon.' Gayunman, pinanatili ang mataas na paggalang at nakatataas na katayuang taglay ng salita.
- issue: Lakas ng paglalarawan sa masamang hilig ng bayan
  choice: nakahilig sila sa kasamaan
  alternative: nakatalaga sila sa kasamaan; likas silang gumagawa ng masama
  rationale: Hindi nilulutas nang labis ang idyomatikong Hebreo. Ipinahahayag ang pagkakakilanlan ng bayan sa masama ngunit iniiwasang magdagdag ng tiyak na doktrina tungkol sa likas na kalagayan o ganap na determinasyon.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “po” upang likas na ipakita ang paggalang ni Aaron kay Moises, kasabay ng “aking panginoon.” Ang maliit na titik sa “panginoon” ay naglilinaw na tao, hindi Diyos, ang tinutukoy.
