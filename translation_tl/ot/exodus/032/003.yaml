  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: tl
  text: At hinubad[a] ng buong bayan ang mga gintong singsing[b] na nasa kanilang mga tainga at dinala nila ang mga ito kay Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mariing tinanggal” o “puwersahang inalis.” Maaaring magpahiwatig ang pandiwang Hebreo ng mariing pagtanggal.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga gintong hikaw.” Sa kontekstong ito, ang salitang Hebreo para sa “mga singsing” ay maaaring tumukoy sa mga palamuti sa tainga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: hinubad
  rationale: Ang hitpael ng פרק ay tumutukoy dito sa pag-aalis ng mga palamuti mula sa sarili. Natural sa modernong Tagalog ang “hinubad,” habang maaari ring magpahiwatig ang pandiwa ng mas mariing pagtanggal.
- source_word: כָּל הָעָם
  choice: buong bayan
  rationale: Tinutukoy ng parirala ang buong nagkakatipong sambayanan bilang isang pangkat. Dignified at karaniwang salin sa kontekstong biblikal ang “buong bayan.”
- source_word: נִזְמֵי הַזָּהָב
  choice: mga gintong singsing
  rationale: Ang נֶזֶם ay palamuting hugis-singsing na maaaring isuot sa tainga o ilong. Pinananatili ng “mga gintong singsing” ang lawak ng salita, samantalang nililinaw ng kasunod na parirala na nasa mga tainga ang mga ito.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: na nasa kanilang mga tainga
  rationale: Tuwirang inilalarawan ng sugnay ang kinalalagyan ng mga singsing at natural itong pakinggan sa Tagalog.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: at dinala ang mga iyon kay Aaron
  rationale: Ang pandiwa ay nangangahulugang magdala. Tahasang inilagay ang “mga iyon” sa Tagalog upang malinaw na ang tinutukoy ay ang mga singsing.
