  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: tl
  text: Pagkatapos ay tumalikod si Moises at bumaba mula sa bundok, tangan sa kanyang kamay ang dalawang tapyas ng Patotoo. May sulat ang mga tapyas sa magkabilang panig; sa isang panig at sa kabila[a] ay may sulat ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa panig na ito at sa kabilang panig.”
    reason: Pinananatili ng alternatibo ang mas literal na demonstratibong anyo ng מִזֶּה וּמִזֶּה; pareho nitong tinutukoy ang dalawang panig ng mga tapyas.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: tumalikod
  rationale: Ipinahihiwatig ng pandiwa ang pagbabago ng direksiyon ni Moises bago siya bumaba. Likas sa salaysay ang “tumalikod” at hindi nito dinaragdagan ang kilos na nasa Hebreo.
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Tuwirang katumbas ito ng ירד at natural sa makabagong Filipino.
- source_word: הָהָר
  choice: ang bundok
  rationale: Sa konteksto ng Sinai, “bundok” ang malinaw at angkop na kahulugan ng הַר.
- source_word: שְׁנֵי לֻחֹת
  choice: ang dalawang tapyas
  rationale: Ang לֻחֹת ay mga tapyas o tabletang sulatan. Hindi idinagdag ang “bato” dahil hindi ito tahasang binanggit sa talatang ito, bagaman malinaw iyon sa kalapit na konteksto.
- source_word: הָעֵדֻת
  choice: ang Patotoo
  rationale: Pinananatili ng “Patotoo” ang teknikal at teolohikal na bigat ng עֵדוּת bilang katawagan sa dokumentong tipan, nang hindi ito ipinapakahulugan lamang bilang “tipan.”
- source_word: בְּיָדוֹ
  choice: sa kanyang kamay
  rationale: Pinanatili ang anyong isahan ng Hebreo. Ang “tangan sa kanyang kamay” ay dignidad at natural pa rin kahit dalawang tapyas ang dala.
- source_word: לֻחֹת כְּתֻבִים
  choice: may sulat ang mga tapyas
  rationale: Natural na Filipino ito para sa pasibong diwang “mga tapyas na sinulatan,” at hindi ipinapasok ang mas tiyak na ideya ng pag-ukit.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: sa magkabilang panig
  rationale: Malinaw nitong ipinapahayag na nasa dalawang panig ng mga tapyas ang sulat.
- source_word: מִזֶּה וּמִזֶּה
  choice: sa isang panig at sa kabila
  rationale: Pinananatili ang balanseng pag-uulit na nagbibigay-diin sa bawat panig.
- source_word: הֵם כְּתֻבִים
  choice: ay may sulat ang mga iyon
  rationale: Pinanatili ang muling pagbanggit ng Hebreo na ang mga tapyas ay may sulat, sa halip na alisin ito bilang kalabisan.
theological_decisions:
- issue: Kahulugan ng עֵדוּת sa pariralang “mga tapyas ng Patotoo”
  choice: Patotoo
  alternative: tipan; saksi
  rationale: Ang “Patotoo” ay nagpapanatili sa kinikilalang katawagang pangtipan at sa lawak ng salitang Hebreo, nang hindi nililimitahan ang kahulugan nito sa isang paliwanag na teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tangan” upang ilarawan nang maikli ang pagdadala, habang pinanatili ang isahang “kamay.” Iningatan din ang pag-uulit sa hulihan ng Hebreo upang manatili ang diin na kapuwa panig ay may sulat.
