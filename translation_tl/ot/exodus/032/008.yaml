  terminology: Ang “hinulmang imahen ng guya,” “nagpatirapa,” at “mga diyos mo” ay angkop. Pinananatili ng talababa ang lehitimong tensiyon sa pagitan ng hayagang maramihang Hebreo at ng iisang imahen sa konteksto.
