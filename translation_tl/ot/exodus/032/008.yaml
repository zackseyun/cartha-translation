  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: tl
  text: Mabilis silang lumihis sa landas na iniutos kong sundin nila. Gumawa sila para sa kanilang sarili ng hinulmang imahen ng guya, at nagpatirapa sila rito at naghandog ng mga hain dito. Sinabi nila, ‘Ang mga ito ang mga diyos mo, Israel,[a] na nag-ahon sa iyo mula sa lupain ng Ehipto.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Ito ang diyos mo, Israel.” Literal na maramihan ang Hebreo: “Ang mga ito ang mga diyos mo,” bagaman iisang imahen ng guya ang tinutukoy sa konteksto.'
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: Mabilis silang lumihis
  rationale: Pinananatili ng “lumihis” ang larawan ng pagtalikod mula sa isang daan, habang malinaw na ipinahihiwatig ng “mabilis” ang bigla at maagang pagsuway.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: sa daang ipinag-utos ko sa kanila
  rationale: Ang “daan” ay nagpapanatili sa metapora ng pamumuhay ayon sa utos; natural sa Filipino ang “ipinag-utos ko sa kanila.”
- source_word: עָשׂוּ לָהֶם
  choice: Gumawa sila para sa kanilang sarili
  rationale: 'Malinaw na ipinapakita ang reflexive na diwa ng לָהֶם: sila mismo ang gumawa o naglaan ng diyus-diyosan para sa sarili nila.'
- source_word: עֵגֶל מַסֵּכָה
  choice: hinulmang imahen ng guya
  rationale: Ipinahihiwatig ng מַסֵּכָה ang imaheng yari sa metal na ibinuhos o hinulma. Ang parirala ay malinaw sa modernong Filipino at hindi lamang naglalarawan ng buhay na guya.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: nagpatirapa sila rito
  rationale: Pinananatili ang pisikal na kilos ng pagpapatirapa sa halip na agad itong gawing pangkalahatang “sumamba.” Ang “rito” ay natural na tumutukoy sa imahen.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: naghandog dito
  rationale: Sa kontekstong panrelihiyon, malinaw na sakripisyal na paghahandog ang kilos. Ang “naghandog” ay likas at marangal na Filipino.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Ang mga ito ang mga diyos mo
  rationale: Pinananatili ang hayagang maramihang anyo ng אֵלֶּה at אֱלֹהֶיךָ, kahit iisang imahen ng guya ang tinutukoy sa konteksto.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: nag-ahon sa iyo mula sa lupain ng Ehipto
  rationale: Ang “nag-ahon” ay nagpapanatili sa literal na direksiyon ng Hiphil ng עלה at sa pamilyar na larawan ng pag-ahon mula sa Ehipto, nang hindi isinasalin lamang bilang “naglabas.”
theological_decisions:
- issue: Bilang ng אֱלֹהֶיךָ sa pahayag tungkol sa diyus-diyosan
  choice: 'Maramihan sa pangunahing teksto: “Ang mga ito ang mga diyos mo, Israel”'
  alternative: 'Isahan: “Ito ang diyos mo, Israel”'
  rationale: Hayagang maramihan ang gramatika ng Hebreo, ngunit iisang imahen ng guya ang tinutukoy. Pinananatili ng pangunahing teksto ang anyong Hebreo at inilalagay sa talababa ang makatwirang pagsasaling isahan upang hindi tahimik na lutasin ang tensiyon.
- issue: Kahulugan ng וַיִּשְׁתַּחֲווּ
  choice: “nagpatirapa sila rito”
  alternative: “sumamba sila rito”
  rationale: Tumutukoy muna ang pandiwa sa pisikal na pagpapatirapa. Ang mas kongkretong salin ay nagpapanatili sa sunod-sunod na kilos—pagpapatirapa, paghahandog, at pagsasalita—nang hindi pinagsasama ang mga ito sa pangkalahatang katawagang “pagsamba.”
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “nagpatirapa” para sa kongkretong kilos at “hinulmang imahen ng guya” para malinaw na metal na diyus-diyosan ang tinutukoy. Inilagay ang talababa sa mismong pahayag na may tensiyon sa bilang.
