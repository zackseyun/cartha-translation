base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: tl
  text: Ang mga tapyas ay gawa ng Diyos[a], at ang sulat ay sulat ng Diyos, na nakaukit sa mga tapyas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gawa ng Diyos ... sulat ng Diyos.” Inuulit sa Hebreo ang mga salitang “gawa” at “sulat” upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: ang mga tapyas
  rationale: Ang לֻחֹת ay tumutukoy sa mga tapyas na bato ng tipan; natural sa modernong Filipino ang “mga tapyas,” at hindi na idinagdag ang “bato” sapagkat hindi ito tahasang nasa talatang ito.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: gawa ng Diyos
  rationale: Pinananatili nito ang nominal na anyo ng Hebreo at ang tuwirang pag-uugnay ng mismong mga tapyas sa gawa ng Diyos.
- source_word: הֵמָּה
  choice: ay
  rationale: Ang malayang panghalip ay nagbibigay-diin sa Hebreo; sa Filipino, likas na naihahatid ng pangungusap na “ang mga tapyas ay gawa ng Diyos” ang pagtukoy nang hindi kailangang idagdag ang “ang mga iyon.”
- source_word: הַמִּכְתָּב
  choice: ang nakasulat
  rationale: Tumutukoy ang מִכְתָּב sa sulat o bagay na isinulat. Ang “nakasulat” ay malinaw at natural bilang paksa sa Filipino.
- source_word: מִכְתַּב אֱלֹהִים
  choice: sulat ng Diyos
  rationale: Pinananatili ang pag-uulit sa ugat na may diwang “sulat/pagsulat,” pati ang mariing pag-aari o pinagmulan nito sa Diyos.
- source_word: הוּא
  choice: ay
  rationale: Resumptibo at mariin ang panghalip sa Hebreo; sapat at natural sa Filipino ang panandang panaguri.
- source_word: חָרוּת
  choice: nakaukit
  rationale: Ipinahihiwatig nito ang mga titik na inukit o iniukit sa matigas na ibabaw, angkop sa mga tapyas.
- source_word: עַל הַלֻּחֹת
  choice: sa mga tapyas
  rationale: Likas na lokatibong salin ito sa Filipino para sa sulat na nakaukit sa ibabaw ng mga tapyas.
- source_word: וְ
  choice: at
  rationale: Ang pang-ugnay sa ikalawang sugnay ay tuwirang isinalin na “at.” Ang paunang וְ ay hindi binigyan ng hiwalay na panandang pandiskurso upang maiwasan ang pagdaragdag ng tahasang temporal na diwa.
theological_decisions:
- issue: Pagkilos ng Diyos sa mga tapyas at sa nakasulat
  choice: Kapuwa ang mga tapyas at ang sulat sa mga iyon ay tuwirang iniuugnay sa Diyos sa pamamagitan ng mga nominal na parirala.
  alternative: 'Maaaring gawing pandiwa: “Ang Diyos ang gumawa ng mga tapyas, at ang Diyos ang sumulat dito.”'
  rationale: Ang Hebreo ay gumagamit ng “gawa ng Diyos” at “sulat ng Diyos,” hindi ng mga tahasang pandiwang nagsasaad ng paraan ng paggawa o pagsulat. Pinananatili ng salin ang diin at hindi dinaragdagan ang detalye ng pagkilos.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “tapyas” sa halip na mas lumang “tapyas na bato” o hiram na “tablet”; pinanatili ang maikli at mariing estruktura ng Hebreo.
