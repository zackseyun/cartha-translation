  source_fidelity: 'Tumpak ang pangunahing diwa: iniutos na pangunahan ang bayan tungo sa lugar na ipinangako, ang anghel ng Diyos ay mauuna, at magkakaroon ng pananagutan dahil sa kasalanan. Gayunman, ang "aking pagsingil" ay mas karaniwang tumutukoy sa paniningil ng utang at hindi kasinglinaw ng Hebreong פָּקַד sa kontekstong banal na pagtutuos/pananagutan.'
  naturalness: Marangal at malinaw ang kabuuang Tagalog. Mas natural at angkop sa konteksto ang "araw ng aking pagtutuos" kaysa "araw ng aking pagsingil."
