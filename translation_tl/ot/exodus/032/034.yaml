  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: tl
  text: Ngunit ngayon, humayo ka at pangunahan mo ang bayan patungo sa lugar na sinabi ko sa iyo. Tingnan mo, mauuna sa iyo ang aking anghel. Ngunit sa araw ng aking pagtutuos, pananagutin ko sila dahil sa kanilang kasalanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֵה
  choice: pangunahan mo
  rationale: Tuwirang ipinahahayag ang utos na akayin o pamunuan ang bayan, sa natural na modernong Tagalog.
- source_word: מַלְאָכִי
  choice: aking anghel
  rationale: Pinananatili ang karaniwang kahulugan ng מַלְאָךְ bilang mensaherong makalangit, nang hindi tinutukoy ang pagkakakilanlan nito.
- source_word: פָּקַדְתִּי / וּפָקַדְתִּי
  choice: aking pagsingil / pananagutin ko
  rationale: Sa kontekstong ito, ang ugat na פקד ay tumutukoy sa pagdalaw upang maningil o magpataw ng pananagutan; ang magkaugnay na mga parirala sa Tagalog ay nagpapanatili sa hudisyal na diwa nang hindi nililimitahan ito sa pisikal na parusa.
- source_word: חַטָּאתָם
  choice: kanilang kasalanan
  rationale: Isahan ang anyong Hebreo na may pangmaramihang hulapi at natural itong isalin bilang kolektibong 'kanilang kasalanan.'
theological_decisions:
- issue: Pagkakakilanlan ng 'aking anghel'
  choice: Hindi tinukoy kung sino ang anghel.
  alternative: Tukuyin bilang isang partikular na banal na persona o karaniwang mensahero lamang.
  rationale: Malabo sa talata mismo ang tiyak na pagkakakilanlan; pinananatili ng salin ang gayong kalabuan.
- issue: Saklaw ng banal na pagsusulit o kaparusahan
  choice: Isinalin bilang pagsingil at pagpapanagot.
  alternative: '''Sa araw ng aking pagpaparusa, parurusahan ko sila.'''
  rationale: Saklaw ng פקד ang pagdalaw, pagsusuri, pagsingil, at pagpaparusa. Ang napiling salita ay nagpapanatili sa ideya ng banal na pananagutan at hindi sobra-sobrang nagpapakipot sa kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'humayo' dahil angkop ito sa solemne at biblikal na utos, habang nananatiling malinaw sa karaniwang mambabasa. Walang footnote dahil walang tekstuwal o leksikal na alternatibong kailangang ilagay sa mismong publikasyong talata.
