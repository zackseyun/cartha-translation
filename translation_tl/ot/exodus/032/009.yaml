  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: tl
  text: At sinabi ni Yahweh kay Moises, “Nakita ko ang bayang ito; tunay ngang bayang matigas ang batok ito[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang idyomang Hebreo na “matigas ang batok” ay tumutukoy sa pagiging sutil o ayaw magpasakop.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo.
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Natural na salaysay sa Tagalog na pinananatili ang pagkakasunod na ipinahihiwatig ng wayyiqtol.
- source_word: רָאִיתִי
  choice: Nakita ko
  rationale: Ang Hebreong perfect ay nagpapahayag ng natapos na pagmamasid na batayan ng kasalukuyang hatol; natural itong maipahayag sa Tagalog bilang “Nakita ko.”
- source_word: הָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang “bayan” ay natural na kolektibong katumbas ng עָם at pinananatili ng “ito” ang bahagyang mapaglayong tono ng demonstratibo.
- source_word: וְהִנֵּה
  choice: Talagang
  rationale: Sa kontekstong ito, natural na ipinahahayag ang pansin at mariing pagpapatunay ng הִנֵּה nang hindi gumagamit ng lipas o artipisyal na “narito.”
- source_word: קְשֵׁה עֹרֶף
  choice: matigas ang kanilang batok
  rationale: Pinananatili ang matingkad na Hebreong metapora habang ginagawang malinaw sa Tagalog na ang kolektibong bayan ang tinutukoy.
- source_word: הוּא
  choice: kanilang
  rationale: Bagaman kolektibong isahan ang reperente sa Hebreo, mas natural sa Tagalog ang pangmaramihang pagtukoy sa mga taong bumubuo sa bayan.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / ang PANGINOON
  rationale: Ang orihinal ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan nang hindi ito pinapalitan ng titulo.
- issue: Pagpapakahulugan sa קְשֵׁה עֹרֶף
  choice: matigas ang kanilang batok
  alternative: matigas ang ulo / sutil
  rationale: Pinananatili ang metapora at ang teolohikal na bigat ng paglaban at katigasan sa Diyos, samantalang ipinapaliwanag sa talababa ang idyomatikong diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” bilang natural na kolektibong tawag at pinanatili ang kongkretong metapora ng matigas na batok; ang talababa ang nagbibigay ng kahulugang idyomatiko.
