  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: tl
  text: Ngunit kung itatalaga niya ang babaeng iyon para sa kanyang anak na lalaki, pakikitunguhan niya siya ayon sa mga karapatan ng mga anak na babae.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ayon sa kaugaliang sinusunod para sa mga anak na babae.” Ang pariralang Hebreo ay maaaring tumukoy sa itinakdang karapatang legal o sa kinikilalang kaugalian ng pagtrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyon at ang kaibahan nito sa naunang kasong legal.
- source_word: לִבְנוֹ
  choice: para sa kanyang anak na lalaki
  rationale: Ang לְ ay tumutukoy sa paglalaan sa babae para sa anak sa konteksto ng kaayusang pangkasal; nililinaw ng “anak na lalaki” ang kasarian na tahasang nasa Hebreo.
- source_word: יִיעָדֶנָּה
  choice: itatalaga niya ang babae
  rationale: Pinananatili ng “itatalaga” ang pormal at legal na diwa ng יעד nang hindi ito pinakikitid sa mas tiyak na “ipagkakasundo” o “ipakikipagtipan.”
- source_word: כְּמִשְׁפַּט
  choice: ayon sa mga karapatan
  rationale: Sa kontekstong legal, ang מִשְׁפָּט ay maaaring tumukoy sa itinakdang karapatan o nararapat na pagtrato, hindi lamang sa kaugalian.
- source_word: הַבָּנוֹת
  choice: ng mga anak na babae
  rationale: Tuwirang katumbas ito ng tiyak na anyong Hebreo na “ang mga anak na babae” at pinananatili ang ugnayang pampamilya.
- source_word: יַעֲשֶׂה לָּהּ
  choice: pakikitunguhan niya ito
  rationale: Natural na Filipino ito para sa pagkilos o pagtupad ng obligasyon sa isang tao; ang “ito” ay tumutukoy sa babae nang hindi inuulit nang mabigat ang pangngalan.
theological_decisions:
- issue: Ang uri ng obligasyong dapat tuparin para sa babaeng itinalaga sa anak
  choice: Dapat siyang pakitunguhan ayon sa legal na mga karapatang nararapat sa mga anak na babae.
  alternative: Tumutukoy ang parirala sa nakaugaliang kaayusan o pagtrato sa mga anak na babae, lalo na sa pag-aasawa.
  rationale: Mas malakas ang legal na diwa ng מִשְׁפָּט sa konteksto, ngunit tunay na posible rin ang diwang “kaugalian”; kaya pinanatili sa teksto ang “mga karapatan” at inilagay sa talababa ang alternatibo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pormal na himig ng batas, ngunit iniwasan ang sobrang teknikal o denominasyonal na pananalita.
