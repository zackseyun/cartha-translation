  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: tl
  text: Kung pumasok siyang nag-iisa[a], aalis siyang nag-iisa; kung may asawa siya[b], aalis din ang kanyang asawa kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang idyomang Hebreo ay nangangahulugang pumasok siyang nag-iisa o walang kasamang asawa o sambahayan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, isang idyoma ito para sa lalaking may asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: nag-iisa
  rationale: Ang idyomang Hebreo ay tumutukoy sa pagpasok nang walang kasamang asawa o sambahayan. Likas at malinaw sa makabagong Tagalog ang “nag-iisa,” habang pinananatili ang mahalagang legal na kaibahan sa talata.
- source_word: יָבֹא
  choice: pumasok
  rationale: Pinananatili ng “pumasok” ang payak na kilos at ang pagtutulad nito sa kasunod na “aalis”; sa konteksto, ang tinutukoy ay ang pagpasok sa paglilingkod.
- source_word: יֵצֵא
  choice: aalis
  rationale: Sa batas na ito, tumutukoy ang pandiwa sa pag-alis mula sa paglilingkod. Ang “aalis” ay natural at hindi nagdaragdag ng ideyang higit sa mismong anyo ng Hebreo.
- source_word: בַּעַל אִשָּׁה
  choice: may asawa
  rationale: Idyoma ito para sa lalaking may asawa. Ang “may asawa” ang natural na katumbas sa Tagalog at iniiwasan ang alanganing literal na “asawang lalaki ng isang babae.”
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: aalis na kasama niya ang kanyang asawa
  rationale: Malinaw nitong ipinahahayag na ang asawa ng lalaki ay aalis na kasama niya, at pinananatili ang pag-uulit ng pandiwang “aalis.”
