  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: tl
  text: mata kapalit ng mata[a], ngipin kapalit ng ngipin, kamay kapalit ng kamay, paa kapalit ng paa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mata bilang kapalit ng mata, ngipin bilang kapalit ng ngipin, kamay bilang kapalit ng kamay, paa bilang kapalit ng paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: mata
  rationale: Tuwirang tumutukoy sa pisikal na mata at pinananatili ang maikli at magkakatulad na pormula ng batas.
- source_word: תַּחַת
  choice: kapalit ng
  rationale: Sa kontekstong legal, nagpapahayag ito ng pagtutumbas o katumbas na kabayaran, hindi ng lokasyong ‘sa ilalim ng.’ Likas sa modernong Filipino ang ‘kapalit ng’ at hindi nito ipinapaliwanag nang labis ang uri ng kaparusahan o kabayaran.
- source_word: שֵׁן
  choice: ngipin
  rationale: Karaniwang tawag sa pisikal na ngipin at umaangkop sa maikli at ritmikong pagkakasunod-sunod.
- source_word: יָד
  choice: kamay
  rationale: Pinananatili ang karaniwang pisikal na kahulugan at ang tuwirang pagtutumbas sa pormula.
- source_word: רֶגֶל
  choice: paa
  rationale: Bagaman maaari itong tumukoy sa mas malawak na bahagi ng ibabang biyas sa ilang konteksto, ‘paa’ ang pinakanatural at tiyak na katumbas sa pormulang ito.
theological_decisions:
- issue: Kalikasan ng pormulang legal
  choice: 'Pinanatili ang maikling pahayag ng katumbas na pagganti o kabayaran: ‘mata kapalit ng mata ... paa kapalit ng paa.’'
  alternative: ‘Ang kaparusahan ay dapat tumugma sa pinsalang ginawa.’
  rationale: Mga pangngalan lamang na pinag-uugnay ng תַּחַת ang nasa Hebreo. Ang mas paliwanag na salin ay magpapasya kung kaparusahan, literal na pagganti, o kabayaran ang tiyak na ipinag-uutos, samantalang hindi iyon nililinaw ng mismong talata.
translation_notes:
  register: Maikli, marangal, at madaling maunawaang modernong Filipino. Pinanatili ang terse na legal na pormula at ang apat na magkakatulad na pares ng Hebreo.
