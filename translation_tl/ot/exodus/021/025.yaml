lexical_decisions:
- source_word: כְּוִיָּה
  choice: paso
  rationale: Tumutukoy ito sa paso o bakas ng pagkakapaso. Ang “paso” ay maikli, natural, at angkop sa paulit-ulit na pormulang legal.
- source_word: תַּחַת
  choice: sa
  rationale: Sa kontekstong ito, ipinapahayag ng תַּחַת ang katumbas na ganti o kabayaran. Pinananatili ng “sa” ang maikli at pamilyar na ritmo ng pormulang “X sa X” sa Filipino.
- source_word: פֶּצַע
  choice: sugat
  rationale: Malawak itong tumutukoy sa sugat sa katawan. Ang “sugat” ay kongkreto at hindi nililimitahan ang kahulugan sa hiwa lamang.
- source_word: חַבּוּרָה
  choice: pasa
  rationale: Tumutukoy ito sa pasa, latay, o bakas na iniwan ng hampas. Ang “pasa” ang pinakamalinaw at pinakanatural na pangkalahatang salita sa modernong Filipino.
