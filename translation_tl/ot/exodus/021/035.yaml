  text: וְ/כִֽי יִגֹּ֧ף שֽׁוֹר אִ֛ישׁ אֶת שׁ֥וֹר רֵעֵ֖/הוּ וָ/מֵ֑ת וּ/מָ֨כְר֜וּ אֶת הַ/שּׁ֤וֹר הַ/חַי֙ וְ/חָצ֣וּ אֶת כַּסְפּ֔/וֹ וְ/גַ֥ם אֶת הַ/מֵּ֖ת יֶֽחֱצֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: tl
  text: At kung banggain ng baka ng isang tao ang baka ng kaniyang kapuwa at mamatay ito, [a] ipagbibili nila ang bakang buhay at paghahatian ang napagbentahan nito;[b] paghahatian din nila ang patay na baka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “suwagin”; ang pandiwang Hebreo ay tumutukoy sa malakas na pagtama ng baka.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “paghahatian ang salapi nito,” ibig sabihin, ang salaping napagbentahan ng buhay na baka.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “ang patay,” na tumutukoy sa patay na baka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyunal na gamit ng כִּי sa kasong legal.
- source_word: יִגֹּף
  choice: banggain
  rationale: Saklaw nito ang malakas na pagtama ng baka nang hindi ipinapalagay na sungay lamang ang ginamit; maaaring mangahulugan din ang pandiwa ng pagsuwag.
- source_word: שׁוֹר אִישׁ
  choice: baka ng isang tao
  rationale: Likas at malinaw na pagpapahayag sa Filipino ng pagmamay-ari sa kasong legal.
- source_word: שׁוֹר רֵעֵהוּ
  choice: baka ng kaniyang kapuwa
  rationale: Ang רֵעַ ay maaaring tumukoy sa kapuwa, kapitbahay, o kasama; ang “kapuwa” ay natural at sapat na malawak sa kontekstong legal.
- source_word: וָמֵת
  choice: at mamatay ito
  rationale: Tuwirang ipinahahayag ang bunga ng pagkakabangga habang pinananatili ang payak na ugnayan ng mga sugnay.
- source_word: וּמָכְרוּ
  choice: ipagbibili nila
  rationale: Ipinahahayag ang itinakdang susunod na hakbang sa kasong legal nang natural sa Filipino.
- source_word: הַשּׁוֹר הַחַי
  choice: ang bakang buhay
  rationale: Malinaw na tumutukoy sa bakang nanatiling buhay.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: at paghahatian ang napagbentahan nito
  rationale: Sa konteksto, ang literal na “salapi nito” ay ang salaping nakuha sa pagbebenta ng buhay na baka.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: paghahatian din nila ang patay na baka
  rationale: Nililinaw ang ipinahihiwatig na pangngalang “baka” sa literal na “ang patay,” nang hindi dinaragdagan ang tuntunin.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal, na may payak na himig ng batas. Ginamit ang “baka” bilang karaniwang katawagan sa hayop sa halip na ang mas teknikal na pagtukoy sa kasarian; ang legal na singular at pagkakasunod-sunod ng mga hakbang ay pinanatili.
