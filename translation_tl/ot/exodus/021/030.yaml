  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: tl
  text: Kung papatawan siya ng pantubos[a], magbabayad siya ng halagang pantubos para sa kanyang buhay, ayon sa lahat ng ipapataw sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang Hebreo ay gumagamit ng dalawang magkaugnay ngunit magkaibang salita: כֹּפֶר (“pantubos”) at פִּדְיֹן (“halagang pantubos”). Maaari ring isalin: “Kung atasan siyang magbayad ng pantubos, magbabayad siya ng pantubos para sa kanyang buhay ayon sa lahat ng ipapataw sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang nagpapahayag ng kondisyong kasunod ng naunang batas tungkol sa pananagutan ng may-ari ng baka.
- source_word: כֹּפֶר
  choice: pantubos
  rationale: Tumutukoy sa bayad na nagpapawalang-bisa sa parusa o nagkakaloob ng paglaya; pinananatili nito ang legal na diwa nang hindi nagdaragdag ng kultikong kahulugan.
- source_word: יוּשַׁת עָלָיו
  choice: ipapataw sa kanya
  rationale: Likas na legal na pananalita sa Filipino para sa obligasyong itinatalaga sa isang tao.
- source_word: וְנָתַן
  choice: ibibigay niya
  rationale: Pinananatili ang literal na pandiwang 'magbigay' at ang legal na bunga ng kondisyon.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: ang halagang pantubos sa kanyang buhay
  rationale: Ipinakikita na ito ang halagang ibinabayad upang matubos ang buhay, habang bahagyang pinananatili ang pagkakaiba nito sa unang terminong כֹּפֶר.
- source_word: נַפְשׁוֹ
  choice: kanyang buhay
  rationale: Sa kontekstong panghukuman, ang נֶפֶשׁ ay tumutukoy sa buhay ng tao, hindi partikular sa kaluluwang hiwalay sa katawan.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: ayon sa buong halagang ipapataw sa kanya
  rationale: Ipinahahayag ang ganap na pagsunod sa halagang itinakda; ang 'halagang' ay nilinaw mula sa konteksto ng bayad.
theological_decisions:
- issue: Kalikasan ng bayad sa konteksto ng pananagutang may parusang kamatayan
  choice: Isinalin bilang legal na 'pantubos' at 'halagang pantubos' nang hindi nagpapahiwatig ng kawalang-sala o kultikong pagbabayad-sala.
  alternative: Isalin ang dalawang termino bilang simpleng 'multa,' o gumamit ng mas mariing wikang tumutukoy sa pagbabayad-sala.
  rationale: Ang bayad ay ipinapataw upang matubos ang buhay ng taong mananagot mula sa parusang maaaring ilapat. Pinananatili ng salin ang legal at mapagtubos na diwa ng Hebreo nang hindi ito pinapasan ng dagdag na doktrina.
translation_notes:
  register: Modernong Filipino na may marangal at malinaw na legal na himig. Ginamit ang 'pantubos' sa halip na 'bayad-sala' upang maiwasan ang hindi kinakailangang kultiko o denominasyonal na pahiwatig.
