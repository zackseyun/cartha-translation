  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: tl
  text: Kapag nag-aaway ang mga lalaki at natamaan nila ang isang babaeng buntis, kaya lumabas ang kanyang mga anak[a], ngunit walang malubhang pinsala[b], tiyak na pagmumultahin ang nakasakit ayon sa halagang itatakda sa kanya ng asawa ng babae, at magbabayad siya ayon sa pasiya ng mga hukom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumabas ang kanyang mga anak.” Maaaring tumukoy ito sa panganganak nang wala sa panahon; isinasalin naman ito ng ilan bilang pagkalaglag.
    reason: lexical_alternative
  - marker: b
    text: Hindi tinutukoy ng Hebreo sa talatang ito lamang kung ang malubhang pinsala ay sa ina, sa anak o mga anak, o sa alinman sa kanila.
    reason: alternative_reading
  - marker: c
    text: Maaari ring isalin, “sa pamamagitan ng pasiyang legal” o “sa harap ng hukuman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Kapag
  rationale: Nagpapakilala ito ng isang sitwasyon sa batas; natural sa modernong Tagalog ang “kapag” nang hindi inaalis ang kondisyunal na diwa.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: may mga lalaking nag-aaway
  rationale: Pinananatili ang tahasang panlalaking pangmaramihan at ang diwa ng pisikal na alitan.
- source_word: וְנָגְפוּ
  choice: natamaan nila
  rationale: Ipinahahayag ang aktuwal na pagtama nang hindi ipinapalagay na sinadya ang pagtama sa buntis o kung gaano kalubha ang bunga nito.
- source_word: אִשָּׁה הָרָה
  choice: isang babaeng buntis
  rationale: Malinaw, natural, at kasalukuyang katumbas sa Tagalog.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: kaya lumabas ang kanyang mga anak
  rationale: Malapit sa literal na Hebreo at hindi nagpapasiya kung ito ay maagang panganganak, pagkalaglag, o ibang uri ng paglabas.
- source_word: אָסוֹן
  choice: malubhang pinsala
  rationale: Ipinahahayag ang mabigat na kapahamakang tinutukoy ng salita nang hindi nililimitahan sa kamatayan o tinutukoy kung sino ang napinsala.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: tiyak na pagmumultahin
  rationale: Ang anyong nagbibigay-diin ay isinalin sa “tiyak,” at ipinakikita ng kasunod na pagbabayad na pinansiyal na parusa ang konteksto.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: ayon sa ipapataw sa kanya ng asawa ng babae
  rationale: Pinananatili ang legal na diwa ng pagtatakda o pagpapataw ng halaga at wastong inuunawa ang בַּעַל bilang asawa sa kontekstong ito.
- source_word: וְנָתַן בִּפְלִלִים
  choice: magbabayad siya ayon sa pasiya ng mga hukom
  rationale: Natural na legal na Tagalog na ipinakikita kapwa ang pagbabayad at ang pormal na paghatol o pagsang-ayon ng mga awtoridad.
theological_decisions:
- issue: Kung ang paglabas ng mga anak ay pagkalaglag o maagang panganganak
  choice: Panatilihin ang literal at hindi tiyak na “lumabas ang kanyang mga anak.”
  alternative: “nakunan ang babae” o “nanganak siya nang wala sa panahon”
  rationale: Hindi tahasang nilulutas ng Hebreo kung buhay o patay ang mga anak sa paglabas; hindi dapat ipasok sa pangunahing teksto ang isang pinagtatalunang interpretasyon.
- issue: Kung kanino tumutukoy ang kawalan ng malubhang pinsala
  choice: Huwag tukuyin kung sa ina, sa mga anak, o sa alinman sa kanila ang pinsala.
  alternative: Tukuyin na ang pinsala ay sa babae lamang, o na saklaw nito kapwa ang babae at mga anak.
  rationale: Walang tahasang layon ang אָסוֹן sa talatang ito, kaya pinananatili ang tunay na kalabuan at teolohikal-etikal na tensiyon.
- issue: Papel ng asawa at mga hukom sa multa
  choice: Ipakita na ang asawa ang nagpapataw o humihingi ng halaga, ngunit ang pagbabayad ay ayon sa pasiya ng mga hukom.
  alternative: Unawain ang buong halaga bilang malayang itinatakda ng asawa, o isalin lamang na “sa harap ng hukuman.”
  rationale: Pinananatili nito ang dalawang sangkap ng Hebreo—ang pagtatakda ng asawa at ang pormal na prosesong hudisyal—nang hindi lubusang nilulutas ang eksaktong ugnayan nila.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig na angkop sa tekstong legal. Ginamit ang “mga anak” sa halip na mas teknikal na “mga supling” upang mapanatili ang karaniwang kahulugan ng יְלָדֶיהָ at ang sadyang kalabuan ng talata. Ang lahat ng panandang talababa [a], [b], at [c] ay nasa pangunahing teksto.
