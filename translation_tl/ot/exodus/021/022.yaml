  to: Kapag nag-aaway ang mga lalaki at natamaan nila ang isang babaeng buntis, kaya lumabas ang kanyang mga anak[a], ngunit walang malubhang pinsala[b], tiyak na pagmumultahin ang nakasakit ayon sa halagang itatakda sa kanya ng asawa ng babae, at magbabayad siya ayon sa pasiya ng mga hukom[c].
