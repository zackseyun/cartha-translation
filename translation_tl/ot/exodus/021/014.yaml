  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: tl
  text: Ngunit kung ang isang tao ay sadyang magplano[a] laban sa kanyang kapwa upang patayin siya sa pamamagitan ng pandaraya[b], kunin mo siya maging mula sa aking altar[c] upang mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sadyang kumilos laban” o “mapangahas na kumilos laban.” Ang pandiwang Hebreo ay nagpapahiwatig ng kusang-loob at sinadyang pagkilos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nang may katusuhan” o “nang mapanlinlang.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, kahit humanap siya ng kanlungan sa altar, kukunin pa rin siya roon upang ipapatay.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong kasalungat ng naunang kaso sa batas at natural itong pakinggan sa makabagong Tagalog.
- source_word: יָזִד
  choice: sadyang magbalak
  rationale: Ipinahahayag ng Hiphil ng זיד ang kusang-loob, mapangahas, at sinadyang pagkilos. Sa konteksto ng pagpatay, malinaw na ipinakikita ng “sadyang magbalak” ang intensiyon at paghahanda nang hindi ito ipinagkakamali sa aksidente.
- source_word: אִישׁ
  choice: isang tao
  rationale: Natural na pananalita ito sa makabagong Tagalog para sa isang indibidwal sa pangkalahatang probisyong legal; hindi kailangang limitahan sa kasariang lalaki ang saklaw ng tuntunin.
- source_word: עַל רֵעֵהוּ
  choice: laban sa kanyang kapwa
  rationale: Pinananatili ng “laban sa” ang diwang mapanlaban ng pang-ukol, at ang “kapwa” ay angkop sa רֵעַ bilang kapwa-tao o kasapi ng pamayanan.
- source_word: לְהָרְגוֹ
  choice: upang patayin ito
  rationale: Tuwirang isinasalin ang הרג bilang “patayin.” Ang “ito” ay tumutukoy sa kapwa at umiiwas sa mabigat na pag-uulit.
- source_word: בְעָרְמָה
  choice: sa pandaraya
  rationale: 'Ipinahahayag nito ang tuso at mapanlinlang na paraan o intensiyon. Hindi pinapantay ang salita sa יָזִד, kaya nananatili ang dalawang magkaugnay ngunit magkaibang diin: sinadyang pagbabalak at pandaraya.'
- source_word: מֵעִם מִזְבְּחִי
  choice: kahit mula sa aking altar
  rationale: Ang “mula sa aking altar” ay nagsasaad ng pagkuha sa taong nasa tabi o kanlungan ng altar; ipinakikita ng “kahit” ang implikasyong hindi siya mapangangalagaan ng sagradong lugar, nang hindi ito pinalalawak sa pangunahing teksto.
- source_word: תִּקָּחֶנּוּ
  choice: kunin mo siya
  rationale: Pinananatili ang ikalawang panauhang isahan at ang tuwirang bisa ng utos sa legal na pahayag.
- source_word: לָמוּת
  choice: upang mamatay
  rationale: Malapit ito sa anyong pawatas ng Hebreo at pinananatili ang layunin o resultang kamatayan nang hindi tahasang ipinapasok sa pangunahing teksto ang salitang “bitayin” o “pugutan.”
theological_decisions:
- issue: Kung nagbibigay ba ng kanlungan ang altar sa isang taong sadyang pumatay
  choice: Hindi pinangangalagaan ng altar ang taong nagbalak at pumatay nang may pandaraya.
  alternative: Ang altar ay lugar lamang na pinagmulan ng pagkuha sa nasasakdal, at hindi tuwirang tinatalakay ng talata ang karapatang magkanlong doon.
  rationale: Sa kontekstong legal, mariing ipinahihiwatig ng “mula sa aking altar” na hindi maaaring gamiting proteksiyon ang sagradong lugar laban sa parusa para sa sinadya at mapanlinlang na pagpatay. Pinananatili ang implikasyong ito ngunit inilalagay sa talababa ang paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may tuwirang tono ng batas. Ginamit ang “kapwa” sa halip na mas makitid na “kapitbahay,” at pinanatili ang ikalawang panauhang isahan sa “kunin mo” ayon sa anyong Hebreo.
