  to: Ngunit kung ang isang tao ay sadyang magplano[a] laban sa kanyang kapwa upang patayin siya sa pamamagitan ng pandaraya[b], kunin mo siya maging mula sa aking altar[c] upang mamatay.
  rationale: Pinalitan ang hindi gaanong likas na “sadyang magbalak” ng “sadyang magplano,” at ginawang “siya” ang panghalip para sa kapwang tao. Nilinaw ang mapanlinlang na paraan sa “sa pamamagitan ng pandaraya.” Pinanatili ang “maging mula sa aking altar” upang maihatid ang diin ng audit trail nang hindi pinalalawak ang pangunahing teksto.
