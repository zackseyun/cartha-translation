    rationale: Ang “magbalak” ay karaniwang humihingi ng nilalaman ng balak, gaya ng “magbalak na patayin.” Ang “magplano laban sa” ay mas natural habang pinananatili ang sinadya at pinag-isipang pagkilos ng יָזִד.
