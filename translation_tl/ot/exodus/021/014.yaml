  naturalness: Mas natural at malinaw ang “sadyang magplano laban sa kanyang kapwa upang patayin siya” at ang panghalip na “siya.” Ang “maging mula sa aking altar” ay marangal at likas na paraan upang ihatid ang diin ng English audit trail na “even from my altar.”
  terminology: Pinananatili ang legal na rehistro sa “kunin mo siya” at “upang mamatay.” Ginamit ang “kapwa” para sa רֵעֵהוּ at “sa pamamagitan ng pandaraya” para sa בְעָרְמָה, na nagpapahiwatig ng tuso o mapanlinlang na paraan nang hindi ipinapasok ang isang mas tiyak na paraan ng pagpatay.
