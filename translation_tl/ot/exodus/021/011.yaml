translation_notes:
  register: Makabago at dignidad na Filipino para sa tekstong legal. Ginamit ang “babae” sa halip na paulit-ulit na panghalip upang malinaw ang tinutukoy; iniwasan ang labis na teknikal o denominasyonal na pananalita.
