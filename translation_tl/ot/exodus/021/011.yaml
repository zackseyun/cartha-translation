  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: tl
  text: At kung hindi niya gagawin ang tatlong ito para sa kanya[a], makalalaya siya nang walang bayad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kung hindi niya ilalaan sa kanya ang tatlong ito.” Sa Hebreo, literal na “hindi niya gagawin para sa kanya ang tatlong ito,” na tumutukoy sa pagkain, damit, at karapatan sa pagsasama bilang mag-asawa na binanggit sa nakaraang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na ו at ang kondisyong ipinakikilala ng אִם bilang pagpapatuloy ng naunang batas.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: ang tatlong ito
  rationale: Tumutukoy pabalik sa tatlong obligasyong binanggit sa nakaraang talata; natural sa Filipino kahit hindi na idagdag ang salitang “bagay.”
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: hindi niya gagawin para sa babae
  rationale: Malapit sa malawak na kahulugan ng עשה na “gawin,” at pinananatili ang posibilidad na unawain ito bilang pagtupad o paglalaan ng tatlong obligasyon.
- source_word: וְיָצְאָה חִנָּם
  choice: palalayain ang babae
  rationale: Sa konteksto ng batas tungkol sa pagkaalipin, ang paglabas nang walang halaga ay pagkalaya. Ang pasibong anyo ay natural sa Filipino at malinaw na naghahayag ng legal na pagpapalaya.
- source_word: אֵין כָּסֶף
  choice: nang walang bayad
  rationale: Ipinahahayag na walang salaping kailangang ibayad para sa kanyang paglaya, nang hindi ipinapalagay kung sino ang magbabayad.
