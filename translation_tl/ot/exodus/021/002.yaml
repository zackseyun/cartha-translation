id: EXO.21.2
reference: Exodus 21:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: tl
  text: Kung bibili ka ng aliping Hebreo[a], maglilingkod siya sa loob ng anim na taon; ngunit sa ikapitong taon ay lalaya siya nang walang bayad.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapag bumili ka ng aliping Hebreo.” Ang salitang Hebreo na isinaling “kung” ay maaaring magpasimula ng isang kasong saklaw ng batas sa diwang “kung” o “kapag.”
    reason: grammatical_alternative
  - marker: b
    text: 'Mas literal: “lalabas siya tungo sa kalayaan nang walang bayad.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagsisimula ito ng isang kasong saklaw ng batas. Likas sa makabagong Filipino ang “kung”; posible rin ang “kapag,” gaya ng nakasaad sa talababa.
- source_word: תִקְנֶה
  choice: bibili ka
  rationale: Ang Qal ng קנה ay tumutukoy rito sa pagbili o pagkuha sa isang legal at komersiyal na konteksto; tuwiran at malinaw ang “bibili.”
- source_word: עֶבֶד עִבְרִי
  choice: aliping Hebreo
  rationale: Ipinahihiwatig ng pagbili at takdang panahon ng paglilingkod ang kalagayang pagkaalipin, kaya hindi ito pinalalambot bilang simpleng “lingkod.” Pinananatili rin ang tiyak na katawagang “Hebreo.”
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: maglilingkod siya sa loob ng anim na taon
  rationale: Natural sa Filipino ang ayos na ito para sa takdang haba ng paglilingkod, habang pinananatili ang kahulugan ng עבד na maglingkod o magtrabaho.
- source_word: וּבַשְּׁבִעִת
  choice: ngunit sa ikapitong taon
  rationale: Bagaman payak na pangatnig ang ו, malinaw ang paghahambing sa anim na taon at sa taon ng paglaya. Inilantad ang ipinahihiwatig na “taon” upang maging natural at malinaw sa Filipino.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: lalaya siya
  rationale: Ang literal na larawan ay “lalabas tungo sa kalayaan,” ngunit “lalaya” ang natural at tumpak na katumbas sa Filipino; pinananatili sa talababa ang mas literal na anyo.
- source_word: חִנָּם
  choice: nang walang bayad
  rationale: Ipinahihiwatig na walang kailangang ibayad para sa paglaya. Mas tumpak ito rito kaysa sa “nang libre,” na maaaring maging masyadong impormal o malabo.
theological_decisions:
- issue: Paglalarawan sa legal na kalagayan ng עֶבֶד
  choice: alipin
  alternative: lingkod; aliping-lingkod
  rationale: Ang taong tinutukoy ay binili at nasa sapilitang nakataling paglilingkod sa loob ng itinakdang panahon. Ang “alipin” ang malinaw na naglalahad ng kalagayang iyon at umiiwas sa pagpapalambot ng teksto, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “alipin” upang tapat na ihayag ang nakataling legal na kalagayan, at “lalaya” bilang natural na Filipino para sa idyomang Hebreo ng paglabas tungo sa kalayaan.
