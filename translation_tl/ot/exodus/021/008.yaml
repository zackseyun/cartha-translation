base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: tl
  text: Kung hindi siya kalugud-lugod sa paningin ng kanyang amo, na hindi nagtalaga sa kanya para sa kanyang sarili,[a] dapat niyang pahintulutang matubos siya. Wala siyang karapatang ipagbili siya sa mga banyaga, sapagkat nagtaksil siya sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “na nagtalaga—o nakipagkasundo upang mapangasawa—sa kanya para sa kanyang sarili.” Mahirap ang tekstong Hebreo at iba-iba ang pagkaunawa rito.'
    reason: textual_variant
  - marker: b
    text: 'O: “sapagkat hindi siya naging tapat sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: hindi siya kalugud-lugod sa paningin ng
  rationale: Ipinahahayag ng idyoma na hindi siya nakalulugod o katanggap-tanggap sa amo; pinananatili ng “sa paningin” ang larawang Hebreo sa natural at marangal na Tagalog.
- source_word: אֲדֹנֶיהָ
  choice: kanyang amo
  rationale: Sa kontekstong legal, tumutukoy ito sa lalaking bumili at may kapangyarihang panlipunan at legal sa babae. Ang “amo” ay malinaw at hindi nagpapahiwatig ng banal na titulong “Panginoon.”
- source_word: יְעָדָהּ
  choice: nagtalaga sa kanya para sa sarili nito
  rationale: Saklaw ng pandiwa ang pagtatalaga sa babae para sa isang ugnayang pag-aasawa o pagiging kinakasama. Hindi ito labis na nililimitahan sa “ipinagkasundo upang mapangasawa,” kaya napapanatili ang tunay na hirap at lawak ng salita.
- source_word: וְהֶפְדָּהּ
  choice: dapat nitong pahintulutan na matubos siya
  rationale: Ang Hiphil dito ay maaaring tumukoy sa pagpapahintulot o pagsasakatuparan ng pagtubos. Nililinaw ng salin ang legal na tungkulin nang hindi ipinapalagay na ang amo mismo ang magbabayad.
- source_word: לְעַם נָכְרִי
  choice: sa mga banyaga
  rationale: Natural sa modernong Tagalog ang kolektibong “mga banyaga” at pinananatili nito ang pagkakaiba sa pagitan ng sariling bayan at mga taong nasa labas nito.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: Wala itong karapatang ipagbili siya
  rationale: Ang משל ay nagpapahayag ng awtoridad o legal na kapangyarihan; malinaw na naihahatid ng “walang karapatan” ang puwersang juridikal.
- source_word: בְּבִגְדוֹ בָהּ
  choice: sapagkat nagtaksil ito sa kanya
  rationale: Ang בגד ay pagtrato nang walang katapatan o may pagtataksil. Ang “nagtaksil” ay maikli, matindi, at angkop sa paglabag ng amo sa pananagutan nito sa babae.
theological_decisions:
- issue: Ang interpretasyon ng יְעָדָהּ at ng mahirap na negatibo/positibong pagbasa sa sugnay
  choice: na hindi nagtalaga sa kanya para sa sarili nito
  alternative: na nagtalaga sa kanya para sa sarili nito; o, na hindi nakipagkasundo upang mapangasawa siya
  rationale: Sinusunod ng pangunahing teksto ang negatibong pagbasa sa ibinigay na tekstong WLC, ngunit hindi ikinukubli ang kilalang hirap ng tradisyong Masoretiko. Inilalagay sa talababa ang positibong pagbasa at ang mas tiyak na diwang pag-aasawa upang mapanatili ang tunay na tekstuwal at interpretatibong tensiyon.
- issue: Lakas ng moral na paratang sa בְּבִגְדוֹ בָהּ
  choice: nagtaksil ito sa kanya
  alternative: dinaya nito siya; o, hindi ito naging tapat sa kanya
  rationale: Ang “nagtaksil” ay nagpapanatili sa ugnayang moral at tipanang kulay ng בגד nang hindi nagdaragdag ng tiyak na denominasyonal o doktrinal na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignipikado ngunit madaling maunawaan. Ginamit ang “ito/nito” para sa amo upang maiwasan ang kalituhan sa magkakasunod na panlalaking panghalip, habang pinananatiling “siya/kanya” ang babae. Ang legal na himig ay pinanatili sa “dapat” at “walang karapatan.”
