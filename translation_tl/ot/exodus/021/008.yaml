  terminology: Ang “amo,” “matubos,” at “walang karapatang ipagbili” ay angkop sa legal na rehistro. Ang “mga banyaga” ay katanggap-tanggap bilang kolektibong katumbas ng לְעַם נָכְרִי. Ang “nagtaksil” ay isang wastong salin ng בגד, at sinusuportahan ito ng mas mahinahong alternatibo sa talababa.
