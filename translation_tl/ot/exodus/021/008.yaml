revisions:
- from: Kung hindi siya kalugud-lugod sa paningin ng kanyang amo, na hindi nagtalaga sa kanya para sa sarili nito,[a] dapat nitong pahintulutan na matubos siya. Wala itong karapatang ipagbili siya sa mga banyaga, sapagkat nagtaksil ito sa kanya.[b]
  to: Kung hindi siya kalugud-lugod sa paningin ng kanyang amo, na hindi nagtalaga sa kanya para sa kanyang sarili,[a] dapat niyang pahintulutang matubos siya. Wala siyang karapatang ipagbili siya sa mga banyaga, sapagkat nagtaksil siya sa kanya.[b]
  rationale: Pinapalitan ang di-natural at posibleng dehumanizing na “ito/nito” ng mga panghalip na tumutukoy sa taong amo. Pinapakinis din ang sintaksis ng utos tungkol sa pagtubos. Hindi binabago ng mga rebisyong ito ang saklaw ng יְעָדָהּ, ang legal na puwersa ng pagbabawal, o ang pag-aalinlangan ng tekstong Hebreo, na nananatiling malinaw sa talababa.
