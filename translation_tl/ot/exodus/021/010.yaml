  - severity: low
    issue: Bahagyang mahaba ang “ugnayang seksuwal bilang mag-asawa.”
    rationale: Ang “ugnayang seksuwal ng mag-asawa” ay mas idiomatiko at pinananatili ang marangal na rehistro nang hindi binabago ang saklaw ng termino.
