translation:
  language: tl
  text: Kung kukuha siya ng isa pang babae bilang asawa, hindi niya dapat bawasan ang pagkain, pananamit, o karapatan ng kanyang unang asawa sa ugnayang seksuwal ng mag-asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “karapatan niya sa pagtatalik bilang mag-asawa.” Ang salitang Hebreo ay tumutukoy sa obligasyon ng asawang lalaki hinggil sa matalik na ugnayan ng mag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili nito ang anyong kondisyonal ng kasong legal.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: kukuha siya ng isa pang babae bilang asawa
  rationale: Sa kontekstong ito, ang pandiwang 'kumuha' na may tinutukoy na babae ay nangangahulugang kunin bilang asawa. Nililinaw ng parirala ang legal na diwa nang hindi ginagawang mas tiyak kaysa sa Hebreo.
- source_word: שְׁאֵרָהּ
  choice: pagkain ng unang asawa
  rationale: Sa tatluhang talaan ng mga obligasyon sa pag-aasawa, tumutukoy ito sa materyal na panustos, lalo na sa pagkain. Idinagdag ang 'unang asawa' upang maging malinaw ang tinutukoy ng hulaping pambabae sa Hebreo.
- source_word: כְּסוּתָהּ
  choice: pananamit ng unang asawa
  rationale: Ang pangngalan ay nangangahulugang pantakip o damit; natural at angkop sa legal na konteksto ang 'pananamit.'
- source_word: וְעֹנָתָהּ
  choice: karapatan nito sa ugnayang seksuwal bilang mag-asawa
  rationale: Ang mahirap na terminong ito ay tumutukoy sa obligasyon ng asawang lalaki ukol sa matalik na ugnayan ng mag-asawa. Tahasang ipinahahayag ng salin ang diwa ngunit pinananatili itong marangal at hindi klinikal.
- source_word: לֹא יִגְרָע
  choice: hindi niya dapat bawasan
  rationale: Saklaw ng 'bawasan' ang diwang paliitin o kulangan ang alinman sa tatlong obligasyon at angkop ito sa makabagong wikang legal.
