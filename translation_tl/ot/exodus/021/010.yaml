revisions:
- from: Kung kukuha siya ng isa pang babae bilang asawa, hindi niya dapat bawasan ang pagkain at pananamit ng unang asawa, ni ang karapatan nito sa ugnayang seksuwal bilang mag-asawa.[a]
  to: Kung kukuha siya ng isa pang babae bilang asawa, hindi niya dapat bawasan ang pagkain, pananamit, o karapatan ng kanyang unang asawa sa ugnayang seksuwal ng mag-asawa.[a]
  rationale: Inayos ang ayos ng talaan upang malinaw na ang pagkain, pananamit, at karapatang seksuwal ay pawang para sa naunang asawa. Pinagaan din ang huling parirala para sa natural na modernong Filipino, habang iniingatan ang legal na himig at ang maingat na pagtrato sa mahirap na terminong Hebreo.
