  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: tl
  text: At kung ipagbili ng isang lalaki ang kanyang anak na babae bilang aliping babae[a], hindi siya lalaya gaya ng pagkalaya ng mga aliping lalaki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bilang alilang babae.” Ang salitang Hebreo ay tumutukoy sa isang babaeng nasa kalagayan ng pagkaalipin.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi siya lalaya mula sa paglilingkod ayon sa kaparehong mga takda na para sa mga aliping lalaki.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: At kung
  rationale: Ipinananatili ang pang-ugnay na ו at ang kondisyong ipinakikilala ng כִּי sa kasunod na tuntuning legal.
- source_word: יִמְכֹּר
  choice: ipagbili
  rationale: Tuwirang ipinapahayag ang pagbebenta sa isang pangkalahatang kondisyong legal.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang panlalaking anyo at ang konteksto ng lalaking puno ng sambahayan o ama.
- source_word: בִּתּוֹ
  choice: ang kanyang anak na babae
  rationale: Tuwirang katumbas ng terminong tumutukoy sa anak na babae na may hulaping ikatlong panauhang panlalaki.
- source_word: לְאָמָה
  choice: bilang aliping babae
  rationale: Malinaw na ipinapakita ang kalagayang legal ng babaeng nasa pagkaalipin, sa halip na palambutin ito bilang karaniwang katulong.
- source_word: לֹא תֵצֵא
  choice: hindi ito lalaya
  rationale: Sa legal na konteksto, ang literal na ‘lumabas’ ay tumutukoy sa pagkalaya o paglabas mula sa paglilingkod; natural na ipinahahayag ito sa Filipino bilang ‘lalaya.’
- source_word: כְּצֵאת
  choice: sa paraang paglaya
  rationale: Pinananatili ang paghahambing tungkol sa paraan o mga takda ng pagkalaya.
- source_word: הָעֲבָדִים
  choice: mga aliping lalaki
  rationale: Ginagawang malinaw ang kasariang ipinahihiwatig ng paghahambing sa aliping babae at ng naunang batas tungkol sa mga aliping lalaki.
theological_decisions:
- issue: Paglalarawan sa pagkaalipin sa batas ng tipan
  choice: Gamitin ang “aliping babae” at “mga aliping lalaki.”
  alternative: “babaeng utusan,” “alilang babae,” o “mga lingkod”
  rationale: Sentral sa talata ang pagbebenta at legal na kalagayan ng pagkaalipin. Ang “alipin” ay malinaw at hindi pinahihina ang panlipunan at legal na realidad ng teksto.
- issue: Kahulugan ng ‘hindi lalabas’
  choice: Isalin bilang “hindi ito lalaya” habang nililinaw sa talababa ang paghahambing.
  alternative: Literal na “hindi siya lalabas”
  rationale: Ang pandiwa ay legal na idyoma para sa paglaya mula sa pagkaalipin. Ang “lalaya” ay likas sa modernong Filipino at naghahatid ng kontekstuwal na kahulugan nang hindi itinatakda ang eksaktong mga kundisyon na tinatalakay sa mga kasunod na talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito” bilang panghalip sa anak na babae upang maging natural ang daloy, habang nananatiling malinaw ang tinutukoy. Ang legal na idyomang Hebreo na “lumabas” ay isinaling “lumaya” para sa agarang pagkaunawa.
