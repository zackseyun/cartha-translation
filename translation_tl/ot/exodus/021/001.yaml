  text: וְ/אֵ֨לֶּה֙ הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר תָּשִׂ֖ים לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: tl
  text: At ito ang mga tuntuning ihaharap mo sa kanila:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga hatol” o “mga legal na pasiya.” Ang salitang Hebreo ay tumutukoy sa mga tuntuning legal o mga pasiyang ginagamit sa mga partikular na kaso.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: At ito
  rationale: Pinananatili ng “At” ang pang-ugnay na וְ sa naunang bahagi, habang likas sa Tagalog ang “ito” bilang panimula sa talaan ng maramihang tuntunin.
- source_word: הַ/מִּשְׁפָּטִים
  choice: ang mga tuntunin
  rationale: Sa konteksto ng tipang legal, tumutukoy ang מִשְׁפָּטִים sa mga legal na tuntunin o pasiyang inilalahad sa mga kasong susunod. Mas malinaw at natural sa karaniwang mambabasa ang “mga tuntunin” kaysa “mga hatol,” na maaaring mapagkamalang mga kaparusahan lamang.
- source_word: אֲשֶׁר
  choice: -ng
  rationale: Isinama ang pang-ugnay na diwa ng relative pronoun sa hulaping “-ng” ng “tuntuning,” na likas na kayarian sa Tagalog.
- source_word: תָּשִׂים
  choice: ihaharap mo
  rationale: Ang literal na “ilalagay mo” ay posible, ngunit sa pariralang legal na “sa harap nila,” natural na ipinapahayag sa Tagalog ang pagtatanghal o paglalahad bilang “ihaharap mo.” Nananatili rito ang utos na nakatuon kay Moises.
- source_word: לִ/פְנֵי/הֶם
  choice: sa kanila
  rationale: Kasama ng pandiwang “ihaharap,” natural na naipahahayag ng “sa kanila” ang Hebreong idyomang “sa harap nila,” ibig sabihin ay ilahad sa kanilang harapan o para sa kanilang pagsasaalang-alang.
theological_decisions:
- issue: Saklaw ng מִשְׁפָּטִים sa konteksto ng batas ng tipan
  choice: mga tuntunin
  alternative: mga hatol; mga legal na pasiya; mga batas
  rationale: Hindi nililimitahan ng salin ang salita sa kaparusahan o sa pangkalahatang konsepto ng batas. Ang “mga tuntunin” ay angkop sa mga kasong legal na kasunod, habang inilalahad sa talababa ang mas tiyak na judicial na kulay ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pang-ugnay sa naunang konteksto, ngunit ginawang natural ang Hebreong idyoma sa pamamagitan ng “ihaharap mo sa kanila.”
