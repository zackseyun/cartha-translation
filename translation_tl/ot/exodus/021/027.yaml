  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: tl
  text: At kung mapalaglag niya ang ngipin ng kanyang aliping lalaki o ang ngipin ng kanyang aliping babae, palalayain niya ang alipin[a] bilang kabayaran sa ngipin ng alipin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Panlalaking isahan ang panghalip na hulapi sa Hebreo, ngunit ang batas ay kumakapit sa alinman sa aliping lalaki o aliping babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: At kung
  rationale: Ipinagpapatuloy nito ang magkakaugnay na mga kasong legal mula sa naunang talata habang natural sa Filipino.
- source_word: שֵׁן
  choice: ngipin
  rationale: Tuwirang katawagang anatomikal; pinanatili ang anyong isahan ng Hebreo.
- source_word: עַבְדּוֹ
  choice: kanyang aliping lalaki
  rationale: Ipinakikita ng “alipin” ang kalagayang legal ng taong nakagapos sa paglilingkod, at pinananatili ng “lalaki” ang tahasang pagkakaiba ng kasarian sa Hebreo.
- source_word: אֲמָתוֹ
  choice: kanyang aliping babae
  rationale: Ito ang pambabaeng katapat ng עבד at malinaw na pinananatili ang pagkakaibang pangkasarian ng pinagmulang teksto.
- source_word: יַפִּיל
  choice: malaglag niya
  rationale: Ang Hiphil ng נפל ay literal na ‘maging sanhi upang malaglag.’ Natural itong tumutukoy rito sa pagpapatanggal ng ngipin nang hindi ipinapalagay ang tiyak na paraan ng pananakit.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: palalayain niya ang alipin
  rationale: Sa kontekstong legal, ang parirala ay nangangahulugang pakawalan tungo sa pagiging malaya. Ang pag-uulit sa “alipin” ay natural at nililinaw ang reperente sa Filipino.
- source_word: תַּחַת שִׁנּוֹ
  choice: bilang kabayaran sa ngipin nito
  rationale: Ipinapahayag ng תַּחַת ang kapalit o kabayarang legal para sa pinsala. Ang “nito” ay tumutukoy sa napinsalang alipin at umiiwas sa kalituhan ng kasarian.
theological_decisions:
- issue: Pagtukoy sa katayuan ng עבד at אמה sa batas ng Tipan
  choice: aliping lalaki / aliping babae
  alternative: lingkod na lalaki / lingkod na babae
  rationale: Ang talata ay bahagi ng batas tungkol sa mga taong nasa kalagayang pagkaalipin; mas tumpak na inilalahad ng “alipin” ang social at legal na realidad kaysa sa mas malawak na “lingkod,” nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Kasarian ng taong pinalalaya sa hulihang sugnay
  choice: ang alipin, na may talababa tungkol sa panlalaking isahang hulapi
  alternative: siya / ang aliping lalaki
  rationale: Panlalaking isahan ang hulapi sa Hebreo, ngunit ang kondisyong legal ay tahasang bumabanggit kapuwa sa aliping lalaki at aliping babae. Pinananatili ng neutral na pangngalan at talababa ang pormulang Hebreo at ang saklaw ng aplikasyon nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may tonong legal. Ginamit ang “alipin” upang tumpak na katawanin ang bonded status, at “malaglag niya” upang mapanatili ang sanhiing diwa ng pandiwang Hebreo nang magtakda ng paraang hindi tahasang binanggit.
