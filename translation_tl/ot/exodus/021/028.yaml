  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: tl
  text: Kapag sinuwag ng isang baka ang isang lalaki o babae at mamatay ang taong iyon, tiyak na babatuhin hanggang mamatay ang baka. Hindi dapat kainin ang karne nito, ngunit hindi mananagot ang may-ari ng baka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “walang sala” o “malaya sa parusa.” Ang Hebreong נָקִי ay isang terminong legal para sa pagiging malaya o walang pananagutan sa kasong ito, ngunit hindi nito higit na tinutukoy ang saklaw niyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Kapag
  rationale: Nagsisimula ito ng isang kasong legal. Likas sa modernong Filipino ang “kapag” para sa kondisyong ipinapalagay na maaaring mangyari; hindi kailangang isalin nang hiwalay ang pang-ugnay na וְ.
- source_word: יִגַּח
  choice: sinuwag
  rationale: Tiyak na tumutukoy ang pandiwa sa pananakit gamit ang sungay, kaya mas eksakto ang “sinuwag” kaysa sa pangkalahatang “sinaktan” o “binangga.”
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay isang hayop na kabilang sa mga baka at hindi kailangang tukuyin dito bilang lalaking “toro.” Ang “baka” ang malinaw at hindi labis na tiyak na katumbas sa Filipino.
- source_word: אֶת־אִישׁ אוֹ אֶת־אִשָּׁה
  choice: isang lalaki o babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapwa lalaki at babae.
- source_word: וָמֵת
  choice: at namatay ito
  rationale: Ang tinutukoy na namatay ay ang taong sinuwag. Iniiwasan ng “ito” ang panlalaking panghalip upang malinaw na saklaw kapwa ang lalaki at babae.
- source_word: סָקוֹל יִסָּקֵל
  choice: tiyak na babatuhin hanggang mamatay
  rationale: Ipinahahayag ng infinitive absolute na kasunod ng finite verb ang mariing katiyakan ng hatol. Nililinaw ng “hanggang mamatay” ang resulta ng pagbato sa kontekstong legal.
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: Hindi dapat kainin ang karne nito
  rationale: Likas sa Filipino ang pasibong pagbabawal na ito. Ang “karne” ang karaniwang katumbas ng בָּשָׂר kapag laman ng hayop na maaaring kainin ang tinutukoy.
- source_word: וּבַעַל הַשּׁוֹר
  choice: ngunit ... ang may-ari ng baka
  rationale: Sa kontekstong legal, ang בַּעַל ay ang may-ari. Ang “ngunit” ay malinaw na naghahayag ng kaibahan ng sinapit ng hayop at ng kalagayan ng may-ari.
- source_word: נָקִי
  choice: hindi mananagot
  rationale: Sa kasong legal na ito, ipinahihiwatig ng נָקִי na ang may-ari ay malaya sa pananagutan o parusa. Natural sa modernong Filipino ang “hindi mananagot,” habang inilalahad sa talababa ang tunay na lawak ng salitang Hebreo.
theological_decisions:
- issue: Ang legal na kalagayan ng may-ari ng baka sa huling sugnay
  choice: Hindi mananagot ang may-ari sa kasong inilalarawan.
  alternative: Walang sala ang may-ari, o malaya siya sa parusa.
  rationale: Ang נָקִי ay maikling terminong legal na hindi tahasang nagtatakda kung moral, sibil, o partikular na parusang kriminal ang saklaw ng pagiging malaya. Pinananatili ng salin at talababa ang lawak na iyon, lalo na dahil inilalahad sa mga kasunod na talata ang kaso ng dating nanunuwag na baka at kapabayaan ng may-ari.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na angkop sa tekstong legal. Ginamit ang “sinuwag” para sa eksaktong kilos ng hayop at ang “hindi mananagot” para sa maikli ngunit likas na paglalahad ng legal na katayuan. Inilagay ang panandang [a] pagkatapos mismo ng sugnay na ipinapaliwanag nito.
