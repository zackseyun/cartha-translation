base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: tl
  text: Kung makabangon siya at makapaglakad-lakad sa labas na nakasandal sa kanyang tungkod[a], hindi na mananagot ang nanakit sa kanya; babayaran lamang nito ang panahong hindi siya makapagtrabaho[b] at titiyaking lubos siyang mapagaling.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring “habang umaalalay sa kanyang tungkod.” Literal sa Hebreo: “sa ibabaw ng kanyang tungkod”; ang paglalakad na may suporta ay tanda ng bahagyang paggaling.'
    reason: lexical_alternative
  - marker: b
    text: Tumutukoy ito sa kabayaran para sa panahong hindi magawa ng nasugatan ang karaniwan niyang gawain o hanapbuhay.
    reason: cultural_note
  - marker: c
    text: Gumagamit ang Hebreo ng mariing anyo na literal na “pagalingin ay pagagalingin,” na nagpapahiwatig ng pananagutang tiyakin ang lubos na paggaling, malamang sa pamamagitan ng pagsagot sa pagpapagamot.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: Kung makabangon siya
  rationale: Ipinapahayag ng kondisyong ito ang pagbangon ng nasugatan bilang tanda ng bahagyang paggaling, hindi lamang ang literal na pagtayo.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: at makapaglakad-lakad sa labas
  rationale: Ang anyong Hitpael ay nagpapahiwatig ng paglalakad o pagkilos sa iba’t ibang lugar; natural itong ipinahahayag ng “makapaglakad-lakad.”
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: na nakasandal sa kanyang tungkod
  rationale: Ginagawang malinaw ang gamit ng tungkod bilang suporta habang nananatiling malapit sa literal na pariralang Hebreo.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: hindi na mananagot ang nanakit sa kanya
  rationale: Sa kontekstong legal, ang Niphal ng נקה ay tumutukoy sa paglaya mula sa karagdagang pananagutan o parusa, bagaman nananatili ang tahasang obligasyong sumusunod.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: babayaran lamang nito ang panahong hindi siya makapagtrabaho
  rationale: Sa batas tungkol sa pinsala, ang שִׁבְתּוֹ ay tumutukoy sa panahon ng kawalan ng kakayahang gumawa at sa kaugnay na nawalang kabuhayan; ang “babayaran” ang natural na legal na diwa ng יִתֵּן.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: at titiyaking lubos siyang mapagaling
  rationale: Ang infinitive absolute na sinusundan ng pandiwa ay nagbibigay-diin sa pananagutang matiyak ang ganap na pagpapagaling, hindi kinakailangang ang nanakit mismo ang manggagamot.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hindi na mananagot” sa diwang legal ngunit nilinaw agad ng kasunod na sugnay ang natitirang pananagutang pinansiyal at medikal. Inilagay ang bawat talababa sa salitang o pariralang talagang ipinaliliwanag nito.
