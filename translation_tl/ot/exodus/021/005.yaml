base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: tl
  text: Ngunit kung mariing sabihin ng alipin[a], ‘Mahal ko ang aking panginoon, ang aking asawa, at ang aking mga anak[b]; hindi ako aalis bilang malaya,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiyak na sabihin”; inuulit sa Hebreo ang kaugnay na anyo ng pandiwa upang idiin ang pahayag.
    reason: lexical_alternative
  - marker: b
    text: O “mga anak na lalaki”; panlalaking maramihan ang salitang Hebreo, ngunit maaari itong tumukoy sa mga anak sa pangkalahatan sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Nagpapakilala ito ng kondisyong naiiba sa naunang tuntunin; natural sa Tagalog ang “Ngunit kung.”
- source_word: אָמֹר יֹאמַר
  choice: tahasang sabihin
  rationale: Ang infinitive absolute na kasabay ng pandiwang may takdang anyo ay nagbibigay-diin sa malinaw at matibay na pagpapahayag.
- source_word: הָעֶבֶד
  choice: ang alipin
  rationale: Mahalaga sa kontekstong legal ang kalagayan niyang nakagapos sa paglilingkod at ang posibilidad ng paglaya; mas tuwiran ang “alipin” kaysa “lingkod.”
- source_word: אָהַבְתִּי
  choice: Mahal ko
  rationale: Bagaman perfect ang anyong Hebreo, ipinahahayag nito rito ang kasalukuyan at matatag na pagmamahal.
- source_word: אֲדֹנִי
  choice: aking panginoon
  rationale: Ipinahahayag nito ang awtoridad ng pinaglilingkuran sa loob ng sambahayan; dignified at karaniwang katumbas sa Tagalog ang “panginoon” sa ganitong sinaunang konteksto.
- source_word: אִשְׁתִּי
  choice: aking asawa
  rationale: Tuwirang salin ng pangngalang may unang panauhang panlaping paari.
- source_word: בָּנָי
  choice: aking mga anak
  rationale: Bagaman panlalaking maramihan ang anyo at maaari ring mangahulugang “mga anak na lalaki,” maaari itong tumukoy sa mga anak sa pangkalahatan sa konteksto ng pamilya.
- source_word: לֹא אֵצֵא חָפְשִׁי
  choice: ayaw kong lumaya
  rationale: Natural nitong ipinahahayag sa modernong Tagalog ang pasiya niyang huwag umalis bilang malaya, nang hindi nagpapahiwatig na imposible ang pag-alis.
theological_decisions:
- issue: Pagpapakahulugan sa עבד sa batas tungkol sa nakagapos na paglilingkod
  choice: alipin
  alternative: lingkod; aliping lingkod
  rationale: Nakasentro ang talata sa legal na kalagayang hindi malaya at sa pagtanggi sa iniaalok na paglaya, kaya kailangang manatiling malinaw ang pagkagapos ng katayuan.
- issue: Saklaw ng בָּנָי
  choice: mga anak
  alternative: mga anak na lalaki
  rationale: Pinananatili ng pangunahing teksto ang posibleng pangkalahatang gamit nito para sa supling, habang inilalahad sa talababa ang literal na panlalaking anyo.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “alipin” upang hindi pagaanin ang legal na kalagayan, at “tahasang sabihin” upang maipakita ang diin ng Hebreo. Ang “ayaw kong lumaya” ay mas likas kaysa literal na “hindi ako lalabas na malaya,” habang pinananatili ang kahulugan ng kusang pagtanggi sa paglaya.
