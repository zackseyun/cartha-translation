base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: tl
  text: Ngunit kung hindi niya ito pinagplanuhan, at ipinasakamay ito sa kanya ng Diyos,[a] magtatalaga ako para sa iyo ng isang lugar na matatakbuhan niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at ipinangyari ito ng Diyos sa pamamagitan ng kanyang kamay.” Ipinahihiwatig ng Hebreo na ang pangyayari ay naganap sa pamamagitan ng taong nakapatay ngunit hindi niya ito pinagplanuhan; inilalarawan din nito ang pagkilos ng Diyos nang hindi ipinapasiya ang pananagutang moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang kasong salungat sa sinadyang pagpatay sa naunang talata; natural sa modernong Tagalog ang tahasang kondisyunal.
- source_word: לֹא צָדָה
  choice: hindi niya ito pinagplanuhan
  rationale: Sa kontekstong legal, ang צדה ay tumutukoy sa pag-aabang o paunang layuning pumatay, hindi sa literal na pangangaso. Malinaw at likas sa Tagalog ang 'pinagplanuhan' bilang kawalan ng premeditasyon.
- source_word: וְהָאֱלֹהִים
  choice: at ipinaubaya ng Diyos
  rationale: Ang אֱלֹהִים dito ay pinakamalamang na Diyos, sapagkat inilalarawan ng sugnay ang pangyayaring nasa ilalim ng banal na pamamahala, hindi ang pagkilos ng mga hukom.
- source_word: אִנָּה לְיָדוֹ
  choice: na mangyari iyon sa pamamagitan ng kanyang kamay
  rationale: Pinananatili nito ang banal na ahensiya at ang tao bilang kasangkapan sa pangyayaring hindi pinagplanuhan. Ang 'ipinaubaya ... na mangyari' ay natural ngunit hindi inaalis ang tensiyon ng Hebreong causative idiom.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: magtatalaga ako para sa iyo ng isang lugar
  rationale: Ang 'magtatalaga' ay angkop sa legal at administratibong pagtatatag ng awtorisadong lugar ng kanlungan.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: na matatakbuhan niya
  rationale: Likas na Tagalog itong pagpapahayag ng isang lugar na maaari niyang takasan tungo sa kanlungan, habang pinananatili ang direksiyonal na diwa ng שָׁמָּה.
theological_decisions:
- issue: Pagkilos ng Diyos sa di-sinasadyang pagpatay
  choice: ipinaubaya ng Diyos na mangyari iyon sa pamamagitan ng kanyang kamay
  alternative: pinangyari ng Diyos na mapasa kanyang kamay iyon
  rationale: 'Pinananatili ng salin ang tensiyon ng teksto: hindi pinagplanuhan ng tao ang pagpatay, ngunit inilalarawan pa rin ang pangyayari sa ilalim ng banal na pamamahala. Hindi nito ginagawang ''mga hukom'' ang אֱלֹהִים ni tahasang nilulutas ang usapin ng pananagutang moral.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang 'pinagplanuhan' sa halip na mas teknikal na 'pinag-isipan nang patiuna,' at 'matatakbuhan' bilang likas na legal na pahayag para sa pagtakas tungo sa kanlungan.
