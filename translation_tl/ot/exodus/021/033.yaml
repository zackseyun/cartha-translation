base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: tl
  text: At kung may taong[b] magbukas ng isang hukay[a], o kung may taong maghukay ng isang hukay at hindi niya ito takpan, at mahulog sa hukay ang isang baka o isang asno,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mag-alis ng takip sa isang hukay.” Ang pandiwang Hebreo ay literal na “magbukas” at maaaring tumukoy sa pagbubukas ng dati nang hukay, hindi sa paghuhukay ng bago.
    reason: lexical_alternative
  - marker: b
    text: Ang “may taong” ay salin ng pang-isahang panlalaking pormulang legal na אִישׁ (’ish), na ginagamit dito sa pangkalahatang diwa.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na waw at ang kondisyonal na pormula ng kasunod na kasong legal.
- source_word: יִפְתַּח
  choice: magbukas
  rationale: Tuwirang sinasalamin ang pandiwang 'magbukas' at pinananatili ang kaibahan nito sa paghuhukay sa kasunod na sugnay; maaaring tumukoy sa pag-aalis ng takip ng dati nang hukay.
- source_word: אִישׁ
  choice: may taong
  rationale: Natural sa makabagong Tagalog bilang pangkalahatang pormula sa batas, nang hindi ipinapalagay na lalaki lamang ang saklaw.
- source_word: בּוֹר
  choice: isang hukay
  rationale: Malawak at angkop na tawag sa mapanganib na hukay; hindi ipinapalagay na imbakan ito ng tubig.
- source_word: א֠וֹ כִּי
  choice: o
  rationale: Natural na ipinakikilala ang alternatibong kalagayang legal; nauunawaan pa rin ang kondisyon mula sa unang 'kung'.
- source_word: יִכְרֶה
  choice: maghukay
  rationale: Karaniwan at malinaw na salita para sa paggawa ng hukay, at naiiba sa pagbubukas lamang nito.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: at hindi niya ito takpan
  rationale: Tumutukoy sa pisikal na pagtatakip bilang pag-iingat laban sa pagkahulog.
- source_word: וְ/נָפַל
  choice: at may mahulog
  rationale: Ang naganap na anyong Hebreo ay bahagi ng kondisyonal na sitwasyong legal; natural itong inilalahad sa Tagalog bilang maaaring mangyari.
- source_word: שָׁמָּה
  choice: doon
  rationale: Natural na lokatibong Tagalog; sa konteksto, malinaw na nangangahulugang sa loob ng hukay.
- source_word: שּׁוֹר
  choice: baka
  rationale: Karaniwang modernong Tagalog para sa bovine livestock at hindi labis na nililimitahan ang kasarian o gamit ng hayop.
- source_word: א֥וֹ חֲמוֹר
  choice: o asno
  rationale: Malinaw at dignified na katawagan sa domestikadong hayop na tinutukoy.
