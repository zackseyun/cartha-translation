  naturalness: Natural at marangal sa makabagong Tagalog ang paulit na “kung may taong” sa isang kasong legal. Ang “at mahulog sa hukay ang isang baka o isang asno” ay malinaw at maayos ang daloy.
  terminology: Ang “hukay,” “baka,” at “asno” ay angkop. Ang “may taong” ay katanggap-tanggap na pangkalahatang Tagalog para sa panlalaking pang-isahang pormulang legal na איש, basta ipinaliwanag sa talababa.
  issues:
