    issue: Hindi nailahad ang ikalawang “kung” sa alternatibong sugnay.
    rationale: Ang או כי ay “o kung.” Bagaman maaaring ipahiwatig sa Tagalog ang kondisyon mula sa unang sugnay, ang pag-uulit ng “kung” ay mas tapat sa magkahanay na mga kasong legal at nag-aalis ng posibleng pagbasa na iisang tao lamang ang parehong nagbukas at naghukay.
  - severity: low
    issue: Hindi naipakita ang pang-isahang bilang ng mga hayop at malabo ang “doon.”
    rationale: 'Ang שור או חמור ay pang-isahan: “isang baka o isang asno.” Ang שמה ay may direksiyong papasok sa hukay; “sa hukay” ang malinaw at likas na Tagalog sa kontekstong ito.'
  - severity: medium
    issue: Nasa hulihan ang talababa b kahit ang ipinapaliwanag nito ay “may taong.”
    rationale: Dapat ikabit ang panandang talababa sa salitang o pariralang tinutukoy nito upang maging malinaw ang anchor.
