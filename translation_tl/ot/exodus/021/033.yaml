- from: At kung may taong magbukas ng isang hukay[a], o maghukay ng isang hukay at hindi niya ito takpan, at may mahulog doon na baka o asno,[b]
  to: At kung may taong[b] magbukas ng isang hukay[a], o kung may taong maghukay ng isang hukay at hindi niya ito takpan, at mahulog sa hukay ang isang baka o isang asno,
