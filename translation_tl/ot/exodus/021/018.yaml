  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: tl
  text: Kung mag-away ang mga lalaki at hampasin ng isa ang kanyang kapwa ng bato o ng kamao, at hindi mamatay ang hinampas kundi maparatay sa higaan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mabuwal sa higaan”—ibig sabihin, maparatay o mapahiga dahil sa pinsala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Kung
  rationale: Naghaharap ito ng isang posibleng kaso sa batas; likas sa modernong Tagalog ang “kung” para sa ganitong pormula.
- source_word: יְרִיבֻן
  choice: mag-away
  rationale: Saklaw ng ריב ang pagtatalo o pag-aaway; ang “mag-away” ay natural at angkop sa alitang nauuwi sa pananakit nang hindi ipinapalagay na isa na itong ganap na labanan.
- source_word: אֲנָשִׁים
  choice: ang mga lalaki
  rationale: Panlalaking maramihan ang anyong Hebreo at tumutukoy rito sa mga lalaking sangkot sa kasong inilalahad.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: hampasin ng isa ang kapwa niya
  rationale: Ibinubukod ng sugnay ang isa sa mga kalahok bilang nanakit. Malinaw at likas ang “kapwa niya” para sa רֵעַ sa kontekstong legal.
- source_word: בְּאֶבֶן
  choice: ng bato
  rationale: Instrumental ang בְּ at ang payak na kahulugan ng אֶבֶן ay “bato.”
- source_word: אוֹ בְאֶגְרֹף
  choice: o ng kanyang kamao
  rationale: Ang אֶגְרֹף ay tumutukoy sa kamao; nililinaw ng “kanyang” na sariling kamao ng nanakit ang ginamit.
- source_word: וְלֹא יָמוּת
  choice: at hindi ito mamatay
  rationale: Pinananatili ang koordinasyong Hebreo. Ginagamit ang “ito” upang malinaw na ang taong hinampas ang hindi namatay.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: kundi maparatay sa higaan[a]
  rationale: Literal itong “mabuwal sa higaan,” ngunit idyoma ito para sa taong hindi makabangon dahil sa pinsala. Natural at marangal sa Tagalog ang “maparatay sa higaan.”
