  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: tl
  text: Kung suwagín nito ang isang anak na lalaki o anak na babae, ang parehong parusa ay ipapataw sa may-ari nito ayon sa tuntuning ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, ang kaparehong legal na parusang itinakda sa naunang talata ang ipatutupad kapag anak na lalaki o anak na babae ang sinuwag ng baka.
    reason: cross_reference
lexical_decisions:
- source_word: אוֹ
  choice: Kung
  rationale: Bagaman karaniwang nangangahulugang “o,” ipinakikilala rito ng אוֹ ang isa pang posibleng kaso sa naunang batas; natural itong ipinapahayag sa Filipino bilang “Kung.”
- source_word: בֵן ... בַת
  choice: isang anak na lalaki o anak na babae
  rationale: Pinananatili nito ang magkatambal at tiyak-sa-kasariang mga katawagang “anak na lalaki” at “anak na babae” sa Hebreo.
- source_word: יִגָּח
  choice: manuwag ito
  rationale: Ang pandiwang נגח ay tumutukoy sa pananuwag. Ang “ito” ay tumutukoy sa bakang binanggit sa naunang konteksto nang hindi inuulit ang salitang wala sa talatang ito.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: ayon sa tuntuning ito
  rationale: Sa kontekstong legal, ang מִשְׁפָּט ay maaaring tumukoy sa tuntunin, hatol, o itinakdang legal na pasiya. Ang “tuntunin” ay natural at malinaw na tumutukoy pabalik sa naunang probisyon.
- source_word: יֵעָשֶׂה לּוֹ
  choice: gayundin ang gagawin sa may-ari nito
  rationale: Pinananatili ng “gagawin” ang balintiyak na anyo ng Hebreo. Nililinaw ng “sa may-ari nito” ang tinutukoy ng panlalaking panghalip ayon sa agarang konteksto, habang ang “gayundin” ay nag-uugnay sa naunang itinakdang parusa.
