  register: Makabago ngunit marangal na Filipino, na may malinaw na himig ng batas. Ginawang tahasan ang “may-ari ng toro” bilang paksa ng pagbabayad upang maiwasan ang kalituhan ng panghalip sa Filipino, samantalang pinanatili ang tinutukoy ng Hebreong hulapi sa “panginoon nito.”
