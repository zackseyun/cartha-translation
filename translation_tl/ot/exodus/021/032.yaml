  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: tl
  text: Kung suwagin ng toro ang isang aliping lalaki o aliping babae[a], magbibigay ang may-ari ng toro ng tatlumpung siklong pilak sa panginoon ng alipin, at babatuhin ang toro hanggang mamatay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang alipin, lalaki man o babae.” Magkahiwalay na tinutukoy ng Hebreo ang lalaking alipin (עֶבֶד) at babaeng alipin (אָמָה).
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: aliping lalaki
  rationale: Sa kontekstong legal, malinaw ang katayuang pagkaalipin, at pinananatili ng pariralang ito ang kaibahan sa kasunod na terminong pambabae.
- source_word: אָמָה
  choice: aliping babae
  rationale: Katambal ito ng עֶבֶד at tumutukoy sa isang babaeng alipin; malinaw at natural ito sa makabagong Filipino.
- source_word: יִגַּח
  choice: suwagin
  rationale: Ang pandiwang נגח sa mga batas tungkol sa toro ay tiyak na tumutukoy sa pananakit gamit ang sungay.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: tatlumpung siklong pilak
  rationale: Inilalahad nito ang kabayaran sa pilak na tinimbang ayon sa siklo; pinananatili ang sinaunang yunit.
- source_word: יִתֵּן
  choice: magbibigay
  rationale: Ang anyong di-ganap sa batas na may kondisyong pangyayari ay nagpapahayag ng obligasyong legal; ang Filipino na panghinaharap ay angkop sa ganitong pormula.
- source_word: לַאדֹנָיו
  choice: sa panginoon nito
  rationale: Ang hulaping panghalip ay pinakanatural na tumutukoy sa aliping kababanggit lamang. Ang “panginoon” ay nagpapanatili sa ugnayang legal ng pagmamay-ari nang hindi ginagawang teolohikal ang gamit.
- source_word: יִסָּקֵל
  choice: babatuhin ... hanggang mamatay
  rationale: Ang Niphal ng סקל ay tumutukoy sa pagpatay sa pamamagitan ng pagbato. Nililinaw ng “hanggang mamatay” ang ipinahihiwatig na parusang kamatayan sa natural na Filipino.
