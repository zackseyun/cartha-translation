source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: tl
  text: Ngunit kung ang baka ay matagal nang may ugaling manuwag[a], at nabigyan na ng babala ang may-ari nito ngunit hindi niya ito pinigil, at makapatay ito ng isang lalaki o babae, babatuhin ang baka hanggang mamatay, at papatayin din ang may-ari nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mula kahapon at noong makalawa,” isang idyomang Hebreo na nagsasaad ng dati nang kilala at paulit-ulit na asal.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: toro
  rationale: Karaniwang tawag sa isang lalaking baka sa modernong Filipino at angkop sa hayop na tinutukoy sa kasong legal.
- source_word: נַגָּח
  choice: dati nang nanunuwag
  rationale: Ipinahihiwatig ng anyong participle ang kilala at paulit-ulit na ugali ng hayop, hindi lamang ang isang insidente.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: dati na
  rationale: Likas na Filipino para sa idyomang literal na “mula kahapon at noong makalawa,” na tumutukoy sa dati nang napatunayang asal; pinananatili sa talababa ang literal na anyo.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: nabigyan na ng babala ang may-ari nito
  rationale: Ipinapahayag ang pormal na paalalang ibinigay sa may-ari hinggil sa mapanganib na ugali ng toro.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: hindi niya ito binantayan
  rationale: Malapit sa kahulugang bantayan o ingatan, habang ipinahihiwatig sa konteksto ang pagkabigong kontrolin ang hayop.
- source_word: וְהֵמִית
  choice: nakapatay ito
  rationale: Direkta at natural na ipinapahayag na ang hayop ang naging sanhi ng pagkamatay.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: isang lalaki o babae
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa kapuwa lalaki at babae.
- source_word: יִסָּקֵל
  choice: babatuhin ang toro hanggang mamatay
  rationale: Nililinaw sa natural na Filipino na ang pagbato ang itinakdang paraan ng pagpatay, hindi basta paghagis lamang ng bato.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: papatayin din ang may-ari nito
  rationale: Ipinapakita ng pormulang legal na Hophal ang ipinataw na parusang kamatayan, hindi lamang ang pangyayaring mamamatay ang may-ari.
theological_decisions:
- issue: Legal na bigat ng parusa sa may-ari
  choice: papatayin din ang may-ari nito
  alternative: mamamatay din ang may-ari nito
  rationale: Ang יוּמָת ay karaniwang pormulang legal para sa ipinataw na parusang kamatayan; ang simpleng “mamamatay” ay maaaring magpahina sa hudisyal na diwa.
- issue: Pagbanggit sa kasarian ng biktima
  choice: isang lalaki o babae
  alternative: isang tao
  rationale: Tahasan sa pinagmulang teksto ang kapuwa lalaki at babae, kaya hindi ito ginawang pangkalahatang “tao.”
- issue: Saklaw ng pananagutan ng may-ari
  choice: Pinanatili ang tuwirang parusang kamatayan sa talata
  alternative: Unawain agad ito bilang maaaring tubusin sa pamamagitan ng pantubos batay sa kasunod na mga talata
  rationale: Hindi tahasang nilulutas ng talatang ito lamang ang ugnayan nito sa probisyon ng pantubos sa Exodo 21:30; pinananatili ang legal at teolohikal na tensiyon sa halip na ipasok ang isang interpretasyon sa teksto.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at may legal na himig. Ginamit ang “nanunuwag” para sa nakaugaliang panunuwag at “babatuhin … hanggang mamatay” upang maging malinaw ang parusang tinutukoy. Ang nag-iisang talababa ay tumutugma sa marker na [a] sa pangunahing teksto.
