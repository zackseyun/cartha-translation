- from: Ngunit kung ang toro ay dati nang nanunuwag[a], at nabigyan na ng babala ang may-ari nito ngunit hindi niya ito binantayan, at nakapatay ito ng isang lalaki o babae, babatuhin ang toro hanggang mamatay, at papatayin din ang may-ari nito.
  to: Ngunit kung ang baka ay matagal nang may ugaling manuwag[a], at nabigyan na ng babala ang may-ari nito ngunit hindi niya ito pinigil, at makapatay ito ng isang lalaki o babae, babatuhin ang baka hanggang mamatay, at papatayin din ang may-ari nito.
