  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: tl
  text: Kung magkagayon, dadalhin siya ng kanyang panginoon sa Diyos[a], at dadalhin siya nito sa pinto o sa hamba ng pinto. Bubutasan ng kanyang panginoon ang kanyang tainga gamit ang isang pambutas, at maglilingkod siya sa kanya magpakailanman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga hukom.” Sa ilang legal na konteksto, ang salitang Hebreo na אֱלֹהִים ay maaaring tumukoy sa mga taong hukom o sa awtoridad na panghukuman.
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: dadalhin siya
  rationale: Ang Hiphil ng נגשׁ ay nagpapahiwatig ng pagdadala o paghaharap sa isang awtoridad o itinakdang lugar; natural at malinaw sa makabagong Tagalog ang “dadalhin siya.”
- source_word: אֲדֹנָיו
  choice: kanyang panginoon
  rationale: Sa kontekstong legal ng pagkaalipin, malinaw na tumutukoy ito sa taong pinaglilingkuran at hindi sa Diyos; pinananatili ng “panginoon” ang ugnayang panlipunan at legal ng teksto.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Ang pinakapayak na kahulugan ay “Diyos,” marahil bilang pagharap sa Diyos sa isang sagrado at legal na seremonya. Nasa talababa ang kapani-paniwalang alternatibong “mga hukom.”
- source_word: הַדֶּלֶת
  choice: pinto
  rationale: Payak at kongkretong tawag sa pintong pinagdarausan ng ritwal.
- source_word: הַמְּזוּזָה
  choice: haligi ng pinto
  rationale: Tumpak at madaling maunawaang katumbas ng bahagi ng balangkas na nasa gilid ng pinto.
- source_word: רָצַע
  choice: bubutasan
  rationale: Tumutukoy ang pandiwa sa pagbutas ng tainga gamit ang matulis na kasangkapan; likas sa Tagalog ang “bubutasan.”
- source_word: אָזְנוֹ
  choice: kanyang tainga
  rationale: Tuwirang salin ng literal na bahagi ng katawan.
- source_word: בַּמַּרְצֵעַ
  choice: sa pamamagitan ng pambutas
  rationale: Ang מַרְצֵעַ ay isang matulis na kasangkapang ginagamit sa pagbutas. Mas madaling maunawaan ng karaniwang mambabasa ang “pambutas” kaysa sa teknikal o hiram na katawagan.
- source_word: וַעֲבָדוֹ
  choice: Maglilingkod siya rito
  rationale: Tuwirang inilalarawan ng עבד ang patuloy na paglilingkod; ang “rito” ay tumutukoy sa kanyang panginoon at umiiwas sa sunod-sunod na malabong panghalip.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Pinananatili nito ang malawak at matinding pahayag ng לְעֹלָם sa halip na tahasang paliitin sa “habambuhay,” bagaman sa legal na kontekstong ito ang praktikal na saklaw ay permanenteng paglilingkod sa buong buhay.
theological_decisions:
- issue: Kahulugan ng הָאֱלֹהִים sa isang legal na konteksto
  choice: Diyos
  alternative: mga hukom
  rationale: Karaniwang tumutukoy ang אֱלֹהִים sa Diyos, at maaaring inilalarawan rito ang pagharap sa Diyos sa isang tipanang seremonyang legal. Gayunman, maaari rin itong tumukoy sa mga hukom o awtoridad na panghukuman sa ilang legal na konteksto, kaya tahasang pinananatili ang alternatibo sa talababa.
- issue: Saklaw ng לְעֹלָם
  choice: magpakailanman
  alternative: habambuhay; permanente
  rationale: Ang “magpakailanman” ang mas tuwirang katumbas at nagpapanatili sa anyo ng pahayag. Hindi nito dapat unawain bilang metafisikong walang hanggan; sa batas na ito, inilalarawan nito ang hindi na pansamantalang paglilingkod.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “panginoon” sa legal at panlipunang diwa, ang panghalip na “rito” upang luminaw ang tinutukoy, at ang karaniwang salitang “pambutas” para sa kasangkapang tinutukoy.
