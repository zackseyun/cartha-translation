translation:
  language: tl
  text: “Ang sinumang sumusumpa ng masama laban sa kanyang ama o sa kanyang ina ay tiyak na papatayin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “at ang kanyang ina”; sa pormulang legal na ito, distributibo ang diwa at tumutukoy sa pagsumpa laban sa alinman sa dalawang magulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Ang sinumang sumusumpa
  rationale: Ang participle ay ginagamit bilang pangngalan sa pormulang legal at tumutukoy sa sinumang gumagawa ng kasalanan. Pinananatili ng “sumusumpa” ang tiyak na diwa ng pagsasalita ng sumpa, sa halip na ang mas malawak na “lumalait.”
- source_word: אָבִיו
  choice: sa kanyang ama
  rationale: Tuwirang isinasalin ang pangngalan at panlaping panghalip na panlalaking isahan; ang “kanyang” ay likas na panghalip para sa pangkalahatang “sinuman” sa modernong Filipino.
- source_word: וְאִמּוֹ
  choice: o sa kanyang ina
  rationale: 'Bagaman literal na “at” ang waw, distributibo ang diwa ng pares sa pormulang legal: saklaw ang pagsumpa sa alinman sa dalawang magulang. Mas malinaw itong naihahayag ng “o” sa Filipino.'
- source_word: מוֹת יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ang infinitive absolute na kasunod ng pandiwang passive causative ay nagbibigay-diin sa itinakdang parusang kamatayan. Ipinahihiwatig ng “papatayin,” hindi lamang “mamamatay,” na ito ay hatol na ipapataw.
theological_decisions:
- issue: Legal na saklaw ng pares na ama at ina
  choice: Ginamit ang “o sa kanyang ina” upang ipakita na ang pagbabawal ay tumutukoy sa pagsumpa sa alinmang magulang.
  alternative: Panatilihin ang mas literal na “at sa kanyang ina.”
  rationale: Tunay na waw (“at”) ang nasa Hebreo, ngunit distributibo ang legal na diwa. Pinananatili ng salin ang saklaw ng batas habang inilalahad ito sa likas at malinaw na Filipino.
- issue: Paglalahad ng pormula ng parusang kamatayan
  choice: “ay tiyak na papatayin” bilang mariing hatol na ipinapataw
  alternative: “ay dapat mamatay” o “ay tiyak na mamamatay”
  rationale: Ang passive causative at infinitive absolute ay tumutukoy sa ipinapataw na parusang kamatayan, hindi lamang sa magiging resulta na kamatayan.
translation_notes:
  register: Makabago, malinaw, at marangal na legal na pananalita. Ginamit ang “sinuman” para sa pangkalahatang nagkasala at “tiyak na papatayin” upang mapanatili ang mariing pormula ng hatol.
