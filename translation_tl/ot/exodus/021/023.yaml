translation:
  language: tl
  text: Ngunit kung may kapinsalaan[a], magbibigay ka ng buhay kapalit ng buhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malubhang pinsala” o “kamatayan.” Ang salitang Hebreo ay maaaring tumukoy sa mabigat na pinsala o sakuna, at pinagtatalunan kung sa kontekstong ito ay tumutukoy ito sa pinsala sa pangkalahatan o sa kamatayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita ang kondisyong may pagsalungat sa naunang talata, at natural ito sa makabagong Filipino.
- source_word: אָסוֹן
  choice: malubhang kapinsalaan
  rationale: Saklaw ng salitang Hebreo ang matinding pinsala o sakuna nang hindi tiyak kung pinsala lamang o kamatayan; iniiwasan nitong ipasiya ang pinagtatalunang saklaw.
- source_word: יִהְיֶה
  choice: may
  rationale: Natural na eksistensiyal na pahayag sa Filipino para sa ‘mangyari/magkaroon ng kapinsalaan.’
- source_word: וְנָתַתָּה
  choice: magbibigay ka
  rationale: Pinananatili ang karaniwang diwa ng נתן na ‘magbigay’ at ang obligasyong legal, nang hindi ito ginagawang kabayarang salapi.
- source_word: נֶפֶשׁ
  choice: buhay
  rationale: Sa pormulang legal na ito, ‘buhay’ ang angkop na kahulugan kaysa ‘kaluluwa’ o ‘tao.’
- source_word: תַּחַת
  choice: kapalit ng
  rationale: Malinaw na ipinahahayag ang pagpapalit o katumbas na ganti sa pormulang legal.
- source_word: נָפֶשׁ
  choice: buhay
  rationale: Inuulit upang mapanatili ang simetriya at tuwirang pagtutumbas ng pariralang Hebreo.
theological_decisions:
- issue: Saklaw at tindi ng אָסוֹן sa batas na ito
  choice: Isinalin bilang ‘malubhang kapinsalaan’ nang hindi tinutukoy kung kanino ito nangyari o kung kinakailangang nakamamatay.
  alternative: ‘pinsala’ o ‘kamatayan’
  rationale: Ang אָסוֹן ay tumutukoy sa mabigat na pinsala, sakuna, o maaaring kamatayan. Hindi tahasang nililinaw ng talata ang eksaktong tindi o tinutukoy nito, kaya pinananatili ng salin at talababa ang tunay na ambiguwidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘kapalit ng’ upang maging natural ang legal na pormula habang pinananatili ang pagtutumbas ng Hebreo.
