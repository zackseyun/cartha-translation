  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: tl
  text: At kung hampasin ng isang lalaki ang kanyang aliping lalaki o aliping babae gamit ang pamalo, at mamatay ang alipin sa ilalim ng kanyang kamay, tiyak na paghihigantihan siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “tiyak na parurusahan siya.” Mas literal sa Hebreo: “tiyak na paghihigantihan siya,” isang mariing pormulang legal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang kondisyunal na gamit ng כִּי sa isang kasong legal.
- source_word: יַכֶּה
  choice: hampasin
  rationale: Malawak ang saklaw ng נכה bilang pananakit o paghampas; natural ang “hampasin” at hindi nito labis na tinutukoy ang paraan.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tuwirang pinananatili ang panlalaking anyong isahan sa tekstong legal.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: kanyang aliping lalaki o aliping babae
  rationale: Ipinakikita ng mga salita ang kalagayang pagkaalipin, hindi lamang ordinaryong paglilingkod, at pinananatili ang tahasang pagtatambal ng lalaki at babae.
- source_word: בַּשֵּׁבֶט
  choice: gamit ang pamalo
  rationale: Sa kontekstong ito, ang שֵׁבֶט ay kasangkapang ginagamit sa paghampas; malinaw at likas sa Filipino ang “pamalo.”
- source_word: וּמֵת
  choice: at mamatay ang alipin
  rationale: Pinananatili ang pagkakasunod o bunga ng pangyayari. Inuulit ang “alipin” upang maiwasan ang kalituhan sa panghalip.
- source_word: תַּחַת יָדוֹ
  choice: sa ilalim ng kanyang kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang maaaring pahiwatig nitong pagkamatay habang tuwirang nasa ilalim ng paghampas o kapangyarihan ng amo.
- source_word: נָקֹם יִנָּקֵם
  choice: tiyak na ipaghihiganti ang alipin
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa katiyakan. Pinananatili ng “ipaghihiganti” ang leksikal na diwa ng נקם nang hindi tinutukoy ang eksaktong parusa.
theological_decisions:
- issue: Uri ng legal na kahihinatnan sa נָקֹם יִנָּקֵם
  choice: tiyak na ipaghihiganti ang alipin
  alternative: tiyak na parurusahan ang gumawa nito
  rationale: Mariing hinihingi ng Hebreo ang paghihiganti o pagganti sa ginawang pagpatay, ngunit hindi tinutukoy sa talatang ito ang eksaktong paraang legal o parusa. Hindi iyon nililimitahan ng salin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “alipin” sa halip na “lingkod” upang malinaw ang bonded status, at “pamalo” bilang likas na katumbas ng instrumentong שֵׁבֶט.
