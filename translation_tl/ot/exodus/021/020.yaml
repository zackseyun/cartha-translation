revisions:
- from: At kung hampasin ng isang lalaki ang kanyang aliping lalaki o aliping babae gamit ang pamalo, at mamatay ang alipin sa ilalim ng kanyang kamay, tiyak na ipaghihiganti ang alipin.[a]
  to: At kung hampasin ng isang lalaki ang kanyang aliping lalaki o aliping babae gamit ang pamalo, at mamatay ang alipin sa ilalim ng kanyang kamay, tiyak na paghihigantihan siya.[a]
  rationale: Pinalitan ang di-gaanong likas na “ipaghihiganti ang alipin” ng “paghihigantihan siya.” Nililinaw ng panghalip ang alipin bilang tinutukoy ng paghihiganti, habang hindi idinadagdag ang uri o tindi ng parusa. Iniayon din ang talababa upang hindi magdagdag ng di-tahasang pariralang “ang gumawa nito.”
