  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: tl
  text: “Ang sinumang manakit sa kanyang ama o ina ay tiyak na papatayin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “at ang kanyang ina”; ginamit dito ang “o ina” upang ipakita ang diwang legal na ang pananakit sa alinman sa ama o ina ang tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: manakit
  rationale: Ang pandiwaring mula sa נכה ay tumutukoy sa taong humahampas o nananakit. Likas at malinaw sa makabagong Tagalog ang “manakit,” at hindi nito pinalalabis ang tindi gaya ng “bugbugin.”
- source_word: אָבִיו
  choice: kanyang ama
  rationale: Tiyak na “ama” sa isahang anyo ang Hebreo; pinananatili ang espesipikong pagtukoy sa magulang na lalaki.
- source_word: אִמּוֹ
  choice: ina
  rationale: Tiyak na binabanggit ng Hebreo ang “ina.” Hindi na inulit ang “kanyang” dahil natural sa Tagalog ang “kanyang ama o ina” at malinaw na kapuwa saklaw nito.
- source_word: מוֹת יוּמָת
  choice: tiyak na papatayin
  rationale: Ang infinitive absolute na kasunod ng pandiwang nasa pasibong anyo ay nagbibigay-diin sa itinakdang parusang kamatayan. Pinananatili ng “tiyak na papatayin” ang diin at ang legal na pasibong pahayag.
- source_word: וּ / וְ
  choice: o
  rationale: Bagaman karaniwang “at” ang pangatnig sa Hebreo, ang diwa ng kasong legal ay ang pananakit sa alinman sa ama o ina. Ang “o” ay umiiwas sa maling pahiwatig na kailangang saktan ang dalawang magulang.
theological_decisions:
- issue: Paglalahad ng legal na parusang kamatayan
  choice: tiyak na papatayin
  alternative: dapat patayin / tiyak na mamamatay
  rationale: Inilalahad ng talata ang isang parusang ipinapataw, hindi lamang ang kinahinatnang kamatayan. Pinananatili ng pasibong “papatayin” ang legal na puwersa nang hindi tinutukoy kung sino ang magsasagawa nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “manakit” bilang natural na katumbas ng pisikal na paghampas nang hindi ipinapalagay na paulit-ulit o gamit ang sandata; pinanatili ang mariing legal na pormula sa “tiyak na papatayin.”
