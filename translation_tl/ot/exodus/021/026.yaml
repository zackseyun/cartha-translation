base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: tl
  text: At kung saktan ng isang lalaki ang mata ng kanyang aliping lalaki[a] o ang mata ng kanyang aliping babae at mapinsala niya ito,[b] dapat niyang palayain ang alipin bilang kabayaran sa mata nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kanyang aliping lalaki ... kanyang aliping babae.” Tahasang tinutukoy rito ang mga taong nasa kalagayang alipin, hindi lamang mga karaniwang tagapaglingkod.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “masira niya ito” o “mabulag niya ito.” Ang pandiwang Hebreo ay tumutukoy sa pagsira o matinding pagpinsala sa mata.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “kapalit ng mata nito.” Ibig sabihin, ang pagpapalaya ang kabayaran sa pinsalang ginawa sa mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Pinananatili ang pang-ugnay na וְ at ang panimulang kondisyon ng isang kasong legal na ipinahahayag ng כִּי.
- source_word: יַכֶּה
  choice: hampasin
  rationale: Ang נכה ay karaniwang nangangahulugang humampas o manakit sa pamamagitan ng paghampas; hindi ipinahihiwatig ng anyo rito na paulit-ulit ang pananakit.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tuwirang sinasalamin ang panlalaking pangngalang isahan sa Hebreo nang hindi ginagawang neutral ang kasarian.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: kanyang aliping lalaki ... aliping babae
  rationale: Ipinakikita ng mga katawagan ang kalagayang alipin at ang tahasang pagtatangi sa lalaki at babae sa batas na ito.
- source_word: וְשִׁחֲתָהּ
  choice: at mapinsala niya iyon
  rationale: Saklaw ng שחת ang pagsira o matinding pagpinsala sa mata. Hindi nililimitahan ng salin ang kahulugan sa ganap na pagkabulag, bagaman maaaring iyon ang resulta.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: dapat niyang palayain ang alipin
  rationale: Sa kontekstong legal, ang שלח na may לַחָפְשִׁי ay nangangahulugang pakawalan tungo sa kalayaan. Ang “dapat” ay likas na naghahatid ng obligasyong legal sa Filipino.
- source_word: תַּחַת עֵינוֹ
  choice: bilang kabayaran sa mata nito
  rationale: Ang תַּחַת sa kontekstong legal ay nagpapahayag ng kapalit o kabayaran dahil sa pinsalang ginawa.
theological_decisions:
- issue: Pagtukoy sa kalagayang panlipunan ng עבד at אמה
  choice: aliping lalaki / aliping babae
  alternative: tagapaglingkod / alilang babae
  rationale: Mahalaga sa kasong ito ang pagmamay-ari at pagpapalaya; kaya mas tumpak ang “alipin” kaysa sa mas banayad na “tagapaglingkod.”
- issue: Kasarian ng taong gumagawa ng pinsala
  choice: isang lalaki
  alternative: isang tao / sinuman
  rationale: Ginagamit ng Hebreo ang אִישׁ, kaya pinananatili ang gramatikal na kasarian sa halip na tahimik itong gawing neutral.
- issue: Saklaw ng pinsala sa mata
  choice: mapinsala niya iyon
  alternative: mabulag niya ito / tuluyang masira niya ito
  rationale: Pinananatili ang lawak ng שחת at hindi tiyak na ipinapakahulugan na ganap na pagkabulag lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino na may himig ng batas. Ginamit ang “dapat” upang maging natural ang obligasyong legal, at inulit ang “ang alipin” upang maiwasan ang malabong panghalip at upang kapwa masaklaw ang aliping lalaki at babae.
