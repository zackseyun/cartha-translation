  to: At kung saktan ng isang lalaki ang mata ng kanyang aliping lalaki[a] o ang mata ng kanyang aliping babae at mapinsala niya ito,[b] dapat niyang palayain ang alipin bilang kabayaran sa mata nito.[c]
