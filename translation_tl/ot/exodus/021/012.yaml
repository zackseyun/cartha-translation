translation:
  language: tl
  text: “Ang sinumang manakit ng isang lalaki at mamatay ito ay tiyak na papatayin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas pormal: “Ang nananakit ng isang lalaki, at namatay ito, ay tiyak na papatayin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: humampas
  rationale: 'Ang participle ng נכה ay naglalahad ng isang kasong legal: ang taong humahampas. Pinananatili ng “humampas” ang mismong kilos nang hindi pa ipinapalagay sa pandiwa ang kamatayan ng biktima.'
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Karaniwang tumutukoy ang אִישׁ sa isang lalaki. Ang “ang sinuman” ay nagpapahayag ng pangkalahatang saklaw ng salarin, samantalang pinananatili ng “isang lalaki” ang kasarian ng biktimang nasa tekstong Hebreo.
- source_word: וָמֵת
  choice: at ito ay mamatay
  rationale: Pinananatili ng “at” ang payak na ugnayan ng waw at ang posibleng pormal na pagbasa ng sugnay, habang malinaw sa konteksto na ang kamatayan ang bunga ng paghampas. Ginamit ang “ito” upang maiwasan ang kalituhan kung sino ang namatay.
- source_word: מוֹת יוּמָת
  choice: tiyak na papatayin
  rationale: Ang infinitive absolute na kasunod ng passive imperfect ay mariing nagpapahayag ng hatol na kamatayan. Ang “tiyak na papatayin” ay natural at taimtim sa modernong Tagalog at pinananatili ang pasibong anyo.
