  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: tl
  text: Magbabayad-pinsala ang may-ari ng hukay. Magbabayad siya ng salapi[a] sa may-ari ng hayop, at magiging kaniya ang patay na hayop.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “pilak”; dito, tumutukoy ito sa salaping ibinabayad bilang kabayaran.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “at magiging kaniya ang bangkay ng hayop.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: ang may-ari ng hukay
  rationale: Sa kontekstong legal, ang בַּעַל ay tumutukoy sa taong nagmamay-ari o may pananagutan sa hukay; ang בּוֹר ay isang hukay na maaaring mahulugan ng hayop.
- source_word: יְשַׁלֵּם
  choice: dapat magbayad-pinsala
  rationale: Ang Piel ng שׁלם sa batas ay nagsasaad ng pagbabayad bilang kabayaran o pagsasauli sa napinsala, hindi lamang pangkaraniwang pagbabayad.
- source_word: כֶּסֶף
  choice: salapi
  rationale: Literal itong nangangahulugang pilak, ngunit sa ganitong kontekstong legal ay tumutukoy sa salaping ibinabayad bilang kabayaran.
- source_word: יָשִׁיב לִבְעָלָיו
  choice: magbabayad siya ... sa may-ari ng hayop
  rationale: Ang Hiphil ng שוב ay may diwang pagsasauli; dito, isinasagawa iyon sa pamamagitan ng pagbabayad sa may-ari ng namatay na hayop. Nilinaw ang tinutukoy ng hulaping panghalip.
- source_word: וְהַמֵּת
  choice: ang patay na hayop
  rationale: Ang substantibong 'ang patay' ay tumutukoy sa hayop na namatay; idinagdag ang 'hayop' upang maging malinaw sa natural na Tagalog.
- source_word: יִהְיֶה לוֹ
  choice: mapapasa-kaniya
  rationale: Ipinahihiwatig ng parirala na ang patay na hayop ay magiging pag-aari ng may-ari ng hukay bilang bahagi ng kasunduang kabayaran.
theological_decisions: []
translation_notes:
  register: Makabago at dignified na legal na Tagalog. Ginamit ang “dapat” upang ihayag ang bisa ng kautusang legal, at ang “magbayad-pinsala” upang mapanatili ang diwa ng restitution. Iniwasan ang sobrang teknikal na pananalita habang nililinaw ang mga tinutukoy na may-ari.
