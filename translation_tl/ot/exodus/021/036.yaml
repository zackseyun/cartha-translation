  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: tl
  text: O kung batid na ang toro ay mahilig manuwag mula kahapon at noong makalawa[a], at hindi ito binantayan ng may-ari nito, kailangang magbayad siya ng isang toro bilang kapalit ng toro, at mapupunta sa kaniya ang patay na hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula kahapon at noong makalawa,” isang idyoma na nangangahulugang dati nang ipinakikita ng toro ang ganitong asal.
    reason: cultural_note
lexical_decisions:
- source_word: א֣וֹ
  choice: O kung
  rationale: Ipinakikilala nito ang alternatibong kasong legal kasunod ng naunang talata; likas sa Filipino ang “O kung” sa ganitong kondisyon.
- source_word: נוֹדַע כִּי
  choice: alam nang
  rationale: Pinananatili ang pasibo/impersonal na diwang napatunayang batid na ang mapanganib na ugali ng toro.
- source_word: שׁוֹר נַגָּח
  choice: ang toro ay nanunuwag na
  rationale: Ang נַגָּח ay naglalarawan ng hayop na kilala sa paulit-ulit na panunuwag; ang “nanunuwag na” ay natural at malinaw sa modernong Tagalog.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: mula pa noong una
  rationale: Idyomang Hebreo ito para sa dati nang naobserbahang asal, hindi lamang sa literal na dalawang nakaraang araw; inilalagay sa talababa ang literal na anyo.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: ngunit hindi ito binantayan
  rationale: Sa konteksto, ang שמר ay pag-iingat o pagpigil sa mapanganib na hayop. Ang “binantayan” ay dignipikado at hindi labis na nagpapaliit sa kahulugan tungo lamang sa pagkukulong.
- source_word: בְּעָלָיו
  choice: ng may-ari nito
  rationale: Malinaw na katumbas sa modernong wikang legal ang “may-ari.”
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: kailangang magbayad siya
  rationale: Ipinahahayag ang mariin at obligadong pagbabayad na dala ng infinitive absolute at imperfect sa Hebreo.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: ng toro kapalit ng toro
  rationale: Pinananatili ang maikli at pormulang pananalita tungkol sa kapalit na kabayaran.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: at mapupunta sa kaniya ang patay na hayop
  rationale: Pinananatili ang literal na “patay” nang hindi tahasang nilulutas sa pangunahing teksto kung ito ay bangkay; malinaw ang paglilipat ng pag-aari.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na angkop sa tekstong legal: malinaw, marangal, at madaling maunawaan. Ginamit ang “toro” bilang karaniwang katumbas ng שׁוֹר sa kontekstong ito, at iniwasan ang mas arkaikong “baka” sa diwang panlahat o ang hiram na “oksen.”'
