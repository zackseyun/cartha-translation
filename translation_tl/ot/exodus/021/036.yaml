    rationale: 'Ang Hebreo ay impersonal/pasibo: nalalaman o batid na ang toro ay may dating ugaling manuwag. Maaaring magmukhang aktibong pandiwa na walang malinaw na tagaganap ang kasalukuyang salin.'
  - severity: low
    issue: Ang “mula pa noong una” ay hindi naipapakita ang anyo ng idyomang מִתְּמוֹל שִׁלְשֹׁם.
    rationale: Bagaman tama ang pangkalahatang diwa, ang literal na “mula kahapon at noong makalawa” ay kayang gamitin sa pangunahing teksto at ang idyomatikong kahulugan nito ay maipapaliwanag sa talababa.
  revised_text: O kung batid na ang toro ay mahilig manuwag mula kahapon at noong makalawa[a], at hindi ito binantayan ng may-ari nito, kailangang magbayad siya ng isang toro bilang kapalit ng toro, at mapupunta sa kaniya ang patay na hayop.
  revised_footnotes:
