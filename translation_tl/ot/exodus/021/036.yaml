  to: O kung batid na ang toro ay mahilig manuwag mula kahapon at noong makalawa[a], at hindi ito binantayan ng may-ari nito, kailangang magbayad siya ng isang toro bilang kapalit ng toro, at mapupunta sa kaniya ang patay na hayop.
  rationale: Inayos ang impersonal na legal na pahayag na “batid na,” ginawang malinaw na paulit-ulit na ugali ang נַגָּח sa “mahilig manuwag,” at pinanatili sa pangunahing teksto ang Hebreong idyoma tungkol sa dating panahon, kasama ang paliwanag nito sa talababa. Hindi binago ang hatol na ang may-ari ay magbayad ng toro kapalit ng toro at mapasakaniya ang patay na hayop.
