base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: tl
  text: Kung magnakaw ang isang lalaki ng baka o tupa[a] at katayin ito o ipagbili, magbabayad[b] siya ng limang baka bilang kapalit ng baka at apat na tupa bilang kapalit ng tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa kambing o, sa mas malawak na diwa, sa isang hayop mula sa maliliit na alagang hayop.
    reason: lexical_alternative
  - marker: b
    text: O “magbibigay siya ng kabayaran.” Sa kontekstong legal, saklaw ng pandiwang Hebreo ang pagsasauli o pagbabayad bilang kabayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Nagpapakilala ito ng kondisyon sa isang kasong legal; natural sa Filipino ang “kung” para sa ganitong ayos.
- source_word: יִגְנֹב
  choice: ay magnakaw
  rationale: Tuwirang ipinahahayag ang pagnanakaw sa kondisyunal na pormula ng batas.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Pinananatili ang tahasang panlalaking pangngalang ginamit sa Hebreo, na gumaganap bilang kinatawang paksa sa batas.
- source_word: שׁוֹר
  choice: baka
  rationale: Ang “baka” ang natural at sapat na malawak na katawagan sa Filipino para sa bovine na hayop dito; hindi nito nililimitahan ang kahulugan sa “toro.”
- source_word: שֶׂה
  choice: tupa
  rationale: Maaaring tumukoy ang salita sa isang tupa o kambing, ngunit “tupa” ang pinakanatural sa daloy ng talata; pinananatili sa talababa ang mas malawak na saklaw.
- source_word: וּטְבָחוֹ
  choice: at katayin iyon
  rationale: Ang “katayin” ay tumutukoy sa pagpatay sa hayop sa paraang mas tiyak kaysa sa pangkalahatang “patayin,” gaya ng pandiwang Hebreo.
- source_word: מְכָרוֹ
  choice: o ipagbili
  rationale: Natural na salin ng pagbebenta sa kondisyunal na legal na pahayag.
- source_word: חֲמִשָּׁה בָקָר
  choice: limang baka
  rationale: Ang בָקָר ay kolektibong katawagan sa mga baka; sa Filipino, natural itong bilangin bilang “limang baka.”
- source_word: יְשַׁלֵּם
  choice: magbabayad
  rationale: Sa kontekstong legal, tumutukoy ito sa pagbabayad bilang pagsasauli o kabayaran; malinaw ang diwang iyon sa itinakdang dami ng kapalit.
- source_word: תַּחַת
  choice: bilang kapalit ng
  rationale: Malinaw na pinananatili nito ang diwa ng pagpapalit o restitution na taglay ng pang-ukol.
- source_word: וְאַרְבַּע צֹאן
  choice: at apat na tupa
  rationale: Bagaman kolektibong katawagan ang צֹאן para sa maliliit na alagang hayop, ang “apat na tupa” ay natural at kaayon ng napiling tawag sa ninakaw na hayop.
