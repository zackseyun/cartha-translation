base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: tl
  text: Kung bibigyan siya ng kanyang amo ng isang asawa, at ang babaeng ito ay magsisilang sa kanya ng mga anak na lalaki o babae, ang asawa at ang mga anak nito ay magiging pag-aari ng amo ng asawang iyon, at aalis siyang mag-isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibig sabihin, aalis siyang walang kasamang asawang ibinigay sa kanya ng kanyang amo at mga anak nila.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Pinananatili ang kondisyunal na anyo ng kasong legal.
- source_word: אֲדֹנָיו
  choice: kanyang amo
  rationale: Ang “amo” ang likas na salitang Filipino para sa may kapangyarihan sa isang alipin o lingkod sa kontekstong ito; iniiwasan din nito ang maaaring banal na pahiwatig ng “Panginoon.”
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: bibigyan siya ... ng asawa
  rationale: Maaaring mangahulugan ang אִשָּׁה ng “babae” o “asawa,” ngunit ipinahihiwatig ng pagsasama at pagkakaroon nila ng mga anak ang ugnayang mag-asawa.
- source_word: וְיָלְדָה לוֹ
  choice: magsilang ito para sa kanya
  rationale: Pinananatili ang babae bilang simuno at ang di-tuwirang layon na tumutukoy sa lalaki.
- source_word: בָנִים אוֹ בָנוֹת
  choice: mga anak na lalaki o babae
  rationale: Hayagang binabanggit ng Hebreo ang kapwa lalaki at babaeng anak, kaya hindi ito pinaikli sa pangkalahatang “mga anak” lamang.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: ang asawa at ang mga anak nito
  rationale: Ang “asawa” ay kaayon ng naunang salin sa legal at pangmag-asawang konteksto; malinaw na ang mga anak ay sa babae.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: ay magiging pag-aari ng amo ng babae
  rationale: Malinaw na ipinahahayag ang legal na pagmamay-ari o katayuang taglay ng pariralang Hebreo, at nililinaw na ang tinutukoy ay amo ng babae.
- source_word: וְהוּא יֵצֵא
  choice: at aalis siya
  rationale: Natural na Filipino para sa paglabas o paglaya ng lalaki sa pagtatapos ng kanyang paglilingkod, nang hindi dinaragdagan ang teksto ng tahasang salitang “palalayain.”
- source_word: בְגַפּוֹ
  choice: mag-isa
  rationale: Ito ang malinaw at likas na katumbas ng idyomang nangangahulugang aalis siyang walang kasamang asawa o mga anak.
theological_decisions:
- issue: Paglalarawan sa pagkaalipin at legal na pagmamay-ari
  choice: Gamitin ang “amo” at ang tahasang pariralang “magiging pag-aari.”
  alternative: Palambutin bilang “tagapag-empleyo” o “mananatili sa kanyang amo.”
  rationale: Hindi pinalalambot ng salin ang legal at panlipunang kalagayang inilalarawan ng teksto, ngunit hindi rin ito dinaragdagan ng moral o doktrinal na komentaryo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang “aalis” kaysa sa literal ngunit hindi gaanong likas na “lalabas,” habang ipinaliliwanag sa talababa ang kahulugan ng pag-alis nang mag-isa.
