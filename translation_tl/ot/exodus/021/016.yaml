  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: tl
  text: “Ang sinumang dumukot ng isang lalaki[a] at nagbenta sa kanya, o matagpuan siyang nasa pag-iingat ng dumukot,[b] ay tiyak na papatayin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “magnakaw ng isang lalaki.” Sa kontekstong ito, tumutukoy ito sa pagdukot o pagnanakaw ng tao.
    reason: lexical_alternative
  - marker: b
    text: Literal na “at matagpuan siyang nasa kamay niya.” Ang Hebreong “nasa kamay niya” ay idyoma para sa pagiging nasa pag-aari, pag-iingat, o kontrol ng isang tao. Maaari ring isalin ang pang-ugnay na “at.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: dumukot
  rationale: Bagaman literal na tumutukoy ang גנב sa pagnanakaw, ang layon nitong אִישׁ at ang kasunod na pagbebenta o pagpigil sa biktima ay malinaw na tumutukoy sa pagdukot o pagnanakaw ng tao. Ang “dumukot” ang likas at malinaw na legal na salita sa modernong Tagalog.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Ang אִישׁ ay panlalaking pangngalang isahan. Pinananatili ng “isang lalaki” ang anyong panlalaki ng Hebreo nang hindi ipinapalagay na nililimitahan nito ang lahat ng posibleng aplikasyon ng batas.
- source_word: וּמְכָרוֹ
  choice: at ipagbili siya
  rationale: Tuwirang ipinahahayag nito ang pandiwang מכר at ang panlalaking isahang hulapi na tumutukoy sa taong dinukot.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: o matagpuan siyang nasa kapangyarihan nito
  rationale: Ang נִמְצָא ay “matagpuan,” at ang בְיָדוֹ, literal na “sa kamay niya,” ay idyoma para sa pag-aari, pagkakahawak, o kontrol. Ang “nasa kapangyarihan nito” ay natural sa Tagalog at malinaw na naghahatid ng diwang kontrol; ginagamit ang “nito” upang malinaw na tumukoy sa dumukot.
- source_word: מֹות יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagpapadiin sa hatol. Ang “tiyak na papatayin” ay naghahatid ng mariing parusang kamatayan, hindi lamang ng hulang mamamatay ang salarin.
theological_decisions:
- issue: Saklaw ng legal na paglabag
  choice: Saklaw ng batas ang pagdukot o pagnanakaw ng tao, maging naipagbili na ang biktima o matagpuan pa siyang nasa kapangyarihan ng dumukot.
  alternative: 'Maaaring basahin ang pangalawang sugnay bilang karagdagang kalagayan gamit ang “at”: “at matagpuan siyang nasa kapangyarihan nito.”'
  rationale: Maaaring gamiting pang-ugnay ang waw bilang “at” o, ayon sa lohika ng kasong legal, bilang “o.” Ang “o” ay nagpapakita ng dalawang kalagayan—naipagbili na ang biktima o hawak pa siya—nang hindi nilulutas nang palihim ang alternatibong sintaktikong pagbasa, na inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “dumukot” para sa tiyak na uri ng pagnanakaw ng tao, at “nasa kapangyarihan nito” para gawing natural ang Hebreong idyoma habang pinananatili sa talababa ang literal na anyo at ang posibleng pagbasa sa pang-ugnay.
