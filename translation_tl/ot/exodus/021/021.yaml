  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: tl
  text: Ngunit kung buhay pa siya makalipas ang isa o dalawang araw, hindi siya ipaghihiganti[a], sapagkat pera niya ang alipin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “hindi parurusahan ang amo.” Mas tiyak na tumutukoy ang Hebreo sa paghihiganti o legal na pagganti.
    reason: lexical_alternative
  - marker: b
    text: Literal, “sapagkat pera niya siya,” na nagpapahayag ng halagang pang-ekonomiya ng alipin para sa amo.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Ngunit
  rationale: Nagpapasok ito ng eksepsiyon o paglilimita sa naunang batas; natural at malinaw ang “Ngunit” sa makabagong Tagalog.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: nang isa o dalawang araw
  rationale: Pinananatili ang tiyak ngunit maikling saklaw ng panahong ipinahihiwatig ng Hebreo.
- source_word: יַעֲמֹד
  choice: mananatili siyang buhay
  rationale: Literal itong “tatayo/mananatili,” ngunit sa kontekstong legal ay tumutukoy sa patuloy na pagkabuhay matapos bugbugin, hindi sa ganap na paggaling.
- source_word: לֹא יֻקַּם
  choice: hindi siya ipaghihiganti
  rationale: Pinananatili ang diwang legal na paghihiganti o pagganti ng נקם, sa halip na gawing pangkalahatang “parurusahan.”
- source_word: כִּי כַסְפּוֹ הוּא
  choice: sapagkat pera niya ang alipin
  rationale: Inilalahad nang tuwiran ang tahasang pang-ekonomiyang katuwiran ng Hebreo. Idinagdag ang “alipin” bilang malinaw na paksa sa Tagalog nang hindi pinapalitan ang literal na “pera.”
theological_decisions:
- issue: Pang-ekonomiyang katuwiran sa batas tungkol sa pang-aalipin
  choice: Panatilihin ang tahasang “pera niya ang alipin.”
  alternative: “pag-aari niya ang alipin” o “sarili niyang kawalan iyon”
  rationale: Ang כַסְפּוֹ ay literal na “kaniyang salapi/pera.” Hindi dapat pagaanin o baguhin ng salin ang mabigat na pananalita ng teksto.
- issue: Saklaw ng legal na pagganti
  choice: “hindi siya ipaghihiganti”
  alternative: “hindi parurusahan ang amo”
  rationale: Ang anyong Hebreo ay nakatuon sa biktimang hindi ipaghihiganti, at ang ugat נקם ay mas tiyak sa paghihiganti o legal na pagganti kaysa sa pangkalahatang kaparusahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong legal. Pinanatili ang matalas na pang-ekonomiyang pananalita ng Hebreo at iniwasang ipahiwatig na ganap nang gumaling ang alipin.
