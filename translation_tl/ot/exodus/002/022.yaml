base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: tl
  text: Nagsilang siya ng isang anak na lalaki, at pinangalanan niya itong Gersom[a], sapagkat sinabi niya[b], “Naging dayuhan ako sa ibang lupain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Gersom ay kahawig sa tunog ng pananalitang Hebreo na nangangahulugang “dayuhan doon,” na kaugnay ng paliwanag ni Moises sa pangalan.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Isa akong dayuhan sa ibang lupain.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Nagsilang siya ng isang anak na lalaki
  rationale: Tuwirang ipinapahayag ng ילד na nanganak ang babae, at nililinaw ng בֵּן na lalaki ang anak.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: at pinangalanan niya itong
  rationale: Ang literal na idyomang Hebreo ay ‘tinawag niya ang pangalan nito,’ ngunit ang ‘pinangalanan niya itong’ ay likas sa makabagong Tagalog at lubos na naihahatid ang pormula ng pagbibigay-pangalan.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Isinalin sa karaniwang anyong Filipino ang personal na pangalang Hebreo; ipinaliliwanag sa talababa ang paglalaro sa tunog ng pangalan.
- source_word: כִּי אָמַר
  choice: sapagkat sinabi niya
  rationale: Ipinakikilala ng כִּי ang paliwanag ni Moises sa ibinigay niyang pangalan.
- source_word: גֵּר
  choice: dayuhan
  rationale: Tumutukoy ang גֵּר sa taong naninirahan sa lupaing hindi kanya o kabilang sa ibang bayan. Ang ‘dayuhan’ ay malinaw at natural, nang hindi nagdaragdag ng teknikal na katayuang legal.
- source_word: הָיִיתִי
  choice: Naging
  rationale: Ang perpektong pandiwang Hebreo ay maaaring tumukoy sa kalagayang naranasan o umabot hanggang sa sandali ng pagsasalita. Pinananatili ng ‘naging’ ang payak na pananaw sa nakaraan nang hindi labis na nilulutas ang aspekto.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: sa ibang lupain
  rationale: Likas sa Tagalog ang pariralang ito at tumpak na inilalarawan ang lupaing banyaga o hindi sariling lupain.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘anak na lalaki’ upang tahasang katawanin ang בֵּן, at ‘dayuhan’ bilang natural na katumbas ng גֵּר. Inilipat ang tandang [a] sa tabi ng ‘Gersom,’ sapagkat pangalan mismo ang ipinaliliwanag ng talababa.
