  to: Noong mga araw na iyon, nang lumaki na si Moises, lumabas siya papunta sa kaniyang mga kapatid[a] at nakita niya ang kanilang mga pasanin. Nakita niya ang isang lalaking Ehipsiyo na hinahampas ang isang lalaking Hebreo, isa sa kaniyang mga kapatid[a].
