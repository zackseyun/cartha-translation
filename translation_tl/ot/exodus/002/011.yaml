base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: tl
  text: Noong mga araw na iyon, nang lumaki na si Moises, lumabas siya papunta sa kaniyang mga kapatid[a] at nakita niya ang kanilang mga pasanin. Nakita niya ang isang lalaking Ehipsiyo na hinahampas ang isang lalaking Hebreo, isa sa kaniyang mga kapatid[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kalahi” o “mga kababayan.” Ginagamit ng Hebreo ang wikang pampamilya upang ipahayag ang pakikiisa ni Moises sa mga Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Nangyari noong mga araw na iyon
  rationale: Pinananatili ang pormulang Hebreo sa paglipat ng salaysay nang hindi gumagamit ng makalumang pananalita.
- source_word: וַיִּגְדַּל
  choice: nang malaki na si Moises
  rationale: Sa konteksto, tumutukoy ito sa pagiging nasa hustong gulang ni Moises, hindi sa pagtaas ng kanyang katayuan.
- source_word: אֶל אֶחָיו / מֵאֶחָיו
  choice: kanyang mga kapatid / isa sa kanyang mga kapatid
  rationale: Pinananatili ang tahasang wikang pampamilya at ang pag-uugnay ni Moises sa mga Hebreo; nililinaw sa talababa na maaari itong tumukoy sa mga kalahi o kababayan.
- source_word: בְּסִבְלֹתָם
  choice: mabibigat nilang pasan
  rationale: Napananatili ang kongkretong larawan ng mga pasanin habang ipinahihiwatig ang mapaniil na sapilitang paggawa.
- source_word: אִישׁ מִצְרִי / אִישׁ עִבְרִי
  choice: isang lalaking Ehipsiyo / isang lalaking Hebreo
  rationale: Sinasalamin ang magkatulad na pagkakabuo ng dalawang pariralang Hebreo.
- source_word: מַכֶּה
  choice: binubugbog
  rationale: Ipinapahayag ang nagpapatuloy na pisikal na pananakit; natural ito sa Filipino at angkop sa konteksto ng pang-aapi.
theological_decisions:
- issue: Wikang nagpapahayag ng pagkakamag-anak sa אֶחָיו / מֵאֶחָיו
  choice: mga kapatid
  alternative: mga kalahi; mga kababayan
  rationale: Pinananatili ang pampamilyang talinghaga at ang pakikiisa ni Moises sa mga Hebreo, habang iniiwasang ituring silang literal na magkakapatid sa iisang sambahayan sa pamamagitan ng talababa.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “mabibigat nilang pasan” upang panatilihin ang larawan ng pasanin at ang diwa ng mapaniil na paggawa; ginamit ang “binubugbog” bilang likas na paglalarawan ng nagpapatuloy na pananakit.
