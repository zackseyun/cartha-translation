  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: tl
  text: Bumaba ang anak na babae ng Paraon upang maligo sa Nilo, habang naglalakad sa tabi ng pampang ng Nilo ang mga dalaga niyang kasama. Nakita niya ang basket[a] sa gitna ng mga tambo, at isinugo niya ang kanyang aliping babae[b], at kinuha niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo para sa “basket” dito ay siya ring salitang ginamit para sa “arka” ni Noe sa Genesis 6–9.
    reason: cross_reference
  - marker: b
    text: Sa Hebreo, “kanyang aliping babae.” Ayon sa isang tradisyonal na pagbasa, “kanyang bisig.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: Bumaba
  rationale: Pinananatili ang direksiyonal na diwa ng ירד sa natural na Tagalog.
- source_word: בַּת פַּרְעֹה
  choice: ang anak na babae ng Paraon
  rationale: Tuwirang inilalarawan ang ugnayan at iniiwasan ang posibleng kalabuan ng mas maikling “anak ng Paraon.”
- source_word: לִרְחֹץ
  choice: upang maligo
  rationale: Sa konteksto ng pagbaba sa Nilo, ang “maligo” ang pinakanatural na kahulugan ng רחץ.
- source_word: עַל הַיְאֹר
  choice: sa Nilo
  rationale: Lokasyonal ang gamit ng עַל dito; natural sa Tagalog ang “sa Nilo.”
- source_word: וְנַעֲרֹתֶיהָ
  choice: ang mga dalaga niyang kasama
  rationale: Ipinapakita ng “mga dalaga” ang edad at kasarian; idinaragdag ng “kasama” ang malinaw na kontekstuwal na relasyon nang hindi tiyak na tinatawag silang mga lingkod.
- source_word: הֹלְכֹת
  choice: habang naglalakad
  rationale: Kinakatawan ang nagpapatuloy at pansuportang kilos ng participle.
- source_word: עַל יַד הַיְאֹר
  choice: sa tabi ng pampang ng Nilo
  rationale: Inililinaw ang idyomatikong lokasyon sa kahabaan o tabi ng ilog.
- source_word: הַתֵּבָה
  choice: ang basket
  rationale: Ang maliit na sisidlan para sa sanggol ang tinutukoy sa konteksto; inilalagay sa talababa ang ugnayang leksikal nito sa arka ni Noe.
- source_word: בְּתוֹךְ הַסּוּף
  choice: sa gitna ng mga tambo
  rationale: Malapit sa anyo at diwa ng Hebreo at natural sa makabagong Tagalog.
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ
  choice: inutusan niya ang kanyang alilang babae
  rationale: Ang שלח kasama ang אֲמָתָהּ ay nagpapahiwatig na pinapunta niya ang babaeng alipin/lingkod; ang “inutusan” ay natural na naghahatid ng diwa sa Tagalog.
- source_word: וַתִּקָּחֶהָ
  choice: na kunin iyon
  rationale: 'Sa Tagalog, natural na isinasanib ang sunod na kilos sa utos: ang alilang babae ang kumukuha sa basket. Iniiwasan nitong ipahiwatig na ang anak ng Paraon mismo ang kumuha nito pagkatapos magsugo.'
theological_decisions:
- issue: Pagpapakahulugan sa תבה sa salaysay tungkol kay Moises
  choice: basket
  alternative: arka
  rationale: Ang konteksto ay isang maliit na sisidlan sa mga tambo. Gayunman, pinananatili sa talababa ang mahalagang ugnayan sa kaparehong salitang ginamit para sa arka ni Noe.
- issue: Pagbasa sa אֲמָתָהּ
  choice: kanyang alilang babae
  alternative: kanyang bisig
  rationale: Sinusuportahan ng Masoretikong patinig at ng sintaksis kasama ng “nagsugo/nag-utos” ang kahulugang babaeng alipin o lingkod. Itinatala sa talababa ang tradisyonal na alternatibo upang hindi maitago ang tekstuwal na usapin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon” at “Nilo,” na karaniwang anyo sa Tagalog. Pinanatili ang pagkakaiba ng mga dalagang kasama (נַעֲרֹת) at ng alilang babaeng isinugo (אָמָה).
