translation:
  language: tl
  text: Sinabi sa kanya ng anak na babae ni Paraon, “Pumunta ka.” Kaya pumunta ang dalaga at tinawag ang ina ng bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: anak na babae ng Paraon
  rationale: Tuwirang inilalarawan ng pariralang konstrakto ang anak na babae ni Paraon; malinaw at natural ito sa makabagong Filipino.
- source_word: לֵכִי
  choice: Sige, pumunta ka
  rationale: Pautos na pambabaeng isahan ito mula sa הלך. Idinagdag ang “Sige” upang natural na ipahayag sa Filipino ang maikli at nagpapahintulot na tugon sa mungkahi sa naunang talata.
- source_word: הָעַלְמָה
  choice: ang dalaga
  rationale: Ang עַלְמָה ay tumutukoy sa isang batang babae o kabataang babae; ang “dalaga” ay maikli, natural, at hindi lipas na katumbas sa kontekstong ito.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: at tinawag ang ina ng sanggol
  rationale: Maaaring mangahulugang tumawag o sumundo ang קרא na may tuwirang layon. Pinananatili ng “tinawag” ang tuwiran at mabilis na daloy ng salaysay.
- source_word: הַיָּלֶד
  choice: ang sanggol
  rationale: Bagaman karaniwang “bata” o “batang lalaki” ang יֶלֶד, malinaw sa agarang konteksto na sanggol si Moises; “sanggol” ang pinakanatural na pagtukoy sa Filipino nang hindi binabago ang tinutukoy.
