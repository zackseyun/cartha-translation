base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: tl
  text: Kinabukasan, lumabas si Moises. At may dalawang lalaking Hebreo na nag-aaway. Sinabi niya sa lalaking may sala[a], “Bakit mo sinasaktan ang kapwa mo[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lalaking nasa mali” o “masamang lalaki.”
    reason: lexical_alternative
  - marker: b
    text: O “kasama mo” o “kapitbahay mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: muling lumabas si Moises
  rationale: Ang Qal wayyiqtol ng יצא ay nagsusulong ng salaysay. Hayag na pinangalanan si Moises sa Tagalog upang maging malinaw ang paksa; ang “muling” ay likas na ipinahihiwatig ng ikalawang paglabas sa kasunod na araw.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Kinabukasan
  rationale: Literal na “sa ikalawang araw”; sa daloy ng salaysay, natural at tumpak ang “Kinabukasan.”
- source_word: וְהִנֵּה
  choice: Naroon
  rationale: Ipinahahayag ng הִנֵּה ang bigla o matingkad na pagkakita. Ang “Naroon” ay natural sa modernong Tagalog at hindi lubusang inaalis ang presentational force nito.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: dalawang lalaking Hebreo
  rationale: Pinananatili ang bilang, panlalaking katawagan, at etnikong pagkakakilanlan ng parirala.
- source_word: נִצִּים
  choice: nag-aaway
  rationale: Ang Niphal participle ay tumutukoy sa aktibong alitan; ang kasunod na tanong tungkol sa pananakit ay nagpapakitang pisikal ang away.
- source_word: לָרָשָׁע
  choice: lalaking nasa mali
  rationale: Sa kontekstong ito, ang רָשָׁע ay maaaring tumukoy sa taong mali o may sala sa partikular na alitan, hindi kinakailangang isang pangkalahatang hatol sa buong pagkatao niya.
- source_word: לָמָּה תַכֶּה
  choice: Bakit mo sinasaktan
  rationale: Ipinahihiwatig ng imperfect sa eksena ang kasalukuyan o nagpapatuloy na pananakit. Likas sa Tagalog ang “sinasaktan” at sapat na saklaw nito ang paghampas.
- source_word: רֵעֶךָ
  choice: ang kapwa mo
  rationale: Ang רֵעַ ay maaaring kasama, kapwa, o kapitbahay. Ang “kapwa mo” ay natural dito at akma sa ugnayan ng dalawang lalaking Hebreo nang hindi nagdaragdag ng legal na pakahulugan.
theological_decisions:
- issue: Saklaw ng moral na paglalarawan sa לָרָשָׁע
  choice: lalaking nasa mali
  alternative: masamang lalaki / lalaking may sala
  rationale: Pinananatili nito ang moral na paghatol sa umaatake habang hindi ipinapalagay na ang salita ay tiyak na pangkalahatang paglalarawan sa karakter niya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalaysay. Iniwasan ang lipas na “narito” o “masdan” bilang katumbas ng הִנֵּה, ngunit pinanatili ang biglang pagharap sa tanawin sa pamamagitan ng “Naroon.”
