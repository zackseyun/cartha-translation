id: EXO.2.2
reference: Exodus 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: tl
  text: Nagdalang-tao ang babae at nagsilang ng isang anak na lalaki. Nang makita niyang mabuti[a] ang bata, itinago niya ito sa loob ng tatlong buwan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “maganda” o “kaaya-aya.” Literal na “mabuti” ang salitang Hebreo, ngunit maaari rin itong tumukoy sa pagiging kaaya-aya o mainam sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Nagdalang-tao
  rationale: Likas at malinaw na modernong Tagalog para sa pagiging buntis o paglilihi, at pinananatili ang pagkakasunod-sunod ng salaysay.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tuwirang sinusunod ang tahasang katawagan sa Hebreo at hindi ipinapasok sa talata ang ugnayang 'asawa' mula sa konteksto.
- source_word: וַתֵּלֶד בֵּן
  choice: nagsilang ng isang anak na lalaki
  rationale: Natural at dignified na katumbas ng karaniwang idyoma sa Hebreo tungkol sa panganganak ng anak na lalaki.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: Nang makita niyang mabuti ang bata
  rationale: Maayos na inilalahad sa Tagalog ang nakita o napag-unawa ng babae tungkol sa bata habang pinananatili ang payak na kahulugan ng טוֹב.
- source_word: טוֹב
  choice: mabuti
  rationale: Ito ang pangunahing leksikal na kahulugan at maaari ring magpanatili ng alingawngaw ng pananalita sa Genesis 1; ang posibleng estetikong diwang 'maganda' ay inilagay sa talababa.
- source_word: וַתִּצְפְּנֵהוּ
  choice: itinago niya ito
  rationale: Tuwiran at natural na katumbas ng pandiwang nangangahulugang itago o ikubli.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: sa loob ng tatlong buwan
  rationale: Karaniwang modernong Tagalog na tumpak na nagsasaad ng tagal nang hindi kinakailangang tukuying mga buwang lunar.
theological_decisions:
- issue: Paglalarawan sa sanggol sa pamamagitan ng טוֹב
  choice: mabuti
  alternative: maganda; kaaya-aya
  rationale: Pinananatili ng 'mabuti' ang malawak at pangunahing kahulugan ng Hebreo at ang posibleng pampanitikang kaugnayan nito sa naunang paggamit sa Kasulatan. Hindi tahasang nilulutas bilang pisikal na kagandahan ang tunay na lawak ng salita; itinatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang 'bata' sa ikalawang pangungusap upang maging malinaw ang tinutukoy ng pang-uri, habang ang panghalip na 'ito' ay nagpapanatili ng maayos na daloy.
