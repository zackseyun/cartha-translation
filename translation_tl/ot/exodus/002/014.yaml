  naturalness: Natural at marangal ang modernong Filipino. Ang “At natakot si Moises” ay kasinglinaw ng “Kaya natakot si Moises” at mas maingat sa daloy ng salaysay.
  terminology: Ang “pinuno at hukom,” “Ehipsiyo,” at “Moises” ay angkop. Nananatiling kapaki-pakinabang ang talababa para sa idiomatikong pagbasa ng tanong tungkol sa layunin ni Moises.
