source:
  edition: WLC
  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: tl
  text: Ngunit sinabi niya[a], “Sino ang nagtalaga sa iyo bilang pinuno at hukom namin? Sinasabi mo bang, ‘Papatayin mo ba ako gaya ng pagpatay mo sa Ehipsiyo?’” At natakot si Moises at sinabi, “Tiyak ngang nalaman na ang nangyari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Balak mo ba akong patayin gaya ng pagpatay mo sa Ehipsiyo?”
    reason: Ipinapakita ang idiomatikong alternatibo para sa הַלְהָרְגֵנִי אַתָּה אֹמֵר, na maaaring unawain bilang tanong tungkol sa layunin o balak.
lexical_decisions:
- source_word: מִי
  choice: Sino
  rationale: Tuwirang panghalip pananong na humahamon sa awtoridad ni Moises.
- source_word: שָׂמְךָ
  choice: nagtalaga sa iyo
  rationale: Ang שׂים ay maaaring mangahulugang maglagay o magtalaga; natural sa Filipino ang “nagtalaga” para sa pagbibigay ng tungkulin o awtoridad.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: bilang pinuno at hukom
  rationale: Ang אִישׁ ay appositional/idiomatic sa parirala; hindi kailangang isalin nang hiwalay bilang “isang lalaki,” na magiging pilit at maaaring magpahiwatig ng ikatlong katungkulan.
- source_word: עָלֵינוּ
  choice: namin
  rationale: Sa natural na Filipino, ang “pinuno at hukom namin” ay malinaw na nagpapahayag ng awtoridad sa kanila; mas matatas ito kaysa “sa ibabaw namin.”
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Sinasabi mo bang, ‘Papatayin mo ba ako’
  rationale: Pinananatili ang kapansin-pansing pandiwang אֹמֵר, “sinasabi,” at ang tanong tungkol sa pagpatay, habang natural ang anyo sa Filipino.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: gaya ng pagpatay mo sa Ehipsiyo
  rationale: Tuwirang paghahambing sa naunang pagpatay sa tiyak na Ehipsiyo.
- source_word: וַיִּירָא
  choice: natakot
  rationale: Natural na salaysay na katumbas ng wayyiqtol ng ירא.
- source_word: אָכֵן
  choice: Tiyak ngang
  rationale: Ipinapahayag ang mariing pagkilala o hinuha ni Moises; ang “nga” ay natural na nagpapalakas sa katiyakan.
- source_word: נוֹדַע הַדָּבָר
  choice: nalaman na ang nangyari
  rationale: Ang Niphal ng ידע ay nagpapahiwatig na nabunyag o nalaman na; sa konteksto, natural na tumutukoy ang הַדָּבָר sa nangyaring pagpatay.
theological_decisions:
- issue: Pagpapakahulugan sa לְאִישׁ sa pariralang לְאִישׁ שַׂר וְשֹׁפֵט
  choice: bilang pinuno at hukom
  alternative: bilang isang lalaki, pinuno, at hukom
  rationale: Ang “lalaki” ay bahagi ng Hebreong appositional na pahayag at hindi hiwalay na katungkulan. Ang hindi hiwalay na pagsasalin dito ay nagpapanatili sa diwa nang hindi lumilikha ng maling tatluhang talaan.
- issue: Sintaks ng הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Sinasabi mo bang, ‘Papatayin mo ba ako…?’
  alternative: Balak mo ba akong patayin…?
  rationale: Pinananatili ng pangunahing teksto ang tahasang אֹמֵר (“sinasabi”), kahit maaari ding idiomatikong unawain ang parirala bilang pagtatanong sa balak ni Moises. Inilalagay ang alternatibo sa talababa upang mapanatili ang tunay na sintaktikong posibilidad.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “Ehipsiyo” bilang karaniwang katawagan sa taong mula sa Ehipto, at iniwasan ang literal ngunit hindi likas na “sa ibabaw namin.”
