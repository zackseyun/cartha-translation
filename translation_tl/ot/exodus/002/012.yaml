  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: tl
  text: Tumingin siya sa magkabilang panig, at nang makita niyang walang ibang tao roon[a], sinaktan niya ang Ehipsiyo at itinago niya siya sa buhangin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “walang lalaki.” Maaari ring tumukoy ang Hebreong pananalita sa kawalan ng sinumang ibang tao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: Tumingin siya sa magkabilang panig
  rationale: Ang פנה ay literal na ‘bumaling,’ ngunit kasama ng idyomang כֹּה וָכֹה ay tumutukoy sa pagtingin sa dalawang direksiyon. Natural sa modernong Tagalog ang ‘tumingin sa magkabilang panig.’
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: nang makita niyang walang ibang tao roon
  rationale: Literal na ‘nakita niyang walang lalaki,’ ngunit maaaring gamitin nang pangkalahatan ang אִישׁ para sa kawalan ng sinumang tao. Ang ‘ibang’ ay nililinaw na walang ibang taong naroon bukod kay Moises at sa Ehipsiyo.
- source_word: וַיַּךְ
  choice: pinatay niya
  rationale: Pangunahing nangangahulugang ‘hampasin’ ang נכה, ngunit sa kontekstong ito ay nakamamatay ang ginawa, gaya ng ipinahihiwatig ng pagtatago sa katawan. Inihahatid ng ‘pinatay’ ang malinaw na kinalabasan sa natural na Tagalog.
- source_word: הַמִּצְרִי
  choice: ang Ehipsiyo
  rationale: Tuwirang katawagan sa lahi o bansang pinagmulan, na may tiyak na pantukoy.
- source_word: וַיִּטְמְנֵהוּ
  choice: itinago ito
  rationale: Ang טמן ay ‘itago’ o ‘ikubli.’ Ang ‘ito’ ay natural na tumutukoy sa katawan ng Ehipsiyo nang hindi idinaragdag sa pangunahing teksto ang salitang ‘bangkay.’
- source_word: בַּחוֹל
  choice: sa buhangin
  rationale: Tuwirang katumbas ng חוֹל at natural na pagpapahayag sa Tagalog.
