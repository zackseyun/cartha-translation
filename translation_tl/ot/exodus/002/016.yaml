base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: tl
  text: Ang pari ng Midian[a] ay may pitong anak na babae. Dumating sila, umigib ng tubig[b], at pinuno ang mga labangan upang painumin ang kawan ng kanilang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Isang pari ng Midian.” Maaaring tumukoy ang Hebreo sa isang partikular na pari o sa isa lamang sa mga paring kaugnay ng Midian.
    reason: lexical_alternative
  - marker: b
    text: Ang “umigib ng tubig” ay salin ng pandiwang tumutukoy sa pag-ahon ng tubig mula sa isang balon.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: Ang pari ng Midian
  rationale: Likas na salin ng כֹהֵן bilang “pari” at ng kaugnayang panrehiyon bilang “ng Midian.” Hindi ginawang tahasang temporal ang waw; ang daloy ay naipapakita nang natural sa Filipino.
- source_word: שֶׁבַע בָּנוֹת
  choice: ay may pitong anak na babae
  rationale: Ang Hebreong sugnay na literal na “sa pari ... [ay] pitong anak na babae” ay likas na ipinahahayag sa Filipino sa pamamagitan ng “may.”
- source_word: וַתָּבֹאנָה
  choice: Dumating sila
  rationale: Direktang salin ng pandiwang בוא sa sunod-sunod na salaysay; malinaw ang pambabaeng maramihang simuno mula sa naunang “pitong anak na babae.”
- source_word: וַתִּדְלֶנָה
  choice: sumalok ng tubig
  rationale: Ang דלה ay tumutukoy sa pag-ahon o pagsalok ng tubig mula sa balon; likas at malinaw sa modernong Filipino ang “sumalok ng tubig.”
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: pinuno ang mga painuman
  rationale: Ang רְהָטִים ay mga sisidlan o labangang pinag-iinuman ng hayop; “mga painuman” ang malinaw at maikli nitong katumbas sa konteksto.
- source_word: לְהַשְׁקוֹת צֹאן
  choice: upang painumin ang kawan
  rationale: Pinananatili ng “upang painumin” ang causative na diwa ng Hiphil ng שקה. Ang צֹאן ay kolektibong maliliit na alagang hayop, kaya natural ang “kawan.”
- source_word: אֲבִיהֶן
  choice: ng kanilang ama
  rationale: Tumpak at natural na ipinahahayag ang pambabaeng maramihang hulaping paari.
theological_decisions:
- issue: Kung tiyak o di-tiyak ang pagkakakilanlan ng pari ng Midian
  choice: Ang pari ng Midian
  alternative: Isang pari ng Midian
  rationale: Walang artikulo ang כֹהֵן, ngunit maaaring maging tiyak ang parirala dahil sa konteksto o konstruksyon. Pinili sa teksto ang tiyak na anyo habang pinananatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Ginamit ang “pari,” “sumalok ng tubig,” at “mga painuman” bilang karaniwang salitang angkop sa sinaunang tagpo; iniwasan ang di-kailangang lumang anyo at ang pagdaragdag ng tahasang “Ngayon.”
