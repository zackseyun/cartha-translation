revisions:
- from: Binuksan niya iyon at nakita niya ang bata. At naroon, umiiyak ang isang sanggol na lalaki.[a] Nahabag siya rito[b] at sinabi, “Isa ito sa mga anak ng mga Hebreo.”
  to: Binuksan niya iyon at nakita niya ang bata. At narito, isang batang lalaki ang umiiyak.[a] Nahabag siya sa kanya[b] at sinabi, “Isa ito sa mga anak ng mga Hebreo.”
  rationale: Pinalitan ang “sanggol na lalaki” ng “batang lalaki” upang hindi paliitin ang saklaw ng נַעַר, at inayos ang sugnay na may וְהִנֵּה para sa mas likas na modernong Tagalog. Ginawang “sa kanya” ang panghalip upang tuwirang tukuyin ang batang lalaki.
