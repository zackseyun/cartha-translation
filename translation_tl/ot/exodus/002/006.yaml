  naturalness: Nauunawaan ang “At naroon, umiiyak ang isang sanggol na lalaki,” ngunit mas likas at malinaw sa modernong Tagalog ang “At narito, isang batang lalaki ang umiiyak.”
  terminology: Ang “bata,” “nahabag,” at “mga Hebreo” ay angkop. Ang “sa kanya” ay mas tuwirang tumutukoy sa batang lalaki kaysa “rito,” kahit kapwa posible sa Tagalog.
