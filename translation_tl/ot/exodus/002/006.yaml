base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: tl
  text: Binuksan niya iyon at nakita niya ang bata. At narito, isang batang lalaki ang umiiyak.[a] Nahabag siya sa kanya[b] at sinabi, “Isa ito sa mga anak ng mga Hebreo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “At narito” ay nagsasalin sa isang salitang Hebreo na masiglang nagtutuon ng pansin sa nakita niya.
    reason: lexical_alternative
  - marker: b
    text: O “Naawa siya sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Binuksan niya iyon
  rationale: Ang pandiwa ay nangangahulugang “binuksan”; ang “iyon” ay likas na tumutukoy sa sisidlang binanggit sa naunang konteksto.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: at nakita niya ang bata
  rationale: May panlalaking isahang hulapi ang pandiwa, na sinusundan ng tahasang pariralang “ang bata.” Sa Tagalog, sapat at natural ang “nakita niya ang bata” at naipahahayag nito ang tinutukoy nang hindi nagiging paulit-ulit.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Pangkalahatang katawagan ang יֶלֶד para sa isang bata; hindi nito agad nililimitahan ang edad.
- source_word: וְהִנֵּה
  choice: At naroon
  rationale: Ang הִנֵּה ay nagtutuon ng pansin sa biglang nakita. Ang “At naroon” ay natural sa makabagong Tagalog habang pinananatili ang masiglang paglalahad.
- source_word: נַעַר בֹּכֶה
  choice: umiiyak ang isang sanggol na lalaki
  rationale: Sa konteksto, ang נַעַר ay tumutukoy sa sanggol na si Moises at nagpapahiwatig na lalaki siya; ipinahahayag ng “umiiyak” ang nagpapatuloy na kilos.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Nahabag siya rito
  rationale: Ang חמל na may עַל ay nagpapahayag ng awa o habag. Natural ang “nahabag” at hindi nito ipinapasok ang kasunod na pagkilos na iligtas o huwag patayin.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: Isa ito sa mga anak ng mga Hebreo
  rationale: 'Partitibo ang מִן: kinikilala niya ang bata bilang isa sa mga anak na kabilang sa mga Hebreo.'
- source_word: הָעִבְרִים
  choice: mga Hebreo
  rationale: Ito ang karaniwang katawagang etniko para sa עִבְרִים.
- source_word: זֶה
  choice: Isa ito
  rationale: Itinuturo ng demonstratibo ang batang nasa harap niya; natural sa Tagalog ang pagkakasabing “Isa ito sa…”
theological_decisions: []
