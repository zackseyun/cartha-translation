  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sanggol na lalaki” upang maging likas sa konteksto at mapanatili ang panlalaking pagtukoy ng נַעַר; pinanatili ang “Hebreo” bilang karaniwang katawagang etniko.
