base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: tl
  text: Pagkatapos, dumating ang mga pastol at itinaboy sila. Ngunit tumayo si Moises at iniligtas sila[a], at pinainom niya ang kanilang kawan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinagip sila.” Ang pandiwang Hebreo ay maaaring mangahulugang magligtas o magpalaya; dito, sinagip ni Moises ang mga babae nang itaboy sila ng mga pastol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, dumating
  rationale: Ipinahahayag ng wayyiqtol ang kasunod na pangyayari sa salaysay; natural sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: הָרֹעִים
  choice: ang mga pastol
  rationale: Ang substantibong participle mula sa רעה ay tumutukoy sa mga nag-aalaga ng kawan; “mga pastol” ang karaniwan at angkop na katumbas.
- source_word: וַיְגָרְשׁוּם
  choice: itinaboy sila
  rationale: Ang גרש ay nangangahulugang magtaboy o magpalayas. Pinananatili ng “itinaboy” ang marahas at mapang-aping kilos laban sa mga babae.
- source_word: וַיָּקָם
  choice: tumayo
  rationale: Ang קום ay literal na pagbangon o pagtayo at dito ay nagpapahiwatig ng tiyak na pagkilos ni Moises; payak at natural ang “tumayo.”
- source_word: וַיּוֹשִׁעָן
  choice: iniligtas sila
  rationale: Ang Hifil ng ישׁע ay “magligtas” o “magpalaya.” Pinananatili ng “iniligtas” ang lakas ng pandiwa nang hindi ito pinahihina sa simpleng pagtulong.
- source_word: וַיַּשְׁקְ
  choice: pinainom niya
  rationale: Ang שקה ay magbigay ng tubig o magpainom. Sa hayop na kawan, natural sa Tagalog ang “pinainom niya.”
- source_word: צֹאנָם
  choice: ang kanilang kawan
  rationale: Ang צאן ay kolektibong tawag sa maliliit na alagang hayop, karaniwang mga tupa at kambing. Hindi labis na nililimitahan ng “kawan” ang uri ng mga hayop.
theological_decisions:
- issue: Lakas ng kahulugan ng וַיּוֹשִׁעָן
  choice: iniligtas sila
  alternative: tinulungan sila
  rationale: Ang pandiwa ay may mas matibay na diwa ng pagliligtas o pagpapalaya kaysa pangkalahatang pagtulong. Sa konteksto, iniligtas ni Moises ang mga babae mula sa pang-aapi ng mga pastol, nang hindi ipinahihiwatig na tiyak na nanganganib ang kanilang buhay.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang maiikling pandiwang salaysay at iniwasan ang mga salitang makaluma o denominasyonal. Inilagay ang talababa sa “iniligtas sila,” ang pariralang aktuwal na tinutukoy ng leksikal na alternatibo.
