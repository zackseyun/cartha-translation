base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: tl
  text: At sinabi niya sa kanyang mga anak na babae, “Kung gayon, nasaan siya? Bakit ninyo iniwan ang lalaki? Tawagin ninyo siya upang makakain siya ng tinapay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Kung gayon, nasaan siya?
  rationale: Ang וְ ay nag-uugnay sa naunang salaysay, at ang אַיּוֹ ay tuwirang tanong na “nasaan siya?”; ipinahahayag ng “kung gayon” ang likas na pagpapatuloy at pagtataka sa konteksto.
- source_word: לָמָּה זֶּה
  choice: Bakit
  rationale: Isang idiomatikong tanong ito tungkol sa dahilan ng ginawa nila. Ang payak na “Bakit” ay natural sa modernong Tagalog at hindi nagdaragdag ng paliwanag.
- source_word: עֲזַבְתֶּן אֶת־הָאִישׁ
  choice: ninyo iniwan ang lalaking iyon
  rationale: Ang pandiwa ay pambabaeng maramihan at tumutukoy sa mga anak na babae; ang הָאִישׁ ay ang lalaking kababanggit lamang, kaya natural ang “lalaking iyon.”
- source_word: קִרְאֶן לוֹ
  choice: Tawagin ninyo siya
  rationale: Ang pautos ay pambabaeng maramihan. Sa kontekstong ito, ang pagtawag ay pag-anyaya o pagpapapunta sa lalaki, na malinaw na naihahatid ng karaniwang parirala.
- source_word: וְיֹאכַל לָחֶם
  choice: upang makakain siya
  rationale: Ang literal na “kumain ng tinapay” ay karaniwang Hebreong pahayag para sa pagkain ng isang salu-salo o pagkain sa pangkalahatan. Ang “makakain” ay natural at pinananatili ang layuning ipinahihiwatig ng anyong pandiwa.
