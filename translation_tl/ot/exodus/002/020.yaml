  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Pinanatili ang maigsi at tuwirang tono ng pagsaway at pag-anyaya; walang denominasyonal o teolohikal na pagpapakahulugang idinagdag.
