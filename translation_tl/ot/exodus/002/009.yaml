  - severity: low
    issue: Bahagyang hindi malinaw ang “pinasuso niya ito.”
    rationale: Sa ilang gamit, ang porma ay maaaring mangahulugang ipinagawa ang pagpapasuso sa iba. Ang pagbanggit muli sa “bata” ay bahagyang nagpapalinaw nang hindi binabago ang diwa.
