translation:
  language: tl
  text: Sinabi ng anak na babae ng Paraon sa kanya, “Dalhin mo ang batang ito at pasusuhin mo siya para sa akin, at ibibigay ko sa iyo ang sahod mo.” Kaya kinuha ng babae ang bata at pinasuso niya ang bata.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: anak na babae ng Paraon
  rationale: Likas at malinaw na salin ng construct chain na tumutukoy sa nagsasalita.
- source_word: הֵילִיכִי
  choice: Dalhin mo
  rationale: Ang Hiphil imperative ng הלך ay idyomatikong nag-uutos na dalhin ang bata; mas angkop dito ang “Dalhin mo” kaysa simpleng “Pumunta ka.”
- source_word: הַיֶּלֶד הַזֶּה
  choice: ang batang ito
  rationale: Pinananatili ang pangkalahatang kahulugan ng יֶלֶד nang hindi labis na tinutukoy ang edad.
- source_word: וְהֵינִקִהוּ לִי
  choice: at pasusuhin mo siya para sa akin
  rationale: Tiyak na tumutukoy ang pandiwa sa pagpapasuso sa sanggol, at pinananatili ng “para sa akin” ang diwa ng לִי bilang gawaing isasagawa para sa anak ng Paraon.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: at babayaran kita
  rationale: Natural na modernong Tagalog para sa pagbibigay ng kabayaran o sahod sa gawaing ipinagagawa.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Hindi ginawang “ina” dahil “ang babae” lamang ang tahasang tawag ng tekstong Hebreo sa talatang ito.
- source_word: וַתְּנִיקֵהוּ
  choice: at pinasuso niya ito
  rationale: Inilalarawan ng causative form ang pagpapasuso; sa Tagalog, ang “pinasuso” ay natural na maaaring tumukoy sa mismong ginawa ng babaeng nagpapasuso.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Paraon” ayon sa karaniwang anyong biblikal, at pinanatili ang “ang babae” upang hindi magdagdag ng pagkakakilanlang hindi tahasang inuulit sa Hebreo.
