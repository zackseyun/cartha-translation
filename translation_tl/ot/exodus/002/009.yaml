revisions:
- from: Sinabi sa kanya ng anak na babae ng Paraon, “Dalhin mo ang batang ito at pasusuhin mo siya para sa akin, at babayaran kita.” Kaya kinuha ng babae ang bata at pinasuso niya ito.
  to: Sinabi ng anak na babae ng Paraon sa kanya, “Dalhin mo ang batang ito at pasusuhin mo siya para sa akin, at ibibigay ko sa iyo ang sahod mo.” Kaya kinuha ng babae ang bata at pinasuso niya ang bata.
  rationale: Inayos ang ayos ng unang pangungusap para sa mas likas na Tagalog at pinalitan ang pangkalahatang “babayaran kita” ng tahasang pangakong ibigay ang sahod ng babae, alinsunod sa Hebreo. Pinanatili ang “ang babae,” hindi “ang ina,” at ang pagpapasuso bilang gawaing para sa anak na babae ng Paraon.
