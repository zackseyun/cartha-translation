  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: tl
  text: Pumayag si Moises na manirahan kasama ng lalaki[a], at ibinigay ng lalaki kay Moises ang anak niyang babae na si Zipora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Naging handa si Moises na manirahan kasama ng lalaki.” Maaaring magpahayag ang pandiwang Hebreo ng pagiging handa, pagpayag, o pagkakontento.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, ibinigay niya si Zipora kay Moises upang maging asawa ni Moises.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: Pumayag
  rationale: Ipinahahayag ng pandiwang יאל ang pagpayag o pagiging handa. Likas sa modernong Tagalog ang “pumayag” sa pagkakaugnay nito sa pawatas na “manirahan,” habang pinananatili sa talababa ang posibleng diwang “naging handa.”
- source_word: לָשֶׁבֶת
  choice: na manirahan
  rationale: Bagaman maaaring mangahulugang “umupo” ang ישב, tumutukoy ito rito sa paninirahan o pagtira. Ang “manirahan” ay malinaw at angkop sa kasalukuyang Tagalog.
- source_word: הָאִישׁ
  choice: ng lalaki
  rationale: Karaniwang pangngalang “ang lalaki” ang nasa Hebreo. Hindi ito pinalitan ng pangalang Reuel o Jetro sapagkat walang pantanging pangalan sa talata.
- source_word: וַיִּתֵּן
  choice: ibinigay
  rationale: Tuwirang kahulugan ng נתן ang “ibinigay.” Hindi idinagdag sa pangunahing teksto ang “bilang asawa” upang mapanatili ang payak na pagkakasabi ng Hebreo.
- source_word: צִפֹּרָה
  choice: Zipora
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalang צִפֹּרָה bilang “Zipora.”
- source_word: בִתּוֹ
  choice: ang anak niyang
  rationale: Malinaw na anak na babae ang tinutukoy ayon sa konteksto at sa pangalan, ngunit ang likas na pariralang Filipino na “ang anak niyang si Zipora” ay sapat at hindi mabigat.
- source_word: לְמֹשֶׁה
  choice: kay Moises
  rationale: Tinutukoy ng ל ang tumanggap. Ang “kay Moises” ang tuwiran at likas na katumbas nang hindi ipinapasok sa pangunahing teksto ang ipinahihiwatig na pag-aasawa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “manirahan kasama” sa halip na mas makalumang “tumahan sa piling,” at pinanatili ang payak na “ibinigay” ng Hebreo habang ipinaliliwanag sa talababa ang konteksto ng pag-aasawa.
