  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: tl
  text: Nang lumaki na ang bata, dinala siya ng kanyang ina sa anak na babae ng Paraon, at naging anak siya ng anak na babae ng Paraon.[a] Tinawag niya siyang Moises,[b] sapagkat sinabi niya, “Iniahon ko siya mula sa tubig.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naging anak siya sa kanya” o “itinuring niya siyang parang anak.”
    reason: lexical_alternative
  - marker: b
    text: Ang pangalang Moises ay katunog ng pananalitang Hebreo na nangangahulugang “iniahon ko siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: lumaki
  rationale: Tumutukoy dito ang גדל sa paglaki o paggulang ng bata, hindi sa pagiging dakila sa katayuan.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Saklaw ng יֶלֶד ang ‘bata’ o ‘batang lalaki’; pinananatili ng ‘bata’ ang malawak na diwa at ang ugnay sa naunang salaysay tungkol sa sanggol.
- source_word: וַתְּבִאֵהוּ
  choice: dinala siya
  rationale: Karaniwang kahulugan ng hiphil ng בוא ang ‘dalhin.’ Ang babaeng tinutukoy ay ang ina ng bata mula sa naunang konteksto.
- source_word: לְבַת פַּרְעֹה
  choice: sa anak na babae ng Paraon
  rationale: Malinaw at marangal na modernong Tagalog ito para sa ugnayang construct sa Hebreo.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: naging anak siya nito
  rationale: Ipinahahayag ng idyoma ang tunay na katayuang anak sa salaysay, ngunit hindi nito tahasang inilalarawan ang anumang pormal na paraang legal.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Pinangalanan siya nitong
  rationale: Likas na salin sa Tagalog ng pormulang Hebreo para sa pagbibigay ng pangalan; nililinaw ng ‘nitong’ na ang anak na babae ng Paraon ang nagpangalan.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakasanayang anyo ng pangalang Moses sa modernong Tagalog.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang paliwanag sa ibinigay na pangalan.
- source_word: מִן הַמַּיִם
  choice: mula sa tubig
  rationale: Tapat ito sa Hebreo at likas sa Tagalog sa konteksto ng pag-ahon sa bata.
- source_word: מְשִׁיתִהוּ
  choice: Iniahon ko siya
  rationale: Ipinahahayag nito nang natural ang paghango o paghila sa isang tao palabas ng tubig, bagaman hindi maililipat nang buo sa Tagalog ang tunog na kaugnay ng pangalang Moises.
theological_decisions:
- issue: Ang uri ng ugnayan ni Moises sa anak na babae ng Paraon sa וַיְהִי לָהּ לְבֵן
  choice: Ipinakikitang naging anak niya si Moises, na nagpapahiwatig ng katayuang anak sa pamamagitan ng pag-ampon.
  alternative: Itinuring lamang siyang parang anak nang walang pormal na pag-ampon.
  rationale: Malakas ang pahayag ng Hebreo tungkol sa ugnayang mag-ina, ngunit hindi nito tinutukoy ang legal na proseso; kaya pinanatili ang ‘naging anak’ at iniwasang magdagdag ng institusyonal na detalye.
translation_notes:
  register: Gumamit ng natural, kasalukuyan, at marangal na Tagalog. Inulit o nilinaw ang mga tinutukoy ng panghalip kung kailangan upang maiwasan ang kalituhan sa magkakasunod na babaeng tauhan, habang pinanatili ang maikli at salaysay na daloy ng Hebreo.
