source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: tl
  text: Nang mabalitaan ng Paraon ang pangyayaring ito[a], tinangka niyang patayin si Moises. Ngunit tumakas si Moises mula sa Paraon at nanirahan sa lupain ng Midian.[b] Umupo siya sa tabi ng balon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang bagay na ito” o “ang usaping ito.”
    reason: lexical_alternative
  - marker: b
    text: 'Iisang pandiwang Hebreo ang ginamit sa “nanirahan” at “umupo”: una para sa pagtira ni Moises sa Midian, at ikalawa para sa pag-upo niya sa tabi ng balon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mabalitaan
  rationale: Bagaman pangunahing kahulugan ng שׁמע ang “marinig,” sa konteksto ay nalaman ng Paraon ang iniulat na pangyayari. Likas sa modernong Tagalog ang “mabalitaan” at pinananatili nito ang ideya ng pagkarinig ng ulat.
- source_word: הַדָּבָר הַזֶּה
  choice: ang pangyayaring ito
  rationale: Ang דָּבָר ay maaaring “bagay,” “usapin,” o “pangyayari.” Dito, tumutukoy ito sa pagpatay ni Moises sa Egipcio; ang “pangyayaring ito” ay malinaw ngunit hindi labis na nagpapaliwanag.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: tinangka niyang patayin
  rationale: Ang בקש na sinusundan ng pawatas ay nagpapahayag ng paghahangad o pagsisikap na gawin ang isang bagay. Ang “tinangka” ay natural at saklaw ang aktibong pagtatangka, nang hindi sinasabing nagtagumpay ito.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: tumakas ... mula sa
  rationale: Natural na katumbas sa Tagalog ng pagtakas mula sa harapan o kapangyarihan ng isang tao.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: nanirahan sa lupain ng Midian
  rationale: Sa unang gamit, ang ישׁב ay tumutukoy sa pananatili o pagtira sa isang lugar. Hindi kinakailangang ipahiwatig ng “nanirahan” ang ganap na permanenteng paninirahan.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: Umupo siya sa tabi ng balon
  rationale: Sa ikalawang gamit, kongkreto ang kahulugang “umupo.” Ang עַל sa kontekstong ito ay natural na “sa tabi ng,” hindi literal na “sa ibabaw ng.”
- source_word: הַבְּאֵר
  choice: ang balon
  rationale: Pinananatili ang tiyak na pantukoy ng Hebreo sa pamamagitan ng “ang.”
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Tagalog ng titulong Ehipsiyo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyong Tagalog ng pangalan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “mabalitaan” bilang likas na salin sa konteksto, habang inilagay sa talababa ang mga mas literal na alternatibo. Ang pag-uulit ng pandiwang Hebreo na ישׁב ay ipinaliwanag sa talababa dahil hindi ito natural na mapananatili sa Tagalog nang hindi nagiging malabo.
