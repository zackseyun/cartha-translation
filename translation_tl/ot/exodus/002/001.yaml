  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: tl
  text: Isang lalaki mula sa sambahayan ni Levi ang humayo at kumuha ng isang anak na babae ni Levi bilang asawa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang babaeng Levita.” Sa Hebreo, literal na “isang anak na babae ni Levi,” na nangangahulugang isang babaeng inapo ni Levi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: humayo
  rationale: Pinananatili ang karaniwang kahulugang ‘pumunta/humayo’ at ang pagkakasunod ng mga kilos sa Hebreo, nang hindi dinaragdagan ng panandang panahong wala sa teksto.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tumutukoy ito sa isang lalaking hindi pa pinapangalanan; hindi muna ipinapasok ang kahulugang ‘asawa.’
- source_word: מִבֵּית לֵוִי
  choice: mula sa sambahayan ni Levi
  rationale: Ang בֵּית ay may diwang sambahayan o angkan. Ang ‘sambahayan ni Levi’ ay natural sa Tagalog at nagpapanatili ng genealogical na pahayag nang hindi ito pinalalawak agad sa buong tribo.
- source_word: וַיִּקַּח
  choice: kumuha bilang asawa
  rationale: Pinananatili ang leksikal na diwang ‘kumuha’ habang nililinaw ang idyomatikong kahulugang pag-aasawa sa kontekstong ito.
- source_word: אֶת
  choice: '[pananda ng tuwirang layon, hindi isinalin]'
  rationale: Panandang panggramatika ito sa Hebreo at walang hiwalay na katumbas na salita sa Tagalog.
- source_word: בַּת לֵוִי
  choice: isang anak na babae ni Levi
  rationale: Pinananatili ang literal at genealogical na anyong ‘anak na babae ni Levi,’ na nangangahulugang babaeng inapo ni Levi; inilalagay sa talababa ang mas natural na alternatibo.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang ‘humayo’ upang mapanatili ang kilos ng Hebreo, at ang ‘sambahayan’ upang ihatid ang angkan o linya ng lahi. Nilinaw ang idyomang pangkasal nang hindi inaalis ang salitang ‘kumuha.’
