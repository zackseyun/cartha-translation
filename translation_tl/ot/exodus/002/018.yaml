  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “napakabilis ninyong nakabalik” bilang natural na pagpapahayag ng Hebreong konstruksiyong literal na “nagmadaling pumarito,” habang inilalahad sa talababa ang mas pormal na anyo.
