  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: tl
  text: Nang dumating sila kay Reuel, na kanilang ama, sinabi niya, “Bakit napakabilis ninyong nakabalik[a] ngayon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, mas literal: “Bakit kayo nagmadaling dumating ngayon?” Magkasamang ginagamit sa Hebreo ang pandiwang “magmadali” at “dumating.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Nang dumating sila
  rationale: Ang pandiwa ay nasa ikatlong panauhang pambabae na maramihan at tumutukoy sa mga anak na babae. Ginamit ang “Nang” upang natural na iugnay sa Tagalog ang pagdating nila at ang sumunod na pagsasalita ni Reuel.
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay nagpapahayag ng patutunguhan; “kay” ang likas na anyo bago ang pangalan ng tao sa Tagalog.
- source_word: רְעוּאֵל
  choice: Reuel
  rationale: Tuwirang transliterasyon ng Hebreong pangalan, na pinananatili ang anyong mas malapit sa tekstong Hebreo.
- source_word: אֲבִיהֶן
  choice: na kanilang ama
  rationale: Ang literal na kahulugan ay “kanilang ama.” Ang pang-ugnay na “na” ay nagbibigay ng natural at malinaw na appositive na parirala sa Tagalog.
- source_word: וַיֹּאמֶר
  choice: sinabi nito
  rationale: Karaniwang pandiwang pasalaysay para sa pagsisimula ng tuwirang pananalita. Ang “nito” ay malinaw na tumutukoy kay Reuel at umiiwas sa di-likas na paulit-ulit na pangalan.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Tuwirang katumbas ng pang-abay na patanong na humihingi ng dahilan.
- source_word: מִהַרְתֶּן
  choice: napakabilis ninyong
  rationale: Ang Piel perfect na pambabaeng maramihan ng מהר ay nagpapahayag ng pagmamadali o mabilis na pagkilos. Ang “napakabilis ninyong” ay natural sa tanong at pinananatili ang diin sa di-karaniwang bilis.
- source_word: בֹּא
  choice: nakabalik
  rationale: Bagaman pangunahing nangangahulugang “dumating/pumarito,” ipinahihiwatig ng tagpo na umuwi ang mga anak mula sa balon. Ang “nakabalik” ay malinaw at natural sa Tagalog nang hindi binabago ang kilos.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Ang literal na “ang araw” ay idyomatikong tumutukoy sa kasalukuyang araw; sa pangungusap na ito, natural na katumbas ang “ngayon.”
