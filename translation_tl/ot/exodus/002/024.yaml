  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת נַאֲקָתָ֑/ם וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם אֶת יִצְחָ֥ק וְ/אֶֽת יַעֲקֹֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: tl
  text: Narinig ng Diyos ang kanilang pagdaing[a], at inalala[b] ng Diyos ang kanyang tipan kina Abraham, Isaac, at Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kanilang daing.” Ang pangngalang Hebreo ay maaaring tumukoy sa daing o sigaw dahil sa pang-aapi.
    reason: lexical_alternative
  - marker: b
    text: Ang “inalala” ay pananalitang ginagamit kaugnay ng tipan. Hindi nito ipinahihiwatig na nakalimot ang Diyos, kundi na kikilos siya nang tapat sa kanyang tipan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Narinig
  rationale: Ang pandiwang שׁמע sa anyong pasalaysay dito ay likas na nangangahulugang “narinig.” Nakatuon ang talata sa pagtanggap ng Diyos sa daing ng Israel, hindi sa isang matagal na pakikinig.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, isahan ang kaugnay na mga pandiwa at tumutukoy ito sa iisang Diyos.
- source_word: נַאֲקָתָם
  choice: kanilang pagdaing
  rationale: Ang נַאֲקָה ay daing o masidhing sigaw bunga ng pang-aapi. Ang “pagdaing” ay natural sa makabagong Tagalog at naipahihiwatig ang patuloy at sama-samang paghihirap.
- source_word: וַיִּזְכֹּר
  choice: inalala
  rationale: Pinananatili nito ang payak na diwa ng זכר na “alalahanin.” Hindi isinasama sa pangunahing teksto ang ipinahihiwatig na pagkilos upang mapanatili ang tensiyong nasa Hebreo.
- source_word: בְּרִיתוֹ
  choice: ang kanyang tipan
  rationale: Ang “tipan” ang malinaw at kinikilalang salin ng בְּרִית, at ipinahahayag ng hulapi na ito ay tipan ng Diyos.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: kina Abraham, Isaac, at Jacob
  rationale: Sa natural na Tagalog, ipinakikita ng “kina” na ang tipan ay kaugnay ng tatlong patriyarka. Hindi na kailangang ulitin ang pang-ukol sa bawat pangalan gaya sa Hebreo.
theological_decisions:
- issue: Antropomorpikong pananalitang “inalala ng Diyos”
  choice: Panatilihin ang “inalala” sa pangunahing teksto at ipaliwanag sa talababa ang gamit nito sa konteksto ng tipan.
  alternative: “kumilos ang Diyos ayon sa kanyang tipan” o “muling itinuon ng Diyos ang pansin sa kanyang tipan”
  rationale: Ang Hebreo ay gumagamit ng karaniwang pananalita tungkol sa pag-alaala ng Diyos. Ang pagpapalit nito ng tahasang “kumilos” ay magpapakahulugan sa halip na magsalin at aalisin ang tunay na teolohikal na tensiyon. Sa konteksto ng tipan, hindi nito ipinahihiwatig na nakalimot ang Diyos.
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “pagdaing” para sa karaniwang pagkaunawa at “tipan” upang mapanatili ang mahalagang bokabularyong teolohikal. Inilagay ang talababa [b] sa hulihan ng pangungusap sapagkat ipinapaliwanag nito ang “inalala” sa buong pahayag tungkol sa tipan.
