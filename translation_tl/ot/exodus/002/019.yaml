  terminology: Ang “lalaking Ehipsiyo,” “nagligtas,” “mga pastol,” at “kawan” ay angkop. Ang literal na “mula sa kamay ng mga pastol” ay katanggap-tanggap, at maipapaliwanag sa talababa bilang idyoma ng kapangyarihan.
