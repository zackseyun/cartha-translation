base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: tl
  text: Sinabi nila, “Isang lalaking Ehipsiyo ang nagligtas sa amin mula sa kamay ng mga pastol[a]. Nag-igib pa siya[b] ng tubig para sa amin at pinainom ang kawan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mula sa kamay ng mga pastol” ay nangangahulugang “mula sa kapangyarihan ng mga pastol.”
    reason: lexical_alternative
  - marker: b
    text: 'Binibigyang-diin ng Hebreo ang pandiwa: literal, “nag-igib nga siya para sa amin,” na nagpapahiwatig na siya mismo ang umigib ng tubig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Sinabi nila
  rationale: Ang wayyiqtol na pangatlong panauhang pambabae maramihan ay nagpapakilala sa sagot ng mga anak na babae; hindi na kailangang isalin ang pang-ugnay upang maging natural sa Tagalog.
- source_word: אִישׁ מִצְרִי
  choice: Isang lalaking Ehipsiyo
  rationale: Pinananatili ang parehong אִישׁ, ‘lalaki,’ at מִצְרִי, ‘Ehipsiyo,’ sa natural na ayos ng modernong Tagalog.
- source_word: הִצִּילָנוּ
  choice: nagligtas sa amin
  rationale: Ang Hiphil ng נצל ay tumutukoy sa aktuwal na pagsagip mula sa panganib o pang-aapi; malinaw at karaniwan ang ‘nagligtas’ sa kontekstong ito.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili ang konkretong larawang Hebreo ng ‘kamay,’ na sa idyoma ay nangangahulugang kapangyarihan o kontrol.
- source_word: הָרֹעִים
  choice: mga pastol
  rationale: Ang anyong mula sa רעה ay tumutukoy sa mga lalaking nag-aalaga ng kawan; ‘mga pastol’ ang tuwiran at natural na katumbas.
- source_word: וְגַם
  choice: pa
  rationale: Ipinahihiwatig ng ‘pa’ na higit pa sa pagsagip ang ginawa ng lalaki, na siyang diin ng וְגַם.
- source_word: דָּלֹה דָלָה
  choice: Iginibá
  rationale: Ang infinitive absolute kasunod ng finite verb ay nagbibigay-diin sa aktuwal at personal niyang pag-igib; natural na ipinapahayag sa Tagalog sa pandiwang ‘iginibá’ kasama ng ‘pa.’
- source_word: לָנוּ
  choice: kami
  rationale: Isinasama sa pokus-benepaktibo ng ‘iginibá kami ng tubig’ ang diwang ginawa niya iyon para sa kanila.
- source_word: וַיַּשְׁקְ
  choice: pinainom
  rationale: Ang Hiphil ng שקה ay ‘painumin’ o ‘bigyan ng maiinom’; ang ‘pinainom’ ay angkop at natural para sa kawan.
- source_word: אֶת־הַצֹּאן
  choice: ang kawan
  rationale: Ang צאן ay kolektibong tawag sa maliliit na alagang hayop, karaniwang mga tupa at kambing; hindi labis na tinutukoy ng ‘kawan’ ang uri.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘iginibá’ na may tuldik upang linawin ang bigkas at maibukod sa ‘iginiba.’ Inilipat ang mga marker sa mga bahaging aktuwal na ipinapaliwanag ng bawat talababa: [a] sa idyomang ‘kamay,’ at [b] sa diin ng pag-igib.'
