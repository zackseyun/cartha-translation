translation:
  language: tl
  text: Pagkatapos, sinabi ng kapatid ng sanggol sa anak na babae ni Paraon, “Pupunta po ba ako at tatawag para sa inyo ng isang babaeng nagpapasuso mula sa mga babaeng Hebreo, upang pasusuhin niya ang sanggol para sa inyo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapasulong sa salaysay; natural sa makabagong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: אֲחֹתוֹ
  choice: kapatid ng sanggol
  rationale: Ang hulaping panlalaki ay tumutukoy sa sanggol. Nilinaw ito sa Tagalog upang maiwasan ang malabong “kapatid niya,” nang hindi ipinapangalan si Moises na hindi naman binanggit sa talata.
- source_word: בַּת פַּרְעֹה
  choice: anak na babae ng Paraon
  rationale: Tuwirang inililipat ang construct chain at malinaw na pinananatili ang kasarian ng anak.
- source_word: הַאֵלֵךְ
  choice: Pupunta po ba ako
  rationale: Ang interrogative na may first-person imperfect ay isang magalang na alok o pakiusap. Ipinahahayag ng “po ba” ang angkop na paggalang sa natural na Tagalog.
- source_word: וְקָרָאתִי
  choice: at tatawag
  rationale: Ang קרא ay nangangahulugang tumawag o magpatawag dito; ang “tatawag” ay malawak at hindi nagdaragdag ng ideya ng pisikal na pagsundo.
- source_word: אִשָּׁה מֵינֶקֶת מִן הָעִבְרִיֹּת
  choice: isang babaeng Hebreo na nagpapasuso
  rationale: Ipinapakita nito na ang babae ay kabilang sa mga Hebreo at may kakayahang magpasuso, habang nananatiling natural at malinaw sa modernong Tagalog.
- source_word: וְתֵינִק
  choice: upang pasusuhin niya
  rationale: Ang Hiphil ng ינק ay “magpasuso” o “magpadede.” Ang “upang” ay natural na naghahayag ng layunin ng iminungkahing pagtawag.
- source_word: הַיָּלֶד
  choice: ang sanggol
  rationale: Bagaman ang יֶלֶד ay maaaring “bata,” malinaw sa agarang konteksto na bagong-silang o napakaliit pa ang tinutukoy; “sanggol” ang natural na katawagan sa Tagalog sa kontekstong pagpapasuso.
theological_decisions: []
translation_notes:
  register: Makabago, magalang, at marangal na Filipino Tagalog. Ginamit ang “po” bilang natural na panandang-galang ng batang nagsasalita sa anak ng Paraon. Iniwasan ang teknikal o lipas na katawagang maaaring pumalit sa malinaw na pariralang “babaeng Hebreo na nagpapasuso.”
