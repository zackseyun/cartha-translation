    rationale: Ang “isang babaeng Hebreo” ay maaaring tama sa kahulugan, ngunit hindi nito kasinglinaw na ipinapakita ang מִן bilang pagpili mula sa pangkat ng mga babaeng Hebreo.
  - severity: low
    issue: Di-gaanong likas ang “anak na babae ng Paraon.”
    rationale: Sa modernong Filipino Tagalog, karaniwan at mas natural ang possessive na “anak na babae ni Paraon.”
