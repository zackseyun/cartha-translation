base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: tl
  text: Ngunit nang hindi na niya maitago ang bata, kumuha siya ng isang basket na yari sa papiro[a] para sa bata at pinahiran niya ito ng aspalto at alkitran. Pagkatapos, inilagay niya rito ang bata at inilagay ito sa gitna ng mga tambo sa pampang ng Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “arkang yari sa papiro.” Ang salitang Hebreo na tebah ay siya ring salitang ginamit para sa arka ni Noe sa Genesis, kaya pinananatili nito ang alingawngaw ng pagliligtas sa pamamagitan ng tubig.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: maitago ang bata
  rationale: Ang Hiphil infinitive ng צפן na may panlalaking panghalip ay nangangahulugang ‘itago siya.’ Inulit ang ‘bata’ sa halip na gumamit ng panghalip upang maging malinaw at natural sa Tagalog.
- source_word: תֵּבַת גֹּמֶא
  choice: basket na yari sa papiro
  rationale: Ang תֵּבָה ay sisidlan o munting sasakyang lumulutang, at ang גֹּמֶא ay papiro. Ang ‘basket na yari sa papiro’ ay angkop sa agarang konteksto at madaling maunawaan; pinananatili sa talababa ang mahalagang ugnayang pampanitikan sa arka ni Noe.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: pinahiran iyon ng aspalto
  rationale: Ang pandiwa ay tumutukoy sa pagpapahid o pagpapalibot ng panangga, at ang חֵמָר ay bitumen o natural na aspalto. Ang ‘aspalto’ ay mas karaniwang nauunawaan kaysa ‘bitumen’ sa modernong Filipino.
- source_word: וּבַזָּפֶת
  choice: at alkitran
  rationale: Ang זֶפֶת ay pitch o malagkit na materyal na panangga sa tubig. Ang ‘alkitran’ ay natural at pamilyar na katumbas sa Filipino, habang pinananatili ang pagkakaiba nito sa aspalto.
- source_word: הַיֶּלֶד
  choice: ang bata
  rationale: Ang יֶלֶד ay ‘bata’ o ‘batang lalaki.’ Hindi tahasang inuulit ng salita ang kasarian o eksaktong edad, kaya ang ‘bata’ ang tapat at natural na salin.
- source_word: בַּסּוּף
  choice: sa mga tambo
  rationale: Ang סוּף ay mga halamang-tubig gaya ng tambo o rushes. Ang pariralang ‘ipinasok iyon sa mga tambo’ ay nagpapahayag ng paglalagay sa loob o gitna ng mga halaman nang hindi dinaragdagan ang detalye.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: sa pampang ng Nilo
  rationale: Sa kontekstong Ehipsiyo, ang יְאֹר ay tumutukoy sa Nilo; ang שָׂפָה ay gilid o pampang. Ang salin ay tiyak at likas sa Filipino.
- source_word: לֹא יָכְלָה עוֹד
  choice: hindi na niya maitago
  rationale: Ipinahihiwatig ng parirala ang pag-abot sa hangganan ng kakayahang magpatuloy. Ang ‘hindi na niya maitago’ ay maikli at natural.
- source_word: לּוֹ
  choice: para rito
  rationale: Pinananatili ang datibong kahulugan na ang sisidlan ay kinuha o inihanda para sa bata. Ginamit ang ‘rito’ upang maiwasan ang kalituhan sa kasarian at maging natural sa kasunod na pangngalan.
theological_decisions:
- issue: Ugnayang pampanitikan ng תֵּבָה sa salaysay ni Noe
  choice: Isinalin sa pangunahing teksto bilang ‘basket’ at ipinaliwanag sa talababa ang posibleng ‘arka.’
  alternative: Isalin bilang ‘arka na yari sa papiro.’
  rationale: Mas malinaw sa karaniwang mambabasa ang anyo at sukat ng sisidlan sa ‘basket,’ ngunit mahalagang huwag mawala ang sinadyang leksikal na alingawngaw ng pagliligtas sa tubig sapagkat iisang pambihirang salitang Hebreo ang ginamit dito at sa Genesis.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang ‘papiro,’ ‘aspalto,’ ‘alkitran,’ at ‘Nilo’ para sa katumpakang pangkasaysayan at leksikal; iniwasan ang labis na tradisyonal o teknikal na pananalita.
