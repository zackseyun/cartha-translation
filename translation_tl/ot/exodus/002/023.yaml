  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: tl
  text: Nangyari noong mahabang panahong iyon na namatay ang hari ng Ehipto.[a] Dumaing ang mga anak ni Israel[b] dahil sa pagkaalipin at humiyaw, at ang daing nila para sa saklolo ay umakyat sa Diyos dahil sa pagkaalipin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Sa loob ng mahabang panahong iyon,” o, nang mas malaya, “Pagkaraan ng mahabang panahon.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Israel”; sama-sama itong tumutukoy sa bayan ng Israel.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “dahil sa sapilitang paggawa” o “dahil sa mabigat na paglilingkod.” Ang salitang Hebreo ay tumutukoy rito sa mapaniil na sapilitang paggawa sa kalagayan ng pagkaalipin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Nangyari
  rationale: Karaniwang panimulang salaysay na naghahayag ng bagong pangyayari; natural sa makabagong Tagalog at hindi nagdaragdag ng tahasang salitang katumbas ng “ngayon.”
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: noong mahabang panahong iyon
  rationale: Ipinahahayag ang pinalawig na yugto ng panahon. Mas natural ito sa Tagalog kaysa sa literal na “sa maraming araw na iyon,” habang hindi tiyak na ipinapakahulugang pagkatapos lamang ng panahong iyon.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: namatay ang hari ng Ehipto
  rationale: Tuwirang pinananatili ang pangyayari at ang tinutukoy sa natural na ayos ng Tagalog.
- source_word: וַיֵּאָנְחוּ
  choice: Dumaing
  rationale: Ipinahahayag ang naririnig na pagdurusa at paghihinagpis sa ilalim ng pang-aapi.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang anyo ng Hebreong katawagan, ngunit sa konteksto ay sama-samang tumutukoy sa bayan ni Israel.
- source_word: מִן הָעֲבֹדָה
  choice: dahil sa pagkaalipin
  rationale: Sa konteksto, ang עֲבֹדָה ay sapilitang paggawa sa ilalim ng mapaniil na pagkaalipin; hindi sapat ang neutral na “paggawa.”
- source_word: וַיִּזְעָקוּ
  choice: humiyaw
  rationale: Malakas na sigaw mula sa matinding paghihirap; iniiwan nitong walang tahasang layon ang pandiwa gaya ng Hebreo.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: ang paghingi nila ng saklolo ay umabot
  rationale: Nililinaw na ang שַׁוְעָה ay paghingi ng tulong. Ang “umabot” ay natural sa Tagalog para sa larawan ng sigaw na umaakyat patungo sa Diyos.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Tuwirang katumbas sa natural na gamit ng Tagalog nang walang dagdag na teolohikal na paglalarawan.
- source_word: מִן הָעֲבֹדָה (ikalawang paglitaw)
  choice: dahil sa pagkaalipin
  rationale: Inuulit ang parehong parirala upang mapanatili ang retorikal na pagdiin at sanhi sa Hebreo.
theological_decisions:
- issue: Pagpapakahulugan sa עֲבֹדָה sa konteksto ng pang-aapi sa Israel
  choice: pagkaalipin
  alternative: paggawa; sapilitang paggawa; paglilingkod
  rationale: Ipinakikita ng konteksto na hindi ito neutral na trabaho kundi mapaniil at sapilitang paggawa sa kalagayan ng pagkaalipin. Hindi ito pagdaragdag ng doktrina kundi kontekstuwal na pagpapakahulugan.
- issue: Paglilipat ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; bayan ng Israel
  rationale: Pinananatili ang pormal na larawan ng Hebreo, kasabay ng talababa na nililinaw na sama-sama nitong tinutukoy ang buong bayan at hindi lamang ang mga lalaking anak.
- issue: Ugnayan ng sigaw at Diyos
  choice: umabot sa Diyos
  alternative: pumailanlang sa Diyos; umakyat sa Diyos
  rationale: Pinananatili ang direksiyon ng metapora nang hindi tahasang sinasabing ang unang sigaw ay nakatuon na sa Diyos; ang Hebreo ay nagsasabing ang kanilang paghingi ng saklolo ay umakyat sa Diyos.
translation_notes:
  register: Makabago, dignified, at madaling maunawaang Filipino. Ginamit ang “Ehipto,” “pagkaalipin,” at “saklolo” bilang pormal ngunit karaniwang bokabularyo. Hinati sa dalawang pangungusap upang maging natural ang daloy sa Tagalog nang hindi binabago ang pagkakasunod-sunod ng salaysay. Ang mga panandang talababa [a], [b], at [c] ay lahat nasa pangunahing teksto.
