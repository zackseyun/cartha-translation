  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: tl
  text: At tumayo sa malayo[a] ang kapatid niyang babae upang malaman kung ano ang gagawin sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa malayo” o “sa malayong lugar.”
    reason: lexical_alternative
  - marker: b
    text: 'O “upang malaman kung ano ang mangyayari sa kanya.” Mas literal sa Hebreo: “upang malaman kung ano ang gagawin sa kanya.” Maaari ring unawain ang huling parirala bilang “para sa kanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: tumayo
  rationale: Ang Hitpael na anyo ng יצב ay nagpapahiwatig ng pagpuwesto o pananatiling nakatayo. Natural sa makabagong Tagalog ang “tumayo” at sapat nitong naihahatid ang diwa nang hindi labis na ipinapaliwanag ang reflexive na anyo.
- source_word: אֲחֹתוֹ
  choice: ang kapatid niyang babae
  rationale: Tuwirang katumbas ito ng pangngalang may hulaping ikatlong panauhang panlalaki. Nililinaw ng “babae” ang kasariang tahasang nasa Hebreo.
- source_word: מֵרָחֹק
  choice: sa di-kalayuan
  rationale: Tumutukoy ang parirala sa pagkakaroon ng pagitan sa lugar. Ang “sa di-kalayuan” ay natural at marangal na Tagalog; hindi nito sapilitang tinutukoy kung gaano kalaki ang pagitan.
- source_word: לְדֵעָה
  choice: upang malaman
  rationale: Ang infinitive ng ידע na may לְ ay nagsasaad ng layunin. Ang “upang malaman” ay malapit sa pormal na kahulugan at natural sa Tagalog.
- source_word: מַה
  choice: kung ano
  rationale: Sa sugnay na di-tuwirang tanong, natural sa Tagalog ang “kung ano” para sa Hebreong מַה.
- source_word: יֵּעָשֶׂה
  choice: ang gagawin
  rationale: Ang Niphal imperfect ng עשה ay pasibo sa Hebreo. Sa konstruksyong Tagalog na “kung ano ang gagawin sa kanya,” nananatili ang di-tiyak na gumagawa at ang diwa ng magiging kilos, bagaman hindi lantad ang morpolohikal na pasibo.
- source_word: לוֹ
  choice: sa kanya
  rationale: Maaaring ipahiwatig ng לְ sa pasibong konstruksyon ang gagawin “sa” kanya o “para” sa kanya. Mas malamang sa konteksto ang “sa kanya,” ngunit itinatala sa talababa ang tunay na posibilidad ng alternatibo.
theological_decisions:
- issue: Kung ang לוֹ ay tumutukoy sa gagawin “sa” sanggol o “para” sa sanggol
  choice: sa kanya
  alternative: para sa kanya
  rationale: Dahil lantad sa panganib ang sanggol at hindi tiyak ang sasapitin niya, “sa kanya” ang pinakamalamang na kahulugan. Gayunman, hindi ganap na isinasara ng Hebreo ang kapaki-pakinabang na diwang “para sa kanya,” kaya pinananatili ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kapatid niyang babae” upang mapanatili ang tahasang kasarian sa Hebreo. Ang ayos ng pangungusap ay natural sa salaysay, habang ang mga talababa ay nagpapanatili sa mga leksikal na alternatibo at sa bahagyang kalabuan ng לוֹ.
