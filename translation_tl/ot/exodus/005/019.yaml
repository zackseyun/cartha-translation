  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: tl
  text: Nakita ng mga tagapangasiwang Israelita na nasa kagipitan sila nang sabihin sa kanila, “Huwag ninyong babawasan ang bilang ng inyong mga ladrilyo—ang takdang dami sa bawat araw.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Nakita
  rationale: Pinananatili ang karaniwang kahulugan ng ראה, ngunit sa konteksto ay likas ding nagpapahiwatig na napagtanto nila ang kanilang kalagayan.
- source_word: שֹׁטְרֵי
  choice: mga tagapangasiwa
  rationale: Tumutukoy sa mga Israelitang nakabababang opisyal na nangangasiwa sa paggawa; mas malinaw ito sa karaniwang mambabasang Filipino kaysa sa pangkalahatang “mga opisyal.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Likas at tumpak na katawagan sa modernong Filipino para sa Hebreong idyomang literal na “mga anak na lalaki ni Israel,” na rito ay tumutukoy sa bayang Israel.
- source_word: אֹתָם בְּרָע
  choice: na nasa kagipitan sila
  rationale: Ang בְּרָע ay nagsasaad ng masamang kalagayan o kapahamakan, hindi ng moral na kasamaan; ang “nasa kagipitan” ay dignificado at angkop sa konteksto.
- source_word: לֵאמֹר
  choice: nang sabihin sa kanila
  rationale: Ipinakikita ng parirala ang pahayag na naghayag sa kanilang mahirap na kalagayan; ang tahasang “sa kanila” ay likas sa Filipino at malinaw sa konteksto.
- source_word: לֹא תִגְרְעוּ
  choice: Huwag ninyong babawasan
  rationale: Tuwirang ipinahahayag ang pagbabawal at ang kahulugan ng גרע na bawasan o kulangan.
- source_word: מִלִּבְנֵיכֶם
  choice: ang bilang ng inyong mga ladrilyo
  rationale: Ang לְבֵנִים ay mga ladrilyo; isinama ang “bilang” upang maging malinaw ang daming hindi maaaring bawasan kaugnay ng kasunod na pang-araw-araw na takda.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ang takdang dami sa bawat araw
  rationale: Natural na salin ng Hebreong idyoma para sa itinakdang daming kailangang maibigay araw-araw, nang hindi inuulit nang alanganin ang “araw” sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw, dignificado, at madaling maunawaan. Ginamit ang “mga Israelita” sa halip na literal ngunit di-likas na “mga anak na lalaki ni Israel.” Walang footnote dahil maisasalin nang malinaw sa mismong teksto ang Hebreong idyoma.
