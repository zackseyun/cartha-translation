  text: 'Noong araw na iyon, nag-utos si Faraon sa mga tagapangasiwa ng sapilitang paggawa sa bayan[a] at sa kaniyang mga opisyal[b], na nagsasabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tagapangasiwa” o “mga tagapag-utos ng paggawa.” Ang salitang Hebreo ay tumutukoy sa mga taong nagpapatupad o naniningil ng takdang paggawa.
