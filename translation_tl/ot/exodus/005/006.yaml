lexical_decisions:
- source_word: וַיְצַו
  choice: inutusan
  rationale: Ipinahahayag ang makapangyarihang utos ng Faraon at likas sa makabagong salaysay sa Filipino.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Karaniwang anyo sa Filipino ng titulong maharlika sa Ehipto.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Tuwirang temporal na parirala; pinananatili ang pagtukoy sa mismong araw sa daloy ng salaysay.
- source_word: הַנֹּגְשִׂים
  choice: mga tagapagtrabaho
  rationale: Sa konteksto, tumutukoy sa mga taong sapilitang nagpapatupad o naniningil ng takdang paggawa; ang salin ay malinaw sa karaniwang mambabasa nang hindi gumagamit ng masyadong teknikal na katawagan.
- source_word: בָּעָם
  choice: ng bayan
  rationale: Likas na Filipino para sa kaugnayan ng mga tagapagpatupad sa sambayanang pinagtatrabaho, habang hindi labis na tinutukoy ang eksaktong estruktura ng awtoridad.
- source_word: שֹׁטְרָיו
  choice: kanyang mga opisyal
  rationale: Pinananatili ang malawak na opisyal at administratibong diwa ng termino; hindi ito nililimitahan sa eskriba o kapatas.
- source_word: לֵאמֹר
  choice: Sinabi niya,
  rationale: Likas na panimula sa tuwirang pananalitang sumusunod sa susunod na talata, sa halip na piliting panatilihin ang Hebreong participial formula.
