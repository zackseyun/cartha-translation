  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: tl
  text: Kayo mismo, humayo kayo at kumuha ng dayami para sa inyong mga sarili saanman ninyo ito matagpuan[a], sapagkat walang anumang ibabawas sa trabaho ninyo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “mula saanman ninyo ito matagpuan.”
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal, “sapagkat walang anumang nababawas sa trabaho ninyo.” Maaari ring ipahiwatig ng ugnayan sa konteksto: “ngunit walang anumang ibabawas sa trabaho ninyo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: Kayo mismo
  rationale: Ang hiwalay na panghalip ay nagbibigay-diin sa mga Israelita bilang siyang kailangang kumuha ng dayami.
- source_word: לְכוּ קְחוּ
  choice: humayo kayo at kumuha
  rationale: Pinananatili ang dalawang pautos at ang pagkakasunod ng pagkilos; ang “humayo” ay marangal ngunit malinaw sa makabagong Filipino.
- source_word: לָכֶם
  choice: para sa inyong sarili
  rationale: Ipinahahayag ang diwang sila mismo ang kailangang kumuha ng kanilang gagamiting dayami.
- source_word: תֶּבֶן
  choice: dayami
  rationale: Sa konteksto ng paggawa ng ladrilyo, tumutukoy ito sa dayaming ginagamit sa paggawa nito.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: saanman ninyo ito matagpuan
  rationale: Natural na Filipino ito na pinananatili ang bukas na saklaw ng pinagmumulan; ang mas pormal at literal na anyo ay inilagay sa talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Pinananatili ang karaniwang sanhi o paliwanag na diwa ng pangatnig, bagaman may kontekstuwal na tensiyon o pagsalungat sa matigas na utos.
- source_word: אֵין נִגְרָע ... דָּבָר
  choice: walang anumang ibabawas
  rationale: Malinaw na ipinahahayag ang ganap na kawalan ng pagbawas; ang hinaharap na anyo ay angkop sa ipinapataw na patakaran.
- source_word: מֵעֲבֹדַתְכֶם
  choice: sa trabaho ninyo
  rationale: Ang “trabaho” ay likas at madaling maunawaan para sa ipinataw na gawain, nang hindi nagmumungkahi ng relihiyosong paglilingkod.
