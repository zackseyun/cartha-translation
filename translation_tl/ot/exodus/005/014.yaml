base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: tl
  text: At pinalo ang mga kapatas na Israelita na itinalaga ng mga tagapangasiwa ni Paraon sa sapilitang paggawa upang mamahala sa mga Israelita. Sinabi sa kanila ng mga ito, “Bakit hindi ninyo natapos ang takdang dami ng mga ladrilyong dapat ninyong gawin gaya ng dati[a], kapuwa kahapon at ngayon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “gaya ng kahapon at noong isang araw,” isang idyomang nangangahulugang “gaya ng dati” o “gaya noong una.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: Pinalo
  rationale: Ipinahahayag ng pasibong anyo ng נכה ang pisikal na pagpaparusa; natural sa Tagalog ang aktibong pangungusap na hindi binabanggit ang malinaw na tagaganap mula sa konteksto. Hindi rin nito nililimitahan ang paraan sa paghagupit o paglatigo.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: mga kapatas na Israelita
  rationale: Sa konteksto ng sapilitang paggawa, ang שֹׁטְרִים ay mga nakabababang tagapangasiwang Israelita, kaya mas tiyak at natural ang “mga kapatas” kaysa “mga opisyal.”
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: na itinalaga ng mga tagapagpagawa ng Paraon upang mamahala sa kanila
  rationale: Ang נֹגְשִׂים ay mga tagapangasiwang nagpapatupad ng sapilitang trabaho. Ang “mga tagapagpagawa” ay malinaw at dignidad na katumbas, habang pinananatili ng “itinalaga ... upang mamahala sa kanila” ang ugnayan ng kapangyarihan.
- source_word: לֵאמֹר
  choice: Habang pinapalo, sinabihan sila
  rationale: Inilalahad nito nang natural sa Tagalog ang kasabay na pagpapalo at pagsasalita, at iniiwasang magmukhang ang mga kapatas ang nagsasalita.
- source_word: מַדּוּעַ
  choice: Bakit
  rationale: Ito ang tuwiran at natural na katumbas ng salitang pananong.
- source_word: לֹא כִלִּיתֶם
  choice: hindi ninyo natapos
  rationale: Ang כלה rito ay tumutukoy sa hindi pagkumpleto ng itinakdang gawain; malinaw at karaniwan ang “natapos.”
- source_word: חָקְכֶם
  choice: ang takdang dami
  rationale: Ang חֹק ay itinakda o ipinag-utos na bahagi. Naipapahayag ng “takdang dami” ang ideya ng quota nang hindi gumagamit ng teknikal na hiram na salita.
- source_word: לִלְבֹּן
  choice: ng mga ladrilyong dapat ninyong gawin
  rationale: Ang infinitive ay tumutukoy sa paggawa ng ladrilyo. Ang verbal na pariralang ito ay natural sa Tagalog at malinaw na inuugnay ang takdang dami sa paggawa.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: gaya ng dati
  rationale: Idyoma ito para sa nakaraang nakasanayang kalagayan. Natural ang “gaya ng dati,” habang inilalagay sa talababa ang literal na larawan ng Hebreo.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: kahapon at ngayon
  rationale: Tuwirang pinananatili ang dalawang panahong binibigyang-diin ng magkatambal na גַּם...גַּם; natural sa Tagalog ang payak na “kahapon at ngayon.”
