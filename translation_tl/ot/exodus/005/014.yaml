revisions:
- from: Pinalo ang mga kapatas na Israelita na itinalaga ng mga tagapagpagawa ng Paraon upang mamahala sa kanila. Habang pinapalo, sinabihan sila, “Bakit hindi ninyo natapos ang takdang dami ng mga ladrilyong dapat ninyong gawin gaya ng dati[a], kahapon at ngayon?”
  to: At pinalo ang mga kapatas na Israelita na itinalaga ng mga tagapangasiwa ni Paraon sa sapilitang paggawa upang mamahala sa mga Israelita. Sinabi sa kanila ng mga ito, “Bakit hindi ninyo natapos ang takdang dami ng mga ladrilyong dapat ninyong gawin gaya ng dati[a], kapuwa kahapon at ngayon?”
  rationale: Inalis ang idinagdag na ideya na sabay ang pagpapalo at pagsasalita, at tahasang itinuro ang mga tagapangasiwa ni Paraon bilang nagsalita. Nilinaw ang tungkulin ng נֹגְשִׂים sa konteksto ng sapilitang paggawa at itinuwid ang literal na paliwanag sa talababa. Napanatili ang diwa ng takdang dami, paggawa ng ladrilyo, at ang pagbibigay-diin sa kahapon at ngayon.
