translation_notes:
  register: Makabago at dignidad na Filipino, na gumagamit ng karaniwang bokabularyo. Pinili ang “kapatas” at “tagapagpagawa” upang luminaw ang dalawang antas ng pamamahala sa sapilitang paggawa. Ginamit ang tradisyonal at laganap na anyong “Paraon.”
