    rationale: Ang tiyak na pantukoy sa Hebreo ay hindi nangangailangan ng malayong panturo sa Tagalog.
  revised_text: Pabigatin ninyo ang trabahong ipinapagawa sa mga lalaki, upang pagtrabahuhan nila ito at huwag nilang pansinin ang mga salitang kasinungalingan.[a]
