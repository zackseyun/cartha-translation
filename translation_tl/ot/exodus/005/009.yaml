  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: tl
  text: Pabigatin ninyo ang trabahong ipinapagawa sa mga lalaki, upang pagtrabahuhan nila ito at huwag nilang pansinin ang mga salitang kasinungalingan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “huwag nilang pakinggan ang mga huwad na salita” o “huwag nilang bigyang-pansin ang mga mapanlinlang na salita.” Ang pandiwang Hebreo ay maaaring mangahulugang “pansinin,” “pahalagahan,” o “pakinggan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: Pabigatin ninyo
  rationale: Bagaman Qal ang anyo at literal na maaaring ‘maging mabigat,’ sa utos ni Faraon ay likas sa Tagalog ang aktibong ‘pabigatin,’ na naghahayag ng ipinag-uutos na pagpapabigat sa pasanin nang hindi ginagawang teknikal ang pananalita.
- source_word: הָעֲבֹדָה
  choice: ang trabaho
  rationale: Tumutukoy sa sapilitang paggawa, lalo na sa paggawa ng mga ladrilyo; ang ‘trabaho’ ay malinaw at natural sa modernong Tagalog.
- source_word: עַל הָאֲנָשִׁים
  choice: ng mga lalaking iyon
  rationale: Pinananatili ang tiyak na panlalaking katawagan ng הָאֲנָשִׁים. Sa Tagalog, ang bigat na ipinapataw ‘sa’ kanila ay likas na naipapahayag bilang pagpapabigat ‘ng trabaho ng’ mga lalaking iyon.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: upang pag-ukulan nila iyon ng pagsisikap
  rationale: Ang עשה ב־ ay ‘gawin/pagtrabahuhan iyon.’ Ipinahahayag ng salin ang layunin na maubos ang kanilang lakas at pansin sa trabaho; ang ‘iyon’ ay tumutukoy pabalik sa trabaho.
- source_word: וְאַל יִשְׁעוּ
  choice: at huwag nilang pansinin
  rationale: Ang שעה ay maaaring mangahulugang tumingin, magbigay-pansin, o makinig. Ang ‘pansinin’ ay maikli, natural, at pinananatili ang lawak ng kahulugan.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: ang mga kasinungalingang salita
  rationale: Pinananatili ang ‘mga salita’ ng דִבְרֵי at ang mapanlibak na paghatol ni Faraon na ang mga ito ay kasinungalingan.
theological_decisions:
- issue: Paglalarawan ni Faraon sa mensahe nina Moises at Aaron
  choice: mga kasinungalingang salita
  alternative: mga salitang walang kabuluhan
  rationale: Hindi pinatutunayan ng tagapagsalaysay na kasinungalingan ang mensahe; inilalahad ng talata ang mismong mapanlibak na tawag ni Faraon dito. Pinananatili ng salin ang tensiyong iyon nang hindi ito nilulutas sa paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang maramihang anyong pautos na ‘ninyo’ dahil si Faraon ay nag-uutos sa mga tagapagpatupad. Ang pananda ng talababa [a] ay inilagay agad matapos ang pariralang tinatalakay.
