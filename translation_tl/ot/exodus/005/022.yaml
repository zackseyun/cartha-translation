  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֗/י לָ/מָ֤ה הֲרֵעֹ֨תָה֙ לָ/עָ֣ם הַ/זֶּ֔ה לָ֥/מָּה זֶּ֖ה שְׁלַחְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: tl
  text: Pagkatapos, bumalik si Moises kay Yahweh at sinabi, “Panginoon, bakit mo pinahamak ang bayang ito? Bakit mo pa ako isinugo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: bumalik
  rationale: Likas na ipinahihiwatig ng שוב dito ang pagbabalik ni Moises upang humarap at magsalita sa Diyos.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Tuwirang tinutukoy ng אֶל ang nilapitan, at pinananatili ng “Yahweh” ang personal na pangalang tipan na יהוה.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Magalang at likas na katawagan sa Diyos sa makabagong Tagalog, habang naihihiwalay sa pangalang Yahweh.
- source_word: הֲרֵעֹתָה
  choice: pinahamak
  rationale: Ang Hiphil ng רעע ay nagpapahayag ng pagdudulot ng kapahamakan o masamang kalagayan. Iniiwasan nitong tahasang ipakahulugan na gumawa ang Diyos ng moral na kasamaan, ngunit pinananatili ang tindi ng reklamo ni Moises.
- source_word: לָעָם הַזֶּה
  choice: ang bayang ito
  rationale: Ang עם ay tumutukoy sa Israel bilang isang sama-samang bayan; natural at marangal sa Tagalog ang “bayang ito.”
- source_word: לָמָּה זֶּה
  choice: Bakit mo pa
  rationale: Ang זֶּה kasunod ng לָמָּה ay nagbibigay-diin sa tanong. Likas na naihahatid ng “pa” sa Tagalog ang mariing diwang “bakit nga/bakit naman,” nang hindi ginagawang alanganin ang pangungusap.
- source_word: שְׁלַחְתָּנִי
  choice: ako isinugo
  rationale: Ang שלח sa kontekstong ito ay pagsusugo para sa isang atas, kaya mas angkop ang “isinugo” kaysa karaniwang “ipinadala.”
theological_decisions:
- issue: Paglalarawan sa ginawa ng Diyos sa הֲרֵעֹתָה
  choice: pinahamak
  alternative: ginawan ng masama
  rationale: Pinananatili ang matapang na paratang at teolohikal na tensiyon sa reklamo ni Moises, ngunit hindi ipinipilit na moral na kasamaan ang kahulugan; maaaring tumukoy ang anyong causative sa pagdudulot ng kapahamakan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya tinutumbasan ito ng “Yahweh”; ang אֲדֹנָי naman ay hiwalay na isinasaling “Panginoon.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang tindi ng pagsumbat ni Moises nang hindi ginagawang lipas o labis na pormal ang pananalita.
source_grounding:
  english_pob_role: consult_only
