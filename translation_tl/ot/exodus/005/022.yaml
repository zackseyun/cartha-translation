  naturalness: Makabago, malinaw, at marangal ang Tagalog. Ang “bumalik si Moises kay Yahweh,” “pinahamak ang bayang ito,” at “isinugo” ay natural sa kontekstong salaysay at panalangin/pagsumbat.
