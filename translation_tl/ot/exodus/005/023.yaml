base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: tl
  text: Sapagkat mula nang pumunta ako kay Paraon upang magsalita sa pangalan mo[a], masama ang ginawa niya sa bayang ito[b], at talagang hindi mo iniligtas ang bayan mo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa pangalan mo” ay maaari ring unawaing “bilang kinatawan mo” o “sa awtoridad mo.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “pinalala niya ang kalagayan ng bayang ito.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sa Hebreo, inuulit ang ugat ng pandiwang “iligtas” sa isang anyong nagbibigay-diin: “pagliligtas, hindi mo iniligtas.” Kaya maaari ring isalin: “hindi mo man lamang iniligtas.”'
    reason: source_form
lexical_decisions:
- source_word: וּמֵאָז
  choice: Sapagkat mula nang
  rationale: Ang מֵאָז ay tumutukoy sa panahong nagsimula ang isang pangyayari, at ang panandang “Sapagkat” ay angkop sa paliwanag na nakapaloob sa reklamo ni Moises.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: pumunta ako kay Paraon
  rationale: Ang בוא kasunod ng אֶל ay nagpapahayag ng paglapit o pagpunta sa isang tao; natural sa Filipino ang “pumunta ako kay Paraon.”
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: upang magsalita sa pangalan mo
  rationale: Ipinahahayag ng infinitive ang layunin. Pinananatili ng “sa pangalan mo” ang larawan ng pagkilos bilang kinatawan at sa awtoridad ng Diyos.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: masama ang ginawa niya sa bayang ito
  rationale: Ang Hiphil ng רעע ay maaaring mangahulugang gumawa ng masama, manakit, o magpalala ng kalagayan. Pinananatili ng salin ang moral at mapaminsalang diwa nang hindi ito nililimitahan sa iisang epekto.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: at talagang hindi mo iniligtas
  rationale: Ang infinitive absolute na kasabay ng pandiwang may parehong ugat ay nagpapatingkad sa pagtanggi. Naipahahayag ito ng “talagang hindi” sa natural na Filipino.
- source_word: אֶת־עַמֶּךָ
  choice: ang bayan mo
  rationale: Tuwirang tinutukoy ng עַמֶּךָ ang bayang pag-aari o kinikilalang bayan ng Diyos.
theological_decisions:
- issue: Ang matinding pagtanggi sa reklamo ni Moises
  choice: talagang hindi mo iniligtas ang bayan mo
  alternative: hindi mo man lamang iniligtas ang bayan mo
  rationale: Pinananatili ng “talagang hindi” ang diin ng Hebreong infinitive absolute at ang tapang ng reklamo ni Moises, nang hindi ipinahihiwatig na wala nang posibleng pagliligtas sa hinaharap.
- issue: Ang kahulugan ng pagsasalita בִּשְׁמֶךָ
  choice: magsalita sa pangalan mo
  alternative: magsalita bilang kinatawan mo / sa awtoridad mo
  rationale: Ang literal na idyoma ay malinaw rin sa Filipino at pinananatili ang kaugnayan ng pangalan ng Diyos sa pagkatawan at awtoridad.
- issue: Ang saklaw ng הֵרַע
  choice: masama ang ginawa niya sa bayang ito
  alternative: pinalala niya ang kalagayan ng bayang ito
  rationale: Maaaring tumukoy ang pandiwa kapuwa sa masamang pagkilos at sa pagpapalala ng kalagayan. Pinananatili sa pangunahing teksto ang moral na bigat, habang inilalahad sa talababa ang kontekstuwal na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon” at “bayan” bilang pamilyar na mga katawagang biblikal, ngunit iniwasan ang lipas o sobrang teknikal na pananalita.
