  terminology: Ang “mga tagapangasiwa” ay katanggap-tanggap para sa שֹׁטְרֵי, at ang “mga Israelita” ay natural na kontekstuwal na katumbas ng “mga anak ni Israel.” Ang “mga lingkod” ay angkop sa magalang na pagsasalita nila kay Faraon; dapat panatilihin sa talababa ang posibleng “mga alipin.”
