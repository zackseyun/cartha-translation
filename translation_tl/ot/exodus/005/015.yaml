  source_fidelity: 'Ang diwa ng talata ay naipapahayag nang tapat: ang mga tagapangasiwang Israelita ay lumapit kay Faraon at marubdob na nagreklamo. Gayunman, ang “pumunta” ay kulang sa ipinahihiwatig na paglapit sa taong kinakausap, at ang “Bakit ganito ang ginagawa mo” ay hindi gaanong likas at bahagyang malabo sa Filipino. Ang “lumapit” at “Bakit mo ginagawa ito” ay mas malinaw habang nananatiling malapit sa וַיָּבֹאוּ at תַעֲשֶׂה כֹה.'
