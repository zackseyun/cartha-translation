  to: Pagkatapos, lumapit kay Faraon ang mga tagapangasiwa ng mga Israelita at dumaing, “Bakit mo ginagawa ito sa iyong mga lingkod[a]?”
  rationale: 'Pinalitan ang “pumunta” ng “lumapit” upang maipahayag nang mas likas ang pagharap nila kay Faraon. Inayos ang tanong sa karaniwang ayos ng modernong Filipino: “Bakit mo ginagawa ito ...?” Nanatili ang marubdob na “dumaing,” ang administratibong “mga tagapangasiwa,” at ang magalang na “mga lingkod,” kasama ang kinakailangang alternatibong talababa para sa “mga alipin.”'
