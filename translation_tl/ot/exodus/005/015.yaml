  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: tl
  text: Pagkatapos, lumapit kay Faraon ang mga tagapangasiwa ng mga Israelita at dumaing, “Bakit mo ginagawa ito sa iyong mga lingkod[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga alipin.” Ang salitang Hebreo ay maaaring mangahulugang “mga lingkod” o “mga alipin” sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, pumunta
  rationale: Isinusulong ng wayyiqtol ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod, at ang “pumunta” ay tuwirang katumbas ng pandiwa.
- source_word: שֹׁטְרֵי
  choice: mga tagapangasiwa
  rationale: Tumutukoy ito sa mga Israelitang nasa mababang antas ng pamamahala sa sapilitang paggawa sa ilalim ng mga Ehipsiyo. Mas malinaw sa karaniwang mambabasa ang “tagapangasiwa” kaysa “opisyal,” at hindi ito kasingkipot ng “kapatas.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” ginagamit dito ang parirala bilang tawag sa sambayanang Israel. Ang “mga Israelita” ay natural, tumpak sa konteksto, at hindi nagpapahiwatig na lalaki lamang ang tinutukoy.
- source_word: וַיִּצְעֲקוּ
  choice: dumaing
  rationale: Ipinahahayag ng pandiwa ang apurahan at masidhing paghiyaw o paghingi ng tulong. Sa harap ng hari, natural na nahuhuli ng “dumaing” ang reklamo at pagsusumamo.
- source_word: אֶל פַּרְעֹה
  choice: kay Faraon
  rationale: Ang pang-ukol ay nagpapakita ng direksiyon ng kanilang pagdaing patungo kay Faraon.
- source_word: לֵאמֹר
  choice: tuwirang ipinakilala ang sipi
  rationale: Ang Hebreong karaniwang pambungad sa pananalita ay natural na naipahahayag sa Filipino sa pamamagitan ng kuwit at tuwirang sipi; hindi kailangang idagdag ang mabigat na “na sinasabi.”
- source_word: לָמָּה
  choice: Bakit
  rationale: Ito ang tuwiran at likas na katumbas ng pananong na Hebreo.
- source_word: תַעֲשֶׂה כֹה
  choice: ganito ang ginagawa mo
  rationale: Malapit ito sa literal na “gumagawa ka nang ganito” ngunit natural sa Filipino at hindi pinapaliit ang pahayag sa iisang kilos lamang.
- source_word: לַעֲבָדֶיךָ
  choice: sa iyong mga lingkod
  rationale: Ang עבד ay maaaring mangahulugang lingkod o alipin. Sa magalang na pananalita ng mga nagsusumamo sa hari, ang “mga lingkod” ang angkop sa pangunahing teksto habang pinananatili sa talababa ang mas matinding posibilidad.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dumaing” upang mapanatili ang tindi ng pagsusumamo, at “mga lingkod” bilang magalang na pananalita kay Faraon nang hindi itinatago ang alternatibong “mga alipin.”
