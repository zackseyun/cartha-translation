  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: tl
  text: 'Kaya lumabas ang mga tagapagpagawa sa bayan at ang mga opisyal nito[a], at sinabi nila sa bayan, “Ganito ang sabi ni Paraon: ‘Hindi ko kayo bibigyan ng dayami.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga katiwala nito sa paggawa.” Ang salitang Hebreo ay maaaring tumukoy sa mga nakabababang opisyal na kabilang sa bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: mga tagapagpagawa
  rationale: Tumutukoy ito sa mga taong sapilitang nagpapatupad ng takdang trabaho. Ang “mga tagapagpagawa” ay natural sa Filipino at ipinahihiwatig ang pamamahala sa sapilitang paggawa nang hindi labis na nagpapakahulugan.
- source_word: שֹׁטְרָיו
  choice: ang mga opisyal nito
  rationale: Ang hulaping panghalip ay tumutukoy sa bayan. Pinananatili ng “mga opisyal nito” ang malawak na administratibong diwa; inilalagay sa talababa ang mas tiyak na posibilidad na “mga katiwala sa paggawa.”
- source_word: וַיֵּצְאוּ
  choice: lumabas
  rationale: Tuwirang katumbas ng karaniwang pandiwang “lumabas,” at angkop sa pagkilos mula sa kinaroroonan ng Paraon patungo sa bayan.
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang kolektibong pangngalan ay tumutukoy rito sa bayang Israel, lalo na sa mga manggagawa nito.
- source_word: לֵאמֹר
  choice: at sinabi nila
  rationale: Idyomatikong inilalahad sa Filipino ang panandang Hebreo na nagpapakilala ng tuwirang pahayag.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili ang pormal na pormula ng mensahero. Ang “sinabi” ay natural dahil ipinahahayag ng mga opisyal ang utos na katatapos lamang ibigay ng Paraon.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Filipino ng titulong maharlika ng Ehipto.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Hindi ko kayo bibigyan
  rationale: Natural na Filipino para sa kasalukuyang pagtanggi na may patuloy na bisa sa paggawa. Hindi nito nililimitahan ang pahayag sa isang malayong hinaharap.
- source_word: תֶּבֶן
  choice: dayami
  rationale: Karaniwang tawag sa materyal na ginagamit sa paggawa ng mga laryo sa kontekstong ito.
