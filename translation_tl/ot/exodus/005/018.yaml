  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: tl
  text: Kaya ngayon, humayo kayo at magtrabaho. Hindi kayo bibigyan ng dayami, ngunit kailangan ninyong ibigay ang takdang dami[a] ng mga ladrilyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “takdang bilang ng mga ladrilyo.” Ang Hebreong תֹכֶן ay tumutukoy sa isang takda o sinukat na dami na hinihingi sa mga manggagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinahahayag nito ang madiing pangwakas na utos ng Paraon at natural na inililipat ang usapan tungo sa bunga ng naunang pahayag.
- source_word: לְכוּ
  choice: humayo kayo
  rationale: Tuwirang utos ito mula sa pandiwang הלך. Pinananatili ng “humayo kayo” ang hiwalay na utos bago ang “magtrabaho,” sa dignidad na angkop sa salaysay.
- source_word: עִבְדוּ
  choice: magtrabaho
  rationale: Sapilitang paggawa ang tinutukoy sa konteksto, hindi paglilingkod sa pagsamba; malinaw at natural ang “magtrabaho.”
- source_word: וְתֶבֶן
  choice: dayami
  rationale: Karaniwang katumbas sa Filipino ng materyal na inihahalo sa paggawa ng ladrilyo. Ang kasalungat na diwa ng waw ay ipinahayag sa “ngunit” bago ang huling sugnay.
- source_word: לֹא יִנָּתֵן לָכֶם
  choice: Hindi kayo bibigyan
  rationale: Pinananatili nito ang negatibo at balintiyak na anyo ng Hebreo sa natural na Filipino.
- source_word: תֹכֶן
  choice: takdang dami
  rationale: Tumutukoy ito sa isang sinukat o itinakdang dami na hinihingi sa mga manggagawa. Hindi nito nililimitahan ang kahulugan sa eksaktong bilang lamang.
- source_word: לְבֵנִים
  choice: ng mga ladrilyo
  rationale: Malinaw na ipinakikita ang ugnayang konstruktong “takdang dami ng mga ladrilyo.”
- source_word: תִּתֵּנּוּ
  choice: kailangan ninyong ibigay
  rationale: Ang literal na “ibibigay ninyo” ay utos sa konteksto; ipinahahayag ng “kailangan” ang obligasyon nang hindi ginagawang tahasang “gumawa” ang pandiwa.
theological_decisions: []
translation_notes:
  register: Makabago at malinaw na Filipino na may dignidad na angkop sa salaysay. Pinanatili ang dalawang utos na “humayo” at “magtrabaho,” habang ang “kailangan ninyong ibigay” ay natural na nagpapahayag ng sapilitang pananagutan. Inilipat ang talababa sa “takdang dami,” ang salitang aktuwal nitong ipinapaliwanag.
