  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: tl
  text: Ngunit sinabi niya, “Tamad kayo—tamad![a] Kaya sinasabi ninyo, ‘Hayaan mo kaming umalis at maghain kay Yahweh.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Inuulit sa Hebreo ang salitang isinaling “tamad” upang idiin ang paratang; maaari rin itong isaling “pabaya—napakapabaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi niya
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, ngunit ang tugon ng Faraon ay pasalungat sa reklamo ng mga Israelita; kaya natural sa konteksto ang “Ngunit.”
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Tamad kayo—tamad!
  rationale: Sa kontekstong ito, ang נִרְפִּים ay paratang na ayaw nilang magtrabaho o nagpapabaya sila. Pinananatili ng pag-uulit at gitling ang diin at bagsik ng Hebreo.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Ipinapahayag nito ang diumano’y sanhi o konklusyon ng Faraon sa maikli at natural na Tagalog.
- source_word: אֹמְרִים
  choice: sinasabi ninyo
  rationale: Ang participle ay gumaganap bilang pangkasalukuyang pandiwa at tahasang tumutukoy sa maramihang kausap.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Hayaan mo kaming umalis at maghain
  rationale: Kapuwa cohortative ang mga pandiwa. Sa Tagalog, malinaw na naihahayag ng “Hayaan mo kaming” ang kahilingang kumilos ang nagsasalita at ang kaniyang mga kasama nang hindi isinasama ang kausap sa “tayo.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה; ang “kay” ay natural na pananda sa Diyos na pinag-uukulan ng paghahain.
theological_decisions:
- issue: Pagbaybay sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan nang hindi pinapalitan ng isang titulo.
- issue: Ugnayan ng dalawang cohortative na נֵלְכָה at נִזְבְּחָה
  choice: umalis at maghain
  alternative: umalis upang maghain
  rationale: Pinananatili ng “at” ang pagkakapantay ng dalawang anyong cohortative at hindi ginagawang tahasang layunin lamang ang ikalawang kilos, bagaman maaaring maunawaan iyon mula sa konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kayo/ninyo” upang ipakita ang maramihang kausap, ngunit “mo” sa siniping kahilingan sapagkat ang Faraon ang indibiduwal na pinakikiusapan. Ang “maghain” ay karaniwang salitang panrelihiyon na sapat na tiyak para sa paghahandog ng hayop o handog.
