  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “ladrilyo,” “takdang bilang,” at “ipataw” upang mapanatili ang administratibo at mapaniil na tono ng utos. Ang panghalip na “ninyo” ay angkop sa maramihang kinakausap sa Hebreo.
