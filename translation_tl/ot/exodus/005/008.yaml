  to: At ipataw ninyo sa kanila ang dating takdang bilang ng mga ladrilyong ginawa nila kahapon at noong makalawa[a]. Huwag ninyo itong bawasan, sapagkat tamad sila. Kaya sila ay sumisigaw, na sinasabi, ‘Magpunta tayo at maghandog sa ating Diyos.’
