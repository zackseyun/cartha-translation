base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: tl
  text: At ipataw ninyo sa kanila ang dating takdang bilang ng mga ladrilyong ginawa nila kahapon at noong makalawa[a]. Huwag ninyo itong bawasan, sapagkat tamad sila. Kaya sila ay sumisigaw, na sinasabi, ‘Magpunta tayo at maghandog sa ating Diyos.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mas idiomatiko, “gaya ng dati” o “noong mga nakaraan,” para sa “kahapon at noong makalawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: takdang bilang
  rationale: Sa konteksto ng sapilitang paggawa, tumutukoy ito sa itinakdang dami ng ladrilyong kailangang gawin. Likas at malinaw sa Filipino ang “takdang bilang.”
- source_word: הַלְּבֵנִים
  choice: mga ladrilyo
  rationale: Karaniwang kongkretong katawagan sa mga ladrilyong ginagawa ng mga Israelita.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: kahapon at noong makalawa
  rationale: Pinananatili ang tiyak na Hebreong parirala tungkol sa dalawang nagdaang araw, habang natural pa rin sa modernong Filipino; maaari rin itong idiomatikong mangahulugang “gaya ng dati.”
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: ipataw ninyo sa kanila
  rationale: Ipinahahayag ng idyoma ang sapilitang pagpapasan ng isang obligasyon sa mga manggagawa.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: Huwag ninyo itong bawasan
  rationale: Tuwirang ipinagbabawal ang anumang pagbawas sa itinakdang bilang.
- source_word: נִרְפִּים
  choice: mga tamad
  rationale: Ito ang mapanumbat na paratang ni Faraon na hindi sila nagsisikap sa trabaho; ang “tamad” ang pinakanatural na katumbas sa kontekstong ito.
- source_word: צֹעֲקִים
  choice: sumisigaw
  rationale: Naghahayag ng malakas at mariing pagsamo o panawagan.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Hayaan ninyo kaming umalis at maghandog
  rationale: Ang mga cohortative ay nasa loob ng pagsipi ni Faraon sa kahilingan ng bayan. Nililinaw ng Filipino ang diwang humihingi sila ng pahintulot na umalis upang maghandog.
- source_word: לֵאלֹהֵינוּ
  choice: sa aming Diyos
  rationale: Tuwirang nagsasaad kung kanino ihahandog ang alay.
