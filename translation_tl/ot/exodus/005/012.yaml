translation:
  language: tl
  text: Kaya nagkalat ang mga tao sa buong lupain ng Ehipto upang mamulot ng mga tuyong tangkay na gagamitin bilang dayami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O maaaring hindi mahigpit na pinag-iiba ang mga terminong isinaling “tuyong tangkay” at “dayami.” Pinananatili ng pangunahing teksto ang malamang na pagkakaiba ng pinupulot na tuyong tangkay at ng karaniwang dayaming ipinagkakaloob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: nagkalat
  rationale: Ang pandiwang פוץ ay naglalarawan sa pagkalat ng mga tao sa malawak na lugar dahil sa utos ni Faraon. Natural sa modernong Tagalog ang “nagkalat” at hindi nito ipinipilit kung kusang kumilos o sapilitang pinangalat ang bawat isa.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Kolektibong tumutukoy ito sa mga Israelitang sapilitang nagtatrabaho, ngunit sapat at tapat sa Hebreo ang karaniwang pariralang “ang mga tao.”
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Pinananatili ng “buong” ang saklaw ng בְּכָל, habang ang “lupain ng Ehipto” ay dignified at malinaw na katumbas ng parirala.
- source_word: לְקֹשֵׁשׁ
  choice: upang mamulot
  rationale: Ang קשש ay pagtitipon ng maliliit at kalat-kalat na piraso. Mas tiyak sa kontekstong ito ang “mamulot” kaysa sa pangkalahatang “magtipon.”
- source_word: קַשׁ
  choice: mga tuyong tangkay
  rationale: Dahil hiwalay na binanggit ang תֶּבֶן, inilalarawan ang קַשׁ bilang natuyong latak o tangkay ng halaman upang mapanatili ang malamang na pagkakaiba ng dalawang salita.
- source_word: לַתֶּבֶן
  choice: na gagamiting dayami
  rationale: 'Ipinapakita ng pariralang ito ang layunin o gamit: ang pinulot na tuyong tangkay ang magsisilbing dayami sa paggawa ng mga laryo. Natural itong pahayag sa Tagalog at pinananatili ang ugnayang ipinahihiwatig ng ל.'
