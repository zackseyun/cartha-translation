translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mamulot” para sa kalat-kalat na materyal at “mga tuyong tangkay na gagamiting dayami” upang likas na maipahayag ang malamang na lexical contrast nang hindi nagiging teknikal.
