  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: tl
  text: Sinabi ng Paraon, “Tingnan ninyo, marami na ngayon ang mga tao sa lupain, at pinatitigil ninyo sila sa kanilang mga pasanin.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at pinahihinto ninyo sila sa kanilang mga gawain” o “at pinagpapahinga ninyo sila mula sa kanilang mga pasanin.” Ang pandiwang Hebreo ay causative, na nangangahulugang “magpatigil” o “magpahinto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Tingnan ninyo
  rationale: Nagpapakilala ito sa mariing obserbasyon ng Paraon. Likas ito sa makabagong Filipino at pinananatili ang pantawag-pansing puwersa ng Hebreo.
- source_word: רַבִּים
  choice: napakarami
  rationale: Ang predikatibong pang-uri ay nagsasaad na marami o lubhang marami ang tinutukoy na populasyon; natural na ipinahahayag ng “napakarami” ang diin ng reklamo.
- source_word: עַם הָאָרֶץ
  choice: mga tao sa lupain
  rationale: Pinananatili ang malinaw na sangkap na “tao” at “lupain” nang hindi ito binibigyang-kahulugang “karaniwang mamamayan.” Sa konteksto, tumutukoy ito sa mamamayang Israelita na nasa Ehipto.
- source_word: עַתָּה
  choice: ngayon
  rationale: Tuwirang katumbas ng pang-abay na tumutukoy sa kasalukuyang kalagayan.
- source_word: וְהִשְׁבַּתֶּם
  choice: pinatitigil ninyo sila
  rationale: 'Ang Hiphil ng שׁבת ay causative: sina Moises at Aaron ang nagpapahinto sa mga tao. Iniiwasan ng “pinatitigil” ang posibleng positibong himig ng “pinagpapahinga” habang pinananatili ang aspektong nagpapatuloy sa reklamo.'
- source_word: מִסִּבְלֹתָם
  choice: sa kanilang mabibigat na gawain
  rationale: Sa konteksto ng Exodo, ang סִבְלֹת ay mga pasan o gawaing ipinataw sa mga Israelita. Ang parirala ay natural sa Filipino at pinananatili ang diwa ng mabigat na paggawa nang labis na hindi nililinaw kung ito ay “sapilitang paggawa.”
