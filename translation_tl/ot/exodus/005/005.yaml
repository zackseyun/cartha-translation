  naturalness: Likas at angkop sa makabagong Filipino ang pangunahing pangungusap. Mas malinaw at mas natural sa kontekstong ito ang “pinatitigil ninyo sila sa kanilang mga pasanin,” na idiomatikong nagsasaad na pinahihinto sila sa mga gawaing pasan nila.
  terminology: Ang “Paraon” ay wastong karaniwang Filipino para sa Pharaoh. Ang “mga pasanin” ay pinananatili ang mahalagang leksikal na kahulugan ng סִבְלֹת nang hindi dinaragdagan ng “sapilitang” o ng hindi tahasang diin na “mabibigat.”
