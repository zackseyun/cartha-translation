  source_fidelity: 'Tumpak sa pangkalahatan ang salin: naipapahayag nito ang pagpasok nina Moises at Aaron, ang pormulang pangmensahero, ang banal na pangalan, ang utos na palayain ang bayan, at ang layuning magdaos ng kapistahan sa ilang. Gayunman, ang perpektong aspekto ng “Ganito ang sinabi” ay hindi angkop sa Hebreong messenger formula na כֹּה אָמַר, na sa kontekstong ito ay “Ganito ang sabi.”'
