  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: tl
  text: 'Pagkatapos, pumasok sina Moises at Aaron at sinabi nila sa Faraon, “Ganito ang sabi ni Yahweh[a], ang Diyos ng Israel: ‘Palayain mo ang bayan ko upang magdiwang sila ng kapistahan para sa akin[b] sa ilang.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Yahweh” ay transliterasyon ng Hebreong YHWH, ang personal na pangalan ng Diyos.
    reason: divine_name
  - marker: b
    text: Maaari ring isalin na “ipagdiwang nila ang isang kapistahan para sa akin.” Ang pandiwang Hebreo ay tumutukoy sa pagdaraos o pagdiriwang ng isang kapistahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Likas na panandang temporal sa Filipino na nagpapanatili sa pagkakasunod-sunod ng salaysay nang hindi tinutukoy kung gaano katagal ang lumipas.
- source_word: בָּאוּ
  choice: pumasok
  rationale: Sa konteksto, lumapit at pumasok sina Moises at Aaron sa harap ng Faraon; mas tiyak ito kaysa sa payak na “dumating.”
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: sinabi nila sa Faraon
  rationale: Natural na makabagong Filipino para sa karaniwang pormula ng pagsasalita sa salaysay.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili ang pormal at may-awtoridad na pormula ng mensahero sa paraang natural sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Malinaw at karaniwang anyo ng pariralang konstruktong tumutukoy sa kaugnayan ni Yahweh sa Israel.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Palayain mo ang bayan ko
  rationale: Ipinahahayag ng pautos na שַׁלַּח ang pagpapalaya o pagpapaalis sa Israel mula sa kapangyarihan ng Faraon. Ang “bayan ko” ay natural habang pinananatili ang pag-angkin ng Diyos.
- source_word: וְיָחֹגּוּ לִי
  choice: upang makapagdiwang sila ng kapistahan para sa akin
  rationale: Ang pandiwang חגג ay tumutukoy sa pagdiriwang ng isang kapistahan, hindi lamang sa pangkalahatang pagsamba. Ipinakikita ng “upang” ang layunin ng pagpapalaya sa konteksto.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang “ilang” ay maikli, marangal, at tumpak para sa rehiyong hindi tinitirhan; hindi nito ipinapalagay na puro buhangin ang lugar gaya ng maaaring ipahiwatig ng “disyerto.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlang ito sa halip na palitan ng titulong “PANGINOON”; hindi pinipili ang “Jehovah” dahil hindi iyon ang mas malapit na makabagong transliterasyon.
- issue: Lakas ng utos na שַׁלַּח
  choice: Palayain mo
  alternative: Pahintulutan mong umalis
  rationale: Mas malinaw na naipahahayag ng “Palayain mo” ang utos na pakawalan ang bayang nasa ilalim ng kapangyarihan ng Faraon, nang hindi dinaragdagan ang teolohikal na kahulugan.
- issue: Kalikasan ng gawaing hinihingi sa ilang
  choice: magdiwang ng kapistahan para kay Yahweh
  alternative: sumamba kay Yahweh
  rationale: Tiyak na kapistahang panrelihiyon ang ipinahihiwatig ng חגג. Hindi ito pinalalawak tungo sa pangkalahatang “pagsamba,” bagaman kasama sa kapistahan ang pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Faraon,” “bayan,” “kapistahan,” at “ilang” bilang mga salitang madaling maunawaan ngunit angkop sa tekstong biblikal. Inilagay ang talababa tungkol sa banal na pangalan pagkatapos mismo ng “Yahweh,” at ang talababa tungkol sa חגג pagkatapos ng pariralang tumutukoy sa kapistahan.
