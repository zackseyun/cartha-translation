  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: tl
  text: Sinabi ng Paraon, “Sino si Yahweh[a] upang sundin ko ang kanyang tinig at hayaan kong umalis ang Israel? Hindi ko kilala si Yahweh, at hindi ko rin hahayaang umalis ang Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “ANG PANGINOON.” Kabilang sa mga alternatibong anyo ang “Yahweh” at “Jehovah.”'
    reason: Ipinababatid ang mismong anyo ng banal na pangalan at ang mga tradisyonal na paraan ng paglalarawan dito.
lexical_decisions:
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang katawagang Filipino para sa maharlikang titulong Ehipsiyo.
- source_word: מִי יְהוָה
  choice: Sino si Yahweh
  rationale: Ang מִי ay nagtatanong tungkol sa pagkakakilanlan, at pinananatili ng tanong ang mapanghamong tono ng Paraon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Filipino ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: para sundin ko ang kanyang tinig
  rationale: Ang שׁמע na may בְּקוֹל ay karaniwang tumutukoy sa pakikinig na may pagsunod; pinananatili rin ng “tinig” ang larawang nasa Hebreo.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: payagang umalis ang Israel
  rationale: Sa konteksto ng Exodo, natural na ipinapahayag nito ang pagpapalaya o pagpapaalis sa Israel.
- source_word: לֹא יָדַעְתִּי
  choice: Hindi ko kilala
  rationale: Natural itong Filipino para sa kasalukuyang pahayag ng Paraon na hindi niya kilala o kinikilala si Yahweh, nang hindi nililimitahan ang saklaw sa isa lamang sa dalawang pahiwatig.
- source_word: וְגַם
  choice: at ... rin
  rationale: Ipinahahayag nito ang idinagdag at mariing pagtanggi ng Paraon sa natural na paraang Filipino.
- source_word: לֹא אֲשַׁלֵּחַ
  choice: hindi ko rin payagang umalis
  rationale: Ipinakikita ng anyong pandiwa ang matatag na pasiya ng Paraon, habang inuulit ang salitang ginamit sa unang sugnay para sa pagkakapare-pareho.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Karaniwang anyo sa Filipino ng pangalan ng bayan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; inilalahad sa talababa ang tradisyonal at alternatibong anyo.
- issue: Saklaw ng “Hindi ko kilala si Yahweh”
  choice: Pinanatili ang payak na “kilala”
  alternative: Hindi ko kinikilala si Yahweh
  rationale: Maaaring magpahiwatig ang יָדַע kapuwa ng kawalan ng pagkakilala at pagtangging kumilala. Hindi tahasang nilulutas ng saling “kilala” ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon” at ang natural na pariralang “payagang umalis,” samantalang pinanatili ang Hebreong larawang “sundin ... ang kanyang tinig.” Inilagay ang talababa pagkatapos mismo ng “Yahweh,” ang salitang tinutukoy nito.
