  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: tl
  text: At patuloy silang pinipilit ng mga tagapagpagawa, na sinasabi, “Tuparin ninyo ang inyong araw-araw na takdang gawain, gaya noong may dayami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: mga tagapagpagawa
  rationale: Tumutukoy sa mga opisyal na sapilitang nagpapagawa at naniningil ng itinakdang produksiyon; malinaw ito sa konteksto ng sapilitang paggawa nang hindi lumalawak sa pangkalahatang “mga mapang-api.”
- source_word: אָצִים
  choice: patuloy silang ginigiit
  rationale: Ipinahihiwatig ng participle ang tuloy-tuloy at mapilit na pag-udyok; likas sa modernong Tagalog ang “patuloy na ginigiit.”
- source_word: כַּלּוּ
  choice: Tapusin ninyo
  rationale: Tuwirang pautos ito na kumpletuhin ang ipinagawang trabaho.
- source_word: מַעֲשֵׂיכֶם
  choice: ang inyong gawain
  rationale: Sapat ang lawak ng “gawain” upang katawanin ang Hebrew at malinaw na tumukoy sa ipinagagawang paggawa ng ladrilyo.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ang takdang dami sa bawat araw
  rationale: Ang literal na idyomang “bagay/salita ng isang araw sa araw nito” ay tumutukoy sa araw-araw na itinakdang dami; ang saling ito ay malinaw at natural sa Tagalog.
- source_word: כַּאֲשֶׁר
  choice: gaya noong
  rationale: Malinaw na ipinakikilala ang paghahambing sa dating kalagayan.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: may dayami pa
  rationale: Tapat at maikli itong paglalarawan sa dating panahong may dayaming magagamit; hindi nito idinaragdag kung sino ang naglaan nito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tagapagpagawa” para sa opisyal na sapilitang nagpapagawa, at nilinaw nang maikli ang Hebrew na idyoma bilang “takdang dami sa bawat araw.”
