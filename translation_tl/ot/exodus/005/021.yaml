    issue: Ang pariralang 'kaya para na rin kayong naglagay' ay may dagdag na paghahambing at maling antas ng pagpapalambot.
    rationale: Ang לָתֵת ay infinitive na tuwirang naglalarawan ng ibinungang pagbibigay ng tabak sa kamay ng mga taga-Paraon. Wala sa Hebreo ang 'para na rin'; maaari nitong pahinain ang paratang.
  - severity: low
    issue: Hindi naipakita sa pangunahing teksto ang inuulit na 'sa paningin' ng Hebreo.
    rationale: Hindi ito kinakailangang istruktural na ulitin sa Tagalog, ngunit ang pag-uulit ay natural pa rin at mas malinaw na pinananatili ang paralelismo ng pinagmulan.
