  source_fidelity: Tumpak ang pangunahing kahulugan, ang jussive na panawagan kay Yahweh, at ang matingkad na idyoma ng 'aming amoy.' Gayunman, ang 'kaya para na rin kayong naglagay' ay nagdaragdag ng paghahambing ('para na rin') at binabago ang tuwirang infinitival na pahayag ng Hebreo tungkol sa pagbibigay ng tabak.
  naturalness: Likas at marangal ang karamihan ng Filipino. Mas tuwiran at mas malapit sa orihinal ang 'sa pagbibigay ninyo ng tabak sa kanilang kamay' kaysa sa kolokyal na 'para na rin kayong naglagay.'
  terminology: Ang 'Yahweh,' 'Paraon,' 'mga lingkod,' at 'tabak' ay angkop. Ang 'pinabaho ninyo ang aming amoy' ay sinadyang literal ngunit nauunawaan at maayos na nililinaw ng talababa.
  issues:
