base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: tl
  text: At sinabi nila sa kanila, “Tingnan nawa kayo ni Yahweh at humatol, sapagkat pinabaho ninyo ang aming amoy[a] sa paningin ni Paraon at sa paningin ng kanyang mga lingkod, sa pagbibigay ninyo ng tabak sa kanilang kamay upang patayin kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “pinabaho ninyo ang aming amoy”; ibig sabihin, ginawa ninyo kaming kasuklam-suklam o kamuhi-muhi sa kanila.'
    reason: Ipinapaliwanag ang konkretong idyomang Hebreo nang hindi inaalis ang larawan nito sa pangunahing teksto.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: At sinabi nila sa kanila
  rationale: Pinananatili ang karaniwang daloy ng salaysay at ang panghalip ng Hebreo; hindi tahasang idinaragdag sa pangunahing teksto ang mga pangalang Moises at Aaron.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם
  choice: Tingnan nawa kayo ni Yahweh
  rationale: Ang imperfect ay ginagamit bilang isang pakiusap na may diwang pagsumpa o paghiling ng banal na pagsusuri. Ang “nawa” ay malinaw na naghahayag ng jussive na puwersa.
- source_word: וְיִשְׁפֹּט
  choice: at humatol
  rationale: Walang tahasang layon ang pandiwa sa Hebreo, kaya hindi idinagdag ang “kayo.” Sa gayon, nananatiling bukas kung ang hinihiling ay paghatol sa kanila o paghatol sa buong usapin.
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: pinabaho ninyo ang aming amoy
  rationale: Pinananatili ang matindi at konkretong metapora ng Hebreo sa halip na lubusang pakinisin bilang “ginawa ninyo kaming kasuklam-suklam.” Ipinaliliwanag ng talababa ang idyoma.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: sa paningin ng Paraon at ng kanyang mga lingkod
  rationale: Ang “sa paningin” ay natural sa Filipino at malapit sa inuulit na idyomang Hebreo na tumutukoy sa tingin o pagtataya ng isang tao.
- source_word: לָתֵת חֶרֶב בְּיָדָם
  choice: kaya para na rin kayong naglagay ng tabak sa kamay nila
  rationale: Ipinahahayag ang bunga ng ginawa nila at pinananatili ang larawang pagbibigay sa mga taga-Ehipto ng paraan o pagkakataong pumatay. Ang “para na rin” ay nagpapakitang matalinghaga ang paratang.
- source_word: לְהָרְגֵנוּ
  choice: upang patayin kami
  rationale: Tuwiran, malinaw, at makabagong salin ng infinitive na may hulaping unang panauhang maramihan.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang mismong Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa banal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Layon ng “humatol”
  choice: Walang idinagdag na tahasang layon
  alternative: hatulan nawa niya kayo
  rationale: Walang nakasaad na layon sa pandiwang Hebreo. Ang saling walang layon ay nagpapanatili sa tunay na kalabuan kung ang Diyos ay hinihilingang humatol sa mga kausap o sa alitan sa kabuuan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang matingkad na metapora ng amoy at ang idyoma ng tabak, habang gumamit ng likas na balangkas ng pangungusap sa Tagalog. Ang “mga lingkod” ay angkop sa mga opisyal o tauhan ng Paraon sa kontekstong ito.
