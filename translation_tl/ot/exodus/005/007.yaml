  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: tl
  text: “Huwag na kayong magbigay ng dayami sa mga tao para sa paggawa ng mga ladrilyo, gaya ng dati.[a] Sila ang magpunta at mangalap ng dayami para sa kanilang sarili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “gaya ng kahapon at noong makalawa,” isang idyomang nangangahulugang “gaya ng dati” o “noong nakaraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן לָתֵת
  choice: Huwag na kayong magbigay
  rationale: Ang Hiphil ng יסף na may negasyon ay nagpapahinto sa dating ginagawa. Likas sa modernong Tagalog ang “huwag na” para sa utos na itigil ang patuloy na pagbibigay.
- source_word: תֶּבֶן
  choice: dayami
  rationale: Karaniwang tawag ito sa tuyong tangkay na ginagamit sa paggawa ng ladrilyo, at pareho ang salin sa dalawang paglitaw nito sa talata.
- source_word: לָעָם
  choice: sa mga tao
  rationale: Pinananatili nito ang literal at malawak na kahulugan ng עָם nang hindi tahasang pinapalitan ng mas makitid na “mga manggagawa.”
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: para sa paggawa ng mga ladrilyo
  rationale: Ipinapahayag ng infinitive at layon ang layunin; malinaw at natural ang parirala sa Tagalog.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: gaya ng dati
  rationale: Idyoma itong literal na tumutukoy sa “kahapon at noong makalawa” ngunit nangangahulugang gaya noong nakaraan o dati.
- source_word: הֵם יֵלְכוּ
  choice: Sila mismo ang papuntahin ninyo
  rationale: Ang tahasang panghalip na הֵם ay binibigyang-diin ang mga tao bilang mismong gagawa, habang ang imperfect sa konteksto ay may puwersa ng utos. Ginagawang malinaw ng Tagalog ang direktibang ipinauukol sa mga tagapangasiwa.
- source_word: וְקֹשְׁשׁוּ
  choice: upang manguha
  rationale: Ang קשש ay tumutukoy sa pangangalap o pamumulot ng nakakalat na materyal. Ang “manguha” ay natural sa konteksto ng pagkuha nila mismo ng dayami.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: Ipinakikita ng dative pronoun na ang mga tao ang kukuha ng dayami para sa sarili nilang pangangailangan, sa halip na ibigay ito sa kanila.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “ladrilyo” bilang karaniwang salitang Filipino para sa brick at pinanatili ang idiom sa natural na anyo, kalakip ang literal na paliwanag sa talababa.
