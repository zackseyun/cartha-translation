  verdict: revise
  source_fidelity: 'Tumpak ang pangunahing diwa: ipinagbabawal ang patuloy na pagbibigay ng dayami, at ang mga tao ay inuutusang sila ang kumuha nito. Gayunman, ang “Sila mismo ang papuntahin ninyo” ay nagdaragdag ng isang hiwalay na tagapag-utos na hindi tahasang nasa Hebreo at masyadong inililihis ang direktibang “sila ay pumunta.”'
  naturalness: Natural ang unang pangungusap, ngunit masalimuot at hindi gaanong likas sa modernong Tagalog ang “Sila mismo ang papuntahin ninyo upang manguha.” Mas malinaw at tuwiran ang “Sila ang magpunta at mangalap.”
  terminology: Ang “dayami,” “mga tao,” at “mga ladrilyo” ay angkop at pare-pareho. Ang “mangalap” ay mas tumpak kaysa “manguha” para sa קשש, na tumutukoy sa pangangalap/pamumulot ng materyal.
