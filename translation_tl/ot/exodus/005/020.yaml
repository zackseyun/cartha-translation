  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: tl
  text: Nakasalubong nila sina Moises at Aaron[a], na nakatayo upang salubungin sila nang lumabas sila mula sa piling ni Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nakatagpo nila sina Moises at Aaron.” Sa ilang konteksto, ang pandiwa ay maaari ring magpahiwatig ng pagharap o komprontasyon, ngunit pinananatili ng pangunahing teksto ang mas malawak na diwang “nakasalubong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: Nakasalubong nila
  rationale: Ang פגע ay maaaring mangahulugang makatagpo o makasalubong at, sa ilang konteksto, humarap nang may tensiyon. Pinananatili ng “nakasalubong” ang malawak at likas na diwa nang hindi ipinapasok agad ang poot na malinaw lamang sa kasunod na talata.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: sina Moises at Aaron
  rationale: Ginagamit ang pantukoy na “sina” para sa dalawang tiyak na pangalang pantangi bilang layon ng pandiwa.
- source_word: נִצָּבִים
  choice: na nakatayo roon
  rationale: Ipinahahayag nito ang nagpapatuloy na kalagayan ng participle at likas na inilalarawan na naghihintay sina Moises at Aaron sa lugar na iyon.
- source_word: לִקְרָאתָם
  choice: upang salubungin sila
  rationale: Ang לִקְרָאתָם ay tumutukoy sa pagharap o pagpoposisyon upang makipagkita. Ang “upang salubungin sila” ay natural sa Tagalog at hindi labis na nagpapahiwatig ng komprontasyon.
- source_word: בְּצֵאתָם
  choice: nang lumabas sila
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng temporal na pangyayari; malinaw at maikli itong naipapahayag ng “nang lumabas sila.”
- source_word: מֵאֵת פַּרְעֹה
  choice: mula sa harap ng Faraon
  rationale: Ang מֵאֵת ay maaaring magpahiwatig ng pag-alis mula sa piling o presensiya ng isang tao. Ang “mula sa harap ng Faraon” ay nagpapanatili sa mas buong diwa at akma sa paglabas nila mula sa pakikipagharap sa hari.
