revisions:
- from: At sinabi nila[a], “Nakipagtagpo sa amin ang Diyos ng mga Hebreo. Hinihiling naming payagan mo kaming maglakbay nang tatlong araw papunta sa ilang upang makapaghandog kami kay Yahweh na aming Diyos. Kung hindi, baka hampasin niya kami ng salot o ng tabak.”
  to: At sinabi nila[a], “Nakipagtagpo sa amin ang Diyos ng mga Hebreo. Hinihiling naming payagan mo kaming maglakbay nang tatlong araw patungo sa ilang upang makapaghandog kami ng mga hain kay Yahweh na aming Diyos, baka saktan niya kami sa pamamagitan ng salot o tabak.”
  rationale: Inalis ang dagdag na tahasang kondisyon na “Kung hindi,” ginawang idiomatiko ang paraan ng pananakit sa pamamagitan ng salot o tabak, at nilinaw na ang paghahandog ay paghahandog ng mga hain. Pinanatili ang ambigwidad sa talababa para sa נִקְרָא עָלֵינוּ at ang mga pangunahing katawagang Hebreo sa teksto.
