  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: tl
  text: At sinabi nila[a], “Nakipagtagpo sa amin ang Diyos ng mga Hebreo. Hinihiling naming payagan mo kaming maglakbay nang tatlong araw patungo sa ilang upang makapaghandog kami ng mga hain kay Yahweh na aming Diyos, baka saktan niya kami sa pamamagitan ng salot o tabak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “tumawag sa amin.” Maaaring mangahulugan ang Hebreo na nakipagtagpo sa kanila ang Diyos o tinawag sila.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ang Diyos ng mga Hebreo
  rationale: Pinananatili ang tiyak na katawagang etniko na ‘mga Hebreo’ sa salaysay sa halip na gawing ‘mga Israelita.’
- source_word: נִקְרָא עָלֵינוּ
  choice: nakipagtagpo sa amin
  rationale: Ang Niphal ng קרא na may עַל ay maaaring tumukoy sa pakikipagtagpo o pagtawag. Ang ‘nakipagtagpo sa amin’ ay natural sa Filipino at angkop sa iniulat na pakikipagharap ng Diyos, habang inilalagay sa talababa ang tunay na alternatibo.
- source_word: נֵלֲכָה נָּא
  choice: Hinihiling naming payagan mo kaming maglakbay
  rationale: Ipinahahayag ng cohortative at נָא ang magalang na pakiusap. Mas natural sa konteksto ng pakikipag-usap sa Paraon ang tahasang ‘payagan mo kami’ kaysa literal ngunit alanganing ‘mangyaring umalis kami.’
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: maglakbay nang tatlong araw
  rationale: Natural na Filipino para sa idyomang Hebreo na nagsasaad ng tagal o layo ng paglalakbay.
- source_word: בַּמִּדְבָּר
  choice: papunta sa ilang
  rationale: Ang מִדְבָּר ay malawak at di-tinitirhang lupain, hindi kinakailangang mabuhanging disyerto; ang ‘ilang’ ay maikli at tradisyonal ngunit nauunawaan pa rin.
- source_word: וְנִזְבְּחָה
  choice: upang makapaghandog kami
  rationale: Sa sunod-sunod na cohortative, ang ikalawang kilos ay likas na nagpapahayag ng layunin ng paglalakbay. Iniiwasan ng ‘makapaghandog’ ang labis na teknikal na parirala habang malinaw ang paghahandog ng hain.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan na יהוה bilang ‘Yahweh’ ayon sa ibinigay na patakaran, sa halip na palitan ng titulong ‘PANGINOON.’
- source_word: פֶּן
  choice: Kung hindi, baka
  rationale: Likas na modernong Filipino na nagpapanatili sa babala at kinatatakutang maaaring mangyari na ipinahahayag ng פֶּן.
- source_word: יִפְגָּעֵנוּ
  choice: hampasin niya kami
  rationale: Sa kontekstong may salot at tabak, ipinahahayag ng פגע ang mapaminsalang pagsapit o paglusob. Ang ‘hampasin’ ay malinaw na naghahatid ng kaparusahang pagdalaw nang hindi dinaragdagan ang paraan nito.
- source_word: בַּדֶּבֶר
  choice: ng salot
  rationale: Ang ‘salot’ ay karaniwan at madaling maunawaang katumbas ng דֶּבֶר bilang epidemikong kapahamakan.
- source_word: בֶחָרֶב
  choice: ng tabak
  rationale: Pinananatili ang konkretong larawan ng חֶרֶב at ang pagkakapantay nito sa ‘salot’ bilang mga paraan ng kapahamakan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong ‘Yahweh’ sa halip na palitan ng isang titulo.
- issue: Paksa ng יִפְגָּעֵנוּ
  choice: ‘niya,’ na tumutukoy kay Yahweh na aming Diyos
  alternative: di-tiyak na pagdating ng salot o tabak
  rationale: Ang pinakamalapit at gramatikal na paksa ay ang Diyos na kababanggit lamang. Pinananatili nito ang tensiyon ng teksto na maaaring parusahan ng Diyos ang mga hindi tutugon sa kaniyang pakikipagtagpo.
- issue: Ugnayan ng paglalakbay at paghahandog
  choice: 'layunin: ‘upang makapaghandog kami’'
  alternative: 'magkakasunod na pakiusap: ‘at maghandog kami’'
  rationale: Bagaman cohortative rin ang וְנִזְבְּחָה, sa konteksto ay natural itong gumaganap bilang layunin ng hinihiling na paglalakbay. Hindi nito binabago ang mismong kilos ng paghahandog.
translation_notes:
  register: Modernong Filipino na may marangal na himig. Ginamit ang ‘mga Hebreo,’ ‘Yahweh,’ ‘ilang,’ ‘salot,’ at ‘tabak’ upang panatilihin ang mga pangunahing katawagan at larawan ng tekstong Hebreo. Ang magalang na pakiusap sa Paraon ay ginawang natural sa Filipino nang hindi pinahihina ang diin nito.
