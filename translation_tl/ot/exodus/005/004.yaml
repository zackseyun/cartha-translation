  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: tl
  text: Ngunit sinabi sa kanila ng hari ng Ehipto, “Moises at Aaron, bakit ninyo inililihis ang bayan mula sa kanilang gawain?[a] Pumunta kayo sa inyong mga pasanin.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bakit ninyo ginagambala ang bayan at inililihis mula sa kanilang paggawa?”
    reason: lexical_alternative
  - marker: b
    text: O “Pumunta kayo sa inyong sapilitang paggawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; ang “Ngunit” ay likas na naghahayag ng pagsalungat ng hari sa kahilingan sa naunang talata.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: ang hari ng Ehipto
  rationale: Tuwirang salin ng construct phrase at natural sa modernong Tagalog.
- source_word: לָמָּה
  choice: bakit
  rationale: Payak at natural na katumbas ng tuwirang pananong.
- source_word: תַּפְרִיעוּ
  choice: inilalayo ninyo
  rationale: 'Ipinahahayag ang causative na diwa ng Hiphil: pinatitigil o inililihis nina Moises at Aaron ang bayan mula sa itinakdang gawain. Hindi nito ipinapalagay ang positibong diwa ng pagpapalaya.'
- source_word: הָעָם
  choice: ang bayan
  rationale: Pinananatili ang malawak at kolektibong katawagan ng Hebreo, sa halip na paliitin ito sa “mga manggagawa.”
- source_word: מִמַּעֲשָׂיו
  choice: sa kanilang gawain
  rationale: Ang panlalaping isahan ay tumutukoy sa kolektibong “bayan”; ang maramihang panghalip ang natural na anyo sa Tagalog.
- source_word: לְכוּ
  choice: Bumalik kayo
  rationale: Sa konteksto, ang utos na “humayo” ay nangangahulugang magbalik sila sa kanilang ipinapataw na trabaho; malinaw at natural ito sa Tagalog.
- source_word: לְסִבְלֹתֵיכֶם
  choice: sa inyong mga pasanin
  rationale: Pinananatili ang konkretong talinghaga at mapaniil na himig ng סבלות, habang inilalagay sa talababa ang mas tahasang kontekstuwal na kahulugan.
