translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong הָעָם at “mga pasanin” upang mapanatili ang larawan ng mabigat at mapaniil na paggawa.
