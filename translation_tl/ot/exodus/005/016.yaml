base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: tl
  text: Hindi binibigyan ng dayami ang iyong mga lingkod, ngunit sinasabi nila sa amin, ‘Gumawa kayo ng mga ladrilyo!’ At tingnan mo, binubugbog ang iyong mga lingkod, ngunit ang sarili mong bayan ang may kasalanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, sa mas literal na salin, “at nagkasala ang iyong bayan.” Siksik at maaaring unawain sa iba’t ibang paraan ang sugnay sa Hebreo; sa konteksto, malamang na ang ibig sabihin ay nasa mga tauhan ng Faraon ang pananagutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: dayami
  rationale: Karaniwang tawag sa materyal na ginagamit sa paggawa ng ladrilyo; natural at malinaw sa modernong Tagalog.
- source_word: אֵין נִתָּן
  choice: Hindi binibigyan
  rationale: Ipinahahayag ng negatibong anyong pasibo na hindi sila tinutustusan ng dayami; malinaw at idiomatiko sa Tagalog.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Ang mga kapatas na Israelita ay magalang na nakikipag-usap sa Faraon. Pinananatili ng “mga lingkod” ang kanilang mababang kalagayan at ang magalang na pananalita nang hindi labis na nililinaw bilang pag-aari.
- source_word: לְבֵנִים
  choice: mga ladrilyo
  rationale: Tuwirang tumutukoy sa mga produktong ipinagagawa sa kanila; karaniwang salita sa Tagalog para sa bricks.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: sinasabi nila sa amin, ‘Gumawa kayo ng mga ladrilyo!’
  rationale: Pinananatili ang tuwirang utos at inuulit ang “mga ladrilyo” mula sa naunang parirala upang maging likas at malinaw sa Tagalog.
- source_word: וְהִנֵּה
  choice: At tingnan mo
  rationale: Nananatili ang mariing panawagan sa Faraon na pansinin ang hayag na kawalang-katarungan, gamit ang natural na modernong Tagalog.
- source_word: מֻכִּים
  choice: binubugbog
  rationale: Ipinahahayag ang patuloy at marahas na pananakit na dinaranas ng mga lingkod sa konteksto.
- source_word: וְחָטָאת עַמֶּךָ
  choice: ngunit ang sarili mong bayan ang may kasalanan
  rationale: 'Kinakatawan nito ang malamang na diwa ng siksik at mahirap na sugnay: nasa mga tauhan o bayan ng Faraon ang pananagutan. Inilalantad sa talababa ang mas pormal na pagbasa.'
theological_decisions:
- issue: Ang kahulugan ng siksik na sugnay na וְחָטָאת עַמֶּךָ
  choice: ngunit ang sarili mong bayan ang may kasalanan
  alternative: at nagkasala ang iyong bayan
  rationale: Hindi ito pangunahing usaping doktrinal kundi tekstuwal at sintaktiko. Pinili sa teksto ang kahulugang pinakamalinaw sa daloy ng reklamo, habang pinananatili sa talababa ang mas literal na posibilidad upang hindi maitago ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tingnan mo” upang ihatid ang mariing puwersa ng וְהִנֵּה nang hindi gumagamit ng makaluma o di-likas na pananalita. Ang pananalitang “iyong mga lingkod” ay nagpapanatili sa magalang na pagharap sa Faraon.
