  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: tl
  text: Mag-aalab ang galit ko, at papatayin ko kayo sa pamamagitan ng tabak. Magiging mga biyuda ang inyong mga asawa, at magiging mga ulila sa ama[a] ang inyong mga anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga ulila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: Mag-aalab ang galit ko
  rationale: Ang חרה kasama ng אַף ay isang idyoma para sa matinding pagliyab ng galit. Pinananatili ng “mag-aalab” ang metapora sa natural at marangal na Tagalog.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: papatayin ko kayo
  rationale: Ang הרג ay karaniwang pandiwang nangangahulugang pumatay; tuwiran at makabago ang “papatayin,” nang walang arkaikong himig.
- source_word: בֶּחָרֶב
  choice: sa pamamagitan ng tabak
  rationale: Ang בְּ ay nagpapahayag ng kasangkapan o paraan. Malinaw na pinananatili ng salin ang kongkretong larawan ng tabak bilang instrumento ng hatol.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: Magiging mga biyuda ang inyong mga asawa
  rationale: Ipinahihiwatig ng היה rito ang kalagayang ibubunga ng pagpatay; ang נָשִׁים sa kontekstong pampamilya ay tumutukoy sa mga asawa.
- source_word: וּבְנֵיכֶם
  choice: ang inyong mga anak na lalaki
  rationale: Tiyak na panlalaki ang בנים, kaya hindi ito ginawang pangkalahatang “mga anak.”
- source_word: יְתֹמִים
  choice: mga ulila sa ama
  rationale: Sa kontekstong legal at panlipunan, ang יָתוֹם ay maaaring tumukoy nang partikular sa nawalan ng ama. Ang pariralang ito ay malinaw na nag-uugnay sa kalagayan ng mga anak sa pagkamatay ng kanilang mga ama.
theological_decisions:
- issue: Antropomorpikong idyoma para sa galit ng Diyos
  choice: Mag-aalab ang galit ko
  alternative: Mag-aalab ang aking poot; literal na “iinit ang aking ilong”
  rationale: Iniiwasan ang literal na katawagang bahagi ng katawan na magiging malabo sa Tagalog, ngunit pinananatili ang metapora ng nag-aalab na galit at ang bigat ng banal na paghatol.
- issue: Tiyak na kasarian ng filial na katawagan
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tiyak na panlalaki ang salitang Hebreo at hindi hinihingi ng konteksto na gawing neutral ang salin.
- issue: Saklaw ng יָתוֹם
  choice: mga ulila sa ama
  alternative: mga ulila
  rationale: Pinipili ang mas tiyak na kalagayang likas na ibubunga ng pagkamatay ng mga lalaking kinakausap, habang kinikilala sa talababa ang mas malawak na karaniwang salin.
translation_notes:
  register: Makabagong Filipino na tuwiran, marangal, at madaling maunawaan. Pinanatili ang matinding wika ng hatol at ang metapora ng nag-aalab na galit, habang iniwasan ang arkaiko o labis na teknikal na pananalita.
