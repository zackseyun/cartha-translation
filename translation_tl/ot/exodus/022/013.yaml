base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: tl
  text: At kung may taong humiram sa kapwa niya, at ito ay napinsala[a] o namatay, kung wala roon ang may-ari nito, tiyak na magbabayad siya nang buo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “nabali” o “nasira.” Maaaring tumukoy ang Hebreo sa pagkasira ng hiniram na bagay o sa pagkasugat ng hiniram na hayop.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “tiyak na magbabayad”; ibig sabihin, kailangan niyang magbayad nang buo bilang kabayaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: At kung
  rationale: Ipinapanatili ang pang-ugnay na וְ at ang kondisyong ipinakikilala ng כִי sa loob ng kalipunan ng mga batas.
- source_word: יִשְׁאַל
  choice: humiram
  rationale: Sa kontekstong legal, tumutukoy ito sa paghiram, hindi lamang sa paghingi o pagtatanong.
- source_word: אִישׁ
  choice: may taong
  rationale: Ang panlalaking isahan ay ginagamit bilang karaniwang tauhan sa batas; natural sa modernong Tagalog ang “may taong” nang hindi binabago ang saklaw ng probisyon.
- source_word: מֵעִם רֵעֵהוּ
  choice: sa kapwa niya
  rationale: Ang רֵעַ ay maaaring kaibigan, kasama, o kapwa; sa batas ng pamayanan, malinaw at likas ang “kapwa niya.”
- source_word: וְנִשְׁבַּר
  choice: napinsala
  rationale: Literal itong “nabali/nasira,” ngunit maaari itong tumukoy sa pagkasira ng bagay o pagkasugat ng hayop; nasasaklaw ng “napinsala” ang dalawa.
- source_word: אוֹ מֵת
  choice: o namatay
  rationale: Pinananatili ang tuwirang kundisyon ng pagkamatay, na higit na nagpapahiwatig na hayop ang maaaring tinutukoy.
- source_word: בְּעָלָיו
  choice: ang may-ari
  rationale: Bagaman anyong maramihan sa Hebreo, idyomatiko itong tumutukoy sa iisang may-ari sa talatang ito.
- source_word: אֵין עִמּוֹ
  choice: hindi nito kasama
  rationale: 'Pinananatili ang posibilidad na ang hulaping panghalip ay tumutukoy sa hiniram na bagay o hayop: wala roon ang may-ari kasama nito.'
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: tiyak na magbabayad siya nang buo
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa tiyak at ganap na pananagutang magbayad.
