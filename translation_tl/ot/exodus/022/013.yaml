  register: Makabago, malinaw, at marangal na Tagalog para sa isang probisyong legal. Ginamit ang “napinsala” upang mapanatili ang saklaw sa bagay at hayop, at ang mga talababa upang ilahad ang literal na anyo at diin ng Hebreo.
