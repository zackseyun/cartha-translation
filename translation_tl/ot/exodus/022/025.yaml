  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: tl
  text: Kung kukunin mong sangla ang balabal[a] ng iyong kapwa, ibalik mo ito sa kanya bago lumubog ang araw.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “balabal” ay panlabas na kasuotang maaari ring gamiting pantakip sa gabi. Maaari ring isalin na “damit” o “panlabas na damit.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “hanggang sa pagdating ng araw,” isang pahayag na tumutukoy sa paglubog ng araw.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang nagpapahayag ng kondisyong karaniwan sa mga batas na naglalahad ng isang kaso; maaari rin sanang unawaing “kapag,” ngunit pinananatili ng “kung” ang anyong kondisyonal.
- source_word: חָבֹל תַּחְבֹּל
  choice: kukunin mong panagot sa utang
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa pagkuha bilang sangla o garantiya. Natural at malinaw sa modernong Filipino ang “panagot sa utang,” at hindi nito ipinahihiwatig na permanenteng kinukuha ang bagay.
- source_word: שַׂלְמַת
  choice: balabal
  rationale: Tumutukoy sa panlabas na kasuotang maaari ring magsilbing pantakip sa gabi; mas tiyak ang “balabal” kaysa sa pangkalahatang “damit.”
- source_word: רֵעֶךָ
  choice: ng kapwa mo
  rationale: Ang “kapwa” ay natural at malawak na katumbas sa kontekstong panlipunan at legal, nang hindi nililimitahan sa taong nakatira sa malapit.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: bago lumubog ang araw
  rationale: Ang literal na “hanggang sa pagdating ng araw” ay isang idyomang tumutukoy sa paglubog ng araw; ipinahahayag ng salin ang praktikal na takdang oras.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: ibalik mo iyon sa kanya
  rationale: 'Malinaw at natural na ipinapahayag ang causative na diwa ng Hiphil ng שוב: ipabalik o isauli ang bagay sa may-ari.'
