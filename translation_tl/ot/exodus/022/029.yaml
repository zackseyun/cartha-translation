base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: tl
  text: 'Gayon din ang gagawin mo sa iyong baka at sa iyong kawan: mananatili itong kasama ng ina nito nang pitong araw[a]; sa ikawalong araw ay ibibigay mo ito sa akin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ito ay kasama ng ina nito.” Literal sa Hebreo ang “ito ay kasama ng ina nito”; ipinahahayag ng “mananatili” ang diwang nagpapatuloy sa kontekstong ito.
    reason: lexical_alternative
  - marker: b
    text: Ipinagpapatuloy ng utos ang naunang konteksto tungkol sa paghahandog ng mga panganay; hindi inuulit dito sa Hebreo ang salitang “panganay.”
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: Gayon din ang gagawin mo
  rationale: Ipinahahayag ang paghahambing sa naunang utos at pinananatili ang puwersa ng legal na tagubilin.
- source_word: לְשֹׁרְךָ
  choice: sa iyong baka
  rationale: Ang לְ ay tumutukoy sa hayop na saklaw ng tuntunin; ang “baka” ay likas at hindi labis na nagtatakda ng kasarian.
- source_word: לְצֹאנֶךָ
  choice: sa iyong kawan
  rationale: Ang צֹאן ay kolektibong katawagan sa maliliit na alagang hayop, lalo na sa mga tupa at kambing; pinananatili ng “kawan” ang kolektibong diwa.
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: pitong araw itong mananatili sa piling ng ina nito
  rationale: Ang literal na “makakasama ng ina nito” ay may diwang duratibo sa konteksto; malinaw itong naihahayag ng “mananatili sa piling.”
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: sa ikawalong araw
  rationale: Karaniwan at likas na salin ng pariralang temporal.
- source_word: תִּתְּנוֹ לִי
  choice: ibibigay mo ito sa akin
  rationale: Tuwirang pinananatili ang pandiwang נתן, ang layon, at ang tumatanggap nang hindi dinaragdagan ng ritwal na paliwanag.
theological_decisions:
- issue: Ang tinutukoy na hayop kaugnay ng utos tungkol sa panganay
  choice: Hindi idinagdag ang salitang “panganay” sa pangunahing teksto; ipinaliwanag sa talababa na ipinagpapatuloy ng talata ang naunang konteksto.
  alternative: Idagdag sa teksto ang “panganay” upang maging tahasang malinaw ang tinutukoy.
  rationale: Hindi inuulit ng Hebreo ang “panganay” sa talatang ito bagaman dala ito ng konteksto. Iniiwasan ng salin ang pagdaragdag sa teksto habang pinananatiling malinaw ang ugnayan sa pamamagitan ng talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “baka” bilang malawak na tawag sa hayop na βοειδές sa legal na konteksto at “kawan” para sa kolektibong צֹאן. Ang mga pangungusap ay tuwiran at angkop sa wikang kautusan.
