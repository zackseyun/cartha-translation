  to: Kung kasama nito ang may-ari, hindi siya magbabayad ng kabayaran. Kung inuupahan ito, kasama na sa upa ang pananagutang iyon.[a]
  rationale: Inayos ang dalawang di-likas na parirala upang maging malinaw at makabagong Filipino ang legal na diwa. Pinanatili ang pangunahing pagbasa na inuupahang ari-arian ang tinutukoy, at itinago sa talababa ang tunay na posibleng pagbasa na upahang manggagawa ang tinutukoy. Hindi pinipilit ng salin ang higit na katiyakan kaysa sa terse at pinagtatalunang Hebreo.
