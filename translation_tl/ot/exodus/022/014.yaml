  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: tl
  text: Kung kasama nito ang may-ari, hindi siya magbabayad ng kabayaran. Kung inuupahan ito, kasama na sa upa ang pananagutang iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari rin: “Kung siya ay upahang manggagawa, kasama iyon sa kanyang upa.” Maikli at hindi ganap na tiyak ang Hebreo: maaaring tumukoy ito sa inuupahang hayop o bagay, o sa isang upahang manggagawa. Dahil tungkol sa pananagutan sa hiniram na ari-arian ang konteksto, ang pangunahing teksto ay tumutukoy sa inuupahang hayop o bagay.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: ang may-ari
  rationale: Sa kontekstong legal, ang בַּעַל ay tumutukoy sa nagmamay-ari ng hayop o bagay; natural at tiyak sa modernong Filipino ang “may-ari.”
- source_word: עִמּוֹ
  choice: kasama nito
  rationale: Ang hulaping panlalaking isahan ay maaaring tumukoy sa hayop o bagay na pinag-uusapan. Pinananatili ng “kasama nito” ang diwang naroon o kasabay ng ari-arian ang may-ari.
- source_word: לֹא יְשַׁלֵּם
  choice: hindi siya magbabayad-pinsala
  rationale: Sa batas na konteksto, ang piel ng שׁלם ay pagbabayad bilang kabayaran sa nawala o nasira; malinaw at likas sa Filipino ang “magbabayad-pinsala.”
- source_word: שָׂכִיר
  choice: inuupahan ito
  rationale: Bagaman karaniwang maaaring mangahulugang upahang manggagawa ang שָׂכִיר, sa agarang konteksto ng pananagutan sa hiniram na ari-arian, makatuwirang unawain itong eliptikong tumutukoy sa hayop o bagay na inuupahan.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: saklaw na iyon ng upa
  rationale: Napakaikli at idyomatiko ng Hebreo. Ipinahahayag ng salin ang malamang na legal na diwa na ang kaugnay na panganib o pananagutan ay kasama na sa kasunduan sa pag-upa, sa halip na gumamit ng di-likas na literal na “dumating para sa upa nito.”
theological_decisions:
- issue: Kung ang ikalawang sugnay ay tumutukoy sa inuupahang bagay o sa upahang manggagawa
  choice: 'Pangunahing teksto: ang hayop o bagay ay inuupahan'
  alternative: “Kung upahang manggagawa siya, napasok iyon sa kanyang upa.”
  rationale: Pinapaboran ng agarang konteksto ng batas tungkol sa hiniram o inuupahang ari-arian ang pagbasa na ang paksa ay ang bagay o hayop. Gayunman, tunay na posible sa leksikon at balarila ang personal na pagbasa, kaya itinatala ito sa talababa nang hindi nagpapanggap na tiyak ang teksto.
translation_notes:
  register: Makabago ngunit marangal na wikang legal ang ginamit. Ang “magbabayad-pinsala” ay mas tiyak kaysa simpleng “magbabayad,” at ang “saklaw na iyon ng upa” ay natural na Filipino para sa maikli at eliptikong huling parirala. Inilagay ang marker na [a] sa mismong pangungusap na may pinagtatalunang pagbasa.
