    issue: Hindi likas at kulang sa linaw ang “hindi siya magbabayad-pinsala.”
    rationale: Bagaman mauunawaan, hindi karaniwang pandiwa sa modernong Filipino ang “magbabayad-pinsala.” Ang “hindi siya magbabayad ng kabayaran” ay mas natural at tuwirang naghahayag ng legal na diwa ng לֹא יְשַׁלֵּם.
  - severity: medium
    issue: Malabo at di-likas ang “saklaw na iyon ng upa.”
    rationale: Hindi malinaw kung ano ang tinutukoy ng “iyon,” at ang ayos ay hindi natural. Ang “kasama na sa upa ang pananagutang iyon” ay malinaw na naghahayag ng legal na implikasyon ng terse na בָּא בִּשְׂכָרוֹ nang hindi nagdadagdag ng bagong pangyayari.
  - severity: low
    issue: Hindi likas ang salitang “napasok” sa alternatibong salin sa talababa.
    rationale: Ang “kasama iyon sa kanyang upa” ay mas idiomatiko sa Filipino at pinananatili ang alternatibong pag-unawa na upahang manggagawa ang שָׂכִיר.
  revised_text: Kung kasama nito ang may-ari, hindi siya magbabayad ng kabayaran. Kung inuupahan ito, kasama na sa upa ang pananagutang iyon.[a]
