base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: tl
  text: Kung magpapautang ka ng pera sa aking bayan—sa dukhang kasama mo—huwag mo siyang gipitin sa paniningil ng utang; huwag mo siyang patungan ng interes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang kahulugan nito ang kondisyunal na “kung.” Sa ganitong batas, maaari rin itong mangahulugang “kapag,” kaya inilalahad ang alternatibo sa talababa.
- source_word: כֶּסֶף
  choice: pera
  rationale: Literal itong “pilak,” ngunit sa kontekstong pang-ekonomiya ay tumutukoy sa salaping ipinauutang.
- source_word: תַּלְוֶה
  choice: magpapautang
  rationale: Ang Hiphil ng לוה ay nangangahulugang magpahiram o magpautang; natural sa Filipino ang “magpapautang” dahil pera ang tuwirang layon.
- source_word: עַמִּי
  choice: sa sinuman sa aking bayan
  rationale: Pinananatili ang “aking bayan,” habang ipinahihiwatig ng kasunod na pariralang tumutukoy ito sa isang kasapi ng bayan na dukha.
- source_word: הֶעָנִי
  choice: sa dukha
  rationale: Ang substantibong pang-uri ay tumutukoy sa isang taong mahirap. Ang “dukha” ay maikli, dignified, at hindi nangangailangang magdagdag ng salitang “lalaki,” na wala bilang hiwalay na pangngalan sa Hebreo.
- source_word: עִמָּךְ
  choice: kasama mo
  rationale: Malapit ito sa literal na “nasa piling mo/kasama mo” at tumutukoy sa dukhang kabilang sa pamayanan.
- source_word: כְּנֹשֶׁה
  choice: parang maniningil ng utang
  rationale: Ang participle ay tumutukoy sa nagpapaigting o naniningil ng pagkakautang. Mas malinaw sa karaniwang Filipino ang pariralang ito kaysa sa teknikal na “kreditor.”
- source_word: תְשִׂימוּן ... נֶשֶׁךְ
  choice: patungan ng interes
  rationale: Ang literal na “maglagay ... ng interes sa kaniya” ay natural na ipinahahayag sa Filipino bilang “patungan ng interes.”
theological_decisions:
- issue: Lakas ng אִם sa batas na kasuistiko
  choice: Kung magpapautang
  alternative: Kapag nagpapautang
  rationale: Pinananatili ng “kung” ang pormal na anyong kondisyunal ng Hebreo, habang kinikilala sa talababa na maaari itong gumana bilang “kapag” sa ganitong uri ng batas.
- issue: Kasarian ng tinutukoy sa הֶעָנִי
  choice: dukha
  alternative: dukhang lalaki
  rationale: Masculine singular ang anyong Hebreo, ngunit walang hiwalay na salitang “lalaki.” Ang “dukha” sa Filipino ay maaaring tumukoy sa isang indibidwal nang hindi nagdaragdag ng impormasyong hindi tahasang nasa teksto.
- issue: Saklaw ng pagbabawal sa נֶשֶׁךְ
  choice: interes
  alternative: labis na tubo
  rationale: Ang נֶשֶׁךְ dito ay interes na ipinapataw sa pautang sa dukha, hindi lamang sobrang taas na interes. Kaya hindi nililimitahan ang pagbabawal sa “labis” na tubo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “bayan” para sa covenant people at “maniningil ng utang” sa halip na teknikal na “kreditor.” Ang gitling-haba ay tumutulong ipakita na ang “dukhang kasama mo” ang partikular na tinutukoy sa “aking bayan.”
