  to: Kung magpapautang ka ng pera sa aking bayan—sa dukhang kasama mo—huwag mo siyang gipitin sa paniningil ng utang; huwag mo siyang patungan ng interes.
  rationale: Inalis ang “sinuman,” na hindi ipinahahayag ng pinagmulan, at pinalitan ang paglalarawan sa creditor ng “gipitin sa paniningil ng utang,” na natural sa Filipino at mas malinaw na naghahatid ng pagbabawal laban sa mapilit na paniningil. Idinagdag ang talababa para sa literal na “pilak,” alinsunod sa lexical audit trail. Napanatili ang ambiguity ng “Kung/Kapag” at hindi pinalawak ang saklaw ng “interes.”
