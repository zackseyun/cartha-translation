translation:
  language: tl
  text: Ngunit kung talagang napunit ito ng mabangis na hayop,[a] ihaharap niya ito bilang katibayan; hindi siya magbabayad para sa pinunit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ngunit kung talagang napunit ito, ihaharap niya ang pinunit na hayop bilang katibayan; hindi siya magbabayad para rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Ngunit kung
  rationale: Nagpapakilala ito ng kasunod at naiibang kondisyon sa serye ng mga batas; likas sa Tagalog ang “Ngunit kung” para sa ganitong paghahambing.
- source_word: טָרֹף יִטָּרֵף
  choice: nilapa nga ito ng mabangis na hayop
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa pangyayari, na ipinahihiwatig ng “nga.” Karaniwang tumutukoy ang ugat dito sa paglapang ginawa ng hayop; nililinaw iyon nang hindi inaalis ang pangunahing larawan ng tekstong Hebreo.
- source_word: יְבִאֵהוּ
  choice: dadalhin niya iyon
  rationale: Ang Hiphil ng בוא ay nangangahulugang dalhin o iharap. Ang “iyon” ay maaaring tumukoy sa nilapang hayop o sa mga labi nito, kaya hindi ito higit na tinukoy.
- source_word: עֵד
  choice: bilang katibayan
  rationale: Bagaman literal na “saksi” o “patotoo,” ang gamit nito rito ay legal at tumutukoy sa bagay na inihaharap bilang ebidensiya; natural at malinaw ang “bilang katibayan.”
- source_word: הַטְּרֵפָה
  choice: ang nilapa
  rationale: Pinananatili nito ang maikli at bahagyang di-tiyak na pagtukoy ng Hebreo sa hayop o sa mga labíng nilapa.
- source_word: לֹא יְשַׁלֵּם
  choice: hindi niya babayaran
  rationale: Sa kontekstong legal, tumutukoy ang Piel ng שלם sa pagbabayad bilang kabayaran. Ang “hindi niya babayaran” ay malinaw at natural sa modernong Tagalog.
