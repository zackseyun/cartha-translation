translation_notes:
  register: Makabagong Filipino Tagalog na may marangal at malinaw na estilong legal. Ginamit ang “nilapa” upang katawanin ang marahas na pagpunit o pagkain ng mabangis na hayop, habang pinananatili sa talababa ang mas literal na alternatibo.
