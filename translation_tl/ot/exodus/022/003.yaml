  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: tl
  text: Kung ang ninakaw—baka man, asno, o tupa—ay talagang matagpuang buhay pa at nasa kanyang pag-iingat,[a] magbabayad siya nang doble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “kung ang ninakaw ay talagang matagpuan sa kanyang kamay.” Gumagamit ang Hebreo ng mariing anyo ng pandiwa, at ang “sa kanyang kamay” ay idyoma para sa pagiging nasa kanyang pag-iingat o kontrol.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang panandang kondisyon na angkop sa isang probisyon ng batas.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: ay talagang matagpuan
  rationale: Ang infinitive absolute na kasunod ng pandiwang Niphal ay nagbibigay-diin sa pagkakatagpo; natural na naihahatid ito ng “talagang” sa modernong Tagalog.
- source_word: בְיָדוֹ
  choice: sa kanya
  rationale: Literal itong “sa kanyang kamay,” ngunit idyoma ito para sa pag-aari, paghawak, o kontrol. Malinaw at natural sa kontekstong legal ang “sa kanya.”
- source_word: הַגְּנֵבָה
  choice: ang ninakaw
  rationale: Tumutukoy ito sa bagay o hayop na ninakaw, hindi sa mismong gawa ng pagnanakaw.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: baka man, asno, o tupa
  rationale: Inililista ng Hebreo ang mga uri ng hayop na maaaring saklawin ng probisyon; ang “man … o” ay natural na nagpapahayag ng saklaw na ito sa Tagalog.
- source_word: חַיִּים
  choice: buhay pa
  rationale: Ipinahihiwatig na natagpuan ang ninakaw na hayop na buhay, sa halip na napatay o naipagbili na; natural sa Tagalog ang “buhay pa.”
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: magbabayad siya ng doble
  rationale: Legal na pormula ito para sa pagbabayad ng dalawang ulit ng halaga; malinaw at tuwiran ang “magbabayad … ng doble.”
