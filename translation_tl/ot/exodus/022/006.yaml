translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na angkop sa tekstong legal. Ginamit ang “kapwa” at “isang tao” bilang natural na pangkalahatang pananalita, habang pinanatili ang kondisyunal at passive na balangkas ng Hebreo.
