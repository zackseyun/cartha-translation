  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: tl
  text: Kung magbigay ang isang tao sa kanyang kapwa ng salapi[a] o mga kagamitan[b] para ingatan, at ninakaw ang mga ito mula sa bahay ng taong iyon, kung matagpuan ang magnanakaw, magbabayad siya nang doble.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pilak”; ginagamit dito sa diwang salapi.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga bagay” o “mga gamit.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “magbabayad siya ng dalawa”; isang idyomang nangangahulugang magbayad ng dalawang ulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Sa konteksto ng kasong legal, ipinakikilala nito ang kondisyon o sitwasyong saklaw ng batas.
- source_word: יִתֵּן אִישׁ
  choice: may isang taong magbigay
  rationale: Likas sa modernong Tagalog ang pangkalahatang “isang tao” para sa kinatawang panlalaking anyo ng Hebreo, nang hindi nililimitahan ang aplikasyon ng batas.
- source_word: אֶל רֵעֵהוּ
  choice: sa kanyang kapwa
  rationale: Ang רֵעַ sa kontekstong legal ay tumutukoy sa kapwa miyembro ng pamayanan; mas angkop at mas malawak ang “kapwa” kaysa “kaibigan.”
- source_word: כֶּסֶף
  choice: salapi
  rationale: Literal itong “pilak,” ngunit sa kontekstong pangkabuhayan ay tumutukoy sa perang ipinagkakatiwala.
- source_word: אוֹ כֵלִים
  choice: o mga kagamitan
  rationale: Malawak ang כֵלִים at maaaring tumukoy sa sari-saring gamit o ari-arian; pinananatili ng “mga kagamitan” ang lawak nito nang hindi nililimitahan sa mga sisidlan.
- source_word: לִשְׁמֹר
  choice: para ipag-ingat
  rationale: Ipinahihiwatig ng infinitive ang layuning ipagkatiwala ang ari-arian sa pangangalaga ng kapwa.
- source_word: וְגֻנַּב
  choice: at ninakaw ang mga iyon
  rationale: Passive ang pandiwa at tumutukoy sa ipinagkatiwalang salapi o mga kagamitan bilang kabuuan.
- source_word: מִבֵּית הָאִישׁ
  choice: mula sa bahay ng taong iyon
  rationale: Ang tinutukoy ay ang bahay ng taong pinag-ingatan; nililinaw ito ng “taong iyon” nang hindi nagdaragdag ng interpretasyon.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: kung matagpuan ang magnanakaw
  rationale: Pinananatili ng “matagpuan” ang passive na anyo at literal na diwa ng מצא; ang “mahuli” ay mas interpretatibo.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: magbabayad siya nang doble
  rationale: Ang idyoma ay nangangahulugang magbayad o magsauli ng dalawang ulit ng halaga; malinaw at natural ito sa modernong Tagalog.
