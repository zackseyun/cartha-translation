base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: tl
  text: Kung akitin ng isang lalaki ang isang dalagang birhen na hindi pa naipagkasundo sa pag-aasawa, at makipagtalik siya rito, dapat niyang bayaran ang halagang pangkasal[a] para sa kanya upang maging asawa niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ang mohar—halagang ibinabayad ng lalaki o ng pamilya niya kaugnay ng kasal. Hindi ito “dote,” na karaniwang tumutukoy sa ari-ariang dinadala ng babae sa kasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: hikayatin
  rationale: Ang Piel ng פתה ay tumutukoy sa panghihikayat o panunukso sa kontekstong seksuwal. Hindi nito likas na ipinahihiwatig ang puwersa; pinananatili ng “hikayatin” ang lawak at bahagyang kalabuan ng salita nang hindi ipinapalagay ang tahasang pamimilit.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tiyak na panlalaki at isahan ang Hebreo, kaya ang “isang lalaki” ang tuwirang katumbas.
- source_word: בְּתוּלָה
  choice: isang dalagang birhen
  rationale: Sa kontekstong legal at pangkasal, tumutukoy ang בְּתוּלָה sa babaeng birhen. Ang “dalagang birhen” ay natural sa modernong Filipino at malinaw ang katayuang mahalaga sa batas.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: na hindi pa naipagkasundong pakasalan
  rationale: Ang anyong pasibo ay nagsasaad na hindi pa siya pormal na naipangako o naitakda sa kasal. Mas malinaw ito sa karaniwang mambabasa kaysa sa teknikal na “katipan,” at hindi ito basta modernong impormal na engagement.
- source_word: וְשָׁכַב עִמָּהּ
  choice: at sipingan niya ito
  rationale: Ang שׁכב na may עִם ay idyoma para sa pakikipagtalik. Ang “sipingan” ay maikli, marangal, at karaniwang biblikal na Filipino nang hindi malabo sa konteksto.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: dapat niyang bayaran ang halaga para sa pag-aasawa
  rationale: Pinatitindi ng infinitive absolute at imperfect ang obligasyon. Ang ugat מהר dito ay tumutukoy sa mohar, halagang ibinabayad kaugnay ng pag-aasawa; ang paliwanag sa talababa ay umiiwas sa maling diwa ng “dote,” na karaniwang ari-ariang mula sa panig ng babae.
- source_word: לּוֹ לְאִשָּׁה
  choice: upang maging asawa niya ang dalaga
  rationale: Ipinahahayag ng parirala ang inaasahang legal na bunga ng pagbabayad. Inuulit ang “dalaga” upang maging malinaw ang tinutukoy sa natural na Filipino.
theological_decisions:
- issue: Kalikasan ng gawaing seksuwal na inilalarawan ng פתה
  choice: panghihikayat na humahantong sa pakikipagtalik, nang walang tahasang pahayag ng puwersa
  alternative: panggagahasa o sapilitang paglapastangan
  rationale: Ang פתה sa Piel ay karaniwang nangangahulugang manghikayat o manukso. Hindi idinaragdag ng salin ang puwersang hindi tahasang nasa talata, ngunit hindi rin nito ginagawang teknikal na pahayag ng ganap at malayang pagsang-ayon ang teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “hikayatin” upang mapanatili ang leksikal na lawak ng פתה, “naipagkasundong pakasalan” para sa pormal na katayuan ng betrothal, at “sipingan” bilang maikli at dignified na idyoma. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang ipinaliliwanag nito.
