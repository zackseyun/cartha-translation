translation:
  language: tl
  text: Ngunit kung talagang manakaw iyon mula sa kaniya[a], dapat niyang bayaran ang may-ari nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “nakawin” upang magbigay-diin: “kung talagang manakaw mula sa kaniya,” ibig sabihin, habang nasa pangangalaga niya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikilala nito ang isang kondisyong kasalungat ng naunang kaso; likas sa modernong Tagalog ang “Ngunit kung.”
- source_word: גָּנֹב יִגָּנֵב
  choice: talagang manakaw iyon
  rationale: Ang infinitive absolute na sinusundan ng pandiwang may iisang ugat ay nagbibigay-diin sa pagnanakaw. Naipahahayag ng “talagang” ang diin, habang ang “iyon” ay tumutukoy sa bagay o hayop na ipinagkatiwala sa naunang konteksto.
- source_word: מֵעִמּוֹ
  choice: mula sa kaniya
  rationale: Tuwirang salin ito ng diwang “mula sa piling niya”; sa kontekstong legal, ipinahihiwatig na ninakaw iyon habang nasa pangangalaga niya.
- source_word: יְשַׁלֵּם
  choice: dapat niyang bayaran
  rationale: Sa kontekstong legal, ang Piel ng שלם ay tumutukoy sa pagbabayad bilang kabayaran o pagsasauli. Ang “dapat” ay naghahayag ng obligasyong legal nang hindi ginagawang mabigat ang pangungusap.
- source_word: לִבְעָלָיו
  choice: ang may-ari nito
  rationale: Ang בעל ay nangangahulugang may-ari o panginoon; “may-ari” ang angkop sa ari-ariang ipinagkatiwala sa kontekstong ito.
