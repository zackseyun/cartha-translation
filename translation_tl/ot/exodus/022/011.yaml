  terminology: Ang “may-ari” ay angkop para sa בעל sa konteksto ng ari-ariang ipinagkatiwala. Ang “dapat” ay wastong naghahayag ng legal na obligasyon ng imperfect sa batas-kaso. Ang talababa ay malinaw at tama sa paglalarawan ng pampadiing pag-uulit ng ugat na pandiwa.
