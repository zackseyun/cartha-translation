base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: tl
  text: Kung papanginain ng isang tao ang isang bukid o ubasan[a], at pakakawalan niya ang kanyang hayop upang manginain ito sa bukid ng iba[b], magbabayad siya ng pinakamainam mula sa sarili niyang bukid at ng pinakamainam mula sa sarili niyang ubasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kung sunugin ng isang tao ang isang bukid o ubasan.” Sa ilang konteksto, ang pandiwang Hebreo na בער ay maaaring tumukoy sa pagsunog, ngunit ang kasunod na pagbanggit sa pagpapakawala ng hayop ay matibay na sumusuporta sa diwang pagpapanginain o pagkonsumo ng hayop.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa ibang bukid”; ipinahihiwatig ng kontekstong legal na ang bukid ay pag-aari ng ibang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kung
  rationale: Sa batas na naglalahad ng isang kaso, ipinapakilala ng כִּי ang kundisyon; natural sa modernong Tagalog ang “Kung.”
- source_word: יַבְעֶר
  choice: ipapanginain
  rationale: Ang Hiphil ng בער ay may diwang sanhi. Dahil kasunod ang pagpapakawala sa hayop, ang konteksto ay pagkonsumo sa pamamagitan ng panginginain, hindi pagsunog.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: bukid o ubasan
  rationale: Tuwirang katumbas ng mga terminong pang-agrikultura at pinananatili ang isahang anyo ng kasong legal.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: at pakakawalan niya ang kanyang hayop
  rationale: Ipinahahayag ng שִׁלַּח ang pagpapalaya o pagpapakawala, at ang בְּעִיר ay isang alagang hayop na maaaring manginain. Malinaw at natural ang parirala sa kasalukuyang Tagalog.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: upang manginain sa bukid ng iba
  rationale: Ang inuulit na בער ay tumutukoy sa pagkain o pagkonsumo ng hayop. Ang “bukid ng iba” ay natural na nagpapahayag sa Tagalog ng legal na diwang pag-aari ng ibang tao.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: mula sa pinakamainam na ani ng sarili niyang bukid at ubasan
  rationale: Ang מֵיטַב ay tumutukoy sa pinakamabuti o piling bahagi. Ginawang tahasan ang “ani” bilang likas na bagay na ibinabayad mula sa bukid at ubasan, habang ang “sarili niyang” ay nililinaw na mula sa ari-arian ng nakapinsala ang kabayaran.
- source_word: יְשַׁלֵּם
  choice: magbabayad siya
  rationale: Ang Piel ng שׁלם sa batas na ito ay tumutukoy sa pagbabayad bilang kabayaran sa pinsala. Simple at malinaw sa modernong Tagalog ang “magbabayad.”
