  terminology: Ang “bukid,” “ubasan,” “hayop,” at “magbabayad” ay angkop. Pinanatili ang leksikal na posibilidad na “sunugin” sa talababa, habang ang pangunahing salin ay wastong kumakapit sa konteksto ng hayop na nanginginain.
