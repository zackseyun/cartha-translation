  source_fidelity: 'Kailangang itama ang pagdaragdag ng “kanyang” sa unang “bukid o ubasan,” sapagkat walang pantukoy na pagmamay-ari sa bahaging ito ng Hebreo. Ang “ani” ay isa ring di-nasa-tekstong paglilinaw: ang מֵיטַב ay “pinakamainam/pinili,” na tuwirang iniuugnay sa bukid at ubasan, hindi tahasang sa ani. Ang binagong teksto ay pinananatili ang sanhi na diwa ng בער at ang hayop na nakapanginain sa bukid ng iba.'
