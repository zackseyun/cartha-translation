  naturalness: Hindi natural ang “ang mamamagitan sa kanilang dalawa,” dahil ang panunumpa ay hindi tagapamagitan. Mas malinaw at likas ang “ay gagawin sa pagitan nilang dalawa” sa kontekstong legal.
  terminology: Ang “Yahweh,” “may-ari,” at “magbabayad-pinsala” ay angkop. Ang “pinakialaman” ay sapat na malawak para sa idyomang “iniunat/ipinadala ang kamay” sa ari-arian ng kapwa.
