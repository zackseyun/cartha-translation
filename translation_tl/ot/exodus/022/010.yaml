source:
  edition: WLC
  text: שְׁבֻעַ֣ת יְהוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵי/הֶ֔ם אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֣אכֶת רֵעֵ֑/הוּ וְ/לָקַ֥ח בְּעָלָ֖י/ו וְ/לֹ֥א יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: tl
  text: Isang panunumpa sa pangalan ni Yahweh[a] ang gagawin sa pagitan nilang dalawa, na hindi niya pinakialaman ang pag-aari ng kanyang kapwa.[b] Tatanggapin ito ng may-ari,[c] at hindi magbabayad-pinsala ang pinagkatiwalaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “isang panunumpa ni Yahweh.” Sa konteksto, ito ay panunumpang pinagtitibay sa pangalan at awtoridad ni Yahweh.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebrew, “hindi niya iniunat ang kanyang kamay sa pag-aari ng kanyang kapwa”—isang idyoma para sa panghihimasok, maling paggamit, o pag-angkin sa pag-aari ng iba.
    reason: cultural_note
  - marker: c
    text: O “kukunin ito ng may-ari”; ipinahihiwatig na tatanggapin niya ang panunumpa bilang sapat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: isang panunumpa sa pangalan ni Yahweh
  rationale: Ang pariralang construct ay literal na “panunumpa ni Yahweh,” ngunit sa kontekstong legal ay tumutukoy sa panunumpang may banal na pagpapatibay o gumagamit sa pangalan ni Yahweh. Iniiwasan ng saling ito ang maling pahiwatig na si Yahweh mismo ang nanunumpa, habang pinananatili ang personal na pangalang יהוה.
- source_word: בֵּין שְׁנֵיהֶם
  choice: ang mamamagitan sa kanilang dalawa
  rationale: Malinaw na dalawang panig ang tinutukoy ng Hebrew; natural sa Filipino ang “sa kanilang dalawa” at napapanatili nito ang bilateral na kalagayang legal.
- source_word: אִם לֹא
  choice: hindi niya
  rationale: Sa pormula ng panunumpa, ipinakikilala nito ang nilalaman ng sinumpaan at hindi isang karaniwang kondisyong “kung hindi.”
- source_word: שָׁלַח יָדוֹ בִּמְלֶאכֶת רֵעֵהוּ
  choice: pinakialaman ang pag-aari ng kanyang kapwa
  rationale: Idyoma ito para sa di-awtorisadong paggamit, panghihimasok, o pag-angkin sa pag-aari ng iba. Ang “pinakialaman” ay natural at sapat na malawak, samantalang inilalagay sa talababa ang literal na larawan ng kamay.
- source_word: וְלָקַח בְּעָלָיו
  choice: Tatanggapin iyon ng may-ari
  rationale: Ang לָקַח ay karaniwang “kunin/tanggapin”; dito ang ipinahihiwatig na tatanggapin ay ang panunumpa bilang sapat na paglutas sa usapin. Pinananatili ng “iyon” ang di-tahasang layon ng Hebrew.
- source_word: יְשַׁלֵּם
  choice: magbabayad-pinsala
  rationale: Sa batas ng tipan, ang Piel ng שׁלם ay tumutukoy sa pagbabayad bilang kabayaran o restitution, hindi lamang sa karaniwang pagbabayad ng utang.
theological_decisions:
- issue: Kung paano ilalarawan ang ugnayan ng panunumpa kay יהוה
  choice: panunumpa sa pangalan ni Yahweh
  alternative: panunumpa ni Yahweh / panunumpa sa harap ni Yahweh
  rationale: Ang anyong Hebrew ay siksik at maaaring ilarawan nang literal bilang “panunumpa ni Yahweh.” Sa konteksto, hindi si Yahweh ang nanunumpa; ang pangalan at awtoridad niya ang nagbibigay-bisa sa panunumpa. Ang talababa ay nagpapanatili sa literal na anyo at sa posibleng pagkakaibang semantiko.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “kapwa” para sa legal na רֵעַ at “magbabayad-pinsala” para sa diwang restitution. Ang tutuldok ay malinaw na nagpapakilala sa nilalaman ng panunumpa nang hindi ginagawang kondisyong pangungusap ang אִם לֹא.
