base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: tl
  text: Sa bawat usapin ng paglabag tungkol sa baka, asno, tupa[a], damit, o anumang nawawalang bagay, na sinasabi ng isang tao, “Ito iyon,” ihaharap sa Diyos[b] ang usapin ng dalawang panig. Ang sinumang ipahayag ng Diyos na may sala ay magbabayad ng doble sa kanyang kapwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay mas malawak at maaaring tumukoy sa tupa o kambing.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa mga hukom” o “sa hukuman.” Ang Hebreong אֱלֹהִים ay maaaring tumukoy mismo sa Diyos o, sa legal na konteksto, sa mga hukom na kumikilos sa ilalim ng awtoridad ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: usapin ng paglabag
  rationale: Sa kontekstong legal, ang דָּבָר ay isang usapin o kaso, at ang פֶּשַׁע ay paglabag o maling ginawa. Pinananatili ng parirala ang legal na diwa nang hindi labis na tinutukoy ang uri ng kasalanan.
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay tumutukoy sa isang hayop na baka sa konteksto ng ari-arian. Mas natural at malawak na mauunawaan ang “baka” kaysa sa mga katawagang tumutukoy sa tiyak na kasarian o gamit nito.
- source_word: חֲמוֹר
  choice: asno
  rationale: Ang “asno” ang malinaw at karaniwang modernong katawagan sa hayop na tinutukoy ng חֲמוֹר.
- source_word: שֶׂה
  choice: tupa
  rationale: Ginamit ang “tupa” bilang natural na kinatawang salin, habang nililinaw sa talababa na maaaring tumukoy ang Hebreo sa tupa o kambing.
- source_word: שַׂלְמָה
  choice: damit
  rationale: Pangkalahatang kasuutan ang tinutukoy; ang “damit” ay natural at hindi nagpapakitid sa kahulugan tungo lamang sa balabal.
- source_word: אֲבֵדָה
  choice: anumang bagay na nawala
  rationale: Pinananatili nito ang malawak na saklaw ng nawawalang pag-aari at malapit ito sa anyo ng Hebreo.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: na sinasabi ng isang tao, “Ito iyon,”
  rationale: Ipinahihiwatig ng sugnay ang pagkilala o pag-angkin sa pinagtatalunang bagay. Pinananatili ng “Ito iyon” ang maikli at bahagyang di-tiyak na pahayag ng Hebreo.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Diyos
  rationale: Ang payak na leksikal na kahulugan ay “Diyos,” bagaman sa legal na konteksto ay maaari rin itong unawain bilang mga hukom o hukuman. Pinanatili sa pangunahing teksto ang “Diyos” at inilagay sa talababa ang alternatibo.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: ang usapin ng dalawang panig ay ihaharap
  rationale: Natural na ipinapahayag ng “dalawang panig” ang dalawang taong sangkot sa alitan, at ng “ihaharap” ang pagdadala ng kaso sa awtoridad na hahatol.
- source_word: יַרְשִׁיעֻן
  choice: ipahayag ... na may sala
  rationale: Ang Hiphil ng רשע ay nangangahulugang magpahayag o humatol na may sala sa isang legal na usapin.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: magbabayad ng doble
  rationale: Tumpak at madaling maunawaang ipinapahayag nito ang dobleng kabayaran o pagsasauli.
- source_word: לְרֵעֵהוּ
  choice: sa kapwa niya
  rationale: Ang רֵעַ ay kapwa, kasamahan, o kapitbahay; sa kontekstong ito, ito ang kabilang taong sangkot sa usapin. Pinananatili ng “kapwa niya” ang malawak na kahulugan ng salita.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa legal na kontekstong ito
  choice: Diyos
  alternative: mga hukom / hukuman
  rationale: 'Literal na tumutukoy ang anyong Hebreo sa Diyos, ngunit matagal na ring kinikilalang maaari itong tumukoy sa mga taong hukom na gumaganap sa ilalim ng awtoridad ng Diyos. Hindi nilutas nang tahimik ang tunay na kalabuan: “Diyos” ang nasa pangunahing teksto at nasa talababa ang legal-institusyonal na pagbasa.'
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng karaniwang bokabularyo at bahagyang legal na himig na angkop sa batas ng tipan. Itinama ang pagkakalagay ng mga pananda ng talababa upang ang [a] ay tumukoy sa שֶׂה (“tupa”) at ang [b] sa אֱלֹהִים (“Diyos”).
