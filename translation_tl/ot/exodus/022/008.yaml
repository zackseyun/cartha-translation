revisions:
- from: Sa bawat usapin ng paglabag tungkol sa baka, asno, tupa[a], damit, o anumang bagay na nawala na sinasabi ng isang tao, “Ito iyon,” ang usapin ng dalawang panig ay ihaharap sa Diyos[b]. Ang sinumang ipahayag ng Diyos na may sala ay magbabayad ng doble sa kapwa niya.
  to: Sa bawat usapin ng paglabag tungkol sa baka, asno, tupa[a], damit, o anumang nawawalang bagay, na sinasabi ng isang tao, “Ito iyon,” ihaharap sa Diyos[b] ang usapin ng dalawang panig. Ang sinumang ipahayag ng Diyos na may sala ay magbabayad ng doble sa kanyang kapwa.
  rationale: Inayos ang ayos ng pangungusap upang maging malinaw at natural sa Filipino ang saklaw ng sugnay na “na sinasabi ng isang tao, ‘Ito iyon,’” nang hindi dinaragdagan ang kahulugan ng tekstong Hebreo. Pinanatili ang pangunahing pagbasa na “Diyos” at ang talababa para sa alternatibong pagbasa na tumutukoy sa mga hukom o hukuman.
