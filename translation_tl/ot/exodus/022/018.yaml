  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: tl
  text: Ang sinumang sumiping sa isang hayop ay tiyak na papatayin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “tiyak na mamamatay.” Tahasang ipinahahayag ng Hebreong pormulang legal ang tiyak na kamatayan bilang parusang ipinapataw ng hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: Ang sinumang sumiping
  rationale: Ang כָּל na sinusundan ng participle ay bumubuo ng pangkalahatang pahayag na likas isalin bilang “ang sinumang.” Ang שׁכב na may עִם ay isang karaniwang eupemismong seksuwal; pinananatili ng “sumiping” ang marangal at di-klinikal na himig ng Hebreo.
- source_word: עִם
  choice: sa
  rationale: Sa Filipino, ang pandiwang “sumiping” ay likas na kumukuha ng layon sa pamamagitan ng “sa,” bagaman literal na “kasama/with” ang Hebreo.
- source_word: בְּהֵמָה
  choice: isang hayop
  rationale: Malawak ang kahulugan ng בְּהֵמָה bilang hayop o malaking hayop; malinaw at hindi lipas sa modernong Filipino ang “isang hayop.”
- source_word: מוֹת יוּמָת
  choice: ay tiyak na papatayin
  rationale: Ang infinitive absolute na מוֹת kasama ng pasibong יוּמָת ay nagbibigay-diin sa katiyakan ng parusang kamatayan. Ipinahahayag ng “tiyak na papatayin” kapwa ang diin at ang pasibo, hudisyal na diwa.
theological_decisions:
- issue: Pagpapahayag sa legal na pormula ng parusang kamatayan
  choice: tiyak na papatayin
  alternative: tiyak na mamamatay
  rationale: Maaaring tumbasan nang mas literal ang pormula bilang “tiyak na mamamatay,” ngunit sa kontekstong legal, mas malinaw na pinananatili ng “tiyak na papatayin” ang pasibo at hudisyal na puwersa ng יוּמָת nang hindi nagdaragdag ng denominasyonal na interpretasyon.
translation_notes:
  register: Modernong Filipino na maikli, marangal, at madaling maunawaan. Ginamit ang “sumiping” upang mapanatili ang eupemismong seksuwal ng orihinal nang hindi nagiging bulgar o labis na klinikal.
