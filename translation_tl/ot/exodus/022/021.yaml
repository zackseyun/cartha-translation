  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: tl
  text: Huwag ninyong pahirapan ang sinumang biyuda o ulila.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “batang walang ama” sa halip na “ulila.”
    reason: lexical_alternative
  - marker: b
    text: O “apihin” o “pagmalupitan” sa halip na “pahirapan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: sinumang
  rationale: 'Sa pagbabawal na may mga pangngalang isahan, distributibo ang diwa: walang biyuda o ulila ang maaaring pahirapan. Natural sa modernong Tagalog ang “sinumang” para sa mga tao.'
- source_word: אַלְמָנָה
  choice: biyuda
  rationale: Karaniwan at tuwirang salin ito ng salitang Hebreo para sa babaeng namatayan ng asawa.
- source_word: יָתוֹם
  choice: ulila
  rationale: Natural at malawak na salitang Tagalog ito para sa orphan; maaaring partikular na tumukoy ang Hebreo sa batang walang ama, kaya inilagay ang alternatibo sa talababa.
- source_word: לֹא
  choice: huwag
  rationale: Ang לֹא na may di-ganap na pandiwa ay nagpapahayag dito ng tuwirang pagbabawal.
- source_word: תְעַנּוּן
  choice: pahirapan
  rationale: Sa Piel, tumutukoy ito sa pagdudulot ng hirap, pagdurusa, o malupit na pagtrato. Pinananatili ng “pahirapan” ang lawak at bigat ng kahulugan nang hindi ito nililimitahan sa isang uri lamang ng pang-aapi.
