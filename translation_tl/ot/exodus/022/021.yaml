translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang maramihang “ninyong” dahil maramihan ang pandiwang Hebreo, at ang “sinumang” upang maipakita ang distributibo at komprehensibong puwersa ng כָּל.
