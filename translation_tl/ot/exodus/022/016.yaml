  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: tl
  text: Kung talagang tumanggi ang ama niya na ibigay siya sa lalaki[b], kailangan niyang magtimbang ng pilak[a] na katumbas ng bayad-pangkasal para sa mga birhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “magtimbang ng pilak.” Noong panahong iyon, ang pilak na pambayad ay sinusukat ayon sa timbang sa halip na bilangin bilang mga baryang may takdang halaga.
    reason: cultural_note
  - marker: b
    text: O, “na ibigay siya sa kanya bilang asawa.” Ang idyomang Hebreo na “ibigay siya sa lalaki” ay tumutukoy sa pagsang-ayon ng ama sa pag-aasawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Karaniwang panandang kondisyon na angkop sa anyo ng batas na naglalahad ng isang posibleng kaso.
- source_word: מָאֵן יְמָאֵן
  choice: talagang tumanggi
  rationale: Ipinahihiwatig ng infinitive absolute na kasunod ng pandiwa ang matinding o tiyak na pagtanggi; natural itong naipapahayag sa modernong Tagalog sa pamamagitan ng “talagang.”
- source_word: אָבִיהָ
  choice: ang ama niya
  rationale: Tuwirang ipinapahayag ang pangngalan at ikatlong panauhang pambabaeng hulapi ng Hebreo.
- source_word: לְתִתָּהּ לוֹ
  choice: na ibigay siya sa lalaki
  rationale: Pinananatili ang literal na idyomang “ibigay siya sa kanya,” ngunit ginamit ang “sa lalaki” upang maging malinaw ang tinutukoy sa Tagalog; sa konteksto, ang pagbibigay ay pahintulot sa pag-aasawa.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Pinananatili ang kongkretong kahulugan ng Hebreo sa halip na gawing pangkalahatang “salapi.”
- source_word: יִשְׁקֹל
  choice: dapat magtimbang
  rationale: Ang pandiwa ay literal na “magtimbang” at sumasalamin sa pagbabayad sa pamamagitan ng pilak na sinusukat ayon sa timbang; ipinapahayag ng “dapat” ang legal na obligasyon.
- source_word: כְּמֹהַר
  choice: na katumbas ng bayad-pangkasal
  rationale: Ang מֹהַר ay halagang kaugnay ng pag-aasawa na ibinabayad ng lalaki sa pamilya ng babae; malinaw at maikli ang “bayad-pangkasal” sa modernong Tagalog.
- source_word: הַבְּתוּלֹת
  choice: para sa mga dalaga
  rationale: Tumutukoy ang maramihang anyo na may pantukoy sa pangkalahatang uri ng mga babaeng hindi pa nakikipagtalik; sa kontekstong legal at pangkasal, natural ang “mga dalaga.”
