  naturalness: Natural at pormal ang kabuuang Tagalog. Mas malinaw at mas maayos ang "kailangan niyang magtimbang" kaysa sa pag-ulit ng "ang lalaki," at "sa kanya" ay mas direkta kaysa "rito" sa talababa.
  terminology: Ang "bayad-pangkasal" ay katanggap-tanggap para sa מֹהַר. Mas tumpak ang "mga birhen" para sa הַבְּתוּלֹת kaysa "mga dalaga," sapagkat ang huli ay maaaring tumukoy lamang sa kabataang babae at hindi tiyak na pinananatili ang semantikong katangian ng Hebreo.
