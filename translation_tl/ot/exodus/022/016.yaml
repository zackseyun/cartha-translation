translation_notes:
  register: Gumamit ng dignificado ngunit pangkaraniwang modernong Tagalog. Pinanatili ang diin ng Hebreo sa pagtanggi, ang kongkretong “pilak,” at ang sinaunang gawi ng pagtitimbang nito. Ang “bayad-pangkasal” ay mas madaling maunawaan kaysa sa teknikal o posibleng malabong “bigay-kaya.”
