translation:
  language: tl
  text: Huwag mong pagmalupitan ni apihin ang isang dayuhan[a], sapagkat kayo ay mga dayuhan sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dayuhang naninirahan.” Ang Hebreong גֵר ay tumutukoy sa isang hindi katutubong taong naninirahan sa gitna ng Israel, hindi lamang sa isang nagdaraang estranghero.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: dayuhan / mga dayuhan
  rationale: Tumutukoy ito sa taong hindi katutubo ngunit naninirahan sa gitna ng Israel, hindi lamang sa isang nagdaraan. Pinananatili rin ng salin ang pag-uulit ng salitang Hebreo sa dalawang sugnay.
- source_word: תוֹנֶה
  choice: pagmamalupitan
  rationale: Ipinahihiwatig ng pandiwa ang di-makatarungan o masamang pakikitungo. Ang “pagmamalupitan” ay malinaw at sapat na malawak nang hindi ito nililimitahan sa pagsasamantalang pangkabuhayan.
- source_word: תִלְחָצֶנּוּ
  choice: aapihin
  rationale: Ang לחץ ay nagpapahayag ng panggigipit o paniniil. Ang “aapihin” ay natural at mabigat na katumbas sa kontekstong legal.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos at pinananatili ang marangal na himig ng paliwanag.
- source_word: הֱיִיתֶם
  choice: naging ... kayo
  rationale: Inilalarawan nito ang dating kalagayan ng Israel sa Ehipto; natural sa Filipino ang “naging mga dayuhan kayo.”
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang tahasang “lupain” sa Hebreo nang hindi nagiging di-natural sa Filipino.
theological_decisions:
- issue: Isahang panlalaking anyo bilang pangkalahatang tuntunin
  choice: Panatilihin ang isahang “isang dayuhan,” ngunit walang panlalaking panghalip dahil hindi ito kailangan sa Filipino.
  alternative: 'Gawing maramihan ang utos: “mga dayuhan ... sila.”'
  rationale: Isahan at panlalaki sa balarila ang גֵר at ang hulaping 3ms, ngunit pangkalahatan ang gamit nito sa batas. Naipapakita ng “isang dayuhan” ang bilang ng orihinal; hindi naman likas o kinakailangan sa Filipino ang pagdaragdag ng panghalip na “siya” sa dalawang pandiwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang anyong pambatas na “Huwag mong,” at pinanatili ang pag-uulit ng “dayuhan” na mahalaga sa pangangatwiran ng talata.
