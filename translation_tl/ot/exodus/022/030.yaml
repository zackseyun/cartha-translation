base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: tl
  text: At kayo ay magiging mga lalaking banal para sa akin.[a] Huwag kayong kakain ng lamang napunit sa parang;[b] itapon ninyo iyon sa mga aso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga lalaking banal.” Maaaring kumatawan ang parirala sa buong sambayanan ng tipan, ngunit tahasang panlalaki ang anyo sa pinagmulang teksto.
    reason: lexical_alternative
  - marker: b
    text: O “lamang pinunit ng mababangis na hayop sa parang.” “Lamang … napunit” lamang ang tahasang sinasabi ng Hebreo; ipinahihiwatig ngunit hindi tinutukoy ang lumapa rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: mga lalaking banal
  rationale: Tuwirang pinananatili nito ang konstruktong Hebreo na literal na “mga lalaki ng kabanalan” at ang tahasang panlalaking anyo, habang gumagamit ng likas na pariralang Tagalog.
- source_word: תִּהְיוּן לִי
  choice: kayo ay magiging ... para sa akin
  rationale: Pinananatili nito ang katayuan at pananagutang tipan na ipinahahayag ng imperfect ng היה kasama ng לִי, pati ang kaugnayang nakatuon sa Diyos.
- source_word: בָשָׂר
  choice: laman
  rationale: Ang “laman” ang tuwirang katumbas at pinananatili ang kongkretong larawan ng laman ng hayop.
- source_word: בַּשָּׂדֶה
  choice: sa parang
  rationale: Ang “parang” ay natural na modernong Tagalog para sa bukas na lupain o field sa kontekstong ito.
- source_word: טְרֵפָה
  choice: nilapa
  rationale: Ipinahahayag ng salita ang laman ng hayop na napunit o nilapa, karaniwang bilang nasila ng mabangis na hayop. Hindi tinutukoy sa pangunahing teksto kung sino ang lumapa.
- source_word: לֹא תֹאכֵלוּ
  choice: Huwag kayong kakain
  rationale: Natural at malinaw itong paraan sa Tagalog ng pagpapahayag ng legal na pagbabawal.
- source_word: לַכֶּלֶב
  choice: sa mga aso
  rationale: Bagaman isahan ang anyong Hebreo, panlahat ang gamit nito; natural sa Tagalog ang maramihang “mga aso” sa ganitong pahayag.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: itapon ninyo iyon
  rationale: Malinaw at kasalukuyang Tagalog ito para sa utos na ihagis o itapon ang laman.
theological_decisions:
- issue: Wika ng kabanalan sa batas ng tipan
  choice: mga lalaking banal para sa akin
  alternative: mga taong banal para sa akin
  rationale: Pinananatili ng “banal” ang bigat ng קֹדֶשׁ at ng pagiging ukol sa Diyos. Pinananatili rin ng “mga lalaki” ang tahasang panlalaking anyo ng Hebreo, habang ipinapaliwanag sa talababa na maaaring kumatawan ang pananalita sa sambayanan ng tipan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Huwag kayong kakain” bilang natural na legal na pagbabawal at “itapon” sa halip na mas makalumang “ihagis,” habang pinananatili ang konkretong wika at pagkakasunod ng Hebreo.
