  text: אִם לֹ֤א יִמָּצֵא֙ הַ/גַּנָּ֔ב וְ/נִקְרַ֥ב בַּֽעַל הַ/בַּ֖יִת אֶל הָֽ/אֱלֹהִ֑ים אִם לֹ֥א שָׁלַ֛ח יָד֖/וֹ בִּ/מְלֶ֥אכֶת רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: tl
  text: Kung hindi matagpuan ang magnanakaw, ang may-ari ng bahay ay lalapit sa Diyos[a] upang alamin kung hindi niya pinakialaman ang ari-arian ng kanyang kapwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa mga hukom.” Ang Hebreo ay “sa Diyos,” ngunit sa ilang legal na konteksto maaari itong tumukoy sa mga hukom na kumikilos sa ilalim ng awtoridad ng Diyos.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: matagpuan ang magnanakaw
  rationale: Tuwirang ipinapahayag ang pasibong diwa ng Niphal at hindi nililimitahan kung ang magnanakaw ay nakilala lamang o nahuli.
- source_word: וְנִקְרַב
  choice: ay lalapit
  rationale: Pinananatili ang posibleng intransitibong diwang “lalapit” ng Niphal; hindi tinutukoy ang ahensiya na para bang sapilitang dinala ang may-ari.
- source_word: בַּעַל הַבַּיִת
  choice: ang may-ari ng bahay
  rationale: Likas at malinaw na makabagong legal na pananalita para sa taong may pananagutan o pagmamay-ari sa bahay.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Ito ang tuwirang leksikal na kahulugan ng Hebreo. Ang posibleng kahulugang mga hukom sa legal na konteksto ay inilagay sa talababa upang mapanatili ang tunay na kalabuan.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: kung pinakialaman niya
  rationale: Ang literal na “iniunat/ipinatong ang kanyang kamay” ay isang idyoma para sa maling pagkuha o paggamit. Ang “pinakialaman” ay natural sa Filipino at mas malawak kaysa “ninakaw,” kaya hindi nito labis na nililimitahan ang saklaw.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: ang ari-arian ng kanyang kapwa
  rationale: Sa kontekstong legal ng ipinagkatiwalang salapi o mga kagamitan, tumutukoy ito sa pag-aari ng kapwa, hindi lamang sa trabaho o negosyo nito.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa legal na kontekstong ito
  choice: sa Diyos
  alternative: sa mga hukom
  rationale: Literal na “Diyos” ang Hebreo, ngunit maaari itong tumukoy sa mga hukom na kumikilos sa ilalim ng banal na awtoridad. Hindi tahimik na nilulutas ang kalabuan; nasa pangunahing teksto ang tuwirang kahulugan at nasa talababa ang alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinakialaman” bilang natural na katumbas ng Hebreong idyoma, habang iniwasan ang mas makitid na “ninakaw.”
