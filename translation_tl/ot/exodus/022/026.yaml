  source_fidelity: Tapat ang salin sa Hebreong teksto. Naipapahayag ng “iyon lamang ang kanyang pantakip” ang diwa ng kaniyang nag-iisang pantakip, at ng “balabal na tumatakip sa kanyang balat” ang kongkretong larawan ng panlabas na kasuotang nagsisilbing takip sa katawan. Napanatili rin ang retorikal na tanong, ang kondisyonal na pagdaing sa Diyos, at ang pangakong pakikinggan niya ito.
  naturalness: Makabago, malinaw, at marangal ang Tagalog. Ang “dumaing” at “diringgin” ay angkop sa legal at makataong bigat ng konteksto. Ang “Ano ang gagamitin niya sa paghiga?” ay likas na pagpapahayag ng retorikal na tanong tungkol sa kawalan niya ng pantakip sa pagtulog.
  terminology: Ang “balabal,” “pantakip,” at “mahabagin” ay angkop at magkakaugnay sa konteksto. Ang “mahabagin” ay isang wastong modernong salin ng חַנּוּן, at ang talababa ay maayos na nagbibigay ng mga lehitimong alternatibo nang hindi nagpapataw ng doktrinal na pagbasa.
