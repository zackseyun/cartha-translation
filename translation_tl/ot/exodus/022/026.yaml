base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: tl
  text: Sapagkat iyon lamang ang kanyang pantakip; iyon ang balabal na tumatakip sa kanyang balat. Ano ang gagamitin niya sa paghiga? At kapag dumaing siya sa akin, diringgin ko siya, sapagkat mahabagin[a] ako.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mapagbiyaya” o “maawain.”
    reason: Mga lehitimong alternatibong salin ng חַנּוּן.
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan ng naunang utos at likas na nagpapahayag ng paliwanag sa Tagalog.
- source_word: כְּסוּתוֹ לְבַדָּהּ
  choice: iyon lamang ang kanyang pantakip
  rationale: Pinagsama sa natural na Tagalog ang kahulugan ng כְּסוּת bilang pantakip o kasuotan at ng לְבַדָּהּ bilang nag-iisa o tanging mayroon siya.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: iyon ang balabal na tumatakip sa kanyang balat
  rationale: Ang שִׂמְלָה ay balabal o panlabas na kasuotan; pinanatili ng “balat” ang kongkretong larawan ng עוֹר habang nililinaw ang gamit ng balabal.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Ano ang gagamitin niya sa paghiga?
  rationale: Pinananatili ang retorikal na tanong at ang diwa ng instrumental na בַּמֶּה, habang gumagamit ng likas na pananalita sa Tagalog.
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Natural na ipinahahayag ang panghinaharap na kalagayan nang hindi ginagaya ang mabigat na estruktura ng Hebreo.
- source_word: יִצְעַק אֵלַי
  choice: dumaing siya sa akin
  rationale: Ang “dumaing” ay nagpapahayag ng paghingi ng saklolo mula sa paghihirap, na angkop sa lakas ng צעק.
- source_word: וְשָׁמַעְתִּי
  choice: diringgin ko siya
  rationale: Higit sa basta pagkarinig, likas na ipinahihiwatig ng “diringgin” ang pakikinig at pagtugon sa daing nang hindi tahasang dinaragdagan ang kilos na hindi sinabi sa talata.
- source_word: חַנּוּן
  choice: mahabagin
  rationale: Malinaw at pangkaraniwang Tagalog ito para sa mapagkalingang disposisyon ng Diyos sa taong naghihirap; nananatiling posible ang “mapagbiyaya” at “maawain.”
theological_decisions:
- issue: Paglalarawan ng Diyos sa salitang חַנּוּן
  choice: mahabagin
  alternative: mapagbiyaya; maawain
  rationale: Sa konteksto ng batas na nagtatanggol sa mahirap, malinaw na naipapakita ng “mahabagin” ang pagkalinga ng Diyos nang hindi nililimitahan ang malawak na kahulugan ng salitang Hebreo. Itinatala sa talababa ang iba pang lehitimong salin.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Pinanatili ang kongkretong larawan ng balabal at balat, gayundin ang retorikal na tanong at ang taimtim na pangako ng Diyos.
