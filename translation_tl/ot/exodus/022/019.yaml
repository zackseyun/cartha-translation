  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: tl
  text: Ang sinumang maghain sa isang diyos ay itatalaga sa pagkapuksa,[a] maliban kung kay Yahweh lamang siya maghain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ilalagay sa ilalim ng pagbabawal” o “lubusang pupuksain.” Ang pandiwang Hebreo ay nagpapahiwatig ng hindi na mababaling pagtatalaga sa pagkapuksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Ang sinumang maghandog
  rationale: Ang Qal participle ay ginagamit bilang pangngalan para sa sinumang gumagawa ng kilos; ang “maghandog” ay natural sa Filipino at pinananatili ang kontekstong pansamba ng paghahain.
- source_word: לָאֱלֹהִים
  choice: sa alinmang diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, tumutukoy ito rito sa anumang diyos na iba kay Yahweh; malinaw na naihahayag ng “alinmang diyos” ang pangkalahatan at distributibong diwa.
- source_word: יָחֳרָם
  choice: ay itatalaga sa pagkapuksa
  rationale: Ang Hophil ng חרם ay nagsasaad ng hindi na mababaling pagtatalaga sa ilalim ng pagbabawal, na humahantong sa paglipol; pinananatili ng salin ang kapuwa sagrado-legal at maparusang diwa.
- source_word: בִּלְתִּי
  choice: maliban
  rationale: Nagpapakilala ang בִּלְתִּי ng tanging eksepsiyon sa pagbabawal.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Tahasang isinasalin ang pangalang tipan na יהוה bilang “Yahweh”; natural sa Filipino ang “kay” kapag ang handog ay iniuukol sa isang persona.
- source_word: לְבַדּוֹ
  choice: lamang
  rationale: 'Ipinahahayag ng “lamang” ang eksklusibong diwa: kay Yahweh at wala nang iba maaaring maghandog.'
theological_decisions:
- issue: Ang kahulugan ng חרם bilang parusa sa paghahandog sa ibang diyos
  choice: itatalaga sa pagkapuksa
  alternative: lubusang pupuksain; ilalagay sa ilalim ng pagbabawal
  rationale: 'Higit ito sa payak na pagpatay: ipinahihiwatig ng pandiwa ang hindi na mababaling pagtatalaga sa ilalim ng banal na pagbabawal na humahantong sa pagkapuksa. Pinananatili ng salin ang tensiyon sa pagitan ng pagtatalaga at paglipol.'
- issue: Ang pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalang pantangi ang Tetragrammaton sa talata, kaya pinananatili itong “Yahweh” sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “maghandog” sa halip na mas teknikal na “maghain” upang maging natural, habang nananatiling malinaw ang kontekstong pansamba. Inilagay ang talababa pagkatapos mismo ng pariralang nililinaw nito.
