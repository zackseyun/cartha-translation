base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: tl
  text: Kung sumiklab ang apoy at kumapit sa mga tinik[a], at natupok ang bunton ng inaning butil, ang pananim na nakatayo pa, o ang bukid, ang nagsindi ng apoy ay dapat na lubusang magbayad-pinsala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at umabot sa mga tinik”; literal, “at natagpuan nito ang mga tinik.”
    reason: lexical_alternative
  - marker: b
    text: O “tiyak na magbayad.” Mariing ipinahahayag ng Hebreo ang obligasyon sa pamamagitan ng infinitive absolute na sinusundan ng pandiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Nagsisimula ito ng isang sitwasyon sa batas; natural sa modernong Filipino ang “kapag” para sa kasong ipinapalagay na maaaring mangyari.
- source_word: תֵצֵא אֵשׁ
  choice: may apoy na kumalat
  rationale: Ang literal na larawan ay apoy na “lumabas”; sa konteksto, tumutukoy ito sa apoy na kumawala o kumalat.
- source_word: וּמָצְאָה קֹצִים
  choice: at umabot sa mga tinik
  rationale: Pinananatili nito ang ideya ng literal na “natagpuan” ng apoy ang mga tinik nang hindi ipinapalagay nang higit sa teksto kung agad na nagliyab ang mga iyon.
- source_word: קֹצִים
  choice: mga tinik
  rationale: Tuwirang katumbas ito ng salitang Hebreo at pinananatili ang larawan, bagaman maaaring tumukoy sa matitinik na halaman o palumpong.
- source_word: וְנֶאֱכַל
  choice: natupok
  rationale: Karaniwan at malinaw na salitang Filipino para sa ganap na pagkasunog o paglamon ng apoy.
- source_word: גָּדִישׁ
  choice: nakasalansang na trigo
  rationale: Tumutukoy sa naaning butil na natipon o nakasalansan; ipinakikita nito ang kaibahan sa pananim na nakatayo pa.
- source_word: הַקָּמָה
  choice: nakatayong trigo
  rationale: Tumutukoy sa pananim na hindi pa naaani at nakatayo pa sa bukid.
- source_word: הַשָּׂדֶה
  choice: ang bukid
  rationale: Payak at tuwirang katumbas na nauunawaan ng karaniwang mambabasa.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: kailangang bayaran nang buo
  rationale: Ipinahahayag ng infinitive absolute na kasunod ng finite verb ang mariin at di-maiiwasang obligasyong magbayad-pinsala.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: ng nagsimula ng apoy
  rationale: Natural na Filipino para sa taong responsable sa pagsisindi o pagpapasimula ng apoy.
