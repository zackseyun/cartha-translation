revisions:
- from: Kapag may apoy na kumalat at umabot sa mga tinik[a], at natupok ang nakasalansang na trigo, ang nakatayong trigo, o ang bukid, kailangang bayaran nang buo ng nagsimula ng apoy ang pinsala.[b]
  to: Kung sumiklab ang apoy at kumapit sa mga tinik[a], at natupok ang bunton ng inaning butil, ang pananim na nakatayo pa, o ang bukid, ang nagsindi ng apoy ay dapat na lubusang magbayad-pinsala.[b]
  rationale: Inayos ang pagsasalin upang iwasan ang di-sinuportahang pagtukoy sa trigo, gawing mas tumpak ang paglalarawan sa pagsiklab at pagkapit ng apoy sa mga tinik, at gawing wasto ang talababa para sa literal at kontekstuwal na kahulugan. Napanatili ang legal na rehistro, ang tatlong maaaring matupok, at ang mariing pananagutan ng nagsindi ng apoy.
