translation_notes:
  register: Modernong Filipino na may dignidad at malinaw na himig-batas. Ginamit ang “trigo” bilang madaling maunawaang katawagan sa butil sa kontekstong agrikultural, at inilagay ang “ang pinsala” upang maging natural at malinaw sa Filipino ang layon ng pagbabayad.
