  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: tl
  text: Huwag mong alipustain ang Diyos[a], ni sumpain ang isang pinuno sa iyong bayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga hukom.” Sa ilang konteksto, ang אֱלֹהִים ay maaaring tumukoy sa mga awtoridad na tao, bagaman higit na angkop sa paralelismo rito ang “Diyos.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Bagaman maaaring tumukoy ang אֱלֹהִים sa mga diyos o, sa ilang konteksto, sa mga hukom, higit na angkop dito ang isahang pagtukoy sa Diyos at malinaw itong kaagapay ng pagbabawal na sumpain ang isang pinunong tao. Pinanatili sa talababa ang mahalagang alternatibong pagbasa.
- source_word: תְקַלֵּל
  choice: lapastanganin
  rationale: Ang Piel ng קלל ay maaaring mangahulugang sumpain, hamakin, o ituring nang walang paggalang. Ipinahahayag ng “lapastanganin” ang mapanghamak na pananalita o pagtrato habang hindi ito ipinapareho sa mas tuwirang pandiwang “sumpain” sa ikalawang sugnay.
- source_word: נָשִׂיא
  choice: isang pinuno
  rationale: Ang נָשִׂיא ay tumutukoy sa isang itinaas bilang lider o puno. Ang “pinuno” ay likas at makabagong salitang Filipino na hindi naglilimita sa kahulugan sa isang prinsipe o tiyak na uri ng opisyal.
- source_word: בְעַמְּךָ
  choice: sa iyong bayan
  rationale: Sa pariralang ito, ipinahihiwatig ng ב ang isang pinunong nasa loob o kabilang sa bayan. Ang “sa iyong bayan” ay maikli, natural, at pinananatili ang kaugnayang iyon.
- source_word: תָאֹר
  choice: sumpain
  rationale: Ang ארר ang karaniwang pandiwa para sa pagbigkas ng sumpa; “sumpain” ang malinaw at tuwirang katumbas sa Filipino.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים
  choice: Diyos
  alternative: mga hukom; mga diyos
  rationale: Ang legal na konteksto at paralelismo sa “isang pinuno sa iyong bayan” ay pumapabor sa pagtukoy sa Diyos, na inihahambing sa pinunong tao. Gayunman, dahil maaari ring tumukoy ang אֱלֹהִים sa mga awtoridad na tao sa ilang konteksto at may mahalagang kasaysayan ang pagbasa na “mga hukom,” hayagang pinanatili ito sa talababa sa halip na tahimik na lutasin ang ambiguwidad.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “lapastanganin” upang ipakita ang mapanghamak na diwa ng unang pandiwa at mapanatili ang pagkakaiba nito sa “sumpain” sa ikalawang sugnay. Ang “ni” ay natural na nag-uugnay sa dalawang magkatambal na pagbabawal.
