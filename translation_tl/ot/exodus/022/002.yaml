base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: tl
  text: Ngunit kung sumikat na ang araw sa kanya[a], may pananagutan sa pagdanak ng dugo ang pumatay sa kanya.[b] Dapat magbayad-pinsala nang buo ang magnanakaw. Kung wala siyang maibabayad, ipagbibili siya dahil sa kanyang pagnanakaw.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, sa mas interpretatibong salin, “kung nangyari ito matapos sumikat ang araw” o “kung ginawa ito sa liwanag ng araw.” Literal sa Hebreo: “kung sumikat na ang araw sa kanya.”'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sa ganitong kalagayan, ang pumatay sa magnanakaw ay mananagot sa pagdanak ng dugo.
    reason: clarification
  - marker: c
    text: Ang pagbebentang ito ay paraan upang mabayaran ang obligasyong dulot ng pagnanakaw kapag walang maibayad ang magnanakaw.
    reason: cultural_note
lexical_decisions:
- source_word: אִם זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: Ngunit kung sumikat na ang araw sa kanya
  rationale: Pinananatili ang kongkretong larawan at kondisyong nasa Hebreo, habang ipinahihiwatig ng “Ngunit” ang pagsalungat sa kaso sa naunang talata.
- source_word: דָּמִים לוֹ
  choice: may pananagutan sa pagdanak ng dugo ang pumatay sa kanya
  rationale: Ang דָּמִים sa kontekstong legal ay tumutukoy sa pananagutan dahil sa pagpatay. Nililinaw ng parirala kung sino ang may pananagutan nang hindi binabago ang legal na diwa.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: Dapat magbayad nang buo ang magnanakaw
  rationale: Ang infinitive absolute na kasunod ng imperfect ay nagbibigay-diin sa tiyak at ganap na obligasyong magbayad-pinsala. Ipinapakita ng tahasang “magnanakaw” ang paksa na implicit sa Hebreo at hinihingi ng konteksto.
- source_word: אִם אֵין לוֹ
  choice: Kung wala siyang maibabayad
  rationale: Likas na Tagalog para sa kawalan ng ari-arian o kakayahang tumupad sa obligasyong magbayad.
- source_word: וְנִמְכַּר בִּגְנֵבָתוֹ
  choice: ipagbibili siya dahil sa kanyang pagnanakaw
  rationale: Pinananatili ang passive na legal na kahihinatnan at ang pagnanakaw bilang dahilan ng pagbebenta upang matugunan ang pagkakautang.
theological_decisions:
- issue: Pananagutan sa pagpatay sa magnanakaw kapag sumikat na ang araw
  choice: Ang pumatay sa magnanakaw matapos sumikat ang araw ay may pananagutan sa pagdanak ng dugo.
  alternative: Maaaring unawain ang pagsikat ng araw nang mas maluwag bilang kalagayang malinaw na kung gaano kalaki ang banta, hindi lamang bilang eksaktong oras.
  rationale: Pinananatili sa pangunahing teksto ang kongkretong larawan ng pagsikat ng araw at ang legal na pananagutan, nang hindi ginagawang mas malawak na tuntuning etikal ang hindi tahasang sinasabi ng talata.
- issue: Pagkakakilanlan ng paksa sa utos na magbayad
  choice: Ang magnanakaw ang dapat magbayad nang buo.
  alternative: Maaaring mapagkamalang ang pumatay ang paksa kung susundan lamang ang pinakamalapit na antecedent sa salin.
  rationale: Sa daloy ng batas at sa kasunod na “kung wala siyang maibabayad” at “ipagbibili siya,” bumabalik ang paksa sa magnanakaw; tahasang pagtukoy rito ang pinakamalinaw na natural na Tagalog.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang literal na larawan ng araw na sumisikat, ngunit nilinaw ang nagbabagong paksa upang maiwasan ang maling pagkaunawa sa legal na tuntunin.
