  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: tl
  text: Kung mahuling nanloloob ang magnanakaw[a] at siya ay mahampas at mamatay, walang pananagutan sa pagdanak ng dugo ang humampas sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas pormal na salin: “Kung matagpuan ang magnanakaw sa isang panloloob.” Ang salitang Hebreo ay tumutukoy sa pagsira o palihim na pagpasok upang makapasok, marahil sa pamamagitan ng pagbutas sa pader.'
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, sa kasong ito, ang taong humampas sa magnanakaw ay walang legal na pananagutan sa pagdanak ng dugo dahil sa pagkamatay nito.
    reason: referent_clarification
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: nanloloob
  rationale: Ang pangngalan ay tumutukoy sa palihim na pagpasok o pagbutas upang makapasok. Ang pandiwang “nanloloob” ay natural sa modernong Filipino at malinaw na naghahatid ng sitwasyon ng pagnanakaw nang hindi ipinapalagay na literal na tunel ang ginamit.
- source_word: יִמָּצֵא
  choice: mahuling
  rationale: Ang Niphal ng מצא sa kondisyong legal ay nangangahulugang matagpuan o mahuli. Ang “mahuling” ay idiomatiko sa Filipino para sa taong nadatnan habang gumagawa ng krimen.
- source_word: הַגַּנָּב
  choice: ang magnanakaw
  rationale: Ito ang tuwiran at karaniwang katumbas ng גנב. Hindi kailangang palitan ng mas teknikal na katawagan sapagkat nililinaw na ng konteksto ang panloloob.
- source_word: וְהֻכָּה
  choice: siya’y hampasin
  rationale: Ang anyong passive ng נכה ay nagsasaad na siya ay sinaktan o hinampas. Pinananatili ng “hampasin” ang isang di-tiyak na paghampas at hindi ipinahihiwatig ang paulit-ulit na pambubugbog.
- source_word: וָמֵת
  choice: at mamatay
  rationale: Tapat itong nagpapanatili sa payak na pagkakasunod/resulta ng Hebreo. Hindi nito dinaragdagan ang teksto ng tiyak na layuning patayin.
- source_word: אֵין לוֹ דָּמִים
  choice: walang pananagutan sa pagdanak ng dugo ang humampas sa kanya
  rationale: Ang דמים ay isang legal na idyoma para sa pananagutan dahil sa pagdanak ng dugo. Nililinaw sa Filipino ang reperente ng panghalip—ang taong humampas—nang hindi ito ginagawang malawak na pagsang-ayon sa pagpatay.
theological_decisions:
- issue: Legal na idyoma tungkol sa pagkamatay ng magnanakaw habang nanloloob
  choice: “walang pananagutan sa pagdanak ng dugo”
  alternative: “hindi siya nagkasala ng pagpatay”
  rationale: Ang piniling salin ay nagpapanatili sa kategoryang legal ng Hebreong דמים at umiiwas sa pagpasok ng mas makitid na modernong kategorya ng krimeng pagpatay. Nililimitahan nito ang hatol sa sitwasyong inilalarawan ng talata.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nanloloob” para sa natural na paglalarawan ng legal na sitwasyon, habang pinanatili ang natatanging kategoryang “pananagutan sa pagdanak ng dugo.”
