  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: tl
  text: Kung talagang pahihirapan mo siya[a], sapagkat kung talagang dadaing siya sa akin[b], tiyak na diringgin ko ang kanyang daing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isahan ang mga panghalip sa Hebreo. Dito, ang “siya” ay tumutukoy sa sinumang balo o ulila na binanggit sa naunang talata.
    reason: cultural_note
  - marker: b
    text: Tatlong ulit na gumagamit ang Hebreo ng infinitive absolute na kasabay ng pandiwang may takdang anyo—sa “pahihirapan,” “dadaing,” at “diringgin”—upang idiin ang kilos at ang tiyak na pagtugon ng Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Kung
  rationale: Tuwirang nagpapakilala ng kondisyong sugnay at pinananatili ang kondisyonal na anyo ng Hebreo.
- source_word: עַנֵּה תְעַנֶּה
  choice: talagang pahihirapan
  rationale: Ang infinitive absolute na kasunod ng pandiwang may takdang anyo ay nagbibigay-diin sa kilos. Likas sa modernong Tagalog ang “talagang,” at ang “pahihirapan” ay angkop sa legal na konteksto ng masamang pagtrato sa mahina.
- source_word: אֹתוֹ
  choice: siya
  rationale: Isahan ang hulaping Hebreo. Walang kasariang gramatikal ang panghalip na “siya,” ngunit malinaw nitong napapanatili ang isahang pagtukoy sa sinumang balo o ulilang binanggit sa naunang talata.
- source_word: כִּי אִם
  choice: at kung
  rationale: Ipinagdurugtong nito ang susunod na kondisyonal na pangyayari, hindi isang pagsalungat; natural at malinaw sa Tagalog ang “at kung.”
- source_word: צָעֹק יִצְעַק
  choice: talagang dadaing siya
  rationale: Pinananatili ng “talagang” ang diin ng inuulit na anyong pandiwa, samantalang ang “dadaing” ay natural na salita para sa paghingi ng tulong dahil sa pagdurusa.
- source_word: אֵלַי
  choice: sa akin
  rationale: Tuwiran at natural na salin ng direksiyon ng pagdaing sa Diyos.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: tiyak na diringgin ko
  rationale: Ipinahahayag ng “tiyak na” ang matibay na diin at katiyakan ng tugon ng Diyos; ang “diringgin” ay higit kaysa basta pagkarinig at natural sa konteksto ng pagtugon sa daing.
- source_word: צַעֲקָתוֹ
  choice: ang kanyang daing
  rationale: Pinananatili ang ugnayang leksikal sa pandiwang “dadaing” at ang isahang hulapi ng Hebreo.
theological_decisions:
- issue: Isahang pagtukoy sa taong pinahihirapan
  choice: siya / kanyang
  alternative: sila / kanilang
  rationale: 'Isahan ang mga hulaping Hebreo at distributibo ang gamit: tumutukoy ito sa bawat balo o ulila sa naunang talata. Ang likas na panghalip sa Tagalog ay hindi nagpapahiwatig ng kasarian, kaya napapanatili ang bilang nang hindi nagdaragdag ng kasariang wala sa gramatika ng Tagalog.'
- issue: Katiyakan ng pakikinig ng Diyos
  choice: tiyak na diringgin ko
  alternative: pakikinggan ko
  rationale: Pinananatili ng “tiyak na” ang mariing konstruksyon sa Hebreo. Ang “diringgin” ay nagpapahiwatig ng mapagtuong pagtanggap sa daing nang hindi inilalarawan nang higit sa sinasabi ng talata ang magiging tugon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pahihirapan” at “daing/diringgin” upang mapanatili ang bigat ng legal at teolohikal na pahayag nang hindi nagiging lipas o labis na teknikal.
