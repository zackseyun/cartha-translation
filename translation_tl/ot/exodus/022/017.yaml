translation:
  language: tl
  text: Huwag mong hayaang mabuhay ang isang babaeng mangkukulam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babaeng nagsasagawa ng pangkukulam.” Pambabae at isahan ang pangngalang Hebreo, kaya isang babae ang tiyak na tinutukoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: isang babaeng mangkukulam
  rationale: Ang pangngalang Hebreo ay pambabae at isahan, kaya tahasang pinananatili ng salin na babae ang tinutukoy. Ang “mangkukulam” ay natural at malinaw sa makabagong Filipino para sa taong nagsasagawa ng pangkukulam.
- source_word: לֹא
  choice: huwag
  rationale: Karaniwang pananggi ito; sa isang legal na utos sa Filipino, natural itong isalin bilang “huwag.”
- source_word: תְחַיֶּה
  choice: mong hayaang mabuhay
  rationale: Ang Piel imperfect na ikalawang panauhang panlalaki at isahan ng חיה ay may diwang “panatilihing buhay” o “hayaang mabuhay.” Pinananatili ng salin ang mismong anyo ng pagbabawal nang hindi ito pinalalawak bilang tahasang pormulang “dapat patayin.”
theological_decisions:
- issue: Tiyak na kasarian ng gumagawa ng pangkukulam
  choice: 'Panatilihing pambabae at isahan: “isang babaeng mangkukulam.”'
  alternative: Gawing pangkalahatan bilang “mangkukulam” o “sinumang nagsasagawa ng pangkukulam.”
  rationale: Malinaw na pambabae at isahan ang anyong Hebreo. Hindi dapat alisin sa salin ang tahasang pagmamarka ng kasarian sa pinagmulan.
- issue: Lakas ng legal na pagbabawal
  choice: “Huwag mong hayaang mabuhay,” na malapit sa anyong Hebreo.
  alternative: “Dapat patayin.”
  rationale: Ipinahihiwatig ng kontekstong legal ang kaparusahang kamatayan, ngunit ang aktuwal na pananalita ay “huwag hayaang/panatilihing buhay.” Pinananatili ng salin ang tensiyong ito at hindi nagdaragdag ng mas tahasang pormulang wala sa teksto.
translation_notes:
  register: Maikli, mariin, at angkop sa wikang pambatas, ngunit gumagamit ng natural na makabagong Filipino. Ginamit ang “babaeng mangkukulam” upang maging lantad ang kasariang minarkahan sa Hebreo; ang “mong” ay nagpapanatili sa isahang kausap, na gumaganap bilang kolektibong tagatanggap sa batas ng tipan.
