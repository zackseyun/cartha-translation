base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: tl
  text: Kung ipagkatiwala ng isang tao sa kanyang kapwa ang isang asno, baka, tupa[a], o anumang alagang hayop upang bantayan, at iyon ay mamatay, mapinsala[b], o maagaw, nang walang nakakita[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa kambing, o sa isang hayop mula sa kawan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mabali” o “masira.”
    reason: lexical_alternative
  - marker: c
    text: Ibig sabihin, walang nakasaksi sa nangyari.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִתֵּן
  choice: Kung ipagkatiwala
  rationale: Ang כִּי ay nagpapakilala ng kondisyong legal, at bagaman payak na 'magbigay' ang נתן, malinaw sa pariralang לִשְׁמֹר na ipinauubaya ang hayop sa pangangalaga ng kapwa. Natural sa modernong Tagalog ang 'ipagkatiwala' para sa ganitong transaksiyon.
- source_word: אִישׁ
  choice: isang tao
  rationale: Sa kasong legal, ang panlalaking isahan ay gumaganap bilang karaniwang kinatawan ng sinumang sangkot; ang 'isang tao' ay natural at hindi nagdaragdag ng di-kailangang pagtukoy sa kasarian.
- source_word: אֶל רֵעֵהוּ
  choice: sa kanyang kapwa
  rationale: Ang רֵעַ ay kapwa o kasamahan sa ugnayang panlipunan; 'kapwa' ang malinaw at dignified na katumbas sa legal na konteksto.
- source_word: חֲמוֹר
  choice: asno
  rationale: Karaniwang katawagang biblikal ngunit nauunawaan pa rin sa modernong Filipino para sa donkey.
- source_word: שׁוֹר
  choice: baka
  rationale: Ang שׁוֹר ay hayop na bovine at sa talaang ito ay hindi kailangang ipako sa kasarian o sa pagiging kastilang hayop-pantrabaho; mas natural at sapat ang 'baka' sa Filipino.
- source_word: שֶׂה
  choice: tupa
  rationale: Natural na tiyak na halimbawa ang 'tupa,' habang inilalahad sa talababa na maaari ring tumukoy ang Hebreo sa kambing o, sa mas malawak na diwa, sa isang hayop mula sa kawan.
- source_word: וְכָל בְּהֵמָה
  choice: o anumang alagang hayop
  rationale: Sa kontekstong ito, tumutukoy ang בְּהֵמָה sa mga hayop na pag-aari at inaalagaan; iniiwasan ng 'alagang hayop' ang masyadong malawak na impresyon ng lahat ng uri ng hayop.
- source_word: לִשְׁמֹר
  choice: upang bantayan
  rationale: 'Tahasang ipinapakita ang layunin ng pagpapagkatiwala: ingatan o bantayan ang hayop. Ang ''bantayan'' ay malinaw sa ordinaryong mambabasa.'
- source_word: וּמֵת
  choice: at iyon ay mamatay
  rationale: Pinananatili ang simpleng pangyayari sa kondisyong legal, na ang ipinagkatiwalang hayop ay namatay.
- source_word: נִשְׁבַּר
  choice: mapinsala
  rationale: Literal na 'mabali' o 'masira,' ngunit kapag hayop ang paksa, mas natural at saklaw ang 'mapinsala'; pinananatili sa talababa ang literal na larawan.
- source_word: נִשְׁבָּה
  choice: matangay
  rationale: Ang Niphal ng שׁבה ay tumutukoy sa pagdadala o pagkuha palayo, posibleng ng mga mananalakay; ang 'matangay' ay hindi nagpapakitid sa simpleng pagnanakaw lamang.
- source_word: אֵין רֹאֶה
  choice: nang walang nakakita
  rationale: Malapit sa anyong Hebreo at malinaw na walang saksi sa nangyari.
