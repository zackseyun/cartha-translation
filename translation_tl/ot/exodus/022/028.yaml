base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: tl
  text: Huwag mong ipagpaliban ang pagbibigay ng iyong buong ani at ng katas mula sa iyong pisaan.[a] Ibibigay mo sa akin ang iyong panganay na anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang iyong buong ani at ang iyong katas.” Malamang na tumutukoy ang mga salitang Hebreo sa inaning produkto at sa likidong produktong piniga—maaaring butil at alak, o mas pangkalahatan, solidong ani at likidong ani.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: saganang ani mo
  rationale: Ang מְלֵאָה ay literal na ‘kapuspusan’ o ‘buong ani,’ ngunit sa kontekstong pang-agrikultura at pambatas ay tumutukoy sa ani o bungang dapat ihandog. Natural sa Filipino ang ‘saganang ani’ at pinananatili nito ang diwa ng buong bunga.
- source_word: וְדִמְעֲךָ
  choice: katas mula sa iyong pisaan
  rationale: Bagaman maaari itong mangahulugang ‘luha,’ sa kontekstong ito ay tumutukoy ito sa likidong produktong piniga, gaya ng alak o langis. Hindi nito nililimitahan ang kahulugan sa isang partikular na produkto.
- source_word: לֹא תְאַחֵר
  choice: Huwag mong ipagpaliban ang paghahandog
  rationale: Ang piel ng אחר ay nangangahulugang magpaliban o magpaantala. Idinagdag ang ‘paghahandog’ upang maging malinaw at natural sa Filipino kung ano ang hindi dapat ipagpaliban, ayon sa legal na konteksto.
- source_word: בְּכוֹר
  choice: panganay
  rationale: Ang ‘panganay’ ang karaniwan at eksaktong salin ng legal na kategoryang בכור.
- source_word: בָּנֶיךָ
  choice: sa iyong mga anak na lalaki
  rationale: Tiyak na panlalaki ang בָּנֶיךָ (‘iyong mga anak na lalaki’), kaya hindi ito ginawang pangkalahatang ‘mga anak.’
- source_word: תִּתֶּן לִּי
  choice: Ibibigay mo sa akin
  rationale: Pinananatili nito ang mariing puwersa ng utos sa kontekstong pambatas at ang diin sa Diyos bilang tatanggap.
theological_decisions:
- issue: Kahulugan ng tambalang pang-agrikultura na מְלֵאָה / דִמְעָה
  choice: Ani at katas mula sa pisaan, bilang dalawang uri ng produktong pang-agrikultura na dapat ihandog nang walang pagpapaliban
  alternative: Partikular na butil at alak; o pangkalahatang mga unang bunga nang walang pagkakaiba ng uri
  rationale: Malamang na itinatambal ng Hebreo ang inaning solidong produkto at ang pinigang likidong produkto. Hindi nililimitahan ng salin ang ikalawa sa alak lamang at pinananatili ang tunay na lawak ng salita.
- issue: Paglalarawan sa בָּנֶיךָ
  choice: mga anak na lalaki
  alternative: mga anak
  rationale: Tiyak na panlalaki ang salitang Hebreo. Pinananatili ito nang hindi nagdaragdag ng doktrinal na paliwanag tungkol sa paraan ng pagtatalaga sa panganay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang isahang ‘mo’ dahil isahan ang mga anyong Hebreo. Ang ‘pisaan’ ay nagpapanatili sa larawang pang-agrikultura nang hindi labis na tinutukoy kung alak o langis ang likido.
