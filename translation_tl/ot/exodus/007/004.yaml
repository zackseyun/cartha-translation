source:
  edition: WLC
  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: tl
  text: Hindi makikinig sa inyo si Paraon. At ipapataw ko ang aking kamay sa Ehipto at ilalabas ko mula sa lupain ng Ehipto ang aking mga hukbo[a]—ang aking bayan, ang mga anak ni Israel[b]—sa pamamagitan ng mga dakilang hatol[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “aking mga organisadong pangkat” o “aking mga kalipunan.” Ang salitang Hebreo ay maaaring tumukoy sa mga pangkat na organisado, na kadalasa’y may kaugnayang militar.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “ang mga Israelita.” Literal na “ang mga anak ni Israel.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sa pamamagitan ng mga dakilang gawa ng paghatol.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: makikinig sa inyo
  rationale: Ang שׁמע na may אֶל ay karaniwang nangangahulugang makinig o duminig sa isang tao. Pinananatili ng “makikinig sa inyo” ang tuwirang diwa nang hindi tahasang ginagawang “susunod sa inyo,” bagaman ipinahihiwatig ng konteksto ang pagtangging tumalima.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: ipapataw ko ang aking kamay sa Ehipto
  rationale: Pinananatili nito ang Hebreong larawan ng kamay bilang makapangyarihang pagkilos ng Diyos sa paghatol. Ang “ipapataw” ay natural sa Filipino at hindi nagdaragdag ng pandiwang “iuunat,” na wala sa talatang ito.
- source_word: צִבְאֹתַי
  choice: aking mga hukbo
  rationale: Ang צָבָא ay maaaring tumukoy sa hukbo, kalipunan, o organisadong pangkat. Ang “mga hukbo” ay maikli at malinaw at pinananatili ang korporatibo at bahagyang militar na larawan ng Israel na lumalabas sa ilalim ng pamumuno ng Diyos.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: aking bayan, ang mga anak ni Israel
  rationale: 'Pinananatili ang appositional na ayos: ang “aking bayan” ay higit na kinikilalang “ang mga anak ni Israel.” Ang literal na ugnayang pampamilya ay hindi ginawang simpleng etnikong katawagan sa pangunahing teksto.'
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: sa pamamagitan ng mga dakilang hatol
  rationale: Ipinahahayag ng שְׁפָטִים ang mga gawa ng paghatol ng Diyos laban sa Ehipto. Pinananatili ng “mga dakilang hatol” ang legal na himig, pangmaramihang anyo, at lakas ng גְּדֹלִים.
theological_decisions:
- issue: Paglalarawan sa Israel bilang צִבְאֹתַי
  choice: aking mga hukbo
  alternative: aking mga organisadong pangkat / aking mga kalipunan
  rationale: Pinananatili ng “mga hukbo” ang tunay na militar at organisadong pahiwatig ng salita nang hindi ipinapaliwanag kung gaano kaliteral ang larawan. Nililinaw ng talababa ang mas malawak na saklaw nito.
- issue: Paglilipat ng בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal na katawagang pampamilya at ang kaugnayan nito sa ninunong si Israel; ibinibigay sa talababa ang mas idiomatikong katumbas.
- issue: Kalikasan ng בִּשְׁפָטִים גְּדֹלִים
  choice: mga dakilang hatol
  alternative: mga dakilang gawa ng paghatol
  rationale: Hindi nililimitahan ang parirala sa binigkas na pasiya lamang; maaaring saklawin ng pangmaramihang “mga hatol” ang mga isinagawang paghatol ng Diyos. Nililinaw ito ng talababa nang hindi pinapalawak ang pangunahing teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang makapangyarihang larawang “ipapataw ko ang aking kamay,” ang appositional na pagkakakilanlan ng Israel, at ang legal na himig ng “mga hatol.” Ginamit ang mga gitling upang malinaw na ipakitang ang “aking bayan, ang mga anak ni Israel” ang nagpapaliwanag sa “aking mga hukbo.”
