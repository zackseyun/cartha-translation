  naturalness: Natural ang pangkalahatang ayos at marangal ang rehistro. Mas matatas at hindi malabo sa makabagong Filipino ang 'kapag iuunat ko ... at ilalabas ko' para sa nakatakdang pagkilos sa hinaharap.
