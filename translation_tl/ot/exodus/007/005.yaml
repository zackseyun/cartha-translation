base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: tl
  text: At malalaman ng mga Ehipsiyo na ako si Yahweh[a] kapag iuunat ko ang aking kamay laban sa Ehipto at ilalabas ko mula sa gitna nila ang mga anak ni Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang banal sa Hebreo ay YHWH, na tradisyonal na isinasaling “PANGINOON” sa maraming salin.
    reason: alternative_reading
  - marker: b
    text: O “ang mga Israelita.” Sa Hebreo, “ang mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: At malalaman
  rationale: 'Ang anyong pandiwa sa kontekstong ito ay tumutukoy sa magiging bunga ng mga darating na pagkilos ni Yahweh: makikilala o malalaman ng mga Ehipsiyo kung sino siya.'
- source_word: מִצְרַיִם
  choice: ang mga Ehipsiyo / Ehipto
  rationale: Sa unang paglitaw, tumutukoy ito sa mga tao dahil sila ang makaaalam; sa ikalawa, tumutukoy ito sa bansa o lupain na paglalabanan ng kamay ni Yahweh.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala nito ang nilalaman ng malalaman ng mga Ehipsiyo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בִּנְטֹתִי
  choice: kapag iniunat ko
  rationale: Ang ב na may infinitive construct ay temporal dito. Ang 'iniunat ... ang kamay' ay nagpapanatili sa kongkretong larawang Hebreo ng makapangyarihang pagkilos.
- source_word: יָדִי
  choice: aking kamay
  rationale: Pinananatili ang antropomorpikong larawan sa teksto sa halip na ipakahulugan lamang bilang 'kapangyarihan.'
- source_word: עַל מִצְרָיִם
  choice: laban sa Ehipto
  rationale: Sa konteksto ng paghatol, malinaw na ipinahihiwatig ng עַל ang pagkilos laban sa Ehipto.
- source_word: וְהוֹצֵאתִי
  choice: at inilabas ko
  rationale: Pinananatili ang causative na diwa ng Hiphil ng יצא. Ang aspektong Hebreo ay likas na maisasalin sa sugnay na temporal na Filipino bilang 'kapag ... iniunat ... at inilabas.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Natural at marangal ito sa Filipino at pinananatili ang pamilyang pananalita ng Hebreo; maaari rin itong tumukoy sa mga Israelita bilang isang bayan.
- source_word: מִתּוֹכָם
  choice: mula sa gitna nila
  rationale: Malapit ito sa Hebreo at malinaw na naghahayag ng paglalabas sa Israel mula sa kinaroroonan ng mga Ehipsiyo.
theological_decisions:
- issue: Paglilipat sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Ang 'Yahweh' ay nagpapanatili rito bilang personal na pangalan sa halip na tahimik na palitan ng titulo.
- issue: Paglilipat sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ng napiling anyo ang literal na pamilyang talinghaga ng Hebreo, samantalang nililinaw ng talababa ang kolektibong kahulugan nito.
translation_notes:
  register: Makabagong Filipino na payak ngunit marangal. Pinanatili ang konkretong larawang “iniunat ko ang aking kamay,” ang personal na pangalang Yahweh, at ang pamilyang katawagang “mga anak ni Israel.”
