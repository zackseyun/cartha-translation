  source_fidelity: Kailangang isalin ang pambungad na waw-consecutive sa וַיֹּאמֶר (‘At sinabi’). Mas tumpak din sa pormulang pangmensahero ang kasalukuyang ‘Ganito ang sabi ni Yahweh’ para sa כֹּה אָמַר יְהוָה, kaysa sa nakaraang-panahong ‘Ganito ang sinabi.’ Napananatili ng iba pang bahagi ang utos, pag-angkin na ‘bayan ko,’ at layuning maglingkod kay Yahweh.
  naturalness: Natural at marangal ang ‘Payagan mong umalis ang bayan ko upang maglingkod sila sa akin.’ Ang ‘kay Faraon’ ay mas likas na pantukoy sa isang taong kausap o pupuntahan kaysa ‘sa Faraon.’
  terminology: Wastong pinananatili ang ‘Yahweh’ para sa יהוה at ang ‘maglingkod’ para sa עבד, nang hindi pinakikitid ang kahulugan nito sa pagsamba lamang. Ang talababa ay angkop at nakatali sa salitang nililinaw nito.
