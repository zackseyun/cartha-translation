base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: tl
  text: 'At sinabi ni Yahweh kay Moises, “Pumunta ka kay Faraon at sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh: Payagan mong umalis ang bayan ko upang maglingkod sila sa akin[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang sumamba sila sa akin.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglilingkod sa Diyos, kabilang ang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas sa makabagong Tagalog ang payak na anyong pasalaysay; ipinagpapatuloy nito ang salaysay nang hindi nagdaragdag ng di-kailangang diin.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Pumunta ka sa Faraon
  rationale: Maaaring mangahulugan ang בוא ng pagparoon o pagpasok depende sa pananaw. Ipinahihiwatig dito ang pagharap kay Faraon, at malinaw at natural itong naihahayag ng napiling parirala.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: at sabihin mo sa kanya
  rationale: Pinananatili nito ang sunod na utos sa natural na anyong Tagalog.
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormal at may-awtoridad na pormula ng mensaherong nagsasalita para sa Diyos.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Payagan mong umalis ang bayan ko
  rationale: Ipinahahayag nito ang hinihinging pagpapalaya sa bayan mula sa kapangyarihan ni Faraon, habang nananatiling natural sa kasalukuyang Tagalog.
- source_word: עַמִּי
  choice: bayan ko
  rationale: Pinananatili ang unang panauhang pag-angkin at ang kolektibong diwa ng עַם.
- source_word: וְיַעַבְדֻנִי
  choice: upang maglingkod sila sa akin
  rationale: Ipinakikita ng “upang” ang layunin ng pagpapalaya. Ang “maglingkod” ay nagpapanatili sa malawak na saklaw ng עבד, na maaaring kabilang ang pagsamba ngunit hindi limitado rito.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kahulugan ng וְיַעַבְדֻנִי bilang layunin ng paglaya ng Israel
  choice: maglingkod sila sa akin
  alternative: sumamba sila sa akin
  rationale: Kapag Diyos ang pinaglilingkuran, maaaring saklaw ng עבד ang pagsamba, ngunit mas malawak ang salitang “maglingkod.” Pinananatili nito ang ugnayan sa pagitan ng paglaya mula sa paglilingkod kay Faraon at paglilingkod kay Yahweh nang hindi pinakikitid ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “bayan” para sa kolektibong עַם at ang magalang ngunit tuwirang anyo ng utos. Inilagay ang talababa sa “maglingkod,” ang salitang tunay nitong nililinaw.
