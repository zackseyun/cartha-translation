  to: 'At sinabi ni Yahweh kay Moises, “Pumunta ka kay Faraon at sabihin mo sa kanya, ‘Ganito ang sabi ni Yahweh: Payagan mong umalis ang bayan ko upang maglingkod sila sa akin[a].’”'
