  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: tl
  text: At si Moises[a] ay walumpung taong gulang, at si Aaron ay walumpu't tatlong taong gulang nang magsalita sila sa Paraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na anyo: “At si Moises ay anak ng walumpung taon, at si Aaron ay anak ng tatlo at walumpung taon, nang magsalita sila sa Paraon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: '... taong gulang'
  rationale: Ang literal na idyomang Hebreo ay “anak ng ... taon,” ngunit ang natural at malinaw na katumbas sa modernong Tagalog para sa edad ay “... taong gulang.”
- source_word: שְׁמֹנִים שָׁנָה
  choice: walumpung taong gulang
  rationale: Karaniwang pagpapahayag ito ng edad na walumpung taon.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: walumpu't tatlong taong gulang
  rationale: Nasa ayos na “tatlo at walumpu” ang bilang sa Hebreo; ginamit ang likas na ayos sa modernong Tagalog.
- source_word: בְּדַבְּרָם
  choice: nang magsalita sila
  rationale: Ang ב na may infinitive construct at hulaping panghalip ay temporal dito at tumutukoy sa panahong nagsalita sila.
- source_word: אֶל
  choice: sa
  rationale: Sa konteksto ng pagsasalitang nakatuon sa isang tao, natural sa Tagalog ang “magsalita sa Paraon.”
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Ito ang nakaugaliang anyong Tagalog ng maharlikang titulong Hebreo.
- source_word: וּ
  choice: at
  rationale: Pinananatili ang pang-ugnay sa pagitan nina Moises at Aaron; hindi nagdagdag ng hiwalay na panimulang salitang temporal na wala sa Hebreo.
