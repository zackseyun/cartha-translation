  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: tl
  text: At lumipas ang pitong araw[a] matapos hampasin ni Yahweh ang Nilo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na salin, “At nakumpleto ang pitong araw.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy rito sa Nilo; maaari rin itong isalin nang mas pangkalahatan bilang “ilog.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: lumipas
  rationale: Ang Niphal na anyo ng מלא, kapag tumutukoy sa takdang panahon, ay nagsasaad na umabot ito sa kaganapan o natapos. Ang “lumipas” ang likas at malinaw na katumbas sa makabagong Tagalog, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: שִׁבְעַת יָמִים
  choice: ang pitong araw
  rationale: Tuwirang tumutukoy sa isang yugto na pitong araw.
- source_word: אַחֲרֵי
  choice: matapos
  rationale: Likas na pang-ugnay sa Tagalog para sa temporal na kahulugang “pagkatapos ng.”
- source_word: הַכּוֹת
  choice: hampasin
  rationale: Ang infinitive construct ng נכה pagkatapos ng אַחֲרֵי ay nangangahulugang “matapos hampasin.” Ang “hampasin” ay malinaw at angkop sa konteksto ng salot at paghatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הַיְאֹר
  choice: ang Nilo
  rationale: Sa konteksto ng Exodo, ang יְאֹר ay partikular na tumutukoy sa Ilog Nilo, bagaman maaari itong isalin nang mas pangkalahatan bilang “ilog.”
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa banal na pangalan at hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lumipas” para sa likas na pagpapahayag ng pagkakumpleto ng isang yugto ng panahon; pinanatili sa talababa ang mas literal na larawan.
