  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: tl
  text: Maglilipana sa Nilo ang mga palaka. Aahon ang mga ito at papasok sa iyong bahay, sa iyong silid-tulugan, at sa ibabaw ng iyong higaan; sa mga bahay ng iyong mga lingkod at sa gitna ng iyong bayan; at maging sa iyong mga hurno at mga sisidlan para sa pagmamasa ng masa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga batyang pambmasa.”
    reason: Hindi tiyak ang eksaktong hugis at laki ng מִשְׁאֲרוֹת; tumutukoy ito sa sisidlang ginagamit sa pagmamasa ng masa.
lexical_decisions:
- source_word: וְשָׁרַץ הַיְאֹר צְפַרְדְּעִים
  choice: Kakalatan ng mga palaka ang Nilo
  rationale: Ipinahahayag ng שׁרץ ang napakaraming maliliit na nilalang na kumikilos o naglipana. Ang “kakalatan” ay likas at malinaw sa modernong Filipino at pinananatili ang masiglang larawan, sa halip na ang mas patag na “mapupuno.”
- source_word: הַיְאֹר
  choice: ang Nilo
  rationale: Sa kontekstong Ehipsiyo ng Exodo, ang יְאֹר ay tumutukoy sa Ilog Nilo; sapat at natural sa Filipino ang pangalang “Nilo.”
- source_word: וְעָלוּ
  choice: Aahon ang mga ito
  rationale: Inilalarawan ng עלה ang pag-ahon ng mga palaka mula sa ilog patungo sa lupa at mga tirahan.
- source_word: וּבָאוּ בְּבֵיתֶךָ
  choice: papasok sa iyong bahay
  rationale: Ang בוא na sinusundan ng ב ay nagpapahiwatig ng pagpasok sa isang lugar. Pisikal na tirahan ang tinutukoy ng בַּיִת dito, hindi ang sambahayan bilang pangkat.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: sa iyong silid-tulugan
  rationale: Ang literal na “silid ng iyong pagtulog/paghiga” ay natural na katumbas ng modernong “silid-tulugan.”
- source_word: וְעַל מִטָּתֶךָ
  choice: sa ibabaw ng iyong higaan
  rationale: Hayagang pinananatili ang על, “sa ibabaw ng,” upang idiin ang pagdating ng mga palaka hanggang sa mismong higaan.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: sa mga bahay ng iyong mga lingkod
  rationale: Bagaman isahan ang בית sa anyong construct, maaaring distributibo ito sa harap ng pangmaramihang “mga lingkod”; natural sa Filipino ang pangmaramihang “mga bahay.”
- source_word: וּבְעַמֶּךָ
  choice: sa gitna ng iyong bayan
  rationale: Ang “sa gitna ng” ay natural na nagpapahayag ng paglaganap ng mga palaka sa populasyon nang hindi ginagawang pisikal na lalagyan ang “bayan.”
- source_word: וּבְתַנּוּרֶיךָ
  choice: sa iyong mga hurno
  rationale: Ang תַּנּוּר ay hurnong ginagamit sa pagluluto o paghurno; “hurno” ang tuwiran at dignified na katumbas.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: mga mangkok na pinagmamasahan ng masa
  rationale: Tumutukoy ang מִשְׁאֶרֶת sa mga sisidlang ginagamit sa pagmamasa ng masa ng tinapay. Malinaw sa karaniwang mambabasa ang “mangkok,” habang inilalahad sa talababa ang posibleng mas malaking sisidlan.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Pinanatili ang sunod-sunod na pagpasok ng mga palaka mula sa pribadong silid ng pinuno hanggang sa mga lingkod, bayan, at kagamitan sa paghahanda ng pagkain. Ang semicolon ay naghahati sa mahahabang pangkat ng mga lokasyon nang hindi binabago ang daloy ng Hebreo.
