revisions:
- from: Kakalatan ng mga palaka ang Nilo. Aahon ang mga ito at papasok sa iyong bahay, sa iyong silid-tulugan, at sa ibabaw ng iyong higaan; sa mga bahay ng iyong mga lingkod at sa gitna ng iyong bayan; at maging sa iyong mga hurno at mga mangkok na pinagmamasahan ng masa[a].
  to: Maglilipana sa Nilo ang mga palaka. Aahon ang mga ito at papasok sa iyong bahay, sa iyong silid-tulugan, at sa ibabaw ng iyong higaan; sa mga bahay ng iyong mga lingkod at sa gitna ng iyong bayan; at maging sa iyong mga hurno at mga sisidlan para sa pagmamasa ng masa[a].
  rationale: Pinalitan ang maling "pinagmamasahan" ng malinaw na pariralang nagsasaad ng tungkulin ng sisidlan. Ginawang "Maglilipana sa Nilo ang mga palaka" ang pambungad upang idiomatikong maipahayag na ang Nilo ay mag-uumapaw sa mga palaka, habang pinananatili ang masiglang diwa ng שׁרץ. Pinanatili ang lahat ng lokasyon, ang pag-ahon mula sa ilog, at ang lokatibong "sa ibabaw" para sa higaan.
