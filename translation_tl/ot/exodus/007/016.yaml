  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: tl
  text: 'At sabihin mo sa kanya, ‘Si Yahweh, ang Diyos ng mga Hebreo, ay nagsugo sa akin sa iyo upang sabihin: Payagan mong umalis ang aking bayan upang makapaglingkod sila sa akin sa ilang.[a] Ngunit tingnan mo, hanggang ngayon ay hindi ka pa nakinig.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang makasamba sila sa akin sa ilang.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglilingkod sa pangkalahatan o sa pagsamba sa relihiyosong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ang Diyos ng mga Hebreo
  rationale: Tuwirang pinananatili ang katawagang etniko na עִבְרִים at ang ugnayang ipinahahayag ng construct phrase.
- source_word: שְׁלָחַנִי אֵלֶיךָ
  choice: ay nagsugo sa akin sa iyo
  rationale: Ang ganap na pagsusugo ay malinaw na naipahahayag sa natural na Filipino, habang pinananatili ang direksiyong ‘sa iyo.’
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Payagan mong umalis ang aking bayan
  rationale: Ipinahahayag nito ang utos na palayain o hayaang umalis ang bayan nang hindi nagdaragdag ng di-makikitang detalye.
- source_word: וְיַעַבְדֻנִי
  choice: upang makapaglingkod sila sa akin
  rationale: Pinananatili ng ‘maglingkod’ ang malawak na kahulugan ng עבד, na maaaring sumaklaw sa pagsamba ngunit hindi lamang dito limitado.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Ang ‘ilang’ ay natural at dignidadong salin ng מִדְבָּר at hindi nito labis na tinutukoy ang lupain bilang purong disyerto.
- source_word: וְהִנֵּה
  choice: Ngunit
  rationale: Sa modernong Filipino, naihahatid ng ‘Ngunit’ ang kontekstuwal na pagsalungat; hindi na isinalin nang hiwalay ang pantawag-pansing הִנֵּה upang maiwasan ang artipisyal na ‘masdan’ o ‘narito.’
- source_word: לֹא שָׁמַעְתָּ עַד כֹּה
  choice: hanggang ngayon ay hindi ka nakinig
  rationale: Pinananatili ng ‘nakinig’ ang larawang leksikal ng שׁמע at ang pahiwatig ng hindi pagtalima, nang hindi tahasang nilulutas iyon bilang ‘sumunod.’
theological_decisions:
- issue: Pagbibigay-kahulugan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tuwirang ginagamit ng Hebreo; pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng וְיַעַבְדֻנִי
  choice: makapaglingkod sila sa akin
  alternative: makasamba sila sa akin
  rationale: Maaaring tumukoy ang עבד kapuwa sa paglilingkod sa pangkalahatan at sa relihiyosong pagsamba. Hindi pinakikitid ng pangunahing teksto ang saklaw nito.
- issue: Kahulugan ng לֹא שָׁמַעְתָּ
  choice: hindi ka nakinig
  alternative: hindi ka sumunod
  rationale: Narinig ni Paraon ang kahilingan ngunit hindi niya ito pinakinggan o tinalima. Pinananatili ng salin ang leksikal at teolohikal na tensiyon sa pagitan ng pakikinig at pagsunod.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘sa ilang’ bilang pamilyar na biblikal ngunit nauunawaang katumbas ng wilderness. Iniwasan ang lubhang makalumang ‘masdan’ para sa הִנֵּה; ang pagsalungat ay likas na ipinahayag sa ‘Ngunit.’
