  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: tl
  text: Inihagis ng bawat isa ang kani-kaniyang tungkod, at ang mga iyon ay naging mga ahas[a]. Ngunit nilamon ng tungkod ni Aaron ang kanilang mga tungkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga dragon” o “malalaking reptilya.” Mas malawak ang kahulugan ng salitang Hebreo na tannin kaysa sa karaniwang salita para sa “ahas” at maaari itong tumukoy sa isang nilalang na tulad-ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: Inihagis
  rationale: Ang שׁלך sa tagpong ito ay tumutukoy sa paghagis o pagbagsak ng isang bagay sa harap ng iba. Likas sa modernong Tagalog ang “inihagis” at malinaw nitong inilalarawan ang kilos.
- source_word: אִישׁ מַטֵּהוּ
  choice: ng bawat isa ang kani-kaniyang tungkod
  rationale: 'Distributibo ang אִישׁ kasama ng isahang hulapi: bawat tao ay naghagis ng sarili niyang tungkod. Ang “bawat isa” at “kani-kaniyang” ay malinaw at likas sa Tagalog nang hindi na inuulit ang panlalaking anyo na hindi kailangan sa balarila ng Tagalog.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: tungkod / tungkod / mga tungkod
  rationale: Maaaring mangahulugan ang מַטֶּה ng tungkod o pamalo. Ang “tungkod” ang pinakalikas at kongkretong tawag sa bagay na hawak nina Aaron at ng mga salamangkero, at napananatili ang pagkakaiba ng isahan at maramihan.
- source_word: וַיִּהְיוּ
  choice: ay naging
  rationale: Ipinapahayag ng היה rito ang pagbabago o naging resulta. Tuwiran at malinaw itong naihahatid ng “ay naging.”
- source_word: לְתַנִּינִם
  choice: malalaking ahas
  rationale: Mas malawak ang saklaw ng תַּנִּין kaysa sa karaniwang salitang Hebreo para sa ahas at maaari itong tumukoy sa malaking reptilyang tulad-ahas o halimaw. Ang “malalaking ahas” ay angkop sa konteksto at mas natural kaysa “dragon” sa pangunahing teksto, habang inilalahad sa talababa ang tunay na lawak ng kahulugan.
- source_word: וַיִּבְלַע
  choice: nilamon
  rationale: Ang בלע ay nangangahulugang lumamon o sumakmal nang lubusan. Ang “nilamon” ay maikli, malinaw, at natural sa salaysay.
- source_word: אֶת
  choice: '[pananda ng tiyak na tuwirang layon; hindi isinasalin]'
  rationale: Ang אֶת ay panandang pambalarila sa Hebreo at walang hiwalay na katumbas na salita sa Tagalog; naipakikita ang gamit nito sa ayos ng pangungusap.
