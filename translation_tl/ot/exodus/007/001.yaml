  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: tl
  text: Sinabi nga ni Yahweh kay Moises, “Tingnan mo, ginawa kitang Diyos sa Faraon, at si Aaron na kapatid mo ay magiging propeta mo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural na ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: רְאֵה
  choice: Tingnan mo
  rationale: Isang pautos na tumatawag sa pansin ni Moises sa kasunod na pahayag.
- source_word: נְתַתִּיךָ
  choice: ginawa kitang
  rationale: Bagaman pangunahing nangangahulugang “ibinigay,” ang konstruksyon dito ay may resultative na diwang “ginawa” o “itinalaga.”
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Direktang pinananatili ang predikatibong אֱלֹהִים at ang matinding paghahambing ng papel ni Moises sa harap ng faraon; nililinaw ng talababa na kinatawang tungkulin ito.
- source_word: לְפַרְעֹה
  choice: para sa faraon
  rationale: Ipinahahayag ang ugnayan ni Moises sa faraon; ang “para sa” ay natural sa Filipino at hindi awtomatikong nagpapahiwatig na si Moises ay Diyos sa likas na pagkatao.
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: at si Aaron na kapatid mo
  rationale: Natural na ayos sa modernong Filipino habang pinananatili ang tahasang pagkakakilanlan kay Aaron.
- source_word: יִהְיֶה נְבִיאֶךָ
  choice: ang magiging propeta mo
  rationale: Pinananatili ang karaniwang salitang “propeta,” hindi lamang “tagapagsalita,” at malinaw na iniuugnay kay Moises.
theological_decisions:
- issue: Ang pagtawag kay Moises na אֱלֹהִים kaugnay ng faraon
  choice: ginawa kitang Diyos para sa faraon
  alternative: ginawa kitang tulad ng Diyos sa harap ng faraon
  rationale: Walang tahasang salitang paghahambing na “tulad ng” sa Hebreo. Kaya pinananatili sa teksto ang matapang at tunay na hindi-lubusang-ipinaliliwanag na pahayag, habang nililinaw sa talababa na inilalarawan nito ang awtoridad ni Moises bilang kinatawan ng Diyos, kaayon ng papel ni Aaron bilang kaniyang propeta.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “faraon” bilang titulo at pinanatili ang “Yahweh,” “Diyos,” at “propeta” bilang pamilyar na mga terminong biblikal.
