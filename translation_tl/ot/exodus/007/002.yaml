base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: tl
  text: Ikaw ang magsasalita ng lahat ng iuutos ko sa iyo, at si Aaron na kapatid mo ang magsasalita sa Paraon upang paalisin niya sa kanyang lupain ang mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita”; literal sa Hebreo, “mga anak na lalaki ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה תְדַבֵּר
  choice: Ikaw ang magsasalita
  rationale: Pinananatili ng tahasang “Ikaw” ang diin ng panghalip sa Hebreo, habang likas na ipinahahayag ng anyong panghinaharap sa Filipino ang atas sa kontekstong ito.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: ng lahat ng iuutos ko sa iyo
  rationale: Saklaw nito ang kabuuan ng mga utos na ibibigay ng Diyos; ang “iuutos” ay angkop sa patuloy o darating na tagubilin sa konteksto ng pagsusugo.
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: at si Aaron na kapatid mo
  rationale: Natural sa modernong Filipino at pinananatili ang pagkakasunod ng pangalang Aaron at ng paglalarawan sa kanya bilang kapatid ni Moises.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: ang magsasalita sa Paraon
  rationale: Tuwirang isinasalin ang kilos na pagsasalita nang hindi dinaragdagan o nililimitahan ang nilalaman nito.
- source_word: וְשִׁלַּח
  choice: upang paalisin niya
  rationale: Ipinahahayag ang layunin o inaasahang bunga ng pagsasalita ni Aaron nang hindi ginagawang tiyak na agad itong mangyayari. Ang “paalisin” ay angkop sa causative na diwa ng pagpapalabas o pagpapayaon.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang Hebreong larawang naglalarawan sa bayan bilang mga inapo ni Israel. Sa Filipino, ang “anak” ay hindi likas na limitado sa lalaki; nililinaw sa talababa ang literal na anyo at ang idiomatikong alternatibo.
- source_word: מֵאַרְצוֹ
  choice: sa kanyang lupain
  rationale: Kasama ng “paalisin,” malinaw na ipinahahayag nito ang paglabas mula sa lupaing sakop ng Paraon nang hindi mabigat ang salin.
theological_decisions:
- issue: Ugnayan ng pagsasalita ni Aaron at pagpapaalis ng Paraon
  choice: upang paalisin niya
  alternative: at paaalisin niya
  rationale: Maaaring basahin ang Hebreong pagkakaugnay bilang layunin o bunga. Pinipili ng “upang” ang kontekstuwal na layunin ngunit hindi sinasabing tiyak o kaagad ang pagsunod ng Paraon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Paraon” bilang karaniwang anyong Filipino at iniwasan ang labis na tradisyonal o makalumang pananalita.
