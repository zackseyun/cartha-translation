base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: tl
  text: Ngunit patitigasin ko ang puso ng Faraon[a], at pararamihin ko ang aking mga tanda at mga kababalaghan sa lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “gagawin kong matigas ang puso ng Faraon” o “gagawin kong matigas ang kalooban ng Faraon.” Tuwirang causative ang pandiwang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ngunit ... ko
  rationale: Ang pangatnig at tahasang panghalip ay nagbibigay ng diin o pagsalungat sa naunang pahayag. Likas na naihahatid ito ng “Ngunit” sa Filipino, habang ang “ko” ay taglay na sa anyo ng pandiwa.
- source_word: אַקְשֶׁה
  choice: patitigasin ko
  rationale: 'Ang Hiphil ng קשׁה ay tuwirang sanhi: gagawing matigas. Pinananatili ng “patitigasin ko” ang aktibong papel ng Diyos at ang aspektong panghinaharap sa konteksto.'
- source_word: לֵב פַּרְעֹה
  choice: ang puso ng Faraon
  rationale: Pinananatili ang Hebreong idyomang “puso,” na maaaring tumukoy sa kalooban at pag-iisip, sa halip na bigyang-kahulugan ito sa pangunahing teksto.
- source_word: וְהִרְבֵּיתִי
  choice: at pararamihin ko
  rationale: Ang anyo ay may panghinaharap na diwa sa pagkakasunod ng salaysay. Ang “pararamihin” ay natural at tapat sa causative na kahulugan ng רבה.
- source_word: אֹתֹתַי
  choice: ang aking mga tanda
  rationale: Karaniwang kahulugan ng אוֹת ang “tanda”; malinaw nitong ipinahihiwatig ang mga gawang nagpapatunay sa kapangyarihan at mensahe ng Diyos.
- source_word: מוֹפְתַי
  choice: mga kababalaghan
  rationale: Maaaring mangahulugan ang מוֹפֵת ng kamangha-manghang tanda o portent. Ang “mga kababalaghan” ay likas na katambal ng “mga tanda” at hindi labis na nililimitahan ang kahulugan.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Tahasang binabanggit ng Hebreo ang “lupain,” kaya pinanatili ito sa isang natural na pariralang Filipino.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagpapatigas ng puso ng Faraon
  choice: patitigasin ko ang puso ng Faraon
  alternative: hahayaan kong tumigas ang puso ng Faraon
  rationale: Tuwirang causative ang Hebreong Hiphil at inilalarawan ang aktibong pagkilos ng Diyos. Hindi ito pinalalambot bilang pagpapahintulot lamang, upang mapanatili ang tunay na teolohikal na tensiyon ng teksto.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang tradisyonal ngunit malinaw na idyomang “puso ng Faraon” at ang tambalang “mga tanda at mga kababalaghan.”
