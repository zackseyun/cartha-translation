translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Nilo” bilang kontekstuwal na tiyak na katawagan sa יְאֹר; hindi na kailangan ng hiwalay na talababa para rito. Inilagay ang marker [a] pagkatapos ng buong sugnay na nililinaw nito.
