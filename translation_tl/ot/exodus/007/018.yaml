  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: tl
  text: Mamamatay ang mga isda sa Nilo, babaho ang Nilo, at hindi makainom ng tubig mula sa Nilo ang mga Ehipsiyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mapapagod ang mga Ehipsiyo sa pagsisikap na uminom ng tubig mula sa Nilo.” Maaaring tumukoy ang pandiwang Hebreo sa pagkapagod o sa kawalan ng kakayahan dahil sa pagkapagod.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: ang mga isda
  rationale: Isahang pangngalang kolektibo ito sa Hebreo; likas sa modernong Tagalog ang maramihang “mga isda.”
- source_word: יְאֹר
  choice: Nilo
  rationale: Bagaman literal na “ilog,” partikular na tumutukoy ito sa Ilog Nilo sa konteksto ng Exodo.
- source_word: תָּמוּת
  choice: mamamatay
  rationale: Tuwiran at karaniwang katumbas ng pandiwang מות sa kontekstong hinaharap.
- source_word: וּבָאַשׁ
  choice: babaho
  rationale: Malinaw at natural na ipinapahayag ang pagiging mabaho ng ilog.
- source_word: וְנִלְאוּ
  choice: hindi na makakaya
  rationale: Ipinahahayag ang kinalabasang kawalan ng kakayahan habang pinananatili sa talababa ang posibleng diwa ng pagkapagod mula sa pandiwang לאה.
- source_word: לִשְׁתּוֹת מַיִם
  choice: uminom ... ng tubig
  rationale: Pinananatili ang tahasang layon na “tubig” sa Hebreo.
- source_word: מִן הַיְאֹר
  choice: mula sa Nilo
  rationale: Likas at eksaktong katumbas ng pariralang nagpapahayag ng pinagmulan.
