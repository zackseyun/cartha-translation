  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: tl
  text: Tumalikod ang Paraon at pumasok sa kanyang bahay, at ni hindi niya ito isinapuso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi niya ito binigyang-pansin” o “hindi niya itinuon ang kanyang puso rito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: Tumalikod
  rationale: Ang pandiwang פנה ay nagsasaad ng paglingon o pagtalikod; sa daloy ng salaysay, malinaw at likas ang “tumalikod” nang hindi dinaragdagan ang direksiyon.
- source_word: פַּרְעֹה
  choice: ang Paraon
  rationale: Karaniwang anyong Filipino ng titulong Ehipsiyo.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: pumasok sa kanyang palasyo
  rationale: Ang בוא kasunod ng אֶל ay nagpapahiwatig ng pagpunta o pagpasok. Sa konteksto ng Paraon, ang בֵּיתוֹ ay natural na tumutukoy sa kanyang tirahang maharlika o palasyo.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: hindi niya isinapuso
  rationale: Pinananatili nito ang larawang “puso” ng idyomang Hebreo habang natural na ipinahahayag ang hindi pagbibigay ng taimtim na pansin.
- source_word: גַּם לָזֹאת
  choice: kahit ito
  rationale: Dito, ang גַּם ay may diin na “kahit,” at ang לָזֹאת ay tumutukoy sa kasalukuyang tanda o salot.
