translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palasyo” sa halip na literal na “bahay” dahil tahanan ng Paraon ang tinutukoy, habang ang talababa ay nagpapaliwanag sa idyomang may salitang “puso.”
