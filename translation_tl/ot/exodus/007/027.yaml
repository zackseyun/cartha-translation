  text: Ngunit kung tatanggi kang hayaan silang umalis, narito, hahampasin ko[a] ang buong nasasakupan mo sa pamamagitan ng mga palaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “malapit ko nang hampasin.” Maaaring ipahayag ng anyong participle sa Hebreo ang nalalapit na kilos o ang payak na hinaharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Ngunit kung
  rationale: Ipinakikita nito ang pasalungat na kondisyon kasunod ng naunang utos, nang hindi inaalis ang payak na diwang kondisyonal.
- source_word: מָאֵן
  choice: tatanggi
  rationale: Nagsasaad ito ng kusang pagtanggi, hindi lamang ng kawalan ng kakayahang sumunod.
- source_word: לְשַׁלֵּחַ
  choice: paalisin sila
  rationale: Sa konteksto ng Exodo, tumutukoy ito sa pagpapalaya at pagpapaalis sa Israel; likas sa modernong Tagalog ang pariralang ito.
- source_word: הִנֵּה
  choice: masdan mo
  rationale: Pinananatili nito ang pantawag-pansing bigat at agarang babala ng Hebreo sa isang marangal na rehistro.
- source_word: אָנֹכִי
  choice: ko
  rationale: Likas na ipinahahayag sa pandiwang Tagalog ang unang panauhan; sapat ang 'ko' upang tukuyin ang nagsasalita nang hindi nagdaragdag ng labis na diin.
- source_word: נֹגֵף
  choice: hahampasin ko
  rationale: Pinananatili ng 'hahampasin' ang larawan ng paghatol bilang isang dagok. Maaaring ipahiwatig ng participle ang nalalapit na kilos o isang simpleng kilos sa hinaharap.
- source_word: כָּל גְּבוּלְךָ
  choice: ang buong nasasakupan mo
  rationale: Dito ang גְּבוּל ay tumutukoy sa kabuuang teritoryo o sakop ng pamumuno, hindi lamang sa guhit ng hangganan.
- source_word: בַּצְפַרְדְּעִים
  choice: ng mga palaka
  rationale: Ipinahahayag ng 'ng' ang mga palaka bilang paraan o kasangkapan ng paghampas sa nasasakupan.
