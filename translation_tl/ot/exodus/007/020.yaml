  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: tl
  text: Kaya gayon ang ginawa nina Moises at Aaron, ayon mismo sa iniutos ni Yahweh. Itinaas niya ang tungkod at hinampas ang tubig sa Nilo[a], sa paningin ni Faraon at sa paningin ng kanyang mga lingkod. At naging dugo ang lahat ng tubig sa Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ilog”; sa Exodo, ang salitang ito ay karaniwang tumutukoy mismo sa Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: gayon ang ginawa
  rationale: Likas na Filipino para sa idyomang Hebreo na nagsasaad na isinagawa nila ang naunang utos, habang pinananatili ang salitang ‘gayon.’
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ayon mismo sa iniutos
  rationale: Ipinapahayag ang paghahambing at eksaktong pagsunod na nasa כַּאֲשֶׁר, at malinaw na nauna ang utos sa pagkilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang pangalang tipan na YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַיָּרֶם
  choice: Itinaas niya
  rationale: Pinananatili ang isahang pandiwang Hebreo at ang hindi tahasang pinangalanang gumagawa; malamang na si Aaron ang tinutukoy ayon sa konteksto, ngunit hindi ito idinaragdag sa teksto.
- source_word: בַּמַּטֶּה
  choice: ang tungkod
  rationale: Karaniwan at malinaw na salitang Filipino para sa מַטֶּה sa salaysay na ito.
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: hinampas ang tubig
  rationale: Tumpak na inilalarawan ang pisikal na paghampas na ipinahihiwatig ng נכה.
- source_word: הַיְאֹר
  choice: Nilo
  rationale: Bagaman literal na ‘ilog,’ ang יְאֹר sa konteksto ng Exodo ay tumutukoy sa Ilog Nilo; inilalagay sa talababa ang literal na anyo.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: sa paningin ... at sa paningin
  rationale: Pinananatili ang pag-uulit at diin ng Hebreo na hayagang nasaksihan ang pangyayari.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Direktang salin na hindi nagpapalagay ng tiyak na ranggo, gaya ng ‘mga opisyal.’
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: naging dugo
  rationale: Natural na Filipino na nagpapahayag ng ganap na pagbabagong resulta nang hindi dinaragdagan ang kahulugan.
theological_decisions:
- issue: Paglalarawan sa likas ng pagbabagong naging dugo
  choice: naging dugo
  alternative: naging parang dugo / naging kulay-dugo
  rationale: Tuwirang sinasabi ng Hebreo na ang tubig ay naging dugo; hindi nito nilalagyan ng paghahambing o nililimitahan ang pangyayari sa pagbabago lamang ng kulay.
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Nasa orihinal ang personal na pangalang YHWH, kaya pinananatili itong pangalan sa salin sa halip na palitan ng titulo.
- issue: Pagkakakilanlan ng isahang gumagawa sa ‘Itinaas niya’
  choice: panatilihin ang panghalip na ‘niya’
  alternative: Itinaas ni Aaron
  rationale: Isahan ang pandiwang Hebreo ngunit hindi nito inuulit ang pangalan ng gumagawa. Bagaman itinuturo ng naunang utos ang pagkilos ni Aaron, pinananatili ng salin ang bahagyang kalabuan ng mismong talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Faraon’ at ‘tungkod’ bilang mga pamilyar na anyo, pinanatili ang pampublikong-diin ng inuulit na ‘sa paningin,’ at iniwasang pangalanan si Aaron sa ikalawang pangungusap upang hindi lutasin nang tahasan ang isahang reperensiya ng Hebreo.
