base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: tl
  text: Pumunta sina Moises at Aaron kay Paraon, at ginawa nila ito ayon sa iniutos ni Yahweh. Pagkatapos, inihagis ni Aaron ang kanyang tungkod sa harap ni Paraon at sa harap ng kanyang mga lingkod, at ito ay naging ahas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na tannin ay maaari ring tumukoy sa isang nilalang na tulad ng dragon o sa isang malaking reptilya; sa kontekstong ito, malamang na tumutukoy ito sa ahas sa tandang ginawa sa harap ni Paraon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא מֹשֶׁה וְאַהֲרֹן אֶל־פַּרְעֹה
  choice: pumunta sina Moises at Aaron kay Paraon
  rationale: Likas sa modernong Tagalog ang “pumunta ... kay” para sa paglapit sa isang tao. Bagaman isahan ang pandiwang Hebreo dahil nauuna ito sa tambalang simuno, kapwa sina Moises at Aaron ang gumagawa.
- source_word: וַיַּעֲשׂוּ כֵן כַּאֲשֶׁר צִוָּה יְהוָה
  choice: ginawa nila ang iniutos ni Yahweh
  rationale: Malinaw at natural nitong ipinapahayag na isinagawa nila ang utos ayon mismo sa iniutos ni Yahweh, nang hindi nagdaragdag ng paliwanag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיַּשְׁלֵךְ
  choice: inihagis
  rationale: Tuwirang inilalarawan ng pandiwa ang paghagis ng tungkod bilang hayag na tanda sa harap ng korte.
- source_word: מַטֵּהוּ
  choice: ang kanyang tungkod
  rationale: Ang “tungkod” ang karaniwan at angkop na salin sa Tagalog para sa hawak na staff ni Aaron.
- source_word: לִפְנֵי פַרְעֹה וְלִפְנֵי עֲבָדָיו
  choice: sa harap ni Paraon at ng mga lingkod nito
  rationale: Ipinahihiwatig ng “sa harap” ang pampublikong pagsasagawa sa presensiya ni Paraon at ng kanyang mga tauhan. Ginamit ang “mga lingkod” upang mapanatili ang malawak na diwa ng עֲבָדָיו, na sa kontekstong maharlika ay maaari ring tumukoy sa mga opisyal.
- source_word: וַיְהִי לְתַנִּין
  choice: iyon ay naging isang malaking ahas
  rationale: Sa konteksto ng tandang ginawa gamit ang tungkod, malinaw sa karaniwang mambabasa ang “malaking ahas.” Gayunman, mas malawak ang saklaw ng תַּנִּין kaysa sa karaniwang salitang Hebreo para sa ahas, kaya pinananatili sa talababa ang tunay na leksikal na kalabuan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay tuwirang transliterasyon at hindi pagpapalit ng pangalan ng isang titulo.
- issue: Pagpapakahulugan sa תַּנִּין
  choice: malaking ahas, na may talababa
  alternative: dragon; malaking reptilya; nilalang na tulad ng dragon
  rationale: Ang konteksto ng tungkod na naging buhay na nilalang ay sumusuporta sa “ahas,” ngunit hindi dapat ikubli na ang terminong Hebreo ay maaari ring tumukoy sa isang malaking reptilya o nilalang na tulad ng dragon.
translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “sina” para sa tambalang pangalang pantangi, “kay Paraon” para sa likas na direksiyon tungo sa isang tao, at “mga lingkod” upang huwag labis na tukuyin bilang mga opisyal ang terminong may mas malawak na kahulugan.
