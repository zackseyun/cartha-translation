revisions:
- from: Kaya pumunta sina Moises at Aaron kay Paraon at ginawa nila ang iniutos ni Yahweh. Inihagis ni Aaron ang kanyang tungkod sa harap ni Paraon at ng mga lingkod nito, at iyon ay naging isang malaking ahas.[a]
  to: Pumunta sina Moises at Aaron kay Paraon, at ginawa nila ito ayon sa iniutos ni Yahweh. Pagkatapos, inihagis ni Aaron ang kanyang tungkod sa harap ni Paraon at sa harap ng kanyang mga lingkod, at ito ay naging ahas.[a]
  rationale: Inalis ang hindi sinusuportahang dagdag na “malaking” sa pangunahing teksto. Ang “ahas” ay angkop na kontekstuwal na salin, at ang talababa ang nag-iingat sa leksikal na lawak ng tannin. Nilinaw rin ang pagsunod sa utos ni Yahweh at ibinalik ang inuulit na pariralang “sa harap” nang walang pagbabago sa kahulugan.
