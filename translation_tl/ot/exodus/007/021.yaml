  text: וְ/הַ/דָּגָ֨ה אֲשֶׁר בַּ/יְאֹ֥ר מֵ֨תָה֙ וַ/יִּבְאַ֣שׁ הַ/יְאֹ֔ר וְ/לֹא יָכְל֣וּ מִצְרַ֔יִם לִ/שְׁתּ֥וֹת מַ֖יִם מִן הַ/יְאֹ֑ר וַ/יְהִ֥י הַ/דָּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: tl
  text: At namatay ang mga isda sa Nilo, at bumaho ang Nilo, kaya hindi makainom ang mga Ehipsiyo ng tubig mula sa Nilo. At nagkaroon ng dugo sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּגָה
  choice: ang mga isda
  rationale: Kolektibo ang anyong Hebreo at tumutukoy sa mga isda sa ilog; natural at malinaw sa modernong Tagalog ang maramihang “mga isda.”
- source_word: יְאֹר
  choice: Nilo
  rationale: Bagaman maaaring mangahulugang “ilog,” tiyak na Nilo ang tinutukoy nito sa konteksto ng Exodo.
- source_word: מֵתָה
  choice: namatay
  rationale: Pinananatili ang payak na kilos at pagkakasunod-sunod ng salaysay.
- source_word: וַיִּבְאַשׁ
  choice: bumaho
  rationale: Tuwiran at natural na inilalarawan ang paglabas ng masamang amoy nang hindi pinahihina ang tindi ng salaysay.
- source_word: וְלֹא יָכְלוּ
  choice: hindi makainom
  rationale: Likas na Tagalog na nagpapahayag ng kawalan ng kakayahang uminom sa sitwasyong ito.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: makainom ... ng tubig mula sa Nilo
  rationale: Hayagang pinananatili kapwa ang pag-inom at ang tubig bilang layon, gaya ng Hebreo.
- source_word: וַיְהִי הַדָּם
  choice: nagkaroon ng dugo
  rationale: Natural na eksistensiyal na pahayag sa Tagalog para sa Hebreong ויהי, nang hindi dinaragdagan kung paano naroon ang dugo.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: sa buong lupain ng Ehipto
  rationale: Malinaw na ipinahahayag ang lawak ng pangyayari sa lahat ng lupain ng Ehipto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang “Nilo” sa mismong teksto dahil malinaw ang heograpikong tinutukoy; hindi kailangan ang talababa. Pinanatili ang dalawang sugnay na may “At” upang katawanin ang sunod-sunod na anyo ng salaysay sa Hebreo.
