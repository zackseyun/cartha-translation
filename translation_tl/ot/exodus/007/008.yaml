  text: Then the LORD said to Moses and to Aaron, saying,
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Yahweh kina Moises at Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang “Yahweh” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahahayag ang waw-consecutive bilang pagpapatuloy ng salaysay sa natural na modernong Tagalog.
- source_word: לֵאמֹר
  choice: hindi hiwalay na isinalin
  rationale: Ang literal na “na sinasabi” ay hindi likas at kalabisan bago ang tuwirang pahayag sa Tagalog; naihahatid na ito ng pandiwang “sinabi” at ng kasunod na sipi.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kina Moises at Aaron
  rationale: Ang “kina” ang natural na panandang Tagalog para sa dalawang pangalang pantangi na tumatanggap ng pahayag.
theological_decisions:
- issue: Paglalahad sa banal na pangalan (Tetragrammaton)
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pinananatili ang personal na pangalan na nasa tekstong Hebreo at iniiwasang paghaluin ito sa titulong אֲדֹנָי; walang idinadagdag na denominasyonal na pagpapakahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kina” para sa likas na daloy; ang kuwit sa hulihan ay nagpapakitang ipinagpapatuloy ng susunod na talata ang sinabi ni Yahweh.
