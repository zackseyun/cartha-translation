  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: tl
  text: Ngunit tumigas[a] ang puso ng Paraon, at hindi siya nakinig sa kanila, gaya ng sinabi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “naging matigas.” Sa mas literal na diwa, ang pandiwang Hebreo ay “lumakas” o “naging matatag,” na dito ay tumutukoy sa pagtigas ng kalooban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: tumigas
  rationale: Ang pandiwang חזק ay literal na may diwang “lumakas/naging matatag,” ngunit sa kontekstong ito ay tumutukoy sa pagiging matigas ng kalooban. Ang “tumigas” ay natural sa Filipino at, bilang pandiwang walang tahasang ahente, hindi nito ipinapalagay kung sino ang tuwirang nagpatigas.
- source_word: לֵב
  choice: puso
  rationale: Karaniwang katumbas ng לֵב; dito ay tumutukoy sa panloob na pag-iisip, kalooban, at pagpapasya.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Karaniwang anyong Filipino ng titulong maharlika ng Ehipto.
- source_word: שָׁמַע אֲלֵהֶם
  choice: nakinig sa kanila
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o tumalima sa isang tao. Ang “nakinig sa kanila” ay malinaw at likas sa modernong Filipino.
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Ipinapakita ang pagtutugma ng nangyari sa naunang sinabi ni Yahweh.
- source_word: דִּבֶּר
  choice: sinabi
  rationale: Natural na salaysay sa Filipino para sa naunang pahayag; sapat na ipinahihiwatig ng konteksto ang naunang panahon nang hindi nangangailangan ng mabigat na konstruksiyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang ahente sa pagtigas ng puso ng Paraon
  choice: “Tumigas ang puso ng Paraon,” nang walang tahasang binanggit na ahente.
  alternative: “Pinatigas ang puso ng Paraon” o “Pinatigas ng Paraon ang kanyang puso.”
  rationale: Ang anyong Hebreo ay aktibo/intransitibo at walang tahasang ahente. Pinananatili ng salin ang tensiyon sa salaysay ng Exodo nang hindi ipinapalagay sa talatang ito na Diyos o ang Paraon ang tuwirang ahente.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “tumigas” upang maging madaling maunawaan at upang mapanatili ang kawalan ng tahasang ahente sa Hebreo.
