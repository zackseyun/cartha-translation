  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: tl
  text: Pumunta ka kay Paraon sa umaga. Tingnan mo, lumalabas siya patungo sa tubig. Pumuwesto ka upang salubungin siya sa pampang ng Nilo, at dalhin mo sa iyong kamay ang tungkod na naging ahas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: Pumunta ka kay Paraon
  rationale: Tuwirang utos ang לֵךְ, at natural sa modernong Tagalog ang “pumunta ka kay” kapag tao ang patutunguhan.
- source_word: בַּבֹּקֶר
  choice: sa umaga
  rationale: Karaniwan at malinaw na panahong pananalita sa Tagalog.
- source_word: הִנֵּה
  choice: Masdan mo
  rationale: Pinananatili nito ang pantawag-pansing lakas ng הִנֵּה sa isang marangal ngunit nauunawaang rehistro.
- source_word: יֹצֵא הַמַּיְמָה
  choice: lalabas siya patungo sa tubig
  rationale: Ang participle ay tumutukoy sa napipintong kilos sa konteksto, at ang hulaping pandireksiyon sa הַמַּיְמָה ay nagpapahiwatig ng pagpunta sa tubig.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: Pumuwesto ka upang salubungin siya
  rationale: Ang Nifal ng יצב ay may diwang paglalagay ng sarili sa isang takdang puwesto; malinaw na ipinahahayag ng “upang salubungin” ang layon ng לִקְרָאתוֹ nang hindi ipinapalagay na palaban ang pagtatagpo.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: sa pampang ng Nilo
  rationale: Ang שְׂפַת ay gilid o pampang, at sa salaysay ng Exodo ang יְאֹר ay partikular na tumutukoy sa Nilo.
- source_word: הַמַּטֶּה
  choice: tungkod
  rationale: Ang “tungkod” ang natural at kongkretong katumbas ng מַטֶּה sa salaysay tungkol kay Moises.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: na naging ahas
  rationale: Likas sa Tagalog ang “naging” para sa pagbabagong ipinahahayag ng נֶהְפַּךְ; ang “ahas” ang karaniwan at sapat na katumbas ng נָחָשׁ.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: dalhin mo sa iyong kamay
  rationale: Sa konteksto, ang utos ay dalhin ang tungkod habang pumupunta kay Paraon; pinananatili ng “sa iyong kamay” ang kongkretong pahayag ng Hebreo.
theological_decisions:
- issue: Tiyak na tinutukoy ng יְאֹר
  choice: Nilo
  alternative: ilog
  rationale: Sa kontekstong Ehipsiyo ng Exodo, ang יְאֹר ay karaniwang tumutukoy sa Ilog Nilo. Nililinaw ng tiyak na pangalan ang makasaysayang tagpuan nang walang idinaragdag na doktrinal na pagpapakahulugan.
- issue: Anyo ng pagbabagong נֶהְפַּךְ לְנָחָשׁ
  choice: naging ahas
  alternative: ginawang ahas
  rationale: Pinananatili ng “naging” ang pokus ng Hebreo sa nangyaring pagbabago nang hindi tahasang nagdaragdag ng gumaganap sa sugnay.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Masdan mo” upang mapanatili ang pantawag-pansing הִנֵּה, at “Pumuwesto ka” upang maipahayag ang mas tiyak na diwa ng וְנִצַּבְתָּ. Walang talababa dahil hindi kailangan para sa malinaw na pagbasa ng talata.
