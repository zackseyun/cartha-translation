    issue: Hindi angkop ang alternatibong “mga engkanto” sa talababa a.
    rationale: Ang alternatibong Ingles na “enchantments” ay mas wastong isalin bilang “mga enkantasyon,” hindi “mga engkanto,” na karaniwang mga nilalang sa kuwentong-bayan.
  - severity: low
