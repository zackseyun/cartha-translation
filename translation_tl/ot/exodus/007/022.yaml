    rationale: Ang talababa b ay tumutukoy lamang sa “tumigas ang puso ng Faraon”; ang paglipat ng pananda ay magpapalinaw sa saklaw nito.
  - severity: low
    issue: Medyo hindi likas ang “mga lihim na sining” sa kontekstong ito.
    rationale: Ang “mga lihim na salamangka” ay mas idiomatiko at malinaw na tumutukoy sa mga gawaing mahika nang hindi labis na tinutukoy ang paraan.
