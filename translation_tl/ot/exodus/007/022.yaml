  source_fidelity: Tumpak na naihahatid ng salin ang pagkagaya ng ginawa ng mga salamangkero, ang instrumental na diwa ng בְּלָטֵיהֶם, at ang hindi pagtukoy ng Hebreo sa sanhi o gumagawa ng pagtigas ng puso. Katanggap-tanggap na tukuyin ang panghalip na “kanila” bilang sina Moises at Aaron batay sa agarang konteksto.
  naturalness: Marangal at madaling basahin ang pangunahing salin. Gayunman, mas likas at mas malinaw sa modernong Tagalog ang “mga lihim na salamangka” kaysa “mga lihim na sining.” Ang “mga engkanto” sa talababa ay hindi angkop, sapagkat karaniwan itong tumutukoy sa mga nilalang na engkanto, hindi sa mga enkantasyon o gawaing pangmahika.
  terminology: Ang “Faraon,” “Ehipto,” “mga salamangkero,” at “Yahweh” ay angkop at pare-pareho. Pinananatili ng “tumigas ang puso ng Faraon” ang kalabuan ng Hebreo hinggil sa ahensiya.
  issues:
