base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: tl
  text: Ngunit gayon din ang ginawa ng mga salamangkero ng Ehipto sa pamamagitan ng kanilang mga lihim na salamangka[a]. Tumigas ang puso ng Faraon[b], at hindi niya pinakinggan sina Moises at Aaron, gaya ng sinabi ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa pamamagitan ng kanilang mga enkantasyon” o “sa pamamagitan ng kanilang mga sining ng mahika.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “naging matigas ang puso ng Faraon.” Hindi tahasang sinasabi ng Hebreo sa talatang ito kung sino ang sanhi ng pagtigas ng kanyang puso.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: gayon din ang ginawa
  rationale: Likas sa modernong Tagalog at malinaw na iniuugnay ang ginawa ng mga salamangkero sa naunang ginawa nina Moises at Aaron.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: mga salamangkero ng Ehipto
  rationale: Tumutukoy sa mga dalubhasa sa ritwal at mahika sa korte ng Faraon; ang 'mga salamangkero' ang pinakamalinaw na katumbas sa konteksto.
- source_word: בְּלָטֵיהֶם
  choice: sa pamamagitan ng kanilang mga lihim na sining
  rationale: Pinananatili ang instrumental na diwa ng pang-ukol at ang ideya ng tago o mahiwagang mga gawain nang hindi labis na tinutukoy ang pamamaraan.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: tumigas ang puso ng Faraon
  rationale: Inilalarawan ang kinalabasan nang hindi tahasang nagtatalaga kung sino ang sanhi ng pagtigas, gaya ng Hebreo sa talatang ito.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: hindi niya pinakinggan sina Moises at Aaron
  rationale: Ang שׁמע אֶל ay nangangahulugang makinig o tumalima. Nilinaw ang tinutukoy ng panghalip ayon sa konteksto upang maging natural sa Tagalog.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Natural na salaysay sa Tagalog at tumutukoy sa naunang pahayag ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton.
theological_decisions:
- issue: Ang sanhi ng pagtigas ng puso ng Faraon
  choice: tumigas ang puso ng Faraon
  alternative: pinatigas ang puso ng Faraon; pinatigas ng Faraon ang kanyang puso
  rationale: Hindi tahasang binabanggit ng sugnay na Hebreo ang gumagawa o sanhi ng pagtigas. Pinananatili ng intransitibong anyo ang sadyang kalabuan at teolohikal na tensiyon ng teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang 'Faraon' at 'Ehipto' bilang karaniwang anyong biblikal sa Tagalog. Inilagay ang pangalan nina Moises at Aaron sa halip na malabong panghalip upang maging malinaw ang tinutukoy, habang walang idinaragdag na bagong proposisyon.
