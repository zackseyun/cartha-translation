base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: tl
  text: Kaya ginawa nina Moises at Aaron ang eksaktong iniutos sa kanila ni Yahweh[a]; gayon ang ginawa nila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “YHWH”; tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ginawa
  rationale: Malawak ang saklaw ng עשה (‘gawin/lumikha’), ngunit sa konteksto ng pagsunod sa utos, likas ang ‘ginawa’ at napapanatili nito ang pag-uulit ng pandiwa sa hulihan.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: nina Moises at Aaron
  rationale: Karaniwang anyo sa modernong Tagalog ang ‘Moises’ at ‘Aaron’; ginagamit ang ‘nina’ dahil kapuwa sila ang gumagawa ng kilos.
- source_word: כַּאֲשֶׁר
  choice: ang mismong
  rationale: Ipinahahayag nito ang ganap na pagtutugma ng kanilang ginawa sa iniutos, katumbas ng diwang ‘ayon mismo sa’ o ‘kung ano mismo ang.’
- source_word: צִוָּה
  choice: iniutos
  rationale: Ang צוה ay tumutukoy sa pagbibigay ng utos. Sapat nang ipinakikita ng aspektong Filipino at ng konteksto na nauna ang utos sa pagsunod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang tetragrammaton bilang personal na pangalan ng Diyos sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: אֹתָם
  choice: sa kanila
  rationale: Tumutukoy ang hulaping pangmaramihan kina Moises at Aaron; ang ‘sa kanila’ ang likas na kaganapan ng pandiwang ‘iniutos’ sa Tagalog.
- source_word: כֵּן
  choice: gayon nga
  rationale: Binibigyang-diin nito na eksaktong tumugma ang kanilang ginawa sa utos; natural na naihahatid ng ‘gayon nga’ ang pagpapatibay.
- source_word: עָשׂוּ
  choice: ang ginawa nila
  rationale: Pinananatili ang sadyang pag-uulit ng עשה, na nagbibigay-diin sa kanilang pagsunod, nang hindi nagiging pilit sa Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang pangalan sa halip na palitan ito ng titulo, habang ipinapaliwanag sa talababa ang tradisyonal na salin.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang pag-uulit ng pandiwang ‘ginawa’ upang maipakita ang diin ng Hebreo sa ganap na pagsunod nina Moises at Aaron.
