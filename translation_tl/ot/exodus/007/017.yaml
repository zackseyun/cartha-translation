  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: tl
  text: 'Ganito ang sabi ni Yahweh: “Sa pamamagitan nito ay malalaman mong ako si Yahweh: Masdan mo, hahampasin ko ng tungkod na nasa kamay ko ang tubig[a] sa Nilo, at magiging dugo iyon.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, maramihan ang “mga tubig,” at maramihan din ang kasunod na pandiwa: “at ang mga iyon ay magiging dugo.” Ginagamit dito ang likas na pangngalang di-mabilang na “tubig” sa Tagalog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Ganito ang sinabi ni Yahweh
  rationale: Pinananatili ang pormal na pormula ng paghahayag, ngunit gumagamit ng likas at dignified na modernong Tagalog. Ang pangalang יְהוָה ay isinasalin bilang “Yahweh.”
- source_word: בְּזֹאת תֵּדַע
  choice: Sa pamamagitan nito ay malalaman mo
  rationale: Ipinakikita ng בְּ ang paraang gagamitin upang magkaroon ng pagkilala, at ang imperfect na תֵּדַע ay may puwersang panghinaharap sa konteksto.
- source_word: כִּי אֲנִי יְהוָה
  choice: na ako si Yahweh
  rationale: Likas sa Tagalog ang “ako si” sa tuwirang pagpapakilala sa sarili, at pinananatili nito ang diin sa personal na pangalan ng Diyos.
- source_word: הִנֵּה
  choice: Masdan mo
  rationale: Nagbibigay ito ng biglaang diin at tumatawag sa pansin sa nalalapit na pagkilos; bahagyang mataas ang rehistro ngunit malinaw pa rin sa karaniwang mambabasa.
- source_word: אָנֹכִי מַכֶּה
  choice: hahampasin ko
  rationale: Ang participle ay naglalarawan ng malinaw at nalalapit na pagkilos. Sa Tagalog, mas likas ang panghinaharap na “hahampasin ko” kaysa literal na progresibo, habang napapanatili ng “Masdan mo” ang pagkaapurahan.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: ng tungkod na nasa kamay ko
  rationale: Ang “tungkod” ay karaniwan at angkop na katumbas ng מַטֶּה, at pinananatili ang sugnay na nagbibigay-diin sa kasangkapang hawak ng nagsasalita.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: ang tubig sa Nilo
  rationale: Sa Tagalog, likas na tuwirang layon ng “hahampasin” ang tubig. Sa konteksto ng Exodo, ang יְאֹר ay tumutukoy sa Nilo, hindi lamang sa isang pangkalahatang ilog.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: at magiging dugo iyon
  rationale: Malinaw na ipinahahayag ang pagbabagong resulta. Ang isahang “iyon” ay umaayon sa likas na paggamit sa Tagalog ng “tubig” bilang pangngalang di-mabilang, habang ipinapaliwanag sa talababa ang maramihang anyo sa Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili sa pagkakakilanlang sentral sa pahayag na “ako si Yahweh” nang hindi pinapalitan ito ng isang titulo.
- issue: Puwersa ng אָנֹכִי מַכֶּה
  choice: hahampasin ko
  alternative: hinahampas ko; hahampasin ko na
  rationale: Maaaring ihatid ng participle ang kasalukuyan o nalalapit na pagkilos. Pinili ang likas na panghinaharap sa Tagalog dahil ang hampas ay ipinahahayag bilang nalalapit pa lamang, ngunit pinanatili ng “Masdan mo” ang masiglang pagkaapurahan ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at dignified. Pinanatili ang bahagyang maringal na “Masdan mo” upang ihatid ang diin ng הִנֵּה, ngunit iniwasan ang lipas o labis na pormal na pananalita.
