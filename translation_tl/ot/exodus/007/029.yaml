  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: tl
  text: Aahon ang mga palaka sa iyo, sa iyong bayan[a], at sa lahat ng iyong mga lingkod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa gitna ng iyong bayan.” Iisa ang pang-ukol na ginamit sa Hebreo sa tatlong parirala, ngunit ipinahihiwatig ng konteksto na darating ang mga palaka kay Faraon at sa buong nasasakupan niya bilang isang salot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה (בְּךָ)
  choice: sa iyo
  rationale: Sa konteksto ng salot, ang בְּ kasama ng עָלָה ay nagpapahayag na darating at dadapo ang mga palaka kay Faraon bilang kapahamakan. Pinananatili ng “sa iyo” ang maikli at tuwirang anyo nang hindi pinapalitan ng mas interpretibong “laban sa iyo.”
- source_word: וּבְעַמְּךָ
  choice: sa iyong bayan
  rationale: Inuulit sa Hebreo ang parehong pang-ukol. Ang “sa iyong bayan” ay likas sa Filipino at maaaring magpahiwatig kapwa ng pagdating sa kanila at pagkalat sa gitna nila; inilalahad sa talababa ang tunay na alternatibong diwa.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: sa lahat ng iyong mga lingkod
  rationale: Ang עֶבֶד ay maaaring tumukoy sa lingkod, alipin, o opisyal. Ang “mga lingkod” ang pinakamalawak na salin at angkop sa pakikipag-usap kay Faraon nang hindi labis na tinutukoy ang kanilang katayuan.
- source_word: יַעֲלוּ
  choice: Aahon
  rationale: Ang עָלָה ay nangangahulugang umakyat o umahon. Sa konteksto ng mga palakang lumalabas mula sa tubig, malinaw at natural ang “aahon” at napapanatili nito ang direksiyon ng kilos.
- source_word: הַצְפַרְדְּעִים
  choice: ang mga palaka
  rationale: Pinananatili ng “ang” ang tiyak na pantukoy sa Hebreo at tinutukoy ang ipinahayag na salot ng mga palaka.
