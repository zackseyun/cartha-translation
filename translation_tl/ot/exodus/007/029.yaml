translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “aahon” upang panatilihin ang konkretong kilos mula sa pinagmulang teksto, at “mga lingkod” bilang malawak at hindi labis na interpretibong tawag sa mga nasasakupan ni Faraon.
