  source_fidelity: Tumpak ang salin sa Hebreong teksto. Naihatid ang pagsulong ng salaysay sa “Pagkatapos,” ang pangalang Yahweh, ang literal na metaporang כָּבֵד sa “Mabigat,” ang patuloy na pagtanggi sa “ayaw niya,” at ang payagang makaalis na diwa ng לְשַׁלַּח. Hindi idinagdag ang “Israel,” alinsunod sa הָעָם (“ang bayan”).
  naturalness: Likas at malinaw ang daloy sa makabagong Filipino. Bagama’t ang “mabigat ang puso” ay maaari ring magpahiwatig ng dalamhati o pagkabalisa sa karaniwang gamit, sinasadyang pinananatili nito ang metapora ng Hebreo, at sapat na nililinaw ito ng talababa.
  terminology: Wasto at pare-pareho ang “Yahweh,” “Moises,” at “Paraon.” Ang “puso” ay angkop na katumbas ng לֵב sa paglalarawan ng panloob na disposisyon. Ang alternatibong “matigas ang puso” sa talababa ay angkop ngunit hindi ipinapalit sa naiibang metaporang “mabigat” sa pangunahing teksto.
