  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Mabigat[a] ang puso ng Paraon; ayaw niyang payagang umalis ang bayan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Matigas ang puso ng Paraon.” Literal na “mabigat” ang pang-uri sa Hebreo; metapora ito para sa pagiging mapagmatigas o hindi tumutugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay. Likas sa makabagong Filipino ang “Pagkatapos, sinabi” upang ipakita ang pagkakasunod-sunod ng mga pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa Filipino.
- source_word: כָּבֵד
  choice: Mabigat
  rationale: Ang pang-uri ay literal na “mabigat.” Pinananatili ng salin ang kongkretong metapora para sa matigas, mapagmatigas, o hindi tumutugong kalooban.
- source_word: לֵב פַּרְעֹה
  choice: ang puso ng Paraon
  rationale: Tuwirang inililipat ang ugnayang construct sa likas na pariralang Filipino, habang pinananatili ang “puso” bilang sentro ng disposisyon at pagpapasiya.
- source_word: מֵאֵן
  choice: ayaw niya
  rationale: Ipinapahayag nito ang nagpapatuloy na pagtanggi o kawalan ng pagnanais ng Paraon; natural na naihahatid iyon ng “ayaw niya” sa Filipino.
- source_word: לְשַׁלַּח
  choice: payagang umalis
  rationale: Sa konteksto ng Exodo, tumutukoy ito sa pagpapalaya o pagpapahintulot sa bayan na umalis. Iniiwasan ng parirala ang posibleng kahulugan ng “paalisin” na sapilitang pagtataboy.
- source_word: הָעָם
  choice: ang bayan
  rationale: “Bayan” ang natural at kolektibong tawag sa tinutukoy na people. Hindi idinagdag ang “Israel” sapagkat wala iyon sa mismong talata.
theological_decisions:
- issue: Paglalarawan sa kalagayan ng puso ng Paraon nang hindi pinapantay ang magkakaibang salitang Hebreo sa tema ng pagpapatigas
  choice: Mabigat ang puso ng Paraon
  alternative: Matigas ang puso ng Paraon
  rationale: כָּבֵד ang ginamit dito, na literal na “mabigat,” hindi ang ibang salitang karaniwang isinasaling “matigas.” Pinananatili nito ang natatanging metapora at hindi agad nilulutas ang teolohikal na tensiyon ng mga salaysay tungkol sa puso ng Paraon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong metaporang “mabigat ang puso,” ngunit nilagyan ng talababa upang maipaliwanag ang idyomatikong kahulugan nito.
