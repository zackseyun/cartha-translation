base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: tl
  text: Kapag magsalita sa inyo ang Paraon at sabihin, “Magpakita kayo ng isang tanda,” sabihin mo kay Aaron, “Kunin mo ang iyong tungkod at ihagis mo ito sa harap ng Paraon; maging ahas[a] ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay maaari ring tumukoy sa isang malaking reptilya o nilalang na tulad ng dragon.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala rito ang isang inaasahang pangyayari sa hinaharap, hindi isang dahilan; likas itong ipinahahayag sa Filipino sa pamamagitan ng “kapag.”
- source_word: יְדַבֵּר אֲלֵיכֶם
  choice: sinabi sa inyo
  rationale: Ang maramihang “inyo” ay pinanatili sapagkat kina Moises at Aaron nakatuon ang pananalita, samantalang ang kasunod na utos kay Moises ay isahan.
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: Magpakita kayo ng isang tanda
  rationale: Ang literal na “magbigay kayo para sa inyong sarili” ay hindi likas sa Filipino. Sa kontekstong ito, humihingi ang Paraon ng tandang maipakikita nila; pinananatili ng maramihang “kayo” ang anyo ng Hebreo.
- source_word: מוֹפֵת
  choice: tanda
  rationale: Tumutukoy ito sa isang pambihira o makahimalang palatandaan. Ang “tanda” ang malinaw at hindi labis na nagpapakahulugan na katumbas sa konteksto.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: sabihin mo kay Aaron
  rationale: Pinanatili ang isahang utos kay Moises at ang sunod-sunod na daloy ng tagubilin.
- source_word: מַטְּךָ
  choice: iyong tungkod
  rationale: Ang “tungkod” ang karaniwan at angkop na salin para sa bagay na hawak ni Aaron.
- source_word: וְהַשְׁלֵךְ לִפְנֵי פַרְעֹה
  choice: ihagis iyon sa harap ng Paraon
  rationale: Tuwirang inilalarawan ang paghagis ng tungkod sa kinaroroonan at harapan ng Paraon.
- source_word: יְהִי
  choice: maging
  rationale: Pinananatili ng anyong pautos/pahintulot ang jussive na pahiwatig ng Hebreo sa halip na gawing payak na prediksiyon.
- source_word: תַנִּין
  choice: malaking ahas
  rationale: Mas malawak ang kahulugan nito kaysa sa karaniwang salitang Hebreo para sa ahas at maaari itong tumukoy sa isang malaking reptilya o nilalang na tulad ng dragon. Sa salaysay na ito, ang “malaking ahas” ay likas at angkop, habang ipinapakita sa talababa ang mas malawak na saklaw.
theological_decisions:
- issue: Pagpapakahulugan sa תַנִּין sa tanda ng tungkod
  choice: malaking ahas
  alternative: nilalang na tulad ng dragon o malaking reptilya
  rationale: Pinapaboran ng agarang konteksto ang isang nilalang na kahawig ng ahas, ngunit hindi nililimitahan ng salin nang walang paliwanag ang mas malawak na saklaw ng salitang Hebreo. Kaya pinanatili sa talababa ang tunay na leksikal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakaiba ng maramihang “inyo/kayo” para kina Moises at Aaron at ng isahang “mo” sa tagubilin kay Moises. Inilagay ang talababa sa mismong salitang “malaking ahas,” na siyang tinutukoy nito.
