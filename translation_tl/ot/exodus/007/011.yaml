base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: tl
  text: Pagkatapos, ipinatawag din ng Paraon ang mga pantas at mga mangkukulam, at ginawa rin ng mga salamangkero ng Ehipto ang gayon sa pamamagitan ng kanilang mga lihim na sining.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng kanilang mga salamangka.” Maaaring tumukoy ang salitang Hebreo sa mga okultong gawain o mga salamangka; hindi tiyak ang eksaktong diwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ipinatawag
  rationale: Sa kontekstong ito, ang קרא ay pagpapatawag sa mga tao upang humarap sa Paraon; natural at tiyak ang “ipinatawag” sa Filipino.
- source_word: גַּם
  choice: din
  rationale: Ipinakikitang tumugon din ang Paraon sa naunang ginawa nina Moises at Aaron.
- source_word: חֲכָמִים
  choice: mga pantas
  rationale: Tumutukoy ito sa mga marurunong o dalubhasa sa korte; dignificado at pamilyar ang “mga pantas.”
- source_word: מְכַשְּׁפִים
  choice: mga mangkukulam
  rationale: Tiyak na tumutukoy ang salitang ito sa mga nagsasagawa ng pangkukulam at pinananatili nitong naiiba ang katawagan sa kasunod na חַרְטֻמִּים.
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: gayon din ang ginawa
  rationale: Natural na Filipino ito para sa idyomang Hebreo na nagsasaad na ginaya o inulit nila ang naunang tanda.
- source_word: גַם הֵם
  choice: gayon din
  rationale: Pinananatili nito ang diin na ang mga dalubhasa ng Ehipto ay gumawa rin ng katulad na bagay.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: mga salamangkero ng Ehipto
  rationale: Malinaw itong tawag sa mga ritwal na dalubhasa ng Ehipto at iniiwasang ipareho sila sa naunang “mga mangkukulam.”
- source_word: בְּלַהֲטֵיהֶם
  choice: sa pamamagitan ng kanilang mga enkanto
  rationale: Ipinahahayag nito ang paraang kaugnay ng lihim o okultong gawain nang hindi ipinapaliwanag kung ito ay tunay na kapangyarihan, panlilinlang, o ibang mekanismo.
theological_decisions:
- issue: Kalikasan ng kapangyarihan ng mga salamangkero ng Ehipto
  choice: Sabihing ginawa rin nila iyon “sa pamamagitan ng kanilang mga enkanto” nang hindi tinutukoy ang mekanismo.
  alternative: Tukuying iyon bilang tunay na kapangyarihang sobrenatural o bilang panlilinlang lamang.
  rationale: Isinasalaysay ng Hebreo na nagawa nila ang katulad na bagay sa pamamagitan ng kanilang לַהֲטִים, ngunit hindi nito nililinaw kung paano iyon nangyari. Dapat panatilihin ng salin ang ganitong kalabuan.
translation_notes:
  register: Makabago ngunit dignipikadong Filipino. Ginamit ang “Paraon,” “mga pantas,” “mga mangkukulam,” at “mga salamangkero” upang maging malinaw sa karaniwang mambabasa habang pinananatili ang pagkakaiba ng mga katawagang Hebreo.
