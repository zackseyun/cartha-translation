  to: Naghukay ang lahat ng Ehipsiyo sa paligid ng Nilo[a] upang makakuha ng tubig na maiinom, sapagkat hindi sila makainom ng tubig mula sa Nilo.
  rationale: Pinalitan ang “hindi nila mainom” ng “hindi sila makainom” upang tumpak na maipahayag ang kawalan ng kakayahang uminom na nasa Hebreo at maiwasan ang posibleng pahiwatig ng hindi pagkaubos. Bahagya ring inayos ang parirala para sa mas likas na modernong Tagalog, habang pinananatili ang kahulugan at talababa.
