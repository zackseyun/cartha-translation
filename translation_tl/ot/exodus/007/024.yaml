  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: tl
  text: Naghukay ang lahat ng Ehipsiyo sa paligid ng Nilo[a] upang makakuha ng tubig na maiinom, sapagkat hindi sila makainom ng tubig mula sa Nilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ilog” (ye’or); sa Exodo, ang salitang ito ay partikular na tumutukoy sa Nilo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: Naghukay
  rationale: Tuwirang ipinapahayag ng חפר ang paghuhukay. Hindi idinagdag ang “ng mga balon” dahil walang tahasang binabanggit na balon sa Hebreo.
- source_word: כָל מִצְרַיִם
  choice: ang lahat ng Ehipsiyo
  rationale: Bagaman literal na maaaring “buong Ehipto,” tumutukoy rito ang kolektibong parirala sa mga taong tumugon sa salot.
- source_word: סְבִיבֹת הַיְאֹר
  choice: sa paligid ng Nilo
  rationale: Likas na Tagalog ito para sa mga lugar sa palibot ng ilog, at ang יְאֹר sa salaysay ng Exodo ay partikular na tumutukoy sa Nilo.
- source_word: מַיִם לִשְׁתּוֹת
  choice: upang makakuha ng maiinom na tubig
  rationale: Ipinahahayag nito nang natural sa Tagalog ang layunin ng paghuhukay. Ang “makakuha” ay ipinahiwatig ng konteksto at hindi nagdaragdag ng uri ng hukay na hindi binanggit sa teksto.
- source_word: כִּי לֹא יָכְלוּ
  choice: sapagkat hindi nila mainom
  rationale: Ang כִּי ay nagbibigay ng dahilan, at malinaw na naipapahayag ng “sapagkat” ang ugnayang iyon.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: mainom ang tubig mula sa Nilo
  rationale: Pinananatili ng “mula sa” ang diwa ng מִן bilang pinagmulan ng tubig, sa natural na ayos ng modernong Tagalog.
