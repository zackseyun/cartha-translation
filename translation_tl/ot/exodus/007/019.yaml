revisions:
- from: Pagkatapos, sinabi ni Yahweh kay Moises, “Sabihin mo kay Aaron, ‘Kunin mo ang iyong tungkod at iunat mo ang iyong kamay sa ibabaw ng mga tubig ng Ehipto—sa mga ilog nito, sa mga kanal nito ng Nilo, sa mga lawa nito, at sa lahat ng tipunan ng tubig nito—upang maging dugo ang mga iyon. Magkakaroon ng dugo sa buong lupain ng Ehipto, maging sa mga sisidlang yari sa kahoy at bato[a].’”
  to: Pagkatapos, sinabi ni Yahweh kay Moises, “Sabihin mo kay Aaron, ‘Kunin mo ang iyong tungkod at iunat mo ang iyong kamay sa ibabaw ng mga tubig ng Ehipto—sa mga ilog nito, sa mga kanal ng Nilo, sa mga lawa nito, at sa lahat ng tipunan ng tubig nito—upang ang mga ito ay maging dugo. Magkakaroon ng dugo sa buong lupain ng Ehipto, maging sa mga sisidlang yari sa kahoy at bato[a].’”
  rationale: Inayos ang hindi likas na ayos ng “mga kanal nito ng Nilo” nang hindi isinasantabi ang kaugnayan ng יְאֹרִים sa Nilo. Pinakinis din ang pagpapahayag ng resultang “maging dugo.” Pinanatili ang maingat na pangunahing salin para sa kahoy at bato at ang talababa upang hindi maitago ang elipsis at natitirang kalabuan ng Hebreo.
