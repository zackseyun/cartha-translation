source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Sabihin mo kay Aaron, ‘Kunin mo ang iyong tungkod at iunat mo ang iyong kamay sa ibabaw ng mga tubig ng Ehipto—sa mga ilog nito, sa mga kanal ng Nilo, sa mga lawa nito, at sa lahat ng tipunan ng tubig nito—upang ang mga ito ay maging dugo. Magkakaroon ng dugo sa buong lupain ng Ehipto, maging sa mga sisidlang yari sa kahoy at bato[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “sa kahoy at sa bato.” Malamang na tumutukoy ito sa mga sisidlang yari sa kahoy at bato.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos bilang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: מַטְּךָ
  choice: iyong tungkod
  rationale: Ang “tungkod” ay likas at tiyak na katumbas sa modernong Tagalog para sa konkretong bagay na tinutukoy sa salaysay.
- source_word: וּנְטֵה יָדְךָ
  choice: iunat mo ang iyong kamay
  rationale: Malapit ito sa idyomang Hebreo at malinaw na naghahayag ng iniutos na simbolikong kilos.
- source_word: מֵימֵי מִצְרַיִם
  choice: mga tubig ng Ehipto
  rationale: Pinananatili nito ang kolektibo at malawak na saklaw ng parirala, na saka inilalarawan ng kasunod na talaan.
- source_word: נַהֲרֹתָם
  choice: mga ilog nito
  rationale: Ang נָהָר ay pangkalahatang tawag sa ilog o malaking batis; “ilog” ang malinaw na katumbas at naibubukod ito sa יְאֹרִים.
- source_word: יְאֹרֵיהֶם
  choice: mga kanal nito ng Nilo
  rationale: Sa kontekstong Ehipsiyo, tumutukoy ang יְאֹר sa mga daanang-tubig na kaugnay ng Nilo. Pinananatili ng salin ang lokal na katiyakan at ang pagkakaiba nito sa naunang “mga ilog.”
- source_word: אַגְמֵיהֶם
  choice: mga lawa nito
  rationale: Ang אָגַם ay maaaring tumukoy sa lawa, tipunang tubig, o latian. Ang “mga lawa” ay maikli at madaling maunawaan, bagaman hindi nito isinasara ang posibilidad ng mababaw o malatiang tubigan.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: lahat ng tipunan ng tubig nito
  rationale: Ang מִקְוֶה ay isang natipon o naipong katawan ng tubig. Ang “tipunan ng tubig” ay nagpapanatili sa malawak na kahulugan nang hindi nagpapalagay na artipisyal na imbakan lamang ang tinutukoy.
- source_word: וְיִהְיוּ דָם
  choice: upang maging dugo ang mga iyon
  rationale: Ipinahahayag nito ang nilalayong resulta ng mga pautos at nililinaw na ang tinutukoy ay ang mga tubig na katatapos ilista.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: maging sa mga sisidlang yari sa kahoy at bato
  rationale: Malamang na metonimiya ang mga materyales para sa mga sisidlang yari sa mga iyon. Ginagawang malinaw ng salin ang kahulugan sa konteksto, habang inilalagay sa talababa ang literal at eliptikong anyo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo o ng ibang tradisyonal na anyo.
- issue: Kahulugan ng וּבָעֵצִים וּבָאֲבָנִים
  choice: mga sisidlang yari sa kahoy at bato
  alternative: literal na “sa kahoy at sa bato”
  rationale: Ang konteksto ay tungkol sa tubig sa mga likas na daluyan at sa mga pinaglalagyan nito. Malamang na ang kahoy at bato ay tumutukoy sa mga sisidlang gawa sa mga materyales na iyon, ngunit pinananatili sa talababa ang tunay na elipsis ng Hebreo.
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang sunod-sunod na pagbanggit sa iba’t ibang uri ng tubig at ang pag-uulit ng “sa” upang madama ang lawak ng utos. Ang “tipunan ng tubig” ay sadyang bahagyang pormal upang mapanatili ang malawak na kahulugan ng Hebreo.
