  naturalness: Kailangan ng maliit na pag-aayos sa “mga kanal nito ng Nilo,” na hindi likas na pagkakaugnay ng mga panuring sa modernong Tagalog. Mas malinaw at natural ang “mga kanal ng Nilo.” Inayos din ang “upang maging dugo ang mga iyon” tungo sa mas tuwirang “upang ang mga ito ay maging dugo.”
  terminology: Ang “Yahweh,” “Moises,” “Aaron,” “tungkod,” “tipunan ng tubig,” at “sisidlan” ay angkop sa modernong Filipino Tagalog at sa pormal na rehistro ng salaysay. Ang “mga lawa” para sa אַגְמֵיהֶם ay katanggap-tanggap bilang malawak na katawagan, bagaman maaari ring magpahiwatig ang Hebreo ng mga latian o pond; hindi kailangang dagdagan ng talababa rito.
