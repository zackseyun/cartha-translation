translation:
  language: tl
  text: at limang baras para sa mga tabla sa ikalawang panig[a] ng Tabernakulo, at limang baras para sa mga tabla sa panig ng Tabernakulo na nasa likuran, sa gawing kanluran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kabilang panig.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa likuran, pakanluran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: mga baras
  rationale: Tumutukoy ito sa mahahabang pahalang na piyesang nagdurugtong at nagpapatatag sa mga tabla. Ang “mga baras” ay tuwiran at hindi labis na nagpapakahulugan sa anyo ng mga ito.
- source_word: קַרְשֵׁי
  choice: mga tabla
  rationale: Sa konteksto ng pagtatayo ng Tabernakulo, tumutukoy ito sa mga kahoy na bahaging bumubuo sa estruktura. Likas at malinaw sa modernong Filipino ang “mga tabla.”
- source_word: צֶלַע
  choice: panig
  rationale: Ang salita ay tumutukoy rito sa isang panig ng estruktura, hindi sa literal na tadyang o isang indibidwal na piyesa.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Pinananatili nito ang tuwirang kahulugan ng Hebreo, bagaman ayon sa konteksto ay maaari rin itong mangahulugang “kabilang.”
- source_word: הַמִּשְׁכָּן
  choice: Tabernakulo
  rationale: Bagaman kaugnay ng ideya ng “tirahan” ang salitang Hebreo, dito ito ang nakatalagang tawag sa banal na toldang santuwaryo. Ang “Tabernakulo” ay malinaw at kinikilalang katawagan sa Filipino.
- source_word: לַיַּרְכָתַיִם
  choice: sa likurang panig
  rationale: Ipinapahayag nito nang natural sa Filipino ang pinakamalayo o hulihang bahagi ng Tabernakulo.
- source_word: יָמָּה
  choice: sa gawing kanluran
  rationale: Ang anyong paturol sa Hebreo ay nangangahulugang “pakanluran”; sa paglalarawan ng lokasyon, mas natural sa Filipino ang “sa gawing kanluran.”
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: at limang ... at limang
  rationale: Pinananatili ang inuulit na pang-ugnay at bilang, na angkop sa sunod-sunod na tagubilin sa pagtatayo.
