base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: tl
  text: 'Gumawa ka ng apatnapung patungang pilak[a] sa ilalim ng dalawampung balangkas[b]: dalawang patungan sa ilalim ng isang balangkas para sa dalawang usli nito[c], at dalawang patungan sa ilalim ng kasunod na balangkas para sa dalawang usli nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “mga saksakang pilak”; ang salitang Hebreo ay tumutukoy sa isang patungan na parang socket sa kayarian ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Ayon sa tradisyon, “mga tabla.” Malamang na tumutukoy ang Hebreo sa patayong mga sangkap ng kayarian ng tabernakulo.
    reason: lexical_alternative
  - marker: c
    text: Literal na “dalawang kamay nito”; dito, tumutukoy ito sa dalawang nakausling bahagi ng bawat balangkas na ipinapasok sa mga patungan.
    reason: lexical_explanation
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: patungang pilak
  rationale: Sa pagtatayo ng tabernakulo, ang אֶדֶן ay suportang nasa ilalim na maaari ring ilarawan bilang isang socket. Likas at malinaw sa Filipino ang “patungan,” habang pinananatili sa talababa ang mas teknikal na alternatibo.
- source_word: תַּעֲשֶׂה
  choice: Gumawa ka
  rationale: Ang Qal imperfect na ikalawang panauhang panlalaki ay may puwersang pautos sa kontekstong ito. Ang “Gumawa ka” ay tuwiran at natural na tagubilin sa modernong Filipino.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang ipinahahayag nito ang kinalalagyan ng mga patungan kaugnay ng mga balangkas.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: balangkas
  rationale: Ang קֶרֶשׁ ay tumutukoy sa mga patayong sangkap ng kayarian ng tabernakulo. Mas malinaw na naihahatid ng “balangkas” ang gamit nitong pang-istruktura kaysa sa simpleng “tabla.”
- source_word: שְׁנֵי אֲדָנִים
  choice: dalawang patungan
  rationale: Pinananatili nito ang bilang at ang pare-parehong salin ng אֶדֶן sa buong talata.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: para sa dalawang usli nito
  rationale: Bagaman literal na “dalawang kamay nito,” ang יָדוֹת dito ay terminong pangkayarian para sa nakausling mga bahaging ipinapasok sa mga patungan. Ang “usli” ay malinaw sa karaniwang mambabasa nang hindi nagpapanggap ng higit na teknikal na katiyakan kaysa sa Hebreo.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: isang balangkas ... kasunod na balangkas
  rationale: Ang pag-uulit ng “isa” sa Hebreo ay distributibo. Natural sa Filipino ang “isang ... kasunod na” at malinaw na dalawang patungan ang para sa bawat balangkas.
