  terminology: Pare-pareho ang salin ng אֶדֶן bilang “patungan.” Ang “balangkas” ay isang katanggap-tanggap na makabagong salin ng קֶרֶשׁ sa kontekstong ito, at maingat na ipinapaliwanag ng mga talababa ang tradisyonal at teknikal na mga alternatibo. Hindi ipinapasok ng salin ang anumang doktrinal na pagpapakahulugan.
