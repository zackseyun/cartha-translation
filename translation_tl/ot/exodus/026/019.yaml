  source_fidelity: Tumpak na naihahatid ang utos na gumawa ng apatnapung pilak na patungan sa ilalim ng dalawampung balangkas, tig-dalawa para sa dalawang usli ng bawat balangkas. Ang distributibong gamit ng inuulit na Hebreong “ang isa” ay natural na naipahayag sa “isang balangkas” at “kasunod na balangkas,” nang walang pagbabagong bilang o ugnayang pangkayarian.
