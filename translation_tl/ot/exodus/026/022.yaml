translation:
  language: tl
  text: At para sa likurang bahagi ng tabernakulo[a], sa gawing kanluran, gagawa ka ng anim na tabla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga balangkas” sa halip na “mga tabla,” kung ang mga bahaging estruktural ay inuunawa bilang mga balangkas na bukás sa gitna sa halip na mga solidong tabla.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: At para sa likurang bahagi ng
  rationale: Ang anyong konstrukto na may pang-ukol ay tumutukoy sa malayong dulo o likurang bahagi ng estruktura; natural at malinaw sa Filipino ang “likurang bahagi.”
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang nakaugaliang katawagan sa Filipino para sa banal na tolda o santuwaryong inilalarawan sa Exodo, at pinananatili nito ang tiyak na reperensiyang arkitektural.
- source_word: יָמָּה
  choice: sa gawing kanluran
  rationale: Bagaman literal na kaugnay ng direksiyong patungo sa dagat, karaniwan itong nangangahulugang kanluran; ang parirala ay malinaw na nagsasaad ng kinalalagyan.
- source_word: תַּעֲשֶׂה
  choice: gagawa ka
  rationale: Ang Qal imperfect na pangalawang panauhang panlalaki ay may puwersang tagubilin sa kontekstong ito; ang hinaharap na anyong Filipino ay natural na nagpapahayag ng utos sa serye ng mga tagubilin.
- source_word: שִׁשָּׁה
  choice: anim
  rationale: Tuwirang salin ng bilang na tumutukoy sa kasunod na pangngalan.
- source_word: קְרָשִׁים
  choice: mga tabla
  rationale: Tumutukoy ito sa mga kahoy na bahaging bumubuo sa dingding ng tabernakulo. Ang “mga tabla” ang pinakakaraniwan at madaling maunawaang salin, habang kinikilala sa talababa ang posibleng “mga balangkas.”
