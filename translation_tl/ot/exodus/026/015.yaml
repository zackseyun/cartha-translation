translation:
  language: tl
  text: Gumawa ka rin ng mga patayong balangkas na yari sa kahoy na akasya para sa tabernakulo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka rin
  rationale: Ang Qal perfect na may waw sa sunod-sunod na tagubilin ay may puwersang pautos. Likas sa modernong Tagalog ang “Gumawa ka,” at ipinahihiwatig ng “rin” ang pagpapatuloy ng mga naunang tagubilin.
- source_word: הַקְּרָשִׁים
  choice: mga balangkas
  rationale: Tumutukoy ang salita sa mga patayong elementong kahoy na bumubuo sa estruktura ng tabernakulo. Mas malinaw ang gamit na pang-arkitektura ng “balangkas” kaysa sa “tabla,” habang inilalagay sa talababa ang tradisyonal na alternatibo.
- source_word: לַמִּשְׁכָּן
  choice: para sa tabernakulo
  rationale: Ginamit ang kinikilalang teknikal na katawagan para sa santuwaryong inilalarawan sa Exodo; pinananatili rin ng “para sa” ang gamit ng Hebreong לְ.
- source_word: עֲצֵי שִׁטִּים
  choice: na yari sa kahoy na akasya
  rationale: Likas at malinaw sa Tagalog ang pariralang ito para sa Hebreong construct chain na tumutukoy sa materyales na mula sa punong akasya.
- source_word: עֹמְדִים
  choice: nakatayong patayo
  rationale: Pinananatili ang participial na paglalarawan sa posisyon ng mga balangkas. Ang “patayo” ay nililinaw ang oryentasyong pang-estruktura at hindi ginagawang hiwalay na utos ang parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang “tabernakulo” bilang teknikal at pamilyar na katawagan sa kontekstong ito. Inayos ang pagkakasunod ng mga parirala upang malinaw na ang kahoy na akasya ang materyales ng mga balangkas, hindi ng tabernakulo sa kabuuan.
