base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: tl
  text: At gagawin mo ang tabernakulo gamit ang sampung tabing na yari sa pinong lino na pinilipit at sa sinulid na asul, purpura, at iskarlata. Lalagyan mo ang mga ito ng mga kerubin na masining na ginawa ng isang bihasang tagapagdisenyo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gagawin mo ang mga ito na may mga kerubing masining na ginawa.” Ang Hebreong pariralang מַעֲשֵׂה חֹשֵׁב ay tumutukoy sa masining at planadong pagkakayari o disenyo sa tela, ngunit hindi nito ganap na tinutukoy ang teknik.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang מִשְׁכָּן ay ang banal na toldang tahanan. Ang “tabernakulo” ang kinikilalang teknikal na tawag sa Filipino at pinananatili nito ang natatanging kahulugan sa kontekstong ito.
- source_word: יְרִיעֹת
  choice: mga tabing
  rationale: Tumutukoy ito sa malalaking panel ng tela na bumubuo sa tabernakulo. Likas at malinaw sa Filipino ang “mga tabing” sa kontekstong pang-estruktura.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Ipinapahayag ng שֵׁשׁ ang pinong lino at ng מָשְׁזָר ang pinilipit o tinirintas na hibla. Pinananatili ng parirala ang materyal at paraan ng paghahanda nito.
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Karaniwang kulay ng telang ginagamit sa tabernakulo ang תְּכֵלֶת. Ginawang tahas ang “sinulid” dahil tekstil ang konteksto.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Tumutukoy ito sa mamahaling telang o sinulid na kinulayan ng purpura. Ang “purpura” ay maikli, marangal, at kinikilalang terminong pangkulay.
- source_word: תֹלַעַת שָׁנִי
  choice: iskarlata
  rationale: Ang tambalang ito ay tumutukoy sa matingkad na pula o iskarlatang materyal. Ginagamit ang “iskarlata” upang maiba ito sa karaniwang pula at mapanatili ang teknikal na serye ng mga kulay.
- source_word: כְּרֻבִים
  choice: mga kerubin
  rationale: Pinananatili ng “kerubin” ang teknikal na katawagang biblikal at iniiwasan ang makabagong larawan ng maliliit na anghel na maaaring idulot ng ibang katawagan.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: hinabi ayon sa disenyo ng isang bihasang manggagawa
  rationale: Ipinahihiwatig ng parirala ang masining at planadong pagkakayari sa tela, malamang na hinabing disenyo at hindi simpleng burda lamang. Natural sa Filipino ang paglalarawang ito nang hindi labis na tinitiyak ang eksaktong teknik.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: At gagawin mo
  rationale: Pinananatili ng “At” ang pagpapatuloy ng mga tagubilin, habang ang “gagawin mo” ay tuwirang naghahatid ng utos sa ikalawang panauhan.
- source_word: אֹתָם
  choice: ang mga ito
  rationale: Ang panghalip na maramihan ay tumutukoy pabalik sa sampung tabing; malinaw itong naipapahayag ng “ang mga ito.”
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang mga teknikal na terminong “tabernakulo” at “kerubin,” habang ginawang natural ang ayos ng pangungusap. Inilagay ang pananda ng talababa [a] sa pangungusap na tumatalakay sa malabong eksaktong paraan ng masining na paghabi.
