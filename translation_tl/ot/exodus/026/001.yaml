  to: At gagawin mo ang tabernakulo gamit ang sampung tabing na yari sa pinong lino na pinilipit at sa sinulid na asul, purpura, at iskarlata. Lalagyan mo ang mga ito ng mga kerubin na masining na ginawa ng isang bihasang tagapagdisenyo.[a]
