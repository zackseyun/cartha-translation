  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: tl
  text: At ang isang siko sa panig na ito at ang isang siko sa kabilang panig[a]—ang labis sa haba ng mga tabing ng tolda—ay lalawit sa magkabilang tagiliran ng tabernakulo[b] upang takpan ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “ang dagdag na isang siko sa isang panig at ang dagdag na isang siko sa kabilang panig.” Inuulit sa Hebreo ang “ang siko” na may mga salitang panturo, na tumutukoy sa natirang sukat sa bawat panig.
    reason: lexical_alternative
  - marker: b
    text: Ang “tabernakulo” ay salin ng Hebreong mishkan, ang banal na istrukturang tirahan sa ilalim ng pantakip ng tolda.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: isang siko
  rationale: Ang אַמָּה ay karaniwang sukat na ‘siko.’ Nililinaw ng konteksto na ito ang tig-isang sikong labis sa bawat panig.
- source_word: מִזֶּה ... מִזֶּה
  choice: sa panig na ito ... sa kabilang panig
  rationale: Tinutukoy ng magkatambal na parirala ang dalawang magkasalungat na panig; natural ito sa modernong Filipino.
- source_word: בָּעֹדֵף
  choice: ang labis
  rationale: Tumutukoy ito sa bahaging lumalabis o natitira mula sa haba ng mga tabing.
- source_word: אֹרֶךְ
  choice: haba
  rationale: Tuwirang katumbas na panukat sa konteksto ng pagtatayo.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: mga tabing ng tolda
  rationale: Ang יְרִיעֹת ay mga malalapad na telang pantabing, at ang הָאֹהֶל ay tumutukoy sa toldang sapin.
- source_word: יִהְיֶה סָרוּחַ
  choice: ay lalawit
  rationale: Inilalarawan nito ang labis na telang nakababa o nakalaylay sa mga tagiliran.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: magkabilang tagiliran ng tabernakulo
  rationale: Ang plural na צִדֵּי ay tumutukoy sa mga tagiliran. Pinanatili ang kinagawiang terminong ‘tabernakulo’ para sa banal na tirahang kayarian.
- source_word: לְכַסֹּתוֹ
  choice: upang takpan ito
  rationale: Ang infinitive ay nagsasaad ng layunin ng nakalaylay na tela.
