translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang ‘lalawit’ upang malinaw na ilarawan ang pisikal na pagkalaylay ng sobrang tela, at ‘tabernakulo’ bilang pamilyar na katawagan sa kontekstong biblikal.
