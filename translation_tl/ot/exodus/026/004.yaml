  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: tl
  text: Gagawa ka ng mga silo na kulay asul[a] sa gilid ng isang tabing sa dulo ng unang pangkat na pinagdugtong[b]. Ganoon din ang gagawin mo sa gilid ng pinakadulong[c] tabing sa ikalawang pangkat na pinagdugtong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bughaw” o “lilang-asul.” Ang Hebreong תְּכֵלֶת ay tumutukoy sa natatanging materyal na tinina nang asul na ginamit sa tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Ang mga salitang Hebreo para sa “pangkat na pinagdugtong” (חֹבָרֶת / מַחְבֶּרֶת) ay tumutukoy sa mga tabing na pinagdudugtong upang maging isang yunit.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “tabing na nasa pinakalabas na dulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: mga silo
  rationale: Tumutukoy ito sa mga hugis-singsing na kabitan na ginagamit upang pagdugtungin ang mga tabing. Ang “mga silo” ay maikli at malinaw sa konteksto ng konstruksiyon.
- source_word: תְּכֵלֶת
  choice: kulay asul
  rationale: Tumutukoy ang salita sa natatanging tina o materyal na asul hanggang lilang-asul na ginagamit sa tabernakulo. Hindi idinagdag ang “sinulid” dahil hindi iyon tahasang nasa Hebreo.
- source_word: שְׂפַת
  choice: gilid
  rationale: Sa konteksto ng tela, natural at tiyak na katumbas ang “gilid.”
- source_word: יְרִיעָה
  choice: tabing
  rationale: Ang tinutukoy ay isa sa mga telang panel ng tabernakulo; ang “tabing” ay likas at madaling maunawaan sa Filipino.
- source_word: הָאֶחָת
  choice: isang tabing
  rationale: Pinananatili nito ang literal na diwa ng “ang isa” nang hindi tahasang ginagawang bilang na “una.”
- source_word: מִקָּצָה
  choice: na nasa dulo
  rationale: Ipinapahayag nito ang kinalalagyan ng tabing sa dulo ng pinagdugtong na pangkat sa natural na ayos ng Filipino.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: pangkat na pinagdugtong
  rationale: Ang magkaugnay na mga salita ay tumutukoy sa isang yunit na binuo mula sa magkakadugtong na mga tabing. Pinananatili ng iisang salin ang ugnayang leksikal.
- source_word: וְכֵן
  choice: Ganoon din
  rationale: Natural nitong ipinahahayag ang utos na ulitin sa katulad na paraan ang naunang ginawa.
- source_word: הַקִּיצוֹנָה
  choice: pinakadulong
  rationale: Malinaw nitong inilalarawan ang tabing na nasa sukdulang dulo ng pangalawang pangkat.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Tiyak nitong kinikilala ang pangalawa sa dalawang pinagdugtong na pangkat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabing” at “pangkat na pinagdugtong” upang maging madaling maunawaan ang teknikal na paglalarawan nang hindi nawawala ang estruktura at tunay na kalabuan ng Hebreo.
