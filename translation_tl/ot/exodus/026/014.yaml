translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang karaniwang “tolda” at “lalaking tupa,” habang pinanatili ang di-tiyak na katawagang “tahash” at ipinaliwanag ito sa talababa.
