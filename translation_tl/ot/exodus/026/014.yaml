  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: tl
  text: Gagawa ka para sa tolda ng isang pantakip na yari sa mga balat ng lalaking tupa na kinulayan ng pula, at ng isang pantakip na yari sa mga balat ng tahash sa ibabaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na tahash. Maaaring tumukoy ito sa isang partikular na hayop o sa isang uri ng matibay na katad; kabilang sa mga iminungkahing salin ang “pinong katad,” “mga balat ng porpoise,” at “mga balat ng dugong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka rin
  rationale: Ang Qal perfect na may pang-ugnay sa sunod-sunod na tagubilin ay may puwersa ng utos. Likas sa modernong Tagalog ang anyong panghinaharap, at ipinahihiwatig ng “rin” ang pagpapatuloy ng mga naunang tagubilin.
- source_word: מִכְסֶה לָאֹהֶל
  choice: para sa tolda ng pantakip
  rationale: Ang מִכְסֶה ay isang takip o pananggalang na suson, at literal na “tolda” ang אֹהֶל. Pinananatili ng “para sa” ang gamit ng ל habang malinaw ang ugnayan ng pantakip at tolda.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: mga balat ng lalaking tupa na kinulayan ng pula
  rationale: Tumutukoy ang parirala sa mga balat ng mga ram na pinapula. Mas malinaw sa karaniwang Tagalog ang “lalaking tupa” kaysa sa hiram o di-pamilyar na katawagan, at inilalahad ng “kinulayan ng pula” ang malamang na pagpoproseso sa balat.
- source_word: עֹרֹת תְּחָשִׁים
  choice: mga balat ng tahash
  rationale: Hindi tiyak ang pagkakakilanlan ng תְּחָשִׁים. Pinananatili ng transliterasyong “tahash” ang tunay na leksikal na kalabuan sa halip na pumili ng isang haka-hakang hayop o uri ng katad.
- source_word: מִלְמָעְלָה
  choice: sa ibabaw nito
  rationale: Sa konteksto ng magkakapatong na mga pantakip, ipinakikita ng parirala ang pagkakalagay ng ikalawang uri ng balat sa ibabaw. Ang “nito” ay likas na tumutukoy sa naunang pantakip nang hindi tinutukoy kung anong hayop ang tahash.
