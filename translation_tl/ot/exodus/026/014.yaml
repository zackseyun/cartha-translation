revisions:
- from: Gagawa ka rin para sa tolda ng pantakip na mga balat ng lalaking tupa na kinulayan ng pula, at sa ibabaw nito ay pantakip na mga balat ng tahash.[a]
  to: Gagawa ka para sa tolda ng isang pantakip na yari sa mga balat ng lalaking tupa na kinulayan ng pula, at ng isang pantakip na yari sa mga balat ng tahash sa ibabaw.[a]
  rationale: Inayos ang sintaks upang malinaw na ang bawat מִכְסֶה ay isang pantakip na yari sa tinukoy na mga balat. Inalis ang di-kailangang “rin,” pinanatili ang tahash bilang transliterasyon upang huwag lutasin ang leksikal na kalabuan, at ginawang mas neutral at tumpak ang talababa. Ang “sa ibabaw” ay nagpapanatili ng pahiwatig na ito ang panlabas na pantakip nang walang idinagdag na hayag na pantukoy.
