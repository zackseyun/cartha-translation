  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: tl
  text: At ang gitnang biga, na nasa kalagitnaan ng mga balangkas[a], ay aabot mula sa isang dulo hanggang sa kabilang dulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla.” Ang salitang Hebreo ay tumutukoy sa mga patayong sangkap ng kayarian ng toldang sambahan; ginamit dito ang “mga balangkas” upang hindi ipahiwatig na mga payak na lapad na tabla lamang ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: biga
  rationale: Sa konteksto ng toldang sambahan, tumutukoy ito sa mahabang pahalang na sangkap na nagdurugtong at nagpapatibay sa mga patayong bahagi. Likas at malinaw sa Filipino ang “biga” bilang terminong pangkayarian.
- source_word: הַתִּיכֹן
  choice: gitnang
  rationale: Tinutukoy ng pang-uri ang bigang nasa gitna ng iba pang mga biga; tuwiran at natural ang “gitnang.”
- source_word: בְּתוֹךְ
  choice: nasa kalagitnaan ng
  rationale: Pinananatili nito ang lokasyong nasa loob o gitna ng mga balangkas nang hindi ipinapalagay na dumaraan ang biga sa mga butas ng mga ito.
- source_word: הַקְּרָשִׁים
  choice: mga balangkas
  rationale: Ang salita ay tumutukoy sa mga patayong sangkap ng kayarian ng toldang sambahan. Mas naipahihiwatig ng “mga balangkas” ang gamit na pangkayarian kaysa sa payak na “mga tabla,” habang inilalagay sa talababa ang tradisyonal na alternatibo.
- source_word: מַבְרִחַ
  choice: aabot
  rationale: Inilalarawan ng pandiwaring participle ang bigang sumasaklaw sa buong haba. Ang “aabot” ay malinaw at hindi nagdaragdag ng di-tiyak na ideyang dumaraan ito sa mga butas.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: mula sa isang dulo hanggang sa kabila
  rationale: Natural na idyomang Filipino ito para sa buong saklaw mula sa isang dulo tungo sa kabilang dulo.
