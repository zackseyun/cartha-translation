lexical_decisions:
- source_word: קֶרֶשׁ
  choice: balangkas
  rationale: Sa konteksto ng pagtatayo ng tabernakulo, tumutukoy ito sa isang patayong sangkap ng kayarian. Ang “balangkas” ay malinaw sa makabagong Filipino at hindi labis na nagtatakda kung ito ay tabla o troso.
- source_word: עֶשֶׂר אַמּוֹת
  choice: sampung siko
  rationale: Pinananatili ang sinaunang yunit na “siko” sa halip na tantiyahin ito sa modernong sukat.
- source_word: אֹרֶךְ
  choice: haba
  rationale: Karaniwan at likas na katumbas sa Filipino para sa dimensiyong ito.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: isa’t kalahating siko
  rationale: Likas na pagpapahayag sa Filipino na tumpak na nagpapanatili sa halagang nasa Hebreo.
- source_word: רֹחַב
  choice: lapad
  rationale: Pinakamalinaw at karaniwang salitang Filipino para sa dimensiyong ito.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: bawat balangkas
  rationale: Ang isahang anyo na may pantukoy at אֶחָד ay tumutukoy sa sukat ng bawat indibiduwal na sangkap; natural itong naipahahayag bilang “bawat balangkas.”
