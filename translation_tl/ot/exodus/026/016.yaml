  text: Sampung siko ang haba ng bawat balangkas[a], at isa’t kalahating siko ang lapad nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas tradisyonal na salin, “tabla” sa halip na “balangkas” para sa Hebreong קֶרֶשׁ.
