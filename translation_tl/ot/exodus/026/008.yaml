base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: tl
  text: Ang haba ng bawat telang pantakip[a] ay tatlumpung siko, at ang lapad nito ay apat na siko. Iisa ang sukat[b] ng lahat ng labing-isang telang pantakip.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “ang telang pantakip, ang isa.” Distributibo ang anyong Hebreo rito, kaya ang ibig sabihin ay bawat telang pantakip.
    reason: lexical_alternative
  - marker: b
    text: Literal na “isang sukat”; ibig sabihin, magkakapareho ang mga dimensiyon ng lahat ng labing-isang telang pantakip.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: haba
  rationale: Karaniwang katawagan sa dimensiyon at likas na kapares ng רֹחַב (‘lapad’).
- source_word: יְרִיעָה
  choice: telang pantakip
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa isang malaking piraso ng telang bumubuo sa pantakip ng tolda. Mas malinaw sa modernong Filipino ang ‘telang pantakip’ kaysa sa ‘tabing,’ na maaaring magpahiwatig lamang ng nakasabit na kurtina.
- source_word: הָאַחַת / הָאֶחָת
  choice: bawat
  rationale: 'Bagaman literal na ‘ang isa,’ distributibo ang gamit nito rito: ang nakasaad na mga dimensiyon ay para sa bawat indibiduwal na tela.'
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: tatlumpung siko
  rationale: Pinanatili ang sinaunang yunit na אַמָּה bilang ‘siko’ sa halip na gumamit ng di-tiyak na makabagong konbersiyon.
- source_word: רֹחַב
  choice: lapad
  rationale: Pinakamalinaw at likas na modernong katumbas, kapares ng ‘haba.’
- source_word: אַרְבַּע בָּאַמָּה
  choice: apat na siko
  rationale: Tuwirang paglilipat ng bilang at ng sinaunang yunit ng sukat.
- source_word: מִדָּה אַחַת
  choice: iisa ang sukat
  rationale: Pinananatili ang diin ng literal na ‘isang sukat’ habang natural na ipinahahayag na magkakapareho ang dimensiyon ng mga tela.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: ng lahat ng labing-isang telang pantakip
  rationale: Ipinahahayag nang malinaw na ang pagkakapareho ng sukat ay umiiral sa buong pangkat ng labing-isang tela.
