  register: Gumamit ng natural at marangal na modernong Filipino. Pinili ang ‘telang pantakip’ upang maging malinaw ang gamit ng materyal sa tolda; pinanatili ang ‘siko’ bilang tradisyonal na katawagan sa sinaunang yunit na cubit.
