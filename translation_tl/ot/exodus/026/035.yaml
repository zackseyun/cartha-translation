base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: tl
  text: Ilagay mo ang mesa sa labas ng tabing[a], at ang patungan ng mga ilawan sa tapat ng mesa, sa timog na panig ng tabernakulo[b]. Ilagay mo ang mesa sa hilagang panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kurtina.” Ang salitang Hebreo ay tumutukoy sa panloob na tabing na naghahati sa mga bahagi ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: menorah, isang patungan ng mga ilaw.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Ilagay mo
  rationale: Ang שׂוּם ay nangangahulugang ‘ilagay’ o ‘ipuwesto.’ Ang anyong pautos sa Filipino ay natural na naghahatid ng itinakdang tagubilin ng Hebreong perfect na may waw sa kontekstong ito.
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Payak na ‘mesa’ ang kahulugan ng pangngalan. Hindi idinagdag ang kaugnayan nito sa tinapay sapagkat hindi iyon tahasang binabanggit sa talata.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: sa labas ng tabing
  rationale: Ang מִחוּץ ay ‘sa labas,’ at ang פָּרֹכֶת ay ang panloob na tabing na naghahati sa mga bahagi ng tabernakulo.
- source_word: הַמְּנֹרָה
  choice: ang ilawan
  rationale: Isinalin ang pangngalan ayon sa gamit nito sa halip na hiramin ang ‘menorah.’ Sa kontekstong ito, ang ‘ilawan’ ay natural at malinaw na katawagan sa patungan ng mga ilaw.
- source_word: נֹכַח
  choice: sa tapat ng
  rationale: Ipinahihiwatig ng נֹכַח ang pagkakapuwesto nang magkaharap o magkatapat; ‘sa tapat ng’ ang likas na katumbas sa Filipino.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: sa gawing timog ng tabernakulo
  rationale: Ang צֶלַע ay ‘tagiliran/panig,’ at ang תֵּימָנָה ay tumutukoy sa direksiyong timog. Ang ‘sa gawing timog’ ay malinaw at idiomatikong panutong panglokasyon.
- source_word: וְהַשֻּׁלְחָן תִּתֵּן
  choice: Ilagay mo naman ang mesa
  rationale: Ang נָתַן ay may malawak na diwang ‘ibigay/ilagay,’ at sa konteksto ng pag-aayos ng kagamitan ay nararapat ang ‘ilagay.’ Ginamit ang ‘naman’ upang natural na ipakita ang pagtutulad at pag-iiba ng lokasyon ng mesa at ilawan.
- source_word: עַל צֶלַע צָפוֹן
  choice: sa gawing hilaga
  rationale: Tumutukoy ang parirala sa hilagang panig; ‘sa gawing hilaga’ ang malinaw at natural na salin.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw, marangal, at angkop sa tekstong panritwal. Pinanatili ang tradisyonal at madaling makilalang ‘tabernakulo,’ habang ginawang tuwiran at natural ang mga panutong panglokasyon.
