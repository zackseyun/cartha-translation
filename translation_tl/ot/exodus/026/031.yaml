base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: tl
  text: “Gagawa ka ng isang tabing[a] mula sa mga sinulid na asul, purpura, at eskarlata[b], at sa pinong linong pinilipit. Gawin mo ito nang may masining na kasanayan, na may mga kerubin.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kurtina.” Ang salitang Hebreo ay tumutukoy sa panloob na nakasabit na tela na naghihiwalay sa Dakong Banal at sa Dakong Kabanal-banalan.
    reason: lexical_alternative
  - marker: b
    text: Sa mas literal na diwa, ang Hebreo ay tumutukoy sa materyal na tinina ng eskarlata; ayon sa tradisyon, ang tina ay nagmumula sa mga kulisap.
    reason: cultural_note
  - marker: c
    text: Maaari ring “bilang gawa ng isang masining na manghahabi” o “ginawang may kasanayan.” Ang pariralang Hebreo ay tumutukoy sa ekspertong masining na pagkakagawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: tabing
  rationale: Tumutukoy ito sa panloob na nakasabit na telang naghihiwalay sa Dakong Banal at sa Kabanal-banalang Dako. Ang “tabing” ay likas at tiyak sa kontekstong ito; posible rin ang “kurtina.”
- source_word: תְּכֵלֶת
  choice: asul
  rationale: Isang mahalagang kulay ng tininaang tela. Isinama ang “mga sinulid” sa kabuuang parirala upang maging malinaw ang materyal nang hindi inuulit sa bawat kulay.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Karaniwang katawagan sa mamahaling kulay o tina sa mga paglalarawan ng santuwaryo, at angkop sa marangal na rehistro.
- source_word: תוֹלַעַת שָׁנִי
  choice: eskarlata
  rationale: Tumutukoy sa materyal na tinina ng matingkad na pulang kulay. Pinananatili ng “eskarlata” ang natatanging kulay, habang ipinaliliwanag sa talababa ang makasaysayang pinagmulan ng tina.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili nito kapwa ang uri ng tela at ang pagkakapilipit o pagkakasala ng hibla.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: gawa ng isang dalubhasang manggagawa
  rationale: Ipinahihiwatig ng parirala ang masining at ekspertong pagkakagawa nang hindi nililimitahan ito sa isang tiyak na makabagong hanapbuhay o teknik.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: gagawin ito
  rationale: Ang Hebreo ay lumilipat mula sa utos sa ikalawang panauhan tungo sa anyong ikatlong panauhan na may di-tiyak na tagagawa. Likas na naihahayag ito sa Filipino sa pasibong “gagawin ito.”
- source_word: כְּרֻבִים
  choice: may mga kerubin
  rationale: Ang mga kerubin ay bahagi ng disenyo ng tabing. Ang “kerubin” ang nakaugaliang katawagang Filipino para sa mga makalangit na nilalang na ito.
theological_decisions:
- issue: Paglalahad sa tabing at sa masining na pagkakagawa nito nang hindi ipinapasok ang mas huling simbolismong teolohikal
  choice: Isinalin bilang tuwirang tagubilin sa paggawa ng tabernakulo, gamit ang “tabing” at “mga kerubin” sa kanilang agarang kontekstong pangsantuwaryo.
  alternative: Gumamit ng pananalitang hayagang inuugnay ang tabing sa mas huling simbolismo o teolohikal na pakahulugan.
  rationale: Ang talata mismo ay nagbibigay ng tagubiling pangkonstruksiyon at pansining. Hindi nito tahasang binibigyang-kahulugan ang simbolismo ng tabing, kaya hindi iyon idinagdag sa salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tabing,” “linong pinilipit,” at “dalubhasang manggagawa” upang maging madaling maunawaan habang pinananatili ang bokabularyong angkop sa santuwaryo at ang di-tiyak na uri ng masining na paggawa.
