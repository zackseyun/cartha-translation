translation:
  language: tl
  text: At isasabit mo ito sa apat na haliging gawa sa kahoy na akasya at binalutan ng ginto. Ginto rin ang mga kawit ng mga iyon. Ang mga haligi ay nakapatong sa apat na saligang pilak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apat na patungang pilak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: At isasabit mo
  rationale: Bagaman malawak ang kahulugan ng נתן na “ilagay,” ipinahihiwatig ng tabing at ng mga haligi sa kontekstong ito na isasabit ito.
- source_word: אֹתָהּ
  choice: ito
  rationale: Pambabaeng pang-isahang layon na tumutukoy sa tabing sa naunang talata.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי
  choice: sa apat na haligi
  rationale: Natural na Filipino para sa pagkakabit ng tabing sa apat na patayong suporta.
- source_word: שִׁטִּים
  choice: kahoy na akasya
  rationale: Nililinaw na tabla o trosong mula sa akasya ang materyal, hindi mga buhay na puno.
- source_word: מְצֻפִּים זָהָב
  choice: binalutan ng ginto
  rationale: Tumpak at karaniwang paglalarawan sa Filipino ng gold overlay o plating.
- source_word: וָוֵיהֶם
  choice: mga kawit ng mga iyon
  rationale: Ang וָוִים ay mga kawit na ginagamit sa pagsasabit; ang panghalip ay tumutukoy sa mga haligi.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: nakapatong sa apat na tuntungang pilak
  rationale: Ang אֶדֶן ay suportang base o socket; malinaw sa kasalukuyang Filipino ang “tuntungan,” habang pinananatili sa talababa ang alternatibong hugis-saksakan.
