  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: tl
  text: Gagawa ka rin ng mga kurtinang yari sa balahibo ng kambing[a] bilang tolda sa ibabaw ng tabernakulo; labing-isang kurtina ang gagawin mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga kurtina ng mga kambing.” Ginagamit dito ang “mga kambing” upang tukuyin ang materyal na mula sa mga ito, samakatuwid ay balahibo ng kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka rin
  rationale: Ang Qal na anyong may prefixed conjunction ay nagpapatuloy sa sunod-sunod na tagubilin. Likas sa modernong Tagalog ang panghinaharap na “gagawa ka,” at ipinahihiwatig ng “rin” ang pagpapatuloy mula sa naunang utos.
- source_word: יְרִיעֹת
  choice: mga kurtina
  rationale: Sa konteksto ng pagtatayo ng tabernakulo, tumutukoy ito sa malalaking telang pantakip o magkakaugnay na panel. Ang “mga kurtina” ay malinaw, natural, at hindi labis na teknikal.
- source_word: עִזִּים
  choice: yari sa balahibo ng kambing
  rationale: Literal na “mga kambing,” ngunit dito ay metonimiya ito para sa materyal na mula sa kambing, samakatuwid ay telang yari sa balahibo ng kambing.
- source_word: לְאֹהֶל
  choice: bilang tolda
  rationale: 'Ang לְ ay nagpapahayag ng gamit o layunin: ang mga kurtina ang bubuo sa toldang pantakip. Mas tuwirang ipinahahayag ng “bilang tolda” ang ugnayang ito kaysa sa “para sa isang tolda.”'
- source_word: עַל הַמִּשְׁכָּן
  choice: sa ibabaw ng tabernakulo
  rationale: Ang עַל ay nagsasaad ng posisyon sa ibabaw, at ang מִשְׁכָּן ay terminong ginagamit sa Exodo para sa banal na tahanang estruktura. Pinananatili ng “tabernakulo” ang kinikilalang teknikal na kahulugan nito.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: labing-isang kurtina ang gagawin mo
  rationale: Pinananatili ng ayos na ito ang inuulit na “mga kurtina” at ang diin sa kabuuang bilang, habang natural ang pangungusap sa Tagalog.
