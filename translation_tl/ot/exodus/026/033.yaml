  text: וְ/נָתַתָּ֣ה אֶת הַ/פָּרֹכֶת֮ תַּ֣חַת הַ/קְּרָסִים֒ וְ/הֵבֵאתָ֥ שָׁ֨מָּ/ה֙ מִ/בֵּ֣ית לַ/פָּרֹ֔כֶת אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/הִבְדִּילָ֤ה הַ/פָּרֹ֨כֶת֙ לָ/כֶ֔ם בֵּ֣ין הַ/קֹּ֔דֶשׁ וּ/בֵ֖ין קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: tl
  text: At ilalagay mo ang tabing sa ilalim ng mga pangkawit. Dadalhin mo roon, sa loob ng tabing, ang kaban ng patotoo[a]. Ihihiwalay ng tabing para sa inyo ang Dakong Banal mula sa Kabanal-banalang Dako[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tinatawag din sa ibang konteksto na “kaban ng tipan.” Ang Hebreo rito ay literal na “kaban ng patotoo.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “banal ng mga banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: tabing
  rationale: Tumutukoy ito sa panloob na telang humahati at tumatakip sa pinakaloob na bahagi ng santuwaryo. Ang “tabing” ay natural at tiyak sa tungkuling ito.
- source_word: קְרָסִים
  choice: mga pangkawit
  rationale: Tumutukoy sa mga kagamitang nagdurugtong sa mga tela ng tabernakulo. Ang “pangkawit” ay malinaw at hindi labis na nagtatakda ng makabagong mekanismo.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: sa loob ng tabing
  rationale: Ipinahihiwatig ng parirala ang lugar sa panloob na panig ng tabing. Likas at malinaw ito sa modernong Tagalog.
- source_word: אֲרוֹן הָעֵדוּת
  choice: kaban ng patotoo
  rationale: Tahasan itong gumagamit ng עֵדוּת, “patotoo,” kaya hindi ito pinantay sa mas pamilyar na titulong “kaban ng tipan.”
- source_word: וְהִבְדִּילָה
  choice: maghihiwalay
  rationale: Tumpak nitong ipinapahayag ang sanhi o gampaning paghihiwalay ng tabing.
- source_word: לָכֶם
  choice: para sa inyo
  rationale: Pinananatili ang datibong panghalip sa Hebreo at ang kaugnayan ng pagkakahating ito sa kaayusan ng pagsamba ng Israel.
- source_word: הַקֹּדֶשׁ
  choice: Dakong Banal
  rationale: Sa kontekstong ito, ito ang panlabas na banal na silid na naiiba sa pinakaloob na silid.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Kabanal-banalang Dako
  rationale: Natural nitong ipinahahayag sa Tagalog ang pasukdol na Hebreong “banal ng mga banal” at pinananatili ang teknikal na pagkakaiba ng dalawang silid.
theological_decisions:
- issue: Tradisyonal na katawagan sa pinakaloob na santuwaryo
  choice: Kabanal-banalang Dako
  alternative: Banal ng mga Banal
  rationale: Inihahatid nito ang pasukdol na diwa ng Hebreo sa natural at madaling maunawaang Tagalog nang hindi binubura ang natatanging kabanalan ng panloob na silid.
- issue: Pagsasalin ng עֵדוּת sa titulo ng kaban
  choice: kaban ng patotoo
  alternative: kaban ng tipan
  rationale: Ang mismong salita ng talata ay “patotoo,” hindi “tipan”; kaya pinananatili ang leksikal na pagkakaibang ito sa halip na iayon sa mas pamilyar na tradisyonal na titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “tabing,” “kaban,” at mga teknikal na katawagang “Dakong Banal” at “Kabanal-banalang Dako” upang maging malinaw ang ayos ng santuwaryo nang hindi maging lipas o labis na akademiko.
