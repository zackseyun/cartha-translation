  source_fidelity: 'Tumpak na isinasalin ng draft ang pangunahing mga termino: ang panloob na tabing, mga pangkawit/pangkabit, ang kaban ng patotoo, at ang pagkakaiba ng dalawang silid. Napananatili rin ang ''para sa inyo.'' Gayunman, ang huling pangungusap ay hindi malinaw na naipapakita na ang tabing ang naghihiwalay sa pagitan ng dalawang dako.'
  naturalness: Natural ang karamihan ng pananalita sa modernong Tagalog. Ngunit ang 'maghihiwalay para sa inyo sa Dakong Banal at sa Kabanal-banalang Dako' ay alanganin sa balarila at maaaring magpahiwatig na ang tabing mismo ang humihiwalay palayo sa mga dakong iyon. Ang 'ihihiwalay ... ang ... mula sa ...' ay malinaw at natural.
  terminology: Ang 'tabing,' 'kaban ng patotoo,' 'Dakong Banal,' at 'Kabanal-banalang Dako' ay magkakatugma, angkop sa rehistrong pangkasulatan, at tapat sa Hebreo. Ang mga talababa ay wastong nakaangkla sa mga terminong tinutukoy nila at hindi ipinapalit ang 'tipan' sa pangunahing teksto.
