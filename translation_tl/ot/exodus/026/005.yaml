  naturalness: Marangal at madaling unawain ang karamihan ng salin. Mas natural ang “bawat isa ay katapat ng isa pa” kaysa “ang isa sa katapat nito.” Ang “na kabilang sa ikalawang pangkat na pinagdugtong” ay mas malinaw at mas daloy-Tagalog kaysa “na nasa ikalawang pinagdugtong na pangkat.”
  terminology: Ang “mga silo” ay katanggap-tanggap para sa mga loop na telang kabitan at naiiwasan nitong malito sa mga kawit na metal sa susunod na talata. Ang “tabing,” “gilid,” at “pangkat na pinagdugtong” ay angkop sa konteksto. Pinananatili ng talababa ang literal na anyo ng idyoma nang hindi ito maling inilalapat sa mga literal na babae.
