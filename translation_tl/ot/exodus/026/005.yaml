  to: Gagawa ka ng limampung silo sa isang tabing, at gagawa ka rin ng limampung silo sa gilid ng tabing na kabilang sa ikalawang pangkat na pinagdugtong. Ang mga silo ay magkatapat, bawat isa ay katapat ng isa pa.[a]
