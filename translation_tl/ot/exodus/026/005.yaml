  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: tl
  text: Gagawa ka ng limampung silo sa isang tabing, at gagawa ka rin ng limampung silo sa gilid ng tabing na kabilang sa ikalawang pangkat na pinagdugtong. Ang mga silo ay magkatapat, bawat isa ay katapat ng isa pa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang babae sa kaniyang kapatid na babae,” isang idyomang Hebreo na nangangahulugang ang bawat silo ay nakatapat o nakahanay sa katumbas nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: mga silo
  rationale: Tumutukoy ito sa mga hugis-singsing na kabitan sa tela; malinaw na naihihiwalay ng “silo” ang mga ito sa mga kawit na metal sa kasunod na talata.
- source_word: יְרִיעָה
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, ito ay malaking telang pantakip o nakasabit na bahagi; natural at marangal sa Tagalog ang “tabing.”
- source_word: הָאֶחָת
  choice: isang
  rationale: Pinananatili nito ang literal na pagtukoy sa isa sa dalawang katapat na tabing nang hindi ipinapalagay na “una” ang ibig sabihin.
- source_word: קְצֵה
  choice: gilid
  rationale: Ang tinutukoy ay ang hangganan ng telang paglalagyan ng mga silo; pinakaangkop sa konteksto ng pagdurugtong ang “gilid.”
- source_word: מַחְבֶּרֶת
  choice: pinagdugtong na pangkat
  rationale: Ipinahahayag nito kapwa ang pagdurugtong at ang nabuong pangkat ng mga tabing, ayon sa konteksto ng mga naunang talata.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Tuwirang katumbas ito ng ordinal na anyo sa Hebreo at tumutukoy sa ikalawang pangkat.
- source_word: מַקְבִּילֹת
  choice: magkatapat
  rationale: Pinananatili nito ang diwang spatial ng magkahanay at magkakatapat na mga silo.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ang isa sa katapat nito
  rationale: Natural nitong ipinahahayag ang idyomatikong kahulugan ng pagtutugma ng bawat silo sa katapat nito, habang inilalagay sa talababa ang literal na larawan.
