translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na tono. Ginamit ang “gagawa ka” bilang natural na anyo ng utos sa mga tagubilin, at pinanatili ang teknikal na pagkakaiba ng mga silong tela at ng mga kawit na metal sa kasunod na talata.
