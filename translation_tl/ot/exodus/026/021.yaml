translation:
  language: tl
  text: 'at ang apatnapung patungan[b] nito ay yari sa pilak: dalawang patungan sa ilalim ng isang balangkas[a], at dalawang patungan sa ilalim ng isa pang balangkas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “tabla”; ang salitang Hebreo ay tumutukoy sa bawat patayong sangkap ng balangkas ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “saksakan” sa halip na “patungan”; tumutukoy ang salitang Hebreo sa mga suportang pilak na kinalalagyan ng mga balangkas ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: at ang apatnapu
  rationale: Ipinagpapatuloy ng pang-ugnay at bilang ang paglalarawan mula sa naunang talata; natural sa Tagalog ang “at ang apatnapu.”
- source_word: אַדְנֵי/הֶם
  choice: mga patungan nito
  rationale: Sa konteksto ng tabernakulo, ang אֶדֶן ay suportang pilak na kinalalagyan o pinagsasaligan ng mga balangkas. Malinaw at likas sa modernong Tagalog ang “patungan,” habang inilalahad sa talababa ang mas teknikal na “saksakan.”
- source_word: כָּסֶף
  choice: yari sa pilak
  rationale: Tinutukoy ng pangngalan ang materyal ng mga patungan; ang “yari sa pilak” ay natural at tahasang Tagalog.
- source_word: שְׁנֵי אֲדָנִים
  choice: dalawang patungan
  rationale: Pinananatili ang bilang at pare-parehong salin ng אֶדֶן.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang ipinahahayag ang pisikal na lokasyon ng mga patungan.
- source_word: הַ/קֶּרֶשׁ
  choice: balangkas
  rationale: Sa kontekstong ito, tumutukoy ang קֶרֶשׁ sa bawat patayong sangkap ng istruktura. Mas naipahihiwatig ng “balangkas” ang tungkuling pang-istruktura kaysa sa pangkalahatang “tabla.”
- source_word: הָאֶחָד ... הָאֶחָד
  choice: isang ... isa pang
  rationale: Bagaman kapuwa literal na “ang isa” ang inuulit sa Hebreo, distributibo at magkatambal ang diwa sa konteksto. Ang “isang ... isa pang” ay natural sa Tagalog at malinaw na hindi iisang balangkas ang tinutukoy ng dalawang parirala.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “nito” bilang natural na panumbas sa hulaping panghalip na tumutukoy sa kabuuang hanay na binanggit sa naunang talata. Inilagay ang mga marker kaagad pagkatapos ng “balangkas,” na siyang saklaw ng talababa a, at katabi nito ang talababa b tungkol sa “patungan”; bagaman magkatabi ang mga marker, kapuwa naroroon sa pangunahing teksto.
