  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: tl
  text: Babalutan mo ng ginto ang mga balangkas[a], at gagawa ka ng mga argolya ng mga ito na yari sa ginto bilang mga lalagyan[b] ng mga baras. Babalutan mo rin ng ginto ang mga baras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga tabla.” Ang salitang Hebreo ay tumutukoy sa mga patayong bahaging bumubuo sa estruktura ng tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “mga bahay para sa mga baras,” ibig sabihin, mga lalagyan o pinaglalagyan ng mga baras.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: mga balangkas
  rationale: Tumutukoy ang קֶרֶשׁ sa mga patayong bahaging bumubuo sa estruktura ng tabernakulo. Mas malinaw sa makabagong Filipino ang “mga balangkas” kaysa sa literal ngunit posibleng mapanlinlang na “mga tabla.”
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: babalutan mo
  rationale: Ang piel ng צפה ay tumutukoy sa paglalapat ng isang materyal bilang panlabas na sapin. Likas at malinaw sa Filipino ang “babalutan ng ginto” sa konteksto ng pagkakayari.
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katawagan sa materyal; pinanatili ang pag-uulit nito gaya sa Hebreo.
- source_word: טַבְּעֹתֵיהֶם
  choice: mga argolya ng mga ito
  rationale: Ang טַבַּעַת ay singsing o argolyang metal na nakakabit sa mga balangkas. Ang “argolya” ay mas angkop sa piyesang pangkonstruksiyon kaysa “singsing.”
- source_word: תַּעֲשֶׂה
  choice: gagawin mo
  rationale: Tuwiran at natural na salin ng karaniwang pandiwang עשה.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: bilang mga lalagyan ng mga pahalang na baras
  rationale: Literal itong “mga bahay para sa mga baras,” ngunit dito ay tumutukoy sa mga sisidlan o sabitan na dinaraanan o kinalalagyan ng mga baras.
- source_word: הַבְּרִיחִם
  choice: mga pahalang na baras
  rationale: Ang בְּרִיחַ ay mga baras na nagdurugtong at nagpapatatag sa mga patayong balangkas. Nililinaw ng “pahalang” ang gamit nito nang hindi binabago ang diwa.
