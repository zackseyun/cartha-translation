  text: וַ/הֲקֵמֹתָ֖ אֶת הַ/מִּשְׁכָּ֑ן כְּ/מִ֨שְׁפָּט֔/וֹ אֲשֶׁ֥ר הָרְאֵ֖יתָ בָּ/הָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: tl
  text: Itayo mo ang tabernakulo ayon sa itinakdang kaayusan nito na ipinakita sa iyo sa bundok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “na nakita mo sa bundok.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: Itayo mo
  rationale: Ang Hiphil ng קום ay nangangahulugang ‘patayuin’ o ‘itayo.’ Sa konteksto ng pagbubuo ng santuwaryo, natural at tuwiran ang ‘Itayo mo,’ at ang pautos na diwa ay angkop sa konteksto.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang מִשְׁכָּן ang karaniwang tawag sa sagradong toldang tahanan sa Exodo. Pinananatili ng ‘tabernakulo’ ang tiyak na reperensiya at nakasanayang katawagan sa Filipino.
- source_word: כְּמִשְׁפָּטוֹ
  choice: ayon sa itinakdang kaayusan nito
  rationale: Maaaring tumukoy ang מִשְׁפָּט sa tuntunin, itinakdang paraan, o wastong kaayusan. Sa konteksto ng pagtatayo, ipinahihiwatig nito ang itinakdang pagkakaayos o disenyo, nang hindi ito nililimitahan sa biswal na ‘huwaran’ lamang.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: na ipinakita sa iyo
  rationale: Literal na aktibo ang Hebreo, ‘na nakita mo,’ ngunit sa konteksto ay nakita iyon ni Moises dahil ipinakita sa kanya. Natural sa Filipino ang pasibong anyo; pinananatili sa talababa ang literal na anyo.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Ang בְּ ay lokatibo rito. Ang ‘sa bundok’ ang natural na salin sa Filipino para sa kinaroroonan ni Moises.
theological_decisions:
- issue: Ang ahensiya sa pagpapakita ng kaayusan
  choice: ipinakita sa iyo
  alternative: nakita mo
  rationale: Ipinahihiwatig ng konteksto ang banal na pagpapakita ngunit hindi pinangalanan sa talata ang gumawa nito. Kaya pasibo ang salin at hindi idinagdag ang ‘ng Diyos’; nakatala sa talababa ang literal na aktibong anyo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang nakasanayang terminong ‘tabernakulo,’ samantalang ang ‘itinakdang kaayusan’ ay nagpapahayag ng preskriptibong diwa ng מִשְׁפָּט sa konteksto ng pagtatayo.
