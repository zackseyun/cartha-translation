base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: tl
  text: Gumawa ka ng limampung pangkabit na ginto, at pagdugtungin mo ang mga tabing sa isa't isa[a] sa pamamagitan ng mga pangkabit, upang maging iisa ang tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bawat babae sa kanyang kapatid na babae,” isang idyomang Hebreo na tumutukoy sa pagdudugtong ng mga tabing nang magkakatapat sa isa't isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang anyong pandiwa sa sunod-sunod na tagubilin ay may puwersa ng utos; natural at malinaw sa modernong Tagalog ang pautos na anyo.
- source_word: קַרְסֵי זָהָב
  choice: mga pang-ipit na ginto
  rationale: Tumutukoy ang קֶרֶס sa mga kagamitang nagkakabit sa mga tabing. Hindi labis na tinutukoy ng “pang-ipit” ang eksaktong hugis, at malinaw na ginto ang materyal.
- source_word: וְחִבַּרְתָּ
  choice: pagdugtungin mo
  rationale: Ang חבר ay nangangahulugang pagdugtungin o pag-ugnayin; ang “pagdugtungin” ay natural para sa magkakabit na mga panel ng tela.
- source_word: הַיְרִיעֹת
  choice: mga tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang יְרִיעָה sa malalaking panel ng tela. Ang “mga tabing” ay maikli, dignified, at madaling maunawaan.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ang mga tabing
  rationale: Ang literal na “bawat babae sa kanyang kapatid na babae” ay idyomang Hebreo para sa pagtutugma o pagdurugtong sa isa't isa. Naipahihiwatig na ito ng pandiwang “pagdugtungin” at ng maramihang layon, kaya hindi kailangan ang di-natural na literalismo.
- source_word: בַּקְּרָסִים
  choice: sa pamamagitan ng mga pang-ipit
  rationale: Instrumental ang gamit ng ב; malinaw na ipinapahayag ng parirala kung anong kagamitan ang gagamitin sa pagdurugtong.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: upang maging iisa ang tabernakulo
  rationale: 'Ipinahahayag ng sugnay ang bunga o layunin ng pagdurugtong: ang buong tabernakulo ay magiging isang nagkakaisang kabuuan.'
theological_decisions:
- issue: Pagpapakahulugan sa הַמִּשְׁכָּן
  choice: tabernakulo
  alternative: tahanan / tirahan
  rationale: Pinananatili ng “tabernakulo” ang teknikal na kahulugan ng santuwaryong inilalarawan sa Exodo, samantalang maaaring maging napakalawak ng “tahanan” o “tirahan.”
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran at marangal. Ginamit ang karaniwang pautos na “Gumawa ka” at “pagdugtungin mo.” Isinalin nang idyomatiko ang אִשָּׁה אֶל אֲחֹתָהּ sa loob ng pangungusap sa halip na maglagay ng literal na pariralang hindi natural sa Tagalog.
