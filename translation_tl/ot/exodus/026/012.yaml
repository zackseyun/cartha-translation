  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: tl
  text: Ang lumalabis na bahagi ng mga tabing ng tolda[a]—ang kalahati ng tabing na lumalabis—ay lalaylay sa likod ng tabernakulo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ang sobrang natira sa mga tabing ng tolda.”'
    reason: lexical_alternative
  - marker: b
    text: Magkaiba rito ang “tolda,” na tumutukoy sa pantakip, at ang “tabernakulo,” na tumutukoy sa tirahang istruktura.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: lumalabis na bahagi
  rationale: Ipinahahayag nito ang sobrang bahagi ng pantabing na nakausli at nakatakdang lumaylay; mas natural ito sa Filipino kaysa sa isang teknikal o artipisyal na katumbas ng “overhang.”
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: lumalabis / natitira
  rationale: Kapuwa tumutukoy ang mga anyo sa bahaging sobra o naiwan. Ginamit ang magkaugnay ngunit natural na mga salita ayon sa kani-kanilang pangungusap.
- source_word: יְרִיעֹת
  choice: mga tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa malalaking telang pantakip; malinaw at karaniwang katumbas ang “mga tabing.”
- source_word: הָאֹהֶל
  choice: tolda
  rationale: Pinananatili ang pagkakaiba ng אֹהֶל, ang tolda o panakip, at מִשְׁכָּן, ang tabernakulong istruktura.
- source_word: חֲצִי הַיְרִיעָה
  choice: kalahati ng isang tabing
  rationale: Malinaw na ipinakikita ang kalahati ng iisang tabing, habang nananatiling natural sa Filipino.
- source_word: תִּסְרַח
  choice: lalaylay
  rationale: Inilalarawan ng pandiwa ang sobrang bahagi na nakabitin o bumababa sa likuran; tumpak at biswal ang “lalaylay.”
- source_word: עַל אֲחֹרֵי
  choice: sa likuran ng
  rationale: Natural na paglalarawan ito sa puwesto ng telang lalaylay sa bandang likod ng istruktura.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Filipino para sa banal na tirahang istruktura sa kontekstong ito at naihihiwalay sa “tolda.”
