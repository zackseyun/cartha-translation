revisions:
- from: Ang lumalabis na bahagi ng mga tabing ng tolda[a]—ang natitirang kalahati ng isang tabing—ay lalaylay sa likuran ng tabernakulo.[b]
  to: Ang lumalabis na bahagi ng mga tabing ng tolda[a]—ang kalahati ng tabing na lumalabis—ay lalaylay sa likod ng tabernakulo.[b]
  rationale: Nilinaw ang ikalawang parirala upang ang “kalahati” ay tahasang maging kalahati ng tabing na sobra o lumalabis, gaya ng ipinahihiwatig ng Hebreo. Pinanatili ang arkitektural na larawan, ang utos na ang bahagi ay lalaylay sa bandang likod, at ang terminolohikal na pagkakaiba ng tolda at tabernakulo.
