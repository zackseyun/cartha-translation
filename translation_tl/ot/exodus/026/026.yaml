  yaml_path: translation/ot/exodus/026/026.yaml
  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: tl
  text: Gumawa ka rin ng limang bigang kahoy na akasya para sa mga balangkas[a] ng isang tagiliran ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla”; tumutukoy ang salitang Hebreo sa patayong mga bahaging bumubuo sa estruktura ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka rin
  rationale: Ang Qal perfect na may prefixed conjunction sa sunod-sunod na tagubilin ay may puwersa ng utos. Likas sa modernong Tagalog ang “Gumawa ka rin” at naipapakita ng “rin” ang pagpapatuloy ng mga tagubilin.
- source_word: בְרִיחִם
  choice: mga biga
  rationale: Tumutukoy ito sa mahahabang pirasong kahoy na nagdurugtong at nagpapatatag sa mga balangkas. Ang “mga biga” ay malinaw at hindi nagdaragdag ng espesipikong direksiyong hindi tahasang sinasabi ng Hebreo.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Natural na katumbas sa Tagalog ng construct chain na tumutukoy sa uri ng kahoy.
- source_word: חֲמִשָּׁה
  choice: limang
  rationale: Tuwirang bilang na naglalarawan sa mga biga.
- source_word: לְקַרְשֵׁי
  choice: para sa mga balangkas
  rationale: Ang קֶרֶשׁ ay tumutukoy sa patayong mga bahaging bumubuo sa estruktura. Mas naipahihiwatig ng “balangkas” ang gamit nito kaysa sa mas makitid na “tabla,” habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: צֶלַע
  choice: tagiliran
  rationale: Sa kontekstong ito, tumutukoy ang salita sa isang gilid ng estruktura, hindi sa literal na tadyang. Ang “tagiliran” ay natural para sa lateral na bahagi at naghahanda sa pagtukoy sa kabilang panig sa kasunod na talata.
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang terminong Filipino para sa santuwaryong estruktura sa Exodo, bagaman ang saligang diwa ng salita ay “tahanan.”
- source_word: הָאֶחָד
  choice: isang
  rationale: Tinutukoy nito ang isa sa dalawang tagiliran. Sa Tagalog, natural na ipinahahayag ng “isang tagiliran” ang ideyang ito nang hindi ipinapalagay na ito ang “una.”
