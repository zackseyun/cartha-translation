translation:
  language: tl
  text: Pagdurugtungin mo ang limang tabing sa isang pangkat at ang anim na tabing sa isa pang pangkat. Tutupiin mo nang doble ang ikaanim na tabing sa harap ng tolda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: Pagdurugtungin mo
  rationale: Ang pandiwang חָבַר ay nangangahulugang pagdugtungin o pag-ugnayin. Ang “pagdurugtungin” ay natural sa Filipino at angkop sa mga tabing na pinagsasama upang maging magkakaugnay na yunit.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: mga tabing / tabing
  rationale: Tumutukoy ang יְרִיעָה sa mga telang pantakip ng tolda. Malinaw at karaniwang salin ang “tabing” sa kontekstong ito.
- source_word: לְבָד
  choice: sa isang pangkat ... sa isa pang pangkat
  rationale: Ipinakikita ng dalawang paggamit ng לְבָד na magkahiwalay na yunit ang limang tabing at ang anim na tabing. Iniiwasan ng saling ito ang posibleng maling pagkaunawa na isa-isang hiwalay ang bawat tabing.
- source_word: כָפַלְתָּ
  choice: Tutupiin mo nang doble
  rationale: Ipinahahayag ng pandiwa ang pagtupi o pagdoble. Pinananatili ng parirala ang ideyang ang tabing ay itutupi upang maging doble.
- source_word: הַשִּׁשִּׁית
  choice: ang ikaanim
  rationale: Tuwirang salin ng pang-uring pamilang na tumutukoy sa ikaanim na tabing.
- source_word: אֶל מוּל פְּנֵי
  choice: sa harap ng
  rationale: Ipinahahayag ng parirala ang kinalalagyan ng nakatuping tabing sa bahaging harapan o nakaharap sa harapan ng tolda. Natural at sapat sa Filipino ang “sa harap ng.”
- source_word: הָאֹהֶל
  choice: tolda
  rationale: Ang salitang Hebreo ay literal na “tolda.” Pinananatili ito sa halip na gamitin ang mas interpretatibong “tabernakulo.”
