  text: Five curtains shall be joined to one another[a], and five curtains shall be joined to one another.
translation:
  language: tl
  text: Ang limang tabing ay pagdurugtungin sa isa't isa[a], at ang limang tabing ay pagdurugtungin sa isa't isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “isang babae sa kaniyang kapatid na babae,” isang idyoma para sa magkakatugmang bagay na pinagdurugtong sa isa't isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: mga tabing
  rationale: Sa konteksto ng pagtatayo ng tabernakulo, tumutukoy ito sa malalaking telang pantakip o tabing. Natural at angkop sa arkitekturang konteksto ang “mga tabing.”
- source_word: תִּהְיֶיןָ חֹבְרֹת
  choice: ay pagdurugtungin
  rationale: Ipinahihiwatig ng anyo ng pandiwa ang tagubilin kung paano bubuuin ang tabernakulo. Malinaw na naipapahayag ng “pagdurugtungin” ang preskriptibong diwa at ang pagkakabit ng magkakahiwalay na tabing.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: sa isa't isa
  rationale: Literal itong “isang babae sa kaniyang kapatid na babae,” ngunit isa itong Hebreong idyoma para sa magkakatugmang bagay na pinagdurugtong. Ang “sa isa't isa” ay natural sa modernong Tagalog at hindi nagdaragdag ng diwa.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: ang limang ... at ang limang
  rationale: Pinananatili nito ang magkatimbang na dalawang pangkat ng tiglilimang tabing, gaya ng estruktura ng Hebreo.
