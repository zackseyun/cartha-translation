translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “tabing” bilang karaniwang salitang angkop sa banal na tolda, at pinanatili ang paulit-ulit at magkatimbang na anyo ng dalawang sugnay sa Hebreo.
