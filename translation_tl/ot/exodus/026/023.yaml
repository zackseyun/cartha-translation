  source_fidelity: 'Tapat ang salin sa Hebreo: ang dalawang tabla ay para sa mga sulok ng tabernakulo sa gawing likuran. Ang bilang na “dalawang” para sa mga tabla at ang plural na “mga sulok” ay sapat na naghahatid ng kontekstong dalawang dulong bahagi, habang ang talababa ay wastong naglilinaw sa dual na anyo ng בַּיַּרְכָתָיִם.'
  naturalness: Natural at malinaw ang “At gagawa ka ng dalawang tabla para sa mga sulok sa likuran ng tabernakulo.” Ang ayos ay payak, marangal, at angkop sa sunod-sunod na mga tagubilin sa pagtatayo.
  terminology: Ang “tabla” ay angkop para sa קְרָשִׁים at hindi labis na nagpapakahulugan. Ang “tabernakulo” ay matatag at madaling makilalang termino sa Filipino para sa מִשְׁכָּן. Ang “mga sulok” ay maingat na katumbas ng teknikal na לִמְקֻצְעֹת; pinananatili ng talababa ang posibleng “mga panulok.”
