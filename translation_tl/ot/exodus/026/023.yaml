  text: And you shall make two boards for the corners of the tabernacle at the rear[a].
translation:
  language: tl
  text: At gagawa ka ng dalawang tabla para sa mga sulok sa likuran ng tabernakulo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “para sa mga panulok ng tabernakulo, sa dalawang bahaging nasa likuran.” Ang mga salitang Hebreo ay mga terminong pang-arkitektura at medyo teknikal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: At ... dalawang
  rationale: Ipinagpapatuloy ng pang-ugnay at ng anyong construct ng bilang na “dalawa” ang sunod-sunod na tagubilin sa pagtatayo.
- source_word: קְרָשִׁים
  choice: tabla
  rationale: Tumutukoy ito sa malalaking yunit na kahoy na bumubuo sa mga dingding ng tabernakulo; mas natural at pamilyar ang “tabla” kaysa sa mas mapagpakahulugang “balangkas.”
- source_word: תַּעֲשֶׂה
  choice: gagawa ka
  rationale: Ang ikalawang panauhang panlalaking isahan na imperfect sa kontekstong nagbibigay-tagubilin ay may puwersang pautos; likas sa Filipino ang hinaharap na “gagawa ka.”
- source_word: לִ/מְקֻצְעֹת
  choice: para sa mga sulok
  rationale: Ang salita ay tumutukoy sa mga sulok o anggulong pinagdurugtungan; pinananatili ng salin ang pang-arkitekturang diwa nang hindi labis na tinutukoy ang eksaktong anyo.
- source_word: הַ/מִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang karaniwang terminong Filipino para sa banal na toldang tirahan sa Exodo at malinaw na ipinag-iiba ito sa ordinaryong tirahan.
- source_word: בַּ/יַּרְכָתָיִם
  choice: sa likuran
  rationale: Ang dual na anyo ay tumutukoy sa dalawang dulong bahagi sa likod. Sa Filipino, likas na naipahihiwatig ng “mga sulok sa likuran” ang dalawang bahaging iyon nang hindi inuulit ang “sulok.”
