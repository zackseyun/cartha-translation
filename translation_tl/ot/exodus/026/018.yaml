translation:
  language: tl
  text: 'Gagawa ka ng mga balangkas[a] para sa tabernakulo: dalawampung balangkas para sa timog na panig, patimog.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla” sa halip na “mga balangkas.” Ang salitang Hebreo ay tumutukoy sa mga sangkap na bumubuo sa estruktura ng tabernakulo at maaaring unawain sa alinmang paraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal perfect na may prefixed conjunction ay nagsasaad dito ng utos sa konteksto ng mga tagubilin; likas sa modernong Tagalog ang anyong panghinaharap upang ipahayag ang direktiba.
- source_word: הַקְּרָשִׁים
  choice: mga balangkas
  rationale: Ang קֶרֶשׁ ay tumutukoy sa mga patayong sangkap ng estruktura ng tabernakulo. Pinananatili ng “mga balangkas” ang estruktural na diwa, habang kinikilala sa talababa ang posibleng “mga tabla.”
- source_word: לַמִּשְׁכָּן
  choice: para sa tabernakulo
  rationale: Ang מִשְׁכָּן ang karaniwang katawagan sa santuwaryong estruktura sa Exodo; ang “tabernakulo” ay kilala at tiyak sa kontekstong biblikal.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: dalawampung balangkas
  rationale: Bagaman nasa anyong isahan ang pangngalan sa karaniwang Hebreong konstruksyon ng pagbilang, natural sa Tagalog ang “dalawampung balangkas.”
- source_word: לִפְאַת
  choice: para sa bahaging
  rationale: Ang פֵאָה ay maaaring mangahulugang tagiliran, gilid, o dulo; sa paglalarawan ng estruktura, natural at malinaw ang “bahagi.”
- source_word: נֶגְבָּה תֵימָנָה
  choice: timog, na nakaharap sa timog
  rationale: Pinananatili nito ang dalawang magkaugnay na panandang Hebreo sa direksiyong timog sa halip na pagsamahin ang mga ito sa iisang pang-uri.
