translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Gagawa ka” bilang natural na anyo ng utos sa serye ng mga tagubilin, at pinanatili ang pag-uulit ng direksiyong timog upang katawanin ang kabuuan ng Hebreo.
