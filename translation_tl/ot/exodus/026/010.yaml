  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: tl
  text: Gagawa ka ng limampung loop sa gilid ng isang tabing—ang tabing na nasa dulo ng pinagdugtong na pangkat[a]—at limampung loop sa gilid ng tabing na nasa ikalawang pinagdugtong na pangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pinagdugtong na yunit.” Ang salitang Hebreo ay tumutukoy sa yunit na nabuo sa pagdurugtong ng mga tabing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal perfect na may prefixed conjunction ay gumaganap bilang utos sa konteksto ng mga tagubilin; natural sa modernong Tagalog ang anyong panghinaharap bilang direktiba.
- source_word: לֻלָאֹת
  choice: mga silo
  rationale: Tumutukoy ito sa mga loop na yari sa tela at ginagamit sa pagdurugtong ng mga tabing; malinaw at maikli ang “silo” sa kontekstong ito.
- source_word: שְׂפַת
  choice: gilid
  rationale: Bagaman literal na “labi,” ang likas na katumbas kapag tela ang tinutukoy ay “gilid.”
- source_word: הַיְרִיעָה
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa malaking telang panel; ang “tabing” ay dignified, pamilyar, at angkop sa gamit.
- source_word: הָאֶחָת
  choice: isang tabing
  rationale: Pinananatili ang di-tiyak na “isa” ng Hebreo sa halip na tahasang gawing “una.”
- source_word: הַקִּיצֹנָה
  choice: ang tabing na nasa dulo
  rationale: Ipinahahayag ang posisyon nito sa pinakadulo ng pinagsamang pangkat nang natural sa Tagalog.
- source_word: בַּחֹבָרֶת
  choice: ng pinagdugtong na pangkat
  rationale: Ang pangngalan ay tumutukoy sa isang yunit o pangkat na nabuo sa pagdurugtong ng mga tabing; pinananatili ang ideya ng kapuwa pangkat at pagkakadugtong.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: tabing na nasa ikalawang pinagdugtong na pangkat
  rationale: Binabasa ang parirala ayon sa istruktura ng dalawang pinagsamang pangkat ng mga tabing sa konteksto; iniiwasang ipakahulugang isa lamang itong “ikalawang tabing.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tabing,” “silo,” at “pinagdugtong na pangkat” upang maging madaling maunawaan ang teknikal na tagubilin nang hindi nawawala ang konstruksiyonal na diwa ng Hebreo.
