base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: tl
  text: Dapat magkatugma ang dalawang ito sa ibaba[a], at sa itaas nito ay mabuo nang magkasama[b] hanggang sa isang argolya[c]. Gayon ang magiging ayos ng dalawa; ang dalawang ito ang magiging para sa dalawang sulok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magkambal” o “magkapares” sa ibaba; inilalarawan ng Hebreo ang dalawang tabla bilang magkatugmang pares.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maging buo” o “ganap ang pagkakabuo.” Ang salita rito ay tumutukoy sa kabuuan ng pagkakabuo, hindi sa moral na kasakdalan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “hanggang sa iisang argolya” o “hanggang sa unang argolya.” Maaaring ang tinutukoy ay ang argolyang nagdurugtong sa magkaparis na tabla sa itaas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: magkapares
  rationale: Ipinahihiwatig ng salita na ang dalawang tabla ay magkatambal o magkatugma bilang isang pares. Likas at malinaw sa makabagong Tagalog ang “magkapares” nang hindi tinutukoy nang labis ang eksaktong paraan ng pagkakabit.
- source_word: מִלְּמַטָּה
  choice: sa ibaba
  rationale: Tinutukoy nito ang mababang dulo ng mga tabla. Ang “sa ibaba” ang pinakanatural na panandang panlunan sa kontekstong ito.
- source_word: וְיַחְדָּו
  choice: magkasama
  rationale: Binibigyang-diin nito na ang dalawang tabla ay bumubuo o gumaganap nang magkasama.
- source_word: תַמִּים
  choice: maging buo
  rationale: Sa kontekstong pang-istruktura, ang salita ay tumutukoy sa pagiging ganap o buo ng pagkakabuo, hindi sa moral na kasakdalan. Hindi rin nito ipinipilit ang isang tiyak na teknik sa karpinterya.
- source_word: עַל רֹאשׁוֹ
  choice: sa itaas nito
  rationale: Ang literal na “ulo” ay tumutukoy sa itaas na dulo ng kayarian. Pinananatili ng “nito” ang isahang hulaping Hebreo at ang maaaring kolektibong pagtukoy nito.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: hanggang sa iisang argolya
  rationale: Mahigpit nitong sinusundan ang tiyak na pantukoy at bilang na “isa.” Ang “iisang argolya” ay nagpapanatili sa posibilidad na isang partikular o nag-iisang argolya ang tinutukoy, sa halip na tiyak na ipakahulugang “unang argolya.”
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Gayon ang gagawin sa dalawang iyon
  rationale: Natural itong buod ng parehong tagubilin para sa dalawang tabla, habang ang pasibong anyo ay hindi nagdaragdag ng di-binanggit na tagaganap.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: para sa dalawang sulok
  rationale: Direkta nitong isinasalin ang pagtukoy sa dalawang sulok nang hindi idinaragdag ang “likuran,” na nakasalalay sa mas malawak na konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “argolya” bilang karaniwang katawagang pangkayarian para sa singsing na metal. Pinanatili ang kalabuan ng isahang hulapi sa “itaas nito” at ng הָאֶחָת bilang “iisang,” sa halip na tiyak na lutasin bilang “una.”
