  to: Dapat magkatugma ang dalawang ito sa ibaba[a], at sa itaas nito ay mabuo nang magkasama[b] hanggang sa isang argolya[c]. Gayon ang magiging ayos ng dalawa; ang dalawang ito ang magiging para sa dalawang sulok.
