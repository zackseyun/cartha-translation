  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: tl
  text: Ang bawat tabla ay magkakaroon ng dalawang nakausling pansugpong na magkakabit sa isa’t isa[a]; ganito mo gagawin ang lahat ng tabla ng tabernakulo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “dalawang kamay para sa isang tabla, magkakabit, isang babae sa kaniyang kapatid na babae.” Dito, ang “mga kamay” ay tumutukoy sa mga nakausling pansugpong, at ang “isang babae sa kaniyang kapatid na babae” ay idyomang nagsasaad na ang dalawang bahagi ay magkatugma o magkakabit sa isa’t isa.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: nakausling pansugpong
  rationale: Literal na “mga kamay,” ngunit sa konteksto ng paggawa ng tabernakulo ay tumutukoy sa nakausling bahagi ng tabla na ipinapasok o ikinakabit sa kaukulang bahagi. Ang “nakausling pansugpong” ay malinaw sa karaniwang mambabasa nang hindi labis na tinutukoy ang eksaktong anyo nito.
- source_word: מְשֻׁלָּבֹת
  choice: magkaugnay
  rationale: Ipinahihiwatig ng anyong balintiyak na ang dalawang pansugpong ay magkakaugnay o magkatugma sa pagkakagawa. Pinananatili ng “magkaugnay” ang pangkalahatang diwa nang hindi ipinapalagay ang tiyak na mekanismo.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: na magkaugnay
  rationale: Ang literal na idyomang “babae sa kaniyang kapatid na babae” ay nagpapahayag ng ugnayan o pagtutugma ng dalawang magkatulad na bahagi. Isinama ito sa natural na pariralang Filipino at ipinaliwanag sa talababa.
- source_word: קֶרֶשׁ
  choice: tabla
  rationale: Tumutukoy ito sa patayong yunit na kahoy ng balangkas. Ang “tabla” ay payak, malinaw, at hindi labis na nagpapakahulugan gaya ng “balangkas.”
- source_word: מִשְׁכָּן
  choice: tabernakulo
  rationale: Bagaman kaugnay ng salitang “tirahan,” dito ay nakatalaga itong pangalan ng naililipat na banal na santuwaryo. Ang “tabernakulo” ang kinikilalang katawagan sa kontekstong ito.
- source_word: כֵּן תַּעֲשֶׂה
  choice: ganito mo gagawin
  rationale: Natural na modernong Filipino na nagpapanatili sa lakas ng tagubilin at sa huwarang dapat sundin.
- source_word: שְׁתֵּי
  choice: dalawang
  rationale: Tuwirang salin ng bilang na tumutukoy sa mga pansugpong.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: ang bawat tabla
  rationale: Pormal na “para sa isang tabla,” ngunit distributibo ang gamit sa konteksto at tumutukoy sa bawat indibidwal na tabla.
