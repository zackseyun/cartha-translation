translation:
  language: tl
  text: 'Magkakaroon ng walong balangkas[a], kasama ang mga patungan nitong yari sa pilak—labing-anim na patungan[b]: dalawang patungan sa ilalim ng isang balangkas at dalawang patungan sa ilalim ng isa pang balangkas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tabla.”
    reason: lexical_alternative
  - marker: b
    text: O “suksukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: mga balangkas
  rationale: Sa konteksto ng pagtatayo ng tabernakulo, tumutukoy ito sa mga patayong sangkap ng estruktura. Likas at malinaw sa makabagong Filipino ang “mga balangkas,” habang ang “mga tabla” ay pinananatili bilang posibleng alternatibo.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: mga patungan
  rationale: Tumutukoy ang salita sa mga piyesang sumusuporta sa ilalim ng mga balangkas. Karaniwang nauunawaan ang “mga patungan”; maaari ring gamitin ang “mga suksukan” kung bibigyang-diin ang anyong kinalalagyan o pinagkakabitan ng balangkas.
- source_word: כֶּסֶף
  choice: pilak
  rationale: Tuwirang pagtukoy sa materyal ng mga patungan.
- source_word: שִׁשָּׁה עָשָׂר
  choice: labing-anim
  rationale: Karaniwang salin sa Filipino ng bilang.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang pahayag ng lokasyon na angkop sa tagubilin sa pagtatayo.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: isang balangkas ... isa pang balangkas
  rationale: Ang inuulit na pariralang Hebreo ay may distributibong diwa. Ipinahahayag ng “isang balangkas” at “isa pang balangkas” ang pagkakaroon ng tigdalawang patungan nang hindi nagpapahiwatig ng pagkakasunod-sunod.
- source_word: וְהָיוּ
  choice: Magkakaroon ng
  rationale: Likas na eksistensiyal na pahayag sa Filipino para sa talaan ng mga sangkap at espesipikasyon.
