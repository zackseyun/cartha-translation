base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: tl
  text: Ang haba ng bawat tabing ay dalawampu't walong siko,[a] at ang lapad ng bawat tabing ay apat na siko. Iisa ang sukat ng lahat ng tabing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “ang tabing, ang isa … ang tabing, ang isa.” Gumagamit ang Hebreo ng anyong distributibo upang tukuyin ang sukat ng bawat tabing.'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “Magkakapareho ang sukat ng lahat ng tabing.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: haba
  rationale: Karaniwang terminong Filipino para sa sukat na pahaba at natural na kapareha ng “lapad.”
- source_word: הַיְרִיעָה
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa malaking piraso ng telang pantakip o pansapin; ang “tabing” ay malinaw at nakaugat sa gamit na ito.
- source_word: הָאַחַת / הָאֶחָת
  choice: bawat
  rationale: 'Bagaman literal na “ang isa,” distributibo ang gamit nito rito: ang mga sukat ay para sa bawat indibiduwal na tabing.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: dalawampu't walo
  rationale: Likas na anyo ng bilang sa modernong Filipino.
- source_word: בָּאַמָּה
  choice: siko
  rationale: Ang אַמָּה ay sinaunang yunit ng haba na karaniwang tinatawag na “siko” sa Filipino.
- source_word: וְרֹחַב
  choice: at ang lapad
  rationale: Natural na terminong panukat na katambal ng “haba.”
- source_word: אַרְבַּע
  choice: apat
  rationale: Tuwirang salin ng bilang.
- source_word: מִדָּה אַחַת
  choice: iisa ang sukat
  rationale: Pinananatili ang literal na diwang “isang sukat” habang natural na ipinahahayag na magkakapareho ang mga sukat.
- source_word: לְכָל הַיְרִיעֹת
  choice: ng lahat ng tabing
  rationale: Ipinakikitang ang iisang pamantayan ng sukat ay sumasaklaw sa buong pangkat ng mga tabing.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “tabing” bilang terminong angkop sa malaking telang bahagi ng tabernakulo at “siko” bilang tradisyonal ngunit malinaw na tawag sa sinaunang yunit. Inayos ang huling sugnay bilang “Iisa ang sukat” upang maging natural nang hindi nawawala ang pormal na diwa ng Hebreo.
