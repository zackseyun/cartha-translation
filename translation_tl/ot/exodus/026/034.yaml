  text: וְ/נָתַתָּ֙ אֶת הַ/כַּפֹּ֔רֶת עַ֖ל אֲר֣וֹן הָ/עֵדֻ֑ת בְּ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: tl
  text: At ilagay mo ang takip ng pagtubos[a] sa ibabaw ng kaban ng patotoo[b], sa Kabanal-banalang Lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “takip.” Tradisyonal na isinasalin itong “luklukan ng awa.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “kaban ng patotoo”; sa maraming salin, “kaban ng tipan.”
    reason: alternative_reading
  - marker: c
    text: Sa mas literal na anyo, “Banal ng mga Banal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: At ilagay mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na may pang-ugnay ay gumaganap bilang utos sa sunod-sunod na tagubilin. Likas at malinaw sa modernong Filipino ang “ilagay mo.”
- source_word: הַכַּפֹּרֶת
  choice: ang takip ng pagtubos
  rationale: Tumutukoy ito sa sagradong takip ng kaban na kaugnay ng ritwal ng pagtubos. Mas malinaw ito sa karaniwang mambabasa kaysa sa tradisyonal ngunit hindi gaanong likas na “luklukan ng awa,” habang ang mas payak na alternatibo ay nasa talababa.
- source_word: עַל
  choice: sa ibabaw ng
  rationale: Tiyak na ipinahihiwatig ng pang-ukol ang paglalagay ng takip sa ibabaw ng kaban; mas malinaw dito ang “sa ibabaw ng” kaysa sa payak na “sa.”
- source_word: אֲרוֹן הָעֵדֻת
  choice: kaban ng patotoo
  rationale: Tapat nitong pinananatili ang tahasang Hebreong “patotoo,” sa halip na palitan iyon ng tradisyonal na “tipan.” Ang “kaban” ang nakaugaliang katawagan sa sagradong sisidlang ito.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: sa Kabanal-banalang Lugar
  rationale: Ipinapahayag nito sa likas na Filipino ang superlatibong Hebreong idyoma para sa pinakabanal at pinakaloob na bahagi ng santuwaryo.
theological_decisions:
- issue: Kung tradisyonal o mas malinaw na katawagan ang gagamitin para sa כַּפֹּרֶת
  choice: takip ng pagtubos
  alternative: luklukan ng awa; takip
  rationale: Ang “takip ng pagtubos” ay kapuwa tumutukoy sa pisikal na takip at nagpapakita ng kaugnayan nito sa pagtubos nang hindi nagdaragdag ng isang natatanging doktrinal na paliwanag. Inilalahad sa talababa ang mas payak na “takip.”
- issue: Kung pananatilihin ang “patotoo” o gagamitin ang tradisyonal na “tipan” sa אֲרוֹן הָעֵדֻת
  choice: kaban ng patotoo
  alternative: kaban ng tipan
  rationale: “Patotoo” ang mismong nasa tekstong Hebreo. Hindi ito tahimik na itinugma sa mas pamilyar na katawagang “kaban ng tipan”; binanggit ang alternatibo sa talababa para sa pagkilala ng mambabasa.
- issue: Kung idiomatiko o literal ang katawagan sa pinakaloob na santuwaryo
  choice: Kabanal-banalang Lugar
  alternative: Banal ng mga Banal
  rationale: Malinaw na naihahatid ng pangunahing salin ang superlatibong diwa, samantalang pinananatili sa talababa ang mas literal at tradisyonal na anyo.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at angkop sa tekstong panliturhiya. Pinanatili ang “kaban” at “patotoo” bilang makikilalang terminong biblikal, habang ginawang natural ang pautos at ang katawagan sa sagradong lugar.
