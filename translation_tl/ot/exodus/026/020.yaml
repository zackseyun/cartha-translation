  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: tl
  text: At para sa ikalawang panig ng tabernakulo, sa hilagang panig, dalawampung balangkas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga tabla.” Ang salitang Hebreo ay maaaring tumukoy sa mga patayong bahaging bumubuo sa estruktura ng tabernakulo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: At para sa ... panig
  rationale: Ipinakikilala ng pang-ugnay at pang-ukol ang kasunod na tagubilin sa pagtatayo. Sa kontekstong ito, ang צֶלַע ay tumutukoy sa isang panig o dingding sa gilid, hindi sa literal na tadyang.
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ito ang karaniwang katawagan sa banal na toldang santuwaryo sa Exodo at pamilyar sa mga mambabasang Filipino.
- source_word: הַשֵּׁנִית
  choice: ikalawang
  rationale: Tinutukoy nito ang ikalawa sa dalawang magkatapat na mahabang panig, kasunod ng unang panig na inilalarawan sa naunang talata.
- source_word: לִפְאַת צָפוֹן
  choice: sa dakong hilaga
  rationale: Likas na pahayag ito sa Filipino para sa direksiyon o kinalalagyan ng panig ng estruktura.
- source_word: עֶשְׂרִים
  choice: dalawampung
  rationale: Tuwirang salin ng bilang na dalawampu at iniangkop sa pangngalang kasunod.
- source_word: קָרֶשׁ
  choice: balangkas
  rationale: Sa paglalarawan ng tabernakulo, tumutukoy ang salita sa patayong mga bahaging bumubuo at sumusuporta sa mga dingding. Naipapakita ng “balangkas” ang tungkuling pang-estruktura, habang nananatiling posibleng alternatibo ang “tabla.”
