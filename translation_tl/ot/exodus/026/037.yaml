  to: Gagawa ka ng limang haliging yari sa kahoy na akasya para sa tabing[a], at babalutan mo ng ginto ang mga iyon. Ang mga kawit ng mga haliging iyon ay ginto; at maghuhulma ka para sa mga iyon ng limang patungan na tanso.[b]
