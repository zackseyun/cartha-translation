translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang panghinaharap na anyo upang likas na ipahayag ang Hebreong utos sa kontekstong ito. Inulit ang “mga iyon” upang mapanatiling malinaw ang pagtukoy sa limang haligi.
