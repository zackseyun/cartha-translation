  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: tl
  text: Gagawa ka ng limang haliging yari sa kahoy na akasya para sa tabing[a], at babalutan mo ng ginto ang mga iyon. Ang mga kawit ng mga haliging iyon ay ginto; at maghuhulma ka para sa mga iyon ng limang patungan na tanso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kurtina” o “pantakip.” Ang salitang Hebreo rito ay tumutukoy sa nakasabit na pantakip sa pasukan, na iba sa panloob na tabing ng Kabanal-banalan.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “limang saksakang tanso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: tabing
  rationale: Tumutukoy ito sa nakasabit na pantakip sa pasukan ng tabernakulo, hindi sa panloob na kurtinang naghihiwalay sa Kabanal-banalan. Likas at malawak ang “tabing” sa Filipino habang naipapakita ng talababa ang pagkakaibang ito.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: mga haliging yari sa kahoy na akasya
  rationale: Ang עַמּוּדִים ay mga haligi o poste, at ang שִׁטִּים ay kahoy na akasya na ginagamit sa mga tagubilin tungkol sa tabernakulo.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: babalutan mo ng ginto ang mga iyon
  rationale: Ang pandiwa ay tumutukoy sa paglalagay ng metal na sapin sa ibabaw; natural at malinaw sa modernong Filipino ang “babalutan ng ginto.”
- source_word: וָוֵיהֶם
  choice: mga kawit ng mga iyon
  rationale: Sa konteksto ng tabernakulo, malamang na tumutukoy ang וָוִים sa mga kawit na kaugnay ng pagkakabit ng tabing.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: mga patungang tanso
  rationale: Ang אַדָן ay suportang base o socket ng haligi. Malinaw sa ordinaryong Filipino ang “patungan,” samantalang pinananatili sa talababa ang alternatibong “saksakan.”
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Karaniwang katumbas sa Filipino ng sinaunang copper-alloy material ang “tanso”; hindi ipinipilit ng salin ang mas teknikal na tiyak na komposisyon.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: maghuhulma ka para sa mga iyon
  rationale: Tumutukoy ang יצק sa paghuhulma sa pamamagitan ng pagbubuhos ng tunaw na metal, at ipinapakita ng “para sa mga iyon” na ang mga patungan ang hinuhulma para sa mga haligi.
