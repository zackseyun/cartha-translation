base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: tl
  text: Gumawa ka ng isang pantabing para sa pasukan ng tolda[a], mula sa sinulid na asul, purpura, at iskarlata, at sa pinong lino na pinilipit—gawa ng isang mangbuburda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kurtina” o “tabing” na tumatakip sa pasukan. Ginamit dito ang “pantabing” upang maihiwalay ito sa panloob na tabing na inilalarawan sa talata 31.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: pantabing
  rationale: Tumutukoy ito sa telang nakasabit na nagsisilbing takip o harang. Natural sa modernong Tagalog ang “pantabing” at naihihiwalay nito ang telang nasa pasukan mula sa panloob na tabing sa talata 31.
- source_word: לְפֶתַח הָאֹהֶל
  choice: para sa pasukan ng tolda
  rationale: Ang פֶתַח ay pasukan o bukana; ang “pasukan” ang pinakanatural dito dahil daraanan ito. Tuwirang isinasalin ng “tolda” ang אֹהֶל nang hindi ipinapasok sa pariralang ito ang mas interpretatibong “tabernakulo.”
- source_word: תְּכֵלֶת
  choice: sinulid na asul
  rationale: Tumutukoy ang salita sa mamahaling tinina na materyal na asul o bughaw-lila. Ang “asul” ay malinaw sa karaniwang mambabasa, at ang “sinulid” ay inilapat sa magkakasunod na kulay upang luminaw na mga materyales sa paghahabi ang tinutukoy.
- source_word: אַרְגָּמָן
  choice: purpura
  rationale: Tumutukoy ito sa materyal na tinina ng kulay purpura. Dignified at tiyak ang “purpura” sa konteksto ng mga telang panritwal.
- source_word: תוֹלַעַת שָׁנִי
  choice: matingkad na pula
  rationale: Idyomatikong tumutukoy ang parirala sa materyal na tinina ng scarlet, hindi sa literal na uod. Mas natural at madaling maunawaan ang “matingkad na pula” kaysa sa bihira o hindi pantay na gamit ng mga salitang “iskarlata” at “karmesí.”
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili ng salin ang parehong uri at kalidad ng materyal (pinong lino) at ang paraan ng paghahanda sa hibla (pinilipit).
- source_word: מַעֲשֵׂה רֹקֵם
  choice: gawa ng isang mangbuburda
  rationale: Pinananatili nito ang diin ng konstruktong Hebreo sa gawa ng isang bihasang artisan sa pandekorasyong paghahabi o pagbuburda.
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Sa sunod-sunod na tagubilin, ang waw na sinusundan ng perfect ay may puwersang pautos. Natural sa Tagalog ang anyong panghinaharap na “Gagawa ka” bilang tuwirang tagubilin.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal ang himig. Ginamit ang “pantabing” para sa functional distinction, “tolda” bilang tuwirang katumbas ng אֹהֶל, at isang em dash upang malinaw na iugnay ang buong tela sa gawa ng bihasang mangbuburda.
