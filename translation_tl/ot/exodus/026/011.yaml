  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: tl
  text: Gagawa ka rin ng limampung pang-ipit na bronse[a]. Ipasok mo ang mga pang-ipit sa mga silo at pagdugtungin mo ang tolda upang maging isa itong kabuuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pang-ipit na tanso.” Ang salitang Hebreo ay maaaring tumukoy sa tanso o bronse, depende sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: mga pang-ipit na bronse
  rationale: Ang קַרְסִים ay mga piyesang pangkabit na nag-uugnay sa mga tabing; natural at malinaw sa Filipino ang “pang-ipit.” Maaaring tanso o bronse ang נְחֹשֶׁת, ngunit “bronse” ang karaniwang salin sa konteksto ng mga metal na gamit sa santuwaryo.
- source_word: חֲמִשִּׁים
  choice: limampu
  rationale: Tuwirang bilang ng mga pang-ipit.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: Ipasok mo ang mga pang-ipit sa mga silo
  rationale: Ang hiphil ng בוא ay nagpapahiwatig ng pagpapasok o paglalagay sa loob; “ipasok” ang pinakanatural na utos sa Filipino. Ang לֻלָאֹת ay mga silong nakakabit sa gilid ng mga tabing.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: pagdugtungin mo ang tolda
  rationale: Ang חבר ay nangangahulugang pag-ugnayin o pagdugtungin. Pinananatili ng “tolda” ang tiyak na tawag na אֹהֶל sa halip na palitan ito ng mas malawak na terminong “tabernakulo.”
- source_word: וְהָיָה אֶחָד
  choice: upang maging isa itong kabuuan
  rationale: Ipinahahayag ng sugnay ang bunga ng pagdurugtong. Nililinaw ng “isang kabuuan” na ang magkakahiwalay na bahagi ay bubuo ng iisang tolda nang hindi nagdaragdag ng teolohikal na kahulugan.
