  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: tl
  text: Sa araw na ito ay umaalis kayo, sa buwan ng Abib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Abib ay pangalan ng buwan; ang katawagang ito ay kaugnay ng paghinog ng mga butil sa panahon ng tagsibol.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: Sa araw na ito
  rationale: Ginagamit ang pangngalan bilang panandang-panahon para sa kasalukuyang araw ng pag-alis. Pinananatili ng “Sa araw na ito” ang diin at agarang diwa ng pahayag.
- source_word: אַתֶּם
  choice: kayo
  rationale: Ang panghalip ay ikalawang panauhang panlalaking maramihan at tumutukoy sa Israel; likas na ipinahahayag ito ng “kayo” sa Tagalog.
- source_word: יֹצְאִים
  choice: lumalabas
  rationale: Ang Qal participle na maramihan ng יצא ay nagpapahayag ng nagpapatuloy o nalalapit na pagkilos. Ang “lumalabas” ay nagpapanatili sa aspektong ito at sa pagkilos palabas.
- source_word: בְּחֹדֶשׁ
  choice: sa buwan ng
  rationale: Ang pang-ukol na ב na kasama ng “buwan” ay tumutukoy sa panahong pangkalendaryo at likas na isinasalin bilang “sa buwan ng.”
- source_word: הָאָבִיב
  choice: Abib
  rationale: Pinanatili bilang transliteradong katawagan sa buwan sa halip na palitan ng paliwanag na gaya ng “tagsibol” o “mga sariwang uhay.”
