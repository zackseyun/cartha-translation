language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: tl
  text: Nang magmatigas si Faraon at tumangging paalisin kami, pinatay ni Yahweh ang lahat ng panganay sa lupain ng Ehipto, mula sa panganay ng tao hanggang sa panganay ng hayop.[a] Kaya inihahandog ko kay Yahweh bilang hain ang bawat lalaking unang lumabas sa sinapupunan, ngunit tinutubos ko ang bawat panganay kong anak na lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mula sa panganay ng sangkatauhan hanggang sa panganay ng mga alagang hayop.”
    reason: Pinananatili ang mga posibleng mas malawak o mas tiyak na katumbas ng generic na אָדָם at ng בְּהֵמָה.
lexical_decisions:
- source_word: הִקְשָׁה
  choice: nagmatigas ... at tumanggi
  rationale: Ipinahahayag ng Hiphil ng קשׁה sa kontekstong ito ang matigas at sadyang pagtutol ni Faraon. Likas sa modernong Tagalog ang tambalang pariralang ito.
- source_word: לְשַׁלְּחֵנוּ
  choice: paalisin kami
  rationale: Sa salaysay ng Exodo, ang שׁלח ay tumutukoy sa pagpapalaya o pagpapaalis sa Israel; malinaw at natural dito ang “paalisin kami.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na tahasang nasa tekstong Hebreo.
- source_word: בְּכוֹר
  choice: panganay
  rationale: Ito ang karaniwan at eksaktong katumbas sa Tagalog para sa unang ipinanganak.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: mula sa panganay ng tao hanggang sa panganay ng hayop
  rationale: Ang אָדָם ay generic na tumutukoy sa tao at inihahambing sa בְּהֵמָה, hayop. Pinananatili ng salin ang saklaw at paghahambing ng Hebreo.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Malinaw nitong ipinakikita ang ugnayang sanhi at bunga sa naunang pagpatay sa mga panganay at sa kasunod na paghahandog at pagtubos.
- source_word: זֹבֵחַ
  choice: inihahandog ... bilang hain
  rationale: Ang זבח ay paghahandog sa pamamagitan ng sakripisyo. Ang pariralang ito ay malinaw sa kasalukuyang Tagalog at hindi nalilito sa pangkalahatang pagbibigay lamang.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: ang bawat lalaking unang lumabas sa sinapupunan
  rationale: Isinasalin nang idiomatiko ang Hebreong paglalarawan sa unang supling na nagbukas o lumabas sa sinapupunan, habang pinananatili ang pagtatakdang lalaki.
- source_word: בָּנַי
  choice: aking mga anak na lalaki
  rationale: Tiyak na “mga anak na lalaki” ang kahulugan ng Hebreo, hindi pangkalahatang “mga anak.”
- source_word: אֶפְדֶּה
  choice: tinutubos ko
  rationale: Sa legal at panrelihiyong konteksto, ang פדה ay pagtubos sa pamamagitan ng kapalit o kabayaran.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Saklaw ng אָדָם kapag inihahambing sa בְּהֵמָה
  choice: tao
  alternative: sangkatauhan / mga tao
  rationale: Generic ang אָדָם at tumutukoy sa mga tao bilang kaibahan sa mga hayop. Ang “tao” ay maikli, natural, at hindi naglilimita sa kasariang lalaki.
- issue: Ugnayan ng paghahain sa mga lalaking unang lumabas sa sinapupunan at pagtubos sa mga anak na lalaki
  choice: 'Pinanatili ang tuwirang kaibahan: inihahain ang una, ngunit tinutubos ang mga panganay na anak na lalaki'
  alternative: Tahasang tukuyin sa pangunahing teksto na mga hayop ang inihahain
  rationale: Ipinahihiwatig ng konteksto na mga hayop ang inihahain, ngunit hindi iyon tahasang inuulit sa sugnay na Hebreo. Pinananatili ng salin ang pagkakabuo at tensiyon ng pinagmulan nang hindi nagdaragdag.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “hain” at “tinutubos” upang mapanatili ang legal-panrelihiyong diwa nang hindi nagiging lipas o labis na teknikal. Inilagay ang panandang [a] sa pariralang mismong tinatalakay ng talababa.
