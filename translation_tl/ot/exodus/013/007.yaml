base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: tl
  text: Tinapay na walang pampaalsa ang kakainin sa buong pitong araw[a]. Walang anumang pinaalsang pagkain ang makikita sa inyong pag-iingat[b], at walang pampaalsa ang makikita sa buong nasasakupan ninyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang parirala ay tumutukoy sa buong tagal ng pitong araw.
    reason: translation_clarity
  - marker: b
    text: Sa literal, “makikita sa inyo.” Ipinahihiwatig ng pananalita na walang pinaalsang pagkain ang dapat manatili sa inyong pag-iingat o sakop.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Tumutukoy sa tinapay na inihanda nang walang pampaal­sang sangkap sa konteksto ng Paskuwa; malinaw at likas ito sa makabagong Filipino.
- source_word: יֵאָכֵל
  choice: ang kakainin
  rationale: Pinananatili ang pasibong diwa ng Niphal at ang legal na bisa ng pahayag nang hindi ito ginagawang tuwirang pautos.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: sa buong pitong araw
  rationale: 'Ipinahahayag ang accusative of duration: saklaw ang kabuuan ng pitong araw.'
- source_word: יֵרָאֶה לְךָ
  choice: makikita sa inyo
  rationale: Malapit sa literal na 'makikita kasama ninyo' ngunit mas likas sa Filipino; pinananatili rin ang pahiwatig na hindi ito dapat matagpuan sa kanilang pag-iingat o sakop.
- source_word: חָמֵץ
  choice: anumang pagkaing may pampaalsa
  rationale: Tumutukoy nang malawak sa bagay o pagkaing pinaalsa, at sa gayon ay naihihiwalay sa שְׂאֹר, ang sangkap na nagpapaalsa.
- source_word: שְׂאֹר
  choice: pampaalsa
  rationale: Tumutukoy sa mismong sangkap o masa na ginagamit sa pagpapaalsa; mas malawak at mas angkop sa sinaunang konteksto kaysa sa modernong komersiyal na lebadura lamang.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: saanman sa inyong nasasakupan
  rationale: Likas na Filipino para sa buong lawak ng teritoryo o sakop na tinutukoy ng parirala.
theological_decisions:
- issue: Pagkakaiba ng חָמֵץ at שְׂאֹר
  choice: Isinalin ang una bilang 'anumang pagkaing may pampaalsa' at ang ikalawa bilang 'pampaalsa.'
  alternative: Isalin pareho bilang 'pampaalsa' o 'lebadura.'
  rationale: Pinananatili nito ang leksikal na pagkakaiba sa pagitan ng pinaalsang bagay at ng sangkap na ginagamit sa pagpapaalsa, nang hindi nagdaragdag ng doktrinal na paliwanag.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang 'pampaalsa' ay pinili sa halip na 'lebadura' upang maisama ang sinaunang pinaalsang masa o starter, hindi lamang ang modernong yeast. Ginamit ang pangmaramihang 'inyo' bilang natural na pagtukoy sa sambayanang kinakausap.
