base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: tl
  text: At ito ay magiging tanda sa iyong kamay at mga pananda[a] sa pagitan ng iyong mga mata[b], sapagkat sa pamamagitan ng malakas na kamay ay inilabas tayo ni Yahweh mula sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “mga pananda” ay bihira at hindi tiyak ang kahulugan. Maaari rin itong isalin na “mga panali”; ayon sa tradisyon, “mga pilakterya.” Malamang na tumutukoy ito sa isang bagay na isinusuot sa noo bilang paalala.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa pagitan ng iyong mga mata,” isang pananalitang madalas unawain na “sa iyong noo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At ito ay magiging
  rationale: Ang anyong pandiwa sa kontekstong ito ay tumutukoy sa patuloy na magiging kabuluhan ng utos; natural itong ipinahahayag sa Filipino sa hinaharap.
- source_word: לְאוֹת
  choice: tanda
  rationale: Malawak ang saklaw ng אוֹת bilang tanda o palatandaan; pinananatili ng “tanda” ang konkretong larawan nang hindi ito labis na binibigyang-kahulugan.
- source_word: עַל יָדְכָה
  choice: sa iyong kamay
  rationale: “Kamay” ang tahasang nasa Hebreo, hindi “braso,” kaya pinanatili ang larawan ng pinagmulan.
- source_word: וּלְטוֹטָפֹת
  choice: mga pananda
  rationale: Bihira at hindi tiyak ang טוֹטָפֹת. Ang “mga pananda” ay nauunawaan sa modernong Filipino at hindi ipinapalagay na tiyak na tumutukoy na ito sa kalaunang mga pilakterya.
- source_word: בֵּין עֵינֶיךָ
  choice: sa pagitan ng iyong mga mata
  rationale: Pinanatili ang literal na idyomatikong larawan ng Hebreo; ang interpretasyong “sa iyong noo” ay inilagay sa talababa.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang pahayag.
- source_word: בְּחֹזֶק יָד
  choice: sa pamamagitan ng malakas na kamay
  rationale: Pinananatili nito ang larawan ng makapangyarihang pagkilos nang malapit sa anyo ng Hebreo.
- source_word: הוֹצִיאָנוּ
  choice: inilabas tayo
  rationale: 'Ang Hiphil ng יצא ay nangangahulugang sanhiing lumabas o “ilabas”; kasama sa hulapi ang nagsasalitang bayan: “tayo.”'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִמִּצְרָיִם
  choice: mula sa Ehipto
  rationale: Natural na katambal ito sa Filipino ng “inilabas tayo” at tumpak na naghahayag ng pinagmulan.
theological_decisions:
- issue: Kung literal na pananatilihin ang wika tungkol sa kamay at mga mata o tutukuyin ito bilang kalaunang rituwal na bagay
  choice: 'Pinanatili sa pangunahing teksto ang konkretong larawan: “sa iyong kamay” at “sa pagitan ng iyong mga mata.”'
  alternative: Isalin bilang “mga pilakterya sa iyong noo” o bilang isang ganap na matalinghagang paalala.
  rationale: Hindi tahasang nililinaw ng Hebreo kung ang pananalita ay literal, simboliko, o kapuwa. Ang salin ay hindi dapat magpasya sa usaping sadyang nananatiling bukas sa teksto.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang payak at konkretong larawan ng Hebreo, habang inilagay sa mga talababa ang mga interpretibong kahalili para sa bihirang termino at sa idyomang “sa pagitan ng iyong mga mata.”
