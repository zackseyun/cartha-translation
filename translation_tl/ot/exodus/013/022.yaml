translation:
  language: tl
  text: Hindi umaalis mula sa harap ng bayan ang haliging ulap sa araw, ni ang haliging apoy sa gabi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Hindi lumalayo mula sa harap ng bayan.” Binibigyang-diin ng pandiwang Hebreo na patuloy na nasa harap ng bayan ang mga haliging gumagabay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: hindi lumilisan
  rationale: Ang pandiwang mula sa מוּשׁ ay tumutukoy sa pag-alis o paglayo. Ipinahihiwatig ng “hindi lumilisan” na nanatiling nasa harap ng bayan ang mga haligi.
- source_word: עַמּוּד
  choice: haligi
  rationale: Ang “haligi” ang likas at malinaw na katumbas para sa patayong anyong inilalarawan sa salaysay.
- source_word: הֶעָנָן
  choice: ulap
  rationale: Tuwirang salin ng עָנָן at likas sa pariralang “haliging ulap.”
- source_word: יוֹמָם
  choice: kapag araw
  rationale: Ipinapahayag ng anyong pang-abay ang panahon at natural itong itinatambal sa “kapag gabi” sa modernong Tagalog.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: ni ang haliging apoy
  rationale: Pinananatili ang kaagapay na estruktura at ang kongkretong larawan ng apoy; ang “ni” ay angkop sa saklaw ng naunang pagtanggi.
- source_word: לָיְלָה
  choice: kapag gabi
  rationale: Likas na panandang pamanahon sa Tagalog at malinaw na katapat ng “kapag araw.”
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: 'Pinananatili ang tahasang ugnayang pangkalawakan: nasa unahan ng bayan ang mga haligi.'
- source_word: הָעָם
  choice: ang bayan
  rationale: Ang pangngalan ay kolektibong tumutukoy sa Israel; ang “bayan” ay marangal at natural sa kontekstong biblikal.
