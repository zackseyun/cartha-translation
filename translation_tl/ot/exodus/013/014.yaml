base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: tl
  text: Kapag tanungin ka ng iyong anak balang araw, ‘Ano ito?’ sasabihin mo sa kanya, ‘Sa pamamagitan ng malakas na kamay, inilabas tayo ni Yahweh mula sa Ehipto, mula sa bahay ng pagkaalipin.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: sa hinaharap
  rationale: Sa kontekstong ito, tumutukoy ito sa isang panahon sa hinaharap, hindi kinakailangang literal na ‘bukas.’
- source_word: בְּחֹזֶק יָד
  choice: sa pamamagitan ng makapangyarihang kamay
  rationale: Pinananatili ang Hebreong metapora ng kamay bilang larawan ng kapangyarihan habang natural sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang personal na pangalan ng Diyos bilang Yahweh sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng pagkaalipin
  rationale: Pinananatili ang matalinghagang ‘bahay’ at ang diwa ng kolektibong kalagayan ng sapilitang paglilingkod.
theological_decisions:
- issue: Pagkakakilanlan ng tagapagligtas sa exodo
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Ang pinagmulan ay gumagamit ng tetragrammaton, isang personal na pangalan; hindi ito ginawang pangkalahatang titulo.
- issue: Pakikiisa ng mga susunod na salinlahi sa exodo
  choice: inilabas tayo
  alternative: inilabas ang ating mga ninuno
  rationale: Pinananatili ang unang panauhang maramihan ng הוֹצִיאָנוּ at ang tekstuwal na pakikiisa ng nagsasalita sa bayang iniligtas.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pormulang ‘At mangyayari’ dahil may malinaw na ugnayang pasalaysay at panghinaharap sa Hebreo, ngunit ginawang natural ang tanong bilang ‘Ano ang ibig sabihin nito?’
