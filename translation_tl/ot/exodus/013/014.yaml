  - severity: low
    issue: Hindi natural ang estrukturang “At mangyayari, kapag ...”.
    rationale: Bagaman literal na sumasalamin ito sa וְהָיָה כִּי, hindi ito ang karaniwang natural na pagpapahayag sa modernong Filipino; sapat ang “Kapag ... balang araw.”
