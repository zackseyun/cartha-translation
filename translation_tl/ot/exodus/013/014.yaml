revisions:
- from: At mangyayari, kapag tinanong ka ng iyong anak sa hinaharap, ‘Ano ang ibig sabihin nito?’ sabihin mo sa kanya, ‘Sa pamamagitan ng makapangyarihang kamay, inilabas tayo ni Yahweh mula sa Ehipto, mula sa bahay ng pagkaalipin.’
  to: Kapag tanungin ka ng iyong anak balang araw, ‘Ano ito?’ sasabihin mo sa kanya, ‘Sa pamamagitan ng malakas na kamay, inilabas tayo ni Yahweh mula sa Ehipto, mula sa bahay ng pagkaalipin.’
  rationale: Inayos ang idiomatikong pangungusap sa modernong Filipino at ibinalik ang tanong sa antas ng pagiging tiyak ng Hebreo. Pinanatili ang hinaharap na di-literal na diwa ng מָחָר, ang Yahweh, ang “tayo,” at ang metapora ng bahay ng pagkaalipin.
