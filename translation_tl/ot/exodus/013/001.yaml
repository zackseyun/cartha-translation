base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'Pagkatapos, nagsalita si Yahweh[a] kay Moises at sinabi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; isinasatitik din bilang “Jehovah” sa ilang salin.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay. Likas na ipinapahayag ng “Pagkatapos” ang pagkakasunod-sunod, habang tuwirang tinutumbasan ng “nagsalita” ang pandiwang דִּבֵּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na pangalang YHWH upang mapanatili itong personal na pangalan at hindi palitan ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang “kay” ang likas na panandang Filipino para sa taong pinatutungkulan ng pagsasalita; ang מֹשֶׁה ay isinalin ayon sa kinagawiang anyong Filipino na “Moises.”
- source_word: לֵאמֹר
  choice: 'at sinabi:'
  rationale: Ipinakikilala ng infinitibong ito ang tuwirang pahayag na kasunod. Ang “at sinabi:” ay natural sa modernong Filipino at pinananatili ang tungkulin ng pormulang Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan ng Diyos at hindi ito pinapalitan ng titulong “PANGINOON”; inilalahad sa talababa ang ibang kilalang anyo nang hindi ipinipilit ang isang bigkas bilang ganap na tiyak.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Pinanatili ang pagsulong ng salaysay at ang pormulang nagpapakilala sa kasunod na tuwirang pahayag; inilagay ang tandang tutuldok dahil kasunod nito ang mismong sinabi.
