base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: tl
  text: At sasabihin mo sa anak mong lalaki sa araw na iyon, “Dahil dito[a] ay kumilos si Yahweh para sa akin nang lumabas ako sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya: “Ginawa ito ni Yahweh para sa akin nang lumabas ako sa Ehipto.” Maaaring iugnay ang Hebreong “ito” sa dahilan ng pagdiriwang o, sa mas tuwirang pagbasa, sa ginawa ni Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: At sasabihin mo
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi, magpahayag, o magbigay-alam. Natural sa modernong Tagalog ang “sasabihin mo” at angkop ito sa tagubilin sa magulang.
- source_word: לְבִנְךָ
  choice: sa iyong anak
  rationale: Ang לְ ay nagmamarka sa di-tuwirang layon. Pinananatili ng “anak” ang tiyak na ugnayang pampamilya; hindi kailangang tukuyin ang kasarian sa Tagalog kahit panlalaking isahan ang anyong Hebreo.
- source_word: בַּיּוֹם הַהוּא
  choice: sa araw na iyon
  rationale: Karaniwan at malinaw na katumbas ito ng temporal na parirala at napapanatili ang diin ng demonstratibo.
- source_word: לֵאמֹר
  choice: —
  rationale: Ipinahihiwatig na sa Tagalog ng tuwirang sipi ang pambungad sa nilalaman ng pagsasalita. Ang tahasang “na sinasabi” ay magiging mabigat at di-natural dito.
- source_word: בַּעֲבוּר זֶה
  choice: Dahil dito
  rationale: Ipinapahayag nito ang sanhi o batayan. Ang “Dahil dito” ay malinaw at natural, habang ang talababa ay nagpapanatili sa posibleng ibang pagkakaugnay ng זֶה.
- source_word: עָשָׂה יְהוָה לִי
  choice: kumilos si Yahweh para sa akin
  rationale: Malawak ang kahulugan ng עשה—gumawa, gawin, o kumilos—at walang tahasang layon dito. Iniiwasan ng “kumilos” na magdagdag ng di-tiyak na layon at ipinahahayag ang pagkilos ni Yahweh alang-alang sa nagsasalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: nang lumabas ako sa Ehipto
  rationale: Ang infinitive construct na may בְּ ay nagsasaad ng panahong kasabay ng pangyayari. Natural ang “nang lumabas ako” at pinananatili nito ang unang panauhang pananaw.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Pagkakaugnay ng זֶה (“ito”) sa sugnay
  choice: “Dahil dito, kumilos si Yahweh para sa akin…”
  alternative: “Ginawa ito ni Yahweh para sa akin…”
  rationale: Maaaring iugnay ang “ito” sa dahilan ng pagdiriwang o gawing layon ng “ginawa.” Pinili sa teksto ang unang pagbasa dahil natural ito at sintaktikong posible, ngunit hindi nilulutas nang tahimik ang tunay na kalabuan; inilalahad sa talababa ang ikalawa.
- issue: Panlalaking isahan na בִנְךָ
  choice: sa iyong anak
  alternative: sa iyong anak na lalaki
  rationale: Bagaman panlalaking isahan ang Hebreo, hindi karaniwang minamarkahan ng salitang Tagalog na “anak” ang kasarian. Hindi ito pag-neutralisa sa kahulugan kundi natural na katumbas sa target na wika; ang “anak na lalaki” ay magiging higit na tiyak kaysa karaniwang ipinahihiwatig ng Tagalog sa ganitong konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak na ayos ng pangungusap at tuwirang sipi; iniwasan ang mabigat na “na sinasabi” dahil sapat na ang bantas upang ipakilala ang sinabi. Pinanatili ang unang panauhan upang maipahayag ang pakikiisa ng bawat salinlahi sa paglabas mula sa Ehipto.
