revisions:
- from: Kapag dinala ka ni Yahweh sa lupain ng mga Cananeo, Heteo, Amoreo, Hivita, at Jebuseo—ang lupaing isinumpa niya sa iyong mga ninuno na ibibigay sa iyo, isang lupaing umaagos sa gatas at pulot—isasagawa mo ang paglilingkod na ito[a] sa buwang ito.
  to: Kapag ipinasok ka ni Yahweh sa lupain ng mga Cananeo, Heteo, Amoreo, Hivita, at Jebuseo—ang lupaing ipinangako niyang ibibigay sa iyo sa pamamagitan ng panunumpa sa iyong mga ninuno, isang lupaing umaagos ng gatas at pulot—isasagawa mo ang paglilingkod na ito[a] sa buwang ito.
  rationale: Pinalitan ang maling “isinumpa niya” ng pananalitang malinaw na naghahayag ng panunumpa/pangako ni Yahweh sa mga ninuno. Inayos din ang idyomang “umaagos ng gatas at pulot.” Walang binagong kahulugang teolohikal o idinagdag na pagpapakahulugan.
