id: EXO.13.5
reference: Exodus 13:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: tl
  text: Kapag ipinasok ka ni Yahweh sa lupain ng mga Cananeo, Heteo, Amoreo, Hivita, at Jebuseo—ang lupaing ipinangako niyang ibibigay sa iyo sa pamamagitan ng panunumpa sa iyong mga ninuno, isang lupaing umaagos ng gatas at pulot—isasagawa mo ang paglilingkod na ito[a] sa buwang ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ritwal na ito” o “pagdiriwang na ito.” Ang salitang Hebreo ay maaaring tumukoy sa isang itinakdang gawain ng pagsamba o paglilingkod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Kapag
  rationale: Ipinahahayag ng parirala ang isang pangyayaring tiyak na inaasahan sa hinaharap; natural at malinaw ito sa makabagong Tagalog.
- source_word: יְבִיאֲךָ
  choice: dinala ka
  rationale: Ang Hiphil ng בוא ay nangangahulugang ‘dalhin’ o ‘papasukin.’ Kasunod ng ‘kapag,’ natural sa Tagalog ang aspektong perpektibo para sa pangyayaring magaganap muna bago ang iniutos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֶל אֶרֶץ
  choice: sa lupain
  rationale: Sa Tagalog, sapat na ipinahihiwatig ng pandiwang ‘dinala’ at ng pang-ukol na ‘sa’ ang pagpasok sa lupain.
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: ng mga Cananeo, Heteo, Amoreo, Hivita, at Jebuseo
  rationale: Bagaman nasa anyong isahan ang mga katawagang etniko sa Hebreo, likas sa Tagalog na gamitin ang ‘mga’ upang tukuyin ang magkakaibang pangkat na naninirahan sa lupain.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: ang lupaing isinumpa niya sa iyong mga ninuno na ibibigay sa iyo
  rationale: Pinananatili nito ang ugnayan ng lupain, panunumpa, mga ninuno, at pangakong pagkakaloob nang hindi dinaragdagan ang kahulugan.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: isang lupaing umaagos sa gatas at pulot
  rationale: Malapit ito sa larawang Hebreo ng kasaganaan at nananatiling malinaw bilang matalinghagang paglalarawan.
- source_word: וְעָבַדְתָּ
  choice: isasagawa mo
  rationale: Sa kontekstong pangkulto, ipinahihiwatig ng עבד ang pagtupad sa itinakdang paglilingkod o seremonya; malinaw itong naipapahayag ng ‘isasagawa.’
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ang paglilingkod na ito
  rationale: Pinananatili ng ‘paglilingkod’ ang diwa ng tungkulin at pagsamba, habang kinikilala sa talababa ang maaari ring saling ‘ritwal’ o ‘pagdiriwang.’
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: sa buwang ito
  rationale: Tuwiran at natural na salin ng pariralang tumutukoy sa itinakdang buwan ng pagdiriwang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng ‘Yahweh’ ang pangalang tipan sa halip na palitan ito ng titulong ‘Panginoon.’
- issue: Diwang pangkulto ng עֲבֹדָה sa konteksto ng Paskuwa at Tinapay na Walang Pampaalsa
  choice: ang paglilingkod na ito
  alternative: ang ritwal na ito; ang pagdiriwang na ito
  rationale: Maaaring tumukoy ang salita sa itinakdang gawain ng pagsamba. Ang ‘paglilingkod’ ang pinakamalapit sa malawak na saklaw nito at hindi labis na nagtatakda ng anyong liturhikal.
- issue: Bilang ng kinakausap sa mga hulaping panghalip
  choice: ka / iyong / iyo / mo
  alternative: kayo / inyong / inyo / ninyo
  rationale: Isahan ang mga panghalip at pandiwa sa tekstong Hebreo, bagaman kolektibong kinakatawan ng kausap ang Israel. Pinananatili ng salin ang tunay na anyong isahan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang isahang kausap ng Hebreo at ang tradisyonal na larawang ‘umaagos sa gatas at pulot.’ Inilagay ang talababa sa ‘paglilingkod na ito,’ ang salitang talagang tinutukoy ng leksikal na paliwanag.
