  source_fidelity: Ang pangmaramihang “ninyo” ay hindi tumutugma sa Hebreong pautos na pang-isahan (קַדֵּשׁ), na nakatuon kay Moises. Ang “Siya ay akin” ay hindi angkop na panghalip para sa saklaw na tao at hayop at hindi gaanong malinaw na tumutukoy sa bawat panganay. Ang binagong teksto ay pinananatili ang saklaw ng “bawat panganay,” ang paliwanag na “unang lumabas sa bawat sinapupunan,” at ang paghahambing ng tao at hayop nang hindi nagdadagdag ng kasariang panlalaki.
  naturalness: Mas natural at malinaw ang “Italaga mo” para sa iisang pinag-uutosan at “akin ito” bilang pangwakas na pahayag ng pag-aari. Ang “sa tao at sa hayop” ay nagpapanatili ng magkatambal na saklaw ng Hebreo nang hindi ipinahihiwatig na isa lamang sa dalawa ang tinutukoy.
  terminology: Ang “italaga,” “panganay,” at “sinapupunan” ay angkop sa marangal ngunit makabagong Tagalog at sapat na naghahatid ng kultikong paglalaan. Ang “tao” para sa אָדָם ay wastong kolektibong katawagan sa kaibahan ng hayop.
