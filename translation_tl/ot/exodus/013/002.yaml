  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: tl
  text: “Italaga mo sa akin ang bawat panganay—ang unang lumabas sa bawat sinapupunan sa mga anak ni Israel, sa tao at sa hayop; akin ito.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Italaga
  rationale: Ang pautos na anyo ng קדשׁ ay humihiling na ibukod at iukol sa Diyos bilang banal. Natural sa makabagong Tagalog ang “italaga” at pinananatili nito ang diwang panrelihiyon.
- source_word: לִי
  choice: sa akin
  rationale: Ipinahihiwatig ng ל ang paglalaan para sa Diyos; likas na kaakibat ng “italaga” ang “sa akin.”
- source_word: כָל בְּכוֹר
  choice: ang bawat panganay
  rationale: Ang בְּכוֹר ay “panganay.” Hindi tahasang sinasabi rito ng Hebreo na lalaki, kaya hindi iyon idinagdag.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: ang unang lumabas sa bawat sinapupunan
  rationale: Tinutukoy ng parirala ang unang nagbukas o lumabas sa sinapupunan. Mas natural sa Tagalog ang “unang lumabas” kaysa literal na “nagbukas ng sinapupunan,” habang nananatili ang kahulugan.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili nito ang anyong “mga anak ni Israel” at ang kolektibong pagtukoy sa bayan.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: maging tao o hayop
  rationale: Ang אָדָם ay kolektibong tumutukoy sa tao bilang kaibahan sa hayop. Ang “maging tao o hayop” ay malinaw at likas sa Tagalog nang hindi nililimitahan ang tao sa kalalakihan.
- source_word: לִי הוּא
  choice: Siya ay akin
  rationale: Tahasang ipinahahayag ng pangwakas na sugnay ang pag-aari ng Diyos. Ang “siya” ay tumutukoy sa bawat panganay at umaangkop sa tao o hayop.
theological_decisions:
- issue: Kolektibo at kinatawang gamit ng אָדָם na inihahambing sa בְּהֵמָה
  choice: tao
  alternative: sangkatauhan
  rationale: Sa konteksto, ang אָדָם ay kategoryang pantao na kaiba sa hayop, hindi partikular na lalaking tao. Ang “tao” ang pinakamaikli at natural na katumbas.
- issue: Kasarian ng panganay
  choice: Hindi idinagdag ang “lalaki”
  alternative: bawat panganay na lalaki
  rationale: Bagaman ang mas malawak na batas ay may kaugnayan sa mga lalaking panganay, walang tahasang panandang panlalaki sa כָל בְּכוֹר ng talatang ito; hindi dapat idagdag sa pangunahing teksto.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “sinapupunan” para sa רֶחֶם at “italaga” para sa kultikong paglalaan. Walang talababa sapagkat malinaw na naipapahayag ng “tao” ang kolektibong saklaw ng אָדָם.
