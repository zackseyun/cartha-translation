source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: tl
  text: At sinabi ni Moises sa bayan, “Alalahanin ninyo ang araw na ito kung kailan kayo lumabas mula sa Ehipto, mula sa bahay ng pagkaalipin, sapagkat inilabas kayo ni Yahweh mula roon sa pamamagitan ng malakas na kamay[a]. Walang anumang pinaalsa ang dapat kainin[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng makapangyarihang kamay.”
    reason: lexical_alternative
  - marker: b
    text: O “tinapay na may pampaalsa.” Ang Hebreo ay maaari ring tumukoy nang mas malawak sa anumang pinaalsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Alalahanin ninyo
  rationale: Pautos na isahan sa Hebreo na tumutukoy sa bayan bilang isang kabuuan; natural sa Filipino ang maramihang “ninyo” kapag kinakausap ang buong bayan, at napananatili nito ang diwang pang-alaala.
- source_word: הַיּוֹם הַזֶּה
  choice: ang araw na ito
  rationale: Tuwirang katumbas ng tiyak na pangngalan at demonstratibo, nang hindi nagdaragdag ng diin.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: nang lumabas kayo mula sa Ehipto
  rationale: Ang יצא ay “lumabas”; ang “nang” ay natural na nag-uugnay sa araw at sa pangyayaring ginugunita nang hindi nilulutas nang higit sa kailangan ang kaugnayang pangungusap.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng pagkaalipin
  rationale: Pinananatili ang konkretong talinghagang “bahay,” habang malinaw na ipinahahayag ang idyomatikong kahulugan na Ehipto bilang lugar ng pagkaalipin.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ang sanhi o dahilan ng pag-alala, sa marangal ngunit karaniwang rehistro.
- source_word: בְּחֹזֶק יָד
  choice: sa pamamagitan ng malakas na kamay
  rationale: Malapit sa Hebreong idyoma at malinaw na tumutukoy sa makapangyarihang pagkilos; hindi pinapalitan ang “malakas” ng mas interpretatibong “makapangyarihan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: inilabas kayo roon
  rationale: Tumpak na ipinahahayag ang causative na anyo ng יצא at ang pagtukoy pabalik sa Ehipto.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: At huwag kayong kakain ng anumang may pampaalsa
  rationale: Natural na pagbabawal sa modernong Filipino; ang חָמֵץ ay maaaring tumukoy nang mas malawak sa anumang pinaalsa, hindi lamang sa tinapay.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ng titulo.
- issue: Kahulugan ng עֲבָדִים sa pariralang מִבֵּית עֲבָדִים
  choice: pagkaalipin
  alternative: mga alipin / paglilingkod
  rationale: Sa konteksto ng Ehipto, tunay na pagkaalipin ang tinutukoy. Ginawang idyomatiko sa Filipino ang buong parirala nang hindi pinahihina ang kalagayan ng mga inalipin.
- issue: Saklaw ng חָמֵץ
  choice: anumang may pampaalsa
  alternative: tinapay na may pampaalsa
  rationale: Maaaring mas malawak kaysa tinapay ang terminong Hebreo. Pinananatili sa pangunahing teksto ang mas malawak na pagbabawal, habang itinatala sa talababa ang mas makitid na posibleng salin.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong Israel, “pagkaalipin” para sa idyomatikong bahay ng mga alipin, at aktibong pautos sa huling sugnay upang maging natural sa Filipino habang pinananatili ang lakas ng pagbabawal.
