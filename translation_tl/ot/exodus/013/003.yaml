  naturalness: Natural at marangal ang Filipino ng draft. Ang “sa araw na ito kung kailan” ay mas malinaw at mas natural na pang-ugnay kaysa “ang araw na ito, nang.” Ang impersonal na “Walang anumang pinaalsa ang dapat kainin” ay natural din at mas malapit sa anyo at saklaw ng Hebreo.
  terminology: 'Ang “Yahweh,” “bayan,” at “bahay ng pagkaalipin” ay angkop. Mas tumpak ang “pinaalsa” kaysa “may pampaalsa”: ang pampaalsa ay karaniwang sangkap o ahenteng pampaasim, samantalang ang חָמֵץ dito ay tumutukoy sa pagkaing/lebadurang may pampaalsa o pinaalsa.'
