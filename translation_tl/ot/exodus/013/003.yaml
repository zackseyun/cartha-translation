revisions:
- from: Sinabi ni Moises sa bayan, “Alalahanin ninyo ang araw na ito, nang lumabas kayo mula sa Ehipto, mula sa bahay ng pagkaalipin, sapagkat inilabas kayo roon ni Yahweh sa pamamagitan ng malakas na kamay[a]. At huwag kayong kakain ng anumang may pampaalsa[b].”
  to: At sinabi ni Moises sa bayan, “Alalahanin ninyo ang araw na ito kung kailan kayo lumabas mula sa Ehipto, mula sa bahay ng pagkaalipin, sapagkat inilabas kayo ni Yahweh mula roon sa pamamagitan ng malakas na kamay[a]. Walang anumang pinaalsa ang dapat kainin[b].”
  rationale: Inayos ang pang-ugnay sa unang utos para sa mas natural na Filipino. Pinalitan ang huling aktibong pagbabawal ng impersonal na anyo upang maipakita ang pasibong pangkalahatang pagbabawal sa Hebreo, at ginawang “anumang pinaalsa” upang tumpak na maipahayag ang saklaw ng חָמֵץ. Idinagdag ang “At” upang maipakita ang pang-ugnay na וַיֹּאמֶר nang hindi sinisira ang daloy ng Filipino.
