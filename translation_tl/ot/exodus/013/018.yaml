base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: tl
  text: Kaya pinadaan ng Diyos ang bayan sa palibot, sa daan sa ilang patungo sa Dagat ng mga Tambo.[a] At umalis mula sa lupain ng Ehipto ang mga anak ni Israel na armado.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “Dagat na Pula.” Literal sa Hebreo: “Dagat ng mga Tambo.”'
    reason: alternative_reading
  - marker: b
    text: Hindi tiyak ang salitang Hebreo; maaari rin itong mangahulugang “handa sa labanan,” “nasa ayos-pandigma,” o, sa mas pangkalahatan, “nasa maayos na mga hanay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: pinaikot
  rationale: Ang Hiphil ng סבב ay nagsasaad na pinadaan ng Diyos ang bayan sa palibot o di-tuwirang ruta; pinananatili ng “pinaikot” ang tahasang pagkilos ng Diyos.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: sa daang patungo sa ilang
  rationale: Ipinapahayag ng דֶּרֶךְ ang ruta o daan, habang ang הַמִּדְבָּר ay likas na isinasaling “ilang” sa marangal na modernong Tagalog.
- source_word: יַם סוּף
  choice: Dagat ng mga Tambo
  rationale: Literal na tumutukoy ang סוּף sa mga tambo; inuuna nito ang ebidensiya ng tekstong Hebreo kaysa sa nakaugaliang pangalang “Dagat na Pula.”
- source_word: וַחֲמֻשִׁים
  choice: na armado
  rationale: Maikli at pormal na salin ito ng mahirap na termino, ngunit hindi itinatago sa talababa ang posibleng diwa ng kahandaan sa labanan o maayos na hanay.
- source_word: עָלוּ
  choice: umalis
  rationale: Bagaman literal na “umakyat,” sa konteksto ng paglabas mula sa Ehipto ay mas natural sa Tagalog ang “umalis,” nang hindi binabago ang kilos ng pag-alis.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Malapit ito sa anyong Hebreo at likas na katawagan sa Tagalog para sa sambayanang nagmula kay Israel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: mula sa lupain ng Ehipto
  rationale: Tuwirang pinananatili ang preposisyon at ang pangngalang “lupain” ng Hebreo.
theological_decisions:
- issue: Pagpapangalan sa יַם סוּף
  choice: Dagat ng mga Tambo
  alternative: Dagat na Pula
  rationale: Pinangungunahan ng salin ang literal na kahulugan ng Hebreo, habang inilalagay sa talababa ang tradisyonal at pamilyar na pangalan.
- issue: Saklaw ng בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili ang pormal na anyo ng pariralang Hebreo nang hindi nililimitahan ang kolektibong pagtukoy nito sa bayang Israel.
- issue: Di-tiyak na kahulugan ng וַחֲמֻשִׁים
  choice: na armado
  alternative: handa sa labanan; nasa maayos na hanay
  rationale: Ginamit sa pangunahing teksto ang maikli at malamang na diwang militar, ngunit hayagang pinanatili sa talababa ang tunay na leksikal na kawalang-katiyakan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “ilang” bilang maikli at biblikal ngunit buhay pang katawagan sa ilang na lupain. Inayos ang mga talababa upang lumitaw ang marker sa mismong pariralang tinutukoy nito.
