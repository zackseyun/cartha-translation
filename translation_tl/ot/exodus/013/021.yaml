id: EXO.13.21
reference: Exodus 13:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: tl
  text: Sa araw, patuloy na nangunguna sa kanila si Yahweh[a] sa isang haliging ulap upang gabayan sila sa daan; at sa gabi naman, sa isang haliging apoy upang bigyan sila ng liwanag, nang sa gayon ay makapaglakbay sila araw at gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; isinasalin din sa ilang salin bilang “PANGINOON” o “Jehovah.”'
    reason: Ipinapakita ang anyo ng banal na pangalan sa Hebreo at ang mga pangunahing alternatibong salin nito.
lexical_decisions:
- source_word: וַיהוָה
  choice: si Yahweh
  rationale: Direktang tinutumbasan ang pangalan ng Diyos na YHWH bilang “Yahweh,” at ginagamit ang pantukoy na “si” ayon sa likas na balarila ng Tagalog para sa personal na pangalan.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: patuloy na nangunguna sa kanila
  rationale: Ipinapahayag ng participle ang nagpapatuloy na pagkilos, habang ang לִפְנֵיהֶם ay may literal na diwang nasa unahan at, sa konteksto, pamumuno o paggabay.
- source_word: יוֹמָם
  choice: sa araw
  rationale: Likas na panandang pamanahon sa modernong Tagalog at malinaw na kaparis ng “sa gabi.”
- source_word: בְּעַמּוּד עָנָן
  choice: sa isang haliging ulap
  rationale: Pinananatili ang kongkretong larawan at ang maluwag na gamit ng בְּ nang hindi tiyak na nilulutas kung ito ay lokasyon, paraan, o pagpapakita.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: upang gabayan sila sa daan
  rationale: Ang נחה ay tumutukoy sa paggabay o pangunguna; ang “sa daan” ay maikli, natural, at tapat sa tiyak na pangngalan.
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: at sa gabi naman, sa isang haliging apoy
  rationale: Pinananatili ang balanseng paghahambing ng araw at gabi at ang parallel na larawan ng dalawang haligi.
- source_word: לְהָאִיר לָהֶם
  choice: upang bigyan sila ng liwanag
  rationale: 'Malinaw na ipinahahayag ang causative na diwa ng pandiwa: magbigay-liwanag para sa kanila.'
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: nang sa gayon ay makapaglakbay sila araw at gabi
  rationale: Ipinahahayag ang layunin o bunga ng liwanag at ginagamit ang “makapaglakbay” dahil ang konteksto ay paglalakbay ng bayan, hindi lamang paglalakad.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan ng Diyos ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang katangian nito bilang personal na pangalang tipan nang hindi ito ginagawang titulo.
- issue: Ugnayan ni Yahweh sa mga haligi
  choice: sa isang haliging ulap / sa isang haliging apoy
  alternative: sa pamamagitan ng isang haliging ulap / sa pamamagitan ng isang haliging apoy
  rationale: Ang Hebreong בְּ ay maaaring magpahiwatig ng kinaroroonan, paraan, o pagpapakita. Ang payak na “sa” ay hindi labis na nagtatakda ng eksaktong teolohikal na ugnayan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang maayos na parallelismo ng “sa araw” at “sa gabi,” habang iniwasan ang sobrang teknikal o makalumang pananalita.
