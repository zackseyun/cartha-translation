base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: tl
  text: Itatalaga mo kay Yahweh ang bawat unang lumalabas sa sinapupunan[a], at bawat unang supling ng iyong alagang hayop na lalaki ay para kay Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bawat tagapagbukas ng sinapupunan”; tumutukoy ito sa unang iniluwal.
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “At bawat panganay na lalaking supling ng mga alagang hayop na magiging iyo ay para kay Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: Ibubukod mo para kay Yahweh
  rationale: Ang Hiphil ng עבר ay literal na ‘pararaanin’ o ‘ililipat,’ ngunit sa kontekstong ito ay tumutukoy sa pagbubukod o pagtatalaga kay Yahweh. Malinaw at likas sa modernong Tagalog ang ‘ibubukod’ habang pinananatili ang sakral na diwa.
- source_word: פֶּטֶר רֶחֶם
  choice: ang bawat unang nagbubukas ng sinapupunan
  rationale: Pinananatili nito ang konkretong Hebreong idyomang ‘tagapagbukas ng sinapupunan’ at ang pagtukoy sa unang isinilang, sa halip na agad itong gawing pangkalahatang ‘panganay.’
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: sa bawat unang supling ng iyong mga alagang hayop
  rationale: Ang שֶׁגֶר ay supling o iniluwal, lalo na ng hayop. Ang ‘unang supling’ ay natural sa Tagalog at pinananatili ang pokus sa unang iniluwal ng alagang hayop.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: iyong mga alagang hayop
  rationale: Isinasama ng ‘iyong’ ang diwa ng pag-aari sa sugnay na ‘magiging iyo’ nang hindi nagiging mabigat ang pangungusap.
- source_word: הַזְּכָרִים
  choice: ang mga lalaki
  rationale: Ang anyong maramihan na may pantukoy ay tumutukoy bilang isang uri sa mga lalaking supling. Hinihiwalay ito sa sugnay upang mapanatili ang diin at estruktura ng Hebreo.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag nito ang pagtatalaga o pag-aari kay Yahweh. Ginamit ang pangalang ‘Yahweh’ para sa tetragrammaton.
theological_decisions:
- issue: Paglalarawan sa kilos ng וְהַעֲבַרְתָּ
  choice: Ibubukod mo para kay Yahweh
  alternative: Ihahandog mo kay Yahweh
  rationale: Hindi tahasang nililimitahan ng pandiwa ang kilos sa ritwal na paghahandog; mas ligtas ang ‘ibubukod’ upang mapanatili ang legal at sakral na saklaw nito.
- issue: Paglilipat ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang tipanang pangalan. Pinananatili ito bilang ‘Yahweh’ nang hindi pinapalitan ng isang titulo.
- issue: Ugnayan ng unang supling at kasariang lalaki
  choice: ang mga lalaki ay para kay Yahweh
  alternative: bawat panganay na lalaking supling ... ay para kay Yahweh
  rationale: Pinananatili ng napiling ayos ang bahagyang hiwalay na Hebreong paglilinaw na הַזְּכָרִים at hindi ipinapalagay na nakapaloob na sa pariralang ‘unang supling’ ang kasariang lalaki.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Ginamit ang isahang ‘mo/iyong’ upang tularan ang ikalawang panauhang panlalaking isahan sa Hebreo. Iniwasan ang labis na teknikal na bokabularyo at pinanatili ang konkretong larawang ‘nagbubukas ng sinapupunan.’
