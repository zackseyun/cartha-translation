  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: tl
  text: Ang bawat panganay na asno ay tutubusin mo sa pamamagitan ng isang tupa o kambing; ngunit kung hindi mo iyon tutubusin, babaliin mo ang leeg nito. At tutubusin mo ang bawat panganay mong anak na lalaki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: panganay na asno
  rationale: Bagaman literal na tumutukoy ang פֶּטֶר sa unang nagbubukas ng sinapupunan, natural at tumpak sa kontekstong legal ang “panganay na asno.”
- source_word: תִּפְדֶּה
  choice: tutubusin mo
  rationale: Ipinahahayag ng פדה ang pagtubos sa pamamagitan ng kapalit o bayad; pinananatili ng “tutubusin” ang legal at panrelihiyong diwa.
- source_word: בְשֶׂה
  choice: sa pamamagitan ng isang tupa o kambing
  rationale: Ang שֶׂה ay maaaring tumukoy sa isang hayop mula sa kawan, tupa man o kambing. Tahasang pinananatili ng salin ang lawak ng salitang Hebreo sa halip na limitahan ito sa kordero.
- source_word: וַעֲרַפְתּוֹ
  choice: babaliin mo ang leeg nito
  rationale: Ang ערף ay tumutukoy sa pagbali ng leeg, hindi sa karaniwang paraan ng pagkatay.
- source_word: בְּכוֹר אָדָם בְּבָנֶיךָ
  choice: bawat panganay na lalaki sa iyong mga anak
  rationale: Ang אָדָם ay kaibahan ng tao sa hayop, samantalang ang בְּבָנֶיךָ ay tahasang tumutukoy sa mga anak na lalaki. Ang parirala ay ginawang natural sa Tagalog nang hindi ginagawang lahat ng panganay na anak anuman ang kasarian.
theological_decisions:
- issue: Saklaw ng אָדָם at בְּבָנֶיךָ
  choice: “bawat panganay na lalaki sa iyong mga anak”
  alternative: “bawat panganay na tao sa iyong mga anak na lalaki”
  rationale: Pinananatili ng piniling salin ang pagkakaiba ng tao at hayop at ang tahasang pagtukoy sa mga anak na lalaki, ngunit iniiwasan ang alanganing literalismo sa Tagalog.
- issue: Uri ng hayop na panubos sa בְשֶׂה
  choice: “isang tupa o kambing”
  alternative: “isang kordero”
  rationale: Mas malawak ang שֶׂה kaysa “kordero” at maaaring tumukoy sa tupa o kambing; hindi nararapat paliitin nang walang pahiwatig sa talata ang saklaw nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang anyong “tutubusin mo” bilang natural na legal na tagubilin at pinanatili ang tuwirang bigat ng parusang “babaliin mo ang leeg nito.”
