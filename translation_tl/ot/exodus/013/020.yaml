base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/020.yaml
  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: tl
  text: Umalis sila sa Sucot at nagkampo sa Etam, sa gilid ng ilang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Umalis sila
  rationale: Ang wayyiqtol na anyong maramihan ng נסע ay nagsasaad ng sumunod na kilos sa salaysay—ang pag-alis ng kampo upang magpatuloy sa paglalakbay. Likas at malinaw sa modernong Filipino ang “umalis sila.”
- source_word: מִסֻּכֹּת
  choice: sa Sucot
  rationale: Ang מִן ay pinagmulan, na likas na ipinahahayag ng “sa” kasunod ng pandiwang “umalis”; ang pangalang-lugar ay tinumbasan bilang Sucot.
- source_word: וַיַּחֲנוּ
  choice: at nagkampo
  rationale: Ang חנה ay nangangahulugang humimpil o magkampo. Ang “nagkampo” ay tuwiran, pangkasalukuyang gamit, at angkop sa salaysay ng paglalakbay.
- source_word: בְאֵתָם
  choice: sa Etam
  rationale: Ang בְ ay lokatibo rito. Ang “sa Etam” ang natural na anyo sa Filipino para sa lugar na pinagkampuhan.
- source_word: בִּקְצֵה
  choice: sa gilid ng
  rationale: Ang קָצֶה ay maaaring tumukoy sa dulo, hangganan, o gilid. Sa kontekstong heograpikal, natural at hindi labis na tiyak ang “sa gilid ng.”
- source_word: הַמִּדְבָּר
  choice: ilang
  rationale: Ang מִדְבָּר ay ilang o lupaing hindi matao at hindi kinakailangang mabuhanging disyerto. Ang “ilang” ay maikli, dignified, at tradisyonal ngunit nauunawaan pa rin sa modernong Filipino.
