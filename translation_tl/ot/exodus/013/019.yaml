  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑/וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִיתֶ֧ם אֶת עַצְמֹתַ֛/י מִ/זֶּ֖ה אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: tl
  text: At isinama ni Moises ang mga buto ni Jose, sapagkat mahigpit na pinasumpa ni Jose ang mga anak ni Israel. Sinabi niya, “Tiyak na kikilos ang Diyos para sa inyo[a], at iaahon ninyo mula rito ang aking mga buto kasama ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Tiyak na dadalawin kayo ng Diyos.” Ang idyomang Hebreo ay maaaring tumukoy sa mapagpasiyang pagkilos ng Diyos para sa kanyang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: isinama
  rationale: Ang לקח ay karaniwang nangangahulugang ‘kumuha,’ ngunit sa konteksto ng paglalakbay, likas na ipinahahayag ng ‘isinama’ na dinala ni Moises ang mga buto ni Jose habang umaalis.
- source_word: עַצְמוֹת יוֹסֵף
  choice: mga buto ni Jose
  rationale: Pinananatili ang kongkreto at literal na ‘mga buto’ sa halip na ang mas malawak na ‘mga labi.’
- source_word: עִמּוֹ
  choice: kasama niya
  rationale: Direkta at likas na katumbas ng pahayag ng pagsama.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: mahigpit na pinanumpa
  rationale: Ipinahahayag ng ‘pinanumpa’ ang causative na anyo, at ng ‘mahigpit’ ang diin ng infinitive absolute na kasama ng finite verb.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang idyoma ng Hebreo sa isang natural na anyong Tagalog; sa konteksto, tumutukoy ito sa mga inapo o sambayanan ni Israel.
- source_word: לֵאמֹר
  choice: Sinabi niya
  rationale: Natural na panimula sa tuwirang sipi sa Tagalog at malinaw na si Jose ang nagsasalita.
- source_word: פָּקֹד יִפְקֹד
  choice: Tiyak na kikilos ... para sa inyo
  rationale: Ang pag-uulit na Hebreo ay nagbibigay-diin sa katiyakan. Sa konteksto, ang פקד ay tumutukoy sa mapagpasiyang pagkilos ng Diyos para sa kanyang bayan, nang hindi tinutukoy nang labis ang paraan ng pagkilos.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Karaniwang katawagan sa Diyos ng Israel sa kontekstong ito.
- source_word: וְהַעֲלִיתֶם
  choice: at iaahon ninyo
  rationale: Pinananatili ng ‘iaahon’ ang causative at pataas na direksiyon ng עלה, pati ang obligasyong nakapaloob sa sinumpaang pahayag.
- source_word: עַצְמֹתַי
  choice: ang aking mga buto
  rationale: Literal at personal na katumbas ng pariralang Hebreo.
- source_word: מִזֶּה
  choice: mula rito
  rationale: Natural na deiktikong pahayag na tumutukoy sa lugar na kinaroroonan, ang Ehipto.
- source_word: אִתְּכֶם
  choice: kasama ninyo
  rationale: Pinananatili ang ideya ng pagsama at ang pag-uulit nito sa Hebreong talata.
theological_decisions:
- issue: Kahulugan ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili nito ang pampamilyang larawan ng orihinal habang nananatiling natural sa Tagalog. Ang parirala ay kolektibong tumutukoy sa mga inapo ni Israel at hindi dapat paliitin sa isang di-kinakailangang espesipikong pangkat.
- issue: Kahulugan ng פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Tiyak na kikilos ang Diyos para sa inyo
  alternative: Tiyak na dadalawin kayo ng Diyos
  rationale: Ipinahahayag ng pangunahing salin ang tiyak at mapagpasiyang pakikialam ng Diyos para sa kanyang bayan. Inilalagay sa talababa ang mas literal na ‘dadalawin’ upang mapanatili ang saklaw at tensiyon ng idyomang Hebreo nang hindi gawing malabo ang pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘isinama,’ ‘pinanumpa,’ at ‘iaahon’ upang maging natural sa karaniwang mambabasa habang pinananatili ang kongkretong larawan, diin, at direksiyon ng Hebreo.
