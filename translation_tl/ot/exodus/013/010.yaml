  text: Kaya sundin mo ang tuntuning ito sa takdang panahon nito, taun-taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa mga araw hanggang sa mga araw,” isang idyomang karaniwang nauunawaan dito bilang “taun-taon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: sundin mo
  rationale: Sa kontekstong legal at pangritwal, ang שׁמר ay tumutukoy sa maingat at patuloy na pagtupad; natural itong ipinahahayag sa modernong Tagalog bilang “sundin.”
- source_word: הַחֻקָּה הַזֹּאת
  choice: ang tuntuning ito
  rationale: Ang חֻקָּה ay isang itinakdang kautusan o regulasyon. Ang “tuntunin” ay dignified ngunit madaling maunawaan at hindi labis na teknikal o eklesiastiko.
- source_word: לְמוֹעֲדָהּ
  choice: sa takdang panahon nito
  rationale: Ang מוֹעֵד ay itinakdang panahon o okasyon, at pinananatili ng “nito” ang hulaping panghalip na tumutukoy sa pagdiriwang o tuntunin.
- source_word: מִיָּמִים יָמִימָה
  choice: taun-taon
  rationale: Literal itong “mula sa mga araw tungo sa mga araw,” ngunit sa konteksto ng taunang pagdiriwang ay isang idyomang nangangahulugang “taun-taon.” Inilalahad sa talababa ang literal na anyo upang mapanatili ang ugnayan sa Hebreo.
