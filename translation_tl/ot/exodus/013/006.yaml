  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: tl
  text: Sa loob ng pitong araw ay kakain ka ng tinapay na walang pampaalsa, at sa ikapitong araw ay magkakaroon ng kapistahan para kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; karaniwang isinasalin na “ANG PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sa loob ng pitong araw
  rationale: Ipinahahayag ng pariralang konstrukto ang tagal; likas at malinaw sa modernong Tagalog ang “sa loob ng pitong araw.”
- source_word: תֹּאכַל
  choice: kakain ka
  rationale: Ang Qal imperfect na 2ms ay may puwersang nag-uutos sa kontekstong ito. Naipahihiwatig ng payak na anyong panghinaharap sa Tagalog ang tagubilin nang hindi ito labis na pinatitindi.
- source_word: מַצֹּת
  choice: tinapay na walang pampaalsa
  rationale: Tumutukoy ito sa tinapay na hindi pinaalsa sa konteksto ng Paskuwa at Kapistahan ng Tinapay na Walang Pampaalsa. Mas madaling maunawaan ng karaniwang mambabasa ang “walang pampaalsa” kaysa transliterasyon.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: at sa ikapitong araw
  rationale: Payak na pang-ugnay ang waw at ang kasunod na parirala ay tumutukoy sa panahon; pinananatili ng “at” ang ugnayang hindi pinatitindi bilang pagsalungat.
- source_word: חַג
  choice: kapistahan
  rationale: Ang חַג ay isang sagradong kapistahan o pagdiriwang. Dignified, malinaw, at angkop sa kontekstong panrelihiyon ang “kapistahan.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahihiwatig ng ל ang pag-uukol o kaugnayan. Likas sa Tagalog ang “para kay” upang ipakitang ang kapistahan ay iniuukol kay Yahweh.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili sa pangunahing teksto ang personal na pangalang tipan bilang “Yahweh,” nang hindi ito pinapalitan ng isang titulo.
- issue: Pagpapakahulugan sa nominal na pariralang חַג לַיהוָה
  choice: magkakaroon ng kapistahan para kay Yahweh
  alternative: ang ikapitong araw ay kapistahan para kay Yahweh; kapistahan kay Yahweh
  rationale: Walang hayag na pandiwa sa Hebreo. Ang “magkakaroon ng” ay natural na Tagalog na nagpapahayag ng pag-iral ng kapistahan, ngunit hindi tinutukoy kung sino ang nagsasagawa nito o nagdaragdag ng denominasyonal na kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “pampaalsa” sa halip na mas teknikal o hiram na katawagan, at “kapistahan” upang mapanatili ang sagrado at masayang diwa ng חַג.
