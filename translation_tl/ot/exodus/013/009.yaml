language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: tl
  text: Magiging tanda ito sa iyong kamay at paalaala sa pagitan ng iyong mga mata,[a] upang ang kautusan ni Yahweh ay mapasa iyong bibig;[b] sapagkat sa pamamagitan ng malakas na kamay ay inilabas ka ni Yahweh mula sa Ehipto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa pagitan ng iyong mga mata” ay maaari ring unawain bilang “sa iyong noo”; pinanatili rito ang literal na pananalita ng Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “ang turo ni Yahweh.” Ang Hebreong torah ay maaaring mangahulugang “kautusan” o “turo.”
    reason: lexical_alternative
  - marker: c
    text: O “sa pamamagitan ng makapangyarihang kamay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: At ito ay magiging
  rationale: 'Ang anyong pandiwa ay may prospektibong diwa sa kontekstong ito: ang pagdiriwang na tinutukoy sa naunang talata ang magsisilbing tanda at paalaala.'
- source_word: לְאוֹת
  choice: tanda
  rationale: Malawak at likas na katumbas ito ng אוֹת, na maaaring tumukoy sa tanda, sagisag, o palatandaan nang hindi ipinipilit kung literal o matalinghaga.
- source_word: עַל יָדְךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang kongkretong larawan ng Hebreo at hindi ito inuunahang ipakahulugan bilang isang tiyak na gawaing panrelihiyon.
- source_word: וּלְזִכָּרוֹן
  choice: at paalaala
  rationale: Ang 'paalaala' ay natural sa modernong Tagalog at malinaw na naghahatid ng diwa ng pag-alaala o paggunita.
- source_word: בֵּין עֵינֶיךָ
  choice: sa pagitan ng iyong mga mata
  rationale: Literal na pinananatili ang Hebreong pananalita upang hindi agad lutasin kung ito ay pisikal, idyomatiko, o sagisag.
- source_word: לְמַעַן
  choice: upang
  rationale: Natural at maikli itong naghahayag ng layunin.
- source_word: תּוֹרַת יְהוָה
  choice: ang kautusan ni Yahweh
  rationale: Ang תּוֹרָה ay maaaring mangahulugang kautusan o turo. Ang 'kautusan' ay angkop sa kontekstong tipan, habang inilalagay sa talababa ang lehitimong alternatibo.
- source_word: בְּפִיךָ
  choice: mapasaiyong bibig
  rationale: Pinananatili nito ang larawan ng tekstong Hebreo at ipinahihiwatig ang pagsambit o patuloy na pagpapahayag ng kautusan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita nito na ang sumunod na sugnay ang batayan ng layuning magpaalaala.
- source_word: בְּיָד חֲזָקָה
  choice: sa pamamagitan ng malakas na kamay
  rationale: Malapit ito sa literal na Hebreo at malinaw na tumutukoy sa makapangyarihang pagkilos ni Yahweh.
- source_word: הוֹצִאֲךָ
  choice: inilabas ka
  rationale: Tumpak at natural na katumbas ng Hiphil ng יצא, 'ilabas' o 'dalhin palabas.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kung ang larawan ng kamay at mga mata ay dapat ipakahulugan bilang tiyak na pisikal na gawaing panrelihiyon
  choice: Panatilihin sa pangunahing teksto ang literal na 'sa iyong kamay' at 'sa pagitan ng iyong mga mata.'
  alternative: Isalin ang ikalawang parirala bilang 'sa iyong noo' o tahasang iugnay ang dalawa sa tefillin/phylacteries.
  rationale: Hindi pinapangalanan ng talata ang mga bagay na ginamit sa kalaunang kaugalian. Ang literal na pananalita ay nagpapanatili ng bukas na posibilidad na ito ay pisikal, idyomatiko, o sagisag.
- issue: Saklaw ng kahulugan ng תּוֹרָה
  choice: Gamitin ang 'kautusan' sa pangunahing teksto.
  alternative: Gamitin ang 'turo' o 'tagubilin.'
  rationale: Parehong posible sa leksikon. Ang 'kautusan' ay may angkop na bigat sa konteksto ng tipan, ngunit pinananatili sa talababa ang mas malawak na diwa ng 'turo.'
- issue: Kahulugan ng 'mapasaiyong bibig'
  choice: Panatilihin ang literal na larawan nang hindi nililimitahan sa pagbigkas, pagtuturo, o pagpapahayag lamang.
  alternative: Ipaliwanag sa pangunahing teksto bilang 'lagi mong banggitin' o 'lagi mong ipahayag.'
  rationale: Ang idyoma ay maaaring magpahiwatig ng pagsambit at pagiging handang ipahayag, ngunit hindi tinutukoy ng Hebreo ang iisang tiyak na gawain.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Pinanatili ang kongkretong imahen ng Hebreo at ang pangalang Yahweh. Ang 'mapasaiyong' ay bahagyang mataas ang register ngunit likas sa estilo ng Kasulatan at mas maayos kaysa sa mas mekanikal na 'nasa iyong bibig.' Lahat ng marker ng talababa ay nakalagay sa pangunahing teksto.
