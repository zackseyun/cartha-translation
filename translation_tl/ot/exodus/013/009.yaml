revisions:
- from: At ito ay magiging tanda sa iyong kamay at paalaala sa pagitan ng iyong mga mata,[a] upang ang kautusan ni Yahweh ay mapasaiyong bibig;[b] sapagkat inilabas ka ni Yahweh mula sa Ehipto sa pamamagitan ng malakas na kamay.[c]
  to: Magiging tanda ito sa iyong kamay at paalaala sa pagitan ng iyong mga mata,[a] upang ang kautusan ni Yahweh ay mapasa iyong bibig;[b] sapagkat sa pamamagitan ng malakas na kamay ay inilabas ka ni Yahweh mula sa Ehipto.[c]
  rationale: Mga estilistikong rebisyon lamang ang ginawa upang maging higit na likas ang Tagalog at luminaw ang kaugnayan ng “malakas na kamay” sa pagliligtas. Walang binago sa saklaw ng kahulugan, sa literal na imahen ng Hebreo, o sa bukas na katangian ng mga posibleng pagbasa.
