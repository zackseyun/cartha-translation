id: EXO.13.11
reference: Exodus 13:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: tl
  text: At kapag[a] dinala ka ni Yahweh sa lupain ng mga Cananeo, gaya ng ipinangako niya nang may panunumpa sa iyo at sa iyong mga ninuno[b], at ibinigay niya ito sa iyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “At mangyayari na kapag.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal na Hebreo: “mga ama,” na sa kontekstong ito ay tumutukoy sa mga ninuno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: At kapag
  rationale: Ang konstruksiyong Hebreo ay nagpapakilala ng isang pangyayari sa hinaharap. Likas sa makabagong Tagalog ang “At kapag,” samantalang ipinaliliwanag sa talababa ang mas literal na idyoma.
- source_word: יְבִיאֲךָ
  choice: dinala ka
  rationale: Ang Hiphil ng בוא ay nangangahulugang “dalhin” o “papuntahin.” Sa sugnay na may “kapag,” likas sa Tagalog ang aspektong kontemplatibo na ipinahahayag sa anyong “dinala ka” para sa pangyayaring inaasahan sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang personal na pangalang banal na יהוה, sa halip na palitan ito ng isang titulo.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: sa lupain ng mga Cananeo
  rationale: Ipinahihiwatig ng אֶל kasama ng pandiwang “dalhin” ang patutunguhan. Ang pang-isahang katawagang gentiliko sa Hebreo ay kolektibo rito, kaya likas at tumpak ang “mga Cananeo.”
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: gaya ng ipinangako niya nang may panunumpa
  rationale: Ang Niphal ng שׁבע ay tumutukoy sa panunumpa. Iniiwasan ng pariralang ito ang “isinumpa,” na sa kasalukuyang Tagalog ay madaling maunawaang “sinumpa” o “kinurs,” habang pinananatili ang diwa ng taimtim na pangakong pinagtibay ng sumpa.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: sa iyo at sa iyong mga ninuno
  rationale: Ang אָבוֹת ay literal na “mga ama,” ngunit sa ganitong konteksto ay tumutukoy sa mga naunang salinlahi o ninuno. Ang literal na anyo ay iniingatan sa talababa.
- source_word: וּנְתָנָהּ לָךְ
  choice: at ibinigay niya ito sa iyo
  rationale: Ang hulaping pambabae ay tumutukoy pabalik sa “lupain.” Sa sugnay na pinangungunahan ng “kapag,” ang “ibinigay” ay likas na Tagalog para sa pangyayaring matatapos sa hinaharap.
theological_decisions:
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, hindi ang titulong אֲדֹנָי. Pinananatili ng “Yahweh” ang pagkakaiba ng pangalan at titulo nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
- issue: Diwa ng נִשְׁבַּע sa pangako ng lupain
  choice: ipinangako niya nang may panunumpa
  alternative: nanumpa siya; isinumpa niya
  rationale: Pinananatili nito ang lakas ng isang pangakong pinagtibay ng panunumpa. Iniiwasan din nito ang maling pakahulugan sa “isinumpa” bilang paglalagay ng sumpa sa isang tao.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pambungad na “At” at ang kuwit sa hulihan dahil nagpapatuloy ang pangungusap sa kasunod na talata. Ginamit ang karaniwang baybay na “Cananeo” at iniwasan ang “isinumpa” dahil nangingibabaw sa modernong gamit nito ang kahulugang “kinurs.”
