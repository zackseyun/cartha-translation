  source_fidelity: 'Tapat ang salin sa mga pangunahing sangkap ng Hebreo: ang panghinaharap na pangyayaring ipinakikilala ng וְהָיָה כִּי, ang pagdadala ni Yahweh sa lupain ng mga Cananeo, ang panunumpang ibinigay sa kausap at sa mga ninuno, at ang pagbibigay ng lupain. Ang perpektibong anyo ng mga pandiwang “dinala” at “ibinigay” ay natural sa sugnay na pinangungunahan ng “kapag” at tumutukoy sa pangyayaring magaganap sa hinaharap.'
