revisions:
- from: Nang payagan ng Faraon na umalis ang bayan, hindi sila pinangunahan ng Diyos sa daang dumaraan sa lupain ng mga Filisteo, bagaman iyon ang mas malapit na daan; sapagkat sinabi ng Diyos, “Baka magbago ang isip ng bayan kapag nakakita sila ng digmaan at bumalik sila sa Ehipto.”
  to: Nang payagan ng Faraon na umalis ang bayan, hindi sila pinangunahan ng Diyos sa daang dumaraan sa lupain ng mga Filisteo, bagaman malapit ito[a]; sapagkat sinabi ng Diyos, “Baka magbago ang isip ng bayan kapag nakakita sila ng digmaan at bumalik sila sa Ehipto.”
  rationale: Inalis ang hindi ipinahihiwatig na komparatibong "mas" upang masundan ang Hebreong "malapit," at nagdagdag ng tala para sa causal na alternatibo ng כִּי. Pinanatili ang concessive na pangunahing salin, ang natural na "Baka," at ang kolektibong "bayan."
