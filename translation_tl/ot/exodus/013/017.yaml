base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: tl
  text: Nang payagan ng Faraon na umalis ang bayan, hindi sila pinangunahan ng Diyos sa daang dumaraan sa lupain ng mga Filisteo, bagaman malapit ito[a]; sapagkat sinabi ng Diyos, “Baka magbago ang isip ng bayan kapag nakakita sila ng digmaan at bumalik sila sa Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: “sapagkat malapit ito.” Maaaring basahing sanhi ang Hebreong pangatnig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: Nang payagan ng Faraon na umalis ang bayan
  rationale: Ang ב na may infinitive construct ay nagsasaad ng panahong kalagayan. Sa konteksto, ang שׁלח ay pagpapahintulot o pagpapalaya sa bayan upang umalis.
- source_word: נָחָם
  choice: pinangunahan
  rationale: Ang נחה ay nangangahulugang manguna o gumabay; ang “pinangunahan” ay natural sa konteksto ng pagpili ng ruta.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: sa daang dumaraan sa lupain ng mga Filisteo
  rationale: Ipinahahayag nito nang malinaw na ruta ang tinutukoy habang pinananatili ang heograpikong pagtukoy sa lupain ng mga Filisteo.
- source_word: כִּי קָרוֹב הוּא
  choice: bagaman iyon ang mas malapit na daan
  rationale: 'Maaaring causal o concessive ang כִּי. Ang concessive na pagbasa ang pinakamalinaw sa konteksto: hindi pinili ng Diyos ang rutang iyon kahit mas malapit ito.'
- source_word: פֶּן
  choice: Baka
  rationale: Ang פֶּן ay nagpapakilala ng kinatatakutang maaaring mangyari o negatibong layunin; natural at tumpak dito ang “baka.”
- source_word: יִנָּחֵם
  choice: magbago ang isip
  rationale: Ang Niphal ng נחם dito ay pagbabago ng pasiya dahil sa pagharap sa digmaan, hindi kinakailangang moral na pagsisisi.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: kapag nakakita sila ng digmaan
  rationale: Ang infinitive na may ב ay pangyayari o pagkakataon, at ang מִלְחָמָה ay digmaan o labanan. Pinananatili ng salin ang malawak na diwa ng armed conflict.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: at bumalik sila sa Ehipto
  rationale: Ang שׁוב ay “bumalik,” at ang directional ending sa מִצְרַיִם ay likas na ipinahahayag ng “sa Ehipto.”
- source_word: וַיְהִי
  choice: Nang
  rationale: Ipinakikilala nito ang sumunod na pangyayari sa salaysay. Sapat ang natural na temporal na “Nang” at hindi kailangang dagdagan ng tahasang “Ngayon.”
theological_decisions:
- issue: Dahilan ng Diyos sa pag-iwas sa ruta ng mga Filisteo
  choice: Tuwirang pinananatili ang paliwanag ng teksto na maaaring magbago ng isip ang bayan sa harap ng digmaan.
  alternative: Ituring itong haka lamang ng tagapagsalaysay o ipahiwatig na pabago-bagong tumutugon ang Diyos.
  rationale: Ang “sinabi ng Diyos” ang tahasang nag-uugnay ng dahilan sa Diyos. Hindi dinaragdagan ng salin ang sinasabi ng talata tungkol sa kaalaman o providensiya ng Diyos.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “bayan” para sa kolektibong הָעָם at “Faraon,” “Filisteo,” at “Ehipto” bilang karaniwang anyong Filipino. Walang footnote dahil naipahayag sa pangunahing teksto ang concessive na pagbasa ng כִּי at malinaw ang kontekstuwal na diwa ng נחם.
