base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: tl
  text: Tumabas si Moises ng dalawang tapyas na bato na gaya ng mga nauna[a]. Maaga siyang bumangon nang umaga at umakyat sa Bundok Sinai, gaya ng iniutos sa kanya ni Yahweh, at kinuha niya sa kanyang kamay ang dalawang tapyas na bato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “inukit” o “hinugis sa pamamagitan ng pagtatabas” ang dalawang tapyas na bato na gaya ng mga nauna.'
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kanyang kamay”; maaaring gamitin ang isahan bilang idyoma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: tumabas
  rationale: Ang pandiwang פסל ay tumutukoy sa paghubog ng bato sa pamamagitan ng pagtabas. Natural at kongkreto sa Filipino ang “tumabas” at hindi nito ipinapalagay na may detalyadong disenyong inukit.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dalawang tapyas na bato
  rationale: Karaniwang katawagan sa Filipino para sa mga batong sulatan ng tipan ang “mga tapyas na bato”; malinaw rin nitong ipinahihiwatig na hinubog ang mga ito mula sa bato.
- source_word: כָּרִאשֹׁנִים
  choice: na gaya ng mga nauna
  rationale: Pinananatili nito ang paghahambing sa unang pares ng mga tapyas nang hindi nagdaragdag ng paliwanag.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: Kinaumagahan, maagang bumangon
  rationale: Ipinapahayag nito ang idyomang Hebreo na bumangon nang maaga at natural ang ayos sa makabagong Filipino.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: umakyat sa Bundok Sinai
  rationale: Tuwirang pinananatili ng “umakyat” ang pataas na kilos ng עלה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang Hebreo sa halip na palitan iyon ng isang titulo.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: gaya ng iniutos sa kanya ni Yahweh
  rationale: Ipinakikita ng “gaya ng” ang pagtutugma ng ginawa ni Moises sa naunang utos; ang “iniutos” ay angkop sa pagkakasunod-sunod ng salaysay.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: Kinuha niya sa kanyang kamay
  rationale: Malapit ito sa anyong Hebreo at pinananatili ang isahang “kamay,” kahit maaari itong gumana bilang idyoma.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tahasang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tapyas na bato” bilang natural na katawagan sa mga covenant tablet, at pinanatili ang pangalang Yahweh. Hinati sa tatlong pangungusap ang mahaba at magkakaugnay na sugnay ng Hebreo upang maging madaling basahin nang hindi binabago ang pagkakasunod-sunod ng mga pangyayari.
