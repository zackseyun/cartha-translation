  to: Tumabas si Moises ng dalawang tapyas na bato na gaya ng mga nauna[a]. Maaga siyang bumangon nang umaga at umakyat sa Bundok Sinai, gaya ng iniutos sa kanya ni Yahweh, at kinuha niya sa kanyang kamay ang dalawang tapyas na bato[b].
