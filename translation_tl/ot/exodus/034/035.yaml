source:
  edition: WLC
  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: tl
  text: Nakikita ng mga anak ni Israel[a] ang mukha ni Moises, at nakikita nilang nagliliwanag[b] ang balat ng mukha ni Moises. At muling inilalagay ni Moises ang lambong sa kanyang mukha hanggang sa pumasok siya upang makipag-usap sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “mga anak ni Israel”; karaniwan ding isinasalin na “mga Israelita.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang Hebreo ay nangangahulugang “nagliwanag” o “naglabas ng mga sinag.” Ang tradisyonal na saling “nagkaroon ng mga sungay” ay bunga ng isang lumang maling pagkaunawa sa salita.
    reason: lexical_alternative
  - marker: c
    text: Ang “kanya” ay tumutukoy sa PANGINOON ayon sa agarang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: Nakikita
  rationale: Sa buod na ito ng paulit-ulit na pangyayari, ang aspektong di-ganap ng Tagalog ay likas na nagpapahayag ng nakagawiang pagkakita, habang nananatiling angkop sa daloy ng salaysay.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang konkretong pananalitang pampamilya ng Hebreo; maaaring sabihin nang mas karaniwan na “mga Israelita.”
- source_word: פְּנֵי מֹשֶׁה
  choice: mukha ni Moises
  rationale: Ito ang natural na anyong Tagalog ng Hebreong construct chain.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng kanilang nakita, hindi kinakailangang isang sanhi.
- source_word: קָרַן
  choice: nagliliwanag
  rationale: Ang pandiwa ay tumutukoy sa pagliwanag o paglabas ng mga sinag; malinaw at natural ang “nagliliwanag” at hindi nito inuulit ang lumang maling pagkaunawang “may sungay.”
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: ang balat ng mukha ni Moises
  rationale: Tahasang pinananatili ang עוֹר, “balat,” sa halip na gawing mukha lamang.
- source_word: וְהֵשִׁיב
  choice: muling inilalagay
  rationale: Ang Hiphil ng שוב ay nangangahulugang ibalik o ilagay muli; ipinahihiwatig ng aspektong di-ganap ang paulit-ulit na kilos.
- source_word: הַמַּסְוֶה
  choice: ang lambong
  rationale: Ang “lambong” ay marangal at pamilyar na salita para sa pantakip sa mukha, nang walang modernong pahiwatig ng “maskara.”
- source_word: עַל פָּנָיו
  choice: sa kanyang mukha
  rationale: Natural nitong ipinahahayag na tinatakpan ng lambong ang mukha ni Moises.
- source_word: עַד בֹּאוֹ
  choice: hanggang sa pumasok siya
  rationale: Ipinahahayag nito ang hangganan ng pagkakalagay ng lambong at ang pagpasok ni Moises sa presensiya ng kausap.
- source_word: לְדַבֵּר אִתּוֹ
  choice: upang makipag-usap sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo sa pangunahing teksto sa halip na tahasang idagdag ang pangalan ng Diyos.
theological_decisions:
- issue: Ang tinutukoy ng “sa kanya”
  choice: Pinanatili sa pangunahing teksto ang panghalip; ipinaliliwanag sa talababa na ang tinutukoy ay ang PANGINOON.
  alternative: Isalin nang tahasan bilang “upang makipag-usap sa PANGINOON.”
  rationale: Panghalip ang nasa Hebreo, at malinaw ang tinutukoy mula sa agarang konteksto. Ang pagpapanatili rito ay umiiwas sa pagdaragdag sa pangunahing teksto habang nagbibigay pa rin ng paglilinaw sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang “mga anak ni Israel” dahil sa anyong pampamilya ng Hebreo, ang “balat” dahil tahasan ito sa pinagmulan, at ang panghalip sa huling parirala upang hindi labis na linawin ang teksto. Ginamit ang aspektong di-ganap sa “nakikita” at “inilalagay” upang ipakita ang paulit-ulit o nakagawiang kilos sa buod ng salaysay.
