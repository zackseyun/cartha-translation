  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: tl
  text: Huwag kang makipagtipan sa mga naninirahan sa lupain, baka magpapatutot sila sa pagsunod sa kanilang mga diyos[a] at maghandog sa kanilang mga diyos; at aanyayahan ka ng isa sa kanila[b], at kakain ka mula sa kanyang hain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “magtataksil sila sa pagsunod sa kanilang mga diyos.” Gumagamit ang Hebreo ng larawan ng prostitusyon o seksuwal na pagtataksil para sa idolatriya.
    reason: lexical_alternative
  - marker: b
    text: 'Literal, “at aanyayahan ka niya.” Malamang na distributibo ang isahan: “aanyayahan ka ng isa sa kanila.”'
    reason: lexical_alternative
  - marker: c
    text: O, “kakain ka ng kanyang hain.” Maaaring tumukoy ito sa pagkaing kaugnay ng kanyang inihandog na hain.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Mag-ingat kang huwag … Kung hindi
  rationale: Ipinahahayag ang babala at ang posibleng masamang bunga sa natural na modernong Tagalog; pinananatili ang puwersa ng Hebreong פֶּן.
- source_word: תִּכְרֹת בְּרִית
  choice: makipagtipan
  rationale: Natural at maikli sa Tagalog para sa idyomang Hebreo na literal na 'pumutol ng tipan,' nang hindi inililipat ang literal na larawang hindi karaniwan sa Tagalog.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: sa mga naninirahan sa lupain
  rationale: Pinananatili ang kolektibong pagtukoy sa mga taong nakatira sa lupain.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: magpapakawalang-dangal sila sa pagsunod sa kanilang mga diyos
  rationale: Ipinahihiwatig ang matinding larawang seksuwal ng זנה at ang kusang pagtataksil, habang nananatiling dignified at nauunawaan sa karaniwang modernong Tagalog; nililinaw sa talababa ang tahasang metapora.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: maghahandog sila sa mga iyon
  rationale: Sa konteksto, ang 'mga iyon' ay malinaw na tumutukoy sa kanilang mga diyos; ang 'maghahandog' ay natural na pandiwa para sa ritwal na paghahain.
- source_word: וְקָרָא לְךָ
  choice: kapag inanyayahan ka ng isa sa kanila
  rationale: Ginagawang malinaw ang malamang na distributibong diwa ng isahang pandiwa pagkatapos ng maramihang simuno, nang hindi ginagawang maramihan ang kilos.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: baka kumain ka mula sa kanyang handog
  rationale: Pinananatili ang ugnayan sa inihandog na bagay at ang babalang modal na epekto ng pambungad na פֶּן; hindi tahasang dinaragdagan ng 'ritwal na salu-salo' ang teksto.
theological_decisions:
- issue: Ang idolatriya bilang seksuwal na pagtataksil
  choice: Panatilihin sa pangunahing teksto ang matinding diwa sa 'magpapakawalang-dangal,' at ilahad sa talababa ang mas tahasang 'magpatutot.'
  alternative: sumunod lamang sa kanilang mga diyos; magpatutot sa pagsunod sa kanilang mga diyos
  rationale: Ang זנה ay sadyang gumagamit ng seksuwal na larawan para sa pagtataksil sa tipan. Hindi ito dapat patagin bilang simpleng pagsunod, ngunit ang talababa ay tumutulong upang mapanatili nang tahasan ang metapora habang natural at dignified ang pangunahing teksto.
- issue: Isahang 'siya ay mag-aanyaya' pagkatapos ng maramihang tinutukoy
  choice: ang isa sa kanila ay mag-aanyaya sa iyo
  alternative: aanyayahan ka niya; aanyayahan ka nila
  rationale: 'Malamang na distributibo ang isahan: maaaring isang indibidwal mula sa mga naninirahan ang mag-anyaya. Pinananatili nito kapwa ang gramatikal na isahan at ang malinaw na kaugnayan nito sa maramihang naunang tinukoy.'
- issue: Pagkain mula sa handog sa diyus-diyosan
  choice: kumain mula sa kanyang handog
  alternative: kumain sa kanyang handugang salu-salo
  rationale: Ang Hebreo ay maaaring tumukoy sa pagkaing bahagi o bunga ng hain. Ang mas malapit na salin ay nagpapanatili ng saklaw nang hindi ipinapalagay ang buong anyo ng ritwal na pagkain.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at malinaw. Ginamit ang 'makipagtipan,' 'lupain,' at 'handog' bilang pangkaraniwan ngunit angkop sa tekstong biblikal. Iniwasan ang sobrang arkaikong pananalita at ang denominasyonal na pagpapaliwanag. Ang paghahati sa dalawang pangungusap at paggamit ng 'Kung hindi' ay likas sa Tagalog at ipinakikita ang babala at mga bunga nito.
