revisions:
- from: Mag-ingat kang huwag makipagtipan sa mga naninirahan sa lupain. Kung hindi, magpapakawalang-dangal sila sa pagsunod sa kanilang mga diyos[a] at maghahandog sila sa mga iyon; at kapag inanyayahan ka ng isa sa kanila[b], baka kumain ka mula sa kanyang handog[c].
  to: Huwag kang makipagtipan sa mga naninirahan sa lupain, baka magpapatutot sila sa pagsunod sa kanilang mga diyos[a] at maghandog sa kanilang mga diyos; at aanyayahan ka ng isa sa kanila[b], at kakain ka mula sa kanyang hain[c].
  rationale: Pinanatili ng rebisyon ang babalang puwersa ng פֶּן sa “Huwag ... baka,” ang hayag na metapora ng זנה sa pangunahing teksto, ang maramihang pagtukoy sa kanilang mga diyos, at ang distributibong isahan sa pag-anyaya. Hindi nito dinaragdagan ang teksto ng paliwanag hinggil sa anyo ng ritwal na kainan; ang naturang posibilidad ay nananatili sa talababa.
