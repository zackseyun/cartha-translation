  verdict: revise
  source_fidelity: Kailangang baguhin ang pangunahing teksto upang mas malinaw na mapanatili ang sinadyang metaporang seksuwal ng זנה. Ang “magpapakawalang-dangal” ay masyadong malabo at maaaring tumukoy lamang sa kahiya-hiyang asal. Ang babalang saklaw ng פֶּן ay mas maayos ding maipahahayag nang hindi hinahati bilang isang hiwalay na “Kung hindi” na pangungusap.
  naturalness: Natural at angkop sa modernong Tagalog ang “makipagtipan,” “mga naninirahan sa lupain,” “maghahandog,” at “aanyayahan ka ng isa sa kanila.” Ang “magpapatutot sila sa pagsunod sa kanilang mga diyos” ay may mas mataas na rehistro ngunit malinaw sa kontekstong biblikal at tapat sa matinding metapora ng Hebreo.
  terminology: Gamitin ang “mga diyos” sa halip ng panghalip na “mga iyon” upang manatiling hayag ang layon ng paghahandog. “Hain” ang mas tiyak na katumbas ng זֶבַח kaysa sa pangkalahatang “handog.”
