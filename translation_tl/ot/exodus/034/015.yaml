    issue: Napalabnaw ang metapora ng זנה sa “magpapakawalang-dangal.”
    rationale: Ang Hebreo ay hayagang gumagamit ng larawan ng prostitusyon/seksuwal na pagtataksil para sa idolatriya. Hindi sapat na mapanatili lamang ito sa talababa kung ang pangunahing teksto ay maaaring unawain bilang pangkalahatang kahihiyan.
  - severity: low
    issue: Ang “Kung hindi” at “kapag ... baka” ay bahagyang nagrereorganisa ng iisang babalang hanay ng פֶּן.
    rationale: Mas malapit at mas daloy-Tagalog ang isang tuloy-tuloy na pagbabawal na sinusundan ng “baka,” na sumasaklaw sa magkakasunod na bunga.
  - severity: low
