base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: tl
  text: Nang makita ni Aaron at ng lahat ng mga anak ni Israel si Moises, nakita nilang nagliliwanag[a] ang balat ng kanyang mukha, at natakot silang lumapit sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sumisinag” o “naglalabas ng mga sinag.” Bihira ang pandiwang Hebreo at sa kasaysayan ng pagsasalin ay naisalin ding “may sungay,” ngunit mas pinapaboran ng konteksto ang ningning.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: makita
  rationale: Ang ראה sa anyong salaysay ay tuwirang nangangahulugang “makita”; ang pagkakabuo na “Nang makita” ay likas sa makabagong Tagalog.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: at ng lahat ng mga anak ni Israel
  rationale: Pinananatili nito ang pampamilyang katawagang Hebreo na בְּנֵי יִשְׂרָאֵל at ang tahasang panlalaking anyo nito, sa halip na gawing “mga Israelita.”
- source_word: וְהִנֵּה
  choice: nakita nilang
  rationale: Sa kontekstong biswal, ipinahahayag nito nang natural sa Tagalog ang biglaang pagkapansin na idinudulot ng particle; ang literal na “narito” ay hindi likas dito.
- source_word: קָרַן
  choice: nagliliwanag
  rationale: Ang bihirang pandiwa ay tumutukoy rito sa paglabas ng liwanag o sinag. Ang “nagliliwanag” ay malinaw, likas, at hindi lumalabis sa tiyak na paraan ng pagningning.
- source_word: עוֹר פָּנָיו
  choice: ang balat ng kanyang mukha
  rationale: Pinananatili ang tahasang עוֹר, “balat,” sa halip na paikliin lamang bilang “mukha.”
- source_word: וַיִּירְאוּ
  choice: natakot sila
  rationale: Karaniwang makabagong Tagalog ito para sa tugon nilang takot.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: lumapit sa kanya
  rationale: Sa kasunod ng pandiwang “natakot,” natural na ipinahahayag ng pawatas ang pag-aatubili nilang lumapit.
theological_decisions:
- issue: Paglalarawan sa בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang pampamilyang anyo ng Hebreo at hindi ito ginagawang mas pangkalahatang etnikong katawagan.
- issue: Kahulugan ng קָרַן tungkol sa mukha ni Moises
  choice: nagliliwanag
  alternative: sumisinag; naglalabas ng mga sinag; may sungay
  rationale: Ang konteksto ay tungkol sa nakikitang ningning ng balat ng mukha ni Moises at sa takot ng mga nakakita. Hindi pinipili ang historikal na “may sungay,” ngunit itinatala ito bilang tunay na kasaysayan ng pagsasalin ng bihirang salita.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “mga anak ni Israel” upang mapanatili ang anyong pampamilya ng Hebreo; isinaayos naman ang וְהִנֵּה bilang “nakita nilang” upang maipahayag nang natural ang biglaang pagkapansin nang hindi gumagamit ng lipas o matigas na “narito.”
