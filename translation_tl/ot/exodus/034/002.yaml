  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: tl
  text: Humanda ka para sa umaga; at sa umaga, umakyat ka sa Bundok Sinai[a] at humarap ka sa akin doon, sa tuktok ng bundok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pumarito ka sa Bundok Sinai.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tumayo ka roon sa harap ko, sa tuktok ng bundok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: Humanda ka
  rationale: Ang pinagsamang pandiwang היה at pang-uring נָכוֹן ay isang utos na maging handa; natural at tuwiran sa modernong Filipino ang “Humanda ka.”
- source_word: לַבֹּקֶר
  choice: para sa umaga
  rationale: Ipinakikita ng ל ang takdang panahong pinaghahandaan. Pinananatili ng “para sa umaga” ang kaibhan nito sa kasunod na בַבֹּקֶר nang hindi ipinipilit na handa na bago sumapit ang umaga.
- source_word: וְעָלִיתָ
  choice: umakyat ka
  rationale: Karaniwang kahulugan ng עלה ang umakyat. Hindi likas sa Filipino ang deiktikong pagkakaiba ng English na “come up/go up,” kaya malinaw na isinasalin ang kilos at inilalagay sa talababa ang posibleng speaker-oriented na diwa.
- source_word: בַבֹּקֶר
  choice: sa umaga
  rationale: Tahasang pariralang temporal na nagsasaad kung kailan aakyat si Moises.
- source_word: אֶל הַר סִינַי
  choice: sa Bundok Sinai
  rationale: Natural na Filipino para sa direksiyon patungo sa pinangalanang bundok.
- source_word: וְנִצַּבְתָּ לִי
  choice: humarap ka sa akin
  rationale: Ang Niphal ng נצב ay maaaring mangahulugang tumayo o pumuwesto; kasama ng לִי, ipinahihiwatig nito ang pagharap o pagpapakita ng sarili sa Diyos. Ang “humarap ka sa akin” ay natural ngunit hindi inaalis ang literal na alternatibo.
- source_word: שָׁם
  choice: doon
  rationale: Payak na pang-abay na pook na tumutukoy sa itinakdang lugar.
- source_word: עַל רֹאשׁ הָהָר
  choice: sa tuktok ng bundok
  rationale: Sa topograpikong gamit, ang רֹאשׁ (“ulo”) ay tumutukoy sa tuktok o taluktok; “sa tuktok” ang natural at malinaw na Filipino.
theological_decisions:
- issue: Oryentasyon ng nagsasalita sa וְעָלִיתָ
  choice: umakyat ka
  alternative: pumarito ka sa Bundok Sinai
  rationale: Hindi kailangang tukuyin ng Filipino kung ang pag-akyat ay “papunta” o “paparito.” Ang payak na “umakyat” ay nananatiling tapat sa kilos at hindi labis na nilulutas ang deiktikong posibilidad.
- issue: Diwa ng וְנִצַּבְתָּ לִי
  choice: humarap ka sa akin
  alternative: tumayo ka roon sa harap ko
  rationale: Maaaring idiomatikong tumukoy ang parirala sa pagharap o pagharap ng sarili sa Diyos, ngunit nananatiling posible ang mas literal na “tumayo.” Inilalagay ang alternatibo sa talababa upang mapanatili ang tunay na saklaw ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Bundok Sinai” bilang karaniwang anyo ng pangalan. Pinanatili ang pagkakaiba ng לַבֹּקֶר (“para sa umaga”) at בַבֹּקֶר (“sa umaga”), at inilakip sa teksto ang lahat ng marker ng talababa.
