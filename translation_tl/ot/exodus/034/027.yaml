  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Isulat mo ang mga salitang ito para sa iyong sarili, sapagkat ayon sa mga salitang ito ay nakipagtipan ako[a] sa iyo at sa Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ako ng tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahahayag ng anyong pasalaysay ang kasunod na pangyayari; natural sa modernong Filipino ang “Pagkatapos, sinabi.”
- source_word: כְּתָב לְךָ
  choice: Isulat mo ... para sa iyong sarili
  rationale: Pinananatili ang tuwirang utos at ang personal na diin ng לְךָ, bagaman maaari rin itong unawain nang mas payak bilang “para sa iyo.”
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: mga salitang ito
  rationale: Ang “mga salita” ay angkop sa konteksto ng nakasulat na mga tuntunin ng tipan at pinananatili ang pag-uulit sa talata.
- source_word: כִּי עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: sapagkat batay sa mga salitang ito
  rationale: Ang כִּי ay nagbibigay ng dahilan, at ang idyomang עַל־פִּי ay nagpapahiwatig ng saligan o kaayusan ayon sa mga salitang binanggit.
- source_word: כָּרַתִּי ... בְּרִית
  choice: nakipagtipan ako
  rationale: Ito ang natural na katumbas sa Filipino ng Hebreong idyomang literal na “pumutol ng tipan,” at malinaw na ipinapakita ang natapos na pakikipagtipan.
- source_word: אִתְּךָ וְאֶת יִשְׂרָאֵל
  choice: sa iyo at sa Israel
  rationale: Malinaw na pinananatili sina Moises at Israel bilang mga kabilang sa pakikipagtipan.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo nang hindi ito pinapalitan ng titulo.
- issue: Paglilipat sa idyomang כָּרַתִּי ... בְּרִית
  choice: nakipagtipan ako
  alternative: pumutol ako ng tipan; gumawa ako ng tipan
  rationale: Natural at malinaw sa karaniwang mambabasa ang “nakipagtipan,” samantalang inilalagay sa talababa ang literal na larawan ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pag-uulit ng “mga salitang ito,” ang personal na diin ng “para sa iyong sarili,” at ang pangalan na Yahweh. Inilagay ang talababa sa mismong pariralang “nakipagtipan ako,” na siyang tinutukoy nito.
