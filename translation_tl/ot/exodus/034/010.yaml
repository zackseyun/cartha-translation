  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: tl
  text: At sinabi niya, “Narito, nakikipagtipan ako. Sa harap ng buong bayan mo ay gagawa ako ng mga kababalaghang hindi pa kailanman nalikha saanman sa buong lupa o sa lahat ng bansa. Makikita ng buong bayang kinaroroonan mo ang gawa ni Yahweh, sapagkat kasindak-sindak ang ginagawa ko sa iyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at marangal na panandang pantawag-pansin na pinananatili ang diin ng Hebreo.
- source_word: כֹּרֵת בְּרִית
  choice: nakikipagtipan ako
  rationale: Ang idyomang literal na 'pumuputol ng tipan' ay natural na ipinapahayag sa Filipino bilang pakikipagtipan.
- source_word: נִפְלָאֹת
  choice: mga kababalaghan
  rationale: Tumutukoy sa pambihira at kamangha-manghang mga gawa ng Diyos.
- source_word: לֹא נִבְרְאוּ
  choice: hindi pa kailanman nagawa
  rationale: Bagaman literal na 'hindi nilikha,' sa konteksto ng mga kababalaghan, malinaw at natural ang 'hindi pa kailanman nagawa' habang napapanatili ang di-pangkaraniwang katangian nito.
- source_word: נוֹרָא
  choice: kasindak-sindak
  rationale: Pinananatili ang saklaw na nakapupukaw ng takot at matinding paghanga, hindi lamang ang mas positibong 'kahanga-hanga.'
- source_word: עֹשֶׂה עִמָּךְ
  choice: gagawin ko sa iyo
  rationale: 'Pinananatili ang may kalabuan ng pang-ukol: maaaring ''sa iyo'' o ''kasama mo''; ang ''sa iyo'' ay natural at malapit sa anyong Hebreo.'
theological_decisions:
- issue: Pagpapangalan sa tetragrammaton יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang transliterasyon ng personal na pangalan upang malinaw na katawanin ang יהוה sa pinagmulang teksto, nang hindi nagdaragdag ng interpretasyong denominasyonal.
- issue: Lakas ng נוֹרָא
  choice: kasindak-sindak
  alternative: kamangha-mangha
  rationale: Hindi nilimitahan ang salita sa paghanga lamang; pinananatili rin ang pangingilabot at banal na sindak na likas sa termino.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maayos na daloy ng pangungusap at karaniwang bokabularyo, habang pinananatili ang solemnidad ng pahayag ng tipan.
