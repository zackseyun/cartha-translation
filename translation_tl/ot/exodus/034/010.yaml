  to: At sinabi niya, “Narito, nakikipagtipan ako. Sa harap ng buong bayan mo ay gagawa ako ng mga kababalaghang hindi pa kailanman nalikha saanman sa buong lupa o sa lahat ng bansa. Makikita ng buong bayang kinaroroonan mo ang gawa ni Yahweh, sapagkat kasindak-sindak ang ginagawa ko sa iyo.”
