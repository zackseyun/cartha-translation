  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: tl
  text: Huwag mong katayin nang may kasamang pampaalsa ang dugo ng hain ko[a]; at huwag mong hayaang manatili hanggang umaga ang hain sa Pista ng Paskuwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “huwag mong katayin nang may pampaalsa ang dugo ng aking hain.” Masinsin at di-karaniwan ang ayos na ito, sapagkat ang pandiwang “katayin” ay kaugnay ng paghahandog ng hain. Maaaring tumukoy ang pagbabawal sa pagkatay habang may pampaalsa o anumang pinaalsa na kasama o naroroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: katayin
  rationale: Ang pandiwang שׁחט ay tumutukoy rito sa ritwal na pagkatay ng hayop na ihahain. Mas tiyak ang “katayin” kaysa “patayin,” at hindi nito agad pinapalitan ng mas malawak na “ihandog” ang konkretong kilos sa Hebreo.
- source_word: עַל חָמֵץ
  choice: nang may kasamang pampaalsa
  rationale: Idyomatiko ang עַל sa pagbabawal na ito. Ipinahahayag ng “may kasamang pampaalsa” ang kaugnayan nito sa pagkatay nang hindi labis na tinutukoy kung ang pampaalsa ay nasa mismong hain, nasa tinapay, o naroroon lamang sa ritwal.
- source_word: דַּם זִבְחִי
  choice: ang haing ang dugo ay inihahandog sa akin
  rationale: Pinananatiling hayag ang “dugo” at ang unang panauhang hulapi na tumutukoy sa Diyos. Bahagyang binago ang ayos upang maging nauunawaan sa natural na Tagalog ang masinsing pariralang Hebreo na literal na “dugo ng aking hain.”
- source_word: יָלִין לַבֹּקֶר
  choice: hayaang manatili hanggang umaga
  rationale: Sa kontekstong ito, ang לין ay nangangahulugang manatili sa magdamag. Sapat na ang “hanggang umaga” upang ipahayag ang hangganan ng panahon nang hindi inuulit ang diwa ng “magdamag.”
- source_word: זֶבַח חַג הַפָּסַח
  choice: ang hain sa Pista ng Paskuwa
  rationale: Pinananatili ang mga ideya ng hain at pista, habang gumagamit ng natural na ugnayang “sa” para sa masinsing kawing ng mga pangngalan sa Hebreo.
- source_word: הַפָּסַח
  choice: Paskuwa
  rationale: Ang “Paskuwa” ay nakaugaliang salin sa Tagalog para sa פֶּסַח at malinaw na tumutukoy sa kapistahan sa konteksto ng tipan ng Israel.
theological_decisions:
- issue: Paglalahad sa katawagang pangkapistahan ng tipan nang hindi nagdaragdag ng mas huling doktrinal na pakahulugan
  choice: Pista ng Paskuwa
  alternative: Pesach
  rationale: Tumutukoy ang talata sa pagsamba ng Israel sa kontekstong Mosaiko. Ang “Paskuwa” ay malinaw at nakaugaliang katawagan sa Tagalog, at hindi ito nagdaragdag ng interpretasyong lampas sa tekstong Hebreo.
- issue: Masinsing ugnayan ng dugo, hain, at pampaalsa sa unang sugnay
  choice: ang haing ang dugo ay inihahandog sa akin
  alternative: ang dugo ng aking hain
  rationale: Hindi natural sa Tagalog ang literal na “katayin ang dugo.” Inilalahad ng napiling ayos ang ritwal na pagkatay at pinananatiling hayag ang dugo at ang kaugnayan nito sa Diyos, nang hindi nagpapasiya nang higit sa sinasabi ng Hebreo kung ano mismo ang mekanismo ng pagbabawal.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang pang-isahang “mong” ayon sa anyo ng utos sa Hebreo. Iniwasan ang sobrang literal ngunit di-natural na “katayin ang dugo,” habang pinanatiling hayag ang dugo, hain, pampaalsa, pista, at Paskuwa.
