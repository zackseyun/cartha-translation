translation:
  language: tl
  text: Nagmadaling yumukod si Moises hanggang sa lupa at sumamba[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kaagad na yumukod” o “nagmamadaling kumilos.”
    reason: lexical_alternative
  - marker: b
    text: O “nagpatirapa”; maaaring tumukoy ang pandiwang Hebreo sa pagyuko ng sarili bilang pagpupugay o pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Agad
  rationale: Ang pandiwang מהר ay nagpapahayag ng pagmamadali o mabilis na pagkilos. Ang “agad” ay likas sa modernong Tagalog at ipinakikita ang mabilis na tugon ni Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang kinagawiang anyo ng pangalan sa Tagalog.
- source_word: וַיִּקֹּד
  choice: yumukod
  rationale: Ang קדד ay tumutukoy sa pagyuko o pagpapakababa ng katawan. Pinananatili ng “yumukod” ang pisikal na kilos nang hindi ito ipinagkakamali sa kasunod na pandiwa.
- source_word: אַרְצָה
  choice: hanggang sa lupa
  rationale: Ang anyong paturol ay nagpapahiwatig ng pagkilos pababa, tungo sa lupa. Ang “hanggang sa lupa” ay malinaw at natural na naglalarawan sa lalim ng pagyuko.
- source_word: וַיִּשְׁתָּחוּ
  choice: sumamba
  rationale: Ang anyo ng שחה ay maaaring tumukoy sa pagpapatirapa bilang pagpapakumbaba, paggalang, o pagsamba. Sa tugon ni Moises sa pagpapahayag ng PANGINOON, ipinahahayag ng “sumamba” ang layuning debosyonal, samantalang naipahayag na ng naunang pandiwa ang pisikal na pagyuko.
theological_decisions:
- issue: Kung ang huling pandiwa ay isasalin bilang pisikal na pagpapatirapa lamang o bilang pagsamba
  choice: sumamba
  alternative: nagpatirapa / yumukod bilang pagpupugay
  rationale: Sa konteksto, tumutugon si Moises nang may pagpipitagan sa pagpapahayag ng PANGINOON. Gayunman, maaari ring ilarawan ng Hebreo ang mismong kilos ng pagpapatirapa; kaya pinanatili sa talababa ang tunay na leksikal na posibilidad sa halip na ganap itong alisin.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “agad” para sa likas na daloy ng salaysay, “yumukod hanggang sa lupa” para sa malinaw na pisikal na kilos, at “sumamba” para sa kontekstuwal na diwa ng ikalawang kilos, habang inilalahad sa mga talababa ang mga tunay na alternatibo ng Hebreo.
