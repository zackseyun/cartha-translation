  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: tl
  text: Pagkatapos nito, lumapit ang lahat ng mga anak ni Israel[a], at iniutos niya sa kanila ang lahat ng sinabi ni Yahweh sa kanya sa Bundok Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel”; isang pambansang katawagang maaari ring isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Malinaw at likas na panandang temporal ito para sa pangyayaring sumunod sa naunang tagpo.
- source_word: נִגְּשׁוּ
  choice: lumapit
  rationale: Tuwirang ipinahahayag ng pandiwa ang paglapit ng mga tao kay Moises at pinananatili ang konkretong kilos sa salaysay.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: ang lahat ng mga anak ni Israel
  rationale: Pinananatili nito ang Hebreong pambansang katawagang literal na 'mga anak ni Israel,' sa halip na gawing 'mga Israelita.'
- source_word: וַיְצַוֵּם
  choice: at iniutos niya sa kanila
  rationale: Ang צוה ay tumutukoy sa pagbibigay ng utos; ang 'iniutos' ay nagpapanatili sa lakas nito nang hindi pinapalambot bilang payak na pagtuturo.
- source_word: אֵת כָּל אֲשֶׁר
  choice: ang lahat ng
  rationale: Likas itong panimula sa buong nilalaman ng ipinag-utos sa kanila.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: sinabi ni Yahweh sa kanya
  rationale: Natural ito sa makabagong Tagalog at malinaw na tumutukoy sa naunang pakikipag-usap ni Yahweh kay Moises, bagaman ang Hebreo ay maaari ring idiing 'nakipag-usap sa kanya.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan iyon ng isang titulo.
- source_word: בְּהַר סִינָי
  choice: sa Bundok Sinai
  rationale: Ito ang natural at tiyak na paraan sa Tagalog upang tukuyin ang lugar ng pakikipag-usap.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tuwirang nasa tekstong Hebreo, kaya pinananatili itong 'Yahweh' sa halip na palitan ng titulong 'PANGINOON.'
- issue: Pagsasalin sa pambansang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili ng piniling anyo ang larawang pampamilya at gramatikal na anyo ng Hebreo, habang ipinapaliwanag sa talababa na pambansang katawagan ito.
- issue: Saklaw ng iniutos ni Moises
  choice: ang lahat ng sinabi ni Yahweh sa kanya
  alternative: lahat ng utos na sinabi ni Yahweh sa kanya
  rationale: Hindi idinaragdag ang salitang 'mga utos' sa nilalaman, sapagkat sinasabi lamang ng Hebreo na iniutos ni Moises ang lahat ng sinalita ni Yahweh; sa gayon ay napapanatili ang bahagyang tensiyon ng pagkakabuo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang payak na ayos ng pangungusap at mga salitang karaniwan sa kasalukuyang gamit, habang pinananatili ang Hebreong pambansang katawagan at ang personal na pangalang Yahweh.
