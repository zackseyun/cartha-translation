base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: tl
  text: Ingatan mong sundin ang iniuutos ko sa iyo ngayon.[a] Narito, itataboy ko mula sa harapan mo[b] ang mga Amoreo, Cananeo, Heteo, Perezeo, Heveo, at Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ingatan mo ang iniuutos ko sa iyo ngayon” o “Tiyakin mong sundin ang iniuutos ko sa iyo ngayon.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa harapan mo”; nangangahulugan itong aalisin sila mula sa iyong presensiya o palalayasin sa unahan mo.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Ingatan mong sundin
  rationale: Ang imperatibong שׁמר ay maaaring mangahulugang ingatan, tuparin, o sundin. Sa konteksto ng isang utos, likas sa modernong Tagalog ang “ingatan mong sundin,” na pinananatili ang diwa ng maingat na pagtupad nang gawing hiwalay na babala ang parirala.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: ang iniuutos ko sa iyo ngayon
  rationale: Tuwirang ipinapahayag ng sugnay ang bagay na dapat sundin. Ang “iniuutos” ay angkop sa aspektong nagpapatuloy o kasalukuyan ng participle מְצַוְּךָ.
- source_word: הִנְנִי
  choice: Narito
  rationale: Ang הִנְנִי ay pantawag-pansin na nagpapakilala sa mariing pagkilos ng Diyos. Ang “Narito” ay marangal at pamilyar sa wikang biblikal nang hindi lubhang makaluma.
- source_word: גֹרֵשׁ
  choice: itataboy ko
  rationale: Ang participle na kasunod ng הִנְנִי ay maaaring magpahiwatig ng nalalapit at tiyak na pagkilos. Higit na likas sa Tagalog ang panghinaharap na “itataboy ko,” habang pinananatili ang katiyakan ng ipinahayag na gawa.
- source_word: מִפָּנֶיךָ
  choice: mula sa harapan mo
  rationale: Pinananatili nito ang konkretong Hebreong idyoma ng pag-aalis mula sa harap o presensiya ng kausap; nililinaw ng talababa ang kahulugan.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: ang mga Amoreo, Cananeo, Heteo, Perezeo, Heveo, at Jebuseo
  rationale: Ang mga pangalang-bayan na kolektibong isahan sa Hebreo ay likas na isinasalin bilang mga pangkat sa Tagalog. Ginamit ang mga anyong karaniwang nakikilala sa tradisyong Tagalog.
theological_decisions:
- issue: Diwa ng imperatibong שׁמר sa konteksto ng tipan
  choice: Isinalin bilang utos na maingat na sundin ang ipinag-uutos.
  alternative: “Ingatan mo ang iniuutos ko sa iyo ngayon” o “Mag-ingat ka tungkol sa iniuutos ko sa iyo ngayon.”
  rationale: Saklaw ng pandiwa ang pag-iingat at pagsunod. Ang napiling anyo ay malinaw sa ordinaryong Tagalog at hindi ito nililimitahan sa isang babala lamang, bagaman kinikilala sa talababa ang mas literal na alternatibo.
- issue: Aspekto ng pagkilos sa הִנְנִי גֹרֵשׁ
  choice: “Narito, itataboy ko” bilang nalalapit at tiyak na pagkilos.
  alternative: “Narito, itinataboy ko.”
  rationale: Maaaring katawanin ng participle ang kasalukuyan, nalalapit, o tiyak na pagkilos. Ang panghinaharap ay mas natural sa Tagalog sa kontekstong ito, ngunit hindi binabawasan ang diin sa katiyakan ng pangako.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinili ang “Narito” bilang pormal ngunit pamilyar na pantawag-pansin. Iningatan ang Hebreong idyoma na “mula sa harapan mo” at ipinaliwanag ito sa talababa.
