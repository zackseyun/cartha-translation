  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: tl
  text: Nang bumaba si Moises mula sa Bundok Sinai, dala niya sa kamay ang dalawang tapyas ng Patotoo habang bumababa siya mula sa bundok, hindi niya alam na nagningning ang balat ng kanyang mukha[a] dahil nakipag-usap siya sa kanya[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagsinag” o “naglabas ng mga sinag.” May makasaysayang salin na “nagkaroon ng mga sungay,” ngunit hindi ito gaanong angkop sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanya” ay tumutukoy sa PANGINOON.
    reason: referent_clarification
  - marker: c
    text: 'Maaari ring unawain: “nang nakipag-usap siya sa kanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Nang
  rationale: Sa salaysay na Tagalog, natural na maipaloob sa temporal na 'Nang' ang pambungad na wayyiqtol at ang kasunod na infinitive construction, nang hindi gumagamit ng artipisyal na 'At nangyari.'
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: Nang bumaba ... habang bumababa siya
  rationale: Pinananatili ang dalawang temporal na parirala at ang pag-uulit ng ideya ng pagbaba, gaya ng Hebreo.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: ang dalawang tapyas ng Patotoo
  rationale: '''Tapyas'' ay malinaw at likas na tawag sa mga lapidang bato; pinananatili ng ''Patotoo'' ang katawagang pangkasunduan nang hindi ito labis na binibigyang-kahulugan.'
- source_word: בְּיַד מֹשֶׁה
  choice: dala sa kamay niya
  rationale: Pinananatili ang kongkretong larawang nasa kamay ni Moises, ngunit ginagawang natural sa modernong Tagalog.
- source_word: קָרַן
  choice: nagliliwanag
  rationale: Ipinahihiwatig ng pandiwa rito ang paglalabas ng sinag o liwanag; ang progresibong anyo ay malinaw at natural sa konteksto.
- source_word: עוֹר פָּנָיו
  choice: ang balat ng kanyang mukha
  rationale: Pinananatili ang tahasang pagbanggit ng Hebreo sa balat ng mukha, hindi lamang sa mukha.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: dahil nakipag-usap Siya sa kanya
  rationale: Maaaring sanhi o panahunan ang בְּ; ang pangunahing teksto ay gumagamit ng sanhi, habang itinatala sa talababa ang temporal na posibilidad.
- source_word: אִתּוֹ
  choice: sa kanya
  rationale: Pinananatili ang panghalip para kay Moises; ang paksa ng pakikipag-usap ay nililinaw sa pamamagitan ng kapitalisadong 'Siya' at talababa bilang ang PANGINOON.
theological_decisions:
- issue: Kahulugan ng קָרַן sa mukha ni Moises
  choice: nagliliwanag / naglalabas ng mga sinag
  alternative: nagkaroon ng mga sungay
  rationale: Ang konteksto ay tungkol sa nakikitang ningning matapos makipag-usap si Moises sa PANGINOON. Ang makasaysayang pagbasa na 'may sungay' ay posibleng maiugnay sa ugat ngunit hindi gaanong angkop sa konteksto.
- issue: Paksa at tinutukoy ng mga panghalip sa בְּדַבְּרוֹ אִתּוֹ
  choice: Ang PANGINOON ang nakipag-usap kay Moises
  alternative: Panatilihing parehong di-tiyak ang mga panghalip
  rationale: Gramatikal na ang paksa ng infinitive ay tumutukoy sa naunang paksa na si YHWH sa konteksto (34:28), samantalang ang suffix ng אִתּוֹ ay tumutukoy kay Moises. Nililinaw ito nang hindi pinapalitan ng pangalan ang pangunahing teksto.
- issue: Ugnayan ng בְּדַבְּרוֹ sa pagliwanag
  choice: 'sanhi: dahil nakipag-usap'
  alternative: 'panahon: nang makipag-usap'
  rationale: Parehong posible sa konstruksyon. Mas natural sa konteksto ang sanhi, ngunit tunay na nananatili ang temporal na pagbasa at inilalagay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang arkaikong 'At nangyari' at pinanatili ang pag-uulit ng pagbaba, ang kongkretong 'balat ng kanyang mukha,' at ang tunay na ambigwidad ng temporal o sanhi sa pamamagitan ng talababa.
