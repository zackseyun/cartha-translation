  source_fidelity: Kailangang itama ang huling sugnay. Sa Hebreo, si Moises ang paksa ng infinitive na “sa kanyang pakikipag-usap sa kanya,” at ang hulíng panghalip ay tumutukoy sa PANGINOON. Binabaligtad ng draft ang mga gampanin sa “nakipag-usap Siya sa kanya.” Napananatili ng rebisyon ang sanhi/temporal na ambigwidad sa talababa.
  naturalness: Ang “dala niya sa kamay ang dalawang tapyas” ay mas maayos na pagkakaayos sa modernong Tagalog kaysa “dala sa kamay niya.” Ang “nagningning” ay tuwirang natural para sa balat ng mukha at hindi nangangailangan ng progresibong aspekto.
  terminology: Ang “dalawang tapyas ng Patotoo,” “Bundok Sinai,” at “PANGINOON” sa talababa ay angkop. Ang “Patotoo” ay pinananatili bilang terminong malapit sa Hebreong עֵדוּת.
