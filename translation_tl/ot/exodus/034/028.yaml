  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: tl
  text: Naroon siya kasama ni Yahweh nang apatnapung araw at apatnapung gabi. Hindi siya kumain ng tinapay ni uminom ng tubig. At isinulat niya[a] sa mga tapyas ang mga salita ng tipan—ang sampung salita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at isinulat ni Yahweh,” sapagkat sa ibang bahagi ay kay Yahweh iniuugnay ang pagsulat sa mga tapyas (tingnan ang Exodo 34:1; Deuteronomio 10:4).
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, “ang sampung salita”; ayon sa nakaugaliang tawag, “ang Sampung Utos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa baybay-Filipino ang banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיְהִי שָׁם עִם
  choice: Naroon siya kasama ni
  rationale: Likas na Filipino ito para sa pahayag tungkol sa kinaroroonan at pakikisama, nang hindi nagdaragdag ng diwa na wala sa Hebreo.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: apatnapung araw at apatnapung gabi
  rationale: Tumpak at karaniwang salin ng parirala ng tagal.
- source_word: לֶחֶם לֹא אָכַל
  choice: Hindi siya kumain ng tinapay
  rationale: Pinananatili ang tiyak na pangngalang 'tinapay' sa halip na gawing pangkalahatang 'pagkain.'
- source_word: וּמַיִם לֹא שָׁתָה
  choice: ni uminom ng tubig
  rationale: Pinananatili ang paralelismo ng dalawang negatibong sugnay sa likas na anyong Filipino.
- source_word: וַיִּכְתֹּב
  choice: At isinulat niya
  rationale: Ang pandiwa ay ikatlong panauhang panlalaki na walang muling binanggit na simuno; pinananatili ng panghalip ang pormal na daloy at ang umiiral na kalabuan.
- source_word: עַל הַלֻּחֹת
  choice: sa mga tapyas
  rationale: '''Tapyas'' ang malinaw at karaniwang salin para sa mga tapyas na bato ng tipan; hindi inuulit ang ''bato'' dahil hindi ito tahasang nasa pariralang ito.'
- source_word: דִּבְרֵי הַבְּרִית
  choice: mga salita ng tipan
  rationale: Pinananatili ang ugnayang konstruktibo at ang bokabularyong pangtipan ng Hebreo.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: ang sampung salita
  rationale: Ito ang tuwirang kahulugan ng Hebreo at higit na lantad sa pinagmulang teksto kaysa sa tradisyonal na 'Sampung Utos.'
theological_decisions:
- issue: Ang simuno ng 'at isinulat niya'
  choice: Pinanatili ang panghalip na 'niya,' na sa agarang daloy ay likas na tumutukoy kay Moises.
  alternative: '''At isinulat ni Yahweh'''
  rationale: Hindi tahasang inuulit ng Hebreo ang simuno. Sa agarang balarila, si Moises ang nagpapatuloy na simuno, ngunit iniuugnay ng Exodo 34:1 at Deuteronomio 10:4 kay Yahweh ang pagsulat sa mga tapyas. Kaya pinananatili sa pangunahing teksto ang pang-ibabaw na balarila at inilalagay sa talababa ang tunay na tensiyon sa konteksto.
- issue: Pagpapakahulugan sa עֲשֶׂרֶת הַדְּבָרִים
  choice: ang sampung salita
  alternative: ang Sampung Utos
  rationale: Literal na 'ang sampung salita' ang Hebreo. Iniiwasang palitan sa pangunahing teksto ang mismong pananalita ng pinagmulang wika ng nakaugaliang interpretibong katawagan, habang ibinibigay pa rin ang pamilyar na tawag sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling sugnay at karaniwang bokabularyo, habang pinananatili ang kongkretong 'tinapay,' ang terminong 'tipan,' at ang literal na 'sampung salita.' Inilagay ang [a] kaagad sa pandiwang pinatutungkulan ng alternatibong pagbasa upang maging malinaw ang talababa.
