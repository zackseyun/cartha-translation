base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: tl
  text: Dalhin mo sa bahay ni Yahweh na iyong Diyos ang unang bahagi ng mga unang ani ng iyong lupa.[a] Huwag mong pakuluan ang batang kambing sa gatas ng ina nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “ang pinakamainam sa mga unang ani ng iyong lupa.”
    reason: Ipinahihiwatig ang posibleng pangkalidad na diwa ng רֵאשִׁית sa pariralang רֵאשִׁית בִּכּוּרֵי, samantalang pinananatili ng pangunahing teksto ang pangunahing temporal/partitive na diwa.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: ang pinakauna sa mga unang ani
  rationale: Pinananatili nito ang pag-uulit at diin ng Hebreo sa pagiging una, nang hindi ipinapalagay sa pangunahing teksto na kalidad lamang ang tinutukoy. Ang posibleng diwang ‘pinakamainam’ ay inilalahad sa talababa.
- source_word: אַדְמָתְךָ
  choice: ng iyong lupa
  rationale: Ang ‘lupa’ ay natural sa Filipino at tumutukoy rito sa lupang sinasaka na pinagmumulan ng ani.
- source_word: תָּבִיא
  choice: Dalhin mo
  rationale: Ang anyong pandiwa ay utos sa kontekstong legal. Ang tuwirang pautos ay malinaw at natural sa modernong Filipino.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: sa bahay ni Yahweh na iyong Diyos
  rationale: Pinananatili ng ‘bahay’ ang literal na larawan ng santuwaryo nang hindi gumagamit ng mas tiyak sa kasaysayang ‘templo’; isinasalin ang banal na pangalan bilang Yahweh.
- source_word: לֹא תְבַשֵּׁל
  choice: Huwag mong pakuluan
  rationale: Tumpak na ipinahahayag ng ‘pakuluan’ ang tiyak na paraan ng pagluluto sa pandiwang Hebreo at malinaw na naghahatid ng pagbabawal.
- source_word: גְּדִי
  choice: ang batang kambing
  rationale: Karaniwan at malinaw itong katawagan sa modernong Filipino para sa batang hayop na tinutukoy.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: sa gatas ng ina nito
  rationale: Natural na Filipino ito at pinananatili ang eksaktong ugnayan ng batang kambing sa sarili nitong ina.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang ‘Yahweh’ ay tuwirang transliterasyon at hindi pinapalitan ang pangalan ng isang titulo.
- issue: Diwa ng רֵאשִׁית sa pariralang רֵאשִׁית בִּכּוּרֵי
  choice: pinakauna
  alternative: pinakamainam
  rationale: Pangunahing pinananatili ang temporal na diwang ‘una,’ ngunit hindi itinatanggi ang posibleng pahiwatig na ito rin ang piling o pinakamainam na bahagi; kaya nakatala ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal ang himig. Ginamit ang tuwirang anyong pautos para sa wikang legal, ‘bahay’ sa halip na ‘templo’ upang maiwasan ang anakronismo, at payak na bokabularyong madaling maunawaan ng karaniwang mambabasa.
