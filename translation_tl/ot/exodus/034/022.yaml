translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “sanlinggo” upang malinaw na tukuyin ang yunit ng panahon at maiwasan ang kalituhan ng “linggo” bilang araw ng Linggo. Inilagay ang talababa sa pariralang may tunay na leksikal na alternatibo.
