base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: tl
  text: Ipagdiwang mo ang Pista ng mga Linggo, ang unang ani ng trigo, at ang Pista ng Pagtitipon sa pag-inog ng taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa katapusan ng taon.” Literal na tumutukoy ang pariralang Hebreo sa pag-inog o siklo ng taon.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: Pista
  rationale: Tumutukoy sa isang kapistahang panrelihiyon, lalo na sa kapistahang dinarayo; natural at marangal ang “Pista” sa modernong Filipino.
- source_word: שָׁבֻעֹת
  choice: mga Sanlinggo
  rationale: Pinananatili ang literal na pangalang Hebreo na “Weeks” sa halip na gumamit ng mas huling tradisyonal na pangalang “Pentecostes.”
- source_word: תַּעֲשֶׂה לְךָ
  choice: Ipagdiwang mo
  rationale: Ang literal na “gawin mo para sa iyo” ay isang idyoma para sa pagdaraos o pagtalima sa isang pista. Likas sa Filipino ang “ipagdiwang mo”; hindi hiwalay na isinalin ang לְךָ dahil magiging mabigat at hindi natural.
- source_word: בִּכּוּרֵי
  choice: ang mga unang bunga
  rationale: Tumutukoy sa unang ani o produktong inihahandog; malinaw at karaniwang mauunawaan ang “mga unang bunga.”
- source_word: קְצִיר חִטִּים
  choice: pag-aani ng trigo
  rationale: Natural na salin ng pariralang tumutukoy sa wheat harvest.
- source_word: הָאָסִיף
  choice: Pagtitipon
  rationale: Ipinapakita ang pagtipon o pag-iimbak ng ani at pinananatili bilang pangalan ng kapistahan.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: sa pag-inog ng taon
  rationale: Sinasalamin ang larawan ng pag-ikot o siklo ng taon nang hindi ito basta ipinapakahulugang huling araw ng kalendaryong taon.
