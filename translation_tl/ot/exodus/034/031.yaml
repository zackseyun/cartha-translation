  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: tl
  text: Ngunit tinawag sila ni Moises, at bumalik sa kanya si Aaron at ang lahat ng pinuno ng kapulungan, at nagsalita si Moises sa kanila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: tinawag sila
  rationale: Ang קרא na may אֶל ay tumutukoy sa pagtawag o pagharap ng pananalita sa kanila. Likas sa modernong Tagalog ang “tinawag sila” at hindi nito ipinahihiwatig ang mas mariing awtoridad ng “ipinatawag.”
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: bumalik sa kanya
  rationale: Pinananatili nito ang karaniwang diwa ng שׁוב na “bumalik” at ang direksiyong ipinahahayag ng אֵלָיו.
- source_word: הַנְּשִׂאִים
  choice: mga pinuno
  rationale: Ang נָשִׂיא dito ay mga kinikilalang lider ng sambayanan; malinaw at kasalukuyang Filipino ang “mga pinuno,” samantalang maaaring maging makaluma o mapanlinlang ang “mga prinsipe.”
- source_word: בָּעֵדָה
  choice: ng kapulungan
  rationale: Ang עֵדָה ay tumutukoy sa sama-samang pamayanan o kapulungang Israelita. Pinananatili ng “kapulungan” ang kolektibo at nagkakatipong diwa ng salita.
- source_word: וַיְדַבֵּר מֹשֶׁה אֲלֵהֶם
  choice: kinausap sila ni Moises
  rationale: Bagaman literal na “nagsalita si Moises sa kanila,” mas likas sa Tagalog ang “kinausap sila” at tumpak nitong ipinahahayag na sa kanila nakatuon ang pagsasalita.
- source_word: וַ (initial)
  choice: Ngunit
  rationale: Ipinagpapatuloy ng waw ang salaysay at, ayon sa konteksto ng naunang takot nilang lumapit, may banayad na pagsalungat na likas ipahayag sa Tagalog bilang “Ngunit.”
- source_word: וַ (before וַיָּשֻׁבוּ)
  choice: kaya
  rationale: Sa daloy ng salaysay, ang pagbabalik nila ang tugon sa pagtawag ni Moises. Ang “kaya” ay natural na nag-uugnay sa dalawang kilos nang hindi nagdaragdag ng bagong pangyayari.
