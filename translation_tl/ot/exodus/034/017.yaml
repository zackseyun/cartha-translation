  yaml_path: translation/ot/exodus/034/017.yaml
  text: You shall not make cast-metal gods for yourself[a].
translation:
  language: tl
  text: Huwag kang gagawa ng mga diyos na hinulma sa metal para sa iyong sarili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga diyos na binubo sa metal” o “mga diyos na yari sa tinunaw na metal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: mga diyos
  rationale: Ang pangmaramihang anyong construct ng אֱלֹהִים ay tumutukoy rito sa mga diyos na kinakatawan ng mga idolo. Pinananatili ng “mga diyos” ang kongkretong pananalita ng Hebreo sa halip na palitan agad ito ng “mga imahen” o “mga idolo.”
- source_word: מַסֵּכָה
  choice: hinulma sa metal
  rationale: Tumutukoy ang salita sa isang bagay na ginawa sa pamamagitan ng pagbubuhos ng tinunaw na materyal, lalo na ng metal. Ang “hinulma sa metal” ay malinaw at likas sa makabagong Filipino, habang pinananatili ang diwa ng materyal at paraan ng paggawa.
- source_word: לֹא תַעֲשֶׂה
  choice: Huwag kang gagawa
  rationale: Ang negasyon at ikalawang panauhang panlalaking isahan na pandiwa ay isang tuwirang pagbabawal. Ang “Huwag kang gagawa” ang natural na anyo ng ganitong utos sa Filipino.
- source_word: לָּךְ
  choice: para sa iyong sarili
  rationale: Ipinahihiwatig ng pang-ukol na may hulaping panghalip ang pansariling layunin o kapakinabangan. Tahasang naipapakita ito ng “para sa iyong sarili.”
theological_decisions:
- issue: Uri ng ipinagbabawal na bagay
  choice: mga diyos na hinulma sa metal
  alternative: mga imaheng binubo sa metal
  rationale: Pinagsasama ng Hebreo ang “mga diyos” at ang katawagang tumutukoy sa hinulma o binubong metal. Pinananatili ng salin ang dalawang sangkap nang hindi pinapaliit ang pagbabawal sa mga imahen lamang at nang hindi rin nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang anyo ng pagbabawal na “Huwag kang gagawa,” at ang “hinulma sa metal” upang maunawaan ng ordinaryong mambabasa ang paraan ng paggawa nang hindi nagdaragdag ng salitang “idolo” o “imahen” sa pangunahing teksto.
