revisions:
- from: At walang sinumang aakyat na kasama mo, at huwag ding may sinumang makita[a] saanman sa bundok; maging ang kawan at ang bakahan ay huwag manginain sa tapat ng bundok na iyon.
  to: At walang sinumang aakyat na kasama mo, at huwag ding makitang may sinuman[a] saanman sa bundok; maging ang kawan at ang mga baka ay huwag manginain sa tapat ng bundok na iyon.
  rationale: Inayos ang ikalawang pagbabawal upang malinaw na walang tao ang dapat makita o matagpuang naroon, sa halip na magmukhang pagbabawal sa kilos ng pagtingin. Pinalitan ang “bakahan” ng “mga baka” upang wasto nitong tukuyin ang בָּקָר bilang livestock. Hindi binago ang kahulugan o ang leksikal na ambigwidad ng Niphal; nananatili itong nakatala sa talababa.
