translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “sinuman” dahil walang gramatikal na kasarian ang katumbas na Tagalog at pangkalahatan ang saklaw ng אִישׁ sa konteksto. Pinanatili ang magkasunod na pagbabawal at ang diin ng וְגַם sa pamamagitan ng “ding.”
