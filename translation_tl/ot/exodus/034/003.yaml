  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: tl
  text: At walang sinumang aakyat na kasama mo, at huwag ding makitang may sinuman[a] saanman sa bundok; maging ang kawan at ang mga baka ay huwag manginain sa tapat ng bundok na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lumitaw.” Ang anyong Niphal ng pandiwang Hebreo ay maaaring mangahulugang “makita” o “lumitaw.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: sinuman
  rationale: Bagaman panlalaking isahan ang anyong Hebreo, pangkalahatan ang gamit nito rito at tumutukoy sa kahit sinong tao; likas at eksakto ang “sinuman” sa modernong Tagalog.
- source_word: יַעֲלֶה עִמָּךְ
  choice: aakyat na kasama mo
  rationale: Pinananatili nito ang kilos na paakyat sa bundok at ang ideya ng pagsama kay Moises.
- source_word: וְגַם
  choice: at … ding
  rationale: Ipinahahayag ng “ding” ang karagdagan at pagpapatindi ng ikalawang pagbabawal nang natural sa Tagalog.
- source_word: אַל יֵרָא
  choice: huwag … makita
  rationale: Ang Niphal ng ראה ay maaaring mangahulugang “makita” o “lumitaw.” Pinili ang “makita” sa teksto at pinanatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: בְּכָל הָהָר
  choice: saanman sa bundok
  rationale: Natural nitong ipinahahayag ang saklaw ng buong lugar ng bundok, hindi lamang ang kabuuan bilang isang bagay.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: ang kawan at ang bakahan
  rationale: Pinananatili ang pagkakaiba ng maliliit na alagang hayop na magkakawan at ng mga baka, nang hindi nililimitahan ang צֹאן sa mga tupa lamang.
- source_word: אַל יִרְעוּ
  choice: huwag manginain
  rationale: Ang רעה, kapag hayop ang simuno, ay tumutukoy sa panginginain; malinaw at karaniwan ang pandiwang Tagalog na ito.
- source_word: אֶל מוּל
  choice: sa tapat ng
  rationale: Ipinahahayag nito ang puwestong kaharap o nasa harapan ng bundok.
- source_word: הָהָר הַהוּא
  choice: bundok na iyon
  rationale: Tuwirang pinananatili ang pagtutukoy at distansiyang ipinahihiwatig ng demonstratibong Hebreo.
