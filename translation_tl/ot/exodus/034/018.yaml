  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: tl
  text: Ipagdiwang mo ang Pista ng Tinapay na Walang Pampaalsa[a]. Sa loob ng pitong araw ay kakain ka ng tinapay na walang pampaalsa, gaya ng iniutos ko sa iyo, sa takdang panahon sa buwan ng Abib[b]; sapagkat sa buwan ng Abib ay lumabas ka mula sa Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pagdiriwang ng Tinapay na Walang Pampaalsa.” Ang חַג ay tumutukoy sa isang pista o banal na itinakdang pagdiriwang.
    reason: lexical_alternative
  - marker: b
    text: Ang Abib ay sinaunang katawagan sa buwang nasa unang bahagi ng tagsibol at kaugnay ng paglabas mula sa Ehipto.
    reason: cultural_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Pista ng Tinapay na Walang Pampaalsa
  rationale: Ang חַג ay isang banal na pista o itinakdang pagdiriwang, at ang מַצּוֹת ay tinapay na hindi pinaalsa. Ang anyong ito ay malinaw, natural, at may bigat ng pormal na pangalan ng pagdiriwang.
- source_word: תִּשְׁמֹר
  choice: Ipagdiwang mo
  rationale: Sa konteksto ng isang pistang iniutos sa tipan, ang שׁמר ay nangangahulugang tuparin o sundin ang pagdiriwang. Mas natural sa modernong Tagalog ang “Ipagdiwang mo” kaysa sa literal na “Ingatan mo,” nang hindi inaalis ang lakas ng utos.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Sa loob ng pitong araw ay kakain ka ng tinapay na walang pampaalsa
  rationale: Pinananatili nito ang pitong-araw na tagal at ang ipinag-uutos na pagkain, habang ginagamit ang kolektibong anyong natural sa Tagalog.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: gaya ng iniutos ko sa iyo
  rationale: Ipinahahayag nito ang paghahambing o pagtukoy sa naunang utos nang malinaw at hindi dinaragdagan ang saklaw nito.
- source_word: לְמוֹעֵד
  choice: sa takdang panahon
  rationale: Ang מוֹעֵד ay tumutukoy sa itinakdang oras o panahon, lalo na para sa banal na pagdiriwang. Ang “takdang panahon” ay maikli at natural.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: buwan ng Abib
  rationale: Pinananatili ang sinaunang pangalan o katawagan sa buwan sa halip na tumbasan ito ng isang makabagong buwan na hindi lubos na katumbas.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikita ng כִּי ang dahilan ng utos; ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: lumabas ka mula sa Ehipto
  rationale: Direktang pinananatili nito ang diwa ng יצא at ng pang-ukol מִן, pati ang kolektibong isahang kausap sa Hebreo.
theological_decisions:
- issue: Katawagan sa pistang itinakda sa tipan
  choice: Gamitin bilang pormal na pamagat ang “Pista ng Tinapay na Walang Pampaalsa.”
  alternative: “pagdiriwang ng tinapay na walang pampaalsa”
  rationale: Ang pormal na anyo ay nagpapanatili sa banal at itinakdang katangian ng חַג nang hindi nagdaragdag ng doktrinang wala sa talata.
- issue: Isahang ikalawang panauhan para sa Israel
  choice: Panatilihin ang isahang “mo/ka/sa iyo.”
  alternative: Gawing maramihan o tahasang idagdag ang “Israel.”
  rationale: Isahang panlalaki ang anyo sa Hebreo at maaaring kumatawan sa Israel bilang isang sambayanan. Pinananatili ng salin ang anyong ito at hindi nagpapasok ng dagdag na pangngalan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “pista,” “takdang panahon,” at “sapagkat” upang mapanatili ang bigat ng utos nang hindi maging lipas o teknikal. Parehong nakalagay sa pangunahing teksto ang mga panandang [a] at [b].
