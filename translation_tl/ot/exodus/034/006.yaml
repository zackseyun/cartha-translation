base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: tl
  text: 'Pagkatapos, dumaan si Yahweh sa harapan niya at nagpahayag: “Yahweh, Yahweh, isang Diyos na mahabagin at mapagbiyaya, hindi madaling magalit, at sagana sa tapat na pag-ibig at katapatan.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sagana sa tapat na pag-ibig at katotohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיַּעֲבֹר
  choice: dumaan
  rationale: Tumutukoy ang pandiwa sa pagdaan sa harapan ng isang tao; payak at natural ang “dumaan” sa Filipino.
- source_word: עַל פָּנָיו
  choice: sa harapan niya
  rationale: Idyomatikong katumbas ito ng literal na “sa ibabaw/harap ng kanyang mukha” at malinaw na naghahayag ng ugnayang panlunan.
- source_word: וַיִּקְרָא
  choice: ipinahayag
  rationale: Ang konteksto ay isang maringal na pagpapahayag ng pangalan at katangian ng Diyos, hindi lamang karaniwang pagtawag.
- source_word: אֵל
  choice: isang Diyos
  rationale: Gumaganap itong paglalarawang apposisyon kasunod ng inuulit na pangalan at nagpapakilala sa talaan ng mga katangian.
- source_word: רַחוּם
  choice: mahabagin
  rationale: Naghahayag ito ng malalim na habag at awa; ang “mahabagin” ay natural, dignificado, at madaling maunawaan.
- source_word: חַנּוּן
  choice: mapagbigay-loob
  rationale: Ipinapahiwatig nito ang kusang pagkakaloob ng pabor o biyaya nang hindi umaasa sa teknikal na pananalitang panrelihiyon.
- source_word: אֶרֶךְ אַפַּיִם
  choice: hindi madaling magalit
  rationale: Ito ang natural na katumbas sa Filipino ng idyomang Hebreo na literal na “mahaba ang mga butas ng ilong,” ibig sabihin ay hindi mabilis magalit.
- source_word: רַב
  choice: sagana sa
  rationale: Kapag kasama ng mga abstraktong pangngalan, naghahayag ito ng kasaganaan o lubos na pag-iral ng mga katangiang binanggit.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Pinagsasama nito ang pag-ibig, kabutihan, at matatag na katapatan sa isang ugnayan; naipahahayag ng “tapat na pag-ibig” ang pagmamahal at pananatili nito.
- source_word: אֱמֶת
  choice: katapatan
  rationale: Sa tambalang חֶסֶד וֶאֱמֶת, binibigyang-diin nito ang pagiging maaasahan at tapat ng Diyos; pinananatili sa talababa ang posibleng kahulugang “katotohanan.”
theological_decisions:
- issue: Pag-uulit sa banal na pangalang יְהוָה
  choice: Si Yahweh, si Yahweh
  alternative: Ang PANGINOONG Diyos
  rationale: Inuulit ng Hebreo ang personal na pangalan para sa diin. Hindi ito pinapakinis o pinapalitan ng isang titulo, at hindi isinasama nang maaga ang אֵל na sumusunod bilang paglalarawan.
- issue: Kahulugan ng אֱמֶת sa pares na חֶסֶד וֶאֱמֶת
  choice: katapatan
  alternative: katotohanan
  rationale: Mas angkop sa konteksto ng maaasahang katangian ng Diyos ang “katapatan,” ngunit tunay ding leksikal na posibilidad ang “katotohanan,” kaya inilalahad iyon sa talababa upang mapanatili ang kalabuan ng pinagmulan.
translation_notes:
  register: Makabago, dignificado, at madaling maunawaang Filipino. Ginamit ang “hindi madaling magalit” bilang likas na idyoma at ang “mapagbigay-loob” upang maipahayag ang kusang pagbibigay ng pabor nang hindi masyadong teknikal. Inilagay ang panandang [a] pagkatapos ng “katapatan,” ang salitang may leksikal na alternatibo.
