  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: tl
  text: Mag-ingat ka[a], baka makipagtipan ka[b] sa mga naninirahan sa lupaing pupuntahan mo[c], baka ito'y maging bitag[d] sa gitna mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Bantayan mong mabuti ang iyong sarili” o “Magpakaingat ka.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “pumutol ng tipan,” isang idyomang nangangahulugang gumawa o makipagtipan.
    reason: lexical_alternative
  - marker: c
    text: O “lupaing papasukin mo.”
    reason: lexical_alternative
  - marker: d
    text: O “silo.” Ang larawan ay tumutukoy sa isang bagay na maaaring makasilo o magdala sa iyo sa kapahamakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Likas na babala sa modernong Tagalog; naipahihiwatig ng pandiwang may panghalip ang reflexive na diin ng Hebreo nang hindi gumagamit ng alanganing literal na anyo.
- source_word: פֶּן
  choice: baka
  rationale: Ipinapahayag ng “baka” ang negatibong babala o pangyayaring dapat iwasan, at natural itong maulit sa diwa ng pangungusap.
- source_word: תִּכְרֹת בְּרִית
  choice: makipagtipan ka
  rationale: Ang literal na “pumutol ng tipan” ay idyomang Hebreo. Ang “makipagtipan” ay malinaw at natural sa Tagalog at pinananatili ang pormal na ugnayang tinutukoy.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: sa mga naninirahan sa lupain
  rationale: Bagaman isahan ang participle sa Hebreo, kolektibo ang gamit nito; ang maramihang Tagalog ang malinaw na katumbas.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: lupaing pupuntahan mo
  rationale: Natural na ipinapahayag ang pagkilos patungo sa lupaing papasukin ng Israel, habang inilalagay sa talababa ang mas tahasang alternatibong “papasukin.”
- source_word: יִהְיֶה
  choice: ang tipang iyon ay maging
  rationale: Nililinaw ang pinakamalapit at pinakanatural na antecedent ng pandiwang isahan—ang tipan—nang hindi binabago ang babala.
- source_word: לְמוֹקֵשׁ
  choice: isang bitag
  rationale: Ang “bitag” ay karaniwan at malinaw na modernong Tagalog para sa literal at metaporikal na panganib ng מוֹקֵשׁ.
- source_word: בְּקִרְבֶּךָ
  choice: sa gitna ninyo
  rationale: Bagaman morpolohikal na isahan ang ikalawang panauhan, kolektibong Israel ang kinakausap; pinananatili ng parirala ang pangkomunidad na diwa at iniiwasang gawing panloob o sikolohikal.
theological_decisions:
- issue: Tinutukoy ng huling pandiwang isahan at ng “bitag”
  choice: Ang tipan sa mga naninirahan sa lupain ang magiging bitag.
  alternative: Ang mga naninirahan mismo, o ang buong kalagayan, ang magiging bitag.
  rationale: Ang “tipan” ang pinakamalapit at pinakaangkop na antecedent sa balarila at sa konteksto. Gayunman, hindi dinaragdagan ang teksto ng paliwanag tungkol sa tiyak na paraan ng pagkakasilo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “makipagtipan” bilang pamilyar na salitang biblikal at legal, at “bitag” bilang mas kasalukuyang salita kaysa “silo.” Ang isahang kausap na “ka/mo” ay pinanatili sa utos, samantalang “ninyo” sa “sa gitna ninyo” ay nagpapakita ng kolektibong bayang kinakatawan ng kausap.
