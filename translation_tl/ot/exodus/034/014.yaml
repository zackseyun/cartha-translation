  rationale: Pinalitan ang di-gaanong likas na “huwag kang yuyukod” ng “hindi ka dapat yumukod,” at inihanay ang alternatibong salin sa talababa sa anyong pagbabawal. Pinanatili ang lahat ng mahahalagang katumbas, ang retorikal na pag-uulit ng “mapanibughuin,” ang banal na pangalang Yahweh, at ang mga umiiral na angkla ng talababa.
