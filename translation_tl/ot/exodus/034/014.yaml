  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: tl
  text: Sapagkat hindi ka dapat yumukod sa ibang diyos,[a] sapagkat si Yahweh—Mapanibughuin ang kanyang pangalan[b]—ay Diyos na mapanibughuin.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Hindi ka dapat sumamba sa ibang diyos.” Literal na tumutukoy ang pandiwang Hebreo sa pagyukod o pagpapatirapa, madalas bilang pagsamba.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “sapagkat si Yahweh—Mapanibughuin ang kanyang pangalan—ay Diyos na mapanibughuin.”'
    reason: lexical_alternative
  - marker: c
    text: Ang “mapanibughuin” dito ay tumutukoy sa natatanging pag-angkin ni Yahweh sa katapatan at pagsamba ng kanyang bayang nakipagtipan sa kanya, hindi sa makasalanang inggit.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: yuyukod
  rationale: Tumutukoy ang pandiwa sa literal na pagyukod o pagpapatirapa, madalas bilang pagsamba. Pinananatili ng “yuyukod” ang kongkretong kilos habang malinaw sa konteksto ang kahulugan nitong pagsamba.
- source_word: לְאֵל אַחֵר
  choice: sa ibang diyos
  rationale: Tuwirang katumbas ito ng “sa ibang diyos”; hindi ipinapalagay ng אַחֵר na banyaga ang diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang personal na pangalang banal sa halip na palitan iyon ng isang titulo.
- source_word: קַנָּא
  choice: Mapanibughuin / mapanibughuin
  rationale: Ipinahahayag nito ang natatanging pag-angkin ni Yahweh sa pagsamba ng kanyang bayan at ang hindi niya pagtanggap sa mga karibal. Ginamit ang malaking titik kapag nagsisilbi itong pangalan o katawagan.
- source_word: שְׁמוֹ
  choice: ang kanyang pangalan
  rationale: Pinananatili nito ang tahasang pahayag ng Hebreo na ang “Mapanibughuin” ay pangalan o katawagan niya.
- source_word: אֵל קַנָּא הוּא
  choice: ay Diyos na mapanibughuin
  rationale: Pinananatili nito ang pag-uulit at ipinapaliwanag ang naunang katawagang “Mapanibughuin.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang ipinahayag na personal na pangalan.
- issue: Ang קַנָּא bilang banal na pangalan at katangian
  choice: Mapanibughuin / mapanibughuin
  alternative: Masigasig / masigasig
  rationale: Inilalarawan ng salita ang eksklusibong pag-angkin ng Diyos sa katapatan at pagsamba ng kanyang bayan. Pinananatili rin nito ang sadyang pag-uulit ng Hebreo nang hindi pinapalambot ang tensiyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang “yuyukod” upang mapanatili ang kongkretong larawan ng Hebreo, at “mapanibughuin” upang mapanatili ang teolohikal na diin at pag-uulit ng talata.
