reference: Exodus 34:7
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: tl
  text: na nagpapanatili ng tapat na pag-ibig sa libu-libo[a], nagpapatawad ng kasamaan, paghihimagsik, at kasalanan, ngunit tiyak na hindi niya pinawawalang-sala ang may-sala[b]; dinadalaw niya ang kasamaan ng mga ama[c] sa kanilang mga anak at sa mga anak ng kanilang mga anak, hanggang sa ikatlo at ikaapat na salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang libong salinlahi.” Ang Hebreo ay literal na “sa libu-libo”; malamang na inihahambing nito ang matagal na tapat na pag-ibig ng Diyos sa paghatol “hanggang sa ikatlo at ikaapat na salinlahi.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “tiyak na hindi niya hahayaang walang parusa” o “tiyak na hindi niya pawawalang-sala.” Mariin ang pagkakabuo ng parirala sa Hebreo.
    reason: lexical_alternative
  - marker: c
    text: “Mga ama” ang tahasang panlalaking salita sa Hebreo; pinanatili ito rito, bagaman ang pahayag ay tungkol sa pagbaba ng mga bunga sa magkakasunod na salinlahi.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: nagpapanatili
  rationale: Ipinahahayag ng Qal participle ang patuloy na pag-iingat o pagpapanatili; natural sa modernong Tagalog ang “nagpapanatili” sa pormulang ito.
- source_word: חֶסֶד
  choice: tapat na pag-ibig
  rationale: Pinananatili nito kapwa ang diwa ng pag-ibig at matatag na katapatan na taglay ng terminong Hebreo.
- source_word: לָאֲלָפִים
  choice: sa libu-libo
  rationale: Ang Hebreo ay nagsasabi lamang ng “sa/para sa libu-libo” at hindi tahasang naglalagay ng “salinlahi”; hindi ito dinagdagan sa pangunahing teksto.
- source_word: נֹשֵׂא
  choice: nagpapatawad
  rationale: Bagaman literal na “nagdadala,” ang pandiwa kasama ng mga katawagan sa kasalanan ay idyomatikong tumutukoy sa pagpapatawad.
- source_word: עָוֺן
  choice: kasamaan
  rationale: Saklaw nito ang baluktot na gawang moral at maaari ring magpahiwatig ng pananagutan o bunga nito; “kasamaan” ang malinaw at marangal na katumbas sa Tagalog.
- source_word: פֶשַׁע
  choice: paghihimagsik
  rationale: Masasalamin nito ang diwa ng sadyang pagsuway o paglabag sa katapatan, hindi lamang pangkalahatang pagkakamali.
- source_word: חַטָּאָה
  choice: kasalanan
  rationale: Ito ang tuwiran at karaniwang katumbas, at binubuo nito ang tatluhang paglalarawan ng kasalanan.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: ngunit tiyak na hindi nagpapawalang-sala
  rationale: Ang infinitive absolute kasama ng finite verb ay nagbibigay-diin sa pagtanggi. Ang “nagpapawalang-sala” ay nagpapanatili sa hudisyal na larawan nang hindi tahasang nagdaragdag ng layon na wala sa Hebreo.
- source_word: פֹּקֵד
  choice: dinadalaw
  rationale: Pinananatili nito ang malawak at sadyang bukas na diwa ng פקד sa konteksto ng paghatol, sa halip na paliitin agad sa “pinarurusahan.”
- source_word: עֲוֺן אָבוֹת
  choice: ang kasamaan ng mga ama
  rationale: Tiyak na panlalaki ang אָבוֹת, kaya pinanatili ang “mga ama,” habang ang tala ay nililinaw ang saklaw na salinlahi.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: sa kanilang mga anak at sa mga anak ng kanilang mga anak
  rationale: Natural itong nagpapahayag ng sunod-sunod na lahi at hindi nililimitahan ang tinutukoy sa mga lalaking anak lamang.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: hanggang sa ikatlo at ikaapat na salinlahi
  rationale: Ipinahihiwatig ng konteksto ng pamilya ang “salinlahi,” kaya idinagdag ito para sa malinaw at likas na Tagalog.
theological_decisions:
- issue: Ang tensiyon sa pagitan ng pagpapatawad ng Diyos at ng kaniyang katarungan
  choice: Pinanatili ang buong pahayag ng pagpapatawad at ang mariing pagtangging magpawalang-sala.
  alternative: “ngunit tiyak na hindi niya pinalalampas nang walang parusa”
  rationale: Sadyang magkatabi sa talata ang awa at katarungan. Hindi pinalambot ang alinman, at pinanatili ang hudisyal na talinghaga ng נקה.
- issue: Kung idaragdag ang “mga salinlahi” pagkatapos ng “libu-libo”
  choice: Hindi idinagdag sa pangunahing teksto.
  alternative: “sa isang libong salinlahi” o “sa libu-libong salinlahi”
  rationale: Walang tahasang salitang “salinlahi” sa pariralang ito sa Exodo 34:7. Ang posibleng generasyonal na kahulugan ay inilagay lamang sa talababa.
- issue: Kung ang pagdalaw sa kasamaan ng mga ama ay tuwirang isasalin bilang pagpaparusa sa mga anak
  choice: Pinanatili ang bukas na pandiwang “dinadalaw.”
  alternative: “ipinapataw ang parusa dahil sa kasamaan ng mga ama”
  rationale: Mas malawak ang saklaw ng פקד kaysa sa payak na “parusahan.” Pinananatili ng salin ang tunay na bigat at tensiyon ng pahayag nang hindi nagdaragdag ng paliwanag na doktrinal.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang anyong nagpapatuloy mula sa naunang talata sa pamamagitan ng panimulang “na.” Iniwasan ang arkaikong bokabularyo at ang labis na pagpapaliwanag sa pangunahing teksto.
