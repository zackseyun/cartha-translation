  verdict: revise
  source_fidelity: Tumpak na naipapahayag ng salin ang pagpapanatili ng tapat na pag-ibig, ang tatluhang pagpapatawad, at ang pagdalaw ng kasamaan sa mga salinlahi. Gayunman, ang “tiyak na hindi nagpapawalang-sala” ay walang malinaw na tagaganap o layon sa Tagalog at maaaring magmukhang hindi ganap na pangungusap. Ang “ang may-sala” ay isang ligtas na paglilinaw ng ipinahihiwatig na layon ng hudisyal na Hebreong pahayag, nang hindi binabago ang saklaw nito.
  naturalness: Marangal at natural sa modernong Filipino Tagalog ang kabuuang daloy. Ang pagdaragdag ng “niya” at “ang may-sala” sa sugnay na hudisyal ay kinakailangan upang maging malinaw at likas ang pangungusap.
  terminology: Ang “tapat na pag-ibig,” “paghihimagsik,” “kasalanan,” “mga ama,” at “salinlahi” ay angkop at magkakatugma. Ang “dinadalaw” ay wastong bukas na katumbas ng פקד at hindi nagpapataw ng mas makitid na pagbasa na “pinarurusahan.”
