  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: tl
  text: Tatlong beses sa isang taon, dapat humarap ang lahat ng inyong kalalakihan sa harap[a] ng Panginoong Yahweh[b], ang Diyos ng Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “sa harap ng mukha ng”; ang idyoma ay nangangahulugang “sa harap” o “sa presensiya ng.”
    reason: lexical_alternative
  - marker: b
    text: 'Magkaibang salita ang ginamit sa Hebreo: “Panginoon” (ha’adon), isang titulo, at “Yahweh” (YHWH), ang banal na pangalan. Sa ilang salin, ang kabuuang parirala ay “Panginoong DIYOS.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Tatlong beses sa isang taon
  rationale: Likas at tuwirang ipinapahayag nito sa modernong Tagalog ang dalas sa loob ng taunang siklo.
- source_word: יֵרָאֶה
  choice: dapat humarap
  rationale: Sa kontekstong ito, ang Niphal ng ראה ay nakaugaliang pahayag tungkol sa pagharap o pagpapakita sa presensiya ng Diyos. Ipinapakita ng “dapat” ang bisa nito bilang kautusang pangtipan, samantalang natural sa Tagalog ang “humarap.”
- source_word: כָּל זְכוּרְךָ
  choice: ang lahat ng lalaki sa inyo
  rationale: Pinananatili nito ang tahasang pagtukoy ng Hebreo sa mga lalaki, ngunit mas natural ito sa Tagalog kaysa sa literal na “lahat ng iyong mga lalaki.”
- source_word: אֶת פְּנֵי
  choice: sa harap
  rationale: Karaniwang idyoma ito para sa pagharap sa presensiya ng isang tao. Ang “sa harap” ay malinaw at natural, habang itinatala sa talababa ang literal na larawang “mukha.”
- source_word: הָאָדֹן
  choice: Panginoon
  rationale: Ang אָדוֹן na may pantukoy ay isang banal na titulo rito. Ang “Panginoon” ang likas at marangal na katumbas sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isa pang titulong “PANGINOON.”
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Malinaw at karaniwang anyo ito sa Tagalog para sa construct chain na kumikilala kay Yahweh bilang Diyos ng Israel.
theological_decisions:
- issue: Paglalahad sa banal na pangalan יְהוָה kasunod ng titulong הָאָדֹן
  choice: Panginoong Yahweh
  alternative: Panginoong DIYOS / Makapangyarihang PANGINOON
  rationale: Magkaiba ang banal na titulo at ang personal na pangalan sa Hebreo. Pinananatili ng “Panginoong Yahweh” ang dalawang sangkap nang hindi inuulit o pinagsasama ang mga ito sa iisang titulo.
- issue: Tahasan ang kasarian ng mga inuutusang dumalo
  choice: lahat ng lalaki sa inyo
  alternative: lahat sa inyo / lahat ng inyong mga tao
  rationale: Ang זָכוּר ay tahasang tumutukoy sa mga lalaki. Hindi ito ginawang neutral upang mapanatili ang saklaw ng kautusan sa pinagmulang teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “dapat humarap” bilang natural na wikang legal at panrelihiyon; iniwasan ang labis na literal ngunit alanganing “magpakita.”
