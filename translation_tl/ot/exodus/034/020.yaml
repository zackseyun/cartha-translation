base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: tl
  text: Tutubusin mo ang panganay na asno sa pamamagitan ng isang tupa o kambing[a]. Ngunit kung hindi mo ito tutubusin, babaliin mo ang leeg nito. Bawat panganay mong anak na lalaki ay tutubusin mo. Walang haharap sa akin nang walang dalang handog.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo ay tumutukoy sa isang hayop mula sa kawan—maaaring tupa o kambing.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nang walang dala” o “walang laman.” Sa kontekstong ito, nangangahulugang hindi dapat humarap nang walang handog.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: panganay na asno
  rationale: Ang פֶטֶר ay literal na unang nagbubukas ng sinapupunan; sa kontekstong legal, likas at maikli sa Tagalog ang “panganay na asno.”
- source_word: תִּפְדֶּה
  choice: tutubusin ninyo
  rationale: Ang פדה sa kontekstong legal at pangkulto ay pagtubos sa pamamagitan ng kapalit o bayad; pinananatili ng “tubusin” ang diwang ito.
- source_word: בְשֶׂה
  choice: sa pamamagitan ng isang tupa o kambing
  rationale: Ang שֶׂה ay isang hayop mula sa kawan at maaaring tupa o kambing; ang tahasang dobleng katawagan ay nagpapanatili sa lawak ng salitang Hebreo.
- source_word: וַעֲרַפְתּוֹ
  choice: babaliin ninyo ang leeg nito
  rationale: Ang ערף ay tumutukoy sa pagbalì ng leeg, kaya ito ang tuwiran at likas na salin.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: bawat panganay sa inyong mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng בָּנֶיךָ, kaya hindi ito ginawang pangkalahatang “mga anak.”
- source_word: יֵרָאוּ פָנַי
  choice: haharap sa akin
  rationale: Literal itong “makikita sa harap ng aking mukha,” ngunit idyoma ito para sa pagharap sa presensiya ng Diyos; natural sa Tagalog ang “haharap sa akin.”
- source_word: רֵיקָם
  choice: nang walang dalang handog
  rationale: Literal na “walang dala” o “walang laman,” ngunit sa konteksto ng pagsamba ay tumutukoy sa hindi pagharap nang walang handog; nilinaw ito sa teksto at itinabi sa talababa ang literal na idyoma.
theological_decisions:
- issue: Ang banal na unang panauhan sa יֵרָאוּ פָנַי
  choice: haharap sa akin
  alternative: makikita sa harap ng aking mukha / haharap sa aking presensiya
  rationale: Pinananatili nito ang tuwirang pananalita ng Diyos at inililipat nang natural ang idyomang Hebreo nang hindi nagdaragdag ng teolohikal na pakahulugan.
- issue: Kasariang tinutukoy ng בָּנֶיךָ
  choice: inyong mga anak na lalaki
  alternative: inyong mga anak
  rationale: Tahasang panlalaki ang salitang Hebreo, kaya pinanatili ang sanggunian sa mga anak na lalaki.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang maramihang “ninyo” bilang natural na pagtukoy sa bayang kinakausap sa kautusan, bagaman isahan ang anyong Hebreo. Pinanatili ang legal na tono sa mga pandiwang panghinaharap na may puwersang pautos.
