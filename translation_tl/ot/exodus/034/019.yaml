  source_fidelity: Ang pangunahing kahulugang Hebreo—ang pag-aangkin ng Diyos sa bawat unang supling at sa mga lalaking panganay ng alagang hayop—ay naipapahayag. Gayunman, ang “panganay na nagbubukas” ay hindi likas na Filipino at hindi maayos na naghahatid ng idyomang פֶּטֶר רֶחֶם. Ang kasunod na paglilinaw na “baka man o tupa” ay mas malinaw kung tuwirang iuugnay sa mga panganay na hayop.
  naturalness: Marangal at nauunawaan ang rehistro, ngunit mas natural ang “unang supling na lumalabas sa sinapupunan” kaysa “panganay na nagbubukas ng sinapupunan.” Ang “ng baka o tupa” ay mas tuwiran kaysa “baka man o tupa” sa ganitong legal na pahayag.
  terminology: Ang “sinapupunan,” “alagang hayop,” at “lalaking panganay” ay angkop sa modernong Filipino Tagalog at sa saklaw ng Hebreo. Pinananatili ng “Akin” ang tahasang pag-aangkin sa לִי nang walang idinagdag na doktrinal na paliwanag.
