  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: tl
  text: Akin ang bawat unang supling na lumalabas sa sinapupunan[a], at ang bawat lalaking panganay ng iyong mga alagang hayop[b]—ng baka o tupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bawat nagbubukas ng sinapupunan,” isang idyoma para sa unang supling.
    reason: lexical_alternative
  - marker: b
    text: Eliptiko ang Hebreo; tumutukoy ito sa mga lalaking unang supling ng alagang hayop, gaya ng baka at tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: bawat panganay na nagbubukas ng sinapupunan
  rationale: Pinananatili nito ang larawan ng Hebreong idyoma—ang unang supling na lumalabas sa sinapupunan—habang malinaw na tinutukoy ang panganay.
- source_word: לִי
  choice: Akin ang
  rationale: Likas at maikli itong pagpapahayag ng pag-aangkin o pagmamay-ari ng PANGINOON.
- source_word: מִקְנְךָ
  choice: iyong mga alagang hayop
  rationale: Saklaw ng salita ang mga hayop na pag-aari at inaalagaan, kapuwa mula sa kawan at sa bakahan.
- source_word: תִּזָּכָר
  choice: panganay na lalaki
  rationale: Sa legal na kontekstong ito, ang anyo ng זכר ay tumutukoy sa pagiging lalaki ng supling; isinama ang “panganay” mula sa kasunod na pariralang פֶּטֶר שׁוֹר וָשֶׂה upang maging malinaw ang eliptikong Hebreo.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: baka man o tupa
  rationale: Natural na ipinapakita sa Filipino ang dalawang uring binanggit bilang pagpapaliwanag sa mga alagang hayop na saklaw.
theological_decisions:
- issue: Pag-aangkin ng Diyos sa mga panganay
  choice: Tahasang sinasabing “Akin” ang mga panganay, nang hindi dinaragdagan ng paliwanag tungkol sa pagtatalaga o paghahain.
  alternative: Isalin nang mas tahasan bilang “nakatalaga sa akin” o “dapat ihandog sa akin.”
  rationale: Pagmamay-ari o pag-aangkin ang tahasang ipinapahayag ng לִי; ang mas espesipikong ideya ng pagtatalaga o paghahain ay hindi dapat ipasok sa talatang ito.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “sinapupunan” para sa dignidad at katumpakan, at “mga alagang hayop” bilang karaniwang salitang sumasaklaw sa baka at tupa.
