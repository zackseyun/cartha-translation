  text: כִּ֤י אֶת מִזְבְּחֹתָ/ם֙ תִּתֹּצ֔וּ/ן וְ/אֶת מַצֵּבֹתָ֖/ם תְּשַׁבֵּר֑וּ/ן וְ/אֶת אֲשֵׁרָ֖י/ו תִּכְרֹתֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: tl
  text: Sa halip[a], gibain ninyo ang kanilang mga altar, durugin ang kanilang mga sagradong haligi, at putulin ang kanilang mga poste ni Ashera.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Sapagkat gibain ninyo ang kanilang mga altar…” Maaari ring isalin na “sapagkat” ang Hebreong pang-ugnay, ngunit sa kontekstong ito ay natural itong nagpapakita ng salungat na dapat gawin matapos ang naunang pagbabawal.
    reason: lexical_alternative
  - marker: b
    text: Hebreo, “kanilang mga Asherim.” Tumutukoy ang salita sa mga kultikong bagay na kaugnay ng diyosang si Ashera.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sa halip
  rationale: Sa konteksto, ipinakikita ng pang-ugnay ang dapat nilang gawin bilang kabaligtaran ng ipinagbabawal sa naunang talata. Nananatili sa talababa ang posibleng karaniwang kahulugang “sapagkat.”
- source_word: מִזְבְּחֹתָם
  choice: kanilang mga altar
  rationale: Karaniwan at malinaw na katawagan sa mga dambanang ginagamit sa pagsamba; pinananatili ang maramihan at ang panghalip na paari.
- source_word: תִּתֹּצוּן
  choice: gibain ninyo
  rationale: Likas na pandiwa sa Filipino para sa pagbuwag o pagpapabagsak ng isang estruktura gaya ng altar.
- source_word: מַצֵּבֹתָם
  choice: kanilang mga sagradong haligi
  rationale: Ang מַצֵּבָה ay nakatayong bato o haliging may gamit sa kulto. Nililinaw ng “sagrado” ang gamit nito nang hindi ito itinuturing na karaniwang haligi lamang.
- source_word: תְּשַׁבֵּרוּן
  choice: durugin
  rationale: Ipinahihiwatig ng masidhing anyo ng pandiwa ang marahas at ganap na pagbasag; natural itong ipares sa mga batong haligi.
- source_word: אֲשֵׁרָיו
  choice: kanilang mga poste ni Ashera
  rationale: Tumutukoy ito sa mga kultikong bagay na kaugnay ng diyosang si Ashera. Ipinahihiwatig ng kasunod na pandiwang “putulin” na malamang na yari sa kahoy ang mga ito.
- source_word: תִּכְרֹתוּן
  choice: putulin
  rationale: Tuwirang inilalarawan ang pagputol sa mga kultikong bagay, na malamang ay mga poste o kahoy na sagisag.
theological_decisions:
- issue: Tinutukoy ng אֲשֵׁרָיו
  choice: mga kultikong bagay na kaugnay ni Ashera, isinaling “mga poste ni Ashera”
  alternative: “mga Asherim” o “mga imahen ni Ashera”
  rationale: Nakalista ang mga pisikal na bagay na dapat wasakin, at ang pandiwang “putulin” ay nagpapahiwatig ng mga bagay na yari sa kahoy. Pinananatili ng salin ang malinaw na kaugnayan ng mga ito sa pangalang Ashera nang hindi ipinapalagay na ang diyosa mismo ang literal na pinuputol.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang maramihang utos na “ninyo” upang ipakita na ang Israel bilang bayan ang kinakausap. Ang “altar” ay higit na karaniwan sa modernong gamit kaysa “dambana” para sa partikular na kultikong estrukturang tinutukoy rito.
