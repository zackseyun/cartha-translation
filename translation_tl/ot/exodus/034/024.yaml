    issue: Ang “umahon ka” ay hindi ang pinakalikas na pagpili sa modernong Filipino sa konteksto ng paglalakbay-pagsamba.
    rationale: Bagaman mauunawaan ito, ang “umaakyat ka” ang mas karaniwan at tuwirang katumbas ng עלה (“go up/ascend”) sa ganitong konteksto.
  - severity: medium
    issue: Ang talababa a ay nagsasabing ang sinuman ay maaaring “maghangad na agawin” ang lupain at tinutukoy ang “mga Israelita.”
    rationale: Ang חמד ay “mag-imbot/maghangad,” hindi kinakailangang maghangad na agawin. Hindi rin tahasang binabanggit sa talata ang “mga Israelita”; mas mabuting ipaliwanag lamang ang kinatawang gamit ng panlalaking isahan nang hindi nagdaragdag ng detalye.
  - severity: low
    issue: Ang talababa b ay maaaring ipahayag nang mas tumpak ang literal na anyo at idyomatikong diwa.
    rationale: Ang literal na parirala ay “makita ang mukha ni Yahweh,” samantalang ang diwa sa konteksto ng paglalakbay-pagsamba ay “humarap kay Yahweh.”
