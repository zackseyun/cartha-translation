revisions:
- from: Sapagkat palalayasin ko ang mga bansa sa harap mo at palalawakin ko ang iyong mga hangganan. Walang sinumang[a] mag-iimbot sa iyong lupain kapag umahon ka upang humarap kay Yahweh na iyong Diyos[b] nang tatlong beses bawat taon.[c]
  to: Sapagkat palalayasin ko ang mga bansa sa harap mo at palalawakin ko ang iyong mga hangganan. Walang sinumang[a] mag-iimbot sa iyong lupain kapag umaakyat ka upang humarap kay Yahweh na iyong Diyos[b] nang tatlong beses bawat taon.[c]
  rationale: Iningatan ang kahulugan at pagkakasunod ng Hebreo. Pinalitan ang “umahon” ng mas likas na “umaakyat,” at inayos ang mga talababa upang hindi magdagdag ng diwa ng pag-agaw o ng hindi tahasang binanggit na pangkat, habang mas malinaw na ipinapaliwanag ang panlalaking kinatawang anyo at ang idyoma ng “makita ang mukha.”
