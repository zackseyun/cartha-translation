base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: tl
  text: Sapagkat palalayasin ko ang mga bansa sa harap mo at palalawakin ko ang iyong mga hangganan. Walang sinumang[a] mag-iimbot sa iyong lupain kapag umaakyat ka upang humarap kay Yahweh na iyong Diyos[b] nang tatlong beses bawat taon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay gumagamit ng panlalaking pangngalang isahan, na maaaring isaling “isang lalaki,” ngunit ginagamit ito rito sa kinatawang diwa para sa sinuman.
    reason: cultural_note
  - marker: b
    text: Literal na, “makita ang mukha ni Yahweh na iyong Diyos.” Sa konteksto ng pagsamba, idyoma ito para sa pagharap sa Diyos.
    reason: lexical_alternative
  - marker: c
    text: 'Maaari ring isalin: “tatlong ulit sa isang taon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang dahilan o batayan ng naunang utos tungkol sa pag-ahon sa mga kapistahan.
- source_word: אוֹרִישׁ גּוֹיִם מִפָּנֶיךָ
  choice: palalayasin ko ang mga bansa sa harap mo
  rationale: Ang Hiphil ng ירשׁ ay tumutukoy rito sa pagpapaalis sa mga bansang nasa daraanan o harapan ng Israel.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: at palalawakin ko ang iyong mga hangganan
  rationale: Pinananatili ang kongkretong larawang teritoryal ng גְּבוּל habang gumagamit ng likas na pananalita sa Tagalog.
- source_word: וְלֹא יַחְמֹד אִישׁ אֶת־אַרְצְךָ
  choice: Walang sinumang mag-iimbot sa iyong lupain
  rationale: Ang “mag-iimbot” ay nagpapanatili sa diwa ng maling pagnanasa sa חמד; ang “sinuman” ay natural na kinatawang pananalita sa Tagalog para sa אִישׁ.
- source_word: בַּעֲלֹתְךָ
  choice: kapag umahon ka
  rationale: Ang עלה ay karaniwang ginagamit sa pag-ahon patungo sa santuwaryo o takdang pook ng pagsamba.
- source_word: לֵרָאוֹת אֶת־פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: upang humarap kay Yahweh na iyong Diyos
  rationale: Isinasalin ang idyomang panrelihiyon bilang pagharap sa Diyos, habang ipinapaliwanag sa talababa ang larawang Hebreo.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: nang tatlong beses bawat taon
  rationale: Likas at tuwirang salin ng dalas ng taunang pag-ahon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- issue: Kinatawang panlalaking pangngalang אִישׁ
  choice: sinuman, na may paliwanag sa talababa
  alternative: isang lalaki
  rationale: Ang אִישׁ ay panlalaking isahan sa Hebreo ngunit may kinatawang diwa rito. Sa modernong Tagalog, “sinuman” ang malinaw at natural, samantalang pinananatili ng talababa ang impormasyong gramatikal at kontekstuwal.
- issue: Diwa ng לֵרָאוֹת אֶת־פְּנֵי sa konteksto ng pagsamba
  choice: humarap kay Yahweh
  alternative: makita ang mukha ni Yahweh
  rationale: Ang parirala ay isang idyoma ng pagharap o pagpapakita sa harap ng Diyos sa takdang pagsamba; hindi ito ipinakahulugang literal na pangitain ng mukha ng Diyos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga hangganan” para sa teritoryal na larawan, “mag-iimbot” upang mapanatili ang moral na bigat ng חמד, at “umahon” upang mapanatili ang wikang ginagamit sa paglalakbay patungo sa pook ng pagsamba.
