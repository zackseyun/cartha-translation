id: EXO.34.21
reference: Exodus 34:21
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּ/חָרִ֥ישׁ וּ/בַ/קָּצִ֖יר תִּשְׁבֹּֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: tl
  text: Anim na araw kang magtatrabaho, ngunit sa ikapitong araw ay titigil ka[a]. Sa panahon ng pag-aararo at sa panahon ng pag-aani ay titigil ka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpapahinga ka.” Ang pandiwang Hebreo ay nangangahulugang huminto o tumigil, at maaari ring mangahulugang magpahinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Anim na araw
  rationale: Tuwirang ipinapahayag ang haba ng panahong itinakda para sa paggawa at pinananatili ang maikling anyo ng Hebreo.
- source_word: תַּעֲבֹד
  choice: kang magtatrabaho
  rationale: Ang anyong pautos sa konteksto ng tipan ay likas na naihahayag sa Filipino sa panghinaharap na may preskriptibong puwersa; hindi ito pinalalambot bilang pahintulot lamang.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ngunit sa ikapitong araw
  rationale: Bagaman maaaring simpleng 'at' ang waw, malinaw na salungat ang ikapitong araw sa anim na araw ng paggawa, kaya natural ang 'ngunit.'
- source_word: תִּשְׁבֹּת
  choice: titigil ka
  rationale: Ang ugat na שׁבת ay pangunahing nangangahulugang huminto o tumigil. Ang 'titigil ka' ay natural sa modernong Filipino at nakatuon sa pagtigil sa gawain.
- source_word: בֶּחָרִישׁ
  choice: sa panahon ng pag-aararo
  rationale: Ipinahihiwatig ng pangngalan ang pag-aararo o panahon ng pag-aararo; nililinaw ng salin ang temporal at agrikultural na diwa.
- source_word: וּבַקָּצִיר
  choice: at sa panahon ng pag-aani
  rationale: Ang קציר ay ani o panahon ng pag-aani. Ang pariralang ito ay natural at kapantay ng naunang 'panahon ng pag-aararo.'
- source_word: תִּשְׁבֹּת (second occurrence)
  choice: titigil ka
  rationale: Pinananatili ang pag-uulit ng Hebreo upang idiin na dapat tumigil kahit sa mahahalagang panahon ng gawaing bukid.
theological_decisions:
- issue: Pagkakasalin sa pandiwang שׁבת na kaugnay ng Sabbath
  choice: Isinalin bilang 'titigil ka' sa dalawang paglitaw.
  alternative: Maaaring isalin bilang 'magpapahinga ka.'
  rationale: Binibigyang-diin ng talata ang paghinto sa paggawa sa ikapitong araw, maging sa abalang panahon ng pag-aararo at pag-aani. Pinananatili ng 'titigil' ang pangunahing leksikal na diwa nang hindi nililimitahan ito sa karanasan ng pagpapahinga.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at madaling maunawaan. Pinanatili ang maikling paralelismo at ang pag-uulit sa pinagmulang Hebreo; ginamit ang 'panahon ng' upang maging likas at malinaw ang dalawang terminong agrikultural.
