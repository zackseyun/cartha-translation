  yaml_path: translation/ot/exodus/034/033.yaml
  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: tl
  text: Nang matapos makipag-usap si Moises sa kanila,[a] inilagay niya ang isang talukbong sa kanyang mukha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Nang tumigil si Moises sa pakikipag-usap sa kanila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל ... מִדַּבֵּר
  choice: nang matapos makipag-usap
  rationale: Ang כלה na sinusundan ng infinitive na may מִן ay nagpapahayag ng pagtatapos ng kilos. Likas sa modernong Tagalog ang “matapos makipag-usap,” at pinananatili nito ang diwa ng pakikipag-usap na taglay ng אִתָּם.
- source_word: אִתָּם
  choice: sa kanila
  rationale: Sa pariralang “makipag-usap sa kanila,” natural na naipapahayag sa Tagalog ang Hebreong “kasama nila/with them,” nang hindi ito ginagawang tahasang isang panig lamang na pagsasalita “sa kanila.”
- source_word: וַיִּתֵּן
  choice: inilagay
  rationale: Ang נתן na may עַל ay may diwang “maglagay” sa ibabaw o sa isang bagay; ang “inilagay” ay malinaw at karaniwang gamit sa Tagalog.
- source_word: עַל פָּנָיו
  choice: sa kanyang mukha
  rationale: Ipinapahayag ng “sa kanyang mukha” ang kinalalagyan ng talukbong. Nauunawaan sa konteksto na tinatakpan nito ang mukha, nang hindi dinaragdagan ang payak na Hebreong עַל.
- source_word: מַסְוֶה
  choice: talukbong
  rationale: Tumutukoy ito rito sa pantakip sa mukha. Ang “talukbong” ay dignified at madaling maunawaang salitang Tagalog para sa isang takip o belo na inilalagay sa mukha.
theological_decisions: []
