source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: tl
  text: Ngunit tuwing pumapasok si Moises sa presensya ni Yahweh upang makipag-usap sa kanya, inaalis niya ang talukbong hanggang sa lumabas siya. Pagkatapos, lumalabas siya at sinasabi sa mga anak ni Israel[a] ang ipinag-utos sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “sa mga Israelita” o “sa sambayanan ng Israel.” Literal sa Hebreo: “sa mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹא
  choice: Ngunit tuwing pumapasok
  rationale: Ang ב na may infinitive construct ay nagtatakda ng paulit-ulit na pangyayari; ipinahahayag ng “tuwing” ang nakagawiang kilos, at ng “ngunit” ang banayad na kaibahan sa naunang talata.
- source_word: לִפְנֵי יְהוָה
  choice: sa presensya ni Yahweh
  rationale: Ang לִפְנֵי ay literal na “sa harap ng” at idiomatikong tumutukoy sa pagharap o pagpasok sa presensya; pinananatili ang personal na pangalang tipan na Yahweh para sa יהוה.
- source_word: לְדַבֵּר אִתּוֹ
  choice: upang makipag-usap sa kanya
  rationale: Nagsasaad ng layunin ang infinitive; ang דבר na may אִתּוֹ ay angkop na ipahayag bilang pakikipag-usap, hindi lamang isang panig na pagsasalita.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: inaalis niya ang talukbong
  rationale: Ang imperfect ay may nakagawiang aspekto sa konteksto. Ang “talukbong” ay natural na tawag sa pantakip sa mukha ni Moises.
- source_word: עַד־צֵאתוֹ
  choice: hanggang sa paglabas niya
  rationale: Pinananatili nito ang duratibong hangganan ng עַד at ang nominal na anyo ng infinitive construct.
- source_word: וְיָצָא וְדִבֶּר
  choice: Pagkatapos, lumalabas siya at sinasabi
  rationale: Ipinagpapatuloy ng mga pandiwa ang paulit-ulit at nakagawiang pagkakasunod-sunod ng mga kilos.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Tuwirang pinananatili ang Hebreong idyomang “mga anak ni Israel,” habang inilalahad sa talababa ang mas idiomatikong kolektibong kahulugan.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: ang anumang iniutos sa kanya
  rationale: Ang Pual ay pasibo at tumutukoy sa nilalaman ng utos na tinanggap ni Moises at saka ipinahayag niya sa Israel.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kasarian at saklaw ng בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; sambayanan ng Israel
  rationale: Pinananatili sa pangunahing teksto ang pormal na anyong Hebreo, ngunit hindi ipinapalagay na mga lalaki lamang ang tinutukoy; ang parirala ay karaniwang tawag sa buong sambayanan ng tipan.
- issue: Kausap sa לְדַבֵּר אִתּוֹ
  choice: sa kanya, na tumutukoy kay Yahweh
  alternative: makipag-usap dito
  rationale: Ang panlalaking panghalip na isahan ay likas na bumabalik kay Yahweh, ang pinakamalapit at kontekstuwal na tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino; ginamit ang pangkasalukuyang aspektong nakagawian (“pumapasok,” “inaalis,” “lumalabas,” “sinasabi”) upang malinaw na maipahayag ang paulit-ulit na kilos. Ang “sa presensya” ay mas natural kaysa literal na “sa harap,” at ang “talukbong” ay malinaw sa konteksto bilang pantakip sa mukha.
