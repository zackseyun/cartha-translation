base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Yahweh kay Moises, “Magtabas ka[a] para sa iyong sarili ng dalawang tapyas na bato na gaya ng mga nauna, at isusulat ko sa mga tapyas ang mga salitang nasa mga unang tapyas na binasag mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Ukitin mo” o “Tabasin mo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang panimulang pandiwa ito sa salaysay at likas na isinasalin sa modernong Tagalog bilang “sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahihiwatig ng Tetragrammaton sa halip na palitan ito ng titulong “Panginoon.”
- source_word: פְּסָל
  choice: Tumabas
  rationale: Tumutukoy ang pautos sa paghubog ng mga tapyas mula sa bato. Ipinahahayag ng “tumabas” ang konkretong pagputol o paghubog nang hindi ipinapalagay na pandekorasyong pag-ukit ang gawain.
- source_word: לְךָ
  choice: para sa iyong sarili
  rationale: Malinaw na pinananatili ang datibong panghalip na nagbibigay-diin na si Moises mismo ang maghahanda ng mga tapyas.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dalawang tapyas na bato
  rationale: Ang “tapyas na bato” ay natural at malinaw na katawagan sa mga patag na batong pagsusulatan.
- source_word: כָּרִאשֹׁנִים
  choice: na gaya ng mga nauna
  rationale: Pinananatili nito ang paghahambing sa unang pares ng mga tapyas.
- source_word: וְכָתַבְתִּי
  choice: at isusulat ko
  rationale: Tuwirang ipinahahayag ang pangako ng unang panauhan at ang pang-ugnay ng Hebreo.
- source_word: הַדְּבָרִים
  choice: ang mga salita
  rationale: Ang literal at kontekstuwal na kahulugan ay “mga salita.” Ang “mga utos” ay posibleng paglilinaw sa tinutukoy ngunit mas tiyak kaysa sa mismong salitang Hebreo.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: na binasag mo
  rationale: Likas at tuwirang inilalarawan ng “binasag” ang ginawa ni Moises sa mga unang tapyas.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo, nang hindi nagdaragdag ng interpretasyong pangdenominasyon.
- issue: Kahulugan ng הַדְּבָרִים
  choice: mga salita
  alternative: mga utos
  rationale: Bagaman mga tuntunin ng tipan ang tinutukoy sa konteksto, “mga salita” ang mas tuwirang katumbas at hindi nito nilulutas nang higit sa teksto ang lawak ng tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tapyas na bato” sa halip na mas teknikal o makalumang katawagan, at pinanatili ang tuwirang ayos ng utos at pangako hangga't natural sa Tagalog.
