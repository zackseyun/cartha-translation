  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: tl
  text: At sinabi niya, “Kung nakasumpong nga ako ng lingap sa iyong paningin, Panginoon, lumakad ka po sana sa gitna namin[a], bagaman matigas ang ulo ng bayang ito. Patawarin mo ang aming kasamaan at kasalanan, at kunin mo kami bilang iyong mana[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “humayo ka sa gitna namin” o “sumama ka sa amin.” Literal na sinasabi ng Hebreo, “lumakad sa gitna namin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “angkinin mo kami bilang iyong pag-aari.” Maaaring tumukoy ang pandiwang Hebreo sa pagkuha o pagtatalaga bilang mana o pag-aari.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: lingap
  rationale: Ang “lingap” ay likas at marangal na katumbas ng pabor o kagandahang-loob sa konteksto ng pakikipag-ugnayan, nang hindi nagdaragdag ng mas huling teknikal na pakahulugang teolohikal.
- source_word: בְּעֵינֶיךָ
  choice: sa iyong paningin
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo sa paraang malinaw at natural sa modernong Tagalog.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Titulo ito ng tuwirang pagtawag, hindi ang mismong pangalang YHWH. Sa ikalawang paglitaw, ginamit ang panghalip na “ka” sapagkat iisang kinakausap ang tinutukoy at mas natural ito sa Tagalog.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: lumakad ka po sana sa gitna namin
  rationale: Pinananatili ng “lumakad” at “sa gitna namin” ang kilos at larawang panlunan ng Hebreo; ipinahahayag ng “po sana” ang magalang na pakiusap ng נָא.
- source_word: קְשֵׁה עֹרֶף
  choice: matigas ang ulo
  rationale: Ito ang natural at agad nauunawaang idyoma sa modernong Tagalog para sa pagmamatigas. Bagaman “batok” ang literal na larawan sa Hebreo, ang “matigas ang ulo” ang katumbas na buhay na talinghaga sa Filipino.
- source_word: עַם
  choice: bayan
  rationale: Tinutukoy nito ang Israel bilang isang sambayanang may tipan, hindi lamang bilang makabagong estadong politikal.
- source_word: עָוֹן
  choice: kasamaan
  rationale: Taglay nito ang bigat moral ng salita at nananatiling naiiba sa kasunod na “kasalanan.”
- source_word: חַטָּאת
  choice: kasalanan
  rationale: Ito ang tuwiran at karaniwang katumbas, at angkop sa pagkakahanay nito sa עָוֹן.
- source_word: וּנְחַלְתָּנוּ
  choice: kunin mo kami bilang iyong mana
  rationale: Pinananatili nito ang wika ng mana at ang diwang ang bayan ay aangkinin ng Diyos bilang kanyang sariling bahagi o pag-aari.
theological_decisions:
- issue: Pagpapakahulugan sa כִּי bago ang paglalarawan sa bayang matigas ang ulo
  choice: bagaman
  alternative: sapagkat
  rationale: 'Maaaring sanhi ang karaniwang gamit ng כִּי, ngunit sa daloy ng pakiusap ay malakas ang diwang konsesibo: hinihiling ni Moises ang presensiya at kapatawaran ng Diyos sa kabila ng pagmamatigas ng bayan. Pinananatili ng “bagaman” ang tensiyong ito nang hindi binabago ang pagkakakilanlan ng bayan.'
- issue: Pag-render sa אֲדֹנָי sa panalanging nakatuon kay YHWH
  choice: Panginoon / ka
  alternative: aking Panginoon / ang Panginoon
  rationale: Titulo ang אֲדֹנָי at hindi ang banal na pangalang YHWH. Ang “Panginoon” sa tuwirang tawag at “ka” sa kasunod na pakiusap ay tapat sa iisang kausap at natural sa Tagalog.
- issue: Diwa ng וּנְחַלְתָּנוּ
  choice: kunin mo kami bilang iyong mana
  alternative: angkinin mo kami bilang iyong pag-aari
  rationale: Pinananatili ng pangunahing salin ang talinghaga ng mana at ang tipanang pag-aari, habang kinikilala sa talababa ang posibleng diin sa pag-angkin bilang sariling pag-aari.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at angkop sa pagbasa sa Bibliya. Pinanatili ang idyomang “sa iyong paningin” at ang larawan ng “mana,” ngunit ginamit ang likas na Filipino na “matigas ang ulo” sa halip na literal ngunit di-gaanong natural na “matigas ang batok.”
