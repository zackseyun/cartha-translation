  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: tl
  text: at kumuha ka ng ilan sa kanyang mga anak na babae para sa iyong mga anak na lalaki, at magpapatutot ang kanyang mga anak na babae sa pagsunod sa kanilang mga diyos[a] at uudyukan nila ang iyong mga anak na lalaki na magpapatutot sa pagsunod sa kanilang mga diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “magpatutot.” Gumagamit ang Hebreo ng metapora ng seksuwal na pagtataksil para sa pagsunod sa ibang mga diyos.
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hihikayatin nila ang iyong mga anak na lalaki na sumunod sa kanilang mga diyos at sa gayon ay sumamba sa mga diyus-diyosan.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: at kumuha ka
  rationale: Pinananatili ang tuwirang diwa ng Qal na ‘kumuha’ sa sugnay na nagsasaad ng ibubungang pangyayari; ang ‘mag-asawa’ ay mas interpretatibo.
- source_word: מִבְּנֹתָיו
  choice: ng ilan sa kanyang mga anak na babae
  rationale: 'Ipinahahayag ang partitive na diwa ng מִן: pagpili ng ilan mula sa kanyang mga anak na babae.'
- source_word: לְבָנֶיךָ
  choice: para sa iyong mga anak na lalaki
  rationale: Likas na ipinahahayag sa Filipino ang layon ng pagkuha sa konteksto ng pagsasaayos ng pag-aasawa.
- source_word: וְזָנוּ
  choice: at magpatutot ang kanyang mga anak na babae
  rationale: Pinananatili ang matinding talinghagang seksuwal ng זנה para sa pagsamba sa ibang mga diyos, sa halip na lubusang ipaliwanag bilang ‘sumamba sa mga diyus-diyosan.’
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: sa pagsunod sa kanilang mga diyos
  rationale: Natural sa modernong Filipino at pinananatili ang Hebreong larawan ng paghabol o pagsunod sa ibang mga diyos.
- source_word: וְהִזְנוּ
  choice: at akayin nila ... na magpatutot din
  rationale: 'Ipinakikita ang causative na puwersa ng Hiphil: ang mga anak na babae ang nag-uudyok o umaakay sa mga anak na lalaki tungo sa gayunding kataksilang panrelihiyon.'
- source_word: אֶת בָּנֶיךָ
  choice: ang iyong mga anak na lalaki
  rationale: Tuwirang salin ng tahasang layon na may hulaping ikalawang panauhang panlalaki isahan.
- source_word: אֱלֹהֵיהֶן
  choice: kanilang mga diyos
  rationale: Pinananatili ang maramihang anyo at ang pambabaeng maramihang taglay sa konteksto.
theological_decisions:
- issue: Paglalarawan sa זנה sa konteksto ng idolatriya
  choice: Panatilihin ang talinghaga sa ‘magpatutot.’
  alternative: ‘sumamba sa mga diyus-diyosan’ o ‘magtaksil’
  rationale: Sinasadyang gumamit ang Hebreo ng larawan ng seksuwal na pagtataksil para sa pagtalikod sa Diyos at pagsunod sa ibang mga diyos. Pinananatili nito ang bigat at tensiyong teolohikal ng babala.
- issue: Tiyak na kasarian sa בנותיו at בניך
  choice: ‘mga anak na babae’ at ‘mga anak na lalaki’
  alternative: ‘mga anak’
  rationale: Tiyak ang kasarian sa tekstong Hebreo at mahalaga ito sa konteksto ng pag-aasawa; hindi ito ginawang neutral.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang tiyak na ‘mga anak na babae’ at ‘mga anak na lalaki,’ gayundin ang matinding talinghaga ng pagpapatutot; ginamit ang ‘sa pagsunod sa’ upang maging likas sa Filipino ang Hebreong idyomang ‘sumunod sa/humabol sa mga diyos.’
