id: EXO.34.5
reference: Exodus 34:5
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בֶּֽ/עָנָ֔ן וַ/יִּתְיַצֵּ֥ב עִמּ֖/וֹ שָׁ֑ם וַ/יִּקְרָ֥א בְ/שֵׁ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: tl
  text: Bumaba si Yahweh sa ulap, tumayo roon kasama niya, at ipinahayag ang pangalan ni Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “tumawag sa pangalan ni Yahweh,” o “nagpahayag sa pangalan ni Yahweh.” Sa Hebreo, ang “pangalan” ay may pang-ukol na maaaring mangahulugang “sa” o “sa pamamagitan ng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Bumaba
  rationale: Likas at tuwirang katumbas ng pandiwang ירד, at pinananatili ang kongkretong kilos na pababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng banal na personal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: בֶּעָנָן
  choice: sa ulap
  rationale: Ipinahahayag nito ang kinalalagyan ni Yahweh at natural sa modernong Tagalog; nauunawaan sa konteksto na ito ang kilalang ulap ng presensiya ng Diyos.
- source_word: וַיִּתְיַצֵּב
  choice: tumayo
  rationale: Natural at malinaw na katumbas ng hitpael ng יצב, na nangangahulugang pumuwesto o tumindig.
- source_word: עִמּוֹ שָׁם
  choice: roon kasama niya
  rationale: Pinananatili ang pang-abay na שָׁם at ang panghalip ng עִמּוֹ nang hindi tahasang pinapalitan ang 'niya' ng 'Moises.'
- source_word: וַיִּקְרָא
  choice: ipinahayag
  rationale: Sa konteksto ng kasunod na talata, ang קרא ay may diwang pagpapahayag o pagbigkas nang hayagan, hindi lamang pagtawag.
- source_word: בְשֵׁם יְהוָה
  choice: ang pangalan ni Yahweh
  rationale: Kasunod ng 'ipinahayag,' ito ang pinakamalinaw at likas na Tagalog. Gayunman, hindi hayag sa pangunahing salin ang pang-ukol na בְּ, kaya inilakip sa talababa ang mga posibleng pagbasa.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ang tekstong Hebreo ay tuwirang gumagamit ng Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Simuno at kahulugan ng וַיִּקְרָא
  choice: Si Yahweh ang patuloy na simuno; isinalin ang pandiwa bilang 'ipinahayag.'
  alternative: Si Moises ang simuno; o isalin ang pandiwa bilang 'tumawag.'
  rationale: 'Pinakanatural sa sunod-sunod na mga pandiwa sa Hebreo na manatiling si Yahweh ang simuno: bumaba siya, tumayo, at nagpahayag. Sinusuportahan din ito ng nilalaman ng pagpapahayag sa kasunod na talata, ngunit itinatala sa talababa ang leksikal na ibang pagbasa ng parirala.'
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang maikling daloy ng salaysay, ang panghalip na 'niya,' at ang tunay na kalabuan ng pariralang בְשֵׁם sa pamamagitan ng talababa.
