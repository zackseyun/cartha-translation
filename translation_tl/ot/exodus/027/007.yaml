translation:
  language: tl
  text: Ilalagay ang mga pingga nito sa mga argolya, at ang mga pingga ay nasa magkabilang tagiliran ng altar kapag binubuhat ito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּבָא
  choice: Ipasok
  rationale: Ang Hophal ng בוא ay pasibo at causative sa anyo, ngunit ang likas na utos sa Filipino na “Ipasok” ay malinaw na naghahayag ng itinakdang paglalagay ng mga pingga sa mga argolya.
- source_word: בַּדָּיו
  choice: mga pingga nito
  rationale: Ang בַּד ay tumutukoy sa mga mahabang pinggang ginagamit sa pagbuhat ng banal na kasangkapan; malinaw at kasalukuyang Filipino ang “mga pingga.”
- source_word: בַּטַּבָּעֹת
  choice: sa mga argolya
  rationale: Sa kasalukuyang Filipino, ang “ipasok sa mga argolya” ay likas na nagpapahiwatig ng pagpasok o pagsuot ng mga pingga sa mga singsing na pansuporta.
- source_word: וְהָיוּ
  choice: ay malalagay
  rationale: Ipinahahayag nito ang magiging posisyon ng mga pingga matapos ipasok, nang hindi nagdaragdag ng ideyang dapat manatili ang mga ito roon.
- source_word: עַל שְׁתֵּי צַלְעֹת
  choice: sa magkabilang tagiliran
  rationale: Ang צלעות ay maaaring mangahulugang mga gilid, tagiliran, o bahaging nasa tagiliran. Ang “magkabilang tagiliran” ay natural at angkop sa pisikal na ayos ng altar.
- source_word: הַמִּזְבֵּחַ
  choice: altar
  rationale: Ito ang karaniwan at malinaw na salin ng מִזְבֵּחַ sa kontekstong panritwal.
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: kapag binubuhat ito
  rationale: Ang infinitive construct na may בְּ ay nagpapahayag ng kalagayan o panahon. Pinananatili ng “kapag binubuhat ito” ang pokus sa altar at hindi tinutukoy kung sino ang mga tagabuhat.
