  yaml_path: translation/ot/exodus/027/006.yaml
  text: You shall make poles for the altar[a], poles of acacia wood, and you shall overlay them with bronze.
translation:
  language: tl
  text: Gumawa ka ng mga pingga para sa altar, mga pinggang gawa sa kahoy na akasya, at balutan mo ang mga ito ng bronse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso” sa halip na “bronse.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang Qal perfect 2ms na may pang-ugnay ay nagsisilbing tuwirang utos sa konteksto ng mga tagubilin. Natural at malinaw sa modernong Filipino ang “Gumawa ka.”
- source_word: בַדִּים / בַּדֵּי
  choice: mga pingga
  rationale: Tumutukoy ito sa mahahabang kahoy na ginagamit sa pagbubuhat ng altar. Ang “mga pingga” ay malinaw na katawagang Filipino at hindi kasing-luma ng ibang maaaring gamitin.
- source_word: לַמִּזְבֵּחַ
  choice: para sa altar
  rationale: Pinananatili ang payak na tinutukoy ng Hebreo at hindi idinaragdag ang “handugang sinusunog,” bagaman malinaw iyon sa mas malawak na konteksto.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Natural na katawagan ito sa modernong Filipino para sa materyal na tinutukoy ng pariralang Hebreo.
- source_word: וְצִפִּיתָ
  choice: at balutan mo
  rationale: Sa konteksto ng mga kagamitan sa tabernakulo, ang Piel ng צפה ay nangangahulugang lagyan o balutan ng metal. Ang “balutan” ay natural at hindi nagtatakda ng isang tiyak na makabagong pamamaraan.
- source_word: אֹתָם
  choice: ang mga ito
  rationale: Malinaw nitong ibinabalik ang panghalip sa maramihang “mga pingga.”
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Karaniwang tumutukoy sa bronse sa konteksto ng mga kagamitan sa tabernakulo, ngunit maaari ring maunawaan bilang tanso; pinananatili ang alternatibo sa talababa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang tuwirang pautos na anyo at karaniwang bokabularyo; inilagay ang pananda ng talababa kaagad pagkatapos ng salitang “bronse” na tinutukoy nito.
