  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng patyo, tabernakulo, dobleng pagtukoy sa timog, mga tabing, pinong linong pinilipit, at sukat na isang daang siko. Gayunman, ang "rin" sa unang pangungusap ay nagdaragdag ng ideyang "din" na wala sa Hebreo, at ang "sa panig na iyon" ay mas tiyak kaysa sa simpleng "para sa isang panig."
  naturalness: Marangal at madaling maunawaan ang Filipino. Mas natural at tuwiran ang pag-uugnay ng mga tabing sa utos na "Maglagay ka" kaysa "magkakaroon ang patyo," at iniiwasan nito ang malabong panghalip na "mga ito."
  terminology: Ang "patyo," "tabernakulo," "mga tabing," "lino," at "siko" ay angkop. Nananatiling kapaki-pakinabang ang talababa para sa leksikal na alternatibong "mga kurtina."
