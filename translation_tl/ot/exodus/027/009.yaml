base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: tl
  text: Gawin mo ang patyo ng tabernakulo. Para sa panig na timog, patimog, maglagay ka ng mga tabing[a] para sa patyo, na yari sa pinong linong pinilipit, na isang daang siko ang haba para sa isang panig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kurtina.” Ang salitang Hebreo ay tumutukoy sa mga panel na telang bumubuo sa hangganan ng patyo.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: patyo
  rationale: Tumutukoy ito sa bukás ngunit napalilibutang na lugar ng tabernakulo; natural at malinaw sa makabagong Filipino ang “patyo.”
- source_word: הַמִּשְׁכָּן
  choice: tabernakulo
  rationale: Ito ang kinikilalang katawagan sa sagradong toldang santuwaryo sa Exodo at pinananatili ang natatanging kontekstong panrelihiyon ng salita.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: Sa panig na timog, patimog
  rationale: Pinananatili ang pag-uulit ng Hebreo sa panig at direksiyong timog sa halip na paikliin ito bilang “sa timog na panig” lamang.
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Tumutukoy sa mga panel na telang nakabitin at bumubuo sa hangganan ng patyo. Mas malinaw sa Filipino ang “mga tabing” kaysa “mga kurtina” para sa gamit na ito.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Inihahayag kapuwa ang mahusay na uri ng lino at ang paraan ng pagkakayari nito.
- source_word: מֵאָה בָאַמָּה
  choice: isang daang siko
  rationale: Pinananatili ang sinaunang yunit ng sukat sa halip na tantiyahin ito sa makabagong yunit.
- source_word: אֹרֶךְ
  choice: ang haba
  rationale: Natural na ikinakabit sa pariralang nagsasaad ng sukat sa Filipino.
- source_word: לַפֵּאָה הָאֶחָת
  choice: sa panig na iyon
  rationale: Malinaw na tumutukoy sa iisang panig na kasalukuyang inilalarawan, nang hindi nagpapahiwatig na iyon lamang ang panig ng patyo.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang teknikal na “tabernakulo” at ang sinaunang sukat na “siko,” habang ginawang likas sa Filipino ang ayos ng pangungusap. Inilagay ang talababa sa “mga tabing,” ang mismong salitang tinutukoy nito.
