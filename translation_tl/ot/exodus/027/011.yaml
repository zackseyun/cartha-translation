base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: tl
  text: 'Gayundin, sa hilagang panig: mga tabing na isang daang siko[a] ang haba, dalawampu ang mga haligi nito, at dalawampu ang mga patungan ng mga ito, na tanso. Ang mga kawit ng mga haligi at ang mga bigkis[b] ng mga ito ay pilak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tahasang binanggit sa Hebreo ang “siko”; ipinahihiwatig ito ng mga sukat sa kalapit na konteksto.
    reason: cultural_note
  - marker: b
    text: Maaari ring “mga pang-ugnay”; tumutukoy ang salitang Hebreo sa mga bahaging nag-uugnay o pumapalibot sa mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Gayundin
  rationale: Ipinakikita ang pagkakatulad ng mga tuntunin para sa hilagang panig sa naunang panig.
- source_word: לִפְאַת צָפוֹן
  choice: sa hilagang panig
  rationale: Likas at malinaw na katumbas ng panig o gilid na nakaharap sa hilaga.
- source_word: בָּאֹרֶךְ
  choice: pahaba
  rationale: Pinananatili ang pagtukoy sa sukat ayon sa haba nang hindi pinabibigat ang pangungusap.
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Tumutukoy sa mga telang nakasabit na bumubuo sa bakuran; karaniwan at madaling maunawaang salita ang “tabing.”
- source_word: מֵאָה אֹרֶךְ
  choice: sandaang siko ang haba
  rationale: Elliptical ang Hebreo at literal na nagsasabing “sandaang haba”; ang yunit na siko ay malinaw mula sa magkakalapit na sukat sa konteksto.
- source_word: וְעַמֻּדָיו עֶשְׂרִים
  choice: dalawampu ang mga haligi nito
  rationale: Pinananatili ang tuwirang ayos ng imbentaryo at ang panghalip na tumutukoy sa hilagang panig o kaayusan nito.
- source_word: וְאַדְנֵיהֶם עֶשְׂרִים נְחֹשֶׁת
  choice: dalawampu ang mga patungang tanso ng mga iyon
  rationale: Ang אֶדֶן ay suportang pinagsasaligan o pinagsasaksakan ng haligi; mas madaling maunawaan ang “patungan” kaysa teknikal na “soket.”
- source_word: וָוֵי הָעַמֻּדִים
  choice: mga kawit ng mga haligi
  rationale: Ang וָוִים ay mga kawit o tulos na nakakabit sa mga haligi; ang “kawit” ang pinakanaaangkop sa gamit dito.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: mga bigkis ng mga iyon
  rationale: Malawak ang kahulugan ng terminong Hebreo at maaaring tumukoy sa mga bahaging pumapalibot o nag-uugnay sa mga haligi; pinananatili ng “bigkis” ang lawak na iyon.
- source_word: כָּסֶף
  choice: pilak
  rationale: Tuwirang tawag sa materyal.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang tuwirang anyong parang talaan upang masundan ang verbless na estruktura ng Hebreo, ngunit hinati sa dalawang pangungusap para sa linaw. Iniwasan ang labis na teknikal o makalumang bokabularyo.
