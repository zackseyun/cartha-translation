translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “looban,” “haligi,” “kawit,” at “tuntungan” bilang malinaw na katawagang pangkonstruksiyon. Pinanatili sa mga talababa ang tunay na leksikal na kalabuan ng מְחֻשָּׁקִים, אֲדָנִים, at נְחֹשֶׁת.
