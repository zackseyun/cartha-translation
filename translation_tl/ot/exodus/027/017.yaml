  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: tl
  text: Ang lahat ng haligi sa palibot ng looban ay bibigkisan ng pilak[a]; ang mga kawit ng mga ito ay pilak, at ang mga tuntungan ng mga ito ay bronse[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “pag-uugnayin sa pamamagitan ng mga baras na pilak.” Ang salitang Hebreo ay tumutukoy sa mga bigkis o pang-ugnay na nakakabit sa mga haligi.'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “mga soket.” Tumutukoy ito sa mga baseng metal na pinagsasalpakan ng mga haligi.
    reason: lexical_alternative
  - marker: c
    text: Ang “bronse” ay maaari ring isaling “tanso” o “copper,” sapagkat maaaring tumukoy ang salitang Hebreo sa copper o sa haluang metal na pangunahing sangkap ang copper.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ang lahat ng
  rationale: Ipinapahayag ang kabuuan ng mga haligi sa looban; natural at malinaw ito sa modernong Tagalog.
- source_word: עַמּוּדֵי
  choice: mga haligi
  rationale: Tumutukoy sa mga patayong suporta ng tabing ng looban; ang “haligi” ang karaniwan at angkop na katawagan.
- source_word: הֶחָצֵר
  choice: looban
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa bakuran o nakapaloob na lugar sa labas ng tolda; maikli at likas ang “looban.”
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahihiwatig na saklaw ang mga haligi sa lahat ng panig ng looban.
- source_word: מְחֻשָּׁקִים
  choice: lalagyan ng mga bigkis
  rationale: Ang anyong pasibo ay tumutukoy sa pagkakabit ng mga bigkis o pang-ugnay na yari sa pilak; pinananatili ng salin ang posibleng arkitektural na diwa nang hindi gumagamit ng lipas o labis na teknikal na salita.
- source_word: כֶּסֶף
  choice: na pilak
  rationale: Tinutukoy ang materyal ng mga bigkis o pang-ugnay.
- source_word: וָוֵיהֶם
  choice: ang mga kawit ng mga ito
  rationale: Karaniwang tumutukoy ang וָו sa mga kawit na kinakapitan ng mga tabing sa paglalarawan ng tabernakulo.
- source_word: כָּסֶף
  choice: ay pilak
  rationale: Tuwirang ipinapahayag ang materyal ng mga kawit sa natural na Tagalog.
- source_word: אַדְנֵיהֶם
  choice: ang mga tuntungan ng mga ito
  rationale: Tumutukoy sa mga suportang metal o hukton na pinagsasalpakan ng mga haligi; malinaw sa pangkalahatang mambabasa ang “tuntungan,” habang nasa talababa ang mas teknikal na alternatibo.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang salitang Hebreo ay maaaring tumukoy sa copper o sa copper-alloy gaya ng bronze. Ang “tanso” ay likas na pangkalahatang katawagan sa Tagalog, habang nililinaw sa talababa ang posibleng tiyak na metal.
