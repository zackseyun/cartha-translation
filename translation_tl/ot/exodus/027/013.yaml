  text: At ang lapad ng looban sa gawing silangan, sa dakong sikatan ng araw, ay limampung siko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרֹחַב
  choice: At ang lapad
  rationale: Ang רֹחַב ay tumutukoy sa lapad; pinananatili ng “At” ang dugtungang estilo ng mga tagubilin.
- source_word: הֶחָצֵר
  choice: ng looban
  rationale: Ang חָצֵר dito ay ang nabakurang panlabas na bahagi ng santuwaryo; natural at malinaw sa modernong Filipino ang “looban.”
- source_word: לִפְאַת קֵדְמָה
  choice: sa gawing silangan
  rationale: Sa pariralang ito, ang פֵאָה ay “gawi/panig,” at malinaw na itinatakda ng קֵדְמָה ang direksiyong silangan.
- source_word: מִזְרָחָה
  choice: sa dakong sikatan ng araw
  rationale: Pinananatili nito ang kongkretong larawan ng מִזְרָח at ang inuulit na pagbibigay-diin sa direksiyong silangan nang hindi lamang inuulit ang parehong salita.
- source_word: חֲמִשִּׁים
  choice: limampu
  rationale: Tuwirang salin ng bilang.
- source_word: אַמָּה
  choice: siko
  rationale: Ang אַמָּה ay sinaunang yunit ng haba na karaniwang tinatawag na “siko” sa Filipino; hindi ito ginawang modernong sukat sa pangunahing teksto.
