  text: וְ/עָשִׂ֤יתָ לּ/וֹ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת וְ/עָשִׂ֣יתָ עַל הָ/רֶ֗שֶׁת אַרְבַּע֙ טַבְּעֹ֣ת נְחֹ֔שֶׁת עַ֖ל אַרְבַּ֥ע קְצוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/004.yaml
  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: tl
  text: Gumawa ka para rito ng isang parilyang tanso na yari na parang lambat[a]. Sa lambat na iyon, gumawa ka ng apat na singsing na tanso sa apat na sulok nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “isang parilya, gawang lambat, na tanso.” Maaari ring isalin na “isang rehas na tanso na yari na parang lambat.”
    reason: lexical_alternative
  - marker: b
    text: O “sa apat na dulo nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר מַעֲשֵׂה רֶשֶׁת
  choice: isang parilyang tanso na yari na parang lambat
  rationale: Ang מִכְבָּר ay isang rehas o parilyang bahagi ng altar, at nililinaw ng מַעֲשֵׂה רֶשֶׁת na lambat ang pagkakayari nito. Natural sa modernong Tagalog ang paglalarawang ito at nananatili ang dalawang magkaugnay na larawan sa Hebreo.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay maaaring tumukoy sa tanso o sa haluang metal na gaya ng bronse. Ang “tanso” ang karaniwan at marangal na katawagan sa Tagalog para sa materyal ng mga kagamitang ito.
- source_word: עַל הָרֶשֶׁת
  choice: Sa lambat na iyon
  rationale: Pinananatili nito ang pag-uulit ng רֶשֶׁת at malinaw na inuugnay ang mga singsing sa mala-lambat na bahagi ng parilya.
- source_word: טַבְּעֹת
  choice: mga singsing
  rationale: Karaniwang tumutukoy ang salita sa mga metal na singsing na nagsisilbing kabitan sa mga tagubilin tungkol sa tabernakulo.
- source_word: קְצוֹתָיו
  choice: mga sulok nito
  rationale: Ang literal na diwa ay mga dulo o kadulu-duluhan; para sa parilyang may apat na panig, “mga sulok” ang pinakamalinaw na likas na Tagalog.
- source_word: לּוֹ
  choice: para rito
  rationale: Ang panghalip ay tumutukoy sa altar; ang “rito” ay natural na tumutukoy sa isang bagay sa Tagalog.
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Inihahatid ng anyong pautos ang nagpapatuloy na tagubilin nang natural sa Tagalog.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “parilya” para sa bahagi ng altar na tulad-rehas, at “lambat” upang mapanatili ang tiyak na larawan at pag-uulit ng רֶשֶׁת. Inilagay ang mga panandang [a] at [b] mismo sa pangunahing teksto.
