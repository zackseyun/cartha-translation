  naturalness: Nauunawaan ang draft, ngunit mas natural at mas malinaw ang tahasang pagtukoy sa “mga tabing” para sa lino. Ang “mga tuntungan” ay maaaring mangahulugang tuntungan o apakan; “mga salalayan” ay mas angkop para sa mga metal na base o socket ng mga poste.
  terminology: Ang “looban,” “siko,” “pinong lino na pinilipit,” at “tanso” ay angkop sa modernong Filipino Tagalog. Ginamit ang “mga salalayan” at pinanatili ang “mga saksakan” bilang alternatibong teknikal na katawagan sa talababa.
