base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: tl
  text: Ang haba ng looban ay isang daang siko, ang lapad ay limampu sa limampu[a], at ang taas ay limang siko. Ang mga tabing nito ay yari sa pinong lino na pinilipit, at ang mga salalayan nito ay tanso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “limampu sa limampu.” Karaniwang inuunawa ito bilang limampung siko ang lapad.
    reason: alternative_reading
  - marker: b
    text: O “mga saksakan” o “mga base.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: haba ng looban
  rationale: Ang “haba” ang karaniwang katawagan sa sukat, at malinaw na tinutukoy ng “looban” ang nababakurang lugar sa palibot ng tabernakulo.
- source_word: מֵאָה בָאַמָּה
  choice: isang daang siko
  rationale: Pinananatili ang sinaunang yunit na “siko” upang maging tapat sa tekstong Hebreo at pare-pareho sa mga sukat ng tabernakulo.
- source_word: וְרֹחַב חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: ang lapad ay limampu sa limampu
  rationale: Pinananatili sa pangunahing teksto ang di-karaniwang pag-uulit ng Hebreo sa halip na tahimik itong gawing “limampung siko”; nililinaw sa talababa ang malamang na kahulugan.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: ang taas ay limang siko
  rationale: Tuwirang salin ng patayong sukat ng mga tabing ng looban.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: pinong lino na pinilipit
  rationale: Ipinahahayag kapuwa ang uri ng tela, שֵׁשׁ, at ang pagkakayaring pinilipit o pinagsala-sala ng hibla, מָשְׁזָר, sa natural na modernong Tagalog.
- source_word: וְאַדְנֵיהֶם
  choice: mga tuntungan nito
  rationale: Ang אַדֶן ay metal na suportang kinalalagyan ng mga haligi; mas madaling maunawaan ang “tuntungan” kaysa teknikal na “saksakan.”
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang “tanso” ang natural at tradisyonal na katawagang Filipino para sa metal na tinutukoy sa kontekstong ito, bagaman maaaring tumukoy ang salitang Hebreo sa bronse o copper ayon sa tiyak na haluang metal.
