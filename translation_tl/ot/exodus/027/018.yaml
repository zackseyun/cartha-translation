  to: Ang haba ng looban ay isang daang siko, ang lapad ay limampu sa limampu[a], at ang taas ay limang siko. Ang mga tabing nito ay yari sa pinong lino na pinilipit, at ang mga salalayan nito ay tanso.[b]
