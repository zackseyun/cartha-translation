translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “looban,” “siko,” at “tuntungan” bilang natural na mga katawagan sa paglalarawan ng gusali. Pinanatili ang di-karaniwang Hebreong “limampu sa limampu” at ipinaliwanag sa talababa sa halip na lutasin nang palihim ang tekstuwal na tensiyon.
