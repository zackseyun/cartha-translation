revisions:
- from: At utusan mo ang mga anak ni Israel na dalhan ka nila ng dalisay na langis ng oliba na mula sa mga dinikdik na bunga, para sa ilawan,[a] upang patuloy na mapaningas ang isang lampara.[b]
  to: At mag-utos ka sa mga anak ni Israel na magdala sila sa iyo ng dalisay na langis ng oliba mula sa dinikdik na mga oliba,[a] para sa pagpapailaw, upang mapanatiling nagniningas ang ilawan nang palagian.[b]
  rationale: Inayos ang salin ng לַמָּאוֹר bilang “para sa pagpapailaw,” sapagkat ang kasunod na נֵר ang siyang ilawan. Pinalitan ang di-karaniwang “mapaningas” ng “mapanatiling nagniningas,” at inilipat ang panandang [a] sa pariralang tunay nitong ipinapaliwanag. Hindi binabago ng mga ito ang kahulugan o nilulutas nang lampas sa teksto ang saklaw ng תָּמִיד.
