  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: tl
  text: At mag-utos ka sa mga anak ni Israel na magdala sila sa iyo ng dalisay na langis ng oliba mula sa dinikdik na mga oliba,[a] para sa pagpapailaw, upang mapanatiling nagniningas ang ilawan nang palagian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “dinikdik na mga oliba” ay tumutukoy sa mataas na uring langis na nakukuha sa pagdikdik ng mga oliba, sa halip na sa karaniwang pagpiga.
    reason: lexical_alternative
  - marker: b
    text: Sa mga tagubilin tungkol sa tabernakulo, ang “nang palagian” ay maaaring tumukoy sa regular at nagpapatuloy na pangangalaga, hindi kinakailangang sa bawat sandaling walang patid. Ihambing ang Exodo 27:21 at Levitico 24:2–4.
    reason: cross_reference
lexical_decisions:
- source_word: וְאַתָּה
  choice: At ... mo
  rationale: Tinutukoy nang tuwiran at may diin si Moises habang ipinagpapatuloy ang tagubilin; likas sa Filipino na katawanin ang panghalip sa pandiwang may “mo.”
- source_word: תְּצַוֶּה
  choice: utusan mo
  rationale: Ang Piel ng צוה ay nangangahulugang mag-utos o magtagubilin. Pinananatili ng “utusan mo” ang tuwirang lakas ng utos at natural ito sa modernong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal at pangkasunduang katawagan sa Hebreo, nang hindi ipinapalagay na mga lalaki lamang ang buong pamayanang tinutukoy.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: na dalhan ka nila
  rationale: Bagaman literal na “kumuha ... patungo sa iyo,” sa konteksto ng paglalaan ay idiomatikong nangangahulugang kumuha at magdala kay Moises.
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: dalisay na langis ng oliba
  rationale: Ang זָךְ ay tumutukoy sa kalinisan o linaw ng langis; ang “dalisay” ay marangal at madaling maunawaang katumbas.
- source_word: כָּתִית
  choice: mula sa mga dinikdik na bunga
  rationale: Inililinaw sa natural na Filipino na ang langis ay mula sa mga olibang dinikdik, hindi simpleng pangkaraniwang piniga.
- source_word: לַמָּאוֹר
  choice: para sa ilawan
  rationale: Sa konteksto, ang מָאוֹר ay tumutukoy sa pagbibigay-liwanag. Ang “para sa ilawan” ay natural sa Filipino at hindi nagdaragdag ng tiyak na kagamitang hindi tahasang binanggit dito.
- source_word: לְהַעֲלֹת נֵר
  choice: upang ... mapaningas ang isang lampara
  rationale: Ipinahahayag ng Hiphil na idyoma ang pagpapaliyab at pagpapanatiling nagniningas ng lampara. Ang “mapaningas” ay nagpapanatili sa causative na diwa.
- source_word: תָּמִיד
  choice: patuloy
  rationale: Pinananatili nito ang saklaw na maaaring mangahulugang tuloy-tuloy o regular na patuloy na pangangalaga ayon sa kontekstong pangtabernakulo.
theological_decisions:
- issue: Saklaw ng katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita / sambayanan ng Israel
  rationale: Pinananatili ang pamilyal at pangkasunduang anyo ng Hebreo. Sa konteksto, katawagan ito sa pamayanan ng Israel at hindi pahayag na ibinubukod ang kababaihan.
- issue: Kahulugan ng תָּמִיד sa paglilingkod sa tabernakulo
  choice: patuloy
  alternative: walang patid / palagian
  rationale: Hindi tahasang nilulutas ng salin kung nangangahulugan ito ng bawat sandaling walang patid o ng regular at nagpapatuloy na pangangalaga; pinananatili ang tunay na lawak ng salitang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “mga anak ni Israel” upang mapanatili ang pormal na katawagang Hebreo; iniwasan ang sobrang teknikal na parirala. Ang mga panandang talababa [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
