  naturalness: Likas sa modernong Filipino ang “mag-utos ka,” “magdala sila sa iyo,” at “mapanatiling nagniningas.” Ang “mapaningas” ay hindi gaanong karaniwan at medyo hindi malinaw sa kasalukuyang gamit.
  terminology: Pinananatili ang “mga anak ni Israel” bilang malapit na katumbas ng בְּנֵי יִשְׂרָאֵל. Ginamit ang “pagpapailaw” para sa לַמָּאוֹר at “ilawan” para sa נֵר, upang malinaw na maiba ang layunin ng langis sa ilawang pinananatiling nagniningas.
