  text: וְ/עָשִׂ֥יתָ אֶת הַ/מִּזְבֵּ֖חַ עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אֹ֜רֶךְ וְ/חָמֵ֧שׁ אַמּ֣וֹת רֹ֗חַב רָב֤וּעַ יִהְיֶה֙ הַ/מִּזְבֵּ֔חַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/001.yaml
  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: tl
  text: Gawin mo ang altar mula sa kahoy na akasya. Limang siko ang haba nito at limang siko ang lapad. Dapat parisukat ang altar, at tatlong siko ang taas nito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Sa konteksto ng magkakasunod na tagubilin, ang anyong pandiwa na may prefixed conjunction ay may puwersa ng tuwirang utos. Natural at malinaw sa modernong Tagalog ang “Gawin mo.”
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Karaniwang katumbas ng מִזְבֵּחַ sa konteksto ng mga handog at ng tabernakulo; pinananatili rin ang pagiging tiyak ng pangngalan.
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ipinapahayag ng pariralang konstrukto ang materyales na gagamitin. Ang “kahoy na akasya” ay malinaw at pamilyar kaysa transliterasyong “sitim.”
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: Limang siko ang haba nito
  rationale: Natural na paraan sa Tagalog ng paglalahad ng sukat, habang pinananatili ang sinaunang yunit na “siko.”
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: at limang siko ang lapad
  rationale: Pinananatili ang parallel na paglalahad ng haba at lapad sa malinaw na modernong Tagalog.
- source_word: רָבוּעַ יִהְיֶה
  choice: Dapat parisukat
  rationale: Ang רָבוּעַ ay tumutukoy sa hugis na parisukat. Ipinapahayag ng “dapat” ang direktibang puwersa ng יִהְיֶה sa kontekstong ito nang hindi gumagamit ng lipas na pananalita.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: at tatlong siko ang taas nito
  rationale: Tumpak na ipinapahayag ang קֹמָה bilang taas at pinananatili ang possessive suffix sa “nito.”
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Hinati sa tatlong pangungusap upang maging malinaw ang utos at mga sukat. Hindi isinama ang footnote ng English consultation layer dahil mali ang pagkakalagay nito: ang alternatibong “foursquare” ay tumutukoy sa רָבוּעַ, hindi sa “acacia wood,” at wala itong makabuluhang alternatibong salin sa Tagalog bukod sa “parisukat.”'
