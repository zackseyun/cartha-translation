  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “patungan” at “bigkis” upang maiwasan ang teknikal o lipas na pananalita, habang ang mga tunay na leksikal na pag-aalinlangan ay inilagay sa mga talababa.
