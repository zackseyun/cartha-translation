  language: tl
  text: kasama ang dalawampung haligi nito at ang dalawampung tansong patungan ng mga ito,[a] at ang mga kawit ng mga haligi at ang mga bigkis[b] ng mga ito ay yari sa pilak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga suksukan” sa halip na “mga patungan,” bilang mga suportang pinagkakabitan ng mga haligi.
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang kahulugan ng salitang Hebreo na isinaling “mga bigkis”; sa ilang salin, “mga pahalang na pang-ugnay.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדָיו
  choice: dalawampung haligi nito
  rationale: Ang עַמּוּד ay “haligi.” Ang hulaping 3ms ay tumutukoy sa bahaging inilarawan sa naunang talata, kaya pinanatili ang “nito.”
- source_word: אַדְנֵיהֶם
  choice: dalawampung ... patungan ng mga iyon
  rationale: Sa konteksto ng tabernakulo, ang אֶדֶן ay patungan o suklob na sumusuporta sa haligi. Ang “patungan” ay malinaw at likas sa modernong Filipino.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang נְחֹשֶׁת sa copper o bronze; “tanso” ang karaniwan at angkop na katawagan sa Filipino para sa materyal na ito sa konteksto ng tabernakulo.
- source_word: וָוֵי
  choice: mga kawit
  rationale: Ang וָו ay karaniwang tumutukoy sa mga kawit na ginagamit sa balangkas ng tabernakulo.
- source_word: חֲשֻׁקֵיהֶם
  choice: mga bigkis ng mga iyon
  rationale: Hindi tiyak ang eksaktong bahaging tinutukoy. Ang “bigkis” ay hindi lipas at hindi rin labis na nagtatakda ng anyo o gamit nito.
- source_word: כָּסֶף
  choice: yari sa pilak
  rationale: Tuwirang katawagan ito sa materyal na pilak; nilinaw ng “yari sa” na ito ang materyal ng mga kawit at bigkis.
- source_word: וְ
  choice: kasama / at
  rationale: Ang unang pang-ugnay ay nagdurugtong sa paglalarawan sa naunang talata, kaya natural ang “kasama”; ang kasunod ay isinalin bilang “at.”
