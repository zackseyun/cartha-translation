translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang pamilyar na terminong “tabernakulo,” samantalang ang “kagamitan,” “tulos,” at “patyo” ay madaling maunawaan ng karaniwang mambabasa. Inilagay ang pananda ng talababa pagkatapos mismo ng “tanso,” ang salitang tinatalakay nito.
