  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: tl
  text: Lahat ng kagamitan ng tabernakulo para sa lahat ng paglilingkod dito, pati ang lahat ng tulos nito at ang lahat ng tulos ng patyo, ay dapat na bronse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tanso”; ang salitang Hebreo na נְחֹשֶׁת ay maaaring tumukoy sa tanso o, sa mas malawak na gamit, sa metal na nakabatay sa tanso, gaya ng bronse.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: mga kagamitan
  rationale: Malawak ang saklaw ng כְּלִי at tumutukoy rito sa mga kasangkapan o bagay na ginagamit sa paglilingkod; natural at hindi labis na makitid ang “mga kagamitan.”
- source_word: הַמִּשְׁכָּן
  choice: ang tabernakulo
  rationale: Ang מִשְׁכָּן ay ang banal na tahanang tolda. Ang “tabernakulo” ang kinikilalang terminong Filipino sa kontekstong ito.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: para sa lahat ng paglilingkod dito
  rationale: Ipinahihiwatig ng parirala ang lahat ng gawaing paglilingkod na kaugnay ng tabernakulo. Nililinaw ng “dito” na ang hulaping panghalip ay tumutukoy sa tabernakulo, nang hindi ipinapalagay na ang gusali mismo ang naglilingkod.
- source_word: יְתֵדֹתָיו
  choice: lahat ng tulos nito
  rationale: Ang יָתֵד ay tulos o peg na ginagamit upang patatagin ang toldang estruktura. Karaniwan at malinaw sa Filipino ang “tulos.”
- source_word: יִתְדֹת הֶחָצֵר
  choice: lahat ng tulos ng patyo
  rationale: Ang חָצֵר ay ang napaliligirang patyo sa palibot ng tabernakulo; “patyo” ang natural na modernong salin.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay maaaring tumukoy sa purong copper o sa copper-based alloy na bronze. Sa Filipino, “tanso” ang karaniwang pangkalahatang katawagan sa metal na ito sa kontekstong biblikal, habang pinananatili sa talababa ang leksikal na lawak.
