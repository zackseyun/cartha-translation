base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: tl
  text: Sa Toldang Tipanan, sa labas ng tabing na nasa harap ng Patotoo[a], aayusin[b] iyon ni Aaron at ng kanyang mga anak na lalaki sa harap ni Yahweh mula gabi hanggang umaga. Ito ay isang tuntuning panghabang-panahon para sa mga Israelita sa lahat ng kanilang salinlahi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Patotoo” ay malamang na tumutukoy sa mga tapyas na bato ng tipan na nasa loob ng kaban; kaya inilalarawan dito ang puwesto ng tabing kaugnay ng kaban.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “ilalagay sa wastong ayos.” Ang pandiwang Hebreo ay maaaring tumukoy sa pag-aayos o pagtatakda sa wastong ayos ng paglilingkod sa mga ilawan.
    reason: lexical_alternative
  - marker: c
    text: 'Mas literal: “para sa kanilang mga salinlahi, mula sa mga anak ni Israel.” Ang pangwakas na parirala ay maaari ring idiin ang pinagmumulan o pananagutan ng mga Israelita.'
    reason: textual_clarity
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: Sa Toldang Tipanan
  rationale: Ginagamit ang likas at kinikilalang katawagang Filipino para sa teknikal na pangalan ng santuwaryo kung saan nakikipagtagpo ang Diyos sa Israel.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: sa labas ng tabing
  rationale: Ang פָּרֹכֶת ay ang panloob na tabing na naghihiwalay sa Dakong Kabanal-banalan; malinaw at marangal sa kasalukuyang Filipino ang “tabing.”
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: na nasa harap ng Patotoo
  rationale: Bagaman karaniwang nangangahulugang “sa ibabaw” ang עַל, dito ay inilalarawan nito ang puwesto ng tabing kaugnay ng kaban na kinalalagyan ng Patotoo.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: aayusin iyon
  rationale: Pinananatili ng “aayusin” ang pangunahing diwa ng ערך na pag-aayos o pagtatalaga sa wastong kaayusan, at ng “iyon” ang isahang layon ng Hebreo nang hindi labis na tinutukoy kung ano ang tinutukoy nito mula sa naunang konteksto.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: mula gabi hanggang umaga
  rationale: Direkta at natural na pahayag ng buong panahong gabi kung kailan isinasagawa ang tungkulin.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang kultikong idyomang “sa harap” at isinasalin ang tahasang pangalan ng Diyos na יהוה bilang “Yahweh.”
- source_word: חֻקַּת עוֹלָם
  choice: isang tuntuning panghabang-panahon
  rationale: Ipinahahayag ang patuloy at matibay na bisa ng tuntuning pangtipan nang hindi pinipilit ang pilosopikal na kahulugan ng ganap na walang hanggan.
- source_word: לְדֹרֹתָם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng salinlahi ng mga Israelita
  rationale: Natural na Filipino ito para sa nagpapatuloy na pananagutan sa bawat salinlahi ng Israel; itinatala sa talababa ang mas pormal na anyo ng pangwakas na parirala.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa teksto; ang “Yahweh” ay tuwirang kumakatawan sa pangalan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng חֻקַּת עוֹלָם
  choice: tuntuning panghabang-panahon
  alternative: tuntuning permanente; tuntuning walang hanggan
  rationale: Pinananatili nito ang matibay at patuloy na bisa ng pormulang legal sa tipan, ngunit hindi nagpapasok ng konklusyon tungkol sa metafisikal na kawalang-hanggan.
- issue: Kahulugan ng הָעֵדֻת
  choice: Patotoo
  alternative: mga tapyas ng tipan
  rationale: Pinananatili ang teknikal at bahagyang di-tiyak na katawagang Hebreo; ipinapaliwanag lamang sa talababa ang malamang na tinutukoy nito sa konteksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginawang pantangi ang “Toldang Tipanan” at “Patotoo” dahil teknikal na katawagan ang mga ito sa konteksto. Iniwasan ang labis na pagpapaliwanag sa pangunahing teksto at inilagay sa mga talababa ang mahahalagang alternatibo at kontekstuwal na paliwanag.
