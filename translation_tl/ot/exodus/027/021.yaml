revisions:
- from: Sa Toldang Tipanan, sa labas ng tabing na nasa harap ng Patotoo[a], aayusin[b] iyon ni Aaron at ng kanyang mga anak sa harap ni Yahweh mula gabi hanggang umaga. Ito ay isang tuntuning panghabang-panahon sa lahat ng salinlahi ng mga Israelita.[c]
  to: Sa Toldang Tipanan, sa labas ng tabing na nasa harap ng Patotoo[a], aayusin[b] iyon ni Aaron at ng kanyang mga anak na lalaki sa harap ni Yahweh mula gabi hanggang umaga. Ito ay isang tuntuning panghabang-panahon para sa mga Israelita sa lahat ng kanilang salinlahi.[c]
  rationale: Inilagay sa pangunahing teksto ang kaugnayan ng tuntunin sa mga Israelita upang hindi maiwan sa talababa ang pangwakas na pariralang Hebreo. Pinanatili ng “para sa” ang isang lehitimong, di-mapilit na pagbasa ng מֵאֵת, at iniingatan ng talababa ang iba pang posibleng puwersa nito. Ginawang “mga anak na lalaki” ang בָנָיו at pinatumpak ang paliwanag tungkol sa Patotoo.
  reviewer_model: gpt-5.6-terra
