  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: tl
  text: Gumawa ka ng mga sungay nito sa apat na sulok nito. Ang mga sungay nito ay dapat na iisang piraso ng altar[a], at balutan mo ito ng bronse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “magmumula rito ang mga sungay nito,” na nagpapahiwatig na hinubog ang mga sungay bilang iisang piraso ng altar at hindi ikinabit nang hiwalay.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong nechoshet ay maaaring tumukoy sa bronse o tanso; “bronse” ang ginamit dito bilang malamang na kahulugan sa konteksto ng paggawa ng altar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gumawa ka
  rationale: Ang Qal perfect na may waw sa konteksto ng sunod-sunod na tagubilin ay may puwersang pautos. Likas at malinaw sa makabagong Tagalog ang “Gumawa ka.”
- source_word: קַרְנֹתָיו
  choice: mga sungay nito
  rationale: Pinananatili nito ang kongkretong larawan ng mga nakausling hugis-sungay sa altar.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: sa apat na sulok nito
  rationale: Ang “sa” ay natural na katumbas ng עַל sa lokasyong ito at malinaw na tumutukoy sa apat na sulok ng altar.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: Ang mga sungay nito ay dapat kaisang piraso nito
  rationale: Ipinahahayag nito ang diwang ang mga sungay ay likas na bahagi ng altar at hindi hiwalay na ikinabit, habang iniingatan sa talababa ang mas literal na anyong “mula rito.”
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: at balutan mo ito
  rationale: Sa Piel, ang צפה ay tumutukoy sa paglalapat ng isang metal na sapin sa isang bagay. Natural sa Tagalog ang “balutan” sa ganitong tagubilin sa paggawa.
- source_word: נְחֹשֶׁת
  choice: bronse
  rationale: Maaaring tumukoy ang salita sa copper o bronze. Pinili ang “bronse” bilang malamang na metal sa kontekstong ito ng paggawa ng altar, at itinala ang “tanso” bilang leksikal na alternatibo.
