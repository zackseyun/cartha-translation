  yaml_path: translation/ot/exodus/027/015.yaml
  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: tl
  text: At para sa ikalawang panig ay magkakaroon ng mga tabing na labinlimang siko ang haba, na may tatlong haligi at tatlong patungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatlong saksakan.” Ang salitang Hebreo ay tumutukoy sa mga pundasyong piyesa na kinatatayuan o kinasasaksakan ng mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף
  choice: At para sa ... panig
  rationale: Bagaman literal na “balikat” ang כָּתֵף, tumutukoy ito rito sa isang panig ng bakuran ng tabernakulo.
- source_word: הַ/שֵּׁנִית
  choice: ikalawang
  rationale: Tuwirang katumbas ito ng ordinal na Hebreo; sa konteksto, ito ang katapat na panig.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: labinlimang siko ang haba
  rationale: Walang hayag na yunit sa talatang ito, ngunit ipinahihiwatig ng magkatulad na pahayag sa naunang talata na labinlimang siko ang sukat, hindi labinlimang magkakahiwalay na tabing.
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Tumutukoy ito sa mga hinabing telang bumubuo sa paligid ng bakuran; natural at malinaw sa modernong Tagalog ang “mga tabing.”
- source_word: עַמֻּדֵי/הֶם
  choice: tatlong haligi
  rationale: Ang עַמּוּד ay mga patayong suportang pinagkakabitan ng mga tabing; ang “haligi” ang malinaw at angkop na salin.
- source_word: וְ/אַדְנֵי/הֶם
  choice: at tatlong patungan
  rationale: Ang אֶדֶן ay pundasyong piyesa o socket na kinatatayuan ng haligi; malinaw sa karaniwang mambabasa ang “patungan.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Isinama sa teksto ang ipinahihiwatig na yunit na “siko” at nilinaw na sukat ng haba ito. Iniwasan ang sobrang teknikal na “socket” sa pangunahing teksto ngunit inilagay ang kahalili sa talababa.
