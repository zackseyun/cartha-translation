base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: tl
  text: Para sa pasukan ng patyo, magkakaroon ng tabing[a] na dalawampung siko ang haba,[b] na yari sa sinulid na asul, purpura, at iskarlata, at sa pinong linong pinilipit—gawa ng tagapagburda. Apat ang mga haligi nito at apat din ang mga saligan nito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kurtina” o “nakasabit na pantakip” sa pasukan.
    reason: lexical_alternative
  - marker: b
    text: Literal na “dalawampung siko”; idinagdag ang “ang haba” upang luminaw ang sukat na tinutukoy.
    reason: clarity
  - marker: c
    text: Maaari ring “mga saksakan” o “mga patungan” ng mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Para sa pasukan ng patyo
  rationale: Ang שַׁעַר ay maaaring tumukoy sa pintuang-daan o pasukan. Mas natural ang “pasukan” dito sapagkat tabing, hindi matigas na pinto, ang inilalarawan; malinaw namang napapanatili ng “patyo” ang kahulugan ng חָצֵר.
- source_word: מָסָךְ
  choice: tabing
  rationale: Sa konteksto ng tabernakulo, tumutukoy ito sa nakasabit na pantakip sa pasukan. Ang “tabing” ay likas at madaling maunawaan, nang hindi nagpapahiwatig ng matigas na pinto.
- source_word: עֶשְׂרִים אַמָּה
  choice: dalawampung siko ang haba
  rationale: Literal na “dalawampung siko” ang Hebreo. Idinagdag ang “ang haba” upang maging malinaw sa Tagalog kung anong sukat ng tabing ang tinutukoy.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: sinulid na asul, purpura, at iskarlata
  rationale: Ipinahihiwatig ng kontekstong tekstil ang kinulayang materyal. Ang “sinulid” ay inilapat sa buong talaan upang maging malinaw at hindi paulit-ulit.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: pinong linong pinilipit
  rationale: Pinananatili nito kapwa ang uri ng materyal, שֵׁשׁ, at ang paraan ng pagkakayari, מָשְׁזָר.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: gawa ng tagapagburda
  rationale: Pinananatili ang anyong tumutukoy sa bihasang manggagawa at ang diwa ng pandekorasyong gawaing tekstil.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה
  choice: Apat ang mga haligi ng mga iyon
  rationale: Pinananatili ang tahasang pangmaramihang hulaping paari na -הם, kahit hindi lubos na tiyak sa agarang konteksto ang tinutukoy nitong pangmaramihang antecedent.
- source_word: וְאַדְנֵיהֶם אַרְבָּעָה
  choice: apat din ang mga tuntungan ng mga iyon
  rationale: Ang אֶדֶן ay suportang nasa ibaba ng haligi, kaya malinaw at karaniwan ang “tuntungan.” Pinananatili rin ang pangmaramihang hulaping paari.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “patyo,” “tabing,” at “tuntungan” bilang karaniwang salitang arkitektural. Hindi pinakinis ang pangmaramihang hulaping paari sa hulí ng talata upang mapanatili ang anyo at bahagyang kalabuan ng Hebreo.
