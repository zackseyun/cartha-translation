translation_notes:
  register: Makabagong Filipino Tagalog na malinaw at marangal. Pinanatili ang maikli at teknikal na himig ng mga tagubilin sa pagtatayo, pati ang pagtukoy ng mga panghalip na hulapi sa mga tabing o sa kaugnay na kaayusan.
