  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: tl
  text: At sa lapad ng patyo, sa gawing kanluran[a], ay may mga tabing na limampung siko, na may sampung haligi at sampung tuntungan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa gawing dagat,” isang karaniwang katawagan para sa kanluran.
    reason: lexical_alternative
  - marker: b
    text: O “mga paanan”; mga salalayan ng mga haligi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: At sa lapad ng patyo
  rationale: Ang רֹחַב ay “lapad,” at ang חָצֵר sa konteksto ng tabernakulo ay ang nakabakod na patyo. Pinananatili ng “At” ang pang-ugnay na וְ.
- source_word: לִ/פְאַת יָ֔ם
  choice: sa gawing kanluran
  rationale: Ang פֵאָה ay panig o dako. Literal na “dagat” ang יָם, ngunit karaniwang panandang direksiyon ito para sa kanluran sa Hebreo.
- source_word: קְלָעִ֖ים
  choice: mga tabing
  rationale: Tumutukoy ito sa mga telang nakasabit na nagsisilbing bakod ng patyo. Ang “mga tabing” ay natural at hindi nagdaragdag ng espesipikong anyo na wala sa teksto.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: limampung siko
  rationale: Tuwirang pinananatili ang sinaunang yunit na אַמָּה bilang “siko,” nang hindi nagdaragdag ng di-tiyak na modernong katumbas.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: sampu ang mga haligi ng mga ito
  rationale: Pinananatili ang pangmaramihang hulaping “kanila/ang mga iyon,” na tumutukoy sa kaayusan ng mga tabing, habang gumagamit ng natural na ayos ng pangungusap sa Tagalog.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: at sampu rin ang mga tuntungan ng mga ito
  rationale: Ang אֶדֶן ay salalayan o socket ng haligi. Malinaw sa karaniwang mambabasa ang “tuntungan,” at pinananatili rin ang hulaping tumutukoy sa mga iyon.
