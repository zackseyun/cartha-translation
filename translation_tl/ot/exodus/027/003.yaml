translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang tuwirang anyong panghinaharap bilang pautos sa mga tagubilin. Inulit ang ‘mga’ sa talaan upang maging natural at madaling sundan, at iniwasan ang mga katawagang lipas o labis na teknikal.
