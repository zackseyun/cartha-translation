base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: tl
  text: Gagawa ka ng mga palayok nito para sa pag-aalis ng abo nito[a], mga pala, mga mangkok, mga tinidor, at mga kawali para sa baga. Gagawa ka ng lahat ng kagamitan nito na yari sa bronse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “para alisin ang matabang abo nito”; tumutukoy ang pananalita sa paglilinis ng abong nalilikha ng mga handog sa altar.
    reason: lexical_alternative
  - marker: b
    text: O “tanso”; ang salitang Hebreo ay maaaring tumukoy sa tanso o sa bronse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal na ikalawang panauhang panlalaki na isahan ay may puwersang pautos sa konteksto ng mga tagubilin; natural sa modernong Tagalog ang anyong panghinaharap bilang direktiba.
- source_word: סִּירֹתָיו
  choice: mga palayok nito
  rationale: Ang pangngalan ay tumutukoy sa mga sisidlan o palayok; pinananatiling pangkalahatan dahil inilalahad ng kasunod na parirala ang gamit ng mga ito.
- source_word: לְדַשְּׁנוֹ
  choice: para sa pag-aalis ng mga abo nito
  rationale: Sa Piel, tumutukoy ang pandiwa sa pag-aalis ng abong nalilikha sa altar. Malinaw ang saling ito habang ang mas literal na ideya ng ‘matabang abo’ ay inilalagay sa talababa.
- source_word: יָעָיו
  choice: mga pala
  rationale: Tumutukoy ito sa mga kasangkapang ginagamit sa paghawak o pag-aalis ng abo at baga; karaniwan at malinaw ang ‘mga pala.’
- source_word: מִזְרְקֹתָיו
  choice: mga mangkok
  rationale: Tumutukoy ang salita sa mga sisidlang ginagamit sa ritwal, kabilang ang paglalagay o pagsasaboy ng dugo. Ang ‘mangkok’ ay natural at sapat na malawak sa Tagalog.
- source_word: מִזְלְגֹתָיו
  choice: mga tinidor
  rationale: Ang pangngalan ay tumutukoy sa mga kasangkapang hugis-tinidor; iniiwasan nito ang mas interpretatibong ‘mga kawit para sa karne.’
- source_word: מַחְתֹּתָיו
  choice: mga lalagyan ng baga
  rationale: Sa kontekstong ito, tumutukoy ito sa mga sisidlang ginagamit sa pagdadala ng baga o apoy. Mas malinaw ito kaysa sa ‘insensaryo,’ na maaaring magpahiwatig ng ibang tiyak na gamit.
- source_word: לְכָל־כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang כְּלִי at sumasaklaw sa lahat ng kasangkapang kaugnay ng altar; natural sa Tagalog ang ‘kagamitan.’
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Ang נְחֹשֶׁת ay maaaring tumukoy sa copper o bronze. ‘Tanso’ ang tradisyonal at likas na salitang Tagalog sa ganitong konteksto, habang pinananatili sa talababa ang tiyak na alternatibong metal.
