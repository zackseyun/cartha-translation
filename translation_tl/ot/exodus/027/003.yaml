revisions:
- from: Gagawa ka ng mga palayok nito para sa pag-aalis ng mga abo nito[a], pati ng mga pala, mga mangkok, mga tinidor, at mga lalagyan ng baga nito. Gagawin mong tanso[b] ang lahat ng kagamitan nito.
  to: Gagawa ka ng mga palayok nito para sa pag-aalis ng abo nito[a], mga pala, mga mangkok, mga tinidor, at mga kawali para sa baga. Gagawa ka ng lahat ng kagamitan nito na yari sa bronse[b].
  rationale: Inayos ang paglalarawan sa materyal upang malinaw na ang mga kagamitan ay gagawin na yari sa bronse. Pinalitan ang di-natural at di-tumpak na talababa tungkol sa metal, at ginawang mas tiyak ang katawagan para sa mga firepan habang pinananatili ang saklaw at pagkakasunod ng Hebreo.
