  - severity: medium
    issue: 'Mali at nakalilitong alternatibong katawagan sa talababa b: “bronseng tanso.”'
    rationale: Magkaibang terminong Filipino ang “bronse” at “tanso”; ang wastong alternatibo para sa pangunahing “bronse” ay “tanso.”
  - severity: low
