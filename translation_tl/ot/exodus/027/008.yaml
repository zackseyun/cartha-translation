  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: tl
  text: Gagawin mo itong hungkag na yari sa mga tabla.[a] Kung paano ito ipinakita sa iyo sa bundok, gayon nila ito gagawin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hungkag na gawa sa mga tabla.” Inilalarawan ng Hebreo ang altar bilang isang hungkag na kayariang gawa sa mga tabla.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: hungkag na yari sa mga tabla
  rationale: Ipinahihiwatig ng parirala na ang altar ay hindi buo o siksik sa loob kundi isang hungkag na kayariang binuo sa mga tabla. Likas at malinaw sa modernong Tagalog ang pariralang ito.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Gagawin mo itong
  rationale: Pinananatili ang tuwirang utos sa ikalawang panauhang isahan na ibinigay kay Moises.
- source_word: כַּאֲשֶׁר
  choice: Kung paano
  rationale: Likas na ipinahahayag sa Tagalog ang paghahambing sa huwarang ipinakita sa bundok.
- source_word: הֶרְאָה אֹתְךָ
  choice: ito ipinakita sa iyo
  rationale: Pinananatili ang balintiyak na anyo ng Hebreo at hindi tahasang pinapangalanan ang ipinahiwatig na banal na tagapagpakita.
- source_word: בָּהָר
  choice: sa bundok
  rationale: Karaniwan at likas na katumbas sa Tagalog para sa lugar kung saan ipinakita ang huwaran.
- source_word: כֵּן יַעֲשׂוּ
  choice: gayon nila ito gagawin
  rationale: 'Pinananatili ang maramihang pandiwa at ang ugnayang paghahambing: ayon sa ipinakita, ganoon ito gagawin ng mga manggagawa.'
