translation:
  language: tl
  text: Labinlimang siko ang haba ng mga tabing para sa isang gilid, kasama ang tatlo nitong haligi at tatlo nitong patungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: labinlimang siko ang haba
  rationale: Tuwirang ipinapahayag ang sukat na labinlimang siko; idinagdag ang “ang haba” bilang likas na Filipino upang luminaw na sukat ng haba ang tinutukoy, nang walang dagdag na impormasyon.
- source_word: קְלָעִים
  choice: mga tabing
  rationale: Sa konteksto ng looban ng tabernakulo, tumutukoy ito sa mga telang nakabitin na nagsisilbing hangganan. Ang “mga tabing” ay malinaw, natural, at angkop sa kasalukuyang Filipino.
- source_word: לַכָּתֵף
  choice: para sa isang gilid
  rationale: Bagaman literal na “para sa balikat,” ginagamit dito ang כָּתֵף sa arkitektural na diwang “gilid” o “tagiliran,” partikular sa isang panig ng pasukan na may katapat sa susunod na talata.
- source_word: עַמֻּדֵיהֶם
  choice: ang tatlong haligi nito
  rationale: Ang עַמּוּד ay haligi o poste; “haligi” ang marangal at karaniwang terminong angkop sa paglalarawan ng tabernakulo. Ang panghalip ay tumutukoy sa ayos ng mga tabing sa gilid na iyon.
- source_word: אַדְנֵיהֶם
  choice: ang tatlong patungan nito
  rationale: Ang אֶדֶן ay suportang base o hugis-suksukang patungan ng haligi. Malinaw sa ordinaryong mambabasa ang “patungan” at naipahihiwatig nito ang tungkuling sumuporta sa mga haligi.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinili ang “isang gilid” sa halip na literal na “balikat” sapagkat iyon ang likas na arkitektural na kahulugan sa konteksto. Ginamit ang “tabing,” “haligi,” at “patungan” bilang madaling maunawaang mga terminong pangkonstruksiyon.
