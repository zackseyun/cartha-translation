translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang isahang “mo” dahil iisang kausap ang nasa Hebreong tagubilin. Iniwasan ang sobrang teknikal na bokabularyo, habang pinanatili sa talababa ang kawalang-katiyakan sa כַּרְכֹּב at ang mas literal na anyo ng huling sugnay.
