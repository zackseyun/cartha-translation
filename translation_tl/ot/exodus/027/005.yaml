  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: tl
  text: Ilagay mo iyon sa ilalim ng nakausling gilid[a] ng altar, sa gawing ibaba, at aabot ang sala-sala hanggang sa kalagitnaan ng altar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakausling palibot” o “nakausling balangkas.” Hindi tiyak ang eksaktong anyo ng Hebreong karkov.
    reason: lexical_alternative
  - marker: b
    text: 'Sa literal: “at ang sala-sala ay magiging hanggang sa kalahati ng altar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Ilagay mo
  rationale: Ang נָתַן, kapag may tuwirang layon at pook na paglalagyan, ay likas na isinasalin bilang “ilagay.” Napananatili rin ng anyong ito ang puwersa ng tagubilin sa ikalawang panauhan.
- source_word: אֹתָהּ
  choice: iyon
  rationale: Tumutukoy ang panghalip na pambabaeng isahan sa sala-salang tanso sa naunang talata. Ang “iyon” ay natural na panghalip para sa bagay sa Tagalog at malinaw ang pagtukoy pabalik.
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang ipinapahayag nito ang posisyong nasa ibaba ng nakausling gilid ng altar.
- source_word: כַּרְכֹּב
  choice: nakausling gilid
  rationale: Ang bihirang terminong pang-arkitekturang ito ay tumutukoy sa isang nakausling hangganan, gilid, o balangkas. Mas malinaw sa karaniwang mambabasa ang “nakausling gilid” kaysa sa isang teknikal o malabong katawagan.
- source_word: הַמִּזְבֵּחַ
  choice: ang altar
  rationale: Ang “altar” ang karaniwan at madaling maunawaang salin ng מִזְבֵּחַ sa konteksto ng tabernakulo.
- source_word: מִלְּמָטָּה
  choice: sa gawing ibaba
  rationale: Ipinapahiwatig ng parirala ang ibabang bahagi o ilalim. Pinananatili ng “sa gawing ibaba” ang detalyeng pangpuwesto nang hindi nagpapasya sa eksaktong paraan ng pagkakabit.
- source_word: וְהָיְתָה
  choice: at aabot
  rationale: Literal itong “at magiging,” ngunit kasama ng עַד ay inilalarawan nito ang hangganan o lawak ng sala-sala. Ang “at aabot” ay natural sa Tagalog at hindi nagdaragdag ng diwa ng layunin.
- source_word: הָרֶשֶׁת
  choice: ang sala-sala
  rationale: Ang רֶשֶׁת ay isang kayariang parang lambat o parilya. Ang “sala-sala” ay malinaw na naglalarawan sa anyong magkakrus o may mga butas nang hindi ipinapalagay na malambot itong lambat.
- source_word: עַד חֲצִי הַמִּזְבֵּחַ
  choice: hanggang sa kalagitnaan ng altar
  rationale: Pinananatili nito ang payak na pahayag ng Hebreo tungkol sa hangganan ng sala-sala. Hindi tahasang idinaragdag ang “pataas,” bagaman malamang na patayong sukat ang tinutukoy sa konteksto.
