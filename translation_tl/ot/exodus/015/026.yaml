  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: tl
  text: Sinabi niya, “Kung buong ingat kang makikinig sa tinig ni Yahweh na iyong Diyos, gagawin mo ang matuwid sa kanyang paningin, pakikinggan mong mabuti ang kanyang mga utos, at tutuparin mo ang lahat ng kanyang mga tuntunin, hindi ko ipapataw sa iyo ang alinman sa mga sakit na ipinatong ko sa Ehipto, sapagkat ako si Yahweh, ang nagpapagaling sa iyo.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sapagkat ako si Yahweh, ang iyong Tagapagpagaling.”
    reason: Pinananatili ang nominal na alternatibo para sa participle na רֹפְאֶךָ.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: buong ingat kang makikinig
  rationale: Ipinahahayag ng pawatas na ganap kasama ng pandiwang may hangganan ang pinaigting na pakikinig. Pinananatili ng parirala ang diwang pandinig at ang kasamang masunuring pagtugon.
- source_word: לְקוֹל
  choice: sa tinig
  rationale: Tuwirang katumbas ng קוֹל at likas sa pariralang Filipino na “makinig sa tinig,” habang pinananatili ang Hebreong larawan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang tahasang pangalang tipan na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֶיךָ
  choice: iyong Diyos
  rationale: Tuwirang isinasalin ang katawagang pangtipan at ang ikalawang panauhang isahan.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: ang matuwid sa kanyang paningin
  rationale: Pinananatili ang idyomang Hebreo at ang moral na kahulugan ng יָשָׁר nang hindi ito pinapaliit sa kung ano lamang ang nakalulugod.
- source_word: וְהַאֲזַנְתָּ
  choice: pakikinggan mong mabuti
  rationale: Ipinakikita ang masusing pagbibigay-pansin na ipinahihiwatig ng Hiphil ng אזן at naihihiwalay nang bahagya sa naunang pinaigting na שׁמע.
- source_word: לְמִצְוֺתָיו
  choice: ang kanyang mga utos
  rationale: Ang “mga utos” ay malinaw at likas na makabagong Filipino para sa מִצְוֹת.
- source_word: וְשָׁמַרְתָּ
  choice: tutuparin mo
  rationale: Sa legal at pangtipang konteksto, ang שׁמר ay nangangahulugang sundin o tuparin; mas natural dito ang “tutuparin” kaysa literal na “iingatan.”
- source_word: כָּל חֻקָּיו
  choice: lahat ng kanyang mga tuntunin
  rationale: Ang “mga tuntunin” ay dignified ngunit madaling maunawaang katumbas ng mga itinakdang batas o חֻקִּים.
- source_word: כָּל הַמַּחֲלָה
  choice: ang alinman sa mga sakit
  rationale: Likas na isinasalin ang kolektibong isahan kasama ng pagtanggi bilang “alinman sa mga sakit,” nang hindi nililimitahan sa isang uri ng karamdaman.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם
  choice: na ipinatong ko sa Ehipto
  rationale: Pinananatili ang kongkretong diwa ng שׂים na “ilagay/ipataw” at ang Ehipto bilang tahasang layon ng tekstong Hebreo.
- source_word: לֹא אָשִׂים עָלֶיךָ
  choice: hindi ko ipapataw sa iyo
  rationale: Ang “ipapataw” ay natural sa Filipino para sa paglalagay ng parusa o salot at pinananatili ang ugnayang leksikal sa kasunod na “ipinatong.”
- source_word: רֹפְאֶךָ
  choice: ang nagpapagaling sa iyo
  rationale: Ang participle ay natural na naipahahayag bilang patuloy o katangiang kilos; pinananatili sa talababa ang posibleng nominal na salin.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ANG PANGINOON; Jehova
  rationale: Tahasan ang Tetragrammaton sa Hebreo. Pinananatili ng “Yahweh” ang personal at pangtipang pangalan nang hindi ito ginagawang titulo.
- issue: Saklaw ng pangako tungkol sa sakit
  choice: Isang kondisyunal na pangakong pangtipan kaugnay ng masunuring pakikinig at ng mga sakit na ipinatong sa Ehipto
  alternative: Isang pangkalahatang garantiya ng pisikal na paggaling sa bawat tao; o isang pawang espirituwal na talinghaga
  rationale: Ang mismong talata ay may kondisyong “kung” at nakaugat sa makasaysayang paghatol sa Ehipto. Hindi dinaragdagan ng salin ang pangako at hindi rin ito ginagawang talinghaga lamang.
- issue: Pakahulugan sa רֹפְאֶךָ
  choice: ang nagpapagaling sa iyo
  alternative: ang iyong Tagapagpagaling
  rationale: Maaaring unawain ang participle bilang pandiwang panuring o bilang pangngalang-tawag. Ginawang pangunahing salin ang mas natural na pandiwang Filipino at inilagay sa talababa ang nominal na posibilidad.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga larawang Hebreo na likas pa rin sa Tagalog, gaya ng “tinig” at “sa kanyang paningin,” ngunit ginamit ang mas natural na “tutuparin” para sa legal na diwa ng שׁמר. Isahan ang kausap sa buong talata.
