  source_fidelity: Tapat ang salin sa kondisyunal at pinaigting na panawagan sa pakikinig, sa magkakaugnay na mga kilos ng paggawa ng matuwid, pakikinig sa mga utos, at pagtupad sa mga tuntunin. Wasto ring naipahayag ang pangakong hindi ipapataw sa kausap ang mga sakit na inilagay sa Ehipto at ang pangwakas na pagpapakilala ni Yahweh bilang tagapagpagaling.
