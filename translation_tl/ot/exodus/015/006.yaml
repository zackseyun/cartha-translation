id: EXO.15.6
reference: Exodus 15:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: tl
  text: 'Ang iyong kanang kamay, Yahweh[a],

    ay maringal sa kapangyarihan[b];

    ang iyong kanang kamay, Yahweh,

    ay dumudurog sa kaaway[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; ayon sa tradisyon, isinasaling “ang PANGINOON.”'
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “maringal sa lakas.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “bumabasag sa kaaway” o “wawasak sa kaaway.”
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: יְמִינְךָ
  choice: ang iyong kanang kamay
  rationale: Pinananatili ang kongkretong larawan ng “kanang kamay,” na sa awit ng tagumpay ay nagpapahiwatig din ng lakas at matagumpay na pagkilos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay na “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: נֶאְדָּרִי
  choice: maringal
  rationale: Ipinahahayag ng salitang mula sa אדר ang karangalan, kadakilaan, o karingalan. Ang “maringal” ay angkop sa mataas ngunit likas na himig ng tulang Filipino.
- source_word: בַּכֹּחַ
  choice: sa kapangyarihan
  rationale: Sinasalamin nito ang בְּ at ang pangngalang כֹּחַ, na maaaring mangahulugang kapangyarihan, lakas, o kalakasan.
- source_word: תִּרְעַץ
  choice: dumudurog
  rationale: Pinananatili ng “dumudurog” ang marahas at ganap na puwersa ng pandiwang רָעַץ, na nangangahulugang durugin, basagin, o wasakin.
- source_word: אוֹיֵב
  choice: sa kaaway
  rationale: Pinananatili ang anyong isahan ng Hebreo; sa konteksto, maaari rin itong tumukoy nang pangkalahatan sa kalabang puwersa.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng tradisyonal na titulong “PANGINOON.”
- issue: Larawan ng kanang kamay ng Diyos
  choice: Pinanatili bilang “kanang kamay”
  alternative: kapangyarihan
  rationale: Hindi pinapalitan ng abstraktong paliwanag ang personipikado at makatang larawan. Naipahihiwatig na mismo ng konteksto ang kapangyarihan at matagumpay na pagkilos.
- issue: Panahunan at aspekto ng תִּרְעַץ
  choice: dumudurog
  alternative: dudurugin
  rationale: Maaaring magpahayag ang Hebreong imperfect ng kasalukuyan, paulit-ulit, o inaasahang pagkilos. Sa awit na nagbubunyi sa katangian at gawa ni Yahweh, ang “dumudurog” ay nagpapanatili ng makatang kasiglahan nang hindi ito nililimitahan sa hinaharap lamang.
translation_notes:
  register: Makabago at marangal na Filipino na may anyong patula. Pinanatili ang pag-uulit ng “ang iyong kanang kamay, Yahweh” upang maingatan ang paralelismo at diin ng Hebreong awit.
