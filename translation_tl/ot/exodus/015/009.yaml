  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: tl
  text: Sinabi ng kaaway, “Hahabulin ko sila, aabutan ko sila, hahatiin ko ang samsam. Masusunod ang aking pagnanasa sa kanila.[a] Bubunutin ko ang aking espada; itataboy sila ng aking kamay.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “Mapupuno ng mga iyon ang aking kalooban,” na maaari ring mangahulugang, “Magpapakasawa ako sa kanila.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lilipulin sila ng aking kamay” o “aalisin ng aking kamay ang kanilang pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: Sinabi ng kaaway
  rationale: Ang payak na nagdaang panahunan ay angkop sa salaysay na nasa awit, at ang tiyak na “kaaway” ay tumutukoy sa kumakatawang kaaway na Ehipto.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Hahabulin ko sila, aabutan ko sila
  rationale: Ipinahahayag ng mga pandiwa ang ipinagmamalaking balak ng kaaway; idinagdag ang likas na layong “sila” sa Filipino ayon sa konteksto.
- source_word: אֲחַלֵּק שָׁלָל
  choice: paghahati-hatian ko ang samsam
  rationale: Pinananatili nito ang karaniwang larawan ng paghahati ng nasamsam sa digmaan sa natural na modernong Filipino.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: Masisiyahan sa kanila ang aking pagnanasa
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa gana o pagnanasa, hindi kinakailangang sa “kaluluwa” bilang teknikal na katawagan. Pinananatili ng salin ang marahas na paghahangad habang inilalagay sa talababa ang mas literal na anyo.
- source_word: אָרִיק חַרְבִּי
  choice: Bubunutin ko ang aking espada
  rationale: Ang idyoma ay nangangahulugang bunutin ang espada mula sa kaluban; malinaw at natural ang “bubunutin” sa Filipino.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: itataboy sila ng aking kamay
  rationale: Ang Hiphil ng ירשׁ ay maaaring mangahulugang magtaboy o mag-alis ng pag-aari. Pinananatili ng “itataboy” ang pangunahing diwa nang hindi tiyakang pinipili ang mas interpretatibong “lilipulin”; inilalahad sa talababa ang tunay na saklaw ng kahulugan.
theological_decisions:
- issue: Ang lawak ng kahulugan ng תּוֹרִישֵׁמוֹ
  choice: itataboy sila ng aking kamay
  alternative: lilipulin sila ng aking kamay; aalisan sila ng pag-aari ng aking kamay
  rationale: Malabo sa konteksto kung ang diin ay pagpuksa, pagtataboy, o pag-agaw ng pag-aari. Hindi nilulutas nang tahimik ng pangunahing salin ang tensiyong ito, at itinatala ang mga alternatibo.
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ang sunod-sunod na maiikling pahayag ay nagpapanatili sa mabilis at mapagmalaking himig ng kaaway. Inilagay ang mga pananda ng talababa sa mismong pariralang tinutukoy ng bawat paliwanag.
