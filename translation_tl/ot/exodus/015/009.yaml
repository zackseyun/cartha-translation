  to: Sinabi ng kaaway, “Hahabulin ko sila, aabutan ko sila, hahatiin ko ang samsam. Masusunod ang aking pagnanasa sa kanila.[a] Bubunutin ko ang aking espada; itataboy sila ng aking kamay.”[b]
