base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/003.yaml
  text: Yahweh is a warrior[b][a]; Yahweh is his name.
translation:
  language: tl
  text: Si Yahweh[a] ay mandirigma[b]; Yahweh ang kanyang pangalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH; maaari ring isulat na “Jehovah.”'
    reason: alternative_reading
  - marker: b
    text: 'Mas literal: “isang lalaki ng digmaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אִישׁ מִלְחָמָה
  choice: mandirigma
  rationale: Ang literal na anyo ay “lalaki ng digmaan,” ngunit ang buong parirala ay likas na tumutukoy sa isang mandirigma. Ang “mandirigma” ay malinaw, matimbang, at natural sa makabagong Tagalog, habang inilalagay sa talababa ang mas literal na larawan.
- source_word: שְׁמוֹ
  choice: ang kanyang pangalan
  rationale: 'Pinananatili nito ang diin ng sugnay na walang tahasang pandiwa: “Yahweh—ang kanyang pangalan.”'
theological_decisions:
- issue: Paglalarawan kay Yahweh bilang אִישׁ מִלְחָמָה
  choice: mandirigma
  alternative: lalaki ng digmaan
  rationale: Hindi pinapahina ang larawan ng Diyos bilang nakikipaglaban para sa kanyang bayan, ngunit hindi rin ipinipilit sa pangunahing teksto ang salitang “lalaki” na sa Tagalog ay maaaring unawaing pahayag tungkol sa likas o kasarian sa halip na isang Hebreong idyoma.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito bilang pangalan sa salin.
translation_notes:
  register: Makabago, marangal, at maikli ang pananalita, gaya ng matinding himig ng awit. Ginamit ang “mandirigma” bilang natural na katumbas ng Hebreong idyoma, at pinanatili ang “Yahweh” bilang personal na pangalan.
