base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: tl
  text: 'Dadalhin mo sila at itatanim[a]

    sa bundok ng iyong mana,[b]

    sa lugar na ginawa mo bilang iyong tahanan, Yahweh—

    sa santuwaryo, Panginoon,[c] na itinatag ng iyong mga kamay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “itatatag.” Literal na “itatanim” ang pandiwang Hebreo, isang larawan ng ligtas at matatag na paninirahan.
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ang “bundok ng iyong mana” sa lupaing ibinibigay ng Diyos sa kanyang bayan sa malawak na diwa, o mas tiyak sa bundok ng santuwaryo ng Diyos.
    reason: alternative_reading
  - marker: c
    text: Kapuwa ginagamit sa Hebreo ng talatang ito ang personal na pangalang “Yahweh” at ang titulong “Panginoon.”
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Dadalhin mo sila
  rationale: Ang causative na anyo ng בוא ay nagsasaad na dadalhin sila ng Diyos patungo sa tinutukoy na lugar. Likas sa Filipino ang “dadalhin mo sila” nang hindi na kailangang idagdag ang isang salitang katumbas ng English na “in,” sapagkat nililinaw ng kasunod na parirala ang patutunguhan.
- source_word: וְתִטָּעֵמוֹ
  choice: at itatanim
  rationale: Pinananatili ng “itatanim” ang kongkretong larawang patula ng נטע, na dito ay nagpapahiwatig ng matatag at permanenteng paninirahan.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: sa bundok ng iyong mana
  rationale: Pinananatili nito ang imahen ng bundok at ang ugnayang genitibo ng נַחֲלָה bilang mana o minanang pag-aari ng Diyos, nang hindi tahasang tinutukoy kung buong lupain o bundok ng santuwaryo ang ibig sabihin.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: sa lugar ... upang iyong tahanan
  rationale: Ang מָכוֹן ay isang itinatag o inihandang lugar. Ang “lugar ... upang iyong tahanan” ay malinaw at natural, at pinananatili ang layunin nitong maging tahanan ng Diyos.
- source_word: פָּעַלְתָּ
  choice: na ginawa mo
  rationale: Ang פעל ay malawak na pandiwa para sa paggawa. Ang “ginawa mo” ay tuwiran at hindi nagdaragdag ng mas tiyak na diwang gaya ng “inihanda.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִקְּדָשׁ
  choice: sa santuwaryo
  rationale: Ang “santuwaryo” ay karaniwan at angkop na katumbas ng מקדש bilang banal na lugar.
- source_word: אֲדֹנָי
  choice: Panginoon
  rationale: Ang אֲדֹנָי ay titulong pantukoy sa Diyos. Isinasalin itong “Panginoon” upang maiba sa personal na pangalang Yahweh na nauna rito.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: na itinatag ng iyong mga kamay
  rationale: Ipinahahayag ng כון ang matibay na pagtatatag. Pinananatili rin ng salin ang antropomorpikong larawan ng mga kamay ng Diyos.
theological_decisions:
- issue: Paglalahad sa יְהוָה at אֲדֹנָי sa iisang talata
  choice: Isalin ang יְהוָה bilang “Yahweh” at ang אֲדֹנָי bilang “Panginoon.”
  alternative: Isalin ang dalawang katawagan bilang “Panginoon.”
  rationale: Magkaiba sa Hebreo ang personal na pangalan at ang titulo. Pinananatili ng salin ang pagkakaibang iyon nang walang idinaragdag na pakahulugang wala sa teksto.
- issue: Ang tinutukoy ng “bundok ng iyong mana” at ng “santuwaryo”
  choice: Panatilihin ang malawak na larawang patula nang hindi tahasang itinumbas ang bundok sa Zion lamang o sa buong Canaan lamang.
  alternative: Tukuyin ito nang tahasan bilang Zion/Bundok ng Templo, o bilang buong lupain ng Canaan.
  rationale: Maaaring tumingin ang tula kapuwa sa lupaing pananahanan ng Israel at, nang mas tiyak, sa bundok ng santuwaryo ng Diyos. Hindi nilulutas ng salin ang tensiyong hindi tahasang nilulutas ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino ang ginamit. Pinanatili ang paralelismo at mga larawang patula ng pagtatanim, bundok, tahanan, santuwaryo, at mga kamay. Ang “mana” ay pinili upang mapanatili ang teolohikal at patulang ugnayan ng נַחֲלָה, samantalang ipinapaliwanag sa talababa ang posibleng saklaw ng tinutukoy nito.
