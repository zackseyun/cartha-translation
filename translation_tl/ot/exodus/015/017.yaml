    sa santuwaryo, Panginoon,[c] na itinatag ng iyong mga kamay.'
  to: 'Dadalhin mo sila at itatanim[a]

    sa bundok ng iyong mana,[b]

    sa lugar na ginawa mo bilang iyong tahanan, Yahweh—

    sa santuwaryo, Panginoon,[c] na itinatag ng iyong mga kamay.'
  rationale: Pinalitan ang hindi wastong “upang iyong tahanan” ng “bilang iyong tahanan.” Pinananatili nito ang ugnayan ng lugar at ng panahanan ng Diyos sa מָכוֹן לְשִׁבְתְּךָ, habang nananatiling malinaw, natural, at patula sa modernong Filipino. Walang binago sa saklaw na sadyang malabo ng “bundok ng iyong mana” o sa pagkakaiba ng mga banal na pangalan.
