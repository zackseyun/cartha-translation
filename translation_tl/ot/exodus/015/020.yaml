base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Miriam, ang propetisa at kapatid ni Aaron, ang tamburin sa kanyang kamay. Lumabas ang lahat ng babae kasunod niya, na may mga tamburin at nagsasayaw.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “at may mga sayaw.” Maaaring tumukoy ang pangngalang Hebreo sa gawaing pagsasayaw o sa maramihang mga sayaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Pagkatapos, kinuha
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa Tagalog ang “Pagkatapos” habang pinananatili ang pangnagdaang kilos.
- source_word: מִרְיָם הַנְּבִיאָה
  choice: ng propetisang si Miriam
  rationale: Pinananatili ng “propetisa” ang tahasang anyong pambabae ng pangngalang Hebreo at malinaw itong tumutukoy kay Miriam.
- source_word: אֲחוֹת אַהֲרֹן
  choice: na kapatid ni Aaron
  rationale: Tahasan siyang ipinakikilala ng Hebreo bilang kapatid ni Aaron; hindi ito pinalitan ng pagtukoy kay Moises.
- source_word: הַתֹּף
  choice: ang tamburin
  rationale: Ang תֹף ay isang instrumentong de-pukpok na hawak sa kamay, malamang isang frame drum; “tamburin” ang malinaw at karaniwang modernong katumbas.
- source_word: בְּיָדָהּ
  choice: sa kanyang kamay
  rationale: Tuwirang isinasalin ang pariralang Hebreo at natural ito sa Tagalog.
- source_word: וַתֵּצֶאןָ כָל הַנָּשִׁים
  choice: Lumabas ... ang lahat ng babae
  rationale: Pinananatili ang kilos na “lumabas” at ang tahasang pagtukoy sa lahat ng kababaihan.
- source_word: אַחֲרֶיהָ
  choice: na kasunod niya
  rationale: Ipinapahayag ang pagsunod kay Miriam, gaya ng maaaring prusisyon o sama-samang pagkilos.
- source_word: בְּתֻפִּים
  choice: na may mga tamburin
  rationale: Pinananatili ang maramihang anyo at ang instrumental o kasamang gamit ng pang-ukol.
- source_word: וּבִמְחֹלֹת
  choice: at nagsasayaw
  rationale: Natural sa modernong Tagalog ang pandiwang anyo para sa masayang sama-samang pagsasayaw, habang ang literal na maramihang pangngalan ay inilalahad sa talababa.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “propetisa” upang mapanatili ang pambabaeng anyo sa Hebreo, at “tamburin” bilang madaling maunawaang katawagan sa instrumentong hawak sa kamay. Inilipat ang talababa sa “nagsasayaw,” na siyang salitang tinutukoy ng leksikal na alternatibo.
