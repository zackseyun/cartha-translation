base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: tl
  text: Maghahari si Yahweh[a] magpakailanman at magpasawalang-hanggan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH.” Karaniwang isinasalin na “ang PANGINOON”; maaari ring “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyong “Yahweh” upang mapanatili ang personal na pangalan ng Diyos na nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: יִמְלֹךְ
  choice: Maghahari
  rationale: Ang di-ganap na anyo ng מלך ay nauunawaan dito bilang panghinaharap sa konteksto ng awit ng tagumpay; natural ding ipinapahayag ng “maghahari” ang patuloy na paghahari bilang hari.
- source_word: לְעֹלָם
  choice: magpakailanman
  rationale: Ipinahahayag ng עוֹלָם sa kontekstong ito ang walang takdang tagal sa hinaharap; ang “magpakailanman” ay natural at marangal sa makabagong Tagalog.
- source_word: וָעֶד
  choice: at magpasawalang-hanggan
  rationale: Kasama ng לְעֹלָם, bumubuo ito ng isang pinatinding pahayag ng walang katapusang tagal. Pinananatili ng parirala ang pag-uulit at diin ng Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang nasa Hebreo nang hindi ito pinapalitan ng titulong “PANGINOON.”
translation_notes:
  register: Maikli, marangal, at patulang pahayag na angkop sa awit ng tagumpay. Ginamit ang “si Yahweh” sapagkat personal na pangalan ang paksa; pinanatili ang dobleng pagpapahayag ng walang hanggang tagal.
