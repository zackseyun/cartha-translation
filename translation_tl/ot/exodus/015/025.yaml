  source_fidelity: Tapat ang salin sa Hebreo. Ang “dumaing” ay angkop sa וַיִּצְעַק; ang “ipinakita ... ang isang puno” ay wastong pagsasalin ng וַיּוֹרֵהוּ ... עֵץ; at malinaw na naipahayag ang paghahagis sa tubig at pagkatamis ng tubig. Ang “tuntunin at hatol” ay pinananatili ang magkapares ngunit magkaibang legal na termino sa חֹק וּמִשְׁפָּט. Ang maramihang “kanila/sila” ay isang natural na Tagalog na pagpapahayag ng kolektibong Israel, bagaman isahan ang hulapi sa Hebreo.
  naturalness: Natural, malinaw, at may marangal na rehistrong angkop sa salaysay na biblikal. Ang pag-uugnay ng mga pangungusap at paggamit ng mga panghalip ay madaling sundan.
  terminology: Ang PANGINOON ay kaayon ng itinakdang pangalan sa audit trail. Ang “puno,” “matamis,” “tuntunin,” at “hatol” ay lahat katanggap-tanggap at hindi nagdaragdag ng interpretasyong wala sa pinagmulan.
