source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: tl
  text: Kaya dumaing siya sa PANGINOON, at ipinakita sa kanya ng PANGINOON ang isang puno. Inihagis niya iyon sa tubig, at naging matamis ang tubig. Doon ay nagtakda siya para sa kanila ng isang tuntunin at isang hatol, at doon niya sila sinubok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: dumaing
  rationale: Ipinahahayag nito ang matinding paghingi ng tulong nang hindi pinapahina ang lakas ng Hebreong pandiwa.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Gumagamit ng kinikilalang tradisyong Tagalog para sa banal na pangalan habang ipinakikita sa malalaking titik na pangalan itong pantangi.
- source_word: עֵץ
  choice: isang puno
  rationale: Ang pangunahing kahulugan ng עֵץ ay puno; hindi nililimitahan sa ‘kahoy’ o ‘piraso ng kahoy’ dahil hindi iyon tahasang sinasabi ng teksto.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: naging matamis ang tubig
  rationale: Pinananatili ang konkretong larawan ng Hebreo, na ang mapait na tubig ay naging matamis o maiinom.
- source_word: חֹק וּמִשְׁפָּט
  choice: isang tuntunin at isang hatol
  rationale: 'Pinananatili ang dalawang magkaibang terminong legal: itinakdang tuntunin at pasiya o hatol.'
- source_word: נִסָּהוּ
  choice: sinubok niya sila
  rationale: Tuwirang isinasalin ang pandiwa bilang pagsubok; ang panghalip ay tumutukoy sa bayan bilang kolektibong maramihan sa natural na Tagalog.
theological_decisions:
- issue: Paksa ng ‘nagtakda’ at ‘sumubok’
  choice: Pinanatiling di-tiyak sa panghalip na ‘siya/niya,’ gaya ng daloy ng Hebreo.
  alternative: Tahasan itong tukuyin bilang ‘ang PANGINOON.’
  rationale: Bagaman malamang na ang PANGINOON ang tinutukoy, hindi inuulit ng Hebreo ang pangalan sa mga sugnay na ito; iniiwasang gawing mas tahas ang salin kaysa sa pinagmulan.
- issue: Bilang ng tinutukoy ng panghalip sa huling sugnay
  choice: ‘sila’
  alternative: ‘siya’
  rationale: Ang hulaping Hebreo ay pormal na pangatlong panauhang panlalaking isahan, ngunit maaaring tumukoy nang kolektibo sa Israel; ang konteksto at naunang ‘para sa kanila’ ay natural na hinihingi ang kolektibong ‘sila’ sa Tagalog.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinanatili ang legal na pares na ‘tuntunin at hatol’ at ang literal na larawang ‘puno’ at ‘naging matamis,’ nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
