  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: tl
  text: Sa iyong tapat na pag-ibig, inakay mo ang bayang iyong tinubos[a]; sa iyong lakas, pinatnubayan mo sila patungo sa iyong banal na tahanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ang bayang ito na iyong tinubos.”
    reason: lexical_alternative
  - marker: b
    text: 'Ang “iyong banal na tahanan” ay maaaring tumukoy sa pangkalahatan sa lugar ng banal na presensiya ng Diyos. Iba-iba ang pagkaunawa rito: Sinai, ang lupang pangako, o Zion/templo.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: inakay mo
  rationale: Ang Hiphil ng נחה ay nangangahulugang manguna o gumabay. Likas sa makabagong Tagalog ang “inakay” at angkop ito sa pagliligtas at pangunguna ng Diyos sa bayan.
- source_word: בְחַסְדְּךָ
  choice: sa iyong tapat na pag-ibig
  rationale: Saklaw ng חֶסֶד ang pag-ibig, awa, at matatag na katapatan sa tipan. Pinananatili ng “tapat na pag-ibig” ang init ng pagmamahal at ang di-nagmamaliw na katapatan.
- source_word: עַם זוּ
  choice: ang bayan
  rationale: Maaaring tahasang isalin ang זוּ bilang “ito,” ngunit natural sa Tagalog ang “ang bayan” dahil tinutukoy na ito ng kasunod na sugnay. Inilalagay sa talababa ang mas literal na alternatibo.
- source_word: גָּאָלְתָּ
  choice: iyong tinubos
  rationale: Ang גאל ay tumutukoy sa pagtubos o pagbawi bilang tagapagligtas. Pinananatili ng “tinubos” ang mahalagang diwang pangtipan at panrelihiyon ng salita.
- source_word: נֵהַלְתָּ
  choice: pinatnubayan mo sila
  rationale: Ang נהל ay paggabay na may pag-iingat, kung minsan ay tulad ng isang pastol. Ibinubukod ito sa “inakay” sa unang taludtod habang pinananatili ang magkatulad na kilos ng pangunguna.
- source_word: בְעָזְּךָ
  choice: sa iyong lakas
  rationale: Ang עֹז ay lakas o kapangyarihan. Ang “sa iyong lakas” ay malinaw at pinananatili ang patulang pagtutugma sa “sa iyong tapat na pag-ibig.”
- source_word: אֶל
  choice: patungo sa
  rationale: Ipinapahayag ng אֶל ang pagkilos tungo sa isang hantungan. Hindi ipinipilit ng “patungo sa” kung inilalarawan ang pagdating bilang naganap na sa karaniwang kronolohiya o bilang patulang katiyakan.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: iyong banal na tahanan
  rationale: Ang נָוֶה ay maaaring tirahan, tahanan, o pastulan. Ang “banal na tahanan” ay marangal at madaling maunawaan, at hindi nito nililimitahan ang tinutukoy sa Sinai, Canaan, o Zion/templo.
theological_decisions:
- issue: Ang tinutukoy ng “iyong banal na tahanan”
  choice: Sadyang malawak na pagtukoy sa lugar ng banal na presensiya ng Diyos
  alternative: Sinai, ang lupang pangako, o Zion/templo bilang tiyak at bukod-tanging tinutukoy
  rationale: Hindi tahasang kinikilala ng pariralang Hebreo ang lugar. Maaaring pagsama-samahin ng awit sa patulang paraan ang pagliligtas ng Diyos at ang hantungan sa kanyang banal na tahanan, kaya hindi nilulutas ng pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang “bayan” para sa kolektibong עַם at magkaibang pandiwang “inakay” at “pinatnubayan” upang mapanatili ang banayad na pagkakaiba ng dalawang pandiwang Hebreo. Nasa pangunahing teksto ang lahat ng panandang talababa.
