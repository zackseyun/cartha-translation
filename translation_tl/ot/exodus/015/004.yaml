base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: tl
  text: Ang mga karwahe ng Paraon at ang hukbo niya ay inihagis niya sa dagat, at ang mga piling opisyal niya ay inilubog sa Dagat ng mga Tambo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasaling “Dagat na Pula.” Ang mababasa sa Hebreo ay “Dagat ng mga Tambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: mga karwahe
  rationale: Tumutukoy ito sa mga karwaheng pandigma ng Paraon; natural at malinaw sa makabagong Filipino ang “mga karwahe.”
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Ito ang nakaugaliang anyong Filipino ng titulong maharlika sa Ehipto.
- source_word: וְחֵילוֹ
  choice: at ang hukbo niya
  rationale: Sa kontekstong pandigma, ang חַיִל ay tumutukoy sa puwersang militar; malinaw at marangal ang “hukbo.”
- source_word: יָרָה
  choice: ay inihagis niya
  rationale: Pinananatili nito ang literal at makapangyarihang larawan ng paghahagis sa patulang salaysay, pati ang tahasang panlalaking paksa na tumutukoy sa Diyos mula sa konteksto.
- source_word: בַיָּם
  choice: sa dagat
  rationale: Kasama ng “inihagis,” natural na ipinahihiwatig ng Filipino ang paggalaw papasok sa dagat nang hindi kailangang dagdagan ang teksto.
- source_word: וּמִבְחַר
  choice: ang mga pinakamahusay
  rationale: Ipinapahayag nito ang diwang pinili o pinakatangi habang nananatiling madaling maunawaan.
- source_word: שָׁלִשָׁיו
  choice: niyang opisyal
  rationale: Ang שָׁלִישׁ ay tumutukoy sa matataas o piling opisyal ng militar, marahil kaugnay ng mga karwahe; hindi ito labis na tinutukoy ng pangkalahatang “opisyal.”
- source_word: טֻבְּעוּ
  choice: ay inilubog
  rationale: Pinananatili ang pasibong diwa ng Hebreo at ang larawan ng paglubog, sa halip na ituon lamang sa pagkamatay sa pagkalunod.
- source_word: בְיַם סוּף
  choice: sa Dagat ng mga Tambo
  rationale: Tuwirang sinasalamin nito ang karaniwang leksikal na kahulugan ng יַם סוּף at inuuna ang ebidensiya ng tekstong Hebreo kaysa sa tradisyonal na pangalan.
theological_decisions:
- issue: Pagkakasalin ng יַם סוּף
  choice: Dagat ng mga Tambo
  alternative: Dagat na Pula
  rationale: Pinananatili sa pangunahing teksto ang literal na kahulugan ng pariralang Hebreo, samantalang inilalagay sa talababa ang tradisyonal at mas pamilyar na katawagan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang patulang lakas at paralelismo ng talata nang hindi labis na nililinaw ang ranggo ng שָׁלִישׁ o ang heograpiya ng יַם סוּף.
