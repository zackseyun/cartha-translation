  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: tl
  text: Umihip ka sa pamamagitan ng iyong hangin; tinakpan sila ng dagat.[a] Lumubog silang parang tingga sa makapangyarihang tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng iyong hininga.” Ang salitang Hebreo ay maaaring mangahulugang “hangin,” “hininga,” o “espiritu”; sa konteksto ng pagtawid sa dagat, mas angkop dito ang “hangin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: Hinipan mo sila
  rationale: Ang pandiwa ay tumutukoy sa pag-ihip o pagbuga ng hininga. Likas sa modernong Tagalog ang pandiwang “hinipan,” at ang layon na “sila” ay ipinahiwatig ng konteksto at nililinaw ang kilos nang hindi binabago ang larawan.
- source_word: בְרוּחֲךָ
  choice: ng iyong hangin
  rationale: Maaaring mangahulugan ang רוּחַ na hangin, hininga, o espiritu. Sa konteksto ng pagtawid sa dagat at kasama ng pandiwang “humihip,” “hangin” ang pinakamalinaw na pangunahing kahulugan; pinananatili sa talababa ang “hininga.”
- source_word: כִּסָּמוֹ יָם
  choice: tinakpan sila ng dagat
  rationale: Tuwirang ipinapahayag ng pandiwa ang pagtatakip, at malinaw na tumutukoy ang hulapi sa maramihang “sila.” Ang ayos na ito ay natural at tapat sa Hebreong larawan.
- source_word: צָלֲלוּ
  choice: Lumubog sila
  rationale: Sa kontekstong pantubig, ipinahihiwatig ng pandiwa ang pagbaba o paglubog. “Lumubog” ang malinaw at karaniwang salitang Tagalog.
- source_word: כָּעוֹפֶרֶת
  choice: parang tingga
  rationale: Ang עוֹפֶרֶת ay metal na tingga. Pinananatili ng “parang tingga” ang paghahambing at larawan ng matinding bigat.
- source_word: בְּמַיִם אַדִּירִים
  choice: sa makapangyarihang tubig
  rationale: Ang אַדִּירִים ay maaaring tumukoy sa lakas, kapangyarihan, o kadakilaan. Ang “makapangyarihang tubig” ay nagpapanatili sa patulang diin sa lakas ng tubig at hindi ito binabago tungo sa mas interpretatibong “malalim na tubig.”
theological_decisions:
- issue: Kahulugan ng רוּחַ sa makapangyarihan at patulang pagkilos ng Diyos
  choice: hangin
  alternative: hininga; espiritu
  rationale: Ang pisikal na pangyayari sa dagat at ang kaakibat na pandiwa ng pag-ihip ay pumapabor sa “hangin,” ngunit tunay na posible ang larawang “hininga.” Hindi ginamit ang “Espiritu” sa pangunahing teksto upang hindi magpasok ng mas tiyak na teolohikal na pagbasa kaysa sa hinihingi ng konteksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog na may bahagyang patulang ritmo. Pinanatili ang kongkretong mga larawan ng pag-ihip, pagtatakip ng dagat, at paglubog na parang tingga.
