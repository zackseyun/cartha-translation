base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: tl
  text: Sa bugso ng hininga mula sa mga butas ng iyong ilong[a], natambak ang tubig; tumindig na parang bunton[b] ang umaagos na tubig; namuo[c] ang mga kailaliman sa puso ng dagat[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Sa hanging mula sa mga butas ng iyong ilong.” Ang salitang Hebreo ay maaaring mangahulugang “hininga” o “hangin.”
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay literal na tumutukoy sa “bunton”; isinasalin naman ito ng ilan na “pader” dahil sa kaugnay na paglalarawan sa pagtawid sa dagat.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “nagyelo” o “lumapot.” Ang pandiwang Hebreo ay maaaring tumukoy sa paglapot o pamumuo.
    reason: lexical_alternative
  - marker: d
    text: Literal na “sa puso ng dagat,” ibig sabihin, sa gitna o kaloob-looban ng dagat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Sa bugso ng hininga mula sa iyong mga butas ng ilong
  rationale: Ang רוּחַ ay maaaring mangahulugang hangin o hininga, at kasama ng אַפֶּיךָ ay lumilikha ng kongkretong larawan ng makapangyarihang pagbuga. Pinananatili ng salin ang matalinghagang antropomorpismo ng Hebreo.
- source_word: נֶעֶרְמוּ מַיִם
  choice: natambak ang tubig
  rationale: Ang pandiwa ay tumutukoy sa pagkatipon o pagkakatambak. Likas at malinaw sa modernong Filipino ang “natambak” para sa larawang ito.
- source_word: נִצְּבוּ
  choice: tumindig
  rationale: Tuwirang ipinapahayag nito ang pagtayo o pananatiling nakatayo at pinananatili ang personipikasyon ng umaagos na tubig.
- source_word: כְמוֹ נֵד
  choice: parang bunton
  rationale: Ang נֵד ay pangunahing tumutukoy sa bunton o natambak na masa. Hindi ito ginawang “pader,” bagaman ganoon ang larawan sa kaugnay na salaysay.
- source_word: נֹזְלִים
  choice: ang umaagos na tubig
  rationale: Pinananatili nito ang participial na diwa ng salitang Hebreo—yaong umaagos—nang hindi nagpapasok ng ibang tiyak na uri ng anyong-tubig.
- source_word: קָפְאוּ
  choice: namuo
  rationale: Maaaring ipahiwatig ng pandiwa ang paglapot, pamumuo, o pagyeyelo. Ang “namuo” ay nagpapanatili ng lawak ng kahulugan nang hindi ipinipilit ang literal na pagyeyelo.
- source_word: תְהֹמֹת
  choice: ang malalalim na tubig
  rationale: Ang pangmaramihang pangngalan ay tumutukoy sa mga kalaliman o malalim na tubig. Mas natural at malinaw sa karaniwang Filipino ang “malalalim na tubig.”
- source_word: בְּלֶב יָם
  choice: sa puso ng dagat
  rationale: Tuwirang pinananatili ang matulaing idyomang Hebreo na “sa puso ng dagat,” na nangangahulugan ding nasa gitna o kaloob-looban nito.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa Diyos sa Awit sa Dagat
  choice: Pinanatili ang kongkretong larawan ng hiningang bumubugso mula sa mga butas ng ilong ng Diyos.
  alternative: Gawing abstrakto bilang “sa tindi ng iyong galit.”
  rationale: Sadyang gumagamit ang tekstong Hebreo ng larawang may anyong pantao upang ilarawan ang makapangyarihang pagkilos ng Diyos. Hindi kailangang alisin o gawing abstrakto ang tensiyong ito.
translation_notes:
  register: Makabago ngunit marangal at matulaing Filipino. Pinanatili ang paralelismo, kongkretong imahen, at tatlong sunod na larawan ng tubig, habang iniwasan ang labis na teknikal o makalumang pananalita.
