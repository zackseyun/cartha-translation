  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: tl
  text: Pagkatapos, pinangunahan ni Moises ang Israel sa paglalakbay mula sa Dagat ng mga Tambo[a], at lumabas sila patungo sa ilang ng Shur. Tatlong araw silang naglakad sa ilang, at hindi sila nakatagpo ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasaling “Dagat na Pula”; sa Hebreo, “Dagat ng mga Tambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: pinaalis ... mula
  rationale: 'Ang Hiphil ng נסע ay may diwang sanhi: pinakilos ni Moises ang Israel upang magpatuloy mula sa kanilang kinaroroonan. Ang “pinaalis ... mula” ay natural sa Filipino at pinananatili ang causative na diwa.'
- source_word: מִיַּם סוּף
  choice: mula sa Dagat ng mga Tambo
  rationale: Ang יַם־סוּף ay literal na tumutukoy sa “Dagat ng mga Tambo.” Inuuna ng salin ang kahulugan ng Hebreo, habang inilalagay sa talababa ang tradisyonal na “Dagat na Pula.”
- source_word: מִדְבַּר שׁוּר
  choice: ilang ng Shur
  rationale: Ang מִדְבָּר ay ilang o tigang na lupaing hindi kailangang purong mabuhanging disyerto. Ang “ilang” ay maikli, natural, at angkop sa wikang biblikal sa Filipino.
- source_word: וַיֵּצְאוּ
  choice: nagtungo sila
  rationale: Bagaman literal na “lumabas sila,” sa konteksto ng paggalaw patungo sa ilang, mas natural sa Filipino ang “nagtungo sila” nang hindi dinaragdagan ang kahulugan.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: Tatlong araw
  rationale: Tuwirang ipinapahayag nito ang tagal ng paglalakbay, gaya ng accusative of duration sa Hebreo.
- source_word: בַּמִּדְבָּר
  choice: sa ilang
  rationale: Pinananatili nito ang payak na kahulugan ng pang-ukol ב, “sa,” sa halip na ang mas interpretatibong “sa kahabaan ng” o “tumawid sa.”
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: ngunit wala silang natagpuang tubig
  rationale: Natural at malinaw itong salin ng “at hindi sila nakatagpo ng tubig.” Ang “ngunit” ay ipinahihiwatig ang salungat na kinalabasan nang hindi binabago ang pangyayari.
