  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: tl
  text: 'Pagkatapos, inawit ni Moises at ng mga Israelita ang awit na ito para kay Yahweh[a]. Sinabi nila:


    “ Aawit ako para kay Yahweh,


    sapagkat lubos siyang nagtagumpay[b];


    ang kabayo at ang sakay nito


    ay inihagis niya sa dagat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: YHWH, na tradisyonal na isinasaling “ang PANGINOON”; maaari ring baybaying “Yahweh.”'
    reason: alternative_reading
  - marker: b
    text: Maaari ring “lubos siyang dinakila” o “lubhang mataas siya.” Pinatindi sa Hebreo ang pandiwa sa pamamagitan ng isang anyong nagpapalakas na inuulit ang ugat nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pagkatapos
  rationale: Nagsisilbing panandang temporal na nag-uugnay sa awit sa naunang pagtawid at pagliligtas sa dagat.
- source_word: יָשִׁיר
  choice: inawit
  rationale: Bagaman anyong imperfect ang pandiwa, ang pagkakasunod nito sa אָז sa salaysay ay may puwersang pangnagdaan.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: at ng mga Israelita
  rationale: Natural at malinaw sa modernong Filipino bilang tawag sa sambayanan ni Israel; hindi kailangang literal na 'mga anak na lalaki ni Israel.'
- source_word: הַשִּׁירָה הַזֹּאת
  choice: ang awit na ito
  rationale: Tuwirang salin na hindi nagdaragdag ng interpretibong paglalarawan.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton; natural sa Filipino ang 'para kay' sa pag-awit na iniuukol sa isang persona.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Sinabi nila
  rationale: Ang dobleng pormula ng pagpapakilala sa pananalita ay hindi kailangang ulitin sa Filipino; malinaw na ipinakikilala nito ang sipi.
- source_word: אָשִׁירָה
  choice: Umawit ako
  rationale: Ipinahahayag ng cohortative ang matibay na pasiya ng nagsasalita; ang anyong pangkasalukuyan sa Filipino ay natural na makapagpapahayag ng kusang pasiya at pinananatili ang isahang tinig ng tula.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala ang dahilan ng pag-awit sa isang marangal ngunit nauunawaang anyo.
- source_word: גָאֹה גָּאָה
  choice: lubos siyang nagtagumpay
  rationale: Ipinakikita ng infinitive absolute na kasunod ng finite verb ang matinding pagpapalakas sa diwa; sa konteksto, ang pagtatagumpay ang likas na pagpapahayag nito.
- source_word: סוּס וְרֹכְבוֹ
  choice: ang kabayo at ang sakay nito
  rationale: Pinananatili ang kolektibong isahan at ang ugnayang ipinahahayag ng hulaping panghalip.
- source_word: רָמָה בַיָּם
  choice: inihagis niya sa dagat
  rationale: Malinaw na naghahayag ng marahas na pagpapabagsak o paghahagis patungo sa dagat nang hindi dinaragdagan ang detalye.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ang transliterasyon upang makita sa pangunahing teksto ang personal na pangalang nasa Hebreo; ipinaliliwanag sa talababa ang tradisyonal na kapalit.
- issue: Diwa ng גָאֹה גָּאָה
  choice: lubos siyang nagtagumpay
  alternative: lubos siyang dinakila / lubhang mataas siya
  rationale: Ang konteksto ng pagkawasak ng hukbo sa dagat ay sumusuporta sa diwa ng matagumpay na kadakilaan, ngunit pinananatili sa talababa ang lehitimong alternatibong tumutukoy sa kataasan o pagkadakila.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang anyong patula sa mismong awit, iniwasan ang labis na literal na pag-uulit sa pormula ng pagsasalita, at pinanatili sa talababa ang tunay na leksikal na kalabuan.
