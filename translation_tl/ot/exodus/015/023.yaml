  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: tl
  text: Nang makarating sila sa Mara[a], hindi nila mainom ang tubig mula sa Mara dahil mapait ito. Kaya pinangalanan itong Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Mara ay kaugnay ng salitang Hebreo na nangangahulugang “mapait.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ מָרָתָה
  choice: Pagdating nila sa Mara
  rationale: Isinasagawa ng wayyiqtol ang pagsulong ng salaysay, at ipinahihiwatig ng directional he ang pagpunta sa Mara. Natural sa makabagong Tagalog ang pariralang “Pagdating nila.”
- source_word: וְלֹא יָכְלוּ לִשְׁתֹּת
  choice: hindi nila mainom
  rationale: Natural at tuwirang ipinapahayag ng “hindi nila mainom” ang kawalan nila ng kakayahang uminom dahil sa katangian ng tubig.
- source_word: מַיִם מִמָּרָה
  choice: ang tubig mula roon
  rationale: Ang מִן ay nagpapahiwatig ng pinagmulan. Ginamit ang “mula roon” upang maiwasan ang mabigat na pag-uulit ng pangalang Mara habang malinaw pa rin ang tinutukoy.
- source_word: כִּי מָרִים הֵם
  choice: dahil mapait iyon
  rationale: Pinananatili ng “dahil” ang sanhi na ipinahihiwatig ng כִּי. Bagaman maramihan ang anyong Hebreo ayon sa gramatika ng מַיִם, pang-isahan ang karaniwang pagtukoy sa “tubig” sa Tagalog.
- source_word: עַל כֵּן
  choice: Kaya
  rationale: Karaniwang panandang pasaklaw sa Tagalog na malinaw na nag-uugnay sa kapaitan ng tubig at sa pagpapangalan sa lugar.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: tinawag na Mara ang lugar na iyon
  rationale: Walang tahasang simuno ang pandiwang Hebreo. Ang pasibong “tinawag” ay nagpapanatili sa di-tiyak na tagapagpangalan at natural na ipinapahayag ang pagpapangalan sa lugar.
- source_word: מָרָה / מָרִים
  choice: Mara / mapait
  rationale: Isinalin sa tunog ang pangalang pantangi bilang “Mara” at isinalin ang pang-uri bilang “mapait.” Ipinapaliwanag ng talababa ang paglalaro sa magkaugnay na tunog at kahulugan sa Hebreo.
