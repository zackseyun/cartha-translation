revisions:
- from: Sapagkat nang pumasok sa dagat ang mga kabayo ng Paraon, kasama ang kanyang mga karwahe at mga mangangabayo,[a] pinabalik ni Yahweh sa kanila ang tubig ng dagat. Ngunit lumakad ang mga Israelita sa tuyong lupa sa gitna ng dagat.[b]
  to: Sapagkat pumasok sa dagat ang mga kabayo ni Paraon kasama ang kanyang mga karwahe at mga mangangabayo,[a] at ipinabalik ni Yahweh sa ibabaw nila ang tubig ng dagat; ngunit lumakad ang mga Israelita sa tuyong lupa sa gitna ng dagat.[b]
  rationale: Nilinaw ang kilos ng pagbabalik ng tubig upang maipahayag ang “sa ibabaw nila,” at pinasimple ang pambungad na pang-ugnay. Hindi binago ang kahulugan, ang kolektibong pagbasa ng mga puwersa ni Paraon, o ang ipinahiwatig na pagsalungat sa huling sugnay.
