base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: tl
  text: Sapagkat pumasok sa dagat ang mga kabayo ni Paraon kasama ang kanyang mga karwahe at mga mangangabayo,[a] at ipinabalik ni Yahweh sa ibabaw nila ang tubig ng dagat; ngunit lumakad ang mga Israelita sa tuyong lupa sa gitna ng dagat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kabayo ni Paraon ... kasama ang kanyang karwahe”; maaaring gamitin nang kolektibo ang mga anyong isahan para sa mga kabayo at mga karwahe ng hukbo ni Paraon.
    reason: lexical_alternative
  - marker: b
    text: O “At lumakad ang mga Israelita.” Payak na “at” ang pang-ugnay sa Hebreo; ginamit sa teksto ang “ngunit” upang ihayag ang pagsalungat.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat nang
  rationale: Ipinahahayag ng כִּי ang paliwanag kaugnay ng naunang awit, samantalang natural na minamarkahan ng “nang” ang pangyayaring isinasalaysay.
- source_word: בָא ... בַיָּם
  choice: pumasok sa dagat
  rationale: Malinaw at likas sa Tagalog ang pandiwang nagpapahiwatig ng pagpasok sa dagat.
- source_word: סוּס פַּרְעֹה
  choice: ang mga kabayo ng Paraon
  rationale: Bagaman isahan ang anyong Hebreo, maaari itong kolektibong tumukoy sa pangkat ng mga kabayo ng Paraon; mas natural dito ang maramihan sa Tagalog.
- source_word: בְּרִכְבּוֹ
  choice: kasama ang kanyang mga karwahe
  rationale: Ang morpolohikal na isahan ay maaaring kolektibong tumukoy sa hukbo ng mga karwahe; pinananatili ng “karwahe” ang sinaunang larawang militar.
- source_word: וּבְפָרָשָׁיו
  choice: at mga mangangabayo
  rationale: Direktang tumutukoy sa mga mandirigmang nakasakay sa kabayo nang hindi gumagamit ng higit na teknikal na “kabalyerya.”
- source_word: וַיָּשֶׁב יְהוָה
  choice: pinabalik ni Yahweh
  rationale: Ipinakikita ng anyong causative ng שׁוב na si Yahweh ang nagpabalik sa tubig.
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: sa kanila ang tubig ng dagat
  rationale: Natural sa Tagalog at ipinahahayag na ang bumalik na tubig ay dumaluyong sa ibabaw ng hukbo.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Ngunit ... ang mga Israelita
  rationale: Ang “mga Israelita” ang natural at saklaw-sa-lahat na katumbas ng literal na “mga anak ni Israel”; ginagawang hayag ng “Ngunit” ang malinaw na kontekstwál na pagsalungat.
- source_word: הָלְכוּ בַיַּבָּשָׁה
  choice: lumakad ... sa tuyong lupa
  rationale: Pinananatili ang karaniwang pandiwang “lumakad” at ang kongkretong larawan ng tuyong sahig ng dagat.
- source_word: בְּתוֹךְ הַיָּם
  choice: sa gitna ng dagat
  rationale: Tuwirang at natural na salin na pinananatili ang lokasyon sa loob ng nahating dagat.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangngalang pantangi ang Tetragrammaton sa tekstong Hebreo; pinananatili itong “Yahweh” upang hayagang katawanin ang pangalang tipan.
- issue: Ugnayan ng dalawang pangyayari sa huling sugnay
  choice: Ngunit
  alternative: At
  rationale: Ang Hebreo ay may payak na ו (“at”), ngunit malinaw ang pagsalungat ng pagkalunod ng hukbo at ligtas na paglakad ng Israel. Inilalagay sa talababa ang mas pormal na alternatibo upang hindi maitago ang anyo ng pinagmulan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “mga Israelita” sa halip na literal na “mga anak ni Israel” para sa natural at inklusibong pagtukoy sa bayan; pinanatili ang “karwahe,” “mangangabayo,” at “Yahweh” bilang tiyak na mga terminong pangkasaysayan at pansaligan.
