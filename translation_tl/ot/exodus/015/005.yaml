translation:
  language: tl
  text: Tinakpan sila ng malalalim na tubig[a]; bumaba sila sa kailaliman na parang bato.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Tinakpan sila ng kailaliman; lumubog sila sa kailaliman na parang bato.”'
    reason: Ipinapakita ang leksikal na alternatibo para sa תְּהֹמֹת at ang kontekstuwal na saling “lumubog” para sa יָרְדוּ, nang hindi higit na tinutukoy ang lugar bilang dagat.
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: malalalim na tubig
  rationale: Ang pangmaramihang anyo ng תְּהוֹם ay tumutukoy sa malalim na tubig o kalaliman. Mas malinaw at natural sa makabagong Tagalog ang “malalalim na tubig” sa konteksto ng dagat.
- source_word: יְכַסְיֻמוּ
  choice: Tinakpan sila
  rationale: Tuwirang isinasalin ang pandiwang כסה, “takpan,” kasama ang hulaping tumutukoy sa kanila.
- source_word: יָרְדוּ
  choice: lumubog sila
  rationale: Literal na nangangahulugang “bumaba sila,” ngunit sa konteksto ng tubig, natural na ipinahahayag ng “lumubog” ang pagbaba nang hindi binabago ang larawan.
- source_word: בִמְצוֹלֹת
  choice: sa kailaliman
  rationale: Ang מְצוֹלָה ay tumutukoy sa malalim na bahagi, lalo na ng dagat. Pinananatili ng “kailaliman” ang patulang larawan at ang pagkakaiba nito sa unang terminong תְּהֹמֹת.
- source_word: כְּמוֹ
  choice: na parang
  rationale: Natural na panandang paghahambing sa Tagalog; ikinakabit ng “na” ang parirala sa pandiwang “lumubog.”
- source_word: אָבֶן
  choice: bato
  rationale: Karaniwan at tuwirang katumbas ng “stone”; hindi nangangailangan ng pantukoy sa pariralang “parang bato.”
