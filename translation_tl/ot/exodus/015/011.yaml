id: EXO.15.11
reference: Exodus 15:11
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: tl
  text: Sino ang tulad mo sa mga diyos[a], O PANGINOON? Sino ang tulad mo—marilag sa kabanalan, kasindak-sindak sa mga kapurihan[b], gumagawa ng mga kababalaghan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga banal na nilalang.”
    reason: Maaaring tumukoy ang Hebreong אֵלִם sa mga diyos o sa mga nilalang na kabilang sa makalangit na kapulungan.
  - marker: b
    text: 'Maaari ring unawain: “kasindak-sindak sa mga gawang kapuri-puri.”'
    reason: Ang Hebreong parirala ay masinsin at maaaring tumukoy sa mga papuri o sa mga gawang dahilan ng papuri.
lexical_decisions:
- source_word: אֵלִם
  choice: mga diyos
  rationale: Tuwirang pinananatili ang paghahambing sa mga diyos o banal na nilalang, sa halip na gawing mas malabong “makapangyarihan.”
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakaugaliang anyong malalaking titik sa Tagalog upang katawanin ang banal na pangalang YHWH.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: marilag sa kabanalan
  rationale: Ipinahahayag ng “marilag” ang kadakilaan at karilagang nasa pandiwaring Hebreo, samantalang tuwirang pinananatili ang “sa kabanalan.”
- source_word: נוֹרָא תְהִלֹּת
  choice: kasindak-sindak sa mga kapurihan
  rationale: Pinananatili ng “kasindak-sindak” ang diwa ng takot at pagpipitagan sa נוֹרָא; ang “mga kapurihan” ay sadyang hindi nagpapasiya kung mga papuri o mga gawang karapat-dapat purihin ang tinutukoy.
- source_word: עֹשֵׂה פֶלֶא
  choice: gumagawa ng mga kababalaghan
  rationale: Natural sa Tagalog ang pangmaramihang “mga kababalaghan” para sa Hebreong isahang kolektibong pahayag tungkol sa paggawa ng kamangha-manghang gawa.
theological_decisions:
- issue: Ang kahulugan ng “mga diyos” sa paghahambing
  choice: Pinanatili ang “mga diyos” sa pangunahing teksto.
  alternative: mga banal na nilalang; mga makapangyarihan
  rationale: Hindi tahasang nilulutas ng talata ang ontolohikal na katayuan ng אֵלִם. Ang salin ay nagpapanatili sa retorikal na pahayag na walang maihahambing sa PANGINOON.
- issue: Ang kaugnayan ng “kasindak-sindak” at “mga kapurihan”
  choice: Pinanatili ang masinsing Hebreong parirala bilang “kasindak-sindak sa mga kapurihan.”
  alternative: kagila-gilalas sa mga papuri; kasindak-sindak sa mga gawang kapuri-puri
  rationale: Iniiwasang takdaan kung ang תְהִלֹּת ay tumutukoy sa mga papuring iniuukol sa Diyos o sa kaniyang mga gawang pinupuri.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang “O” sa tuwirang pagtawag at ang em dash upang malinaw na ipakilala ang magkakasunod na paglalarawan. Ang “PANGINOON” sa malalaking titik ang kumakatawan sa YHWH.
