  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: tl
  text: 'Iniunat mo ang iyong kanang kamay;

    nilamon sila ng lupa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “lupain” o “kalupaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: Iniunat mo
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na isahan ng נטה ay tuwirang pakikipag-usap sa Diyos. Likas sa modernong Tagalog ang “iniunat mo” at pinananatili nito ang kongkretong kilos.
- source_word: יְמִינְךָ
  choice: ang iyong kanang kamay
  rationale: Literal itong “iyong kanang kamay.” Bagaman sagisag ito ng kapangyarihan sa tulang biblikal, pinananatili ng salin ang kongkretong larawan sa halip na ipalit ang interpretasyong “kapangyarihan.”
- source_word: תִּבְלָעֵמוֹ
  choice: nilamon sila
  rationale: Mula ito sa בלע, “lumamon” o “lumunok.” Pinananatili ng “nilamon” ang matingkad na talinghaga; ang hulaping layon ay tumutukoy sa maramihang “sila,” samantalang ang kasunod na אָרֶץ ang simuno.
- source_word: אָרֶץ
  choice: lupa
  rationale: Maaaring mangahulugan ang אֶרֶץ ng “lupa,” “lupain,” o “kalupaan.” Ang “lupa” ay natural at malinaw sa larawang nilamon ng lupa ang mga kaaway, habang hindi lubusang nililimitahan ang saklaw ng salitang Hebreo.
theological_decisions:
- issue: Antropomorpikong paglalarawan sa pagkilos ng Diyos
  choice: Panatilihin ang kongkretong “iyong kanang kamay.”
  alternative: “iyong kapangyarihan” o “iyong makapangyarihang kamay”
  rationale: Gumagamit ang tulang Hebreo ng larawan ng bahagi ng katawan upang ipahayag ang pagkilos at kapangyarihan ng Diyos. Ang pagpapanatili nito ay nag-iingat sa lakas ng tula nang hindi ipinapalit ang isang paliwanag sa mismong larawan.
translation_notes:
  register: Modernong Filipino Tagalog na maikli, marangal, at patula. Pinanatili ang tuwirang pakikipag-usap sa Diyos, ang kongkretong larawang “kanang kamay,” at ang matinding talinghagang “nilamon.”
