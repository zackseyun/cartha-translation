base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: tl
  text: Si Yah ang aking lakas at awit, at siya ang naging aking kaligtasan. Siya ang aking Diyos, at pupurihin ko siya[a]; ang Diyos ng aking ama, at dadakilain ko siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Maghahanda ako ng tahanan para sa kanya.” Mahirap tiyakin ang kahulugan ng pandiwang Hebreo rito; maaari rin itong magpahiwatig ng pagpapaganda o pagluwalhati.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: aking lakas
  rationale: Tuwirang ipinapahayag ng עֹז ang lakas o kapangyarihan; natural sa Filipino ang “aking lakas” sa patulang pahayag.
- source_word: וְזִמְרָת יָהּ
  choice: at awit … si Yah
  rationale: Ang זִמְרָה ay awit o musikang papuri. Binabasa ang יָהּ bilang simuno ng pariralang “Si Yah ang aking lakas at awit,” ayon sa patulang konteksto.
- source_word: יָהּ
  choice: Yah
  rationale: Pinanatili ang pinaikling anyo ng banal na pangalan sa Hebreo sa halip na iangkop ito sa karaniwang salin ng tetragrammaton.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: at siya ang naging aking kaligtasan
  rationale: Ipinapakita ng היה + ל ang pagiging isang bagay para sa isang tao; pinananatili ng “naging aking kaligtasan” ang resultative na diwa.
- source_word: זֶה אֵלִי
  choice: Siya ang aking Diyos
  rationale: Ang demonstratibong זֶה ay tumutukoy nang mariin sa Diyos na kababanggit lamang. Mas natural sa Filipino ang personal na “Siya” kaysa literal na “Ito” para sa Diyos.
- source_word: וְאַנְוֵהוּ
  choice: at pupurihin ko siya
  rationale: Bagaman mahirap at pinagtatalunan ang pandiwa, ang kahulugang pagpupuri o pagluwalhati ang pinakamalapit sa kaagapay nitong “itataas ko siya” at sa konteksto ng awit. Nasa talababa ang mahalagang alternatibong pagbasa.
- source_word: אֱלֹהֵי אָבִי
  choice: ang Diyos ng aking ama
  rationale: Natural at tumpak na salin ng construct phrase na may isahang “ama.”
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: at itataas ko siya
  rationale: Pinananatili nito ang metapora ng רומם at malinaw na naghahayag ng pagpupuri at pagdakila sa modernong Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יָהּ
  choice: Yah
  alternative: ang PANGINOON
  rationale: Pinaikling anyo ng banal na pangalan ang nasa teksto, hindi ang buong tetragrammaton; pinananatili ng “Yah” ang pagkakaibang iyon at ang patulang lakas nito.
- issue: Kahulugan ng וְאַנְוֵהוּ
  choice: pupurihin ko siya
  alternative: ipaghahanda ko siya ng tahanan
  rationale: Mas angkop sa agarang patulang paralelismo at sa konteksto ng pagsamba ang pagpupuri, ngunit hindi tiyak ang anyo at maaaring tumukoy sa paghahanda ng tahanan o tirahan; kaya pinanatili ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal at patula ngunit madaling maunawaan. Pinanatili ang pangalang “Yah” at gumamit ng payak na mga pandiwang “pupurihin” at “itataas” upang maipakita ang paralelismo nang hindi pinapawi ang leksikal na tensiyon.
