  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: tl
  text: Narinig ng mga bayan; nanginig sila.[a] Matinding pagkabalisa ang sumaklot sa mga naninirahan sa Filistia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “Narinig na ng mga bayan; nanginginig sila. Panginginig ang sumaklot sa mga naninirahan sa Filistia.” Ang tulang Hebreo ay maaaring magpahiwatig ng isang masiglang kasalukuyan o ng inaasahang pangyayari, hindi lamang ng payak na nakaraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: Narinig ito
  rationale: Ang Qal perfect na שָׁמְעוּ ay ‘narinig.’ Idinagdag ang likas na Tagalog na layong ‘ito’ upang tumukoy sa balita tungkol sa ginawa ng Diyos sa naunang mga taludtod, nang hindi dinaragdagan ang diwa.
- source_word: עַמִּים
  choice: mga bayan
  rationale: Pinananatili ng ‘mga bayan’ ang maramihang anyo at ang pagtukoy sa nakapaligid na mga pangkat ng tao; hindi nito ipinapalagay ang makabagong konsepto ng mga bansang-estado.
- source_word: יִרְגָּזוּ/ן
  choice: nanginig sila
  rationale: Ang רָגַז ay maaaring mangahulugang manginig, mayanig, o maligalig. Ang pangnagdaang ‘nanginig’ ay natural kasunod ng perfect na ‘narinig’ at malinaw na naghahatid ng takot, habang ang alternatibong aspektong mas buhay o inaasahan ay inilalahad sa talababa.
- source_word: חִיל
  choice: matinding hirap
  rationale: Ang חִיל ay tumutukoy sa matinding kirot, pamimilipit, panginginig, o dalamhati. Ang ‘matinding hirap’ ay sumasaklaw sa pisikal at emosyonal na paghihirap nang hindi tahasang nagdaragdag ng larawang panganganak.
- source_word: אָחַז
  choice: sumaklot
  rationale: Ang אָחַז ay ‘humawak’ o ‘sumunggab.’ Ang ‘sumaklot’ ay isang natural at mariing pandiwa sa Tagalog para sa biglang pananagumpay ng matinding paghihirap sa isang tao.
- source_word: יֹשְׁבֵי
  choice: mga naninirahan sa
  rationale: Ang substantibong participle ay tumutukoy sa mga residente. Ang ‘mga naninirahan sa’ ay natural at tumpak sa modernong Tagalog.
- source_word: פְּלָשֶׁת
  choice: Filistia
  rationale: Pangalan ito ng lupain o rehiyon ng mga Filisteo, kaya pinanatili ang heograpikong pangalang ‘Filistia’ sa halip na gawing pangalan ng pangkat-tao.
theological_decisions:
- issue: Panahunan at aspekto ng makatang salaysay
  choice: Ginamit ang pangnagdaang ‘narinig’ at ‘nanginig.’
  alternative: ‘Naririnig ito ng mga bayan; nanginginig sila’ o ‘maririnig ... manginginig.’
  rationale: Pinagsasama ng Hebreong tula ang perfect na שָׁמְעוּ at imperfect na יִרְגָּזוּן sa isang buhay na paglalarawan. Ang pangnagdaan ay maayos sa daloy ng salaysay, ngunit hindi dapat ituring na tanging posibleng pagbasa; kaya pinanatili sa talababa ang kasalukuyan o inaasahang himig.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Tagalog. Ginamit ang ‘mga bayan’ para sa mga pangkat ng tao at ‘Filistia’ para sa rehiyon. Ang ‘sumaklot’ ay nagpapanatili sa lakas ng makatang larawan.
