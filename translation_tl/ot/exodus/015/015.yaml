  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: tl
  text: Noon, nasindak ang mga pinuno ng Edom; sinaklot ng panginginig ang mga pinuno ng Moab[a]; nanghina ang loob ng lahat ng naninirahan sa Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga makapangyarihang lalaki ng Moab.” Ang salitang Hebreo ay literal na “mga lalaking tupa” at ginagamit dito para sa mga prominenteng lalaki o pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Nang magkagayon
  rationale: Ipinahahayag ang bunga ng naunang pagliligtas at ang kasunod na reaksiyon ng mga bansa; natural ito sa marangal na salaysay na patula.
- source_word: נִבְהֲלוּ
  choice: nasindak
  rationale: Malinaw na ipinahahayag ang matinding pagkagulat at takot na saklaw ng pandiwa.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: mga pinuno ng Edom
  rationale: Ang אַלּוּף ay tumutukoy sa pinuno o puno ng angkan; hindi nito kailangang ipahiwatig ang isang maharlikang katungkulan.
- source_word: אֵילֵי מוֹאָב
  choice: mga pinuno ng Moab
  rationale: Sa paralelismo, tumutukoy ito sa mga prominenteng makapangyarihang lalaki ng Moab. Ang mas literal na diwa ay inilagay sa talababa.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: sinaklot ng panginginig
  rationale: Pinananatili ang matingkad na larawan ng panginginig na humahawak o sumasaklot sa kanila.
- source_word: נָמֹגוּ
  choice: nawalan ng lakas ng loob
  rationale: Sa konteksto ng takot, ang literal na larawan ng pagkatunaw ay tumutukoy sa panghihina o pagkawala ng tapang; ang salin ay natural sa modernong Tagalog.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: ang lahat ng naninirahan sa Canaan
  rationale: Tuwirang pinananatili ang kabuuang saklaw at ang participial na diwang tumutukoy sa mga naninirahan doon.
