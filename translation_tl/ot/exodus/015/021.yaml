    issue: Ang “dakila ang kanyang pagtatagumpay” ay nominalisado ang גָאֹה גָּאָה.
    rationale: Ang Hebreo ay mariing pandiwang pahayag tungkol sa ginawa/pagkilos ni Yahweh. Mas mainam na panatilihin sa Filipino ang pandiwang “nagtagumpay,” na may panandang nagpapahiwatig ng karangalan o kadakilaan.
  - severity: low
    issue: Hindi ganap na tumpak ang pagkakalahad ng alternatibo sa tala a.
    rationale: Ang “Umawit si Miriam bilang tugon sa kanila” ay maaaring magmukhang isang hiwalay at tiyak na salin. Mas maingat na ipaliwanag na ang “tumugon” ay maaaring tumukoy sa tugunang pag-awit sa konteksto ng awitan.
