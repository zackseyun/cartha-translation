base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: tl
  text: 'At tumugon sa kanila si Miriam: “Umawit kayo kay Yahweh[a], sapagkat marangal siyang nagtagumpay[b]; ang kabayo at ang sakay nito ay inihagis niya sa dagat.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa konteksto ng awitan, maaari ring ipahiwatig ng pandiwang “tumugon” ang tugunang pag-awit.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo, mariing inuulit ang pandiwang diwa: “lubos siyang nagpakadakila,” o “mataas na mataas siya.” Ipinahahayag ng salin ang idyomang ito ayon sa konteksto ng awit ng tagumpay.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: tumugon
  rationale: Pinananatili nito ang karaniwang diwa ng ענה na ‘sumagot/tumugon,’ habang hinahayaan ang konteksto ng awitan na magpahiwatig ng tugunang pag-awit.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Tuwirang isinasalin ang pang-ukol at panghalip nang hindi labis na tinutukoy kung kababaihan lamang o mas malawak na pangkat ang tinutukoy.
- source_word: מִרְיָם
  choice: Miriam
  rationale: Karaniwang transliterasyon sa makabagong Filipino ng pangalang Hebreo.
- source_word: שִׁירוּ
  choice: Umawit kayo
  rationale: Tuwirang ipinapahayag ang pangmaramihang pautos ng שׁיר; hindi idinaragdag ang ‘magpuri,’ na hindi tahasang nasa pandiwa.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יְהוָה sa anyong Yahweh.
- source_word: כִּי
  choice: sapagkat
  rationale: Natural at marangal na pangatnig na nagpapakilala sa dahilan ng utos na umawit.
- source_word: גָאֹה גָּאָה
  choice: dakila ang kanyang pagtatagumpay
  rationale: Ipinahahayag ang mariing anyong Hebreo—infinitive absolute kasunod ng finite verb—bilang isang matinding pahayag ng matagumpay at maringal na pagkilos sa konteksto ng awit ng tagumpay.
- source_word: סוּס
  choice: ang kabayo
  rationale: Pinananatili ang isahang kolektibo o pangkalahatang larawan ng kabayo sa pahayag na patula.
- source_word: וְרֹכְבוֹ
  choice: at ang sakay nito
  rationale: Malinaw na iniuugnay ang hulaping panghalip sa kabayo at iniiwasang magdagdag ng kasariang hindi kailangang ipahayag sa Filipino.
- source_word: רָמָה
  choice: inihagis niya
  rationale: Tuwirang inilalarawan ang pagkilos ng paghahagis o pagpapatapon; sapat ang lakas ng ‘inihagis’ nang hindi pinatitingkad nang higit sa Hebreo.
- source_word: בַיָּם
  choice: sa dagat
  rationale: Sa Filipino, natural ang ‘inihagis ... sa dagat’ para sa kilos na patungo at humahantong sa dagat, bagaman literal na maaaring ‘nasa dagat.’
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasan ang Tetragrammaton sa talata; ang ‘Yahweh’ ay nagpapanatili sa banal na pangalan sa halip na palitan ito ng titulo.
- issue: Diwa ng גָאֹה גָּאָה
  choice: dakila ang kanyang pagtatagumpay
  alternative: lubos siyang itinaas; lubos siyang nagpakadakila
  rationale: Pinananatili ang diin at tagumpay na himig ng awit nang hindi ipinapakahulugang ito ay tumutukoy lamang sa katayuang mataas o sa mapagmataas na pagpapakataas sa sarili.
translation_notes:
  register: Makabago at madaling maunawaang Filipino na may marangal at patulang himig. Ginamit ang ‘Umawit kayo’ para sa malinaw na pangmaramihang pautos, at pinanatili ang maikli at mariing pagkakahanay ng kabayo at sakay nito.
