  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: tl
  text: At nagreklamo ang mga tao laban kay Moises, sinabi nila, “Ano ang iinumin natin?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: nagreklamo
  rationale: Ang pandiwa ay tumutukoy sa sama-samang pagrereklamo, lalo na sa mga salaysay tungkol sa ilang. Likas at malinaw sa modernong Filipino ang “nagreklamo,” at pinananatili nito ang negatibong diwa.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Tuwirang katumbas ito ng pangngalang may tiyak na pantukoy; hindi idinagdag ang “ng Israel,” na wala sa mismong talata.
- source_word: עַל
  choice: laban kay
  rationale: Kasama ng pandiwa ng pagrereklamo, ipinakikita ng pang-ukol na si Moises ang pinatutungkulan ng salungat na reklamo.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: לֵאמֹר
  choice: Sinabi nila
  rationale: Ipinakikilala nito ang tuwirang pananalita. Mas natural sa Filipino ang hiwalay na sugnay kaysa sa literal na “na sinasabi.”
- source_word: מַה
  choice: Ano
  rationale: Pinananatili ang payak na panghalip na pananong.
- source_word: נִשְׁתֶּה
  choice: ang iinumin natin
  rationale: Ang imperpektibong unang panauhang maramihan ng “uminom” ay nagpapahayag dito ng agarang pangangailangan at tanong kung ano ang kanilang maiinom, nang hindi dinaragdagan ang modal na kahulugan.
