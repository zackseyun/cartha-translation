    rationale: Ang וַ־ ay pangunahing nag-uugnay ng salaysay at hindi tahasang nagsasabing “therefore/therefore because of that.” Maaaring suportado ng mas malawak na konteksto ang sanhi, ngunit hindi ito dapat ipasok sa mismong talata.
  - severity: low
    issue: Ang “Sinabi nila” ay dapat ikabit sa sugnay ng pagrereklamo.
    rationale: Ang לֵאמֹר ay pormulang nagpapakilala ng tuwirang pananalita; ang kuwit ay nagbibigay ng mas magkakaugnay na daloy sa Filipino.
  revised_text: At nagreklamo ang mga tao laban kay Moises, sinabi nila, “Ano ang iinumin natin?”
