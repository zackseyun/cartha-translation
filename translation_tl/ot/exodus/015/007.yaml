  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang lawak/tindi ng dakilang kamahalan, ang pagbagsak sa mga tumitindig laban sa Diyos, ang pagpapadala ng nag-aapoy na galit, at ang paglalamon na gaya ng tuyong dayami. Napananatili rin ang ikalawang panauhan at ang patulang larawan ng paghatol.'
