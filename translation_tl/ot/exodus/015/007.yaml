  terminology: Ang “kadakilaan,” “nag-aapoy mong galit,” at “dayami” ay angkop sa kontekstong patula at sa mga pangunahing salitang Hebreo. Wala itong idinagdag na doktrinal na pagpapakahulugan. Tama ang pagkakaangkla ng talababa sa “nag-aapoy mong galit,” at tumpak ang ibinigay nitong leksikal na alternatibo.
