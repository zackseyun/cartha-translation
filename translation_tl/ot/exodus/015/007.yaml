  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: tl
  text: 'At sa tindi ng iyong kadakilaan,

    ibinabagsak mo ang mga bumabangon laban sa iyo;

    ipinadadala mo ang nag-aapoy mong galit[a],

    at nilalamon sila nito na parang dayami.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinadadala mo ang iyong poot.” Literal na tumutukoy ang Hebreo sa galit na nag-aapoy.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: At sa tindi ng iyong kadakilaan
  rationale: Ang בְּ sa parirala ay maaaring tumukoy sa kalagayan o paraan, at ang רֹב ay nagpapahiwatig ng matinding laki o kasaganaan. Likas sa makabagong Tagalog ang “sa tindi ng iyong kadakilaan” at napapanatili nito ang makapangyarihang himig ng tula.
- source_word: תַּהֲרֹס
  choice: ibinabagsak mo
  rationale: Karaniwang nangangahulugang gibain o wasakin ang הרס. Dahil mga taong lumalaban ang layon dito, mas natural ang “ibinabagsak” habang nananatili ang larawang militar at patula.
- source_word: קָמֶיךָ
  choice: ang mga bumabangon laban sa iyo
  rationale: Ang participle mula sa קום ay literal na tumutukoy sa mga bumabangon o tumitindig laban sa Diyos. Pinananatili ng salin ang pandiwang lakas sa halip na paikliin lamang bilang “mga kaaway.”
- source_word: תְּשַׁלַּח
  choice: ipinadadala mo
  rationale: Tuwirang kahulugan ng שׁלח ang magpadala. Ang “ipinadadala” ay malinaw at marangal, nang hindi dinaragdagan ang diwang gaya ng “pinakakawalan.”
- source_word: חֲרֹנְךָ
  choice: ang nag-aapoy mong galit
  rationale: Ang חָרוֹן ay galit na inilalarawan sa pamamagitan ng init o pag-aapoy. Pinananatili ng saling ito ang kongkretong larawan at inihahanda ang kasunod na paglalamon na tila apoy.
- source_word: יֹאכְלֵמוֹ
  choice: nilalamon sila nito
  rationale: Ang isahang pandiwa ay tumutukoy pabalik sa isahang “galit.” Ang “nilalamon” ay angkop sa larawan ng apoy na mabilis na tumutupok.
- source_word: כַּקַּשׁ
  choice: na parang dayami
  rationale: Ang קַשׁ ay tuyong dayami o pinaggapasan ng butil na madaling masunog. “Dayami” ang pinakanatural at madaling maunawaang katumbas sa Tagalog.
theological_decisions:
- issue: Wikang naglalarawan sa paghatol ng Diyos
  choice: ipinadadala mo ang nag-aapoy mong galit, at nilalamon sila nito na parang dayami
  alternative: pinakakawalan mo ang iyong poot, at nilalapa sila nito na parang dayami
  rationale: Tuwirang pinananatili ang mapanirang paghatol at larawan ng nag-aapoy na galit, ngunit iniiwasan ang mga salitang mas matindi o mas interpretatibo kaysa sa Hebreo.
- issue: Tuwirang pagtawag sa Diyos sa ikalawang panauhan
  choice: iyong ... mo ... iyo
  alternative: kaniyang ... niya ... kaniya
  rationale: Direktang kinakausap ng awit ang Diyos. Pinananatili ng ikalawang panauhan ang katangian nitong himno ng pagsamba at pagpapahayag.
translation_notes:
  register: Makabago, marangal, at patulang Filipino. Ginamit ang maiikling taludtod upang maipakita ang paralelismo ng awit. Iniwasan ang labis na makalumang bokabularyo habang pinananatili ang matinding larawan ng Hebreo.
