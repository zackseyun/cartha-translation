  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: tl
  text: 'Babagsak sa kanila ang sindak at pangamba;

    sa kadakilaan ng iyong bisig,

    mananatili silang walang kibo na parang bato[a]

    hanggang sa makaraan ang iyong bayan, Yahweh,

    hanggang sa makaraan ang bayang ito na iyong tinamo.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mananatili silang tahimik” o “hindi sila makakakilos.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin ang dalawang paglitaw ng “makaraan” bilang “tumawid.”
    reason: lexical_alternative
  - marker: c
    text: Ang “iyong tinamo” ay maaari ring isaling “iyong binili” o, sa mas malawak na diwang tipanan, “iyong inangkin bilang sarili.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: Babagsak sa kanila ang sindak at pangamba
  rationale: 'Pinananatili ang panghinaharap na diwa ng imperfect na תִּפֹּל at ang dalawang magkalapit ngunit hindi magkaparehong salita para sa matinding takot: אֵימָתָה bilang “sindak” at פַחַד bilang “pangamba.”'
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: sa kadakilaan ng iyong bisig
  rationale: Pinananatili ang larawan ng “bisig” bilang kapangyarihan at ang tuwirang diwa ng גֹּדֶל bilang kadakilaan, sa halip na palitan ang talinghaga ng paliwanag lamang.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: mananatili silang walang kibo na parang bato
  rationale: Ang “walang kibo” ay likas sa modernong Tagalog at maaaring magpahiwatig kapuwa ng pananahimik at hindi pagkilos, kaya napapanatili ang lawak ng kahulugan ng יִדְּמוּ at ang paghahambing sa bato.
- source_word: עַד יַעֲבֹר
  choice: hanggang sa makaraan
  rationale: Ang “makaraan” ay angkop sa pagdaan o pagtawid ng bayan at hindi nililimitahan ang larawan sa isang partikular na pagtawid sa tubig.
- source_word: עַמְּךָ ... עַם זוּ
  choice: iyong bayan ... bayang ito
  rationale: Pinananatili ang kaugnayang ipinahahayag ng “iyong bayan” at ang demonstratibong diin ng זוּ sa “bayang ito.”
- source_word: קָנִיתָ
  choice: iyong tinamo
  rationale: Ang “tinamo” ay malawak na katumbas ng pagkamit o pagtatamo at hindi agad nagpapasiya kung ang diin ay pagbili, pag-angkin, o paggawa sa bayan bilang sariling pag-aari.
theological_decisions:
- issue: Paglalarawan sa kapangyarihan ng Diyos sa זְרוֹעֲךָ
  choice: iyong bisig
  alternative: iyong kapangyarihan
  rationale: Pinanatili ang biblikal na talinghaga ng bisig sa halip na tahasang ipaliwanag ito, upang manatili ang anyong patula at teolohikal ng Hebreo.
- issue: Pagsasalin ng pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo, hindi ang pamalit na titulo.
- issue: Kahulugan ng קָנִיתָ tungkol sa bayan
  choice: iyong tinamo
  alternative: iyong binili / iyong inangkin
  rationale: Pinananatili ng “tinamo” ang malawak na leksikal at tipanang diwa nang hindi ipinipilit na ang taludtod ay partikular na tumutukoy sa pagbili o sa isang teknikal na katawagan para sa pagtubos.
translation_notes:
  register: Makabago ngunit marangal at patulang Filipino. Pinanatili ang parallelism ng dalawang sugnay na “hanggang sa makaraan,” ang talinghaga ng bisig, at ang tunay na kalabuan ng יִדְּמוּ at קָנִיתָ. Inilagay ang mga pananda ng talababa sa mismong mga pariralang ipinaliliwanag ng mga ito.
