  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang panghinaharap na pagbagsak ng sindak at pangamba, ang metaporang “iyong bisig,” ang pagiging tahimik o di-makakilos na gaya ng bato, ang inuulit na “hanggang sa” na may pagdaan ng bayan, ang pangalang Yahweh, at ang demonstratibong “bayang ito.” Ang “iyong tinamo” ay isang maingat at sapat na malawak na salin ng קָנִיתָ at hindi nagdaragdag ng espesipikong doktrina ng pagtubos.'
  naturalness: Natural at marangal ang makabagong Filipino, na angkop sa patulang awit. Ang pag-uulit ng “hanggang sa makaraan” ay nagpapanatili ng parallelism ng Hebreo. Ang “walang kibo na parang bato” ay malinaw at patula.
