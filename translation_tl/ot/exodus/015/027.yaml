  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: tl
  text: Pagkatapos ay dumating sila sa Elim. Doon ay may labindalawang bukal ng tubig at pitumpung puno ng palma.[a] Nagkampo sila roon sa tabi ng tubig.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga puno ng palma” ay maaari ring isaling mas tiyak bilang “mga palma ng datiles.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “sa tabi ng mga tubig.” Sa Hebreo, maramihan ang anyo ng salitang isinaling “tubig,” ngunit karaniwan itong ginagamit bilang kolektibong katawagan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos ay dumating sila
  rationale: Ang anyong wayyiqtol ng בוא ay nagsasalaysay ng sumunod na pangyayari. Likas sa makabagong Tagalog ang “Pagkatapos ay dumating sila,” habang napapanatili ang pagkakasunod-sunod ng salaysay.
- source_word: אֵילִמָה
  choice: sa Elim
  rationale: Isinalin ang hulaping paturol na -ה bilang “sa” at pinanatili sa transliterasyon ang pangalang-pook na Elim.
- source_word: וְשָׁם
  choice: Doon ay may
  rationale: Literal itong “at doon.” Ang “Doon ay may” ay malinaw at natural na paraan upang ipakilala sa Tagalog ang mga bukal at puno na nasa lugar.
- source_word: עֵינֹת מַיִם
  choice: mga bukal ng tubig
  rationale: Ang עַיִן ay maaaring tumukoy sa bukal o pinagmumulan ng tubig. Ang “bukal ng tubig” ay natural at angkop sa konteksto ng isang himpilan sa ilang.
- source_word: תְּמָרִים
  choice: mga puno ng palma
  rationale: Tumutukoy ang salita sa mga palma, malamang ay mga date palm. Pinili ang mas pangkalahatang “puno ng palma” sa teksto upang hindi maging higit na tiyak kaysa sa Hebreo; inilagay sa talababa ang mas espesipikong posibilidad.
- source_word: וַיַּחֲנוּ
  choice: Nagkampo sila
  rationale: Ang חנה ay nangangahulugang magkampo o humimpil. Karaniwan at malinaw sa kasalukuyang Tagalog ang “nagkampo.”
- source_word: עַל הַמָּיִם
  choice: sa tabi ng tubig
  rationale: Sa lokasyong ito, ang עַל ay nagpapahiwatig ng pagiging malapit, hindi ng pagpatong sa ibabaw. Ang “sa tabi ng tubig” ang likas na katumbas sa Tagalog. Bagaman maramihan ang anyo ng מַיִם sa Hebreo, kolektibo ang gamit nito.
