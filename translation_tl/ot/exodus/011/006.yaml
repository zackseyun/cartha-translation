  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: tl
  text: At magkakaroon ng matinding pagdaing sa buong lupain ng Ehipto[a], na hindi pa kailanman nangyari at hindi na kailanman mauulit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “malakas na sigaw” o “matinding panaghoy.” Ang Hebreong צְעָקָה ay maaaring tumukoy sa malakas na sigaw dahil sa matinding paghihirap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: At magkakaroon
  rationale: Ang Qal perfect na may prefixed conjunction ay may panghinaharap na diwa sa konteksto ng propetikong pahayag. Likas sa modernong Tagalog ang “magkakaroon” para sa paglitaw ng isang malawakang hiyawan.
- source_word: צְעָקָה
  choice: hiyawan
  rationale: Tumutukoy ang pangngalan sa malakas na sigaw ng matinding paghihirap. Naipahahayag ng “hiyawan” ang sama-samang malalakas na sigaw sa buong Ehipto, habang inilalahad sa talababa ang iba pang posibleng katumbas.
- source_word: גְדֹלָה
  choice: matinding
  rationale: Bagaman literal na “dakila/malaki,” inilalarawan dito ng pang-uri ang tindi o bigat ng hiyawan. Mas natural at malinaw sa Tagalog ang “matinding” kaysa “malaking hiyawan.”
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Ipinahahayag nito ang saklaw sa kabuuan ng teritoryo ng Ehipto sa natural at marangal na Tagalog.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: isang hiyawang hindi pa kailanman nangyari
  rationale: Pinananatili nito ang paghahambing sa lahat ng naunang pangyayari at ang eventive na gamit ng היה, nang hindi ginagawang mekanikal ang anyo sa Tagalog.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: at hindi na kailanman mangyayari muli
  rationale: Ang negatibong gamit ng יסף ay idyomatikong nagsasaad na hindi na ito mauulit. Ang “kailanman” ay naghahayag ng ganap na puwersa ng pahayag.
