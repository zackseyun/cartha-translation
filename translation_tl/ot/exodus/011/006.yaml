translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “lupain ng Ehipto” upang mapanatili ang heograpikong saklaw ng אֶרֶץ, at inulit ang “hiyawang” sa ikalawang sugnay upang maging malinaw ang tinutukoy ng paghahambing.
