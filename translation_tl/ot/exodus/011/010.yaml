revisions:
- from: Ginawa nina Moises at Aaron ang lahat ng mga tanda na ito[a] sa harap ng Paraon. At pinatigas ni Yahweh ang puso ng Paraon[b], at hindi pinaalis ng Paraon ang mga anak ni Israel[c] mula sa kanyang lupain.
  to: Ginawa nina Moises at Aaron ang lahat ng mga tanda na ito[a] sa harap ng Paraon, at pinatigas ni Yahweh ang puso ng Paraon[b], at hindi pinayagan ng Paraon na umalis ang mga anak ni Israel[c] mula sa kanyang lupain.
  rationale: Pinalitan ang 'hindi pinaalis' ng 'hindi pinayagan ... na umalis' upang malinaw na maipahayag ang pagtanggi ni Paraon na palayain ang Israel. Pinagdikit ang mga sugnay sa isang pangungusap upang mapanatili ang sunod-sunod na daloy ng Hebreo. Inayos ang alternatibong talababa para sa 'puso' upang hindi magpasok ng di-tiyak na kahulugang 'lakas ng loob.'
