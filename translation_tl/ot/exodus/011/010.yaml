base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: tl
  text: Ginawa nina Moises at Aaron ang lahat ng mga tanda na ito[a] sa harap ng Paraon, at pinatigas ni Yahweh ang puso ng Paraon[b], at hindi pinayagan ng Paraon na umalis ang mga anak ni Israel[c] mula sa kanyang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “lahat ng mga kababalaghang ito.” Ang salitang Hebreo ay maaaring tumukoy sa mahimalang mga tanda o kababalaghan.
    reason: lexical_alternative
  - marker: b
    text: O, “pinatatag ni Yahweh ang puso ng Paraon” o “pinalakas ni Yahweh ang puso ng Paraon.”
    reason: lexical_alternative
  - marker: c
    text: O, “mga Israelita.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moises at Aaron
  rationale: Ginamit ang karaniwang modernong anyo sa Filipino ng mga pangalang ito.
- source_word: עָשׂוּ
  choice: ginawa
  rationale: Tuwirang katumbas ng malawak na pandiwang עשה at natural kasama ng 'mga tanda.'
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: lahat ng mga tanda na ito
  rationale: Ang מוֹפֵת ay maaaring tumukoy sa tanda o kababalaghan; pinili ang 'mga tanda' upang mapanatili ang tungkuling nagpapakita ng kapangyarihan ng Diyos.
- source_word: לִפְנֵי פַרְעֹה
  choice: sa harap ng Paraon
  rationale: Tuwiran at likas na salin ng lokatibo at relasyonal na parirala.
- source_word: וַיְחַזֵּק
  choice: pinatigas
  rationale: Bagaman ang saligang larawan ng חזק ay pagpapalakas o pagpapatatag, sa paulit-ulit na pormula tungkol sa puso ng Paraon ay ipinahihiwatig nito ang pinatibay na pagmamatigas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: לֵב פַּרְעֹה
  choice: puso ng Paraon
  rationale: Natural na Filipino para sa relasyong construct sa Hebreo.
- source_word: שִׁלַּח
  choice: pinaalis
  rationale: Sa konteksto ng Exodo, malinaw at natural nitong ipinapahayag ang hindi pagpapalaya o hindi pagpapaalis sa Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit sa literal na anyo ng Hebreo at natural sa tradisyong biblikal sa Filipino; kolektibo itong tumutukoy sa bayan ng Israel.
- source_word: מֵאַרְצוֹ
  choice: mula sa kanyang lupain
  rationale: Tuwirang ipinapahayag ang pag-alis mula sa lupaing sakop ng Paraon.
theological_decisions:
- issue: Ang pagkilos ni Yahweh sa puso ng Paraon
  choice: pinatigas ni Yahweh ang puso ng Paraon
  alternative: pinatatag ni Yahweh ang puso ng Paraon / pinalakas ni Yahweh ang loob ng Paraon
  rationale: Pinananatili ng 'pinatigas' ang karaniwang kontekstuwal na diwa at ang tensiyong teolohikal tungkol sa pagkilos ng Diyos at pananagutan ng Paraon, habang inilalahad sa talababa ang mas literal na larawan ng pandiwa.
- issue: Ang kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang larawan ng pinagmulang angkan sa Hebreo nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy; sa Filipino, hindi likas na may kasariang panlalaki ang 'anak.'
- issue: Ang paksa ng huling pandiwa
  choice: hindi pinaalis ng Paraon
  alternative: hindi niya pinaalis
  rationale: Sa Hebreo, ipinahihiwatig lamang ng anyong panlalaking isahan ang paksa. Nilinaw sa Filipino na ang Paraon ang hindi nagpapaalis, ayon sa pinakamalapit na pangngalan at sa takbo ng salaysay, upang maiwasang mapagkamalang si Yahweh ang paksa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang pangalang Yahweh, ang payak na sunuran ng mga sugnay sa Hebreo, at ang teolohikal na tensiyon ng 'pinatigas.' Ginamit ang 'mga tanda na ito' sa halip na 'mga tandang ito' upang maiwasan ang posibleng sandaling pagkalito sa salitang 'tandang.'
