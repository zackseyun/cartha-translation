  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: tl
  text: Ipinagkaloob ni Yahweh na kalugdan ng mga Ehipsiyo ang bayan.[a] Bukod dito, ang lalaking si Moises[b] ay lubhang dakila sa lupain ng Ehipto, sa paningin ng mga lingkod ng Paraon[c] at sa paningin ng bayan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “nagbigay si Yahweh sa bayan ng lingap sa paningin ng mga Ehipsiyo.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “si Moises mismo”; tahasang nasa Hebreo ang “ang lalaking si Moises,” na nagbibigay-diin sa kaniya.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “mga opisyal ng Paraon”; sa literal, “mga lingkod ng Paraon.”
    reason: lexical_alternative
  - marker: d
    text: Malamang na ang huling “bayan” ay tumutukoy sa mas malawak na populasyon ng Ehipto, bilang kaibahan sa mga lingkod ng Paraon.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang “Yahweh” para sa tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתֵּן ... חֵן
  choice: ipinagkaloob ... na kalugdan
  rationale: Ang literal na “nagbigay ng lingap/pabor” ay isang idyoma para sa pagkakaroon ng mabuting pagtanggap. Ang saling ito ay likas sa modernong Tagalog at pinananatiling si Yahweh ang pinagmumulan ng pagtanggap na iyon.
- source_word: הָעָם
  choice: ang bayan
  rationale: Hindi tahasang inuulit ng Hebreo ang “mga Israelita.” Ang “bayan” ay nagpapanatili sa pangkalahatang katawagan habang malinaw sa konteksto kung sino ang tinutukoy.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: ng mga Ehipsiyo
  rationale: Isinalin ayon sa kahulugan ng idyomang “sa mga mata/paningin ng mga Ehipsiyo,” sapagkat ang “kalugdan ng” ay mas likas na pagpapahayag sa Tagalog.
- source_word: גַּם
  choice: Bukod dito
  rationale: Ipinahahayag nito ang pandagdag at bahagyang mariing tungkulin ng גַּם sa pagsisimula ng kasunod na pahayag.
- source_word: הָאִישׁ מֹשֶׁה
  choice: ang lalaking si Moises
  rationale: Pinananatili ang tahasang הָאִישׁ (“ang lalaki”) bago ang pangalan, kahit hindi ito karaniwang kailangan sa Tagalog, dahil may diin ang anyo sa Hebreo.
- source_word: גָּדוֹל מְאֹד
  choice: lubhang dakila
  rationale: Pinananatili ang malawak na diwa ng pambihirang kadakilaan o katanyagan nang hindi ito nililimitahan sa “mahalaga” o “iginagalang.”
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Pinanatili ang buong pariralang Hebreo sa halip na paikliin lamang bilang “sa Ehipto.”
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: sa paningin ng mga lingkod ng Paraon
  rationale: Ang עַבְדֵי ay literal na “mga lingkod,” bagaman sa konteksto ng palasyo maaari silang mga opisyal.
- source_word: וּבְעֵינֵי הָעָם
  choice: at sa paningin ng bayan
  rationale: Pinanatili ang payak na הָעָם (“ang bayan”) at ang pag-uulit ng idyomang “sa paningin,” nang hindi tahasang tinutukoy bilang mga Ehipsiyo o karaniwang mamamayan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; ang PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo at iniiwasang palitan ito ng titulo; hindi ito nagdaragdag ng natatanging aral ng anumang denominasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kalugdan” upang likas na maipahayag ang idyomang Hebreo tungkol sa mabuting pagtanggap, ngunit inilagay sa talababa ang mas literal na anyo. Pinanatili ang di-pangkaraniwang “ang lalaking si Moises” dahil may tahasang diin ito sa pinagmulan.
