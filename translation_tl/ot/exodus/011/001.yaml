  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Isa pang salot[a] ang ipapasapit ko sa Faraon at sa Ehipto. Pagkatapos nito, paaalisin niya kayo rito. Kapag pinaalis niya kayo, tiyak na lubusan niya kayong itataboy mula rito.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “dagok,” “hampas,” o “kapinsalaan” ang salitang Hebreo na isinaling “salot.”
    reason: lexical_alternative
  - marker: b
    text: Mariin ang pananalitang Hebreo na isinaling “tiyak na lubusan niya kayong itataboy.” Ang pandiwang “itataboy” ay inuulit sa anyong nagbibigay-diin; ipinahihiwatig din ng isang salita ang “lubusan” o “ganap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahihiwatig ng anyong pasalaysay ang pagsulong ng pangyayari; natural itong ipinapahayag sa modernong Tagalog bilang “Pagkatapos, sinabi.”
- source_word: עוֹד נֶגַע אֶחָד
  choice: Isa pang salot
  rationale: Ang עוֹד ay nagdaragdag ng isa pa, at sa konteksto ng mga hatol sa Ehipto, malinaw na katumbas ng נֶגַע ang “salot,” bagaman mas malawak ang saklaw ng salitang Hebreo.
- source_word: אָבִיא עַל
  choice: ipapasapit ko kay
  rationale: Ang Hiphil ng בוא ay “magdala/magpasapit,” at ipinapakita ng “ipapasapit” na ang salot ay darating bilang gawa ng Diyos laban kay Faraon at sa Ehipto.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: paaalisin niya kayo rito
  rationale: Ang שׁלח ay maaaring mangahulugang paalisin o payagang umalis. Ang “paaalisin” ay likas sa Tagalog at naghahanda sa mas mariing “itataboy” sa kasunod na sugnay.
- source_word: כְּשַׁלְּחוֹ
  choice: Kapag pinaalis niya kayo
  rationale: Temporal ang gamit ng כְּ sa konteksto; ipinapakita ng “kapag” ang ugnayan sa naunang pahayag nang hindi dinaragdagan ang kahulugan.
- source_word: כָּלָה
  choice: lubusan
  rationale: Ginamit itong pang-abay upang ipahayag ang ganap o lubos na pagpapaalis, hindi upang sabihing “lahat” bilang hiwalay na layon.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: tiyak na ... itataboy
  rationale: Ang infinitive absolute na kasunod ng finite verb ay mariin. Ang “tiyak na” ay naghahatid ng diin, at ang “itataboy” ay mas malakas kaysa “paaalisin.”
- source_word: מִזֶּה
  choice: mula rito
  rationale: Direktang tumutukoy ito sa kasalukuyang lugar, ang Ehipto; natural sa Tagalog ang “mula rito.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “Panginoon.”
- issue: Tindi at kabuuan ng pagpapaalis
  choice: tiyak na lubusan niya kayong itataboy
  alternative: itataboy niya kayong lahat
  rationale: Pinananatili ng salin ang diin ng גָּרֵשׁ יְגָרֵשׁ at ang kabuuang lakas ng כָּלָה nang hindi ipinapalagay na ang כָּלָה ay tumutukoy lamang sa bilang ng mga taong pinaaalis.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Faraon” at “Ehipto,” at pinanatili ang pagkakaiba ng karaniwang pagpapaalis at ng mariin at lubusang pagtataboy sa huling sugnay.
