  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: tl
  text: At mamamatay ang bawat panganay sa lupain ng Ehipto—mula sa panganay ng Paraon na nakaupo sa kanyang trono hanggang sa panganay ng aliping babae[a] na nasa likod ng mga batong panggiling—at ang bawat panganay ng mga alagang hayop.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “babaeng alipin.” Tumutukoy ang Hebreo sa isang babaeng nasa kalagayang alipin; inilalarawan ng “nasa likod ng mga batong panggiling” ang mababang-katayuang gawain ng paggiling.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: At mamamatay
  rationale: Ang anyong perpekto sa konteksto ng tiyak na pahayag tungkol sa darating na salot ay likas na isinasalin sa hinaharap sa Filipino. Ipinahahayag ng “mamamatay” ang katiyakan ng pangyayari nang hindi ito ginagawang naganap na.
- source_word: כָּל בְּכוֹר
  choice: ang bawat panganay
  rationale: Ipinananatili ng “bawat” ang distributibong puwersa ng כָּל, at hindi nililimitahan ng “panganay” sa anak na lalaki ang salitang Hebreo.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Malinaw at marangal na katumbas ito ng tahasang heograpikong parirala sa Hebreo.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: mula sa panganay ... hanggang sa panganay
  rationale: Likas nitong ipinahahayag sa Filipino ang buong saklaw ng lipunang tatamaan, mula sa pinakamataas hanggang sa pinakamababang kalagayan.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: Paraon na nakaupo sa kanyang trono
  rationale: Pinananatili ng sugnay ang larawan ng Paraon sa kanyang naghaharing katayuan at ang patuloy na diwa ng participle.
- source_word: הַשִּׁפְחָה
  choice: aliping babae
  rationale: Tuwirang ipinakikita nito ang kalagayang alipin ng babae at pinananatili ang matinding panlipunang paghahambing sa Paraon.
- source_word: אַחַר הָרֵחָיִם
  choice: nasa likod ng mga batong gilingan
  rationale: Pinananatili nito ang kongkretong larawan ng babaeng nasa puwesto ng mababang-uring gawaing paggiling, sa halip na gawing pangkalahatan lamang ang gawain.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: pati ang bawat panganay ng mga alagang hayop
  rationale: Ang בְּהֵמָה ay tumutukoy nang malawakan sa domestikadong mga hayop, hindi lamang sa baka; likas sa Filipino ang “mga alagang hayop.”
theological_decisions:
- issue: Paglalarawan sa katayuang panlipunan ng שִׁפְחָה
  choice: aliping babae
  alternative: babaeng lingkod; utusang babae
  rationale: Mahalaga sa retorika ng talata ang saklaw mula sa maharlikang sambahayan hanggang sa babaeng alipin na gumagawa ng mababang-uring trabaho. Hindi dapat palambutin ang tunay na kalagayang ipinahihiwatig ng terminong Hebreo.
- issue: Kasarian ng בְּכוֹר
  choice: panganay
  alternative: panganay na anak na lalaki
  rationale: Hindi tahasang nililimitahan ng mismong salita sa talatang ito ang panganay sa lalaki. Ang “panganay” ay nagpapanatili sa lawak at kaunting kalabuan ng Hebreo at angkop din sa kasunod na pagtukoy sa mga hayop.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang gitling na em upang luminaw ang saklaw na “mula ... hanggang ...” nang hindi binabago ang ugnayan ng mga parirala. Inilagay ang talababa pagkatapos ng “aliping babae,” ang mismong salitang nililinaw nito.
