base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Moises, “Ganito ang sabi ni Yahweh: Bandang hatinggabi[a], lalabas ako patungo sa gitna ng Ehipto.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Sa hatinggabi.” Ang panlaping Hebreo na כְּ־ ay maaaring magpahiwatig ng pagtatantiya, kaya isinaling “Bandang hatinggabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural na naipapahayag ito sa modernong Tagalog sa pamamagitan ng “Pagkatapos ay sinabi.”
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang ito sa Tagalog.
- source_word: כֹּה אָמַר
  choice: Ganito ang sabi
  rationale: Pinananatili nito ang pormulang ginagamit sa paghahatid ng mensahe habang natural at marangal ang tunog sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Bandang hatinggabi
  rationale: Ang unlaping כְּ־ ay maaaring magpahiwatig ng pagtatantiya; malinaw na naihahatid ng “bandang” ang kahulugang iyon.
- source_word: אֲנִי
  choice: ako
  rationale: Pinananatili ang tahasang panghalip na nagbibigay-diin sa mismong pagkilos ni Yahweh.
- source_word: יוֹצֵא
  choice: lalabas
  rationale: Ang participle ay tumutukoy rito sa nalalapit na pagkilos; natural itong ipahayag sa aspektong panghinaharap sa Tagalog.
- source_word: בְּתוֹךְ
  choice: sa gitna ng
  rationale: Pinananatili ang malawak na kahulugan ng parirala nang hindi labis na tinutukoy kung ang kilos ay papasok o daraan sa buong lupain.
- source_word: מִצְרָיִם
  choice: Ehipto
  rationale: Karaniwang modernong Tagalog na pangalan ng lugar.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo; ang “Yahweh” ay mas malapit na transliterasyon at hindi ito pinapalitan ng titulo.
- issue: Pamanahong diwa ng כַּחֲצֹת הַלַּיְלָה
  choice: Bandang hatinggabi
  alternative: Pagsapit ng hatinggabi
  rationale: Pinananatili ng napiling salin ang posibleng pagtatantiya ng prefixed כְּ־ at hindi ginagawang higit na eksakto ang oras kaysa sa ipinahihintulot ng Hebreo.
- issue: Direksiyon ng בְּתוֹךְ kasunod ng יוֹצֵא
  choice: lalabas ako sa gitna ng Ehipto
  alternative: pupunta ako sa gitna ng Ehipto; daraan ako sa gitna ng Ehipto
  rationale: Hindi tahasang nililinaw ng Hebreo kung ang diin ay pagpasok o pagdaan. Pinananatili ng salin ang pandiwang “lalabas” at ang lokatibong “sa gitna” upang hindi tahimik na lutasin ang bahagyang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Ganito ang sabi” bilang natural na pormula ng paghahatid ng banal na mensahe, at inilagay ang talababa sa mismong pariralang pamanahon na tinutukoy nito.
