  naturalness: Natural at marangal ang “Ganito ang sabi ni Yahweh” at “Bandang hatinggabi.” Inalis ang hindi kailangang panloob na panipi upang maging karaniwan ang bantas ng tuwirang pananalita sa modernong Tagalog.
  terminology: Ang “Moises,” “Yahweh,” at “Ehipto” ay angkop at pare-pareho. Pinanatili ang “Yahweh” bilang pagsasalin ng Tetragrammaton.
