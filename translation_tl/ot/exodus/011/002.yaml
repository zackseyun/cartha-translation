base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: tl
  text: Sabihin mo ngayon sa pandinig ng bayan na humingi ang bawat lalaki sa kapwa niyang lalaki, at ang bawat babae sa kapwa niyang babae, ng mga bagay na gawa sa pilak at mga bagay na gawa sa ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “humiram.” Ang pandiwang Hebreo ay nangangahulugang “humingi” o “hilingin” at hindi nito mismo ipinahihiwatig na isasauli ang mga bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Sabihin mo ngayon
  rationale: Ang Piel imperative na דַּבֶּר ay tuwirang utos na magsalita, at ang נָא rito ay likas na naipapahayag bilang “ngayon,” na nagpapahiwatig ng agarang pagkilos nang hindi ginagawang labis na magalang ang utos.
- source_word: בְּאָזְנֵי הָעָם
  choice: sa pandinig ng bayan
  rationale: Pinananatili nito ang idyomang Hebreo tungkol sa mga tainga habang natural na ipinahihiwatig na dapat itong sabihin nang hayagan at maririnig ng bayan.
- source_word: וְיִשְׁאֲלוּ
  choice: na ... ay humingi
  rationale: Ang imperfect/jussive pagkatapos ng pautos ay may puwersang nag-uutos. Ang “humingi” ang tuwirang kahulugan ng שאל at hindi nito ipinapalagay na isasauli ang mga bagay.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: ang bawat lalaki ... sa kaniyang kapitbahay na lalaki
  rationale: Pinananatili ang panlalaking distributibong anyo at ang kaagapay nitong tahasang pambabaeng parirala. Nililinaw ng “na lalaki” ang kasarian ng רֵעֵהוּ sa kontekstong ito.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: at ang bawat babae sa kaniyang kapitbahay na babae
  rationale: Pinananatili ang pambabaeng distributibong anyo at ang pambabaeng katapat ng “kapitbahay,” gaya ng ipinahihiwatig ng רְעוּתָהּ.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: mga kagamitang pilak at mga kagamitang ginto
  rationale: Malawak ang saklaw ng כְּלִי—maaaring kagamitan, sisidlan, o iba pang bagay—kaya hindi ito nililimitahan sa alahas o sisidlan lamang.
theological_decisions:
- issue: Kahulugan ng שאל kaugnay ng pagtanggap ng Israel ng mahahalagang bagay mula sa mga Ehipsiyo
  choice: humingi
  alternative: humiram
  rationale: Ang pandiwang Hebreo ay nangangahulugang humingi o mag-request at hindi nito likas na sinasabing kailangang isauli ang mga bagay. Hindi dapat ipasok sa pangunahing teksto ang obligasyong magsauli na wala naman sa pandiwa; gayunman, itinatala sa talababa ang tradisyonal na alternatibo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang “sa pandinig ng bayan” upang maipakita ang idyomang Hebreo, at ginamit ang “bayan” para sa kolektibong הָעָם. Ang tahasang “kapitbahay na lalaki/babae” ay nagpapanatili sa magkatugmang kasariang anyo ng orihinal.
