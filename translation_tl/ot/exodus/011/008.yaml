base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: tl
  text: At bababa rito sa akin ang lahat ng mga lingkod mong ito[a] at yuyukod sa akin. Sasabihin nila, ‘Lumabas ka—ikaw at ang buong bayang sumusunod sa iyo[b].’ Pagkatapos niyon ay lalabas ako.” Pagkasabi nito, umalis si Moises mula sa harap ng Paraon habang nag-aalab sa galit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga opisyal mong ito.” Sa kontekstong ito, ang salitang Hebreo para sa “mga lingkod” ay maaari ring tumukoy sa mga opisyal o tauhan ng palasyo.
    reason: lexical_alternative
  - marker: b
    text: Literal, “ang buong bayang nasa iyong mga paa,” isang idyoma para sa mga kasama o sumusunod sa isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: bababa rito sa akin
  rationale: Pinananatili ang direksiyong larawan ng ירד (‘bumaba’) at ang pananaw ni Moises sa pamamagitan ng ‘rito sa akin.’
- source_word: עֲבָדֶיךָ
  choice: mga lingkod mong ito
  rationale: Maaaring tumukoy ang עבד sa mga lingkod o mga opisyal ng hari. Pinananatili ng ‘mga lingkod’ ang malawak na kahulugan, habang inilalahad sa talababa ang angkop na kahulugang panghukuman.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: yuyukod sa akin
  rationale: Malinaw na ipinahahayag ang pisikal na pagpapakumbaba o paggalang nang hindi ipinapalagay na ito ay pagsamba.
- source_word: צֵא אַתָּה
  choice: Lumabas ka—ikaw
  rationale: Pinananatili ang karaniwang kahulugan ng יצא at ang diin ng tahasang panghalip na אַתָּה.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: at ang buong bayang sumusunod sa iyo
  rationale: Natural na inililipat sa Tagalog ang idyomang literal na ‘nasa iyong mga paa,’ na tumutukoy sa mga kasama o tagasunod.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Pagkatapos niyon ay lalabas ako
  rationale: Pinananatili ang malinaw na pagkakasunod-sunod at ang pag-uulit ng pandiwang יצא.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: umalis si Moises mula sa harap ng Paraon
  rationale: Ginagawang malinaw ang kontekstuwal na paksa at natural na isinasalin ang pag-alis mula sa presensiya ng Paraon.
- source_word: בָּחֳרִי אָף
  choice: habang nag-aalab sa galit
  rationale: Pinananatili ang larawang init o paglalagablab sa Hebreong parirala at ang tindi ng galit.
