  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: tl
  text: Ngunit laban sa sinuman sa Israel, tao man o hayop, walang asong tatahol, upang malaman ninyo na itinatangi ni Yahweh ang Ehipto at Israel sa isa’t isa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “walang asong magpapatalim ng dila nito.” Isang idyomang nagpapahiwatig na walang asong tatahol laban sa kanila, kaya lubos ang kapayapaan at kaligtasan ng Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Ngunit laban sa sinumang kabilang sa mga anak ni Israel
  rationale: 'Ang וּ ay kontrastibo kaugnay ng kapahamakang sasapit sa Ehipto, at ang לְכֹל ay tumutukoy sa saklaw: walang sinuman sa Israel ang makararanas ng gayong pag-atake. Pinanatili ang Hebreong katawagang “mga anak ni Israel” sa paraang malinaw sa modernong Tagalog.'
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: walang asong magtatarak ng dila nito
  rationale: Pinananatili nito ang matalim at di-pangkaraniwang larawan ng pandiwang חרץ kaugnay ng dila, sa halip na tahimik na palitan ito ng “tahol.” Ipinapahiwatig ng idyoma na lubos na payapa at ligtas ang Israel; nililinaw sa talababa ang posibleng idyomatikong diwa.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: tao man o hayop
  rationale: 'Natural na Tagalog na naghahayag ng ganap na saklaw ng merismo: mula sa mga tao hanggang sa mga hayop.'
- source_word: לְמַעַן תֵּדְעוּן
  choice: upang malaman ninyo
  rationale: Tuwirang ipinahahayag ang layunin at pinananatili ang pangmaramihang ikalawang panauhan.
- source_word: יַפְלֶה
  choice: ipinakikita ... ang pagkakaiba
  rationale: Sa Hiphil at sa kontekstong ito, tumutukoy ang pandiwa sa pagtatangi o pagbubukod sa Ehipto at Israel. Ang pariralang ito ay malinaw at likas sa Tagalog nang hindi ginagawang simpleng abstraktong paghahambing ang kilos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang personal na pangalang Yahweh sa halip na palitan ng titulong “PANGINOON.”
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: ng Ehipto at Israel
  rationale: Pinananatili ang mga pambansang pangalan at ang tipanang paghahambing na nasa Hebreo.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Diwa ng pagtatangi sa Ehipto at Israel
  choice: ipinakikita ni Yahweh ang pagkakaiba
  alternative: ibinubukod ni Yahweh ang Israel mula sa Ehipto; gumagawa si Yahweh ng kababalaghan
  rationale: Ang konteksto ay malinaw na paghihiwalay ng magiging kapalaran ng dalawang bayan. Hindi pinili ang diwang “gumagawa ng kababalaghan,” ngunit iniwasan ding tukuyin nang higit sa sinasabi ng talata ang paraan ng pagtatangi.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “mga anak ni Israel” at ang matingkad na larawan ng aso, habang ginawang natural ang merismong “tao man o hayop.”
