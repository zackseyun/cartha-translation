base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: tl
  text: Sinabi[c] ni Yahweh kay Moises, “Hindi makikinig sa inyo ang Paraon[a], upang dumami ang aking mga kababalaghan[b] sa lupain ng Ehipto.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Hindi kayo diringgin ng Paraon” o “Hindi kayo pakikinggan ng Paraon.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “aking mga tanda.” Ang salitang Hebreo ay maaaring tumukoy sa mga kababalaghan, tanda, o pangyayaring nagbabadya.
    reason: lexical_alternative
  - marker: c
    text: Isinasalin ito ng ilan na “Nauna nang sinabi ni Yahweh kay Moises” upang iugnay ang pahayag sa naunang takbo ng salaysay; ngunit ang anyong pandiwa sa Hebreo ay ang karaniwang anyo para sa nagdaang pangyayari sa isang salaysay.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa anyong transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Ang wayyiqtol ay karaniwang nagsusulong ng salaysay bilang payak na nagdaang kilos. Hindi hinihingi ng anyong Hebreo ang “naunang sinabi,” kahit posible iyon bilang pagbasa batay sa konteksto.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: Hindi makikinig sa inyo
  rationale: Ang שׁמע na may אֶל ay nangangahulugang makinig o tumalima. Ang “makikinig” ay natural at hindi labis na nililinaw bilang “susunod.” Ginamit ang maramihang “inyo” dahil maramihan ang hulaping Hebreo at tumutukoy sa pangkat nina Moises at Aaron, bagaman si Moises ang tuwirang kausap.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw na ipinahahayag ng “upang” ang layunin, habang maaari pa ring madama sa konteksto ang kaugnay na bunga.
- source_word: רְבוֹת
  choice: dumami
  rationale: Ang infinitive construct ng רבה ay tumutukoy sa pagdami ng mga kababalaghan. Ang “dumami” ay likas sa Tagalog at hindi nagpapasok ng tahasang tagaganap na wala sa anyong Hebreo.
- source_word: מוֹפְתַי
  choice: aking mga kababalaghan
  rationale: Ang מוֹפֵת ay maaaring tumukoy sa kababalaghan, tanda, o pangyayaring nagbabadya. Ang “mga kababalaghan” ay angkop sa salaysay ng mga salot at pinananatili ang diin sa pambihirang gawa.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Isinasalin nito ang buong pariralang may אֶרֶץ at nananatiling natural at marangal sa modernong Tagalog.
theological_decisions:
- issue: Ang layunin ng Diyos kaugnay ng pagtanggi ng Paraon
  choice: Inihahayag ng talata na hindi makikinig ang Paraon upang dumami ang mga kababalaghan ng Diyos sa Ehipto.
  alternative: 'Maaaring unawain ang kaugnayan bilang bunga lamang: hindi makikinig ang Paraon, kaya darami ang mga kababalaghan ng Diyos.'
  rationale: Karaniwang nagpapahayag ng layunin ang לְמַעַן. Pinananatili ng salin ang tensiyon sa pagitan ng pagtanggi ng Paraon at ng layunin ng Diyos nang hindi nagdaragdag ng paliwanag tungkol sa pagpapatigas ng puso na wala sa talatang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Pinanatili ang pangalang “Yahweh,” ang maramihang “sa inyo,” at ang purposibong “upang,” habang iniwasan ang labis na pagpapaliwanag sa pangunahing teksto.
