  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: tl
  text: Kapag inaayos ni Aaron ang mga ilawan sa dapit-hapon[a], magsusunog siya ng insensong regular na inihahandog[b] sa harap ni Yahweh sa lahat ng inyong salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa pagitan ng mga gabi,” isang idyoma para sa panahon ng takipsilim.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “palagiang insenso.” Maaaring idiin ng salitang Hebreo ang patuloy na pagganap o ang regular na pag-uulit ng itinakdang paghahandog.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: At kapag inayos
  rationale: Ang בְּ na kasama ng infinitive construct ay bumubuo ng sugnay na panahunan, “kapag.” Sa konteksto ng mga ilawan, maaaring tumukoy ang Hiphil ng עלה sa pagpapaliyab o paghahanda ng mga ito upang magningas; pinananatili ng “inayos” ang ritwal na diwa nang hindi nililimitahan sa mismong pagsisindi.
- source_word: הַנֵּרֹת
  choice: ang mga ilawan
  rationale: Karaniwang tawag ito sa mga ilawan sa konteksto ng mga kagamitan ng tabernakulo.
- source_word: בֵּין הָעַרְבַּיִם
  choice: sa dapit-hapon
  rationale: Ang literal na idyoma ay “sa pagitan ng mga gabi” at tumutukoy sa yugto ng takipsilim o gabi. Natural at malinaw sa makabagong Filipino ang “sa dapit-hapon”; inilalagay sa talababa ang literal na anyo.
- source_word: יַקְטִירֶנָּה
  choice: susunugin niya iyon
  rationale: Sa konteksto ng insenso, ang Hiphil ng קטר ay nangangahulugang magsunog bilang handog o paasingawin. Ang hulaping pambabae ay tumutukoy sa קְטֹרֶת, kaya ang “iyon” ay tumutukoy sa insenso.
- source_word: קְטֹרֶת תָּמִיד
  choice: bilang palagiang insenso
  rationale: Ang קְטֹרֶת ay “insenso,” samantalang ang תָּמִיד ay maaaring magpahiwatig ng patuloy o regular na pag-uulit. Ang “palagiang” ay nagpapanatili sa saklaw ng kahulugan nang hindi nagsasabing walang tigil ang pagsusunog sa bawat sandali.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Ipinahihiwatig ng לִפְנֵי ang presensiya sa banal na lugar, at ang pangalang tipan na יהוה ay isinasalin bilang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahihiwatig ng parirala ang pagpapatuloy ng itinakdang gawain sa magkakasunod na salinlahi ng Israel.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng תָּמִיד sa gawaing pangkulto
  choice: palagiang
  alternative: tuluy-tuloy; regular
  rationale: Maaaring tumukoy ang salita sa nagpapatuloy na bisa o sa regular na pag-uulit. Dahil itinakda ang insenso sa umaga at dapit-hapon, hindi dapat ipakahulugang walang patid sa bawat sandali; nililinaw ito sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapit-hapon” bilang natural na katumbas ng idyomang Hebreo at “salinlahi” para sa pormal ngunit madaling maunawaang wikang biblikal. Ang “inayos” ay sadyang nagpapanatili sa posibilidad na kasama rito kapwa ang paghahanda at pagpapaliyab ng mga ilawan.
