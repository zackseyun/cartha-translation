    rationale: Ang “pati ng patungan nitong tanso” ay mabigat at maaaring pansamantalang magpalabo sa ugnayan. Ang hiwalay na panaguri para sa patungan ay mas malinaw.
  - severity: low
    issue: Hindi ganap na Filipino ang mga alternatibong termino ng metal sa talababa.
    rationale: Mas pare-pareho sa target na modernong Filipino ang “tanso” at “bronse” kaysa “copper” at “bronze.”
