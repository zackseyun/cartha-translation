  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: tl
  text: Gagawa ka ng isang palangganang[a] tanso[b], at ang patungan[c] nito ay tanso rin, para sa paghuhugas. Ilalagay mo ito sa pagitan ng Toldang Tipanan at ng altar, at maglalagay ka roon ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “malaking hugasan,” isang sisidlang ginagamit sa paghuhugas sa tabernakulo.
    reason: lexical_alternative
  - marker: b
    text: Ang “tanso” ay maaari ring tumukoy sa bronse, isang haluang metal, depende sa konteksto.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isaling “paanan” o “base.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: palanggana
  rationale: Tumutukoy sa malaking sisidlan ng tubig para sa rituwal na paghuhugas. Ang “palanggana” ay likas at madaling maunawaan sa makabagong Filipino.
- source_word: נְחֹשֶׁת
  choice: tanso
  rationale: Maaaring tumukoy ang salitang Hebreo sa purong copper o sa haluang metal nito. “Tanso” ang karaniwang salin sa Filipino at hindi nito pinipilit ang eksaktong metalurhikal na komposisyon.
- source_word: כַּן
  choice: patungan
  rationale: Tumutukoy sa estrukturang sumusuporta sa palanggana. Malinaw sa Filipino ang gamit ng “patungan”; maaari ring sabihing “paanan.”
- source_word: לְרָחְצָה
  choice: para sa paghuhugas
  rationale: Pinananatili ang maikling pahayag ng layunin sa Hebreo nang hindi tahasang nagdaragdag kung sino o ano ang huhugasan.
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ang parirala ay tumutukoy sa sagradong tolda kung saan nakikipagtagpo ang Diyos sa kaniyang bayan. “Toldang Tipanan” ay isang malinaw at marangal na katawagan sa Filipino.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Karaniwan at madaling makilalang salitang Filipino para sa dambanang pinaghahandugan.
- source_word: שָׁמָּה ... מָיִם
  choice: lalagyan mo iyon ng tubig
  rationale: Literal na “maglalagay ka roon ng tubig.” Ginawang tahasan ang tinutukoy na palanggana upang maging natural at malinaw sa Filipino.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Gagawa ka ... Ilalagay mo ... lalagyan mo
  rationale: Ang mga anyo ay may puwersang pautos sa konteksto. Ang hinaharap na anyo sa Filipino ay nagpapanatili sa marangal na estilo ng tagubiling tipan.
