  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palanggana” at “patungan” bilang mga salitang madaling maunawaan, habang pinanatili sa mga talababa ang mga leksikal na alternatibo at ang di-tiyak na uri ng metal.
