  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: tl
  text: Babalutan mo ito ng purong ginto—ang ibabaw nito, ang mga gilid nito sa palibot, at ang mga sungay nito. Gagawa ka rin para rito ng isang moldurang ginto sa palibot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang koronang ginto sa palibot.” Ang Hebreong zer ay maaaring tumukoy sa hangganan, nakausling gilid, o moldurang hugis-korona.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Babalutan mo
  rationale: Ang pandiwang צפה sa konstruksiyong ito ay tumutukoy sa paglalapat ng metal na balot sa isang bagay; natural at malinaw sa modernong Filipino ang “babalutan.”
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Tuwirang ipinahahayag nito ang mataas na kadalisayan ng ginto at karaniwang parirala ito sa Filipino.
- source_word: גַּגּוֹ
  choice: ang ibabaw nito
  rationale: Bagaman maaaring mangahulugang “bubong” ang גג, ang tinutukoy dito ay ang pang-ibabaw na bahagi ng isang maliit na altar; mas angkop ang “ibabaw.”
- source_word: קִירֹתָיו
  choice: ang mga gilid nito
  rationale: Literal itong “mga pader nito,” ngunit para sa maliit na kagamitang tulad ng altar, mas natural ang “mga gilid” bilang tawag sa mga patayong panig nito.
- source_word: סָבִיב
  choice: sa palibot / palibot na
  rationale: Pinananatili nito ang diwang lubos na nakapaligid at ang pag-uulit ng salitang Hebreo sa dalawang bahagi ng talata.
- source_word: קַרְנֹתָיו
  choice: ang mga sungay nito
  rationale: Pinananatili ang literal at mahalagang terminong pangkulto para sa mga nakausling bahagi sa mga sulok ng altar.
- source_word: וְעָשִׂיתָ לוֹ
  choice: Gagawa ka rin para rito
  rationale: Ipinakikita ng “para rito” ang ugnayang minamarkahan ng ל, at malinaw na ang palamuti ay gagawin para sa altar.
- source_word: זֵר זָהָב
  choice: moldurang ginto
  rationale: Ang זֵר ay isang pandekorasyong hangganan o moldura sa palibot ng sagradong kagamitan. Ang “moldura” ay malinaw na pisikal na katangian at hindi agad nag-aangkat ng maharlikang kahulugan ng “korona.”
theological_decisions:
- issue: Pagpapahayag sa mga terminong tumutukoy sa kagamitang pangsamba
  choice: Panatilihin ang “mga sungay” at isalin ang זֵר bilang “moldura.”
  alternative: Isalin ang זֵר bilang “korona,” “gilid,” o “rim.”
  rationale: Naglalarawan ang talata ng pagkakagawa ng altar at hindi tahasang nagpapahayag ng simbolismong maharlika. Pinananatili ng “mga sungay” ang kinikilalang anyo ng altar, samantalang malinaw na inilalarawan ng “moldura” ang pisikal na palamuting nakapalibot. Nasa talababa ang “korona” bilang tunay na posibleng salin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “ito/rito” para sa altar, “mga gilid” sa halip na literal na “mga pader,” at “moldura” bilang pamilyar na terminong panlarawan. Pinanatili ang pag-uulit ng ideyang “palibot” at ang teknikal na “mga sungay.”
