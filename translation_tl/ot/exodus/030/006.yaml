  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: tl
  text: Ilagay mo iyon sa harap ng tabing na nasa harap ng kaban ng patotoo[a], sa harap ng luklukan ng awa[b] na nasa ibabaw ng patotoo, kung saan ako makikipagtagpo sa iyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kaban ng patotoo.” Madalas itong tawaging “kaban ng tipan” sa tradisyonal na mga salin, ngunit “patotoo” ang salitang ginamit dito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “takip na pantubos”; ito ang gintong takip sa ibabaw ng kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Ilagay mo iyon
  rationale: Ang נתן ay maaaring mangahulugang magbigay, maglagay, o magtakda. Sa tagubilin tungkol sa ayos ng santuwaryo, malinaw at natural ang “ilagay”; ang isahan na “mo” ay tumutugma sa kausap sa Hebreo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang malinaw na kahulugang panlunan sa dalawang paglitaw ng parirala at natural ito sa makabagong Tagalog.
- source_word: הַפָּרֹכֶת
  choice: ang tabing
  rationale: Tumutukoy ito sa panloob na kurtina o harang ng santuwaryo. Ang “tabing” ay maikli, marangal, at madaling maunawaan.
- source_word: אֲרֹן הָעֵדֻת
  choice: ang kaban ng patotoo
  rationale: Tahasan sa Hebreo ang “patotoo,” hindi “tipan.” Pinananatili ng salin ang mismong katawagan sa teksto sa halip na ipalit ang mas nakaugaliang parirala.
- source_word: הַכַּפֹּרֶת
  choice: ang luklukan ng awa
  rationale: Ito ang nakikilalang katawagang panritwal para sa gintong takip sa ibabaw ng kaban. Dahil maaari rin itong isaling ayon sa anyo at gamit bilang “takip na pantubos,” inilalahad ang alternatibo sa talababa.
- source_word: הָעֵדֻת
  choice: ang patotoo
  rationale: Isinalin nang pare-pareho ang עֵדוּת bilang “patotoo,” nang hindi ito tahimik na pinapalitan ng “tipan.”
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: kung saan ako makikipagtagpo sa iyo
  rationale: Ang Niphal ng יעד dito ay nagpapahayag ng itinakdang pakikipagtagpo. Natural sa Tagalog ang “makikipagtagpo,” at saklaw na ng “kung saan” ang Hebreong “doon.”
theological_decisions:
- issue: Pagpapakahulugan sa katawagang panritwal na הַכַּפֹּרֶת
  choice: luklukan ng awa
  alternative: takip na pantubos
  rationale: Tinutukoy ng salita ang takip ng kaban na may kaugnayan sa pagtubos. Pinananatili sa pangunahing teksto ang tradisyonal na katawagang panritwal, habang nililinaw sa talababa ang alternatibong mas tuwirang naglalarawan sa bagay at gamit nito, nang hindi ipinipilit ang isang mas makitid na paliwanag na doktrinal.
- issue: Pagpapakahulugan sa עֵדוּת sa pariralang tumutukoy sa kaban
  choice: patotoo
  alternative: tipan
  rationale: Dalawang ulit na ginagamit ng talata ang salitang “patotoo.” Ang “tipan” ay pamilyar sa tradisyon, ngunit ibang salitang Hebreo iyon; kaya pinanatili rito ang leksikal na pagkakaiba.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Ginamit ang tuwirang pautos na “Ilagay mo” at ang malinaw na panlunang “sa harap ng.” Pinanatili ang mga katawagang panritwal na “kaban ng patotoo” at “luklukan ng awa,” na may mga talababa upang maging malinaw sa karaniwang mambabasa at upang hindi burahin ang leksikal at teolohikal na tensiyon ng Hebreo.
