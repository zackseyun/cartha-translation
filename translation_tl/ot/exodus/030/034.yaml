base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Yahweh kay Moises, “Kumuha ka para sa sarili mo ng mga mababangong sangkap: estakte[a], onika, at galbano, mga mababangong sangkap, at purong kamangyan. Magkakapantay ang bahagi ng bawat isa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hindi tiyak ang eksaktong pagkakakilanlan ng estakte at onika. Malamang na tumutukoy ang mga salitang Hebreo sa partikular na mababangong sangkap ng insenso; tradisyonal ang mga katawagang ginamit dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Ipinahahayag nito ang pagsulong ng salaysay sa natural na modernong Tagalog.
- source_word: קַח לְךָ
  choice: Kumuha ka para sa iyong sarili
  rationale: Pinananatili ang personal o reflexive na diwa ng לְךָ.
- source_word: סַמִּים
  choice: mga sangkap na mabango
  rationale: Malawak ang kahulugan ng salita at tumutukoy rito sa mga aromatikong sangkap para sa insenso; mas malinaw ito kaysa sa simpleng “mga pampalasa.”
- source_word: נָטָף
  choice: estakte
  rationale: Hindi tiyak ang eksaktong sangkap, kaya pinanatili ang tradisyonal na katawagan at ipinaliwanag ang kawalang-katiyakan sa talababa.
- source_word: שְׁחֵלֶת
  choice: onika
  rationale: Hindi tiyak ang eksaktong tinutukoy; ginamit ang nakaugaliang katawagan nang hindi nagpapanggap na tiyak ang pagkakakilanlan nito.
- source_word: חֶלְבְּנָה
  choice: galbano
  rationale: Karaniwang kinikilalang mabangong dagta ang tinutukoy at natural sa Tagalog ang anyong “galbano.”
- source_word: לְבֹנָה זַכָּה
  choice: purong kamangyan
  rationale: Ang “kamangyan” ay malinaw na katawagang Tagalog para sa frankincense, at pinananatili ng “puro” ang panuring na זַכָּה.
- source_word: בַּד בְּבַד
  choice: magkakapantay ang sukat
  rationale: Likas at malinaw nitong ipinahahayag ang idyomang nagsasaad ng magkakapantay na dami o bahagi.
- source_word: יִהְיֶה
  choice: Dapat ... ang mga ito
  rationale: Bagaman isahan ang pandiwa sa Hebreo, kolektibong tumutukoy ito sa mga nakalistang sangkap; natural sa Tagalog ang pangmaramihang reperensiya.
