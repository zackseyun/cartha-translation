  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: tl
  text: at ang mesa at lahat ng kagamitan nito, at ang patungan ng mga ilawan at ang mga kagamitan nito, at ang altar ng insenso,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: ang mesa
  rationale: Payak na “mesa” ang nasa Hebreo; hindi inuulit sa talatang ito ang mas buong katawagang tumutukoy sa tinapay na handog.
- source_word: כָּל כֵּלָיו
  choice: lahat ng kagamitan nito
  rationale: Malawak ang kahulugan ng כְּלִי at maaaring tumukoy sa mga kasangkapan o sisidlan; natural at sapat na malawak sa Filipino ang “kagamitan.”
- source_word: הַמְּנֹרָה
  choice: ang patungan ng ilawan
  rationale: Isinasalin ang karaniwang pangngalan ayon sa gamit nito sa halip na hiramin ang “menorah”; malinaw nitong tinutukoy ang sagradong patungang may mga ilawan.
- source_word: כֵּלֶיהָ
  choice: ang mga kagamitan nito
  rationale: Tumutukoy ang hulaping pambabae sa patungan ng ilawan; pinananatili ng “mga kagamitan nito” ang malawak na saklaw ng כְּלִי.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ang altar ng insenso
  rationale: Tapat ito sa pariralang konstrukto na tumutukoy sa altar na kaugnay ng insenso at natural itong pakinggan sa modernong Filipino.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang paulit-ulit na “at” ng Hebreo dahil bahagi ang talata ng nagpapatuloy na talaan. Walang talababa sapagkat ang ibinigay na English footnote ay waring nailagay sa maling marker: ang alternatibong “incense altar” ay tumutukoy sa huling parirala, hindi sa “utensils.”'
