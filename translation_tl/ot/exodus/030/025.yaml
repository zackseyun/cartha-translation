translation:
  language: tl
  text: At gawin mo itong banal na langis na pampahid[a], isang timplang pabango na gawa ng isang tagagawa ng pabango; ito ay magiging banal na langis na pampahid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “banal na langis na pinagtimplahang pamahid” o “banal na langis na may mabangong timpla.” Idiniriin ng Hebreo na isa itong mabangong paghahandang mahusay na pinaghalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: At gawin mo
  rationale: Ang Qal perfect na may prefixed conjunction ay nagsisilbing utos sa kontekstong ito. Likas sa modernong Tagalog ang “gawin mo,” at pinananatili ng “At” ang pagkakaugnay sa naunang tagubilin.
- source_word: אֹתוֹ
  choice: itong
  rationale: Tumutukoy ang panghalip sa pinaghalong langis at mga sangkap sa naunang talata. Ang “itong” ay malinaw at natural bilang tuwirang layon.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: banal na langis na pamahid
  rationale: Pinananatili nito ang kahulugan ng langis na ginagamit sa pagpapahid para sa pagtatalaga bilang banal. Inulit ang parehong salin sa dulo ng talata para sa pagkakapare-pareho.
- source_word: רֹקַח מִרְקַחַת
  choice: isang timpladong pabango
  rationale: Ipinahihiwatig ng magkaugnay na mga salitang Hebreo ang isang mabangong preparasyong maingat na pinaghalo. Ang “timpladong pabango” ay maikli, natural, at nagpapanatili sa ideya ng paghahalo at halimuyak.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: na gawa ng tagapagtimpla ng pabango
  rationale: Tuwirang ipinapakita nito na ang paghahanda ay gawain ng isang bihasang artisan na naghahalo ng mga sangkap na mabango.
- source_word: יִהְיֶה
  choice: ito ay magiging
  rationale: Ipinapahayag ng imperfect ng היה ang magiging kalagayan o bunga ng inihandang langis, kaya ang “magiging” ay angkop sa pormal na tagubilin.
