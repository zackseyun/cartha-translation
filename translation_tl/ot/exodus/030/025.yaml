translation_notes:
  register: Gumamit ng makabago ngunit marangal na Tagalog. Pinanatili ang anyong pang-isahang utos na “gawin mo,” ang pag-uulit ng “banal na langis na pamahid,” at ang bokabularyong tumutukoy sa bihasang pagtitimpla ng pabango.
