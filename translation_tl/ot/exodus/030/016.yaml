  rationale: Inayos ang huling sugnay upang malinaw na maipahayag ang layuning “gumawa ng pagbabayad-sala para sa” na nasa לְכַפֵּר עַל, nang hindi nagdaragdag ng doktrinal na paliwanag. Inayos din ang talababa upang ang tinatawag na literal na anyo ay maging salin sa Filipino, hindi transliterasyon ng Hebreo.
