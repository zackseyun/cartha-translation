  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: tl
  text: Kunin mo mula sa mga anak ni Israel[a] ang salaping pambayad-sala at ilaan iyon sa paglilingkod sa Tolda ng Pagtitipon. Magiging alaala iyon para sa mga anak ni Israel sa harap ni Yahweh, upang magsagawa ng pagbabayad-sala para sa inyong mga buhay.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “inyong mga kaluluwa”; dito, ang kahulugan ay “inyong mga buhay” o “inyong sarili,” hindi isang kaluluwang hiwalay sa katawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: salaping pambayad-sala
  rationale: Ang כֶּסֶף ay salapi o pilak, at ang הַכִּפֻּרִים ay tumutukoy sa pagbabayad-sala o pagtubos. Ang parirala ay tumutukoy sa halagang ibinibigay sa sensus ayon sa naunang mga talata; pinananatili ng salin ang kaugnayang kultiko ng כפר.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: mula sa mga anak ni Israel
  rationale: Pormal na katumbas ito ng Hebreong parirala at pinananatili ang panlahatang katawagang pangtipan, habang ang talababa ay nagbibigay ng mas likas na alternatibong “mga Israelita.”
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: ilaan iyon sa paglilingkod sa Tolda ng Pagtitipon
  rationale: Sa konteksto, ang עַל ay nagsasaad ng paglalaan o layunin. Ang עֲבֹדָה ay paglilingkod o gawain, at ang אֹהֶל מוֹעֵד ay literal na tolda ng pagtitipon/tagpuan.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: magiging alaala iyon
  rationale: Ang זִכָּרוֹן ay isang alaala o palatandaang nagpapaalaala; ang “magiging alaala” ay maikli, natural, at angkop sa kontekstong pangsamba.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ng “sa harap” ang karaniwang Hebreong paglalarawan ng pagiging nasa presensiya ng Diyos, at direktang isinasalin ang pangalang יְהוָה bilang Yahweh.
- source_word: לְכַפֵּר
  choice: upang maipambayad-sala
  rationale: Ipinahihiwatig ng piel infinitive ng כפר ang paggawa ng pagbabayad-sala. Ang anyong “maipambayad-sala” ay natural sa Filipino at iniuugnay ang salapi sa layuning tinutukoy ng pandiwa.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: para sa inyong mga buhay
  rationale: Ang נֶפֶשׁ dito ay tumutukoy sa buhay o mismong pagkatao ng mga Israelita, hindi sa “kaluluwa” bilang hiwalay sa katawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at pangtipang pangalan sa halip na palitan ito ng titulo.
- issue: Panlahatang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita; mga anak ng Israel
  rationale: Pinananatili nito ang pormal na anyong panlalaki ng Hebreo bilang katawagan sa buong bayang kabilang sa tipan, nang hindi ipinapalagay na mga lalaking indibidwal lamang ang tinutukoy.
- issue: Saklaw ng כפר sa salaping ibinibigay sa sensus
  choice: pagbabayad-sala
  alternative: pagtubos
  rationale: Maaaring magtaglay ang konteksto ng diwa ng pantubos na halaga at ng pagbabayad-sala. Pinili ang “pagbabayad-sala” upang mapanatili ang terminolohiyang kultiko, ngunit hindi itinatanggi ang kaugnay na diwa ng pagtubos.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Tolda ng Pagtitipon” bilang malinaw at pormal na katawagan sa אֹהֶל מוֹעֵד. Iniwasan ang mas lumang “tabernakulo” at ang “Tolda ng Tipanan,” sapagkat ang מוֹעֵד ay tumutukoy sa pagtitipon o pagtatagpo, hindi tuwirang sa tipan.
