  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: tl
  text: Ang sinumang gumawa ng timplang katulad nito o magpahid ng kahit kaunti nito sa isang taong walang pahintulot na tumanggap nito,[a] ay aalisin sa kanyang sambayanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa isang tagalabas” o “sa isang karaniwang tao.” Sa kontekstong ito, ang Hebreong zār ay karaniwang tumutukoy sa taong walang pahintulot para sa banal na paggamit, hindi lamang sa isang dayuhan.
    reason: lexical_alternative
  - marker: b
    text: Ang “aalisin sa kanyang sambayanan” ay isang legal na pormula kaugnay ng tipan. Hindi tinutukoy rito kung paano isasagawa ang parusa.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Ang sinuman
  rationale: Bagaman literal na nagsisimula sa “lalaking…,” pangkalahatan ang gamit nito sa batas at tumutukoy sa sinumang tao.
- source_word: יִרְקַח
  choice: gumawa ng timpla
  rationale: Ang pandiwa ay tumutukoy sa maingat na paghahalo o pagtitimpla ng mabangong sangkap. Likas sa Filipino ang pariralang ito at napananatili nito ang teknikal na diwa.
- source_word: כָּמֹהוּ
  choice: katulad nito
  rationale: Tumutukoy ito sa banal na langis na pampahid sa naunang konteksto at ipinagbabawal ang paggawa ng timplang gaya niyon, nang hindi ipinapakahulugang kailangan itong maging eksaktong kopya sa bawat detalye.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: o maglagay ng kahit kaunti nito
  rationale: Sa konteksto, ang נתן ay paglalagay o paglalapat ng bahagi ng langis. Pinananatili ng “maglagay” ang lawak ng pandiwa, samantalang malinaw na naipapahayag ng “kahit kaunti” ang מִמֶּנּוּ.
- source_word: עַל זָר
  choice: sa isang taong hindi pinahintulutang tumanggap nito
  rationale: Sa kontekstong saserdotal, ang זָר ay hindi pangunahing tumutukoy sa etnikong dayuhan kundi sa taong nasa labas ng mga pinahintulutang tumanggap o gumamit ng banal na langis.
- source_word: וְנִכְרַת
  choice: ay aalisin
  rationale: Ipinahahayag nito ang mabigat na legal na bunga ng pagkakahiwalay, ngunit hindi tinutukoy ang paraan—kamatayan man, pagpapatapon, o ibang anyo ng pag-aalis.
- source_word: מֵעַמָּיו
  choice: sa kanyang sambayanan
  rationale: Ang עַם dito ay ang bayang kinabibilangan o pamayanang tipan ng tao. Dignified at malinaw sa kasalukuyang Filipino ang “sambayanan.”
theological_decisions:
- issue: Kahulugan ng זָר sa batas tungkol sa banal na langis
  choice: taong hindi pinahintulutang tumanggap nito
  alternative: dayuhan; tagalabas; karaniwang tao
  rationale: Ang hangganang tinutukoy ay tungkol sa pahintulot sa banal na gamit, hindi sa lahi o bansang pinagmulan. Iniiwasan din ng salin ang pagpapalagay na lahat ng hindi saserdote ay awtomatikong saklaw sa eksaktong parehong paraan.
- issue: Lakas at paraan ng parusang וְנִכְרַת מֵעַמָּיו
  choice: aalisin sa kanyang sambayanan
  alternative: ititiwalag sa kanyang sambayanan; papatayin; ihihiwalay sa kanyang bayan
  rationale: Pinananatili ang legal at tipanang diwa ng pagkahiwalay nang hindi ipinapasya ang tiyak na mekanismo ng parusa, sapagkat hindi iyon tahasang sinasabi sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang burukratikong “hindi awtorisado” sa pangunahing teksto at ang sektaryong maaaring dating ng “ititiwalag,” habang pinanatili ang bigat ng batas at ang hindi tiyak na paraan ng parusa.
