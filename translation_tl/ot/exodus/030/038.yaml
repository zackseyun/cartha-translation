  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: tl
  text: Ang sinumang gumawa ng insensong tulad nito upang langhapin ang halimuyak nito[a] ay ihihiwalay mula sa kanyang sambayanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang amuyin ito” o “upang tamasahin ang bango nito.” Ipinahihiwatig ng Hebreo na gumagawa ng gayong insenso para sa pansariling paglanghap o kasiyahan.
    reason: lexical_alternative
  - marker: b
    text: Ang “ihihiwalay mula sa kanyang sambayanan” ay karaniwang pormulang legal sa Hebreo. Maaaring tumukoy ito sa kamatayan, pagpapaalis sa pamayanan, o pag-aalis sa pamamagitan ng hatol ng Diyos, depende sa konteksto.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Ang sinumang
  rationale: Bagaman literal na tumutukoy ang אִישׁ sa isang lalaki, pangkalahatan ang gamit nito sa pormulang legal; likas na ipinahahayag ito ng “ang sinumang.”
- source_word: יַעֲשֶׂה כָמֹהָ
  choice: gumawa ng insensong tulad nito
  rationale: Ang עשה ay “gumawa,” at ang כָמֹהָ ay tumutukoy sa sagradong timpla ng insenso sa naunang konteksto. Idinagdag ang “insensong” upang maging malinaw ang tinutukoy nang hindi nililimitahan kung ganap na kapareho o kahawig na timpla.
- source_word: לְהָרִיחַ בָּהּ
  choice: upang langhapin ang halimuyak nito
  rationale: Ipinahahayag ng infinitive ang layuning personal na amuyin o tamasahin ang bango. Ang “langhapin ang halimuyak nito” ay natural at marangal sa Filipino, habang pinananatili ang diwa ng pandiwang ריח.
- source_word: וְנִכְרַת
  choice: ay ititiwalag
  rationale: Ang Niphal ng כרת ay pormulang legal para sa mabigat na pag-aalis o pagkaputol mula sa bayan. Ang “ititiwalag” ay malinaw sa Filipino ngunit hindi tiyak kung ang kaparusahan ay kamatayan, pagpapaalis, o pagkilos ng Diyos; ipinaliliwanag sa talababa ang saklaw ng pormula.
- source_word: מֵעַמָּיו
  choice: mula sa kanyang sambayanan
  rationale: Ang עַם na may hulaping panghalip ay tumutukoy sa sariling bayan o pamayanang kinabibilangan. Ang “sambayanan” ay dignified at angkop sa kontekstong tipan at legal.
theological_decisions:
- issue: Kahulugan ng pormulang kaparusahan na וְנִכְרַת מֵעַמָּיו
  choice: Panatilihin ang pangkalahatang diwa ng pag-aalis sa sambayanan sa “ititiwalag mula sa kanyang sambayanan,” na may talababa tungkol sa hindi tiyak na paraan.
  alternative: “papatayin,” “palalayasin sa pamayanan,” o “aalisin ng Diyos”
  rationale: Hindi laging tinutukoy ng pormulang Hebreo kung kamatayan, pagpapaalis, o hatol ng Diyos ang paraan. Hindi dapat lutasin ng salin ang tunay na kalabuan ng tekstong legal.
translation_notes:
  register: Makabago at dignified na Filipino, na madaling maunawaan sa pampublikong pagbasa. Ginamit ang “insenso,” “halimuyak,” at “sambayanan” upang maging malinaw ang konteksto at mapanatili ang bigat ng batas. Parehong nakalagay sa pangunahing teksto ang mga markang [a] at [b].
