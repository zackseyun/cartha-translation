base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: tl
  text: Gawin mo itong insenso,[a] isang mabangong timpla na ginawa ayon sa kasanayan ng isang tagagawa ng pabango, hinaluan ng asin,[b] dalisay, at banal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang pinagsamang pabango” o “isang mabangong halo.” Idiniriin ng Hebreo ang maingat na paghahanda at paghahalo ng mga sangkap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inasinan.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “sagrado.” Ang Hebreo ay nagsasabing “banal,” hindi “kabanal-banalan,” sa talatang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: Gawin mo itong
  rationale: Sa konteksto ng mga tagubilin, ang anyo ng pandiwa ay may puwersa ng utos. Ang “itong” ay natural na tumutukoy sa pinaghalong sangkap sa naunang talata.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Ito ang karaniwang modernong salitang Filipino para sa mabangong halo na sinusunog sa kontekstong panrelihiyon.
- source_word: רֹקַח מַעֲשֵׂה רוֹקֵחַ
  choice: isang mabangong timplada na gawa ng bihasang tagapagtimpla
  rationale: Pinananatili nito ang diin sa maingat na paghahalo ng mababangong sangkap at sa kasanayan ng gumagawa, nang hindi ginagawang ordinaryong pabango lamang ang insenso.
- source_word: מְמֻלָּח
  choice: hinaluan ng asin
  rationale: Ang passive participle mula sa ugat na kaugnay ng asin ay pinakanatural na tumutukoy sa paglalagay o paghahalo ng asin. Mas malinaw ito sa Filipino kaysa sa “inasinan,” na maaaring magmukhang panimpla lamang ng pagkain.
- source_word: טָהוֹר
  choice: dalisay
  rationale: Ang “dalisay” ay angkop sa materyal at ritwal na kadalisayan at nagpapanatili ng marangal na rehistro.
- source_word: קֹדֶשׁ
  choice: banal
  rationale: Tuwirang ipinapahayag nito na ang insenso ay ibinukod para sa sagradong gamit, nang hindi pinalalakas sa “kabanal-banalan.”
theological_decisions:
- issue: Antas ng kabanalan ng insenso
  choice: banal
  alternative: sagrado; kabanal-banalan
  rationale: Ang Hebreo ay simpleng קֹדֶשׁ, “banal,” at walang superlatibong pormang magbibigay-katwiran sa “kabanal-banalan.”
translation_notes:
  register: Modernong Filipino na malinaw ngunit marangal. Ginamit ang tuwirang anyo ng utos na “Gawin mo,” ang pamilyar na “insenso,” at ang pariralang “bihasang tagapagtimpla” upang maipakita ang artisanal na kahulugan nang hindi nagiging teknikal o lipas.
