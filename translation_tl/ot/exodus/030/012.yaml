id: EXO.30.12
reference: Exodus 30:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: tl
  text: Kapag nagsagawa ka ng sensus sa mga anak ni Israel para sa kanilang pagpapabilang[a], ang bawat lalaki ay magbibigay kay Yahweh ng pantubos para sa kanyang buhay[b] kapag binilang mo sila, upang walang salot na dumating sa kanila kapag binilang mo sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “itaas mo ang ulo ng mga anak ni Israel para sa kanilang pagpapabilang.” Ang “itaas ang ulo” ay isang idyoma para sa pagsasagawa ng sensus.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “pantubos para sa kanyang sarili.” Ang Hebreong nepeš ay madalas tumukoy sa buhay o sa mismong tao, hindi lamang sa “kaluluwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Kapag
  rationale: Ipinakikilala nito ang inaasahang pagkakataon ng pagsasagawa ng sensus; mas angkop dito ang “kapag” kaysa sa mas bukás na “kung.”
- source_word: תִשָּׂא אֶת־רֹאשׁ
  choice: nagsagawa ka ng sensus
  rationale: Ang literal na “itaas ang ulo” ay isang idyoma para sa pagbibilang o sensus. Isinalin ang kahulugan ng idyoma sa natural na modernong Tagalog.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang pampamilyang anyo ng Hebreo habang gumagamit ng karaniwang katawagan sa Tagalog na salin ng Bibliya.
- source_word: לִפְקֻדֵיהֶם
  choice: ayon sa kanilang pagkakatala
  rationale: Ipinahihiwatig ng salitang mula sa ugat na פקד ang opisyal na pagtatala o pagrerehistro kaugnay ng sensus, hindi lamang pangkaraniwang pagbibilang.
- source_word: וְנָתְנוּ אִישׁ
  choice: ang bawat lalaki ay magbibigay
  rationale: Ang אִישׁ ay distributibo at panlalaki rito; ipinapakita ng “bawat lalaki” ang pananagutan ng bawat indibidwal na kabilang sa binibilang.
- source_word: כֹּפֶר
  choice: pantubos
  rationale: Tumutukoy ito sa halagang ibinibigay upang iligtas ang buhay at maiwasan ang kaparusahan; malinaw at likas sa Tagalog ang “pantubos.”
- source_word: נַפְשׁוֹ
  choice: para sa kanyang buhay
  rationale: Sa kontekstong ito, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong sarili ng tao, hindi kinakailangang sa isang hiwalay na di-materyal na “kaluluwa.”
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה; natural sa Tagalog ang “kay” para sa tatanggap ng ibinibigay.
- source_word: בִּפְקֹד אֹתָם
  choice: kapag binilang mo sila
  rationale: Ipinapahayag ng parirala ang panahon o pagkakataon ng pagbibigay, at pinananatili rin ang pag-uulit ng terminolohiya sa Hebreo.
- source_word: נֶגֶף
  choice: salot
  rationale: Sa kontekstong ito ng hatol na maaaring dumating sa bayan, ang salita ay tumutukoy sa nakamamatay na salot o kapahamakang laganap.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: Sa gayon, walang salot na darating sa kanila
  rationale: Malinaw na ipinahahayag ng “sa gayon” ang bunga o layunin ng pagbibigay ng pantubos nang hindi labis na nilulutas ang ugnayang lohikal ng mga sugnay.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng teksto ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng isang titulo.
- issue: Kahulugan ng נַפְשׁוֹ sa pormula ng pantubos
  choice: para sa kanyang buhay
  alternative: para sa kanyang sarili; para sa kanyang kaluluwa
  rationale: Ang konteksto ay pantubos na kaugnay ng buhay ng taong binibilang. Iniiwasan ng “buhay” ang pagpasok ng isang mas huling doktrina tungkol sa “kaluluwa” na hindi tahasang sinasabi rito.
- issue: Panlalaking anyo ng אִישׁ
  choice: bawat lalaki
  alternative: bawat isa; bawat tao
  rationale: Pinananatili ang tahasang panlalaking anyo at ang distributibong diin ng Hebreo nang hindi pinalalawak ang saklaw nang higit sa sinasabi ng teksto.
- issue: Kaugnayan ng pantubos at ng pag-iwas sa salot
  choice: Sa gayon, walang salot na darating sa kanila
  alternative: at walang salot na darating sa kanila; upang walang salot na dumating sa kanila
  rationale: Ipinakikita ang layunin o bunga ng pagbibigay ng pantubos, ngunit hindi dinaragdagan ang teksto ng isang ganap na paliwanag sa mekanismo ng ugnayang ito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sensus” bilang karaniwang terminong administratibo, kasama ang “pagkakatala” upang mapanatili ang diwa ng opisyal na pagrerehistro. Iniwasan ang sobrang arkaikong pananalita at ang pagpasok ng denominasyonal na paliwanag.
