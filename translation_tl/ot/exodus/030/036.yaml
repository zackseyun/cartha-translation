  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: tl
  text: Dudurugin mo nang pinung-pino ang kaunti nito, at maglalagay ka ng kaunti nito sa harap ng Patotoo[a] sa Tolda ng Tagpuan, kung saan ako makikipagtagpo sa iyo. Ito ay magiging kabanal-banalan[b] para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “Patotoo” ay isang katawagang kultiko na kaugnay ng tipan. Hindi tahasang tinutukoy ng talatang ito ang eksaktong bagay na tinutukoy ng katawagang ito.
    reason: Pinananatili ang lawak ng הָעֵדֻת nang hindi ipinapasok sa pangunahing teksto ang ‘kaban’ o ‘mga tapyas.’
  - marker: b
    text: Mas literal, “banal ng mga banal,” isang paraan sa Hebreo ng pagsasabi na ito ay nasa pinakamataas na antas ng kabanalan.
    reason: Ipinakikita ang literal na anyo at ang superlatibong bisa ng pariralang קֹדֶשׁ קָדָשִׁים.
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: Dudurugin mo
  rationale: Ang pandiwang שׁחק ay tumutukoy rito sa pagdurog o pagpulbos sa timpla ng insenso. Natural sa Filipino ang “dudurugin” at hindi nito ipinapalagay ang isang tiyak na kasangkapang panggiling.
- source_word: מִמֶּנָּה
  choice: ang kaunti nito / ng kaunti nito
  rationale: 'Partitibo ang parirala: isang bahagi lamang ng insenso ang dudurugin at ilalagay. Malinaw at natural itong ipinapahayag ng “kaunti nito.”'
- source_word: הָדֵק
  choice: nang pinung-pino
  rationale: Pinatitindi ng anyong ito ang pagdurog hanggang maging napakapino ang insenso. Ang “pinung-pino” ay maikli, malinaw, at idiomatiko.
- source_word: וְנָתַתָּה
  choice: at maglalagay ka
  rationale: Malawak ang saklaw ng נתן, ngunit sa konteksto ng ritwal na paglalagay, ang “maglalagay” ang pinakanatural at tiyak.
- source_word: לִפְנֵי הָעֵדֻת
  choice: sa harap ng Patotoo
  rationale: Pinananatili nito ang mismong katawagang kultiko sa Hebreo at hindi ito pinalalawak agad bilang “kaban” o “mga tapyas.” Ginamit ang malaking titik upang ipakitang natatanging katawagan ito sa konteksto ng santuwaryo.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: sa Toldang Tipanan
  rationale: Ipinahahayag ng מועד ang takdang pakikipagtagpo. Ang “Toldang Tipanan” ay natural na katawagang Filipino para sa toldang pinagtatagpuan ng Diyos at ng kanyang bayan, nang hindi gumagamit ng mas teknikal na hiram na salitang “tabernakulo.”
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: kung saan ako makikipagtagpo sa iyo
  rationale: Ang Niphal ng יעד ay tumutukoy sa itinakdang pakikipagtagpo. Pinananatili ng salin ang personal na pangako at ang pang-isahang “iyo” ng Hebreo.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ang inuulit na anyong Hebreo ay superlatibo, ibig sabihin ay nasa pinakamataas na antas ng kabanalan. Ang “kabanal-banalan” ay likas at marangal na katumbas sa Filipino.
- source_word: תִּהְיֶה לָכֶם
  choice: Ito ay magiging ... para sa inyo
  rationale: Pinananatili ng “para sa inyo” ang ugnayang ipinahahayag ng לָכֶם nang hindi labis na tinutukoy kung ito ay pag-aari, pananagutan, o katayuang ritwal.
theological_decisions:
- issue: Tinutukoy ng “Patotoo”
  choice: Panatilihin sa pangunahing teksto ang literal na katawagang “Patotoo.”
  alternative: “kaban ng Patotoo” o “mga tapyas ng tipan”
  rationale: הָעֵדֻת mismo ang binabanggit ng talata, hindi tahasang ang kaban o ang mga tapyas. Iniiwasan ng pangunahing salin ang pagpapasya sa mas makitid na tinutukoy kaysa sa sinasabi ng teksto; nililinaw ng talababa ang mga posibleng kaugnay na bagay.
- issue: Superlatibong kabanalan
  choice: Isalin ang קֹדֶשׁ קָדָשִׁים bilang “kabanal-banalan.”
  alternative: “banal ng mga banal” o “lubos na banal”
  rationale: Malinaw na ipinahahayag ng “kabanal-banalan” ang pinakamataas na antas ng kabanalan sa natural na Filipino, samantalang pinananatili sa talababa ang mas literal na anyo ng Hebreo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang hinaharap na anyong pautos (“Dudurugin mo,” “maglalagay ka”) upang tularan ang estilong legal-panritwal ng Hebreo. Pinanatili ang natatanging katawagang “Patotoo,” at iniwasan ang denominasyonal o labis na interpretibong pagpapalawak.
