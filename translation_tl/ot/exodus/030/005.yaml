  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: tl
  text: Gawin mo ang mga pingga mula sa kahoy na akasya at balutan mo ng ginto ang mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gawin mo
  rationale: Ang Qal perfect na may prefixed conjunction ay nagpapatuloy ng sunod-sunod na tagubilin. Likas sa modernong Tagalog ang pautos na “Gawin mo” para sa preskriptibong diwa nito.
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Sa konteksto ng mga kagamitan sa santuwaryo, tumutukoy ang בַּד sa mahahabang pirasong ginagamit sa pagbuhat. Ang “pingga” ay malinaw at kasalukuyang salitang Filipino.
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang pariralang construct ay tumutukoy sa materyal na acacia wood. Ang “kahoy na akasya” ay natural at madaling maunawaan, at ipinahihiwatig ng “mula sa” na iyon ang materyal na gagamitin.
- source_word: וְצִפִּיתָ
  choice: at balutan mo
  rationale: Sa konteksto ng paggawa, ang צפה ay nangangahulugang takpan o sapinan ng isang materyal. Ang “balutan” ay natural sa Filipino at malinaw na naghahayag ng paglalapat ng ginto sa ibabaw.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang panlalaking maramihang panghalip na tuwirang layon ay bumabalik sa mga pingga; ang “mga iyon” ay malinaw at iniiwasan ang di-natural na dobleng panghalip.
- source_word: זָהָב
  choice: ng ginto
  rationale: Ang ginto ang materyal na ipinambabalot. Sa Tagalog, natural ang konstruksiyong “balutan ng ginto.”
