  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Ginamit ang pamilyar na anyong pautos na isahan upang tumbasan ang ikalawang panauhang panlalaking isahan sa Hebreo; walang idinagdag na paliwanag na wala sa teksto.
