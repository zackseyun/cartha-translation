  source_fidelity: 'Ang pangunahing mga katawagan ay tumpak: ang langis ang instrumento, at ang אֹהֶל מוֹעֵד at אֲרוֹן הָעֵדֻת ay naipahayag bilang Toldang Tipanan at Kaban ng Patotoo. Gayunman, ang kasalukuyang sugnay na “Ito ang ipapahid mo bilang langis na pantatalaga” ay hindi wastong naghahayag na ang langis ang ipinapahid sa mga bagay na sumusunod; ang Hebreo ay nagsasabing papahiran ang mga ito sa pamamagitan ng langis.'
