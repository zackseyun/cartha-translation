  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: tl
  text: Papahiran mo ng langis na ito ang Toldang Tipanan at ang Kaban ng Patotoo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sa mas nakaugaliang katawagan, “Kaban ng Tipan”; sa Hebreo, “Kaban ng Patotoo.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: ipapahid mo bilang langis na pantatalaga
  rationale: Ang Qal perfect 2ms na may pang-ugnay ay gumaganap bilang utos sa sunod-sunod na tagubilin. Ginawang malinaw sa natural na Filipino ang ritwal na kahulugan ng משׁח, na hindi lamang karaniwang pagpapahid kundi pagtatalaga sa pamamagitan ng langis.
- source_word: בּוֹ
  choice: Ito ang ipapahid mo
  rationale: Tumutukoy ang panlalaking isahang hulapi sa langis na pantatalaga sa naunang konteksto at may instrumental na diwa. Ang ayos na ito ay mas natural sa Filipino kaysa sa literal na “Sa pamamagitan nito.”
- source_word: אֹהֶל מוֹעֵד
  choice: Toldang Tipanan
  rationale: Ang מוֹעֵד ay tumutukoy sa itinakdang pakikipagtagpo o pagtitipon. Pinili ang kinikilalang katawagang Filipino na “Toldang Tipanan,” bagaman hindi nito ganap na inilalantad ang leksikal na diwa ng pakikipagtagpo.
- source_word: אֲרוֹן
  choice: Kaban
  rationale: Sa kontekstong ito, ang אֲרוֹן ay sagradong sisidlan o kaban. Ang “Kaban” ang natural at nakikilalang katawagan sa modernong Filipino.
- source_word: הָעֵדֻת
  choice: Patotoo
  rationale: Direktang katumbas ito ng Hebreong עֵדוּת at pinananatili ang sadyang leksikal na anyo ng teksto sa halip na palitan agad ng “Tipan.”
theological_decisions:
- issue: Paglilipat ng אֲרוֹן הָעֵדֻת
  choice: Kaban ng Patotoo
  alternative: Kaban ng Tipan
  rationale: Tahasan ang “patotoo” sa Hebreo, hindi “tipan.” Pinanatili sa pangunahing teksto ang pagkakaibang ito habang ibinigay sa talababa ang mas nakaugaliang katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga nakikilalang katawagang biblikal, ngunit pinanatili ang “Patotoo” upang sumunod sa tahasang salita ng Hebreo.
