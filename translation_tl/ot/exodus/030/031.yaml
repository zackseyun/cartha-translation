  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: tl
  text: At sabihin mo sa mga Israelita, ‘Ito ay magiging banal na langis na pampahid para sa akin sa lahat ng salinlahi ninyo.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Natural na modernong Tagalog para sa kolektibong ‘mga anak ni Israel,’ nang hindi nililimitahan ang pahayag sa mga lalaking inapo lamang.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: banal na langis na pamahid
  rationale: Ipinananatili ang kahulugan ng langis na ginagamit sa rituwal na pagpapahid at ang katangiang banal o nakatalaga.
- source_word: לִי
  choice: para sa akin
  rationale: Natural na Tagalog na nagpapahayag na ang banal na langis ay nakatalaga sa Diyos; hindi dinaragdagan kung paano eksaktong nauugnay sa kaniya ang langis.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng salinlahi ninyo
  rationale: Ipinahahayag ang nagpapatuloy na bisa sa sunod-sunod na mga salinlahi.
theological_decisions:
- issue: Ang kaugnayan ng banal na langis sa Diyos sa לִי
  choice: para sa akin
  alternative: sa akin
  rationale: Pinili ang natural na pariralang nagsasaad ng pagtatalaga sa Diyos habang iniiwasang gawing pag-aari lamang o gamitin ang mas mabigat na paliwanag na wala sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa direktang utos ng Diyos kay Moises. Ginamit ang ‘At sabihin mo’ bilang natural na pagpapatuloy ng naunang pahayag.
