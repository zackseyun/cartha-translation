translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “dapat” upang maipahayag ang preskriptibong diwa ng mga tagubilin, at pinanatili ang sinaunang yunit na “siko” at ang terminong “mga sungay” para sa katapatan sa tekstong Hebreo.
