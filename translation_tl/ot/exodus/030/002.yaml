  source_fidelity: Wastong naipapahayag ng draft ang mga sukat, ang parisukat na hugis, at ang preskriptibong katangian ng utos. Gayunman, ang “kapiraso mismo nito” ay hindi natural at maaaring magmungkahi lamang na ang mga sungay ay isang putol na bahagi ng altar, sa halip na malinaw na ipahayag na integral o iisang piraso ang pagkakagawa sa altar.
  naturalness: Malinaw at makabago ang karamihan ng salin. Mas natural ang ganap na paralelismong “ang lapad nito,” at ang “iisang piraso kasama nito” ay mas idiomatiko para sa integral na pagkakayari kaysa “kapiraso mismo nito.”
  terminology: Ang “siko,” “parisukat,” at “mga sungay” ay angkop na modernong Filipino at pinananatili ang terminolohiyang pangkulto at sinaunang sukat. Ang “mga sungay” ay wastong maramihan para sa קַרְנֹתָיו.
