base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: tl
  text: Isang siko[a] ang haba nito at isang siko ang lapad nito. Dapat itong maging parisukat, at dalawang siko ang taas nito. Ang mga sungay nito ay dapat na iisang piraso kasama nito.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang siko ay isang sinaunang yunit ng haba, batay sa karaniwang distansiya mula sa siko hanggang sa dulo ng mga daliri.
    reason: cultural_clarification
  - marker: b
    text: Literal, “mula rito”; ibig sabihin, ang mga sungay ng altar ay bahagi mismo nito at hindi hiwalay na ikinabit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: siko / dalawang siko
  rationale: Ang “siko” ang kinikilalang katawagan sa Filipino para sa sinaunang yunit na cubit. Pinananatili nito ang orihinal na sukat sa halip na magbigay ng di-tiyak na eksaktong katumbas sa makabagong sistema.
- source_word: אָרְכּוֹ
  choice: haba nito
  rationale: Likas na katumbas sa Filipino ng pangngalang may hulaping tumutukoy sa altar.
- source_word: רָחְבּוֹ
  choice: lapad
  rationale: Karaniwan at malinaw na salitang Filipino para sa dimensiyong tinutukoy.
- source_word: רָבוּעַ
  choice: parisukat
  rationale: Tuwirang inilalarawan ang hugis na magkakapantay ang haba at lapad; mas natural ito kaysa sa mga lumang katawagang katumbas ng “foursquare.”
- source_word: יִהְיֶה
  choice: dapat itong maging
  rationale: Sa konteksto ng mga tagubilin sa paggawa, ang imperfect ay nagsasaad ng itinakdang anyo o espesipikasyon.
- source_word: קֹמָתוֹ
  choice: taas nito
  rationale: Ito ang natural na katawagan sa Filipino para sa taas ng isang estruktura.
- source_word: מִמֶּנּוּ
  choice: kapiraso mismo nito
  rationale: Literal itong “mula rito,” ngunit sa konteksto ng paggawa ay ipinahihiwatig na ang mga sungay ay integral sa altar at hindi hiwalay na ikinabit.
- source_word: קַרְנֹתָיו
  choice: mga sungay nito
  rationale: Pinananatili ang karaniwang katawagang kultiko para sa mga nakausling bahaging tulad ng sungay sa mga sulok ng altar.
