base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: tl
  text: Pahiran mo ng langis si Aaron at ang kanyang mga anak na lalaki, at italaga mo sila upang maglingkod sa akin bilang mga pari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: Pahiran mo ng langis
  rationale: Ang pandiwang משׁח ay tumutukoy rito sa rituwal na pagpapahid ng sagradong langis bilang pagtatalaga. Mas malinaw sa karaniwang mambabasa ang tahasang “ng langis” kaysa sa “pahiran” lamang.
- source_word: וְקִדַּשְׁתָּ
  choice: at italaga mo
  rationale: Ang Piel ng קדשׁ ay nangangahulugang ibukod para sa banal na tungkulin. Sa konteksto ng pagluklok sa mga pari, natural at marangal ang “italaga,” habang pinananatili ang kultikong diwa.
- source_word: לְכַהֵן
  choice: upang maglingkod ... bilang mga pari
  rationale: Ang pandiwang כהן ay nangangahulugang gumanap sa tungkulin ng pari. Malinaw na ipinapahayag ng pariralang ito kapwa ang gawain at ang katungkulang tinutukoy.
- source_word: לִי
  choice: sa akin
  rationale: Pinananatili nito ang tuwirang direksiyon ng paglilingkod kay Yahweh na ipinahihiwatig ng pang-ukol לְ na may hulaping unang panauhan.
- source_word: בָּנָיו
  choice: ang kanyang mga anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang tinutukoy ng Hebreo at ng konteksto ng linya ng mga pari; hindi ito ginawang neutral sa kasarian.
- source_word: וְאֶת ... וְאֶת
  choice: si Aaron at ang kanyang mga anak na lalaki
  rationale: Kapwa minamarkahan ng inuulit na אֶת ang dalawang tuwirang layon. Hindi kailangang tumbasan ang pag-uulit sa Tagalog upang maging natural ang pangungusap.
theological_decisions:
- issue: Kultikong diwa ng קדשׁ at כהן
  choice: “italaga” at “maglingkod ... bilang mga pari”
  alternative: “pabanalin” at “gumanap bilang mga pari”
  rationale: Ang talata ay tungkol sa pagbubukod kina Aaron at sa kanyang mga anak para sa banal na katungkulang makapari. Pinananatili ng piniling pananalita ang konteksto ng pagtatalaga nang hindi nag-aangkat ng mga konsepto mula sa ibang tradisyong pansimbahan.
- issue: Kasarian sa בָּנָיו
  choice: “kanyang mga anak na lalaki”
  alternative: “kanyang mga anak”
  rationale: Hayagang panlalaki ang anyo sa pinagmulang teksto at tumutukoy sa lalaking linya ng mga pari, kaya hindi ito ginawang pangkalahatan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa tekstong rituwal. Ginamit ang mga pautos na “Pahiran mo” at “italaga mo” upang natural na katawanin ang instructional na gamit ng mga pandiwang Hebreo. Iniwasan ang labis na teknikal na “konsagrahin” at ang maaaring di-malinaw na “pahiran” nang walang pagbanggit sa langis.
