base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: tl
  text: Tuwing umaga, magsusunog si Aaron sa ibabaw nito ng mabangong insenso[a]. Kapag inaayos niya ang mga ilawan[b], susunugin niya ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa mas literal na pananalita, “umaga-umaga.” Binibigyang-diin ng pag-uulit sa Hebreo ang regular na gawain araw-araw.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “inihahanda niya ang mga ilawan.” Maaaring mas tiyak na tumukoy ang pandiwang Hebreo sa pag-aayos, kabilang ang paglilinis o paggupit ng mga mitsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: magsusunog
  rationale: Ang Hiphil ng קטר sa kontekstong ritwal ay tumutukoy sa pagsunog ng handog upang pumailanlang ang usok. Ang “magsusunog” ay natural at malinaw sa modernong Tagalog.
- source_word: עָלָיו
  choice: sa ibabaw nito
  rationale: Tumutukoy ito sa altar ng insenso sa naunang talata at pinananatili ang lokatibong diwa ng Hebreo.
- source_word: קְטֹרֶת סַמִּים
  choice: mabangong insenso
  rationale: Ang קְטֹרֶת ay insenso, at ang סַמִּים ay mga sangkap na aromatiko. Natural na ipinahahayag ng “mabangong insenso” ang pinagsamang diwa.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: tuwing umaga
  rationale: Ang pag-uulit sa Hebreo ay distributibo at nagbibigay-diin sa regular na gawain araw-araw. Ang “tuwing umaga” ang malinaw at likas na katumbas sa Tagalog; inilalahad sa talababa ang mas literal na anyo.
- source_word: בְּהֵיטִיבוֹ
  choice: kapag inaayos niya
  rationale: Sa kontekstong ito, ang Hiphil ng יטב ay tumutukoy sa pag-aasikaso at pagsasaayos ng mga ilawan, na maaaring kabilang ang paggupit o paglinis ng mitsa. Hindi nililimitahan ng “inaayos” ang kilos sa iisang bahagi lamang.
- source_word: הַנֵּרֹת
  choice: ang mga ilawan
  rationale: Ito ang karaniwang tawag sa mga ilawan ng santuwaryo at sapat ang konteksto upang makilala ang mga ito.
- source_word: יַקְטִירֶנָּה
  choice: susunugin niya ito
  rationale: Ang hulaping pambabaeng isahan ay tumutukoy pabalik sa קְטֹרֶת. Pinananatili ng “ito” ang anaporikong pagtukoy nang hindi inuulit ang “insenso.”
