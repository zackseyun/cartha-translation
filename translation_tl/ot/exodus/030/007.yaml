  naturalness: Likas at malinaw ang modernong Filipino. Ang "Tuwing umaga," ay angkop na katumbas ng paulit-ulit na Hebreong "umaga-umaga," at ang "Kapag inaayos niya ang mga ilawan" ay natural na pananalita sa pangkalahatan o nakagawiang utos.
  terminology: Ang "mabangong insenso," "mga ilawan," at "sa ibabaw nito" ay angkop sa kontekstong pansantuwaryo at hindi nagpapataw ng di-kinakailangang interpretasyong pangdoktrina. Maayos ding pinananatili ng mga talababa ang mas tiyak na posibleng diwa ng mga salitang Hebreo.
