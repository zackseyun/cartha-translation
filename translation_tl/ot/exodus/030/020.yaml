  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang paghuhugas bago pumasok sa Tolda ng Pagpupulong o lumapit sa altar, ang babalang kamatayan, paglilingkod, handog sa pamamagitan ng apoy, at ang pangalang Yahweh ay napanatili. Gayunman, ang “gayundin” ay hindi katumbas ng אוֹ (“o”) at nawawala ang hayag na disjunctive na pag-uugnay ng ikalawang pangyayari.'
  naturalness: Marangal at modernong Tagalog ang kabuuang rehistro. Mas malinaw at natural ang “maghuhugas sila gamit ang tubig” kaysa “maghuhugas sila ng tubig,” na maaaring basahin na tubig mismo ang hinuhugasan. Ang “o kapag” ay natural din at tumpak sa estruktura ng pinagmulan.
  terminology: Ang “tolda ng pagpupulong,” “altar,” at “Yahweh” ay angkop. Ang “handog na pinaraan sa apoy” ay napapanatili bilang source-transparent na katawagan para sa אִשֶּׁה; ang talababa ay maayos na nagbibigay ng “handog na pagkain” bilang alternatibo.
