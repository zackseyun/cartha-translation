    rationale: Maaari itong mangahulugang huhugasan nila ang tubig. Ang “maghuhugas sila gamit ang tubig” ay malinaw na ipinahahayag na tubig ang gamit sa paghuhugas, gaya ng יִרְחֲצוּ מַיִם.
