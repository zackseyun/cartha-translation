  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: tl
  text: Kapag pumapasok sila sa tolda ng pagpupulong, maghuhugas sila gamit ang tubig upang hindi sila mamatay; o kapag lumalapit sila sa altar upang maglingkod at magsunog ng handog na pinaraan sa apoy para kay Yahweh[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “handog na pinaraan sa apoy” ay maaari ring isaling “handog na pagkain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Kapag pumapasok sila
  rationale: 'Ang ב na sinusundan ng infinitive construct at hulaping panghalip ay temporal: “kapag/sa pagpasok nila.” Natural sa modernong Tagalog ang “kapag pumapasok sila.”'
- source_word: אֹהֶל מוֹעֵד
  choice: tolda ng pagpupulong
  rationale: Pinananatili ang karaniwang kahulugan ng santuwaryong lugar kung saan nakikipagtagpo ang Diyos sa Israel; malinaw at likas sa Tagalog ang “tolda ng pagpupulong.”
- source_word: יִרְחֲצוּ מַיִם
  choice: maghuhugas sila ng tubig
  rationale: Tahasang pinananatili ang מַיִם (“tubig”) at ang utos hinggil sa ritwal na paghuhugas, nang hindi nagdaragdag ng bagay na hindi tahasang binanggit.
- source_word: וְלֹא יָמֻתוּ
  choice: upang hindi sila mamatay
  rationale: Bagaman pormal na pinag-ugnay ng ו, sa konteksto ay ipinahahayag nito ang layunin o bunga ng paghuhugas. Pinananatili ng “upang hindi sila mamatay” ang bigat ng parusang kamatayan.
- source_word: אוֹ
  choice: gayundin
  rationale: Ang אוֹ ay karaniwang “o,” ngunit dito ay nag-uugnay ng ikalawang kalagayan kung kailan kailangan ang paghuhugas. Ang “gayundin” ay mas natural sa Tagalog at hindi nagpapahiwatig na maaaring piliin lamang ang isa sa dalawang tungkulin.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: kapag lumalapit sila sa altar
  rationale: Pinananatili ang pisikal at ritwal na diwa ng נגשׁ, “lumapit.”
- source_word: לְשָׁרֵת
  choice: upang maglingkod
  rationale: Malinaw sa konteksto na banal na paglilingkod ng mga pari ang tinutukoy; ang “maglingkod” ay natural at hindi lipas sa modernong Tagalog.
- source_word: לְהַקְטִיר
  choice: magsunog
  rationale: Ang Hiphil ng קטר ay tumutukoy sa pagpapailanlang ng handog bilang usok sa altar. Ang “magsunog” ay maikli at malinaw sa kasunod na pariralang panghandog.
- source_word: אִשֶּׁה
  choice: handog na pinaraan sa apoy
  rationale: Iniiwasan ang mas interpretatibong “handog na pagkain.” Ang parirala ay kumakatawan sa handog na ginawa sa pamamagitan ng apoy at pinananatili ang sakripisyal na diwa ng termino.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Tahasang isinasalin ang pangalang tipan na יהוה bilang “Yahweh,” alinsunod sa source form at sa ibinigay na pasyang teolohikal.
theological_decisions:
- issue: Pagbibigay ng banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo na יהוה ang nasa Hebreo. Pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Puwersa ng וְלֹא יָמֻתוּ
  choice: upang hindi sila mamatay
  alternative: at hindi sila mamamatay; kung hindi ay mamamatay sila
  rationale: Ipinakikita ng konteksto ang layunin o bunga ng paghuhugas at ang tunay na parusang kamatayan. Hindi pinahihina ng salin ang babala ngunit hindi rin nagdaragdag ng paliwanag.
- issue: Kahulugan ng אִשֶּׁה
  choice: handog na pinaraan sa apoy
  alternative: handog na pagkain; handog sa pamamagitan ng apoy
  rationale: May pagtatalo kung ang termino ay dapat idiin bilang “food offering” o bilang handog na kaugnay ng apoy. Pinipili ang mas source-transparent na “pinaraan sa apoy,” at inilalagay sa talababa ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang pagpapatuloy ng pangungusap sa susunod na talata sa pamamagitan ng pangwakas na kuwit. Iniwasan ang sobrang teknikal o denominasyonal na pananalita.
