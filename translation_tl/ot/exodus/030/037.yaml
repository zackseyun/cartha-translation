base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: tl
  text: At ang insensong gagawin mo ayon sa timpla nito[a] ay huwag ninyong gawin para sa inyong sarili[b]; magiging banal ito sa iyo para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ayon sa pormula nito” o “ayon sa mga proporsiyon nito.”
    reason: lexical_alternative
  - marker: b
    text: Ibig sabihin, hindi dapat gawin ang sagradong timplang ito ng insenso para sa karaniwang pansariling gamit.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: ang insenso
  rationale: Tumutukoy ito sa sagradong timpla ng insenso na inilalarawan sa naunang konteksto; natural at tuwiran ang “insenso” sa modernong Filipino.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: na gagawin mo
  rationale: Pinananatili ang ikalawang panauhang isahan ng pandiwa at ang payak na diwa ng sugnay na panuring.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: ayon sa pagkakatimpla nito
  rationale: Sinasaklaw ng “pagkakatimpla” ang itinakdang komposisyon o proporsiyon ng mga sangkap nang hindi labis na teknikal.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: huwag ninyong gawin para sa inyong sarili
  rationale: Ipinakikita ng maramihang pandiwa ang utos sa buong Israel, habang pinananatili ng parirala ang pagbabawal na gumawa nito para sa pansariling gamit.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: Ituring mo itong banal
  rationale: 'Natural na ipinahahayag sa Filipino ang relational na diwa: dapat kilalanin o ituring ni Moises/Israel ang insenso bilang banal. Hindi ito pinalalakas tungo sa “kabanal-banalan.”'
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag ng pang-ukol ang pagkakatalaga sa Diyos, at pinananatili ang personal na pangalang Yahweh.
theological_decisions:
- issue: Paglalarawan sa kabanalan ng insenso
  choice: Ituring mo itong banal para kay Yahweh
  alternative: Magiging banal ito sa iyo para kay Yahweh
  rationale: Ang napiling anyo ay likas sa modernong Filipino at ipinapakita ang tungkulin ng Israel na kilalanin itong nakatalaga, nang hindi binabago ang sagradong katayuan nito.
- issue: Paglilipat ng pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ginagamit ng tekstong Hebreo ang Tetragrammaton; ang “Yahweh” ay nagpapanatili sa tipanang personal na pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang paglipat mula sa isahang “mo” tungo sa maramihang “ninyong” sa Hebreo, at saka bumalik sa isahan, upang hindi burahin ang tunay na pagbabago ng bilang sa pinagmulan.
