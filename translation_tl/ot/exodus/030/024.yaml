lexical_decisions:
- source_word: קִדָּה
  choice: kasia
  rationale: Tumutukoy sa mabangong balat ng punong cassia na ginagamit sa paggawa ng pabango; pinanatili ang tiyak at maikling pangalan ng sangkap.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: limang daan
  rationale: Tuwirang bilang na nagsasaad ng bigat ng kasia.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ipinakikita ng parirala na ang bigat ay susukatin ayon sa pamantayang siklo ng santuwaryo.
- source_word: שֶׁמֶן זַיִת
  choice: langis ng olibo
  rationale: Likas at malinaw na salin sa modernong Filipino ng Hebreong pariralang tumutukoy sa olive oil.
- source_word: הִין
  choice: isang hin
  rationale: Pinanatili ang sinaunang tiyak na yunit ng sukat sa halip na palitan ito ng di-tiyak na modernong katumbas.
- source_word: וְ
  choice: at
  rationale: Pinananatili ang pagkakaugnay ng talata sa naunang mga sangkap ng timpla.
