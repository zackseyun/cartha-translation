  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: tl
  text: Italaga mo ang mga ito bilang banal, at magiging kabanal-banalan ang mga ito. Anumang humipo sa mga ito ay magiging banal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas literal, “ay magiging banal” o “ay itatalaga bilang banal.” Maaaring ipahiwatig ng Hebreo ang pagiging banal dahil sa paghipo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Italaga mo sila bilang banal
  rationale: Ang Piel ng קדשׁ ay nangangahulugang italaga o ibukod bilang banal. Likas at malinaw sa makabagong Filipino ang pariralang ito sa kontekstong ritwal.
- source_word: אֹתָם
  choice: sila
  rationale: Tumutukoy ang panghalip sa mga kagamitan at bagay na binanggit sa naunang konteksto; karaniwan sa Filipino ang “sila” para sa maramihang tiyak na bagay.
- source_word: וְהָיוּ
  choice: at sila ay magiging
  rationale: Pinananatili nito ang resulta ng ginawang pagtatalaga at ang pagkakasunod ng mga tagubilin.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ito ang natural at dignified na Filipino para sa Hebreong superlatibong konstruksyon na nagpapahayag ng pinakamataas na antas ng kabanalan, nang hindi ito ginagawang pangalan ng isang lugar.
- source_word: כָּל הַנֹּגֵעַ
  choice: Anumang dumikit
  rationale: Generic at malawak ang Hebreo at maaaring sumaklaw sa tao o bagay. Pinananatili ng “anumang” ang saklaw, at ng “dumikit” ang diwa ng paghipo o pagdaiti.
- source_word: בָּהֶם
  choice: sa kanila
  rationale: Tumutukoy ito sa mga bagay na itinalaga bilang banal.
- source_word: יִקְדָּשׁ
  choice: ay magiging banal
  rationale: 'Ipinahahayag nito ang posibleng inchoative o resultative na diwa ng Qal imperfect: nagkakaroon ng banal na kalagayan dahil sa pagdikit, sa halip na simpleng paglalarawan lamang ng dati nang katayuan.'
theological_decisions:
- issue: Kahulugan ng kabanalang dulot ng pagdikit
  choice: Sinasabi ng salin na ang anumang dumikit sa mga itinalagang bagay ay magiging banal, nang hindi nililinaw kung ito ay kapaki-pakinabang, mapanganib, o may kaakibat na paghihigpit.
  alternative: Maaaring unawain ito bilang positibong pagtatalaga, o bilang pagpasok sa saklaw ng kabanalan at sa mga panganib o paghihigpit nito.
  rationale: Payak na sinasabi ng Hebreo na “magiging banal.” Pinananatili ng salin ang teolohikal na tensiyon at hindi nagdaragdag ng paliwanag mula sa mas malawak na teolohiyang ritwal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “italaga bilang banal” upang ipaliwanag ang ritwal na konsepto nang hindi umaasa sa teknikal o makalumang “pakabanalin.” Ang “kabanal-banalan” ay pinanatiling predikatibong antas ng kabanalan, hindi pangalan ng isang lugar.
