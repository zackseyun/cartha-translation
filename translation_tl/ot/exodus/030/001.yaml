base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/001.yaml
  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: tl
  text: “Gagawa ka ng altar para sa pagsusunog ng insenso[a]; gagawin mo ito mula sa kahoy na akasya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring mas maikli: “altar ng insenso” o “altar para sa insenso.” Mas literal sa Hebreo ang “altar para sa pagsusunog ng insenso.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Gagawa ka
  rationale: Ang Qal perfect na ikalawang panauhang panlalaki na may pang-ugnay ay gumaganap bilang utos sa sunod-sunod na tagubilin. Ang anyong panghinaharap sa Filipino ay natural na naghahatid ng mariing direktiba.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Karaniwan at madaling maunawaang salitang Filipino para sa dambanang pinaghahandugan; ang konteksto ang nagtatakda ng tiyak na gamit nito.
- source_word: מִקְטַר קְטֹרֶת
  choice: para sa pagsusunog ng insenso
  rationale: Inilalahad nito ang gamit ng altar at malapit na sinusundan ang diwa ng Hebreong pariralang tumutukoy sa pagsusunog o pagpapausok ng insenso, sa halip na gawing isang pinaikling titulo.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Natural na Filipino para sa Hebreong idyoma na tumutukoy sa trosong o kahoy mula sa punong akasya.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: gagawin mo ito
  rationale: Pinananatili ang pag-uulit ng pandiwang ‘gawin’ sa Hebreo at ang muling pagtukoy sa altar bago banggitin ang materyales.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “altar,” na mas karaniwan sa pang-araw-araw na Filipino kaysa “dambana,” habang pinanatili ang pormal na himig ng tagubilin at ang pag-uulit sa Hebreo.
