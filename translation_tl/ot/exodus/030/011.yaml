base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH.” Ang banal na pangalang ito ay tradisyonal na isinasasaling “ang PANGINOON”; maaari rin itong itranslitera bilang “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang waw-consecutive imperfect ng דבר ay nagbubukas ng kasunod na hakbang sa salaysay. Ang “nagsalita” ay mas tuwirang katumbas kaysa “sinabi” sa pormulang ito ng banal na pagsasalita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinausap; “kay” ang natural na anyo sa modernong Tagalog bago ang pangalang pantangi.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakasanayan at malinaw na anyo ng pangalang מֹשֶׁה sa Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormulang Hebreo na nagpapakilala sa mismong nilalaman ng susunod na pahayag, bagaman mas pormal ito kaysa karaniwang usapan sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Tahasan sa tekstong Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan, habang ang tradisyonal na “ang PANGINOON” ay pamalit na titulo.
translation_notes:
  register: Makabago ngunit marangal na Tagalog. Pinanatili ang pormal at paulit-ulit na hulma ng Hebreong pormula ng pagsasalita upang malinaw na ipakilala ang pahayag na sumusunod.
