  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: tl
  text: Huwag itong ibuhos sa katawan ng tao,[a] at huwag kayong gumawa ng anumang katulad nito ayon sa timpla nito. Banal ito; magiging banal ito para sa inyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sa laman ng tao.” Ang “tao” rito ay tumutukoy sa mga tao sa pangkalahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיסָךְ
  choice: ibuhos
  rationale: Pinananatili ang konkretong diwa ng pandiwang נסך at ang pasibong anyo sa Hebreo, nang hindi ito agad binibigyang-kahulugang ritwal na 'pahiran.'
- source_word: עַל בְּשַׂר אָדָם
  choice: sa katawan ng tao
  rationale: Ang בָּשָׂר ay literal na 'laman,' ngunit sa pagbabawal na ito, ang likas at malinaw na Tagalog ay 'katawan'; ang אָדָם ay pangkalahatang tumutukoy sa tao, hindi lamang sa lalaki.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: na may gayong timpla
  rationale: Ang מַתְכֹּנֶת ay tumutukoy sa sinusukat na komposisyon o proporsiyon ng halo. Ang 'timpla' ay natural sa Tagalog at ang 'gayong' ay nag-uugnay nito sa natatanging komposisyon ng langis.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: huwag kayong gumawa ng anumang tulad nito
  rationale: Malinaw na ipinahahayag ang pagbabawal na gumawa ng kapareho o katulad na sangkap.
- source_word: קֹדֶשׁ הוּא
  choice: Banal ito
  rationale: Pinananatili ang pangunahing terminong biblikal na 'banal' para sa קֹדֶשׁ.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: ituring ninyo itong banal
  rationale: Natural na Tagalog ito para sa literal na 'magiging banal ito sa inyo,' at ipinahahayag ang hinihinging pagkilala at pagtrato ng Israel sa langis bilang banal.
theological_decisions:
- issue: Pangkalahatang gamit ng אָדָם
  choice: tao
  alternative: sangkatauhan / sinumang tao
  rationale: Ang אָדָם dito ay generic na pantukoy sa tao. Ang 'tao' ay tumpak, natural, at hindi nagpapahiwatig na lalaki lamang ang saklaw.
- issue: Kahulugan ng קֹדֶשׁ יִהְיֶה לָכֶם
  choice: ituring ninyo itong banal
  alternative: magiging banal ito para sa inyo
  rationale: Ang piniling salin ay natural at pinananatili ang relasyonal na obligasyon ng Israel, samantalang ang alternatibo ay mas pormal ngunit maaaring tumunog na pahayag lamang tungkol sa magiging kalagayan nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'katawan' sa pangunahing teksto para sa natural na daloy, habang pinanatili sa talababa ang literal na 'laman.'
