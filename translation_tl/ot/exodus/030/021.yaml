  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: tl
  text: Huhugasan nila ang kanilang mga kamay at mga paa upang hindi sila mamatay. Ito ay magiging isang tuntuning mananatili[a] para sa kanila—para sa kanya[b] at sa kanyang mga supling sa lahat ng kanilang salinlahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tuntuning panghabang-panahon” o “tuntuning walang hanggan.” Ang Hebreong חָק עוֹלָם ay isang karaniwang pormulang legal para sa isang umiiral at nagtatagal na tuntunin.
    reason: lexical_alternative
  - marker: b
    text: Ang “kanya” ay tumutukoy kay Aaron ayon sa agarang konteksto.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Huhugasan nila
  rationale: Ang anyong pandiwa sa kontekstong pambatas ay may puwersang nag-uutos. Ang hinaharap na anyo sa Filipino ay natural dito at pinananatili ang estilong tuntunin nang hindi labis na nagpapaliwanag.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: ang kanilang mga kamay at mga paa
  rationale: Tuwirang salin na nagpapanatili sa dalawang tiyak na bahagi ng katawan na kailangang hugasan sa ritwal.
- source_word: וְלֹא יָמֻתוּ
  choice: upang hindi sila mamatay
  rationale: Ipinahahayag nito ang layunin o bunga ng pagsunod sa ritwal na utos at natural ang pagkakabuo sa modernong Filipino.
- source_word: חָק עוֹלָם
  choice: palagiang tuntunin
  rationale: Ang pariralang Hebreo ay karaniwang pormulang pambatas para sa isang nananatili o patuloy na kautusan. Ang “palagiang tuntunin” ay malinaw at hindi awtomatikong nagdaragdag ng pilosopikal na diwang walang hanggan.
- source_word: לָהֶם
  choice: para sa kanila
  rationale: Pinananatili ang pangmaramihang panghalip ng Hebreo, na tumutukoy sa mga paring saklaw ng utos.
- source_word: לוֹ
  choice: para sa kanya
  rationale: Pinananatili ang pang-isahang panghalip sa halip na tahasang ipalit ang pangalang Aaron; nililinaw sa talababa ang malamang na tinutukoy nito.
- source_word: וּלְזַרְעוֹ
  choice: at sa kanyang mga supling
  rationale: Ang זֶרַע ay tumutukoy sa lahi o mga inapo bilang isang kolektibong kabuuan. Ang “mga supling” ay natural at malapit sa larawang pinagmulan.
- source_word: לְדֹרֹתָם
  choice: sa lahat ng kanilang salinlahi
  rationale: Ipinakikita nito ang pagpapatuloy ng tuntunin sa magkakasunod na henerasyon habang nananatiling marangal at madaling maunawaan.
theological_decisions:
- issue: Tagal ng tuntuning ipinahahayag ng חָק עוֹלָם
  choice: palagiang tuntunin
  alternative: tuntuning panghabang-panahon; walang-hanggang tuntunin
  rationale: Ipinahahayag ng Hebreong pormulang pambatas ang isang nananatili at nagpapatuloy na obligasyon sa loob ng kaayusang tipan at pagsamba. Pinananatili ng “palagian” ang lakas nito nang hindi tahimik na nagpapasya kung ang saklaw ay metapisikal na walang katapusan.
- issue: Tinutukoy ng pang-isahang לוֹ
  choice: para sa kanya, na may talababa na tumutukoy ito kay Aaron
  alternative: para kay Aaron
  rationale: Ang panghalip mismo ang nasa tekstong Hebreo. Ang pagpapanatili rito ay tapat sa anyo at sa bahagyang pagbabago mula sa pangmaramihang “para sa kanila” tungo sa pang-isahan, habang nililinaw ng talababa ang agarang konteksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang payak na “huhugasan” at “upang hindi sila mamatay,” habang pinanatili ang legal na himig sa “palagiang tuntunin.” Ang gitling na em dash ay tumutulong na mapanatili at maipakita ang di-karaniwang paglipat ng Hebreo mula “para sa kanila” tungo sa “para sa kanya.”
