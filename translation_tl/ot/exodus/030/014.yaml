  - severity: low
    issue: Hindi wasto ang unang talababa bilang paglalarawan ng literal na Hebreo.
    rationale: Hindi literal na sinasabi ng Hebreo ang “bawat isa mula sa anak na dalawampung taon”; ang כֹּל ay kaugnay ng “dumaraan,” at ang מִבֶּן ay bahagi ng pormulang pang-edad. Dahil hindi na kailangan ang interpretatibong paglilinaw ng kasarian, inalis ang talababa.
  revised_text: Ang bawat dumaraan upang mapabilang sa mga binibilang[a], mula dalawampung taong gulang pataas, ay magbibigay ng handog para kay Yahweh.
