  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: tl
  text: Ang bawat dumaraan upang mapabilang sa mga binibilang[a], mula dalawampung taong gulang pataas, ay magbibigay ng handog para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dumaraan sa gitna ng mga binilang.” Literal na gumagamit ang Hebreo ng larawan ng “pagdaan” kaugnay ng mga binibilang, malamang bilang bahagi ng pagpapatala sa sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Ang bawat lalaking
  rationale: Ang כֹּל ay distributibo, “bawat.” Ipinahihiwatig ng kasunod na מִבֶּן (“mula sa anak na lalaki na…”) at ng konteksto ng sensus na mga lalaki ang tinutukoy; minarkahan ito sa talababa upang hindi maitago ang anyo ng Hebreo.
- source_word: הָעֹבֵר עַל הַפְּקֻדִים
  choice: na dumaraan upang mapabilang sa mga binibilang
  rationale: Pinananatili ng “dumaraan” ang konkretong larawan ng עבר, samantalang ipinahahayag ng “upang mapabilang sa mga binibilang” ang idyomatikong kaugnayan nito sa mga inirerehistro sa sensus. Nananatili sa talababa ang posibleng mas literal na alternatibo.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: dalawampung taong gulang pataas
  rationale: Natural na makabagong Tagalog para sa karaniwang pormula ng hangganan ng edad, habang tumpak na pinananatili ang simula sa edad na dalawampu.
- source_word: יִתֵּן
  choice: ay magbibigay
  rationale: Ang imperfect ay may legal o nag-uutos na puwersa. Sa Tagalog, malinaw na naihahayag ng “magbibigay” ang itinakdang obligasyon sa kontekstong legal.
- source_word: תְּרוּמַת
  choice: handog
  rationale: Ang תְּרוּמָה ay bagay na inihahandog o inilalaan para kay Yahweh. Mas natural sa ordinaryong Tagalog ang “handog” kaysa “kontribusyon,” ngunit hindi nito tinutukoy nang mas eksakto kaysa sa pinagmulan ang ritwal na anyo nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng titulong “PANGINOON.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Gaano kalinaw na ilalahad ang idyoma ng sensus
  choice: dumaraan upang mapabilang sa mga binibilang
  alternative: dumaraan sa gitna ng mga binilang; kabilang sa mga binibilang
  rationale: Pinagsasama ng salin ang literal na larawan ng pagdaan at ang malinaw na layunin ng pagpapatala, nang hindi lubusang pinapawi ang tunay na idyomatikong kalabuan.
- issue: Kung tahasang babanggitin ang kasarian
  choice: lalaking, na may talababa
  alternative: bawat isa
  rationale: Ang pormulang מִבֶּן (“mula sa anak na lalaki…”) at ang konteksto ng pagpapatala sa Israel ay tumutukoy sa mga lalaki. Gayunman, sapagkat hindi simpleng pangngalang “lalaki” ang anyo, minarkahan ang pagpapalinaw.
translation_notes:
  register: Makabago, dignidadong Filipino na angkop sa tekstong legal. Ginamit ang “pataas” at “magbibigay” para sa natural na daloy, habang pinanatili ang larawan ng pagdaan at ang personal na pangalang Yahweh. Ang bawat marker na [a] at [b] ay nasa pangunahing teksto.
