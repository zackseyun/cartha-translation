lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Pagkatapos, nagsalita
  rationale: Ang waw-consecutive ay nagsusulong sa salaysay, at ang דִּבֵּר ay likas na isinasaling “nagsalita” sa pormulang nagpapakilala ng banal na pahayag.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֶל־מֹשֶׁה
  choice: kay Moises
  rationale: Ang אֶל ay tumutukoy sa pinatutungkulan ng pagsasalita; “kay Moises” ang natural na anyo sa makabagong Tagalog.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang Hebreong pormula na nagpapakilala sa nilalaman ng pahayag, na susunod sa kasunod na talata.
theological_decisions:
- issue: Paglalapat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili sa pangalan sa halip na palitan ito ng tradisyonal na titulong “PANGINOON”; ang iba pang anyo ay itinatala sa talababa.
translation_notes:
