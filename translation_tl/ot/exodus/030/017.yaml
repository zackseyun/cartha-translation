  source_fidelity: 'Ang pangunahing diwa ay tama: ang wayyiqtol ay naipahayag sa “At nagsalita,” ang אֶל ay “kay,” at ang pangalan ay “Yahweh.” Gayunman, ang “na sinasabi” ay isang pangkasalukuyang anyo na hindi likas bilang pantulong sa natapos na “nagsalita” at hindi ang karaniwang Filipino na paraan upang ihudyat ang kasunod na tuwirang pananalita.'
