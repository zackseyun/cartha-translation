lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: At nagsalita
  rationale: Ang wayyiqtol ng דבר ay nagpapatuloy sa salaysay; likas sa Filipino ang “At nagsalita” at naihihiwalay nito ang pangunahing pandiwa sa kasunod na pormulang לֵאמֹר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang banal na pangalang YHWH sa halip na palitan ng isang titulo.
- source_word: אֶל
  choice: kay
  rationale: Ang pang-ukol ay tumutukoy sa taong kinausap; “kay” ang likas na anyo bago ang pangalang Moises.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Ito ang nakaugaliang anyo ng pangalan sa modernong Filipino.
- source_word: לֵּאמֹר
  choice: na sinasabi
  rationale: Pinananatili nito ang pormal na pormulang Hebreo na nagpapakilala sa tuwirang pagsasalitang susunod, kahit mas idyomatiko sa Filipino ang simpleng “sinabi niya.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; ang talababa ay nagpapaliwanag sa tradisyonal na salin.
translation_notes:
  register: Modernong Filipino na may marangal at bahagyang pormal na himig. Pinanatili ang pormulang “na sinasabi” upang maipakita ang anyo ng Hebreo at ang pagpapatuloy ng pangungusap sa susunod na talata.
