  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: tl
  text: 'At nagsalita si Yahweh kay Moises[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH”; tradisyonal na isinasaling “PANGINOON.”'
