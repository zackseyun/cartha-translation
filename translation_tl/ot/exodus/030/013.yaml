  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: tl
  text: 'Ito ang dapat ibigay ng bawat isa na kabilang sa mga nakatala: kalahating siklo ayon sa siklo ng santuwaryo (ang isang siklo ay dalawampung gera[a]), kalahating siklo bilang handog kay Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ang “gera” ay sinaunang yunit ng timbang; dalawampung gera ang katumbas ng isang siklo. Maaari ring isalin ang naunang parirala nang mas literal: “bawat dumaraan patungo sa mga binilang”; isa itong idyomang Hebreo para sa pagpasok sa opisyal na talaan ng sensus.'
    reason: Nililinaw ang hindi pamilyar na yunit at itinatala ang mas literal na posibilidad ng idyomang pangsensus nang hindi ipinapasok ang kasariang hindi tahasang nasa talata.
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Ito ang ibibigay
  rationale: Natural na pormulang Tagalog para sa demonstratibo at sa itinakdang kilos na ipinahahayag ng imperfect sa legal na tagubilin.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: bawat lalaking mapabilang sa mga nakatala
  rationale: Idyoma ito ng sensus para sa bawat pumapasok sa opisyal na bilang. Ipinahihiwatig ng kasunod na talata na mga lalaki ang binibilang, kaya nilinaw iyon nang hindi ginagawang simpleng 'lahat'.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: kalahating siklo
  rationale: Direkta at madaling maunawaang salin ng halaga; pinanatili ang sinaunang yunit sa transliterasyong karaniwan sa Bibliyang Tagalog.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: ayon sa siklo ng santuwaryo
  rationale: Ang בְּ ay tumutukoy sa pamantayan ng pagsukat; ang parirala ay teknikal na pamantayan ng timbang na kaugnay ng santuwaryo.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: ang isang siklo ay dalawampung gera
  rationale: Pinananatili ang paliwanag sa halaga ng isang siklo at ang sinaunang yunit na gera.
- source_word: תְּרוּמָה לַיהוָה
  choice: bilang handog kay Yahweh
  rationale: Ang תְּרוּמָה ay ambag o handog na ibinukod para sa Diyos; 'handog' ang natural at may angkop na kultikong diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyon sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng 'Yahweh' ang personal na pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Saklaw ng כָּל הָעֹבֵר sa konteksto ng sensus
  choice: bawat lalaking mapabilang sa mga nakatala
  alternative: bawat mapabilang sa mga nakatala; bawat daraan sa mga binilang
  rationale: Ang mismong idyoma ay tumutukoy sa pagpasok sa opisyal na talaan, at nililinaw ng talata 14 na ang saklaw ay mga lalaking dalawampung taong gulang pataas. Hindi nito inaangkat ang anumang denominasyonal na kahulugan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “siklo,” “gera,” at “santuwaryo” bilang malinaw na teknikal na katawagan; iniwasan ang sobrang arkaikong balangkas habang pinanatili ang legal at ritwal na tono.
