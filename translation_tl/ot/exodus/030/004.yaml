  to: Gagawa ka para rito ng dalawang singsing na ginto sa ilalim ng pandekorasyong gilid nito[a]. Gagawin mo ang mga iyon sa dalawang tagiliran nito—sa magkabilang panig nito[b]—at magsisilbi ang mga iyon bilang mga lalagyan[c] ng mga pingga, upang madala ito sa pamamagitan ng mga iyon.
