base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: tl
  text: Gagawa ka para rito ng dalawang singsing na ginto sa ilalim ng pandekorasyong gilid nito[a]. Gagawin mo ang mga iyon sa dalawang tagiliran nito—sa magkabilang panig nito[b]—at magsisilbi ang mga iyon bilang mga lalagyan[c] ng mga pingga, upang madala ito sa pamamagitan ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ilalim ng moldura nito,” “sa ilalim ng hangganan nito,” o “sa ilalim ng labi nito.” Ang Hebreong זֵר ay tumutukoy sa pandekorasyong gilid na nakapalibot sa altar.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa dalawa nitong mga tagiliran ... sa dalawa nitong mga panig.” Medyo inuulit ng paglalarawan ang lokasyon upang idiin na nasa magkabilang panig ang mga singsing.
    reason: lexical_alternative
  - marker: c
    text: Literal na “mga bahay para sa mga pingga,” na ang ibig sabihin ay mga lalagyan o kabitan ng mga pinggang pambuhat.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: dalawang singsing na ginto
  rationale: Ang טַבַּעַת ay singsing na ginagamit bilang kabitan. Likas sa modernong Tagalog ang “singsing na ginto” at malinaw nitong pinananatili ang materyal.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: sa ilalim ng palamuti nitong gilid
  rationale: Ang זֵר ay pandekorasyong moldura o hangganan sa palibot ng altar. Inilalarawan ng “palamuti nitong gilid” ang anyo at gamit nito nang hindi ipinapalagay na simpleng labi lamang ito.
- source_word: צַלְעֹתָיו
  choice: dalawa nitong tagiliran
  rationale: Ang צֵלָע ay maaaring tumukoy sa tadyang, gilid, o estruktural na tagiliran. Sa kagamitang ito, natural at sapat na kongkreto ang “tagiliran,” habang iniiwasan ang di-tiyak na palagay na hiwalay na mga panel ang tinutukoy.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: sa magkabilang panig nito
  rationale: Pinananatili nito ang pag-uulit ng Hebreo at nililinaw na ang mga singsing ay nakalagay sa dalawang magkatapat na panig.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: magsisilbi ang mga iyon bilang mga lalagyan ng mga pingga
  rationale: Literal na “mga bahay” ang בָּתִּים, ngunit idyomatiko itong tumutukoy sa mga sisidlan o kabitang paglalagyan ng mga pingga. Malinaw at likas sa Tagalog ang “mga lalagyan.”
- source_word: בַדִּים
  choice: mga pingga
  rationale: Sa konteksto ng paglilipat ng mga kagamitan sa tabernakulo, ang בַּדִּים ay mahahabang pamalong pambuhat. Ang “mga pingga” ay maikli, moderno, at nauunawaan sa ganitong gamit.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: mga pinggang pambuhat dito
  rationale: Ipinahahayag nito kapuwa ang layunin at ang gamit ng mga pingga bilang kasangkapang ipinambubuhat sa altar.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: Gagawa ka ... Gagawin mo
  rationale: Pinananatili ang dalawang utos at ang pag-uulit ng pandiwa sa Hebreo, ngunit inaayos ang anyo upang maging likas at marangal sa Tagalog.
