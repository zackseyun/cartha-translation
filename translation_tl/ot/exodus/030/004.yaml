  register: Makabago ngunit marangal na Filipino; tuwiran ang himig ng tagubilin. Pinanatili ang pag-uulit tungkol sa dalawang panig at ipinaliwanag sa talababa ang mga matalinghagang o teknikal na salitang Hebreo.
