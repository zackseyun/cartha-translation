  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: tl
  text: Huwag kayong maghandog sa ibabaw nito ng insensong hindi ipinahintulot[a], o ng handog na sinusunog, o ng handog na butil; at huwag kayong magbuhos sa ibabaw nito ng handog na inumin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kakaibang insenso” o “banyagang insenso.” Sa kontekstong ito ng pagsamba, maaaring tumukoy ang salitang Hebreo sa bagay na wala sa ipinahintulot o itinakda.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: maghandog
  rationale: Bagaman literal na nangangahulugang “paakyatin,” ang Hiphil ng עלה ay ginagamit sa kontekstong panghain sa diwang “maghandog.”
- source_word: עָלָיו
  choice: sa ibabaw nito
  rationale: Tumutukoy ito sa altar ng insenso at malinaw na pinananatili ang ugnayang panlunan.
- source_word: קְטֹרֶת
  choice: insenso
  rationale: Ito ang karaniwan at malinaw na katawagan sa mabangong sangkap na sinusunog sa ritwal.
- source_word: זָרָה
  choice: hindi ipinahintulot
  rationale: Sa kontekstong pangpari at pangritwal, inilalarawan nito ang hindi pinahihintulutan o hindi itinakda, hindi lamang ang bagay na banyaga.
- source_word: וְעֹלָה
  choice: o ng handog na sinusunog
  rationale: Sa isang negatibong utos, natural sa Filipino ang “o” sa talaan ng mga ipinagbabawal; ang עֹלָה ay handog na lubusang sinusunog.
- source_word: וּמִנְחָה
  choice: o ng handog na butil
  rationale: Sa kontekstong panghain, ang מִנְחָה ay tumutukoy sa handog na yari sa butil.
- source_word: וְנֵסֶךְ
  choice: handog na inumin
  rationale: Tumutukoy ito sa likidong ibinubuhos bilang handog; malinaw at madaling maunawaan ang katawagang ito.
- source_word: תִסְּכוּ
  choice: magbuhos
  rationale: Ang pandiwa ay tumutukoy sa ritwal na pagbubuhos ng likidong handog.
theological_decisions:
- issue: Katayuang pangritwal ng זָרָה na naglalarawan sa insenso
  choice: insensong hindi ipinahintulot
  alternative: kakaibang insenso; banyagang insenso
  rationale: Pinananatili nito ang diin ng talata sa pagsambang hindi ayon sa ipinahintulot o itinakda, nang hindi ipinapalagay na etnikong banyaga lamang ang tinutukoy.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga katawagang “handog na sinusunog,” “handog na butil,” at “handog na inumin” upang maging madaling maunawaan habang pinananatili ang mga natatanging uri ng handog sa tekstong Hebreo.
