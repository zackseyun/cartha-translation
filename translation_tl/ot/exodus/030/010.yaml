revisions:
- from: Minsan sa isang taon, magsasagawa si Aaron ng pagtubos sa mga sungay nito. Sa pamamagitan ng dugo ng handog para sa kasalanan na ukol sa pagtubos[a], magsasagawa siya ng pagtubos para rito minsan sa isang taon, sa lahat ng inyong salinlahi. Ito ay kabanal-banalan para kay Yahweh.
  to: Minsan sa isang taon, magsasagawa si Aaron ng pagbabayad-sala sa mga sungay nito. Sa pamamagitan ng dugo ng handog para sa kasalanan ukol sa pagbabayad-sala[a], magsasagawa siya ng pagbabayad-sala rito minsan sa isang taon, sa bawat salinlahi ninyo. Ito ay kabanal-banalan para kay Yahweh.
  rationale: Inayos ang pangunahing terminong pansakripisyo upang maipahayag ang כפר bilang ritwal na pagbabayad-sala, hindi pangkaraniwang pagtubos o ransom. Pinanatili ang estruktura, taunang pag-uulit, kawalang-singaw ng pariralang Hebreo tungkol sa “mga pagbabayad-sala,” at ang footnote anchor ng audit trail.
