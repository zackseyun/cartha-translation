base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: tl
  text: Minsan sa isang taon, magsasagawa si Aaron ng pagbabayad-sala sa mga sungay nito. Sa pamamagitan ng dugo ng handog para sa kasalanan ukol sa pagbabayad-sala[a], magsasagawa siya ng pagbabayad-sala rito minsan sa isang taon, sa bawat salinlahi ninyo. Ito ay kabanal-banalan para kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo, “mula sa dugo ng handog para sa kasalanan ng mga pagbabayad-sala.” Maaari ring unawain: “sa pamamagitan ng dugo ng handog para sa kasalanan para sa pagbabayad-sala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: magsasagawa ng pagtubos
  rationale: Sa kontekstong pansaserdote, tumutukoy ang כפר sa pagsasagawa ng ritwal ng pagtubos. Iniiwasan ng pariralang ito ang makitid na diwa ng literal na pagbabayad habang pinananatili ang kinikilalang terminong “pagtubos.”
- source_word: קַרְנֹתָיו
  choice: mga sungay nito
  rationale: Ang hulapi ay tumutukoy sa altar ng insenso sa naunang konteksto; ang “nito” ang likas na panghalip para sa isang bagay sa modernong Tagalog.
- source_word: אַחַת בַּשָּׁנָה
  choice: minsan sa isang taon
  rationale: Malinaw at likas nitong ipinahahayag ang taunang dalas ng ritwal.
- source_word: מִדַּם
  choice: sa pamamagitan ng dugo
  rationale: Bagaman maaaring literal na “mula sa dugo,” instrumental ang gamit ng pang-ukol sa kontekstong ito, kaya ang dugo ang paraang ginagamit sa ritwal.
- source_word: חַטַּאת
  choice: handog para sa kasalanan
  rationale: Sa kontekstong panghain, ang חטאת ay tumutukoy sa handog at hindi lamang sa abstraktong kasalanan.
- source_word: הַכִּפֻּרִים
  choice: ukol sa pagtubos
  rationale: Likas ito sa Tagalog at pinananatili ang ugnayan ng handog sa pagtubos nang hindi pilit na ginagaya ang Hebreong anyong maramihan.
- source_word: לְדֹרֹתֵיכֶם
  choice: sa lahat ng inyong salinlahi
  rationale: Ipinahahayag nito na patuloy na susundin ang ritwal ng magkakasunod na salinlahi.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: kabanal-banalan
  rationale: Ang Hebreong konstruksyon ay isang pasukdol na tumutukoy sa pinakamataas na antas ng kabanalan; malinaw at nakaugat sa gamit-Bibliya ang “kabanal-banalan.”
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ipinahahayag ng “para kay” ang kaugnayan o pagtatalaga, at tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה.
theological_decisions:
- issue: Paglalarawan sa bisa ng כפר para sa altar
  choice: magsasagawa ng pagtubos para rito
  alternative: lilinisin ito / aalisin ang karumihan nito
  rationale: Pinananatili ng “pagtubos” ang saklaw at teolohikal na tensiyon ng terminong pansakripisyo nang hindi ito nililimitahan lamang sa paglilinis o pagtatakip.
- issue: Pagsasalin ng יהוה
  choice: Yahweh
  alternative: ang PANGINOON / Jehova
  rationale: Ginagamit ang “Yahweh” upang malinaw na katawanin ang personal na pangalang יהוה at makaiwas sa paghahalo nito sa titulong אֲדֹנָי.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Pinanatili ang mga terminong pansakripisyo ngunit iniwasan ang sobrang literal at hindi likas na parirala. Ang “kabanal-banalan” ay pamilyar sa mambabasang Tagalog at dito ay antas ng kabanalan, hindi pangalan ng pinakaloob na bahagi ng santuwaryo.
