    issue: Ang “pagtubos” para sa כפר ay maaaring magpahiwatig ng ransom o redemption sa halip na ritwal na pagbabayad-sala.
    rationale: Sa kontekstong pari at dugo ng handog, ang כפר ay tumutukoy sa pagsasagawa ng ritwal ng atonement para sa altar. Mas malinaw itong naipahahayag ng “pagbabayad-sala,” nang hindi ipinipilit na paglilinis lamang ang kahulugan.
  - severity: low
    issue: Hindi lubos na likas ang “magsasagawa ... ng pagtubos para rito.”
    rationale: Ang paggamit ng “magsasagawa ng pagbabayad-sala rito” ay mas maayos na Filipino at pinananatili ang pag-uulit na nasa Hebreo.
