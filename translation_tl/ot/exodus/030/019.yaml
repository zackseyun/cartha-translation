lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Maghuhugas
  rationale: Ang Qal perfect na may prefixed conjunction ay may direktibo o panghinaharap na puwersa sa konteksto ng mga tagubilin. Ang “maghuhugas” ay natural sa Filipino at nagpapanatili ng tonong nag-uutos.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Karaniwang anyo ng pangalang Hebreo sa makabagong saling Filipino.
- source_word: וּבָנָיו
  choice: at ang kanyang mga anak na lalaki
  rationale: Sa kontekstong pangsaserdote, tumutukoy ang בנים sa mga lalaking anak ni Aaron; pinananatili ng salin ang tiyak na kasarian ng reperensiya.
- source_word: מִמֶּנּוּ
  choice: mula roon
  rationale: Ang מן na may hulaping panghalip ay literal na “mula rito/roon,” na tumutukoy sa hugasan sa naunang talata. Ang “mula roon” ay mas natural kaysa “mula rito” kapag tumutukoy sa bagay na nabanggit sa salaysay, habang hindi idinaragdag sa pangunahing teksto ang salitang “tubig.”
- source_word: אֶת יְדֵיהֶם
  choice: ng kanilang mga kamay
  rationale: Tuwirang tumutukoy sa unang bahagi ng katawan na huhugasan.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: at mga paa
  rationale: Pinag-uugnay ang ikalawang tuwirang layon; ang payak na kahulugan ng רַגְלַיִם ay “mga paa.”
theological_decisions:
- issue: Tiyak na kasarian ng mga saserdoteng tinutukoy
  choice: ang kanyang mga anak na lalaki
  alternative: ang kanyang mga anak
  rationale: Ang talata ay tungkol kay Aaron at sa kanyang mga lalaking anak na naglilingkod bilang mga saserdote. Hindi ginagawang neutral ang tiyak na panlalaking reperensiya ng tekstong Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinili ang natural na konstruksiyong “maghuhugas … ng” at pinanatili sa talababa ang mas tahasang pagbanggit sa tubig upang hindi dagdagan ang pangunahing teksto nang higit sa Hebreo.
