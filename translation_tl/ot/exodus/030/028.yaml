  source_fidelity: 'Tumpak na naihahatid ng salin ang sunod-sunod na layon sa Hebreo: ang altar na kaugnay ng handog na sinusunog, lahat ng kagamitan nito, ang palanggana, at ang patungan nito. Ang “para sa handog na sinusunog” ay isang katanggap-tanggap na natural na pagpapahayag ng ugnayang ipinahihiwatig ng מִזְבַּח הָעֹלָה.'
