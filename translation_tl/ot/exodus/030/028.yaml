  text: and the altar of burnt offering with all its utensils[a], and the basin with its stand.
translation:
  language: tl
  text: ang altar para sa handog na sinusunog at ang lahat ng kagamitan nito, at ang palanggana at ang patungan nito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, paanan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: altar para sa handog na sinusunog
  rationale: Ang מִזְבַּח ay “altar,” at ang הָעֹלָה ay handog na lubusang sinusunog. Likas sa modernong Tagalog ang “para sa” upang malinaw na ipahayag ang gamit ng altar habang pinananatili ang natatanging terminong panghandog.
- source_word: כָּל כֵּלָיו
  choice: ang lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כְּלִי at maaaring tumukoy sa mga sisidlan o kasangkapang ginagamit sa altar. Ang “kagamitan” ay malinaw, likas, at sapat na malawak; ang hulaping panghalip ay tumutukoy sa altar.
- source_word: הַכִּיֹּר
  choice: ang palanggana
  rationale: Tumutukoy ang כִּיּוֹר sa sisidlang hugasan sa paglilingkod sa santuwaryo. Ang “palanggana” ay karaniwan at madaling maunawaan sa modernong Tagalog.
- source_word: כַּנּוֹ
  choice: ang patungan nito
  rationale: Sa kontekstong ito, ang כֵּן ay suportang kinapatungan ng palanggana. Ipinapahayag ng “patungan” ang gamit nito nang mas tiyak kaysa sa pangkalahatang “base.”
- source_word: וְאֶת
  choice: at
  rationale: Pinag-uugnay ng וְ ang magkakasunod na layon sa talaan; walang tuwirang katumbas sa Tagalog ang אֶת bilang pananda ng tiyak na layon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang anyong bahagi ng isang nagpapatuloy na talaan, kaya nagsisimula sa “ang” at hindi ginawang ganap na pangungusap. Inilagay ang talababa pagkatapos ng “patungan nito,” ang mismong pariralang may leksikal na alternatibo.
