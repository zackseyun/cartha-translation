revisions:
- from: 'At ikaw, kumuha ka para sa iyo ng pinakamainam na mga sangkap na mabango: limang daang siklo ng mirang kusang umaagos[a], at kalahati niyon—dalawang daan at limampu—ng mabangong kanela, at dalawang daan at limampu ng mabangong tambo[b],'
