base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: tl
  text: 'Ikaw naman, kumuha ka ng pinakamainam na mababangong sangkap: limang daang siklo ng mirang malayang umaagos[a], at kalahati niyon—dalawang daan at limampu—ng mabangong kanela, at dalawang daan at limampu ng mabangong tambo[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalisay na mira.” Malamang na tumutukoy ang pariralang Hebreo sa mirang malayang umaagos sa likas nitong kalagayan.
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal na “matamis na kanela” at “matamis na tambo” (kalamo). Mas malawak na tumutukoy ang Hebreo sa mabango o aromatikong kanela at tambo.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: pinakamainam na mga sangkap na mabango
  rationale: Ang בְּשָׂמִים ay mga aromatikong sangkap o espesya, at ang רֹאשׁ ay idiomatikong tumutukoy sa pinakamainam o pinakapili. Malinaw at likas sa modernong Tagalog ang pariralang ito nang hindi nililimitahan ang mga sangkap sa gamit sa pagluluto.
- source_word: מָר דְּרוֹר
  choice: mirang kusang umaagos
  rationale: Ang מָר ay mira, samantalang ang דְּרוֹר ay maaaring maglarawan sa malayang pagdaloy nito sa likas na kalagayan. Pinananatili ng salin ang kongkretong larawan at inilalagay sa talababa ang tradisyonal na alternatibong “dalisay na mira.”
- source_word: חֲמֵשׁ מֵאוֹת
  choice: limang daang siklo
  rationale: Bilang lamang ang tahasang nasa parirala, ngunit mula sa konteksto ng resipe at sa talata 24 ay siklo ang yunit ng timbang. Isinama ito upang maging malinaw ang sukat.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: mabangong kanela
  rationale: Ang קִנְּמָן ay kanela at inilalarawan ito ng בֶּשֶׂם bilang aromatiko o mabango. Iniiwasan ng “mabango” ang posibleng maling pahiwatig ng “matamis” tungkol sa lasa.
- source_word: מַחֲצִיתוֹ
  choice: kalahati niyon
  rationale: Ang hulapi ay tumutukoy sa naunang dami na limang daan. Likas na ipinahahayag ng “kalahati niyon” ang kaugnayan ng dalawang sukat.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: dalawang daan at limampu
  rationale: Ito ang tahasang bilang na nagpapaliwanag sa “kalahati niyon,” gaya ng pagkakaayos sa Hebreo.
- source_word: קְנֵה בֹשֶׂם
  choice: mabangong tambo
  rationale: Ang קָנֶה ay tambo o halamang tulad ng tambo, at ang בֹשֶׂם ay nagsasaad na mabango ito. Mas malinaw at hindi labis na espesipiko ang “mabangong tambo” kaysa sa botanikong katawagang “calamus.”
