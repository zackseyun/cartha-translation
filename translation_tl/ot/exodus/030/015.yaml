  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: tl
  text: Huwag magbigay ang mayaman nang higit sa kalahating siklo, at huwag magbigay ang mahirap nang kulang dito, sa pagbibigay ninyo ng ambag kay Yahweh upang magbayad-sala para sa inyong buhay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “inyong mga sarili” o “inyong mga kaluluwa.” Ang Hebreong nefesh ay maaaring mangahulugang buhay, sarili, tao, o kaluluwa. Sa konteksto ng bayad sa sensus, malamang na tumutukoy ito sa buhay o pagkatao ng mga binilang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: ang mayaman
  rationale: Ang pang-uri na may pantukoy ay ginagamit bilang pangngalan para sa uri ng taong may kaya; natural at tuwiran ito sa modernong Tagalog.
- source_word: יַרְבֶּה
  choice: hindi dapat magbigay ... ng higit
  rationale: Sa konteksto ng takdang bayad, ang pandiwa ay tumutukoy sa pagbibigay nang lampas sa itinakdang halaga.
- source_word: הַדַּל
  choice: ang mahirap
  rationale: Tumutukoy ito sa taong salat sa kabuhayan at malinaw na katapat ng “mayaman.”
- source_word: יַמְעִיט
  choice: hindi dapat magbigay ... ng kulang
  rationale: Pinananatili nito ang magkatimbang na legal na pahayag tungkol sa takdang halaga.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: sa kalahating siklo ... dito
  rationale: Malinaw na ipinahahayag sa natural na Tagalog na hindi maaaring humigit o kumulang sa nakatakdang kalahating siklo.
- source_word: תְּרוּמַת יְהוָה
  choice: ang handog kay Yahweh
  rationale: Ang תְּרוּמָה ay isang ambag na ibinukod para sa banal na gamit; ang “handog” ay likas at marangal sa Tagalog, habang ipinakikita ng “kay” ang pinag-uukulan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְכַפֵּר
  choice: upang magbayad-sala
  rationale: Karaniwang salin ito sa Tagalog para sa paggawa ng atonement at pinananatili ang panrelihiyong bigat ng termino nang hindi nagpapasya sa isang tiyak na teorya nito.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: para sa inyong buhay
  rationale: Sa konteksto ng bayad sa sensus, ang נֶפֶשׁ ay tumutukoy sa buhay o mismong pagkatao ng mga binilang, hindi lamang sa di-materyal na kaluluwa.
- source_word: לָתֵת
  choice: kapag ibinibigay ninyo
  rationale: Inihahayag nito nang natural ang pangyayaring kasabay ng pagbibigay ng itinakdang halaga.
theological_decisions:
- issue: Pagpapahayag sa pangalang YHWH
  choice: Yahweh
  alternative: ang PANGINOON; Jehovah
  rationale: Ang transliterasyong “Yahweh” ay nagpapanatili sa personal na pangalan sa tekstong Hebreo sa halip na tahimik na palitan ito ng titulo.
- issue: Kahulugan ng נֶפֶשׁ sa konteksto ng pagtubos-sala
  choice: para sa inyong buhay
  alternative: para sa inyong mga sarili; para sa inyong mga kaluluwa
  rationale: Ang konteksto ng sensus at pantubos ay nakatuon sa buhay o buong pagkatao ng bawat binilang; iniiwasan nitong magpasok ng mas makitid na antropolohikal na pakahulugan.
- issue: Pagpapahayag sa כפר
  choice: upang magbayad-sala
  alternative: upang gumawa ng pagtubos-sala; upang tubusin
  rationale: Pinananatili ng “magbayad-sala” ang kinikilalang panrelihiyong diwa ng כפר, ngunit hindi itinatakda kung anong partikular na mekanismo o teorya ng atonement ang tinutukoy.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal at malinaw na himig. Ginamit ang “siklo” bilang transliterasyon ng sinaunang yunit, “handog” para sa sagradong ambag, at balanseng legal na hulma upang mapanatili ang paralelismo ng Hebreo.
