translation:
  language: tl
  text: At sinabi ni Moises, “Gaya ng sinabi mo[a], hindi ko na muling makikita ang iyong mukha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Kung paano mo sinabi” o “Mangyari ayon sa sinabi mo.”
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, literal na “Hindi na ako magdaragdag pang makita ang iyong mukha,” isang idyomang nangangahulugang “Hindi ko na muling makikita ang iyong mukha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive nang hindi dinaragdagan ang ugnayang pangyayari.
- source_word: מֹשֶׁה
  choice: Moises
  rationale: Karaniwang anyo ng pangalang Hebreo sa modernong saling Tagalog.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Tama ang sinabi mo
  rationale: Likas na pahayag ng pagsang-ayon sa Tagalog na nagpapahayag ng diwang ‘gayon ang sinabi mo’ nang hindi nilulutas nang labis ang puwersa ng כֵּן.
- source_word: לֹא אֹסִף עוֹד
  choice: Hindi ko na muling
  rationale: Ipinahahayag ang Hebreong idyoma ng hindi na pagdaragdag o pag-uulit ng kilos; natural ito sa Tagalog at hindi nagdaragdag ng diin na wala sa anyo ng teksto.
- source_word: רְאוֹת
  choice: makikita
  rationale: Ang pawatas na ‘makakita’ matapos ang idyomang יסף ay tumutukoy sa kilos na hindi na mauulit; ang anyong panghinaharap ay hinihingi ng konteksto.
- source_word: פָּנֶיךָ
  choice: ang iyong mukha
  rationale: Pinananatili ang kongkretong Hebreong pananalita sa halip na gawing ‘presensiya,’ na isang posibleng pagpapakahulugan lamang.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Tama ang sinabi mo” bilang natural na pagsang-ayon ni Moises, habang inilagay sa talababa ang mas pormal at mas literal na mga posibilidad. Pinanatili ang “iyong mukha” upang manatiling malapit sa kongkretong larawan ng Hebreo.
