  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: tl
  text: At iniunat ni Moises ang kanyang kamay patungo sa langit[a], at nagkaroon ng matinding kadiliman[b] sa buong lupain ng Ehipto sa loob ng tatlong araw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “patungo sa himpapawid.” Ang salitang Hebreo ay maaaring mangahulugang “langit” o “himpapawid,” depende sa konteksto.
    reason: lexical_alternative
  - marker: b
    text: O “pusikit na dilim.” Pinagtatambal sa Hebreo ang “kadiliman” at isa pang salitang tumutukoy sa matindi o pusikit na dilim upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: iniunat
  rationale: Ang נטה sa konteksto ng pagkumpas ay nangangahulugang iunat o iabot; natural sa Tagalog ang “iniunat” at malinaw na pinananatili ang pisikal na kilos.
- source_word: יָדוֹ
  choice: ang kanyang kamay
  rationale: Karaniwang tumutukoy ang יָד sa kamay, at walang dahilan sa konteksto upang palawakin ito bilang braso.
- source_word: עַל הַשָּׁמַיִם
  choice: patungo sa langit
  rationale: Bagaman madalas na nangangahulugang “sa ibabaw ng” ang עַל, maaari itong magpahiwatig ng direksiyon kasunod ng kilos ng pag-uunat. Maaaring tumukoy ang הַשָּׁמַיִם sa langit o himpapawid; “langit” ang natural at dignified na pangunahing salin.
- source_word: וַיְהִי
  choice: at nagkaroon
  rationale: Ipinakikilala rito ng anyo ng היה ang kalagayang bunga ng kilos. Natural sa Tagalog ang “nagkaroon” para sa pagdating ng kadiliman.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: napakadilim na kadiliman
  rationale: Pinagtatambal ng Hebreo ang dalawang katawagan para sa dilim upang magbigay-diin sa tindi nito. Pinananatili ng parirala ang pag-uulit at intensipikasyon nang hindi ginagawang pisikal na “makapal” ang kadiliman.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: sa buong lupain ng Ehipto
  rationale: Tuwirang inilalarawan ng בְּכָל ang saklaw na nasa buong lupain; ang “lupain ng Ehipto” ay natural at tapat na katumbas ng אֶרֶץ מִצְרַיִם.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: sa loob ng tatlong araw
  rationale: Nililinaw ng “sa loob ng” ang durasyong ipinahihiwatig ng Hebreo at natural itong pakinggan sa Tagalog.
