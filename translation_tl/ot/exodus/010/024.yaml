base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: tl
  text: Pagkatapos, tinawag ng Faraon si Moises at sinabi, “Humayo kayo at paglingkuran ninyo si Yahweh. Ang inyong mga kawan at bakahan lamang ang maiiwan[a]; pati ang inyong maliliit na anak[b] ay maaaring sumama sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “iiwan.”
    reason: lexical_alternative
  - marker: b
    text: O “mga anak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: tinawag ng Faraon si Moises
  rationale: Likas na salin sa Tagalog ng pagtawag kay Moises upang kausapin siya; hindi nito idinaragdag ang mas pormal na diwa ng isang opisyal na pagpapatawag.
- source_word: לְכוּ עִבְדוּ אֶת יְהוָה
  choice: Humayo kayo at paglingkuran ninyo si Yahweh
  rationale: Pinananatili ng “paglingkuran” ang mahalagang tema sa Exodo na ang Israel ay maglilingkod kay Yahweh sa halip na sa Faraon; maaari ring saklawin ng pandiwa ang pagsamba.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: רַק
  choice: lamang
  rationale: Malinaw at likas na ipinahahayag ang tanging kondisyong inilagay ng Faraon sa kaniyang pahintulot.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: ang inyong mga kawan at bakahan
  rationale: Ang “mga kawan” ay ang maliliit na alagang hayop, lalo na ang mga tupa at kambing, samantalang ang “bakahan” ay tumutukoy sa malalaking hayop, lalo na sa mga baka.
- source_word: יֻצָּג
  choice: maiiwan
  rationale: 'Ipinapakita ang pasibong/resultatibong diwa ng Hophal: ang mga hayop ay iiwan sa kinaroroonan, hindi basta kusang mananatili.'
- source_word: גַּם טַפְּכֶם
  choice: pati ang inyong maliliit na anak
  rationale: Ang “pati” ay naghahayag ng dagdag na pahintulot, at ang “maliliit na anak” ay pinananatili ang karaniwang diwa ng טַף bilang mga batang anak o maliliit na kasapi ng sambahayan.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: ay makakasama ninyo
  rationale: Likas na Tagalog para sa pahintulot na ang mga bata ay maaari ring humayo kasama ng mga nakatatanda.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong personal na pangalan at hindi pinapalitan ng titulong “PANGINOON.”
- issue: Diwa ng עבד kapag Diyos ang layon
  choice: paglingkuran
  alternative: sambahin
  rationale: Pinananatili ng “paglingkuran” ang mas malawak at mahalagang tunggalian sa Exodo tungkol sa kung sino ang paglilingkuran ng Israel, habang hindi inaalis ang posibleng konteksto ng pagsamba.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “Humayo” upang bumagay sa tuwirang utos at biblikal na salaysay, samantalang nananatiling natural ang kabuuang pangungusap. Lahat ng talababa ay may katugmang pananda sa pangunahing teksto.
