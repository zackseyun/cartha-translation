  source_fidelity: 'Tumpak sa kabuuan ang salin: naipapahayag nito ang pagtawag ng Faraon, ang utos na maglingkod kay Yahweh, ang paghihigpit tungkol sa mga hayop, at ang pahintulot na maisama ang mga bata. Gayunman, ang “makakasama ninyo” ay mas nagsasaad ng pagiging kasama kaysa ng pagpunta kasama nila; mas malinaw ang “maaaring sumama sa inyo.”'
  naturalness: Marangal at likas ang rehistro. Ang “mga kawan at bakahan” ay nauunawaan at angkop sa pagkakaiba ng maliliit at malalaking alagang hayop. Ang binagong pangwakas ay higit na tuwiran at natural sa modernong Tagalog.
