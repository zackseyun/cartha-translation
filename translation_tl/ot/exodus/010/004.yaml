  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: tl
  text: Sapagkat kung tatanggi kang paalisin ang aking bayan, narito, bukas ay magdadala ako ng mga balang[a] sa iyong nasasakupan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na אַרְבֶּה ay isahan sa anyo ngunit kolektibo ang gamit dito; kaya “mga balang.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “sa loob ng iyong mga hangganan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sapagkat kung
  rationale: Pinananatili nito kapuwa ang pag-uugnay sa naunang pahayag at ang kundisyong nagpapakilala sa babala.
- source_word: מָאֵן
  choice: tatanggi
  rationale: Ipinahihiwatig ng pandiwa ang kusang pagtanggi, hindi lamang pag-aatubili o kawalan ng kakayahan.
- source_word: לְשַׁלֵּחַ
  choice: paalisin
  rationale: Likas itong katumbas sa konteksto ng Exodo, kung saan hinihinging hayaang makaalis ang bayan.
- source_word: עַמִּי
  choice: aking bayan
  rationale: Pinananatili ang pag-aangkin at ang kolektibong diwa ng bayan ng Diyos sa natural at marangal na Tagalog.
- source_word: הִנְנִי
  choice: narito
  rationale: Pinananatili ang mariin at taimtim na pagpapakilala sa napipintong kilos nang hindi dinaragdagan ang kahulugan.
- source_word: מֵבִיא
  choice: magdadala ako
  rationale: Ang participle na kasama ng הִנְנִי ay nagpapahayag ng napipintong kilos; malinaw itong naipakikita ng anyong panghinaharap kasama ng “bukas.”
- source_word: מָחָר
  choice: bukas
  rationale: Tuwirang katumbas ng panandang pamanahon sa Hebreo.
- source_word: אַרְבֶּה
  choice: mga balang
  rationale: Bagaman isahan ang anyo sa Hebreo, kolektibo ang gamit nito rito; natural sa Tagalog ang maramihang “mga balang.”
- source_word: בִּגְבֻלֶךָ
  choice: sa iyong nasasakupan
  rationale: Sinasaklaw nito ang diwa ng hangganan o teritoryong pinamamahalaan, at ang “sa” ay likas kasunod ng “magdadala.”
