base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: tl
  text: Tinakpan ng mga balang ang ibabaw ng buong lupain[a], kaya dumilim ang lupain. Kinain nila ang lahat ng halaman sa lupain at ang lahat ng bunga ng mga punongkahoy na iniwan ng graniso. Walang anumang luntiang halaman na natira sa mga punongkahoy o sa mga halaman sa bukid sa buong lupain ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “mata ng buong lupain,” isang idyoma para sa nakikitang ibabaw ng lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Tinakpan ng mga balang
  rationale: Ang pandiwa ay isahan, kasunod ng kolektibong paksa sa konteksto. Sa natural na Tagalog, hayagang pinangalanan ang mga balang at ginamit ang maramihang pagtukoy.
- source_word: עֵין כָּל הָאָרֶץ
  choice: ang ibabaw ng buong lupain
  rationale: Literal na 'mata ng buong lupain'; isang idyoma para sa nakikitang ibabaw ng lupa. Ang 'ibabaw' ay malinaw at natural sa modernong Tagalog.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: kaya dumilim ang lupain
  rationale: Ipinahahayag ng pandiwa ang pagdidilim bilang bunga ng pagtakip ng mga balang; malinaw na inilalahad ng 'kaya' ang ugnayang ito.
- source_word: וַיֹּאכַל
  choice: Kinain nila
  rationale: Payak na kahulugan ng pandiwa ang 'kinain.' Ang 'nila' ay natural na tumutukoy sa mga balang bilang kolektibong paksa.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: ang lahat ng halaman sa lupain
  rationale: Mas malawak ang עֵשֶׂב kaysa 'damo' lamang at sumasaklaw sa mga halamang tumutubo sa lupa.
- source_word: כָּל פְּרִי הָעֵץ
  choice: ang lahat ng bunga ng mga punongkahoy
  rationale: Bagaman isahan ang anyong Hebreo ng 'punongkahoy,' kolektibo ang gamit nito rito; natural sa Tagalog ang maramihan.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: na iniwan ng graniso
  rationale: Tuwirang ipinapahayag na ito ang mga bungang hindi nawasak ng naunang salot na graniso.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: Walang anumang luntiang bagay na natira
  rationale: Pinananatili ang mariing pagtanggi at ang malawak at matingkad na diwa ng יֶרֶק bilang anumang bagay na luntian.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: sa mga punongkahoy o sa mga halaman sa bukid
  rationale: Ang waw sa ikalawang parirala ay natural na 'o' sa saklaw ng negatibong pangungusap. Ang mga kolektibong isahan ay isinalin bilang maramihan.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: sa buong lupain ng Ehipto
  rationale: Tapat at likas na salin ng karaniwang panteritoryong parirala.
