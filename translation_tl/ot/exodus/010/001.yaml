  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Pumunta ka sa Paraon, sapagkat pinatigas ko ang puso niya[a] at ang puso ng kanyang mga lingkod, upang mailagay ko sa gitna nila ang mga tanda kong ito[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “ginawa kong mabigat ang puso niya.” Ang idyoma ay nangangahulugang pinatigas ni Yahweh ang puso ni Paraon o ginawa niya itong hindi tumutugon.
    reason: lexical_alternative
  - marker: b
    text: Sa literal na Hebreo, “sa gitna niya.” Maaaring tumukoy ito kay Paraon mismo o, sa konteksto, kay Paraon kasama ang kanyang mga lingkod.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang Yahweh sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Tagalog ang “Pagkatapos, sinabi.”
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Pumunta ka sa Paraon
  rationale: Maaaring mangahulugan ang בוא na “pumaroon/pumasok”; malinaw at natural sa konteksto ng pagharap kay Paraon ang “Pumunta ka sa Paraon.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng utos at pinananatili ang marangal na antas ng pananalita.
- source_word: הִכְבַּדְתִּי
  choice: pinatigas ko
  rationale: Literal itong “ginawa kong mabigat,” ngunit ang idyoma tungkol sa puso ay tumutukoy sa pagpapatigas o paggawa nitong hindi tumutugon.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: ang puso niya at ang puso ng kanyang mga lingkod
  rationale: Pinananatili ang larawan ng “puso” bilang sentro ng kalooban at pag-iisip, pati ang pag-uulit nito sa Hebreo.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Saklaw ng salita ang mga naglilingkod kay Paraon; hindi nito sapilitang nililimitahan ang tinutukoy sa mga opisyal o mga alipin lamang.
- source_word: לְמַעַן
  choice: upang
  rationale: Malinaw na ipinahahayag ang layunin.
- source_word: שִׁתִי
  choice: mailagay ko
  rationale: Likas na katumbas ng “ilagay/itakda” at angkop sa mga tanda.
- source_word: אֹתֹתַי אֵלֶּה
  choice: ang mga tanda kong ito
  rationale: Pinananatili kapwa ang pagmamay-ari at ang pantukoy na “ito.”
- source_word: בְּקִרְבּוֹ
  choice: sa gitna nila
  rationale: Natural itong tumutukoy sa saklaw ni Paraon at ng kanyang mga lingkod sa konteksto, habang inilalahad sa talababa ang literal na anyong pang-isahan at ang tunay na kalabuan nito.
theological_decisions:
- issue: Ang pagpapatigas ng Diyos sa puso ni Paraon
  choice: pinatigas ko ang puso niya
  alternative: ginawa kong mabigat ang puso niya; ginawa kong matigas ang kanyang kalooban
  rationale: Tuwirang iniuukol ng talata kay Yahweh ang pagkilos. Hindi ito pinalalambot o ipinaliliwanag nang higit sa sinasabi ng teksto, kaya nananatili ang tensiyon hinggil sa pagkilos ng Diyos at pananagutan ng tao.
- issue: Ang saklaw ng mga tandang inilalagay בְּקִרְבּוֹ
  choice: sa gitna nila
  alternative: sa gitna niya
  rationale: Ang hulaping Hebreo ay pang-isahan, ngunit maaaring tumukoy kay Paraon bilang sentro ng kanyang sambahayan o hukuman. Pinili sa teksto ang natural na kontekstuwal na diwa at pinanatili sa talababa ang alternatibong pang-isahan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang personal na pangalang Yahweh, ang larawang “puso,” at ang tuwirang pag-uukol kay Yahweh ng pagpapatigas. Ginawang natural sa Tagalog ang direksiyon at layunin ng pangungusap, habang inilagay sa mga talababa ang mahahalagang literal na anyo at kalabuan.
