base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: tl
  text: upang maisalaysay mo sa pandinig ng iyong anak at ng iyong apo kung paano ko pinahirapan ang Ehipto[a], at ang aking mga tanda na inilagay ko sa kanila, at upang malaman ninyo na ako si Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kung paano ko hinamak ang Ehipto.” Maaaring idiin ng pandiwang Hebreo ang pagpapahiya sa Ehipto, gayundin ang mabigat na pakikitungo rito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “at malalaman ninyo na ako si Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: upang
  rationale: Malinaw at likas na ipinahahayag ang layuning kaugnay ng naunang utos.
- source_word: תְּסַפֵּר
  choice: maisalaysay mo
  rationale: Ang Piel ng ספר ay tumutukoy sa pagkukuwento o pagsasalaysay sa mga susunod na salinlahi; ang “maisalaysay” ay dignificado ngunit madaling maunawaan.
- source_word: בְּאָזְנֵי
  choice: sa pandinig ng
  rationale: Pinananatili nito ang larawang Hebreo na literal na “sa mga tainga ng,” nang hindi nagiging pilit sa Tagalog.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: iyong anak at iyong apo
  rationale: Ang “apo” ang likas na katumbas ng literal na “anak ng iyong anak” at pinananatili ang diin sa mga salinlahi.
- source_word: הִתְעַלַּלְתִּי
  choice: pinahirapan ko
  rationale: Ipinahahayag nito ang mabigat at mapanghamak na ginawa ng Diyos laban sa Ehipto sa konteksto ng mga salot, habang inilalagay sa talababa ang posibleng diin sa pagpapahiya.
- source_word: בְּמִצְרַיִם
  choice: ang Ehipto
  rationale: Sa Tagalog, likas na ginagawang tuwirang layon ng “pinahirapan” ang Ehipto; pinananatili rin nito ang kolektibong pagtukoy ng Hebreo.
- source_word: אֹתֹתַי
  choice: aking mga tanda
  rationale: Tuwirang katumbas ito ng אותות at hindi nagdaragdag ng salitang “milagroso” na hindi hayag sa pangngalan.
- source_word: שַׂמְתִּי בָם
  choice: inilagay ko sa kanila
  rationale: Pinananatili ang kongkretong pandiwang “inilagay” at ang malawak na saklaw ng pang-ukol, sa halip na ipakahulugang “ginawa” o “isinagawa.”
- source_word: וִידַעְתֶּם
  choice: at upang malaman ninyo
  rationale: Ipinagpapatuloy nito ang layuning sinimulan ng לְמַעַן; pinananatili sa talababa ang posibleng pagbasa bilang resulta o pangyayari sa hinaharap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Ang diwa ng הִתְעַלַּלְתִּי tungkol sa Ehipto
  choice: kung paano ko pinahirapan ang Ehipto
  alternative: kung paano ko hinamak ang Ehipto
  rationale: Sa konteksto, saklaw ng pandiwa ang mabigat na pagtrato sa Ehipto at maaari ring idiin ang pagpapahiya rito. Iniiwasan ng pangunahing salin na paliitin ang diwa sa panunuya lamang, habang pinananatili ng talababa ang tunay na alternatibo.
- issue: Layunin o resulta sa וִידַעְתֶּם
  choice: at upang malaman ninyo
  alternative: at malalaman ninyo
  rationale: Ang pagbasa bilang patuloy na layunin ang pinakamalapit sa daloy mula sa לְמַעַן, ngunit maaari ring marinig ang sugnay bilang magiging resulta; kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago at dignifikadong Tagalog. Pinanatili ang larawang “sa pandinig ng” at ang personal na pangalang Yahweh, habang ginawang likas ang mga ugnayang pampamilya at ang layuning ipinahahayag ng talata.
