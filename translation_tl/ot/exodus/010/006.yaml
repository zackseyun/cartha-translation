  to: “Pupunuin ng mga ito ang iyong mga bahay, ang mga bahay ng lahat ng iyong mga lingkod, at lahat ng bahay sa Ehipto—isang bagay na hindi pa nakita[a] ng iyong mga ninuno ni ng mga ninuno ng iyong mga ninuno, mula nang sila'y nasa lupa[b] hanggang sa araw na ito.” Pagkatapos, tumalikod siya at umalis mula sa harapan ni Faraon.
