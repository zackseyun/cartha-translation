base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: tl
  text: “Pupunuin ng mga ito ang iyong mga bahay, ang mga bahay ng lahat ng iyong mga lingkod, at lahat ng bahay sa Ehipto—isang bagay na hindi pa nakita[a] ng iyong mga ninuno ni ng mga ninuno ng iyong mga ninuno, mula nang sila'y nasa lupa[b] hanggang sa araw na ito.” Pagkatapos, tumalikod siya at umalis mula sa harapan ni Faraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa mas literal na ayos: “na hindi nakita ng iyong mga ninuno ni ng mga ninuno ng iyong mga ninuno.” Ang sugnay ay tumutukoy sa walang-katulad na salot na inilalarawan.'
    reason: lexical_alternative
  - marker: b
    text: Ang “lupa” ay maaari ring isalin na “daigdig” o “ibabaw ng lupa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Pupunuin ng mga ito
  rationale: Ang pandiwa ay nagpapatuloy sa hinaharap na babala sa naunang talata; ang tinutukoy ng “mga ito” ay ang mga balang. Pinananatili nitong aktibo ang kilos nang hindi inuulit ang pangngalan na nasa konteksto.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: ang iyong mga bahay, ang mga bahay ng lahat ng iyong mga lingkod, at ang mga bahay sa buong Ehipto
  rationale: Pinananatili ang tatlong ulit na “mga bahay” at ang papalawak na saklaw mula sa Faraon, sa kaniyang mga lingkod, hanggang sa buong Ehipto.
- source_word: עֲבָדֶיךָ
  choice: iyong mga lingkod
  rationale: Maaaring tumukoy sa mga tagapaglingkod o opisyal ng hari. Ang “mga lingkod” ang pinakamalapit at hindi nagpapasya nang labis tungkol sa kanilang tiyak na katayuan.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: isang bagay na hindi pa nakita
  rationale: Likas sa Tagalog ang pagdaragdag ng “isang bagay” upang malinaw na tumukoy ang sugnay sa pambihirang salot na inilarawan, habang pinananatili ang diwa ng tekstong Hebreo.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: iyong mga ninuno ni ng mga ninuno ng iyong mga ninuno
  rationale: Ang “mga ninuno” ay mas natural at mas malawak kaysa “mga ama” o “mga lolo,” sapagkat maraming nagdaang salinlahi ang saklaw ng pananalita.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: mula nang sila ay mabuhay sa lupa
  rationale: Natural na ipinahahayag sa Tagalog ang simula at pagpapatuloy ng pag-iral ng mga naunang salinlahi. Ang “lupa” ay sadyang nagpapanatili sa saklaw na maaaring lupain, daigdig, o ibabaw ng lupa ayon sa konteksto.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Pagkatapos, tumalikod siya at umalis sa harap ng Faraon
  rationale: Pinananatili ang dalawang magkasunod na kilos—pagtalikod at pag-alis—at ang “sa harap ng Faraon” ay malinaw at marangal na paglalarawan ng pag-alis mula sa presensiya ng hari.
