    rationale: 'Maaaring mangahulugang mga bahay na nakalatag sa buong bansa, samantalang ang Hebreo ay ikatlong kaparehong construct na parirala: “mga bahay ng buong Ehipto.” Ang “lahat ng bahay sa Ehipto” ay malinaw na naghahatid ng kabuuang saklaw.'
  - severity: low
    issue: “mula nang sila ay mabuhay sa lupa”
    rationale: Ang “mabuhay” ay maaaring magpahiwatig ng aktibong pamumuhay ng tinutukoy na mga ninuno. Ang Hebreo ay tumutukoy sa panahon ng kanilang pag-iral/pagkakatao sa lupa; “mula nang sila'y nasa lupa” ay mas tuwiran at idiomatiko.
  - severity: medium
    issue: “umalis sa harap ng Faraon”
    rationale: Hindi natural ang “umalis sa harap ng” sa Tagalog at maaari itong magpahiwatig ng pag-alis habang nasa harapan pa rin. Ang מֵעִם ay pag-alis mula sa pakikipagharap o presensiya ni Faraon.
