translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Faraon” bilang karaniwang katawagan at pinanatili ang paulit-ulit na estruktura at tumitinding saklaw ng babala. Ang mga pananda ng talababa ay inilagay sa mismong mga pariralang kanilang ipinaliliwanag.
