  terminology: Ang “Yahweh,” “maglingkod,” at “Paraon” ay wasto at angkop sa marangal ngunit makabagong Filipino. Ang “hinihiling ninyo” ay mas malapit sa ipinahihiwatig na “inyong hinahanap/hinahangad” sa usaping kahilingan kaysa sa mas payak na “hinihingi ninyo.”
