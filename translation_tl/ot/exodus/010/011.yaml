base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: tl
  text: “Hindi![a] Ang mga lalaki[b] lamang ang humayo na at maglingkod kay Yahweh, sapagkat iyon ang hinihiling ninyo.” Pagkatapos, pinalayas niya sila mula sa harapan ng Paraon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi gayon!”—mas pormal na paglilipat sa biglaan at mariing pagtanggi ng Paraon.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay tumutukoy sa mga lalaki, hindi sa buong sambayanan.
    reason: lexical_clarification
lexical_decisions:
- source_word: לֹא כֵן
  choice: Hindi!
  rationale: Maikli at mariing pagtanggi ito sa naunang panukala. Pinananatili ng “Hindi!” ang biglaan at matigas na tono ng Paraon.
- source_word: לְכוּ נָא
  choice: humayo na
  rationale: Ang נָא ay maaaring magpalambot o magpahiwatig ng pagkaapurahan. Sa mapagtaboy na pananalita ng Paraon, likas na ipinahahayag ng “na” ang agarang pahintulot o utos.
- source_word: הַגְּבָרִים
  choice: kayong mga lalaki
  rationale: Tiyak na tumutukoy ang salita sa mga lalaki, hindi sa buong sambayanan. Pinananatili ito upang makita ang limitasyon ng pahintulot ng Paraon.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: at maglingkod kay Yahweh
  rationale: Ang עבד kapag Diyos ang layon ay maaaring mangahulugang maglingkod o sumamba. Pinananatili ng “maglingkod” ang mas malawak na diwang tipanan at akma rin sa hinihingi ni Moises.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang pangalang tipanan na יהוה sa halip na palitan ito ng isang titulo.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: sapagkat iyan ang hinihingi ninyo
  rationale: Ang pambabaeng panghalip ay tumutukoy sa ipinahihiwatig na kahilingan o bagay na hinahanap. Hindi tinutukoy nang higit sa sinasabi ng Hebreo ang antecedent nito.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Pagkatapos, itinaboy niya sila
  rationale: Ang isahang pandiwa ay may ipinahihiwatig na isahang gumagawa, na sa konteksto ay likas na nauunawaang ang Paraon. Ipinahahayag ng “itinaboy” ang puwersahang pagpapaalis.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: mula sa harapan ng Paraon
  rationale: Pinananatili nito ang kongkretong idyomang Hebreo at ang tagpo sa maharlikang hukuman, habang malinaw pa rin sa makabagong Filipino.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ang pangalang tipanan sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Ang limitasyong nakabatay sa kasarian sa alok ng Paraon
  choice: kayong mga lalaki
  alternative: kayo; ang mga tao; kayong lahat
  rationale: Espesipikong “mga lalaki” ang sinasabi ng Hebreo. Mahalaga ito sa banghay sapagkat bahagya lamang ang ipinahihintulot ng Paraon, hindi ang pag-alis ng buong sambayanan.
- issue: Ang hindi tahasang pinangalanang gumagawa ng pagpapataboy
  choice: itinaboy niya sila
  alternative: itinaboy sila ng Paraon; itinaboy sila
  rationale: Isahan ang pandiwang Hebreo ngunit hindi inuulit ang pangalan ng simuno. Pinananatili ng panghalip ang anyong iyon habang ipinahihiwatig ng konteksto na ang Paraon ang tinutukoy.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “humayo” upang bumagay sa pormal na tagpo at sa utos na umalis, samantalang ang “itinaboy” ay malinaw at karaniwan. Iniwasan ang “lamang” sa pangunahing teksto dahil bagaman malinaw sa konteksto ang paghihigpit, hindi ito hiwalay na salita sa Hebreo.
