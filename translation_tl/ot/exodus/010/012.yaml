revisions:
- from: Pagkatapos ay sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay sa lupain ng Ehipto upang dumating ang mga balang[a] sa lupain ng Ehipto at kainin ang lahat ng halaman sa lupain—ang lahat ng iniwan ng graniso.”
  to: Pagkatapos ay sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay sa ibabaw ng lupain ng Ehipto, tungkol sa mga balang,[a] upang dumagsa ang mga ito sa ibabaw ng lupain ng Ehipto at kainin ang lahat ng halaman sa lupain—lahat ng iniwan ng graniso.”
  rationale: Nilinaw ang spatial na “sa ibabaw ng” para sa dalawang paglitaw ng עַל. Ang “tungkol sa mga balang” ay maingat na salin ng di-tiyak na pang-ukol bago ang אַרְבֶּה at hindi ipinipilit ang isang pinagtatalunang kahulugan. Inilipat ang marker sa pariralang tinutukoy nito. Ang “dumagsa” ay nagpapahayag ng kolektibong pagdating at paglaganap ng mga balang nang hindi nagdaragdag ng doktrinal o historikal na paliwanag.
