  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay sa ibabaw ng lupain ng Ehipto, tungkol sa mga balang,[a] upang dumagsa ang mga ito sa ibabaw ng lupain ng Ehipto at kainin ang lahat ng halaman sa lupain—lahat ng iniwan ng graniso.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sa/may kaugnayan sa balang”; mahirap tiyakin ang tiyak na diwa ng pang-ukol, at maaari rin itong isaling “laban sa” o “sa ibabaw ng mga balang.” Isahan ang “balang” at ang mga kaugnay na pandiwa sa Hebreo, ngunit ginagamit ito bilang kolektibong tawag sa kuyog ng mga balang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: נְטֵה יָדְךָ
  choice: Iunat mo ang iyong kamay
  rationale: Tuwiran at likas na salin ng utos; ang נטה ay nangangahulugang iunat o iabot.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: sa lupain ng Ehipto
  rationale: Sa Filipino, natural na ipinapahayag ng “sa” ang saklaw o direksiyon ng kilos; pinanatili ang “lupain” at ang pag-uulit ng parirala.
- source_word: בָּאַרְבֶּה
  choice: upang dumating ang mga balang
  rationale: Mahirap tiyakin ang tiyak na gamit ng pang-ukol בְּ dito. Isinalin ayon sa malinaw na layon sa konteksto, ngunit itinabi sa talababa ang tunay na kalabuan.
- source_word: אַרְבֶּה
  choice: mga balang
  rationale: Isahan ang anyong Hebreo ngunit kolektibo ang kahulugan, kaya natural sa Filipino ang maramihang “mga balang.”
- source_word: וְיַעַל
  choice: dumating
  rationale: Ang עלה ay literal na “umakyat,” ngunit sa kontekstong pagdating at paglaganap ng mga balang sa lupain, mas natural sa Filipino ang “dumating.”
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: lahat ng halaman sa lupain
  rationale: Malawak ang saklaw ng עֵשֶׂב at hindi lamang damo; ang “halaman” ay malinaw at angkop sa pagkawasak ng pananim.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: ang lahat ng iniwan ng graniso
  rationale: Pinananatili ang ugnayan sa naunang salot at ang payak na diwa ng “iniwan” o “itinira.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang personal na pangalan sa tekstong Hebreo nang hindi ito pinapalitan ng titulo o nilalagyan ng karagdagang doktrinal na pagpapakahulugan.
- issue: Kolektibong isahan ng אַרְבֶּה at ng mga pandiwa nito
  choice: mga balang na may pandiwang tumutukoy sa maramihan
  alternative: isang kolektibong “balang” o “kawan ng mga balang”
  rationale: Kolektibo ang isahang anyo sa Hebreo. Mas natural at malinaw sa Filipino ang “mga balang,” nang hindi binabago ang tinutukoy na salot.
translation_notes:
  register: Makabagong, malinaw, at marangal na Filipino. Ginamit ang “Ehipto,” “balang,” at “graniso,” na pamilyar sa karaniwang mambabasa. Pinagsama sa iisang talababa ang magkaugnay na suliranin sa בָּאַרְבֶּה at ang kolektibong isahan, at inilagay ang marker sa mismong teksto.
