  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: tl
  text: Sinabi sa kanya ng mga lingkod ng Faraon, “Hanggang kailan magiging bitag sa atin ang taong ito?[a] Paalisin mo ang mga lalaki upang makapaglingkod sila kay Yahweh na kanilang Diyos.[b] Hindi mo pa ba alam na wasak na ang Ehipto?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang isang ito”; tumutukoy kay Moises ang demonstratibo sa Hebreo. Maaari ring isalin ang “bitag” na “patibong.”
    reason: lexical_alternative
  - marker: b
    text: Ang pandiwang “maglingkod” ay maaari ring magpahiwatig ng pagsamba kapag Diyos ang pinaglilingkuran. Ang “Yahweh” ay pagsasatitik ng banal na pangalang YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: mga lingkod
  rationale: Tuwirang katumbas ito ng mga naglilingkod sa Faraon; maaaring mga opisyal sila sa konteksto, ngunit hindi kailangang gawing mas tiyak ang salin kaysa sa Hebreo.
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Likas at tuwirang pahayag sa Filipino para sa temporal na tanong at pagsaway.
- source_word: זֶה
  choice: ang taong ito
  rationale: Ang demonstratibo ay tumutukoy kay Moises; idinagdag ang “tao” upang maging natural sa Filipino habang pinananatili ang tinutukoy ng konteksto.
- source_word: לְמוֹקֵשׁ
  choice: bitag
  rationale: Pinananatili nito ang metapora ng isang patibong o bitag na nagdudulot ng kapahamakan.
- source_word: שַׁלַּח
  choice: Paalisin mo
  rationale: Ipinahahayag nito ang utos na payagang umalis o paalisin ang mga lalaki, ayon sa sintaks ng talata.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Tiyak na panlalaking maramihan ang pangngalan sa Hebreo; hindi ito pinalawak tungo sa mas pangkalahatang “mga tao.”
- source_word: וְיַעַבְדוּ
  choice: upang makapaglingkod sila
  rationale: Ang pandiwa ay maaaring sumaklaw sa paglilingkod at pagsamba sa Diyos; “maglingkod” ang mas tuwirang katumbas at pinananatili ang lawak ng kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik nito ang banal na pangalang YHWH sa halip na palitan ng isang titulo.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Hindi mo pa ba alam
  rationale: Natural na Filipino para sa retorikal na pagsaway na nasa Hebreo.
- source_word: אָבְדָה
  choice: wasak na
  rationale: Ipinakikita nito ang naganap nang kalagayan ng Ehipto bunga ng mga salot nang hindi kinakailangang magpahiwatig ng ganap na pagkalipol.
- source_word: מִצְרָיִם
  choice: Ehipto
  rationale: Karaniwang pangalang Filipino para sa lupain at bansang tinutukoy.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinanatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng עבד kapag Diyos ang pinaglilingkuran
  choice: maglingkod
  alternative: sumamba
  rationale: Maaaring kabilang sa pandiwa ang pagsamba, ngunit mas malawak ang “maglingkod” at hindi nito nilulutas nang labis ang tunay na saklaw ng salitang Hebreo.
- issue: Kasarian ng הָאֲנָשִׁים
  choice: mga lalaki
  alternative: mga tao
  rationale: Panlalaking maramihan ang salitang Hebreo, kaya pinanatili ang espesipikong kasarian sa pangunahing teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang matalim na pagsaway ng mga lingkod ng Faraon, ang metapora ng bitag, ang panlalaking anyo ng “mga lalaki,” at ang posibleng saklaw na paglilingkod/pagsamba ng pandiwa.
