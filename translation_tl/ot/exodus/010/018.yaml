  source_fidelity: Ang “taimtim na nakiusap kay Yahweh” ay wastong naghahatid ng וַיֶּעְתַּר אֶל־יְהוָה bilang marubdob na pagsusumamo. Gayunman, ang “umalis siya sa harapan ng Faraon” ay maaaring mangahulugang umalis siya habang nasa harapan ng Faraon, sa halip na malinaw na pag-alis mula sa kaniya. Ang מֵעִם ay dapat ipahayag bilang “mula kay Faraon.”
  naturalness: Natural at angkop sa modernong Filipino ang “Kaya umalis siya mula kay Faraon at taimtim na nakiusap kay Yahweh.” Pinananatili nito ang payak, marangal na register ng salaysay.
