  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: tl
  text: Kaya umalis siya mula kay Faraon at taimtim na nakiusap kay Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nanalangin nang taimtim kay Yahweh” o “nagsumamo kay Yahweh.” Ang pandiwang Hebreo ay nagpapahiwatig ng taimtim at marubdob na pakiusap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: umalis
  rationale: Ang Qal wayyiqtol ng יצא ay nagsasaad ng paglabas o pag-alis at nagpapatuloy sa sunod-sunod na kilos sa salaysay.
- source_word: מֵעִם פַּרְעֹה
  choice: sa harapan ng Faraon
  rationale: Ang מֵעִם ay literal na paghihiwalay mula sa pagiging kasama ng isang tao; sa konteksto, likas na ipinahahayag ng pariralang ito ang pag-alis mula sa presensiya ng Faraon.
- source_word: וַיֶּעְתַּר
  choice: taimtim na nakiusap
  rationale: Ang עתר ay nagpapahiwatig ng marubdob o taimtim na pagsusumamo, dito ay nakatuon sa Diyos. Pinananatili ng salin ang diin ng pandiwa nang hindi dinaragdagan ang nilalaman.
- source_word: אֶל
  choice: kay
  rationale: Ang אֶל ay tumutukoy sa pinatutunguhan ng pagsusumamo; ang “kay” ang natural na anyo sa Filipino kasama ng “nakiusap.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng personal na pangalang banal na nakasulat sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Ginagamit mismo ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan at iniiwasang palitan ito ng titulong “PANGINOON.”
- issue: Lakas ng kahulugan ng עתר
  choice: taimtim na nakiusap
  alternative: nanalangin nang taimtim; nagsumamo
  rationale: May diwa ang pandiwa ng masidhing pagsusumamo, ngunit hindi kailangang ipakahulugan nang higit pa kung ang kilos ay tatawaging pormal na panalangin o pakikiusap; inilalahad sa talababa ang mga lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “sa harapan ng Faraon” upang malinaw na maipahayag ang pag-alis mula sa presensiya niya, at “taimtim na nakiusap” upang mapanatili ang lakas ng pandiwang Hebreo.
