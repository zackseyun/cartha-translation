  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Nawa’y sumainyo si Yahweh[a], kung sakaling payagan ko kayong umalis, pati ang inyong mga musmos! Tingnan ninyo[b], sapagkat nasa harapan ninyo ang kasamaan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “Sumainyo si Yahweh kapag pinaalis ko kayo pati ang inyong mga musmos,” na malamang ay sinabi nang may panunuya.'
    reason: alternative_reading
  - marker: b
    text: Hindi tiyak ang Hebreo. Maaari itong mangahulugang “kapahamakan ang nasa harapan ninyo” o “masama ang inyong binabalak.” Ang “Tingnan ninyo” ay maaari ring unawain bilang “Mag-ingat kayo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Sumainyo nga si Yahweh
  rationale: Pinananatili ng “sumainyo” ang paghiling na ipinahihiwatig ng jussive יְהִי, at hinahayaan ng “nga” na marinig sa konteksto ang mapanuyang himig ni Paraon nang hindi ito tahasang idinaragdag sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang pangalang Yahweh bilang tuwirang transliterasyon ng banal na pangalan.
- source_word: כַּאֲשֶׁר
  choice: kung talagang
  rationale: Sa mapanlaban at mapanuyang pahayag ni Paraon, ang parirala ay may kondisyunal na puwersa. Ang “kung talagang” ay natural sa Tagalog at hindi ipinapalagay na tiyak niyang pahihintulutan silang umalis.
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  choice: paaalisin ko kayo pati ang maliliit ninyong anak
  rationale: Ang שׁלח sa salaysay ng Exodo ay tumutukoy sa pagpapayaong umalis. Ang טַף ay higit na tumutukoy sa maliliit na anak kaysa sa lahat ng kasambahay.
- source_word: רְאוּ
  choice: Tingnan ninyo
  rationale: Isinasalin ang literal na pandiwang “tingnan” habang ang konteksto at talababa ay nagpapahiwatig na maaari rin itong gumana bilang babala.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: sapagkat nasa harapan ninyo ang kasamaan
  rationale: 'Pinananatili ang matipid at di-tiyak na larawan ng Hebreo: maaaring tumukoy ang רָעָה sa masamang balak o sa kapahamakang nakaamba, at ang נֶגֶד פְּנֵיכֶם ay literal na “nasa harapan ninyo.”'
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah / PANGINOON
  rationale: Pinananatili ang sariling pangalan sa Hebreo sa halip na palitan ito ng titulo.
- issue: Ang di-tiyak na kahulugan ng huling babala ni Paraon
  choice: nasa harapan ninyo ang kasamaan
  alternative: kapahamakan ang naghihintay sa inyo / masama ang binabalak ninyo
  rationale: Hindi nilulutas sa pangunahing teksto kung nagbabanta si Paraon ng kapahamakan o nagpaparatang na may masamang balak sina Moises; kapuwa pinahihintulutan ng Hebreo.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “maliliit ninyong anak” upang maging malinaw ang טַף, at pinanatili ang bahagyang di-karaniwang larawan na “nasa harapan ninyo ang kasamaan” upang huwag burahin ang tunay na kalabuan ng Hebreo.
