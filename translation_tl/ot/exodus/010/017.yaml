  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: tl
  text: At ngayon, pakiusap, patawarin ninyo ang kasalanan ko[a] sa pagkakataong ito lamang. Magsumamo kayo kay Yahweh na inyong Diyos, upang alisin niya sa akin ang kamatayang ito lamang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring ‘alisin ninyo ang kasalanan ko’ o ‘pagpaumanhinan ninyo ang kasalanan ko.’ Sa idyomang Hebreo, literal na ginagamit ang pandiwang ‘buhatin’ o ‘dalhin’ na ang layon ay ‘kasalanan.’
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “ang kamatayang ito.” Malamang na tinutukoy ni Faraon ang kasalukuyang nakamamatay na salot at ang mga epekto nito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at temporal na diwa ng Hebreo habang likas na ipinakikilala ang apurahang pakiusap ni Faraon.
- source_word: שָׂא נָא חַטָּאתִי
  choice: pakiusap, patawarin ninyo ang kasalanan ko
  rationale: Ang נָשָׂא ay literal na ‘buhatin/dalhin,’ ngunit kapag kasalanan ang layon, idyomatiko itong tumutukoy sa pagpapatawad o pag-aalis ng sala. Ipinahahayag ng ‘pakiusap’ ang נָא, at pinananatili ng ‘ninyo’ ang maramihang utos.
- source_word: אַךְ הַפַּעַם
  choice: sa pagkakataong ito lamang
  rationale: Tumpak na inihahayag ang paghihigpit ni Faraon sa partikular na pagkakataong ito.
- source_word: וְהַעְתִּירוּ
  choice: Magsumamo kayo
  rationale: Ipinahahayag ang taimtim at apurahang pananalangin sa Diyos; pinananatili rin ang maramihang anyo ng pandiwa.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: kay Yahweh na inyong Diyos
  rationale: Pinananatili ang personal na pangalang יהוה bilang ‘Yahweh’ at ang mapaglayong pananalita ni Faraon na ‘inyong Diyos.’
- source_word: וְיָסֵר מֵעָלַי
  choice: upang alisin ... niya sa akin
  rationale: Ipinakikita ang layunin o inaasahang bunga ng kanilang pagsusumamo at natural na isinasalin ang Hebreong pariralang nangangahulugang pag-aalis mula sa ibabaw o laban sa kaniya.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: alisin man lamang niya sa akin ang kamatayang ito
  rationale: Ang ‘man lamang’ ay nagpapanatili sa naghihigpit at nakikiusap na puwersa ng רַק, samantalang ang ‘kamatayang ito’ ay hindi nagpapaliit sa tunay na kalabuan ng literal na pananalita.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: ang PANGINOON; Jehova
  rationale: Pangalan mismo ng Diyos ang ginamit sa Hebreo. Pinananatili ng ‘Yahweh’ ang katangian nito bilang personal na pangalang tipan nang hindi ito pinapalitan ng isang titulo.
- issue: Tinutukoy ng ‘kamatayang ito’
  choice: Panatilihin sa pangunahing teksto ang literal at malabong ‘kamatayang ito’
  alternative: nakamamatay na salot; salot na ito
  rationale: Malamang na tinutukoy ni Faraon ang kasalukuyang salot ng mga balang at ang nakamamatay na pinsala nito, ngunit ‘kamatayan’ mismo ang salita ng teksto. Hindi dapat tahimik na gawing mas tiyak ang kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maramihang ‘ninyo/kayo’ dahil maramihan ang mga utos sa Hebreo, at iniwasan ang labis na arkaikong pananalita. Inilagay ang mga talababa sa mismong mga pariralang nililinaw ng mga ito.
