translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal ang himig. Ginamit ang “lupain” upang mapanatili ang heograpikong diwa ng הָאָרֶץ, at iniwasan ang sobrang literal na “mata ng lupain” sa pangunahing teksto habang inilagay ito sa talababa.
