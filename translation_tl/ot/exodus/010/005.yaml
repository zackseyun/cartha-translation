  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: tl
  text: Tatakpan nito ang ibabaw ng lupain[a], kaya hindi na makikita ng sinuman ang lupain. Kakainin nito ang lahat ng nalabi na hindi nasira ng graniso at naiwan pa para sa inyo[b], at kakainin nito ang bawat punong tumutubo sa inyong bukid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal, “mata ng lupain,” isang idyomang Hebreo para sa nakikitang ibabaw ng lupain.
    reason: lexical_alternative
  - marker: b
    text: O kaya, “ang nalalabing nakaligtas, na natira para sa inyo mula sa graniso.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: Tatakpan nito
  rationale: Ang pandiwang כסה ay nangangahulugang “takpan” o “itago.” Ginamit ang panghinaharap dahil ipinahahayag ni Moises ang darating na salot. Ang “nito” ay nagpapanatili sa kolektibong isahan na tumutukoy sa kuyog ng mga balang.
- source_word: עֵין הָאָרֶץ
  choice: ang ibabaw ng lupain
  rationale: Literal itong “mata ng lupain,” isang idyomang Hebreo para sa nakikitang ibabaw ng lupain. Ang “ibabaw ng lupain” ay malinaw at likas sa modernong Tagalog.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: kaya hindi na makikita ng sinuman ang lupain
  rationale: Ang Hebreo ay gumagamit ng di-tiyak na isahang simuno, “hindi niya makakayang makita.” Ang “ng sinuman” ay likas na paraan sa Tagalog upang ipahayag ang di-tiyak na tagamasid nang hindi ginagawang simuno ang lupain.
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: ang nalalabi sa nakaligtas sa graniso na naiwan para sa inyo
  rationale: Pinananatili ng “nalalabi sa nakaligtas” ang magkapatong na diwa ng nalabing bahagi at ng anumang nakaiwas sa pagkawasak. Sa konteksto, tumutukoy ito sa mga pananim na hindi nasira ng graniso.
- source_word: כָּל הָעֵץ
  choice: ang bawat puno
  rationale: Maaaring kolektibo ang עֵץ, ngunit ang “bawat puno” ay angkop sa distributibong puwersa ng כָּל at natural sa Tagalog.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: tumutubo para sa inyo sa bukid
  rationale: Ang צמח ay “tumubo” o “sumibol.” Pinananatili ng “para sa inyo” ang לָכֶם, na maaaring magpahiwatig ng pag-aari o pakinabang; ang “sa bukid” ay natural na salin sa kontekstong agrikultural.
