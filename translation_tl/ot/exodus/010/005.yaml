  naturalness: Maayos ang kabuuang rehistro, ngunit ang gitnang parirala ay nangangailangan ng mas natural na Tagalog. Ang “sa inyong bukid” ay isang likas na paraan upang ihatid ang pakinabang o pag-uugnay na nasa לָכֶם sa kontekstong pang-agrikultura.
