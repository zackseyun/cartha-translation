  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: tl
  text: Ngunit pinatigas[a] ni Yahweh ang puso ng Paraon, at hindi pinayagan ni Paraon na umalis ang mga anak ni Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “pinatatag” o “pinalakas”; literal na nangangahulugan ang pandiwang Hebreo na “ginawang matatag/malakas.”
    reason: lexical_alternative
  - marker: b
    text: O “mga Israelita”; literal na “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: pinatigas
  rationale: Ang חזק ay literal na tumutukoy sa pagpapalakas o pagpapatatag. Sa paulit-ulit na pormula tungkol sa Paraon sa salaysay ng Exodo, natural at matimbang sa Filipino ang “pinatigas,” habang inilalahad sa talababa ang mas literal na mga alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לֵב
  choice: puso
  rationale: Pinananatili ng “puso” ang idyomang Hebreo na sumasaklaw sa kalooban, pasiya, at panloob na disposisyon.
- source_word: פַּרְעֹה
  choice: Paraon
  rationale: Ito ang likas at kinikilalang anyong Filipino ng titulong maharlika.
- source_word: שִׁלַּח
  choice: pinayagang umalis
  rationale: Bagaman ang שלח ay maaaring mangahulugang “magpaalis” o “magpalaya,” ang “pinayagang umalis” ang natural na Filipino sa konteksto ng pagtanggi ng Paraon na paalisin ang Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang hayag na pananalitang pampamilya ng Hebreo; nililinaw sa talababa na tumutukoy ito sa mga Israelita.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagpapatigas ng puso ng Paraon
  choice: pinatigas ni Yahweh ang puso ng Paraon
  alternative: pinatatag ni Yahweh ang puso ng Paraon
  rationale: Tahasang iniuukol ng Hebreo kay Yahweh ang pagkilos. Hindi ito pinalalambot o ipinapaliwanag nang lampas sa talata, kaya nananatili ang tensiyon sa pagitan ng pagkilos ng Diyos at pananagutan ng Paraon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang biblikal na idyomang “puso” at ang pampamilyang katawagang “mga anak ni Israel,” ngunit gumamit ng natural na pariralang “pinayagang umalis” para sa kilos ng pagpapalaya.
