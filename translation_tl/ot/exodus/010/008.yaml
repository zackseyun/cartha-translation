language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יּוּשַׁ֞ב אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ אֶל פַּרְעֹ֔ה וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם מִ֥י וָ/מִ֖י הַ/הֹלְכִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: tl
  text: Kaya ibinalik sina Moises at Aaron sa Paraon, at sinabi niya sa kanila, “Humayo kayo at paglingkuran ninyo si Yahweh na inyong Diyos. Sino-sino ang mga pupunta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: ibinalik
  rationale: 'Ang Hophal ng שׁוב ay causative-passive: pinabalik o ibinalik sina Moises at Aaron. Likas sa Tagalog ang pandiwang “ibinalik,” at hindi nito tinutukoy kung sino ang gumawa nito, gaya rin ng Hebreo.'
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: sina Moises at Aaron
  rationale: Ginamit ang pantukoy na “sina” para sa tambalang tuwirang layon na mga pangalang pantangi.
- source_word: אֶל פַּרְעֹה
  choice: sa Paraon
  rationale: Ipinahihiwatig ng אֶל ang paglapit o pagbabalik sa kinaroroonan ng Paraon; natural itong ipahayag sa Tagalog bilang “sa Paraon.”
- source_word: לְכוּ
  choice: Humayo kayo
  rationale: Tuwirang pautos ng הלך. Ang “humayo” ay marangal ngunit malinaw at angkop sa biblikal na salaysay.
- source_word: עִבְדוּ
  choice: paglingkuran ninyo
  rationale: Saklaw ng עבד ang paglilingkod sa Diyos, kabilang ang pagsamba. Pinananatili ng “paglingkuran” ang mas malawak na kahulugan kaysa sa “sambahin” lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi bilang isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Tuwirang ipinapahayag ang hulaping panghalip na ikalawang panauhang maramihan.
- source_word: מִי וָמִי
  choice: Sino-sino
  rationale: Ang inuulit na tanong na “sino at sino” ay humihingi ng tiyak na pagtukoy sa lahat ng mga taong pupunta. Likas na katumbas nito sa Tagalog ang “sino-sino.”
- source_word: הַהֹלְכִים
  choice: ang mga pupunta
  rationale: Ang participle na may pantukoy ay substantibo, “ang mga pupunta.” Ang aspektong panghinaharap ay natural sa konteksto ng pahintulot na hinihingi.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalang iyon sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng עבד sa paglilingkod sa Diyos
  choice: paglingkuran
  alternative: sambahin
  rationale: Maaaring kabilang sa paglilingkod ang pagsamba, ngunit hindi kailangang limitahan sa gawaing panliturhiya ang salita. Pinananatili ng “paglingkuran” ang lawak ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal na himig. Ginamit ang “Humayo” bilang malinaw na pautos at ang likas na idyomang “Sino-sino” upang mapanatili ang mapagtukoy na diin ng מִי וָמִי nang hindi nangangailangan ng talababa.
