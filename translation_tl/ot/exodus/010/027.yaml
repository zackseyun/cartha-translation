  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: tl
  text: Ngunit pinatigas ni Yahweh ang puso ng Faraon[a], at ayaw niyang paalisin sila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ginawang matatag ni Yahweh ang puso ng Faraon.” Ang pandiwang Hebreo ay maaaring mangahulugang “palakasin” o “gawing matatag,” ngunit sa kontekstong ito ay may diwang “patigasin.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tumanggi siyang paalisin sila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: pinatigas
  rationale: Ang חזק ay maaaring mangahulugang “palakasin” o “gawing matatag,” ngunit sa paulit-ulit na pormula tungkol sa puso ng Faraon, natural na ipinahahayag ng “pinatigas” ang pagpapatibay ng kanyang pagtutol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לֵב
  choice: puso
  rationale: Pinananatili ang biblikal na idyoma; dito, saklaw ng “puso” ang kalooban at paninindigan.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Ito ang karaniwang anyong Filipino ng titulong Hebreo para sa hari ng Ehipto.
- source_word: לֹא אָבָה
  choice: ayaw niyang
  rationale: Tuwirang ipinahahayag nito ang kawalan ng pagpayag o pagkukusa, nang hindi ginagawang tahasang sanhi ng ikalawang sugnay ang una.
- source_word: לְשַׁלְּחָם
  choice: paalisin sila
  rationale: Sa konteksto ng Exodo, tumutukoy ito sa pagpapahintulot na makaalis ang mga Israelita; natural at maikli ang “paalisin sila” sa Filipino.
theological_decisions:
- issue: Pagpapatigas ng Diyos at sariling kalooban ng Faraon
  choice: Tuwirang sabihing pinatigas ni Yahweh ang puso ng Faraon at ayaw ng Faraon na paalisin sila.
  alternative: “Ginawang matatag ni Yahweh ang puso ng Faraon, kaya tumanggi siyang paalisin sila.”
  rationale: Tahasan sa Hebreo ang pagkilos ni Yahweh at ang kawalan ng pagpayag ng Faraon. Pinananatili ng salin ang tensiyong ito at hindi nagdaragdag ng ugnayang sanhi sa pamamagitan ng “kaya.”
translation_notes:
  register: Modernong Filipino na natural, marangal, at madaling maunawaan. Ginamit ang “Ngunit” para sa panimulang וַ sa kontekstong salungat, at pinanatili ang “puso” bilang malinaw na biblikal na idyoma.
