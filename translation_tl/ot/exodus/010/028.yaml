translation:
  language: tl
  text: 'At sinabi sa kanya ng Paraon, “Lumayo ka sa akin! Mag-ingat ka: huwag mo nang muling makita ang mukha ko[a], sapagkat sa araw na makita mo ang mukha ko[b], mamamatay ka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “huwag ka nang magpatuloy sa pagkakita sa mukha ko.” Idyoma ito sa Hebreo na nangangahulugang “huwag mo nang muling makita ang mukha ko.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mukha ko” ay maaari ring unawain bilang “presensiya ko,” ngunit inuulit ng Hebreo ang salitang “mukha” bilang pagdiriin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: At sinabi sa kanya ng Paraon
  rationale: Pinananatili ang pagsulong ng salaysay na ipinahihiwatig ng waw-consecutive at malinaw na isinasalin ang di-tuwirang layon na “sa kanya.”
- source_word: לֵךְ מֵעָלַי
  choice: Umalis ka sa harapan ko
  rationale: Natural na utos sa Filipino na may mariing tono ng pagpapaalis; ipinahihiwatig din nito ang paglayo sa presensiya ng Paraon nang hindi pinapalitan ang larawan ng pakikipagharap.
- source_word: הִשָּׁמֶר לְךָ
  choice: Mag-ingat ka
  rationale: Tuwirang babala na nakatuon kay Moises mismo at angkop sa nagbabantang tono ng konteksto.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: huwag mo nang muling makita ang mukha ko
  rationale: Isinasalin nang natural ang Hebreong idyoma na literal na “huwag kang magdagdag na makita,” habang pinananatili ang “mukha” dahil inuulit ito sa kasunod na sugnay.
- source_word: פָּנַי
  choice: ang mukha ko
  rationale: Pinananatili ang konkretong larawan at retorikal na pag-uulit ng Hebreo; maaari rin itong tumukoy sa presensiya ng Paraon.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: sa araw na makita mo ang mukha ko
  rationale: Malapit sa pormal na temporal na pananalita ng Hebreo at pinananatili ang maringal at mariing anyo ng banta.
- source_word: תָּמוּת
  choice: mamamatay ka
  rationale: Malinaw at kasalukuyang Filipino para sa tiyak na bantang kamatayan.
