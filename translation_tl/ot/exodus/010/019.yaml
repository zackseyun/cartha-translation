  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: tl
  text: Pinalitan ni Yahweh ang hangin ng isang napakalakas na hanging mula sa dagat[a]. Tinangay nito ang mga balang at itinaboy ang mga ito sa Dagat ng mga Tambo[b]. Wala ni isang balang ang natira sa buong nasasakupan ng Ehipto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay literal na “hangin ng dagat.” Sa kinalalagyan ng Ehipto, maaaring tumukoy ito sa hanging mula sa kanluran.
    reason: cultural_note
  - marker: b
    text: Tradisyonal na isinasaling “Dagat na Pula.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: pinabago ... ang ihip ng hangin
  rationale: Ang הפך ay nangangahulugang bumaling o magbago. Sa konteksto ng direksiyon ng hangin, malinaw at natural sa Filipino ang pagpapabago sa ihip nito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: רוּחַ יָם
  choice: hanging mula sa dagat
  rationale: Literal itong tumutukoy sa ‘hangin ng dagat.’ Sa heograpiya ng Ehipto, malamang na hanging kanluran ito, ngunit pinananatili sa teksto ang larawan at bahagyang kalabuan ng Hebreo.
- source_word: חָזָק מְאֹד
  choice: napakalakas
  rationale: Natural na Filipino para sa matinding pagpapalakas na ipinahahayag ng חָזָק מְאֹד.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: Tinangay nito ang mga balang
  rationale: Kapag hangin ang gumagawa, ang ‘tinangay’ ang likas na katumbas ng pag-angat at pagdala sa mga balang.
- source_word: וַיִּתְקָעֵהוּ
  choice: itinaboy
  rationale: Ipinahahayag ng תקע rito ang sapilitang pagtulak o pagtataboy. Ang panghalip na isahan sa Hebreo ay tumutukoy sa kawan ng mga balang bilang isang kabuuan.
- source_word: יָמָּה סּוּף
  choice: sa Dagat ng mga Tambo
  rationale: Sinasalamin nito ang pangalang Hebreo na Yam Suph at iniiwasang gawing pangunahing teksto ang tradisyonal ngunit hindi literal na ‘Dagat na Pula.’
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: Wala ni isang balang ang natira
  rationale: Pinananatili ang mariing diwa ng Hebreo na walang kahit isang balang na naiwan.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: sa buong nasasakupan ng Ehipto
  rationale: Ang גְּבוּל ay tumutukoy rito sa buong teritoryo o sakop ng Ehipto, hindi lamang sa hangganang guhit nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pagsasalin sa יָם סוּף
  choice: Dagat ng mga Tambo
  alternative: Dagat na Pula
  rationale: Mas malapit ang ‘Dagat ng mga Tambo’ sa anyo ng pangalang Hebreo; inilalagay sa talababa ang tradisyonal na pangalan para sa pagkilala ng mambabasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘hanging mula sa dagat’ upang mapanatili ang imahen ng Hebreo, habang ipinaliliwanag sa talababa ang posibleng direksiyong kanluran. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto.
