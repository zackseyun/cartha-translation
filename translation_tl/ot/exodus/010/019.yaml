revisions:
- from: At pinabago ni Yahweh ang ihip ng hangin, at naging napakalakas na hanging mula sa dagat[a]. Tinangay nito ang mga balang at itinaboy sa Dagat ng mga Tambo[b]. Wala ni isang balang ang natira sa buong nasasakupan ng Ehipto.
  to: Pinalitan ni Yahweh ang hangin ng isang napakalakas na hanging mula sa dagat[a]. Tinangay nito ang mga balang at itinaboy ang mga ito sa Dagat ng mga Tambo[b]. Wala ni isang balang ang natira sa buong nasasakupan ng Ehipto.
  rationale: Pinalitan ang panimulang sugnay upang malinaw na ilahad na binago ni Yahweh ang hangin tungo sa napakalakas na hanging mula sa dagat, nang hindi hinuhusgahan sa pangunahing teksto na ito ay isang hanging kanluran. Idinagdag ang “ang mga ito” upang maging malinaw ang layon ng pagtataboy. Hindi binago ang mga pangalan, mga panandang talababa, o ang diwa ng talata.
