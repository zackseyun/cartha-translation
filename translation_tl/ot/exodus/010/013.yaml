  source_fidelity: Ang “tinangay” ay maaaring magpahiwatig na inalis o itinaboy palayo ang mga balang, samantalang ang נשׂא sa kontekstong ito ay nagsasaad na dinala ng hanging silangan ang mga ito patungo sa Ehipto. Ang “dinala” ay mas tapat at walang di-kailangang direksiyonal na pahiwatig.
  naturalness: Natural ang pangkalahatang Filipino ng draft. Mas maayos ang pag-uugnay sa unang dalawang sugnay upang maipakita ang sunod-sunod na salaysay sa Hebreo.
  terminology: Ang “tungkod,” “Yahweh,” “hanging silangan,” at “mga balang” ay angkop sa modernong Filipino Tagalog at sa register ng salaysay.
