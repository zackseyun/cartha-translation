base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: tl
  text: Iniunat ni Moises ang kanyang tungkod sa ibabaw ng lupain ng Ehipto, at pinaihip ni Yahweh ang hanging silangan[a] sa lupain nang buong araw na iyon at buong magdamag. Nang sumapit ang umaga, dinala ng hanging silangan ang mga balang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hangin mula sa silangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: iniunat
  rationale: Karaniwang kahulugan ng נטה ang pag-unat o pag-abot; natural itong gamitin sa pagkilos ni Moises gamit ang tungkod.
- source_word: מַטֵּהוּ
  choice: ang kanyang tungkod
  rationale: Ang מַטֶּה ay tungkod o pamalo; mas malinaw at karaniwan sa salaysay ni Moises ang “tungkod.”
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: sa ibabaw ng lupain ng Ehipto
  rationale: Ipinahihiwatig ng עַל ang pag-unat ng tungkod sa ibabaw ng saklaw na lupain.
- source_word: וַיהוָה
  choice: At ... ni Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang pangalang tipan na יהוה sa Hebreo.
- source_word: נִהַג
  choice: pinaihip
  rationale: Sa konteksto ng hangin, ipinahihiwatig ng causative sense na si Yahweh ang nagpasimula at nagpatuloy sa pag-ihip nito; mas natural ito sa Tagalog kaysa literal na “itinaboy ang hangin.”
- source_word: רוּחַ קָדִים
  choice: hanging silangan
  rationale: Tumutukoy ito sa hanging nagmumula sa silangan; ang maikling anyong “hanging silangan” ay natural at pinananatili ang direksiyon.
- source_word: בָּאָרֶץ
  choice: sa lupain
  rationale: Ang בְּ ay maaaring “sa” o “sa ibabaw ng”; dito, ang “sa lupain” ay natural para sa pag-ihip ng hangin sa buong Ehipto.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: nang buong araw na iyon at buong magdamag
  rationale: Pinananatili ang diin ng dalawang כָּל, habang natural na ipinahahayag sa Tagalog ang tuluy-tuloy na tagal sa araw at gabi.
- source_word: הַבֹּקֶר הָיָה
  choice: Pagsapit ng umaga
  rationale: Natural na temporal na katumbas ng literal na “nang maging umaga.”
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: tinangay ... ang mga balang
  rationale: Ang נשׂא ay “buhatin/dalhin”; kapag hangin ang simuno, ang “tinangay” ay malinaw na nagsasaad ng pagdadala ng hangin, nang hindi tiyak na nilulutas kung pagdating o paggalaw ng kuyog ang diin.
- source_word: הָאַרְבֶּה
  choice: ang mga balang
  rationale: Bagaman anyong isahan sa Hebreo, kolektibo ang gamit nito; ang maramihang “mga balang” ang likas sa Tagalog.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinanatili ang transliterasyong “Yahweh” sa halip na palitan ito ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “buong magdamag” bilang natural na katumbas ng buong gabi, at “tinangay” upang buhay na mailarawan ang pagdadala ng hangin sa mga balang.
