- from: Kaya iniunat ni Moises ang kanyang tungkod sa ibabaw ng lupain ng Ehipto. At pinaihip ni Yahweh ang hanging silangan[a] sa lupain nang buong araw na iyon at buong magdamag. Pagsapit ng umaga, tinangay ng hanging silangan ang mga balang.
  to: Iniunat ni Moises ang kanyang tungkod sa ibabaw ng lupain ng Ehipto, at pinaihip ni Yahweh ang hanging silangan[a] sa lupain nang buong araw na iyon at buong magdamag. Nang sumapit ang umaga, dinala ng hanging silangan ang mga balang.
