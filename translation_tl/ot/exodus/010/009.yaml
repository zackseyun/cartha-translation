base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: tl
  text: Sinabi ni Moises, “Aalis kaming kasama ang aming mga kabataan at matatanda, ang aming mga anak na lalaki at babae, at ang aming mga kawan ng tupa at kambing at mga baka, sapagkat magdaraos kami ng isang kapistahan para kay Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: kasama ang aming mga kabataan at matatanda
  rationale: Pinananatili ang magkatambal na mga pangkat ng edad at ang diwa ng kasamang pag-alis, sa natural na modernong Tagalog.
- source_word: בְּבָנֵינוּ וּבִבְנוֹתֵנוּ
  choice: ang aming mga anak na lalaki at babae
  rationale: Tahasang pinananatili ang dalawang kasarian na binanggit sa Hebreo.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: ang aming mga tupa at baka
  rationale: Ang צֹאן ay tumutukoy sa maliliit na alagang hayop, karaniwang mga tupa at kambing, ngunit ang payak na 'mga tupa' ay angkop dito; ang בָּקָר ay mga bakahan o baka.
- source_word: חַג
  choice: kapistahan
  rationale: Ipinahahayag ang isang relihiyosong pistang idinaraos para kay Yahweh, hindi lamang isang karaniwang pagdiriwang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang pantanging pangalan ng Diyos bilang pangalan, sa halip na gawing titulong 'PANGINOON'.
- source_word: כִּי
  choice: sapagkat
  rationale: 'Pinananatili ang tahasang ugnayang sanhi: kailangang sumama ang lahat at ang mga hayop dahil may kapistahan sila para kay Yahweh.'
theological_decisions:
- issue: Kung ang pariralang חַג יְהוָה לָנוּ ay nagsasaad ng obligasyon
  choice: magdaraos kami ng isang kapistahan para kay Yahweh
  alternative: kailangan naming magdaos ng isang kapistahan para kay Yahweh
  rationale: Walang hiwalay na modal na salitang 'kailangan' sa Hebreo. Pinananatili ng salin ang pahayag ng nalalapit na kapistahan nang hindi dinaragdagan ang antas ng obligasyong ipinahihiwatig lamang ng konteksto.
translation_notes:
  register: 'Makabago, malinaw, at marangal na Filipino. Inayos ang paulit-ulit na נֵלֵךְ sa isang likas na pangungusap, habang pinananatili ang saklaw: kabataan, matatanda, mga anak, at mga alagang hayop.'
