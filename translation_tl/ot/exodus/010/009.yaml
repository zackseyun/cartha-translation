  source_fidelity: Kailangang ituwid ang “mga tupa” para sa צֹאן, na isang kolektibong katawagan para sa kawan ng maliliit na hayop at maaaring kabilang ang mga kambing. Ang natitirang saklaw ng mga kasama at mga hayop ay tapat sa Hebreo. Ang “magdaraos kami” ay hindi nagdaragdag ng modal na “kailangan,” alinsunod sa anyo ng pinagmulan, kahit ang English audit trail ay may “must.”
  naturalness: Likas at malinaw ang pangungusap sa makabagong Filipino. Ang “kawan ng tupa at kambing” ay mas tiyak at mas natural na paglalarawan ng saklaw ng hayop kaysa “mga tupa” lamang.
  terminology: Pinananatili ang “Yahweh” bilang pantanging pangalan para sa יהוה, gaya ng kasalukuyang draft. Ang “kapistahan para kay Yahweh” ay angkop para sa חַג יהוה at hindi ipinipilit ang isang partikular na denominasyonal na pagbasa.
