id: EXO.10.16
reference: Exodus 10:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: tl
  text: Agad na ipinatawag ng Faraon sina Moises at Aaron, at sinabi niya, “Nagkasala ako kay Yahweh na inyong Diyos at sa inyo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Agad
  rationale: Ipinahahayag ng pandiwang מהר ang pagmamadali. Natural sa modernong Tagalog ang “agad” at malinaw nitong naipakikita ang biglang pagkilos ng Faraon.
- source_word: לִקְרֹא
  choice: ipinatawag
  rationale: Sa konteksto, iniutos ng Faraon na papuntahin sa kaniya sina Moises at Aaron. Ang “ipinatawag” ang natural na katumbas ng layuning tumawag o magpatawag sa kanila.
- source_word: פַּרְעֹה
  choice: Faraon
  rationale: Ito ang kinagawiang anyong Tagalog para sa maharlikang titulong Ehipsiyo.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: sina Moises at Aaron
  rationale: Ginagamit ang pantukoy na “sina” para sa dalawang tiyak na pangalan ng tao; ang kaugnayan sa לִקְרֹא ay likas nang ipinahahayag ng pandiwang “ipinatawag.”
- source_word: וַיֹּאמֶר
  choice: at sinabi niya
  rationale: Tuwirang inililipat nito ang karaniwang panandang Hebreo na nagpapakilala ng tuwirang pananalita.
- source_word: חָטָאתִי
  choice: Nagkasala ako
  rationale: Pinananatili ng “nagkasala” ang moral at teolohikal na bigat ng חטא, sa halip na pahinain ito bilang simpleng paggawa ng mali.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Kasunod ng “nagkasala,” natural sa Tagalog ang “kay” upang tukuyin ang Diyos na pinagkasalahan.
- source_word: אֱלֹהֵיכֶם
  choice: na inyong Diyos
  rationale: 'Tumpak na pinananatili ng “inyong” ang pangalawang panauhang maramihan: kinikilala ng Faraon si Yahweh bilang Diyos nina Moises at Aaron, hindi bilang sarili niyang Diyos.'
- source_word: וְלָכֶם
  choice: at sa inyo
  rationale: Ang “sa inyo” ay natural na Tagalog para sa mga taong pinagkasalahan; maramihan ito at tumutukoy kina Moises at Aaron.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Saklaw ng pag-amin ng Faraon
  choice: “Nagkasala ako kay Yahweh na inyong Diyos at sa inyo”
  alternative: “Nagkasala ako laban kay Yahweh na inyong Diyos at laban sa inyo”
  rationale: Sa Tagalog, sapat at mas natural ang “nagkasala kay/sa” upang ipahayag ang taong pinagkasalahan. Pinananatili rin ang “inyong Diyos,” gaya ng tahasang ipinakikita ng hulaping maramihan sa Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang “agad na ipinatawag” upang natural na maipahayag ang pagmamadali nang hindi nagiging makaluma o labis na paraphrastic.
