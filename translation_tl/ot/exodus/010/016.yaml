  source_fidelity: 'Tapat ang salin sa Hebreo: naipahahayag nito ang madaliang pagpapatawag ni Faraon kina Moises at Aaron, ang kanyang pag-amin ng pagkakasala, at ang dalawang pinagkasalahan—si Yahweh na Diyos nina Moises at Aaron, at sila mismo. Ang “inyong Diyos” ay wastong pinananatili ang pangalawang panauhang maramihan.'
