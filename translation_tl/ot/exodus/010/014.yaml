base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: tl
  text: Umakyat ang mga balang sa buong lupain ng Ehipto at dumapo sa buong sakop ng Ehipto. Napakakapal[a] ng mga ito; bago nito ay wala pang naging ganitong mga balang, at pagkatapos nito ay wala nang magiging ganito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “napakabigat.” Inilalarawan ng idyomang ito ang pambihirang tindi o siksik na dami ng mga balang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Umakyat
  rationale: Pinananatili ang pangunahing larawan ng עלה na ‘umakyat,’ na angkop sa pagdating at paglaganap ng mga balang sa lupain.
- source_word: הָאַרְבֶּה
  choice: ang mga balang
  rationale: Bagaman kolektibong isahan ang anyong Hebreo, likas sa Tagalog ang maramihang ‘mga balang’ para sa malaking pangkat ng mga insektong sumalakay.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: sa buong lupain ng Ehipto
  rationale: Natural na Tagalog ito para sa paglaganap sa kabuuan ng teritoryo ng Ehipto.
- source_word: וַיָּנַח
  choice: dumapo
  rationale: Sa konteksto ng mga balang, mas tiyak at natural ang ‘dumapo’ kaysa ‘nagpahinga,’ habang pinananatili ang diwa ng paglapag at pananatili.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: sa lahat ng nasasakupan ng Ehipto
  rationale: Ang גְּבוּל ay maaaring tumukoy sa hangganan o teritoryong sakop. Dito, ang buong nasasakupan ang tinutukoy, hindi lamang ang mga guhit-hangganan.
- source_word: כָּבֵד מְאֹד
  choice: Napakabigat ng salot na ito
  rationale: Pinananatili ang matinding idyomang ‘napakabigat’ at ginagawang malinaw na ang inilalarawan ay ang salot o pagsalakay, hindi ang literal na timbang ng bawat balang.
- source_word: לְפָנָיו לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: kailanman ay wala pang naging ganitong mga balang
  rationale: Natural na Tagalog na nagpapanatili sa paghahambing sa lahat ng naunang pagsalakay ng mga balang.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: at hindi na magkakaroon pa ng ganito pagkatapos nito
  rationale: Pinananatili ang tahasang paghahambing sa hinaharap at ang pagtukoy sa kasalukuyang salot bilang pangyayari.
theological_decisions:
- issue: Ganap na pahayag na wala nang magiging kapantay na pagsalakay ng mga balang
  choice: Pinanatili ang absolutong pahayag ng talata nang walang paliwanag o paglilimita.
  alternative: Unawain itong retorikal na pagmamalabis o limitahan sa isang partikular na panahon o lugar.
  rationale: Walang gayong limitasyon sa Hebreong teksto; dapat manatili ang tensiyon at lakas ng orihinal na pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Ehipto,’ ‘balang,’ ‘dumapo,’ at ‘nasasakupan’ bilang karaniwang salitang madaling maunawaan; pinanatili sa talababa ang literal na larawang ‘napakabigat.’
