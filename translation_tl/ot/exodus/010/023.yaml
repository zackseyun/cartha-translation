  to: Hindi nila nakita ang isa’t isa[a], at walang sinumang bumangon mula sa kanyang kinaroroonan sa loob ng tatlong araw; ngunit lahat ng Israelita ay may liwanag sa kanilang mga tirahan.
  rationale: Pinalitan ang “tumayo” ng “bumangon” upang mas tumpak na maipahiwatig ang pag-alis o pagbangon mula sa sariling kinaroroonan, at inayos ang mga panghalip at ayos ng huling sugnay para sa likas at malinaw na modernong Tagalog. Inayos din ang talababa upang maging mas nauunawaan ang reciprocal na idiom ng Hebreo.
