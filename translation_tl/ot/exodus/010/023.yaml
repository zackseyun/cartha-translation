  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: tl
  text: Hindi nila nakita ang isa’t isa[a], at walang sinumang bumangon mula sa kanyang kinaroroonan sa loob ng tatlong araw; ngunit lahat ng Israelita ay may liwanag sa kanilang mga tirahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hindi nakita ng isang tao ang kanyang kapatid.” Isa itong pananalitang magkabilaan na nangangahulugang “hindi nila nakita ang isa’t isa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת אָחִיו
  choice: nakita ang isa’t isa
  rationale: 'Ang אִישׁ אֶת־אָחִיו ay katumbasang pahayag: hindi nila nakita ang isa’t isa. Hindi idinagdag ang modal na “makakita” sapagkat tuwirang inilalahad ng Hebreo ang pangyayari.'
- source_word: אִישׁ ... אִישׁ
  choice: nila ... walang sinuman
  rationale: Ginagamit nang panlahat at distributibo ang אִישׁ; ang mga anyong ito ay natural sa Tagalog at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: קָמוּ
  choice: tumayo
  rationale: Karaniwang kahulugan ng קום ang bumangon o tumayo. Ang “tumayo” ay malinaw at angkop sa marangal na salaysay.
- source_word: מִתַּחְתָּיו
  choice: mula sa kinaroroonan niya
  rationale: Idyomatiko ang literal na “mula sa ilalim niya” at tumutukoy sa pag-alis mula sa sariling kinalalagyan; natural itong ipinahayag bilang “mula sa kinaroroonan niya.”
- source_word: שְׁלֹשֶׁת יָמִים
  choice: sa loob ng tatlong araw
  rationale: Malinaw at likas na ipinahahayag nito sa Tagalog ang tagal ng panahon.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” isa itong etniko at tipanang katawagan sa buong bayang Israel; “mga Israelita” ang natural at saklaw na salin.
- source_word: הָיָה אוֹר
  choice: may liwanag
  rationale: Natural nitong ipinahahayag ang pagkakaroon ng liwanag at malinaw na naihahambing ito sa kadiliman sa Ehipto.
- source_word: בְּמֹשְׁבֹתָם
  choice: sa mga tirahan
  rationale: Maaaring mangahulugan ang מוֹשָׁב ng tirahan o pamayanan. Sa konteksto, pinananatili ng “mga tirahan” ang konkretong pahayag nang hindi nililimitahan sa indibidwal na bahay.
