  terminology: Ang “Israelita,” “liwanag,” at “mga tirahan” ay wasto at nasa angkop na marangal na rehistro. Nilinaw ang talababa sa mas natural na Filipino nang hindi itinuturing na literal na magkakapatid na lalaki ang tinutukoy.
