  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֤ה יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ֥/יהִי חֹ֖שֶׁךְ עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יָמֵ֖שׁ חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Yahweh kay Moises, “Iunat mo ang iyong kamay patungo sa langit upang magkaroon ng kadiliman sa lupain ng Ehipto—kadilimang maaaring makapa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang huling sugnay sa Hebreo ay maaari ring isaling “at madarama ang kadiliman” o “at maaaring kapain ng isang tao ang kadiliman.” Bihira ang pandiwang ginamit, at itinatampok nito na waring nahihipo ang kadiliman.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang pangalang tipan ng Diyos sa karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: נְטֵה יָדְךָ
  choice: Iunat mo ang iyong kamay
  rationale: Pinananatili ang pautos na anyo at ang konkretong kilos na ipinagagawa kay Moises.
- source_word: עַל הַשָּׁמַיִם
  choice: patungo sa langit
  rationale: Sa konteksto ng pag-uunat ng kamay, ang עַל ay nagpapahiwatig ng direksiyon. Ang “langit” ay natural at marangal na katumbas ng הַשָּׁמַיִם dito.
- source_word: וִיהִי חֹשֶׁךְ
  choice: upang magkaroon ng kadiliman
  rationale: Ipinahahayag nito ang nilalayong resulta ng pautos nang natural sa makabagong Tagalog.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: sa lupain ng Ehipto
  rationale: Pinananatili ang אֶרֶץ bilang “lupain” at malinaw na itinatakda ang saklaw ng salot.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: kadilimang maaaring makapa
  rationale: Ang bihirang pandiwang יָמֵשׁ ay karaniwang inuunawang nagpapakita na ang kadiliman ay waring nahihipo o nadarama. Ang “makapa” ay nagpapanatili sa matinding pisikal na larawan nang hindi labis na nagpapaliwanag.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili itong pangalan at hindi pinapalitan ng titulong “Panginoon.”
- issue: Kahulugan ng huling sugnay
  choice: kadilimang maaaring makapa
  alternative: at madarama ang kadiliman; at maaaring kapain ng isang tao ang kadiliman
  rationale: Pinananatili ang larawan ng halos nahihipong kadiliman, ngunit itinatala sa talababa ang kawalang-katiyakan dahil bihira ang pandiwang ginamit.
translation_notes:
  register: Makabago at dignidadong Filipino; tuwiran ang pautos at malinaw ang daloy. Ginamit ang “Ehipto” bilang nakasanayang anyong Filipino at inilagay ang talababa sa mismong mahirap na huling sugnay.
