  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: tl
  text: Pati ang aming mga alagang hayop ay sasama sa amin; walang maiiwang ni isang kuko man[a], sapagkat kukuha kami mula sa mga iyon upang maglingkod kay Yahweh na aming Diyos. Hindi namin alam kung ano ang gagamitin namin sa paglilingkod kay Yahweh hanggang sa makarating kami roon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “kuko” o “hoof.” Ang “maglingkod” sa talatang ito ay maaari ring isaling “sumamba.”
    reason: Pinananatili ang literal na larawan ng פַּרְסָה at ipinakikita ang leksikal na lawak ng עבד sa kontekstong ito.
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: aming mga alagang hayop
  rationale: Malawak na kolektibong tawag ito sa mga domestikadong hayop; mas angkop kaysa sa mas makitid na “mga baka.”
- source_word: יֵלֵךְ עִמָּנוּ
  choice: sasama sa amin
  rationale: Natural na Filipino para sa paglakad o pagpunta na kasama sila.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: walang maiiwan kahit isang paa
  rationale: Pinananatili ang mariing larawan ng Hebreo na walang anumang hayop ang maiiwan; “paa” ang natural na tawag sa paa ng hayop sa karaniwang Filipino.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: sapagkat kukuha kami mula sa mga iyon
  rationale: Malapit sa tahasang Hebreo na “mula sa mga iyon ay kukuha kami,” nang hindi nagdaragdag ng lantad na layon.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: upang maglingkod kay Yahweh na aming Diyos
  rationale: Ang “maglingkod” ay nagpapanatili sa lawak ng עבד at sa pag-uulit nito sa talata, bagaman kasama sa konteksto ang pagsamba.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: Hindi namin alam
  rationale: Ipinahahayag ang kasalukuyang kawalan ng kaalaman tungkol sa kakailanganin pagdating sa patutunguhan.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: kung ano ang gagamitin namin sa paglilingkod kay Yahweh
  rationale: Ipinapahayag ang malamang na instrumental na diwa ng מַה sa konteksto—kung anong mga hayop o handog ang gagamitin—habang pinananatili ang “paglilingkod.”
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: hanggang sa makarating kami roon
  rationale: Malinaw at natural na salin ng pagdating sa tinutukoy na lugar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng עבד sa konteksto ng paghahandog
  choice: maglingkod / paglilingkod kay Yahweh
  alternative: sumamba / pagsamba kay Yahweh
  rationale: Maaaring mangahulugan ang pandiwa ng paglilingkod o pagsamba. Pinananatili ng “maglingkod” ang mas malawak na diwa at ang pag-uulit sa Hebreo, samantalang ipinapaliwanag sa talababa na saklaw nito rito ang pagsamba.
- issue: Instrumental o mas pangkalahatang pagbasa sa מַה נַּעֲבֹד
  choice: kung ano ang gagamitin namin sa paglilingkod
  alternative: kung paano kami maglilingkod
  rationale: Ang usapan tungkol sa mga alagang hayop ay pumapabor sa instrumental na pagbasa, ngunit hindi nito lubusang inaalis ang mas pangkalahatang kahulugang “kung paano.”
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga alagang hayop” bilang malawak at madaling maunawaang kolektibong katawagan; iniwasan ang sobrang teknikal o makalumang pananalita.
