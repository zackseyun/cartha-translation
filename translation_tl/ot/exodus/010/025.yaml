  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: tl
  text: Ngunit sinabi ni Moises, “Ikaw rin ay dapat magbigay sa amin ng mga hain at mga handog na sinusunog, at ihahandog namin ang mga iyon kay Yahweh[a] na aming Diyos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreo ay gumagamit ng banal na pangalang יהוה (YHWH), na isinalin dito bilang “Yahweh.”
    reason: Nililinaw ang salin ng banal na pangalan.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Isinusulong ng anyong pandiwa ang salaysay, habang ipinahihiwatig ng “ngunit” ang pagsalungat ni Moises sa paghihigpit ng Faraon sa naunang talata.
- source_word: גַּם אַתָּה
  choice: Ikaw rin
  rationale: 'Pinananatili nito ang dagdag at mariing diin: ang Faraon mismo ay kailangan ding maglaan ng mga handog.'
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: dapat magbigay sa amin
  rationale: Ang נתן ay “magbigay,” at ang literal na “sa aming mga kamay” ay likas na ipinapahayag sa modernong Tagalog bilang “sa amin.” Ipinakikita ng “dapat” ang mariing kahilingan sa konteksto.
- source_word: זְבָחִים
  choice: mga hain
  rationale: Malinaw at karaniwang katawagan ito para sa mga handog na inihahain, kadalasan sa pamamagitan ng pagkatay.
- source_word: וְעֹלֹת
  choice: mga handog na sinusunog
  rationale: Tinutukoy ng עֹלָה ang handog na sinusunog nang buo; malinaw ang saling ito sa ordinaryong mambabasa.
- source_word: וְעָשִׂינוּ
  choice: at ihahandog namin ang mga iyon
  rationale: Sa konteksto ng paghahain, ang עשה ay nangangahulugang isagawa o ihandog. Idinagdag ang “mga iyon” bilang likas na layon sa Tagalog, na tumutukoy sa mga naunang handog.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: kay Yahweh na aming Diyos
  rationale: Ipinakikita ng ל ang pinag-uukulan ng paghahain, at pinananatili ang personal na pangalang יהוה bilang “Yahweh.”
theological_decisions:
- issue: Pagpapahayag sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Ang “Yahweh” ay nagpapanatili rito bilang personal na pangalan nang hindi ito pinapalitan ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “Ikaw rin” upang mapanatili ang diin ng Hebreo, at iniwasan ang masyadong literal ngunit di-likas na “sa aming mga kamay.”
