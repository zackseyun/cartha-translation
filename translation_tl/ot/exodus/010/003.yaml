language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: tl
  text: 'Kaya pumunta sina Moises at Aaron kay Faraon at sinabi sa kanya, “Ganito ang sabi ni Yahweh, ang Diyos ng mga Hebreo: Hanggang kailan ka tatangging magpakumbaba sa harapan ko?[a] Palayain mo ang bayan ko upang maglingkod sila sa akin.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “magpasakop sa akin.” Maaaring tumukoy ang pandiwang Hebreo sa pagiging mapagpakumbaba o sa pagpapakumbaba ng sarili sa harap ng Diyos.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “upang sumamba sila sa akin.” Kasama sa pandiwang Hebreo ang diwa ng paglilingkod sa Diyos sa pamamagitan ng pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: pumunta ... kay Faraon
  rationale: Sa konstruksiyong בוא אֶל, ang diwa ay pagpunta o paglapit sa isang tao. Likas sa makabagong Tagalog ang “pumunta ... kay Faraon” at hindi nito idinaragdag ang ideyang tahasang pumasok sila sa isang silid.
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: sinabi sa kanya
  rationale: Karaniwang panimula ito ng tuwirang pahayag at pinananatili ang tahasang pagtukoy sa kausap.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Pinananatili nito ang pormulang ginagamit ng mensahero upang ipakilala ang mismong mensahe ng Diyos, sa natural at marangal na Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin bilang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: ang Diyos ng mga Hebreo
  rationale: Tuwirang ipinapahayag ang kaugnayan ni Yahweh sa pangkat na kilala bilang mga Hebreo sa kontekstong Ehipsiyo.
- source_word: עַד מָתַי
  choice: Hanggang kailan
  rationale: Ito ang natural na katumbas sa Tagalog ng temporal na hamon o pagsaway.
- source_word: מֵאַנְתָּ
  choice: ka tatangging
  rationale: Bagaman perfect ang anyong Hebreo, inilalarawan nito ang patuloy at paulit-ulit na pagtanggi ni Faraon; likas ang aspektong prospektibo sa “Hanggang kailan ka tatanggi.”
- source_word: לֵעָנֹת
  choice: magpakumbaba
  rationale: Naipapakita nito ang maaaring reflexive na diwa ng Niphal—ang pagpapakumbaba ng sarili—habang ang posibleng diwang pagpapasakop ay inilalagay sa talababa.
- source_word: מִפָּנַי
  choice: sa harapan ko
  rationale: Natural na idyomatikong salin ito ng pariralang tumutukoy sa kalagayan ng isang tao sa harap o presensiya ng Diyos.
- source_word: שַׁלַּח
  choice: Pahintulutan mong umalis
  rationale: Ipinahahayag nito ang utos na palayain o hayaang makaalis ang bayan, sa natural na Tagalog at hindi lamang bilang simpleng pagpapadala.
- source_word: עַמִּי
  choice: ang bayan ko
  rationale: Pinananatili ang pag-angkin ng Diyos sa Israel; ang “bayan” ang natural na kolektibong katawagan sa kontekstong ito.
- source_word: וְיַעַבְדֻנִי
  choice: upang maglingkod sila sa akin
  rationale: Pinananatili ng “maglingkod” ang malawak na saklaw ng עבד, kabilang ang paglilingkod na panrelihiyon, nang hindi agad nililimitahan sa pagsamba lamang.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah o PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay direktang transliterasyon na hindi nagpapalit sa pangalan ng isang titulo.
- issue: Diwa ng לֵעָנֹת sa pagsaway kay Faraon
  choice: magpakumbaba sa harapan ko
  alternative: magpasakop sa akin / mapakumbaba sa harapan ko
  rationale: Maaaring ipahiwatig ng anyong Niphal ang pagiging mapagpakumbaba o ang pagpapakumbaba ng sarili. Pinili ang natural na reflexive na pahayag ngunit pinanatili sa talababa ang diwa ng pagpapasakop.
- issue: Diwa ng וְיַעַבְדֻנִי sa kahilingan ng Exodo
  choice: maglingkod sila sa akin
  alternative: sumamba sila sa akin
  rationale: Saklaw ng עבד kapwa ang paglilingkod at paglilingkod na panrelihiyon. Ang “maglingkod” ang mas malawak na salin at hindi pinapawi ang pahiwatig ng pagsamba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sina Moises at Aaron,” “kay Faraon,” at “bayan ko” bilang natural na mga anyo sa Tagalog, habang pinanatili ang pormula ng banal na mensahe at ang tunay na mga alternatibong kahulugan sa mga talababa.
