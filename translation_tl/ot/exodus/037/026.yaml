translation_notes:
  register: Gumamit ng makabago, marangal, at madaling maunawaang Filipino. Inilagay ang pananda ng talababa pagkatapos ng “palamuting gilid na ginto sa palibot,” sapagkat ang talababa ay nagpapaliwanag sa salitang זֵר, hindi sa “ibabaw.”
