  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: tl
  text: Binalutan niya ito ng purong ginto—ang ibabaw nito, ang mga tagiliran nito sa buong palibot, at ang mga sungay nito—at gumawa siya para rito ng isang gintong palamuting gilid sa buong palibot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang gintong korona sa buong palibot.” Ang salitang Hebreo ay tumutukoy sa isang pandekorasyong hangganan o gilid na nakapalibot sa bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: Binalutan
  rationale: Sa konteksto ng paggawa ng mga kagamitan sa tabernakulo, tumutukoy ang pandiwa sa paglalagay ng sapin na metal sa isang bagay na kahoy. Likas at malinaw sa modernong Filipino ang “binalutan.”
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Tuwirang ipinahahayag nito ang uri at kalidad ng materyal at likas itong pakinggan sa Filipino.
- source_word: גַּגּוֹ
  choice: ang ibabaw nito
  rationale: Bagaman karaniwang nangangahulugang “bubong” ang גג, ang tinutukoy dito ay ang itaas na rabaw ng maliit na altar.
- source_word: קִירֹתָיו
  choice: ang mga tagiliran nito
  rationale: Maaaring literal na “mga pader,” ngunit para sa isang kagamitang nadadala, mas natural at tumpak ang “mga tagiliran.”
- source_word: סָבִיב
  choice: sa palibot
  rationale: Malinaw nitong ipinahahayag na nakapaligid ang tinutukoy sa buong bagay.
- source_word: קַרְנֹתָיו
  choice: ang mga sungay nito
  rationale: Pinananatili ang literal at nakaugaliang katawagan sa nakausling mga sulok ng altar.
- source_word: זֵר
  choice: palamuting gilid
  rationale: Tumutukoy ito sa pandekorasyong hangganan o nakausling gilid na nakapalibot sa kagamitan. Mas madaling maunawaan ito kaysa sa literal na “korona,” habang pinananatili sa talababa ang tradisyonal na alternatibo.
