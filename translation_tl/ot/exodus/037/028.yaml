  text: Ginawa niya ang mga pingga mula sa kahoy na akasya at binalutan ng ginto ang mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang Qal wayyiqtol ng עשה ay nagsasaad ng kasunod na kilos sa salaysay. Natural sa modernong Filipino ang payak na pandiwang pangnakaraan nang hindi na tahasang isinasalin ang וַ bilang “at.”
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Sa konteksto ng mga kagamitan ng tabernakulo, tumutukoy ang בַּדִּים sa mahahabang pamalong ipinapasok sa mga argolya upang buhatin ang isang banal na kagamitan. Ang “mga pingga” ay maikli, malinaw, at angkop sa gamit na ito.
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang pariralang konstruktong Hebreo ay tumutukoy sa materyales. Likas sa Filipino ang “mula sa kahoy na akasya.”
- source_word: וַיְצַף
  choice: at binalutan
  rationale: Sa konteksto ng paggawa, ang צפה ay nangangahulugang takpan o sapinan ang ibabaw ng isang bagay ng ibang materyales. Ang “binalutan” ay natural at hindi nagpapahiwatig ng kapal ng ginto na hindi tinukoy ng teksto.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang panghalip na tuwirang layon ay bumabalik sa maramihang “mga pingga”; nililinaw ito ng “ang mga iyon” sa Filipino.
- source_word: זָהָב
  choice: ng ginto
  rationale: Tinutukoy ng זָהָב ang materyales na ipinambalot. Pagkatapos ng “binalutan,” idiomatiko sa Filipino ang “ng ginto.”
