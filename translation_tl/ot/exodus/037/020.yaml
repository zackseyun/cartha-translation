  yaml_path: translation/ot/exodus/037/020.yaml
  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: tl
  text: At sa ilawan ay may apat na kopang hugis-bulaklak ng almendras[a], kasama ang mga umbok at mga bulaklak nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “apat na kopang hugis-almendras, kasama ang mga umbok at mga bulaklak nito.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: At sa ilawan ay may
  rationale: Ipinahahayag ng pang-ukol ang kinalalagyan ng mga palamuting nakakabit sa ilawan; natural sa modernong Tagalog ang konstruksiyong “sa ilawan ay may.”
- source_word: אַרְבָּעָה
  choice: apat
  rationale: Tuwirang salin ng bilang na tumutukoy sa mga kopa.
- source_word: גְבִעִים
  choice: mga kopa
  rationale: Tumutukoy ito sa mga palamuting hugis-kopa; mas tiyak dito ang “kopa” kaysa “mangkok.”
- source_word: מְשֻׁקָּדִים
  choice: hugis-bulaklak ng almendras
  rationale: Inilalarawan ang mga kopa bilang hinubog ayon sa anyo ng bulaklak ng almendras, hindi lamang bilang pinalamutian ng gayong larawan.
- source_word: כַּפְתֹּרֶיהָ
  choice: mga umbok nito
  rationale: Ang termino sa paglalarawan ng ilawan ay tumutukoy sa mga nakausling palamuting parang buko o bukol. Pinananatili ng “umbok” ang pisikal na anyo nang hindi ipinapalagay na literal na usbong ang mga ito.
- source_word: וּפְרָחֶיהָ
  choice: mga bulaklak nito
  rationale: Tuwirang salin ng pangngalang nangangahulugang mga bulaklak o blossom, at ang panghalip ay tumutukoy sa ilawan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “ilawan” para sa menorah at “almendras” para sa punong almond. Idinagdag ang “kasama ang” upang maging natural ang appositional na parirala sa Tagalog habang hindi binabago ang mga bahaging inilalarawan.
