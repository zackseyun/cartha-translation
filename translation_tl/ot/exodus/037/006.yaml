  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: tl
  text: Ginawa niya ang luklukan ng awa[a] mula sa purong ginto. Dalawa't kalahating siko ang haba nito, at isa't kalahating siko ang lapad nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “takip ng pagtubos.” Ang salitang Hebreo ay tumutukoy sa gintong takip ng kaban at may kaugnayan sa pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang wayyiqtol ng עשה ay nagsasalaysay ng kasunod na kilos sa nakaraan. Hindi na kailangang isalin nang tahasan ang וַ־ upang maging natural ang salaysay sa Tagalog.
- source_word: כַּפֹּרֶת
  choice: luklukan ng awa
  rationale: Ito ang nakaugaliang katawagan sa sagradong takip ng kaban na kaugnay ng seremonya ng pagtubos. Pinananatili nito ang natatanging panrelihiyong kahulugan ng bagay, habang inilalahad sa talababa ang mas tuwirang alternatibo.
- source_word: זָהָב טָהוֹר
  choice: mula sa purong ginto
  rationale: Malinaw at natural nitong ipinapahayag sa Tagalog ang materyal na ginamit sa paggawa.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dalawa't kalahating siko
  rationale: Natural na anyo sa Tagalog ng Hebreong sukat na dalawang siko at kalahati.
- source_word: אָרְכָּהּ
  choice: ang haba nito
  rationale: Ang hulaping panghalip ay tumutukoy sa luklukan ng awa; natural sa Tagalog ang sugnay na nagsisimula sa sukat at sinusundan ng dimensiyon.
- source_word: וְאַמָּה וָחֵצִי
  choice: at isa't kalahating siko
  rationale: Tumpak at karaniwang paraan sa Tagalog ng pagsasabi ng isang siko at kalahati.
- source_word: רָחְבָּהּ
  choice: ang lapad nito
  rationale: Ang “lapad” ang malinaw at kasalukuyang katumbas ng dimensiyong tinutukoy, at ang “nito” ay tumutukoy sa luklukan ng awa.
theological_decisions:
- issue: Pagpapakahulugan sa כַּפֹּרֶת sa konteksto ng pagsamba
  choice: luklukan ng awa
  alternative: takip ng pagtubos
  rationale: Maaaring tumukoy ang salitang Hebreo sa takip ng kaban, ngunit natatangi rin itong kaugnay ng pagtubos sa pagsamba ng Israel. Pinananatili ng “luklukan ng awa” ang kinikilalang panrelihiyong katawagan nang hindi nagdaragdag ng tiyak na doktrinang wala sa talata; nasa talababa ang alternatibong mas tahasang naglalarawan sa gamit nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “siko” bilang karaniwang katawagang biblikal para sa cubit at pinanatili ang maikli at tuwirang anyo ng talata.
