  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: tl
  text: At ipinasok niya ang mga pingga sa mga argolya sa mga tagiliran ng kaban, upang mabuhat ang kaban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ipinasok
  rationale: Bagaman karaniwang nangangahulugang “dinala” ang בוא, sa konstruksiyong ito ay tumutukoy ito sa pagpasok ng mga pingga sa mga argolya; malinaw at likas sa Filipino ang “ipinasok.”
- source_word: הַבַּדִּים
  choice: mga pingga
  rationale: Tumutukoy ang בַּדִּים sa mahahabang pinggang ginagamit sa pagbuhat ng sagradong kagamitan. Ang “mga pingga” ay kasalukuyan at madaling maunawaan.
- source_word: בַּטַּבָּעֹת
  choice: sa mga argolya
  rationale: Ang בְּ kasama ng kilos na inilalarawan ay nagpapahiwatig ng pagpasok sa loob ng mga singsing o argolya. Sapat na ipinahihiwatig ng pandiwang “ipinasok” ang direksiyon.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: sa mga tagiliran ng kaban
  rationale: Sa kontekstong ito, ang צְלָעוֹת ay mga gilid o tagiliran ng kaban. Ang “mga tagiliran” ay malinaw at likas para sa magkabilang panig nito.
- source_word: הָאָרֹן
  choice: kaban
  rationale: Ang אָרוֹן ay ang sagradong sisidlan sa tabernakulo. “Kaban” ang nakaugaliang salin sa Filipino at angkop sa konteksto.
- source_word: לָשֵׂאת
  choice: upang mabuhat
  rationale: Ang pawatas ay nagsasaad ng layunin. Ipinahihiwatig ng “upang mabuhat” na ang mga pingga ang ginamit para madala ang kaban nang hindi labis na nililinaw ang paraan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “argolya” para sa mga singsing na kabitan at “pingga” para sa mga kahoy na pambuhat; pinanatili ang payak na ayos at pag-uulit ng “kaban” sa Hebreo.
