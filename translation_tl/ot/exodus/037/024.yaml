  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: tl
  text: Ginawa niya ito at ang lahat ng kagamitan nito mula sa isang talento ng purong ginto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “lahat ng sisidlan nito” o “lahat ng kasangkapan nito.” Malawak ang kahulugan ng salitang Hebreo na כֵּלִים at tumutukoy sa mga bagay o kagamitang kaugnay ng patungan ng ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: isang talento
  rationale: Sa konteksto ng paggawa ng tabernakulo, tumutukoy ang כִּכָּר sa yunit ng timbang na “talento,” hindi sa pangunahing kahulugan nitong bilog na bagay.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Natural at malinaw sa modernong Filipino ang “purong ginto” para sa gintong walang halo o dalisay ang materyal.
- source_word: עָשָׂה
  choice: Ginawa niya
  rationale: Tuwirang isinasalin ang karaniwang pandiwang עשה bilang “ginawa”; ipinahahayag ng kasunod na parirala ang materyales na ginamit.
- source_word: אֹתָהּ
  choice: ito
  rationale: Ang pambabaeng isahang hulapi ay tumutukoy sa ilawan sa naunang konteksto. Natural sa Filipino ang “ito,” bagaman walang kasariang gramatikal ang panghalip.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: at ang lahat ng kagamitan nito
  rationale: Malawak ang saklaw ng כֵּלִים at maaaring tumukoy sa mga kasangkapan, sisidlan, o iba pang gamit na kaugnay ng ilawan. Ang “mga kagamitan” ang pinakanatural at sapat na malawak sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, dignified, at madaling maunawaan. Pinanatili ang tradisyonal na yunit na “talento” dahil sukat ng timbang ang tinutukoy; hindi ito tumutukoy sa likas na kakayahan.
