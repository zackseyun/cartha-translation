  yaml_path: translation/ot/exodus/037/011.yaml
  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: tl
  text: Binalutan niya iyon ng purong ginto at ginawan iyon ng palamuting gilid[a] na ginto sa palibot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nakaangat na gilid” o, ayon sa tradisyonal na salin, “koronang ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: Binalutan
  rationale: Sa konteksto ng paggawa ng mga kagamitan sa tabernakulo, tumutukoy ang pandiwa sa paglalagay ng panlabas na sapin na metal. Likas at malinaw sa Filipino ang “binalutan” nang hindi ipinahihiwatig na solidong ginto ang buong bagay.
- source_word: אֹתוֹ
  choice: iyon
  rationale: Ang panghalip na tuwirang layon ay tumutukoy sa mesang ginawa sa naunang talata.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Tuwirang ipinahahayag ang ginto na may mataas na kadalisayan sa natural na makabagong Filipino.
- source_word: וַיַּעַשׂ לוֹ
  choice: ginawan iyon
  rationale: 'Pinananatili nito ang ugnayang ipinahahayag ng ל: gumawa siya ng isang bagay para sa mesa.'
- source_word: זֵר
  choice: palamuting gilid
  rationale: Ang salita ay tumutukoy rito sa isang ginawang pandekorasyong gilid o nakaangat na hangganan. Mas madaling maunawaan ang “palamuting gilid” kaysa sa literal ngunit posibleng mapanlinlang na “korona.”
- source_word: זָהָב
  choice: ginto
  rationale: Tuwirang katumbas ng materyal na tinutukoy.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Likas na Filipino para sa gilid na nakapaligid sa mesa; ipinahihiwatig ng konteksto ang buong paligid.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “palamuting gilid” upang ilarawan ang elementong pandekorasyon nang hindi isinasara ang leksikal na posibilidad ng nakaangat na gilid o tradisyonal na “korona.”
