translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Inayos ang mahigpit na pag-uulit ng Hebreo bilang una, ikalawa, at ikatlong pares upang maging madaling maunawaan, habang pinananatili ang tatlong umbok at anim na sanga. Ang tandang [a] ay inilagay agad pagkatapos ng unang paglitaw ng terminong may leksikal na alternatibo.
