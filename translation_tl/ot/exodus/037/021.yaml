  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: tl
  text: May umbok sa ilalim ng dalawang sangang lumalabas mula rito[a], may umbok sa ilalim ng dalawang sangang lumalabas mula rito, at may umbok sa ilalim ng dalawang sangang lumalabas mula rito, para sa anim na sangang lumalabas mula rito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “bukol” ang “umbok” (כַפְתֹּר); tumutukoy ito sa isang bilugang palamuti sa ilawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: umbok
  rationale: Tumutukoy ito sa bilugang palamuting bahagi ng ilawan. Likas at malinaw sa makabagong Filipino ang “umbok,” habang pinananatili ng talababa ang posibleng saling “bukol.”
- source_word: תַּחַת
  choice: sa ilalim ng
  rationale: Tuwirang ipinahahayag nito ang posisyon ng palamuti sa ibaba ng bawat pares ng mga sanga.
- source_word: שְׁנֵי הַקָּנִים
  choice: bawat pares ng mga sanga
  rationale: Sa konteksto ng ilawan, ang קָנֶה ay mga nakausling sanga, hindi literal na tambo. Ginawang “bawat pares” ang “dalawang sanga” upang maging malinaw sa Filipino ang tatlong magkapares na ayos nang hindi binabago ang bilang.
- source_word: מִמֶּנָּה
  choice: mula rito
  rationale: Pinananatili ang panghalip na pambabae na tumutukoy sa ilawan, nang hindi inuulit o labis na tinutukoy ang pangngalan.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: para sa anim na sanga
  rationale: Inilalahad nito ang buod ng tatlong umbok kaugnay ng kabuuang anim na sanga.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: lumalabas mula rito
  rationale: Pinananatili ang pandiwang larawan ng mga sangang umuusbong o nakausli mula sa gitnang katawan ng ilawan.
