    issue: May idinagdag na buod bago ang tatlong pag-uulit.
    rationale: Ang “May isang umbok sa ilalim ng bawat pares” ay sinundan ng tatlong espesipikong umbok. Tatlong beses lamang inuulit ng Hebreo ang pariralang ito; dapat panatilihin ang tatlong pagbanggit nang walang dagdag na pambungad.
  - severity: low
    issue: Ang “unang/ikalawang/ikatlong pares” ay pagpapalinaw na wala sa pinagmulan.
    rationale: Bagaman lohikal ang pagkakasunod, inuulit lamang ng Hebreo ang “dalawang sanga” nang tatlong beses. Ang tuwirang pag-uulit ay kapwa natural at mas malapit sa source.
