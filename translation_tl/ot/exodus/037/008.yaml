translation:
  language: tl
  text: Isang kerubin mula sa isang dulo sa panig na ito, at isang kerubin mula sa isang dulo sa kabilang panig; mula sa takip na pantubos[a] ay ginawa niya ang mga kerubin sa dalawang dulo nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “takip” o “luklukan ng awa”; Hebreo, kapporet, ang gintong takip ng kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: kerubin
  rationale: Pinananatili ang kinikilalang terminong tumutukoy sa natatanging nilalang na bantay ng trono na kaugnay ng kaban, sa halip na gumamit ng mapagpalagay na paglalarawan.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: mula sa dulo sa panig na ito ... mula sa dulo sa kabilang panig
  rationale: Ipinahahayag ng magkatambal na parirala ang magkabilang dulo o panig. Pinananatili ng salin ang ideya ng pinagmulan sa bawat dulo at nililinaw ang pagkakaiba ng dalawang panig.
- source_word: הַכַּפֹּרֶת
  choice: takip na pantubos
  rationale: Ito ang natatanging terminong kultiko para sa gintong takip ng kaban. Ipinahahayag ng “takip” ang pisikal na bagay, samantalang pinananatili ng “pantubos” ang kaugnayan nito sa ritwal ng pagtubos nang hindi labis na nagpapaliwanag.
- source_word: עָשָׂה
  choice: ginawa niya
  rationale: Payak at tuwirang katumbas ng karaniwang pandiwang Hebreo sa kontekstong ito.
- source_word: מִשְּׁנֵי קְצוֹתָיו
  choice: sa dalawang dulo nito
  rationale: Malinaw at likas na Filipino para sa kinalalagyan ng mga kerubin kaugnay ng takip; naipahayag na ng naunang “mula mismo sa takip” na kabahagi ng takip ang pagkakagawa sa mga ito.
theological_decisions:
- issue: Pagpapakahulugan sa הַכַּפֹּרֶת sa konteksto ng tabernakulo
  choice: takip na pantubos
  alternative: takip; luklukan ng awa
  rationale: Tumutukoy ang salita sa gintong takip ng kaban na may natatanging tungkuling kultiko. Pinagsasama ng “takip na pantubos” ang kongkretong anyo at ang kaugnayan sa ritwal ng pagtubos, samantalang inilalahad sa talababa ang mas payak at tradisyonal na mga alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kerubin” bilang nakaugaliang katawagang biblikal at ang “mula mismo” upang linawin na ang mga kerubin ay ginawang kabahagi ng takip, hindi lamang inilagay sa ibabaw nito.
