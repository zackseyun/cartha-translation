  text: Ang mga argolya ay nasa tabi ng balangkas at nagsilbing mga lalagyan ng mga pingga upang mabuhat ang mesa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: nasa tabi ng balangkas
  rationale: Sa kontekstong ito, ang לְעֻמַּת ay tumutukoy sa pagkakalagay ng mga argolya kaugnay ng balangkas; natural na ipinahahayag ito bilang “nasa tabi ng.” Ang מִסְגֶּרֶת ay ang nakapalibot na balangkas o gilid ng mesa.
- source_word: בָּתִּים לַבַּדִּים
  choice: mga lalagyan ng mga pingga
  rationale: Literal na “mga tahanan para sa mga pingga”; idiomatikong tumutukoy sa mga argolyang kinalalagyan o pinagsusuutan ng mga pingga.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: na pambuhat sa mesa
  rationale: 'Ipinahahayag ang layunin ng mga pingga: gamitin sa pagbuhat at pagdadala sa mesa.'
