  text: He made poles of acacia wood and overlaid them with gold.
translation:
  language: tl
  text: Gumawa siya ng mga pingga mula sa kahoy na akasya at binalutan ng ginto ang mga iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang Qal wayyiqtol ng עשה ay karaniwang nagsasaad ng sunod na kilos sa salaysay. Natural sa modernong Tagalog ang pandiwang nauuna sa paksa; hindi na kailangang isalin nang tahasan ang panimulang וַ bilang “at.”
- source_word: בַּדֵּי
  choice: mga pingga
  rationale: Sa konteksto ng tabernakulo, tumutukoy ang בַּד sa mahahabang pinggang ginagamit sa pagbuhat ng mga banal na kasangkapan. Ang “mga pingga” ay malinaw at likas sa Tagalog.
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang construct chain ay tumutukoy sa kahoy mula sa punong akasya. Ang “kahoy na akasya” ay mas madaling maunawaan kaysa sa transliterasyong “sitim.”
- source_word: וַיְצַף
  choice: at binalutan
  rationale: Sa gawaing ito, ang צפה ay nangangahulugang lagyan ng panlabas na sapin o balot. Ang “binalutan” ay natural na Tagalog at angkop sa paglalagay ng ginto sa kahoy.
- source_word: אֹתָם
  choice: ang mga iyon
  rationale: Ang panghalip na maramihan ay tumutukoy pabalik sa mga pingga; nililinaw ito ng “ang mga iyon” nang hindi inuulit ang pangngalan.
- source_word: זָהָב
  choice: ng ginto
  rationale: Ang ginto ang materyal na ipinambalot; hinihingi ng likas na konstruksiyong Tagalog na “binalutan ng ginto.”
