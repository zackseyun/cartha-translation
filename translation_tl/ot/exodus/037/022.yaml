  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: tl
  text: Ang kanilang mga usbong[a] at mga sanga ay mula sa mismong ilawan[b]; ang buong ilawan ay iisang gawang pinukpok na purong ginto[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bilugang palamuti.” Ang salitang Hebreo ay tumutukoy sa isang bilugang palamuti, na malamang ay inilalarawan dito sa anyong bulaklak bilang usbong.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mula rito.” Ang diwa ay hinubog ang mga usbong at mga sanga bilang isang kabuuan mula sa mismong ilawan.
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “isang pirasong hinubog sa pagpukpok” o “pinukpok mula sa iisang piraso ng purong ginto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: kanilang mga usbong
  rationale: Tumutukoy ang כַּפְתּוֹר sa bilugang palamuting may anyong bulaklak sa konteksto ng ilawan. Likas at kongkreto sa makabagong Tagalog ang “usbong,” habang pinananatili ng “kanilang” ang pangmaramihang hulapi ng Hebreo.
- source_word: וּקְנֹתָם
  choice: at mga sanga
  rationale: Bagaman ang קָנֶה ay karaniwang tambo o tangkay, tumutukoy ito rito sa nakausling mga bisig ng ilawan; “mga sanga” ang pinakanatural sa kontekstong ito.
- source_word: מִמֶּנָּה הָיוּ
  choice: ay kabahagi ng iisang piraso nito
  rationale: Literal na “mula rito ang mga iyon.” Ipinahihiwatig sa konteksto na ang mga palamuti at sanga ay hindi magkakabit na hiwalay kundi yari kasama ng mismong ilawan.
- source_word: כֻּלָּהּ
  choice: ang kabuuan nito
  rationale: Pinananatili nito ang diin sa buong ilawan na tinutukoy ng pambabaeng isahang hulapi.
- source_word: מִקְשָׁה אַחַת
  choice: iisang gawang pinukpok
  rationale: Ang מִקְשָׁה ay metal na hinubog sa pagpukpok, at binibigyang-diin ng אַחַת ang pagkakaisa ng buong yari.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Karaniwan, malinaw, at tumpak na salin ng paglalarawan sa materyales.
