base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: tl
  text: Ginawa ni Bezalel ang kaban na gawa sa kahoy na akasya. Dalawa't kalahating siko[a] ang haba nito, isa't kalahating siko ang lapad, at isa't kalahating siko ang taas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isaling “kahon.” Ang salitang Hebreo ay maaari ring tumukoy sa isang kahon o kaban, ngunit sa konteksto ng tabernakulo, ang “kaban” ang mas tiyak na salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa
  rationale: Karaniwang pandiwa ang עשה para sa paggawa; tuwiran at natural ang “ginawa” nang hindi nagdaragdag ng diwang wala sa Hebreo.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Isinalin sa baybay na karaniwang ginagamit para sa pangalang pantangi.
- source_word: הָאָרֹן
  choice: ang kaban
  rationale: Maaaring tumukoy ang אָרוֹן sa isang kahon o kaban. Sa konteksto ng tabernakulo, malinaw at marangal ang “kaban,” at tumutukoy ito sa kilalang sagradong sisidlan.
- source_word: עֲצֵי שִׁטִּים
  choice: na yari sa kahoy na akasya
  rationale: Ang pariralang Hebreo ay idyomatikong tumutukoy sa materyal na kahoy ng akasya; natural sa Filipino ang “yari sa kahoy na akasya.”
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dalawa't kalahating siko
  rationale: Pinananatili ang sinaunang yunit na amah bilang “siko” at malinaw na ipinahahayag ang sukat.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Tuwirang ipinahahayag ang dimensiyong haba at ang hulaping panghalip.
- source_word: וְאַמָּה וָחֵצִי
  choice: isa't kalahating siko
  rationale: Natural na modernong Filipino para sa isang amah at kalahati, nang hindi kino-convert ang sinaunang yunit.
- source_word: רָחְבּוֹ
  choice: ang lapad
  rationale: Ang “lapad” ang karaniwang salita para sa pahalang na dimensiyon ng isang bagay.
- source_word: קֹמָתוֹ
  choice: ang taas
  rationale: Sa isang bagay, ang קֹמָה ay tumutukoy sa patayong sukat; malinaw at natural ang “taas.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinanatili ang sinaunang yunit na “siko,” habang nagbigay ng maikling paliwanag sa talababa. Ginamit ang “kaban” bilang kontekstuwal at nakaugaliang katawagan sa sagradong אָרוֹן.
