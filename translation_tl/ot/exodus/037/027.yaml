  to: At gumawa siya para rito ng dalawang singsing na ginto sa ilalim ng palamuting gilid nito[a], sa dalawang bahaging tagiliran nito, sa magkabilang panig nito[b], bilang mga lagayan ng mga baras upang mabuhat ito sa pamamagitan ng mga iyon.
