  source_fidelity: Napananatili ng draft ang lahat ng pangunahing sangkap ng Hebreo, kabilang ang dalawang magkaugnay ngunit magkaibang pagtukoy sa mga gilid at ang layunin ng mga singsing bilang lagayan ng mga baras. Gayunman, ang “pingga” ay karaniwang tumutukoy sa isang lever at hindi angkop para sa בַּדִּים, na mga baras/poles na pambuhat. Nililinaw rin ng rebisyon na ang pagbubuhat ay sa pamamagitan ng mga baras.
  naturalness: Ang “mga baras” at “mga lagayan” ay mas likas at tiyak sa modernong Filipino kaysa “mga pingga” at “mga lalagyan” sa kontekstong ito. Ang “palamuting gilid” ay malinaw na salin para sa pandekorasyong זֵר.
  terminology: Pinalitan ang “pingga” ng “baras,” ang karaniwang terminong Filipino para sa mga pole/stave na ginagamit sa pagbuhat. Isinalin ang זֵר bilang “palamuting gilid,” nang walang implikasyong korona o hiwalay na bagay.
