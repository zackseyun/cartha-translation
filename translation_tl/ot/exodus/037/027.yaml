translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “pingga” para sa mga baras na pambuhat at pinanatili ang tila paulit-ulit na pagtukoy sa mga gilid dahil naroon ito sa Hebreo.
