  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: tl
  text: At gumawa siya para rito ng dalawang singsing na ginto sa ilalim ng palamuting gilid nito[a], sa dalawang bahaging tagiliran nito, sa magkabilang panig nito[b], bilang mga lagayan ng mga baras upang mabuhat ito sa pamamagitan ng mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa ilalim ng pandekorasyong hangganan nito.” Ang Hebreong זֵר ay tumutukoy sa palamuting gilid o hangganan sa palibot ng itaas na bahagi.
    reason: lexical_alternative
  - marker: b
    text: 'Inuulit ng Hebreo ang dalawang magkaugnay na pahayag: “sa dalawang bahaging tagiliran nito, sa magkabilang panig nito.” Pinanatili rito ang dalawa sa halip na pagsamahin ang mga ito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁתֵּי טַבְּעֹת זָהָב
  choice: At... dalawang singsing na ginto
  rationale: Ipinagpapatuloy ng וּ ang paglalarawan, at ang טַבְּעֹת זָהָב ay likas na isinasalin bilang mga singsing na yari sa ginto.
- source_word: עָשָׂה ל/וֹ
  choice: gumawa siya para rito
  rationale: Ang hulaping panghalip ay tumutukoy sa altar sa konteksto; pinananatili ng “para rito” ang ugnayang datibo.
- source_word: מִ/תַּחַת לְ/זֵר/וֹ
  choice: sa ilalim ng palibot nito
  rationale: Ang זֵר ay pandekorasyong hangganan o molding sa itaas ng kasangkapan. Ang “palibot” ay malinaw at hindi nagmumungkahi ng literal na koronang maharlika.
- source_word: עַל שְׁתֵּי צַלְעֹתָי/ו
  choice: sa dalawang gilid na bahagi nito
  rationale: Ang צלע ay maaaring mangahulugang tagiliran, tadyang, o estruktural na bahaging nasa gilid. Ang salin ay nagpapanatili ng malawak na kahulugan nang hindi labis na tinutukoy kung panel o balangkas.
- source_word: עַל שְׁנֵי צִדָּי/ו
  choice: sa magkabilang tagiliran nito
  rationale: Ang צד ay karaniwang salita para sa tagiliran. Pinanatili ang pariralang ito bukod sa naunang kaugnay na pahayag upang huwag alisin ang pag-uulit ng Hebreo.
- source_word: לְ/בָתִּים לְ/בַדִּים
  choice: bilang mga lalagyan ng mga pingga
  rationale: Literal na “mga bahay,” ngunit dito ang בָּתִּים ay mga sisidlan o lalagyan ng mga pinggang pambuhat. Ang בדים ay mga pingga na ginagamit sa pagbubuhat ng banal na kasangkapan.
- source_word: לָ/שֵׂאת אֹת/וֹ בָּ/הֶם
  choice: na pambuhat dito
  rationale: Ipinahahayag ng pawatas ang layunin, at likas na ipinapahiwatig ng parirala na ang mga pingga ang ginagamit sa pagbuhat.
