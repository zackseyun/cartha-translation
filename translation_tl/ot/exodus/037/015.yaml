  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: tl
  text: Ginawa niya ang mga pingga mula sa kahoy na akasya at binalutan niya ang mga ito ng ginto upang buhatin ang mesa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Isinasalaysay ng waw-consecutive ang kasunod na kilos. Natural sa modernong Tagalog ang pagsisimula sa pandiwang “Ginawa” nang hindi na tahasang isinasalin ang pang-ugnay.
- source_word: הַבַּדִּים
  choice: ang mga pingga
  rationale: Tumutukoy ang בַּדִּים sa mahahabang pirasong ginagamit sa pagbuhat ng sagradong kasangkapan. Malinaw at karaniwang salitang Tagalog ang “mga pingga” sa kontekstong ito.
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang pariralang konstruktong Hebreo ay tumutukoy sa materyal na acacia wood. Likas sa Tagalog ang “kahoy na akasya,” at nililinaw ng “mula sa” kung ano ang ginamit sa paggawa.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: at binalutan ng ginto
  rationale: Sa konteksto ng paggawa, ang צפה ay paglalagay ng metal na sapin. Ang “binalutan ng ginto” ay tumpak, malinaw, at natural sa Tagalog.
- source_word: לָשֵׂאת
  choice: upang ipambuhat
  rationale: 'Nagpapahayag ng layunin ang infinitive: ginawa ang mga pingga para gamitin sa pagbuhat. Ang “upang ipambuhat” ay maigsi at natural.'
- source_word: הַשֻּׁלְחָן
  choice: sa mesa
  rationale: Tuwirang katumbas ng שֻׁלְחָן ang “mesa.” Hindi idinagdag ang “ng tabernakulo” dahil “ang mesa” lamang ang nasa Hebreo; ginamit ang “sa” dahil hinihingi ito ng pandiwang “ipambuhat.”
