base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: tl
  text: Nakabuka paitaas ang mga pakpak ng mga kerubin, at nililiman ng mga ito ang pantakip[a]. Magkakaharap ang kanilang mga mukha, at nakaharap sa pantakip ang mga mukha ng mga kerubin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pantakip na pambayad-sala”; tradisyonal na “luklukan ng awa.” Ito ang takip ng kaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: mga kerubin
  rationale: Ginamit ang nakaugaliang transliterasyon sa Bibliyang Filipino para sa mga nilalang na inilalarawan, sa halip na palitan ito ng isang mapagpaliwanag ngunit mas tiyak na katawagan.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: nakabuka ang mga pakpak paitaas
  rationale: Likas na Filipino ito at malinaw na pinananatili ang nakabukang anyo at paitaas na direksiyon ng mga pakpak.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: nilililiman ng mga pakpak nila
  rationale: Ipinahihiwatig ng pandiwa ang pagtatakip mula sa ibabaw; ang “nilililiman” ay nagpapanatili sa larawan nang hindi nagpapahiwatig na lubusang natatakpan o ikinukubli ang bagay.
- source_word: הַכַּפֹּרֶת
  choice: ang pantakip
  rationale: Ang “pantakip” ay tuwirang tumutukoy sa takip ng kaban at umiiwas sa pagpasok sa pangunahing teksto ng isang teolohikal na interpretasyong hindi tahasang nakasaad sa pangngalang Hebreo. Inilalagay sa talababa ang kultikong kahulugan nito.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Magkaharap sila
  rationale: Natural na katumbas sa Filipino ng literal na idyomang “bawat isa tungo sa kanyang kapatid,” at malinaw na naghahayag ng magkaharap na ayos.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: nakaharap sa pantakip ang mga mukha ng mga kerubin
  rationale: Pinananatili ang tahasang pag-uulit sa pantakip at ang diin ng Hebreo sa mga mukha, sa halip na paikliin lamang bilang “nakaharap ang mga kerubin.”
theological_decisions:
- issue: Pagpapakahulugan sa הַכַּפֹּרֶת sa konteksto ng tabernakulo
  choice: pantakip
  alternative: luklukan ng awa; pantakip na pambayad-sala
  rationale: Ang salita ay tumutukoy sa takip ng kaban, ngunit may mahalagang gamit sa ritwal ng pagtubos. Pinili sa teksto ang kongkretong katawagan at pinanatili sa talababa ang kultikong kahulugan upang hindi tahimik na lutasin ang ugnayan ng bagay at ng tungkulin nito.
- issue: Ugnayan ng “magkaharap” at “nakaharap sa pantakip”
  choice: pinanatili ang dalawang pahayag
  alternative: pagsamahin bilang “magkaharap sila habang nakayuko sa pantakip”
  rationale: Hindi tahasang binabanggit ng Hebreo ang pagyuko. Pinananatili ng salin ang dalawang magkasabay na oryentasyon nang hindi nagdaragdag ng haka tungkol sa eksaktong posisyon ng ulo.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “kerubin” bilang nakaugaliang terminong biblikal at ang “pantakip” bilang malinaw na katawagan sa kongkretong bagay. Ang “ng mga pakpak nila” ay piniling natural na ayos sa Filipino, samantalang pinananatili ang pag-uulit at paralelismo ng Hebreo.
