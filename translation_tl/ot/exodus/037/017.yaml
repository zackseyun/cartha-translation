base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: tl
  text: 'Ginawa niya ang patungan ng ilawan mula sa purong ginto. Hinubog niya ang patungan sa pagpukpok mula sa iisang piraso[a]: ang tuntungan at tangkay nito, ang mga kopita nito, ang mga usbong[b] nito, at ang mga bulaklak nito ay magkakaisang piraso ng patungan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “isang pirasong hinubog sa pagpukpok.” Ang salitang Hebreo ay tumutukoy sa metal na hinubog sa pamamagitan ng pagmamartilyo.
    reason: lexical_alternative
  - marker: b
    text: O “mga umbok.” Ang salitang Hebreo ay tumutukoy sa mga nakausling palamuti; pinili ang “mga usbong” dahil sa disenyong tulad ng isang halamang namumukadkad.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: patungan ng ilawan
  rationale: Tumutukoy ito sa sagradong patungang may mga sanga na pinaglalagyan ng mga ilawan, hindi sa isang ilawan lamang.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Sa paglalarawan ng materyal, ang טָהוֹר ay nangangahulugang dalisay o pinong ginto; natural at tiyak ang 'purong ginto' sa modernong Filipino.
- source_word: מִקְשָׁה
  choice: isang pirasong pinanday
  rationale: Ipinahihiwatig ng salita ang metal na hinubog sa pamamagitan ng pagpukpok o pagmamartilyo mula sa iisang masa; malinaw na naihahayag ng parirala kapuwa ang paraan at ang pagkakabuo.
- source_word: יְרֵכָהּ
  choice: ang paanan nito
  rationale: Bagaman literal na maaaring mangahulugang 'hita' o 'tagiliran,' sa kagamitang ito tumutukoy ito sa mababang bahaging sumusuporta rito.
- source_word: קָנָהּ
  choice: ang katawan nito
  rationale: Ang anyong isahan dito ay tumutukoy sa gitnang patayong bahagi ng patungan; mas madaling maunawaan ang 'katawan' kaysa sa teknikal na 'tangkay' at hindi ito mapagkakamalang isa sa mga sanga.
- source_word: גְּבִיעֶיהָ
  choice: ang mga kopita nito
  rationale: Tumutukoy sa mga palamuting hugis-kopa; pinananatili ng 'kopita' ang anyo ng bagay at ang marangal na rehistro.
- source_word: כַּפְתֹּרֶיהָ
  choice: ang mga usbong nito
  rationale: Ang termino ay tumutukoy sa mga nakausling palamuting tila buko o umbok; pinili ang 'usbong' dahil sa disenyong halamang namumukadkad, habang itinatala ang posibleng 'mga umbok.'
- source_word: פְרָחֶיהָ
  choice: ang mga bulaklak nito
  rationale: Direkta, natural, at kaakma ng halamang larawan kasama ng mga usbong.
- source_word: מִמֶּנָּה הָיוּ
  choice: ay kabahagi ng iisang piraso
  rationale: Ipinahihiwatig na ang mga bahaging ito ay integral sa patungan at hindi magkakahiwalay na ikinabit.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ginawa niya ... Ginawa niya
  rationale: Pinananatili ang pag-uulit ng pandiwang Hebreo nang simple at natural sa Filipino.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang 'patungan ng ilawan' upang malinaw na maiba ang estruktura sa mismong ilawan. Pinanatili ang pag-uulit ng 'Ginawa niya' at ang floral na ugnayan ng 'mga usbong' at 'mga bulaklak.'
