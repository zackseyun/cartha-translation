  to: 'Ginawa niya ang patungan ng ilawan mula sa purong ginto. Hinubog niya ang patungan sa pagpukpok mula sa iisang piraso[a]: ang tuntungan at tangkay nito, ang mga kopita nito, ang mga usbong[b] nito, at ang mga bulaklak nito ay magkakaisang piraso ng patungan.'
