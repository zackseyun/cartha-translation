    issue: Malabo at hindi idiomatiko ang “ang mga … ay kabahagi ng iisang piraso.”
    rationale: Hindi nito tahasang ipinahihiwatig na ang mga bahagi ay hinubog bilang kaisa ng mismong patungan, sa halip na mga bahaging magkakahiwalay na lamang na kabilang sa isang piraso.
  - severity: low
