translation:
  language: tl
  text: Ginawa niya mula sa purong ginto ang pitong lampara nito, ang mga sipit nito[a], at ang mga bandeha nito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga pansipit ng mitsa”; tumutukoy ang salitang Hebreo sa kagamitang ginagamit sa paghawak o pag-aayos ng mga mitsa.
    reason: lexical_alternative
  - marker: b
    text: O, “mga lalagyan ng baga” o “mga lalagyan ng abo.” Maaaring tumukoy ang salitang Hebreo sa maliliit na sisidlan o bandehang ginagamit kasama ng mga lampara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Likas na salaysay sa Filipino para sa wayyiqtol ng עשה; hindi na tahasang isinalin ang pang-ugnay dahil malinaw ang tuloy-tuloy na daloy ng salaysay.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ang pitong lampara nito
  rationale: Ang נֵרוֹת ay mga indibiduwal na lampara, hindi ang patungan ng mga ilawan. Inilagay bago ang pangngalan ang bilang ayon sa likas na ayos sa Filipino, at ang hulaping pambabae ay tumutukoy sa patungan ng ilawan sa konteksto.
- source_word: מַלְקָחֶיהָ
  choice: ang mga sipit nito
  rationale: Ang salita ay tumutukoy sa kagamitang pansipit na ginagamit sa mga lampara, malamang sa paghawak o pag-aayos ng mga mitsa. Ang “sipit” ay malinaw at hindi labis na nagpapakahulugan.
- source_word: מַחְתֹּתֶיהָ
  choice: ang mga bandeha nito
  rationale: Sa konteksto ng patungan ng ilawan, tumutukoy ito sa maliliit na sisidlan o bandehang kaugnay ng paglilinis at pag-aayos ng mga lampara. Iniiwasan ng “bandeha” ang pag-aakalang kagamitan ito ng altar, habang pinananatiling bukas ang tiyak na gamit nito.
- source_word: זָהָב טָהוֹר
  choice: sa purong ginto
  rationale: Likas na pahayag sa Filipino para sa materyales na ginamit sa paggawa ng mga lampara at ng mga kagamitan nito.
