translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang “lampara” upang malinaw na maibukod ang pitong indibiduwal na ilaw mula sa patungan ng ilawan, at ang “bandeha” upang mapanatili ang leksikal na kaluwagan ng terminong Hebreo sa kontekstong ito.
