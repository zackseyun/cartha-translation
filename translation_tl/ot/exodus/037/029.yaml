  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: tl
  text: Ginawa niya ang banal na langis na pampahid at ang dalisay na insensong mula sa mababangong sangkap[a], na gawa ng isang tagagawa ng pabango[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mabangong insenso,” “insenso ng mga sangkap na mabango,” o “insensong may mga pabango.” Literal na tumutukoy ang Hebreo sa insensong yari sa mga aromatikong sangkap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “gawa ng isang tagapaghalo ng pabango” o “na hinalo ng isang dalubhasang tagapaghahalo.” Itinatampok ng Hebreo ang masinop na paghahanda ng isang taong bihasa sa paghahalo ng mababangong sangkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa rin niya
  rationale: Ang wayyiqtol ng עשה ay nagsasaad ng kasunod na natapos na kilos. Likas sa Filipino ang “Ginawa rin niya” sa pagpapatuloy ng talaan ng mga bagay na ginawa.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: ang banal na langis na pamahid
  rationale: Pinananatili nito kapwa ang gamit ng langis sa pagpapahid at ang pagkakatalaga nito bilang banal, nang hindi ipinapalit ang mas mapagpaliwanag ngunit hindi tuwirang “langis na pantatalaga.”
- source_word: קְטֹרֶת הַסַּמִּים
  choice: ang insensong mula sa mga sangkap na mabango
  rationale: Ang parirala ay literal na tumutukoy sa insensong yari sa mga aromatikong sangkap. Malinaw ito sa karaniwang mambabasa at hindi ginagawang simpleng pang-uri lamang ang ugnayang nasa Hebreo.
- source_word: טָהוֹר
  choice: dalisay
  rationale: Sa kontekstong panritwal at materyal, ipinahihiwatig ng טָהוֹר ang kadalisayan. Ang “dalisay” ay natural at marangal na katumbas.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: na gawa ng isang tagapagtimpla
  rationale: Pinananatili ng nominal na anyo ang diin sa masinop na paggawa ng isang dalubhasang naghahalo ng mababangong sangkap, nang hindi nagdaragdag ng hindi hayag na detalye.
