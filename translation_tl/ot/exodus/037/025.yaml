  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: tl
  text: Ginawa niya ang altar ng insenso mula sa kahoy na akasya. Isang siko ang haba nito at isang siko ang lapad—parisukat ito—at dalawang siko ang taas nito. Ang mga sungay nito ay bahagi mismo ng altar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ginawa niya
  rationale: Ang pandiwa ay nagsasalaysay ng kasunod na natapos na kilos. Hindi na isinama ang panimulang pangatnig upang maging natural sa makabagong Tagalog nang hindi nawawala ang pagkakasunod-sunod.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: ang altar ng insenso
  rationale: Malinaw at likas na salin ng pariralang tumutukoy sa altar na ginagamit para sa insenso.
- source_word: עֲצֵי שִׁטִּים
  choice: mula sa kahoy na akasya
  rationale: Ang “akasya” ang madaling maunawaang makabagong tawag sa uri ng kahoy; ipinahahayag ng “mula sa” ang materyales na ginamit.
- source_word: אַמָּה
  choice: siko
  rationale: Pinananatili ang sinaunang yunit ng sukat sa halip na magbigay ng tiyak na makabagong katumbas.
- source_word: אָרְכּוֹ ... רָחְבּוֹ
  choice: ang haba nito ... ang lapad
  rationale: Likas na Tagalog na pagpapahayag ng mga sukat habang malinaw na ang mga ito ay tumutukoy sa altar.
- source_word: רָבוּעַ
  choice: parisukat ito
  rationale: Isinasalin bilang buong sugnay ang panaguring naglalarawan sa hugis.
- source_word: וְאַמָּתַיִם קֹמָתוֹ
  choice: at dalawang siko ang taas nito
  rationale: Natural na ayos sa Tagalog na tapat sa pahayag ng sukat.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Ang mga sungay nito ay kaisang piraso nito
  rationale: Ipinahihiwatig ng Hebreo na ang mga sungay ay integral sa altar at hindi magkakabit na hiwalay na bahagi.
