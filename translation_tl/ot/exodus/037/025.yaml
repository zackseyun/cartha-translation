  to: Ginawa niya ang altar ng insenso mula sa kahoy na akasya. Isang siko ang haba nito at isang siko ang lapad—parisukat ito—at dalawang siko ang taas nito. Ang mga sungay nito ay bahagi mismo ng altar.
  rationale: Pinalitan lamang ang huling pangungusap upang maging likas at malinaw sa Filipino, habang pinananatili ang kahulugang ang mga sungay ay hindi hiwalay na ikinabit kundi integral na bahagi ng altar. Walang kailangang footnote para sa talatang ito sa Filipino, sapagkat ang alternatibong ayos ng parirala sa English audit trail ay walang natatanging semantikong katumbas na kailangang iangkla.
