  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: tl
  text: Gumawa siya ng mesa mula sa kahoy na akasya. Dalawang siko ang haba nito, isang siko ang lapad, at isa’t kalahating siko ang taas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ang waw-consecutive na may עשה ay nagsasalaysay ng natapos na kilos. Likas sa modernong Tagalog ang “Gumawa siya”; hindi kailangang ulitin ang panimulang “At” upang maipakita ang pagkakasunod-sunod ng salaysay.
- source_word: הַשֻּׁלְחָן
  choice: mesa
  rationale: Tuwirang tumutukoy ang pangngalan sa isang mesa; malinaw na ang tiyak na mesang tinutukoy ay yaong nasa konteksto ng tabernakulo.
- source_word: עֲצֵי שִׁטִּים
  choice: kahoy na akasya
  rationale: Ang pariralang construct ay tumutukoy sa kahoy mula sa punong shittah/acacia. Ang “kahoy na akasya” ay malinaw at karaniwang katawagan sa modernong Tagalog.
- source_word: אַמָּתַיִם
  choice: dalawang siko
  rationale: Ang אַמָּה ay sinaunang yunit na cubit, karaniwang tinutumbasan sa Tagalog ng “siko.” Pinananatili nito ang makasaysayang sukat nang hindi nagpapanggap na eksaktong modernong sukat.
- source_word: אָרְכּוֹ
  choice: ang haba nito
  rationale: Ang pangngalan na may hulaping ikatlong panauhang panlalaki ay tumutukoy sa haba ng mesa. Natural sa Tagalog ang hulma na “Dalawang siko ang haba nito.”
- source_word: וְאַמָּה רָחְבּוֹ
  choice: isang siko ang lapad
  rationale: Ibinibigay ng parirala ang ikalawang dimensiyon. Ang ayos na panaguri muna ay malinaw at natural sa Tagalog.
- source_word: וְאַמָּה וָחֵצִי
  choice: isa’t kalahating siko
  rationale: Eksaktong inilalahad nito ang “isang siko at kalahati” sa mas natural at maikling anyo sa kasalukuyang Tagalog.
- source_word: קֹמָתוֹ
  choice: ang taas
  rationale: Sa paglalarawan ng isang bagay, ang קוֹמָה ay tumutukoy sa patayong dimensiyon, kaya “taas” ang angkop na salin.
theological_decisions: []
translation_notes:
  register: Gumamit ng malinaw, dignificado, at kasalukuyang Tagalog. Hinati sa dalawang pangungusap upang madaling basahin habang pinananatili ang payak na pagkakasunod ng Hebreo. Walang footnote dahil malinaw ang mga sukat sa tekstong Hebreo; ang footnote sa English consultation layer na nagsasabing “a cubit and a half” pagkatapos ng “two cubits” ay hindi tumutugma sa bahaging minarkahan at hindi isinama.
