  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: tl
  text: Binalutan niya ito ng purong ginto, sa loob at labas, at gumawa siya para rito ng palamuting gilid na ginto sa buong palibot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “isang moldurang ginto sa buong paligid” o “isang ginintuang gilid sa paligid nito.” Ang Hebreong זֵר ay tumutukoy sa palamuting gilid na nakapalibot sa isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Binalutan niya iyon
  rationale: Ang piel ng צפה sa konteksto ng paggawa ay tumutukoy sa paglalagay ng metal na sapin sa isang bagay. Likas sa Filipino ang “binalutan” at hindi nito ipinahihiwatig na solidong ginto ang buong bagay.
- source_word: זָהָב טָהוֹר
  choice: purong ginto
  rationale: Tuwirang ipinahahayag nito ang kadalisayan ng ginto at ito ang karaniwang modernong parirala sa Filipino.
- source_word: מִבַּיִת וּמִחוּץ
  choice: sa loob at labas
  rationale: Malinaw at maikli nitong tinutukoy ang panloob at panlabas na mga ibabaw.
- source_word: וַיַּעַשׂ לוֹ
  choice: at ginawan niya iyon
  rationale: 'Pinananatili ng “ginawan” ang di-tuwirang layon na ipinahahayag ng לֹו: gumawa siya ng isang bagay para sa kaban.'
- source_word: זֵר זָהָב
  choice: bordeng ginto
  rationale: Sa mga kasangkapang pangtabernakulo, ang זֵר ay isang nakapalibot na gilid o moldura. Ang “borde” ay madaling maunawaan at hindi nag-aangkat ng maharlikang diwa ng literal na “korona.”
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahahayag nito na ang bordeng ginto ay umiikot sa buong bagay.
theological_decisions: []
translation_notes:
  register: Gumamit ng modernong, dignidadong Filipino na madaling maunawaan. Pinili ang “iyon” sapagkat ang tinutukoy ay ang kaban sa naunang talata. Inilagay ang talababa pagkatapos ng “sa palibot” dahil ang paliwanag ay ukol sa זֵר, hindi sa “purong ginto.”
