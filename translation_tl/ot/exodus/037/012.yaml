  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: tl
  text: Gumawa siya para rito ng isang balangkas[a] na ang lapad ay isang lapad ng kamay sa buong palibot, at gumawa siya ng gintong moldura[b] sa buong palibot ng balangkas nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gilid” o “palibot na tabla” sa halip na “balangkas.”
    reason: lexical_alternative
  - marker: b
    text: Tradisyonal na “gintong korona”; dito, ang “moldura” ay tumutukoy sa pandekorasyong gilid sa palibot ng balangkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: balangkas
  rationale: Tumutukoy ito sa nakapalibot na bahaging nakakabit sa mesa. Ang “balangkas” ay malinaw at likas sa modernong Filipino; maaaring “gilid” o “palibot na tabla” depende sa pagkaunawa sa kayarian.
- source_word: טֹפַח
  choice: isang dangkal ang lapad
  rationale: Yunit ito ng sukat na katumbas ng lapad ng kamay. Nililinaw ng “ang lapad” ang kaugnayan ng sukat sa balangkas nang hindi nagdaragdag ng diwa.
- source_word: סָבִיב
  choice: sa palibot
  rationale: Ipinahihiwatig nito na nakapaligid ang bahagi sa lahat ng panig; natural at maikli ang “sa palibot.”
- source_word: זֵר
  choice: moldura
  rationale: Sa konteksto ng mga kagamitan sa tabernakulo, tumutukoy ito sa nakaangat o pandekorasyong gilid. Iniiwasan ng “moldura” ang maling impresyong isang maharlikang korona ang tinutukoy.
- source_word: זָהָב
  choice: gintong
  rationale: Likas na inilalarawan sa Filipino ang materyal ng moldura sa pamamagitan ng pang-uring “gintong.”
- source_word: לְמִסְגַּרְתּוֹ
  choice: sa palibot ng balangkas nito
  rationale: Pinananatili ang hulaping paari at ipinapahayag ang kaugnayan ng gintong moldura sa naunang balangkas. Ang kasunod na סָבִיב ang nagbibigay-diin na nakapaligid ito.
