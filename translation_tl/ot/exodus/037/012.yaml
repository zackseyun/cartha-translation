    rationale: Karaniwang tumutukoy ang “dangkal” sa span ng nakabukang kamay, hindi sa lapad ng kamay. Ang source ay tumutukoy sa handbreadth; kaya dapat itong isalin bilang “lapad ng kamay.”
  - severity: low
