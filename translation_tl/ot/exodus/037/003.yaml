  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: tl
  text: Naghulma siya ng apat na argolyang ginto para rito sa apat na paa nito[a]—dalawang argolya sa isang tagiliran at dalawang argolya sa kabilang tagiliran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “sa apat na sulok nito” o “sa apat na tukod nito”; ang salitang Hebreo ay maaaring tumukoy sa mga paa o sa mabababang dulo na nagsisilbing tukod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Gumawa siya
  rationale: Sa konteksto ng paggawa sa metal, tumutukoy ang pandiwa sa paghuhulma sa pamamagitan ng pagbubuhos ng tunaw na metal. Ginamit ang natural na “gumawa” sa pangunahing teksto upang maiwasan ang di-likas na parirala sa Filipino, habang nananatiling malinaw na ang mga argolya ang ginawa.
- source_word: לוֹ
  choice: para rito
  rationale: Ang hulaping panghalip ay tumutukoy sa kaban, isang bagay; natural sa modernong Filipino ang “para rito.”
- source_word: טַבְּעֹת זָהָב
  choice: mga argolyang ginto
  rationale: Ang “argolya” ay angkop sa mga singsing na kabitan ng mga pingga at mas tiyak dito kaysa sa karaniwang “singsing.”
- source_word: פַּעֲמֹתָיו
  choice: mga paa nito
  rationale: Maaaring tumukoy ang salita sa mga paa o mabababang dulong nagsisilbing tukod. Pinili ang tuwirang “mga paa,” ngunit inilagay sa talababa ang tunay na leksikal na kalabuan.
- source_word: צַלְעוֹ
  choice: tagiliran
  rationale: Sa paglalarawan ng isang bagay, ang צלע ay tumutukoy sa gilid o tagiliran. Ang “tagiliran” ay malinaw na tumutukoy sa isa sa dalawang magkabilang panig ng kaban.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: sa isang tagiliran ... sa kabilang tagiliran
  rationale: Literal na “sa unang/isang tagiliran ... sa ikalawang tagiliran.” Ang napiling anyo ay natural sa Filipino at tumpak na nagpapahayag ng dalawang magkabilang panig.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “argolya” para sa mga singsing na kabitan at “tagiliran” para sa magkabilang panig. Iningatan sa talababa ang kalabuan ng פַּעֲמֹתָיו.
