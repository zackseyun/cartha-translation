  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: tl
  text: 'At anim na sanga ang lumalabas mula sa mga gilid nito[a]: tatlong sanga ng patungan ng mga ilawan mula sa isang gilid nito[b], at tatlong sanga ng patungan ng mga ilawan mula sa ikalawang gilid nito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nakausli mula sa mga gilid nito.” Inilalarawan ng pandiwaring Hebreo ang mga sanga bilang lumilitaw palabas mula sa patungan ng mga ilawan.
    reason: lexical_alternative
  - marker: b
    text: Literal sa Hebreo, “mula sa isang gilid nito ... mula sa ikalawang gilid nito.” Maaari ring ipahayag na “mula sa isang panig ... mula sa kabilang panig.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: mga sanga
  rationale: Sa konteksto ng ilawan, tumutukoy ito sa mga bahaging tulad-sanga na nakausli mula sa katawan ng ilawan; natural at malinaw sa Tagalog ang “mga sanga.”
- source_word: יֹצְאִים
  choice: ang lumalabas
  rationale: 'Pinananatili nito ang naglalarawang lakas ng Hebreong participle: ang anim na sanga ay lumalabas o nakausli mula sa ilawan, sa halip na sabihing naroon lamang ang mga ito.'
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: mula sa mga tagiliran nito / mula sa ... tagiliran nito
  rationale: Ang צַד ay “tagiliran” o “panig.” Ang “tagiliran” ay angkop sa pisikal na bagay at pinananatili ang paglipat mula sa maramihang “mga tagiliran” tungo sa bawat tiyak na tagiliran.
- source_word: מְנֹרָה
  choice: ilawan
  rationale: Sa konteksto ng tabernakulo, ito ang lagayan ng mga ilaw na may mga sanga. Ang “ilawan” ay isang natural at nakaugaliang salin sa Tagalog, nang hindi kinakailangang hiramin ang “menorah.”
- source_word: הָאֶחָד
  choice: isang tagiliran nito
  rationale: Ipinahahayag nito ang unang panig sa pares at ang kaugnayan nito sa ilawan, nang hindi nagiging pilit ang literal na “ang isang tagiliran.”
- source_word: הַשֵּׁנִי
  choice: ikalawang tagiliran nito
  rationale: Pinananatili ng “ikalawang” ang literal na pagtutumbas sa Hebreong שֵׁנִי at ang balanseng paglalarawan ng dalawang tagiliran; maaari ring unawain sa natural na Tagalog bilang kabilang tagiliran.
