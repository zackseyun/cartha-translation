base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: tl
  text: Tatlong kopang hugis-bulaklak ng almendras ang nasa isang sanga, na may umbok at bulaklak; at tatlong kopang hugis-bulaklak ng almendras ang nasa isa pang sanga, na may umbok at bulaklak. Ganito ang pagkakagawa sa anim na sangang lumalabas mula sa patungan ng ilawan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבִעִים
  choice: mga kopa
  rationale: Tumutukoy ito sa mga palamuting hugis-kopa sa ilawan; natural at malinaw ang “mga kopa” sa modernong Filipino.
- source_word: מְשֻׁקָּדִים
  choice: hugis-bulaklak ng almendras
  rationale: Ang anyo ay ginaya sa bulaklak ng punong almendras; ginagawang tahasan ng salin ang disenyong floral.
- source_word: קָנֶה
  choice: sanga
  rationale: Sa konteksto ng menorah, tumutukoy ito sa mga brasong nakausli mula sa gitnang katawan; pinananatili ng “sanga” ang organikong larawan.
- source_word: כַּפְתֹּר
  choice: umbok
  rationale: Tumutukoy sa bilugan o nakausling palamuti. Ang “umbok” ay madaling maunawaan at hindi nagpapahiwatig na hiwalay itong piyesa na gaya ng maaaring ipahiwatig ng “pihitan.”
- source_word: פֶרַח
  choice: bulaklak
  rationale: Tuwirang tumutukoy sa palamuting bulaklak at natural sa Filipino.
- source_word: כֵּן
  choice: Ganito ang pagkakagawa
  rationale: Binubuod nito na ang naunang disenyo ay inulit sa lahat ng anim na sanga.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: lumalabas mula sa ilawan
  rationale: Malapit sa anyo at larawan ng Hebreo at malinaw na ang mga sanga ay nagmumula sa pangunahing ilawan.
- source_word: מְנֹרָה
  choice: ilawan
  rationale: Karaniwang salin para sa lampstand sa kontekstong ito; mas madaling maunawaan kaysa transliterasyong “menorah.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Ginamit ang “kopa,” “umbok,” at “sanga” upang ilarawan ang mga palamuti nang hindi labis na teknikal. Idinagdag ang “isa pang” sa ikalawang banggit para sa natural na Filipino, habang itinala sa talababa ang literal na pag-uulit ng Hebreo.
