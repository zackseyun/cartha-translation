base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: tl
  text: 'Ginawa rin niya sa purong ginto ang mga kagamitang nasa ibabaw ng mesa: ang mga pinggan[a], mga kopa, mga pitsel, at mga mangkok nito na ginagamit sa pagbubuhos ng handog na inumin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bandehado, maliliit na mangkok, mga sisidlang pambuhos, at mga mangkok.” Bihira o nakadepende sa konteksto ang ilang katawagan sa mga sisidlan sa talatang ito, kaya tinatayang katumbas lamang ang mga salin.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: mga kagamitan
  rationale: Malawak ang kahulugan ng כְּלִים at tumutukoy rito sa mga sisidlan at kasangkapang kaugnay ng mesa; natural at malinaw sa modernong Tagalog ang “mga kagamitan.”
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: na nasa ibabaw ng mesa
  rationale: Malapit ito sa literal na “na nasa ibabaw ng mesa” at hindi ipinapalit ang mas interpretatibong “para sa mesa.”
- source_word: קְעָרֹתָיו
  choice: mga pinggan nito
  rationale: Ang קְעָרָה ay isang pinggan o mababaw na sisidlan; ang “pinggan” ay payak at angkop sa konteksto ng mesa.
- source_word: כַּפֹּתָיו
  choice: mga kopa nito
  rationale: Bagaman kaugnay ang salita sa palad o sandok, sa kontekstong ito ay tumutukoy ito sa maliliit na sisidlan; pinananatili ng “kopa” ang pagkakaiba nito sa mga pinggan at mangkok.
- source_word: מְנַקִּיֹּתָיו
  choice: mga pitsel nito
  rationale: Bihira ang terminong Hebreo at hindi tiyak ang eksaktong anyo ng sisidlan. Ipinahihiwatig ng “pitsel” ang sisidlang maaaring gamitin sa pagbuhos nang hindi gumagamit ng makalumang salita.
- source_word: הַקְּשָׂוֹת
  choice: mga mangkok nito
  rationale: Isa rin itong katawagan sa sisidlan sa talaang ito; malinaw at madaling maunawaan ang “mangkok,” habang kinikilala sa talababa ang kawalan ng katiyakan sa mga eksaktong katumbas.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: na ginagamit sa pagbubuhos ng handog na inumin
  rationale: Ipinahihiwatig ng pandiwang נסך ang ritwal na pagbubuhos ng handog na inumin. Ang parirala ay natural sa Tagalog at hindi tumutukoy sa isang partikular na pagkakataon lamang.
- source_word: זָהָב טָהוֹר
  choice: sa purong ginto
  rationale: Malinaw nitong ipinapahayag ang materyal ng lahat ng nakalistang kagamitan. Inilipat sa unahan ng pangungusap para sa natural na daloy sa Tagalog nang hindi binabago ang saklaw nito.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “rin” upang natural na iugnay ang talata sa sunod-sunod na paggawa sa konteksto. Inilagay ang “sa purong ginto” malapit sa pandiwang “ginawa” upang malinaw na sumaklaw sa buong talaan.
