translation:
  language: tl
  text: Naghulma siya ng apat na singsing na ginto para rito at inilagay ang mga singsing sa apat na sulok, malapit sa apat nitong paa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa apat na sulok na nauukol sa apat nitong paa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Nagbuhos
  rationale: Sa konteksto ng paggawa ng mga kagamitang metal, tumutukoy ito sa pagbubuhos ng tunaw na metal sa hulma; natural sa Filipino ang “nagbuhos” para sa prosesong ito.
- source_word: לוֹ
  choice: para rito
  rationale: Ang hulapi ay tumutukoy sa mesang binanggit sa naunang konteksto; ang “rito” ay angkop sa bagay.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: apat na singsing na ginto
  rationale: Tuwirang inilalarawan ang apat na bilog na kabitan na yari sa ginto.
- source_word: וַיִּתֵּן
  choice: inilagay
  rationale: Malinaw at natural na salin para sa pagpoposisyon ng mga singsing sa mesa.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: sa apat na sulok
  rationale: Sa paglalarawan ng muwebles, ang פֵּאָה ay tumutukoy sa mga dulo o sulok; “sulok” ang pinakatumpak na larawan dito.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: na nasa apat na paa nito
  rationale: Pinananatili ang ugnayang panlunan ng mga sulok sa apat na paa ng mesa nang hindi dinaragdagan ang detalye.
