  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: tl
  text: Gumawa siya ng dalawang kerubin na gawa sa ginto; hinubog niya ang mga ito sa pagpukpok mula sa magkabilang dulo ng takip ng pagtubos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “luklukan ng awa.” Ang salitang Hebreo ay tumutukoy sa takip ng kaban na kaugnay ng pagtubos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Gumawa siya
  rationale: Ipinahihiwatig ng waw-consecutive ang kasunod na kilos sa salaysay. Likas sa modernong Tagalog ang “Gumawa siya” kahit hindi tahasang isalin ang pang-ugnay.
- source_word: שְׁנֵי כְרֻבִים
  choice: dalawang kerubin
  rationale: Ang “kerubin” ang nakikilalang anyong hiram para sa maramihan ng kerub at pinananatili nito ang natatanging larawan sa tabernakulo.
- source_word: זָהָב
  choice: na ginto
  rationale: Tinutukoy ng pangngalan ang materyal ng mga kerubin; maikli at natural sa Tagalog ang “dalawang kerubin na ginto.”
- source_word: מִקְשָׁה
  choice: sa pamamagitan ng pagpukpok
  rationale: Tumutukoy ang מִקְשָׁה sa metal na hinubog sa pagpukpok. Inilalarawan ng parirala ang paraan ng paggawa nang hindi ipinapalagay na “iisang piraso” ang tuwirang kahulugan ng salita.
- source_word: עָשָׂה אֹתָם
  choice: ginawa niya ang mga ito
  rationale: Pinananatili ang pag-uulit ng pandiwang עשה upang maipakita ang diin ng Hebreo sa pagkakagawa ng mga kerubin.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: mula sa magkabilang dulo
  rationale: Pinananatili ng “mula” ang diwa ng pinagmulan sa pang-ukol na מִן, samantalang natural na Tagalog ang “magkabilang dulo” para sa dalawang dulo.
- source_word: הַכַּפֹּרֶת
  choice: takip ng pagtubos
  rationale: Tinutukoy ng כַּפֹּרֶת ang gintong takip ng kaban na kaugnay ng ritwal ng pagtubos. Mas malinaw ito sa karaniwang mambabasa kaysa sa tradisyonal ngunit hindi gaanong tuwirang “luklukan ng awa.”
theological_decisions:
- issue: Pagpapakahulugan sa הַכַּפֹּרֶת sa konteksto ng tabernakulo
  choice: takip ng pagtubos
  alternative: luklukan ng awa; takip
  rationale: Pinagsasama ng “takip ng pagtubos” ang pisikal na gamit nito bilang takip ng kaban at ang kaugnayan nito sa pagtubos. Hindi nito ipinapalagay na literal itong upuan. Itinatala sa talababa ang tradisyonal na salin upang mapanatili ang leksikal at teolohikal na saklaw ng termino.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang pag-uulit ng “gumawa/ginawa” at ang diwang pinagmulan ng “mula,” habang ginawang natural ang paglalarawan sa pinukpok na ginto.
