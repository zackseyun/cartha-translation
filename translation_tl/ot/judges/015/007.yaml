  verdict: revise
  source_fidelity: 'Ang draft ay wasto sa pangkalahatang diwa: kinakausap ni Samson ang mga Filisteo, ipinahahayag ang paghihiganti laban sa kanila, at sinasabing titigil siya pagkatapos nito. Gayunman, ang כִּי אִם ay mas mainam na ipahayag bilang mariing katiyakan sa mismong pangakong maghihiganti, sa halip na gawing konstruksyong “hindi ... hangga''t hindi,” na bahagyang naglilipat ng diin at inuulit ang ideya ng pagtigil.'
  naturalness: Natural ang modernong Filipino ng draft, ngunit ang “hindi ako titigil hangga't hindi ... Pagkatapos niyon, titigil na ako” ay medyo paulit-ulit. Mas tuwiran at mas daloy ang paghahayag ng paghihiganti, kasunod ng pagtigil.
  terminology: Ang “maghihiganti ako sa inyo” ay angkop para sa נִקַּמְתִּי בָכֶם. Hindi kailangang ipasok ang tahasang panunumpa; ang “tiyak na” ay nagbibigay ng mariing puwersa nang hindi nagdaragdag ng pandiwang wala sa Hebreo.
  issues:
