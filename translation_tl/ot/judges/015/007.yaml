  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: tl
  text: Sinabi ni Samson sa kanila, “Kung ganiyan ang ginagawa ninyo, tiyak na maghihiganti ako sa inyo, at pagkatapos nito ay titigil na ako.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Kung ganiyan ang ginagawa ninyo
  rationale: Pinananatili ang kondisyunal na pahayag at ang pagtukoy ni Samson sa ginawa ng mga kausap niya.
- source_word: כִּי אִם
  choice: hindi ... hangga't hindi
  rationale: 'Sa kontekstong ito, ang idyoma ay nagpapahayag ng mariing pasiya: hindi siya titigil bago maisagawa ang paghihiganti. Hindi ito kailangang gawing panunumpa, sapagkat walang tahasang pandiwa ng pagsumpa sa Hebreo.'
- source_word: נִקַּמְתִּי בָכֶם
  choice: nakapaghiganti sa inyo
  rationale: Tuwirang inilalarawan ang paghihiganti laban sa mga Filisteo, habang ang aspektong ganap ng Hebreo sa kondisyunal na pahayag ay likas na naipapahayag sa Filipino sa anyong 'nakapaghiganti.'
- source_word: וְאַחַר אֶחְדָּל
  choice: Pagkatapos niyon, titigil na ako
  rationale: Pinananatili ang pagkakasunod ng mga pangyayari at ang diin na titigil lamang siya pagkatapos ng paghihiganti.
theological_decisions:
- issue: Kung panunumpa ba ang כִּי אִם
  choice: Mariing pasiya ang isinalin, hindi tahasang panunumpa
  alternative: “isinusumpa kong maghihiganti ako”
  rationale: Maaaring magkaroon ng panunumpang puwersa ang pormula sa ilang konteksto, ngunit walang tahasang salita para sa pagsumpa rito. Ang 'hindi ako titigil hangga't hindi...' ay nagpapanatili ng matinding determinasyon nang hindi nagdaragdag ng di-tiyak na panunumpa.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “ganiyan” para sa kilos ng mga kausap at ang karaniwang pariralang “hangga't hindi” upang malinaw na maipahayag ang mariing kondisyong nasa Hebreo.
