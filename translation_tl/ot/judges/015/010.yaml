base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: tl
  text: Sinabi ng mga lalaki ng Juda, “Bakit kayo umahon laban sa amin?” Sumagot sila, “Umahon kami upang gapusin si Samson at gawin sa kanya ang gaya ng ginawa niya sa amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: mga lalaki ng Juda
  rationale: Bagaman isahan ang anyong אִישׁ, kolektibo ang gamit nito at may kasamang pandiwang maramihan. Pinananatili ng “mga lalaki ng Juda” ang panlalaking kolektibong diwa.
- source_word: לָמָה
  choice: Bakit
  rationale: Ito ang likas at tuwirang makabagong katumbas ng tanong tungkol sa dahilan.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: kayo umahon laban sa amin
  rationale: Pinananatili ng “umahon” ang direksiyonal na larawan ng עלה, samantalang malinaw na ipinahihiwatig ng “laban sa amin” ang pagkapoot nang hindi tahasang dinaragdagan bilang “sinalakay.”
- source_word: לֶאֱסוֹר
  choice: upang gapusin
  rationale: Ang אָסַר ay nangangahulugang itali o gapusin; ang “gapusin” ay angkop sa layuning dakpin at pigilan si Samson.
- source_word: עָלִינוּ
  choice: Umahon kami
  rationale: Inuulit sa Hebreo ang pandiwang עלה mula sa tanong. Pinananatili rin ang pag-uulit sa salin upang makita ang leksikal na ugnayan.
- source_word: לַעֲשׂוֹת לוֹ
  choice: gawin sa kanya
  rationale: Sa konteksto ng pagganti, ang עשה + ל ay nangangahulugang gawin sa isang tao, hindi gawin para sa kanyang kapakinabangan.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: ang ginawa niya sa amin
  rationale: 'Likas sa Filipino ang anyong ito at malinaw nitong pinananatili ang katumbasang gumaganti: ang gagawin sa kanya ay gaya ng ginawa niya sa kanila.'
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa makabagong saling Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “umahon” sa dalawang bahagi upang mapanatili ang pag-uulit at heograpikal na larawan ng Hebreo; nananatiling malinaw ang mapanlabang diwa sa pariralang “laban sa amin.”
