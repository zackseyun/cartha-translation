translation_notes:
  register: Makabago, natural, at marangal na Filipino ang ginamit. Iniwasan ang sobrang literal na panimulang “at nangyari” at ang tahasang seksuwal na pagpapaliwanag, upang mapanatili ang di-tuwirang pahayag at pahiwatig ng Hebreo.
