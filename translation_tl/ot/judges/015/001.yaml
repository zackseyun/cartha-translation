  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: tl
  text: Makalipas ang ilang araw, sa panahon ng anihan ng trigo, dinalaw ni Samson ang kanyang asawa na may dalang isang batang kambing. Sinabi niya, “Hayaan ninyo akong pumasok sa aking asawa, sa silid[a].” Ngunit hindi siya pinahintulutan ng ama nito na pumasok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa panloob na silid.” Malamang na tumutukoy ang Hebreo sa isang silid sa loob ng bahay; sa konteksto, ipinahihiwatig nito ang pribadong silid ng mag-asawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Pagkaraan ng ilang panahon
  rationale: Ipinapahayag ng idyoma ang paglipas ng di-tiyak na haba ng panahon. Likas ito sa modernong Tagalog at hindi labis na nililimitahan sa literal na ilang araw.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: nang panahon ng pag-aani ng trigo
  rationale: Malinaw na pinananatili ang tiyak na panahong pang-agrikultura na binanggit sa Hebreo.
- source_word: וַיִּפְקֹד
  choice: dinalaw
  rationale: Sa kontekstong ito, ang pandiwa ay tumutukoy sa pagdalaw o pagpunta upang makita ang isang tao, hindi sa pagbilang, paghirang, o pagpaparusa.
- source_word: אֶת אִשְׁתּוֹ
  choice: ang kanyang asawa
  rationale: Tuwirang pinananatili ang pagkakakilanlan sa babae bilang asawa ni Samson, kahit magulo na ang kanilang ugnayan sa konteksto.
- source_word: בִּגְדִי עִזִּים
  choice: na may dalang isang batang kambing
  rationale: Ipinakikita ng parirala na dala ni Samson ang batang kambing, malamang bilang handog o regalo, nang hindi idinaragdag iyon sa pangunahing teksto.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Papasok ako sa kinaroroonan ng asawa ko
  rationale: Pinananatili nito ang ideya ng pagpasok patungo sa asawa at ang pahiwatig ng pribadong pagsasama, ngunit hindi tahasang binibigyang-kahulugan ang eupemismo bilang pakikipagtalik.
- source_word: הֶחָדְרָה
  choice: sa loob ng silid
  rationale: Ang anyong may direksiyon ay tumutukoy sa pagpasok sa silid o panloob na kuwarto. Ang “silid” ay dignified at karaniwang salitang Tagalog nang hindi labis na tinutukoy ito bilang kuwartong tulugan.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Ngunit hindi siya pinayagang papasukin ng ama nito
  rationale: Malinaw nitong ipinahahayag ang aktibong pagtanggi ng ama na bigyan si Samson ng daan papasok, at inuulit ang motibo ng pagpasok.
