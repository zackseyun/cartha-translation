revisions:
- from: Sinabi nila sa kanya, “Hindi. Tiyak na igagapos ka namin at ibibigay sa kamay nila[a], pero hinding-hindi ka namin papatayin.” Kaya iginapos nila siya ng dalawang bagong lubid at iniahon mula sa bato[b].
  to: Sinabi nila sa kanya, “Hindi; sa halip, tiyak na igagapos ka namin at ibibigay ka namin sa kanilang kamay, ngunit hinding-hindi ka namin papatayin.” Kaya iginapos nila siya ng dalawang bagong lubid at iniahon mula sa bato[b].
  rationale: Nilinaw ang ugnayang pananggi at pangwasto sa unang tugon at tahasang ibinalik ang layong ‘ka’ sa ‘ibibigay ka namin.’ Hindi binago ang kahulugan, diin, o saklaw ng mga posibleng kahulugan ng סלע. Inilipat ang anchor [a] sa pariralang ‘kanilang kamay,’ kung saan ito dapat nakadugtong.
