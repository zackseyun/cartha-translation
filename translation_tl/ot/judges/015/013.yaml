translation_notes:
  register: Makabago at dignidad na Filipino; ginamit ang “igagapos” at “iginapos” para sa pagkakapare-pareho, habang ang mariing mga anyong Hebreo ay likas na ipinahayag sa “tiyak” at “hinding-hindi.”
