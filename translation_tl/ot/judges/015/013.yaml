base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: tl
  text: Sinabi nila sa kanya, “Hindi; sa halip, tiyak na igagapos ka namin at ibibigay ka namin sa kanilang kamay, ngunit hinding-hindi ka namin papatayin.” Kaya iginapos nila siya ng dalawang bagong lubid at iniahon mula sa bato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O “mula sa batuhang bangin.” Ang salitang Hebreo ay maaaring tumukoy sa bato, batuhang mataas na lugar, o bangin.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Hindi. ... pero
  rationale: Ipinapakita ng hiwalay na “Hindi” ang pagtanggi sa hinihinging panunumpa ni Samson, at natural na ipinahahayag ng kasunod na pangungusap ang paglilinaw ng kanilang gagawin.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: Tiyak na igagapos ka namin
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa pagkakagapos; malinaw at natural itong naipahahayag ng “tiyak.”
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: ibibigay sa kamay nila
  rationale: Pinananatili nito ang Hebreong larawang “kamay,” na tumutukoy rin sa kapangyarihan o kontrol ng mga Filisteo.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: pero hinding-hindi ka namin papatayin
  rationale: Ipinahahayag ng “hinding-hindi” ang mariing pagtanggi na sila mismo ang papatay kay Samson.
- source_word: וַיַּאַסְרֻהוּ
  choice: iginapos nila siya
  rationale: Pinananatili ang parehong salitang-ugat sa naunang pangakong igagapos siya.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: dalawang bagong lubid
  rationale: Ang עֲבֹתִים ay makakapal na panali o lubid; ang “lubid” ang pinakakaraniwang malinaw na katumbas, at mahalaga sa salaysay ang pagiging bago ng mga ito.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: iniahon mula sa bato
  rationale: Ipinahihiwatig ng causative na pandiwa ang pagdadala sa kanya paitaas; pinananatili ng “bato” ang malawak na kahulugan ng סֶלַע nang hindi tiyak na nagpapasya kung ito ay bangin, malaking bato, o batuhang kuta.
