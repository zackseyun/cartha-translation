  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן נִקֵּ֥יתִי הַ/פַּ֖עַם מִ/פְּלִשְׁתִּ֑ים כִּֽי עֹשֶׂ֥ה אֲנִ֛י עִמָּ֖/ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: tl
  text: Sinabi ni Samson sa kanila, “Sa pagkakataong ito, hindi ako masisisi kaugnay ng mga Filisteo[a] kapag pininsala ko sila[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “wala akong sala kaugnay ng mga Filisteo,” ibig sabihin, malaya ako sa pananagutan may kinalaman sa kanila.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “gumagawa ako ng masama sa kanila.” Dito, ipinahahayag ng “pininsala” ang mapanlabang pananakit ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pasulong na pagsasalaysay sa Tagalog; hindi kailangang laging tumbasan ng tahasang pangatnig ang Hebrew wayyiqtol.
- source_word: לָהֶם
  choice: sa kanila
  rationale: Tuwirang ipinapakita ang pang-ukol at panlaping panghalip na panlalaking maramihan.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Ginamit ang kinagawiang anyo ng pangalang ito sa makabagong saling Filipino.
- source_word: נִקֵּיתִי
  choice: hindi ako masisisi
  rationale: Ipinahahayag ng נקה ang pagiging malaya sa sala o pananagutan. Natural sa Filipino ang pariralang ito at malinaw na pahayag ito ni Samson tungkol sa pananagutan niya.
- source_word: הַפַּעַם
  choice: Sa pagkakataong ito
  rationale: Pinananatili ang pansamantalang paghahambing sa naunang yugto ng alitan.
- source_word: מִפְּלִשְׁתִּים
  choice: kaugnay ng mga Filisteo
  rationale: Ang מִן kasunod ng נקה ay tumutukoy sa pagiging malaya sa pananagutan may kinalaman sa isang pangkat; iniiwasan nitong gawing tahasang ahente ng paninisi ang mga Filisteo.
- source_word: כִּי
  choice: kapag
  rationale: Likas nitong ipinakikilala sa Filipino ang kalagayan o pagkakataong saklaw ng pahayag ni Samson, habang pinananatili ang posibleng nalalapit na kilos.
- source_word: עֹשֶׂה אֲנִי
  choice: pininsala ko
  rationale: Ang participle na may tahasang panghalip ay maaaring tumukoy sa isinasagawa o nalalapit na kilos; sa sugnay na may “kapag,” natural na ipinahahayag ng Filipino ang nilalayong kilos.
- source_word: עִמָּם רָעָה
  choice: pininsala ko sila
  rationale: Sa konteksto ng paghihiganti, ang idyomang “gumawa ng masama sa/sa piling nila” ay tumutukoy sa mapaminsalang pagkilos laban sa kanila, nang hindi kailangang magpasya kung ito ay moral na paghatol ng tagapagsalaysay.
theological_decisions:
- issue: Kung ang pagiging walang sala ni Samson ay hatol ng tagapagsalaysay o sariling pag-aangkin niya
  choice: 'Iniharap ito bilang sinabi at pag-aangkin ni Samson: “hindi ako masisisi.”'
  alternative: Ipakahulugang pinawawalang-sala siya ng tagapagsalaysay o ng Diyos.
  rationale: Nasa tuwirang pananalita ni Samson ang pahayag; hindi sinasabi ng talata na sinasang-ayunan ng tagapagsalaysay ang moral na katuwiran ng gagawin niya.
- issue: Moral na bigat ng רָעָה
  choice: “pininsala” sa pangunahing teksto, na may talababa para sa literal na “ginawan ng masama.”
  alternative: “ginawan ko sila ng kasamaan,” na maaaring magpahiwatig ng mas tiyak na moral na paghatol.
  rationale: Maaaring mangahulugan ang רָעָה ng kasamaan o konkretong kapinsalaan. Sa kontekstong ito, pinananatili ng “pinsala” ang marahas at mapanlabang diwa nang hindi nilulutas nang labis ang moral na tensiyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang “kaugnay ng” ay bahagyang pormal ngunit angkop upang mapanatili ang di-tiyak na ugnayang ipinahahayag ng Hebreong pang-ukol, at ang “hindi ako masisisi” ay mas natural kaysa sa literal ngunit mabigat na “malaya ako sa sala.”
