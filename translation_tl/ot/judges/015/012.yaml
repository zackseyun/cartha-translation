base_translation:
  language: en
  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: tl
  text: Sinabi nila sa kanya, “Bumaba kami upang gapusin ka at ipasa ka sa mga Filisteo.” Sinabi ni Samson sa kanila, “Sumumpa kayo sa akin na kayo mismo ay hindi sasalakay sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאֱסָרְךָ
  choice: upang gapusin ka
  rationale: Tuwirang ipinapahayag ang layunin ng pagbaba nila at pinananatili ang konkretong diwa ng Hebreong pandiwang ‘gapusin.’
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: ibigay ka sa kamay ng mga Filisteo
  rationale: Pinananatili ang Hebreong idyomang ‘ibigay sa kamay,’ na likas ding mauunawaan sa Filipino bilang pagpapasailalim sa kapangyarihan ng mga Filisteo.
- source_word: פֶּן תִּפְגְּעוּן בִּי אַתֶּם
  choice: na hindi ninyo ako sasaktan
  rationale: Ang פגע ay maaaring mangahulugang salakayin o saktan sa kontekstong ito. Ang ‘sasaktan’ ay natural at sapat na malawak, habang ang ‘ninyo’ ay nagpapahiwatig ng mariing אַתֶּם, na tumutukoy sa kanila mismo bilang kaibahan sa mga Filisteo.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Pinanatili ang salitang ‘bumaba’ bilang mahalagang detalye ng salaysay at ang idyomang ‘sa kamay’ upang mapanatili ang kulay ng Hebreo nang hindi nagiging di-likas.
