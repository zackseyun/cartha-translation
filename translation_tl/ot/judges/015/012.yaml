revisions:
- from: Sinabi nila sa kanya, “Bumaba kami upang gapusin ka at ibigay ka sa kamay ng mga Filisteo.” Sinabi sa kanila ni Samson, “Sumumpa kayo sa akin na hindi ninyo ako sasaktan.”
  to: Sinabi nila sa kanya, “Bumaba kami upang gapusin ka at ipasa ka sa mga Filisteo.” Sinabi ni Samson sa kanila, “Sumumpa kayo sa akin na kayo mismo ay hindi sasalakay sa akin.”
  rationale: Inayos ang huling pahayag upang maipakita ang mariing pagtukoy sa mga kausap ni Samson mismo at ang diwa ng pag-atake. Ginawang 'ipasa ka sa mga Filisteo' ang idyoma upang maging likas sa Filipino nang hindi binabago ang kahulugang ibigay siya sa kanilang kapangyarihan.
