base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: tl
  text: Sinindihan niya ang mga sulo at pinakawalan niya ang mga ito sa gitna ng mga tanim na butil na nakatayo pa ng mga Filisteo[a]. Sinunog niya ang lahat, mula sa mga bunton ng inaning butil hanggang sa mga tanim na butil na nakatayo pa, hanggang sa mga taniman ng olibo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga sulo” ay maaari ring isaling “mga paningas,” ibig sabihin, mga nagliliyab na pamalo.
    reason: lexical_alternative
  - marker: b
    text: 'Sa Hebreo: “mula sa bunton ng inaning butil hanggang sa nakatayong pananim na butil at hanggang sa taniman ng olibo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: Sinilaban niya ang mga sulo
  rationale: Ang Hiphil ng בער kasama ng אֵשׁ ay nangangahulugang nagsindi o naglagay ng apoy. Ang “sinilaban” ay likas at tuwirang Filipino; ang לַפִּידִים ay maaaring tumukoy sa mga sulo o paniningas.
- source_word: וַיְשַׁלַּח
  choice: pinakawalan ang mga iyon
  rationale: Maaaring mangahulugang “ipinadala” o “pinakawalan.” Sa konteksto ng naunang talata, ang pinakawalan ay ang mga hayop na kinabitan ng mga sulo, ngunit hindi inuulit dito ang tahasang pangngalan kaya pinananatili ang panghalip.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: sa nakatayong trigo ng mga Filisteo
  rationale: Ang קָמָה ay pananim na butil na nakatayo pa at hindi pa ginagapas. Ginamit ang “trigo” bilang likas na katawagan sa butil na pananim sa konteksto, bagaman mas pangkalahatan ang salitang Hebreo.
- source_word: מִגָּדִישׁ
  choice: ang nakasalansang ani
  rationale: Ang גָּדִישׁ ay bunton o salansan ng nagapas na butil. Iniiwasan ng “nakasalansang ani” ang di-pamilyar na terminong pansakahan habang malinaw na ipinakikita ang kaibhan nito sa pananim na nakatayo pa.
- source_word: וְעַד קָמָה
  choice: ang nakatayong trigo
  rationale: Ang pariralang מִן...וְעַד ay literal na nagsasaad ng lawak, “mula...hanggang....” Isinalin dito bilang talaan ng lahat ng nasunog upang maging natural sa Filipino, nang hindi binabago ang saklaw.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: at maging ang mga taniman ng olibo
  rationale: Ang כֶּרֶם ay isang nilinang na taniman at nililinaw ng זַיִת na olibo ang itinatanim. Ang “maging” ay nagpapahiwatig ng sukdulang lawak ng pinsala.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang pagkakaiba ng inaning butil na nakasalansan at ng pananim na nakatayo pa. Ginamit ang “pinakawalan ang mga iyon” upang hindi magdagdag ng tahasang reperente na wala sa talata, habang nananatiling mauunawaan mula sa konteksto.
