base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: tl
  text: Sinabi ng mga Filisteo, “Sino ang gumawa nito?” Sumagot sila, “Si Samson, na manugang ng taga-Timnah, dahil kinuha ng taga-Timnah ang asawa ni Samson at ibinigay ito sa kasamahan niya.[a]” Kaya umahon ang mga Filisteo at sinunog sa apoy ang asawa ni Samson at ang kanyang ama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaibigan niya.” Sa konteksto ng kasalan, inuunawa ito ng ilan bilang “abay na lalaki” o pinakamalapit na kasama ng lalaking ikakasal.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sinunog nila siya at ang kanyang ama sa apoy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang katawagan sa pangkat na ito sa Tagalog; likas na ipinahihiwatig ng “mga” ang tiyak at kilalang pangkat sa konteksto.
- source_word: מִי עָשָׂה זֹאת
  choice: Sino ang gumawa nito?
  rationale: Direkta at natural na tanong sa makabagong Tagalog, ayon sa payak na diwa ng Hebreong pananalita.
- source_word: חֲתַן הַתִּמְנִי
  choice: manugang ng taga-Timnah
  rationale: Maaaring tumukoy ang חָתָן sa lalaking kaugnay sa pag-aasawa, kabilang ang lalaking ikakasal o manugang. Sa konteksto, si Samson ang asawa ng anak ng taga-Timnah, kaya pinakamalinaw ang “manugang.”
- source_word: כִּי
  choice: dahil
  rationale: Ipinakikilala nito ang dahilan kung bakit si Samson ang tinukoy na gumawa ng pinsala.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: kinuha ng taga-Timnah ang asawa ni Samson
  rationale: Hayag sa konteksto na ang ama ng babae ang kumuha sa asawa ni Samson. Inulit ang mga tinutukoy sa halip na gumamit ng malalabong panghalip sa Tagalog.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: ibinigay ito sa kasamahan niya
  rationale: Ang מֵרֵעַ ay maaaring mangahulugang kasamahan o kaibigan. Pinananatili ng “kasamahan” ang lawak ng kahulugan nang hindi tiyak na ipinapalagay ang isang pormal na papel sa kasalan.
- source_word: וַיַּעֲלוּ
  choice: pumunta roon
  rationale: Ang literal na “umakyat” ay karaniwang Hebreong idyoma ng paglalakbay. Mas natural sa Tagalog ang “pumunta roon” kapag walang mahalagang impormasyong topograpiko sa talata.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: sinunog sa apoy ang babae at ang kanyang ama
  rationale: Pinananatili ang tahasang pagbanggit sa apoy at hindi idinaragdag ang “hanggang mamatay,” bagaman ipinahihiwatig iyon ng konteksto.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Nilinaw ang mga tinutukoy ng mga panghalip kung kailangan upang maiwasan ang kalituhan, ngunit pinanatili ang hindi tiyak na saklaw ng salitang tumutukoy sa kasamahan ni Samson.
