revisions:
- from: Sinabi ng mga Filisteo, “Sino ang gumawa nito?” Sumagot sila, “Si Samson, na manugang ng taga-Timnah, dahil kinuha ng taga-Timnah ang asawa ni Samson at ibinigay ito sa kasamahan niya.[a]” Kaya pumunta roon ang mga Filisteo at sinunog sa apoy ang babae at ang kanyang ama.[b]
  to: Sinabi ng mga Filisteo, “Sino ang gumawa nito?” Sumagot sila, “Si Samson, na manugang ng taga-Timnah, dahil kinuha ng taga-Timnah ang asawa ni Samson at ibinigay ito sa kasamahan niya.[a]” Kaya umahon ang mga Filisteo at sinunog sa apoy ang asawa ni Samson at ang kanyang ama.[b]
  rationale: Pinalitan ang “pumunta roon” ng “umahon” upang mapanatili ang pandiwang Hebreo na ויעלו. Pinalitan ang “ang babae” ng “ang asawa ni Samson” para sa malinaw na pagtukoy sa antecedent nang walang pagbabago sa diwa. Inayos ang footnote b upang tapat nitong maipakita ang literal na Hebreong ayos at ang instrumental na “sa apoy.”
