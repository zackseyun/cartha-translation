base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: tl
  text: Sinabi ng ama ng babae, “Talagang inakala kong galit na galit ka sa kanya, kaya ibinigay ko siya sa iyong kasamahan.[a] Hindi ba mas mabuti ang nakababata niyang kapatid na babae kaysa sa kanya? Pakiusap, kunin mo na lamang siya sa halip niya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaibigan.” Malawak ang kahulugan ng salitang Hebreo at maaaring tumukoy sa isang kaibigan, kasama, o kasamahan. Sa konteksto ng kasalan, ipinapalagay ng ilan na ito ang lalaking nagsilbing kasamahan ni Samson.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיהָ
  choice: ama niya
  rationale: Ang pangngalan na may hulaping pambabae ay tumutukoy sa ama ng babaeng nabanggit sa konteksto; natural sa Filipino ang “ama niya.”
- source_word: אָמֹר אָמַרְתִּי
  choice: Talagang inakala ko
  rationale: Ang infinitive absolute na sinusundan ng perfect ay nagbibigay-diin; malinaw at natural na naipahahayag ito ng “talagang inakala ko.”
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: galit na galit ka sa kanya
  rationale: Ang inuulit na anyo ng pandiwa ay matinding pagpapahayag ng pagkapoot; ang idyomang Filipino na “galit na galit” ay nagpapanatili ng diin nang hindi tunog salin-salita.
- source_word: וָאֶתְּנֶנָּה
  choice: kaya ibinigay ko siya
  rationale: Sa pangangatwiran ng ama, ang pagbibigay sa babae ay bunga ng kaniyang palagay, kaya ang “kaya” ay angkop sa ugnayang lohikal.
- source_word: לְמֵרֵעֶךָ
  choice: sa iyong kasamahan
  rationale: Ang מֵרֵעַ ay maaaring tumukoy sa kaibigan o kasamahan. Pinananatili ng “kasamahan” ang malawak na kahulugan at hindi ipinapalagay ang tiyak na papel sa kasalan.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Natural itong panimula sa isang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: ang nakababata niyang kapatid
  rationale: Sa ugnayan ng magkapatid, ang קְטַנָּה ay likas na tumutukoy sa mas bata; malinaw sa konteksto na babae ang kapatid.
- source_word: טוֹבָה מִמֶּנָּה
  choice: mas mabuti ... kaysa sa kanya
  rationale: Pinananatiling malawak ng “mas mabuti” ang טוֹבָה at hindi ito nililimitahan sa pisikal na kagandahan.
- source_word: תְּהִי נָא לְךָ
  choice: Pakiusap, kunin mo na lamang siya
  rationale: Ang jussive na may נָא ay magalang na pakiusap. Sa konteksto ng pag-aalok sa kapatid bilang asawa, natural sa Filipino ang “kunin mo,” ngunit hindi tahasang dinaragdagan ng salitang “asawa.”
- source_word: תַּחְתֶּיהָ
  choice: bilang kapalit niya
  rationale: Malinaw na ipinahahayag nito ang pagpapalit o paghalili na nasa תַּחַת.
