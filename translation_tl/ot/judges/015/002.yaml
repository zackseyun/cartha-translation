translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “galit na galit” upang maipahayag ang diin ng Hebreo, at pinanatiling malawak ang “mas mabuti” at “kasamahan” upang hindi paliitin ang tunay na saklaw ng orihinal.
