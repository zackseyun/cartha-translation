base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: tl
  text: Kaya umalis si Shimshon at nanghuli ng tatlong daang soro[a]. Kumuha siya ng mga sulo, itinapat niya ang mga ito nang buntot sa buntot, at naglagay siya ng tig-isang sulo sa gitna ng bawat dalawang buntot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “chakal.” Ang salitang Hebreo na שׁוּעָלִים ay maaaring tumukoy sa mga soro o sa kahawig na mga hayop mula sa pamilya ng aso, gaya ng mga chakal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Likas na salaysay na katumbas ng הלך dito, na nagpapahiwatig na humayo si Shimshon upang isagawa ang sumunod na kilos.
- source_word: שִׁמְשׁוֹן
  choice: Shimshon
  rationale: Tuwirang transliterasyon ng pangalang Hebreo sa anyong madaling basahin sa Filipino.
- source_word: וַיִּלְכֹּד
  choice: nanghuli
  rationale: Ang לכד ay tumutukoy rito sa paghuli sa mga buhay na hayop; natural at tumpak ang 'nanghuli'.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: tatlong daan
  rationale: Tuwirang katumbas ng bilang.
- source_word: שׁוּעָלִים
  choice: mga soro
  rationale: Karaniwan at tradisyonal na kahulugan ng שׁוּעָלִים; pinananatili sa talababa ang posibleng 'mga chakal' dahil maaaring tumukoy ang salita sa magkahawig na canid.
- source_word: לַפִּדִים / לַפִּיד
  choice: mga sulo / sulo
  rationale: Malinaw na modernong katumbas para sa nagliliyab na sulo o brand.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: pinagtapat ang mga buntot ng mga ito
  rationale: Ipinahahayag ang literal na ideya ng pagharap o pag-aayos ng buntot sa buntot nang hindi idinaragdag na itinali ang mga ito, na hindi tahasang sinasabi ng Hebreo.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: naglagay ng tig-isang sulo
  rationale: Ang 'tig-isa' ay natural na naghahayag ng inuulit na paglalagay sa bawat pares.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: sa gitna ng bawat dalawang buntot
  rationale: Pinagsasama ang literal na 'sa pagitan ng dalawang buntot' at 'sa gitna' sa malinaw na Filipino, habang ipinakikitang inulit ito sa bawat pares.
