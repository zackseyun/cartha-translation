language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: tl
  text: Pagkatapos, biniyak ng Diyos ang guwang na nasa Lehi[a], at may tubig na lumabas mula roon. Nang makainom si Samson, nanumbalik ang kanyang sigla at muli siyang lumakas. Kaya pinangalanan niya ang bukal na iyon na En-hakkore[b], na nasa Lehi hanggang sa araw na ito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa ibang pagbasa sa tagpo, “biniyak ng Diyos ang guwang sa panga, at may tubig na lumabas mula rito.”
    reason: alternative_reading
  - marker: b
    text: Ang En-hakkore ay malamang na nangangahulugang “Bukal ng Tumatawag” o “Bukal ng tumawag,” na tumutukoy sa pagdaing ni Samson sa Diyos.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: binuksan
  rationale: Ang pandiwa ay tumutukoy sa puwersahang pagbiyak o pagbukas. Sa Filipino, natural ang “binuksan” sa isang guwang na pinagmulan ng tubig; ang puwersahang diwa ay ipinahihiwatig ng mahimalang kilos ng Diyos.
- source_word: הַמַּכְתֵּשׁ
  choice: ang guwang
  rationale: Bagaman maaari itong mangahulugang “almires” o hugis-almires na hukay, sa konteksto ay isang guwang o uka sa lugar ang tinutukoy.
- source_word: בַּלֶּחִי
  choice: nasa Lehi
  rationale: Mas malamang na pangalan ng lugar ang Lehi rito, lalo na dahil inuulit ito sa pangwakas na sugnay. Hindi isinasara ang alternatibong “sa panga,” na inilagay sa talababa.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: may tubig na lumabas mula roon
  rationale: Natural na Filipino ito at malinaw na inuugnay ang tubig sa guwang na binuksan.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: nanumbalik ang kanyang sigla
  rationale: Ang רוּחַ ay maaaring tumukoy sa espiritu, hininga, o lakas-buhay. Sa kalagayan ni Samson na halos manghina sa uhaw, malinaw at natural ang “sigla” nang hindi nagpapahiwatig na namatay siya.
- source_word: וַיֶּחִי
  choice: nabuhayan siya
  rationale: Ipinahihiwatig nito ang pagpapanumbalik ng lakas at buhay, hindi pagkabuhay na muli mula sa kamatayan.
- source_word: עֵין הַקּוֹרֵא
  choice: En-hakore
  rationale: Pinanatili bilang pangalan ng lugar/bukal sa pangunahing teksto, habang ipinaliliwanag sa talababa ang mahalagang kahulugan nito.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang salin ng karaniwang pormulang Hebreo at likas pa rin sa marangal na Filipino.
theological_decisions:
- issue: Ang tinutukoy ng בַּלֶּחִי at kinaroroonan ng pinagmulan ng tubig
  choice: Itinuring ang Lehi bilang pangalan ng lugar, at ang tubig ay lumabas mula sa isang guwang doon.
  alternative: Binuksan ng Diyos ang guwang sa panga, at mula sa panga lumabas ang tubig.
  rationale: Ang paulit-ulit na paggamit sa Lehi bilang lokasyon, lalo na ang pangwakas na “nasa Lehi hanggang sa araw na ito,” ay higit na sumusuporta sa heograpikong pagbasa. Gayunman, tunay na posible sa bokabularyo at kasaysayan ng pagbasa ang pagtukoy sa buto ng panga, kaya pinanatili ito sa talababa.
- issue: Kahulugan ng וַתָּשָׁב רוּחוֹ
  choice: “nanumbalik ang kanyang sigla,” bilang pagpapanumbalik ng lakas-buhay matapos uminom
  alternative: “nanumbalik ang kanyang espiritu” o “nanumbalik ang kanyang hininga”
  rationale: Malawak ang saklaw ng רוּחַ. Ang konteksto ay pisikal na panghihina dahil sa uhaw, kaya ang “sigla” ay natural at hindi nagpapasok ng doktrina tungkol sa kaluluwa o muling pagkabuhay.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang pangalang “Samson” upang luminaw ang paksa sa Filipino. Pinanatili ang pangalang En-hakore at ipinaliwanag ang kahulugan nito sa talababa. Ang mga marker [a] at [b] ay kapwa nasa pangunahing teksto at tumutugma sa mga talababa.
