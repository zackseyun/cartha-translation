  naturalness: Maayos ang daloy ng Filipino. Ang binagong “biniyak” at “muli siyang lumakas” ay mas tuwiran at idiomatiko sa konteksto ng matinding uhaw.
  terminology: Ang pangalan ay dapat na En-hakkore, na mas malapit sa עֵין הַקּוֹרֵא at sa audit trail. Pinanatili ang Lehi bilang pangalan ng lugar at ang “bukal” bilang malinaw na tinutukoy ng pangalan ng lugar.
