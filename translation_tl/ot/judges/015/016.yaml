  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikli at matagumpay na himig ng patulang sigaw ni Samson, pati ang di-pangkaraniwang pariralang “isang bunton, dalawang bunton,” habang ipinaliliwanag sa talababa ang hindi maisasaling paglalaro sa tunog ng mga salitang Hebreo.
