  text: Then Samson said[a], “With the jawbone of a donkey, a heap, two heaps; with the jawbone of a donkey I have struck down a thousand men.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Samson[a], “Sa pamamagitan ng panga ng asno, isang bunton, dalawang bunton; sa pamamagitan ng panga ng asno, pinabagsak ko ang isang libong lalaki.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: May paglalaro ng salita sa Hebreo sa pagitan ng mga salitang isinaling “asno” at “bunton.” Sinisikap ng “isang bunton, dalawang bunton” na panatilihin ang literal at patulang anyo ng pahayag.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Ipinahihiwatig ng waw-consecutive ang pagsulong ng salaysay; natural sa makabagong Filipino ang “Pagkatapos ay sinabi” habang pinananatili ang pagkakasunod-sunod.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Ito ang nakaugaliang anyo ng pangalan sa Filipino.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: Sa panga ng asno
  rationale: Ang לְחִי ay ‘panga’ o ‘buto ng panga,’ at ang בְּ ay nagpapahayag ng kasangkapang ginamit. Sa Filipino, sapat at natural ang “sa panga” upang tukuyin ang panga bilang sandata.
- source_word: חֲמוֹר
  choice: asno
  rationale: Ang “asno” ang malinaw at karaniwang salitang Filipino para sa donkey at angkop sa marangal na rehistro ng salin.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: isang bunton, dalawang bunton
  rationale: Pinananatili nito ang kapansin-pansing literal at patulang anyo ng Hebreo, kasama ang dual na pahayag, nang hindi tahimik na nilulutas bilang “bunton-bunton.” Hindi maililipat nang natural sa Filipino ang tunog na paglalaro sa pagitan ng ‘asno’ at ‘bunton,’ kaya ipinaliliwanag ito sa talababa.
- source_word: הִכֵּיתִי
  choice: pinabagsak ko
  rationale: Ang נכה ay nangangahulugang humampas o magpabagsak. Sa kontekstong pandigma, ipinahihiwatig nito ang pagkatalo at pagkamatay, ngunit hindi ito tahasang pinalalawak sa “pinatay ko.”
- source_word: אֶלֶף אִישׁ
  choice: isang libong lalaki
  rationale: Kolektibo rito ang panlalaking אִישׁ at tumutukoy sa mga lalaking kalaban sa kontekstong pandigma.
