  to: Bumaba ang tatlong libong lalaki mula sa Juda patungo sa siwang ng batong Etam[a] at sinabi nila kay Samson, “Hindi mo ba alam na namumuno sa atin ang mga Filisteo? Ano itong ginawa mo sa amin?” Sinabi niya sa kanila, “Kung ano ang ginawa nila sa akin, iyon din ang ginawa ko sa kanila.”
