  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: tl
  text: Bumaba ang tatlong libong lalaki mula sa Juda patungo sa siwang ng batong Etam[a] at sinabi nila kay Samson, “Hindi mo ba alam na namumuno sa atin ang mga Filisteo? Ano itong ginawa mo sa amin?” Sinabi niya sa kanila, “Kung ano ang ginawa nila sa akin, iyon din ang ginawa ko sa kanila.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “biyak ng bato sa Etam.”
    reason: Leksikal at sintaktikong alternatibo para sa bihirang salitang סְעִיף at sa ugnayan ng “bato” at “Etam.”
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Bumaba
  rationale: Pinananatili ang direksiyong pababa ng pandiwang ירד sa isang natural na anyong pasalaysay sa Tagalog.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: ang tatlong libong lalaki mula sa Juda
  rationale: Tumpak na ipinahahayag ang bilang at ang panlalaking pangkat; likas sa Tagalog ang “mula sa Juda” bilang pagtukoy sa kanilang pinagmulan o kinabibilangan.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: patungo sa siwang ng batong Etam
  rationale: Ang סְעִיף ay maaaring tumukoy sa siwang o biyak sa batuhan. Pinili ang “siwang” bilang malinaw at likas na topograpikong paglalarawan, habang pinananatili ang Etam bilang pangalang pantangi.
- source_word: הֲלֹא יָדַעְתָּ
  choice: Hindi mo ba alam
  rationale: Pinananatili ang retorikal na tanong at ang pahiwatig na dapat ay batid na ni Samson ang kalagayan.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: na naghahari sa atin ang mga Filisteo
  rationale: Ang participle na מֹשְׁלִים ay nagsasaad ng nagpapatuloy na pamamahala o paghahari. Ang “naghahari sa atin” ay malinaw na nagpapahiwatig ng kanilang pagkakasakop.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Ano itong ginawa mo sa amin?
  rationale: Malapit sa anyo ng Hebreo at natural sa Tagalog; pinananatili ng “sa amin” ang reklamo nilang idinamay sila ng ginawa ni Samson.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Kung ano ang ginawa nila sa akin, iyon din ang ginawa ko sa kanila
  rationale: Likas na Tagalog na nagpapanatili sa magkatumbas na kayarian at sa diwa ng pagganti ayon sa ginawa sa kanya.
theological_decisions:
- issue: Ang tono ng tugon ni Samson bilang pagganting katumbas ng ginawa sa kanya
  choice: 'Inilahad bilang tuwirang paliwanag: “Kung ano ang ginawa nila sa akin, iyon din ang ginawa ko sa kanila.”'
  alternative: Maaaring gawing tahasang makatarungang paghihiganti o kondenahin bilang pansariling paghihiganti.
  rationale: Iniuulat ng talata ang katuwiran ni Samson ngunit hindi ito tahasang hinahatulan o pinawawalang-sala. Kaya pinananatili ang moral at teolohikal na tensiyon nang walang idinagdag na pagpapasya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Filisteo” bilang karaniwang anyong Filipino ng pangalan ng bayan. Iniwasan ang sobrang pormal o makalumang pananalita, habang pinanatili ang maikli at mariing palitan ng mga tauhan.
