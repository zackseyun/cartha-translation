base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: tl
  text: Nang matapos siyang magsalita, inihagis niya ang panga mula sa kaniyang kamay, at tinawag niyang Ramat-lehi[a] ang lugar na iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Ramat-lehi ay malamang na nangangahulugang “Burol ng Panga” o “Kaitaasan ng Panga,” at pinananatili nito ang paglalaro sa salitang lehi, na nangangahulugang “panga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Nang matapos siyang magsalita
  rationale: 'Ang כְּ na sinusundan ng infinitive construct na כַּלּוֹת at ng לְדַבֵּר ay temporal: nang o matapos siyang magsalita. Likas at malinaw sa modernong Tagalog ang napiling anyo.'
- source_word: וַיַּשְׁלֵךְ
  choice: inihagis niya
  rationale: Tumutukoy ang pandiwa sa paghagis o pagtatapon. Ang “inihagis” ay malinaw at hindi nagdaragdag ng tinding hindi tiyak sa Hebreo.
- source_word: הַלְּחִי
  choice: ang panga
  rationale: Sa konteksto, ito ang panga ng asno na ginamit ni Samson bilang sandata. Sapat na malinaw ang “panga” sa daloy ng salaysay at pinananatili nito ang pag-uugnay sa pangalang Lehi.
- source_word: מִיָּדוֹ
  choice: mula sa kaniyang kamay
  rationale: Tuwirang katumbas ito ng pariralang Hebreo at natural pa rin sa Tagalog.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: tinawag niyang … ang lugar na iyon
  rationale: Sa kontekstong pagbibigay-pangalan, natural sa Tagalog ang hulma na “tinawag niyang [pangalan] ang lugar na iyon.”
- source_word: רָמַת לֶחִי
  choice: Ramat-lehi
  rationale: Isinalin sa baybay na mas malapit sa anyong Hebreo ang pangalan ng lugar, habang ipinaliliwanag sa talababa ang kahulugan at paglalaro sa salitang לֶחִי, “panga.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Pinanatili ang maikli at sunod-sunod na estilo ng salaysay. Ginamit ang “kaniyang” sa halip na kolokyal na “kanyang,” at isinalin sa baybay ang pangalan ng lugar habang inilagay sa talababa ang kahulugan nito.
