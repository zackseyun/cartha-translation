- from: Nakakita siya ng sariwang panga ng asno[a]. Iniunat niya ang kanyang kamay at kinuha iyon, at sa pamamagitan niyon ay pinabagsak niya ang isang libong lalaki.
  to: Nakakita siya ng sariwang buto ng panga ng isang asno[a]. Iniunat niya ang kanyang kamay at kinuha niya ito, at gamit iyon ay hinampas niya ang isang libong lalaki.
  rationale: Pinalitan ang "panga" ng "buto ng panga" upang malinaw na maihatid ang bagay na tinutukoy ng Hebreo sa kontekstong ito. Pinalitan ang "pinabagsak" ng "hinampas" upang mas malapit sa pandiwang Hebreo para sa paghampas, nang hindi ipinipilit sa talata ang isang mas tiyak na resulta. Inayos din ang instrumental na parirala para sa mas likas na Tagalog.
