  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: tl
  text: Nakakita siya ng sariwang buto ng panga ng isang asno[a]. Iniunat niya ang kanyang kamay at kinuha niya ito, at gamit iyon ay hinampas niya ang isang libong lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bagong buto ng panga ng isang asno.” Ang pang-uring Hebreo ay maaaring mangahulugang sariwa o bago pa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Nakakita siya
  rationale: Payak at likas na pagsasalaysay ng natapos na pangyayari; malinaw na katumbas ng מצא sa konteksto.
- source_word: לְחִי חֲמוֹר
  choice: panga ng asno
  rationale: Ang לְחִי ay maaaring tumukoy sa panga o buto ng panga. Sa Filipino, natural na maunawaan ang “panga” bilang bahaging ginamit na sandata, nang hindi nagdaragdag ng salitang wala sa Hebreo.
- source_word: טְרִיָּה
  choice: sariwa
  rationale: Pinananatili ang diwang hindi pa tuyo o marupok; maaari rin itong maunawaang bago o bagong nakuha, kaya inilagay ang alternatibo sa talababa.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Iniunat niya ang kanyang kamay
  rationale: Pinananatili ang kongkretong idyomang Hebreo at natural pa rin sa marangal na salaysay sa Filipino.
- source_word: וַיִּקָּחֶהָ
  choice: kinuha iyon
  rationale: Tuwirang katumbas ng לקח; ang panghalip ay tumutukoy sa panga.
- source_word: וַיַּךְ בָּהּ
  choice: sa pamamagitan niyon ay pinabagsak niya
  rationale: Ipinapahayag ang instrumental na בָּהּ at ang nakamamatay na resulta ng נכה sa konteksto, nang hindi tahasang isinasalin bilang “pinatay.”
- source_word: אֶלֶף אִישׁ
  choice: isang libong lalaki
  rationale: Ang אִישׁ ay panlalaki at nasa konteksto ng pakikipaglaban; ang “lalaki” ay mas tiyak kaysa generic na “tao.”
