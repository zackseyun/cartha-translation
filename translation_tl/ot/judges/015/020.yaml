  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: tl
  text: At naging hukom siya ng Israel sa panahon ng mga Filisteo nang dalawampung taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pinamunuan niya ang Israel nang dalawampung taon”; ang pandiwang Hebreo ay maaaring tumukoy sa mas malawak na tungkulin ng pamumuno at pamamahala, hindi lamang sa paghatol sa mga usapin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: At hinatulan niya
  rationale: Pinananatili nito ang paulit-ulit na terminolohiya ng aklat tungkol sa gawain ng isang hukom. Gayunman, maaaring mas malawak sa paghatol ng mga usapin ang pandiwa at tumukoy sa pamumuno o pamamahala.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Tuwirang pinananatili ang pangalang pantangi na Israel, gaya ng Hebreong teksto, sa halip na palitan ng “mga Israelita.”
- source_word: בִּימֵי פְלִשְׁתִּים
  choice: sa panahon ng mga Filisteo
  rationale: Natural sa makabagong Tagalog ang “sa panahon ng” para sa Hebreong idyomang “sa mga araw ng,” at hindi nito tinutukoy nang higit sa teksto kung anong aspekto ng kapangyarihan ng mga Filisteo ang tinutukoy.
- source_word: עֶשְׂרִים שָׁנָה
  choice: sa loob ng dalawampung taon
  rationale: Malinaw at likas na pagpapahayag ng tagal sa Tagalog.
theological_decisions:
- issue: Saklaw ng tungkulin ni Samson sa pandiwang שׁפט
  choice: “hinatulan” sa pangunahing teksto, na may talababa tungkol sa mas malawak na diwa
  alternative: “pinamunuan” o “namahala bilang hukom”
  rationale: Pinananatili ng “hinatulan” ang ugnayan sa katawagan at balangkas ng aklat ng Mga Hukom, habang kinikilala sa talababa na ang Hebreong pandiwa ay maaari ring tumukoy sa mas malawak na pamumuno at hindi lamang sa pagpapasya sa mga usaping panghukuman.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sa panahon ng” sa halip na ang mas literal ngunit mas matandang tunog na “sa mga araw ng.”
