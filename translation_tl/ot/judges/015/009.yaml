  terminology: Ang “mga Filisteo,” “Juda,” at “Lehi” ay angkop na mga karaniwang anyo sa modernong Filipino Tagalog. Ang tala ay dapat magpaliwanag ng posibleng militar na kahulugan nang hindi idinadagdag ang tiyak na layuning “para sa labanan,” na hindi tahasang sinasabi ng pandiwa.
