  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: tl
  text: Pagkatapos nito, umakyat ang mga Filisteo, nagkampo sa Juda, at kumalat sa Lehi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo ay maaari ring tumukoy sa pagkakalat o pagpoposisyon ng isang hukbo sa Lehi.
