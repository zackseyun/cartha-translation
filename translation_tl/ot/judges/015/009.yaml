lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: umahon
  rationale: Pinananatili nito ang karaniwang direksiyonal na diwa ng עלה sa salaysay at maaari ring magpahiwatig ng paglusob nang hindi iyon tahasang idinaragdag.
- source_word: פְלִשְׁתִּים
  choice: ang mga Filisteo
  rationale: Karaniwang makabagong Tagalog na katawagan sa pangkat-etnikong ito.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Likas at malinaw na katumbas ng חנה na nangangahulugang magtayo o manatili sa kampo.
- source_word: בִּיהוּדָה
  choice: sa Juda
  rationale: Ang ב ay pinakamalamang na tumutukoy sa lokasyon; hindi ipinapasok ang mas mapagpakahulugang 'laban sa Juda.'
- source_word: וַיִּנָּטְשׁוּ
  choice: kumalat
  rationale: Inilalarawan nito ang pagkalat o paglawak ng puwersa sa isang lugar, habang pinananatili ang bahagyang kalabuan ng pandiwang Hebreo.
- source_word: בַּלֶּחִי
  choice: sa Lehi
  rationale: Ang Lehi ay pangalan ng lugar, at ang 'sa' ang natural na panandang Tagalog para sa pagpoposisyon doon.
