  - severity: low
    issue: Ang “bato sa Etam” ay maaaring basahing lokatibo sa halip na “rock of Etam.”
    rationale: Ang Hebreong konstruksiyon ay nag-uugnay sa bato at Etam. Ang “Bato ng Etam” ay mas tuwirang tumutugon dito at natural pa rin sa Filipino.
