  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: tl
  text: Pinabagsak niya sila—binti at hita—sa isang malaking dagok.[a] Pagkatapos, bumaba siya at nanatili sa siwang ng Bato ng Etam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “binti at hita,” na malamang ay isang idyoma para sa matindi o lubusang pagkatalo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Pinabagsak niya sila
  rationale: Ang נכה ay nangangahulugang humampas o manakit at, sa labanang ito, ay may resultang pagkatalo o pagbagsak. Ipinahahayag ng “pinabagsak” ang marahas at resultang diwa nang hindi tahasang sinasabing napatay ang bawat isa.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: binti at hita
  rationale: Pinananatili ang kongkretong larawan ng mahirap unawaing idyomang Hebreo. Mas malapit ang “binti” sa שׁוֹק at ang “hita” sa יָרֵךְ; ipinaliliwanag sa talababa ang malamang na diwang matinding o lubusang pagkatalo.
- source_word: מַכָּה גְדוֹלָה
  choice: sa isang matinding paglipol
  rationale: Sa konteksto ng labanan, ang מַכָּה ay maaaring tumukoy sa matinding dagok, pagkatalo, o paglipol. Ang “matinding paglipol” ay natural at malinaw sa Filipino habang pinananatili ang tindi ng גְדוֹלָה.
- source_word: וַיֵּרֶד
  choice: bumaba siya
  rationale: Tuwirang pinananatili ang direksiyonal na diwa ng pandiwa.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Maaaring mangahulugan ang ישב ng umupo, manirahan, o manatili. Ang “nanatili” ang pinakaangkop sa pansamantalang pagtigil sa isang taguan.
- source_word: בִּסְעִיף
  choice: sa siwang
  rationale: Ang סעיף ay tumutukoy sa bitak, hati, o siwang; natural ang “siwang” para sa isang taguan sa batuhan.
- source_word: סֶלַע
  choice: ng bato
  rationale: Ang סלע ay malaking bato, batuhan, o talampas. Sapat at malawak ang “bato,” at hindi nito labis na tinutukoy ang eksaktong anyong heograpiko.
- source_word: עֵיטָם
  choice: Etam
  rationale: Isinatinig ang pangalang-pook sa karaniwang anyong Filipino.
