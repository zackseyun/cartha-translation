id: JDG.15.18
reference: Judges 15:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: tl
  text: Labis siyang nauhaw, kaya tumawag siya kay Yahweh at sinabi, “Ikaw ang nagbigay ng dakilang pagliligtas na ito[a] sa pamamagitan ng iyong lingkod. Mamamatay ba ako ngayon sa uhaw at mahuhulog sa kamay ng mga hindi tuli[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pagliligtas” ay maaari ding isaling “tagumpay.”
    reason: lexical_alternative
  - marker: b
    text: Ang “mga hindi tuli” ay katawagang may bigat na tipanan para sa mga kaaway ng Israel; dito, partikular itong tumutukoy sa mga Filisteo.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: Labis siyang nauhaw
  rationale: Tuwirang ipinapahayag ng parirala ang matinding pagkauhaw ni Samson; natural at malinaw ito sa modernong Tagalog.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: tumawag siya kay Yahweh
  rationale: Ang קרא אל ay pagtawag sa isang tao, at sa kontekstong ito ay panalangin o paghingi ng tulong. Hindi na idinagdag ang mas matinding diwang maaaring ipahiwatig ng “dumaing.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אַתָּה נָתַתָּ
  choice: Ikaw ang nagbigay
  rationale: Ipinakikita ng ayos na ito ang diin sa אַתָּה at ang katatapos na pagkilos ng Diyos na kinikilala ni Samson.
- source_word: בְיַד עַבְדְּךָ
  choice: sa pamamagitan ng iyong lingkod
  rationale: Ang בְיַד ay idyoma ng ahensiya o kasangkapan. Mas natural sa Tagalog ang “sa pamamagitan ng” kaysa literal na “sa kamay ng” sa bahaging ito.
- source_word: עַבְדְּךָ
  choice: iyong lingkod
  rationale: Ito ay magalang na pagtukoy ni Samson sa sarili sa harap ng Diyos; hindi pangunahing binibigyang-diin dito ang kalagayan ng isang alipin.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: ang dakilang pagliligtas na ito
  rationale: Saklaw ng תְּשׁוּעָה ang pagliligtas at tagumpay. Pinananatili ng “pagliligtas” kapwa ang konkretong tagumpay sa labanan at ang pagkilos ng Diyos.
- source_word: וְעַתָּה
  choice: ngayon
  rationale: Minamarkahan nito ang matinding paghahambing sa pagitan ng katatapos na pagliligtas at ng kasalukuyang panganib ni Samson.
- source_word: אָמוּת בַּצָּמָא
  choice: Mamamatay ba ako ngayon sa uhaw
  rationale: Bagaman walang tahasang pantanong na kataga sa Hebreo, hinihingi ng konteksto ang retorikal na tanong. Ang בַּצָּמָא ay natural na tumutukoy sa sanhi ng kamatayan.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: at mahuhulog sa kamay ng
  rationale: Pinananatili nito ang Hebreong larawan ng pagkahulog sa kapangyarihan o kontrol ng kaaway.
- source_word: הָעֲרֵלִים
  choice: mga hindi tuli
  rationale: Pinananatili ang literal at tipanang bigat ng katawagan, sa halip na tahimik na palitan ito ng “mga Filisteo.”
theological_decisions:
- issue: Paglalarawan sa תְּשׁוּעָה
  choice: pagliligtas
  alternative: tagumpay
  rationale: Ang pangyayari ay isang tagumpay sa labanan, ngunit iniuugnay mismo ni Samson ang kinalabasan sa pagkilos ng Diyos. Hindi nililimitahan ng “pagliligtas” ang salita sa militar na tagumpay lamang.
- issue: Tipanang bigat ng הָעֲרֵלִים
  choice: mga hindi tuli
  alternative: mga Filisteo
  rationale: Ang literal na katawagan ay nagpapahiwatig hindi lamang ng pagkakakilanlang etniko kundi ng pagiging nasa labas ng tanda ng tipan. Pinananatili ito sa teksto at ipinapaliwanag nang maikli sa talababa.
- issue: Paglalahad sa pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Dahil personal na pangalan ang nasa tekstong Hebreo, pinananatili itong pangalan at hindi pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Labis siyang nauhaw” at “Mamamatay ba ako ngayon” para sa natural na daloy, samantalang pinanatili ang mga larawang “iyong lingkod” at “sa kamay” kung saan angkop. Ang pangalang “Yahweh” at ang katawagang “mga hindi tuli” ay pinanatili upang hindi mawala ang natatanging teolohikal at tipanang diwa ng Hebreo.
