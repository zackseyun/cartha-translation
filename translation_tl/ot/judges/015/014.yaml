  naturalness: Malinaw at marangal ang karamihan ng salin. Mas natural at mas tapat sa pandiwang Hebreo ang "biglang dumating nang makapangyarihan sa kanya." Ang "mga hibla ng lino" ay nauunawaan bilang katumbas ng flax, bagaman ang binagong ayos ng pangungusap ay mas maayos na nag-uugnay sa pagtunaw ng mga tali sa kanyang mga kamay.
  terminology: Wasto ang "Yahweh," "mga Filisteo," "Lehi," "mga lubid," at "mga bisig." Nananatiling angkop ang talababa sa Lehi at ang panandang [a].
