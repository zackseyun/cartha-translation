reference: Judges 15:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: tl
  text: Nang makarating siya sa Lehi[a], sumigaw ang mga Filisteo habang papalapit upang salubungin siya. At biglang dumating nang makapangyarihan sa kanya ang Espiritu ni Yahweh. Ang mga lubid sa kanyang mga bisig ay naging gaya ng mga hibla ng lino na nasunog sa apoy, at ang mga tali sa kanyang mga kamay ay natunaw.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Lehi ay pangalan ng isang lugar. Kaugnay rin ang salitang Hebreo nito sa salitang “panga,” isang mahalagang larawan sa kasunod na bahagi ng salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: Lehi[a]
  rationale: Pangalan ito ng lugar sa konteksto. Pinananatili ang transliterasyon, samantalang inilalahad sa talababa ang kaugnayan nito sa salitang Hebreo para sa “panga.”
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: sumigaw ... habang papalapit upang salubungin siya
  rationale: Pinananatili nito ang malakas na sigaw at ang kilos na pakikipagsagupa nang hindi labis na tinutukoy iyon bilang isang tiyak na uri ng sigaw-pandigma.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: makapangyarihang nanaig sa kanya ang Espiritu ni Yahweh
  rationale: Ang צלח על sa ganitong pormula sa Mga Hukom ay nagpapahiwatig ng biglaan at makapangyarihang pagkilos ng Espiritu. Ang “nanaig sa kanya” ay likas sa Filipino at pinananatili ang puwersa ng idyoma.
- source_word: הָעֲבֹתִים
  choice: mga lubid
  rationale: Tumutukoy ito sa mga panaling lubid; malinaw at natural ang “mga lubid” sa modernong Filipino.
- source_word: זְרוֹעוֹתָיו
  choice: mga bisig
  rationale: Ang זְרוֹעַ ay bisig o braso. Ang “mga bisig” ay dignified at hindi labis na anatomikong tiyak.
- source_word: כַּפִּשְׁתִּים
  choice: gaya ng mga hibla ng lino
  rationale: Ang פִשְׁתִּים ay flax; mas madaling maunawaan sa Filipino ang materyal bilang “mga hibla ng lino” kaysa sa transliterasyong “flax.”
- source_word: אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: na nasunog sa apoy
  rationale: Ipinahahayag ang epekto ng apoy na dahilan ng pagkaputol o pagkawala ng tibay ng mga hibla.
- source_word: וַיִּמַּסּוּ
  choice: natunaw at nalaglag
  rationale: Pinananatili ng “natunaw” ang metapora ng מסס, at nililinaw ng “nalaglag” ang pisikal na kinalabasan sa natural na Filipino.
- source_word: אֱסוּרָיו
  choice: mga tali
  rationale: Tumutukoy sa mga bagay na ipinanggapos sa kanya. Ang “mga tali” ay angkop sa kontekstong mga lubid, samantalang ang “mga tanikala” ay maaaring maling magpahiwatig ng metal.
- source_word: מֵעַל יָדָיו
  choice: sa kanyang mga kamay
  rationale: Malapit ito sa literal na “mula sa ibabaw ng kanyang mga kamay” at iniiwasang ipakahulugan nang mas tiyak bilang mga pulsuhan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Direktang ginagamit ng tekstong Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Paglalarawan sa pagkilos ng Espiritu kay Samson
  choice: makapangyarihang nanaig sa kanya ang Espiritu ni Yahweh
  alternative: dumating nang makapangyarihan sa kanya; biglang sumakanya
  rationale: Pinananatili nito ang biglaan at malakas na pagbibigay-kapangyarihan sa salaysay, nang hindi nagdaragdag ng mga kategoryang teolohikal na wala sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw ngunit marangal. Ginamit ang “mga hibla ng lino” para madaling maunawaan ang sinaunang materyal, at pinanatili ang pangalang Yahweh. Ang pagkakasunod ng mga pangyayari at ang matinding larawan ng tekstong Hebreo ay pinangalagaan.
