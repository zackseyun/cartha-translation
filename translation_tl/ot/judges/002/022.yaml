  naturalness: Mas natural ang ayos na “upang subukin niya ang Israel sa pamamagitan nila.” Ang “sa paglakad dito” ay mas idiomatiko kaysa “sa pamamagitan ng paglakad dito,” habang pinananatili ang pagpapaliwanag ng pag-iingat sa daan.
  terminology: Ang “Yahweh,” “daan,” “subukin,” at “ingatan” ay angkop at magkakatugma. “Kanilang mga ama” ang pinakamalapit at natural na katumbas ng אֲבוֹתָם sa talatang ito.
  issues:
