  text: לְמַ֛עַן נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל הֲ/שֹׁמְרִ֣ים הֵם֩ אֶת דֶּ֨רֶךְ יְהוָ֜ה לָ/לֶ֣כֶת בָּ֗/ם כַּ/אֲשֶׁ֛ר שָׁמְר֥וּ אֲבוֹתָ֖/ם אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: tl
  text: upang subukin niya ang Israel sa pamamagitan nila[a], kung iingatan nila ang daan ni Yahweh sa paglakad dito, gaya ng iningatan ito ng kanilang mga ama, o hindi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa pamamagitan ng mga ito.” Ang panghalip ay tumutukoy sa mga bansang iniwan sa lupain (tingnan ang naunang konteksto).
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: upang
  rationale: Likas at malinaw na nagpapahayag ng layunin sa modernong Filipino.
- source_word: נַסּוֹת
  choice: subukin
  rationale: Tumutukoy sa pagsubok upang mahayag kung susunod ang Israel, hindi sa pagtukso sa kasamaan.
- source_word: בָּם
  choice: sa pamamagitan nila
  rationale: Pinananatili ang instrumental na diwa; ang panghalip ay tumutukoy sa mga bansang iniwan sa lupain ayon sa naunang konteksto.
- source_word: הֲשֹׁמְרִים
  choice: kung iingatan nila
  rationale: Inihahayag ang nilalaman ng pagsubok at natural na inililipat sa aspektong kontemplatibo sa Filipino.
- source_word: דֶּרֶךְ יְהוָה
  choice: ang daan ni Yahweh
  rationale: Pinananatili ang biblikal na talinghaga ng daan bilang pamumuhay ayon sa kalooban ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan sa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לָלֶכֶת בָּם
  choice: sa pamamagitan ng paglakad dito
  rationale: Pinananatili ang metapora ng paglakad at ang paliwanag kung paano iingatan ang daan; ang singular na “dito” ay tumutukoy sa “daan.”
- source_word: כַּאֲשֶׁר
  choice: gaya ng
  rationale: Natural na naghahatid ng paghahambing.
- source_word: שָׁמְרוּ אֲבוֹתָם
  choice: pag-iingat dito ng kanilang mga ninuno
  rationale: Inuulit ang ugat na שמר sa pamamagitan ng “pag-iingat” at ginagamit ang natural na salitang Filipino para sa mga naunang salinlahi; hindi kailangan ng gramatikal na kasariang wala sa Filipino.
- source_word: אִם לֹא
  choice: o hindi
  rationale: Likas na katapusan ng di-tuwirang tanong na “kung ... o hindi.”
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Ang Hebreo ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ng titulo.
- issue: Ahensiya sa pandiwang “subukin”
  choice: subukin niya ang Israel
  alternative: subukin ang Israel
  rationale: Ipinahihiwatig ng konteksto na si Yahweh ang gumagawa ng pagsubok. Ang “niya” ay nililinaw ang likas na paksa ng infinitive nang hindi binabago ang teolohikal na diwa.
- issue: Kahulugan ng אֲבוֹתָם
  choice: kanilang mga ninuno
  alternative: kanilang mga ama
  rationale: Sa Filipino, ang “mga ninuno” ang natural na katawagan sa mga naunang salinlahing tinutukoy rito. Hindi nito binabago ang genealogical na kahulugan, at ang Filipino ay walang katumbas na obligadong gramatikal na kasarian.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang mga biblikal na metaporang “daan” at “paglakad,” gayundin ang personal na pangalang Yahweh. Ang pangungusap ay sadyang nagpapanatili sa ugnayan ng pagsubok, pag-iingat, at paglakad sa daan.
