base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: tl
  text: Kaya tinawag nilang Bokim[a] ang lugar na iyon, at naghandog sila roon ng mga hain kay Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Bokim ay kahawig ng salitang Hebreo na nangangahulugang “mga umiiyak” o “mga tumatangis.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: tinawag nilang
  rationale: Ang idyomang Hebreo ay literal na “tinawag nila ang pangalan,” ngunit ang natural at tumpak na katumbas sa modernong Tagalog ay “tinawag nilang.”
- source_word: הַמָּקוֹם הַהוּא
  choice: ang lugar na iyon
  rationale: Malinaw na kinakatawan ng “iyon” ang demonstratibong הַהוּא.
- source_word: בֹּכִים
  choice: Bokim
  rationale: Ginamit bilang pangalan ng lugar, kaya isinalin sa karaniwang transliterasyong angkop sa bigkas ng Tagalog; ipinaliwanag sa talababa ang kaugnayan nito sa pag-iyak.
- source_word: וַיִּזְבְּחוּ
  choice: naghandog sila ... ng mga hain
  rationale: Natural sa Tagalog at malinaw na ipinapahayag ang paghahandog ng sakripisyo na tinutukoy ng pandiwang זבח.
- source_word: שָׁם
  choice: roon
  rationale: Tumutukoy sa lugar na kababanggit lamang at natural ang “roon” sa pangungusap.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na יהוה sa pamamagitan ng transliterasyong “Yahweh.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng isang titulo.
- issue: Kung isasalin o ita-transliterate ang בֹּכִים
  choice: Bokim
  alternative: Mga Tumatangis; Mga Umiiyak
  rationale: Dito ay pangalan ito ng lugar. Pinananatili sa pangunahing teksto ang pangalan, samantalang inilalahad sa talababa ang kahulugan at paglalaro sa salita.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “naghandog ... ng mga hain” para sa malinaw at karaniwang pananalitang panrelihiyon, at pinanatili ang pangalang Yahweh.
