  source_fidelity: Kailangang panatilihin ang direksiyonal na pandiwang וַיַּעַל (“umakyat/umahon”), na hindi ganap na naipapahayag ng “umalis ... at pumunta.” Wasto ang pagsasalin sa divine name na “Yahweh,” ang pag-iingat sa hindi tiyak na identidad ng anghel/mensahero, at ang diwa ng pangakong tipan.
  naturalness: Natural at marangal ang karamihan ng Tagalog. Ang “Umakyat ... mula sa Gilgal patungong Bokim” ay malinaw, idiomatiko, at mas malapit sa Hebreo.
  terminology: Ang “anghel ni Yahweh,” “tipan,” “Ehipto,” at “Bokim” ay angkop. Ang “mga ninuno” ay natural na paraan upang tukuyin ang mga ama/patriyarka sa kontekstong Tagalog, bagaman ang Hebreo ay literal na “mga ama.”
  issues:
