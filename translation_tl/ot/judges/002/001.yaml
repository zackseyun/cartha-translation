reference: Judges 2:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: tl
  text: Umakyat ang anghel[b] ni Yahweh mula sa Gilgal patungong Bokim.[a] Sinabi niya, “Iniahon ko kayo mula sa Ehipto at dinala sa lupaing ipinangako ko nang may panunumpa sa inyong mga ninuno. Sinabi ko, ‘Hinding-hindi ko sisirain ang tipan ko sa inyo.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Bokim ay malamang na nangangahulugang “mga umiiyak,” o tumutukoy sa isang lugar ng pag-iyak.
    reason: cultural_note
  - marker: b
    text: Ang “anghel” ay maaari ring isaling “mensahero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugang ‘mensahero’ o ‘anghel’ ang מַלְאַךְ. Pinili ang nakaugaliang ‘anghel’ sa salaysay na ito, ngunit itinala sa talababa ang leksikal na alternatibo. Hindi nililinaw kung nilalang na anghel o pagpapakita ng Diyos ang tinutukoy.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos sa pamamagitan ng transliterasyong ‘Yahweh,’ sa halip na palitan ito ng isang titulo.
- source_word: וַיַּעַל
  choice: umalis ... at pumunta
  rationale: Literal na ‘umakyat/pumaitaas,’ ngunit sa modernong Tagalog ay mas natural ang pagbanggit sa pag-alis mula sa pinanggalingan at pagpunta sa destinasyon; hindi tiyak na mahalaga rito ang topograpikong ‘pag-akyat.’
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Isinalin sa pamamagitan ng karaniwang transliterasyon ng pangalan ng lugar.
- source_word: הַבֹּכִים
  choice: Bokim
  rationale: Pinanatili bilang pangalan ng lugar. Ipinaliwanag sa talababa ang malamang na kahulugan nito.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Iniahon ko kayo mula sa Ehipto
  rationale: Bagaman anyong imperfect ang pandiwa, malinaw na binabalikan ng tagapagsalita ang naganap nang pagliligtas. Ang ‘iniahon’ ay nagpapanatili sa larawang pag-akyat mula sa Ehipto.
- source_word: וָאָבִיא אֶתְכֶם אֶל הָאָרֶץ
  choice: dinala sa lupain
  rationale: Natural na Tagalog para sa Hiphil ng בוא at pinananatili ang mahalagang tema ng ipinangakong lupain.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: ipinangako ko nang may panunumpa sa inyong mga ninuno
  rationale: Ipinahahayag ang tahasang diwa ng panunumpa. Ang ‘mga ninuno’ ay natural sa Tagalog at saklaw ang mga patriyarkang tinutukoy ng panlalaking maramihan sa Hebreo.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Hinding-hindi ko sisirain ang tipan ko sa inyo
  rationale: Ang הפר sa konteksto ng tipan ay ‘sirain’ o ‘pawalang-bisa.’ Natural na ipinahahayag ng ‘hinding-hindi’ ang mariing at namamalaging pagtanggi ng לֹא ... לְעוֹלָם.
theological_decisions:
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: ‘ang anghel ni Yahweh,’ nang hindi tinutukoy kung siya ay nilalang na anghel o teopanikong pagpapakita
  alternative: ‘ang mensahero ni Yahweh,’ na maaari pa ring tumukoy sa makalangit o makataong sugo
  rationale: Ang mensahero ay nagsasalita sa unang panauhan bilang Diyos. Pinananatili ng salin ang tensiyong ito at hindi ipinapasya ang eksaktong ontolohikal na pagkakakilanlan niya.
- issue: Pangako ng tipan
  choice: ‘Hinding-hindi ko sisirain ang tipan ko sa inyo’
  alternative: ‘Hindi ko pawawalang-bisa magpakailanman ang tipan ko sa inyo’
  rationale: Pinananatili ang ganap na lakas ng pahayag nang hindi ipinapasok ang paliwanag kung paano ito kaugnay ng kasunod na paghatol sa Israel.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang ‘tipan,’ ‘lupain,’ at ‘panunumpa’ upang mapanatili ang bokabularyong tipanan. Inilagay ang bawat talababa kaagad pagkatapos ng kaugnay na salita o pahayag.
