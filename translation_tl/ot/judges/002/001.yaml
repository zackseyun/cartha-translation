    issue: Hindi naipahayag ang “umakyat” sa וַיַּעַל.
    rationale: Ang “umalis ... at pumunta” ay nagbibigay ng paggalaw ngunit inaalis ang direksiyonal/topograpikong sangkap ng pandiwang Hebreo. Ang “umakyat” ay parehong natural at tapat sa pinagmulan.
  - severity: medium
    issue: Maling pagkakaangkla ng talababa [b].
    rationale: Ang talababa [b] ay tungkol sa leksikal na alternatibo ng “anghel,” ngunit nakalagay ito pagkatapos ng buong siniping pahayag. Dapat itong ilagay agad sa “anghel.”
