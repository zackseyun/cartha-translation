  text: וַ/יַּעַזְב֖וּ אֶת יְהוָ֑ה וַ/יַּעַבְד֥וּ לַ/בַּ֖עַל וְ/לָ/עַשְׁתָּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: tl
  text: Iniwan nila si Yahweh at naglingkod sila kay Baal at sa mga Ashtoret.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tinalikuran nila si Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: O “sumamba sila kay Baal at sa mga Ashtoret.” Maramihan ang Hebreong “mga Ashtoret”; maaaring tumukoy ito sa iba’t ibang lokal na anyo o mga imahen ng diyosang kilala rin bilang Ashtoreth o Astarte.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: Iniwan
  rationale: Ang עזב ay nangangahulugang iwan o talikuran. Natural sa modernong Tagalog ang “iniwan,” at malinaw sa konteksto ang pagtataksil ng Israel kay Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Ang עבד ay maaaring mangahulugang maglingkod o sumamba. Pinananatili ng “naglingkod” ang mas malawak na saklaw ng pandiwa, habang malinaw sa konteksto ang pagsambang panrelihiyon.
- source_word: לַבַּעַל
  choice: kay Baal
  rationale: Itinuturing ang Baal bilang pangalan ng diyos; ang “kay” ang natural na panandang Tagalog para sa personal na tinutukoy.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: sa mga Ashtoret
  rationale: Hayagang pinananatili ng “mga” ang anyong maramihan ng Hebreong עַשְׁתָּרוֹת. Ang transliterasyong “Ashtoret” ay inuugnay ito sa pangalang Ashtoreth nang hindi ginagawang isahan ang teksto.
theological_decisions:
- issue: Anyong maramihan ng עַשְׁתָּרוֹת
  choice: sa mga Ashtoret
  alternative: kay Ashtoreth / sa mga larawan ni Ashtoreth
  rationale: Morpologikong maramihan ang Hebreo. Hindi nilulutas ng salin kung tumutukoy ito sa maraming lokal na anyo, imahen, o mga diyosang kaugnay ni Ashtoreth/Astarte.
- issue: Kultikong diwa ng עבד
  choice: naglingkod
  alternative: sumamba
  rationale: Pinananatili ang karaniwang kahulugan ng pandiwang Hebreo at hindi pinakikitid sa “sumamba,” bagaman iyon ang malinaw na diwa sa konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na maikli at marangal. Ginamit ang “Yahweh” bilang personal na pangalan, “naglingkod” upang mapanatili ang lawak ng Hebreong pandiwa, at “mga Ashtoret” upang lantad na maipakita ang gramatikal na maramihan.
