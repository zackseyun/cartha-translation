  source_fidelity: 'Tapat ang salin sa Hebreo: ang וַיַּעַזְבוּ ay maayos na “Iniwan,” ang יְהוָה ay “Yahweh,” at ang וַיַּעַבְדוּ ay “naglingkod,” na pinananatili ang mas malawak na kultikong diwa kaysa tahasang “sumamba.” Naipapakita rin ng “mga Ashtoret” ang morpolohikal na maramihan ng עַשְׁתָּרוֹת nang hindi ipinipilit kung mga anyo, imahen, o magkakaugnay na diyosa ang tinutukoy.'
