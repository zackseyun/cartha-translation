id: JDG.2.8
reference: Judges 2:8
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: tl
  text: At namatay si Josue na anak ni Nun, ang lingkod ni Yahweh,[a] sa edad na isandaan at sampung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ang alipin ni Yahweh.” Maaaring mangahulugan ang salitang Hebreo ng “lingkod” o “alipin”; dito, ginagamit ito bilang marangal na titulo para kay Josue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: At namatay
  rationale: Ang Qal wayyiqtol ng מות ay nagsasalaysay ng kasunod na pangyayari; natural sa Tagalog ang “At namatay.”
- source_word: יְהוֹשֻׁעַ
  choice: Josue
  rationale: Ginamit ang nakagawiang modernong anyo ng pangalang biblikal sa Tagalog.
- source_word: בִּן נוּן
  choice: anak ni Nun
  rationale: Ang construct chain ay nagpapahayag ng pagkamagulang; “anak ni Nun” ang natural at malinaw na anyo sa Tagalog.
- source_word: עֶבֶד יְהוָה
  choice: ang lingkod ni Yahweh
  rationale: Maaaring tumukoy ang עֶבֶד sa lingkod o alipin. Dito, marangal na titulo ito ni Josue kaugnay ni Yahweh, kaya “lingkod” ang pinakaangkop sa pangunahing teksto habang inilalagay sa talababa ang leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na banal na pangalan sa pamamagitan ng transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: sa edad na isandaan at sampung taon
  rationale: Ang literal na idyomang Hebreo na “anak ng isandaan at sampung taon” ay likas na ipinahahayag sa modernong Tagalog bilang edad.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Paglalarawan sa עֶבֶד bilang titulo ni Josue
  choice: lingkod
  alternative: alipin
  rationale: Totoong saklaw ng salita ang “alipin,” ngunit sa kontekstong ito ay marangal na titulo ang parirala. Pinananatili ng “lingkod” ang gamit na iyon nang hindi itinatago ang alternatibong kahulugan, na ibinigay sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “Josue” bilang nakagawiang pangalang Tagalog at “isandaan” bilang pamantayang baybay. Ang marker na [a] ay inilagay kaagad pagkatapos ng pariralang tinutukoy nito.
