base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: tl
  text: At inilibing nila siya sa teritoryo ng kanyang mana, sa Timnat-Heres[a], sa kabundukan ng Efraim, sa hilaga ng Bundok Gaas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Josue 24:30, “Timnat-Serah” ang nakasaad sa halip na “Timnat-Heres.” Pinanatili rito ang pagkakaiba ng pangalan ng lugar sa magkatulad na salaysay tungkol sa paglilibing.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: At inilibing nila siya
  rationale: Ang wayyiqtol ay nagpapatuloy sa salaysay at tumutukoy sa isang naganap na kilos; tahasang isinalin ang panghalip na tumutukoy kay Josue.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: sa nasasakupan ng lupaing minana niya
  rationale: Sa kontekstong ito, ang גְּבוּל ay tumutukoy sa nasasakupang teritoryo, hindi lamang sa hangganang guhit; ang נַחֲלָה ay lupa o ari-ariang minana o itinakdang bahagi.
- source_word: בְּתִמְנַת חֶרֶס
  choice: sa Timnat-Heres
  rationale: Isinalin ang pang-ukol nang natural at tinumbasan ang pangalan ng lugar sa anyong madaling bigkasin sa Filipino habang pinananatili ang anyong Heres ng tekstong Hebreo.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kabundukan ng Efraim
  rationale: Ang הַר sa heograpikong pariralang ito ay tumutukoy sa bulubundukin o mataas na lupaing sakop ng Efraim, hindi sa iisang bundok.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: sa hilaga ng Bundok Gaas
  rationale: Ipinapahayag ng parirala ang lokasyon ng Timnat-Heres kaugnay ng Bundok Gaas.
theological_decisions: []
translation_notes:
  register: Gumamit ng makabagong, malinaw, at marangal na Filipino. Pinili ang “kabundukan” bilang likas na katawagan sa rehiyong mataas at mabundok, at inilagay ang panandang talababa kasunod ng “Timnat-Heres” upang malinaw ang tinutukoy nitong pagkakaiba ng pangalan.
