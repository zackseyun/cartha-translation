  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban sa Israel, at sinabi niya, “Dahil nilabag[a] ng bansang ito ang aking tipan na iniutos ko sa kanilang mga ninuno, at hindi sila nakinig sa aking tinig[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sinira ang aking tipan.” Ang pandiwang Hebreo ay literal na may diwang “tumawid,” ngunit sa konteksto ng tipan ay nangangahulugang lumabag o sumira.
    reason: lexical_alternative
  - marker: b
    text: O “hindi nila sinunod ang aking tinig.” Ang Hebreong idyomang “makinig sa tinig” ay kadalasang may kasamang diwa ng pagsunod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang Hebreong talinghaga ng galit na nag-iinit o nagliliyab, habang natural at marangal sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa pariralang nagsasaad ng galit, tinutukoy ng pang-ukol ang Israel bilang pinatutungkulan ng poot.
- source_word: יַעַן אֲשֶׁר
  choice: Dahil
  rationale: Maikli at natural na ipinakikilala nito ang dahilan ng pahayag ni Yahweh.
- source_word: עָבְרוּ
  choice: nilabag
  rationale: Bagaman literal na may diwang 'tumawid,' sa konteksto ng tipan ang pandiwa ay nangangahulugang lumabag o sumuway sa itinakdang hangganan.
- source_word: הַגּוֹי הַזֶּה
  choice: ang bansang ito
  rationale: Pinananatili ang markadong salitang גוי bilang 'bansa' sa halip na pakinisin bilang 'bayan.'
- source_word: בְּרִיתִי
  choice: aking tipan
  rationale: '''Tipan'' ang karaniwan at angkop na salin ng ברית sa ugnayang itinatag ni Yahweh sa Israel.'
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: na iniutos ko sa kanilang mga ninuno
  rationale: 'Ipinahahayag ang siksik na konstruksiyong Hebreo nang malinaw: ang tipan ang iniutos sa kanilang mga ninuno.'
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: nakinig sa aking tinig
  rationale: Pinananatili ang pandinig na larawan ng Hebreo, habang likas na ipinahihiwatig ng 'nakinig' ang pagbibigay-pansin at pagsunod.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang tahasang nasa Hebreo; ang 'Yahweh' ay nagpapanatili rito nang hindi pinapalitan ng titulo.
- issue: Pagpapanatili ng wikang pangtipan at pansakdal
  choice: nilabag ... ang aking tipan; hindi ... nakinig sa aking tinig
  alternative: sinira ... ang aking tipan; hindi ako sinunod
  rationale: Pinananatili ng salin ang larawan at tensiyong nasa Hebreo sa halip na gawing pangkalahatang pahayag lamang tungkol sa pagsuway.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “nag-alab ang galit” upang mapanatili ang Hebreong metapora, “bansa” para sa גוי, at “mga ninuno” bilang natural at inklusibong katumbas ng kolektibong אבות. Ang pangungusap ay sadyang nagtatapos sa kuwit sapagkat nagpapatuloy ang direktang pahayag sa kasunod na talata.
