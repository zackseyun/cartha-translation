id: JDG.2.6
reference: Judges 2:6
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: tl
  text: Pagkatapos, pinauwi ni Josue ang mga tao. Umalis ang mga Israelita[a], bawat isa patungo sa kanyang mana, upang angkinin ang lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “mga anak na lalaki ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: pinauwi
  rationale: Sa kontekstong ito, ang pandiwang שׁלח ay nangangahulugang pinaalis o pinahayo ang mga tao matapos ang pagtitipon. Likas sa modernong Tagalog ang “pinauwi” at malinaw na hindi ito simpleng pagpapadala sa isang atas.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Pinananatili nito ang payak na tawag ng Hebreo nang hindi idinaragdag sa pangunahing teksto ang “ng Israel.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga Israelita[a]
  rationale: Ito ang natural at malinaw na katawagan sa modernong Tagalog para sa kolektibong idyomang Hebreo. Inilalagay sa talababa ang literal na anyo upang hindi mawala ang pormal na larawan ng orihinal.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Distributibo ang gamit ng אִישׁ dito. Ang “bawat isa” ay natural sa Tagalog at hindi nagpapahiwatig na bawat lalaking Israelita ay may hiwalay na indibiduwal na lupain.
- source_word: לְנַחֲלָתוֹ
  choice: patungo sa kanyang mana
  rationale: Ang נַחֲלָה ay tumutukoy sa minanang bahaging lupa na ipinagkaloob sa Israel; pinananatili ng “mana” ang ugnayang tipan at pamana.
- source_word: לָרֶשֶׁת
  choice: upang angkinin
  rationale: 'Ipinahahayag ng infinitive ang layunin ng pag-alis: aktuwal na kunin at ariin ang lupa. Ang “angkinin” ay malinaw at natural na katumbas sa kontekstong ito.'
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa partikular na lupaing ipinagkaloob sa Israel, kaya mas angkop ang “lupain” kaysa “daigdig” o pangkalahatang “lupa.”
theological_decisions:
- issue: Kolektibong katawagang may anyong panlalaki
  choice: ang mga Israelita
  alternative: ang mga anak na lalaki ni Israel / ang mga anak ni Israel
  rationale: Ang בְנֵי יִשְׂרָאֵל ay nakapirming kolektibong katawagan para sa bayang Israel. Ang lubhang literal na “mga anak na lalaki ni Israel” ay madaling mapagkamalang tumutukoy lamang sa direktang lalaking supling; pinananatili sa talababa ang literal na anyo at tunay na anyong panlalaki.
- issue: Wika ng pamana sa lupain
  choice: mana
  alternative: bahaging lupa / pag-aari
  rationale: Pinananatili ng “mana” ang teolohikal at tipanang diwa ng lupa bilang kaloob na minana, sa halip na ilarawan lamang itong karaniwang pag-aari.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Ginamit ang “Josue,” ang nakaugaliang anyong Tagalog ng pangalan. Hinati sa dalawang pangungusap ang magkakasunod na sugnay upang maging malinaw at natural, nang hindi binabago ang pagkakasunod ng salaysay.
