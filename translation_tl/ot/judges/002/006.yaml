  source_fidelity: Tumpak na naipapahayag ang pagkakasunod ng salaysay, ang pagpapaalis/pagpapauwi ni Josue sa bayan, ang pagpunta ng mga Israelita nang bawat isa sa kaniyang mana, at ang layuning angkinin ang lupain. Ang “pinauwi” ay isang likas na kontekstuwal na pagsasalin ng וַיְשַׁלַּח dito; hindi nito binabago ang diwa ng pagpapalaya sa mga tao upang magtungo sa kanilang mga mana.
  naturalness: Likas at malinaw ang modernong Filipino Tagalog. Ang paghahati sa dalawang pangungusap ay maayos at nananatili ang daloy ng Hebreong salaysay. Ang “bawat isa patungo sa kanyang mana” ay natural na distributibong pagpapahayag.
  terminology: Ang “Josue,” “mga Israelita,” “mana,” at “lupain” ay angkop sa rehistro at sa konteksto. Wasto ang talababa sa “mga Israelita” upang maitala ang literal na panlalaking anyo ng בְנֵי יִשְׂרָאֵל nang hindi ginagawang di-likas ang pangunahing teksto.
