revisions:
- from: Ngunit maging sa kanilang mga hukom ay hindi sila nakinig, sapagkat nagpatutot sila sa pagsunod sa ibang mga diyos[a] at yumukod sa mga iyon. Mabilis silang lumihis sa daang nilakaran ng kanilang mga ninuno sa pagsunod sa mga utos ni Yahweh; hindi nila ginawa iyon.
  to: Ngunit maging sa kanilang mga hukom ay hindi sila nakinig, sapagkat nagpatutot sila sa pamamagitan ng pagsunod sa ibang mga diyos[a] at yumukod sa kanila. Mabilis silang lumihis sa daang nilakaran ng kanilang mga ninuno sa pagsunod sa mga utos ni Yahweh; hindi nila ginawa iyon.
  rationale: 'Ginawa lamang ang dalawang ligtas na pagpapakinis sa Filipino: nilinaw ang paraan ng idolatriya sa loob ng metapora ng “nagpatutot,” at pinalitan ang di-gaanong likas na “mga iyon” ng “kanila.” Hindi binago ang saklaw ng huling panghalip na “iyon,” ang larawan ng daan, o ang pangalan na Yahweh.'
