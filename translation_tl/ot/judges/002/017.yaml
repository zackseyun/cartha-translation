id: JDG.2.17
reference: Judges 2:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: tl
  text: Ngunit maging sa kanilang mga hukom ay hindi sila nakinig, sapagkat nagpatutot sila sa pamamagitan ng pagsunod sa ibang mga diyos[a] at yumukod sa kanila. Mabilis silang lumihis sa daang nilakaran ng kanilang mga ninuno sa pagsunod sa mga utos ni Yahweh; hindi nila ginawa iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, isang matinding talinghaga mula sa prostitusyon at seksuwal na pagtataksil ang ginamit para sa pagsamba sa ibang mga diyos at pagtataksil sa tipan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: Ngunit maging sa kanilang mga hukom ay hindi sila nakinig
  rationale: Ipinahahayag ng “ngunit” ang banayad na pagsalungat sa konteksto, at ng “maging” ang diin ng וְגַם. Pinananatili ng “nakinig” ang idyomang Hebreo na sa konteksto ay nangangahulugan ding hindi nila sinunod ang mga hukom.
- source_word: זָנוּ אַחֲרֵי
  choice: nagpatutot sila sa pagsunod sa
  rationale: Pinananatili nito ang matindi at sinadyang talinghaga ng prostitusyon at seksuwal na pagtataksil para sa pagsamba sa diyus-diyosan, habang ang “sa pagsunod sa” ay likas na Filipino para sa Hebreong larawan ng paghabol o pagsunod sa iba.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang tumutukoy ito sa mga diyos na iba kay Yahweh at hindi kailangang paliitin sa kahulugang “mga diyos ng ibang bayan.”
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: at yumukod sa mga iyon
  rationale: Pinananatili ang pisikal na larawan ng pagpapatirapa o pagyukod na nagpapahiwatig ng pagsamba.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Mabilis silang lumihis sa daan
  rationale: Pinananatili ang bilis na ipinahahayag ng מַהֵר at ang talinghaga ng paglihis mula sa landas ng matuwid na pamumuhay.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: na nilakaran ng kanilang mga ninuno
  rationale: Ang “nilakaran” ay nagpapanatili sa larawan ng paglakad sa isang daan; ang “mga ninuno” ay natural na makabagong Filipino para sa mga ama ng naunang salinlahi.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: sa pagsunod sa mga utos ni Yahweh
  rationale: Kapag mga utos ang layon ng שׁמע, malinaw na pagsunod ang diwa. Ang parirala ay inilapit sa paraan ng paglakad ng mga ninuno, gaya ng estruktura ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לֹא עָשׂוּ כֵן
  choice: hindi nila ginawa iyon
  rationale: Tuwirang isinasalin ang maikli at pangkalahatang pagtukoy ng Hebreo nang hindi tahimik na nililinaw kung aling naunang kilos ang eksaktong tinutukoy ng “iyon.”
theological_decisions:
- issue: Talinghaga ng seksuwal na pagtataksil sa זָנוּ
  choice: Pinanatili bilang “nagpatutot sila”
  alternative: “nagtaksil sila” o “sumunod sila”
  rationale: Sinasadyang ilarawan ng Hebreo ang idolatriya bilang matinding pagtataksil sa tipan. Ang mas pangkalahatang “nagtaksil” ay magpapahina sa seksuwal at moral na bigat ng talinghaga.
- issue: Pangalan ng Diyos na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang “Yahweh” ay tuwirang transliterasyon ng personal na pangalan at iniiwasang gawing titulo ang pangalan sa tekstong Hebreo.
- issue: Saklaw ng huling pariralang לֹא עָשׂוּ כֵן
  choice: Pinanatiling pangkalahatan sa “hindi nila ginawa iyon”
  alternative: “hindi nila sinunod ang mga utos ni Yahweh”
  rationale: Maaaring tumukoy ang “iyon” sa paglakad sa daan ng mga ninuno o, mas tiyak, sa pagsunod sa mga utos. Hindi nilulutas ng salin ang bahagyang kalabuan ng orihinal.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Sadyang pinanatili ang matinding talinghaga ng Hebreo, ang larawan ng pagyukod at paglakad sa isang daan, at ang bahagyang kalabuan ng huling “iyon.”
