  terminology: Pinananatili ang “mga hukom,” “mga utos,” at “Yahweh.” Ang “nagpatutot” ay matindi ngunit angkop na katumbas ng sinadyang metaporang seksuwal na pagtataksil sa Hebreo. Nananatili rin ang talababa upang ipaliwanag na ito ay metapora para sa idolatriya at di-pagtatapat sa tipan.
