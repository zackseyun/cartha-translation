  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: tl
  text: Saanman sila humayo[a], ang kamay ni Yahweh ay laban sa kanila para sa kapahamakan[b], gaya ng sinabi ni Yahweh at gaya ng ipinanumpa ni Yahweh sa kanila, at lubha silang nabagabag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Tuwing humahayo sila,” marahil sa diwang humahayo upang makipagdigma o magsagawa ng kampanya.
    reason: lexical_alternative
  - marker: b
    text: O “sakuna” o “kasamaan.” Ang Hebreong רָעָה rito ay tumutukoy sa pinsala o kapahamakang dumarating, hindi kinakailangang sa moral na kasamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Saanman sila humayo
  rationale: Pinananatili nito ang malawak na saklaw ng idyoma nang hindi nililimitahan sa pakikidigma, bagaman maaaring iyon ang ipinahihiwatig ng konteksto.
- source_word: יַד יְהוָה
  choice: ang kamay ni Yahweh
  rationale: Pinananatili ang Hebreong metapora para sa aktibong kapangyarihan at pagkilos ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan sa Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הָיְתָה בָם לְרָעָה
  choice: ay laban sa kanila upang magdulot ng kapahamakan
  rationale: Ipinahahayag nito ang masamang kinahinatnan ng banal na pagkilos nang hindi ipinakahulugang moral na kasamaan ang רָעָה.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: gaya ng sinabi ni Yahweh
  rationale: Natural sa modernong Tagalog at malinaw na tumutukoy sa naunang babala ng Diyos.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: at gaya ng isinumpa ni Yahweh sa kanila
  rationale: Pinananatili ang tuwirang ugnayan ng panunumpa sa kanila, kahit hindi inuulit sa talata ang nilalaman nito.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: Kaya labis silang naghirap
  rationale: Natural na ipinahahayag ang napakatinding kagipitan o paghihirap na dinanas nila; ang 'labis' ay kumakatawan sa מְאֹד.
theological_decisions:
- issue: Ang aktibong pagsalungat ng Diyos bilang paghatol sa tipan
  choice: ang kamay ni Yahweh ay laban sa kanila upang magdulot ng kapahamakan
  alternative: ang kamay ni Yahweh ay laban sa kanila para sa kasamaan
  rationale: Pinananatili ang malinaw na banal na pagkilos sa paghatol, ngunit hindi ipinahihiwatig na gumagawa ang Diyos ng moral na kasamaan. Hindi nilulutas nang palihim ang tensiyong teolohikal ng teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang metaporang “kamay ni Yahweh” at ang personal na pangalang Yahweh. Ang “humayo” ay bahagyang pormal ngunit karaniwan sa salin-Biblia at hindi labis na teknikal.
