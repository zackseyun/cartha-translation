  to: Saanman sila humayo[a], ang kamay ni Yahweh ay laban sa kanila para sa kapahamakan[b], gaya ng sinabi ni Yahweh at gaya ng ipinanumpa ni Yahweh sa kanila, at lubha silang nabagabag.
