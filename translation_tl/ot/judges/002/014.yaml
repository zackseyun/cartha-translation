  rationale: Pinananatili ang idyomang Hebreo; ipinahihiwatig nito ang pagpapasailalim sa kapangyarihan ng iba.
- source_word: שֹׁסִים ... וַיָּשֹׁסּוּ
  choice: mga mandarambong, na nandambong sa kanila
