  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: tl
  text: At nag-alab ang galit ni Yahweh laban sa Israel,[a] at ibinigay niya sila sa kapangyarihan ng mga mandarambong, na nandambong sa kanila. Ipinagbili niya sila sa kapangyarihan[b] ng kanilang mga kaaway na nakapaligid sa kanila,[c] kaya hindi na sila makapanindigan sa harap ng kanilang mga kaaway.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagningas ang galit ni Yahweh laban sa Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “sa kamay ng,” isang idyomang nangangahulugang nasa kapangyarihan o kontrol ng iba.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “ng kanilang mga kaaway sa lahat ng panig.”
    reason: lexical_alternative
