revisions:
- from: Iniwan nila si Yahweh, ang Diyos ng kanilang mga ninuno, na naglabas sa kanila mula sa lupain ng Egipto. Sumunod sila sa ibang mga diyos mula sa mga diyos ng mga bayang nakapaligid sa kanila; yumukod sila sa mga iyon at ginalit nila si Yahweh.
  to: Tinalikuran nila si Yahweh, ang Diyos ng kanilang mga ninuno, na naglabas sa kanila mula sa lupain ng Egipto. Sumunod sila sa ibang mga diyos na sinasamba ng mga bayang nakapaligid sa kanila[a]; yumukod sila sa mga iyon at ginalit nila si Yahweh.
  rationale: Pinalitan ang “Iniwan” ng “Tinalikuran” upang mas malinaw na maihatid ang relasyonal at tipanang bigat ng עזב. Inayos ang parirala tungkol sa mga diyos ng nakapaligid na bayan upang maging natural at walang maling ugnayang pangpinagmulan sa Tagalog. Nagdagdag ng tala na nag-iingat sa posibleng partitive na kahulugan ng מִן, alinsunod sa source ambiguity at English POB audit trail.
