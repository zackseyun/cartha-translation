id: JDG.2.12
reference: Judges 2:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: tl
  text: Tinalikuran nila si Yahweh, ang Diyos ng kanilang mga ninuno, na naglabas sa kanila mula sa lupain ng Egipto. Sumunod sila sa ibang mga diyos na sinasamba ng mga bayang nakapaligid sa kanila[a]; yumukod sila sa mga iyon at ginalit nila si Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “sa ibang mga diyos mula sa mga diyos ng mga bayang nakapaligid sa kanila.” Maaaring ipahiwatig ng Hebreo ang ilan sa mga diyos ng nakapaligid na mga bayan, o mas pangkalahatan ang mga diyos na sinasamba nila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: Iniwan
  rationale: Sa konteksto, ang עזב ay tumutukoy sa pagtatakwil o pagtalikod sa kanilang Diyos. Ang “iniwan” ay tuwiran at natural sa modernong Tagalog, at malinaw ang bigat nito dahil sa kasunod na pagsunod sa ibang mga diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: ang Diyos ng kanilang mga ninuno
  rationale: Natural at inklusibong modernong Tagalog ito para sa covenantal na pariralang “Diyos ng kanilang mga ama,” nang hindi binabago ang pagtukoy sa mga naunang salinlahi.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: na naglabas sa kanila mula sa lupain ng Egipto
  rationale: Ang may pantukoy na participle ay naglalarawan kay Yahweh sa pamamagitan ng ginawa niyang pagliligtas sa Exodo. Pinananatili ng “naglabas” at “mula sa lupain” ang kilos at pinagmulan.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: Sumunod sila sa
  rationale: Ang idyomang Hebreo ay nagsasaad ng pagsunod at katapatan. Mas natural sa Tagalog ang “sumunod sa” kaysa literal na “lumakad sa likuran ng.”
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ibang mga diyos
  rationale: Tuwirang katumbas ito ng “other gods” at hindi nagdaragdag ng interpretasyong “dayuhan.”
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: mula sa mga diyos ng mga bayang nakapaligid sa kanila
  rationale: Pinananatili ang Hebreong min-construction nang hindi sapilitang nilulutas kung ito ay tahasang partitive; natural pa rin sa Tagalog ang ugnayan sa mga diyos na sinasamba ng nakapaligid na mga bayan.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: yumukod sila sa mga iyon
  rationale: Pinananatili ang kongkretong larawan ng pagyukod, habang ipinahihiwatig ng konteksto ang pagsamba. Ginamit ang “mga iyon” upang malinaw na tumukoy sa mga diyos, hindi sa mga bayan.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: ginalit nila si Yahweh
  rationale: 'Natural at tumpak na Tagalog para sa causative na diwa ng Hiphil: dahil sa kanilang ginawa, napukaw ang galit ni Yahweh.'
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal at tipanang pangalan, sa halip na palitan ng titulo.
- issue: Tipanang bigat ng pagtalikod ng Israel
  choice: Ipinahayag sa mga kilos ng pag-iwan, pagsunod, pagyukod, at paggalit kay Yahweh nang walang idinagdag na paliwanag
  alternative: Tahasan itong tawaging paglabag sa tipan
  rationale: Malinaw na ipinakikita ng talata ang apostasiya, ngunit hindi nito ginagamit dito ang terminong “paglabag sa tipan.” Kaya pinananatili ang teolohikal na bigat nang hindi nagdaragdag ng paliwanag sa pangunahing teksto.
- issue: Kahulugan ng מִן bago ang “mga diyos ng mga bayan”
  choice: mula sa mga diyos ng mga bayang nakapaligid sa kanila
  alternative: mula sa mga diyos na kabilang sa mga bayang nakapaligid sa kanila; mula sa ilan sa mga diyos ng nakapaligid na mga bayan
  rationale: Ang “mula sa” ay nagpapanatili sa anyo at posibleng partitive na diwa ng Hebreo nang hindi dinaragdagan ng “ilan,” na hindi tahasang nakasulat.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Gumamit ng maiikling sugnay at karaniwang bokabularyo, habang pinananatili ang kongkretong larawan ng Hebreo at ang serye ng mga kilos. Walang footnote dahil ang lexical na alternatibo ay kayang panatilihin sa pangunahing teksto nang hindi nakaliligaw.
