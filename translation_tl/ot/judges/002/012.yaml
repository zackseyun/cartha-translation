  source_fidelity: 'Tumpak ang pangkalahatang pagkakasunod-sunod ng mga kilos at ang mga pangunahing sanggunian: pagtalikod kay Yahweh, mga diyos ng nakapaligid na mga bayan, pagyukod, at pagpapagalit kay Yahweh. Gayunman, ang “mula sa mga diyos” kasunod ng “sumunod ... sa ibang mga diyos” ay hindi idiomatiko sa Tagalog at maaaring maling magpahiwatig na ang mga diyos mismo ay nagmula sa ibang mga diyos. Ang mas natural na pangunahing teksto ay maaaring ilahad ang mas pangkalahatang ugnayan, habang itinatala sa tala ang partitive na posibilidad ng מִן.'
  naturalness: Makabago at marangal ang rehistro. Mas malinaw at mas natural ang “Tinalikuran nila” para sa covenantal na pag-iwan, at ang pag-aalis sa literal ngunit alanganing “mula sa mga diyos” sa pangunahing pangungusap ay nagpapabuti sa daloy nang hindi binabago ang kahulugan.
  terminology: Wastong pinanatili ang “Yahweh,” “Diyos,” “Egipto,” at “mga diyos.” Ang “mga ninuno” ay isang natural na Filipino na katumbas ng “mga ama” sa idiomang ito. Pinananatili ng “yumukod” ang kongkretong kilos ng Hebreo; ang “ginalit” ay angkop para sa causative na pandiwa.
  issues:
  - severity: medium
    issue: Ang “Sumunod sila sa ibang mga diyos mula sa mga diyos ng mga bayang nakapaligid sa kanila” ay alanganin sa Tagalog.
