  text: וְ/גַם֙ כָּל הַ/דּ֣וֹר הַ/ה֔וּא נֶאֶסְפ֖וּ אֶל אֲבוֹתָ֑י/ו וַ/יָּקָם֩ דּ֨וֹר אַחֵ֜ר אַחֲרֵי/הֶ֗ם אֲשֶׁ֤ר לֹא יָֽדְעוּ֙ אֶת יְהוָ֔ה וְ/גַם֙ אֶת הַֽ/מַּעֲשֶׂ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: tl
  text: At ang buong salinlahing iyon ay pumanaw rin at napabilang sa kanilang mga ninuno.[a] Pagkatapos nila, lumitaw ang isa pang salinlahi na hindi nakakilala kay Yahweh,[b] ni maging ang ginawa niya para sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “natipon sa kanilang mga ninuno,” isang idyoma para sa pagkamatay at pagsama sa mga naunang salinlahi.
    reason: cultural_note
  - marker: b
    text: Maaari ring “hindi kumilala kay Yahweh.” Ang salitang Hebreo ay maaaring tumukoy sa relasyonal o tipanang pagkilala, hindi lamang sa kaalaman tungkol sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: At ang buong salinlahing iyon ay ... rin
  rationale: Pinananatili ng “at” at “rin” ang pandugtong at dagdag-diin ng וְגַם, habang ang “buong salinlahing iyon” ay natural na katumbas ng כָּל הַדּוֹר הַהוּא.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: pumanaw at napabilang sa kanilang mga ninuno
  rationale: Ipinahahayag ang kahulugan ng Hebreong idyoma—ang pagkamatay at pagsama sa mga naunang salinlahi—sa paraang malinaw sa makabagong Tagalog, habang pinananatili ang larawang intergenerasyonal.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: Pagkatapos nila, lumitaw ang isa pang salinlahi
  rationale: Ang “lumitaw” ay likas na salin ng pag-usbong o pagdating ng bagong pangkat, at malinaw na pinananatili ng “pagkatapos nila” ang temporal na pagkakasunod.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: hindi nakakilala kay Yahweh
  rationale: Ang “nakakilala” ay maaaring tumukoy kapwa sa kaalaman at sa relasyonal o tipanang pagkilala; hindi nito nililimitahan ang Hebreo sa simpleng kakulangan ng impormasyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos ayon sa anyong karaniwang kumakatawan sa tetragrammaton.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: ni sa ginawa niya para sa Israel
  rationale: Sa negatibong pangungusap, natural na ipinapakita ng “ni” ang ikalawang bagay na hindi nila nakilala. Ang “ginawa” ay sapat na malawak para sa singular na מַעֲשֶׂה, at ang “para sa Israel” ay kumakatawan sa benefaktibong gamit ng לְ.
theological_decisions:
- issue: Kahulugan ng “hindi nakakilala kay Yahweh”
  choice: Pinanatiling malawak ang diwa upang masaklaw ang relasyonal, karanasan, at kaalamang pagkilala.
  alternative: “hindi kumilala kay Yahweh,” na higit na nagbibigay-diin sa hindi pagkilala o hindi pagpapasakop sa kanya
  rationale: Maaaring taglayin ng יָדַע ang parehong factual at relasyonal/tipan na kahulugan. Ang “nakakilala” ay nagpapanatili sa tensiyong ito sa halip na magtakda ng iisang interpretasyon.
- issue: Paglalarawan sa pagkamatay ng naunang salinlahi
  choice: Ipinaliwanag sa pangunahing teksto ang idyoma bilang “pumanaw at napabilang sa kanilang mga ninuno.”
  alternative: Mas literal na “natipon sa kanilang mga ninuno”
  rationale: Ang literal na anyo ay maaaring hindi agad maunawaan sa Tagalog. Ang piniling salin ay malinaw na nagpapahiwatig ng kamatayan ngunit pinananatili rin ang konsepto ng pagsama sa mga ninuno.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “salinlahi” para sa dignidad at katumpakan, “pumanaw” para sa likas ngunit magalang na pagpapahayag ng kamatayan, at “nakakilala” upang mapanatili ang leksikal at teolohikal na lawak ng Hebreo.
