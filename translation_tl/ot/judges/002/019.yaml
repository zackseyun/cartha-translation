  - severity: low
    issue: Maaaring higit na malinaw ang paulit-ulit na aspekto ng pambungad.
    rationale: Ang “kapag namatay ang hukom” ay natural na naghahayag na ito ang nagaganap sa tuwing namamatay ang isang hukom, samantalang ang “At pagkamatay” ay maaaring basahing isang minsanang pangyayari.
