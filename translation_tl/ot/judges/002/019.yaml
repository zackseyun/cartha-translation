  verdict: revise
  source_fidelity: Tumpak sa kabuuan ang pagsasalin ng pagbabalik sa dating asal, higit na kasamaan kaysa sa mga naunang salinlahi, pagsunod sa ibang mga diyos, paglilingkod at pagyukod sa mga ito, at hindi pagtalikod sa masasamang gawa at matigas na paraan ng pamumuhay. Gayunman, ang pangwakas na paliwanag sa talababa na “pagpapalaglag” ay hindi wastong likas o tumpak na paglalarawan ng idyomang Hebreo at maaaring magpahiwatig ng ibang kahulugan sa modernong Filipino.
  naturalness: Malinaw at marangal ang pangunahing teksto. Ang “kapag namatay ang hukom” ay mas likas na naghahayag ng paulit-ulit na pangyayaring ipinakikita ng Hebreo kaysa sa pangngalang pariralang “At pagkamatay ng hukom.”
  terminology: Ang “hukom,” “ibang mga diyos,” “paglingkuran,” at “yumukod” ay angkop at pinananatili ang mga mahahalagang pagkakaiba ng Hebreo. Ang “mga ninuno” ay katanggap-tanggap sa konteksto para sa mga naunang henerasyon, bagaman literal na “mga ama” ang Hebreo.
