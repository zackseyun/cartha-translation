base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: tl
  text: Kapag namatay ang hukom, muli silang bumabalik sa dati at lalo pang nagiging masama kaysa sa kanilang mga ninuno, sa pagsunod sa ibang mga diyos upang paglingkuran ang mga ito at yumukod sa mga ito. Hindi nila binitiwan[a] ang alinman sa kanilang mga gawain o ang mapagmatigas nilang pamumuhay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Hindi nila tinalikuran.” Sa literal na larawan ng Hebreo, hindi nila hinayaang mahulog o hindi nila ibinaba ang mga ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: At pagkamatay ng hukom
  rationale: Likas na temporal na sugnay sa Tagalog para sa pormulang Hebreo; pinananatili ng “hukom” ang natatanging tawag sa mga pinunong tagapagligtas sa aklat.
- source_word: יָשֻׁבוּ
  choice: muli silang nagbalik sa dati
  rationale: Ipinahahayag ang pagbabalik sa dating masamang asal, hindi isang pisikal na pag-uwi.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: lalo pang nagpakasama kaysa sa kanilang mga ninuno
  rationale: Pinananatili ang pahambing na diwa at malinaw na ipinahahayag ang lumalalang katiwalian; ang “mga ninuno” ay natural na makabagong katumbas ng kolektibong “kanilang mga ama.”
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: Sumunod sila sa ibang mga diyos
  rationale: Pinananatili ang larawang Hebreo ng pagsunod bilang pagpapahayag ng katapatan sa ibang mga diyos.
- source_word: לְעָבְדָם
  choice: upang paglingkuran ang mga ito
  rationale: Ang “paglingkuran” ay tuwirang katumbas at hindi nilulusaw ang naiibang kilos ng pagyukod na kasunod.
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: at yumukod sa mga ito
  rationale: Pinananatili ang pisikal at panrelihiyong diwa ng pagpapatirapa o pagyukod bilang pagpupugay.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: Hindi nila binitiwan ang alinman sa kanilang mga gawain
  rationale: Ang “binitiwan” ay natural sa Tagalog ngunit nananatiling malapit sa matingkad na larawan ng Hiphil נפל na hindi nila hinayaang malaglag o iwan ang kanilang ginagawa.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: o ang mapagmatigas nilang pamumuhay
  rationale: Ginagawang natural ang metaporikong “daan” bilang paraan ng pamumuhay at ipinahahayag ang moral na katigasan ng קָשֶׁה.
theological_decisions:
- issue: Paglalarawan sa אֱלֹהִים אֲחֵרִים sa konteksto ng pagtalikod ng Israel
  choice: ibang mga diyos
  alternative: mga diyos ng ibang mga bayan
  rationale: Pinananatili ang payak na kaibahan sa Diyos ng Israel nang hindi nagdaragdag ng etnikong kahulugang hindi tahasang sinasabi ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga ninuno” at “pamumuhay” upang maging likas sa karaniwang mambabasa, habang pinanatili sa “binitiwan” at sa talababa ang matingkad na larawang Hebreo.
