id: JDG.2.2
reference: Judges 2:2
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אַתֶּ֗ם לֹֽא תִכְרְת֤וּ בְרִית֙ לְ/יֽוֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִזְבְּחוֹתֵי/הֶ֖ם תִּתֹּצ֑וּ/ן וְ/לֹֽא שְׁמַעְתֶּ֥ם בְּ/קֹלִ֖/י מַה זֹּ֥את עֲשִׂיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: tl
  text: At hindi kayo dapat makipagtipan[a] sa mga naninirahan sa lupaing ito; dapat ninyong gibain ang kanilang mga altar. Ngunit hindi kayo nakinig sa aking tinig. Ano itong ginawa ninyo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pumutol ng tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: makipagtipan
  rationale: Ang literal na idyomang Hebreo ay “pumutol ng tipan.” Ang “makipagtipan” ang likas at malinaw na katumbas sa modernong Tagalog at pinananatili nito ang buong diwa ng בְּרִית, hindi lamang ang mas makitid na ideya ng kasunduang pampolitika.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: sa mga naninirahan sa lupaing ito
  rationale: Tumpak na inilalarawan ng “mga naninirahan” ang substantibong participle na יֹשְׁבֵי, at pinananatili ng “lupaing ito” ang demonstratibong הַזֹּאת.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: dapat ninyong gibain ang kanilang mga altar
  rationale: Ang נתץ ay tumutukoy sa paggiba o pagwasak ng mga gusali at altar. Ang “gibain” ay maikli, malinaw, at angkop sa bagay na pisikal na itinayo. Ang “dapat ninyong” ay nagpapakita na binabalikan dito ang naunang utos.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Ngunit hindi kayo nakinig sa aking tinig
  rationale: Pinananatili ng “nakinig sa aking tinig” ang larawan ng Hebreo, habang malinaw sa konteksto na kasama rito ang pagsunod. Ang “Ngunit” ay likas na naghahayag ng pagsalungat sa utos na nauna.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: Ano itong ginawa ninyo?
  rationale: Pinananatili nito ang pambihirang anyo at matinding pagsaway ng Hebreo, sa halip na gawing tanong tungkol sa dahilan gaya ng “Bakit ninyo ito ginawa?”
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: At hindi kayo dapat ...; dapat ninyong ...
  rationale: Ang mga imperfect ay paggunita sa naunang mga utos bago banggitin ang kabiguan ng Israel. Likas sa Tagalog ang “hindi ... dapat” at “dapat ninyong” para sa obligasyong hindi nila tinupad.
theological_decisions:
- issue: Tawag sa ipinagbabawal na ugnayan ng Israel sa mga naninirahan sa lupain
  choice: makipagtipan
  alternative: makipagkasundo / gumawa ng kasunduang pampolitika
  rationale: Ang “tipan” ay nagpapanatili sa malawak na biblikal at teolohikal na kahulugan ng בְּרִית at hindi ito nililimitahan sa diplomasya o pulitika lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “altar,” na karaniwan at tiyak na terminong biblikal sa Filipino. Inilagay ang talababa pagkatapos ng “makipagtipan,” ang pariralang aktuwal nitong ipinapaliwanag.
