base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: tl
  text: Kaya sinabi ko rin[a], ‘Hindi ko sila palalayasin mula sa harapan ninyo; sila ay magiging mga kalaban ninyo, at ang kanilang mga diyos ay magiging isang bitag sa inyo.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga tagiliran.” Binabasa o inuunawa ito ng ilang sinaunang salin at kahalintulad na talata bilang “mga tinik sa inyong mga tagiliran.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Kaya ... rin
  rationale: Iniuugnay nito ang pahayag sa naunang pagsaway at ipinahahayag ang bunga nito, habang pinananatili ang dagdag na diin ng גַּם.
- source_word: אָמַרְתִּי
  choice: sinabi ko
  rationale: Likas at tuwirang katumbas ng karaniwang pandiwang Hebreo sa kontekstong pasalaysay.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: Hindi ko sila palalayasin
  rationale: Ang גרש ay nangangahulugang magtaboy o magpalayas; malinaw ang ‘palalayasin’ sa konteksto ng pagpapaalis sa mga bayan.
- source_word: מִפְּנֵיכֶם
  choice: mula sa harapan ninyo
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang diwa ng pag-aalis sa mga bayan mula sa lugar na nasa harap ng Israel.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: Sila ay magiging mga kalaban ninyo
  rationale: Mahirap at literal na ‘mga tagiliran’ ang Masoretikong anyo. Ipinahahayag ng ‘mga kalaban’ ang malamang na tungkulin nitong mapanupil o mapaminsala nang hindi inilalagay sa pangunahing teksto ang alternatibong ‘mga tinik sa inyong tagiliran.’
- source_word: וֵאלֹהֵיהֶם
  choice: at ang kanilang mga diyos
  rationale: Tuwirang katumbas ng pangmaramihang anyo sa konteksto ng mga diyos ng mga bansang nakapaligid sa Israel.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: ay magiging isang bitag sa inyo
  rationale: Ang מוֹקֵשׁ ay patibong o bitag, na dito ay talinghaga para sa panganib ng pagkaligaw sa pagsamba.
theological_decisions:
- issue: Mahirap na Masoretikong pagbasa na לְצִדִּים
  choice: mga kalaban ninyo
  alternative: mga tinik sa inyong mga tagiliran
  rationale: Ang ibinigay na tekstong Hebreo ay literal na tumutukoy sa ‘mga tagiliran,’ ngunit hindi malinaw ang idyomang iyon sa modernong Tagalog. Isinalin sa pangunahing teksto ang malamang na diwa ng pagkapoot o pamiminsala, habang inilalahad sa talababa ang literal na anyo at ang tradisyonal na alternatibong pagbasa upang hindi maitago ang suliraning tekstuwal.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘palalayasin,’ ‘mga kalaban,’ at ‘bitag’ bilang mga salitang madaling maunawaan, habang pinanatili sa talababa ang tunay na hirap at alternatibong pagbasa ng tekstong Hebreo.
