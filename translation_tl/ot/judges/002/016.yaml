id: JDG.2.16
reference: Judges 2:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: tl
  text: Pagkatapos, nagbangon si Yahweh ng mga hukom, at iniligtas[a] nila ang mga Israelita mula sa kamay ng mga nanamsam sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, sinagip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: nagbangon
  rationale: Ipinahahayag ng hiphil ng קום na si Yahweh ang nagpasimula sa paglitaw at pagkatalaga ng mga pinuno. Pinananatili ng “nagbangon” ang larawan at ang pagkilos ng Diyos.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang Tetragrammaton bilang personal na pangalan ng Diyos, sa halip na palitan ito ng isang titulo.
- source_word: שֹׁפְטִים
  choice: mga hukom
  rationale: Ito ang tuwirang katumbas ng katawagan sa Hebreo at pinananatili ang mahalagang terminolohiya ng aklat, kahit mas malawak kaysa gawaing panghukuman ang ginampanan nila.
- source_word: וַיּוֹשִׁיעוּם
  choice: iniligtas nila ang mga Israelita
  rationale: Ang ישׁע ay tumutukoy sa pagsagip o pagliligtas. Nilinaw ng “mga Israelita” ang tinutukoy ng hulaping panghalip ayon sa agarang konteksto, nang hindi binabago ang diwa.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang metaporang Hebreo para sa kapangyarihan o kontrol, at nauunawaan pa rin nang natural sa Filipino.
- source_word: שֹׁסֵיהֶם
  choice: mga nanamsam sa kanila
  rationale: Ipinahahayag nito ang marahas na pagkuha at pandarambong na saklaw ng salitang Hebreo; mas tiyak ito kaysa sa pangkalahatang “mga umapi.”
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit mismo sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang ipinahayag sa Israel.
- issue: Kung itatampok ang mga שֹׁפְטִים bilang mga hukom o bilang mga tagapagligtas
  choice: Tinawag silang “mga hukom,” at inilahad sa kasunod na pandiwa ang kanilang pagliligtas.
  alternative: Tawagin silang “mga tagapagligtas.”
  rationale: Pinagsasama ng tekstong Hebreo ang kanilang katawagan at tungkulin. Ang pagpapanatili sa dalawa ay umiiwas sa pagpapakitid ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang idyomang “mula sa kamay” dahil nauunawaan ito at inilalarawan ang paglaya mula sa kapangyarihan ng mga nanamsam.
