  source_fidelity: 'Tumpak ang pagsasalin sa pangunahing mga elemento ng Hebreo: si Yahweh ang nagbangon ng mga hukom; ang mga hukom ang kumilos upang iligtas ang tinutukoy na bayan; at ang pagliligtas ay mula sa kapangyarihan ng mga nanamsam sa kanila. Ang paglinaw sa panghalip bilang “mga Israelita” ay sinusuportahan ng agarang konteksto at hindi nagdaragdag ng bagong kahulugan.'
  naturalness: Natural at marangal ang daloy sa makabagong Filipino. Ang “nagbangon si Yahweh ng mga hukom” ay angkop na pampanitikan/biblikal na pananalita para sa maka-Diyos na paglalagay o pagpapalitaw ng mga pinuno. Nauunawaan din ang idyomang “mula sa kamay ng.”
  terminology: Wasto at magkakatugma ang “Yahweh,” “mga hukom,” “iniligtas,” at “mga nanamsam.” Pinananatili ng “mga hukom” ang katawagang Hebreo habang inilalahad ng pandiwang “iniligtas” ang tungkulin nilang tagapagligtas. Ang talababa ay nagbibigay ng lehitimong alternatibong leksikal.
