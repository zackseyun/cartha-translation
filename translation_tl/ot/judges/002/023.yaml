- from: Kaya pinabayaan ni Yahweh na manatili ang mga bansang ito[a]. Hindi niya sila mabilis na pinalayas ni ibinigay sa kamay ni Josue.
  to: Kaya't hinayaan ni Yahweh na manatili ang mga bansang ito[a], nang hindi niya sila mabilis na pinalayas, at hindi niya sila ibinigay sa kamay ni Josue.
  rationale: Inayos ang maling pagkakaugnay ng mga negatibong pandiwa at pinanatili ang pagkakasunod at saklaw ng tatlong pahayag sa Hebreo. Ang "nang hindi" ay maingat na naghahayag ng kaugnayan ng hindi agarang pagpapaalis sa pagpayag na manatili, nang hindi ipinipilit kung layunin o resulta ang diin ng konstruksyong Hebreo.
