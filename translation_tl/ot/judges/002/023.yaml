base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: tl
  text: Kaya't hinayaan ni Yahweh na manatili ang mga bansang ito[a], nang hindi niya sila mabilis na pinalayas, at hindi niya sila ibinigay sa kamay ni Josue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga bayang ito”; ang pandiwang Hebreo ay maaaring mangahulugang “hinayaang manatili” o “iniwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: pinabayaan ... na manatili
  rationale: Ipinapahayag ng causative na anyo ng נוח/הניח na hinayaan silang manatili; natural ito sa modernong Tagalog at malinaw sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ang mga bansang ito
  rationale: Ang גּוֹיִם ay maaaring tumukoy sa mga bansa o mga bayan; ang “mga bansa” ay angkop sa mga pangkat na nanatili sa Canaan.
- source_word: לְבִלְתִּי הוֹרִישָׁם מַהֵר
  choice: Hindi niya sila mabilis na pinalayas
  rationale: Ang causative na הוֹרִישׁ ay nangangahulugang magtaboy o magpaalis sa mga naninirahan, at מַהֵר ay “mabilis.” Hiwalay na pangungusap ang ginamit para sa likas at malinaw na Tagalog.
- source_word: וְלֹא נְתָנָם בְּיַד יְהוֹשֻׁעַ
  choice: ni ibinigay sa kamay ni Josue
  rationale: Pinananatili ang Hebreong larawan ng pagbibigay “sa kamay” bilang pagpapasailalim sa kapangyarihan o tagumpay ng isang tao.
theological_decisions:
- issue: Paglalarawan sa pangalan na יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa talata ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Ugnayan ng hindi agarang pagpapaalis sa pagkilos ni Yahweh
  choice: Hindi niya sila mabilis na pinalayas
  alternative: upang hindi niya sila mabilis na mapalayas
  rationale: Maaaring magpahiwatig ng layunin o resulta ang לְבִלְתִּי. Pinananatili ng salin ang tuwirang pagkakaugnay nang hindi labis na nilulutas kung layunin o resulta ang diin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Josue,” ang karaniwang anyo ng pangalang biblikal sa Tagalog, at pinanatili ang idyomang “sa kamay” dahil nauunawaan ito bilang pagpapasailalim sa kapangyarihan.
