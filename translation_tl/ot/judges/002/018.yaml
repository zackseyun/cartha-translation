id: JDG.2.18
reference: Judges 2:18
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: tl
  text: Sa tuwing nagbabangon si Yahweh ng mga hukom para sa kanila, si Yahweh ay kasama ng hukom at inililigtas sila mula sa kamay ng kanilang mga kaaway sa buong panahon ng hukom. Sapagkat naantig sa habag[a] si Yahweh sa kanilang pagdaing, na dulot ng mga umaapi at gumigipit sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nagbago ng loob” o “nahabag.” Maaaring tumukoy ang pandiwang Hebreo sa pagbabago ng disposisyon o sa mahabaging pagtugon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Sa tuwing
  rationale: Ipinahihiwatig ng konteksto ang paulit-ulit na pangyayari sa buod ng kasaysayan, hindi lamang ang isang pagkakataon.
- source_word: הֵקִים
  choice: nagbabangon
  rationale: Pinananatili nito ang larawang Hebreo ng pagkilos ng Diyos upang maglaan ng mga hukom, at ang aspektong paulit-ulit ay angkop sa “sa tuwing.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: שֹׁפְטִים
  choice: mga hukom
  rationale: Ito ang kinikilalang tawag sa mga pinunong ito sa aklat, samantalang malinaw na ipinakikita ng kasunod na pandiwa ang papel nila sa pagliligtas.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: si Yahweh ay sumasama sa hukom
  rationale: Natural itong nagpapahayag sa Tagalog ng presensiya at pagtulong ni Yahweh sa bawat hukom.
- source_word: וְהוֹשִׁיעָם
  choice: inililigtas sila
  rationale: Tumpak na ipinahahayag ang pagliligtas o pagsagip, at nililinaw ng kasunod na parirala kung kaninong kapangyarihan sila inililigtas.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: mula sa kamay ng kanilang mga kaaway
  rationale: Pinananatili ang kongkretong idyomang Hebreo, na nauunawaan din sa Tagalog bilang kapangyarihan o kontrol.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: sa buong panahon ng hukom
  rationale: Pinananatili ang saklaw ng buong panahong kaugnay ng hukom nang hindi tahasang nagpapasiya kung buhay, panunungkulan, o pamumuno lamang ang tinutukoy.
- source_word: יִנָּחֵם
  choice: naantig sa habag
  rationale: Ipinahahayag nito ang mahabaging pagtugon ni Yahweh sa pagdurusa, habang inilalagay sa talababa ang posibleng diwang pagbabago ng loob o pag-urong.
- source_word: מִנַּאֲקָתָם
  choice: dahil sa kanilang pagdaing
  rationale: Ipinakikita ng pariralang ito na ang pagdaing ang dahilan o pagkakataon ng mahabaging pagtugon ni Yahweh.
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: mga umaapi at gumigipit sa kanila
  rationale: Pinananatili ang dalawang magkaugnay ngunit hindi ganap na magkaparehong paglalarawan sa mga nagpapahirap sa Israel.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ng “Yahweh” ang pagkakaiba nito sa isang karaniwang titulo.
- issue: Antropopatikong pananalita sa יִנָּחֵם יְהוָה
  choice: naantig sa habag si Yahweh
  alternative: nagbago ng loob si Yahweh; umurong si Yahweh; nahabag si Yahweh
  rationale: Itinatampok ng pangunahing salin ang mahabaging pagtugon sa pagdaing, ngunit hindi ikinukubli ng talababa na maaari ring ipahiwatig ng pandiwang Hebreo ang pagbabago ng disposisyon o pag-urong.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang “Yahweh,” “mga hukom,” at “mula sa kamay” bilang mahahalagang termino at larawan ng tekstong Hebreo. Iniwasang gawing tahasang “habang nabubuhay” o “habang namumuno” ang כֹּל יְמֵי upang hindi paliitin ang posibleng saklaw nito.
