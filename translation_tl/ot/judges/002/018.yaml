  to: Sa tuwing nagbabangon si Yahweh ng mga hukom para sa kanila, si Yahweh ay kasama ng hukom at inililigtas sila mula sa kamay ng kanilang mga kaaway sa buong panahon ng hukom. Sapagkat naantig sa habag[a] si Yahweh sa kanilang pagdaing, na dulot ng mga umaapi at gumigipit sa kanila.
