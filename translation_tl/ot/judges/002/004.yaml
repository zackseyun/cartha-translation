source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: tl
  text: At nang sabihin ng anghel[b] ni Yahweh ang mga salitang ito sa lahat ng mga anak ni Israel[a], nagtaas ng tinig ang bayan at umiyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa lahat ng Israelita”; sa literal, “sa lahat ng mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “mensahero ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: At nang sabihin
  rationale: Ang וַיְהִי na sinusundan ng כְּ at infinitive construct ay nagpapakilala ng sugnay na panahunan sa daloy ng salaysay. Likas sa modernong Tagalog ang “At nang sabihin” at hindi na kailangang isalin nang literal ang “at nangyari.”
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ na “mensahero” o “anghel.” Sa kontekstong ito at sa nakaugaliang gamit ng pariralang מַלְאַךְ יְהוָה sa Kasulatan, “anghel ni Yahweh” ang natural na pangunahing salin, habang pinananatili sa talababa ang tunay na alternatibong “mensahero.”
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ang mga salitang ito
  rationale: Tumutukoy ang דְּבָרִים sa binigkas na pahayag. Pinananatili ng “mga salitang ito” ang berbal na diin ng Hebreo nang hindi ito ginagawang mas malayang “mensaheng ito.”
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: sa lahat ng mga anak ni Israel
  rationale: Tuwirang pinananatili ng salin ang idyomang בְּנֵי יִשְׂרָאֵל, “mga anak ni Israel.” Inilalagay sa talababa ang mas idyomatikong “lahat ng Israelita.”
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: nagtaas ng tinig ang bayan
  rationale: Pinananatili nito ang Hebreong idyomang “itaas ang tinig” at ang kolektibong diwa ng הָעָם at קוֹלָם. Nauunawaan sa konteksto na narinig ang sama-samang pagtangis ng bayan.
- source_word: וַיִּבְכּוּ
  choice: at umiyak
  rationale: Tuwirang kahulugan ng בכה ang “umiyak” o “tumangis.” Ang “umiyak” ay malinaw at natural, at hindi nagdaragdag ng antas gaya ng “humagulgol.”
theological_decisions:
- issue: Pagkasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Personal na banal na pangalan ang יְהוָה sa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “ang PANGINOON,” nang hindi nagpapasok ng sektaryong pagpapakahulugan.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: mensahero ni Yahweh
  rationale: Hindi nilulutas ng salin ang mas malawak na teolohikong tanong tungkol sa tiyak na pagkakakilanlan ng tauhan. Isinasalin lamang ang parirala ayon sa pinakanatural na gamit sa salaysay at itinatala ang leksikal na alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang ginamit. Pinanatili ang payak na anyo ng salaysay, ang personal na pangalang “Yahweh,” at ang Hebreong idyomang “nagtaas ng tinig,” habang ang mas idyomatikong mga alternatibo ay inilagay sa mga talababa.
