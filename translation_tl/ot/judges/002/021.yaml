  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: tl
  text: Hindi na rin ako magpapatuloy na magtaboy mula sa harapan nila kahit isa man sa mga bansang iniwan ni Josue nang mamatay siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na iniwan ni Josue, at namatay siya.” Mas literal sa Hebreo ang “at namatay siya”; ipinahahayag ng “nang mamatay siya” ang malamang na temporal na diwa sa mas natural na Filipino.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Hindi na rin ako
  rationale: Ang רִין (“rin”) ay nagpapahayag ng pagpapatuloy at diin ng גַּם kasama ng tahasang panghalip na אֲנִי; isinama ito sa natural na ayos ng negatibong pangungusap sa Filipino.
- source_word: לֹא אוֹסִיף
  choice: hindi na ... magpapatuloy
  rationale: Ang Hiphil ng יסף na sinusundan ng pawatas, sa negatibong pahayag, ay nagpapahiwatig ng hindi na pagpapatuloy sa dating ginagawa. Pinananatili ng “magpapatuloy” ang aspektong ito.
- source_word: לְהוֹרִישׁ
  choice: magtaboy
  rationale: Sa konteksto ng pagsakop sa lupain, tumutukoy ang pandiwa sa pagpapaalis sa mga dating naninirahan. Ang “magtaboy” ay malinaw at natural sa modernong Filipino.
- source_word: אִישׁ ... מִן הַגּוֹיִם
  choice: kahit isa sa mga bansa
  rationale: Gumaganap ang אִישׁ nang distributibo o idiomatiko rito, kaya ang diwa ay “kahit isa” mula sa mga bansa, hindi isang indibiduwal na lalaki.
- source_word: מִפְּנֵיהֶם
  choice: mula sa harapan nila
  rationale: Pinananatili nito ang larawang Hebreo ng pagpapaalis mula sa presensiya o harapan ng Israel, bagaman maaari ring gawing mas idyomatiko bilang “sa kanilang harapan.”
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: na iniwan ni Josue
  rationale: Ang עזב ay nangangahulugang iniwan o iniwang natira. Simple at tuwiran ang “iniwan,” at ang “Josue” ang kinagawiang anyong Filipino ng pangalan.
- source_word: וַיָּמֹת
  choice: nang siya ay mamatay
  rationale: Mas natural sa Filipino ang temporal na ugnayang “nang siya ay mamatay,” habang itinatala sa talababa ang mas literal na “at namatay siya.”
theological_decisions:
- issue: Pagkakakilanlan ng nagsasalita
  choice: Pinanatili ang unang panauhang “ako” nang hindi idinaragdag ang “PANGINOON.”
  alternative: Idagdag ang “PANGINOON” upang luminaw ang nagsasalita.
  rationale: Unang panauhan lamang ang nasa talata; malinaw na sa konteksto na Diyos ang nagsasalita. Ang pagdaragdag ng banal na pangalan ay lalampas sa mismong teksto.
- issue: Ugnayan ng pagkamatay ni Josue sa pag-iwan sa mga bansa
  choice: “nang siya ay mamatay” bilang natural na temporal na pagbasa
  alternative: “at namatay siya” bilang mas literal at maaaring mas maluwag ang sintaktikong ugnayan
  rationale: Maaaring magsilbing temporal ang waw sa konteksto, ngunit hindi dapat itago ang mas literal na koordinasyon; kaya inilalahad ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga bansa” para sa גּוֹיִם at ang pangalang “Josue” ayon sa malawak na kinagawiang anyong Filipino. Pinanatili ang bahagyang Hebraikong larawang “mula sa harapan nila” upang hindi mawala ang imahen ng pinagmulang teksto.
