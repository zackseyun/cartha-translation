  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: tl
  text: At naglingkod ang bayan kay Yahweh sa buong panahon ni Josue at sa buong panahon ng mga nakatatandang nabuhay pa pagkamatay ni Josue, na nakakita sa lahat ng dakilang gawa ni Yahweh para sa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Ang עבד na tuwirang tumutukoy kay Yahweh ay nagsasaad ng paglilingkod na may katapatan sa tipan; saklaw nito ang pagsamba ngunit hindi limitado rito.
- source_word: הָעָם
  choice: ang bayan
  rationale: Kolektibong tumutukoy sa sambayanang Israel; natural at marangal ang “bayan” sa konteksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: כֹּל יְמֵי
  choice: sa buong panahon
  rationale: Ipinahahayag ng idyoma ang kabuuang haba ng buhay o panahong tinutukoy; mas natural ito sa modernong Tagalog kaysa sa literal na “lahat ng mga araw.”
- source_word: הַזְּקֵנִים
  choice: ang matatanda
  rationale: Tumutukoy sa mga kinikilalang nakatatandang pinuno ng pamayanan habang pinananatili ang pangunahing leksikal na diwa.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: nabuhay nang mas matagal kaysa
  rationale: Ang literal na “nagpahaba ng mga araw pagkatapos” ay idyomang nangangahulugang nagpatuloy silang mabuhay lampas sa buhay ni Josue.
- source_word: רָאוּ
  choice: nakita nila
  rationale: Malinaw sa kasunod na pangungusap na naranasan at nasaksihan na ng matatanda ang mga ginawa ni Yahweh.
- source_word: מַעֲשֵׂה ... הַגָּדוֹל
  choice: dakilang ginawa
  rationale: Natural na ipinapahayag sa Tagalog ang nag-iisang kolektibong “dakilang gawa,” habang pinananatili ang lawak ng מַעֲשֵׂה.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: ginawa ... para sa Israel
  rationale: 'Ang לְ ay kapakinabangang gamit: ang ginawa ni Yahweh ay alang-alang sa Israel.'
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; ang PANGINOON
  rationale: Direktang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang pangalang pantangi sa halip na palitan ito ng titulo.
- issue: Saklaw ng paglilingkod ng bayan
  choice: naglingkod kay Yahweh
  alternative: sumamba kay Yahweh
  rationale: Mas malawak ang עבד kaysa sa gawaing pagsamba lamang at maaaring magpahiwatig ng katapatan at pagsunod sa tipan.
translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal. Ginamit ang “sa buong panahon” para sa Hebreong idyoma, at hinati sa dalawang pangungusap upang maging malinaw ang kaugnayan ng sugnay nang hindi binabago ang diwa.
