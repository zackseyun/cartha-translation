  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: tl
  text: Ginawa ng mga Israelita[a] ang masama sa paningin ni Yahweh, at naglingkod sila sa mga Baal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literal: “mga anak ni Israel,” isang katawagang tumutukoy sa mga Israelita.'
    reason: lexical_alternative
  - marker: b
    text: O “sumamba sila sa mga Baal.” Ang pandiwang Hebreo ay maaari ring tumukoy sa paglilingkod na ginagawa bilang pagsamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Ginawa
  rationale: Karaniwang pandiwa ang עשה na nangangahulugang “gumawa.” Sa pariralang ito, likas sa Tagalog ang “ginawa ... ang masama.”
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” tumutukoy ang Hebreong katawagan sa sambayanan ng Israel; ang “mga Israelita” ay natural, malinaw, at hindi nagpapahiwatig na mga lalaki lamang ang tinutukoy.
- source_word: אֶת הָרַע
  choice: ang masama
  rationale: Pinananatili nito ang moral na bigat ng Hebreong pariralang “gawin ang masama” sa natural na Tagalog.
- source_word: בְעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Natural na katumbas ito ng Hebreong idyomang “sa mga mata ni Yahweh,” na nagpapahayag ng kaniyang pagsusuri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” hindi pinapalitan ng isang titulo.
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Ang עבד ay maaaring mangahulugang maglingkod o sumamba. Pinananatili ng “naglingkod” ang lawak ng kahulugan at ang tipanang paghahambing ng paglilingkod kay Yahweh at sa ibang mga diyos.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang maramihang anyo ng Hebreo, na tumutukoy sa iba't ibang lokal na anyo o imahen ng diyos na Baal.
theological_decisions:
- issue: Pagsasalin sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kung ang עבד ay isasaling “naglingkod” o “sumamba”
  choice: naglingkod
  alternative: sumamba
  rationale: Malinaw sa konteksto na relihiyosong debosyon ang tinutukoy, ngunit mas tuwirang tumutugma ang “naglingkod” sa pandiwang Hebreo at pinananatili ang mas malawak na tipanang diwa nito.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Israelita” para sa natural at saklaw-lahat na pagtukoy sa bayan, habang inilagay sa talababa ang literal na Hebreong anyo. Pinanatili ang pangalang Yahweh at ang maramihang “mga Baal.”
