  text: וַ/יִּלְכָּד נַ֛עַר מֵ/אַנְשֵׁ֥י סֻכּ֖וֹת וַ/יִּשְׁאָלֵ֑/הוּ וַ/יִּכְתֹּ֨ב אֵלָ֜י/ו אֶת שָׂרֵ֤י סֻכּוֹת֙ וְ/אֶת זְקֵנֶ֔י/הָ שִׁבְעִ֥ים וְ/שִׁבְעָ֖ה אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: tl
  text: Nahuli niya ang isang binatang taga-Sucot at tinanong ito. Isinulat ng binata para sa kanya kung sino-sino ang mga opisyal[a] at mga nakatatanda sa Sucot—pitumpu’t pitong lalaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga pinuno”; ang salitang Hebreo ay maaaring tumukoy sa mga opisyal, pinuno, o tagapamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: Nahuli niya
  rationale: Ang לכד ay nangangahulugang hulihin o dakpin. Ang “nahuli” ay natural sa salaysay at hindi nagpapalagay kung paano siya dinakip.
- source_word: נַעַר
  choice: isang binata
  rationale: Maaaring tumukoy ang נַעַר sa batang lalaki, kabataan, binata, o lingkod. Sa konteksto, kaya niyang kilalanin ang mga namumuno sa lungsod, kaya ang “binata” ang malinaw ngunit hindi labis na tiyak na salin.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: taga-Sucot
  rationale: Ipinahihiwatig ng parirala na kabilang siya sa mga lalaki ng Sucot. Likas at maikli sa modernong Tagalog ang “taga-Sucot.”
- source_word: וַיִּשְׁאָלֵהוּ
  choice: tinanong ito
  rationale: Ang שׁאל ay magtanong o magsiyasat. Sapat ang “tinanong” upang ipakita ang layuning kumuha ng impormasyon nang hindi ipinapasok ang mas mabigat na pahiwatig ng “interogasyon.”
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: Isinulat ng binata para sa kanya kung sino-sino
  rationale: Sa daloy ng Hebreo, ang nahuling binata ang sumulat para kay Gideon. Nililinaw ng pag-uulit sa “binata” ang pagbabago ng simuno; ang “kung sino-sino” ay natural na paraan upang ipahayag na itinala niya ang pagkakakilanlan ng mga taong tinutukoy.
- source_word: שָׂרֵי סֻכּוֹת
  choice: mga opisyal ng Sucot
  rationale: Ang שׂרים ay maaaring mga opisyal, pinuno, o tagapamahala. Ang “mga opisyal” ay angkop sa pamahalaang-bayan at hindi nagmumungkahi ng maharlikang titulong tulad ng “mga prinsipe.”
- source_word: זְקֵנֶיהָ
  choice: mga nakatatanda sa Sucot
  rationale: Ang זקנים ay kinikilalang matatandang pinuno ng pamayanan, hindi lamang matatanda sa edad. Pinananatili ng “mga nakatatanda” ang tradisyonal na katawagan nang hindi inuulit nang hindi natural ang panghalip para sa lungsod.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: pitumpu’t pitong lalaki
  rationale: Tuwirang bilang ito na pitumpu’t pito; pinananatili ang “lalaki” dahil tahasang naroon ang אִישׁ at tumutukoy sa mga lalaking pinuno ng bayan.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Nilinaw ang pagbabago ng simuno mula kay Gideon tungo sa binata, ngunit hindi dinagdagan ang salaysay ng paraan ng pagkakahuli o pagtatanong. Ginamit ang “mga nakatatanda” bilang katawagang panlipunan para sa kinikilalang senior leaders ng bayan.
