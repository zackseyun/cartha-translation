  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: tl
  text: Pagkatapos, bumalik si Gideon na anak ni Joas mula sa labanan sa pamamagitan ng ahunan ng Heres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O posibleng, “sa pamamagitan ng ahunan ng araw.” Mahirap unawain ang pariralang Hebreo; ang הֶחָרֶס ay maaaring pangalan ng lugar (“Heres”) o mangahulugang “araw.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Pagkatapos, bumalik
  rationale: Ang wayyiqtol ng שוב ay nagpapatuloy sa salaysay. Likas sa modernong Tagalog ang “Pagkatapos” bilang panandang pasalaysay, at tuwirang ipinapahayag ng “bumalik” ang kilos.
- source_word: גִּדְעוֹן
  choice: Gideon
  rationale: Isinalin sa karaniwang anyo ng pangalang ginagamit sa Tagalog.
- source_word: בֶּן יוֹאָשׁ
  choice: na anak ni Joas
  rationale: Natural na Tagalog na pagpapahayag ng patronimiko habang pinananatili ang tuwirang kaugnayan kay Joas.
- source_word: מִן הַמִּלְחָמָה
  choice: mula sa labanan
  rationale: Maaaring mangahulugan ang מִלְחָמָה ng labanan o digmaan; sa konteksto ng tiyak na sagupaan, mas angkop ang “labanan.”
- source_word: מִלְמַעֲלֵה
  choice: na dumaan sa paahon ng
  rationale: Pinananatili ng “paahon” ang topograpikong diwa ng מַעֲלֶה, samantalang ipinahihiwatig ng “dumaan sa” ang ruta nang hindi labis na nagpapasya sa mahirap na gamit ng mga pang-ukol.
- source_word: הֶחָרֶס
  choice: Heres
  rationale: Itinuring sa pangunahing teksto bilang maaaring pangalan ng lugar upang mapanatili ang topograpikong pagbasa; inilagay sa talababa ang tunay na posibilidad na nangangahulugan itong “araw.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “paahon” para sa rutang pataas at pinanatili ang Heres bilang pangalan sa pangunahing teksto, kalakip ang alternatibong pagbasa sa talababa.
