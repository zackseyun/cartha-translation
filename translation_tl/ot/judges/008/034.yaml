  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: tl
  text: At hindi inalala ng mga anak ni Israel[a] si Yahweh na kanilang Diyos, ang nagligtas sa kanila mula sa kamay ng lahat ng kaaway nilang nakapaligid sa kanila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: At hindi
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, at tuwirang ipinahahayag ng “hindi” ang pagtanggi.
- source_word: זָכְרוּ
  choice: inalala
  rationale: 'Saklaw ng “inalala” ang higit sa simpleng paggunita: sa kontekstong ito, ipinahihiwatig din nito ang pagkilalang dapat makita sa katapatan kay Yahweh.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang kongkretong anyo ng Hebreong “mga anak ni Israel,” habang inilalagay sa talababa ang mas karaniwang kolektibong katawagang “mga Israelita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa baybay ang personal na pangalang יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: Bagaman maramihan ang anyo ng אֱלֹהִים, tumutukoy ito rito sa iisang Diyos, si Yahweh, at ipinahahayag ng “kanilang” ang kaugnayan niya sa Israel.
- source_word: הַמַּצִּיל
  choice: ang nagligtas
  rationale: Ang may-artikulong participle ay naglalarawan kay Yahweh ayon sa kanyang pagliligtas. Natural sa Filipino ang pariralang “ang nagligtas,” at malinaw na nauna ang ginawang pagliligtas sa hindi nila pag-alaala.
- source_word: מִיַּד
  choice: mula sa kamay ng
  rationale: Pinananatili nito ang Hebreong larawan ng “kamay” bilang kapangyarihan o pagkontrol, na nauunawaan din sa Filipino.
- source_word: כָּל אֹיְבֵיהֶם
  choice: lahat ng kaaway nila
  rationale: Tuwirang pinananatili ang kabuuang saklaw ng parirala sa natural na modernong Filipino.
- source_word: מִסָּבִיב
  choice: sa palibot
  rationale: Ipinahahayag nito na ang mga kaaway ay nasa lahat ng panig nang hindi gumagamit ng makalumang pananalita.
theological_decisions:
- issue: Pagsasalin ng banal na pangalang יהוה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili itong “Yahweh” sa halip na palitan ng titulong “PANGINOON.”
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal at may-kasariang anyo ng Hebreo, samantalang ibinibigay sa talababa ang mas idyomatikong kolektibong katawagan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang gitling-pahaba upang malinaw na iugnay ang “ang nagligtas” kay Yahweh na kanilang Diyos at maiwasan ang sunod-sunod na sugnay na may “na.”
