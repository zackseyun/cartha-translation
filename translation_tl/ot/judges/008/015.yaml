base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: tl
  text: Pagkatapos, pumunta siya sa mga lalaki ng Sucot at sinabi, “Narito sina Zeba at Zalmuna. Dahil sa kanila ay inalipusta ninyo ako[a] nang sabihin ninyo, ‘Nasa kamay mo na ba sina Zeba at Zalmuna[b], para bigyan namin ng tinapay ang mga pagod mong tauhan?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dahil sa kanila ay tinuya ninyo ako.” Ang pandiwang Hebreo ay tumutukoy sa mapanlait na paghamak o panunuya.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “Nasa kamay mo na ba ang palad/kamay nina Zeba at Zalmuna?” Isa itong idyoma na ang ibig sabihin ay, “Nabihag mo na ba sila?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: mga lalaki ng Sucot
  rationale: Pinananatili nito ang tahasang panlalaking anyo ng Hebreo at ang pagtukoy sa mga lalaking naninirahan o namumuno sa lungsod.
- source_word: הִנֵּה
  choice: Narito
  rationale: Likas at marangal na panawag-pansin ito sa mga bihag na naroon sa harap nila.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba at Zalmuna
  rationale: Isinalin sa baybay na angkop sa modernong Tagalog ang mga pangalang Hebreo.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: Dahil sa kanila ay inalipusta ninyo ako
  rationale: Ang חרף ay nagpapahiwatig ng mapanlait na paghamak. Nililinaw ng parirala na ang pag-alipusta kay Gideon ay may kaugnayan sa dalawang hari nang hindi binabago ang diwa.
- source_word: לֵאמֹר
  choice: nang sabihin ninyo
  rationale: Natural na introduksiyon sa pagsipi ng dati nilang sinabi.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: Nasa kamay mo na ba sina Zeba at Zalmuna
  rationale: Pinananatili ang larawan ng Hebreong idyoma habang malinaw sa Tagalog na tumutukoy ito sa pagkabihag o pagkontrol sa kanila.
- source_word: כִּי נִתֵּן
  choice: kaya bibigyan namin
  rationale: 'Ipinahahayag nito ang mapanuyang lohika ng tanong: saka lamang sila magbibigay kung bihag na ang mga hari.'
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: ang mga pagod mong tauhan
  rationale: Ang 'tauhan' ay natural sa kontekstong militar, at ang 'pagod' ay malinaw na katumbas ng kalagayang inilalarawan ng יְעֵפִים.
- source_word: לָחֶם
  choice: tinapay
  rationale: Direktang katumbas ito ng salitang Hebreo at maaari ring kumatawan sa pangunahing pagkain sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga lalaki” upang mapanatili ang kasarian at panlipunang diin ng Hebreo; “mga tauhan” naman ang natural na tawag sa mga lalaking kasama ni Gideon sa kontekstong militar. Parehong nakalagay sa pangunahing teksto ang mga marker na [a] at [b].
