  text: וּ/פִֽילַגְשׁ/וֹ֙ אֲשֶׁ֣ר בִּ/שְׁכֶ֔ם יָֽלְדָה לּ֥/וֹ גַם הִ֖יא בֵּ֑ן וַ/יָּ֥שֶׂם אֶת שְׁמ֖/וֹ אֲבִימֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: tl
  text: At ang kanyang kinakasamang babae na nasa Shekem ay nagsilang din sa kanya ng isang anak na lalaki, at pinangalanan niya itong Abimelek.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang “Abimelek” ay tradisyonal ding isinusulat na “Abimelech” sa maraming saling Ingles.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: At ang kanyang kinakasamang babae
  rationale: Ang פִּילֶגֶשׁ ay babaeng kinakasama na may katayuang mas mababa kaysa pangunahing asawa. Ang “kinakasamang babae” ay likas at nauunawaan sa modernong Filipino, at hindi nagdaragdag ng pahiwatig ng pangangalunya na maaaring taglayin ng “kalaguyo.” Isinalin ang וּ bilang “At.”
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: na nasa Shekem
  rationale: Tinutukoy ng pariralang kaugnay ang babae ayon sa kanyang kinaroroonan. Pinananatili ng “nasa” ang lawak ng בִּ nang hindi ipinapalagay na permanenteng naninirahan siya roon.
- source_word: יָלְדָה לּוֹ
  choice: nagsilang din sa kanya
  rationale: Ang יָלְדָה ay “nagsilang,” at ipinahahayag ng לּוֹ ang kaugnayan ng anak sa lalaki. Natural sa Filipino ang “nagsilang sa kanya ng isang anak.”
- source_word: גַם הִיא
  choice: din
  rationale: Ipinakikita ng גַם הִיא na ang babaeng ito ay nagsilang din, gaya ng ibang mga babaeng binanggit sa konteksto. Sapat at natural ang “din” sa Filipino.
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Tuwirang katumbas ito ng בֵּן at malinaw na hindi lamang pangkalahatang “anak” ang tinutukoy.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: at pinangalanan niya itong
  rationale: Ang literal na idyomang Hebreo na “inilagay ang kanyang pangalan” ay nangangahulugang pinangalanan siya. Inihahatid ng salin ang kahulugan sa natural na Filipino.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelek
  rationale: Malapit na inililipat ng “Abimelek” ang tunog ng pangalang Hebreo, lalo na ang panghuling כ na binibigkas na /k/ sa anyong ito.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na payak ngunit marangal. Ginamit ang “kinakasamang babae” sa halip na “kalaguyo,” na maaaring magpahiwatig ng bawal na relasyon, o “pangalawahing asawa,” na mas tiyak kaysa sa tahasang sinasabi ng terminong Hebreo.
