translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “Ngunit” upang ihayag ang pagtutol ng mga pinuno ng Sucot sa naunang kahilingan. Pinanatili ang retorikal at mapanuyang tanong, pati ang literal na larawang “mga kamay ... nasa kamay mo,” dahil may tunay na interpretatibong tensiyon ang Hebreo.
