  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: tl
  text: Sinabi ng mga pinuno ng Sucot, “Hawak mo na ba sina Zeba at Zalmuna, para bigyan namin ng tinapay ang hukbo mo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: mga pinuno ng Sucot
  rationale: Ang שָׂרִים ay tumutukoy sa mga namumuno o pangunahing opisyal ng lungsod; natural at malawak ang “mga pinuno” sa modernong Tagalog.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: Nasa kamay mo na ba ang mga kamay nina Zeba at Zalmuna
  rationale: Pinananatili ang sadyang matalim at posibleng metonimikong larawan ng Hebreo, sa halip na ipakahulugang nahuli o napatay na sila.
- source_word: עַתָּה
  choice: na
  rationale: Sa tanong na ito, ipinahihiwatig ng Tagalog na “na ba” ang temporal na diwa ng ‘ngayon/sa puntong ito’ at ang mapanuyang ‘nasa iyo na ba.’
- source_word: בְיָדֶךָ
  choice: nasa kamay mo
  rationale: Pinananatili ang idyomang Hebreo para sa pagkakahawak o kapangyarihan, na nauunawaan din sa Tagalog at inuugnay sa “mga kamay” sa unang bahagi.
- source_word: לִצְבָאֲךָ
  choice: ang hukbo mo
  rationale: Ang צָבָא rito ay ang pangkat ng mga mandirigma ni Gideon; “hukbo” ang dignified at tuwirang katumbas.
