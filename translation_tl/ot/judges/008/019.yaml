base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: tl
  text: At sinabi niya, “Mga kapatid ko sila—mga anak ng aking ina.[a] Kung paanong buhay si Yahweh, kung hinayaan ninyo silang mabuhay, hindi ko sana kayo papatayin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak ng aking ina” ay tumutukoy sa mga kapatid na iisa ang ina, hindi lamang sa mga kamag-anak.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: At sinabi niya
  rationale: Karaniwang salaysay na wayyiqtol; pinananatili ng “At sinabi niya” ang daloy ng Hebreong naratibo.
- source_word: אַחַי
  choice: mga kapatid ko
  rationale: Tumutukoy dito sa literal na mga kapatid, gaya ng nililinaw ng kasunod na pariralang “mga anak ng aking ina.”
- source_word: בְּנֵי אִמִּי
  choice: mga anak ng aking ina
  rationale: Malapit sa anyo ng Hebreo at ipinahihiwatig na iisa ang kanilang ina; ang tahasang “mga kapatid na buo” ay mas interpretatibo.
- source_word: חַי יְהוָה
  choice: Saksi ang buhay ni Yahweh
  rationale: Likas at marangal na pormula ng panunumpa sa Tagalog na nagpapanatili sa diwa ng literal na “buhay si Yahweh.”
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: kung hinayaan ninyo silang mabuhay
  rationale: Ipinahahayag ang salungat-sa-katotohanang kondisyon at ang causative na diwa ng Hiphil ng חיה nang hindi ito ginagawang simpleng “pinatawad.”
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: hindi ko sana kayo papatayin
  rationale: Sa natural na Tagalog, ang “sana” sa hulihan ng kondisyong hindi natupad ay naghahatid ng counterfactual na diwa; pinananatili rin nito ang pananaw ng nalalapit na pagpatay sa mga kausap.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה sa pormula ng panunumpa
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na banal na pangalan ang nasa tekstong Hebreo, kaya pinananatili itong “Yahweh” sa halip na palitan ng isang titulo.
- issue: Panahunan at aspekto ng apodosis sa counterfactual na pahayag
  choice: hindi ko sana kayo papatayin
  alternative: hindi ko sana kayo pinatay
  rationale: Maaaring katawanin ng Hebreong perfect ang di-natupad na bunga, ngunit sa konteksto ay buhay pa ang mga kausap at nalalapit pa lamang ang pagpatay sa kanila. Ang napiling Tagalog ay nagpapanatili sa tensiyong ito habang malinaw na counterfactual dahil sa “sana.”
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “kapatid” nang walang pagtatakda ng kasarian sa mismong salita, gaya ng natural sa Tagalog, habang malinaw sa konteksto na mga lalaki ang tinutukoy. Inilagay nang eksakto ang marker na [a] sa pangunahing teksto.
