  to: Sina Zeba at Zalmuna ay nasa Karkor, at kasama nila ang kanilang mga kampo, na may mga labinlimang libong lalaki—ang lahat ng natira mula sa buong hukbo ng mga anak ng Silangan[a]. Ang mga napatay ay isang daan at dalawampung libong lalaking bumubunot ng tabak.
