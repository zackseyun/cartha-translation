  terminology: Ang “mga anak ng Silangan” ay wastong pinananatili at ang talababa ay kapaki-pakinabang. Ang “hukbo” ay angkop na kolektibong salin ng מַחֲנֶה sa kontekstong militar, samantalang pinananatili ng “mga kampo” ang maramihang anyo ng מַחֲנֵיהֶם.
