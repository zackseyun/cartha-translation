base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: tl
  text: Sina Zeba at Zalmuna ay nasa Karkor, at kasama nila ang kanilang mga kampo, na may mga labinlimang libong lalaki—ang lahat ng natira mula sa buong hukbo ng mga anak ng Silangan[a]. Ang mga napatay ay isang daan at dalawampung libong lalaking bumubunot ng tabak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga taga-Silangan.” Sa Hebreo: “mga anak ng Silangan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: nasa Karkor
  rationale: Ang בְּ ay panandang lokatibo; natural sa Tagalog ang “nasa” bago ang pangalan ng lugar.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: kasama nila ang kanilang mga kampo
  rationale: Pinananatili ang anyong maramihan ng מַחֲנֵיהֶם at ang tahasang diwa ng עִמָּם. Maaaring tumukoy ang “mga kampo” sa mga puwersang nagkakampo.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: mga labinlimang libong lalaki
  rationale: Ipinahahayag ng prefixed כְּ ang pagtatantiya; “mga” ang likas na pananda ng humigit-kumulang na bilang sa Tagalog.
- source_word: כֹּל הַנּוֹתָרִים
  choice: ang lahat ng natira
  rationale: Ang Niphal participle ay tumutukoy sa mga nanatili o nakaligtas; pinananatili ng “natira” ang resultang kalagayan nang hindi labis na nagpapakahulugan.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: mula sa buong hukbo ng mga anak ng Silangan
  rationale: Ang מִן ay isinaling “mula sa”; ang kolektibong מַחֲנֶה sa kontekstong militar ay natural na “hukbo.” Pinananatili ang Hebreong etnoheograpikong katawagang “mga anak ng Silangan.”
- source_word: וְהַנֹּפְלִים
  choice: Ang mga napatay
  rationale: Sa buod ng labanan, ang participle ng נפל ay tumutukoy sa mga bumagsak at namatay; mas malinaw sa modernong Tagalog ang “mga napatay” kaysa literal na “mga bumagsak.”
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: isang daan at dalawampung libo
  rationale: Karaniwang malinaw na anyo ng bilang sa modernong Tagalog.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: lalaking humahawak ng tabak
  rationale: Idyomang militar ito para sa mga lalaking mandirigma. Pinananatili ang larawan ng tabak, ngunit iniiwasan ang “bumubunot” sapagkat maaaring magmukhang kasalukuyang kilos sa halip na katawagan sa mga armadong mandirigma.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “Sina” para sa dalawang pangalang pantangi, “hukbo” para sa kolektibong kampong militar, at pinanatili sa talababa ang literal na Hebreong katawagang “mga anak ng Silangan.”
