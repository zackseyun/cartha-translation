  text: וַ/יֹּ֨אמֶר֙ לְ/אַנְשֵׁ֣י סֻכּ֔וֹת תְּנוּ נָא֙ כִּכְּר֣וֹת לֶ֔חֶם לָ/עָ֖ם אֲשֶׁ֣ר בְּ/רַגְלָ֑/י כִּי עֲיֵפִ֣ים הֵ֔ם וְ/אָנֹכִ֗י רֹדֵ֛ף אַחֲרֵ֛י זֶ֥בַח וְ/צַלְמֻנָּ֖ע מַלְכֵ֥י מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: tl
  text: Sinabi niya sa mga lalaki ng Sucot, “Pakibigyan ninyo ng mga tinapay ang mga taong kasama ko[a], sapagkat pagod na sila. Hinahabol ko sina Zeba at Zalmunna, ang mga hari ng Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga taong nasa aking mga paa,” isang idyoma para sa mga kasama o sumusunod sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: sa mga lalaki ng Sucot
  rationale: Tiyak na panlalaking maramihan ang אַנְשֵׁי at malamang na tumutukoy sa mga lalaking kinatawan ng bayan; pinananatili ito sa halip na gawing pangkalahatang “mga taga-Sucot.”
- source_word: תְּנוּ נָא
  choice: Pakibigyan ninyo
  rationale: Ipinahahayag ng pautos na may נָא ang magalang o apurahang pakiusap; natural ito sa makabagong Tagalog.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: mga tinapay
  rationale: Tumutukoy ang כִּכָּר dito sa isang bilog na tinapay o loaf. Sapat at natural sa Tagalog ang “mga tinapay”; hindi kailangang idagdag ang hugis na hindi mahalaga sa konteksto.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: sa mga taong kasama ko
  rationale: Literal na “mga taong nasa aking mga paa,” isang idyoma para sa mga kasama o sumusunod kay Gideon. Isinalin ang kahulugan sa pangunahing teksto at iniingatan sa talababa ang konkretong anyo ng Hebreo.
- source_word: עֲיֵפִים
  choice: pagod na
  rationale: Ipinahahayag nito ang matinding pagod bunga ng pagpupunyagi nang hindi kinakailangang sabihing halos himatayin na sila.
- source_word: רֹדֵף אַחֲרֵי
  choice: Hinahabol ko
  rationale: Ang participle ay nagsasaad ng nagpapatuloy na pagtugis; likas at malinaw sa Tagalog ang “Hinahabol ko.”
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zeba at Zalmunna
  rationale: Mga pangalang pantangi ang mga ito at tinumbasan sa karaniwang anyong transliterado sa Filipino.
- source_word: מַלְכֵי מִדְיָן
  choice: ang mga hari ng Midian
  rationale: Tuwirang pinananatili ang ugnayang construct na “mga hari ng Midian.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Pakibigyan ninyo” para sa magalang ngunit apurahang pakiusap, at “kasama ko” upang natural na maipahayag ang Hebreong idyoma. Ang lahat ng pangalan ay nasa payak na anyong Filipino.
