revisions:
- from: Ang bigat ng mga gintong singsing[a] na hiningi niya ay 1,700 siklo ng ginto[b]. Hindi pa kabilang dito ang mga palamuting hugis-buwang gasuklay, mga palawit, at mga kasuotang kulay-ube na suot ng mga hari ng Midian, gayundin ang mga kuwintas na nasa leeg ng kanilang mga kamelyo.
  to: Ang bigat ng mga gintong singsing[a] na hiningi niya ay 1,700 siklo ng ginto[b]. Hindi pa kabilang dito ang mga palamuting hugis-gasuklay, mga palawit, at mga kasuotang kulay-ube na suot ng mga hari ng Midian. Bukod pa rito ang mga kuwintas na nasa leeg ng kanilang mga kamelyo.
