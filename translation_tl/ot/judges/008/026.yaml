  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: tl
  text: Ang bigat ng mga gintong singsing[a] na hiningi niya ay 1,700 siklo ng ginto[b]. Hindi pa kabilang dito ang mga palamuting hugis-gasuklay, mga palawit, at mga kasuotang kulay-ube na suot ng mga hari ng Midian. Bukod pa rito ang mga kuwintas na nasa leeg ng kanilang mga kamelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga hikaw” o “mga singsing sa ilong”; maaaring tumukoy ang salitang Hebreo sa singsing na isinusuot sa tainga o ilong.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “1,700 na ginto.” Idinagdag ang “siklo” bilang yunit ng timbang na nauunawaan sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: bigat
  rationale: Tumutukoy ito sa timbang na sinukat, hindi lamang sa dami.
- source_word: נִזְמֵי הַזָּהָב
  choice: mga gintong singsing
  rationale: Maaaring tumukoy ang נזם sa singsing na isinusuot sa tainga o ilong. Pinananatili ng “singsing” ang pagiging pangkalahatan ng terminong Hebreo; ipinaliliwanag sa talababa ang posibleng gamit nito.
- source_word: אֲשֶׁר שָׁאָל
  choice: na hiningi niya
  rationale: Sa konteksto, hiningi ni Gideon ang mga alahas mula sa nasamsam. Likas at malinaw sa modernong Tagalog ang “hiningi.”
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1,700 siklo ng ginto
  rationale: Walang tahasang yunit sa Hebreo, ngunit sa pahayag tungkol sa timbang ng mahalagang metal, nauunawaan sa konteksto ang siklo bilang yunit. Nililinaw ito sa talababa.
- source_word: לְבַד מִן
  choice: Hindi pa kabilang dito ... gayundin
  rationale: Ipinahihiwatig ng parirala na hindi kasama sa naunang kabuuang timbang ang mga kasunod na bagay. Mas natural sa Tagalog ang paghahati nito sa bagong pangungusap.
- source_word: הַשַּׂהֲרֹנִים
  choice: mga palamuting hugis-buwang gasuklay
  rationale: Tumutukoy ang salita sa mga palamuting hugis gasuklay. Iniiwasan ng saling ito ang pag-aakalang buwan mismo ang inilalarawan habang malinaw ang hugis.
- source_word: הַנְּטִפוֹת
  choice: mga palawit
  rationale: Malamang na tumutukoy ito sa nakabiting mga palamuti; ang “palawit” ay malinaw ngunit hindi labis na tiyak.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: mga kasuotang kulay-ube
  rationale: Tumutukoy ito sa mga kasuotang yari o tinina sa mamahaling kulay na purple, na malinaw na maipapahayag sa kasalukuyang Tagalog bilang “kulay-ube.”
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: na suot ng mga hari ng Midian
  rationale: Sa kaugnayan sa kasuotan, ipinahihiwatig ng עַל na nakasuot ang mga ito sa mga hari; natural at kongkreto ang “suot.”
- source_word: הָעֲנָקוֹת
  choice: mga kuwintas
  rationale: Tumutukoy ito sa mga palamuti sa leeg. Ang “kuwintas” ang pinakakaraniwang modernong katumbas, pati para sa palamuti sa leeg ng hayop.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: na nasa leeg ng kanilang mga kamelyo
  rationale: Tapat nitong ipinapahayag ang kinalalagyan ng mga palamuti sa natural na Tagalog.
