translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “hiningi” sa halip na mas pormal na “hiniling,” at hinati sa dalawang pangungusap ang mahabang estrukturang Hebreo upang maging madaling basahin nang hindi binabago ang ugnayan ng mga bagay na hindi kabilang sa kabuuang timbang.
