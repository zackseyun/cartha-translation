revisions:
- from: Sinabi ni Gideon, “Kung gayon, kapag ibinigay ni Yahweh sa kamay ko sina Zeba at Zalmuna, gigiikin ko ang inyong laman sa pamamagitan ng mga tinik sa ilang at ng mga halamang matinik.[a]”
  to: Sinabi ni Gideon, “Kung gayon, kapag ibinigay ni Yahweh sa kamay ko sina Zeba at Zalmuna, gigiikin ko ang inyong laman sa pamamagitan ng mga tinik sa ilang at mga dawag.[a]”
  rationale: Pinalitan ang malawak na “mga halamang matinik” ng “mga dawag” upang mas maipakita ang ikalawang, natatanging katawagan para sa matinik na halaman sa Hebreo. Hindi tinutukoy nang lampas sa ebidensiya ang species, sapagkat nakasaad ang alternatibo at kawalang-katiyakan sa talababa. Lahat ng iba pang mahahalagang elemento ng draft ay pinanatili.
