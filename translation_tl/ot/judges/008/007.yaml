base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: tl
  text: Sinabi ni Gideon, “Kung gayon, kapag ibinigay ni Yahweh sa kamay ko sina Zeba at Zalmuna, gigiikin ko ang inyong laman sa pamamagitan ng mga tinik sa ilang at mga dawag.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga halamang matinik”; hindi tiyak ang eksaktong halamang tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kung gayon
  rationale: Ipinahihiwatig nito na ang banta ni Gideon ay bunga ng pagtanggi ng mga taga-Sucot sa naunang talata.
- source_word: בְּתֵת
  choice: kapag ibinigay
  rationale: Ang ב na may infinitive construct ay temporal dito at tumutukoy sa inaasahang pagkilos ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin ang banal na pangalang YHWH ayon sa patakaran ng proyekto.
- source_word: בְּיָדִי
  choice: sa kamay ko
  rationale: Pinananatili ang konkretong idyomang Hebreo para sa pagkakaloob ng mga kaaway sa kapangyarihan ni Gideon.
- source_word: וְדַשְׁתִּי
  choice: gigiikin ko
  rationale: Pinananatili ang marahas na metaporang pang-agrikultura ng pandiwang דושׁ, sa halip na gawing pangkalahatang pagpaparusa lamang.
- source_word: בְּשַׂרְכֶם
  choice: ang inyong laman
  rationale: Tuwirang katumbas ito ng בָּשָׂר at pinananatili ang bagsik at pisikal na katangian ng banta.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: mga tinik sa ilang
  rationale: Natural na Tagalog na nagpapanatili sa matinik na halaman at sa kapaligiran ng ilang.
- source_word: הַבַּרְקֳנִים
  choice: mga halamang matinik
  rationale: Hindi tiyak ang eksaktong halamang tinutukoy; ang pangkalahatang salin ay nagpapanatili sa diwa nang hindi labis na tinutukoy ang uri.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton; pinananatili ang personal na pangalang Yahweh sa halip na palitan ng titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabagsik na larawang “gigiikin” at “inyong laman,” habang ang di-tiyak na katawagan sa halaman ay isinalin nang pangkalahatan at ipinaliwanag sa talababa.
