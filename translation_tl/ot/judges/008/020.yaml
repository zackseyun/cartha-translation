base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: tl
  text: Pagkatapos, sinabi niya kay Jeter, ang panganay niyang anak, “Tumayo ka at patayin mo sila.” Ngunit hindi binunot ng kabataang lalaki[a] ang kanyang espada, sapagkat natatakot siya; dahil kabataang lalaki pa siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang Hebreo na na‘ar ay maaaring mangahulugang “bata,” “kabataan,” o “kabataang lalaki.” “Kabataang lalaki” ang ginamit dito dahil may dala siyang espada at inutusang pumatay, ngunit maaaring tumukoy ang salita sa mas malawak na saklaw ng edad mula pagkabata hanggang sa pagiging batang adulto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos, sinabi niya
  rationale: Isinusulong ng waw-consecutive ang pagkakasunod-sunod ng salaysay; natural sa makabagong Filipino ang “Pagkatapos” bilang panandang pasalaysay.
- source_word: לְיֶתֶר
  choice: sa ... si Jeter
  rationale: Isinatinig ang pangalang Hebreo na יֶתֶר bilang “Jeter,” alinsunod sa karaniwang anyong Filipino ng letrang yod sa mga pangalang biblikal.
- source_word: בְּכוֹרוֹ
  choice: panganay niyang
  rationale: Tuwirang ipinahahayag ng “panganay” ang katayuan ayon sa pagkakasunod ng kapanganakan nang hindi na idinaragdag ang salitang “anak,” na nauunawaan na sa konteksto.
- source_word: קוּם
  choice: Tumayo ka
  rationale: Likas at tuwirang utos sa Filipino para sa imperatibo ng קום.
- source_word: הֲרֹג אוֹתָם
  choice: patayin mo sila
  rationale: Tuwirang katumbas ng karaniwang pandiwang הרג at malinaw na pinananatili ang maramihang layon.
- source_word: וְלֹא שָׁלַף
  choice: Ngunit hindi binunot
  rationale: Ipinakikita ng “Ngunit” ang kaibhan sa pagitan ng utos at ng hindi pagkilos ni Jeter; ang “binunot” ang likas na pandiwa para sa pagkuha ng espada mula sa kaluban.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Malawak ang saklaw ng נַעַר mula batang lalaki hanggang kabataang lalaki. Ang “binata” ay angkop dito sapagkat may espada siya at inutusang pumatay, ngunit pinananatili ng talababa ang tunay na lawak ng salita.
- source_word: חַרְבּוֹ
  choice: ang kanyang espada
  rationale: Tuwirang salin ng pangngalang may panghalip na paari.
- source_word: כִּי יָרֵא
  choice: sapagkat natakot siya
  rationale: Ginagawang malinaw ang sanhi ng hindi niya pagbunot ng espada.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: dahil binata pa lamang siya
  rationale: Pinananatili ng “pa lamang” ang diwa ng pagpapatuloy o pagiging nasa gayong kalagayan pa, at inuulit ang “binata” gaya ng pag-uulit ng נַעַר sa Hebreo.
