revisions:
- from: Pagkatapos, sinabi niya sa panganay niyang si Jeter, “Tumayo ka at patayin mo sila.” Ngunit hindi binunot ng binata[a] ang kanyang espada, sapagkat natakot siya, dahil binata pa lamang siya.
  to: Pagkatapos, sinabi niya kay Jeter, ang panganay niyang anak, “Tumayo ka at patayin mo sila.” Ngunit hindi binunot ng kabataang lalaki[a] ang kanyang espada, sapagkat natatakot siya; dahil kabataang lalaki pa siya.
  rationale: Inayos ang katawagan para sa naʿar upang iwasan ang modernong implikasyon ng “binata” na walang asawa, habang pinananatili ang kontekstuwal na pagtingin kay Jeter bilang isang kabataang lalaking may espada. Inayos din ang pagpapakilala kay Jeter, ang daloy ng mga sanhi, at ang talababa upang manatili ito sa saklaw ng salita at ng mismong talata.
