translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “iniladlad” at “nasamsam” bilang karaniwang salitang angkop sa salaysay. Pinanatili ang diin ng Hebreo sa “tiyak na,” at inilagay sa talababa ang kalabuan kung hikaw o mas pangkalahatang singsing ang tinutukoy.
