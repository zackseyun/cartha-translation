base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: tl
  text: At sinabi nila[a], “Tiyak na ibibigay namin ang mga iyon.” Pagkatapos, iniladlad nila ang balabal[b], at inihagis doon ng bawat lalaki ang isang hikaw[c] mula sa kanyang nasamsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, inuulit sa magkaugnay na anyo ang pandiwang “magbigay” upang idiin ang katiyakan: “Tiyak na ibibigay namin.”'
    reason: source_language_note
  - marker: b
    text: O “kasuotan”; isang panlabas na kasuotang iniladlad upang saluhin ang mga singsing.
    reason: cultural_note
  - marker: c
    text: Maaari ring isaling “singsing.” Sa ibang konteksto, ang salitang Hebreo ay maaaring tumukoy sa singsing sa ilong.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: Tiyak na ibibigay namin ang mga iyon
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin sa katiyakan ng pagbibigay. Ang “tiyak na” ay likas sa makabagong Tagalog at hindi nagdaragdag ng tahasang diwa ng kasiyahan o pagkukusa na wala mismo sa anyong Hebreo. Ang “mga iyon” ay hango sa mga singsing na hiniling sa naunang talata.
- source_word: וַיִּפְרְשׂוּ
  choice: iniladlad nila
  rationale: Ipinahihiwatig ng פרשׂ ang pagbubuka o paglalatag nang nakabuka. Ang “iniladlad” ay malinaw at natural para sa isang kasuotang ginawang sapin na tatanggap ng mga bagay.
- source_word: הַשִּׂמְלָה
  choice: ang balabal
  rationale: Ang שִׂמְלָה ay kasuotan, lalo na ang panlabas na kasuotang maaaring iladlad. Nagbibigay ang “balabal” ng kongkretong larawan nang hindi labis na tinutukoy ang eksaktong estilo nito.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: inihagis doon
  rationale: Pinananatili ng “inihagis” ang lakas ng שלך, sa halip na pahinain ito bilang simpleng paglalagay. Isinasalin nang tuwiran ang שָׁמָּה bilang “doon,” habang ipinauunawa ng konteksto na sa nakalatag na balabal nila ito inihagis.
- source_word: אִישׁ
  choice: bawat lalaki
  rationale: Ginagamit dito ang אִישׁ nang distributibo, kaya ang “bawat lalaki” ay tumpak na nagpapakita na isa-isa silang naghulog mula sa kani-kanilang samsam.
- source_word: נֶזֶם
  choice: isang hikaw
  rationale: Maaaring tumukoy ang נֶזֶם sa singsing sa tainga o ilong. Sa kontekstong ito, ang “hikaw” ang malamang at karaniwang pagkaunawa, ngunit pinananatili sa talababa ang tunay na leksikal na kalabuan.
- source_word: שְׁלָלוֹ
  choice: mula sa kanyang nasamsam
  rationale: Ang שָׁלָל ay samsam sa digmaan. Ang anyong “kanyang nasamsam” ay natural sa Tagalog at pinananatili ang pang-isahang hulaping tumutugma sa distributibong “bawat lalaki.”
