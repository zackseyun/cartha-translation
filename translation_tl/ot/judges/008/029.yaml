translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Pinanatili ang pangalang Jerubaal at ang tahasang pagtukoy sa kaniyang bahay, habang iniwasang idagdag ang ideyang “bumalik,” na hindi lantad sa Hebreo.
