  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: tl
  text: Pagkatapos, nagpunta si Jerubaal na anak ni Joas at nanirahan sa kanyang bahay.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “at tumahan sa kanyang bahay” o “at nanatili sa kanyang bahay.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtira, pananatili, o paninirahan, hindi lamang sa literal na pag-upo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: umalis
  rationale: Ang הלך sa pasalaysay na pagkakasunod ay nagpapahayag na umalis o pumaroon siya. Pinili ang “umalis” dahil natural ito sa Filipino at hindi nito ipinapalagay ang direksiyong “bumalik,” na hindi tahasang nasa pandiwa.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Isinalin sa baybay-Filipino ang mismong pangalang ginamit sa Hebreo sa talatang ito, sa halip na ipalit ang mas kilalang pangalang Gideon.
- source_word: בֶּן יוֹאָשׁ
  choice: anak ni Joas
  rationale: Ito ang natural at tuwirang salin sa Filipino ng karaniwang konstruksiyong nagpapahayag ng kaugnayang ama-anak.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Bagaman maaaring mangahulugan ang ישב na “umupo,” “manatili,” o “tumahan,” ang pagkakagamit nito kasama ng בְּבֵיתוֹ ay tumutukoy sa paninirahan.
- source_word: בְּבֵיתוֹ
  choice: sa sarili niyang bahay
  rationale: Ipinahahayag nito ang “sa kaniyang bahay.” Ang “sarili niyang” ay natural sa Filipino at malinaw na pinananatili ang panghalip na panlalaking ikatlong panauhan.
- source_word: וַ...וַ
  choice: Pagkatapos, umalis ... at nanirahan
  rationale: Ipinakikita ng magkasunod na waw-consecutive ang pag-usad ng salaysay; ang “Pagkatapos” at “at” ay likas na katumbas nito sa modernong Filipino.
