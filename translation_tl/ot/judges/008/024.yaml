    issue: Hindi gaanong likas ang “May isang kahilingan ako sa inyo.”
    rationale: Ang Hebreong אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה ay isang pormulang paghingi; ang “May hihilingin ako sa inyo” ay mas likas sa modernong Filipino habang nananatiling tapat sa diwa.
  - severity: low
    issue: Malabo ang “ang mga iyon” sa huling pangungusap.
    rationale: Ang pinakamalapit na tinutukoy ng Hebreo ay ang mga taong may gintong hikaw; ang panghalip na “sila” ay mas malinaw at natural.
  revised_text: 'Pagkatapos, sinabi ni Gideon sa kanila, “May hihilingin ako sa inyo: ibigay ng bawat isa sa akin ang isang hikaw mula sa kanyang nasamsam.” Sapagkat may mga gintong hikaw sila, dahil mga Ismaelita sila.'
