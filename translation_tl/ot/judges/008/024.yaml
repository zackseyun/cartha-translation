  to: 'Pagkatapos, sinabi ni Gideon sa kanila, “May hihilingin ako sa inyo: ibigay ng bawat isa sa akin ang isang hikaw mula sa kanyang nasamsam.” Sapagkat may mga gintong hikaw sila, dahil mga Ismaelita sila.'
