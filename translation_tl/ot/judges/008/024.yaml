base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Gideon sa kanila, “May hihilingin ako sa inyo: ibigay ng bawat isa sa akin ang isang hikaw mula sa kanyang nasamsam.” Sapagkat may mga gintong hikaw sila, dahil mga Ismaelita sila.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: May isang kahilingan ako sa inyo
  rationale: Natural na Filipino na pinananatili ang diwa ng idyomang Hebreo na literal na ‘hihingi ako sa inyo ng isang kahilingan.’
- source_word: אִישׁ נֶזֶם שְׁלָלוֹ
  choice: ibigay sa akin ng bawat isa ang hikaw mula sa nasamsam niya
  rationale: Ang אִישׁ ay distributibo (‘bawat isa’), ang נֶזֶם ay ‘hikaw/singsing,’ at ang שָׁלָל ay samsam sa digmaan; ‘hikaw’ ang hinihingi ng konteksto at ‘nasamsam’ ang likas na pandiwang Filipino.
- source_word: נִזְמֵי זָהָב
  choice: mga gintong hikaw
  rationale: Tuwirang inilalarawan ang mga palamuting ginto at tumutugma sa naunang ‘hikaw.’
- source_word: יִשְׁמְעֵאלִים
  choice: mga Ismaelita
  rationale: Karaniwang anyong Filipino ng pangalang etniko; hindi nilulutas ang kaugnayan nito sa naunang pagtukoy sa mga Midianita.
theological_decisions:
- issue: Pagkakakilanlan ng mga nasamsaman bilang mga Ismaelita samantalang Midianita ang tawag sa kanila sa salaysay
  choice: Pinanatili ang tahasang ‘mga Ismaelita sila’
  alternative: Ipaliwanag o palitan bilang ‘mga Midianita’
  rationale: Pinananatili ang mismong terminong etniko ng tekstong Hebreo at ang posibleng magkasanib o maluwag na gamit ng mga katawagan, nang hindi ipinapasok sa salin ang isang tiyak na paliwanag.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang ‘nasamsam’ sa halip na mas teknikal na ‘samsam niya,’ at ‘bawat isa’ upang natural na maipahayag ang distributibong אִישׁ.
