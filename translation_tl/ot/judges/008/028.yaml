base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: tl
  text: Kaya napasuko ang Midian sa harap ng mga Israelita, at hindi na sila muling nakapagtaas ng ulo.[a] At nagpahinga ang lupain sa loob ng apatnapung taon noong panahon ni Gideon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “muling nakabawi ng lakas” o “muling nakapag-angat ng ulo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: napasuko
  rationale: Ipinapahayag ng Niphal ang pagpapasailalim ng Midian. Ang “napasuko” ay natural sa kontekstong militar at pinananatili ang diwang pasibo.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang Hebreong idyoma ng pagpapasailalim sa harap ng ibang bayan nang hindi tahasang dinaragdagan ang teksto ng “sa kapangyarihan ng.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at malinaw na makabagong Tagalog para sa nakaugaliang pambansang katawagang “mga anak ni Israel,” nang walang pagbabago sa tinutukoy na pangkat.
- source_word: וְלֹא יָסְפוּ
  choice: hindi na sila muling
  rationale: Ipinahihiwatig ng יסף kasama ng pawatas na hindi na naulit ang pagkilos.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: nakapagtaas ng ulo
  rationale: Pinananatili ang kongkretong talinghaga ng Hebreo para sa muling pagkakaroon ng lakas, tapang, o kapangyarihan.
- source_word: וַתִּשְׁקֹט
  choice: nagpahinga
  rationale: Sa Aklat ng Mga Hukom, tumutukoy ito sa panahon ng kapahingahan mula sa digmaan; pinananatili rin ng “nagpahinga” ang personipikasyon ng lupain.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Natural nitong tinutukoy ang lupain ng Israel bilang kabuuang teritoryo.
- source_word: אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taon
  rationale: Tuwirang ipinapahayag ang haba ng panahon sa natural na Tagalog.
- source_word: בִּימֵי גִדְעוֹן
  choice: noong panahon ni Gideon
  rationale: Natural na Tagalog ito para sa karaniwang Hebreong pahayag ng panahon at hindi nito nililimitahan ang kahulugan sa eksaktong haba ng buhay ni Gideon.
theological_decisions:
- issue: Pagpapahayag sa בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ni Israel
  rationale: Ang parirala ay nakaugaliang pambansang katawagan. Mas natural sa kasalukuyang Tagalog ang “mga Israelita,” at pareho nitong tinutukoy ang buong bayan nang hindi nagpapasok ng doktrinal na pagpapakahulugan.
- issue: Pagpapanatili sa idyomang לָשֵׂאת רֹאשָׁם
  choice: nakapagtaas ng ulo
  alternative: nakabawi ng lakas
  rationale: Pinananatili sa pangunahing teksto ang talinghaga at ang saklaw nitong maaaring tumukoy sa lakas, tapang, o muling pag-angat. Inilalagay sa talababa ang mas tahasang mga kahulugan upang hindi sapilitang lutasin ang idyoma.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga talinghagang “nagtaas ng ulo” at “nagpahinga ang lupain,” ngunit gumamit ng natural na pambansang katawagang “mga Israelita.”
