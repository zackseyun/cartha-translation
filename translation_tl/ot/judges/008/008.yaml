  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: tl
  text: Mula roon ay umahon siya patungong Penuel[b] at nagsalita sa kanila nang gayon din.[a] Sinagot siya ng mga lalaki ng Penuel tulad ng pagsagot ng mga lalaki ng Sucot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “at nagsalita sa kanila nang ganito.” Tinutukoy ng Hebreo ang gayunding uri ng kahilingan o pananalitang iniulat sa naunang talata.'
    reason: lexical_alternative
  - marker: b
    text: Ang Penuel ay binabaybay ding “Peniel” sa ibang mga talata.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon siya
  rationale: Pinananatili ang direksiyonal na diwa ng עלה na ‘umahon/pumaitaas,’ at natural ito sa salaysay.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwirang tumutukoy sa naunang lugar.
- source_word: פְּנוּאֵל
  choice: Penuel
  rationale: Transliterasyon na sumusunod sa anyong katinig ng pangalang Hebreo sa talatang ito.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: at nagsalita sa kanila sa gayunding paraan
  rationale: Ipinahihiwatig ng כָּזֹאת na ang pananalita o kahilingan ay katulad ng nasa naunang talata, nang hindi nagdaragdag ng nilalamang hindi inuulit ng Hebreo.
- source_word: וַיַּעֲנוּ אֹתוֹ
  choice: Sumagot sa kanya
  rationale: Natural at maikling katumbas ng pandiwang ענה na may tuwirang layon.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: ang mga lalaki ng Penuel
  rationale: Pinananatili ang tiyak na panlalaking katawagang אַנְשֵׁי sa halip na gawing pangkalahatang ‘mga tao.’
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: gaya ng isinagot ng mga lalaki ng Sucot
  rationale: Malinaw na ipinapakita ang paghahambing sa naunang tugon ng mga taga-Sucot.
- source_word: סֻכּוֹת
  choice: Sucot
  rationale: Makabagong transliterasyong Filipino na malapit sa bigkas ng pangalang Hebreo.
