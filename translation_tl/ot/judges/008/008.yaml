revisions:
- from: Mula roon ay umahon siya sa Penuel[b] at nagsalita sa kanila sa gayunding paraan.[a] Sumagot sa kanya ang mga lalaki ng Penuel gaya ng isinagot ng mga lalaki ng Sucot.
  to: Mula roon ay umahon siya patungong Penuel[b] at nagsalita sa kanila nang gayon din.[a] Sinagot siya ng mga lalaki ng Penuel tulad ng pagsagot ng mga lalaki ng Sucot.
  rationale: Inayos ang dalawang pahayag para sa mas likas na makabagong Tagalog habang pinananatili ang direksiyonal na «umahon,» ang ipinahihiwatig na pag-uulit ng naunang pananalita, at ang paghahambing sa tugon ng mga lalaki ng Sucot. Walang idinagdag na interpretasyon o nilalaman.
