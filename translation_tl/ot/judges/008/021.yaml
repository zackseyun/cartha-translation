base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: tl
  text: Sinabi nina Zeba at Zalmuna, “Ikaw mismo ang tumayo at patayin mo kami, sapagkat kung ano ang isang lalaki, gayon din ang lakas niya.” Kaya tumayo si Gideon at pinatay sina Zeba at Zalmuna. Pagkatapos, kinuha niya ang mga palamuting hugis-gasuklay[a] na nasa leeg ng kanilang mga kamelyo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga palamuting hugis-buwan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... זֶבַח וְצַלְמֻנָּע
  choice: Sinabi nina Zeba at Zalmuna
  rationale: Ang pandiwang nasa isahan kasunod ng tambalang simuno ay likas na Hebreong ayos; sa natural na Tagalog, ginagamit ang pangmaramihang diwa sa “nina ... at ...” nang hindi ginagaya ang di-likas na anyo.
- source_word: קוּם אַתָּה
  choice: Ikaw mismo ang tumayo
  rationale: Pinananatili ng “ikaw mismo” ang diin ng tahasang panghalip אַתָּה kasama ng pautos na קוּם.
- source_word: וּפְגַע בָּנוּ
  choice: at patayin mo kami
  rationale: Bagaman maaaring mangahulugang salubungin, salakayin, o saktan ang פגע, malinaw na nakamamatay na pagpaslang ang tinutukoy sa konteksto ng pagbitay; natural at tumpak dito ang “patayin.”
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: sapagkat kung ano ang lalaki, gayon din ang kanyang lakas
  rationale: Pinananatili ang maikli at kasabihang anyo ng Hebreo at ang ugnayan ng pagkatao o kakayahan ng lalaki sa kanyang lakas, nang hindi nililinaw nang higit sa sinasabi ng teksto kung ito ay tumutukoy sa tindig, edad, o tapang.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Kaya tumayo si Gideon
  rationale: Ipinakikita ng “kaya” ang tugon ni Gideon at inuulit ng “tumayo” ang pandiwa sa utos na nauna.
- source_word: וַיַּהֲרֹג
  choice: at pinatay
  rationale: Direkta, malinaw, at makabagong salin ng karaniwang pandiwa para sa pagpatay.
- source_word: הַשַּׂהֲרֹנִים
  choice: mga palamuting hugis-buwan
  rationale: Ang salita ay tumutukoy sa mga palamuting hugis gasuklay o buwan; ang napiling salin ay madaling maunawaan at hindi nagpapahiwatig na literal na mga buwan ang kinuha.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: na nasa leeg ng kanilang mga kamelyo
  rationale: Natural na Tagalog na tumpak na nagsasaad kung saan nakalagay ang mga palamuti.
theological_decisions:
- issue: Ang panlalaking kasabihang כָאִישׁ
  choice: kung ano ang lalaki, gayon din ang kanyang lakas
  alternative: kung ano ang isang tao, gayon din ang kanyang lakas
  rationale: Panlalaki ang anyo at ang konteksto ay tungkol sa lakas ng isang lalaking mandirigma na magsasagawa ng pagpatay. Pinananatili ang “lalaki” sa halip na gawing neutral ang kasabihan.
- issue: Ang ipinahihiwatig ng kasabihan tungkol sa lakas
  choice: Panatilihin ang literal at bahagyang malabong kasabihan
  alternative: Ang tunay na lalaki ay may lakas na pumatay
  rationale: Hindi tahasang binabanggit ng Hebreo ang pagiging tunay na lalaki, edad, tindig, o tapang. Ang mas interpretatibong salin ay magpapasok ng paliwanag na wala mismo sa teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tumayo” upang mapanatili ang pag-uulit sa utos at tugon, at “Ikaw mismo” upang maipahayag ang diin. Ang kasabihan ay sadyang pinanatiling malapit sa Hebreo upang hindi tahimik na lutasin ang tunay nitong kalabuan.
