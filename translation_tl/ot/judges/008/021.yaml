  - severity: low
    issue: Bahagyang hindi likas ang “kung ano ang lalaki.”
    rationale: Ang pagdaragdag ng “isang” ay nagpapakinis sa modernong Tagalog nang hindi ipinapaliwanag o nilulutas ang pinagtatalunang saklaw ng kasabihan.
