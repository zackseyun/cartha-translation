  naturalness: Malinaw at marangal ang kabuuan. Mas natural nang bahagya ang “kung ano ang isang lalaki, gayon din ang lakas niya” kaysa “kung ano ang lalaki, gayon din ang kanyang lakas,” habang pinananatili ang sadyang kasabihan at kalabuan ng Hebreo.
  terminology: Ang mga pangalang Zeba, Zalmuna, at Gideon ay pare-pareho at angkop. Ang “palamuting hugis-gasuklay” ang mas eksaktong pangunahing termino para sa שַׂהֲרֹנִים; maaaring ilagay ang “hugis-buwan” bilang alternatibo sa talababa.
