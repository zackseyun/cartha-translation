  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ אוֹת֨/וֹ גִדְע֜וֹן לְ/אֵפ֗וֹד וַ/יַּצֵּ֨ג אוֹת֤/וֹ בְ/עִיר/וֹ֙ בְּ/עָפְרָ֔ה וַ/יִּזְנ֧וּ כָֽל יִשְׂרָאֵ֛ל אַחֲרָ֖י/ו שָׁ֑ם וַ/יְהִ֛י לְ/גִדְע֥וֹן וּ/לְ/בֵית֖/וֹ לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: tl
  text: Ginawa ni Gideon itong epod[a] at itinayo ito sa kanyang bayan, sa Ofra. Doon, nagpatutot ang buong Israel sa pagsunod dito[b], at naging bitag ito kay Gideon at sa kanyang sambahayan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “epod” ay isang sagradong bagay na nauugnay sa gawain ng mga pari; hindi lubos na tinutukoy rito ang eksaktong anyo o gamit nito.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, “nagpatutot sa pagsunod dito”; ginagamit ang larawan ng seksuwal na pagtataksil para sa pagsamba ng Israel sa diyus-diyosan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: ginawang epod
  rationale: 'Resultatibo ang gamit ng ל kasama ng עשה: ang materyal ay ginawa ni Gideon na isang epod. Pinanatili ang terminong “epod” sapagkat hindi lubos na tinutukoy ng talata ang anyo o gamit nito.'
- source_word: וַיַּצֵּג
  choice: itinayo
  rationale: Ipinahihiwatig ng pandiwa ang pagpapakatayo o paglalagay ng isang bagay sa nakatayong kalagayan. Ang “itinayo” ay angkop sa pampublikong paglalagay nito nang hindi ipinapalagay na isa lamang itong palamuti.
- source_word: בְעִירוֹ
  choice: sa kanyang bayan
  rationale: Maaaring tumukoy ang עִיר sa isang lungsod o pamayanan. Mas natural sa modernong Filipino ang “bayan” para sa Ofra at hindi nito pinalalaki ang sukat ng lugar.
- source_word: בְּעָפְרָה
  choice: sa Ofra
  rationale: Isinalin sa karaniwang anyong Filipino ang pangalan ng lugar.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: nagpatutot ... sa pagsunod dito
  rationale: Pinananatili ng “nagpatutot” ang mariing larawang seksuwal ng זנה para sa pagsamba sa diyus-diyosan. Nililinaw ng “sa pagsunod dito” ang idyomang אַחֲרָיו nang hindi pinahihina ang metapora.
- source_word: שָׁם
  choice: doon
  rationale: Pinanatili ang pagtukoy sa Ofra bilang mismong lugar ng pagtataksil ng Israel.
- source_word: לְמוֹקֵשׁ
  choice: naging bitag
  rationale: Ang מוֹקֵשׁ ay literal na silo o bitag at metaporikal na bagay na humihila sa kasalanan o kapahamakan. Natural at malinaw ang “bitag” sa Filipino.
- source_word: וּלְבֵיתוֹ
  choice: sa kanyang sambahayan
  rationale: Sa kontekstong ito, mas malawak ang בַּיִת kaysa gusali at tumutukoy sa pamilya o angkan ni Gideon. Ipinahahayag ito nang natural ng “sambahayan.”
theological_decisions:
- issue: Ang metapora para sa idolatrosong tugon ng Israel sa epod
  choice: Pinanatili ang tahasang larawang seksuwal sa “nagpatutot.”
  alternative: “nagtaksil” o “naligaw”
  rationale: Karaniwang metapora ang זנה para sa pagtataksil ng Israel sa Diyos sa pamamagitan ng idolatriya. Ang tahasang salin ay nagpapanatili sa bigat ng pananalita ng Hebreo.
- issue: Ang likas at eksaktong anyo ng epod ni Gideon
  choice: Ginamit ang terminong “epod” nang hindi ito tinawag na damit, rebulto, o kasangkapang pang-orakulo.
  alternative: “kasuotang pansaserdote,” “diyus-diyosan,” o “sagradong larawan”
  rationale: Pinangalanan ng teksto ang bagay ngunit hindi nito ganap na inilalarawan ang anyo o tungkulin niyon. Pinananatili ng “epod” ang tunay na kalabuan ng teksto.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “bayan” sa halip na “lungsod” para sa natural na paglalarawan sa Ofra, “sambahayan” para sa malawak na diwa ng בית, at pinanatili ang matinding metapora ng Hebreo nang may paliwanag sa talababa.
