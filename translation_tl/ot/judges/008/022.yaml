base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga lalaki ng Israel kay Gideon, “Mamuno ka sa amin—ikaw, ang anak mo, at pati ang apo mo[a]—sapagkat iniligtas mo kami mula sa kamay ng Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “anak ng anak mo.” Tahasang binabanggit ng Hebreo ang magkakasunod na salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa pagkakasunod-sunod ng salaysay. Likas sa makabagong Filipino ang “Pagkatapos” at malinaw nitong ipinapakita ang pagsulong ng pangyayari.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: mga lalaki ng Israel
  rationale: Bagaman anyong isahan ang אִישׁ, kolektibo ang gamit nito rito at may pandiwang maramihan. Pinananatili ng salin ang panlalaking at kolektibong diwa ng parirala.
- source_word: מְשָׁל בָּנוּ
  choice: Mamuno ka sa amin
  rationale: Ang pautos na anyo ng משל ay humihiling ng pampolitikang pamamahala o paghahari. Malinaw at natural ang “mamuno” nang hindi ipinapasok ang tiyak na titulong “hari,” na wala sa Hebreo.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: ikaw, ang anak mo, at pati ang apo mo
  rationale: Ipinahihiwatig ng inuulit na גַּם ang pagdaragdag at sunod-sunod na salinlahi. Natural sa Filipino ang “apo,” samantalang ipinaliliwanag sa talababa ang literal na “anak ng anak mo.”
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng kahilingan. Ang “sapagkat” ay malinaw, marangal, at angkop sa rehistro ng salin.
- source_word: הוֹשַׁעְתָּנוּ
  choice: iniligtas mo kami
  rationale: Ang anyo mula sa ישׁע ay tumutukoy sa pagliligtas o pagpapalaya. Pinananatili ng “iniligtas” ang malawak na biblikal na ugnayang leksikal habang akma sa kontekstong militar.
- source_word: מִיַּד מִדְיָן
  choice: mula sa kamay ng Midian
  rationale: Ang “kamay” ay idyomang Hebreo para sa kapangyarihan o kontrol. Nauunawaan din ito sa Filipino at pinananatili ang teksturang biblikal.
theological_decisions:
- issue: Uri ng pamumunong hinihiling kay Gideon
  choice: Isinalin bilang kahilingan para sa pampolitikang pamumunong magpapatuloy sa kanyang anak at apo.
  alternative: Isang maluwag na kahilingan lamang para sa pansamantalang pamumuno, na walang implikasyon ng dinastiya.
  rationale: Ang pautos na משל at ang tahasang pagkakasunod na “ikaw ... ang anak mo ... ang anak ng anak mo” ay nagpapahiwatig ng namamanang pamamahala. Gayunman, ginamit ang “mamuno” sa halip na “maghari” upang hindi ipasok ang tiyak na terminolohiya ng monarkiya na wala sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang kolektibong “mga lalaki ng Israel,” ang idyomang “kamay ng Midian,” at ang pahiwatig ng namamanang pamumuno nang hindi gumagamit ng terminong mas tiyak kaysa sa Hebreo.
