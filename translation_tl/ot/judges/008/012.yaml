base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: tl
  text: Tumakas sina Zeba at Zalmuna, at hinabol sila ni Gideon at binihag ang dalawang hari ng Midian—sina Zeba at Zalmuna—at pinataranta niya ang buong kampo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “at pinanginig niya sa takot ang buong kampo” o “at nilito niya ang buong kampo.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagpapanginig o pagpapataranta, na sa kontekstong militar ay maaaring magpahiwatig ng kaguluhan sa hukbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: Tumakas
  rationale: Ang Qal na anyong pasalaysay ng נוּס ay nangangahulugang tumakas o lum逃; natural at tuwiran sa makabagong Filipino ang “tumakas.”
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: sina Zeba at Zalmuna
  rationale: Isinalin sa anyong transliterasyon ang mga pangalang pantangi, gamit ang “sina” na likas sa Filipino para sa dalawang pangalan ng tao.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: hinabol sila ni Gideon
  rationale: Ang רדף + אחרי ay “humabol/tumugis.” Nilinaw ang di-tahasang simuno bilang si Gideon mula sa konteksto upang maging natural sa Filipino nang hindi binabago ang tinutukoy.
- source_word: וַיִּלְכֹּד
  choice: binihag
  rationale: Sa kontekstong militar, ang לכד ay paghuli o pagbihag. Ang “binihag” ay angkop sa pagdakip sa mga haring kaaway.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: ang dalawang hari ng Midian
  rationale: Pinananatili nito ang tahasang ugnayang construct ng Hebreo at natural din sa Filipino.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: sina Zeba at Zalmuna
  rationale: Pinanatili ang appositional na pag-uulit upang tukuyin at bigyang-diin kung sino ang dalawang haring nabihag.
- source_word: וְכָל הַמַּחֲנֶה
  choice: ang buong kampo
  rationale: Ang מַחֲנֶה ay tumutukoy sa kampo o puwersang militar; pinananatili ng “buong kampo” ang kolektibong diwa.
- source_word: הֶחֱרִיד
  choice: nilito niya sa takot
  rationale: Ang Hiphil ng חרד ay nagpapahiwatig ng pagpapanginig, pananakot, o pagpapataranta. Ipinahahayag ng “nilito niya sa takot” ang sanhi at ang kaguluhang militar, habang kinikilala sa talababa ang ibang posibleng diin.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ngunit” upang natural na iugnay ang pagtakas at paghabol, bagaman payak na waw ang nasa Hebreo. Tahasang pinangalanan si Gideon bilang simuno batay sa konteksto. Inilagay ang kinakailangang panandang talababa [a] matapos ang sugnay na saklaw nito.
