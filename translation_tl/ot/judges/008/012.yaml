revisions:
- from: Tumakas sina Zeba at Zalmuna, ngunit hinabol sila ni Gideon at binihag ang dalawang hari ng Midian—sina Zeba at Zalmuna—at nilito niya sa takot ang buong kampo.[a]
  to: Tumakas sina Zeba at Zalmuna, at hinabol sila ni Gideon at binihag ang dalawang hari ng Midian—sina Zeba at Zalmuna—at pinataranta niya ang buong kampo.[a]
  rationale: Inalis ang hindi kinakailangang “ngunit” upang mapanatili ang payak na pagkakasunod ng Hebreo. Pinalitan ang “nilito niya sa takot” ng mas natural at mas tumpak na “pinataranta niya,” habang pinanatili sa talababa ang ibang posibleng diin ng pandiwang Hebreo nang hindi ipinagpapalagay na ang “routed/defeated” ang tanging kahulugan.
