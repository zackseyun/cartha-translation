  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: tl
  text: At nang mamatay si Gideon, muling bumalik sa dati ang mga Israelita at naging gaya sila ng mga patutot sa pagsunod sa mga Baal.[a] Itinalaga nila si Baal-berit bilang kanilang diyos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nagpatutot sila sa pagsunod sa mga Baal.” Seksuwal na larawan ang ginagamit ng Hebreo para sa pagtataksil sa Diyos sa pamamagitan ng pagsamba sa mga diyos-diyosan.
    reason: lexical_alternative
  - marker: b
    text: Ang Baal-berit ay malamang na nangangahulugang “Baal ng tipan” o “Panginoon ng tipan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר מֵת גִּדְעוֹן
  choice: At nang mamatay si Gideon
  rationale: Ipinahihiwatig ng pormulang Hebreo ang paglipat ng salaysay at ang panahong kasunod ng pagkamatay ni Gideon. Ang “At nang” ay likas sa modernong Tagalog nang hindi pinabibigat ang pangungusap.
- source_word: וַיָּשׁוּבוּ
  choice: muling nagbalik sa dati
  rationale: Ang pandiwa ay tumutukoy sa pagbabalik sa dating pagtalikod, hindi sa pisikal na pag-uwi. Nililinaw ng “sa dati” ang diwang ito nang hindi ipinapasok kung kanino sila tumalikod.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ito ang natural at inklusibong katawagan sa buong bayang Israel sa modernong Tagalog; hindi hinihingi ng konteksto na tukuyin lamang ang mga lalaking anak.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: nagpatutot sila sa pagsunod sa
  rationale: Pinananatili ng “nagpatutot” ang tahasang seksuwal na talinghaga ng זנה para sa pagtataksil sa Diyos sa pamamagitan ng pagsamba sa ibang mga diyos. Ipinapahayag ng “sa pagsunod sa” ang gamit ng אַחֲרֵי sa kontekstong ito.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Ang maramihang anyo ay tumutukoy sa iba’t ibang lokal na anyo o sinasambang representasyon ni Baal; pinananatili ang maramihan sa salin.
- source_word: וַיָּשִׂימוּ לָהֶם ... לֵאלֹהִים
  choice: Ginawa nilang diyos
  rationale: Likas na ipinapahayag nito sa Tagalog ang pagtatalaga o pagkilala nila sa isang diyos para sa kanilang sarili.
- source_word: בַּעַל בְּרִית
  choice: Baal-berit
  rationale: Pinananatili bilang pantanging pangalang kultiko, habang inilalagay sa talababa ang posibleng kahulugan ng mga sangkap ng pangalan.
theological_decisions:
- issue: Pagpapanatili sa seksuwal na talinghaga para sa idolatriya
  choice: nagpatutot sila sa pagsunod sa mga Baal
  alternative: nagtaksil sila sa Diyos sa pamamagitan ng pagsunod sa mga Baal
  rationale: Tahasang ginagamit ng Hebreo ang זנה. Ang matapang na talinghaga ay nagpapakita ng bigat ng pagtataksil ng Israel at hindi dapat tahimik na palitan ng paliwanag lamang.
- issue: Pagpapakahulugan sa בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel
  rationale: Sa konteksto, ang parirala ay pangkalahatang katawagan sa bayang Israel. Ang “mga Israelita” ang likas at tumpak na katumbas sa Tagalog at hindi naglilimita sa tinutukoy sa mga lalaki lamang.
- issue: Pagkakakilanlan ni Baal-berit
  choice: panatilihin ang pangalang Baal-berit
  alternative: Baal ng Tipan / Panginoon ng Tipan
  rationale: Maaaring kultikong pantanging pangalan ito. Ang transliterasyon ay umiiwas sa labis na pagpapasya kung ang unang sangkap ay pangalan o titulong “panginoon,” habang naitatala sa talababa ang dalawang posibilidad.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit tuwiran. Sadyang pinanatili ang mabigat na pandiwang “nagpatutot” dahil mahalaga ang talinghaga sa Hebreo; ipinapaliwanag ito sa talababa. Ginamit ang baybay na “Baal-berit” upang maging madaling bigkasin sa Tagalog.
