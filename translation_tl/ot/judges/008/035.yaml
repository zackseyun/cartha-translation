base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: tl
  text: At hindi sila nagpakita ng kagandahang-loob sa sambahayan ni Jerubaal, na si Gideon, na naaayon sa lahat ng kabutihang ginawa niya para sa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: katapatan
  rationale: Sa kontekstong ito, tumutukoy ang salita sa tapat na kabutihang dapat sana nilang ipinakita sa sambahayan ni Gideon bilang pagkilala sa ginawa niya; pinananatili ng “katapatan” ang relasyonal na diin.
- source_word: בֵּית
  choice: sambahayan
  rationale: Ang “sambahayan” ay likas na tumutukoy sa pamilya o angkan ni Jerubaal, hindi lamang sa isang gusali.
- source_word: כְּכָל הַטּוֹבָה
  choice: bilang ganti sa lahat ng kabutihang
  rationale: Ipinahahayag ng parirala ang nararapat na pagtugon na kaayon ng kabutihang ginawa ni Gideon, nang hindi ipinapalagay na eksaktong kapantay ang pagganti.
- source_word: עִם יִשְׂרָאֵל
  choice: para sa Israel
  rationale: Sa Filipino, natural na ipinahahayag ng “para sa” ang kabutihang ginawa ni Gideon sa kapakanan ng Israel.
theological_decisions:
- issue: Ugnayan ng mga pangalang Jerubaal at Gideon
  choice: Jerubaal, na si Gideon
  alternative: Jerubaal (ibig sabihin, Gideon)
  rationale: Iisa ang tinutukoy ng dalawang pangalan. Ang “na si Gideon” ay malinaw na appositional at hindi maling nagpapahiwatig na salin o kahulugan ng pangalang Jerubaal ang “Gideon.”
- issue: Saklaw ng pananagutan ng Israel
  choice: hindi sila nagpakita ng katapatan sa sambahayan
  alternative: hindi sila gumawa ng kagandahang-loob sa sambahayan
  rationale: Pinananatili ang hatol ng salaysay na nabigo ang Israel sa tapat na pakikitungo sa pamilya ni Gideon, nang hindi nagdaragdag ng partikular na tipan o denominasyonal na pagbasa.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “sambahayan” para sa pamilya o angkan, at “na si Gideon” upang malinaw na ipakitang si Jerubaal at Gideon ay iisang tao.
