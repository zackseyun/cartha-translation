  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ גִּדְע֔וֹן לֹֽא אֶמְשֹׁ֤ל אֲנִי֙ בָּ/כֶ֔ם וְ/לֹֽא יִמְשֹׁ֥ל בְּנִ֖/י בָּ/כֶ֑ם יְהוָ֖ה יִמְשֹׁ֥ל בָּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: tl
  text: Ngunit sinabi ni Gideon sa kanila[a], “Hindi ako maghahari sa inyo, at hindi rin maghahari sa inyo ang anak ko. Si Yahweh ang maghahari sa inyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At sinabi ni Gideon sa kanila.” Maaari ring isalin ang pang-ugnay sa Hebreo bilang payak na “at” sa pagpapatuloy ng salaysay, ngunit ipinakikita ng “ngunit” ang pagsalungat ng tugon ni Gideon sa kahilingan ng bayan sa naunang talata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Ang waw-consecutive ay nagpapatuloy sa salaysay, ngunit sa konteksto ay sumasalungat ang tugon ni Gideon sa kahilingan ng bayan sa naunang talata. Kaya likas ang “Ngunit,” habang pinananatili ng “sinabi” ang payak na pandiwa ng pagsasalita.
- source_word: אֲלֵהֶם
  choice: sa kanila
  rationale: Karaniwang katumbas sa Tagalog ng pang-ukol na may hulaping panghalip na tumutukoy sa mga taong kinausap.
- source_word: גִּדְעוֹן
  choice: Gideon
  rationale: Ginamit ang nakaugaliang anyo ng personal na pangalan sa modernong saling Tagalog.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Hindi ako maghahari sa inyo
  rationale: Ang מָשַׁל ay tumutukoy sa pamamahala o paghahari. Sa konteksto ng alok na dinastikong pamumuno, natural at tuwiran ang “maghahari,” nang hindi nagdaragdag ng titulong “hari” na wala sa Hebreo.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: at hindi rin maghahari sa inyo ang anak ko
  rationale: Pinananatili ang parallel na pagtanggi at ang paglawak nito sa anak ni Gideon. Ang “rin” ay natural na naghahayag ng ikalawang negatibong sugnay sa Tagalog.
- source_word: בְּנִי
  choice: ang anak ko
  rationale: Singular ang pangngalan at may panlaping unang panauhan. Ang “anak ko” ay likas sa Tagalog at hindi pinalalawak sa “mga inapo,” upang mapanatili ang anyong singular.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: Si Yahweh ang maghahari sa inyo
  rationale: Inuulit ang parehong salitang-ugat na מָשַׁל. Ang “maghahari” ay nagpapanatili sa mahalagang pag-uulit at sa paghahambing ng pamamahala ni Gideon, ng anak niya, at ni Yahweh. Ang ayos na “Si Yahweh ang” ay natural na nagbibigay-diin sa tunay na mamamahala.
theological_decisions:
- issue: Ang pagtanggi ni Gideon sa pamumunong tulad ng pagkahari
  choice: Tinatanggihan ni Gideon ang sarili at dinastikong paghahari, at iniuukol kay Yahweh ang paghahari sa bayan.
  alternative: Maaaring tinatanggihan lamang ni Gideon ang pormal na titulong hari habang patuloy na nagsasagawa ng aktuwal na kapangyarihang pampamahalaan.
  rationale: Tatlong ulit na ginagamit ng Hebreo ang mga anyo ng מָשַׁל para kay Gideon, sa anak niya, at kay Yahweh. Pinananatili ng salin ang paghahambing na ito at hindi ipinapasok ang mas tiyak na titulong “hari,” na hindi ginagamit sa talata.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Pinili ang “maghahari” kaysa sa mas administratibong “mamamahala” upang maipahayag ang kontekstong pampolitika at mapanatili ang pare-parehong salin ng מָשַׁל, nang hindi idinaragdag ang titulong “hari.”
