  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: tl
  text: Sinabi rin niya sa mga lalaki ng Penuel[a], “Kapag nakabalik ako nang ligtas[b], gigibain ko ang toreng ito[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga lalaki ng Penuel” ay maaaring tumukoy sa mga lalaking pinuno o kinatawan ng bayan, hindi kinakailangang sa bawat lalaking naninirahan doon.
    reason: cultural_note
  - marker: b
    text: Sa Hebreo, “sa kapayapaan”; maaari ring unawain na “matagumpay at hindi napinsala.”
    reason: lexical_alternative
  - marker: c
    text: Ang “tore” ay maaaring isang tanggulan o toreng pinatibay sa loob ng Penuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: rin
  rationale: Ipinahihiwatig ang karagdagan sa naunang sinabi ni Gideon sa mga taga-Sucot; natural sa Tagalog ang “rin” pagkatapos ng pandiwa.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: sa mga lalaki ng Penuel
  rationale: Pinananatili ang literal na diwa ng אַנְשֵׁי bilang “mga lalaki,” habang nililinaw sa talababa na maaaring tumukoy ito sa mga lalaking kinatawan o pinuno ng bayan.
- source_word: בְּשׁוּבִי
  choice: kapag nakabalik ako
  rationale: Ang infinitive construct na may hulaping unang panauhan ay may temporal na diwa; ito ang natural na pagpapahayag sa modernong Tagalog.
- source_word: בְשָׁלוֹם
  choice: nang ligtas
  rationale: Sa konteksto ng pagbabalik mula sa labanan, ang שָׁלוֹם ay malamang na tumutukoy sa ligtas, matagumpay, at hindi napinsalang pagbabalik. Inilalahad sa talababa ang literal na “sa kapayapaan” upang mapanatili ang lawak ng kahulugan.
- source_word: אֶתֹּץ
  choice: gigibain ko
  rationale: Ang נתץ ay tumutukoy sa pagbuwag o pagpapabagsak ng isang gusali; malinaw, natural, at sapat ang tindi ng “gigibain.”
- source_word: הַמִּגְדָּל הַזֶּה
  choice: ang toreng ito
  rationale: Karaniwang kahulugan ng מִגְדָּל ang “tore.” Hindi isinasara ng salin ang posibilidad na isa itong tanggulang tore.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “nakabalik ako nang ligtas” para sa natural na daloy, habang pinanatili sa talababa ang literal at mas malawak na diwa ng Hebreong בְשָׁלוֹם.
