base_translation:
  language: en
  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: tl
  text: May pitumpung anak na lalaki si Gideon[a]—mga anak na mula mismo sa kanya—sapagkat marami siyang asawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga lumabas mula sa kanyang balakang,” isang idyoma para sa mga anak na biologikal na nagmula sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: May ... si Gideon
  rationale: Ang konstruksiyong היה + ל ay nagpapahayag ng pag-aari; likas sa modernong Tagalog ang hulma na “May ... si Gideon.” Hindi na ginawang tahasang “At” ang waw dahil sapat na ang ugnayang pangdiskurso sa konteksto.
- source_word: שִׁבְעִים בָּנִים
  choice: pitumpung anak na lalaki
  rationale: Tiyak na mga anak na lalaki ang בנים dito, kaya hindi lamang “mga anak.”
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: sarili niyang mga supling
  rationale: Idyoma ito para sa mga biyolohikal na anak. Malinaw at marangal ang “sarili niyang mga supling,” habang inilalagay sa talababa ang literal na larawan.
- source_word: כִּי
  choice: sapagkat
  rationale: Ipinakikilala nito ang dahilan ng malaking bilang ng mga anak; ang “sapagkat” ay malinaw at angkop sa marangal na rehistro.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: marami siyang asawa
  rationale: Sa kontekstong ito, ang נָשִׁים kasama ng konstruksiyong nagpapahayag ng pag-aari ay tumutukoy sa mga asawa, hindi lamang sa mga babae.
theological_decisions:
- issue: Paglalarawan sa sambahayang may maraming asawa
  choice: Isinaling tuwiran bilang “marami siyang asawa” nang walang komentaryong moral.
  alternative: “Marami siyang babae,” o dagdagan ng pahiwatig ng pagsang-ayon o pagsalungat.
  rationale: Iniuulat lamang ng talata ang kalagayan ng pamilya ni Gideon at hindi tahasang nagbibigay ng hatol. Hindi dapat ikubli ang kahulugang marital o magpasok ng pagsusuring wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, likas, at marangal. Pinanatili ang tiyak na kasarian ng בנים at ipinaliwanag sa talababa ang Hebreong idyoma nang hindi inilalagay ang alanganing literalismo sa pangunahing teksto.
