translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang “mga lalaki ng Efraim” upang mapanatili ang kolektibong idyomang Hebreo; ang mas natural na “mga Efraimita” ay inilagay sa talababa. Hinati ang mahabang tanong upang maging malinaw at natural sa Tagalog nang hindi binabago ang nilalaman.
