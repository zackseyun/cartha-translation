base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: tl
  text: Sinabi sa kanya ng mga lalaki ng Efraim[a], “Ano itong ginawa mo sa amin—na hindi mo kami tinawag nang pumunta ka upang makipaglaban sa Midian?” At matindi silang nakipagtalo sa kanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Efraimita.” Sa Hebreo, literal na “mga lalaki ng Efraim,” isang kolektibong tawag para sa lipi.
    reason: lexical_alternative
  - marker: b
    text: O “mahigpit silang nakipagtalo sa kanya” o “marubdob silang nakipagtalo sa kanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: mga lalaki ng Efraim
  rationale: Bagaman anyong isahan ang אִישׁ, kolektibo ang gamit nito rito, gaya ng pinatutunayan ng mga pandiwang maramihan. Pinananatili ng salin ang konkretong idyomang Hebreo habang malinaw sa Tagalog.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: Ano itong ginawa mo sa amin?
  rationale: Likas na tanong sa modernong Tagalog na pinananatili ang mapanumbat na puwersa ng Hebreo; hindi idinagdag ang mas tiyak na diwang “laban sa amin.”
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: Bakit hindi mo kami tinawag
  rationale: Ginagawang malinaw at natural sa direktang pananalita ang reklamo. Ang “tinawag” ay hindi mas malakas kaysa sa payak na קרא.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: nang pumunta ka upang makipaglaban sa Midian
  rationale: Ang כִּי ay inuunawang temporal sa loob ng reklamo. Ang “makipaglaban sa Midian” ay likas na nagpapahayag na Midian ang kalaban.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: matindi silang nakipagtalo sa kanya
  rationale: Ang ריב ay tumutukoy sa pakikipagtalo o pakikipagtunggali, at ang בְּחָזְקָה ay naglalarawan sa tindi nito. Pinananatili ang lakas ng pahayag nang hindi ipinahihiwatig na pisikal ang labanan.
