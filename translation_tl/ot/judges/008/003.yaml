base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: tl
  text: Ibinigay ng Diyos sa inyong kamay ang mga pinuno ng Midian, sina Oreb at Zeeb. Ano ba ang nagawa ko na maihahambing sa ginawa ninyo? Nang sabihin niya ito, humupa ang galit nila sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “lumuwag ang kanilang espiritu mula sa ibabaw niya,” isang idyomang nangangahulugang humupa ang galit nila sa kanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Ibinigay ng Diyos sa inyong kamay
  rationale: Pinananatili ang Hebreong idyoma ng paglalagay sa 'kamay,' na tumutukoy sa pagbibigay sa kapangyarihan o kontrol ng isang tao; natural din ito sa marangal na Filipino.
- source_word: שָׂרֵי מִדְיָן
  choice: ang mga pinuno ng Midian
  rationale: Ang שָׂרִים ay mga namumuno o nakatataas. Mas malinaw sa karaniwang mambabasa ang 'mga pinuno' kaysa 'mga prinsipe,' nang hindi ipinapalagay na mga anak sila ng hari.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: sina Oreb at Zeeb
  rationale: Ginamit ang karaniwang transliterasyon ng mga pangalang pantangi at ang pantukoy na 'sina' para sa natural na Filipino.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: Ano ba ang nagawa ko kung ihahambing sa inyo?
  rationale: Ipinahahayag ng tanong ang mapagpakumbaba at pahambing na diwa ng כָּכֶם. Ang 'ba' ay nagbibigay ng natural na retorikal na tono nang hindi dinaragdagan ang kahulugan.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: humupa ang galit nila sa kanya
  rationale: Idyomatikong inilalarawan ng parirala ang paglubag ng kanilang mapusok at laban na saloobin. Mas malinaw sa modernong Filipino ang 'humupa ang galit' kaysa literal na 'lumuwag ang kanilang espiritu.'
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Nang sabihin niya ito
  rationale: Natural na katumbas sa Filipino ng Hebreong pahayag na literal na 'sa pagsasalita niya ng bagay/salitang ito.'
