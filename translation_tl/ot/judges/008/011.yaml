translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang konkretong paglalarawang “mga naninirahan sa mga tolda” at ang bahagyang kalabuan ng בֶּטַח sa pamamagitan ng “panatag,” habang ipinaliliwanag sa talababa ang posibleng diwa nito sa kontekstong militar.
