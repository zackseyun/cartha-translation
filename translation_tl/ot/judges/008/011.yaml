base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: tl
  text: Pagkatapos, umakyat si Gideon sa daang tinatahak ng mga naninirahan sa mga tolda, sa silangan ng Noba at Jogbeha, at nilusob niya ang kampo habang panatag[a] ang kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tiwasay.” Maaaring tumukoy ang salitang Hebreo sa pagiging ligtas o panatag; sa kontekstong ito, malamang na ipinahihiwatig na hindi handa ang kampo sa paglusob.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umahon
  rationale: Karaniwang nangangahulugan ang עָלָה ng pag-ahon o pag-akyat. Pinananatili ng “umahon” ang kilos sa salaysay nang hindi tahasang ipinapalagay na ang pandiwa mismo ay nangangahulugang pagsalakay.
- source_word: דֶּרֶךְ
  choice: sa daan ng
  rationale: Ang דֶּרֶךְ ay daan o ruta. Likas sa Filipino ang “sa daan ng” sa kasunod na paglalarawan sa mga naninirahan sa tolda.
- source_word: הַשְּׁכוּנֵי בָאֳהָלִים
  choice: mga naninirahan sa mga tolda
  rationale: Tuwirang inilalarawan ng parirala ang mga taong naninirahan sa tolda. Iniiwasan nito ang mas interpretatibong “mga lagalag” o “mga nomad.”
- source_word: מִקֶּדֶם
  choice: sa silangan ng
  rationale: Sa kontekstong heograpikal, ipinahihiwatig nito ang kinaroroonan sa silangan ng dalawang bayang binanggit.
- source_word: לְנֹבַח וְיָגְבֳּהָה
  choice: Noba at Jogbeha
  rationale: Isinalin sa karaniwang anyong madaling bigkasin sa Filipino ang mga pangalang pook.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: sinalakay niya ang kampo
  rationale: Malawak ang saklaw ng נכה, mula sa paghampas hanggang sa pagsalakay. Sa kontekstong militar, malinaw at natural ang “sinalakay,” ngunit hindi nito ipinapalagay na ganap nang natalo ang kampo.
- source_word: הַמַּחֲנֶה
  choice: kampo
  rationale: Maaaring tumukoy ang מַחֲנֶה sa kampo o sa hukbong nagkakampo. Sapat at tuwiran dito ang “kampo.”
- source_word: בֶטַח
  choice: panatag
  rationale: Ang בֶּטַח ay maaaring magpahiwatig ng katiwasayan, seguridad, o pagtitiwala. Pinananatili ng “panatag” ang saklaw na iyon at ipinahihiwatig sa kontekstong militar na hindi naghihinala ng paglusob ang kampo.
