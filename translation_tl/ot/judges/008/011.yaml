revisions:
- from: Pagkatapos, umahon si Gideon sa daan ng mga naninirahan sa mga tolda, sa silangan ng Noba at Jogbeha. Sinalakay niya ang kampo habang panatag[a] ito.
  to: Pagkatapos, umakyat si Gideon sa daang tinatahak ng mga naninirahan sa mga tolda, sa silangan ng Noba at Jogbeha, at nilusob niya ang kampo habang panatag[a] ang kampo.
