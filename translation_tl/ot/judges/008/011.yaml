    issue: Hindi ganap na likas ang “umahon si Gideon sa daan ng mga naninirahan sa mga tolda.”
    rationale: Ang Hebreong parirala ay tumutukoy sa rutang kaugnay ng mga taong naninirahan sa tolda. Sa Filipino, mas malinaw na ipahayag na ito ay daang kanilang tinatahak, habang pinananatili ang pandiwang “umakyat.”
  - severity: low
    issue: Ang “sinalakay” ay bahagyang mas tiyak kaysa sa malawak na pandiwang נכה.
    rationale: Katanggap-tanggap ito sa kontekstong militar, ngunit ang “nilusob” ay mas tuwiran at natural na paglalarawan ng pag-atake sa kampo nang hindi nagdaragdag ng tiyak na resulta.
