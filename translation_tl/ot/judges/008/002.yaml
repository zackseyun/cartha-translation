translation_notes:
  register: Makabago, natural, at marangal na Filipino. Pinanatili ang retorikal at mapagpakumbabang tono ni Gideon at ang metaporang pang-ubasan. Ginamit ang baybay na “Efraim” at “Abiezer,” na malapit sa mga pangalang Hebreo at pamilyar sa tradisyong biblikal sa Filipino.
