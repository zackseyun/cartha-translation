base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: tl
  text: Namatay si Gideon, anak ni Joas, sa mabuting katandaan, at inilibing siya sa libingan ng kanyang amang si Joas[a], sa Ofra ng mga Abiezerita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa puntod ng kanyang amang si Joas.” Ang Hebreong קֶבֶר ay maaaring tumukoy sa puntod, libingan, o lugar ng libingan.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Ofra ng Abiezerita,” na nangangahulugang Ofra na kabilang sa angkan ng mga Abiezerita.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Namatay
  rationale: Tuwiran at payak na katumbas ng pandiwang מות; hindi nito pinalalambot ang pahayag gaya ng “pumanaw.”
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: si Gideon na anak ni Joas
  rationale: Natural na modernong Tagalog para sa pagkakakilanlan ayon sa ama, habang pinananatili ang ayos at ugnayan ng Hebreo.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: sa isang mabuting katandaan
  rationale: Pinananatili ang positibong paglalarawan ng שֵׂיבָה טוֹבָה nang hindi dinaragdagan ng ideyang “ganap” o “lubos” na wala sa parirala.
- source_word: וַיִּקָּבֵר
  choice: at inilibing siya
  rationale: Ipinapahayag ang pasibong diwa ng Niphal ng קבר sa natural na Tagalog.
- source_word: בְּקֶבֶר
  choice: sa libingan
  rationale: Ang “libingan” ay natural at sapat na malawak upang katawanin ang קֶבֶר, na maaaring tumukoy sa puntod o mas malaking pook/libingang pampamilya.
- source_word: יוֹאָשׁ אָבִיו
  choice: ng kanyang amang si Joas
  rationale: Malinaw at natural na Tagalog para sa konstruktong tumutukoy sa libingan ni Joas, na ama ni Gideon.
- source_word: בְּעָפְרָה
  choice: sa Ofra
  rationale: Karaniwang pagsasatitik sa Tagalog ng pangalan ng lugar.
- source_word: אֲבִי הָעֶזְרִי
  choice: ng mga Abiezerita
  rationale: Ang anyong gentiliko ay tumutukoy sa angkan ni Abiezer; ang maramihang “mga Abiezerita” ay malinaw na nagpapahayag ng ugnayang pang-angkan.
theological_decisions: []
translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang bahagyang di-karaniwang ngunit makahulugang pariralang “mabuting katandaan” upang maipakita ang positibong pananalita ng Hebreo. Inilagay ang mga talababa kaagad pagkatapos ng mga bahaging nililinaw ng mga ito.
