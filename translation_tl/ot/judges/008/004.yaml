revisions:
- from: Dumating si Gideon sa Jordan at tumawid[a], kasama ang tatlong daang lalaking tauhan niya. Pagod sila, ngunit patuloy na humahabol.
  to: Dumating si Gideon sa Jordan at tumawid siya kasama ang tatlong daang lalaking kasama niya. Pagod sila ngunit patuloy na humahabol.
  rationale: Pinalitan ang “lalaking tauhan niya” ng “lalaking kasama niya” upang huwag magdagdag ng ideya ng pagiging nasasakupan. Itinama rin ang talababa upang ang singular na pagtawid ay manatiling tumutukoy kay Gideon at upang maipakita ang leksikal na alternatibo nang hindi binabago ang saklaw ng paksa.
