base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: tl
  text: Dumating si Gideon sa Jordan at tumawid siya kasama ang tatlong daang lalaking kasama niya. Pagod sila ngunit patuloy na humahabol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dumating
  rationale: Karaniwang kahulugan ng בוא ang dumating o pumaroon. Sa pagkakabanggit ng patutunguhang Jordan, malinaw at natural sa modernong Filipino ang “dumating.”
- source_word: הַיַּרְדֵּנָה
  choice: sa Jordan
  rationale: Ipinahihiwatig ng directional he ang pagkilos patungo sa Jordan. Sapat at likas ang “sa Jordan”; hindi kailangang idagdag ang “Ilog” sa pangunahing teksto.
- source_word: עֹבֵר הוּא
  choice: at tumawid
  rationale: Ang participle na may tahasang panghalip ay masiglang naglalarawan sa pagtawid ni Gideon. Isinalin itong likas na salaysay sa Filipino nang hindi inaalis ang kilos.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: kasama ang tatlong daang lalaking tauhan niya
  rationale: Tinutukoy nito ang pangkat na kasama ni Gideon. Pinanatili ang panlalaking pagtukoy dahil mga mandirigmang lalaki ang nasa konteksto.
- source_word: עֲיֵפִים
  choice: Pagod
  rationale: Malinaw at pangkaraniwang salitang Filipino ito para sa pisikal na pagkaubos ng lakas, nang hindi ipinapalagay na halos himatayin na sila.
- source_word: וְרֹדְפִים
  choice: ngunit patuloy na humahabol
  rationale: Bagaman literal na maaaring “at humahabol,” ipinapakita ng magkatabing participle ang kaibhan ng kanilang pagod at patuloy na pagtugis. Ginagawang tahasan ng “ngunit patuloy” ang likas na concessive na diwa sa konteksto.
