base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: tl
  text: Pagkatapos, sinabi niya kina Zeba at Zalmuna, “Nasaan ang mga lalaking pinatay ninyo sa Tabor[a]?” Sumagot sila, “Gaya mo sila; bawat isa ay mukhang anak ng hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Tabor ay tumutukoy sa Bundok Tabor.
    reason: cultural_note
lexical_decisions:
- source_word: אֵיפֹה
  choice: Nasaan
  rationale: Likas na modernong Tagalog para sa pang-abay na pananong tungkol sa kinaroroonan, kasama ang ipinahihiwatig na panaguri.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaking
  rationale: Tumutukoy rito sa mga tiyak na lalaking biktima, hindi sa mga tao sa pangkalahatan.
- source_word: הֲרַגְתֶּם
  choice: pinatay ninyo
  rationale: Direkta at neutral na katumbas ng pandiwang ‘pumatay,’ nang hindi idinaragdag ang legal o moral na pagpapakahulugang nasa ‘pinaslang’ o ‘minurder.’
- source_word: בְּתָבוֹר
  choice: sa Tabor
  rationale: Sapat at natural na salin ng pang-ukol at pangalang-pook; ipinapaliwanag sa talababa na ito ay Bundok Tabor.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Kung ano ang anyo mo, gayon din ang sa kanila
  rationale: Ipinapahayag ang eliptikong paghahambing kay Gideon nang malinaw sa Tagalog habang pinananatili ang pagtutumbas ng kanilang anyo.
- source_word: אֶחָד
  choice: bawat isa
  rationale: 'Ginamit nang pamahagi: ang bawat lalaki ay may gayong anyo.'
- source_word: כְּתֹאַר
  choice: ay mukhang
  rationale: Natural na Tagalog para sa panlabas na anyo o hitsura sa predikatibong pangungusap.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: anak ng isang hari
  rationale: Pinananatili ang idyomang tumutukoy sa maharlikang anyo at ang di-tiyak na diwa, sa halip na gawing interpretatibong ‘prinsipe.’
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: sinabi niya ... Sumagot sila
  rationale: Natural ang ganitong daloy ng salaysay at usapan sa Tagalog; ang ikalawang ‘sinabi’ ay idiomatikong ‘sumagot’ sa konteksto.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang karaniwang anyong Filipino ng mga pangalan na Zeba at Zalmuna. Hindi isinama ang alternatibong talababa ng English consultation layer sapagkat tila mali ang pagkakalagay ng mga marker doon: ang alternatibong pagbasa ay tumutukoy sa sugnay ng paghahambing, samantalang ang marker [a] ay nakalagay sa pangalan ni Zalmuna. Tanging ang kapaki-pakinabang na heograpikong paliwanag ang inilagay sa wastong marker pagkatapos ng Tabor.'
