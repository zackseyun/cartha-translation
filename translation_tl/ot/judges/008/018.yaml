  source_fidelity: 'Tumpak ang pangunahing diwa: tinanong ni Gideon sina Zeba at Zalmuna tungkol sa mga lalaking pinatay nila sa Tabor, at inihambing ng kanilang sagot ang mga ito kay Gideon at sa maharlikang anyo ng bawat isa. Gayunman, ang “Kung ano ang anyo mo” ay naglilimita sa unang eliptikong paghahambing sa ‘anyo,’ samantalang ang Hebreo ay mas maikli at mas malawak na “gaya mo sila”; saka pa lamang nito inilalarawan ang kanilang anyo sa kasunod na sugnay.'
  naturalness: Natural sa kabuuan ang Tagalog, ngunit mas tuwiran at mas likas sa diyalogo ang “Gaya mo sila” kaysa “Kung ano ang anyo mo, gayon din ang sa kanila.”
  terminology: Ang “Zeba,” “Zalmuna,” “Tabor,” “pinatay,” at “anak ng hari” ay angkop. Ang “anak ng hari” ay pinananatiling di-tiyak at hindi binibigyang-kahulugang “prinsipe.” Ang talababa sa Tabor ay wastong nakaangkla.
