  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: tl
  text: Pagkatapos, kinuha ni Gideon ang mga nakatatanda ng lungsod, pati ang mga tinik sa ilang at ang mga halamang matinik. Sa pamamagitan ng mga iyon, tinuruan niya ng aral[a] ang mga lalaki ng Sucot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahirap ang pananalitang Hebreo. Sa literal, “ipinaalam niya sa pamamagitan ng mga iyon”; maaari rin itong unawain bilang “pinarusahan niya” o, nang mas marahas, “giniik niya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: ang matatandang pinuno ng lungsod
  rationale: Ang זִקְנֵי ay literal na “matatanda” ngunit tumutukoy rito sa mga kinikilalang pinunong pansibiko. Pinananatili ng “matatandang pinuno” kapwa ang literal na larawan at ang tungkulin nila.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: mga tinik sa ilang
  rationale: Tuwirang inilalarawan nito ang mga tinik o halamang matinik na nagmula sa ilang, sa natural at malinaw na modernong Tagalog.
- source_word: הַבַּרְקֳנִים
  choice: mga halamang matinik
  rationale: Hindi tiyak ang eksaktong uri ng matinik na halaman. Iniiwasan ng pangkalahatang salin ang di-makatwirang pagtukoy sa isang partikular na uri gaya ng dawag o tistle.
- source_word: וַיֹּדַע בָּהֶם
  choice: Sa pamamagitan ng mga iyon, tinuruan niya ng aral
  rationale: Karaniwang may diwang “ipaalam” ang Hiphil ng ידע, ngunit dito ay tumutukoy ang mahirap na idyoma sa marahas na pagpaparusa gamit ang mga tinik. Ang “tinuruan ng aral” ay likas sa Tagalog, pinananatili ang ugnayan sa pagtuturo o pagpapaalam, at malinaw na nagpapahiwatig ng kaparusahan nang hindi lubusang nilulutas ang tekstuwal na hirap.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: ang mga lalaki ng Sucot
  rationale: Ang אַנְשֵׁי ay panlalaking maramihan at literal na “mga lalaki ng.” Pinananatili ng salin ang kasariang hayagang nasa Hebreo.
