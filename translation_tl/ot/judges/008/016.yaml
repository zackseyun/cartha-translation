translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” upang maging malinaw ang tungkuling pansibiko ng mga elder, at “tinuruan ng aral” upang mapanatili ang mahirap na paglalaro ng diwa sa Hebreo habang naipahihiwatig ang maparusang kilos.
