  terminology: Napananatili ang Sucot, isang karaniwang anyong Tagalog ng pangalan. Ang “mga nakatatanda” ay mas angkop na katumbas ng civic title na זִקְנֵי kaysa sa pinagsamang “matatandang pinuno.” Wasto ang maingat na pagtukoy sa dalawang magkahiwalay na uri ng matinik na halaman.
