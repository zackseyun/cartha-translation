lexical_decisions:
- source_word: מִגְדַּל
  choice: tore
  rationale: Karaniwang tumutukoy ang pangngalan sa isang tore o mataas na pinatibay na gusali; ang “tore” ang tuwiran at likas na salin sa konteksto.
- source_word: פְּנוּאֵל
  choice: Penuel
  rationale: Sinusunod ng “Penuel” ang anyong katinig ng pangalan sa tekstong Hebreo; itinatala sa talababa ang tradisyonal na anyong “Peniel.”
- source_word: נָתָץ
  choice: ibinagsak
  rationale: Ang pandiwa ay nangangahulugang gibain o pabagsakin ang isang gusali. Likas sa modernong Filipino ang “ibinagsak” para sa paggiba sa isang tore at pinananatili nito ang lakas ng kilos.
- source_word: וַיַּהֲרֹג
  choice: pinatay
  rationale: Tuwirang nangangahulugan ang הרג na pumatay; malinaw at kasalukuyang gamit ang “pinatay.”
- source_word: אַנְשֵׁי הָעִיר
  choice: ang mga lalaki ng lungsod
  rationale: Literal na tumutukoy ang parirala sa mga lalaki ng lungsod. Pinananatili ang panlalaking kahulugan sa kontekstong militar at mapagparusa sa halip na gawing pangkalahatang “mga tao.”
