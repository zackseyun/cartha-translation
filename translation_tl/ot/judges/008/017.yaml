  text: He tore down the tower of Penuel and killed the men of the city[a].
translation:
  language: tl
  text: Giniba niya ang tore ng Penuel[a] at pinatay ang mga lalaki ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Penuel: tradisyonal ding binabaybay na “Peniel.”'
