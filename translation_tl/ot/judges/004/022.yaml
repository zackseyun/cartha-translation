  text: וְ/הִנֵּ֣ה בָרָק֮ רֹדֵ֣ף אֶת סִֽיסְרָא֒ וַ/תֵּצֵ֤א יָעֵל֙ לִ/קְרָאת֔/וֹ וַ/תֹּ֣אמֶר ל֔/וֹ לֵ֣ךְ וְ/אַרְאֶ֔/ךָּ אֶת הָ/אִ֖ישׁ אֲשֶׁר אַתָּ֣ה מְבַקֵּ֑שׁ וַ/יָּבֹ֣א אֵלֶ֔י/הָ וְ/הִנֵּ֤ה סִֽיסְרָא֙ נֹפֵ֣ל מֵ֔ת וְ/הַ/יָּתֵ֖ד בְּ/רַקָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: tl
  text: At narito, hinahabol ni Barak si Sisera. Lumabas si Jael upang salubungin siya at sinabi sa kanya, “Halika, at ipapakita ko sa iyo ang lalaking hinahanap mo.” Kaya pumasok siya sa tolda ni Jael, at naroon si Sisera, nakahandusay na patay, at nakabaon sa sentido nito ang tulos ng tolda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: At narito / at naroon
  rationale: Pinananatili ang pampanitikang panawag-pansin ng Hebreo, ngunit iniangkop ang ikalawang paglitaw sa natural na Tagalog ayon sa tagpo.
- source_word: רֹדֵף
  choice: hinahabol
  rationale: Likas na Tagalog para sa aktibong pagtugis ni Barak kay Sisera.
- source_word: לֵךְ
  choice: Halika
  rationale: Bagaman karaniwang nangangahulugang “humayo,” sa kontekstong ito ay paanyayang sumama o pumasok sa kinaroroonan ni Jael.
- source_word: וְאַרְאֶךָּ
  choice: at ipapakita ko sa iyo
  rationale: Tuwirang ipinahahayag ang causative na diwa ng “ipakikita ko sa iyo.”
- source_word: נֹפֵל מֵת
  choice: nakahandusay na patay
  rationale: Ang participle na “nakabagsak/nakahandusay” kasama ang “patay” ay inilalarawan bilang kalagayang nadatnan ni Barak.
- source_word: הַיָּתֵד
  choice: tulos ng tolda
  rationale: Nililinaw na ito ang tulos na ginagamit sa tolda, ayon sa konteksto ng salaysay.
- source_word: בְּרַקָּתוֹ
  choice: sa sentido nito
  rationale: Ang רַקָּה ay tumutukoy sa sentido o gilid ng ulo; ang “nito” ay malinaw na tumutukoy kay Sisera.
theological_decisions: []
translation_notes:
  register: Makabagong Filipino Tagalog na pasalaysay, malinaw at marangal. Ginamit ang “tolda ni Jael” sa halip na literal na “pumasok sa kanya” upang maiwasan ang maling pakahulugan at maipahayag ang kontekstuwal na diwa ng pagpasok sa kinaroroonan niya.
