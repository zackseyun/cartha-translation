  to: Sinabi niya sa kanya, “Pakibigyan mo ako ng kaunting tubig na maiinom, sapagkat nauuhaw ako.” Kaya binuksan niya ang sisidlang balat na may gatas[a], pinainom niya siya ng gatas, at tinakpan niya siya.
