  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: tl
  text: Sinabi niya sa kanya, “Pakibigyan mo ako ng kaunting tubig na maiinom, sapagkat nauuhaw ako.” Kaya binuksan niya ang sisidlang balat na may gatas[a], pinainom niya siya ng gatas, at tinakpan niya siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay isang sisidlang yari sa balat ng hayop, hindi isang makabagong bote.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  choice: Pakiinom mo ako
  rationale: Ang Hiphil imperative ng שׁקה na may hulaping 1cs ay nangangahulugang ‘painumin mo ako’ o ‘bigyan mo ako ng maiinom.’ Ang ‘Pakiinom mo ako’ ay natural na pakiusap sa modernong Tagalog at napapanatili ang causative na diwa.
- source_word: נָא
  choice: Paki-
  rationale: Ang נָא ay nagpapalumanay sa utos bilang magalang na pakiusap. Likas itong naipapahayag sa unlaping ‘paki-’ sa Tagalog.
- source_word: מְעַט מַיִם
  choice: kaunting tubig
  rationale: Tuwirang ipinahahayag ng מְעַט ang maliit na dami; malinaw at natural ang ‘kaunting tubig.’
- source_word: כִּי צָמֵאתִי
  choice: dahil nauuhaw ako
  rationale: Ibinibigay ng כִּי ang dahilan ng pakiusap. Ang ‘dahil nauuhaw ako’ ay kasalukuyan at natural na katumbas ng Hebreong perfect na naglalarawan sa kalagayan ni Sisera.
- source_word: נֹאוד הֶחָלָב
  choice: sisidlang balat na may gatas
  rationale: Ang נֹאוד ay sisidlang yari sa balat ng hayop, hindi makabagong bote. Ang ‘na may gatas’ ay natural na naghahayag na gatas ang laman ng construct phrase.
- source_word: וַתַּשְׁקֵהוּ
  choice: pinainom siya
  rationale: Muling causative ang שׁקה. Sapat ang ‘pinainom siya’ dahil malinaw sa naunang sugnay na gatas mula sa sisidlan ang ibinigay; hindi nito ipinahihiwatig ang pamimilit.
- source_word: וַתְּכַסֵּהוּ
  choice: muli siyang tinakpan
  rationale: Ang כסה ay ‘takpan’ o ‘ikubli.’ Idinagdag ang ‘muli’ upang natural na ipakita ang pagpapatuloy mula sa 4:18, kung saan tinakpan na siya ni Jael, nang hindi tinutukoy ang pantakip na iniwang di-binanggit sa Hebreo.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at pasalaysay. Ginamit ang ‘sisidlang balat’ sa halip na ‘boteng balat’ upang maiwasan ang modernong larawan ng bote. Ang mga panghalip ay pinanatiling malinaw sa pamamagitan ng ‘sa babae’ at ‘nito,’ yamang ang magkasunod na panlalaki at pambabaeng tauhan ay maaaring magdulot ng kalituhan.
