  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: tl
  text: Kaya dumaing kay Yahweh[a] ang mga Israelita, sapagkat mayroon siyang siyam na raang karwaheng bakal, at malupit niyang inapi ang mga Israelita sa loob ng dalawampung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Yahweh: ang personal na pangalan ng Diyos sa Hebreo; madalas itong isinasalin na “PANGINOON.”'
    reason: Nililinaw ang anyo at tradisyonal na katumbas ng tetragrammaton יהוה.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: dumaing kay Yahweh
  rationale: Ang “dumaing” ay natural na katumbas ng paghingi ng tulong sa gitna ng matinding paghihirap; pinananatili ng “Yahweh” ang personal na pangalan sa Hebreo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Mas natural sa modernong Filipino kaysa literal na “mga anak na lalaki ng Israel,” habang tumpak na tumutukoy sa sambayanang Israel.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: siyam na raang karwaheng bakal
  rationale: Direktang inilalarawan ang 900 sasakyang pandigma na tinatawag ng tekstong Hebreo na mga karwaheng bakal.
- source_word: לָחַץ ... בְּחָזְקָה
  choice: malupit niyang inapi
  rationale: Ang לָחַץ ay pang-aapi o matinding pagdiin, at ang בְּחָזְקָה ay nagpapalakas sa paraan nito; ang parirala ay natural at malinaw sa Filipino.
- source_word: עֶשְׂרִים שָׁנָה
  choice: sa loob ng dalawampung taon
  rationale: Likas na Filipino para sa tagal na dalawampung taon.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh[a]
  alternative: PANGINOON
  rationale: Ginamit ang transliterasyong “Yahweh” upang malinaw na katawanin ang personal na pangalan sa pinagmulang Hebreo; ipinaliliwanag sa talababa ang tradisyonal na salin.
- issue: Referent ng mga panlalaking panghalip sa sugnay
  choice: “mayroon siyang ... at malupit niyang inapi” ay tumutukoy kay Jabin ayon sa agarang konteksto
  alternative: Gawing tahasang “si Sisera” o ulitin ang “si Jabin”
  rationale: Pinananatili ang panghalip ng tekstong Hebreo at hindi tahasang nilulutas sa mismong talata ang anumang tensiyon sa pagitan ng hari at ng pinuno ng hukbo sa nakapaligid na salaysay.
translation_notes:
  register: Modernong Filipino na simple ngunit marangal. Ginamit ang “mga Israelita” sa halip na literal na “mga anak ng Israel,” at “karwaheng bakal” bilang madaling maunawaang katawagan sa sasakyang pandigma.
