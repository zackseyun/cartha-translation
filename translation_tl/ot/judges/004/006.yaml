base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: tl
  text: 'Nagpasugo siya at ipinatawag niya si Barak, anak ni Abinoam, mula sa Kedes sa Neftali. Sinabi niya sa kanya, “Hindi ba iniutos ng PANGINOON, ang Diyos ng Israel: ‘Humayo ka at magtipon sa Bundok Tabor, at magsama ka ng sampung libong lalaki mula sa mga lipi ni Neftali at Zebulun’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: Nagpasugo siya at ipinatawag
  rationale: Pinananatili ang dalawang magkasunod na kilos—nagpadala siya ng sugo at ipinatawag si Barak—sa natural na Tagalog.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: mula sa Kedesh-naftali
  rationale: Itinuturing ang parirala bilang pangalan/pagtukoy sa Kedesh na nasa teritoryo ng Naftali at pinananatili ang maikling anyo ng Hebreo.
- source_word: הֲלֹא צִוָּה
  choice: Hindi ba iniutos
  rationale: Pinananatili ang retorikal na tanong, na nagpapahiwatig na alam o dapat kilalanin ni Barak ang utos.
- source_word: לֵךְ וּמָשַׁכְתָּ
  choice: Humayo ka at tipunin mo ang iyong mga tauhan
  rationale: Ang משך ay literal na ‘humila/umabot’ ngunit sa kontekstong militar ay malamang tumutukoy sa pagtipon o pagpapakilos ng hukbo; nilinaw ang ipinahihiwatig na mga tauhan nang hindi tinutukoy ang eksaktong paraan ng pagkilos.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: sampung libong lalaki
  rationale: Direktang katumbas ng bilang at ng terminong tumutukoy sa mga lalaking mandirigma sa konteksto.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: mula sa mga lipi ni Neftali at Zebulun
  rationale: Ang literal na ‘mga anak ni’ ay isang karaniwang Hebreong pagtukoy sa mga kasapi ng mga lipi; ‘mga lipi’ ang mas malinaw at natural sa modernong Tagalog.
theological_decisions:
- issue: Paglalahad sa banal na pangalan יהוה
  choice: PANGINOON
  alternative: Yahweh
  rationale: Ginamit ang nakaugaliang salin sa Tagalog na PANGINOON sa malalaking titik upang ipahiwatig ang tetragrammaton, nang hindi nagdaragdag ng denominasyonal na pagpapakahulugan.
- issue: Lakas ng retorikal na tanong ni Debora
  choice: Hindi ba iniutos ng PANGINOON…?
  alternative: Iniutos sa iyo ng PANGINOON…
  rationale: Pinananatili ang anyong tanong at ang tensiyon kung ito ba ay paalala, pagsaway, o pormal na paghahatid ng utos.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘rito’ para kay Barak at ang ‘mga tauhan’ sa utos upang maging natural ang daloy, habang pinananatili ang retorikal na anyo at militar na konteksto ng Hebreo.
