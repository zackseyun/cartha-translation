  text: וַ/יַּגִּ֖דוּ לְ/סִֽיסְרָ֑א כִּ֥י עָלָ֛ה בָּרָ֥ק בֶּן אֲבִינֹ֖עַם הַר תָּבֽוֹר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: tl
  text: At sinabi nila kay Sisera na umakyat sa Bundok Tabor si Barak na anak ni Abinoam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: At sinabi nila
  rationale: Ang Hifil na anyong wayyiqtol ng נגד ay nangangahulugang “sabihin” o “iulat.” Hindi tinutukoy sa konteksto kung sino ang maramihang simuno, kaya pinananatili ang likas at aktibong “sinabi nila.”
- source_word: לְסִיסְרָא
  choice: kay Sisera
  rationale: Minamarkahan ng לְ ang di-tuwirang layon; natural itong isalin sa Tagalog bilang “kay Sisera.”
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng ibinalita, kaya “na” ang angkop kaysa sa sanhi na “dahil.”
- source_word: עָלָה
  choice: umakyat sa
  rationale: Ang עלה ay “umakyat” o “pumaroon sa mataas na lugar.” Ang “umakyat sa” ay natural at pinananatili ang direksiyonal at topograpikong diwa nang hindi dinaragdagan ang aspektong wala namang tahasang minamarkahan sa Hebreo.
- source_word: בָּרָק
  choice: Barak
  rationale: Karaniwang transliterasyon sa Filipino ng pangalang Hebreo.
- source_word: בֶּן אֲבִינֹעַם
  choice: na anak ni Abinoam
  rationale: Likas na salin ng patronimikong pariralang Hebreo; ikinakabit ng “na” ang pagkakakilanlan kay Barak.
- source_word: הַר תָּבוֹר
  choice: Bundok Tabor
  rationale: Ang הַר ay bundok o mataas na lupain, ngunit tumutukoy rito sa tiyak na taluktok na Tabor; “Bundok Tabor” ang malinaw at karaniwang anyo sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang di-tiyak na maramihang simuno sa “sinabi nila” at ang payak na aspektong Hebreo sa “umakyat,” sa halip na magdagdag ng tahasang pluperfect.
