  text: וַ/תֵּצֵ֣א יָעֵל֮ לִ/קְרַ֣את סִֽיסְרָא֒ וַ/תֹּ֣אמֶר אֵלָ֗י/ו סוּרָ֧/ה אֲדֹנִ֛/י סוּרָ֥/ה אֵלַ֖/י אַל תִּירָ֑א וַ/יָּ֤סַר אֵלֶ֨י/הָ֙ הָ/אֹ֔הֱלָ/ה וַ/תְּכַסֵּ֖/הוּ בַּ/שְּׂמִיכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: tl
  text: Lumabas si Jael upang salubungin si Sisera at sinabi sa kanya, “Lumihis ka rito, panginoon ko; lumihis ka papunta sa akin.[a] Huwag kang matakot.” Kaya lumihis siya papunta kay Jael at pumasok sa tolda. Pagkatapos, tinakpan siya ni Jael ng isang kumot.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Pumasok ka, panginoon ko; pumasok ka sa akin.” Literal na nangangahulugang “lumihis” ang pandiwang Hebreo, na naglalarawan ng pag-alis sa dinaraanan upang pumasok sa isang masisilungan.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay maaari ring tumukoy sa isang banig, alpombra, o iba pang telang pantakip.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Lumabas
  rationale: Tuwirang ipinapahayag ng יצא ang paglabas ni Jael mula sa kanyang kinaroroonan, malamang mula sa tolda.
- source_word: לִקְרַאת
  choice: upang salubungin
  rationale: Natural na Tagalog ang “salubungin” para sa sinadyang paglapit upang katagpuin ang isang paparating.
- source_word: סוּרָה
  choice: Lumihis ka rito
  rationale: Pinananatili nito ang pangunahing larawan ng paglihis mula sa dinaraanan, pati ang pag-uulit sa Hebreo, nang hindi agad nililimitahan ang kahulugan sa “pumasok.”
- source_word: אֲדֹנִי
  choice: panginoon ko
  rationale: Magalang at mapagpakumbabang pantawag ito sa lalaking may mataas na katayuan; maliit na titik ang gamit upang hindi mapagkamalang banal na titulo.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Malinaw at likas na modernong Tagalog para sa karaniwang pormula ng pagbibigay-katiyakan.
- source_word: וַיָּסַר
  choice: lumihis siya
  rationale: Pinananatili ang ugnayang leksikal sa dalawang paanyayang סוּרָה at ipinakikitang tumugon si Sisera sa sinabi ni Jael.
- source_word: הָאֹהֱלָה
  choice: pumasok sa tolda
  rationale: Ipinahihiwatig ng directional ending ang kilos patungo sa tolda; sa konteksto, malinaw na nauwi ito sa pagpasok.
- source_word: וַתְּכַסֵּהוּ
  choice: tinakpan siya
  rationale: Ito ang tuwiran at hindi labis na interpretatibong kahulugan ng כסה; hindi nito ipinapalagay na ang pangunahing layunin ay itago siya.
- source_word: בַּשְּׂמִיכָה
  choice: ng isang kumot
  rationale: Ang שׂמיכה ay pantakip na tela; “kumot” ang pinakanatural at madaling maunawaang katumbas sa tagpo, habang kinikilala sa talababa ang ibang posibilidad.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “lumihis ka rito” upang mapanatili ang larawan at pag-uulit ng Hebreo; ginamit ang “panginoon ko” bilang magalang na pantawag, hindi bilang banal na titulo. Inulit ang pangalang Jael sa huling pangungusap upang maiwasan ang kalituhan ng mga panghalip sa Tagalog.
