revisions:
- from: Lumabas si Jael upang salubungin si Sisera at sinabi sa kanya, “Lumihis ka rito, panginoon ko; lumihis ka rito sa akin.[a] Huwag kang matakot.” Kaya lumihis siya patungo kay Jael at pumasok sa tolda. Pagkatapos, tinakpan siya ni Jael ng isang kumot.[b]
  to: Lumabas si Jael upang salubungin si Sisera at sinabi sa kanya, “Lumihis ka rito, panginoon ko; lumihis ka papunta sa akin.[a] Huwag kang matakot.” Kaya lumihis siya papunta kay Jael at pumasok sa tolda. Pagkatapos, tinakpan siya ni Jael ng isang kumot.[b]
  rationale: Inayos ang ikalawang paanyaya upang malinaw at likas na maipahayag ang direksiyong “papunta sa akin,” samantalang pinanatili ang “lumihis” at ang pag-uulit na mahalaga sa Hebreo. Itinama rin ang talababa upang tumugma ang pang-isahang utos sa kausap na si Sisera. Walang binagong kahulugan ng salaysay.
