id: JDG.4.15
reference: Judges 4:15
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: tl
  text: At ginulo ni Yahweh[a] si Sisera, ang lahat ng kanyang mga karwahe, at ang buo niyang hukbo[c] sa harap ni Barak sa pamamagitan ng tabak.[b] Pagkatapos, bumaba si Sisera mula sa kanyang karwahe at tumakas siyang naglalakad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilito” o “nagdulot ng sindak”; ang pandiwang Hebreo ay maaaring tumukoy sa pagdudulot ng sindak at kalituhan sa labanan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa bibig/talim ng tabak.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang buong kampo” o “ang buong hukbong sandatahan”; dito, ang tinutukoy ay ang buong puwersang lumalaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: ginulo
  rationale: Ipinahihiwatig ng pandiwang Hebreo ang pagdudulot ng sindak, kalituhan, o pagkawatak-watak sa labanan. Ang “ginulo” ay natural sa Filipino at hindi paunang nagpapasya na ganap nang nalipol ang hukbo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinakikita ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: הָרֶכֶב
  choice: ang lahat ng kanyang mga karwahe
  rationale: Maaaring tumukoy ang pangngalan sa mga karwahe bilang kabuuan o sa puwersang gumagamit ng mga ito. Malinaw at natural sa konteksto ang “kanyang mga karwahe.”
- source_word: הַמַּחֲנֶה
  choice: ang buo niyang hukbo
  rationale: Bagaman pangunahing maaaring mangahulugang “kampo,” sa salaysay ng labanan tumutukoy ito sa buong puwersang militar.
- source_word: לְפִי חֶרֶב
  choice: sa pamamagitan ng tabak
  rationale: Isinasalin ang idyomang tumutukoy sa pagkatalo o pagpatay gamit ang tabak, habang inilalagay sa talababa ang literal na larawan ng “bibig/talim ng tabak.”
- source_word: לִפְנֵי בָרָק
  choice: sa harap ni Barak
  rationale: Pinananatili ang spatial at militar na diwa ng pangyayaring naganap habang humaharap o sumusulong si Barak.
- source_word: וַיֵּרֶד ... מֵעַל הַמֶּרְכָּבָה
  choice: bumaba ... mula sa kanyang karwahe
  rationale: Natural na Filipino ito para sa pagbaba ni Sisera mula sa sasakyan; ang panghalip na “kanyang” ay malinaw sa konteksto.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: tumakas nang naglalakad
  rationale: Ipinakikita nito ang kaibahan ng pagtakas na walang karwahe, bagaman ang mabilis na pagtakbo ay hindi tahasang idinagdag.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON,” nang hindi nagdaragdag ng denominasyonal na interpretasyon.
- issue: Ang ahensiya ni Yahweh sa kinalabasan ng labanan
  choice: Tahasang si Yahweh ang nagdulot ng kaguluhan
  alternative: Ilarawan lamang na nagulo ang hukbo nang hindi binabanggit ang gumawa
  rationale: Tahasang causative at may simunong si Yahweh ang Hebreo, kaya pinananatili ang pahayag na siya ang kumilos, pati ang teolohikal na tensiyon ng banal na pagkilos sa gitna ng karahasan ng digmaan.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang payak na bokabularyong madaling maunawaan, habang pinanatili ang anyong pasalaysay at ang pagkakasunod-sunod ng mga kilos sa Hebreo. Ang mga panghalip na paari ay idinagdag kung natural at malinaw sa konteksto, hindi upang baguhin ang tinutukoy ng teksto.
