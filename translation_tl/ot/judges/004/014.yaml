  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: tl
  text: Sinabi ni Debora kay Barak, “Tumindig ka! Sapagkat ito ang araw kung kailan ibinigay ni Yahweh si Sisera sa iyong kamay.[a] Hindi ba’t nauna nang humayo si Yahweh sa harap mo?” Kaya bumaba si Barak mula sa Bundok Tabor, kasama ang sampung libong lalaking sumusunod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ipinaubaya ni Yahweh si Sisera sa iyong kapangyarihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: Tumindig ka!
  rationale: Naghahayag ang pautos ng agaran at matatag na pagkilos; marangal at malinaw ito sa modernong Tagalog.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: Sapagkat ito ang araw na
  rationale: Pinananatili ang diin sa demonstratibong “ito ang araw” at ang panghikayat na gamit ng כִּי.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: ibinigay ... sa iyong kamay
  rationale: Pinananatili ang Hebreong idyoma ng paglalagay sa kapangyarihan ng isang tao. Ang aspektong ganap ay maaaring magpahayag ng katiyakan ng ipinangakong tagumpay.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na banal na pangalang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
- source_word: הֲלֹא
  choice: Hindi ba’t
  rationale: Pinananatili ang retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: יָצָא לְפָנֶיךָ
  choice: nanguna na sa iyo
  rationale: Natural na Tagalog para sa paglabas o pag-una sa harap ng isang tao, habang pinananatili ang diwang si Yahweh ang nauuna sa pagkilos.
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Karaniwang salaysay na katumbas ng pagbaba mula sa isang bundok.
- source_word: מֵהַר תָּבוֹר
  choice: mula sa Bundok Tabor
  rationale: Natural na anyo ng pangalang heograpiko sa Tagalog.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: at sumunod sa kanya ang sampung libong lalaki
  rationale: Malinaw na ipinapahayag ang literal na bilang, ang panlalaking katawagan sa mga mandirigma, at ang paglakad nila sa likuran ni Barak.
theological_decisions:
- issue: Pagpapahayag ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang nasa pinagmulang Hebreo; pinananatili ng “Yahweh” ang pagkakaibang iyon sa isang pangkalahatang titulo.
- issue: Ganap na anyo ng נָתַן para sa tagumpay na magsisimula pa lamang
  choice: ibinigay
  alternative: ibibigay
  rationale: Pinananatili ang ganap na anyo at ang retorikal na katiyakan ng pahayag ni Debora, nang hindi ginagawang payak na panghinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na tanong, ang Hebreong idyoma na “sa iyong kamay,” at ang pangalang Yahweh. Inilipat ang talababa sa pariralang talagang may leksikal na alternatibo; walang suportang dahilan sa ibinigay na datos upang lagyan ng talababa ang Bundok Tabor.
