revisions:
- from: Sinabi ni Debora kay Barak, “Tumindig ka! Sapagkat ito ang araw na ibinigay ni Yahweh si Sisera sa iyong kamay.[a] Hindi ba’t nanguna na sa iyo si Yahweh?” Kaya bumaba si Barak mula sa Bundok Tabor, at sumunod sa kanya ang sampung libong lalaki.
  to: Sinabi ni Debora kay Barak, “Tumindig ka! Sapagkat ito ang araw kung kailan ibinigay ni Yahweh si Sisera sa iyong kamay.[a] Hindi ba’t nauna nang humayo si Yahweh sa harap mo?” Kaya bumaba si Barak mula sa Bundok Tabor, kasama ang sampung libong lalaking sumusunod sa kanya.
  rationale: Nilinaw ang kaugnayan ng “araw” sa ipinahayag na tagumpay, ibinalik ang imaheng si Yahweh ay humahayo sa harap ni Barak nang hindi nagdaragdag ng taktikal na kahulugan, at inayos ang huling sugnay upang malinaw na ang sampung libong lalaki ay sumusunod kay Barak. Napanatili ang banal na pangalang Yahweh, ang retorikal na tanong, ang katiyakan ng perpektong Hebreo, at ang idyomang “sa iyong kamay.”
