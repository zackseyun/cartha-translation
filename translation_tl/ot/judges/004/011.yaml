  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: tl
  text: Si Heber na Kenita ay humiwalay sa mga Kenita—sa mga anak ni Hobab, na biyenan[a] ni Moises—at itinayo ang kanyang tolda hanggang sa punong ensina sa Zaanannim,[b] na malapit sa Kedesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kamag-anak ni Moises sa pamamagitan ng pag-aasawa”; mas malawak ang kahulugan ng salitang Hebreo kaysa sa “biyenan.”
    reason: alternative_reading
  - marker: b
    text: Maaari ring “punong terebinto sa Zaanannim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: humiwalay
  rationale: Ang Niphal ng פרד ay nagsasaad ng paghiwalay o pagkalas mula sa isang pangkat. Ang “humiwalay” ay natural sa Filipino at angkop sa impormasyong nagsisilbing kaligiran ng salaysay.
- source_word: הַקֵּינִי / מִקַּיִן
  choice: Kenita / sa mga Kenita
  rationale: Sa kontekstong ito, ang dalawang anyo ay tumutukoy sa pangkat-etnikong Kenita, hindi sa taong si Cain. Ginawang tahasang maramihan ang ikalawang gamit upang luminaw na ang tinutukoy ay ang angkan.
- source_word: מִבְּנֵי חֹבָב
  choice: mula sa mga anak ni Hobab
  rationale: Pinananatili nito ang literal na anyong “mga anak,” na maaari ring tumukoy sa mga inapo o angkan ni Hobab.
- source_word: חֹתֵן מֹשֶׁה
  choice: biyenan ni Moises
  rationale: Karaniwang tumutukoy ang חֹתֵן sa kamag-anak sa pag-aasawa, at malamang na “biyenan” ang diwa rito. Inilagay sa talababa ang mas malawak na posibilidad.
- source_word: וַיֵּט אָהֳלוֹ
  choice: itinayo niya ang kanyang tolda
  rationale: Ang idyomang נטה אהל ay nangangahulugang magtayo o maglatag ng tolda. Ito ang natural na katumbas sa modernong Filipino.
- source_word: עַד
  choice: hanggang sa
  rationale: Ipinahihiwatig ng עַד ang abot ng pagkilos o kinalalagyan patungo sa isang pook.
- source_word: אֵלוֹן
  choice: punong ensina
  rationale: Maaaring tumukoy ang אֵלוֹן sa isang malaking puno, karaniwang ensina o terebinto. Ginamit sa teksto ang pamilyar na “ensina” at inilagay sa talababa ang alternatibo.
- source_word: בצענים
  choice: sa Zaananim
  rationale: Pangalan ito ng pook; tinumbasan ito sa paraang transliterasyon sa halip na bigyan ng di-tiyak na kahulugan.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: na nasa tabi ng Kedesh
  rationale: Natural na ipinahahayag nito sa Filipino ang malapit na lokatibong ugnayan sa Kedesh nang hindi ito ginagawang eksaktong kaparehong lugar.
theological_decisions:
- issue: Saklaw ng חֹתֵן bilang kaugnayan ni Hobab kay Moises
  choice: biyenan ni Moises
  alternative: kamag-anak ni Moises sa pamamagitan ng pag-aasawa
  rationale: Ang “biyenan” ang karaniwan at malamang na kahulugan sa tradisyong salaysay tungkol kina Hobab at Moises, ngunit maaaring mas malawak ang terminong Hebreo. Pinanatili sa talababa ang tunay na leksikal na kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Pinanatili ang “mga anak ni Hobab” upang makita ang anyo ng Hebreo, samantalang natural ang ayos ng buong pangungusap. Walang idinagdag na panimulang panandang gaya ng “Ngayon,” sapagkat walang tahasang katumbas nito sa pinagmulan.
