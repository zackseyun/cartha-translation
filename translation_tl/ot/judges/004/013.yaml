  text: וַ/יַּזְעֵ֨ק סִֽיסְרָ֜א אֶת כָּל רִכְבּ֗/וֹ תְּשַׁ֤ע מֵאוֹת֙ רֶ֣כֶב בַּרְזֶ֔ל וְ/אֶת כָּל הָ/עָ֖ם אֲשֶׁ֣ר אִתּ֑/וֹ מֵ/חֲרֹ֥שֶׁת הַגּוֹיִ֖ם אֶל נַ֥חַל קִישֽׁוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: tl
  text: Kaya tinipon ni Sisera ang lahat ng kanyang mga karwahe—siyamnaraang karwaheng bakal—at ang lahat ng taong kasama niya, mula sa Haroset-Hagoyim hanggang sa Ilog Kishon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Batis Kishon” o “lambak-ilog ng Kishon.” Ang Hebreong naḥal ay maaaring tumukoy sa isang ilog o batis, sa tuyong dinadaluyan nito, o sa lambak na dinadaluyan ng rumaragasang tubig kapag tag-ulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: tinipon
  rationale: Sa kontekstong militar at may tuwirang layon na mga karwahe at tauhan, ang pandiwa ay tumutukoy sa pagpapatawag at pagtitipon ng mga puwersa. Likas sa modernong Tagalog ang “tinipon.”
- source_word: רִכְבּוֹ
  choice: kanyang mga karwahe
  rationale: Maaaring kolektibong tumukoy ang רכב sa hukbo ng mga karwahe, ngunit nililinaw ng kasunod na pariralang “siyamnaraang karwaheng bakal” ang kongkretong kahulugan.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: siyamnaraang karwaheng bakal
  rationale: Tuwirang pinananatili ang bilang at paglalarawan. Hindi nito nilulutas kung ang mga karwahe ay yari sa bakal o nilagyan lamang ng mga bahaging bakal.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: ang lahat ng taong kasama niya
  rationale: Pinananatili ng “mga taong” ang literal na saklaw ng עָם, habang ipinahihiwatig ng konteksto na sila ang kanyang puwersang militar.
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: mula sa Haroset-Hagoyim
  rationale: Itinuring itong pangalan ng lugar at isinalin sa transliterasyong madaling basahin sa Filipino; malinaw na isinalin ang pang-ukol na מִן bilang “mula sa.”
- source_word: נַחַל קִישׁוֹן
  choice: Ilog Kishon
  rationale: Ang “Ilog Kishon” ang natural at madaling maunawaang heograpikong katawagan sa Filipino, habang inilalahad sa talababa ang mas malawak na kahulugan ng נַחַל.
