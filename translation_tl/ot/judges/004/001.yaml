  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: tl
  text: Muling ginawa ng mga anak ni Israel[a] ang masama sa paningin ni Yahweh pagkamatay ni Ehud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Israelita.” Sa Hebreo, “mga anak ni Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: Muling ginawa
  rationale: Ang יסף na sinusundan ng pawatas ay nagsasaad dito ng pag-uulit; natural sa Tagalog ang “muling ginawa” at angkop ito sa paulit-ulit na siklo sa Mga Hukom.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang anyong Hebreo at ang kolektibong katawagan sa sambayanan; inilagay sa talababa ang mas karaniwang “mga Israelita.”
- source_word: הָרַע
  choice: ang masama
  rationale: Ang pang-uri na may pantukoy ay ginagamit bilang pangngalan; malinaw at natural sa Tagalog ang “ang masama.”
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang metaporang Hebreo na “sa mga mata/paningin” sa isang likas na pariralang Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng titulong “Panginoon.”
- source_word: וְאֵהוּד מֵת
  choice: pagkamatay ni Ehud
  rationale: Sa konteksto, ang sugnay ay nagbibigay ng panahong pinangyarihan ng muling pagkakasala ng Israel. Ang “pagkamatay ni Ehud” ay maikli at natural, bagaman literal na may pangatnig ang Hebreo.
theological_decisions:
- issue: Paglalarawan sa ginawa ng Israel bilang הָרַע בְּעֵינֵי יְהוָה
  choice: ang masama sa paningin ni Yahweh
  alternative: ang masama sa harap ni Yahweh
  rationale: Pinananatili ang moral na paghatol at ang metapora ng Hebreo nang hindi dinaragdagan o pinapaliit ang kahulugan.
- issue: Paglalapat ng pangalang יְהוָה
  choice: Yahweh
  alternative: Panginoon
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang “Yahweh” ang tuwirang kumakatawan rito.
- issue: Kolektibong katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang literal na larawang pampamilya ng Hebreo, habang ibinibigay sa talababa ang natural na kolektibong katumbas.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pormulang “sa paningin ni Yahweh” at ang tradisyonal ngunit nauunawaang “mga anak ni Israel,” na may mas natural na alternatibo sa talababa.
