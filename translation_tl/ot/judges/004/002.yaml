  naturalness: Sa pangkalahatan ay malinaw at makabago ang Filipino. Gayunman, ang “Jabin, na hari ng Canaan at naghahari sa Hazor” ay bahagyang masikip at maaaring magmukhang pinagdudugtong lamang ang dalawang paglalarawan. Mas natural ang paglalagay ng “hari ng Canaan” bilang apozisyon at ng “na naghahari sa Hazor” bilang malinaw na sugnay na panuring.
  terminology: Ang “Yahweh,” “ipinagbili,” “sa kamay ni,” “hari,” “pinuno ng hukbo,” at mga pangalang Jabin, Sisera, Hazor, at Haroset-hagoyim ay angkop. Inilipat ang talababa a sa mismong idyomang ipinaliliwanag nito upang maging wastong nakatali ang anchor sa teksto.
