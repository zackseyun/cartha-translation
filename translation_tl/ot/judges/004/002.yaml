  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: tl
  text: Kaya ipinagbili sila ni Yahweh sa kamay ni Jabin[a], hari ng Canaan, na naghahari sa Hazor. Ang pinuno ng kanyang hukbo ay si Sisera, na naninirahan sa Haroset-hagoyim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ipinagbili sila sa kamay ni”—isang idyoma ng hatol sa tipan na nangangahulugang ibinigay sila sa kapangyarihan ni Jabin.
    reason: lexical_alternative
  - marker: b
    text: Ang Haroset-hagoyim ay malamang na nangangahulugang “Haroset ng mga bansa.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: ipinagbili sila
  rationale: Pinananatili ang literal at matinding talinghaga ng מָכַר, na sa Mga Hukom ay tumutukoy sa pagbibigay sa Israel sa kapangyarihan ng maniniil bilang hatol.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang יהוה, sa halip na palitan ito ng isang titulo.
- source_word: בְּיַד
  choice: sa kamay ni
  rationale: Pinananatili ang larawang Hebreo ng pagkakalagay sa kamay o kapangyarihan ng isang tao; likas din itong maunawaan sa Filipino sa kontekstong ito.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Jabin, na hari ng Canaan
  rationale: Malinaw at natural na inilalahad ang pangalan at katungkulan nang hindi nagdaragdag ng kahulugang wala sa Hebreo.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: at naghahari sa Hazor
  rationale: Ang מָלַךְ ay partikular na nangangahulugang maghari o maging hari; ang aspektong imperpektibo ng Filipino ay angkop sa salaysay.
- source_word: וְשַׂר צְבָאוֹ
  choice: Ang pinuno ng hukbo niya ay
  rationale: Ang שַׂר kasama ng צָבָא ay tumutukoy sa punong militar; malinaw at kasalukuyang Filipino ang 'pinuno ng hukbo.'
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Karaniwang transliterasyon ng pangalang pantangi.
- source_word: וְהוּא יוֹשֵׁב
  choice: na naninirahan
  rationale: Natural na salin ng participial na anyo at pinananatili ang pinakalikás na pagtukoy ng panghalip kay Sisera.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: sa Haroset-hagoyim
  rationale: Itinuturing itong pangalan ng lugar at tinutumbasan sa baybay na madaling basahin sa Filipino; ipinapaliwanag sa talababa ang literal na ikalawang bahagi.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagsupil sa Israel
  choice: Tuwirang sinasabing ipinagbili sila ni Yahweh sa kamay ni Jabin.
  alternative: Pinahintulutan lamang ni Yahweh na mapasailalim sila sa kapangyarihan ni Jabin.
  rationale: Aktibong iniuukol ng pandiwang Hebreo kay Yahweh ang pagkilos bilang hatol; hindi ito dapat pahinain at gawing pahintulot lamang.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matinding talinghagang 'ipinagbili' at ang idyomang 'sa kamay,' habang hinati sa dalawang pangungusap ang mahaba at magkakaugnay na sugnay upang maging natural sa Tagalog.
