  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: tl
  text: Karaniwan siyang nakaupo sa ilalim ng puno ng palma ni Debora, sa pagitan ng Rama at Bethel, sa kaburulan ng Efraim; at ang mga anak ni Israel[a] ay umaakyat sa kaniya upang magpahatol.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga Israelita.” Literal na mababasa sa Hebreo ang “mga anak ni Israel,” isang karaniwang katawagan sa buong bayan ng Israel.
    reason: lexical_alternative
  - marker: b
    text: O “upang humingi ng katarungan” o “upang humingi ng legal na pasiya.” Maaaring tumukoy ang salitang Hebreo sa paghatol sa isang usapin o sa pangangasiwa ng katarungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: Karaniwan siyang nakaupo
  rationale: Ang participle sa konteksto ay naglalarawan sa nakagawiang pag-upo ni Debora sa lugar na pinagdarausan niya ng paghatol, hindi lamang sa isang pangyayaring naganap minsan.
- source_word: תַּחַת תֹּמֶר דְּבוֹרָה
  choice: sa ilalim ng puno ng palma ni Debora
  rationale: Pinananatili nito ang lokasyon sa ilalim ng puno at ang ugnayang ipinahahayag ng pariralang Hebreo. Idinagdag ang “puno” upang malinaw na hindi palad ng kamay ang tinutukoy ng “palma.”
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: sa pagitan ng Rama at Bethel
  rationale: Ginamit ang karaniwang anyo ng mga pangalan ng lugar at pinanatili ang eksaktong heograpikong ugnayan.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Ang singular na הַר ay maaaring tumukoy sa isang bulubundukin o mataas na rehiyon; natural na ipinahahayag ito ng “kaburulan” sa Filipino.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: umaahon sa kanya
  rationale: Pinananatili ang kilos na ‘umahon,’ na maaaring may topograpikong diwa dahil nasa kaburulan ang kinaroroonan ni Debora.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang pormal na Hebreong katawagang pangkabuuan para sa bayang Israel, habang nililinaw sa talababa na hindi lamang mga lalaking anak ang tinutukoy.
- source_word: לַמִּשְׁפָּט
  choice: upang magpahatol
  rationale: Natural itong Filipino para sa paglapit sa isang hukom upang humingi ng pasiya, habang pinananatili ang hudisyal na diwa ng מִשְׁפָּט.
theological_decisions:
- issue: Ang panlalaking pangkabuuang katawagang בְּנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili sa pangunahing teksto ang anyo ng Hebreong idyoma at ang tipanang katawagan sa buong bayan, nang hindi ipinahihiwatig na mga lalaki lamang ang tinutukoy; ibinibigay sa talababa ang mas natural na katumbas.
- issue: Saklaw ng מִשְׁפָּט
  choice: upang magpahatol
  alternative: upang humingi ng katarungan o legal na pasiya
  rationale: Hindi nililimitahan ang salita sa abstraktong katarungan lamang o sa isang partikular na uri ng usaping legal; ipinahahayag nito ang paghingi ng hudisyal na pasiya.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Ang “karaniwan siyang nakaupo” ay malinaw na naghahayag ng nakagawiang gawain; ang “kaburulan” at “umaahon” ay nagpapanatili sa heograpikong larawan. Inilagay ang mga pananda ng talababa sa mismong mga pariralang tinatalakay ng mga ito.
