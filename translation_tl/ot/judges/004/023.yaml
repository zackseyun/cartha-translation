  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: tl
  text: Kaya, noong araw na iyon, pinasuko ng Diyos si Jabin na hari ng Canaan sa harap ng mga anak ni Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “mga Israelita.” Literal sa Hebreo: “mga anak ni Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: pinasuko
  rationale: Ang Hiphil na anyo ng כנע ay nagpapahayag na pinangyari ng Diyos na mapailalim o matalo si Jabin. Likas sa makabagong Tagalog ang “pinasuko” sa konteksto ng pagkatalong militar at pampolitika.
- source_word: אֱלֹהִים
  choice: Diyos
  rationale: Tumutukoy ito sa Diyos ng Israel bilang tuwirang gumagawa sa kasaysayan.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na salin ito ng panandang pamanahon at pinananatili ang pagtukoy sa mismong araw ng pangyayari.
- source_word: אֵת יָבִין
  choice: si Jabin
  rationale: Ang אֵת ay pananda ng tuwirang layon; ginagamit ang “si” sa Tagalog para sa pangalang pantangi ng tao.
- source_word: מֶלֶךְ כְּנָעַן
  choice: hari ng Canaan
  rationale: Tuwirang inilalarawan ng construct chain si Jabin bilang hari ng Canaan.
- source_word: לִפְנֵי
  choice: sa harap ng
  rationale: Pinananatili nito ang relasyonal na larawan ng Hebreo—si Jabin ay pinasuko sa harap ng, o kaugnay ng pagkilos laban sa, bayan ng Israel—nang hindi labis na nililinaw ang posibleng diwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili nito ang literal na larawang “mga anak ni Israel,” habang natural at nauunawaan sa Tagalog; maaaring tumukoy ang parirala sa sambayanang Israel.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagkatalo ni Jabin
  choice: Ang Diyos ang tuwirang simuno na nagpasuko kay Jabin.
  alternative: Iharap lamang ang pangyayari bilang tagumpay militar ng Israel.
  rationale: Malinaw na אֱלֹהִים ang simuno ng pandiwa sa Hebreo, kaya dapat panatilihin ang tuwirang pagkilos ng Diyos.
- issue: Ang katawagang pangtipan sa bayan ng Israel
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang konkretong ekspresyon ng Hebreo, samantalang ibinibigay sa talababa ang mas karaniwang katumbas na tumutukoy sa buong bayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “pinasuko” upang ihatid ang pagkatalo at pagpapailalim sa kontekstong militar; pinanatili ang “sa harap ng” at “mga anak ni Israel” upang hindi burahin ang larawan at bahagyang lawak ng kahulugan sa Hebreo.
