base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: tl
  text: At dadalhin ko sa iyo sa Batis ng Kison[a] si Sisera, ang pinuno ng hukbo ni Jabin, kasama ang kanyang mga karwahe at ang kanyang karamihan[b]; at ibibigay ko siya sa iyong kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Ilog Kison” o “Libis ng Kison.” Ang salitang Hebreo ay maaaring tumukoy sa batis, sa tuyong higaan ng batis, o sa libis na dinadaluyan ng rumaragasang tubig.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “lahat ng kanyang mga kawal” o “kanyang hukbo.” Literal itong tumutukoy sa “kanyang karamihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: dadalhin ko
  rationale: Sa konteksto, ipinahihiwatig ng pandiwa ang pagpapalapit o pag-akay kay Sisera sa itinakdang lugar. Natural sa modernong Tagalog ang “dadalhin ko” at hindi nito idinaragdag ang motibong ipinahihiwatig ng “aakitin” o “lilinlangin.”
- source_word: אֵלֶיךָ
  choice: sa iyo
  rationale: Ipinapahayag ng parirala ang pagkilos patungo kay Barak; tuwiran at natural ang “sa iyo.”
- source_word: אֶל נַחַל קִישׁוֹן
  choice: sa Batis ng Kison
  rationale: Ang נחל ay maaaring tumukoy sa batis, ilog, o libis na dinadaluyan ng rumaragasang tubig. Ang “Batis ng Kison” ay malinaw at likas sa Tagalog, habang pinananatili sa talababa ang lawak ng terminong Hebreo.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Karaniwang anyo ng pangalang pantangi sa Tagalog na tradisyong biblikal.
- source_word: שַׂר צְבָא יָבִין
  choice: ang pinuno ng hukbo ni Jabin
  rationale: Ang שׂר צבא ay isang pinunong militar; malinaw at makabago ang “pinuno ng hukbo.”
- source_word: רִכְבּוֹ
  choice: kanyang mga karwahe
  rationale: Bagaman maaaring kolektibong tumukoy sa puwersang nakakarwahe, tuwiran at madaling maunawaan ang “mga karwahe” sa kontekstong militar.
- source_word: הֲמוֹנוֹ
  choice: kanyang buong karamihan
  rationale: Malawak ang kahulugan ng המון—karamihan, pulutong, o malaking pangkat. Pinananatili ng “buong karamihan” ang di-teknikal na lawak nito sa halip na agad itong gawing “hukbo.”
- source_word: וּנְתַתִּיהוּ בְּיָדֶךָ
  choice: ibibigay ko siya sa iyong kamay
  rationale: Pinananatili nito ang karaniwang idyomang Hebreo na nangangahulugang ipasailalim ang isang tao sa kapangyarihan ng iba.
