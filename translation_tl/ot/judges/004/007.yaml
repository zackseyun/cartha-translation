translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang idyomang “sa iyong kamay” at ang malawak na diwa ng המון; ginamit ang “Batis ng Kison” bilang pangunahing heograpikong katawagan, na may mga alternatibo sa talababa.
