source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: tl
  text: Pagkatapos, kumuha si Jael, na asawa ni Heber, ng tulos ng tolda at humawak ng martilyo. Tahimik siyang lumapit kay Sisera at ibinaon ang tulos sa sentido niya, at bumaon ito sa lupa.[a] Mahimbing ang tulog ni Sisera at pagod na pagod siya, at namatay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, pambabae ang anyo ng pandiwang “bumaon,” kaya pinakamalamang na ang tinutukoy ay ang tulos. Maaari ring isalin: “at lumubog ito sa lupa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: tulos ng tolda / ang tulos
  rationale: Tumutukoy ito sa tulos na ginagamit upang ipirmi ang tolda. Ang “tulos ng tolda” ay malinaw at likas sa modernong Filipino.
- source_word: הַמַּקֶּבֶת
  choice: martilyo
  rationale: Ito ang kasangkapang pamukpok na ginamit sa tulos; “martilyo” ang pinakapamilyar at sapat na tiyak na katawagan.
- source_word: בְּיָדָהּ
  choice: hinawakan
  rationale: Sa Filipino, natural na ipinahahayag ang paglalagay ng martilyo sa kamay bilang “hinawakan,” nang hindi binabago ang kilos.
- source_word: בַּלָּאט
  choice: tahimik
  rationale: Inilalarawan nito ang di-maingay at di-kapansin-pansing paglapit; iniiwasan ng “tahimik” ang labis na pagbibigay-diin sa lihim na motibo.
- source_word: וַתִּתְקַע
  choice: ibinaon
  rationale: Sa konteksto ng tulos at martilyo, ipinahihiwatig ng pandiwa ang puwersahang pagpapasok o pagbaon ng tulos.
- source_word: בְּרַקָּתוֹ
  choice: sa sentido nito
  rationale: Ang רַקָּה ay sentido o gilid ng ulo. Hindi ipinapalagay ng salin na ganap itong tumagos, bagaman posible iyon sa tagpo.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: at bumaon iyon sa lupa
  rationale: Ang pambabaeng anyo ng pandiwa ay pinakamalamang na tumutukoy sa tulos. Pinananatili ng “at” ang sunod-sunod na salaysay sa Hebreo.
- source_word: נִרְדָּם
  choice: mahimbing ... ang tulog
  rationale: Ipinahahayag nito ang kalagayang natutulog nang mahimbing at natural ang parirala sa Filipino.
- source_word: וַיָּעַף
  choice: dahil sa matinding pagod
  rationale: Ang pandiwa ay nagsasaad na siya ay pagod o nanghihina. Isinama ito sa natural na pangungusap nang pinananatili ang kaniyang kalagayan.
- source_word: וַיָּמֹת
  choice: at namatay siya
  rationale: Pinananatili ang payak at mariing pagtatapos ng salaysay.
- source_word: אֵשֶׁת חֶבֶר
  choice: na asawa ni Heber
  rationale: Natural na appositive sa Filipino at tapat sa pagkakakilanlan kay Jael bilang asawa ni Heber.
