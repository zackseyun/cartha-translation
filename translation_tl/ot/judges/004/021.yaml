  to: Pagkatapos, kumuha si Jael, na asawa ni Heber, ng tulos ng tolda at humawak ng martilyo. Tahimik siyang lumapit kay Sisera at ibinaon ang tulos sa sentido niya, at bumaon ito sa lupa.[a] Mahimbing ang tulog ni Sisera at pagod na pagod siya, at namatay siya.
  rationale: Inalis ang idinagdag na sanhi sa paglalarawan ng pagtulog at pagod ni Sisera, at pinakinis ang mga panghalip at pandiwang Filipino. Napanatili ang sunod-sunod na pagkilos sa Hebreo at ang malamang na pagtukoy ng pandiwang pambabae sa tulos.
