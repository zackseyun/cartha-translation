base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: tl
  text: Pagkatapos, ipinatawag ni Barak ang Zebulun at Neftali sa Kedesh, at sampung libong lalaki ang umahon na sumusunod sa kanya.[a] Umahon din si Debora kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “sa kanyang mga paa,” isang idyomang nangangahulugang sumunod sila sa kanya o pumaroon sa ilalim ng kanyang pamumuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: tinipon
  rationale: Sa Hiphil, tumutukoy ang pandiwa sa pagtawag upang magtipon. Sa kontekstong militar, natural na ipinahahayag ng “tinipon” ang pagpapatawag ni Barak sa dalawang lipi nang hindi ipinapalagay ang isang pormal na sistema ng sapilitang pangangalap.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: ang Zebulun at Neftali
  rationale: Mga pangalan ito ng mga liping ipinatawag ni Barak. Ginamit ang karaniwang anyong Filipino ng mga pangalang biblikal.
- source_word: קֶדְשָׁה
  choice: sa Kedesh
  rationale: Ipinahihiwatig ng directional he ang patungong kilos. Sa Filipino, natural na maaaring ipahayag ng “sa Kedesh” ang destinasyon ayon sa konteksto.
- source_word: וַיַּעַל
  choice: umahon
  rationale: Pinananatili ng “umahon” ang batayang diwa ng עלה na pag-akyat o pagpunta paitaas, at ang pag-uulit nito sa huling sugnay.
- source_word: בְּרַגְלָיו
  choice: na sumusunod sa kanya
  rationale: Literal itong “sa kanyang mga paa,” ngunit sa kontekstong ito ay idyoma para sa pagsama o pagsunod sa pamumuno ni Barak. Inilagay sa talababa ang literal na anyo.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: sampung libong lalaki
  rationale: Tuwirang ipinahahayag nito ang bilang at ang panlalaking katawagan sa puwersang militar.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: Umahon din si Debora kasama niya
  rationale: Pinananatili nito ang kilos na עלה at malinaw na sinasabing sumama si Debora kay Barak.
