  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: tl
  text: At patuloy na tumindi ang kapangyarihan[a] ng mga anak ni Israel laban kay Jabin na hari ng Canaan, hanggang sa pinuksa nila si Jabin na hari ng Canaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “kamay”; dito ay tumutukoy sa kapangyarihan o puwersa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: patuloy na tumindi ang kapangyarihan
  rationale: Literal na “lumakad/nagpatuloy ang kamay.” Ang “kamay” ay idyoma para sa kapangyarihan o lakas; ipinahahayag ng salin ang patuloy na pag-igting nito sa natural na Tagalog habang inilalagay sa talababa ang kongkretong larawan ng Hebreo.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Malapit itong sumusunod sa literal na “mga anak na lalaki ni Israel,” ngunit ang “mga anak” ay mas natural sa Tagalog at tumutukoy sa sambayanan o mga inapo ni Israel.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: patuloy na tumindi
  rationale: Ang pinagsamang pawatas na ganap at anyong nangangahulugang “maging matindi/mabigat” ay nagpapakita ng tuloy-tuloy na paglala ng puwersang nakatuon laban kay Jabin.
- source_word: עַל
  choice: laban kay
  rationale: Sa konteksto ng labanan, malinaw nitong ipinahahayag ang salungat at mapanlabang ugnayan.
- source_word: הִכְרִיתוּ
  choice: tuluyan nilang nilipol
  rationale: Ang Hiphil ng כרת ay literal na “pinutol/inalis” at sa kontekstong ito ay nangangahulugang winakasan o nilipol nang lubusan. Ang “tuluyan” ay nagpapahayag ng tiyak na pagwawakas na ipinahihiwatig ng pandiwa.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang “mga anak ni Israel” at ang pag-uulit sa “Jabin na hari ng Canaan” upang maipakita ang anyo at diin ng Hebreo, habang isinalin nang idyomatiko ang “kamay” sa pangunahing teksto.
