base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Tumayo ka sa pasukan ng tolda. Kung may lalaking[a] dumating at magtanong sa iyo, ‘May lalaki ba rito?’ sabihin mong, ‘Wala.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalawang ulit ginamit sa Hebreo ang salitang “lalaki” (אִישׁ): “kung may lalaking dumating … May lalaki ba rito?” Maaari ring unawain nang mas pangkalahatan ang unang gamit bilang “sinuman,” ngunit pinananatili rito ang panlalaking salita ng pinagmulang teksto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: Tumayo ka
  rationale: Tuwirang pautos ang Qal imperative. Likas at malinaw sa modernong Tagalog ang “Tumayo ka” para sa pagpuwesto o pananatili sa itinurong lugar.
- source_word: פֶּתַח הָאֹהֶל
  choice: pasukan ng tolda
  rationale: Ang פֶּתַח ay bukana o pasukan. Ang “pasukan ng tolda” ay natural at hindi nagpapahiwatig ng matigas na pinto.
- source_word: וְהָיָה אִם
  choice: Kung
  rationale: Naghaharap ang parirala ng isang kondisyon. Sapat at natural sa Tagalog ang “Kung,” samantalang hindi kailangang kopyahin ang Hebreong idyomang “at mangyayari.”
- source_word: אִישׁ
  choice: lalaki
  rationale: Ang אִישׁ ay “lalaki” at dalawang ulit itong lumilitaw sa Hebreo. Pinanatili ang panlalaking pagtukoy sa kondisyon at sa mismong tanong.
- source_word: יָבוֹא
  choice: dumating
  rationale: Ang בוא ay karaniwang “pumarito/dumating.” Sa tagpong may taong lalapit sa tolda, natural ang “dumating.”
- source_word: וּשְׁאֵלֵךְ
  choice: magtanong sa iyo
  rationale: Ang שׁאל sa kontekstong ito ay magtanong o magsiyasat. Malinaw at karaniwan ang “magtanong sa iyo.”
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: May lalaki ba rito?
  rationale: Ang tanong ay tungkol sa presensiya ng isang lalaki; ang “May … ba rito?” ang tuwiran at likas na katumbas sa Tagalog.
- source_word: אָיִן
  choice: Wala
  rationale: Maikli at tahasan ang sagot sa Hebreo. Pinananatili ng “Wala” ang ikli at tumutugon ito nang natural sa tanong na “May … ba?”
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang maikling utos at sagot, pati ang pag-uulit ng “lalaki” sa Hebreo. Ginamit ang “sa kanya” sapagkat walang kasariang gramatikal ang panghalip sa Tagalog; malinaw sa konteksto na babae ang kausap.
