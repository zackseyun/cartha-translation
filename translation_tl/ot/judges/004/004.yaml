id: JDG.4.4
reference: Judges 4:4
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/דְבוֹרָה֙ אִשָּׁ֣ה נְבִיאָ֔ה אֵ֖שֶׁת לַפִּיד֑וֹת הִ֛יא שֹׁפְטָ֥ה אֶת יִשְׂרָאֵ֖ל בָּ/עֵ֥ת הַ/הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: tl
  text: Si Debora—isang babae, isang propeta, at asawa ni Lapidot—ang humahatol sa Israel nang panahong iyon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: isang babae, isang propeta
  rationale: Pinananatili ang dalawang tahasang paglalarawan sa Hebreo—na si Debora ay babae at propeta—sa halip na alisin ang אִשָּׁה o ipakahulugan lamang ito bilang panandang kasarian.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: asawa ni Lapidot
  rationale: Ang karaniwang kahulugan ng אֵשֶׁת ay “asawa ni,” at pinanatili bilang pangalang pantangi ang לַפִּידוֹת.
- source_word: שֹׁפְטָה
  choice: humahatol
  rationale: Ang pandiwaring Hebreo ay nagsasaad ng nagpapatuloy o nakagawiang gawain ni Debora bilang tagahatol; natural itong ipinahahayag sa Filipino sa aspektong imperpektibo.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Tuwirang temporal na parirala na natural at malinaw sa modernong Filipino.
theological_decisions:
- issue: Paglalarawan kay Debora bilang babae at propeta
  choice: Tahasan at magkahiwalay na pinanatili ang “isang babae” at “isang propeta.”
  alternative: “isang babaeng propeta”
  rationale: Bagaman natural din ang alternatibo, mas malinaw na sinasalamin ng piniling anyo ang magkahanay na אִשָּׁה at נְבִיאָה at iniiwasang burahin ang tahasang salitang “babae” sa pinagmulan.
- issue: Gawain ni Debora sa Israel
  choice: “humahatol sa Israel”
  alternative: “naglilingkod bilang hukom ng Israel”
  rationale: Pinananatili ng “humahatol” ang pandiwang anyo at hindi nagdaragdag ng pormal na katawagang maaaring higitan ang tahasang sinasabi ng teksto.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang mga gitling na em dash upang maging natural ang magkakasunod na appositive habang pinananatili ang diin ng Hebreo. Walang idinagdag na panandang gaya ng “Ngayon,” sapagkat ang וּ־ rito ay panandang pandiskurso at hindi tahasang salitang temporal.
