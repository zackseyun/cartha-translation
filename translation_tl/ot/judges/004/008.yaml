  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: tl
  text: Sinabi ni Barak sa kanya, “Kung sasama ka sa akin, pupunta ako; ngunit kung hindi ka sasama sa akin, hindi ako pupunta.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Sinabi ... sa kanya
  rationale: Likas na salaysay sa modernong Tagalog para sa wayyiqtol ng אמר na may אֶל at hulaping 3fs; si Debora ang tinutukoy ng “kanya” ayon sa konteksto.
- source_word: בָּרָק
  choice: Barak
  rationale: Isinalin sa karaniwang anyong pangalan sa Tagalog sa pamamagitan ng transliterasyon.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: Kung sasama ka sa akin
  rationale: Bagaman literal na “kung pupunta ka kasama ko,” ang “sasama ka sa akin” ang natural at tumpak na pagpapahayag ng pagpunta nang magkasama sa Tagalog; ang pandiwa ay 2fs at tumutukoy kay Debora.
- source_word: וְהָלָכְתִּי
  choice: pupunta ako
  rationale: Ang perfect na kasunod ng kondisyon ay gumaganap bilang resulta; malinaw itong ipinahahayag ng panghinaharap na “pupunta ako.”
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: ngunit kung hindi ka sasama sa akin
  rationale: Ipinakikita ng “ngunit” ang tahasang pagsalungat ng ikalawang kondisyon, samantalang pinananatili ng “kung” ang kondisyunal na estruktura.
- source_word: לֹא אֵלֵךְ
  choice: hindi ako pupunta
  rationale: Direkta at natural na salin ng negated Qal imperfect 1cs, na nagpapahayag ng pagtanggi ni Barak sa ilalim ng negatibong kondisyon.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at natural. Ginamit ang “sasama” upang idiomatikong ipahayag ang הלך עם nang hindi binabago ang diwa ng pisikal na pagpunta kasama ni Barak.
