  text: וּ/בָרָ֗ק רָדַ֞ף אַחֲרֵ֤י הָ/רֶ֨כֶב֙ וְ/אַחֲרֵ֣י הַֽ/מַּחֲנֶ֔ה עַ֖ד חֲרֹ֣שֶׁת הַגּוֹיִ֑ם וַ/יִּפֹּ֞ל כָּל מַחֲנֵ֤ה סִֽיסְרָא֙ לְ/פִי חֶ֔רֶב לֹ֥א נִשְׁאַ֖ר עַד אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: tl
  text: Hinabol ni Barak ang mga karwahe[a] at ang hukbo hanggang sa Haroset ng mga bansa[b]. Nabuwal sa talim ng tabak ang buong hukbo ni Sisera; walang natira kahit isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hukbong may mga karwahe,” kung kolektibong terminong militar ang “mga karwahe.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Haroset ng mga bansa”; ayon sa tradisyon, “Haroset-hagoyim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: hinabol
  rationale: Natural na pandiwang Filipino para sa aktibong pagtugis sa kalaban sa gitna ng labanan.
- source_word: הָרֶכֶב
  choice: mga karwahe
  rationale: Pinananatili ang konkretong larawan ng tekstong Hebreo, bagaman maaari itong tumukoy nang kolektibo sa hukbong gumagamit ng mga karwahe.
- source_word: הַמַּחֲנֶה
  choice: hukbo
  rationale: Sa konteksto ng labanan, ang tinutukoy ay ang puwersang militar, hindi lamang ang kampo nito.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: hanggang sa Haroset ng mga bansa
  rationale: Ipinakikita ng “hanggang sa” ang lawak ng pagtugis; isinalin ang kasunod na elementong nangangahulugang “ng mga bansa” sa halip na lubusang isama ito sa transliteradong pangalan.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Nabuwal ... ang buong hukbo ni Sisera
  rationale: Pinananatili ng “nabuwal” ang idyomang Hebreo para sa pagkamatay o pagkatalo sa labanan, at malinaw na kolektibo ang “buong hukbo.”
- source_word: לְפִי חֶרֶב
  choice: sa talim ng tabak
  rationale: Natural at marangal na katumbas sa Filipino na nagpapanatili sa larawan ng idyomang Hebreo.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: walang natira kahit isa
  rationale: Natural na Filipino na nagpapanatili sa mariing ganap na pagkalipol ng hukbo.
theological_decisions: []
