  register: Gumamit ng makabago ngunit marangal at madaling maunawaang Filipino. Pinanatili ang konkretong imahen ng “mga karwahe,” “nabuwal,” at “talim ng tabak,” habang isinalin ang מַחֲנֶה ayon sa kontekstong militar bilang “hukbo.”
