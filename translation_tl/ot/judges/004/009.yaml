  edition: WLC
  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: tl
  text: Sinabi niya, “Tiyak na sasama ako sa iyo. Gayunman, hindi magiging iyo ang karangalan sa landas na tinatahak mo, sapagkat ipagbibili ni Yahweh si Sisera sa isang babae[a].” Pagkatapos, tumindig si Debora at sumama kay Barak papuntang Kedesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na, “sa kamay ng isang babae.” Ibig sabihin, ibibigay ni Yahweh si Sisera sa kapangyarihan ng isang babae.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Tiyak na sasama ako
  rationale: Ang infinitive absolute na sinusundan ng imperfect ay nagbibigay-diin sa pandiwa. Ipinahahayag ng “tiyak” ang diin, at likas sa Tagalog ang “sasama” dahil tahasang sinundan ito ng עִמָּךְ, “sa iyo.”
- source_word: אֶפֶס
  choice: Gayunman
  rationale: Ipinakikilala ng kataga ang isang pasubali o limitasyon sa pagsang-ayon ni Debora.
- source_word: תִּפְאַרְתְּךָ
  choice: hindi magiging iyo ang karangalan
  rationale: Maaaring tumukoy ang תִּפְאֶרֶת sa kaluwalhatian, dangal, o karangalan. Sa konteksto ng tagumpay sa digmaan, malinaw na tumutukoy ito sa karangalang matatamo o pagkilalang mapapasakamay ni Barak.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: sa landas na tinatahak mo
  rationale: Pinananatili nito ang larawan ng “daan” o “landas” sa Hebreo habang gumagamit ng likas at marangal na pananalitang Tagalog.
- source_word: יִמְכֹּר ... בְיַד אִשָּׁה
  choice: ipagbibili ... sa kamay ng isang babae
  rationale: Pinananatili ng salin ang karaniwang kahulugan ng מָכַר na “ipagbili” at ang Hebreong larawan ng pagkakaloob sa kamay o kapangyarihan ng iba. Nililinaw sa talababa ang mas idyomatikong kahulugan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַתָּקָם
  choice: tumindig
  rationale: Pinananatili ang kilos at pagkakasunod-sunod ng salaysay nang hindi ito nilalabuan bilang simpleng pag-alis.
- source_word: וַתֵּלֶךְ עִם בָּרָק קֶדְשָׁה
  choice: sumama kay Barak papuntang Kedesh
  rationale: Likas na ipinahahayag sa Tagalog ang pagpunta ni Debora na kasama si Barak at ang patutunguhang Kedesh.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Ang paraan ng pagkatalo ni Sisera
  choice: “ipagbibili ... sa kamay ng isang babae,” na may idyomatikong paliwanag sa talababa
  alternative: “ibibigay ... sa kapangyarihan ng isang babae” sa pangunahing teksto
  rationale: Pinananatili sa pangunahing teksto ang matinding talinghaga ng Hebreo nang hindi itinatago na ang kahulugan nito sa konteksto ay ang pagpapasailalim ni Sisera sa kapangyarihan ng isang babae.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang larawan ng “landas,” “ipagbibili,” at “sa kamay,” ngunit ginawang likas ang ayos ng pangungusap. Isinatitik ang mga pangalang Debora, Barak, Kedesh, Sisera, at Yahweh sa paraang madaling basahin ng karaniwang mambabasang Filipino.
