base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: tl
  text: Ngunit tumakas si Sisera nang naglalakad papunta sa tolda ni Jael[a], na asawa ni Heber na Kenita, sapagkat may kapayapaan sa pagitan ni Jabin na hari ng Hazor at ng sambahayan ni Heber na Kenita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “At tumakas si Sisera nang naglalakad.” Maaari ring isaling simpleng “at” ang pang-ugnay sa Hebreo; ipinakikita ng “ngunit” ang pagsalungat sa daloy ng salaysay.
    reason: alternative_reading
  - marker: b
    text: Ang “sambahayan ni Heber” ay maaaring tumukoy sa kaniyang pamilya o angkan.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: Ngunit tumakas si Sisera
  rationale: Maaaring simpleng “at” ang ו, ngunit ipinahihiwatig ng daloy ng salaysay ang pagsalungat sa pagkatalo ng hukbo at pag-iwan niya sa karwahe; natural itong ipinapahayag ng “ngunit” sa Tagalog.
- source_word: נָ֣ס
  choice: tumakas
  rationale: Tuwirang ipinapahayag ng pandiwang נס sa qal ang pagtakas o paglikas mula sa panganib.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: nang naglalakad
  rationale: Literal na “sa pamamagitan ng kaniyang mga paa”; ang “nang naglalakad” ay likas na Tagalog at nililinaw na hindi na siya sakay ng karwahe.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: papunta sa tolda ni Jael
  rationale: Tumpak at natural na katumbas ng pariralang tumutukoy sa destinasyon at pagmamay-ari ng tolda.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: na asawa ni Heber na Kenita
  rationale: Pinananatili ang pagkakakilanlan kay Jael bilang asawa ni Heber at ang etnikong katawagang Kenita.
- source_word: כִּ֣י
  choice: sapagkat
  rationale: Ipinakikilala rito ng כִּי ang dahilan kung bakit doon tumakas si Sisera; ang “sapagkat” ay malinaw at marangal sa salaysay.
- source_word: שָׁל֗וֹם
  choice: kapayapaan
  rationale: Pinananatili nito ang lawak ng שָׁלוֹם bilang mapayapang ugnayan nang hindi ipinapalagay na may pormal na kasunduan o alyansa.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: sa pagitan ni Jabin na hari ng Hazor at
  rationale: Tuwirang inililipat ang ugnayang “sa pagitan” at ang titulong nakakabit kay Jabin.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: sambahayan ni Heber na Kenita
  rationale: Ang בֵּית sa kontekstong panlipunan ay tumutukoy sa sambahayan o angkan, hindi lamang sa gusaling tinitirhan; “sambahayan” ang malinaw na modernong katumbas.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tolda” bilang karaniwang salin ng אֹהֶל, “nang naglalakad” para sa idyomatikong בְּרַגְלָיו, at “sambahayan” upang maipahayag ang panlipunang diwa ng בֵּית. Inilagay ang [b] pagkatapos ng buong parirala upang malinaw na tumutukoy ang paliwanag sa “sambahayan ni Heber.”
