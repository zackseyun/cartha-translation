base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: tl
  text: At sinabi niya, “Dumarating ang mga Filisteo laban sa iyo, Samson!” Nagising siya mula sa kanyang pagkakatulog at sinabi, “Lalabas ako gaya ng dati at magpapagpag ako.” Ngunit hindi niya alam na umalis na sa kanya si Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Narito na ang mga Filisteo para hulihin ka
  rationale: Ipinahahayag ng idyomang may עַל at mapanlabang simuno ang napipintong pagsalakay o pagdakip. Natural sa modernong Tagalog ang salin at angkop sa konteksto, nang hindi ipinapalagay na nakahawak na sila sa kanya.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: Nagising siya
  rationale: Likas at tuwirang Tagalog ito. Hindi na kailangang idagdag ang literal na “mula sa kanyang pagkakatulog,” sapagkat likas nang nakapaloob iyon sa “nagising.”
- source_word: אֵצֵא
  choice: Lalabas ako
  rationale: Pinananatili nito ang payak na kahulugan ng יצא at hindi dinaragdagan ng tahasang layuning makipaglaban, na ipinahihiwatig lamang ng konteksto.
- source_word: כְּפַעַם בְּפַעַם
  choice: gaya ng mga nakaraang pagkakataon
  rationale: Malinaw na ipinahahayag nito ang paulit-ulit na mga naunang pangyayari at ang palagay ni Samson na magiging tulad lamang ito ng dati.
- source_word: וְאִנָּעֵר
  choice: at kakawala
  rationale: Sa konteksto, ang Niphal ng נער ay tumutukoy sa pagpag o pagkalas ng sarili upang makalaya. Ang “kakawala” ay maikli, natural, at naghahatid ng ipinahihiwatig na resulta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: סָר מֵעָלָיו
  choice: lumayo na sa kanya
  rationale: Inihahatid nito ang pag-alis o paglayo ng presensiya ni Yahweh nang hindi ipinapaliwanag ang mekanismo o teolohikal na saklaw nito.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Kalikasan ng paglayo ni Yahweh kay Samson
  choice: lumayo na sa kanya si Yahweh
  alternative: wala na sa kanya ang kapangyarihang mula kay Yahweh
  rationale: Sinasabi ng talata na lumayo si Yahweh, ngunit hindi nito tahasang nililimitahan iyon sa nagbibigay-kapangyarihang presensiya, tipan, o pabor. Pinananatili ng salin ang teolohikal na tensiyon nang walang dagdag na paliwanag.
translation_notes:
  register: Modernong Filipino Tagalog na dignificado at madaling maunawaan. Ginamit ang “Narito na ... para hulihin ka” bilang natural na babala sa agarang panganib; pinanatili ang payak na “Lalabas ako” at ang solemne ngunit malinaw na “lumayo na sa kanya si Yahweh.”
