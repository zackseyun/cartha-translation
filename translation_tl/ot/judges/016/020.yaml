revisions:
- from: At sinabi niya, “Narito na ang mga Filisteo para hulihin ka, Samson!” Nagising siya at sinabi, “Lalabas ako gaya ng mga nakaraang pagkakataon at kakawala.” Ngunit hindi niya alam na lumayo na sa kanya si Yahweh.
  to: At sinabi niya, “Dumarating ang mga Filisteo laban sa iyo, Samson!” Nagising siya mula sa kanyang pagkakatulog at sinabi, “Lalabas ako gaya ng dati at magpapagpag ako.” Ngunit hindi niya alam na umalis na sa kanya si Yahweh.
  rationale: Inalis ang hindi tahasang layuning pagdakip upang mapanatili ang saklaw ng Hebreong babala. Binago ang panghuling bahagi ng sinabi ni Samson upang ilapit sa pandiwang ‘magpagpag ng sarili,’ at ibinigay sa talababa ang kontekstuwal na pakahulugang makakawala. Ginawang “umalis na” ang banal na pag-alis upang mas tuwirang tumbasan ang Hebreo nang hindi nilulutas ang teolohikal na ambigwidad.
