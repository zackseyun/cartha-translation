revisions:
- from: At nang araw-araw niya siyang ginigipit sa mga sinasabi niya at patuloy na pinipilit, halos ikamatay ni Samson ang matinding paghihirap ng kanyang kalooban.[a]
  to: At nang araw-araw niya siyang ginigipit sa kanyang mga salita at patuloy na pinipilit, sukdulang nabagabag ang kalooban ni Samson, na para bang ikamamatay niya ito.[a]
  rationale: Pinalitan ang makitid na “matinding paghihirap” ng “sukdulang nabagabag,” na mas malawak na sumasaklaw sa puwersa ng Hebreong idyoma. Ang “na para bang ikamamatay niya ito” ay nagpapanatili sa tindi ng לָמוּת nang hindi ipinahihiwatig na literal na muntik siyang mamatay o nais niyang magpakamatay. Inayos din ang talababa upang iwasan ang di-kinakailangang teolohikal na pagkakahon ng נפש bilang “kaluluwa.”
  reviewer_model: gpt-5.6-terra
