  source_fidelity: Ang “araw-araw,” “ginigipit,” at “patuloy na pinipilit” ay tapat na naghahatid ng patuloy at tumitinding pandiwang presyon sa Hebreo. Gayunman, ang “matinding paghihirap” ay masyadong ikinakahon ang idyoma sa pagdurusa at hindi sapat na pinananatili ang saklaw nitong pagkabagabag, pagkasawa, o pagkapagod. Ang “halos ikamatay” ay maaari ring magmungkahi ng literal na muntikang pagkamatay nang higit kaysa sa idyomatikong sukdulan ng Hebreo.
  naturalness: Likas ang estruktura ng pangungusap, ngunit mas malinaw at mas natural ang “sukdulang nabagabag ang kalooban” kaysa sa “halos ikamatay ... ang matinding paghihirap ng kanyang kalooban.”
  terminology: Ang “kalooban” ay angkop na di-teknikal na panghalili sa נפש sa kontekstong ito. Sa talababa, mas mainam ang “buhay” kaysa “kaluluwa” sa literal na larawan upang maiwasan ang di-kinakailangang makabagong teolohikal na pakahulugan sa נפש.
