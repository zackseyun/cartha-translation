translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang pangalang “Samson” sa huling sugnay upang maiwasan ang malabong sunod-sunod na panghalip. Iningatan ang tindi at bahagyang kalabuan ng idyomang Hebreo sa pangunahing teksto at talababa.
