  - severity: low
    issue: Ang “halos ikamatay” ay maaaring basahing literal na muntik na siyang mamatay.
    rationale: Ang לָמוּת ay bahagi ng isang idyoma ng sukdulang pagkapuno o pagkasuklam; kailangan ng pananalitang nagpapahiwatig ng tindi nang hindi nagtatakda ng literal na pisikal na panganib.
