  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: tl
  text: At nang araw-araw niya siyang ginigipit sa kanyang mga salita at patuloy na pinipilit, sukdulang nabagabag ang kalooban ni Samson, na para bang ikamamatay niya ito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal na Hebreo, “umikli ang kanyang buhay hanggang sa mamatay,” isang idyomang nagpapahayag ng sukdulang pagkabagabag, pagkainip, o pagkapagod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: At nang
  rationale: Likas na panandang pasalaysay sa modernong Tagalog na pinananatili ang paglipat at ugnayang temporal ng Hebreo nang hindi gumagamit ng makalumang “at nangyari na.”
- source_word: הֵצִיקָה לוֹ
  choice: niya siyang ginigipit
  rationale: Ipinahahayag ang patuloy na pagdudulot ni Delilah ng matinding presyon at paghihirap kay Samson.
- source_word: בִּדְבָרֶיהָ
  choice: sa mga sinasabi niya
  rationale: Natural na Tagalog para sa instrumental na pariralang literal na “sa pamamagitan ng kanyang mga salita.”
- source_word: כָּל הַיָּמִים
  choice: araw-araw
  rationale: Malinaw at natural na naghahatid ng paulit-ulit at tuloy-tuloy na panggigipit sa paglipas ng mga araw.
- source_word: וַתְּאַלֲצֵהוּ
  choice: patuloy na pinipilit
  rationale: Pinananatili ang tumitinding pamimilit nang hindi inuulit lamang ang “ginigipit.”
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: ang matinding paghihirap ng kanyang kalooban
  rationale: Inililipat sa natural na Tagalog ang idyomang Hebreo tungkol sa pagkapaikli ng nephesh, na maaaring magpahiwatig ng sukdulang dalamhati, pagkainip, o pagkapagod. Ipinaliliwanag sa talababa ang literal na larawan at lawak ng kahulugan.
- source_word: לָמוּת
  choice: halos ikamatay ni Samson
  rationale: Ipinahahayag ang sukdulang antas na umaabot sa kamatayan nang hindi ipinapalagay na tahasan niyang ninais magpakamatay.
