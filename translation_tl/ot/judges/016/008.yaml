  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: tl
  text: Kaya dinalhan siya ng mga pinuno ng mga Filisteo ng pitong sariwang tali na hindi pa natutuyo[a], at iginapos niya si Samson gamit ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pitong sariwang bagting.” Ang salitang Hebreo ay maaari ring tumukoy sa mga bagting, kabilang ang bagting ng pana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: dinalhan siya
  rationale: Ang anyong hiphil ng עלה ay literal na ‘iniakyat/dinala pataas,’ ngunit sa konteksto ay tumutukoy sa pagdadala ng mga bagay kay Delilah. Natural sa modernong Tagalog ang ‘dinalhan siya.’
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סֶרֶן ay titulo ng pangunahing opisyal o tagapamahalang Filisteo. Malinaw at hindi pyudal ang ‘mga pinuno.’
- source_word: שִׁבְעָה יְתָרִים
  choice: pitong ... panali
  rationale: Ang יֶתֶר ay maaaring tumukoy sa tali o bagting, marahil ay panaling yari sa litid o katulad na materyal; hindi tiyak sa talata na mga bagting ito ng pana. Pinananatili ng ‘panali’ ang mas malawak na kahulugan.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: sariwa at hindi pa natutuyong
  rationale: Ang לַחִים ay ‘mamasa-masa/sariwa,’ at ang לֹא חֹרָבוּ ay nagsasaad na hindi pa natuyo ang mga ito. Ang pinagsamang parirala ay malinaw at natural sa Tagalog.
- source_word: וַתַּאַסְרֵהוּ
  choice: iginapos niya si Samson
  rationale: Karaniwang kahulugan ng אסר ang paggapos. Ginamit ang pangalang ‘Samson’ sa halip na panghalip upang maiwasan ang di-likas o malabong ‘iginapos niya siya’ sa Tagalog.
- source_word: בָּהֶם
  choice: gamit ang mga iyon
  rationale: Ipinapahayag ng ב ang instrumento; natural itong isalin bilang ‘gamit ang mga iyon.’
