revisions:
- from: Pagkatapos, tumawag si Samson kay Yahweh at sinabi, “Panginoong Yahweh, alalahanin mo sana ako. Palakasin mo sana ako kahit sa pagkakataong ito lamang, O Diyos, upang minsanan akong makapaghiganti sa mga Filisteo dahil sa dalawa kong mata[a].”
  to: Pagkatapos, tumawag si Samson kay Yahweh at sinabi, “Panginoong Yahweh, alalahanin mo sana ako at palakasin mo sana ako sa pagkakataong ito lamang, O Diyos, upang makapaghiganti ako nang isang beses sa mga Filisteo dahil sa dalawa kong mata.”
  rationale: Inalis ang concessive na “kahit,” pinalitan ang di-likas na “minsanan” ng “nang isang beses,” at inalis ang talababa na maling iniuugnay ang “isa” sa dalawang mata. Pinananatili ng salin ang cognate na ideya ng isang paghihiganti nang hindi gumagamit ng paulit-ulit at di-likas na Tagalog.
