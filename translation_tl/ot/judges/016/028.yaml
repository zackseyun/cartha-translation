base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: tl
  text: Pagkatapos, tumawag si Samson kay Yahweh at sinabi, “Panginoong Yahweh, alalahanin mo sana ako at palakasin mo sana ako sa pagkakataong ito lamang, O Diyos, upang makapaghiganti ako nang isang beses sa mga Filisteo dahil sa dalawa kong mata.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: tumawag ... kay Yahweh
  rationale: Ang קרא na may אֶל at banal na tinutukoy ay nangangahulugang tumawag o dumulog. Pinananatili ang personal na pangalang Yahweh.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Panginoong Yahweh
  rationale: Tuwirang pinananatili ang parehong titulong אֲדֹנָי at pangalang יהוה, nang hindi inuulit nang alanganin ang “Panginoon.”
- source_word: זָכְרֵנִי נָא
  choice: alalahanin mo sana ako
  rationale: Ipinahahayag ng נָא ang magalang at taimtim na pakiusap; likas sa modernong Tagalog ang “sana” sa ganitong panalangin.
- source_word: וְחַזְּקֵנִי נָא
  choice: Palakasin mo sana ako
  rationale: Ang Piel ng חזק ay humihiling na pagkalooban siya ng lakas.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: kahit sa pagkakataong ito lamang
  rationale: Pinananatili ang paglilimita ng kahilingan sa nag-iisang kasalukuyang pagkakataon.
- source_word: הָאֱלֹהִים
  choice: O Diyos
  rationale: Ginagamit ito bilang tuwirang pagtawag sa Diyos; ang “O Diyos” ay malinaw at marangal na bokatibo.
- source_word: וְאִנָּקְמָה נְקַם אַחַת
  choice: upang minsanan akong makapaghiganti
  rationale: Ipinahahayag ng cohortative ang layunin o kahilingan ni Samson, at ng “minsanan” ang ideya ng isang paghihiganti, nang iniiwasan ang di-likas na pag-uulit sa Tagalog.
- source_word: מִשְּׁתֵי עֵינַי מִפְּלִשְׁתִּים
  choice: sa mga Filisteo dahil sa dalawa kong mata
  rationale: Ipinakikita ng parirala kung kanino nakatuon ang paghihiganti at ang dahilan nito, samantalang inilalagay sa talababa ang posibleng mas makitid na pagbasa ng sintaks.
theological_decisions:
- issue: Mga banal na pangalan at titulo sa panalangin ni Samson
  choice: “Yahweh” para sa יהוה at “Panginoong Yahweh” para sa אֲדֹנָי יֱהֹוִה
  alternative: “PANGINOON” at “Panginoong DIYOS”
  rationale: Pinananatili nito ang personal na banal na pangalan at ang patong-patong na pagtawag sa Hebreo, sa halip na pagsamahin ang mga ito sa pangkalahatang titulong “Diyos.”
- issue: Saklaw ng “isang paghihiganti” at “dalawa kong mata”
  choice: Isang minsanang paghihiganti dahil sa pagkabulag ng dalawang mata
  alternative: Paghihiganti para sa isa sa dalawang mata
  rationale: Maaaring iugnay ang אַחַת sa “isang paghihiganti” o unawain bilang “isa sa dalawa.” Pinananatili sa pangunahing teksto ang mas malawak at maayos na pagbasa, at tahasang itinatala ang alternatibo upang hindi ikubli ang tunay na sintaktikong kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “sana” para sa taimtim na pakiusap, “minsanan” upang natural na katawanin ang nag-iisang gawa ng paghihiganti, at “mga Filisteo” bilang karaniwang anyong Filipino.
