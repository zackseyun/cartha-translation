base_translation:
  language: en
  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: tl
  text: Sinabi ni Samson sa binatang humahawak sa kanyang kamay, “Hayaan mo akong makapa[a] ang mga haliging kinatatayuan ng gusali, upang makasandal ako sa mga iyon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong pananalita ay mahirap at may mga pagkakaiba sa pag-unawa. Karaniwan itong isinasalin na kahilingan ni Samson na makapa o mahawakan ang mga haligi.
    reason: Ipinapabatid nito ang tekstuwal na kahirapan nang hindi pumipili ng mas malawak na interpretasyon o nagdaragdag ng motibo mula sa kasunod na salaysay.
lexical_decisions:
- source_word: הַנַּעַר
  choice: binata
  rationale: Tumutukoy sa isang batang lalaking umaakay kay Samson; natural at dignified ang “binata” sa konteksto.
- source_word: הַמַּחֲזִיק בְּיָדוֹ
  choice: umaakay sa kanya sa kamay
  rationale: Bagaman literal na “humahawak sa kanyang kamay,” ipinahihiwatig ng konteksto na ginagabayan ng binata ang bulag na si Samson.
- source_word: הַנִּיחָה אוֹתִי
  choice: Pahintulutan mo akong magpahinga
  rationale: Pinananatili ang karaniwang diwa ng ugat נוח/ניח bilang pagpapahinga o pagpapaubaya na makapagpahinga.
- source_word: ו/הימש/ני
  choice: at akayin mo ako
  rationale: Ang anyo sa tekstong Masoretiko ay hindi pangkaraniwan, ngunit ayon sa konteksto at tradisyong tekstuwal ay tumutukoy sa paggabay o paglapit kay Samson sa mga haligi.
- source_word: נָכוֹן עֲלֵיהֶם
  choice: kinatatayuan ng gusali
  rationale: Natural na Filipino para sa ideyang ang gusali ay nakatatag o nakasandig sa mga haligi.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: upang makasandal ako sa mga iyon
  rationale: Tuwirang ipinapahayag ang layunin ni Samson nang hindi idinaragdag ang nalalaman sa kasunod na salaysay.
theological_decisions:
- issue: Layunin ni Samson sa paglapit sa mga haligi
  choice: Hindi tahasang sinabi sa talata na balak niyang pabagsakin ang gusali.
  alternative: Isalin sa paraang nagpapahiwatig agad ng balak niyang wasakin ang gusali.
  rationale: Ang talata mismo ay nagsasabing nais niyang sumandal; dapat mapanatili ang naratibong pag-unlad at hindi ipasok ang impormasyon mula sa kasunod na mga talata.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “gusali” para sa בַּיִת dahil pampublikong estruktura ang tinutukoy sa konteksto, at “mga iyon” upang maiwasan ang mabigat na pag-uulit ng “mga haligi.”
