  naturalness: Natural at marangal sa modernong Filipino ang “humahawak sa kanyang kamay,” “Hayaan mo akong makapa,” at “mga haliging kinatatayuan ng gusali.” Ang “mga iyon” ay malinaw na tumutukoy sa mga haligi.
