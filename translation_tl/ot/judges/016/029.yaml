revisions:
- from: Pagkatapos, hinawakan ni Samson nang mahigpit ang dalawang haligi sa gitna na siyang kinatatayuan ng gusali. Sumandig siya sa mga iyon[a]—ang isa ay nasa kanan niya at ang isa ay nasa kaliwa niya.
  to: Pagkatapos, mahigpit na hinawakan ni Samson ang dalawang haligi sa gitna, na siyang sinasandigan ng gusali. Sumandal siya sa mga ito[a], hawak ng kanang kamay niya ang isa at ng kaliwang kamay niya ang isa.
  rationale: Nilinaw ang huling sugnay upang maipakita na tig-isang haligi ang hawak ni Samson sa kanan at kaliwang kamay, sa halip na magpahiwatig lamang ng posisyon ng mga haligi. Pinalitan din ang paglalarawan sa ugnayan ng gusali at mga haligi ng mas tuwirang Filipino. Pinanatili ang ambigwidad ng סמך sa pamamagitan ng “sumandal” at ng alternatibong tala.
