base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: tl
  text: Pagkatapos, mahigpit na hinawakan ni Samson ang dalawang haligi sa gitna, na siyang sinasandigan ng gusali. Sumandal siya sa mga ito[a], hawak ng kanang kamay niya ang isa at ng kaliwang kamay niya ang isa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isinandal niya ang sarili niya sa mga ito” o “umasa siya sa mga ito.” Saklaw ng pandiwang Hebreo ang pagsandig o pag-alalay sa sarili sa isang bagay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: hinawakan ... nang mahigpit
  rationale: Ipinahihiwatig ng pandiwa ang mahigpit at sadyang paghawak. Likas sa makabagong Filipino ang pariralang ito at hindi nito dinaragdagan ang kilos na nasa Hebreo.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: ang dalawang haligi sa gitna
  rationale: Tuwirang ipinapahayag nito ang dalawang haligi at ang lokasyon nilang nasa gitna; mas natural ito sa Filipino kaysa sa mas teknikal na “mga sentrong haligi.”
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: na siyang kinatatayuan ng gusali
  rationale: Ipinakikita ng נָכוֹן na ang gusali ay nakatayo o nasusuportahan ng mga haligi. Malinaw at natural ang “kinatatayuan” bilang paglalarawan sa tungkuling estruktural ng mga ito.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: Sumandig siya sa mga iyon
  rationale: Maaaring mangahulugan ang סמך ng pagsandig o pag-alalay sa sarili laban sa isang bagay. Pinananatili ng “sumandig” ang tuwirang pisikal na diwa nang hindi ipinapasok ang kasunod na pagkilos.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: ang isa ay nasa kanan niya at ang isa ay nasa kaliwa niya
  rationale: Pinananatili nito ang distributibong ayos at ang literal na kanan at kaliwa ng tekstong Hebreo, nang hindi tahasang idinaragdag ang salitang “kamay,” na wala sa pinagmulan.
- source_word: הַבַּיִת
  choice: gusali
  rationale: Bagaman karaniwang nangangahulugang “bahay,” tumutukoy rito ang salita sa malaking estrukturang nakatayo sa mga haligi. Mas malinaw sa karaniwang mambabasa ang “gusali” sa kontekstong ito.
