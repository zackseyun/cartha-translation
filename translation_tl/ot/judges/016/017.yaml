revisions:
- from: Kaya ipinagtapat niya sa babae ang lahat ng nasa puso niya[a]. Sinabi niya, “Kailanma’y hindi pa nasayaran ng labaha ang ulo ko, sapagkat Nazareo ako ng Diyos[b] mula pa sa sinapupunan ng aking ina. Kung ahitan ako, mawawala sa akin ang lakas ko; manghihina ako at magiging gaya ng karaniwang lalaki[c].”
  to: At isiniwalat niya sa kaniya ang lahat ng nasa puso niya[a]. Sinabi niya, “Hindi pa kailanman dinaanan ng labaha ang ulo ko, sapagkat Nazareo ako ng Diyos[b] mula pa sa sinapupunan ng aking ina. Kung aahitan ako, mawawala sa akin ang lakas ko; manghihina ako at magiging gaya ng ibang lalaki[c].”
  rationale: Pinalitan ang pananalitang ukol sa labaha upang malinaw na maipahayag ang Hebreong larawan ng labahang dumaraan sa ulo at ang implikasyon nitong pag-ahit. Ginawang mas neutral ang unang pandiwa upang tumpak na maihatid ang ganap na pagsisiwalat, hindi lamang ang pag-amin. Pinanatili ang teknikal na katawagang “Nazareo,” ang balintiyak na "aahitan," at ang mga talababa sa kanilang wastong mga angkla.
