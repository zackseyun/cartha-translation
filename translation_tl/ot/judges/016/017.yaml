  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: tl
  text: At isiniwalat niya sa kaniya ang lahat ng nasa puso niya[a]. Sinabi niya, “Hindi pa kailanman dinaanan ng labaha ang ulo ko, sapagkat Nazareo ako ng Diyos[b] mula pa sa sinapupunan ng aking ina. Kung aahitan ako, mawawala sa akin ang lakas ko; manghihina ako at magiging gaya ng ibang lalaki[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “sinabi niya sa kaniya ang buo niyang puso.”
    reason: lexical_alternative
  - marker: b
    text: Ang “Nazareo” ay teknikal na tawag sa isang taong bukod-tanging itinalaga sa Diyos.
    reason: cultural_note
  - marker: c
    text: Maaari ring isalin na “gaya ng ibang tao.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד לָהּ אֶת כָּל לִבּוֹ
  choice: ipinagtapat niya sa babae ang lahat ng nasa puso niya
  rationale: Pinananatili nito ang Hebreong larawan ng puso bilang kaloob-looban habang natural na ipinahahayag ang ganap na pagsisiwalat sa modernong Tagalog.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: Kailanma’y hindi pa nasayaran ng labaha ang ulo ko
  rationale: Ang “labaha” ang tiyak na kasangkapan, at ang “nasayaran” ay natural ngunit malapit sa larawang Hebreo na hindi ito dumaan o sumampa sa kanyang ulo.
- source_word: נְזִיר אֱלֹהִים
  choice: Nazareo ako ng Diyos
  rationale: Ginamit ang kinikilalang teknikal na katawagang “Nazareo” upang mapanatili ang kaugnayan sa natatanging pagtatalaga sa Diyos, sa halip na gawing pangkalahatang paliwanag lamang.
- source_word: מִבֶּטֶן אִמִּי
  choice: mula pa sa sinapupunan ng aking ina
  rationale: Tumpak at likas itong Tagalog para sa pagtatalagang umiiral mula pa bago isilang.
- source_word: אִם גֻּלַּחְתִּי
  choice: Kung ahitan ako
  rationale: Pinananatili ng anyong balintiyak ang diwang ibang tao ang mag-aahit kay Samson; hindi sinasabing siya ang mag-aahit sa sarili.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: mawawala sa akin ang lakas ko
  rationale: Malinaw at natural nitong ipinapahayag ang paglisan ng lakas na nasa Hebreo.
- source_word: וְחָלִיתִי
  choice: manghihina ako
  rationale: Sa konteksto, pagkawala ng lakas ang tinutukoy, hindi pagkakasakit.
- source_word: כְּכָל הָאָדָם
  choice: magiging gaya ng karaniwang lalaki
  rationale: Ipinakikita nito ang kaibahan ng pambihirang lakas ni Samson sa kalagayan ng isang ordinaryong lalaki, nang hindi ipinahihiwatig na magiging katulad niya ang bawat lalaki sa lahat ng bagay.
theological_decisions:
- issue: Paglalarawan sa pagtatalaga ni Samson sa pariralang נְזִיר אֱלֹהִים
  choice: Nazareo ako ng Diyos
  alternative: isang taong itinalaga sa Diyos
  rationale: Ang transliterasyong “Nazareo” ay nagpapanatili sa teknikal at kanonikal na ugnayan sa institusyon ng Nazareo, samantalang ang “ng Diyos” ay nagpapanatili sa tahasang kaugnayan sa Diyos.
- issue: Kahulugan ng כְּכָל הָאָדָם sa huling sugnay
  choice: gaya ng karaniwang lalaki
  alternative: gaya ng ibang tao
  rationale: Sa salaysay, inihahambing ni Samson ang sarili niyang pambihirang lakas sa karaniwang kalagayan ng ibang lalaki. Gayunman, maaaring unawain ang אָדָם nang mas pangkalahatan bilang “tao,” kaya itinala ang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “ipinagtapat” upang natural na maipahayag ang ganap na pagsisiwalat, habang pinanatili sa kasunod na parirala at talababa ang metapora ng puso. Pinanatili ang teknikal na katawagang “Nazareo” at ipinaliwanag ito sa talababa.
