  terminology: Ang "Nazareo" ay angkop na transliterasyon ng teknikal na נְזִיר at ang talababa ay sapat na paliwanag. Ang "ibang lalaki" ay angkop sa kontekstuwal na paghahambing ni Samson sa mga ordinaryong lalaki nang hindi ginagawang mas tiyak kaysa sa Hebreo.
