base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: tl
  text: Bumaba ang mga kapatid niya at ang buong sambahayan ng kanyang ama, binuhat siya at dinala paitaas, at inilibing siya sa pagitan ng Zora at Estaol, sa libingan ng kanyang amang si Manoa. Siya ay humatol sa Israel sa loob ng dalawampung taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “Siya ay humatol na sa Israel sa loob ng dalawampung taon.” Maaaring unawain ang Hebreo bilang isang buod na nagbabalik-tanaw.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Bumaba
  rationale: Pinananatili ang tahasang direksiyong pababa ng ירד; natural ito sa salaysay nang hindi kailangang ipilit kung 'pumarito' o 'pumunta' ang pananaw.
- source_word: אֶחָיו
  choice: mga kapatid niya
  rationale: Karaniwang tumutukoy ang אחים sa mga kapatid na lalaki; sapat at natural sa Filipino ang 'mga kapatid' at hindi ito pinalalawak sa 'mga kamag-anak.'
- source_word: כָּל בֵּית אָבִיהוּ
  choice: ang buong sambahayan ng kanyang ama
  rationale: Ang idyomang 'bahay ng ama' ay tumutukoy sa sambahayan o angkan sa panig ng ama; malinaw sa makabagong Filipino ang 'sambahayan.'
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: kinuha ang kanyang bangkay
  rationale: Sa konteksto ng paglilibing, ang נשא ay pagkuha at pagdadala sa katawan. Ginawang tahasan ang 'bangkay' upang maging malinaw sa Filipino na patay na si Samson, nang walang dagdag na impormasyong wala sa konteksto.
- source_word: וַיַּעֲלוּ
  choice: iniakyat ito
  rationale: Pinananatili ang topograpikong direksiyong paitaas ng עלה at ang ipinahihiwatig na layon mula sa naunang sugnay.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: inilibing
  rationale: Tuwiran at karaniwang katumbas ng pandiwang Hebreo para sa paglilibing.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: sa pagitan ng Zora at Estaol
  rationale: Tuwirang inilalarawan ang lokasyon; ginamit ang mga anyong pangalang madaling bigkasin at nakasanayan sa Filipino.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: sa libingan ng kanyang amang si Manoa
  rationale: Maaaring 'libingan' o 'nitso' ang קבר; mas malawak at dignified ang 'libingan.' Natural sa Filipino ang apposisyong 'kanyang amang si Manoa.'
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Siya ay humatol sa Israel
  rationale: Pinananatili ng 'humatol' ang paulit-ulit na terminolohiya at natatanging tungkulin ng mga hukom sa aklat, sa halip na paliitin ito sa 'namahala.'
- source_word: עֶשְׂרִים שָׁנָה
  choice: sa loob ng dalawampung taon
  rationale: Natural na Filipino para sa tagal ng panahon habang tapat sa bilang ng Hebreo.
theological_decisions:
- issue: Pangwakas na buod ng panahon ng paglilingkod ni Samson
  choice: Siya ay humatol sa Israel sa loob ng dalawampung taon.
  alternative: Noon, humatol na siya sa Israel sa loob ng dalawampung taon.
  rationale: Maaaring basahin ang Hebreo bilang payak na pangwakas na buod o bilang pagbabalik-tanaw sa panahong natapos bago ang paglilibing. Pinanatili sa teksto ang karaniwang pormula ng Mga Hukom, at inilagay sa talababa ang posibleng retrospektibong pagbasa upang hindi lutasin nang palihim ang aspektuwal na kalabuan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mga direksiyong 'bumaba' at 'iniakyat,' ang bokabularyong 'humatol' na mahalaga sa aklat, at ang kalabuan ng pangwakas na buod sa pamamagitan ng talababa.
