  to: Bumaba ang mga kapatid niya at ang buong sambahayan ng kanyang ama, binuhat siya at dinala paitaas, at inilibing siya sa pagitan ng Zora at Estaol, sa libingan ng kanyang amang si Manoa. Siya ay humatol sa Israel sa loob ng dalawampung taon.[a]
