base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: tl
  text: Sinabihan ang mga taga-Gaza[a] na, “Dumating dito si Samson.” Kaya pumaligid sila at inabangan siya sa pintuang-bayan buong magdamag. Nanatili silang tahimik buong magdamag[b], na sinasabi, “Pagsapit ng bukang-liwayway[c], papatayin natin siya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang mga mamamayan ng Gaza.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “nanatili silang hindi kumikibo” o “nagkubli silang tahimik” buong magdamag; ipinahihiwatig ng Hebreo ang palihim na pananahimik habang nag-aabang.
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “hanggang sa liwanag ng umaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: ang mga taga-Gaza
  rationale: Likas at makabagong katawagan sa Filipino para sa mga naninirahan sa Gaza, habang pinananatili ang lokal na pagtukoy ng Hebreo.
- source_word: לֵאמֹר
  choice: Sinabihan ... “...”
  rationale: Ipinahihiwatig ng konstruksiyon na nakarating sa mga taga-Gaza ang balita at kasunod nito ang tuwirang sinabi; hindi kailangang isalin nang hiwalay ang literal na 'na sinasabi.'
- source_word: בָּא שִׁמְשׁוֹן הֵנָּה
  choice: Narito si Samson
  rationale: Natural na Filipino para sa naiulat na pagdating bilang kasalukuyang mahalagang katotohanan; saklaw nito ang diwang 'dumating dito' nang hindi mabigat ang pananalita.
- source_word: וַיָּסֹבּוּ
  choice: pinalibutan nila siya
  rationale: Ipinapahayag ang taktikal na pagpaligid sa konteksto. Walang tahasang layon sa Hebreo, kaya pinananatili sa tala ang posibilidad na ang lugar ang pinalibutan.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: siyang inabangan
  rationale: Karaniwang Filipino para sa lihim at masamang paghihintay upang salakayin ang isang tao.
- source_word: כָל הַלַּיְלָה
  choice: buong magdamag
  rationale: Natural na katumbas sa Filipino na malinaw na nagsasaad ng buong tagal ng gabi.
- source_word: בְּשַׁעַר הָעִיר
  choice: sa pintuang-bayan
  rationale: Dignified at malinaw na tawag sa tarangkahan o pasukan ng napapaderang lungsod, ang estratehikong labasan na binabantayan nila.
- source_word: וַיִּתְחָרְשׁוּ
  choice: Tahimik silang naghintay
  rationale: Inihahatid ang palihim na pananahimik o hindi pagkilos habang nag-aabang, ayon sa konteksto ng pananambang.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Pagsapit ng bukang-liwayway
  rationale: Natural na Filipino para sa oras ng unang liwanag ng umaga; ang literal na larawan ay ibinibigay sa talababa.
- source_word: וַהֲרְגְנֻהוּ
  choice: papatayin natin siya
  rationale: Tuwirang inililipat ang unang panauhang maramihan at ang panlalaking isahang layon; ang temporal na pagkakasunod ay naipahihiwatig na ng 'Pagsapit.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pintuang-bayan” upang tukuyin ang tarangkahan ng lungsod, hindi isang karaniwang pinto. Pinanatili sa mga talababa ang mga makabuluhang leksikal na alternatibo at ang literal na larawan ng Hebreo.
