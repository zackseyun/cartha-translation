revisions:
- from: Sinabihan ang mga taga-Gaza[a], “Narito si Samson.” Kaya pinalibutan nila siya at buong magdamag siyang inabangan sa pintuang-bayan. Tahimik silang naghintay buong magdamag[b], na sinasabi, “Pagsapit ng bukang-liwayway[c], papatayin natin siya.”
  to: Sinabihan ang mga taga-Gaza[a] na, “Dumating dito si Samson.” Kaya pumaligid sila at inabangan siya sa pintuang-bayan buong magdamag. Nanatili silang tahimik buong magdamag[b], na sinasabi, “Pagsapit ng bukang-liwayway[c], papatayin natin siya.”
  rationale: Inalis ang di-makatwirang pagtukoy kay Samson bilang hayag na layon ng “pumaligid,” habang pinanatili ang malinaw na pagtukoy sa kaniya bilang layon ng pananambang. Inayos din ang pagsasalin at talababa para sa pananahimik upang mas malapit sa Hebreo at mas natural sa Filipino.
