  text: וַ/תִּקַּ֣ח דְּלִילָה֩ עֲבֹתִ֨ים חֲדָשִׁ֜ים וַ/תַּאַסְרֵ֣/הוּ בָ/הֶ֗ם וַ/תֹּ֤אמֶר אֵלָי/ו֙ פְּלִשְׁתִּ֤ים עָלֶ֨י/ךָ֙ שִׁמְשׁ֔וֹן וְ/הָ/אֹרֵ֖ב יֹשֵׁ֣ב בֶּ/חָ֑דֶר וַֽ/יְנַתְּקֵ֛/ם מֵ/עַ֥ל זְרֹעֹתָ֖י/ו כַּ/חֽוּט׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: tl
  text: Pagkatapos, kumuha si Delila ng mga bagong lubid[a] at itinali niya si Samson gamit ang mga ito. Sinabi niya sa kanya, “Narito na ang mga Filisteo, Samson!” Samantala, ang nag-aabang ay nakaupo sa loob ng silid[b]. Ngunit pinigtal niya ang mga ito mula sa kanyang mga bisig na parang sinulid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga bagong panali.”
    reason: lexical_alternative
  - marker: b
    text: Ang “sa loob ng silid” ay maaari ring isaling “sa panloob na silid.” Ang Hebreo ay gumagamit ng anyong isahan para sa “nag-aabang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים חֲדָשִׁים
  choice: mga bagong lubid
  rationale: Ang עֲבֹתִים ay makakapal na panali, kaya natural at tumpak ang “mga lubid”; malinaw rin ang kaibahan nito sa “sinulid” sa hulihan.
- source_word: וַתַּאַסְרֵהוּ
  choice: iginapos siya
  rationale: Tuwirang ipinahahayag ang pagkakatali bilang pagpigil, sa dignified at natural na salaysay.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Narito na ang mga Filisteo, Samson!
  rationale: Inilalarawan nito nang natural sa Filipino ang apurahang babala na napakalapit na ng mga Filisteo, nang hindi tiyak na sinasabing nagsimula na ang pagsalakay.
- source_word: וְהָאֹרֵב
  choice: ang nag-aabang
  rationale: Pinananatili ang anyong isahan ng Hebreo at ang diwa ng isang taong nakakubli at naghihintay, sa halip na tahimik itong gawing pangmaramihan o abstraktong “tambang.”
- source_word: יֹשֵׁב בֶּחָדֶר
  choice: nakaupo sa loob ng silid
  rationale: Pinananatili ang kongkretong larawan ng יֹשֵׁב at ang lokasyon sa panloob o nakukubling silid; ang alternatibong kahulugan ng חֶדֶר ay inilagay sa talababa.
- source_word: וַיְנַתְּקֵם
  choice: nilagot niya ang mga lubid
  rationale: Ang “nilagot” ay nagpapahayag ng biglaan at puwersahang pagkaputol o pagkapigtal, at umaangkop sa paghahambing sa sinulid.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: sa kanyang mga bisig
  rationale: Natural na Filipino para sa mga lubid na nakapalibot sa mga bisig at nilagot mula roon.
- source_word: כַּחוּט
  choice: na parang sinulid
  rationale: Pinananatili ang malinaw na paghahambing sa isang manipis at madaling maputol na hibla.
