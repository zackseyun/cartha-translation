  source_fidelity: 'Malapit sa Hebreo ang salin: napanatili ang mga bagong lubid, ang apurahang sigaw tungkol sa mga Filisteo, ang isahang nag-aabang, at ang paghahambing sa sinulid. Gayunman, ang sugnay na “iginapos siya ng mga iyon” ay maling ipinapakita ang mga lubid bilang tagaganap; si Delila ang tahasang gumagawa ng pagkakatali sa Hebreo.'
  naturalness: Makabago at malinaw sa pangkalahatan. Mas natural at hindi malabo ang “itinali niya siya gamit ang mga ito” kaysa sa pasibong “iginapos siya ng mga iyon.” Ang “pinigtal niya ang mga ito mula sa kanyang mga bisig” ay mas tiyak para sa puwersahang pagpigtal/pagkawala ng tali kaysa “nilagot.”
  terminology: Ang “Delila,” “Filisteo,” “Samson,” “lubid,” “bisig,” at “sinulid” ay angkop sa modernong Filipino Tagalog at sa register ng salaysay. Pinananatili ng “ang nag-aabang” ang isahang anyo at ang potensiyal na kolektibong gamit ng Hebreo nang hindi ito nilulutas nang doktrinal o interpretatibo.
