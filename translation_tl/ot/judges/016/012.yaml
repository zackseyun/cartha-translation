  - severity: low
    issue: Ang “nilagot” ay hindi gaanong tiyak para sa puwersahang pagpigtal ng mga tali mula sa mga bisig.
    rationale: Ang וַיְנַתְּקֵם ay nagpapahiwatig ng marahas na pagkapunit o pagpigtal. Ang “pinigtal” ay mas tuwiran at nananatiling natural sa Filipino.
