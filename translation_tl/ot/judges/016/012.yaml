revisions:
- from: Pagkatapos, kumuha si Delila ng mga bagong lubid[a] at iginapos siya ng mga iyon. Sinabi niya sa kanya, “Narito na ang mga Filisteo, Samson!” Samantala, ang nag-aabang ay nakaupo sa loob ng silid[b]. Ngunit nilagot niya ang mga lubid sa kanyang mga bisig na parang sinulid.
  to: Pagkatapos, kumuha si Delila ng mga bagong lubid[a] at itinali niya si Samson gamit ang mga ito. Sinabi niya sa kanya, “Narito na ang mga Filisteo, Samson!” Samantala, ang nag-aabang ay nakaupo sa loob ng silid[b]. Ngunit pinigtal niya ang mga ito mula sa kanyang mga bisig na parang sinulid.
  rationale: Inayos ang relasyon ng tagaganap at layon upang malinaw na si Delila ang nagtali kay Samson gamit ang mga lubid. Pinalitan din ang pandiwa sa huling sugnay upang masaklaw ang puwersahang pagpigtal na ipinahihiwatig ng Hebreo. Hindi binago ang isahang kalabuan ng “nag-aabang” o ang mga umiiral na talababa.
