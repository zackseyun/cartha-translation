base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: tl
  text: Ang gusali ay puno ng mga lalaki at babae, at naroon ang lahat ng pinuno ng mga Filisteo. At sa bubong ay may humigit-kumulang tatlong libong lalaki at babae na nanonood habang nagtatanghal si Samson[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “habang naglalaro o naglilibang si Samson” o, sa mas literal na anyo, “sa paglalaro ni Samson.” Ang salitang Hebreo ay maaaring tumukoy sa pagtawa, paglalaro, pagbibiro, o pagbibigay-aliw.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: ang gusali
  rationale: Ang pangunahing diwa ay “bahay/gusali.” Sa kontekstong ito, isang malaking estrukturang pinagtitipunan ang tinutukoy; mas likas at mas malinaw sa makabagong Filipino ang “gusali” nang hindi ito tahasang tinatawag na templo.
- source_word: מָלֵא
  choice: Puno ng
  rationale: Tuwirang inilalarawan ang kalagayan ng gusali at natural ang panaguring “puno ng” sa Filipino.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים
  choice: mga lalaki at babae
  rationale: Pinananatili ang tahasang pagbanggit sa dalawang kasarian sa karamihan.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: lahat ng pinuno ng mga Filisteo
  rationale: Ang סְרָנִים ay natatanging titulo ng mga tagapamahalang Filisteo. Ang “mga pinuno” ay malinaw at dignified sa modernong Filipino nang hindi gumagamit ng di-likas na “mga panginoon.”
- source_word: וְעַל הַגָּג
  choice: Nasa bubong naman
  rationale: Pinananatili ang lokasyon sa unahan ng sugnay; ang “naman” ay natural na naglilipat ng pansin mula sa loob ng gusali tungo sa bubong.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: humigit-kumulang tatlong libo
  rationale: Ipinahahayag ng prefiks na כ ang pagtatantiya, kaya hindi eksaktong bilang ang ipinahihiwatig.
- source_word: אִישׁ וְאִשָּׁה
  choice: lalaki at babae
  rationale: Bagaman nasa anyong isahan sa Hebreo, distributibo ang gamit at tumutukoy sa maraming lalaki at babae.
- source_word: הָרֹאִים
  choice: na nanonood
  rationale: Ipinakikita ng participle ang patuloy na panonood ng mga taong nasa bubong.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: habang nagtatanghal si Samson
  rationale: Natural nitong ipinahahayag na pinanonood si Samson bilang isang palabas, ngunit nilalagyan ng talababa dahil malawak at kontekstuwal ang kahulugan ng ugat na שׂחק.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Iniwasan ang sobrang teknikal na titulo at ang tahasang pagtukoy sa gusali bilang templo, na hindi sinabi sa talata. Inilagay ang panandang [a] sa pariralang aktuwal na nililinaw ng talababa.
