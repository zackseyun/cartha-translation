revisions:
- from: Puno ng mga lalaki at babae ang gusali, at naroon ang lahat ng pinuno ng mga Filisteo. Nasa bubong naman ang humigit-kumulang tatlong libong lalaki at babae na nanonood habang nagtatanghal si Samson.[a]
  to: Ang gusali ay puno ng mga lalaki at babae, at naroon ang lahat ng pinuno ng mga Filisteo. At sa bubong ay may humigit-kumulang tatlong libong lalaki at babae na nanonood habang nagtatanghal si Samson[a].
  rationale: Pinananatili ng binagong teksto ang kahulugan at antas ng katiyakan ng Hebreo. Inayos ang talababa upang maipakita ang lawak ng ugat na שׂחק nang hindi nagdaragdag ng causative na kahulugan, at inilapit ang footnote anchor sa mismong pariralang tinutukoy nito.
