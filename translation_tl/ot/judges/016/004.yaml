  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: tl
  text: Pagkatapos nito, umibig siya sa isang babae sa Lambak ng Sorek[a], na ang pangalan ay Delilah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa Wadi ng Sorek.” Ang salitang Hebreo na נַחַל ay maaaring tumukoy sa isang lambak, tuyong sapang-batis, o daluyang may tubig lamang sa ilang panahon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Pagkatapos nito
  rationale: Likas na ipinahahayag sa makabagong Tagalog ang pagkakasunod-sunod ng mga pangyayari nang hindi pinatitigas ang pormulang pasalaysay na literal na nangangahulugang “at nangyari pagkatapos nito.”
- source_word: וַיֶּאֱהַב
  choice: umibig siya
  rationale: Tuwirang katumbas ito ng pandiwang אָהַב at hindi nagdaragdag ng kahulugang higit sa sinasabi ng Hebreo.
- source_word: אִשָּׁה
  choice: isang babae
  rationale: Maaaring mangahulugang “babae” o “asawa” ang salita, ngunit walang ipinahihiwatig na pag-aasawa sa kontekstong ito.
- source_word: בְּנַחַל שֹׂרֵק
  choice: sa Lambak ng Sorek
  rationale: Maaaring tumukoy ang נַחַל sa lambak, sapang-batis, o daluyang may tubig lamang sa ilang panahon. Malinaw at natural sa Tagalog ang “Lambak,” habang pinananatili sa transliterasyon ang pangalang Sorek.
- source_word: וּשְׁמָהּ
  choice: at ... ang pangalan nito
  rationale: Pinananatili nito ang tahasang pagpapakilala sa pangalan ng babae at ang pang-ugnay na nasa Hebreo, sa natural na ayos ng Tagalog.
- source_word: דְּלִילָה
  choice: Delilah
  rationale: Isinalin sa karaniwang transliterasyon ang pangalan ng tao.
