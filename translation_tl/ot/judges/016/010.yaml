    rationale: Bagama't nauunawaan, masyado nitong ginagawang tahasang aktibong kilos ang pagbibigay-gapos. Ang Hebreo ay nagtatanong kung sa ano/sa pamamagitan ng ano siya maaaring magapos. Ang “kung ano ang maaaring ipanggapos sa iyo” ay mas malapit at natural pa rin.
  - severity: low
    issue: Ginamit ang “Delilah” sa halip na karaniwang anyong Filipino na “Delila.”
    rationale: Para sa modernong saling Filipino, “Delila” ang mas karaniwang anyo ng pangalang ito sa paggamit ng Biblia sa Filipino.
