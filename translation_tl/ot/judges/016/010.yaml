base_translation:
  language: en
  yaml_path: translation/ot/judges/016/010.yaml
  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Delila kay Samson, “Tingnan mo, pinaglaruan mo ako[a] at nagsabi ka sa akin ng mga kasinungalingan. Ngayon, pakisabi sa akin kung ano ang maaaring ipanggapos sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ginawa mo akong katawa-tawa”; maaaring tumukoy ang pandiwang Hebreo sa panunuya o paglalaro sa isang tao sa pamamagitan ng panlilinlang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos ay sinabi” bilang panandang pagkakasunod-sunod.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Panawag-pansin ito na nagpapasimula sa paratang ni Delilah at nagpapanatili sa tuwirang lakas ng Hebreo nang hindi gumagamit ng makalumang pananalita.
- source_word: הֵתַלְתָּ בִּי
  choice: ginawa mo akong katawa-tawa
  rationale: Ipinahihiwatig ng pandiwa ang panlilinlang na ginagawang laruan o tampulan ang isang tao. Ang pariralang ito ay natural at malinaw sa Filipino, samantalang inilalahad sa talababa ang isa pang posibleng diin.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: at nagsabi ka sa akin ng mga kasinungalingan
  rationale: Pinananatili nito ang kilos ng pagsasalita, ang di-tuwirang layon na “sa akin,” at ang maramihang כְזָבִים.
- source_word: עַתָּה
  choice: Ngayon
  rationale: Minamarkahan nito ang paglipat mula sa paratang tungo sa panibagong pakiusap.
- source_word: הַגִּידָה נָּא לִי
  choice: pakisabi sa akin
  rationale: Ipinahahayag ng נָא ang pakiusap; ang “pakisabi” ay magalang at natural na katumbas sa modernong Filipino.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: kung ano ang maaaring gamitin upang igapos ka
  rationale: Pinananatili nito ang instrumental na tanong na “sa pamamagitan ng ano” at ang pasibong/potensiyal na diwa ng תֵּאָסֵר.
