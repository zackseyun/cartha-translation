base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: tl
  text: At pinatulog niya si Samson sa kaniyang mga tuhod[a]. Tumawag siya ng isang lalaki[b], at inahit niya ang pitong tirintas sa ulo ni Samson[c]. Pagkatapos, sinimulan niyang pahirapan si Samson, at nawala sa kaniya ang kaniyang lakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa kaniyang kandungan”; literal, “sa kaniyang mga tuhod.”
    reason: lexical_alternative
  - marker: b
    text: O “nagpatawag siya ng isang lalaki.” Maaaring tumukoy ang Hebreo sa pagtawag sa isang lalaking naroon na o sa pagpapapunta sa kaniya upang gawin ang gawain.
    reason: alternative_reading
  - marker: c
    text: O “pitong kumpol ng buhok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: pinatulog niya si Samson
  rationale: 'Ang Hiphil ng ישׁן ay causative: siya ang naging dahilan upang makatulog si Samson. Ginamit ang pangalang Samson para maging malinaw ang tinutukoy sa natural na Tagalog.'
- source_word: עַל בִּרְכֶּיהָ
  choice: sa kaniyang mga tuhod
  rationale: Tuwirang tumutukoy ang בִּרְכֶּיהָ sa kaniyang mga tuhod. Pinananatili ito sa teksto, habang inilalagay sa talababa ang mas natural na larawang 'sa kaniyang kandungan.'
- source_word: וַתִּקְרָא לָאִישׁ
  choice: Tumawag siya ng isang lalaki
  rationale: Maaaring mangahulugan ang parirala na tumawag o nagpatawag siya ng isang lalaki. Hindi tiyak sa anyo ng Hebreo kung dati nang tukoy ang lalaki, kaya pinanatili ang pagiging di-tiyak.
- source_word: וַתְּגַלַּח
  choice: inahit niya
  rationale: Babaeng isahan ang pandiwa at tumutukoy kay Delila bilang gramatikal na simuno. Maaaring ginawa niya ito sa pamamagitan ng lalaking tinawag, ngunit hindi iyon nililinaw ng Hebreo.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: ang pitong tirintas sa ulo ni Samson
  rationale: Ang מַחְלְפוֹת ay maaaring mga tirintas o kumpol ng buhok. Ang 'tirintas' ay malinaw at natural sa modernong Tagalog, habang itinatala sa talababa ang alternatibo.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: sinimulan niya itong pahirapan
  rationale: Pinananatili ng 'sinimulan' ang ingressive force ng וַתָּחֶל, at malawak ang 'pahirapan' upang hindi tukuyin ang eksaktong paraan ng ענה sa kontekstong ito.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: nawala ang lakas nito
  rationale: Natural na Tagalog ito para sa idyomang nagsasaad na lumisan o nawala sa kaniya ang kaniyang lakas.
theological_decisions:
- issue: Pinagmulan at pagkawala ng lakas ni Samson
  choice: Isinalin lamang na 'nawala ang lakas nito,' gaya ng tahasang sinasabi ng talata.
  alternative: Idagdag na 'iniwan siya ng lakas mula sa PANGINOON.'
  rationale: Bagaman iniuugnay ng mas malawak na konteksto ang lakas ni Samson sa PANGINOON at sa kaniyang pagiging Nazareo, hindi tahasang binabanggit iyon sa talatang ito. Hindi nagdaragdag ang salin ng paliwanag na wala sa mismong pangungusap.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Iniwasan ang sobrang pormal o makalumang pananalita. Ginamit ang 'kaniyang' sa halip na kolokyal na 'kanyang,' at ang mga panghalip na 'ito/nito' upang maiwasan ang kalituhan sa kasarian habang nananatiling natural.
