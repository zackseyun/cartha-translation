  text: וַ/תִּתְקַע֙ בַּ/יָּתֵ֔ד וַ/תֹּ֣אמֶר אֵלָ֔י/ו פְּלִשְׁתִּ֥ים עָלֶ֖י/ךָ שִׁמְשׁ֑וֹן וַ/יִּיקַץ֙ מִ/שְּׁנָת֔/וֹ וַ/יִּסַּ֛ע אֶת הַ/יְתַ֥ד הָ/אֶ֖רֶג וְ/אֶת הַ/מַּסָּֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: tl
  text: Pagkatapos, itinarak niya iyon gamit ang tulos[a] at sinabi sa kanya, “Sasalakayin ka ng mga Filisteo, Samson!” Nagising siya at hinila niyang palayo ang tulos ng habihan pati ang hinabing tela.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “aspile.” Ang salitang Hebreo ay maaaring tumukoy sa tulos o aspile na ginagamit upang magpatatag o magkabit.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay maaaring tumukoy sa hinabing materyal o telang nasa habihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: itinarak niya
  rationale: Ang תקע ay tumutukoy sa pagtusok o pagtatak nang matibay. Ang “itinarak” ay malinaw na naghahatid ng pisikal na kilos nang hindi labis na tinutukoy ang mekanismo ng habihan.
- source_word: בַּיָּתֵד
  choice: gamit ang tulos
  rationale: Ang יָתֵד ay maaaring tulos o malaking aspile. Sa konteksto ng habihan, ang “tulos” ay natural at pinananatili ang pangkalahatang kahulugan ng kasangkapang itinarak.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Sasalakayin ka ng mga Filisteo
  rationale: Ito ang paulit-ulit na sigaw ng babala sa salaysay. Mas natural sa modernong Tagalog ang “Sasalakayin ka” kaysa literal na “Nasa ibabaw mo,” habang pinananatili ang agarang panganib.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: Nagising siya
  rationale: Sapat at likas sa Tagalog ang “nagising” upang ihatid ang paggising mula sa pagkakatulog; hindi na kailangang ulitin ang “mula sa kanyang tulog.”
- source_word: וַיִּסַּע
  choice: hinila niyang paitaas
  rationale: Sa kontekstong ito, ang נסע ay may diwang pagbunot o pag-angat ng isang bagay na nakapirmi. Ipinahihiwatig ng “hinila niyang paitaas” ang marahas na pag-alis nang hindi ito ipinapakahulugang paglalakbay.
- source_word: הַיְתַד הָאֶרֶג
  choice: ang tulos ng habihan
  rationale: Ipinapakita ng parirala na ang tulos ay kaugnay ng kagamitan sa paghahabi. Ang “tulos ng habihan” ay malinaw at malapit sa anyo ng Hebreo.
- source_word: הַמַּסָּכֶת
  choice: ang hinabing tela
  rationale: Ang מַסָּכֶת ay tumutukoy sa materyal na hinabi sa habihan. Ang “hinabing tela” ay mas madaling maunawaan kaysa teknikal na termino at hindi labis na nililimitahan ito sa mga hiblang paayon lamang.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na salaysay sa Filipino. Ginamit ang karaniwang “habihan” at “hinabing tela” sa halip na mas teknikal na bokabularyo sa paghahabi. Ang sigaw ng babala ay isinalin ayon sa natural na idyoma sa Tagalog habang pinananatili ang biglaan at agarang panganib.
