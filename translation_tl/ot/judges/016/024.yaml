  source_fidelity: 'Tapat ang salin sa Hebreo: nakita ng mga tao si Samson, pinuri nila ang kanilang diyos, at ipinahayag nilang ibinigay ng diyos ang kanilang kaaway sa kanilang kapangyarihan. Ang “ang sumira sa ating lupain at pumatay sa marami sa atin” ay natural na pagpapahayag ng magkakaugnay na paglalarawan sa kaaway bilang maninira ng lupain at sanhi ng marami nilang napatay.'
