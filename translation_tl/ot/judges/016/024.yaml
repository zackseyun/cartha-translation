base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: tl
  text: Nang makita siya ng mga tao, pinuri nila ang kanilang diyos, sapagkat sinabi nila, “Ibinigay ng ating diyos sa ating kamay ang ating kaaway, ang sumira sa ating lupain at pumatay sa marami sa atin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: pinuri nila
  rationale: Likas at tuwirang salin ng pandiwang nangangahulugang nagpahayag sila ng papuri.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: ibinigay ... sa ating kamay
  rationale: Pinananatili ang Hebreong idyoma ng pagpapasailalim sa kapangyarihan, na malinaw rin sa Filipino sa kontekstong ito.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: ang sumira sa ating lupain
  rationale: Inilalarawan ang taong nagwasak o nagpahamak sa lupain; mas natural ang pandiwang parirala kaysa sa mabigat na pangngalang 'tagawasak'.
- source_word: וַאֲשֶׁר הִרְבָּה אֶת חֲלָלֵינוּ
  choice: at pumatay sa marami sa atin
  rationale: Ang literal na larawan ay 'nagparami sa aming mga napatay'; ipinahahayag ito sa natural na Filipino habang pinananatili ang lawak ng pagpatay.
theological_decisions:
- issue: Pagbanggit sa diyos ng mga Filisteo
  choice: kanilang diyos / ating diyos
  alternative: kanilang Diyos / ating Diyos
  rationale: Maliit na titik ang ginamit sapagkat si Dagon, hindi ang Diyos ng Israel, ang tinutukoy; hindi nito pinagtitibay ang pahayag ng mga Filisteo bilang teolohikong katotohanan.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Pinanatili ang tuwirang pananalita at ang Hebreong idyomang 'sa ating kamay,' ngunit ginawang natural ang huling sugnay.
