revisions:
- from: Sinabi niya sa kanya, “Paano mong nasasabing, ‘Mahal kita,’ gayong wala sa akin ang puso mo? Tatlong beses mo na akong pinaglaruan[a], at hindi mo pa sinabi sa akin kung saan nagmumula ang pambihira mong lakas.”
  to: Sinabi niya sa kanya, “Paano mo nasasabing, ‘Mahal kita,’ gayong hindi nakikiisa sa akin ang puso mo? Tatlong beses mo na akong pinaglaruan[a], at hindi mo pa sinabi sa akin kung saan nakasalalay ang matindi mong lakas.”
  rationale: Inayos ang ayos ng unang tanong para sa likas na modernong Filipino. Pinalitan ang salin ng idyomang ‘puso ... kasama ako’ ng pananalitang nagpapanatili ng ideya ng panloob na pakikiisa nang hindi ginagawang pagmamay-ari ang puso. Pinalawak ang huling parirala sa “kung saan nakasalalay” upang hindi ipilit ang ‘pinagmulan’ bilang tanging kahulugan ng Hebreo.
