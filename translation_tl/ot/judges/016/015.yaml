base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Paano mo nasasabing, ‘Mahal kita,’ gayong hindi nakikiisa sa akin ang puso mo? Tatlong beses mo na akong pinaglaruan[a], at hindi mo pa sinabi sa akin kung saan nakasalalay ang matindi mong lakas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “nilinlang,” “ginawang hangal,” o “ginawang katatawanan.” Ang pandiwang Hebreo ay tumutukoy sa mapanlinlang na pakikipaglaro sa isang tao na may kasamang panunuya o paghamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Paano mong
  rationale: Likas na ipinahahayag nito sa Filipino ang mapanumbat at retorikal na tanong ni Delilah.
- source_word: אֲהַבְתִּיךְ
  choice: Mahal kita
  rationale: Bagaman anyong ganap ang pandiwa sa Hebreo, ang tuwirang sipi ay tumutukoy sa ipinapahayag na patuloy na pag-ibig ni Samson.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: wala sa akin ang puso mo
  rationale: Pinananatili ang talinghaga ng Hebreo tungkol sa puso bilang katapatan at panloob na pagtatalaga, nang hindi ito nililimitahan sa simpleng damdamin lamang.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: Tatlong beses mo na
  rationale: Natural na katumbas sa modernong Filipino para sa tatlong naunang pangyayari.
- source_word: הֵתַלְתָּ בִּי
  choice: pinaglaruan
  rationale: Saklaw nito ang pakikitungong mapanlinlang at mapanghamak—ang paggawa ng biro o laro sa kapinsalaan ng isang tao—nang hindi labis na pinipili ang iisang nuance.
- source_word: הִגַּדְתָּ לִּי
  choice: hindi mo pa sinabi sa akin
  rationale: Karaniwang pananalita ito sa usapan; ipinahihiwatig ng “pa” ang paulit-ulit ngunit hindi pa rin natutupad na kahilingan.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: kung saan nagmumula ang pambihira mong lakas
  rationale: Malinaw na ipinahahayag na itinatanong ang batayan o pinagmulan ng di-pangkaraniwang lakas ni Samson, hindi ang pisikal na kinaroroonan nito.
