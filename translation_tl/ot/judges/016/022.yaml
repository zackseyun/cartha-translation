translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “matapos itong ahitin” para sa malinaw at madaling basahing temporal na ugnayan, habang inilalagay sa mga talababa ang tunay na leksikal at reperensiyal na kalabuan ng Hebreo.
