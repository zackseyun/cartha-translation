  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: tl
  text: Pumunta si Samson sa Gaza, at doon ay nakakita siya ng isang babaeng bayaran; at sumiping siya sa kanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakipagtalik siya sa kanya.” Sa literal na Hebreo, “pumasok siya sa kanya,” isang karaniwang eupemismo sa kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Pumunta
  rationale: Karaniwang pandiwa ito ng pagpunta sa sunod-sunod na salaysay; natural at walang idinagdag na diwa ang “pumunta.”
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Ginamit ang nakagawiang anyo ng pangalang ito sa modernong salin sa Filipino.
- source_word: עַזָּתָה
  choice: sa Gaza
  rationale: Ang hulaping panuro ng direksiyon sa Hebreo ay nagpapahayag ng pagkilos patungo sa Gaza; natural itong ipinapahayag ng “sa Gaza” kasunod ng “pumunta.”
- source_word: וַיַּרְא שָׁם
  choice: Doon ay nakakita siya
  rationale: Pinananatili ang שָׁם bilang “doon” sa natural na ayos ng pangungusap sa Filipino.
- source_word: אִשָּׁה זוֹנָה
  choice: isang babaeng bayaran
  rationale: Ipinahahayag nito sa kasalukuyan at madaling maunawaang Filipino ang isang babaeng nagbebenta ng serbisyong seksuwal, nang hindi gumagamit ng lipas o labis na teknikal na katawagan.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: at sinipingan niya ito
  rationale: Ang pariralang Hebreo ay literal na tumutukoy sa pagpunta o pagpasok sa babae ngunit gumaganap bilang karaniwang eupemismo para sa pakikipagtalik. Ang “sinipingan” ay isang marangal at natural na eupemismo sa Filipino na hindi ginagawang mas tahasan ang teksto.
theological_decisions:
- issue: Kung gagawing tahasan ang seksuwal na kahulugan ng וַיָּבֹא אֵלֶיהָ o pananatilihin ang eupemismo
  choice: Panatilihin ang eupemistikong pagpapahayag sa “sinipingan niya ito”
  alternative: nakipagtalik siya rito
  rationale: Malakas na ipinahihiwatig ng konteksto ang pakikipagtalik, ngunit eupemismo ang ginamit ng Hebreo. Pinananatili ng pangunahing teksto ang antas ng pagiging di-tahasan ng pinagmulan, habang nililinaw ng talababa ang kahulugan.
translation_notes:
  register: Modernong Filipino na natural, malinaw, at marangal. Ginamit ang “babaeng bayaran” sa halip na lipas na katawagan, at “sinipingan” upang mapanatili ang eupemistikong himig ng Hebreo.
