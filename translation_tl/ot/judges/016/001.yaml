  terminology: Ang “babaeng bayaran” ay mauunawaan at katanggap-tanggap para sa זוֹנָה. Ang “sumiping” ay isang angkop na eupemistikong katumbas sa kontekstong ito. Ang “Samson” at “Gaza” ay wastong nakagawiang anyo.
