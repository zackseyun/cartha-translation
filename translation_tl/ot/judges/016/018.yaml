revisions:
- from: Nang makita ni Delila na sinabi na ni Samson sa kanya ang lahat ng nasa puso nito, nagpasugo siya at ipinatawag ang mga pinuno ng mga Filisteo[a]. Sinabi niya, “Umakyat kayo rito sa pagkakataong ito, sapagkat sinabi na niya sa kanya[b] ang lahat ng nasa puso niya.” Kaya umakyat kay Delila ang mga pinuno ng mga Filisteo, dala ang pilak[c] sa kanilang mga kamay.
  to: Nang makita ni Delila na sinabi na ni Samson sa kanya ang lahat ng nasa puso ni Samson, nagpasugo siya at ipinatawag ang mga pinuno ng mga Filisteo[a]. Sinabi niya, “Umakyat kayo rito sa pagkakataong ito, sapagkat sinabi na niya kay Delila[b] ang lahat ng nasa puso niya.” Pagkatapos, umakyat kay Delila ang mga pinuno ng mga Filisteo, dala ang pilak[c] sa kanilang mga kamay.
  rationale: Inayos ang di-likas na panghalip na “nito” para kay Samson at ginawang hayag ang pagtukoy kay Delila sa loob ng tuwirang pananalita. Hindi nito inaamyendahan ang tekstong Hebreo; sa halip, tinutulungan nitong makita sa Filipino ang natanggap na ikatlong-pananghalip na anyo, na ipinaliliwanag ng talababa.
