translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Filisteo’ bilang karaniwang anyong Tagalog. Pinanatili ang bahagyang di-likas na ikatlong panauhan sa sinabi ni Delila upang hindi tahimik na baguhin ang natanggap na tekstong Hebreo; ipinaliwanag ito sa talababa.
