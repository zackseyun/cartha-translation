  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: tl
  text: Nang makita ni Delila na sinabi na ni Samson sa kanya ang lahat ng nasa puso ni Samson, nagpasugo siya at ipinatawag ang mga pinuno ng mga Filisteo[a]. Sinabi niya, “Umakyat kayo rito sa pagkakataong ito, sapagkat sinabi na niya kay Delila[b] ang lahat ng nasa puso niya.” Pagkatapos, umakyat kay Delila ang mga pinuno ng mga Filisteo, dala ang pilak[c] sa kanilang mga kamay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “mga panginoon ng mga Filisteo.”
    reason: lexical_alternative
  - marker: b
    text: 'Ganito sa tekstong Hebreo: “kay Delila” (literal, “sa kanya”). Sa tuwirang pagsasalita, maaaring asahan ang “sa akin,” ngunit ikatlong panauhang pambabae ang nasa tekstong Hebreo.'
    reason: textual_variant
  - marker: c
    text: Ang pilak ay dala nila bilang kabayaran.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Nang makita
  rationale: Pinananatili ang pandiwang ‘makita’ at likas na ipinahahayag sa Tagalog ang kaugnayang temporal sa sumunod na kilos.
- source_word: הִגִּיד
  choice: sinabi na
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o magpahayag. Ang ‘sinabi na’ ay natural sa salaysay at nagpapahiwatig na ganap na ang pagsisiwalat.
- source_word: אֶת כָּל לִבּוֹ
  choice: ang lahat ng nasa puso niya
  rationale: Inihahatid nito ang Hebreong idyoma bilang ganap na pagsisiwalat. Iniwasan ang ‘buong puso niya,’ na sa makabagong Tagalog ay maaaring mangahulugan lamang ng taimtim na damdamin.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: nagpasugo siya at ipinatawag
  rationale: 'Pinananatili ang dalawang magkakasunod na kilos: ang pagpapadala ng mensahe o sugo at ang pagpapatawag sa mga pinuno.'
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סרן ay tumutukoy sa matataas na pinunong Filisteo. Malinaw at kasalukuyang Tagalog ang ‘mga pinuno,’ samantalang maaaring hindi malinaw ang literal na ‘mga panginoon.’
- source_word: עֲלוּ הַפַּעַם
  choice: Umakyat kayo rito sa pagkakataong ito
  rationale: Pinananatili ang direksiyong pataas ng עלה at ang diin ng הַפַּעַם na ito na ang pagkakataong dapat silang pumunta.
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: sapagkat sinabi na niya sa kanya ang lahat ng nasa puso niya
  rationale: Pinananatili ang ikatlong panauhang pambabae ng tekstong Masoretiko (‘sa kanya’) kahit mas inaasahan sa tuwirang pagsasalita ang ‘sa akin.’
- source_word: וְעָלוּ אֵלֶיהָ
  choice: Kaya umakyat kay Delila
  rationale: Pinananatili ang kilos na pataas patungo kay Delila, habang ginagawang malinaw ang tinutukoy ng pambabaeng panghalip.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: dala ang pilak sa kanilang mga kamay
  rationale: Ang ‘pilak’ ay tuwirang katumbas ng הַכֶּסֶף; ipinahahayag ng ‘dala’ na iniakyat nila ito bilang kabayaran, at pinananatili ang pariralang ‘sa kanilang mga kamay.’
