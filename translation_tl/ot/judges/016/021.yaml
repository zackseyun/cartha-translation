revisions:
- from: Pagkatapos, sinunggaban siya ng mga Filisteo at dinukit ang kanyang mga mata.[a] Dinala nila siya pababa sa Gaza, iginapos ng mga posas na tanso, at pinaggiling sa bilangguan.[b]
  to: Pagkatapos, sinunggaban siya ng mga Filisteo at dinukit ang kanyang mga mata.[a] Dinala nila siya pababa sa Gaza, ikinadena nila siya ng mga tanikalang tanso, at siya ay naggigiling sa bilangguan.[b]
  rationale: Inayos ang pananalita para maging malinaw at natural sa modernong Tagalog, habang pinananatili ang marahas na kongkretong diwa ng נקר, ang direksiyong “pababa,” ang tansong panggapos, at ang nagpapatuloy na paggiling sa loob ng bilangguan.
