  - severity: medium
    issue: Hindi natural ang “pinaggiling.”
    rationale: Ang וַיְהִי טוֹחֵן ay naglalarawan ng kanyang patuloy na kalagayan/gawain bilang naggigiling. Ang “siya ay naggigiling” ay nagpapanatili ng aspektong ito nang hindi tahasang idinaragdag ang pandiwang ‘pinilit.’
