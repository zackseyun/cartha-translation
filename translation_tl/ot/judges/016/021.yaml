  source_fidelity: 'Tumpak ang pangunahing pagkakasunod-sunod at kahulugan: sinunggaban, dinukit ang mga mata, dinala pababa sa Gaza, ginapos ng tansong panggapos, at naggiling sa bilangguan. Gayunman, ang “iginapos ng mga posas” ay hindi ganap na natural sa Tagalog at maaaring magpahiwatig na ang mga posas ang iginapos, sa halip na siya ang ikinadena/ginapos sa mga ito.'
  naturalness: Natural ang karamihan ng salin, kabilang ang “sinunggaban” at “dinukit ang kanyang mga mata.” Mas idiomatiko at malinaw ang “ikinadena nila siya ng mga tanikalang tanso” kaysa “iginapos ng mga posas na tanso.” Ang “pinaggiling” ay hindi ang pinakaangkop na anyo para sa patuloy na gawaing inilalarawan ng Hebreo; “siya ay naggigiling” ay malinaw at hindi nagdadagdag ng layon.
  terminology: Ang “mga Filisteo,” “Gaza,” at “tanso” ay angkop. Ginamit ang “mga tanikala” para sa נְחֻשְׁתַּיִם, na tumutukoy sa metal na panggapos; hindi nito ipinipilit ang mas tiyak na modernong uri ng posas.
