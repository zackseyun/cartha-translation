base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: tl
  text: Pagkatapos, sinunggaban siya ng mga Filisteo at dinukit ang kanyang mga mata.[a] Dinala nila siya pababa sa Gaza, ikinadena nila siya ng mga tanikalang tanso, at siya ay naggigiling sa bilangguan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “binutas ang kanyang mga mata.” Ang pandiwang Hebreo ay isang kongkretong salita para sa marahas na pagsira sa mga mata.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa bahay ng mga bilanggo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: sinunggaban siya
  rationale: Ipinahahayag ng אחז ang sapilitang paghawak sa kanya; natural at mariin ang “sinunggaban” sa kontekstong ito.
- source_word: פְלִשְׁתִּים
  choice: mga Filisteo
  rationale: Karaniwang makabagong anyong Tagalog para sa pangalan ng bayan.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: dinukit ang kanyang mga mata
  rationale: Pinananatili nito ang kongkreto at marahas na kahulugan ng נקר, sa halip na gawing pangkalahatan lamang na “binulag.”
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: Dinala nila siya pababa sa Gaza
  rationale: Ang causative na ירד ay “magdala pababa,” at ang hulaping direksiyonal sa עַזָּתָה ay nagsasaad ng pagpunta sa Gaza.
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: iginapos ng mga posas na tanso
  rationale: Ang אסר ay paggapos, at ang נְחֻשְׁתַּיִם ay pares o kalipunan ng metal na panggapos; malinaw sa modernong Tagalog ang “mga posas na tanso.”
- source_word: וַיְהִי טוֹחֵן
  choice: pinaggiling
  rationale: Ipinahahayag ang nagpapatuloy at sapilitang gawain niya nang hindi nagdaragdag sa pangunahing teksto ng tahasang layon na wala sa Hebreo.
- source_word: בְּבֵית הָאֲסִירִים
  choice: sa bilangguan
  rationale: Natural na katumbas sa Tagalog ng literal na “bahay ng mga bilanggo,” habang ang literal na anyo ay inilalahad sa talababa.
