translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang graphic na karahasan ng Hebreo, ang direksiyong “pababa” patungong Gaza, at ang sapilitang paggawa; iniwasan ang labis na literal na “bahay ng mga bilanggo” sa pangunahing teksto.
