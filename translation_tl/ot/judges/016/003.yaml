translation_notes:
  register: Modernong Filipino na may marangal at tuwirang himig. Iniwasan ang labis na teknikal na terminong pang-arkitektura; ginamit ang “tarangkahan,” “poste,” at “halang” upang maging malinaw sa karaniwang mambabasa. Inilagay ang mga talababa sa mismong pariralang tinutukoy ng bawat alternatibo.
