  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: tl
  text: Humiga si Samson hanggang hatinggabi. Pagsapit ng hatinggabi, bumangon siya at sinunggaban ang mga pinto ng tarangkahan ng lungsod at ang dalawang poste nito. Binunot niya ang mga iyon kasama ang trangka[a], ipinatong sa kanyang mga balikat, at dinala sa tuktok ng burol na nakaharap sa Hebron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “inalis niya ang mga iyon kasama ang trangka.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagbunot o pag-aalis ng mga bagay mula sa kinalalagyan.
    reason: lexical_alternative
  - marker: b
    text: O, “na nasa tapat ng Hebron.” Literal sa Hebreo, “na nasa harap ng Hebron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: nanatiling nakahiga
  rationale: Ang שׁכב ay maaaring mangahulugang humiga o matulog. Sa konteksto, pinananatili ng salin ang pisikal na kalagayan nang hindi tahasang sinasabing natulog siya.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: hanggang hatinggabi / pagsapit ng hatinggabi
  rationale: Ang “hatinggabi” ang natural na katumbas ng literal na “kalahati ng gabi”; ang “pagsapit” ay malinaw na naghahayag ng oras ng sumunod na kilos.
- source_word: וַיֶּאֱחֹז
  choice: mahigpit na hinawakan
  rationale: Ipinahihiwatig ng pandiwa ang matatag at malakas na paghawak; natural ito sa Filipino at angkop sa puwersahang kilos sa salaysay.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: mga pinto ng tarangkahan ng lungsod
  rationale: Tumutukoy ito sa magkapares na pinto ng tarangkahan. Malinaw ang “tarangkahan” bilang pasukan ng lungsod at hindi ito napagkakamalang karaniwang pinto.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: pati ang dalawang poste nito
  rationale: Ang מְזוּזוֹת ay mga poste o hamba sa magkabilang gilid ng pasukan. Ang “poste” ay simple at madaling maunawaan sa modernong Filipino.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: binunot niya ang mga iyon kasama ang halang
  rationale: Sa kontekstong ito, ang נסע ay pag-aalis o pagbunot mula sa kinalalagyan. Nililinaw ng “kasama ang halang” na natanggal ding kasama ng mga pinto at poste ang pahalang na pansara.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: ipinatong sa kanyang mga balikat
  rationale: Direkta at natural na paglalarawan ito sa paglalagay ng mabigat na pasan sa magkabilang balikat.
- source_word: וַיַּעֲלֵם
  choice: dinala
  rationale: Ipinakikita ng naunang pagpatong sa mga balikat ang paraan ng pagdadala; hindi na kailangang ulitin ang ideya ng pagpasan. Ang patutunguhan sa tuktok ay nagpapanatili sa paitaas na kilos.
- source_word: אֶל רֹאשׁ הָהָר
  choice: sa tuktok ng burol
  rationale: Ang רֹאשׁ ay “tuktok,” at ang הָהָר ay maaaring tumukoy sa bundok o burol. Ang “burol” ay natural sa tagpuang inilalarawan nang hindi pinalalaki ang anyong-lupa.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: na nakaharap sa Hebron
  rationale: Pinananatili nito ang larawang heograpikal ng idyomang עַל־פְּנֵי, na maaaring mangahulugang nasa tapat o nakaharap sa isang lugar.
