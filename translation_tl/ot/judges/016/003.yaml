  - severity: medium
    issue: Hindi sapat na tiyak ang “halang” para sa הַבְּרִיחַ.
    rationale: Ang tinutukoy ay ang bar o pahalang na trangka ng tarangkahan. Ang “trangka” ay mas malinaw at natural na modernong Filipino.
