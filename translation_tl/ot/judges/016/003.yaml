revisions:
- from: Nanatiling nakahiga si Samson hanggang hatinggabi. Pagsapit ng hatinggabi, bumangon siya at mahigpit na hinawakan ang mga pinto ng tarangkahan ng lungsod, pati ang dalawang poste nito. Binunot niya ang mga iyon kasama ang halang[a], ipinatong sa kanyang mga balikat, at dinala sa tuktok ng burol na nakaharap sa Hebron.[b]
  to: Humiga si Samson hanggang hatinggabi. Pagsapit ng hatinggabi, bumangon siya at sinunggaban ang mga pinto ng tarangkahan ng lungsod at ang dalawang poste nito. Binunot niya ang mga iyon kasama ang trangka[a], ipinatong sa kanyang mga balikat, at dinala sa tuktok ng burol na nakaharap sa Hebron.[b]
  rationale: Ang rebisyon ay nag-aalis ng di-kinakailangang “mahigpit na,” gumagamit ng mas tuwirang pandiwang “sinunggaban” para sa paghawak, at pinapalitan ang malabong “halang” ng “trangka” para sa gate bar. Nananatili ang timing, mga bahaging binunot, pagdadala sa balikat, at ang hindi labis na tinutukoy na relasyong heograpikal sa Hebron. Nananatiling nakalapat ang mga talababa sa mga pariralang may alternatibong salin.
