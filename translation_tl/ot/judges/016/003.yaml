  naturalness: Natural at malinaw ang pangungusap sa modernong Filipino. Mas tuwiran at mas angkop ang “Humiga” para sa kilos na pandiwa, at “sinunggaban” para sa malakas na paghawak, nang hindi nagdaragdag ng pang-abay.
  terminology: Panatilihin ang “tarangkahan” at “mga poste.” Palitan ang “halang” ng “trangka,” na mas karaniwang tawag sa pahalang na pansara o bar ng pinto/tarangkahan. Walang isyung teolohikal o pangngalang pantangi; “Hebron” ay tama.
