- from: Sinabi ni Delila kay Samson[a], “Hanggang ngayon ay pinaglalaruan mo ako at puro kasinungalingan ang sinasabi mo sa akin. Sabihin mo sa akin kung ano ang maaaring ipanggapos sa iyo.” Sinabi niya rito, “Kung ihahabi mo ang pitong tirintas ng buhok ko kasama ng hinabing tela.”
  to: Sinabi ni Delila kay Samson[a], “Hanggang ngayon ay pinaglalaruan mo ako at puro kasinungalingan ang sinasabi mo sa akin. Sabihin mo sa akin kung ano ang maaaring ipanggapos sa iyo.” Sumagot siya sa kanya, “Kung ihahabi mo ang pitong tirintas ng buhok ko sa telang hinahabi.”
  rationale: Inayos ang paglalarawan sa terminong panghahabi upang maging malinaw at natural sa Filipino, nang hindi isinasantabi ang pinag-uusapang leksikal na kawalang-katiyakan, na pinanatili sa talababa. Ginawang mas likas din ang pambungad ng tugon ni Samson.
