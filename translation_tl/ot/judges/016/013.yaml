base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: tl
  text: Sinabi ni Delila kay Samson[a], “Hanggang ngayon ay pinaglalaruan mo ako at puro kasinungalingan ang sinasabi mo sa akin. Sabihin mo sa akin kung ano ang maaaring ipanggapos sa iyo.” Sumagot siya sa kanya, “Kung ihahabi mo ang pitong tirintas ng buhok ko sa telang hinahabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin ang huling pangungusap na, “Kung ihahabi mo sa habihan ang pitong kumpol ng buhok ko,” o “Kung ihahabi mo ang pitong tirintas ng buhok ko kasama ng telang hinahabi.” Medyo teknikal at hindi ganap na tiyak ang terminong Hebreo na may kaugnayan sa paghahabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַלְתָּ בִּי
  choice: pinaglalaruan mo ako
  rationale: Ipinahahayag nito ang mapanlinlang na pakikitungo o paggawa ng biro sa isang tao, habang iniiwasang ulitin ang diwa ng tahasang pagsisinungaling sa kasunod na parirala.
- source_word: כְּזָבִים
  choice: puro kasinungalingan
  rationale: Natural na modernong Tagalog para sa maramihang kabulaanang sinabi; ipinahihiwatig ng “puro” ang paulit-ulit na pagsasabi ng mga kasinungalingan.
- source_word: הַגִּידָה לִּי
  choice: Sabihin mo sa akin
  rationale: Direkta at natural na katumbas ng pautos na anyong nangangahulugang magsabi o magpahayag.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: kung ano ang maaaring ipanggapos sa iyo
  rationale: Pinananatili ang instrumental na “sa pamamagitan ng ano” at ang pasibong diwa ng pandiwa.
- source_word: תַּאַרְגִי
  choice: ihahabi mo
  rationale: Ang pandiwa ay karaniwang tumutukoy sa paghahabi, at ang anyong Filipino ay angkop sa kondisyonal na pangungusap.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: ang pitong tirintas ng buhok ko
  rationale: Ang מַחְלְפוֹת ay maaaring tumukoy sa mga hibla, kumpol, o tirintas ng buhok; malinaw at natural sa konteksto ang “tirintas ng buhok.”
- source_word: עִם הַמַּסָּכֶת
  choice: kasama ng hinabing tela
  rationale: Pinananatili ng “kasama ng” ang payak na halaga ng עִם, samantalang ang “hinabing tela” ay kumakatawan sa espesyal na terminong panghahabi nang hindi tiyakang ipinapalagay na habihan mismo ang tinutukoy.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “pinaglalaruan” upang dalhin ang diwa ng mapanlinlang na panunukso, at nilagyan ng talababa ang hindi tiyak na terminolohiyang panghahabi.
