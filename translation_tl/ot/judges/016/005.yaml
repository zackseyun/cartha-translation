  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: tl
  text: Pagkatapos, pinuntahan siya ng mga pinuno ng Filisteo at sinabi sa kanya, “Akitin mo siya at alamin kung saan nakasalalay ang malaki niyang lakas, at kung paano namin siya madadaig upang maigapos namin siya at pahirapan siya. Bibigyan ka ng bawat isa sa amin ng isang libo at isang daang pilak.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “isang libo at isang daang pilak.” Maaaring tumukoy ito sa 1,100 piraso o siklo ng pilak mula sa bawat pinuno ng Filisteo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: pinuntahan siya
  rationale: Likas sa modernong Tagalog at malinaw na naghahayag ng paglapit sa babae; hindi kailangang gawing literal ang pataas na direksiyon ng עלה.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סרן ay natatanging titulo ng mga namamahalang Filisteo; malinaw at marangal sa Tagalog ang “mga pinuno” nang hindi nagpapahiwatig ng pyudal na titulong wala sa kulturang Filipino.
- source_word: פַּתִּי
  choice: Akitin mo
  rationale: Ipinahihiwatig ng piel imperative ang mapanlinlang na panghihikayat o panunukso. Pinananatili ng “akitin” ang manipulasyong iyon nang hindi ipinapalagay na tahasang seksuwal ang paraan.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: at alamin kung saan nagmumula ang pambihira niyang lakas
  rationale: Sa konteksto, ang בַּמֶּה ay nagtatanong sa batayan o lihim ng lakas. Natural sa Tagalog ang “kung saan nagmumula,” at ang “pambihira niyang lakas” ay malinaw na kumakatawan sa כֹּחוֹ גָדוֹל.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: at kung paano namin siya madadaig
  rationale: Ang יכל ל ay nangangahulugang manaig o makapangibabaw laban sa isang tao. Ang “madadaig” ay natural, tuwiran, at hindi mas makitid kaysa sa Hebreong idyoma.
- source_word: וַאֲסַרְנֻהוּ
  choice: upang maigapos namin siya
  rationale: Ipinakikita ng “upang” ang layunin o kasunod na resultang ipinahihiwatig ng pagkakasunod ng mga sugnay, habang tumpak na isinasalin ng “maigapos” ang אסר.
- source_word: לְעַנֹּתוֹ
  choice: at pahirapan
  rationale: 'Malawak ang saklaw ng piel ng ענה: pahirapan, apihin, hamakin, o supilin. Pinananatili ng “pahirapan” ang diwa ng pagdudulot ng paghihirap nang hindi ito nililimitahan sa tortyur.'
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: Bibigyan ka ng bawat isa sa amin ng isang libo at isang daang pilak
  rationale: Distributibo ang אִישׁ, kaya “bawat isa sa amin.” Hindi tahasang binanggit sa Hebreo ang yunit pagkatapos ng bilang, kaya pinanatili sa teksto ang literal na “pilak” at ipinaliwanag sa talababa ang malamang na kahulugan.
