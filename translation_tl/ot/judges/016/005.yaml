  to: Pagkatapos, pinuntahan siya ng mga pinuno ng Filisteo at sinabi sa kanya, “Akitin mo siya at alamin kung saan nakasalalay ang malaki niyang lakas, at kung paano namin siya madadaig upang maigapos namin siya at pahirapan siya. Bibigyan ka ng bawat isa sa amin ng isang libo at isang daang pilak.”[a]
