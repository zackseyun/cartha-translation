translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang payak ngunit dignified na bokabularyo; iniwasan ang labis na literal na ayos ng Hebreo at ang mga salitang maaaring magpasok ng di-tiyak na seksuwal o teknikal na kahulugan. Inilagay ang talababa pagkatapos ng pariralang paliwanag nito.
