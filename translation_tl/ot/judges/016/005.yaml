  source_fidelity: 'Kailangang iwasto ang ilang bahagyang paglihis: ang “pambihira” ay mas malakas kaysa sa גָּדוֹל (“malaki/dakila”), at dapat malinaw na ang pagpapahirap ay layunin ng paggapos at si Samson ang layon nito. Ang distributibong “bawat isa sa amin” at ang di-tiyak na yunit ng “pilak” ay wastong napapanatili.'
  naturalness: Natural at marangal ang pangkalahatang Tagalog. Gayunman, mas malinaw at mas maayos ang ugnayan ng layunin sa “upang maigapos namin siya at pahirapan siya.” Ang talababa ay dapat nakaangkla mismo sa halaga ng pilak, hindi sa hulihan ng buong pangungusap.
  terminology: Ang “mga pinuno ng Filisteo,” “akitin,” “madadaig,” at “maigapos” ay angkop. Pinalitan ang “pambihira niyang lakas” ng “malaki niyang lakas” upang huwag dagdagan ang antas ng kahulugan ng Hebreo.
