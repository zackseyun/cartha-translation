  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: tl
  text: Sinabi niya sa babae, “Kung gagapusin nila ako ng mga bagong lubid na hindi pa nagagamit sa anumang gawain, manghihina ako at magiging tulad ng karaniwang tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Sinabi niya sa babae
  rationale: Likas na salaysay sa modernong Tagalog; malinaw ang babaeng kausap kahit hindi pinapangalanan sa talata.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Kung gagapusin nila ako
  rationale: Inililipat ang kondisyunal at emphatic Hebrew construction nang natural, nang hindi nagdaragdag ng di-tiyak na ideya gaya ng “mahigpit.”
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: ng mga bagong lubid
  rationale: Ang “lubid” ay malinaw at karaniwang katumbas ng makakapal na tali o kordon sa kontekstong ito.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: na hindi pa nagagamit sa anumang gawain
  rationale: Natural na Tagalog para sa literal na diwa na wala pang gawaing isinagawa sa pamamagitan ng mga ito; pinananatili ang pagiging di-pa-nagagamit ng mga lubid.
- source_word: וְחָלִיתִי
  choice: manghihina ako
  rationale: Tumpak sa diwa ng pagkawala ng pambihirang lakas ni Samson at natural sa Tagalog.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: at magiging tulad ng karaniwang tao
  rationale: Ipinapahayag ang paghahambing kay Samson sa isang ordinaryong tao nang hindi ipinipilit ang kasariang hindi kailangang tahasang markahan sa Tagalog.
theological_decisions:
- issue: Diwa ng כְּאַחַד הָאָדָם
  choice: tulad ng karaniwang tao
  alternative: tulad ng isa sa mga lalaki
  rationale: Sa konteksto, ang punto ay magiging gaya siya ng isang ordinaryong taong walang pambihirang lakas. Mas likas at malinaw ito sa Tagalog, habang hindi ginagawang abstraktong “sangkatauhan” ang parirala.
translation_notes:
  register: Modernong Filipino Tagalog na payak ngunit marangal. Pinanatili ang tuwirang pananalita at ang kondisyonal na anyo; iniwasan ang salitang “mahigpit” dahil hindi tiyak na iyon ang espesipikong diin ng infinitive absolute.
