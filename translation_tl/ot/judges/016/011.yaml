  source_fidelity: 'Tumpak ang salin sa Hebreo: ang kondisyunal na pagpapagapos, mga bagong lubid na hindi pa nagagamit sa gawain, ang panghihina, at paghahambing sa isang ordinaryong tao ay lahat naipahayag. Ang “gagapusin” ay sapat na natural na katumbas ng emphatic na konstruksyong “pagbigkis ay igagapos nila ako” nang hindi nagdaragdag ng ideyang wala sa teksto.'
  naturalness: Likas, malinaw, at angkop sa modernong Filipino Tagalog ang daloy ng pangungusap. Ang “mga bagong lubid” at “hindi pa nagagamit sa anumang gawain” ay madaling maunawaan at marangal ang rehistro.
  terminology: Ang “lubid,” “manghihina,” at “karaniwang tao” ay angkop sa kontekstong salaysay. Ang “karaniwang tao” ay natural na Tagalog na naglalahad ng kontrast sa pambihirang lakas ni Samson nang hindi nag-uutos ng di-likas na pagmamarka ng kasarian sa Tagalog.
