base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: tl
  text: Nagtipon ang mga pinuno ng mga Filisteo upang maghandog ng isang malaking hain kay Dagon na kanilang diyos at upang magdiwang. Sinabi nila, “Ibinigay ng ating diyos sa ating kamay[a] si Samson na ating kaaway.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “sa ating kamay” ay isang Hebreong idyoma na nangangahulugang nasa ilalim ng ating kapangyarihan o kontrol.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: mga pinuno ng mga Filisteo
  rationale: Ang סֶרֶן ay tumutukoy sa mga namumunong opisyal ng mga lungsod-estado ng Filisteo. Malinaw at natural sa makabagong Filipino ang “mga pinuno.”
- source_word: נֶאֱסְפוּ
  choice: nagtipon
  rationale: Ipinahihiwatig ng Niphal ng אסף ang sama-samang pagdating o pagtitipon ng isang pangkat.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: upang maghandog ng isang malaking hain
  rationale: Ang pandiwang pawatas at kaugnay nitong pangngalan ay tumutukoy sa isang dakilang paghahandog. Iniiwasan ng salin ang alanganing literal na pag-uulit ngunit pinananatili ang diin.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: kay Dagon na kanilang diyos
  rationale: Tuwirang kinikilala si Dagon bilang diyos na pinag-uukulan ng hain; natural sa Filipino ang pang-ugnay na “na.”
- source_word: וּלְשִׂמְחָה
  choice: at upang magdiwang
  rationale: Sa konteksto, ang שִׂמְחָה ay tumutukoy sa masayang pagdiriwang kaugnay ng tagumpay.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: ibinigay ... sa ating kamay
  rationale: Pinananatili nito ang Hebreong larawan ng pagkakaloob sa kamay, na nangangahulugang pagpapasailalim sa kapangyarihan o kontrol.
- source_word: אוֹיְבֵינוּ
  choice: ating kaaway
  rationale: Bagaman anyong maramihan ang hulapi, si Samson ang iisang tinutukoy; kaya ang isahan ay angkop sa konteksto.
theological_decisions:
- issue: Paglalarawan sa אֱלֹהֵיהֶם / אֱלֹהֵינוּ sa kontekstong pagano
  choice: kanilang diyos / ating diyos
  alternative: kanilang mga diyos / ating mga diyos
  rationale: Ang dalawang gamit ay tumutukoy sa pinangalanang diyos na si Dagon. Pinananatili ng isahan ang agarang sintaks at pokus ng talata nang hindi nagdaragdag ng konseptong maramihan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “hain” at “maghandog” bilang karaniwang bokabularyong panrelihiyon. Inilipat ang talababa sa mismong idyomang nangangailangan ng paliwanag; walang batayan sa ibinigay na English footnotes ang marker na nakakabit sa “celebrate,” sapagkat ang nilalaman nitong alternatibo ay tumutukoy sa “rulers.”
