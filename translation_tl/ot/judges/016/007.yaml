  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: tl
  text: Sinabi sa kanya ni Samson, “Kung igagapos nila ako gamit ang pitong bagong kuwerdas ng pana na hindi pa natutuyo, manghihina ako at magiging gaya ng karaniwang tao.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Sinabi sa kanya ni Samson
  rationale: Likas na salaysay sa modernong Tagalog; pinananatili ang simpleng pag-usad ng Hebreong wayyiqtol nang hindi dinaragdagan ang ugnayang lohikal.
- source_word: אִם יַאַסְרֻנִי
  choice: Kung igagapos nila ako
  rationale: Ang ikatlong panauhang maramihan ay may di-tiyak na tagaganap; natural itong naipahahayag sa Tagalog sa pamamagitan ng “nila” nang walang tinutukoy na partikular na grupo.
- source_word: בְּשִׁבְעָה יְתָרִים
  choice: gamit ang pitong ... kuwerdas ng pana
  rationale: Instrumental ang ב; sa konteksto, ang יְתָרִים ay mga kuwerdas ng pana, hindi pangkalahatang lubid lamang.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: bagong ... na hindi pa natutuyo
  rationale: Ang לַחִים ay sariwa o mamasa-masa, at nililinaw ng kasunod na sugnay na hindi pa natutuyo ang mga kuwerdas. Ang “bagong” ay natural sa Tagalog para sa kuwerdas na sariwa at hindi pa tuyo.
- source_word: וְחָלִיתִי
  choice: manghihina ako
  rationale: Sa konteksto, tumutukoy ang חלה sa pagkawala ng lakas, kaya mas angkop ang “manghihina” kaysa sa “magkakasakit.”
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: at magiging gaya ng karaniwang tao
  rationale: Ipinahahayag ng idyoma ang pagiging tulad ng ibang ordinaryong tao, salungat sa pambihirang lakas ni Samson. Natural at malinaw ito sa modernong Tagalog.
theological_decisions:
- issue: Kahulugan ng אָדָם sa pariralang paghahambing
  choice: gaya ng karaniwang tao
  alternative: gaya ng isa sa mga lalaki
  rationale: Maaaring panatilihin nang mas literal ang anyong may kasariang panlalaki, ngunit idiomatiko rito ang אָדָם para sa ordinaryong tao. Ang “karaniwang tao” ay tumpak sa konteksto at hindi nagdaragdag ng doktrinal na pakahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “kuwerdas ng pana” para sa katumpakan at ang “igagapos” upang ipakita ang mahigpit na pagtatali kay Samson.
