  naturalness: Ang rebisadong salin ay gumagamit ng malinaw at makabagong Filipino habang pinananatili ang maigting na anyo ng biglaang babala at ang metaporang Hebreo.
  terminology: Ang "Filisteo," "mga panali," at "estopa" ay angkop sa salaysay. Ang "estopa" ay mas tumpak kaysa "sinulid na lino" para sa נְעֹרֶת (tow/flax fiber).
