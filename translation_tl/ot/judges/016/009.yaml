base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: tl
  text: May nakaabang para sa kanya sa loob ng silid, at sinabi niya kay Samson, “Ang mga Filisteo ay nasa iyo na, Samson!” Ngunit nilagot niya ang mga panali gaya ng pagkakalagot ng hibla ng estopa kapag nakaamoy ito ng apoy, at hindi nalaman ang kanyang lakas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֹרֵב
  choice: May mga lalaking nag-aabang
  rationale: Ang singular collective na אֹרֵב ay tumutukoy sa mga taong nakatago at naghihintay upang sumalakay; natural sa Tagalog ang tahasang maramihan.
- source_word: יֹשֵׁב לָהּ בַּחֶדֶר
  choice: nag-aabang para sa kanya sa loob ng silid
  rationale: Pinananatili ang pronominal na לָהּ, bagaman maaaring idiomatikong ipahiwatig nito na nakaabang sila ayon sa kanyang plano o sa kanyang kapakanan.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Narito na ang mga Filisteo para hulihin ka!
  rationale: Ang idiomang 'upon you' ay ginawang malinaw at natural na babala sa Tagalog nang hindi nagdaragdag ng paraan ng pagsalakay.
- source_word: הַיְתָרִים
  choice: mga panali
  rationale: Sa konteksto, tumutukoy ito sa mga sariwa at hindi pa natutuyong litid o kordon na ginamit sa pagtali; 'mga panali' ang malinaw na tawag sa tungkulin ng mga ito.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: sinulid na lino
  rationale: Ang נְעֹרֶת ay hibla o estopa ng lino; ang payak na 'sinulid na lino' ay mas madaling maunawaan, habang pinananatili ang larawan ng marupok na hibla.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: kapag nadikit sa apoy
  rationale: Ang literal na 'kapag nakaamoy ng apoy' ay isang matalinghagang paraan ng pagsasabing nalantad o napalapit sa apoy; ang salin ay natural sa Tagalog at pinananatili ang diwa ng mabilis na pagkalagot.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: hindi natuklasan ang pinagmumulan ng kanyang lakas
  rationale: Ang נודע ay 'nalaman/natuklasan'; ipinahihiwatig ng konteksto na ang lihim o pinagmumulan ng lakas ang hindi pa nalalaman.
