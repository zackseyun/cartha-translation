  to: May nakaabang para sa kanya sa loob ng silid, at sinabi niya kay Samson, “Ang mga Filisteo ay nasa iyo na, Samson!” Ngunit nilagot niya ang mga panali gaya ng pagkakalagot ng hibla ng estopa kapag nakaamoy ito ng apoy, at hindi nalaman ang kanyang lakas.
  rationale: Inalis ang idinagdag na layuning "hulihin ka" at ang idinagdag na "pinagmumulan." Ipinanumbalik ang metaporang Hebreo tungkol sa hibla na nakaaamoy ng apoy. Ang "may nakaabang" ay pinananatiling di-tiyak sa bilang, gaya ng singular na anyong Hebreo na maaaring kolektibo.
