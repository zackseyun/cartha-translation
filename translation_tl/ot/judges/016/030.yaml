revisions:
- from: Sinabi ni Samson, “Mamatay na ako kasama ng mga Filisteo.”[a] Pagkatapos, dumagan siya nang buong lakas, at bumagsak ang gusali[c] sa mga pinuno[b] at sa lahat ng taong naroon. Kaya mas marami ang napatay niya sa pagkamatay niya kaysa sa napatay niya noong nabubuhay pa siya.
  to: Sinabi ni Samson, “Mamatay ako kasama ng mga Filisteo.”[a] Pagkatapos, yumuko siya nang buong lakas, at bumagsak ang gusali[c] sa ibabaw ng mga pinuno[b] at ng lahat ng taong nasa loob nito. Kaya, ang mga namatay na napatay niya sa pagkamatay niya ay mas marami kaysa sa mga napatay niya habang nabubuhay siya.
  rationale: Pinalitan ang hindi malinaw na “dumagan” ng “yumuko,” na mas malapit sa kilos na ipinahihiwatig ng Hebreo at likas sa Tagalog. Nilinaw ang pagbagsak ng gusali “sa ibabaw ng” mga tao. Inayos din ang talababa upang maipakita ang literal na “aking kaluluwa” habang nililinaw na idyomatiko itong tumutukoy sa buong sarili ni Samson, nang walang doktrinal na pagdaragdag.
