base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: tl
  text: Sinabi ni Samson, “Mamatay ako kasama ng mga Filisteo.”[a] Pagkatapos, yumuko siya nang buong lakas, at bumagsak ang gusali[c] sa ibabaw ng mga pinuno[b] at ng lahat ng taong nasa loob nito. Kaya, ang mga namatay na napatay niya sa pagkamatay niya ay mas marami kaysa sa mga napatay niya habang nabubuhay siya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “Mamatay ang aking kaluluwa kasama ng mga Filisteo.” Dito, ang “aking kaluluwa” ay isang idyomang Hebreo na tumutukoy kay Samson mismo.
    reason: lexical_alternative
  - marker: b
    text: O “mga panginoon” ng mga Filisteo.
    reason: lexical_alternative
  - marker: c
    text: O “bahay.” Karaniwang salita para sa “bahay” ang ginamit sa Hebreo, ngunit maaari rin itong tumukoy sa isang gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Mamatay na ako
  rationale: Ang נַפְשִׁי ay idyomatikong tumutukoy kay Samson mismo, hindi sa isang hiwalay na bahagi niyang tinatawag na kaluluwa. Ang “Mamatay na ako” ay likas sa modernong Tagalog at nagpapanatili sa kusang pagtanggap niya sa kamatayan.
- source_word: עִם פְּלִשְׁתִּים
  choice: kasama ng mga Filisteo
  rationale: Tuwirang ipinahahayag ng עִם na mamamatay si Samson kasabay ng mga Filisteo.
- source_word: וַיֵּט בְּכֹחַ
  choice: dumagan siya nang buong lakas
  rationale: Ang נטה ay maaaring mangahulugang yumuko, humilig, o magbigay ng bigat. Sa konteksto ng mga haligi, ipinahihiwatig ng “dumagan” ang pagdiin ni Samson gamit ang katawan at buong lakas nang hindi inuulit ang bagay na binanggit sa naunang talata.
- source_word: הַבַּיִת
  choice: ang gusali
  rationale: Karaniwang nangangahulugang “bahay” ang בַּיִת, ngunit maaari rin itong tumukoy sa isang gusali. Mas malinaw dito ang “gusali” dahil ang tinutukoy ay malaking estrukturang kinaroroonan ng mga pinuno at maraming tao; hindi ipinapasok ng salin ang mas tiyak na “templo.”
- source_word: הַסְּרָנִים
  choice: mga pinuno
  rationale: Ang סְרָנִים ay katawagan sa mga namumunong Filisteo. Malinaw at kasalukuyang Tagalog ang “mga pinuno,” samantalang ang “mga panginoon” ay maaaring magbigay ng ibang kahulugan.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: sa lahat ng taong naroon
  rationale: Pinananatili nito ang kabuuang saklaw ng כָּל at likas na ipinahahayag sa Tagalog na nasa loob ng gusali ang mga tao.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: ang napatay niya sa pagkamatay niya
  rationale: Pinananatili ng parirala ang kaugnayan ng mga kamatayang idinulot ni Samson sa mismong pangyayari ng kanyang sariling pagkamatay.
- source_word: רַבִּים מֵאֲשֶׁר
  choice: mas marami ... kaysa
  rationale: Ito ang natural na paghahambing sa Tagalog at tumpak na nagsasaad na higit ang bilang ng napatay niya sa huling pangyayari.
- source_word: בְּחַיָּיו
  choice: noong nabubuhay pa siya
  rationale: Malinaw at natural nitong ipinakikita ang pagtutol sa “sa pagkamatay niya.”
theological_decisions:
- issue: Paglalarawan sa huling sinabi ni Samson nang hindi nagpapasok ng partikular na doktrina tungkol sa kaluluwa
  choice: Mamatay na ako kasama ng mga Filisteo
  alternative: Mamatay ang kaluluwa ko kasama ng mga Filisteo
  rationale: Dito, ang נֶפֶשׁ ay idyoma para sa sarili o buong persona. Iniiwasan ng pangunahing salin ang impresyong may itinuturong paghihiwalay ng kaluluwa at katawan, habang itinatala sa talababa ang mas literal na anyo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal, na may natural na daloy ng salaysay. Ginamit ang “Filisteo,” “pinuno,” at “gusali” bilang madaling maunawaang mga katawagan; iniwasan ang arkaykong pananalita at ang labis na espesipikong “templo.”
