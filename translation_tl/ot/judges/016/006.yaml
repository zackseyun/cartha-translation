base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: tl
  text: Pagkatapos, sinabi ni Delila kay Samson, “Sabihin mo nga sa akin kung saan nakasalalay ang napakalaki mong lakas, at kung paano ka maigagapos upang apihin ka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “upang pahirapan ka” o “upang supilin ka.” Ang Hebreong pandiwa ay maaaring mangahulugang mang-api, magpakumbaba, o, sa kontekstong ito, supilin o daigin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Pagkatapos, sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Filipino ang “Pagkatapos, sinabi” upang ipakita ang kasunod na pangyayari.
- source_word: דְּלִילָה אֶל שִׁמְשׁוֹן
  choice: ni Delila kay Samson
  rationale: Ginamit ang karaniwang anyong Filipino ng mga pangalang Delila at Samson, at ang “kay” para sa kausap.
- source_word: הַגִּידָה נָּא לִי
  choice: Pakisabi sa akin
  rationale: Ipinahahayag ng נָא ang magalang o mapakiusap na tono; maikli at likas sa Filipino ang “Pakisabi sa akin.”
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: kung saan nagmumula ang pambihira mong lakas
  rationale: Ang literal na “sa ano” ay tumutukoy sa pinagmumulan o batayan ng lakas. Ang “pambihira mong lakas” ay malinaw at natural na pagpapahayag ng כֹּחֲךָ גָדוֹל.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: at kung paano ka maigagapos
  rationale: Ang Niphal na תֵאָסֵר ay nangangahulugang “magapos” o “matali,” at ang בַּמֶּה rito ay nagtatanong sa paraan o kasangkapan.
- source_word: לְעַנּוֹתֶךָ
  choice: upang madaig ka
  rationale: Sa konteksto, ang Piel ng ענה ay tumutukoy sa pagpapasailalim o paggapi kay Samson. Pinananatili ng “madaig” ang kontekstuwal na diwa nang hindi ipinapasok ang mas tiyak na ideya ng pagpapahirap.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “pambihira” sa halip na literal na “dakila” para sa lakas, at “madaig” bilang kontekstuwal ngunit hindi sektaryong salin ng לְעַנּוֹתֶךָ.
