base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: tl
  text: Nang masaya na ang kanilang kalooban, sinabi nila, “Ipatawag ninyo si Samson upang magbigay-aliw siya sa atin.” Kaya ipinatawag nila si Samson mula sa bilangguan, at nagbigay-aliw siya sa harap nila.[a] Pagkatapos, pinatayo nila siya sa pagitan ng mga haligi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang mga pandiwang Hebreo rito ay maaaring tumukoy sa pagbibigay-aliw, pagtatanghal, o pagiging tampulan ng pangungutya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: nang masaya na ang kanilang kalooban
  rationale: Ang idyoma ay literal na nagsasabing ‘mabuti ang kanilang puso’ at tumutukoy sa pagiging masaya o masigla. Pinananatili ng ‘kalooban’ ang larawang Hebreo sa likas na Filipino.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: Ipatawag ninyo si Samson
  rationale: Ang קרא na may ל ay nangangahulugang ipatawag o papuntahin ang isang tao. Ang ‘ipatawag’ ay likas sa konteksto ng isang utos.
- source_word: וִישַׂחֶק לָנוּ / וַיְצַחֵק לִפְנֵיהֶם
  choice: upang magbigay-aliw siya sa atin / nagbigay-aliw siya sa harap nila
  rationale: Sa kontekstong ito, ang magkaugnay na mga pandiwa ay tumutukoy sa pagbibigay ng aliw o pagtatanghal na maaaring may kasamang pangungutya. Pinananatili ng salin ang pagkakapareho ng kahilingan at ng sumunod na pangyayari nang hindi ipinapalagay ang tiyak na anyo ng ginawa ni Samson.
- source_word: מִבֵּית הָאֲסִירִים
  choice: mula sa bilangguan
  rationale: Literal itong ‘mula sa bahay ng mga bilanggo,’ isang karaniwang kongkretong tawag sa bilangguan. Ang ‘bilangguan’ ang malinaw at natural na katumbas sa modernong Filipino.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: pinatayo nila siya sa pagitan ng mga haligi
  rationale: Ang anyong sanhi ng עמד ay nangangahulugang pinatayo o inilagay sa nakatayong posisyon. Ipinahahayag ng ‘pinatayo’ ang pagkontrol nila kay Samson.
theological_decisions: []
translation_notes:
  register: Gumamit ng natural at marangal na modernong Filipino. Pinanatili ang Hebreong larawan ng ‘kalooban’ at ang hindi tiyak na saklaw ng mga pandiwang tumutukoy sa aliw, pagtatanghal, at pangungutya.
