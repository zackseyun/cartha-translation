  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: tl
  text: Sinabi ni Manoa sa anghel ng PANGINOON, “Pakiusap, huwag ka muna sanang umalis, at maghahanda kami para sa iyo ng isang batang kambing.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Pakiusap, manatili ka muna rito
  rationale: Ang cohortative na may נָא ay magalang na pakiusap na pigilang umalis o patagalin ang panauhin. Mas natural sa modernong Tagalog ang “manatili ka muna rito” kaysa literal na “pigilan ka namin.”
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: upang maipaghanda ka namin
  rationale: Sa konteksto ng pagpapatuloy sa panauhin, ang paggawa “sa harap mo” ay idiomatikong paghahanda para sa kaniya; pinananatili ng “maipaghanda ka namin” ang layuning pagpapakita ng mabuting pagtanggap.
- source_word: גְּדִי עִזִּים
  choice: isang batang kambing
  rationale: Karaniwang Hebreong parirala para sa isang batang kambing; hindi kailangang ulitin ang diwang “kambing ng mga kambing” sa Tagalog.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ng PANGINOON
  rationale: Ginagamit ang nakasanayang salin ng titulong ito at ang maliit na kapital na PANGINOON bilang representasyon ng banal na pangalang יהוה.
theological_decisions:
- issue: Kung handog ba o pagkain ang batang kambing
  choice: maipaghanda ka namin ng isang batang kambing
  alternative: makapaghain kami sa harap mo ng isang batang kambing
  rationale: Hindi tahasang sinasabi ng talata kung ang kambing ay pagkain o handog. Ang “maipaghanda” ay hindi nagpapasya nang lampas sa teksto, habang ang kasunod na talata ang lilinaw sa usapin ng handog.
translation_notes:
  register: Makabago, magalang, at marangal na Filipino. Ginamit ang “manatili ka muna rito” bilang likas na pahayag ng pagpapatuloy sa panauhin, at iniwasan ang teknikal o makalumang pananalita.
