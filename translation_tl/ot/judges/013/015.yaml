  terminology: Wasto ang “Manoa,” “anghel ng PANGINOON,” at “batang kambing.” Ang “para sa iyo” ay hindi nagpapasiya kung ang ihahanda ay pagkain o handog, at tumutugma sa gamit ng Ingles na audit trail na “for you.”
