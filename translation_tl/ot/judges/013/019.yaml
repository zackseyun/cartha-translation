language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: tl
  text: Kaya kinuha ni Manoa ang batang kambing at ang handog na butil, at inihandog niya ang mga iyon sa ibabaw ng bato kay Yahweh. Gumawa siya ng isang kamangha-manghang bagay[a] habang nakatingin si Manoa at ang asawa nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “Gumawa ng isang kamangha-manghang bagay ang anghel ni Yahweh.” Hindi tahasang inuulit sa Hebreo ang simuno, bagaman itinuturo ng konteksto ang mensahero ni Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: ang batang kambing
  rationale: Natural na katumbas sa modernong Tagalog para sa batang hayop na kambing, at malinaw na pinananatili ang hayop na ihahandog.
- source_word: הַמִּנְחָה
  choice: ang handog na butil
  rationale: Sa kontekstong paghahandog, karaniwang tumutukoy ang מִנְחָה sa handog na mula sa butil; mas malinaw ito kaysa sa pangkalahatang “handog.”
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: inihandog niya ang mga iyon sa ibabaw ng bato kay Yahweh
  rationale: Ang עלה sa kontekstong pansakripisyo ay nangangahulugang maghandog. Ginawang tahas ang panghalip na tumutukoy kay Manoa at ang maramihang layon upang natural na tumukoy sa kambing at handog na butil.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Ginamit ang personal na pangalan na Yahweh upang tuwirang katawanin ang יהוה at maging natural ang ugnayang ipinahihiwatig ng ל sa Tagalog.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: Gumawa siya ng isang kamangha-manghang bagay
  rationale: Pinananatili ang panlalaking isahang simuno nang hindi tahasang pinapangalanan, sapagkat hindi inuulit ng Hebreo ang simuno bagaman itinuturo ng konteksto ang mensahero ni Yahweh.
- source_word: רֹאִים
  choice: habang nakatingin
  rationale: Ipinahihiwatig ng participle ang nagpapatuloy na pagkilos; natural na naihahatid ito ng “habang nakatingin.”
theological_decisions:
- issue: Hindi tahasang binanggit na simuno ng וּמַפְלִא לַעֲשׂוֹת
  choice: “Gumawa siya,” na hindi pinapangalanan ang simuno sa pangunahing teksto
  alternative: “Gumawa ng isang kamangha-manghang bagay ang anghel ni Yahweh” o “may nangyaring kamangha-mangha”
  rationale: Siksik at eliptikal ang sugnay sa Hebreo. Malakas na ipinahihiwatig ng konteksto na ang mensahero ni Yahweh ang gumagawa, ngunit hindi siya tahasang muling pinangalanan sa talata. Pinananatili ng panghalip at talababa ang tunay na kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “asawa nito” upang maiwasan ang kalituhan sa tinutukoy ng “niya,” at inilagay ang talababa sa mismong sugnay na may kalabuan.
