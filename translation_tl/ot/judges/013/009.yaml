  source_fidelity: 'Tumpak na naipapahayag ang lahat ng pangunahing sangkap ng Hebreo: ang pagtugon ng Diyos kay Manoa, ang muling pagdating ng anghel ng Diyos sa babae, ang kanyang pagkakaupo sa bukid, at ang kawalan ni Manoa sa kanyang tabi. Ang “dininig” ay angkop sa kontekstong tugon sa naunang panalangin, nang hindi isinasalin ang “tinig” bilang mas mapagpaliwanag na “kahilingan.”'
  naturalness: Natural at malinaw ang modernong Filipino. Ang paghahati sa dalawang pangungusap ay hindi nakababago sa ugnayan o daloy ng pangyayari. Maliwanag ang “siya” sa unang pangungusap mula sa naunang “babae,” at ang “Hindi niya kasama noon” ay likas na tumutukoy sa babae sa sandaling iyon.
  terminology: Ang “Diyos,” “anghel ng Diyos,” “babae,” “bukid,” at “asawa niyang si Manoa” ay pare-pareho, angkop sa salaysay, at hindi nagpapasok ng di-kailangang pagpapakahulugang teolohikal. Wasto rin ang anyong “Manoa.”
