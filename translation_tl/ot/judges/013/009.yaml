  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: tl
  text: Dininig ng Diyos ang tinig ni Manoa, at muling dumating sa babae ang anghel ng Diyos habang nakaupo siya sa bukid. Hindi niya kasama noon ang asawa niyang si Manoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Dininig
  rationale: Ang שׁמע ay maaaring mangahulugang ‘narinig’ o ‘dininig/pinakikinggan.’ Dahil tugon ito ng Diyos sa panalangin ni Manoa sa naunang talata, ang ‘dininig’ ay likas na nagpapahayag ng mapagkalingang pakikinig at pagtugon.
- source_word: בְּקוֹל מָנוֹחַ
  choice: ang tinig ni Manoa
  rationale: Pinananatili nito ang Hebreong idyomang ‘makinig sa tinig’ sa paraang marangal at nauunawaan sa Filipino; hindi ito ginawang ‘kahilingan’ upang maiwasan ang labis na pagpapakahulugan.
- source_word: מָנוֹחַ
  choice: Manoa
  rationale: Ginamit ang nakaugaliang anyong Filipino ng pangalang Manoah.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ang anghel ng Diyos
  rationale: Maaaring mangahulugan ang מַלְאָךְ na ‘sugo’ o ‘anghel.’ Sa salaysay, isa itong makalangit na sugo, kaya natural at angkop ang ‘anghel ng Diyos.’
- source_word: עוֹד
  choice: muling
  rationale: Ipinahihiwatig nito na naulit ang pagdating ng anghel; maikli at natural ang ‘muling.’
- source_word: הָאִשָּׁה
  choice: sa babae
  rationale: Tuwirang pinananatili ang katawagang ginamit ng Hebreo at ang daloy ng salaysay, sa halip na palitan ito ng ‘asawa.’
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: habang nakaupo siya
  rationale: Ang participle ay nagsasaad ng kasabay na kalagayan nang dumating ang anghel; natural itong ipinapahayag ng ‘habang nakaupo siya.’
- source_word: בַּשָּׂדֶה
  choice: sa bukid
  rationale: Ang שָׂדֶה ay lupang nasa labas o bukirin; ‘sa bukid’ ang pinakanatural na tuwirang salin sa kontekstong ito.
- source_word: אִישָׁהּ
  choice: ang asawa niyang si Manoa
  rationale: Bagaman literal na ‘lalaki’ ang אִישׁ, ang anyong may hulaping pambabae rito ay idyomatikong tumutukoy sa kanyang asawa.
- source_word: אֵין עִמָּהּ
  choice: Hindi niya kasama noon
  rationale: Ipinahahayag ng negatibong existential na wala roon o hindi niya kasama si Manoa. Idinagdag ang ‘noon’ upang malinaw na tumutukoy ito sa sandaling iyon, nang hindi nagdaragdag ng bagong impormasyon.
theological_decisions:
- issue: Pagpapakahulugan sa הָאֱלֹהִים sa talatang ito
  choice: Diyos
  alternative: mga diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, malinaw sa sintaks at konteksto na tumutukoy ito sa Diyos ng Israel at kaugnay ng pandiwang isahan. Kaya ang ‘Diyos’ ang hinihingi ng teksto, hindi isang denominasyonal na pagpapasya.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Hinati sa dalawang pangungusap ang mahabang Hebreong koordinasyon para sa natural na daloy, ngunit pinanatili ang pagkakasunod-sunod at lahat ng pangunahing detalye. Walang kinakailangang talababa.
