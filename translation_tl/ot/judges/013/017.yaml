id: JDG.13.17
reference: Judges 13:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל מַלְאַ֥ךְ יְהוָ֖ה מִ֣י שְׁמֶ֑/ךָ כִּֽי יָבֹ֥א דברי/ך וְ/כִבַּדְנֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: tl
  text: Sinabi ni Manoa sa anghel ni Yahweh[a], “Ano ang pangalan mo, upang kapag natupad ang mga sinabi mo, maparangalan ka namin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ni Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng ‘mensahero’ o ‘anghel.’ Dahil inilalarawan sa salaysay ang nilalang bilang sobrenatural, ‘anghel’ ang pinakanatural dito; tuwirang isinalin ang יְהוָה bilang ‘Yahweh.’
- source_word: מִי שְׁמֶךָ
  choice: Ano ang pangalan mo
  rationale: Bagaman literal na gumagamit ng ‘sino,’ ang idyoma ay nagtatanong ng pangalan; ito ang natural na katumbas sa modernong Tagalog.
- source_word: כִּי
  choice: upang kapag
  rationale: Sa ugnayan ng mga sugnay, ipinahihiwatig nito ang layunin ng pagtatanong ni Manoa, samantalang ang kasunod na יָבֹא ay tumutukoy sa panahong matutupad ang pahayag.
- source_word: יָבֹא דְבָרֶיךָ
  choice: natupad ang mga sinabi mo
  rationale: Pinananatili ng ‘mga sinabi’ ang anyong maramihan ng דְבָרֶיךָ, at natural na ipinahahayag ng ‘natupad’ ang idyomang ang ipinahayag ay nagkatotoo.
- source_word: וְכִבַּדְנוּךָ
  choice: maparangalan ka namin
  rationale: Ang piel ng כבד ay nangangahulugang ‘parangalan’ o ‘bigyan ng karangalan.’ Ipinapakita ng anyong ito ang layunin o inaasahang tugon nang hindi pinalalakas tungo sa ‘luwalhatiin.’
theological_decisions:
- issue: Paglalapat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Ginagamit sa Hebreo ang mismong Tetragrammaton; pinananatili ng ‘Yahweh’ ang personal na tipanang pangalan sa halip na palitan ito ng isang titulo.
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: mensahero ni Yahweh
  rationale: Ang konteksto ay pabor sa isang sobrenatural na sugo, ngunit hindi nilulutas ng salin ang mas malawak na teolohikal na tanong tungkol sa eksaktong pagkakakilanlan niya.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘parangalan’ bilang likas ngunit hindi labis na teolohikal na katumbas ng כבד; iniwasan ang mas mabigat na ‘luwalhatiin.’
