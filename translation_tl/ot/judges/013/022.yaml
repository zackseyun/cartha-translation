  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: tl
  text: At sinabi ni Manoa sa kanyang asawa, “Tiyak na mamamatay tayo, dahil nakita natin ang Diyos.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang diyos” o “isang banal na nilalang.” Sa ilang konteksto, ang Hebreong אֱלֹהִים (’elohim) ay maaaring tumukoy nang mas malawak sa isang nilalang na banal, ngunit dito ay mas pinapaboran ng konteksto ang “Diyos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili nito ang karaniwang daloy ng salaysay na ipinahihiwatig ng waw-consecutive, nang hindi nagdaragdag ng ugnayang gaya ng “kaya” na hindi tiyak sa Hebreo.
- source_word: מָנוֹחַ
  choice: Manoa
  rationale: Karaniwang anyong Tagalog ng pangalang Manoah.
- source_word: אֶל אִשְׁתּוֹ
  choice: sa kanyang asawa
  rationale: Likas at wastong salin sa konteksto ng אִשָּׁה na may hulaping panlalaking isahan.
- source_word: מוֹת נָמוּת
  choice: Tiyak na mamamatay tayo
  rationale: Ipinahahayag ng infinitive absolute na sinusundan ng imperfect ng parehong ugat ang matinding katiyakan; natural na naipapakita ito sa modernong Tagalog sa “tiyak na.”
- source_word: כִּי
  choice: dahil
  rationale: Nagpapakilala ito rito ng dahilan ng pangamba ni Manoa.
- source_word: אֱלֹהִים
  choice: ang Diyos
  rationale: Sa konteksto, pinakamalamang na tumutukoy ito sa Diyos; gayunman, itinatala sa talababa ang mas malawak na posibleng diwa ng salitang Hebreo.
- source_word: רָאִינוּ
  choice: nakita natin
  rationale: Natural na katumbas sa Tagalog ng perfect na unang panauhang maramihan at malinaw na tumutukoy sa katatapos na pangyayari.
theological_decisions:
- issue: Ang kahulugan ng אֱלֹהִים sa pahayag ni Manoa matapos magpakita ang anghel ng PANGINOON
  choice: ang Diyos
  alternative: isang diyos; isang banal na nilalang
  rationale: Ang salaysay at ang takot ni Manoa na mamamatay sila dahil nakita nila ang Diyos ay pumapabor sa “ang Diyos.” Hindi nito lubusang ipinapantay o ipinaghihiwalay ang anghel ng PANGINOON at ang Diyos, kaya nananatili ang tensiyong nasa salaysay; ang leksikal na mga alternatibo ay inilalahad sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “tiyak na” upang likas na maipahayag ang diin ng Hebreo. Inilagay ang panandang [a] pagkatapos ng “Diyos,” ang salitang aktuwal na tinatalakay ng talababa.
