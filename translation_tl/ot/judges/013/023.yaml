base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng kanyang asawa, “Kung nilayon ng PANGINOON na patayin tayo, hindi sana niya tinanggap mula sa ating kamay ang handog na sinusunog at ang handog na butil, ni ipinakita sa atin ang lahat ng ito, ni ipinaalam sa atin ngayon ang ganitong bagay.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: nilayon
  rationale: Ipinapahayag ang intensiyon o kagustuhang gawin ang isang bagay; natural ito sa kondisyong salungat sa katotohanan.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Karaniwang marangal na salin sa Tagalog para sa banal na pangalang YHWH, na minamarkahan sa malalaking titik.
- source_word: לָקַח
  choice: tinanggap
  rationale: Sa konteksto ng paghahandog, ang literal na “kinuha” ay tumutukoy sa pagtanggap ng Diyos sa handog.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Tumutukoy sa handog na ganap na sinusunog; malinaw at madaling maunawaan sa modernong Tagalog.
- source_word: מִנְחָה
  choice: handog na butil
  rationale: Sa ritwal na kontekstong ito, tumutukoy sa handog na pagkaing karaniwang mula sa butil.
- source_word: הִשְׁמִיעָנוּ
  choice: ipinahayag sa atin
  rationale: Literal na “ipinarinig sa atin”; dito ay angkop ang “ipinahayag” dahil tumutukoy sa mensaheng ibinalita sa mag-asawa.
- source_word: כָזֹאת
  choice: ganitong bagay
  rationale: Pinananatili ang bahagyang pangkalahatang pagtukoy sa ipinahayag na pangyayari nang hindi ito labis na tinutukoy.
theological_decisions:
- issue: Batayan ng pagtitiwala ng asawa ni Manoah
  choice: 'Pinanatili ang tatlong magkakaugnay na dahilan: tinanggap ang mga handog, ipinakita ang mga bagay, at ipinahayag ang mensahe.'
  alternative: Ibuod bilang pangkalahatang katiyakan na hindi sila papatayin ng Diyos.
  rationale: Mahalaga sa lohika ng talata ang tatlong ebidensiyang binanggit ng babae; hindi dapat paikliin o dagdagan ng paliwanag.
- issue: Paglalarawan sa layunin ng Diyos
  choice: “Kung nilayon ng PANGINOON na patayin tayo”
  alternative: “Kung gusto ng PANGINOON na patayin tayo”
  rationale: Ang “nilayon” ay marangal at malinaw, at hindi nagpapahiwatig ng pabagu-bagong pagnanasa; nananatili rin ang kontrapaktuwal na pangangatwiran ng Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hindi sana… Hindi rin sana… ni…” upang natural na mailahad ang tatlong-bahaging kondisyong pangangatwiran ng Hebreo. Walang footnote dahil walang tekstuwal o leksikal na kalabuan na kailangang ilabas para sa karaniwang mambabasa.
