  source_fidelity: 'Tumpak na naihahatid ng draft ang kontrapaktuwal na pangangatwiran at ang tatlong batayan nito: pagtanggap ng handog na sinusunog at handog na butil, pagpapakita ng mga bagay na ito, at pagpapaalam ng ganitong bagay sa kasalukuyang pagkakataon. Ang "nilayon," "tinanggap," at "handog na butil" ay angkop sa Hebreo at sa kontekstong ritwal.'
  naturalness: 'May bahagyang di-likas na paghahati sa apodosis: pagkatapos ng tuldok, ang "ni ipinahayag" ay nakabitin sa bagong pangungusap. Mas malinaw at mas natural na panatilihin ang magkakaugnay na negatibong mga pandiwa sa iisang pangungusap.'
