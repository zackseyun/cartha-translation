base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: tl
  text: At sinabi ng anghel ni Yahweh kay Manoa[a], “Dapat maingat na sundin ng babae ang lahat ng sinabi ko sa kaniya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “mensahero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Pinananatili nito ang karaniwang daloy ng sunod-sunod na salaysay na ipinahihiwatig ng waw-consecutive nang hindi dinaragdagan ng tiyak na temporal na pakahulugan.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugang ‘mensahero’ o ‘anghel’ ang מַלְאַךְ; sa kontekstong ito, natural at nakaugaliang tawag sa makalangit na sugo ang ‘anghel,’ habang pinananatili ang personal na pangalang Yahweh.
- source_word: אֶל מָנוֹחַ
  choice: kay Manoa
  rationale: Natural na salin sa Tagalog ng simpleng pariralang nagsasaad kung kanino nagsalita ang anghel.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: ang lahat ng sinabi ko sa kaniya
  rationale: Ipinahahayag ang kabuuang saklaw ng naunang tagubilin. Ang ‘sa kaniya’ ay natural na tumutukoy sa babae, na tahasang binanggit sa pangunahing sugnay.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Pinananatili ang tahasang ‘ang babae’ ng Hebreo sa halip na idagdag ang relasyonal na ‘asawa mo.’
- source_word: תִּשָּׁמֵר
  choice: Dapat sundin
  rationale: Sa konteksto, ang Nifal ng שׁמר ay tumutukoy sa maingat na pagtalima sa mga tagubilin. Ang ‘dapat sundin’ ay natural sa modernong Tagalog at malinaw na naghahatid ng obligasyong ipinahihiwatig ng anyo.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; ang ‘Yahweh’ ay direktang transliterasyon at hindi nagpapalit nito ng isang titulo.
- issue: Saklaw ng kahulugan ng מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh, na may talababa para sa ‘mensahero ni Yahweh’
  alternative: mensahero ni Yahweh
  rationale: Ang ‘anghel’ ang natural na pagbasa sa konteksto, ngunit pinananatili sa talababa ang tunay na leksikal na posibilidad na ‘mensahero’ nang hindi nilulutas nang labis ang pagkakakilanlan ng tauhan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Manoa,’ ang karaniwang anyong Filipino ng pangalang Manoah. Iniwasan ang mas mabigat ngunit literal na ‘mag-ingat ang babae tungkol sa lahat,’ sapagkat sa konteksto ang diwa ay maingat na pagtalima sa naunang mga tagubilin.
