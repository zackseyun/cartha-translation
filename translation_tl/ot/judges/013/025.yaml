base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: tl
  text: At nagsimulang antigin[b] siya ng Espiritu ni Yahweh sa Mahane-dan[a], sa pagitan ng Zora at Estaol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Mahane-dan ay nangangahulugang “kampo ng Dan”; dito, ginagamit ito bilang pangalan ng lugar.
    reason: cultural_note
  - marker: b
    text: Maaari ring isaling “udyukan siya,” “pakilusin siya,” o “galawin siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּחֶל
  choice: At nagsimula
  rationale: Likas na salaysay na katumbas ng Hifil wayyiqtol ng חלל, na nagpapahayag ng pagsisimula ng kilos.
- source_word: רוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  rationale: Sa konteksto ng salaysay tungkol kay Samson, tumutukoy ito sa makapangyarihang pagkilos at presensiya ni Yahweh, hindi sa karaniwang hangin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na banal na pangalan na tahasang nasa tekstong Hebreo.
- source_word: לְפַעֲמוֹ
  choice: udyukan siya
  rationale: Ipinahahayag ng pandiwang פעם dito ang pag-antig, paggalaw, o pag-udyok sa isang tao; natural sa modernong Filipino ang “udyukan” at hindi nito labis na tinutukoy ang eksaktong anyo ng pagkilos.
- source_word: בְּמַחֲנֵה דָן
  choice: sa Mahane-dan
  rationale: Ginagamit dito bilang pangalan ng lugar; ang transliterasyon ay nagpapanatili sa toponimikong gamit nito.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: sa pagitan ng Zora at Estaol
  rationale: Tuwirang heograpikong parirala na may mga pangalang inangkop sa natural na baybay at bigkas sa Filipino.
theological_decisions:
- issue: Kalikasan ng רוּחַ יְהוָה sa kontekstong ito
  choice: ang Espiritu ni Yahweh bilang banal na presensiyang kumikilos at nagbibigay-lakas
  alternative: ang hangin o hininga ni Yahweh
  rationale: Sa salaysay tungkol kay Samson, ang parirala ay nagpapahiwatig ng makapangyarihang pagkilos ni Yahweh sa kaniya. Hindi na dinaragdagan ang teksto ng mas huling sistematikong paliwanag.
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Pinananatili ang natatanging personal na pangalan sa pinagmulang teksto.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “udyukan” upang ipakita ang banal na pagkilos nang hindi ipinapalagay kung ito ay panloob na damdamin, pisikal na paggalaw, o isang tiyak na atas. Inilagay ang bawat talababa sa mismong bahaging tinutukoy nito.
