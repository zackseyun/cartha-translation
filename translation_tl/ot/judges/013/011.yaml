base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: tl
  text: Kaya bumangon si Manoa at sumunod sa likuran ng kaniyang asawa[a]. Lumapit siya sa lalaki at sinabi rito, “Ikaw ba ang lalaking nagsalita sa babae[b]?” Sumagot ito, “Ako nga.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “pagkatapos ng kaniyang asawa” o “sa likuran ng kaniyang asawa.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: “sa babae,” hindi “sa aking asawa.”'
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “Ako”; maaari ring isaling “Ako iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tumindig
  rationale: Ang Qal wayyiqtol ng קום ay nagpapahiwatig na bumangon o tumindig si Manoa upang kumilos. Ang “tumindig” ay dignified at natural sa salaysay.
- source_word: וַיֵּלֶךְ מָנוֹחַ אַחֲרֵי אִשְׁתּוֹ
  choice: sumunod si Manoa sa kaniyang asawa
  rationale: Ang אַחֲרֵי ay literal na “sa likuran/pagkatapos ng,” ngunit sa konteksto ay natural na nangangahulugang sumunod siya sa kaniyang asawa. Hindi tinutukoy ng הלך ang partikular na paraan ng paglakad.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: Lumapit siya sa lalaki
  rationale: Ang בוא אֶל ay maaaring isaling “pumunta/lumapit sa.” Ang “lumapit” ay natural sa Filipino at ipinakikitang narating niya ang lalaki nang hindi dinaragdagan ang pagkakakilanlan nito.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Pinananatili ang karaniwang kahulugan ng אִישׁ at ang unti-unting pagbubunyag ng salaysay; hindi ito pinalitan ng “anghel.”
- source_word: הַאַתָּה הָאִישׁ
  choice: Ikaw ba ang lalaking
  rationale: Direkta at likas na anyo ito ng tanong sa modernong Filipino, nang walang dagdag na diin na wala sa Hebreo.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: nagsalita sa babae
  rationale: Tapat itong sumusunod sa אֶל at sa tahasang “ang babae,” sa halip na palitan iyon ng kontekstuwal na “aking asawa.”
- source_word: אָנִי
  choice: Ako nga
  rationale: Ang Hebreo ay isang mariing panghalip lamang, literal na “Ako.” Sa sagot sa tanong na pagkakakilanlan, likas na Filipino ang “Ako nga,” samantalang pinananatili sa talababa ang mas literal na anyo.
theological_decisions:
- issue: Pagkakakilanlan ng dumalaw
  choice: Isinalin ang הָאִישׁ bilang “ang lalaki.”
  alternative: “ang anghel” o “ang sugo”
  rationale: Bagaman ipinakikilala siya ng mas malawak na konteksto bilang ang anghel ng PANGINOON, אִישׁ ang tawag sa kaniya sa talatang ito. Pinananatili nito ang pananaw at unti-unting pagbubunyag ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “kaniyang” para sa maayos na pormal na salaysay, habang nananatiling natural ang diyalogo. Inayos ang pagkakasunod ng mga pananda ng talababa ayon sa paglitaw sa teksto.
