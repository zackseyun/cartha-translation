  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: tl
  text: At ngayon, mag-ingat ka, at huwag kang uminom ng alak o ng nakalalasing na inumin[a], at huwag kang kumain ng anumang di-malinis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tumutukoy ito sa mga inuming nakalalasing bukod sa alak na mula sa ubas.
    reason: cultural_note
  - marker: b
    text: Ang “di-malinis” ay tumutukoy sa ritwal na kategorya ng mga bagay o pagkaing hindi malinis ayon sa kautusan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang panandang nagpapakilala sa kasunod na tagubilin.
- source_word: הִשָּׁמְרִי נָא
  choice: mag-ingat ka sana
  rationale: Ang “mag-ingat ka” ay likas na katumbas ng mapagbalik na diwa ng utos, at ipinahihiwatig ng “sana” ang magalang na pakiusap ng נָא nang hindi pinahihina ang tagubilin.
- source_word: וְאַל תִּשְׁתִּי
  choice: Huwag kang uminom
  rationale: Tuwirang ipinapahayag ang pagbabawal na nakatuon sa babae.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwan at natural na salitang Filipino para sa wine sa ganitong konteksto.
- source_word: וְשֵׁכָר
  choice: nakalalasing na inumin
  rationale: Masaklaw ito para sa iba pang inuming nakalalasing at hindi ito nililimitahan sa serbesa o sa makabagong kahulugan ng matapang na distilled liquor.
- source_word: וְאַל תֹּאכְלִי
  choice: at huwag kang kumain
  rationale: Pinananatili ang ikalawang pagbabawal at ang pagkakaugnay nito sa nauna.
- source_word: כָּל טָמֵא
  choice: anumang marumi
  rationale: Pinananatili ang malawak at substantibong gamit ng parirala, pati ang kategoryang ritwal, nang hindi ito ginagawang usapin lamang ng kalinisan.
theological_decisions:
- issue: Kahulugan ng טָמֵא sa kontekstong ito
  choice: marumi
  alternative: di-malinis / ritwal na marumi
  rationale: Ang “marumi” ay nagpapanatili sa kategoryang ritwal o tipan na kilala sa Torah; hindi ito pinaliliit sa pisikal na dumi o moral na kasamaan lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “sana” upang katawanin ang magalang na pakiusap ng נָא; ang anyong pambabae ng mga pandiwang Hebreo ay natural na hindi minamarkahan sa Filipino.
