    rationale: Ang בֵּן ay “anak na lalaki” sa kontekstong ito. Ang “isang lalaki” ay maaaring basahing isang ganap na lalaking tao at hindi likas na pananalita para sa sanggol na isisilang.
  - severity: low
    issue: “Tingnan mo” para sa הִנֵּה נָא
    rationale: Posible ito, ngunit ang “Narito” ay mas malapit sa pormulang panawag-pansin ng Hebreo at mas natural sa isang pahayag ng anghel; hindi nito ginagawang tahasang utos ang panimula.
