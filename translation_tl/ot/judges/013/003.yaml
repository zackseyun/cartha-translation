  source_fidelity: 'Tumpak ang pangunahing nilalaman: anghel ng YHWH, ang babae, pagiging baog at walang naging anak, at pangakong maglilihi at magsisilang siya. Gayunman, ang “isang lalaki” ay karaniwang tumutukoy sa isang adultong male at hindi sapat na malinaw na “anak na lalaki” (בֵּן).'
  naturalness: Natural sa kabuuan ang pangungusap, ngunit mas idiomatiko at eksakto sa Tagalog ang “manganganak ka ng isang anak na lalaki” kaysa “manganganak ng isang lalaki.” Ang “Narito” ay angkop na panawag-pansin para sa הִנֵּה נָא nang hindi nagiging utos na “Tingnan mo.”
  terminology: Ang “anghel ng PANGINOON” ay pinananatili at hindi nagpapasya sa pagkakakilanlan ng anghel. Ang “baog” ay tuwiran at angkop sa rehistrong biblikal ngunit nauunawaan pa rin sa modernong Filipino.
