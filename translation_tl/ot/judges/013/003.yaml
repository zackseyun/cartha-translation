translation:
  language: tl
  text: Nagpakita ang anghel ng PANGINOON sa babae at sinabi sa kanya, “Narito, baog ka at hindi ka pa nagkaanak, ngunit maglilihi ka at manganganak ka ng isang anak na lalaki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ng PANGINOON
  rationale: Pinananatili ang karaniwang at dignified na katawagan sa Tagalog; ang PANGINOON ay kumakatawan sa banal na pangalang YHWH nang hindi nagdaragdag ng interpretasyon tungkol sa pagkakakilanlan ng anghel.
- source_word: הִנֵּה נָא
  choice: Tingnan mo
  rationale: Ang הִנֵּה ay panawag-pansin; ang נָא ay nagpapalambot sa pahayag. Sa natural na Tagalog, sapat na naipahihiwatig ng “Tingnan mo” ang dalawa nang hindi gumagamit ng alanganing literal na “pakisuyo.”
- source_word: עֲקָרָה
  choice: baog
  rationale: Direkta at malinaw na katumbas ng kawalan ng kakayahang magkaanak sa konteksto.
- source_word: וְלֹא יָלַדְתְּ
  choice: at hindi ka pa nagkaanak
  rationale: Natural na Tagalog para sa perpektong pandiwang nagsasaad na hindi pa siya nakapagsilang; hindi nililimitahan ang kahulugan sa isang partikular na naunang pagbubuntis.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: ngunit maglilihi ka at manganganak ng isang lalaki
  rationale: Inilalarawan nang tuwiran ang magkasunod na paglilihi at panganganak. Ang “isang lalaki” ay natural na tumutukoy sa anak na lalaki sa kontekstong ito.
theological_decisions:
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: anghel ng PANGINOON
  alternative: Anghel ng PANGINOON / sugo ni Yahweh
  rationale: Hindi nilulutas ng salin ang teolohikal na tanong tungkol sa eksaktong pagkakakilanlan ng tauhan; pinananatili nito ang anyo ng Hebreo.
- issue: Ugnayan ng pagiging baog at pangakong panganganak
  choice: ngunit maglilihi ka
  alternative: at maglilihi ka
  rationale: Bagaman waw ang pang-ugnay sa Hebreo, ang konteksto ay malinaw na nagpapakita ng kontrast sa kasalukuyang kalagayan; natural itong ipinahahayag ng “ngunit” nang hindi binabago ang pangako.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, magalang, at angkop sa pampublikong pagbasa. Ginamit ang “PANGINOON” bilang tradisyonal na representasyon ng YHWH at iniwasan ang sobrang literal ngunit hindi natural na paglalapat ng הִנֵּה נָא.
