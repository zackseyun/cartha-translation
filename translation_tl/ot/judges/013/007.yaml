  source_fidelity: Kailangang alisin ang “Sapagkat,” dahil ang Hebreo ng talatang ito ay nagsisimula sa simpleng “At/sinabi niya sa akin” (וַיֹּאמֶר לִי) at walang pangatnig na katumbas ng “sapagkat.” Maayos na naipapahayag ng “maglilihi ka at manganganak” ang prediktibong diwa sa konteksto, habang pinananatili ng talababa ang mas literal na posibilidad. Ang “Nazareo ng Diyos” ay angkop na pagpapanatili ng teknikal na נְזִיר אֱלֹהִים.
  naturalness: Natural at marangal ang kabuuang Tagalog. Gayunman, mas malinaw at mas idiomatiko sa konteksto ng pagkain ang “anumang bagay na marumi” kaysa sa substantivized na “anumang marumi.”
  terminology: Ang “Nazareo” ay angkop na teknikal na katawagan at ang paliwanag sa talababa ay sapat. Ang “nakalalasing na inumin” ay tumpak para sa שֵׁכָר nang hindi labis na tinutukoy ang uri ng inumin.
