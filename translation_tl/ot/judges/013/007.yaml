base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: tl
  text: Sinabi niya sa akin[a], ‘Tingnan mo, maglilihi ka at manganganak ng isang anak na lalaki. Kaya ngayon, huwag kang uminom ng alak o anumang nakalalasing na inumin, at huwag kang kumain ng anumang bagay na marumi. Sapagkat ang bata ay magiging Nazareo ng Diyos[b] mula sa sinapupunan hanggang sa araw ng kanyang kamatayan.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal: “Tingnan mo, buntis ka at manganganak ng isang anak na lalaki.” Maaari ring unawain ang pananalita bilang pahayag tungkol sa mangyayari: “maglilihi ka at manganganak.”'
    reason: lexical_alternative
  - marker: b
    text: Ang “Nazareo” ay teknikal na katawagan para sa isang taong bukod na itinalaga sa Diyos.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Sapagkat sinabi niya sa akin
  rationale: Ipinahihiwatig ng pangungusap ang paliwanag na kaugnay ng naunang salaysay ng babae; natural sa Tagalog ang “Sapagkat,” bagaman simpleng waw ang nasa Hebreo.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: Tingnan mo, maglilihi ka at manganganak ng isang anak na lalaki
  rationale: Ang הָרָה ay literal na maaaring tumukoy sa pagiging buntis, ngunit sa konteksto ng pahayag tungkol sa mangyayari, malinaw at natural ang hulang “maglilihi ka”; pinananatili sa talababa ang literal na posibilidad.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikita ang paglipat mula sa pahayag patungo sa tagubilin.
- source_word: יַיִן וְשֵׁכָר
  choice: alak o anumang nakalalasing na inumin
  rationale: Ang יַיִן ay alak, samantalang ang שֵׁכָר ay nakalalasing na inumin na hindi kailangang tukuyin bilang isang modernong uri tulad ng serbesa.
- source_word: כָּל טֻמְאָה
  choice: anumang marumi
  rationale: Sa konteksto, tumutukoy ito sa anumang pagkaing ritwal na marumi; ang maikling salin ay nagpapanatili ng terminolohiyang Hebreo nang hindi nagdaragdag sa teksto.
- source_word: נְזִיר אֱלֹהִים
  choice: Nazareo ng Diyos
  rationale: Pinananatili ang teknikal na katawagan para sa taong bukod na itinalaga sa Diyos, sa halip na gawing pangkalahatang “banal” o “nakatalaga.”
- source_word: מִן הַבֶּטֶן עַד יוֹם מוֹתוֹ
  choice: mula pa sa sinapupunan hanggang sa araw ng kanyang kamatayan
  rationale: Tuwirang pinananatili ang larawang temporal at saklaw ng Hebreo.
theological_decisions:
- issue: Katawagan sa Nazareo
  choice: Nazareo ng Diyos
  alternative: isang taong bukod na itinalaga sa Diyos
  rationale: Teknikal ang נָזִיר at may legal at panataang konteksto; ang transliterasyon ay hindi nagbabawas nito sa pangkalahatang konsepto ng kabanalan. Ang “ng Diyos” ay nagpapanatili rin ng tunay na lawak ng ugnayang genitibo.
- issue: Panahunan ng pahayag tungkol sa paglilihi
  choice: maglilihi ka at manganganak
  alternative: buntis ka at manganganak
  rationale: Maaaring basahin nang literal ang הָרָה bilang “buntis,” ngunit sinusuportahan ng konteksto ang prediktibong diwa. Inilalahad sa talababa ang pormal na alternatibo upang hindi itago ang ambiguwidad.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “Nazareo,” ang nakaugaliang anyong Tagalog ng teknikal na katawagan, at iniwasan ang sobrang arkaikong pananalita. Ang mga panandang [a] at [b] ay kapwa nasa pangunahing teksto.
