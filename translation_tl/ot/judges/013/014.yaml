id: JDG.13.14
reference: Judges 13:14
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: tl
  text: Huwag siyang kumain ng anumang nagmumula sa baging ng ubas[a]. Huwag siyang uminom ng alak o matapang na inumin, at huwag siyang kumain ng anumang marumi. Dapat niyang sundin ang lahat ng iniutos ko sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mula sa lahat ng lumalabas sa baging ng alak,” ibig sabihin, anumang nagmumula sa baging ng ubas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: anumang nagmumula sa punong ubas
  rationale: Pinananatili ng “nagmumula” ang pandiwang diwa ng יֵצֵא at ipinahihiwatig ng parirala ang lahat ng nagmumula o nagagawa mula sa ubas. Natural sa modernong Filipino ang “punong ubas,” bagaman baging ang mas literal na katawagan.
- source_word: לֹא תֹאכַל
  choice: Huwag siyang kumain
  rationale: Likas at malinaw na paraan ito sa Filipino upang ipahayag ang pagbabawal sa ikatlong panauhang pambabae.
- source_word: יַיִן
  choice: alak
  rationale: Karaniwang salin ng יַיִן sa Filipino; sa pagtutambal nito sa שֵׁכָר, tumutukoy ito nang mas tiyak sa alak mula sa ubas.
- source_word: שֵׁכָר
  choice: matapang na inumin
  rationale: Malawak na salin para sa nakalalasing na inuming bukod sa יַיִן; hindi ito nililimitahan sa serbesa lamang.
- source_word: אַל תֵּשְׁתְּ
  choice: Huwag siyang uminom
  rationale: Natural na ipinahahayag nito ang pagbabawal ng Hebreong אַל na may anyong jussive.
- source_word: כָל טֻמְאָה
  choice: anumang marumi
  rationale: Pinananatili ng “marumi” ang biblikal na kategorya ng ritwal na karumihan nang hindi nililimitahan iyon sa simpleng pisikal na dumi.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: lahat ng iniutos ko sa kanya
  rationale: Tuwirang inililipat ang kabuuang saklaw ng כֹּל at ang naunang utos sa babae.
- source_word: תִּשְׁמֹר
  choice: Dapat niyang sundin
  rationale: Sa konteksto ng mga tagubilin, ang שׁמר ay nangangahulugang ingatan o tuparin; “sundin” ang pinakanatural at malinaw sa kasalukuyang Filipino.
theological_decisions:
- issue: Saklaw ng pagbabawal tungkol sa bunga ng puno ng ubas
  choice: Isinalin nang malawakan bilang anumang nagmumula sa punong ubas.
  alternative: Limitahan sa ubas lamang o sa mga produktong maaaring kainin.
  rationale: Sadyang malawak ang Hebreong “mula sa lahat ng lumalabas sa baging ng alak.” Pinananatili ng salin ang saklaw nito nang hindi nagdaragdag ng teknikal na terminong Nazareo sa pangunahing teksto.
- issue: Kahulugan ng טֻמְאָה
  choice: Gamitin ang “marumi” upang mapanatili ang biblikal at ritwal na kategorya.
  alternative: “di-dalisay” o “karumal-dumal”
  rationale: Ang “marumi” ay madaling maunawaan at nakapagpapanatili ng ugnayan sa mga kautusan tungkol sa ritwal na kalinisan; hindi ipinapalagay na pisikal na dumi lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na malinaw, marangal, at natural. Ginamit ang paulit-ulit na “Huwag siyang…” upang mapanatili ang diin at pagkakasunod-sunod ng mga pagbabawal sa Hebreo. Ang “punong ubas” ay mas madaling maunawaan ng karaniwang mambabasa kaysa “baging,” habang ipinapaliwanag sa talababa ang mas literal na anyo.
