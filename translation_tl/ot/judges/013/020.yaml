base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: tl
  text: Nang pumailanlang mula sa altar ang ningas patungo sa langit, pumailanlang ang anghel ni Yahweh[a] sa ningas ng altar, habang nakatingin si Manoa at ang kanyang asawa; pagkatapos ay nagpatirapa sila sa lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O kaya, “mensahero ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “mensahero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: Nang pumailanlang
  rationale: Ang konstruksiyon ay nagsisilbing panandang temporal sa salaysay. Likas sa Tagalog ang “Nang” nang hindi mekanikal na isinasalin ang idyomang “at nangyari.”
- source_word: הַלַּהַב
  choice: ang ningas
  rationale: Tumutukoy ang לַהַב sa apoy na nagliliyab o sa ningas. Ang “ningas” ay malinaw, kongkreto, at angkop sa marangal na salaysay.
- source_word: מֵעַל הַמִּזְבֵּחַ הַשָּׁמַיְמָה
  choice: mula sa altar ... patungo sa langit
  rationale: Pinananatili nito kapwa ang pinagmulan sa ibabaw ng altar at ang direksiyong paitaas na ipinahihiwatig ng hulaping direksiyonal sa הַשָּׁמַיְמָה.
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugang “anghel” o “mensahero” ang מַלְאָךְ. Sa sobrenatural na tagpong ito, natural ang “anghel,” habang inilalahad sa talababa ang tunay na leksikal na alternatibo. Isinasalin ang banal na pangalan bilang “Yahweh.”
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: sa ningas ng altar
  rationale: Pinananatili ng “sa” ang posibleng lokatibo o kasabayang diwa ng ב nang hindi ipinapaliwanag kung paano naganap ang pag-akyat.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: Habang nakatingin si Manoa at ang kanyang asawa
  rationale: Ipinahihiwatig ng participle ang tuloy-tuloy na pagkakita na kasabay ng pag-akyat. Ang “habang nakatingin” ay natural at hindi nagdaragdag ng tiyak na layon.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: nagpatirapa sila sa lupa
  rationale: Natural na ipinahahayag ng “nagpatirapa” ang pagbagsak na nakaharap sa lupa; pinananatili sa talababa ang literal na larawan ng Hebreo.
theological_decisions:
- issue: Pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  alternative: ang mensahero ni Yahweh; isang pagpapakita mismo ng Diyos
  rationale: Tinutukoy ng Hebreo ang tauhan bilang ang anghel o mensahero ni Yahweh ngunit hindi nito sapilitang nilulutas kung isa lamang siyang nilikhang anghel o isang teopanikong pagpapakita. Pinananatili ng salin ang katawagan ng teksto nang hindi nagpapataw ng isang interpretasyong teolohikal.
translation_notes:
  register: Makabagong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “pumailanlang” upang malinaw na ilarawan ang pag-akyat ng ningas at ng anghel nang hindi inuulit ang mas payak ngunit mabigat na “umakyat”; pinanatili ang pangalan na “Manoa” at ang banal na pangalan na “Yahweh.”
