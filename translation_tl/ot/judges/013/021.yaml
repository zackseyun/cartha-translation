  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: tl
  text: At hindi na muling nagpakita ang anghel ni Yahweh kay Manoa at sa asawa niya.[a] Noon nalaman ni Manoa na siya ang anghel ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “sugo” o “anghel”; sa kontekstong ito, tumutukoy ito sa isang makalangit na nilalang.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף עוֹד
  choice: hindi na muling
  rationale: Ipinahahayag ng idyomang Hebreo ang pagtigil ng anumang karagdagang pagpapakita; natural itong isinasaad sa Tagalog bilang “hindi na muling.”
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ na “sugo” o “anghel,” ngunit ang konteksto ay tumutukoy sa isang makalangit na nilalang. Pinananatili sa talababa ang leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng “Yahweh” ang banal na pangalang יְהוָה sa tekstong Hebreo.
- source_word: לְהֵרָאֹה
  choice: nagpakita
  rationale: Ang anyong Niphal ng ראה ay nangangahulugang “magpakita” o “makita”; ang “nagpakita” ang likas na salin sa kontekstong ito.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: kay Manoa at sa asawa niya
  rationale: Malinaw at natural sa modernong Tagalog ang pag-uulit ng angkop na pananda para sa pangalang pantangi at karaniwang pangngalan.
- source_word: אָז יָדַע
  choice: Noon nalaman
  rationale: Minamarkahan ng אָז ang sumunod na pagkilala ni Manoa; ang “Noon nalaman” ay nagpapanatili sa daloy at pangunahing diwa ng pandiwa.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: na siya ang anghel ni Yahweh
  rationale: Ang panlalaking panghalip na הוּא ay tumutukoy sa personal na nilalang na naunang nagpakita; ang “siya” ang natural at tapat na katumbas.
theological_decisions:
- issue: Paglalarawan sa מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Ipinakikita ng konteksto na makalangit ang tinutukoy, kaya “anghel” ang ginamit. Gayunman, hindi ipinapasiya ng salin ang higit pang tiyak na pagkakakilanlan ng nilalang, at binabanggit sa talababa ang saklaw na “sugo.”
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “asawa niya” sa halip na mas lumang “kanyang asawa,” at pinanatili ang payak na ayos ng salaysay.
