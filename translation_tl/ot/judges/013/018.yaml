base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: tl
  text: At sinabi sa kanya ng anghel ni Yahweh, “Bakit mo itinatanong ang pangalan ko, gayong ito’y kamangha-mangha[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “di-maarok,” “di-maunawaan,” o marahil “lihim.” Ang salitang Hebreo ay tumutukoy sa isang bagay na pambihira o lubhang kamangha-mangha na hindi lubos na mauunawaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Ang מַלְאַךְ ay maaaring mangahulugang sugo o anghel; sa salaysay, isang sobrenatural na sugo ang tinutukoy, kaya natural ang “anghel.” Pinanatili ang personal na pangalang Yahweh para sa יְהוָה.
- source_word: לָמָּה זֶּה
  choice: Bakit
  rationale: Ang idyoma ay nagpapakilala ng tuwirang retorikal na tanong; malinaw at natural itong naipapahayag ng “Bakit.”
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: mo itinatanong ang pangalan ko
  rationale: Tuwirang ipinahahayag nito ang paghingi o pag-usisa sa pangalan nang hindi nagdaragdag ng kahulugan.
- source_word: וְהוּא
  choice: Ito ay
  rationale: Pinanatili ang payak na ugnayang ipinahihiwatig ng waw at ang panghalip na tumutukoy sa pangalan, nang hindi labis na nililinaw ang lohikal na relasyon.
- source_word: פֶלִאי
  choice: kamangha-mangha
  rationale: Ipinahahayag nito ang pambihira at kahanga-hangang katangian ng salita habang iniiwan sa talababa ang posibleng diwa na lampas sa ganap na pagkaunawa.
theological_decisions:
- issue: Posibleng teophaniko o kristolohikal na bigat ng פֶלִאי
  choice: Isinalin bilang “kamangha-mangha” nang hindi ginagawang titulo o tahasang nilulutas ang pagkakakilanlan ng anghel.
  alternative: “di-maarok,” “di-maunawaan,” o isang ekspresyong ginawang pantanging titulo
  rationale: Maaaring mag-anyaya ang talata ng teolohikal na pagninilay, ngunit hindi tahasang nilulutas ng Hebreo ang pagkakakilanlan ng anghel. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “anghel ni Yahweh” bilang natural na parirala at iniwasan ang interpretatibong pagpapalawak sa pangunahing teksto.
