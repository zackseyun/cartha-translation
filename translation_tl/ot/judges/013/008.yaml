  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: tl
  text: 'Nagsumamo si Manoah kay Yahweh[a] at sinabi, “Panginoon, nakikiusap ako: papuntahin mo sanang muli sa amin ang lalaki ng Diyos[b] na isinugo mo, at turuan niya kami kung ano ang dapat naming gawin para sa batang lalaking isisilang.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “nagsumamo” ay maaari ring isaling “taimtim na nanalangin” o “nakiusap nang buong puso.”
    reason: lexical_alternative
  - marker: b
    text: Literal na “ang lalaki ng Diyos.” Ganito siya nauunawaan at tinutukoy ni Manoah sa bahaging ito ng salaysay.
    reason: narrative_ambiguity
  - marker: c
    text: Maaari ring isaling “kung ano ang dapat naming gawin tungkol sa batang lalaking isisilang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: Nagsumamo
  rationale: Ipinahahayag ng pandiwa ang taimtim at mapilit na pakiusap sa Diyos, hindi lamang karaniwang pananalangin o pagtatanong.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: בִּי אֲדֹנָי
  choice: Panginoon, nakikiusap ako
  rationale: Ang בִּי ay magalang na panandang ginagamit sa pagsusumamo; ang אֲדֹנָי ay tuwirang pagharap sa Diyos bilang Panginoon.
- source_word: אִישׁ הָאֱלֹהִים
  choice: ang lalaki ng Diyos
  rationale: 'Pinananatili ang literal at mahalagang pananaw ni Manoa sa salaysay: tinutukoy niya ang dumalaw bilang isang lalaking nauukol sa Diyos, nang hindi pa nilulutas ang tunay na pagkakakilanlan nito.'
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: papuntahin mo sanang muli sa amin
  rationale: Ipinahahayag ng “sana” ang magalang na pakiusap ng נָא, at ng “muli” ang עוֹד.
- source_word: וְיוֹרֵנוּ
  choice: at turuan niya kami
  rationale: Ang Hiphil ng ירה ay tumutukoy sa pagtuturo o pagbibigay ng tagubilin.
- source_word: מַה נַּעֲשֶׂה
  choice: kung ano ang dapat naming gawin
  rationale: Natural na Filipino ito para sa deliberatibong tanong tungkol sa kinakailangang pagkilos.
- source_word: לַנַּעַר הַיּוּלָּד
  choice: para sa batang lalaking isisilang
  rationale: Pinananatili ng “batang lalaki” ang panlalaking kahulugan ng נַעַר, habang ipinahahayag ng “isisilang” ang hinaharap na tinutukoy ng passive participle.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit sa Hebreo ang personal na pangalan ng Diyos; pinananatili ito sa transliterasyong “Yahweh” sa halip na palitan ng titulo.
- issue: Kung kikilalanin agad na ang אִישׁ הָאֱלֹהִים ay isang anghel
  choice: lalaki ng Diyos
  alternative: mensahero ng Diyos o anghel ng Diyos
  rationale: Ang mismong pananalita ni Manoa ay “lalaki ng Diyos.” Pinananatili nito ang pananaw at tensiyon ng salaysay, nang hindi ipinapasok nang maaga ang mas tiyak na pagkakakilanlan ng dumalaw.
- issue: Kasarian ng נַעַר
  choice: batang lalaki
  alternative: bata
  rationale: Panlalaki ang anyo at ang tinutukoy sa konteksto, kaya hindi ito ginawang neutral sa kasarian.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang tuwirang isahang panghalip para sa Diyos, ayon sa karaniwang gramatika ng Filipino, at iniwasang gawing mas tiyak kaysa sa Hebreo ang pagkakakilanlan ng “lalaki ng Diyos.”
