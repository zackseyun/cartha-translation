base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: tl
  text: At sinabi ni Manoa, “Ngayon, matupad nawa ang mga sinabi mo.[a] Ano ang magiging tuntunin para sa bata at ano ang magiging gawain niya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kapag matupad ang mga sinabi mo.” Maaaring unawain ang Hebreo bilang isang kahilingan o bilang palagay tungkol sa panahong matutupad ang sinabi.
    reason: alternative_reading
  - marker: b
    text: Sa Hebreo, mas literal na “Ano ang magiging tuntunin para sa bata at ang gawain niya?” Ang “tuntunin” ay maaari ring mangahulugang kaugalian, itinakdang kaayusan, o paraan ng pamumuhay; ang “gawain niya” ay maaari ring tumukoy sa dapat niyang gawin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: At sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “At sinabi” at pinananatili nito ang pagkakasunod-sunod.
- source_word: מָנוֹחַ
  choice: Manoa
  rationale: Ginamit ang karaniwang anyong Tagalog ng pangalang Manoah.
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tumutukoy ito sa agarang tugon at paghihintay ni Manoa.
- source_word: יָבֹא דְבָרֶיךָ
  choice: matupad nawa ang mga sinabi mo
  rationale: Literal na ‘dumating nawa ang iyong mga salita’; malinaw na ipinapahayag ng “matupad nawa” ang optatibong pagbasa habang inilalahad sa talababa ang posibleng temporal na pagbasa.
- source_word: מַה יִּהְיֶה
  choice: Ano ang ... dapat ... at ano ang magiging
  rationale: Ipinapahayag ang tanong tungkol sa magiging kaayusan at gawain ng batang isisilang.
- source_word: מִשְׁפַּט הַנַּעַר
  choice: tuntuning dapat sundin para sa bata
  rationale: Ang מִשְׁפַּט ay maaaring tumukoy sa itinakdang tuntunin, kaugalian, o paraan ng pamumuhay. Ang pariralang ito ay malinaw at natural sa Tagalog nang hindi ito ginagawang tiyak na kautusang legal.
- source_word: וּמַעֲשֵׂהוּ
  choice: at ano ang magiging gawain niya
  rationale: Pinananatili ng “gawain” ang lawak ng מַעֲשֶׂה, na maaaring tumukoy sa gagawin, kilos, tungkulin, o gawain ng bata.
theological_decisions:
- issue: Kung ang יָבֹא דְבָרֶיךָ ay isang kahilingan o temporal na palagay
  choice: 'Kahilingan: “matupad nawa ang mga sinabi mo”'
  alternative: “Kapag natupad na ang mga sinabi mo”
  rationale: Maaaring marinig ang Hebreo bilang optatibo o temporal. Pinili sa pangunahing teksto ang likas na kahilingan, ngunit pinanatili sa talababa ang tunay na alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “tuntuning dapat sundin” upang maging natural ang diwa ng מִשְׁפַּט, at “gawain” upang huwag limitahan ang malawak na kahulugan ng מַעֲשֶׂה. Lahat ng marker ng talababa ay nasa pangunahing teksto.
