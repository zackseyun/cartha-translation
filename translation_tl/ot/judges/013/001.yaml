  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: tl
  text: Muling gumawa ng masama sa paningin ni Yahweh ang mga Israelita[a], at ibinigay sila ni Yahweh sa kamay ng mga Filisteo[b] sa loob ng apatnapung taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ang mga anak ni Israel”; isang panlahatang katawagan para sa bayang Israel.
    reason: lexical_alternative
  - marker: b
    text: Ang “sa kamay ng mga Filisteo” ay isang idyomang Hebreo na nangangahulugang nasa ilalim ng kanilang kapangyarihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: Muling gumawa
  rationale: Ang יסף na may infinitibo ay nagpapahayag ng pag-uulit o pagpapatuloy. Sa paulit-ulit na siklo ng Mga Hukom, natural na ipinahahayag ng “muling gumawa” na inulit ng Israel ang dati nitong kasamaan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Literal itong “mga anak ni Israel,” ngunit isa itong panlahatang katawagan sa buong bayang Israel. Mas natural at malinaw sa modernong Filipino ang “mga Israelita,” habang pinananatili ang saklaw ng Hebreo.
- source_word: לַעֲשׂוֹת הָרַע
  choice: gumawa ng masama
  rationale: Karaniwang pormula ito sa Mga Hukom. Ang “gumawa ng masama” ay natural sa Filipino at tapat sa moral na pagtatasa ng teksto.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili nito ang malinaw na metapora ng Hebreo at ipinahahayag na masama ang ginawa ayon sa pagtatasa ni Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: וַיִּתְּנֵם
  choice: ibinigay sila
  rationale: Pinananatili nito ang payak na pandiwang נתן; nililinaw ng kasunod na idyomang “sa kamay” na isinailalim sila sa kapangyarihan ng mga Filisteo.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: sa kamay ng mga Filisteo
  rationale: Pinananatili ang larawang Hebreo ng “kamay” bilang sagisag ng kapangyarihan o pamamahala; ipinaliliwanag ang idyoma sa talababa.
- source_word: פְּלִשְׁתִּים
  choice: mga Filisteo
  rationale: Ito ang nakagawiang modernong katawagang Filipino para sa pangkat na ito.
- source_word: אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taon
  rationale: Natural na ipinahahayag nito sa Filipino ang tagal na tinutukoy ng parirala.
theological_decisions:
- issue: Paglilipat sa pangalang tipan na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Panlahatang katawagang בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  alternative: ang mga anak ni Israel; ang sambayanang Israel
  rationale: Bagaman literal na “mga anak ni Israel,” idiomatikong tumutukoy ito sa buong bayan, hindi lamang sa mga lalaking indibidwal. Ang “mga Israelita” ang pinakanatural na panlahatang katumbas sa Filipino, at itinatala sa talababa ang literal na anyo.
- issue: Pagkilos ni Yahweh sa pagsasailalim ng Israel
  choice: ibinigay sila ni Yahweh sa kamay ng mga Filisteo
  alternative: ipinaubaya sila ni Yahweh sa kapangyarihan ng mga Filisteo
  rationale: Pinananatili ang tuwirang pagsasangkot ng teksto kay Yahweh at ang Hebreong larawan ng “kamay,” nang hindi binabawasan o pinalalawak ang teolohikong tensiyon nito.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang natural na ayos ng pangungusap, pinanatili ang Hebreong metapora na “sa paningin” at “sa kamay,” at iniwasan ang denominasyonal na terminolohiya.
