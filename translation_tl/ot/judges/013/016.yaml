  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: tl
  text: Sinabi ng anghel ni Yahweh kay Manoa, “Kung patatagalin mo ako rito, hindi ako kakain ng pagkain mo.[a] Ngunit kung maghahanda ka ng handog na sinusunog, ialay mo iyon kay Yahweh.[b]” Hindi kasi alam ni Manoa na siya ang anghel ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinapay mo.” Dito, ang “tinapay” ay malamang na tumutukoy sa pagkain o buong kainan sa pangkalahatan.
    reason: lexical_alternative
  - marker: b
    text: O “Kung gagawa ka ng handog na sinusunog, dapat mo itong ialay kay Yahweh.” Magkaibang pandiwa ang ginamit sa Hebreo para sa paghahanda ng handog at sa pag-aalay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng sugo o anghel, ngunit sa salaysay na ito ay isang makalangit na sugo ang tinutukoy; pinananatili rin ang pangalang Yahweh para sa יְהוָה.
- source_word: תַּעְצְרֵנִי
  choice: patatagalin mo ako rito
  rationale: Ang עצר ay maaaring mangahulugang pigilan o panatilihin sa isang lugar. Sa konteksto, hinihiling ni Manoa na manatili ang panauhin habang naghahanda siya ng pagkain.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: hindi ako kakain ng pagkain mo
  rationale: Literal na ‘tinapay mo,’ ngunit karaniwang ginagamit ang לֶחֶם para sa pagkain o isang kainan sa pangkalahatan. Mas natural sa kasalukuyang Tagalog ang ‘pagkain mo.’
- source_word: תַּעֲשֶׂה עֹלָה
  choice: maghahanda ka ng handog na sinusunog
  rationale: Ang עשה kasama ng isang hain ay maaaring tumukoy sa paggawa o paghahanda nito. Ang ‘maghahanda’ ay nagpapanatili ng pagkakaiba nito sa kasunod na pandiwang tumutukoy sa mismong pag-aalay.
- source_word: עֹלָה
  choice: handog na sinusunog
  rationale: Ito ang malinaw at karaniwang paglalarawan sa haing עֹלָה, na pinaiilanglang sa pamamagitan ng pagsunog.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: ialay mo iyon kay Yahweh
  rationale: Sa kontekstong panghain, ang Hiphil ng עלה ay nangangahulugang paakyatin o ihandog. Natural na ipinahahayag ng ‘ialay’ ang gawaing ito sa Tagalog.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: Hindi kasi alam ni Manoa
  rationale: Ang כִּי ay nagpapakilala rito ng paliwanag ng tagapagsalaysay; natural itong ipinahahayag ng ‘kasi’ sa modernong Tagalog.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: na siya ang anghel ni Yahweh
  rationale: Pinananatili ng ‘siya’ ang tahasang panghalip na הוּא at ang hindi pagkakilala ni Manoa sa katauhan ng kaniyang kausap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyong ‘Yahweh’ upang mapanatili ang personal na banal na pangalan sa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: sugo ni Yahweh
  rationale: Pinakamalinaw sa konteksto ang ‘anghel’ dahil kalaunan ay hayagang kinikilala ng salaysay na makalangit ang panauhin. Hindi dinaragdagan ng salin ang teksto ng tiyak na doktrina tungkol sa kaniyang pagkakakilanlan.
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang pinananatili ang pangalang nasa tekstong Hebreo at hindi ito pinapalitan ng titulong ‘PANGINOON.’
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang ‘patatagalin mo ako rito’ sa halip na mas pormal na ‘pipigilin mo ako’ upang umayon sa sitwasyong hinihiling sa panauhin na manatili. Pinanatili ang bahagyang pag-uulit sa ‘handog’ at ‘ialay’ upang maipakita ang dalawang magkaibang kilos sa Hebreo.
