translation_notes:
  register: Modernong Filipino Tagalog na simple ngunit marangal. Ginamit ang “taga-Zora” at “Manoa” bilang natural na anyo ng mga pangalan, at hinati sa maiikling pangungusap upang maging malinaw nang hindi nawawala ang daloy ng Hebreong salaysay.
