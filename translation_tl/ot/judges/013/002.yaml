base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: tl
  text: May isang lalaki na taga-Zora, mula sa angkan ng mga Danita. Manoa ang pangalan niya. Baog ang asawa niya at hindi pa nagkaanak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “at hindi nanganak.” Sa literal, “at hindi siya nanganak.”
    reason: Pinananatili ang mas literal na posibilidad ng ילד at nililinaw na walang tahasang salitang “anak” sa Hebreo.
lexical_decisions:
- source_word: וַיְהִי
  choice: May
  rationale: Ipinakikilala ng anyong pandiwa ang isang bagong tagpo sa salaysay. Likas sa modernong Tagalog ang konstruksyong “May isang lalaki” at hindi ito nagdaragdag ng tahasang panandang-panahon na wala sa Hebreo.
- source_word: אִישׁ אֶחָד
  choice: isang lalaki
  rationale: Ipinakikilala nito ang isang partikular na taong papangalanan kasunod. Sapat at natural sa Tagalog ang “isang lalaki”; magiging pilit ang “isang tiyak na lalaki.”
- source_word: מִצָּרְעָה
  choice: na taga-Zora
  rationale: Ipinahihiwatig ng מִן ang pinagmulan o kinaroroonan. Ang “taga-Zora” ang pinakanatural na pagtukoy sa pinanggalingang bayan sa Tagalog.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: mula sa angkan ng mga Danita
  rationale: Ang מִשְׁפָּחָה ay isang pangkat ng magkakamag-anak sa loob ng mas malaking tribo, kaya “angkan” ang mas tiyak kaysa “tribo.” Kolektibong tinutukoy ng הַדָּנִי ang mga Danita.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: Manoa ang pangalan niya
  rationale: Natural na Tagalog ito para sa karaniwang pormula ng pagpapangalan sa Hebreo, habang pinananatili ang tuwirang pagpapakilala sa pangalan.
- source_word: וְאִשְׁתּוֹ עֲקָרָה
  choice: Baog ang asawa niya
  rationale: Ang “baog” ay maikli, karaniwan, at tuwirang katumbas ng עֲקָרָה sa konteksto ng salaysay tungkol sa panganganak.
- source_word: וְלֹא יָלָדָה
  choice: at hindi pa nagkaanak
  rationale: Ang ילד na ang simuno ay babae ay tumutukoy sa panganganak. Natural sa Tagalog ang “hindi pa nagkaanak” at hindi nito ipinapalagay kung isa o marami ang anak, sapagkat walang tahasang layon sa Hebreo.
