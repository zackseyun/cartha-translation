base_translation:
  language: en
  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: tl
  text: Kaya nagmadali at tumakbo ang babae, at ibinalita niya ito sa kanyang asawa. Sinabi niya rito, “Tingnan mo, nagpakita sa akin ang lalaking pumunta sa akin noong araw na iyon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “noong isang araw.” Sa literal, “na pumunta sa akin sa araw”; tumutukoy ito sa nauna niyang pagdalaw.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: nagmadali
  rationale: Tuwirang ipinapahayag ng salitang mula sa מהר ang pagmamadali; natural ito sa makabagong Tagalog.
- source_word: וַתָּרָץ
  choice: tumakbo
  rationale: Pinananatili ang tiyak na kahulugan ng רוץ at ang hiwalay na ikalawang kilos upang maipakita ang dobleng paglalarawan ng kanyang pagmamadali.
- source_word: וַתַּגֵּד
  choice: sinabi
  rationale: Ang Hiphil ng נגד ay nangangahulugang magsabi o magbalita. Ang “sinabi” ay natural sa salaysay at angkop sa kasunod na tuwirang pananalita.
- source_word: לְאִישָׁהּ
  choice: sa kanyang asawa
  rationale: Bagaman maaaring mangahulugang “lalaki” ang אִישׁ, sa kontekstong pantahanan at may hulaping pambabae ay idyomatiko itong tumutukoy sa asawa ng babae.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ang הִנֵּה. Ipinahahayag ng “Tingnan mo” ang biglaan at buhay na tono nang hindi gumagamit ng makaluma o labis na pormal na pananalita.
- source_word: נִרְאָה אֵלַי
  choice: nagpakita sa akin
  rationale: Ang Niphal ng ראה rito ay tumutukoy sa pagpapakita o paglitaw ng isang tao sa nagsasalita. Natural at tuwiran ang “nagpakita sa akin” sa Tagalog.
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: Tumutukoy ito sa taong dati nang nakita ng babae. Pinananatili ng “ang lalaki” ang mismong paglalarawan niya at hindi inuunahan ang mas ganap na pagkakakilanlan ng tauhan sa konteksto.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלָי
  choice: na pumunta sa akin noong araw na iyon
  rationale: Sa literal, “na pumunta sa akin sa araw.” Sa konteksto, ibinabalik nito ang mambabasa sa naunang pagdalaw; malinaw at natural sa Tagalog ang “noong araw na iyon.”
theological_decisions:
- issue: Pagkakakilanlan ng הָאִישׁ sa sinabi ng babae
  choice: ang lalaki
  alternative: ang anghel; ang sugo ng Diyos
  rationale: Bagaman ipinakikilala ng mas malawak na konteksto ang tauhan bilang ang anghel ng PANGINOON, “ang lalaki” lamang ang tawag sa kanya ng babae rito. Hindi ipinapasok sa talata ang mas ganap na pagkakakilanlan mula sa ibang bahagi ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang magkahiwalay na “nagmadali” at “tumakbo” upang maipakita ang diin ng Hebreo, at ginamit ang natural na pananalita sa tuwirang sipi.
