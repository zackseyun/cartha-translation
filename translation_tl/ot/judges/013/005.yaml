- from: Sapagkat masdan mo, nagdadalang-tao ka at manganganak ka ng isang anak na lalaki. Walang labaha ang daraan sa kanyang ulo, sapagkat ang bata ay magiging Nazareo ng Diyos mula pa sa sinapupunan; at siya ang magsisimulang magligtas sa Israel mula sa kamay ng mga Filisteo.
  to: Sapagkat tingnan mo, nagdadalang-tao ka at manganganak ka ng isang anak na lalaki. Hindi madadaanan ng labaha ang kanyang ulo, sapagkat ang bata ay magiging Nazareo ng Diyos mula pa sa sinapupunan, at siya ay magsisimulang magligtas sa Israel mula sa kamay ng mga Filisteo.
