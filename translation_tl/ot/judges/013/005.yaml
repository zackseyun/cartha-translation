    issue: Hindi likas ang 'walang labaha ang daraan sa kanyang ulo.'
    rationale: Bagaman pagtatangkang literalin nito ang Hebreong idyoma, maaari itong unawain bilang simpleng pagdaan ng isang labaha sa ibabaw ng ulo at hindi bilang pagbabawal sa pag-ahit. Ang pasibong 'Hindi madadaanan ng labaha ang kanyang ulo' ay mas natural at malinaw, habang pinananatili ang imahen ng labaha at ulo.
  - severity: low
    issue: Medyo lipas o hindi karaniwan ang 'masdan mo' sa pormulang ito.
    rationale: Ang 'Tingnan mo' ay mas natural na modernong Filipino para sa deiktikong pantawag-pansin na הִנָּךְ, nang hindi binabawasan ang diin ng pahayag.
