  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: tl
  text: Sapagkat tingnan mo, nagdadalang-tao ka at manganganak ka ng isang anak na lalaki. Hindi madadaanan ng labaha ang kanyang ulo, sapagkat ang bata ay magiging Nazareo ng Diyos mula pa sa sinapupunan, at siya ay magsisimulang magligtas sa Israel mula sa kamay ng mga Filisteo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנָּךְ
  choice: masdan mo
  rationale: Nagbibigay-pansin at nagbibigay-diin sa pahayag; pinananatili ang maringal na puwersa nang hindi gumagamit ng lipas na pananalita.
- source_word: הָרָה
  choice: nagdadalang-tao ka
  rationale: Pang-uring panaguri ito na nagsasaad ng kasalukuyang kalagayan, hindi pandiwang nangangahulugang 'maglilihi ka.'
- source_word: וְיֹלַדְתְּ בֵּן
  choice: manganganak ka ng isang anak na lalaki
  rationale: Likas at malinaw na Filipino para sa kapanganakang darating, habang tahasang pinananatili ang kasarian ng bata.
- source_word: מוֹרָה
  choice: labaha
  rationale: Tiyak na tumutukoy sa kasangkapang pang-ahit sa konteksto ng pagiging Nazareo.
- source_word: לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: walang labaha ang daraan sa kanyang ulo
  rationale: Pinananatili ang Hebreong larawan ng labahang hindi 'aakyat/daraan' sa ulo at malinaw na ipinahihiwatig ang pagbabawal sa pag-ahit.
- source_word: נְזִיר אֱלֹהִים
  choice: Nazareo ng Diyos
  rationale: Pinananatili ang teknikal na katawagan sa taong natatanging itinalaga sa Diyos sa halip na gawing pangkalahatang paraphrase.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Angkop sa ipinangakong anak at hindi nagpapahiwatig na siya ay nasa hustong gulang na.
- source_word: מִן הַבָּטֶן
  choice: mula pa sa sinapupunan
  rationale: Pinananatili ang tahasang pagtukoy sa sinapupunan at ang diin sa pagtatalaga bago pa isilang.
- source_word: יָחֵל
  choice: magsisimula
  rationale: 'Mahalagang pinananatili ang kahulugang pagsisimula: pasisimulan niya ang pagliligtas ngunit hindi sinasabing siya lamang ang tatapos nito.'
- source_word: לְהוֹשִׁיעַ
  choice: magligtas
  rationale: Saklaw nito ang pagliligtas o pagpapalaya mula sa kapangyarihan ng kaaway at likas ito sa konteksto.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: mula sa kamay ng mga Filisteo
  rationale: Pinananatili ang Hebreong larawang 'kamay' bilang kapangyarihan o paninikil ng mga Filisteo.
theological_decisions:
- issue: Kalikasan ng pagtatalaga kay Samson
  choice: Nazareo ng Diyos mula pa sa sinapupunan
  alternative: isang taong itinalaga sa Diyos mula nang ipanganak
  rationale: Ginagamit ng Hebreo ang teknikal na salitang נְזִיר at tahasang sinasabi ang sinapupunan; kaya hindi ito ginawang pangkalahatan o nilipat lamang sa sandali ng kapanganakan.
- issue: Lawak ng papel ni Samson sa pagliligtas sa Israel
  choice: siya ang magsisimulang magligtas sa Israel
  alternative: ililigtas niya ang Israel
  rationale: Tahasan sa יָחֵל ang pagsisimula. Iniiwasan nitong ipahiwatig na si Samson ang ganap na tatapos sa pagliligtas.
translation_notes:
  register: 'Makabagong, marangal, at madaling maunawaang Filipino. Ginamit ang kinikilalang terminong ''Nazareo'' at pinanatili ang imaheng ''kamay ng mga Filisteo.'' Walang talababa dahil ang ibinigay na marker [a] sa English consultation layer ay hindi tumutugma sa nilalaman ng talababa: nakalagay ito pagkatapos ng ''behold'' ngunit ang nota ay tungkol sa ''save/deliver.'' Hindi inilipat o nilikha ang marker nang walang matibay na batayan sa source apparatus.'
