  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: tl
  text: Pagkatapos, pumunta ang babae sa kanyang asawa at sinabi, “Isang tao ng Diyos ang dumating sa akin. Ang kanyang anyo ay tulad ng anyo ng isang anghel[a] ng Diyos—lubhang nakatatakot.[b] Hindi ko siya tinanong kung taga-saan siya, at hindi rin niya sinabi sa akin ang kanyang pangalan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo.” Ang salitang Hebreo ay maaaring tumukoy sa isang sugo, tao man o makalangit na nilalang; dito, ipinahihiwatig ng konteksto ang isang makalangit na sugo.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “lubhang kasindak-sindak” o “lubhang nakapangingilabot.” Ang salitang Hebreo ay nagpapahayag ng matinding takot at pagkamangha.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Pinananatili ang tahasang katawagan ng Hebreo sa tauhang tinutukoy na sa salaysay; ipinakikita naman ng “kanyang asawa” ang kaugnayan niya kay Manoa.
- source_word: לְאִישָׁהּ
  choice: sa kanyang asawa
  rationale: Sa kontekstong pangmag-asawa, ang אִישׁ na may hulaping pambabae ay likas na tumutukoy sa kanyang asawa.
- source_word: אִישׁ הָאֱלֹהִים
  choice: isang lalaking lingkod ng Diyos
  rationale: Inihahatid nito ang pagiging lalaki at ang kinikilalang titulong “man of God” sa natural na modernong Tagalog, nang hindi agad ipinapantay ang bisita sa anghel.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: Ang anyo niya ay tulad ng anyo
  rationale: Pinananatili ang pag-uulit ng מַרְאֶה at ang tahasang paghahambing sa orihinal.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: isang anghel ng Diyos
  rationale: Natural itong nagpapahayag ng paghahambing sa isang makalangit na sugo nang hindi ipinapalagay na ganap nang nakilala ng babae ang bisita sa puntong ito.
- source_word: נוֹרָא מְאֹד
  choice: lubhang nakatatakot
  rationale: Inihahatid ang matinding takot at pagpipitagan na maaaring ipahiwatig ng נוֹרָא; inilalahad sa talababa ang saklaw na may kasamang pagkamangha.
- source_word: אֵי מִזֶּה הוּא
  choice: kung taga-saan siya
  rationale: Ito ang natural na tanong sa modernong Tagalog tungkol sa pinagmulan ng isang tao.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: hindi rin niya sinabi sa akin ang kanyang pangalan
  rationale: Direkta at malinaw na ipinahahayag ang kahulugan ng “ipinaalam/isinabi,” habang ginagaya ng “rin” ang karugtong na negatibong sugnay.
theological_decisions:
- issue: Pagkakakilanlan ng מַלְאַךְ הָאֱלֹהִים sa pag-unlad ng salaysay
  choice: isang anghel ng Diyos
  alternative: ang anghel ng Diyos; isang mensahero ng Diyos
  rationale: Hindi nito inuunahan ang susunod na pagkilala sa bisita at pinananatili ang pananaw ng babae sa mismong ulat niya. Ang talababa ay nagpapanatili rin sa pangunahing kahulugan ng מַלְאַךְ bilang “mensahero/sugo.”
- issue: Ugnayan ng “lalaking lingkod ng Diyos” at “anghel ng Diyos”
  choice: panatilihin bilang paghahambing, hindi tahasang pagkakakilanlan
  alternative: tukuyin agad ang lalaki bilang anghel ng Diyos
  rationale: Ang כְּ (“tulad ng”) ay naghahayag ng paghahambing sa anyo. Hindi dapat tahasang lutasin ng salin ang tensiyong pasalaysay na naroon pa sa talata.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “lalaking lingkod ng Diyos” sa halip na ang di-likas na literal na “lalaki ng Diyos,” at pinanatili ang pag-uulit ng “anyo” upang maipakita ang diin ng Hebreo.
