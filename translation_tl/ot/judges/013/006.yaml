  to: Pagkatapos, pumunta ang babae sa kanyang asawa at sinabi, “Isang tao ng Diyos ang dumating sa akin. Ang kanyang anyo ay tulad ng anyo ng isang anghel[a] ng Diyos—lubhang nakatatakot.[b] Hindi ko siya tinanong kung taga-saan siya, at hindi rin niya sinabi sa akin ang kanyang pangalan.”
