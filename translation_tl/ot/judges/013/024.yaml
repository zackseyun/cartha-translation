  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: tl
  text: At nagsilang ng isang anak na lalaki ang babae at pinangalanan niya itong Samson. Lumaki ang bata, at pinagpala siya ni Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: nagsilang
  rationale: Karaniwang pandiwa para sa panganganak; likas at marangal sa makabagong Filipino.
- source_word: הָאִשָּׁה
  choice: ang babae
  rationale: Tuwirang pinananatili ang katawagan ng Hebreo, na tumutukoy sa asawa ni Manoa nang hindi idinaragdag iyon sa talata.
- source_word: בֵּן
  choice: isang anak na lalaki
  rationale: Malinaw na ipinahahayag ang kasarian ng ipinanganak at natural sa konteksto ng kapanganakan.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: pinangalanan niya itong
  rationale: Natural na katumbas sa Filipino ng Hebreong pormula ng pagbibigay ng pangalan; ang literal na 'tinawag ang pangalan niya' ay hindi likas sa kasalukuyang gamit.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Ginamit ang nakasanayang anyo ng pangalang ito sa Filipino.
- source_word: וַיִּגְדַּל
  choice: lumaki
  rationale: Sa konteksto, tumutukoy ito sa paglaki ng bata, hindi sa pagiging dakila.
- source_word: הַנַּעַר
  choice: ang bata
  rationale: Saklaw ng נַעַר ang bata hanggang kabataang lalaki; ang 'bata' ang pinakaangkop kasunod ng salaysay ng kapanganakan.
- source_word: וַיְבָרְכֵהוּ
  choice: pinagpala siya
  rationale: Pinananatili ang karaniwang at teolohikal na diwa ng ugat na ברך.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito sa transliterasyong Yahweh sa halip na gumamit ng pamalit na titulo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang payak na pagkakasunod-sunod ng salaysay, ngunit ginawang natural ang Hebreong pormula ng pagpapangalan.
