revisions:
- from: At makapangyarihang bumaba sa kanya ang Espiritu ni Yahweh[a], at nilapa niya ang leon na parang batang kambing, kahit wala siyang anumang hawak[b]. Ngunit hindi niya sinabi sa kanyang ama o ina ang ginawa niya.
  to: At biglang dumating kay Samson ang Espiritu ni Yahweh[a], at pinunit niya ang leon gaya ng pagpunit sa batang kambing, kahit wala siyang anumang hawak[b]. Ngunit hindi niya sinabi sa kanyang ama o ina ang ginawa niya.
  rationale: 'Pinalitan ang “bumaba” ng “biglang dumating” upang maipahayag ang puwersahan at biglaang pagdating ng Espiritu. Pinalitan ang “nilapa” ng “pinunit” upang tumugma sa marahas na pagpunit na ipinahahayag ng Hebreo. Ginawang tahasan ang paghahambing: pinunit niya ang leon gaya ng pagpunit sa batang kambing.'
