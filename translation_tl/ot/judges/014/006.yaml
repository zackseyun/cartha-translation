  source_fidelity: Kailangang baguhin ang dalawang pangunahing pandiwa. Ang וַתִּצְלַח עָלָיו ay hindi nangangahulugang literal na “bumaba,” kundi bigla at makapangyarihang dumating/sumapit sa kanya. Ang וַיְשַׁסְּעֵהוּ ay “pinunit” o “pinagpira-piraso,” hindi “nilapa,” na nangangahulugang kinain o dinakmal ng isang hayop. Hindi rin dapat mawala ang kilos na nasa paghahambing sa batang kambing.
  naturalness: Ang binagong salin ay modernong Filipino, malinaw, at may marangal na rehistro. Ang “biglang dumating kay Samson” ay likas na paraan upang maipahayag ang biglaan at makapangyarihang pagkilos ng Espiritu nang hindi ipinapakahulugang pisikal na pagbaba.
  terminology: Ang “Espiritu ni Yahweh” ay tapat sa רוּחַ יְהוָה at ang “Yahweh” ay naaayon sa ibinigay na patakaran. Ang “batang kambing” ay malinaw na katumbas ng גְּדִי.
