  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: tl
  text: At biglang dumating kay Samson ang Espiritu ni Yahweh[a], at pinunit niya ang leon gaya ng pagpunit sa batang kambing, kahit wala siyang anumang hawak[b]. Ngunit hindi niya sinabi sa kanyang ama o ina ang ginawa niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “makapangyarihang dumating sa kanya” o “sumapit sa kanya nang may kapangyarihan.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “at walang anuman sa kanyang kamay”; ipinahihiwatig nito na wala siyang hawak na sandata o kasangkapan.
    reason: clarification
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: makapangyarihang bumaba sa kanya
  rationale: Ipinahahayag ng צלח עַל ang biglaan at makapangyarihang pagkilos ng Espiritu sa isang tao. Likas sa Filipino ang pariralang ito at hindi nito ipinapalagay na literal na pagdaluhong ang tinutukoy.
- source_word: רוּחַ יְהוָה
  choice: Espiritu ni Yahweh
  rationale: Sa konteksto, ito ang Espiritu ng Diyos na nagbibigay ng pambihirang lakas, hindi hangin o disposisyon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang banal na nakasulat sa tekstong Hebreo.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: nilapa niya ang leon
  rationale: Ang שׁסע ay marahas na pagpunit o paghati. Sa Filipino, malinaw at masinsin ang “nilapa,” at tahasang inuulit ang leon na tinutukoy ng panlalaking hulapi mula sa naunang konteksto.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: na parang batang kambing
  rationale: 'Pinaiikli ang paghahambing sa likas na Filipino habang nananatili ang diwa: nilapa niya ang leon kung paanong madaling lapain ang batang kambing.'
- source_word: הַגְּדִי
  choice: batang kambing
  rationale: Mas malinaw ito sa modernong Filipino kaysa sa anumang teknikal o di-pamilyar na katawagan.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: kahit wala siyang anumang hawak
  rationale: Ipinakikita ng sugnay na wala siyang sandata o kasangkapang ginamit. Ang “kahit” ay natural na naghahatid ng pahiwatig na pasalungat.
- source_word: וְלֹא הִגִּיד
  choice: Ngunit hindi niya sinabi
  rationale: Ang “ngunit” ay natural na nagpapakita ng bahagyang pagsalungat sa pambihirang gawa na kasisimula lamang isalaysay.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: sa kanyang ama o ina
  rationale: Pagkatapos ng negatibong pandiwa, natural sa Filipino ang “o” upang sabihing hindi niya sinabi sa alinman sa dalawang magulang.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: ang ginawa niya
  rationale: Direkta at natural itong katumbas ng Hebreo; sapat na ang daloy ng salaysay upang ipakitang nauna ang ginawa kaysa sa hindi niya pagsasabi.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang nasa Hebreo. Pinananatili ng “Yahweh” ang pagkakakilanlan nito nang hindi pinapalitan ng titulo o ibang anyong transliterasyon.
- issue: Kalikasan ng רוּחַ sa konteksto
  choice: Espiritu
  alternative: espiritu / hangin
  rationale: Ang nagbibigay-lakas na pagkilos na sumunod ay tumutukoy sa Espiritu ng Diyos. Ginagamit ang malaking titik bilang pantanging pagtukoy, nang hindi nagdaragdag ng paliwanag na wala sa talata.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang “nilapa” upang ihatid ang marahas na pagpunit ng leon, at iniwasan ang sobrang literal ngunit alanganing ayos. Ang mga panandang [a] at [b] ay kapuwa nasa pangunahing teksto at tumutugma sa mga talababa.
