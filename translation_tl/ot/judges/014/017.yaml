base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: tl
  text: Patuloy siyang umiyak kay Samson sa buong pitong araw na idinaraos nila ang handaan.[a] Nang ikapitong araw, ipinaalam niya ito sa kanya, dahil matindi ang pangungulit niya. Pagkatapos, ipinaalam naman niya ang bugtong sa mga lalaking kababayan niya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “umiyak siya sa kanya” o “umiyak siya sa ibabaw niya.” Ipinahihiwatig ng idyomang Hebreo na ang patuloy niyang pag-iyak ay nakatuon kay Samson at nagsilbing emosyonal na panggigipit.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “mga anak na lalaki ng kanyang bayan”; malamang na tumutukoy ito sa mga lalaking kababayan niya, partikular sa mga Filisteong kasama sa handaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: Umiyak siya sa harap ni Samson
  rationale: Ang בכה ay “umiyak,” at ang עַל na may hulaping panghalip ay nagpapakitang ang pag-iyak ay nakatuon kay Samson at ginagamit bilang patuloy na emosyonal na panggigipit. Natural sa modernong Tagalog ang “sa harap ni Samson,” habang ipinapaliwanag sa talababa ang kakaibang idyomang Hebreo.
- source_word: שִׁבְעַת הַיָּמִים
  choice: sa buong pitong araw
  rationale: Tinutukoy ng parirala ang kabuuang takbo ng pitong araw. Ang “buong” ay natural sa Tagalog at pinananatili ang diin sa tagal.
- source_word: אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: na idinaraos nila ang handaan
  rationale: Ang מִשְׁתֶּה ay handaan o piging, kadalasang may pag-inom. Hindi tinutukoy bilang “kasalan” upang hindi magdagdag ng espesipikong kahulugang hindi hayag sa salita.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Nang ikapitong araw
  rationale: Natural na panandang pasalaysay sa Tagalog na malinaw na pinananatili ang takdang araw.
- source_word: וַיַּגֶּד לָהּ
  choice: sinabi rin ni Samson sa kanya ang sagot
  rationale: Ang נגד ay “sabihin/ipaalam.” Bagaman hindi inuulit sa Hebreo ang layon, malinaw sa konteksto na ang ipinahayag ay ang sagot sa bugtong. Ginamit ang pangalang Samson upang maiwasan ang malabong sunod-sunod na panghalip sa Tagalog.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: dahil matindi ang pangungulit niya
  rationale: Ang hiphil ng צוק ay nagpapahiwatig ng matinding at tuloy-tuloy na paggigiit o panggigipit. Ang “matindi ang pangungulit” ay malinaw, kasalukuyan, at hindi labis na teknikal.
- source_word: וַתַּגֵּד הַחִידָה
  choice: sinabi naman niya ang sagot sa bugtong
  rationale: Sa konteksto, ang “pagsasabi ng bugtong” ay ang pagbubunyag ng sagot nito. Ang “naman” ay natural na nagpapakita na ipinasa ng babae sa kanyang mga kababayan ang nalaman niya, nang hindi nagdaragdag ng motibong wala sa teksto.
- source_word: לִבְנֵי עַמָּהּ
  choice: sa mga kalalakihan ng sarili niyang bayan
  rationale: Literal itong “mga anak na lalaki ng kanyang bayan.” Sa konteksto, tumutukoy ito sa mga lalaking kabilang sa sarili niyang mga kababayan; pinananatili ng salin ang panlalaking pagtukoy sa halip na gawing pangkalahatang “mga kababayan.”
