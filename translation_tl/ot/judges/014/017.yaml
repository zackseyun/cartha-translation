  register: Modernong Filipino na payak ngunit marangal. Gumamit ng malinaw na mga pangalan at pangngalan kung magiging malabo sa Tagalog ang serye ng mga panghalip. Pinanatili ang pitong-araw na pahayag ng Hebreo kahit may likas na tensiyon ito sa pagbanggit na sa ikapitong araw lamang nagsabi si Samson.
