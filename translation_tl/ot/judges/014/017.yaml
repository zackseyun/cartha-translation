revisions:
- from: Umiyak siya sa harap ni Samson sa buong pitong araw na idinaraos nila ang handaan.[a] Nang ikapitong araw, sinabi rin ni Samson sa kanya ang sagot dahil matindi ang pangungulit niya. Pagkatapos, sinabi naman niya ang sagot sa bugtong sa mga kalalakihan ng sarili niyang bayan.[b]
  to: Patuloy siyang umiyak kay Samson sa buong pitong araw na idinaraos nila ang handaan.[a] Nang ikapitong araw, ipinaalam niya ito sa kanya, dahil matindi ang pangungulit niya. Pagkatapos, ipinaalam naman niya ang bugtong sa mga lalaking kababayan niya.[b]
  rationale: Inalis ang mga idinagdag na “sagot” upang panatilihin ang di-tahasang layon sa unang pagsasabi at ang tahasang “bugtong” sa ikalawa. Pinahusay din ang naturalness at ang paglapit sa puwersa ng Hebreong idyoma nang hindi ipinipilit ang literal na “sa ibabaw niya” sa pangunahing teksto. Napanatili ang mga talababa at wastong ikinabit ang mga ito sa mga kaugnay na pahayag.
