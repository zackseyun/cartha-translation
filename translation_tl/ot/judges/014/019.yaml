base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: tl
  text: At biglang dumating sa kanya ang Espiritu ni Yahweh nang may kapangyarihan. Bumaba siya sa Askelon at pumatay roon ng tatlumpung lalaki mula sa kanila. Kinuha niya ang kanilang mga kasuotan[a] at ibinigay ang mga pamalit na damit sa mga nagpaliwanag ng bugtong. Nag-alab ang galit niya, at umakyat siya sa bahay ng kanyang ama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring, “ang mga kasuotang hinubad sa kanila.” Maaaring mas tiyak na tumukoy ang salitang Hebreo sa mga damit na inalis sa mga napatay at kinuha bilang samsam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: makapangyarihang sumakanya ang Espiritu ni Yahweh
  rationale: Ipinahihiwatig ng צלח kasama ng רוּחַ יְהוָה ang biglaan at makapangyarihang pagkilos ng Espiritu kay Samson. Likas sa modernong Tagalog ang “sumakanya,” habang pinananatili ng “makapangyarihan” ang diin ng Hebreong parirala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang transliterasyon ng personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: Bumaba siya sa Askelon
  rationale: Tuwirang pinananatili ng “bumaba” ang direksiyonal na kahulugan ng ירד at natural itong basahin sa salaysay.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: pumatay doon ng tatlumpung lalaki mula sa kanila
  rationale: Sa konteksto, nakamamatay ang נכה, kaya malinaw ang “pumatay.” Pinananatili ng “mula sa kanila” ang partitive na מֵהֶם, samantalang nililinaw ng “doon” ang ugnayan sa Askelon nang hindi tahasang tinutukoy ang isang pangkat na hindi pinangalanan sa talata.
- source_word: חֲלִיצוֹתָם
  choice: kanilang mga kasuotan
  rationale: Pangunahing tumutukoy ang salita sa mga kasuotang kinuha mula sa mga napatay. Ang payak na “mga kasuotan” ay hindi labis na nagpapakahulugan; inilalahad sa talababa ang mas tiyak na posibleng diwa.
- source_word: הַחֲלִיפוֹת
  choice: mga bihisang pamalit
  rationale: Tumutukoy ito sa mga set o palit na kasuotan na ipinangakong gantimpala sa naunang pustahan. Ang “mga bihisang pamalit” ay malinaw at likas sa Tagalog.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: sa mga nagpaliwanag ng bugtong
  rationale: Sa konteksto, ang participle ng נגד ay tumutukoy sa mga nagsabi o nagpahayag ng sagot sa bugtong; malinaw itong naipapahayag ng “nagpaliwanag.”
- source_word: וַיִּחַר אַפּוֹ
  choice: Nag-alab ang galit niya
  rationale: Pinananatili nito ang Hebreong metapora ng nag-aapoy na galit at natural pa rin sa makabagong Tagalog.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: umakyat siya sa bahay ng kanyang ama
  rationale: Pinananatili ng “umakyat” ang literal at salaysay na direksiyon ng עלה sa halip na ipalit ang mas interpretibong “umuwi.”
theological_decisions:
- issue: Ang kaugnayan ng kapangyarihan ng Espiritu sa sumunod na karahasan
  choice: Inilahad lamang na makapangyarihang sumakanya ang Espiritu ni Yahweh
  alternative: Ipaliwanag na sinang-ayunan o hindi sinang-ayunan ng Diyos ang bawat ginawa ni Samson
  rationale: Tahasang iniuugnay ng teksto sa Espiritu ni Yahweh ang pagbibigay-kapangyarihan kay Samson, ngunit hindi nito ipinaliliwanag ang lahat ng usaping moral na kaakibat ng kanyang ginawa. Pinananatili ng salin ang tensiyong ito nang walang idinagdag na hatol.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino ang ginamit. Pinanatili ang maiikling sunod-sunod na kilos ng salaysay, ang metaporang “nag-alab ang galit,” at ang personal na pangalang Yahweh. Inilagay ang talababa sa “mga kasuotan,” ang salitang tunay na tinutukoy nito.
