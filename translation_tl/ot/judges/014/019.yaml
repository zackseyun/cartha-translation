revisions:
- from: At makapangyarihang sumakanya ang Espiritu ni Yahweh. Bumaba siya sa Askelon at pumatay doon ng tatlumpung lalaki mula sa kanila. Kinuha niya ang kanilang mga kasuotan[a] at ibinigay ang mga bihisang pamalit sa mga nagpaliwanag ng bugtong. Nag-alab ang galit niya, at umakyat siya sa bahay ng kanyang ama.
  to: At biglang dumating sa kanya ang Espiritu ni Yahweh nang may kapangyarihan. Bumaba siya sa Askelon at pumatay roon ng tatlumpung lalaki mula sa kanila. Kinuha niya ang kanilang mga kasuotan[a] at ibinigay ang mga pamalit na damit sa mga nagpaliwanag ng bugtong. Nag-alab ang galit niya, at umakyat siya sa bahay ng kanyang ama.
