  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: tl
  text: At ang asawa ni Samson ay naging asawa ng kanyang kasamahan[a], na dati niyang kaibigan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “naging asawa ng kanyang kaibigan, na nakisama sa kanya.” Magkaugnay na mga salita mula sa pangkat-salitang רעה ang ginamit sa Hebreo upang tukuyin ang pakikisama o ugnayang panlipunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: ay naging
  rationale: Ipinahihiwatig ng anyong pasalaysay ng היה ang pagbabago ng kalagayan o kinalabasan, kaya mas angkop ang “naging” kaysa sa payak na “ay.”
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: ang asawa ni Samson
  rationale: Tuwirang ipinahahayag ng construct chain ang ugnayang mag-asawa; ito ang natural na anyo sa modernong Filipino.
- source_word: לְמֵרֵעֵהוּ
  choice: naging asawa ng kanyang kasamahan
  rationale: Kasama ng היה, ang לְ ay nagpapahiwatig ng paglipat tungo sa bagong kaugnayan o pag-aari. Ang מֵרֵעַ ay tumutukoy sa isang kasama o kasamahan, lalo na sa konteksto ng kasalan.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: na naging kaibigan niya
  rationale: Ang pandiwang רעה rito ay tumutukoy sa pakikisama o pakikipagkaibigan, hindi sa pagpapastol. Pinananatili ng “naging kaibigan niya” ang kaugnayang panlipunan at ang posibleng pagbabago sa relasyon.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Filipino. Ginamit ang “kasamahan” sa pangunahing sugnay at “kaibigan” sa kasunod na sugnay upang maipakita ang magkaugnay ngunit hindi ganap na magkaparehong anyong Hebreo, habang iniiwasan ang hindi kailangang pag-uulit.
