base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: tl
  text: Bumaba si Samson kasama ang kanyang ama at ina patungong Timna. Pagdating nila sa mga ubasan ng Timna, at narito,[a] isang batang leon[b] ang umuungal habang papalapit sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Biglang.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “isang batang leon ng mga leon,” isang idyomang nangangahulugang “isang batang leon.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isalin na “umuungal upang salubungin siya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Bumaba
  rationale: Pinananatili nito ang diwang pababa ng pandiwang ירד at likas itong gamitin sa paglalakbay mula sa mataas na lupain patungong Timna.
- source_word: תִּמְנָתָה
  choice: patungong Timna
  rationale: Ipinahihiwatig ng hulaping direksiyonal na patungo sa Timna ang kilos; malinaw at natural ito sa Tagalog.
- source_word: וַיָּבֹאוּ עַד
  choice: Nang makarating sila hanggang sa
  rationale: Ipinapanatili ng “hanggang sa” ang עַד bilang puntong naabot nila sa paglalakbay, habang ang “nang makarating” ay maayos sa salaysay na Tagalog.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: mga ubasan ng Timna
  rationale: Tuwirang inilalarawan ng כְּרָמִים ang mga ubasan, at ang anyong konstrakto ay likas na isinasaling “ng Timna.”
- source_word: וְהִנֵּה
  choice: biglang
  rationale: Ginagawang buhay at natural sa modernong Tagalog ang pantawag-pansing הִנֵּה at ipinahihiwatig ang di-inaasahang paglitaw, habang inilalagay sa talababa ang mas pormal na anyo.
- source_word: כְּפִיר אֲרָיוֹת
  choice: isang batang leon
  rationale: Ang כְּפִיר ay batang leon ngunit hindi kinakailangang napakaliit na anak; ang kasunod na אֲרָיוֹת ay bahagi ng Hebreong idyoma at hindi kailangang ulitin sa pangunahing teksto.
- source_word: שֹׁאֵג
  choice: umuungal
  rationale: Ang pandiwaring Hebreo ay naglalarawan ng nagpapatuloy na kilos; natural na naipahahayag iyon ng “na umuungal.”
- source_word: לִקְרָאתוֹ
  choice: habang papalapit sa kanya
  rationale: Ipinahahayag nito ang galaw ng leon patungo kay Samson nang hindi labis na tinutukoy kung simpleng pagsalubong o paglusob ang eksaktong diwa.
