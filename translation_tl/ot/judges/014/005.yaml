translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang himig. Pinanatili ang direksiyong “bumaba,” ang puntong naabot sa “hanggang sa mga ubasan,” at ang bahagyang kalabuan ng לִקְרָאתוֹ. Ginamit ang “kanya” ayon sa karaniwang modernong baybay.
