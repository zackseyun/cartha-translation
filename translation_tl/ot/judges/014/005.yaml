revisions:
- from: Bumaba si Samson kasama ang kanyang ama at ina patungong Timna. Nang makarating sila hanggang sa mga ubasan ng Timna, biglang[a] may isang batang leon[b] na umuungal habang papalapit sa kanya.[c]
  to: Bumaba si Samson kasama ang kanyang ama at ina patungong Timna. Pagdating nila sa mga ubasan ng Timna, at narito,[a] isang batang leon[b] ang umuungal habang papalapit sa kanya.[c]
  rationale: Pinalitan ang interpretatibong “biglang” ng mas tuwirang “at narito,” at inayos ang pariralang nagsasaad ng pagdating sa mga ubasan upang maging likas sa modernong Tagalog. Pinanatili ang kahulugan at kalabuan ng paglalarawan sa kilos ng leon.
