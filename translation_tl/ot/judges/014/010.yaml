  naturalness: Ang “nagdaos doon si Samson ng isang handaan” ay likas at angkop sa marangal na makabagong Filipino. Mas malinaw at mas natural ang “ama ni Samson” kaysa sa cataphoric na “kanyang ama,” at mas payak ang “mga binata” kaysa “mga kabataang lalaki” nang hindi binabago ang saklaw ng Hebreong הַבַּחוּרִים.
