lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Pinananatili ang direksiyonal na diwa ng pandiwang ירד, “bumaba.”
- source_word: אָבִיהוּ
  choice: ang kanyang ama
  rationale: Ang hulaping panlalaking isahan ay tumutukoy sa ama ni Samson ayon sa konteksto.
- source_word: אֶל הָאִשָּׁה
  choice: papunta sa babae
  rationale: Tuwirang pinananatili ang “sa babae” nang hindi ito ginagawang “asawa” o “mapapangasawa,” bagaman malinaw sa konteksto ang papel niya.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: nagdaos ... ng isang handaan
  rationale: Sa Filipino, natural na kolokasyon ang “nagdaos ng handaan” para sa paggawa o paghahanda ng isang piging.
- source_word: שָׁם
  choice: doon
  rationale: Natural at tuwirang katumbas ng lokatibong pang-abay.
- source_word: מִשְׁתֶּה
  choice: handaan
  rationale: Malinaw at likas sa modernong Filipino; maaari itong tumukoy sa piging na may kasamang pag-inom nang hindi labis na tinutukoy ang detalye.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: sapagkat ganoon ang ginagawa
  rationale: Inihahayag nito ang nakaugaliang kilos habang nananatiling malapit sa anyong “ganoon ... ginagawa.”
- source_word: הַבַּחוּרִים
  choice: mga kabataang lalaki
  rationale: Iniiwasan ang posibleng labis na pagtukoy ng “mga binata” sa pagiging walang asawa; ang Hebreo ay karaniwang tumutukoy sa mga lalaking nasa kabataan o kasibulan.
