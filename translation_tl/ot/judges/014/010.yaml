  text: Kaya bumaba ang ama ni Samson sa babae, at nagdaos doon si Samson ng isang handaan[a], sapagkat ganoon ang ginagawa ng mga binata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “piging” o “piging na may inuman.” Ang salitang Hebreo na מִשְׁתֶּה ay madalas tumukoy sa isang masayang salu-salo na may kasamang pag-inom.
