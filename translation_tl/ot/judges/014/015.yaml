base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: tl
  text: Noong ikapitong araw, sinabi nila sa asawa ni Samson, “Hikayatin mo ang iyong asawa na sabihin sa amin ang bugtong. Kung hindi, susunugin ka namin at ang sambahayan ng iyong ama.[a] Inanyayahan ba ninyo kami upang agawan kami ng aming pag-aari?[b] Hindi ba?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahay ng iyong ama.” Ang pananalitang Hebreo ay maaaring tumukoy sa gusali o, sa mas malawak na diwa, sa sambahayan o pamilya ng ama.
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreo ay maaari ding unawain na “upang gawin kaming dukha” o “upang kamkamin ang aming pag-aari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: Hikayatin mo
  rationale: Ang Piel imperative ng פתה ay tumutukoy sa mapilit o mapanlinlang na panghihikayat. Likas sa modernong Tagalog ang “hikayatin” at hindi nito ipinapalagay ang tiyak na paraan ng pagmamanipula.
- source_word: אִישֵׁךְ
  choice: ang iyong asawa
  rationale: Sa konteksto, ang אִישׁ ay ang asawa niyang lalaki; malinaw at natural sa Tagalog ang “asawa.”
- source_word: וְיַגֶּד לָנוּ
  choice: na sabihin sa amin
  rationale: Kasunod ng pautos, ipinahahayag ng anyong ito ang layunin ng panghihikayat. Ang “na sabihin sa amin” ay likas na Tagalog.
- source_word: הַחִידָה
  choice: ang bugtong
  rationale: Ang חִידָה ay isang palaisipan o bugtong; “bugtong” ang pinakatiyak na katumbas sa konteksto.
- source_word: פֶּן נִשְׂרֹף אוֹתָךְ וְאֶת בֵּית אָבִיךְ בָּאֵשׁ
  choice: Kung hindi, susunugin ka namin at ang sambahayan ng iyong ama
  rationale: Ang פֶּן ay nagbabadya ng masamang kahihinatnan kapag hindi sinunod ang utos. Mas natural sa banta sa Tagalog ang “Kung hindi,” kaysa sa literal na “baka.”
- source_word: בֵּית אָבִיךְ
  choice: ang sambahayan ng iyong ama
  rationale: Maaaring tukuyin ng בֵּית אָבִיךְ ang bahay bilang gusali o ang sambahayan/pamilya. Pinili ang “sambahayan” sa teksto habang pinananatili sa talababa ang tunay na leksikal na alternatibo.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: para agawan ng pag-aari
  rationale: Ang ירשׁ dito ay maaaring mangahulugang samsaman, agawan ng pag-aari, o ipagkait ang ari-arian. Ang “agawan ng pag-aari” ay malinaw sa konteksto ng pustahan at pinananatili ang pagkilos laban sa kanila.
- source_word: קְרָאתֶם לָנוּ
  choice: Inanyayahan ba ninyo kami
  rationale: Sa konteksto ng handaan, ang קרא ל ay natural na “anyayahan.” Hindi idinagdag ang “rito,” na wala sa Hebreo.
- source_word: הֲלֹא
  choice: Hindi ba?
  rationale: Ang maikling retorikal na tanong ay umaasang sasang-ayon ang kausap at pinananatili ang mariing, maparatang na tono.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: nang ikapitong araw
  rationale: Karaniwan at malinaw na panandang temporal sa modernong Tagalog.
