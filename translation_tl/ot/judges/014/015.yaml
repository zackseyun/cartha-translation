  to: Noong ikapitong araw, sinabi nila sa asawa ni Samson, “Hikayatin mo ang iyong asawa na sabihin sa amin ang bugtong. Kung hindi, susunugin ka namin at ang sambahayan ng iyong ama.[a] Inanyayahan ba ninyo kami upang agawan kami ng aming pag-aari?[b] Hindi ba?”
