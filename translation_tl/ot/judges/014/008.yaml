  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: tl
  text: Pagkalipas ng ilang araw, bumalik siya upang pakasalan ang babae. Lumihis siya upang tingnan ang bangkay ng leon, at narito, may isang kuyog ng mga bubuyog sa bangkay ng leon, at may pulot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: Pagkalipas ng ilang araw
  rationale: Ipinahahayag ang di-tiyak na paglipas ng panahon nang hindi nagdaragdag ng tiyak na bilang.
- source_word: לְקַחְתָּהּ
  choice: upang kunin ang babae
  rationale: Pinananatili ang payak na diwa ng 'kunin siya' sa konteksto ng pag-aasawa, nang hindi tahasang pinapalitan ng 'pakasalan' ang mas malawak na pandiwang Hebreo.
- source_word: וַיָּסַר
  choice: Lumihis siya ng daan
  rationale: Likas na Tagalog para sa sadyang paglihis mula sa dinaraanan upang tingnan ang isang bagay.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: bangkay ng leon
  rationale: Ang parirala ay tumutukoy sa nakahandusay o patay na katawan ng leon; 'bangkay' ang malinaw at likas na katumbas sa konteksto.
- source_word: עֲדַת דְּבוֹרִים
  choice: isang kuyog ng mga bubuyog
  rationale: '''Kuyog'' ang karaniwang tawag sa pangkat o swarm ng mga bubuyog.'
- source_word: וּדְבָשׁ
  choice: at pulot-pukyutan
  rationale: Pinananatili ang maigsi at bahagyang eliptikong pangwakas ng Hebreo, na magkatabing binabanggit ang kuyog at ang pulot-pukyutan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'ang babae' upang maging natural ang reperensiya sa Tagalog habang iniiwasang gawing tahasan ang 'pakasalan' na hindi mismong pandiwa ng tekstong Hebreo. Pinanatili ang kapansin-pansing elipsis sa hulihan sa halip na lubusang pakinisin bilang 'at may pulot-pukyutan doon.'
