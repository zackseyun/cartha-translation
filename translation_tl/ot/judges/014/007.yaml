  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: tl
  text: Pagkatapos, bumaba siya at nakipag-usap sa babae, at naging kaaya-aya siya sa paningin ni Samson.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “nagustuhan siya ni Samson” o “mukhang tama siya para kay Samson.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Pagkatapos, bumaba siya
  rationale: Ang יָרַד ay literal na nangangahulugang bumaba. Pinananatili ng “bumaba” ang heograpikong pagkilos patungong Timna, samantalang natural na ipinahihiwatig ng “Pagkatapos” ang pagkakasunod-sunod ng salaysay na minamarkahan ng waw-consecutive.
- source_word: וַיְדַבֵּר
  choice: nakipag-usap
  rationale: Ang דִּבֵּר na may ל ay tumutukoy sa pagsasalita sa isang tao. Sa modernong Filipino, natural na ipinahihiwatig ng “nakipag-usap” na kinausap ni Samson ang babae nang hindi nagdaragdag ng hindi tiyak na nilalaman sa usapan.
- source_word: לָאִשָּׁה
  choice: sa babae
  rationale: Ang אִשָּׁה ay maaaring mangahulugang “babae” o “asawa.” Hindi pa sila kasal sa puntong ito, kaya ang “babae” ang pinakatumpak at hindi labis na mapagpasiya.
- source_word: וַתִּישַׁר
  choice: naging kaaya-aya ito
  rationale: Ang anyo mula sa יָשַׁר ay nagpapahayag na ang babae ay kaaya-aya, angkop, o tama ayon sa pagtataya ni Samson. Pinananatili ng “naging kaaya-aya” ang panlarawang diwa nang hindi ito pinapakitid sa simpleng “nagustuhan niya.”
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: sa paningin ni Samson
  rationale: Pinananatili nito ang Hebreong idyomang “sa mga mata/paningin ni Samson” sa paraang natural sa Filipino at iniiwan ang posibleng alingawngaw ng temang “tama sa sariling paningin” sa aklat ng Mga Hukom.
theological_decisions:
- issue: Posibleng kaugnayan sa paulit-ulit na tema sa Mga Hukom tungkol sa kung ano ang tama sa sariling paningin
  choice: Panatilihin sa pangunahing teksto ang idyomang “sa paningin ni Samson.”
  alternative: Isalin nang ganap na idyomatiko bilang “nagustuhan siya ni Samson” o “naging kalugod-lugod siya kay Samson.”
  rationale: Maaaring sadyang umalingawngaw ang Hebreong pananalita sa mas malawak na temang pampanitikan ng aklat. Ang pagpapanatili sa idyoma ay nag-iingat sa posibleng teolohikal at pampanitikang tensiyon nang hindi ipinipilit ang isang interpretasyon.
translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “nakipag-usap” ay mas natural kaysa sa literal na “nagsalita sa,” at ang “sa paningin ni Samson” ay nagpapanatili sa mahalagang Hebreong larawan nang hindi nagiging mahirap unawain.
