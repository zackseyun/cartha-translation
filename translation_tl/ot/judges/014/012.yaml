  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אָחֽוּדָה נָּ֥א לָ/כֶ֖ם חִידָ֑ה אִם הַגֵּ֣ד תַּגִּידוּ֩ אוֹתָ֨/הּ לִ֜/י שִׁבְעַ֨ת יְמֵ֤י הַ/מִּשְׁתֶּה֙ וּ/מְצָאתֶ֔ם וְ/נָתַתִּ֤י לָ/כֶם֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִפֹ֥ת בְּגָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: tl
  text: Sinabi ni Samson sa kanila, “Hayaan ninyong magbigay ako sa inyo ng isang bugtong. Kung talagang masasabi ninyo sa akin ang sagot at malulutas ninyo ito sa loob ng pitong araw ng handaan[a], bibigyan ko kayo ng tatlumpung kasuotang lino at tatlumpung pamalit na damit[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “habang ginaganap ang pitong araw na handaan.”
    reason: lexical_alternative
  - marker: b
    text: Hindi tiyak ang eksaktong uri ng mga kasuotan. Ang Hebreo ay tumutukoy sa mga kasuotang lino at mga set o pamalit na damit.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: Hayaan ninyong magbigay ako
  rationale: Ang cohortative na may נָא ay isang magalang na mungkahi o pakiusap. Natural sa modernong Tagalog ang pariralang ito sa pagpapakilala ng bugtong.
- source_word: חִידָה
  choice: isang bugtong
  rationale: Karaniwang tumutukoy ang salita sa bugtong o palaisipang pahayag; “bugtong” ang pinakanatural sa konteksto.
- source_word: אִם הַגֵּד תַּגִּידוּ אוֹתָהּ לִי
  choice: Kung talagang masasabi ninyo sa akin ang sagot
  rationale: Ang infinitive absolute na kasunod ng finite verb ay nagbibigay-diin, na ipinapahayag ng “talagang.” Idinagdag ang “ang sagot” bilang likas na Tagalog na paglalahad ng pagsasabi o pagpapaliwanag sa bugtong, hindi bilang bagong nilalaman.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: sa loob ng pitong araw ng handaan
  rationale: Ipinakikita ng konteksto ang takdang panahon ng hamon. Ang מִשְׁתֶּה ay handaan o piging, dito ay handaan sa kasal.
- source_word: וּמְצָאתֶם
  choice: at malulutas ninyo ito
  rationale: Literal itong “at matagpuan ninyo,” ngunit sa konteksto ng bugtong ay nangangahulugang matuklasan o malutas ang sagot.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: tatlumpung kasuotang lino
  rationale: Tumutukoy ang סְדִינִים sa mga kasuotang yari sa lino, ngunit hindi tiyak ang eksaktong anyo kaya iniwasan ang labis na espesipikong katawagan.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: tatlumpung pamalit na damit
  rationale: Ang parirala ay tumutukoy sa mga set o pagpapalit ng kasuotan; natural at malinaw sa Tagalog ang “pamalit na damit.”
- source_word: וְנָתַתִּי לָכֶם
  choice: bibigyan ko kayo
  rationale: Sa kondisyonal na pangungusap, malinaw sa Tagalog na ito ang magiging gantimpala kapag natupad ang kondisyon kahit hindi na isalin nang hiwalay ang pangatnig bilang “kung gayon.”
