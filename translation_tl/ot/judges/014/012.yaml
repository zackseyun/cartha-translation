translation_notes:
  register: Gumamit ng moderno, malinaw, at marangal na Tagalog. Pinanatili ang diin ng anyong Hebreo sa “talagang,” at isinalin nang idiomatiko ang literal na “matagpuan” bilang paglutas ng bugtong. Ang mga katawagan sa kasuotan ay sadyang hindi ginawang higit na tiyak kaysa sa ebidensiyang Hebreo.
