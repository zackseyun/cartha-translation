base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ng kanyang ama at ina, “Wala bang babaeng mapapangasawa sa mga anak na babae ng iyong mga kapatid[a] o sa buong bayan ko, at kukuha ka ng asawa mula sa mga Filisteong hindi tuli?” Sinabi naman ni Samson sa kanyang ama, “Kunin mo siya para sa akin, sapagkat tama siya sa aking paningin.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga anak na babae ng iyong mga kapatid” ay malamang na tumutukoy nang mas malawak sa mga babae sa kanilang angkan o bayan, hindi lamang sa literal na mga anak ng sariling mga kapatid ni Samson.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin, “kaaya-aya siya sa aking paningin” o “siya ang gusto ko.” Maaaring magpahayag ang idyomang Hebreo ng personal na pagsang-ayon, pagiging angkop, o pagkaakit; pinananatili rito ang pananalitang umaalingawngaw sa paulit-ulit na tema ng Mga Hukom.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: Wala bang
  rationale: Likas na Filipino para sa negatibong tanong na retorikal ng mga magulang.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: sa mga anak na babae ng iyong mga kapatid
  rationale: Pinananatili ang konkretong pananalitang pampamilya ng Hebreo; ipinaliliwanag sa talababa ang malamang na mas malawak na saklaw nito.
- source_word: וּבְכָל עַמִּי
  choice: o sa lahat ng aking bayan
  rationale: Pinananatili ang pang-isahang unang panauhan ng tekstong Hebreo, sa halip na gawing ‘ating bayan.’
- source_word: אִשָּׁה
  choice: babaeng mapapangasawa
  rationale: Sa unang paglitaw, tumutukoy ito sa isang babaeng maaaring mapangasawa; nililinaw ng parirala ang konteksto nang hindi pa siya tinatawag na asawa.
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: kukuha ka pa ng asawa
  rationale: Ang ‘kukuha ng asawa’ ay nagpapanatili sa pandiwang larawan ng Hebreo at nauunawaan sa konteksto ng isinaayos na pag-aasawa; ang ‘pa’ ay natural na naghahatid ng diin ng retorikal na tanong.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: mula sa mga Filisteong hindi tuli
  rationale: Hindi pinalalambot ang katawagang may bigat na pangtipan at pangkultura sa pananalita ng Israel.
- source_word: אוֹתָהּ קַח לִי
  choice: Kunin mo siya para sa akin
  rationale: Pinananatili ang pautos na anyo at ang papel ng ama sa pag-aayos ng pag-aasawa.
- source_word: יָשְׁרָה בְעֵינַי
  choice: siya ang tama sa aking paningin
  rationale: Pinananatili ang idyomang ‘sa aking paningin’ at ang salitang ‘tama,’ na umaalingawngaw sa mahalagang paulit-ulit na tema ng Mga Hukom.
theological_decisions:
- issue: Pagkakaugnay ng יָשְׁרָה בְעֵינַי sa temang ‘tama sa sariling paningin’ sa Mga Hukom
  choice: siya ang tama sa aking paningin
  alternative: kaaya-aya siya sa aking paningin; siya ang gusto ko
  rationale: Maaaring ipahayag ng idyoma ang personal na pagsang-ayon, pagiging angkop, o pagkaakit. Pinananatili ng salin ang tunay na luwang ng kahulugan at ang pagkakaugnay nito sa paulit-ulit na pormula ng aklat, nang hindi ipinapasyang moral na paghatol lamang o pisikal na pagkaakit lamang ang tinutukoy.
translation_notes:
  register: Modernong Filipino na dignidad ngunit madaling maunawaan. Ginamit ang ‘mapapangasawa’ upang maging natural ang unang אִשָּׁה, samantalang pinanatili ang ‘kumuha ng asawa,’ ‘hindi tuli,’ at ‘tama sa aking paningin’ dahil mahalaga ang kanilang anyo at tematikong bigat sa pinagmulang teksto.
