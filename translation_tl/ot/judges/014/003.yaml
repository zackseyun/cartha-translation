revisions:
- from: Ngunit sinabi sa kanya ng kanyang ama at ina, “Wala bang babaeng mapapangasawa sa mga anak na babae ng iyong mga kapatid[a] o sa lahat ng aking bayan, kaya kukuha ka pa ng asawa mula sa mga Filisteong hindi tuli?” Sinabi naman ni Samson sa kanyang ama, “Kunin mo siya para sa akin, sapagkat siya ang tama sa aking paningin.”[b]
  to: Ngunit sinabi sa kanya ng kanyang ama at ina, “Wala bang babaeng mapapangasawa sa mga anak na babae ng iyong mga kapatid[a] o sa buong bayan ko, at kukuha ka ng asawa mula sa mga Filisteong hindi tuli?” Sinabi naman ni Samson sa kanyang ama, “Kunin mo siya para sa akin, sapagkat tama siya sa aking paningin.”[b]
  rationale: Inalis ang dagdag na ‘pa’ upang huwag magpasok ng diin na wala sa pinagmulan. Inayos ang dalawang parirala para sa mas natural na modernong Filipino, nang pinananatili ang pang-isahang ‘bayan ko’ at ang pangunahing idyomang ‘tama ... sa aking paningin.’ Ang mga talababa ay nananatiling nakaangkla sa mga salitang kanilang ipinapaliwanag at wasto ang nilalaman.
