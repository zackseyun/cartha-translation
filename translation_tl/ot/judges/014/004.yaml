  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: tl
  text: Ngunit hindi alam ng kanyang ama at ina na ang pangyayaring ito ay mula kay Yahweh, sapagkat naghahanap si Samson ng pagkakataon laban sa mga Filisteo.[a] Sa panahong iyon, ang mga Filisteo ang namumuno sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “sapagkat Siya ang naghahanap ng pagkakataon laban sa mga Filisteo,” kung si Yahweh ang tinutukoy ng “Siya.” Posible ito sa Hebreo, bagaman mas malamang sa konteksto na si Samson ang tinutukoy. Ang “pagkakataon” ay maaari ring mangahulugang “dahilan” o “pagkakataong kumilos.”'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: mula kay Yahweh
  rationale: Tuwirang pinananatili ang personal na pangalan ng Diyos sa Hebreo at natural itong ipinapahayag sa Tagalog gamit ang pantukoy na “kay.”
- source_word: הִיא
  choice: ang bagay na iyon
  rationale: Ang pambabaeng panghalip ay tumutukoy sa usaping pinag-uusapan—ang balak ni Samson na kunin ang babaeng Filisteo—kaya nilinaw sa natural na Tagalog nang hindi binabago ang diwa.
- source_word: תֹאֲנָה
  choice: pagkakataon
  rationale: Saklaw nito ang isang pagbubukas o dahilan para kumilos nang hindi ipinipilit ang mas negatibong pahiwatig ng “dahilan lamang” o “pagdadahilan.”
- source_word: מְבַקֵּשׁ
  choice: naghahanap siya
  rationale: Ipinapakita ng anyong participle ang nagpapatuloy na paghahanap sa puntong iyon ng salaysay.
- source_word: מִפְּלִשְׁתִּים
  choice: laban sa mga Filisteo
  rationale: Bagaman literal na may pang-ukol na maaaring sabihing “mula sa,” ipinahihiwatig ng parirala sa konteksto ang pagkakataon para kumilos laban sa mga Filisteo.
- source_word: וּבָעֵת הַהִיא
  choice: Nang panahong iyon
  rationale: Natural at malinaw na panandang temporal sa makabagong Tagalog.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: namumuno sa Israel
  rationale: Ipinahahayag ang nagpapatuloy na paghahari o kapangyarihang pampolitika ng mga Filisteo sa Israel.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: kanyang ama at ina
  rationale: Natural na koordinasyon sa Tagalog; hindi kailangang ulitin ang panghalip na paari.
- source_word: לֹא יָדְעוּ
  choice: hindi alam
  rationale: Direkta at karaniwang katumbas sa makabagong Tagalog.
theological_decisions:
- issue: Pakikialam ng Diyos sa hangarin ni Samson at sa kasunod na alitan
  choice: Sinasabi ng talata na mula kay Yahweh ang bagay na iyon, habang inilalarawan si Samson na naghahanap ng pagkakataon laban sa mga Filisteo.
  alternative: Maaaring unawain na tuwirang itinakda ni Yahweh ang bawat sangkap ng pagnanais ni Samson, o na ginamit lamang niya kalaunan ang isang ganap na hiwalay na pasiya ni Samson.
  rationale: Magkasabay na ipinahahayag ng Hebreo ang banal na pinagmulan ng pangyayari at ang pagkilos ng taong naghahanap ng pagkakataon. Hindi nilulutas ng salin ang tensiyong hindi nilulutas ng teksto.
- issue: Tinutukoy ng “siya” sa naghahanap
  choice: Sa pangunahing teksto, si Samson ang tinutukoy.
  alternative: Maaaring si Yahweh ang tinutukoy ng panlalaking isahang participle.
  rationale: Mas natural sa mas malawak na konteksto ng salaysay na si Samson ang naghahanap ng pagkakataon sa pamamagitan ng usaping ito, ngunit posible sa balarila ang pagtukoy kay Yahweh kaya inilagay ang alternatibo sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pangalang Yahweh at ang ambiguwidad tungkol sa tinutukoy ng panlalaking participle sa pamamagitan ng talababa.
