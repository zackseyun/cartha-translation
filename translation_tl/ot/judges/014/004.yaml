revisions:
- from: Ngunit hindi alam ng kanyang ama at ina na mula kay Yahweh ang bagay na iyon, sapagkat naghahanap siya ng pagkakataon laban sa mga Filisteo.[a] Nang panahong iyon, namumuno sa Israel ang mga Filisteo.
  to: Ngunit hindi alam ng kanyang ama at ina na ang pangyayaring ito ay mula kay Yahweh, sapagkat naghahanap si Samson ng pagkakataon laban sa mga Filisteo.[a] Sa panahong iyon, ang mga Filisteo ang namumuno sa Israel.
  rationale: Inayos ang unang sugnay upang maging mas natural at malinaw sa modernong Tagalog nang hindi tinutukoy nang lampas sa Hebreo ang “ito.” Pinalitan ang panghalip sa ikalawang sugnay ng “si Samson” upang ipakita ang pangunahing pagbasa ng draft at maiwasan ang kalabuan. Pinanatili sa talababa ang posibleng pagbasa na si Yahweh ang naghahanap ng pagkakataon, gayundin ang saklaw ng תֹאֲנָה.
