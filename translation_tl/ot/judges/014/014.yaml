  - severity: low
    issue: Ang “masabi ang sagot sa bugtong” ay nagdaragdag ng ‘sagot sa.’
    rationale: Ang konteksto ay malinaw na tungkol sa paglutas ng bugtong, kaya hindi mali ang diwa, ngunit mas maikli at mas malapit sa pandiwang Hebreo ang “masagot ang bugtong.”
