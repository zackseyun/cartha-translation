  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Mula sa kumakain ay lumabas ang pagkain, at mula sa malakas[a] ay lumabas ang matamis.” Ngunit hindi nila masagot[b] ang bugtong sa loob ng tatlong araw.
  philosophy: optimal-equivalence
  footnotes:
