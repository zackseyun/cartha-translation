  yaml_path: translation/ot/judges/014/011.yaml
  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: tl
  text: Nang makita nila siya, kumuha sila ng tatlumpung kasama[a], at sila ay kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kaibigan”; maaaring partikular na tumukoy sa mga kasama sa kasalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹתָם אֹתוֹ
  choice: Nang makita nila siya
  rationale: Ang וַיְהִי ay bahagi ng daloy ng salaysay at hindi kailangang isalin nang mekanikal; ang כִּרְאוֹתָם ay temporal, kaya natural ang “Nang makita nila siya.”
- source_word: וַיִּקְחוּ
  choice: kumuha sila
  rationale: Pinananatili nito ang karaniwang kahulugan ng לקח nang hindi nagpapasya kung ang mga lalaki ay pinili, dinala, o itinalaga.
- source_word: שְׁלֹשִׁים מֵרֵעִים
  choice: tatlumpung kasama
  rationale: Ang מֵרֵעִים ay tumutukoy sa mga kasamahan o kaibigan; ang “kasama” ay natural at hindi labis na tumutukoy sa isang pormal na papel sa kasalan.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: upang makasama niya
  rationale: Sa konteksto, ang mga kasamang kinuha ay inilaan upang makasama ni Samson. Ginagawang natural sa Filipino ang ugnayan habang pinananatili ang diwa ng pagiging kasama niya.
