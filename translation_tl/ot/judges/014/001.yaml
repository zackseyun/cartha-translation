  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: tl
  text: Pagkatapos, bumaba si Samson patungong Timna. Doon, nakakita siya ng isang babaeng Filisteo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: bumaba
  rationale: Pinananatili ang literal at topograpikong diwa ng ירד na ‘bumaba,’ na natural din sa salaysay sa Filipino.
- source_word: שִׁמְשׁוֹן
  choice: Samson
  rationale: Ginamit ang nakasanayang anyo ng pangalang biblikal sa Filipino.
- source_word: תִּמְנָתָה
  choice: patungong Timna
  rationale: Ipinahahayag ng hulaping directional he ang pagkilos tungo sa lugar; natural itong isinalin na ‘patungong Timna.’
- source_word: וַיַּרְא
  choice: may nakita siya
  rationale: Tuwirang inililipat ang karaniwang kahulugan ng ראה nang hindi dinaragdagan ang uri o layunin ng kanyang pagtingin.
- source_word: אִשָּׁה
  choice: isang babae
  rationale: Hindi pa niya asawa ang babae sa puntong ito, kaya ang payak na ‘babae’ ang pinakatumpak at hindi mapagpasya.
- source_word: בְּתִמְנָתָה
  choice: doon
  rationale: Ang ‘doon’ ay natural na tumutukoy sa Timna na kababanggit lamang at iniiwasan ang mabigat na pag-uulit.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: kabilang sa mga anak na babae ng mga Filisteo
  rationale: Pinananatili sa pangunahing teksto ang Hebreong pananalitang pampamilya at pangkat-etniko, habang nililinaw ng ‘kabilang sa’ ang gamit ng מִן.
