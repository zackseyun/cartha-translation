revisions:
- from: Ngunit kung hindi ninyo maipaliwanag sa akin, bibigyan ninyo ako ng tatlumpung kasuotang lino[a] at tatlumpung pamalit na damit.” Sinabi nila sa kanya, “Sabihin mo ang iyong bugtong at pakinggan namin.”
  to: Ngunit kung hindi ninyo ito masasabi sa akin, kailangan ninyo akong bigyan ng tatlumpung kasuutang lino[a] at tatlumpung pamalit na damit.” Sinabi nila sa kanya, “Sabihin mo ang iyong bugtong, at pakinggan namin ito.”
  rationale: Pinalitan ang “maipaliwanag” ng “masasabi” upang mapanatili ang diwang “sabihin/ipahayag” ng Hebreo at maiwasan ang di-kinakailangang interpretasyon. Ginawang “kailangan ninyo akong bigyan” upang malinaw ang obligasyong bunga ng pustahan. Idinagdag ang “ito” sa huling pangungusap upang katawanin ang hulaping tumutukoy sa bugtong.
