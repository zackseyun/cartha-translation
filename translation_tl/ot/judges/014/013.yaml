base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: tl
  text: Ngunit kung hindi ninyo ito masasabi sa akin, kailangan ninyo akong bigyan ng tatlumpung kasuutang lino[a] at tatlumpung pamalit na damit.” Sinabi nila sa kanya, “Sabihin mo ang iyong bugtong, at pakinggan namin ito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tatlumpung telang lino.” Maaaring tumukoy ang salitang Hebreo sa mga bagay na yari sa pinong lino, ngunit malamang na mga kasuotan ang tinutukoy rito dahil kaagapay nito ang “pamalit na damit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: hindi ninyo maipaliwanag
  rationale: Ang יכל ay nagsasaad ng kakayahan; kasama ng לְהַגִּיד, likas sa Filipino ang kondisyong “kung hindi ninyo maipaliwanag,” na tumutukoy sa pagbibigay ng sagot sa bugtong.
- source_word: לְהַגִּיד לִי
  choice: maipaliwanag sa akin
  rationale: Ang Hiphil ng נגד ay “sabihin/ipahayag.” Sa konteksto, ang dapat sabihin ay ang kahulugan o sagot ng bugtong; ipinahihiwatig ito nang natural ng “maipaliwanag sa akin.”
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: bibigyan ninyo ako
  rationale: Ang waw na sinusundan ng perfect ay bunga ng kondisyong pusta. Ang tiyak na hinaharap sa Filipino ay sapat upang ipahayag ang obligasyong kaakibat ng kasunduan.
- source_word: סְדִינִים
  choice: kasuotang lino
  rationale: Maaaring tumukoy ang salita sa pinong telang lino o sa kasuotang yari rito. Sa parallel na “pamalit na damit” at sa konteksto ng pusta, ang kasuotan ang malamang na diwa, habang pinananatili sa talababa ang leksikal na alternatibo.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: pamalit na damit
  rationale: Tumutukoy ang parirala sa mga set o pagpapalit ng kasuotan. Ang “pamalit na damit” ay malinaw at karaniwang Filipino.
- source_word: חוּדָה חִידָתְךָ
  choice: Sabihin mo ang iyong bugtong
  rationale: Ang pautos na חוּדָה ay ginagamit sa paghaharap o pagsasabi ng bugtong. Ang “Sabihin mo” ay natural sa usapan at tumpak sa kilos na hinihingi.
- source_word: וְנִשְׁמָעֶנָּה
  choice: at pakinggan namin
  rationale: 'Ang cohortative na may hulaping tumutukoy sa bugtong ay may diwang kusang-loob: “at pakinggan namin.”'
