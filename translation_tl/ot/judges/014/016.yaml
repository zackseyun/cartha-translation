  text: וַ/תֵּבְךְּ֩ אֵ֨שֶׁת שִׁמְשׁ֜וֹן עָלָ֗י/ו וַ/תֹּ֨אמֶר֙ רַק שְׂנֵאתַ֨/נִי֙ וְ/לֹ֣א אֲהַבְתָּ֔/נִי הַֽ/חִידָ֥ה חַ֨דְתָּ֙ לִ/בְנֵ֣י עַמִּ֔/י וְ/לִ֖/י לֹ֣א הִגַּ֑דְתָּה וַ/יֹּ֣אמֶר לָ֗/הּ הִנֵּ֨ה לְ/אָבִ֧/י וּ/לְ/אִמִּ֛/י לֹ֥א הִגַּ֖דְתִּי וְ/לָ֥/ךְ אַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: tl
  text: Umiyak sa harap niya ang asawa ni Samson at sinabi, “Kinamumuhian mo lang ako; hindi mo ako minamahal. Nagbigay ka ng bugtong sa mga anak na lalaki ng aking bayan[a], pero hindi mo sinabi sa akin.” Sinabi ni Samson sa kanya, “Tingnan mo, hindi ko nga sinabi sa aking ama o ina; sasabihin ko ba sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak na lalaki ng aking bayan.” Malamang na tumutukoy ito sa mga lalaking kababayan niya sa tagpong ito.
    reason: Nililinaw ang panlalaking anyo ng Hebreo at ang malamang na tinutukoy nito sa konteksto.
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: Umiyak sa harap niya
  rationale: Ang בכה ay ‘umiyak,’ at ang עַל na may taong tinutukoy ay maaaring magpahiwatig ng pag-iyak sa harap o sa piling niya, dito bilang emosyonal na paghimok. Natural sa Tagalog ang ‘umiyak sa harap niya’ at hindi nito labis na ipinapaliwanag ang kilos.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: ang asawa ni Samson
  rationale: Tuwirang construct phrase ito para sa ugnayang mag-asawa; natural at malinaw sa modernong Tagalog.
- source_word: רַק
  choice: lang
  rationale: Pinatitingkad nito ang paratang na pawang pagkamuhi ang ipinakikita ni Samson. Ang ‘lang’ ay natural sa madamdaming usapan.
- source_word: שְׂנֵאתַנִי ... וְלֹא אֲהַבְתָּנִי
  choice: Kinamumuhian mo lang ako; hindi mo ako minamahal
  rationale: Pinananatili ang tuwirang pagsalungat ng ‘mamuhi’ at ‘magmahal,’ na mahalaga sa mapanumbat na pananalita.
- source_word: הַחִידָה חַדְתָּ
  choice: Nagbigay ka ng bugtong
  rationale: Ang חִידָה ay ‘bugtong,’ at ang pandiwa ay tumutukoy sa paghaharap o pagbibigay nito. Mas natural sa Tagalog ang ‘nagbigay ng bugtong’ kaysa sa literal ngunit di-gaanong karaniwang ‘nagharap ng bugtong.’
- source_word: לִבְנֵי עַמִּי
  choice: sa mga anak na lalaki ng aking bayan
  rationale: Pinananatili nito ang panlalaking anyo ng בְּנֵי at ang kolektibong kahulugan ng עַם. Sa konteksto, malamang na tumutukoy ito sa mga lalaking kababayan niyang Filisteo.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: pero hindi mo sinabi sa akin ang sagot
  rationale: Literal na ‘hindi mo sinabi sa akin.’ Sa Tagalog, kailangang gawing malinaw ang ipinahihiwatig na layon—ang sagot o paliwanag sa bugtong—upang maiwasang magtunog na hindi niya sinabi ang mismong bugtong, na naibigay na sa iba.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Nagbibigay ito ng diin at tumatawag ng pansin sa katuwiran ni Samson nang hindi gumagamit ng makalumang ‘Narito.’
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: hindi ko nga sinabi sa aking ama o ina
  rationale: Ang ‘nga’ ay naghahatid ng diin ng הִנֵּה sa natural na usapan; ang ‘o’ ay angkop sa Tagalog sa ilalim ng pagtanggi.
- source_word: וְלָךְ אַגִּיד
  choice: sasabihin ko ba sa iyo?
  rationale: Pinananatili ang retorikal na tanong at ang payak na diwang ‘at/oo ba, sa iyo ay sasabihin ko?’ nang hindi dinaragdagan ang argumento.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang karaniwang bokabularyong ‘bugtong,’ ‘bayan,’ at ‘Tingnan mo.’ Pinanatili ang matinding kaibahan ng pagkamuhi at pagmamahal at ang retorikal na tugon ni Samson.
