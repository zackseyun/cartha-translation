  to: Umiyak sa harap niya ang asawa ni Samson at sinabi, “Kinamumuhian mo lang ako; hindi mo ako minamahal. Nagbigay ka ng bugtong sa mga anak na lalaki ng aking bayan[a], pero hindi mo sinabi sa akin.” Sinabi ni Samson sa kanya, “Tingnan mo, hindi ko nga sinabi sa aking ama o ina; sasabihin ko ba sa iyo?”
  rationale: Inalis ang hindi hayag sa orihinal na “ang sagot,” habang pinanatili ang kontekstuwal na bukas na pandiwang “sinabi.” Pinalitan ang di-gaanong malinaw na panghalip sa panimulang sugnay ng tugon ng tahasang “Sinabi ni Samson sa kanya.” Walang ibang pagbabago sa kahulugan o tala.
