  naturalness: 'May dalawang maliit ngunit mahalagang ayos para sa likas na modernong Filipino: mas malinaw ang “Noong ikapitong araw” kaysa “nang ikapitong araw” sa pangungusap na ito, at ang “dumalaga kong baka” ay dapat gawing “dumalagang baka ko,” na siyang karaniwang anyo para sa isang batang babaeng baka.'
