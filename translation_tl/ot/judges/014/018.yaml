base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: tl
  text: Noong ikapitong araw, bago lumubog ang araw[a], sinabi sa kanya ng mga lalaki sa bayan, “Ano ang mas matamis kaysa pulot, at ano ang mas malakas kaysa leon?” Sinabi naman niya sa kanila, “Kung hindi ninyo inararo gamit ang dumalagang baka ko[b], hindi sana ninyo nalutas ang aking bugtong.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “bago pumasok ang araw,” isang idyomang tumutukoy sa oras bago lumubog ang araw.
    reason: lexical_alternative
  - marker: b
    text: Ginamit ni Samson ang “dumalagang baka ko” bilang metapora para sa kanyang asawa. Pinararatangan niya ang mga lalaki na ginamit nila ang kanyang asawa upang malutas ang bugtong.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: mga lalaki sa bayan
  rationale: Pinananatili ang panlalaking pangmaramihan ng Hebreo. Mas natural sa kontekstong ito ang “bayan” kaysa “lungsod,” yamang ang עִיר ay maaaring tumukoy sa bayan o lungsod.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: nang ikapitong araw
  rationale: Tuwirang temporal na salin na natural sa makabagong Filipino.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: bago lumubog ang araw
  rationale: Ipinahahayag nang malinaw ang kahulugan ng idyomang Hebreo; inilalagay sa talababa ang literal na larawan.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: Ano ang mas matamis kaysa pulot
  rationale: Ginagamit ang pahambing na diwa ng מִן at ang karaniwang salitang Filipino na “pulot.”
- source_word: וּמֶה עַז מֵאֲרִי
  choice: at ano ang mas malakas kaysa leon
  rationale: Maaaring mangahulugan ang עַז ng malakas, mabagsik, o makapangyarihan; “mas malakas” ang pinakanatural sa pahambing na anyo ng bugtong.
- source_word: לוּלֵא
  choice: Kung hindi ... hindi sana
  rationale: Malinaw na ipinakikita ng hulma ang kondisyong salungat sa nangyari.
- source_word: חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: nangararo gamit ang dumalaga kong baka
  rationale: Pinananatili ang matalim na metaporang pansaka sa halip na palitan ito ng tahasang “ginamit ang aking asawa.” Ang “dumalaga” ay batang babaeng baka na hindi pa nanganganak.
- source_word: לֹא מְצָאתֶם חִידָתִי
  choice: hindi sana ninyo nalutas ang aking bugtong
  rationale: Sa konteksto, ang “matagpuan” ang bugtong ay nangangahulugang malaman ang sagot o malutas ito; “nalutas” ang malinaw at likas na pahayag sa Filipino.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang anyo ng bugtong at ang mapanuyang metapora ni Samson, habang ginawang natural ang kondisyong salungat sa nangyari sa pamamagitan ng “hindi sana.”
