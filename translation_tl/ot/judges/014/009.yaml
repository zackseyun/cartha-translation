revisions:
- from: Kinayod niya ang pulot sa loob at inilagay sa mga kamay niya. Habang naglalakad siya, kinakain niya ito.[a] Pagkatapos, pinuntahan niya ang kanyang ama at ina at binigyan sila, at kumain din sila. Ngunit hindi niya sinabi sa kanila na kinayod niya ang pulot mula sa bangkay ng leon.
  to: Kinayod niya ang pulot at inilagay ito sa kanyang mga palad. Nagpatuloy siya sa paglalakad habang kinakain ito.[a] Pagkatapos, pinuntahan niya ang kanyang ama at ina at binigyan niya sila ng pulot, at kumain sila. Ngunit hindi niya sinabi sa kanila na kinayod niya ang pulot mula sa bangkay ng leon.
  rationale: Inalis ang hindi malinaw na “sa loob” at nilinaw ang direksiyon ng kilos tungo sa kanyang mga palad. Ginawang tahasan ang “ng pulot” sa pagbibigay sa mga magulang, isang likas na paglilinaw ng ipinahihiwatig na layon sa Hebreo. Pinanatili ang pag-uulit ng “kinayod,” ang kongkretong “bangkay ng leon,” at ang aspektong nagpapatuloy ng paglakad habang kumakain.
