base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: tl
  text: Kinayod niya ang pulot at inilagay ito sa kanyang mga palad. Nagpatuloy siya sa paglalakad habang kinakain ito.[a] Pagkatapos, pinuntahan niya ang kanyang ama at ina at binigyan niya sila ng pulot, at kumain sila. Ngunit hindi niya sinabi sa kanila na kinayod niya ang pulot mula sa bangkay ng leon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagpatuloy siyang maglakad habang kumakain.” Ipinahihiwatig ng Hebreo ang tuloy-tuloy na paglakad at pagkain.
    reason: grammatical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: Kinayod niya ang pulot sa loob
  rationale: Ang רדה rito ay tumutukoy sa pagkuha ng pulot mula sa loob ng bangkay. Ang “kinayod” ay kongkreto at pinananatili ang pisikal na kilos; nilinaw ang ipinahihiwatig na layon na pulot.
- source_word: אֶל כַּפָּיו
  choice: inilagay sa mga kamay niya
  rationale: Ang כַּף ay palad o kamay. Mas natural sa modernong Tagalog ang “sa mga kamay niya” kaysa sa literal na “sa kanyang mga palad.”
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: Habang naglalakad siya, kinakain niya ito
  rationale: 'Ipinahihiwatig ng konstruksyong may infinitive absolute ang nagpapatuloy at magkasabay na pagkilos: naglalakad siya habang kumakain.'
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: Pagkatapos, pinuntahan niya ang kanyang ama at ina
  rationale: Natural na salaysay sa Tagalog ang “pinuntahan,” at ipinakikita ng “Pagkatapos” ang sunod na pangyayari.
- source_word: וַיִּתֵּן לָהֶם
  choice: binigyan sila
  rationale: Ipinahihiwatig ng konteksto na pulot ang ibinigay. Hindi na kailangang ulitin ang layon sa Tagalog.
- source_word: וַיֹּאכֵלוּ
  choice: kumain din sila
  rationale: Ang “din” ay natural na nagpapakitang nakibahagi ang mga magulang sa pagkain, nang hindi dinaragdagan ang diwa.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Ngunit hindi niya sinabi sa kanila
  rationale: Ang “Ngunit” ay malinaw na naghahayag ng pagsalungat, at ang “sinabi” ang karaniwang katumbas ng הגיד sa ganitong salaysay.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: mula sa bangkay ng leon
  rationale: Ang גְּוִיָּה ay patay na katawan. Ang “bangkay” ay tumpak, kongkreto, at angkop din sa hayop sa Tagalog.
- source_word: רָדָה הַדְּבָשׁ
  choice: kinayod niya ang pulot
  rationale: Inulit ang “kinayod” upang mapanatili ang pag-uulit ng parehong Hebreong pandiwa at ang pagkakaugnay ng salaysay.
