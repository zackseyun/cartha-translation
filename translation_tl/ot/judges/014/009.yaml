translation_notes:
  register: Modernong Filipino Tagalog na natural at marangal ang ginamit. Pinanatili ang kongkretong larawan ng pagkuha ng pulot mula sa bangkay, nang walang idinagdag na paliwanag tungkol sa rituwal na karumihan o motibo ni Samson.
