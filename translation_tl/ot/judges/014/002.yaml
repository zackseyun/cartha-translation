  to: Pagkatapos, umakyat siya at ipinaalam niya ito sa kanyang ama at ina. Sinabi niya, “May nakita akong babae sa Timna, isa sa mga anak na babae ng mga Filisteo.[a] Kaya ngayon, kunin ninyo siya para maging asawa ko.”
  rationale: Inayos ang mga pananalitang hindi gaanong likas sa modernong Tagalog habang pinananatili ang pagkakasunod ng salaysay, ang “umakyat,” ang partitive/familial na parirala tungkol sa mga Filisteo, at ang maramihang kahilingan ni Samson sa kanyang mga magulang. Ang talababa ay nananatili at wastong nakaangkla sa pariralang isinasalin nito.
