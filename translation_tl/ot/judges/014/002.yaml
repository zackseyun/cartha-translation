  naturalness: May ilang maiiwasang literalismo. Mas natural ang “ipinaalam niya” kaysa “sinabi ito,” ang “May nakita akong babae” kaysa “May nakita akong isang babae,” at ang “para maging asawa ko” kaysa “para sa akin bilang asawa,” nang hindi nawawala ang kahulugan.
  terminology: Ang “Filisteo,” “Timna,” “babae,” at “asawa” ay angkop sa modernong Filipino Tagalog at sa konteksto. Nananatiling angkop ang “mga anak na babae” sa teksto at sa talababa upang maipakita ang Hebreong pampamilyang idyoma.
