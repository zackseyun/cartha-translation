base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: tl
  text: Pagkatapos, umakyat siya at ipinaalam niya ito sa kanyang ama at ina. Sinabi niya, “May nakita akong babae sa Timna, isa sa mga anak na babae ng mga Filisteo.[a] Kaya ngayon, kunin ninyo siya para maging asawa ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mas literal, “mula sa mga anak na babae ng mga Filisteo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: umakyat siya
  rationale: Pinananatili nito ang pangunahing diwa ng עלה na ‘umakyat’ o ‘pumaitaas,’ nang hindi ipinapaliwanag nang higit sa sinasabi ng Hebreo ang heograpiya ng paglalakbay.
- source_word: וַיַּגֵּד
  choice: sinabi ito
  rationale: Likas sa modernong Tagalog at tumpak na ipinahahayag ang Hiphil ng נגד, ‘ipaalam’ o ‘sabihin.’
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: sa kanyang ama at ina
  rationale: Natural na Tagalog ang iisang panghalip na paari para sa dalawang magulang at malinaw na tumutugma sa Hebreo.
- source_word: אִשָּׁה
  choice: isang babae
  rationale: Sa puntong ito ay nakita pa lamang siya ni Samson at saka pa lamang hinihiling na mapangasawa, kaya ‘babae’ ang angkop kaysa ‘asawa.’
- source_word: בְתִמְנָתָה
  choice: sa Timna
  rationale: Ang ‘sa Timna’ ang natural na panandang panlunan sa Tagalog para sa pangalan ng bayang ito.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: isa sa mga anak na babae ng mga Filisteo
  rationale: Ipinapahayag nito ang partitive na diwa ng מִן at pinananatili ang pampamilyang idyoma ng Hebreo; nililinaw ng talababa ang mas literal na anyo.
- source_word: וְעַתָּה
  choice: Kaya ngayon
  rationale: Ipinakikita nito ang paglipat mula sa iniulat ni Samson tungo sa kahilingang bunga ng sinabi niya.
- source_word: קְחוּ
  choice: kunin ninyo
  rationale: Pinananatili ang karaniwang kahulugan ng לקח at ang maramihang utos sa kanyang mga magulang; sa konteksto, tumutukoy ito sa pag-aayos ng kasal.
- source_word: אוֹתָהּ לִּי לְאִשָּׁה
  choice: siya para sa akin bilang asawa
  rationale: Pinananatili kapwa ang personal na pariralang ‘para sa akin’ at ang layuning ‘bilang asawa,’ kahit bahagyang pormal ang ayos.
theological_decisions: []
translation_notes:
  register: Makabago at madaling maunawaang Tagalog na may marangal na himig. Pinanatili ang ‘umakyat’ upang hindi mawala ang kilos na nasa Hebreo, at ang bahagyang pormal na ‘para sa akin bilang asawa’ upang maingatan ang pormula ng kahilingan sa pag-aasawa.
