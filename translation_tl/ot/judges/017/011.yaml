    issue: Hindi likas ang “para sa kanya” sa ikalawang sugnay.
    rationale: Ang pariralang “parang isa sa kanyang mga anak para sa kanya” ay redundant at mabigat sa Filipino. Ang pag-aari sa “kanyang mga anak” ay sapat nang nagpapahayag ng kaugnayang “sa kanya,” nang hindi binabago ang diwa ng Hebreo.
  - severity: low
    issue: Mabigat ang literal na ayos ng sipi sa talababa b.
