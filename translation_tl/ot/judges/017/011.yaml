translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “manirahan” upang malinaw na ipahayag ang pananatili bilang kasambahay, at pinanatili ang paghahambing at ang pariralang “para sa kanya” upang hindi mawala ang personal na pagtingin ni Mikas sa Levita.
