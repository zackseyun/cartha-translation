  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: tl
  text: Kaya pumayag ang Levita na manirahan kasama ng lalaki,[a] at ang binata ay naging gaya ng isa sa kanyang mga anak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kusang-loob ang Levita na manirahan kasama ng lalaki.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang binata ay para sa kanya gaya ng isa sa kanyang mga anak,” na nagpapahiwatig na itinuring ni Mikas ang Levita bilang miyembro ng kanyang sambahayan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: pumayag
  rationale: Ang Hiphil ng יאל ay nagpapahayag ng kusang pagsang-ayon o pagpayag. Likas at malinaw sa modernong Filipino ang “pumayag” sa konteksto ng pagtanggap sa alok ni Mikas.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Tiyak na pangngalan ito na tumutukoy sa Levita na naipakilala na sa salaysay; “Levita” ang karaniwan at tumpak na katawagan.
- source_word: לָשֶׁבֶת
  choice: na manirahan
  rationale: Ang ישׁב ay maaaring mangahulugang umupo, tumira, o manatili. Dito, tumutukoy ito sa paninirahan sa sambahayan ng lalaki, kaya malinaw ang “manirahan.”
- source_word: אֶת הָאִישׁ
  choice: kasama ng lalaki
  rationale: Kasunod ng ישׁב, ipinahihiwatig ng אֶת ang pakikisama o paninirahang kapiling ng isang tao. Natural sa Filipino ang “kasama ng lalaki.”
- source_word: וַיְהִי
  choice: ay naging
  rationale: Ipinakikita rito ng היה ang kinalabasan o bagong kalagayan matapos pumayag ang Levita na manirahan doon. Napananatili ng “naging” ang pag-unlad na ito.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Malawak ang saklaw ng נַעַר mula batang lalaki hanggang binata o tagapaglingkod. Dahil malaya nang naglalakbay at nakikipagkasundo ang Levita, ang “binata” ang angkop at natural.
- source_word: כְּאַחַד מִבָּנָיו
  choice: parang isa sa kanyang mga anak
  rationale: Nananatili sa “parang” ang paghahambing na ipinahihiwatig ng כ, samantalang likas sa Filipino ang “isa sa kanyang mga anak.”
