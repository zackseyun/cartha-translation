revisions:
- from: Umalis ang lalaki sa lungsod ng Betlehem sa Juda upang manirahan saanman siya makahanap ng lugar. Sa kanyang paglalakbay,[a] nakarating siya sa kaburulan ng Efraim, hanggang sa bahay ni Mikas.
  to: Umalis ang lalaki mula sa lungsod, mula sa Betlehem ng Juda, upang manirahan saanman siya makahanap ng lugar. Habang naglalakbay siya,[a] nakarating siya sa kaburulan ng Efraim, hanggang sa bahay ni Mikas.
  rationale: Nilinaw ang dalawang ulit na “mula sa” sa Hebreo upang maipakita ang pinagmulan ng lalaki nang walang pagbabago sa kahulugan. Bahagyang inayos ang pang-abay na salin ng huling idyoma at iniugnay ang talababa rito, upang mapanatili ang kalabuan ng sintaktikong kaugnayan nito.
