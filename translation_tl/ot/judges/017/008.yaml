translation_notes:
  register: Modernong Filipino na malinaw at marangal. Iniwasan ang lipas na “makipamayan” at ang teknikal na “dayuhang naninirahan,” habang pinanatili sa talababa ang tunay na kalabuan ng huling Hebreong idyoma.
