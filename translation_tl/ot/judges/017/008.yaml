base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: tl
  text: Umalis ang lalaki mula sa lungsod, mula sa Betlehem ng Juda, upang manirahan saanman siya makahanap ng lugar. Habang naglalakbay siya,[a] nakarating siya sa kaburulan ng Efraim, hanggang sa bahay ni Mikas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “upang gawin ang kanyang daan”; maaari ring isalin na “upang magpatuloy sa kanyang paglalakbay” o “habang naglalakbay siya.”
    reason: Pinananatili ang posibleng pagbasa sa Hebreong idyoma at ang bahagyang kalabuan ng kaugnayan nito sa pangunahing sugnay.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Umalis
  rationale: Isinasalaysay ng pandiwa ang pag-alis niya mula sa Betlehem; mas likas dito ang “umalis” kaysa sa payak na “pumunta.”
- source_word: הָאִישׁ
  choice: ang lalaki
  rationale: “Ang lalaki” ang tuwirang kahulugan; hindi idinagdag ang “binata” o “Levita” mula sa naunang konteksto.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: sa lungsod ng Betlehem sa Juda
  rationale: Ginamit ang “lungsod” bilang malapit na katumbas ng עִיר, at ang “sa Juda” ay malinaw na heograpikong panuring sa Betlehem.
- source_word: לָגוּר
  choice: upang manirahan
  rationale: Likas ito sa modernong Filipino at ipinahihiwatig ng kasunod na sugnay na naghahanap siya ng lugar na matitirhan; hindi labis na itinakda kung pansamantala o bilang dayuhan ang paninirahan.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: saanman siya makahanap ng lugar
  rationale: Ang bagay na hahanapin ay ipinahihiwatig lamang sa Hebreo; idinagdag ang “lugar” upang maging malinaw at natural sa Filipino.
- source_word: הַר אֶפְרַיִם
  choice: kaburulan ng Efraim
  rationale: Tumutukoy ang parirala sa bulubunduking rehiyon, hindi sa iisang bundok.
- source_word: עַד בֵּית מִיכָה
  choice: hanggang sa bahay ni Mikas
  rationale: Pinananatili ng “hanggang sa” ang diwa ng עַד bilang hangganan o puntong narating.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: Sa kanyang paglalakbay
  rationale: Ang literal na idyomang “gawin ang kanyang daan” ay tumutukoy sa paglalakbay o pagpapatuloy sa daan. Inilagay bilang pang-abay na kalagayan upang maging natural nang hindi pinipilit na layunin ng pagpunta niya sa bahay ni Mikas.
