  text: וַֽ/יְהִי אִ֥ישׁ מֵֽ/הַר אֶפְרָ֖יִם וּ/שְׁמ֥/וֹ מִיכָֽיְהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: tl
  text: May isang lalaki mula sa kaburulan ng Efraim, at Mikayhu ang pangalan niya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisyonal na isinasalin bilang “Mikas.” Mikayhu ang anyong Hebreo rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: May
  rationale: Ipinakikilala nito ang isang bagong tauhan at yunit ng salaysay. Ang “May isang lalaki” ay likas na panimulang salaysay sa modernong Tagalog at hindi nagdaragdag ng tahasang temporal na “ngayon.”
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tuwirang tumutukoy sa isang lalaking indibidwal; hindi kailangang dagdagan ng “tiyak” o “isang partikular na.”
- source_word: מֵהַר אֶפְרָיִם
  choice: mula sa kaburulan ng Efraim
  rationale: Ang הַר אֶפְרָיִם ay tumutukoy sa mataas at maburong rehiyong kaugnay ng Efraim, hindi sa iisang bundok.
- source_word: וּשְׁמוֹ
  choice: at ... ang pangalan niya
  rationale: Pinananatili ng “at” ang koordinasyon ng Hebreo, habang natural sa Tagalog ang ayos na “Mikayhu ang pangalan niya.”
- source_word: מִיכָיְהוּ
  choice: Mikayhu
  rationale: Malapit na transliterasyon ito ng mismong anyong Hebreo sa talatang ito, sa halip na palitan ng tradisyonal na anyong Mikas.
