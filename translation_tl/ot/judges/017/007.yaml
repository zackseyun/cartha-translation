source:
  edition: WLC
  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: tl
  text: May isang binata mula sa Betlehem sa Juda, mula sa angkan[a] ng Juda. Isa siyang Levita, at naninirahan siya roon bilang dayo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamilya.” Ang salitang Hebreo ay maaaring tumukoy sa isang pangkat ng pamilya o angkan.
    reason: lexical_alternative
  - marker: b
    text: O “pansamantalang naninirahan siya roon.” Ang pandiwang Hebreo ay madalas tumukoy sa paninirahan sa isang lugar bilang dayo o hindi taal na tagaroon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: May isang
  rationale: Ipinakikilala ng anyong ito ang isang bagong tauhan sa salaysay. Likas sa modernong Tagalog ang “May isang” at hindi ito nagdaragdag ng tahasang panandang pamanahon na wala naman sa Hebreo.
- source_word: נַעַר
  choice: binata
  rationale: Maaaring tumukoy ang salita sa batang lalaki, kabataan, binata, o lingkod. Sa kontekstong ito, edad at pagkakakilanlan ang inilalarawan, hindi tungkulin bilang lingkod.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Betlehem sa Juda
  rationale: Ang “Juda” ay heograpikong panuring sa Betlehem at nagtatangi rito sa ibang bayang may kaparehong pangalan.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: mula sa angkan ng Juda
  rationale: Karaniwang tumutukoy ang מִשְׁפָּחָה sa isang angkan o mas malawak na pangkat ng pamilya sa loob ng isang lipi. Mas tiyak dito ang “angkan” kaysa “pamilya” o “lipi.”
- source_word: לֵוִי
  choice: Levita
  rationale: Tuwirang kinikilala ng pangngalan ang binata bilang isang Levita. Pinananatili ng salin ang maliwanag na tensiyon nito sa naunang “mula sa angkan ng Juda.”
- source_word: גָר שָׁם
  choice: naninirahan siya roon bilang dayo
  rationale: Ang גּוּר ay karaniwang nangangahulugang manirahan sa isang lugar bilang dayo o hindi taal na tagaroon. Malinaw at marangal ang parirala, at hindi nito nililimitahan ang diwa sa isang panandaliang pagbisita lamang.
theological_decisions:
- issue: Maliwanag na tensiyon sa pagkakakilanlan ng binata
  choice: Panatilihin kapwa ang “mula sa angkan ng Juda” at “Isa siyang Levita” nang walang pagpapaliwanag o pagsasaayos sa pangunahing teksto.
  alternative: Unawain o ipakahulugan ang kaugnayan niya sa Juda bilang heograpiko o panlipunan lamang upang alisin ang tensiyon.
  rationale: Magkatabing inilalahad ng tekstong Hebreo ang dalawang pahayag. Dapat panatilihin ng salin ang tunay na kalabuan o tensiyon sa halip na tahimik itong lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “binata,” “angkan,” at “naninirahan bilang dayo” bilang mga salitang madaling maunawaan ngunit sapat ang pormalidad para sa tekstong biblikal. Inilagay ang bawat talababa sa mismong pariralang tinutukoy nito.
