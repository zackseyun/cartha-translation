  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ מִיכָ֜ה שְׁבָ֣/ה עִמָּדִ֗/י וֶֽ/הְיֵה לִ/י֮ לְ/אָ֣ב וּ/לְ/כֹהֵן֒ וְ/אָנֹכִ֨י אֶֽתֶּן לְ/ךָ֜ עֲשֶׂ֤רֶת כֶּ֨סֶף֙ לַ/יָּמִ֔ים וְ/עֵ֥רֶךְ בְּגָדִ֖ים וּ/מִחְיָתֶ֑/ךָ וַ/יֵּ֖לֶךְ הַ/לֵּוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: tl
  text: Sinabi sa kanya ni Micas, “Manirahan ka kasama ko at maging ama at pari ka sa akin. Bibigyan kita ng sampung pirasong pilak bawat taon[a], isang set ng mga damit[b], at panustos sa iyong pamumuhay.” Kaya pumunta ang Levita[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “sampung pilak”; hindi tinukoy ang yunit. Karaniwang ipinapalagay ng ilang salin na mga shekel ang tinutukoy.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “laang damit” o “takdang panustos na damit.”
    reason: lexical_alternative
  - marker: c
    text: Sa literal, “pumunta ang Levita.” Sa konteksto, maaaring ipinahihiwatig na pumasok siya sa sambahayan ni Micas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Manirahan ka kasama ko
  rationale: Ang pandiwang ישׁב sa paanyayang ito ay tumutukoy sa pananatili o paninirahan. Ang “manirahan” ay natural sa modernong Filipino at malinaw na higit ito sa pansamantalang pagdalaw.
- source_word: לְאָב וּלְכֹהֵן
  choice: maging ama at pari ka sa akin
  rationale: Pinananatili ang tahasang metaporang “ama,” na dito ay katawagang pandangal at hindi literal na pagiging magulang, pati ang tuwirang katawagang “pari.”
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: sampung pirasong pilak
  rationale: Hindi binanggit sa Hebreo ang yunit ng timbang o salapi. Iniiwasan ng “pirasong pilak” ang pagdaragdag ng “shekel” habang nananatiling madaling maunawaan.
- source_word: לַיָּמִים
  choice: bawat taon
  rationale: Idyomatikong tumutukoy ang parirala sa taunang bayad; natural at malinaw sa Filipino ang “bawat taon.”
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: isang set ng mga damit
  rationale: Ipinahihiwatig ng mahirap na parirala ang itinakdang probisyon o kompleto/set ng damit. Ang salin ay konkreto at madaling maunawaan, habang inilalahad sa talababa ang ibang posibleng pagbasa.
- source_word: וּמִחְיָתֶךָ
  choice: at panustos sa iyong pamumuhay
  rationale: 'Malawak ang diwa ng מִחְיָה: ikabubuhay o sustento, hindi lamang pagkain. Pinananatili ng “panustos sa iyong pamumuhay” ang saklaw na iyon.'
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: Kaya pumunta ang Levita
  rationale: Ang batayang pandiwa ay “pumunta/umalis.” Hindi tahasang sinasabi ng Hebreo na pumasok siya o pumayag, kaya pinanatili sa pangunahing teksto ang payak na kilos at ipinaliwanag sa talababa ang maaaring pahiwatig ng konteksto.
theological_decisions:
- issue: Ang katawagang “ama” sa konteksto ng di-wastong pribadong dambana
  choice: Panatilihin nang literal ang “ama”
  alternative: tagapayo; espirituwal na ama
  rationale: Tahasan ang metaporang pampamilya sa Hebreo. Ang literal na salin ay nagpapanatili sa panlipunan at panrelihiyong papel nang hindi ipinapasok ang mas huling terminolohiyang pansimbahan o hinuhusgahan sa loob mismo ng salin ang kaayusang kultiko.
- issue: Hindi tinukoy na yunit ng pilak
  choice: Huwag idagdag ang “shekel” sa pangunahing teksto
  alternative: sampung shekel na pilak
  rationale: Walang yunit na nakasaad sa pinagmulang teksto; ang “pirasong pilak” ay nagpapanatili sa kawalang-tiyak nito.
translation_notes:
  register: Modernong Filipino na malinaw at marangal ang rehistro. Ginamit ang “Micas” at “Levita” bilang karaniwang anyong Filipino ng mga pangalang biblikal. Pinanatili ang “ama” bilang metapora at ang di-tiyak na yunit ng pilak; hindi pinalawak ang huling pandiwa bilang tahasang pagsang-ayon.
