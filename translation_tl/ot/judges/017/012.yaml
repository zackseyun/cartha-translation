  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: tl
  text: Kaya itinalaga ni Mikas ang Levita[a], at ang binata ay naging pari niya at nasa bahay ni Mikas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “pinuno ang kamay ng Levita,” isang idyoma para sa paglalagay o pagtatalaga sa isang tao sa tungkuling pangpari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד הַלֵּוִי
  choice: itinalaga ni Mikas ang Levita
  rationale: Ang literal na idyomang Hebreo ay “pinuno ang kamay ng Levita,” na sa kontekstong pangpari ay tumutukoy sa paglalagay o pagtatalaga sa tungkulin. Ang “itinalaga” ay malinaw at likas sa modernong Tagalog, nang hindi nagpapahiwatig na lehitimo o sinang-ayunan ng Diyos ang ginawa ni Mikas.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Tinutukoy ng salita ang lalaki ayon sa kaniyang pagkakabilang sa lipi ni Levi. “Levita” ang karaniwan at malinaw na katumbas sa Tagalog.
- source_word: הַנַּעַר
  choice: ang binata
  rationale: Maaaring mangahulugan ang נַעַר ng batang lalaki, kabataan, lingkod, o binata. Dahil malaya na siyang gumaganap bilang pari sa salaysay, ang “binata” ang pinakaangkop dito.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: naging pari niya
  rationale: Ipinapahayag ng parirala na ang binata ay nagkaroon ng tungkuling maging pari para kay Mikas. Likas at tuwiran sa Tagalog ang “naging pari niya.”
- source_word: וַיְהִי בְּבֵית מִיכָה
  choice: nanirahan sa bahay ni Mikas
  rationale: Ang pandiwang וַיְהִי ay literal na “at siya ay/naroon,” ngunit sa ugnayang panirahan ng konteksto, malinaw na naihahatid ng “nanirahan” ang diwa ng pananatili sa bahay ni Mikas.
theological_decisions:
- issue: Paglalarawan sa pribado at di-karaniwang pagtatalaga nang hindi ipinahihiwatig na lehitimo ito
  choice: itinalaga ni Mikas ang Levita
  alternative: kinonsagra ni Mikas ang Levita; pinuno ni Mikas ang kamay ng Levita
  rationale: Inilalarawan ng Hebreo ang paglalagay ng Levita sa tungkuling pangpari. Ang “itinalaga” ay nagsasaad ng kilos ni Mikas ngunit hindi nagpapahayag na ito ay may pahintulot o pagsang-ayon ng Diyos. Pinananatili sa talababa ang mahalagang literal na idyomang Hebreo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “itinalaga” sa halip na mas teknikal na “inordinahan” o “kinonsagra,” at “binata” upang mapanatili ang pahiwatig ng edad nang hindi siya tinatawag na bata.
