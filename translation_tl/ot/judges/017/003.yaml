    rationale: Ang מִיָּדִי ay literal na “mula sa aking kamay.” Sapat na ang literal na pahayag sa teksto, at maaaring ilahad ang posibleng saklaw ng idyoma sa talababa.
  - severity: medium
    issue: Maaaring tukuyin ng “upang gumawa” ang ina bilang tagaganap nang higit sa pinahihintulutan ng Hebreo.
    rationale: Hindi tuwirang pinapangalanan ng infinitive na לַעֲשׂוֹת ang tagaganap. Ang “para sa paggawa ng” ay pinananatili ang layunin nang hindi nilulutas ang usapin ng tagaganap.
  - severity: low
    issue: Hindi gaanong idiomatiko ang “larawang binubo.”
    rationale: Ang מַסֵּכָה ay imaheng hinulma o ibinuhos mula sa tunaw na materyal, karaniwan ay metal. Ang “larawang hinulma” ay mas natural, at ang talababa ay makapagpapanatili ng espesipikong paraan ng paggawa.
