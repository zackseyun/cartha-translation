revisions:
- from: Kaya ibinalik niya sa kanyang ina ang isang libo at isang daang pirasong pilak. Sinabi ng kanyang ina, “Taimtim kong itinalaga kay Yahweh ang pilak mula sa sarili kong kamay[a] para sa aking anak, upang gumawa ng isang larawang inukit at isang larawang binubo[b]. Kaya ngayon, ibinabalik ko ito sa iyo.”
  to: Kaya ibinalik niya sa kanyang ina ang isang libo at isang daang pirasong pilak. Sinabi ng kanyang ina, “Taimtim kong itinalaga kay Yahweh ang pilak mula sa aking kamay[a] para sa aking anak, para sa paggawa ng isang larawang inukit at isang larawang hinulma[b]. Kaya ngayon, ibinabalik ko ito sa iyo.”
  rationale: Inayos ang literal ngunit hindi likas na “mula sa sarili kong kamay,” ginawang hindi tinutukoy ang tagaganap ng “upang gumawa,” at pinalitan ang “binubo” ng mas natural na “hinulma.” Nanatili ang mariing pagtatalaga, ang pangalang Yahweh, ang hindi nilulutas na tensiyon ng paggamit ng itinalagang pilak sa mga larawan, at ang dalawang katawagang Hebreo para sa mga larawan.
