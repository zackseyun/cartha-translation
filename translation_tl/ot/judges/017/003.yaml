base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: tl
  text: Kaya ibinalik niya sa kanyang ina ang isang libo at isang daang pirasong pilak. Sinabi ng kanyang ina, “Taimtim kong itinalaga kay Yahweh ang pilak mula sa aking kamay[a] para sa aking anak, para sa paggawa ng isang larawang inukit at isang larawang hinulma[b]. Kaya ngayon, ibinabalik ko ito sa iyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mula sa aking kamay.” Maaaring ipahiwatig ng idyomang ito ang sariling pag-aari, pinagmulan, o personal na pagkilos ng ina.
    reason: cultural_note
  - marker: b
    text: Ang “larawang hinulma” ay imaheng ginawa sa pamamagitan ng pagbubuhos o paghuhulma ng tunaw na materyal, karaniwang metal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ibinalik
  rationale: Ipinahahayag ng Hiphil ng שוב ang pagpapabalik o pagsasauli ng bagay; natural at tuwiran ang “ibinalik” sa Filipino.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: ang isang libo at isang daang pirasong pilak
  rationale: Hindi tahasang binanggit sa talata ang yunit na siklo, kaya pinanatili ang mas maingat na “pirasong pilak.”
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: Taimtim kong itinalaga
  rationale: Ang infinitive absolute na kasunod ng pandiwa ay nagbibigay-diin sa kilos; ipinahahayag ng “taimtim” ang diin at ng “itinalaga” ang panrelihiyong pagbubukod.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Isinalin ang banal na pangalang יהוה bilang “Yahweh,” na pinananatili itong personal na pangalang tipan.
- source_word: מִיָּדִי
  choice: mula sa sarili kong kamay
  rationale: Pinananatili ang konkretong idyomang Hebreo at ang posibleng diwa ng personal na pag-aari, pinagmulan, o pagkilos; nililinaw ito sa talababa nang hindi lubusang nilulutas ang saklaw nito.
- source_word: לִבְנִי
  choice: para sa aking anak
  rationale: Ipinakikita ng ל ang nilalayong makikinabang o layunin kaugnay ng anak.
- source_word: פֶּסֶל
  choice: isang larawang inukit
  rationale: Kongkreto at madaling maunawaan ang parirala, at pinananatili nito ang paraan ng paggawa nang hindi agad pinapalitan ng interpretatibong “diyus-diyosan.”
- source_word: וּמַסֵּכָה
  choice: at isang larawang binubo
  rationale: Ang מסכה ay tumutukoy sa imaheng ginawa sa pamamagitan ng pagbubuhos ng tunaw na materyal, karaniwang metal; tumpak at natural ang “binubo.”
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: ibinabalik ko ito sa iyo
  rationale: Ang anyong imperfect ay maaaring tumukoy sa kasalukuyan o nalalapit na kilos; ang kasalukuyang pananalita ay angkop sa agarang pagsasauli sa salaysay.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tahasang ginagamit ng Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang banal na pangalan sa halip na palitan ito ng titulo.
- issue: Wikang panrelihiyon para sa pagtatalaga ng pilak na gagamitin sa mga imahen
  choice: Taimtim kong itinalaga kay Yahweh ang pilak
  alternative: Inilaan ko kay Yahweh ang pilak
  rationale: Pinananatili ang mariing panrelihiyong wika ng Hebreo at ang tensiyong ang bagay na itinalaga kay Yahweh ay gagamitin sa paggawa ng mga imahen; hindi ito pinalambot o ipinaliwanag sa pangunahing teksto.
- issue: Ugnayan ng פֶּסֶל at מַסֵּכָה
  choice: isang larawang inukit at isang larawang binubo
  alternative: isang imaheng inukit at binubo
  rationale: Pinananatili ang dalawang magkaugnay na katawagan bilang dalawang gramatikal na bagay, gaya ng anyong Hebreo, nang hindi ipinapasiyang iisa lamang ang tinutukoy ng mga ito.
translation_notes:
  register: Makabago at marangal na Filipino ang ginamit. Pinili ang “pirasong pilak” sa halip na idagdag ang di-tahasang yunit na “siklo.” Pinanatili ang diin ng pagtatalaga, ang banal na pangalang Yahweh, at ang nakakabahalang tensiyon sa pagitan ng pagtatalaga kay Yahweh at paggawa ng mga imahen.
