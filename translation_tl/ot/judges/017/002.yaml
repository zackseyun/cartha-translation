  text: וַ/יֹּ֣אמֶר לְ/אִמּ֡/וֹ אֶלֶף֩ וּ/מֵאָ֨ה הַ/כֶּ֜סֶף אֲשֶׁ֣ר לֻֽקַּֽח לָ֗/ךְ ו/אתי אָלִית֙ וְ/גַם֙ אָמַ֣רְתְּ בְּ/אָזְנַ֔/י הִנֵּֽה הַ/כֶּ֥סֶף אִתִּ֖/י אֲנִ֣י לְקַחְתִּ֑י/ו וַ/תֹּ֣אמֶר אִמּ֔/וֹ בָּר֥וּךְ בְּנִ֖/י לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: tl
  text: Sinabi niya sa kanyang ina, “Ang isang libo at isandaang piraso ng pilak na kinuha sa iyo—na tungkol doon ay nagbitaw ka ng sumpa[a] at sinabi mo rin sa aking harapan—narito, nasa akin ang pilak; ako ang kumuha nito.” Sinabi ng kanyang ina, “Pagpalain nawa ni Yahweh ang anak ko.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “na tungkol dito ay nanumpa ka.” Ang pandiwang Hebreo ay maaaring tumukoy sa panunumpa o pagsumpa, ngunit mas pinapaboran dito ng konteksto ang pagbigkas ng sumpa.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “Pinagpala ang anak ko kay/ni Yahweh,” isang maikli at siksik na pormula ng pagpapala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: isang libo at isandaang piraso ng pilak
  rationale: Pinananatili ang tiyak na bilang ngunit hindi ipinapalagay na tahasang binanggit ang yunit na siklo sa Hebreo.
- source_word: לֻקַּח לָךְ
  choice: kinuha sa iyo
  rationale: Tuwirang sinasalamin ang pasibong anyo ng לקח at ang pagkawala mula sa pag-aari ng ina, nang hindi idinaragdag ang salitang 'ninakaw.'
- source_word: וְאַתִּי אָלִית
  choice: na isinumpa mo
  rationale: Maaaring tumukoy ang אָלָה sa panunumpa o pagsumpa; pinapaboran ng konteksto ang pagbigkas ng sumpa tungkol sa nawawalang pilak. Nililinaw sa talababa ang tunay na leksikal na alternatibo.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: at binanggit mo rin habang naririnig ko
  rationale: Natural na Filipino para sa idyomang Hebreo na literal na 'sinabi sa aking mga tainga,' habang pinananatili ang ideya na personal niya itong narinig.
- source_word: הִנֵּה
  choice: narito
  rationale: Karaniwang panandang pantawag-pansin sa modernong Filipino na angkop sa biglang pagpapakita o pag-amin tungkol sa pilak.
- source_word: הַכֶּסֶף אִתִּי
  choice: nasa akin ang pilak
  rationale: Natural at malapit sa literal na Hebreong 'ang pilak ay kasama ko/nasa akin.'
- source_word: אֲנִי לְקַחְתִּיו
  choice: ako ang kumuha nito
  rationale: Ipinahahayag ang diin ng tahasang panghalip na אֲנִי sa natural na paraang Filipino.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Pagpalain nawa ni Yahweh ang anak ko
  rationale: Natural na pormula ng pagpapala sa Filipino; inuunawa ang לַיהוָה bilang kaugnay sa pinagmumulan o gumaganap ng pagpapala, habang itinatala ang siksik at maaaring pag-iba-ibahin na konstruksiyon sa talababa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasyon ng personal na pangalang banal na tahasang nasa tekstong Hebreo, sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Kahulugan ng אָלָה sa sinabi ng ina
  choice: isinumpa mo
  alternative: nanumpa ka
  rationale: Parehong saklaw ng pandiwa ang sumpa at panunumpa. Mas malamang sa konteksto ng nawawalang pilak na bumigkas ang ina ng sumpa, ngunit hindi itinatago ang alternatibo.
- issue: Pagkakaugnay ng לַיהוָה sa pormula ng pagpapala
  choice: Pagpalain nawa ni Yahweh ang anak ko
  alternative: Pagpalain nawa ang anak ko para/kay Yahweh
  rationale: Ang maikling Hebreong pormula ay maaaring unawain sa higit sa isang paraan. Pinili ang natural na pagpapalang si Yahweh ang pinagmumulan, nang hindi nagdaragdag ng denominasyonal na paliwanag.
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ang personal na pangalang nasa pinagmulang Hebreo sa pamamagitan ng karaniwang transliterasyong 'Yahweh.'
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pagsasalaysay. Ginamit ang “ina” at “anak ko” bilang natural ngunit hindi kolokyal na pananalita. Pinanatili ang “Yahweh” bilang pangalan at iniwasang tukuyin ang pilak bilang mga siklo dahil walang tahasang yunit sa talata.
