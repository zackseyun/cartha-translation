  to: Sinabi niya sa kanyang ina, “Ang isang libo at isandaang piraso ng pilak na kinuha sa iyo—na tungkol doon ay nagbitaw ka ng sumpa[a] at sinabi mo rin sa aking harapan—narito, nasa akin ang pilak; ako ang kumuha nito.” Sinabi ng kanyang ina, “Pagpalain nawa ni Yahweh ang anak ko.[b]”
