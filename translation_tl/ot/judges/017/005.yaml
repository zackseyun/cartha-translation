base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: tl
  text: May sariling sambahan si Mikas[a], at gumawa siya ng efod at mga diyus-diyosan sa tahanan. Itinalaga niya ang isa sa kanyang mga anak na lalaki[b], at ito ang naging pari niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “bahay ng Diyos” o “bahay ng mga diyos.” Sa Hebreo, literal na “bahay ng elohim”; sa kontekstong ito, nauunawaan ito bilang pribadong sambahan.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “pinuno niya ang kamay ng isa sa kanyang mga anak na lalaki,” isang idyoma para sa pagtatalaga o pagluluklok sa paglilingkod bilang pari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: sariling sambahan
  rationale: Sa konteksto, tumutukoy ito sa pribadong lugar ng pagsamba ni Mikas. Likas at malinaw sa makabagong Tagalog ang “sariling sambahan,” samantalang pinananatili sa talababa ang literal na anyo at ang kalabuan ng אֱלֹהִים.
- source_word: אֵפוֹד
  choice: efod
  rationale: Isinalin sa baybay-Tagalog ang tiyak na sinaunang kagamitang panrelihiyon dahil walang payak at ganap na katumbas sa Tagalog.
- source_word: תְרָפִים
  choice: mga diyus-diyosan sa tahanan
  rationale: Ipinahahayag nito sa karaniwang Tagalog ang mga imaheng panrelihiyon na ginagamit sa sambahayan, nang hindi nagpapasok ng labis na paliwanag sa pangunahing teksto.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: itinalaga niya
  rationale: Ang literal na idyomang “pinuno ang kamay” ay nangangahulugang iniluklok o itinalaga sa tungkuling pari; “itinalaga” ang natural at tumpak na katumbas sa konteksto.
- source_word: אַחַד מִבָּנָיו
  choice: isa sa kanyang mga anak na lalaki
  rationale: Pinananatili ang panlalaking kahulugan ng בָּנָיו at ang partitive na diwa ng “isa sa.”
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: ito ang naging pari niya
  rationale: Pinananatili ang resultang ipinahahayag ng וַיְהִי at malinaw na ang anak ni Mikas ang naging pari para sa kanya.
theological_decisions:
- issue: Kung ang בֵּית אֱלֹהִים ay dapat magmukhang lehitimong bahay ng tunay na Diyos o isang pribadong dambana
  choice: sariling sambahan
  alternative: bahay ng Diyos; bahay ng mga diyos
  rationale: Hindi tahasang nilulutas ng pangunahing salin kung singular o plural ang kahulugan ng אֱלֹהִים. Ipinakikita ng konteksto na pribado at di-regular ang kulto ni Mikas, ngunit inilalahad sa talababa ang literal na anyo at parehong posibleng pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang maiikling pangungusap upang maging madaling basahin, habang pinananatili sa mga talababa ang literal na idyoma at tunay na leksikal na kalabuan.
