base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: tl
  text: Kaya ibinalik niya ang pilak sa kanyang ina. Kumuha ang kanyang ina ng dalawang daang pirasong pilak[a] at ibinigay iyon sa panday-pilak. Ginawa niya itong isang inukit na larawan at isang hinulmang larawan[b]. At iyon ay nasa bahay ni Mikas.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “dalawang daang shekel na pilak.” “Dalawang daang pilak” lamang ang literal na sinasabi ng Hebreo; hindi tahasang binabanggit ang yunit sa talatang ito.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “isang larawang nililok at isang larawang yari sa tunaw na metal.”
    reason: lexical_alternative
  - marker: c
    text: Isahan ang pandiwa sa Hebreo—“at iyon ay nasa”—matapos banggitin ang “isang inukit na larawan at isang hinulmang larawan.” Pinananatili rito ang isahang anyo nang hindi ipinapasiyang isa o dalawa ang mga bagay.
    reason: textual_syntax
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ibinalik
  rationale: Ang Hiphil ng שׁוב ay nagpapahiwatig na pinabalik niya ang pilak sa dating may-ari nito. Likas at malinaw sa makabagong Filipino ang “ibinalik.”
- source_word: הַכֶּסֶף
  choice: ang pilak
  rationale: Maaaring mangahulugang “pilak” o “salapi” ang כֶּסֶף. Dahil sinusukat ang materyal at pagkatapos ay ipinagawa itong mga larawan, pinananatili rito ang kongkretong kahulugang “pilak.”
- source_word: מָאתַיִם כֶּסֶף
  choice: dalawang daang pirasong pilak
  rationale: Bilang at “pilak” lamang ang tahasang sinasabi ng Hebreo, nang walang binanggit na yunit sa talatang ito. Ang “pirasong pilak” ay natural sa Filipino at hindi tiyak na nagdaragdag ng “shekel.”
- source_word: לַצּוֹרֵף
  choice: sa panday-pilak
  rationale: Ang צֹרֵף ay isang tagapagdalisay o manggagawa ng metal. Dahil pilak ang materyal sa konteksto, ang “panday-pilak” ang pinakanatural at tiyak na katumbas.
- source_word: וַיַּעֲשֵׂהוּ
  choice: Ginawa niya iyon na
  rationale: Ang pandiwang panlalaking isahan ay natural na tumutukoy sa panday-pilak bilang gumagawa, at ang hulaping isahan ay tumutukoy sa pilak bilang materyal.
- source_word: פֶּסֶל
  choice: isang inukit na larawan
  rationale: Tumutukoy ang פֶּסֶל sa isang larawang nililok o inuukit, madalas sa kontekstong kultiko. Inilalarawan ng salin ang bagay nang hindi agad ipinapasok ang mas mapanghusgang salitang “diyus-diyosan.”
- source_word: וּמַסֵּכָה
  choice: at isang hinulmang larawan
  rationale: Ang מַסֵּכָה ay larawang ginawa sa pamamagitan ng pagbubuhos o paghulma ng tunaw na metal. Natural sa kasalukuyang Filipino ang “hinulmang larawan.”
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: At iyon ay nasa bahay ni Mikas
  rationale: Pinananatili ng “iyon” ang isahang pandiwa sa Hebreo matapos banggitin ang dalawang katawagan, kaya hindi ipinapasiyang magkahiwalay na bagay ang mga ito.
- source_word: מִיכָיְהוּ
  choice: Mikas
  rationale: Ang “Mikas” ay malinaw at angkop na makabagong Filipino na anyo ng pangalang karaniwang kilala bilang Micah.
theological_decisions:
- issue: Kung gagamit ng tahasang mapanghusgang katawagang “diyus-diyosan” para sa פֶּסֶל וּמַסֵּכָה
  choice: isang inukit na larawan at isang hinulmang larawan
  alternative: isang diyus-diyosan at isang larawang yari sa tunaw na metal
  rationale: Maliwanag na problematiko ang mga bagay na ito sa mas malawak na salaysay, ngunit mas tapat na isalin ang kongkretong mga katawagan ng Hebreo kaysa idagdag sa talata ang tahasang paghatol na ipinahihiwatig ng konteksto.
- issue: Kung isa o dalawa ang ginawang kultikong bagay
  choice: Panatilihin ang dalawang katawagan ngunit gumamit ng isahang “iyon” sa huling pangungusap
  alternative: “at ang mga iyon ay nasa bahay ni Mikas”
  rationale: Dalawang pangngalan ang binabanggit, ngunit isahan ang hulapi sa pandiwa at isahan din ang kasunod na וַיְהִי. Maaaring isang pinagsamang bagay, isang set, o isang bagay na inilalarawan sa dalawang paraan; hindi ito dapat tahasang lutasin ng salin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “panday-pilak” at “hinulmang larawan” bilang madaling maunawaang mga katawagang teknikal. Inulit ang “kanyang ina” gaya ng Hebreo, at pinanatili ang di-tiyak na ugnayan ng dalawang katawagan sa larawan sa pamamagitan ng isahang “iyon.”
