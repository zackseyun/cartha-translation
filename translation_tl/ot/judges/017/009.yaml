  text: וַ/יֹּאמֶר ל֥/וֹ מִיכָ֖ה מֵ/אַ֣יִן תָּב֑וֹא וַ/יֹּ֨אמֶר אֵלָ֜י/ו לֵוִ֣י אָנֹ֗כִי מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה וְ/אָנֹכִ֣י הֹלֵ֔ךְ לָ/ג֖וּר בַּ/אֲשֶׁ֥ר אֶמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: tl
  text: Sinabi sa kanya ni Micas, “Saan ka nanggaling?” Sumagot siya, “Isa akong Levita mula sa Bethlehem sa Juda. Naglalakbay ako upang manirahan bilang dayo[a] saanman ako makahanap ng matutuluyan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “upang pansamantalang manirahan.” Ang pandiwa ay maaaring tumukoy sa paninirahan bilang isang dayo o nakikituloy, na walang sariling minanang lugar doon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: Saan ka nanggaling?
  rationale: Likas na tanong sa modernong Tagalog tungkol sa pinanggalingan, at pinananatili ang diwa ng Hebreong interrogative of origin.
- source_word: לֵוִי
  choice: isang Levita
  rationale: Tumutukoy sa pagkakakilanlan bilang kabilang sa lipi ni Levi; natural sa Tagalog ang pariralang “Isa akong Levita.”
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: mula sa Bethlehem sa Juda
  rationale: Nililinaw na ito ang Bethlehem na nasa nasasakupan ng Juda, nang hindi ginagawang tambalang pangalang pantangi ang parirala.
- source_word: הֹלֵךְ
  choice: Naglalakbay ako
  rationale: Ipinapahayag ng participle ang kasalukuyan at nagpapatuloy na paglakad o paglalakbay; mas natural ito kaysa sa literal na “ako ay pumupunta” sa konteksto.
- source_word: לָגוּר
  choice: upang manirahan bilang dayo
  rationale: Pinananatili ang diwa ng paninirahang walang sariling minanang lugar at bilang tagalabas o nakikituloy; hindi nito ipinapalagay na permanente ang paninirahan.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: saanman ako makahanap ng matutuluyan
  rationale: Elliptical ang Hebreo at walang tahasang layon ng “makahanap.” Idinagdag ang “matutuluyan” upang maging malinaw at natural sa Tagalog habang pinananatili ang bukás at di-tiyak na patutunguhan.
