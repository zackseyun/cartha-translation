  source_fidelity: 'Tapat ang salin sa Hebreo: ang tanong ay tungkol sa pinanggalingan; ang nagsasalita ay nagpapakilalang isang Levita mula sa Bethlehem sa Juda; at ipinahahayag niyang siya ay naglalakbay upang manirahan bilang dayo saanman siya makahanap ng matutuluyan. Ang idinagdag na “matutuluyan” ay isang katanggap-tanggap na paglilinaw sa elliptikal na layon ng אֶמְצָא.'
  naturalness: Natural at malinaw ang modernong Tagalog. Ang “Saan ka nanggaling?” at “Isa akong Levita” ay idiomatiko. Ang “Naglalakbay ako upang manirahan bilang dayo” ay marangal at madaling unawain, habang pinananatili ang pansamantalang/tagalabas na himig ng pandiwa.
  terminology: Wasto at pare-pareho ang “Levita,” “Bethlehem,” at “Juda.” Ang “manirahan bilang dayo” ay angkop na katumbas ng לָגוּר at hindi nagdaragdag ng doktrinal na pagbasa. Wasto rin ang pagkakaangkla ng talababa sa “dayo.”
