  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: tl
  text: Noong mga panahong iyon, walang hari sa Israel; ginagawa ng bawat isa kung ano ang matuwid sa sarili niyang paningin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Nang mga panahong iyon
  rationale: Likas na pormulang Filipino para sa balangkas na panahong binabalikan sa salaysay.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: walang hari sa Israel
  rationale: Tuwirang ipinahahayag ng אֵין ang kawalan ng hari, nang walang idinaragdag na interpretasyong pampolitika.
- source_word: אִישׁ
  choice: bawat isa
  rationale: Sa kontekstong pamamahagi, ang pang-isahang אִישׁ ay kumakatawan sa bawat tao. Natural sa modernong Filipino ang “bawat isa” at pinananatili nito ang panlahatang diwa nang hindi kailangang gawing espesipiko sa kasarian.
- source_word: הַיָּשָׁר
  choice: ang matuwid
  rationale: Ipinapahayag ng יָשָׁר ang itinuturing na tama o matuwid; ang “matuwid” ay dignified at angkop sa idyomang tumutukoy sa pansariling pamantayan.
- source_word: בְּעֵינָיו
  choice: sa sarili niyang paningin
  rationale: Pinananatili ang Hebreong idyoma ng pansariling paghatol at malinaw na ipinahihiwatig ng “sarili niyang” ang reflexive na diwa.
- source_word: יַעֲשֶׂה
  choice: ginagawa
  rationale: Bagaman imperfect ang anyo, nagsasaad ito rito ng nakagawiang kilos noong panahong inilalarawan. Natural na naihahatid ng aspektong imperpektibo ng “ginagawa” ang paulit-ulit o palagiang gawain.
theological_decisions:
- issue: Ang pagtataya ng tagapagsalaysay sa kalagayan ng Israel nang hindi ginagawang tahasang aral na ang monarkiya ang ganap na lunas
  choice: Pinanatili ang payak na pahayag tungkol sa kawalan ng hari at ang negatibong pahiwatig ng idyomang “ang matuwid sa sarili niyang paningin.”
  alternative: Maaaring basahin ito bilang neutral na tala sa kasaysayan o bilang tahasang pagtataguyod sa monarkiya.
  rationale: Sa paulit-ulit na refrain ng Mga Hukom, inilalarawan nito ang kaguluhang panlipunan at panrelihiyon. Hindi nilulutas ng salin ang tensiyon sa pamamagitan ng pagdaragdag ng teolohiyang pampolitika na hindi tahasang sinasabi ng talata.
translation_notes:
  register: Modernong Filipino na natural ngunit marangal. Ginamit ang “bawat isa” bilang idiomatikong katumbas ng distributive at representative na אִישׁ; hindi kailangan ng talababa sapagkat hindi nawawala ang saklaw ng Hebreo.
