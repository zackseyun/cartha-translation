base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: tl
  text: Sinabi ni Mikas, “Ngayon ay alam kong magiging mabuti sa akin si Yahweh, sapagkat ang Levita[a] ay pari ko.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “isang Levita.” May tiyak na pantukoy ang Hebreo (“ang Levita”), na maaaring tumukoy sa Levitang naipakilala na sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pasalaysay na anyo sa Filipino; naipahihiwatig ng pagkakasunod ng pangyayari ang waw-consecutive nang hindi kailangang idagdag ang “pagkatapos.”
- source_word: מִיכָה
  choice: Mikas
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na Micah.
- source_word: עַתָּה
  choice: Ngayon
  rationale: Tuwirang nagpapahayag ng kasalukuyang konklusyon ni Mikas.
- source_word: יָדַעְתִּי
  choice: alam ko
  rationale: Ang Hebreong perfect ay tumutukoy rito sa kalagayang bunga ng pagkaunawa; natural sa Filipino ang pangkasalukuyang “alam ko.”
- source_word: יֵיטִיב
  choice: gagawan ... ng mabuti
  rationale: Pinananatili ang malawak na diwa ng Hiphil ng יטב, ‘gumawa ng mabuti/makitungo nang mabuti,’ nang hindi nililimitahan sa materyal na pagpapala.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tinutumbasan ang personal na pangalang banal sa pamamagitan ng transliterasyon, hindi ng pamagat.
- source_word: לִי
  choice: ako
  rationale: Sa pariralang Filipino na “gagawan ako ng mabuti,” ang panghalip ang natural na tumutukoy sa tumatanggap ng kabutihan.
- source_word: כִּי הָיָה לִי
  choice: sapagkat ... ay naging ... ko
  rationale: Ipinahahayag ng ikalawang כִּי ang dahilan, at ang הָיָה לִי ay maaaring ilarawan bilang pagkakaroon o pagkapasok sa isang ugnayan; ang “naging ... ko” ay angkop sa konteksto ng paghirang.
- source_word: הַלֵּוִי
  choice: ang Levita
  rationale: Pinananatili ang tiyak na pantukoy ng Hebreo at tinutukoy ang partikular na Levita na naipakilala na sa salaysay.
- source_word: לְכֹהֵן
  choice: pari
  rationale: Kasama ng “naging ... ko,” malinaw at natural nitong ipinahahayag ang tungkulin o papel ng Levita bilang pari.
theological_decisions:
- issue: Pag-render sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng isang titulo.
- issue: Saklaw ng יֵיטִיב
  choice: gagawan ako ng mabuti
  alternative: pagpapalain ako / pauunlarin ako
  rationale: Hindi tinutukoy ng pandiwa ang eksaktong uri ng mabuting pakikitungo. Iniiwasan ng salin na ipakahulugan ito nang makitid bilang materyal na kasaganaan o bilang tiyak na banal na pagsang-ayon sa ginawa ni Mikas.
translation_notes:
  register: Modernong Filipino na dignificado at madaling maunawaan. Pinanatili ang “ang Levita” dahil tiyak ang pantukoy sa Hebreo at kilala na ang taong tinutukoy. Ang “pari ko” ay natural na nagpapahayag ng לִי at ng papel na לְכֹהֵן nang hindi mabigat ang pagkakabuo.
