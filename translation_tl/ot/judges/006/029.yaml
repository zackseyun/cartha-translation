base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: tl
  text: At sinabi nila sa isa’t isa[a], “Sino ang gumawa nito[b]?” Nagsiyasat sila at naghanap, at sinabi nila, “Si Gideon na anak ni Joas ang gumawa nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “at sinabi nila, bawat lalaki sa kanyang kapwa.” Maaari ring isalin na “at nagsabi ang bawat isa sa kanyang kapwa” o “at sinabi ng isa sa iba.”
    reason: lexical_alternative
  - marker: b
    text: O, “Sino ang gumawa ng bagay na ito?” o “Sino ang gumawa ng gawaing ito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: sinabi nila sa isa’t isa
  rationale: Likas na salin sa modernong Tagalog ng Hebreong idyomang nagsasaad na nagtanungan ang mga lalaki sa kanilang magkakapwa. Inilalagay sa talababa ang mas literal na anyo.
- source_word: מִי
  choice: Sino
  rationale: Tuwirang panghalip na pananong tungkol sa gumawa ng kilos.
- source_word: עָשָׂה
  choice: gumawa
  rationale: Ipinapahayag ang natapos nang kilos at likas na ginagamit sa tanong na “Sino ang gumawa nito?”
- source_word: הַדָּבָר הַזֶּה
  choice: nito
  rationale: Sa konteksto, tumutukoy ang דָּבָר sa gawa o pangyayaring natuklasan nila. Ang “nito” ay malinaw at natural sa Tagalog, habang pinananatili sa talababa ang mas tahasang alternatibo.
- source_word: וַיִּדְרְשׁוּ
  choice: nagsiyasat
  rationale: Ipinakikita ang masusing pagtatanong o pag-iimbestiga at naihihiwalay sa kasunod na pandiwang “naghanap.”
- source_word: וַיְבַקְשׁוּ
  choice: naghanap
  rationale: Pinananatili ang diwa ng aktibong paghahanap at ang pag-usad mula sa pagsisiyasat tungo sa paghahanap sa salarin.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Gideon na anak ni Joas
  rationale: Ginagamit ang karaniwang anyong Filipino ng Hebreong patronimiko at ang nakasanayang baybay na “Joas.”
- source_word: וַיֹּאמְרוּ
  choice: sinabi nila
  rationale: Hindi pinalalakas bilang “napagpasyahan nila”; pinananatili ang payak na pag-uulat ng Hebreong אמר.
