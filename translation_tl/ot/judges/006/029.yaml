translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinili ang “sa isa’t isa” at “nito” upang maiwasan ang di-likas na literalismo, habang inilalahad sa mga talababa ang anyo at lawak ng Hebreong pananalita.
