  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: tl
  text: Pagkatapos, iniunat ng anghel ni Yahweh[a] ang dulo ng tungkod na hawak niya at idinampi iyon sa karne[b] at sa tinapay na walang pampaalsa. Umakyat ang apoy mula sa bato at tinupok ang karne at ang tinapay na walang pampaalsa. Pagkatapos, umalis sa paningin ni Gideon[c] ang anghel ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ni Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “laman”; tumutukoy rito sa inihandang karne.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “umalis mula sa kaniyang mga mata”; ibig sabihin, hindi na siya nakikita ni Gideon.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng “sugo” o “anghel.” Dahil kumikilos nang mahimala ang nilalang sa salaysay, natural sa modernong Tagalog ang “anghel,” habang pinananatili ng “ni Yahweh” ang ugnayang nasa Hebreo.
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: dulo ng tungkod
  rationale: Tumpak at natural na inilalarawan nito ang dulo ng isang tungkod o panukod; hindi kailangang tukuyin bilang tungkod sa paglakad.
- source_word: וַיִּשְׁלַח
  choice: iniunat
  rationale: Sa konteksto, ang kilos ay pag-uunat ng tungkod, hindi pagpapadala rito. Ang “iniunat” ay malinaw at malapit sa anyo ng Hebreo.
- source_word: וַיִּגַּע
  choice: idinampi
  rationale: Ipinahihiwatig ng נגע ang paghipo o pagdikit. Ang “idinampi” ay natural kapag tungkod ang ipinantatama at hindi nagdaragdag ng diwang paghampas.
- source_word: בָּשָׂר
  choice: karne
  rationale: Bagaman maaari itong literal na isaling “laman,” tumutukoy ito rito sa inihandang pagkaing handog, kaya mas malinaw ang “karne.”
- source_word: מַצּוֹת
  choice: tinapay na walang pampaalsa
  rationale: Malinaw ito sa karaniwang mambabasa at pinananatili ang mahalagang katangiang walang lebadura o pampaalsa.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: Umakyat ang apoy mula sa bato
  rationale: Pinananatili nito ang matingkad na larawang ang apoy ay nagmula at umakyat mula sa bato, nang hindi dinaragdagan ang teksto.
- source_word: וַתֹּאכַל
  choice: tinupok
  rationale: Ang literal na diwang “kinain” ay likas na ipinapahayag sa Tagalog bilang “tinupok” kapag apoy ang simuno.
- source_word: הָלַךְ מֵעֵינָיו
  choice: nawala sa paningin ni Gideon
  rationale: Ang idyomang Hebreo ay literal na “umalis mula sa kaniyang mga mata.” Ang salin ay malinaw na nagsasabing hindi na niya ito nakikita, ngunit hindi ipinipilit kung bigla itong naglaho o umalis.
theological_decisions:
- issue: Pagbibigay-salin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Personal na pangalan ang Tetragrammaton sa teksto. Ang “Yahweh” ay tuwirang transliterasyon at iniiwasang palitan ang pangalan ng isang titulo.
- issue: Pagbibigay-salin sa מַלְאַךְ bilang anghel o sugo
  choice: anghel
  alternative: sugo
  rationale: Kapuwa posible sa salita ang “anghel” at “sugo.” Pinili ang “anghel” dahil sa mahimalang kilos sa konteksto, ngunit nakatala sa talababa ang leksikal na alternatibo upang mapanatili ang tunay na saklaw ng kahulugan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling basahin. Ginamit ang “pampaalsa” sa halip na mas teknikal o di-pamilyar na katawagan. Tahasang binanggit si Gideon sa huling pangungusap upang luminaw ang reperente ng panghalip nang hindi nagbabago ang kahulugan.
