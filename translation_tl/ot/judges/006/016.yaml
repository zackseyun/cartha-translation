id: JDG.6.16
reference: Judges 6:16
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה כִּ֥י אֶהְיֶ֖ה עִמָּ֑/ךְ וְ/הִכִּיתָ֥ אֶת מִדְיָ֖ן כְּ/אִ֥ישׁ אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: tl
  text: At sinabi sa kanya ni Yahweh, “Tiyak na sasamahan kita, at tatalunin mo ang Midian na para bang iisang tao lamang[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “gaya ng iisang tao.” Maaaring idiin ng idyomang Hebreo na buong-buo o tiyak ang pagkatalo ng Midian, na para bang iisang kalaban lamang ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinanatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: At sinabi sa kanya
  rationale: Likas na isinusulong ng waw-consecutive ang salaysay; pinananatili ng “At” ang daloy nang hindi dinaragdagan ang temporal na diin.
- source_word: כִּי
  choice: Tiyak na
  rationale: Sa kontekstong ito, ipinahahayag nito ang mariing katiyakang batayan ng tagumpay ni Gideon. Natural sa makabagong Tagalog ang “Tiyak na” para sa ganitong pagtiyak.
- source_word: אֶהְיֶה עִמָּךְ
  choice: sasamahan kita
  rationale: Ang imperfect ng היה ay may hinaharap na diwa sa pangakong ito. Ang “sasamahan kita” ay natural na Tagalog para sa pormulang “ako ay makakasama mo,” habang pinananatili ang pangako ng presensiya ng Diyos.
- source_word: וְהִכִּיתָ
  choice: at tatalunin mo
  rationale: May hinaharap o resultang diwa ang anyo ng pandiwa pagkatapos ng pangako. Sa konteksto ng pakikipagdigma, malinaw at natural na katumbas ng נכה ang “tatalunin,” samantalang magiging labis na literal at di-likas ang “hahampasin.”
- source_word: אֶת מִדְיָן
  choice: ang Midian
  rationale: Pinanatili ang pangalang kolektibo sa Hebreo sa halip na tahasang gawing “mga Midianita.” Nauunawaan sa konteksto na tumutukoy ito sa bayan o hukbo ng Midian.
- source_word: כְּאִישׁ אֶחָד
  choice: na para bang iisang tao lamang
  rationale: Pinananatili ang larawang panlalaking isahan at ang paghahambing sa buong Midian sa iisang tao, habang gumagamit ng likas na parirala sa Tagalog. Ipinaliliwanag sa talababa ang posibleng idiomatikong diin.
theological_decisions:
- issue: Paglalarawan sa banal na pangalan na יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan sa halip na palitan ito ng titulo.
- issue: Idiomatikong diwa ng כְּאִישׁ אֶחָד
  choice: na para bang iisang tao lamang
  alternative: gaya ng isang tao; na parang nagkakaisang isang lalaki
  rationale: Pinananatili ng salin ang tuwirang larawan at hindi tiyakang nililimitahan ang parirala sa ideya lamang ng pagkakaisa o kadalian. Sa konteksto, maaari nitong idiin na ang buong Midian ay mapabagsak nang buong-buo o tiyak, na para bang iisang kalaban lamang.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “sasamahan kita” bilang natural na pagpapahayag ng presensiya at pagtulong ng Diyos, at ang “tatalunin” bilang angkop na pandiwang militar. Inilagay ang talababa sa pariralang כְּאִישׁ אֶחָד na aktuwal nitong nililinaw.
