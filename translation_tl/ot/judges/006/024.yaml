  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם גִּדְע֤וֹן מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָא ל֥/וֹ יְהוָ֖ה שָׁל֑וֹם עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה עוֹדֶ֕/נּוּ בְּ/עָפְרָ֖ת אֲבִ֥י הָעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: tl
  text: Pagkatapos, nagtayo roon si Gideon ng isang altar para kay Yahweh at pinangalanan niya itong[a] “Si Yahweh ay Kapayapaan.” Nananatili pa iyon hanggang sa araw na ito sa Ofra ng mga Abiezerita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “YHWH shalom”; kinaugaliang isatitik na “Yahweh-shalom.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: nagtayo
  rationale: Karaniwang salin ng בנה kapag ang bagay na itinatayo ay isang altar; natural ito sa makabagong Filipino.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Ito ang malinaw at karaniwang terminong Filipino para sa lugar ng paghahandog.
- source_word: לַיהוָה
  choice: para kay Yahweh
  rationale: Ang ל ay nagpapahiwatig ng pag-aalay o pagtatalaga ng altar kay Yahweh; ginagamit ang pangalang Yahweh para sa יהוה.
- source_word: וַיִּקְרָא לוֹ
  choice: pinangalanan niya itong
  rationale: Sa konteksto, ang קרא + ל ay tumutukoy sa pagbibigay ng pangalan sa altar; malinaw at natural ang pariralang Filipino.
- source_word: יְהוָה שָׁלוֹם
  choice: Si Yahweh ay Kapayapaan
  rationale: Isinasalin ang kahulugan ng pangalang pang-alaala at likas na idinaragdag ang pangawing na “ay” sa Filipino, habang pinananatili ang payak na nominal na pahayag ng Hebreo.
- source_word: שָׁלוֹם
  choice: Kapayapaan
  rationale: Pinakamaikli at pinakakilalang katumbas sa pormula ng pangalan, bagaman maaaring saklawin ng Hebreo ang kagalingan at kabuuan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: hanggang sa araw na ito
  rationale: Tuwirang natural na salin ng temporal na pahayag na umaabot sa panahon ng tagapagsalaysay.
- source_word: עוֹדֶנּוּ
  choice: Nananatili pa iyon
  rationale: Ipinapahayag nito ang patuloy na pag-iral o presensiya ng altar.
- source_word: בְּעָפְרָת
  choice: sa Ofra
  rationale: Karaniwang pagsasatitik sa Filipino ng pangalang-lugar na עָפְרָה.
- source_word: אֲבִי הָעֶזְרִי
  choice: ng mga Abiezerita
  rationale: Ipinakikita ng anyong gentilic ang kaugnayan ng Ofra sa angkan ng Abiezer; natural sa Filipino ang maramihang katawagang “mga Abiezerita.”
theological_decisions:
- issue: Paglalarawan sa banal na pangalan יהוה sa pagtatalaga ng altar at sa pangalan nito
  choice: Yahweh / Si Yahweh ay Kapayapaan
  alternative: PANGINOON / Ang PANGINOON ay Kapayapaan; Yahweh-shalom
  rationale: Tahasang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalang tipan, at isinasalin ang שָׁלוֹם upang maunawaan ang kabuluhan ng pangalan ng altar.
- issue: Kung ang יְהוָה שָׁלוֹם ay pangalan lamang o isang pahayag din tungkol kay Yahweh
  choice: 'Panatilihin bilang isinaling pangalan na may anyong pahayag: “Si Yahweh ay Kapayapaan”'
  alternative: “Yahweh-shalom” o “Yahweh, Kapayapaan”
  rationale: Ang Hebreo ay isang walang-pandiwang pormula na maaaring gumana bilang pangalan at pahayag. Ang salin ay hindi nagpapalawak sa kahulugan ngunit pinananatili ang likas na teolohikal na tensiyon nito.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “altar,” na malawak nang nauunawaan, at ang “Ofra” at “Abiezerita” bilang mga anyong angkop sa baybay Filipino. Ang panghalip na “iyon” ay tumutukoy sa altar.
