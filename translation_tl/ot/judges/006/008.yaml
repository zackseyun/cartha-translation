  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: tl
  text: 'Pagkatapos, nagsugo si Yahweh ng isang lalaki, isang propeta, sa mga anak ni Israel, at sinabi niya sa kanila, “Ganito ang sabi ni Yahweh, ang Diyos ng Israel: Iniahon ko kayo mula sa Ehipto at inilabas ko kayo mula sa bahay ng mga alipin.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mula sa lugar ng pagkaalipin.” Sa literal, “mula sa bahay ng mga alipin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa Tagalog ang “Pagkatapos” upang ipakita ang kasunod na pangyayari.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אִישׁ נָבִיא
  choice: isang lalaki, isang propeta
  rationale: Pinananatili ang dalawang pangngalang magkakapposisyon sa Hebreo, bagaman maaari ring paikliin bilang “isang propeta.”
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: sa mga anak ni Israel
  rationale: Pinananatili ang nakaugaliang panlahatang katawagan sa bayang Israel at ang konkretong anyo ng Hebreo.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Natural at marangal na Tagalog para sa pormulang ginagamit ng mensaherong propeta; ang anyong perpektibo אָמַר ay naipapahayag bilang “sinabi.”
- source_word: הֶעֱלֵיתִי
  choice: nag-ahon sa inyo
  rationale: Ipinahahayag ang sanhiang kahulugan ng עלה at pinananatili ang larawang pag-ahon mula sa Ehipto.
- source_word: וָאֹצִיא
  choice: at naglabas sa inyo
  rationale: Tuwirang ipinahahayag ang sanhiang kahulugan ng יצא at ang motibo ng pagliligtas sa Exodo.
- source_word: מִבֵּית עֲבָדִים
  choice: mula sa bahay ng mga alipin
  rationale: Malapit sa literal na “bahay ng mga alipin” at pinananatili ang konkretong larawang Hebreo; ang mas idyomatikong “lugar ng pagkaalipin” ay inilagay sa talababa.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Direktang ginagamit ng talata ang Tetragrammaton; pinananatili ng “Yahweh” ang personal at tipanang pangalan nang hindi ito pinapalitan ng titulo.
- issue: Panlahatang katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ang pormal at tipanang larawan ng Hebreo, habang malinaw na tumutukoy sa bayang Israel bilang kabuuan.
- issue: Larawan sa בֵּית עֲבָדִים
  choice: bahay ng mga alipin
  alternative: lugar ng pagkaalipin
  rationale: Pinananatili sa pangunahing teksto ang konkretong metapora at pangmaramihang pangngalan ng Hebreo, ngunit kinikilala sa talababa ang natural na kahulugang tumutukoy sa kalagayan o lugar ng pagkaalipin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang “nagsugo,” “nag-ahon,” at “naglabas” upang mapanatili ang kilos at larawan ng Hebreo; iniwasan ang labis na arkaikong pananalita.
