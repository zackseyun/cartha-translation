  text: וַ/יַּ֣רְא גִּדְע֔וֹן כִּֽי מַלְאַ֥ךְ יְהוָ֖ה ה֑וּא וַ/יֹּ֣אמֶר גִּדְע֗וֹן אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי עַל כֵּ֤ן רָאִ֨יתִי֙ מַלְאַ֣ךְ יְהוָ֔ה פָּנִ֖ים אֶל פָּנִֽים־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: tl
  text: Nakita ni Gideon na siya ang anghel ni Yahweh[a], at sinabi ni Gideon, “Ay, Panginoong Yahweh! Sapagkat nakita ko nang mukhaan ang anghel ni Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mensahero ni Yahweh.” Ang salitang Hebreo ay maaaring mangahulugang “anghel” o “mensahero.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Nang makita
  rationale: Pinananatili ang pangunahing diwa ng ראה na ‘makita,’ habang likas na ipinahihiwatig ng kasunod na sugnay na nakilala o napagtanto ni Gideon kung sino ang kausap niya.
- source_word: כִּי
  choice: na
  rationale: Ipinakikilala rito ng כִּי ang nilalaman ng nakita o napagtanto ni Gideon.
- source_word: מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ ng ‘anghel’ o ‘mensahero.’ Ang ‘anghel’ ang pinili dahil supernatural ang sugo sa salaysay, ngunit inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang ‘Yahweh’ sa halip na palitan ito ng titulong ‘PANGINOON.’
- source_word: אֲהָהּ
  choice: Ay
  rationale: Ang ‘Ay’ ay likas na bulalas sa Tagalog na nagpapahayag ng biglang takot o pagkabagabag.
- source_word: אֲדֹנָי יְהוִה
  choice: Panginoong Yahweh
  rationale: Pinananatili nito kapwa ang titulong אֲדֹנָי at ang personal na pangalang יְהוָה sa isang natural na pariralang Tagalog.
- source_word: כִּי עַל כֵּן
  choice: Sapagkat
  rationale: Ipinakikilala ng parirala ang dahilan ng pagkabagabag ni Gideon; malinaw at marangal na katumbas sa Tagalog ang ‘Sapagkat.’
- source_word: רָאִיתִי
  choice: nakita ko
  rationale: Tuwirang katumbas ito ng perpektong anyo ng ראה at angkop sa kagyat na reaksiyon ni Gideon sa katatapos na pangyayari.
- source_word: פָּנִים אֶל פָּנִים
  choice: nang mukhaan
  rationale: Likas itong idyomang Tagalog para sa isang tuwiran at personal na paghaharap, at pinananatili ang larawang ‘mukha sa mukha’ ng Hebreo.
theological_decisions:
- issue: Paglalahad sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Hayagang ginagamit ng tekstong Hebreo ang banal na pangalan; pinananatili ng ‘Yahweh’ ang katangian nito bilang personal na pangalan.
- issue: Pag-unawa sa מַלְאַךְ יְהוָה
  choice: anghel ni Yahweh
  alternative: mensahero ni Yahweh
  rationale: Ang konteksto ay tumutukoy sa isang supernatural na sugo, kaya natural ang ‘anghel’; gayunman, hindi inaalis ang mas malawak na kahulugang ‘mensahero,’ na inilalagay sa talababa.
- issue: Pagkakakilanlan ng anghel ni Yahweh
  choice: Hindi higit na tinutukoy kaysa sa sinasabi ng talata
  alternative: Tahasang ipantay ang anghel kay Yahweh o ituring lamang siyang nilikhang sugo
  rationale: Sinasabi ng talata na nakilala ni Gideon ang kausap bilang anghel ni Yahweh at natakot siyang mamatay dahil nakita niya ito nang mukhaan. Pinananatili ng salin ang tensiyong ito nang hindi nagpapasok ng isang tiyak na doktrinal na paliwanag.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘mukhaan’ bilang maikli at natural na katumbas ng idyomang Hebreo, at ang ‘Ay’ upang maipahayag ang pagkagulat at pangamba ni Gideon nang hindi nagiging labis na kolokyal.
