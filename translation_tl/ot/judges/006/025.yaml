  source_fidelity: 'Tapat ang salin sa pangunahing nilalaman ng Hebrew: ang utos ay ibinigay nang gabing iyon, dalawang toro ang binanggit ayon sa karaniwang pagbasa, ang altar ni Baal na nauugnay sa ama ang gigibain, at ang Asera na “nasa ibabaw nito” ang puputulin. Ang “nasa ibabaw nito” ay malapit sa עָלָיו at ang talababa ay maayos na nag-iingat sa di-ganap na tiyak na ugnayang panlunan.'
