  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה קַ֤ח אֶת פַּר הַ/שּׁוֹר֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וּ/פַ֥ר הַ/שֵּׁנִ֖י שֶׁ֣בַע שָׁנִ֑ים וְ/הָרַסְתָּ֗ אֶת מִזְבַּ֤ח הַ/בַּ֨עַל֙ אֲשֶׁ֣ר לְ/אָבִ֔י/ךָ וְ/אֶת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו תִּכְרֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: tl
  text: Nang gabing iyon, sinabi sa kanya ni Yahweh, “Kunin mo ang toro ng iyong ama at ang ikalawang toro, na pitong taong gulang. Gibain mo ang altar ni Baal na pag-aari ng iyong ama, at putulin mo ang Asera[a] na nasa ibabaw nito[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “poste ni Asera” o “sagradong poste.” Ang salitang Hebrew ay maaaring tumukoy sa isang bagay na pangkulto na kaugnay ni Asherah.
    reason: lexical_alternative
  - marker: b
    text: Literal na “nasa ibabaw nito.” Maaari ring ipahiwatig ng parirala na ang Asera ay nakatayo sa tabi ng altar o malapit at kaugnay nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Nang gabing iyon
  rationale: Likas at malinaw na panimulang pasalaysay sa modernong Tagalog; ipinahihiwatig ng “Nang” ang paglipat sa pangyayaring naganap noong gabing iyon nang hindi gumagamit ng makalumang pormula.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalan at hindi pinapalitan ng isang titulo.
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwirang pautos na natural sa Tagalog.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: ang toro ng iyong ama
  rationale: Malinaw at idiomatikong ipinapahayag ang hayop at ang kaugnayan nito sa ama ni Gideon nang hindi nagdaragdag ng di-tiyak na detalye.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: at ang ikalawang toro, na pitong taong gulang
  rationale: Pinananatili ang karaniwang pagbasa na may ikalawang toro bukod sa una at tuwirang isinasaad ang edad nito.
- source_word: וְהָרַסְתָּ
  choice: Gibain mo
  rationale: Natural at mariing pandiwa para sa ganap na pagsira sa isang altar.
- source_word: מִזְבַּח הַבַּעַל
  choice: ang altar ni Baal
  rationale: Karaniwang Tagalog na anyo ng ugnayang paari para sa altar na nauukol kay Baal.
- source_word: הָאֲשֵׁרָה
  choice: ang Asera
  rationale: Ginagamit ang transliteradong katawagang kultiko upang hindi ipasiya kung ito ay poste, punongkahoy, o ibang sagisag na kaugnay ng diyosang Asherah.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa ibabaw nito
  rationale: Malapit sa karaniwang kahulugan ng Hebrew na עַל, habang inilalagay sa talababa ang posibilidad ng mas maluwag na ugnayang panlunan.
- source_word: תִּכְרֹת
  choice: putulin mo
  rationale: Angkop na pandiwa para sa pagputol o pagpapabagsak sa isang kahoy na bagay na pangkulto.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Pinananatiling pangalan ang tetragrammaton sa halip na palitan ito ng titulong maaaring magkubli sa anyo ng tekstong Hebrew.
- issue: Paglalahad sa הָאֲשֵׁרָה
  choice: Asera
  alternative: poste ni Asera; sagradong poste
  rationale: Hindi tiyak kung ang tinutukoy ay isang poste, punongkahoy, sagisag na kultiko, o bagay na kumakatawan sa diyosa; pinananatili ng transliterasyon ang tunay na kalabuan.
- issue: Ugnayang panlunan ng Asera at ng altar
  choice: nasa ibabaw nito
  alternative: nasa tabi nito; kaugnay nito
  rationale: Sinusunod ng pangunahing teksto ang mas literal na puwersa ng עָלָיו ngunit kinikilalang maaaring tumukoy ang parirala sa malapit na pagkakaugnay, hindi lamang sa eksaktong pagkakapatong.
translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit payak na himig. Ginamit ang “iyong” sa halip na mas kolokyal na “mong” sa ilang parirala upang mapanatili ang dignidad at linaw ng tekstong biblikal; iniwasan ang makalumang “at nangyari” dahil sapat na ang natural na panimulang “Nang gabing iyon.”
