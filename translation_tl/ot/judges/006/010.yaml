  to: At sinabi ko sa inyo, ‘Ako si Yahweh na inyong Diyos. Huwag kayong matakot sa mga diyos ng mga Amoreo, na sa lupain nila kayo naninirahan. Ngunit hindi ninyo pinakinggan ang tinig ko[a].’
