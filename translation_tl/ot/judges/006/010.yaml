base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: tl
  text: At sinabi ko sa inyo, ‘Ako si Yahweh na inyong Diyos. Huwag kayong matakot sa mga diyos ng mga Amoreo, na sa lupain nila kayo naninirahan. Ngunit hindi ninyo pinakinggan ang tinig ko[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “pinakinggan ang tinig ko” ay maaari ring unawain na “sinunod ang tinig ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: At sinabi ko sa inyo
  rationale: Pinananatili ng “At” ang pagpapatuloy ng salaysay, at tuwirang isinasalin ng “sinabi ko sa inyo” ang Qal wayyiqtol ng אמר kasama ang layon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang banal na יהוה sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵיכֶם
  choice: inyong Diyos
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, iisa ang tinutukoy rito—ang Diyos ng Israel—kaya angkop ang isahang “Diyos.”
- source_word: לֹא תִירְאוּ
  choice: Huwag kayong matakot
  rationale: Ang לֹא na may imperfect ay nagpapahayag dito ng pagbabawal; natural at tuwiran itong ipinahahayag sa modernong Tagalog sa pamamagitan ng “Huwag kayong matakot.”
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: sa mga diyos ng mga Amoreo
  rationale: Ang kolektibong isahang katawagang etniko sa Hebreo ay natural na ginagawang maramihan sa Tagalog, at tumutukoy ang parirala sa mga diyos na sinasamba ng mga Amoreo.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: na ang lupain ay tinitirhan ninyo
  rationale: Pinananatili nito ang kaugnayan ng sugnay sa mga Amoreo at ang diwa ng ישב bilang paninirahan sa kanilang lupain.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Ngunit hindi ninyo pinakinggan ang tinig ko
  rationale: Pinananatili ang konkretong idyomang Hebreo na “makinig sa tinig,” habang malinaw pa ring ipinahihiwatig sa konteksto ang hindi pagsunod; ipinapakita ng “Ngunit” ang pagsalungat sa naunang utos.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Kahulugan ng שׁמע בקול
  choice: pinakinggan ang tinig ko
  alternative: sinunod ako; sinunod ang tinig ko
  rationale: Maaaring taglayin ng idyoma ang diwang pagsunod, ngunit pinananatili ng pangunahing teksto ang larawan at tunay na lawak ng ekspresyong Hebreo; nililinaw sa talababa ang alternatibong pagkaunawa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Ginamit ang “kayo” dahil maramihan ang mga anyong Hebreo. Iniwasan ang labis na arkaikong ayos habang pinananatili ang idyomang “tinig ko” upang hindi mawala ang tekstuwal na larawan at ang saklaw nitong maaaring mangahulugang pakikinig o pagsunod.
