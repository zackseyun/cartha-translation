base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: tl
  text: “Huwag ka sanang umalis dito hanggang sa pumunta ako sa iyo at mailabas ko ang aking handog[a] at mailagay iyon sa harap mo.” Sinabi niya, “Mananatili ako hanggang sa bumalik ka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “regalo ko” o “tributo ko.” Malawak ang kahulugan ng salitang Hebreo at maaari itong tumukoy sa isang inihaharap na regalo o, sa ilang konteksto, sa isang handog.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: umalis dito
  rationale: Ang pandiwang מוש kasama ng מִזֶּה ay tumutukoy sa paglayo sa kasalukuyang lugar. Ang “umalis dito” ay malinaw at natural sa makabagong Tagalog.
- source_word: נָא
  choice: sana
  rationale: Ipinahihiwatig ng נָא ang magalang na pakiusap. Sa pariralang “Huwag ka sanang…,” likas na naipapahayag ang magalang at mapakiusap na tono.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: hanggang sa makabalik ako sa iyo
  rationale: Literal itong tumutukoy sa pagdating muli ng nagsasalita sa kausap. Ginamit ang “makabalik” upang maging natural sa konteksto, yamang aalis muna si Gideon at saka muling lalapit sa panauhin.
- source_word: וְהוֹצֵאתִי
  choice: at mailabas ko
  rationale: Ang Hiphil ng יצא ay nangangahulugang maglabas o magdala palabas. Ang “mailabas ko” ay angkop sa pagdadala ni Gideon ng ihahanda niya.
- source_word: מִנְחָתִי
  choice: aking handog
  rationale: Maaaring mangahulugan ang מִנְחָה ng regalo, tributo, o handog. Pinananatili ng “handog” ang posibleng panrelihiyong himig nang hindi ito nililimitahan sa isang tiyak na uri ng hain.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: at mailagay iyon sa harap mo
  rationale: Tuwirang ipinapahayag nito ang paglalagay ng bagay sa presensiya ng kausap at natural itong pakinggan sa Tagalog.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Mananatili ako
  rationale: Bagaman maaaring literal na tumukoy ang ישב sa pag-upo, ang diwa rito ay ang pananatili sa lugar habang hinihintay ang pagbabalik ni Gideon.
- source_word: עַד שׁוּבֶךָ
  choice: hanggang sa bumalik ka
  rationale: Ang infinitive construct na may hulaping panghalip ay likas na isinasalin bilang sugnay na may pandiwa sa Tagalog.
theological_decisions:
- issue: Kahulugan ng מִנְחָה sa inihaharap ni Gideon
  choice: handog
  alternative: regalo; tributo; tiyak na handog na butil
  rationale: Malawak ang saklaw ng salitang Hebreo at nagkakaroon ng panrelihiyong pahiwatig ang pangyayari. Pinananatili ng “handog” ang pahiwatig na iyon ngunit hindi nito ipinapalagay na isa na itong pormal at tiyak na uri ng hain.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “Huwag ka sanang” upang maipahayag ang magalang na pakiusap, at pinanatili ang panghalip sa “Sinabi niya” upang hindi magdagdag ng pagkakakilanlan na hindi tahasang inuulit sa Hebreo.
