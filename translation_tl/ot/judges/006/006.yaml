  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: tl
  text: Dahil sa Midian, lubhang naghirap ang Israel[a], at ang mga Israelita[b] ay dumaing kay Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “lubhang nanghina,” “lubhang ibinaba ang kalagayan,” o “lubhang naghirap.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagiging mahina, salat, o mababa ang kalagayan dahil sa pang-aapi.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak na lalaki ni Israel,” isang karaniwang kolektibong katawagan sa bayan ng Israel.
    reason: lexical_alternative
  - marker: c
    text: 'Hebreo: YHWH, na tradisyonal na isinasaling “ang PANGINOON.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל ... מְאֹד
  choice: lubhang naghirap
  rationale: Ang דל ay nagpapahiwatig ng labis na paghina, pagbaba ng kalagayan, o paghihirap. Sa konteksto ng pananalanta ng Midian, natural na ipinahahayag ng “lubhang naghirap” ang matinding pagkasalat ng Israel nang hindi nililimitahan ang diwa sa pisikal na kahinaan lamang.
- source_word: מִפְּנֵי מִדְיָן
  choice: Dahil sa Midian
  rationale: Ginagamit dito ang מִפְּנֵי upang ipahayag ang sanhi. Ang “dahil sa” ay malinaw at likas sa modernong Filipino.
- source_word: וַיִּזְעֲקוּ
  choice: dumaing
  rationale: Ang זעק ay isang apurahang pagdaing o paghingi ng tulong sa gitna ng kagipitan. Ang “dumaing” ay marangal at natural, at pinananatili ang diwa ng isang sigaw ng paghihirap.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” isa itong karaniwang kolektibong tawag sa buong bayang Israel. Ang “mga Israelita” ang pinakanatural at tumpak na katumbas sa Filipino; inilalagay sa talababa ang literal na anyo.
- source_word: אֶל יְהוָה
  choice: kay Yahweh
  rationale: Tuwirang ipinahahayag ng אֶל ang patutunguhan ng kanilang pagdaing, at pinananatili ng “Yahweh” ang personal na pangalang YHWH.
theological_decisions:
- issue: Paglalarawan sa kalagayan ng Israel sa ilalim ng Midian
  choice: lubhang naghirap
  alternative: lubhang nanghina / lubhang ibinaba ang kalagayan
  rationale: Pinananatili ng salin ang saklaw ng דל sa konteksto ng matinding pagkasalat at pagkaapi. Hindi nito ginagawang eksklusibong espirituwal o militar ang paghina.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: ang PANGINOON
  rationale: Pangngalang pantangi ang YHWH sa tekstong Hebreo. Ang “Yahweh” ay tahasang kumakatawan rito, habang kinikilala sa talababa ang tradisyonal na salin.
- issue: Kolektibong diwa ng בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak na lalaki ni Israel
  rationale: Sa talatang ito, ang parirala ay kolektibong katawagan sa bayan, hindi pahayag na mga lalaking anak lamang ang dumaing. Pinananatili sa talababa ang literal na anyo upang hindi maitago ang porma ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “lubhang naghirap” upang maging natural sa karaniwang mambabasa habang pinananatili sa talababa ang leksikal na lawak ng Hebreo. Ang “dumaing” ay nagpapahayag ng kagipitan at paghingi ng tulong nang hindi nagiging kolokyal.
