base_translation:
  language: en
  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: tl
  text: At binihisan ng Espiritu ni Yahweh si Gideon[a]. Hinipan niya ang tambuli[b], at ipinatawag ang angkan ni Abiezer upang sumunod sa kaniya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “sumakaniya ang Espiritu ni Yahweh”; literal, “binihisan ng Espiritu ni Yahweh si Gideon.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebreo: shofar, isang sungay na hinihipan bilang hudyat.'
    reason: cultural_note
  - marker: c
    text: Literal, “at ipinatawag si Abiezer sa likuran niya.” Ang “Abiezer” ay maaaring tumukoy sa angkan; maaari ring isalin na, “at nagtipon sa likuran niya ang angkan ni Abiezer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: ang Espiritu ni Yahweh
  rationale: Sa kontekstong ito ng pagbibigay-kapangyarihan, ang רוּחַ ay tumutukoy sa Espiritu, hindi sa hangin o hininga. Pinanatili ang pangalang Yahweh para sa יְהוָה.
- source_word: לָבְשָׁה אֶת גִּדְעוֹן
  choice: binihisan ... si Gideon
  rationale: Pinananatili nito ang matingkad na metapora ng Hebreong לָבַשׁ, na literal na nangangahulugang magbihis o magsuot, habang nananatiling malinaw sa Tagalog na ang Espiritu ang kumilos kay Gideon.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: hinipan niya ang tambuli
  rationale: Ang שׁוֹפָר ay sungay na hinihipan bilang hudyat. Ang “tambuli” ay natural at madaling maunawaang katumbas sa Tagalog; nililinaw sa talababa ang katawagang Hebreo.
- source_word: וַיִּזָּעֵק
  choice: tinipon
  rationale: Ang anyong Niphal ay nagpapahiwatig na ipinatawag o nagtipon ang pangkat bilang tugon sa hudyat. Ang pasibong “tinipon” ay angkop sa daloy at hindi labis na tumutukoy sa eksaktong paraan ng pagtitipon.
- source_word: אֲבִיעֶזֶר
  choice: ang angkan ni Abiezer
  rationale: Ginagamit dito ang pangalang Abiezer bilang kolektibong tawag sa angkang nagmula sa kaniya; nilinaw ito sa pangunahing teksto upang maiwasang mapagkamalan na isang tao lamang ang tinawag.
- source_word: אַחֲרָיו
  choice: upang sumunod sa kaniya
  rationale: Ipinahihiwatig ng literal na “sa likuran niya” ang pagtitipon bilang mga tagasunod o tagasuporta ni Gideon.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan sa halip na palitan ito ng titulo.
- issue: Metapora ng pagkilos ng Espiritu kay Gideon
  choice: binihisan ng Espiritu ... si Gideon
  alternative: sumakaniya ang Espiritu
  rationale: Pinananatili ang di-pangkaraniwang metapora ng Hebreo nang hindi ipinapaliwanag kung paano eksaktong nauugnay ang Espiritu kay Gideon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang matingkad na metapora ng Hebreo sa “binihisan,” samantalang nilinaw na ang “Abiezer” ay tumutukoy sa angkan. Ginamit ang “kaniya” para sa pormal ngunit natural na anyo.
