    issue: The main text renders וַיִּזָּעֵק actively as “tinipon.”
    rationale: 'The Hebrew Niphal is passive in this context: Abiezer was summoned/called out, rather than Gideon being directly stated to have gathered them. “Ipinatawag” preserves this distinction.'
  - severity: medium
