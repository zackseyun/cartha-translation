base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: tl
  text: Nagpakita sa kanya ang anghel[a] ni Yahweh at sinabi sa kanya, “Kasama mo si Yahweh, magiting na mandirigma.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sugo.” Ang salitang Hebreo ay maaaring tumukoy sa isang sugo o anghel, ngunit higit na angkop sa tagpong ito ng pagpapakita ang “anghel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “makapangyarihang mandirigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: Nagpakita
  rationale: Ang Niphal ng ראה ay karaniwang nagsasaad ng pagpapakita o pagpapatanaw sa salaysay; natural at tuwiran sa Tagalog ang “nagpakita.”
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugan ang מַלְאָךְ na “sugo” o “anghel,” ngunit higit na angkop sa tagpong ito ng makalangit na pagpapakita ang “anghel.” Pinananatili ang pangalan na Yahweh.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: at sinabi sa kanya
  rationale: Pinananatili ang panghalip ng Hebreo sa halip na idagdag ang pangalang Gideon, at ang “sinabi sa kanya” ay natural sa salaysay.
- source_word: יְהוָה עִמְּךָ
  choice: Kasama mo si Yahweh
  rationale: Ang sugnay na walang tahasang pandiwa ay pinakamalinaw na pahayag na kasalukuyang kasama niya si Yahweh, hindi lamang isang pagbati o hangarin.
- source_word: גִּבּוֹר הֶחָיִל
  choice: makapangyarihang mandirigma
  rationale: Ipinahahayag ng parirala ang isang malakas, matapang, at mahusay na mandirigma. Natural ito sa modernong Tagalog at pinananatili ang puwersang militar ng Hebreo.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulo.
- issue: Pag-unawa sa מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  alternative: ang sugo ni Yahweh
  rationale: Isinasalin ang parirala ayon sa karaniwang kahulugan nito sa tagpong ito nang hindi ipinapasok sa teksto ang mas tiyak na doktrinal na pagkakakilanlan ng anghel.
- issue: Puwersa ng יְהוָה עִמְּךָ
  choice: 'pahayag: “Kasama mo si Yahweh”'
  alternative: 'hangarin o pagbati: “Sumaiyo nawa si Yahweh”'
  rationale: Pinapaboran ng konteksto ang deklarasyon, ngunit kinikilalang maaaring gamitin ang ganitong anyo bilang pagbati sa ibang konteksto.
translation_notes:
  register: Modernong Filipino Tagalog na natural, marangal, at madaling maunawaan. Ginamit ang “si Yahweh” ayon sa karaniwang pagmamarka sa personal na pangalan sa Tagalog. Pinanatili ang pag-uulit ng “sa kanya” mula sa Hebreo at iniwasang pangalanan si Gideon kung hindi siya tahasang binanggit sa talata.
