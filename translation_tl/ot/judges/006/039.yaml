source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: tl
  text: 'Pagkatapos, sinabi ni Gideon sa Diyos, “Huwag mong hayaang mag-alab ang galit mo laban sa akin. Hayaan mong magsalita pa ako nang minsan na lamang. Pakiusap, hayaan mong subukin ko pa nang minsan na lamang sa pamamagitan ng balahibo ng tupa[a]: ang balahibo lamang sana ang matuyo, at magkaroon ng hamog sa buong lupa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang tinutukoy ay ginupit na balahibo o lana ng tupa.
    reason: Nililinaw ang kahulugan ng גִּזָּה, na maaaring hindi ganap na maipahiwatig ng payak na “balahibo.”
  - marker: b
    text: Ang “lupa” rito ay maaari ring isaling “kalupaan”; sa konteksto, tumutukoy ito sa lugar sa paligid ng balahibo.
    reason: Pinananatili ang saklaw at posibleng kahulugan ng הָאָרֶץ nang hindi ipinahihiwatig ang buong daigdig.
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Huwag mong hayaang mag-alab ang galit mo laban sa akin
  rationale: Pinananatili nito ang Hebreong larawang nag-aalab ang galit, ngunit likas at malinaw pa rin sa modernong Tagalog.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: at hayaan mo akong magsalita nang minsan na lamang
  rationale: Ipinahahayag ng cohortative ang magalang na pakiusap ni Gideon na makapagsalita pa nang isang huling pagkakataon.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם
  choice: Nakikiusap ako, subukin ko nang minsan na lamang
  rationale: Ang נסה ay nangangahulugang subukin o tiyakin sa pamamagitan ng pagsubok. Pinananatili ng salin ang tahasang pagkilos ni Gideon nang hindi ito pinapalambot o hinahatulan.
- source_word: בַּגִּזָּה
  choice: sa pamamagitan ng balahibo ng tupa
  rationale: Ipinakikita ng parirala na ang ginupit na lana ang gagamiting kasangkapan o bagay sa pagsubok. Nililinaw ng 'balahibo ng tupa' ang tinutukoy sa natural na Tagalog.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ang balahibo lamang sana ang matuyo
  rationale: Natural na ipinahahayag sa Tagalog ang hinihiling na pagkatuyo, habang pinananatili ng 'lamang' ang eksklusibong diin ng Hebrew.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: at magkaroon naman ng hamog sa buong lupa
  rationale: Sa lokal na paghahambing sa balahibo, ang הָאָרֶץ ay tumutukoy sa lupang nakapaligid dito, hindi kinakailangang sa buong daigdig.
- source_word: הָאֱלֹהִים
  choice: Diyos
  rationale: Bagaman may pantukoy sa Hebrew, tumutukoy ito sa Diyos at likas na walang katumbas na pantukoy sa Tagalog na pagtawag dito.
theological_decisions:
- issue: Ang paulit-ulit na kahilingan ni Gideon na subukin sa pamamagitan ng isa pang tanda
  choice: Isinalin bilang maingat na pakiusap para sa isa pang pagsubok, nang walang idinagdag na pagsang-ayon o paghatol.
  alternative: Maaaring idiin ang kapangahasan ng pagsubok o palambutin ito bilang simpleng paghiling ng katiyakan.
  rationale: Kapuwa makikita sa Hebrew ang pangamba ni Gideon sa galit ng Diyos at ang tahasan niyang paghingi ng isa pang pagsubok. Pinananatili ng salin ang tensiyong ito.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang metapora ng nag-aalab na galit at ang pag-uulit ng “minsan na lamang.” Ginamit ang “nakikiusap ako” upang katawanin ang particle na נָא at ang magalang na tono ng kahilingan.
