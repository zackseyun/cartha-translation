revisions:
- from: 'Pagkatapos, sinabi ni Gideon sa Diyos, “Huwag mong hayaang mag-alab ang galit mo laban sa akin, at hayaan mo akong magsalita nang minsan na lamang. Nakikiusap ako, subukin ko nang minsan na lamang sa pamamagitan ng balahibo ng tupa[a]: ang balahibo lamang sana ang matuyo, at magkaroon naman ng hamog sa buong lupa[b].”'
  to: 'Pagkatapos, sinabi ni Gideon sa Diyos, “Huwag mong hayaang mag-alab ang galit mo laban sa akin. Hayaan mong magsalita pa ako nang minsan na lamang. Pakiusap, hayaan mong subukin ko pa nang minsan na lamang sa pamamagitan ng balahibo ng tupa[a]: ang balahibo lamang sana ang matuyo, at magkaroon ng hamog sa buong lupa[b].”'
  rationale: Pawang estilistikong paglilinaw ang mga pagbabago. Pinananatili ng rebisyon ang Hebreong metapora ng nag-aalab na galit, ang magkahiwalay na “minsang ito lamang” na mga paglilimita, ang maingat na tono ng נָא, at ang lokal na paghahambing ng balahibo at lupang may hamog.
