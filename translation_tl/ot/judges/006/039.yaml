  naturalness: Marangal at nauunawaan ang rehistro, ngunit mas natural ang “magsalita pa ako nang minsan na lamang” kaysa “hayaan mo akong magsalita nang minsan na lamang,” at mas idiomatiko ang “Pakiusap, hayaan mong subukin ko pa...” kaysa sa kasalukuyang ayos.
  terminology: Ang “Diyos,” “galit,” “hamog,” at “balahibo ng tupa” ay angkop. Pinananatili ng talababa ang mas tiyak na diwa ng גִּזָּה bilang ginupit na lana/balahibo ng tupa. Ang “lupa” ay angkop para sa lokal na ibabaw ng lupa sa konteksto.
