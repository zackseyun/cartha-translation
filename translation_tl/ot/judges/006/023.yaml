base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: tl
  text: Ngunit sinabi sa kanya ni Yahweh, “Kapayapaan sa iyo.[a] Huwag kang matakot; hindi ka mamamatay.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Hebreong shalom ay maaari ring magpahiwatig ng mabuting kalagayan o katiyakan, hindi lamang ng kawalan ng alitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sinabi
  rationale: Karaniwang salaysay na anyo ng אמר; natural sa modernong Filipino ang “sinabi.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: שָׁלוֹם לְךָ
  choice: Kapayapaan sa iyo
  rationale: Pinananatili ang maikli at bahagyang malawak na pormulang Hebreo, na maaaring magpahayag ng kapayapaan, mabuting kalagayan, o katiyakan.
- source_word: אַל תִּירָא
  choice: Huwag kang matakot
  rationale: Natural at malinaw na Filipino para sa karaniwang pormula ng pagpapalakas ng loob.
- source_word: לֹא תָּמוּת
  choice: hindi ka mamamatay
  rationale: Tahasang katiyakan tungkol sa hinaharap; likas sa modernong Filipino at pinananatili ang diin ng pahayag.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Saklaw ng kahulugan ng שָׁלוֹם לְךָ
  choice: Kapayapaan sa iyo
  alternative: Mabuti ang kalagayan mo; Huwag kang mabahala
  rationale: Hindi nilulutas nang labis ang pormula bilang simpleng pagbati o katiyakan lamang; pinananatili ang tunay na lawak ng shalom sa pamamagitan ng salin at talababa.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “Ngunit” upang ipakita ang pagtugon na salungat sa takot ni Gideon sa naunang talata. Ang “Kapayapaan sa iyo” ay sadyang maikli upang tularan ang Hebreong pormula at mapanatili ang lawak ng kahulugan nito.
