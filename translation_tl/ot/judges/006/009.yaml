  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: tl
  text: At iniligtas ko kayo mula sa kapangyarihan ng Ehipto at sa kapangyarihan ng lahat ng umaapi sa inyo. Pinalayas ko sila mula sa harapan ninyo at ibinigay ko sa inyo ang kanilang lupain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: iniligtas ko
  rationale: Ang נצל ay tumutukoy sa pagliligtas mula sa panganib o kapangyarihan ng iba. Likas at malinaw sa modernong Tagalog ang “iniligtas ko.”
- source_word: מִיַּד
  choice: mula sa kapangyarihan ng
  rationale: Literal itong “mula sa kamay ng,” isang idyoma para sa kapangyarihan o pamamahala. Mas malinaw at natural sa karaniwang Tagalog ang kahulugang “mula sa kapangyarihan ng.”
- source_word: מִצְרַיִם
  choice: Ehipto
  rationale: Karaniwang anyong Tagalog ng pangalan ng bansa.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: lahat ng umaapi sa inyo
  rationale: Ang participle na לֹחֲצֵי ay tumutukoy sa mga nanggigipit o umaapi. Ang pandiwang parirala ay mas natural sa Tagalog kaysa sa pangngalang “mga mang-aapi.”
- source_word: וָאֲגָרֵשׁ
  choice: itinaboy ko sila
  rationale: Ang גרש ay nangangahulugang magtaboy o magpalayas. Ang “itinaboy” ay malinaw at angkop sa konteksto ng pagpapaalis sa mga naninirahan sa lupain.
- source_word: מִפְּנֵיכֶם
  choice: sa harapan ninyo
  rationale: Pinananatili nito ang kongkretong larawang Hebreo na “mula sa inyong harapan,” habang natural na ipinahihiwatig kasama ng “itinaboy” na pinaalis sila sa daraanan o presensiya ng Israel.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: at ibinigay ko sa inyo ang kanilang lupain
  rationale: Tuwirang inililipat ang pandiwa, di-tuwirang layon, at tuwirang layon sa natural na ayos ng Tagalog.
theological_decisions:
- issue: Ang pagkilos ng Diyos sa pagliligtas sa Israel at pagbibigay ng lupain
  choice: 'Pinanatiling Diyos ang tahasang gumaganap sa tatlong kilos: pagliligtas, pagtataboy, at pagbibigay.'
  alternative: Gumamit ng mga pahayag na hindi tahasang nagsasaad kung sino ang gumawa.
  rationale: Binibigyang-diin ng mga pandiwang Hebreo sa unang panauhan ang tuwirang pagkilos ng PANGINOON. Hindi dinaragdagan o binabawasan ng salin ang diin ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at madaling maunawaan. Isinalin ang idyomang “kamay” ayon sa kahulugan nitong kapangyarihan upang maiwasan ang di-likas na Tagalog, ngunit pinanatili ang spatial na larawan sa “sa harapan ninyo.”
