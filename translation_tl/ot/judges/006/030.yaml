  text: וַ/יֹּ֨אמְר֜וּ אַנְשֵׁ֤י הָ/עִיר֙ אֶל יוֹאָ֔שׁ הוֹצֵ֥א אֶת בִּנְ/ךָ֖ וְ/יָמֹ֑ת כִּ֤י נָתַץ֙ אֶת מִזְבַּ֣ח הַ/בַּ֔עַל וְ/כִ֥י כָרַ֖ת הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: tl
  text: Sinabi ng mga lalaki ng bayan kay Joas, “Ilabas mo ang iyong anak upang mamatay siya, sapagkat giniba niya ang altar ni Baal at pinutol ang Asera[a] na nasa tabi nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “poste ni Asera.” Ang salitang Hebreo ay maaaring tumukoy sa bagay na ginagamit sa pagsamba at iniuugnay kay Asera; sa kontekstong ito, malamang na ang bagay ang tinutukoy, hindi ang diyosa mismo.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: mga lalaki sa bayan
  rationale: Pinananatili ang panlalaking anyo ng Hebreo at ang malamang na pagtukoy sa mga lalaking kumikilos bilang mga mamamayan ng pamayanan; mas natural sa tagpong ito ang “bayan” kaysa “lungsod.”
- source_word: הוֹצֵא
  choice: Ilabas mo
  rationale: Tuwirang ipinahahayag ng causative imperative ang utos na palabasin ang anak ni Joas.
- source_word: וְיָמֹת
  choice: upang mamatay siya
  rationale: Pinananatili ang jussive na resulta o layunin ng utos nang hindi tahasang dinaragdagan ang Hebreo ng “patayin” o ng pormal na wikang panghukuman.
- source_word: נָתַץ
  choice: giniba
  rationale: Ang pandiwa ay karaniwang tumutukoy sa paggiba ng isang estruktura at angkop sa isang altar.
- source_word: מִזְבַּח הַבַּעַל
  choice: altar ni Baal
  rationale: Natural at malinaw na salin ng ugnayang construct sa Hebreo.
- source_word: כָרַת
  choice: pinutol
  rationale: Angkop ito sa pagputol ng punongkahoy o kahoy na bagay na ginagamit sa kulto.
- source_word: הָאֲשֵׁרָה
  choice: ang Asera
  rationale: Pinananatili ang katawagang Hebreo sapagkat maaari itong tumukoy sa diyosa o, gaya ng ipinahihiwatig dito ng pandiwang “pinutol,” sa bagay na pangkultong kaugnay niya.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa tabi nito
  rationale: Maaaring mangahulugan ang עַל ng “sa ibabaw” o “sa tabi/kalapit”; sa ayos ng altar at Asera, malamang na spatial association ang tinutukoy, ngunit hindi ginagawang mas tiyak kaysa kailangan.
theological_decisions:
- issue: Ang tinutukoy ng אֲשֵׁרָה sa konteksto ng pagsamba kay Baal
  choice: ang Asera
  alternative: ang poste ni Asera; ang diyosang si Asera
  rationale: Ipinahihiwatig ng “pinutol” na isang bagay na pangkulto ang tinutukoy, ngunit hindi tahasang sinasabi ng Hebreo na poste iyon. Pinananatili ng transliterasyon ang tunay na leksikal na saklaw, at nililinaw ng talababa ang malamang na kahulugan.
- issue: Lakas ng וְיָמֹת
  choice: upang mamatay siya
  alternative: at hayaan siyang mamatay; dapat siyang mamatay; upang patayin siya
  rationale: Ipinahahayag nito ang hinihinging kamatayan bilang kasunod na layunin o resulta ng utos, nang hindi ipinapasok ang mas tahasang paraan o legal na pormulasyong wala sa Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Joas,” “Baal,” at “Asera” bilang karaniwang anyong Filipino ng mga pangalan. Inilagay ang marker [a] kaagad pagkatapos ng “Asera,” na siyang tinatalakay ng talababa.
