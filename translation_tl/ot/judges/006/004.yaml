  source_fidelity: 'Tapat ang salin sa paulit-ulit na pagsalakay: ang pagkakampo laban sa Israel, pagsira sa ani, lawak hanggang Gaza, at pag-iiwang walang panustos o kabuhayan, kasama ang mga hayop na nakalista. Ang “kahit tupa, baka, o asno” ay natural na paraan upang ipahayag ang negatibong saklaw ng Hebreo.'
