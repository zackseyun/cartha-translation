  text: וַ/יַּחֲנ֣וּ עֲלֵי/הֶ֗ם וַ/יַּשְׁחִ֨יתוּ֙ אֶת יְב֣וּל הָ/אָ֔רֶץ עַד בּוֹאֲ/ךָ֖ עַזָּ֑ה וְ/לֹֽא יַשְׁאִ֤ירוּ מִֽחְיָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/שֶׂ֥ה וָ/שׁ֖וֹר וַ/חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: tl
  text: Nagkakampo sila laban sa mga Israelita at sinisira ang ani ng lupain hanggang sa Gaza.[a] Wala silang iniiwang ikabubuhay sa Israel—kahit tupa, baka, o asno.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “hanggang sa paglapit mo sa Gaza,” isang idyomang tumutukoy sa lawak na naabot patungo sa Gaza.
    reason: lexical_alternative
  - marker: b
    text: O “panustos upang mabuhay.” Ang salitang Hebreo ay maaaring tumukoy sa kabuhayan o anumang kailangan upang manatiling buhay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Nagkakampo sila laban sa mga Israelita
  rationale: Ang חנה ay ‘magkampo,’ at ang עַל dito ay may diwang mapanlaban. Ginamit ang aspektong nagpapahiwatig ng paulit-ulit na kilos sa konteksto; nilinaw ang tinutukoy ng hulaping panghalip bilang mga Israelita.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: sinisira ang ani ng lupain
  rationale: Ang Hiphil ng שׁחת ay ‘sirain’ o ‘wasakin,’ at ang יְבוּל ay bunga, ani, o ani ng lupain. Natural at sapat ang ‘ani ng lupain’ sa Filipino.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: hanggang sa Gaza
  rationale: Ito ay idyomatikong pahayag ng lawak na naabot patungo sa Gaza. Ang ‘hanggang sa Gaza’ ang natural na salin; inilagay sa talababa ang mas literal na anyo.
- source_word: לֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: Wala silang iniiwang ikabubuhay sa Israel
  rationale: Ang מִחְיָה ay tumutukoy sa panustos o paraan upang mabuhay. Pinananatili ng ‘ikabubuhay’ ang lawak nito nang hindi nililimitahan sa pagkain lamang.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: kahit tupa, baka, o asno
  rationale: Ang mga pangngalang isahan ay ginagamit nang kolektibo. Ang ‘baka’ ay mas karaniwan at natural kaysa ‘barakong baka’ o ‘toro’ sa listahang ito, habang ang ‘asno’ ay angkop sa marangal na rehistro.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na natural at marangal. Ginamit ang pangkasalukuyang aspektong Filipino upang ilarawan ang paulit-ulit na pagsalakay sa konteksto. Ang mga panandang talababa [a] at [b] ay kapwa nasa pangunahing teksto.
