  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: tl
  text: Pagkatapos, dumating ang anghel ni Yahweh at naupo sa ilalim ng malaking puno[a] sa Ofra, na pag-aari ni Joas na mula sa angkan ni Abiezer[b]. Samantala, si Gideon na anak niya ay hinahampas ang trigo[c] sa pisaan ng ubas upang maitago ito sa Midian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ensina” o “terebinto.” Hindi tiyak ang eksaktong uri ng malaking punong tinutukoy ng salitang Hebreo.
    reason: lexical_alternative
  - marker: b
    text: O “ang Abiezrita.” Ibig sabihin, kabilang sa angkan ni Abiezer.
    reason: lexical_clarification
  - marker: c
    text: O “ay ginigiik ang trigo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  rationale: Maaaring mangahulugang sugo o anghel ang מַלְאַךְ, ngunit sa salaysay na ito ay pinakanatural ang makalangit na diwa. Pinananatili ang personal na pangalang Yahweh nang hindi nagpapasya sa tiyak na pagkakakilanlan ng tauhan.
- source_word: הָאֵלָה
  choice: malaking puno
  rationale: Hindi lubos na tiyak ang uri ng punong tinutukoy ng אֵלָה; iniiwasan ng pangkalahatang salin ang di-makatwirang katiyakán, habang nasa talababa ang posibleng ensina o terebinto.
- source_word: בְּעָפְרָה
  choice: sa Ofra
  rationale: Isinatinig sa natural na baybay-Tagalog ang pangalan ng lugar.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: na pag-aari ni Joas
  rationale: Tuwirang ipinahahayag ang ugnayang pagmamay-ari sa natural na Tagalog.
- source_word: אֲבִי הָעֶזְרִי
  choice: na mula sa angkan ni Abiezer
  rationale: Ipinapaliwanag nang malinaw sa karaniwang mambabasa ang gentilic bilang pagkakaugnay ni Joas sa angkan ni Abiezer.
- source_word: חֹבֵט חִטִּים
  choice: humahampas ng trigo
  rationale: Konkretong inilalarawan ng חבט ang paghampas upang maihiwalay ang butil at ang ipa, at naaangkop ito sa di-karaniwang paggamit sa pisaan ng ubas.
- source_word: בַּגַּת
  choice: sa pisaan ng ubas
  rationale: Malinaw at likas na salin ng גת, at pinananatili ang tagpuang ginamit bilang kublihan.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: upang maitago iyon mula sa Midian
  rationale: Bagaman literal na may diwang 'palayuin' o 'patakasin,' ipinahihiwatig ng konteksto ang pag-iwas ng trigo sa pagkakita o pagkumpiska ng Midian.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Pinananatili ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- issue: Diwa at pagkakakilanlan ng מַלְאַךְ יְהוָה
  choice: ang anghel ni Yahweh
  alternative: ang sugo ni Yahweh
  rationale: Ipinahihiwatig ng konteksto ang isang makalangit na sugo, ngunit hindi tinutukoy ng salin kung paano siya dapat iugnay ontolohiko kay Yahweh; sa gayon ay napapanatili ang teolohikal na tensiyon ng salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “malaking puno” upang mapanatili ang kawalang-katiyakan sa botanikal na katawagan; inilagay sa talababa ang mga posibleng espesipikong katawagan. Ang “humahampas ng trigo” ay mas konkretong larawan kaysa “ginigiik,” habang ibinigay ang karaniwang terminong iyon bilang alternatibo.
