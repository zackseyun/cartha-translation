  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: tl
  text: At nang dumaing sa Yahweh ang mga anak ni Israel[a] dahil sa Midian[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “ang mga Israelita.” Literal sa Hebreo: “ang mga anak ni Israel.”'
    reason: lexical_alternative
  - marker: b
    text: O “dahil sa mga Midianita” o “tungkol sa Midian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: At nang
  rationale: Ipinakikilala ng וַיְהִי ang kasunod na pangyayari, at temporal ang gamit ng כִּי. Ang “At nang” ang likas na paraan sa modernong Tagalog upang mapanatili ang daloy ng salaysay at maihanda ang pangungusap na nagpapatuloy sa susunod na talata.
- source_word: זָעֲקוּ
  choice: dumaing
  rationale: Ang pandiwa ay tumutukoy sa matinding pagdaing o paghingi ng tulong dahil sa kagipitan. Ang “dumaing” ay natural at nagpapanatili ng bigat ng kanilang pagsusumamo.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang konkretong anyo ng Hebreong parirala habang malinaw na tumutukoy sa sambayanan o mga inapo ni Israel.
- source_word: אֶל יְהוָה
  choice: sa Yahweh
  rationale: Ipinahihiwatig ng אֶל ang taong pinatutungkulan ng pagdaing; natural sa Tagalog ang “dumaing sa.” Pinananatili bilang “Yahweh” ang personal na banal na pangalan.
- source_word: עַל אֹדוֹת
  choice: dahil sa
  rationale: Sa konteksto, ipinapahayag ng parirala ang dahilan ng pagdaing. Ang “dahil sa” ang malinaw at karaniwang katumbas sa Tagalog.
- source_word: מִדְיָן
  choice: Midian
  rationale: Ito ang kinikilalang transliterasyon sa Tagalog ng pangalan ng bayan o pangkat.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginagamit sa Hebreo ang Tetragrammaton. Pinananatili ng “Yahweh” ang pagkakakilanlan nito bilang personal na pangalan nang hindi ito pinapalitan ng titulo.
translation_notes:
  register: Makabago, natural, at marangal ang wika. Ang “At nang” ay sadyang bumubuo ng sugnay na nagpapatuloy sa talata 8, gaya ng sintaks ng Hebreo. Pinanatili ang “mga anak ni Israel” bilang malinaw na katawagan sa buong sambayanan, hindi lamang sa mga lalaking Israelita.
