revisions:
- from: Nagpadala siya ng mga sugo sa buong Manases, at tinawag din ang lipi nito upang sumunod sa kanya. Nagpadala rin siya ng mga sugo sa Aser, Zebulun, at Neftali, at umahon sila upang harapin ang mga iyon.[a]
  to: Nagpadala siya ng mga sugo sa buong Manases, at pati Manases ay tinawag upang sumunod sa kanya. Nagpadala rin siya ng mga sugo sa Aser, Zebulun, at Neftali, at umakyat sila upang salubungin sila.[a]
  rationale: Inalis ang maling pag-aangkin sa “lipi nito,” at pinalitan ang mga salitang maaaring magdagdag ng diwang labanan o maging di-karaniwan sa modernong Filipino. Pinanatili ang maramihang panghalip at ang talababa upang hindi lutasin nang dogmatiko ang hindi tahasang sanggunian sa Hebreo.
