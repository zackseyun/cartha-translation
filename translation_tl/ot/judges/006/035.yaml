  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: tl
  text: Nagpadala siya ng mga sugo sa buong Manases, at pati Manases ay tinawag upang sumunod sa kanya. Nagpadala rin siya ng mga sugo sa Aser, Zebulun, at Neftali, at umakyat sila upang salubungin sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “sila” sa mga hukbong kaaway. Maaari rin itong unawain na tumutukoy kay Gideon at sa kanyang mga kasama. Maramihan ang hulapi sa Hebreo, ngunit hindi tahasang binanggit ang tinutukoy nito.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Sa konteksto ng pagtitipon ng hukbo, tumutukoy ito sa mga taong inutusang maghatid ng panawagan, hindi sa mga anghel.
- source_word: בְּכָל מְנַשֶּׁה
  choice: sa buong Manases
  rationale: Ipinahihiwatig ng parirala na ipinaabot ang panawagan sa buong lipi o nasasakupan ng Manases.
- source_word: וַיִּזָּעֵק גַּם הוּא אַחֲרָיו
  choice: at tinawag din ang lipi nito upang sumunod sa kanya
  rationale: Ang Niphal ay may diwang militar na tinawag o tinipon. Nilinaw ng 'ang lipi nito' na ang panghalip ay tumutukoy sa Manases bilang pangkat, habang pinananatili ng 'sumunod sa kanya' ang diwa ng אַחֲרָיו.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: sa Aser, Zebulun, at Neftali
  rationale: Natural sa Filipino ang 'sa' para sa pagpapadala ng mga sugo sa mga lipi o nasasakupang ito; hindi nito ipinapalagay na indibidwal ang tinutukoy.
- source_word: וַיַּעֲלוּ
  choice: umahon sila
  rationale: Pinananatili ang literal na kilos na 'umakyat/umahon,' na maaari ring magpahiwatig ng pagsulong ng hukbo.
- source_word: לִקְרָאתָם
  choice: upang harapin ang mga iyon
  rationale: Pinananatili ang maramihang hulapi ng Hebreo. Ang 'harapin' ay angkop sa militar na konteksto ngunit hindi tahasang pinapangalanan ang malabong tinutukoy ng panghalip.
theological_decisions:
- issue: Tinutukoy ng maramihang hulapi sa לִקְרָאתָם
  choice: ang mga hukbong kaaway
  alternative: si Gideon kasama ang kanyang mga tauhan
  rationale: Maramihan ang hulapi sa Hebreo ngunit hindi tahasang binabanggit ang antecedent. Mas malamang sa konteksto ang mga hukbong kaaway, subalit pinananatili sa talababa ang tunay na kalabuan.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Ginamit ang 'mga sugo' para sa mga mensaherong tao at 'umahon' upang mapanatili ang larawan ng Hebreong salaysay. Inilagay ang marker [a] sa mismong bahaging may kalabuan.
