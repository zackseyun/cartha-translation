base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: tl
  text: At ang buong Midian, ang Amalek, at ang mga taga-Silangan[a] ay sama-samang nagtipon. Tumawid sila at nagkampo sa Lambak ng Jezreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ng silangan,” isang idyoma para sa mga bayang mula sa silangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: ang buong Midian
  rationale: Pinananatili ang kolektibong pangalan ng bayan sa Hebreo sa halip na tahasang palawakin bilang “lahat ng mga Midianita.” Natural sa salaysay ang “buong Midian” bilang kolektibong puwersa.
- source_word: וַ/עֲמָלֵק
  choice: ang Amalek
  rationale: Ginagamit ang etnonimong “Amalek” sa kolektibong diwa, gaya ng nasa Hebreo, nang hindi ito pinapalawak sa “mga Amalekita.”
- source_word: וּ/בְנֵי קֶדֶם
  choice: ang mga taga-Silangan
  rationale: Ang literal na “mga anak ng silangan” ay isang idyoma para sa mga bayan o pangkat na mula sa silangan. Ang “mga taga-Silangan” ay malinaw at natural sa modernong Filipino.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: ay sama-samang nagtipon
  rationale: Ipinahahayag ng “sama-samang nagtipon” ang diwa ng Niphal ng אסף at ng pang-abay na יחדו sa natural na Filipino.
- source_word: וַ/יַּעַבְרוּ
  choice: Tumawid sila
  rationale: Ang עבר ay nangangahulugang tumawid o dumaan. Hindi tinutukoy ng Hebreo kung ano ang kanilang tinawid, kaya hindi rin ito dinagdagan sa salin.
- source_word: וַֽ/יַּחֲנוּ
  choice: nagkampo
  rationale: Karaniwan at malinaw na modernong Filipino para sa חנה sa konteksto ng pagkilos ng hukbo.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: sa Lambak ng Jezreel
  rationale: Ang עמק ay lambak o kapatagan; “Lambak ng Jezreel” ang natural at nakikilalang heograpikong katawagan.
