id: JDG.6.13
reference: Judges 6:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: tl
  text: Sinabi ni Gideon sa kanya, “Paumanhin po, ginoo[a], pero kung kasama natin si Yahweh, bakit nangyari sa atin ang lahat ng ito? At nasaan ang lahat ng kababalaghan niya[b] na ikinuwento sa atin ng ating mga ninuno? Sinabi nila, ‘Hindi ba inilabas tayo ni Yahweh mula sa Ehipto?’ Ngunit ngayon, pinabayaan tayo ni Yahweh at ibinigay niya tayo sa kamay ng Midian[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Nakikiusap po ako, ginoo.” Ang Hebreo ay isang magalang na paraan ng pakikipag-usap.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mga kamangha-manghang gawa niya” o “mga himala niya.”
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “sa kamay ng Midian,” isang idyomang nangangahulugang nasa kapangyarihan o kontrol ng Midian.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Paumanhin po, ginoo
  rationale: Ang בִּי ay magalang na pakiusap o pambungad, at ang אֲדֹנִי ay magalang na tawag sa kausap. Pinananatili ng salin ang paggalang nang hindi ipinapalagay na banal na titulo ito.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang “Yahweh” ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: pero kung kasama natin si Yahweh
  rationale: Bagaman pormal na nagsisimula sa pangatnig, ang parirala ay gumaganap bilang kondisyong hinahamon ng kasunod na tanong ni Gideon. Ang “pero” ay natural na nagpapakita ng pagtutol sa ipinahihiwatig na pahayag.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: bakit nangyari sa atin ang lahat ng ito?
  rationale: Kapag kapahamakan ang simuno, maaaring mangahulugan ang מצא na sumapit o mangyari sa isang tao. Malinaw at likas sa modernong Tagalog ang “nangyari sa atin.”
- source_word: נִפְלְאֹתָיו
  choice: mga kababalaghan niya
  rationale: Tumutukoy ito sa pambihirang mga gawa ng Diyos na pumupukaw ng pagkamangha. Hindi nito labis na nililimitahan ang kahulugan sa salitang “mga himala.”
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: ikinuwento sa atin ng ating mga ninuno
  rationale: Ang סִפֵּר ay “magkuwento” o “magsalaysay.” Ang “mga ninuno” ay natural na tawag sa mga naunang salinlahing nagpasa ng kasaysayan ng Israel; iniiwasan nito ang di-likas na “mga ama natin” sa kontekstong ito.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Hindi ba inilabas tayo ni Yahweh mula sa Ehipto?
  rationale: Ang tanong ay umaasang sasang-ayon ang kausap. Ang “inilabas ... mula sa Ehipto” ay malinaw na tumutukoy sa Exodo nang hindi nagdaragdag ng paliwanag.
- source_word: נְטָשָׁנוּ
  choice: pinabayaan tayo
  rationale: Ipinahahayag ng pandiwa ang pag-iwan o pagpapabaya. Karaniwan, malinaw, at may sapat na bigat ang “pinabayaan” sa Tagalog.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: ibinigay sa kamay ng Midian
  rationale: Pinananatili nito ang larawang Hebreo ng “kamay,” na nangangahulugang kapangyarihan o kontrol, habang ipinapaliwanag ang idyoma sa talababa.
- source_word: מִדְיָן
  choice: Midian
  rationale: Karaniwang transliterasyon sa Tagalog ng pangalan ng bayan o pangkat.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulo.
- issue: Tinutukoy ng אֲדֹנִי sa pagbati ni Gideon
  choice: 'magalang na tawag sa kausap: “ginoo”'
  alternative: banal na titulong “Panginoon”
  rationale: Sa mismong pangungusap, maaaring unawain ito bilang magalang na pakikipag-usap ni Gideon sa mensahero. Hindi dapat maagang ipasiya ng malaking titik o banal na titulo ang pagkakakilanlan ng kausap.
- issue: Kondisyonal na puwersa ng וְיֵשׁ יְהוָה עִמָּנוּ
  choice: “kung kasama natin si Yahweh”
  alternative: “at kasama natin si Yahweh” o “yamang kasama natin si Yahweh”
  rationale: Ipinakikita ng retorikal na tanong at reklamo ni Gideon na hinahamon niya ang nasabing saligan. Ang “kung” ay natural na pinananatili ang tensiyon sa halip na ipahayag itong tiyak na paninindigan ni Gideon.
translation_notes:
  register: Modernong Filipino Tagalog na magalang at marangal ngunit madaling maunawaan. Ginamit ang “po” upang ihatid ang deferensiya ng pagbati, “mga ninuno” para sa likas na pagtukoy sa mga naunang salinlahi, at pinanatili ang Hebreong larawang “sa kamay ng Midian” na may paliwanag sa talababa.
