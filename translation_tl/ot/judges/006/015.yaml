base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: tl
  text: Ngunit sinabi ni Gideon sa kanya, “Pakiusap po, panginoon ko, paano ko maililigtas ang Israel? Narito, ang angkan ko[a] ang pinakamahina[b] sa Manases, at ako ang pinakabata[c] sa sambahayan ng aking ama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pangkat ng aking pamilya” (literal, “aking libo”); ang salitang Hebreo ay maaaring tumukoy sa isang yunit ng angkan.
    reason: lexical_alternative
  - marker: b
    text: O “pinakadukha” o “pinakamababa ang kalagayan.”
    reason: lexical_alternative
  - marker: c
    text: O “pinakamababa ang katayuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Paumanhin po
  rationale: Magalang na pakiusap ang gamit ng katagang ito sa konteksto, hindi literal na panandang panlunan. Likas sa makabagong Tagalog ang “Paumanhin po” at naipapakita nito ang mapagpakumbabang paglapit ni Gideon.
- source_word: אֲדֹנָי
  choice: panginoon ko
  rationale: Magalang na tawag ito sa kausap. Ginamit ang maliit na titik upang mapanatili ang salaysay na hindi pa tahasang nililinaw sa puntong ito kung kinikilala ni Gideon ang kausap bilang Diyos.
- source_word: בַּמָּה
  choice: paano ko
  rationale: Sa konteksto, itinatanong nito kung sa anong paraan o sa anong kakayahan niya maisasagawa ang pagliligtas. “Paano ko” ang natural na katumbas sa Tagalog.
- source_word: אוֹשִׁיעַ
  choice: maililigtas
  rationale: Ang Hiphil ng יָשַׁע ay nangangahulugang magligtas o magpalaya. Ang “maililigtas” ay malinaw at karaniwang gamit sa Tagalog.
- source_word: הִנֵּה
  choice: Tingnan mo
  rationale: Pantawag-pansin ito sa paliwanag na kasunod. Pinananatili ng “Tingnan mo” ang puwersang demonstratibo nang hindi gumagamit ng makalumang pananalita.
- source_word: אַלְפִּי
  choice: ang angkan ko
  rationale: Bagaman kaugnay sa literal na “libo,” maaari itong tumukoy sa isang angkan o yunit sa loob ng lipi. “Angkan” ang malinaw na panlipunang kahulugan dito.
- source_word: הַדַּל
  choice: ang pinakamahina
  rationale: Maaaring mangahulugan ang דַּל ng mahina, dukha, o mababa ang kalagayan. Sa pahayag ni Gideon tungkol sa kakayahan at katayuan ng kanyang angkan, ang “pinakamahina” ang pinakamalapit na katumbas habang inilalagay sa talababa ang ibang posibilidad.
- source_word: בִּמְנַשֶּׁה
  choice: sa Manases
  rationale: Tuwirang pagtukoy ito sa lipi ni Manases; ginamit ang nakaugaliang anyo ng pangalan sa Tagalog.
- source_word: הַצָּעִיר
  choice: ang pinakabata
  rationale: Maaari itong mangahulugang bata, maliit, o mababa ang katayuan. Sa loob ng sambahayan ng ama, “pinakabata” ang pinakanatural na kahulugang pampamilya, samantalang inilalahad sa talababa ang alternatibo.
- source_word: בְּבֵית אָבִי
  choice: sa sambahayan ng aking ama
  rationale: Tumutukoy ang Hebreong idyoma sa sambahayan o yunit ng pamilyang pinamumunuan ng ama. Mas malinaw sa modernong Tagalog ang “sambahayan” kaysa sa literal na “bahay.”
theological_decisions:
- issue: Diwa ng אֲדֹנָי sa pagtawag ni Gideon
  choice: Ibinigay bilang magalang na “panginoon ko,” na may maliit na titik
  alternative: “Panginoon ko,” bilang tahasang banal na titulo
  rationale: Sa bahaging ito ng salaysay, magalang na nakikipag-usap si Gideon habang hindi pa ganap na nililinaw ang pagkakakilanlan ng kausap. Pinananatili ng maliit na titik ang teolohikal at pasalaysay na tensiyon sa halip na agad itong lutasin.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “po” upang ihatid ang paggalang sa pakiusap ni Gideon. Pinanatili ang “panginoon ko” sa maliit na titik upang huwag unahan ang unti-unting paglilinaw ng salaysay. Inilipat ang mga pananda ng talababa sa mga salitang aktuwal nilang ipinapaliwanag.
