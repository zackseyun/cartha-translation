revisions:
- from: Kaya kumuha si Gideon ng sampung lalaki mula sa kanyang mga lingkod at ginawa ang iniutos sa kanya ni Yahweh. Ngunit dahil natatakot siya sa sambahayan ng kanyang ama at sa mga lalaki sa lungsod kaya hindi niya magawa iyon sa araw[a], ginawa niya iyon sa gabi.
  to: Kumuha si Gideon ng sampung lalaki mula sa kanyang mga lingkod at ginawa niya ang sinabi sa kanya ni Yahweh. Ngunit dahil natatakot siya sa sambahayan ng kanyang ama at sa mga lalaki ng lungsod, hindi niya ito ginawa sa araw[a]; ginawa niya ito sa gabi.
  rationale: Inihanay ang salin nang mas malapit sa pandiwang Hebreo para sa “nagsalita/sinabi,” inalis ang di-kinakailangang inferensiya sa pambungad, at pinasimple ang sanhi-bungang pangungusap. Pinanatili ang malinaw na kaibahan ng araw at gabi, gayundin ang pangalan ni Yahweh at ang panlalaking “mga lalaki.”
