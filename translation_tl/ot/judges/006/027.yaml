  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: tl
  text: Kumuha si Gideon ng sampung lalaki mula sa kanyang mga lingkod at ginawa niya ang sinabi sa kanya ni Yahweh. Ngunit dahil natatakot siya sa sambahayan ng kanyang ama at sa mga lalaki ng lungsod, hindi niya ito ginawa sa araw[a]; ginawa niya ito sa gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “mula sa paggawa nito sa araw.” Ipinahihiwatig ng parirala na ang kanyang takot ang pumigil sa kanya na gawin iyon sa araw.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: kumuha
  rationale: Karaniwang salaysay na gamit ng לקח ang ‘kumuha’; tuwiran at natural ito sa konteksto.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: sampung lalaki
  rationale: Tahasang panlalaki ang Hebreo, kaya pinanatili ang ‘lalaki.’
- source_word: מֵעֲבָדָיו
  choice: mula sa kanyang mga lingkod
  rationale: Maaaring mangahulugan ang עֶבֶד na lingkod o alipin. Hindi binibigyang-diin dito ang legal na kalagayang pagkaalipin; ipinahihiwatig ng מִן na pumili siya mula sa pangkat ng kanyang mga lingkod.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: ginawa ang iniutos sa kanya ni Yahweh
  rationale: Likas sa modernong Tagalog ang ‘iniutos’ sa kontekstong ito at malinaw na ipinapahayag ang pagsunod ni Gideon sa sinabi sa kanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang ipinahahayag ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ngunit dahil
  rationale: Natural na inilalahad nito ang paliwanag sa kilos ni Gideon at ang pagliko ng salaysay, nang hindi isinasalin nang mekanikal ang pambungad na pormula.
- source_word: יָרֵא
  choice: natatakot
  rationale: Tumutukoy dito ang pandiwa sa takot ni Gideon sa mga tao; ang ‘natatakot’ ay karaniwan at malinaw.
- source_word: בֵּית אָבִיו
  choice: sambahayan ng kanyang ama
  rationale: Ang ‘sambahayan’ ay tumutukoy sa buong yunit panlipunan ng ama, hindi lamang sa gusali o sa nuklear na pamilya.
- source_word: אַנְשֵׁי הָעִיר
  choice: mga lalaki sa lungsod
  rationale: Pinananatili nito ang tahasang ‘mga lalaki’ ng Hebreo; ang ‘lungsod’ ay tuwirang katumbas ng עִיר.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: kaya hindi niya magawa iyon sa araw
  rationale: Ipinahahayag nito sa natural na Tagalog ang diwa ng paghadlang o pag-iwas na dala ng takot, habang inilalagay sa talababa ang mas literal na anyo.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: ginawa niya iyon sa gabi
  rationale: Natural na Tagalog ito at malinaw na kasalungat ng paggawa sa araw.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova; PANGINOON
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Pinananatili ng ‘Yahweh’ ang transliterasyon ng pangalan sa halip na palitan ito ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Ginamit ang ‘sambahayan’ para sa yunit panlipunan at ‘mga lingkod’ nang hindi tiyak na ipinapalagay ang legal na pagkaalipin. Pinanatili ang pangalang Yahweh at ang panlalaking pagtukoy sa אַנְשֵׁי.
