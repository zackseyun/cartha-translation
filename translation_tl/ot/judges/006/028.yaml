id: JDG.6.28
reference: Judges 6:28
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: tl
  text: Maagang bumangon kinaumagahan ang mga lalaki ng lungsod, at nakita nila na giniba na ang altar ni Baal, pinutol na ang Ashera[a] na nasa ibabaw nito, at inihandog na ang ikalawang toro sa altar na itinayo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “poste ng Ashera” o “sagradong poste.” Hebreo: “ang Ashera.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ ... בַּבֹּקֶר
  choice: Kinaumagahan, maagang bumangon
  rationale: Pinananatili ang diin ng Hebreo sa maagang pagbangon habang gumagamit ng likas na ayos sa makabagong Tagalog.
- source_word: אַנְשֵׁי הָעִיר
  choice: ang mga lalaki sa lungsod
  rationale: Tiyak na panlalaki ang anyong Hebreo, kaya hindi ito ginawang pangkalahatang “mga tao.”
- source_word: וְהִנֵּה
  choice: at nakita nilang
  rationale: Ipinahahayag ang biglaang pagkatuklas na dala ng הִנֵּה sa natural na paraang pasalaysay sa Tagalog.
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: giniba na ang altar ni Baal
  rationale: Ang נתץ ay tumutukoy sa paggiba o pagbuwag ng isang gusali o altar; likas at malinaw ang “giniba.”
- source_word: הָאֲשֵׁרָה
  choice: ang Ashera
  rationale: Pinanatili ang pangalan/terminong Hebreo upang hindi ipalagay sa pangunahing teksto na isa lamang itong poste; ipinaliwanag sa talababa ang posibleng tinutukoy.
- source_word: אֲשֶׁר עָלָיו
  choice: na nasa tabi nito
  rationale: Bagaman karaniwang nangangahulugang “nasa ibabaw nito” ang parirala, maaari nitong tukuyin dito ang kultikong bagay na nakapuwesto sa tabi o kaugnay ng altar. Inilagay sa talababa ang mas literal na pagbasa.
- source_word: כֹּרָתָה
  choice: pinutol na
  rationale: Ang כרת ay angkop na tumutukoy sa pagputol o pagpatumba sa isang bagay na kahoy.
- source_word: הַפָּר הַשֵּׁנִי
  choice: ang ikalawang toro
  rationale: Tuwirang ipinapakita ang pagkakaugnay nito sa naunang tagubilin tungkol sa pangalawang toro.
- source_word: הֹעֲלָה
  choice: inihandog na
  rationale: Sa kontekstong panghain, ipinahahayag ng Hophal ng עלה ang pagpapaakyat o paghahandog ng hayop; hindi dinaragdagan sa mismong talata ang detalyeng “sinunog.”
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: ang altar na itinayo
  rationale: Natural na Tagalog para sa pasibong participle na tumutukoy sa altar na naitayo na sa naunang pangyayari.
theological_decisions:
- issue: Kahulugan ng אֲשֵׁרָה
  choice: Ashera
  alternative: poste ng Ashera; sagradong poste
  rationale: Maaaring tukuyin ng salita ang diyosa, ang kaniyang kultikong sagisag, o isang bagay na kahoy na kaugnay niya. Pinananatili ng transliterasyon ang lawak ng posibleng kahulugan.
- issue: Kahulugan ng עָלָיו kaugnay ng Ashera
  choice: nasa tabi nito
  alternative: nasa ibabaw nito
  rationale: Maaaring ipahiwatig ng עַל ang pisikal na kinalalagyan sa ibabaw, ngunit sa ganitong kultikong tagpo maaari rin itong magpahiwatig ng pagkakalagay sa tabi o kaugnay ng altar. Hindi itinago ang literal na pagbasa at inilagay ito sa talababa.
- issue: Uri ng paghahandog sa הֹעֲלָה
  choice: inihandog na
  alternative: sinunog bilang handog
  rationale: Ipinahihiwatig ng konteksto ang handog na sinusunog, ngunit ang salin sa pangunahing teksto ay nananatiling malapit sa pandiwa at umiiwas sa hindi kailangang pagpapalawak.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “altar,” “toro,” at “inihandog,” na karaniwan at madaling maunawaan sa salaysay na biblikal. Inilagay ang dalawang marka ng talababa sa mismong mga pariralang kanilang nililinaw.
