  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: tl
  text: At ginawa iyon ng Diyos nang gabing iyon, at ang balahibo ng tupa lamang ang tuyo, at may hamog sa buong lupa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sa buong lupain.” Ang salitang Hebreo na אֶרֶץ ay maaaring mangahulugang “lupa,” “lupain,” o “daigdig”; sa tagpong ito, pinakamalamang na tumutukoy ito sa lupang nakapaligid sa balahibo ng tupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: At ginawa iyon ng Diyos
  rationale: Ang כֵּן ay tumutukoy sa palatandaang hiniling ni Gideon sa naunang talata. Likas sa modernong Filipino ang “ginawa iyon” at napapanatili nito ang maikli at tuwirang daloy ng Hebreo.
- source_word: בַּלַּיְלָה הַהוּא
  choice: nang gabing iyon
  rationale: Natural na katumbas sa Filipino na nagpapanatili sa tiyak na pagtukoy sa gabing iyon.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: ang balahibo lamang ang tuyo
  rationale: Bagaman pangngalan ang חֹרֶב (“pagkatuyo”), mas natural at malinaw sa Filipino ang panaguring “tuyo.” Ang “lamang” ay nagpapanatili sa eksklusibong diwa ng לְבַדָּהּ. Sa konteksto, ang גִּזָּה ay ginupit na balahibo ng tupa.
- source_word: וְעַל כָּל הָאָרֶץ הָיָה טָל
  choice: samantalang may hamog sa buong lupa
  rationale: Ipinakikita ng “samantalang” ang malinaw na paghahambing sa tuyong balahibo. Ang אֶרֶץ ay tumutukoy rito sa lupang nakapaligid sa balahibo, at ang טָל ay tuwirang isinaling “hamog.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na tuwiran, marangal, at madaling maunawaan. Ginamit ang “balahibo” ayon sa agarang konteksto ng ginupit na balahibo ng tupa; iniwasan ang mas teknikal o hindi karaniwang katawagan. Ginamit ang tutuldok upang natural na ipakilala ang kinalabasan ng ginawa ng Diyos, habang nananatili ang ugnayang pasalaysay ng mga sugnay.
