base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: tl
  text: At gayon nga ang nangyari. Kinabukasan, maaga siyang bumangon, pinisil niya ang balahibo[a], at nagpiga siya ng hamog mula sa balahibo—isang mangkok na punô ng tubig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “diniinan ang balahibo” o “piniga ang balahibo.” Magkasunod na gumamit ang Hebreo ng dalawang pandiwa upang ilarawan ang pagpisil sa balahibo at ang pagkuha ng hamog mula rito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: At gayon nga ang nangyari
  rationale: Likas na pahayag sa modernong Tagalog na nagpapatunay na naganap ang hiniling na tanda, habang nananatiling malapit sa Hebreong pagkakasunod.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: Kinabukasan, maaga siyang bumangon
  rationale: Tumpak na ipinahahayag ang maagang pagbangon sa sumunod na araw sa malinaw at karaniwang Tagalog.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: pinisil niya ang balahibo
  rationale: Ipinahahayag ng “pinisil” ang pagdiin o pagkompres sa balahibo nang hindi pa ganap na inuulit ang pagkuha ng likido na tahasang sinasabi ng kasunod na pandiwa.
- source_word: וַיִּמֶץ טַל
  choice: Piniga niya ... ang hamog
  rationale: Ang “piniga” ay natural na paglalarawan ng pagkuha o pagpapatulo ng likido mula sa basang balahibo at pinananatili ang ikalawang kilos sa Hebreo.
- source_word: מִן־הַגִּזָּה
  choice: mula sa balahibo
  rationale: Direkta at neutral na pahayag ng pinagmulan ng hamog.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: isang mangkok na punô ng tubig
  rationale: Natural na Tagalog para sa daming sapat upang mapuno ang isang mangkok; malinaw nitong naihahatid ang diwa ng sukat o dami.
- source_word: הַסֵּפֶל
  choice: mangkok
  rationale: Karaniwan at madaling maunawaang tawag sa sisidlang tinutukoy; hindi ipinapalagay ang napakaliit na “tasa” o ang mas malaking “palanggana.”
