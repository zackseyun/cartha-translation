  terminology: Ang “balahibo” ay katanggap-tanggap na modernong katumbas ng גִּזָּה sa kontekstong ito. Pinanatili ang “mangkok na punô ng tubig” para sa daming sapat upang mapuno ang sisidlan, nang hindi labis na itinatakda ang eksaktong uri o laki ng sisidlan.
