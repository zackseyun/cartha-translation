  source_fidelity: 'Tumpak na naihahatid ng draft ang pagpapatunay na naganap ang tanda, ang maagang pagbangon kinabukasan, at ang dami ng tubig na katumbas ng isang punông mangkok. Gayunman, ang “Piniga niya mula sa balahibo ang hamog” ay medyo pilit ang ayos at maaaring magmukhang ang hamog mismo ang pinipiga, sa halip na kinukuha sa pamamagitan ng pagpiga. Ang binagong anyo ay mas malinaw na ipinapakita ang dalawang magkasunod na pandiwa sa Hebreo: pagpiga/pagdiin sa balahibo at pagkuha ng hamog mula rito.'
