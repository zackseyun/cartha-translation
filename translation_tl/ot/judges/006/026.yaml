  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: tl
  text: Pagkatapos, magtayo ka ng altar para kay Yahweh na iyong Diyos sa tuktok ng moog na ito, sa wastong pagkakaayos. Kunin mo ang ikalawang toro at ihandog iyon bilang handog na sinusunog, gamit na panggatong ang kahoy ng Ashera[a] na puputulin mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “kahoy ng poste ni Ashera.” Maaaring tumukoy ang salitang Hebreo sa isang kultikong bagay na yari sa kahoy at kaugnay ni Ashera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Pagkatapos, magtayo ka
  rationale: Ang Qal perfect 2ms na may pang-ugnay ay bahagi ng sunod-sunod na tagubilin. Ang “Pagkatapos” at pautos na “magtayo ka” ay likas sa Filipino at malinaw na ipinapakita ang pagkakasunod-sunod.
- source_word: מִזְבֵּחַ
  choice: altar
  rationale: Karaniwang salitang Filipino para sa estrukturang pinaghahandugan; malinaw at malawak na nauunawaan.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: para kay Yahweh na iyong Diyos
  rationale: Pinananatili ang personal na pangalang יהוה bilang “Yahweh” at ang tahasang ugnayang “iyong Diyos.” Ang ל ay likas na ipinahahayag dito ng “para kay.”
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: sa tuktok ng moog na ito
  rationale: Ang רֹאשׁ ay “tuktok,” at ang מָעוֹז ay isang matibay o tanggulang lugar. Ang “moog” ay maikli, marangal, at hindi nagpapalagay ng mas tiyak na anyo kaysa sa Hebreo.
- source_word: בַּמַּעֲרָכָה
  choice: sa wastong pagkakaayos
  rationale: Pinananatili ang diwa ng kaayusan o maayos na paghahanda nang hindi tinutukoy kung bato, kahoy, o ibang bagay ang inaayos.
- source_word: הַפָּר הַשֵּׁנִי
  choice: ang ikalawang toro
  rationale: Tuwirang pinananatili ang “ikalawa,” na tumutukoy sa pagkakaiba nito sa naunang toro sa konteksto; hindi idinaragdag ang “batang” dahil hindi iyon kinakailangan ng pangngalan.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: ihandog iyon bilang handog na sinusunog
  rationale: Likas na salin ng teknikal na idyomang pansakripisyo; pinananatili ang uri ng handog bilang lubos na sinusunog.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה
  choice: gamit na panggatong ang kahoy ng Ashera
  rationale: Ang בְּ ay instrumental sa konteksto, kaya malinaw ang “gamit na panggatong.” Pinananatili ang “Ashera” upang hindi tahasang ipasiya kung poste, punong kultiko, o imaheng kahoy ang tinutukoy.
- source_word: אֲשֶׁר תִּכְרֹת
  choice: na puputulin mo
  rationale: Ipinapahayag ang Qal imperfect 2ms sa konteksto ng tagubilin bilang kilos na gagawin pa lamang.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Ginagamit ng talata ang Tetragrammaton bilang personal na pangalan. Ang “Yahweh” ay nagpapanatili sa pangalang tipan nang hindi ito pinapalitan ng titulo.
- issue: Kahulugan ng אֲשֵׁרָה
  choice: Ashera
  alternative: poste ni Ashera; imaheng kahoy ni Ashera
  rationale: Maaaring tumukoy ang salita sa isang kultikong bagay na kaugnay ng diyosang si Ashera, ngunit pinagtatalunan ang eksaktong pisikal na anyo nito. Pinananatili ng pangunahing teksto ang tunay na kalabuan at inilalagay sa talababa ang karaniwang mas tiyak na pagbasa.
translation_notes:
  register: Modernong Filipino na may marangal ngunit madaling maunawaang himig. Ginamit ang “altar,” “moog,” at “handog na sinusunog” bilang malinaw na mga terminong biblikal. Inilagay ang panandang [a] pagkatapos ng “Ashera,” sapagkat ang talababa ay nagpapaliwanag sa אֲשֵׁרָה, hindi sa “moog.”
