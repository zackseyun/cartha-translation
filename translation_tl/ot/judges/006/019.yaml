revisions:
- from: Pumasok si Gideon at naghanda ng isang batang kambing at mga tinapay na walang pampaalsa mula sa isang efa ng harina.[a] Inilagay niya ang karne sa isang basket at ang sabaw sa isang palayok. Pagkatapos, dinala niya ang mga ito sa lalaki sa ilalim ng puno ng terebinto[b] at inihain sa kanya.[c]
  to: Pumasok si Gideon at naghanda ng isang batang kambing at mga tinapay na walang lebadura mula sa isang efa ng harina.[a] Inilagay niya ang karne sa isang basket at ang sabaw sa isang palayok. Dinala niya ang mga ito sa kanya sa ilalim ng puno ng terebinto[b] at iniharap sa kanya.[c]
  rationale: Pinalitan ang “walang pampaalsa” ng “walang lebadura” upang mas eksaktong maipahayag ang מַצּוֹת. Inalis ang di-kailangang “sa lalaki,” at ginawang “iniharap” ang huling pandiwa upang mapanatili ang neutral na diwa ng וַיַּגַּשׁ (“inilapit/iniharap”) nang walang ipinapasok na sakripisyal na interpretasyon. Napanatili ang mga talababa at ang kanilang mga angkla.
