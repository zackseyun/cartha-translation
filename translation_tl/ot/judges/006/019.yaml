base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: tl
  text: Pumasok si Gideon at naghanda ng isang batang kambing at mga tinapay na walang lebadura mula sa isang efa ng harina.[a] Inilagay niya ang karne sa isang basket at ang sabaw sa isang palayok. Dinala niya ang mga ito sa kanya sa ilalim ng puno ng terebinto[b] at iniharap sa kanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang isang efa ay sinaunang takal ng tuyong sangkap; hindi tiyak ang eksaktong katumbas nito, ngunit malamang na humigit-kumulang 20–22 litro.
    reason: cultural_measure
  - marker: b
    text: O “puno ng ensina.” Malamang na terebinto ang tinutukoy ng salitang Hebreo, bagaman tradisyonal din itong isinasaling ensina.
    reason: lexical_alternative
  - marker: c
    text: O “inilapit sa kanya” o “inilagay sa harap niya.” Ang pandiwang Hebreo ay nangangahulugang maglapit o magharap.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: pumasok
  rationale: Sa konteksto, umalis muna si Gideon sa kinaroroonan ng bisita upang maghanda ng pagkain. Ang “pumasok” ay likas na nagpapahiwatig ng pagpasok niya sa bahay o lugar ng paghahanda.
- source_word: וַיַּעַשׂ
  choice: naghanda
  rationale: Sa konteksto ng pagkain, mas natural sa modernong Tagalog ang “naghanda” kaysa sa literal na “gumawa.”
- source_word: גְּדִי עִזִּים
  choice: isang batang kambing
  rationale: Tuwirang tumutukoy ang parirala sa isang anak o batang kambing; malinaw at natural ang napiling salin.
- source_word: אֵיפַת קֶמַח
  choice: isang efa ng harina
  rationale: Pinanatili ang tiyak na sinaunang takal na “efa” sa halip na gawing pangkalahatang “isang takal,” at ipinaliwanag ito sa talababa.
- source_word: מַצּוֹת
  choice: mga tinapay na walang pampaalsa
  rationale: Malinaw nitong ipinahahayag na tinapay ang inihanda nang walang lebadura o pampaalsa, nang hindi ipinapalagay ang eksaktong hugis ng mga ito.
- source_word: הַבָּשָׂר
  choice: ang karne
  rationale: Ito ang natural na katumbas sa konteksto ng pagkaing inihanda.
- source_word: סַּל
  choice: basket
  rationale: Karaniwan at madaling maunawaang salita ito sa modernong Filipino para sa sisidlang tinutukoy.
- source_word: הַמָּרַק
  choice: ang sabaw
  rationale: Ang salita ay tumutukoy sa sabaw o likidong nalikha sa pagluluto; “sabaw” ang pinakanatural na katumbas.
- source_word: פָּרוּר
  choice: palayok
  rationale: Ang tinutukoy ay isang sisidlang ginagamit sa pagluluto o paglalagyan ng sabaw; akma at natural ang “palayok.”
- source_word: וַיּוֹצֵא אֵלָיו
  choice: dinala niya ang mga ito sa lalaki
  rationale: Bagaman isahan ang pandiwang Hebreo, sama-samang tinutukoy ng “mga ito” ang karne at sabaw. Nilinaw rin ng “sa lalaki” ang reperente ng panghalip sa natural na Tagalog.
- source_word: תַּחַת הָאֵלָה
  choice: sa ilalim ng puno ng terebinto
  rationale: Malamang na terebinto ang punong tinutukoy ng אֵלָה, bagaman tradisyonal din itong isinasaling ensina.
- source_word: וַיַּגַּשׁ
  choice: inihain sa kanya
  rationale: Ipinahahayag nito ang paglalapit o pagharap ng pagkain sa bisita sa konteksto ng pagtanggap sa panauhin, nang hindi tahasang ginagawa itong handog na hain.
theological_decisions:
- issue: Posibleng pahiwatig na sakripisyo ang ginawa ni Gideon
  choice: Gumamit ng wika ng paghahain ng pagkain sa panauhin, hindi ng tahasang paghahandog bilang sakripisyo
  alternative: inihandog niya ang mga ito bilang sakripisyo
  rationale: Inilalarawan ng talata ang paghahanda, pagdadala, at paglalapit ng pagkain. Nagkakaroon ng sakripisyal na pahiwatig ang kasunod na pangyayari, ngunit hindi tahasang sinasabi rito na naghandog na si Gideon ng sakripisyo. Pinananatili ng salin ang tensiyong iyon.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal ang tono. Ginamit ang pamilyar na “basket” sa halip na mas pormal ngunit hindi gaanong natural na alternatibo. Pinanatili ang “efa” at “terebinto” upang huwag alisin ang detalye ng tekstong Hebreo, na may maiikling paliwanag sa talababa.
