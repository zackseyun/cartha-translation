  source_fidelity: 'Tumpak sa kabuuan ang draft: naipapahayag nito ang pagpasok ni Gideon, paghahanda ng batang kambing at tinapay na walang lebadura mula sa isang efa ng harina, paglalagay ng karne at sabaw sa magkahiwalay na sisidlan, at pagdadala at paghaharap ng mga ito sa ilalim ng terebinto. Ang pangmaramihang pagtukoy sa mga pagkaing dinala ay natural sa Tagalog at angkop sa sama-samang tinutukoy na mga inihanda.'
  naturalness: 'May maliit ngunit kapaki-pakinabang na rebisyon: mas tiyak ang “walang lebadura” kaysa “walang pampaalsa,” dahil ang Hebreong מַצּוֹת ay tumutukoy sa kawalan ng lebadura. Hindi rin kailangang idagdag ang “sa lalaki,” na hindi ipinangalan ng Hebreo sa talatang ito at medyo hindi likas sa daloy ng Tagalog. Ang “sa kanya” ay malinaw sa konteksto.'
  terminology: Ang “efa,” “terebinto,” “karne,” “sabaw,” at “palayok” ay angkop. Ang “basket” ay katanggap-tanggap na modernong Filipino, bagaman hiram na salita. Pinananatili ng “iniharap” ang neutral na diwa ng paglapit/pagharap at iniiwasang gawing tahasang sakripisyo ang kilos.
