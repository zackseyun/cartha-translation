  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: tl
  text: At gumawa ng masama ang mga Israelita[a] sa paningin ni Yahweh[b], at ibinigay sila ni Yahweh sa kamay ng Midian[c] sa loob ng pitong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa mga mata ni Yahweh”; maaari ring isalin na “sa harap ni Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Ang “sa kamay ng Midian” ay idyomang Hebreo na nangangahulugang nasa ilalim ng kapangyarihan o pamamahala ng Midian.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  rationale: Ang literal na anyong “mga anak ni Israel” ay isang Hebreong katawagan para sa sambayanan ng Israel. Mas natural at malinaw sa makabagong Filipino ang “mga Israelita,” habang pinananatili ang kolektibong kahulugan.
- source_word: הָרַע
  choice: gumawa ng masama
  rationale: Pinananatili nito ang tuwirang moral na bigat ng Hebreong pariralang עשה הרע at natural itong pakinggan sa Filipino.
- source_word: בְעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Malapit ito sa larawan ng Hebreong “sa mga mata ni Yahweh” ngunit mas natural na evaluative idiom sa Filipino.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasalin ang Tetragrammaton bilang personal na pangalang Yahweh, sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיִּתְּנֵם
  choice: ibinigay sila
  rationale: Pinananatili ang payak na pandiwang נתן at hinahayaang ang kasunod na idyomang “sa kamay” ang magpahayag ng pagpapasailalim sa kapangyarihan.
- source_word: בְיַד מִדְיָן
  choice: sa kamay ng Midian
  rationale: Pinananatili ang Hebreong larawan ng “kamay,” na tumutukoy sa kapangyarihan o pamamahala; nauunawaan ito sa konteksto at nililinaw sa talababa.
- source_word: שֶׁבַע שָׁנִים
  choice: sa loob ng pitong taon
  rationale: Natural na Filipino ito para sa tagal na ipinahahayag ng Hebreong parirala.
theological_decisions:
- issue: Paglalarawan sa kasamaan ayon sa hatol ng Diyos
  choice: sa paningin ni Yahweh
  alternative: sa harap ni Yahweh
  rationale: Pinananatili ng napiling salin ang pananaw na si Yahweh ang humahatol kung ano ang masama, nang hindi dinaragdagan o nilulutas ang anumang teolohikal na tensiyon.
- issue: Paglilipat ng Israel sa kapangyarihan ng Midian
  choice: ibinigay sila ni Yahweh sa kamay ng Midian
  alternative: ipinasailalim sila ni Yahweh sa kapangyarihan ng Midian
  rationale: Ang mas literal na anyo ay nagpapanatili kapuwa sa pagkilos ni Yahweh at sa Hebreong larawan ng kamay, samantalang ipinapaliwanag ng talababa ang idyoma.
- issue: Pagbanggit sa banal na pangalan יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang pinagmulang teksto ay tahasang gumagamit ng Tetragrammaton; pinananatili rito ang personal na pangalan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga Israelita” para sa natural na kolektibong katawagan, ngunit pinanatili ang mga larawang “sa paningin” at “sa kamay” upang hindi mawala ang himig at estruktura ng Hebreo.
