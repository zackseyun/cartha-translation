  to: Pagkatapos, sinabi sa kanya ng anghel ng Diyos[a], “Kunin mo ang karne at ang tinapay na walang pampaalsa, ilagay mo ang mga iyon sa ibabaw ng batong ito, at ibuhos mo ang sabaw.” At ginawa niya iyon.
