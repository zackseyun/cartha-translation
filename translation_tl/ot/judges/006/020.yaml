base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: tl
  text: Pagkatapos, sinabi sa kanya ng anghel ng Diyos[a], “Kunin mo ang karne at ang tinapay na walang pampaalsa, ilagay mo ang mga iyon sa ibabaw ng batong ito, at ibuhos mo ang sabaw.” At ginawa niya iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sugo ng Diyos.” Ang salitang Hebreo ay maaaring tumukoy sa isang taong sugo o sa isang makalangit na sugo; sa kontekstong ito, mas pinapaboran ang isang makalangit na sugo.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: anghel ng Diyos
  rationale: Maaaring mangahulugan ang מַלְאַךְ ng sugo o anghel. Sa konteksto ng salaysay, malinaw na higit sa karaniwang taong sugo ang tauhan, kaya natural ang “anghel,” habang inilalahad sa talababa ang tunay na leksikal na alternatibo.
- source_word: קַח
  choice: Kunin mo
  rationale: Tuwirang ipinahahayag ng pautos na anyo ng לקח ang pagkuha sa mga bagay na binanggit; hindi idinaragdag ang di-tiyak na diwang patungo na maaaring ipahiwatig ng “dalhin.”
- source_word: הַבָּשָׂר
  choice: ang karne
  rationale: Bagaman literal ding maaaring “laman,” ang tinutukoy dito ay pagkaing inihanda, kaya “karne” ang natural at tumpak na salin.
- source_word: הַמַּצּוֹת
  choice: ang tinapay na walang pampaalsa
  rationale: Ang מַצּוֹת ay mga pagkaing tinapay na walang lebadura o pampaalsa. Ginamit ang kolektibong “tinapay” para sa natural na Filipino, gaya ng paggamit sa orihinal ng maramihang pangngalan bilang kabuuang pagkain.
- source_word: וְהַנַּח
  choice: ilagay mo ang mga iyon
  rationale: Ang Hiphil na pautos ng נוח ay nangangahulugang ilagay o ipatong. Nilinaw ng “ang mga iyon” na kapuwa tumutukoy ito sa karne at tinapay.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: sa batong ito
  rationale: Ang סֶלַע ay bato o malaking tipak ng bato, at ang הַלָּז ay demonstratibong “ito.” Sa Filipino, sapat at natural ang “ilagay ... sa batong ito,” na maaaring tumukoy sa ibabaw nito ayon sa konteksto.
- source_word: הַמָּרַק
  choice: ang sabaw
  rationale: Ang מָרָק ay sabaw o likidong pinaglutuan; “sabaw” ang karaniwang malinaw na katumbas sa modernong Filipino.
- source_word: שְׁפֹוךְ
  choice: ibuhos mo
  rationale: Ang pautos ng שפך ay pagbuhos o pag-ubos sa likido sa pamamagitan ng pagbuhos. Natural na ipinahahayag ito ng “ibuhos” sa Filipino.
- source_word: וַיַּעַשׂ כֵּן
  choice: At gayon nga ang ginawa niya
  rationale: Pinananatili nito ang maikli ngunit mariing ulat na tumalima siya nang eksakto sa iniutos.
theological_decisions:
- issue: Pagtukoy sa banal na sugo sa konteksto ng pagpapakita ng Diyos
  choice: anghel ng Diyos
  alternative: sugo ng Diyos
  rationale: Pinahihintulutan ng Hebreo ang dalawang kahulugan, ngunit itinatanghal ng konteksto sa Hukom 6 ang tauhan bilang makalangit na sugo. Pinananatili ng “anghel” ang bigat ng salaysay nang hindi nilulutas ang lahat ng tensiyon hinggil sa ugnayan ng anghel at ng Diyos; ang “sugo” ay pinananatili sa talababa bilang lehitimong alternatibo.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “pampaalsa” bilang madaling maunawaang katumbas para sa sangkap na nagpapaalsa ng tinapay, at iniwasan ang labis na teknikal o denominasyonal na pananalita.
