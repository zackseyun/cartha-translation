  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: tl
  text: At tuwing naghahasik ang Israel, lumulusob laban sa kanila ang Midian, ang Amalek, at ang mga tao mula sa Silangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “laban sa kanya,” na may hulaping pang-isahan ngunit kolektibong tumutukoy sa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: At tuwing
  rationale: Ang kumbinasyon ay nagpapakilala ng paulit-ulit na pangyayari, hindi ng isang minsanang kondisyon; natural na ipinahahayag ito ng “tuwing” sa modernong Tagalog.
- source_word: זָרַע
  choice: naghahasik
  rationale: Tuwirang katumbas ng paghahasik ng binhi at ang aspektong di-ganap ay angkop sa paulit-ulit na kalagayan.
- source_word: יִשְׂרָאֵל
  choice: ang Israel
  rationale: Pinanatili ang pangalang pantangi bilang kolektibong tawag sa bayang Israel.
- source_word: וְעָלָה … וְעָלוּ עָלָיו
  choice: lumulusob laban sa kanila
  rationale: Ang עלה na may עַל sa kontekstong militar ay tumutukoy sa pag-ahon o pagsugod nang may pagkapoot. Ang “lumulusob laban” ay natural sa Tagalog at pinananatili ang diwa ng paulit-ulit na pagsalakay.
- source_word: מִדְיָן
  choice: ang Midian
  rationale: Pinanatili ang pangalang Hebreo, na rito ay kolektibong tumutukoy sa bayang Midian.
- source_word: וַעֲמָלֵק
  choice: ang Amalek
  rationale: Pangalang pantangi, hindi anyong gentilic, ang nasa Hebreo; kaya pinanatili ang “Amalek” bilang kolektibong pangalan ng bayan.
- source_word: וּבְנֵי קֶדֶם
  choice: ang mga tao mula sa Silangan
  rationale: Ang literal na “mga anak ng silangan” ay isang kolektibong panrehiyong katawagan; ang salin ay malinaw at natural nang hindi nawawala ang kahulugan.
- source_word: עָלָיו
  choice: sa kanila
  rationale: Bagaman pangatlong panauhang panlalaking isahan ang hulapi sa Hebreo, kolektibong tinutukoy nito ang Israel. Ginamit ang likas na maramihang panghalip sa Tagalog at itinala sa talababa ang anyong isahan ng pinagmulan.
