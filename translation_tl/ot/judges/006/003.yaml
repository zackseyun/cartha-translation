translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang aspektong di-ganap sa “naghahasik” at “lumulusob” upang ihayag ang paulit-ulit na padron. Pinanatili ang Midian at Amalek bilang mga kolektibong pangalang pantangi, habang isinalin nang natural ang idiom na “mga anak ng silangan.”
