base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: tl
  text: Noong araw na iyon, tinawag niya siyang Jerubaal[a] at sinabi, “Hayaan si Baal na makipagtalo sa kanya[b], sapagkat giniba niya ang altar nito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangalang Jerubaal ay kaugnay ng pandiwang nangangahulugang “makipagtalo”; ipinaliliwanag ito ng mga salitang, “Hayaan si Baal na makipagtalo sa kanya.”
    reason: lexical_alternative
  - marker: b
    text: 'O “Makipagtalo sana si Baal sa kanya.” Maaaring unawain ang pandiwang Hebreo bilang isang hangarin o pakiusap. Itinuturing naman ito ng ilan na pahayag: “Makikipagtalo si Baal sa kanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: tinawag niya itong
  rationale: Pinananatili ang isahang paksa ng Hebreo nang hindi tinutukoy ang di-tiyak na antecedent; likas sa Tagalog ang “tinawag ... itong” sa pagbibigay ng pangalan o bansag.
- source_word: בַיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Likas at malinaw na panandang temporal sa makabagong Tagalog.
- source_word: יְרֻבַּעַל
  choice: Jerubaal
  rationale: Isinalin sa transliterasyon ang pangalang pantangi; ang paglalaro sa salitang ריב ay ipinaliliwanag sa kasunod na pahayag at talababa.
- source_word: לֵאמֹר
  choice: na sinasabi
  rationale: Sumasalamin sa pormulang Hebreo na nagpapakilala sa paliwanag ng pangalan.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Hayaan si Baal na makipagtalo laban sa kanya
  rationale: Ipinahahayag ang malamang na jussive na diwa at ang malawak na adversatibong kahulugan ng ריב, habang iniiwasang gawing tiyak na hula ang pahayag.
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan at nagpapanatili ng marangal na rehistro.
- source_word: נָתַץ
  choice: giniba
  rationale: Natural na pandiwa para sa pagbagsak o pagwasak ng isang altar.
- source_word: אֶת מִזְבְּחוֹ
  choice: ang altar nito
  rationale: Pinananatili ang panghalip na tumutukoy kay Baal; ang “nito” ay malinaw na tumutukoy sa di-taong diyos-diyosan sa konteksto.
theological_decisions:
- issue: Paglalarawan sa בַּעַל sa kontekstong polemikal
  choice: Baal
  alternative: ang panginoon
  rationale: Dito, ang Baal ay pangalan o titulo ng diyos ng mga Cananeo, hindi pangkalahatang katawagang “panginoon”; iniiwasan din nito ang pagkalito sa PANGINOON.
- issue: Modalidad ng יָרֶב
  choice: Hayaan si Baal na makipagtalo laban sa kanya
  alternative: Makipagtalo sana si Baal laban sa kanya; Makikipagtalo si Baal laban sa kanya
  rationale: Pinananatili ang malamang na jussive na pakiusap o hamon, habang inilalahad sa talababa ang tunay na posibilidad ng wish at indicative na pagbasa.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Pinanatili ang di-tiyak na paksa ng “tinawag niya,” ang salitaang nakapaloob sa pangalang Jerubaal, at ang modal na kalabuan ng pandiwang Hebreo sa pamamagitan ng pangunahing salin at talababa.
