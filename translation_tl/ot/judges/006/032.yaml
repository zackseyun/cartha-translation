revisions:
- from: Kaya nang araw na iyon, tinawag niya itong Jerubaal[a], na sinasabi, “Hayaan si Baal na makipagtalo laban sa kanya[b], sapagkat giniba niya ang altar nito.”
  to: Noong araw na iyon, tinawag niya siyang Jerubaal[a] at sinabi, “Hayaan si Baal na makipagtalo sa kanya[b], sapagkat giniba niya ang altar nito.”
  rationale: Inayos ang temporal na parirala at ang pagpapakilala ng sipi upang maging likas na modernong Filipino, habang pinanatili ang di-tiyak na “niya,” ang transliterasyon ng Jerubaal, ang jussive na pangunahing pagbasa, at ang alternatibong modal na pagbasa sa talababa. Hindi binago ang kahulugan ng “altar nito,” na sa konteksto ay tumutukoy kay Baal.
