  source_fidelity: Ang draft ay wastong naghahatid ng kahilingan ni Gideon para sa isang tanda at pinananatili ang diin na ang kausap niya mismo ang nagsasalita sa kanya. Gayunman, ang “kinalulugdan mo ako” ay bahagyang inililipat ang Hebreong “nakasumpong ako ng lingap sa iyong paningin” mula sa natamong pagtanggap tungo sa kasalukuyang damdamin. Ang binagong anyo ay mas malapit sa idyoma ng pinagmulan nang hindi nagiging di-natural.
