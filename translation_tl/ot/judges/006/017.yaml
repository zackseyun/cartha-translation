  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: tl
  text: Sinabi niya sa kanya, “Kung nakasumpong ako ng lingap sa iyong paningin, bigyan mo ako ng isang tanda na ikaw nga ang nakikipag-usap sa akin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: kinalulugdan mo ako
  rationale: Natural na salin ng Hebreong idyomang literal na ‘nakasumpong ako ng biyaya sa iyong mga mata,’ na nagpapahayag ng pagtanggap o pagsang-ayon.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: bigyan mo ako ng isang tanda
  rationale: Inihahatid ang kahilingang gumawa o maglaan ng palatandaang magpapatunay sa kausap.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: na ikaw nga ang nakikipag-usap sa akin
  rationale: Pinananatili ang diin sa pagkakakilanlan ng mismong nagsasalita kay Gideon.
theological_decisions:
- issue: Pagkakakilanlan ng kausap ni Gideon
  choice: Hindi pinangalanan sa talata; ginamit ang ‘ikaw nga.’
  alternative: Tukuyin nang tahasan bilang ang anghel ng PANGINOON o ang PANGINOON.
  rationale: Panghalip lamang ang nasa talata, kaya pinanatili ang daloy at tensiyon ng salaysay nang hindi nagdaragdag ng tahasang pagkakakilanlan.
translation_notes:
  register: Makabagong Filipino na natural at marangal. Ginamit ang ‘kinalulugdan’ upang malinaw ngunit hindi kolokyal, at ‘nakikipag-usap’ upang katawanin ang nagpapatuloy na kilos ng Hebreo.
