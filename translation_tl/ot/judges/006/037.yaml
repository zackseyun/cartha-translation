language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: tl
  text: Narito, maglalatag ako ng isang balahibo ng tupa sa giikan. Kung magkaroon ng hamog sa balahibo lamang, samantalang tuyo ang buong lupa[a], malalaman ko na ililigtas mo ang Israel sa pamamagitan ng aking kamay, gaya ng sinabi mo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “buong lupain” o “buong daigdig.” Ang salitang Hebreo ay maaaring tumukoy sa lupa sa isang lugar o sa mas malawak na lupain. Dito, malamang na tumutukoy ito sa nakapaligid na lupa sa lugar ng tanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Narito
  rationale: Pinananatili ang panawag-pansing at panturong diin ng Hebreo sa paraang marangal at pamilyar sa makabagong Tagalog.
- source_word: מַצִּיג
  choice: ilalatag ko
  rationale: Ipinahihiwatig ng participle kasama ng אָנֹכִי ang kasalukuyan o nalalapit na pagkilos. Ang “ilalatag” ay likas para sa paglalagay ng lana sa patag na giikan.
- source_word: גִּזַּת הַצֶּמֶר
  choice: ang ginupit na lana ng tupa
  rationale: Tinutukoy ang fleece, ang magkakasamang lanang ginupit mula sa tupa. Iniiwasan nito ang maling pagkaunawa sa “balahibo” bilang isang hibla lamang o sa fleece bilang balat ng hayop.
- source_word: בַּגֹּרֶן
  choice: sa giikan
  rationale: Ang “giikan” ang tuwiran at karaniwang salin ng lugar na pinapatag para sa paggiik.
- source_word: טַל יִהְיֶה
  choice: may hamog
  rationale: Likas na pang-iral na pahayag ito sa Tagalog at hindi nito labis na tinutukoy kung paano napunta roon ang hamog.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: sa lana lamang
  rationale: Malinaw na pinananatili ng “lamang” ang eksklusibong diin ng לְבַדָּהּ.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: samantalang tuyo ang buong lupa
  rationale: Ipinapahayag nang natural ang paghahambing ng hamog sa lana at ng pagkatuyo ng nakapaligid na lupa. Ang “lupa” ay angkop sa lokal na tagpuan ngunit hindi itinatago ang mas malawak na posibleng saklaw ng salitang Hebreo.
- source_word: וְיָדַעְתִּי
  choice: malalaman ko
  rationale: Sa konteksto, ang perfect ay resulta ng kondisyon. Sapat na naipakikita ng ayos ng pangungusap sa Tagalog ang ugnayang “kung… malalaman ko.”
- source_word: כִּי תוֹשִׁיעַ
  choice: na ililigtas mo
  rationale: Ang Hiphil ng יָשַׁע ay nangangahulugang magligtas o magpalaya. Ang “ililigtas” ay tuwiran at angkop sa konteksto.
- source_word: בְּיָדִי
  choice: sa pamamagitan ng kamay ko
  rationale: Pinananatili ang larawang Hebreo ng kamay bilang kasangkapan o ahensiya, habang nananatiling malinaw sa Tagalog.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: gaya ng sinabi mo
  rationale: Tapat ito sa payak na pandiwang “nagsalita/nagsabi” at hindi idinaragdag ang mas tiyak na diwa ng “nangako,” kahit maaaring ipinahihiwatig iyon ng konteksto.
theological_decisions:
- issue: Saklaw ng הָאָרֶץ sa tanda ni Gideon
  choice: lupa
  alternative: lupain o buong daigdig
  rationale: Sa agarang tagpuan, inihahambing ni Gideon ang lana sa nakapaligid na ibabaw ng giikan o lugar. Ang “lupa” ay hindi nagpapalabis sa saklaw, samantalang kinikilala sa talababa ang tunay na lawak ng maaaring kahulugan ng Hebreo.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “ginupit na lana ng tupa” upang maging tiyak ang kahulugan ng fleece nang hindi nagpapahiwatig na kasama ang balat. Pinanatili ang idyomang “sa pamamagitan ng kamay ko” upang mapangalagaan ang larawan at diin ng tekstong Hebreo.
