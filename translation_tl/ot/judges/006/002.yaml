  text: וַ/תָּ֥עָז יַד מִדְיָ֖ן עַל יִשְׂרָאֵ֑ל מִ/פְּנֵ֨י מִדְיָ֜ן עָשֽׂוּ לָ/הֶ֣ם בְּנֵ֣י יִשְׂרָאֵ֗ל אֶת הַ/מִּנְהָרוֹת֙ אֲשֶׁ֣ר בֶּֽ/הָרִ֔ים וְ/אֶת הַ/מְּעָר֖וֹת וְ/אֶת הַ/מְּצָדֽוֹת־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: tl
  text: Nanaig ang kapangyarihan ng Midian laban sa Israel. Dahil sa Midian, gumawa ang mga Israelita para sa kanilang sarili ng mga taguan sa kabundukan[a], mga kuweba, at mga tanggulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bihira ang salitang Hebreo rito. Maaari rin itong isaling “mga lungga” o “mga siwang sa kabundukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן
  choice: Nanaig ang kapangyarihan ng Midian
  rationale: Ang literal na “kamay ng Midian” ay idyoma para sa kapangyarihan o pamamahala. Mas natural sa modernong Tagalog ang “kapangyarihan,” at ipinahahayag ng “nanaig” ang mapaniil na pangingibabaw sa konteksto.
- source_word: עַל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Ipinakikita ng עַל dito ang pagalit na pangingibabaw; malinaw at natural ang “laban sa Israel.”
- source_word: מִפְּנֵי מִדְיָן
  choice: Dahil sa Midian
  rationale: Ipinahahayag ng parirala ang dahilan ng kilos ng Israel—ang banta at pananalakay ng Midian.
- source_word: עָשׂוּ לָהֶם בְּנֵי יִשְׂרָאֵל
  choice: gumawa ang mga Israelita para sa kanilang sarili
  rationale: Pinananatili nito ang reflexive na diwa ng לָהֶם. Ang “mga Israelita” ang natural na kolektibong salin ng בְּנֵי יִשְׂרָאֵל sa Tagalog at hindi naglilimita sa tinutukoy sa mga lalaking anak lamang.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: mga taguan sa kabundukan
  rationale: Bihira at hindi tiyak ang מִנְהָרוֹת; sa konteksto, malamang na tumutukoy ito sa mga lungga, siwang, o taguang lugar. Pinananatili ng “sa kabundukan” ang tahasang lokasyon ng Hebreo.
- source_word: הַמְּעָרוֹת
  choice: mga kuweba
  rationale: Karaniwan at malinaw na katumbas ng mga likas na yungib o cavern.
- source_word: הַמְּצָדוֹת
  choice: mga tanggulan
  rationale: Tumutukoy sa mga ligtas o pinatibay na lugar na maaaring pagkanlungan; ang “tanggulan” ay natural at angkop sa konteksto.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Isinalin ang idyomang “kamay ng Midian” bilang “kapangyarihan ng Midian” para sa likas na Tagalog, habang pinanatili sa talababa ang kawalang-katiyakan ng bihirang terminong Hebreo.
