revisions:
- from: Sapagkat umaahon sila kasama ng kanilang mga alagang hayop, at dumarating ang kanilang mga tolda na sindami ng mga balang.[a] Hindi mabilang ang mga tao at ang kanilang mga kamelyo,[b] at pumapasok sila sa lupain upang wasakin iyon.[c]
  to: Sapagkat sila at ang kanilang mga alagang hayop ay umaahon, at dumarating ang kanilang mga tolda na kasindami ng mga balang.[a] Sila at ang kanilang mga kamelyo ay hindi mabilang,[b] at pumapasok sila sa lupain upang wasakin iyon.[c]
  rationale: Inayos ang magkatuwang na paksa sa unang sugnay, pinalitan ang di-gaanong natural na “sindami” ng “kasindami,” at ibinalik ang “sila” sa ikalawang pangungusap upang maiwasan ang dagdag na pagpapakahulugan. Pinanatili ang aspektong di-ganap para sa nakagawiang pagsalakay at ang metonimiya ng mga tolda.
