translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga aspektong di-ganap upang ipakita ang nakagawiang paulit-ulit na pagsalakay. Pinanatili sa pangunahing teksto ang personipikado o metonimikong larawan ng pagdating ng mga tolda.
