base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: tl
  text: Sapagkat sila at ang kanilang mga alagang hayop ay umaahon, at dumarating ang kanilang mga tolda na kasindami ng mga balang.[a] Sila at ang kanilang mga kamelyo ay hindi mabilang,[b] at pumapasok sila sa lupain upang wasakin iyon.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “na parang napakaraming balang” o “na parang mga kawan ng balang.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, literal na “sila at ang kanilang mga kamelyo ay walang bilang.”
    reason: translation_note
  - marker: c
    text: O “upang pinsalain iyon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Nagpapakilala ito ng paliwanag kung bakit lubhang naghikahos ang Israel sa naunang talata.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: umaahon sila kasama ng kanilang mga alagang hayop
  rationale: Ang imperpektibo ay nagpapahayag ng paulit-ulit na kilos sa nakaraan; ang מִקְנֶה ay malawak na tumutukoy sa mga alagang hayop, hindi lamang baka.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: dumarating ang kanilang mga tolda
  rationale: Pinananatili ang matingkad na metonimiya ng Hebreo, kung saan ang mga tolda ay kumakatawan sa buong kampo ng mga mananalakay.
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: na sindami ng mga balang
  rationale: Natural na Tagalog na naghahatid ng paghahambing sa napakaraming balang nang hindi dinaragdagan ang larawan ng salitang 'kawan' o 'salot.'
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Hindi mabilang ang mga tao at ang kanilang mga kamelyo
  rationale: Inihahatid ang idyomang Hebreo na 'walang bilang' at nililinaw na ang panghalip ay tumutukoy sa mga mananalakay.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: pumapasok sila sa lupain
  rationale: Ang anyong Tagalog ay angkop sa paulit-ulit na pagsalakay na inilalarawan sa konteksto.
- source_word: לְשַׁחֲתָהּ
  choice: upang wasakin iyon
  rationale: Pinananatili ang malawak at tuwirang diwa ng שׁחת bilang layunin ng kanilang pagpasok; maaaring mangahulugan ding pinsalain o sirain ang lupain.
