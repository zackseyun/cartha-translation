revisions:
- from: Ngunit sinabi ni Joas sa lahat ng humaharap sa kanya, “Kayo ba ang makikipagtalo para kay Baal? Kayo ba ang magliligtas sa kanya? Ang sinumang makipagtalo para sa kanya ay papatayin bago sumapit ang umaga. Kung isa siyang diyos, siya ang makipagtalo para sa sarili niya, sapagkat giniba ang altar niya.”[a]
  to: Ngunit sinabi ni Joas sa lahat ng sumasalungat sa kanya, “Kayo ba ang makikipagtalo para kay Baal? Kayo ba ang magliligtas sa kanya? Ang sinumang makipagtalo para sa kanya ay papatayin bago sumapit ang umaga. Kung isa siyang diyos, siya na ang makipagtalo para sa sarili niya, sapagkat giniba ang altar niya.[a]”
