source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: tl
  text: Ngunit sinabi ni Joas sa lahat ng sumasalungat sa kanya, “Kayo ba ang makikipagtalo para kay Baal? Kayo ba ang magliligtas sa kanya? Ang sinumang makipagtalo para sa kanya ay papatayin bago sumapit ang umaga. Kung isa siyang diyos, siya na ang makipagtalo para sa sarili niya, sapagkat giniba ang altar niya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring: “sapagkat giniba niya ang altar niya,” na si Gideon ang ipinahihiwatig na simuno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: humaharap sa kanya
  rationale: Ipinahihiwatig ng idyoma sa konteksto ang pagharap kay Joas bilang mga sumasalungat sa kanya; likas sa modernong Tagalog ang “humaharap sa kanya” at hindi nito ginagawang lubhang teknikal ang tagpo.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: makikipagtalo / makipagtalo
  rationale: Pinananatili ang pag-uulit ng ugat ריב at ang saklaw nitong maaaring tumukoy sa pakikipagtalo o pagtatanggol sa usapin, nang hindi nililimitahan sa purong legal o pisikal na labanan.
- source_word: תּוֹשִׁיעוּן
  choice: magliligtas
  rationale: Tuwirang isinasalin ang Hiphil ng ישׁע at pinananatili ang kabalintunaan ng mga taong kailangang magligtas sa kanilang diyos.
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: Ang sinumang makipagtalo para sa kanya
  rationale: Ang “sinuman” ay natural na katumbas ng di-tiyak na panaguring pamanggit at naghahayag ng pangkalahatang banta.
- source_word: יוּמַת
  choice: papatayin
  rationale: Ipinapakita ng anyong Hophal na ang tao ay papatayin, hindi lamang basta mamamatay.
- source_word: עַד הַבֹּקֶר
  choice: bago sumapit ang umaga
  rationale: Sa pormula ng banta, ipinahihiwatig nito ang takdang panahon na hindi lalampas sa pagdating ng umaga.
- source_word: אֱלֹהִים הוּא
  choice: isa siyang diyos
  rationale: Tumutukoy ito sa pag-aangking diyos ni Baal, hindi sa Diyos ng Israel; malinaw itong naipakikita ng maliit na titik at di-tiyak na anyo.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: sapagkat giniba ang altar niya
  rationale: Walang tahasang simuno ang pandiwang Hebreo. Ang pasibong Tagalog ay nakatuon sa pagkagiba ng altar at hindi nagdaragdag ng tahasang tagagawa.
- source_word: וַיֹּאמֶר
  choice: Ngunit sinabi
  rationale: Ang pangatnig ay may salungat na puwersa sa konteksto habang tumutugon si Joas sa mga nag-aakusa.
theological_decisions:
- issue: Ang tinutukoy ng אֱלֹהִים kapag inilalarawan si Baal
  choice: “isa siyang diyos”
  alternative: “siya ang Diyos”
  rationale: Ang pahayag ay sumusubok sa inaangking pagka-diyos ni Baal at hindi kumikilala sa kanya bilang tunay na Diyos.
- issue: Ang di-binanggit na simuno ng נָתַץ
  choice: “giniba ang altar niya”
  alternative: “giniba niya ang altar ni Baal,” na inuunawang si Gideon ang simuno
  rationale: Pinananatili sa pangunahing teksto ang kawalan ng tahasang simuno sa Hebreo; inilalahad sa talababa ang posibleng pag-unawa kay Gideon bilang ipinahiwatig na simuno.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang retorikal na pag-uulit ng “makipagtalo” at ang mapanuyang tanong kung kailangan pang iligtas ng mga tao si Baal. Ginamit ang “altar” bilang karaniwan at malinaw na terminong biblikal.
