  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: tl
  text: Pagkatapos ay sinabi ni Gideon sa Diyos, “Kung ililigtas mo ang Israel sa pamamagitan ko, gaya ng sinabi mo—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Pagkatapos ay sinabi
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa makabagong Filipino ang “Pagkatapos ay sinabi” at napapanatili nito ang pagkakasunod-sunod.
- source_word: אֶל הָאֱלֹהִים
  choice: sa Diyos
  rationale: Tinutukoy sa konteksto ang Diyos ng Israel, hindi ang isang di-tiyak na diyos; natural sa Filipino ang “sa Diyos.”
- source_word: אִם
  choice: Kung
  rationale: Nagsisimula ito ng kondisyong nagpapatuloy sa susunod na talata, kaya pinananatili ang bukas na anyong kondisyonal.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: ililigtas mo
  rationale: Ang konstruksyong יֵשׁ na may hulaping panghalip at participle ay nagpapahayag ng inaasahan o nilalayong pagkilos. Malinaw at tuwiran sa Filipino ang aspektong kontemplatibo ng “ililigtas.”
- source_word: בְּיָדִי
  choice: sa pamamagitan ko
  rationale: Ang literal na “sa pamamagitan ng aking kamay” ay nauunawaan ngunit matigas sa kasalukuyang Filipino. Ipinahahayag ng “sa pamamagitan ko” ang idiomatikong diwa ng ahensiya.
- source_word: אֶת יִשְׂרָאֵל
  choice: ang Israel
  rationale: Hindi isinasalin ang pananda ng tiyak na layon na אֵת; ang Israel ang layon ng pagliligtas.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: gaya ng sinabi mo
  rationale: Natural, marangal, at tuwirang ipinahahayag nito ang pagtukoy ni Gideon sa naunang sinabi ng Diyos.
theological_decisions:
- issue: Pagkakasalin ng אֱלֹהִים sa pakikipag-usap ni Gideon
  choice: Diyos
  alternative: ang Diyos / diyos
  rationale: Sa konteksto, ang Diyos ng Israel ang tiyak na kinakausap ni Gideon. Hindi kailangan ng karagdagang pantukoy sa natural na Filipino, at hindi rin ipinapasok ang anumang dagdag na doktrinal na paliwanag.
- issue: Lakas ng kondisyong אִם
  choice: Kung
  alternative: Yamang / Tunay ngang
  rationale: Pinananatili ng “Kung” ang tunay na kondisyong anyo at ang tensiyon sa pakiusap ni Gideon, sa halip na gawin itong katiyakan o tahasang pag-aalinlangan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ang em dash bago ang panapos na panipi ay nagpapakitang hindi pa tapos ang kondisyon at nagpapatuloy ang pangungusap sa Hukom 6:37.
