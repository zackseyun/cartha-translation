  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: tl
  text: Bumaling sa kanya si Yahweh at sinabi, “Humayo ka taglay ang lakas mong ito[a] at iligtas mo ang Israel mula sa kamay ng Midian.[b] Hindi ba’t ako ang nagsugo sa iyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “sa lakas mong ito.” Ang Hebreong parirala ay maaaring tumukoy sa lakas na taglay niya o sa paraang gagamitin niya, at binibigyang-diin ng salitang “ito” ang lakas na iyon.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mula sa kamay ng Midian,” isang larawan para sa pagliligtas mula sa kapangyarihan o kontrol ng Midian.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: Bumaling sa kanya
  rationale: Pinananatili nito ang kilos na ipinahihiwatig ng פנה at ang direksiyon ng אֵלָיו, nang hindi nililimitahan ang kahulugan sa pagtingin lamang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang יהוה sa pamamagitan ng karaniwang transliterasyong “Yahweh,” sa halip na palitan ito ng isang titulo.
- source_word: לֵךְ
  choice: Humayo ka
  rationale: Tuwirang pautos ang anyo. Ang “humayo” ay likas, marangal, at angkop sa isang pagsusugo.
- source_word: בְּכֹחֲךָ זֶה
  choice: taglay ang lakas mong ito
  rationale: Ipinahahayag nito ang lakas bilang kasama o kasangkapan sa paghayong iniutos, habang pinananatili ng “ito” ang diin ng demonstratibo. Inilalahad sa talababa ang posibleng mas literal na pagkakaugnay.
- source_word: וְהוֹשַׁעְתָּ
  choice: at iligtas mo
  rationale: Sa konteksto ng naunang pautos, gumaganap ang anyo bilang kasunod na utos o tiyak na bunga ng pagsusugo. Ang koordinadong pautos ay natural sa Tagalog nang hindi inaalis ang puwersa ng komisyon.
- source_word: מִכַּף מִדְיָן
  choice: mula sa kamay ng Midian
  rationale: Pinananatili ang Hebreong larawan ng “kamay,” na tumutukoy sa kapangyarihan o kontrol.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: Hindi ba’t ako ang nagsugo sa iyo?
  rationale: Pinananatili ang retorikal na tanong na umaasa ng pagsang-ayon. Ang “ako ang” ay natural na nagbibigay-diin sa nagsugo, gaya ng puwersa ng tanong sa konteksto.
theological_decisions:
- issue: Paglalarawan sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na gawing isang pangkalahatang titulo.
- issue: Ugnayan ng lakas ni Gideon at ng pagsusugo ng Diyos
  choice: Pinanatili ang “lakas mong ito” at ang retorikal na katiyakan ng pagsusugo nang hindi ipinapaliwanag kung likas ba kay Gideon o kaloob ng Diyos ang lakas
  alternative: Ipaliwanag ang lakas bilang kapangyarihang tahasang ibinigay ng Diyos
  rationale: Hindi tahasang nilulutas ng talata ang pinagmulan o eksaktong katangian ng lakas; ang pagsasalin ay hindi dapat magdagdag ng teolohikal na paliwanag na wala sa teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “humayo” upang mapanatili ang pormal at tuwirang tono ng pagsusugo; iniwasan ang labis na sinaunang balangkas. Nasa mismong teksto ang lahat ng panandang talababa.
