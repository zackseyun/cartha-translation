base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: tl
  text: At pinangalanan nilang Dan ang lungsod, ayon sa pangalan ni Dan[a] na kanilang ama, na ipinanganak kay Israel. Ngunit Lais ang dating pangalan ng lungsod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “kanilang ninuno”; ang Hebreong “ama” ay maaari ring tumukoy sa isang ninuno, hindi lamang sa tuwirang magulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר דָּן
  choice: tinawag nilang Dan ang pangalan ng lungsod
  rationale: Pinananatili nito ang tahasang Hebreong idyomang 'tinawag ang pangalan ng lungsod,' habang malinaw pa rin sa Tagalog na pagpapangalan ang tinutukoy.
- source_word: בְּשֵׁם דָּן
  choice: ayon sa pangalan ni Dan
  rationale: Ipinahihiwatig ng בְּ na ipinangalan ang lungsod kaugnay ng pangalan ni Dan; natural at hindi labis na nagpapakahulugan ang 'ayon sa pangalan.'
- source_word: אֲבִיהֶם
  choice: kanilang ama
  rationale: Ito ang tuwirang kahulugan ng Hebreo at pinananatili ang idyomang pampamilya; maaari rin itong tumukoy sa isang ninuno.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: na ipinanganak kay Israel
  rationale: Pinananatili ang pasibong anyo at ang pangalang Israel mula sa pinagmulan, sa halip na palitan ito ng Jacob.
- source_word: וְאוּלָם
  choice: ngunit
  rationale: Malinaw at natural na ipinahahayag ang pagsalungat sa bagong pangalan ng lungsod.
- source_word: לַיִשׁ
  choice: Lais
  rationale: Karaniwang anyong Tagalog ng pangalang-pook na Laish, ayon sa ponolohiyang Filipino.
- source_word: לָרִאשֹׁנָה
  choice: dating
  rationale: Natural na Tagalog para sa naunang pangalan ng lungsod bago ito tawaging Dan.
theological_decisions:
- issue: Saklaw ng katawagang אֲבִיהֶם
  choice: kanilang ama
  alternative: kanilang ninuno
  rationale: Maaaring gamitin ang Hebreong 'ama' para sa isang ninuno o ninunong pinagmulan ng lipi. Pinananatili sa teksto ang literal na ugnayang pampamilya at inilalagay sa talababa ang mas malawak na diwa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang bahagyang Hebreong idyoma sa unang sugnay upang katawanin ang tahasang 'pangalan ng lungsod,' habang ginawang natural ang kabuuang daloy.
