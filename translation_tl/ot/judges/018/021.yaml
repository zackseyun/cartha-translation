  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: tl
  text: Kaya tumalikod sila at nagpatuloy sa paglalakad. Inilagay nila ang maliliit na bata, ang mga alagang hayop, at ang mahahalagang ari-arian[a] sa unahan nila.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga kagamitan,” “mga bagahe,” o “mga pag-aari.” Ang salitang Hebreo rito ay tumutukoy sa mga nadadalang pag-aari o kayamanan, hindi sa “kaluwalhatian.”
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “sa harap nila.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: tumalikod sila
  rationale: Ang פנה ay nangangahulugang bumaling o tumalikod. Pinananatili ng “tumalikod sila” ang malinaw na kilos sa salaysay nang hindi nagdaragdag ng tiyak na direksiyong wala sa teksto.
- source_word: וַיֵּלֵכוּ
  choice: nagpatuloy sa paglalakad
  rationale: Ang הלך ay karaniwang “lumakad” o “pumunta”; sa sunod-sunod na kilos dito, natural na ipinahihiwatig ng “nagpatuloy sa paglalakad” na umalis at nagpatuloy sila.
- source_word: וַיָּשִׂימוּ
  choice: inilagay nila
  rationale: Tuwirang katumbas ito ng שׂים, “ilagay” o “ipuwesto,” at angkop sa pag-aayos nila ng mga tao, hayop, at ari-arian sa hanay.
- source_word: הַטַּף
  choice: ang maliliit na bata
  rationale: Ang טף ay tumutukoy sa maliliit na anak o mga musmos, lalo na bilang mahihinang kasapi ng pangkat; mas tiyak ito kaysa sa pangkalahatang “mga bata.”
- source_word: הַמִּקְנֶה
  choice: ang mga alagang hayop
  rationale: Ang מִקְנֶה ay kolektibong tawag sa mga hayop na pag-aari o inaalagaan. Mas malawak at mas natural ang “mga alagang hayop” kaysa “mga baka.”
- source_word: הַכְּבוּדָּה
  choice: ang mahahalagang ari-arian
  rationale: Sa kontekstong ito, ang כבודה ay mga bitbit na pag-aari o kayamanan, hindi “kaluwalhatian.” Ipinahahayag ng salin ang halaga at pagiging nadadala ng mga pag-aari.
- source_word: לִפְנֵיהֶם
  choice: sa unahan nila
  rationale: Ang literal na diwa ay “sa harap nila.” Sa konteksto ng naglalakbay na pangkat, natural na ipinahahayag ng “sa unahan nila” na ang mga ito ay ipuwinesto sa harap ng pangunahing pangkat.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Kaya” upang iugnay ang talata sa naunang pangyayari, at hinati sa dalawang pangungusap para sa natural na daloy. Ang “sa unahan nila” ay mas angkop sa paglalakbay kaysa sa mas literal ngunit maaaring malabong “sa harap nila.”
