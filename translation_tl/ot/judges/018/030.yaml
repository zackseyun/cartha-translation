  - severity: low
    issue: Ang “pati ang kanyang mga anak, ay naglingkod bilang mga pari” ay mas maluwag kaysa sa nominal na pananalita ng Hebreo.
    rationale: Ang הָיוּ כֹהֲנִים ay tuwirang “ay mga pari.” Ang binagong ayos ay mas malinaw na kapwa si Jonatan at ang kanyang mga anak ang tinutukoy, nang hindi binibigyang-diin ang aspektong paglilingkod.
