  verdict: revise
  source_fidelity: 'Tumpak ang mga pangunahing katumbas: ang paglalagay ng inukit na larawan, ang talaangkanan ni Jonatan, ang pagkapari niya at ng kanyang mga anak, at ang sinadyang hindi pagtukoy kung aling pagkakatapon ang tinutukoy. Gayunman, ang “Kaya” ay nagbibigay ng hinuha o resulta na wala sa simpleng pangatnig na waw ng Hebreo.'
  naturalness: Marangal at malinaw sa pangkalahatan, ngunit mas natural at mas tuwirang Tagalog ang “At” kaysa “Kaya” at “si Jonatan at ang kanyang mga anak ay mga pari” kaysa sa medyo maluwag na “pati ... ay naglingkod bilang mga pari.”
  terminology: Ang “inukit na larawan,” “mga pari,” “lipi,” “Danita,” at “pagkakatapon ng lupain” ay angkop. Pinanatili ang “Moises” sa teksto at ang tradisyonal na “Manases” sa talababa.
