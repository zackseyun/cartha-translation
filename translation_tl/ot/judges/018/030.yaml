  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: tl
  text: At itinayo ng mga anak ni Dan para sa kanilang sarili ang inukit na larawan. Si Jonatan na anak ni Gersom, na anak ni Moises,[a] at ang kanyang mga anak ay mga pari para sa lipi ng mga Danita hanggang sa araw ng pagkakatapon ng lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebreo: “Moises.” May nakabitin na letrang nun sa tradisyong Masoretiko, na nagbibigay ng tradisyonal na pagbasa na “Manases.”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: itinayo
  rationale: Ang Hifil ng קום ay nangangahulugang ipatayo o ilagay nang nakatindig; natural ang “itinayo” para sa paglalagay ng imahen.
- source_word: לָהֶם
  choice: para sa kanilang sarili
  rationale: Ipinahahayag nito na ginawa iyon ng mga Danita para sa sarili nilang gamit o kapakinabangan.
- source_word: בְּנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili ang Hebreong anyo at naihihiwalay ito sa katawagang gentiliko sa sumunod na parirala.
- source_word: הַפָּסֶל
  choice: inukit na larawan
  rationale: Tiyak na tumutukoy ang פֶּסֶל sa isang imaheng nililok o inuukit; kongkreto ito at hindi lipas ang pananalita.
- source_word: וִיהוֹנָתָן
  choice: Jonatan
  rationale: Ginamit ang karaniwang modernong Tagalog na anyo ng pangalang biblikal.
- source_word: בֶּן גֵּרְשֹׁם
  choice: anak ni Gersom
  rationale: Tuwirang salin ng genealogical na parirala.
- source_word: בֶּן מְהוּא
  choice: anak ni Moises
  rationale: Ang batayang konsonantal na anyo ay tumutukoy kay Moises; inilalagay sa talababa ang tradisyonal na pagbasa na “Manases.”
- source_word: וּבָנָיו
  choice: pati ang kanyang mga anak
  rationale: Nililinaw sa natural na Tagalog na kapwa si Jonatan at ang kanyang mga anak ang simuno ng paglilingkod bilang mga pari.
- source_word: כֹהֲנִים
  choice: naglingkod bilang mga pari
  rationale: Natural na ipinapahayag sa Tagalog ang katayuan at gawain nila bilang mga pari nang hindi nagdaragdag ng denominasyonal na kahulugan.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: para sa lipi ng mga Danita
  rationale: Pinananatili ang diwa ng paglilingkod para sa pangkat-tribo at ang gentiliko na anyong “Danita.”
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: hanggang sa araw ng pagkakatapon ng lupain
  rationale: Sadyang malapit sa maikli at di-pangkaraniwang Hebreong parirala upang hindi tukuyin nang lampas sa teksto kung aling pagpapatapon ang tinutukoy.
theological_decisions:
- issue: Pagkakakilanlan sa ninuno ni Jonatan
  choice: anak ni Moises
  alternative: anak ni Manases
  rationale: 'Pinapanatili ng tradisyong Masoretiko ang tensiyon: ang konsonantal na batayan ay “Moises,” samantalang ang nakabitin na titik nun ay nagbibigay ng tradisyonal na pagbasa na “Manases.” Kaya nasa pangunahing teksto ang “Moises” at nasa talababa ang alternatibo.'
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang pormal na genealogical na ayos at ang hindi tiyak na pariralang “pagkakatapon ng lupain,” habang gumamit ng natural na pandiwang “naglingkod bilang mga pari.”
