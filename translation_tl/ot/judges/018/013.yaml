lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: dumaan sila
  rationale: Sa konteksto ng paglalakbay sa isang rehiyon, natural na ipinapahayag ng “dumaan” ang pagkilos nila sa kahabaan o loob ng lupain.
- source_word: מִשָּׁם
  choice: Mula roon
  rationale: Tuwirang panandang tumutukoy sa lugar na kanilang pinanggalingan.
- source_word: הַר אֶפְרָיִם
  choice: bulubundukin ng Efraim
  rationale: Ang parirala ay pangrehiyong katawagan sa mataas at maburol na lupain ng Efraim, hindi kinakailangang isang bundok lamang.
- source_word: וַיָּבֹאוּ
  choice: at nakarating
  rationale: Sa salaysay ng paglalakbay, malinaw at natural na ipinahahayag nito ang pagdating sa tinutukoy na hantungan.
- source_word: עַד
  choice: hanggang sa
  rationale: Pinananatili nito ang diwa ng hangganan o lawak ng kanilang paglalakbay.
- source_word: בֵּית מִיכָה
  choice: bahay ni Mikas
  rationale: Natural na modernong Tagalog para sa konstruktong Hebreo na “bahay ni Mikas”; ang anyong “Mikas” ay karaniwang pangalang biblikal sa Tagalog.
