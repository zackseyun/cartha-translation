  source_fidelity: Kailangang baguhin ang huling sugnay. Ang נִזְעָקְתָּ ay Niphal ng זעק, “sumigaw/umiyak nang malakas/nagtaas ng sigaw,” at hindi “nagtipon ka ng mga tao.” Hindi ipinahihintulot ng talata 22 ang pagpasok ng kahulugang iyon sa mismong teksto. Ang “mga Danita” at “lumingon” ay tapat na katumbas ng mga Danita at ng paglingon/pagbaling ng mukha.
