  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: tl
  text: Tumawag sila sa mga Danita, at lumingon ang mga ito at sinabi kay Mikas, “Ano ang nangyayari sa iyo at sumigaw ka?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ano ang nangyayari sa iyo at nagtaas ka ng sigaw?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־בְּנֵי דָן
  choice: Sumigaw sila sa mga Danita
  rationale: Ang קרא ay tumutukoy sa malakas na pagtawag upang mapansin ang mga Danita. Natural sa Filipino ang “sumigaw ... sa,” at ang “mga Danita” ay malinaw na katumbas ng literal na “mga anak ni Dan.”
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: kaya lumingon ang mga ito
  rationale: Literal itong “ibinaling nila ang kanilang mukha.” Ang “lumingon” ay likas na Filipino para sa pisikal na pagbaling nila sa tumatawag; ipinahihiwatig ng “ang mga ito” na mga Danita ang gumawa nito.
- source_word: לְמִיכָה
  choice: kay Mikas
  rationale: Karaniwang anyong Filipino ng pangalang Hebreo na מִיכָה at wastong gamit ng pang-ukol sa taong kinausap.
- source_word: מַה־לְּךָ
  choice: Ano ang problema mo
  rationale: Idyoma itong nagtatanong kung ano ang nangyayari o bumabagabag sa isang tao. Malinaw at natural ang napiling salin nang hindi dinaragdagan ang tindi nito.
- source_word: כִּי נִזְעָקְתָּ
  choice: at nagtipon ka ng mga tao
  rationale: Sa Niphal, ang זעק ay maaaring mangahulugang mapatawag o matipon ang mga tao bilang tugon sa isang panawagan, gaya ng ipinakikita ng konteksto sa talata 22. Pinananatili sa talababa ang posibleng diwa na “sumigaw/nagtaas ng sigaw.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang “mga Danita” sa halip na literal na “mga anak ni Dan” dahil ito ang likas na katawagan sa pangkat-etniko. Isinaalang-alang ang konteksto ng talata 22 sa pagsasalin ng נִזְעָקְתָּ, habang inilagay sa talababa ang tunay na leksikal na alternatibo.
