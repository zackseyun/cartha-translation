base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: tl
  text: Nang nakalayo na sila mula sa bahay ni Mica, nagtipon[a] ang mga lalaking nasa mga bahay na malapit sa bahay ni Mica at naabutan nila ang mga anak ni Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumigaw ng alarma.” Maaaring tumukoy ang pandiwang Hebreo sa sigaw ng alarma o sa pagtitipong bunga nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: sila
  rationale: Ang hiwalay na panghalip ay tumutukoy muli sa mga anak ni Dan; natural itong isalin bilang “sila.”
- source_word: הִרְחִיקוּ
  choice: medyo nakalayo na
  rationale: Ipinahihiwatig ng pandiwa na nakarating na sila sa isang distansiya; likas sa salaysay ang “medyo nakalayo na” kaysa sa literal na “nagpalayo.”
- source_word: מִבֵּית מִיכָה
  choice: sa bahay ni Mica
  rationale: Sa Tagalog, ang “sa bahay ni Mica” ang natural na anyo para sa paglayo mula sa bahay; malinaw na ito ang panimulang lugar ng kanilang paglayo.
- source_word: הָאֲנָשִׁים
  choice: ang mga lalaki
  rationale: Tiyak na “mga lalaki” ang ginamit sa Hebreo, kaya hindi ito ginawang pangkalahatang “mga tao.”
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: nasa mga bahay na malapit sa bahay ni Mica
  rationale: Ang עִם ay nagpapahiwatig dito ng kalapitan o kaugnayan. Pinananatili ng salin ang pagtukoy sa mga kalapit na bahay sa malinaw at natural na Tagalog.
- source_word: נִזְעֲקוּ
  choice: nagtipon
  rationale: Maaaring tumukoy ang Niphal ng זעק sa pagtitipon bilang tugon sa sigaw o alarma. Ang “nagtipon” ay akma sa kasunod na sama-samang paghabol, habang inilalagay sa talababa ang tunay na alternatibong pagbasa.
- source_word: וַיַּדְבִּיקוּ
  choice: at inabutan nila
  rationale: Ang pandiwa ay nangangahulugang makahabol o makaabot sa hinahabol; karaniwan at malinaw sa Tagalog ang “inabutan nila.”
- source_word: אֶת בְּנֵי דָן
  choice: ang mga anak ni Dan
  rationale: Pinananatili ang pormal na katawagang pangangkan na nasa Hebreo sa halip na palitan ng “mga Danita.”
