  to: Nang nakalayo na sila mula sa bahay ni Mica, nagtipon[a] ang mga lalaking nasa mga bahay na malapit sa bahay ni Mica at naabutan nila ang mga anak ni Dan.
  rationale: Inalis ang “medyo” upang hindi mabawasan ang ipinahihiwatig na paglayo sa Hebreo. Inayos ang talababa upang maipreserba nang mas tumpak ang alternatibong pagbasa ng pandiwa, habang pinananatili ang “nagtipon” bilang kontekstuwal na pangunahing salin.
