translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mica” at “Dan” bilang karaniwang anyong Filipino ng mga pangalang biblikal. Pinanatili ang bahagyang pag-uulit ng “bahay ni Mica” dahil naroon ito sa Hebreo at nakatutulong sa pagtukoy sa mga kalapit na sambahayan.
