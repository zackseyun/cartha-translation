base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: tl
  text: Nang malapit na sila sa bahay ni Micas, nakilala nila ang tinig ng batang Levita. Kaya lumihis sila roon at tinanong siya, “Sino ang nagdala sa iyo rito? Ano ang ginagawa mo sa lugar na ito?[a] At ano ang sadya mo rito?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Ano ang ginagawa mo rito?” Literal sa Hebreo, “Ano ang ginagawa mo sa bagay na ito?”
    reason: lexical_alternative
  - marker: b
    text: O “At ano ang mayroon ka rito?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Nang malapit sila sa bahay ni Micas
  rationale: Ang עִם ay maaaring magpahayag ng pagiging malapit o nasa tabi. Ang locative na diwa ang angkop sa salaysay, at likas sa Tagalog ang “malapit sa bahay.”
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: nakilala nila ang tinig ng batang Levitang iyon
  rationale: Ang Hiphil ng נכר ay “makilala.” Ang קוֹל ay “tinig,” at ang הַנַּעַר הַלֵּוִי ay tumutukoy sa batang lalaking Levita na nabanggit na sa salaysay.
- source_word: וַיָּסוּרוּ שָׁם
  choice: Kaya lumihis sila papunta roon
  rationale: Ang סור ay paglihis mula sa dinaraanan o pagpunta sa isang lugar sa tabi. Pinananatili ng salin ang kilos patungo sa kinaroroonan ng Levita.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Sino ang nagdala sa iyo rito?
  rationale: Ang causative na anyo ng בוא ay “magdala,” at ang הֲלֹם ay “rito.” Direkta at likas ang tanong sa Tagalog.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: Ano ang ginagawa mo sa lugar na ito?
  rationale: Ang בָּזֶה ay literal na “sa/ganito” at eliptiko rito. Nililinaw ng “sa lugar na ito” ang malamang na locative na diwa nang hindi inaalis ang literal na alternatibo sa talababa.
- source_word: וּמַה לְּךָ פֹה
  choice: At ano ang sadya mo rito?
  rationale: Ang idyomang מַה לְּךָ פֹה ay nagtatanong kung ano ang pakay, interes, o kaugnayan ng isang tao sa lugar. Mas natural sa modernong Tagalog ang “ano ang sadya mo rito,” habang pinananatili sa talababa ang mas konkretong pagbasa.
