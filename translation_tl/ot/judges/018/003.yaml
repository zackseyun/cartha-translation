translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “sadya” bilang karaniwang salitang tumutukoy sa pakay; iniwasan ang sobrang literal ngunit malabong hulma, at inilagay sa mga talababa ang tunay na mga alternatibong leksikal.
