revisions:
- from: Nang malapit sila sa bahay ni Micas, nakilala nila ang tinig ng batang Levitang iyon. Kaya lumihis sila papunta roon at tinanong siya, “Sino ang nagdala sa iyo rito? Ano ang ginagawa mo sa lugar na ito?[a] At ano ang sadya mo rito?”[b]
  to: Nang malapit na sila sa bahay ni Micas, nakilala nila ang tinig ng batang Levita. Kaya lumihis sila roon at tinanong siya, “Sino ang nagdala sa iyo rito? Ano ang ginagawa mo sa lugar na ito?[a] At ano ang sadya mo rito?”[b]
  rationale: Inayos ang di-likas na pagbubukas at pinasimple ang paglalarawan ng paglihis nang hindi binabago ang kilos sa Hebreo. Itinuwid ang literal na pagpapaliwanag ng בָּזֶה sa talababa. Napanatili ang maingat na pagsasalin ng idyomang “ano ang sadya mo rito” at ang alternatibong mas kongkretong pagbasa nito.
