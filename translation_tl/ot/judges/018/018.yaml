    rationale: Ang teraphim ay isang natatanging terminong Hebreo; ang talababa ay nagbibigay ng transliteradong alternatibo at maikling paliwanag nang hindi ginagawang teknikal ang pangunahing teksto.
  - severity: low
    issue: Ang “mga diyus-diyosan sa bahay” ay bahagyang di-tuwiran.
    rationale: Maaaring unawain ito bilang mga diyus-diyosang pisikal na nasa bahay. Ang “mga diyus-diyosan ng sambahayan” ay mas natural at mas malapit sa semantikong saklaw ng household cult objects.
