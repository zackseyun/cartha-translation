base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: tl
  text: Pumasok ang mga lalaking ito sa bahay ni Mica at kinuha ang imaheng inukit, ang efod, ang mga diyus-diyosan ng sambahayan[a], at ang imaheng hinulma. Sinabi ng pari sa kanila, “Ano ang ginagawa ninyo?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga terapim.” Ang terminong Hebreo ay tumutukoy sa mga bagay o diyus-diyosang ginagamit sa pagsamba sa sambahayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ang mga lalaking ito
  rationale: Tumutukoy ang demonstratibo sa limang lalaking binanggit sa naunang konteksto. Nililinaw ng “mga lalaking ito” ang tinutukoy nang hindi nagdaragdag ng bagong impormasyon.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: Pumasok ... sa bahay ni Mica
  rationale: Bagaman karaniwang nangangahulugang “dumating” o “pumunta” ang pandiwa, ipinahihiwatig ng kasunod na parirala ang pagpasok sa bahay. Ito ang natural na salaysay sa Filipino.
- source_word: וַיִּקְחוּ
  choice: kinuha
  rationale: Tuwirang katumbas ito ng karaniwang pandiwa para sa pagkuha at hindi nito labis na binibigyang-kahulugan ang kilos bilang sapilitang pag-agaw.
- source_word: פֶּסֶל
  choice: imaheng inukit
  rationale: Pinananatili nito ang pisikal na diwa ng isang larawang o imaheng ginawa sa pamamagitan ng pag-ukit, sa halip na ipantay agad sa pangkalahatang salitang “diyus-diyosan.”
- source_word: הָאֵפוֹד
  choice: ang efod
  rationale: Ang efod ay isang natatanging kagamitang panrelihiyon na walang eksaktong maikling katumbas sa Filipino. Ang transliterasyon ang hindi gaanong mapanlinlang at hindi ito tinutukoy rito bilang lehitimong kasuotang pangpari.
- source_word: הַתְּרָפִים
  choice: ang mga diyus-diyosan sa bahay
  rationale: Ang terapim ay mga bagay na ginagamit sa kulto o pagsamba sa loob ng sambahayan. Ipinahahayag ng salin ang kahulugan sa paraang mauunawaan ng karaniwang mambabasa.
- source_word: הַמַּסֵּכָה
  choice: ang imaheng hinulma
  rationale: Tumutukoy ito sa imaheng ginawa sa pamamagitan ng paghuhulma o pagbubuhos ng tunaw na materyal, karaniwang metal. Ang “hinulma” ay malinaw at hindi lipas na pananalita.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Sinabi sa kanila ng pari
  rationale: Natural na ayos ito sa Filipino at pinananatili ang payak na pagsulong ng salaysay.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: Ano ang ginagawa ninyo?
  rationale: Tuwirang tanong ito sa Hebreo; walang salitang katumbas ng “dito,” kaya hindi iyon idinagdag.
theological_decisions:
- issue: Paglalarawan sa magkakaibang kagamitang panrelihiyon sa konteksto ng idolatriya
  choice: Panatilihin ang magkakaibang katawagang “imaheng inukit,” “efod,” “mga diyus-diyosan sa bahay,” at “imaheng hinulma.”
  alternative: Gamitin ang pangkalahatang “mga diyus-diyosan” para sa lahat ng bagay.
  rationale: Sadyang inililista ng tekstong Hebreo ang magkakaibang bagay. Pinananatili ng salin ang mga pagkakaibang iyon nang hindi nagdaragdag ng komentaryong pangdoktrina.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mica” at “efod” bilang natural na mga transliterasyon. Iniwasan ang lipas na “larawang inanyuan” at ang labis na teknikal na “terapim” sa pangunahing teksto.
