  to: Pumasok ang mga lalaking ito sa bahay ni Mica at kinuha ang imaheng inukit, ang efod, ang mga diyus-diyosan ng sambahayan[a], at ang imaheng hinulma. Sinabi ng pari sa kanila, “Ano ang ginagawa ninyo?”
  rationale: Ginawang mas tuwiran ang katumbas ng teraphim at idinagdag ang talababa, na ang angkla ay nasa teraphim-equivalent mismo. Hindi binago ang kahulugan, ang mga natatanging bagay na inililista ng Hebreo, o ang antas ng pormalidad ng salaysay.
