base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: tl
  text: 'Sinabi nila sa kanya, “Tumahimik ka[a]. Takpan mo ng kamay ang bibig mo, sumama ka sa amin, at maging ama[b] at pari namin. Alin ang mas mabuti para sa iyo: ang maging pari ng sambahayan ng isang tao, o ang maging pari ng isang lipi at angkan[c] sa Israel?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “Manahimik ka.”
    reason: lexical_alternative
  - marker: b
    text: Ang “ama” rito ay titulong nagpapahiwatig ng pamumunong panlipunan o panrelihiyon, hindi ng ugnayang biyolohikal.
    reason: cultural_note
  - marker: c
    text: Ang “angkan” ay tumutukoy rito sa isang pangkat ng magkakamag-anak sa loob ng isang lipi.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Tumahimik ka
  rationale: Tuwirang pautos na natural sa modernong Tagalog at pinananatili ang diwa ng paghinto sa pagsasalita.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: Takpan mo ng kamay ang bibig mo
  rationale: Pinananatili ang kongkretong kilos na nagsasaad ng pananahimik o pagpipigil.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: maging ama at pari namin
  rationale: Pinananatili ang dalawang tungkulin at ang literal na titulong ‘ama’ nang hindi ito nililimitahan sa isang interpretatibong katawagan.
- source_word: הֲטוֹב
  choice: Alin ang mas mabuti para sa iyo
  rationale: Ipinahihiwatig ng tanong at ng dalawang kasunod na pagpipilian ang paghahambing, kaya natural ang ‘mas mabuti.’
- source_word: לְבֵית אִישׁ אֶחָד
  choice: ng sambahayan ng isang tao
  rationale: Ang ‘sambahayan’ ay naghahatid sa diwa ng בַּיִת bilang bahay o yunit ng pamilya, hindi lamang gusali.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: ng isang lipi at angkan sa Israel
  rationale: Ginagamit ang ‘lipi’ para sa שֵׁבֶט at ‘angkan’ para sa מִשְׁפָּחָה upang mapanatili ang dalawang magkaugnay ngunit magkaibang yunit ng pagkakamag-anak.
theological_decisions:
- issue: Ang kahulugan ng ‘ama’ bilang titulo
  choice: Panatilihin ang literal na ‘ama.’
  alternative: tagapayo; pinuno; patron
  rationale: Ang salitang Hebreo ay ‘ama’ at nakatambal sa ‘pari.’ Ang pagpapanatili rito ay hindi nagpapasya nang higit sa teksto tungkol sa tiyak na saklaw ng papel na panlipunan o panrelihiyon.
- issue: Pagkakaiba ng שֵׁבֶט at מִשְׁפָּחָה
  choice: lipi at angkan
  alternative: tribo at pamilya; lipi at pamilya
  rationale: Pinananatili nito ang pagkakaiba ng mas malawak na pangkat at ng pangkat ng magkakamag-anak, pati ang paghahambing sa sambahayan ng iisang tao.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang tuwirang pananalita at karaniwang bokabularyo, habang pinananatili ang kongkretong idyoma, mga titulong pangkultura, at pagkakaiba ng mga yunit ng pagkakamag-anak sa Hebreo.
