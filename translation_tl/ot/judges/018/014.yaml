  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: tl
  text: Sumagot ang limang lalaking nagtungo upang manmanman ang lupain ng Lais at sinabi sa kanilang mga kapatid, “Alam ba ninyo na sa mga bahay na ito ay may efod, mga terafim[a], isang inukit na imahen, at isang hinulmang imahen[b]? Kaya ngayon, alamin ninyo kung ano ang gagawin ninyo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “mga terafim” ay mga imaheng panrelihiyon na karaniwang kaugnay ng sambahayan; maaari rin itong isaling “mga diyus-diyosan ng sambahayan.”
    reason: lexical_alternative
  - marker: b
    text: Ang “hinulmang imahen” ay imaheng ginawa sa pamamagitan ng pagbubuhos ng tunaw na materyal sa isang hulma; tradisyonal din itong tinatawag na “imaheng binubo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Sumagot
  rationale: Pinananatili ang karaniwang pormulang pasalaysay ng Hebreo, kahit walang tuwirang naunang pananalitang sinipi.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: nagpunta upang manmanan
  rationale: Ipinahihiwatig ng konteksto na ang pagmamanman ay dati na nilang misyon; natural ito sa makabagong Tagalog.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: ang lupain ng Lais
  rationale: Tumutukoy ang אֶרֶץ sa teritoryong kaugnay ng Lais, hindi sa buong daigdig.
- source_word: אֶל אֲחֵיהֶם
  choice: sa kanilang mga kapatid
  rationale: Pinananatili ang literal na katawagang panlalaking angkop sa mga kasamang Danita sa konteksto.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: sa mga bahay na ito
  rationale: Direktang isinasalin ang pangmaramihang בָּתִּים nang hindi ipinapalagay na sambahan o buong sambahayan ang tinutukoy.
- source_word: אֵפוֹד
  choice: efod
  rationale: Ang transliterasyon ang pinakatumpak para sa natatanging kagamitang panrelihiyon na walang payak na katumbas sa Tagalog.
- source_word: תְרָפִים
  choice: mga terafim
  rationale: Pinananatili ang natatanging terminong Hebreo at iniiwasang agad ipakahulugang mga diyos o diyus-diyosan ng sambahayan.
- source_word: פֶּסֶל
  choice: isang inukit na imahen
  rationale: Ipinakikita ang paraan ng paggawa at pinananatiling naiiba sa iba pang kagamitang nakalista.
- source_word: מַסֵּכָה
  choice: isang hinulmang imahen
  rationale: Ipinahihiwatig ang imaheng ginawa sa pamamagitan ng pagbubuhos o paghulma ng tunaw na materyal; mas natural ito kaysa literal na 'tunaw na imahen.'
- source_word: דְּעוּ מַה תַּעֲשׂוּן
  choice: pag-isipan ninyo kung ano ang gagawin ninyo
  rationale: Ipinahahayag sa natural na Tagalog ang utos na magkaroon ng malinaw na pasiya tungkol sa kanilang gagawin, nang hindi tinutukoy kung ano mismo ang dapat nilang piliin.
theological_decisions:
- issue: Paglalarawan sa mga kagamitang panrelihiyon sa bahay ni Mikas
  choice: Panatilihing magkakaiba ang efod, mga terafim, inukit na imahen, at hinulmang imahen.
  alternative: Pagsama-samahin ang mga ito bilang mga diyus-diyosan o mga bagay para sa pagsamba.
  rationale: Magkakaibang terminong Hebreo ang sadyang nakalista. Hindi dapat burahin ng salin ang mga pagkakaibang iyon o magdagdag ng hatol na hindi tahasang nasa talata.
- issue: Pakahulugan sa pangwakas na utos
  choice: “pag-isipan ninyo kung ano ang gagawin ninyo”
  alternative: “alam na ninyo ang inyong gagawin” o “gawin ninyo ang nararapat”
  rationale: Ang Hebreo ay literal na nag-uutos na 'alamin' nila kung ano ang gagawin; hindi nito tahasang sinasabi na alam na nila ito o na moral na nararapat ang binabalak.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “manmanan” sa halip na mas kolokyal na “espiya” at pinanatili ang mga natatanging terminong pangkultura sa pamamagitan ng transliterasyon at maiikling talababa.
