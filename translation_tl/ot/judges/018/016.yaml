  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: tl
  text: At ang animnaraang lalaki, na armado ng kanilang mga sandatang pandigma, ay nakatayo sa pasukan ng tarangkahan; sila ay mula sa mga anak ni Dan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “mga Danita.” Sa literal, “mula sa mga anak ni Dan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: At ang animnaraang lalaki
  rationale: Ang וְ ay likas na nag-uugnay sa nagpapatuloy na salaysay bilang “At,” at ang אִישׁ kasunod ng bilang ay kolektibong tumutukoy sa mga lalaki.
- source_word: חֲגוּרִים
  choice: na armado
  rationale: Literal itong “nabibigkisan” o “nakasukbit,” ngunit sa kontekstong militar ay malinaw na nangangahulugang handa at may sandata; ang “armado” ang natural at tiyak na katumbas sa modernong Filipino.
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: ng kanilang mga sandata sa digmaan
  rationale: Ang כְּלִי ay maaaring kasangkapan o kagamitan, ngunit kasama ng מִלְחָמָה ay tumutukoy sa mga sandatang pandigma. Pinananatili ng parirala ang pagbanggit sa digmaan at ang panghalip na “kanilang.”
- source_word: נִצָּבִים
  choice: ay nakatayo
  rationale: Pinananatili nito ang naglalarawan at patuloy na bisa ng Hebreong participle, sa halip na ipakahulugang sila ay pormal na nakapuwesto o nakatalaga.
- source_word: פֶּתַח הַשָּׁעַר
  choice: sa pasukan ng tarangkahan
  rationale: Tuwirang kinakatawan ng “pasukan” ang פֶּתַח at ng “tarangkahan” ang הַשָּׁעַר, habang nananatiling malinaw sa karaniwang mambabasa.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: ang mga ito ay mula sa mga anak ni Dan
  rationale: Nililinaw ng “ang mga ito” ang tinutukoy ng sugnay, habang pinananatili ng “mula sa mga anak ni Dan” ang Hebreong pananalitang pangangkan sa halip na agad itong palitan ng katawagang etniko.
