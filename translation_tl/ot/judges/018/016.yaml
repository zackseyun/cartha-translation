  to: At ang animnaraang lalaki, na armado ng kanilang mga sandatang pandigma, ay nakatayo sa pasukan ng tarangkahan; sila ay mula sa mga anak ni Dan.[a]
  rationale: Pinalitan ang di-gaanong likas na pantukoy na “ang mga ito” ng “sila,” at ginawang “mga sandatang pandigma” ang pariralang para sa mga sandata upang maging mas idiomatiko sa modernong Filipino. Pinanatili ang bilang, aspektong naglalarawan ng “nakatayo,” katawagang “mga anak ni Dan,” at ang talababa para sa alternatibong “mga Danita.”
