  to: Umakyat ang limang lalaking nagpunta upang tiktikan ang lupain at dumating doon. Kinuha nila ang inukit na imahen, ang epod, ang mga diyos ng sambahayan[a], at ang hinulmang imahen[b], habang nakatayo ang pari sa pasukan ng tarangkahan kasama ang animnaraang lalaking may mga sandata pandigma.
