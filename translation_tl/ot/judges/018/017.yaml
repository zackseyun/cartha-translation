  source_fidelity: 'Ang draft ay wasto sa pangunahing pagkakasunod ng Hebreo: umakyat ang limang espiya, dumating sila roon, kinuha ang apat na bagay, at nakatayo ang pari sa pasukan kasama ng animnaraang lalaking may sandata. Gayunman, ang “pumaroon sila roon” ay parehong paulit-ulit at masyadong lipas para sa target na modernong Filipino; ang “dumating doon” ay tuwirang tumutugma sa בָּאוּ שָׁמָּה. Ang “may mga sandata pandigma” ay mas malinaw na nagsasaad ng pagiging nasasangkapan ng mga sandata kaysa “nasasandatahan para sa digmaan.”'
  naturalness: Kailangan ng maliit ngunit ligtas na rebisyon para sa mas likas na modernong Tagalog. “Tiktikan ang lupain” ay natural at pinananatili ang estratehikong diwa ng רגל. “Pasukan ng tarangkahan” ay malinaw na katumbas ng “entrance of the gate.”
  terminology: Ang “inukit na imahen,” “epod,” “mga diyos ng sambahayan,” at “hinulmang imahen” ay angkop. Pinananatili ang “terapim” sa talababa bilang leksikal na alternatibo; hindi nito ipinipilit kung mga diyos ba o mga bagay pangkulto ang tinutukoy ng termino.
