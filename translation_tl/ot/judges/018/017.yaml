translation_notes:
  register: Modernong Filipino Tagalog na may marangal ngunit madaling maunawaang himig. Pinanatili ang magkakasunod na kilos na ‘umakyat’ at ‘pumaroon doon’ upang hindi burahin ang anyo ng salaysay sa Hebreo. Inilipat ang marker [a] sa ‘mga diyos ng sambahayan,’ sapagkat malinaw na ang talababa tungkol sa terapim ay tumutukoy sa הַתְּרָפִים at hindi sa וַיַּעֲלוּ.
