base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: tl
  text: Umakyat ang limang lalaking nagpunta upang tiktikan ang lupain at dumating doon. Kinuha nila ang inukit na imahen, ang epod, ang mga diyos ng sambahayan[a], at ang hinulmang imahen[b], habang nakatayo ang pari sa pasukan ng tarangkahan kasama ang animnaraang lalaking may mga sandata pandigma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga terapim.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa kulto ng sambahayan o sa mga diyos ng sambahayan.
    reason: lexical_alternative
  - marker: b
    text: 'Tradisyonal na salin: “imaheng yari sa tunaw na metal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Umakyat
  rationale: Pinananatili ang karaniwang kahulugan ng עלה na ‘umakyat/pumaitaas,’ kahit hindi tahasang binabanggit ang patutunguhan.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: nagpunta upang manmanan ang lupain
  rationale: Ipinahihiwatig ng pariralang participyal ang nauna nilang misyong paniktik; ang ‘manmanan’ ay natural sa kontekstong militar.
- source_word: בָּאוּ שָׁמָּה
  choice: pumaroon sila roon
  rationale: Tuwirang inilalarawan ang pagdating nila sa lugar nang hindi dinaragdagan ng tahasang bagay na pinasok.
- source_word: לָקְחוּ
  choice: Kinuha nila
  rationale: Karaniwang katumbas ng לקח ang ‘kunin’; sapat na ang konteksto upang ipakitang hindi ito kusang ibinigay.
- source_word: הַפֶּסֶל
  choice: ang inukit na imahen
  rationale: Tiyak na ipinapakita ng פסל na ang imahen ay ginawa sa pamamagitan ng pag-ukit; mas kongkreto ito kaysa sa interpretatibong ‘diyus-diyosan.’
- source_word: הָאֵפוֹד
  choice: ang epod
  rationale: Isang natatanging katawagang pangkultura ang אֵפוֹד, kaya ang angkop na salin ay transliterasyon nang hindi nagdaragdag ng paglalarawang wala sa teksto.
- source_word: הַתְּרָפִים
  choice: ang mga diyos ng sambahayan
  rationale: Ipinauunawa nito sa karaniwang mambabasa ang mga bagay o diyos na ginagamit sa kulto ng sambahayan; inilalagay sa talababa ang teknikal na katawagang ‘terapim.’
- source_word: הַמַּסֵּכָה
  choice: ang hinulmang imahen
  rationale: Ang מסכה ay imaheng ginawa sa paghuhulma o pagbubuhos ng tunaw na materyal; natural sa Filipino ang ‘hinulmang imahen.’
- source_word: וְהַכֹּהֵן נִצָּב
  choice: habang nakatayo ang pari
  rationale: Ipinakikita ng ‘habang’ na kasabay ng pagkuha ang kalagayang inilalarawan ng sugnay.
- source_word: פֶּתַח הַשַּׁעַר
  choice: sa bukana ng tarangkahan
  rationale: Natural at malinaw na katumbas ng ‘bukana/pasukan ng tarangkahan’ habang pinananatili ang dalawang sangkap ng Hebreo.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ
  choice: kasama ang animnaraang lalaki
  rationale: Iniuugnay ang animnaraang lalaki sa kinaroroonan ng pari, gaya ng hinihingi ng daloy ng sugnay.
- source_word: הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: nasasandatahan para sa digmaan
  rationale: Likas na Filipino para sa pagiging nakapulupot o nasangkapan ng mga kagamitang pandigma, nang hindi gumagamit ng lipas na literalismo.
