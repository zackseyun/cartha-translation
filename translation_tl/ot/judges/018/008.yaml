  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: tl
  text: At dumating sila sa kanilang mga kapatid[a] sa Zora at Estaol, at sinabi ng kanilang mga kapatid sa kanila, “Ano ang masasabi ninyo?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga kamag-anak.” Ang salitang Hebreo para sa “mga kapatid” ay maaari ring tumukoy sa mga kamag-anak o kapwa kasapi ng angkan o lipi, hindi lamang sa mga tunay na magkakapatid.
    reason: lexical_alternative
  - marker: b
    text: Napakaikli at eliptikal ng tanong sa Hebreo—sa literal, “Ano, kayo?” Maaari itong humingi ng kanilang ulat o magtanong tungkol sa kanilang kalagayan, nang hindi tinutukoy kung alin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Pagkatapos, dumating sila
  rationale: Ang wayyiqtol ng בוא ay nagpapatuloy sa salaysay. Likas sa makabagong Tagalog ang “Pagkatapos” bilang panandang pagkakasunod-sunod, habang pinananatili ng “dumating” ang payak na diwa ng pandiwa.
- source_word: אֶל אֲחֵיהֶם
  choice: sa kanilang mga kapatid
  rationale: Maaaring tumukoy ang אָח sa tunay na kapatid o sa mas malawak na kamag-anak at mga kasapi ng angkan. Pinananatili sa pangunahing teksto ang kongkretong “mga kapatid,” at nililinaw sa talababa ang mas malawak na posibilidad.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: Zora at Estaol
  rationale: Mga pangalan ito ng lugar, kaya isinalin ang baybay ayon sa likas na anyong Tagalog sa halip na isalin ang kahulugan.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: Tinanong sila ng kanilang mga kapatid
  rationale: Bagaman literal na “sinabi,” nagpapakilala rito ang pandiwa ng isang tuwirang tanong. Ang “tinanong” ay natural sa Tagalog at pinananatili ang tahasang simuno na “kanilang mga kapatid.”
- source_word: מָה אַתֶּם
  choice: Ano ang balita ninyo?
  rationale: Napakaikli at eliptikal ng Hebreo, sa literal ay “Ano, kayo?” Sa konteksto, humihingi ang mga kamag-anak ng ulat mula sa mga espiya. Ang salin ay malinaw at natural ngunit ipinapaliwanag sa talababa na hindi tahasang binabanggit sa Hebreo ang “balita.”
