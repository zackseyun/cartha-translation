base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: tl
  text: Nagalak ang puso ng pari, at kinuha niya ang efod, ang mga diyus-diyosan ng sambahayan[a], at ang inukit na imahen[b], at pumasok siya sa gitna ng mga tao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga terafim.” Ang salitang Hebreo ay tumutukoy sa mga bagay na ginagamit sa kulto ng sambahayan o sa mga diyos ng sambahayan.
    reason: lexical_alternative
  - marker: b
    text: O “diyus-diyosan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: Nagalak ang puso ng pari
  rationale: Pinananatili ang Hebreong idyoma, na literal na nagsasabing naging mabuti o masaya ang puso ng pari, habang malinaw at marangal pa rin sa modernong Filipino.
- source_word: הָאֵפוֹד
  choice: ang efod
  rationale: Teknikal na katawagang pangkulto ito na walang maikli at ganap na katumbas sa Filipino, kaya ginamit ang nakasanayang transliterasyon.
- source_word: הַתְּרָפִים
  choice: ang mga diyus-diyosan ng sambahayan
  rationale: Tumutukoy ang terafim sa mga bagay o diyos na ginagamit sa kulto ng sambahayan. Malinaw sa karaniwang mambabasa ang saling ito nang hindi itinatago ang pangmaramihang anyo ng Hebreo.
- source_word: הַפָּסֶל
  choice: ang inukit na imahen
  rationale: Ipinahihiwatig ng salita ang isang imaheng ginawa sa pamamagitan ng pag-ukit. Mas tiyak ito kaysa sa pangkalahatang “diyus-diyosan” at mas natural kaysa sa makalumang pananalita.
- source_word: בְּקֶרֶב הָעָם
  choice: sa gitna ng mga tao
  rationale: Pinananatili nito ang kilos patungo sa loob o kalagitnaan ng pangkat, hindi lamang ang pangkalahatang diwang “kasama ng mga tao.”
theological_decisions: []
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Pinanatili ang Hebreong idyoma tungkol sa puso at ang teknikal na terminong “efod.” Inilipat ang unang talababa sa “mga diyus-diyosan ng sambahayan,” kung saan ito wastong nauugnay, sa halip na sa pariralang tungkol sa galak ng pari.
