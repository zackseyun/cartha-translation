  yaml_path: translation/ot/judges/018/004.yaml
  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: tl
  text: Sinabi niya sa kanila, “Ganito at ganoon[a] ang ginawa ni Mikas para sa akin. Inupahan niya ako, at naging pari niya ako.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ganito at ganito”; isang idyomang Hebreo na bumubuod sa mga nauna nang inilarawang ginawa nang hindi na inuulit ang mga iyon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Sinabi niya sa kanila
  rationale: Likas na salin ng panimulang tugon sa salaysay; ipinahihiwatig na ng daloy sa Filipino ang pagkakasunod ng pangyayari kahit hindi isalin nang hiwalay ang וַ bilang “at.”
- source_word: כָּזֹה וְכָזֶה
  choice: Ganito at ganoon
  rationale: Pinananatili ang Hebreong idyoma na pahapyaw na bumubuod sa mga bagay na nauna nang inilahad, nang hindi inuulit ang mga detalye.
- source_word: עָשָׂה לִי
  choice: ang ginawa sa akin
  rationale: Ang עשה na may לִי ay tumutukoy sa ginawa ni Mikas para sa Levita o may kaugnayan sa kaniya; natural sa Filipino ang “ginawa sa akin” sa ganitong pagbubuod.
- source_word: מִיכָה
  choice: Mikas
  rationale: Isinalin ang pangalang Hebreo ayon sa karaniwang anyong biblikal sa Filipino.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: Inupahan niya ako
  rationale: Tuwirang ipinahahayag ang pagkuha sa kaniya kapalit ng upa o sahod.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: at naging pari niya ako
  rationale: Ang “naging” ay angkop sa pagpasok ng Levita sa isang bagong tungkulin, at ang “pari niya” ay natural na nagpapakita ng personal na paglilingkod kay Mikas.
theological_decisions:
- issue: Kalikasan ng pagiging pari sa isang di-regular na kaayusang panrelihiyon
  choice: pari niya
  alternative: pari para sa kaniya
  rationale: Ipinakikita ng לוֹ לְכֹהֵן na naglingkod ang Levita kay Mikas bilang pari. Hindi hinahatulan o pinagtitibay ng salin ang pagiging lehitimo ng kaayusang ito; pinananatili lamang nito ang tensiyong nasa salaysay.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang maikling anyo ng sagot at ang di-tiyak na pagbubuod ng Hebreong idyoma.
