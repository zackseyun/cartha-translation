base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: tl
  text: Sinabi sa kanila ng pari, “Humayo kayong payapa. Nasa harap ni Yahweh ang daang inyong tinatahak.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ang inyong daan ay nasa paningin ni Yahweh.” Hindi kinakailangang nangangahulugan ang pariralang ito na tahasang sinasang-ayunan ng Diyos ang kanilang paglalakbay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Likas na pagsulong ng salaysay ang wayyiqtol; sapat ang payak na “Sinabi” sa makabagong Tagalog.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Tiyak na pangngalan ito na tumutukoy sa paring nabanggit na sa konteksto.
- source_word: לְכוּ לְשָׁלוֹם
  choice: Humayo kayong payapa
  rationale: Pinananatili ang anyong utos at ang pagbati o basbas sa pag-alis, sa marangal at natural na Tagalog.
- source_word: נֹכַח יְהוָה
  choice: nasa harap ni Yahweh
  rationale: Tuwirang pinananatili ang larawang ang kanilang daan ay nasa harap o paningin ni Yahweh, nang hindi dinaragdagan ng tahasang pagsang-ayon o pangako ng tagumpay.
- source_word: דַּרְכְּכֶם
  choice: ang daang inyong tinatahak
  rationale: Ang “daan” ay malapit sa literal na kahulugan at, kasama ng “tinatahak,” malinaw na tumutukoy sa kanilang paglalakbay.
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: inyong tinatahak
  rationale: Natural na inilalarawan sa Tagalog ang paglakad o paglalakbay sa isang daan habang pinananatili ang larawan ng Hebreo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
theological_decisions:
- issue: Diin ng pahayag ng pari tungkol kay Yahweh at sa paglalakbay ng mga Danita
  choice: “Nasa harap ni Yahweh ang daang inyong tinatahak.”
  alternative: “Sang-ayon si Yahweh sa inyong paglalakbay” o “Iniingatan ni Yahweh ang inyong paglalakbay.”
  rationale: Pinakamalinaw na ipinahahayag ng Hebreong נֹכַח יְהוָה na ang kanilang daan ay nasa harap o paningin ni Yahweh. Hindi nito tahasang sinasabing sinasang-ayunan niya iyon o ginagarantiyahan ang tagumpay, kaya pinananatili ang tensiyong teolohikal.
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “humayo” upang mapanatili ang tono ng utos at basbas, at ang “daang inyong tinatahak” upang maging natural habang malapit sa larawang Hebreo.
