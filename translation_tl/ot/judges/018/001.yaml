  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: tl
  text: Noong mga araw na iyon, walang hari sa Israel. Noong mga araw na iyon, ang lipi ni Dan ay naghahanap ng lupaing mana na maaari nilang tirhan, sapagkat hanggang sa araw na iyon ay wala pang lupang napunta sa kanila bilang mana sa mga lipi ng Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi pa nahulog sa kanila ang mana.” Ang “nahulog” ay idyomang tumutukoy sa lupang naibahagi o naitalaga sa isang lipi bilang mana.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: walang hari sa Israel
  rationale: Likas at tuwirang salin ng pahayag na eksistensiyal at pampolitika, nang walang idinagdag na paghatol tungkol sa monarkiya.
- source_word: שֵׁבֶט הַדָּנִי
  choice: ang lipi ni Dan
  rationale: Karaniwang tawag sa modernong Tagalog para sa pangkat pantribo na nagmula kay Dan; mas natural kaysa sa literal na 'lipi ng mga Danita.'
- source_word: מְבַקֵּשׁ לוֹ
  choice: ay naghahanap ... na matitirhan nila
  rationale: Ipinapakita ng pandiwaring Hebreo ang nagpapatuloy na paghahanap. Ginamit ang maramihang panghalip ayon sa kolektibong kahulugan ng 'lipi,' bagaman isahan ang anyong Hebreo.
- source_word: נַחֲלָה
  choice: lupaing mamanahin
  rationale: Sa konteksto, tumutukoy ito sa teritoryong inilaan bilang minanang pag-aari ng lipi; nililinaw ng 'lupain' ang kahulugan nang pinananatili ang diwa ng mana.
- source_word: לָשֶׁבֶת
  choice: na matitirhan
  rationale: Natural na Tagalog para sa layuning manirahan o mamayan sa isang teritoryo.
- source_word: כִּי לֹא נָפְלָה לוֹ ... בְּנַחֲלָה
  choice: sapagkat ... wala pang lupaing mamanahin na napunta sa kanila
  rationale: Ang נפל ay idyoma ng pagkakabahagi sa pamamagitan ng palabunutan. Ang 'napunta sa kanila' ay madaling maunawaan, habang ang talababa ay nagpapanatili sa literal na larawan.
- source_word: עַד הַיּוֹם הַהוּא
  choice: hanggang sa araw na iyon
  rationale: Pinananatili ang retrospektibong pananaw sa panahon ng salaysay.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: sa gitna ng mga lipi ng Israel
  rationale: Malapit sa Hebreo at malinaw na tumutukoy sa lugar ng Dan sa kabuuang paghahati ng lupain sa mga lipi.
theological_decisions:
- issue: Ang pahayag na 'walang hari sa Israel'
  choice: Pinanatili bilang tuwirang obserbasyong historikal at pampolitika.
  alternative: Basahin ito bilang hayagang pagpuri sa monarkiya o bilang tahasang paghatol sa panahon ng mga hukom.
  rationale: Sinasabi lamang ng Hebreo na walang hari; hindi dapat dagdagan ng salin ang teolohikal o pampolitikang hatol na hindi tahasang nasa talata.
- issue: Ang tila tensiyon sa pahayag na wala pang mana ang Dan bagaman may naitalagang teritoryo sa ibang bahagi ng aklat
  choice: Pinanatili ang pahayag ng salaysay at ipinaliwanag sa talababa ang posibleng diwa ng hindi pa aktuwal na nakakamkam o matatag na napapasakanila.
  alternative: Baguhin ang teksto upang sabihing walang anumang naitalaga sa Dan.
  rationale: Ang Hebreo ay may wikang mana at pagkakabahagi ngunit maaaring ilarawan ang praktikal na kawalan ng mapaninirahang pag-aari. Dapat panatilihin ang tensiyon sa halip na tahimik na lutasin.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang 'lupaing mamanahin' upang maging malinaw ang pantribong kahulugan ng נַחֲלָה, at ang 'lipi ni Dan' bilang natural na katawagan. Iniba nang bahagya ang ikalawang temporal na parirala sa 'Nang panahong iyon' upang maiwasan ang mabigat na pag-uulit, habang pinananatili ang pag-uulit ng Hebreo sa diwa.
