base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: tl
  text: Nagpatuloy sa kanilang lakad ang mga anak ni Dan. Nang makita ni Mikas na mas malakas sila kaysa sa kanya, tumalikod siya at bumalik sa kanyang bahay.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili ang pormal na pananalitang pampamilya sa Hebreo, na rito ay tumutukoy sa mga kabilang sa lipi ni Dan.
- source_word: לְדַרְכָּם
  choice: nagpatuloy sa kanilang lakad
  rationale: Likas na salin sa Filipino ng pagpapatuloy nila sa kanilang daan o paglalakbay.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: mas malakas sila kaysa sa kanya
  rationale: Tuwirang pinananatili ang paghahambing na ipinahahayag ng חזק kasama ng מן, sa halip na dagdagan ito ng diwang 'napakalakas para sa kanya.'
- source_word: וַיִּפֶן
  choice: tumalikod siya
  rationale: Ipinahahayag ang hiwalay na kilos ng pagharap sa kabilang direksiyon bago ang mismong pagbabalik.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: bumalik sa kanyang bahay
  rationale: Pinananatili ang diwa ng pagbabalik sa שׁוב at ang tahasang patutunguhang 'sa kanyang bahay.'
- source_word: בֵּיתוֹ
  choice: kanyang bahay
  rationale: Ang 'bahay' ang tuwirang katumbas ng בַּיִת at hindi nito pinapalitan ang salita ng mas idyomatikong 'umuwi.'
