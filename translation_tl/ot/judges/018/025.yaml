revisions:
- from: Sinabi sa kanya ng mga anak ni Dan, “Huwag mong iparinig sa amin ang boses mo, baka salakayin kayo ng mga lalaking mapait ang kalooban[a], at mawalan ka ng buhay, pati ang iyong sambahayan.”
  to: At sinabi sa kanya ng mga anak ni Dan, “Huwag mong iparinig sa amin ang tinig mo, baka salakayin kayo ng mga lalaking mapait ang kalooban[a], at mawalan ka ng buhay, gayundin ang mga nasa sambahayan mo.”
  rationale: Idinagdag ang “At” upang katawanin ang pang-ugnay na waw sa pagsasalaysay. Pinalitan ang “boses” ng “tinig” para sa mas angkop na rehistro. Nilinaw ang pangwakas na banta bilang pagkawala ng buhay ng mga nasa sambahayan, nang hindi ipinipilit kung ilan o sino ang tinutukoy ng kolektibong Hebreong parirala.
