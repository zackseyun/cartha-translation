base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: tl
  text: At sinabi sa kanya ng mga anak ni Dan, “Huwag mong iparinig sa amin ang tinig mo, baka salakayin kayo ng mga lalaking mapait ang kalooban[a], at mawalan ka ng buhay, gayundin ang mga nasa sambahayan mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mababangis na lalaki,” “mga lalaking desperado,” o “mga lalaking may mapait na espiritu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili ang pormal na katawagang Hebreo sa tribo at malinaw pa rin ito sa modernong Tagalog.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Huwag mong iparinig sa amin ang boses mo
  rationale: Pinananatili ang larawan ng pagpaparinig ng tinig habang likas na ipinahihiwatig ang babalang tumigil siya sa pagsasalita laban sa kanila.
- source_word: פֶּן
  choice: baka
  rationale: Likas na Tagalog na naghahayag ng nagbabantang maaaring mangyari bilang bunga ng patuloy niyang pagsasalita.
- source_word: יִפְגְּעוּ בָכֶם
  choice: salakayin kayo
  rationale: Sa konteksto, ang pandiwa ay tumutukoy sa marahas at mapanganib na pagharap o paglusob.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: mga lalaking mapait ang kalooban
  rationale: Malapit sa imaheng Hebreo ng kapaitan ng nephesh at hindi nito nilulutas nang labis ang ambiguwidad kung sila ay mababangis, desperado, o nagngangalit.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: mawalan ka ng buhay
  rationale: Isinasalin ang idyoma ayon sa kahulugan nito rito—ang pagkamatay o pagkawala ng buhay—sa halip na literal na ‘tipunin ang buhay.’
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: pati ang iyong sambahayan
  rationale: 'Natural na kolektibong pahayag sa Tagalog: sa pagbabanta sa sambahayan, malinaw na buhay ng mga kabilang dito ang nakataya, nang hindi nagdaragdag ng di-kailangang pag-uulit.'
