  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: tl
  text: Kaya nagsugo ang mga anak ni Dan, mula sa kanilang angkan, ng limang lalaki na pinili mula sa kanilang buong pangkat—mga lalaking may kakayahan[a] mula sa Zora at Estaol—upang tiktikan ang lupain at siyasatin ito[b]. Sinabi nila sa kanila, “Humayo kayo at siyasatin ninyo ang lupain.” Kaya nakarating sila sa kabundukan ng Efraim, hanggang sa bahay ni Mikas[c], at doon sila nagpalipas ng gabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “mga magigiting na lalaki” o “mga lalaking malalakas.”
    reason: Pinahihintulutan ng בְּנֵי חַיִל ang mga diwang kakayahan, lakas, at kagitingan.
  - marker: b
    text: Maaari ring “masusing suriin” o “saliksikin.”
    reason: Ang חקר ay tumutukoy sa maingat at masusing pagsusuri.
  - marker: c
    text: Ang literal na Hebreo ay “bahay ni Mikas”; maaari rin itong tumukoy sa buong sambahayan o tirahang kompleks niya.
    reason: Nililinaw ang posibleng mas malawak na kultural na saklaw ng salitang “bahay.”
lexical_decisions:
- source_word: בְנֵי דָן
  choice: mga anak ni Dan
  rationale: Pinananatili ang Hebreong pantribong idyomang ‘mga anak ni Dan’ sa paraang malinaw at likas pa rin sa Filipino.
- source_word: מִמִּשְׁפַּחְתָּם ... מִקְצוֹתָם
  choice: mula sa buong angkan nila
  rationale: Ipinahahayag ang pagpili ng limang lalaki mula sa kabuuan ng kanilang pangkat-kamag-anakan. Ang ‘angkan’ ay mas angkop kaysa makabagong ‘pamilya’ o sa mas malawak na ‘lipi.’
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: mga lalaking may kakayahan
  rationale: Sa gawaing pagmamanman, binibigyang-diin nito ang kanilang lakas, kahusayan, at pagiging karapat-dapat sa tungkulin nang hindi nililimitahan ang parirala sa tapang sa pakikipagdigma.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: mula sa Zora at Estaol
  rationale: Ginamit ang malinaw na transliterasyong Filipino ng mga pangalan ng lugar.
- source_word: לְרַגֵּל
  choice: upang manmanan
  rationale: Ang ‘manmanan’ ay likas na Filipino para sa palihim o maingat na pagmamasid sa isang lupaing nilalayong sakupin.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: siyasatin / siyasatin
  rationale: Pinananatili ang pag-uulit ng ugat na חקר at ang diwa ng masusing pagsusuri, na kaiba ngunit kaugnay ng pagmamanman.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Tumutukoy ito sa teritoryong kanilang sinusuri, kaya mas angkop ang ‘lupain’ kaysa pangkalahatang ‘lupa.’
- source_word: הַר אֶפְרַיִם
  choice: kabundukan ng Efraim
  rationale: Tinutukoy ng parirala ang mataas na rehiyon ng Efraim, hindi ang iisang bundok.
- source_word: עַד בֵּית מִיכָה
  choice: hanggang sa bahay ni Mikas
  rationale: Pinananatili ng ‘hanggang sa’ ang saklaw ng paglalakbay at ng ‘bahay’ ang konkretong Hebreong salita, habang iniiwan ang posibilidad na mas malawak na sambahayan o tirahang kompleks ang tinutukoy.
- source_word: וַיָּלִינוּ שָׁם
  choice: doon sila nagpalipas ng gabi
  rationale: Malinaw at natural na ipinahahayag ang kahulugan ng panunuluyan nang magdamag.
