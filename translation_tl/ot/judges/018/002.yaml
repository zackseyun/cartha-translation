translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang pantribong idyomang ‘mga anak ni Dan,’ ngunit gumamit ng likas na mga pandiwang ‘manmanan’ at ‘siyasatin.’ Ang gitling na pariralang naglalarawan sa limang lalaki ay tumutulong na luminaw ang masinsing ayos ng Hebreo.
