  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: tl
  text: Sinabi niya[a], “Kinuha ninyo ang mga diyos ko na ginawa ko, pati ang pari, at umalis kayo. Ano pa ang natira sa akin? Kaya paano ninyo masasabi sa akin, ‘Ano ang problema mo?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “ang diyos ko” o “ang mga imahen kong panrelihiyon.” Maaaring isahan o maramihan ang salitang Hebreo sa ilang konteksto, ngunit mas pinapaboran dito ng mas malawak na konteksto ang “mga diyos ko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: ang mga diyos ko
  rationale: Maaaring anyong isahan o maramihan ang salita sa ilang konteksto, ngunit ipinapahiwatig ng mas malawak na salaysay tungkol sa mga imaheng panrelihiyon ni Mikas ang maramihang diwa. Pinananatili rin nito ang kabalintunaan ng mga diyos na ginawa ng tao.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: na ginawa ko
  rationale: Tuwirang kamag-anak na sugnay ito na naglalarawan sa “mga diyos ko.” Likas at malinaw ang “ginawa” para sa עשה at pinananatili ang diin na gawa ng tao ang mga ito.
- source_word: לְקַחְתֶּם
  choice: Kinuha ninyo
  rationale: Tuwirang isinasalin ang qatal na ikalawang panauhang maramihan; malinaw sa kasunod na tanong na nananatili ang bunga ng pagkuha.
- source_word: הַכֹּהֵן
  choice: ang pari
  rationale: Pinananatili ang katiyakan ng pantukoy; tumutukoy ito sa partikular na paring dating kay Mikas.
- source_word: וַתֵּלְכוּ
  choice: at umalis kayo
  rationale: Pinananatili ang tahasang ikalawang panauhang maramihan at ang pagkakasunod ng mga kilos.
- source_word: וּמַה לִּי עוֹד
  choice: Ano pa ang natira sa akin?
  rationale: Natural na Filipino para sa idyomang nagpapahayag ng lubos na pagkakaitan o pagkawala.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Kaya paano ninyo masasabi sa akin
  rationale: Ipinapahayag ang mapanumbat at nagagalit na puwersa ng idyomatikong Hebreo, habang inuugnay ang tanong sa naunang reklamo.
- source_word: מַה לָּךְ
  choice: Ano ang problema mo?
  rationale: Karaniwan at natural na katumbas sa modernong Filipino ng tanong kung ano ang bumabagabag o mali sa isang tao.
theological_decisions:
- issue: Pagpapakahulugan sa אֱלֹהַי sa konteksto ng mga bagay na ginagamit sa sambahayan para sa kulto
  choice: ang mga diyos ko
  alternative: ang diyos ko / ang aking diyos o mga diyos / ang mga imahen kong panrelihiyon
  rationale: Ang leksikal na kahulugan ay “diyos/mga diyos,” at tinutukoy ng konteksto ang mga pisikal na bagay na panrelihiyon. Pinananatili ng “mga diyos ko” ang pananalita at kabalintunaan ng Hebreo nang hindi agad pinapalitan ng mas interpretatibong “mga diyus-diyosan.”
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang “ninyo/kayo” upang mapanatili ang ikalawang panauhang maramihan at ang tuwirang paghaharap ni Mikas sa mga Danita.
