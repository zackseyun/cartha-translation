base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: tl
  text: Kaya itinayo nila para sa kanilang sarili ang nililok na imahen[a] na ginawa ni Mikas, sa buong panahong nasa Silo ang bahay ng Diyos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “diyus-diyosan.” Ang salitang Hebreo ay tumutukoy sa isang nililok na imaheng ginagamit sa pagsamba; pinananatili ng “nililok na imahen” ang konkretong diwa nito, samantalang mas tahasang ipinapakita ng “diyus-diyosan” ang gamit nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: itinayo nila para sa kanilang sarili
  rationale: Ang שׂים ay ‘ilagay/itayo’; sa konteksto ng pagsamba, malinaw na ipinahihiwatig ng ‘itinayo’ ang paglalagay nito bilang imaheng panrelihiyon, habang pinananatili ng ‘para sa kanilang sarili’ ang לָהֶם.
- source_word: פֶּסֶל
  choice: nililok na imahen
  rationale: Pinananatili nito ang konkretong diwa ng isang imaheng hinubog o inukit para sa kultikong gamit, nang hindi agad pinapalitan ng mas interpretatibong ‘diyus-diyosan.’
- source_word: מִיכָה
  choice: Mikas
  rationale: Ginamit ang karaniwang anyong Filipino ng pangalang biblikal.
- source_word: אֲשֶׁר עָשָׂה
  choice: na ginawa niya
  rationale: Likas sa Filipino ang payak na aspektong naganap; malinaw na sa daloy na nauna ang paggawa sa pagtatayo.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: sa buong panahong nasa
  rationale: Natural na modernong Filipino na nagpapanatili sa duratibong kahulugan ng parirala.
- source_word: בֵּית הָאֱלֹהִים
  choice: ang bahay ng Diyos
  rationale: Tuwirang salin na hindi nagdaragdag ng paliwanag o polemikong wala sa Hebreo.
- source_word: בְּשִׁלֹה
  choice: sa Silo
  rationale: Karaniwang anyong Filipino ng pangalan ng lugar, kasama ang angkop na pang-ukol.
theological_decisions:
- issue: Ang בֵּית הָאֱלֹהִים bilang kinikilalang sentro ng pagsamba sa Silo habang umiiral ang imahen sa Dan
  choice: ang bahay ng Diyos
  alternative: ang santuwaryo ng Diyos
  rationale: Pinananatili ng ‘bahay ng Diyos’ ang mismong larawan at teolohikal na tensiyon ng Hebreo, sa halip na tahasang ipaliwanag ang pagiging lehitimo ng isang sentro laban sa isa.
translation_notes:
  register: Modernong Filipino Tagalog na dignified at madaling maunawaan. Pinili ang ‘nililok na imahen’ kaysa sa mas lumang ‘larawang inanyuan’ o agad na interpretatibong ‘diyus-diyosan.’
