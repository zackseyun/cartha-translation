base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: tl
  text: Sinabi nila, “Bumangon kayo, at lusubin natin sila, sapagkat nakita namin ang lupain, at talagang napakaganda nito. Tahimik lang kayo—huwag kayong magpabagal sa pagpunta, pagpasok, at pag-angkin sa lupain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: Tumindig kayo!
  rationale: Isang panawagan sa pangkat na kumilos; pinanatili ang larawan ng pagtindig at ang mariing himig.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: Salakayin natin sila
  rationale: Ang literal na ‘umahon tayo laban sa kanila’ ay idyomatikong tumutukoy sa paglusob; mas natural at malinaw ito sa modernong Tagalog.
- source_word: מַחְשִׁים
  choice: nananatili kayong walang ginagawa
  rationale: Bagaman ugat nito ang pananahimik, sa konteksto ay tumutukoy ito sa hindi pagkilos; iniwasan ang literal na ‘tahimik’ na maaaring malabo sa Tagalog.
- source_word: אַל תֵּעָצְלוּ
  choice: Huwag kayong mag-atubili
  rationale: Ipinahahayag ang babalang huwag maging mabagal o pabaya sa pagkilos nang hindi gumagamit ng di-natural na ‘huwag maging tamad’ sa ganitong konteksto.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: humayo, pumasok, at angkinin
  rationale: 'Pinanatili ang tatlong sunod-sunod na infinitive at ang pag-usad ng kilos: pagpunta, pagpasok, at pagkuha ng lupain bilang pag-aari.'
