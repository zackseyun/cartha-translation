translation_notes:
  register: Modernong Filipino Tagalog na tuwiran, marangal, at madaling maunawaan. Pinanatili ang masiglang panawagan at ang magkakasunod na utos nang hindi nagpapasok ng denominasyonal na pagpapakahulugan.
