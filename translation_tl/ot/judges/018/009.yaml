revisions:
- from: Sinabi nila, “Tumindig kayo! Salakayin natin sila, sapagkat nakita namin ang lupain, at napakaganda nga nito. Bakit nananatili kayong walang ginagawa? Huwag kayong mag-atubiling humayo, pumasok, at angkinin ang lupain.”
  to: Sinabi nila, “Bumangon kayo, at lusubin natin sila, sapagkat nakita namin ang lupain, at talagang napakaganda nito. Tahimik lang kayo—huwag kayong magpabagal sa pagpunta, pagpasok, at pag-angkin sa lupain.”
  rationale: Ibinalik ang anyong pahayag ng “at kayo ay tahimik” at iningatan ang sunod-sunod na pagpunta, pagpasok, at pag-angkin. Ang “lusubin natin sila” ay nananatiling likas na Tagalog para sa panawagang kumilos laban sa mga naninirahan doon.
