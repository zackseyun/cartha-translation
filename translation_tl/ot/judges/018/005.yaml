  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: tl
  text: At sinabi nila sa kanya, “Sumangguni ka nga sa Diyos, upang malaman namin kung magtatagumpay ang lakad na aming tinatahak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: At sinabi nila sa kanya
  rationale: Pinananatili ng “At” ang karaniwang daloy ng salaysay na ipinahihiwatig ng wayyiqtol, nang hindi dinaragdagan ng mas tiyak na ugnayang temporal.
- source_word: שְׁאַל נָא
  choice: Isangguni mo nga
  rationale: Sa konteksto ng paghingi ng patnubay na mula sa Diyos, likas sa modernong Tagalog ang “isangguni”; ipinahahayag ng “nga” ang magalang at pinalambot na pakiusap ng נָא.
- source_word: בֵאלֹהִים
  choice: sa Diyos
  rationale: Ang isahang kahulugan na “Diyos” ang pinakanababagay sa agarang konteksto. Ang pang-ukol ay idyomatiko kasama ng שׁאל at tumutukoy sa paghingi ng pasiya o patnubay mula sa Diyos.
- source_word: וְנֵדְעָה
  choice: upang malaman namin
  rationale: Malinaw nitong naihahayag ang layuning ipinahihiwatig ng cohortative kasunod ng pakiusap.
- source_word: הֲתַצְלִיחַ
  choice: kung magtatagumpay
  rationale: Ang Hiphil ng צלח ay tumutukoy sa pagtatagumpay o pagiging matagumpay; ang “magtatagumpay” ay malinaw at hindi nililimitahan sa kasaganaang materyal.
- source_word: דַּרְכֵּנוּ
  choice: ang lakad
  rationale: Ang דֶּרֶךְ ay literal na “daan” ngunit dito ay tumutukoy sa isinasagawang paglalakbay o misyon. Ang “lakad” ay natural sa Tagalog at maaari ring magpahiwatig ng pakay o ekspedisyon.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: na aming tinatahak
  rationale: Pinananatili ng “tinatahak” ang larawan ng paglakad sa isang daan habang nagbibigay ng natural at dignidad na Tagalog.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים
  choice: Diyos (isahan)
  alternative: mga diyos
  rationale: Bagaman maaaring anyong maramihan ang אֱלֹהִים, ang isahang kahulugan ang higit na natural sa konteksto ng paghingi ng patnubay sa pamamagitan ng pari. Isa itong pasiyang leksikal at kontekstuwal, hindi pagdaragdag ng doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, natural, at marangal. Ginamit ang “lakad na aming tinatahak” upang pagsamahin ang kontekstuwal na diwa ng ekspedisyon at ang Hebreong larawan ng daang nilalakaran.
