  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: tl
  text: Pagdating ninyo roon, daratnan ninyo ang isang bayang namumuhay nang panatag[a], at malawak ang lupain[b]; sapagkat ibinigay na ito ng Diyos sa inyong kamay, isang lugar na walang kakulangan sa anumang bagay na nasa lupain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “isang bayang panatag” o “isang bayang walang kamalay-malay.” Inilalarawan ng Hebreo ang mga taong nabubuhay na may pakiramdam ng katiwasayan.
    reason: lexical_alternative
  - marker: b
    text: Literal, “malawak ang mga kamay,” isang idyomang Hebreo na nangangahulugang maluwang o malawak ang lupain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/בֹאֲ/כֶם ... תָּבֹאוּ
  choice: Pagdating ninyo, makikita ninyo
  rationale: Ang infinitive construct na may hulapi at ang kasunod na finite verb ay tumutukoy sa kanilang pagdating at pagharap sa bayan. Sa Filipino, iniiwasan nito ang hindi likas na pag-uulit ng “darating,” habang malinaw na ipinahihiwatig ang makikita nila sa pagdating.
- source_word: עַם בֹּטֵחַ
  choice: isang bayang namumuhay nang panatag
  rationale: Ang בֹּטֵחַ ay nagsasaad ng katiwasayan o tiwala. Pinananatili ng salin ang kanilang pakiramdam ng kaligtasan nang hindi ito tahasang binibigyang-kahulugang “walang kamalay-malay.”
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: Malawak ang lupain
  rationale: Ang literal na “malawak ang mga kamay” ay isang idyomang Hebreo para sa maluwang o malawak na lupain. Ang “malawak” ang likas at tumpak na katumbas sa Filipino.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: ibinigay na ito ng Diyos sa inyong kamay
  rationale: Ang perfect verb ay naglalahad sa pagkakaloob bilang tiyak at naganap na sa pananaw ng mga nagsasalita. Pinanatili ang idyomang “sa inyong kamay,” na mauunawaan bilang pagpapasailalim sa kanilang kapangyarihan.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: Lugar iyon na hindi nagkukulang
  rationale: Ang מָקוֹם ay “lugar,” at ang מַחְסוֹר ay kakulangan o pangangailangan. Ang parirala ay natural na nagpapahayag ng kasaganaan.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: sa anumang bagay na matatagpuan sa lupain
  rationale: Sa konteksto, ang הָאָרֶץ ay ang partikular na lupaing tinutukoy, hindi ang buong daigdig. Ipinahahayag ng parirala na taglay ng lugar ang lahat ng karaniwang makukuha sa lupain.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa pananalita ng mga espiya
  choice: Diyos
  alternative: mga diyos / isang diyos
  rationale: May anyong pang-isahan ang pandiwa, at ang konteksto ay tumutukoy sa Diyos bilang siyang nagbigay ng lupain. Hindi kailangan o pinahihintulutan ng balarila rito ang pangmaramihang salin.
- issue: Tiyak na pagkakaloob ng lupain
  choice: ibinigay na
  alternative: ibinibigay / ibibigay
  rationale: Pinananatili ng anyong ganap ng pandiwang Hebreo ang tiyak na pagkakaloob ayon sa pahayag ng mga espiya, nang hindi nagdaragdag ng hiwalay na doktrinal na paliwanag.
translation_notes:
  register: Makabagong Filipino na malinaw at marangal. Ginamit ang “bayan” para sa pangkat ng mga taong naninirahan doon at “lupain” para sa teritoryo. Pinanatili ang idyomang “sa inyong kamay,” ngunit isinalin nang tuwiran ang idyoma tungkol sa lawak ng lupain.
