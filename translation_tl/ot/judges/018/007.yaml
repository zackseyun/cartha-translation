  source_fidelity: 'Maayos ang pangkalahatang pagsasalin ng talata: napanatili ang Lais, ang panatag at tahimik na kalagayan ng mga naninirahan, ang pagkakalayo nila sa Sidon, at ang kawalan nila ng pakikitungo sa iba. Gayunman, ang “o naghahari sa kanila” ay nagdaragdag ng isang hiwalay na pandiwa at tuwirang object na wala sa mahirap na Hebreong parirala. Ang יוֹרֵשׁ עֶצֶר ay mas malapit na paglalarawan ng taong may awtoridad/kapangyarihan kaysa isa pang kilos na ‘naghahari.’'
  naturalness: Natural at angkop sa makabagong Filipino ang karamihan ng teksto. Ang “Walang may kapangyarihan sa lupain na magpapahiya sa kanila sa anumang paraan” ay mas malinaw at mas natural kaysa sa dating magkatuwang na “humihiya ... o naghahari.”
  terminology: Ang “Lais,” “mga taga-Sidon,” “kagawian,” “panatag,” at “pakikipag-ugnayan” ay angkop. Ang “may kapangyarihan” para sa mahirap na יוֹרֵשׁ עֶצֶר ay isang maingat na pangkontekstong salin, at nililinaw ng talababa ang kawalang-katiyakan.
