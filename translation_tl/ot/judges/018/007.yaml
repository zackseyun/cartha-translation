revisions:
- from: Pagkatapos, umalis ang limang lalaki at dumating sa Lais. Nakita nilang ang mga tagaroon ay namumuhay nang panatag, ayon sa kaugalian ng mga taga-Sidon[a]—tahimik at tiwasay. Walang sinumang nasa lupain na humihiya sa kanila sa anumang bagay o naghahari sa kanila.[b] Malayo sila sa mga taga-Sidon, at wala silang pakikipag-ugnayan kaninuman.[c]
  to: Pagkatapos, pumunta ang limang lalaki sa Lais. Nakita nila ang mga taong naninirahan doon na namumuhay nang panatag, ayon sa kagawian ng mga taga-Sidon[a]—tahimik at tiwasay. Walang may kapangyarihan sa lupain na magpapahiya sa kanila sa anumang paraan.[b] Malayo sila sa mga taga-Sidon, at wala silang pakikipag-ugnayan kaninuman.[c]
  rationale: Inayos ang mahirap na gitnang sugnay upang hindi ituring ang “naghahari sa kanila” bilang isang hiwalay at tiyak na pahayag ng Hebreo. Ang bagong anyo ay nagbibigay ng malamang na ugnayan ng ‘may kapangyarihan’ sa pagpapahiya, samantalang malinaw na itinatala ng talababa ang kahirapan at ang hindi ganap na katiyakan ng parirala.
