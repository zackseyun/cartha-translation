base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: tl
  text: Pagkatapos, pumunta ang limang lalaki sa Lais. Nakita nila ang mga taong naninirahan doon na namumuhay nang panatag, ayon sa kagawian ng mga taga-Sidon[a]—tahimik at tiwasay. Walang may kapangyarihan sa lupain na magpapahiya sa kanila sa anumang paraan.[b] Malayo sila sa mga taga-Sidon, at wala silang pakikipag-ugnayan kaninuman.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Maaari ring isalin: “ayon sa paraan ng pamumuhay ng mga taga-Sidon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mahirap unawain ang Hebreo: sa mas literal na anyo, “walang nagpapahiya ng anuman sa lupain, na nagtataglay ng awtoridad.” Malamang na ang diwa ay walang taong may kapangyarihang magpahiya o manaig sa kanila.'
    reason: textual_or_lexical_difficulty
  - marker: c
    text: 'Maaari ring isalin: “wala silang anumang pakikitungo o pakikipag-alyansa kaninuman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: sa Lais
  rationale: Pangalan ng lugar na tinutumbasan sa karaniwang anyong Filipino; ang hulaping Hebreo ay nagsasaad ng direksiyon, kaya ginawang “sa Lais.”
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: namumuhay nang panatag
  rationale: Likas na Filipino para sa patuloy na pamumuhay na may seguridad, hindi lamang panandaliang kaligtasan.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: ayon sa kaugalian ng mga taga-Sidon
  rationale: Ang מִשְׁפָּט dito ay malamang na tumutukoy sa nakaugaliang paraan ng pamumuhay, hindi sa isang hatol na legal.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: tahimik at tiwasay
  rationale: Pinananatili ang magkatambal na paglalarawan at ang inuulit na diin ng Hebreo sa kapanatagan at kawalan ng pangamba.
- source_word: מַכְלִים דָּבָר
  choice: humihiya sa kanila sa anumang bagay
  rationale: Ipinahahayag ang Hiphil ng כלם bilang pagpapahiya o paglalagay sa kahihiyan, habang hindi nililimitahan sa isang tiyak na uri ng pang-aapi.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: naghahari sa kanila
  rationale: Napakahirap ng parirala; sa konteksto, malamang na tumutukoy ito sa isang may kapangyarihang pumipigil o nangingibabaw. Ang salin ay malinaw sa Filipino ngunit nilalagyan ng talababa upang mapanatili ang kawalang-katiyakan.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: Malayo sila sa mga taga-Sidon
  rationale: Tuwirang spatial na pahayag na nagpapaliwanag sa pagkakahiwalay at kahinaan ng Lais.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: wala silang pakikipag-ugnayan kaninuman
  rationale: Ang idyomang “walang salita/bagay kasama ng” ay tumutukoy sa kawalan ng ugnayan o pakikitungo; generic ang אָדָם kaya “kaninuman” ang likas na Filipino.
theological_decisions:
- issue: Paglalarawan sa kawalan ng namumuno o nangingibabaw sa Lais
  choice: “Walang sinumang nasa lupain na humihiya sa kanila sa anumang bagay o naghahari sa kanila,” na may talababa tungkol sa hirap ng Hebreo
  alternative: “Walang sinumang mapaniil na pinuno sa lupain”
  rationale: Hindi ginawang tahasang “mapaniil na pinuno” ang teksto dahil mas tiyak iyon kaysa sa mahirap at malabong Hebreong מַכְלִים דָּבָר ... יוֹרֵשׁ עֶצֶר.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga tagaroon” at “mga taga-Sidon” para sa likas na pagtukoy sa mga mamamayan; pinanatili ang mahinahong salaysay at ang tunay na kalabuan ng mahirap na sugnay sa gitna ng talata.
