  source_fidelity: Kailangang iwasto ang “pinuksa,” dahil mas tiyak itong nagsasaad ng lubos na paglipol kaysa sa malawak na pandiwang נכה (“sinaktan/hinampas”) sa Hebreo. Dapat ding isalin ang tahasang בָאֵשׁ, “sa apoy.”
  naturalness: Malinaw at makabago ang kabuuang Tagalog. Ang “sinaktan ... sa talim ng tabak” ay nananatiling natural sa salaysay habang iniiwasang igiit na walang natira o na lahat ay napatay.
  terminology: Ang “Mica,” “Lais,” “pari,” “tabak,” at “lungsod” ay angkop at pare-pareho. Ang “paring naglilingkod sa kanya” ay katanggap-tanggap na pagpapahayag ng paring kaugnay ni Mica, nang hindi ipinahihiwatig na pag-aari ang pari.
  issues:
