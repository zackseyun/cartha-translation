    issue: Ang “Pinuksa nila” ay mas malakas kaysa sa pandiwang Hebreo.
    rationale: Ang נכה ay maaaring mangahulugang manakit, manalo laban sa, o pumatay ayon sa konteksto. Bagaman marahas ang pariralang “sa talim ng tabak,” hindi kinakailangang igiit ng salin ang ganap na paglipol.
  - severity: low
    issue: Nawala ang tahasang “sa apoy” sa huling sugnay.
    rationale: Tahasan itong nasa Hebreo (בָאֵשׁ) at dapat panatilihin sa optimal-equivalence na salin.
