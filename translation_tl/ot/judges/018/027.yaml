base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: tl
  text: Kaya kinuha nila ang ginawa ni Mica[a] at ang paring naglilingkod sa kanya. Pagkatapos, lumusob sila sa Lais, laban sa mga taong namumuhay nang tahimik at panatag. Sinaktan nila ang mga ito sa talim ng tabak at sinunog ang lungsod sa apoy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring tumukoy ang “ang ginawa ni Mica” sa mga kagamitang pangsamba na ginawa niya (tingnan ang 17:4–5; 18:17–20).
    reason: referential_clarity
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: Kaya kinuha nila
  rationale: Ipinahahayag ng malayang panghalip ang diin sa gumaganap at ipinagpapatuloy ng waw ang salaysay; natural na naihahatid ng “Kaya ... nila” ang daloy at diin.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: ang ginawa ni Mica
  rationale: Tuwirang sinasalamin nito ang malawak na pariralang “kung ano ang ginawa ni Mica” nang hindi inuulit o tinutukoy nang higit sa teksto ang mga kagamitang pangkulto.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: at ang paring naglilingkod sa kanya
  rationale: Ang literal na “paring nasa kanya/para sa kanya” ay tumutukoy sa paring nakatalaga sa sambahayan at dambana ni Mica. Iniiwasan ng “naglilingkod sa kanya” ang modernong pahiwatig na pag-aari niya ang pari.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: Pagkatapos, lumusob sila sa Lais
  rationale: Sa kontekstong militar, ang בוא על ay pagdating laban sa isang lugar. Natural na ipinahahayag ng “lumusob” ang paglapit na may masamang hangarin, bagaman hindi nito pinagsasama ang kasunod na aktuwal na pagpatay.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: laban sa mga taong namumuhay nang tahimik at panatag
  rationale: 'Pinananatili nito ang dalawang paglalarawan: katahimikan o kawalan ng kaguluhan (שׁקט) at kapanatagan o seguridad (בטח), nang hindi idinaragdag ang mas interpretibong “walang kamalay-malay.”'
- source_word: וַיַּכּוּ אוֹתָם לְפִי חָרֶב
  choice: Pinuksa nila ang mga ito sa talim ng tabak
  rationale: Sa pormulang pandigma na may “talim/bibig ng tabak,” ang נכה ay tumutukoy sa nakamamatay na paglipol, kaya mas malinaw at natural ang “pinuksa” kaysa literal na “hinampas.” Ang “sa talim ng tabak” ay karaniwang katumbas ng idyomang Hebreo.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: at sinunog ang lungsod
  rationale: Natural sa Tagalog ang “sinunog ang lungsod”; likas nang kasama sa pandiwang “sinunog” ang gamit na apoy, kaya hindi kailangang ulitin ang “sa apoy” upang maihatid ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Mica” at “Lais” bilang natural na anyong Tagalog ng mga pangalan. Pinanatili ang maikli at matinding daloy ng salaysay at hindi nilagyan ng moral o teolohikal na komentaryong wala sa talata.
