base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: tl
  text: Umakyat sila at nagkampo sa Kiriat-jearim sa Juda. Kaya tinawag na Mahane-dan ang lugar na iyon hanggang sa araw na ito; naroon iyon sa kanluran ng Kiriat-jearim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O: nasa likod ng Kiriat-jearim.'
    reason: Ang Hebreong אַחֲרֵי ay literal na “sa likod ng”; maaari itong magsaad ng direksiyong kanluran sa sinaunang oryentasyong heograpikal.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Umakyat sila
  rationale: Pinananatili ang karaniwang heograpikal na diwa ng Hebreong עלה at natural ito sa makabagong Tagalog.
- source_word: וַיַּחֲנוּ
  choice: nagkampo
  rationale: Tuwirang ipinahahayag ang pagtatayo o pananatili sa kampamento.
- source_word: מַחֲנֵה דָן
  choice: Mahane-dan
  rationale: Isinalin sa baybay-Tagalog ang pangalan ng lugar sa halip na isalin ang kahulugan nitong “Kampo ng Dan,” upang mapanatili itong pantanging ngalan.
- source_word: הִנֵּה
  choice: naroon iyon
  rationale: Sa kontekstong heograpikal, likas na isinasama sa pahayag ang pansin-lokasyong hatid ng הִנֵּה sa halip na gumamit ng artipisyal na “masdan.”
- source_word: אַחֲרֵי קִרְיַת יְעָרִים
  choice: sa kanluran ng Kiriat-jearim
  rationale: Ang literal na “sa likod ng” ay maaaring tumukoy sa kanluran batay sa oryentasyong nakaharap sa silangan, ngunit nananatiling may tunay na leksikal na kalabuan kaya nilagyan ng talababa.
