base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: tl
  text: At mula roon ay umalis ang animnaraang lalaking mula sa angkan[a] ng mga Danita, mula sa Zora at Estaol, na may mga sandatang pandigma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “pamilya”; ang salitang Hebreo ay tumutukoy rito sa isang pangkat na magkakamag-anak sa loob ng tribo.
    reason: lexical_alternative
  - marker: b
    text: Sa literal, “nakabigkis ng mga kagamitang pandigma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: umalis
  rationale: Ang pandiwang נסע sa anyong pasalaysay ay tumutukoy sa pag-alis o pagsisimula ng paglalakbay. Likas at malinaw sa makabagong Tagalog ang “umalis” sa kontekstong ito.
- source_word: מִשָּׁם
  choice: mula roon
  rationale: Tuwirang isinasaad ang pinanggalingang lugar at pinananatili ang daloy ng salaysay.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: mula sa angkan ng mga Danita
  rationale: Ang מִשְׁפָּחָה ay isang pangkat na magkakamag-anak sa loob ng tribo, kaya mas tiyak ang “angkan” kaysa “tribo.” Ang “mga Danita” ay likas na katawagan sa mga kabilang sa Dan.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: mula sa Zora at Estaol
  rationale: Isinalin sa karaniwang baybay-Tagalog ang mga pangalang pantangi at pinanatili ang diwa ng pinanggalingan.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: animnaraang lalaki
  rationale: Sa gamit na may bilang at sa kontekstong militar, ang אִישׁ ay tumutukoy sa mga lalaking kasama sa pangkat.
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: nasasandatahan para sa digmaan
  rationale: Bagaman literal na “nakabigkis” ang חָגוּר, ipinahihiwatig ng buong parirala na nakahanda at may dalang kagamitang pandigma ang mga lalaki. Malinaw at likas ang “nasasandatahan para sa digmaan,” habang inilalahad sa talababa ang literal na larawan.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang pag-uulit ng “mula” upang maipakita kapwa ang pangkat na pinagmulan at ang dalawang bayang pinanggalingan. Inilagay ang mga talababa sa mismong mga pariralang tinutukoy ng mga ito.
