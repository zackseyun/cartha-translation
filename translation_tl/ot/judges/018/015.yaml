base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: tl
  text: Lumihis sila papunta roon at dumating sa bahay ng binatang Levita—ang bahay ni Mikas—at kinumusta nila siya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “at binati nila siya” o “at tinanong nila siya kung maayos ang kanyang kalagayan.” Literal na tumutukoy ang idyomang Hebreo sa pagtatanong tungkol sa kapayapaan o mabuting kalagayan ng isang tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Lumihis sila papunta roon
  rationale: Ipinapanatili ng “lumihis” ang diwa ng paglihis nila sa kanilang dinaraanan, habang ipinahahayag ng “papunta roon” ang direksiyonal na kahulugan ng שָׁמָּה.
- source_word: וַיָּבֹאוּ אֶל
  choice: at dumating sa
  rationale: Ang בוא na may אֶל ay tumutukoy sa pagdating o pagpunta sa isang lugar. Hindi ito isinaling “pumasok” sapagkat hindi tahasang sinasabi ng parirala na pumasok sila sa loob.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: bahay ng binatang Levita
  rationale: Ang נַעַר ay “binata” o “kabataang lalaki,” at tinutukoy siya ng הַלֵּוִי bilang isang Levita. Likas at maikli sa modernong Tagalog ang “binatang Levita.”
- source_word: בֵּית מִיכָה
  choice: ang bahay ni Mikas
  rationale: Inulit ng Hebreo ang “bahay” bilang paglilinaw sa lokasyon. Pinanatili ang pag-uulit upang maipakita na ang bahay ng binatang Levita ay ang bahay ni Mikas.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: at kinumusta nila siya
  rationale: Ang idyomang Hebreo ay literal na pagtatanong tungkol sa kapayapaan o mabuting kalagayan ng isang tao. Ang “kinumusta” ang natural na katumbas nito sa kasalukuyang Tagalog, samantalang inilalahad sa talababa ang literal na larawan at ibang posibleng pagpapakahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, natural, at marangal na Tagalog. Ginamit ang “kinumusta” bilang karaniwang idyoma, ngunit pinanatili sa talababa ang mas literal na diwa ng Hebreo. Ang mga gitling na pahaba ay nagpapakita na ang “bahay ni Mikas” ay paglilinaw sa naunang pariralang “bahay ng binatang Levita.”
