  source_fidelity: 'Tumpak ang salin sa pagkakasunod-sunod at kahulugan ng Hebreo: ang paglihis patungo roon, pagdating sa bahay ng binatang Levita, ang paglilinaw na ito ay bahay ni Mikas, at ang pag-uusisa sa kalagayan niya. Ang “kinumusta nila siya” ay wastong modernong idyomatikong katumbas ng וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם nang hindi binabawasan ang diwa nito sa simpleng pagbati.'
