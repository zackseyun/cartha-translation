translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Tagalog. Iniwasan ang mas lumang “tumahan” at pinili ang “nanirahan.” Inilipat ang talababa sa pariralang Bet-rehob, na siyang aktuwal na pinagmumulan ng tekstuwal na kalabuan.
