base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: tl
  text: At walang sinumang sumaklolo sa kanila, sapagkat malayo ang lungsod sa Sidon at wala silang pakikitungo sa sinuman. Nasa lambak na sakop ng Bet-rehob ang lungsod.[a] Muli nilang itinayo ang lungsod at nanirahan doon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “nasa lambak na malapit sa Bet-rehob.” Pinaikli at hindi ganap na tiyak ang pariralang Hebreo; maaaring tumukoy ang pang-ukol sa kalapitan sa halip na sa pagiging sakop nito.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: nagligtas sa kanila
  rationale: Ang Hiphil participle ng נצל ay tumutukoy sa isang tagapagligtas o taong sumasagip. Ang panghalip na “sa kanila” ay likas na ipinahihiwatig ng konteksto at tumutukoy sa mga naninirahan sa lungsod.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: malayo ang lungsod sa Sidon
  rationale: Ang pambabaeng panghalip ay tumutukoy sa lungsod. Inulit ang “lungsod” sa halip na gumamit ng malabong panghalip upang maging malinaw at natural sa Tagalog.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: wala silang pakikipag-ugnayan kaninuman
  rationale: Ang literal na diwa ay walang anumang usapin o ugnayan sila sa ibang tao. Ipinahahayag nito ang panlipunan o pampolitikang pagkakahiwalay, hindi ang lubos na kawalan ng anumang pakikisalamuha.
- source_word: אָדָם
  choice: kaninuman
  rationale: Bagaman anyong isahan ang salita, pangkalahatan ang gamit nito rito at nangangahulugang sinumang tao.
- source_word: בָּעֵמֶק
  choice: nasa lambak
  rationale: Karaniwang tumutukoy ang עֵמֶק sa lambak o mababang lupain; “lambak” ang tuwiran at natural na katumbas.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: sakop ng Bet-rehob
  rationale: Elliptical ang parirala at maaaring ipahiwatig ng לְ ang pag-aari o kaugnayang panlugar. Pinili ang teritoryal na diwang “sakop ng,” habang inilalagay sa talababa ang posibleng diwang kalapitan.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: muli nilang itinayo ang lungsod
  rationale: Payak na “itinayo” ang pandiwa sa Hebreo, ngunit ipinahihiwatig ng naunang pagsunog sa lungsod na muling pagtatayo ito. Nililinaw ito ng “muli” nang hindi binabago ang pangyayari.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: nanirahan doon
  rationale: Ang ישב ay maaaring mangahulugang manirahan o mamalagi. Ang “nanirahan doon” ay malinaw at likas sa makabagong Tagalog.
- source_word: בֵית רְחוֹב
  choice: Bet-rehob
  rationale: Pangalan ito ng lugar kaya tinumbasan sa pamamagitan ng transliterasyon, hindi pagsasalin ng kahulugan.
