  yaml_path: translation/ot/judges/011/004.yaml
  text: After some time[a], the Ammonites fought against Israel.
translation:
  language: tl
  text: Pagkalipas ng ilang panahon[a], nakipagdigma ang mga Ammonita laban sa Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “At nangyari, pagkalipas ng mga araw,” isang idyomang nangangahulugang lumipas ang ilang panahon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Pagkalipas ng ilang panahon
  rationale: Ang idyoma ay nagpapahiwatig na lumipas ang isang di-tiyak na haba ng panahon. Natural ito sa makabagong Tagalog at hindi nito ginagawang tiyak ang pagitan.
- source_word: וַיִּלָּחֲמוּ
  choice: nakipagdigma
  rationale: Ang anyo ng pandiwa mula sa לחם ay tumutukoy sa pagsabak o pakikipaglaban sa digmaan; malinaw at marangal ang “nakipagdigma” sa kontekstong ito.
- source_word: בְּנֵי עַמּוֹן
  choice: ang mga Ammonita
  rationale: Ito ang natural na katawagan sa Tagalog para sa pangkat-etnikong tinutukoy ng literal na “mga anak ni Ammon.”
- source_word: עִם יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Bagaman karaniwang nangangahulugang “kasama” ang עִם, itinatakda nito rito, kasama ng pandiwang pandigma, ang kalabang panig.
