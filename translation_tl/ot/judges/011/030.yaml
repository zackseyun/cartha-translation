base_translation:
  language: en
  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: tl
  text: At gumawa si Jefte ng isang panata kay Yahweh at sinabi niya, “Kung talagang ibibigay mo sa aking kamay ang mga Ammonita,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Kung tiyak na ibibigay mo sa aking kamay ang mga Ammonita.” Gumagamit ang Hebreo ng infinitive absolute kasama ng pandiwang may banghay upang magbigay-diin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: nanumpa si Jefte
  rationale: Ang pandiwa at kaugnay na pangngalan ay bumubuo ng Hebreong pariralang literal na ‘nangako ng isang panata.’ Ang ‘nanumpa’ ay natural at marangal sa Filipino at malinaw na nagpapahayag ng taimtim na panata.
- source_word: לַיהוָה
  choice: kay Yahweh
  rationale: Pinananatili ang personal na pangalang banal na יְהוָה bilang ‘Yahweh’; ang ל ay likas na isinalin na ‘kay.’
- source_word: אִם
  choice: Kung
  rationale: Ipinakikilala nito ang kondisyon ng panata, na magpapatuloy sa susunod na talata.
- source_word: נָתוֹן תִּתֵּן
  choice: talagang ibibigay mo
  rationale: Ang infinitive absolute na kasabay ng finite verb ay nagbibigay-diin sa kilos. Ang ‘talagang’ ay natural na nagpapahayag ng diin sa modernong Filipino.
- source_word: בְּנֵי עַמּוֹן
  choice: ang mga Ammonita
  rationale: Karaniwang katawagang etniko sa Filipino para sa mga tao ng Ammon, sa halip na literal ngunit di-likas na ‘mga anak ni Ammon.’
- source_word: בְּיָדִי
  choice: sa aking kamay
  rationale: Pinananatili ang isahang ‘kamay’ at ang biblikal na idyoma ng paghahatid ng kaaway sa kapangyarihan ng isang tao.
theological_decisions:
- issue: Paglalarawan sa pangalang banal na יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tuwirang ginagamit ng Hebreo ang Tetragrammaton. Pinananatili ng ‘Yahweh’ ang personal na pangalan sa halip na palitan ito ng isang titulo.
- issue: Lakas ng kondisyong אִם kasama ng נָתוֹן תִּתֵּן
  choice: Kung talagang ibibigay mo
  alternative: Kung tiyak na ibibigay mo; Kung ibibigay mo
  rationale: Pinananatili ang kondisyon at ang gramatikal na diin nang hindi ito ginagawang pahayag ng katiyakan o nilulutas ang maaaring bahagyang pagkakaiba ng diin.
translation_notes:
  register: Modernong Filipino na dignified at madaling maunawaan. Ginamit ang ‘nanumpa’ para sa natural na pagpapahayag ng cognate construction, at pinanatili ang biblikal na idyomang ‘sa aking kamay.’ Ang kuwit sa dulo ay nagpapakitang nagpapatuloy sa susunod na talata ang panata.
