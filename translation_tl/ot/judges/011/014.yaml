  text: Pagkatapos, muling nagsugo si Jefta ng mga mensahero sa hari ng mga Ammonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo: “hari ng mga anak ni Ammon,” isang idyomang tumutukoy sa mga Ammonita.'
