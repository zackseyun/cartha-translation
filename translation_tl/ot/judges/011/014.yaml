lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: Pagkatapos, muling
  rationale: Ipinahahayag ng idyoma ang pag-uulit o pagpapatuloy ng kilos. Likas sa salaysay ang “Pagkatapos, muling” at naiiwasan nito ang labis na literal na pag-uulit.
- source_word: יִפְתָּח
  choice: Jefte
  rationale: Ginamit ang nakaugaliang anyong Tagalog ng pangalang Jephthah.
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Ang “nagsugo” ay malinaw at likas na katumbas sa konteksto ng pagpapadala ng mga kinatawan.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa diplomatikong kontekstong ito, tumutukoy ang salita sa mga taong mensahero, hindi sa mga anghel.
- source_word: אֶל
  choice: sa
  rationale: Karaniwang Filipino para sa direksiyon o patutunguhan sa pariralang “nagsugo ... sa hari.”
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: hari ng mga Ammonita
  rationale: Ang בְּנֵי עַמּוֹן ay karaniwang katawagang etniko para sa bayang Ammon; natural at tumpak sa Filipino ang “mga Ammonita.”
