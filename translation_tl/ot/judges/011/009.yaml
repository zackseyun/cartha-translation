  to: Sinabi ni Jefta sa mga matatanda ng Gilead, “Kung ibabalik ninyo ako upang makipaglaban sa mga Ammonita, at ibigay sila ni Yahweh sa akin, magiging pinuno[a] ninyo ako.[b]”
