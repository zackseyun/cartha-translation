  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: tl
  text: Sinabi ni Jefta sa mga matatanda ng Gilead, “Kung ibabalik ninyo ako upang makipaglaban sa mga Ammonita, at ibigay sila ni Yahweh sa akin, magiging pinuno[a] ninyo ako.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ulo”; maaari ring “pinuno” o “pinunò.”
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring unawain ang pangwakas na sugnay bilang tanong: “Ako ba ang magiging pinuno ninyo?” Walang tahasang panandang patanong sa Hebreo.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים
  choice: ibabalik ninyo ako
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil ng שוב: si Jefta ay ibabalik ng matatanda matapos siyang itaboy.'
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Likas at malinaw itong salin ng pakikidigma sa kontekstong militar.
- source_word: בִּבְנֵי עַמּוֹן
  choice: sa mga Ammonita
  rationale: Ang karaniwang katawagang etniko ay mas natural kaysa sa literal na “mga anak ni Ammon,” at ipinahihiwatig ng pakikipaglaban ang laban sa kanila.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: at ibigay sila ni Yahweh sa akin
  rationale: Inihahatid nito sa natural na Tagalog ang Hebreong idyoma na literal na “ibigay sila sa harap ko,” na tumutukoy sa pagpapasailalim sa kaaway kay Jefta, nang hindi nagdaragdag ng imaheng “kamay” na wala sa teksto.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: לְרֹאשׁ
  choice: pinuno
  rationale: Ang literal na “ulo” ay metapora para sa isang pinuno. Mas malinaw at natural sa modernong Tagalog ang “pinuno,” habang inilalagay sa talababa ang literal na larawan.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang Yahweh at hindi pinapalitan ng titulo.
- issue: Lakas ng pangwakas na sugnay na אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: 'Pahayag: “ako ang magiging pinuno ninyo”'
  alternative: 'Tanong: “ako ba ang magiging pinuno ninyo?”'
  rationale: Walang tahasang panandang patanong sa Hebreo, kaya pahayag ang pangunahing salin. Gayunman, maaaring ipahiwatig ng konteksto ng pakikipagkasundo na tanong ito; pinananatili ang posibilidad na iyon sa talababa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “matatandang pinuno” upang linawin na ang “mga matanda” ng Gilead ay mga kinikilalang lider, at pinanatiling maikli ang tuwirang pananalita.
