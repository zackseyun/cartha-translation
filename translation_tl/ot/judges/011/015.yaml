translation_notes:
  register: Modernong Filipino na pormal ngunit madaling maunawaan. Pinanatili ang diplomatiko at deklaratibong tono, ang pag-uulit ng “lupain,” at ang tunay na di-tiyak na pagtukoy ng mga panghalip.
