base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanya, “Ganito ang sabi ni Jefte: Hindi kinuha ng Israel ang lupain ng Moab ni ang lupain ng mga anak ni Ammon[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O “lupain ng mga Ammonita.” Sa Hebreo: “lupain ng mga anak ni Ammon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: At sinabi niya sa kanya
  rationale: Pinananatili ang tuwirang daloy ng salaysay at ang di-tiyak na mga panghalip ng Hebreo; malinaw mula sa konteksto kung sino ang nagsasalita at kinakausap.
- source_word: כֹּה אָמַר
  choice: Ganito ang sinabi
  rationale: Likas na pormulang Filipino para sa pormal na paghahatid ng mensahe. Ang aspektong perpektibo ng אָמַר ay maayos na naihahayag ng “sinabi,” nang hindi binabago ang tungkulin nitong pormula ng mensahero.
- source_word: יִפְתָּח
  choice: Jefte
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa mga saling Bibliya sa Filipino.
- source_word: לֹא לָקַח
  choice: Hindi kinuha
  rationale: Tuwirang ipinapahayag ang malawak na kahulugan ng לקח at hindi nagdaragdag ng mas marahas na diwa gaya ng “sinakop” o “inagaw.”
- source_word: אֶרֶץ
  choice: lupain
  rationale: Ang “lupain” ay natural at marangal na katumbas para sa teritoryo, at napapanatili ang pag-uulit sa dalawang parirala.
- source_word: מוֹאָב
  choice: Moab
  rationale: Pamantayang transliterasyon ng pangalang heograpiko at etniko.
- source_word: בְּנֵי עַמּוֹן
  choice: mga anak ni Ammon
  rationale: Pinananatili sa pangunahing teksto ang literal na anyo ng Hebreo, na isa ring karaniwang sinaunang katawagang etniko; ibinibigay sa talababa ang mas idyomatikong kahulugan.
