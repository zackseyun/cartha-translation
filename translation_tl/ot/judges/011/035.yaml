revisions:
- from: Nang makita niya ang kanyang anak, pinunit niya ang kanyang mga damit at sinabi, “Ay, anak ko! Lubha mo akong ibinagsak, at ikaw ang naging sanhi ng aking kapighatian. Sapagkat ibinuka ko ang aking bibig kay Yahweh,[a] at hindi na ako maaaring umurong.”
  to: Nang makita niya ang kanyang anak, pinunit niya ang kanyang mga damit at sinabi, “Ay, anak ko! Lubha mo akong inilugmok, at ikaw ang naging sanhi ng aking kapighatian. Sapagkat ibinuka ko ang aking bibig kay Yahweh,[a] at hindi ko na ito mababawi.”
  rationale: Pinalitan ang dalawang pariralang hindi gaanong likas sa modernong Filipino Tagalog. Pinananatili ng “inilugmok” ang tindi ng pinaigting na pandiwang Hebreo nang hindi nagmumungkahi ng literal na pisikal na pagbagsak. Nililinaw ng “hindi ko na ito mababawi” ang kontekstuwal na puwersa ng “hindi ako makababalik/uurong” kaugnay ng kaniyang naipahayag na panata. Hindi binago ang literal na idyoma tungkol sa pagbubuka ng bibig o ang talababa nito.
