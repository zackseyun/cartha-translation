base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: tl
  text: Nang makita niya ang kanyang anak, pinunit niya ang kanyang mga damit at sinabi, “Ay, anak ko! Lubha mo akong inilugmok, at ikaw ang naging sanhi ng aking kapighatian. Sapagkat ibinuka ko ang aking bibig kay Yahweh,[a] at hindi ko na ito mababawi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa kontekstong ito, ang ibig sabihin ay “Nanata ako kay Yahweh.” Literal sa Hebreo: “Ibinuka ko ang aking bibig kay Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Nang makita niya ang kanyang anak
  rationale: Ang pormulang pasalaysay na וַיְהִי at ang temporal na parirala ay likas na isinasalin bilang “Nang.” Ginawang tahasan ang reperente ng pambabaeng panghalip bilang “ang kanyang anak” upang maging malinaw at natural sa Tagalog ayon sa agarang konteksto.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: pinunit niya ang kanyang mga damit
  rationale: Karaniwang paglalarawan ito ng matinding dalamhati o pagkabalisa; pinananatili ang kongkretong kilos sa natural na modernong Tagalog.
- source_word: אֲהָהּ בִּתִּי
  choice: Ay, anak ko!
  rationale: Ang “Ay” ay natural na bulalas ng dalamhati sa Tagalog at pinananatili ang tuwirang pagtawag sa anak.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Lubha mo akong ibinagsak
  rationale: Ipinahahayag ng infinitive absolute na kasunod ng finite verb ang matinding pagpapababa o pagpapalugmok. Inililipat ng “lubha” ang diin nang hindi pinalalabis bilang ganap na pagkawasak.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: at ikaw ang naging sanhi ng aking kapighatian
  rationale: Ang עכר ay tumutukoy sa pagdadala ng kaguluhan o kapahamakan. Ang “sanhi ng aking kapighatian” ay malinaw at natural, at hindi nagdaragdag ng tahasang moral na hatol sa anak.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: Sapagkat ibinuka ko ang aking bibig kay Yahweh
  rationale: Pinananatili ang literal at maringal na idyomang Hebreo, na sa konteksto ay tumutukoy sa taimtim na panata. Ipinapaliwanag sa talababa ang tiyak na diwa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng banal na pangalang Hebreo sa halip na palitan ito ng isang titulo.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: at hindi na ako maaaring umurong
  rationale: Ang שׁוב ay literal na bumalik o tumalikod. Ang “umurong” ay natural na Tagalog para sa hindi na pagtalikod sa naipahayag na panata, habang pinananatili ang larawan ng pagbabalik.
theological_decisions:
- issue: Kung tahasang babanggitin sa pangunahing teksto na nanata si Jefte
  choice: Panatilihin ang idyomang “ibinuka ko ang aking bibig kay Yahweh” at ipaliwanag sa talababa na tumutukoy ito sa panata.
  alternative: “Nanata ako kay Yahweh” o “Ibinigay ko ang aking salita kay Yahweh.”
  rationale: Malinaw sa konteksto na panata ang tinutukoy, ngunit higit na kongkreto at taimtim ang mismong pananalita ng Hebreo. Pinananatili nito ang anyo ng pinagmulan nang hindi ikinukubli ang kahulugan.
- issue: Tindi ng pananalita ni Jefte sa kanyang anak
  choice: “Lubha mo akong ibinagsak” at “sanhi ng aking kapighatian.”
  alternative: “Winasak mo ako” o “ikaw ang aking tagapuksa.”
  rationale: Matindi ang dalamhati at may paninisi sa gramatika ng Hebreo, ngunit ang mas mararahas na alternatibo ay maaaring magdagdag ng moral na paratang o ganap na pagkawasak na hindi kinakailangan ng teksto.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Pinanatili ang matinding emosyon ng panaghoy at ang kongkretong idyomang Hebreo, habang ginamit ang talababa upang linawin ang kahulugang may kinalaman sa panata.
