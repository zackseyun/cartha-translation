  revised_text: Nang makita niya ang kanyang anak, pinunit niya ang kanyang mga damit at sinabi, “Ay, anak ko! Lubha mo akong inilugmok, at ikaw ang naging sanhi ng aking kapighatian. Sapagkat ibinuka ko ang aking bibig kay Yahweh,[a] at hindi ko na ito mababawi.”
