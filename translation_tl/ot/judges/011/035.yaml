  terminology: Wasto at pare-pareho ang “Yahweh.” Ang literal na idyomang “ibinuka ko ang aking bibig kay Yahweh” ay nararapat panatilihin, at ang talababa ay wastong naglilinaw na tumutukoy ito sa panata nang hindi ipinapalit ang pagpapakahulugan sa pangunahing teksto.
