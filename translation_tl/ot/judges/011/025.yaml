base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: tl
  text: At ngayon, talaga bang nakahihigit ka kay Balak na anak ni Zipor, na hari ng Moab?[a] Nakipagtalo ba siya kailanman sa Israel,[b] o nakipagdigma ba siya sa kanila?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nakahihigit ka ba talaga kay Balak na anak ni Zipor, na hari ng Moab?” Gumagamit ang Hebreo ng mariing pag-uulit (literal, “mabuti, mabuti”) upang idiin ang paghahambing.
    reason: lexical_alternative
  - marker: b
    text: O, “Nakipagtunggali ba siya kailanman sa Israel?” Ang unang pandiwa ay maaaring tumukoy sa pakikipagtalo, pakikipag-alitan, o paghaharap ng isang usapin, samantalang ang ikalawa ay tiyak na tumutukoy sa pakikipaglaban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang paglipat ng diskurso sa retorikal na hamon ni Jefte.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: talaga bang nakahihigit ka
  rationale: Likas sa modernong Filipino at naihahatid ang mariing paghahambing na ipinapahiwatig ng pag-uulit ng טוֹב.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: kay Balak na anak ni Zipor, na hari ng Moab
  rationale: Tuwirang inilalahad ang pangalan, ang kaugnayang pampamilya, at ang titulo sa natural na ayos ng Filipino.
- source_word: הֲרֹב רָב
  choice: Nakipagtalo ba siya kailanman
  rationale: Pinananatili ang malawak na diwa ng ריב—pakikipagtunggali, pakikipagtalo, o pag-aangkin laban sa iba—nang hindi ito agad ginagawang armadong labanan.
- source_word: עִם יִשְׂרָאֵל
  choice: sa Israel
  rationale: Ang 'nakipagtalo sa Israel' ay natural sa Filipino at nananatiling naiiba sa tahasang pakikipagdigma sa kasunod na sugnay.
- source_word: אִם
  choice: o
  rationale: Ipinakikilala nito rito ang ikalawang bahagi ng retorikal na tanong.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: nakipagdigma ba siya sa kanila
  rationale: Malinaw na ipinahahayag ang armadong pakikipaglaban at inihihiwalay ang diwa nito sa mas malawak na ריב.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na dignified ngunit madaling maunawaan. Ginamit ang “nakahihigit” para sa paghahambing at “nakipagtalo” laban sa “nakipagdigma” upang mapanatili ang pagkakaiba ng dalawang pandiwang Hebreo. Inilagay ang [a] pagkatapos ng buong unang tanong dahil ang talababa ay nagpapaliwanag sa mariing paghahambing.
