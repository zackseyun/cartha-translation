base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: tl
  text: Pagkatapos, sinabi ng mga nakatatanda ng Gilead kay Jefte[a], “Si Yahweh ang magiging saksi sa pagitan natin kung hindi namin gagawin ang sinabi mo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mas literal: “Makikinig si Yahweh sa pagitan natin”—samakatuwid, makikinig bilang saksi o hukom sa dalawang panig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Pagkatapos, sinabi
  rationale: Ang narrative waw ay nagsusulong ng pagkakasunod-sunod ng salaysay; natural sa modernong Tagalog ang “Pagkatapos, sinabi.”
- source_word: זִקְנֵי גִלְעָד
  choice: mga matatandang pinuno ng Gilead
  rationale: Ang זִקְנֵי ay tumutukoy sa kinikilalang mga nakatatanda at pinuno ng pamayanan, hindi lamang sa mga taong may edad; nililinaw ito ng “matatandang pinuno.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang tipan na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: ang magiging saksi sa pagitan natin
  rationale: Literal itong may diwang “magiging nakikinig sa pagitan natin,” ngunit sa konteksto ng panunumpa, ang pakikinig ay may hudisyal na tungkuling sumaksi o humatol sa dalawang panig.
- source_word: אִם לֹא
  choice: kung hindi
  rationale: 'Ipinapahayag nito ang kundisyong kalakip ng panunumpa: mananagot sila kung hindi nila tutuparin ang usapan.'
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: gagawin ang sinabi mo
  rationale: Natural na ipinahahayag sa Tagalog ang diwang “gagawin namin ayon sa iyong salita”; ang “sinabi mo” ay tumutukoy sa mga kondisyong inilahad ni Jefte.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Tuwirang ginagamit ng tekstong Hebreo ang banal na pangalan; pinananatili ng “Yahweh” ang pagkakaiba nito sa karaniwang titulong “Panginoon.”
- issue: Papel ni Yahweh sa panunumpa
  choice: magiging saksi sa pagitan natin
  alternative: makikinig sa pagitan natin
  rationale: Ang “saksi” ay nagpapahayag ng hudisyal na bisa ng Hebreong “nakikinig” sa konteksto ng tipan, habang itinatala sa talababa ang mas literal na anyo upang hindi mawala ang tunay na leksikal na larawan.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “matatandang pinuno” upang maipakita ang pampamayanang katungkulan ng mga elder, at “Jefte” bilang karaniwang anyong Filipino ng pangalan.
