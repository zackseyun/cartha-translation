revisions:
- from: 'Nang matapos ang dalawang buwan, bumalik siya sa kanyang ama. At ginawa ng ama niya sa kanya ang ayon sa panatang ipinanata nito.[a] Hindi pa siya nakipagtalik sa sinumang lalaki.[b] At naging kaugalian ito sa Israel:'
  to: 'Nang matapos ang dalawang buwan, bumalik siya sa kanyang ama. At isinagawa ng kanyang ama sa kanya ang panatang ipinanata niya.[a] Hindi siya nakipagtalik sa sinumang lalaki.[b] At naging kaugalian ito sa Israel:'
  rationale: Inayos ang sentrong sugnay upang maging wastong, natural na Tagalog habang pinananatili ang tuwirang ‘sa kanya’ at ang pag-uulit ng ‘panata/ipinanata.’ Hindi pinalitan ang pahayag ng alinmang paliwanag na magpapasya kung sakripisyo o habambuhay na pagkadalaga ang tinutukoy. Pinanatili ang mga angkla ng talababa at nilinaw sa talababa na anak na babae ang tinutukoy.
