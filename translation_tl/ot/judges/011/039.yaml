  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: tl
  text: 'Nang matapos ang dalawang buwan, bumalik siya sa kanyang ama. At isinagawa ng kanyang ama sa kanya ang panatang ipinanata niya.[a] Hindi siya nakipagtalik sa sinumang lalaki.[b] At naging kaugalian ito sa Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “ginawa niya sa kanya ang kanyang panata na kanyang ipinanata.” Magkakaiba ang pagkaunawa ng mga tagapagpaliwanag kung ang ibig sabihin nito ay inialay ni Jefte ang kanyang anak na babae bilang handog o itinalaga niya ito sa habambuhay na pagkadalaga. Hindi tahasang nilulutas ng pananalitang Hebreo rito ang tanong.
    reason: alternative_reading
  - marker: b
    text: Sa literal, “hindi siya nakakilala ng lalaki.” Isa itong idyomang Hebreo na nangangahulugang hindi siya nakipagtalik.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: Nang matapos ang dalawang buwan
  rationale: Ipinahahayag ng מִקֵּץ ang pagtatapos ng takdang panahon. Likas sa makabagong Tagalog ang pariralang ito habang pinananatili ang temporal na hangganan ng Hebreo.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: bumalik siya sa kanyang ama
  rationale: Tuwirang isinasalin ang שׁוּב bilang “bumalik” at pinananatili ang tahasang patutunguhang “sa kanyang ama,” sa halip na gawing “umuwi.”
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: ginawa ng ama niya sa kanya ang ayon sa panatang ipinanata nito
  rationale: Pinananatili ang matindi at tuwirang “ginawa ... sa kanya,” pati ang pag-uulit ng ugat נדר sa “panatang ipinanata,” nang hindi tinutukoy kung ano mismo ang ginawa.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: Hindi pa siya nakipagtalik sa sinumang lalaki
  rationale: Ang יָדַע אִישׁ ay idyomang Hebreo para sa pakikipagtalik. Inihahayag ito sa malinaw at kasalukuyang Tagalog; ang literal na anyo ay inilagay sa talababa.
- source_word: חֹק
  choice: kaugalian
  rationale: Sa pangwakas na salaysay na ito, tumutukoy ang חֹק sa isang itinatag na gawaing panlipunan na ipinaliliwanag sa kasunod na talata, kaya mas angkop ang “kaugalian” kaysa “kautusan” o “batas.”
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: At naging kaugalian ito sa Israel
  rationale: Ipinakikita ng “naging” ang pagsisimula ng patuloy na gawaing pangkomunidad, ayon sa kilos ng וַתְּהִי.
theological_decisions:
- issue: Kung paano tinupad ni Jefte ang kanyang panata
  choice: 'Pinanatili sa pangunahing teksto ang hindi tiyak ngunit tuwirang pananalitang Hebreo: ginawa niya sa kanyang anak ang ayon sa kanyang panata.'
  alternative: Maaaring unawain na inihandog niya ang anak bilang handog na sinusunog, o na itinalaga niya ito sa habambuhay na pagkadalaga/paglilingkod.
  rationale: Hindi tahasang nilulutas ng mismong pananalita ng talata kung alin sa dalawang matagal nang pagpapakahulugan ang tama. Kaya hindi ipinapasok sa salin ang alinmang konklusyong teolohikal.
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Pinanatili ang matinding pag-uulit at di-tiyak na pahayag ng Hebreo sa sentrong sugnay, ngunit ginawang tuwiran sa karaniwang mambabasa ang idyoma tungkol sa pakikipagtalik. Ginamit ang “kaugalian” dahil ang konteksto ay taunang gawaing pangkomunidad, hindi tahasang pormal na batas.
