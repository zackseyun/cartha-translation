  - severity: medium
    issue: Nawala ang “bumaba” sa “makapaglibot”
    rationale: May dalawang magkaugnay na pandiwa ang Hebreo, “pumunta” at “bumaba.” Maaaring idiomatiko ang ideya ng paglilibot, ngunit hindi dapat palitan nang lubos ang ikalawang pandiwa.
