  source_fidelity: Kailangan ng rebisyon. Ang “Gawin mo para sa akin” ay aktibong utos sa ama, samantalang ang Hebreo (Niphal jussive) ay “mangyari/nawa’y gawin para sa akin ang bagay na ito.” Ang “makapaglibot” ay nawawala rin ang tahasang pandiwang “bumaba,” bagaman maaaring tumukoy ang parirala sa paglalakad sa kabundukan.
  naturalness: Natural at marangal ang karamihan ng draft. Mas natural at mas tapat ang “Hayaan mong mangyari para sa akin ang bagay na ito” at “pumunta ako at bumaba sa mga bundok.” Ang “pagkabirhen” ay mas tiyak na katumbas ng בְּתוּלַי kaysa “pagkadalaga.”
  terminology: Panatilihin ang “pagkabirhen” sa pangunahing teksto, dahil ito ang tahasang paksa ng pagdadalamhati at hindi nito nilulutas ang pinagtatalunang kahulugan ng salaysay. Ang “mga kaibigang babae” ay angkop para sa pambabaeng anyo ng רֵעוֹתָי.
