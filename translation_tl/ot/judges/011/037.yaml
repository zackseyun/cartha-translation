base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: tl
  text: 'At sinabi niya sa kanyang ama, “Hayaan mong mangyari para sa akin ang bagay na ito: hayaan mo ako nang dalawang buwan[a], upang pumunta ako at bumaba sa mga bundok, at iyakan ko ang aking pagkabirhen[b], ako at ang mga kaibigang babae ko.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “bigyan mo ako ng palugit na dalawang buwan” o “hayaan mo akong malaya sa loob ng dalawang buwan.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “iyakan ang aking pagkabirhen.” Binibigyang-diin ng teksto ang kanyang kalagayang hindi pa kasal at walang anak, ngunit hindi nilulutas ng talatang ito ang mas malawak na tanong tungkol sa magiging kapalaran niya sa salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Gawin mo para sa akin ang bagay na ito
  rationale: Pinananatili ang konkretong pananalitang “ang bagay na ito” at ang diwa ng pakiusap, sa halip na palitan ito ng mas interpretatibong “ipagkaloob mo ang kahilingang ito.”
- source_word: הַרְפֵּה מִמֶּנִּי שְׁנַיִם חֳדָשִׁים
  choice: pabayaan mo muna ako nang dalawang buwan
  rationale: Ipinahahayag ng idyoma ang paghingi ng kalayaan o palugit sa loob ng dalawang buwan. Nililinaw ng “muna” na pansamantalang pahintulot ang hinihingi, hindi pagpapabaya.
- source_word: וְאֵלְכָה וְיָרַדְתִּי עַל הֶהָרִים
  choice: upang makapunta ako at makapaglibot sa kabundukan
  rationale: Likas sa modernong Tagalog ang “makapunta … at makapaglibot” para sa paggalaw sa kabundukan. Hindi ginamit ang matigas at posibleng nakalilitong literal na “pumunta at bumaba sa ibabaw ng mga bundok.”
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: at maiyakan ko ang aking pagkadalaga
  rationale: Ang “maiyakan” ay nagpapahayag ng pagdadalamhati, at ang “pagkadalaga” ay likas at marangal na katumbas ng kalagayan niyang birhen at walang asawa nang hindi ipinapasok ang isang tiyak na pagbasa sa magiging kapalaran niya.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: ako at ang mga kaibigan kong babae
  rationale: Ginagawang hayag ang pambabaeng anyo ng pangngalan sa Hebreo; natural at malinaw sa kasalukuyang Tagalog.
theological_decisions:
- issue: Ang kahulugan ng pagdadalamhati ng anak ni Jefte sa kanyang pagkadalaga
  choice: Pinanatili ang tuwirang pagtuon ng talata sa kanyang pagkadalaga at hindi tahasang binanggit ang kamatayan.
  alternative: Ipaliwanag sa mismong talata na iniiyakan niya ang nalalapit niyang kamatayan, o na habambuhay lamang siyang mananatiling birhen.
  rationale: Pagkadalaga ang tahasang layon ng kanyang pag-iyak sa talatang ito. Hindi nito mismo nilulutas kung ang mas malawak na salaysay ay tumutukoy sa literal na paghahain, habambuhay na pagkabirhen, o magkaugnay na pagdadalamhati sa kamatayan at kawalan ng anak.
translation_notes:
  register: Modernong Filipino Tagalog na natural ngunit marangal. Ginamit ang isahang “mo” dahil isang anak ang tuwirang nakikipag-usap sa kanyang ama. Iniwasan ang sobrang teknikal na “birhen” sa pangunahing teksto ngunit pinanatili ito sa talababa upang maging malinaw ang literal na diwa.
