  to: 'At sinabi niya sa kanyang ama, “Hayaan mong mangyari para sa akin ang bagay na ito: hayaan mo ako nang dalawang buwan[a], upang pumunta ako at bumaba sa mga bundok, at iyakan ko ang aking pagkabirhen[b], ako at ang mga kaibigang babae ko.”'
