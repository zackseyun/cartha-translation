base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: tl
  text: Nang makipaglaban ang mga Ammonita sa Israel, pumunta ang mga nakatatanda ng Gilead upang kunin si Jefte mula sa lupain ng Tob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na ipinakikilala sa modernong Tagalog ang kasunod na pangyayari at napapanatili ang temporal na diwa ng pormulang Hebreo nang hindi mabigat ang pagkakasabi.
- source_word: נִלְחֲמוּ
  choice: makipaglaban
  rationale: Ang Niphal ng לחם ay tumutukoy rito sa pakikipagdigma o pakikipaglaban; ang pandiwang ito ay malinaw at natural sa konteksto.
- source_word: בְנֵי עַמּוֹן
  choice: ang mga Ammonita
  rationale: Karaniwang katawagan sa Tagalog para sa pangkat-etnikong tinutukoy ng literal na 'mga anak ni Ammon.'
- source_word: עִם יִשְׂרָאֵל
  choice: sa Israel
  rationale: Kasunod ng נלחם, ang עִם ay tumutukoy sa kalabang kinakaharap. Sa pariralang Tagalog na 'makipaglaban sa,' malinaw ang salungatang diwa kahit literal na 'kasama/kasalo' ang batayang kahulugan ng pang-ukol.
- source_word: זִקְנֵי גִלְעָד
  choice: ang matatandang pinuno ng Gilead
  rationale: Ang זקנים ay hindi lamang tumutukoy sa edad kundi sa kinikilalang mga lider ng pamayanan; nililinaw ito ng 'matatandang pinuno.'
- source_word: לָקַחַת
  choice: upang kunin
  rationale: Pinananatili ang karaniwang kahulugan ng לקח. Sa konteksto, pumunta sila upang sunduin o kunin si Jefte mula sa Tob, ngunit hindi kailangang alisin ang saklaw ng orihinal na pandiwa.
- source_word: אֶת יִפְתָּח
  choice: si Jefte
  rationale: Ang אֶת ay pananda ng tiyak na layon at hindi isinasalin; ginagamit ang nakaugaliang anyong Tagalog ng pangalan.
- source_word: מֵאֶרֶץ טוֹב
  choice: mula sa lupain ng Tob
  rationale: Tumpak na inilalarawan ng 'lupain' ang אֶרֶץ, habang pinananatili bilang pangalang-pook ang Tob.
theological_decisions: []
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang 'matatandang pinuno' upang maipahayag ang opisyal na tungkulin ng mga זקנים, at 'kunin' upang manatiling malapit sa leksikal na lawak ng לקח. Walang talababa dahil hindi kailangan para maunawaan ang talata.
