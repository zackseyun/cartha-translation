  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: tl
  text: Hindi ako nagkasala laban sa iyo, ngunit gumagawa ka ng masama laban sa akin sa pakikipagdigma mo laban sa akin. Nawa’y humatol ngayon si Yahweh, ang Hukom, sa pagitan ng mga anak ni Israel at ng mga anak ni Ammon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O, “sa pagitan ng mga Israelita at ng mga Ammonita.” Literal sa Hebreo: “sa pagitan ng mga anak ni Israel at ng mga anak ni Ammon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: nagkasala
  rationale: Pinananatili nito ang moral at panghukumang bigat ng pandiwa, bagaman maaari rin itong mangahulugang ‘gumawa ng mali’ sa ganitong diplomatikong konteksto.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: ginagawan mo ako ng masama
  rationale: Likas na salin ito ng pariralang tumutukoy sa masamang ginagawa laban sa nagsasalita at pinananatili ang kaibahan sa ‘nagkasala sa iyo.’
- source_word: לְהִלָּחֶם בִּי
  choice: sa pakikipagdigma mo sa akin
  rationale: Ipinapahayag nito na ang pakikidigma ang paraan ng ginagawang masama at angkop ito sa alitan ng dalawang bayan.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: ang Hukom, ang humatol
  rationale: Pinananatili ang retorikal na pag-uulit ng ugat na שפט sa pamamagitan ng magkaugnay na ‘Hukom’ at ‘humatol,’ at ipinahahayag ang panawagan o paghiling.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang inililipat sa Tagalog ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: הַיּוֹם
  choice: ngayon
  rationale: Natural na modernong Tagalog ito at pinananatili ang agarang panahon ng paghiling.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: sa pagitan ng mga anak ni Israel at ng mga anak ni Ammon
  rationale: Pinananatili sa pangunahing teksto ang literal at pormal na pananalitang ‘mga anak ni,’ habang inilalagay sa talababa ang mas natural na katawagang etniko.
theological_decisions:
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang tahasang ginagamit ng Hebreo, kaya pinananatili ito sa halip na palitan ng titulo.
- issue: Panghukumang panawagan sa יִשְׁפֹּט
  choice: ang humatol ngayon
  alternative: hahatol ngayon
  rationale: Maaaring anyong jussive o panawagan ang pandiwa sa konteksto. Ang ‘ang humatol’ ay nagpapanatili sa pakiusap na si Yahweh ang magpasya, sa halip na gawing tiyak na prediksiyon.
- issue: Korporatibong pananalitang בְּנֵי
  choice: mga anak ni Israel ... mga anak ni Ammon
  alternative: mga Israelita ... mga Ammonita
  rationale: Pinananatili ng pangunahing teksto ang konkretong anyo ng Hebreo; ibinibigay sa talababa ang idiomatikong kahulugang tumutukoy sa mga bayan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang legal at diplomatikong himig, ang pag-uulit na ‘Hukom/humatol,’ at ang pormal na ekspresyong ‘mga anak ni’ nang hindi ginagawang sobrang makaluma ang pangungusap.
