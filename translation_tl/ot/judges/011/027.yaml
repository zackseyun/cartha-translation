revisions:
- from: Hindi ako nagkasala sa iyo, ngunit ginagawan mo ako ng masama sa pakikipagdigma mo sa akin. Si Yahweh, ang Hukom, ang humatol ngayon sa pagitan ng mga anak ni Israel at ng mga anak ni Ammon.[a]
  to: Hindi ako nagkasala laban sa iyo, ngunit gumagawa ka ng masama laban sa akin sa pakikipagdigma mo laban sa akin. Nawa’y humatol ngayon si Yahweh, ang Hukom, sa pagitan ng mga anak ni Israel at ng mga anak ni Ammon.[a]
  rationale: Binago ang sugnay tungkol sa paghatol upang tahasang maipahayag ang jussive na panawagan ng Hebreo, hindi isang nakaraang paghatol. Pinakinis din ang mga pang-ukol para sa likas at malinaw na modernong Filipino, habang pinanatili ang pormal na rehistro, ang retorikal na ‘Hukom/humatol,’ at ang literal na korporatibong pananalita.
