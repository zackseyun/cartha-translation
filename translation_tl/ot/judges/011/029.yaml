revisions:
- from: At sumakaniya si Jefte ang Espiritu ni Yahweh. Dumaan siya sa Gilead at Manases, saka sa Mizpa ng Gilead. Mula sa Mizpa ng Gilead, tumawid siya patungo sa mga Ammonita.[a]
  to: Dumating kay Jefte ang Espiritu ni Yahweh. Dumaan siya sa Gilead at Manases. Dumaan siya sa Mizpa ng Gilead, at mula sa Mizpa ng Gilead ay nagpatuloy siya patungo sa mga Ammonita.[a]
  rationale: Inayos ang balarila upang tuwirang maipahayag na ang Espiritu ni Yahweh ay dumating kay Jefte, at ibinalik ang malinaw na magkakasunod na mga kilos ng pagdaan. Pinalitan ang huling “tumawid” ng “nagpatuloy ... patungo” upang mapanatili ang saklaw ng Hebreong pandiwa nang hindi nagdaragdag ng heograpikal na detalye. Ang talababa ay pinanatili bilang wastong alternatibong leksikal.
