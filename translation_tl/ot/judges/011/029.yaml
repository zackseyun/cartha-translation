base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: tl
  text: Dumating kay Jefte ang Espiritu ni Yahweh. Dumaan siya sa Gilead at Manases. Dumaan siya sa Mizpa ng Gilead, at mula sa Mizpa ng Gilead ay nagpatuloy siya patungo sa mga Ammonita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “tumawid siya patungo sa mga Ammonita” o “sumulong siya laban sa mga Ammonita.” Ang pandiwang Hebreo ay maaaring mangahulugang dumaan, tumawid, o sumulong, ayon sa konteksto.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: At sumakaniya si Jefte ang Espiritu ni Yahweh
  rationale: Ang idyomang Hebreo ay nagpapahayag ng pagdating ng Espiritu kay Jefte upang bigyan siya ng kapangyarihan. Likas sa Tagalog ang “sumakaniya,” at hindi ito nagdaragdag ng paliwanag na wala sa teksto.
- source_word: יִפְתָּח
  choice: Jefte
  rationale: Karaniwang anyo ng pangalang Jephthah sa Filipino.
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: Dumaan siya sa Gilead at Manases
  rationale: Sa mga pangalan ng teritoryo bilang tuwirang layon, ang עבר ay natural na nangangahulugang pagdaan sa mga lugar na ito.
- source_word: מִצְפֵּה גִלְעָד
  choice: Mizpa ng Gilead
  rationale: Pangalan ito ng lugar; pinanatili ang transliterasyon sa halip na isalin ang saligang kahulugang “bantayan.”
- source_word: עָבַר בְּנֵי עַמּוֹן
  choice: tumawid siya patungo sa mga Ammonita
  rationale: Pinananatili nito ang diwa ng pagkilos tungo sa mga Ammonita nang hindi tahasang ipinapalagay na nagsimula na agad ang pagsalakay.
theological_decisions:
- issue: Pagbanggit sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Tuwirang ginamit ng tekstong Hebreo ang Tetragrammaton; pinananatili ng “Yahweh” ang personal na pangalang tipan.
- issue: Kalikasan ng רוּחַ יְהוָה kay Jefte
  choice: ang Espiritu ni Yahweh ay sumakaniya
  alternative: hangin o hininga ni Yahweh
  rationale: Sa konteksto ng Mga Hukom, ang pariralang ito ay tumutukoy sa Espiritu ng Diyos na nagbibigay-kakayahan sa isang pinuno, ngunit hindi dinaragdagan ng salin ang eksaktong lawak o moral na implikasyon ng pagkilos na iyon.
translation_notes:
  register: Makabago, marangal, at madaling maunawaang Filipino. Pinanatili ang sunod-sunod na paglalakbay at ang pag-uulit sa Mizpa ng Gilead, habang ginawang natural ang daloy ng pangungusap.
