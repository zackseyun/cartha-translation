  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: tl
  text: Ibinigay ni Yahweh, ang Diyos ng Israel, si Sihon at ang buong bayan niya sa kapangyarihan ng Israel,[a] at nilupig sila ng Israel. Kaya inangkin ng Israel ang buong lupain ng mga Amoreo na naninirahan sa lupaing iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa literal na Hebreo: “sa kamay ng Israel,” isang idyomang nangangahulugang nasa kapangyarihan ng Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: Ibinigay ... sa kapangyarihan ng Israel
  rationale: Ang נָתַן kasabay ng בְּיַד ay idyomang nagsasaad ng pagpapasailalim sa kapangyarihan ng iba. Isinalin nang malinaw sa natural na Tagalog habang ipinapaliwanag sa talababa ang literal na larawan ng “kamay.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang transliterasyon ng banal na pangalang YHWH, sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Tuwirang salin ng pariralang konstrukto na tumutukoy kay Yahweh bilang Diyos ng Israel.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Karaniwang transliterasyon sa Tagalog ng personal na pangalan.
- source_word: כָּל עַמּוֹ
  choice: ang buo niyang bayan
  rationale: Ang עַם ay pangunahing nangangahulugang “bayan” o “mga tao.” Pinanatili ang kolektibong saklaw sa halip na paliitin ito sa hukbo lamang.
- source_word: וַיַּכּוּם
  choice: nilupig nila ang mga ito
  rationale: Sa salaysay ng digmaan, ang נכה ay maaaring tumukoy sa mapagpasyang pananakit o pagkatalo. Ang “nilupig” ay natural at malinaw sa modernong Tagalog.
- source_word: וַיִּירַשׁ
  choice: inangkin
  rationale: Ang ירש dito ay tumutukoy sa pagkuha at pag-angkin ng lupain matapos ang tagumpay, hindi lamang sa mana.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: ang buong lupain ng mga Amoreo
  rationale: Ang singular na kolektibong etnonimo sa Hebreo ay natural na ipinapahayag sa Tagalog bilang plural na “mga Amoreo.”
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: na naninirahan sa lupaing iyon
  rationale: Pinananatili ang participial na paglalarawan sa mga Amoreo sa malinaw at kasalukuyang Tagalog.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON”; ang “Jehova” ay ibang tradisyonal na anyo ng transliterasyon.
translation_notes:
  register: Makabagong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “buo niyang bayan” para sa kolektibong עַם at “nilupig” para sa natural na paglalahad ng tagumpay sa digmaan.
