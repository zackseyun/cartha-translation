base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: tl
  text: At nagkaanak ng mga lalaki ang asawa ni Gilead sa kaniya. Nang lumaki ang mga anak ng asawa ni Gilead, pinalayas nila si Jefte at sinabi sa kaniya, “Hindi ka magkakaroon ng mana sa sambahayan ng aming ama, sapagkat anak ka ng ibang babae.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: ang asawa ni Gilead
  rationale: Tuwirang pinananatili ang kaibahan sa talata 1 sa pagitan ng ina ni Jefte at ng kinikilalang asawa ni Gilead.
- source_word: בְנֵי הָאִשָּׁה
  choice: ang mga anak ng asawa niya
  rationale: Pinananatili ang tiyak na pantukoy sa Hebreo at ang pagtukoy sa asawang kababanggit lamang, ngunit gumagamit ng likas na Tagalog.
- source_word: לֹא תִנְחַל
  choice: Hindi ka magkakaroon ng mana
  rationale: Ipinahahayag ang kahulugang mana o karapatang magmana nang hindi ipinapalagay kung natanggap na o matatanggap pa lamang ang ari-arian.
- source_word: בְּבֵית אָבִינוּ
  choice: sa sambahayan ng aming ama
  rationale: Ang בֵּית ay maaaring tumukoy sa pamilya o sambahayan, hindi lamang sa gusali; ang 'sambahayan' ang mas angkop sa usapin ng mana.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: anak ka ng ibang babae
  rationale: Tapat sa sadyang pangkalahatang pahayag ng mga kapatid at hindi nagdaragdag ng etiketa tungkol sa legal o moral na katayuan ni Jefte.
theological_decisions:
- issue: Katayuan ni Jefte sa pamilya at sa mana
  choice: Hindi ka magkakaroon ng mana sa sambahayan ng aming ama
  alternative: Hindi ka magmamana sa bahay ng aming ama
  rationale: Pinananatili ang pag-aangkin ng mga kapatid nang hindi ito ginagawang pasya ng Diyos o tiyak na legal na hatol; inilalarawan lamang ng teksto ang kanilang sinabi.
translation_notes:
  register: Modernong Filipino na malinaw at marangal. Ginamit ang pangalang “Jefte,” ang karaniwang anyong Tagalog. Ang “nagkaanak ... sa kaniya” ay natural na salin ng Hebreong pahayag na ipinanganak ng asawa ni Gilead ang mga anak para sa kaniya.
