base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: tl
  text: Sinabi niya, “Umalis ka.” Kaya pinayagan niya siyang umalis nang dalawang buwan. Umalis siya kasama ng kanyang mga kasama, at sa mga bundok ay iniyakan niya ang kanyang pagkabirhen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “ipinagdalamhati niya ang kanyang pagkabirhen” o “umiyak siya dahil sa kanyang pagkabirhen.” Tahasang sinasabi ng Hebreo na ang kanyang pagkabirhen ang bagay ng kanyang pag-iyak, isang detalyeng mahalaga sa iba't ibang pagpapakahulugan sa mas malawak na salaysay.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: Sige, umalis ka
  rationale: Pautos na ikalawang panauhang pambabae ng הלך. Ang “umalis ka” ay tuwirang utos; ipinahihiwatig ng “Sige” ang pagsang-ayon sa kahilingan ayon sa konteksto nang hindi dinaragdagan ang nilalaman.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: pinayagan niya itong umalis
  rationale: Sa konteksto, ang שׁלח na may tuwirang layon ay nagsasaad ng pagpapaalis o pagpapahintulot na makaalis. Mas malinaw sa Filipino ang “pinayagan ... umalis” kaysa “ipinaalis,” na maaaring magpahiwatig ng pagtataboy.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: nang dalawang buwan
  rationale: Ipinapahayag ng parirala ang tagal ng ipinahintulot na pag-alis; likas sa Filipino ang “nang dalawang buwan.”
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: Umalis nga ito kasama ang mga kaibigan nito
  rationale: Pinananatili ng “nga” ang bahagyang diin ng tahasang panghalip na הִיא, samantalang natural na ipinapahayag ng “kasama” ang pag-alis niya at ng kaniyang mga kasama.
- source_word: רֵעוֹתֶיהָ
  choice: mga kaibigan nito
  rationale: Ang anyong pambabae ay tumutukoy sa kaniyang mga babaeng kasamahan o kaibigan. Ang “mga kaibigan” ay karaniwan at natural, at hindi kailangang tahasang idagdag ang kasarian na malinaw naman sa anyong Hebreo at konteksto.
- source_word: וַתֵּבְךְּ
  choice: iniyakan
  rationale: Ang בכה ay pag-iyak o pagtangis. Sa pariralang may עַל, ang “iniyakan” ay natural na Filipino at malinaw na inuugnay ang pag-iyak sa bagay na ipinagdalamhati.
- source_word: עַל בְּתוּלֶיהָ
  choice: ang pagiging birhen nito
  rationale: Tuwirang pinangalanan ng Hebreo ang kaniyang pagkabirhen bilang bagay na iniyakan. Pinananatili nito ang diin ng teksto nang hindi ipinapasok sa salin ang interpretasyong kamatayan, habambuhay na pagkabirhen, o kawalan ng anak.
- source_word: עַל הֶהָרִים
  choice: sa kabundukan
  rationale: Ang הרים ay mga bundok o burol. Ang “sa kabundukan” ay natural sa modernong Filipino at maaaring tumukoy sa lugar sa ibabaw o loob ng bulubunduking pook nang hindi labis na pinipino ang tanawin.
theological_decisions:
- issue: Kahulugan ng pag-iyak ng anak ni Jefte dahil sa kaniyang pagkabirhen
  choice: Pinananatili ng pangunahing teksto na ang tahasang bagay ng kaniyang pag-iyak ay ang kaniyang pagiging birhen.
  alternative: Ipaliwanag sa pangunahing teksto na iniyakan niya ang nalalapit na kamatayan bilang handog, o ang habambuhay na pagkabirhen at kawalan ng anak.
  rationale: Ang talata mismo ay nagsasabing iniyakan niya ang kaniyang pagkabirhen ngunit hindi nito nilulutas ang mas malawak na usapin tungkol sa naging katuparan ng panata ni Jefte. Ang mas tiyak na paliwanag ay magpapasok ng interpretasyon sa halip na magsalin.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “ito/nito” upang maiwasan ang kalabuan ng sunod-sunod na “siya/kaniya” para sa ama at anak. Ang “Sige, umalis ka” ay natural na pahintulot na may anyong pautos; ang “kabundukan” ay mas likas kaysa sa literal na “sa ibabaw ng mga bundok.”
