  to: Sinabi niya, “Umalis ka.” Kaya pinayagan niya siyang umalis nang dalawang buwan. Umalis siya kasama ng kanyang mga kasama, at sa mga bundok ay iniyakan niya ang kanyang pagkabirhen.[a]
