base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: tl
  text: At sinabi niya sa kanya, “Ama ko, binuka mo ang iyong bibig kay Yahweh[a]; gawin mo sa akin ayon sa anumang lumabas sa iyong bibig, yamang naghiganti si Yahweh para sa iyo laban sa iyong mga kaaway—sa mga anak ni Ammon[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “binuka mo ang iyong bibig kay Yahweh” ay isang idyomang Hebreo para sa pagbigkas ng isang taimtim na panata.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “laban sa mga Ammonita.” Sa Hebreo, “mula/sa mga anak ni Ammon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: binuka mo ang iyong bibig
  rationale: Pinananatili ang kongkretong idyomang Hebreo at ang kaugnayan nito sa kasunod na “lumabas sa iyong bibig.” Nililinaw ng talababa na tumutukoy ito sa isang taimtim na panata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos bilang tuwirang transliterasyon ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: עֲשֵׂה לִי
  choice: gawin mo sa akin
  rationale: Malapit itong sumusunod sa tuwirang diwa ng parirala at ipinapahayag ang pagpapasakop ng anak sa anumang hinihingi ng panata nang hindi ipinapasok ang pinagtatalunang paraan ng katuparan nito.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: ang ayon sa lumabas sa iyong bibig
  rationale: Pinananatili ang larawan ng salitang lumalabas sa bibig at ang pagkakaugnay nito sa naunang idyoma, habang nananatiling malinaw sa Filipino.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: yamang
  rationale: Sa kontekstong ito, ipinakikilala ng parirala ang dahilan ng sinabi niya, hindi lamang ang pagkakasunod-sunod sa panahon.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: naghiganti si Yahweh para sa iyo
  rationale: Likas itong pahayag sa Filipino para sa paggawa ni Yahweh ng mga gawang paghihiganti alang-alang kay Jefta; hindi nito pinapalabnaw ang retributibong diwa ng נְקָמוֹת.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: laban sa iyong mga kaaway—sa mga anak ni Ammon
  rationale: Ipinakikita ng “laban sa” ang puntirya ng paghihiganti, at pinananatili ng “mga anak ni Ammon” ang anyong Hebreo ng katawagan sa pangkat. Nililinaw ng gitling na ang mga anak ni Ammon ang tinutukoy na mga kaaway.
theological_decisions:
- issue: Ang kalikasan at katuparan ng panata ni Jefta sa tugon ng kanyang anak
  choice: Isinalin ang pagpapasakop niya sa panata nang hindi tinutukoy kung paano ito matutupad.
  alternative: Ipaliwanag na tinanggap niya ang literal na paghahandog sa kanya, o kaya nama’y habambuhay na pagkabirhen/paglilingkod.
  rationale: Sinasabi lamang ng talata na pumapayag siyang tuparin sa kanya ang lumabas sa bibig ng kanyang ama. Hindi nito tahasang nilulutas sa linyang ito ang pinagtatalunang kalikasan ng katuparan, kaya pinananatili ng salin ang tensiyon at kalabuan.
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Sadyang pinanatili ang mga larawang “binuka ang bibig” at “lumabas sa bibig” upang maipakita ang pagkakaugnay at bigat ng binigkas na panata; ang talababa ang nagpapaliwanag sa idyoma. Ginamit ang “Ama ko” bilang natural ngunit magalang na tuwirang tawag.
