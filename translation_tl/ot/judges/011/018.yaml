translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang ‘Israel’ bilang kolektibong pangalan at pinanatili ang kapansin-pansing paglipat mula sa isahan patungo sa maramihan sa hulihan ng pangungusap. Inilagay ang mga talababa sa mismong mga pariralang kanilang nililinaw.
