  to: Pagkatapos, naglakbay ang Israel sa ilang at dumaan sa palibot ng lupain ng Edom at ng lupain ng Moab. Dumating ang Israel sa silangang panig ng lupain ng Moab[a], at nagkampo sila sa kabilang panig ng Arnon[b]. Ngunit hindi sila pumasok sa nasasakupan ng Moab, sapagkat ang Arnon ang hangganan ng Moab.
