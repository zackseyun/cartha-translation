base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: tl
  text: Pagkatapos, naglakbay ang Israel sa ilang at dumaan sa palibot ng lupain ng Edom at ng lupain ng Moab. Dumating ang Israel sa silangang panig ng lupain ng Moab[a], at nagkampo sila sa kabilang panig ng Arnon[b]. Ngunit hindi sila pumasok sa nasasakupan ng Moab, sapagkat ang Arnon ang hangganan ng Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, literal na “dumating mula sa pagsikat ng araw patungo sa lupain ng Moab,” isang idyomang tumutukoy sa pagdating sa silangang panig ng Moab.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “sa ibayo ng Arnon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: naglakbay ang Israel sa ilang
  rationale: Ang הלך ay karaniwang ‘pumunta’ o ‘lumakad,’ ngunit sa paglalarawan ng ruta, natural ang ‘naglakbay.’ Ginamit ang ‘ang Israel’ upang malinaw ang kolektibong tinutukoy ng pandiwang nasa isahan.
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: dumaan sa palibot ng lupain ng Edom at ng lupain ng Moab
  rationale: Ipinahihiwatig ng סבב ang pagdaan sa paligid sa halip na pagtawid sa loob ng mga lupaing iyon. Iniiwasan ng ‘dumaan sa palibot’ ang maaaring maling diwa ng pagala-gala.
- source_word: מִדְבָּר
  choice: ilang
  rationale: Ang ‘ilang’ ay likas at tradisyonal na salin para sa lupaing tiwangwang, at hindi nito ipinapalagay na purong mabuhanging disyerto ang lugar.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: Dumating ito sa lupain ng Moab mula sa silangan
  rationale: Ang literal na ‘mula sa pagsikat ng araw’ ay idyoma para sa silangan. Pinananatili ng salin ang direksiyon ng paglapit nang hindi labis na tinutukoy ang eksaktong posisyon.
- source_word: וַיַּחֲנוּן
  choice: nagkampo sila
  rationale: Ang חנה ay ‘magkampo.’ Pinananatili rin ang paglipat ng Hebreo mula sa kolektibong isahan tungo sa pangmaramihang tumutukoy sa mga Israelita.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: sa kabilang panig ng Arnon
  rationale: Ang עֵבֶר ay tumutukoy sa kabilang panig o dako sa ibayo. Hindi tinutukoy ng parirala mismo kung aling panig iyon mula sa makabagong pananaw.
- source_word: בִּגְבוּל מוֹאָב
  choice: sa nasasakupan ng Moab
  rationale: Bagaman maaaring mangahulugang ‘hangganan’ ang גְּבוּל, dito ang pagpasok dito ay tumutukoy sa pagpasok sa teritoryo o nasasakupan ng Moab.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: sapagkat ang Arnon ang hangganan ng Moab
  rationale: Pinananatili ang paliwanag na ang Arnon ang nagsilbing hangganan ng Moab.
