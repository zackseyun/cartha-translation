  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: tl
  text: At ngayon, si Yahweh, ang Diyos ng Israel, ang nagpaalis sa mga Amoreo mula sa harap ng bayan niyang Israel; at ikaw, aangkinin mo ba ito[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kukunin bilang pag-aari” o “mamanahin.” Ang pandiwang Hebreo ay maaaring tumukoy sa pagtanggap o pagkuha ng isang lupain bilang pag-aari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: At ngayon
  rationale: Pinananatili ang pang-ugnay at ang paglipat tungo sa kongklusyon ng pangangatwiran ni Jefta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang isinasalin sa titik ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ang Diyos ng Israel
  rationale: Likas at malinaw na katumbas ng pariralang konstrukto na kumikilala kay Yahweh bilang Diyos ng Israel.
- source_word: הוֹרִישׁ
  choice: nagpaalis
  rationale: Ang Hiphil ng ירש ay tumutukoy dito sa pagpapaalis sa isang bayan mula sa lupaing hawak nito. Natural sa modernong Filipino ang “nagpaalis,” habang ipinahihiwatig ng konteksto ang pagkawala nila ng lupain.
- source_word: הָאֱמֹרִי
  choice: ang mga Amoreo
  rationale: Bagaman pang-isahan ang anyong Hebreo, kolektibo itong tumutukoy sa pangkat-etniko; kaya pangmaramihan ang natural sa Filipino.
- source_word: מִפְּנֵי
  choice: mula sa harap ng
  rationale: Pinananatili ang larawang spatial ng Hebreo nang hindi nagiging labis na literal o malabo.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: bayan niyang Israel
  rationale: Ipinakikita ng hulaping paari na ang Israel ay bayan ni Yahweh, at pinananatili ang appositional na pagkakakilanlan.
- source_word: וְאַתָּה
  choice: at ikaw ba
  rationale: Ipinahahayag ang diin sa malayang panghalip at ang retorikal, mapanghamong tanong.
- source_word: תִּירָשֶׁנּוּ
  choice: aangkin nito
  rationale: Ipinakikita ang pagkuha o paghawak sa lupain. Ang “nito” ay nagpapanatili sa pang-isahang hulaping layon at tumutukoy sa lupaing pinag-aagawan.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Personal na pangalan ang tahasang nasa tekstong Hebreo. Pinananatili ng “Yahweh” ang pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng kilos sa הוֹרִישׁ
  choice: nagpaalis sa mga Amoreo
  alternative: inalisan ng pag-aari ang mga Amoreo
  rationale: Tumutukoy ang pandiwa sa pagkawala ng mga Amoreo sa lupaing hawak nila, ngunit hindi dinaragdagan ang teksto ng tuwirang pahayag tungkol sa paraan ng pagpapaalis.
- issue: Kahulugan ng תִּירָשֶׁנּוּ sa retorikal na tanong
  choice: aangkin nito
  alternative: magmamana nito
  rationale: Sa konteksto ng pag-aangkin sa teritoryo, mas natural ang “aangkin,” ngunit inilalahad sa talababa ang posibleng diwang pagtanggap o pagmamana upang hindi alisin ang leksikal na lawak ng pandiwa.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang retorikal na diin ng tanong at ang bahagyang pormal na larawang “mula sa harap ng,” habang iniwasan ang labis na teknikal na salitang legal.
