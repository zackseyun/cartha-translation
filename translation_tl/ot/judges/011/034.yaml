revisions:
- from: Pagdating ni Jefte sa bahay niya sa Mizpa, walang anu-ano’y lumalabas ang anak niyang babae upang salubungin siya, na may mga tamburin at mga sayaw. Siya ang kaisa-isang anak ni Jefte[a]; bukod sa kanya, wala itong anak na lalaki o babae.
  to: Nang dumating si Jefte sa Mizpa, sa kanyang bahay, narito, lumalabas upang salubungin siya ang kanyang anak na babae, na may mga tamburin at sayawan. Siya ang kanyang kaisa-isang anak[a]; wala siyang anak na lalaki o babae bukod sa kanya.
  rationale: Pinalitan ang interpretibong “walang anu-ano’y” ng “narito” upang maihatid ang dramatikong bisa ng וְהִנֵּה nang hindi nagdaragdag ng impormasyon. Inayos ang unang sugnay upang malinaw na mapanatili ang Mizpa at ang kanyang bahay bilang mga lokasyong binabanggit ng salaysay. Iningatan ang paglalarawan ng anak bilang kaisa-isang anak at hindi nagpasok ng anumang pasya tungkol sa kasunod na panata ni Jefte. Itinama rin ang talababa para sa יְחִידָה.
