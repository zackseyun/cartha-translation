    rationale: Ang יְחִידָה ay literal na “isang tanging/only one” sa anyong pambabae; hindi “siya lamang ang nag-iisa,” bagaman tama ang pagpapaliwanag na ang konteksto ay tumutukoy sa kaisa-isang anak.
