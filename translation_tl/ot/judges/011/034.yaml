  text: וַ/יָּבֹ֨א יִפְתָּ֣ח הַ/מִּצְפָּה֮ אֶל בֵּית/וֹ֒ וְ/הִנֵּ֤ה בִתּ/וֹ֙ יֹצֵ֣את לִ/קְרָאת֔/וֹ בְ/תֻפִּ֖ים וּ/בִ/מְחֹל֑וֹת וְ/רַק֙ הִ֣יא יְחִידָ֔ה אֵֽין ל֥/וֹ מִמֶּ֛/נּוּ בֵּ֖ן אוֹ בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: tl
  text: Nang dumating si Jefte sa Mizpa, sa kanyang bahay, narito, lumalabas upang salubungin siya ang kanyang anak na babae, na may mga tamburin at sayawan. Siya ang kanyang kaisa-isang anak[a]; wala siyang anak na lalaki o babae bukod sa kanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang kanyang tanging isa” (pambabae); sa konteksto, ang ibig sabihin ay siya ang kaisa-isang anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יִפְתָּח הַמִּצְפָּה אֶל בֵּיתוֹ
  choice: Pagdating ni Jefte sa bahay niya sa Mizpa
  rationale: Inihahatid ng anyong salaysay ang kasunod na pangyayari. Pinananatili ng “bahay” ang kongkretong בַּיִת, at ginagamit ang karaniwang anyong Tagalog ng mga pangalang Jefte at Mizpa.
- source_word: וְהִנֵּה
  choice: walang anu-ano’y
  rationale: Natural na panandang Filipino ito para sa biglaan at dramatikong paglitaw na ipinahihiwatig ng הִנֵּה, nang hindi ipinapasok na tahasang nakita ni Jefte ang pangyayari.
- source_word: בִתּוֹ יֹצֵאת לִקְרָאתוֹ
  choice: lumalabas ang anak niyang babae upang salubungin siya
  rationale: Ang “lumalabas” ay kumakatawan sa nagpapatuloy at matingkad na kilos ng participle יֹצֵאת sa sandali ng pagdating ni Jefte; malinaw ring tinutukoy ng “anak na babae” ang בִּתּוֹ.
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  choice: na may mga tamburin at mga sayaw
  rationale: Ang “tamburin” ay madaling maunawaang makabagong tawag sa instrumentong de-kuwerdas? Hindi; ito ay instrumentong pinapalo na kahawig ng frame drum. Ang “mga sayaw” ay nagpapanatili sa pangngalang maramihan na מְחֹלוֹת at sa masayang himig ng pagsalubong.
- source_word: וְרַק הִיא יְחִידָה
  choice: Siya ang kaisa-isang anak ni Jefte
  rationale: Sa konteksto, ang pambabaeng יְחִידָה ay nangangahulugang nag-iisang anak, gaya ng nililinaw ng kasunod na sugnay. Iniiwasan ng salin ang di-natural na literal na “siya lamang ang nag-iisa.”
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: bukod sa kanya, wala itong anak na lalaki o babae
  rationale: Malinaw na ipinahahayag nito na wala nang ibang anak si Jefte, lalaki man o babae, habang pinananatili ang pagbubukod na ipinahihiwatig ng מִמֶּנּוּ.
theological_decisions:
- issue: Kalagayan ng anak na babae ni Jefte kaugnay ng kanyang panata
  choice: 'Isinalin ang talata bilang payak na paglalarawan: siya ang kaisa-isang anak ni Jefte at lumabas siyang masayang sumalubong.'
  alternative: Maaaring iugnay ng ilan ang pagiging kaisa-isang anak sa literal na paghahain sa kaniya; iniuugnay naman ito ng iba sa habambuhay na pagkadalaga o kawalan ng magiging anak.
  rationale: Hindi nilulutas ng talatang ito ang pinagtatalunang kahihinatnan ng anak ni Jefte. Kaya hindi nagdagdag ang salin ng paliwanag na pumapanig sa alinmang pagbasa.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “walang anu-ano’y” upang maihatid ang biglaang dramatikong bisa ng וְהִנֵּה, at iniwasan ang anumang pananalitang paunang nagpapasya sa pinagtatalunang kahihinatnan ng anak ni Jefte.
