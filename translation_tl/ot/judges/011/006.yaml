base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: tl
  text: Sinabi nila kay Jefte, “Halika, maging kumander ka namin, at labanan natin ang mga Ammonita[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Ammon,” isang karaniwang katawagan sa mga Ammonita bilang isang pangkat ng mga tao.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Sinabi nila
  rationale: Ang wayyiqtol ng אמר ay nagpapatuloy sa sunod-sunod na pangyayari sa salaysay; natural sa Tagalog ang payak na “Sinabi nila.”
- source_word: לְיִפְתָּח
  choice: kay Jefte
  rationale: Ginamit ang nakaugaliang anyo ng pangalan sa Tagalog na “Jefte.”
- source_word: לְכָה
  choice: Halika
  rationale: Sa tuwirang panawagang ito, ang pautos ng הלך ay isang paanyaya o pagsamo na lumapit, kaya ang “Halika” ang likas na katumbas.
- source_word: וְהָיִיתָה לָּנוּ
  choice: maging … ka namin
  rationale: Likas na isinasalin sa Tagalog ang literal na “ikaw ay maging para sa amin” bilang “maging … ka namin.”
- source_word: לְקָצִין
  choice: kumander
  rationale: Ang קָצִין ay tumutukoy sa isang pinuno, lalo na sa kontekstong militar. Tiyak at madaling maunawaan ang “kumander” sa nalalapit na pakikipagdigma.
- source_word: וְנִלָּחֲמָה
  choice: at labanan natin
  rationale: Pinananatili ng “at” ang pagkakasunod ng mga cohortative na sugnay at hindi sapilitang ginagawang tahasang layunin ang ugnayan ng mga ito.
- source_word: בִּבְנֵי עַמּוֹן
  choice: ang mga Ammonita
  rationale: Kapag kasama ng לחם, minamarkahan ng ב ang kalaban sa digmaan. Ang literal na “mga anak ni Ammon” ay karaniwang katawagan sa pangkat-etniko, kaya natural ang “mga Ammonita.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Tagalog. Ginamit ang “kumander” upang maipakita ang militar na diwa ng קָצִין, at pinanatili ang payak na koordinasyong “at” upang hindi dagdagan ng tiyak na ugnayang panlayon ang Hebreo.
