  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: tl
  text: Sinabi ni Jefte sa mga matatanda ng Gilead, “Hindi ba kinamuhian ninyo ako at pinalayas ninyo ako mula sa sambahayan ng aking ama? Kaya bakit kayo lumapit sa akin ngayon, ngayong nasa kagipitan kayo?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Sinabi
  rationale: Karaniwang pananalitang pasalaysay para sa wayyiqtol ng אמר; likas at tuwiran sa Filipino.
- source_word: זִקְנֵי גִלְעָד
  choice: mga matatanda ng Gilead
  rationale: Tumutukoy sa kinikilalang mga nakatatandang pinuno ng pamayanan; pinananatili ng tradisyonal ngunit malinaw na katawagang “mga matatanda” ang tungkuling panlipunan at pampolitika.
- source_word: הֲלֹא
  choice: Hindi ba
  rationale: Naghuhudyat ng retorikal na tanong na umaasang sasang-ayon ang kausap.
- source_word: שְׂנֵאתֶם
  choice: kinamuhian ninyo
  rationale: Tuwirang ipinapahayag ang matinding pagkapoot o pagkasuklam na saklaw ng שׂנא nang hindi ito pinahihina bilang simpleng pagtanggi.
- source_word: וַתְּגָרְשׁוּנִי
  choice: pinalayas
  rationale: Ipinakikita ang sapilitang pagpapaalis na ipinahihiwatig ng גרשׁ at natural ito sa modernong Filipino.
- source_word: מִבֵּית אָבִי
  choice: sa sambahayan ng aking ama
  rationale: Ang בֵּית אָב ay maaaring tumukoy hindi lamang sa gusaling tahanan kundi sa sambahayan o angkan; “sambahayan” angkop sa kontekstong pampamilya at legal.
- source_word: וּמַדּוּעַ
  choice: Kaya bakit
  rationale: Naipakikita ang inferensiyal na ugnayan ng ikalawang tanong sa naunang paratang.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: kayo lumapit sa akin ngayon
  rationale: Likas na Filipino para sa pagpunta nila kay Jefte, habang malinaw na pinananatili ang diin ng עַתָּה, “ngayon.”
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: ngayong nasa kagipitan kayo
  rationale: Ipinahahayag ang kalagayang nagtulak sa kanilang paglapit; ang “kagipitan” ay natural at sapat ang lawak para sa pagiging nasa matinding hirap o panganib.
theological_decisions: []
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Ginamit ang “Jefte,” ang karaniwang anyong Filipino ng pangalan, at “sambahayan” upang maipakita ang mas malawak na kahulugan ng paternal household. Walang footnote dahil maisasalin nang malinaw sa pangunahing teksto ang saklaw ng parirala.
