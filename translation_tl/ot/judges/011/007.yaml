- from: Sinabi ni Jefte sa mga matatanda ng Gilead, “Hindi ba kinamuhian ninyo ako at pinalayas sa sambahayan ng aking ama? Kaya bakit kayo lumapit sa akin ngayon, ngayong nasa kagipitan kayo?”
  to: Sinabi ni Jefte sa mga matatanda ng Gilead, “Hindi ba kinamuhian ninyo ako at pinalayas ninyo ako mula sa sambahayan ng aking ama? Kaya bakit kayo lumapit sa akin ngayon, ngayong nasa kagipitan kayo?”
  rationale: Idinagdag ang ‘ninyo ako’ upang malinaw na si Jefte ang layon ng pagpapaalis, at pinalitan ang ‘sa’ ng ‘mula sa’ upang maipahayag ang direksiyong ‘palabas mula sa’ ng מִבֵּית. Walang binagong kahulugan o idinagdag na interpretasyong doktrinal.
