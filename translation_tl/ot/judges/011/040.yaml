  text: מִ/יָּמִ֣ים יָמִ֗ימָ/ה תֵּלַ֨כְנָה֙ בְּנ֣וֹת יִשְׂרָאֵ֔ל לְ/תַנּ֕וֹת לְ/בַת יִפְתָּ֖ח הַ/גִּלְעָדִ֑י אַרְבַּ֥עַת יָמִ֖ים בַּ/שָּׁנָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: tl
  text: Taun-taon, pumupunta ang mga anak na babae ng Israel upang gunitain ang anak na babae ni Jefte na Gileadita, apat na araw bawat taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “panaghuyan” o “isalaysay ang tungkol sa” anak na babae ni Jefte. Bihira ang pandiwang Hebreo at pinagtatalunan ang kahulugan nito.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: Taun-taon
  rationale: Ang idyoma ay tumutukoy sa regular na pag-uulit bawat taon; natural at malinaw ito sa modernong Tagalog.
- source_word: תֵּלַכְנָה
  choice: pumupunta
  rationale: Ang imperfect sa konteksto ay nagpapahayag ng nakaugaliang kilos; ipinahihiwatig ng anyong ito ang paulit-ulit na taunang pagpunta.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: ang mga anak na babae ng Israel
  rationale: Pinananatili nito ang Hebreong tawag nang hindi ipinapalagay ang kanilang edad o katayuan sa pag-aasawa.
- source_word: לְתַנּוֹת
  choice: upang gunitain
  rationale: Bihira at pinagtatalunan ang pandiwa. Ang “gunitain” ay angkop sa taunang pagdiriwang at hindi nito tiyak na ipinapasok ang ideya ng panaghoy; inilalahad sa talababa ang iba pang posibleng pakahulugan.
- source_word: לְבַת יִפְתָּח
  choice: ang anak na babae ni Jefte
  rationale: Tuwirang tinutukoy ng parirala ang anak na babae ni Jefte bilang paksa ng taunang paggunita.
- source_word: הַגִּלְעָדִי
  choice: na Gileadita
  rationale: Natural na pang-uri sa Tagalog para sa katawagang gentiliko.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: apat na araw bawat taon
  rationale: Malinaw at natural na ipinapahayag ang haba at taunang dalas ng kaugalian.
theological_decisions:
- issue: Kahulugan ng taunang gawain para sa anak na babae ni Jefte
  choice: gunitain
  alternative: panaghuyan o salaysayin ang tungkol sa kanya
  rationale: Hindi tiyak ang kahulugan ng bihirang pandiwang Hebreo, at may kaugnayan ito sa pinagtatalunang kinahinatnan ng anak ni Jefte. Hindi nilulutas ng salin ang usaping iyon; pinananatili ng talababa ang mahahalagang alternatibo.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Ginamit ang tradisyonal na anyong “Jefte” at pinanatili ang Hebreong ekspresyong “mga anak na babae ng Israel” upang maiwasan ang labis na pagpapakahulugan.
