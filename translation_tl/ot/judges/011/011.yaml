base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: tl
  text: Kaya sumama si Jefte sa mga matatandang pinuno ng Gilead, at itinalaga siya ng bayan bilang kanilang pinuno at kumandante.[a] At sinabi ni Jefte ang lahat ng kanyang mga salita sa harap ni Yahweh sa Mizpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang salitang isinaling “kumandante” ay maaari ring mangahulugang “tagapamahala” o “kapitan.”
    reason: lexical_alternative
  - marker: b
    text: Maaaring tumukoy ito sa pag-uulit ni Jefte ng lahat ng kanyang mga kondisyon sa harap ni Yahweh. Sa literal, “sinabi ang lahat ng kanyang mga salita.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: sumama si Jefte sa mga matatandang pinuno ng Gilead
  rationale: Ang הלך na may עִם ay nagsasaad ng paglakad o pagsama sa iba. Natural sa modernong Tagalog ang “sumama,” at ang “mga matatandang pinuno” ay nililinaw na ang זִקְנֵי ay mga lider ng pamayanan, hindi lamang matatanda sa edad.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: itinalaga siya ng bayan bilang kanilang
  rationale: Ang שׂים na may layon at עַל ay tumutukoy sa paglalagay o pagtatalaga ng isang tao upang mamuno. Ipinapahayag ng “itinalaga” ang pormal na pagkakatalaga, at pinananatili ng “bayan” ang pagkakaiba ng הָעָם sa mga matatandang pinuno.
- source_word: לְרֹאשׁ וּלְקָצִין
  choice: pinuno at kumandante
  rationale: Ang רֹאשׁ ay metaporikal na pangunahing lider, kaya “pinuno.” Ang קָצִין ay maaaring pinunong sibil o militar; ang “kumandante” ay angkop sa konteksto ng nalalapit na digmaan habang hindi inuulit lamang ang “pinuno.”
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: sinabi ni Jefte ang lahat ng kanyang mga salita
  rationale: Malapit ito sa literal na “sinalita ang lahat ng kanyang mga salita” at hindi nililimitahan ang diwa sa mga kondisyon, kasunduan, panata, o panalangin lamang.
- source_word: לִפְנֵי יְהוָה
  choice: sa harap ni Yahweh
  rationale: Pinananatili ang karaniwang pormulang nagsasaad ng pagkilos sa presensiya ng Diyos at ang solemneng katangian ng tagpo.
- source_word: בַּמִּצְפָּה
  choice: sa Mizpa
  rationale: Isinasalin ang pang-ukol ayon sa natural na gamit sa Tagalog at tinutumbasan ang pangalan ng lugar sa karaniwang anyong Filipino na “Mizpa.”
theological_decisions:
- issue: Pagsasalin sa pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON; Jehova
  rationale: Tahasang nasa Hebreo ang banal na pangalang YHWH. Ang “Yahweh” ay transliterasyong nagpapanatili rito bilang pangalan sa halip na palitan ng titulo.
- issue: Kahulugan ng pagsasalita ni Jefte sa harap ni Yahweh
  choice: sinabi ... ang lahat ng kanyang mga salita
  alternative: inulit ang lahat ng kanyang mga kondisyon; inilahad ang buong usapan
  rationale: Maaaring tumukoy ang parirala sa pormal na muling pagbanggit ng mga kondisyon o sa solemneng pagpapatibay sa harap ni Yahweh, ngunit hindi iyon tahasang tinutukoy ng Hebreo. Pinananatili ng salin ang lawak at tensiyon ng orihinal.
- issue: Saklaw ng katungkulan ni Jefte
  choice: pinuno at kumandante
  alternative: ulo at tagapamahala; pinuno at kapitan
  rationale: Pinagsasama ng dalawang terminong Hebreo ang pangunahing pamumuno at isang tungkuling maaaring militar o pansibil. Sa konteksto, ipinahihiwatig ng “kumandante” ang aspektong militar nang hindi ginagawang eksklusibong militar ang buong pamumuno niya.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “matatandang pinuno” upang maiwasang mapagkamalang edad lamang ang tinutukoy ng elders; “bayan” para sa nagkakatipong mamamayan ng Gilead; at “sa harap ni Yahweh” upang mapanatili ang solemneng pormula ng Hebreo. Lahat ng talababa ay may katugmang marker sa pangunahing teksto.
