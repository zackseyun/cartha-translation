    rationale: Ang “hindi naniwala si Sihon sa Israel na pahintulutan silang dumaan” ay maliwanag na hindi maayos ang pagkakabuo sa Filipino. Kailangang malinaw na ang pagpapahintulot ay implikasyon, hindi alternatibong tuwirang salin.
