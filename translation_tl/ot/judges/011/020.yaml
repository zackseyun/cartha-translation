  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: tl
  text: Ngunit hindi nagtiwala si Sihon sa Israel hinggil sa pagdaan nila sa kanyang nasasakupan[a]. Kaya tinipon ni Sihon ang lahat ng kanyang bayan[b], at nagkampo sila sa Yahaz. Nakipaglaban siya sa Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hindi naniwala si Sihon sa Israel.” Ipinahihiwatig ng konteksto na hindi niya sila sapat na pinagkatiwalaan upang payagan silang dumaan sa kanyang lupain.
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “lahat ng kanyang bayan.” Hindi tahasang sinasabing “lahat ng kanyang hukbo,” bagaman militar ang konteksto.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, literal na “nakipaglaban kasama ang Israel.” Sa kontekstong ito, adversatibo ang kahulugan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: hindi nagtiwala
  rationale: Pinananatili nito ang diwa ng Hiphil ng אמן—ang hindi paglalagak ng tiwala o kumpiyansa—sa halip na isalin lamang ang naging bunga bilang “hindi pinahintulutan.”
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: dumaan sa kanyang nasasakupan
  rationale: Sa konteksto, ang עבר ay pagtawid o pagdaan sa lupaing sakop ng isang hari, at ang גְּבוּל ay tumutukoy rito sa nasasakupang teritoryo, hindi lamang sa hangganang guhit.
- source_word: וַיֶּאֱסֹף
  choice: tinipon
  rationale: Karaniwan at malinaw na salitang Filipino para sa pag-iipon o pagpapangkat ng mga tao; hindi nito tahasang ginagawang “hukbo” ang hindi espesipikong salita sa Hebreo.
- source_word: כָּל עַמּוֹ
  choice: kanyang buong bayan
  rationale: Ang literal na tinutukoy ay “lahat ng kanyang bayan/mamamayan.” Bagaman militar ang konteksto, hindi tahasang “hukbo” ang nakasulat.
- source_word: וַיַּחֲנוּ
  choice: nagkampo sila
  rationale: Ang pandiwa ay maramihan at tumutukoy sa mga taong tinipon ni Sihon. Natural ito sa makabagong Filipino.
- source_word: בְּיָהְצָה
  choice: sa Yahaz
  rationale: Isinasalin ang pangalang Hebreo sa anyong angkop sa bigkas at baybay na Filipino.
- source_word: וַיִּלָּחֶם עִם
  choice: nakipaglaban siya sa
  rationale: Ang “nakipaglaban sa” ay natural na Filipino para sa pakikipagdigma laban sa isang katunggali at kasabay nito ay malapit sa kayariang Hebreo na literal na “lumaban kasama/kasagupa ang.”
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “nasasakupan” para sa teritoryong nasa ilalim ng kapangyarihan ni Sihon, “buong bayan” upang huwag paliitin sa “hukbo” ang Hebreong עַם, at “nakipaglaban sa” bilang natural na katumbas ng adversatibong gamit ng עִם.
