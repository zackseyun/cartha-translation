- from: Ngunit hindi nagtiwala si Sihon sa Israel kaya hindi niya sila pinahintulutang dumaan sa kanyang nasasakupan[a]. Kaya tinipon ni Sihon ang kanyang buong bayan[b], at nagkampo sila sa Yahaz. Nakipaglaban siya sa Israel.
  to: Ngunit hindi nagtiwala si Sihon sa Israel hinggil sa pagdaan nila sa kanyang nasasakupan[a]. Kaya tinipon ni Sihon ang lahat ng kanyang bayan[b], at nagkampo sila sa Yahaz. Nakipaglaban siya sa Israel[c].
