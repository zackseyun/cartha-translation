  source_fidelity: Ang pangunahing teksto ay tumpak sa pagtitipon ng buong bayan, pagkakampo sa Yahaz, at pakikipaglaban laban sa Israel. Gayunman, ang “kaya hindi niya sila pinahintulutang” ay tahasang idinaragdag ang resulta ng kawalan ng tiwala. Bagaman makatuwiran ito sa konteksto, hindi ito hayagang sinasabi ng pandiwa sa Hebreo at dapat iwan bilang pahiwatig.
  naturalness: Malinaw at makabago ang karamihan ng salin. Ang binagong ayos na “hinggil sa pagdaan nila” ay mas natural at mas tapat kaysa sa pagdaragdag ng isang hiwalay na sugnay tungkol sa pagpapahintulot. Inayos rin ang pananalita ng unang talababa, na dati ay hindi likas sa Filipino.
  terminology: Ang “nasasakupan” ay angkop para sa teritoryong nasa pamamahala ni Sihon. Ang “lahat ng kanyang bayan” ay pinananatili ang saklaw ng Hebreong כָּל־עַמּוֹ nang hindi ito ginagawang “hukbo.” Ang “nakipaglaban ... sa” ay likas na Filipino at wastong adversatibong pagbasa sa konteksto.
