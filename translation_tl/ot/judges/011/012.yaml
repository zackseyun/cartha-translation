  - severity: low
    issue: Kulang ang direksiyong “sa akin” sa “pumarito ka.”
    rationale: Ang אֵלַי ay hayagang “sa akin.” Bagaman maaaring mahinuha sa konteksto, mas mabuting ilahad ito sa Tagalog.
