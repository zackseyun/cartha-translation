revisions:
- from: Pagkatapos, nagsugo si Jefte ng mga mensahero sa hari ng mga Ammonita at sinabi, “Ano ang namamagitan sa akin at sa iyo,[a] at pumarito ka upang makipaglaban sa aking lupain?”
  to: 'Pagkatapos, nagsugo si Jefte ng mga mensahero sa hari ng mga Ammonita na may ganitong mensahe: “Ano ang namamagitan sa akin at sa iyo,[a] at bakit ka naparito sa akin upang makipaglaban sa aking lupain?”'
  rationale: Inayos ang pagpapakilala sa tuwirang pananalita upang malinaw na ang mga mensahero ang nagdala ng mensahe ni Jefte. Idinagdag ang “sa akin” at ginawang “bakit ka naparito” ang kasunod na sugnay upang maging natural ang Tagalog habang naipapahayag ang reklamong nasa Hebreo. Nananatili ang bahagyang literal na pangunahing salin ng idyoma at ang mas idyomatikong alternatibo sa talababa.
