base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: tl
  text: 'Pagkatapos, nagsugo si Jefte ng mga mensahero sa hari ng mga Ammonita na may ganitong mensahe: “Ano ang namamagitan sa akin at sa iyo,[a] at bakit ka naparito sa akin upang makipaglaban sa aking lupain?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na, “Ano ang kinalaman mo sa akin?” Ang idyomang Hebreo ay nagpapahayag ng alitan, hidwaan, o pagtutol sa pakikialam ng isang panig sa kabila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Pagkatapos, nagsugo
  rationale: Isinusulong ng waw-consecutive ang salaysay; natural sa modernong Tagalog ang “Pagkatapos” upang ipakita ang pagkakasunod-sunod.
- source_word: יִפְתָּח
  choice: Jefte
  rationale: Ginamit ang nakasanayang anyong Tagalog ng pangalang biblikal.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Sa kontekstong diplomatiko, tumutukoy ito sa mga taong isinugo bilang kinatawan, hindi sa mga anghel.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: sa hari ng mga Ammonita
  rationale: Ang בְּנֵי עַמּוֹן ay katawagang etniko; malinaw at natural sa Tagalog ang “mga Ammonita.”
- source_word: לֵאמֹר
  choice: at sinabi
  rationale: Natural na Tagalog na panimula sa tuwirang pananalita, sa halip na literal ngunit mabigat na “na nagsasabi.”
- source_word: מַה לִּי וָלָךְ
  choice: Ano ang namamagitan sa akin at sa iyo
  rationale: Pinananatili nito ang anyo at tunay na lawak ng idyomang Hebreo, na nagpapahayag ng alitan, hidwaan, o pagtutol sa pakikialam ng kabilang panig.
- source_word: כִּי בָאתָ אֵלַי
  choice: at pumarito ka
  rationale: Sa tanong, natural na nag-uugnay ang “at”; ang literal na direksiyon na “sa akin” ay ipinahihiwatig ng pumarito at nililinaw ng kasunod na layuning makipaglaban.
- source_word: לְהִלָּחֵם
  choice: upang makipaglaban
  rationale: Tuwirang ipinapahayag ang layunin ng pagparito at ang magkabilang panig sa labanan.
- source_word: בְּאַרְצִי
  choice: sa aking lupain
  rationale: Pinananatili ang literal na lokatibong diwa ng preposisyong בְּ at ang personal na pag-angkin sa lupain.
