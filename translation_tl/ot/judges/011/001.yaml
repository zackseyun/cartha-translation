translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Hinati sa dalawang pangungusap ang Hebreong sugnay upang maging natural sa Tagalog nang hindi binabago ang relasyon ng mga ideya. Tuwirang ginamit ang “prostituta” sa halip na eupemismo o mas mapanlait at makalumang katawagan.
