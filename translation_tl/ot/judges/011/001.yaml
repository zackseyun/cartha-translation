base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: tl
  text: Si Jefta na Gileadita ay isang magiting na mandirigma[a]. Anak siya ng isang prostituta[b], at si Gilead ang ama ni Jefta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, mas pormal, “isang lalaking may dakilang tapang.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “anak ng isang prostituta.” Gumagamit ang ilang mas lumang salin ng salitang “patutot.”
    reason: lexical_alternative
  - marker: c
    text: Ang Gilead dito ay pangalan ng ama ni Jefta, hindi lamang pangalan ng rehiyon.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: Gileadita
  rationale: Ang anyong gentiliko ay tumutukoy sa kaugnayan ni Jefta sa rehiyon ng Gilead. Ang “Gileadita” ay maikli, malinaw, at karaniwang anyo sa saling biblikal na Tagalog.
- source_word: גִּבּוֹר חַיִל
  choice: magiting na mandirigma
  rationale: Sa konteksto ng salaysay, ipinahihiwatig ng parirala ang lakas, tapang, at kakayahang militar. Likas at malinaw sa modernong Tagalog ang “magiting na mandirigma,” habang pinananatili ang pangunahing diwang militar.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: Anak siya ng isang prostituta
  rationale: Ang זוֹנָה ay tuwirang tumutukoy sa isang prostituta. Ang “prostituta” ay kasalukuyan, malinaw, at hindi pinahihina o pinatitindi ang panlipunang kahulugan ng salita.
- source_word: וַיּוֹלֶד
  choice: ang ama ni
  rationale: Ang Hiphil ng ילד dito ay nagsasaad ng biyolohikal na pagkaama. Mas natural sa modernong Tagalog ang “si Gilead ang ama ni Jefta” kaysa sa mekanikal o makalumang katumbas ng “begot.”
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Pangalan ito ng taong ama ni Jefta sa sugnay na ito, hindi lamang pangalan ng rehiyon. Pinananatili ang pangalang “Gilead,” at nililinaw ng balangkas ng pangungusap na tao ang tinutukoy.
- source_word: וְ
  choice: at / hindi tahasang isinalin sa simula
  rationale: Ang panimulang וְ ay nag-uugnay sa salaysay ngunit hindi kailangang tumbasan ng “Ngayon.” Hindi ito tahasang salitang temporal; ang mga sumunod na וְ ay natural na naipapahayag sa paghahati ng pangungusap at sa “at.”
