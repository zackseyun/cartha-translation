  to: Pagkatapos, nagsugo ang Israel ng mga sugo[b] kay Sihon, na hari ng mga Amoreo at hari ng Hesbon. Sinabi sa kanya ng Israel, “Pakiusap, padaanin mo kami sa iyong lupain patungo sa aking lugar.”[a]
