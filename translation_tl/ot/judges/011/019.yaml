  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: tl
  text: Pagkatapos, nagsugo ang Israel ng mga sugo[b] kay Sihon, na hari ng mga Amoreo at hari ng Hesbon. Sinabi sa kanya ng Israel, “Pakiusap, padaanin mo kami sa iyong lupain patungo sa aking lugar.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “aking lugar.” Nagsasalita rito ang Israel bilang isang kolektibong persona. Ihambing ang kahilingang kahawig nito sa Bilang 21:22.
    reason: cross_reference
  - marker: b
    text: Ang “mga sugo” ay maaari ring isaling “mga kinatawan” sa diplomatikong kontekstong ito.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Likas na salaysay na katumbas ng wayyiqtol ng שׁלח; ang pandiwa ay angkop sa pagpapadala ng mga kinatawan.
- source_word: מַלְאָכִים
  choice: mga sugo
  rationale: Tumutukoy rito sa mga taong kinatawan sa isang diplomatikong pakikipag-ugnayan, hindi sa mga anghel; pinananatili rin ng “sugo” ang ugnayan sa pandiwang “nagsugo.”
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Transliterasyon ng pangalang pantangi ayon sa karaniwang anyong Filipino.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: hari ng mga Amoreo
  rationale: Malinaw na pinananatili ang titulong hari at ang katawagang etniko; ang isahan sa Hebreo ay kolektibong tumutukoy sa bayang Amoreo.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: hari ng Hesbon
  rationale: Pinananatili ang ikalawang titulong appositional upang tukuyin ang sakop ni Sihon.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: Sinabi sa kanya ng Israel
  rationale: Pinananatili ang tahasang pag-uulit ng “Israel” sa Hebreo habang gumagamit ng natural na ayos sa Filipino.
- source_word: נַעְבְּרָה נָּא
  choice: Pakiusap, padaanin mo kami
  rationale: Ipinahahayag ang cohortative at ang magalang na particle נָא bilang isang magalang na kahilingan.
- source_word: בְאַרְצְךָ
  choice: sa iyong lupain
  rationale: Sa piling ng pandiwang “padaanin,” malinaw na ang kahulugan ay pagdaan sa loob o kahabaan ng teritoryo.
- source_word: עַד מְקוֹמִי
  choice: hanggang sa aking lugar
  rationale: Mahigpit na pinananatili ang unang panauhang isahan ng tekstong Masoretiko, kahit kolektibo ang nagsasalitang Israel.
theological_decisions:
- issue: Pagkakaiba ng maramihang “kami” at isahang “aking” sa kahilingan ng Israel
  choice: Pinanatili ang “aking lugar”
  alternative: aming lugar
  rationale: Ang Hebreo ay may maramihang anyo sa נַעְבְּרָה ngunit tahasang isahan sa מְקוֹמִי. Maaaring nagsasalita ang Israel bilang isang kolektibong persona; hindi dapat tahimik na pagtugmain ang mga panauhan o iayon sa paralelong teksto.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “padaanin mo kami” para sa natural na magalang na kahilingan, ngunit pinanatili ang kapansin-pansing isahang “aking lugar” ng Hebreo at ipinaliwanag ito sa talababa.
