base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: tl
  text: Sinabi ng hari ng mga Ammonita sa mga sugo ni Jefta, “Sapagkat kinuha ng Israel ang aking lupain nang umahon sila mula sa Ehipto—mula sa Arnon hanggang sa Jabok at hanggang sa Jordan—isauli mo ngayon ang mga iyon nang mapayapa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Pinananatili ang tahasang panandang sanhi sa Hebreo, kahit nakasalalay ang paliwanag nito sa naunang tanong ni Jefta.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: nang umahon sila mula sa Ehipto
  rationale: Ang idiomang Hebreo na ‘umahon’ ay pinanatili; ginawang maramihan ang likas na reperensiya sa Israel bilang bayan sa natural na Filipino.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק וְעַד הַיַּרְדֵּן
  choice: mula sa Arnon hanggang sa Jabok at hanggang sa Jordan
  rationale: Tapat na inilalahad ang tatlong heograpikong hangganan at ang inuulit na ‘hanggang sa.’
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: isauli mo ... ang mga iyon
  rationale: Ang panghalip ay pambabaeng maramihan at malamang tumutukoy sa mga lupaing nasasaklaw ng pahayag; pinanatili ang maramihang anyo sa halip na gawing isahan.
- source_word: בְּשָׁלוֹם
  choice: nang mapayapa
  rationale: 'Pinananatili ang paraan o kalagayan ng hinihinging pagsasauli: walang pakikipaglaban.'
theological_decisions:
- issue: Katotohanan ng pag-aangkin ng hari ng mga Ammonita
  choice: Inilahad bilang mismong pahayag niya, nang walang editoryal na pagsang-ayon.
  alternative: Linawin sa salin na mali o pinagtatalunan ang pag-aangkin.
  rationale: Ang talata ay nag-uulat ng diplomatikong pahayag; ang pagsuri rito ay nasa kasunod na sagot ni Jefta, kaya hindi dapat paunang lutasin ng salin ang usaping historikal.
translation_notes:
  register: Makabago at marangal na Filipino. Ginamit ang ‘mga Ammonita,’ ‘mga sugo,’ at ‘isauli’ bilang malinaw at karaniwang bokabularyo; ang mga gatlang ay tumutulong na maunawaan ang saklaw ng inaangking lupain nang hindi binabago ang sintaks o diwa.
