  source_fidelity: 'Tumpak na naihahatid ang pahayag ng hari ng Ammon: ang sanhi ng kaniyang hinihingi, ang pag-ahon ng Israel mula sa Ehipto, ang mga hangganang Arnon, Jabok, at Jordan, at ang utos na isauli ang mga lupain nang mapayapa. Ang maramihang “sila” para sa Israel ay likas na Filipino kapag tumutukoy sa bayan at hindi nakapagpapabago sa diwa ng Hebreong pang-isahang anyo.'
