  text: וַ/יִּבְרַ֤ח יִפְתָּח֙ מִ/פְּנֵ֣י אֶחָ֔י/ו וַ/יֵּ֖שֶׁב בְּ/אֶ֣רֶץ ט֑וֹב וַ/יִּֽתְלַקְּט֤וּ אֶל יִפְתָּח֙ אֲנָשִׁ֣ים רֵיקִ֔ים וַ/יֵּצְא֖וּ עִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: tl
  text: Kaya tumakas si Jefte mula sa kanyang mga kapatid at nanirahan sa lupain ng Tob. Nagtipon sa piling ni Jefte ang mga lalaking walang kabuluhan[a], at lumabas silang kasama niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “mga lalaking walang laman.” Isang idyomang Hebreo ito para sa mga lalaking mababa ang pagkatao o katayuan, hindi lamang sa mga walang ari-arian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: tumakas
  rationale: Ipinahihiwatig ng pandiwa ang pagtakas mula sa panganib o pag-uusig; likas at tuwiran ang “tumakas” sa salaysay.
- source_word: מִפְּנֵי אֶחָיו
  choice: mula sa kanyang mga kapatid
  rationale: Ang idyomang Hebreo ay literal na “mula sa harap/presensiya ng kanyang mga kapatid,” ngunit dito ay nagsasaad ng paglayo dahil sa kanilang pagkapoot.
- source_word: וַיֵּשֶׁב
  choice: nanirahan
  rationale: Saklaw ng ישב ang paninirahan o pagtira; hindi ipinapalagay ng “nanirahan” na permanente ang kanyang paglipat.
- source_word: בְּאֶרֶץ טוֹב
  choice: sa lupain ng Tob
  rationale: Pinananatili ang karaniwang kahulugan ng אֶרֶץ bilang lupain o teritoryo at ang Tob bilang pangalan ng lugar.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: Nagtipon sa piling ni Jefte
  rationale: Ang anyo ng pandiwa ay nagpapahiwatig ng kusang pagtitipon, at ang אֶל ay paglapit tungo sa pakikisama kay Jefte. Natural sa Filipino ang “sa piling” nang hindi tahasang tinutukoy ang uri ng kanilang samahan.
- source_word: אֲנָשִׁים רֵיקִים
  choice: mga lalaking walang kabuluhan
  rationale: Literal na “walang laman” ang רֵיקִים, ngunit idyomatiko itong tumutukoy sa mga lalaking mababa ang pagkatao o katayuan. Pinananatili ng “walang kabuluhan” ang mapanghamak na puwersa nang hindi sila tiyakang tinatawag na mga kriminal.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: lumabas silang kasama niya
  rationale: Pinananatili nito ang bukas na kahulugan ng “lumabas kasama niya”; hindi idinaragdag na sila ay nandambong o nagsagawa ng mga pagsalakay.
theological_decisions: []
translation_notes:
  register: Makabago ngunit marangal na Filipino. Ginamit ang “Jefte,” ang karaniwang anyong Filipino ng pangalan, at pinanatili ang hindi tiyak na layunin ng paglabas ng mga lalaking kasama niya.
