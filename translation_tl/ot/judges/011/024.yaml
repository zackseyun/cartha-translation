base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: tl
  text: Hindi ba ninyo aangkinin ang anumang ipinasasakamay sa inyo ni Kemos, na diyos ninyo? At aangkinin namin ang lahat ng lupain na ipinasakamay sa amin ni Yahweh na aming Diyos sa pamamagitan ng pagpapaalis sa mga naunang naninirahan mula sa harap namin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pandiwang Hebreo na inuulit sa talatang ito ay maaaring mangahulugang “angkinin,” “ariin,” o “kunin bilang pag-aari.” Sa anyong sanhi, maaari itong tumukoy sa pagdudulot na mapasakamay ng iba ang lupain sa pamamagitan ng pagpapaalis sa mga dating nakatira. Lit., “ang lahat ng pinaalis ni Yahweh na aming Diyos mula sa harap namin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Hindi ba’t
  rationale: Nagpapakilala ito ng retorikal na tanong na umaasang sasang-ayon ang kausap; likas at tuwiran ito sa modernong Tagalog.
- source_word: יוֹרִישְׁךָ
  choice: ipinagkaloob sa inyo
  rationale: Ang Hiphil ng ירשׁ ay tumutukoy sa pagdudulot na mapasakamay ng isang tao ang lupain, karaniwang sa pamamagitan ng pagpapaalis sa dating nakatira. Ang 'ipinagkaloob sa inyo' ay malinaw sa resulta, habang ipinapaliwanag sa talababa ang mas malawak na diwa.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Kemos, na diyos ninyo
  rationale: Isinalin nang tuwiran ang pangalang pantangi at ang kaugnayang aposisyonal, ayon sa retorika ni Jefte sa kausap.
- source_word: תִירָשׁ
  choice: aangkinin ninyo
  rationale: Sa kontekstong teritoryal, ang ירשׁ ay pag-angkin o pagkuha sa pag-aari ng lupain; mas natural dito ang 'angkinin' kaysa 'manahin.'
- source_word: הוֹרִישׁ
  choice: pinaalis
  rationale: Ipinahahayag ng Hiphil ang pagpapaalis o pag-aalis sa mga dating nakatira upang mapasakamay ng Israel ang lupain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos sa halip na palitan ito ng isang titulo.
- source_word: מִפָּנֵינוּ
  choice: sa harap namin
  rationale: Malapit ito sa Hebreong idyoma at pinananatili ang spatial at komprontasyonal na larawan.
- source_word: נִירָשׁ
  choice: aangkinin namin
  rationale: Pinananatili ang teritoryal na diwa ng ירשׁ at ang pagkakatulad ng pandiwa sa unang sugnay.
theological_decisions:
- issue: Ang pagtukoy kay Kemos bilang 'diyos ninyo' sa pananalita ni Jefte
  choice: Isinalin nang tuwiran bilang bahagi ng diplomatiko at retorikal na pangangatwiran ni Jefte.
  alternative: Lagyan ng panipi ang 'diyos' o magdagdag ng salitang nagpapahiwatig na hindi tunay si Kemos.
  rationale: Walang ganitong tahasang paglayo o paliwanag sa Hebreo. Inilalahad ng salin ang sinabi ni Jefte nang hindi pinatutunayan ng tagapagsalaysay ang tunay na pagka-Diyos o kapangyarihan ni Kemos.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Ginamit ang magalang na maramihang 'ninyo' dahil hari ang kinakausap, at 'Kemos' bilang likas na transliterasyon sa Filipino. Inilagay ang talababa pagkatapos ng buong talata sapagkat saklaw nito ang magkakaugnay na gamit ng ירשׁ.
