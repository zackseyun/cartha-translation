  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: tl
  text: Kaya tumawid si Jefte patungo sa mga Ammonita upang makipaglaban sa kanila, at ibinigay sila ni Yahweh sa kamay ni Jefte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: tumawid
  rationale: Pinananatili nito ang konkretong diwa ng עבר na pagdaan o pagtawid, nang hindi agad ipinapakahulugang pagsalakay.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: patungo sa mga Ammonita
  rationale: Karaniwang nangangahulugang “patungo sa” ang אֶל, at ang בְּנֵי עַמּוֹן ay likas na etnikong katawagang “mga Ammonita” sa modernong Tagalog.
- source_word: לְהִלָּחֶם בָּם
  choice: upang makipaglaban sa kanila
  rationale: Malinaw at natural na ipinahahayag ang pakikipagdigma laban sa kanila nang hindi pinalalabis ang lawak ng labanan.
- source_word: וַיִּתְּנֵם
  choice: ibinigay sila
  rationale: Pinananatili ang karaniwang Hebreong idyoma ng pagbibigay ng kaaway sa kamay ng mandirigma.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: בְּיָדוֹ
  choice: sa kanyang kamay
  rationale: Pinananatili ang larawan ng Hebreong idyoma, na sa konteksto ay nangangahulugang ipinailalim sa kapangyarihan o tagumpay ni Jefte.
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehova
  rationale: Tuwirang nasa talata ang Tetragrammaton; ang “Yahweh” ay malapit na transliterasyon at hindi pamalit na titulo.
- issue: Ahensiya sa tagumpay laban sa mga Ammonita
  choice: ibinigay sila ni Yahweh sa kanyang kamay
  alternative: pinagtagumpay siya ni Yahweh laban sa kanila
  rationale: Pinananatili ang tahasang pahayag at idyoma ng Hebreo na si Yahweh ang nagbigay sa mga kaaway sa kamay ni Jefte, sa halip na gawing mas malayang paraphrase.
translation_notes:
  register: Modernong Filipino Tagalog na marangal at madaling maunawaan. Pinanatili ang konkretong “tumawid” at ang biblikal na idyomang “sa kanyang kamay”; hindi kailangan ang talababa dahil malinaw ang layuning militar sa kasunod na parirala.
