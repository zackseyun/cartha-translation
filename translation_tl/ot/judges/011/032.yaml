  to: Kaya tumawid si Jefte patungo sa mga Ammonita upang makipaglaban sa kanila, at ibinigay sila ni Yahweh sa kamay ni Jefte.
  rationale: Pinalitan ang malabong panghalip ng “ni Jefte” upang malinaw na ang mga Ammonita ang ibinigay ni Yahweh sa kapangyarihan ni Jefte. Walang kailangang talababa, sapagkat ang kahulugang pandigma ng parirala ay sapat nang malinaw sa pagsasalin.
