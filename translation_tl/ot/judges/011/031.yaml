  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: tl
  text: kung gayon, anuman ang lumabas mula sa mga pintuan ng aking bahay upang salubungin ako kapag ligtas akong makabalik mula sa mga Ammonita ay magiging para sa PANGINOON[a], at ihahandog ko iyon bilang handog na sinusunog.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ay magiging para sa PANGINOON, o ihahandog ko iyon bilang handog na sinusunog.” Itinuturing ng ilang tagapagpaliwanag na ang pangatnig na Hebreo rito ay may diwang “o,” kaya may dalawang posibleng kinalabasan, depende sa kung ano ang lalabas upang salubungin si Jefte.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: anuman ang lumabas
  rationale: Ang Hebreo ay sadyang hindi tiyak kung tao o hayop ang lalabas. Pinananatili ng “anuman” ang pagiging bukás na ito; hindi gaya ng “sinuman,” na agad maglilimita sa tao.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: mula sa mga pintuan ng aking bahay
  rationale: Tapat ito sa pangmaramihang דַּלְתֵי at malinaw sa makabagong Filipino bilang paglabas mula sa pasukan ng bahay.
- source_word: לִקְרָאתִי
  choice: upang salubungin ako
  rationale: Likas na ipinapahayag ng “salubungin” ang pagkilos patungo sa dumarating upang makipagtagpo sa kaniya.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: kapag nakabalik akong ligtas
  rationale: Sa konteksto ng digmaan, malinaw at natural na ipinahahayag ng “ligtas” ang pagbabalik na nasa kalagayan ng שָׁלוֹם, nang hindi ipinapalagay na nakikipagpayapaan siya sa kaaway.
- source_word: מִבְּנֵי עַמּוֹן
  choice: mula sa mga Ammonita
  rationale: Ang “mga Ammonita” ang karaniwang katawagan sa Filipino para sa literal na “mga anak ni Ammon”; ang pang-ukol ay tumutukoy sa pagbabalik mula sa pakikipaglaban sa kanila.
- source_word: וְהָיָה לַיהוָה
  choice: ay magiging sa PANGINOON
  rationale: Pinananatili nito ang diwa ng pag-aalay o pag-aari ng YHWH nang hindi pa ipinapasiya ang eksaktong anyo ng pagtatalaga.
- source_word: לַיהוָה
  choice: sa PANGINOON
  rationale: Ginamit ang tradisyonal at marangal na saling “PANGINOON” para sa banal na pangalang YHWH.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: at ihahandog ko iyon bilang handog na sinusunog
  rationale: Ang Hiphil ng עלה kasama ng עוֹלָה ay karaniwang idyomang pansakripisyo. Ang “iyon” ay nagpapanatili sa bukás na reperente ng “anuman,” samantalang ang “handog na sinusunog” ay malinaw at tumpak.
theological_decisions:
- issue: Kung ang panata ay nagsasaad ng iisang kinalabasan (“magiging sa PANGINOON, at ihahandog”) o dalawang posibleng kinalabasan (“magiging sa PANGINOON, o ihahandog”).
  choice: Iisang kinalabasan na may pangatnig na “at.”
  alternative: 'Dalawang alternatibo na may “o”: “ay magiging sa PANGINOON, o ihahandog ko iyon bilang handog na sinusunog.”'
  rationale: Ang וְ ay karaniwang nangangahulugang “at,” at ito ang pinakatuwirang pagbasa ng sintaks. Gayunman, dahil may tunay na pagtatalo kung maaari itong maging disjunctive rito, inilagay ang alternatibo sa talababa sa halip na burahin ang tensiyon o ipasok sa pangunahing teksto ang isang doktrinal na paglutas.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang ambiguwidad kung tao o hayop ang tinutukoy sa pamamagitan ng “anuman” at “iyon.” Ginamit ang “PANGINOON” para sa YHWH at iniwasan ang denominasyonal na pagpapasiya sa pinagtatalunang pangatnig.
