  terminology: Ang “PANGINOON” para sa YHWH, “mga Ammonita,” at “handog na sinusunog” ay angkop at pare-pareho. Pinananatili ng talababa ang pinagtatalunang disjunctive na pagbasa nang hindi ito ipinapataw sa pangunahing teksto.
