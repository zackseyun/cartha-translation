base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: tl
  text: Sinabi ng mga nakatatanda ng Gilead kay Jefte, “Kaya nga bumalik kami ngayon sa iyo[a], upang sumama ka sa amin at makipaglaban sa mga Ammonita[b], at ikaw ang magiging pinuno ng lahat ng naninirahan sa Gilead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “nagbalik kami sa iyo.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “mga anak ni Ammon,” ibig sabihin, ang mga Ammonita.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: matatandang pinuno
  rationale: Tinutukoy nito ang mga kinikilalang nakatatanda na namumuno sa pamayanan; pinananatili ng parirala kapwa ang katandaan at tungkuling pampamayanan.
- source_word: לָכֵן עַתָּה
  choice: Kaya nga ... ngayon
  rationale: Likas sa modernong Tagalog at malinaw na iniuugnay ang sagot nila sa pagtutol ni Jefte sa naunang talata, habang pinananatili ang diin sa kasalukuyang pagkilos.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: bumalik kami ... sa iyo
  rationale: Ang שׁוּב ay karaniwang nangangahulugang bumalik; sa konteksto, muling nilapitan ng mga pinuno si Jefte matapos siyang itaboy noon.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: sumama ka sa amin
  rationale: Bagaman literal na may diwang 'pumunta,' ang 'sumama ka sa amin' ang likas na Tagalog para sa pag-anyayang makibahagi sa kanilang pagpunta, nang hindi ito ginagawang tahasang pautos.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: makipaglaban sa mga Ammonita
  rationale: Ang 'mga Ammonita' ang malinaw at karaniwang katawagan sa bayang literal na tinatawag na 'mga anak ni Ammon'; ipinahihiwatig ng pandiwa at pang-ukol ang pakikipaglaban laban sa kanila.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: ikaw ang magiging pinuno
  rationale: Ang רֹאשׁ, literal na 'ulo,' ay metapora para sa may pangunahing kapangyarihan. Mas natural sa Tagalog ang 'pinuno' habang pinananatili ang lawak ng awtoridad.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: ng lahat ng naninirahan sa Gilead
  rationale: Tuwirang ipinahahayag nito ang kabuuang saklaw ng pamumuno ni Jefte sa mga taong nakatira sa Gilead.
theological_decisions:
- issue: Saklaw ng ipinangakong pamumuno ni Jefte
  choice: Malawak na pamumuno sa lahat ng naninirahan sa Gilead, hindi lamang pamumuno sa hukbo habang may labanan.
  alternative: Pansamantalang pamumunong militar lamang.
  rationale: Pinalalawak ng pariralang וְהָיִיתָ לָּנוּ לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד ang pangako mula sa pakikipagdigma tungo sa pagiging pinuno ng buong populasyon ng Gilead, nang hindi tinutukoy ang isang mas huling anyo ng pamahalaan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “matatandang pinuno” upang hindi mapagkamalang karaniwang matatanda lamang ang opisyal na mga elder, at “sumama ka sa amin” upang natural na maipahayag ang Hebreong kilos nang hindi ginagawang tahasang pautos ang anyo.
