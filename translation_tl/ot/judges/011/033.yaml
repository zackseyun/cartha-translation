translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang mga idyomatikong pangalang-bayan sa halip na ang literal ngunit di-likas na ‘mga anak ni,’ habang pinanatili sa talababa ang anyong Hebreo. Ang ayos na may em dash ay nililinaw na ang ‘dalawampung lungsod’ ang saklaw ng pananalakay.
