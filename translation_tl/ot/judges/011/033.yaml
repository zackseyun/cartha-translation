base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: tl
  text: At tinalo niya sila mula sa Aroer hanggang sa pasukan ng Minit[a]—dalawampung lungsod—at hanggang sa Abel-keramim[b], sa pamamagitan ng napakatinding dagok.[c] Kaya nasupil ang mga Ammonita sa harap ng mga Israelita.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa Minit” o “hanggang sa paglapit sa Minit.” Medyo mahirap ang pananalitang Hebreo at maaaring tumukoy sa paglapit o pasukan ng lungsod, o sa lungsod mismo.
    reason: alternative_reading
  - marker: b
    text: Pangalan ng lugar ang Abel-keramim. Maaaring nangangahulugan ang mga bahagi ng pangalan ng gaya ng “parang ng mga ubasan,” ngunit pinanatili rito ang pangalan sa transliterasyon.
    reason: lexical_alternative
  - marker: c
    text: 'Sa mas literal: “sa pamamagitan ng isang napakalaking dagok.” Sa konteksto ng digmaan, maaaring tumukoy ang pariralang Hebreo sa mapangwasak na paglusob o pagkatalo; maaari rin itong isaling “napakatinding paglipol.”'
    reason: lexical_alternative
  - marker: d
    text: 'Sa mas literal: “ang mga anak ni Ammon sa harap ng mga anak ni Israel.” Ang “mga Ammonita” at “mga Israelita” ang mas likas na tawag sa Tagalog sa dalawang bayan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: tinalo niya sila
  rationale: Ang נכה ay literal na ‘humampas/sumakit’ ngunit sa konteksto ng digmaan ay tumutukoy sa pagdaig sa kaaway. Ang ‘tinalo’ ay likas sa modernong Tagalog at hindi pa nito ipinapalagay na napatay ang lahat.
- source_word: מֵעֲרוֹעֵר
  choice: mula sa Aroer
  rationale: Pangalan ito ng lugar, kaya tinumbasan sa transliterasyon at pinanatili ang panandang pinagmulan.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: hanggang sa pasukan ng Minit
  rationale: Sa heograpikong pahayag, ang בּוֹאֲךָ ay maaaring tumukoy sa paglapit o pasukan ng isang lugar. Pinananatili ng ‘pasukan’ ang lokatibong diwa habang malinaw sa Tagalog.
- source_word: עֶשְׂרִים עִיר
  choice: dalawampung lungsod
  rationale: Tuwirang salin ng bilang at pangngalan; karaniwang katumbas ng עִיר ang ‘lungsod.’
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: at hanggang sa Abel-keramim
  rationale: Pangalan ng lugar ang parirala, kaya isinalin sa transliterasyon sa halip na isalin ang posibleng kahulugan ng mga bahagi nito.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: napakatinding pagkatalo
  rationale: Ang מַכָּה ay ‘hampas’ o ‘dagok’ at sa kontekstong militar ay matinding pagdaig o pagkatalo. Iniiwasan ng ‘pagkatalo’ ang pagsasaad na tiyak na pagpatay ang ibig sabihin, habang naihahayag ng ‘napakatindi’ ang dobleng pagpapalakas ng parirala.
- source_word: וַיִּכָּנְעוּ
  choice: nasupil
  rationale: Ang Niphal ng כנע ay nangangahulugang mapasuko o mapasailalim. Ang ‘nasupil’ ay angkop sa kinalabasang militar at pampolitika.
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Idyomatikong tawag sa Tagalog para sa kolektibong ‘mga anak ni Ammon,’ nang hindi binabago ang tinutukoy na bayan.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: sa harap ng mga Israelita
  rationale: Pinananatili ng ‘sa harap ng’ ang relational na puwersa ng מִפְּנֵי, samantalang likas sa Tagalog ang ‘mga Israelita’ bilang tawag sa bayan.
