  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: tl
  text: Sa loob ng tatlong daang taon, nanirahan ang Israel sa Hesbon at sa mga bayang sakop nito[a], sa Aroer at sa mga bayang sakop nito, at sa lahat ng lunsod sa kahabaan ng Arnon. Bakit hindi ninyo binawi[b] ang mga iyon noong panahong iyon?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na babae nito,” na tumutukoy sa maliliit na pamayanang umaasa o nasasakupan ng isang pangunahing lunsod.
    reason: cultural_note
  - marker: b
    text: Ang salitang Hebreo ay maaari ring isaling “iniligtas” o “sinagip”; sa konteksto, ang diwa ay pagbawi sa mga lugar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת
  choice: Sa loob ng ... nanirahan
  rationale: Ang בְּ na sinusundan ng infinitive construct ng ישׁב ay nagbibigay ng pangyayaring temporal. Isinama ito sa pariralang tagal upang maging natural sa Tagalog habang pinananatili ang matagal na paninirahan ng Israel.
- source_word: בְּנוֹתֶיהָ
  choice: mga bayang sakop nito
  rationale: Literal itong 'mga anak na babae nito,' isang idyoma para sa maliliit na pamayanang umaasa o nasasakupan ng pangunahing lunsod. Mas malinaw sa karaniwang mambabasa ang 'mga bayang sakop nito,' samantalang ipinaliliwanag sa talababa ang talinghaga.
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Karaniwang anyong Tagalog ng pangalan ng lugar.
- source_word: עַרְעוֹר
  choice: Aroer
  rationale: Transliterasyon ng pangalan ng lugar na angkop sa Tagalog.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: sa kahabaan ng Arnon
  rationale: Ang idyoma ay nangangahulugang nasa tabi, malapit, o kahilera ng Arnon; ang 'sa kahabaan' ay natural at angkop sa maraming lunsod.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: sa loob ng tatlong daang taon
  rationale: Malinaw nitong ipinapahayag ang tagal ng paninirahan o paghawak ng Israel sa mga lugar.
- source_word: וּמַדּוּעַ
  choice: Bakit
  rationale: Hindi kailangang isalin nang hiwalay ang pang-ugnay na וּ sa simula ng retorikal na tanong sa natural na Tagalog.
- source_word: הִצַּלְתֶּם
  choice: binawi
  rationale: Karaniwang nangangahulugan ang Hiphil ng נצל na 'iniligtas,' ngunit sa alitan tungkol sa teritoryo, tumutukoy ito sa pagbawi ng mga lugar mula sa kapangyarihan ng iba. Minarkahan sa talababa ang literal na alternatibo.
- source_word: בָּעֵת הַהִיא
  choice: noong panahong iyon
  rationale: Pinananatili nito ang demonstratibong diin at natural na tumutukoy sa nabanggit na mahabang panahon.
