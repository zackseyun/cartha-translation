translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang 'mga bayang sakop nito' sa pangunahing teksto para madaling maunawaan, habang pinanatili sa talababa ang literal na larawang Hebreo. Hinati sa dalawang pangungusap upang maging natural ang mahabang konstruksiyong Hebreo at luminaw ang retorikal na tanong.
