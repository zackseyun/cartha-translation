base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: tl
  text: Sapagkat nang umahon sila mula sa Ehipto, naglakbay ang Israel sa ilang hanggang sa Dagat na Pula[a] at nakarating sa Kades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Dagat ng mga Tambo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sapagkat
  rationale: Ipinakikilala nito ang paliwanag o batayang pangkasaysayan sa pangangatwiran ni Jefte, habang ang kasunod na parirala ang naghahayag ng panahong “nang.”
- source_word: בַּעֲלוֹתָם מִמִּצְרַיִם
  choice: nang umahon sila mula sa Ehipto
  rationale: Ang ב na may infinitive construct at hulaping panghalip ay temporal. Pinananatili ng “umahon” ang karaniwang paglalarawan sa pag-alis mula sa Ehipto.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: naglakbay ang Israel sa ilang
  rationale: Likas sa modernong Tagalog ang “naglakbay ... sa ilang” para sa paglalakbay sa rehiyong ilang, nang hindi dinaragdagan ang kahulugan ng pandiwa.
- source_word: עַד יַם סוּף
  choice: hanggang sa Dagat na Pula
  rationale: Ang עַד ay nagsasaad ng hangganan o lawak ng paglalakbay. “Dagat na Pula” ang kinikilalang tradisyonal na pangalan, habang inilalahad sa talababa ang leksikal na alternatibo.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: at nakarating sa Kades
  rationale: Ang בוא ay maaaring mangahulugang dumating o makarating, at ang directional he sa קָדֵשָׁה ay nagpapahiwatig ng pagpunta sa Kades.
