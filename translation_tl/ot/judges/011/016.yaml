  source_fidelity: 'Tapat ang salin sa Hebreo: ang כִּי ay angkop na “Sapagkat” bilang pang-ugnay na nagpapakilala ng salaysay na batayan; ang temporal na “nang umahon sila mula sa Ehipto” ay tumutugon sa בַּעֲלוֹתָם מִמִּצְרַיִם; at napananatili ang pagkakasunod ng paglalakbay ng Israel sa ilang, hanggang Yam Suph, at pagdating sa Kades.'
  naturalness: Malinaw, natural, at marangal ang modernong Filipino Tagalog. Ang “naglakbay ang Israel sa ilang” at “nakarating sa Kades” ay maayos na idiomatikong mga pahayag nang hindi lumalayo sa antas ng detalye ng pinagmulan.
