  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: tl
  text: Ngunit hindi pinakinggan ng hari ng mga Ammonita ang mga salitang ipinadala ni Jefte sa kanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Ngunit hindi pinakinggan
  rationale: Sa konteksto, ang pandiwang שׁמע ay hindi lamang pisikal na pagdinig kundi pagtugon o pagbibigay-pansin; natural itong ipinapahayag sa Filipino bilang “hindi pinakinggan.” Ang וְ ay may salungat na diwa rito kaya “Ngunit.”
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: hari ng mga Ammonita
  rationale: Ang literal na “hari ng mga anak ni Ammon” ay likas na tumutukoy sa hari ng bayang Ammonita; ito ang malinaw at karaniwang anyo sa modernong Filipino.
- source_word: אֶל דִּבְרֵי יִפְתָּח
  choice: ang mga salitang ... ni Jefte
  rationale: Pinananatili ang pangmaramihang דִּבְרֵי at ang pagmamay-ari o pinagmulan kay Jefte, habang inaayos ang ayos ng pangungusap para maging natural sa Filipino.
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: ipinasabi sa kanya
  rationale: Literal itong “na ipinadala niya sa kanya,” ngunit ang ipinadala ay “mga salita,” kaya ang idiomatikong Filipino na “ipinasabi” ay malinaw na naghahayag ng mensaheng ipinadala sa pamamagitan ng mga sugo.
