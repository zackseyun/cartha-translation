    rationale: Bagaman posible ang “nasasakupan,” medyo malabo ito sa Filipino at maaaring mangahulugang hurisdiksiyon. Ang “buong lupain” ay malinaw na tumutukoy sa teritoryo sa loob ng mga hangganang kasunod na binanggit.
  revised_text: Kaya sinakop nila ang buong lupain ng mga Amoreo[a], mula sa Arnon hanggang sa Jabok, at mula sa ilang hanggang sa Jordan.
