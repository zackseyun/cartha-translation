base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: tl
  text: Kaya sinakop nila ang buong lupain ng mga Amoreo[a], mula sa Arnon hanggang sa Jabok, at mula sa ilang hanggang sa Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “ang Amoreo,” isang kolektibong anyong isahan na tumutukoy sa mga Amoreo bilang isang bayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: inangkin nila
  rationale: Sa konteksto ng pagsakop sa lupain, ang ירשׁ ay tumutukoy sa pagkuha at pagkontrol sa isang teritoryo. Likas sa Filipino ang “inangkin” at pinananatili nito ang aktibong diwa.
- source_word: כָּל
  choice: buong
  rationale: Pinananatili ang saklaw ng Hebreong panukat na tumutukoy sa kabuuan.
- source_word: גְּבוּל
  choice: nasasakupan
  rationale: Bagaman maaari itong mangahulugang hangganan, dito ay tinutukoy nito ang lupaing nasa loob ng mga binanggit na hangganan.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Ang anyong isahan sa Hebreo ay kolektibo at tumutukoy sa buong pangkat ng mga tao; natural sa Filipino ang maramihang anyo.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: mula sa Arnon hanggang sa Jabok
  rationale: Malinaw at natural na ipinahahayag ang unang pares ng mga hangganan.
- source_word: וּמִן הַמִּדְבָּר
  choice: mula sa ilang
  rationale: Ang “ilang” ay maikli at karaniwang salitang biblikal para sa lupaing masukal, tigang, o hindi tinitirhan, nang hindi ipinapalagay na puro buhangin ito.
- source_word: וְעַד הַיַּרְדֵּן
  choice: hanggang sa Jordan
  rationale: Kinukumpleto nito nang maikli at natural ang ikalawang pares ng mga hangganan.
