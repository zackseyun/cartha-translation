  verdict: revise
  source_fidelity: Tumpak ang mga hangganan at ang kolektibong pagbasa sa הָאֱמֹרִי. Gayunman, ang “inangkin” ay maaaring mangahulugang pag-aangkin o pag-aasta ng karapatan nang hindi kinakailangang aktuwal na pagsakop; mas malinaw na ipinahihiwatig ng וַיִּירְשׁוּ sa kontekstong ito ang pagkuha ng lupain sa pamamagitan ng pagsakop.
  naturalness: Natural ang pangkalahatang hulma ng pangungusap. Mas idiomatiko at malinaw sa makabagong Filipino ang “buong lupain ng mga Amoreo” kaysa “buong nasasakupan ng mga Amoreo,” na maaaring tumukoy sa saklaw ng pamamahala sa halip na sa teritoryong kinuha.
  terminology: Ang “mga Amoreo,” “ilang,” at mga pangalang Arnon, Jabok, at Jordan ay angkop. Pinananatili ng talababa ang mahalagang kolektibong isahan sa Hebreo.
