    rationale: Maaari itong magpahiwatig lamang ng pag-aangkin o pagkuha ng karapatan. Sa salaysay ng pagkuha ng teritoryo, ang “sinakop nila” ay mas tuwirang naghahatid ng aktibong pagkuha at pagkontrol na nasa pandiwa.
