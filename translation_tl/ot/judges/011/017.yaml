  source_fidelity: 'Tapat ang salin sa Hebreo: ipinadala ng Israel ang mga mensahero sa hari ng Edom, ang kahilingang nasa unang panauhang isahan ay napanatili, hindi pinakinggan ng hari ng Edom ang kahilingan, nagpadala rin ang Israel sa hari ng Moab na hindi pumayag, at nanatili ang Israel sa Kades. Ang pag-uulit ng “ang Israel” sa ikalawang sugnay ay isang wastong paglilinaw sa Tagalog.'
  naturalness: Natural at malinaw ang modernong Filipino Tagalog. Ang “nagsugo,” “mga mensahero,” “hindi nakinig,” “hindi ito pumayag,” at “nanatili” ay angkop sa marangal na salaysay. Nauunawaan ang “Makikiraan sana ako” bilang magalang na pakiusap sa loob ng tuwirang pananalita.
  terminology: Ang “mga mensahero” ay wastong pantawag sa mga kinatawang pantao; hindi ito nagmumungkahing mga anghel. Ang “lupain,” “hari,” at “Kades” ay pare-pareho at angkop. Wastong ipinapaliwanag ng talababa a ang kolektibong Israel at ang gramatikal na isahan; wastong inilalahad ng talababa b ang mga katumbas na posibilidad nang hindi pinipilit ang antas ng pagtanggi.
