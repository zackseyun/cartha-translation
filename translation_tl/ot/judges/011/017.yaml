id: JDG.11.17
reference: Judges 11:17
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: tl
  text: Pagkatapos, nagsugo ang Israel ng mga mensahero sa hari ng Edom at sinabi, “Makikiraan sana ako sa iyong lupain.”[a] Ngunit hindi nakinig ang hari ng Edom. Nagsugo rin ang Israel sa hari ng Moab, ngunit hindi ito pumayag.[b] Kaya nanatili ang Israel sa Kades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sa Hebreo, “Makikiraan sana ako” ay nasa unang panauhang isahan; nagsasalita ang Israel bilang isang buong bayan na itinuturing na iisang persona. Maaari ring isalin: “Makikiraan sana kami.”'
    reason: lexical_alternative
  - marker: b
    text: 'Maaari ring isalin: “ayaw nito” o “tumanggi ito.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: nagsugo
  rationale: Karaniwang pandiwang salaysay ito para sa pagpapadala ng mga kinatawan; natural at marangal ang “nagsugo” sa kontekstong diplomatiko.
- source_word: מַלְאָכִים
  choice: mga mensahero
  rationale: Mga taong isinugo bilang kinatawan ang tinutukoy, hindi mga anghel.
- source_word: אֶעְבְּרָה נָּא
  choice: Makikiraan sana ako
  rationale: Pinananatili ang unang panauhang isahan ng Hebreo at ang magalang na pakiusap na ipinahihiwatig ng cohortative at נָא. Ang Israel ay nagsasalita bilang isang kolektibong persona.
- source_word: בְאַרְצֶךָ
  choice: sa iyong lupain
  rationale: Kasama ng pandiwang “makikiraan,” malinaw na transit sa loob o pagtawid sa teritoryo ang kahulugan.
- source_word: וְלֹא שָׁמַע
  choice: hindi nakinig
  rationale: Ang שׁמע dito ay hindi lamang pandinig kundi hindi pagdinig o pagtugon nang sang-ayon sa kahilingan.
- source_word: וְלֹא אָבָה
  choice: hindi ito pumayag
  rationale: Ipinahahayag ng אָבָה ang pagkukusa o pagsang-ayon; ang “hindi pumayag” ay natural at hindi labis na pinatitindi bilang tahasang marahas na pagtanggi.
- source_word: וַיֵּשֶׁב
  choice: nanatili
  rationale: Sa konteksto ng paglalakbay, tumutukoy ito sa patuloy na pananatili sa lugar, hindi sa permanenteng paninirahan.
- source_word: בְּקָדֵשׁ
  choice: sa Kades
  rationale: Natural na anyong Filipino para sa lokasyon sa isang pook na pinangalanan.
theological_decisions:
- issue: Ang Israel bilang kolektibong tagapagsalita sa unang panauhang isahan
  choice: Pinanatili ang “ako” sa tuwirang pahayag
  alternative: “kami”
  rationale: Isahan ang anyong Hebreo, bagaman ang bansang Israel ang tinutukoy. Pinananatili nito ang gramatikal at retorikal na ambigwidad sa halip na tahimik na gawing maramihan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mensahero” para sa mga kinatawang tao at inulit ang “ang Israel” sa ikalawang pagpapadala upang maiwasan ang malabong reperensiya ng panghalip sa Tagalog.
