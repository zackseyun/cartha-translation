base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: tl
  text: Pagdating niya, hinipan niya ang tambuli sa kaburulan ng Efraim. Bumaba mula sa kaburulan ang mga Israelita na kasama niya, at nasa unahan nila siya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Pagdating niya
  rationale: Ang konstruksiyong Hebreo ay nagpapakilala ng kasunod na pangyayari sa oras ng pagdating niya. Likas at maikli sa modernong Tagalog ang “Pagdating niya,” habang napapanatili ang daloy ng salaysay.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: hinipan niya ang tambuli
  rationale: Ang שׁוֹפָר ay isang sungay na ginagamit bilang panawag o hudyat. Ang “tambuli” ay likas na salitang Tagalog para sa ganitong instrumentong hinihipan at angkop sa kontekstong militar.
- source_word: בְּהַר אֶפְרָיִם
  choice: sa kaburulan ng Efraim
  rationale: Sa heograpikong pariralang ito, ang הַר ay tumutukoy sa mataas o maburol na rehiyon, hindi lamang sa isang bundok. Malinaw itong naihahayag ng “kaburulan ng Efraim.”
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: Bumaba ... ang mga Israelita na kasama niya
  rationale: Ang בְנֵי יִשְׂרָאֵל ay isang karaniwang katawagang kolektibo sa mga Israelita. Mas natural at hindi malabo sa modernong Tagalog ang “mga Israelita” kaysa sa literal na “mga anak na lalaki ng Israel.” Inilalagay ng “na kasama niya” ang עִמּוֹ nang malinaw ngunit hindi dinaragdagan ang kahulugan.
- source_word: מִן הָהָר
  choice: mula sa kaburulan
  rationale: Tumutukoy ito pabalik sa parehong mataas na rehiyon ng Efraim. Pinananatili ng “kaburulan” ang kolektibong heograpikong diwa ng pangngalan.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: at nasa unahan nila siya
  rationale: Literal na inilalarawan ng Hebreo ang kinalalagyan niya sa harap nila. Pinananatili ng saling ito ang maaaring pahiwatig ng pamumuno nang hindi tahasang pinapalitan iyon ng interpretasyong “pinangunahan niya sila.”
theological_decisions:
- issue: Kolektibong pananalitang בְנֵי יִשְׂרָאֵל
  choice: mga Israelita
  alternative: mga anak ng Israel
  rationale: Ang parirala ay isang Hebreong idyoma para sa bayang Israel o sa pangkat ng mga Israelitang tinutukoy sa konteksto. Ang “mga Israelita” ay tumpak, likas, at hindi nagpapalagay nang higit sa sinasabi ng teksto tungkol sa kasarian ng bawat kasapi.
- issue: Pahiwatig ng pamumuno sa וְהוּא לִפְנֵיהֶם
  choice: nasa unahan nila siya
  alternative: siya ang nanguna sa kanila
  rationale: Maaaring magpahiwatig ng pamumuno ang pagiging nasa unahan, ngunit hindi ito tahasang sinasabi ng sugnay. Pinananatili ng salin ang posisyon at ang likas na pahiwatig nang hindi nilulutas ang bahagyang kalabuan.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang maiikling pangungusap upang maging malinaw ang sunod-sunod na kilos, habang nananatiling malapit sa estruktura at heograpikong diwa ng Hebreo.
