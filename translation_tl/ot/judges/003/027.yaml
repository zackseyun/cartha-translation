  source_fidelity: 'Tapat ang salin sa Hebreo: naipapahayag ang pagdating ni Ehud, ang paghipan ng shofar, ang kaburulan ng Efraim, ang pagbaba ng mga Israelitang kasama niya, at ang posisyon niya sa unahan nila. Ang kolektibong kahulugan ng בְנֵי יִשְׂרָאֵל ay wasto sa “mga Israelita.”'
