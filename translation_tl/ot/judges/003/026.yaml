revisions:
- from: Ngunit nakatakas si Ehud habang nagtatagal sila. Nilampasan niya ang mga inukit na larawan[a] at tumakas patungong Seira.
  to: Ngunit nakatakas si Ehud habang nagluluwat sila. Dumaan siya lampas sa mga larawang inukit[a] at nakatakas patungong Seira.
  rationale: Pinalitan ang dalawang pananalita upang maging mas natural sa makabagong Filipino at mas malinaw na maipakita ang pagluluwat ng mga lingkod at ang pagdaan ni Ehud lampas sa mga inukit na larawan. Pinanatili ang pag-uulit ng “nakatakas,” ang hindi mapagpasyang salin para sa פסילים, at ang direksiyonal na diwa tungo sa Seira.
