  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: tl
  text: Ngunit nakatakas si Ehud habang nagluluwat sila. Dumaan siya lampas sa mga larawang inukit[a] at nakatakas patungong Seira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga diyus-diyosan” o “mga larawang nililok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: nakatakas / tumakas
  rationale: Ang Niphal ng מלט ay tumutukoy rito sa matagumpay na pagtakas mula sa panganib. Ginamit ang magkaugnay na anyo upang mapanatili ang pag-uulit ng pandiwa sa Hebreo, habang nananatiling natural ang daloy sa Tagalog.
- source_word: עַד הִתְמַהְמְהָם
  choice: habang nagtatagal sila
  rationale: Ipinahihiwatig ng parirala ang panahong nagamit ni Ehud sa pagtakas habang nag-aatubili o nagluluwat ang mga lingkod. Ang “nagtagal” ay natural at hindi labis na nagpapaliwanag ng dahilan ng pagkaantala.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: nilampasan niya ang mga inukit na larawan
  rationale: Ang עבר na may tuwirang layon sa konteksto ng paglalakbay ay nagsasaad ng pagdaan lampas sa isang palatandaan. Ang “nilampasan” ay malinaw at natural sa Filipino.
- source_word: הַפְּסִילִים
  choice: mga inukit na larawan
  rationale: Literal na tumutukoy ang פסילים sa mga larawang inukit at maaaring mangahulugang mga diyus-diyosan. Pinananatili ng salin ang kongkretong anyo ng salita nang hindi tahasang nagpapasya sa eksaktong uri ng mga bagay.
- source_word: הַשְּׂעִירָתָה
  choice: patungong Seira
  rationale: Ang hulaping direksiyonal na ה ay isinasaad ng “patungong,” at ang pangalan ng lugar ay tinumbasan sa madaling basahing transliterasyong Filipino na “Seira.”
- source_word: וְ
  choice: Ngunit
  rationale: 'Ipinakikita ng pangatnig ang kaibahan sa naunang tagpo: habang naghihintay ang mga lingkod, nakatakas naman si Ehud.'
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang mabilis na salaysay at ang pag-uulit ng ideya ng pagtakas. Isang talababa lamang ang ginamit para sa tunay na leksikal na saklaw ng הַפְּסִילִים; hindi kailangan ang hiwalay na talababa para sa transliterasyon ng Seira sa saling Tagalog.
