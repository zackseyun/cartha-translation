base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: tl
  text: Ngunit bumalik siya mula sa mga larawang inukit[a] na malapit sa Gilgal[b] at sinabi, “May lihim akong mensahe[c] para sa iyo, O hari.” Sinabi ng hari, “Tahimik!” Kaya umalis mula sa kanyang harapan ang lahat ng nakatayo sa paligid niya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga diyus-diyosan.” Madalas tumukoy ang salitang Hebreo sa mga imaheng ginagamit sa pagsamba.
    reason: lexical_alternative
  - marker: b
    text: O “na nasa Gilgal.” Maikli at eliptikal ang pariralang Hebreo at maaaring tumukoy sa pagiging malapit sa Gilgal o sa mismong lokasyon doon.
    reason: lexical_alternative
  - marker: c
    text: O “lihim na salita” o “pribadong usapin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: bumalik
  rationale: Tumutukoy ang pandiwa sa pagbabalik o pagbaligtad ng direksiyon ni Ehud matapos siyang umalis kasama ng pangkat na naghatid ng handog.
- source_word: הַפְּסִילִים
  choice: mga larawang inukit
  rationale: Pinananatili nito ang kongkretong kahulugan ng mga imaheng nililok, habang kinikilala sa talababa na madalas itong tumukoy sa mga diyus-diyosan.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: na malapit sa Gilgal
  rationale: Masinsin at bahagyang eliptikal ang pariralang Hebreo; malinaw na ipinahihiwatig nito ang lokasyon ng mga larawan kaugnay ng Gilgal, ngunit maaaring mangahulugang malapit doon o naroon mismo.
- source_word: דְּבַר סֵתֶר
  choice: lihim na mensahe
  rationale: Maaaring mangahulugan ang דָּבָר ng salita, bagay, usapin, o mensahe, at ang סֵתֶר ay lihim o nakatago. Natural sa tagpong panghukuman ang “lihim na mensahe” nang hindi tahasang inilalantad ang balak ni Ehud.
- source_word: לִי אֵלֶיךָ
  choice: May ... akong ... para sa iyo
  rationale: Isinasalin nang natural sa Tagalog ang idyomang nagpapahayag na may taglay si Ehud na lihim na bagay o mensaheng nakalaan para sa hari.
- source_word: הַמֶּלֶךְ
  choice: O hari
  rationale: Pinananatili ang tahasang pormal na pagtawag sa hari sa loob ng tuwirang pananalita.
- source_word: הָס
  choice: Tahimik!
  rationale: Maikli at mariin ang utos sa Hebreo. Ang “Tahimik!” ay nagpapanatili sa bigla at walang tinukoy na kausap na utos.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: ang lahat ng nakatayo sa tabi niya
  rationale: Malapit ito sa anyo ng Hebreo at malinaw na tumutukoy sa mga tagapaglingkod o taong nakapaligid at naglilingkod sa hari.
- source_word: מֵעָלָיו
  choice: mula sa kanyang harapan
  rationale: Sa kontekstong panghukuman, inilalarawan nito ang pag-alis ng mga tagapaglingkod mula sa kinaroroonan o presensiya ng hari.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Pinanatili ang maikli at mariing “Tahimik!” at ang pormal na “O hari.” Hindi tinukoy kung sino ang tuwirang kinakausap sa utos upang mapanatili ang anyo at bahagyang kalabuan ng Hebreo.
