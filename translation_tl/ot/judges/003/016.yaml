translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tabak” at “kasuotan” bilang madaling maunawaang mga salitang hindi labis na espesipiko. Iningatan ang kawalang-katiyakan ng bihirang sukat na גֹּמֶד sa pamamagitan ng “mga” at ng talababa.
