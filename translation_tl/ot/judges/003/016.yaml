base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: tl
  text: Gumawa si Ehud para sa sarili niya ng isang tabak na may dalawang talim[a] at mga isang siko ang haba[b]. Ikinabit niya iyon sa ilalim ng kanyang kasuotan, sa kanyang kanang hita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin na “tabak na magkabila ang talim.” Literal sa Hebreo, “isang tabak, at mayroon itong dalawang bibig.”
    reason: lexical_alternative
  - marker: b
    text: Ang Hebreong sukat na gomed ay bihira, at hindi tiyak ang eksaktong haba nito. Karaniwan itong inuunawang halos isang siko, o kasukat ng bisig mula siko hanggang dulo ng daliri.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ אֵהוּד
  choice: Gumawa si Ehud para sa sarili niya
  rationale: Ang לֹו pagkatapos ng עשה ay nagpapahiwatig na ginawa ni Ehud ang sandata para sa sarili niyang paggamit. Likas sa modernong Tagalog ang pariralang “para sa sarili niya.”
- source_word: חֶרֶב
  choice: tabak
  rationale: Ang חֶרֶב ay pangkalahatang tawag sa tabak. Bagaman maaaring magmukhang punyal ang sandata dahil sa haba nito, hindi ganoon katiyak ang salitang Hebreo.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: may dalawang talim
  rationale: Literal itong tumutukoy sa “dalawang bibig,” isang idyomang Hebreo para sa talim sa magkabilang gilid. Malinaw at likas sa Tagalog ang “may dalawang talim.”
- source_word: גֹּמֶד אָרְכָּהּ
  choice: mga isang siko ang haba
  rationale: Ang גֹּמֶד ay isang bihira at hindi tiyak na sinaunang sukat, na karaniwang inuunawang halos kasinghaba ng isang siko o bisig. Ipinahihiwatig ng “mga” na pagtatantiya ang sukat.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: Ikinabit niya iyon
  rationale: Ang חגר ay nangangahulugang magbigkis o magkabit ng sandata sa katawan. Ang “ikinabit” ay natural sa kasalukuyang Tagalog at hindi nagpapalagay ng tiyak na uri ng panali.
- source_word: מִתַּחַת לְמַדָּיו
  choice: sa ilalim ng kanyang kasuotan
  rationale: Ang מַד ay tumutukoy sa kasuotan o damit. Pinananatili ng “kasuotan” ang pangkalahatang kahulugan nang hindi ito ginagawang balabal o anumang mas tiyak na damit.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: sa kanyang kanang hita
  rationale: Ang יָרֵךְ ay hita o bahaging malapit sa balakang. Ang “kanang hita” ang pinakadirektang katumbas at mahalaga sa salaysay.
