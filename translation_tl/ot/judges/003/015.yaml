  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: tl
  text: Nang magkagayon, dumaing kay Yahweh ang mga anak ni Israel, at nagbangon si Yahweh para sa kanila ng isang tagapagligtas—si Ehud na anak ni Gera, isang Benjaminita, isang lalaking limitado ang paggamit ng kaniyang kanang kamay.[a] Ipinadala ng mga anak ni Israel sa pamamagitan niya ang tributo kay Eglon na hari ng Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, ayon sa mas karaniwang salin, “isang lalaking kaliwete.” Literal na inilalarawan ng Hebreo si Ehud bilang limitado o nahahadlangan sa kaniyang kanang kamay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: dumaing
  rationale: Ipinahahayag ng זעק ang apurahang pagdaing mula sa kagipitan. Likas sa Filipino ang “dumaing” at hindi nito idinaragdag nang tahasan ang layuning “humingi ng tulong,” na ipinahihiwatig lamang ng konteksto.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili nito ang Hebreong idyoma at malinaw na tumutukoy sa mga inapo o sambayanan ni Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang transliterasyon ng personal na banal na pangalan sa halip na palitan ito ng isang titulo.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: nagbangon ... ng isang tagapagligtas
  rationale: Pinananatili ng “nagbangon” ang karaniwang larawan ng Diyos na nagtatalaga ng mga hukom, samantalang ang “tagapagligtas” ay tumutukoy rito sa taong ginamit upang iligtas ang Israel.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Ehud na anak ni Gera
  rationale: Karaniwang transliterasyon ng mga pangalang pantangi at likas na pagpapahayag ng ugnayang ama-anak sa Filipino.
- source_word: בֶּן הַיְמִינִי
  choice: isang Benjaminita
  rationale: Ang anyo ay tumutukoy sa kaanib ng lipi ni Benjamin; “Benjaminita” ang maikli at likas na katumbas.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: isang lalaking limitado ang paggamit sa kanang kamay
  rationale: Pinananatili nito ang di-pangkaraniwang paglalarawan at ang kalabuan kung si Ehud ay kaliwete lamang o may tunay na limitasyon sa kanang kamay.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: ipinadala ... sa pamamagitan niya
  rationale: 'Ang בְּיָדוֹ ay idyoma ng ahensiya: si Ehud ang nagdala o naghatid ng tributo. Mas natural ito sa Filipino kaysa sa literal na “sa kaniyang kamay.”'
- source_word: מִנְחָה
  choice: tributo
  rationale: Sa kontekstong pampolitika, tumutukoy ito sa bayad na ibinibigay sa isang naghaharing dayuhan, hindi sa isang handog na panrelihiyon.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: kay Eglon na hari ng Moab
  rationale: Tuwirang isinasalin ang pangalan at titulong maharlika sa natural na ayos ng Filipino.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Tuwirang ginagamit ng talata ang Tetragrammaton. Pinananatili ng “Yahweh” ang personal na pangalan sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Saklaw ng katawagang מוֹשִׁיעַ para kay Ehud
  choice: tagapagligtas
  alternative: tagapagpalaya o tagasagip
  rationale: Ang salita ay tumutukoy dito sa taong ibinangon ng Diyos upang iligtas ang Israel. Hindi nililimitahan ng salin ang termino sa espirituwal o eskatolohikong pagliligtas.
- issue: Kalagayan ng kanang kamay ni Ehud
  choice: limitado ang paggamit sa kanang kamay
  alternative: kaliwete
  rationale: Hindi tahasang sinasabi ng Hebreo na siya ay kaliwete; inilalarawan nito ang kanang kamay bilang limitado o nahahadlangan. Pinananatili sa pangunahing teksto ang kalabuan at inilalagay sa talababa ang tradisyonal na pagbasa.
translation_notes:
  register: Makabago at marangal na Filipino na may bahagyang pormal na himig na angkop sa salaysay. Pinanatili ang “mga anak ni Israel,” “nagbangon,” at “Yahweh” dahil mahalaga ang mga ito sa anyo at teolohiya ng Hebreo, ngunit ginawang natural ang idyomang “sa pamamagitan niya.”
