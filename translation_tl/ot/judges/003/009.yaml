  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: tl
  text: At dumaing ang mga anak ng Israel[a] kay Yahweh upang humingi ng tulong. Nagbangon si Yahweh ng isang tagapagligtas[b] para sa mga anak ng Israel, si Otniel na anak ni Kenaz, ang nakababatang kapatid ni Caleb[c]; iniligtas niya sila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Literal na “mga anak ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring “tagasagip” o “tagapagligtas.” Dito, tumutukoy ang Hebreo sa isang taong ibinangon ng Diyos upang sagipin ang Israel.
    reason: lexical_alternative
  - marker: c
    text: Mas tuwirang, “ang kapatid ni Caleb, na mas bata kaysa sa kanya.” Karaniwang inuunawa ang Hebreo na si Otniel ay kapatid ni Caleb at mas bata kaysa kay Caleb, bagaman pinagtatalunan ang eksaktong sintaktikong pag-uugnay ng parirala.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: dumaing sa tulong
  rationale: Ipinahahayag ng pandiwa ang apurahang pagdaing dahil sa kagipitan, hindi lamang simpleng pagtawag o pananalangin.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Pinananatili ang literal at pampamilyang Hebreong pananalita; ipinaliliwanag sa talababa ang natural na katumbas na “mga Israelita.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa halip na palitan ito ng isang titulo.
- source_word: וַיָּקֶם
  choice: nagbangon
  rationale: Tumutukoy sa pagkilos ni Yahweh upang magtalaga at magharap ng isang tao para sa isang natatanging gawain.
- source_word: מוֹשִׁיעַ
  choice: tagapagligtas
  rationale: Likas itong katawagan sa Filipino para sa isang taong nagliligtas; sa konteksto, si Otniel ang taong ibinangon ng Diyos upang sagipin ang Israel mula sa paniniil.
- source_word: וַיּוֹשִׁיעֵם
  choice: iniligtas niya sila
  rationale: Tuwirang pinananatili ang ugnayang leksikal sa “tagapagligtas” at ang konkretong pagliligtas mula sa kaaway.
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  choice: si Otniel na anak ni Kenaz
  rationale: Natural na anyong Filipino para sa pangalang sinusundan ng patronimiko.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: ang nakababatang kapatid ni Caleb
  rationale: 'Ito ang pinakanatural na pagbasa sa parirala: kapatid ni Caleb si Otniel at mas bata siya kay Caleb; hindi nito pinalalabis ang pahambing bilang “pinakabata.”'
theological_decisions:
- issue: Paglalarawan sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa Hebreo, kaya pinananatili ito bilang Yahweh sa halip na palitan ng titulo.
- issue: Kahulugan ng מוֹשִׁיעַ sa salaysay ng Mga Hukom
  choice: tagapagligtas
  alternative: tagasagip
  rationale: Ang tinutukoy ay isang taong ibinangon ng Diyos upang iligtas ang Israel. Pinananatili ng “tagapagligtas” ang bokabularyo ng pagliligtas nang hindi ipinahihiwatig na si Otniel ang pinagmumulan ng pagkakaligtas nang hiwalay sa pagkilos ni Yahweh.
- issue: Pagkakaugnay ni Otniel at Caleb sa אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: ang nakababatang kapatid ni Caleb
  alternative: ang kapatid ni Caleb na mas bata sa kanya
  rationale: Parehong nagsasaad ang mga pagbasa na kapatid ni Caleb si Otniel at mas bata siya rito. Ang napiling anyo ang pinakanatural sa modernong Filipino, habang tinatala sa talababa ang mas lantad na anyo.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Ginamit ang “dumaing sa tulong” upang maipakita ang kagipitan; pinanatili ang “mga anak ng Israel” at “Yahweh” dahil mahalaga ang anyo at pangalan sa tekstong Hebreo. Inayos nang bahagya ang pagkakasunod ng mga sugnay upang malinaw sa Filipino na si Otniel ang tagapagligtas at siya ang nagligtas sa kanila.
