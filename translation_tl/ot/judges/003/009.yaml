revisions:
- from: At dumaing sa tulong ang mga anak ng Israel[a] kay Yahweh. Kaya nagbangon si Yahweh para sa kanila ng isang tagapagligtas[b], si Otniel na anak ni Kenaz, ang nakababatang kapatid ni Caleb[c], at iniligtas niya sila.
  to: At dumaing ang mga anak ng Israel[a] kay Yahweh upang humingi ng tulong. Nagbangon si Yahweh ng isang tagapagligtas[b] para sa mga anak ng Israel, si Otniel na anak ni Kenaz, ang nakababatang kapatid ni Caleb[c]; iniligtas niya sila.
  rationale: Inayos ang mga konstruksiyong Filipino upang maging likas at malinaw, habang pinananatili ang pagkakasunod at kahulugan ng Hebreo. Ang malapit na paglalagay kay Otniel pagkatapos ng “tagapagligtas” at ang semicolon bago “iniligtas niya sila” ay nagpapakitang siya ang tagapagligtas na ibinangon ni Yahweh at siya ang tumukoy sa pandiwang “iniligtas.”
