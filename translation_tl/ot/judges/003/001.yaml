id: JDG.3.1
reference: Judges 3:1
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: tl
  text: 'Ito ang mga bansang iniwan ni Yahweh upang sa pamamagitan nila ay subukin niya ang Israel—ang lahat ng hindi pa nakaranas[a] ng alinman sa mga digmaan sa Canaan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “hindi nakakilala”; dito, tumutukoy ito sa hindi pagkakaroon ng personal na karanasan sa mga digmaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Ito ang
  rationale: Ipinakikilala nito ang bagong talaan habang nagpapatuloy ang salaysay. Hindi na kailangang gawing tahasang “At” ang וְ sa natural na modernong Tagalog.
- source_word: הַגּוֹיִם
  choice: mga bansa
  rationale: Tumutukoy ito sa magkakahiwalay na pangkat etniko at pampolitika na naiwan sa lupain; malinaw at karaniwang katumbas ang “mga bansa.”
- source_word: הִנִּיחַ
  choice: hinayaang manatili
  rationale: Ang causative na anyo ay maaaring mangahulugang iniwan o pinanatiling naroon. Mas malinaw sa konteksto ang “hinayaang manatili” kaysa sa payak na “iniwan,” nang hindi sinasabing pinabayaan sila.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalang kinakatawan ng Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: לְנַסּוֹת
  choice: upang ... subukin
  rationale: Ang נסה ay tumutukoy sa pagsubok o pagpapatunay. Ang “subukin” ay malinaw at hindi nagdaragdag ng diwang “tuksuhin.”
- source_word: בָּם
  choice: sa pamamagitan nila
  rationale: Ipinahihiwatig ng parirala na ang mga bansang ito ang kasangkapan o paraan ng pagsubok sa Israel.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: ang lahat ng hindi nakaranas
  rationale: Ang ידע ay maaaring tumukoy sa pagkakilalang batay sa karanasan. Dahil mga digmaan ang layon, natural na ipinahahayag ng “nakaranas” ang kawalan ng tuwirang pakikibahagi.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: alinman sa mga digmaan sa Canaan
  rationale: Sa ilalim ng pagtanggi, natural sa Tagalog ang “hindi nakaranas ng alinman.” Ang “sa Canaan” ay malinaw na tumutukoy sa mga digmaang kaugnay ng lupain at pananakop nang hindi nagpapalagay ng higit sa konteksto.
theological_decisions:
- issue: Paglalarawan sa layunin ng Diyos sa pag-iiwan sa mga bansa
  choice: upang sa pamamagitan nila ay subukin niya ang Israel
  alternative: upang patunayan niya ang Israel sa pamamagitan nila
  rationale: Tuwirang pinananatili ang pahayag na si Yahweh ang nag-iwan sa mga bansa para subukin ang Israel, nang hindi pinahihina o ipinapaliwanag ang teolohikal na tensiyon.
- issue: Paglalapat ng “ang lahat ng hindi nakaranas”
  choice: Inilagay bilang paglilinaw sa “Israel” pagkatapos ng em dash
  alternative: ang lahat ng Israelitang hindi nakaranas
  rationale: Ipinakikita ng sintaks na ang parirala ay tumutukoy sa mga kabilang sa Israel na hindi nakaranas ng mga naunang digmaan. Hindi idinagdag sa teksto ang “Israelita,” yamang malinaw na ang kaugnayan nito sa “Israel.”
- issue: Pangalan ng Diyos
  choice: Yahweh
  alternative: PANGINOON
  rationale: Ang Hebreo ay tahasang gumagamit ng pangalang יהוה; pinananatili rito ang pangalan sa halip na palitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Ginamit ang “hinayaang manatili” para luminaw ang konteksto, at pinanatili ang tutuldok dahil nagpapatuloy sa susunod na talata ang pagpapaliwanag at talaan.
