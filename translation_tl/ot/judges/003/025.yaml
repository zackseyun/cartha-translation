base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: tl
  text: Naghintay sila hanggang sa mapahiya sila[a], at heto, hindi pa rin niya binubuksan ang mga pinto ng silid sa itaas[b]. Kaya kinuha nila ang susi at binuksan ang mga iyon. At naroon ang kanilang panginoon[c], nakabulagta sa sahig—patay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “hanggang sa mahiya sila.” Maaaring tumukoy ang Hebreong pananalita sa hiya o pagkailang; dito, malamang na tumutukoy ito sa lalo nilang pagkailang habang patuloy silang naghihintay.
    reason: lexical_alternative
  - marker: b
    text: O “silid sa itaas na palapag.”
    reason: lexical_alternative
  - marker: c
    text: O “amo.” Tumutukoy rito ang salita sa taong nakatataas sa kanila, si Eglon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: Naghintay sila
  rationale: Inilalarawan ng pandiwa ang patuloy na paghihintay ng mga lingkod sa labas; ito ang pinakanatural na salin sa modernong Tagalog.
- source_word: עַד בּוֹשׁ
  choice: hanggang sa mapahiya sila
  rationale: Pinananatili nito ang diwa ng hiya o pagkailang na dulot ng napakatagal na paghihintay, nang hindi ito ginagawang tahasang moral na pagkakasala.
- source_word: וְהִנֵּה
  choice: ngunit / At naroon
  rationale: Ang dalawang gamit ay naghuhudyat ng kapansin-pansin o biglang pagbabago sa salaysay. Isinalin nang likas sa Tagalog sa halip na gumamit ng makalumang literal na katumbas.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: hindi pa rin niya binubuksan
  rationale: Ipinahihiwatig ng konstruksyon ang nagpapatuloy na hindi pagbubukas sa puntong iyon; ipinapakita ng “pa rin” ang inaasahang kilos na hindi nangyayari.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: ang mga pinto ng silid sa itaas
  rationale: Pinananatili ang maramihang “mga pinto” at malinaw na inilalarawan ang עֲלִיָּה bilang isang silid sa itaas.
- source_word: הַמַּפְתֵּחַ
  choice: ang susi
  rationale: Tuwiran at karaniwang katumbas sa Tagalog.
- source_word: וַיִּפְתָּחוּ
  choice: binuksan ang mga iyon
  rationale: Ang ipinahihiwatig na layon ay ang mga pintong nabanggit; malinaw ito nang hindi inuulit ang buong parirala.
- source_word: אֲדֹנֵיהֶם
  choice: kanilang panginoon
  rationale: Tumutukoy ito kay Eglon bilang taong nakatataas sa mga lingkod, hindi bilang banal na titulo; nililinaw ito ng talababa.
- source_word: נֹפֵל אַרְצָה
  choice: nakabulagta sa sahig
  rationale: Ipinapahayag nito ang kalagayang nadatnan nila. Ang “sahig” ay natural sa konteksto ng isang silid, samantalang ang “nakabulagta” ay naghahatid ng resulta ng pagkabagsak.
- source_word: מֵת
  choice: patay
  rationale: Tuwirang inilalarawan ang kalagayan ni Eglon nang matagpuan siya.
