translation_notes:
  register: Modernong Filipino Tagalog na marangal ngunit madaling maunawaan. Iniwasan ang makalumang “narito” bilang paulit-ulit na literal na salin ng וְהִנֵּה; ginamit ang natural na daloy ng salaysay habang pinananatili ang biglang pagkatuklas. Ang “panginoon” ay maliit ang titik at may talababa upang hindi mapagkamalang banal na titulo.
