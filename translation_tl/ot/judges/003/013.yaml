id: JDG.3.13
reference: Judges 3:13
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: tl
  text: Tinipon niya sa kaniyang panig ang mga Ammonita at ang Amalek[b]. Pagkatapos, humayo siya at sinalakay ang Israel, at sinakop nila ang Lungsod ng mga Punong Palma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Malamang na tumutukoy ito sa Jerico; ihambing ang Deuteronomio 34:3 at 2 Cronica 28:15.
    reason: cross_reference
  - marker: b
    text: O “mga Amalekita.” Ginagamit sa Hebreo ang “Amalek” bilang kolektibong pangalan ng sambayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: Tinipon niya sa kaniyang panig
  rationale: Ipinahahayag nito ang pagtipon ni Eglon ng mga kakampi sa ilalim ng kaniyang pamumuno, habang pinananatili ang diwa ng אֵלָיו na ‘sa kaniya.’
- source_word: בְּנֵי עַמּוֹן
  choice: mga Ammonita
  rationale: Ito ang likas at malinaw na katawagan sa modernong Tagalog para sa pangkat-etnikong tinutukoy, sa halip na ang literal ngunit di-likas na ‘mga anak ni Ammon.’
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Pinananatili ang anyong pangalang ginamit sa Hebreo, na dito ay kolektibong tumutukoy sa sambayanan; nililinaw sa talababa ang alternatibong ‘mga Amalekita.’
- source_word: וַיֵּלֶךְ
  choice: humayo siya
  rationale: Pinananatili ang payak na pagkakasunod-sunod ng salaysay at hindi nagdaragdag ng tahasang kahulugang militar gaya ng ‘nagmartsa.’
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: sinalakay ang Israel
  rationale: Sa kontekstong militar, natural na ipinahahayag ng ‘sinalakay’ ang paghampas o paglusob laban sa Israel nang hindi tahasang ipinapalagay na ang pandiwa mismo ay nangangahulugang ‘tinalo.’
- source_word: וַיִּירְשׁוּ
  choice: sinakop nila
  rationale: Ang pandiwa ay ikatlong panauhang maramihan at tumutukoy kay Eglon kasama ng kaniyang mga kakampi. Ang ‘sinakop’ ay malinaw na naghahatid ng pagkuha at paghawak sa lugar.
- source_word: עִיר הַתְּמָרִים
  choice: Lungsod ng mga Punong Palma
  rationale: Pinananatili ang mapaglarawang katawagan sa Hebreo bilang pangalan ng lugar, sa halip na palitan agad ng ‘Jerico.’
theological_decisions:
- issue: Pagkakakilanlan ng עִיר הַתְּמָרִים
  choice: Lungsod ng mga Punong Palma sa pangunahing teksto
  alternative: Jerico
  rationale: Mapaglarawang katawagan, hindi ang tahasang pangalang Jerico, ang nasa tekstong Hebreo. Kaya pinananatili ito sa pangunahing teksto at inilalagay sa talababa ang malamang na pagkakakilanlan.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa salaysay. Ginamit ang ‘humayo’ upang mapanatili ang payak at bahagyang pormal na himig ng tekstong biblikal. Itinama ang pagkakalagay ng mga pananda ng talababa upang ang [b] ay sumunod sa ‘Amalek’ at ang [a] ay sumunod sa ‘Lungsod ng mga Punong Palma,’ ayon sa nilalaman ng bawat talababa.
