  naturalness: Marangal at malinaw ang kabuuang rehistro. Mas natural at mas malapit sa Hebreo ang nominal na pagpapakilala na “Pagkatapos niya ay si Samgar...” sa ganitong maigsi at sunod-sunod na salaysay. Ang “pangtaboy ng baka” ay mas likas na katawagan para sa kasangkapang pang-udyok/pagpapakilos ng baka.
