base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: tl
  text: Pagkatapos niya ay si Samgar na anak ni Anat. Pinabagsak niya ang animnaraang Filisteo gamit ang isang pangtaboy ng baka[a]. Iniligtas din niya ang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang pangtaboy ng baka ay isang patpat na may matulis na dulo na ginagamit upang paandarin ang mga baka.
    reason: cultural_note
  - marker: b
    text: Maaari ring isalin na “Pinalaya rin niya ang Israel.” Sa kontekstong militar, ang pandiwang Hebreo ay maaaring mangahulugang iligtas o palayain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו הָיָה
  choice: Pagkatapos niya ay sumunod
  rationale: Natural itong pagpapahayag sa Filipino ng pagkakasunod-sunod ng salaysay habang pinananatiling di-binabanggit ang pangalan ng naunang hukom.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Samgar na anak ni Anat
  rationale: Isinalin nang tuwiran ang patronimiko nang hindi nagpapasya kung literal na angkan o isang bansag ang parirala.
- source_word: וַיַּךְ
  choice: Pinabagsak
  rationale: Ipinahihiwatig ng pandiwa ang marahas na pagdaig at malamang na pagpatay sa konteksto ng labanan, ngunit hindi nito dinaragdagan ang tahasang sinasabi ng Hebreo.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: animnaraang Filisteo
  rationale: Natural sa Filipino ang kolektibong pagtukoy sa animnaraang kabilang sa bayang Filisteo; malinaw sa konteksto na mga mandirigmang lalaki ang tinutukoy.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: gamit ang isang tungkod na pantaboy sa baka
  rationale: Inilalarawan nito sa malinaw at kasalukuyang Filipino ang kagamitang pansaka na ginamit bilang sandata.
- source_word: וַיֹּשַׁע גַּם הוּא אֶת־יִשְׂרָאֵל
  choice: Iniligtas din niya ang Israel
  rationale: Pinananatili ang paulit-ulit na tema ng pagliligtas sa aklat at ang dagdag na diin ng גַּם הוּא, nang hindi tinutukoy ang lawak o tagal ng pagliligtas.
theological_decisions:
- issue: Kalikasan ng pagliligtas ni Samgar
  choice: Iniligtas din niya ang Israel
  alternative: Pinalaya rin niya ang Israel
  rationale: Ang Hebreong pandiwa ay maaaring tumukoy sa pagliligtas o pagpapalaya sa kontekstong militar. Pinili ang mas malawak at natural na “iniligtas,” habang inilalagay sa talababa ang tunay na alternatibo.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “Samgar” at “Anat” bilang natural na transliterasyon sa Tagalog. Hinati sa tatlong pangungusap upang maging madaling basahin nang hindi binabago ang ugnayan ng mga sugnay.
