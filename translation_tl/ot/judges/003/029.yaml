revisions:
- from: At nang panahong iyon, pinatay nila ang humigit-kumulang sampung libong lalaki ng Moab—pawang malalakas[a] at magigiting na mandirigma[b]. Walang isa mang nakatakas.
  to: At nang panahong iyon, pinabagsak nila ang humigit-kumulang sampung libong lalaking Moabita—pawang matitipunong lalaki[a] at magigiting na mandirigma[b]. Walang isa mang nakatakas.
  rationale: Pinalitan ang “pinatay” ng “pinabagsak” upang hindi mas higpitan ang saklaw ng pandiwang Hebreo kaysa kinakailangan. Pinalitan ang “malalakas” ng “matitipunong lalaki” upang masalamin ang literal at kontekstuwal na puwersa ng שָׁמֵן. Napanatili ang pagtatantiya sa bilang, ang dalawang magkaugnay na paglalarawan, at ang mariing pahayag na walang nakatakas.
