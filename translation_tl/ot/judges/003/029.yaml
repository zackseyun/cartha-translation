  naturalness: Natural at malinaw ang daloy sa modernong Filipino. Ang binagong “pinabagsak” at “matitipunong lalaki” ay nananatiling madaling basahin at mas malapit sa saklaw ng Hebreo.
  terminology: Ang “lalaking Moabita,” “matitipunong lalaki,” at “magigiting na mandirigma” ay angkop sa register at kontekstong militar. Pinananatili ng talababa ang posibleng literal na kahulugan ng שָׁמֵן nang hindi ito ginagawang mapanlibak na paglalarawan.
  issues:
