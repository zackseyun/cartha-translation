base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: tl
  text: At nang panahong iyon, pinabagsak nila ang humigit-kumulang sampung libong lalaking Moabita—pawang matitipunong lalaki[a] at magigiting na mandirigma[b]. Walang isa mang nakatakas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “matatabang lalaki.” Literal na “bawat mataba/matipunong isa”; sa kontekstong ito, malamang na tumutukoy sa mga lalaking malusog at malalakas.
    reason: lexical_alternative
  - marker: b
    text: O “mga lalaking may kakayahan” o “makapangyarihang mga lalaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: pinatay nila
  rationale: Sa konteksto ng labanan, ang נכה ay tumutukoy sa pagpaslang o pagpabagsak sa kaaway. Ang kasunod na “walang isa mang nakatakas” ay sumusuporta sa malinaw na resultang kamatayan.
- source_word: אֶת מוֹאָב
  choice: mga lalaki ng Moab
  rationale: Literal na “Moab,” ngunit nililinaw ng kasunod na bilang na “sampung libong lalaki” na mga lalaking Moabita ang tinutukoy.
- source_word: בָּעֵת הַהִיא
  choice: nang panahong iyon
  rationale: Likas at dignified na katumbas ng karaniwang pariralang temporal sa Hebreo.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: humigit-kumulang sampung libong lalaki
  rationale: Ipinahihiwatig ng unlaping כ ang pagtatantiya; malinaw itong naipapahayag ng “humigit-kumulang.”
- source_word: כָּל שָׁמֵן
  choice: pawang malalakas
  rationale: Literal na “bawat mataba/matipunong [lalaki].” Sa kontekstong militar, malamang na inilalarawan nito ang mga lalaking malusog, matipuno, o malalakas, hindi lamang ang laki ng katawan.
- source_word: וְכָל אִישׁ חָיִל
  choice: at magigiting na mandirigma
  rationale: Ang אִישׁ חַיִל sa kontekstong ito ay lalaking may lakas, kakayahan, at tapang sa digmaan. Likas sa modernong Tagalog ang “magigiting na mandirigma.”
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: Walang isa mang nakatakas
  rationale: Pinananatili nito ang mariing kabuuan ng pagkatalo at natural ang anyo sa Tagalog.
theological_decisions: []
translation_notes:
  register: 'Modernong Filipino Tagalog na malinaw, dignified, at madaling maunawaan. Ginamit ang “pinatay” dahil malinaw sa konteksto na walang nakaligtas, habang ang dalawang paglalarawan sa mga lalaki ay pinanatiling magkahiwalay: malalakas at magigiting na mandirigma.'
