base_translation:
  language: en
  yaml_path: translation/ot/judges/003/023.yaml
  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: tl
  text: Pagkatapos, lumabas si Ehud patungo sa pasilyong katabi[a]. Isinara niya sa likuran niya ang mga pinto ng silid sa itaas at ikinandado ang mga iyon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “beranda,” “antitsamber,” o “kolonada.” Bihira ang salitang Hebreo at tumutukoy sa isang karugtong na bahagi ng gusali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Karaniwang pandiwang pasalaysay para sa paglabas; malinaw na lumabas si Ehud mula sa silid sa itaas.
- source_word: הַמִּסְדְּרוֹנָה
  choice: patungo sa pasilyong katabi
  rationale: Bihirang katawagang pang-arkitektura ang מִסְדְּרוֹן, at ipinahihiwatig ng hulaping direksiyonal na -ה ang paggalaw patungo sa espasyong iyon. Hindi labis na tinutukoy ng salin ang tiyak na anyo ng estruktura.
- source_word: וַיִּסְגֹּר
  choice: isinara
  rationale: Likas at malinaw na salin ng סגר kapag mga pinto ang tinutukoy.
- source_word: דַּלְתוֹת
  choice: mga pinto
  rationale: Pinananatili ang anyong maramihan, na maaaring tumukoy sa magkapares na pinto o mga panel nito.
- source_word: הָעֲלִיָּה
  choice: silid sa itaas
  rationale: Tuwirang ipinahahayag ang kahulugan ng עֲלִיָּה bilang isang silid sa mataas o itaas na bahagi ng gusali.
- source_word: בַּעֲדוֹ
  choice: sa likuran niya
  rationale: Kasama ng pandiwang 'isara,' ipinahihiwatig ng בעד na isinara ang mga pinto sa likuran ni Ehud matapos siyang lumabas.
- source_word: וְנָעָל
  choice: at ikinandado ang mga iyon
  rationale: Sa kontekstong ito, tumutukoy ang נעל sa pagtiyak o pagkandado ng mga pinto; tahasang ibinalik ang ipinahihiwatig na layon para sa natural na Tagalog.
