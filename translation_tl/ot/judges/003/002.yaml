  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: tl
  text: para lamang malaman ng mga salinlahi ng mga anak ni Israel[a] ang pakikidigma[b], upang turuan sila ng pakikidigma—tanging yaong mga dati’y hindi pa nakaaalam nito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa literal, “mga anak ni Israel.”
    reason: lexical_alternative
  - marker: b
    text: O “maranasan ang digmaan.”
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: lamang
  rationale: Nililimitahan ng kataga ang layunin; pinanatili rin ang pag-uulit nito sa hulihan bilang “yaon lamang.”
- source_word: לְמַעַן
  choice: para ... malaman
  rationale: Likas na Filipino ang konstruksiyong ito at malinaw na naghahayag ng layunin.
- source_word: דַּעַת
  choice: malaman
  rationale: Pinananatili ang malawak na diwa ng ידע na “malaman/makilala,” sa halip na agad itong paliitin sa “maranasan.”
- source_word: דֹּרוֹת
  choice: mga salinlahi
  rationale: Tuwirang katumbas ng pangmaramihang “mga henerasyon,” sa marangal at madaling maunawaang Filipino.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  rationale: Pinananatili ang anyong Hebreo bilang katawagan sa buong bayang Israel; hindi ito tumutukoy lamang sa mga lalaki.
- source_word: לְלַמְּדָם
  choice: upang ituro ito sa kanila
  rationale: Ang Piel ng למד ay “turuan”; ginawang tahasan ang bagay na itinuturo upang maging natural sa Filipino.
- source_word: מִלְחָמָה
  choice: pakikidigma
  rationale: Mas natural bilang kasanayan o gawain na maaaring matutuhan kaysa sa “digmaan,” habang nananatili ang malawak na diwa ng warfare.
- source_word: אֲשֶׁר לְפָנִים
  choice: mga ... noong una
  rationale: Ipinahahayag ang pagtukoy sa naunang kalagayan nang hindi idinaragdag ang salitang “hinaharap.”
- source_word: לֹא יְדָעוּם
  choice: hindi pa nakaalam nito
  rationale: Pinananatili ang pandiwang “alam” at ang reperensiya nito sa pakikidigma; ang “pa” ay likas na nagpapahayag ng naunang kawalan ng kaalaman.
theological_decisions:
- issue: Saklaw ng katawagang בְּנֵי יִשְׂרָאֵל
  choice: mga anak ni Israel
  alternative: mga Israelita
  rationale: Pinananatili ng pangunahing teksto ang kongkretong katawagang Hebreo, samantalang nililinaw sa talababa ang idiomatikong kolektibong kahulugan nito.
- issue: Kahulugan ng “malaman ang pakikidigma”
  choice: malaman ... ang pakikidigma / hindi pa nakaalam nito
  alternative: maranasan ang digmaan
  rationale: Hindi nilulutas nang palihim kung kaalaman, pagsasanay, o aktuwal na karanasan ang nangingibabaw; inilalagay ang mas interpretibong “maranasan” sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang dalawang paglitaw ng רַק at ang sinadyang pag-uulit ng ugat ידע. Ginamit ang mga gitling upang maipakita ang paliwanag na “upang ituro ito sa kanila” nang hindi ganap na nilulutas ang masalimuot na sintaks ng Hebreo.
