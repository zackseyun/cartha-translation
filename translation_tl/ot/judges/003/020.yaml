  text: וְ/אֵה֣וּד בָּ֣א אֵלָ֗י/ו וְ/הֽוּא יֹ֠שֵׁב בַּ/עֲלִיַּ֨ת הַ/מְּקֵרָ֤ה אֲשֶׁר ל/וֹ֙ לְ/בַדּ֔/וֹ וַ/יֹּ֣אמֶר אֵה֔וּד דְּבַר אֱלֹהִ֥ים לִ֖/י אֵלֶ֑י/ךָ וַ/יָּ֖קָם מֵ/עַ֥ל הַ/כִּסֵּֽא׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: tl
  text: Lumapit si Ehud sa kanya habang nakaupo si Eglon mag-isa sa kanyang pribadong preskong silid sa itaas[a], na para lamang sa kanya. Sinabi ni Ehud, “May salita ako mula sa Diyos para sa iyo.” Kaya tumayo siya mula sa kanyang upuan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “preskong silid sa bubungan.”
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isaling “silya” o “trono” ang salitang Hebreo para sa “upuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: lumapit
  rationale: Sa kontekstong ito, ang pagdating ni Ehud ay paglapit niya kay Eglon. Likas sa Tagalog ang “lumapit” at hindi nito labis na tinutukoy ang paraan ng pagpasok.
- source_word: יֹשֵׁב
  choice: nakaupo
  rationale: Ang participle ay naglalarawan ng nagpapatuloy na kalagayan sa tagpo; malinaw itong naipapahayag ng “habang nakaupo.”
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: preskong silid sa itaas
  rationale: Ang עֲלִיָּה ay silid sa itaas o sa bubungan, at malamang na tumutukoy ang הַמְּקֵרָה sa pagiging malamig o maaliwalas nito. Ang “preskong silid sa itaas” ay natural sa modernong Tagalog habang pinananatili ang dalawang pangunahing diwa.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: na para sa kanya ... mag-isa
  rationale: Pinananatili nito kapwa ang pagiging pribado ng silid at ang katotohanang walang ibang kasama si Eglon.
- source_word: דְּבַר אֱלֹהִים לִי אֵלֶיךָ
  choice: May salita ako mula sa Diyos para sa iyo
  rationale: Pinananatili ng “salita” ang anyo at bahagyang lawak ng דָּבָר, samantalang malinaw na ipinahahayag ng buong parirala na may taglay si Ehud na pahayag mula sa Diyos na nakalaan kay Eglon.
- source_word: וַיָּקָם
  choice: tumayo siya
  rationale: Natural at tuwirang katumbas ito ng pagbangon mula sa pagkakaupo.
- source_word: מֵעַל הַכִּסֵּא
  choice: mula sa kanyang upuan
  rationale: Maaaring mangahulugan ang כִּסֵּא ng upuan, luklukan, o trono. Dahil pribadong silid ang tagpuan, hindi ipinapalagay sa pangunahing teksto na pormal na trono ito.
theological_decisions:
- issue: Kahulugan ng אֱלֹהִים sa pahayag ni Ehud
  choice: Diyos
  alternative: mga diyos / isang banal na pinagmulan
  rationale: Bagaman anyong maramihan ang אֱלֹהִים, karaniwan itong ginagamit na isahan para sa Diyos. Sa pariralang דְּבַר אֱלֹהִים, “Diyos” ang pinakanatural na pagbasa. Iniuulat lamang ng salin ang sinabi ni Ehud at hindi nito nilulutas ang moral o teolohikal na tensiyon sa kanyang pahayag.
translation_notes:
  register: Makabago, malinaw, at marangal na salaysay sa Filipino. Ginamit ang “presko” bilang karaniwang salitang nauunawaan para sa isang malamig o maaliwalas na silid, at iniwasan ang sobrang pormal na “luklukan” sa pangunahing teksto dahil pribado ang tagpuan.
