revisions:
- from: Lumapit si Ehud sa kanya habang nakaupo siyang mag-isa sa preskong silid sa itaas[a] na para sa kanya. Sinabi ni Ehud, “May salita ako mula sa Diyos para sa iyo.” Kaya tumayo siya mula sa kanyang upuan[b].
  to: Lumapit si Ehud sa kanya habang nakaupo si Eglon mag-isa sa kanyang pribadong preskong silid sa itaas[a], na para lamang sa kanya. Sinabi ni Ehud, “May salita ako mula sa Diyos para sa iyo.” Kaya tumayo siya mula sa kanyang upuan[b].
  rationale: Tahasan nang pinangalanan si Eglon bilang nakaupo upang alisin ang kalabuan ng panghalip. Idinagdag ang 'pribadong' at 'para lamang sa kanya' upang maipahayag ang eksklusibong gamit ng silid, habang pinanatili ang arkitektural at klimatikong diwa ng עֲלִיַּת הַמְּקֵרָה. Hindi binago ang maingat na salin ng 'Diyos,' 'salita,' at 'upuan.'
