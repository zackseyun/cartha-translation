base_translation:
  language: en
  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: tl
  text: At ang mga anak ni Israel[a] ay nanirahan sa gitna ng mga Cananeo, mga Heteo, mga Amoreo, mga Perezeo, mga Heveo, at mga Jebuseo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak ni Israel.” Maaari rin itong isalin nang mas idyomatiko bilang “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: At ang mga anak ni Israel
  rationale: Pinanatili ang literal at pampamilyang anyong “mga anak ni Israel,” na malinaw at dignidad sa modernong Tagalog; maaari ring sabihing “mga Israelita,” ngunit hindi nito lubos na naipapakita ang anyong בְּנֵי, “mga anak na lalaki/mga anak.”
- source_word: יָשְׁבוּ
  choice: nanirahan
  rationale: Sa kontekstong ito, ang ישׁב ay tumutukoy sa patuloy na paninirahan, hindi lamang sa pag-upo o unang paninirahan.
- source_word: בְּקֶרֶב
  choice: kasama ng
  rationale: Ipinahihiwatig ng parirala ang pamumuhay sa gitna o kapiling ng mga grupong ito. Natural sa Tagalog ang “kasama ng,” bagaman posible rin ang mas pormal na “sa gitna ng.”
- source_word: הַכְּנַעֲנִי
  choice: mga Cananeo
  rationale: Bagaman isahang kolektibo ang anyong Hebreo, ginawang maramihan sa Tagalog upang natural na tumukoy sa pangkat ng mga tao.
- source_word: הַחִתִּי
  choice: mga Heteo
  rationale: Isahang kolektibong katawagan sa Hebreo na natural na isinalin bilang maramihang pangkat-etniko sa Tagalog.
- source_word: הָאֱמֹרִי
  choice: mga Amoreo
  rationale: Isahang kolektibong katawagan sa Hebreo na isinalin bilang maramihan para sa malinaw na pagtukoy sa bayan.
- source_word: הַפְּרִזִּי
  choice: mga Perezeo
  rationale: Isahang kolektibong katawagan sa Hebreo na isinalin bilang maramihang pangalan ng pangkat.
- source_word: הַחִוִּי
  choice: mga Heveo
  rationale: Isahang kolektibong katawagan sa Hebreo na isinalin bilang maramihan para sa natural na Tagalog.
- source_word: הַיְבוּסִי
  choice: mga Jebuseo
  rationale: Isahang kolektibong katawagan sa Hebreo na isinalin bilang maramihang pangalan ng bayan.
