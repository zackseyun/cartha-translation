  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: tl
  text: Pagkalabas niya, dumating ang kanyang mga lingkod at nakita nilang nakakandado ang mga pinto ng silid sa itaas. Kaya sinabi nila, “Tiyak na nagbabawas siya[a] sa malamig na silid sa loob.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa literal, “tinatakpan niya ang kanyang mga paa,” isang Hebreong eupemismo para sa pagdumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Pagkalabas niya
  rationale: Ipinahihiwatig ng sugnay na nauna nang lumabas si Ehud bago dumating ang mga lingkod; natural na ipinapakita ng “Pagkalabas niya” ang ugnayang temporal.
- source_word: עֲבָדָיו
  choice: kanyang mga lingkod
  rationale: Sa konteksto ng sambahayan ng hari, tumutukoy ito sa mga lingkod o tagapaglingkod; hindi sentro ng talata ang legal na katayuan nila.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: nakita nilang
  rationale: Pinagsasama nito sa natural na Tagalog ang pagkakita at ang pampanitikang pantawag-pansin na וְהִנֵּה nang hindi dinaragdagan ang salaysay.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: mga pinto ng silid sa itaas
  rationale: Ang עֲלִיָּה ay silid sa itaas o silid sa bubungan; malinaw at hindi labis na tiyak ang “silid sa itaas.”
- source_word: נְעֻלוֹת
  choice: nakapinid
  rationale: Ipinahihiwatig ng salita na sarado at sinarhan ang mga pinto. Ang “nakapinid” ay dignificado at angkop sa salaysay, bagaman maaari ring isaling “nakakandado.”
- source_word: אַךְ
  choice: Tiyak na
  rationale: Ipinakikita rito ng kataga ang matibay na palagay ng mga lingkod.
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  choice: nagbabawas siya
  rationale: Ang literal na idyomang “tinatakpan ang kanyang mga paa” ay isang magalang na pahiwatig sa pagdumi o pag-aalis ng dumi sa katawan. Ang “nagbabawas” ay malinaw ngunit nananatiling eupemistiko.
- source_word: חֲדַר הַמְּקֵרָה
  choice: malamig na silid sa loob
  rationale: Ang parirala ay tumutukoy sa isang pribado o panloob na silid na malamig; pinananatili ng salin ang dalawang sangkap nang hindi nagpapasiya sa tiyak na anyo ng gusali.
