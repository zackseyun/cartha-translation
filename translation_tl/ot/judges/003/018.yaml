  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: tl
  text: Nang matapos niyang iharap ang tributo[a], pinaalis niya ang mga taong nagdala ng tributo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “kaloob” o “handog.” Sa kontekstong ito, malamang na tumutukoy ang salitang Hebreo sa tributong iniharap sa isang pinuno, hindi sa handog na pansamba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Nang
  rationale: Likas na ipinapahayag sa modernong Tagalog ang temporal na paglipat ng salaysay nang hindi mak‑salitang isinasalin ang pormulang Hebreo.
- source_word: כִּלָּה
  choice: matapos niya
  rationale: Ipinahihiwatig ng pandiwa na nakumpleto muna ang paghaharap bago ang kasunod na pagpapauwi.
- source_word: לְהַקְרִיב
  choice: iharap
  rationale: Ang Hiphil ng קרב ay tumutukoy rito sa pagdadala at pormal na paghaharap sa pinuno; iniiwasan ng ‘iharap’ ang di-kinakailangang kultikong dating ng ‘ialay.’
- source_word: הַמִּנְחָה
  choice: ang buwis
  rationale: Sa konteksto ng pagpapasakop ng Israel kay Eglon, malamang na isang tributo o ipinataw na handog sa hari ang tinutukoy. Ang ‘buwis’ ay malinaw at natural sa Tagalog, habang pinananatili sa talababa ang ibang posibleng kahulugan.
- source_word: וַיְשַׁלַּח
  choice: pinauwi niya
  rationale: Sa konteksto, ang pagpapalayo o pagpapaalis sa mga kasamang tagapagdala ay natural na ipinapahayag bilang pagpapauwi.
- source_word: הָעָם
  choice: ang mga tao
  rationale: Pinananatili nito ang pangkalahatang katawagan ng Hebreo at hindi nagdaragdag na pawang mga lalaki sila.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: mga taong nagdala nito
  rationale: Natural na isinasalin ang participial na paglalarawan at malinaw na ang panghalip ay tumutukoy sa buwis, nang hindi inuulit nang mabigat ang salita.
