language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: tl
  text: Kaya nag-alab ang galit ni Yahweh laban sa Israel, at ipinagbili niya sila sa kapangyarihan ni Cushan-rishathaim, na hari ng Aram-naharaim.[a] Naglingkod ang mga anak ni Israel[b] kay Cushan-rishathaim nang walong taon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Mesopotamia.” Ang Hebreong Aram-naharaim ay tradisyonal na nauunawaan bilang “Aram ng Dalawang Ilog.”
    reason: alternative_reading
  - marker: b
    text: Ang “mga anak ni Israel” ang literal na pananalita sa Hebreo; maaari rin itong isaling “mga Israelita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: nag-alab ang galit
  rationale: Pinananatili nito ang larawang Hebreo ng galit na nag-aalab, habang natural at malinaw sa modernong Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Direktang kinakatawan ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיִּמְכְּרֵם
  choice: ipinagbili niya sila
  rationale: Ang מכר ay karaniwang nangangahulugang “ipagbili.” Pinananatili ng salin ang matinding metapora ng paghatol sa halip na gawing “ibinigay” o “ipinaubaya.”
- source_word: בְּיַד
  choice: sa kamay ni
  rationale: Pinananatili ang idyomang Hebreo tungkol sa pagkakapailalim sa kapangyarihan o kontrol ng isang tao; nauunawaan din ang larawan sa Tagalog.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Cusan-risataim
  rationale: Isinalin-titik ang pangalan ayon sa tunog nito sa Hebreo at sa karaniwang baybay na madaling basahin sa Filipino.
- source_word: אֲרַם נַהֲרָיִם
  choice: Aram-naharaim
  rationale: Pinananatili bilang isinalin-titik na pangalang heograpiko; ang tradisyonal na “Mesopotamia” ay inilagay sa talababa bilang paliwanag.
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Direktang katumbas ng עבד at pinananatili ang maaaring saklaw nitong paglilingkod na may diwang pampolitikang pagpapasakop.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Pinananatili ang literal at nakaugaliang pormulang Hebreo, sa halip na gawing kolektibong “mga Israelita” sa pangunahing teksto.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: nang walong taon
  rationale: Natural na Tagalog para sa tuwirang pahayag ng tagal ng panahon.
theological_decisions:
- issue: Paglalarawan sa galit ng Diyos
  choice: nag-alab ang galit ni Yahweh
  alternative: nagalit si Yahweh
  rationale: Pinananatili ang matingkad na idyomang nasa Hebreo nang hindi dinaragdagan o pinapahina ang pahayag.
- issue: Paglilipat sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Personal na pangalan ang tahasang nasa pinagmulang teksto; pinananatili ito sa halip na palitan ng isang titulo.
- issue: Saklaw ng בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  alternative: ang mga Israelita
  rationale: Pinananatili ang anyong Hebreo at ang katawagan nito sa bayang tipan; nililinaw sa talababa ang mas natural na kolektibong katumbas.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang mga larawang “nag-alab,” “ipinagbili,” at “sa kamay” dahil malinaw ang mga ito sa Tagalog at mahalaga sa retorika ng Hebreo. Ginamit ang “Naglingkod” nang hindi tahasang nilulutas kung ito ay sapilitang paggawa, pampolitikang pagpapasakop, o kapwa.
