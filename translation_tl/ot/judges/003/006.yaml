  to: Kinuha nila ang mga anak na babae ng mga iyon upang maging mga asawa nila, at ibinigay nila ang kanilang mga anak na babae sa mga anak na lalaki ng mga iyon, at naglingkod sila sa mga diyos ng mga iyon.[a]
