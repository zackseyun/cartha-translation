  source_fidelity: 'Tumpak na naipapakita ng draft ang pagpapalit ng mga tinutukoy ng mga panghalip: kinuha ng mga Israelita ang mga anak na babae ng mga bansang nakapaligid bilang asawa, at ibinigay nila ang sarili nilang mga anak na babae sa mga anak na lalaki ng mga bansang iyon. Ang «naglingkod» ay wastong salin ng עבד at pinananatili ang lawak ng kahulugang paglilingkod o relihiyosong pagpapasakop.'
  naturalness: Medyo mabigat at hindi gaanong likas sa makabagong Filipino ang ayos na «bilang mga asawa para sa kanilang sarili.» Mas natural ang «upang maging mga asawa nila,» habang naipapahayag pa rin ang layuning pag-aasawa at ang kaugnayan sa paksa.
  terminology: Ang «mga anak na babae/lalaki,» «mga diyos,» at «naglingkod» ay angkop sa marangal ngunit modernong rehistro. Tama ang pagkakalagay ng talababa sa sugnay na may «naglingkod.»
