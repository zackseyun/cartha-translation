base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: tl
  text: Kinuha nila ang mga anak na babae ng mga iyon upang maging mga asawa nila, at ibinigay nila ang kanilang mga anak na babae sa mga anak na lalaki ng mga iyon, at naglingkod sila sa mga diyos ng mga iyon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “sumamba sila sa mga diyos ng mga iyon.”
    reason: Leksikal na alternatibo para sa עבד kapag mga diyos ang layon.
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kinuha nila
  rationale: Pinananatili nito ang karaniwang kahulugan ng לקח na “kumuha,” habang nililinaw ng kasunod na “bilang mga asawa” ang kontekstong pag-aasawa.
- source_word: אֶת־בְּנוֹתֵיהֶם לָהֶם לְנָשִׁים
  choice: ang mga anak na babae ng mga iyon bilang mga asawa para sa kanilang sarili
  rationale: Ang “ng mga iyon” ay tumutukoy sa mga bansang binanggit sa konteksto; pinananatili ng “para sa kanilang sarili” at “bilang mga asawa” ang dalawang gamit ng לְ sa Hebreo.
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: at ibinigay nila ang kanilang mga anak na babae sa mga anak na lalaki ng mga iyon
  rationale: Ang נתן ay tuwirang isinaling “ibinigay.” Ipinahihiwatig ng konteksto ang pagbibigay sa pag-aasawa, ngunit hindi na ito dinagdagan sa teksto. Ang mga panghalip ay inihayag ayon sa likas na paghahambing ng dalawang panig sa talata.
- source_word: וַיַּעַבְדוּ
  choice: At naglingkod sila
  rationale: Ang עבד kapag ginagamit kaugnay ng mga diyos ay maaaring mangahulugang maglingkod o sumamba. Ang “naglingkod” ay nagpapanatili sa mas malawak na diwa ng katapatan at paglilingkod sa isang diyos.
- source_word: אֶת־אֱלֹהֵיהֶם
  choice: sa mga diyos ng mga iyon
  rationale: Malinaw nitong tinutukoy ang mga diyos ng mga nakapaligid na bayan at gumagamit ng payak at karaniwang salitang Filipino.
theological_decisions:
- issue: Relihiyosong katapatan na ipinapahayag ng עבד kaugnay ng mga diyos
  choice: naglingkod sila sa mga diyos ng mga iyon
  alternative: sumamba sila sa mga diyos ng mga iyon
  rationale: Saklaw ng “naglingkod” ang pagsamba ngunit pinananatili rin nito ang diwa ng pagpapasakop at katapatan. Ang “sumamba” ay wastong alternatibo ngunit mas makitid ang diin.
- issue: Pagpapalit ng tinutukoy ng mga hulaping panghalip sa dalawang sugnay tungkol sa pag-aasawa
  choice: ang unang mga anak na babae ay sa mga bayan, samantalang ang ikalawa ay sa Israel; ang mga anak na lalaki sa ikalawang sugnay ay sa mga bayan
  alternative: panatilihing lubos na malabo ang lahat ng “kanila/nila” gaya ng anyong Hebreo
  rationale: Iisa ang anyo ng hulaping panghalip sa Hebreo, ngunit ipinakikita ng simetrikong paglalarawan ng pag-aasawa ng dalawang pangkat at ng konteksto ang likas na pagpapalit ng tinutukoy. Nililinaw ito nang sapat sa Filipino nang hindi nagdaragdag ng doktrinal na interpretasyon.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang “mga anak na babae/lalaki” sa halip na mas kolokyal na “mga dalaga/binata” upang mapanatili ang ugnayang pampamilya sa Hebreo. Inilagay ang panandang [a] pagkatapos ng sugnay na tinutukoy nito.
