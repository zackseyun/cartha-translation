base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: tl
  text: ang limang pinuno ng mga Filisteo, ang lahat ng mga Cananeo, ang mga Sidonio, at ang mga Hivita na naninirahan sa kabundukan ng Lebanon, mula sa Bundok Baal-hermon hanggang sa Lebo-hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “hanggang sa pasukan ng Hamat.” Maaaring unawain ang ekspresyong Hebreo bilang pangalan ng pook na Lebo-hamat o bilang isang paglalarawan.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: ang limang pinuno ng mga Filisteo
  rationale: Ang anyong construct ay natural na isinasalin bilang tiyak na pangkat. Ang “pinuno” ay malinaw na tumutukoy sa mga natatanging tagapamahalang politikal ng mga Filisteo nang hindi nagdadala ng pyudal na kahulugan.
- source_word: וְכָל הַכְּנַעֲנִי
  choice: ang lahat ng Cananeo
  rationale: Bagaman isahan ang anyong Hebreo, kolektibo ang gamit nito para sa buong pangkat ng mga tao; likas sa Tagalog ang “lahat ng Cananeo.”
- source_word: וְהַצִּידֹנִי
  choice: ang mga Sidonio
  rationale: Ang kolektibong katawagang etniko sa Hebreo ay isinalin sa karaniwang maramihang anyo sa Tagalog.
- source_word: וְהַחִוִּי
  choice: ang mga Hivita
  rationale: Ang kolektibong isahang katawagang etniko ay natural na ipinahayag bilang maramihan sa Tagalog.
- source_word: יֹשֵׁב
  choice: na naninirahan
  rationale: Ang participle ay naglalarawan sa mga Hivita ayon sa kanilang tirahan; pinananatili ng kasalukuyang aspektong “naninirahan” ang katangiang duratibo nito.
- source_word: הַר הַלְּבָנוֹן
  choice: kabundukan ng Lebanon
  rationale: Bagaman literal na “bundok ng Lebanon,” tinutukoy ng parirala ang bulubunduking rehiyon, hindi lamang ang isang tuktok.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: mula sa Bundok Baal-hermon
  rationale: Pinanatili ang pangalan ng pook at nilinaw sa “Bundok” ang heograpikong katawagan.
- source_word: עַד לְבוֹא חֲמָת
  choice: hanggang sa Lebo-hamat
  rationale: Pinanatili bilang pangalan ng pook ang ekspresyon, habang inilalahad sa talababa ang posibleng deskriptibong pagbasa.
