  register: Makabago, malinaw, at marangal na Filipino. Ginamit ang karaniwang mga katawagang etniko sa Tagalog at pinanatili ang mga pangalang heograpiko. Inilagay ang panandang [a] sa “Lebo-hamat,” ang mismong pariralang tinutukoy ng talababa.
