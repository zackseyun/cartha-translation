  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: tl
  text: At naglingkod ang mga anak ni Israel kay Eglon na hari ng Moab sa loob ng labingwalong taon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O kaya, mas interpretatibo: “Napailalim ang mga anak ni Israel sa kapangyarihan ni Eglon na hari ng Moab sa loob ng labingwalong taon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: naglingkod
  rationale: Pinananatili nito ang karaniwang diwa ng עבד at ang konkretong larawan ng paglilingkod, habang ipinahihiwatig ng konteksto na ito ay sapilitang pagpapasakop sa isang dayuhang hari, hindi pagsamba.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: ang mga anak ni Israel
  rationale: Malapit ito sa Hebreong idyoma at pinananatili ang anyong panlalaking kolektibo ng pinagmulan; nauunawaan din ito sa marangal na modernong Tagalog.
- source_word: אֶת עֶגְלוֹן
  choice: kay Eglon
  rationale: Ang אֶת ay pananda ng tiyak na tuwirang layon. Dahil tao ang layon ng pandiwang 'naglingkod' sa Tagalog, likas na ipinapahayag ito sa pamamagitan ng 'kay.'
- source_word: מֶלֶךְ מוֹאָב
  choice: na hari ng Moab
  rationale: Ang pang-ugnay na 'na' ay natural na nag-uugnay sa pangalan at katungkulan sa Tagalog, at tumpak na inilalarawan si Eglon bilang hari ng Moab.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: sa loob ng labingwalong taon
  rationale: Natural na ipinahahayag nito sa Tagalog ang Hebreong akusatibo ng tagal nang walang idinaragdag na kahulugan.
