base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: tl
  text: Noong araw na iyon, nasupil ang Moab sa ilalim ng kapangyarihan ng Israel, at nagkaroon ng kapayapaan ang lupain sa loob ng walumpung taon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: napasailalim
  rationale: Ipinahahayag ng Niphal ng כנע ang pasibo at resultang kalagayan ng Moab bilang nasupil o napailalim sa pamamahala ng Israel; natural ito sa makabagong Tagalog nang hindi nagpapahiwatig ng lubusang paglipol.
- source_word: מוֹאָב
  choice: ang Moab
  rationale: Karaniwang anyo ng pangalan ng bansa sa Tagalog; ginamit ang pantukoy na “ang” ayon sa natural na balarila.
- source_word: בַּיּוֹם הַהוּא
  choice: nang araw na iyon
  rationale: Natural na salin ng karaniwang pariralang temporal at pinananatili ang demonstratibong diwa ng הַהוּא.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: sa kapangyarihan ng Israel
  rationale: Ang literal na “sa ilalim ng kamay ng Israel” ay idyomang Hebreo para sa pagkasakop o pagkontrol. Ang “sa kapangyarihan” ay malinaw at likas sa Tagalog habang pinananatili ang diwang pampolitika at militar.
- source_word: וַתִּשְׁקֹט
  choice: nagpahinga
  rationale: Sa paulit-ulit na gamit sa Mga Hukom, ang שקט ay tumutukoy sa katahimikan o pahinga mula sa digmaan at kaguluhan. Ang “nagpahinga” ay maikli, natural, at nagpapanatili ng tradisyonal na biblikal na larawan.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Ang “lupain” ay tumutugma sa heograpiko at pangkasaysayang diwa ng אֶרֶץ at hindi labis na tinutukoy kung buong bansa o rehiyon ang saklaw.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: sa loob ng walumpung taon
  rationale: Likas na paraan sa Tagalog upang ipahayag ang tagal na walumpung taon.
theological_decisions:
- issue: Uri ng paghahari ng Israel sa Moab
  choice: Pampolitika at militar na pagpapasailalim
  alternative: Pawang matalinghagang pagpapakumbaba o lubusang paglipol
  rationale: Iniuulat ng teksto na napailalim ang Moab sa kapangyarihan ng Israel at sumunod ang mahabang panahon ng kapahingahan. Hindi nito sinasabing nilipol ang Moab, at higit ito sa panloob o emosyonal na pagpapakumbaba.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Isinalin ang idyomang Hebreo ayon sa kahulugan nito upang madaling maunawaan ng karaniwang mambabasa, habang pinanatili ang maikli at salaysay na himig ng talata.
