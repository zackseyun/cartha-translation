language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: tl
  text: Ginawa ng mga anak ng Israel[a] ang masama sa paningin ni Yahweh[b]. Kinalimutan nila si Yahweh na kanilang Diyos, at pinaglingkuran nila ang mga Baal at ang mga Ashera.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga Israelita.” Sa Hebreo, “mga anak ng Israel.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang masama sa paningin ni Yahweh,” isang karaniwang pananalitang tumutukoy sa itinuring ni Yahweh na masama.
    reason: lexical_alternative
  - marker: c
    text: O “mga poste ni Ashera.” Maaaring tumukoy ang Hebreo sa mga kultikong bagay na kaugnay ni Ashera o, sa mas malawak na diwa, sa pagsamba kay Ashera.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: mga anak ng Israel
  rationale: Tuwirang pinananatili ang anyo ng idyomang Hebreo, na tumutukoy sa sambayanan ng Israel bilang isang kabuuan. Inilalagay sa talababa ang mas likas na alternatibong “mga Israelita.”
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: ang masama sa paningin ni Yahweh
  rationale: Pinananatili ang karaniwang Hebreong pormula ng pagsusuri at ang larawan ng “sa paningin,” habang malinaw sa Tagalog na ang ginawa nila ay yaong hinatulan ni Yahweh na masama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginagamit ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: וַיִּשְׁכְּחוּ
  choice: kinalimutan nila
  rationale: Pinananatili ang pangunahing kahulugan ng pandiwang שׁכח. Bagaman ipinahihiwatig ng konteksto ang pagtatakwil o pagpapabaya sa tipan, hindi iyon tahasang ipinapalit sa salin.
- source_word: אֱלֹהֵיהֶם
  choice: kanilang Diyos
  rationale: 'Si Yahweh ang tinutukoy, kaya isahan ang diwa ng anyong Hebreo: “kanilang Diyos.”'
- source_word: וַיַּעַבְדוּ
  choice: pinaglingkuran nila
  rationale: Sinasaklaw ng “pinaglingkuran” ang relihiyosong paglilingkod at pagsamba nang hindi nililimitahan ang pandiwa sa iisang aspekto lamang.
- source_word: הַבְּעָלִים
  choice: mga Baal
  rationale: Pinananatili ang maramihang anyo, na maaaring tumukoy sa iba’t ibang lokal na anyo o sagisag ng pagsamba kay Baal.
- source_word: הָאֲשֵׁרוֹת
  choice: mga Ashera
  rationale: Ang transliterasyong maramihan ay umiiwas sa pagpilit na ang salita ay tumutukoy lamang sa mga poste; maaari rin itong tumukoy sa mga kultikong bagay o sa mga lokal na anyo ng pagsamba kay Ashera.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Personal na pangalan ang nasa tekstong Hebreo. Ang “Yahweh” ay nagpapanatili nito sa halip na palitan ng titulong “PANGINOON.”
- issue: Kung tiyak na mga kultikong poste ang הָאֲשֵׁרוֹת
  choice: mga Ashera
  alternative: mga poste ni Ashera
  rationale: Maaaring tumukoy ang Hebreo sa mga kultikong bagay na kaugnay ni Ashera o, sa mas malawak na diwa, sa mga lokal na anyo ng pagsamba sa kaniya. Pinananatili sa pangunahing teksto ang tunay na kalabuan.
translation_notes:
  register: Makabago at marangal na Filipino na madaling maunawaan. Pinanatili ang Hebreong hulma na “mga anak ng Israel” at “sa paningin ni Yahweh,” ngunit ginawang likas ang ayos ng pangungusap. Ginamit ang “pinaglingkuran” upang mapanatili ang saklaw ng kultikong pandiwa, at ang “mga Ashera” upang hindi maagang lutasin ang leksikal at arkeolohikal na kalabuan.
