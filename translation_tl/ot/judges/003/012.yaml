id: JDG.3.12
reference: Judges 3:12
language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: tl
  text: Muling gumawa ang mga Israelita[a] ng masama sa paningin ni Yahweh. Kaya pinalakas ni Yahweh si Eglon na hari ng Moab laban sa Israel, sapagkat gumawa sila ng masama sa paningin ni Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “mga anak na lalaki ni Israel”; idyomatikong tumutukoy sa mga Israelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: Muling gumawa
  rationale: Ang idyomang יסף + pawatas ay nagsasaad ng pag-uulit; natural na ipinahahayag ito sa Tagalog sa pamamagitan ng “muling gumawa.”
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: ang mga Israelita
  rationale: Bagaman literal na “mga anak na lalaki ni Israel,” ang parirala ay kolektibong tawag sa bayang Israel; “mga Israelita” ang malinaw at likas na katumbas sa modernong Tagalog.
- source_word: לַעֲשׂוֹת הָרַע
  choice: gumawa ng masama
  rationale: Likas at tumpak na Tagalog para sa paggawa ng bagay na masama, nang hindi ginagawang abstraktong doktrinal ang parirala.
- source_word: בְּעֵינֵי יְהוָה
  choice: sa paningin ni Yahweh
  rationale: Pinananatili ang Hebreong metapora ng pagsusuri o paghatol at malinaw pa rin ito sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Inililipat ang personal na pangalang banal sa halip na palitan ito ng titulong “PANGINOON.”
- source_word: וַיְחַזֵּק
  choice: pinalakas
  rationale: Tuwirang ipinapahayag ng piel ng חזק na si Yahweh ang aktibong nagpalakas kay Eglon; hindi ito pinalalabnaw bilang pahintulot lamang.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: si Eglon na hari ng Moab
  rationale: Natural na Tagalog na apposisyon para sa pangalan at katungkulan.
- source_word: עַל יִשְׂרָאֵל
  choice: laban sa Israel
  rationale: Sa konteksto ng pag-aaway at pananakop, ang עַל ay nagpapahiwatig ng pagkontra.
- source_word: עַל כִּי
  choice: sapagkat
  rationale: Malinaw at marangal na pang-ugnay na nagbibigay ng dahilan ng pagkilos ni Yahweh.
- source_word: עָשׂוּ אֶת הָרַע
  choice: gumawa sila ng masama
  rationale: Tapat sa sugnay na nagbibigay ng dahilan; hindi kailangang gawing tahasang pangnagdaan nang higit pa sa aspektong likas sa Tagalog.
theological_decisions:
- issue: Paglilipat sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang nasa tekstong Hebreo; pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Banal na pagkilos sa וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: pinalakas ni Yahweh si Eglon
  alternative: hinayaan ni Yahweh na lumakas si Eglon
  rationale: Aktibong pagpapalakas ang sinasabi ng pandiwa. Pinananatili ng salin ang teolohikal na tensiyon sa halip na ipakahulugan ito bilang pahintulot lamang.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “mga Israelita” sa pangunahing teksto para sa natural na kolektibong tawag, habang inilagay sa talababa ang literal na Hebreong anyo. Pinanatili ang metaporang “sa paningin” at ang tuwirang banal na pagkilos na “pinalakas.”
