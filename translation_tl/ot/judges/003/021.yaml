  text: וַ/יִּשְׁלַ֤ח אֵהוּד֙ אֶת יַ֣ד שְׂמֹאל֔/וֹ וַ/יִּקַּח֙ אֶת הַ/חֶ֔רֶב מֵ/עַ֖ל יֶ֣רֶךְ יְמִינ֑/וֹ וַ/יִּתְקָעֶ֖/הָ בְּ/בִטְנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/021.yaml
  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: tl
  text: Pagkatapos, iniunat ni Ehud ang kanyang kaliwang kamay, kinuha ang espada mula sa kanyang kanang hita,[a] at itinarak iyon sa tiyan ni Eglon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaaring “mula sa ibabaw ng kanyang kanang hita,” kung saan nakasabit ang sandata.
    reason: translation_clarity
  - marker: b
    text: Sa Hebreo, “sa kanyang tiyan.” Tumutukoy ang “kanyang” kay Eglon.
    reason: referent_clarity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: iniunat
  rationale: Sa kontekstong ito, tumutukoy ang pandiwa sa pag-unat ng kamay upang kunin ang sandata. Likas at malinaw sa Filipino ang “iniunat.”
- source_word: יַד שְׂמֹאלוֹ
  choice: ang kanyang kaliwang kamay
  rationale: Tahasang binabanggit ng Hebreo ang “kamay,” at mahalaga sa salaysay ang paggamit ni Ehud ng kaliwang kamay.
- source_word: וַיִּקַּח
  choice: kinuha
  rationale: Payak at tumpak na katumbas ng pandiwang Hebreo sa sunod-sunod na kilos ng salaysay.
- source_word: הַחֶרֶב
  choice: ang espada
  rationale: Karaniwang salita ito sa Hebreo para sa espada. Bagaman maikli ang sandata ayon sa konteksto, hindi hinihingi ng mismong salita ang mas tiyak na “punyal.”
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: mula sa kanyang kanang hita
  rationale: Pinananatili nito ang tiyak na lokasyon ng sandata at natural itong pakinggan sa makabagong Filipino.
- source_word: וַיִּתְקָעֶהָ
  choice: itinarak iyon
  rationale: Ipinahihiwatig ng pandiwa ang malakas na pagtusok o pagbaon. Ang “itinarak” ay malinaw, buhay, at angkop sa marahas na kilos.
- source_word: בְּבִטְנוֹ
  choice: sa tiyan ni Eglon
  rationale: Ang Hebreo ay “sa kanyang tiyan.” Ginawang tahas ang reperente ng panghalip upang maiwasan sa Filipino ang maling pagkaunawang tiyan ni Ehud ang tinutukoy, nang hindi binabago ang kahulugan.
theological_decisions: []
translation_notes:
  register: Makabago, marangal, at tuwirang Filipino. Ginamit ang “espada” bilang malawak na katumbas ng חֶרֶב at “itinarak” upang mapanatili ang lakas ng kilos. Inilagay ang pangalang “Eglon” sa halip na isang malabong panghalip, at ipinaliwanag ito sa talababa.
