  text: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה֮ וַ/יִּשְׁפֹּ֣ט אֶת יִשְׂרָאֵל֒ וַ/יֵּצֵא֙ לַ/מִּלְחָמָ֔ה וַ/יִּתֵּ֤ן יְהוָה֙ בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: tl
  text: Sumakanya ang Espiritu ni Yahweh[a], at humatol siya sa Israel. Lumabas siya upang makipaglaban, at ibinigay ni Yahweh sa kanyang kamay si Cushan-rishathaim, na hari ng Aram[b]. Nanaig ang kanyang kamay laban kay Cushan-rishathaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring isalin, “Ang Espiritu ni Yahweh ay nasa kanya.” Maaari itong maglarawan ng isang kalagayan, bagaman ipinahihiwatig ng daloy ng salaysay na sumakanya ang Espiritu upang bigyan siya ng kakayahan.
    reason: lexical_alternative
  - marker: b
    text: Aram ang pangalang Hebreo sa lupaing madalas tawaging “Siria” sa mas matatandang salin.
    reason: alternative_reading
lexical_decisions:
- source_word: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה
  choice: Sumakaniya ang Espiritu ni Yahweh
  rationale: Ang idyomang היה על kasama ang רוּחַ ay maaaring magpahiwatig na ang Espiritu ay dumating o nanatili sa isang tao upang bigyan siya ng kakayahan. Ang “sumakaniya” ay likas at marangal sa Filipino, at pinananatili ng talababa ang mas statikong posibilidad.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng transliterasyong “Yahweh” ang banal na pangalang YHWH sa halip na palitan ito ng isang titulo.
- source_word: וַ/יִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: hinatulan niya ang Israel
  rationale: Pinananatili nito ang pangunahing kahulugan ng שׁפט at ang terminolohiyang mahalaga sa aklat ng Mga Hukom, nang hindi nililimitahan ang mas malawak na tungkulin ng hukom bilang pinuno at tagapagligtas.
- source_word: וַ/יֵּצֵא לַ/מִּלְחָמָה
  choice: Lumabas siya upang makipaglaban
  rationale: Natural itong salin ng karaniwang idyomang militar at malinaw na naghahayag ng pagpunta niya sa labanan.
- source_word: וַ/יִּתֵּן יְהוָה בְּ/יָד/וֹ
  choice: ibinigay ni Yahweh sa kanyang kamay
  rationale: Pinananatili ang Hebreong larawan ng pagbibigay ng kaaway sa kamay ng isang tao, na nangangahulugang inilagay siya sa kapangyarihan nito.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Cusan-risataim
  rationale: Isinulat ang pangalang pantangi ayon sa anyong madaling bigkasin at basahin sa modernong Filipino, sa halip na isalin ang posibleng kahulugan nito.
- source_word: מֶלֶךְ אֲרָם
  choice: hari ng Aram
  rationale: Pinananatili ang orihinal na pangalang Hebreo na Aram at iniiwasan ang tradisyonal ngunit hindi eksaktong katumbas na “Siria.”
- source_word: וַ/תָּעָז יָד/וֹ עַל
  choice: Nanaig ang kanyang kamay laban kay
  rationale: Pinananatili ang metapora ng “kamay” bilang kapangyarihan, habang malinaw na ipinahahayag sa Filipino ang kanyang pangingibabaw.
theological_decisions:
- issue: Paglalarawan sa pagdating o presensya ng Espiritu
  choice: Sumakaniya ang Espiritu ni Yahweh
  alternative: Ang Espiritu ni Yahweh ay nasa kanya
  rationale: Ipinahihiwatig ng daloy ng salaysay ang pagsisimula ng pagbibigay-kakayahan ng Diyos, ngunit tunay ding posible sa Hebreo ang mas statikong pagbasa; kaya pinanatili ito sa talababa nang walang idinagdag na doktrinal na paliwanag.
- issue: Pagtutumbas sa banal na pangalang יהוה
  choice: Yahweh
  alternative: PANGINOON
  rationale: Pinananatili ng “Yahweh” ang personal na pangalan sa tekstong Hebreo sa halip na palitan ito ng titulong “PANGINOON.”
- issue: Lawak ng tungkulin sa pandiwang שׁפט
  choice: hinatulan niya ang Israel
  alternative: pinamunuan niya ang Israel bilang hukom
  rationale: Ang literal na terminong “hinatulan” ay pinananatili upang huwag agad ipakahulugan ang buong saklaw ng tungkulin, bagaman sa konteksto ng Mga Hukom kabilang dito ang pamumuno at pagliligtas.
translation_notes:
  register: Modernong Filipino na marangal at madaling maunawaan. Pinanatili ang pangalang Yahweh, ang teknikal na ugnayan sa katawagang “hukom,” at ang Hebreong metapora ng kamay. Ginamit ang “Cusan-risataim” bilang anyong nababagay sa ortograpiya at pagbigkas ng Filipino. Ang lahat ng marker ng talababa ay nasa pangunahing teksto.
