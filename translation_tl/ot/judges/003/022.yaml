  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: tl
  text: Pumasok din kasunod ng talim ang puluhan[a], at bumalot sa talim ang taba, sapagkat hindi niya hinugot ang espada mula sa tiyan nito; at lumabas ang dumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “hawakan” ng espada.
    reason: lexical_alternative
  - marker: b
    text: Bihira ang salitang Hebreo na isinaling “dumi” at maaari ring tumukoy nang mas malawak sa tae o sa lumabas na laman ng bituka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: ang puluhan
  rationale: Sa konteksto ng espada, tumutukoy ito sa bahaging hinahawakan na pumasok kasunod ng talim. Ang “puluhan” ay likas at malinaw sa modernong Filipino.
- source_word: הַלַּהַב
  choice: ang talim
  rationale: Bagaman maaari itong mangahulugang “liyab” sa ibang konteksto, malinaw na talim ng espada ang tinutukoy rito.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: bumalot sa
  rationale: Ipinahihiwatig ng pandiwa at pang-ukol na natakpan o napalibutan ng taba ang talim; natural na naihahatid ito ng “bumalot sa.”
- source_word: הַחֵלֶב
  choice: ang taba
  rationale: Pinananatili ang tuwiran at tahasang pisikal na paglalarawan ng Hebreo.
- source_word: שָׁלַף
  choice: hinugot
  rationale: Karaniwang tumutukoy sa pagbunot ng sandata at natural ding gamitin kapag inilalabas ang espada mula sa katawan.
- source_word: מִבִּטְנוֹ
  choice: mula sa tiyan nito
  rationale: Ang “tiyan” ay karaniwan at di-klinikal na katumbas ng belly/abdomen. Ginamit ang “nito” upang malinaw na si Eglon, hindi si Ehud, ang tinutukoy.
- source_word: הַפַּרְשְׁדֹנָה
  choice: ang dumi
  rationale: Bihira at pinagtatalunang salita ito na karaniwang inuunawang dumi o lumabas na laman ng bituka. Ang “dumi” ay maikli, malinaw, at hindi labis na klinikal; pinananatili sa talababa ang mas malawak na posibilidad.
- source_word: וַיֵּצֵא
  choice: lumabas
  rationale: Payak at natural na salaysay ng paglabas, kaayon ng tahasang detalye ng Hebreo.
- source_word: גַם
  choice: din
  rationale: Binibigyang-diin na hindi lamang ang talim kundi pati ang puluhan ay pumasok.
