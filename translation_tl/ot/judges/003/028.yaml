  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: tl
  text: Sinabi niya sa kanila, “Sumunod kayo sa akin,[a] sapagkat ibinigay na ni Yahweh sa inyong kamay ang inyong mga kaaway—Moab.[b]” Kaya bumaba silang kasunod niya at sinakop ang mga tawiran sa Jordan patungong Moab,[c] at hindi nila pinayagang tumawid ang sinuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “Humabol kayo kasunod ko.”
    reason: lexical_alternative
  - marker: b
    text: Sa Hebreo, “ang inyong mga kaaway, Moab,” kung saan ang “Moab” ay kasunod na pantukoy sa “inyong mga kaaway.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring “ang mga tawiran sa Jordan laban sa Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Sumunod kayo sa akin
  rationale: Ang רדף ay karaniwang nangangahulugang humabol o tumugis, ngunit dito ay panawagan ni Ehud sa mga kakampi na sumunod sa kanya sa isang pagsalakay. Natural sa Tagalog ang “Sumunod kayo sa akin,” habang inilalagay sa talababa ang mas mariing diwang militar.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: ibinigay na ... sa inyong kamay
  rationale: Pinananatili nito ang Hebreong larawan ng pagpapasailalim sa kapangyarihan ng isang tao. Ang “na” ay nagpapahayag ng natapos at tiyak na pagkilos na batayan ng utos ni Ehud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ng personal na pangalang Yahweh ang Tetragrammaton sa halip na palitan ito ng isang titulo.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: ang inyong mga kaaway—ang Moab
  rationale: Pinananatili ang maramihang “mga kaaway” at ang Moab bilang kasunod na pantukoy sa kanila. Hindi tahasang ginagawang “mga taga-Moab” ang pangalan ng bansa.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: bumaba silang kasunod niya
  rationale: Pinananatili ang heograpikong diwa ng pagbaba mula sa kaburulan patungo sa lambak ng Jordan, pati ang pagsunod nila kay Ehud.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: mga tawiran sa Jordan
  rationale: Ang מַעְבְּרוֹת ay mga lugar na maaaring tawiran ang ilog. Ang “mga tawiran” ay malinaw at karaniwan sa modernong Tagalog nang hindi ipinapalagay na lahat ay mababaw na tawiran.
- source_word: לְמוֹאָב
  choice: patungong Moab
  rationale: Maaaring ipahiwatig ng ל ang direksiyon o destinasyon. Ang “patungong Moab” ay angkop sa mga tawiran ng Jordan, habang kinikilala sa talababa ang posibleng kontekstuwal na pagbasa na “laban sa Moab.”
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: wala silang pinatawid na sinuman
  rationale: Natural na Tagalog ito para sa Hebreong idyomang literal na “hindi sila nagbigay ng isang tao upang tumawid,” at malinaw na ipinahahayag na walang sinumang pinahintulutang tumawid.
theological_decisions:
- issue: Paglilipat ng banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON; Jehovah
  rationale: Personal na pangalan ang nasa Hebreo, kaya pinananatili itong Yahweh at hindi pinapalitan ng titulo.
- issue: Ang מוֹאָב bilang kolektibong pangalan ng bansa
  choice: ang Moab
  alternative: ang mga taga-Moab
  rationale: Bansa ang tahasang pinangalanan ng Hebreo at ginagamit bilang kolektibong pantukoy sa kaaway. Pinananatili ng salin ang pambansang personipikasyon sa halip na magdagdag ng etnikong katawagan.
- issue: Ugnayan ng לְמוֹאָב sa mga tawiran
  choice: patungong Moab
  alternative: laban sa Moab
  rationale: Pinapaboran ng pangunahing salin ang karaniwang direksiyonal na gamit ng ל, ngunit hindi nilulutas nang tahimik ang kontekstuwal na posibilidad na ang mga tawiran ay sinakop laban sa Moab; inilalagay ang alternatibo sa talababa.
translation_notes:
  register: Modernong Filipino na marangal ngunit madaling maunawaan. Pinanatili ang personal na pangalang Yahweh, ang larawan ng “sa inyong kamay,” ang heograpikong “bumaba,” at ang kolektibong pangalan ng bansang Moab. Ginamit ang mga talababa upang panatilihin ang tunay na leksikal at sintaktikong kalabuan.
