revisions:
- from: Sinabi niya sa kanila, “Sumunod kayo sa akin,[a] sapagkat ibinigay na ni Yahweh sa inyong kamay ang inyong mga kaaway—ang Moab.[b]” Kaya bumaba silang kasunod niya at sinakop ang mga tawiran sa Jordan patungong Moab,[c] at wala silang pinatawid na sinuman.
  to: Sinabi niya sa kanila, “Sumunod kayo sa akin,[a] sapagkat ibinigay na ni Yahweh sa inyong kamay ang inyong mga kaaway—Moab.[b]” Kaya bumaba silang kasunod niya at sinakop ang mga tawiran sa Jordan patungong Moab,[c] at hindi nila pinayagang tumawid ang sinuman.
  rationale: Ginawang “Moab” ang appositive upang maging natural na Tagalog nang hindi ginagawang etnikong katawagan ang pambansang pangalan. Pinalitan ang huling sugnay upang malinaw na maipahayag ang pagbabawal sa pagtawid. Inayos ang talababa a upang huwag magdagdag ng layong wala sa Hebreo. Napanatili ang direksiyonal na pangunahing pagbasa ng לְמוֹאָב at ang alternatibong kontekstuwal na pagbasa sa talababa.
