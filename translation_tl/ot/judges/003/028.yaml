  verdict: revise
  source_fidelity: 'Ang pangunahing diwa ay tapat sa Hebreo: ang panawagan na sumunod kay Ehud, ang tiyak na pagbibigay ni Yahweh sa Moab sa kapangyarihan ng Israel, ang pagbaba, pagsakop sa mga tawiran ng Jordan, at pagpigil sa sinumang tumawid. Gayunman, ang “wala silang pinatawid na sinuman” ay maaaring mangahulugang hindi sila nagsakay o naghatid ng sinuman sa pagtawid, samantalang ang Hebreo ay nagsasaad na wala silang *pinayagang* tumawid.'
  naturalness: Marangal at malinaw ang modernong Tagalog sa kabuuan. Mas natural ang hubad na “Moab” bilang appositive na kolektibong pangalan kaysa “ang Moab,” at mas tiyak ang “hindi nila pinayagang tumawid ang sinuman.”
  terminology: Tama ang “Yahweh” para sa יהוה. Ang “Moab” ay dapat panatilihing pangalan ng bansang ginamit bilang kolektibong pantukoy, hindi gawing “mga taga-Moab.” Ang “mga tawiran sa Jordan patungong Moab” ay isang maingat na direksiyonal na pagbasa ng לְמוֹאָב; pinananatili ng talababa ang alternatibong kontekstuwal na pagbasa.
