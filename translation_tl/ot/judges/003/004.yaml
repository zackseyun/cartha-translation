  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַֽ/יִּהְי֕וּ לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל לָ/דַ֗עַת הֲ/יִשְׁמְעוּ֙ אֶת מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁר צִוָּ֥ה אֶת אֲבוֹתָ֖/ם בְּ/יַד מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: tl
  text: At naroon ang mga bansang iyon upang subukin ang Israel sa pamamagitan nila[a], para malaman kung susundin nila[b] ang mga utos ni Yahweh na iniutos niya sa kanilang mga ninuno[c] sa pamamagitan ni Moises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “upang subukin sa pamamagitan nila ang Israel.” Ang “nila” ay tumutukoy sa mga bansang iniwan sa lupain.
    reason: lexical_alternative
  - marker: b
    text: Ang salitang Hebreo ay literal na “makikinig,” ngunit dito ay nangangahulugang makikinig nang may pagsunod.
    reason: lexical_alternative
  - marker: c
    text: Sa Hebreo, “kanilang mga ama”; sa kontekstong ito, ang kanilang mga ninuno o mga naunang salinlahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: At naroon ang mga bansang iyon
  rationale: Ipinagpapatuloy ng anyong pandiwa ang naunang konteksto tungkol sa mga bansang iniwan sa lupain. Nilinaw sa Tagalog ang tinutukoy ng panghalip upang maging natural at hindi malabo.
- source_word: לְנַסּוֹת
  choice: upang subukin
  rationale: Ang נסה rito ay pagsubok upang mahayag o mapatunayan ang tugon ng Israel, hindi pang-aakit na gumawa ng masama.
- source_word: בָּם
  choice: sa pamamagitan nila
  rationale: Ang panghalip ay tumutukoy sa mga bansang naiwan at tahasang nagpapahayag na sila ang ginamit na kasangkapan sa pagsubok.
- source_word: לָדַעַת
  choice: para malaman
  rationale: Pinananatili ang literal na diwa ng ידע at ang layuning ipinahahayag ng infinitive, sa natural na modernong Tagalog.
- source_word: הֲיִשְׁמְעוּ
  choice: kung susundin nila
  rationale: Kapag ang שׁמע ay ginagamit kaugnay ng mga utos, nangangahulugan itong makinig nang may pagsunod. Mas malinaw sa Tagalog ang “susundin” kaysa sa literal na “makikinig sa.”
- source_word: מִצְוֺת
  choice: mga utos
  rationale: Karaniwan, malinaw, at marangal na katumbas ng plural na מצוה sa kontekstong tipan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Pinananatili ang personal na pangalan ng Diyos na kinakatawan ng Tetragrammaton, sa halip na palitan ito ng isang titulo.
- source_word: אֲשֶׁר צִוָּה
  choice: na iniutos niya
  rationale: Tuwirang ipinapakita ang ugnayan ng sugnay sa “mga utos,” bagaman likas sa Tagalog ang bahagyang pag-uulit ng salitang-ugat.
- source_word: אֲבוֹתָם
  choice: kanilang mga ninuno
  rationale: Sa kontekstong ito, ang אבות ay tumutukoy sa mga naunang salinlahi ng Israel. Ang “mga ninuno” ang natural at tumpak na modernong Tagalog nang hindi nagdaragdag ng di-kinakailangang espesipikasyong panlalaki.
- source_word: בְּיַד מֹשֶׁה
  choice: sa pamamagitan ni Moises
  rationale: Ipinahahayag nito ang Hebreong idyoma ng pagkilos sa pamamagitan ng isang tagapamagitan, nang hindi pilit na isinasalin bilang “sa kamay ni Moises.”
theological_decisions:
- issue: Layunin at paraan ng pagsubok sa Israel
  choice: Ang mga bansang naiwan ang nagsilbing paraan upang subukin ang Israel at malaman kung susunod sila.
  alternative: Ituring ang pagsubok bilang karaniwang pagmamasid lamang na walang ipinahahayag na layunin.
  rationale: Ang לְנַסּוֹת at לָדַעַת ay kapuwa nagpapahayag ng layunin, samantalang ang בָּם ay tumutukoy sa mga bansa bilang paraan ng pagsubok. Hindi ipinapaliwanag ng salin kung paano nauugnay ang kaalaman ng Diyos sa pagsubok, kaya nananatili ang teolohikal na tensiyon ng teksto.
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehova
  rationale: Ang “Yahweh” ay tuwirang kumakatawan sa banal na pangalan at hindi ito pinapalitan ng titulo.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw, marangal, at angkop sa pampublikong pagbasa. Ginamit ang “naroon” upang ipagpatuloy ang konteksto, “susundin” para sa likas na kahulugan ng שׁמע kaugnay ng mga utos, at “sa pamamagitan” upang malinaw na ipakita kapuwa ang instrumental na בָּם at ang mediatorial na idyomang בְּיַד מֹשֶׁה.
