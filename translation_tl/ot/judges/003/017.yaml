  naturalness: Natural ang pangungusap, ngunit mas tuwiran at mas idiomatiko ang “Si Eglon ay napakataba” kaysa “isang lalaking napakataba,” dahil malinaw na ang tinutukoy ay si Eglon at hindi kailangang ulitin ang kasariang ipinahihiwatig na ng pangalan at panghalip.
  terminology: Ang “buwis” ay angkop para sa מִנְחָה sa pampolitikang kontekstong ito. Ang “handog” at “regalo” ay dapat manatiling mga alternatibong leksikal sa talababa, hindi isama sa pangunahing salin.
