  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: tl
  text: Iniharap niya kay Eglon na hari ng Moab ang buwis[a]. Si Eglon ay napakataba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maaari ring “handog” o “regalo.” Ang Hebreong minḥah ay maaaring tumukoy sa handog o regalo, ngunit dito ay malamang na buwis na ibinabayad ng bayang sakop sa isang pinuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Iniharap niya
  rationale: Ang Hiphil ng קרב ay nangangahulugang ilapit o iharap ang isang bagay; sa konteksto ng pagdadala sa hari, likas at tumpak ang “iniharap.”
- source_word: הַמִּנְחָה
  choice: ang buwis na handog
  rationale: Maaaring tumukoy ang מִנְחָה sa handog o regalo, ngunit dito ay dala ito ng bayang sakop sa isang dayuhang hari. Pinananatili ng “handog” ang malawak na diwa ng salita, habang nililinaw ng “buwis” ang pampolitikang konteksto.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: kay Eglon na hari ng Moab
  rationale: Natural na Tagalog na pagturing sa pangalang pantangi at titulong kasunod nito.
- source_word: אִישׁ
  choice: isang lalaki
  rationale: Tahasang panlalaking isahan ang Hebreo at partikular na tumutukoy kay Eglon.
- source_word: בָּרִיא
  choice: mataba
  rationale: Sa konteksto, ang pang-uri ay tumutukoy sa pisikal na katabaan; mahalaga rin ito sa kasunod na salaysay kaya hindi ito pinalambot bilang “malusog” o “malaki ang katawan.”
- source_word: מְאֹד
  choice: napaka-
  rationale: Natural na Tagalog na paningkad na sapat na naghahatid ng lakas ng Hebreong מְאֹד.
- source_word: וְעֶגְלוֹן
  choice: Si Eglon
  rationale: Ang waw ay nagpapakilala rito ng paliwanag tungkol kay Eglon. Ang bagong pangungusap na walang tahasang “at” ay natural sa Tagalog at pinananatili ang tungkuling pandiskurso.
