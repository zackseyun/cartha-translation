translation_notes:
  register: Modernong Filipino na simple, marangal, at madaling maunawaan. Pinanatili ang larawang “nagpahinga ang lupain,” na karaniwan sa salaysay ng Mga Hukom, sa halip na tahasang ipakahulugan ito bilang lubos na kapayapaan o kasaganaan.
