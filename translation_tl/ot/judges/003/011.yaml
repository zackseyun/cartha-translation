base_translation:
  language: en
  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: tl
  text: Kaya nagpahinga ang lupain sa loob ng apatnapung taon. Pagkatapos, namatay si Otniel na anak ni Kenaz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: nagpahinga
  rationale: Ang שׁקט ay tumutukoy sa pagiging tahimik, payapa, o malaya sa kaguluhan. Sa konteksto ng Mga Hukom, inilalarawan nito ang panahon ng kapahingahan mula sa paniniil matapos ang pagliligtas; natural sa Filipino ang “nagpahinga ang lupain” at hindi nito pinalalawak ang diwa tungo sa ganap na kasaganaan.
- source_word: הָאָרֶץ
  choice: ang lupain
  rationale: Sa konteksto, tumutukoy ang אֶרֶץ sa lupain o teritoryo ng Israel, hindi sa buong daigdig.
- source_word: אַרְבָּעִים שָׁנָה
  choice: sa loob ng apatnapung taon
  rationale: Ang parirala ay nagsasaad ng tagal. Malinaw at natural sa Filipino ang “sa loob ng apatnapung taon.”
- source_word: וַיָּמָת
  choice: Pagkatapos, namatay
  rationale: Isinusulong ng waw-consecutive ang salaysay. Ipinahahayag ng “Pagkatapos” ang pagkakasunod-sunod nang hindi mekanikal na inuulit ang “at.”
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Isinulat ang pangalang Hebreo ayon sa natural at karaniwang transliterasyon sa Filipino.
- source_word: בֶּן קְנַז
  choice: na anak ni Kenaz
  rationale: Tuwirang ipinakikilala ng pariralang construct ang angkan ni Otniel; idiomatiko sa Filipino ang “na anak ni Kenaz.”
