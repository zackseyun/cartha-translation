  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: tl
  text: Nagpadala si Gideon ng mga mensahero sa buong kabundukan ng Efraim. Sinabi niya, “Bumaba kayo upang harapin ang Midian, at sakupin ninyo ang mga tubig[a] hanggang sa Bet-bara, at ang Jordan.” Kaya tinawag[b] ang bawat lalaki ng Efraim[c], at sinakop nila ang mga tubig hanggang sa Bet-bara, at ang Jordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literal na “mga tubig.” Maaaring tumukoy ito sa mga daluyan ng tubig o sa mga tawiran na kailangang kontrolin.
    reason: lexical_alternative
  - marker: b
    text: Mahirap ang pandiwang Hebreo. Maaari rin itong unawain nang mas literal na “sumigaw,” ngunit sa konteksto ay malamang na nangangahulugang tinawag o tinipon sila para sa labanan.
    reason: alternative_reading
  - marker: c
    text: Literal na “bawat lalaki ng Efraim”; kolektibong tumutukoy ito sa mga lalaking mandirigma ng Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: mga mensahero
  rationale: Sa salaysay na ito, tumutukoy ang salita sa mga taong ipinadala upang maghatid ng mensahe, hindi sa mga anghel.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: sa buong kabundukan ng Efraim
  rationale: Ang הַר ay tumutukoy rito sa rehiyong maburol o mabundok, hindi sa iisang bundok.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: Bumaba kayo upang harapin ang Midian
  rationale: Pinananatili ng “bumaba” ang topograpikong galaw mula sa kabundukan, at ipinahihiwatig ng “harapin” ang militar na pagsalubong nang hindi labis na nagpapakahulugan.
- source_word: וְלִכְדוּ לָהֶם
  choice: at sakupin ninyo
  rationale: Ang לכד ay nangangahulugang sakupin o agawin. Hindi tahasang isinalin ang di-tiyak na datibong לָהֶם upang maiwasan ang pilit na parirala sa Filipino.
- source_word: אֶת הַמַּיִם
  choice: ang mga daanan sa tubig
  rationale: Literal itong “ang mga tubig,” ngunit sa konteksto ng pagtugis ay malamang na tumutukoy sa mahahalagang tawiran o rutang kaugnay ng tubig. Nililinaw ng talababa ang literal at iba pang posibleng diwa.
- source_word: עַד בֵּית בָּרָה
  choice: hanggang sa Bet-bara
  rationale: Ipinapakita ng עַד ang hangganan o lawak; tinumbasan ang pangalan ng lugar ayon sa baybay na angkop sa Filipino.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: pati ang Jordan
  rationale: Ipinapakita ng “pati” na kasama sa mga dapat sakupin o bantayan ang Jordan, habang pinananatili ang pangalan nang walang idinagdag na “Ilog.”
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: Kaya tinipon ang bawat lalaki ng Efraim
  rationale: Mahirap ang anyo ng pandiwa; sa konteksto ng pagpapadala ng mga mensahero, malamang na tumutukoy ito sa pagtawag at pagtitipon para sa labanan. Pinananatili ng “bawat lalaki” ang panlalaking kolektibong אִישׁ.
- source_word: וַיִּלְכְּדוּ
  choice: at sinakop nila
  rationale: Pinananatili ang parehong salin ng ugat na לכד upang maging magkakatugma ang utos at ang pagsasakatuparan nito.
