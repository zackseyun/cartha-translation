translation_notes:
  register: Gumamit ng makabago, malinaw, at marangal na Filipino. Ang “kabundukan,” “harapin,” at “tinipon” ay likas sa kasalukuyang gamit habang pinananatili ang heograpiya, kilos-militar, at kahirapan ng tekstong Hebreo. Iniwasan ang sobrang teknikal na “mga tawiran” sa pangunahing teksto sa pamamagitan ng mas malawak na “mga daanan sa tubig,” na sinamahan ng talababa.
