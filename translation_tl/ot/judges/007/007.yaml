base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: tl
  text: Sinabi ni Yahweh kay Gideon, “Sa pamamagitan ng tatlong daang lalaking humimod, ililigtas ko kayo at ibibigay ko ang Midian sa iyong kamay. Paalisin ang lahat ng tao, bawat isa sa kani-kanilang lugar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tuwirang tinutumbasan ang banal na pangalang YHWH sa paraang malinaw at hindi ito pinapalitan ng titulong “Panginoon.”
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: Sa pamamagitan ng tatlong daang lalaking
  rationale: Instrumental ang ב; malinaw na ang tatlong daan ang gagamiting kasangkapan sa pagliligtas.
- source_word: הַמֲלַקְקִים
  choice: humimod
  rationale: Pinananatili ang kongkretong kilos na nagpakilala sa pangkat sa naunang konteksto, nang hindi inuulit ang bagay na hinimod sapagkat wala iyon sa talata.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: ililigtas ko kayo
  rationale: Saklaw ng Hiphil ng ישׁע ang pagliligtas mula sa panganib at pagbibigay ng tagumpay. Ang “kayo” ay nagpapanatili sa maramihang anyo ng Hebreo.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: ibibigay ko ang Midian sa iyong kamay
  rationale: Pinananatili ang Hebreong idyoma para sa pagkakaloob ng kapangyarihan o tagumpay; isahan ang “iyong” dahil si Gideon ang tuwirang kinakausap.
- source_word: וְכָל הָעָם יֵלְכוּ
  choice: Pauwiin mo ang lahat ng iba pa
  rationale: Ipinapahayag ang jussive na puwersa bilang utos na paalisin ang natitirang hukbo. Ang “iba pa” ay nilinaw mula sa konteksto ng napiling tatlong daan.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: bawat isa sa kani-kanilang lugar
  rationale: Pinananatili ang distributibong diwa habang gumagamit ng natural at kasalukuyang Filipino; hindi ginawang “tahanan” dahil mas malawak ang literal na “lugar.”
theological_decisions:
- issue: Paglalahad sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON / Jehovah
  rationale: Pangalan mismo ang nasa tekstong Hebreo, kaya pinananatili ito bilang “Yahweh” sa halip na palitan ng titulo.
- issue: Tagapagligtas at kasangkapan ng pagliligtas
  choice: Si Yahweh ang nagsasabing “ililigtas ko kayo,” sa pamamagitan ng tatlong daan
  alternative: Ang tatlong daan ang mismong nagliligtas
  rationale: 'Pinananatili ang balanse ng teksto: Diyos ang tahasang gumagawa ng pagliligtas, samantalang instrumental ang pangkat na tatlong daan.'
translation_notes:
  register: Makabagong Filipino na marangal at madaling maunawaan. Ginamit ang “humimod” upang mapanatili ang matingkad na kilos sa Hebreo. Ang “Pauwiin” ay natural sa kontekstong pagpapabalik sa hukbo, habang nililinaw ng kasunod na “sa kani-kanilang lugar” ang literal na patutunguhan.
