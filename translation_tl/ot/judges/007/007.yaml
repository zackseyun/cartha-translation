  rationale: Pinalitan ang huling pangungusap upang maipahayag ang jussive na puwersa nang hindi nagdaragdag ng isang tahasang tagaganap na si Gideon. Inalis ang “iba pa” at “pauwiin” upang mapanatili ang saklaw ng “lahat ng tao” at ang literal na “sa kanyang lugar.”
