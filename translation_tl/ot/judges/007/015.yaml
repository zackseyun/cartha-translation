revisions:
- from: Nang marinig ni Gideon ang pagkukuwento ng panaginip at ang kahulugan nito, yumukod siya sa pagsamba. Pagkatapos, bumalik siya sa kampo ng Israel at sinabi, “Bumangon kayo! Sapagkat ibinigay na ng PANGINOON sa inyong mga kamay ang kampo ng Midian.”
  to: Nang marinig ni Gideon ang pagkukuwento ng panaginip at ang kahulugan nito, nagpatirapa siya. Pagkatapos, bumalik siya sa kampo ng Israel at sinabi, “Bumangon kayo! Sapagkat ibinigay na ng PANGINOON sa inyong kamay ang kampo ng Midian.”
  rationale: Pinalitan ang di-likas na pariralang “yumukod siya sa pagsamba” ng “nagpatirapa siya,” na mas matapat sa pisikal na kilos na ipinahahayag ng Hebreo at hindi tahasang nagdaragdag ng layon ng pagsamba. Ginawang “inyong kamay” ang idyoma upang maging mas natural sa Tagalog habang pinananatili ang kolektibong maramihang kausap.
