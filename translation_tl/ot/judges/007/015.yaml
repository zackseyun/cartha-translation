base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: tl
  text: Nang marinig ni Gideon ang pagkukuwento ng panaginip at ang kahulugan nito, nagpatirapa siya. Pagkatapos, bumalik siya sa kampo ng Israel at sinabi, “Bumangon kayo! Sapagkat ibinigay na ng PANGINOON sa inyong kamay ang kampo ng Midian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: pagkukuwento ng panaginip
  rationale: Ang מִסְפָּר dito ay tumutukoy sa pagsasalaysay o pagkukuwento ng panaginip, hindi sa bilang.
- source_word: שִׁבְרוֹ
  choice: ang kahulugan nito
  rationale: Sa kontekstong ito, ang שֵׁבֶר ay ang paliwanag o interpretasyon ng panaginip; natural at malinaw sa modernong Tagalog ang “kahulugan.”
- source_word: וַיִּשְׁתָּחוּ
  choice: yumukod siya sa pagsamba
  rationale: Pinananatili ang pisikal na kilos ng pagyukod at nililinaw ang gamit nito bilang pagsamba ayon sa konteksto.
- source_word: ק֔וּמוּ
  choice: Bumangon kayo!
  rationale: Pangmaramihang pautos ang Hebreo; tuwiran at masigla ang “Bumangon kayo!” sa Tagalog.
- source_word: יְהוָה
  choice: PANGINOON
  rationale: Ginagamit ang nakagawiang anyong malalaking titik para sa banal na pangalang YHWH, alinsunod sa publikasyong estilo ng konsultasyong teksto.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: ibinigay na ... sa inyong mga kamay
  rationale: Ang perpektong pandiwa ay inilalarawan bilang tiyak nang kaloob o tagumpay, at pinananatili ang Hebreong idyoma ng pagbibigay sa kamay.
theological_decisions:
- issue: Ang pinatutungkulan ng pagsamba
  choice: Hindi tahasang idinagdag ang “sa PANGINOON.”
  alternative: “sumamba siya sa PANGINOON”
  rationale: Malinaw sa konteksto na relihiyosong pagsamba ito, ngunit walang tahasang layon ang pandiwa sa Hebreo; iniiwasang dagdagan ang hindi nakasaad.
- issue: Aspeto ng pagkakaloob ng tagumpay
  choice: “ibinigay na”
  alternative: “ibibigay”
  rationale: Perpektibo ang נָתַן at ipinahahayag ni Gideon ang tagumpay bilang tiyak o naganap na sa pasya ng Diyos, bagaman isasagawa pa ang labanan.
translation_notes:
  register: Modernong Filipino Tagalog na dignified ngunit madaling maunawaan. Ginamit ang “kampo,” “panaginip,” at “kahulugan” bilang karaniwang bokabularyo; pinanatili ang maramihang “kayo/inyong” at ang masiglang pautos ng talata.
