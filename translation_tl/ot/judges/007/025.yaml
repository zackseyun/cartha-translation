  terminology: Ang ‘pinuno’ ay wastong di-mapanlinlang na salin ng שָׂרֵי; hindi kinakailangang gamitin ang ‘prinsipe.’ Wasto ang pagpapanatili sa Oreb at Zeeb bilang mga pangalan. Ang ‘Bato ni Oreb’ at ‘Pisaan ng Ubas ni Zeeb’ ay katanggap-tanggap na mga katawagang pook at pinananatili ang etiolohikal na anyo ng Hebreo.
