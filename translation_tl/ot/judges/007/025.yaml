  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: tl
  text: Nabihag nila ang dalawang pinuno ng Midian, sina Oreb at Zeeb.[a] Pinatay nila si Oreb sa Bato ni Oreb, at pinatay nila si Zeeb sa Pisaan ng Ubas ni Zeeb. Pagkatapos, hinabol nila ang mga Midianita, at dinala nila kay Gideon ang mga ulo nina Oreb at Zeeb mula sa ibayo ng Jordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang Oreb ay kaugnay ng salitang Hebreo para sa “uwak,” at ang Zeeb naman ay kaugnay ng salitang Hebreo para sa “lobo”; ngunit mga pangalang pantangi ang ginamit sa pangunahing teksto.
    reason: lexical_alternative
  - marker: b
    text: Maaari ring isalin na “mula sa kabilang panig ng Jordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: Nabihag nila
  rationale: Ang לָכַד ay tumutukoy sa paghuli o pagbihag sa konteksto ng labanan. Likas at malinaw sa Filipino ang “nabihag” para sa mga pinunong nahuli ng kaaway.
- source_word: שְׁנֵי שָׂרֵי מִדְיָן
  choice: dalawang pinuno ng Midian
  rationale: Ang שַׂר ay mataas na pinunong pampolitika o pangmilitar. Mas malinaw at hindi labis na tiyak ang “pinuno” kaysa “prinsipe,” na maaaring magpahiwatig ng anak ng hari sa modernong Filipino.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: sina Oreb at Zeeb
  rationale: Mga pangalang pantangi ang mga ito kaya isinalin sa anyong transliterado sa halip na gawing “Uwak” at “Lobo.” Ginamit ang “sina” ayon sa likas na balarila ng Filipino.
- source_word: בְּצוּר עוֹרֵב
  choice: sa Bato ni Oreb
  rationale: Ang צוּר ay “bato” o “malaking batuhan.” Pinanatili ng parirala ang anyo ng pangalan ng lugar at ang kaugnayan nito sa pangalang Oreb.
- source_word: בְיֶקֶב זְאֵב
  choice: sa Pisaan ng Ubas ni Zeeb
  rationale: Ang יֶקֶב ay pisaan o tangke para sa ubas. Ang “Pisaan ng Ubas” ay madaling maunawaan at pinananatili ang anyo ng pangalan ng lugar.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: Pagkatapos, hinabol nila ang mga taga-Midian
  rationale: Ipinahihiwatig ng parirala ang patuloy na pagtugis sa mga Midianita. Mas natural sa Filipino ang “mga taga-Midian” kaysa tratuhing isang tao ang pangalang “Midian,” habang hindi nagdaragdag ng tiyak na salitang “hukbo.”
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: ang mga ulo nina Oreb at Zeeb
  rationale: Bagaman isahan ang anyong רֹאשׁ, distributibo ang diwa nito sa dalawang pangalan. Kaya likas at tumpak sa Filipino ang maramihang “mga ulo.”
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: mula sa ibayo ng Jordan
  rationale: Ang parirala ay nangangahulugang mula sa kabila o ibayo ng Jordan. Pinananatili ng “ibayo” ang pananaw na heograpiko nang hindi tinutukoy kung silangan o kanluran.
theological_decisions: []
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino ang ginamit. Iniwasan ang “prinsipe” dahil maaari itong magbigay ng mas makitid na modernong kahulugan kaysa sa Hebreong שַׂר. Nilagyan ng malaking titik ang “Bato ni Oreb” at “Pisaan ng Ubas ni Zeeb” bilang mga katawagan sa lugar. Inilagay ang talababa [b] sa pariralang heograpiko na talagang tinutukoy nito.
