revisions:
- from: Nabihag nila ang dalawang pinuno ng Midian, sina Oreb at Zeeb.[a] Pinatay nila si Oreb sa Bato ni Oreb, at pinatay nila si Zeeb sa Pisaan ng Ubas ni Zeeb. Pagkatapos, hinabol nila ang mga taga-Midian, at dinala nila kay Gideon ang mga ulo nina Oreb at Zeeb mula sa ibayo ng Jordan.[b]
  to: Nabihag nila ang dalawang pinuno ng Midian, sina Oreb at Zeeb.[a] Pinatay nila si Oreb sa Bato ni Oreb, at pinatay nila si Zeeb sa Pisaan ng Ubas ni Zeeb. Pagkatapos, hinabol nila ang mga Midianita, at dinala nila kay Gideon ang mga ulo nina Oreb at Zeeb mula sa ibayo ng Jordan.[b]
  rationale: Pinalitan ang ‘mga taga-Midian’ ng ‘mga Midianita’ upang malinaw na tumukoy sa pangkat na kaaway na tinutugis, nang hindi binabago ang saklaw o diwa ng Hebreo. Ginawang ganap din ang paralelong pangungusap sa talababa [a] (‘ay kaugnay’) para sa mas maayos na modernong Filipino. Napanatili ang maingat na spatial na kalabuan ng ‘mula sa ibayo ng Jordan.’
