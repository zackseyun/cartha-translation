base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: tl
  text: Kaya dinala niya ang mga tao pababa sa tubig. Sinabi ni Yahweh kay Gideon, “Ang bawat taong didila ng tubig gamit ang kaniyang dila, gaya ng aso na dumidila, ay ibukod mo siya[a]; gayundin ang bawat luluhod upang uminom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O, “ilagay mo siyang bukod.” Ang pandiwa ay maaaring mangahulugang ilagay o italaga ang isang tao nang hiwalay.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: dinala ... pababa
  rationale: 'Pinananatili nito ang causative na diwa ng Hiphil ng ירד: si Gideon ang nagdala sa mga tao pababa, hindi lamang basta bumaba kasama nila.'
- source_word: הָעָם
  choice: mga tao
  rationale: Malawak ang kolektibong kahulugan ng עם. Bagaman militar ang konteksto, hindi nililimitahan ng salitang Hebreo ang pagtukoy sa ‘mga kawal.’
- source_word: הַמָּיִם
  choice: tubig
  rationale: Bagaman anyong maramihan sa Hebreo, karaniwang mass noun ang מים at likas na isinasalin bilang ‘tubig’ sa Tagalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Ginamit ang personal na pangalang nasa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: כֹּל אֲשֶׁר יָלֹק בִּלְשׁוֹנוֹ מִן הַמַּיִם
  choice: ang bawat didila ng tubig gamit ang kaniyang dila
  rationale: Inilalarawan nang tuwiran ang kilos ng pagkuha ng tubig sa pamamagitan ng dila at pinananatili ang indibiduwal na saklaw ng ‘bawat.’
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: gaya ng pagdila ng aso
  rationale: Pinananatili ang tahasang paghahambing sa paraan ng pag-inom ng aso.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: ihiwalay mo siya
  rationale: Malinaw nitong ipinahahayag ang paglalagay sa taong iyon nang bukod sa iba, habang inilalagay sa talababa ang mas literal na alternatibo.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: gayundin ang bawat luluhod upang uminom
  rationale: Natural sa Tagalog ang ‘luluhod,’ na taglay na ang diwa ng pagluhod sa mga tuhod; ipinahihiwatig ng ‘gayundin’ na kabilang din sila sa pagbubukod na iniutos.
theological_decisions:
- issue: Pagsasalin sa banal na pangalang יְהוָה
  choice: Yahweh
  alternative: Jehovah; PANGINOON
  rationale: Pinananatili ang pangalan sa pinagmulang teksto at iniiwasang palitan ito ng titulo o ng ibang tradisyonal na anyo.
- issue: Elipsis sa utos tungkol sa mga lumuluhod upang uminom
  choice: Pinanatili ang pinaikling ikalawang pangkat sa pamamagitan ng ‘gayundin’
  alternative: Ulitin nang tahasan ang ‘ihiwalay mo rin’
  rationale: Walang inuulit na pandiwa ang tekstong Hebreo sa ikalawang pangkat. Ipinakikita ng ‘gayundin’ ang kaugnayan nito sa utos nang hindi labis na pinupunan ang elipsis.
translation_notes:
  register: Makabago at marangal na Filipino, na may tuwirang paglalarawan sa kilos at walang teknikal o denominasyonal na pananalita. Ginamit ang ‘kaniyang’ para sa malinaw at pormal ngunit madaling maunawaang pagtukoy.
