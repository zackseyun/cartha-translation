  source_fidelity: 'Tumpak ang pangunahing diwa ng draft: causative ang pagpapababa ng mga tao, pinananatili ang pangalang Yahweh, at malinaw ang dalawang pangkat batay sa paraan ng pag-inom. Gayunman, ang paghahambing na “gaya ng pagdila ng aso” ay mas natural at mas tuwirang maisasaad bilang kilos ng aso, at ang talababa tungkol sa “ihiwalay” ay dapat ikabit sa mismong salitang iyon, hindi sa “tubig.”'
  naturalness: May bahagyang kabigatan ang “Ang bawat didila ... gaya ng pagdila ng aso.” Mas likas sa modernong Filipino ang “Ang bawat taong didila ... gaya ng aso na dumidila.” Ang “ibukod mo siya” ay natural na pananalita para sa paglalagay nang hiwalay.
  terminology: Ang “Yahweh,” “Gideon,” “tubig,” at “luluhod upang uminom” ay angkop at pare-pareho sa marangal na modernong rehistro. Ang “ibukod” ay sapat na katumbas ng utos na ilagay o ipuwesto nang hiwalay; ang lexical na alternatibo ay nananatili sa talababa.
