language:
  code: tl
  name: Tagalog
  native_name: Tagalog
  variant: modern Filipino Tagalog
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶת צֵדָה֩ הָ/עָ֨ם בְּ/יָדָ֜/ם וְ/אֵ֣ת שׁוֹפְרֹֽתֵי/הֶ֗ם וְ/אֵ֨ת כָּל אִ֤ישׁ יִשְׂרָאֵל֙ שִׁלַּח֙ אִ֣ישׁ לְ/אֹֽהָלָ֔י/ו וּ/בִ/שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ הֶֽחֱזִ֑יק וּ/מַחֲנֵ֣ה מִדְיָ֔ן הָ֥יָה ל֖/וֹ מִ/תַּ֥חַת בָּ/עֵֽמֶק־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: tl
  text: Kaya kinuha nila ang mga baon ng mga tao, na hawak nila sa kanilang mga kamay, kasama ang kanilang mga tambuli[a]. Pinauwi ni Gideon ang lahat ng iba pang lalaki ng Israel, bawat isa sa kaniyang tolda, ngunit pinanatili niya ang tatlong daang lalaki. Nasa ibaba niya, sa lambak, ang kampo ng Midian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “mga sungay” o “mga sungay ng lalaking tupa”; ang salitang Hebreo ay tumutukoy sa sungay na ginagamit bilang instrumentong pansenyas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: kinuha nila
  rationale: Payak na salaysay na anyong pangnagdaan ng לקח; ang maramihang simuno ay tumutukoy sa mga piniling tauhan.
- source_word: צֵדָה
  choice: mga baon
  rationale: Tumutukoy sa pagkaing panustos o suplay na dadalhin. Ang “mga baon” ay likas sa modernong Tagalog at hindi nililimitahan sa isang uri ng pagkain.
- source_word: הָעָם
  choice: mga tao
  rationale: Pinananatili ang malawak na tawag ng Hebreo, bagaman sa konteksto ay ang mas malaking pangkat ng mga mandirigmang Israelita ang tinutukoy.
- source_word: בְּיָדָם
  choice: (ipinahihiwatig sa “kinuha”)
  rationale: Ang literal na “sa kanilang mga kamay” ay tumutukoy sa paghawak o pagdadala. Sa Tagalog, sapat at mas natural ang “kinuha nila”; hindi kailangang ulitin ang kamay maliban kung bibigyang-diin ang pisikal na paghawak.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: mga tambuli
  rationale: Ang שׁוֹפָר ay sungay na ginagamit na instrumentong pansenyas. Ang “tambuli” ang natural at marangal na katawagang Filipino para sa ganitong hinihipang instrumentong pansenyas.
- source_word: שִׁלַּח
  choice: pinauwi
  rationale: Bagaman pangunahing diwa nito ang “pinaalis” o “ipinadala,” malinaw sa kasunod na pariralang bawat isa ay patungo sa sariling tolda; likas na ipinahahayag ito ng “pinauwi.”
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: ang lahat ng iba pang mga Israelita, bawat isa sa kaniyang tolda
  rationale: Pinananatili ang distributibong “bawat isa” at ang patutunguhang sariling tolda. Idinagdag ang “iba pang” upang malinaw na hindi kasama sa pinaalis ang tatlong daang pinanatili.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: ngunit pinanatili niya ang tatlong daang lalaki
  rationale: Ang החזיק dito ay nangangahulugang patuloy na hawakan o panatilihin. Ang “ngunit” ay natural na naghahayag ng kaibahan sa pagpapauwi sa iba.
- source_word: מַחֲנֵה מִדְיָן
  choice: ang kampo ng Midian
  rationale: Tuwirang salin ng construct chain at malinaw na tumutukoy sa kampo ng kalabang puwersa.
- source_word: מִתַּחַת ... בָּעֵמֶק
  choice: nasa ibaba niya, sa lambak
  rationale: 'Pinananatili ang topograpikong ugnayan: nasa mas mababang lugar ang kampo, sa loob ng lambak.'
theological_decisions:
- issue: Tahasan bang pangalanan si Gideon bilang simuno ng isahang pandiwa?
  choice: Pinangalanan si Gideon sa “Pinauwi ni Gideon.”
  alternative: Gamitin lamang ang “pinauwi niya.”
  rationale: Hindi inuulit ng Hebreo ang pangalan sa talata, ngunit si Gideon ang malinaw na simuno mula sa konteksto. Ang pangalan ay tumutulong sa natural na Tagalog at iniiwasan ang malabong reperensiya nang walang idinadagdag na doktrina.
translation_notes:
  register: Modernong Filipino Tagalog na malinaw at marangal. Ginamit ang “tambuli” bilang likas na katawagang Filipino sa sungay na hinihipan bilang senyas; iniwasan ang sobrang literal na “sa kanilang mga kamay” dahil hindi ito likas at hindi kailangan sa Tagalog. Ang “tolda” ay karaniwang nauunawaang termino sa kontekstong militar at pangkampo.
