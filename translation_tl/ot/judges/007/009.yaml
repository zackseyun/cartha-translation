  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: tl
  text: Nang gabing iyon, sinabi sa kanya ni Yahweh, “Bumangon ka at bumaba sa kampo, sapagkat ibinigay ko na ito sa iyong kamay.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sa Hebreo, “sa iyong kamay,” isang idyoma na nangangahulugang nasa iyong kapangyarihan o pamamahala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Nang gabing iyon
  rationale: Likas na panandang pasalaysay sa modernong Tagalog na naghahatid sa bagong tagpo at malinaw na tumutukoy sa gabing iyon, nang hindi gumagamit ng makalumang pormula.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: sinabi sa kanya
  rationale: Tuwirang katumbas ng karaniwang pandiwa ng pagsasalita na אמר at pinananatili ang lalaking panghalip na tumutukoy kay Gideon.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Isinasatitik ang personal na pangalang banal sa tekstong Hebreo sa halip na palitan ito ng isang titulo.
- source_word: קוּם רֵד
  choice: Bumangon ka at bumaba
  rationale: Pinananatili ang dalawang pautos at ang agarang pagkilos; natural at marangal ang anyo sa kasalukuyang Tagalog.
- source_word: בַּמַּחֲנֶה
  choice: sa kampo
  rationale: Sa konteksto ng pandiwang 'bumaba,' likas na ipinahihiwatig ng 'sa kampo' ang pagpunta roon nang hindi dinaragdagan ang teksto ng ideyang 'salakayin.'
- source_word: כִּי
  choice: sapagkat
  rationale: Malinaw na ipinakikilala ang dahilan ng utos sa isang dignified ngunit madaling maunawaang rehistro.
- source_word: נְתַתִּיו
  choice: ibinigay ko na ito
  rationale: Ang perpektong pandiwa ay inilalarawan bilang naganap nang pagkakaloob na may kasalukuyang bisa. Pinananatili ng 'ito' ang panghalip ng Hebreo, na sa konteksto ay tumutukoy sa kampo o hukbo ng kaaway.
- source_word: בְּיָדֶךָ
  choice: sa iyong kamay
  rationale: Pinananatili ang matingkad na idyomang Hebreo para sa paglalagay sa kapangyarihan o pamamahala ng isang tao, at nililinaw ito sa talababa.
theological_decisions:
- issue: Pagsasalin sa pangalang יְהוָה
  choice: Yahweh
  alternative: PANGINOON o Jehovah
  rationale: Personal na pangalan ang tahasang nasa Hebreo; pinananatili itong Yahweh sa halip na palitan ng titulo.
- issue: Saklaw ng panghalip sa נְתַתִּיו
  choice: ito
  alternative: ang kampo o ang hukbo ng kaaway
  rationale: Pinananatili ang gramatikal na panghalip at ang bahagyang metonimikong kalabuan ng orihinal sa halip na tahasang tukuyin kung kampo o mga kaaway ang ipinagkaloob.
- issue: Diwa ng perpektong נְתַתִּיו
  choice: ibinigay ko na
  alternative: ibibigay ko
  rationale: Inilalahad ng Hebreo ang pagkakaloob bilang tiyak o naganap na mula sa pananaw ng Diyos; hindi ito ginawang payak na panghinaharap.
translation_notes:
  register: Modernong Filipino Tagalog na natural, malinaw, at marangal. Iniwasan ang makalumang “At nangyari” bilang pambungad, ngunit pinanatili ang daloy ng bagong tagpo sa “Nang gabing iyon.” Ang mga utos ay tuwiran at madaling maunawaan, at ang idyomang “sa iyong kamay” ay pinanatili kasama ng paliwanag sa talababa.
