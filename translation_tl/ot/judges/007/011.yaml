  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: tl
  text: “At maririnig mo ang sinasabi nila. Pagkatapos, lalakas ang iyong mga kamay,[a] at bababa ka sa kampo.” Kaya bumaba siya kasama ni Pura na kanyang lingkod[b] sa gilid ng mga armadong kawal[c] na nasa kampo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ang “lalakas ang iyong mga kamay” ay isang larawang nangangahulugang magkakaroon ka ng tapang at matatag na pasiya.
    reason: idiom_explanation
  - marker: b
    text: Sa literal, “kanyang binata”; maaari ring isaling “kanyang tauhan” o “kanyang tagapaglingkod.”
    reason: lexical_alternative
  - marker: c
    text: Maaari ring isaling “sa panlabas na bahagi ng pangkat ng mga kawal na handa sa labanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: At maririnig mo ang sinasabi nila
  rationale: Ipinahahayag ng magkakasunod na anyong pandiwa ang mangyayari, at likas sa Tagalog ang “maririnig mo ang sinasabi nila” para sa pagkarinig sa kanilang usapan.
- source_word: וְאַחַר
  choice: Pagkatapos
  rationale: Malinaw at natural na panandang temporal na pinananatili ang pagkakasunod ng pagkarinig at pagkakaroon ng lakas.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: lalakas ang iyong mga kamay
  rationale: Pinananatili ang konkretong larawang Hebreo tungkol sa mga kamay, na tumutukoy sa pagkakaroon ng tapang at matatag na pasiya; nililinaw ito sa talababa.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: at bababa ka sa kampo
  rationale: Pinananatili ang literal na kilos na “bumaba” at ang direksiyon patungo sa kampo nang hindi ipinapasok sa pangunahing teksto ang mas tiyak na diwang “lulusob.”
- source_word: וַיֵּרֶד הוּא
  choice: Kaya bumaba siya
  rationale: Ang “kaya” ay natural na nag-uugnay sa pagsunod ni Gideon sa naunang tagubilin habang isinusulong ang salaysay.
- source_word: וּפֻרָה
  choice: Pura
  rationale: Isina-Tagalog ang baybay ng pangalang pantangi ayon sa karaniwang ponolohiya.
- source_word: נַעֲרוֹ
  choice: kanyang lingkod
  rationale: Sa kontekstong militar, ang נַעַר ay maaaring tumukoy sa isang batang tauhan, lingkod, o tagapaglingkod; ang “lingkod” ang pinakanatural dito, habang inilalahad sa talababa ang literal at ibang maaaring kahulugan.
- source_word: אֶל קְצֵה
  choice: hanggang sa gilid ng
  rationale: Ang קצה ay tumutukoy sa dulo o gilid. Ang “hanggang sa gilid” ay malinaw na nagpapakita na lumapit sila sa panlabas na bahagi ng pangkat.
- source_word: הַחֲמֻשִׁים
  choice: mga lalaking nasasandatahan
  rationale: Ang termino ay tumutukoy sa mga taong nakahanda o nasangkapan para sa labanan, kaya ang “nasasandatahan” ay tumpak at natural.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: na nasa kampo
  rationale: Payak at malinaw na isinasalin ang sugnay na nagtatakda kung aling mga lalaking nasasandatahan ang tinutukoy.
theological_decisions:
- issue: Larawan ng pinalakas na mga kamay
  choice: Pinanatili ang “lalakas ang iyong mga kamay” at ipinaliwanag sa talababa ang idyomatikong diwa.
  alternative: “lalakas ang iyong loob” o “magkakaroon ka ng lakas ng loob”
  rationale: Ang alternatibo ay mas karaniwang Tagalog ngunit inaalis ang sadyang larawang pisikal ng tekstong Hebreo. Ang piniling anyo ay nagpapanatili sa larawan nang hindi ikinukubli ang kahulugan nito.
- issue: Direksiyon ng pagbaba sa kampo
  choice: “bababa ka sa kampo”
  alternative: “lulusob ka sa kampo” o “bababa ka laban sa kampo”
  rationale: Maaaring ipahiwatig ng konteksto ang pagsalakay, ngunit hindi kailangang ipasok iyon sa pandiwa mismo. Pinananatili ng salin ang tunay na lawak ng kahulugan.
translation_notes:
  register: Makabago, malinaw, at marangal na Filipino. Pinanatili ang Hebreong larawan ng malalakas na kamay at ang literal na kilos na pagbaba, habang gumamit ng karaniwang salitang “lingkod” at “nasasandatahan” para madaling maunawaan ng pangkalahatang mambabasa.
