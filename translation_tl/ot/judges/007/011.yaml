- from: “At maririnig mo ang sinasabi nila. Pagkatapos, lalakas ang iyong mga kamay,[a] at bababa ka sa kampo.” Kaya bumaba siya kasama ni Pura na kanyang lingkod[b] hanggang sa gilid ng mga lalaking nasasandatahan[c] na nasa kampo.
  to: “At maririnig mo ang sinasabi nila. Pagkatapos, lalakas ang iyong mga kamay,[a] at bababa ka sa kampo.” Kaya bumaba siya kasama ni Pura na kanyang lingkod[b] sa gilid ng mga armadong kawal[c] na nasa kampo.
  rationale: Pinalitan ang di-natural at aspekto-ring malabong “mga lalaking nasasandatahan” ng “mga armadong kawal.” Walang binagong kahulugan sa kilos, tauhan, o idyomang Hebreo; inangkop lamang ang talababa upang malinaw nitong maipakita ang alternatibong saklaw ng “gilid.”
